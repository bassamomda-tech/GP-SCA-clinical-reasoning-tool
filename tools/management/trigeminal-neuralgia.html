<meta name="description" content="Trigeminal neuralgia: the one neuropathic pain CG173 treats differently, with carbamazepine first-line rather than the usual four agents. Recognition, MRI as part of the early work-up for everyone (urgent with red flags), carbamazepine titration, monitoring, contraception and enzyme induction, trigger avoidance, and distress and suicidal ideation in severe disease." />

<script>
MG.render({
  icon:"⚡",
  title:"Trigeminal neuralgia — the complete guide",
  eyebrow:"Protocol · NICE CG173 · the neuropathic pain treated differently",
  stemTitle:"This is the one neuropathic pain CG173 singles out — carbamazepine first-line, not the usual four agents — and the pain can be severe enough to stop someone eating and to cause suicidal ideation",
  stemSub:"One page for the whole condition. Recognise the characteristic paroxysmal facial pain and its trigger zones; arrange <b>MRI as part of the early work-up for everyone</b> — no clinical feature reliably excludes multiple sclerosis or a posterior-fossa lesion — and expedite it with red flags; start <b>carbamazepine</b> with the monitoring and enzyme-induction counselling it demands; protect nutrition and mental health, because <b>severe, uncontrolled trigeminal neuralgia can cause profound distress and suicidal ideation</b>; and refer severe, refractory, intolerant and atypical cases early for specialist assessment and, where appropriate, surgical options.",
  guideline:"NICE CG173 (2013, updated 2020) · NICE NG127 · BNF · EAN trigeminal neuralgia guideline (2019, international)",
  reviewed:"14 September 2026",
  nextReview:"14 March 2027",
  meta:[
    {t:"NICE CG173 — trigeminal neuralgia"},
    {t:"Carbamazepine first-line — not the CG173 four", tone:"tw"},
    {t:"MRI early for all · urgent with neurological signs", tone:"tw"},
    {t:"Rash → stop and seek urgent assessment", tone:"tw"},
    {t:"v2.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#recognise"><b>Recognise</b><small>MRI for all · red flags urgent</small></a><a href="#nondrug"><b>Triggers</b><small>Nutrition · mood</small></a><a href="#drug"><b>Carbamazepine</b><small>Monitoring</small></a><a href="#follow"><b>Titrate</b><small>Lowest dose</small></a><a href="#refer"><b>Refer</b><small>MVD · procedures</small></a></div>',
  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"blue", h:"Carbamazepine is first-line — this condition is the CG173 exception", html:"Trigeminal neuralgia is the one neuropathic-pain condition CG173 treats differently: carbamazepine first-line, not the usual amitriptyline, duloxetine, gabapentin or pregabalin ladder. Offer carbamazepine as initial treatment while arranging diagnostic work-up and referral: start 100 mg once or twice daily, increase gradually according to response and tolerability with early review, and titrate to the lowest effective dose, aiming to reduce during remissions. Many respond at around 200 mg three or four times daily; do not keep escalating without specialist advice (check the maximum against the current SPC — local Greater Manchester guidance gives 1,600 mg daily). Severe pain, major functional impairment or nutritional compromise are themselves reasons for early specialist advice."},
    {tone:"red", h:"⚠ Rash means stop and seek urgent assessment", html:"Advise the patient to stop carbamazepine and seek urgent medical assessment at the first sign of a rash, mucosal lesion, blistering, facial oedema, fever or systemic illness, unless a clinician has clearly established that the rash is unrelated. Suspected SJS/TEN requires emergency assessment; do not restart after a suspected serious cutaneous reaction. Consider pre-treatment HLA-B*15:02 testing in people with relevant South-East Asian ancestry, particularly Han Chinese or Thai. And warn every patient: fever, sore throat, mouth ulcers, unusual bruising or bleeding means withhold carbamazepine and get an urgent FBC — possible bone-marrow suppression."},
    {tone:"amber", h:"MRI for everyone — urgently with red flags", html:"No clinical feature reliably excludes secondary trigeminal neuralgia, so arrange or refer for MRI as part of the early work-up, ideally using a protocol suitable for posterior-fossa and trigeminal-nerve pathology (EAN). NICE NG127: urgent neuroimaging for facial pain with persistent numbness or abnormal neurological signs. Sensory deficit, facial weakness, hearing loss, age under 40, bilateral pain, other cranial-nerve signs or a history of optic neuritis suggest a secondary cause — multiple sclerosis or a tumour — and expedite imaging and specialist assessment. A normal examination does not exclude secondary disease."},
    {tone:"red", h:"⚠ Ask about suicidal ideation in severe disease", html:"Severe, uncontrolled trigeminal neuralgia can cause profound distress, depression, nutritional compromise and suicidal ideation. Ask directly about thoughts of self-harm when pain is severe or function is deteriorating. Active suicidal intent requires same-day mental-health assessment; do not leave the patient unsupported while arranging treatment. Treat it as a reason to EXPEDITE pain control and specialist referral."},
    {tone:"green", h:"Trigger avoidance genuinely reduces attacks", html:"Identify and avoid the cutaneous trigger zones: cold wind (a scarf helps), chewing, talking, shaving, tooth-brushing and light touch. Protect nutrition during flares with a soft or liquid diet and lukewarm food — weight loss and dehydration from pain on eating are real risks, not theoretical ones. Assess hydration and weight, and arrange urgent assessment if she cannot maintain oral intake."},
    {tone:"amber", h:"Carbamazepine is a potent enzyme inducer — check the co-prescriptions", html:"It reduces the effectiveness of most hormonal contraceptives — combined pill, progestogen-only pill, implant and some emergency hormonal contraception. Before prescribing, ask about pregnancy intention and contraception, and discuss a non-enzyme-dependent method (copper IUD, levonorgestrel IUD, or depot medroxyprogesterone acetate where appropriate) with reference to current FSRH guidance. Carbamazepine is associated with fetal risk: seek specialist advice before conception, and in pregnancy do not stop it abruptly — arrange urgent specialist review. DOACs are generally avoided; warfarin needs closer INR monitoring; lamotrigine effect may be reduced. Review every co-prescription at initiation and at each dose change using the SPC."}
  ],
  pathwaySub:"Five steps, and the red-flag screen decides whether this is primary or secondary.",
  pathway:[
    {title:"Recognise it, and screen for a secondary cause", html:"Paroxysmal electric-shock pain in one or more trigeminal divisions (usually V2/V3), unilateral, triggered by innocuous stimuli, with pain-free intervals. <b>MRI as part of the early work-up for all; urgent imaging with persistent numbness or neurological signs.</b>", alert:true},
    {title:"Put the non-drug measures alongside", html:"Trigger avoidance, nutrition protection, oral care adaptations, and a direct question about mood."},
    {title:"Start carbamazepine with its monitoring", html:"FBC, U&amp;Es including sodium, and LFTs at baseline; check pregnancy intention, contraception and interactions; counsel on rash, marrow, dizziness and driving, and enzyme induction."},
    {title:"Titrate to the lowest effective dose", html:"Titrate slowly with early review; reduce during remissions. Do not continue escalating without specialist advice — refer early if not tolerated, ineffective or contraindicated."},
    {title:"Refer the severe, refractory, atypical and red-flag cases", html:"Neurology or a cranial-facial pain service for MRI review and specialist treatment, including severe pain, nutritional compromise and intolerance; neurosurgical options (microvascular decompression, ablative procedures) follow specialist assessment."}
  ],
  sections:[

    {id:"recognise", nav:"Recognise", title:"Step 1 — recognition and the red-flag screen",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>The hallmark</b>","Brief, paroxysmal, electric-shock or stabbing pain in one or more trigeminal distributions — usually V2/V3, but V1 involvement can occur and does not itself exclude trigeminal neuralgia (orbital or visual symptoms need appropriate assessment); unilateral; triggered by innocuous stimuli such as touch, chewing, talking, cold wind or brushing teeth; with refractory periods and pain-free intervals between paroxysms. Continuous background pain, burning, allodynia or persistent sensory disturbance suggests a different or additional neuropathic facial-pain syndrome"],
         ["<b>MRI for everyone</b>","Arrange or refer for MRI as part of the early work-up for trigeminal neuralgia, ideally using a protocol suitable for posterior-fossa and trigeminal-nerve pathology (EAN) — clinical features cannot reliably exclude secondary disease. Where MRI is contraindicated or unavailable, consider specialist neurological assessment and alternative imaging/neurophysiological assessment"],
         ["<b>Red flags — expedite (EAN/international specialist guidance)</b>","Persistent or progressive facial sensory loss, facial weakness, abnormal cranial-nerve findings, hearing loss or other ear symptoms, bilateral symptoms, age of onset under 40, optic neuritis or other demyelinating symptoms, atypical continuous background pain, poor or absent response to appropriate treatment, history of malignancy or relevant skin/oral lesion → suggest a secondary cause (MS, tumour). NICE NG127: urgent neuroimaging for persistent numbness or abnormal neurological signs. A normal examination does not exclude secondary trigeminal neuralgia"],
         ["<b>Differentials</b>","Dental pain, temporomandibular disorder, post-herpetic neuralgia, persistent idiopathic facial pain, cluster headache or other trigeminal autonomic cephalalgias, giant cell arteritis where clinically appropriate, sinus or orbital disease, malignancy/perineural spread"],
         ["<b>Assess</b>","Impact on eating, hydration, weight loss, dental avoidance, and mood — including thoughts of self-harm when pain is severe — plus examination of the cranial nerves. Ask about sensory loss, facial weakness, hearing or ear symptoms, bilateral or visual symptoms, prior optic neuritis, age at onset, continuous background pain, and dental and temporomandibular symptoms"]
       ]},
       {b:"why", html:"Trigeminal neuralgia is the one neuropathic-pain condition CG173 treats differently — carbamazepine first-line, not the usual four agents. Because no clinical feature reliably excludes MS or a posterior-fossa lesion, MRI is part of the early work-up for everyone; red flags (sensory loss, young age, bilateral pain) make it urgent. A secondary cause changes the whole management rather than just the drug."}
     ]},

    {id:"nondrug", nav:"Triggers", title:"Step 2 — trigger avoidance and supportive care",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"❄️ Avoid triggers", html:"Identify and avoid cutaneous trigger zones — cold wind (a scarf), chewing, talking, shaving, tooth-brushing, light touch. Small adaptations genuinely reduce attack frequency."},
         {tone:"amber", h:"🍲 Protect nutrition", html:"During flares, a soft or liquid diet and lukewarm food help maintain intake — weight loss and dehydration from pain on eating are real risks. Assess hydration and weight; arrange urgent assessment if she cannot maintain oral intake, and consider dietetic or hospital support in severe flares."},
         {tone:"blue", h:"🦷 Oral care", html:"Maintain dental hygiene with adaptations (lukewarm water, a soft brush), and ensure dental causes have been excluded. Check for dental avoidance or untreated dental disease."},
         {tone:"red", h:"🧠 Mood and support", html:"Severe, uncontrolled trigeminal neuralgia can cause profound distress, depression and suicidal ideation. Ask directly about thoughts of self-harm when pain is severe or function is deteriorating. Active suicidal intent requires same-day mental-health assessment; do not leave the patient unsupported while arranging treatment. Pain severity is itself a NICE reason to consider specialist referral at any stage."}
       ]},
       {b:"why", html:"Trigeminal neuralgia is primarily treated with medication, but identifying and avoiding cutaneous trigger zones genuinely reduces attacks — and protecting nutrition and mental health matters because the pain can be severe enough to stop someone eating and to cause profound distress and suicidal ideation."}
     ]},

    {id:"drug", nav:"Carbamazepine", title:"Step 3 — carbamazepine: dosing and the monitoring it demands",
     blocks:[
       {b:"table", head:["Risk","Monitoring","When"], rows:[
         ["<b>Bone-marrow suppression</b>","FBC — baseline, after titration, then per the current SPC/local monitoring policy. Stop or withhold carbamazepine and arrange an urgent FBC for fever, sore throat, mouth ulcers, unusual bruising, bleeding or other features of marrow suppression; urgent specialist or hospital assessment if neutropenia, thrombocytopenia or pancytopenia is suspected. A normal FBC does not exclude all serious carbamazepine reactions","<b>Baseline, after titration, and if symptomatic</b>"],
         ["<b>Hyponatraemia (SIADH)</b>","U&amp;Es and sodium — especially in the elderly, on diuretics, or if drowsy or confused","<b>Baseline, after titration, then per SPC/local policy; earlier if symptoms suggest toxicity</b>"],
         ["<b>Hepatotoxicity</b>","<b>LFTs — baseline and if symptomatic</b>","<b>Baseline, after titration, then per SPC/local policy</b>"],
         ["<b>Serious skin reaction (SJS/TEN)</b>","Stop and seek urgent assessment at the first sign of rash, mucosal lesion or ulceration, blistering, facial oedema, fever, lymphadenopathy, eosinophilia/systemic drug reaction or hepatic involvement, unless a clinician has clearly established the rash is unrelated; suspected SJS/TEN → emergency assessment; do not restart after a suspected serious cutaneous reaction. Consider pre-treatment HLA-B*15:02 testing in people with relevant South-East Asian ancestry, particularly Han Chinese or Thai, in line with current UK/local policy; avoid if positive unless a specialist determines otherwise. A negative result does not remove the need for rash counselling","<b>Counsel at the start</b>"],
         ["<b>Enzyme induction (interactions)</b>","Hormonal contraception is the major practical concern and must be addressed before prescribing. DOACs are generally avoided or need specialist alternatives (reduced anticoagulant exposure); warfarin needs closer INR monitoring and dose adjustment; lamotrigine levels/effect may be reduced (specialist advice). Also review some antiretrovirals, direct-acting antivirals, ciclosporin/tacrolimus, corticosteroids, antidepressants and antipsychotics, other antiepileptics and some oncology treatments — not every interaction is an absolute contraindication; use the SPC and specialist pharmacy/FSRH guidance","<b>At initiation and at each change</b>"],
         ["<b>Pregnancy and contraception</b>","Ask about pregnancy intention and contraception before prescribing. Carbamazepine reduces the effectiveness of most hormonal contraceptives — do not assume a combined pill or implant is reliable; discuss a non-enzyme-dependent method (copper IUD, levonorgestrel IUD, depot medroxyprogesterone acetate where appropriate), ideally with sexual and reproductive healthcare advice. It is associated with fetal risk: specialist advice before conception where possible; if pregnancy occurs, do not stop abruptly and arrange urgent specialist review; follow MHRA antiepileptic pregnancy safety advice, including folic acid","<b>Before starting</b>"],
         ["<b>Baseline review and counselling</b>","Renal and hepatic function, medication and interaction review, alcohol and other CNS depressants; counsel about dizziness, diplopia, ataxia and impaired driving. Slow titration reduces dizziness, diplopia, ataxia, nausea, sedation and hyponatraemia","<b>Before starting</b>"],
         ["<b>Plasma levels</b>","Not usually required routinely for trigeminal neuralgia; may be useful with suspected toxicity, non-adherence, pregnancy, interacting medication or loss of control","<b>If indicated</b>"]
       ]},
       {b:"warn", html:"Carbamazepine is a potent enzyme inducer and a marrow- and skin-risk drug. Warn every patient: any rash, mucosal lesion or blistering means stop and seek urgent assessment; a sore throat, mouth ulcers, fever, bruising or bleeding means withhold the drug and get an urgent FBC. <b>Ask about pregnancy intention and check contraceptive cover before prescribing.</b>"}
     ]},

    {id:"follow", nav:"Titrate", title:"Steps 4–5 — titration and review",
     blocks:[
       {b:"dl", rows:[
         ["<b>From the start</b>","Start carbamazepine 100 mg once or twice daily, increase gradually according to response and tolerability, review early during titration, and titrate to the lowest effective dose — many respond around 200 mg three or four times daily. Do not continue escalating without specialist advice; check the maximum daily dose against the current SPC (local Greater Manchester guidance: 1,600 mg daily). Check FBC, U&amp;Es including sodium, and LFTs before starting, repeat after titration and then per the SPC/local monitoring policy. <b>Aim to reduce the dose during remissions</b> rather than continuing indefinitely at the dose that settled a flare"],
         ["<b>If not tolerated, ineffective or contraindicated</b>","Early specialist referral rather than prolonged serial drug trials in primary care. Specialist-guided options: oxcarbazepine, lamotrigine, gabapentin or baclofen"],
         ["<b>Red flags or refractory pain</b>","Refer urgently or early for sensory deficit or abnormal neurological signs; young-onset, bilateral or atypical disease; severe pain or major functional impairment; poor response or intolerance to carbamazepine; nutritional compromise; suspected secondary trigeminal neuralgia; or consideration of surgery"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 Stop the drug and be seen", html:"\"Any rash, blistering, mouth sores or facial swelling, or a sore throat, mouth ulcers, fever, unusual bruising or bleeding — stop the carbamazepine and contact us the same day for urgent assessment and a blood count. Also contact us urgently for severe dizziness, unsteadiness, double vision, confusion or marked drowsiness. Do not drive if you feel dizzy or have double vision.\""},
         {tone:"red", h:"🧠 If you cannot go on", html:"\"This pain can be severe enough to make people feel they cannot carry on. If you ever feel that way, tell us the same day — it is a reason for us to act faster, not something to hide.\""},
         {tone:"amber", h:"🍲 Not eating or drinking", html:"\"If the pain stops you eating or drinking, contact us — we can adjust things rather than letting you lose weight.\""},
         {tone:"blue", h:"💊 Contraception", html:"\"This tablet can stop most hormonal contraception working, including the pill and the implant — we need to review what you are using before you start it. It can also affect a developing baby, so if you are planning a pregnancy we will get specialist advice first, and if you become pregnant do not stop it suddenly — contact us urgently.\""}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"Neurology / MRI — urgent for red flags", html:"MRI is recommended as part of the early work-up for all trigeminal neuralgia. Urgent neuroimaging for persistent facial numbness, facial weakness or abnormal neurological signs (NICE NG127). Expedite neurology for age under 40, bilateral disease, sensory loss, hearing symptoms, optic neuritis, atypical pain or poor treatment response (EAN) — to exclude MS or a posterior-fossa lesion."},
         {tone:"blue", h:"Neurology — refractory or intolerant", html:"Pain not controlled on carbamazepine, the drug not tolerated or contraindicated, severe pain, major functional impairment or nutritional compromise → early specialist referral, not prolonged serial drug trials; specialist-guided alternatives (oxcarbazepine, lamotrigine, gabapentin, baclofen)."},
         {tone:"blue", h:"Neurosurgery — a specialist decision", html:"For pain insufficiently controlled medically or medication poorly tolerated (EAN). Microvascular decompression is particularly relevant when MRI shows neurovascular compression with morphological nerve changes; neuroablative or radiosurgical procedures may be considered where MVD is unsuitable or no useful compression is shown. The choice depends on age, comorbidity, imaging, pain phenotype and patient preference — refer via neurology/cranial-facial pain assessment rather than directly from primary care."},
         {tone:"amber", h:"Same-day", html:"Suspected marrow suppression or a serious skin reaction on carbamazepine (suspected SJS/TEN → emergency assessment); active suicidal intent → same-day mental-health assessment; inability to eat or drink."},
         {tone:"cream", h:"GP management", html:"Recognition, the red-flag screen, arranging MRI/neurology work-up, carbamazepine initiation and monitoring, pregnancy and contraception counselling, enzyme-induction review, trigger avoidance, nutrition and mood all belong here. Related pages: <a href='neuropathic-pain.html'>neuropathic pain</a> · <a href='post-herpetic-neuralgia.html'>post-herpetic neuralgia</a> · <a href='giant-cell-arteritis.html'>giant cell arteritis</a> · <a href='contraception.html'>contraception</a> · <a href='chronic-pain.html'>chronic pain</a>."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 34-year-old woman describes <b>severe stabbing pains in the right cheek and jaw</b>, lasting seconds, triggered by <b>brushing her teeth and cold air</b>, for six weeks. She has <b>lost 4 kg</b> because eating sets it off, and says quietly that she \"couldn't cope with this forever\". She had an episode of <b>blurred vision in one eye two years ago</b> that resolved. She takes the <b>combined pill</b>."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"<b>Recognises the classic paroxysmal trigger-zone pain</b>, but does not stop at the diagnosis: age under 40 plus a previous episode of monocular visual loss are red flags for MS, so MRI and neurology referral are needed — this is the highest-value action in the case; responds to \"couldn't cope with this forever\" directly and asks about suicidal ideation rather than letting it pass, and treats it as a reason to expedite control; <b>addresses the 4 kg weight loss with practical nutrition advice</b> (soft, lukewarm food) rather than only prescribing; <b>starts carbamazepine 100 mg with baseline FBC, U&amp;Es and LFTs</b>, and counsels that any rash, sore throat, mouth ulcers, fever or bruising means stop and same-day review; identifies the enzyme-induction interaction with her combined pill, asks about pregnancy intention, and arranges a non-enzyme-dependent method (such as a copper or levonorgestrel IUD) before she starts; and safety-nets all three — the drug reaction, the mood, and the inability to eat."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE CG173 \u2014 Neuropathic pain in adults: pharmacological management in non-specialist settings</b><br><a href="https://www.nice.org.uk/guidance/cg173" rel="noopener">nice.org.uk/guidance/cg173</a><span class="rd"> — carbamazepine as the initial treatment for trigeminal neuralgia (unlike other neuropathic pain), and seeking expert advice with early referral if it is ineffective, not tolerated or contraindicated; severe pain as a reason for referral at any stage; following MHRA safety advice on antiepileptic medicines in pregnancy</span></li>'+
         '<li><b>NICE NG127 — Suspected neurological conditions: recognition and referral</b><br><a href="https://www.nice.org.uk/guidance/ng127" rel="noopener">nice.org.uk/guidance/ng127</a><span class="rd"> — urgent neuroimaging for facial pain with persistent numbness or abnormal neurological signs</span></li>'+
         '<li><b>BNF — carbamazepine: trigeminal neuralgia</b><br><a href="https://bnf.nice.org.uk/drugs/carbamazepine/" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — starting dose 100 mg once or twice daily, increased gradually according to response, and the FBC, hepatic and renal monitoring; check the maximum daily dose and monitoring intervals against the current SPC and local Greater Manchester guidance (1,600 mg daily maximum)</span></li>'+
         '<li>Bendtsen L et al. — European Academy of Neurology guideline on trigeminal neuralgia. Eur J Neurol 2019;26:831–49 (international)<br><a href="https://pubmed.ncbi.nlm.nih.gov/30860637/" rel="noopener">pubmed 30860637</a><span class="rd"> — the diagnostic features, features suggesting secondary trigeminal neuralgia (sensory deficit, bilateral pain, younger age), MRI as part of the early work-up in all patients, the additional red flags listed on this page, the second-line options (oxcarbazepine, lamotrigine, gabapentin, baclofen), and neurosurgical options including microvascular decompression</span></li>'+
         '<li><b>MHRA Drug Safety Updates and the BNF — carbamazepine</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — blood, hepatic and skin disorder warnings with stop-and-urgent-assessment advice for rash, HLA-B*15:02 testing in relevant South-East Asian (particularly Han Chinese and Thai) ancestry, hyponatraemia and SIADH, and the enzyme-induction interactions including hormonal contraception, DOACs, warfarin and lamotrigine</span></li>'+
         '<li>Faculty of Sexual and Reproductive Healthcare — drug interactions with hormonal contraception<br><a href="https://www.fsrh.org" rel="noopener">fsrh.org</a><span class="rd"> — the enzyme-inducer guidance underlying the contraceptive-cover review</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Trigeminal neuralgia — NICE CG173, the BNF and the EAN guideline (2019, international). This is the one neuropathic pain treated differently: carbamazepine 100 mg once or twice daily first-line, titrated to the lowest effective dose and reduced during remissions, rather than the usual CG173 four agents. MRI is part of the early work-up for everyone; red flags — sensory deficit, hearing loss, age under 40, bilateral pain, cranial-nerve signs or previous optic neuritis — make imaging and specialist assessment urgent to exclude MS or a posterior-fossa lesion. Stop carbamazepine and seek urgent assessment for any rash, and warn about sore throat, mouth ulcers, fever, bruising and bleeding. It is a potent enzyme inducer: ask about pregnancy intention and check contraceptive cover. Ask directly about suicidal ideation in severe disease. Verify doses and monitoring against the current SPC and local policy before prescribing."
});
</script>
