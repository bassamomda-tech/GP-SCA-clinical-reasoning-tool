  stemSub:"One page for the whole condition. Confirm and stage against the patient's own baseline creatinine, screen for hyperkalaemia and overload first, work pre-renal / intrinsic / post-renal to a cause, stop NSAIDs and avoidable nephrotoxins and review other medicines individually, give individualised sick-day advice to selected patients, and review at 3 months because AKI is a CKD risk marker, not an isolated event.",

  ],
  lead:'<div class="mg-layers"><a href="#confirm"><b>Stage it</b><small>KDIGO vs baseline</small></a><a href="#severe"><b>The killers</b><small>K\u207a \u00b7 overload \u00b7 uraemia</small></a><a href="#cause"><b>Find the cause</b><small>Pre \u00b7 intrinsic \u00b7 post</small></a><a href="#refer"><b>Refer</b><small>Who can stay at home</small></a></div>',
  quickSub:"If you read nothing else on this page, read these six cards. Every number traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"\u26a0 Potassium and the ECG come first", html:"<b>K\u207a \u22656.5 mmol/L, or hyperkalaemic ECG changes at any K\u207a \u2192 999 (UKKA 2023).</b> K\u207a 6.0\u20136.4 with AKI or acute illness \u2192 <b>same-day hospital assessment</b>; 5.5\u20135.9 \u2192 consider pseudohyperkalaemia (haemolysis, difficult draw, high platelets/WCC), review medicines, repeat. Emergency treatment follows the local/UKKA hospital protocol."},
    {tone:"red", h:"Review the drug chart before anything else", html:"Stop NSAIDs and avoidable nephrotoxins. Review ACEi/ARB, diuretics and other medicines individually against indication, perfusion, potassium and fluid status \u2014 stopping can also harm (e.g. heart failure) \u2014 and <b>document the restart plan</b>. The <b>\u201ctriple whammy\u201d (NSAID + ACEi/ARB + diuretic)</b> is a preventable cause."},
    {tone:"amber", h:"Stage against their own baseline", html:"NICE: creatinine rise \u226526 \u00b5mol/L within 48 hours, or \u226550% within 7 days, or urine output &lt;0.5 mL/kg/h for &gt;6 hours. Stage 1: 1.5\u20131.9\u00d7. Stage 2: 2.0\u20132.9\u00d7. Stage 3: \u22653\u00d7, or \u2265354 \u00b5mol/L <b>with an acute rise</b>, or RRT. Use the best available reference creatinine; if uncertain, document it and manage to the highest plausible stage \u2014 <b>stage on creatinine, not eGFR</b>."},
    {tone:"blue", h:"Three categories, three actions", html:"<b>Pre-renal</b> \u2014 restore perfusion. <b>Intrinsic</b> \u2014 remove the insult; blood + protein on dipstick raises concern for glomerulonephritis \u2192 urgent nephrology. <b>Post-renal</b> \u2014 relieve obstruction; <b>USS within 24 h if the cause is unclear or obstruction possible, within 6 h if pyonephrosis suspected</b>. Causes are often multifactorial."},
    {tone:"amber", h:"Very few AKI patients stay at home", html:"Community management is a clinical decision, usually stage 1: well, clear reversible cause, able to drink, no significant oliguria, K\u207a not significantly raised, no major comorbidity or intrinsic features \u2014 with <b>U&amp;E rechecked, often within 24\u201348 hours</b>. <b>Stage 2\u20133 usually needs same-day hospital assessment; NG148 asks for nephrology discussion within 24 hours for stage 3.</b>"},
    {tone:"green", h:"AKI is a risk marker, not an event", html:"AKI survivors carry a higher risk of CKD, cardiovascular events and death, and many are never formally reviewed. <b>NICE QS76 requires a structured review within 3 months</b> \u2014 that review is the GP's job."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step is where patients come to harm.",
  pathway:[
    {title:"Confirm it is AKI, not CKD", html:"<b>Find the best reference creatinine</b> from old results; if none is reliable, use history and serial results, document the uncertainty and manage to the highest plausible stage. The <b>NHS Spine AKI algorithm</b> generates automatic GP alerts; check flagged lab results."},
    {title:"Screen the killers", html:"K\u207a \u22656.5 or ECG changes \u00b7 pulmonary oedema or severe hypoxia \u00b7 severe acidosis with instability \u00b7 anuria with deterioration \u00b7 pyonephrosis with systemic illness \u00b7 uraemic encephalopathy or pericardial rub \u00b7 shock \u2192 999. Stage 3 alone with stable observations \u2192 immediate same-day hospital assessment.", alert:true},
    {title:"Assess volume status", html:"This decides whether you give fluids or withhold them. A postural drop <b>supports</b> volume depletion but is interpreted with pulse, mucosae, JVP, weight and urine output; raised JVP with crackles means overload \u2014 <b>giving fluid to an overloaded patient causes pulmonary oedema</b>."},
    {title:"Stop, support, investigate", html:"Stop nephrotoxins and review the sick-day drugs individually; oral rehydration if hypovolaemic and safe; treat sepsis; catheterise if obstructed; U&amp;E, FBC, dipstick, and <b>USS within 24 h if cause unclear or obstruction possible (6 h if pyonephrosis)</b>."},
    {title:"Recheck and prevent the next one", html:"<b>U&amp;E by severity, often within 24\u201348 hours</b>, then until recovered. <b>Individualised sick-day advice</b> for selected patients. Recheck before restarting held drugs. <b>Full review at 3 months</b> \u2014 U&amp;E, ACR, BP \u2014 diagnose CKD only if chronicity is shown."}
  ],
  sections:[

    {id:"confirm", nav:"Confirm &amp; stage", title:"Confirming AKI and staging it", sub:"Find the best available reference creatinine — staging is still possible when the baseline is uncertain.",
     blocks:[
       {b:"table", head:["Stage","Criteria","Concern level"], rows:[
         ["<b>AKI definition</b> (NICE NG148)","Creatinine rise \u226526 \u00b5mol/L within 48 hours (KDIGO 26.5), <b>or \u226550% within 7 days</b>, <b>or urine output &lt;0.5 mL/kg/h for &gt;6 hours</b>","Any one criterion is sufficient"],
         ["<b>Stage 1</b>","Creatinine <b>1.5\u20131.9\u00d7 baseline</b>, or a rise \u226526 \u00b5mol/L (KDIGO states \u226526.5 \u00b5mol/L) within 48 hours. Urine output <b>&lt;0.5 mL/kg/h for 6\u201312 hours</b>","Moderate concern \u2014 may sometimes be managed in the community (clinical decision)"],
         ["<b>Stage 2</b>","Creatinine <b>2.0\u20132.9\u00d7 baseline</b>. Urine output <b>&lt;0.5 mL/kg/h for \u226512 hours</b>","High concern \u2014 <b>usually same-day hospital assessment</b>"],
         ["<b>Stage 3</b>","Creatinine <b>\u22653\u00d7 baseline</b>, <b>or \u2265354 \u00b5mol/L with an acute rise meeting AKI criteria</b> (a stable 354 in CKD is not stage 3), or renal replacement therapy. Urine output <b>&lt;0.3 mL/kg/h for \u226524 hours or anuria \u226512 hours</b>","<b>Immediate assessment</b> (review within 6 h, QS76) \u2014 same-day hospital; 999 if physiologically unstable. Stage by the highest of creatinine or urine output"]
       ]},
       {b:"dl", rows:[
         ["<b>Baseline creatinine</b>","Use the most appropriate reference: a recent stable pre-illness value, or a representative stable value from the previous 7–365 days interpreted in context; if none, use history and serial results. <b>Do not estimate baseline from eGFR.</b> If uncertain, document it and manage to the highest plausible stage"],
         ["<b>The eGFR caveat</b>","<b>eGFR lags in rapidly changing AKI</b> because CKD-EPI assumes a steady state \u2014 stage on absolute creatinine values against the individual's baseline, not on eGFR alone"],
         ["<b>AKI alerts</b>","The <b>NHS Spine AKI algorithm</b> generates automatic GP alerts (NHS England AKI algorithm). Check lab results carefully for flagged AKI notifications"],
         ["How it presents","Often an <b>incidental creatinine rise</b> on routine bloods, or an unwell patient with reduced urine output. Context: acute illness (sepsis, D&amp;V, AKI on CKD), recent contrast, new drugs, urinary symptoms"]
       ]},
       {b:"why", html:"KDIGO staging is the global standard adopted by NG148. Stage 1 detected early can often be managed in primary care by reversing precipitants; stage 2\u20133 usually requires same-day hospital assessment. AKI is common, frequently iatrogenic, and a strong marker of both mortality and future CKD."}
     ]},

    {id:"severe", nav:"Red flags", title:"Screen the killers first", sub:"AKI can be rapidly fatal \u2014 hyperkalaemia and pulmonary oedema kill within hours. Screen for these before anything else.",
     blocks:[
       {b:"warn", html:"Anuria with clinical deterioration, an obstructed and infected urinary tract (pyonephrosis) with systemic illness, or K\u207a \u22656.5 mmol/L or hyperkalaemic ECG changes are emergencies \u2014 arrange immediate admission and do not wait for repeat bloods."},
       {b:"cards", items:[
         {tone:"red", h:"Hyperkalaemia \u2014 K\u207a \u22656.5 mmol/L", html:"Or <b>hyperkalaemic ECG changes at any K\u207a</b> (UKKA 2023): peaked T waves, wide QRS, sine wave. Weakness, palpitations \u2192 <b>999 \u2014 cardiac arrest risk</b>. <b>ECG is mandatory at K\u207a \u22656.0.</b>"},
         {tone:"red", h:"Oliguria or anuria", html:"<b>Anuria with clinical deterioration \u2192 999.</b> Oliguria (urine output <b>&lt;0.5 mL/kg/h for 6+ hours</b>) with stable observations \u2192 <b>same-day hospital assessment</b>."},
         {tone:"red", h:"Pulmonary oedema", html:"Breathlessness at rest, crackles, falling saturations, pink frothy sputum \u2192 <b>999 \u2014 fluid overload</b>. Loss of fluid excretion accumulates rapidly."},
         {tone:"red", h:"Uraemic encephalopathy", html:"Confusion, drowsiness, <b>asterixis (flapping tremor)</b>, <b>pericardial rub</b> \u2192 <b>999 \u2014 dialysis urgency</b>. Uraemic pericarditis is an absolute emergency."},
         {tone:"red", h:"Sepsis with AKI", html:"Assess with <b>NEWS2 and the local sepsis pathway</b>; hypotension, hypoxia, altered mental state or rising lactate \u2192 <b>999 \u2014 septic AKI</b>."},
         {tone:"red", h:"Haemodynamic collapse", html:"<b>Systolic BP &lt;90 mmHg</b>, cold peripheries, reduced GCS \u2192 <b>999 \u2014 shock state</b>."},
         {tone:"red", h:"Rhabdomyolysis", html:"<b>Dark cola-coloured urine</b>, severe myalgia, markedly elevated CK \u2192 <b>same-day hospital assessment; 999 if physiologically unstable</b> (myoglobin nephrotoxicity)."},
         {tone:"red", h:"Rapidly rising creatinine", html:"Creatinine <b>doubled within 24\u201348 hours</b>, or <b>\u2265354 \u00b5mol/L with an acute rise</b> \u2192 <b>same-day medical</b>."},
         {tone:"amber", h:"Obstructive uropathy", html:"Bilateral flank pain, bladder distension, unable to pass urine despite the urge \u2192 <b>same-day urology</b>."},
         {tone:"amber", h:"Nephrotoxin exposure with AKI", html:"Recent high-dose NSAID, contrast or aminoglycoside with a rising creatinine in an unwell patient \u2192 <b>same-day</b>."},
         {tone:"purple", h:"Very urgent tests \u00b7 NICE NG12 \u2014 myeloma", html:"AKI with a raised calcium and anaemia or bone pain, aged 60 and over \u2192 FBC, calcium, ESR or plasma viscosity, serum protein electrophoresis and serum free light chains together (urine Bence Jones if free light chain testing is not available), and refer on a suspected cancer pathway if the results suggest myeloma. Myeloma is an intrinsic-renal cause that is repeatedly missed because each abnormality looks explicable on its own."}
       ]},
       {b:"why", html:"AKI kills by three mechanisms. <b>(1) Hyperkalaemia</b> causes fatal arrhythmias \u2014 K\u207a \u22656.5 warrants emergency hospital treatment per the local/UKKA protocol. <b>(2) Fluid overload</b> causes pulmonary oedema. <b>(3) Uraemia</b> accumulates toxins causing pericarditis, encephalopathy and coagulopathy. NG148 asks for discussion with a nephrologist as soon as possible and within 24 hours for stage 3 AKI, and stage 2 usually needs same-day hospital assessment. Transport route depends on physiology and the local pathway, not creatinine stage alone."}
     ]},

    {id:"cause", nav:"Find the cause", title:"Pre-renal, intrinsic, post-renal \u2014 the pivot of management", sub:"Classify rapidly: the category directly drives what you do. History is the most powerful tool here.",
     blocks:[
       {b:"table", head:["Category","Causes and clues","Action"], rows:[
         ["<b>Pre-renal</b> \u2014 most reversible","Reduced renal perfusion: dehydration, vomiting and diarrhoea, haemorrhage, sepsis, cardiac failure, hepatorenal syndrome, and <b>NSAID/ACEi/ARB/diuretic-induced</b>. <b>Clue: concentrated urine, dry mucous membranes, low BP, tachycardia</b>","Restore perfusion if hypovolaemic (IV fluid usually means hospital); treat sepsis"],
         ["<b>Intrinsic</b>","<b>Tubular (ATN)</b> \u2014 ischaemia, nephrotoxins (aminoglycosides, contrast, myoglobin, NSAIDs). <b>Glomerular</b> \u2014 rapidly progressive GN (<b>haematuria + proteinuria + casts</b>). <b>Vascular</b> \u2014 renal artery stenosis, TTP/HUS. <b>Interstitial nephritis (AIN)</b> \u2014 drug-induced (penicillin, NSAIDs, PPIs). Also <b>myeloma</b> and <b>rhabdomyolysis</b>","Dipstick + urine ACR/PCR; <b>if GN suspected \u2192 urgent nephrology</b>"],
         ["<b>Post-renal</b>","Obstruction: BPH, pelvic malignancy, retroperitoneal fibrosis, stones, urethral stricture, single kidney. Clue: poor stream, nocturia, palpable bladder, bilateral hydronephrosis on USS","<b>Urgent renal-tract USS</b>; catheterise for outflow obstruction. <b>Suspected cancer pathway referral by site if malignancy suspected</b>"]
       ]},
       {b:"dl", rows:[
         ["Key history","Recent illness and fluid intake; <b>medications (NSAIDs, ACEi/ARB, diuretics, antibiotics, contrast)</b>; prior CKD; urinary symptoms; <b>systemic features such as rash or arthralgia \u2014 vasculitis or AIN</b>; BP medication changes"],
         ["<b>Ask specifically about sick-day drugs</b>","Whether ACEi/ARB, diuretics, NSAIDs or metformin were <b>continued through an acute dehydrating illness</b>, or recently dose-increased \u2014 a common and entirely preventable precipitant"]
       ]},
       {b:"table", head:["Examination","What to look for","Why it changes the plan"], rows:[
         ["Vital signs","BP <b>in both arms</b> (a discrepancy suggests a vascular cause), HR, RR, temperature, saturations, GCS. Postural drop <b>supports, does not confirm</b>, volume depletion","Decides fluids versus restriction"],
         ["<b>Volume status</b>","<b>Hypovolaemia:</b> dry mucosae, reduced skin turgor, sunken eyes, tachycardia, low BP, low JVP. <b>Hypervolaemia:</b> raised JVP, peripheral oedema, crackles, ascites, S3 gallop","<b>Giving IV fluid to a fluid-overloaded patient causes pulmonary oedema</b>"],
         ["Cardiovascular","JVP, heart sounds \u2014 <b>a pericardial rub means uraemic pericarditis, an emergency</b> \u2014 peripheral oedema","Rub \u2192 dialysis urgency"],
         ["Respiratory","Basal crackles, reduced air entry, pleural effusion. <b>Saturations &lt;94% \u2192 same-day hospital</b>","Pulmonary oedema"],
         ["Abdomen","<b>Palpable bladder</b> (retention \u2192 catheterise), renal angle tenderness, flank mass (tumour, PKD), liver size (hepatorenal)","Takes 30 seconds and identifies fully reversible post-renal obstruction"],
         ["Skin","<b>Purpuric rash \u2192 vasculitis or TTP</b>; maculopapular rash \u2192 drug hypersensitivity (AIN); livedo reticularis \u2192 cholesterol emboli or vasculitis","Points to intrinsic disease needing nephrology"],
         ["Neurological","<b>Asterixis = uraemia \u2192 emergency.</b> Reduced GCS \u2192 999. Consider Wernicke's if alcoholic or malnourished","Rapid bedside screen for uraemic encephalopathy"],
         ["Rectal","If post-renal obstruction suspected \u2014 enlarged or irregular prostate","BPH versus malignancy"]
       ]},
       {b:"why", html:"Identifying the cause is the pivot of AKI management. Pre-renal AKI resolves with fluid resuscitation and nephrotoxin removal. Intrinsic causes such as rapidly progressive GN require urgent immunosuppression \u2014 delay causes irreversible nephron loss. Post-renal obstruction requires decompression, and the longer it persists the greater the permanent damage. Sick-day guidance \u2014 temporarily pausing ACEi/ARB, diuretics, NSAIDs and metformin during an acute dehydrating illness \u2014 is widely used, although the size of its effect on AKI admissions has not been established in trials."}
     ]},

    {id:"workup", nav:"Investigations", title:"Investigations \u2014 prioritised by urgency", sub:"Potassium and the ECG are the most time-critical results.",
     blocks:[
       {b:"table", head:["Test","Role","Interpretation"], rows:[
         ["<b>U&amp;E</b> \u2014 creatinine + potassium","Urgent, all","<b>K\u207a \u22656.0 mmol/L needs an ECG immediately</b>"],
         ["<b>ECG</b>","<b>Mandatory if K\u207a \u22656.0</b>","Peaked T waves \u2192 widening QRS \u2192 sine wave \u2192 VF. <b>Treat before blood results return if the ECG is abnormal</b>"],
         ["<b>FBC</b>","Urgent","Anaemia (chronic disease or haemolysis), WCC (infection or vasculitis), platelets (<b>TTP/HUS</b>)"],
         ["<b>Venous blood gas</b>","Urgent if unwell","<b>pH &lt;7.2 = metabolic acidosis \u2192 emergency</b>"],
         ["<b>Urine dipstick</b>","All","All suspected AKI: blood, protein, leucocytes, nitrites, glucose. <b>Blood + protein</b> (no UTI or catheter trauma) raises concern for GN → urgent nephrology; dipstick can miss light chains, so it does not exclude myeloma"],
         
         ["MSU for culture","If infection suspected","Guides antibiotic choice"],
         ["<b>ACR</b>","Once stable","Quantify albuminuria; drives the CKD assessment — never delays referral for suspected GN"],
         ["Additional bloods","As indicated","LFTs and albumin (hepatorenal, nutrition); <b>CRP, ESR, CK</b> (infection, inflammation, <b>rhabdomyolysis</b>); glucose; <b>calcium, serum protein electrophoresis and free light chains</b> if myeloma possible; <b>LDH and blood film if a microangiopathic picture</b>"],
         ["<b>Renal USS</b>","<b>First-line if obstruction suspected</b>, kidneys asymmetric, or the cause is unclear","<b>Within 6 hours if pyonephrosis suspected; within 24 hours</b> if the cause is unclear or obstruction possible (NG148). Pyonephrosis, solitary-kidney or bilateral obstruction, or obstruction with complications → immediate urology. <b>Not routine when the cause is clear and improving</b>"],
         ["CXR","If fluid overload or a pulmonary cause suspected","Pulmonary oedema, consolidation"],
         ["Specialist immunology","If intrinsic disease suspected \u2014 with nephrology","ANCA, ANA, anti-GBM, complement, immunoglobulins, protein electrophoresis, hepatitis B and C, HIV, ASOT. Starting these in primary care can save 24\u201348 hours before immunosuppression"],
         ["<b>Do NOT order</b>","\u2014","Renal biopsy from primary care; USS where the cause is obviously pre-renal or post-renal and resolving; repeat creatinine in stable CKD with no acute change"]
       ]},
       {b:"why", html:"Urine sodium and FENa are not routine in primary care and should not be used alone to separate pre-renal from intrinsic AKI (diuretics, CKD, sepsis and mixed causes confound them). The autoimmune screen is only relevant where there are features of glomerulonephritis \u2014 but initiating it in primary care can save a day or two before nephrology starts immunosuppression."}
     ]},

    {id:"treat", nav:"Treat", title:"Treatment \u2014 stop, support, and the hyperkalaemia ladder", sub:"Primary-care treatment removes precipitants, assesses fluid balance and reviews medicines; acute hyperkalaemia treatment follows the local/UKKA hospital protocol.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"1 \u00b7 Stop the nephrotoxins", html:"<b>Stop NSAIDs</b> and avoidable nephrotoxins. <b>Review individually</b> ACEi/ARB, diuretics, MRAs, metformin, SGLT2i, lithium, trimethoprim (may raise creatinine without true GFR fall, but can cause real AKI and hyperkalaemia) and renally cleared drugs — withhold where continuing is riskier than stopping. <b>Document the restart plan.</b>"},
         {tone:"blue", h:"2 \u00b7 Fluid \u2014 by clinical assessment", html:"If hypovolaemic and able to drink, appropriate oral rehydration with monitoring \u2014 <b>no fixed daily target</b>. Needs IV fluid \u2192 hospital. <b>No extra fluid with pulmonary oedema, raised JVP, congestion or a fluid-restriction plan</b> (heart failure, advanced CKD, cirrhosis, hyponatraemia)."},
         {tone:"cream", h:"3 \u00b7 Treat the underlying cause", html:"UTI or pyelonephritis: antibiotic choice and dose per NICE NG111/NG109 and the BNF, for example cefalexin, or co-amoxiclav only when culture shows susceptibility (adjust for severity and renal function). <b>Sepsis \u2192 999.</b> Vomiting \u2192 an antiemetic such as <b>cyclizine 50 mg TDS</b>. Catheterise for outflow obstruction."}
       ]},
       {b:"ladder", steps:[
         {step:"1", title:"Triage the potassium", when:"K⁺ ≥5.5 mmol/L", html:"<b>≥6.5 or ECG changes → 999</b> (emergency treatment per local/UKKA hospital protocol). <b>6.0–6.4 with AKI or acute illness → same-day hospital.</b> 5.5–5.9 → consider pseudohyperkalaemia, review medicines, repeat with clinical assessment."},
         {step:"2", title:"Dietary potassium advice", when:"persistent hyperkalaemia only",
          fromLabel:"first non-drug step",
          html:"Not a general AKI measure. Advise avoiding <b>salt substitutes (LoSalt, NoSalt)</b>; individual dietary potassium advice for persistent hyperkalaemia comes from a renal dietitian. It supports, but does not replace, medicine review."},
         {step:"3", title:"Potassium binders — not for acute AKI", when:"persistent hyperkalaemia in CKD 3b–5 or heart failure only", fromLabel:"secondary-care initiated", html:"<b>Do not start patiromer or sodium zirconium cyclosilicate in primary care</b> as an alternative to emergency assessment of acute hyperkalaemia or AKI. For persistent hyperkalaemia in CKD or heart failure (NICE TA623; TA1148), discuss with renal/cardiology and follow the GM shared-care protocol."},
         {step:"4", title:"Recheck and escalate", when:"24\u201348 hours",
          fromLabel:"mandatory",
          html:"Repeat U&amp;E. <b>K\u207a \u22656.0, or failing to respond \u2192 same-day hospital.</b>"}
       ]},
       {b:"table", head:["Drug","Action in AKI","Detail and restart rule"], rows:[
         ["<b>Metformin</b>","<b>HOLD</b> during AKI","Risk of lactic acidosis. <b>Hold during AKI even if the eGFR is usually &gt;30.</b> Restart on clinical recovery with stable renal function and a continuing indication \u2014 dose and suitability per SPC/formulary"],
         ["<b>ACEi / ARB</b>","<b>Review</b> \u2014 withhold in hypovolaemia, hypotension or hyperkalaemia","Restart when the indication remains, the patient is stable and euvolaemic, K\u207a acceptable and no new contraindication \u2014 early in heart failure or albuminuric CKD (Think Kidneys). <b>Recheck creatinine and K\u207a 1\u20132 weeks after restarting and after titration</b>"],
         ["<b>Diuretics</b>","<b>Review</b>","May worsen hypovolaemia but may be needed for overload; spironolactone — watch K⁺. Restart with a plan if still indicated"],
         ["<b>NSAIDs</b>","<b>STOP</b> \u2014 use paracetamol","They constrict the afferent arteriole and reduce GFR. <b>Avoid indefinitely if CKD persists.</b> Paracetamol is preferred — reduce the dose in frailty, low weight, liver disease or malnutrition"],
         ["<b>Lithium</b>","<b>HOLD + urgent level</b>","Toxicity accumulates rapidly in AKI. Assess toxicity symptoms; check level, sodium, renal function and interactions; urgent clinical advice; <b>no restart without a clear plan</b> (psychiatry)"],
         ["<b>SGLT2 inhibitors</b>","<b>HOLD</b>","Dapagliflozin, empagliflozin \u2014 hold during acute illness (sick-day rule; ketoacidosis risk). Never stop insulin in type 1 diabetes. Euglycaemic DKA if nausea, vomiting, abdominal pain, tachypnoea or malaise despite normal glucose → urgent ketones. Restart once eating and drinking normally and recovered"],
         ["Digoxin, DOACs/LMWH, opioids, gabapentinoids, methotrexate","<b>Review \u2014 adjust or withhold</b>","All accumulate in renal impairment \u2014 check the SPC; pharmacist or specialist advice; some need withholding, not just a lower dose"]
       ]},
       {b:"warn", html:"<b>Individualised sick-day advice \u2014 for selected patients.</b> For those at risk of volume-depletion AKI, explain the illness threshold, exactly which medicines to pause, when to seek advice, and when to restart (\u201cwhen eating and drinking normally and the illness has resolved; contact us if unsure or it lasts more than 24\u201348 hours\u201d). Record it and keep it compatible with heart-failure, diabetes and renal plans \u2014 sick-day rules can harm (decompensated HF, hyperglycaemia, failure to restart)."},
       {b:"why", html:"Removing nephrotoxins and correcting the precipitant is the main primary-care lever, but stopping medicines can itself cause harm, so each decision is individual (NHS SPS)."}
     ]},

    {id:"lifestyle", nav:"Prevention", title:"Prevention and recovery optimisation", sub:"Prevention of recurrent AKI; long-term CKD care lives in the <a href='ckd.html'>CKD protocol</a>.",
     blocks:[
       {b:"table", head:["Measure","What to advise","Why / effect"], rows:[
         ["<b>Hydration</b>","Individualised \u2014 no fixed daily target; extra fluid during illness only if not fluid-restricted (heart failure, advanced CKD, cirrhosis, hyponatraemia)","Volume depletion is a common precipitant"],
         ["<b>Sick-day rules education</b>","Individualised advice for selected at-risk patients: which medicines to pause, when to seek advice, and when to restart \u2014 recorded","Useful in selected patients; can harm if applied indiscriminately"],
         ["<b>NSAID avoidance</b>","Paracetamol instead \u2014 <b>and explain to avoid even OTC ibuprofen</b>","The <b>\u201ctriple whammy\u201d (NSAID + ACEi/ARB + diuretic)</b> is a preventable cause of AKI"],
         ["<b>Flag it in the record</b>","Code the AKI episode so future prescribing and imaging decisions see it","Prevents the next avoidable insult"],
         ["Long-term risk factors","BP, diabetes, weight, alcohol and smoking — managed in the CKD and cardiovascular pathways","Kept out of the acute AKI pathway"],
         ["<b>Contrast precautions</b>","<b>Tell radiology about the AKI history and current renal function</b> \u2014 contrast precautions per the local radiology protocol","Prevents contrast-associated AKI"],
         ["Persistent hyperkalaemia","Renal dietitian if K\u207a remains elevated","Supports medicine review"]
       ]},
       {b:"why", html:"<b>AKI is a risk marker, not a single event</b> \u2014 survivors carry higher CKD, cardiovascular and mortality risk, so post-AKI review is a prevention opportunity."}
     ]},

    {id:"monitor", nav:"Follow-up", title:"Follow-up, monitoring and safety-netting", sub:"Post-AKI review is a quality standard (NICE QS76 statement 6: clinical review within 3 months of discharge, or sooner if at higher risk) and NICE NG148 advises monitoring serum creatinine after an episode, yet many patients leave hospital without it. This is the GP's safety net.",
     blocks:[
       {b:"table", head:["When","What","Action"], rows:[
         ["<b>By severity \u2014 often 24\u201348 hours</b>","<b>U&amp;E</b> for any community-managed AKI","Confirm creatinine is trending down. Stable or improving \u2192 continue monitoring. Rising creatinine or K\u207a, falling urine output or worsening symptoms \u2192 same-day hospital"],
         ["<b>1 week</b>","U&amp;E","Confirm recovery; restart held medicines by the clinical restart criteria, then recheck creatinine and K⁺ within 1–2 weeks"],
         ["<b>3 months</b>","Full AKI review \u2014 U&amp;E, eGFR, ACR, BP, medicines reconciliation","Compare with pre-AKI function. Diagnose CKD only if chronic (&gt;3 months): eGFR &lt;60 on two occasions ≥90 days apart, or persistent damage markers (confirmed ACR ≥3 mg/mmol — confirm 3–70 on an early-morning sample). Code the AKI even if recovered; monitor for at least 3 years, especially after stage 3 (NG203). Required by <b>NICE QS76</b>"],
         ["Annual","If CKD confirmed: monitor per the <a href='ckd.html'>CKD protocol</a>","<b>Discuss with nephrology</b>: eGFR ≤30 after recovery, significant albuminuria, haematuria with proteinuria, recurrent or unexplained AKI, progressive decline, residual CKD stage 4\u20135, ongoing dialysis requirement"],
         ["Fluid balance and weight","Daily while managing at home","Overload or worsening oliguria \u2192 admit"],
         ["<b>After a hospital AKI</b>","Check the discharge summary for <b>AKI stage, cause, nephrotoxin changes and follow-up instructions</b>","Review maximum stage, cause, recovery, medication changes and plan; earlier review for poor recovery, HF, CKD, frailty, recurrent or stage 3 AKI"]
       ]},
       {b:"kv", rows:[
         ["Monitoring parameters","eGFR trend, serum creatinine, potassium, <b>bicarbonate (acidosis)</b>, haemoglobin (anaemia of CKD), BP, and <b>proteinuria (ACR)</b>"],
         ["Also consider at review","Renal dietitian; structured diabetes education if diabetic; BP optimisation \u2014 and code the AKI episode"]
       ]},
       {b:"cards", items:[
         
       ]},
       {b:"cards", items:[
         {tone:"red", h:"\ud83d\udea8 999 \u2014 passing no urine", html:"\u201cIf you pass no urine at all for 6 hours or more and feel unwell \u2014 call 999.\u201d"},
         {tone:"red", h:"\ud83d\udea8 999 \u2014 breathless at rest", html:"\u201cNew or worsening breathlessness, especially at night \u2014 call 999.\u201d"},
         {tone:"red", h:"\ud83d\udea8 999 \u2014 confusion or drowsiness", html:"\u201cAny new confusion, or not acting like yourself \u2014 call 999.\u201d Also severe weakness or inability to stand, and <b>palpitations or chest pain, which can mean a potassium arrhythmia</b>."},
         {tone:"amber", h:"\ud83d\udd34 Same-day", html:"\u201cIf you are not improving despite pausing the agreed tablets, you are passing much less urine, or you keep vomiting \u2014 contact us the same day.\u201d"},
         {tone:"green", h:"\ud83d\udca7 While you are unwell", html:"\u201cDrink to thirst unless you have a fluid limit, pause only the tablets we agreed, and restart them once you are eating and drinking normally \u2014 contact us if unsure.\u201d"}
       ]},
       {b:"say", html:"Your kidney blood test has gone off \u2014 usually from dehydration, an infection or a medication. We'll pause some tablets while you're unwell, make sure you're drinking enough (unless you have a fluid limit), and recheck the blood in a couple of days. If you're passing very little urine, getting breathless or feel very unwell, we need to send you in the same day."},
       {b:"why", html:"Post-AKI care is chronically under-resourced. Many AKI survivors have no formal review, missing the chance to diagnose CKD, optimise BP and prevent recurrence. The 3-month review detects persistent impairment, allows safe medication restart, and reduces the risk of a second AKI \u2014 and failing to review post-AKI and missing progression to CKD 3\u20134 is a known complaint trigger. The early recheck is the safety net that prevents missed deterioration."}
     ]},

    {id:"loop", nav:"Not responding?", title:"Creatinine not improving?", sub:"Reassess the three categories \u2014 something is ongoing.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"1 \u00b7 Perfusion", html:"Still hypovolaemic or hypotensive/septic? Reassess and treat."},
         {tone:"amber", h:"2 \u00b7 Obstruction", html:"Has a renal-tract USS been done? Exclude/relieve obstruction."},
         {tone:"amber", h:"3 \u00b7 Drugs", html:"All nephrotoxins stopped and doses adjusted?"},
         {tone:"red", h:"4 \u00b7 Intrinsic disease", html:"Blood + protein on dip, or myeloma features \u2192 urgent nephrology."},
         {tone:"red", h:"5 \u00b7 Admit", html:"Worsening biochemistry, overload or uraemia \u2192 same-day admission."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer \u2014 and who can safely stay at home", sub:"Escalate by physiology and cause, not creatinine stage alone — follow local Bolton/GM arrangements.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999 \u2014 emergency", html:"<b>K\u207a \u22656.5 mmol/L or hyperkalaemic ECG changes</b>; cardiac arrest/peri-arrest; pulmonary oedema or severe hypoxia; <b>reduced consciousness or asterixis</b>; shock or septic instability; anuria with deterioration; suspected pyonephrosis with systemic illness; severe acidosis or another RRT indication; <b>uraemic pericarditis</b>."},
         {tone:"amber", h:"Same-day hospital", html:"<b>AKI stage 2 or stable stage 3</b>; <b>K\u207a 6.0\u20136.4</b>; <b>oliguria</b> or rapidly worsening creatinine; cause unclear or GN, vasculitis, AIN or myeloma suspected; unable to tolerate oral fluids; <b>significant comorbidity</b> (heart failure, cirrhosis, frailty, immunosuppression, transplant); poor response to initial treatment; <b>rapidly progressive AKI \u2014 doubling in 24\u201348 hours</b>; suspected obstruction (arrange the USS same-day)."},
         {tone:"amber", h:"Same-day urology", html:"<b>Pyonephrosis, solitary-kidney or bilateral obstruction</b> (immediate); acute urinary retention (catheterise first); ureteric stone causing obstruction with AKI; suspected malignant obstruction. "},
         {tone:"amber", h:"Urgent nephrology", html:"<b>Haematuria + proteinuria + AKI (possible GN)</b>; suspected vasculitis or AIN; rapidly declining eGFR with no clear pre-renal cause; <b>AKI on CKD stage 4\u20135</b>; nephrotic syndrome; AKI not recovering; <b>stage 3 \u2014 discuss within 24 h (NG148)</b>. Consider myeloma \u2192 haematology."},
         {tone:"cream", h:"Primary care manageable \u2014 all of these must apply", html:"Clinical decision, usually stage 1: clinically well; clear, reversible cause; able to drink; no significant oliguria; <b>K\u207a not significantly raised</b>; no major comorbidity or intrinsic features; <b>reliable follow-up \u2014 U&amp;E often within 24\u201348 hours</b>."},
         {tone:"blue", h:"On admission \u2014 flag the drugs", html:"Tell the receiving team to review <b>ACEi, ARBs, diuretics, NSAIDs, metformin, lithium and aminoglycosides</b> \u2014 each needs individual review (suspension or dose adjustment where continuing is riskier than stopping), with a documented restart plan."},
         {tone:"cream", h:"Post-AKI review for everyone", html:"Medicines reconciliation, CKD surveillance, and a documented plan to avoid future nephrotoxins."}
       ]},
       {b:"why", html:"In practice <b>AKI stage 2\u20133 usually warrants hospital assessment</b> for IV fluid resuscitation, ECG monitoring and specialist input; NG148 asks for nephrology discussion within 24 hours for stage 3. Community monitoring is a clinical decision for a well patient with a clear reversible cause \u2014 with an <b>early recheck</b> and explicit escalation criteria. A common and litigated error is watchful waiting once the referral threshold has been crossed."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only \u2014 the Casebook keeps the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 78-year-old man on ramipril, indapamide and regular ibuprofen for knee pain, three days of vomiting and diarrhoea. Creatinine 186 \u00b5mol/L against a baseline of 96 (1.9\u00d7), K\u207a 5.8 mmol/L. He feels \u201cjust a bit washed out\u201d and has kept taking all his tablets."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Finds the <b>baseline creatinine</b> and stages this as AKI 1; recognises the <b>triple whammy</b>; does an <b>ECG for the K\u207a of 5.8</b>; assesses volume status specifically; stops the NSAID and holds the ACEi and diuretic; arranges an <b>early U&amp;E recheck</b>; gives <b>individualised sick-day advice including when to restart</b>; and books the <b>3-month CKD review</b>. <a href='../../cases/aki.html'>Open the full casebook chapter \u2192</a>"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>NICE NG148 \u2014 Acute kidney injury: prevention, detection and management (2019)<br><a href="https://www.nice.org.uk/guidance/ng148" rel="noopener">nice.org.uk/guidance/ng148</a><span class="rd"> \u2014 detection and staging, urine dipstick in all suspected AKI, ultrasound within 6 hours (pyonephrosis) or 24 hours (cause unclear or obstruction possible), nephrology discussion within 24 hours for stage 3, unclear cause or poor response, individualised medicine review, the CKD risk after AKI</span></li>'+
         '<li><b>KDIGO AKI Clinical Practice Guideline (2012)</b><span class="rd"> \u2014 the staging criteria used throughout: creatinine \u226526 \u00b5mol/L (KDIGO states \u226526.5 \u00b5mol/L) in 48 hours, \u22651.5\u00d7 baseline in 7 days, urine-output thresholds, and stages 1\u20133</span></li>'+
         '<li><b>NICE QS76 \u2014 Acute kidney injury quality standard</b><span class="rd"> \u2014 clinical review within 6 hours of a stage 3 warning result (immediately if acutely ill in the community) and a structured review within 3 months of discharge</span></li>'+
         '<li><b>NICE NG148 (2019); NHS England AKI Programme; Think Kidneys</b><span class="rd"> \u2014 sick-day rules guidance and the national prevention programme</span></li>'+
         '<li><b>UK Kidney Association \u2014 Treatment of acute hyperkalaemia in adults (2023)</b><span class="rd"> \u2014 \u22656.5 mmol/L or ECG changes: emergency treatment</span></li><li><b>NICE TA623 (patiromer) \u00b7 TA1148 (sodium zirconium cyclosilicate) \u00b7 GMMMG shared-care protocols</b><br><a href="https://gmmmg.nhs.uk" rel="noopener">gmmmg.nhs.uk</a><span class="rd"> \u2014 persistent hyperkalaemia in CKD/heart failure, secondary-care initiated; check the shared-care protocol version is current</span></li><li><b>NHS SPS \u2014 Reviewing medicines use in renal impairment</b><span class="rd"> \u2014 individualised medicine review in AKI</span></li>'+
         '<li><b>NICE NG12 \u2014 Suspected cancer: recognition and referral (updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> \u2014 myeloma (April 2025 update): aged 60 and over with persistent bone pain, particularly back pain, or an unexplained fracture, offer FBC, calcium, ESR or plasma viscosity, serum protein electrophoresis and serum free light chains together (Bence Jones urine test if free light chain testing is not available)</span></li>'+
         '<li>NICE NG203 \u2014 Chronic kidney disease (the CKD guideline cited for post-AKI surveillance); RCGP / NHS England joint guidance on post-AKI discharge<span class="rd"> \u2014 CKD diagnosis (&gt;3 months, eGFR on two occasions \u226590 days apart, confirmed ACR \u22653) and post-AKI monitoring</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> \u2014 all doses; patiromer and sodium zirconium cyclosilicate; renal dose adjustment for digoxin, DOACs, opioids, gabapentinoids, lithium and methotrexate</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Acute kidney injury in adults \u2014 NICE NG148, KDIGO AKI 2012, NICE QS76, NHS England AKI Programme and Think Kidneys sick-day-rules guidance. Detection and management are merged on this page; there is no separate AKI pathway to cross-check. Many cases require same-day hospital assessment. Verify all doses against the current BNF and your local AKI and sick-day-rules pathway."
