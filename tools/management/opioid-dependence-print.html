  ],
  lead:'<div class="mg-layers"><a href="#severe"><b>Overdose first</b><small>Naloxone · lost tolerance</small></a><a href="#confirm"><b>Confirm</b><small>Clinical diagnosis · testing supports</small></a><a href="#workup"><b>Assess</b><small>BBV · ECG · safeguarding</small></a><a href="#ladder"><b>Treat</b><small>Methadone vs buprenorphine</small></a><a href="#monitor"><b>Safety</b><small>Missed doses · transitions</small></a></div>',
  quickSub:"If you read nothing else on this page, read these six cards. Every number traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Overdose is a reversible cause of death", html:"Pinpoint pupils, respiratory rate &lt; 12 (below 12) or shallow breathing, reduced consciousness → call 999 immediately. Give naloxone using the available product and local emergency protocol, repeat doses as required, support airway and breathing, and place the person in the recovery position if breathing adequately. Naloxone may wear off before methadone, buprenorphine or long-acting synthetic opioids — re-sedation can occur, so never leave the person alone; continued observation and hospital assessment are required. The diagnosis is clinical — do not wait for drug testing."},
    {tone:"red", h:"Never prescribe into an untolerant person", html:"Opioid dependence and current tolerance are clinical diagnoses supported by history, examination, withdrawal assessment and near-patient drug testing. Use urine or oral-fluid testing to aid identification of opioid and other drug use. If dependence or tolerance is uncertain, arrange confirmatory laboratory testing and specialist advice before prescribing. Do not require injection marks or a positive test as absolute prerequisites where the clinical risk of untreated dependence is high. Methadone is itself a potent respiratory depressant — <b>prescribing it to someone who is not opioid-tolerant can be fatal.</b>"},
    {tone:"amber", h:"Loss of tolerance is the single biggest risk factor", html:"Prison release, hospital discharge, completed detox or any break in use. Deaths cluster there because people return to a dose their body can no longer handle. Everyone leaving a controlled environment, and everyone in treatment, should leave with take-home naloxone and overdose-awareness advice."},
    {tone:"blue", h:"Individualise the dose — there is no universal target", html:"Titrate to the individual dose that prevents withdrawal and craving, reduces illicit opioid use and does not cause sedation or intoxication. <b>There is no universal maintenance dose.</b> Initiation and titration happen through the specialist service or agreed shared care. Continued illicit use can reflect under-dosing, but also instability, coexisting substance use, poor access, inadequate psychosocial support, diversion, mental illness, unsafe housing or an incorrect diagnosis."},
    {tone:"red", h:"Missed methadone doses — reassess before restarting", html:"After three or more consecutive missed methadone doses, do not automatically dispense or prescribe the previous dose. Contact the prescriber/drug service, verify the last supervised dose and reassess current opioid use, intoxication, withdrawal and tolerance. Restart or re-titrate according to the local missed-dose protocol. The same principle applies to buprenorphine, though the restart approach depends on formulation, length of interruption and current opioid use. <b>The usual maintenance dose can be fatal after a gap.</b>"},
    {tone:"green", h:"Take-home naloxone — a high-priority harm-reduction intervention", html:"Take-home naloxone is a high-priority harm-reduction intervention and should be offered repeatedly to people at risk of opioid overdose and to their families or carers. Overdoses are usually witnessed, and a bystander who can give IM or intranasal naloxone buys the minutes an ambulance needs. <b>Supply it with practical training for the patient and family/carers, and reissue after use, loss or expiry.</b> Naloxone is temporary and does not remove the need for ambulance assessment. Drug services can supply it without a prescription."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step is a reversible death.",
  pathway:[
    {title:"Rule out acute overdose", html:"<b>Pinpoint pupils, reduced respiratory rate or consciousness</b> — especially with alcohol, benzodiazepines or pregabalin, or after a period of abstinence. <b>999 plus naloxone</b> per the available product and local protocol; do not wait for drug testing.", alert:true},
    {title:"Assess dependence and tolerance", html:"ICD dependence criteria (≥3 in the past year) assessed clinically — history, examination and withdrawal assessment — with urine or oral-fluid testing in support; confirmatory testing and specialist advice if dependence or tolerance is uncertain. Injection marks are not required. Assess severity, complications and <b>the person's own goals</b>."},
    {title:"Assess the whole person", html:"BBV testing (HIV, hepatitis B and C), injecting harms, mental health, ECG before methadone where there is cardiac risk, social context, and safeguarding and pregnancy — always ask."},
    {title:"Refer for OST, then share the care", html:"Initiation and dose titration of methadone or buprenorphine occur through the local specialist drug and alcohol service, or within an agreed local shared-care pathway with appropriately trained clinicians; many GPs then continue prescribing under shared care. <b>Do not independently restart a previous maintenance dose after a treatment interruption</b> without verifying the current prescription, last administered dose and tolerance with the specialist service/pharmacy. <b>Pregnancy is urgent joint care — do not abruptly detox.</b>"},
    {title:"Wrap in harm reduction and hold the safety lines", html:"Take-home naloxone, needle programmes, vaccination and hepatitis C treatment, psychosocial support — then missed-dose reassessment per local protocol, diversion awareness, and continuity across hospital, prison and treatment breaks."}
  ],
  sections:[

    {id:"severe", nav:"Overdose first", title:"Red flags — overdose, and the highest-risk moments",
     sub:"Opioid overdose is a reversible cause of death. Recognise it, give naloxone, call 999 — then build overdose prevention into every consultation.",
     blocks:[
       {b:"table", head:["Red flag","Why it matters","Action"], rows:[
         ["<b>Opioid overdose</b>","Pinpoint pupils, respiratory rate &lt; 12 or shallow breathing, reduced consciousness, cyanosis, snoring or gurgling","Call 999. Naloxone using the available product and local emergency protocol (community take-home kit or clinical titrated dosing), repeated as required; airway and breathing, recovery position if breathing adequately. Aim for adequate breathing and airway protection, not necessarily full reversal — avoid precipitating severe withdrawal where this can safely be avoided"],
         ["<b>Lost tolerance</b>","Recent abstinence — prison release, a hospital stay, detox, or any break in use — sharply raises overdose risk if they return to their previous dose","<b>High risk; ensure take-home naloxone</b>"],
         ["<b>Sedative combinations</b>","Opioids with alcohol, benzodiazepines, pregabalin or gabapentin, or zopiclone → additive respiratory depression, and most drug-related deaths","<b>Counsel. Avoid unnecessary co-prescribing of opioids with alcohol, benzodiazepines, Z-drugs, pregabalin, gabapentin or other CNS depressants.</b> If a combination is clinically necessary, use the lowest effective doses, review frequently, provide naloxone and document the risk–benefit decision. Do not abruptly stop benzodiazepines or alcohol in a dependent patient — withdrawal can be dangerous and needs a specialist plan"],
         ["<b>Methadone induction</b>","The first 1–2 weeks are the highest-risk period — methadone accumulates over days because of its long half-life","<b>Start low, titrate slowly, supervise consumption</b>"],
         ["<b>Naloxone re-sedation</b>","Naloxone is shorter-acting than most opioids, especially methadone — the patient can re-sedate after it wears off","<b>Always 999; do not leave the person alone after reversal</b> — re-sedation is possible, further naloxone may be needed, airway and breathing can deteriorate again, and emergency assessment is needed even when the person initially wakes"],
         ["<b>Suicide or mental health crisis</b>","High rates of depression, self-harm and intentional overdose in this group","<b>Assess risk directly at every contact and act on it</b> — see the <a href='depression.html'>depression protocol</a>"]
       ]},
       {b:"warn", html:"Never start opioid substitution treatment without a clinical assessment of dependence and tolerance (supported by testing, and specialist advice if uncertain), and never give a full methadone dose to someone who may have lost tolerance. The induction period, and the days after any abstinence — prison release, hospital discharge, completed detox — carry the highest overdose risk. <b>Give take-home naloxone to everyone.</b>"},
       {b:"why", html:"The majority of drug-related deaths in the UK involve opioids, and most involve more than one substance — opioids with benzodiazepines, alcohol, pregabalin or gabapentin. These are all CNS depressants and act synergistically on respiratory drive, so the combination is far more dangerous than any one drug alone. Asking specifically about street benzodiazepines and pregabalin or gabapentin, and counselling against mixing, is a core safety conversation. Follow the local emergency opioid-toxicity protocol for acute reversal and observation. Loss of tolerance is the single most important overdose risk factor, and its timing is often iatrogenic — the days following prison release, hospital discharge or a completed detox are when people are most likely to die, because they return to a dose their body can no longer handle."},
       {b:"dl", rows:[
         ["<b>Other symptoms</b>","Opioid dependence is not itself a suspected-cancer presentation. Assess new pain, weight loss, bleeding or other possible cancer symptoms independently rather than attributing them to drug use"]
       ]}
     ]},

    {id:"confirm", nav:"Confirm", title:"Assess dependence and current tolerance",
     sub:"Opioid dependence and current tolerance are clinical diagnoses supported by history, examination, withdrawal assessment and near-patient drug testing.",
     blocks:[
       {b:"dl", rows:[
         ["<b>Dependence criteria (ICD-10/11)</b>","3 or more over the past year: a strong desire or craving; impaired control over use; a withdrawal state; tolerance (needing more for the same effect); salience (use crowds out other activities); and persistent use despite clear harm"],
         ["<b>Drug history</b>","Which opioids, the amount and cost per day, the route (oral, smoked or \u201cchasing\u201d, injected), duration of use, last use, the typical withdrawal pattern, other drugs (benzodiazepines, crack or cocaine, alcohol, pregabalin), tolerance and withdrawal history, previous OST and detoxification, any overdoses, mental health and suicide risk, pregnancy and safeguarding, and housing and criminal-justice transitions"],
         ["<b>Drug testing — supports the assessment</b>","Use urine or oral-fluid testing to aid identification of opioids, methadone or buprenorphine where relevant, benzodiazepines, stimulants and other locally relevant substances. Interpret results in context: a negative result does not always exclude recent opioid use (timing, assay limits, opioids not in the panel), and a positive test alone does not establish dependence or tolerance. If dependence or tolerance is uncertain, arrange confirmatory laboratory testing and specialist advice before prescribing. Do not require injection marks or a positive test as absolute prerequisites where the clinical risk of untreated dependence is high"],
         ["<b>Withdrawal assessment</b>","Yawning, lacrimation, rhinorrhoea, sweating, dilated pupils, piloerection (\u201ccold turkey\u201d), abdominal cramps, diarrhoea, myalgia, restlessness, insomnia. <b>Formal withdrawal scores such as COWS are adjuncts, not substitutes for clinical judgement</b> — withdrawal is uncomfortable but rarely dangerous in healthy adults, <b>unlike alcohol or benzodiazepine withdrawal</b>"],
         ["<b>Severity and goals</b>","Gauge dependence severity, complications, and the person's own goals — stabilisation and harm reduction versus abstinence. This shapes whether you aim for maintenance OST or, later, detox"]
       ]},
       {b:"why", html:"NICE recommends clinical assessment of dependence, with urine or oral-fluid testing to aid identification; confirmatory laboratory testing is particularly important when dependence or tolerance is uncertain. A substitute opioid such as methadone is itself a potent respiratory depressant, so prescribing it to someone who is not in fact opioid-tolerant can cause fatal toxicity. Testing supports — but does not replace — the history, examination and withdrawal assessment, and it should not become a barrier that delays treatment for someone at high risk. Second point, easily lost: unlike alcohol or benzodiazepine withdrawal, uncomplicated opioid withdrawal is not life-threatening in an otherwise healthy adult — intensely unpleasant, but safe. That matters clinically, because the urgency in opioid dependence is not the withdrawal but engaging and retaining the person in treatment, preventing overdose and reducing the harms of continued illicit use — and it means abrupt withdrawal on hospital admission or in custody is rarely justified, since it risks disengagement and post-release overdose."}
     ]},

    {id:"workup", nav:"Assess", title:"Comprehensive assessment — physical, mental, social and safeguarding",
     sub:"A treatment episode is a high-value opportunity to address health that is otherwise neglected.",
     blocks:[
       {b:"table", head:["Domain","What to do"], rows:[
         ["<b>Blood-borne viruses</b>","Offer HIV, hepatitis B and hepatitis C testing to anyone who injects or has injected. Offer hepatitis B vaccination (rapid schedule), and refer hepatitis C for treatment — it is now curable with direct-acting antivirals"],
         ["<b>Injecting harms</b>","Inspect injection sites for abscesses, cellulitis, DVT, and missed or arterial injection. Consider infective endocarditis (fever plus a new murmur), and ask about groin injecting. Check tetanus status; consider botulism and anthrax in outbreaks"],
         ["<b>Mental health</b>","Screen for depression, anxiety, PTSD and trauma, personality difficulties and self-harm or suicide risk — comorbidity is the rule, not the exception, and worsens outcomes if untreated"],
         ["<b>Cardiac — before methadone</b>","Methadone prolongs the QT interval. Before methadone, review cardiac history, syncope, arrhythmia, electrolyte disturbance, liver disease and QT-prolonging medicines. Obtain an ECG where cardiac risk is present, other QT-prolonging medicines are used, or higher doses are anticipated, according to local specialist protocol"],
         ["<b>Social context</b>","Housing, income and debt, employment, relationships, domestic abuse, and contact with the criminal justice system — all influence treatment and recovery"],
         ["<b>Safeguarding and pregnancy — always ask</b>","Dependent children or pregnancy → assess and refer appropriately. Parental drug use requires a proportionate safeguarding assessment and coordinated plan — not automatic removal of the child. Pregnancy needs prompt joint specialist drug service and maternity care — do not abruptly stop methadone or buprenorphine"]
       ]},
       {b:"why", html:"Hepatitis C is curable in over 95% of cases with short oral direct-acting antiviral courses, and treating people who inject drugs is central to elimination — so testing and referral should be routine rather than optional, alongside hepatitis B vaccination, HIV testing, wound care and immunisations. <b>Safeguarding is a continuous responsibility</b>: children of parents with drug dependence are at increased risk, and assessment of dependents is part of every drug-treatment contact — not to remove children by default, but to ensure support is in place. In pregnancy, maintenance OST is continued because uncontrolled withdrawal and relapse carry greater risks to the fetus than stable substitute treatment."}
     ]},

    {id:"ladder", nav:"Treat", title:"Opioid substitution treatment — methadone versus buprenorphine",
     sub:"Maintenance OST is the cornerstone. Initiation and dose titration occur through the local specialist drug and alcohol service, or within an agreed local shared-care pathway with appropriately trained clinicians. Both agents are first-line (NICE TA114) — selected case by case with the patient and delivered within supportive care.",
     blocks:[
       {b:"table", head:["Option","Detail"], rows:[
         ["<b>Methadone — oral solution 1 mg/1 mL, slow induction</b>","Started by the specialist service or shared-care prescriber — typical start 10–30 mg (lower if tolerance is uncertain). Titrate slowly — it accumulates over days. Supervised daily consumption initially. Highest overdose risk in the first 2 weeks. Prolongs the QT interval"],
         ["<b>Buprenorphine — sublingual, start in withdrawal</b>","Start only when objective withdrawal is present, because a partial agonist precipitates withdrawal if given too soon. Started by the specialist service or shared-care prescriber at 2–4 mg and titrated to the individual effective dose. Safer in overdose (ceiling effect), and useful where alertness matters"],
         ["<b>Buprenorphine with naloxone (e.g. Suboxone)</b>","The naloxone component deters injecting and diversion; otherwise used like buprenorphine. Long-acting injectable buprenorphine is an option in specialist services"],
         ["<b>Goal of dosing</b>","Titrate to the individual dose that prevents withdrawal and craving, reduces illicit opioid use and does not cause sedation or intoxication. There is no universal maintenance dose; prescribing decisions are individualised to the dependence history, risks, preferences and longer-term goals. Continued illicit use may reflect under-dosing, instability, coexisting substance use, poor access, inadequate psychosocial support, diversion, mental illness or unsafe housing"],
         ["<b>Supervised consumption</b>","Supervised daily dosing is generally recommended for at least the initial 3 months (NICE TA114), relaxed to take-home doses only when adherence and stability are established — balancing diversion and overdose risk against engagement"],
         ["<b>Continue, don't interrupt</b>","Maintain OST through hospital admissions and custody; sudden cessation drives relapse and post-release overdose. Do not independently restart a previous maintenance dose after a treatment interruption — verify the current prescription, last administered dose and tolerance with the specialist service/pharmacy first"]
       ]},
       {b:"why", html:"Opioid substitution treatment is one of the most evidence-based interventions in medicine: it reduces illicit heroin use, all-cause and overdose mortality, injecting and blood-borne virus transmission, and acquisitive crime, while improving social functioning. The protective effect depends on retention — people are far safer in treatment than out of it — so the priorities are an individually titrated maintenance dose and keeping the person engaged, <b>rather than pushing prematurely toward an opioid-free state</b>. The two agents differ in risk profile: methadone's long, variable half-life means it accumulates over the first days of induction, which is why deaths cluster in the first two weeks and why induction is cautious and supervised; buprenorphine is a partial agonist with a ceiling on respiratory depression, making it safer in overdose, but it will precipitate acute withdrawal if started while a full agonist is still on board — so it is begun only once the person is objectively in withdrawal."},
       {b:"ladder", steps:[
         {step:"When to detox", title:"Only when the person is stable and has chosen it", when:"an informed abstinence goal",
          html:"Maintenance treatment is a valid long-term treatment, not a failure or an intermediate step that everyone must eventually complete. Detoxification should be voluntary, based on informed choice, clinically appropriate, planned, supported by psychosocial interventions and followed by relapse-prevention care for at least 6 months (NICE CG52). It should not be confused with stabilisation or gradual dose reduction."},
         {step:"How", title:"Gradual reduction", when:"tapering the substitute",
          fromLabel:"stable on OST",
          html:"Withdraw the substitute by tapering the dose under the specialist plan. Community detoxification is normally up to 12 weeks; inpatient/residential detoxification is normally shorter and reserved for people with greater complexity or risk (NICE CG52). The choice of agent for the withdrawal phase is a specialist decision."},
         {step:"Symptom relief", title:"Lofexidine", when:"during the reduction",
          fromLabel:"autonomic symptoms",
          html:"Lofexidine, an alpha-2 agonist, may be considered by the specialist detoxification team for opioid-withdrawal symptoms. Check the current SPC and local protocol for dosing, blood-pressure monitoring, bradycardia, electrolyte abnormalities and interactions. Add anti-emetics, anti-diarrhoeals and simple analgesia as needed. <b>Avoid unnecessary benzodiazepine prescribing.</b>"},
         {step:"Relapse prevention", title:"Naltrexone", when:"opioid-free and motivated",
          fromLabel:"detox completed",
          html:"Naltrexone, an oral opioid antagonist, can support abstinence in selected patients who have completed detox and are motivated to remain abstinent (NICE TA115). The patient must be opioid-free for an appropriate interval to avoid precipitated withdrawal; opioid analgesia will be blocked or less effective; relapse after naltrexone can be particularly dangerous because tolerance is reduced; assess liver disease and interactions. Initiation is specialist-led or under local shared care. <b>Combine with psychosocial support and mutual aid.</b>"},
         {step:"The danger point", title:"Overdose after detox", when:"tolerance is lost",
          fromLabel:"the moment risk rises",
          html:"Tolerance is lost during and after detox — relapse onto the previous dose can be fatal. Reducing OST is the moment overdose risk rises, so discuss the increased overdose risk and provide naloxone and overdose education before discharge."}
       ]},
       {b:"why", html:"<b>Detoxification is not the right first or only goal for everyone.</b> Detox without ongoing relapse-prevention support has high relapse rates, and — critically — relapse after the loss of tolerance carries a markedly increased risk of fatal overdose. That is why the UK guidelines frame maintenance OST as a legitimate long-term treatment and reserve detox for people who are stable, well-supported and have made an informed choice toward abstinence. Naltrexone blocks opioid receptors so that using produces no effect, removing the reward of relapse — it is only suitable once a person is fully opioid-free, otherwise it precipitates withdrawal, and works best in motivated patients with good psychosocial support. Lofexidine eases the autonomic symptoms during the reduction itself, improving the chance of completing detox."}
     ]},

    {id:"psychosocial", nav:"Psychosocial", title:"Psychosocial interventions and coexisting use",
     sub:"Medication and psychosocial support are complementary, not alternatives.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"🤝 Keyworking and care plan", html:"Every patient has a named keyworker and a recovery care plan, reviewed regularly. Pharmacological treatment works best embedded in structured psychosocial support, not given in isolation."},
         {tone:"blue", h:"📈 Evidence-based therapies", html:"Contingency management (incentives for drug-free tests or engagement), behavioural couples therapy, and structured psychosocial interventions improve outcomes alongside OST (NICE CG51)."},
         {tone:"green", h:"👥 Mutual aid", html:"Actively connect people to Narcotics Anonymous, SMART Recovery and local peer-support and recovery communities — facilitated access improves engagement."},
         {tone:"amber", h:"🍺 Coexisting use", html:"Treat comorbid alcohol, crack or cocaine and benzodiazepine use; manage stimulant use psychosocially. Do not abruptly stop benzodiazepines or alcohol in a dependent patient — withdrawal can be dangerous and requires a specialist plan. Address tobacco — smoking is the biggest cause of long-term mortality in this group."},
         {tone:"blue", h:"🧠 Dual diagnosis — \u201cno wrong door\u201d", html:"Coordinate with mental health services for coexisting serious mental illness — neither service should turn the person away."}
       ]},
       {b:"why", html:"NICE CG51 (2007) recommends contingency management alongside opioid substitution treatment and helping people make contact with mutual-aid groups. Contingency management — small, escalating incentives for objective markers such as drug-free tests or attendance — has the strongest evidence base for improving engagement and reducing illicit use. Dual diagnosis is common and is associated with worse outcomes when services work in silos: the principle of \u201cno wrong door\u201d means a person should be helped to access both substance-misuse and mental health care from whichever service they present to, rather than being bounced between them."}
     ]},

    {id:"lifestyle", nav:"Harm reduction", title:"Harm reduction and health promotion",
     sub:"Harm reduction accepts that not everyone will stop using immediately, and focuses on keeping people alive and healthier in the meantime.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"💉 Take-home naloxone", html:"Take-home naloxone is a high-priority harm-reduction intervention. Supply it with practical training for the patient and their family/carers to recognise and reverse an overdose, offer it repeatedly to everyone at risk, and reissue after use, loss or expiry."},
         {tone:"amber", h:"⚠️ Overdose awareness", html:"Don't use alone; don't mix with alcohol, benzodiazepines or pregabalin; remember tolerance is lost after any break in use; use a small \u201ctester\u201d amount after time off; call 999 early."},
         {tone:"blue", h:"🧷 Needle and syringe programmes", html:"Provide or refer for sterile injecting equipment with never-share advice, and offer safer-injecting and wound-care information to reduce infections and BBV transmission."},
         {tone:"green", h:"💉 Immunisation and BBV treatment", html:"Hepatitis B vaccination, hepatitis A and tetanus as indicated, and seasonal flu and COVID vaccines; refer hepatitis C for curative direct-acting antiviral treatment."},
         {tone:"blue", h:"🚭 Wider health", html:"Address smoking — the biggest long-term killer here — alcohol, sexual health and contraception, dental health and nutrition. Offer cervical screening and other routine prevention."},
         {tone:"cream", h:"🏠 Social recovery", html:"Support with housing, benefits and debt, employment and meaningful activity through social prescribing and recovery communities — \u201crecovery capital\u201d sustains change."}
       ]},
       {b:"why", html:"Take-home naloxone saves lives: overdoses are usually witnessed, and a bystander who can give intramuscular or intranasal naloxone buys the minutes needed for an ambulance to arrive. UK policy supports wide distribution of naloxone to people who use opioids and to their families and carers, and drug services can supply it without a prescription. <b>Repeated offers matter because kits get used, lost or left behind.</b> And tobacco deserves particular emphasis: smoking, not the opioid itself, is the leading cause of premature death in this population, so smoking cessation is a high-value and often overlooked intervention."}
     ]},

    {id:"monitor", nav:"Safety", title:"Monitoring, safe prescribing and continuing care",
     blocks:[
       {b:"table", head:["Issue","What to do"], rows:[
         ["<b>Missed doses and treatment gaps — critical</b>","After a treatment gap or three or more consecutive missed methadone doses: do not dispense the previous dose automatically; contact the prescriber/drug service and verify the dose and treatment status; assess current opioid use, withdrawal, intoxication and tolerance; follow the local missed-dose protocol and re-titrate under specialist guidance. For buprenorphine the restart approach depends on formulation, length of interruption and current opioid use"],
         ["<b>Diversion and intoxication</b>","Be alert to diversion, double-scripting and selling-on. Review if the person is intoxicated at pickup, repeatedly losing prescriptions, or tests negative for the prescribed drug — adjust supervision rather than abruptly stopping"],
         ["<b>Drug testing and review</b>","Use periodic drug testing and regular structured reviews to monitor progress and titrate supervision and take-home doses to stability. Re-check the QT interval or ECG at higher methadone doses, or with new QT-prolonging drugs"],
         ["<b>Transitions = danger</b>","Hospital admission, prison entry and release, detoxification, transfer between drug services, pharmacy or prescriber changes, and any treatment break are high-overdose-risk windows — plan continuity for each. Verify and continue the correct dose across transitions, and re-issue naloxone"],
         ["<b>Driving (DVLA)</b>","Patients must not drive if impaired by opioids, sedatives, intoxication or withdrawal. DVLA notification depends on the substance, prescribed treatment, dose, stability, impairment and licence group — check the current DVLA guidance for methadone, buprenorphine and illicit opioid use. A patient stable on prescribed OST is not automatically unfit to drive, but should be advised about impairment, sedation, treatment changes and the legal requirement to report relevant conditions where applicable"],
         ["<b>Safeguarding and family</b>","Keep dependent children, pregnancy and domestic-abuse risks under review at each contact and act on changes. Document the risk, the plan and the safety advice given"]
       ]},
       {b:"why", html:"Missed-dose reassessment is a key safety step: methadone tolerance falls quickly, and after three or more consecutive missed doses the usual maintenance dose can be enough to cause fatal toxicity. Local missed-dose protocols typically ask pharmacies to withhold and refer back for reassessment, and the prescriber reassesses and restarts or re-titrates rather than simply resuming — a key reason supervised consumption and good pharmacy communication are built into treatment. Risk is highest at transitions of care: release from prison carries a markedly increased risk of overdose death in the first weeks, and hospital admissions or treatment interruptions create the same loss-of-tolerance trap. Continuity — verifying the dose, continuing OST across settings, and re-issuing naloxone at every transition — is where primary care can directly prevent deaths."},
       {b:"cards", items:[
         {tone:"red", h:"🔴 999", html:"\u201cIf someone is hard to wake, breathing slowly or has tiny pupils — give the naloxone, put them on their side and call 999. Don't leave them, even if they wake up, because it can wear off.”"},
         {tone:"amber", h:"🟠 After any break", html:"\u201cIf you've been in prison or hospital, or off it for a few days, your tolerance drops. Never go back to your old amount — use a tiny tester amount, and never use alone.\u201d"},
         {tone:"blue", h:"💊 Missed doses", html:"“If you miss three days or more of your methadone, the pharmacy will not give the usual dose — we need to check with your drug service and see how you are before restarting, because the usual dose can be too much after a gap.”"},
         {tone:"green", h:"🧷 Keep the kit", html:"\u201cCome back for another naloxone kit any time — if you've used it, lost it, or it's out of date.\u201d"}
       ]},
       {b:"say", html:"The most important thing I can do today is keep you alive while we sort the rest out, and there are two parts to that. First, a naloxone kit for you and for whoever you're around — it buys minutes if the worst happens, and you can come back for another any time. Second, getting you referred to the drug service for a substitute, at a dose that suits you, so you're not chasing it: people do far better in treatment than out of it, and staying on it long-term is a legitimate choice, not a failure. I'd also like to do a drug test. The test helps us choose a safe starting dose and identify other substances that could increase overdose risk. It is part of safe prescribing, not a judgement about whether I believe you. And if you ever have a break — prison, hospital, a few clean days — come and talk to me before you use again."}
     ]},

    {id:"refer", nav:"Refer", title:"Referral, shared care and special groups",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999 / emergency", html:"Opioid overdose, suspected infective endocarditis or serious injecting-related infection, or acute suicide risk."},
         {tone:"amber", h:"Specialist drug and alcohol service", html:"<b>Refer promptly for comprehensive assessment and initiation of OST.</b> Specialist initiation, or an agreed local shared-care pathway with appropriately trained clinicians, is a prerequisite for GP prescribing; many practices then continue prescribing under shared care. Refer urgently for pregnancy, severe or complicated mental illness, recurrent failed treatment, complex polydrug use, uncertain dependence or tolerance, and initiation or major alteration of OST outside local shared care."},
         {tone:"red", h:"Pregnancy — urgent joint care", html:"Pregnancy with opioid dependence requires prompt joint management by the specialist drug service and maternity team. Continue or initiate appropriate opioid agonist treatment under specialist supervision; do not abruptly stop methadone or buprenorphine. Include a proportionate safeguarding assessment, antenatal booking and neonatal planning, hepatitis B/C and HIV testing, smoking and other substance-use support, and neonatal abstinence/withdrawal planning."},
         {tone:"blue", h:"Young people (under 18)", html:"Refer under-18s (age &lt; 18) to a specialist children and young people's substance-misuse service — assessment, consent and capacity, and safeguarding all differ from adults."},
         {tone:"blue", h:"Mental health liaison", html:"Coexisting serious mental illness, high suicide risk, or complex dual diagnosis — coordinate with mental health services."},
         {tone:"cream", h:"Other symptoms", html:"Opioid dependence is not itself a suspected-cancer presentation. Assess new pain, weight loss, bleeding or other possible cancer symptoms independently rather than attributing them to drug use."}
       ]},
       {b:"why", html:"Most opioid-dependence treatment in UK primary care happens through shared care: the specialist service assesses, stabilises and sets the treatment plan, and the GP continues prescribing and provides holistic care under an agreed framework with specialist back-up. Working within that agreement — and within your own competence and any local training requirements, such as the RCGP certificate in the management of drug misuse — is what makes GP involvement safe and effective. Pregnancy is a special situation where the instinct to \u201cget the patient off drugs\u201d is actively harmful: sudden opioid withdrawal in pregnancy is associated with miscarriage and preterm labour, and relapse risks overdose and disengagement from antenatal care. The guideline approach is stabilisation on OST with closely coordinated specialist drug and maternity care, planning for neonatal abstinence syndrome at delivery."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 34-year-old released from prison three days ago asks to be \u201cput back on my methadone — I was on 80 mg\u201d. He used heroin yesterday for the first time in four months. He has no drug test on file at your practice, injects into his groin, and mentions his partner is pregnant."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Does not reinstate 80 mg on history alone — recognises that four months in custody means lost tolerance and that the previous dose could be fatal; assesses dependence and current tolerance clinically, with drug testing in support and specialist advice, before any prescribing; gives take-home naloxone at this consultation, as a post-release patient in the highest-risk window; liaises with the drug service to verify the dose rather than guessing; asks about <b>groin injecting and offers BBV testing</b>; recognises the pregnancy as urgent joint specialist and maternity care, and does not suggest detox; and — the step candidates miss — identifies the safeguarding dimension of an expected baby without turning the consultation into a threat."}
     ]}]},

         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — methadone, buprenorphine, buprenorphine with naloxone, naloxone, naltrexone and lofexidine dosing</span></li>'+
         '</ul></div>'}

  foot:"Opioid dependence — Drug misuse and dependence: UK guidelines on clinical management (\u201cOrange Book\u201d, 2017), NICE TA114, CG52, CG51 and TA115, and the DHSC/MHRA/PHE guidance Widening the availability of naloxone (updated 2019; now OHID). Opioid substitution treatment initiation and dose changes must remain within local specialist or formally agreed shared-care arrangements. Drug testing supports, but does not replace, clinical assessment of dependence and tolerance. Analgesic opioid prescribing and tapering in chronic pain is a separate topic — see the <a href=\"opioid-prescribing.html\">opioid prescribing protocol</a>. Always work within your competence, local protocols and the patient's individual context."
