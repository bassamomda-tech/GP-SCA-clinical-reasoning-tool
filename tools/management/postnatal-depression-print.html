<script>
MG.render({
  icon:"🤱",
  title:"Postnatal depression — the complete guide",
  eyebrow:"Protocol · NICE CG192 · pregnancy and the first postnatal year",
  stemTitle:"The core safety task is separating three things that look alike in the first fortnight — self-limiting baby blues, treatable depression, and postpartum psychosis, which needs immediate specialist assessment, ideally within 4 hours",
  stemSub:"One page for the whole condition, covering pregnancy and the first year after childbirth (NICE CG192). <b>Maternal suicide remains a major cause of maternal death, particularly from 6 weeks to 1 year after the end of pregnancy (MBRRACE-UK)</b>, and postpartum psychosis deteriorates rapidly — so risk assessment and the infant come first at every contact. Ask the Whooley questions and, if positive or there is concern, use EPDS or PHQ-9 within a fuller assessment; recognise that <b>baby blues typically begins in the first week (often days 3–5) and resolves within 2 weeks</b> — persistent, worsening or impairing symptoms need assessment. Then stepped care: psychological therapy for mild to moderate, <b>sertraline often a preferred SSRI when breastfeeding</b>, and specialist perinatal care with a <b>Mother and Baby Unit</b> normally offered where inpatient care is needed. Assess for bipolar disorder by history before any antidepressant — postpartum relapse risk is high.",
  guideline:"NICE CG192 (2014, updated 2020) · NICE NG222 (2022, updated December 2025) · MBRRACE-UK 2025 · SPS/UKDILAS",
  reviewed:"14 September 2026",
  nextReview:"14 March 2027",
  meta:[
    {t:"NICE CG192 — antenatal and postnatal mental health"},
    {t:"Pregnancy and the first year after childbirth"},
    {t:"Postpartum psychosis = specialist assessment within 4 hours", tone:"tw"},
    {t:"Assess for bipolar BEFORE starting an antidepressant", tone:"tw"},
    {t:"v2.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#safety"><b>Emergencies</b><small>Psychosis · risk</small></a><a href="#detect"><b>Detect</b><small>Blues vs PND</small></a><a href="#treat"><b>Stepped care</b><small>Sertraline</small></a><a href="#support"><b>Support</b><small>HV · bonding</small></a><a href="#refer"><b>Refer</b><small>MBU · perinatal</small></a></div>',
  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Postpartum psychosis — assessment within 4 hours", html:"Sudden confusion, mania, hallucinations, delusions, marked behavioural change or rapidly shifting mood in the postnatal period is a psychiatric emergency. <b>Arrange immediate specialist perinatal mental-health assessment, with the aim of assessment within 4 hours.</b> If there is immediate danger, inability to maintain safety, or risk to the woman or infant, call emergency services. Do not leave the woman alone or rely on a routine community appointment. It usually occurs in the first 2 weeks but can occur later in the first postnatal year, and it is the diagnosis the first fortnight's \"baby blues\" can conceal."},
    {tone:"red", h:"⚠ Maternal suicide — a major cause of maternal death", html:"Maternal suicide remains a major cause of maternal death, particularly from 6 weeks to 1 year after the end of pregnancy (MBRRACE-UK). Any suicidal thoughts, intent, plan, recent self-harm or thoughts of harming the infant require a structured same-day risk assessment and appropriate crisis/perinatal mental-health input. <b>Assess bonding, infant care and safeguarding at every contact</b> — the infant is a second patient in this consultation."},
    {tone:"blue", h:"Baby blues resolves within 2 weeks — not depression", html:"<b>Baby blues typically begins in the first week after birth, often around days 3–5, and resolves within 2 weeks: reassure and monitor.</b> Persistent, worsening or functionally impairing symptoms require assessment for depression or another mental-health condition, and PND is not excluded because symptoms began very early. Postnatal depression is persistent low mood or anhedonia for 2 weeks or more, often within 1–3 months, with guilt, anxiety, sleep and appetite change and poor bonding. Ask the Whooley questions at relevant antenatal and postnatal contacts; if either is positive, there is concern or risk is increased, undertake a fuller assessment and consider EPDS or PHQ-9 to support assessment and monitoring. EPDS is not diagnostic, and a score alone does not determine urgency."},
    {tone:"green", h:"Sertraline is often preferred when breastfeeding", html:"<b>Sertraline is often a preferred SSRI when initiating treatment during breastfeeding because transfer into milk is generally low.</b> Consider previous response, psychiatric history, maternal preference, infant gestation and health, and the risk of switching an effective medicine. Start at a clinically appropriate dose and titrate according to the current product information and local guidance. Monitor the infant for sedation, agitation, sleep disturbance, diarrhoea, poor feeding and inadequate weight gain. Many antidepressants are generally compatible with breastfeeding, and untreated maternal depression carries real risks to mother and child — that comparison is the substance of the consent conversation, not a footnote to it. Do not stop an effective pre-existing antidepressant without discussion."},
    {tone:"red", h:"⚠ Assess for bipolar BEFORE starting an antidepressant", html:"Postpartum relapse risk in bipolar disorder is high, and an antidepressant can precipitate mania. Assess by history, not a single questionnaire: previous elevated or irritable mood, reduced need for sleep without fatigue, racing thoughts or pressured speech, grandiosity, impulsive or risky behaviour, previous psychiatric admission, previous postpartum psychosis, and family history of bipolar disorder or postpartum psychosis. If bipolar disorder is suspected, do not start antidepressant monotherapy without specialist advice."},
    {tone:"amber", h:"Check the differentials that mimic it", html:"Anxiety and OCD with intrusive thoughts · bipolar disorder · hypothyroidism and anaemia · psychosis. <b>Consider FBC/ferritin, TFTs and other physical investigations when fatigue, palpitations, weight change, temperature intolerance, bleeding, dietary risk, thyroid symptoms or other clinical features suggest anaemia, thyroid disease or another physical contributor</b> — testing is clinically directed, not an automatic screen."}
  ],
  pathwaySub:"Five steps, and the first is repeated at every contact.",
  pathway:[
    {title:"Screen for the emergencies", html:"Postpartum psychosis → immediate specialist perinatal assessment, ideally within 4 hours (emergency services if immediate danger). Suicidality, risk to the baby, severe depression → structured same-day risk assessment and crisis/perinatal input.", alert:true},
    {title:"Detect and differentiate", html:"Whooley questions, then fuller assessment with EPDS or PHQ-9 if positive or concerned; baby blues versus PND versus the mimics; assess for bipolar by history; ask directly about suicide, harm to the baby, psychosis and mania."},
    {title:"Stepped care by severity", html:"Mild/subthreshold: facilitated self-help or psychological intervention; mild to moderate: psychological therapy, medication considered by history and preference; moderate to severe: therapy and/or an antidepressant after a benefit–risk discussion; severe, psychotic, bipolar, suicidal or treatment-resistant: specialist perinatal care."},
    {title:"Mobilise the wider support", html:"Partner and family, health visitor, peer support, bonding work, and the physical basics — night-time support with feeds and sleep as a safety intervention, especially with bipolar risk."},
    {title:"Review closely and plan for next time", html:"1–2 weeks after starting; clinical review supported by EPDS or PHQ-9; continue at least 6 months after remission, longer if relapse risk is high; pre-conception planning for future pregnancies."}
  ],
  sections:[

    {id:"safety", nav:"Emergencies", title:"Step 1 — postpartum psychosis and risk",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Postpartum psychosis", html:"Sudden confusion, mania, hallucinations, delusions, marked behavioural change or rapidly shifting mood — usually in the first 2 weeks but possible later in the first postnatal year → a psychiatric emergency: immediate specialist perinatal mental-health assessment, aiming for assessment within 4 hours. Call emergency services if there is immediate danger, inability to maintain safety or risk to the woman or infant. Do not leave her alone or rely on a routine community appointment."},
         {tone:"red", h:"🔴 Suicidality or self-harm", html:"Any suicidal thoughts, intent, plan, recent self-harm or thoughts of harming the infant → structured same-day risk assessment plus crisis or perinatal mental-health input."},
         {tone:"amber", h:"🟠 Severe depression", html:"Inability to care for self or infant · not eating or drinking · severe agitation or retardation · psychotic symptoms · active suicidal intent or plan · recent suicide attempt · rapidly deteriorating mental state · severe insomnia with emerging activation or mania → same-day mental-health assessment, not simply therapy plus an SSRI."},
         {tone:"red", h:"👶 Infant safety", html:"<b>Assess bonding, infant care and safeguarding at every contact.</b> If the woman lacks capacity or there is immediate risk to the infant, safeguarding and mental-health legislation pathways take priority."}
       ]},
       {b:"dl", rows:[
         ["<b>Minimum structured risk assessment (document)</b>","Thoughts of death or self-harm · suicidal intent, plan and access to means · thoughts of harming the baby · previous attempts or self-harm · psychosis or mania · substance use · domestic abuse or coercive control · protective factors · supervision and infant-care arrangements · who has been informed and with what consent · crisis contact and follow-up plan"],
         ["<b>Low scores do not exclude risk</b>","A negative Whooley or low EPDS score does not exclude suicidal risk, psychosis, bipolar disorder or a rapidly deteriorating mental state. Ask directly whenever there is clinical concern"]
       ]},
       {b:"why", html:"Maternal suicide remains a major cause of maternal death, particularly from 6 weeks to 1 year after the end of pregnancy (MBRRACE-UK), and postpartum psychosis is a true emergency with rapid deterioration. Distinguishing these from self-limiting baby blues and from treatable depression is the core safety task — and all three can look similar in the first fortnight."}
     ]},

    {id:"detect", nav:"Detect", title:"Step 2 — detect and differentiate",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>Identify</b>","Ask the Whooley depression-identification questions at relevant antenatal and postnatal contacts. If either answer is positive, there is clinical concern, or the woman is at increased risk, undertake a fuller assessment and consider EPDS or PHQ-9 to support assessment and monitoring. EPDS is not diagnostic and does not replace clinical assessment, direct enquiry about suicidal thoughts, bipolar assessment, psychosis screening, or assessment of function, bonding and infant care"],
         ["<b>Determine severity clinically</b>","Not by EPDS score alone: suicidal ideation, intent, plan and access to means · thoughts of harming the infant · psychotic or manic symptoms · sleep independent of infant care · nutrition and hydration · ability to care for self and infant · bonding and support · domestic abuse or coercive control · substance use · previous episodes and treatment response"],
         ["<b>Baby blues</b>","Typically begins in the first week after birth, often around days 3–5, and resolves within 2 weeks; tearful and labile — reassure and monitor. Persistent, worsening or functionally impairing symptoms require assessment for depression or another mental-health condition"],
         ["<b>Postnatal depression</b>","Persistent low mood or anhedonia for 2 weeks or more, often within 1–3 months; guilt, anxiety, sleep and appetite change, poor bonding. Do not exclude it solely because symptoms began very early"],
         ["<b>Differentials</b>","Anxiety or OCD (intrusive thoughts), bipolar disorder (assess by history — high postpartum relapse risk), hypothyroidism, postpartum thyroiditis (anxiety, depression, fatigue, palpitations or weight change) or anaemia, psychosis"],
         ["<b>Bipolar history</b>","Ask directly about previous elevated or irritable mood, reduced need for sleep without fatigue, racing thoughts or pressured speech, grandiosity, impulsive or risky behaviour, previous psychiatric admission, previous postpartum psychosis, and family history of bipolar disorder or postpartum psychosis. If suspected, no antidepressant monotherapy without specialist advice"],
         ["<b>Family history</b>","Clarify a vague family \"breakdown\": what symptoms occurred, whether there was mania or psychosis, whether there was hospital admission, whether the relative had bipolar disorder, and how soon after birth symptoms developed. A clear first-degree history of severe perinatal mental illness → increased vigilance in the first 2 weeks and consider specialist perinatal referral"],
         ["<b>Physical investigations</b>","Targeted, not an automatic screen: consider FBC/ferritin, TFTs and other tests when fatigue, palpitations, weight change, temperature intolerance, bleeding, dietary risk, thyroid symptoms or other features suggest anaemia, thyroid disease or another physical contributor"]
       ]}
     ]},

    {id:"treat", nav:"Stepped care", title:"Step 3 — stepped care (CG192)",
     blocks:[
       {b:"table", head:["Level","What","Detail"], rows:[
         ["<b>Mild to moderate — psychological therapy</b>","<b>First-line</b>","Mild or subthreshold: facilitated self-help or a psychological intervention. Mild to moderate: guided self-help, CBT or interpersonal therapy, with medication considered according to history and preference. Prioritise rapid access in the perinatal period. Social support, health-visitor input, peer support"],
         ["<b>Moderate to severe — therapy ± antidepressant</b>","<b>Shared decision</b>","Therapy and/or an antidepressant after a benefit–risk discussion. Sertraline is often a preferred SSRI when breastfeeding because transfer into milk is generally low — consider previous response, psychiatric history, maternal preference, infant gestation and health, and the risk of switching an effective medicine. Start at a clinically appropriate dose, review tolerability and response, and titrate according to the current product information and local guidance; monitor the infant (sedation, agitation, sleep disturbance, diarrhoea, poor feeding, inadequate weight gain), particularly if premature, unwell or exposed to multiple psychotropics. Do not delay specialist referral in moderate-to-severe depression or significant risk. Discuss the benefits of breastfeeding, the potential risks of medication, the risks of stopping an effective medicine and alternatives that permit breastfeeding. Discuss the benefits and risks of treating versus untreated depression for mother AND baby; do not stop an effective pre-existing antidepressant without discussion"],
         ["<b>Specialist — perinatal mental health team</b>","<b>Escalate</b>","Severe, psychotic, bipolar, suicidality or treatment-resistant, or any history of severe mental illness even if currently well → specialist perinatal care. If inpatient psychiatric care is required within 12 months of childbirth, admission to a specialist Mother and Baby Unit should normally be offered where clinically and geographically appropriate, subject to bed availability, the woman's safety and the clinical circumstances; a general psychiatric or acute hospital setting may be needed for severe physical illness, immediate violence or other reasons preventing MBU admission"]
       ]},
       {b:"warn", html:"Do not advise stopping breastfeeding automatically. Many antidepressants are generally compatible with breastfeeding (sertraline often preferred when clinically appropriate, but consider previous response) — discuss untreated illness versus medication exposure, as untreated maternal depression carries real risks to mother and child. Do not stop effective psychotropic treatment abruptly. Assess for bipolar disorder by history before starting, because of the mania risk."}
     ]},

    {id:"support", nav:"Support", title:"Step 4 — the wider support",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"👨‍👩‍👧 Practical support", html:"Mobilise partner and family help with feeds and sleep — framed as a safety intervention, not simply lifestyle advice; reduce isolation."},
         {tone:"blue", h:"🏥 Health visitor", html:"Joint working; listening visits; monitor mother and infant development."},
         {tone:"green", h:"🤝 Peer support", html:"<b>Signpost to perinatal peer support and charities (e.g. PANDAS).</b>"},
         {tone:"blue", h:"🍼 Bonding", html:"Support mother–infant interaction; video-feedback interventions where available."},
         {tone:"amber", h:"😴 The physical basics", html:"Sleep, nutrition, gentle activity; consider FBC/ferritin and TFTs if clinical features suggest anaemia or thyroid disease."},
         {tone:"red", h:"🌙 Sleep loss and bipolar risk", html:"Marked sleep loss is both a symptom and a potential precipitant of mania or postpartum psychosis. <b>A woman with bipolar disorder or previous postpartum psychosis needs an explicit night-time support and escalation plan.</b>"},
         {tone:"green", h:"💬 Name the guilt", html:"\"It's not your fault and it doesn't make you a bad parent\" — said explicitly, because the guilt is often what delays presentation."}
       ]}
     ]},

    {id:"monitor", nav:"Review", title:"Step 5 — close review and future pregnancies",
     blocks:[
       {b:"dl", rows:[
         ["<b>1–2 weeks</b>","Early review, especially after starting medication — reassess mood, risk, side effects and the infant"],
         ["<b>Ongoing</b>","Clinical review, with EPDS or PHQ-9 to support monitoring; continue the antidepressant for at least 6 months after remission, and consider longer treatment where relapse risk is high, including previous recurrent depression, severe episodes, bipolar-spectrum illness or previous postpartum psychosis. Do not stop abruptly. Coordinate with the health visitor"],
         ["<b>Future pregnancies</b>","High recurrence risk — pre-conception and early-pregnancy planning, especially with bipolar disorder or previous postpartum psychosis"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 Crisis", html:"\"If you ever feel unsafe, or have frightening thoughts about yourself or the baby, contact us straight away — we can get help the same day.\""},
         {tone:"red", h:"🔴 Rapid change", html:"\"If you become confused, can't sleep at all, or start thinking or behaving very differently — that needs urgent help straight away — call 999 if you or the baby are in immediate danger.\""},
         {tone:"amber", h:"⚠️ Early weeks on medication", html:"\"If you feel more agitated or low in the first weeks of an antidepressant, contact us promptly.\""},
         {tone:"green", h:"🫂 It is treatable", html:"\"What you're feeling is common and treatable — it's not your fault and it doesn't make you a bad parent.\""}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Emergency", html:"Hallucinations, delusions, confusion, mania, severe behavioural change or rapidly deteriorating mental state → immediate specialist perinatal assessment, ideally within 4 hours. Suicidality or risk to the baby → same-day perinatal or crisis team. Call emergency services if there is immediate danger, inability to maintain safety or serious risk to the woman or infant."},
         {tone:"amber", h:"Perinatal mental health", html:"Moderate to severe, bipolar, complex or treatment-resistant; any history of severe mental illness (even if currently well); a clear first-degree family history of severe perinatal mental illness (consider). If inpatient care is needed, a Mother and Baby Unit should normally be offered where clinically and geographically appropriate, to keep mother and infant together."},
         {tone:"blue", h:"Talking therapies", html:"<b>Prioritised perinatal access for mild to moderate cases.</b>"},
         {tone:"red", h:"Safeguarding", html:"<b>Where infant welfare is a concern — follow local pathways.</b>"},
         {tone:"cream", h:"GP management", html:"Screening and differentiation, structured risk and infant assessment, bipolar assessment by history, stepped care including the breastfeeding-compatible SSRI, the wider support and the review schedule all belong here. Related pages: <a href='depression.html'>depression</a> · <a href='anxiety.html'>anxiety</a> · <a href='ocd.html'>OCD</a> · <a href='hypothyroidism.html'>hypothyroidism</a> · <a href='iron-deficiency-anaemia.html'>iron deficiency anaemia</a>."}
       ]},
       {b:"say", html:"What you're feeling is common and treatable — it's not your fault and it doesn't make you a bad parent. Talking therapy helps, and if we use an antidepressant there are ones that are generally compatible with breastfeeding, and we would keep an eye on the baby too. If you ever feel unsafe, or have frightening thoughts, contact us straight away — we can get help the same day."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 31-year-old woman attends at <b>7 weeks postpartum</b> with her first baby, brought by her partner. She is <b>tearful, not sleeping even when the baby sleeps</b>, says she feels \"nothing\" towards the baby and is <b>convinced she is a terrible mother</b>. EPDS is <b>19</b>. She is <b>breastfeeding</b> and asks whether she would have to stop to take anything. Her sister \"had a breakdown after her first baby and was admitted\". She denies wanting to harm herself but says \"they'd all be better off\"."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Treats \"they'd all be better off\" as passive suicidal ideation and explores it directly rather than accepting the denial — maternal suicide being a major cause of maternal death, particularly from 6 weeks to 1 year after pregnancy, is the reason this cannot be deferred; asks specifically about thoughts of harming the baby and assesses bonding and infant care; clarifies the sister's history (symptoms, mania or psychosis, admission, bipolar diagnosis, timing after birth) and assesses for bipolar by history BEFORE prescribing, which is the key safety step here; answers the breastfeeding question directly — she does not need to stop breastfeeding; sertraline is often a preferred SSRI because milk transfer is generally low, the infant is monitored, and untreated depression carries its own risks to mother and baby; does not rely on EPDS 19 alone but determines severity clinically, recognising that the passive suicidal ideation warrants urgent risk assessment and likely same-day perinatal/crisis discussion, not watchful waiting; <b>considers FBC/ferritin and TFTs if clinical features suggest a physical contributor</b>; <b>involves the health visitor and the partner</b>; <b>names the guilt explicitly</b>; and gives the same-day safety-net for rapid change or frightening thoughts."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>NICE CG192 — Antenatal and postnatal mental health: clinical management and service guidance (2014, updated 2020)<br><a href="https://www.nice.org.uk/guidance/cg192" rel="noopener">nice.org.uk/guidance/cg192</a><span class="rd"> — scope: pregnancy and the first year after childbirth; Whooley depression-identification questions with EPDS or PHQ-9 as part of a fuller assessment or monitoring; immediate assessment of suspected postpartum psychosis by secondary (preferably specialist perinatal) mental health services within 4 hours of referral; specialist perinatal involvement for severe mental illness or any history of it; Mother and Baby Unit normally for inpatient care within 12 months of childbirth; the breastfeeding benefit–risk discussion; the stepped-care model with psychological therapy first-line for mild to moderate depression, antidepressants for moderate to severe with a benefit\u2013risk discussion covering untreated illness, the requirement to assess for bipolar disorder, and referral to specialist perinatal services including Mother and Baby Units</span></li>'+
         '<li><b>NICE NG222 \u2014 Depression in adults: treatment and management (2022, updated December 2025)</b><br><a href="https://www.nice.org.uk/guidance/ng222" rel="noopener">nice.org.uk/guidance/ng222</a><span class="rd"> — continuing an antidepressant for at least 6 months after remission. (The baby blues timeframe, the 2-week symptom threshold and the physical differentials such as postpartum thyroiditis and anaemia are standard clinical practice rather than CG192 wording; sertraline as an often-preferred SSRI when breastfeeding comes from SPS/UKDILAS, below.) Longer continuation is considered where relapse risk is high.</span></li>'+
         '<li>UK Drugs in Lactation Advisory Service (UKDILAS) / Specialist Pharmacy Service<br><a href="https://www.sps.nhs.uk" rel="noopener">sps.nhs.uk</a><span class="rd"> — Using SSRI antidepressants during breastfeeding: sertraline and paroxetine as preferred SSRIs because milk transfer is low; advice applies mainly to full-term healthy infants, and infant monitoring is still required</span></li>'+
         '<li><b>MBRRACE-UK — Saving Lives, Improving Mothers\u2019 Care (2025 report, 2021\u201323 data)</b><br><a href="https://www.npeu.ox.ac.uk/mbrrace-uk" rel="noopener">npeu.ox.ac.uk/mbrrace-uk</a><span class="rd"> — maternal suicide is the leading cause of death between 6 weeks and 1 year after the end of pregnancy, which underpins the risk-first structure of this page</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — sertraline product information (titrate according to current product information and local guidance) and the antidepressant discontinuation guidance</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Perinatal and postnatal depression — NICE CG192 (2014, updated 2020), NICE NG222 (2022, updated December 2025), SPS/UKDILAS and MBRRACE-UK (2025). Covers pregnancy and the first year after childbirth. Maternal suicide remains a major cause of maternal death, particularly from 6 weeks to 1 year after the end of pregnancy, so structured risk and infant-safety assessment come first at every contact. Postpartum psychosis — usually in the first 2 weeks but possible later in the first year, with mania, confusion, hallucinations or delusions — needs immediate specialist perinatal assessment, ideally within 4 hours. Baby blues typically begins around days 3–5 and resolves within 2 weeks. Ask the Whooley questions, use EPDS or PHQ-9 within a fuller assessment (not diagnostic), and assess for bipolar disorder by history BEFORE starting an antidepressant. Psychological therapy first-line for mild to moderate; sertraline is often a preferred SSRI when breastfeeding, titrated per current product information with infant monitoring, and untreated depression carries real risks of its own. Continue for at least 6 months after remission, and plan ahead for future pregnancies. Verify against current NICE CG192 and UKDILAS."
});
</script>
