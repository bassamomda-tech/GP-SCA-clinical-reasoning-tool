  foot:"Perinatal and postnatal depression — NICE CG192, NICE, UKDILAS and MBRRACE-UK. Suicide is a leading cause of maternal death in the year after birth, so risk and infant safety come first at every contact. Postpartum psychosis — rapid onset in the first 2 weeks with mania, confusion or delusions — is a same-day emergency. Baby blues on days 3–10 is self-limiting and is not depression. Screen with Whooley and EPDS, and screen for bipolar disorder BEFORE starting an antidepressant. Psychological therapy first-line for mild to moderate; sertraline 50 mg titrated to 100–200 mg is the usual SSRI when breastfeeding, and untreated depression carries real risks of its own. Continue for at least 6 months after recovery, and plan ahead for future pregnancies. Verify against current NICE CG192 and UKDILAS."
