<title>OCD — Protocol · Reasoning GP</title>
<meta name="description" content="Obsessive-compulsive disorder under NICE CG31: stepped care with CBT and exposure and response prevention as the active ingredient, choice of SSRI or high-intensity CBT/ERP for moderate OCD and both for severe, SSRIs titrated towards the upper licensed range only where needed with an adequate trial of around 12 weeks, multidisciplinary review before a different SSRI or clomipramine, and family accommodation as a treatment target." />

<script>
MG.render({
  icon:"🧠",
  title:"OCD — the complete guide",
  eyebrow:"Protocol · NICE CG31 · stepped care, adequate SSRI trial before switching",
  stemTitle:"Two things cause premature switching in OCD: stopping short of an adequate SSRI dose, and judging response before an adequate trial of around 12 weeks",
  stemSub:"One page for the whole condition. Match treatment to severity on the stepped-care model. CBT with exposure and response prevention is the first-line psychological treatment, and ERP — deliberately facing triggers without ritualising — is the active ingredient, not an optional component. Some people with OCD require SSRI titration towards the upper part of the licensed dose range, and an adequate trial of around 12 weeks before switching. For mild OCD offer low-intensity CBT including ERP; for moderate OCD a choice of an SSRI or high-intensity CBT/ERP; for severe OCD combined SSRI and high-intensity CBT/ERP. And ask about <b>family accommodation</b> — relatives giving reassurance or joining rituals — and address it within CBT/ERP.",
  guideline:"NICE CG31 (2005) · BNF · current SPCs and local mental-health prescribing policy",
  reviewed:"14 September 2026",
  nextReview:"14 March 2027",
  meta:[
    {t:"NICE CG31 — obsessive-compulsive disorder"},
    {t:"SSRI: titrate as needed, adequate ~12-week trial", tone:"tw"},
    {t:"ERP is the active ingredient of the therapy", tone:"tw"},
    {t:"v2.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#confirm"><b>Confirm</b><small>Severity · risk</small></a><a href="#therapy"><b>CBT + ERP</b><small>First-line</small></a><a href="#drug"><b>SSRI</b><small>Titrate · adequate trial</small></a><a href="#monitor"><b>Review</b><small>12 weeks</small></a><a href="#refer"><b>Refer</b><small>Severe · refractory</small></a></div>',
  quickSub:"The five that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"amber", h:"⚠ Adequate dose, adequate trial — do not switch prematurely", html:"Some people with OCD <b>may require titration towards the upper part of the licensed dose range</b>, often higher than doses commonly used for depression. Increase gradually according to response, tolerability, age, comorbidity and the individual product information — NICE: consider a gradual dose increase after 4–6 weeks if response is inadequate and side effects are not significant. Do not conclude the SSRI has failed until there has been an <b>adequate, adherent trial, generally around 12 weeks</b>, including a period at the maximum tolerated/licensed dose where clinically appropriate — not 12 weeks at the maximum dose."},
    {tone:"blue", h:"ERP is the active ingredient, not a component", html:"CBT with exposure and response prevention — graded exposure to triggers while resisting the compulsion — is the first-line psychological treatment. For <b>mild</b> OCD, offer low-intensity CBT including ERP (usually up to 10 therapist hours). For <b>moderate</b> OCD, offer a choice of an SSRI or high-intensity CBT/ERP, guided by preference and availability. For <b>severe</b> OCD, offer combined SSRI and high-intensity CBT/ERP. Generic counselling alone should not be counted as an adequate OCD psychological treatment trial; the intervention should include CBT with ERP, practised between sessions."},
    {tone:"green", h:"Ask about family accommodation", html:"Ask whether relatives or carers provide reassurance, participate in rituals or change household routines to reduce the patient’s distress. This is often called family accommodation — a recognised maintaining factor and treatment target in specialist OCD/ERP literature (not a direct NICE CG31 statement). Discuss it non-judgementally and address it within CBT/ERP, with support for carers; accommodation is usually an understandable attempt to reduce distress. For children and young people, family/carer involvement is part of CBT/ERP (NICE CG31)."},
    {tone:"red", h:"⚠ Assess risk and comorbidity", html:"Suicidality, severe self-neglect, and impact on dependants or safeguarding. <b>Monitor all patients early in treatment and during dose changes</b>, with particular vigilance in younger people (under 25) and those with depression, agitation, substance use or previous self-harm. Depression, anxiety, tics, eating disorder and substance misuse are common and each can worsen or mask the OCD."},
    {tone:"blue", h:"Escalation: MDT review, combine, then switch", html:"Inadequate response to an SSRI alone or CBT/ERP alone → <b>multidisciplinary review</b> and offer <b>combined SSRI plus CBT/ERP</b>. If still inadequate after 12 weeks of combined treatment, or CBT/ERP has not been engaged with → a <b>different SSRI or clomipramine</b> (risk-based ECG and BP; small quantities where overdose risk). After failure of an SSRI, combined treatment and clomipramine → specialist OCD/BDD multidisciplinary team."}
  ],
  pathwaySub:"Five steps, and the timing in step four is what most often goes wrong.",
  pathway:[
    {title:"Confirm OCD, grade severity, assess risk", html:"Obsessions plus compulsions that are distressing and time-consuming; functional impact sets the stepped-care level. Exclude mimics (psychosis, obsessive-compulsive personality traits, BDD, hoarding, autism, tics, eating disorder, substances, bipolar disorder, neurological causes) and assess risk.", alert:true},
    {title:"CBT with ERP as first-line", html:"Low-intensity CBT including ERP for mild; a choice of SSRI or high-intensity CBT/ERP for moderate; combined SSRI plus high-intensity CBT/ERP for severe. Ask about family accommodation and address it within CBT/ERP."},
    {title:"Add an SSRI where indicated", html:"Start at a standard dose and titrate gradually — consider an increase after 4–6 weeks if tolerated and response is inadequate, using the upper licensed/local range only when appropriate. Explain the delayed onset."},
    {title:"Allow an adequate trial (around 12 weeks) before judging it", html:"Then multidisciplinary review and combined SSRI plus CBT/ERP if not already in place; if still inadequate, a different SSRI or clomipramine. Combined treatment from the start for severe disease."},
    {title:"Review risk, dose and therapy engagement", html:"Continue an effective SSRI (or clomipramine) for at least 12 months after remission/response, then review the need for ongoing treatment; continue relapse-prevention ERP/CBT; taper gradually if stopping."}
  ],
  sections:[

    {id:"confirm", nav:"Confirm", title:"Step 1 — confirm OCD, severity and risk",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>Features</b>","Obsessions (intrusive thoughts) and/or compulsions (repetitive acts or rituals) with distress, impairment or substantial time consumption. Assess functional impact, avoidance and insight; consider the Y-BOCS or another validated scale where available"],
         ["<b>Severity</b>","Functional impact — mild, moderate or severe — guides the stepped-care level"],
         ["<b>Risk</b>","Suicidal thoughts, intent, plan, access to means, previous attempts or self-harm, impulsivity and substance use, psychosis or severe depression, protective factors, ability to maintain safety, severe self-neglect, and safeguarding of children/dependants. A single PHQ-9 item is not a risk assessment. For significant or imminent risk, arrange urgent mental-health assessment and do not leave the patient unsupported"],
         ["<b>Comorbidity</b>","Depression, anxiety, tics, eating disorder, substance misuse — all common; also screen for mania/bipolar disorder and psychosis"],
         ["<b>Differentials</b>","Obsessive-compulsive personality traits versus OCD; psychosis or delusional beliefs; body dysmorphic disorder; hoarding disorder; autism-related repetitive behaviours; tic disorders; eating disorders; substance-induced symptoms; bipolar disorder; neurological causes where onset is atypical or abrupt"],
         ["<b>Intrusive thoughts</b>","Obsessions may be violent, sexual, blasphemous or otherwise unacceptable to the patient and do not automatically indicate intent or psychosis. Ask about distress and unwantedness, insight, intent, planning, behavioural control, and avoidance and compulsions"],
         ["<b>Outside this protocol</b>","Children and young people → specialist CAMHS/paediatric pathway with family/carer involvement; pregnancy or breastfeeding, bipolar disorder, psychosis or significant comorbidity → seek specialist (including perinatal) mental-health advice before starting or escalating medication"]
       ]},
       {b:"why", html:"OCD responds to two evidence-based treatments — CBT with ERP and SSRIs — matched to severity via stepped care. Two features differ from depression: SSRIs may require titration towards the upper licensed range and an adequate trial (around 12 weeks) before response is judged, and ERP — deliberately facing triggers without ritualising — is the active ingredient of the therapy."}
     ]},

    {id:"therapy", nav:"CBT + ERP", title:"Step 2 — CBT with exposure and response prevention",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"🧠 CBT + ERP", html:"First-line psychological treatment — graded exposure to triggers while resisting compulsions; low-intensity CBT including ERP for mild; high-intensity CBT/ERP or an SSRI (by preference) for moderate; high-intensity CBT/ERP combined with an SSRI for severe."},
         {tone:"green", h:"📚 Psychoeducation", html:"Explain the obsession–anxiety–compulsion–relief cycle and how ERP breaks it."},
         {tone:"green", h:"👨‍👩‍👧 Involve family", html:"Ask whether relatives provide reassurance, join rituals or change household routines (family accommodation). Discuss it non-judgementally — it is usually an understandable attempt to reduce distress — and address it within CBT/ERP, with support for carers."},
         {tone:"blue", h:"📱 Guided self-help", html:"<b>For mild OCD — CBT-based self-help and digital resources.</b>"},
         {tone:"green", h:"🔗 Function", html:"<b>Support work and education; address avoidance.</b>"},
         {tone:"amber", h:"🧩 Comorbidity", html:"<b>Address depression and anxiety that worsen or mask the OCD.</b>"},
         {tone:"amber", h:"💬 Counselling is not ERP", html:"Generic counselling alone should not be counted as an adequate OCD psychological treatment trial; the intervention should include CBT with exposure and response prevention. Supportive therapy may still be useful alongside ERP for comorbid depression, trauma, family stress or crisis management."}
       ]}
     ]},

    {id:"drug", nav:"SSRI", title:"Step 3 — SSRIs: titrate carefully, allow an adequate trial",
     blocks:[
       {b:"table", head:["Step","What","When"], rows:[
         ["<b>Step 1 — an SSRI</b>","Sertraline, fluoxetine, paroxetine, fluvoxamine or citalopram, started at a standard dose (lower starting doses in anxiety-sensitive patients; slower titration in older adults). Citalopram: dose-dependent QT prolongation, age-related maximum doses and interactions — check current product information/local formulary. Higher doses (e.g. sertraline 200 mg, fluoxetine 60 mg) are possible maxima, not universal targets: dose escalation must follow the current SPC/local formulary and should normally be discussed with mental-health services when doses exceed usual depression ranges. Before escalating, confirm the diagnosis, document informed consent, check interactions and QT risk, screen for bipolar disorder, consider pregnancy and breastfeeding, ask about previous SSRI activation, akathisia or suicidality, review adverse effects and arrange early follow-up. Counsel on delayed onset","<b>May require titration towards the upper licensed range</b>"],
         ["<b>Adequate trial — around 12 weeks</b>","Review risk and tolerability at 1–2 weeks; if no adequate response after 4–6 weeks and side effects are acceptable, consider a gradual dose increase. Do not judge failure until an adequate, adherent trial of around 12 weeks, including a period at the maximum tolerated/licensed dose where clinically appropriate (not 12 weeks at maximum dose). Review adherence and alcohol/substance use","<b>Dose optimised during the trial</b>"],
         ["<b>Step 2 — multidisciplinary review and combine</b>","Inadequate response to an SSRI alone or CBT/ERP alone → multidisciplinary review; offer combined SSRI plus CBT/ERP. Confirm that ERP was actually delivered and practised","<b>Inadequate response after an adequate trial</b>"],
         ["<b>Step 3 — different SSRI or clomipramine</b>","If inadequate response after 12 weeks of combined treatment, or CBT/ERP not engaged with → a different SSRI or clomipramine. Before clomipramine, assess cardiovascular risk, medication interactions and overdose risk; obtain an ECG and blood pressure in patients with cardiovascular disease, significant cardiovascular risk, older age, cardiac symptoms, relevant family history or other QT-prolonging medicines (broader ECG use is local practice, not an unconditional NICE requirement); prescribe small quantities where suicide risk is significant. Cautions: arrhythmia and QT prolongation, epilepsy, glaucoma and urinary retention, anticholinergic burden, constipation, interactions with SSRIs and other serotonergic drugs, toxicity in overdose","<b>After combined treatment</b>"],
         ["<b>Severe — combination from the start</b>","Combined SSRI plus high-intensity CBT/ERP initially (moderate OCD is offered a choice of SSRI or high-intensity CBT/ERP). After failure of an SSRI, combined treatment and clomipramine → specialist OCD/BDD multidisciplinary team","<b>Severe functional impairment</b>"]
       ]},
       {b:"warn", html:"OCD may require titration towards the upper licensed SSRI range and an adequate trial of around 12 weeks — don't switch prematurely. Monitor all patients early and after dose changes for activation, akathisia, agitation, worsening anxiety, emergent suicidal thoughts and manic symptoms, with particular vigilance under 25. Before clomipramine, ECG and BP where there is cardiovascular disease or significant cardiovascular risk, and small quantities where overdose risk is significant."}
     ]},

    {id:"monitor", nav:"Review", title:"Steps 4–5 — response, risk and dose",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["<b>Risk and early effects</b>","<b>1–2 weeks after starting (1 week if under 30 or at risk)</b>","<b>Watch for activation, akathisia, agitation, worsening anxiety, suicidal thoughts and manic symptoms; review again after dose changes; escalate if risk rises</b>"],
         ["<b>Symptoms and function</b>","<b>Each review</b>","<b>Track over an adequate trial (around 12 weeks) before judging the SSRI</b>"],
         ["<b>Dose</b>","<b>During titration</b>","<b>Consider a gradual increase after 4–6 weeks if tolerated and response is inadequate; upper licensed/local range only when appropriate</b>"],
         ["<b>Therapy engagement</b>","<b>Ongoing</b>","<b>Ensure CBT/ERP is accessed AND practised between sessions</b>"]
       ]},
       {b:"dl", rows:[
         ["<b>1–2 weeks after starting the drug</b>","Early review: risk, tolerability, expectation-setting; refer for CBT/ERP"],
         ["<b>Over around 12 weeks</b>","Response review: titrate the dose as tolerated; assess over an adequate, adherent trial before multidisciplinary review or switching"],
         ["<b>Ongoing</b>","Continuation: continue an effective SSRI or clomipramine for at least 12 months after remission/response, then review the need for ongoing treatment (not all patients need indefinite medication); continue relapse-prevention ERP/CBT. When stopping, taper gradually over several weeks or longer, accounting for half-life, dose and withdrawal history; continue or re-offer ERP/CBT; warn about relapse as well as withdrawal; escalate if refractory"]
       ]}
     ]},

    {id:"notresponding", nav:"Not responding?", title:"Not responding? Check before switching",
     sub:"Confirm the diagnosis and severity, adherence, an adequate dose and duration (around 12 weeks), and genuine ERP engagement before switching.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"1 · Dose and duration", html:"<b>Was it an adequate, adherent trial (around 12 weeks, dose optimised as tolerated)? Any interactions or alcohol/substance use?</b>"},
         {tone:"blue", h:"2 · ERP", html:"Is the therapy genuinely ERP-based, and being practised between sessions?"},
         {tone:"green", h:"3 · Accommodation", html:"<b>Are relatives giving reassurance or joining rituals (family accommodation)? Address it non-judgementally within CBT/ERP.</b>"},
         {tone:"amber", h:"4 · Comorbidity", html:"<b>Untreated depression or anxiety undermining progress?</b>"},
         {tone:"blue", h:"5 · Escalate", html:"<b>Adequate trial failed → multidisciplinary review and combined SSRI plus CBT/ERP; then a different SSRI or clomipramine; refer to a specialist OCD/BDD MDT after failure of all three.</b>"}
       ]}
     ]},

    {id:"safety", nav:"Safety-net", title:"Safety-netting",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Crisis", html:"\"If you feel unsafe or have thoughts of ending your life — call 999, go to A&amp;E, or ring NHS 111 or Samaritans on 116 123.\""},
         {tone:"blue", h:"⏳ Be patient", html:"\"The tablets can take longer to work in OCD than in depression — stick with it and we'll review the dose.\""},
         {tone:"amber", h:"⚠️ Early worsening", html:"\"If you feel more agitated, restless, anxious, low or unusually high in the first weeks of an antidepressant or after a dose change, or have thoughts of harming yourself, contact us promptly.\""},
         {tone:"green", h:"🔄 Resisting rituals", html:"\"The therapy works by facing triggers without doing the ritual — it feels hard at first but the anxiety fades.\""}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"When to refer",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Urgent", html:"Significant or imminent suicide risk or severe functional collapse → urgent mental-health assessment; do not leave the patient unsupported."},
         {tone:"amber", h:"Severe", html:"Severe OCD, or marked impairment → specialist mental-health or OCD service."},
         {tone:"amber", h:"Refractory", html:"After failure of an adequate SSRI trial, combined SSRI plus CBT/ERP, and clomipramine → multidisciplinary specialist OCD/BDD assessment."},
         {tone:"blue", h:"Diagnostic complexity", html:"Significant comorbidity (tics, eating disorder, psychosis, bipolar disorder) or diagnostic doubt; children and young people (specialist CAMHS/paediatric pathway with family/carer involvement); pregnancy or breastfeeding (seek perinatal mental-health advice)."},
         {tone:"cream", h:"GP management", html:"Diagnosis and severity, the CBT/ERP referral, the SSRI at an adequate dose and duration, the family-accommodation conversation, and the review schedule all belong here. Use local (e.g. Greater Manchester) mental-health and OCD referral arrangements. Related pages: <a href='anxiety.html'>anxiety</a> · <a href='depression.html'>depression</a> · <a href='ptsd.html'>PTSD</a> · <a href='postnatal-depression.html'>postnatal depression</a>."}
       ]},
       {b:"say", html:"OCD is very treatable. The two things that work are a specific therapy — facing the triggers without doing the rituals — and antidepressants, which in OCD may need a higher dose and a bit longer to work. Depending on how much it is affecting your life, we can start with one or, if it is severe, both — and review."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 26-year-old man describes <b>contamination fears and handwashing taking 3 hours a day</b>, with skin breakdown. He was started on <b>fluoxetine 20 mg</b> ten weeks ago and <b>switched to citalopram 20 mg at week six</b> because \"it wasn't working\". He has had <b>four sessions of generic counselling</b>, not ERP. His mother <b>buys the antibacterial products and does his laundry separately</b> to keep him calm. He is late for work most days and fears losing his job."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Identifies the two errors driving the failure: the SSRI was switched at 6 weeks, before an adequate trial of around 12 weeks, and neither agent was titrated as tolerated towards the dose OCD may require; <b>recognises that generic counselling is not ERP</b>, and refers specifically for CBT with exposure and response prevention rather than re-referring for \"therapy\"; names the mother's behaviour as family accommodation and explains, without blame, that this understandable attempt to reduce distress can maintain the symptoms and is addressed within CBT/ERP — the patient may not volunteer it; <b>titrates the current SSRI properly rather than switching again</b>, and sets the 12-week expectation explicitly; <b>assesses risk and the skin breakdown</b>; addresses the employment threat as a functional-impact marker and a reason for prompt therapy access; and <b>knows the next steps after an adequate trial fails</b> — multidisciplinary review and combined SSRI plus CBT/ERP, then a different SSRI or clomipramine (risk-based ECG and BP; small quantities where overdose risk)."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE CG31 — Obsessive-compulsive disorder and body dysmorphic disorder</b><br><a href="https://www.nice.org.uk/guidance/cg31" rel="noopener">nice.org.uk/guidance/cg31</a><span class="rd"> — the stepped-care model: low-intensity CBT including ERP for mild OCD; a choice of SSRI or more intensive CBT/ERP for moderate OCD; combined SSRI plus high-intensity CBT/ERP for severe OCD; gradual SSRI dose increase considered after 4–6 weeks; a full SSRI trial of around 12 weeks; multidisciplinary review and combined treatment before a different SSRI or clomipramine; ECG and BP before clomipramine where there is significant cardiovascular risk; specialist OCD/BDD multidisciplinary assessment when refractory</span></li>'+
         '<li><b>NICE CG31 \u2014 Obsessive-compulsive disorder and body dysmorphic disorder</b><br><a href="https://www.nice.org.uk/guidance/cg31" rel="noopener">nice.org.uk/guidance/cg31</a><span class="rd"> — the review intervals, family/carer involvement in CBT/ERP for children and young people, continuation for at least 12 months after remission, gradual discontinuation, and the referral thresholds. Family accommodation as a maintaining factor and treatment target is drawn from specialist OCD/ERP literature rather than a direct CG31 statement</span></li>'+
         '<li><b>BNF and MHRA advice on antidepressants</b><span class="rd"> — early monitoring for suicidality, activation and akathisia in all patients, with particular vigilance in those under 25; clomipramine cautions (QT prolongation and arrhythmia, epilepsy, glaucoma, urinary retention, anticholinergic burden, serotonergic interactions, toxicity in overdose)</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — sertraline, fluoxetine, paroxetine, fluvoxamine and clomipramine dosing; dose escalation must follow the current SPC and local formulary/mental-health prescribing policy</span></li>'+
         '<li><b>Summaries of Product Characteristics</b> (electronic Medicines Compendium)<br><a href="https://www.medicines.org.uk/emc" rel="noopener">medicines.org.uk/emc</a><span class="rd"> — product-specific licensed OCD doses and maximum doses, citalopram QT and age-related maximum doses, clomipramine cautions</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Obsessive-compulsive disorder — NICE CG31 (2005). Stepped care by severity. CBT with exposure and response prevention is first-line, and ERP is the active ingredient — generic counselling alone is not an adequate trial. Mild: low-intensity CBT including ERP; moderate: a choice of SSRI or high-intensity CBT/ERP; severe: combined SSRI and high-intensity CBT/ERP. SSRIs may require titration towards the upper licensed range and an adequate trial of around 12 weeks before response is judged. Then multidisciplinary review and combined treatment, then a different SSRI or clomipramine (risk-based ECG and BP; small quantities where overdose risk). Continue effective treatment for at least 12 months after remission and taper gradually. Ask about family accommodation non-judgementally and address it within CBT/ERP. Monitor all patients early and after dose changes, especially under 25. Verify all doses against the current SPC, BNF and local formulary before prescribing."
});
</script>
