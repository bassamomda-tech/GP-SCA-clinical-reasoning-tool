MG.render({
  icon:"👃",
  title:"Allergic Rhinitis",
  eyebrow:"Protocol · assess and manage in one place",
  stemTitle:"The spray works if it is used properly: technique, regularity, then step up",
  stemSub:"Sneezing, itch, a running and blocked nose on both sides, tied to pollen, dust mite or animals, is allergic rhinitis. Most treatment failure is not drug failure: it is a steroid spray used intermittently or aimed at the septum. Grade the severity, choose a non-sedating antihistamine or a regular intranasal corticosteroid, step up to a combination spray, reserve a short oral steroid course for exceptional rescue and never use a depot injection, look for the asthma that travels with it, and refer for immunotherapy when optimal treatment still fails. Sources: BSACI rhinitis guideline 2017 · BSACI immunotherapy 2011 · ARIA-EAACI 2024–2025 (international) · MHRA Drug Safety Update (September 2019, April 2024) · NICE NG245 · NICE NG12 · MHRA nasal decongestant advice · SPS · Greater Manchester formulary · UKTIS · SPCs and BNF.",
  guideline:"BSACI rhinitis guideline (Scadding et al 2017) · BSACI immunotherapy guideline (Walker et al 2011) · ARIA-EAACI 2024–2025 (international) · MHRA Drug Safety Update (September 2019; April 2024) · NICE NG245 (2024)",
  meta:[
    {t:"BSACI rhinitis 2017 · immunotherapy 2011"},
    {t:"ARIA-EAACI 2024–2025 · international"},
    {t:"MHRA DSU · montelukast 2019 and 2024"},
    {t:"NICE NG245 asthma (2024) · UKTIS"}
  ],
  lead:"<div class='mg-layers'><a href='#confirm'><b>Confirm</b><small>bilateral, allergic, graded</small></a><a href='#redflags'><b>Rule out</b><small>unilateral, blood, crusting</small></a><a href='#ladder'><b>Treat</b><small>spray technique, step up</small></a><a href='#refer'><b>Refer</b><small>ENT or allergy clinic</small></a></div>",
  quickSub:"Six cards that change what you do today. Each figure traces to a named source under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"blue", h:"Moderate or persistent symptoms: a regular intranasal steroid", html:"Topical nasal corticosteroids are the <b>treatment of choice for moderate to severe disease</b> and are generally more effective than oral antihistamines or leukotriene receptor antagonists for overall nasal symptoms, particularly congestion. ARIA-EAACI 2024–2025 likewise recommends an intranasal steroid over an oral antihistamine. Used <b>every day</b>, not as needed, and started before the season for pollen allergy.", src:"BSACI 2017 · ARIA-EAACI 2024–2025 (international)"},
    {tone:"cream", h:"Technique is the commonest reason sprays “don’t work”", html:"Blow the nose gently or use saline first. Head slightly forward (not tilted back), nozzle just inside the nostril, <b>aimed outwards away from the septum</b> (right hand for the left nostril and vice versa), gentle sniff — do not sniff forcefully into the throat. Aiming at the septum causes crusting and nosebleeds and wastes the dose. Watch the patient do it.", src:"BSACI SOP, topical nasal corticosteroid spray (2023)"},
    {tone:"green", h:"Not controlled on one spray: combine", html:"An intranasal steroid plus intranasal antihistamine is <b>more effective than either alone</b> and is the second-line step for rhinitis poorly controlled on monotherapy — once regular use, adequate duration, correct technique and allergen exposure have been checked. Azelastine with fluticasone propionate: <b>one spray into each nostril twice daily</b>, age 12 and over (Greater Manchester formulary: when separate intranasal antihistamine and corticosteroid do not give sufficient control). Use the least complex effective regimen.", src:"BSACI 2017 · Dymista SPC · Greater Manchester formulary"},
    {tone:"amber", h:"Never a depot steroid injection", html:"Intramuscular depot corticosteroid (for example triamcinolone) has an <b>adverse risk–benefit profile and is not recommended</b>, especially as early-season prevention: the release timing is wrong, the dose cannot be withdrawn if harm occurs, and adverse effects may be prolonged and irreversible. A short oral corticosteroid course is an exceptional clinician-led rescue for severe, time-critical symptoms despite correct conventional treatment — not a replacement for regular intranasal treatment or a seasonal prophylactic; repeated courses should prompt allergy/ENT review and consideration of immunotherapy.", src:"BSACI 2017"},
    {tone:"blue", h:"Students, drivers, safety-critical work: avoid sedating antihistamines", html:"Sedating antihistamines may impair alertness, memory and driving. Avoid them in students, drivers and safety-critical occupations where possible, and choose a non-sedating agent.", src:"BSACI 2017 · BNF"},
    {tone:"amber", h:"Montelukast is not a rhinitis drug on its own", html:"ARIA-EAACI 2024–2025 recommends an oral antihistamine over an LTRA and advises against adding an LTRA to an oral antihistamine. If montelukast is used (usually for coexisting asthma), warn about <b>sleep disturbance, nightmares, mood change, anxiety, depression and suicidal thoughts</b>: the MHRA strengthened these warnings in April 2024. Do not initiate montelukast solely for allergic rhinitis; ask about previous psychiatric illness and current mood or sleep symptoms, advise stopping and seeking advice if new neuropsychiatric symptoms occur, and document the counselling.", src:"ARIA-EAACI 2024–2025 (international) · MHRA DSU April 2024"}
  ],
  pathwaySub:"Five moves. The red step catches the tumour, vasculitis or foreign body hiding behind a “hay fever” label.",
  pathway:[
    {title:"Screen for what it is not", html:"<b>Unilateral</b> blockage or discharge, <b>heavily blood-stained</b> discharge, <b>facial or nasal pain or swelling</b>, a visible mass, proptosis, <b>severe crusting</b>, a new loss of smell with one-sided symptoms, cranial nerve signs or a neck lump. These need urgent ENT assessment via the local head-and-neck pathway, not an antihistamine; a normal anterior examination does not exclude sinonasal disease. Ask about cocaine use, occupational exposures and decongestant overuse.", alert:true},
    {title:"Confirm, classify, look for asthma", html:"Two or more of blockage, running (front or back), sneezing or itch, for at least an hour on most days. Is there a trigger (pollen season, dust, animals, work)? Grade it: <b>intermittent or persistent</b>, <b>mild or moderate–severe</b> (sleep, school, work, leisure affected?). Ask about <b>wheeze, cough and night symptoms</b>, eye symptoms and oral itch with raw fruit."},
    {title:"Treat to severity, with technique taught", html:"Allergen reduction and saline douching for all. Mild or intermittent: <b>non-sedating oral antihistamine</b> (cetirizine or loratadine 10 mg once daily) or an intranasal antihistamine. Moderate–severe or persistent: <b>regular intranasal corticosteroid</b>, demonstrated in the room. For uncomplicated mild-to-moderate seasonal rhinitis, follow the Greater Manchester OTC prescribing policy."},
    {title:"Review at 2–4 weeks: check before stepping up", html:"Technique, daily use, ongoing exposure, and the diagnosis itself. Then step up: <b>combination intranasal steroid plus antihistamine spray</b>; add targeted agents (ipratropium only for troublesome watery rhinorrhoea, eye drops for persistent conjunctivitis, a decongestant for no more than 5 consecutive days). Short oral prednisolone only as exceptional rescue; <b>no depot injections</b>."},
    {title:"Refer when optimal treatment fails", html:"Allergy clinic for <b>immunotherapy assessment</b> when clear IgE-mediated disease with matching objective sensitisation to a clinically relevant dominant allergen persists despite correct use of optimal therapy; ENT for structural disease, polyps or red flags; occupational health or respiratory for work-related rhinitis with asthma."}
  ],
  sections:[
    {id:"confirm", nav:"Confirm and grade", title:"Is it allergic rhinitis, and how bad is it?", sub:"The history carries the diagnosis. Allergy tests confirm sensitisation; they do not replace a clear story.",
     blocks:[
       {b:"table", head:["Question","What supports allergic rhinitis","What points elsewhere"], rows:[
         ["<b>Symptoms</b>","Two or more of: nasal blockage, anterior or posterior rhinorrhoea, sneezing or nasal itch, lasting an hour or more on most days; itchy watery eyes","Blockage alone, thick coloured discharge, facial pain and reduced smell suggest rhinosinusitis or polyps"],
         ["<b>Side</b>","Both sides","One side only: septal deviation, foreign body, polyp or tumour"],
         ["<b>Timing</b>","Seasonal (tree pollen spring, grass pollen early summer, weeds and moulds late summer) or perennial (house dust mite, animals, moulds)","No pattern, triggered by smells, temperature or alcohol: non-allergic (vasomotor) rhinitis"],
         ["<b>Triggers</b>","Worse outdoors on high-pollen days, on making beds, near pets, at work with improvement on holiday","Worse with regular decongestant spray: rhinitis medicamentosa"],
         ["<b>Associated</b>","Allergic conjunctivitis, eczema, asthma, oral itch with raw fruit or nuts","Nosebleeds, crusting, systemic symptoms: vasculitis or granulomatous disease"],
         ["<b>Examination</b>","Pale swollen turbinates, clear secretions, transverse nasal crease in children, allergic shiners; check the chest","Polyps (grey, insensate, mobile), septal perforation, unilateral mass"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Grade it: this chooses the first drug", html:"<b>Intermittent:</b> symptoms on fewer than 4 days a week or for fewer than 4 consecutive weeks. <b>Persistent:</b> 4 or more days a week and for 4 or more consecutive weeks. <b>Mild:</b> sleep, daily activities, school or work, and leisure all unaffected, and symptoms not troublesome. <b>Moderate–severe:</b> any one of those impaired.", src:"ARIA classification (Bousquet et al 2008), international"},
         {tone:"blue", h:"When allergy testing helps", html:"Skin prick testing or specific IgE confirms sensitisation to a suspected allergen. It is most useful when the trigger is unclear, symptoms are perennial, avoidance advice depends on it (for example a pet or occupational allergen), or immunotherapy is being considered. A positive test without matching symptoms is sensitisation, not allergy.", src:"BSACI 2017"}
       ]},
       {b:"why", html:"Classifying by <b>impact</b> rather than by season is what makes the treatment choice logical: a person with persistent, sleep-disturbing symptoms needs a regular intranasal steroid from the outset, however “mild” the complaint sounds. Seasonal versus perennial matters for timing and for allergen advice, not for the choice of step."}
     ]},

    {id:"redflags", nav:"Red flags", title:"Red flags and look-alikes", sub:"Allergic rhinitis is bilateral and painless. Anything else deserves a closer look before treatment.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"Unilateral symptoms, heavy bleeding or pain: refer to ENT", html:"Patients with <b>unilateral symptoms, heavily blood-stained discharge or pain</b> require ENT referral. One-sided blockage usually reflects septal deviation, but foreign body (especially children), antrochoanal polyp and tumour must be considered. Persistent unilateral obstruction, blood-stained discharge or epistaxis, an intranasal mass, facial pain or swelling, proptosis, cranial nerve signs or a neck lump should not be treated as simple allergic rhinitis — urgent ENT assessment via the local head-and-neck suspected-cancer pathway. Do not rely on a normal anterior examination to exclude sinonasal disease.", src:"BSACI 2017 · NICE NG12"},
         {tone:"amber", h:"Severe crusting, especially high in the nose", html:"Unusual in rhinitis and warrants investigation: chronic rhinosinusitis, nose picking, <b>granulomatosis with polyangiitis</b>, sarcoidosis or other vasculitis (particularly with bleeding), <b>cocaine use</b>, or crusting from non-invasive ventilation.", src:"BSACI 2017"},
         {tone:"amber", h:"NG12 and the nose: follow the local pathway", html:"NICE NG12 does not provide a simple ‘allergic rhinitis’ pathway. Persistent unilateral nasal obstruction, unilateral bloody discharge or epistaxis, a visible mass, facial pain or swelling, proptosis, cranial-nerve signs or a neck lump should prompt <b>urgent ENT assessment according to the local head-and-neck cancer pathway</b>.", src:"NICE NG12 (updated April 2026) · local ENT suspected-cancer guidance"},
         {tone:"red", h:"Oral itch that progresses beyond the mouth", html:"Birch-pollen-allergic patients often get mild, immediate oral itch or tingling with raw apples, stone fruit, kiwi, carrot, celery or nuts (pollen food syndrome). Throat tightness, breathing difficulty, vomiting or collapse, or reactions to cooked foods, are <b>not</b> typical: treat as anaphylaxis if acute (999, adrenaline) and refer to allergy.", src:"BSACI pollen food syndrome guideline (Skypala et al 2022)"},
         {tone:"amber", h:"Rebound congestion from decongestant sprays", html:"Prolonged topical decongestant use causes rhinitis medicamentosa (rebound congestion) and mucosal atrophy. The MHRA now advises that xylometazoline and oxymetazoline are used for <b>no more than 5 consecutive days</b> (the licence previously allowed 7 days in adults and children over 12). Ask about over-the-counter use at every review. Do not recommend routine oral or nasal decongestants in pregnancy, or a decongestant as a routine fixed combination with an intranasal steroid; a short course may open a severely obstructed nose to let the steroid penetrate, but never beyond 5 consecutive days.", src:"MHRA Drug Safety Update (April 2026) — nasal decongestant sprays and drops"},
         {tone:"amber", h:"Rhinitis that started at work", html:"Symptoms that improve on days off and holidays suggest occupational rhinitis (flour, laboratory animals, latex, wood dust, isocyanates). It often precedes occupational asthma: ask about chest symptoms and refer early.", src:"BSACI 2017"}
       ]},
       {b:"warn", html:"Loss of smell alone, with bilateral blockage and polyps visible on anterior rhinoscopy, points to <b>chronic rhinosinusitis with nasal polyps</b>, which is a different pathway: intranasal steroid drops or sprays and ENT review, not escalating antihistamines."}
     ]},

    {id:"nondrug", nav:"Every patient", title:"For every patient: allergen reduction, saline and a taught technique", sub:"Cheap measures that make every drug work better.",
     blocks:[
       {b:"tiles", v:"life", items:[
         {t:"🌼 Pollen", html:"Check pollen forecasts; keep windows shut on high-count days and evenings; wraparound sunglasses; shower and change clothes after being outdoors; dry laundry indoors in peak season; car pollen filter."},
         {t:"🛏️ House dust mite", html:"Barrier covers for mattress and pillows, hot wash bedding at 60 °C weekly, reduce soft furnishings and clutter in the bedroom, damp-dust. Single measures alone make little difference; combined measures in the bedroom are more realistic."},
         {t:"🐈 Animals", html:"Keep pets out of the bedroom; removal is the only reliably effective step, and the benefit takes months because allergen persists in the home."},
         {t:"💧 Saline douching", html:"Nasal saline irrigation clears allergen and mucus and is a <b>useful add-on</b>, especially in moderate to severe disease and in pregnancy and childhood. Douche before the steroid spray, not after. Use sterile, distilled or previously boiled and cooled water."},
         {t:"🌬️ Spray technique", html:"Blow the nose gently or use saline first; shake; head slightly forward, not tilted back; nozzle just inside, <b>aim towards the outer wall of the nostril</b>, away from the septum, using the opposite hand; gentle sniff — do not sniff forcefully into the throat. With recurrent nosebleeds, re-check the angle, alternate nostrils or temporarily reduce or stop; if bleeding persists, check for septal perforation or significant mucosal disease."},
         {t:"🚭 Irritants", html:"Tobacco smoke and strong fumes worsen nasal hyper-reactivity in both allergic and non-allergic rhinitis."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"Saline has trial evidence behind it", html:"A Cochrane review of saline irrigation in allergic rhinitis found it may reduce patient-reported symptom severity compared with no saline, with only minor adverse effects (stinging, ear fullness, nosebleeds), in adults and children.", src:"Cochrane (Head et al) 2018"},
         {tone:"cream", h:"The technique leaflet", html:"BSACI publishes standard operating procedures for using a nasal corticosteroid spray and for nasal douching, suitable to print or send with the prescription.", src:"BSACI SOP, topical nasal corticosteroid spray (2023)"}
       ]}
     ]},

    {id:"ladder", nav:"Drug ladder", title:"The drug ladder, step by step", sub:"Start at the step that matches severity, not always at the bottom. Doses are those stated in the product licence; check the BNF or BNFC for children and special groups.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Mild", title:"Non-sedating oral or intranasal antihistamine", when:"mild or intermittent", tone:"green",
          html:"<b>Cetirizine 10 mg once daily</b> or <b>loratadine 10 mg once daily</b> (adults); <b>fexofenadine 120 mg once daily</b> for seasonal allergic rhinitis (adults and 12 and over). Fast onset, good for itch, sneeze and eye symptoms, weaker for blockage. An intranasal antihistamine (azelastine) acts within minutes and suits intermittent symptoms. <b>Avoid sedating antihistamines</b> (chlorphenamine, promethazine)."},
         {step:"Mod–severe", title:"Regular intranasal corticosteroid", when:"first-line for moderate–severe or persistent", tone:"cream", fromLabel:"moderate–severe, persistent, or blocked",
          html:"For example <b>mometasone furoate 50 micrograms per spray, 2 sprays into each nostril once daily</b> (adults), reducing to 1 spray each side once controlled; or <b>fluticasone propionate 50 micrograms per spray, 2 sprays into each nostril once daily</b> (adults). Children: lower doses and licensed ages differ by product, so check BNFC. Use every day; the effect builds over days. For pollen allergy start about 2 weeks before the expected season. Ocular or systemic effects are rare but possible with prolonged high-dose use or several corticosteroid routes: take care in glaucoma, cataract risk and with concurrent inhaled or topical corticosteroids."},
         {step:"Step up", title:"Combination steroid plus antihistamine spray", when:"poorly controlled on one agent", tone:"cream", fromLabel:"correct technique and daily use, still uncontrolled",
          html:"Before escalating, confirm regular use, adequate duration, correct technique and allergen exposure. If symptoms remain troublesome on either an intranasal steroid or an intranasal antihistamine, use a licensed combined preparation: <b>azelastine with fluticasone propionate, 1 spray into each nostril twice daily</b> (12 years and over; Greater Manchester formulary: when separate intranasal antihistamine and corticosteroid therapy does not give sufficient control), replacing the single-agent spray. Use the least complex effective regimen — do not routinely combine an oral antihistamine, an intranasal antihistamine and a combination spray. For persistent eye symptoms, add eye drops."},
         {step:"Target", title:"Add-ons for the dominant symptom", when:"residual problem", tone:"cream", fromLabel:"one symptom still troublesome",
          html:"<b>Troublesome watery rhinorrhoea despite anti-inflammatory treatment:</b> ipratropium 0.03% nasal spray, <b>2 sprays (42 micrograms) into each nostril 2–3 times daily</b> (adults) as a targeted add-on; it reduces watery rhinorrhoea but does not treat itch, sneezing or blockage, and is not a general treatment for allergic rhinitis. <b>Eyes:</b> antihistamine or mast-cell-stabiliser drops (for example sodium cromoglicate), dose per BNF. <b>Blockage limiting spray penetration:</b> a topical decongestant for a few days before the steroid spray, <b>never beyond 5 consecutive days</b>, and not routinely in pregnancy."},
         {step:"Rescue", title:"Short oral corticosteroid course", when:"exceptional: severe, time-critical", tone:"amber", fromLabel:"severe symptoms despite correct treatment",
          html:"An exceptional clinician-led rescue option for severe, time-critical symptoms despite correct conventional treatment (for example before exams), always <b>alongside</b> the intranasal steroid — not a replacement for regular intranasal treatment, and not repeated as seasonal prophylaxis. BSACI gives an example regimen (prednisolone 0.5 mg/kg each morning for 5 days); check dose and duration against the BNF and individual risk factors. Repeated rescue courses should prompt allergy/ENT review and consideration of immunotherapy. <b>Never a depot intramuscular steroid.</b>"}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Which nasal steroid?", html:"ARIA-EAACI 2024–2025 conditionally favours <b>fluticasone furoate or fluticasone propionate</b> over other intranasal steroids (a conditional recommendation), and azelastine-fluticasone over olopatadine-mometasone. It advises against adding a decongestant to an intranasal steroid as routine combination therapy.", src:"ARIA-EAACI 2024–2025 Part I (international)"},
         {tone:"blue", h:"Oral options ranked", html:"Intranasal steroid over oral antihistamine; oral antihistamine over LTRA; oral antihistamine over ocular antihistamine for eye symptoms; and against adding an LTRA to an oral antihistamine.", src:"ARIA-EAACI 2024–2025 Part II (international)"},
         {tone:"amber", h:"Depot steroid: the harm is real", html:"Depot triamcinolone for hay fever is still requested each spring. BSACI states depot preparations have an adverse risk–benefit profile and are not recommended; published harms include disfiguring subcutaneous fat atrophy at the injection site, alongside the systemic effects of weeks of unremovable steroid; adverse effects may be prolonged and irreversible.", src:"BSACI 2017"},
         {tone:"cream", h:"Leukotriene receptor antagonists", html:"Intranasal corticosteroids are generally more effective than LTRAs for overall nasal symptoms, particularly congestion. LTRAs are not routine treatment for rhinitis alone and are mainly relevant where asthma coexists; NICE NG245 does not make montelukast a rhinitis treatment.", src:"BSACI 2017 · NICE NG245 (2024)"},
         {tone:"cream", h:"Local practice: Greater Manchester OTC policy", html:"For uncomplicated mild-to-moderate seasonal rhinitis, follow the current Greater Manchester OTC prescribing policy (hay fever is generally not routinely prescribed on the NHS). Prescribing may be appropriate where symptoms are severe, persistent, associated with asthma or another significant condition, or where the patient meets local exception criteria.", src:"Greater Manchester formulary · OTC prescribing policy"}
       ]}
     ]},

    {id:"asthma", nav:"Asthma link", title:"One airway: find and treat the asthma", sub:"Rhinitis and asthma travel together; uncontrolled rhinitis may worsen asthma control.",
     blocks:[
       {b:"cards", items:[
         {tone:"blue", h:"Ask every rhinitis patient about the chest", html:"Wheeze, cough, night waking, exercise limitation and reliever use. Uncontrolled rhinitis may worsen asthma control, but treating rhinitis is not a substitute for asthma assessment or inhaled treatment. If asthma is suspected, follow the objective testing and treatment pathway in NICE NG245.", src:"BSACI 2017 · NICE NG245 (2024)"},
         {tone:"amber", h:"Montelukast: warn, document, review", html:"September 2019: be alert to neuropsychiatric reactions, including newly recognised <b>speech disturbance (stuttering)</b> and <b>obsessive-compulsive symptoms</b>. April 2024: warnings strengthened with a boxed warning on the patient leaflet and SPC. Do not initiate montelukast solely for allergic rhinitis. Before prescribing, ask about previous psychiatric illness and current mood or sleep symptoms. Advise patients and carers to stop and seek clinical advice if new neuropsychiatric symptoms occur (sleep disturbance, nightmares, anxiety, depression, behaviour change or suicidal thoughts), and document the counselling.", src:"MHRA DSU September 2019 · MHRA DSU April 2024"},
         {tone:"cream", h:"Where an LTRA fits in asthma", html:"In the 2024 joint asthma guideline, an LTRA is one option (with a LAMA) for a trial add-on of 8–12 weeks in people not controlled on moderate-dose MART where FeNO and eosinophils are not raised. It is not a treatment for rhinitis alone.", src:"NICE NG245 (2024)"}
       ]}
     ]},

    {id:"special", nav:"Pregnancy, children, exams", title:"Pregnancy, children, students and drivers", sub:"The groups where drug choice and counselling change.",
     blocks:[
       {b:"table", head:["Group","What to do","Source"], rows:[
         ["<b>Pregnancy</b>","Start with non-drug measures and saline. If needed, <b>loratadine or cetirizine</b> are the preferred antihistamines (the largest body of reassuring data). Fexofenadine is generally not the first choice when loratadine or cetirizine are suitable. Intranasal corticosteroids have low systemic exposure and may be considered at licensed doses when non-drug measures are insufficient — check the individual product and current pregnancy guidance. <b>Avoid oral and nasal decongestants</b>, and avoid depot or oral systemic corticosteroids unless there is a compelling clinical reason. Saline irrigation water should be sterile, distilled or previously boiled and cooled. Rhinitis of pregnancy (non-allergic congestion) is common and resolves after delivery","UKTIS · SPS · BSACI 2017"],
         ["<b>Breastfeeding</b>","Prefer non-sedating antihistamines. A sedating antihistamine may occasionally be considered for a specific indication, but assess maternal sedation and possible infant drowsiness, especially in a young or premature infant. Intranasal corticosteroids are generally compatible with breastfeeding at usual doses","BNF"],
         ["<b>Children</b>","Prefer intranasal steroids with <b>negligible systemic absorption</b>: mometasone furoate, fluticasone furoate or fluticasone propionate. <b>Betamethasone nasal drops</b> are highly absorbed and should be used short-term only. Monitor height on prolonged treatment. Child doses and licensed ages per BNFC","BSACI 2017 · BNFC"],
         ["<b>Students in exam season</b>","Start the intranasal steroid before the pollen season; avoid sedating antihistamines (alertness and memory); an oral steroid rescue course only exceptionally, if severe despite correct treatment","BSACI 2017"],
         ["<b>Drivers and machine operators</b>","First-generation antihistamines carry the BNF cautionary warning about drowsiness and driving; drowsiness can persist the next day. Choose a non-sedating agent and warn that some people are still affected, and that alcohol adds to it","BNF · BSACI 2017"],
         ["<b>Older adults</b>","Avoid sedating and anticholinergic antihistamines (falls, confusion); ipratropium spray may worsen glaucoma or urinary retention in susceptible people, per SPC","BNF"]
       ]},
       {b:"say", html:"“This kind of spray can be used in pregnancy at the licensed dose if saline and other measures aren’t enough, because very little gets into your bloodstream. If you need a tablet as well, loratadine or cetirizine have the most reassuring pregnancy information.”"}
     ]},

    {id:"followup", nav:"Follow-up", title:"Review, and what to check before escalating", sub:"Most “failed” treatment is fixable in the review appointment.",
     blocks:[
       {b:"timeline", items:[
         {n:"1", when:"2–4 weeks", title:"Response review", html:"Watch the spray technique; confirm daily use; check eyes and chest. Controlled: continue through the season, then stop, restarting before next season. Not controlled: run the checks below, then step up."},
         {n:"2", when:"End of season / annually", title:"Plan next year", html:"Pollen allergy: agree a date to start the intranasal steroid about two weeks before the season, with the antihistamine ready. Perennial: step down to the lowest effective dose."},
         {n:"3", when:"Despite optimal care", title:"Reassess and refer", html:"Poor control after correct technique, adherence, allergen reduction and a combination spray: reconsider the diagnosis, then refer (allergy for immunotherapy, ENT for structural disease)."}
       ]},
       {b:"table", head:["Check","Ask or look for","Fix"], rows:[
         ["<b>Technique</b>","Aiming at the septum, snorting the dose into the throat, nosebleeds or crusting","Demonstrate; opposite hand, outward angle, gentle sniff"],
         ["<b>Adherence</b>","Using the steroid only on bad days; stopped after a week “because it didn’t work”","Explain it is a preventer that builds over days; link it to brushing teeth"],
         ["<b>Exposure</b>","Pet in the bedroom, damp home, new job, pollen on clothes and hair","Targeted avoidance; consider testing to confirm the allergen"],
         ["<b>Other drugs</b>","Regular decongestant spray, beta-blockers, ACE inhibitors, NSAIDs (with polyps), oral contraceptives","Ask about OTC decongestant use at every review and stop it; review contributory drugs"],
         ["<b>Diagnosis</b>","Unilateral, polyps, reduced smell, crusting, non-allergic triggers","ENT or non-allergic rhinitis pathway"]
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer: allergy clinic, ENT, or elsewhere", sub:"Suspicious unilateral or destructive nasal features go through the local ENT/head-and-neck suspected-cancer pathway.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"ENT: urgently when a tumour is possible", html:"Persistent unilateral symptoms, blood-stained discharge or epistaxis, facial pain or swelling, a visible mass, proptosis, severe crusting or septal destruction, cranial nerve signs or a neck lump — via the local head-and-neck suspected-cancer pathway where a tumour is possible. Also nasal polyps or structural obstruction not responding to appropriate treatment.", src:"BSACI 2017 · NICE NG12 · local ENT pathway"},
         {tone:"cream", h:"Allergy clinic: immunotherapy assessment", html:"The main UK indication for immunotherapy is <b>IgE-mediated seasonal pollen rhinitis that has not responded adequately to optimal pharmacotherapy</b>. Subcutaneous immunotherapy is also effective for house dust mite perennial rhinitis. Refer for assessment when there is clear IgE-mediated clinical disease, objective sensitisation matching the symptoms, a clinically relevant dominant allergen, and persistent moderate–severe symptoms despite appropriate treatment and adherence. <b>A positive skin-prick or specific IgE test alone is not a reason to refer</b> — sensitisation without a matching history is not symptomatic allergy. Treatment is initiated in a specialist service after a shared decision about a multi-year course: courses typically last <b>3–5 years</b>, depending on the product and pathway; subcutaneous injections are given only in specialist clinics with adrenaline and resuscitation facilities to hand. Sublingual tablets are specialist-initiated.", src:"BSACI immunotherapy (Walker et al 2011) · BSACI 2017"},
         {tone:"cream", h:"Allergy clinic: other reasons", html:"Persistent symptoms despite correct technique, adherence and combination treatment; diagnostic uncertainty needing specialist testing; suspected occupational rhinitis; pollen-food syndrome with systemic or atypical reactions; rhinitis with difficult-to-control asthma.", src:"BSACI pollen food syndrome guideline (Skypala et al 2022) · BSACI 2017"},
         {tone:"red", h:"Same day / emergency", html:"Anaphylaxis · severe asthma · orbital or intracranial complications · rapidly progressive destructive nasal disease or severe epistaxis."},
         {tone:"cream", h:"Local pathway", html:"In the North West, the North West Allergy and Clinical Immunology Network (NWACIN) referral and management pathway for rhinitis and rhinoconjunctivitis in primary care (version 6, October 2023, hosted by Manchester University NHS Foundation Trust) sets out the primary care steps expected before referral. Check it before referring.", src:"NWACIN pathway v6 (2023), Greater Manchester"}
       ]},
       {b:"say", html:"“The steroid spray is the most effective treatment, but only if it goes in at the right angle every day, so let me show you. If it still isn’t enough after that and a combined spray, an allergy clinic can look at desensitisation, which is a three-year course that can change the allergy itself.”"}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only: the Casebook holds the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 17-year-old with grass pollen hay fever has A-level exams in three weeks. Chlorphenamine from the pharmacy makes her sleepy; a friend had “the hay fever injection” and she wants the same. She uses a nasal spray “when it’s really bad”. She has had a night-time cough for two weeks.", src:"BSACI 2017"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Explains why a <b>depot steroid is not offered</b> without dismissing her; switches to a non-sedating antihistamine and a <b>regular</b> intranasal steroid with a technique demonstration; asks about the <b>cough as possible asthma</b> and plans objective testing; explains that a short oral prednisolone course is only an exceptional rescue if severe despite correct treatment; plans pre-season treatment next year and discusses immunotherapy if control remains poor.", src:"BSACI 2017 · NICE NG245 (2024)"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Every figure on this page is traceable to a named primary source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>Scadding GK et al, BSACI guideline for the diagnosis and management of allergic and non-allergic rhinitis (revised edition 2017). Clin Exp Allergy 2017;47:856–89</b><br><a href="https://onlinelibrary.wiley.com/doi/10.1111/cea.12953" rel="noopener">doi.org/10.1111/cea.12953</a><span class="rd"> — intranasal steroid as treatment of choice for moderate–severe disease; combination spray as second line; intranasal steroid generally more effective than LTRA, particularly for congestion; ipratropium for persistent watery rhinorrhoea; depot steroid not recommended; oral prednisolone (example 0.5 mg/kg each morning for 5 days) as exceptional rescue; first-generation antihistamines not recommended; ENT red flags; low-absorption steroids in children; saline as add-on</span></li>'+
         '<li><b>Walker SM et al, BSACI guideline: immunotherapy for allergic rhinitis. Clin Exp Allergy 2011;41:1177–200</b><br><a href="https://onlinelibrary.wiley.com/doi/10.1111/j.1365-2222.2011.03794.x" rel="noopener">doi.org/10.1111/j.1365-2222.2011.03794.x</a><span class="rd"> — main UK indication: IgE-mediated seasonal pollen rhinitis inadequately responsive to optimal pharmacotherapy</span></li>'+
         '<li><b>Skypala IJ et al, BSACI guideline for the diagnosis and management of pollen food syndrome in the UK. Clin Exp Allergy 2022;52:1018–34</b><span class="rd"> — typical triggers and features needing referral</span></li>'+
         '<li><b>BSACI standard operating procedure: topical nasal corticosteroid spray (2023)</b><span class="rd"> — technique</span></li>'+
         '<li><b>Sousa-Pinto B, Bousquet J et al, ARIA-EAACI Guidelines 2024–2025 Revision, Part I (intranasal) and Part II (oral and ocular). Allergy 2025–2026</b> (international)<span class="rd"> — intranasal steroid over oral antihistamine; oral antihistamine over LTRA; against LTRA added to antihistamine; fluticasone preferred; against routine decongestant added to intranasal steroid</span></li>'+
         '<li><b>Bousquet J et al, ARIA 2008 update. Allergy 2008;63 Suppl 86</b> (international)<span class="rd"> — intermittent or persistent, mild or moderate–severe classification</span></li>'+
         '<li><b>MHRA Drug Safety Update, September 2019</b> — montelukast: neuropsychiatric reactions including speech disorders and obsessive-compulsive symptoms; <b>MHRA Drug Safety Update, April 2024</b> — montelukast: reminder and strengthened (boxed) warnings; <b>MHRA Drug Safety Update — nasal decongestant sprays and drops containing xylometazoline or oxymetazoline</b>: no more than 5 consecutive days<br><a href="https://www.gov.uk/drug-safety-update" rel="noopener">gov.uk/drug-safety-update</a></li>'+
         '<li><b>NICE NG245, Asthma: diagnosis, monitoring and chronic asthma management (BTS, NICE, SIGN), November 2024</b><br><a href="https://www.nice.org.uk/guidance/ng245" rel="noopener">nice.org.uk/guidance/ng245</a><span class="rd"> — LTRA or LAMA 8–12 week add-on trial; follow MHRA montelukast advice</span></li>'+
         '<li><b>NICE NG12, Suspected cancer: recognition and referral (updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — head and neck referral recommendations; there is no simple allergic rhinitis pathway, so suspicious unilateral or destructive nasal features follow the local ENT/head-and-neck pathway</span></li>'+

         '<li><b>Head K et al, Saline irrigation for allergic rhinitis. Cochrane Database Syst Rev 2018 (CD012597)</b></li>'+
         '<li><b>UKTIS monographs: use of loratadine and of cetirizine in pregnancy; medicinesinpregnancy.org hay fever leaflet</b><br><a href="https://uktis.org" rel="noopener">uktis.org</a></li>'+
         '<li><b>NHS Specialist Pharmacy Service (SPS) — Hay fever or allergic rhinitis: treatment during pregnancy</b><br><a href="https://www.sps.nhs.uk" rel="noopener">sps.nhs.uk</a></li>'+
         '<li><b>Greater Manchester Medicines Management Group formulary</b> — combined fluticasone/azelastine for people aged 12 and over not controlled on separate intranasal antihistamine and corticosteroid; OTC prescribing policy for mild-to-moderate hay fever<br><a href="https://www.greatermanchesterformulary.nhs.uk" rel="noopener">greatermanchesterformulary.nhs.uk</a></li>'+
         '<li><b>SPCs:</b> Telfast 120 mg (fexofenadine); Nasonex (mometasone); Flixonase (fluticasone propionate); Dymista (azelastine/fluticasone); Rinatec (ipratropium, per MHRA UKPAR); Otrivine (xylometazoline)<br><a href="https://www.medicines.org.uk/emc" rel="noopener">medicines.org.uk/emc</a></li>'+
         '<li><b>BNF / BNFC</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — cetirizine, loratadine, children’s doses, cautionary labels</span></li>'+
         '<li><b>North West Allergy and Clinical Immunology Network (NWACIN), Rhinitis/rhinoconjunctivitis referral and management pathway for primary care, version 6 (October 2023)</b>, hosted by Manchester University NHS Foundation Trust<br><a href="https://mft.nhs.uk/app/uploads/2024/05/RHINITISRHINOCONJUNCTIVITIS-Referral-and-Management-Pathway-for-Primary-Care.pdf" rel="noopener">mft.nhs.uk (PDF)</a><span class="rd"> — local primary care pathway</span></li>'+
         '</ul></div>'}
     ]}

  foot:"Allergic rhinitis in primary care: diagnosis, stepwise treatment and referral. Sources: BSACI rhinitis guideline 2017, BSACI immunotherapy guideline 2011, BSACI pollen food syndrome guideline 2022, ARIA-EAACI 2024–2025 (international), MHRA Drug Safety Update September 2019 and April 2024, MHRA nasal decongestant advice, NICE NG245 (2024), NICE NG12 (updated April 2026), UKTIS, SPS, the Greater Manchester formulary and OTC policy, and product SPCs. Verify doses against the current BNF or BNFC and your local formulary before prescribing."
