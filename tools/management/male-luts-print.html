MG.render({
  icon:"\u{1F6BA}",

  stemTitle:"Split voiding from storage \u2014 that decides the whole plan \u2014 then exclude the sinister and treat by pattern",
  stemSub:"Male LUTS are commonly multifactorial. Possible contributors include bladder outlet obstruction due to benign prostatic enlargement, overactive bladder, nocturnal polyuria, infection, medication effects, neurological disease and, less commonly, malignancy. The primary-care task is to identify the dominant symptom pattern, exclude complications and red flags, and match treatment to the likely cause. One page for the whole condition: characterise voiding versus storage with IPSS and a 3-day chart, examine the abdomen, genitalia and prostate, check renal function when renal impairment is suspected (LUTS can mask cancer and high-pressure retention), screen the NG12 routes, run conservative measures properly rather than as an afterthought, then treat by phenotype with named doses \u2014 alpha-blocker \u00b1 5-ARI for obstruction, antimuscarinic (or mirabegron if antimuscarinics are unsuitable) for storage after considering retention risk, desmopressin for confirmed nocturnal polyuria with strict fluid restriction and sodium monitoring.",
  guideline:"NICE CG97 · NG12 · TA290 · MHRA Drug Safety Updates · MHRA SPCs · GMMMG formulary",
  reviewed:"9 September 2026",
  nextReview:"9 March 2027",
  meta:[
    {t:"NICE CG97 \u2014 LUTS in men"},
    {t:"NICE NG12 \u2014 suspected cancer (updated April 2026)", tone:"tw"},

    {t:"MTOPS \u00b7 CombAT \u00b7 EAU 2023 (international)"},

    {t:"v2.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#severe"><b>Exclude first</b><small>Retention \u00b7 suspected cancer \u00b7 renal</small></a><a href="#confirm"><b>Split it</b><small>Voiding \u00b7 storage \u00b7 IPSS</small></a><a href="#workup"><b>Work-up</b><small>DRE \u00b7 dipstick \u00b7 PSA \u00b7 selective PVR</small></a><a href="#ladder"><b>Treat</b><small>By phenotype</small></a><a href="#refer"><b>Refer</b><small>Urology \u00b7 suspected cancer</small></a></div>',
  quickSub:"If you read nothing else on this page, read these six cards. Product-specific sources are linked under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"\u26a0 The two things LUTS hides", html:"A hard, craggy, irregular or asymmetric prostate warrants a suspected cancer pathway referral (appointment within 2 weeks) regardless of the PSA. Unexplained visible haematuria at 45 or over goes on the suspected cancer pathway for <b>both bladder and renal cancer</b>. And <b>chronic retention can be painless</b>: a palpable bladder with a rising creatinine is high-pressure retention threatening the kidneys."},
    {tone:"amber", h:"Voiding or storage? Everything follows", html:"<b>Voiding</b> \u2014 hesitancy, weak stream, straining, terminal dribble, incomplete emptying \u2192 bladder outflow obstruction (BOO), often benign prostatic enlargement \u2014 but male LUTS are commonly multifactorial. <b>Storage</b> \u2014 urgency, frequency, nocturia, urgency incontinence \u2192 overactive bladder. Up to 40% of men with LUTS have OAB as the dominant problem, not BPH \u2014 an alpha-blocker alone fails them."},
    {tone:"blue", h:"The 3-day chart is the highest-yield free test", html:"A <b>3-day frequency-volume chart</b> separates prostatic nocturia from <b>true nocturnal polyuria (&gt;33% of the 24-hour output overnight)</b> \u2014 which needs fluid timing or desmopressin, not an alpha-blocker. It also finds polyuria from diabetes."},
    {tone:"green", h:"Treat by pattern, with the right clock", html:"Tamsulosin MR 400 micrograms OD works within days to 2\u20134 weeks. 5-ARI symptom benefit is slow and may require at least 6 months \u2014 so do not judge it early; it is intended for long-term use. Add the 5-ARI when the prostate is <b>&gt;30 g, or PSA &gt;1.4\u20131.5</b>."},
    {tone:"amber", h:"Think about retention before an antimuscarinic", html:"<b>NICE does not recommend routine PVR measurement for every man at initial assessment.</b> Measure PVR or arrange specialist assessment when poor emptying, retention, neurological disease, recurrent UTI or significant voiding dysfunction is suspected, and before or soon after starting an antimuscarinic where clinically appropriate. A 150 mL cut-off is a specialist/urological practical threshold, not a NICE primary-care rule. Antimuscarinics can precipitate acute retention in a man with significant outflow obstruction, and are contraindicated in retention, narrow-angle glaucoma and severe constipation."},
    {tone:"amber", h:"The PSA trap on a 5-ARI", html:"After 6 months or more of finasteride, PSA is usually approximately 50% lower \u2014 double the measured value for comparison with untreated reference thresholds, and document that you have (finasteride SPC; apply the same principle to dutasteride per its product information). <b>A sustained rise from the on-treatment nadir requires assessment</b>, even inside the \u201cnormal\u201d range."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step is where kidneys and cancers are lost.",
  pathway:[
    {title:"Screen the emergencies and the cancers", html:"Acute retention, high-pressure chronic retention with renal impairment, cauda equina, urosepsis; and the NG12 routes \u2014 abnormal DRE, age-specific raised PSA, visible haematuria (bladder and renal).", alert:true},
    {title:"Characterise the symptoms", html:"<b>Voiding versus storage versus post-micturition</b>, with <b>IPSS plus the bother score</b> and a <b>3-day frequency-volume chart</b>. Consider the full differential \u2014 LUTS in men is not a synonym for BPH."},
    {title:"Do the focused work-up", html:"<b>Urine dipstick</b> in every man; abdominal, genital and <b>DRE</b> examination where appropriate; <b>creatinine/eGFR only when renal impairment is suspected</b>; <b>PSA after informed discussion</b> under CG97/NG12; post-void residual when poor emptying or retention is possible. <b>Do not over-investigate mild uncomplicated LUTS.</b>"},
    {title:"Conservative first, then by phenotype", html:"Fluid timing, caffeine and alcohol, bladder retraining, double voiding, pelvic floor, weight, activity, constipation, <b>medication review \u2014 which can be curative on its own</b>. Then the drug that matches the pattern."},
    {title:"Review with the right clock", html:"<b>4\u20136 weeks</b> for an alpha-blocker (IPSS, postural BP), <b>3\u20136 months</b> for a 5-ARI, <b>every 4\u20136 weeks until stable</b> for an antimuscarinic, then every 6\u201312 months; <b>sodium at baseline and day 3</b> for desmopressin (plus day 4\u20138 and one month if 65 or over), then annual IPSS, PSA trend, DRE and renal function."}
  ],
  sections:[

    {id:"severe", nav:"Exclude first", title:"Emergencies, renal risk, and the NG12 cancer routes",
     sub:"Screen for all of these before you start treating symptoms \u2014 each needs action today or a suspected-cancer referral.",
     blocks:[
       {b:"table", head:["Red flag","Features","Action"], rows:[
         ["<b>Acute urinary retention</b>","Unable to void, suprapubic pain, distended tender bladder","<b>999 / A&amp;E for catheterisation</b> \u2014 record the residual. Bladder injury follows if it is not relieved within hours"],
         ["<b>Chronic retention</b>","Suspect with a palpable or percussible bladder, overflow incontinence, nocturnal enuresis, recurrent UTI, renal impairment or hydronephrosis \u2014 it may be <b>painless</b>","<b>Residual volume greater than 1 litre, a palpable/percussible bladder, renal impairment or hydronephrosis: urgent urological assessment, renal function testing and upper-tract imaging (NICE CG97).</b> High-pressure retention with renal impairment, hydronephrosis or severe systemic disturbance needs same-day assessment. Consider post-obstructive diuresis after drainage, particularly in high-pressure retention"],
         ["<b>Rising creatinine with LUTS</b>","Renal impairment on bloods","<b>Obstructive uropathy until proven otherwise \u2014 same-day urology</b> if significantly elevated or rising"],
         ["<b>Cauda equina</b>","New <b>saddle anaesthesia</b>, bilateral leg weakness, retention or incontinence, absent anal tone","<b>999.</b> A neurosurgical emergency with a <b>6-hour window</b> for decompression"],
         ["<b>Urosepsis / pyelonephritis</b>","Fever, rigors, loin pain, systemically unwell","<b>Same-day assessment, or 999 if sepsis criteria are met</b>"],
         ["<b>Suspected cancer pathway \u00b7 prostate</b>","Hard, craggy, nodular, irregular, asymmetric prostate, loss of the median sulcus or a fixed gland \u2014 or a <b>PSA above the age-specific range</b>. Bone pain, weight loss or haematuria suggest advanced disease","Suspected cancer pathway referral (NICE NG12) \u2014 an abnormal DRE warrants it regardless of PSA"],
         ["<b>Suspected cancer pathway \u00b7 bladder and renal</b>","<b>Aged 45 or over with unexplained visible haematuria without UTI, or visible haematuria that persists or recurs after successful treatment of UTI</b>; unexplained non-visible haematuria aged 60 or over with dysuria or a raised white cell count (bladder)","<b>Suspected cancer pathway referral for both bladder and renal cancer (NG12).</b> Even one unexplained episode of visible haematuria at 45 or over meets the criteria. Consider non-urgent referral for bladder cancer in people aged 60 and over with recurrent or persistent unexplained UTI"],
         ["Testicular or pelvic mass","Lump found on examination or reported","<b>Testicular lump: urology suspected cancer pathway referral</b> \u2014 testicular cancer is the commonest cancer in men aged 15\u201335. <b>Pelvic mass in a man: urgent referral (local pathway)</b>, usually urology with imaging \u2014 NICE NG12 has no pelvic-mass criterion in men"]
       ]},
       {b:"warn", html:"<b>Unexplained visible haematuria is bladder or renal cancer until proven otherwise.</b> Do not attribute it to a UTI without confirming the infection and checking that the haematuria resolves \u2014 visible haematuria that persists or recurs after successful UTI treatment in a man of 45 or over still needs a suspected cancer pathway referral. Missing prostate cancer at a curable stage is also a recognised medicolegal risk."},
       {b:"dl", rows:[
         ["<b>NG12 \u2014 the criteria that apply here, stated precisely</b>","<b>Prostate:</b> a suspected-cancer pathway referral for prostate cancer where the DRE feels malignant, or the <b>PSA is above the age-specific reference range</b>. <b>Bladder and renal:</b> aged 45 and over with unexplained visible haematuria without infection, or visible haematuria that persists or recurs after successful treatment of infection; aged 60 and over with unexplained non-visible haematuria plus dysuria or a raised white cell count. <b>Upper tract:</b> the same visible-haematuria route covers renal cancer. <b>Recurrent UTI:</b> consider non-urgent bladder cancer referral at 60 and over with recurrent or persistent unexplained UTI. PSA thresholds are referral thresholds, not diagnostic thresholds; consider patient preference and comorbidity. These are restated with doses and thresholds in the <a href='#refer'>Refer</a> section"]
       ]}
     ]},

    {id:"confirm", nav:"Split it", title:"Quantify with IPSS, then classify the cause",
     sub:"LUTS in men is not a synonym for BPH. Treating the wrong phenotype causes harm.",
     blocks:[
       {b:"dl", rows:[
         ["<b>Symptom groups</b>","<b>Storage:</b> urgency, frequency (&gt;8 a day), nocturia, urgency (urge) incontinence \u2014 <b>urgency is the cardinal feature</b>. <b>Voiding:</b> hesitancy, poor or intermittent stream, straining, incomplete emptying. <b>Post-micturition:</b> terminal dribble and the sensation of incomplete emptying"],
         ["<b>IPSS \u2014 the International Prostate Symptom Score</b>","7 questions each scored 0\u20135, plus one quality-of-life question scored 0\u20136. Total 0\u201335. Validated and endorsed by NICE CG97 and the EAU, and the outcome measure behind <b>NICE QS45 (quality standard, 2013)</b>"],
         ["<b>IPSS bands</b>","<b>Mild 0\u20137</b> \u2014 watchful waiting with lifestyle advice, reassess at 6\u201312 months. <b>Moderate 8\u201319</b> \u2014 the active treatment threshold. <b>Severe 20\u201335</b> \u2014 offer treatment, consider urology if refractory or complex"],
         ["<b>The bother score matters more than the total</b>","A quality-of-life score of <b>3 or more</b> (\u201cmostly dissatisfied\u201d or worse) is significant bother. A man with IPSS 10 but QoL 5 deserves active treatment as much as one with IPSS 20 \u2014 the patient's own perception drives urgency"],
         ["<b>Also record</b>","Bother and effect on quality of life \u00b7 fluid, caffeine and alcohol intake \u00b7 constipation and bowel symptoms \u00b7 diabetes, sleep apnoea, heart failure, neurological disease and mobility \u00b7 current medicines, including diuretics, anticholinergics, opioids, antihistamines and decongestants \u00b7 sexual function and erectile dysfunction \u00b7 red flags: haematuria, retention, recurrent UTI, weight loss, bone pain and neurological symptoms"],
         ["<b>3-day bladder diary</b>","Frequency, volumes, nocturia episodes and leakage \u2014 send it home, particularly for bothersome storage symptoms or nocturia. Distinguishes storage from voiding, and detects <b>nocturnal polyuria (&gt;33% of the 24-hour output overnight)</b>, which needs a completely different treatment"]
       ]},
       {b:"table", head:["Diagnosis","Recognise it by","Note"], rows:[
         ["<b>Benign prostatic hyperplasia (BPH / BPE)</b>","Commonest cause in men &gt;50. Voiding plus storage symptoms, <b>smooth symmetrically enlarged prostate</b>, gradual onset, PSA normal for age or mildly raised","The default \u2014 but prove it rather than assume it"],
         ["<b>Overactive bladder (OAB)</b>","<b>Predominantly storage</b> \u2014 urgency with or without urge incontinence, frequency, nocturia. Often no outflow obstruction; may coexist with BPH","Up to 40% of men with LUTS \u2014 responds to bladder retraining, antimuscarinics or a beta-3 agonist, not alpha-blockers"],
         ["Urinary tract infection","Acute dysuria, frequency, suprapubic pain; systemically unwell in upper UTI. <b>MSU dipstick and culture</b>","<b>Uncommon in young men \u2014 exclude STI (chlamydia, gonorrhoea)</b>. A true UTI in a man needs upper-tract imaging and prostate assessment for a structural cause"],
         ["<b>Prostate cancer</b>","May be asymptomatic or cause LUTS. <b>Hard, craggy, irregular prostate</b>, PSA raised or rising rapidly; bone pain, weight loss and haematuria mean advanced disease","<b>Always consider it in a man &gt;50 with new LUTS</b>"],
         ["Prostatitis \u2014 acute or chronic","Perineal or pelvic pain, dysuria, fever if acute. <b>Chronic pelvic pain syndrome</b>: scrotal, perineal and post-ejaculatory pain, boggy tender prostate","Affects up to 15% of men and is frequently underdiagnosed \u2014 an entirely different pathway. See the <a href='prostatitis.html'>prostatitis protocol</a>"],
         ["Urethral stricture","Reduced stream since trauma, instrumentation or an STI; younger men more often","Urology for <b>urethrogram or cystoscopy</b>"],
         ["<b>Nocturnal polyuria</b>","<b>&gt;33% of the 24-hour output overnight</b> on the diary","Rule out cardiac failure, diabetes, CKD, diuretic timing and OSA \u2014 treat the underlying cause first. Desmopressin only if truly isolated"],
         ["Neurogenic bladder","Parkinson's, MS, spinal cord disease, diabetes \u2014 mixed storage and voiding with neurological features","Urology or neuro-urology"],
         ["<b>Drug causes \u2014 review the whole list</b>","Anticholinergics \u2192 retention. Diuretics \u2192 frequency and nocturia. Alpha-agonist decongestants (pseudoephedrine, Sudafed) \u2192 retention. Alpha-blockers \u2192 incontinence. Calcium-channel blockers. Opioids worsen voiding","Anticholinergic burden is a common reversible cause of voiding difficulty in older men, and over-the-counter decongestants precipitate acute retention"]
       ]}
     ]},

    {id:"workup", nav:"Work-up", title:"Examination and investigations \u2014 what is mandatory",
     sub:"A focused examination changes the diagnosis and the management. Do not skip the DRE.",
     blocks:[
       {b:"table", head:["Examine","Looking for","Why it matters"], rows:[
         ["<b>Abdomen</b>","Suprapubic palpation and percussion \u2014 <b>a palpable bladder means retention</b>. Renal angle tenderness","Chronic retention may be painless; renal angle tenderness suggests pyelonephritis or hydronephrosis"],
         ["<b>Digital rectal examination \u2014 offer where appropriate</b>","Normal BPH: smooth, symmetrically enlarged, rubbery, median sulcus preserved. <b>Suspected cancer pathway referral: hard, craggy, nodular, irregular, loss of sulcus, fixed.</b> Estimate size \u2014 <b>normal is &lt;20 g</b>","The single most important examination \u2014 a malignant-feeling prostate on DRE warrants a suspected cancer pathway referral regardless of PSA (NICE NG12)"],
         ["Genitalia","Urethral discharge (STI or prostatitis), <b>phimosis</b>, penile pathology; <b>examine the testes for masses</b>","Phimosis is a reversible mechanical cause of LUTS, especially in diabetic men \u2014 circumcision is curative"],
         ["<b>Neurological</b>","Perianal sensation, anal tone, lower limb power and reflexes if a neurogenic bladder is suspected or retention is new","<b>Absent anal tone means cauda equina</b>"],
         ["Peripheral oedema","<b>Bilateral pitting oedema</b>","Points to <b>nocturnal polyuria from fluid redistribution</b> in cardiac failure, venous insufficiency or nephrotic syndrome \u2014 which redirects management entirely, to heart failure optimisation rather than BPH treatment"],
         ["BMI and waist circumference","Obesity","Associated with LUTS severity; metabolic syndrome links to OAB and BPH progression (CG97)"],
         ["BP","Hypertension; postural BP if indicated","Review diuretic and calcium-channel-blocker timing. <b>Alpha-blockers lower BP</b> \u2014 relevant prescribing context"]
       ]},
       {b:"table", head:["Investigation","When","Notes"], rows:[
         ["<b>Urine dipstick (urinalysis)</b>","<b>Mandatory first test in every man</b>","<b>The highest-yield bedside test:</b> nitrites and leucocytes \u2192 MSU culture; <b>blood \u2192 the haematuria pathway</b>; glucose \u2192 diabetes screen; protein \u2192 renal disease"],
         ["MSU culture","Dipstick positive or symptoms suggest infection","A man with a true UTI needs further investigation \u2014 renal ultrasound and prostate assessment \u2014 to exclude a structural abnormality"],
         ["<b>Renal function (creatinine/eGFR)</b>","<b>When renal impairment is suspected</b> — e.g. palpable bladder, chronic retention, recurrent UTI, nocturnal enuresis — and before desmopressin","<b>A raised creatinine is obstructive uropathy until proven otherwise.</b> An <b>eGFR &lt;45</b> affects dosing of alpha-blockers and 5-ARIs"],
         ["<b>PSA \u2014 after an informed discussion</b>","In men with LUTS, erectile dysfunction or visible haematuria, consider PSA testing and DRE in line with NG12, using shared decision-making. CG97 additionally recommends offering PSA information and time to decide where LUTS suggest bladder outlet obstruction, the prostate is abnormal on DRE, or the patient is concerned about prostate cancer \u2014 <b>document the discussion</b>","Do not perform PSA testing during an active UTI or prostatitis. Delay testing for at least 6 weeks after treatment of a proven or suspected UTI, prostate biopsy, TURP or other significant urological instrumentation. Avoid ejaculation and vigorous exercise for 48 hours before testing. Interpret PSA cautiously after urinary retention or catheterisation. A routine DRE has little clinically important effect on PSA. Age-specific thresholds below"],
         ["FBC","Baseline","Anaemia may indicate renal failure from chronic obstruction, or malignancy"],
         ["Glucose or HbA1c","If not recent","Diabetes causes <b>osmotic polyuria</b> and autonomic bladder neuropathy"],
         ["<b>Post-void residual (PVR)</b>","Not routinely at initial assessment of uncomplicated LUTS (NICE CG97). Measure (bladder ultrasound after voiding) or arrange specialist assessment with poor stream or incomplete emptying, suspected retention, recurrent UTI, neurological disease, significant voiding symptoms, before or soon after starting an antimuscarinic where clinically appropriate, or worsening symptoms after treatment","A residual greater than 1 litre or a palpable/percussible bladder is chronic retention needing urgent urological assessment (CG97) \u2014 silent retention causes progressive renal failure. A 150 mL cut-off before an antimuscarinic is a specialist/urological practical threshold, not a NICE primary-care rule. Specialist assessment includes flow rate and PVR"],
         ["<b>Not routinely needed in primary care</b>","\u2014","Uroflowmetry (flow rate), urodynamics and transrectal ultrasound are secondary care. PSA velocity needs serial measurements over time"]
       ]},
       {b:"warn", html:"<b>Age-specific PSA thresholds for men with symptoms (NICE NG12):</b> refer on the suspected-cancer pathway if PSA is above <b>2.5 ng/mL at 40\u201349, 3.5 at 50\u201359, 4.5 at 60\u201369 and 6.5 at 70\u201379</b>; use clinical judgement under 40 and at 80 or over. These are <b>referral thresholds, not diagnostic thresholds</b> — consider patient preference and comorbidity. For asymptomatic men aged 50\u201369 who choose a test, the Prostate Cancer Risk Management Programme threshold is <b>\u2265 3.0 ng/mL</b>. Remember the principle that matters more than the number: <b>an abnormal DRE goes on the cancer pathway whatever the PSA</b>."}
     ]},

    {id:"lifestyle", nav:"Conservative", title:"Conservative measures \u2014 first-line, not optional",
     sub:"NICE CG97 recommends these for every man with LUTS. Quantifying the benefit is what motivates patients to do them.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"\ud83d\udca7 Fluid management", html:"Target 1.5\u20132 L/day, front-loaded \u2014 reduce intake after 6pm to cut nocturia, and avoid large fluid boluses. <b>Reduces frequency and nocturia by around 20%.</b>"},
         {tone:"green", h:"\u2615 Caffeine and alcohol", html:"Both are bladder irritants and diuretics. Trial reducing caffeine to 2 cups a day or fewer \u2014 caffeine withdrawal improves urgency in OAB with sustained benefit at 12 months (RCT evidence). Target <b>under 50 g of alcohol a week</b>, in line with cardiovascular advice."},
         {tone:"blue", h:"\ud83d\udebd Bladder retraining", html:"For urgency and OAB: defer voiding when urgent and gradually extend the interval from 1 hour to 3\u20134 hours over 4\u20136 weeks. Reduces urgency episodes by about 50% (Cochrane), and has similar efficacy to antimuscarinics at 6 months with better long-term adherence."},
         {tone:"blue", h:"\ud83d\udd01 Double voiding and urethral milking", html:"<b>After the initial void, wait a minute, lean forward and void again.</b> Reduces post-micturition dribble and the sensation of incomplete emptying \u2014 simple, effective and immediate."},
         {tone:"green", h:"\ud83c\udfcb\ufe0f Pelvic floor exercises", html:"Reduce post-micturition dribble, urgency incontinence and post-prostatectomy incontinence, with sustained benefit at 1 year. Underreferred in men \u2014 refer to a continence nurse or physiotherapist for proper instruction."},
         {tone:"amber", h:"\u2696\ufe0f Weight and activity", html:"<b>Each 5 kg of weight loss reduces IPSS by about 2 points</b>; support a weight programme if BMI is over 30. Regular moderate exercise \u2014 150 minutes a week \u2014 reduces LUTS severity by around 25% versus a sedentary lifestyle, and walking reduces nocturia."},
         {tone:"blue", h:"\ud83d\udc8a Medication review \u2014 can be curative", html:"Stopping an anticholinergic or moving a diuretic to the morning can resolve LUTS within days with no new prescription. Also stop or switch <b>alpha-agonist decongestants (Sudafed / pseudoephedrine)</b> and review calcium-channel blockers. Go through the whole list systematically."},
         {tone:"cream", h:"\ud83d\udebd Constipation and containment", html:"Chronic constipation worsens voiding and urgency by direct pressure \u2014 an often-overlooked cause of deterioration. Optimise with fibre, hydration and laxatives. Offer <b>pads, sheaths or a urine bottle for nocturia</b> while measures take effect \u2014 supervised waiting is legitimate for mild symptoms."}
       ]},
       {b:"warn", html:"Do not offer homeopathy, acupuncture or phytotherapy as treatment for LUTS (NICE CG97). Offer drug treatment generally only when symptoms are bothersome and conservative measures are unsuccessful or inappropriate."},
       {b:"why", html:"Nocturia deserves specific attention rather than being folded into \u201cprostate symptoms\u201d: it disrupts sleep architecture, increases falls risk, and is associated with cardiovascular mortality. And many men with mild to moderate symptoms respond to these measures alone \u2014 which is the point of offering them before a prescription, not alongside one."}
     ]},

    {id:"ladder", nav:"Treatment", title:"Drug treatment \u2014 matched to the phenotype",
     sub:"Voiding and storage symptoms need different drugs. Combination therapy is evidence-based for mixed symptoms.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Step 1", title:"Lifestyle and watchful waiting", when:"IPSS \u22647, or patient preference",
          html:"Conservative measures as above, with <b>review at 6\u201312 months</b>. Trigger reassessment if IPSS worsens by 3 or more points, or new symptoms appear."},
         {step:"Step 2", title:"Alpha-blocker \u2014 voiding symptoms dominant", when:"bothersome voiding, moderate\u2013severe LUTS",
          fromLabel:"conservative measures insufficient",
          html:"<b>Tamsulosin MR 400 micrograms OD, usually after breakfast or the first meal</b> (first choice in the Greater Manchester formulary) \u00b7 <b>alfuzosin MR 10 mg OD, usually after the same meal each day</b> (less retrograde ejaculation) \u00b7 <b>doxazosin MR 4\u20138 mg OD</b> (also treats hypertension) \u2014 initiate and titrate doxazosin and terazosin cautiously because of first-dose/postural hypotension. Follow the product-specific administration instructions. Works within days to 2\u20134 weeks, improving IPSS by about 4\u20136 points (NNT ~4) \u2014 but <b>does not shrink the prostate or alter long-term progression</b>. Counsel: dizziness, postural hypotension and falls, particularly in older adults, people taking antihypertensives and those using PDE5 inhibitors; retrograde ejaculation (particularly with tamsulosin), which is distinct from general sexual dysfunction; and intra-operative floppy iris syndrome \u2014 ask whether cataract surgery is planned and ensure the ophthalmologist knows about current or previous alpha-blocker exposure. Do not advise routine discontinuation solely to prevent floppy iris syndrome; that decision belongs to the ophthalmic surgical team. Reassess at 4\u20136 weeks; continue if IPSS improves by \u22653 points."},
         {step:"Step 3", title:"Add a 5-alpha-reductase inhibitor", when:"prostate &gt;30 g (PSA &gt;1.4), or PSA &gt;1.5.",
          fromLabel:"enlarged prostate / high progression risk",
          html:"<b>Finasteride 5 mg OD</b> or <b>dutasteride 500 micrograms OD</b> \u2014 symptom benefit is slow and may require at least 6 months; treatment is intended for long-term use. Reduces prostate volume by 20\u201330% and progression to retention or surgery by about 50% (NNT ~18), and reduces prostate cancer risk by 25% \u2014 an underused benefit. Combination therapy cut the risk of clinical progression by 66% versus placebo in MTOPS (doxazosin alone 39%, finasteride alone 34%), significantly more than either drug alone; available as a single pill (<b>Combodart</b>). Warn: reduced libido, erectile and ejaculatory dysfunction (may persist after stopping), gynaecomastia; <b>depression and suicidal ideation</b> (finasteride; precautionary warning for dutasteride) \u2014 ask about previous depression or suicidal ideation before prescribing, monitor mood and sexual function at review, and advise the patient to report any mood change (MHRA Drug Safety Updates 2024 and 2026). Advise patients to report breast lumps, breast pain or nipple discharge. Small amounts of finasteride have been detected in semen: the SPC advises minimising exposure of a pregnant partner to semen — this is not a universal contraception requirement."},
         {step:"Step 4", title:"Antimuscarinic or beta-3 agonist \u2014 storage symptoms", when:"storage symptoms persisting after bladder retraining",
          fromLabel:"retention and significant residual EXCLUDED first",
          html:"<b>Antimuscarinic per the Greater Manchester formulary:</b> oxybutynin (first choice, but <b>not to be prescribed in frail older people</b>) or tolterodine 2 mg BD (first choice); solifenacin 5 mg OD is another option. Consider cognitive impairment and cumulative anticholinergic burden; review constipation, dry mouth, blurred vision and confusion; warn about worsening stream or inability to pass urine; consider PVR when emptying is poor or retention risk is present; review every 4\u20136 weeks until stable. <b>Mirabegron 50 mg OD</b> (beta-3 agonist) is an option when antimuscarinics are contraindicated, ineffective or not tolerated (<b>NICE TA290</b>); vibegron is a NICE technology-appraisal option where locally commissioned and on the formulary. Mirabegron: contraindicated with BP \u2265180/110 mmHg; measure BP before initiation and periodically; caution in clinically significant bladder outlet obstruction and when combined with antimuscarinics (urinary retention reported); check renal and hepatic function where relevant \u2014 25 mg rather than 50 mg in severe renal impairment or moderate hepatic impairment (SPC); consider interactions with narrow-therapeutic-index CYP2D6 substrates (e.g. flecainide, propafenone, some tricyclic antidepressants); monitor digoxin levels if clinically appropriate. Can be added to an alpha-blocker for mixed symptoms."},
         {step:"Step 5", title:"Desmopressin \u2014 confirmed nocturnal polyuria only", when:"diary confirms it and fluid measures have failed",
          fromLabel:"treat the real driver first",
          html:"Manage fluids and the underlying condition first; consider a timed loop diuretic or desmopressin. Consider desmopressin only for <b>nocturnal polyuria confirmed on a frequency-volume chart</b>, after other medical causes have been assessed and other measures have not helped \u2014 not solely for nocturia. It should generally be initiated after discussion with, or according to, the local urology pathway. <b>Before prescribing:</b> confirm normal baseline serum sodium; check renal function; assess for heart failure, peripheral oedema, uncontrolled hypertension, polydipsia and fluid overload; review diuretics, SSRIs, tricyclic antidepressants, carbamazepine, NSAIDs and other medicines associated with SIADH or hyponatraemia; ensure the patient can comply with fluid restriction. <b>Licensed nocturia product (Noqdirna):</b> usual male dose 50 micrograms sublingually one hour before bedtime. <b>Restrict fluid intake from 1 hour before until 8 hours after the dose.</b> Do not use in moderate or severe renal impairment, previous hyponatraemia, SIADH, habitual polydipsia or cardiac failure/fluid overload. <b>Sodium:</b> CG97 minimum \u2014 sodium at 3 days, stop if below normal; SPC schedule at 65 or over \u2014 normal sodium before treatment, then in the first week (day 4\u20138) and at 1 month, with additional monitoring according to risk. Stop if sodium falls below the lower limit of normal or symptoms of hyponatraemia develop. Treat the actual driver where there is one \u2014 OSA, ankle oedema, evening diuretic, poorly controlled diabetes or heart failure."},
         {step:"Step 6", title:"Refer for surgery", when:"refractory after 6 months of optimised therapy",
          fromLabel:"maximal medical therapy failed",
          html:"<b>TURP, HoLEP</b>, or the day-case alternatives <b>Rezum and Urolift</b>; also <b>prostate artery embolisation</b>. Choice of procedure, and its effects on ejaculation, should be discussed through the current local urology pathway."}
       ]},
       {b:"warn", html:"<b>Prescribing cautions.</b> Alpha-blockers with PDE5 inhibitors (sildenafil) cause profound hypotension \u2014 tamsulosin is the most selective with the smallest BP drop. Antimuscarinics are contraindicated in urinary retention, narrow-angle glaucoma and severe constipation. 5-ARIs are teratogenic \u2014 women of childbearing potential must not handle crushed or broken tablets, and treated men should not donate blood. After 6 months or more of finasteride, PSA is usually approximately 50% lower: double the measured value for comparison with untreated thresholds, and document that you have; a sustained rise from the on-treatment nadir requires assessment (same principle for dutasteride per its product information). For acute retention, catheterise immediately where clinically appropriate and offer an alpha-blocker before catheter removal (CG97). And for a trial without catheter (<b>TWOC</b>), start tamsulosin 48 hours before removal \u2014 it raises success to about 60%."},
       {b:"why", html:"Two prescribing points worth holding onto. <b>Anticholinergic burden in older men:</b> it accumulates across polypharmacy and is associated with cognitive decline, falls and constipation; where an antimuscarinic is contraindicated, ineffective or not tolerated, mirabegron is the NICE TA290 option — with its own BP, retention and interaction cautions. And tadalafil 5 mg OD is licensed for LUTS/BPH in men with comorbid erectile dysfunction \u2014 a useful dual-purpose option that is easy to forget."}
     ]},

    {id:"monitor", nav:"Monitoring", title:"Follow-up, PSA surveillance and safety-netting",
     blocks:[
       {b:"table", head:["When","What","Action"], rows:[
         ["<b>4\u20136 weeks</b>","Alpha-blocker review (then every 6\u201312 months); antimuscarinic review every 4\u20136 weeks until stable (then every 6\u201312 months)","<b>IPSS or another validated score, symptom response and bother, adherence, BP and postural symptoms, side effects</b> (retrograde ejaculation, dizziness, falls; cognition, constipation and dry mouth with antimuscarinics; PVR if clinically indicated). Repeat the dipstick if a UTI was treated; review the bladder diary"],
         ["<b>3 months</b>","Repeat IPSS and document the change","Improved by \u22653 points \u2192 continue and review at 6 months. No response \u2192 review adherence and the diagnosis, consider adding a 5-ARI, or refer"],
         ["<b>3\u20136 months</b>","5-ARI effect (then every 6\u201312 months)","<b>Benefit takes months \u2014 do not judge it early.</b> Reassess symptoms and retention risk; ask about sexual and mood adverse effects"],
         ["<b>6 months</b>","U&amp;E, and PSA if on a 5-ARI","<b>Document that the true value is the measured PSA doubled.</b> Address 5-ARI sexual side effects \u2014 they often improve, but may persist after stopping (MHRA 2026) and the discontinuation rate is high. Ask about mood"],
         ["<b>Every 6–12 months</b>","IPSS, PSA interpretation if on a 5-ARI, DRE and renal function where indicated","Ask about sexual function, mood (5-ARI), and new haematuria, infection, retention or neurological symptoms. <b>Consider step-down if symptoms have stayed mild for 12 months</b>"],
         ["Watchful waiting","If IPSS \u22647","Review at 12 months; reassess sooner if IPSS worsens by \u22653 points"],
         ["<b>PSA surveillance</b>","Annual, unless already in a surveillance programme","A PSA doubling time under 2 years is an urgent urology referral \u2014 velocity is more sensitive for clinically significant cancer than the absolute value. On a 5-ARI, a sustained rise from the on-treatment nadir requires assessment, even when \u201cnormal\u201d."],
         ["<b>Medication safety</b>","Annual","Review anticholinergic burden and cognition; consider deprescribing an antimuscarinic in older men (STOPP/START), with mirabegron an option if antimuscarinics are unsuitable (NICE TA290) \u2014 check BP and interactions"],
         ["Sodium on desmopressin","<b>Normal baseline sodium, then 3 days after starting</b> (NICE CG97 minimum); if 65 or over, baseline, day 4\u20138 and one month (Noqdirna SPC), then according to risk","Stop if sodium falls below the lower limit of normal or symptoms of hyponatraemia develop; reinforce fluid restriction from 1 hour before to 8 hours after the dose"]
       ]},
       {b:"cards", items:[
         
       ]},
       {b:"cards", items:[
         {tone:"red", h:"\ud83d\udd34 999", html:"\u201cSuddenly unable to pass urine with a painful, full bladder \u2014 A&amp;E straight away.\u201d Also heavy bleeding with clots, collapse, fever with rigors, or <b>new numbness in the saddle area with leg weakness</b>."},
         {tone:"amber", h:"\ud83e\ude78 Blood in urine", html:"\u201cVisible blood in the urine always needs checking \u2014 even once, even if it settles.\u201d"},
         {tone:"blue", h:"\ud83d\ude35 First-dose dizziness", html:"\u201cThe outlet-relaxing tablet can drop your blood pressure, especially at first \u2014 take it as the label says, stand up slowly, and come back if you get dizziness, falls or faints.\u201d"},
         {tone:"amber", h:"\ud83d\udc41\ufe0f Eye surgery", html:"\u201cIf you are having cataract surgery, tell the eye surgeon you take, or have taken, tamsulosin or a similar tablet \u2014 it affects the operation. Don't stop it yourself; the eye team will advise.\u201d"},
         {tone:"green", h:"\u23f3 Give the second tablet time", html:"\u201cThe shrinking tablet can take six months or more \u2014 don't lose heart in the first few weeks. Tell us promptly about low mood, suicidal thoughts or sexual problems while taking it.\u201d"},
         {tone:"amber", h:"\u26a0 Same-day and prompt review", html:"Same day: unable to pass urine, especially with lower abdominal pain or swelling; fever, rigors or systemic illness with urinary symptoms; new leg weakness, saddle numbness or severe back pain. Prompt review: any visible blood in the urine, even if it settles; worsening stream or incomplete emptying after starting a bladder-relaxing tablet (antimuscarinic or mirabegron); dizziness, falls or faints after starting an alpha-blocker."},
         {tone:"cream", h:"\ud83d\udcd8 Information and support", html:"Provide a LUTS/BPH patient leaflet (NHS or Prostate Cancer UK); <b>Prostate Cancer UK</b> for men worried about cancer risk. Confirm they know when to return urgently. <b>Acute retention can recur after a TWOC</b> \u2014 men must know it is an emergency."}
       ]},
       {b:"say", html:"Most prostate-related urinary symptoms settle with simple measures and a tablet that relaxes the bladder outlet \u2014 that one works within days. If your prostate is enlarged we add a second tablet that shrinks it, but that one can take six months or more, so don't lose heart early. I'll keep an eye on your symptoms, and your kidney bloods and PSA where needed, and one thing to know: if that second tablet is doing its job it halves the PSA reading, so I double it when I look at the result."}
     ]},

    {id:"loop", nav:"Not responding?", title:"Not improving? Re-check before escalating", sub:"",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"1 · Retention", html:"Palpable bladder, large post-void residual, rising creatinine → chronic retention → urology (don't add an antimuscarinic)."},
         {tone:"blue", h:"2 · Right target", html:"Voiding treated as voiding, storage as storage? Mixed picture needs both."},
         {tone:"amber", h:"3 · Adequate trial", html:"Alpha-blocker given 4–6 weeks? 5-ARI given at least 6 months? Dose/adherence?"},
         {tone:"blue", h:"4 · Nocturia driver", html:"3-day chart re-read — nocturnal polyuria (fluids, OSA, oedema, <b>diuretic timing</b>) versus prostatic?"},
         {tone:"blue", h:"5 · Red flags", html:"Visible haematuria, hard/nodular DRE, rising PSA (corrected) → suspected-cancer pathway."},
         {tone:"blue", h:"6 · Refer", html:"Refractory bothersome symptoms despite optimised therapy → urology (surgical options)."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral \u2014 who and how fast",
     sub:"Most men with LUTS \u2014 around 60\u201370% \u2014 can be safely managed in primary care.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999 / A&amp;E / same-day", html:"<b>Painful inability to pass urine with a palpable bladder</b> \u00b7 <b>suspected urosepsis</b> \u00b7 <b>acute retention with neurological symptoms</b> \u00b7 <b>suspected cauda equina</b> \u2014 new retention or incontinence with saddle anaesthesia, severe back pain or leg weakness \u00b7 <b>high-pressure chronic retention</b> with renal impairment, hydronephrosis or severe systemic disturbance."},
         {tone:"red", h:"Same-day urology", html:"Painful retention not yet catheterised \u00b7 <b>significant hydronephrosis</b> on imaging \u00b7 <b>rapidly rising creatinine with LUTS</b>."},
         {tone:"purple", h:"Suspected cancer pathway \u00b7 NICE NG12", html:"<b>Aged \u226545 with unexplained visible haematuria without UTI, or haematuria persisting/recurring after successful UTI treatment \u2014 refer for bladder and renal cancer</b> \u00b7 unexplained non-visible haematuria aged \u226560 with dysuria or a raised white cell count (bladder) \u00b7 <b>a malignant-feeling prostate on DRE, regardless of PSA</b> \u00b7 <b>PSA above the NG12 age-specific threshold</b> in a patient with possible prostate-cancer symptoms \u00b7 consider non-urgent bladder cancer referral for recurrent or persistent unexplained UTI at \u226560. NICE NG12 (updated April 2026)."},
         {tone:"amber", h:"Urgent routine urology", html:"<b>Chronic retention \u2014 urgent if residual &gt;1 litre, palpable/percussible bladder, renal impairment or hydronephrosis (CG97)</b>, even if painless \u00b7 <b>recurrent or persistent UTI</b> \u00b7 renal impairment thought secondary to lower urinary tract dysfunction \u00b7 hydronephrosis, stones or recurrent haematuria \u00b7 suspected urethral stricture \u00b7 neurological symptoms suggesting neurogenic bladder \u00b7 <b>PSA doubling time under 2 years</b>."},
         {tone:"blue", h:"Routine urology", html:"LUTS refractory to maximal primary care treatment \u2014 ≥6 months of an optimised alpha-blocker plus a 5-ARI where appropriate \u00b7 failed or poorly tolerated conservative/drug treatment \u00b7 bothersome symptoms where surgery or a procedure is being considered (TURP, HoLEP) \u00b7 <b>failed TWOC</b> \u00b7 uncertain diagnosis. Use the local Greater Manchester urology referral pathway."},
         {tone:"cream", h:"Manage in primary care", html:"<b>Mild LUTS (IPSS \u22647) with no red flags</b> \u00b7 <b>moderate LUTS (IPSS 8\u201319) with normal investigations</b>, for watchful waiting or pharmacotherapy \u00b7 <b>OAB without haematuria or infection</b>. NICE CG97 explicitly supports primary care drug trials."}
       ]},
       {b:"why", html:"Two thresholds are worth being firm about. <b>Recurrent UTI in a man is never normal</b> \u2014 it implies a structural abnormality (BPH with incomplete emptying, a stone, a stricture, reflux) and needs upper-tract imaging and cystoscopy. And chronic painless retention with a high residual needs surgery or long-term catheterisation to protect the kidneys \u2014 primary care pharmacotherapy alone is not sufficient. In the other direction, over-referral creates waiting, anxiety and cost for men who could be treated well in general practice."},
       {b:"say", html:"We've checked there's nothing more serious going on and given the tablets a fair go \u2014 if they're not doing enough, the urology team has procedures that physically relieve the blockage. I'll keep everything going while you wait."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 67-year-old getting up four times a night, with a weak stream and a sense of not emptying. He is on amlodipine and an evening furosemide, and bought Sudafed for a cold last week. His father had prostate cancer and he says he would \u201crather just have the blood test\u201d."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"<b>Splits voiding from storage</b> rather than accepting \u201cprostate trouble\u201d; scores <b>IPSS with the bother question</b> and sends a <b>3-day chart</b>; reviews the medication \u2014 the evening diuretic and the decongestant may be the whole problem; <b>offers the DRE and checks renal function if retention or renal impairment is suspected</b>; has a genuine two-sided <b>PSA discussion and documents it</b>, including the family-history threshold; recognises the <b>NG12 routes</b>; and \u2014 the step candidates miss \u2014 offers conservative measures as treatment rather than as a preamble to the prescription."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Direct, product-specific sources; checked 3 October 2026.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>NICE CG97 \u2014 Lower urinary tract symptoms in men (2010, updated 2015)<br><a href="https://www.nice.org.uk/guidance/cg97" rel="noopener">nice.org.uk/guidance/cg97</a><span class="rd"> \u2014 IPSS, conservative measures as first-line, the drug ladder by phenotype, and support for primary care pharmacotherapy trials.</span></li>'+
         '<li><b>NICE NG12 \u2014 Suspected cancer: recognition and referral (updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> \u2014 prostate: suspected-cancer pathway for a malignant-feeling DRE or a PSA above the age-specific range; bladder and renal: unexplained visible haematuria at 45 and over (without UTI, or persisting/recurring after treatment), non-visible haematuria at 60 and over with dysuria or raised WCC; non-urgent bladder referral for recurrent or persistent unexplained UTI at 60 and over</span></li>'+
         '<li><b>NICE CG97 \u2014 Lower urinary tract symptoms in men: management</b><br><a href="https://www.nice.org.uk/guidance/cg97" rel="noopener">nice.org.uk/guidance/cg97</a><span class="rd"> \u2014 drug ladder, desmopressin for nocturnal polyuria and sodium check at 3 days; PSA information where LUTS suggest BOO, the prostate is abnormal or the patient is concerned; no routine PVR at initial assessment; chronic retention &gt;1 litre; no homeopathy, acupuncture or phytotherapy (CG97 does not set PSA referral thresholds; those on this page come from NICE NG12)</span></li>'+
         '<li><b>NICE TA290 \u2014 Mirabegron for overactive bladder</b><br><a href="https://www.nice.org.uk/guidance/ta290" rel="noopener">nice.org.uk/guidance/ta290</a><span class="rd"> \u2014 mirabegron as an option when antimuscarinics are contraindicated, clinically ineffective or not tolerated</span></li>'+
         '<li><b>MHRA Drug Safety Update (2024) \u2014 Finasteride: reminder of the risk of psychiatric side effects and of sexual side effects</b><br><a href="https://www.gov.uk/drug-safety-update" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> \u2014 depression, suicidal thoughts, potentially persistent sexual dysfunction; ask about psychiatric history</span></li>'+
         '<li><b>MHRA Drug Safety Update (2026) \u2014 Finasteride and dutasteride: updated safety warnings</b><br><a href="https://www.gov.uk/drug-safety-update" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> \u2014 dutasteride-specific advice</span></li>'+
         '<li><b>MHRA SPC \u2014 Finasteride 5 mg tablets (PL 20395/0067)</b><br><a href="https://products.mhra.gov.uk/" rel="noopener">products.mhra.gov.uk</a><span class="rd"> \u2014 double PSA after 6 months; investigate a sustained rise; semen exposure of a pregnant partner</span></li>'+
         '<li><b>MHRA SPC \u2014 Mirabegron Astellas 50 mg prolonged-release tablets (PLGB 00166/0416)</b><br><a href="https://products.mhra.gov.uk/" rel="noopener">products.mhra.gov.uk</a><span class="rd"> \u2014 contraindicated at BP \u2265180/110 mmHg; BP monitoring; retention with BOO and antimuscarinics; renal/hepatic dose restrictions; CYP2D6 and digoxin interactions</span></li>'+
         '<li><b>MHRA SPC \u2014 Noqdirna 50 microgram oral lyophilisate (PL 03194/0119)</b><br><a href="https://products.mhra.gov.uk/" rel="noopener">products.mhra.gov.uk</a><span class="rd"> \u2014 dose, fluid restriction, contraindications, sodium monitoring at 65 and over</span></li>'+
         '<li><b>Greater Manchester Medicines Management Group (GMMMG) Formulary \u2014 Obstetrics, gynaecology and urinary-tract disorders</b><br><a href="https://www.greatermanchesterformulary.nhs.uk/" rel="noopener">greatermanchesterformulary.nhs.uk</a><span class="rd"> \u2014 tamsulosin first choice; oxybutynin and tolterodine first choice (oxybutynin not in frail older people); mirabegron alternative</span></li>'+
         '<li><b>MTOPS (NEJM 2003) and CombAT (BJU Int 2010)</b><span class="rd"> \u2014 combination alpha-blocker plus 5-ARI reduced the risk of clinical progression by 66% versus placebo (doxazosin 39%, finasteride 34%) in MTOPS, and is most cost-effective in men at high progression risk</span></li>'+
         '<li>EAU Guidelines on Non-neurogenic Male LUTS (2023, international) \u00b7 NICE QS45<span class="rd"> \u2014 IPSS as the tracked outcome measure</span></li>'+
         '<li><b>STOPP/START v3 criteria (international)</b><span class="rd"> \u2014 deprescribing antimuscarinics in men over 65, and the cognitive-decline association (HR 1.2\u20131.4) behind the annual anticholinergic burden review</span></li>'+
         '<li><b>Cochrane systematic review (2014) \u2014 bladder training</b><span class="rd"> \u2014 urgency episodes reduced by about 50%, with efficacy similar to antimuscarinics at 6 months and better long-term adherence</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> \u2014 supplementary dose check only; product SPCs and the local formulary above are the primary dose and safety sources</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Male lower urinary tract symptoms \u2014 NICE CG97, NICE NG12 (updated April 2026) and NICE TA290. Diagnosis and management are merged on this page; there is no separate LUTS pathway to cross-check. Benign prostatic enlargement has its own page for prostate-specific detail, and prostatitis is managed separately. Verify all doses against the current product SPC and the Greater Manchester formulary, and the current age-specific PSA thresholds against NICE NG12 (updated April 2026), before prescribing; refer through the local Greater Manchester urology pathway."
});
