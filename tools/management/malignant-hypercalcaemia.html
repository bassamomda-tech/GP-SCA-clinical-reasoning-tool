<script>
MG.render({
  icon:"🦴",
  title:"Malignant hypercalcaemia — the complete guide",
  eyebrow:"Protocol · a reversible emergency that mimics dying",
  stemTitle:"Rehydrate first, then ONE bisphosphonate — and check the calcium in any cancer patient who is suddenly deteriorating, because this looks exactly like the dying phase and is reversible",
  stemSub:"One page for the whole condition: recognise the non-specific picture, confirm with an albumin-adjusted calcium and judge the urgency on symptoms as well as the number, escalate symptomatic or significant hypercalcaemia the same day to acute oncology, palliative care or the receiving hospital, where supervised rehydration is followed by a single IV bisphosphonate infusion — never two — remembering it takes several days to a week to work. This page covers malignant hypercalcaemia in adults; it does not cover general hypercalcaemia, primary hyperparathyroidism, children or pregnancy. Because that week matters, the decision to treat is a goals-of-care decision as much as a biochemical one, and the prognosis is poor enough that advance care planning belongs in the same conversation.",
  guideline:"GMEC Palliative Care Guidelines (6th ed, 2025) · NICE NG12 (amended 2025) · BNF/SPC",
  reviewed:"9 September 2026",
  nextReview:"9 March 2027",
  meta:[
    {t:"GMEC Palliative Care Pain &amp; Symptom Control Guidelines (6th ed, April 2025)"},
    {t:"BNF and SPC — bisphosphonate dosing"},
    {t:"NICE NG12 — myeloma direct-access route", tone:"tw"},
    {t:"Adults with malignant hypercalcaemia only — not general hypercalcaemia, primary hyperparathyroidism, children or pregnancy"},
    {t:"Poor prognosis — ACP indicated"},
    {t:"v1.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#severe"><b>Recognise</b><small>Mimics dying</small></a><a href="#confirm"><b>Urgency</b><small>Adjusted Ca · symptoms</small></a><a href="#workup"><b>Cause &amp; tests</b><small>PTH · myeloma tests</small></a><a href="#ladder"><b>Treat</b><small>Escalate · fluids then ONE bisphosphonate</small></a><a href="#monitor"><b>Follow-up</b><small>4–7 days · ACP</small></a></div>',
  quickSub:"If you read nothing else on this page, read these six cards. Every number traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ It mimics the dying phase — and it is reversible", html:"Hypercalcaemia may present as rapid clinical decline mimicking the dying phase, but it can be reversed. Drowsiness, confusion and nausea overlap with dying, so a low threshold to check calcium in a deteriorating cancer patient is essential — this is one of the few oncological emergencies that is readily reversible if caught."},
    {tone:"amber", h:"Use the albumin-adjusted calcium, and judge the urgency", html:"Use the local laboratory reference range and albumin-adjusted calcium. Any symptomatic hypercalcaemia, corrected calcium above 3.0 mmol/L, reduced consciousness, acute kidney injury, severe dehydration, vomiting, arrhythmia or inability to maintain oral intake requires urgent specialist/secondary-care assessment. Corrected calcium &lt;3.0 mmol/L and asymptomatic follows the GMEC local pathway (correct dehydration and recheck) — not a universal severity grading. Corrected calcium is an estimate and can be unreliable in severe hypoalbuminaemia, critical illness, renal failure, acid–base disturbance or paraproteinaemia."},
    {tone:"blue", h:"Rehydrate first — under medical supervision", html:"Calcium-driven polyuria causes volume depletion, which itself worsens the hypercalcaemia. Restore intravascular volume with 0.9% sodium chloride under medical supervision; the rate and total volume must be adjusted to cardiovascular status, renal function, urine output, age, frailty and severity of hypercalcaemia. Monitor for fluid overload. Then the bisphosphonate. <b>Bisphosphonates act too slowly to be used alone in a crisis.</b>"},
    {tone:"amber", h:"One bisphosphonate — never both", html:"EITHER zoledronic acid OR pamidronate disodium (per local guideline, BNF and SPC) — do not give both — a single intravenous bisphosphonate infusion. If eGFR is below 30 mL/min/1.73 m², there is AKI, or renal function is rapidly changing, do not administer a bisphosphonate in primary care — seek specialist advice. Denosumab may be considered by specialists, but carries a major hypocalcaemia risk in advanced CKD."},
    {tone:"green", h:"It takes about a week to work", html:"Zoledronic acid: effect &lt;4 days, maximum at 4–7 days, lasting about 4 weeks. Pamidronate: effect &lt;3 days, maximum at 5–7 days, lasting about 2.5 weeks. That delay is why treatment may be inappropriate if the prognosis is very short — seek specialist advice. Do not administer another bisphosphonate because the first dose has not worked within 24–48 hours; seek specialist advice if there is inadequate response or deterioration."},
    {tone:"blue", h:"The rate of rise matters as much as the number", html:"A rapid rise is tolerated far less well than a chronically elevated calcium, so <b>judge urgency on symptoms as well as on the level</b>. Two patients with identical numbers can be very differently unwell."}
  ],
  pathwaySub:"The whole task in five moves. The red step is the one that gets missed.",
  pathway:[
    {title:"Suspect it in any deteriorating cancer patient", html:"<b>Drowsy, confused, thirsty, constipated, polyuric</b> — \u201cstones, bones, groans, moans\u201d. <b>Check corrected calcium, albumin, U&amp;E, creatinine and eGFR, phosphate and magnesium</b>; ECG if severe, symptomatic or cardiac symptoms; PTH where this will help clarify the cause.", alert:true},
    {title:"Confirm and judge the urgency", html:"&lt;3.0 and asymptomatic (GMEC local pathway) → correct dehydration and recheck. Symptomatic, &gt;3.0, reduced consciousness, AKI, severe dehydration, vomiting or arrhythmia → <b>same-day acute oncology, palliative care or hospital advice/admission</b>. Urgency depends on calcium, symptoms, rate of rise, renal function, hydration and ECG/neurological features."},
    {title:"Work out the mechanism", html:"<b>Measure PTH first</b> (usually suppressed in malignancy) — <b>PTHrP-mediated (common; PTHrP testing is specialist-directed), osteolytic, or calcitriol-mediated</b> — and do not miss <b>co-existing primary hyperparathyroidism, drugs and dehydration</b>. Myeloma screen, with the NG12 direct-access route where the picture fits."},
    {title:"Specialist-directed: rehydrate, then a single bisphosphonate", html:"Review contributory drugs · supervised IV 0.9% sodium chloride, volume and rate individualised · then ONE IV bisphosphonate infusion. <b>Not in primary care if eGFR is below 30, AKI or rapidly changing renal function.</b> Weigh whether treatment fits the goals of care."},
    {title:"Recheck around 4–7 days, and plan ahead", html:"Repeat calcium and renal function according to severity and the specialist plan, assessing response around 4–7 days; recheck sooner if symptoms worsen or renal function is unstable. Repeat antiresorptive treatment only on specialist or local oncology/palliative-care advice. <b>Usually a marker of poor prognosis — discuss advance care planning alongside, not instead of, acute treatment.</b>"}
  ],
  sections:[

    {id:"severe", nav:"Recognise", title:"Recognise and confirm — the presentation that mimics dying",
     sub:"Symptoms are non-specific and overlap with dying, so a low threshold to check calcium in a deteriorating cancer patient is essential.",
     blocks:[
       {b:"dl", rows:[
         ["<b>\u201cBones, stones, groans, moans\u201d</b>","Bone pain · renal stones, polyuria and thirst · abdominal groans (nausea, anorexia, constipation) · psychic moans (fatigue, confusion, drowsiness)"],
         ["<b>Confirm</b>","Check corrected calcium, albumin, U&amp;E, creatinine and eGFR, phosphate and magnesium. Measure PTH where it will help clarify the cause; 25-hydroxyvitamin D when clinically indicated. ECG if severe, symptomatic or cardiac symptoms"],
         ["<b>Commonest cancers</b>","<b>Myeloma, breast, lung, renal and squamous tumours</b>"],
         ["<b>Suspect it with</b>","New drowsiness or confusion · nausea, vomiting or constipation · thirst or polyuria · dehydration or reduced intake · worsening weakness · acute renal impairment · unexplained rapid deterioration"],
         ["<b>Beware</b>","Hypercalcaemia may present as rapid clinical decline mimicking the dying phase — but it can be reversible"]
       ]},
       {b:"warn", html:"Because the symptoms — drowsiness, confusion, nausea — mimic many things including dying, hypercalcaemia is easily missed; yet it is one of the few oncological emergencies that is readily reversible if caught. In a patient with a reasonable prognosis, correcting it restores days to weeks of lucidity."},
       {b:"warn", html:"<b>Symptomatic or significant hypercalcaemia is an acute medical/oncological problem.</b> In primary care, assess ABCDE, obtain urgent blood tests, stop contributing medicines, provide appropriate immediate care and contact acute oncology, palliative care or the receiving hospital. <b>Do not delay hospital transfer while arranging bisphosphonate treatment.</b>"},
       {b:"dl", rows:[
         ["<b>NG12 — the criterion that applies here</b>","Myeloma is a leading cause of malignant hypercalcaemia, and NICE NG12 provides a direct-access route. In unexplained hypercalcaemia, anaemia, renal impairment or bone pain, consider myeloma and discuss appropriate testing with the laboratory/haematology service. The NICE NG12 age-specific criteria apply to people aged 60 and over with <b>persistent bone pain (particularly back pain) or an unexplained fracture</b>: send FBC, calcium, ESR or plasma viscosity, serum protein electrophoresis and serum free light chains together (urine Bence-Jones if free light chain testing is not available), and refer on a suspected cancer pathway if the results suggest myeloma. That catches a treatable haematological malignancy which frequently presents exactly this way. Where the underlying cancer is not yet known at all, admission or oncology referral allows diagnosis and treatment to proceed simultaneously. Restated in <a href='#refer'>Refer</a>"]
       ]},
       {b:"warn", html:"Possible <b>spinal cord compression, pathological fracture, severe renal impairment or marked hypercalcaemia</b> requires emergency/specialist pathways rather than waiting for outpatient cancer referral."}
     ]},

    {id:"confirm", nav:"Urgency", title:"Confirm and judge the urgency",
     sub:"Use the local laboratory reference range and albumin-adjusted calcium — symptoms, rate of rise, renal function, hydration and ECG/neurological features drive the urgency, not the number alone.",
     blocks:[
       {b:"table", head:["Situation","Features","Action"], rows:[
         ["<b>GMEC local pathway — asymptomatic</b>","<b>Corrected Ca &lt;3.0 mmol/L, asymptomatic and clinically stable</b>","<b>Correct dehydration and recheck calcium and renal function in 2–3 days; seek specialist advice if rising, persistent or symptomatic</b>"],
         ["<b>Urgent escalation</b>","<b>Symptomatic hypercalcaemia, or corrected Ca &gt;3.0 mmol/L</b> — potentially life-threatening","<b>Same-day acute oncology, palliative care or hospital advice/admission; active specialist-directed treatment</b>"],
         ["<b>Emergency features</b>","Any level with reduced consciousness or delirium, vomiting or inability to maintain fluids, severe dehydration, AKI or oliguria, arrhythmia or significant ECG changes","<b>Emergency — urgency depends on calcium, symptoms, rate of rise, renal function, hydration and ECG/neurological features</b>"],
         ["<b>ECG and cardiac features</b>","Shortened QT, bradyarrhythmias; a rare risk of arrest at very high levels","ECG if severe, symptomatic or cardiac symptoms"],
         ["<b>Rate matters</b>","A rapid rise is tolerated far less well than a chronically elevated calcium","<b>Judge urgency on symptoms as well as the number</b>"]
       ]},
       {b:"why", html:"Low albumin lowers the total measured calcium, while the ionised calcium may be normal or raised. Use albumin-adjusted calcium as an initial estimate, using the laboratory-reported value where available. Corrected calcium can be unreliable in severe hypoalbuminaemia, critical illness, renal failure, acid–base disturbance or paraproteinaemia; discuss measurement of ionised calcium with the laboratory or specialist team when the result does not fit the clinical picture. Symptoms and the rate of rise explain why two patients with the same level can be very differently unwell."}
     ]},

    {id:"workup", nav:"Cause &amp; tests", title:"Mechanism and investigations",
     sub:"The mechanism guides both treatment and prognosis.",
     blocks:[
       {b:"dl", rows:[
         ["<b>PTHrP-mediated — common</b>","Humoral hypercalcaemia: the tumour secretes parathyroid-hormone-related peptide — squamous lung, head and neck, renal, breast. PTHrP testing is generally specialist-directed and should not delay treatment or referral"],
         ["<b>Osteolytic</b>","Direct bone destruction by metastases or marrow infiltration — myeloma, breast"],
         ["<b>Calcitriol-mediated</b>","<b>Excess 1,25-vitamin D — lymphoma</b>"],
         ["<b>Don't miss</b>","If PTH is raised or inappropriately normal, consider primary or tertiary hyperparathyroidism, lithium-associated disease, or familial hypocalciuric hypercalcaemia where relevant; also drugs (thiazides, calcium and vitamin D supplements, lithium) and dehydration"]
       ]},
       {b:"table", head:["Investigation","Detail"], rows:[
         ["<b>Core bloods</b>","Corrected calcium, albumin, U&amp;E, creatinine, eGFR, phosphate, magnesium, ALP. <b>Measure PTH to distinguish PTH-mediated from non-PTH-mediated hypercalcaemia</b> — usually suppressed in malignancy. 25-hydroxyvitamin D (nutritional status) when clinically indicated; 1,25-dihydroxyvitamin D only after specialist discussion, particularly where lymphoma or granulomatous disease is suspected"],
         ["<b>Myeloma screen</b>","<b>FBC, ESR or plasma viscosity.</b> In unexplained <b>hypercalcaemia, anaemia, renal impairment or bone pain</b>, consider myeloma and discuss appropriate testing with the laboratory/haematology service. NG12 (aged 60 and over with persistent bone pain, particularly back pain, or unexplained fracture): add serum protein electrophoresis and serum free light chains, sent together (urine Bence-Jones if free light chain testing is not available); suspected cancer pathway referral if the results suggest myeloma (NICE NG12)"],
         ["<b>Find the primary</b>","Imaging directed by the history — CXR or CT chest, mammography, myeloma skeletal survey — if the cancer is not yet known"],
         ["<b>ECG</b>","<b>If severe, symptomatic or cardiac symptoms</b>"]
       ]},
       {b:"why", html:"A suppressed PTH confirms the hypercalcaemia is malignancy-driven rather than parathyroid, and because myeloma is a leading cause, NG12 provides fast-track access to protein electrophoresis and serum free light chain testing. On mechanism: PTHrP and osteolytic disease respond to rehydration plus a bisphosphonate; calcitriol-mediated lymphoma hypercalcaemia responds well to corticosteroids; and an unsuppressed PTH points to coincident primary hyperparathyroidism rather than the malignancy — a different management path."}
     ]},

    {id:"ladder", nav:"Treat", title:"Treatment — rehydrate, then a single bisphosphonate",
     sub:"In primary care, seek specialist advice. Weigh first whether treatment fits this patient's situation at all.",
     blocks:[
       {b:"warn", html:"<b>Symptomatic or significant hypercalcaemia is not a GP-administered treatment pathway.</b> Most practices cannot safely provide supervised IV fluids, urine-output monitoring, repeated U&amp;E/calcium testing, ECG monitoring, IV bisphosphonate infusion, or management of fluid overload, arrhythmia, AKI or reduced consciousness. Distinguish: <b>community/palliative care assessment</b>; <b>same-day hospital referral</b>; and <b>specialist-directed treatment at home or in an ambulatory oncology service</b>, where such a pathway exists. Do not delay hospital transfer while arranging bisphosphonate treatment."},
       {b:"warn", html:"<b>Points to weigh before treating:</b> is this a <b>first episode or after a long interval</b>? Was there <b>good prior quality of life</b>? Is the patient <b>willing and able to have IV treatment and blood tests</b>? And treatment takes about a week to work — it may be inappropriate if the prognosis is very poor."},
       {b:"ladder", steps:[
         {step:"GMEC local pathway", title:"Hydrate and recheck", when:"corrected Ca &lt;3.0, asymptomatic and clinically stable",
          html:"Check U&amp;E, creatinine and eGFR. Review calcium/vitamin D supplements, thiazides, lithium and other contributors; avoid harmful medication omission without considering the indication. Review ACE inhibitors, ARBs, diuretics and NSAIDs if there is dehydration or AKI, according to local sick-day and renal guidance — they are not usually direct causes of hypercalcaemia. Assess hydration and oral intake and encourage oral fluids if safe. Repeat calcium and renal function in 2–3 days (GMEC pathway); seek specialist advice if rising, persistent or symptomatic."},
         {step:"Symptomatic or &gt;3.0", title:"IV saline, then ONE bisphosphonate", when:"potentially life-threatening",
          fromLabel:"rehydration comes first",
          html:"Specialist-directed. Review medicines as above. Restore intravascular volume with 0.9% sodium chloride under medical supervision — rate and total volume adjusted to cardiovascular status, renal function, urine output, age, frailty and severity of hypercalcaemia (take particular care in heart failure, advanced CKD, frailty, oliguria, pulmonary disease or significant peripheral oedema). Monitor for fluid overload and urine output. Then a single IV bisphosphonate infusion. Do not use loop diuretics routinely to treat hypercalcaemia; consider them only for fluid overload after adequate rehydration and with specialist advice."},
         {step:"The bisphosphonate", title:"Zoledronic acid OR pamidronate — not both", when:"eGFR 30 or above",
          fromLabel:"per local guideline, BNF and SPC",
          html:"EITHER zoledronic acid OR pamidronate disodium, dosed per local guideline, the BNF and the SPC — do not give both. Onset: zoledronic acid effect &lt;4 days, maximum 4–7 days, lasting about 4 weeks; pamidronate effect &lt;3 days, maximum 5–7 days, lasting about 2.5 weeks. Give as a single intravenous infusion; infusion duration and renal precautions are product-specific. Do not administer another bisphosphonate because the first dose has not worked within 24–48 hours — seek specialist advice if there is inadequate response or deterioration."},
         {step:"Renal caution", title:"eGFR &lt;30 — do not give it", when:"seek specialist advice",
          fromLabel:"a hard stop",
          html:"If eGFR is below 30 mL/min/1.73 m², there is AKI, or renal function is rapidly changing, do not administer a bisphosphonate in primary care. Contact acute oncology, palliative care, renal or endocrinology services. eGFR is an estimate and may be unreliable in AKI or extremes of body size, and product information may refer to creatinine clearance or specific renal contraindications."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"💉 Denosumab", html:"May be considered by specialists when bisphosphonates are contraindicated or ineffective. It is not a simple renally safe replacement: advanced renal impairment and dialysis increase the risk of severe or prolonged hypocalcaemia, and calcium, phosphate, magnesium and vitamin D need specialist monitoring."},
         {tone:"amber", h:"⏱️ Calcitonin", html:"A specialist-directed adjunct for severe symptomatic hypercalcaemia when an immediate calcium-lowering effect is required while definitive treatment takes effect — it acts within hours. Tachyphylaxis limits duration of use. Not a routine GP option."},
         {tone:"green", h:"💊 Corticosteroids", html:"Use particularly for calcitriol-mediated hypercalcaemia, such as lymphoma, and in selected myeloma-related situations, under specialist direction."},
         {tone:"red", h:"🏥 Severe or AKI", html:"Consider renal or critical care input. Consider dialysis only in life-threatening cases with severe renal failure or fluid-management limitations."}
       ]},
       {b:"why", html:"Volume depletion from calcium-driven polyuria worsens hypercalcaemia, so saline rehydration is the essential first step; bisphosphonates then inhibit osteoclastic bone resorption but act too slowly to be used alone in a crisis. When a bisphosphonate cannot be used because of poor renal function, or has failed, specialists may consider denosumab, mindful of the hypocalcaemia risk in advanced CKD; calcitonin buys time by acting within hours under specialist direction; and corticosteroids specifically target the vitamin-D-driven mechanism seen in lymphoma — matching the agent to the cause and to the renal function."}
     ]},

    {id:"lifestyle", nav:"Supportive care", title:"Medication review and supportive care",
     sub:"Several everyday contributors are reversible in primary care and stack on top of the malignant drive.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"🛑 Stop the contributors", html:"Review or stop, where clinically appropriate: thiazide diuretics, calcium supplements, vitamin D supplements, vitamin A/retinoids, lithium, calcium-containing antacids, teriparatide or other bone-active medicines, and dehydration-inducing medicines in the context of AKI or poor intake."},
         {tone:"blue", h:"💧 Maintain hydration", html:"Encourage oral fluids, and mobilise where possible — immobility worsens hypercalcaemia. Do not encourage mobilisation where there is suspected pathological fracture, spinal instability or possible spinal cord compression."},
         {tone:"green", h:"🦷 Dental care", html:"Dental review and hygiene before and during repeated bisphosphonates, to reduce the risk of osteonecrosis of the jaw."},
         {tone:"cream", h:"🤲 Symptom control", html:"Treat nausea, constipation and delirium, with clear, honest communication with the patient and family."}
       ]},
       {b:"why", html:"Thiazides, calcium and vitamin D supplements, dehydration and immobility all stack on top of the malignant drive and are reversible in primary care — so addressing them both helps control the calcium and <b>reduces recurrence between infusions</b>. Dental care specifically mitigates the main long-term hazard of repeated bisphosphonates."}
     ]},

    {id:"monitor", nav:"Follow-up", title:"Monitoring, re-treatment and safety-netting",
     blocks:[
       {b:"table", head:["When","What"], rows:[
         ["<b>Around 4–7 days</b>","In significant or symptomatic disease, repeat calcium and renal function according to clinical severity and the treating specialist’s plan. A review at about 4–7 days is often useful because bisphosphonates may take several days to reach maximum effect. Recheck sooner if symptoms worsen or renal function is unstable"],
         ["<b>During treatment</b>","Calcium, U&amp;E/creatinine/eGFR, phosphate, magnesium, clinical hydration status, and fluid balance/urine output where receiving IV treatment — hypocalcaemia, hypophosphataemia and hypomagnesaemia may occur after antiresorptive treatment"],
         ["<b>Recurrence</b>","Repeat antiresorptive treatment only on specialist or local oncology/palliative-care advice, after reviewing calcium, renal function, symptoms, treatment response, goals of care and the cumulative risk of renal toxicity and hypocalcaemia"],
         ["<b>Refractory</b>","<b>Calcium not responding → seek specialist advice; consider denosumab</b>"],
         ["<b>Prognosis and ACP</b>","Malignant hypercalcaemia is usually a marker of advanced disease and poor prognosis, but the immediate episode may be substantially reversible. Discuss treatment goals, likely recurrence, disease-directed treatment, preferred place of care, escalation limits and advance care planning alongside — not instead of — acute treatment"],
         ["<b>Return urgently</b>","Recurring drowsiness, confusion, vomiting, severe thirst or polyuria, or reduced urine output → recheck calcium and renal function"]
       ]},
       {b:"why", html:"Recurrence is the rule, because the underlying malignancy keeps driving calcium release — so a single infusion is rarely the end of the story. Scheduled monitoring, pre-dose renal checks and a clear symptom safety-net catch the next episode early, while the poor prognosis makes parallel advance care planning appropriate."},
       {b:"say", html:"The blood test shows the calcium in your blood has gone up, and that is what has been making you so drowsy and sick — not, as it might have looked, a sudden turn for the worse in itself. The good news is that we can often bring it down. It takes fluid through a drip first, then a single infusion through the drip that works over several days to a week. I want to be straight with you that this does tend to come back, because the cancer keeps pushing the calcium up, and that it is a sign we should talk about what matters to you and what you would and would not want from here. But for now, treating this can give you back a stretch of feeling much clearer."}
     ]},

    {id:"refer", nav:"Refer", title:"Specialist advice and admission",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same-day advice or admission", html:"Symptomatic hypercalcaemia · corrected calcium &gt;3.0 mmol/L · reduced consciousness or delirium · vomiting or inability to maintain fluids · severe dehydration · AKI or oliguria · arrhythmia or significant ECG changes · suspected spinal cord compression or pathological fracture · unknown cancer with significant hypercalcaemia — contact acute oncology or the receiving hospital the same day."},
         {tone:"amber", h:"Seek specialist advice", html:"From acute oncology or palliative care for any treatment decision in primary care, for refractory calcium, or for eGFR &lt;30."},
         {tone:"blue", h:"New presentation", html:"If the underlying cancer is unknown, admission or oncology referral allows simultaneous diagnosis and treatment."},
         {tone:"purple", h:"NG12 · myeloma direct access", html:"Aged 60 and over with persistent bone pain (particularly back pain) or an unexplained fracture → FBC, calcium, ESR or plasma viscosity, serum protein electrophoresis and serum free light chains together (urine Bence-Jones if free light chain testing is not available); suspected cancer pathway referral if the results suggest myeloma. In unexplained hypercalcaemia, anaemia, renal impairment or bone pain, consider myeloma and discuss appropriate testing with the laboratory/haematology service."},
         {tone:"cream", h:"Balance of treatment", html:"Weigh a first episode versus recurrent disease, prior quality of life, willingness and ability to have IV treatment, and that bisphosphonates take about a week — treatment may be inappropriate if the prognosis is very short."}
       ]},
       {b:"why", html:"The decision to treat is as much a goals-of-care decision as a biochemical one: in a patient with a reasonable prognosis and good prior function, <b>correcting hypercalcaemia restores days to weeks of lucidity</b>; in someone in the last days of life, <b>IV treatment that takes a week to work may simply prolong dying</b> — which is why specialist advice is advised rather than optional."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"You are asked to visit a 71-year-old with known metastatic breast cancer who has become drowsy and confused over four days, is vomiting, and is barely drinking. The family have been told she is \u201cprobably dying\u201d and are asking about a syringe driver. She was gardening a fortnight ago."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Does not accept the dying-phase framing without checking a corrected calcium, U&amp;E and eGFR — the four-day trajectory in someone functioning well a fortnight earlier is the clue; <b>judges the urgency, recognises this is potentially reversible and arranges same-day specialist/hospital assessment</b>; rehydrates before considering a bisphosphonate and knows never to give two; <b>checks eGFR before the bisphosphonate decision</b>; reviews contributory drugs; and — the step candidates miss — holds both truths with the family at once: this is treatable now, and it signals a poor prognosis, so advance care planning belongs in the same conversation rather than instead of treatment."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>GMEC Palliative Care Pain and Symptom Control Guidelines (6th edition, April 2025)<span class="rd"> — the &lt;3.0 mmol/L asymptomatic local pathway, the symptomatic or &gt;3.0 mmol/L active-treatment threshold, rehydration-first sequence, the single-bisphosphonate rule, onset and duration figures for zoledronic acid and pamidronate, the eGFR &lt;30 contraindication, and the second-line options</span></li>'+
         '<li><b>BNF and Summary of Product Characteristics — bisphosphonate dosing</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — check the product-specific SPC for the zoledronic acid formulation used for hypercalcaemia of malignancy, pamidronate disodium, the denosumab product and indication, and calcitonin if used: indication, dose and infusion duration, renal restrictions, calcium/vitamin D precautions, monitoring, important adverse effects, re-treatment interval and the responsible specialist/service</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (amended 2025), recommendations 1.10.4 and 1.10.5</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — the myeloma route (April 2025 update): at 60 and over with persistent bone pain or an unexplained fracture, offer FBC, calcium, ESR or plasma viscosity, serum protein electrophoresis and serum free light chains together (Bence-Jones urine test if free light chain testing is not available), and refer on a suspected cancer pathway if the results suggest myeloma</span></li>'+
         '<li><b>GMEC Palliative Care Guidelines (2025) — hypercalcaemia</b><span class="rd"> — primary-care assessment and the advance care planning prompt</span></li>'+
         '<li><b>Local pathway — record locally</b><span class="rd"> — controlled-document version, approval date and review date; local acute oncology/palliative-care contact; whether IV bisphosphonates can be delivered in the community; local admission criteria; local protocol for denosumab and calcitonin</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Malignant hypercalcaemia — GMEC Palliative Care Pain and Symptom Control Guidelines (6th edition, April 2025), the BNF and SPC for bisphosphonate dosing, and NICE NG12 for the myeloma direct-access route. Rehydration comes first, and never give two bisphosphonates. A general (non-palliative) hypercalcaemia work-up is covered by the <a href=\"../algorithms/hypercalcaemia.html\">hypercalcaemia pathway</a>; the reasoning pathway for this presentation remains at the <a href=\"../algorithms/malignant-hypercalcaemia.html\">malignant hypercalcaemia pathway</a>. Follow your local guideline and verify all doses before prescribing."
