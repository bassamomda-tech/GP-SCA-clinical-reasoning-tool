<script>
MG.render({
  icon:"🔬",
  title:"Anogenital warts — the complete guide",
  eyebrow:"Protocol · assess &amp; manage in one place",
  stemTitle:"Treat the warts, but screen the patient — and never miss the lesion that is not a wart",
  stemSub:"Scope: adults with suspected uncomplicated external anogenital warts. Adapted from the BASHH national guideline for the management of anogenital warts in adults (2024) — written primarily for level 3 sexual-health services and adapted here for primary care — and to be used with local sexual-health, safeguarding, cancer and immunisation pathways. Children are covered by the paediatric safeguarding pathway. Recognise the presentations that are NOT simple warts (bowenoid papulosis, Buschke–Löwenstein, anal SCC, condylomata lata of syphilis, warts in a child), offer sexual-health assessment and STI testing by risk, choose treatment by site, size, number, morphology, preference and pregnancy, counsel on local reactions and recurrence, vaccinate by national eligibility, and safeguard.",
  guideline:"BASHH 2024 · UKHSA Green Book ch.18a · NHS CSP",
  reviewed:"8 September 2026",
  nextReview:"8 March 2027",
  meta:[
    {t:"BASHH national guideline 2024 (adults ≥16)"},
    {t:"SPS podophyllotoxin PGD"},
    {t:"Green Book ch.18a · Gardasil 9"},
    {t:"Suspected cancer · NG12 criteria that surface here", tone:"tw"},
    {t:"v2.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:"<div class='mg-layers'><a href='#severe'><b>Not a wart?</b><small>The five dangerous mimics</small></a><a href='#workup'><b>Screen</b><small>STI testing by risk + syphilis serology</small></a><a href='#ladder'><b>Treat</b><small>By site, size, preference, pregnancy</small></a><a href='#refer'><b>Refer</b><small>Sexual health by criteria; suspected cancer routes</small></a></div>",
  quickSub:"If you read nothing else on this page, read these six cards. Every figure traces to the source cited under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ A child with anogenital warts needs a safeguarding assessment", html:"Anogenital warts in a child require a safeguarding assessment. <b>Consider sexual abuse, particularly in children younger than 13 years</b> (NICE), while also considering vertical transmission, autoinoculation and non-sexual household transmission. Discuss promptly with the designated safeguarding professional/paediatric safeguarding team and follow local child-protection procedures; do not delay the assessment. Do not undertake anogenital examination or treatment outside your competence. BASHH 2024 covers adults aged 16 and over only."},
    {tone:"amber", h:"Not every wart is a wart — five mimics to hold in mind", html:"<b>Bowenoid papulosis</b> (pigmented, multifocal — a clinical form of HPV-associated squamous intraepithelial lesion, often HPV 16; needs specialist assessment/biopsy), <b>Buschke–Löwenstein tumour</b> (giant condyloma — rapidly growing, treatment-resistant), <b>anal SCC</b> (anal warts + rectal bleeding + change in bowel habit), <b>condylomata lata of secondary syphilis</b> (broad-based, flat, moist, grey-white, coalescing — syphilis serology), and <b>VIN/PIN/AIN</b> (ulcerated, indurated, &gt;40 or immunocompromised). <b>Do NOT treat any of these as simple warts.</b>"},
    {tone:"blue", h:"Warts are a marker of exposure — screen for everything else", html:"Offer sexual-health assessment and <b>STI screening according to sexual history, symptoms, examination findings and local sexual-health guidance</b>. For a new presentation this commonly includes HIV testing, syphilis serology and chlamydia/gonorrhoea NAAT, with site-specific sampling according to sexual exposure; hepatitis B and C testing where indicated. Sexual-health services are particularly appropriate for uncertain diagnosis, internal lesions, immunocompromise, pregnancy, extensive/recurrent disease, or when STI testing and partner advice are needed. Treating the visible warts does not reduce cancer risk — the cervical screening programme does."},
    {tone:"green", h:"Choose treatment by site, size, number and preference — and counsel on local reactions", html:"Choose by site, size and number, accessibility, morphology, patient preference, pregnancy/breastfeeding, previous response and local availability. Podophyllotoxin (0.5% solution preferred where it can be applied accurately; 0.15% cream for perianal or difficult-to-reach sites) BD × 3 days then 4 days off, reviewed at 4–5 weeks. Imiquimod 5% for suitable external lesions of any morphology, three nights a week, washed off after 6–10 hours, up to 16 weeks. Cryotherapy by a trained clinician, usually weekly, up to four sessions before reassessing. Imiquimod: local redness, soreness, swelling and superficial erosion are common and may indicate a local response — if severe, stop temporarily and seek review."},
    {tone:"amber", h:"Pregnancy and breastfeeding change everything topical", html:"No self-applied topical agent is licensed in pregnancy or breastfeeding: <b>avoid self-applied podophyllotoxin and imiquimod</b>. If treatment is needed, use cryotherapy, trichloroacetic acid (TCA), laser, electrosurgery or excision through an appropriately experienced service. Deferring treatment until after delivery is reasonable if symptoms and obstruction are not issues. Extensive lesions may rarely obstruct the birth canal and should be discussed with obstetrics; caesarean birth is not routinely recommended solely to prevent neonatal HPV transmission."},
    {tone:"green", h:"Recurrence is reactivation, not re-infection — say so proactively", html:"Recurrence is common and varies by treatment and population; it does not necessarily indicate reinfection — HPV may have been acquired months or years previously. Saying this at the clearance visit prevents real relationship harm. Smoking is associated with poorer response and HPV-related disease — offer cessation support. No test-of-cure is needed for successfully treated uncomplicated warts; persistent, recurrent or atypical lesions need reassessment."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step is where the harm hides — do not skip it.",
  pathway:[
    {title:"Exclude the lesions that are NOT simple warts", html:"Pigmented, ulcerated, indurated, fixed, bleeding or rapidly growing → specialist assessment and biopsy — bowenoid papulosis, VIN/PIN/AIN, Buschke–Löwenstein or SCC. Do not attribute rectal bleeding to warts without assessment: offer FIT where indicated for possible colorectal cancer, but refer an unexplained anal mass or anal ulceration directly on the suspected cancer pathway — do not wait for FIT. Any child → safeguarding assessment via the local safeguarding pathway. Flat moist grey-white papules → think condylomata lata: syphilis serology.", alert:true},
    {title:"Assess — history, sites, and the whole anogenital area", html:"Sexual history, partners, condom use, HIV status, immunosuppression, pregnancy, cervical screening status; itch, pain, bleeding, discharge. Examine all sites in good lighting — penis incl. urethral meatus, vulva/introitus, perianal skin. Document number, site, morphology, size, colour. Speculum only if internal vaginal or cervical warts are suspected; internal anal or urethral lesions need specialist assessment. Do not biopsy in primary care unless trained, equipped and working within an agreed pathway."},
    {title:"Screen — the same exposure that gave HPV may have given more", html:"Offer STI testing according to sexual history, symptoms, examination and local guidance — commonly HIV, syphilis serology and chlamydia/gonorrhoea NAAT from exposure sites; hepatitis B and C where indicated. Sexual-health services for uncertain or internal lesions, immunocompromise, pregnancy, extensive/recurrent disease or partner/psychosexual support. Check cervical screening status (warts do not alter intervals); pregnancy test if applicable."},
    {title:"Treat by site, size and preference — or refer for ablation", html:"Choose with the patient by site, size/number, accessibility, morphology, preference, previous response and local availability: podophyllotoxin or imiquimod 5% for suitable external warts (counsel on expected local reactions and when to stop), cryotherapy by a trained clinician. Pregnancy/breastfeeding → no self-applied agents; cryotherapy, TCA or specialist ablation, or defer. No treatment reliably eradicates HPV — expect recurrence and say so."},
    {title:"Vaccinate, advise partners, follow up", html:"Check vaccination history and offer Gardasil 9 by current national eligibility — it does not treat existing warts but protects against vaccine types not yet acquired. Routine partner notification is not required for warts alone; offer partners advice. Review at 4–5 weeks (podophyllotoxin) or about 8 weeks (imiquimod): less than ~50% improvement, poor tolerance or diagnostic uncertainty → switch modality or refer."}
  ],
  sections:[
    {id:"types", nav:"Classify", title:"Classification — which HPV lesion is this?", sub:"The fundamental distinction: most visible warts are caused by low-risk HPV 6/11 and are benign; high-risk HPV 16/18 cause most HPV-related cancers and are usually invisible. Atypical lesions need reassessment because co-existing dysplasia or malignancy can occur.",
     blocks:[
       {b:"table", head:["Lesion","Cause / look","Action"], rows:[
         ["<b>Condylomata acuminata (common anogenital warts)</b>","Mostly HPV 6 &amp; 11 (low-risk — benign; high-risk HPV co-infection can occur, so an atypical, indurated, ulcerated, fixed, pigmented, bleeding or treatment-resistant lesion needs specialist assessment and biopsy). Flesh-coloured, grey or pink soft pedunculated or sessile papules, cauliflower/papillomatous; single or multiple. Sites: vulva, introitus, perianal, penile shaft/glans/prepuce, perineum, inguinal","Clinical diagnosis — no biopsy, swab or HPV typing for a typical presentation"],
         ["<b>Flat (subclinical) condylomata</b>","Flat lesions identified at specialist colposcopy/anoscopy; acetic-acid whitening is non-specific and is not a routine primary-care diagnostic test","<b>Not routinely treated unless symptomatic or associated with dysplasia</b>"],
         ["<b>Intraepithelial neoplasia (VIN / PIN / AIN, incl. bowenoid papulosis)</b>","HPV 16/18 (high-risk). Flat, often pigmented or red-brown, multifocal papules — histologically grade 1–3","<b>Specialist assessment + biopsy (suspected cancer pathway where NG12 criteria are met). Do NOT treat with topical wart therapies</b>"],
         ["<b>Benign and other mimics</b>","Molluscum contagiosum, skin tags, pearly penile papules, vulval vestibular papillomatosis, condylomata lata (syphilis)","Clinical recognition; syphilis serology for condylomata lata; refer if uncertain"],
         ["<b>Cervical HPV disease</b>","Managed via the NHS Cervical Screening Programme; not visible at GP examination","<b>Ensure screening is up to date — visible warts confirm HPV exposure</b>"],
         ["<b>Recurrent respiratory papillomatosis</b>","Rare — laryngeal papillomas from perinatal HPV 6/11; hoarse voice in young children and adults","<b>ENT referral</b>"]
       ]},
       {b:"why", html:"Typical visible warts are caused by low-risk HPV 6/11 and are benign, but atypical lesions require reassessment because co-existing dysplasia or malignancy can occur; high-risk HPV 16/18 causes invisible infection of the transformation zone that can progress to dysplasia and cancer over years. A patient with visible warts has an infection unlikely to cause cancer; a patient with an abnormal cervical screening result may have no visible lesions at all. Treating visible warts therefore does not reduce cervical or anogenital cancer risk — the screening programme is the cancer-prevention tool."}
     ]},

    {id:"severe", nav:"Red flags", title:"Red flags — malignancy, mimics, children and immunosuppression", sub:"Most anogenital warts are benign. These presentations are not — and each demands a different route.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Child with anogenital warts", html:"Requires a safeguarding assessment. Consider sexual abuse, particularly in children younger than 13 years, unless there is clear evidence of vertical or non-sexual transmission; also consider autoinoculation and non-sexual household transmission. Discuss promptly with the designated safeguarding professional/paediatric safeguarding team and follow local child-protection procedures — the urgency and route are locally defined, but the assessment must not be delayed. Do not examine or treat outside your competence.", src:"NICE CG89 child maltreatment"},
         {tone:"red", h:"🔴 Buschke–Löwenstein tumour", html:"Large, rapidly growing, cauliflower-like mass failing standard treatment → giant condyloma acuminatum: locally destructive, penetrates deep tissue, low-grade malignant transformation risk. Suspected cancer pathway referral by site (penile, vulval or anal); CT/MRI for extent; surgical excision required."},
         {tone:"red", h:"🔴 Anal SCC", html:"Do not attribute rectal bleeding to warts without assessment. Offer FIT where indicated for possible colorectal cancer, but refer directly on the suspected cancer pathway for an <b>unexplained anal mass or anal ulceration — do not wait for FIT</b>. HPV 16/18-associated. <b>Rectal bleeding with anal lesions is not always haemorrhoids.</b> Some patients, particularly people living with HIV, may be eligible for specialist anal-neoplasia screening or surveillance according to local specialist protocols."},
         {tone:"red", h:"🔴 Bowenoid papulosis / VIN / PIN / AIN", html:"Pigmented, multifocal, flat papules, often in young adults — a clinical form of HPV-associated squamous intraepithelial lesion, often HPV 16 (not synonymous with VIN3/PIN3 in every case) → specialist assessment and biopsy. Ulceration, induration or bleeding, especially if older or immunocompromised → vulval, penile or anal suspected cancer pathway referral (by site) + biopsy. The most commonly misdiagnosed high-grade dysplasia — it looks like ordinary warts."},
         {tone:"amber", h:"🟠 Condylomata lata — the syphilis mimic", html:"Broad-based, flat, moist, grey-white coalescing papules at mucosal junctions (perianal, vulval) = secondary syphilis, teeming with Treponema pallidum and highly infectious. Syphilis serology is particularly important when lesions are broad-based, flat, moist or grey-white. Missing it leaves systemic syphilis untreated and contacts unnotified."},
         {tone:"amber", h:"🟠 Immunosuppressed / suspected immunodeficiency", html:"New extensive or rapidly progressing warts on immunosuppressants (transplant, anti-TNF, high-dose steroids) → HPV replication uncontrolled without T-cell immunity: urgent HIV test, FBC (lymphopenia), consider reducing immunosuppression where possible, GUM/dermatology management. Florid, recurrent, treatment-resistant disease: lower the biopsy threshold."},
         {tone:"amber", h:"🟠 Pregnancy", html:"Avoid self-applied podophyllotoxin and imiquimod in pregnancy and breastfeeding; if treatment is needed use cryotherapy, TCA or specialist ablation, or defer until after delivery; discuss extensive lesions that may obstruct the birth canal with obstetrics."}
       ]},
       {b:"why", html:"Bowenoid papulosis deserves specific emphasis because it is the commonest high-grade dysplastic condition misdiagnosed as common warts — young sexually active adults, multiple flat pigmented papules on the glans, prepuce or vulva, often HPV 16, and despite a benign look it is a squamous intraepithelial lesion that needs biopsy. The safeguarding point is the most important medicolegal point on this page: discuss promptly with the safeguarding lead at the visit where the lesions are found and follow the local child-protection pathway."}
     ]},

    {id:"history", nav:"History &amp; exam", title:"Targeted history and examination", sub:"A clinical diagnosis — the value of the assessment is the sites you check and the mimics you exclude.",
     blocks:[
       {b:"table", head:["What","Detail","Why"], rows:[
         ["<b>Sexual history</b>","Partners, condom use (condoms reduce but do not eliminate HPV transmission), HIV status — offer testing","Sets the screening and partner-advice plan"],
         ["<b>Symptoms and course</b>","Itch, pain, bleeding, discharge; duration and change; previous treatment and response","<b>Bleeding, induration or rapid change → the red-flag table</b>"],
         ["<b>Context</b>","Immunosuppression, pregnancy or breastfeeding, cervical screening status, advice for current partners","Each changes the route or the treatment"],
         ["<b>Examination</b>","With consent and a chaperone offered, all anogenital sites in good lighting: penile shaft, glans, prepuce AND urethral meatus; vulva and vaginal introitus (speculum not routine — only if internal vaginal or cervical warts suspected); perianal skin with the buttocks gently separated. Document number, site, morphology (pedunculated/sessile/flat), size, colour","Ask about urethral discharge, dysuria or haematuria; meatal warts or these symptoms → specialist assessment for intraurethral warts. No proctoscopy in primary care unless trained — ask about intra-anal symptoms (bleeding, discharge → GUM for internal examination)"],
         ["<b>Biopsy only within an agreed pathway</b>","Do not biopsy in primary care unless trained, equipped and working within an agreed pathway; refer atypical or suspicious lesions for specialist biopsy. Do not treat suspicious wart-like lesions empirically. Biopsy indications: atypical appearance (pigmented, ulcerated, indurated, fixed), failure of 2 standard treatment cycles, age &gt;40, immunocompromised, or a child","The biopsy list is the not-a-simple-wart list"]
       ]}
     ]},

    {id:"workup", nav:"Work-up", title:"Investigations — no test for the warts, several for the patient", sub:"Typical condylomata need no swab, biopsy or HPV typing. The tests are for what travels with them.",
     blocks:[
       {b:"table", head:["Test","Who","Why"], rows:[
         ["<b>HIV test</b>","<b>Commonly offered for a new presentation</b>, according to sexual history and local sexual-health guidance","Extensive or rapidly growing warts can indicate undiagnosed HIV immunosuppression"],
         ["<b>Syphilis serology</b>","<b>Commonly offered for a new presentation; particularly important when lesions are broad-based, flat, moist or grey-white</b>","Condylomata lata mimic warts; secondary syphilis is systemic and highly infectious"],
         ["<b>Gonorrhoea / chlamydia NAAT</b>","From exposure sites — throat and rectal testing based on exposure and local protocol","The same exposure can transmit other STIs; repeat testing and test-of-cure follow the guidance for any STI diagnosed"],
         ["<b>Hepatitis B and C</b>","Where indicated by risk","Per local sexual-health guidance"],
         ["<b>Cervical screening status</b>","All women","Anogenital warts do not alter cervical-screening intervals. Confirm the patient is registered and up to date with the NHS Cervical Screening Programme. Symptomatic cervical or vaginal lesions need clinical assessment, not routine screening alone; people living with HIV or other immunosuppression may need a separate specialist screening pathway"],
         ["<b>Pregnancy test</b>","If applicable","Changes the entire topical plan"],
         ["<b>Specialist investigations</b>","Biopsy (atypical/refractory — dermatology/GUM) · anoscopy (symptomatic intra-anal — GUM/colorectal) · colposcopy (abnormal cervical screening result + warts) · CT/MRI (suspected Buschke–Löwenstein)","Arranged by the receiving specialty"]
       ]},
       {b:"cards", items:[
         {tone:"purple", h:"NG12 criteria that surface here <span class='tw'>Suspected cancer</span>", html:"Anogenital warts themselves have no NICE NG12 criterion — the cancer risk lives in the mimics and the co-located cancers:<br>• An unexplained anal mass or unexplained anal ulceration → anal suspected cancer pathway referral — the route for the wart-like lesion that is indurated, ulcerated or rapidly growing, and for suspected Buschke–Löwenstein — no FIT is needed before this referral.<br>• An unexplained vulval lump, ulceration or bleeding → vulval suspected cancer pathway referral — the route for suspected VIN or vulval SCC.<br>• A penile mass or ulcerated lesion where an STI has been excluded as the cause, or a persistent penile lesion after STI treatment → penile suspected cancer pathway referral — the route for suspected PIN/penile SCC including bowenoid papulosis with atypia.<br>• Rectal bleeding → do not attribute it to warts without assessment; offer FIT where indicated for possible colorectal cancer (NICE HTG690), but refer directly on the appropriate suspected cancer pathway for an unexplained anal mass or anal ulceration — do not wait for FIT.", src:"NICE NG12 (updated April 2026) · NICE HTG690 · house rule"}
       ]}
     ]},

    {id:"ladder", nav:"Treat", title:"The treatment ladder — named agents, regimens and who applies them", sub:"Choose by site, size and number, accessibility, morphology, patient preference, pregnancy/breastfeeding, previous response and local availability — observation is also an option. Verify against the BNF, SPC and GM formulary; several options are sexual-health-delivered.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Patient-applied", title:"Podophyllotoxin 0.15% cream / 0.5% solution (Warticon®, Condyline®)", when:"suitable external warts — 0.5% solution preferred where it can be applied accurately; 0.15% cream for perianal or difficult-to-reach sites", fromLabel:"home treatment",
          html:"Apply BD for 3 consecutive days then 4 days without treatment = 1 cycle. Review at about 4–5 weeks: continue if there is a satisfactory response; change modality if there is less than 50% response. The local protocol defines the maximum number of cycles. Anti-mitotic (prevents cell division). External lesions only — do not use on internal vaginal or anal canal, cervical, urethral or oral lesions, or in pregnancy or breastfeeding unless specifically advised by a specialist. Do not apply to actively inflamed, eroded or bleeding skin — wait for the reaction to settle between cycles (avoids systemic absorption, which is teratogenic at high levels, and excess tissue damage)."},
         {step:"Patient-applied", title:"Imiquimod 5% cream (Aldara®)", when:"suitable external lesions of any morphology", fromLabel:"alternative patient-applied option",
          html:"Three nights per week (e.g. Mon/Wed/Fri) at bedtime, washed off after 6–10 hours, up to 16 weeks. Immune modulator (TLR7 agonist — stimulates local innate immunity); slower onset (4–8 weeks). Counselling: local redness, soreness, swelling and superficial erosion are common and may indicate a local treatment response. If the reaction is severe — severe ulceration, marked pain, infection or systemic illness — stop temporarily and seek review; treatment frequency may need to be reduced. Review at about 8 weeks. Set an alarm to wash it off — left on too long it causes severe local damage."},
         {step:"Clinician-applied", title:"Cryotherapy (liquid nitrogen)", when:"selected external lesions — an option in pregnancy", fromLabel:"trained clinician",
          html:"By trained personnel only, usually weekly; BASHH 2024 suggests an upper limit of four sessions before reassessing the diagnosis and referring for another modality — do not continue indefinitely. An option in pregnancy. Side effects: pain, blistering, ulceration, pigmentary change and possible scarring — give appropriate analgesia and aftercare advice. GP with training, sexual-health nurse or dermatology."},
         {step:"Clinician-applied", title:"Trichloroacetic acid (TCA) 80–90%", when:"soft warts on mucous membranes — an option in pregnancy", fromLabel:"specialist-applied",
          html:"Applied to individual warts and allowed to dry (frosting); weekly, up to 6 sessions. Avoid spreading — it causes a chemical burn."},
         {step:"Refractory", title:"Specialist options", when:"persistent, extensive or obstructive", fromLabel:"GUM / dermatology / surgery",
          html:"Sinecatechins 10% ointment (Veregen® — green tea catechins, TDS up to 16 weeks, MHRA-licensed, modest evidence) · imiquimod 3.75% (Zyclara®) · intralesional interferon · cidofovir cream (immunocompromised, off-label) · surgical excision, electrosurgery/diathermy, CO₂ laser, LLETZ — under GA where needed for large, refractory or obstructive disease."}
       ]},
       {b:"warn", html:"No treatment reliably eradicates HPV — every modality clears the visible warts only, and recurrence is common. <b>Avoid self-applied podophyllotoxin and imiquimod in pregnancy and breastfeeding</b> (not licensed; insufficient evidence for routine use) — <b>cryotherapy, TCA or specialist ablation, or defer treatment</b>. Avoid over-the-counter skin-wart products on genital skin. Review at 4–5 weeks: less than ~50% improvement, poor tolerance or diagnostic uncertainty → switch modality or refer. Persistent disease after an appropriate course of imiquimod or four cryotherapy sessions → reassess the diagnosis and refer."},
       {b:"say", html:"These are genital warts — caused by an extremely common virus, and harmless in themselves. The cream clears the visible warts but the virus can sit quietly in the skin, so they sometimes come back — that's the virus waking up, not a new infection. If I give you imiquimod: some redness and soreness where you put it is common; wash it off after six to ten hours, and if it becomes very sore, ulcerated or you feel unwell, stop and come back to see us. And we'll check for other infections at the sexual-health clinic, because the same contact that passed this on can pass on things we can actually cure."}
     ]},

    {id:"prevention", nav:"Prevent", title:"Vaccination, partners and prevention", sub:"The prevention conversation outlasts the treatment. Specialist anal-neoplasia pathways apply to some high-risk groups, not to everyone with warts.",
     blocks:[
       {b:"table", head:["Topic","Detail","Effect"], rows:[
         ["<b>HPV vaccination — Gardasil 9</b>","9-valent: HPV 6, 11, 16, 18, 31, 33, 45, 52, 58. Check vaccination history and offer by current national eligibility (Green Book ch.18a): school programme from Year 8; in England one dose under 25 years, two doses 6–24 months apart for eligible people aged 25 or over, three doses if HIV-positive or immunocompromised. GBMSM up to and including 45 years attending specialist sexual-health or HIV services are eligible if not previously vaccinated. Other adults are not routinely eligible solely because they have warts","Does not treat existing warts (the HPV is already present) but protects against types not yet acquired — best before sexual debut, still beneficial after"],
         ["<b>Condoms</b>","Reduce but do not eliminate HPV transmission, because HPV transmits skin-to-skin beyond the covered area","Still strongly advised, during and after treatment, and for the other STIs"],
         ["<b>Partners</b>","Routine partner notification is not required for anogenital warts alone (BASHH 2024). Offer advice to current partners about HPV, symptoms, vaccination and STI testing where appropriate","Partner notification is required if another STI is diagnosed; the decision to disclose is the patient's — support it"],
         ["<b>Smoking cessation</b>","Smoking is associated with poorer treatment response and HPV-related disease. NHS Stop Smoking referral","Offer cessation support without promising that stopping directly prevents recurrence"],

         ["<b>Cervical screening</b>","Warts do not alter screening intervals — confirm registration and that the patient is up to date with the NHS Cervical Screening Programme","The actual cancer-prevention tool"],
         ["<b>Anal-neoplasia pathways</b>","Do not arrange routine anal cytology solely because a patient has external anal warts. Refer symptomatic patients or those in an established local high-risk anal-neoplasia pathway; follow local HIV, sexual-health and colorectal protocols","Some patients, particularly people living with HIV, may be eligible for specialist anal-neoplasia screening or surveillance (ANCHOR trial: benefit from treating anal HSIL in people living with HIV)"],
         ["<b>Support</b>","Terrence Higgins Trust (tht.org.uk); Herpes Viruses Association HPV resources; GUM counselling","Where the psychosexual work continues"]
       ]}
     ]},

    {id:"psycho", nav:"The conversation", title:"The psychosexual conversation — three minutes that change everything", sub:"The diagnosis routinely causes more harm through shame and false inference than through the lesions. Address it explicitly.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"cream", h:"💬 What to actually say", html:"HPV is very common. Condoms reduce but do not eliminate transmission. HPV may have been acquired months or years previously, so warts appearing now does NOT prove recent infection, a new partner, or infidelity. Visible warts are usually benign. Treatment removes visible lesions but does not reliably eradicate HPV; recurrence is common and does not necessarily indicate reinfection. Vaccination prevents future infection with vaccine HPV types but does not treat established warts."},
         {tone:"cream", h:"🔁 The recurrence talk — give it BEFORE recurrence", html:"After clearance, recurrence is common (rates vary by treatment and population) and does not necessarily indicate reinfection from a partner. Patients who aren't told this assume their partner is re-infecting them, with real relationship damage. Screen mood (PHQ-9) where distress is apparent; GUM psychosexual counselling where relationships or sexual function are affected."}
       ]}
     ]},

    {id:"monitor", nav:"Follow-up", title:"Follow-up and safety-netting", sub:"One review during treatment, one conversation at clearance, and a short list of return-immediately triggers.",
     blocks:[
       {b:"table", head:["When","What","Action"], rows:[
         ["<b>4–5 weeks (podophyllotoxin) · about 8 weeks (imiquimod)</b>","<b>Clearing? Local reaction manageable? Technique correct?</b>","Less than ~50% improvement, poor tolerance or diagnostic uncertainty → switch to an alternative modality or refer. Document the response"],
         ["<b>On clearance</b>","The recurrence conversation (above); confirm the STI screen was done and actioned, vaccination checked, partner advice given","No routine follow-up or test-of-cure after complete resolution of successfully treated uncomplicated warts with a secure diagnosis; persistent, recurrent or atypical lesions need reassessment. Recurrence → re-treat (same or alternative)"],
         ["<b>Multiple / excessive recurrences</b>","<b>Rethink, don't just re-treat</b>","Reassess the diagnosis; HIV test if not done; immunosuppression screen; specialist biopsy of atypical lesions; refer if persistent"],
         ["<b>After a full imiquimod course or four cryotherapy sessions</b>","<b>Persistent disease</b>","Reassess the diagnosis and refer for specialist assessment"],
         ["<b>Within 2 weeks</b>","<b>Severe imiquimod reaction (severe ulceration, systemic symptoms)</b>","Stop, review, consider dose reduction. New wart sites during treatment → extend the treated area or refer"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔙 Return immediately", html:"Advise the patient to return if there is: rapid enlargement · bleeding, ulceration or severe pain · a hard or fixed lesion · anal bleeding or a change in bowel habit · urinary obstruction, haematuria or urethral discharge · a severe topical-treatment reaction · new lesions despite appropriate treatment. Clinician actions: rapidly enlarging mass → suspected cancer pathway referral; anal mass or ulceration → anal suspected cancer pathway referral without waiting for FIT; warts in a child → prompt safeguarding discussion via the local pathway."},
         {tone:"blue", h:"🩺 Routine", html:"Cervical screening registration confirmed · PHQ-9 follow-up where distress was apparent · smoking-cessation progress."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — who, when, how urgently", sub:"Offer sexual-health assessment to every new presentation; refer by clear criteria. The suspected cancer routes are for the mimics.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Safeguarding — prompt discussion", html:"Any child with anogenital warts → safeguarding assessment: discuss promptly with the designated safeguarding professional/paediatric safeguarding team and follow local child-protection procedures; urgency and route are locally defined. Do not examine or treat outside your competence.", src:"NICE CG89 child maltreatment"},
         {tone:"purple", h:"Suspected cancer pathway referral · NICE NG12", html:"<b>Unexplained anal mass or anal ulceration → anal suspected cancer pathway referral</b> (incl. suspected Buschke–Löwenstein; no FIT needed first) · <b>unexplained vulval lump, ulceration or bleeding → vulval suspected cancer pathway referral</b> (suspected VIN/SCC) · penile mass or ulcerated lesion with STI excluded, or persisting after STI treatment → penile suspected cancer pathway referral (suspected PIN, atypical bowenoid papulosis) · atypical wart-like lesion — pigmented, indurated, ulcerated — failing standard treatment → suspected cancer pathway referral by site (anal, vulval or penile) with mandatory biopsy.", src:"NICE NG12 (updated April 2026)"},
         {tone:"amber", h:"GUM / sexual health — by criteria", html:"Offer sexual-health assessment to all new presentations. Referral is particularly appropriate for: internal vaginal, cervical, intra-anal or urethral lesions; uncertain or atypical lesions; treatment-resistant or extensive disease; pregnancy with extensive disease; HIV or significant immunosuppression; patients needing STI testing, partner advice or psychosexual support; vaccination of eligible GBMSM. <b>Confidently diagnosed, uncomplicated external warts may be managed in primary care</b> if the clinician is competent, screening and follow-up are arranged, and referral criteria are clear (local pathway)."},
         {tone:"blue", h:"Dermatology / GUM (routine)", html:"Extensive warts needing specialist treatment (cryotherapy, TCA, laser, electrosurgery, excision) · inadequate response at review (less than ~50% at 4–5 weeks) or persistent after a full imiquimod course or four cryotherapy sessions · immunocompromised patients · pregnancy or breastfeeding where treatment is needed · extensive warts near delivery."},
         {tone:"blue", h:"Gynaecology / colposcopy / obstetrics", html:"Warts + abnormal cervical screening result · histologically confirmed VIN2/3 · vaginal warts needing specialist treatment · discuss with obstetrics where extensive lesions may rarely obstruct the birth canal (caesarean is not routinely recommended solely to prevent neonatal HPV transmission)."},
         {tone:"blue", h:"Urology / ENT", html:"Intraurethral warts (urethroscopy ± laser) · suspected Buschke–Löwenstein (with colorectal) · recurrent respiratory papillomatosis → ENT."},
         {tone:"green", h:"GP manages", html:"Simple external warts with confident diagnosis: podophyllotoxin or imiquimod with correct-technique counselling, the 4–5-week review (about 8 weeks for imiquimod), STI screening arranged, vaccination check, smoking cessation, the recurrence and psychosexual conversations."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only — the Casebook keeps the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 26-year-old man attends embarrassed, having found 'lumps' on his penile shaft two weeks ago. He has a new partner of three months and is convinced she has been unfaithful. He smokes 15 a day. On examination: four soft, flesh-coloured pedunculated papules on the shaft; the meatus is clear; there is one flat, slightly pigmented papule near the corona."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Examines <b>all sites including the meatus and perianal skin</b>; clocks the <b>pigmented flat papule</b> as a possible bowenoid papulosis and arranges <b>specialist biopsy rather than treating it topically</b>; offers the <b>full STI screen incl. HIV and syphilis serology</b> and explains why; prescribes <b>podophyllotoxin with cycle instructions</b> for the typical warts; defuses the infidelity inference with the <b>latency explanation</b>; offers <b>smoking cessation</b> (associated with poorer response) and <b>checks vaccination eligibility</b>; explains that routine partner notification is not needed for warts alone; safety-nets <b>less than ~50% response at 4–5 weeks → switch or refer</b> and books the 4–5-week review."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>BASHH \u2014 National guideline for the management of anogenital warts in adults, 2024 (based on the 2023 evidence review)<br><a href="https://www.bashh.org/guidelines" rel="noopener">bashh.org/guidelines</a><span class="rd"> \u2014 written for level 3 sexual-health services, adaptable to primary care via local pathways; treatment selection, podophyllotoxin formulation, 4\u20135-week review and switching, maximum four cryotherapy sessions, internal sites, pregnancy and breastfeeding, no routine partner notification, vaccination per national guidance</span></li>'+
         '<li><b>NHS Specialist Pharmacy Service \u2014 Podophyllotoxin (topical) for external anogenital warts (national PGD)</b><span class="rd"> \u2014 three days on, four days off; change treatment if less than 50% response at 4\u20135 weeks</span></li>'+
         '<li><b>NICE CG89 \u2014 Child maltreatment: when to suspect maltreatment in under 18s</b><br><a href="https://www.nice.org.uk/guidance/cg89" rel="noopener">nice.org.uk/guidance/cg89</a><span class="rd"> \u2014 consider sexual abuse in children with anogenital warts, particularly under 13, unless clear evidence of vertical or non-sexual transmission</span></li>'+
         '<li>NICE NG12 \u2014 Suspected cancer: recognition and referral (updated April 2026)<br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> \u2014 the anal, vulval and penile suspected cancer pathway criteria applied to the wart mimics; no FIT before referral for an unexplained anal mass or ulceration</span></li>'+
         '<li><b>UKHSA \u2014 The Green Book, Chapter 18a: Human papillomavirus (HPV) \u00b7 Gardasil 9</b><span class="rd"> \u2014 one dose under 25; two doses 6\u201324 months apart for eligible people 25 and over; three doses if HIV-positive or immunocompromised; GBMSM up to and including 45 via specialist sexual-health or HIV services; the 9 covered types</span></li>'+
         '<li><b>Cervical screening: programme overview (gov.uk)</b><span class="rd"> \u2014 people aged 25\u201364 invited every 5 years, HPV-positive samples triaged by cytology; anogenital warts do not alter intervals</span></li>'+
         '<li><b>Palefsky JM et al. \u2014 ANCHOR trial, NEJM 2022 (reported 2021)</b><span class="rd"> \u2014 treating anal HSIL in people with HIV reduced progression to anal cancer; supports specialist anal-neoplasia pathways for people living with HIV, not routine surveillance of everyone with warts</span></li>'+
         '<li><b>BNF and SPCs</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> \u2014 verify all doses, cycle lengths and licences before prescribing</span></li>'+
         '<li><b>Greater Manchester Medicines Management Group \u2014 Greater Manchester formulary</b><br><a href="https://www.greatermanchesterformulary.nhs.uk" rel="noopener">greatermanchesterformulary.nhs.uk</a><span class="rd"> \u2014 local formulary choices for anogenital wart treatments</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Primary-care management of uncomplicated external anogenital warts in adults, adapted from the BASHH 2024 national guideline with local sexual-health pathways \u2014 SPS podophyllotoxin PGD, UKHSA Green Book ch.18a, NHS Cervical Screening Programme, NICE CG89, ANCHOR, NICE NG12 (updated April 2026) for the mimic pathways. Assessment and management are merged on this page; the former algorithm is retired. A child with anogenital warts needs a safeguarding assessment via the local pathway. Verify every regimen against the current BNF and BASHH guidance."
