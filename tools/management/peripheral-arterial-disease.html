  foot:"Peripheral arterial disease in adults — NICE CG147, NG19 (diabetic foot), NG238 and NICE. The first call is always stable claudication versus limb-threatening ischaemia: rest pain, tissue loss or the 6 P's leave primary care today. ABPI confirms the diagnosis but is falsely high in diabetes and CKD — use toe pressures if the story fits. PAD is a cardiovascular risk equivalent, so atorvastatin 80 mg, clopidogrel 75 mg and smoking cessation are the survival treatment. Supervised exercise is first-line for claudication and comes before angioplasty. Avoid pentoxifylline, and do not withhold beta-blockers because of PAD. Verify doses against the current BNF before prescribing."
