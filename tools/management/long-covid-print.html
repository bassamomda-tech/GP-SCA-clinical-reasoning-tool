<title>Long COVID (Post-COVID-19 Syndrome) — Protocol · Reasoning GP</title>
<meta name="description" content="Long COVID in primary care on one page: the NICE NG188 definitions (ongoing symptomatic COVID-19 and post-COVID-19 syndrome), red flags needing same-day care, a holistic assessment and targeted tests (bloods, chest X-ray by 12 weeks for respiratory symptoms), referral to post-COVID services, self-management with pacing and post-exertional symptom exacerbation, return to work, and children and young people." />

<script>
MG.render({
  icon:"🫁",
  title:"Long COVID (post-COVID-19 syndrome)",
  eyebrow:"Protocol · assess and manage in one place",
  stemTitle:"Long COVID: exclude the emergencies and other diagnoses, then support self-management with pacing and refer to a post-COVID service",
  stemSub:"One page for symptoms that continue for 4 weeks or more after acute COVID-19, following NICE NG188 (2020, last updated January 2024). Look first for the features that need same-day care: hypoxia, cardiac chest pain, severe lung disease, multisystem inflammatory syndrome in children, and suicidal thoughts. Take a holistic history, do targeted tests to find other causes, and arrange a chest X-ray by 12 weeks if breathlessness or cough continues. A normal test does not rule out post-COVID-19 syndrome. Support self-management with pacing, watching for post-exertional symptom exacerbation, plan a phased return to work or school, and refer to an integrated multidisciplinary post-COVID service when needed.",
  guideline:"NICE NG188 (2020, updated January 2024) · NICE NG206 ME/CFS (2021) · NICE NG222 depression (2022) · NICE NG225 self-harm (2022) · NHS England post-COVID services commissioning guidance · Green Book ch.14a",
  reviewed:"15 October 2026",
  nextReview:"15 April 2027",
  meta:[
    {t:"NICE NG188 · long-term effects of COVID-19"},
    {t:"Ongoing symptomatic 4–12 weeks · post-COVID-19 syndrome beyond 12 weeks"},
    {t:"NICE NG206 · post-exertional symptom exacerbation"},
    {t:"No NG12 cancer criterion applies; consider other diagnoses", tone:"tw"},
    {t:"v1.0 · reviewed Oct 2026", tone:"ok"}
  ],
  lead:"<div class='mg-layers'><a href='#redflags'><b>Red flags</b><small>hypoxia, chest pain, MIS-C</small></a><a href='#assess'><b>Assess</b><small>history, tests, X-ray by 12 weeks</small></a><a href='#manage'><b>Manage</b><small>pacing, symptoms, mood</small></a><a href='#refer'><b>Refer</b><small>post-COVID services</small></a></div>",
  quickSub:"Six cards for the consultation. Each one traces to a named source under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"Same-day care first", html:"Refer urgently (same day, or 999 if critically unwell) for <b>severe hypoxaemia or oxygen desaturation on exertion</b>, signs of <b>severe lung disease</b>, <b>cardiac chest pain</b>, or <b>multisystem inflammatory syndrome in children</b> (persistent fever with rash, abdominal pain, conjunctivitis or shock). Also act the same day on new focal neurological signs, suspected pulmonary embolism, and suicidal thoughts with a plan or intent."},
    {tone:"amber", h:"Name the stage, but keep looking for other causes", html:"<b>Ongoing symptomatic COVID-19</b>: symptoms from 4 to 12 weeks. <b>Post-COVID-19 syndrome</b>: symptoms that develop during or after COVID-19, continue for more than 12 weeks and are <b>not explained by an alternative diagnosis</b>. 'Long COVID' covers both. A positive test is not needed to make the diagnosis. Symptoms often fluctuate and relapse, and can affect any body system."},
    {tone:"blue", h:"Targeted tests, and a chest X-ray by 12 weeks", html:"Offer tests guided by symptoms: <b>FBC, kidney and liver function, CRP, ferritin, BNP and thyroid function</b> are typical (with HbA1c, vitamin B12, folate, vitamin D or creatine kinase where relevant). Use a <b>1-minute sit-to-stand test</b> with saturation monitoring for breathlessness, and <b>lying and standing blood pressure and heart rate</b> for postural symptoms. Offer a <b>chest X-ray by 12 weeks</b> after acute COVID-19 if respiratory symptoms continue. Normal results do not rule out post-COVID-19 syndrome."},
    {tone:"cream", h:"Self-management with pacing", html:"Give advice on managing symptoms, setting realistic goals, and <b>pacing</b>: balancing activity and rest so as not to trigger <b>post-exertional symptom exacerbation</b> (a worsening of symptoms 12 to 48 hours after activity). Do not advise fixed, incremental increases in exercise for people with this pattern. Treat specific symptoms (breathlessness, cough, pain, sleep, mood) under the relevant NICE guidance; there is no specific drug treatment for long COVID."},
    {tone:"blue", h:"Refer to a post-COVID service when needed", html:"From <b>4 weeks</b> after acute COVID-19, refer people who need it to an <b>integrated multidisciplinary assessment and rehabilitation service</b> (NHS post-COVID or long COVID service), or to specialist services for specific complications. Children and young people go to paediatric services or the regional paediatric post-COVID hub. Base referral on need and impact, not on test results."},
    {tone:"green", h:"Work, school and mood", html:"Discuss a <b>phased return</b> to work or education, a fit note with adjustments, occupational health, and the Equality Act where symptoms are long-term. Screen for <b>anxiety, depression and post-traumatic stress</b>, and treat them under the relevant NICE guidance. Agree a follow-up plan and who to contact if things change."}
  ],
  pathwaySub:"Five moves. Step one catches the patient who needs more than reassurance.",
  pathway:[
    {title:"Exclude the emergencies", html:"Saturation at rest and after exertion, chest pain, signs of pulmonary embolism, severe lung disease, cardiac or neurological symptoms, mental health crisis, and in children features of multisystem inflammatory syndrome.", alert:true},
    {title:"Take a holistic history", html:"Timeline of the acute illness and test result if any, symptom clusters, fluctuation and triggers, post-exertional symptoms, function at home and at work or school, sleep, mood, and the impact on family and finances. Use a validated tool such as a symptom score to track progress."},
    {title:"Examine and test to find other causes", html:"Examination guided by symptoms; targeted bloods; sit-to-stand test; lying and standing observations; chest X-ray by 12 weeks for continuing respiratory symptoms; ECG for chest pain or palpitations. Consider other diagnoses at every review."},
    {title:"Plan self-management and support", html:"Pacing, symptom management, sleep and nutrition, mental health support, a phased return to work or school, and a referral to a post-COVID service where the impact is significant."},
    {title:"Follow up and safety-net", html:"Agree when to review, what would change the plan, and who to contact. Re-assess for other causes if symptoms change or new ones appear."}
  ],
  sections:[
    {id:"redflags", nav:"Red flags", title:"Red flags: who needs urgent assessment", sub:"NICE NG188 lists the features that need urgent referral to the relevant acute service.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Hypoxia and severe lung disease", html:"Severe hypoxaemia, or oxygen desaturation on exertion (for example a fall of 3% or more during a sit-to-stand test, or saturation below 94%); signs of severe lung disease. Arrange <b>same-day</b> assessment; call <b>999</b> if critically unwell.", src:"NICE NG188 (2020, updated 2024)"},
         {tone:"red", h:"🔴 Cardiac chest pain or suspected pulmonary embolism", html:"Chest pain suggesting acute coronary syndrome: <b>999</b>. Pleuritic pain, breathlessness, tachycardia or haemoptysis suggesting PE: assess with the two-level Wells score under NICE NG158 the same day.", src:"NICE NG188 (2020, updated 2024) · NICE NG158 (2020, updated 2023)"},
         {tone:"red", h:"🔴 Children: multisystem inflammatory syndrome", html:"Persistent fever with rash, conjunctivitis, abdominal pain, diarrhoea or vomiting, or features of shock, usually 2 to 6 weeks after infection. Same-day paediatric assessment; 999 if shocked.", src:"NICE NG188 (2020, updated 2024)"},
         {tone:"red", h:"🔴 Suicidal thoughts", html:"Ask directly. Thoughts with a plan, intent or recent self-harm need a same-day mental health crisis assessment, under NICE NG225.", src:"NICE NG225 (2022)"},
         {tone:"amber", h:"🟠 New neurological signs", html:"Focal weakness, new seizures, severe headache or rapidly progressive cognitive decline need same-day or urgent assessment depending on severity. Do not attribute them to long COVID without assessment.", src:"NICE NG188 (2020, updated 2024)"},
         {tone:"amber", h:"🟠 Symptoms that point elsewhere", html:"Weight loss, night sweats, haemoptysis, lymphadenopathy or progressive symptoms need investigation in their own right, including a suspected cancer pathway referral where NICE NG12 criteria are met.", src:"NICE NG12 (updated April 2026)"}
       ]},
       {b:"why", html:"Long COVID is diagnosed after other causes have been considered. The danger is diagnostic overshadowing: once the label is used, new chest pain, breathlessness, weight loss or neurological symptoms can be put down to it without assessment."}
     ]},

    {id:"assess", nav:"Assess", title:"Assessment and investigations", sub:"A holistic, person-centred assessment, with tests guided by the symptoms.",
     blocks:[
       {b:"table", head:["Symptom group","Common features","Assessment"], rows:[
         ["<b>Respiratory</b>","Breathlessness, cough, chest tightness","Saturation at rest and on exertion (1-minute sit-to-stand test, if safe); chest X-ray by 12 weeks if symptoms continue; spirometry or referral as indicated"],
         ["<b>Cardiovascular</b>","Chest pain, palpitations, postural dizziness","ECG; lying and standing blood pressure and heart rate (consider postural tachycardia syndrome or orthostatic hypotension); BNP if heart failure possible"],
         ["<b>Generalised</b>","Fatigue, fever, pain, post-exertional symptom exacerbation","FBC, kidney and liver function, CRP, ferritin, thyroid function, HbA1c; consider vitamin B12, folate, vitamin D, creatine kinase"],
         ["<b>Neurological and cognitive</b>","'Brain fog', headache, sleep disturbance, paraesthesia, dizziness","Neurological examination; consider a cognitive screen; assess sleep"],
         ["<b>Psychological</b>","Anxiety, depression, post-traumatic stress symptoms","PHQ-9, GAD-7; ask about suicidal thoughts"],
         ["<b>Other</b>","Loss of smell or taste, tinnitus, skin rashes, gastrointestinal symptoms, menstrual change","Manage under the relevant NICE guidance and refer where needed"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"🩻 Chest X-ray", html:"Offer a chest X-ray <b>by 12 weeks</b> after acute COVID-19 to people with continuing respiratory symptoms who have not already had one. Use clinical judgement about doing one sooner.", src:"NICE NG188 (2020, updated 2024)"},
         {tone:"blue", h:"🧪 What tests are for", html:"Tests look for complications and alternative diagnoses (anaemia, thyroid disease, diabetes, heart failure, inflammation). They do not confirm long COVID, and a normal set of results does not rule out post-COVID-19 syndrome or mean the symptoms are not real.", src:"NICE NG188 (2020, updated 2024)"},
         {tone:"amber", h:"🟠 Overlap with ME/CFS", html:"Many people with long COVID have post-exertional symptom exacerbation. If symptoms meet the criteria for ME/CFS, use NICE NG206 for management, including energy management and avoiding graded exercise therapy.", src:"NICE NG206 (2021)"},
         {tone:"cream", h:"🧾 Record and code", html:"Use the appropriate SNOMED codes for ongoing symptomatic COVID-19 and post-COVID-19 syndrome, and record the functional impact. This supports referral, follow-up and service planning.", src:"NICE NG188 (2020, updated 2024)"}
       ]}
     ]},

    {id:"manage", nav:"Manage", title:"Management: self-management, symptoms and support", sub:"There is no specific drug for long COVID. Management is supported self-management, symptom treatment and rehabilitation.",
     blocks:[
       {b:"cards", items:[
         {tone:"green", h:"🔋 Pacing and post-exertional symptoms", html:"Help the person find their baseline, balance activity and rest, break tasks into smaller parts, and avoid 'boom and bust'. If symptoms worsen 12 to 48 hours after activity, the activity was too much. Any increase in activity should be gradual, led by the person's symptoms, and supported by a rehabilitation team.", src:"NICE NG188 (2020, updated 2024) · NICE NG206 (2021)"},
         {tone:"cream", h:"😮‍💨 Breathlessness and cough", html:"Breathing techniques and pulmonary rehabilitation where suitable (after excluding desaturation on exertion and cardiac causes). Treat other causes such as asthma under the relevant NICE guidance.", src:"NICE NG188 (2020, updated 2024)"},
         {tone:"cream", h:"💓 Postural symptoms", html:"For suspected postural tachycardia syndrome or orthostatic hypotension: fluids, salt where safe, gradual position changes, and compression garments; refer to cardiology or a specialist service if severe or uncertain.", src:"NICE NG188 (2020, updated 2024)"},
         {tone:"cream", h:"🧠 Cognition, sleep and pain", html:"Practical strategies for memory and concentration; sleep hygiene; treat pain and headache under the relevant NICE guidance (for example NG193 for chronic primary pain). Avoid starting opioids or gabapentinoids for chronic pain without a clear indication.", src:"NICE NG193 (2021)"},
         {tone:"blue", h:"🙂 Mental health", html:"Screen for anxiety, depression and post-traumatic stress and treat under NICE guidance (NG222, CG113, NG116), including talking therapies. Refer urgently for suicidal thoughts with intent.", src:"NICE NG222 (2022) · NICE NG225 (2022)"},
         {tone:"amber", h:"💊 Medicines", html:"Do not prescribe medicines or supplements as treatments for long COVID outside a clinical trial. Treat specific conditions you find (anaemia, thyroid disease, asthma, depression) in the usual way, and review any medicine that could be adding to fatigue or dizziness.", src:"NICE NG188 (2020, updated 2024)"}
       ]},
       {b:"say", html:"Long COVID is real, and many people improve over time, although it can come and go. The aim is to find the level of activity your body can manage without making you worse the next day or two, and to build up slowly from there. If you push through and crash, that is a sign to pull back, not to try harder. We will keep checking for other causes as we go."}
     ]},

    {id:"work", nav:"Work and school", title:"Work, education and daily life", sub:"Returning too fast is a common cause of relapse.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"💼 Return to work", html:"Discuss a <b>phased return</b> with adjusted hours or duties, rest breaks and home working where possible. Use the fit note's 'may be fit for work' option with specific adjustments. Suggest occupational health input. Long-term symptoms that have a substantial effect on daily activities may count as a disability under the Equality Act 2010, giving a right to reasonable adjustments.", src:"NICE NG188 (2020, updated 2024)"},
         {tone:"green", h:"🎒 School and college", html:"Agree a gradual return with the school, with rest breaks, a reduced timetable and support for missed work. Involve the school nurse or special educational needs coordinator if needed.", src:"NICE NG188 (2020, updated 2024)"},
         {tone:"cream", h:"🚗 Driving", html:"Advise the person not to drive if fatigue, dizziness or impaired concentration make it unsafe, and to check DVLA guidance if a notifiable condition develops.", src:"DVLA assessing fitness to drive"},
         {tone:"cream", h:"💷 Practical support", html:"Signpost to benefits advice, carers' support and peer support groups. The NHS 'Your COVID Recovery' resources support self-management.", src:"NICE NG188 (2020, updated 2024)"}
       ]}
     ]},

    {id:"special", nav:"Special groups", title:"Children, older people and other groups", sub:"Where the approach changes.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"🧒 Children and young people", html:"Use the same principles, with tests and referral guided by symptoms. Refer to paediatric services or the regional paediatric post-COVID hub where the impact is significant. Watch for multisystem inflammatory syndrome after infection. Agree school adjustments and involve the family.", src:"NICE NG188 (2020, updated 2024)"},
         {tone:"cream", h:"👵 Older and frail people", html:"Look for atypical features (falls, delirium, loss of appetite, reduced function) and for other causes. Involve community rehabilitation and social care where needed.", src:"NICE NG188 (2020, updated 2024)"},
         {tone:"blue", h:"⚖️ Health inequalities", html:"Some groups face barriers to access (language, disability, digital exclusion, occupation). Offer interpreters, face-to-face assessment where needed, and make reasonable adjustments.", src:"NICE NG188 (2020, updated 2024)"},
         {tone:"green", h:"💉 Vaccination", html:"People with long COVID can be vaccinated against COVID-19 when they are eligible under the Green Book chapter 14a.", src:"UKHSA Green Book ch.14a"}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral and follow-up", sub:"Referral is based on the effect of symptoms on the person's life, not on test results.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999 or same day", html:"Hypoxia or desaturation on exertion, severe lung disease, cardiac chest pain, suspected pulmonary embolism, multisystem inflammatory syndrome in a child, or suicidal thoughts with intent.", src:"NICE NG188 (2020, updated 2024) · NICE NG225 (2022)"},
         {tone:"amber", h:"Post-COVID service (from 4 weeks)", html:"An integrated multidisciplinary assessment and rehabilitation service for people whose symptoms significantly affect daily life, or where the diagnosis is uncertain. Follow the local referral criteria.", src:"NICE NG188 (2020, updated 2024)"},
         {tone:"amber", h:"Specialist services", html:"Respiratory, cardiology, neurology, mental health, ENT (smell disorders) or other services for specific complications or alternative diagnoses.", src:"NICE NG188 (2020, updated 2024)"},
         {tone:"green", h:"Stays in primary care", html:"Assessment, supported self-management, symptom treatment, fit notes, and regular review, with the post-COVID service involved as needed.", src:"NICE NG188 (2020, updated 2024)"}
       ]},
       {b:"table", head:["When","What"], rows:[
         ["Each review","Symptoms and function, post-exertional symptoms, mood, new or changing symptoms (consider other causes), work or school"],
         ["By 12 weeks","Chest X-ray if continuing respiratory symptoms"],
         ["Agreed interval","Follow-up as agreed with the person, and sooner if symptoms worsen or new ones appear"]
       ]},
       {b:"say", html:"Call 999 if you have chest pain that feels heavy or crushing, or you are struggling to breathe. Contact us the same day if you become more breathless, your oxygen reading drops below 94%, you cough up blood, you develop a new weakness or numbness, or you have thoughts of harming yourself. Book a review if your symptoms change or new ones appear."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card. The Casebook holds the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 41-year-old teacher had COVID-19 four months ago. She is exhausted, short of breath on stairs and has 'brain fog'. She tried to go back full time last week and spent two days in bed afterwards. She wants to know whether she is 'just unfit'.", src:"NICE NG188 (2020, updated 2024)"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Checks <b>red flags</b> (saturation on exertion, chest pain, PE features). Recognises <b>post-COVID-19 syndrome</b> and <b>post-exertional symptom exacerbation</b>. Arranges <b>targeted bloods</b> and a <b>chest X-ray</b>, explaining that normal results do not rule it out. Explains <b>pacing</b>, not pushing through. Offers a <b>phased return</b> with a fit note and adjustments, screens <b>mood</b>, and refers to the <b>post-COVID service</b>.", src:"NICE NG188 (2020, updated 2024) · NICE NG206 (2021)"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Every recommendation on this page traces to a named primary source.",
     blocks:[
       {b:"html", html:"<div class='card'><h3>Evidence panel</h3><ul class='evlist'>"+
         "<li><b>NICE NG188 — COVID-19 rapid guideline: managing the long-term effects of COVID-19 (December 2020, last updated January 2024)</b>, developed with SIGN and the RCGP<br><a href='https://www.nice.org.uk/guidance/ng188' rel='noopener'>nice.org.uk/guidance/ng188</a><span class='rd'> — definitions, red flags, assessment, tests, chest X-ray by 12 weeks, self-management, referral to multidisciplinary services, children, return to work</span></li>"+
         "<li><b>NICE NG206 — Myalgic encephalomyelitis (or encephalopathy)/chronic fatigue syndrome (2021)</b><br><a href='https://www.nice.org.uk/guidance/ng206' rel='noopener'>nice.org.uk/guidance/ng206</a><span class='rd'> — post-exertional symptom exacerbation, energy management, no graded exercise therapy</span></li>"+
         "<li><b>NICE NG158 — Venous thromboembolic diseases (2020, updated 2023)</b> and <b>NICE NG12 — Suspected cancer (updated April 2026)</b><br><a href='https://www.nice.org.uk/guidance/ng158' rel='noopener'>nice.org.uk/guidance/ng158</a> · <a href='https://www.nice.org.uk/guidance/ng12' rel='noopener'>nice.org.uk/guidance/ng12</a><span class='rd'> — alternative diagnoses</span></li>"+
         "<li><b>NICE NG222 — Depression in adults (2022)</b>, <b>NICE NG225 — Self-harm (2022)</b>, <b>NICE NG193 — Chronic pain (2021)</b><br><a href='https://www.nice.org.uk/guidance/ng222' rel='noopener'>nice.org.uk/guidance/ng222</a> · <a href='https://www.nice.org.uk/guidance/ng225' rel='noopener'>ng225</a> · <a href='https://www.nice.org.uk/guidance/ng193' rel='noopener'>ng193</a><span class='rd'> — mood, suicide risk, pain</span></li>"+
         "<li><b>NHS England — National commissioning guidance for post-COVID services</b><br><a href='https://www.england.nhs.uk/coronavirus/post-covid-syndrome-long-covid/' rel='noopener'>england.nhs.uk — long COVID</a><span class='rd'> — adult and paediatric post-COVID services</span></li>"+
         "<li><b>UKHSA — Green Book chapter 14a (COVID-19)</b><br><a href='https://www.gov.uk/government/publications/covid-19-the-green-book-chapter-14a' rel='noopener'>gov.uk — chapter 14a</a><span class='rd'> — vaccine eligibility</span></li>"+
         "</ul></div>"}
     ]}
  ],
  foot:"Long COVID in primary care — NICE NG188 (2020, last updated January 2024), with NICE NG206, NG158, NG222, NG225 and NG193, and NHS England post-COVID service guidance. Service names and referral criteria vary by area: follow your local post-COVID pathway. Not a substitute for clinical judgement."
});
