MG.render({
  icon:"🦋",
  title:"Hyperthyroidism / thyrotoxicosis",
  eyebrow:"Protocol · assess and manage in one place",
  stemTitle:"Overproduction or leak? That one question decides the treatment",
  stemSub:"One page for the whole condition. Confirm biochemically, find the CAUSE with TRAb (Graves’ versus toxic nodule versus thyroiditis — it changes everything), calm the symptoms with a beta-blocker on day one, start carbimazole titration or block-and-replace, counsel the agranulocytosis red flag that saves lives, plan definitive radioiodine or surgery, handle the pregnancy and thyroid-eye-disease curveballs, and recognise thyroid storm and subclinical disease. NICE NG145 (2019, updated 2023) · MHRA DSU Feb 2019 · BNF · ETA 2018 (international).",
  guideline:"NICE NG145 (2019, updated Oct 2023) · MHRA Drug Safety Update (Feb 2019) · BNF · NICE NG12 (updated April 2026)",

  nextReview:"8 March 2027",
  meta:[
    {t:"NICE NG145 (2019, updated 2023)"},
    {t:"MHRA DSU Feb 2019 · carbimazole pregnancy and pancreatitis"},

  ],
  lead:"<div class='mg-layers'><a href='#confirm'><b>Confirm</b><small>↓TSH + ↑FT4/FT3</small></a><a href='#cause'><b>Find the cause</b><small>TRAb first</small></a><a href='#ladder'><b>Treat</b><small>β-block, then carbimazole</small></a><a href='#refer'><b>Refer</b><small>Specialist, at the right speed</small></a></div>",
  quickSub:"If you read nothing else on this page, read these six cards. Every figure traces to a primary source listed under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ The agranulocytosis rule — the most important sentence in this consultation", html:"Anyone on carbimazole or propylthiouracil (PTU) who develops a sore throat, mouth ulcers, fever or any other sign of infection must <b>stop the tablet and have a full blood count the same day</b>. The BNF asks prescribers to warn patients to report these symptoms, to check the white cell count if there is any clinical sign of infection, and to stop carbimazole promptly if there is clinical or laboratory evidence of neutropenia. The ETA (2018, international) advises giving the warning <b>in writing</b> and stopping the drug while the blood count is pending. Neutropenic → stop permanently, no re-challenge, and manage as neutropenic sepsis if unwell. Agranulocytosis can occur at any stage of treatment, so repeat the warning at every review.", src:"BNF carbimazole · ETA 2018 (international)"},
    {tone:"red", h:"Thyroid storm — never wait for the TFTs", html:"A known or suspected thyrotoxic patient with high fever, marked tachycardia or AF, and agitation, delirium or reduced consciousness → 999. Vomiting, diarrhoea, jaundice and heart failure add to the picture. Diagnosis is clinical, supported by the <b>Burch–Wartofsky score</b> (≥45 highly suggestive) or the Japanese criteria; treatment is in HDU/ICU with a beta-blocker, high-dose antithyroid drug, corticosteroid and iodide. Mortality in a Japanese nationwide survey was over 10%. Common triggers: infection, surgery, radioiodine, stopping antithyroid drugs.", src:"ETA/BTA/Society for Endocrinology thyroid storm consensus (Eur Thyroid J 2026) · Akamizu et al., Thyroid 2012"},
    {tone:"amber", h:"Overproduction or leak? Check TRAb first", html:"<b>Graves’ and toxic nodular disease OVERproduce hormone</b> — they need an antithyroid drug and a plan for definitive treatment. <b>Thyroiditis LEAKS stored hormone</b> — it settles on its own, antithyroid drugs do nothing, and supportive treatment (a beta-blocker) is all that is needed; expect a hypothyroid phase afterwards. NICE NG145 rec 1.6.1: measure TSH-receptor antibodies to confirm Graves’, and consider a technetium scan if TRAb is negative.", src:"NICE NG145 rec 1.6.1"},
    {tone:"blue", h:"Monitor on FT4 and FT3 — TSH lags", html:"TSH can stay suppressed for weeks to months after the free hormones have normalised, so titrating on TSH alone invites over-treatment and iatrogenic hypothyroidism. NICE NG145: on an antithyroid drug, <b>measure TSH, FT4 and FT3 every 6 weeks until the TSH is back in the reference range</b>, then TSH (with cascading) every 3 months until the drug is stopped. Adjust the dose on the free hormones while TSH recovers.", src:"NICE NG145 (2019, updated 2023)"},
    {tone:"green", h:"Beta-block on day one, whatever the cause", html:"NICE NG145 pairs supportive treatment (such as a beta-blocker) with an antithyroid drug while the patient awaits specialist assessment, and says thyrotoxicosis without hyperthyroidism usually needs supportive treatment only — so it is the whole treatment in thyroiditis and the bridge in Graves’ and nodular disease while the antithyroid drug takes effect. BNF adjunct dose: <b>propranolol 10–40 mg three or four times daily</b>. Aim to settle the resting heart rate, then wean once euthyroid. Avoid beta-blockers in asthma (BNF); if one is contraindicated, a rate-limiting calcium-channel blocker such as diltiazem (off-label; dose per BNF) can control the rate but not the tremor.", src:"NICE NG145 · BNF propranolol"},
    {tone:"purple", h:"An unexplained thyroid lump is a cancer pathway, whatever the TSH", html:"NICE NG12: <b>consider a suspected cancer pathway referral (for an appointment within 2 weeks) for thyroid cancer in people with an unexplained thyroid lump.</b> Thyroid function does not change this — a toxic nodule and a carcinoma can coexist, so a suppressed TSH is not reassurance.", src:"NICE NG12 (updated April 2026)"}
  ],
  pathwaySub:"The whole consultation in five moves. The red step is where patients come to harm — do not skip it.",
  pathway:[
    {title:"Screen the emergencies first", html:"Thyroid storm (fever, AF or tachycardia, heart failure, vomiting, jaundice, delirium) · new AF with haemodynamic compromise · acute severe heart failure · adrenal crisis in coexisting Addison’s · sight-threatening thyroid eye disease (reduced acuity, colour-vision loss, corneal exposure) · agranulocytosis in anyone already on an antithyroid drug · an unexplained thyroid lump. Any of these changes the destination before treatment starts.", alert:true},
    {title:"Confirm it biochemically", html:"<b>TSH with FT4 and FT3 — not TSH in isolation.</b> Overt: suppressed TSH with raised FT4 and/or FT3. Subclinical: suppressed TSH with normal FT4 and FT3. T3 toxicosis: suppressed TSH, normal FT4, raised FT3. Avoid testing in acute illness unless the illness itself may be thyroid-driven, and ask about biotin supplements, which can distort immunoassays."},
    {title:"Find the cause — TRAb first", html:"NICE NG145 rec 1.6.1: <b>measure TRAb to confirm Graves’</b>; <b>consider a technetium scan if TRAb is negative</b> (secondary care). Focal uptake = toxic nodule or multinodular goitre; low or absent uptake = <b>thyroiditis</b>. Examine the gland, the nodules and the eyes. <b>Baseline FBC and LFTs before an antithyroid drug</b>, and an ECG if there are palpitations or an irregular pulse."},
    {title:"Beta-block now, antithyroid drug next", html:"<b>Beta-blocker on day one for every cause.</b> For Graves’ or toxic nodular disease NICE NG145 supports considering an antithyroid drug plus supportive treatment while the patient waits for specialist assessment — carbimazole is first choice, subject to the MHRA contraception and pancreatitis advice (Feb 2019). Thyroiditis: supportive treatment only. <b>Give the agranulocytosis warning at the first prescription.</b>"},
    {title:"Specialist plan, then monitor", html:"<b>Arrange endocrinology assessment for confirmed hyperthyroidism</b> — urgently in pregnancy, suspected storm, active thyroid eye disease, children or severe disease. Monitor per NG145 (TSH, FT4 and FT3 every 6 weeks until TSH normalises), agree the definitive-treatment plan, and <b>repeat the agranulocytosis warning at every review</b>."}
  ],
  sections:[
    {id:"confirm", nav:"Confirm", title:"Confirming the diagnosis biochemically", sub:"Do not start an antithyroid drug on a suppressed TSH alone — confirm the free hormones and the cause first.",
     blocks:[
       {b:"table", head:["Pattern","Biochemistry","What it means"], rows:[
         ["<b>Overt hyperthyroidism</b>","<b>Suppressed TSH with raised FT4 and/or raised FT3</b>","Treat — after establishing the cause"],
         ["<b>Subclinical hyperthyroidism</b>","<b>Suppressed TSH with normal FT4 and normal FT3</b>","NICE NG145: consider specialist advice if <b>two TSH readings are below 0.1 mU/L at least 3 months apart</b> with evidence of thyroid disease or symptoms — see <a href='#special'>Special groups</a>"],
         ["<b>T3 toxicosis</b>","<b>Suppressed TSH, normal FT4, raised FT3</b>","<b>Make sure FT3 is measured</b> — this pattern is missed when only TSH and FT4 are requested"],
         ["<b>First-line panel</b>","<b>TSH, with FT4 and FT3 when TSH is below range</b>","Do not rely on TSH alone when hyperthyroidism is suspected. If the picture is borderline or the patient was acutely unwell, repeat before committing to treatment"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"🧪 Cause identification — order it at the same time", html:"<b>TSH-receptor antibodies (TRAb)</b> confirm Graves’ (NICE NG145 rec 1.6.1), and a high titre at diagnosis is associated with relapse after a drug course. <b>Thyroid peroxidase antibodies</b> are raised in both Graves’ and Hashimoto’s and do not distinguish the cause. A <b>technetium uptake scan</b> settles it when TRAb is negative — arranged through endocrinology.", src:"NICE NG145 rec 1.6.1 · ETA 2018 (international)"},
         {tone:"amber", h:"🚫 When not to test — and what distorts the result", html:"Avoid checking TFTs during an acute illness unless you suspect the illness is thyroid-driven — non-thyroidal illness can suppress TSH. <b>Biotin supplements interfere with many immunoassays — stop them and retest.</b> During treatment, testing more often than every 6 weeks adds little because TSH lags behind the free hormones.", src:"NICE NG145 (2019, updated 2023)"}
       ]},
       {b:"why", html:"<b>TSH alone misleads.</b> TSH can stay suppressed for weeks to months after FT4 and FT3 normalise, so dose decisions made on TSH alone risk over-treatment and iatrogenic hypothyroidism — use the free hormones while the axis recovers. <b>TRAb status changes management:</b> Graves’ can remit after a 12–18 month drug course (roughly half relapse afterwards — ETA 2018 meta-analysis), whereas toxic nodular disease does not remit and usually needs radioiodine or surgery."}
     ]},

    {id:"cause", nav:"Find the cause", title:"Classify the cause — aetiology drives the treatment choice", sub:"Identify the cause before choosing between antithyroid drugs, radioiodine and surgery. Clinical features and TRAb usually suffice; isotope scanning is specialist-led.",
     blocks:[
       {b:"table", head:["Cause","Features","Treatment implication"], rows:[
         ["<b>Graves’ disease</b>","<b>The commonest cause.</b> Diffuse smooth goitre, <b>TRAb positive</b>, often a <b>thyroid bruit</b>. May have <b>thyroid eye disease</b>, <b>pretibial myxoedema</b> and <b>thyroid acropachy</b>. Typically younger women","<b>Autoimmune — may remit.</b> NICE NG145: radioactive iodine is offered as first-line definitive treatment unless an antithyroid drug course (12–18 months) is likely to achieve remission or radioiodine is unsuitable"],
         ["<b>Toxic multinodular goitre</b>","Irregular multinodular goitre, older patients, <b>TRAb negative</b>, more common in iodine-deficient areas","Does not remit on antithyroid drugs — definitive treatment (radioiodine or surgery), so refer early"],
         ["<b>Toxic adenoma</b>","<b>Single hyperfunctioning nodule</b>, <b>TRAb negative</b>, confirmed on isotope scan","<b>Does not remit. Radioiodine or hemithyroidectomy</b>"],
         ["<b>Thyroiditis</b>","Postpartum, subacute (de Quervain’s — painful tender gland, raised CRP, often after a viral illness) or silent. <b>Low or absent isotope uptake.</b> A transient thyrotoxic phase lasting weeks, often followed by a hypothyroid phase","<b>No antithyroid drug</b> — the gland is releasing stored hormone, not making new hormone. NICE NG145: supportive treatment (for example a beta-blocker) usually suffices. Analgesia for de Quervain’s pain; steroids on specialist advice if severe"],
         ["<b>Drug-induced</b>","<b>Amiodarone (type 1: iodine excess; type 2: destructive thyroiditis)</b>, <b>iodinated contrast</b>, <b>lithium</b>, <b>immune checkpoint inhibitors</b>. Take a full medication history","<b>Involve endocrinology — management is complex.</b> <b>Review amiodarone with cardiology</b> rather than stopping it unilaterally"],
         ["<b>Subclinical hyperthyroidism</b>","<b>Suppressed TSH with normal FT4 and FT3</b>","NICE NG145: specialist advice if <b>two TSH readings &lt;0.1 mU/L at least 3 months apart</b> with evidence of thyroid disease or symptoms; otherwise consider TSH every 6 months if untreated"]
       ]},
       {b:"why", html:"<b>Aetiology changes the plan.</b> Carbimazole in thyroiditis is a common error — it has nothing to act on, adds side-effect risk and does not shorten the illness, so a beta-blocker and watchful waiting are correct. Toxic nodular disease will not remit, and a long drug course without a definitive plan exposes the patient to agranulocytosis risk for no lasting gain — refer early. <b>Ask “overproduction or leak?” first</b>, and let TRAb ± an uptake scan (NICE NG145 rec 1.6.1) answer it before anyone is committed to long-term antithyroid treatment."}
     ]},

    {id:"exam", nav:"Examination", title:"Targeted examination — assess severity and identify the aetiology clinically", sub:"A structured examination separates Graves’ from the other causes, quantifies the cardiac burden and picks up complications. The findings set the urgency of referral.",
     blocks:[
       {b:"table", head:["Look for","Finding","Changes what"], rows:[
         ["<b>Vital signs</b>","Heart rate (resting tachycardia is common), BP, temperature. <b>An irregular pulse → ECG for AF</b>","<b>High fever with marked tachycardia and confusion → think thyroid storm → 999</b>"],
         ["<b>Hands</b>","<b>Fine tremor of the outstretched hands</b>, warm peripheries, palmar erythema, <b>onycholysis</b>, <b>thyroid acropachy (Graves’)</b>","Acropachy points to Graves’; the tremor is a beta-blocker target"],
         ["<b>Eyes</b>","Lid retraction and lid lag can occur with any cause. Proptosis, periorbital swelling and restricted eye movements point to Graves’. Check <b>visual acuity</b>, <b>colour vision</b>, <b>diplopia</b> and <b>corneal exposure</b>","Activity is graded with the <b>Clinical Activity Score</b> (CAS ≥3/7 = active; EUGOGO 2021, international). <b>Reduced acuity, colour-vision loss or corneal exposure → same-day ophthalmology</b>"],
         ["<b>Thyroid gland</b>","<b>Inspect</b> for goitre. <b>Palpate</b> size, texture (<b>smooth = Graves’; irregular = multinodular</b>) and <b>tenderness (de Quervain’s)</b>. <b>A bruit suggests a hypervascular Graves’ gland.</b> Check for <b>cervical lymphadenopathy</b>","An unexplained lump → NICE NG12 suspected cancer pathway. Hoarseness, stridor, dysphagia or a rapidly enlarging fixed mass add urgency"],
         ["<b>Cardiovascular</b>","<b>AF</b>; heart failure signs (raised JVP, basal crackles, oedema). A flow murmur is common in the hyperdynamic state","<b>New AF → rate control; rhythm decisions wait until euthyroid.</b> Decompensation → 999"],
         ["<b>Neuromuscular / mental state</b>","<b>Brisk reflexes</b>, <b>proximal myopathy (rising from a chair without using the arms)</b>, anxiety, restlessness, poor concentration","Older people may present with apathetic thyrotoxicosis — AF and weight loss without the classic features"],
         ["<b>Skin</b>","Pretibial myxoedema — raised, pink-orange plaques over the shins — is specific to Graves’. Sweating. Diffuse hair shedding","Supports Graves’ clinically while antibodies are pending"]
       ]},
       {b:"why", html:"Apathetic thyrotoxicosis in older people presents with weight loss, AF and fatigue without the anxiety, tremor or heat intolerance — easily mistaken for malignancy or heart disease, so <b>check TFTs in new AF</b>. A thyroid bruit reflects a hypervascular, active Graves’ gland. Proximal myopathy signals significant thyrotoxicosis and recovers with treatment."}
     ]},

    {id:"severe", nav:"Emergencies", title:"Emergencies — exclude these first", sub:"Thyroid storm is rare but lethal if missed. Screen every presentation with marked tachycardia, fever or altered consciousness.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Thyroid storm (Burch–Wartofsky ≥45)", html:"Fever, marked tachycardia or AF, agitation, delirium or coma, vomiting and diarrhoea, jaundice or heart failure in a thyrotoxic patient → 999. Triggers include infection, surgery, radioiodine and stopping antithyroid drugs. Hospital treatment (HDU/ICU): beta-blockade, high-dose antithyroid drug, corticosteroid and iodide given in the right order, cooling and treating the trigger. Mortality exceeded 10% in a Japanese nationwide survey even with treatment. Never wait for TFTs.", src:"ETA/BTA/Society for Endocrinology thyroid storm consensus (Eur Thyroid J 2026) · Akamizu et al., Thyroid 2012"},
         {tone:"red", h:"🔴 New AF with haemodynamic compromise", html:"<b>Rapid AF with hypotension, breathlessness or chest pain → 999.</b> In the stable patient with new AF and a suppressed TSH: rate control with a beta-blocker and a stroke-risk assessment for anticoagulation (NICE NG196); many revert to sinus rhythm once euthyroid, so rhythm-control decisions wait until then.", src:"NICE NG196 (atrial fibrillation, 2021)"},
         {tone:"red", h:"🔴 Acute severe heart failure", html:"Pulmonary oedema, hypoxia, orthopnoea or a raised JVP precipitated by thyrotoxicosis → 999. Beta-blockade in decompensated failure needs specialist supervision.", src:"ETA/BTA/Society for Endocrinology thyroid storm consensus (Eur Thyroid J 2026)"},
         {tone:"red", h:"🔴 Agranulocytosis on carbimazole or PTU", html:"Sore throat, fever or mouth ulcers in a patient on an antithyroid drug → <b>stop the drug</b> and arrange a same-day FBC (same-day GP, acute medical unit or A&amp;E). Neutropenic → stop permanently, no re-challenge, and treat as neutropenic sepsis if unwell. It can occur at any point in treatment.", src:"BNF carbimazole · ETA 2018 (international)"},
         {tone:"red", h:"🔴 Sight-threatening thyroid eye disease", html:"Unexplained reduced acuity, loss of colour vision, new globe subluxation or corneal breakdown from exposure → same-day ophthalmology. Dysthyroid optic neuropathy and corneal ulceration can cause permanent visual loss.", src:"EUGOGO 2021, Eur J Endocrinol (international)"},
         {tone:"red", h:"🔴 Adrenal crisis (coexisting Addison’s)", html:"Postural hypotension, vomiting and collapse in a patient with autoimmune thyroid disease → 999. Autoimmune conditions cluster, and thyrotoxicosis increases cortisol clearance, which can unmask adrenal insufficiency.", src:"Society for Endocrinology adrenal crisis guidance"},
         {tone:"amber", h:"🟠 Hyperthyroidism in pregnancy", html:"Uncontrolled hyperthyroidism in pregnancy is linked to miscarriage, pre-eclampsia, preterm birth and fetal growth restriction, and maternal TRAb can cross the placenta and cause fetal or neonatal thyrotoxicosis → urgent joint endocrine–obstetric care. (NICE NG145 does not cover pregnancy.)", src:"ETA 2018 (international) · MHRA DSU Feb 2019"},
         {tone:"purple", h:"Suspected thyroid cancer <span class='tw'>2WW</span>", html:"NICE NG12: consider a suspected cancer pathway referral (for an appointment within 2 weeks) for thyroid cancer in people with an unexplained thyroid lump. Do this whatever the thyroid function tests show.", src:"NICE NG12 (updated April 2026)"}
       ]},
       {b:"warn", html:"The agranulocytosis rule is the single most important thing you say in this consultation. Give it <b>verbally and in writing</b>: any sign of infection, especially a sore throat or fever — <b>stop the tablet and get a same-day full blood count.</b>"},
       {b:"why", html:"<b>Thyroid storm remains lethal</b> — over 10% mortality in the Japanese nationwide survey (Akamizu et al., Thyroid 2012). The diagnosis is clinical, supported by the Burch–Wartofsky or Japanese criteria, and the 2026 ETA/BTA/Society for Endocrinology consensus sets out beta-blockade, high-dose antithyroid drug, corticosteroid and iodide in a high-dependency setting — so <b>never wait for TFTs</b>. Agranulocytosis is rare but can kill through sepsis; the BNF and ETA both rely on the patient recognising symptoms rather than on routine blood counts, which is why the warning must be clear, written and repeated."}
     ]},

    {id:"workup", nav:"Work-up", title:"Investigations — baseline tests before starting treatment", sub:"Take baseline bloods before carbimazole or PTU. They are the reference point for recognising drug toxicity later.",
     blocks:[
       {b:"table", head:["Test","When / what","Why it matters"], rows:[
         ["<b>Thyroid function</b>","<b>TSH, FT4 and FT3 at baseline.</b> On an antithyroid drug: <b>TSH, FT4 and FT3 every 6 weeks until TSH is in range</b>, then TSH (with cascading) every 3 months (NICE NG145)","TSH lags behind the free hormones, so early dose decisions rest on FT4 and FT3"],
         ["<b>Autoantibodies</b>","<b>TRAb — confirms Graves’</b> (NICE NG145 rec 1.6.1). TPO antibodies support autoimmune disease but do not separate the causes","A high TRAb titre is associated with relapse after a drug course (ETA 2018), which helps early counselling about definitive treatment"],
         ["<b>Haematology</b>","<b>FBC — baseline white cell and neutrophil count before starting</b>","The comparison point if a sore throat or fever develops later. Without it you cannot tell drug-induced from pre-existing neutropenia"],
         ["<b>Liver function</b>","LFTs at baseline — both drugs can affect the liver","<b>PTU carries a risk of severe, occasionally fatal, liver injury</b> (BNF/SPC), which is why it is reserved for specific situations"],
         ["<b>Cardiac</b>","<b>ECG if palpitations or an irregular pulse</b>","<b>Identifies AF and the ventricular rate</b> before rate control"],
         ["<b>Bone health</b>","Consider fracture-risk assessment if thyrotoxicosis has been prolonged or recurrent, especially after the menopause","<b>Thyrotoxicosis accelerates bone turnover</b>"],
         ["<b>Not routinely from primary care</b>","Thyroid ultrasound and isotope scanning are specialist-directed (ultrasound for a lump goes with the NG12 pathway). Thyroglobulin has no role in diagnosing hyperthyroidism","Investigate only where the result changes management"]
       ]},
       {b:"cards", items:[
         {tone:"purple", h:"NG12 thyroid cancer slot <span class='tw'>2WW</span>", html:"NICE NG12: consider a suspected cancer pathway referral (for an appointment within 2 weeks) for thyroid cancer in people with an unexplained thyroid lump. A suppressed TSH does not remove the need — a toxic nodule and a carcinoma can coexist. Restated under <a href='#refer'>Refer</a>.", src:"NICE NG12 (updated April 2026)"}
       ]},
       {b:"why", html:"<b>Document the baseline FBC.</b> If a patient on carbimazole later presents with a sore throat, a pre-treatment count is the only way to judge whether a low neutrophil count is new. <b>Baseline LFTs matter most before PTU</b>, whose product information carries a warning about severe hepatotoxicity — the reason PTU is kept for early pregnancy, carbimazole intolerance and thyroid storm."}
     ]},

    {id:"ladder", nav:"Treatment", title:"Treatment pathway — symptom control, antithyroid drugs, definitive options", sub:"Doses are BNF doses for orientation — check the current BNF, and prescribe carbimazole in line with the MHRA Drug Safety Update (February 2019).",
     blocks:[
       {b:"ladder", steps:[
         {step:"Phase 1", title:"Symptom control — the beta-blocker bridge", when:"start immediately, alongside the antithyroid drug", fromLabel:"day one, every cause",
          html:"<span class='rx'>Propranolol 10–40 mg three or four times daily</span> (BNF adjunct dose for thyrotoxicosis) for tachycardia, tremor, anxiety, palpitations and heat intolerance. It relieves symptoms within days while the antithyroid drug takes weeks, or while thyroiditis runs its course. Wean once euthyroid. Avoid beta-blockers in asthma (BNF). If a beta-blocker cannot be used, a rate-limiting calcium-channel blocker such as diltiazem (off-label; dose per BNF) controls the rate but not the tremor or anxiety."},
         {step:"Phase 1b", title:"Thyroiditis — supportive treatment only", when:"the self-limiting causes", fromLabel:"no antithyroid drug",
          html:"NICE NG145: thyrotoxicosis without hyperthyroidism usually needs only supportive treatment, such as a beta-blocker, until the thyrotoxic phase passes. <b>NSAID analgesia for the pain of de Quervain’s</b>; a corticosteroid on specialist advice if pain is severe (dose per BNF). <b>No antithyroid drug</b>, and expect a hypothyroid phase to follow."},
         {step:"Phase 2", title:"Carbimazole — titration regimen", when:"Graves’ and toxic nodular disease", fromLabel:"UK first choice",
          html:"NICE NG145: carbimazole is the antithyroid drug of choice (subject to the MHRA Feb 2019 contraception and pancreatitis advice). BNF: <span class='rx'>carbimazole 15–40 mg daily</span> until euthyroid, then reduced to a <span class='rx'>maintenance dose of 5–15 mg daily</span>, with dose changes guided by FT4 and FT3 (not TSH, which lags). Graves’: a <b>12–18 month course</b> (NICE NG145), then a trial off — roughly half relapse. Toxic nodules do not remit and need definitive treatment."},
         {step:"Alt", title:"Block-and-replace", when:"specialist choice", fromLabel:"Graves’ only",
          html:"A fixed blocking dose of carbimazole with levothyroxine added once euthyroid (BNF: <span class='rx'>carbimazole 40–60 mg daily</span> with levothyroxine), specialist-led. <b>Not for use in pregnancy</b> — MHRA (Feb 2019): in pregnancy carbimazole only after strict individual benefit–risk assessment, at the lowest effective dose and without added thyroid hormone."},
         {step:"Pregnancy", title:"Propylthiouracil around conception and in the first trimester", when:"pregnant or planning", fromLabel:"the teratogenicity swap",
          html:"MHRA (Feb 2019): carbimazole is associated with congenital malformations, especially in the first trimester and at high doses (including aplasia cutis and choanal atresia), and women of childbearing potential should use effective contraception. The ETA (2018, international) advises switching to PTU when planning pregnancy and through the first trimester, often switching back afterwards because of PTU’s hepatotoxicity. PTU dose per BNF; lowest dose keeping FT4 at or just above the upper reference limit; joint obstetric–endocrine care."},
         {step:"Phase 3", title:"Radioiodine (I-131)", when:"planned with endocrinology", fromLabel:"first-line definitive (NG145)",
          html:"NICE NG145: <b>radioactive iodine is first-line definitive treatment for Graves’</b> unless an antithyroid drug is likely to achieve remission or radioiodine is unsuitable; it is also used for toxic nodular disease. Oral, outpatient. Not in pregnancy or breastfeeding, or when radiation-protection instructions cannot be followed; caution in active thyroid eye disease. UKTIS: women should avoid pregnancy for at least 6 months afterwards, and men may be advised to wait a similar time. Hypothyroidism afterwards is common and expected — replace with levothyroxine."},
         {step:"Phase 3b", title:"Thyroidectomy", when:"total or near-total", fromLabel:"the surgical route",
          html:"For a large or compressive goitre, patient preference, failed radioiodine, active or severe thyroid eye disease, suspected malignancy, or a planned pregnancy within 6 months. The patient should be euthyroid before surgery (antithyroid drug, beta-blocker ± pre-operative iodide per the surgical team). Risks: hypoparathyroidism and recurrent laryngeal nerve injury. Lifelong levothyroxine after total thyroidectomy, titrated to keep TSH in the reference range."},
         {step:"After", title:"After definitive treatment", when:"post-radioiodine or post-thyroidectomy", fromLabel:"expect hypothyroidism",
          html:"NICE NG145 after radioiodine: consider TSH, FT4 and FT3 <b>every 6 weeks for the first 6 months</b> until TSH is in range; if TSH is in range at 6 months, TSH at 9 and 12 months; if still in range at 12 months, TSH every 6 months unless hypothyroidism develops. Once on levothyroxine, aim for TSH within the reference range (NICE NG145; starting dose guidance per the hypothyroidism recommendations) and annual TFTs once stable."}
       ]},
       {b:"table", head:["Side effect","Detail","Action"], rows:[
         ["<b>Agranulocytosis (rare, life-threatening)</b>","<b>Carbimazole and PTU — any time, most often in the first months</b>","Warn every patient: sore throat, mouth ulcers, fever or any infection → stop the drug and have a same-day FBC. Neutropenic → stop permanently, no re-challenge, neutropenic sepsis pathway if unwell (BNF; ETA 2018)"],
         ["<b>Acute pancreatitis</b>","<b>Carbimazole — MHRA DSU February 2019</b>","Stop immediately and permanently; <b>never re-challenge</b> — re-exposure may cause life-threatening recurrence"],
         ["<b>Rash / itch / arthralgia</b>","Common, usually mild","Antihistamine for mild itch and continue; severe reactions or arthralgia → specialist advice about switching or definitive treatment"],
         ["<b>Hepatotoxicity</b>","<b>PTU carries the greater risk, including severe liver injury</b> (BNF/SPC)","Jaundice, dark urine, pale stools, abdominal pain or anorexia → stop and check LFTs urgently"],
         ["<b>Over-treatment → hypothyroid</b>","Titration overshoot","Reduce the dose (titration) or adjust levothyroxine (block-and-replace); recheck per NG145 intervals"]
       ]},
       {b:"why", html:"<b>Titration or block-and-replace?</b> NICE NG145 allows either for a 12–18 month course. Titration uses less drug; block-and-replace uses a higher fixed dose with levothyroxine and is avoided in pregnancy — a specialist choice. <b>Radioiodine and the eyes:</b> in Bartalena et al. (NEJM 1998), eye disease appeared or worsened in about 15% after radioiodine (persistently in about 5%), and a short prednisone course prevented this; EUGOGO (2021, international) recommends steroid prophylaxis for patients at risk, such as smokers and those with high TRAb. <b>Relapse after a drug course</b> is common — 52.7% in the meta-analysis cited by the ETA 2018 guideline — and more likely with large goitre, high TRAb, smoking and eye disease; after relapse, definitive treatment is usually discussed."}
     ]},

    {id:"lifestyle", nav:"Lifestyle", title:"Non-pharmacological measures — lifestyle as active treatment", sub:"These measures reduce symptoms, protect the eyes and bones, and lower relapse risk while biochemical control is achieved.",
     blocks:[
       {b:"table", head:["Measure","What to advise","Why / effect"], rows:[
         ["<b>Stopping smoking</b>","Refer to the local stop smoking service — the most important modifiable factor in Graves’","Smokers had an odds ratio of 7.7 for Graves’ eye disease (Prummel and Wiersinga, JAMA 1993), smokers have more severe eye disease, and EUGOGO (2021, international) lists smoking as a risk factor for progression, including after radioiodine"],
         ["<b>Rest and activity pacing</b>","Reduce exercise intensity until controlled; gentle walking is fine","Active thyrotoxicosis causes proximal weakness, tachycardia and fatigue"],
         ["<b>Dietary iodine</b>","Avoid iodine or kelp supplements and seaweed products; a normal diet is fine","Iodine excess can precipitate or worsen hyperthyroidism, particularly in nodular goitre"],
         ["<b>Caffeine and stimulants</b>","<b>Cut down</b>","They add to the palpitations and tremor"],
         ["<b>Nutrition</b>","<b>Eat enough during the hypermetabolic phase</b>","Weight loss is driven by the metabolic rate"],
         ["<b>Bone protection</b>","Adequate dietary calcium and vitamin D; assess fracture risk if thyrotoxicosis has been prolonged or recurrent","Thyrotoxicosis increases bone turnover and fracture risk; the effect is partly reversible once euthyroid"],
         ["<b>Eye care (thyroid eye disease)</b>","Lubricating drops, sunglasses for photophobia, sleeping with the head raised to reduce morning swelling, and stopping smoking","Local measures protect the cornea while specialist care is arranged (EUGOGO 2021)"],
         ["<b>Heat avoidance</b>","<b>Light clothing, fans, cool showers</b>","Heat intolerance is prominent and simple measures help"],
         ["<b>Mental health and work</b>","Explain that anxiety, irritability and poor concentration are thyrotoxic symptoms and will ease with treatment; consider a fit note","Patients are often labelled with an anxiety disorder before the thyroid is checked"],
         ["<b>Driving</b>","Whether the DVLA must be told depends on complications rather than the diagnosis — for example <b>diplopia</b> from thyroid eye disease, or an arrhythmia causing incapacity. Check the DVLA ‘Assessing fitness to drive’ guidance for the specific complication","Advise not to drive while symptoms impair safe driving"],
         ["<b>Radioiodine precautions</b>","Follow the treating centre’s written radiation-protection instructions — how long to limit close contact with children and pregnant women, share a bed or return to work depends on the activity given","Protects the household; the instructions must be given in writing"],
         ["<b>Amiodarone</b>","<b>Review with cardiology</b>","Do not stop an essential antiarrhythmic unilaterally — amiodarone-induced thyrotoxicosis is specialist territory"]
       ]},
       {b:"why", html:"<b>Smoking and eye disease:</b> in Prummel and Wiersinga’s case–control study (JAMA 1993) smoking carried an odds ratio of 7.7 for Graves’ eye disease and smokers had more severe disease; stopping smoking is the single most useful thing the patient can do for their eyes. <b>Bone:</b> thyroid hormone excess increases bone turnover; the loss is partly reversible with treatment, so attend to calcium, vitamin D and fracture risk in prolonged disease. Explaining that the psychological symptoms are thyroid-driven reduces anxiety and improves adherence."}
     ]},

    {id:"monitor", nav:"Monitor", title:"Follow-up, monitoring and safety-netting", sub:"Structured monitoring catches agranulocytosis early, detects relapse and tunes replacement after definitive treatment. Intervals below are from NICE NG145.",
     blocks:[
       {b:"table", head:["When","What to do","Note"], rows:[
         ["<b>Every 6 weeks (on an antithyroid drug)</b>","<b>TSH, FT4 and FT3 every 6 weeks until TSH is in the reference range</b>; adjust the dose on the free hormones. Review symptoms, beta-blocker need and side effects (rash, arthralgia, jaundice)","NICE NG145"],
         ["<b>Once TSH is in range</b>","<b>TSH (with cascading) every 3 months until the drug is stopped.</b> Reinforce the agranulocytosis warning. Eye review if Graves’ with eye disease","NICE NG145"],
         ["<b>Mid-course</b>","Discuss the definitive-treatment plan with the patient and confirm the endocrinology follow-up","The definitive-treatment conversation should not wait until relapse"],
         ["<b>End of course (12–18 months)</b>","Specialist decision on a trial off the drug. Roughly half relapse after a drug course (ETA 2018)","NICE NG145 (adults) after stopping: <b>TSH (with cascading) within 8 weeks, then every 3 months for a year, then once a year</b>"],
         ["<b>FBC</b>","<b>Symptom-triggered, not routine</b>","The BNF advises a white cell count if there is any clinical evidence of infection — baseline, then on symptoms"],
         ["<b>LFTs</b>","<b>If symptoms of liver injury</b>","<b>Especially on PTU</b>"],
         ["<b>After radioiodine</b>","NICE NG145: TSH, FT4 and FT3 <b>every 6 weeks for the first 6 months</b> until TSH is in range; then TSH at 9 and 12 months; then every 6 months unless hypothyroidism develops","Hypothyroidism is expected → levothyroxine (see the <a href='hypothyroidism.html'>hypothyroidism protocol</a>)"],
         ["<b>After thyroidectomy</b>","Calcium check early after surgery (hypoparathyroidism risk). Levothyroxine after total thyroidectomy, titrated to TSH within the reference range, then annual TFTs","<b>Lifelong monitoring after radioiodine or surgery</b>"],
         ["<b>Long-term (Graves’ remission)</b>","Yearly TSH (with cascading) after the first year off treatment (NICE NG145, adults); return promptly if symptoms recur","Relapse can occur years later"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"📞 Call 999", html:"Severe palpitations with chest pain or collapse · sudden confusion or drowsiness · high fever with a racing or irregular heart · vomiting and unable to keep fluids down. “If you get a high fever with a racing heart and feel confused or very unwell, call 999 — the thyroid can occasionally go into overdrive.”", src:"ETA/BTA/Society for Endocrinology thyroid storm consensus (Eur Thyroid J 2026)"},
         {tone:"red", h:"🔴 The drug rule — same-day", html:"“Sore throat, mouth ulcers, fever or any infection while on carbimazole or PTU — <b>stop the tablets and contact us the same day for a blood test</b>.” Also <b>yellow skin or eyes, dark urine or tummy pain</b> (liver, especially PTU) and <b>severe upper abdominal pain</b> (pancreatitis on carbimazole).", src:"BNF carbimazole · MHRA DSU Feb 2019"},
         {tone:"amber", h:"👁️ Eyes — same-day", html:"“Worsening eye pain, double vision, blurred vision or colours looking washed out — <b>same-day eye assessment</b>. Stopping smoking genuinely protects your eyes.” Also <b>worsening palpitations or a new irregular pulse</b>.", src:"EUGOGO 2021, Eur J Endocrinol (international)"},
         {tone:"amber", h:"🤰 Pregnancy", html:"“Use reliable contraception on carbimazole, and <b>tell us before trying for a baby</b> — we will plan a change of tablet in advance, because carbimazole can harm the baby in early pregnancy.”", src:"MHRA DSU Feb 2019"},
         {tone:"cream", h:"🩺 Routine GP review", html:"Symptoms of under-activity emerging (tiredness, weight gain, feeling cold) · rash or joint pain on an antithyroid drug · pregnancy planning — always review the plan before conception.", src:"NICE NG145 monitoring intervals"}
       ]},
       {b:"say", html:"Two things to hold onto. First — and this is the one that matters most — if you get a sore throat, mouth ulcers or a fever, stop the tablets and ring us the same day for a blood test; it’s rare but we take it seriously. Second, the tablets work slowly, so we judge them on blood tests every few weeks, and the beta-blocker settles the racing heart and the shakes in the meantime."},
       {b:"why", html:"<b>Monitoring on TSH alone is the commonest error.</b> TSH can stay suppressed for months after the free hormones normalise, which is why NICE NG145 measures TSH, FT4 and FT3 together every 6 weeks until TSH recovers. <b>The agranulocytosis warning must be verbal and written</b> (ETA 2018) and repeated — it can occur at any time and routine blood counts do not reliably catch it. <b>Relapse surveillance:</b> NG145 continues testing for years after a drug course, because relapse is common. <b>Pregnancy planning:</b> the MHRA (Feb 2019) requires effective contraception on carbimazole, so ask about pregnancy plans at every review."}
     ]},

    {id:"special", nav:"Special groups", title:"Special situations", sub:"Only the groups where management genuinely differs — the curveballs that get tested and the ones that cause avoidable harm.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"👁️ Thyroid eye disease (Graves’ orbitopathy)", html:"<b>Grittiness, redness, swelling, proptosis, lid retraction, diplopia.</b> Red flags: reduced acuity, loss of colour vision or corneal exposure → same-day ophthalmology. <b>Smoking cessation is treatment.</b> Refer active or moderate-to-severe disease to a specialist thyroid eye clinic. Assess activity with the <b>CAS</b>. In mild active disease, EUGOGO (2021, international) supports local measures and a 6-month course of selenium in selenium-deficient areas, on specialist advice.", src:"EUGOGO 2021, Eur J Endocrinol (international)"},
         {tone:"amber", h:"🤰 Pregnancy and pre-conception", html:"Carbimazole: effective contraception, and in pregnancy only after strict benefit–risk assessment at the lowest effective dose without added thyroid hormone (MHRA, Feb 2019) — so <b>no block-and-replace in pregnancy</b>. ETA (2018, international): switch to PTU when planning and through the first trimester. Joint obstetric–endocrine care; TRAb crosses the placenta, so the fetus and neonate need monitoring when TRAb is high. NICE NG145 does not cover pregnancy.", src:"MHRA DSU Feb 2019 · ETA 2018 (international)"},
         {tone:"blue", h:"📉 Subclinical hyperthyroidism — treat or watch?", html:"Suppressed TSH with <b>normal FT4 and FT3</b>; exclude drugs, recent illness and pregnancy. NICE NG145: <b>consider specialist advice if two TSH readings are below 0.1 mU/L at least 3 months apart</b> and there is evidence of thyroid disease (goitre, positive antibodies) or symptoms. If untreated, consider TSH every 6 months, with FT4 and FT3 if TSH is out of range; consider stopping testing once TSH is stable in range on two readings 3–6 months apart. Persistent suppression in older people carries AF and fracture risk — do not file it as ‘near normal’.", src:"NICE NG145 (2019, updated 2023)"},
         {tone:"cream", h:"👴 Older people — apathetic thyrotoxicosis", html:"Weight loss, AF and fatigue without the classic anxiety, tremor or heat intolerance, easily attributed to cancer or heart disease. <b>Check TFTs in new AF</b>; many revert to sinus rhythm once euthyroid.", src:"NICE NG196 (atrial fibrillation, 2021)"},
         {tone:"blue", h:"💊 Drug-induced thyrotoxicosis", html:"Amiodarone (type 1: iodine excess; type 2: destructive thyroiditis), iodinated contrast, lithium and immune checkpoint inhibitors. Involve endocrinology, and review amiodarone with cardiology rather than stopping it unilaterally.", src:"BNF amiodarone"}
       ]}
     ]},

    {id:"loop", nav:"Not responding?", title:"Not settling? Work through this", sub:"",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"1 · Right cause?", html:"Is it actually thyroiditis (a leak) being treated with carbimazole to no effect? Recheck TRAb and consider an uptake scan (NICE NG145 rec 1.6.1).", src:"NICE NG145 rec 1.6.1"},
         {tone:"amber", h:"2 · Adherence and dose", html:"Is the carbimazole being taken? Is the dose being adjusted on FT4 and FT3 rather than TSH? Has there been enough time (6-weekly checks per NG145)?", src:"NICE NG145 (2019, updated 2023)"},
         {tone:"amber", h:"3 · Overshoot", html:"Now hypothyroid and tired from too much carbimazole → reduce the dose (or adjust levothyroxine on block-and-replace).", src:"BNF carbimazole"},
         {tone:"amber", h:"4 · Relapse (Graves’)", html:"Symptoms back after stopping → confirm biochemically → definitive treatment conversation (radioiodine or surgery).", src:"NICE NG145 (2019, updated 2023)"},
         {tone:"red", h:"5 · Missed emergency", html:"Fever or sore throat (agranulocytosis) or storm features → stop the drug and act urgently; do not push the dose.", src:"BNF carbimazole · ETA 2018 (international)"},
         {tone:"blue", h:"6 · Eye or pregnancy curveball", html:"New eye symptoms → ophthalmology; pregnant or planning → PTU switch and joint care.", src:"MHRA DSU Feb 2019 · EUGOGO 2021 (international)"}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — who, when, how urgently", sub:"Confirmed hyperthyroidism is managed with endocrinology. Know the urgency and the destination.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999", html:"Suspected thyroid storm (Burch–Wartofsky ≥45 or clinical suspicion) · acute heart failure from thyrotoxicosis · haemodynamic compromise · new thyrotoxic AF with instability.", src:"ETA/BTA/Society for Endocrinology thyroid storm consensus (Eur Thyroid J 2026)"},
         {tone:"red", h:"Same-day", html:"Suspected agranulocytosis on an antithyroid drug — stop the drug, same-day FBC, acute medical assessment if unwell or neutropenic · sight-threatening thyroid eye disease → ophthalmology · uncontrolled hyperthyroidism in pregnancy → obstetric and endocrine review.", src:"BNF carbimazole · EUGOGO 2021 (international)"},
         {tone:"purple", h:"Urgent suspected cancer <span class='tw'>2WW</span> · NICE NG12", html:"<b>Consider a suspected cancer pathway referral (for an appointment within 2 weeks) for thyroid cancer in people with an unexplained thyroid lump.</b> Thyroid function does not change this.", src:"NICE NG12 (updated April 2026)"},
         {tone:"amber", h:"Urgent endocrinology", html:"<b>Newly diagnosed Graves’ disease</b> — to confirm the cause, start or supervise the antithyroid drug and discuss definitive treatment. Also pregnancy or planning pregnancy, children and young people, active or moderate-to-severe thyroid eye disease (thyroid eye clinic), and severe symptomatic disease. (Urgency is clinical judgement; NG145 does not set referral timescales.)", src:"Clinical practice · NICE NG145 (treatment while awaiting specialist assessment) · EUGOGO 2021 (international)"},
         {tone:"cream", h:"Routine endocrinology", html:"<b>Confirmed thyrotoxicosis not needing urgent review</b> — cause work-up, drug plan and the definitive-treatment decision. Specifically: toxic multinodular goitre or toxic adenoma · relapsed Graves’ after a drug course · subclinical hyperthyroidism meeting the NG145 threshold (two TSH &lt;0.1 mU/L at least 3 months apart with thyroid disease or symptoms) · amiodarone-induced thyrotoxicosis.", src:"NICE NG145 (2019, updated 2023)"},
         {tone:"green", h:"Primary care management / shared care", html:"Thyroiditis — supportive treatment with a beta-blocker · monitoring stable patients on antithyroid drugs between specialist reviews at NG145 intervals · post-radioiodine monitoring and levothyroxine. Stable Graves’ on titration per the local shared-care pathway, with the agranulocytosis warning repeated at every review.", src:"NICE NG145 (2019, updated 2023)"}
       ]},
       {b:"warn", html:"<b>Arrange specialist assessment for confirmed hyperthyroidism</b> — and, per NICE NG145, consider starting an antithyroid drug with supportive treatment while the patient waits, following local shared care. New AF, pregnancy, thyroid eye disease, a child, or a very unwell patient = urgent referral."},
       {b:"say", html:"Your thyroid is running fast; the beta-blocker settles how you feel today and the carbimazole turns down the production over the coming weeks. The specialist will help decide between a course of tablets and a permanent fix — and remember that one rule: signs of infection mean stop the tablets and get a blood test, same day."},
       {b:"why", html:"<b>New Graves’ disease should be seen by endocrinology</b> — the choice between a drug course, radioiodine (NICE NG145’s first-line definitive treatment) and surgery needs specialist input, scanning when TRAb is negative, and a conversation about preferences, pregnancy plans and the eyes. Starting carbimazole without a plan for definitive management is a common systems failure. Radioiodine can worsen eye disease (about 15% in Bartalena et al., NEJM 1998), so eye assessment comes before radioiodine and steroid cover is considered for those at risk (EUGOGO 2021)."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only — the Casebook keeps the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 34-year-old woman with 3 months of palpitations, tremor, weight loss despite a good appetite and heat intolerance. She has been told she has anxiety. She smokes 15 a day, her eyes have felt gritty and prominent, and she mentions that she and her partner are hoping to start a family this year."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Confirms with <b>TSH, FT4 and FT3</b> rather than TSH alone; asks the <b>overproduction-or-leak</b> question and <b>checks TRAb</b>; examines the <b>goitre, bruit and eyes</b>; explains that the anxiety and irritability are <b>thyroid symptoms, not a psychiatric disorder</b>; starts a <b>beta-blocker on day one</b>; takes <b>baseline FBC and LFTs before carbimazole</b>; gives the <b>agranulocytosis warning verbally and in writing</b>; addresses <b>smoking as eye-disease treatment</b>; and — the point this case turns on — raises <b>contraception on carbimazole and the pre-conception PTU switch</b> (MHRA Feb 2019), with joint obstetric–endocrine care. <a href='../../cases/hyperthyroidism.html'>Open the full casebook chapter →</a>", src:"MHRA DSU Feb 2019 · NICE NG145"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named primary source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG145 — Thyroid disease: assessment and management</b> (November 2019, last updated October 2023)<br><a href="https://www.nice.org.uk/guidance/ng145" rel="noopener">nice.org.uk/guidance/ng145</a><span class="rd"> — rec 1.6.1 (TRAb to confirm Graves’, technetium scan if TRAb negative); supportive treatment (beta-blocker) and an antithyroid drug while awaiting specialist assessment; carbimazole as drug of choice; 12–18 month drug course; radioactive iodine as first-line definitive treatment for Graves’; monitoring intervals on and after antithyroid drugs and after radioiodine; subclinical hyperthyroidism thresholds. Does not cover pregnancy.</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral</b> (2015, updated April 2026)<br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — consider a suspected cancer pathway referral (appointment within 2 weeks) for thyroid cancer in people with an unexplained thyroid lump</span></li>'+
         '<li><b>MHRA Drug Safety Update — Carbimazole: increased risk of congenital malformations; strengthened advice on contraception</b> (February 2019)<br><a href="https://www.gov.uk/drug-safety-update/carbimazole-increased-risk-of-congenital-malformations-strengthened-advice-on-contraception" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> — effective contraception; in pregnancy only after strict benefit–risk assessment, lowest effective dose, no added thyroid hormone</span></li>'+
         '<li><b>MHRA Drug Safety Update — Carbimazole: risk of acute pancreatitis</b> (February 2019)<br><a href="https://www.gov.uk/drug-safety-update/carbimazole-risk-of-acute-pancreatitis" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> — stop immediately and permanently; do not re-expose</span></li>'+
         '<li><b>BNF</b> — carbimazole, propylthiouracil, propranolol, diltiazem, levothyroxine<br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — carbimazole 15–40 mg daily then 5–15 mg maintenance, block-and-replace 40–60 mg with levothyroxine; the infection/sore-throat warning and prompt withdrawal for neutropenia; propranolol 10–40 mg three or four times daily; PTU hepatotoxicity; beta-blockers and asthma</span></li>'+
         '<li><b>ETA, BTA, Society for Endocrinology and Welsh Endocrine and Diabetes Society — Management of thyroid emergencies: joint consensus statement on management of thyroid storm</b> (Taylor P, Okosieme O, et al., Eur Thyroid J 2026;15(4))<span class="rd"> — clinical diagnosis with Burch–Wartofsky or Japanese criteria; beta-blockade, high-dose antithyroid drug, corticosteroid and iodide in HDU/ICU</span></li>'+
         '<li><b>Akamizu T, et al. Diagnostic criteria, clinical features, and incidence of thyroid storm based on nationwide surveys.</b> Thyroid 2012;22:661–79<span class="rd"> — mortality over 10% (10.7%)</span></li>'+
         '<li><b>UKTIS — Use of iodine-131 in pregnancy</b> (UK Teratology Information Service)<br><a href="https://uktis.org/monographs/use-of-iodine-131-in-pregnancy/" rel="noopener">uktis.org</a><span class="rd"> — avoid pregnancy for at least 6 months after I-131</span></li>'+
         '<li><b>NICE NG196 — Atrial fibrillation: diagnosis and management</b> (2021)<br><a href="https://www.nice.org.uk/guidance/ng196" rel="noopener">nice.org.uk/guidance/ng196</a><span class="rd"> — rate control and stroke-risk assessment in AF</span></li>'+
         '<li><b>International — 2018 European Thyroid Association Guideline for the Management of Graves’ Hyperthyroidism</b> (Kahaly GJ, et al., Eur Thyroid J 2018;7:167–186)<span class="rd"> — used only where no UK source covers the point: written agranulocytosis instructions and stopping the drug pending the blood count; 12–18 month titration; relapse about 50% after a drug course and its predictors; PTU when planning pregnancy and in the first trimester</span></li>'+
         '<li><b>International — 2021 EUGOGO clinical practice guidelines for the medical management of Graves’ orbitopathy</b> (Bartalena L, et al., Eur J Endocrinol 2021;185:G43–G67)<span class="rd"> — CAS, smoking as a risk factor, steroid prophylaxis with radioiodine in at-risk patients, selenium in mild active disease</span></li>'+
         '<li><b>Bartalena L, et al. Relation between therapy for hyperthyroidism and the course of Graves’ ophthalmopathy.</b> NEJM 1998;338:73–78<span class="rd"> — eye disease appeared or worsened in 15% after radioiodine (persistent in 5%); prevented by prednisone</span></li>'+
         '<li><b>Prummel MF, Wiersinga WM. Smoking and risk of Graves’ disease.</b> JAMA 1993;269:479–482<span class="rd"> — odds ratio 7.7 for Graves’ ophthalmopathy in smokers</span></li>'+
         '<li><b>Society for Endocrinology — adrenal crisis emergency guidance</b><br><a href="https://www.endocrinology.org/clinical-practice/clinical-guidance/adrenal-crisis/" rel="noopener">endocrinology.org</a></li>'+
         '<li><b>DVLA — Assessing fitness to drive</b> (diplopia; arrhythmia)<br><a href="https://www.gov.uk/guidance/assessing-fitness-to-drive-a-guide-for-medical-professionals" rel="noopener">gov.uk</a></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Hyperthyroidism and thyrotoxicosis in adults — NICE NG145 (2019, updated 2023), NICE NG12 (updated April 2026), MHRA Drug Safety Update (February 2019), BNF, the 2026 ETA/BTA/Society for Endocrinology thyroid storm consensus, and the international ETA 2018 and EUGOGO 2021 guidelines where no UK source exists. Verify every dose against the current BNF and prescribe carbimazole in line with the MHRA advice. Not a substitute for clinical judgement or your local formulary."
});
