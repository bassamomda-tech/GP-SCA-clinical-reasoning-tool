  lead:"<div class='mg-layers'><a href='#confirm'><b>Confirm</b><small>↓TSH + ↑FT4/FT3</small></a><a href='#cause'><b>Find the cause</b><small>TRAb in everyone</small></a><a href='#ladder'><b>Treat</b><small>β-block, then carbimazole</small></a><a href='#refer'><b>Refer</b><small>Everyone, at the right speed</small></a></div>",
  quickSub:"If you read nothing else on this page, read these six cards. Every number traces to the source cited under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ The agranulocytosis rule — the most important sentence in this consultation", html:"Any patient on carbimazole or PTU with a sore throat, mouth ulcers, fever or any sign of infection must STOP the drug immediately and have an urgent same-day FBC. Agranulocytosis complicates carbimazole or PTU in about 0.3% of patients, usually in the first 3 months, and untreated sepsis from neutropenia can be fatal. <b>Stop the drug BEFORE the FBC result is back</b> — the risk of sepsis from neutropenia outweighs the risk of a short period without antithyroid medication. Neutropenic → stop permanently, do not re-challenge, and treat as neutropenic sepsis if unwell. <b>Counsel verbally AND in writing at initiation and at every review</b>: in a primary-care audit, failure to warn patients was the most common avoidable factor in agranulocytosis deaths on antithyroid drugs."},
    {tone:"red", h:"Thyroid storm — never wait for the TFTs", html:"Fever &gt;38.5 °C + HR &gt;140 bpm + agitation, delirium or coma → 999 immediately. Also vomiting, diarrhoea, jaundice, AF and heart failure. The <b>Burch–Wartofsky score ≥45</b> (fever, CNS dysfunction, GI symptoms, heart rate, heart failure, precipitating history) identifies patients needing immediate ICU-level care. Mortality is 10–30% even with treatment, and up to 17% if aged over 60. Often precipitated by infection, surgery, radioiodine, amiodarone, or stopping antithyroid drugs. <b>Keep the threshold low — never wait for TFTs to confirm.</b>"},
    {tone:"amber", h:"Overproduction or leak? Check TRAb in everyone", html:"<b>Graves’ and nodular disease OVERproduce hormone</b> (they need antithyroid drugs ± definitive treatment). <b>Thyroiditis LEAKS stored hormone</b> — self-limiting, antithyroid drugs are useless, treat symptoms only and expect a hypothyroid phase. TRAb first-line: positive → Graves’ (about 95% sensitivity). Negative or uncertain → technetium uptake scan: high focal uptake = toxic nodule or multinodular goitre; low or absent = thyroiditis. Carbimazole only works on glands actively making too much hormone — give it to thyroiditis and you achieve nothing but side-effect risk."},
    {tone:"blue", h:"Titrate to FT4, not TSH", html:"TSH can remain suppressed for weeks to months after FT4 and FT3 normalise (pituitary lag), so monitoring by TSH alone risks over-treatment and iatrogenic hypothyroidism. <b>Check FT4 — not TSH — at 4–6 weeks to guide the carbimazole dose</b>, and use FT4 as the primary monitoring marker for the first 6 months. <b>Do not repeat TFTs more frequently than every 4–6 weeks.</b> The commonest monitoring mistake in this condition is checking TSH alone during titration."},
    {tone:"green", h:"Beta-block on day one, whatever the cause", html:"Propranolol 40 mg BD–TDS (40–80 mg TDS/QDS in severe disease; low-dose 10–40 mg TDS) gives rapid relief of palpitations, tremor, anxiety and heat intolerance while antithyroid drugs take weeks — and being <b>non-cardioselective it also blunts peripheral T4→T3 conversion</b>. <b>Titrate to a resting HR &lt;80 bpm.</b> Symptom control is identical whether the cause is Graves’, a nodule or thyroiditis: start it day one regardless, and wean as the patient settles. <b>Bisoprolol if asthma or COPD (with caution); diltiazem 60–120 mg TDS</b> if a beta-blocker is truly contraindicated."},
    {tone:"purple", h:"An unexplained thyroid lump is a cancer pathway, whatever the TSH", html:"NICE NG12: consider a suspected cancer pathway referral (for an appointment within 2 weeks) for thyroid cancer in people with an unexplained thyroid lump — <b>independent of the thyroid function results</b>, because a hot nodule and a carcinoma can coexist. A hard, fixed or rapidly enlarging goitre with cervical lymphadenopathy, a hoarse voice or dysphagia → 2WW endocrinology or ENT, for thyroid ultrasound and FNA.", src:"NG12"}
  ],
  pathwaySub:"The whole consultation in five moves. The red step is where patients come to harm — do not skip it.",
  pathway:[
    {title:"Screen the emergencies first", html:"Thyroid storm (fever, AF or tachycardia, heart failure, vomiting, jaundice, delirium) · new AF with haemodynamic compromise · acute severe heart failure · adrenal crisis in coexisting Addison’s · sight-threatening thyroid eye disease (corneal exposure, reduced acuity, diplopia) · agranulocytosis in anyone already on an antithyroid drug · an unexplained thyroid lump. Any of these changes the destination before treatment starts.", alert:true},
    {title:"Confirm it biochemically", html:"<b>Order TSH, free T4 and free T3 together — never TSH in isolation.</b> Overt: suppressed TSH (&lt;0.1 mU/L) with raised FT4 and/or FT3. Subclinical: suppressed TSH with normal FT4 and FT3. T3 toxicosis: suppressed TSH, normal FT4, raised FT3. <b>Repeat after 2–6 weeks</b> to confirm and exclude non-thyroidal illness. Biotin supplements distort TFTs — stop them and retest; do not test during acute illness."},
    {title:"Find the cause — TRAb in all", html:"<b>Check TSH-receptor antibodies (TRAb) in all thyrotoxicosis.</b> Positive → <b>Graves’</b>. Negative or uncertain → <b>technetium uptake scan</b> (secondary care): high focal uptake = toxic nodule or multinodular goitre; low or absent = <b>thyroiditis</b>. Examine the goitre, the nodules and the eyes. <b>Baseline bloods BEFORE carbimazole: FBC and LFTs</b>, plus <b>glucose</b>, and an <b>ECG</b> if there are palpitations or AF."},
    {title:"Beta-block now, antithyroid drug next", html:"<b>Propranolol on day one for every cause.</b> Then, for Graves’ or toxic nodular disease, carbimazole 20–40 mg OD (titration) or 40 mg OD with levothyroxine add-back (block-and-replace), usually specialist-initiated or under local shared care. <b>PTU in the first trimester of pregnancy.</b> Thyroiditis: beta-blocker ± NSAID only — no antithyroid drug, because the gland is not overproducing. Counsel the agranulocytosis rule at the first prescription."},
    {title:"Refer everyone, then monitor to FT4", html:"<b>Refer all confirmed thyrotoxicosis to endocrinology (NG145)</b> — urgently in pregnancy, storm, active thyroid eye disease, children or severe disease. <b>Recheck FT4 at 4–6 weeks</b> and titrate down; <b>plan definitive radioiodine or surgery</b>; and <b>reinforce the agranulocytosis rule at every review</b>."}
  ],
  sections:[
    {id:"confirm", nav:"Confirm", title:"Confirming the diagnosis biochemically", sub:"Never start antithyroid treatment without confirming biochemical hyperthyroidism — a suppressed TSH alone is insufficient.",
     blocks:[
       {b:"table", head:["Pattern","Biochemistry","What it means"], rows:[
         ["<b>Overt hyperthyroidism</b>","<b>Suppressed TSH (&lt;0.1 mU/L) with raised FT4 and/or raised FT3</b>","Treat — after establishing the cause"],
         ["<b>Subclinical hyperthyroidism</b>","<b>Suppressed TSH with normal FT4 and normal FT3</b>","<b>Confirm it persists on repeat at 3–6 months</b> before acting — see <a href='#special'>Special groups</a>"],
         ["<b>T3 toxicosis</b>","<b>Suppressed TSH, normal FT4, but raised FT3</b>","<b>Check FT3 explicitly</b> — this pattern is missed when only TSH and FT4 are ordered"],
         ["<b>First-line panel</b>","<b>TSH + free T4 + free T3, ordered together</b>","<b>Do not check TSH in isolation if hyperthyroidism is suspected.</b> <b>Repeat after 2–6 weeks to confirm and exclude non-thyroidal illness</b>"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"teal", h:"🧪 Cause identification — order it at the same time", html:"TSH-receptor antibodies (TRAb) — positive in Graves’ disease, about 95% sensitivity; the titre also predicts relapse risk. <b>Thyroid peroxidase antibodies (TPO Ab)</b> are raised in both Graves’ and Hashimoto’s and are <b>less specific for the cause</b>. A <b>thyroid isotope scan</b> settles it where the aetiology is unclear — arranged via endocrinology, not from primary care."},
         {tone:"amber", h:"🚫 When NOT to investigate — and what distorts the result", html:"Do not check TFTs routinely in the absence of symptoms or risk factors. <b>Do not test during acute illness.</b> <b>Biotin supplements distort TFTs — stop them and retest.</b> Do not repeat TFTs more frequently than every 4–6 weeks when monitoring treatment, because TSH lags weeks behind FT4 changes."}
       ]},
       {b:"why", html:"<b>TSH alone is misleading.</b> TSH can remain suppressed for weeks after FT4 and FT3 normalise (pituitary lag), and monitoring by TSH only risks over-treatment and iatrogenic hypothyroidism — always check FT4, and FT3 if TSH is suppressed with a normal FT4, when adjusting doses. <b>TRAb antibody status changes management fundamentally:</b> Graves’ disease may undergo spontaneous remission — <b>about 50% at 18 months of antithyroid therapy</b> — whereas toxic nodular goitre or toxic adenoma will not, and typically requires definitive treatment with radioiodine or surgery."}
     ]},

    {id:"cause", nav:"Find the cause", title:"Classify the cause — aetiology drives the treatment choice", sub:"Identify the underlying cause before choosing between antithyroid drugs, radioiodine and surgery. Clinical features and antibodies usually suffice; isotope scanning is specialist-led.",
     blocks:[
       {b:"table", head:["Cause","Features","Treatment implication"], rows:[
         ["<b>Graves’ disease</b>","<b>The most common cause (70–80%).</b> Diffuse smooth goitre with <b>TRAb positive</b> and a <b>thyroid bruit</b>. May have <b>ophthalmopathy (25%)</b>, <b>pretibial myxoedema</b> and <b>thyroid acropachy</b>. Younger patients, often female","<b>Autoimmune — may remit. Antithyroid drugs first-line</b>, a 12–18 month course, then a trial off"],
         ["<b>Toxic multinodular goitre (TMNG)</b>","Irregular, multinodular goitre. Older patients. <b>TRAb negative.</b> Common in iodine-deficient areas","Will not remit on antithyroid drugs alone — remission rate &lt;1%. Definitive treatment: radioiodine or surgery, so refer early"],
         ["<b>Toxic adenoma (Plummer’s)</b>","<b>Solitary hyperfunctioning nodule</b>, palpable on one side. <b>TRAb negative.</b> Confirmed on isotope scan","<b>Will not remit. Radioiodine or hemithyroidectomy</b>"],
         ["<b>Thyroiditis</b>","Post-partum, subacute de Quervain’s (painful goitre with a raised CRP, post-viral), or silent/painless. <b>Low or absent isotope uptake.</b> Self-limiting: a transient hyperthyroid phase of 2–8 weeks, often followed by hypothyroidism","<b>Do NOT start antithyroid drugs</b> — the gland is releasing pre-formed hormone, not synthesising new hormone, and treatment delays resolution. <b>Beta-blockade symptomatically only</b>, ± NSAID or prednisolone for the pain of de Quervain’s"],
         ["<b>Drug-induced</b>","<b>Amiodarone (type 1: iodine excess; type 2: destructive thyroiditis)</b>, <b>lithium withdrawal</b>, <b>contrast iodine</b>, <b>immunotherapy / checkpoint inhibitors</b>. Check the medication history","<b>Involve endocrinology — management is complex.</b> <b>Review amiodarone with cardiology</b> rather than stopping it unilaterally"],
         ["<b>Subclinical hyperthyroidism</b>","<b>TSH &lt;0.1 mU/L with normal FT4 and FT3</b>","Treat if: aged &gt;65, AF risk, osteoporosis risk, or persistent at 3 months. <b>If TSH 0.1–0.4 mU/L and asymptomatic: observe with TFTs in 3–6 months</b>"]
       ]},
       {b:"why", html:"<b>Aetiology fundamentally changes the plan.</b> Starting carbimazole in thyroiditis is a common error — antithyroid drugs do not work in destructive thyroiditis and treatment delays resolution, so beta-blockers for symptom control plus watchful waiting is correct. Toxic nodular goitre has a very low remission rate with antithyroid drugs (&lt;1%), and prolonged drug treatment without a definitive plan exposes patients to unnecessary agranulocytosis risk — these patients should be referred early for a definitive discussion. <b>The single most useful early question is “overproduction or leak?”</b>, and TRAb ± an uptake scan should answer it before committing anyone to long-term antithyroid therapy."}
     ]},

    {id:"exam", nav:"Examination", title:"Targeted examination — assess severity and identify the aetiology clinically", sub:"A structured examination distinguishes Graves’ from the other causes, quantifies the cardiac burden and identifies complications. The findings guide the urgency of referral.",
     blocks:[
       {b:"table", head:["Look for","Finding","Changes what"], rows:[
         ["<b>Vital signs</b>","HR (<b>resting tachycardia &gt;100 bpm is common</b>), BP, temperature. <b>An irregular pulse → AF, so check an ECG</b>","<b>Fever &gt;38.5 °C with HR &gt;140 → thyroid storm risk → 999</b>"],
         ["<b>Hands</b>","<b>Fine tremor of the outstretched hands</b>, warm peripheries, palmar erythema, <b>onycholysis (Plummer’s nails)</b>, <b>thyroid acropachy (Graves’)</b>. Pulse rate and rhythm","Acropachy is Graves’-specific; the tremor is a beta-blocker target"],
         ["<b>Eyes</b>","Lid retraction — sclera visible above the iris — occurs with any cause. Exophthalmos or proptosis is only Graves’. Check eye movements for <b>diplopia</b>, plus <b>corneal exposure</b> and <b>visual acuity</b>","<b>Use the Clinical Activity Score (CAS) if ophthalmopathy is present.</b> <b>Corneal exposure or reduced acuity → same-day ophthalmology</b>"],
         ["<b>Thyroid gland</b>","<b>Inspect:</b> is a goitre visible? <b>Palpate</b> size, consistency (<b>smooth = Graves’; irregular = TMNG</b>) and <b>tenderness (de Quervain’s)</b>. <b>Auscultate: a thyroid bruit = Graves’</b> (increased vascularity). Check for <b>cervical lymphadenopathy</b>","A hard, fixed or rapidly enlarging goitre with lymphadenopathy, hoarseness or dysphagia → 2WW thyroid cancer pathway"],
         ["<b>Cardiovascular</b>","<b>AF on auscultation</b>; heart failure signs (raised JVP, bibasal crackles, peripheral oedema). <b>A systolic flow murmur is common in the hyperdynamic state</b>","<b>New AF → rate control, and do not cardiovert until euthyroid.</b> Decompensation → 999"],
         ["<b>Neurological / psychiatric</b>","<b>Hyperreflexia (brisk tendon reflexes)</b>, <b>proximal myopathy (stand from a chair without using the hands)</b>, anxiety, restlessness, cognitive impairment","Especially important in the elderly — apathetic thyrotoxicosis: AF and weight loss without the classic features"],
         ["<b>Skin</b>","Pretibial myxoedema — raised, pink-orange plaques over the shins — is Graves’-specific. Hyperhidrosis. Hair loss (telogen effluvium)","Confirms Graves’ clinically while antibodies are pending"]
       ]},
       {b:"why", html:"Apathetic thyrotoxicosis in the elderly presents with weight loss, AF and fatigue — without the classic anxiety, tremor or heat intolerance. Without examination this is easily attributed to malignancy or cardiac disease, so <b>always check TFTs in new AF in the elderly</b>. A thyroid bruit indicates a hypervascular Graves’ gland and confirms active autoimmune disease; its presence or absence also guides the treatment modality, because a bruit contraindicates radioiodine in some protocols owing to the risk of radiation thyroiditis in highly vascular glands. Proximal myopathy indicates significant thyrotoxicosis and needs prompt biochemical control — it is reversible with treatment."}
     ]},

    {id:"severe", nav:"Emergencies", title:"Emergencies — exclude these first", sub:"Thyroid storm is rare but fatal if missed. Screen every presentation with significant tachycardia, fever or altered consciousness.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Thyroid storm (Burch–Wartofsky ≥45)", html:"Fever &gt;38.5 °C + HR &gt;140 bpm + agitation, delirium or coma → 999 immediately. Also tachyarrhythmia or AF, vomiting and diarrhoea, jaundice and heart failure. Often triggered by infection, surgery, radioiodine, amiodarone, or stopping antithyroid drugs. Mortality is 10–30% even with treatment, and up to 17% if aged over 60. Hospital treatment is IV beta-blocker, propylthiouracil, iodine, hydrocortisone, cooling and treating the trigger. A medical emergency — keep the threshold low and never wait for TFTs to confirm."},
         {tone:"red", h:"🔴 New AF with haemodynamic compromise", html:"<b>Rapid AF with hypotension, dyspnoea and chest pain → 999 immediately.</b> In the stable patient, new AF with a suppressed TSH (especially in the elderly) → rate control, and do NOT cardiovert until euthyroid. Thyrotoxic AF is common: rate-control with the beta-blocker and anticoagulate by CHA₂DS₂-VASc — thyrotoxicosis is itself prothrombotic, and many revert to sinus rhythm once euthyroid."},
         {tone:"red", h:"🔴 Acute severe heart failure", html:"Pulmonary oedema, SpO₂ &lt;92%, orthopnoea or a raised JVP precipitated by thyrotoxicosis → 999. Avoid a beta-blocker in decompensated heart failure — use a rate-limiting calcium-channel blocker (diltiazem) if rate control is truly needed."},
         {tone:"red", h:"🔴 Agranulocytosis on carbimazole or PTU", html:"Sore throat + fever + mouth ulcers in a patient on an antithyroid drug → STOP the drug immediately and arrange a same-day FBC (same-day haematology or A&amp;E). <b>Stop before the result is back.</b> Neutropenic → stop permanently, do not re-challenge, and treat as neutropenic sepsis if unwell. <b>About 0.3% of patients, usually in the first 3 months</b> — but it can occur at any time."},
         {tone:"red", h:"🔴 Ophthalmopathy with corneal involvement", html:"Severe proptosis with corneal exposure, visual loss, eye pain, loss of colour vision or reduced acuity → same-day ophthalmology. Corneal ulceration can cause permanent visual loss within hours — refer before trying to manage it medically."},
         {tone:"red", h:"🔴 Adrenal crisis (coexisting Addison’s)", html:"Postural hypotension + vomiting + collapse in a patient with autoimmune thyroid disease → 999. Autoimmune conditions cluster, and a rising metabolic rate can unmask Addison’s."},
         {tone:"amber", h:"🟠 Hyperthyroidism in pregnancy / first trimester", html:"Uncontrolled hyperthyroidism in pregnancy risks miscarriage, pre-eclampsia and foetal growth restriction → same-day obstetric review. Also pre-term delivery and <b>neonatal thyrotoxicosis from transplacental TRAb</b>."},
         {tone:"purple", h:"Suspected thyroid malignancy <span class='tw'>2WW</span>", html:"NG12: consider a suspected cancer pathway referral (for an appointment within 2 weeks) for thyroid cancer in people with an unexplained thyroid lump — independent of the thyroid function tests. A hard, fixed, rapidly enlarging goitre with cervical lymphadenopathy, a hoarse voice or dysphagia → 2WW endocrinology or ENT, for thyroid ultrasound and FNA.", src:"NG12"}
       ]},
       {b:"warn", html:"The agranulocytosis rule is the single most important thing you say in this consultation. Give it <b>verbally AND in writing</b>: any sign of infection, especially sore throat with fever — <b>stop the tablet and get a same-day full blood count. Missing it kills.</b>"},
       {b:"why", html:"<b>Thyroid storm carries a mortality of 10–30% even with treatment.</b> The <b>Burch–Wartofsky scoring system</b> — fever, CNS dysfunction, GI symptoms, heart rate, heart failure and precipitating history — identifies patients needing immediate ICU-level care, and you should <b>never wait for TFTs to confirm</b>. Agranulocytosis complicates carbimazole or PTU in about 0.3% of patients, typically in the first 3 months, and untreated sepsis from neutropenia can be fatal — so counsel at initiation and at every review: “stop the drug and attend A&amp;E same day if you develop a sore throat or fever”. Graves’ ophthalmopathy with corneal exposure is a sight-threatening emergency."}
     ]},

    {id:"workup", nav:"Work-up", title:"Investigations — baseline tests before starting treatment", sub:"Order baseline bloods before starting carbimazole or PTU. They are essential for monitoring and for detecting drug toxicity during treatment.",
     blocks:[
       {b:"table", head:["Test","When / what","Why it matters"], rows:[
         ["<b>Thyroid function</b>","<b>TSH + FT4 + FT3 — all three at baseline.</b> <b>Repeat FT4 (not TSH) at 4–6 weeks</b> when monitoring on antithyroid drugs","TSH lags behind FT4, so early titration decisions are made on FT4"],
         ["<b>Autoantibodies</b>","<b>TRAb — confirms Graves’ and predicts relapse risk.</b> <b>TPO Ab — supports an autoimmune aetiology</b>","The TRAb titre at diagnosis predicts remission probability: a high titre correlates with a lower remission rate on antithyroid drugs alone, which allows early counselling about definitive treatment"],
         ["<b>Haematology</b>","<b>FBC — a baseline WCC before starting carbimazole</b>","Essential for comparison if the patient later develops a sore throat or fever (the agranulocytosis check). Without a baseline you cannot tell drug-induced from pre-existing neutropenia"],
         ["<b>Liver function</b>","LFTs — baseline before carbimazole or PTU (both can cause hepatotoxicity)","<b>PTU causes more serious hepatotoxicity than carbimazole</b>, and <b>PTU-induced fulminant hepatic failure has been reported</b>"],
         ["<b>Glucose</b>","At baseline with the other bloods","Part of the metabolic baseline in a hypermetabolic patient"],
         ["<b>Cardiac</b>","<b>ECG — essential if palpitations or an irregular pulse</b>","<b>Identifies AF, the rate and the QTc</b> — important before a beta-blocker or amiodarone"],
         ["<b>Bone health</b>","DEXA — if prolonged or recurrent hyperthyroidism, in post-menopausal women, or in older men","<b>Thyrotoxicosis causes accelerated bone loss → osteoporosis risk</b>"],
         ["<b>Not routinely needed</b>","Thyroid ultrasound (specialist-led), isotope scan (specialist-led), thyroglobulin (a malignancy marker, not for hyperthyroidism). <b>Do not repeat TFTs more frequently than 4–6 weekly</b>","Investigate only where the result changes management"]
       ]},
       {b:"cards", items:[
         {tone:"purple", h:"NG12 thyroid cancer slot <span class='tw'>2WW</span>", html:"Consider a suspected cancer pathway referral (for an appointment within 2 weeks) for thyroid cancer in people with an unexplained thyroid lump. This applies <b>independent of the thyroid function results</b> — a hot nodule and a carcinoma can coexist, so a suppressed TSH is not reassurance. Restated with the same threshold under <a href='#refer'>Refer</a>.", src:"NICE NG12, mandatory per house rules"}
       ]},
       {b:"why", html:"<b>The baseline FBC is critical.</b> If a patient later presents with a sore throat on carbimazole and has no baseline WCC, it is impossible to determine whether any neutropenia is drug-induced or pre-existing — <b>always document the baseline</b>. <b>LFTs before PTU are mandatory</b>: PTU-induced fulminant hepatic failure has been reported, and PTU is reserved for specific circumstances (the first trimester, carbimazole allergy, thyroid storm) precisely because of this hepatotoxicity risk."}
     ]},

    {id:"ladder", nav:"Treatment", title:"Treatment pathway — symptom control, antithyroid drugs, definitive options", sub:"Doses are named for orientation — verify every one in the BNF, and prescribe carbimazole and PTU per the MHRA agranulocytosis and pregnancy warnings.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Phase 1", title:"Symptom control — the beta-blocker bridge", when:"start immediately, alongside the antithyroid drug", fromLabel:"day one, every cause",
          html:"Propranolol 40 mg BD–TDS, up to 40–80 mg TDS/QDS in severe disease (low dose 10–40 mg TDS) for sinus tachycardia, tremor, anxiety, palpitations and heat intolerance. Non-cardioselective — it also reduces peripheral T4→T3 conversion. Titrate to a resting HR &lt;80 bpm. Rapid relief while antithyroid drugs take weeks, or while thyroiditis runs its self-limiting course. Bisoprolol if asthma or COPD (with caution). Diltiazem 60–120 mg TDS as the alternative for rate control in AF if a beta-blocker is contraindicated — but it does not help tremor or anxiety."},
         {step:"Phase 1b", title:"Thyroiditis — propranolol ONLY", when:"the self-limiting causes", fromLabel:"no antithyroid drug",
          html:"Symptom control until the thyrotoxic phase resolves, typically 4–8 weeks. <b>NSAIDs, or <span class='rx'>prednisolone 40 mg daily</span> tapered over 4–6 weeks, for the pain of de Quervain’s.</b> <b>No antithyroid drug — the gland is not overproducing</b>, and expect a hypothyroid phase to follow."},
         {step:"Phase 2", title:"Carbimazole — titration regimen", when:"Graves’ and toxic nodular disease", fromLabel:"UK first-line",
          html:"Carbimazole 20–40 mg OD (higher for severe disease), started within days of diagnosis. Reduce every 4–6 weeks guided by FT4 (NOT TSH — it stays suppressed for months), aiming for a maintenance dose of about 5–15 mg — titrate to the individual’s FT4. <b>Symptoms improve in 2–4 weeks and the biochemistry in 4–6.</b> Graves’: a 12–18 month course, then a trial off — about 50% remit. Toxic nodules rarely remit and need definitive treatment."},
         {step:"Alt", title:"Block-and-replace", when:"labile control or specialist preference", fromLabel:"Graves’ only",
          html:"Fixed higher-dose carbimazole (40 mg OD) with levothyroxine added once euthyroid — <b>fewer blood tests and the same remission rate</b>. <b>NOT for use in pregnancy.</b>"},
         {step:"Pregnancy", title:"Propylthiouracil in the first trimester", when:"pregnant or planning", fromLabel:"the teratogenicity swap",
          html:"PTU 100–200 mg TDS — preferred in the first trimester because carbimazole is teratogenic (aplasia cutis, choanal atresia, embryopathy). Switch to PTU pre-conception and through the first trimester, then many switch back to carbimazole in the second and third because of PTU hepatotoxicity risk. Use the lowest dose that keeps FT4 at the upper-normal limit; joint obstetric–endocrine care; TRAb crosses the placenta, so foetal thyroid monitoring is needed."},
         {step:"Phase 3", title:"Radioiodine (I-131)", when:"planned with endocrinology", fromLabel:"first-line definitive",
          html:"First-line definitive treatment for most adults with Graves’, TMNG or toxic adenoma — an outpatient oral capsule. 80% euthyroid or hypothyroid at 6 months. Avoid in active ophthalmopathy, pregnancy, breastfeeding, or inability to follow radiation precautions; defer conception about 6 months, both partners. Hypothyroidism is expected — a planned outcome, not a failure: start levothyroxine when the TSH rises."},
         {step:"Phase 3b", title:"Thyroidectomy", when:"total or near-total", fromLabel:"the surgical route",
          html:"For a large compressive goitre, patient preference, failed radioiodine, active Graves’ ophthalmopathy, suspected malignancy, or pregnancy planned within 6 months (&lt;6 months). Requires biochemical euthyroidism before surgery (carbimazole ± Lugol’s iodine and a beta-blocker pre-op). Risks: hypoparathyroidism and recurrent laryngeal nerve injury. Lifelong <span class='rx'>levothyroxine, about 1.6 micrograms/kg/day</span> post-op, titrated on TSH."},
         {step:"After", title:"After definitive treatment", when:"post-radioiodine or post-thyroidectomy", fromLabel:"expect hypothyroidism",
          html:"Monitor TSH 6–8 weeks post-radioiodine and 6 weeks post-thyroidectomy. Start levothyroxine 1.6 mcg/kg/day when hypothyroid. Target TSH 0.5–2.5 mU/L. Annual TFTs once stable. Choice driver: Graves’ patients wanting a shot at drug remission → 12–18 months of carbimazole first; nodular disease → definitive treatment earlier, because it will not remit."}
       ]},
       {b:"table", head:["Side effect","Detail","Action"], rows:[
         ["<b>Agranulocytosis (rare, ~0.3%, life-threatening)</b>","<b>Both carbimazole and PTU — usually the first 3 months</b>","Counsel EVERY patient: sore throat, mouth ulcers, fever or any infection → STOP the drug and get an urgent same-day FBC. Neutropenic → stop permanently, do not re-challenge, and treat as neutropenic sepsis if unwell"],
         ["<b>Rash / urticaria / arthralgia</b>","Common, usually mild","<b>Antihistamine; if mild continue; if severe switch carbimazole ↔ PTU</b>"],
         ["<b>Hepatotoxicity</b>","<b>PTU &gt; carbimazole — PTU can cause fulminant failure</b>","<b>LFTs if jaundice, dark urine or RUQ pain → stop</b>"],
         ["<b>Over-treatment → hypothyroid</b>","Titration overshoot","Reduce the dose (titration) or add/adjust levothyroxine (block-and-replace); monitor FT4"]
       ]},
       {b:"why", html:"<b>Block-and-replace versus titration:</b> both are equally effective at achieving euthyroidism. Titration uses a lower total carbimazole dose, which reduces agranulocytosis risk; block-and-replace may suit busy patients with fewer dose adjustments but gives higher total drug exposure — either is acceptable, and it is a discussion to have with endocrinology. Radioiodine and ophthalmopathy: radioiodine worsens Graves’ ophthalmopathy in about 25% of cases, particularly in smokers. Patients with active ophthalmopathy (CAS ≥3) should not receive radioiodine without concurrent steroid cover, so ophthalmology assessment is mandatory before choosing definitive therapy. Remission rates: 40–60% of Graves’ patients achieve remission after 12–18 months of carbimazole, higher if TRAb normalises. Relapse is more likely with a large goitre, a high TRAb titre, active smoking and younger age — and after relapse, definitive treatment is recommended rather than a second antithyroid drug course."}
     ]},

    {id:"lifestyle", nav:"Lifestyle", title:"Non-pharmacological interventions — lifestyle as active treatment", sub:"These measures reduce symptoms, reduce relapse risk and protect organ systems while awaiting biochemical control. They are active treatments, not afterthoughts.",
     blocks:[
       {b:"table", head:["Measure","What to advise","Why / effect"], rows:[
         ["<b>Smoking cessation</b>","Refer to the NHS Stop Smoking service — the most important modifiable risk in Graves’","Smoking doubles the risk of Graves’ ophthalmopathy and worsens its severity, and radioiodine is more hazardous in smokers with orbitopathy. Reduces ophthalmopathy risk significantly"],
         ["<b>Rest and activity pacing</b>","Reduce exercise intensity until biochemically controlled; gentle walking is acceptable","Active thyrotoxicosis causes proximal myopathy, tachycardia and fatigue, and vigorous exercise increases cardiac stress"],
         ["<b>Dietary iodine</b>","Avoid iodine supplementation and seaweed or kelp products. A normal iodine diet is safe. Avoid contrast dye exposure where possible","Excess iodine can worsen or precipitate hyperthyroidism — the Jod-Basedow effect"],
         ["<b>Caffeine and stimulants</b>","<b>Reduce caffeine and other stimulants</b>","They compound the palpitations and tremor that brought the patient in"],
         ["<b>Nutrition</b>","<b>Adequate calories during the hypermetabolic phase</b>","Weight loss is driven by the metabolic rate — under-eating deepens it"],
         ["<b>Bone protection</b>","Adequate calcium (1000–1200 mg/day via diet) and vitamin D (≥600 IU/day). Consider DEXA if prolonged or recurrent hyperthyroidism. Bisphosphonates if osteoporosis is confirmed","Prolonged thyrotoxicosis causes accelerated bone resorption. Reduces fracture risk. Also arrange a <b>bone-health and cardiovascular review</b> (AF and osteoporosis risk)"],
         ["<b>Eye care (Graves’ ophthalmopathy)</b>","Lubricating eye drops (hypromellose) for dry eyes or corneal exposure; UV-protective sunglasses for photophobia and proptosis; sleep with the head of the bed elevated to reduce periorbital oedema. Absolutely stop smoking","Simple measures that protect the cornea while specialist care is arranged"],
         ["<b>Heat avoidance</b>","<b>Light clothing, cool environments, fans, cool showers</b>","Heat intolerance is a prominent symptom — these simple measures improve quality of life significantly while awaiting biochemical control"],
         ["<b>Mental health and work</b>","Explain that anxiety, irritability and cognitive impairment are thyrotoxicosis symptoms, not a psychiatric disorder. May need temporary sick leave; reassure that symptoms resolve with treatment","Many patients are incorrectly labelled with anxiety disorder or depression before thyroid disease is considered"],
         ["<b>Driving and DVLA</b>","No DVLA notification is required for controlled hyperthyroidism. Advise not to drive if symptomatic tachycardia, tremor or significant visual symptoms impair safe driving","A common question, and the answer is reassuring — with that one caveat"],
         ["<b>Radioiodine precautions</b>","Avoid close contact with children under 16 (&lt;16) and pregnant women for 3 weeks; avoid public transport for 24 hours; separate crockery for 1 week; no intercourse for 1 week. Give the written ARSAC information leaflet","Radiation protection for the household, and the instructions must be given in writing"],
         ["<b>Amiodarone</b>","<b>Review amiodarone with cardiology</b>","Do not stop a potentially life-saving antiarrhythmic unilaterally — management of amiodarone-induced thyrotoxicosis is complex"]
       ]},
       {b:"why", html:"Smoking and ophthalmopathy: the association is dose-dependent and robust. Current smokers have a 7.7× greater risk of developing Graves’ ophthalmopathy compared with never-smokers, and smoking cessation is the most effective intervention to prevent orbitopathy progression — more impactful than any drug in this regard. Bone loss in thyrotoxicosis is clinically significant: thyroid hormones increase bone turnover markers and reduce BMD by 10–20% in prolonged untreated disease. The effect is partially reversible with treatment, but early calcium and vitamin D support with DEXA monitoring prevents long-term fracture risk. Explaining psychiatric symptoms as thyroid symptoms significantly reduces patient anxiety and medication non-adherence."}
     ]},

    {id:"monitor", nav:"Monitor", title:"Follow-up, monitoring and safety-netting", sub:"Structured monitoring prevents agranulocytosis deaths, detects relapse early and optimises replacement after definitive treatment.",
     blocks:[
       {b:"table", head:["When","What to do","Note"], rows:[
         ["<b>4–6 weeks (on antithyroid drugs)</b>","<b>Check FT4 (not TSH — still suppressed) to guide carbimazole titration.</b> Assess symptom response, review the beta-blocker need, and <b>check for drug side effects (rash, arthralgia, hepatotoxicity)</b>","<b>FT4 every 4–6 weeks while titrating, then 3-monthly</b>"],
         ["<b>3 months</b>","Full TFT review (FT4 plus TSH, usually recovering). Confirm the dose has been appropriately reduced. Reinforce the agranulocytosis warning. Ophthalmology update if Graves’ with orbitopathy","<b>TSH guides long-term dosing once the axis resets</b>"],
         ["<b>6 months (on antithyroid drugs)</b>","Discuss the definitive treatment plan with the patient. Recheck the TRAb titre — normalisation supports potential remission. Confirm the endocrinology follow-up pathway","The definitive-treatment conversation should not wait until relapse"],
         ["<b>12–18 months (end of the course)</b>","Trial drug withdrawal if TRAb is negative and FT4/TSH are stable. TFTs 4–6 weeks after stopping. 40–60% achieve remission. If relapse — definitive treatment","After stopping (Graves’): TFTs at 6–8 weeks, then periodically for at least 12 months (≥12 months) — about 50% relapse, often in the first year"],
         ["<b>FBC</b>","<b>No routine monitoring — SYMPTOM-triggered</b>","The agranulocytosis rule replaces routine FBCs: do a baseline, then check only if there are infection signs"],
         ["<b>LFTs</b>","<b>If hepatotoxicity symptoms</b>","<b>PTU especially</b>"],
         ["<b>Post-radioiodine</b>","TFTs at 6 and 12 weeks, then 6-monthly. Start levothyroxine when the TSH rises (&gt;4.0 mU/L or symptomatic). Annual TFTs once stable on replacement","Detect the expected hypothyroidism → levothyroxine (see the <a href='hypothyroidism.html'>hypothyroidism protocol</a>)"],
         ["<b>Post-thyroidectomy</b>","Calcium on day 1 post-op (hypoparathyroidism risk). TFTs at 6 weeks — start levothyroxine 1.6 mcg/kg/day. Annual TFTs. Check vitamin D yearly","<b>Lifelong TFTs after radioiodine or surgery</b>"],
         ["<b>Long-term (Graves’ remission)</b>","Annual TFTs for life — the relapse rate is 50% over 5 years. No routine antibody monitoring once in remission unless symptoms recur","Lifelong surveillance with clear patient education to return if symptoms recur"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"📞 Call 999", html:"Severe palpitations with chest pain or collapse · sudden onset confusion or coma · unable to tolerate fluids or unwell with vomiting (adrenal crisis risk). “High fever, racing or irregular heart, confusion, being violently unwell — 999; the thyroid can occasionally go into overdrive.”"},
         {tone:"red", h:"🔴 The drug rule — same-day", html:"“Sore throat, mouth ulcers, fever or any infection on carbimazole or PTU — <b>STOP it and ring us the SAME DAY for a blood test</b>.” Also <b>jaundice (hepatotoxicity, especially PTU)</b>."},
         {tone:"amber", h:"👁️ Eyes — same-day", html:"“Eye pain, double vision or colour looking washed out — <b>same-day eye assessment</b>. And stopping smoking genuinely protects your eyes.” Also <b>worsening palpitations or a new irregular pulse</b>."},
         {tone:"amber", h:"🤰 Pregnancy", html:"“<b>Tell us BEFORE trying for a baby</b> — we switch you to a different tablet in advance; carbimazole isn’t safe early in pregnancy.”"},
         {tone:"plain", h:"🩺 Routine GP review", html:"Symptoms of hypothyroidism emerging (fatigue, weight gain, cold intolerance) · rash or joint pain on antithyroid drugs · pregnancy planning — always review the treatment plan before conception."}
       ]},
       {b:"say", html:"Two things to hold onto. First — and this is the one that matters most — if you get a sore throat, mouth ulcers or a fever, STOP the tablet and ring us the same day for a blood test; it’s rare but we take it seriously. Second, the tablets work slowly, so we judge them on blood tests over weeks, and the beta-blocker settles the racing and the shakes in the meantime."},
       {b:"why", html:"The TSH monitoring error is the commonest monitoring mistake: checking TSH alone during antithyroid drug titration. TSH can remain suppressed for months after FT4 normalises because of pituitary lag, and relying on TSH alone leads to over-treatment and iatrogenic hypothyroidism — always check FT4 as the primary monitoring marker for the first 6 months. Agranulocytosis safety-netting must be verbal AND written at every prescription: most cases occur in the first 3 months but can occur at any time, and in a primary-care audit failure to warn patients was the most common avoidable factor in agranulocytosis deaths on antithyroid drugs. Relapse surveillance: 50% of Graves’ patients who achieve remission relapse within 5 years, most within the first 2 years, so annual TFTs should be lifelong. <b>Pregnancy planning:</b> poorly controlled hyperthyroidism in pregnancy is associated with miscarriage, pre-term delivery, foetal growth restriction and neonatal thyrotoxicosis from transplacental TRAb, so women of childbearing age should be counselled to inform their GP when planning pregnancy so treatment can be optimised in advance."}
     ]},

    {id:"special", nav:"Special groups", title:"Special situations", sub:"Only the groups where management genuinely differs — the curveballs that get tested and the ones that cause avoidable harm.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"👁️ Thyroid eye disease (Graves’ ophthalmopathy)", html:"<b>Grittiness, redness, proptosis, lid retraction, diplopia.</b> Red flag: pain, colour-vision loss or reduced acuity = sight-threatening optic neuropathy → same-day ophthalmology. <b>Strongly linked to smoking — cessation IS treatment.</b> Refer active or moderate disease to a combined clinic (steroids, teprotumumab, orbital care). <b>Selenium may help mild active eye disease (specialist advice).</b> Assess with the <b>CAS</b>."},
         {tone:"amber", h:"🤰 Pregnancy and pre-conception", html:"Switch to PTU pre-conception and through the first trimester (carbimazole is teratogenic — aplasia cutis, choanal atresia, embryopathy), then many switch back to carbimazole in the second and third trimesters because of PTU hepatotoxicity. Lowest dose to keep FT4 at the upper-normal limit. Joint obstetric–endocrine care. TRAb crosses the placenta, so foetal thyroid monitoring is needed. Block-and-replace is NOT used in pregnancy. Uncontrolled disease risks miscarriage, pre-eclampsia, pre-term delivery, foetal growth restriction and neonatal thyrotoxicosis."},
         {tone:"blue", h:"📉 Subclinical hyperthyroidism — treat or watch?", html:"Definition: suppressed TSH with NORMAL FT4 and FT3 — confirm it persists on repeat at 3–6 months (exclude drugs, non-thyroidal illness and pregnancy). TSH &lt;0.1 mU/L persistently: higher risk of AF, osteoporosis and cardiovascular mortality → refer or consider treatment, especially if aged over 65, or with AF, osteoporosis or cardiac disease. TSH 0.1–0.4 mU/L: usually monitor with 6-monthly TFTs; treat if symptomatic or high-risk. It is not benign in the older patient — the AF and fracture risk are real, so do not just file a low TSH as “normal-ish”."},
         {tone:"cream", h:"👴 The elderly — apathetic thyrotoxicosis", html:"Weight loss, AF and fatigue WITHOUT the classic anxiety, tremor or heat intolerance. Easily attributed to malignancy or cardiac disease. <b>Always check TFTs in new AF in an older patient</b>, and remember that <b>many thyrotoxic patients revert to sinus rhythm once euthyroid</b>."},
         {tone:"plain", h:"💊 Drug-induced thyrotoxicosis", html:"Amiodarone (type 1: iodine excess; type 2: destructive thyroiditis), lithium withdrawal, contrast iodine, immunotherapy or checkpoint inhibitors. Involve endocrinology — management is complex — and review amiodarone with cardiology rather than stopping it unilaterally."}
       ]}
     ]},

    {id:"loop", nav:"Not responding?", title:"Not settling? Work through this", sub:"",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"1 · Right cause?", html:"Is it actually thyroiditis (leak) being given carbimazole pointlessly? Recheck TRAb/uptake."},
         {tone:"amber", h:"2 · Adherence + dose", html:"Carbimazole taken? Titrated against FT4 (not TSH)? Enough time (4–6 weeks)?"},
         {tone:"amber", h:"3 · Over-shot", html:"Now hypothyroid/fatigued from too much carbimazole → reduce dose or block-and-replace."},
         {tone:"amber", h:"4 · Relapse (Graves)", html:"Symptoms back after stopping → confirm biochemically → definitive treatment conversation."},
         {tone:"red", h:"5 · Missed emergency", html:"Fever/sore throat (agranulocytosis) or storm features → stop drug + urgent action, don't push dose."},
         {tone:"blue", h:"6 · Eye/pregnancy curveball", html:"New eye symptoms → ophthalmology; pregnant/planning → PTU switch + joint care."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — who, when, how urgently", sub:"Most patients with confirmed hyperthyroidism should be referred to endocrinology. Know the urgency and who to refer to.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999", html:"Suspected thyroid storm (Burch–Wartofsky ≥45) · acute heart failure from thyrotoxicosis · haemodynamic compromise · new thyrotoxic AF with instability."},
         {tone:"red", h:"Same-day", html:"Suspected agranulocytosis on antithyroid drugs — stop the drug, urgent FBC, same-day haematology or A&amp;E · corneal exposure or sight-threatening thyroid eye disease → ophthalmology · hyperthyroidism in pregnancy → obstetric review."},
         {tone:"purple", h:"Urgent suspected cancer <span class='tw'>2WW</span> · NICE NG12", html:"Consider a suspected cancer pathway referral (for an appointment within 2 weeks) for thyroid cancer in people with an unexplained thyroid lump — independent of the thyroid function tests. A hard or fixed thyroid mass with cervical lymphadenopathy, a hoarse voice or dysphagia → 2WW thyroid cancer pathway (endocrinology or ENT), for thyroid ultrasound and FNA.", src:"NICE NG12 · house rule"},
         {tone:"amber", h:"Urgent (2 weeks)", html:"<b>Newly diagnosed Graves’ disease → endocrinology</b>, to confirm the aetiology, initiate antithyroid drugs and discuss definitive treatment. <b>New Graves’ ophthalmopathy → ophthalmology for CAS assessment.</b> Also pregnancy or planning, children, active or moderate thyroid eye disease, and severe symptomatic disease."},
         {tone:"plain", h:"Routine endocrinology", html:"<b>All confirmed thyrotoxicosis</b> — cause work-up, drug plan and the definitive treatment decision. Specifically: toxic multinodular goitre or toxic adenoma requiring a definitive treatment discussion · relapsed Graves’ after a first course of antithyroid drugs · subclinical hyperthyroidism requiring intervention · amiodarone-induced thyrotoxicosis."},
         {tone:"green", h:"Primary care management / shared care", html:"Thyroiditis — symptomatic management with propranolol only · monitoring stable patients on antithyroid drugs between specialist reviews · post-radioiodine hypothyroidism monitoring. Stable Graves’ on titration per the local pathway: the GP monitors FT4 and reinforces the agranulocytosis rule."}
       ]},
       {b:"warn", html:"<b>Refer everyone with confirmed thyrotoxicosis to endocrinology (NG145)</b> — but start symptom control, and where it is clearly Graves’ often the antithyroid drug too, in primary care per local shared care while awaiting review. New AF, pregnancy, thyroid eye disease, a child, or a very unwell patient = urgent referral."},
       {b:"say", html:"Your thyroid is running fast; the beta-blocker settles how you feel today and the carbimazole turns down the production over the coming weeks. The specialist will decide whether we aim for a course of tablets or a permanent fix — and remember that one rule: infection signs mean stop the tablet and get tested, same day."},
       {b:"why", html:"<b>All new Graves’ disease should be seen by endocrinology</b> — the decision between antithyroid drugs, radioiodine and thyroidectomy requires specialist input, isotope scanning, antibody profiling and patient preference counselling. Starting carbimazole in primary care without a plan for definitive management is a common systems failure. Agranulocytosis requires the drug to be stopped immediately — before the FBC result is back, because the risk of sepsis from neutropenia outweighs the risk of a short period without antithyroid medication. Graves’ ophthalmopathy worsens significantly after radioiodine in about 25% of patients, which cannot be determined without ophthalmology assessment and CAS scoring first — hence the importance of ophthalmology referral before any definitive treatment."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only — the Casebook keeps the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 34-year-old woman with 3 months of palpitations, tremor, weight loss despite a good appetite and heat intolerance. She has been told she has anxiety. She smokes 15 a day, her eyes have felt gritty and prominent, and she mentions that she and her partner are hoping to start a family this year."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Confirms biochemically with <b>TSH, FT4 and FT3</b> rather than TSH alone; asks the <b>overproduction-or-leak</b> question and <b>checks TRAb</b>; examines the <b>goitre, bruit and eyes</b>; explains that the anxiety and irritability are <b>thyroid symptoms, not a psychiatric disorder</b>; starts <b>propranolol on day one</b>; takes <b>baseline FBC and LFTs before carbimazole</b>; delivers the <b>agranulocytosis rule verbally and in writing</b>; addresses <b>smoking as eye-disease treatment (7.7× risk)</b>; and — the point this case turns on — raises the <b>pre-conception PTU switch BEFORE she conceives</b>, with joint obstetric–endocrine care. <a href='../../cases/hyperthyroidism.html'>Open the full casebook chapter →</a>"}
     ]}]},
