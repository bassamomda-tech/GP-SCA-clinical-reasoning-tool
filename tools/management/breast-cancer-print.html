  lead:'<div class="mg-layers"><a href="#severe"><b>Refer now</b><small>NG12 · exact criteria</small></a><a href="#confirm"><b>Assess</b><small>Lump · nipple · skin</small></a><a href="#workup"><b>Breast clinic</b><small>What happens next</small></a><a href="#genetics"><b>Genetics</b><small>BRCA · chemoprevention</small></a><a href="#monitor"><b>Survivorship</b><small>Endocrine therapy</small></a></div>',
  quickSub:"If you read nothing else on this page, read these six cards. Every number traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ A benign-feeling lump still meets the criterion", html:"NICE NG12: refer using a suspected cancer pathway referral if aged 30 and over with an unexplained breast lump, with or without pain. <b>A benign-feeling lump still meets the NG12 criterion if it remains unexplained after clinical assessment.</b> The referral threshold is not determined by whether the lump feels typical of a fibroadenoma or cyst. “Unexplained” means that no satisfactory diagnosis has been made following appropriate history and examination."},
    {tone:"red", h:"The other NG12 breast criteria, exactly", html:"<b>Refer (2 weeks):</b> aged 50 and over with any of discharge, retraction or other change of concern in ONE nipple only. <b>Consider referral (2 weeks):</b> <b>skin changes suggesting breast cancer</b>, or <b>aged 30 and over with an unexplained axillary lump</b>. <b>Consider non-urgent referral</b> if <b>under 30 with an unexplained breast lump</b>. <b>Spontaneous unilateral or bloodstained nipple discharge is not separately listed as an NG12 age-independent criterion, but should be referred for breast assessment when clinically concerning. Do not delay referral while treating it as physiological discharge.</b>"},
    {tone:"amber", h:"The breast clinic decides on tissue sampling", html:"Breast-clinic assessment usually comprises clinical examination, imaging (mammogram and/or ultrasound) and tissue sampling when indicated. Not every patient requires biopsy. The results must be clinically and radiologically concordant; a benign or normal test does not override persistent clinical concern. <b>Do not arrange primary-care mammography as a substitute for referral.</b>"},
    {tone:"blue", h:"Chemoprevention is CG164, not NG12", html:"NICE CG164 (familial breast cancer) governs chemoprevention and enhanced surveillance. Chemoprevention is discussed, and normally prescribed, by secondary care or the specialist genetics/familial breast service: tamoxifen for 5 years for premenopausal women at high risk, or anastrozole for 5 years for postmenopausal women at high risk (unless severe osteoporosis). It reduces the incidence of breast cancer but has not been shown to reduce mortality, so absolute benefits, harms and alternatives must be discussed. <b>NG12 is the referral guideline and says nothing about chemoprevention</b> — a distinction worth holding, because the two are frequently conflated."},
    {tone:"amber", h:"Two tamoxifen traps the GP owns", html:"Unexpected vaginal bleeding while taking tamoxifen requires prompt assessment, particularly postmenopausal bleeding. Avoid potent CYP2D6 inhibitors, particularly paroxetine and fluoxetine, where possible: tamoxifen is a prodrug and CYP2D6 inhibition may reduce formation of endoxifen. Discuss suitable alternatives with the prescriber or oncology team; commonly considered options include venlafaxine, citalopram/escitalopram or sertraline, subject to individual contraindications and interactions. <b>Avoid oestrogen-containing and other hormonal contraception in current breast cancer unless specifically advised by the breast/contraception specialist.</b>"},
    {tone:"green", h:"Explain the referral without false reassurance", html:"“Most people referred urgently with a breast symptom do not have cancer. However, examination alone cannot reliably identify every cause, so the breast clinic will assess this properly. They may use examination, imaging and, if needed, a biopsy. The referral is because of the symptom and does not mean that cancer has been diagnosed.”"}
  ],
  pathwaySub:"The whole consultation in five moves. The first one is a decision, not an examination finding.",
  pathway:[
    {title:"Apply the criteria and refer", html:"Unexplained lump at 30 or over → suspected cancer pathway referral. Unilateral nipple change at 50 or over → referral. Skin changes, or axillary lump at 30 or over → consider referral. Spontaneous unilateral or bloodstained discharge, persistent or recurrent mastitis/inflammatory change, new unilateral nipple eczema or distortion not responding to appropriate treatment, or any clinically suspicious presentation not neatly captured by NG12 → refer on clinical grounds.", alert:true},
    {title:"Examine and characterise for the letter", html:"<b>Chaperone offered and documented.</b> Examine both breasts, axillae and supraclavicular fossae. Document site, size, consistency, mobility, fixation, skin and nipple findings and <b>axillary and supraclavicular nodes</b>; record pregnancy/lactation, menopausal status, implants, previous breast cancer/radiotherapy and relevant medicines."},
    {title:"Explain what happens next", html:"<b>Breast-clinic assessment — examination, imaging and, if needed, a biopsy.</b> Most people referred urgently with breast symptoms do not turn out to have cancer, but the referral is important because examination alone cannot reliably exclude it. <b>Advise the patient not to repeatedly express the nipple to “check” it.</b> Provide a clear safety-net and ensure the referral is received."},
    {title:"Take the family history properly", html:"Take a first- and second-degree family history on both sides; use the local familial-cancer pathway or validated risk tool and refer according to CG164 and local criteria — not a fixed rule such as “three affected relatives”. <b>A family history must not delay an NG12 referral for symptoms.</b>"},
    {title:"Then hold the long tail", html:"Follow the written oncology care plan: adherence and adverse effects, bone health, menopausal symptom management, psychological support, and the recurrence symptoms to act on."}
  ],
  sections:[

    {id:"severe", nav:"Refer now", title:"The NG12 referral criteria, stated exactly",
     sub:"This is the whole clinical decision. Everything else on the page follows from getting it right.",
     blocks:[
       {b:"table", head:["Criterion","NG12 category","Action"], rows:[
         ["<b>Aged ≥30 with an unexplained breast lump, with or without pain</b>","<b>Refer</b>","<b>Suspected cancer pathway referral — appointment within 2 weeks</b>"],
         ["Aged ≥50 with discharge, retraction or other change of concern in ONE nipple only","<b>Refer</b>","<b>Suspected cancer pathway</b>"],
         ["<b>Skin changes that suggest breast cancer</b> — peau d'orange, tethering, ulceration, eczematous nipple change (Paget's)","<b>Consider referral</b>","<b>Suspected cancer pathway</b>"],
         ["<b>Aged ≥30 with an unexplained lump in the axilla</b>","<b>Consider referral</b>","<b>Suspected cancer pathway</b>"],
         ["<b>Aged &lt;30 with an unexplained breast lump, with or without pain</b>","<b>Consider non-urgent referral</b>","Routine breast clinic"],
         ["<b>Unilateral spontaneous bloodstained nipple discharge, any age</b>","Not separately listed as an NG12 age-independent criterion (the NG12 nipple criterion applies at 50 and over)","<b>Suspected cancer pathway referral at 50 and over; under 50, refer for breast assessment when clinically concerning, particularly if spontaneous, unilateral or from a single duct (urgency per local pathway). Do not delay referral while treating it as physiological discharge.</b> Duct papilloma is the commonest benign cause, but it cannot be distinguished from DCIS or invasive cancer without breast-clinic assessment. Bilateral milky discharge is different — that is galactorrhoea: check prolactin and review drug causes (antipsychotics, domperidone, antihistamines) rather than referring on the cancer pathway"],
         ["Inflammatory change — breast erythema, oedema or rapid inflammatory change","<b>Not an NG12 criterion — may be infective, inflammatory or malignant</b>","<b>If it does not improve promptly with appropriate treatment, or if the clinical picture is atypical, arrange urgent breast assessment.</b> Do not diagnose inflammatory breast cancer in primary care; recurrent or non-resolving mastitis requires escalation via the local breast pathway — see the <a href='mastitis-breast-abscess.html'>mastitis protocol</a> for the benign pathway"],
         ["New unilateral nipple eczema or distortion not responding to appropriate treatment; any clinically suspicious presentation not neatly captured by NG12","<b>Clinical grounds</b>","<b>Refer for breast assessment on clinical grounds</b>"]
       ]},
       {b:"warn", html:"The single most important message on this page: a benign-feeling lump still meets the NG12 criterion if it remains unexplained after clinical assessment. The referral threshold is not determined by whether the lump feels typical of a fibroadenoma or cyst — “unexplained” means that no satisfactory diagnosis has been made following appropriate history and examination. <b>Do not let a benign-feeling examination or normal primary-care imaging delay an indicated referral.</b> Watchful waiting on an unexplained lump at 47 because it “probably isn't anything” is a deviation from NICE NG12 and a recognised source of avoidable delay — “watch and wait” is not a shared decision when the criterion is met."},
       {b:"why", html:"Breast cancer is the most common cancer in UK women, and outcome depends on stage at diagnosis — which is what makes prompt referral matter. Most people referred urgently with breast symptoms do not turn out to have cancer, but the referral is important because examination alone cannot reliably exclude it."}
     ]},

    {id:"confirm", nav:"Assess", title:"History and examination — what the clinic needs from you",
     sub:"The referral is already decided. The examination characterises the problem for the letter and finds the features that change urgency.",
     blocks:[
       {b:"dl", rows:[
         ["<b>Lump characterisation</b>","When found and how; change since; one lump or several; hard and fixed versus soft and mobile; tender or painless. Upper outer quadrant is the commonest site. <b>Suspicious: hard, irregular, non-tender, fixed, with skin tethering</b>"],
         ["<b>Nipple and skin</b>","Discharge — spontaneous or expressed, unilateral or bilateral, single or multiple duct, bloodstained or non-bloodstained (milky); retraction or inversion (significant if NEW and unilateral; bilateral longstanding inversion is usually benign ligament shortening); peau d'orange (dermal lymphoedema — locally advanced or inflammatory cancer); eczematous or scaly nipple change (Paget's disease of the nipple)"],
         ["<b>Nodes</b>","<b>Axillary and supraclavicular examination in every case</b> — a palpable axillary lump at ≥30 is itself an NG12 criterion, and lymphoma is part of that differential"],
         ["<b>Risk factors</b>","Age; first- and second-degree family history on both maternal and paternal sides (age at diagnosis, ovarian cancer, male breast cancer); pregnancy or lactation; menopausal status; breast implants; previous breast cancer; relevant medicines; hormonal — COCP and HRT use, early menarche, late menopause, nulliparity or late first pregnancy; breastfeeding (protective); alcohol; obesity, particularly post-menopausal; previous chest radiotherapy; smoking"],
         ["<b>Examination practicalities</b>","<b>Offer and document a chaperone.</b> Examine both breasts, all quadrants, the axillae and the supraclavicular fossae, with the patient sitting and lying. <b>Document whether any discharge is spontaneous or expressed.</b> Advise the patient not to repeatedly express the nipple to “check” it — repeated manipulation can perpetuate discharge"],
         ["<b>Benign patterns worth recognising</b>","Fibroadenoma (\u201cbreast mouse\u201d): smooth, rubbery, mobile, non-tender, typically under 30 — still referred if unexplained, non-urgently under 30. Fibrocystic change and cyclical mastalgia: bilateral, cyclical, diffuse nodularity. Simple cyst: smooth, may be tender, can appear rapidly. Recognising these guides your explanation — it does not remove the referral obligation"]
       ]},
       {b:"say", html:"I can hear how worrying this has been, and I want to say two things before we go further. First, you have done exactly the right thing by coming in. Second, I do not know yet what this is — and nor would anyone until the proper tests are done. What I can tell you is what happens next: because you have a breast lump and you are over 30, national guidance says I refer you to the breast clinic to be seen within two weeks. I want to be clear that I am not doing that because I think this is cancer — I am doing it because that is the rule for an unexplained breast lump. Most people referred urgently with a breast symptom do not have cancer. However, examination alone cannot reliably identify every cause, so the breast clinic will assess this properly. They may use examination, imaging and, if needed, a biopsy. The referral is because of the symptom and does not mean that cancer has been diagnosed."}
     ]},

    {id:"workup", nav:"Breast clinic", title:"What happens at the breast clinic, and the referral letter",
     blocks:[
       {b:"dl", rows:[
         ["<b>Breast-clinic assessment</b>","Breast-clinic assessment usually comprises clinical examination, imaging (mammography and/or ultrasound) and tissue sampling when indicated. Not every patient requires biopsy. The results must be clinically and radiologically concordant; a benign or normal test does not override persistent clinical concern. Core biopsy is generally the principal tissue diagnostic test for a suspicious breast lesion; FNA is not interchangeable with it for diagnosing invasive breast cancer and has a more limited role (for example selected lymph-node assessment or cystic lesions). <b>The breast team decides whether tissue sampling is required after examination and imaging</b>"],
         ["<b>Do not arrange imaging yourself instead of referring</b>","<b>Do not arrange primary-care mammography as a substitute for referral.</b> A normal mammogram does not exclude cancer, and arranging primary care imaging in place of a suspected cancer pathway referral introduces delay while providing false reassurance"],
         ["<b>The referral letter</b>","Duration and site of the symptom; examination findings including size, consistency, mobility and skin or nipple changes; axillary node status; relevant family history with ages at diagnosis and any known pathogenic variant; pregnancy or lactation, menopausal status, implants, previous breast cancer or radiotherapy; hormonal factors including current COCP or HRT; and the patient's understanding and level of anxiety. Note explicitly if the patient has not told their family — the breast care nurse will use it. Provide a clear safety-net and ensure the referral is received"],
         ["<b>Possible outcomes</b>","Benign (fibroadenoma, cyst, fibrocystic change) — discharge with breast awareness advice. B3 atypical or indeterminate — further excision, and reassess chemoprevention eligibility. DCIS (stage 0) — non-invasive, usually detected as mammographic microcalcification. Invasive cancer — MDT, staging and receptor-driven treatment"],
         ["<b>Receptor status drives everything that follows</b>","<b>Tumour grade (1–3, with Grade 3 poorly differentiated) and receptor status are both reported. <b>ER+/PR+ (hormone receptor positive) — adjuvant endocrine therapy. HER2+ (immunohistochemistry, FISH if equivocal) — HER2-targeted therapy (trastuzumab). Triple negative (ER−/PR−/HER2−) — the most aggressive, chemotherapy-based, with fewer targeted options</b>"],
         ["<b>After a benign result — reassure properly</b>","Explain the benign diagnosis confidently; a hedged reassurance leaves the patient in doubt and re-presenting. Fibroadenoma needs no treatment unless symptomatic or large; advise patient-initiated review if it changes, and continue breast awareness"]
       ]},
       {b:"why", html:"Breast-clinic assessment combines examination and imaging with tissue sampling when indicated, and the results must be concordant. That is why the GP's job is to refer rather than to investigate: a GP-ordered mammogram reported as normal in a woman with a palpable lump is one of the recognised routes to delayed diagnosis, because it feels like an answer. <b>Refer the symptom and let the breast team decide whether tissue sampling is required after examination and imaging.</b>"}
     ]},

    {id:"genetics", nav:"Genetics", title:"Family history, BRCA and chemoprevention",
     sub:"This is CG164 territory, not NG12 — and it is a distinct GP task from the referral decision.",
     blocks:[
       {b:"table", head:["Domain","Detail"], rows:[
         ["<b>Take the family history</b>","Take a three-generation family history where feasible, documenting maternal and paternal relatives, cancer type, age at diagnosis, bilateral disease, male breast cancer, ovarian/fallopian-tube/primary peritoneal cancer, pancreatic cancer, metastatic/high-risk prostate cancer, ancestry and any known pathogenic variant"],
         ["<b>Refer to the specialist genetics/familial breast service</b>","Use the local familial-cancer pathway or validated risk tool, and refer according to CG164 and local criteria — <b>do not rely solely on a fixed rule such as “three affected relatives”</b>. CG164 referral thresholds include, among other criteria: a 10% or greater probability of a pathogenic BRCA1/BRCA2 variant; a greater than 8% risk of breast cancer in the next 10 years; a 30% or greater lifetime risk of breast cancer. CanRisk/BOADICEA or Manchester scoring may be used in the relevant specialist setting. Do not offer genetic testing without appropriate counselling, and do not confuse familial-risk surveillance with symptomatic referral"],
         ["<b>BRCA lifetime risk</b>","BRCA1 and BRCA2 pathogenic variants confer a high lifetime risk of breast cancer and also a substantial ovarian cancer risk; individual risk estimates are provided by the genetics service"],
         ["<b>Enhanced surveillance</b>","Not one universal “MRI from 30” rule: surveillance depends on calculated lifetime risk, the specific pathogenic variant, age, previous cancer, breast density and specialist advice. CG164 includes specific recommendations, including annual MRI in selected TP53-related situations and age/risk-dependent mammographic surveillance. Arranged by the specialist service, not primary care, and not part of the routine screening programme"],
         ["<b>Chemoprevention — NICE CG164</b>","Offered (by secondary care or the genetics service) to women at high risk — lifetime risk 30% or more, or a risk above 8% between 40 and 50 — unless contraindicated; considered for moderate risk (lifetime risk 17–30%). BRCA1/2 carriers are high risk. Absolute benefits, harms and alternatives must be discussed; chemoprevention reduces the incidence of breast cancer but has not been shown to reduce mortality. Decisions are based on risk category, menopausal status, comorbidity and patient preference"],
         ["<b>Chemoprevention agents</b>","CG164: tamoxifen for 5 years for premenopausal women at high risk, unless contraindicated; anastrozole for 5 years for postmenopausal women at high risk unless severe osteoporosis; tamoxifen or raloxifene as alternatives in selected postmenopausal women; corresponding “consider” recommendations at moderate risk. Before tamoxifen, assess thromboembolic risk, history of endometrial pathology/cancer, pregnancy plans and drug interactions. Before anastrozole, assess bone health and fracture risk. <b>The prescribing decision should normally be made by the specialist risk-reduction service</b>"],
         ["<b>Screening</b>","Routine breast screening is invitation-based and separate from symptomatic referral. In England, women aged 50–71 are routinely invited every 3 years. People aged over 71 can request screening. <b>A symptomatic patient should be referred through the appropriate breast pathway regardless of screening eligibility</b> — people under 50 with symptoms should not be directed to screening instead. High-risk surveillance is arranged through specialist services and is not the routine screening programme. Counsel on benefits and limitations at the age-50 invitation"]
       ]},
       {b:"warn", html:"A citation distinction worth being precise about: chemoprevention and enhanced surveillance for familial risk come from NICE CG164 (familial breast cancer), NOT from NG12. NG12 is the suspected-cancer referral guideline and does not set chemoprevention criteria. The two are commonly conflated in secondary summaries — including the casebook chapter this protocol was built from, whose own section heading cites CG164 correctly while its body text attributes the criteria to NG12. Keep three tasks distinct: (1) urgent symptomatic breast referral — NG12; (2) familial-risk assessment — CG164/local genetics pathway; (3) surveillance and risk-reducing medication — CG164/specialist service. <b>A family history must not delay an NG12 referral for symptoms.</b>"},
       {b:"why", html:"<b>Breast awareness has replaced formal self-examination in UK advice</b> — the instruction is to know what is normal for you and to report change promptly, rather than to perform a monthly ritual examination. The practical message: \u201cany new lump, skin change, nipple change or swelling in the armpit — report it straight away, not after six weeks\u201d. That last clause matters: the modal delay in this presentation is the patient's, not the system's, and the reason is usually fear rather than ignorance."}
     ]},

    {id:"ladder", nav:"Treatment", title:"Treatment landscape — enough to counsel and monitor",
     sub:"The MDT leads. Endocrine treatment and duration are determined by the oncology team. The GP should support adherence, identify adverse effects and avoid clinically important interactions.",
     blocks:[
       {b:"table", head:["Modality","Detail and GP role"], rows:[
         ["<b>Endocrine therapy — ER+ pre-menopausal</b>","Tamoxifen 20 mg OD; NICE NG101 recommends adjuvant endocrine therapy for ER-positive invasive breast cancer, with the choice influenced by menopausal status, recurrence risk and contraindications, and duration set by the oncology team. GP: unexpected vaginal bleeding requires prompt assessment, particularly postmenopausal bleeding; DVT/PE symptom awareness; mood; LFTs only if required by the oncology plan, local shared-care protocol or product information. <b>Avoid oestrogen-containing and other hormonal contraception in current breast cancer unless specifically advised by the breast/contraception specialist; offer an appropriate non-hormonal method and arrange specialist contraceptive advice where needed</b>"],
         ["<b>Endocrine therapy — ER+ post-menopausal</b>","Aromatase inhibitor: anastrozole 1 mg OD, letrozole 2.5 mg OD or exemestane 25 mg OD, for a duration set by the oncology team. No endometrial or DVT/PE risk. GP: assess fracture risk and arrange baseline and repeat bone-density assessment according to oncology/local bone-health guidance and the individual risk profile; joint pain; menopausal symptoms. Only for post-menopausal women or those with confirmed ovarian suppression — confirm menopausal status (FSH where uncertain), because giving an aromatase inhibitor to a pre-menopausal woman causes a reflexive rise in oestrogen"],
         ["<b>Ovarian suppression</b>","GnRH agonist (goserelin, leuprorelin) in pre-menopausal high-risk ER+ disease — the GP may continue injections prescribed by oncology"],
         ["<b>HER2-targeted therapy</b>","Trastuzumab (Herceptin) for 12 months; cardiac toxicity risk — NICE NG101 recommends cardiac assessment before treatment and every 3 months during treatment, with action where LVEF falls; follow-up after treatment may also be required according to the oncology/cardiology plan. <b>Not given simultaneously with anthracyclines.</b> Pertuzumab adds GI effects (diarrhoea — loperamide); lapatinib is oral, for metastatic or post-trastuzumab disease, with hepatotoxicity monitoring"],
         ["<b>Chemotherapy side effects — GP-relevant</b>","Any patient receiving systemic anticancer treatment who is acutely unwell, febrile, rigoring or has a temperature abnormality should be treated as potentially having neutropenic sepsis and should contact the oncology emergency pathway immediately (for example the Christie/Greater Manchester acute oncology contact pathway). Use the patient's treatment-specific advice; do not rely on 38°C alone. Nausea (ondansetron, metoclopramide, dexamethasone per protocol); taxane peripheral neuropathy (report to oncology); premature ovarian failure — HRT is usually contraindicated in ER+ disease, so use venlafaxine for hot flushes"]
       ]},
       {b:"warn", html:"<b>The CYP2D6 interaction is a GP prescribing trap.</b> Tamoxifen is a prodrug requiring CYP2D6 conversion to endoxifen, its active metabolite. CYP2D6 inhibition may reduce formation of endoxifen, so the MHRA advises avoiding potent CYP2D6 inhibitors, particularly paroxetine and fluoxetine, where possible in people taking tamoxifen. Discuss suitable alternatives with the prescriber or oncology team; commonly considered options include venlafaxine, citalopram/escitalopram or sertraline, subject to individual contraindications and interactions (QT risk, hyponatraemia, seizure risk, renal/hepatic function and other medicines). Aromatase inhibitors are metabolised via CYP3A4, so check interactions with strong inhibitors such as ketoconazole and clarithromycin. Venlafaxine is also commonly used for tamoxifen-associated hot flushes."}
     ]},

    {id:"lifestyle", nav:"Risk reduction", title:"Modifiable risk, and what to say when",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"🍷 Alcohol", html:"Advise within the general NHS alcohol guidance of no more than 14 units per week, spread over 3 or more days, with alcohol-free days. Avoid presenting lifestyle advice as a cause of the current symptom or as a substitute for assessment. Time it carefully: <em>\u201cI'm not raising this to add to what you're dealing with today — just so you have the information.\u201d</em>"},
         {tone:"green", h:"🏃 Exercise", html:"Offer appropriate physical-activity support where relevant, while recognising individual circumstances and treatment effects — including resistance training for bone health during aromatase inhibitor therapy."},
         {tone:"blue", h:"⚖️ Weight", html:"Post-menopausal obesity raises ER+ risk, because adipose tissue becomes the primary oestrogen source once ovarian production ceases. Offer appropriate weight-management and physical-activity support where relevant, while recognising individual circumstances and treatment effects."},
         {tone:"blue", h:"🤱 Reproductive factors", html:"<b>Breastfeeding is protective</b>, through prolonged amenorrhoea and mammary cell differentiation. <b>Worth naming as a positive</b> — it reduces the guilt patients attach to the risk factors they cannot change."},
         {tone:"cream", h:"🔬 Breast awareness", html:"Encourage awareness of normal breast appearance and prompt reporting of a new lump, nipple change, skin change or axillary swelling. Formal monthly self-examination is not required."},
         {tone:"blue", h:"💊 HRT and the COCP", html:"Before diagnosis these are a risk-factor discussion, not a contraindication. Avoid oestrogen-containing and other hormonal contraception in current breast cancer unless specifically advised by the breast/contraception specialist. Offer an appropriate non-hormonal method and arrange specialist contraceptive advice where needed. Do not change hormonal medication before the diagnosis is known."}
       ]}
     ]},

    {id:"monitor", nav:"Survivorship", title:"Follow-up, monitoring and the recurrence safety-net",
     blocks:[
       {b:"table", head:["What","Detail"], rows:[
         ["<b>Surveillance imaging</b>","Offer annual mammography for 5 years to people who have had or are being treated for breast cancer, including DCIS; continue according to the screening programme thereafter where applicable (NICE NG101). <b>Routine surveillance blood tests, tumour markers, CT or bone scans are not indicated in asymptomatic patients unless directed by the specialist team</b>"],
         ["<b>Tamoxifen monitoring</b>","Follow the written oncology care plan; LFTs only if required by the oncology plan, local shared-care protocol or product information; unexpected vaginal bleeding requires prompt assessment, particularly postmenopausal bleeding (routine endometrial surveillance or transvaginal ultrasound is not indicated in asymptomatic users); DVT/PE symptom awareness; mood (PHQ-9); adherence check, and discuss any consideration of early discontinuation with oncology rather than stopping. Review CYP2D6-interacting drugs at every medication change"],
         ["<b>Aromatase inhibitor monitoring</b>","Assess fracture risk and arrange baseline and repeat bone-density assessment according to oncology/local bone-health guidance and the individual risk profile. Do not prescribe bone protection automatically — it depends on BMD, fracture risk, age, renal function, dental status, calcium/vitamin D status and the oncology plan; weight-bearing exercise; paracetamol or an NSAID for aromatase-inhibitor joint pain"],
         ["<b>Cardiac monitoring on trastuzumab</b>","<b>Cardiac assessment before treatment and every 3 months during treatment</b>, with follow-up after treatment according to the oncology/cardiology plan — oncology-arranged, but the GP should act on new cardiac symptoms"],
         ["<b>Menopausal symptoms</b>","Venlafaxine for hot flushes (not paroxetine or fluoxetine with tamoxifen); clonidine, duloxetine, CBT, acupuncture and sleep hygiene as adjuncts; non-hormonal vaginal moisturisers and lubricants (Replens) for dryness, since vaginal oestrogen is contentious in ER+ disease; topical vaginal oestradiol is an oncologist decision in ER+ disease"],
         ["<b>Psychosocial</b>","Counselling, breast care nurse, Breast Cancer Now and Macmillan; occupational health for phased return to work; fertility discussion and egg preservation before chemotherapy in younger women; body image after surgery or reconstruction; PHQ-9 and GAD-7"],
         ["<b>Recurrence symptoms to act on</b>","New bone pain · a new lump in either breast or on the chest wall (do not assume a new lump is scar tissue) · contralateral or axillary nodes · respiratory symptoms · new neurological symptoms. If recurrence is suspected: FBC, U&amp;E, LFTs with albumin, corrected calcium (hypercalcaemia of malignancy), LDH, TFTs if symptomatic, and consider chest X-ray — jaundice or hepatomegaly suggests liver metastases"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 Same-day", html:"Acutely unwell, febrile, rigoring or a temperature abnormality during systemic anticancer treatment → oncology emergency pathway immediately (potential neutropenic sepsis — use the patient's treatment-specific advice; do not rely on 38°C alone) · suspected DVT or PE on tamoxifen · new severe bone pain with neurological signs (cord compression)."},
         {tone:"amber", h:"🟠 Urgent referral", html:"Unexpected vaginal bleeding on tamoxifen, particularly postmenopausal bleeding → prompt assessment via the urgent gynaecology pathway. Also new visual symptoms on tamoxifen (retinal toxicity)."},
         {tone:"purple", h:"🟣 Suspected cancer", html:"Any new NG12 breast criterion in a treated patient — a new lump in either breast is not assumed to be scar tissue."},
         {tone:"green", h:"📘 Support", html:"<b>Breast Cancer Now</b> for information and peer support; the breast care nurse remains the point of contact through treatment. Follow the written oncology care plan, check adherence and adverse effects, and record the local acute oncology and breast-service contacts in the notes."}
       ]},
       {b:"say", html:"You are on anastrozole for as long as your oncology team recommends, and there are three things I will keep an eye on. Your bones — the tablet accelerates bone loss, so we check your bone health as your care plan recommends and may add a bone-protecting treatment if it is needed. Your joints — aching is the commonest side effect and there are things that help, so tell me rather than stopping the tablet. And your mood, because this is a long haul. One rule to take away: if you ever get new bone pain that does not settle, or you find a new lump in either breast, come to me rather than waiting for your next clinic appointment."}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways",
     blocks:[
       {b:"cards", items:[
         {tone:"purple", h:"Breast suspected cancer pathway referral · NICE NG12", html:"<b>Refer:</b> unexplained breast lump at 30 or over; unilateral nipple discharge, retraction or other change of concern at 50 or over. <b>Consider referral:</b> skin changes suggesting cancer; unexplained axillary lump at 30 or over. <b>Refer on clinical grounds (not NG12 criteria):</b> spontaneous unilateral/bloodstained discharge · persistent or recurrent mastitis/inflammatory change · new unilateral nipple eczema or distortion not responding to appropriate treatment · any clinically suspicious presentation not neatly captured by NG12."},
         {tone:"blue", h:"Routine breast clinic", html:"<b>Unexplained breast lump under 30 — consider non-urgent referral.</b> Also benign symptomatic disease needing specialist input (large fibroadenoma, recurrent cysts)."},
         {tone:"amber", h:"Clinical genetics", html:"Structured three-generation family history on both sides; use the local familial breast/genetics pathway and apply CG164 risk thresholds or the validated local tool — not a fixed relative-count rule. Do not offer genetic testing without appropriate counselling. A family history must not delay an NG12 referral."},
         {tone:"red", h:"Same-day oncology", html:"<b>Acutely unwell, febrile, rigoring or a temperature abnormality during systemic anticancer treatment → local acute oncology emergency pathway immediately</b> (do not rely on 38°C alone) · suspected spinal cord compression."},
         {tone:"green", h:"NHS Breast Screening", html:"Invitation-based and separate from symptomatic referral: in England, women aged 50–71 are invited every 3 years; people over 71 can request screening. Symptomatic patients are referred through the breast pathway regardless of screening eligibility."},
         {tone:"cream", h:"GP management", html:"Shared care with oncology: the referral decision and letter · chaperoned examination · explanation and psychological support · family history assessment · endocrine therapy monitoring and side-effect management · survivorship review. Benign inflammatory breast disease is on the <a href='mastitis-breast-abscess.html'>mastitis and breast abscess protocol</a>."}
       ]},
       {b:"why", html:"Two things make this presentation go wrong in primary care, and neither is a knowledge gap about cancer biology. The first is <b>substituting clinical judgement for the NG12 criterion</b> — deciding a lump feels benign and arranging review instead of referral. The second is <b>hedged communication</b>: a referral explained so anxiously that the patient believes they have cancer, or so casually that they do not attend. Both are avoidable with a clear script, which is why this page carries one."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 47-year-old teacher has had a firm painless lump in the right upper outer quadrant for six weeks. She came only because a friend who had breast cancer insisted. Her mother was diagnosed at 63; she is on the COCP, drinks 15 units a week, and has told nobody in her family because she does not want to worry them \u201cif it's nothing\u201d. She is asking for reassurance."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Refers on the suspected cancer pathway because she is over 30 with an unexplained lump — and does not let a benign-feeling examination override the criterion; explains the referral without catastrophising or falsely reassuring, and explains breast-clinic assessment (examination, imaging and, if needed, a biopsy); acknowledges the fear before taking the clinical history, since a frightened patient retains little; takes a structured family history on both sides and applies CG164/local familial-risk criteria rather than a fixed rule, without letting it delay the referral; <b>does not stop the COCP before a diagnosis is known</b>; times the <b>alcohol conversation</b> so it does not land as blame; and — the step candidates miss — <b>addresses that she has told no one, and offers the words to use.</b>"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — the breast cancer referral criteria (breast recommendations dated [2015] on the NICE page): refer at 30 and over with an unexplained breast lump, and at 50 and over with unilateral nipple change; consider referral for skin changes suggesting cancer and for an unexplained axillary lump at 30 and over; consider non-urgent referral under 30. The NG12 information for the public (breasts and armpits) supports the statement that most people referred urgently do not have cancer</span></li>'+
         '<li>NICE CG164 — Familial breast cancer: classification, care and managing breast cancer and related risks in people with a family history of breast cancer<br><a href="https://www.nice.org.uk/guidance/cg164" rel="noopener">nice.org.uk/guidance/cg164</a><span class="rd"> — the genetics referral criteria, enhanced surveillance, and the chemoprevention thresholds and agents. <b>This is the guideline for chemoprevention, not NG12</b> — the source casebook\u2019s section heading cites CG164 correctly while its body text repeatedly attributes the chemoprevention criteria to NG12; this page follows CG164</span></li>'+
         '<li><b>NICE NG101 — Early and locally advanced breast cancer: diagnosis and management</b><br><a href="https://www.nice.org.uk/guidance/ng101" rel="noopener">nice.org.uk/guidance/ng101</a><span class="rd"> — breast-clinic diagnosis, adjuvant endocrine therapy for ER-positive invasive disease, trastuzumab cardiac assessment (before and every 3 months during treatment), and annual mammography for 5 years after treatment, including DCIS</span></li>'+
         '<li><b>MHRA Drug Safety Update — Tamoxifen for breast cancer</b><br><a href="https://www.gov.uk/drug-safety-update" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> — avoid potent CYP2D6 inhibitors such as paroxetine and fluoxetine where possible</span></li>'+
         '<li><b>Summaries of Product Characteristics (MHRA-licensed product information)</b><br><a href="https://www.medicines.org.uk/emc" rel="noopener">medicines.org.uk/emc</a><span class="rd"> — tamoxifen, anastrozole, trastuzumab, goserelin or leuprorelin and venlafaxine: adverse effects, contraindications and monitoring, checked against the specific product and date accessed</span></li>'+
         '<li><b>NHS Breast Screening Programme</b><span class="rd"> — in England, women aged 50–71 are routinely invited every 3 years; people over 71 can request screening</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — tamoxifen, anastrozole, letrozole, exemestane, trastuzumab, goserelin and venlafaxine prescribing, and the tamoxifen CYP2D6 interactions</span></li>'+
         '<li><b>Breast Cancer Now</b><br><a href="https://breastcancernow.org" rel="noopener">breastcancernow.org</a><span class="rd"> — patient information and peer support</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Breast cancer — NICE NG12 for referral, NICE CG164 for familial risk, surveillance and chemoprevention, NICE NG101 for diagnosis, treatment and follow-up, the MHRA Drug Safety Update on tamoxifen and CYP2D6 inhibitors, and the NHS Breast Screening Programme. An unexplained breast lump at 30 or over is a suspected cancer pathway referral however benign it feels, and a benign or normal test does not override persistent clinical concern. Benign inflammatory breast disease is covered by the <a href=\"mastitis-breast-abscess.html\">mastitis and breast abscess protocol</a>. Verify all doses against the current BNF before prescribing, and follow local shared-care arrangements for endocrine therapy monitoring."
