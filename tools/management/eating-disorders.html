  ],
  lead:'<div class="mg-layers"><a href="#severe"><b>Physical risk</b><small>MEED · clinical judgement</small></a><a href="#confirm"><b>Recognise</b><small>SCOFF · the diagnoses</small></a><a href="#workup"><b>Assess</b><small>ECG · bloods · SUSS</small></a><a href="#ladder"><b>Treat</b><small>Refer · therapy · drugs</small></a><a href="#monitor"><b>GP role</b><small>Monitoring · relapse</small></a></div>',
  quickSub:"If you read nothing else on this page, read these six cards. Every number traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Substantial excess mortality", html:"Anorexia nervosa is associated with substantial excess mortality, including from medical complications and suicide. Early assessment and treatment are important; <b>do not delay referral</b>."},
    {tone:"red", h:"MEED — a risk-assessment aid, not an admission algorithm", html:"One red parameter or two or more amber parameters should prompt urgent senior clinical discussion with the eating-disorder and acute medical teams. Admit when medical stabilisation or refeeding cannot be safely delivered in the community or day-patient setting. <b>Do not use BMI alone to determine admission.</b> Adult red markers include awake heart rate &lt;40, systolic BP &lt;90 mmHg with recurrent syncope or significant postural change, QTc &gt;450 ms (females) or &gt;430 ms (males), and severe hypokalaemia (approximately &lt;2.5 mmol/L); under-18s use age- and sex-adjusted criteria and the local paediatric pathway."},
    {tone:"amber", h:"Refer without waiting for readiness", html:"NICE NG69 is explicit: do not delay referral to the eating disorders service because of waiting lists or because the patient seems not \u201cready\u201d. <b>Refer immediately on suspicion and manage in parallel</b> — early intervention produces higher full-recovery rates and lower mortality. Under-18s: the local CAMHS eating-disorder urgent pathway — the NHS access standard is 1 week for urgent and 4 weeks for routine cases, but medically unstable patients need immediate acute medical assessment."},
    {tone:"blue", h:"SCOFF — a score of ≥2 is a positive screen", html:"<b>S</b>ick because uncomfortably full · lost <b>C</b>ontrol over eating · lost more than <b>O</b>ne stone in 3 months · believe yourself <b>F</b>at when others say too thin · <b>F</b>ood dominates your life. <b>A screening aid, not a diagnostic test</b> — a score of ≥2 should raise suspicion and prompt clinical assessment, and a negative result must not override concerning history, examination, weight trajectory or physical findings. Performance varies between studies and is less certain in men, adolescents, diverse populations, atypical anorexia, ARFID and binge eating disorder. Ask it sensitively — patients frequently deny or minimise, especially about weight."},
    {tone:"red", h:"Refeeding syndrome is the danger of treatment", html:"High risk (NICE CG32): BMI &lt;16, unintentional weight loss &gt;15% in 3–6 months, little or no intake for &gt;10 days, or low potassium, phosphate or magnesium before feeding — or two of BMI &lt;18.5, weight loss &gt;10%, little intake for &gt;5 days, or alcohol or drug misuse. <b>If refeeding risk is present, do not provide a calorie prescription in primary care</b> — arrange urgent specialist eating-disorder/medical assessment and follow the local MEED-based refeeding protocol, with thiamine and electrolyte replacement per the acute medical/nutrition protocol. A low or falling phosphate, potassium or magnesium during nutritional rehabilitation may indicate refeeding syndrome; urgency depends on the degree of abnormality, rate of change and clinical deterioration."},
    {tone:"green", h:"A normal BMI does not exclude a severe eating disorder", html:"Atypical anorexia nervosa can cause severe medical and psychiatric complications despite a normal or high BMI. Bulimia and binge eating disorder usually present at normal or raised BMI. Think also of rapid weight loss, high weight with restrictive eating, purging at normal weight, compulsive exercise, ARFID and insulin omission in type 1 diabetes. <b>The physical risk parameters, not the weight, decide urgency.</b>"}
  ],
  pathwaySub:"The whole consultation in five moves. The red step decides today's disposal.",
  pathway:[
    {title:"Assess physical risk first", html:"Pulse, lying and standing BP, temperature, BMI, ECG for QTc, and U&amp;E with phosphate and magnesium. Use MEED as a risk-assessment aid: one red or two or more amber parameters → urgent senior discussion with the eating-disorder and acute medical teams; admit when stabilisation or refeeding cannot be safely delivered outside hospital. Do not use BMI alone. Consider refeeding risk before anyone starts eating more.", alert:true},
    {title:"Recognise and name it", html:"<b>SCOFF as an adjunct only</b>, then which disorder — anorexia nervosa, <b>atypical anorexia</b>, bulimia or binge eating disorder — or a related presentation such as <b>ARFID</b> or insulin omission in type 1 diabetes. Ask about restriction and food rules, fear of weight gain, body image, binge eating, <b>compensatory behaviours</b> (vomiting, laxatives, diuretics, fasting, compulsive exercise), weight trajectory and current intake, dizziness, collapse, palpitations and cold intolerance, self-harm and suicide, alcohol and substance use, and insulin omission in type 1 diabetes."},
    {title:"Investigate for complications, not for diagnosis", html:"ECG, U&amp;E, phosphate, magnesium, FBC, glucose; LFTs, TFTs and creatine kinase where clinically indicated, interpreted clinically; DEXA risk-directed and specialist-led."},
    {title:"Refer immediately and set the GP contract", html:"<b>Age-appropriate eating disorders service now, whatever the BMI, SCOFF or readiness</b>; local CAMHS urgent pathway if under 18. Agree a shared-care plan — who monitors which physical parameters and how deterioration is escalated — and what you will not do: you are not the eating disorder therapist."},
    {title:"Monitor for the long term", html:"Intake, weight trajectory, purging/exercise, pulse, BP and mental-health risk at each relevant review; bloods and ECG according to current risk and the specialist plan; full MEED when there is deterioration. <b>Do not discharge from GP care</b> — these are chronic, relapsing conditions."}
  ],
  sections:[

    {id:"severe", nav:"Physical risk", title:"Physical risk — MEED and clinical judgement",
     sub:"The MEED framework (2022, Royal College of Psychiatrists — the guidance that replaced MARSIPAN) is a structured risk-assessment aid to clinical judgement, not an automatic admission algorithm. One red parameter or two or more amber parameters should prompt urgent senior clinical discussion with the eating-disorder and acute medical teams. Admit when medical stabilisation or refeeding cannot be safely delivered in the community or day-patient setting. Do not use BMI alone to determine admission.",
     blocks:[
       {b:"table", head:["Finding","What it means","Action"], rows:[
         ["<b>Adult BMI &lt;13 (a MEED red parameter), or rapid weight loss, with physical complications</b>","<b>Possible severe physical compromise</b> — BMI alone does not decide, and in under-18s BMI must be age- and sex-adjusted. Risk can be high above BMI 13 in atypical anorexia, rapid weight loss from obesity, ARFID, significant purging, dehydration, electrolyte disturbance or psychiatric risk","<b>Urgent senior/specialist assessment; usually a low threshold for admission</b>"],
         ["<b>Heart rate &lt;40 bpm</b>","<b>Bradycardia from vagal overactivity and electrolyte imbalance.</b> Awake HR &lt;40 is a MEED red parameter; with QTc prolongation, hypokalaemia or hypophosphataemia (hypomagnesaemia too) this is a <b>risk of sudden cardiac death</b>","<b>Urgent same-day medical assessment; admit if unstable</b>"],
         ["<b>Adults: systolic BP &lt;90 mmHg, significant postural hypotension or recurrent syncope</b>","Haemodynamic compromise. Children and adolescents: use age- and sex-adjusted centiles and the local paediatric pathway","<b>Urgent medical assessment</b>"],
         ["<b>Prolonged QTc or other ECG abnormality</b>","Adult red-risk values approximately QTc &gt;450 ms in females, &gt;430 ms in males; under-18s use age-, sex- and local paediatric criteria. Interpret with electrolytes, bradycardia, QT-prolonging medicines, ECG morphology and rhythm, and symptoms","<b>Urgent clinical finding</b> — review electrolytes and QT-prolonging medicines and seek urgent senior advice"],
         ["<b>Temperature &lt;35.5°C</b>","Hypothermia from loss of insulation and reduced metabolic rate","<b>MEED risk marker — urgent senior discussion; admit if unstable</b>"],
         ["<b>Hypokalaemia</b>","Arrhythmia risk, particularly with purging, ECG abnormality or symptoms","<b>Urgent assessment.</b> Severe hypokalaemia — approximately &lt;2.5 mmol/L — or hypokalaemia with ECG changes, syncope or arrhythmia → emergency medical management"],
         ["<b>Low or falling phosphate, potassium or magnesium</b>","Clinical context and fall from baseline matter, not one absolute value; during refeeding this may indicate refeeding syndrome","<b>Urgent specialist management.</b> Severe biochemical abnormality, or associated cardiac, respiratory, neurological or muscular deterioration → emergency admission"],
         ["<b>Abnormal SUSS test</b> — difficulty sitting up from lying flat or rising from a squat, or needing the arms","Muscle weakness from malnutrition — the <b>sit-up–squat–stand (SUSS)</b> test as described in MEED","<b>A red/amber risk marker</b>, not an isolated diagnosis or automatic admission decision"],
         ["<b>Refeeding syndrome developing</b>","<b>Low or falling phosphate, potassium or magnesium after feeding, with clinical deterioration</b>","<b>Emergency admission</b>"],
         ["<b>Any acute deterioration in a known patient</b>","<b>Collapse, chest pain, arrhythmia, severe bradycardia, severe electrolyte abnormality or hypoglycaemia, acute food/fluid refusal, significant suicide risk or self-harm, DKA or insulin omission</b>","<b>Same-day medical assessment; 999 for collapse or life-threatening features</b> — do not wait for the eating-disorder service"]
       ]},
       {b:"warn", html:"Refeeding syndrome is the most important acute complication of treating severe malnutrition. In prolonged starvation the body shifts to fat and protein catabolism; intracellular phosphate, potassium and magnesium look relatively preserved even though total body stores are depleted. When carbohydrate is reintroduced, insulin drives glucose, potassium, phosphate and magnesium back into cells simultaneously and plasma levels fall precipitously — causing cardiac arrhythmias, cardiac failure, respiratory failure, seizures and rhabdomyolysis. A low or falling phosphate, potassium or magnesium during nutritional rehabilitation may indicate refeeding syndrome; urgency depends on the degree of abnormality, rate of change and clinical deterioration. <b>Refeeding is delivered by a trained multidisciplinary team with rapid biochemical testing and a locally approved MEED-based protocol — do not provide a calorie prescription in primary care.</b> For reference, NICE CG32 (general nutrition support, not eating-disorder-specific): high risk if BMI &lt;16, unintentional weight loss &gt;15% in 3–6 months, little or no intake for &gt;10 days, or low electrolytes before feeding (or two lesser criteria, including little intake for &gt;5 days); start at a maximum of 10 kcal/kg/day (5 kcal/kg/day in extreme cases) and increase over 4–7 days — in eating disorders MEED 2022 favours specialist-led refeeding that avoids underfeeding; thiamine 200–300 mg daily immediately before and during the first 10 days, with route and dose (including any IV preparation) set by severity, oral/enteral access, suspected Wernicke's encephalopathy and local policy — not routinely started in primary care; monitor phosphate, potassium, magnesium, glucose, fluid balance, observations and ECG at a frequency determined by clinical risk (continuous monitoring may be needed at extreme risk or with arrhythmia)."},
       {b:"why", html:"Any patient with a suspected eating disorder needs a physical assessment, and it is the GP who usually has to perform or arrange it — ECG, electrolytes including phosphate and magnesium, glucose, and lying/standing blood pressure. The cardiac risk in severe anorexia nervosa is substantial and <b>peaks during refeeding</b>, which is exactly when the patient appears to be getting better. <b>Use the full MEED framework whenever there is deterioration or concern about medical compromise, and document it</b> — it converts a vague concern into a defensible, clinically judged decision about escalation."},
       {b:"dl", rows:[
         ["<b>NG12 stated honestly</b>","Eating disorders have no NICE NG12 suspected-cancer criterion, and none should be invented for one. The relevant caution runs the other way: unexplained weight loss in an adult also has an organic differential, and a psychiatric label must not close it down prematurely. Where the history is appetite loss rather than restriction with body-image disturbance — particularly over 40, or with dysphagia, an abdominal mass, anaemia, hypercalcaemia or abnormal LFTs — work it up on the <a href='../algorithms/anorexia.html'>appetite loss and nutritional assessment pathway</a>, which carries the NG12 cancer routes in full"]
       ]}
     ]},

    {id:"confirm", nav:"Recognise", title:"Screening and diagnosis",
     sub:"SCOFF is a screening aid only; identify which disorder clinically — the treatments differ.",
     blocks:[
       {b:"dl", rows:[
         ["<b>SCOFF questionnaire</b>","Do you make yourself Sick because you feel uncomfortably full? Do you worry you have lost Control over how much you eat? Have you recently lost more than One stone in a 3-month period? Do you believe yourself to be Fat when others say you are too thin? Would you say that Food dominates your life? A SCOFF score of ≥2 should raise suspicion and prompt clinical assessment. SCOFF is a screening aid, not a diagnostic test, and a negative result must not override concerning history, examination, weight trajectory or physical findings. The original study (Morgan 1999, cut-off ≥2) reported 100% sensitivity and 87.5% specificity in a small sample of women; a later pooled estimate was approximately 86% sensitivity and 83% specificity, with uncertain generalisability to men, adolescents, diverse populations, atypical anorexia, ARFID and binge eating disorder. Administer it sensitively and non-judgementally: patients frequently deny or minimise, particularly the weight-related questions"],
         ["<b>What to ask about</b>","Restriction of intake, fear of weight gain, distorted body image, and compensatory behaviours — purging, laxative abuse, excessive exercise. Quantify the weight change and weigh in clinic against previous documented weights, because patients often underestimate"],
         ["<b>Mental-health and safeguarding assessment</b>","Suicidal ideation, intent, plan and access to means; self-harm; abuse and exploitation; capacity and consent; safeguarding of children and dependent adults; carer strain; alcohol and substance misuse; and the safeguarding implications of insulin omission. Significant suicide risk → emergency care"],
         ["<b>Anorexia nervosa</b>","Restriction with low weight, <b>fear of weight gain and body-image disturbance</b>. Look for <b>amenorrhoea, lanugo hair, cold intolerance and bradycardia</b>"],
         ["<b>Atypical anorexia nervosa</b>","<b>Every criterion for anorexia nervosa met EXCEPT the low weight.</b> Can cause severe medical and psychiatric complications despite a normal or high BMI. Assess risk using weight trajectory, rate of loss, intake, purging, exercise, observations, ECG, blood tests and mental-health risk — not BMI alone"],
         ["<b>Bulimia nervosa</b>","Binge eating with compensatory behaviour, usually at <b>normal or raised BMI</b>. Look for dental erosion, parotid swelling, Russell's sign (knuckle calluses) and hypokalaemia. The <b>restrictive phase</b> can also present as appetite loss"],
         ["<b>Binge eating disorder</b>","Recurrent binges without compensatory behaviour; distress and loss of control are the core features. Commonly presents to primary care as obesity rather than as an eating disorder"],
         ["<b>ARFID — avoidant/restrictive food intake disorder</b> (outside the scope of NG69)","A distinct feeding and eating disorder (DSM-5): food refusal driven by sensory characteristics, fear of aversive consequences (choking, vomiting), or an apparent lack of interest in food — WITHOUT the body-image disturbance of anorexia nervosa. Increasingly recognised in adults, not just children, and more frequent in autism spectrum disorder, anxiety disorders and OCD. Consider it in longstanding selective eating causing nutritional deficiency. Refer to the local specialist pathway; NG69 treatment recommendations for anorexia, bulimia and binge eating disorder should not be assumed to apply"],
         ["<b>Insulin omission in type 1 diabetes</b> (sometimes called \u201cdiabulimia\u201d — a colloquial term, not a formal DSM-5 or ICD diagnosis)","<b>Deliberate insulin omission or restriction to control weight is a high-risk eating-disorder presentation</b> — glycosuria causes caloric loss. Describe the eating-disorder behaviours and diabetes risk explicitly, and involve the eating-disorder, diabetes and acute medical teams urgently. Red flags: recurrent DKA, unexplained hyperglycaemia, insulin omission, hypoglycaemia, ketones, weight loss, self-harm or suicidality; see the <a href='dka.html'>DKA protocol</a>"]
       ]},
       {b:"why", html:"<b>Two traps account for most missed diagnoses.</b> The first is <b>weight</b>: bulimia, binge eating disorder and atypical anorexia all commonly present at a normal or raised BMI, so a BMI in range tells you nothing about risk. The second is <b>the patient's own account</b> — denial and minimisation are features of the illness rather than dishonesty, which is why a collateral history and an objective clinic weight matter, and why the SCOFF is worth asking even when the presenting complaint is something else."}
     ]},

    {id:"workup", nav:"Assess", title:"Examination and investigations",
     sub:"You are not investigating to make the diagnosis — that is clinical. You are quantifying physical risk.",
     blocks:[
       {b:"table", head:["Assessment","Detail"], rows:[
         ["<b>Observations</b>","Weight and previous weight trajectory, BMI (age- and sex-adjusted in under-18s), pulse, lying and standing (orthostatic) BP, temperature, hydration"],
         ["<b>SUSS test</b>","Sit-up–squat–stand, as described in MEED: assess sitting up from lying flat and rising from a squat, noting whether the patient needs their arms or has marked difficulty. A risk marker of muscle weakness, not a fully validated objective measure of proximal myopathy"],
         ["<b>Nutritional examination</b>","Temporal, thenar and interosseous wasting; <b>lanugo hair, cold peripheries, dry skin</b>. In purging: <b>dental erosion, parotid swelling, Russell's sign</b>"],
         ["<b>ECG</b>","<b>QTc prolongation and bradycardia — arrhythmia risk.</b> Arrange according to clinical risk and the specialist care plan; repeat for significant weight loss, bradycardia, hypotension, purging, electrolyte disturbance, relevant medication, excessive exercise or caffeine, cardiac symptoms or a previous abnormal ECG"],
         ["<b>U&amp;E plus Mg²⁺ and PO₄</b>","<b>Electrolyte disturbance from restriction or purging.</b> Hypokalaemia is characteristic of purging; hypomagnesaemia and hyponatraemia also occur"],
         ["<b>FBC, ferritin, B12, folate</b>","Anaemia and micronutrient deficiency"],
         ["<b>LFTs</b>","Where clinically indicated. Malnutrition may cause transaminase elevation, but do not automatically attribute abnormal results to starvation — consider viral hepatitis, alcohol, medicines or supplements, autoimmune liver disease, muscle injury, infection, hypoperfusion and pregnancy-related disease, and investigate according to pattern and severity"],
         ["<b>Glucose</b>","Hypoglycaemia in severe restriction"],
         ["<b>TFTs</b>","Low free T3 may reflect non-thyroidal illness in severe malnutrition — interpret thyroid results clinically rather than categorically dismissing hypothyroidism"],
         ["<b>Creatine kinase</b>","Raised in rhabdomyolysis, and with excessive exercise"],
         ["<b>DEXA bone density</b>","Consider bone-health assessment and DEXA according to duration of illness, low weight, amenorrhoea or hypogonadism, fracture history, recurrent nutritional deficiency and specialist advice. Weight restoration and treatment of the eating disorder are central to bone health"]
       ]},
       {b:"why", html:"<b>Sick euthyroid syndrome is the investigation trap here.</b> Severe malnutrition suppresses peripheral T4-to-T3 conversion, giving a low free T3 with a normal or low-normal TSH — this is an adaptive response to starvation, not thyroid disease, and treating it with levothyroxine increases metabolic rate in a patient who cannot afford it. It resolves with nutritional restoration. Interpret thyroid results clinically, though, rather than categorically dismissing hypothyroidism. Likewise, malnutrition may cause a transaminase rise, but abnormal LFTs should not automatically be attributed to starvation; investigate according to the pattern and severity."}
     ]},

    {id:"ladder", nav:"Treat", title:"Treatment — refer, then support",
     sub:"Specialist services deliver the treatment. Your job is to get them there fast and keep them physically safe.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Step 1", title:"Refer to the eating disorders service — immediately", when:"an eating disorder is suspected — whatever the SCOFF or BMI",
          html:"<b>Refer immediately to the age-appropriate eating-disorder service (CEDS) when an eating disorder is suspected, regardless of BMI, SCOFF score or perceived readiness.</b> Make it urgent and arrange same-day medical assessment for physical compromise, rapid weight loss, severe restriction, significant purging, suicidality, dehydration, electrolyte disturbance, ECG abnormality or concern about refeeding. Include current and previous weight, rate of loss, intake, purging and exercise, observations, ECG, blood results, mental-health and safeguarding risk, and relevant conditions and medication. NICE NG69: do not delay referral because of waiting lists or because the patient does not seem ready — refer and manage in parallel. Under-18s: the local CAMHS eating-disorder urgent pathway — the NHS access standard (assessment and treatment) is 1 week for urgent and 4 weeks for routine, so specify \u201curgent\u201d if there is any physical compromise or rapid weight loss. Medically unstable patients need immediate acute medical assessment and should not wait for an outpatient appointment. Where medical stabilisation or refeeding cannot be safely delivered outside hospital → joint CEDS and acute medical management."},
         {step:"Step 2", title:"Psychological therapy — the actual treatment", when:"delivered by the specialist service",
          fromLabel:"referral accepted",
          html:"Anorexia nervosa in adults: individual eating-disorder-focused CBT (CBT-ED), MANTRA, or specialist supportive clinical management (SSCM). Children and young people: family therapy (FT-AN / family-based treatment). <b>Bulimia nervosa: CBT-ED, or guided self-help first for adults.</b> <b>Binge eating disorder: guided self-help, then CBT-ED.</b> Know what has been offered so you can support engagement."},
         {step:"Step 3", title:"Medication — adjunct only, and never the primary treatment", when:"specialist-led",
          fromLabel:"therapy underway",
          html:"<b>There is no drug treatment for anorexia nervosa itself.</b> Medication is not a sole treatment for anorexia nervosa, bulimia nervosa or binge eating disorder (NG69). <b>Do not initiate medication specifically to treat anorexia nervosa in primary care without specialist advice.</b> Olanzapine for anorexia nervosa is specialist-led and off-label, with limited evidence and an individual benefit-risk decision (metabolic, sedation, orthostatic, anticholinergic and cardiac risks). Antidepressants or other psychotropics may be considered for comorbid conditions or selected specialist indications — coordinate with the eating-disorder/psychiatric team, and account for malnutrition, electrolyte disturbance, QTc, sedation, orthostasis, overdose toxicity, interactions and the capacity to absorb oral medication. Do not choose an antidepressant for appetite stimulation. Treat comorbid depression and anxiety on their own merits — PHQ-9 and NHS Talking Therapies or psychiatry."},
         {step:"Step 4", title:"Nutritional support and refeeding", when:"severe malnutrition",
          fromLabel:"specialist-supervised",
          html:"<b>Do not independently prescribe a refeeding schedule in primary care.</b> Arrange specialist medical/dietetic management using the local MEED-based protocol (MEED 2022 cautions against underfeeding in eating disorders), with thiamine and electrolyte replacement and monitoring at a frequency determined by clinical risk. Nasogastric feeding may be required — specialist eating-disorder services may manage it in appropriate settings, not only on a medical ward — and in extreme cases with impaired capacity, under the Mental Health Act. <b>Enteral, nasogastric and any parenteral nutrition should be initiated and supervised by appropriately trained specialist teams using a documented protocol</b>; primary care coordinates, monitors agreed parameters and escalates deterioration. Dietitian input throughout."},
         {step:"Step 5", title:"Practical and social support", when:"alongside treatment",
          fromLabel:"often forgotten",
          html:"Fit note, and help with PIP or ESA where the illness affects capacity to work. <b>Signpost Beat, the UK eating disorder charity.</b> <b>Involve family and carers with the patient's consent</b>, and offer them support in their own right."}
       ]},
       {b:"warn", html:"<b>How to talk about it matters clinically.</b> Keep conversations <b>non-judgemental and recovery-focused</b>. Avoid food policing, meal-by-meal monitoring and power struggles — in anorexia nervosa these reinforce the disorder. Something like <em>\u201cI can see this is very difficult for you. I want to help you get the support you need\u201d</em> does more than a negotiation about calories. Practical mealtime support — <b>structured mealtimes, eating with family, distraction afterwards</b> — belongs with the family, not with you."}
     ]},

    {id:"monitor", nav:"GP role", title:"The GP's role — monitoring, coordination, and the long view",
     sub:"Eating disorders are chronic and relapsing. This is shared care: the specialist service also holds responsibilities for physical monitoring, nutritional rehabilitation, risk management and coordination, while primary care holds continuity.",
     blocks:[
       {b:"table", head:["What","When","Detail"], rows:[
         ["<b>Physical and mental-health review</b>","<b>Each relevant review</b>","Current intake, weight trajectory, purging/exercise, pulse, BP including postural symptoms where indicated, mental-health risk and new physical symptoms. Use the full MEED framework whenever there is deterioration or concern about medical compromise"],
         ["<b>Bloods</b>","<b>According to current risk and the agreed specialist plan</b>","<b>Electrolytes with phosphate and magnesium, glucose, FBC</b> — frequency reflects intake and weight trajectory, purging, electrolyte abnormality, refeeding stage, medication, comorbidity and the specialist plan"],
         ["<b>ECG</b>","<b>According to clinical risk and the specialist plan</b>","<b>QTc and rate</b> — repeat for significant weight loss, bradycardia, hypotension, purging, electrolyte disturbance, relevant medication, cardiac symptoms or a previous abnormal ECG"],
         ["<b>Annual review</b>","<b>At least annually</b>","Physical and mental-health review for people with anorexia nervosa not receiving ongoing specialist treatment (NG69)"],
         ["<b>Coordination</b>","Ongoing","Shared care with CEDS: keep the patient engaged, manage comorbidity, monitor medicines and QT risk, support carers, review relapse and escalation plans, ensure adequate medical review after discharge, and avoid weight-loss messaging in binge eating disorder"],
         ["<b>Scope</b>","Always","Do not act as the eating disorder therapist — maintain the therapeutic relationship and direct specialist treatment to CEDS"],
         ["<b>Continuity</b>","Long term","Do NOT discharge from GP care — eating disorders are chronic, relapsing conditions requiring long-term GP support"],
         ["<b>Bone health</b>","Risk-directed","Bone-health assessment and DEXA according to duration of illness, low weight, amenorrhoea or hypogonadism, fracture history and specialist advice; weight restoration and treatment of the eating disorder are central to bone health"]
       ]},
       {b:"cards", items:[
         {tone:"amber", h:"🔁 Not improving? Work through this before escalating the dose of anything", html:"<b>1 Physical risk re-scored?</b> Pulse, postural BP, ECG, electrolytes, SUSS — MEED parameters can be met at any weight. <b>2 Actually in treatment?</b> Referral made, appointment attended, therapy started — or has the patient quietly disengaged? <b>3 Right diagnosis?</b> Consider <b>atypical anorexia, ARFID and insulin omission in type 1 diabetes</b>, and reconsider an organic cause if the picture is appetite loss rather than restriction. <b>4 Comorbidity?</b> Depression, anxiety, OCD, autism and substance use all obstruct recovery and are treatable. <b>5 Refeeding risk</b> re-assessed before any intake increase. <b>6 Escalate</b> — back to CEDS, and urgent senior discussion with the eating-disorder and acute medical teams if MEED red or amber parameters are present."}
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 Same-day / 999", html:"\u201cSeek urgent same-day medical assessment for fainting, chest pain, palpitations, severe weakness, inability to keep fluids down, severe dehydration or a very slow pulse. Call 999 for collapse, severe chest symptoms, altered consciousness, severe breathlessness or suspected life-threatening arrhythmia.\u201d Also a new severe electrolyte abnormality on bloods."},
         {tone:"amber", h:"🟠 Same week", html:"<b>Accelerating weight loss (≥1 kg a week) despite treatment</b>, or new or worsening low mood. Suicidal thoughts with intent or plan, or self-harm → same-day or emergency assessment."},
         {tone:"blue", h:"🔄 Relapse is expected, not failure", html:"\u201cSetbacks are part of this. Coming back early when it slips is the thing that keeps you safe.\u201d"},
         {tone:"green", h:"📘 Support", html:"<b>Beat</b> for patients and families. Involve family with consent, and offer carers support in their own right."}
       ]},
       {b:"say", html:"Thank you for telling me — that took something. I want to be clear about two things. First, I am going to refer you to the specialist eating disorders team today; I am not going to wait until you feel ready, because getting help early genuinely changes the outcome. Second, what I do here is different from what they do. They do the therapy. I check that your body is safe — your weight, your pulse, your blood pressure standing up, a heart tracing and some blood tests — and I stay your GP through all of it. I am not going to police your eating or weigh you into an argument. If your heart rate drops or the bloods change, that is when I would need to act quickly, and I will explain why at the time."}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Emergency / same-day medical assessment", html:"Collapse or syncope; chest pain, arrhythmia or severe palpitations; severe bradycardia; significant hypotension or postural instability; severe dehydration; severe electrolyte abnormality or hypoglycaemia; prolonged QTc or other important ECG abnormality; severe weakness or inability to mobilise; acute food/fluid refusal; <b>developing refeeding syndrome</b>; significant suicide risk or self-harm; DKA or insulin omission. Use MEED and local acute pathways — one red or two or more amber parameters → urgent senior discussion; BMI alone does not decide admission. Do not wait for the eating-disorder service when medical stabilisation is required."},
         {tone:"amber", h:"Eating disorders service — urgent", html:"Refer immediately to the age-appropriate eating-disorder service when an eating disorder is suspected, whether or not SCOFF is positive. Make it urgent, with same-day medical assessment, for physical compromise, rapid weight loss, severe restriction, significant purging, suicidality, dehydration, electrolyte disturbance, ECG abnormality or refeeding concern. Use the local Bolton/Greater Manchester eating-disorder referral and medical escalation pathway. <b>Do not delay for waiting lists or readiness (NG69).</b>"},
         {tone:"amber", h:"CAMHS eating disorders — under 18s", html:"Use the local CAMHS eating-disorder urgent pathway. The NHS access standard is assessment and treatment within 1 week for urgent cases and within 4 weeks for routine cases, but medically unstable patients require immediate acute medical assessment and should not wait for an outpatient appointment."},
         {tone:"blue", h:"Psychiatry / NHS Talking Therapies", html:"Comorbid depression: PHQ-9 ≥10 → NHS Talking Therapies for mild to moderate, psychiatry for severe, including psychotic depression. Anxiety-related food avoidance: CBT. ARFID (outside NG69): the local specialist ARFID pathway — an emerging service, with adult feeding difficulties teams at some centres."},
         {tone:"green", h:"Dietitian", html:"<b>Nutritional support and refeeding protocol supervision</b>, alongside the specialist team."},
         {tone:"cream", h:"Stays with the GP", html:"Shared care: agreed physical and mental-health monitoring, medicines and QT-risk safety, comorbidity, the therapeutic relationship, carer support, relapse and escalation plans, review after discharge, and continuity through relapse. Not the therapy itself, and not a standalone refeeding plan."}
       ]},
       {b:"why", html:"NG69 contains a specific instruction that GPs must not delay referral while waiting for a patient to become \u201cready\u201d, and it exists because early intervention in anorexia nervosa produces significantly higher rates of full recovery and lower mortality than delayed treatment. Anorexia nervosa is associated with substantial excess mortality, including from medical complications and suicide, so do not delay referral. Make the referral on identification, and continue primary care support, physical monitoring and engagement in parallel."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 19-year-old student attends about dizziness on standing and feeling cold all the time. Her BMI is 17.8 — down from 21 last year. She says she has \u201cjust been eating healthily and running a lot\u201d, is warm in a heavy jumper on a mild day, and becomes uncomfortable when you ask to weigh her."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Asks SCOFF sensitively as an adjunct rather than accepting the healthy-eating account; takes lying and standing BP, pulse and temperature and arranges an ECG and electrolytes with phosphate and magnesium; assesses physical risk using MEED as an aid to clinical judgement and does not let a BMI of 17.8 reassure; asks about self-harm and suicide; <b>refers to CEDS the same day without waiting for readiness</b>; considers <b>refeeding risk before advising her to eat more</b>; explores compensatory exercise; and \u2014 the step candidates miss \u2014 states explicitly what the GP role is and is not, so the relationship survives the treatment."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>NICE NG69 — Eating disorders: recognition and treatment (2017, updated 2020)<br><a href="https://www.nice.org.uk/guidance/ng69/chapter/Recommendations" rel="noopener">nice.org.uk/guidance/ng69/chapter/Recommendations</a><span class="rd"> — refer immediately on suspicion, SCOFF and BMI not to be used alone, no absolute weight or BMI admission threshold, risk-based ECG monitoring, at least annual review in anorexia nervosa without ongoing specialist care, the psychological therapies for each disorder (CBT-ED, MANTRA, SSCM, family therapy), and medication not to be offered as the sole treatment. <a href="https://www.nice.org.uk/guidance/ng69/chapter/Context" rel="noopener">NG69 does not cover ARFID, pica or rumination disorder</a>. <b>NG69 replaced the earlier CG9 (2004)</b>; a source referring to \u201cCG9 (2017)\u201d is conflating the two — NG69 is the 2017 guideline</span></li>'+
         '<li>MEED 2022 — Medical Emergencies in Eating Disorders: guidance on recognition and management (Royal College of Psychiatrists, CR233)<br><a href="https://www.rcpsych.ac.uk/improving-care/campaigning-for-better-mental-health-policy/college-reports/2022-college-reports/cr233" rel="noopener">rcpsych.ac.uk — CR233</a><span class="rd"> — the red/amber physical risk parameters used as an aid to clinical judgement (not an automatic admission algorithm), the SUSS test, and specialist-led refeeding; <b>MEED replaces the earlier MARSIPAN guidance</b>, and the two names refer to successive versions of the same framework</span></li>'+
         '<li>NICE CG32 — Nutrition support in adults (2006, updated 2017), and BAPEN refeeding guidance (2018)<br><a href="https://www.nice.org.uk/guidance/cg32/chapter/Recommendations" rel="noopener">nice.org.uk/guidance/cg32/chapter/Recommendations</a><span class="rd"> — general (not eating-disorder-specific) nutrition support: refeeding syndrome risk criteria, the 10 kcal/kg/day maximum starting rate (5 kcal/kg/day in extreme cases) increasing over 4–7 days, thiamine 200–300 mg daily before and during the first 10 days, and risk-based electrolyte monitoring</span></li>'+
         '<li><b>Morgan JF, Reid F, Lacey JH. The SCOFF questionnaire: assessment of a new screening tool for eating disorders. BMJ 1999;319:1467</b><br><a href="https://www.bmj.com/content/319/7223/1467" rel="noopener">bmj.com/content/319/7223/1467</a><span class="rd"> — the five questions, the threshold of 2 or more, and 100% sensitivity / 87.5% specificity in the original small sample</span></li>'+
         '<li><b>Eating disorder screening: a systematic review and meta-analysis</b><br><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7080881/" rel="noopener">pmc.ncbi.nlm.nih.gov/articles/PMC7080881</a><span class="rd"> — pooled SCOFF performance (approximately 86% sensitivity, 83% specificity) and limits to generalisability</span></li>'+
         '<li><b>DSM-5</b><span class="rd"> — the diagnostic criteria for anorexia nervosa, atypical anorexia nervosa, bulimia nervosa, binge eating disorder and ARFID</span></li>'+
         '<li>NHS England — access and waiting time standard for children and young people with an eating disorder<br><a href="https://www.england.nhs.uk/mental-health/cyp/eating-disorders/" rel="noopener">england.nhs.uk/mental-health/cyp/eating-disorders</a><span class="rd"> — assessment and treatment within 1 week for urgent and 4 weeks for routine referrals; never a reason to delay acute medical assessment</span></li>'+
         '<li><b>SPS — Prescribing and using thiamine to prevent refeeding syndrome</b><br><a href="https://www.sps.nhs.uk/articles/prescribing-and-using-thiamine-to-prevent-refeeding-syndrome/" rel="noopener">sps.nhs.uk</a><span class="rd"> — thiamine route and dose set by severity and local policy</span></li>'+
         '<li><b>Local Bolton / Greater Manchester eating-disorder referral and medical escalation pathway</b><span class="rd"> — the local adult CEDS and CAMHS eating-disorder routes and acute medical escalation; confirm locally before use</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — medicines safety checks (QTc, interactions, overdose toxicity) for any specialist-advised prescribing</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Eating disorders — NICE NG69, MEED 2022 (Royal College of Psychiatrists, replacing MARSIPAN), NICE CG32 and BAPEN refeeding guidance, SCOFF and DSM-5. Eating disorders can be medically dangerous at any weight: refer promptly, assess physical risk using MEED as an aid to clinical judgement, and do not wait for the patient to be ready. Loss of appetite as a symptom — including its cancer, endocrine and drug-related differential — is covered by the <a href=\"../algorithms/anorexia.html\">appetite loss and nutritional assessment pathway</a>. Verify all doses against the current BNF before prescribing."
});
