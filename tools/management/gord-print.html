  lead:"<div class='mg-layers'><a href='#severe'><b>Alarm first</b><small>Dysphagia = OGD, any age</small></a><a href='#confirm'><b>Diagnose clinically</b><small>No OGD if uncomplicated</small></a><a href='#ladder'><b>Treat</b><small>Full dose, right timing</small></a><a href='#stepdown'><b>Step down</b><small>Lowest effective dose</small></a></div>",
  quickSub:"If you read nothing else on this page, read these six cards. Every number traces to the source cited under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Dysphagia is a suspected cancer referral, at any age — never a stronger PPI", html:"NICE NG12 (updated April 2026): refer anyone with dysphagia — at any age — using a suspected cancer pathway referral for oesophageal or stomach cancer (this replaced urgent direct-access endoscopy in 2025). Also aged 55 and over (≥55) with weight loss plus any of upper abdominal pain, reflux or dyspepsia. <b>Never attribute new dysphagia to reflux.</b> Oesophageal adenocarcinoma incidence has risen sharply in the UK and reflux is its principal risk factor, so a longstanding GORD label is exactly the cognitive anchor that hides it.", src:"NG12"},
    {tone:"red", h:"Never let a PPI trial delay the endoscopy", html:"<b>Do not delay suspected-cancer referral or endoscopy to trial or withdraw a PPI.</b> Tell the endoscopy service what the patient is taking; the endoscopy team will decide whether any medication adjustment is needed for the planned examination or biopsies. NICE CG184 does not recommend a routine PPI washout before OGD. <b>Stop PPIs for 2 weeks before a urea breath test or stool antigen test for H. pylori</b> (a PPI causes false negatives); antibiotics should also be avoided for the appropriate period before testing according to local laboratory guidance (NICE CG184). Haematemesis, melaena, coffee-ground vomiting, syncope or haemodynamic instability → same-day emergency assessment, not routine direct-access referral."},
    {tone:"amber", h:"Typical reflux needs no endoscopy — it needs the right timing", html:"A confident clinical diagnosis is made on <b>typical heartburn and acid regurgitation</b> once alarm features are excluded. Full-dose PPI for 4 or 8 weeks for typical GORD (4 weeks for uninvestigated dyspepsia; 8 weeks for severe erosive oesophagitis): for example omeprazole 20 mg OD or lansoprazole 30 mg OD (omeprazole 40 mg is a higher dose, used according to indication and response), taken 30–60 minutes BEFORE breakfast. If prescribed twice daily, take before breakfast and before the evening meal — check the specific product instructions. PPIs need a meal to activate proton pumps — <b>wrong timing is the commonest cause of apparent “PPI failure”</b>, and checking it comes before any dose increase.", src:"NICE CG184"},
    {tone:"blue", h:"Set the step-down goal at the first prescription", html:"The commonest GORD failure is not misdiagnosis — it is the patient left on full-dose PPI for a decade with no review. <b>Say “this is a course, and then we reduce” at the FIRST prescription.</b> The target for most uncomplicated GORD is the <b>lowest effective dose or on-demand use</b>, and <b>every repeat is a step-down opportunity</b>."},
    {tone:"green", h:"Plan the step-down together — and warn about rebound symptoms", html:"When there is no continuing indication, step down the PPI to the lowest effective dose and consider intermittent or on-demand use. <b>Stopping may be abrupt or gradual</b> depending on dose, duration, patient preference and previous rebound symptoms. Warn that transient upper-GI symptoms may occur after stopping — rebound symptoms are usually transient, but duration and severity vary and they may overlap with recurrence of the underlying condition — and offer an alginate or antacid bridge."},
    {tone:"amber", h:"Some patients usually need continued PPI", html:"Severe erosive oesophagitis (Los Angeles grade C or D) or a documented stricture may need maintenance PPI at the lowest effective dose. <b>Do not routinely deprescribe a PPI in confirmed Barrett’s oesophagus without discussing the indication with gastroenterology or reviewing the specialist plan</b>, and ensure the patient remains within the NICE NG231 surveillance pathway (fewer than 1% progress to adenocarcinoma each year; risk varies with segment length, intestinal metaplasia and dysplasia). Continue NSAID/antiplatelet gastroprotection when the indication and GI-risk assessment justify it."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step is where patients come to harm — do not skip it.",
  pathway:[
    {title:"Screen the NG12 alarm features", html:"Dysphagia at any age · aged 55+ with weight loss plus upper abdominal pain, reflux or dyspepsia · haematemesis, melaena, coffee-ground vomiting, syncope or haemodynamic instability (same-day emergency assessment) · epigastric or left supraclavicular mass · unexplained iron-deficiency anaemia (investigate via the upper- and lower-GI pathways) · persistent unexplained vomiting or early satiety (assess for obstruction, gastroparesis, malignancy and other causes; apply NG12 where criteria are met). Any of these changes the destination before any treatment starts, and <b>a PPI trial must not delay the referral</b> — if a PPI is started, tell the endoscopy service.", alert:true},
    {title:"Make the diagnosis clinically", html:"Typical <b>heartburn</b> (retrosternal burning, worse lying flat, bending or after meals) and <b>acid regurgitation</b>, with relief from antacids. <b>Exclude cardiac pain first in anyone with cardiac risk</b> — exertional pain, radiation to jaw or arm, breathlessness or diaphoresis is assessed as possible ACS, not anchored as reflux. <b>No OGD is needed for typical uncomplicated symptoms.</b>"},
    {title:"Review the drugs and the drivers", html:"NSAIDs, aspirin, bisphosphonates, calcium-channel blockers, nitrates, theophylline, doxycycline and anticholinergics either relax the lower oesophageal sphincter or injure the mucosa. Review potentially aggravating medicines and correct administration technique (bisphosphonates, doxycycline); stop or switch only where clinically safe — calcium-channel blockers, nitrates, aspirin and anticholinergics may be clinically essential — otherwise continue with appropriate gastroprotection or specialist advice. Then obesity, late or large meals, alcohol, caffeine, smoking, trigger foods and tight clothing."},
    {title:"Treat: lifestyle plus a full-dose PPI, timed correctly", html:"Full-dose PPI for 4 or 8 weeks for GORD (4 weeks for uninvestigated dyspepsia; 8 weeks at full dose for severe erosive oesophagitis), 30–60 minutes before breakfast (if twice daily, before breakfast and before the evening meal), alongside lifestyle measures. Test-and-treat H. pylori where dyspepsia or ulcer-type symptoms overlap. Add an <b>alginate-containing antacid</b> (prescribed or purchased according to local formulary and patient preference) for breakthrough, post-prandial or nocturnal symptoms."},
    {title:"Review at 4–8 weeks and step down", html:"Controlled → step down to the lowest effective dose or on-demand use (gradually or abruptly, by shared decision), warning about transient rebound symptoms. Partial → check timing and adherence first, then BD dosing or switch PPI. Refractory → review the diagnosis and adherence, then refer to gastroenterology (OGD, ambulatory pH/impedance monitoring). <b>Review every long-term PPI at least annually.</b>"}
  ],
  sections:[
    {id:"confirm", nav:"Confirm", title:"Confirming the diagnosis — is this reflux?", sub:"A clinical diagnosis of GORD can be made from a typical history without investigation, provided there are no alarm features.",
     blocks:[
       {b:"table", head:["Feature","What she or he describes","Note"], rows:[
         ["<b>Cardinal symptoms</b>","<b>Heartburn</b> — retrosternal burning, worse lying flat, bending forward or after meals — and <b>acid regurgitation</b>","<b>Relief with antacids supports the diagnosis.</b> A PPI response supports it too but is not diagnostic"],
         ["<b>Atypical / extra-oesophageal</b>","Chronic cough, nocturnal cough, hoarseness, globus, dental erosions, non-cardiac chest pain, worsening asthma","Do not diagnose laryngopharyngeal reflux from throat symptoms alone — assess for ENT, respiratory, allergic and medication-related causes; see <a href='#special'>Special groups</a>"],
         ["<b>Cardiac pain must be excluded</b>","Exertional retrosternal pain, radiation to jaw or arm, breathlessness, diaphoresis","Assess as possible ACS first. Do not anchor on “reflux” in a cardiac-risk patient — this is a frequently tested safety point"],
         ["<b>The spectrum</b>","Intermittent reflux → <b>erosive oesophagitis</b> → <b>Barrett’s oesophagus</b>","<b>LPR and functional heartburn behave differently.</b> Severe erosive disease needs 8 weeks at full dose; Barrett’s usually needs continued PPI per the specialist plan and NICE NG231 surveillance"],
         ["<b>Lifestyle drivers</b>","<b>Obesity</b>, late or large meals, alcohol, caffeine, smoking, trigger foods, <b>tight clothing</b>","<b>Central obesity is the dominant modifiable driver</b> and weight loss is first-line therapy"],
         ["<b>Medication review</b>","NSAIDs, aspirin, bisphosphonates, calcium-channel blockers, nitrates, theophylline, doxycycline, anticholinergics","They relax the lower oesophageal sphincter or injure the mucosa directly — <b>review and correct administration technique; stop or switch only where clinically safe</b>, otherwise continue with appropriate gastroprotection or specialist advice"],
         ["<b>Pregnancy</b>","<b>Very common in the third trimester</b>","Lifestyle and alginates first, then omeprazole if acid suppression is needed. Usually resolves postpartum"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"cream", h:"🎯 Set the goal at the first prescription", html:"Control symptoms and heal any oesophagitis on the lowest effective long-term acid suppression — NOT indefinite full-dose PPI by default. Saying <b>“this is a course, then we reduce”</b> at the first consultation is what prevents the ten-year repeat prescription. It costs one sentence and it is the single highest-yield thing on this page."},
         {tone:"blue", h:"🩺 What a clinical diagnosis does not need", html:"<b>No routine endoscopy for typical uncomplicated reflux</b> (NICE CG184 and NG12 reserve OGD for alarm features or treatment failure), <b>no routine pH study or manometry</b> — those are specialist tests before anti-reflux surgery or where the diagnosis remains uncertain after OGD. Investigate only where the result changes management."}
       ]},
       {b:"why", html:"A clinical diagnosis can be made on typical symptoms without further testing in the absence of alarm features, and routine endoscopy for typical reflux is low-yield. Distinguishing reflux from cardiac chest pain is the safety point examiners test — and the commonest GORD pitfall in practice is not the diagnosis at all, but the patient left on a full-dose PPI indefinitely with no review."}
     ]},

    {id:"exam", nav:"Examination", title:"Targeted examination", sub:"Examination is usually normal in uncomplicated GORD. Its purpose is to exclude the complications and the mimics — not to confirm reflux.",
     blocks:[
       {b:"table", head:["Look for","Finding","Changes what"], rows:[
         ["<b>BMI / weight</b>","<b>Central obesity</b>; document the weight and BMI","<b>The dominant modifiable driver — weight loss is first-line therapy</b>, so this is a treatment measurement, not a formality"],
         ["<b>Abdomen</b>","<b>Epigastric tenderness is common and non-specific.</b> Palpate specifically for a <b>hard epigastric mass</b> and for <b>hepatomegaly</b>","An epigastric mass consistent with stomach cancer → consider a suspected cancer pathway referral (NG12). Hepatomegaly → urgent investigation"],
         ["<b>Lymph nodes</b>","<b>Left supraclavicular node — Virchow’s node / Troisier’s sign</b>","<b>Gastric cancer metastasis → urgent upper GI referral.</b> It takes five seconds to feel for and it is the finding that changes everything"],
         ["<b>Cardio-respiratory</b>","Exclude a cardiac cause of the chest pain; <b>auscultate if aspiration is suspected</b>","Cardiac assessment takes priority in anyone with cardiac risk factors or exertional symptoms"],
         ["<b>Mouth and dentition</b>","<b>Dental erosions and water brash</b>","<b>Support chronic acid exposure</b> — useful corroboration where the history is atypical, and worth a dental referral"]
       ]},
       {b:"why", html:"The examination in GORD is predominantly a screen for complications and mimics — gastric malignancy, aspiration and cardiac disease. A normal examination supports empirical therapy in a patient without alarm features, which is what makes it worth doing before you prescribe."}
     ]},

    {id:"severe", nav:"Alarm features", title:"Alarm features — exclude upper GI cancer and bleeding first", sub:"Reflux is common, but the examiner — and the coroner — is interested in the malignancy and the bleed hiding inside it. Screen every patient against NG12 before treating empirically.",
     blocks:[
       {b:"warn", html:"<b>Never let a PPI trial delay the endoscopy.</b> <b>Do not delay suspected-cancer referral or endoscopy to trial or withdraw a PPI. Tell the endoscopy service what the patient is taking</b>; the endoscopy team will decide whether any medication adjustment is needed for the planned examination or biopsies. Review NSAIDs as well. Stop PPIs for 2 weeks before a urea breath test or stool antigen test for <b>H. pylori</b>, and avoid antibiotics for the appropriate period before testing according to local laboratory guidance (NICE CG184). If EoE is suspected, document PPI exposure on the referral and endoscopy request; specialist advice may be needed regarding PPI withdrawal before repeat biopsies, but this must not delay urgent assessment of dysphagia or food bolus obstruction."},
       {b:"cards", items:[
         {tone:"red", h:"🔴 Dysphagia — ANY age", html:"Difficulty swallowing solids or liquids, or food sticking. NICE NG12 (updated April 2026): refer people with dysphagia using a suspected cancer pathway referral for oesophageal or stomach cancer — with no age threshold at all. <b>Never attribute new dysphagia to reflux</b>, and never respond to it with a higher PPI dose.", src:"NG12"},
         {tone:"red", h:"🔴 Aged 55+ with weight loss", html:"Weight loss PLUS any of upper abdominal pain, reflux or dyspepsia, aged 55 and over (≥55) → suspected cancer pathway referral for oesophageal or stomach cancer (NICE NG12 (updated April 2026)). All three of those symptoms are the ones reflux patients present with, which is precisely why the age-plus-weight-loss combination has to be asked about deliberately.", src:"NG12"},
         {tone:"red", h:"🔴 GI bleeding", html:"Haematemesis, melaena, coffee-ground vomiting, syncope or haemodynamic instability requires same-day emergency assessment (999 if unstable) and not routine direct-access referral. <b>NG12 also lists haematemesis for non-urgent direct-access endoscopy</b> — but a patient who is actively bleeding or haemodynamically unstable is an emergency admission, not a referral form."},
         {tone:"amber", h:"🟠 Epigastric mass / Troisier’s sign", html:"A palpable upper abdominal mass consistent with stomach cancer → consider a suspected cancer pathway referral (NG12). A left supraclavicular node (Virchow / Troisier) suggests gastric cancer metastasis → urgent upper GI referral.", src:"NG12"},
         {tone:"amber", h:"🟠 Iron-deficiency anaemia", html:"Unexplained iron-deficiency anaemia requires investigation according to the relevant upper- and lower-GI pathways. Do not attribute it to uncomplicated reflux. The precise NG12 route is: aged 55 and over with upper abdominal pain plus low haemoglobin → consider non-urgent direct-access upper GI endoscopy. The legacy pathway called this a straight 2WW; <b>unexplained IDA also needs a lower-GI assessment in its own right</b> — see <a href='iron-deficiency-anaemia.html'>iron-deficiency anaemia</a>. Either way it is investigated, never absorbed into the reflux label.", src:"NG12"},
         {tone:"amber", h:"🟠 Persistent vomiting or early satiety", html:"Persistent unexplained early satiety or vomiting warrants assessment for obstruction, gastroparesis, malignancy and other causes; apply NG12 criteria where present. NG12 lists, for people aged 55 and over, nausea or vomiting with any of weight loss, reflux, dyspepsia or upper abdominal pain among the criteria for considering direct-access endoscopy."},
         {tone:"purple", h:"Also consider routine OGD <span class='tw'>NG12</span>", html:"<b>Aged 55 and over with treatment-resistant dyspepsia</b>, or <b>upper abdominal pain with low haemoglobin</b>, or a raised platelet count with any of nausea, vomiting, weight loss, reflux, dyspepsia or upper abdominal pain → <b>consider non-urgent direct-access upper GI endoscopy (NG12)</b>. Think earlier than 55 in people aged &gt;40 with a family history of gastro-oesophageal cancer, or from a higher-risk ethnic background.", src:"NG12"}
       ]},
       {b:"why", html:"NICE NG12 (updated April 2026) mandates a suspected cancer pathway referral for dysphagia at any age, and for patients aged 55 and over with weight loss plus upper abdominal pain, reflux or dyspepsia. Oesophageal adenocarcinoma incidence has risen sharply in the UK and reflux is its principal risk factor — verbalise these thresholds rather than reflexively prescribing a PPI. A longstanding GORD label must never become a cognitive anchor: new dysphagia or weight loss in a known refluxer demands re-triage against NG12."}
     ]},

    {id:"workup", nav:"Work-up", title:"Work-up — only what changes management", sub:"Uncomplicated GORD needs NO investigation. Test the right patients for the right reasons.",
     blocks:[
       {b:"table", head:["Test","When","What it gives you"], rows:[
         ["<b>H. pylori test</b> — urea breath test or stool antigen","<b>Where dyspepsia or ulcer-type symptoms overlap</b>; test-and-treat in uninvestigated dyspepsia","<b>Stop the PPI 2 weeks before testing — a PPI causes false negatives</b>; avoid antibiotics for the appropriate period per local laboratory guidance. Positive → eradication (see the <a href='#ladder'>ladder</a>); <b>confirm eradication with a carbon-13 urea breath test where required</b> — particularly after peptic ulcer disease, treatment failure or where confirmation will change management"],
         ["<b>OGD</b>","<b>NG12 alarm features, or refractory symptoms after an optimised PPI</b>","Grades the oesophagitis (Los Angeles A–D), and diagnoses stricture and Barrett’s. Tell the endoscopy service about any PPI — the endoscopy team decides whether any medication adjustment is needed; there is no routine PPI washout before OGD"],
         ["<b>Barrett’s surveillance</b>","<b>Confirmed Barrett’s at OGD</b>","Endoscopic surveillance per NICE NG231: long-segment (≥3 cm) every 2–3 years; short-segment (&lt;3 cm) with intestinal metaplasia every 3–5 years; no routine surveillance for short-segment Barrett’s without intestinal metaplasia after confirmation at two endoscopies. Premalignant — counsel and ensure enrolment"],
         ["<b>FBC</b>","Anaemia suspected, or as part of the alarm-feature work-up","<b>Unexplained iron-deficiency anaemia → investigate via the upper- and lower-GI pathways</b>; a <b>raised platelet count</b> is itself an NG12 “consider endoscopy” trigger aged 55+"],
         ["<b>24-hour pH study / manometry</b>","<b>Before anti-reflux surgery</b>, or where the diagnosis is uncertain after OGD","<b>Specialist tests, not primary care.</b> Reflux monitoring is generally performed off PPI where pathological GORD has not previously been demonstrated, and may be performed on PPI where GORD is proven and symptoms persist despite twice-daily treatment; manometry before surgery or where a motility disorder is suspected (BSG). Also used to define <b>functional heartburn</b> (typical symptoms, normal OGD and normal reflux monitoring)"],
         ["<b>Coeliac serology · abdominal ultrasound</b>","Coeliac serology where there is IBS overlap; ultrasound if epigastric pain has been present for under a year (&lt;1 year) (possible biliary cause)","Both belong to the functional-dyspepsia work-up rather than to reflux itself"],
         ["<b>Do NOT order</b>","—","<b>Routine OGD for typical reflux without alarm features</b>; routine pH studies or manometry from primary care; a barium swallow in place of endoscopy"]
       ]},
       {b:"cards", items:[
         {tone:"purple", h:"NG12 suspected cancer pathway and direct-access slot <span class='tw'>Suspected cancer</span>", html:"Refer people with dysphagia at any age, or aged 55 and over with weight loss plus any of upper abdominal pain, reflux or dyspepsia, using a suspected cancer pathway referral for oesophageal or stomach cancer (NICE NG12 (updated April 2026); this replaced urgent direct-access endoscopy). Consider a suspected cancer pathway referral for an upper abdominal mass consistent with stomach cancer. Consider non-urgent direct-access endoscopy for haematemesis, and for people aged 55 and over with treatment-resistant dyspepsia, upper abdominal pain with low haemoglobin, a raised platelet count with any of nausea, vomiting, weight loss, reflux, dyspepsia or upper abdominal pain, or nausea or vomiting with any of weight loss, reflux, dyspepsia or upper abdominal pain. Restated with the same thresholds under <a href='#refer'>Refer</a>.", src:"NICE NG12 (updated April 2026), mandatory per house rules"}
       ]},
       {b:"why", html:"Routine endoscopy for typical reflux without alarm features is low-yield, and NICE CG184 with NG12 reserves OGD for alarm features or treatment failure. Fewer than 1% of people with Barrett’s oesophagus progress to adenocarcinoma each year — risk varies with segment length, intestinal metaplasia and dysplasia (NICE NG231) — and it warrants structured surveillance — which is the reason a refractory refluxer gets endoscoped rather than escalated indefinitely."}
     ]},

    {id:"treat", nav:"Who to treat", title:"Who gets what", sub:"Almost everyone gets lifestyle measures plus a time-limited full-dose PPI. The decisions that matter are who needs eradication, who needs 8 weeks, and who must not be stopped.",
     blocks:[
       {b:"dl", rows:[
         ["<b>Typical uncomplicated reflux</b>","<b>Lifestyle measures plus a full-dose PPI for 4 or 8 weeks, then step down.</b> No investigation, no endoscopy. Managed entirely in primary care"],
         ["<b>Mild or intermittent symptoms</b>","<b>Alginate or antacid PRN</b> (an alginate-containing antacid, prescribed or purchased according to local formulary and patient preference, after meals and at bedtime) plus lifestyle — a PPI course is not obligatory for everyone"],
         ["<b>Erosive oesophagitis at OGD</b>","<b>8 weeks at full dose</b> to heal it, then the lowest effective maintenance dose. <b>Severe erosive oesophagitis (LA grade C or D) or stricture: maintenance treatment may be required</b>"],
         ["<b>Dyspepsia or ulcer-type overlap</b>","<b>H. pylori test-and-treat</b> — urea breath test or stool antigen off PPI for 2 weeks, then eradication therapy if positive; empirical full-dose PPI for 4 weeks for uninvestigated dyspepsia. <b>Do not offer eradication for GORD without dyspepsia or an ulcer-related indication</b>"],
         ["<b>Barrett’s, stricture, or NSAID/antiplatelet gastroprotection</b>","Usually continued PPI at the lowest effective dose — review the indication (and the specialist plan in Barrett’s) before any change; continue gastroprotection when the antiplatelet/NSAID indication and GI-risk assessment justify it; check the omeprazole/esomeprazole–clopidogrel interaction against the current Greater Manchester formulary. Barrett’s must be enrolled in surveillance"],
         ["<b>Pregnancy</b>","Lifestyle and alginates first; omeprazole has the most safety data if acid suppression is needed. Usually resolves postpartum"],
         ["<b>Functional heartburn</b>","Requires normal OGD and normal reflux monitoring — not diagnosed in primary care without specialist testing. If symptoms persist despite optimised treatment and OGD is normal, refer for gastroenterological assessment; neuromodulators (e.g. low-dose amitriptyline) are specialist or functional-GI management after appropriate diagnostic assessment. AVOID endless PPI escalation"],
         ["<b>What primary care keeps</b>","Typical reflux with no alarm features, responding to lifestyle and a PPI — which is the large majority. Refer for alarm features, diagnostic uncertainty or genuine treatment failure"]
       ]}
     ]},

    {id:"lifestyle", nav:"Lifestyle", title:"Lifestyle — first-line for everyone", sub:"These measures address the mechanics of reflux and reduce reliance on long-term acid suppression. They carry more of the load as the drug dose comes down, so they are reinforced at every step-down.",
     blocks:[
       {b:"table", head:["Measure","What to advise","Why / effect"], rows:[
         ["<b>Weight loss</b>","Target a sustained reduction in the overweight; refer to a weight-management programme where appropriate","The single most effective intervention in overweight patients — it lowers intra-abdominal pressure and reduces symptoms"],
         ["<b>Meal pattern</b>","Smaller meals; nothing within 3 hours of lying down; a lighter, earlier evening meal","Reduces both the volume available to reflux and the nocturnal acid exposure that wakes people"],
         ["<b>Bed head elevation</b>","Raise the head of the bed with blocks under the bedposts — not extra pillows, which simply flex the abdomen","<b>Specifically benefits nocturnal symptoms.</b> Left-lateral sleeping position may also help nocturnal reflux"],
         ["<b>Trigger foods and drinks</b>","Trim alcohol, caffeine, fatty, spicy and acidic foods, chocolate and fizzy drinks — individualised to what actually provokes symptoms","Individual triggers vary; a blanket exclusion list is poorly adhered to and rarely necessary"],
         ["<b>Smoking cessation</b>","NHS Stop Smoking Service; offer pharmacotherapy","<b>Smoking lowers lower-oesophageal-sphincter tone</b>, and cessation also reduces oesophageal cancer risk"],
         ["<b>Tight clothing</b>","Avoid tight waistbands and belts","Raises intra-abdominal pressure — a small, free intervention that patients rarely think of"],
         ["<b>Review the aggravators</b>","Review potentially aggravating medicines (NSAIDs, aspirin, calcium-channel blockers, nitrates, bisphosphonates, theophylline, doxycycline, anticholinergics) and correct administration technique — stop or switch only where clinically safe; otherwise continue with appropriate gastroprotection or specialist advice","They relax the sphincter or injure the mucosa directly. <b>This review is often more effective than escalating the PPI</b>"],
         ["<b>Self-care and OTC</b>","<b>Antacids and alginates for intermittent symptoms</b>; explain what OTC failure means","Safety-net explicitly for alarm features and for failure of OTC treatment, so the patient knows when to return"]
       ]},
       {b:"say", html:"Two things do more here than any tablet: getting some weight off if there is weight to lose, and not eating within three hours of lying down. If nights are the problem, put blocks under the head of the bed rather than piling up pillows — pillows just bend you in the middle and make it worse."}
     ]},

    {id:"ladder", nav:"Treatment ladder", title:"The treatment ladder — the right drug at the right time", sub:"Doses are named for orientation — verify every one in the BNF. The timing instruction matters as much as the dose.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Step 1", title:"Lifestyle measures and a drug review", when:"every patient",
          html:"Weight loss, smaller and earlier meals, bed-head elevation, trigger reduction, smoking cessation. <b>Review potentially aggravating medicines and correct administration technique; stop or switch only where clinically safe</b> — NSAIDs, calcium-channel blockers, nitrates, bisphosphonates, theophylline, doxycycline, anticholinergics."},
         {step:"Step 2", title:"Alginate or antacid PRN", when:"mild or intermittent symptoms, and in pregnancy",
          html:"<b>An alginate-containing antacid after meals and at bedtime</b>, prescribed or purchased according to local formulary and patient preference. Also the bridging agent for breakthrough symptoms at every later step, and during step-down and any transient rebound symptoms."},
         {step:"Step 3", title:"Full-dose PPI for 4 or 8 weeks", when:"proven or clinically diagnosed GORD", fromLabel:"first-line",
          html:"Omeprazole 20 mg OD or lansoprazole 30 mg OD (omeprazole 40 mg is a higher dose — use according to indication and response), taken 30–60 minutes BEFORE breakfast; if prescribed twice daily, before breakfast and before the evening meal (check the specific product instructions) — PPIs need food to activate proton pumps, and <b>wrong timing is the commonest cause of apparent “PPI failure”</b>. <b>Uninvestigated dyspepsia: 4 weeks. Typical GORD: 4 or 8 weeks. Severe erosive oesophagitis: 8 weeks at full dose — maintenance may be required (also for stricture).</b>"},
         {step:"Step 4", title:"Test and treat H. pylori", when:"dyspepsia or ulcer-type symptoms", fromLabel:"epigastric / ulcer features",
          html:"Urea breath test or stool antigen — stop the PPI 2 weeks before testing (false negatives), and avoid antibiotics for the appropriate period per local laboratory guidance. Positive → use the <b>current Greater Manchester H. pylori eradication regimen</b> (NICE CG184 first-line: 7-day PPI BD plus amoxicillin plus clarithromycin or metronidazole; if truly penicillin-allergic, PPI BD plus clarithromycin plus metronidazole — doses per BNF and GM formulary). Check previous antibiotic exposure, <b>true</b> penicillin allergy, interactions and local availability; <b>do not repeat clarithromycin, metronidazole or a quinolone where the patient has had relevant exposure in the preceding year</b> unless specialist/local guidance supports it. Advise on adherence and adverse-effect management. <b>Do not offer eradication for GORD without dyspepsia or an ulcer-related indication.</b> <b>Confirm eradication with a carbon-13 urea breath test where required</b> (after peptic ulcer disease, treatment failure or where it will change management), after the appropriate post-treatment interval and off PPI."},
         {step:"Step 5", title:"Optimise before escalating", when:"partial response", fromLabel:"still symptomatic",
          html:"<b>Check timing and adherence FIRST</b>, then <b>increase to BD dosing or switch PPI</b>. Add an alginate-containing antacid PRN for breakthrough, post-prandial or nocturnal symptoms. An apparently PPI-resistant patient is usually a fixable one — work the <a href='#targets'>six checks</a> before calling it refractory."},
         {step:"Step 6", title:"H2RA add-on or alternative", when:"nocturnal breakthrough, or PPI intolerance", fromLabel:"adjunct",
          html:"<b>Famotidine 20–40 mg nocte</b> for nocturnal acid breakthrough, or where a PPI is not tolerated. Also useful as short-term cover while stopping a PPI."},
         {step:"Step 7", title:"Step down and stop", when:"symptoms controlled for 4–8 weeks", fromLabel:"the target for most",
          html:"Reduce to the lowest effective dose or on-demand use; stop gradually or abruptly by shared decision, with a plan for transient rebound symptoms. This is the step that is skipped most often and matters most — it has <a href='#stepdown'>its own section</a>."}
       ]},
       {b:"warn", html:"<b>Review whether the indication for long-term treatment remains valid.</b> Discuss potential adverse effects — reported associations include hypomagnesaemia, B12 deficiency, C. difficile and other enteric infections, hip fracture, hypochlorhydria and rebound acid hypersecretion on stopping, several from observational studies that do not prove causation — but <b>do not stop a clinically indicated PPI solely because of an observational association</b>."}
     ]},

    {id:"stepdown", nav:"Step down &amp; stop", title:"The step-down — shared, flexible and planned", sub:"Once symptoms have been controlled for 4–8 weeks and any oesophagitis has healed, reduce. Rebound symptoms after stopping are usually transient, but duration and severity vary and they may overlap with recurrence of the underlying condition. Discuss stopping or step-down using shared decision-making: a gradual reduction may help patients who experience rebound symptoms, but abrupt cessation can also be appropriate in selected patients without a continuing indication. Provide alginate/antacid advice and a clear plan for transient symptoms.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1st", title:"Reduce the dose", when:"controlled for 4–8 weeks",
          html:"Reduce stepwise to the lowest effective dose — one possible regimen is omeprazole 40 → 20 → 10 mg (the 10 mg formulation may not be available or appropriate for every preparation) — over a few weeks, holding each step until stable. Reinforce lifestyle at each step — it carries more of the load as the drug reduces."},
         {step:"2nd", title:"On-demand or intermittent use", when:"stable on a low dose", fromLabel:"the target for most",
          html:"Take the PPI only for symptomatic days or as short courses — many patients with uncomplicated GORD can use intermittent or on-demand treatment, but recurrence rates depend on phenotype and prior severity. <b>An alginate PRN bridges the breakthrough days.</b>"},
         {step:"3rd", title:"Plan for rebound symptoms", when:"stopping completely", fromLabel:"pre-warn and bridge",
          html:"Stopping may be abrupt or gradual depending on dose, duration, patient preference and previous rebound symptoms. Warn that transient upper-GI symptoms may occur after stopping — duration and severity vary, and they may overlap with recurrence of the underlying condition. Offer an alginate or antacid bridge (± a short course of famotidine) and a clear plan for transient symptoms, so the patient does not simply restart full dose by default."},
         {step:"Don’t", title:"Who usually needs continued PPI", when:"keep the PPI", fromLabel:"maintain at the lowest effective dose",
          html:"Severe erosive oesophagitis (Los Angeles grade C or D) or a documented stricture may need maintenance treatment. <b>Confirmed Barrett’s oesophagus: do not routinely deprescribe without discussing the indication with gastroenterology or reviewing the specialist plan</b>, and keep the patient within the surveillance pathway. <b>NSAID/antiplatelet gastroprotection: continue when the indication and GI-risk assessment justify it</b> — do not discontinue without reviewing the indication, especially with previous ulcer bleeding, older age, concurrent anticoagulant/antiplatelet/corticosteroid use, renal disease or other bleeding risks; check the omeprazole/esomeprazole–clopidogrel interaction against the current Greater Manchester formulary. <b>Use the lowest effective dose.</b> And where reflux symptoms relapse on stopping, settle on <b>the lowest dose that controls them</b> rather than returning to full dose by default."}
       ]},
       {b:"say", html:"These tablets are brilliant for healing the irritation, but they are not meant to be forever for most people. We will get you comfortable, then come down step by step. When we reduce or stop, your heartburn may flare for a while — often that is the stomach readjusting rather than the reflux coming back for good. An alginate antacid from the pharmacy can tide you over, and we can decide together whether to come down gradually or stop. If it does not settle, come back and we will review it."},
       {b:"why", html:"NICE CG184 recommends a full-dose PPI for 4 or 8 weeks as initial therapy, then step-down to the lowest dose that controls symptoms, including on-demand use and return to alginate/antacid self-treatment where appropriate — it does not mandate a specific taper or duration. Auditing the repeat-prescribing list for long-term full-dose PPIs with no review is one of the highest-yield deprescribing wins available in general practice — and <b>every repeat request is a step-down opportunity</b>."}
     ]},

    {id:"targets", nav:"Targets", title:"Targets, and the before-you-escalate check", sub:"Judge the response at 4–8 weeks against symptoms, and check the obvious six things before calling anyone PPI-resistant.",
     blocks:[
       {b:"table", head:["Situation","Target and timeframe","Action threshold"], rows:[
         ["<b>Initial PPI course</b>","<b>Symptom control at 4 or 8 weeks</b> (8 weeks at full dose for severe erosive oesophagitis)","<b>Controlled → step down.</b> Partial → check timing and adherence, then BD or switch PPI. <b>No response → reconsider the diagnosis and investigate</b>"],
         ["<b>Laryngopharyngeal reflux</b>","<b>Do not diagnose LPR from throat symptoms alone</b> — assess for ENT, respiratory, allergic and medication-related causes; if typical heartburn/regurgitation coexists, treat according to GORD guidance","A time-limited PPI trial may be considered in selected patients, without repeated escalation. <b>Persistent hoarseness, dysphagia, neck mass or other concerning symptoms → ENT or relevant urgent assessment</b>"],
         ["<b>Long-term PPI on repeat</b>","<b>Reviewed at least annually</b>","Confirm the indication remains valid, attempt step-down or stop, use the lowest effective dose; check magnesium/B12 selectively according to risk, not automatically in every patient"],
         ["<b>H. pylori eradication</b>","Confirm eradication where required — after peptic ulcer disease, treatment failure or where confirmation will change management","<b>Carbon-13 urea breath test</b> after the appropriate post-treatment interval and off PPI (stool antigen only per local laboratory policy)"],
         ["<b>Alarm features</b>","<b>Screened at every contact</b>","New dysphagia, weight loss or bleeding → suspected cancer pathway referral or urgent assessment, NOT a higher PPI dose"]
       ]},
       {b:"cards", items:[
         
       ]},
       {b:"table", head:["Reported long-term PPI association","Watch for","Action"], rows:[
         ["<b>Hypomagnesaemia</b>","Cramps, arrhythmia, tetany; often asymptomatic","<b>Consider magnesium measurement before starting and periodically during prolonged PPI treatment</b> in those at increased risk — digoxin, diuretics, other medicines causing hypomagnesaemia, or symptoms/risk factors (MHRA). Not mandatory annually for every stable PPI user"],
         ["<b>B12 deficiency</b>","Prolonged use, macrocytosis, anaemia, neuropathy, malabsorption, vegan diet, older age or other risk factors","<b>Check B12/FBC when clinically indicated</b> — routine annual testing in every PPI user is not required"],
         ["<b>C. difficile and other enteric infections</b>","New persistent diarrhoea on a PPI","Reduce or stop where the indication is not solid; investigate the diarrhoea"],
         ["<b>Hip fracture</b>","Osteoporosis risk factors, falls","Assess fracture risk clinically — not every PPI user needs osteoporosis investigation; hold the lowest effective dose"],
         ["<b>Rebound acid hypersecretion</b>","<b>Transient heartburn after stopping</b> — duration and severity vary","<b>Pre-warn, agree a gradual or abrupt stop, and bridge with an alginate or antacid</b> — it may overlap with recurrence, so review if it persists"]
       ]}
     ]},

    {id:"special", nav:"Special groups", title:"Special situations", sub:"Only the groups where management genuinely differs — these are the nuances that get tested and the ones that cause endless futile PPI escalation.",
     blocks:[{b:"cards", items:[
       {tone:"blue", h:"🤰 Pregnancy", html:"<b>Very common in the third trimester.</b> Lifestyle and alginates first; omeprazole has the most safety data if acid suppression is needed. <b>Usually resolves postpartum</b>, so frame it as time-limited and review after delivery rather than continuing indefinitely."},
       {tone:"blue", h:"💢 Non-cardiac chest pain", html:"<b>Only after a cardiac cause has been excluded.</b> A PPI trial can be both diagnostic and therapeutic in proven reflux-related chest pain — but the sequence matters: cardiac assessment first, reflux trial second."},
       {tone:"amber", h:"🗣️ Laryngopharyngeal reflux", html:"<b>Do not diagnose LPR from throat symptoms alone.</b> Hoarseness, cough, throat clearing and globus have many causes — laryngeal malignancy, vocal-cord disease, postnasal drip, asthma, medication effects, voice overuse, infection and functional laryngeal symptoms — so assess for ENT, respiratory, allergic and medication-related causes. If typical heartburn/regurgitation coexists, treat according to GORD guidance. A time-limited PPI trial may be considered in selected patients, but should not lead to repeated escalation without review. <b>Persistent hoarseness, dysphagia, neck mass or other concerning symptoms require ENT or relevant urgent assessment.</b> Pharyngeal dual-probe pH monitoring should not be used to diagnose reflux-related throat or respiratory symptoms (BSG)."},
       {tone:"cream", h:"🧠 Functional heartburn and functional dyspepsia", html:"Typical symptoms with a normal OGD and a normal pH study — a gut–brain-axis disorder. Test and treat H. pylori for the epigastric type, coeliac serology if there is IBS overlap, ultrasound if epigastric pain has been present under a year (&lt;1 year — possible biliary cause), and use time-limited PPI/H2RA treatment with later step-down (NICE); consider BSG functional-dyspepsia guidance. If symptoms persist despite optimised treatment and OGD is normal, <b>refer for gastroenterological assessment</b> — functional heartburn, reflux hypersensitivity and functional dyspepsia require appropriate diagnostic assessment before neuromodulator treatment (e.g. low-dose amitriptyline) is started, as specialist or functional-GI management. <b>AVOID endless PPI escalation</b> — recognising this prevents years of it."},
       {tone:"green", h:"🔬 Barrett’s oesophagus", html:"Confirmed at OGD → <b>do not routinely deprescribe the PPI without discussing the indication with gastroenterology or reviewing the specialist plan</b> (symptoms, oesophagitis, dysplasia, chemoprevention discussions, patient preference). Use the lowest effective dose and ensure the patient remains within the surveillance pathway (NICE NG231): long-segment (≥3 cm) every 2–3 years; short-segment (&lt;3 cm) with intestinal metaplasia every 3–5 years; no routine surveillance for short-segment Barrett’s without intestinal metaplasia after confirmation at two endoscopies. <b>Fewer than 1% progress to adenocarcinoma each year</b> (roughly 0.3% per year in non-dysplastic Barrett’s, varying with segment length, intestinal metaplasia and dysplasia) — premalignant, so counsel and follow up rather than discharging."},
       {tone:"red", h:"🥩 Eosinophilic oesophagitis", html:"<b>Food bolus obstruction requires same-day emergency endoscopic assessment.</b> Dysphagia with atopy, food impaction or failure of PPI treatment → refer for OGD with oesophageal biopsies, even if the mucosa appears normal. PPI treatment can suppress oesophageal eosinophilia, so document current PPI exposure on the endoscopy request; if initial biopsies are nondiagnostic but suspicion remains, repeat assessment off PPI may be required under specialist guidance. It is a common reason for a genuinely PPI-unresponsive “reflux” patient, and it is missed when dysphagia is treated as reflux."}
     ]}]},

    {id:"monitor", nav:"Review", title:"Review, monitoring and safety-netting", sub:"Structured follow-up is what converts a prescription into a resolved problem — and it is where an alarm feature appearing later gets caught.",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["<b>Symptom response</b>","<b>4–8 weeks</b>","<b>Controlled → step down.</b> Not controlled → <b>check timing and adherence first</b>, then escalate, reconsider the diagnosis, or refer"],
         ["<b>Long-term PPI on repeat</b>","<b>At least annually</b>","Confirm the ongoing need, attempt step-down or stop, lowest effective dose; check magnesium/B12 selectively according to risk, not routinely in every patient. <b>Every repeat is a step-down opportunity</b>"],
         ["<b>Alarm features</b>","<b>Every contact</b>","New dysphagia, weight loss or bleeding → suspected cancer pathway referral or urgent assessment — do NOT simply increase the PPI"],
         ["<b>H. pylori eradication</b>","Post-treatment where required — after peptic ulcer disease, treatment failure or where confirmation will change management","<b>Carbon-13 urea breath test</b>, after the appropriate post-treatment interval and off PPI, to confirm eradication"],
         ["<b>Barrett’s oesophagus</b>","At the NICE NG231 surveillance interval (long-segment every 2–3 years; short-segment with intestinal metaplasia every 3–5 years)","<b>Ensure the patient is actually enrolled</b> — check it rather than assume it"],
         ["<b>Recurrence off treatment</b>","When symptoms return after stopping","Re-evaluate, and consider endoscopy if symptoms recur off treatment or fail to settle — particularly in younger patients relapsing repeatedly"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🚨 999 / same-day", html:"“Vomiting blood, or black tarry stools — that is 999 or A&amp;E, not an appointment — the same if you faint or feel very unwell.”"},
         {tone:"red", h:"🔴 Swallowing or weight", html:"“Trouble swallowing, food sticking, or losing weight without trying — tell me straight away; that needs a camera test, not a stronger tablet.”"},
         {tone:"amber", h:"🔄 Rebound on stopping", html:"“When we reduce or stop the tablet your heartburn may flare for a while — usually rebound that settles. Use an alginate antacid, and come back if it does not settle.”"},
         {tone:"green", h:"💊 Not forever", html:"“These are not meant to be lifelong for most people — we will review yearly and use the lowest dose that keeps you comfortable.”"},
         {tone:"cream", h:"⏱️ Give it the full course", html:"“Take it 30 to 60 minutes before breakfast — that is what makes it work — and give it the full four- or eight-week course before we judge it.”"}
       ]},
       {b:"warn", html:"Audit your repeat-prescribing list for long-term full-dose PPIs with no review. It is one of the highest-yield deprescribing wins in general practice, and the patients found by that search are exactly the ones who were never told the course had an end."},
       {b:"why", html:"<b>A longstanding GORD label must never become a cognitive anchor</b>: new dysphagia or weight loss in a known refluxer demands re-triage against NG12. <b>Annual review of long-term PPIs is a recognised quality marker</b> — and the review is also the moment the step-down conversation actually happens."}
     ]},

    {id:"loop", nav:"Not responding?", title:"Not responding? Check before escalating", sub:"",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"1 · Timing", html:"Taken 30–60 min BEFORE breakfast? Wrong timing is the #1 'failure'."},
         {tone:"blue", h:"2 · Adherence + lifestyle", html:"Actually taking it? Weight, late meals, triggers, aggravating drugs (NSAIDs/CCBs)?"},
         {tone:"blue", h:"3 · Right diagnosis?", html:"Cardiac pain masquerading? Functional heartburn / LPR (different response)? Eosinophilic oesophagitis (dysphagia with atopy, food impaction or PPI failure → OGD + biopsies; document PPI exposure)?"},
         {tone:"amber", h:"4 · Alarm features", html:"New dysphagia / weight loss / bleeding / IDA → OGD, not a higher PPI dose. Food bolus obstruction → same-day emergency."},
         {tone:"blue", h:"5 · H. pylori", html:"Tested (off PPI) and eradicated where relevant?"},
         {tone:"amber", h:"6 · Refractory", html:"Diagnosis and adherence reviewed, optimised BD PPI + alginate and still symptomatic → gastroenterology (OGD, pH/impedance; manometry before surgery or if a motility disorder is suspected)."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — who, when, how urgently", sub:"Most GORD is managed entirely in primary care. Refer for alarm features, diagnostic uncertainty, or genuine treatment failure.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same-day / 999", html:"Haematemesis, melaena, coffee-ground vomiting, syncope or haemodynamic instability requires same-day emergency assessment and not routine direct-access referral. <b>Food bolus obstruction → same-day emergency endoscopic assessment.</b>"},
         {tone:"purple", h:"Suspected cancer pathway referral · NICE NG12 (updated April 2026)", html:"Refer people with dysphagia at ANY age, or aged 55 and over with weight loss plus any of upper abdominal pain, reflux or dyspepsia, using a suspected cancer pathway referral for oesophageal or stomach cancer (recommendations 1.2.1 and 1.2.7, amended 2025; this replaced urgent direct-access endoscopy). Consider a suspected cancer pathway referral for an upper abdominal mass consistent with stomach cancer; a <b>left supraclavicular node (Virchow / Troisier)</b> goes urgently the same way. Consider non-urgent direct-access endoscopy for haematemesis, and for people aged 55 and over with treatment-resistant dyspepsia, upper abdominal pain with low haemoglobin, a raised platelet count with any of nausea, vomiting, weight loss, reflux, dyspepsia or upper abdominal pain, or nausea or vomiting with any of weight loss, reflux, dyspepsia or upper abdominal pain. <b>Do not delay the referral to trial a PPI; if a PPI is started, tell the endoscopy service.</b>", src:"NICE NG12 (updated April 2026) · house rule"},
         {tone:"blue", h:"Routine gastroenterology", html:"<b>Refractory symptoms despite an optimised PPI, after reviewing the diagnosis and adherence</b> (OGD, ambulatory pH/impedance monitoring; manometry before surgery or where a motility disorder is suspected) · <b>persistent symptoms with a normal OGD</b> (possible functional heartburn or reflux hypersensitivity) · <b>suspected or confirmed Barrett’s oesophagus</b>, for surveillance · <b>severe oesophagitis, Los Angeles grade C or D</b> · <b>suspected eosinophilic oesophagitis</b> · <b>younger patients whose symptoms recur off PPI</b>."},
         {tone:"blue", h:"Upper GI surgery", html:"<b>Proven GORD considering fundoplication</b> — volume regurgitation, PPI dependence or intolerance, or a patient who wants to avoid lifelong PPI. <b>After pH study and manometry</b>, never on symptoms alone."},
         {tone:"cream", h:"ENT", html:"<b>Persistent hoarseness or throat symptoms, dysphagia, a neck mass or other concerning symptoms</b> — ENT or relevant urgent assessment to exclude head and neck pathology; do not repeatedly escalate a PPI for throat symptoms alone."},
         {tone:"cream", h:"What primary care keeps", html:"<b>Typical reflux, no alarm features, responding to lifestyle plus a PPI</b> — manage and review. This is the majority, and unnecessary referral delays the patients who need urgent endoscopy."}
       ]},
       {b:"say", html:"Reflux usually settles with some weight loss, meal changes and a course of an acid tablet taken before breakfast — then we bring it down to the lowest dose you need, and for many people, off it altogether. If you ever struggle to swallow or lose weight, that changes things and I need to know straight away."},
       {b:"why", html:"The referral logic in GORD is essentially the NG12 cancer pathway plus a small group needing specialist diagnostics or surgery. Verbalising the precise NG12 thresholds — dysphagia at any age, 55 and over with weight loss plus reflux, dyspepsia or upper abdominal pain — demonstrates safe, guideline-concordant practice far better than a general statement about red flags."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only — the Casebook keeps the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 58-year-old man requesting “something stronger” for heartburn he has had for years, on omeprazole 20 mg from a repeat prescription that has never been reviewed. He takes it at bedtime. He mentions in passing that his trousers are loose and that food occasionally feels like it sticks."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Picks up <b>dysphagia and weight loss</b> and does not fold them into the reflux story; states the <b>NG12 threshold precisely</b> (dysphagia at any age → suspected cancer pathway referral under NICE NG12 (updated April 2026); 55 and over with weight loss plus reflux → the same) and <b>does not delay the referral to trial a PPI (telling the endoscopy service about any PPI started)</b>; corrects the <b>timing error — 30–60 minutes before breakfast, not at bedtime</b> — rather than increasing the dose; reviews the <b>aggravating drugs</b>; and, in the non-alarm version of this case, commits to a 4- or 8-week course with an explicit, shared step-down plan and a warning about transient rebound symptoms. <a href='../../cases/dyspepsia.html'>Open the full casebook chapter →</a>"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>NICE NG12 — Suspected cancer: recognition and referral (2015, updated April 2026)<br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — suspected cancer pathway referral (recommendations 1.2.1 and 1.2.7, amended 2025, replacing urgent direct-access endoscopy) for dysphagia at any age and for weight loss plus upper abdominal pain, reflux or dyspepsia aged 55 and over; the upper abdominal mass criterion; and the non-urgent “consider” list including haematemesis, treatment-resistant dyspepsia, low haemoglobin and raised platelet count</span></li>'+
         '<li>NICE CG184 — Gastro-oesophageal reflux disease and dyspepsia in adults (2014, updated 2019)<br><a href="https://www.nice.org.uk/guidance/cg184" rel="noopener">nice.org.uk/guidance/cg184</a><span class="rd"> — full-dose PPI for 4 weeks in uninvestigated dyspepsia and 4 or 8 weeks in GORD, 8 weeks for severe erosive oesophagitis, return to alginate/antacid self-treatment, H. pylori test-and-treat, step-down and on-demand dosing, and annual review of long-term acid suppression</span></li>'+
         '<li><b>NICE CG184 \u2014 Gastro-oesophageal reflux disease and dyspepsia in adults</b><br><a href="https://www.nice.org.uk/guidance/cg184" rel="noopener">nice.org.uk/guidance/cg184</a><span class="rd"> — the clinical diagnosis without endoscopy, PPI timing 30\u201360 minutes before food, alginate use, stepwise reduction to the lowest effective dose and on-demand use (no specific taper or duration mandated), and carbon-13 urea breath test to confirm eradication</span></li>'+
         '<li><b>NICE NG231 — Barrett\u2019s oesophagus and stage 1 oesophageal adenocarcinoma</b><br><a href="https://www.nice.org.uk/guidance/ng231" rel="noopener">nice.org.uk/guidance/ng231</a><span class="rd"> — surveillance intervals (long-segment every 2\u20133 years; short-segment with intestinal metaplasia every 3\u20135 years; none for short-segment without intestinal metaplasia after two endoscopies) and progression of fewer than 1% per year</span></li>'+
         '<li><b>MHRA Drug Safety Update — Proton pump inhibitors in long-term use</b><br><a href="https://www.gov.uk/drug-safety-update" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> — consider magnesium measurement before and periodically during prolonged PPI treatment in those at risk (digoxin, diuretics)</span></li>'+
         '<li><b>BSG — Guidelines for oesophageal manometry and oesophageal reflux monitoring (Gut 2019)</b><br><a href="https://doi.org/10.1136/gutjnl-2018-318115" rel="noopener">doi.org/10.1136/gutjnl-2018-318115</a><span class="rd"> — reflux monitoring off or on PPI; pharyngeal dual-probe pH monitoring not used for throat or respiratory symptoms</span></li>'+
         '<li><b>BSG/BSPGHAN — Eosinophilic oesophagitis in children and adults (Gut 2022)</b><br><a href="https://doi.org/10.1136/gutjnl-2022-327326" rel="noopener">doi.org/10.1136/gutjnl-2022-327326</a><span class="rd"> — biopsies even with normal mucosa, PPI suppression of eosinophilia, and food bolus obstruction</span></li>'+
         '<li><b>Greater Manchester Medicines Management Group — Antimicrobial guidelines and GI formulary</b><br><a href="https://gmmmg.nhs.uk" rel="noopener">gmmmg.nhs.uk</a><span class="rd"> — current H. pylori eradication regimen, avoiding clarithromycin, metronidazole or quinolones used in the preceding year, no eradication for GORD without dyspepsia, and the omeprazole/esomeprazole\u2013clopidogrel interaction</span></li>'+
         '<li><b>Bramble MG et al. — Detection of upper gastrointestinal cancer in patients taking antisecretory therapy prior to gastroscopy (Gut 2000)</b><br><a href="https://pubmed.ncbi.nlm.nih.gov/10716673/" rel="noopener">pubmed.ncbi.nlm.nih.gov/10716673</a><span class="rd"> — historical study; it does not justify a universal PPI stop before OGD. Do not delay the referral to trial or withdraw a PPI, and tell the endoscopy service about any PPI</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — all doses: omeprazole, lansoprazole, famotidine, amoxicillin, clarithromycin, metronidazole, alginates and amitriptyline</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"GORD and acid reflux in primary care — NICE CG184, NG12 (suspected cancer, updated April 2026) and NICE NG231 (Barrett\u2019s oesophagus). Assessment and management are merged on this page: the former GORD algorithm is retired. Alarm features follow the NICE NG12 suspected-cancer pathway; a PPI trial never delays the referral, and the endoscopy service is told about any PPI started (the endoscopy team decides on any medication adjustment; there is no routine PPI washout before OGD). Not a substitute for clinical judgement — follow the current Greater Manchester formulary for H. pylori eradication and PPI prescribing, and verify every dose in the BNF."
});
