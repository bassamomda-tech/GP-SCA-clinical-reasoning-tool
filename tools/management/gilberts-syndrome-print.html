  quickSub:"The five that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"blue", h:"The pattern, in an otherwise well adult", html:"Common (around 5%) inherited reduced UGT1A1 activity → mild, persistent, <b>predominantly unconjugated</b> hyperbilirubinaemia with <b>normal ALT/AST, ALP and GGT</b> and no evidence of haemolysis. Interpret it alongside previous results, the history, examination, medicines and alcohol. <b>Genetic testing and imaging are rarely needed.</b>"},
    {tone:"green", h:"No treatment or routine monitoring — once established", html:"Benign and lifelong; it does not cause chronic liver disease or shorten life. <b>No treatment, routine monitoring or specialist follow-up is needed once a typical diagnosis is established and alternative causes have been reasonably excluded.</b>"},
    {tone:"amber", h:"⚠ Irinotecan — not a GP decision", html:"Reduced UGT1A1 activity may increase exposure to SN-38, the active metabolite, and the risk of severe neutropenia and diarrhoea. <b>The oncology team must review the current irinotecan SPC</b> — including whether it is contraindicated, whether dose modification or UGT1A1 testing is needed. Recording Gilbert's alone is not sufficient risk management."},
    {tone:"blue", h:"Triggers make it more noticeable", html:"Jaundice may become more noticeable during fasting, illness, dehydration, stress or strenuous exercise, and usually settles when the trigger resolves. Advise normal eating and hydration and avoiding prolonged fasting; no special diet is needed."},
    {tone:"red", h:"⚠ Do not attribute new or atypical findings to Gilbert's", html:"Conjugated or mixed hyperbilirubinaemia, abnormal ALT/AST, ALP or GGT, anaemia or haemolysis, a marked or rising bilirubin, or significant systemic symptoms each need assessment in their own right. Gilbert's does not explain significant or progressive symptoms."}
  ],

         ["<b>What it is</b>","Common (around 5%) inherited reduced UGT1A1 enzyme activity → mild unconjugated hyperbilirubinaemia"],
         ["<b>Presentation</b>","Usually incidental; intermittent mild scleral icterus with fasting, illness, dehydration, stress or strenuous exercise. Most are otherwise asymptomatic"],
         ["<b>Key biochemistry</b>","Persistent isolated raised bilirubin, <b>predominantly unconjugated</b>, with NORMAL ALT/AST, ALP and GGT and no evidence of haemolysis. Usually mild"],
         ["<b>Context to review</b>","Previous bilirubin and liver blood tests, the degree and trend of elevation, symptoms and examination, medicines and alcohol"],

     ]},

    {id:"exclude", nav:"Exclude", title:"Step 2 — exclude the things it is NOT",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"🟠 Other causes of unconjugated bilirubin", html:"Haemolysis; ineffective erythropoiesis; resorption of a large haematoma; drugs impairing hepatic uptake or conjugation; Crigler–Najjar syndrome; laboratory or sampling variation. <b>A marked, progressive or atypical unconjugated bilirubin needs reassessment</b> — discuss with hepatology, gastroenterology or clinical biochemistry rather than labelling it Gilbert's."},
         {tone:"amber", h:"🟠 Haemolysis", html:"Anaemia, high reticulocytes, raised LDH or low haptoglobin → investigate haemolysis, not Gilbert's."},
         {tone:"amber", h:"🟠 Liver disease", html:"Abnormal ALT/AST, ALP or GGT, or concern about synthetic function (low albumin, prolonged INR) → investigate as abnormal liver blood tests. Normal albumin is reassuring but neither necessary nor specific for Gilbert's."},
         {tone:"amber", h:"🟠 Conjugated or mixed hyperbilirubinaemia", html:"Not typical of Gilbert's. Investigate for hepatocellular, cholestatic, drug-related or hereditary disease; <b>imaging is guided by the clinical and biochemical pattern</b>. Pale stools, dark urine and pruritus support cholestasis, but their absence does not exclude it."},
         {tone:"purple", h:"🟣 Jaundice at 40 and over <span class='tw'>2WW</span>", html:"Unexplained jaundice needs prompt assessment, especially with cholestatic liver tests, dark urine, pale stools, weight loss or abdominal symptoms. <b>In adults aged 40 and over with jaundice, refer on the suspected pancreatic cancer pathway (NICE NG12).</b>"},
         {tone:"amber", h:"🟠 Unwell or systemic", html:"Significant symptoms, weight loss, abdominal pain, pruritus or hepatosplenomegaly → do NOT attribute to Gilbert's; investigate. The absence of hepatomegaly does not exclude liver disease."}
       ]}
     ]},

    {id:"tests", nav:"Test", title:"Step 3 — what to check, and when to repeat",
     blocks:[
       {b:"table", head:["Test","Expected in Gilbert's","If abnormal"], rows:[

         ["<b>FBC</b>","Normal","Anaemia → add reticulocytes, film, LDH, haptoglobin"],
         ["<b>Reticulocytes, film, LDH, haptoglobin</b>","Consider where there is anaemia, a rising bilirubin, suspected haemolysis or diagnostic uncertainty — not needed for every classic presentation","Haemolysis → investigate"],
         ["<b>Repeat bilirubin</b>","Only if the diagnosis is uncertain, the bilirubin is rising or the context is atypical. Use the laboratory's usual sampling; a fasting provocation test is not needed","Rising or marked → reassess (Step 2)"]
       ]},
       {b:"why", html:"Once a stable typical pattern has been established, no routine bilirubin monitoring is required. Do not deliberately induce prolonged fasting to prove the diagnosis."}
     ]},

     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"😌 Reassure", html:"Benign and lifelong; does not cause chronic liver disease or shorten life. No treatment, special diet or routine monitoring once established."},
         {tone:"blue", h:"💡 Triggers", html:"Fasting, illness, dehydration, stress or strenuous exercise can make jaundice more noticeable; it usually settles when the trigger resolves. Keep to normal meals and hydration."},
         {tone:"amber", h:"💊 Irinotecan and other drugs", html:"<b>Irinotecan:</b> potentially increased toxicity — oncology must review the current SPC, contraindications, dose and the need for UGT1A1 testing. <b>Atazanavir</b> can cause or accentuate unconjugated hyperbilirubinaemia; interpret jaundice alongside the other liver tests. For any other drug, check the current SPC or seek specialist advice."},
         {tone:"blue", h:"🗂 Recording it", html:"Code it as a clinical diagnosis, <b>not an allergy or adverse drug reaction</b>, with a medication alert so it is visible at oncology prescribing."},
         {tone:"green", h:"🩸 Future tests", html:"A future isolated, predominantly unconjugated bilirubin with otherwise normal liver blood tests may be expected. <b>New abnormalities, a rising bilirubin or new symptoms should not automatically be put down to Gilbert's.</b>"}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Step 5 — when to refer or discuss",
     blocks:[
       {b:"cards", items:[
         {tone:"blue", h:"Discuss or refer — route by the abnormality", html:"Conjugated or mixed hyperbilirubinaemia · abnormal ALT/AST, ALP or GGT · low albumin or prolonged INR · anaemia or haemolysis · marked or progressive bilirubin · hepatosplenomegaly · weight loss, abdominal pain, pruritus or systemic illness · diagnostic uncertainty · possible inherited bilirubin disorder other than Gilbert's · children or young people. See the <a href='../algorithms/abnormal-lfts.html'>abnormal LFTs pathway</a>."},
         {tone:"green", h:"No routine follow-up", html:"<b>Once a typical diagnosis is established and alternative causes have been reasonably excluded, no routine follow-up or specialist referral is needed.</b>"},
         {tone:"cream", h:"GP management", html:"Confirming the pattern, the exclusions, the reassurance, the record and the irinotecan alert all belong here. Related pages: <a href='../algorithms/abnormal-lfts.html'>abnormal LFTs</a> · <a href='../algorithms/jaundice.html'>jaundice pathway</a> · <a href='fatty-liver.html'>fatty liver disease</a>."}
       ]},
       {b:"say", html:"Your results fit Gilbert's syndrome — a very common, harmless variation where bilirubin runs a little high, especially when you're fasting, unwell or stressed, which can give a slight yellow tinge to the eyes. It doesn't harm your liver and needs no treatment or regular tests. If a future blood test shows the same thing on its own, that's expected — but new symptoms or other abnormal results should still be checked. If you're ever offered chemotherapy, make sure the team knows you have Gilbert's."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",

       {tone:"cream", h:"Examiner-style checkpoints", html:"Reviews previous results and repeats LFTs with split bilirubin to confirm the typical unconjugated pattern; says it is <b>most consistent with Gilbert's</b> rather than hedging or over-claiming; <b>considers haemolysis and cholestasis</b> and says what would change the picture; <b>declines the scan and referral with a reason</b>; <b>assesses the fatigue separately</b> rather than attributing it to Gilbert's; explains the triggers and the family pattern; explains what a future result does and does not mean; and <b>records the diagnosis with an irinotecan alert for oncology</b>."}
     ]}]},

         '<li><b>NICE NG12 — Suspected cancer: recognition and referral</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — jaundice in adults aged 40 and over: suspected pancreatic cancer pathway</span></li>'+

  foot:"Gilbert's syndrome (adults). In an otherwise well adult, persistent isolated predominantly unconjugated hyperbilirubinaemia with normal liver blood tests and no evidence of haemolysis is most consistent with Gilbert's syndrome. Confirm the pattern and review previous results and the clinical context; genetic testing and imaging are rarely required. Once a typical diagnosis is established there is no treatment or routine monitoring. Reassess marked, progressive, conjugated or mixed hyperbilirubinaemia, abnormal liver tests, haemolysis or systemic symptoms. Jaundice at 40 and over: NICE NG12 suspected pancreatic cancer pathway. Record the diagnosis (not as an allergy) and ensure oncology reviews the irinotecan SPC before it is considered. Sources: BSG abnormal liver blood tests guideline, irinotecan SPC and MHRA, NICE NG12."
