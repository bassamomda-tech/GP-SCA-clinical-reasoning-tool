<script>
MG.render({
  icon:"🟡",
  title:"Gilbert's syndrome — recognising and confirming the typical primary-care pattern",
  eyebrow:"Protocol · adults · a diagnosis of reassurance",
  stemTitle:"In an otherwise well adult, persistent isolated unconjugated hyperbilirubinaemia with normal liver blood tests and no haemolysis is most consistent with Gilbert's syndrome — confirm the pattern, review the context, then reassure",
  stemSub:"<b>This pathway is for adults aged 18 years and over. It does not apply to neonates, infants, children or young people.</b> Confirm the typical pattern, review previous results and the clinical context, and reassess anything substantially elevated, progressive, conjugated, mixed or atypical. <b>Once a typical diagnosis is established there is no treatment and no routine monitoring.</b> Record Gilbert's syndrome as a diagnosis/problem-list entry (not an allergy), and add an oncology prescribing alert where the local record supports this. This educational guide does not replace urgent assessment of jaundice or abnormal liver blood tests.",
  guideline:"BSG abnormal liver blood tests (Gut 2018) · MHRA irinotecan SPC · NICE NG12 · local NHS Greater Manchester pathways",
  reviewed:"25 September 2026",
  nextReview:"25 March 2027",
  meta:[
    {t:"Adults 18 and over", tone:"ok"},
    {t:"No routine monitoring once confirmed", tone:"ok"},
    {t:"Irinotecan — inform oncology", tone:"tw"},
    {t:"v2.1 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#confirm"><b>Confirm</b><small>The pattern</small></a><a href="#exclude"><b>Exclude</b><small>What it is NOT</small></a><a href="#tests"><b>Test</b><small>No fasting test</small></a><a href="#advice"><b>Advice</b><small>Drugs · triggers</small></a><a href="#refer"><b>Refer</b><small>If it does not fit</small></a></div>',
  quickSub:"The five that matter. Numbered sources [1]–[5] are listed under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"blue", h:"The pattern, in an otherwise well adult", html:"Common (around 5%) inherited reduced UGT1A1 activity → mild, persistent, <b>predominantly unconjugated</b> hyperbilirubinaemia (unconjugated fraction the major component; a conjugated fraction under 20% of total is a useful practical description, although laboratories report fractions differently) with <b>normal ALT/AST, ALP and GGT</b> and no evidence of haemolysis [1]. Interpret it alongside previous results, the history, examination, medicines and alcohol. <b>Genetic testing and imaging are rarely needed.</b>"},
    {tone:"green", h:"No treatment or routine monitoring — once established", html:"Benign and lifelong; it does not cause chronic liver disease or shorten life. <b>No treatment, routine monitoring or specialist follow-up is needed once a typical diagnosis is established and alternative causes have been reasonably excluded.</b> A single isolated bilirubin result is not enough to establish it."},
    {tone:"amber", h:"⚠ Irinotecan — not a GP decision", html:"Reduced UGT1A1 activity may increase exposure to SN-38, the active metabolite, and the risk of severe neutropenia and diarrhoea. <b>Document Gilbert's syndrome or suspected reduced UGT1A1 activity and communicate it to the oncology team.</b> The oncologist should review the current irinotecan SPC, baseline bilirubin, regimen and dose, and whether UGT1A1 testing or dose modification is appropriate [5]. Gilbert's syndrome alone is not a GP indication to prescribe, withhold or dose-adjust irinotecan."},
    {tone:"blue", h:"Triggers make it more noticeable", html:"Jaundice may become more noticeable during fasting, illness, dehydration, stress, poor sleep or strenuous exercise, and usually settles when the trigger resolves. Advise normal eating and hydration and avoiding prolonged fasting; no special diet is needed."},
    {tone:"red", h:"⚠ Do not attribute new or atypical findings to Gilbert's", html:"Conjugated or mixed hyperbilirubinaemia, abnormal ALT/AST, ALP or GGT, anaemia or haemolysis, a substantially elevated or progressive bilirubin, or significant systemic symptoms each need assessment in their own right. Gilbert's does not explain significant or progressive symptoms, and fatigue is not a typical consequence. <b>New unexplained clinical jaundice at 40 and over → suspected pancreatic cancer pathway (NG12) [2].</b>"}
  ],
  pathwaySub:"Five steps, and most of them are about what this is not.",
  pathway:[
    {title:"Confirm the typical pattern", html:"First check for an unsafe presentation (unwell, septic, confused, bleeding, severe abdominal pain, rapidly progressive jaundice, persistent vomiting) — same-day assessment. Then: persistent isolated predominantly unconjugated bilirubin, normal ALT/AST, ALP and GGT, no haemolysis, otherwise well — reviewed against previous results."},
    {title:"Exclude what it is not", html:"Haemolysis, other causes of unconjugated bilirubin, liver disease, conjugated or mixed jaundice, and any systemically unwell patient.", alert:true},
    {title:"Confirm the biochemistry — no fasting test", html:"Repeat or confirm LFTs with split bilirubin, albumin and FBC; add reticulocytes, film, LDH and haptoglobin (± DAT) only where haemolysis is suspected. Use the laboratory's usual sampling conditions; a deliberate fasting or starvation-provocation test is not required."},
    {title:"Reassure and give the practical advice", html:"Benign and lifelong; the triggers; informing oncology before irinotecan; the safety-net; and what a future result does and does not mean."},
    {title:"Refer if the pattern does not fit", html:"Route by the abnormality and your local pathway. Otherwise no routine follow-up."}
  ],
  sections:[

    {id:"confirm", nav:"Confirm", title:"Step 1 — confirm the typical pattern",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>Who this covers</b>","Adults aged 18 years and over. Not neonates, infants, children or young people — their jaundice has a different differential and referral threshold"],
         ["<b>What it is</b>","Common (around 5%) inherited reduced UGT1A1 enzyme activity → mild unconjugated hyperbilirubinaemia"],
         ["<b>Presentation</b>","Usually incidental; intermittent mild scleral icterus with fasting, illness, dehydration, stress, poor sleep or strenuous exercise. Most are otherwise asymptomatic. <b>Fatigue is not a typical consequence of Gilbert's syndrome</b> — investigate persistent fatigue separately according to the clinical context"],
         ["<b>Key biochemistry</b>","Persistent isolated raised bilirubin, <b>predominantly unconjugated</b>, with NORMAL ALT/AST, ALP and GGT and no evidence of haemolysis. Usually mild [1]"],
         ["<b>Predominantly unconjugated</b>","The unconjugated fraction is the major component; a conjugated fraction of less than 20% of total bilirubin is a useful practical description, although laboratories may report fractions differently. Do not make the diagnosis depend rigidly on one percentage. <b>A conjugated fraction above 50% should not be attributed to Gilbert's syndrome and requires investigation</b>"],
         ["<b>Bilirubin level</b>","There is no single bilirubin cut-off that confirms or excludes Gilbert's syndrome. BSG advises that an unconjugated bilirubin above 40 µmol/L should prompt consideration of rarer causes such as Crigler–Najjar syndrome [1], but Gilbert's bilirubin can occasionally reach about 80–85 µmol/L during illness or fasting [3]. The diagnosis is less secure when bilirubin is substantially elevated, progressively rising, persistently above approximately 3 times the laboratory ULN, or associated with any other abnormality — then reassess for haemolysis, liver disease, medication effects and rarer inherited disorders, and discuss with clinical biochemistry or hepatology if uncertain"],
         ["<b>Albumin and INR</b>","Normal ALT/AST, ALP, GGT, albumin and — where clinically indicated — INR support the benign pattern, but normal albumin alone does not diagnose Gilbert's syndrome. INR is not needed in every classic, incidental presentation; check it urgently if the patient is unwell, jaundiced without a clear benign explanation, or there is concern about hepatic dysfunction"],
         ["<b>Context to review</b>","Previous bilirubin and liver blood tests (a stable or non-progressive pattern supports the diagnosis), the degree and trend of elevation, symptoms and examination findings suggesting liver disease, medicines and alcohol"],
         ["<b>Diagnosis</b>","Clinical and biochemical — the typical pattern with no evidence of haemolysis. A single result is not enough on its own. Genetic testing is rarely needed and should usually be discussed with clinical biochemistry or hepatology"],
         ["<b>Pregnancy</b>","Gilbert's syndrome itself is usually benign, but jaundice in pregnancy should not automatically be attributed to it. Consider pregnancy-specific disorders and liver disease if symptoms or liver-test abnormalities are present"]
       ]},
       {b:"why", html:"The BSG guideline [1] asks for abnormal liver blood tests to be interpreted against previous results, the history and the current clinical state. A stable typical pattern in a well adult is most consistent with Gilbert's; stating that clearly in the record is what stops the next clinician starting again."}
     ]},

    {id:"exclude", nav:"Exclude", title:"Step 2 — exclude the things it is NOT",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"🔴 Unsafe presentation — same day", html:"Sepsis or cholangitis · confusion or encephalopathy · bleeding or markedly prolonged INR · severe abdominal pain · rapidly progressive jaundice · significant vomiting or dehydration → <b>urgent same-day assessment</b>. Do not wait to confirm a Gilbert's pattern."},
         {tone:"amber", h:"🟠 Other causes of unconjugated bilirubin", html:"Haemolysis; ineffective erythropoiesis; resorption of a large haematoma; drugs impairing hepatic uptake or conjugation; Crigler–Najjar syndrome; laboratory or sampling variation. <b>A substantially elevated, progressive or atypical unconjugated bilirubin needs reassessment</b> — discuss with hepatology, gastroenterology or clinical biochemistry rather than labelling it Gilbert's."},
         {tone:"amber", h:"🟠 Haemolysis", html:"Anaemia, high reticulocytes, raised LDH or low haptoglobin → investigate haemolysis, not Gilbert's. Consider a DAT and further haematological assessment if autoimmune haemolysis is clinically suspected."},
         {tone:"amber", h:"🟠 Liver disease", html:"Abnormal ALT/AST, ALP or GGT, or concern about synthetic function (low albumin, prolonged INR) → investigate as abnormal liver blood tests. Normal albumin is reassuring but neither necessary nor specific for Gilbert's — albumin is affected by inflammation, renal and gastrointestinal protein loss, nutrition and other conditions [1]."},
         {tone:"amber", h:"🟠 Conjugated or mixed hyperbilirubinaemia", html:"Not typical of Gilbert's. Investigate for hepatocellular, cholestatic, drug-related or hereditary disease; <b>imaging is guided by the clinical and biochemical pattern</b>. Pale stools, dark urine and pruritus support cholestasis, but their absence does not exclude it. <b>Unconjugated bilirubin is albumin-bound and is not excreted in urine; bilirubinuria therefore indicates conjugated bilirubin and should not be attributed to uncomplicated Gilbert's syndrome.</b> A positive urine bilirubin should prompt reassessment, although urine dipstick bilirubin is not reliable enough to replace serum fractionation [4]."},
         {tone:"purple", h:"🟣 Jaundice at 40 and over <span class='tw'>Suspected cancer</span>", html:"<b>Adults aged 40 years and over with unexplained clinical jaundice require suspected pancreatic cancer pathway referral, even if the biochemical pattern appears potentially benign (NICE NG12) [2].</b> Do not use a presumed diagnosis of Gilbert's syndrome to defer assessment of new clinical jaundice. Gilbert's usually causes intermittent mild scleral icterus or an incidental biochemical rise; new, persistent or progressive clinical jaundice needs assessment in its own right."},
         {tone:"amber", h:"🟠 Unwell or systemic", html:"Significant symptoms, weight loss, abdominal pain, pruritus or hepatosplenomegaly → do NOT attribute to Gilbert's; investigate. The absence of hepatomegaly does not exclude liver disease. Fatigue is not a typical consequence of Gilbert's syndrome — investigate persistent fatigue separately."}
       ]}
     ]},

    {id:"tests", nav:"Test", title:"Step 3 — what to check, and when to repeat",
     blocks:[
       {b:"table", head:["Test","Expected in Gilbert's","If abnormal"], rows:[
         ["<b>Repeat or confirm LFTs with split bilirubin and albumin</b>","Predominantly unconjugated; ALT/AST, ALP, GGT normal","Conjugated or mixed, or abnormal enzymes → hepatobiliary work-up guided by the pattern"],
         ["<b>FBC</b>","Check if not recently available. Normal","Anaemia → add reticulocytes, film, LDH, haptoglobin"],
         ["<b>Reticulocytes, film, LDH, haptoglobin</b>","Consider where there is anaemia, a rising bilirubin, suspected haemolysis or diagnostic uncertainty. If the FBC is normal and the pattern is classic, do not routinely add a full haemolysis screen; a blood film is not mandatory in every patient","Haemolysis → investigate; consider DAT if autoimmune haemolysis is clinically suspected"],
         ["<b>INR</b>","Not needed in every classic, incidental presentation","Check urgently if unwell, jaundice is significant or there is concern about liver dysfunction; prolonged → urgent discussion"],
         ["<b>Repeat bilirubin</b>","Only if the diagnosis is uncertain, the bilirubin is rising or the context is atypical. Use the laboratory's usual sampling conditions. A deliberate fasting or starvation-provocation test is not required. If confirmation is needed, repeat liver blood tests with split bilirubin and FBC; avoid prolonged fasting, particularly in a symptomatic or vulnerable patient","Rising or substantially elevated → reassess (Step 2)"],
         ["<b>Ultrasound</b>","Not routinely required for isolated, persistent, predominantly unconjugated hyperbilirubinaemia with normal liver blood tests and no clinical concern for structural disease","Conjugated or mixed bilirubin, cholestatic liver tests, abdominal symptoms or suspected obstruction → image according to the pattern"],
         ["<b>Genetic testing</b>","Rarely needed","Discuss with clinical biochemistry or hepatology"]
       ]},
       {b:"why", html:"Once a typical adult diagnosis has been established, no treatment, routine bilirubin monitoring or routine hepatology follow-up is required — but not after one isolated result. Do not automatically perform a full liver aetiology screen or ultrasound in a clearly classic presentation, but do not use Gilbert's syndrome to explain unrelated abnormal liver tests. Do not deliberately induce prolonged fasting to prove the diagnosis."}
     ]},

    {id:"advice", nav:"Advice", title:"Step 4 — reassurance and living with it",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"😌 Reassure", html:"Benign and lifelong; does not cause chronic liver disease or shorten life. No treatment, special diet or routine monitoring once established."},
         {tone:"blue", h:"💡 Triggers", html:"Fasting, illness, dehydration, stress, poor sleep or strenuous exercise can make jaundice more noticeable; it usually settles when the trigger resolves. Keep to normal meals and hydration."},
         {tone:"amber", h:"💊 Irinotecan and other drugs", html:"<b>Irinotecan:</b> Gilbert's syndrome or suspected reduced UGT1A1 activity should be clearly documented and communicated to the oncology team. The oncologist should review the current irinotecan SPC, baseline bilirubin, regimen and dose, and whether UGT1A1 testing or dose modification is appropriate [5]. Gilbert's syndrome alone is not a GP indication to prescribe, withhold or dose-adjust irinotecan. <b>Atazanavir</b> can cause or accentuate unconjugated hyperbilirubinaemia by inhibiting UGT1A1; this does not necessarily indicate hepatocellular injury, so interpret the bilirubin with ALT, ALP, GGT and symptoms. <b>Do not stop antiretroviral therapy solely because of isolated unconjugated hyperbilirubinaemia without discussing it with the HIV team.</b> <b>Other medicines:</b> review new medicines, over-the-counter preparations and recreational or herbal products. If the abnormality began after a medicine was started, assess for drug-induced liver injury rather than assuming Gilbert's syndrome."},
         {tone:"blue", h:"🗂 Recording it", html:"Record Gilbert's syndrome as a diagnosis/problem-list entry, <b>not as an allergy or adverse drug reaction</b>, and add a clinically meaningful oncology prescribing alert where the local electronic record supports this."},
         {tone:"green", h:"🩸 Future tests", html:"A future isolated, predominantly unconjugated bilirubin with otherwise normal liver blood tests may be expected. <b>New abnormalities, a rising bilirubin or new symptoms should not automatically be put down to Gilbert's.</b> Safety-net: seek reassessment for new clinical jaundice, dark urine, pale stools, pruritus, abdominal pain, weight loss or systemic illness."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Step 5 — when to refer or discuss",
     blocks:[
       {b:"cards", items:[
         {tone:"blue", h:"Discuss or refer — route by the abnormality", html:"Conjugated or mixed hyperbilirubinaemia · abnormal ALT/AST, ALP or GGT · low albumin or prolonged INR · anaemia or haemolysis · substantially elevated or progressive bilirubin · hepatosplenomegaly · weight loss, abdominal pain, pruritus or systemic illness · diagnostic uncertainty · possible inherited bilirubin disorder other than Gilbert's · children or young people. See the <a href='../algorithms/abnormal-lfts.html'>abnormal LFTs pathway</a>. Follow the current local NHS Greater Manchester abnormal liver blood-test, jaundice and suspected-cancer pathways where these differ from this educational guide."},
         {tone:"green", h:"No routine follow-up", html:"<b>Once a typical diagnosis is established and alternative causes have been reasonably excluded, no routine follow-up or specialist referral is needed.</b>"},
         {tone:"cream", h:"GP management", html:"Confirming the pattern, the exclusions, the reassurance, the record and informing oncology before irinotecan all belong here. Related pages: <a href='../algorithms/abnormal-lfts.html'>abnormal LFTs</a> · <a href='../algorithms/jaundice.html'>jaundice pathway</a> · <a href='fatty-liver.html'>fatty liver disease</a>."}
       ]},
       {b:"say", html:"Your results fit Gilbert's syndrome — a very common, harmless variation where bilirubin runs a little high, especially when you're fasting, unwell or stressed, which can give a slight yellow tinge to the eyes. It doesn't harm your liver and needs no treatment or regular tests. If a future blood test shows the same thing on its own, that's expected — but new symptoms or other abnormal results should still be checked. Come back if your skin or eyes become more yellow and stay that way, your urine turns dark, your stools go pale, you start itching, or you have tummy pain, weight loss or feel unwell. If you're ever offered chemotherapy, make sure the team knows you have Gilbert's."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 24-year-old man attends anxious about an <b>incidental bilirubin of 42 µmol/L</b> found on bloods taken for fatigue. <b>ALT, ALP and GGT are normal</b>, FBC is normal. His eyes look \"a bit yellow\" when he skips meals during exams, and <b>his father was told something similar years ago</b>. He has read about liver failure online and asks for a scan and a hepatology referral."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Reviews previous results and repeats LFTs with split bilirubin to confirm the typical unconjugated pattern; says it is <b>most consistent with Gilbert's</b> rather than hedging or over-claiming; <b>considers haemolysis and cholestasis</b> and says what would change the picture; <b>declines the scan and referral with a reason</b>; <b>assesses the fatigue separately</b> rather than attributing it to Gilbert's; explains the triggers and the family pattern; explains what a future result does and does not mean; and <b>records the diagnosis (not as an allergy) with an oncology prescribing alert</b>."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Numbered sources, cited inline as [1]–[5]. Follow local NHS Greater Manchester pathways where they differ.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>[1] Newsome PN, et al. Guidelines on the management of abnormal liver blood tests. Gut. 2018;67:6–19. doi:10.1136/gutjnl-2017-314924</b><br><a href="https://gut.bmj.com/content/67/1/6" rel="noopener">gut.bmj.com/content/67/1/6</a><span class="rd"> — interpreting an isolated raised bilirubin against previous results and context; repeat LFTs with split bilirubin and FBC</span></li>'+
         '<li><b>[5] Current MHRA-approved irinotecan hydrochloride SPC relevant to the product and regimen (e.g. Campto 20 mg/ml concentrate for solution for infusion, PL 00057/0627)</b><br><a href="https://products.mhra.gov.uk/search/?search=irinotecan" rel="noopener">products.mhra.gov.uk — irinotecan</a><span class="rd"> — Gilbert\u2019s syndrome / reduced UGT1A1 activity, SN-38 exposure, neutropenia and diarrhoea; check at every review, as warnings, bilirubin thresholds and pharmacogenetic advice may change</span></li>'+
         '<li><b>[2] NICE NG12 — Suspected cancer: recognition and referral. Recommendations organised by site of cancer: pancreatic cancer</b><br><a href="https://www.nice.org.uk/guidance/ng12/chapter/Recommendations-organised-by-site-of-cancer#pancreatic-cancer" rel="noopener">nice.org.uk/guidance/ng12 — pancreatic cancer</a><span class="rd"> — jaundice in adults aged 40 and over: suspected pancreatic cancer pathway</span></li>'+
         '<li><b>[3] Patient.info (professional) — Gilbert\u2019s syndrome</b><br><a href="https://patient.info/doctor/gilberts-syndrome-pro" rel="noopener">patient.info/doctor/gilberts-syndrome-pro</a><span class="rd"> — benign natural history; typical bilirubin range, occasionally about 80–85 µmol/L with illness or fasting</span></li>'+
         '<li><b>[4] Patient.info (professional) — Bilirubinuria (raised bilirubin and testing)</b><br><a href="https://patient.info/doctor/bilirubinuria" rel="noopener">patient.info/doctor/bilirubinuria</a><span class="rd"> — conjugated versus unconjugated bilirubin; urine bilirubin testing and its limits</span></li>'+
         '<li><b>Local pathways</b><span class="rd"> — current NHS Greater Manchester abnormal liver blood-test, jaundice and suspected-cancer pathways take precedence where they differ (the GMMMG formulary has no specific Gilbert\u2019s pathway)</span></li>'+
         '</ul></div>'},
       {b:"table", head:["Version control","Detail"], rows:[
         ["Owner","To be completed locally"],
         ["Approving organisation","Practice/PCN/ICB clinical governance — to be completed"],
         ["Approval date","To be completed on approval"],
         ["Review date","25 March 2027, or sooner if BSG, NICE, the irinotecan SPC or local pathways change"],
         ["Superseded version","v2.0 and earlier"],
         ["Local pathway links","NHS Greater Manchester abnormal liver blood-test, jaundice and suspected-cancer pathways"]
       ]}
     ]}
  ],
  foot:"Gilbert's syndrome (adults). In an otherwise well adult, persistent isolated predominantly unconjugated hyperbilirubinaemia with normal liver blood tests and no evidence of haemolysis is most consistent with Gilbert's syndrome. Confirm the pattern and review previous results and the clinical context; genetic testing and imaging are rarely required. Once a typical diagnosis is established there is no treatment or routine monitoring. No fasting provocation test is needed. There is no single bilirubin cut-off; reassess substantially elevated, progressive, conjugated or mixed hyperbilirubinaemia, abnormal liver tests, haemolysis or systemic symptoms. New unexplained clinical jaundice at 40 and over: NICE NG12 suspected pancreatic cancer pathway. Record the diagnosis as a problem-list entry (not as an allergy) and inform oncology so they review the current irinotecan SPC before it is considered. Adults aged 18 and over only. Sources: BSG abnormal liver blood tests guideline (Gut 2018), MHRA irinotecan SPC, NICE NG12, Patient.info professional references, local NHS Greater Manchester pathways."
});
</script>
