  glance:[
    {lbl:"Recognise", val:"A / B / C problem", sub:"skin signs may be absent"},

  quickSub:"If you read nothing else on this page, read these six cards. Sources are named under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Anchor the diagnosis on A, B or C — not the rash", html:"Sudden onset of an <b>Airway</b> (swelling, hoarseness, stridor), <b>Breathing</b> (wheeze, ↑RR, cyanosis, SpO₂ &lt;94%, fatigue) or <b>Circulation</b> (pale/clammy, tachycardia, low BP, faint, collapse) problem, usually with skin or mucosal changes — but these are <b>subtle or absent in roughly 1 in 5</b> (approximate). Urticaria, flushing or angioedema <b>without</b> A/B/C compromise is not anaphylaxis; tongue, pharyngeal or laryngeal angioedema is an airway emergency. Normal SpO₂ does not exclude anaphylaxis."},
    {tone:"red", h:"💉 IM adrenaline 1 mg/mL (1:1000), immediately", html:"Anterolateral thigh: <b>adult &amp; child &gt;12 y 500 µg</b> (0.5 mL); <b>6–12 y 300 µg</b> (0.3 mL); <b>6 months–6 y 150 µg</b> (0.15 mL); <b>&lt;6 months 100–150 µg</b> (0.1–0.15 mL). Call 999, summon help, <b>repeat after 5 minutes</b> if A/B/C problems persist. There are no contraindications in anaphylaxis. If in doubt with A/B/C compromise — give it."},
    {tone:"amber", h:"Position: lie flat, never stand", html:"Lie flat, with or without legs raised; semi-recumbent only if breathing is easier sitting; <b>left lateral in pregnancy</b>. <b>Do not let the patient stand, walk or sit up suddenly</b> — this can precipitate fatal cardiovascular collapse. High-concentration oxygen; IV/IO crystalloid if hypotensive or poorly responsive."},
    {tone:"amber", h:"Antihistamines and steroids are not resuscitation drugs", html:"They are ineffective for A/B/C compromise and <b>hydrocortisone is no longer recommended</b> routinely. A non-sedating oral antihistamine only <b>after</b> stabilisation, for residual skin symptoms. Salbutamol is an add-on for persistent bronchospasm; nebulised adrenaline is not a substitute for IM adrenaline."},
    {tone:"blue", h:"999 and observe — everyone", html:"A GP surgery should not usually observe and discharge after treating anaphylaxis: <b>transfer everyone</b> for emergency assessment and risk-stratified observation, because biphasic reactions can recur hours later without re-exposure. Observation is tiered — 2 h, 6 h or 12 h from resolution (RCUK 2021; NICE NG258)."},
    {tone:"green", h:"Before discharge: two AAIs, training, referral", html:"Offer <b>two adrenaline auto-injectors</b> (unless the reaction was to a drug that can easily be avoided — NICE NG258), demonstrate the exact device, give a written action plan, and <b>refer everyone to a specialist allergy service</b>. After any AAI use: lie down with legs raised and call 999 — even if symptoms settle."}
  ],

  pathway:[
    {title:"Recognise", html:"A–B–C–D–E assessment. Sudden-onset airway, breathing or circulation problem, usually with skin/mucosal changes (may be absent). Say it out loud: “I think this is anaphylaxis.”", alert:true},

    {title:"Refractory?", html:"Still A/B/C compromise after 2 appropriate IM doses = refractory anaphylaxis: peri-arrest emergency. Continue IM adrenaline every 5 min and fluids; IV adrenaline infusion is specialist/critical-care only."},
    {title:"Tryptase", html:"Timed samples support (but never make or exclude) the diagnosis — never delay treatment or transfer to take them."},
    {title:"Transfer &amp; observe", html:"Everyone to hospital by 999 for risk-stratified observation (2 h / 6 h / 12 h from resolution) because of biphasic risk."},
    {title:"Two auto-injectors", html:"Two AAIs (unless an easily avoided drug cause), brand-specific training, MHRA 2023 use and posture advice, written plan."},
    {title:"Allergy referral", html:"Refer everyone to a specialist allergy service (NICE NG258); document the suspected trigger in detail; code drug culprits as an allergy."},
    {title:"Avoid &amp; safety-net", html:"Trigger avoidance, written plan shared with school/work, medical-alert ID, asthma optimised, AAIs in date — and always 999 after any AAI use."}
  ],
  sections:[

    {id:"recognise", nav:"Recognise", title:"Recognising anaphylaxis", sub:"<b>Suspect anaphylaxis when there is sudden onset of airway and/or breathing and/or circulation compromise, usually with skin or mucosal changes.</b> Skin changes may be absent. Rapid progression is common but is not essential before treatment (Resuscitation Council UK 2021).",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"Airway", html:"Swelling, hoarseness, stridor, sensation the throat is closing, difficulty breathing/swallowing. Isolated airway compromise after an allergen exposure is anaphylaxis until proven otherwise.", src:"Resuscitation Council UK 2021"},
         {tone:"red", h:"Breathing", html:"Increased respiratory rate, wheeze, fatigue, cyanosis, SpO₂ &lt;94%. Normal oxygen saturation does not exclude anaphylaxis, especially early or when the main problem is hypotension or upper-airway oedema.", src:"Resuscitation Council UK 2021"},
         {tone:"red", h:"Circulation", html:"Pale, clammy, tachycardia, low BP, feeling faint, confusion, collapse. Sudden hypotension or collapse after a likely trigger may be anaphylaxis even without rash.", src:"Resuscitation Council UK 2021"},
         {tone:"amber", h:"Skin / mucosa (supportive)", html:"Flushing, urticaria, angioedema — subtle or absent in roughly 1 in 5 (an approximate estimate, not a diagnostic threshold). <b>Urticaria, flushing or angioedema without airway, breathing or circulation compromise is not anaphylaxis.</b> Angioedema involving the tongue, pharynx or larynx is an airway emergency — treat as anaphylaxis if an allergic mechanism is possible. Severe GI symptoms after a known allergen can be part of anaphylaxis, particularly in children, but vomiting or abdominal pain alone is not sufficient.", src:"Resuscitation Council UK 2021"}
       ]},
       {b:"table", head:["Is this anaphylaxis?","Action"], rows:[
         ["<b>Yes</b> — A/B/C compromise after a likely trigger (or diagnosis uncertain but A/B/C compromise present)","<b>Treat now:</b> IM adrenaline (1:1000) into the anterolateral thigh immediately, call 999 and summon help, position the patient, remove the trigger (e.g. sting); repeat adrenaline after 5 min if A/B/C problems persist. Consider alternative diagnoses once stabilised"],
         ["<b>No life-threatening feature</b> — skin-only / allergic reaction","Skin changes with no airway/breathing/circulation compromise are not anaphylaxis — observe, treat symptomatically (non-sedating oral antihistamine for skin), and safety-net"]
       ]},
       {b:"kv", rows:[
         ["Likely triggers in primary care","Foods (peanut, tree nuts, milk, egg, fish, shellfish, sesame) are the commonest trigger in children; <b>drugs</b> (antibiotics, NSAIDs, general anaesthetic agents), <b>wasp or bee venom</b> and, rarely, vaccines dominate in adults. In the surgery the classic setting is a <b>vaccination clinic</b> or the minutes after an injection (e.g. antibiotic, contrast, allergen immunotherapy). Onset is usually within minutes of injected or stung triggers and within minutes to about 2 hours of eating a food trigger."],
         ["Co-factors to ask about","Exercise, alcohol, NSAIDs, intercurrent infection, menstruation and poorly controlled asthma all lower the threshold for a severe reaction and should be recorded."],
         ["Possible mimics","<b>Vasovagal faint</b> (pale, bradycardic, sweaty, rapid recovery lying flat, no rash or wheeze); <b>panic attack</b> (tingling, breathlessness without hypoxia or low BP; a flushed rash can occur); <b>acute asthma</b> without allergen exposure; <b>isolated urticaria or angioedema</b> without A/B/C compromise; <b>ACE-inhibitor or hereditary angioedema</b> (bradykinin-mediated: swelling without urticaria, does not respond to adrenaline as reliably — still treat any airway threat as an emergency). These may initially resemble anaphylaxis: <b>if the diagnosis is uncertain but there is airway, breathing or circulation compromise, give IM adrenaline</b>, reassess after treatment and consider alternative diagnoses once the patient is stabilised."],
         ["If in doubt","Give adrenaline. In a patient with possible anaphylaxis and airway, breathing or circulation compromise, the risk of delaying adrenaline is greater than the risk of a correctly administered single IM dose."]
       ]},
       {b:"why", html:"The Resuscitation Council UK definition deliberately anchors the diagnosis on a life-threatening A, B or C problem rather than on the rash, because up to one in five anaphylactic reactions have minimal or no skin involvement — waiting for urticaria before treating risks fatal delay. Asthma and anaphylaxis overlap and can be hard to separate in the moment; if there is any life-threatening feature with a plausible trigger, treat for anaphylaxis. The most useful bedside discriminator from a faint is the pulse and posture response: a vasovagal episode usually brings bradycardia and improves within a minute or two of lying flat, whereas anaphylaxis brings tachycardia and progresses despite lying down. In the SCA, say the diagnosis out loud (“I think this is anaphylaxis”) so that the team, and the examiner, know why you are reaching for adrenaline."}
     ]},

    {id:"adrenaline", nav:"IM adrenaline", title:"IM adrenaline — first-line, immediately", sub:"<b>Give IM adrenaline 1 mg/mL (1:1000) immediately into the anterolateral middle third of the thigh as soon as anaphylaxis is recognised. Call 999 and summon help. Repeat after 5 minutes if airway, breathing or circulation problems persist.</b>",
     blocks:[
       {b:"table", head:["Age","IM adrenaline dose","Volume of 1 mg/mL (1:1000)"], rows:[
         ["<b>Adult &amp; child &gt;12 y</b>","<b>500 µg</b>","0.5 mL"],
         ["Child 6–12 y","<b>300 µg</b>","0.3 mL"],
         ["Child 6 months–6 y","<b>150 µg</b>","0.15 mL"],
         ["Child &lt;6 months","<b>100–150 µg</b>","0.1–0.15 mL"]
       ]},
       {b:"kv", rows:[
         ["Dose source","Use the age-based doses in the current Resuscitation Council UK/BSACI emergency poster and local emergency-drug protocol. If an older child is unusually small or prepubertal, follow current local paediatric emergency guidance or obtain immediate senior advice; do not delay the first dose."],
         ["Route &amp; repeat","Anterolateral thigh; repeat every 5 minutes as needed pending response. IV adrenaline is for specialists only (titrated, monitored)."],
         ["If an AAI is to hand","Using the patient's own auto-injector is acceptable and avoids delay while an ampoule is drawn up; then give the appropriate clinical IM dose from the practice kit if further treatment is needed and equipment and staff are available — AAIs do not replace ampoule-based IM adrenaline in the clinical setting."],
         ["Contraindications","There are <b>none in anaphylaxis</b>. Age, pregnancy, ischaemic heart disease and beta-blocker use are reasons for care, not for withholding the IM dose."],
         ["Practice readiness","Per the local practice emergency-drug policy: adrenaline 1 mg/mL (1:1000) ampoules; syringes and needles long enough for IM injection; oxygen and oxygen-delivery equipment; monitoring equipment; IV access and crystalloid fluids where available; a current anaphylaxis algorithm and the RCUK/BSACI dose poster displayed; staff training and simulation in recognition and treatment; and clear arrangements for 999 transfer (Resuscitation Council UK quality standards for primary care). Check the kit's expiry dates as part of routine emergency-drug checks."],
         ["What to say to 999","“Adult with suspected anaphylaxis after [trigger], one IM adrenaline dose given at [time], airway/breathing/circulation problem is [X].” Note the time of every dose for the handover."]
       ]},
       {b:"why", html:"Adrenaline reverses the pathophysiology of anaphylaxis — it is a vasoconstrictor (restoring blood pressure), a bronchodilator, and it stabilises mast cells. The intramuscular anterolateral thigh route gives rapid, reliable absorption with a wide safety margin, whereas IV adrenaline in untrained hands causes arrhythmia and is reserved for specialists. The commonest cause of a fatal outcome is delayed or omitted adrenaline. Doses are banded by age rather than weight so they can be given without calculation in an emergency; the 5-minute repeat interval reflects the time IM adrenaline takes to reach peak effect."}
     ]},

    {id:"support", nav:"Position &amp; support", title:"Position and supportive care", sub:"Posture, oxygen and fluids alongside — never instead of — repeat IM adrenaline.",
     blocks:[
       {b:"kv", rows:[
         ["Position","Keep the patient <b>lying flat, with or without leg elevation</b>. If breathing is easier sitting, allow a semi-recumbent position — do not force a patient with severe breathing difficulty to lie fully flat. <b>Do not let the patient stand, walk or sit up suddenly</b> — this can precipitate fatal cardiovascular collapse within minutes. In pregnancy, use the left lateral position. Remove the trigger (e.g. stop an infusion, remove a sting)."],
         ["Airway &amp; oxygen","Establish/maintain the airway; give <b>high-concentration oxygen</b> for significant respiratory or circulatory compromise, titrated once stable according to local emergency oxygen policy. Monitor SpO₂, BP and ECG — but do not delay adrenaline to set up monitoring."],
         ["Fluids","If there is hypotension, shock or poor response to the first IM adrenaline dose, obtain IV or IO access and give <b>crystalloid promptly</b>, alongside repeat IM adrenaline — adult 500–1000 mL initially; child 10 mL/kg, repeated according to clinical response and local protocol, when skills/equipment allow. Obtaining IV access must not delay the next IM adrenaline dose."],
         ["What NOT to give","<b>Antihistamines and corticosteroids have no role in acute resuscitation</b> (ineffective; hydrocortisone no longer recommended routinely). A non-sedating oral antihistamine may be used <b>after</b> stabilisation for residual urticaria or itch only. Antihistamines do not treat airway, breathing or circulatory compromise and must not delay adrenaline. Corticosteroids may be considered after initial resuscitation for refractory reactions or a concomitant asthma exacerbation, but are not routine treatment and do not prevent biphasic reactions."],
         ["Pregnancy","Lie on the <b>left side</b> to take the uterus off the inferior vena cava; give adrenaline at the usual adult dose."],
         ["Bronchospasm","After adrenaline, persisting wheeze can be treated with inhaled or nebulised salbutamol as for acute asthma — but it is an add-on, not a substitute for repeat adrenaline. Do not give nebulised adrenaline as a substitute for IM adrenaline; it may be considered by appropriately trained clinicians for persistent upper-airway obstruction while awaiting expert airway support."],
         ["While waiting for the ambulance","Stay with the patient, repeat observations every few minutes, keep the second adrenaline dose drawn up, and record timings. Be ready to start basic life support if they lose output."]
       ]},
       {b:"warn", html:"⚠️ <b>IM adrenaline is the only first-line drug</b> — give it early into the anterolateral thigh and repeat after 5 minutes if needed. Never delay it for antihistamines or steroids (no role in resuscitation). Keep the patient lying down; sitting or standing up suddenly can cause fatal cardiovascular collapse."},
       {b:"why", html:"Posture is a genuinely life-saving and under-appreciated intervention: in the vasodilated, fluid-depleted circulation of anaphylaxis, suddenly sitting or standing can cause an “empty ventricle” and cardiac arrest, so patients are kept supine with legs raised. The 2021 guidance removed routine antihistamines and steroids from the acute algorithm because they neither treat the airway/circulatory collapse nor reliably prevent biphasic reactions, and giving them can distract from, or delay, repeat adrenaline. Fluid is given because anaphylaxis shifts a large volume out of the circulation within minutes; in primary care, where IV access and fluids may not be available, posture and repeat IM adrenaline are the main tools until paramedics arrive."}
     ]},

    {id:"refractory", nav:"Refractory", title:"Refractory anaphylaxis — specialist / critical-care management", sub:"<b>Refractory anaphylaxis = persisting respiratory or cardiovascular compromise despite two appropriate doses of IM adrenaline.</b> This is a peri-arrest emergency — escalate to the highest level of help available (999 / critical care / ALS team). Continue IM adrenaline every 5 minutes and IV fluids while awaiting expert help and transfer.",
     blocks:[
       {b:"kv", rows:[
         ["Recheck the basics","Confirm the diagnosis, that the <b>IM dose, site and route</b> were correct, the trigger is removed, and high-flow oxygen + an <b>IV fluid bolus</b> have been given."],
         ["IV adrenaline infusion","<b>Specialist/critical-care intervention, not routine GP implementation.</b> IV adrenaline infusion, invasive monitoring and vasopressors require appropriately trained clinicians, continuous monitoring and critical-care support (ALS / critical-care / 999 paramedic support). No infusion rates are given here — follow the local ambulance/critical-care protocol, as incorrect dilution or rate can cause fatal adrenaline toxicity. Bolus IV adrenaline is for specialists/cardiac arrest only."],
         ["Second-line agents","Glucagon may be considered by specialist teams for refractory anaphylaxis in patients taking beta-blockers. It can cause vomiting and aspiration risk, so airway protection and specialist monitoring are important. Persisting bronchospasm → treat as severe asthma."],
         ["If cardiac arrest","Start <b>ALS</b> immediately; prolonged resuscitation may be appropriate."]
       ]},
       {b:"why", html:"A minority of reactions do not respond to repeated IM adrenaline; the 2021 guidance formalised “refractory anaphylaxis” precisely so that teams escalate to specialist-led IV adrenaline infusion and fluid resuscitation rather than simply repeating IM doses indefinitely. Patients on beta-blockers may be resistant to adrenaline, which is why specialist teams may consider glucagon. The infusion route demands monitoring and trained hands because uncontrolled IV adrenaline causes arrhythmia and myocardial ischaemia."}
     ]},

    {id:"tryptase", nav:"Tryptase", title:"Confirm the diagnosis — mast cell tryptase", sub:"Anaphylaxis is a <b>clinical diagnosis</b> — never delay adrenaline to take bloods — but timed tryptase samples can support it afterwards and underpin the allergy work-up. Do not delay treatment or transfer to obtain tryptase.",
     blocks:[
       {b:"table", head:["Sample","When","Notes"], rows:[
         ["Who","—","NICE NG258 (2026): take timed samples in adults and young people aged 16 and over; in children under 16, consider them when the suspected cause is venom, a drug, or unknown (idiopathic)"],
         ["<b>Sample 1</b>","As soon as feasible <b>after emergency treatment has started</b>","Do not interrupt treatment"],
         ["<b>Sample 2</b>","Ideally <b>1–2 hours after symptom onset</b> (and no later than 4 hours)","Around the peak"],
         ["<b>Baseline</b>","After recovery — usually at specialist follow-up or at least <b>24 hours after complete resolution</b>, according to the local allergy pathway","Not a reason to delay discharge or emergency transfer. A persistently raised baseline requires specialist interpretation and may indicate an underlying mast-cell disorder or hereditary alpha-tryptasaemia"]
       ]},
       {b:"warn", html:"<b>Interpretation:</b> tryptase <b>supports, but does not establish or exclude</b>, the diagnosis. Compare acute and baseline values in the clinical context; tryptase should not override the clinical history. A normal acute tryptase does <b>not</b> exclude anaphylaxis (common in food-triggered/normotensive reactions)."},
       {b:"why", html:"Tryptase is released when mast cells degranulate and peaks 1–2 hours after the reaction, so a single level is hard to interpret — it is the change between an acute sample and the baseline that supports the diagnosis. A persistently raised baseline needs specialist interpretation — it may indicate a mast-cell disorder or hereditary alpha-tryptasaemia, relevant to recurrent or severe reactions. Crucially, a normal tryptase never overrides a convincing clinical picture, particularly in food-triggered reactions where levels often stay normal. In practice the GP rarely takes the acute samples, but should check the discharge letter says whether they were done: if not, the allergy clinic will need to know, and a baseline level can be requested with the referral."}
     ]},

    {id:"observe", nav:"999 &amp; observe", title:"Emergency assessment and risk-stratified observation", sub:"All patients treated for suspected anaphylaxis require <b>emergency assessment</b> and an appropriate period of <b>observation</b> — a <b>biphasic reaction</b> can recur hours after apparent recovery, without re-exposure to the trigger.",
     blocks:[
       {b:"warn", html:"<b>Transfer everyone.</b> A GP surgery should not usually observe and discharge a patient after treating anaphylaxis — call 999 and transfer for emergency assessment, even if the patient improves after one dose of adrenaline. Discharge is only considered when the NICE/RCUK low-risk criteria are fulfilled."},
       {b:"table", head:["Observation from resolution","Applies when"], rows:[
         ["<b>At least 2 hours</b>","Only when all low-risk criteria are met: a good response to a <b>single</b> IM adrenaline dose and symptoms have completely resolved, the patient has AAIs and has been trained, and there is adequate supervision (Resuscitation Council UK 2021; NICE NG258, 2026)"],
         ["<b>At least 6 hours</b>","<b>Two</b> IM doses were needed, or there is a history of a biphasic reaction"],
         ["<b>At least 12 hours</b>","A severe reaction needing <b>more than two</b> doses, severe asthma or severe respiratory compromise, possible continuing absorption of the allergen (e.g. slow-release drugs), presentation late in the evening or at night, inability to respond to any deterioration, or discharge to an area where emergency care is hard to reach"]
       ]},
       {b:"kv", rows:[
         ["<span class='pill pill-red'>Children</span>","Under-16s who cannot be discharged under these criteria are admitted under an <b>inpatient paediatric medical team</b> (NICE NG258, 2026)."],
         ["Information at discharge","Before going home the patient (or carer) should receive information on what anaphylaxis is, the risk of a biphasic reaction, what to do if it recurs, how to use the AAI, the allergy referral, and patient support groups (NICE NG258)."]
       ]},
       {b:"why", html:"A biphasic reaction is a second wave of anaphylaxis occurring after complete resolution of the first, typically within hours and without further allergen exposure; because it can be as severe as the index event, observation is mandatory even when the patient looks fully recovered. The observation duration is deliberately risk-based rather than a fixed number, concentrating monitoring on those most likely to deteriorate again. For the GP, this step is about the handover: every patient treated in the surgery goes to hospital by ambulance, even if they look well once adrenaline has worked, because the observation clock and the discharge criteria are applied there."}
     ]},

    {id:"aai", nav:"Auto-injectors", title:"Discharge — two adrenaline auto-injectors", sub:"Prescribe two devices, train on the exact brand, and rehearse the MHRA 2023 use-and-posture steps.",
     blocks:[
       {b:"kv", rows:[
         ["Prescribe two","Offer <b>two adrenaline auto-injectors (AAIs)</b> after suspected anaphylaxis <b>unless the reaction was due to a drug allergy and the drug can be easily avoided</b> (NICE NG258) — such patients still need accurate drug-allergy documentation and specialist referral where indicated. Prescribe two devices, not one device to be used twice, and tell the patient to carry <b>both, on their person, at all times</b>."],
         ["Demonstrate the device","Show how to use <b>their specific brand</b> (designs differ); have the patient/carer demonstrate back. <b>Avoid switching brands</b> without re-training."],
         ["Dose by device","Choose the AAI strength according to the patient's weight, age, the device-specific SPC/BNF guidance and the specialist allergy plan — thresholds vary by brand and product, so do not apply one universal cut-off. Prescribe a specific brand and demonstrate that exact device; reassess the dose as a child grows. Some adults, particularly larger adults, may need a 500 µg device where licensed and appropriate. (A 300 µg AAI delivers less than the 500 µg IM resuscitation dose — one more reason to call 999 every time.)"],
         ["Replace &amp; check","Carry <b>two in-date AAIs</b> at all times (MHRA Drug Safety Update, June 2023). Note expiry dates; replace used or expired devices promptly. Register for the manufacturer's expiry-alert service where available."],
         ["Schools","Schools in the UK may hold spare AAIs for pupils known to be at risk; make sure the child's written plan and consent are with the school."],
         ["Other adrenaline devices","Follow the current device-specific instructions and local formulary. This guide describes IM adrenaline and adrenaline auto-injectors; any non-injectable adrenaline product should follow its own licensed instructions and local pathway."]
       ]},
       {b:"timeline", items:[
         {n:"1", when:"First signs", title:"Use the AAI immediately (MHRA 2023)", html:"Into the <b>outer thigh</b> (through clothing if needed), holding it in place for the time the device specifies."},
         {n:"2", when:"Straight away", title:"Call 999 and say “anaphylaxis”", html:"Ask for an ambulance — even if symptoms improve."},
         {n:"3", when:"While waiting", title:"Position (MHRA 2023)", html:"<b>Lie down with legs raised</b>; sit up only if breathing is difficult, and lie on the left side if pregnant. <b>Do not stand or walk</b>, even if feeling better."},
         {n:"4", when:"After 5 minutes", title:"Second device", html:"If symptoms do not improve or recur, use the second device after <b>5 minutes</b> while waiting for emergency services (Resuscitation Council UK 2021 repeat interval; MHRA 2023)."}
       ]},
       {b:"why", html:"Two injectors are prescribed because a single device may misfire, be used incorrectly, or be insufficient if symptoms recur before the ambulance arrives — and the fixed AAI dose (often 300 µg) can be lower than the 500 µg given under medical supervision, so a second dose is frequently needed. Hands-on, brand-specific training matters because the commonest reason an injector fails to help in a real event is incorrect technique under stress. The MHRA's 2023 safety campaign added the posture advice (lie down, legs up, do not get up) because deaths have followed patients standing or walking after using an AAI; the GP review is the natural moment to rehearse these steps, not just to issue the prescription."}
     ]},

    {id:"refer", nav:"Refer", title:"Specialist allergy / immunology referral", sub:"NICE NG258: <b>refer all patients after a suspected anaphylactic reaction to a specialist allergy service</b> to identify the trigger and reduce the risk of further reactions.",
     blocks:[
       {b:"kv", rows:[
         ["What the clinic adds","Allergen testing (skin-prick / specific IgE), confirmation of the trigger, advice on cross-reactivity, and where appropriate <b>immunotherapy</b> (e.g. venom, some foods)."],
         ["Document the suspected trigger","On the referral include: the suspected trigger and dose/exposure; time from exposure to onset; exact symptoms and sequence; observations, including BP and SpO₂; adrenaline doses and timings; acute and baseline tryptase results; co-factors (exercise, NSAIDs, alcohol, infection, menstruation); asthma and cardiovascular history; beta-blocker/ACE-inhibitor use; previous reactions; photographs if available; and for drugs the exact drug, formulation, route and batch; flag drug culprits as an <b>allergy</b> in the record to prevent re-exposure."],
         ["Interim advice","Strict avoidance of the suspected trigger until specialist review; carry both AAIs meanwhile."],
         ["Drug culprits","Record the drug, the reaction and the date in the allergy field of the GP record and on any prescribing system, and tell the patient the name of the drug to avoid (NICE CG183, Drug allergy, 2014). Record the exact suspected drug, reaction, timing and route, and avoid re-exposure pending specialist assessment. Do not unnecessarily label all related drug classes as contraindicated — seek specialist drug-allergy advice on alternative agents and cross-reactivity (<a href='https://www.nice.org.uk/guidance/cg183'>NICE CG183</a>)."],
         ["Allergy action plans","NICE NG258 links to the British Society for Allergy and Clinical Immunology (BSACI) action plans — use the version matched to the patient's device."],
         ["Vaccine reactions","Report vaccine-related reactions through the MHRA Yellow Card scheme."]
       ]},
       {b:"why", html:"Identifying the precise trigger is the single most effective long-term intervention, because reliable avoidance prevents recurrence — and specialist testing also uncovers cross-reacting allergens and co-factors (exercise, NSAIDs, alcohol) that the patient could not deduce alone. For venom and selected food allergies, immunotherapy offered through these services can be disease-modifying, which is why NICE NG258 (2026) recommends referral of everyone who has had emergency treatment for suspected anaphylaxis, not just severe cases. Vaccine-related reactions also need reporting through the MHRA Yellow Card scheme."}
     ]},

    {id:"safety", nav:"Follow-up &amp; safety-net", title:"Avoidance, action plan and safety-netting", sub:"An auto-injector only helps if the patient and those around them recognise the reaction, reach the device and use it early.",
     blocks:[
       {b:"tiles", v:"life", items:[
         {t:"Avoid the trigger", html:" Educate on reading food labels, declaring allergies when eating out, and avoiding the culprit drug/insect; address co-factors (exercise, NSAIDs, alcohol)."},
         {t:"Written action plan", html:" Personalised plan: recognise symptoms, give adrenaline early, call 999, lie flat with legs raised. Share with school/workplace/carers."},
         {t:"Medical-alert ID", html:" Consider a bracelet/identifier naming the allergy, so responders act fast if the patient can't speak."},
         {t:"After any AAI use", html:" Always call 999 and attend hospital even if symptoms improve — a second device may be needed and biphasic reactions occur."}
       ]},
       {b:"kv", rows:[
         ["GP follow-up","Confirm the allergy is coded, AAIs are in date and the patient/carers remain confident with technique; re-train at reviews. Ensure the specialist referral has been actioned."],
         ["<span class='pill pill-red'>Return / 999</span>","Any recurrence of airway, breathing or circulation symptoms — give adrenaline and call 999."],
         ["Asthma","Poorly controlled asthma increases the risk of severe respiratory outcomes in food-allergic patients — optimise asthma control; review inhaler technique and the asthma plan at the same visit."],
         ["Medicines review","Ask the allergy service about beta-blockers and ACE inhibitors in patients with venom allergy or recurrent reactions, rather than stopping them unilaterally."]
       ]},
       {b:"say", html:"<b>SCA phrasing:</b> “What happened to you was anaphylaxis — a severe allergic reaction that can affect breathing and blood pressure. The adrenaline pen is the treatment: use it straight away, then lie down with your legs up and call 999. If you're no better in five minutes, use the second pen. I'll refer you to the allergy clinic to find out exactly what caused it.”"},
       {b:"why", html:"An auto-injector is only useful if the patient and those around them recognise the reaction, reach the device, and use it correctly and early — so a written action plan, shared with school or workplace, and regular technique re-checks are as important as the prescription itself. Coding a drug culprit as a formal allergy in the record is a specific safety step that prevents fatal re-prescription. Teenagers and young adults carry the highest risk of fatal food reactions, often because they do not carry their devices, so the review should include an honest conversation about carrying both pens every day."}
     ]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every recommendation on this page is traceable to a named source. Follow current Resus Council UK guidance, the current device-specific instructions and your local emergency protocol.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>Resuscitation Council UK — Emergency treatment of anaphylactic reactions: guidelines for healthcare providers (2021)</b><br><a href="https://www.resus.org.uk/library/additional-guidance/guidance-anaphylaxis/emergency-treatment" rel="noopener">resus.org.uk</a><span class="rd"> — A/B/C recognition, IM adrenaline doses and 5-minute repeat, positioning, oxygen and fluids, no routine antihistamine/steroid, refractory anaphylaxis, tryptase timing, observation periods; RCUK/BSACI dose poster and quality standards for primary care</span></li>'+
         '<li><b>NICE NG258 — Anaphylaxis: assessment and referral after emergency treatment (May 2026, replaced CG134)</b><br><a href="https://www.nice.org.uk/guidance/ng258" rel="noopener">nice.org.uk/guidance/ng258</a><span class="rd"> — timed tryptase, observation and discharge criteria, admission of under-16s, two auto-injectors with the easily-avoidable-drug exception, information at discharge, referral of everyone to a specialist allergy service, BSACI action plans</span></li>'+
         '<li><b>NICE CG183 — Drug allergy: diagnosis and management (2014)</b><br><a href="https://www.nice.org.uk/guidance/cg183" rel="noopener">nice.org.uk/guidance/cg183</a><span class="rd"> — documenting drug culprits in the allergy record, telling the patient the drug to avoid, specialist advice on alternatives and cross-reactivity</span></li>'+
         '<li><b>MHRA Drug Safety Update — adrenaline auto-injectors (June 2023)</b><br><a href="https://www.gov.uk/drug-safety-update?keywords=adrenaline+auto-injectors" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> — use immediately, call 999 and say “anaphylaxis”, lie down with legs raised, do not stand or walk, second device after 5 minutes, carry two in-date devices</span></li>'+
         '<li><b>MHRA Yellow Card scheme</b><span class="rd"> — reporting of vaccine-related reactions</span></li>'+
         '<li><b>BNF / BNFC</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — adrenaline and auto-injector products; device-specific SPCs for AAI strength</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Anaphylaxis is an emergency. IM adrenaline is first-line; antihistamines/steroids have no role in acute resuscitation. In primary care: treat immediately, call 999 and transfer. Based on the Resuscitation Council UK Emergency treatment of anaphylactic reactions guidelines (2021), NICE NG258 Anaphylaxis: assessment and referral after emergency treatment (May 2026, replaced CG134), NICE CG183 Drug allergy (2014), the MHRA Drug Safety Update on adrenaline auto-injectors (June 2023) and the BNF/BNFC. Follow current Resus Council UK guidance, the current device-specific instructions and your local emergency protocol."
});
