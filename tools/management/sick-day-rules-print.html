MG.render({

  stemTitle:"Acute illness and medicines: screen first for DKA, HHS, AKI, sepsis and adrenal crisis; continue insulin and genuinely time-critical medicines; temporarily withhold selected AKI-risk or hypoglycaemia-risk medicines only during significant dehydration; increase steroid replacement when indicated; monitor narrow-margin drugs; and document exactly when each medicine should restart",
  stemSub:"One page for the whole task: screen for the emergency (DKA, HHS, AKI, sepsis, adrenal crisis), map the drug list onto the groups, consider temporarily withholding selected SADMAN drugs during a significant dehydrating illness (individualised, especially in heart failure, CKD and frailty), keep insulin and the time-critical medicines going, give extra glucocorticoid when indicated by the individual steroid plan, check the level-sensitive drugs, act on fever in anyone taking a drug that can cause agranulocytosis, and send the patient home with a written plan that says when to restart. The killers these rules exist to prevent are diabetic ketoacidosis, acute kidney injury and adrenal crisis.",

  ],
  lead:'<div class="mg-layers"><a href="#severe"><b>Emergency?</b><small>DKA · HHS · AKI · crisis</small></a><a href="#confirm"><b>Who is at risk</b><small>Map the drug list</small></a><a href="#workup"><b>Assess</b><small>Glucose · ketones · fluids</small></a><a href="#ladder"><b>Act</b><small>Hold · continue · increase</small></a><a href="#refer"><b>Refer</b><small>Admit or home</small></a></div>',
  quickSub:"If you read nothing else on this page, read these six cards. Every number traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Never stop basal insulin in type 1 diabetes", html:"<b>Never stop basal insulin in established type 1 diabetes, even if the patient is not eating.</b> Insulin-treated patients need a personalised sick-day plan; insulin doses may need adjustment according to glucose, ketones, food intake and the diabetes team's instructions. Do not omit insulin in suspected DKA, and do not stop it en route to hospital. In type 2 diabetes some need continued basal insulin and some a dose reduction with recurrent hypoglycaemia or very poor intake — never give blanket advice to continue all insulin at the usual dose. Dose adjustment: see <a href='diabetes-unwell-insulin.html'>Feeling unwell on insulin</a>."},
    {tone:"red", h:"A normal glucose does not exclude DKA on an SGLT2 inhibitor", html:"SGLT2 inhibitors cause euglycaemic DKA — the glucose looks reassuringly normal while the patient is ketoacidotic. Check blood ketones promptly in anyone taking an SGLT2 inhibitor who is acutely unwell, vomiting, dehydrated or has symptoms suggestive of DKA, regardless of glucose concentration, and interrupt the drug during significant acute illness, dehydration or surgery. Restart only when clinically recovered, eating and drinking normally, and ketones are normal, in accordance with the local diabetes pathway."},
    {tone:"amber", h:"SADMAN — consider withholding during significant dehydration", html:"<b>S</b>ulfonylureas / <b>S</b>GLT2 inhibitors · <b>A</b>CE inhibitors · <b>D</b>iuretics · <b>M</b>etformin · <b>A</b>RBs · <b>N</b>SAIDs. Consider temporarily withholding selected medicines during a significant dehydrating illness, particularly vomiting, diarrhoea or fever with poor intake, hypotension or suspected AKI — their risk may increase through hypoglycaemia, euglycaemic DKA, AKI, hyperkalaemia and lactic acidosis. Apply this to the individual patient and indication, especially in heart failure, CKD and frailty, and provide a written restart plan. A cough, uncomplicated sore throat or mild viral illness with normal intake should not automatically trigger a full medication hold."},
    {tone:"blue", h:"Ketones are the early-warning system", html:"Blood ketones: &lt;0.6 normal · 0.6–1.5 recheck as the patient's own diabetes-team plan specifies · 1.5–2.9 urgent diabetes-team advice and close reassessment, with emergency assessment if rising, vomiting, unable to maintain fluids, clinically unwell or unable to follow the plan · 3.0 or more (or significant ketonuria) with illness is an emergency. A rising ketone level identifies evolving DKA hours before the patient looks unwell, which is what makes home rescue possible."},
    {tone:"amber", h:"Steroids are the exception — increase, don't hold", html:"Anyone with adrenal insufficiency or at risk of it, following their individual written steroid plan: during fever, infection or injury needing medical attention take an <b>extra 20 mg hydrocortisone at once</b>, then <b>at least 40 mg hydrocortisone a day in 2–4 doses</b> (or at least 10 mg prednisolone a day) until recovered. Persistent vomiting or diarrhoea (oral absorption unreliable, even if not yet hypotensive) → <b>100 mg hydrocortisone IM or IV</b> and emergency admission (NICE NG243)."},
    {tone:"green", h:"The restart step matters as much as the hold", html:"Restart drug by drug: an SGLT2 inhibitor when clinically recovered, eating and drinking normally and ketones are normal; metformin when eating and drinking normally and renal function is satisfactory; an ACE inhibitor, ARB or diuretic by BP, volume status, potassium, renal function and indication, rechecking U&amp;E after AKI or significant illness; a sulfonylurea when oral intake is reliable; an NSAID not routinely. An ACE inhibitor never restarted after an admission is a common and silent medicines-safety error."}
  ],
  pathwaySub:"The whole consultation in six moves. The red step decides home versus hospital.",
  pathway:[
    {title:"Screen for the emergency", html:"Vomiting and unable to keep fluids down · rising or high ketones · drowsy, deep breathing, abdominal pain (DKA) · marked dehydration or AKI · possible sepsis (NEWS2 ≥5 prompts urgent assessment) · very high glucose with HHS features · collapse or hypotension in someone steroid-dependent (adrenal crisis) · possible neutropenic sepsis · serious drug toxicity.", alert:true},
    {title:"Map the drug list", html:"<b>Insulin and time-critical medicines</b> (do not omit), the <b>SADMAN</b> drugs (consider withholding during significant dehydration, individualised), <b>glucocorticoids in the steroid-dependent</b> (increase), <b>narrow-margin drugs</b> such as lithium, digoxin, DOACs and warfarin (check and adjust), and <b>drugs that can cause agranulocytosis</b> (fever = urgent clinical assessment and FBC)."},
    {title:"Quantify the risks", html:"<b>Capillary glucose every 2–4 hours</b>, blood ketones if glucose is above 11 mmol/L, the patient feels unwell, or they take an SGLT2 inhibitor (whatever the glucose), fluid status, and <b>U&amp;E if there has been diarrhoea and vomiting on SADMAN drugs</b>. Drug levels or INR where relevant."},
    {title:"Act on each group", html:"Withhold selected SADMAN drugs where indicated, keep insulin going with correction doses per the patient's own sick-day plan, give sick-day glucocorticoid doses where indicated, seek same-day advice on an alternative route for anything time-critical, and encourage fluids if safe, individualised to the patient."},
    {title:"Decide home versus admit", html:"The pivotal question is behavioural — can they keep fluids down and follow the plan? Living alone and deteriorating, or unable to follow the plan, lowers the threshold."},
    {title:"Write it down, and plan the restart", html:"A written sick-day card with the exact medicines to hold and to continue, the individual insulin plan, ketone thresholds, steroid plan, emergency contacts and <b>when to restart each drug</b>; name the person responsible for reconciling medicines after the illness."}
  ],
  sections:[

    {id:"severe", nav:"Emergency?", title:"When acute illness becomes an emergency",
     sub:"Sick day rules exist to prevent three killers — DKA, AKI and adrenal crisis. Screen for them before deciding the patient is safe at home.",
     blocks:[
       {b:"warn", html:"Admit now if: blood ketones 3.0 mmol/L or more (or urine ketones 2+ or more) in an unwell patient, persistent vomiting or unable to keep fluids down, drowsiness or Kussmaul breathing with abdominal pain and pear-drop breath (DKA), a glucose of 30 mmol/L or more with confusion and marked dehydration in an older person with type 2 diabetes (HHS), or collapse or hypotension in someone steroid-dependent (adrenal crisis — give 100 mg hydrocortisone IM first). Do not stop insulin en route. Blood ketones 1.5–2.9 mmol/L require urgent diabetes-team advice and close reassessment. If ketones are rising, the patient is vomiting, unable to maintain fluids, clinically unwell or unable to follow the plan, arrange emergency assessment rather than relying on repeat home testing."},
       {b:"table", head:["Feature","What it is","Action"], rows:[
         ["<b>Vomiting and unable to keep fluids down</b>","Cannot follow oral sick-day rules — dehydration and ketosis escalate quickly, and oral steroids and time-critical drugs are not absorbed","<b>Same-day assessment; likely admission for IV fluids ± insulin ± parenteral hydrocortisone</b>"],
         ["Ketones rising, or blood ketones ≥3.0 mmol/L (or urine 2+ or more) with the patient unwell","<b>Impending or established DKA</b> — JBDS 02 uses ketones ≥3.0 mmol/L or ketonuria 2+ or more, with glucose ≥11 mmol/L or known diabetes, and acidosis","<b>999. Do NOT stop insulin.</b> IV fluids and a fixed-rate insulin infusion in hospital"],
         ["Drowsy, confused, deep sighing (Kussmaul) breathing, abdominal pain, fruity breath","<b>Established DKA</b> — a medical emergency","<b>999</b>"],
         ["Older patient with type 2 diabetes, glucose 30 mmol/L or more, marked dehydration, drowsiness, low or no ketones","<b>Hyperosmolar hyperglycaemic state (HHS)</b> — JBDS 06 adds a serum osmolality of 320 mOsm/kg or more","<b>999</b>"],
         ["Reduced urine output, light-headedness, a postural drop after diarrhoea and vomiting — especially on an ACE inhibitor, ARB, diuretic, metformin or NSAID","<b>Acute kidney injury</b>","<b>Consider withholding the relevant SADMAN drugs (individualised; seek advice early in heart failure), check U&amp;E, same-day assessment if unwell</b>"],
         ["<b>NEWS2 ≥5</b>, fever with rigors, looks septic","<b>Possible sepsis</b>","NEWS2 ≥5 should prompt urgent clinical assessment and escalation according to the local sepsis pathway; it is not, by itself, a diagnosis of sepsis or an automatic admission rule. Treat the source: pneumonia, pyelonephritis, abscess or cellulitis"],
         ["Ketones or high glucose with no obvious cause","<b>Find the precipitant</b> — infection (urine, chest, skin, foot), missed or insufficient insulin, insulin-pump failure, myocardial infarction, pancreatitis, alcohol, or a new presentation of diabetes","Ketogenesis continues until the cause is treated; an MI or pancreatitis needs 999 in its own right"],
         ["Hypotension, collapse, vomiting, drowsiness or hyponatraemia in someone with adrenal insufficiency or on long-term steroids","<b>Adrenal crisis</b>","<b>100 mg hydrocortisone IM or IV immediately and emergency transfer</b> — do not delay treatment for blood tests or a confirmed diagnosis; IV 0.9% sodium chloride in the acute setting per the emergency protocol"],
         ["Fever, sore throat or mouth ulcers on carbimazole, clozapine, a DMARD or recent chemotherapy","<b>Possible agranulocytosis or neutropenic sepsis</b>","Urgent clinical assessment and FBC. Carbimazole/propylthiouracil: stop. Clozapine: local clozapine monitoring service and urgent medical assessment — not FBC alone, and do not stop without specialist input. DMARDs: per shared-care protocol. Any unwell patient with recent systemic anticancer treatment, known neutropenia or significant chemotherapy-related immunosuppression: urgent acute oncology assessment — do not delay referral for a community FBC"]
       ]},
       {b:"why", html:"Acute illness raises the counter-regulatory hormones — <b>cortisol, catecholamines, glucagon and growth hormone</b> — which drive hyperglycaemia and ketogenesis <b>even when the patient is eating less</b>. In type 1 diabetes, reduced or omitted insulin during that surge is <b>the single commonest precipitant of DKA</b>. At the same time, dehydration from vomiting and diarrhoea reduces renal perfusion, so continuing nephrotoxic or renally-cleared drugs tips borderline kidneys into AKI — and, for metformin, raises the risk of <b>lactic acidosis</b>. Someone whose adrenal glands cannot respond to illness cannot mount that cortisol surge at all, and without extra glucocorticoid slides into adrenal crisis. <b>Recognising who cannot be managed at home is the core safety skill.</b>"},
       {b:"dl", rows:[
         ["<b>NG12 stated honestly</b>","Sick day rules have no NICE NG12 suspected-cancer criterion, and none should be invented for one. This page is an acute medication-safety task. If an illness episode turns out not to be intercurrent — unexplained weight loss, persistent symptoms, or an unexplained anaemia found on the sick-day bloods — that is a separate work-up on its own merits, not a sick-day decision"]
       ]}
     ]},

    {id:"confirm", nav:"Who is at risk", title:"The medication review — map every drug to its action",
     sub:"Map the patient's drugs onto these groups. That converts a vague “they're unwell” into a concrete plan. Most other regular medicines simply continue.",
     blocks:[
       {b:"table", head:["Group","Who or what","Action"], rows:[
         ["<b>Insulin — type 1 or type 2 diabetes</b>","Anyone insulin-treated","Highest priority. Never stop basal insulin in type 1 diabetes; requirements often rise during illness. Doses follow the patient's personalised sick-day plan — not a blanket continue-at-usual-dose rule"],
         ["<b>SADMAN drugs</b>","<b>S</b>ulfonylureas / <b>S</b>GLT2 inhibitors · <b>A</b>CE inhibitors · <b>D</b>iuretics · <b>M</b>etformin · <b>A</b>RBs · <b>N</b>SAIDs","<b>Consider temporarily withholding during a significant dehydrating illness</b>, individualised to the patient and indication; drug-specific restart rules (see Act)"],
         ["<b>GLP-1 receptor agonists</b>","Semaglutide, dulaglutide, liraglutide, tirzepatide","If associated with persistent vomiting, severe gastrointestinal symptoms, dehydration or suspected pancreatitis, withhold further doses and seek clinical advice; consider pancreatitis or gallbladder disease where indicated. Routine omission for a mild non-dehydrating illness is not required"],
         ["<b>Glucocorticoids — adrenal insufficiency or steroid-dependent</b>","Replacement therapy, or long-term steroid therapy at or above the card threshold","<b>INCREASE when indicated — sick-day dosing, never a hold</b>, per an individual written steroid plan; do not omit fludrocortisone without specialist advice. See the steroid section and the <a href='addisons-disease.html'>Addison's disease protocol</a>"],
         ["<b>Time-critical medicines</b>","Levodopa and other Parkinson's drugs, antiepileptics, insulin, glucocorticoids, immunosuppressants after transplant, antiretrovirals","<b>Do not omit or delay</b> — if the patient cannot swallow or is vomiting, seek same-day specialist advice on an alternative formulation or route"],
         ["<b>Narrow-margin drugs</b>","<b>Lithium</b>, <b>digoxin</b>, <b>DOACs</b> (especially dabigatran), <b>warfarin</b>, theophylline, methotrexate, phenytoin, ciclosporin, tacrolimus","Check level, INR or renal function and adjust"],
         ["<b>Drugs that can cause agranulocytosis</b>","Carbimazole, propylthiouracil, clozapine, sulfasalazine and other DMARDs, co-trimoxazole, carbamazepine, mirtazapine, dapsone, deferiprone","Fever, sore throat or mouth ulcers → urgent clinical assessment and FBC; drug-specific action (see Fever on drugs)"],
         ["<b>Everything else</b>","Most regular medicines","Continue unless there is a specific reason — sick day rules are for short-term illness, not a reason to stop chronic therapy"]
       ]},
       {b:"why", html:"SADMAN is a deliberately memorable shorthand for the drugs that either impair the kidney's ability to cope with dehydration (ACE inhibitors, ARBs, diuretics, NSAIDs), <b>accumulate dangerously in AKI</b> (metformin → lactic acidosis), <b>or cause harm when oral intake falls</b> (sulfonylureas → hypoglycaemia; SGLT2 inhibitors → euglycaemic DKA and volume depletion). An ACE inhibitor or ARB plus a diuretic plus an NSAID is the classic “triple whammy” for AKI. The other groups need the opposite instinct: steroids go up, time-critical drugs must keep going, and narrow-margin drugs need a number checked rather than a reflex stop."},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"ℹ️ Targeted, not blanket", html:"The evidence that pausing these drugs prevents AKI is limited. Think Kidneys therefore advises giving sick-day guidance to people judged at high risk after an individual assessment, with the written advice to restart — not printing a hold list for everyone on an ACE inhibitor.", src:"Think Kidneys (NHS England AKI programme, now hosted by UKKA) sick day guidance position statement (2018)"},
         {tone:"cream", h:"🧾 What counts as a sick day", html:"A dehydrating illness: vomiting, diarrhoea, or fever with sweats and shaking. A cold without fever or a minor ache is not a reason to pause long-term medicines. The advice applies when the illness is causing reduced intake, dehydration, hypotension, oliguria or significant physiological stress — not merely because a patient has a minor respiratory infection.", src:"Think Kidneys / UKKA sick day guidance (2018)"}
       ]}
     ]},

    {id:"workup", nav:"Assess", title:"What to check before deciding home versus admit",
     sub:"Quantify the risks — ketosis, dehydration and drug accumulation — then judge whether the patient can actually follow oral sick-day rules.",
     blocks:[
       {b:"table", head:["Check","Detail","Note"], rows:[
         ["<b>Test frequency</b>","Type 1: glucose AND ketones every 4–6 hours including overnight; if glucose is above 11 mmol/L and/or ketones are present, increase to every 2 hours. Type 2: glucose at least 4 times daily; if above 11 mmol/L with ketones present, glucose and ketones every 2–4 hours","More often than usual; exact timing follows the patient-specific diabetes-team plan (type, symptoms, trend, insulin, ability to drink, support, SGLT2 use)"],
         ["<b>Priorities while ill</b>","No universal home glucose target — do not encourage patients to chase a particular glucose level. The priority is hydration, insulin continuation, ketone clearance and clinical assessment; correction insulin follows the patient's established sick-day plan or diabetes-team instructions","Treat a glucose below 4 mmol/L as a hypo even while ill"],
         ["<b>Blood glucose</b>","<b>Now, then 2–4 hourly.</b> A high glucose during illness means <b>insulin needs to rise, not fall</b>","<b>A normal glucose does not reassure on an SGLT2 inhibitor</b>"],
         ["<b>Blood ketones — the key test</b>","&lt;0.6 normal · 0.6–1.5 recheck per the patient's diabetes-team plan · 1.5–2.9 correction insulin per the established plan, urgent diabetes-team advice and close reassessment; emergency assessment if rising, vomiting, unable to maintain fluids or unwell · 3.0 or more is an emergency","Check blood ketones promptly in anyone on an SGLT2 inhibitor who is acutely unwell, vomiting, dehydrated or has DKA symptoms, regardless of glucose (euglycaemic DKA). Blood testing is preferred to urine. A home ketone meter for people with type 2 diabetes on an SGLT2 inhibitor is individualised — GMMMG guidance emphasises education and urgent assessment"],
         ["<b>Urine ketones (if no meter)</b>","2+ or more counts as significant ketonuria (JBDS 02) — in an unwell patient treat it as a possible DKA","Urine lags behind blood; use blood where possible"],
         ["<b>Fluids and carbohydrate</b>","<b>Encourage frequent small amounts of fluid if safe and tolerated</b>, with the type and volume individualised according to glucose, sodium, renal function, heart failure, vomiting and the patient's ability to drink. Carbohydrate replacement follows the diabetes sick-day plan — excess sugary drinks may worsen hyperglycaemia when glucose or ketones are high","Do not impose a fixed fluid target in heart failure, severe CKD, fluid restriction, aspiration risk or suspected HHS without clinical assessment"],
         ["<b>Hydration and U&amp;E</b>","Postural BP, urine output, capillary refill, mucous membranes. Check U&amp;E if there has been diarrhoea and vomiting on SADMAN drugs — and consider withholding the relevant drugs if AKI is likely, individualised in heart failure and CKD","AKI is the second killer"],
         ["<b>Drug levels</b>","Lithium level, digoxin level, INR on warfarin, renal function on a DOAC — when significantly unwell or dehydrated","Interpret levels with the time since the last dose, renal function, potassium and magnesium, and clinical features. See the narrow-margin section"],
         ["<b>NEWS2 / sepsis</b>","Fever with rigors, tachycardia, hypotension, <b>NEWS2 ≥5</b>","NEWS2 ≥5 prompts urgent clinical assessment and escalation per the local sepsis pathway — not by itself a diagnosis of sepsis or an automatic admission rule"],
         ["<b>Can they follow the rules?</b>","The pivotal question: is the patient keeping fluids down, and able to monitor and correct at home? Who is with them?","<b>This, not the absolute glucose, decides home versus admit</b>"],
         ["<b>If admitting</b>","Hospital will add venous gas and bicarbonate, U&amp;E, FBC, CRP and cultures","Do not delay the referral to obtain these in the community"]
       ]},
       {b:"why", html:"Assessment turns a vague “unwell diabetic” into measurable risks: <b>blood ketones track evolving DKA hours before the patient looks ill</b>, <b>U&amp;E with hydration status track impending AKI</b>, and drug levels show whether a narrow-margin drug is accumulating. But the most decisive observation is behavioural — a patient who can keep fluids down and follow their correction plan can usually be managed at home whatever the glucose, whereas one who is vomiting with rising ketones needs admission even if the glucose looks unalarming."}
     ]},

    {id:"ladder", nav:"Act", title:"The core actions — continue, hold, increase",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"💉 Insulin — never stop basal insulin in type 1", html:"Never stop basal insulin in established type 1 diabetes, even if not eating — omitting insulin is a common precipitant of DKA. Type 2 on insulin: follow the individual sick-day plan, which may continue or reduce doses. <b>Monitor glucose every 2–4 hours</b> including overnight if unwell. Check ketones if the glucose is above 11 mmol/L or the patient feels unwell. Correction doses follow the patient's established sick-day plan or diabetes-team instructions — see <a href='diabetes-unwell-insulin.html'>Feeling unwell on insulin</a>. <b>Encourage frequent small amounts of fluid if safe</b>, individualised in heart failure, CKD and frailty; carbohydrate replacement per the sick-day plan.", src:"NICE NG17 (2015, updated 2022) — ketone monitoring as part of sick-day rules; JBDS 02 (2023)"},
         {tone:"amber", h:"💊 Steroids — INCREASE, don't hold", html:"Fever, infection or injury needing medical attention: an <b>extra 20 mg hydrocortisone at once</b>, then <b>at least 40 mg hydrocortisone a day in 2–4 divided doses, or at least 10 mg prednisolone a day in 1–2 doses</b>, until recovered. Already on 10 mg prednisolone or more: no extra needed, but split the dose in two. Persistent vomiting or diarrhoea (oral absorption unreliable): <b>100 mg hydrocortisone IM or IV</b> and emergency admission. Details in the steroid section below.", src:"NICE NG243 (2024) — sick-day dosing and emergency hydrocortisone"}
       ]},
       {b:"table", head:["SADMAN drug — consider withholding","Examples","Why and when to restart"], rows:[
         ["<b>Sulfonylureas</b>","Gliclazide, glimepiride, glipizide","<b>Hypoglycaemia risk if not eating — hold while intake is poor</b>; restart when oral intake is reliable and hypoglycaemia risk has resolved"],
         ["<b>SGLT2 inhibitors</b>","Dapagliflozin, empagliflozin, canagliflozin, ertugliflozin","<b>Pause — euglycaemic DKA and volume depletion.</b> Restart only when clinically recovered, eating and drinking normally, ketones are normal and there is no ongoing acute illness, in accordance with the local diabetes pathway (MHRA). Before planned major surgery, follow the pre-operative instructions for stopping it"],
         ["<b>ACE inhibitors / ARBs</b>","Ramipril, lisinopril, perindopril; losartan, candesartan, irbesartan, valsartan","Reduce glomerular filtration in dehydration (loss of efferent arteriolar tone) → AKI and hyperkalaemia. Temporary withholding may be appropriate with dehydration, hypotension, oliguria, suspected AKI or significant hyperkalaemia — but they may be especially important in HFrEF, proteinuric CKD and hypertension; decide by hydration, BP, urine output, renal function, potassium and indication. Restart when clinically reasonable if the indication remains, and recheck creatinine and potassium"],
         ["<b>Diuretics</b>","Furosemide, bendroflumethiazide, indapamide, spironolactone","<b>Volume depletion → AKI.</b> No blanket stop: a dehydrated patient may need them withheld, a congested heart-failure patient may need them continued or adjusted — assess volume status, and in heart failure seek advice early rather than applying an automatic hold"],
         ["<b>Metformin</b>","Standard and modified-release","<b>Accumulates in AKI → lactic acidosis.</b> Temporary cessation with significant vomiting or diarrhoea, dehydration, suspected AKI, severe sepsis or hypoxia, or inability to maintain oral intake. Restart when eating and drinking normally, after renal-function review if AKI or significant dehydration occurred"],
         ["<b>NSAIDs</b>","Ibuprofen, naproxen, diclofenac — <b>including over-the-counter purchases</b>. <b>Use paracetamol for symptom relief instead</b>","<b>Nephrotoxic in dehydration.</b> Hold; do not routinely restart — reassess whether it is needed"],
         ["<b>Restart rule</b>","All of the above","No single 24–48-hour rule: use the drug-specific restart rules above, document them, and recheck U&amp;E after restarting an ACE inhibitor, ARB or diuretic if there was an AKI or the illness was significant. Lithium, DOACs, warfarin, tacrolimus and other narrow-margin medicines restart or are adjusted with blood tests or specialist input"]
       ]},
       {b:"warn", html:"<b>Holding is temporary — make sure the patient knows to restart.</b> Unintended permanent discontinuation of an ACE inhibitor after an admission is a common medicines-safety error, and the restart step matters as much as the hold: a documented, time-limited hold with a clear restart trigger prevents both the acute harm and the downstream harm of a chronically-needed drug being dropped by accident."},
       {b:"why", html:"Two mechanisms are worth holding onto. <b>Ketone monitoring is the early-warning system</b> — a rising blood ketone identifies evolving DKA hours before the patient looks unwell, allowing extra insulin and fluids at home to abort it; the diabetes team teaches the correction algorithm, and the GP's job is to reinforce it, ensure the patient has a plan (and ketone testing where indicated), and recognise when home management is failing. And in adrenal insufficiency the body cannot mount the cortisol surge that illness demands, so without extra glucocorticoid the patient decompensates into an adrenal crisis — hypotension, collapse, hyponatraemia. The risk of each SADMAN drug, by contrast, may increase in the physiology of acute dehydrating illness, but stopping also has harms — heart-failure decompensation, uncontrolled hypertension and failure to restart — so the decision is individual and time-limited."}
     ]},

    {id:"steroids", nav:"Steroids", title:"Glucocorticoids — who needs steroid sick-day rules, and the doses",
     sub:"The one group whose dose goes up. NICE NG243 (2024) sets the current adult doses; the NHS Steroid Emergency Card identifies who is at risk.",
     blocks:[
       {b:"table", head:["Who is at risk","Detail"], rows:[
         ["<b>Primary adrenal insufficiency</b>","Addison's disease, congenital adrenal hyperplasia, after bilateral adrenalectomy. May also need fludrocortisone — the hydrocortisone plan takes priority in illness, but do not omit fludrocortisone without specialist advice"],
         ["<b>Secondary adrenal insufficiency</b>","Pituitary disease, and suppression of the axis by long-term glucocorticoids"],
         ["<b>Long-term glucocorticoids</b>","Prednisolone 5 mg a day or more (or equivalent) for 4 weeks or longer, by any route — oral, topical, inhaled or intranasal — the Steroid Emergency Card threshold (NatPSA 2020; Society for Endocrinology / SPS 2021)"],
         ["<b>High-dose inhaled steroids</b>","For example beclometasone more than 1,000 micrograms a day or fluticasone more than 500 micrograms a day (Society for Endocrinology / SPS guidance on exogenous steroids)"],
         ["<b>Interacting drugs</b>","Inhaled or intranasal fluticasone with a strong CYP3A4 inhibitor such as ritonavir or cobicistat can cause adrenal suppression even at ordinary doses — treat as at risk"],
         ["<b>Recently stopped</b>","People who have recently stopped long-term glucocorticoids may not yet have a recovered axis — treat as at risk when ill"],
         ["<b>Individual assessment</b>","The card threshold identifies people who may be at risk; the clinical need for steroid cover depends on route, dose, duration, cumulative exposure, recent cessation, interacting drugs, confirmed adrenal function and the treating specialist's plan (short courses and immunosuppressive doses differ)"],
         ["<b>Everyone at risk</b>","Should have an individual written steroid sick-day plan, carry an NHS Steroid Emergency Card where indicated and, where they rely on replacement therapy, an in-date hydrocortisone injection kit with training for them and a carer"]
       ]},
       {b:"table", head:["Situation","Adults (16 and over)","Notes"], rows:[
         ["<b>Minor illness without fever</b>","Usually no change","A cold without fever does not count as physiological stress"],
         ["<b>Fever, infection, injury needing medical attention, short-term vomiting</b>","Take an <b>extra 20 mg hydrocortisone immediately</b>, then <b>at least 40 mg oral hydrocortisone a day in 2–4 divided doses</b> or <b>at least 10 mg prednisolone a day in 1–2 divided doses</b> until the illness has resolved","Return to the usual dose on recovery"],
         ["<b>Already on prednisolone 10 mg a day or more</b>","No additional sick-day dose is needed","Split the total daily dose into 2 equal doses"],
         ["<b>Vomits within 30 minutes of a dose</b>","Take a further dose, at <b>double the original dose</b>, once the vomiting settles","If vomiting continues, go to the next row"],
         ["<b>Unable to absorb oral steroid</b> (persistent vomiting or diarrhoea — a medical emergency even if not yet hypotensive) or adrenal crisis","<b>100 mg hydrocortisone IM or IV immediately</b> and emergency admission","If severely unwell, hospital continues 200 mg IV over 24 hours or 50 mg IM/IV four times a day"],
         ["<b>Surgery and procedures</b>","Extra peri-procedure cover arranged in advance by the team doing the procedure","Tell every clinician about the steroid dependence"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"red", h:"🚑 Adrenal crisis — act first", html:"Vomiting, severe illness, drowsiness, hypotension or collapse in someone steroid-dependent → <b>give hydrocortisone 100 mg IM or IV immediately and arrange emergency transfer</b>; do not delay treatment for blood tests. Give IV 0.9% sodium chloride in the acute setting according to the emergency protocol. There is no significant risk of overdose from emergency hydrocortisone — when in doubt, give it.", src:"NICE NG243 (2024) — emergency management of adrenal crisis"},
         {tone:"red", h:"👶 Children — emergency IM hydrocortisone", html:"Under 1 year: <b>25 mg</b> · 1–5 years: <b>50 mg</b> · 6 years and over: <b>100 mg</b>. Parents should be trained to give it, then call 999.", src:"BSPED 2023 — emergency management of adrenal insufficiency in children (cross-referenced by NICE NG243)"},
         {tone:"blue", h:"ℹ️ Why NG243 changed the message from “double”", html:"The older Society for Endocrinology card rule was to double the usual glucocorticoid dose during fever. NICE NG243 (2024) instead sets a minimum daily dose (40 mg hydrocortisone or 10 mg prednisolone) plus an immediate extra 20 mg — so a patient on a low replacement dose gets enough, and one already on a high immunosuppressive dose is not given an unnecessary increase. Follow the patient's own endocrine plan where it is more specific.", src:"NICE NG243 (2024); Society for Endocrinology / NatPSA Steroid Emergency Card (2020)"},
         {tone:"cream", h:"📋 Check at every review", html:"Card carried and in date · injection kit present and in date · patient and carer trained · extra oral supplies for sick days · written plan with the doses above.", src:"NatPSA/2020/005/NHSPS (August 2020); NICE NG243 (2024)"}
       ]},
       {b:"say", html:"Your body can't make the extra steroid it needs when you're ill, so you have to give it yourself. If you get a temperature, an infection or an injury, take an extra 20 mg of hydrocortisone straight away and then take at least 40 mg a day, spread through the day, until you're better. If you keep being sick or have persistent diarrhoea, the tablets may not be absorbed — use your emergency injection and call 999, don't wait. Always carry your Steroid Emergency Card."}
     ]},

    {id:"critical", nav:"Time-critical", title:"Time-critical medicines — do not stop or delay",
     sub:"Some drugs cause serious harm if missed, delayed or stopped abruptly during illness. If the patient cannot swallow or is vomiting, find an alternative route — don't just omit them.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"🧠 Parkinson's disease — levodopa and other PD drugs", html:"Give on time, every time. <b>Never stop abruptly or let doses fail to be absorbed</b> — the risk is acute akinesia or a neuroleptic-malignant-like syndrome. If nil by mouth or vomiting, get same-day advice through the Parkinson's/acute neurology pathway on an alternative route: dispersible levodopa is not automatically an alternative if absorption fails, and rotigotine conversion and nasogastric administration require specialist advice.", src:"NICE NG71 (2017) — Parkinson's disease in adults"},
         {tone:"amber", h:"🤢 Antiemetics in Parkinson's", html:"Avoid dopamine-blocking antiemetics — <b>metoclopramide and prochlorperazine</b> worsen parkinsonism. Domperidone is not automatically suitable — it has important QT, cardiac and contraindication restrictions under MHRA guidance, so seek advice. Ondansetron is an alternative, but not with apomorphine (the combination can cause profound hypotension).", src:"BNF — antiemetics in Parkinson's disease; MHRA Drug Safety Update (May 2014) — domperidone; apomorphine SPC"},
         {tone:"red", h:"⚡ Epilepsy — antiepileptic drugs", html:"Do not miss doses — abrupt withdrawal risks breakthrough seizures and status epilepticus, and fever lowers the seizure threshold. Do not omit antiepileptic doses. If vomiting or nil by mouth, seek same-day advice on an alternative formulation or route. Buccal midazolam is rescue treatment for a prolonged convulsive seizure according to the individual seizure plan; it is not a substitute for missed maintenance medication.", src:"NICE NG217 (2022, updated August 2026) — epilepsies; BNF"},
         {tone:"amber", h:"💊 Do not stop suddenly", html:"<b>Long-term opioids, baclofen, clonidine and beta-blockers</b> cause withdrawal harm if stopped abruptly — withdrawal symptoms, rebound hypertension or rebound angina.", src:"BNF — withdrawal cautions for opioids, baclofen, clonidine and beta-blockers"},
         {tone:"cream", h:"🛡️ Specialist-supervised medicines", html:"Anti-rejection drugs after transplant (tacrolimus, ciclosporin), antiretrovirals and other immunosuppression: do not independently stop or alter them. If there is vomiting, malabsorption or interacting antimicrobial therapy, contact the transplant or HIV team urgently; check tacrolimus/ciclosporin levels where relevant.", src:"BNF; clinical practice — specialist shared-care arrangements"},
         {tone:"cream", h:"💉 Insulin and glucocorticoids", html:"Both are time-critical too: insulin is never stopped in type 1 diabetes, and glucocorticoid replacement is never stopped — it is increased. See the sections above.", src:"NICE NG17 (2015, updated 2022); NICE NG243 (2024)"}
       ]}
     ]},

    {id:"narrow", nav:"Levels", title:"Narrow-margin drugs — review the dose and monitor",
     sub:"These drugs are not simply held or doubled: dehydration, AKI, fever and interacting antibiotics shift their levels, so they need a number checked or a dose reviewed.",
     blocks:[
       {b:"table", head:["Drug","What illness does","Action"], rows:[
         ["<b>Lithium</b>","Dehydration from diarrhoea, vomiting, fever or sweating, and reduced salt intake, raise the level → toxicity. NSAIDs, ACE inhibitors, ARBs and thiazides raise it further","Stop lithium and seek urgent clinical advice with significant dehydration, vomiting, diarrhoea, acute confusion, ataxia, coarse tremor or worsening renal function. Maintain usual fluid and salt intake, but do not encourage unrestricted salt or fluid in heart failure or other restrictions. Interpret the level with the timing of the last dose and renal function"],
         ["<b>Digoxin</b>","AKI and dehydration reduce clearance; hypokalaemia from diarrhoea, vomiting or diuretics increases toxicity","Check U&amp;E; a level is not always immediately useful — interpret it with time since the last dose, renal function, potassium and magnesium, and clinical features (nausea, visual change, arrhythmia)"],
         ["<b>DOACs</b>","Renally cleared, dabigatran most of all — AKI causes accumulation and bleeding risk","Reassess renal function; doses are based on current renal function and the licensed indication. Do not simply stop without weighing clot against bleed. Suspected major bleeding, severe AKI or urgent surgery → same-day specialist assessment"],
         ["<b>Warfarin</b>","Acute illness, reduced intake, liver involvement and many antibiotics raise the INR","Contact the anticoagulation service and arrange an INR promptly during significant illness or when starting an interacting antibiotic. Do not independently omit or alter warfarin without a clear plan unless there is significant bleeding or specialist direction"],
         ["<b>Methotrexate</b>","Marrow toxicity rises with infection and AKI; trimethoprim and co-trimoxazole are dangerous with it (additive folate antagonism)","Follow the shared-care protocol and contact the rheumatology/dermatology/gastroenterology team where needed — no blanket decision for all infections. Avoid trimethoprim and co-trimoxazole unless specifically authorised by the specialist; check FBC"],
         ["<b>Theophylline and aminophylline</b>","Fever and some antibiotics (clarithromycin, erythromycin, ciprofloxacin) reduce clearance → toxicity","Check the level if unwell or when an interacting antibiotic starts"],
         ["<b>Phenytoin, ciclosporin, tacrolimus, aminoglycosides</b>","Levels and renal handling shift with illness","Monitor levels and renal function in significant illness"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"🧂 Lithium and the SADMAN overlap", html:"The drugs held for AKI protection are the same ones that push lithium up — so a patient on lithium with a dehydrating illness needs both the hold and a level.", src:"BNF — lithium interactions and toxicity; NICE CG185 (2014) — bipolar disorder"},
         {tone:"blue", h:"🩸 Anticoagulants", html:"A DOAC dose set for normal renal function may be too high during AKI, and an INR can climb quickly when an antibiotic is added to warfarin.", src:"BNF — DOACs and warfarin interactions; dabigatran SPC"}
       ]}
     ]},

    {id:"fever", nav:"Fever on drugs", title:"Fever on drugs that cause agranulocytosis or immunosuppression",
     sub:"Sore throat, mouth ulcers, fever or a flu-like illness in someone on these drugs is an emergency until the blood count is known.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"🦋 Carbimazole and propylthiouracil", html:"Sore throat, mouth ulcers, fever or a flu-like illness → <b>stop the drug and arrange a same-day FBC</b>, and seek urgent clinical assessment even if the FBC is not immediately available. Do not restart until agranulocytosis is excluded; if it is confirmed the drug is permanently contraindicated. Carbimazole also carries a risk of acute pancreatitis — stop it if there is severe upper abdominal pain.", src:"MHRA Drug Safety Update (February 2019) — carbimazole; BNF — carbimazole agranulocytosis warning"},
         {tone:"red", h:"🧠 Clozapine", html:"Fever may represent neutropenia, infection, myocarditis, pneumonia or benign clozapine-associated fever — an FBC alone is not adequate. Arrange urgent medical assessment and follow the local clozapine monitoring service. Do not stop clozapine abruptly without specialist input, because of the risk of serious psychiatric deterioration. Infection and stopping smoking can both raise clozapine levels.", src:"Clozapine SPC; MHRA Drug Safety Update (August 2020) — clozapine levels and smoking"},
         {tone:"amber", h:"💊 DMARDs, biologics and JAK inhibitors", html:"Methotrexate, azathioprine, leflunomide, mycophenolate, sulfasalazine, ciclosporin, tacrolimus, anti-TNF agents, rituximab, tocilizumab, ustekinumab, tofacitinib and baricitinib: for serious infection, <b>contact the relevant specialist/shared-care service regarding temporary withholding and restart timing</b> — conventional DMARDs, biologics, JAK inhibitors and transplant immunosuppression do not share identical rules. Do not independently stop transplant immunosuppression or antiretroviral therapy. Signs of infection may be blunted, so investigate early.", src:"BSR 2019 — biologic DMARD safety guideline; BNF"},
         {tone:"amber", h:"⚠️ Other drugs that can cause agranulocytosis", html:"Carbamazepine, mirtazapine, sulfasalazine, co-trimoxazole and other sulfonamides, deferiprone, dapsone, penicillamine, ganciclovir. Same rule: fever, sore throat or mouth ulcers → consider an urgent FBC and stop pending the result.", src:"BNF and SPCs — blood disorder warnings"},
         {tone:"red", h:"🚑 Neutropenic sepsis", html:"Any unwell patient with recent systemic anticancer treatment, known neutropenia or significant chemotherapy-related immunosuppression requires <b>urgent acute oncology assessment</b> (999 if severely unwell), even if fever is absent or blunted by steroids. Do not delay referral for a community FBC.", src:"NICE NG253 (updated September 2026) — suspected sepsis, including neutropenic sepsis"},
         {tone:"blue", h:"💉 Immunosuppressed and unwell", html:"High-dose or long-term corticosteroids can mask fever — and remember the steroid sick-day rules too. Live vaccines are contraindicated in significant immunosuppression; consider atypical infection, including pneumocystis, in the unwell immunosuppressed patient.", src:"UKHSA Green Book chapter 6 — contraindications; NICE NG243 (2024)"}
       ]},
       {b:"say", html:"While you take this medicine, a sore throat, mouth ulcers, a high temperature, chills or feeling flu-like could mean your white blood cells have dropped. If that happens, contact us the same day for an urgent check and blood test — don't wait. Your plan will say whether to stop the medicine straight away (for example carbimazole) or keep taking it until you have been assessed (for example clozapine). If you feel very unwell or can't reach us, call 111 or 999, and always tell the clinician which medicine you're on."}
     ]},

    {id:"flare", nav:"Flare plans", title:"Condition flare plans that sit alongside the sick-day card",
     sub:"Beyond individual drugs, several long-term conditions have their own written action for when the patient is unwell.",
     blocks:[
       {b:"table", head:["Condition","Plan","Source"], rows:[
         ["<b>Asthma</b>","A personalised written asthma action plan: step up reliever and preventer as written, and oral prednisolone for an attack as planned — for an adult, 40–50 mg daily for at least 5 days. Seek help the same day if the reliever is needed more than every 4 hours or is not helping; too breathless to talk, blue lips or exhausted → 999","NICE NG245 (2024, joint with BTS and SIGN); BTS/SIGN 158 (2019) — acute asthma"],
         ["<b>COPD</b>","A rescue pack of an oral corticosteroid, with an oral antibiotic when sputum turns purulent, for people at risk of exacerbations who understand how to use it; tell the practice when it is used; increase the short-acting bronchodilator","NICE NG115 (2018, updated 2019); NICE NG114 (2018)"],
         ["<b>Heart failure</b>","Decide on diuretics and ACE inhibitors or ARBs according to hydration, blood pressure, urine output, renal function, potassium and the original indication — seek advice early rather than applying an automatic hold; a congested patient may need diuretics continued or adjusted. Weigh daily, watch breathlessness, and recheck U&amp;E after restarting","Think Kidneys (2018); NICE NG106 (2018)"],
         ["<b>Adrenal insufficiency</b>","Steroid sick-day doses and the emergency injection — see the steroid section","NICE NG243 (2024)"],
         ["<b>Inflammatory bowel disease</b>","Continue maintenance therapy; use the specialist flare plan, including any steroid rescue it specifies","Specialist IBD plan; NICE NG129 / NG130"],
         ["<b>Epilepsy</b>","Rescue medication and the seizure care plan — see time-critical medicines","NICE NG217 (2022, updated August 2026)"]
       ]}
     ]},

    {id:"lifestyle", nav:"The written plan", title:"Self-management and prevention — the sick-day card",
     sub:"When someone is vomiting and frightened at 2am, nobody reads a leaflet for the first time.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"📋 Personalised sick-day card", html:"Exact medicines to hold, exact medicines to continue, the individual insulin plan, ketone thresholds, steroid plan, emergency contacts, restart instructions, and the named person responsible for reconciliation — written down, before they are ever ill.", src:"Think Kidneys / UKKA sick day guidance (2018); NICE NG243 (2024)"},
         {tone:"blue", h:"🩸 Ketone testing kit", html:"Ensure people with type 1 diabetes have a blood-ketone meter, in-date strips, and know the action thresholds; for others (for example type 2 on an SGLT2 inhibitor) home ketone testing is individualised, with education and urgent assessment emphasised. After an episode, replace the strips used and check expiry dates so the kit is ready next time.", src:"NICE NG17 (2015, updated 2022)"},
         {tone:"cream", h:"💧 Fluids and carbohydrate", html:"Frequent small amounts of fluid if safe and tolerated, individualised in heart failure, CKD and frailty; carbohydrate replacement as the diabetes sick-day plan advises.", src:"JBDS 02 (2023); NICE NG17 (2015, updated 2022)"},
         {tone:"amber", h:"🔁 Annual reinforcement", html:"Revisit sick-day rules at diabetes, steroid and medication reviews, and after any DKA, AKI or adrenal crisis admission.", src:"NICE NG243 (2024); NICE NG148 (2019, updated 2024)"},
         {tone:"green", h:"💉 Vaccination", html:"Annual influenza, plus pneumococcal and COVID-19 vaccination as eligible, to reduce illness episodes.", src:"UKHSA Green Book — influenza, pneumococcal and COVID-19 chapters"},
         {tone:"green", h:"✅ Restart reminder", html:"Reconcile medicines after illness so held drugs are restarted and not lost.", src:"Think Kidneys / UKKA sick day guidance (2018)"}
       ]},
       {b:"why", html:"Sick-day rules only work if the patient knows them before they become unwell. Proactive, written, personalised plans and ketone kits stop an illness at home from becoming a DKA admission, and an in-date injection kit with a trained carer is what stops a vomiting illness becoming an adrenal crisis."}
     ]},

    {id:"monitor", nav:"Safety-net", title:"Follow-up, restart rules and safety-netting",
     blocks:[
       {b:"table", head:["Tell every patient","Trigger"], rows:[
         ["<b>999 if</b>","Persistent vomiting and unable to keep fluids down, blood ketones 3.0 or more, drowsiness or confusion, deep rapid breathing, abdominal pain, collapse — or, if steroid-dependent, vomiting or feeling very unwell (give the injection first)"],
         ["<b>Same-day if</b>","Ketones rising despite correction doses, glucose persistently very high or very low, reduced urine output, feeling steadily worse, or fever or sore throat on a drug that can cause agranulocytosis"],
         ["<b>Restart held drugs</b>","Drug by drug, as written on the plan: SGLT2 inhibitor when recovered and ketones normal; metformin when eating and drinking and renal function satisfactory; ACE inhibitor, ARB or diuretic by BP, volume, potassium and renal function, rechecking U&amp;E after AKI; sulfonylurea when intake is reliable; NSAID not routinely"],
         ["<b>Reconcile</b>","After any illness or admission, review the medication list so temporarily-held drugs are restarted, SGLT2 inhibitors resumed appropriately and steroid doses returned to normal"]
       ]},
       {b:"cards", items:[
         {tone:"amber", h:"🔁 The two failure modes to design against", html:"<b>1 Under-escalation</b> — a patient struggling at home who should have been admitted. The guard is an explicit, time-bound safety-net with named thresholds rather than “come back if worse”. <b>2 The silent medicines-safety error</b> — a held drug never restarted. The guard is a deliberate medicines-reconciliation step after every illness episode. <b>Explicit safety-netting and reconciliation close both gaps.</b>", src:"Think Kidneys / UKKA sick day guidance (2018); JBDS 02 (2023)"}
       ]},
       {b:"say", html:"While you are ill, different things happen to your tablets, so let me be clear about each. Don't stop your insulin — illness can push your sugars up even when you are not eating; follow your own sick-day plan for the dose. These tablets here we pause for now, because while you are this dehydrated they can increase the risk to your kidneys. And if you were on steroids you would take more, not stop them. Sip fluids little and often if you can, check your sugars every few hours, and check ketones if you feel rough. I will write down exactly when to restart each paused tablet — some need a blood test first."}
     ]},

    {id:"refer", nav:"Refer", title:"When to admit or escalate",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999 / same-day", html:"Suspected DKA or HHS, persistent vomiting unable to keep fluids down, drowsiness or confusion, blood ketones 3.0 or more, suspected sepsis per the local pathway, severe dehydration or AKI, adrenal crisis (100 mg hydrocortisone IM or IV first), or suspected neutropenic sepsis.", src:"JBDS 02 (2023); NICE NG243 (2024); NICE NG253"},
         {tone:"amber", h:"Discuss with the diabetes team", html:"Blood ketones 1.5–2.9 mmol/L (emergency assessment instead if rising, vomiting, unable to maintain fluids or unwell), ketones rising despite correction doses, uncertainty about insulin adjustment, or recurrent sick-day decompensation.", src:"NICE NG17 (2015, updated 2022); JBDS 02 (2023)"},
         {tone:"amber", h:"Lower the threshold for these patients", html:"Recent DKA, hypoglycaemia unawareness, pregnancy, frailty, CKD, or living alone and getting worse — escalate earlier and review sooner.", src:"JBDS 02 (2023); Think Kidneys / UKKA sick day guidance (2018) — individual risk assessment"},
         {tone:"amber", h:"Discuss with the specialist team", html:"Lithium toxicity or a high level (psychiatry), a nil-by-mouth patient with Parkinson's disease (Parkinson's team), a DMARD or biologic during a serious infection (shared-care specialist), clozapine with fever (local clozapine monitoring service), transplant or antiretroviral therapy with vomiting or interacting antimicrobials (transplant/HIV team), warfarin during illness (anticoagulation service), or steroid dosing uncertainty (endocrinology).", src:"NICE NG71 (2017); BSR 2019; NICE NG243 (2024)"},
         {tone:"cream", h:"Manage at home", html:"Tolerating fluids, ketones controlled, glucose monitored, a written plan in place, someone to help, and able to seek help — safety-net clearly.", src:"Think Kidneys / UKKA sick day guidance (2018)"}
       ]},
       {b:"why", html:"The admission threshold is set by the patient's ability to follow oral sick-day rules and by the ketone trajectory — not by the absolute glucose. A patient with a very high glucose who is alert, hydrating and clearing ketones can often be managed at home; a patient with a near-normal glucose who is vomiting with rising ketones — for example on an SGLT2 inhibitor — needs admission. The same logic applies to steroids: a vomiting, steroid-dependent patient cannot absorb the tablets that keep them alive."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 58-year-old with type 2 diabetes rings on day two of a vomiting illness. He takes metformin, dapagliflozin, gliclazide, ramipril, indapamide, and has been taking ibuprofen for the aches. He has stopped eating, is “drinking a bit”, and mentions his glucose is <b>7.8</b> — so he assumes everything is fine.", src:"MHRA Drug Safety Update (April 2016) — SGLT2 inhibitors and DKA"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Does not accept the normal glucose as reassurance — he is on an SGLT2 inhibitor, so ketones must be checked; identifies <b>five SADMAN drugs plus an OTC NSAID</b> and advises withholding them temporarily because this is a significant dehydrating illness; assesses <b>hydration, urine output and the ability to keep fluids down</b>; checks <b>U&amp;E</b>; recognises the <b>triple whammy</b>; gives explicit <b>ketone thresholds</b> rather than “keep an eye on it”; sets a clear <b>admission trigger</b>; and — the step candidates miss — states drug-specific restart rules and arranges reconciliation, so the ramipril is not silently lost.", src:"Think Kidneys / UKKA sick day guidance (2018); JBDS 02 (2023)"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>Think Kidneys (NHS England AKI programme) — “Sick day” guidance in patients at risk of acute kidney injury: position statement (2018)</b><br><a href="https://www.thinkkidneys.nhs.uk/aki/wp-content/uploads/sites/2/2018/01/Think-Kidneys-Sick-Day-Guidance-2018.pdf" rel="noopener">thinkkidneys.nhs.uk</a><span class="rd"> — individualised temporary withholding of AKI-risk medicines during dehydrating illness; potential harms (heart-failure decompensation, uncontrolled hypertension, failure to restart, delayed review); an explicit documented restart plan</span></li>'+
         '<li><b>PAUSE Medication Safety Advisory Panel — Consensus recommendations for sick day medication guidance for people with diabetes, kidney or cardiovascular disease: a modified Delphi process (international). Am J Kidney Dis 2023</b><br><a href="https://www.ajkd.org/article/S0272-6386(22)01054-X/fulltext" rel="noopener">ajkd.org</a><span class="rd"> — international consensus on the drug classes to pause during acute illness (sulfonylureas, ACE inhibitors, diuretics, metformin, ARBs, NSAIDs, SGLT2 inhibitors)</span></li>'+
         '<li><b>JBDS 02 — The management of diabetic ketoacidosis in adults (revised March 2023)</b><br><a href="https://abcd.care/resource/current/jbds-02-management-diabetic-ketoacidosis-adults" rel="noopener">abcd.care</a><span class="rd"> — DKA diagnosis: ketones ≥3.0 mmol/L or ketonuria 2+ or more, glucose ≥11 mmol/L or known diabetes, and acidosis; fixed-rate insulin infusion in hospital</span></li>'+
         '<li><b>JBDS 06 — The management of the hyperosmolar hyperglycaemic state in adults</b><br><a href="https://abcd.care" rel="noopener">abcd.care</a><span class="rd"> — HHS: glucose ≥30 mmol/L, osmolality ≥320 mOsm/kg, without significant ketonaemia</span></li>'+
         '<li><b>MHRA Drug Safety Update — SGLT2 inhibitors: updated advice on the risk of DKA (April 2016)</b> and <b>SGLT2 inhibitors: monitor ketones in blood during treatment interruption for surgical procedures or acute serious medical illness (March 2020)</b><br><a href="https://www.gov.uk/drug-safety-update/sglt2-inhibitors-monitor-ketones-in-blood-during-treatment-interruption-for-surgical-procedures-or-acute-serious-medical-illness" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> — test ketones even when the glucose is near-normal; interrupt treatment in people hospitalised for major surgery or acute serious illness and restart when ketones are normal and the patient is stable</span></li>'+
         '<li><b>TREND Diabetes — Type 1 and Type 2 diabetes: what to do when you are ill (patient leaflets)</b><span class="rd"> — testing frequency, blood ketone bands (&lt;0.6, 0.6–1.5, 1.6–2.9, ≥3.0 mmol/L)</span></li>'+
         '<li><b>Greater Manchester Medicines Management Group — Guidelines for safe prescribing of SGLT2 inhibitors in type 2 diabetes (2026)</b><span class="rd"> — education and urgent assessment rather than routine ketone strips for all people with type 2 diabetes</span></li>'+
         '<li><b>NICE NG17 — Type 1 diabetes in adults (2015, updated 2022)</b><br><a href="https://www.nice.org.uk/guidance/ng17" rel="noopener">nice.org.uk/guidance/ng17</a><span class="rd"> — consider blood or urine ketone monitoring as part of sick-day rules</span></li>'+
         '<li><b>NICE NG28 — Type 2 diabetes in adults (updated February 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng28" rel="noopener">nice.org.uk/guidance/ng28</a><span class="rd"> — metformin with an SGLT2 inhibitor as initial treatment for many people, which is why SGLT2 sick-day advice now reaches most of the type 2 population</span></li>'+
         '<li><b>NICE NG148 — Acute kidney injury (2019, updated October 2024)</b><br><a href="https://www.nice.org.uk/guidance/ng148" rel="noopener">nice.org.uk/guidance/ng148</a><span class="rd"> — AKI risk and medicines review in people at risk</span></li>'+
         '<li><b>NICE NG243 — Adrenal insufficiency: identification and management (August 2024)</b><br><a href="https://www.nice.org.uk/guidance/ng243" rel="noopener">nice.org.uk/guidance/ng243</a><span class="rd"> — an immediate extra 20 mg hydrocortisone for fever, infection or injury; at least 40 mg hydrocortisone or 10 mg prednisolone a day during physiological stress; no extra dose at prednisolone 10 mg or more; redosing after vomiting within 30 minutes; 100 mg hydrocortisone IM or IV when oral absorption fails or in crisis, then 200 mg over 24 hours or 50 mg four times a day</span></li>'+
         '<li><b>NHS England National Patient Safety Alert NatPSA/2020/005/NHSPS — Steroid Emergency Card (August 2020), with the Society for Endocrinology</b><span class="rd"> — card for prednisolone ≥5 mg a day (or equivalent) for ≥4 weeks by any route</span></li>'+
         '<li><b>Society for Endocrinology / Specialist Pharmacy Service — Exogenous steroids treatment in adults: adrenal insufficiency and adrenal crisis (2021)</b><span class="rd"> — card for prednisolone 5 mg a day or equivalent for 4 weeks or more by any route (oral, topical, inhaled, intranasal); inhaled thresholds (beclometasone &gt;1,000 micrograms or fluticasone propionate &gt;500 micrograms a day); fluticasone with ritonavir or cobicistat</span></li>'+
         '<li><b>BSPED — Emergency and peri-operative management of adrenal insufficiency in children and young people (2023)</b><br><a href="https://www.bsped.org.uk/clinical-resources/bsped-adrenal-insufficiency-consensus-guidelines/" rel="noopener">bsped.org.uk</a><span class="rd"> — emergency IM hydrocortisone 25 mg under 1 year, 50 mg at 1–5 years, 100 mg at 6 years and over</span></li>'+
         '<li><b>NICE NG71 — Parkinson’s disease in adults (2017)</b><br><a href="https://www.nice.org.uk/guidance/ng71" rel="noopener">nice.org.uk/guidance/ng71</a><span class="rd"> — do not withdraw antiparkinsonian medicines abruptly or allow them to fail to be absorbed</span></li>'+
         '<li><b>NICE NG217 — Epilepsies in children, young people and adults (2022, updated August 2026)</b><span class="rd"> — buccal midazolam as rescue treatment for prolonged convulsive seizures per the individual seizure plan</span></li>'+
         '<li><b>MHRA Drug Safety Updates</b> — domperidone (May 2014), carbimazole (February 2019), clozapine levels and smoking (August 2020)</li>'+
         '<li><b>BSR 2019 — British Society for Rheumatology guideline on the safety of biologic DMARDs</b><span class="rd"> — withholding biologics during serious infection</span></li>'+
         '<li><b>NICE NG253 (updated September 2026) — Suspected sepsis in people aged 16 or over</b><br><a href="https://www.nice.org.uk/guidance/ng253" rel="noopener">nice.org.uk/guidance/ng253</a><span class="rd"> — suspected neutropenic sepsis after systemic anticancer treatment; urgent acute oncology assessment without delay for community tests</span></li>'+
         '<li><b>BTS/SIGN 158 — British guideline on the management of asthma (2019): acute asthma sections</b><span class="rd"> — retained for acute attacks after NICE/BTS/SIGN NG245 (2024) replaced the diagnosis, monitoring and chronic-management sections; prednisolone 40–50 mg daily for at least 5 days for an acute attack in adults</span></li>'+
         '<li><b>NICE NG245 (2024, joint with BTS and SIGN) — asthma</b>; <b>NICE NG115 (2018, updated 2019) and NG114 (2018) — COPD</b>; <b>NICE NG106 (2018) — chronic heart failure</b>; <b>NICE CG185 (2014) — bipolar disorder</b><span class="rd"> — flare plans and lithium</span></li>'+
         '<li><b>UKHSA Green Book</b> — chapter 6 (contraindications) and the influenza, pneumococcal and COVID-19 chapters</li>'+
         '<li><b>BNF and SPCs</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — apomorphine (contraindicated with 5-HT3 antagonists such as ondansetron); metformin (temporary discontinuation with dehydration), lithium, digoxin, DOAC, warfarin, methotrexate, theophylline and antiemetic interactions and cautions; agranulocytosis warnings; withdrawal cautions</span></li>'+

  foot:"Sick day rules — Think Kidneys (2018), JBDS 02 (2023), MHRA Drug Safety Update (2016, 2020), NICE NG17, NG28, NG148 and NG243 (2024), the NHS Steroid Emergency Card (NatPSA 2020) and the BNF. This page replaces the former sick-day-rules algorithm and the sick-day clinic tool; DKA itself and insulin dose adjustment in illness have their own protocols. Verify all doses against the current BNF before prescribing."
