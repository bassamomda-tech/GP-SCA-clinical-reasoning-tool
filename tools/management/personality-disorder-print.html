<script>
MG.render({
  icon:"🧩",
  title:"Personality disorders",
  eyebrow:"Protocol · assess and manage in one place",
  stemTitle:"Respond to risk with a plan, not a prescription: a consistent clinician, a crisis plan, safer prescribing and referral for psychological therapy",
  stemSub:"One page for borderline (emotionally unstable) and antisocial personality disorder in primary care, following NICE CG78 and CG77 (both 2009, still current in October 2026; a new NICE guideline on borderline personality disorder is in development). Assess risk to self and others at every crisis, with self-harm managed under NICE NG225. Do not use drugs to treat the core features of the disorder. Prescribe cautiously because of overdose risk. Refer for structured psychological therapy (such as DBT or MBT) through community mental health services. Offer continuity, clear boundaries and an agreed crisis plan, and think about the safety of children and other people.",
  guideline:"NICE CG78 borderline personality disorder (2009) · NICE CG77 antisocial personality disorder (2009) · NICE QS88 personality disorders (2015) · NICE NG225 self-harm (2022) · NICE CG158 conduct disorders (2013, updated 2017) · NHS England Community Mental Health Framework (2019)",
  reviewed:"15 October 2026",
  nextReview:"15 April 2027",
  meta:[
    {t:"NICE CG78 · borderline personality disorder"},
    {t:"NICE CG77 · antisocial personality disorder"},
    {t:"NICE NG225 · self-harm"},
    {t:"New NICE BPD guideline in development: check for publication", tone:"tw"},
    {t:"v1.0 · reviewed Oct 2026", tone:"ok"}
  ],
  lead:"<div class='mg-layers'><a href='#redflags'><b>Risk</b><small>self-harm, suicide, others</small></a><a href='#prescribing'><b>Prescribing</b><small>no drugs for core features</small></a><a href='#therapy'><b>Therapy</b><small>DBT, MBT via CMHT</small></a><a href='#safeguarding'><b>Safeguarding</b><small>children and adults</small></a></div>",
  quickSub:"Six cards for the consultation. Each one traces to a named source under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"Risk first: self-harm, suicide and harm to others", html:"At every crisis, ask about <b>suicidal thoughts, plans, intent and recent self-harm</b>, and about thoughts of harming others. <b>Recent overdose or serious self-injury</b> needs <b>same-day emergency department</b> assessment (999 if life is at risk). Suicidal thoughts with a plan or intent need a <b>same-day crisis team</b> assessment. Do not use risk scales to predict suicide; base decisions on a full assessment and the person's own crisis plan (NICE NG225)."},
    {tone:"amber", h:"Follow the crisis plan, and use a calm, consistent approach", html:"If the person is known to mental health services, <b>follow their crisis plan</b> and contact their care coordinator. Listen, stay calm and non-judgemental, explore the immediate problem and the options, and avoid unplanned changes to medication. People with personality disorder should <b>not be excluded</b> from any service because of the diagnosis or because they self-harm."},
    {tone:"red", h:"No drugs for the core features", html:"NICE CG78 advises <b>not using drug treatment</b> for borderline personality disorder itself or its individual features (emotional instability, self-harm, risk-taking, transient psychotic symptoms), and <b>not using antipsychotics</b> in the medium or long term. Drugs are for <b>coexisting conditions</b> (for example depression, psychosis, ADHD) under their own NICE guidance. NICE CG77 gives the same advice for aggression, anger and impulsivity in antisocial personality disorder."},
    {tone:"amber", h:"Safer prescribing: assume overdose risk", html:"Prescribe <b>small quantities</b> (for example weekly, or more often if needed), avoid drugs that are dangerous in overdose (tricyclics, opioids, large packs of paracetamol), and avoid starting <b>benzodiazepines or Z-drugs</b>. In a crisis, a sedative may be used for <b>no longer than 1 week</b>. Review the whole repeat list and stop drugs without clear benefit."},
    {tone:"blue", h:"Refer for psychological therapy", html:"The main treatments are structured psychological therapies delivered by specialist services, such as <b>dialectical behaviour therapy (DBT)</b> (NICE CG78 names it for women for whom reducing recurrent self-harm is a priority) and <b>mentalisation-based treatment (MBT)</b>. Refer to the <b>community mental health team</b> when distress or risk is high or escalating, or the person wants further treatment. Brief interventions of less than 3 months should not be used specifically for borderline personality disorder."},
    {tone:"green", h:"Continuity, boundaries and safeguarding", html:"Offer a <b>named clinician</b> and regular planned appointments, rather than crisis-driven contact. Be clear and honest about what you can offer. Plan endings and transitions carefully. Think about <b>safeguarding</b>: children in the household, domestic abuse (as victim or perpetrator), exploitation and risk to others, particularly in antisocial personality disorder."}
  ],
  pathwaySub:"Five moves. Step one is where the harm happens if it is skipped.",
  pathway:[
    {title:"Assess risk now", html:"Suicidal thoughts and plans, recent self-harm (including overdose), risk to others, intoxication, and safeguarding. Act on a recent overdose the same day, whatever the person says about it.", alert:true},
    {title:"Use the crisis plan and stay structured", html:"Follow any existing crisis plan, contact the care coordinator, and focus on the immediate problem. Agree what will happen next and when."},
    {title:"Review medicines safely", html:"No drugs for the core features. Treat coexisting conditions. Limit quantities, avoid toxic drugs and benzodiazepines, and use a sedative for no more than 1 week in a crisis."},
    {title:"Refer for specialist help", html:"Community mental health team for assessment and psychological therapy (DBT, MBT or other structured approaches), and for coexisting conditions, substance misuse or forensic concerns."},
    {title:"Provide continuity and safeguarding", html:"Named clinician, planned reviews, physical health checks, and safeguarding for children and adults at risk."}
  ],
  sections:[
    {id:"redflags", nav:"Red flags", title:"Red flags: risk to self and others", sub:"Suicide and self-harm are common in borderline personality disorder. Each crisis needs a fresh assessment.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 999 or emergency department now", html:"Recent overdose (of any amount, including paracetamol), serious self-injury, or an attempt in progress. Overdose needs medical assessment even if the person seems well, because paracetamol toxicity can be delayed.", src:"NICE NG225 (2022)"},
         {tone:"red", h:"🔴 Same-day crisis team assessment", html:"Suicidal thoughts with a plan or intent, escalating self-harm, a sudden change in mental state (including psychotic symptoms), or a credible threat to harm others. Use the local crisis line or home treatment team. Contact the police if someone is in immediate danger.", src:"NICE CG78 (2009) · NICE NG225 (2022)"},
         {tone:"amber", h:"🟠 Urgent: within days", html:"Increasing distress, more frequent self-harm, loss of support (for example a relationship ending or discharge from services), or a request for help that cannot be met in primary care. Contact the care coordinator or refer urgently to the community mental health team.", src:"NICE CG78 (2009)"},
         {tone:"amber", h:"🟠 Safeguarding concerns", html:"Children at risk of harm or neglect, domestic abuse, or a vulnerable adult at risk: follow local safeguarding procedures the same day where there is immediate risk.", src:"NICE CG77 (2009) · Working Together to Safeguard Children (2023)"}
       ]},
       {b:"warn", html:"<b>Do not use risk assessment tools or scales</b> to predict suicide or self-harm, or to decide who gets treatment or who is discharged (NICE NG225). Focus on the person's needs, the context of the crisis, and a safety plan developed with them."},
       {b:"say", html:"I can see things feel unbearable right now. I want to understand what has happened today, and I need to ask you directly: have you thought about ending your life, or have you hurt yourself or taken anything? Whatever you tell me, we will work out together what will keep you safe tonight."}
     ]},

    {id:"recognise", nav:"Recognise", title:"Recognition and assessment", sub:"Personality disorder is diagnosed by specialist mental health services. Primary care recognises the pattern, manages risk and refers.",
     blocks:[
       {b:"table", head:["","Borderline (emotionally unstable) personality disorder","Antisocial personality disorder"], rows:[
         ["<b>Core pattern</b>","Unstable relationships and self-image, intense and changeable emotions, impulsivity, fear of abandonment, recurrent self-harm or suicidal behaviour, chronic emptiness, intense anger, transient stress-related paranoia or dissociation","Persistent disregard for the rights of others: deceitfulness, impulsivity, irritability and aggression, recklessness, irresponsibility, lack of remorse; conduct disorder before age 15"],
         ["<b>Who</b>","Diagnosed more often in women; onset in adolescence or early adulthood","Diagnosed more often in men; common in prisons and forensic services"],
         ["<b>Common coexisting problems</b>","Depression, anxiety, PTSD and complex trauma, eating disorders, substance misuse, ADHD","Substance misuse, depression, anxiety, ADHD, other personality difficulties"],
         ["<b>Classification</b>","ICD-11 diagnoses personality disorder by severity, with a 'borderline pattern' qualifier; ICD-10 uses 'emotionally unstable personality disorder'","ICD-11 uses severity with trait domains (for example dissociality); ICD-10 uses 'dissocial personality disorder'"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"🔎 Assessment in primary care", html:"Look for the long-standing pattern, not a single episode. Ask about trauma, self-harm, substance use, relationships and work, and screen for depression, anxiety, PTSD, ADHD and eating disorders. Do not use the diagnosis to explain away new physical or mental health symptoms.", src:"NICE CG78 (2009) · NICE QS88 (2015)"},
         {tone:"cream", h:"🗣️ Talking about the diagnosis", html:"Explain the diagnosis honestly and without stigma: it describes long-standing patterns that cause distress, it is treatable, and many people improve over time. Avoid language that implies blame. Offer written information and signpost to peer support.", src:"NICE CG78 (2009)"},
         {tone:"amber", h:"🧒 Young people", html:"Borderline personality disorder can be diagnosed under 18 by child and adolescent mental health services. Refer young people with self-harm and emotional instability to CAMHS. Conduct disorder in childhood is managed under NICE CG158, which may help prevent antisocial personality disorder.", src:"NICE CG78 (2009) · NICE CG158 (2013, updated 2017)"},
         {tone:"cream", h:"🤝 Autonomy and hope", html:"Work in a way that builds trust: involve the person in decisions, respect their choices, be consistent and reliable, and keep an optimistic, realistic stance about recovery.", src:"NICE CG78 (2009)"}
       ]}
     ]},

    {id:"prescribing", nav:"Prescribing", title:"Prescribing: what not to do, and how to do it safely", sub:"Medication is the most common intervention in primary care and the least supported by evidence for the disorder itself.",
     blocks:[
       {b:"table", head:["Situation","What NICE advises"], rows:[
         ["<b>Core features of BPD</b> (emotional instability, self-harm, impulsivity, transient psychotic symptoms)","<b>Do not use</b> drug treatment specifically for the disorder or its individual symptoms. Do not use antipsychotics in the medium or long term (NICE CG78)."],
         ["<b>Aggression, anger, impulsivity in antisocial personality disorder</b>","Do not routinely use drug treatment (NICE CG77)."],
         ["<b>Coexisting conditions</b>","Treat depression, anxiety, PTSD, psychosis, ADHD or substance misuse with drugs only as their own NICE guidance recommends, and review the effect."],
         ["<b>Crisis</b>","A sedative may be used cautiously for <b>no longer than 1 week</b> as part of an overall plan. Choose a drug with low toxicity in overdose and little potential for misuse, for example a sedative antihistamine. <span class=mg-dose>Usual adult dose: promethazine hydrochloride 25 mg at night, increased to 50 mg if needed (SPC; check doses in the SPC and your local formulary; <a href='https://www.medicines.org.uk/emc/search?q=promethazine' target=_blank rel=noopener>SPC: promethazine</a>).</span> Agree the stop date when you start it."],
         ["<b>Existing medicines</b>","Review the whole repeat list. Reduce and stop drugs without clear benefit, especially when several are prescribed, in agreement with the person and the specialist team."]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"red", h:"⚠️ Overdose risk", html:"Prescribe small quantities (weekly or more often), with instalment dispensing where appropriate. Avoid tricyclic antidepressants, venlafaxine in high doses, opioids, and benzodiazepines or Z-drugs. Advise on safe storage and removal of stockpiled medicines. Ask about over-the-counter paracetamol and other drugs at home.", src:"NICE NG225 (2022) · NICE CG78 (2009)"},
         {tone:"amber", h:"⚠️ Valproate and other teratogens", html:"Do not use valproate off-label for mood instability. In anyone who could become pregnant, valproate is only used under the MHRA Pregnancy Prevention Programme by specialists, for a licensed indication.", src:"MHRA Drug Safety Update (2023–24) on valproate"},
         {tone:"cream", h:"📋 One prescriber", html:"Agree one prescriber and one pharmacy where possible, record the plan in the notes and the crisis plan, and tell out-of-hours services. This reduces stockpiling and conflicting prescriptions.", src:"NICE CG78 (2009)"},
         {tone:"blue", h:"🍷 Substance misuse", html:"Alcohol and drug misuse increase risk and reduce the benefit of therapy. Offer brief interventions and refer to substance misuse services under the relevant NICE guidance.", src:"NICE CG77 (2009) · NICE CG115 (2011)"}
       ]}
     ]},

    {id:"therapy", nav:"Therapy and referral", title:"Psychological therapies and referral", sub:"Structured psychological treatment is the main treatment and is delivered by specialist services.",
     blocks:[
       {b:"table", head:["Therapy","Notes"], rows:[
         ["<b>Dialectical behaviour therapy (DBT)</b>","NICE CG78 recommends considering DBT for women with borderline personality disorder for whom reducing recurrent self-harm is a priority. Individual therapy plus skills group, usually for a year."],
         ["<b>Mentalisation-based treatment (MBT)</b>","Structured therapy focusing on understanding one's own and others' mental states; widely used in NHS personality disorder services."],
         ["<b>Other structured approaches</b>","Schema therapy, cognitive analytic therapy, structured clinical management and STEPPS, depending on local services. NICE CG78 advises a theory-driven approach with regular supervision, and an explicit and integrated model."],
         ["<b>Antisocial personality disorder</b>","Group-based cognitive and behavioural interventions to reduce offending and antisocial behaviour, often through forensic or probation services (NICE CG77)."]
       ]},
       {b:"cards", items:[
         {tone:"amber", h:"Refer to the community mental health team when", html:"Levels of distress or risk of harm to self or others are high or increasing; there has been no improvement despite primary care support; the person asks for further help; or a diagnosis and specialist treatment plan are needed. Under the NHS Community Mental Health Framework, services are increasingly offered through integrated primary and community teams.", src:"NICE CG78 (2009) · NHS England Community Mental Health Framework (2019)"},
         {tone:"cream", h:"What primary care keeps", html:"Physical health checks, coexisting conditions, prescribing reviews, continuity, and following the crisis plan. When someone is discharged from specialist care, agree a plan for what to do if problems return.", src:"NICE CG78 (2009)"},
         {tone:"blue", h:"Endings and transitions", html:"Endings (of therapy, of a placement, of a key relationship with a clinician) are a time of increased risk. Plan them in advance and agree support.", src:"NICE CG78 (2009)"}
       ]}
     ]},

    {id:"safeguarding", nav:"Safeguarding", title:"Safeguarding, risk to others and special groups", sub:"Think about the people around the patient as well as the patient.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"👶 Children", html:"Consider the effect of the parent's difficulties on any children in the household, including unborn babies. Share concerns with the health visitor, school nurse or children's social care, following local safeguarding procedures.", src:"NICE CG77 (2009) · Working Together to Safeguard Children (2023)"},
         {tone:"amber", h:"🏠 Domestic abuse and violence", html:"Ask about domestic abuse, both as a victim and as a perpetrator, and about access to weapons. Refer to MARAC or the police where there is high risk.", src:"NICE PH50 domestic violence and abuse (2014)"},
         {tone:"amber", h:"🤰 Pregnancy and the postnatal period", html:"Higher risk of relapse and of safeguarding concerns. Refer to perinatal mental health services and coordinate with maternity care.", src:"NICE CG192 antenatal and postnatal mental health (2014, updated 2020)"},
         {tone:"cream", h:"⚕️ Physical health", html:"People with personality disorder have higher rates of physical illness and early death. Offer routine physical health checks, smoking and alcohol support, and sexual health care.", src:"NICE QS88 (2015)"},
         {tone:"cream", h:"🚓 Antisocial personality disorder in the community", html:"Manage within clear and consistent boundaries. Work with probation, forensic and substance misuse services as appropriate, and share information when there is a risk of serious harm to others.", src:"NICE CG77 (2009)"},
         {tone:"blue", h:"🧑‍⚕️ Staff", html:"Working with people in recurrent crisis is demanding. Use supervision, discuss difficult cases with colleagues and the mental health team, and keep a consistent team approach.", src:"NICE CG78 (2009)"}
       ]}
     ]},

    {id:"monitor", nav:"Follow-up", title:"Follow-up and safety-netting", sub:"Planned contact reduces crisis contact.",
     blocks:[
       {b:"table", head:["When","What"], rows:[
         ["Every contact","Risk to self and others, recent self-harm, substance use, safeguarding"],
         ["Planned reviews (for example every 2 to 4 weeks while unstable)","Named clinician; coexisting conditions; medicines and quantities; progress with therapy"],
         ["Annually","Physical health check; review of the crisis plan and medicines"]
       ]},
       {b:"say", html:"If you feel you might act on thoughts of ending your life, call 999 or go to the emergency department. If you have taken an overdose, even a small one, go to the emergency department straight away. For a crisis that is not immediately dangerous, use the crisis line on your plan, call NHS 111 and choose the mental health option, or contact us the same day. You can also call Samaritans on 116 123 at any time."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card. The Casebook holds the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 24-year-old woman with a diagnosis of emotionally unstable personality disorder asks for diazepam because she 'can't cope' after a break-up. She has cut her arms this week and has a 3-year-old son. She says the last doctor 'gave up' on her.", src:"NICE CG78 (2009) · NICE NG225 (2022)"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Assesses <b>suicide and self-harm risk</b> directly, including any overdose. Uses a <b>calm, validating</b> approach and checks the <b>crisis plan</b>. Explains why <b>benzodiazepines are not helpful</b> and offers a short-term alternative only if needed (no longer than 1 week, small quantity). Considers <b>safeguarding</b> for her son. Contacts or refers to the <b>community mental health team</b> for DBT. Arranges a <b>named follow-up</b> and clear safety-netting.", src:"NICE CG78 (2009) · NICE NG225 (2022)"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Every recommendation on this page traces to a named primary source.",
     blocks:[
       {b:"html", html:"<div class='card'><h3>Evidence panel</h3><ul class='evlist'>"+
         "<li><b>NICE CG78 — Borderline personality disorder: recognition and management (2009)</b><br><a href='https://www.nice.org.uk/guidance/cg78' rel='noopener'>nice.org.uk/guidance/cg78</a><span class='rd'> — no drug treatment for the disorder or its symptoms, crisis sedation for no more than 1 week, primary care crisis management, CMHT referral, DBT, no brief interventions under 3 months, autonomy, endings. A new NICE guideline is in development (check for publication)</span></li>"+
         "<li><b>NICE CG77 — Antisocial personality disorder: prevention and management (2009)</b><br><a href='https://www.nice.org.uk/guidance/cg77' rel='noopener'>nice.org.uk/guidance/cg77</a><span class='rd'> — group cognitive and behavioural interventions, no routine drug treatment for aggression or impulsivity, safeguarding children, comorbidity</span></li>"+
         "<li><b>NICE QS88 — Personality disorders: borderline and antisocial (2015)</b><br><a href='https://www.nice.org.uk/guidance/qs88' rel='noopener'>nice.org.uk/guidance/qs88</a><span class='rd'> — structured psychological interventions, crisis plans, physical health</span></li>"+
         "<li><b>NICE NG225 — Self-harm: assessment, management and preventing recurrence (2022)</b><br><a href='https://www.nice.org.uk/guidance/ng225' rel='noopener'>nice.org.uk/guidance/ng225</a><span class='rd'> — no risk tools to predict, safety plans, safer prescribing, urgent assessment</span></li>"+
         "<li><b>NICE CG158 — Antisocial behaviour and conduct disorders in children and young people (2013, updated 2017)</b><br><a href='https://www.nice.org.uk/guidance/cg158' rel='noopener'>nice.org.uk/guidance/cg158</a><span class='rd'> — early intervention</span></li>"+
         "<li><b>NHS England — Community Mental Health Framework for Adults and Older Adults (2019)</b><br><a href='https://www.england.nhs.uk/publication/the-community-mental-health-framework-for-adults-and-older-adults/' rel='noopener'>england.nhs.uk — community mental health framework</a><span class='rd'> — integrated community services for people with a diagnosis of personality disorder</span></li>"+
         "<li><b>NICE CG192 (perinatal mental health), NICE PH50 (domestic violence and abuse), NICE CG115 (alcohol dependence); HM Government — Working Together to Safeguard Children (2023)</b><br><a href='https://www.nice.org.uk/guidance/cg192' rel='noopener'>nice.org.uk/guidance/cg192</a> · <a href='https://www.nice.org.uk/guidance/ph50' rel='noopener'>ph50</a> · <a href='https://www.nice.org.uk/guidance/cg115' rel='noopener'>cg115</a> · <a href='https://www.gov.uk/government/publications/working-together-to-safeguard-children--2' rel='noopener'>gov.uk — Working Together</a><span class='rd'> — special groups and safeguarding</span></li>"+
         "<li><b>MHRA Drug Safety Updates on valproate (2023–24); promethazine SPC</b><br><a href='https://www.gov.uk/drug-safety-update' rel='noopener'>gov.uk/drug-safety-update</a> · <a href='https://www.medicines.org.uk/emc' rel='noopener'>medicines.org.uk/emc</a><span class='rd'> — teratogen safety, sedation dose</span></li>"+
         "</ul></div>"}
     ]}
  ],
  foot:"Borderline and antisocial personality disorder in primary care — NICE CG78 and CG77 (2009), NICE QS88, NICE NG225 and the NHS England Community Mental Health Framework. A new NICE guideline on borderline personality disorder is in development: check for publication. Follow local crisis and safeguarding procedures. Not a substitute for clinical judgement."
});
</script>
