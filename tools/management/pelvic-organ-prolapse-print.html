  quickSub:"If you read nothing else on this page, read these six cards. Every number traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Examine the bulge — don't assume it is \u201cjust a prolapse\u201d", html:"An irregular, ulcerating, friable or fixed vaginal mass, or any post-menopausal bleeding, needs the 2-week-wait gynaecology pathway. <b>Do NOT attempt manual reduction of a suspicious mass.</b> PMB in a woman with prolapse is easily and wrongly attributed to a decubitus ulcer — <b>endometrial carcinoma can present alongside prolapse.</b>"},
    {tone:"red", h:"Procidentia can obstruct the kidneys", html:"Complete prolapse with urinary retention, bilateral flank pain and hydronephrosis means urethral or ureteric kinking causing upper tract obstruction. Same-day urology or gynaecology: catheterise, renal tract USS, pessary reduction as a bridge to surgery."},
    {tone:"amber", h:"Treat by symptoms, not by the stage number", html:"Symptomatic prolapse needing treatment is defined by the patient's symptoms and quality-of-life impact, not the stage alone. A Stage 2 prolapse causing severe urinary and sexual dysfunction needs treatment; an asymptomatic Stage 3 may be managed conservatively. The simplified GP staging uses the hymen as the reference point."},
    {tone:"blue", h:"Supervised PFMT — a leaflet is not treatment", html:"Supervised pelvic floor muscle training is first-line for all symptomatic POP stages 1–3 (NICE NG123). Cochrane (Hagen 2011): supervised PFMT gave a 50% improvement in symptoms and reduced prolapse stage in 50% of women at 6 months. Exercises given as a leaflet without supervision are significantly less effective — refer to a women's health physiotherapist, often by NHS self-referral."},
    {tone:"green", h:"The ring pessary is effective and badly underused", html:"<b>Successful in about 65–75% of women with Stage 1–3 POP</b>, and <b>not merely a bridge to surgery</b> — many women use one as long-term preferred management for decades. No operative risk, reversible, available at the diagnosing appointment if the GP is trained. Offer topical vaginal oestrogen alongside it to every menopausal woman with POP."},
    {tone:"purple", h:"Mesh complications bypass local gynaecology", html:"Any symptom of mesh complication after previous vaginal mesh surgery — pain, dyspareunia, erosion, extrusion, recurrent UTI, new urinary or bowel symptoms, at any interval, even years later — goes direct to an NHS England Mesh Specialist Centre. <b>Do not attempt removal or reassurance in primary care.</b> Report via Yellow Card, and issue a prescription-charge exemption letter."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step is the one that stops a cancer being called a prolapse.",
  pathway:[

    {title:"Stage by compartment", html:"<b>Speculum plus bimanual; ask her to cough or strain.</b> Anterior (cystocoele) · posterior (rectocoele/rectocele or enterocoele/enterocele) · apical (uterine or vault). Grade against the hymen; treat atrophy or ulceration before fitting a pessary."},

    {title:"Review and safety-net", html:"Pessary review every 3–6 months with inspection for erosion; PFMT review at 3 months. Same-day for retention, an irremovable pessary, or new bleeding or offensive discharge."}

  sections:[

    {id:"severe", nav:"Exclude first", title:"Red flags — malignancy, obstruction and acute complications",
     sub:"Every vaginal bulge is examined. The job of this step is to find the ones that are not prolapse, or not only prolapse.",
     blocks:[
       {b:"table", head:["Presentation","Suggests","Action"], rows:[
         ["Vaginal mass + irregular surface + bleeding + friable tissue + age &gt;60 + does not reduce","<b>Vaginal or cervical malignancy masquerading as prolapse</b>","2WW gynaecology-oncology. Examination under anaesthesia plus biopsy. Do NOT attempt manual reduction"],
         ["Procidentia + urinary retention + hydronephrosis + bilateral flank pain","Complete prolapse with urethral or ureteric kinking causing urinary tract obstruction","Same-day urology or gynaecology. Catheterisation. Renal tract USS (hydroureteronephrosis). Pessary reduction as a bridge to surgery"],
         ["<b>Prolapse + acute urinary retention</b> (unable to void, suprapubic pain, distended bladder)","<b>Cystocoele with severe anterior wall descent kinking the urethra</b>","Same-day GP or A&amp;E. Urethral catheterisation. Try manual reduction of the prolapse, then attempt voiding"],
         ["Prolapse + ulceration + bleeding of the prolapsed tissue + chronic exposed mucosa","<b>Decubitus ulcer of the prolapsed vaginal wall</b>, from chronic mucosal trauma against clothing","Urgent gynaecology. Oestrogen cream to the ulcer bed plus a ring pessary to reduce the prolapse. Delay definitive surgery until the ulcer has healed"],
         ["<b>Post-menopausal bleeding + prolapse + endometrial thickening on USS</b>","<b>Endometrial carcinoma presenting alongside prolapse</b> — the bleeding may be wrongly attributed to a decubitus ulcer","<b>2WW gynaecology-oncology. Endometrial biopsy plus transvaginal USS</b>"],
         ["Chronic pelvic pain + dyspareunia + palpable mesh erosion through the vaginal wall","<b>Vaginal mesh erosion or extrusion — a notifiable complication</b>","NHS England Mesh Specialist Centre referral (MHRA guidance). Do NOT attempt mesh removal in primary care"]
       ]},
       {b:"why", html:"The vaginal mesh complication pathway is a specific MHRA and NHS England mandated referral route. Following the Independent Medicines and Medical Devices Safety (IMMDS) Review — the Cumberlege Report, 2020 — all women with complications from pelvic floor mesh must be referred to one of the NHS England-designated specialist mesh complication centres, which are multidisciplinary teams with expertise in mesh removal, urological reconstruction and chronic pain management. The GP's job is fourfold: (1) recognise mesh complications — dyspareunia, pelvic pain, vaginal discharge, palpable mesh, recurrent UTI, urinary symptoms — occurring at any time after insertion, even years later; (2) refer directly to the nearest NHS mesh centre, bypassing local gynaecology; (3) report to MHRA via Yellow Card if not already reported; (4) issue a medical exemption letter for prescription charges, for which patients with mesh complications qualify. Attempting to manage or reassure about mesh complications in primary care without specialist referral is inappropriate."},
       {b:"dl", rows:[
         ["<b>NG12 — the criteria that apply here</b>","<b>Two NICE NG12 routes are directly relevant.</b> Vaginal cancer: consider a suspected cancer pathway referral for a woman with an unexplained palpable mass in or at the entrance to the vagina — which is exactly what an irregular, friable or fixed \u201cprolapse\u201d may turn out to be. Endometrial cancer: refer women aged 55 and over with post-menopausal bleeding on a suspected cancer pathway, and consider direct-access ultrasound in women under 55 with PMB. The trap this page exists to prevent is attributing PMB to a prolapse decubitus ulcer and never investigating it. Restated in <a href='#refer'>Refer</a>"]
       ]}
     ]},

    {id:"confirm", nav:"Stage it", title:"Classification — POP-Q, compartments and consequences",
     blocks:[
       {b:"dl", rows:[
         ["<b>POP-Q staging</b>","Stage 0 — no descent on maximal strain. Stage 1 — leading edge &gt;1 cm above the hymen, usually asymptomatic. Stage 2 — leading edge between 1 cm above and 1 cm below the hymen, mildly symptomatic. Stage 3 — leading edge &gt;1 cm beyond the hymen, usually symptomatic. Stage 4 — complete eversion or procidentia"],
         ["<b>Cystocoele / cystocele (anterior wall)</b>","Bladder descends into the anterior vaginal wall — the most common form. Dragging sensation, difficulty voiding, incomplete emptying, stress urinary incontinence"],
         ["<b>Rectocoele (posterior wall)</b>","Rectum herniates into the posterior vaginal wall. Difficulty defecating with splinting and digitation — the patient inserts a finger into the vagina to support the posterior wall to facilitate defecation"],
         ["<b>Uterine and vault prolapse, enterocoele</b>","Uterine: descent of the uterus through the vaginal canal — Grades I–III, or POP-Q Stage 1-4. Vault: descent of the vaginal vault after hysterectomy. Enterocoele: small bowel herniation into the upper posterior vaginal wall, often post-hysterectomy"],
         ["<b>Functional consequences</b>","Urinary: stress incontinence, urge incontinence and urinary urgency, voiding difficulty, incomplete emptying, recurrent UTI. Bowel: obstructive defecation, splinting, incomplete emptying. Sexual: dyspareunia, reduced sensation, avoidance. Psychological: shame, reduced quality of life, social withdrawal"],
         ["<b>Differential for a vaginal lump</b>","Cystocoele · rectocoele · the uterine cervix (firm, central) · vaginal cysts — Gartner duct cyst (lateral wall, benign), Bartholin cyst, inclusion cyst (post-repair) · urethral diverticulum (suburethral mass, dysuria, post-void dribbling, dyspareunia) · vaginal malignancy (irregular, friable, bleeds on contact — 2WW immediately)"]
       ]},
       {b:"why", html:"The POP-Q system replaced the older Baden-Walker grading as the international standard — it uses six fixed anatomical reference points (Aa, Ba, Ap, Bp, C, D) measured in centimetres relative to the hymenal ring (negative above, positive below), allowing objective comparison across examinations, operators and trials. For GPs the simplified staging using the hymen is sufficient: Stage 1 (above) → reassure plus lifestyle; Stage 2 (at the level) → pelvic floor physiotherapy plus pessary discussion; Stage 3–4 (beyond) → gynaecology referral. But the governing principle is not the number: symptomatic prolapse requiring treatment is defined by the patient's symptoms and quality-of-life impact, not the stage alone."}
     ]},

    {id:"workup", nav:"Assess", title:"History, examination and investigations",
     sub:"Two things here change management: the masked stress incontinence check, and the connective tissue question in a young woman.",
     blocks:[
       {b:"table", head:["Domain","Detail"], rows:[
         ["<b>History</b>","Bulge or lump felt or seen — the most specific symptom (\u201csomething coming down\u201d); pelvic pressure or dragging, worse at the end of the day or after prolonged standing. Bowel: straining, incomplete emptying, splinting (pathognomonic for rectocoele). Sexual: dyspareunia, awareness of a lump during intercourse. Obstetric: parity, instrumental delivery, large babies, prolonged second stage, perineal lacerations. Menopause status. BMI and chronic straining. Previous prolapse surgery. Family history of connective tissue disorders"],
         ["<b>Examination</b>","Supine (Sims' speculum) and/or lithotomy. Ask her to cough or strain (Valsalva) to demonstrate it. Identify anterior wall descent, posterior wall descent (anterior blade retracted), uterine descent, or vault if post-hysterectomy. Pelvic floor muscle assessment on digital examination — squeeze strength on the 0–5 Oxford scale"],
         ["<b>The masked SUI check</b>","Examine with the prolapse reduced and ask her to cough — leakage with the prolapse reduced means masked (occult) stress urinary incontinence, which the prolapse was splinting"],
         ["<b>Investigations</b>","Urine dipstick plus MSU (recurrent UTI from incomplete emptying) · 3-day bladder diary · post-void residual USS (a residual &gt;150 mL is significant) · urodynamics (specialist, if stress and urge incontinence coexist, before incontinence surgery) · cervical smear up to date before gynaecology referral · transvaginal USS if there is concurrent PMB or pelvic pain"],
         ["<b>Risk factors</b>","Each vaginal birth increases POP risk by approximately 40%; instrumental delivery (forceps, Kjelland) roughly doubles it. Oestrogen deficiency. Obesity (BMI &gt;30). Connective tissue disorders — Marfan, Ehlers-Danlos, joint hypermobility. Chronic straining — constipation, chronic cough (COPD), heavy manual labour. Prior pelvic surgery — hysterectomy raises vault prolapse risk, and previous prolapse surgery carries a 30% recurrence rate. Ethnicity: lower risk in Black and South Asian women"],
         ["<b>Quality of life</b>","ICIQ-VS and PFDI-20 are validated PROMs — administer at first consultation and after treatment. About 40% of women with symptomatic POP avoid sex. Treatment decisions are guided by QoL impact, not anatomical stage alone"]
       ]},
       {b:"warn", html:"Masked stress incontinence is the pre-operative check that prevents an avoidable surgical complication. In significant anterior wall prolapse the prolapsing bladder and urethra kink or compress the urethra, preventing or reducing stress incontinence. When the prolapse is repaired and the urethra straightened, pre-existing sphincter weakness is unmasked — a woman with no stress incontinence before surgery develops it afterwards (\u201cde novo stress incontinence\u201d, or unmasked SUI). Examine with the prolapse held reduced — with your fingers or a ring pessary — then ask her to cough. Communicate the result to the gynaecologist, who may plan a concurrent mid-urethral sling at the time of repair."},
       {b:"why", html:"The connective tissue disorder screen in young women with POP is underperformed. Symptomatic prolapse in a nulliparous woman, or in a woman under 40 with minimal obstetric history, should raise the possibility of an underlying connective tissue disorder. The <b>Beighton score</b> — a 9-point hypermobility scale (passive dorsiflexion of the 5th MCP joint &gt;90°, thumb apposition to the forearm, elbow and knee hyperextension &gt;10°, and palms flat on the floor with straight knees) — identifies joint hypermobility, and a score ≥5/9 suggests hypermobile Ehlers-Danlos syndrome (hEDS) or hypermobility spectrum disorder. Women with hEDS and POP benefit from connective tissue-aware physiotherapy, have a higher risk of surgical failure, and should be referred to specialist urogynaecology centres experienced in connective tissue disorders for surgical planning."}
     ]},

    {id:"ladder", nav:"Treat", title:"Conservative management first, then surgery",
     sub:"NICE NG123: offer supervised PFMT, a pessary and topical oestrogen before surgery is considered.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Step 1", title:"Supervised pelvic floor muscle training", when:"all symptomatic stage 1–3",
          html:"<b>Refer to a women's health physiotherapist for a supervised programme — assessment (Oxford scale 0–5 or perineometry), an individualised programme, and appointments weekly or fortnightly. <b>NG123 specifies a supervised programme of ≥ 16 weeks for symptomatic stage 1–2</b> (the source pathway also quotes a 6-week minimum course length elsewhere — follow the 16-week NG123 figure).</b> Technique: contract as if stopping the flow of urine, hold 10 seconds, relax 10 seconds, 10–15 repetitions, 3 sets a day. NICE NG123 recommends a minimum of 3 months supervised PFMT before considering surgery. <b>Real-time biofeedback</b> helps women with poor proprioceptive awareness. <b>Lifelong maintenance — not a short course.</b>"},
         {step:"Step 2", title:"Ring pessary plus topical oestrogen", when:"offer to all symptomatic women, any stage",
          fromLabel:"alternative to surgery, or a bridge while waiting",
          html:"Ring pessary (first-line type): flexible silicone ring sitting in the posterior fornix and over the pubic symphysis. Sizes 50–100 mm in 5 mm increments. Fitting: insert in Sims' or lithotomy position; confirm she can micturate comfortably, has no pain, and the ring is not palpable or visible at the introitus. <b>Change every 3–6 months</b> (GP or practice nurse). Other types: Gellhorn (central stem) and shelf pessaries for higher stage, cube pessary for severe prolapse, ring-with-support for cystocoele. Alongside it: Vagifem 10 microgram vaginal tablet daily for 2 weeks then twice weekly, or Ovestin cream 0.5 mg daily for 3 weeks then twice weekly. Systemic absorption is minimal — safe for most women including many breast cancer survivors, though discuss with the oncologist for those treated with an aromatase inhibitor."},
         {step:"Step 3", title:"Lifestyle — reduce intra-abdominal load", when:"alongside, not afterwards",
          fromLabel:"modifiable drivers",
          html:"Weight loss, treat chronic constipation and avoid straining, treat chronic cough, avoid heavy lifting, and manage coexisting urinary symptoms. Topical oestrogen for atrophy also improves tissue tolerance of a pessary."},
         {step:"Step 4", title:"Surgery — native tissue repair", when:"failed conservative care, or patient choice",
          fromLabel:"3 months PFMT plus pessary trial",
          html:"Anterior colporrhaphy (cystocoele) — approximately 70–80% success at 1 year, falling to about 60% at 5 years. Posterior colporrhaphy (rectocoele). Sacrospinous ligament fixation (SSLF) or uterosacral ligament suspension for vault or uterine prolapse. Manchester repair for cervical or uterine prolapse, preserving the uterus. NICE NG123: offer uterus-preserving surgery as an option if the patient prefers — sacrospinous hysteropexy or laparoscopic pectopexy."},
         {step:"Step 5", title:"Sacrocolpopexy — gold standard for vault prolapse", when:"fit patient, durable repair needed",
          fromLabel:"specialist decision",
          html:"Laparoscopic or robotic sacrocolpopexy: mesh from the vaginal vault to the anterior longitudinal ligament of the sacrum. NICE IPG283 — approximately 95% success at 5 years for vault prolapse, higher than native tissue repair. Complications: sacral injury (&lt;1%), mesh erosion approximately 3–5%, bowel and bladder injury."}
       ]},
       {b:"warn", html:"Laparoscopic sacrocolpopexy with mesh is explicitly different from the MHRA-paused vaginal mesh — this is a critical point of patient communication. The MHRA's 2018 pause applies specifically to transvaginal mesh placement for POP (anterior and posterior mesh kits placed through the vagina). Sacrocolpopexy places mesh via a laparoscopic intraperitoneal route, on the outside of the vaginal wall rather than through the vaginal mucosa — which is the main reason for the different complication profile: vaginal erosion of approximately 3–5% versus approximately 10–20% for transvaginal mesh in early studies. Laparoscopic sacrocolpopexy is still performed, endorsed by NICE (IPG283), and is the recommended gold standard for vault prolapse in fit patients — the media coverage of \u201cbanned mesh\u201d does not apply to this procedure."},
       {b:"why", html:"The women's health physiotherapist is the most important referral in conservative POP management. The training must be supervised, not leaflet-based: a Cochrane meta-analysis (Hagen et al., 2011) showed supervised PFMT significantly reduced POP symptoms (50% improvement), improved pelvic floor muscle strength, and reduced prolapse stage in 50% of women at 6 months. Every GP surgery should have a referral pathway to a women's health physiotherapist — in many areas this is available as NHS self-referral. And on pessaries: they are successful in approximately 65–75% of women with Stage 1–3 POP, and are not just a temporary bridge — many women use them as long-term preferred management for decades. Advantages over surgery: no operative risk, reversible, usable during pregnancy with adapted technique, and available immediately — the same appointment as the diagnosis if the GP is trained and equipped. <b>Pessary fitting training takes approximately half a day</b>, and practices offering it cut gynaecology waiting times and give earlier symptom relief."}
     ]},

    {id:"lifestyle", nav:"Pelvic floor health", title:"Prevention, self-management and patient education",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"🏋️ Lifelong pelvic floor exercises", html:"<b>Three sets of 10 contractions daily, lifelong.</b> Correctly performed: contract the pubococcygeus as if stopping midstream urine and passing wind simultaneously, hold 10 seconds, relax fully. Common error: holding the breath and contracting the abdominals instead — counterproductive, because it raises intra-abdominal pressure. <b>Squeezy NHS app</b> (free, designed by NHS physiotherapists) for reminders and programmes."},
         {tone:"blue", h:"💪 \u201cThe knack\u201d — teachable in 60 seconds", html:"Deliberately contract the pelvic floor 1–2 seconds before and throughout a cough, sneeze, lift or jump. Miller et al. (1998) showed the knack reduced leakage during medium-intensity coughing by 73% and maximum-intensity coughing by 98%. Teach it in the room: ask her to cough; if she leaks, say <em>\u201cnow squeeze your pelvic floor first, then cough\u201d</em> — most notice an immediate difference."},
         {tone:"amber", h:"🚽 Constipation and toilet posture", html:"<b>Straining is a direct cause of progressive pelvic floor damage</b> — repetitive Valsalva stretches the pudendal nerve and traumatises levator ani. 30 g dietary fibre plus 1.5–2 L water a day, macrogol if needed. Footstool to raise the knees (the squatting angle reduces puborectalis angulation). Never strain: if nothing after 5 minutes, stop, walk around, try later."},
         {tone:"green", h:"⚖️ Weight management", html:"BMI &gt;30 significantly raises intra-abdominal pressure — weight loss of 5–10% reduces POP symptoms and improves the response to physiotherapy. Refer via the NHS weight management pathway — Tier 2 group programme, or Tier 3 specialist service. Before any prolapse surgery, NICE recommends targeting a BMI &lt;30 where possible, since obesity increases wound infection and VTE risk and reduces surgical success."},
         {tone:"plain", h:"🫁 Chronic cough", html:"Each cough generates sudden intra-abdominal pressure exceeding 100 mmHg. Optimise the cause — COPD inhaler review, intranasal corticosteroid for rhinitis, <b>switch an ACE inhibitor to an ARB</b> — and teach the knack."},
         {tone:"cream", h:"🏃 Return to exercise", html:"3 months of PFMT before returning to any impact exercise post-partum; 6 months before high-impact sport after prolapse surgery. <b>Low-impact is always encouraged</b> — swimming, stationary cycling, yoga, walking. Heavy barbell squats and deadlifts raise intra-abdominal pressure substantially; the breath-hold (Valsalva) technique is contraindicated in POP."},
         {tone:"blue", h:"🔄 Pessary self-management", html:"Some women prefer to insert and remove their own ring — independence, fewer GP visits, and spontaneous sexual activity (remove before intercourse). Training by a women's health physiotherapist or specialist nurse. Technique: fold the ring in half, insert posteriorly like a tampon, rotate so it sits in the posterior fornix behind the pubic symphysis; remove by hooking a finger inside and pulling gently. Change daily or every 1–4 weeks."},
         {tone:"cream", h:"💬 Sexual health — you raise it", html:"<b>About 40% of women with symptomatic POP experience sexual dysfunction.</b> Open it yourself: <em>\u201cSome women with prolapse notice changes in their sex life — is that something that's affecting you?\u201d</em> Topical oestrogen improves tissue quality and dyspareunia; physiotherapy improves sexual function; surgical repair improves it in approximately 70%. <b>Do not recommend abstinence as management — it prolongs the impact.</b>"}
       ]},
       {b:"dl", rows:[
         ["<b>Post-natal pelvic floor care</b>","PFMT starts as soon as comfortable after vaginal delivery, even day 1. Third- and fourth-degree perineal tears (involving the anal sphincter) get a post-natal physiotherapy referral. Prolapse symptoms in the first year post-natal → women's health physiotherapy. Wait 12 weeks post-delivery before assessing prolapse stage — early post-natal prolapse often improves significantly with muscle recovery. High obstetric risk (third- or fourth-degree tear, forceps, large baby): pelvic floor assessment at the 6-week check regardless of symptoms"]
       ]}
     ]},

    {id:"monitor", nav:"Follow-up", title:"Pessary reviews, physiotherapy outcomes and post-operative care",
     blocks:[
       {b:"table", head:["What","Detail"], rows:[
         ["<b>Ring pessary review — every 3–6 months</b>","Remove, inspect the vaginal walls for erosion (a grey-white area of thinned mucosa) or ulceration, clean the ring with warm water and soap, reinsert or resize. Apply topical oestrogen at review if the mucosa is atrophic. If there is discharge or odour: take an HVS, exclude bacterial vaginosis, and check the ring is not too small. Document ring size and findings each visit"],
         ["<b>Physiotherapy outcome — 3 months</b>","Has PFMT improved symptoms? Compare ICIQ-VS before and after. Significant improvement → continue and maintain indefinitely. Minimal improvement at 3 months → gynaecology referral for pessary or surgery discussion"],
         ["<b>Post-surgery — 6 weeks</b>","GP wound check, urine culture if there are LUTS, and confirm the physiotherapy referral for post-operative pelvic floor rehabilitation"],
         ["<b>Post-surgery — 3 and 12 months</b>","At 3 months: sexual function, continence status, recurrence check. At 12 months: specialist urogynaecology review. Recurrence of bulge symptoms → re-examine and refer back"],
         ["<b>Pessary safety-netting</b>","Contact the GP or A&amp;E for inability to remove the pessary, severe pelvic pain, urinary retention or unusual bleeding. Do not attempt to remove an impacted or retained pessary without examination — refer to gynaecology if it cannot be removed at a routine appointment"]
       ]},
       {b:"why", html:"Post-operative pelvic floor physiotherapy is a critical but frequently omitted step. A systematic review (<b>Frawley et al., 2014</b>) showed that post-operative supervised PFMT significantly reduces the risk of prolapse recurrence and improves functional outcomes after native tissue repair. The mechanism is straightforward: surgery restores anatomy but does not rehabilitate pelvic floor muscle function, which remains weak from the original obstetric or age-related damage — so the restored anatomy is subjected to the same functional weaknesses that caused the prolapse. NICE NG123 recommends post-operative PFMT for all women after prolapse repair. The GP's part: ensure the physiotherapy referral is made at the 6-week appointment if the surgical team has not arranged it, advise no impact exercise for 6 months, and advise lifelong pelvic floor exercises — the recurrence rate is 30% at 5 years after surgery without physiotherapy."},
       {b:"cards", items:[
         {tone:"red", h:"🔴 Same-day", html:"Inability to pass urine (retention) · a pessary that cannot be removed · new bleeding or offensive discharge."},
         {tone:"purple", h:"🟣 2WW", html:"A suspicious mass, or post-menopausal bleeding, developing at any point."},
         {tone:"amber", h:"🟠 Back to gynaecology", html:"<b>Symptoms progressing despite conservative care → urogynaecology.</b>"},
         {tone:"green", h:"📱 Support", html:"Squeezy NHS app for exercise reminders; women's health physiotherapy self-referral where available locally."}
       ]},
       {b:"say", html:"What you can feel is a prolapse — the wall of the vagina has lost some of its support, so the bladder or bowel presses into it. It is very common and it is not dangerous. I have examined it properly, which matters, because occasionally a lump turns out to be something else that needs checking urgently — yours does not. The most important thing is that we do not jump to surgery. Supervised pelvic floor physiotherapy helps about half of women substantially, and a small silicone ring called a pessary, which I can fit here, works well for roughly two-thirds to three-quarters — plenty of women use one for years and never need an operation. I will also give you a small amount of oestrogen cream, which makes the tissue more comfortable. What decides the treatment is how much it is bothering you, not the grade I write in the notes."}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways",
     blocks:[
       {b:"cards", items:[
         {tone:"purple", h:"2WW gynaecology-oncology", html:"<b>A vaginal lump with an irregular, bleeding or friable appearance</b> (NG12: an unexplained palpable mass in or at the entrance to the vagina) · post-menopausal bleeding — refer on a suspected cancer pathway at 55 and over, and consider direct-access ultrasound under 55 · cannot clinically distinguish from malignancy."},
         {tone:"red", h:"Same-day urology / gynaecology", html:"Urinary retention from prolapse (acute obstruction) · complete procidentia with suspected renal obstruction · decubitus ulcer requiring urgent management."},
         {tone:"amber", h:"NHS Mesh Specialist Centre", html:"Any symptom of mesh complication after previous mesh surgery — pain, erosion, extrusion, new urinary or bowel symptoms. Direct referral, bypassing local gynaecology."},
         {tone:"blue", h:"Gynaecology (routine)", html:"Stage 3–4 prolapse (beyond the hymen) regardless of treatment preference · Stage 2 with significant QoL impact not responding to 3 months of physiotherapy plus pessary · desire for surgical treatment · vault prolapse post-hysterectomy."},
         {tone:"green", h:"Women's health physiotherapy", html:"All symptomatic POP stages 1–3 — supervised PFMT, often available as NHS self-referral. Also post-operative rehabilitation, and post-natal referral after third- or fourth-degree tears."},
         {tone:"cream", h:"GP management", html:"Stage 1–2 with mild symptoms: supervised PFMT, topical vaginal oestrogen (Vagifem 10 mcg or Ovestin cream), and a ring pessary — offered to all symptomatic women regardless of stage, as an alternative to surgery or a bridge while awaiting it."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 61-year-old describes \u201csomething coming down\u201d for a year, worse by the evening, and has started splinting to open her bowels. She mentions in passing that she had \u201ca bit of spotting\u201d twice last month, which she has assumed is from the prolapse rubbing. She had a forceps delivery and two vaginal births, and asks whether she will \u201cjust have to have it all taken away\u201d."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Does not attribute the post-menopausal bleeding to the prolapse — recognises PMB at 61 as a 2WW endometrial route in its own right and refers while managing the prolapse; <b>examines and stages by compartment rather than accepting the label</b>; identifies the <b>rectocoele from splinting</b>; <b>checks for masked stress incontinence before any surgical discussion</b>; offers supervised PFMT and a ring pessary with topical oestrogen, and corrects the assumption that surgery is inevitable; and — the step candidates miss — raises the sexual-function conversation herself rather than waiting to be asked."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>NICE NG123 — Urinary incontinence and pelvic organ prolapse in women: management (2019)<br><a href="https://www.nice.org.uk/guidance/ng123" rel="noopener">nice.org.uk/guidance/ng123</a><span class="rd"> — supervised PFMT as first-line with a 3-month minimum before surgery, pessary use, uterus-preserving surgery as an option, and post-operative PFMT for all women after repair. <b>This is the primary UK guideline for POP.</b> Some secondary sources additionally cite an \u201cRCOG Green-top Guideline for POP (2018)\u201d; the RCOG Green-top in this area is <b>No. 46, Post-Hysterectomy Vaginal Vault Prolapse</b>, which covers vault prolapse specifically rather than POP as a whole — check the current RCOG listing before citing it</span></li>'+
         '<li>NICE IPG283 — Sacrocolpopexy using mesh for vaginal vault prolapse repair<br><a href="https://www.nice.org.uk/guidance/ipg283" rel="noopener">nice.org.uk/guidance/ipg283</a><span class="rd"> — the gold-standard vault repair, approximately 95% success at 5 years, and the mesh erosion rate of about 3–5%</span></li>'+
         '<li><b>MHRA — surgical mesh guidance and the 2018 pause on transvaginal mesh</b><span class="rd"> — the pause applies to transvaginal mesh kits, not to laparoscopic sacrocolpopexy; Yellow Card reporting for mesh complications</span></li>'+
         '<li>Independent Medicines and Medical Devices Safety Review (Cumberlege Report, 2020) and NHS England Mesh Specialist Centres<span class="rd"> — the mandated direct referral route for all pelvic floor mesh complications, and prescription-charge exemption for affected patients</span></li>'+
         '<li>Hagen S et al. Pelvic floor muscle training for pelvic organ prolapse. <em>Cochrane Database Syst Rev</em> 2011<span class="rd"> — supervised PFMT: 50% symptom improvement and reduced prolapse stage in 50% of women at 6 months, and the superiority of supervised training over leaflet-based exercises</span></li>'+
         '<li><b>Frawley H et al. (2014) — post-operative pelvic floor muscle training</b><span class="rd"> — reduced prolapse recurrence and improved functional outcomes after native tissue repair</span></li>'+
         '<li><b>Miller JM et al. <em>Am J Obstet Gynecol</em> 1998 — the knack manoeuvre</b><span class="rd"> — 73% reduction in leakage during medium-intensity coughing and 98% at maximum intensity</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (May 2025)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — vaginal cancer: an unexplained palpable mass in or at the entrance to the vagina; endometrial cancer: post-menopausal bleeding at 55 and over, with direct-access ultrasound considered under 55</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — vaginal oestrogen prescribing: estradiol 10 microgram vaginal tablets (Vagifem) and estriol 0.1% cream (Ovestin), and macrogol dosing</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Pelvic organ prolapse — NICE NG123, NICE IPG283, MHRA surgical mesh guidance, the IMMDS (Cumberlege) Review 2020 and NHS England Mesh Specialist Centres, the Cochrane PFMT review (Hagen 2011) and the BNF. Examine every vaginal bulge: an irregular, friable or fixed mass, or any post-menopausal bleeding, follows the suspected cancer pathway. Offer supervised PFMT, a pessary and topical oestrogen before surgery. Coexisting urinary incontinence is covered by the <a href=\"female-urinary-incontinence.html\">female urinary incontinence protocol</a>. Verify all doses against the current BNF before prescribing."
