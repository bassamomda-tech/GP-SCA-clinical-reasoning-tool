<script>
MG.render({
  icon:"🫁",
  title:"Asthma in children — the complete guide",
  eyebrow:"Protocol · NICE NG245 (2024, joint with BTS and SIGN) · under-recognised severity is what kills",
  stemTitle:"Acute asthma kills children when severity is under-recognised — and a silent chest means less air moving, not less asthma",
  stemSub:"One page for the whole condition. The acute attack comes first, because <b>under-recognition is the mechanism of death</b>: silent chest, cyanosis, poor respiratory effort, exhaustion, drowsiness, confusion, severe deterioration or failure to respond to initial treatment is a 999 call; SpO₂ below 92% on air is an emergency marker needing immediate treatment and urgent hospital assessment. For mild-to-moderate attacks salbutamol by pMDI and spacer is effective and often preferred; severe, hypoxic or life-threatening attacks need oxygen, often nebulised salbutamol with ipratropium, and urgent transfer. Then the stepwise preventer ladder — but always recheck inhaler technique, adherence, spacer use and smoke exposure BEFORE stepping up, because those are the commonest reasons for apparent poor control. Every child needs a <b>written action plan</b>, a <b>smoke-free home</b>, and a <b>review after every attack</b>, ideally within 2 working days.",
  guideline:"NICE NG245 (2024, joint with BTS and SIGN) · SIGN 158 (2019) acute asthma section · MHRA montelukast safety advice · UKHSA Green Book chapter 19 · local paediatric formulary",
  reviewed:"14 September 2026",
  nextReview:"14 March 2027",
  meta:[
    {t:"NICE NG245 (2024, joint with BTS and SIGN)"},
    {t:"Life-threatening features = 999 · SpO₂ &lt;92% = emergency", tone:"tw"},
    {t:"Check technique and adherence before every step-up", tone:"tw"},
    {t:"v2.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#acute"><b>Acute attack</b><small>999 features</small></a><a href="#assess"><b>Assess</b><small>Diagnosis · control</small></a><a href="#ladder"><b>Ladder</b><small>NG245 steps</small></a><a href="#nondrug"><b>Every child</b><small>Spacer · plan</small></a><a href="#refer"><b>Refer</b><small>Post-attack review</small></a></div>',
  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Life-threatening attack — 999", html:"Silent chest, cyanosis, poor respiratory effort, exhaustion, agitation, confusion or drowsiness, severe deterioration or failure to respond to initial treatment → 999; do not leave the child; give oxygen and repeated bronchodilator (nebulised salbutamol plus ipratropium per the emergency pathway) and a systemic corticosteroid if possible while awaiting transfer. SpO₂ below 92% on air is an emergency marker — interpret it with respiratory effort, air entry, consciousness and response; it is not by itself synonymous with life-threatening asthma (NG245; SIGN 158 acute section). <b>A silent chest means less air moving, not less asthma</b> — it is the most dangerous sign and the easiest to misread as improvement."},
    {tone:"red", h:"⚠ Acute severe — urgent treatment and admit", html:"Too breathless to talk or feed, respiratory rate or heart rate above the age thresholds in the current local acute asthma table, accessory muscle use, SpO₂ below 92% → immediate treatment and urgent hospital transfer. Assess under-5s and children 5 and over separately — see <a href='#acute'>Acute attack</a>. Hospital assessment for an incomplete response, relapse within a few hours, ongoing need for frequent bronchodilator, or any life-threatening feature."},
    {tone:"blue", h:"pMDI and spacer for mild-to-moderate attacks", html:"For mild-to-moderate attacks, salbutamol 100 micrograms by pMDI and spacer, one puff at a time, is effective and often preferred; reassess and repeat according to response and the local acute pathway. <b>In severe or life-threatening asthma, or if the child cannot use a spacer effectively</b>, give oxygen and arrange urgent transfer; nebulised salbutamol, usually with ipratropium, may be required — nebulisation must not delay transfer. Never use repeated spacer doses as the sole treatment for a hypoxic or exhausted child. <b>Admit if not responding or if relapsing.</b>"},
    {tone:"amber", h:"Check technique and adherence BEFORE stepping up", html:"Inhaler technique, adherence, spacer use and trigger exposure — especially tobacco smoke — are the commonest reasons for apparent poor control. Recheck all four before every escalation, and step DOWN when control is sustained. Escalating a drug against poor technique produces a higher dose and the same symptoms."},
    {tone:"green", h:"Spacer for all young children, and a written plan for every child", html:"Salbutamol 100 micrograms, 1–2 puffs as needed via spacer (with a mask if young) — frequent use outside a written exacerbation plan marks poor control and needs review. Every child needs a written personalised action plan for the family and, with parental consent, the school or nursery; ensure immediate access to a reliever and spacer at home, at school or nursery and during activities. Check annual influenza-vaccine eligibility under the current UK programme; keep immunisations up to date."},
    {tone:"amber", h:"⚠ Tobacco smoke is a major modifiable risk factor", html:"<b>No smoking in the home or car — offer parental cessation support.</b> Tobacco smoke exposure is a major modifiable risk factor for poor control and exacerbations: ask about smoking in the home, car and wider environment at every review, including vaping and smoking by visitors. Also consider mould and damp, air pollution, household irritants and clinically relevant allergen exposure."}
  ],
  pathwaySub:"Five steps, and the acute attack is deliberately first.",
  pathway:[
    {title:"Recognise and treat the acute attack", html:"Assess by age (under 5 or 5–11); life-threatening features → 999, acute severe or SpO₂ &lt;92% → urgent transfer; salbutamol by spacer, or oxygen and nebulised salbutamol with ipratropium if severe; systemic corticosteroid.", alert:true},
    {title:"Confirm the diagnosis and assess control", html:"Symptom pattern, variability, triggers, atopy; 5–16: FeNO, then spirometry with reversibility, then PEF variability (NG245). Under-5s: record suspected asthma, treat on symptoms and response, review."},
    {title:"Work the NG245 stepwise ladder", html:"Paediatric low-dose ICS plus SABA from diagnosis (5–11) → paediatric low-dose MART if the child can manage it, or an LTRA trial or twice-daily ICS/LABA if not → moderate-dose MART or moderate-dose ICS/LABA → paediatric asthma referral if still uncontrolled. <b>Recheck technique and adherence at every step.</b>"},
    {title:"Deliver the non-drug essentials", html:"Spacer technique, smoke-free home and other exposures, written action plan, influenza-vaccine eligibility, reliever access at school or nursery."},
    {title:"Review control, growth and every attack", html:"At least annually; after every attack, ideally within 2 working days of treatment or discharge (1–3 days for under-5s); a further review at 1–2 weeks if appropriate."}
  ],
  sections:[

    {id:"acute", nav:"Acute attack", title:"Step 1 — the acute severe and life-threatening attack",
     sub:"Placed first because under-recognition of severity is the mechanism by which children die.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Life-threatening — all ages", html:"SpO₂ below 92% <b>plus</b> silent chest, cyanosis, poor respiratory effort, exhaustion, altered consciousness, confusion or agitation, arrhythmia or hypotension; or severe deterioration or failure to respond → 999. Do not leave the child; oxygen, repeated bronchodilator (nebulised salbutamol plus ipratropium per the emergency pathway) and a systemic corticosteroid if possible while awaiting transfer."},
         {tone:"red", h:"🔴 SpO₂ below 92% on air", html:"An emergency marker: start treatment immediately and arrange urgent hospital assessment. Interpret it with respiratory effort, air entry, consciousness and response to bronchodilator — oximetry can be inaccurate, and a single reading should not be the sole determinant of a 999 call."},
         {tone:"red", h:"🔴 Acute severe — 5 years and over", html:"Assess ability to talk in sentences, respiratory rate and heart rate against the age thresholds in the current local acute asthma table, accessory muscle use, SpO₂, PEF where reliable and available, and response to initial bronchodilator. SpO₂ below 92% is a feature of acute severe asthma → immediate treatment plus urgent transfer."},
         {tone:"red", h:"🔴 Under 5 years", html:"Consider bronchiolitis, croup, foreign body and pneumonia. Use clinical assessment, not PEF (a validated clinical score if locally available): SpO₂, respiratory rate, accessory muscle use, air entry, feeding and alertness. SpO₂ below 92% is a severe feature → immediate treatment and hospital transfer. Do not call recurrent wheeze confirmed asthma on its own. <b>Under 2 years with suspected acute asthma → urgent paediatric assessment</b>; treatment is generally hospital-based."},
         {tone:"blue", h:"💨 Initial treatment", html:"By severity and age — see the table below. No single generic puff count for all ages and severities. <b>Admit if not responding or relapsing.</b>"},
         {tone:"red", h:"🏥 Hospital assessment", html:"Incomplete response to bronchodilator, relapse within a few hours, ongoing need for frequent bronchodilator treatment, or any life-threatening feature."}
       ]},
       {b:"table", head:["Clinical situation","Immediate GP action"], rows:[
         ["<b>Mild/moderate, SpO₂ ≥92%, clinically stable</b>","Salbutamol 100 micrograms by pMDI and spacer, one puff at a time; reassess after treatment; repeat according to response and the local acute pathway"],
         ["<b>Acute severe features or SpO₂ &lt;92%</b>","Immediate treatment; oxygen if SpO₂ below 92%; oral prednisolone if able to swallow; add ipratropium if using nebulised treatment; urgent hospital transfer"],
         ["<b>Life-threatening features</b>","Call 999; do not leave the child; oxygen and repeated bronchodilator while awaiting transfer; nebulised salbutamol plus ipratropium per the emergency pathway; systemic corticosteroid if possible"],
         ["<b>Poor or incomplete response at any stage</b>","Urgent hospital assessment or admission"],
         ["<b>Under 2 years with suspected acute asthma</b>","Urgent paediatric assessment; treatment is generally hospital-based"],
         ["<b>Under 5 years</b>","Salbutamol by pMDI and spacer where possible; oxygen if SpO₂ below 92%; systemic corticosteroid for moderate or severe presentations; ipratropium for moderate or severe attacks or poor response; nebulised treatment and urgent transfer if severe, life-threatening or not responding"]
       ]},
       {b:"warn", html:"<b>Prednisolone:</b> check the current local paediatric formulary and product information for dose, maximum dose and duration — regimens are age- and weight-dependent and must not be inferred from adult dosing (for under-5s, commonly 1–2 mg/kg/day with age-related maximum doses, usually for 3–5 days). Oral corticosteroids are prescribed and given according to the clinician's assessment and the written action plan; parents should not independently start leftover prednisolone unless this is in an agreed specialist-led plan. Verify oxygen, ipratropium and nebuliser doses against the current local paediatric formulary and acute pathway."},
       {b:"why", html:"<b>Acute asthma kills children when severity is under-recognised.</b> <b>For mild-to-moderate attacks a pMDI and spacer is effective and often preferred; severe or hypoxic attacks need oxygen and urgent transfer.</b> Every acute attack is also a prompt to review baseline control, technique and the action plan — the attack is information about the maintenance treatment, not just an event to be survived."}
     ]},

    {id:"assess", nav:"Assess", title:"Step 2 — confirm the diagnosis and assess control",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>Diagnosis</b>","Wheeze, cough or breathlessness with variability, triggers, and atopy or family history; objective testing for ages 5–16 per the NG245 algorithm: 1 · FeNO if available — ≥35 ppb with a suggestive history supports asthma; 2 · if FeNO not raised or unavailable, spirometry with bronchodilator reversibility — FEV₁ increase ≥12% from baseline or ≥10% of predicted normal; 3 · if spirometry unavailable or delayed, PEF twice daily for 2 weeks — variability ≥20%; 4 · if still uncertain, consider sensitisation/raised IgE and eosinophils, or refer to a paediatric specialist. <b>Under 5: objective testing is generally not reliable — record suspected asthma until objective confirmation is possible, treat according to symptoms and response, and review regularly</b>"],
         ["<b>Under-5 ICS trial</b>","In selected children under 5 with interval symptoms or severe episodes: an 8–12-week trial of twice-daily paediatric low-dose ICS with SABA, then review and consider withdrawal if symptoms resolve (NG245)"],
         ["<b>Assess control</b>","Daytime symptoms, night waking, reliever use, activity or exercise limitation, school absence, exacerbations and steroid courses"],
         ["<b>Triggers</b>","<b>Viral infections, allergens, exercise, cold air, smoke exposure</b>"],
         ["<b>Adherence and technique</b>","The commonest reasons for apparent poor control — check BEFORE stepping up"]
       ]}
     ]},

    {id:"ladder", nav:"Ladder", title:"Step 3 — stepwise pharmacological control (NG245)",
     blocks:[
       {b:"table", head:["Step","What","When"], rows:[
         ["<b>Reliever — SABA via spacer</b>","Salbutamol 100 micrograms, 1–2 puffs as needed via spacer (plus mask if young). Frequent use outside a written exacerbation plan marks poor control — review","<b>All children</b>"],
         ["<b>Regular preventer — low-dose ICS</b>","Paediatric low-dose inhaled corticosteroid as a regular preventer, in an age-appropriate device","<b>From diagnosis in children 5–11: twice-daily paediatric low-dose ICS plus SABA as needed (NG245); not SABA alone</b>"],
         ["<b>Add-on — LTRA or paediatric MART</b>","Per NG245 (5–11): consider paediatric low-dose MART if the child can manage the regimen; if not, consider an LTRA trial or twice-daily paediatric ICS/LABA according to NG245 and the current product licence. If still uncontrolled, moderate-dose MART or moderate-dose ICS/LABA. Trial an LTRA for about 8–12 weeks unless adverse effects occur sooner; stop if ineffective. <b>Montelukast (MHRA):</b> before prescribing, discuss possible sleep, mood and behavioural changes (nightmares, aggression, anxiety, depression, hallucinations, suicidal thinking or behaviour) with the parent/carer and child; stop and seek advice if new or worsening neuropsychiatric symptoms occur. <b>Check the inhaler, strength, age licence and MART regimen against the current SPC and local formulary</b> — not every ICS/formoterol inhaler is licensed for paediatric MART; the NG245 algorithm identifies a specific budesonide/formoterol DPI licensed for MART in children aged 6–11","<b>Still uncontrolled on low-dose ICS</b>"],
         ["<b>Specialist — paediatric respiratory</b>","Refer if still uncontrolled on paediatric moderate-dose MART or moderate-dose ICS/LABA, before high-dose therapy, or if the diagnosis is unclear or the disease severe","<b>Escalation needed</b>"]
       ]},
       {b:"warn", html:"Always recheck inhaler technique, adherence, spacer use and trigger exposure (especially tobacco smoke) before stepping up. <b>Step down when control is sustained.</b>"}
     ]},

    {id:"nondrug", nav:"Every child", title:"Step 4 — technique, environment and the plan",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"🫧 Spacer technique", html:"Demonstrate and check at every review; a spacer (with mask if needed) for all young children."},
         {tone:"amber", h:"🚭 Smoke-free", html:"Tobacco smoke exposure is a major modifiable risk factor for poor control and exacerbations. Ask about smoking in the home, car and wider environment at every review, including vaping and smoking by visitors; offer parental cessation. Also address mould and damp, air pollution, household irritants and clinically relevant allergen exposure — focus on practical exposure reduction."},
         {tone:"green", h:"📄 Action plan", html:"A written personalised asthma action plan for the child, parents and school."},
         {tone:"green", h:"💉 Vaccination", html:"<b>Check annual influenza-vaccine eligibility under the current UK programme</b> (universal childhood programme, generally ages 2 to under 17 in England; clinical risk group; or other criteria). Children needing regular or repeated corticosteroids or with a previous asthma admission are generally in a clinical risk group. Do not give live attenuated influenza vaccine during an acute exacerbation or recent significant wheeze — an inactivated vaccine may be appropriate; follow the current Green Book chapter 19. Keep immunisations up to date."},
         {tone:"blue", h:"🏫 School", html:"<b>Ensure immediate access to a reliever and spacer at school or nursery</b>, with the written action plan shared according to parental consent and the school's medicines policy. Where appropriate, arrange a labelled spare/emergency inhaler in line with local school procedures. A reliever should also be available at home and during activities."},
         {tone:"amber", h:"📈 Frequent reliever use", html:"Frequent SABA use outside a written exacerbation plan is a marker of poor control and increased future risk. Check the prescription record, technique, adherence and action-plan use. Do not read a temporarily increased dose during a clearly defined acute plan as routine baseline use; adult inhaler-count thresholds are not a universal paediatric threshold."}
       ]}
     ]},

    {id:"monitor", nav:"Review", title:"Step 5 — review schedule",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["<b>Control and reliever use</b>","<b>Each review, at least annually</b>","<b>Step up or down; high SABA use → escalate and recheck technique</b>"],
         ["<b>Inhaler technique and adherence</b>","<b>Every visit</b>","<b>Re-teach; address barriers</b>"],
         ["<b>Growth (height and weight)</b>","<b>Annually on ICS</b>","<b>Monitor — and reassure that the ICS effect on growth is small</b>"],
         ["<b>Post-exacerbation</b>","<b>After any attack or steroid course</b>","<b>Review ideally within 2 working days of treatment or discharge (1–3 days for under-5s); a further review at 1–2 weeks may be appropriate after a significant attack, steroid course or hospital attendance. Record symptoms and work of breathing, SABA use, adherence, technique and spacer use, triggers and exposures, oral steroid completion, the action plan, school medication and referral need</b>"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 999", html:"\"If the reliever isn't working, or they're struggling to breathe, talk or feed — call 999.\""},
         {tone:"amber", h:"🟠 Worsening", html:"\"Needing the blue inhaler more often, waking at night, or struggling at school — contact us to review the preventer.\""},
         {tone:"blue", h:"📄 Use the plan", html:"\"Follow the written plan — it tells you what to do as symptoms change and when to seek help.\""},
         {tone:"green", h:"🫧 Always the spacer", html:"\"Always use the spacer, even in an attack — it gets the medicine into the lungs far better than the inhaler alone.\""}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"When to refer",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999 / admit", html:"<b>Life-threatening or acute severe attack not responding to treatment.</b>"},
         {tone:"amber", h:"Paediatric respiratory", html:"Diagnostic uncertainty; poor control despite good adherence and technique; uncontrolled on moderate-dose MART or moderate-dose ICS/LABA; before high-dose therapy; recurrent steroid-treated exacerbations; frequent exacerbations; a child under 5 with recurrent wheeze needing escalation. See <a href='preschool-wheeze.html'>pre-school wheeze</a>."},
         {tone:"blue", h:"Post-admission", html:"<b>ALWAYS review in primary care after an acute attack</b> — ideally within 2 working days of treatment or discharge; a further review at 1–2 weeks if appropriate."},
         {tone:"cream", h:"GP management", html:"Acute recognition and initial treatment, diagnosis and control assessment, the stepwise ladder, spacer technique, the action plan, the smoke-free conversation and the review schedule all belong here. Related pages: <a href='asthma.html'>asthma (adults)</a> · <a href='preschool-wheeze.html'>pre-school wheeze</a> · <a href='cmpa.html'>CMPA</a> · <a href='eczema.html'>eczema</a>."}
       ]},
       {b:"say", html:"We can keep your child's asthma well controlled with a daily preventer inhaler and a reliever for symptoms — used properly with a spacer. A smoke-free home makes a big difference. Here's a written plan; if the reliever isn't working, or they're struggling to breathe, talk or feed, call 999."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 6-year-old girl attends with her father after <b>three courses of prednisolone in 8 months</b> and a recent A&amp;E attendance. She is on a <b>low-dose ICS twice daily and salbutamol</b>, and the record shows <b>11 salbutamol inhalers issued this year</b>. She <b>wakes coughing two or three nights a week</b> and stops running at playtime. She takes her inhalers <b>without a spacer</b> \"because she's old enough now\", and her father <b>smokes in the kitchen with the window open</b>. He asks for \"a stronger preventer\"."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"First assesses current acute severity and gives an interim action plan if she is wheezy now; confirms the number and timing of steroid courses and whether she has ever been admitted or needed oxygen; does NOT simply step up the ICS — checks technique, adherence, spacer use and smoke exposure first, which is exactly what NG245 requires and what this case is built around; reinstates the spacer and demonstrates it, correcting the \"old enough now\" belief; reads 11 relievers a year and three steroid courses as markers of poor control and high risk, not as reassurance that the reliever works; addresses the smoking directly — kitchen with the window open is still smoke exposure — and offers the father cessation support; <b>reviews night waking and exercise limitation as control measures</b>; considers an LTRA or paediatric MART per the NG245 age bands only after technique and adherence are addressed, checking she can manage the licensed paediatric MART device; checks the father knows when to call 999; recognises three steroid courses in 8 months, emergency attendance, night waking and exercise limitation as a high-risk pattern needing close follow-up and likely paediatric respiratory input if not rapidly controlled; issues or updates a written action plan and ensures she has access to a reliever and spacer at school; <b>checks the influenza vaccine and plots growth</b>; and <b>arranges the post-exacerbation review she never had.</b>"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Safety-critical statements are cited inline to the sources below; verify doses against the current local paediatric formulary.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>NICE NG245 (joint with BTS and SIGN) — Asthma: diagnosis, monitoring and chronic asthma management (2024 joint guideline)<br><a href="https://www.nice.org.uk/guidance/ng245/chapter/Recommendations" rel="noopener">nice.org.uk/guidance/ng245 — recommendations</a> · current algorithms B (diagnosis) and D (paediatric treatment, licensed MART product)<span class="rd"> — the objective diagnostic testing by age band, the stepwise paediatric ladder from SABA through low-dose ICS to an LTRA or paediatric MART, the requirement to check technique, adherence and trigger exposure before stepping up, stepping down when control is sustained, and the referral thresholds including before high-dose therapy</span></li>'+
         '<li><b>BTS/SIGN British guideline on the management of asthma (SIGN 158, 2019) — acute asthma sections only; its chronic-management sections are replaced by NICE NG245 (2024)</b><span class="rd"> — acute asthma section only (the whole 2019 document is not current for chronic paediatric management): acute severe and life-threatening features by age, oxygen, pMDI-and-spacer versus nebulised bronchodilator, ipratropium and systemic corticosteroid; use alongside the current local acute paediatric asthma pathway</span></li>'+
         '<li><b>NICE asthma quality standard</b><span class="rd"> — follow-up by the GP practice within 2 working days of treatment in hospital, emergency or out-of-hours services</span></li>'+
         '<li><b>MHRA Drug Safety Update — montelukast: neuropsychiatric reactions</b><span class="rd"> — sleep, mood and behavioural effects in children and adolescents; NG245 directs clinicians to follow this advice</span></li>'+
         '<li><b>BNF for Children</b><br><a href="https://bnfc.nice.org.uk" rel="noopener">bnfc.nice.org.uk</a><span class="rd"> — reference dosing; verify every dose against the current local paediatric formulary, the specific product SPC, the acute asthma pathway and local ambulance/paediatric emergency guidance</span></li>'+
         '<li><b>UKHSA Green Book, chapter 19 — influenza</b><span class="rd"> — universal childhood programme and clinical risk groups (regular or repeated corticosteroids, previous asthma admission); no live attenuated vaccine during acute wheeze</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Asthma in children — NICE NG245 (2024, joint with BTS and SIGN), the acute asthma sections of SIGN 158 (2019; chronic management replaced by NG245) and the BNF for Children. Acute asthma kills children when severity is under-recognised: silent chest, cyanosis, poor respiratory effort, exhaustion, drowsiness, confusion or failure to respond is a 999 call; SpO₂ below 92% on air is an emergency marker needing immediate treatment and urgent hospital assessment. Assess under-5s and children 5 and over separately. pMDI and spacer for mild-to-moderate attacks; oxygen, nebulised salbutamol with ipratropium and urgent transfer for severe or life-threatening attacks. Always recheck inhaler technique, adherence, spacer use and smoke exposure before stepping up, and step down when control is sustained. Every child needs a written action plan, a spacer, a smoke-free home and a check of influenza-vaccine eligibility. Review after every attack — ideally within 2 working days. Verify drugs, doses, product licences and age bands against current NG245, the local paediatric formulary and the SPC."
});
</script>
