  quick:[
    {tone:"red", h:"⚠ Do NOT start a gluten-free diet before the diagnosis is confirmed", html:"Going gluten-free normalises serology and histology, so it prevents a secure diagnosis. The patient must be eating gluten in more than one meal a day for at least 6 weeks before testing. If they have already stopped, they need a gluten challenge before testing is meaningful — which is why the sequence matters more than the speed."},
    {tone:"blue", h:"The right test is tTG-IgA WITH total IgA", html:"<b>Total IgA plus IgA tissue transglutaminase (tTG-IgA).</b> The total IgA is not optional — in IgA deficiency the tTG-IgA is falsely negative, and you need IgG-based testing (IgG-DGP or EMA) instead. Positive serology → refer to gastroenterology for duodenal biopsy to confirm villous atrophy in adults."},
    {tone:"amber", h:"Who to test — wider than the classic presentation", html:"Persistent GI symptoms (diarrhoea, bloating, abdominal pain) · unexplained iron, B12 or folate deficiency · faltering growth · unexplained weight loss · type 1 diabetes · autoimmune thyroid disease · IBS-type symptoms · dermatitis herpetiformis · a first-degree relative with coeliac disease. Unexplained iron deficiency and \"IBS\" are the two that most often hide it."},

    {tone:"red", h:"⚠ Functional hyposplenism — vaccinate", html:"Coeliac disease causes functional hyposplenism, so offer pneumococcal vaccination with a booster, annual influenza vaccination, and ensure Hib and MenACWY per national guidance. <b>This is the element most often missed entirely</b>, because nothing about the consultation prompts it unless you know to look."},

     ]},

       {tone:"cream", h:"Examiner-style checkpoints", html:"Recognises that testing now is uninterpretable — 10 weeks gluten-free normalises serology and histology, and explains why rather than just declining; explains the gluten challenge: gluten in more than one meal a day for at least 6 weeks before tTG-IgA, and negotiates it honestly given she feels better off gluten; <b>orders tTG-IgA WITH total IgA when the time comes</b>, and can say why the total IgA matters; treats the unexplained iron deficiency as a coeliac indication in its own right, and investigates and replaces it regardless; <b>notes the first-degree relative as an independent reason to test</b>; <b>does not start a gluten-free diet as \"a trial\" before diagnosis</b>, and explains what a secure diagnosis unlocks — dietitian support, prescribable staples, DEXA, vaccination and relative testing; <b>discusses the pneumococcal vaccination for hyposplenism if confirmed</b>; and <b>arranges gastroenterology referral for biopsy on a positive result.</b>"}
     ]}]},

  foot:"Coeliac disease in primary care — NICE NG20, NICE and the UKHSA Green Book. Test on gluten or not at all: tTG-IgA with total IgA, while eating gluten in more than one meal a day for at least 6 weeks, and never after starting a gluten-free diet — that normalises both serology and histology. Positive serology needs confirmatory duodenal biopsy in adults. Treatment is a strict lifelong gluten-free diet with dietitian support; there is no drug substitute. Remember the three easily-missed extras: deficiency replacement, bone protection, and pneumococcal vaccination for functional hyposplenism. Test first-degree relatives. Verify against current NICE NG20."
