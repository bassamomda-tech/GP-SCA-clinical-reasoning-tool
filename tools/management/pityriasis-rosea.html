<script>
MG.render({
  icon:"🧴",
  title:"Pityriasis Rosea",
  eyebrow:"Protocol · assess and manage in one place",
  stemTitle:"Pityriasis rosea — recognise the pattern, rule out syphilis, ask about pregnancy, then let it run its course",
  stemSub:"A self-limiting eruption of children and young adults. The cause is uncertain; viral reactivation, including HHV-6/7, has been proposed but is not established and does not alter routine management. One larger scaly herald patch is followed days later by smaller oval patches along the skin lines of the trunk. The consultation has three jobs: be sure it is pityriasis rosea (secondary syphilis is an important treatable mimic that must not be missed, and tinea can mimic the herald patch), ask about pregnancy, and relieve itch while explaining that most cases improve within 6–12 weeks, although some last longer. Sources: PCDS pityriasis rosea guidance · BAD patient information (June 2023) · BASHH syphilis guideline 2024 · Cochrane review 2019 · Drago et al. JAAD 2008 and 2014 · Manduca et al. 2025.",
  guideline:"PCDS pityriasis rosea clinical guidance · BAD patient information leaflet (June 2023) · BASHH UK syphilis guideline 2024 · Cochrane review (Contreras-Ruiz 2019)",
  meta:[
    {t:"PCDS clinical guidance · PCDS patient leaflet Dec 2023"},
    {t:"BAD patient information Jun 2023"},
    {t:"BASHH syphilis 2024 · secondary syphilis mimic"},
    {t:"Cochrane 2019 · interventions for pityriasis rosea"},
    {t:"Pregnancy: Drago JAAD 2008, 2014 · Manduca IJWD 2025"},
    {t:"No NG12 criterion applies"}
  ],
  lead:"<div class='mg-layers'><a href='#flags'><b>Red flags</b><small>Syphilis, pregnancy</small></a><a href='#recognise'><b>Recognise</b><small>Herald patch, fir-tree</small></a><a href='#treat'><b>Treat</b><small>Itch relief only</small></a><a href='#refer'><b>Refer</b><small>Rarely needed</small></a></div>",
  quickSub:"Five cards cover almost every consultation. Each point traces to a source under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"blue", h:"The pattern", html:"A single <b>herald patch</b> — larger than what follows, typically 2–5 cm, bright pink-red with fine scale and a sharp edge — then a few days later many smaller oval pink patches with a fine inner collar of scale, lying along the skin creases of the trunk like the branches of a <b>fir tree</b>. Itch is variable: many patients have little or no itch, but some have troublesome or severe pruritus. The face, palms and soles are usually spared.", src:"PCDS pityriasis rosea guidance"},
    {tone:"amber", h:"Secondary syphilis: an important treatable mimic", html:"Secondary syphilis is an important treatable mimic that must not be missed, but the typical pityriasis rosea pattern does not require routine syphilis testing in every patient. BASHH 2024: secondary syphilis produces a widespread rash (maculopapular in 50–70%) that <b>involves the palms and soles in 11–70%</b>, often with generalised lymphadenopathy, and usually does not itch. Palm or sole lesions, mucosal, genital or perianal lesions, generalised lymphadenopathy, systemic upset, patchy alopecia, no convincing herald patch, an atypical or extensive eruption, sexual risk, pregnancy with an atypical rash or risk of new infection, or persistent uncertainty → <b>syphilis serology</b> or sexual health.", src:"BASHH UK syphilis guideline 2024"},
    {tone:"amber", h:"Ask about pregnancy", html:"Most pregnancies affected by pityriasis rosea have a normal outcome. A few small observational studies suggested a possible increased risk when the rash begins in the <b>first 15 weeks</b>, but the evidence is inconsistent, a matched study was reassuring, and there is no reliable individual risk estimate. If pregnant, discuss the uncertainty and consider contacting the midwife or obstetric team, especially with early-onset or atypical disease.", src:"Drago et al. 2008 · Ong et al. 2024 · Manduca et al. 2025"},
    {tone:"green", h:"It clears by itself", html:"No treatment changes the natural course. BAD: there is no need to treat the rash if it is not causing symptoms, and it clears within a few months. The Cochrane review describes a duration of 2–12 weeks. Most cases improve within 6–12 weeks, although some last longer. Pigment change can take longer to fade, particularly in darker skin.", src:"BAD leaflet (June 2023) · Cochrane 2019 · PCDS"},
    {tone:"cream", h:"Treat only the itch", html:"PCDS: an emollient, or a mild to moderately potent topical steroid, if the rash is itchy. A sedating antihistamine at night if itch disturbs sleep, only when appropriate (check the current BNF/BNFC and local formulary for the exact medicine and age group). Antivirals, antibiotics and phototherapy are not routine primary-care treatments.", src:"PCDS pityriasis rosea guidance · Cochrane 2019"}
  ],
  pathwaySub:"Five steps. The first is the one that prevents harm.",
  pathway:[
    {title:"Exclude secondary syphilis", html:"Look at the palms, soles, mouth and genitals, and feel for lymph nodes. Ask about new sexual partners, genital sores in the last few months, fever or sore throat. If anything fits, or the pattern is atypical, request syphilis serology or refer to sexual health. No routine tests are needed if the diagnosis is clear and there are no red flags.", alert:true},
    {title:"Ask about pregnancy", html:"Ask about pregnancy. If pregnant, discuss the uncertain evidence and consider maternity advice, especially with early-onset (before 15 weeks) or atypical disease."},
    {title:"Confirm the pattern", html:"Herald patch, then oval patches with collarette scale along skin lines on the trunk and upper limbs. If a solitary lesion resembles tinea corporis, particularly with an active annular edge or asymmetry, or the diagnosis is uncertain, scrape it for mycology or follow the local fungal pathway; once the typical secondary eruption develops, the diagnosis may become clearer. Ask about new medicines — some drugs cause a pityriasis rosea-like eruption."},
    {title:"Relieve itch and explain the course", html:"Emollient, mild topical steroid for itchy areas, lukewarm washing, soap substitute, and a sedating antihistamine at night if needed. Explain that it clears on its own — most cases improve within 6–12 weeks, although some last longer — and that marks may take longer to fade."},
    {title:"Plan follow-up", html:"Reassess if the rash is persistent beyond about 12 weeks, atypical, increasingly symptomatic or diagnostically uncertain; spreads to the palms, soles or mucosa; becomes blistered, purpuric or very itchy; or the person feels unwell. A persistent rash is a reason to reconsider the diagnosis, not proof that it is something else."}
  ],
  sections:[
    {id:"flags", nav:"Red flags", title:"Red flags — when it may not be pityriasis rosea", sub:"Pityriasis rosea itself is harmless. The risk lies in missing the condition it resembles.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"Palms, soles or mucosa involved", html:"Secondary syphilis commonly affects the palms and soles, and may cause mouth ulcers, split papules at the mouth corners, condylomata lata or patchy hair loss. Request syphilis serology and refer to sexual health.", src:"BASHH UK syphilis guideline 2024"},
         {tone:"amber", h:"Lymphadenopathy, fever or feeling unwell", html:"Generalised lymphadenopathy with a widespread rash suggests secondary syphilis, HIV seroconversion or another systemic infection rather than pityriasis rosea. Offer syphilis and HIV testing.", src:"BASHH UK syphilis guideline 2024"},
         {tone:"amber", h:"Pregnancy — especially under 15 weeks", html:"Limited, inconsistent observational evidence links onset in the first 15 weeks with miscarriage; matched data are reassuring. Discuss the uncertainty and consider contacting the midwife or obstetric team; any additional surveillance is decided by maternity care. Request syphilis serology if there are clinical features or sexual-risk factors suggesting syphilis, or if diagnostic uncertainty remains — a negative booking screen does not exclude infection acquired later in pregnancy. Pregnancy alone is not a reason to test a typical eruption.", src:"BASHH syphilis in pregnancy and children guideline 2024 · Drago et al. 2008"},
         {tone:"amber", h:"No herald patch, confluent and very itchy, on a new drug", html:"A pityriasis rosea-like drug eruption tends to lack a herald patch and prodrome, and forms larger, more confluent, itchier patches. Review medicines started in the preceding weeks.", src:"PCDS pityriasis rosea guidance"},
         {tone:"blue", h:"Single patch only", html:"BAD notes that the herald patch can be confused with ringworm. A typical herald patch can be diagnosed clinically in context. Scrape for mycology (or follow the local fungal pathway) when the solitary lesion is clinically suggestive of tinea — an active advancing annular edge, asymmetry, no convincing pityriasis rosea eruption yet — or the diagnosis is uncertain. Do not apply a topical steroid to a suspected fungal lesion until tinea has been considered.", src:"BAD pityriasis rosea leaflet (June 2023)"},
         {tone:"blue", h:"Persisting beyond about 3 months", html:"Pityriasis rosea can occasionally last longer than 12 weeks, so persistence is a reason to reassess, not proof of another diagnosis. Atypical, blistering, purpuric, markedly pruritic or persistent disease should prompt reconsideration: guttate psoriasis, discoid eczema, pityriasis lichenoides chronica, a drug eruption, or rarely cutaneous T-cell lymphoma (mycosis fungoides) in an adult. Dermatology if the diagnosis remains uncertain.", src:"PCDS pityriasis rosea guidance"},
         {tone:"blue", h:"NG12 — no criterion applies", html:"Pityriasis rosea does not map to any NICE NG12 suspected-cancer criterion, so there is no purple suspected cancer card on this page. A separate suspicious lesion found during the examination is assessed on its own merits.", src:"NICE NG12 (updated April 2026)"}
       ]},
       {b:"why", html:"Secondary syphilis is uncommon in general practice but rising in the UK, and it is easily treated once recognised — while missing it risks onward transmission, neurological and eye complications, and congenital syphilis if the patient is pregnant. Pityriasis rosea spares the palms and soles and has a herald patch; syphilis often involves the palms and soles and has none. When the picture is not textbook, a blood test costs little and the diagnosis is worth being sure of."}
     ]},

    {id:"recognise", nav:"Recognise", title:"Recognising pityriasis rosea", sub:"The diagnosis is clinical. The herald patch and the distribution make it.",
     blocks:[
       {b:"dl", rows:[
         ["<b>Who</b>","Mainly children and young adults. PCDS describes it as an acute, self-limiting disease, probably infective in origin, with minimal constitutional symptoms. The cause is uncertain: HHV-6/7 reactivation has been proposed but is not established. Do not request HHV-6/7 blood tests — there is no validated routine test, and most adults have prior HHV-6 exposure."],
         ["<b>Prodrome</b>","Some people describe a mild viral-type illness — tiredness, headache, sore throat — before or around the time the rash appears."],
         ["<b>Herald patch</b>","The first lesion, usually on the trunk: larger than those that follow (about 2–5 cm), bright red with fine scale and a sharp border. It appears a few days, occasionally a few weeks, before the rest of the rash."],
         ["<b>Secondary eruption</b>","Many smaller oval dull-pink patches, some with a fine peripheral collar of scale, lying along the lines of cleavage parallel to the ribs — the ‘Christmas tree’ or ‘fir-tree’ pattern on the back. The upper arms and thighs may be involved; the face, palms and soles usually are not."],
         ["<b>Symptoms</b>","Itch is variable: many patients have little or no itch, but some have troublesome or severe pruritus, which can be worse after hot baths or exercise."],
         ["<b>Skin of colour</b>","Patches may look grey, violet or darker brown rather than pink, and more papular forms occur. Post-inflammatory pigment change is more noticeable and lasts longer."],
         ["<b>Variants</b>","Inverse pityriasis rosea affects the flexures (armpits, groin) rather than the trunk; papular, vesicular and purpuric forms occur, and occasionally there is more than one herald patch. Atypical forms need a lower threshold for testing."]
       ]},
       {b:"say", html:"This is pityriasis rosea. It’s a rash that usually starts with one larger patch and then spreads as smaller ones across the body. The cause isn’t certain — a common virus may play a part. It isn’t serious and it goes away by itself. It usually heals without scarring, although temporary lighter or darker marks can persist, particularly in darker skin."}
     ]},

    {id:"differential", nav:"Differentials", title:"Look-alikes and how to tell them apart", sub:"Secondary syphilis is an important treatable mimic that must not be missed; tinea can mimic the herald patch. Test in proportion to the clinical picture.",
     blocks:[
       {b:"table", head:["Condition","Distinguishing features","Action"], rows:[
         ["<b>Secondary syphilis</b>","No herald patch; palms and soles often involved; mucosal lesions, lymphadenopathy, systemic symptoms; rash usually not itchy; history of a genital or oral sore weeks earlier","Syphilis serology; sexual health referral; offer HIV testing"],
         ["<b>Tinea corporis</b>","Fewer, larger annular patches with an active scaly edge; asymmetric; spreads outwards","Skin scraping for mycology when the lesion is suggestive or the diagnosis uncertain; topical antifungal per the local fungal pathway"],
         ["<b>Guttate psoriasis</b>","Small ‘raindrop’ scaly papules, thicker silvery scale; often 2–3 weeks after a streptococcal sore throat","Different management — see psoriasis"],
         ["<b>Drug eruption (pityriasis rosea-like)</b>","No herald patch or prodrome; larger, more confluent, itchier patches; recent new medicine","Review and, where possible, stop the drug"],
         ["<b>Discoid eczema</b>","Coin-shaped, very itchy, often crusted or weeping plaques, usually on the limbs","Emollient plus potent topical steroid"],
         ["<b>Pityriasis versicolor</b>","Fine scale on the upper trunk, pale or brown, no herald patch, recurrent in warm weather","Antifungal wash"],
         ["<b>Pityriasis lichenoides chronica</b>","Crops of small scaly papules lasting months, with a mica-like scale","Dermatology if suspected"],
         ["<b>Erythema multiforme</b>","Target lesions, often acral; may involve mucosa","Assess for triggers; urgent assessment if mucosal involvement"],
         ["<b>HIV seroconversion</b>","Widespread rash with fever, sore throat, lymphadenopathy; recent risk","HIV test (and syphilis serology); sexual health"],
         ["<b>Psoriasis (plaque)</b>","Well-defined thicker plaques with silvery scale; extensor sites, scalp, nails","Different management — see psoriasis"],
         ["<b>Cutaneous T-cell lymphoma</b>","Persistent patches in an adult that do not resolve over months","Dermatology"],
         ["<b>Polymorphic eruption of pregnancy</b>","Late pregnancy; very itchy papules starting in abdominal striae, sparing the umbilicus","Maternity team and topical treatment"]
       ]}
     ]},

    {id:"syphilis", nav:"Syphilis check", title:"Excluding secondary syphilis", sub:"A short, focused sexual history and a blood test when in doubt.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"When to test", html:"The typical pityriasis rosea pattern does not require routine syphilis testing in every patient. Test or refer to sexual health when there is: palm or sole involvement; mucosal, oral, genital or perianal lesions; generalised lymphadenopathy; fever or systemic illness; patchy alopecia; no convincing herald patch; an atypical or extensive eruption; sexual exposure risk; pregnancy with an atypical rash or risk of new infection; or persistent diagnostic uncertainty. If serology is positive or suspicion is high, refer promptly to sexual health.", src:"BASHH UK syphilis guideline 2024 · PCDS pityriasis rosea guidance"},
         {tone:"blue", h:"What the rash of secondary syphilis looks like", html:"Maculopapular in 50–70%, papular in about 12%, macular in about 10%, occasionally ulceronodular. It may itch but usually does not. Palms and soles are affected in 11–70%, and hair follicles can be involved, causing alopecia.", src:"BASHH UK syphilis guideline 2024"},
         {tone:"blue", h:"Which test", html:"Request the local laboratory syphilis screen; sexual health services will arrange confirmatory testing, staging and follow-up titres. Do not interpret individual treponemal or RPR patterns without specialist support. If recent exposure or primary or secondary syphilis is strongly suspected (recent ulcer, new partner, high-risk exposure or an evolving rash), an initial negative result may not exclude early infection — discuss repeat testing and specialist assessment with sexual health.", src:"BASHH UK syphilis guideline 2024"},
         {tone:"cream", h:"Where to send them", html:"Refer to sexual health for confirmation, staging, treatment and partner notification, and offer a full screen including HIV. Use the local integrated sexual health service referral route (Bolton and Greater Manchester: verify the current local pathway); patients can also self-refer. Partner notification should be discussed with everyone diagnosed.", src:"BASHH UK syphilis guideline 2024"}
       ]},
       {b:"say", html:"There’s one other rash that can look like this, which is caused by an infection called syphilis. It’s much less likely, but it’s treatable and important not to miss, and because of what I’ve found, I’d like to do a simple blood test to be sure. It isn’t a judgement about you."}
     ]},

    {id:"pregnancy", nav:"Pregnancy", title:"Pityriasis rosea in pregnancy", sub:"The evidence is small, mixed and uncertain. Share that uncertainty honestly.",
     blocks:[
       {b:"warn", html:"<b>Limited observational evidence.</b> These are small, heterogeneous studies with no established causal risk estimate or standardised monitoring pathway. Do not quote their percentages to a patient as her individual risk."},
       {b:"table", head:["Study","What it found"], rows:[
         ["<b>Drago et al. J Am Acad Dermatol 2008</b>","38 women with pityriasis rosea in pregnancy: a higher miscarriage rate was reported when the rash began in the first 15 weeks (small, uncontrolled series). HHV-6 was found in placental and fetal tissue in one case. The authors recommended closer follow-up when it develops in the first 15 weeks, particularly with atypical forms."],
         ["<b>Drago et al. J Am Acad Dermatol 2014</b>","61 women with pityriasis rosea in pregnancy; evidence of HHV-6 and HHV-7 reactivation in women who miscarried."],
         ["<b>Ong, White, Lipner. J Am Acad Dermatol 2024</b>","Retrospective matched study at a New York academic centre: no increased risk of birth complications or spontaneous abortion compared with matched controls."],
         ["<b>Manduca et al. Int J Womens Dermatol 2025 (review)</b>","11 small heterogeneous studies, 177 patients: most outcomes favourable; onset before 15 weeks was associated with more unfavourable outcomes, but data conflict and causality is uncertain."]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"What to do", html:"Ask about pregnancy. If pregnant, particularly if onset was before 15 weeks, discuss the uncertain evidence and consider contacting the midwife or obstetric team; any additional surveillance should be decided by maternity care. Request syphilis serology if there are clinical features or sexual-risk factors suggesting syphilis, or if diagnostic uncertainty remains (routine antenatal screening does not exclude a new infection). Do not prescribe antivirals from primary care in pregnancy; any antiviral decision is specialist-led, based on severity and gestation.", src:"Drago et al. J Am Acad Dermatol 2008 · BASHH UK syphilis guideline 2024"},
         {tone:"green", h:"Keep it proportionate", html:"Avoid alarming language. Suggested wording: “Most pregnancies affected by pityriasis rosea have a normal outcome. A few small studies have suggested a possible increased risk when the rash begins very early in pregnancy, but the evidence is inconsistent and does not provide a reliable individual risk estimate. We will involve the maternity team so they can decide whether any additional follow-up is appropriate.”"}
       ]}
     ]},

    {id:"treat", nav:"Treatment", title:"Treatment — itch relief and reassurance", sub:"The rash settles on its own. Treatment is for comfort.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1", when:"everyone", tone:"green", title:"Explain and reassure", html:"Self-limiting, usually heals without scarring (temporary pigment change may persist), low risk of passing it on. No treatment is needed if it is not causing symptoms (BAD, June 2023)."},
         {step:"2", when:"dry or itchy skin", tone:"cream", title:"Emollient and gentle skin care", fromLabel:"if symptomatic", html:"An emollient applied as often as needed, used as a soap substitute; lukewarm rather than hot showers; loose cotton clothing. PCDS advises an emollient for itch or discomfort."},
         {step:"3", when:"itchy patches", tone:"cream", title:"Mild topical corticosteroid", fromLabel:"itch persists", html:"PCDS suggests an emollient or a mild to moderately potent topical steroid (for example hydrocortisone 1% or clobetasone butyrate 0.05%) for itchy areas. Treatment is for itch only: use the lowest effective potency, thinly, for a short course, and avoid prolonged use; take extra care on the face, flexures and genital skin. Do not apply to a suspected fungal lesion until tinea has been considered. It eases itch but does not shorten the rash."},
         {step:"4", when:"sleep disturbed", tone:"cream", title:"Sedating antihistamine at night", fromLabel:"night itch", html:"Short course at bedtime, only when appropriate. Check the current BNF/BNFC and local formulary for the exact medicine and age group. Warn about next-day drowsiness, driving and operating machinery, and alcohol; take care with falls risk in older adults, concomitant sedatives, and use in children."},
         {step:"5", when:"severe, extensive or prolonged", tone:"amber", title:"Specialist options", fromLabel:"uncommon", html:"The Cochrane review (2019, 14 trials, 761 participants) found low-certainty evidence that aciclovir may help rash and itch, and no convincing benefit for macrolide antibiotics such as erythromycin. Aciclovir may be considered by dermatology in severe or extensive disease, but it does not reliably alter the natural history and should not be prescribed routinely in primary care. Phototherapy is sometimes used by dermatologists. None of these is routine in primary care."}
       ]},
       {b:"warn", html:"The rash can look worse for a week or two before it settles, and new patches may keep appearing for a few weeks. Tell the patient this at the start so a crop of new patches does not feel like treatment failure."}
     ]},

    {id:"course", nav:"Course", title:"Natural course and follow-up", sub:"What to expect, and when to look again.",
     blocks:[
       {b:"timeline", items:[
         {n:"1", when:"Day 0", title:"Herald patch", html:"One larger scaly patch, often mistaken for ringworm."},
         {n:"2", when:"Days to 2 weeks", title:"Secondary eruption", html:"Smaller oval patches appear over the trunk and upper limbs; further crops may follow for several weeks."},
         {n:"3", when:"About 6 to 12 weeks", title:"Resolution", html:"Most cases improve within 6–12 weeks, although some last longer (Cochrane: 2–12 weeks; PCDS patient leaflet: usually within 12 weeks). BAD: clears within a few months."},
         {n:"4", when:"Afterwards", title:"Colour change fades", html:"Pale or dark marks can persist for months, especially in darker skin, and fade without treatment."},
         {n:"5", when:"Still present after about 3 months", title:"Review the diagnosis", html:"Re-examine, test for syphilis if not already done, consider the look-alikes, and refer to dermatology if still uncertain. Persistence is a reason to reassess the diagnosis, not proof that it is something else."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"Recurrence", html:"Most people have it only once; recurrence is uncommon rather than impossible. No action is needed unless recurrent episodes prompt diagnostic reassessment.", src:"PCDS pityriasis rosea guidance"},
         {tone:"green", h:"School and work", html:"There is no need to stay off school or work, and usual activity is fine unless the patient feels unwell. No activity restrictions or tests are needed for uncomplicated pityriasis rosea. The risk of passing it on is very low.", src:"BAD pityriasis rosea leaflet (June 2023)"}
       ]},
       {b:"say", html:"Most cases settle within 6 to 12 weeks without any treatment, although some last longer. New spots can keep coming for a few weeks, and some marks may take a bit longer to fade. If it’s still there after about three months, it becomes more itchy or blistered, or you get spots on your palms or soles or in your mouth, or you feel unwell, come back and I’ll look again."}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — rarely, and for a reason", sub:"Nearly all pityriasis rosea is managed in primary care.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"Sexual health — suspected secondary syphilis", html:"Refer or discuss urgently if syphilis serology is positive; clinical suspicion is high; there are mucosal lesions, palm or sole involvement or significant sexual risk; or the patient is pregnant and syphilis is suspected or confirmed → sexual health for confirmation, staging, treatment and partner notification, via the local integrated sexual health service route (verify the current Bolton/Greater Manchester pathway).", src:"BASHH UK syphilis guideline 2024"},
         {tone:"amber", h:"Maternity team — pityriasis rosea in pregnancy", html:"Consider involving the midwife or obstetric team for onset in early pregnancy (particularly before 15 weeks), atypical or extensive disease, suspected syphilis, or significant maternal concern. Not a mandatory pathway for every typical, mild eruption; any additional surveillance is decided by maternity care.", src:"Drago et al. 2008 · Ong et al. 2024 · Manduca et al. 2025"},
         {tone:"blue", h:"Dermatology — diagnostic uncertainty", html:"Diagnostic uncertainty; eruption persisting beyond the expected course; severe or refractory itch not controlled with emollient, topical steroid and antihistamine; blistering, purpuric or extensive atypical disease; suspected cutaneous T-cell lymphoma or another chronic dermatosis.", src:"PCDS pityriasis rosea guidance"},
         {tone:"blue", h:"No suspected cancer pathway applies", html:"No NICE NG12 suspected-cancer criterion maps to pityriasis rosea, so there is no purple suspected cancer card on this page.", src:"NICE NG12 (updated April 2026)"},
         {tone:"green", h:"Manage in primary care", html:"Typical pityriasis rosea with syphilis excluded where indicated: reassurance, itch relief and a safety-net.", src:"PCDS pityriasis rosea guidance · BAD pityriasis rosea leaflet (June 2023)"}
       ]},
       {b:"say", html:"This doesn’t need a specialist. It will settle on its own, and we can make the itch easier in the meantime. If we’ve done a blood test, it’s just to make sure we’re not missing something that looks similar. If anything changes — the rash on your hands or feet, sores in your mouth, feeling unwell, or it’s still there at three months — come back and we’ll take another look."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 26-year-old woman has a spreading rash on her back and chest for 10 days, which started with ‘a ringworm patch’ that did not respond to clotrimazole. She is worried it is contagious because she works in a nursery. On direct questioning she has a new partner, and her period is two weeks late.", src:"PCDS pityriasis rosea guidance · BAD leaflet (June 2023)"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Recognises the herald patch and fir-tree distribution; examines the palms, soles and mouth and asks about lymph nodes; explains why syphilis serology is sensible, without judgement; asks about pregnancy and arranges a test; shares the uncertain early-pregnancy evidence honestly, without quoting study percentages as her risk, and considers maternity advice if pregnant; reassures about work; offers itch relief; safety-nets at 3 months.", src:"BASHH UK syphilis guideline 2024 · Drago et al. 2008"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Every figure on this page is traceable to a named primary source.",
     blocks:[
       {b:"html", html:"<div class='card'><h3>Evidence panel</h3><ul class='evlist'>"+
         "<li><b>PCDS — Pityriasis rosea clinical guidance</b> (Primary Care Dermatology Society; web guidance, accessed September 2026) and <b>PCDS patient information leaflet (December 2023)</b><br><a href='https://www.pcds.org.uk/clinical-guidance/pityriasis-rosea' rel='noopener'>pcds.org.uk/clinical-guidance/pityriasis-rosea</a><span class='rd'> — herald patch 2–5 cm, collarette scale along cleavage lines, children and young adults, secondary syphilis as the key differential, emollient or mild to moderately potent topical steroid for itch, usually better within 12 weeks</span></li>"+
