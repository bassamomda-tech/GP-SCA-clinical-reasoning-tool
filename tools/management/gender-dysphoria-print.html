MG.render({

  stemTitle:"The GP's role is to refer without gatekeeping, support mental health through a wait measured in years, and keep the person safe — not to assess whether they are really trans",
  stemSub:"One page for the whole of primary care's part: affirming care and correct name and pronouns; an offer of referral to an appropriate NHS gender service, with no requirement for a prior psychiatric diagnosis, mental-health pre-assessment or proof of identity; proactive assessment of a raised suicide and self-harm risk associated with minority stress, discrimination, rejection, dysphoria and ordinary psychiatric morbidity; a harm-reduction response to self-sourced hormones, including exceptional, specialist-informed bridging prescribing and monitoring; screening by anatomy, hormone exposure, surgery and programme rules rather than recorded gender; and continuity through waits that now routinely exceed five years.",
  guideline:"GMC ethical guidance · RCGP position · NHS England gender services · NHS SPS bridging and shared care · NICE fertility · FSRH · NHS screening · Equality Act 2010",

  nextReview:"11 March 2027",
  meta:[
    {t:"GMC — trans healthcare and bridging prescriptions"},
    {t:"RCGP position statement — the role of the GP in transgender care"},

  ],
  lead:'<div class="mg-layers"><a href="#safety"><b>Risk first</b><small>Suicide · self-harm</small></a><a href="#refer-early"><b>Refer</b><small>Offer · no gatekeeping</small></a><a href="#bridging"><b>Bridging</b><small>Exceptional · harm reduction</small></a><a href="#monitor"><b>Monitor</b><small>Bloods · BP · bone</small></a><a href="#screening"><b>Screening</b><small>By anatomy</small></a></div>',
  quickSub:"If you read nothing else on this page, read these six cards. Every position traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Offer referral — gatekeeping is the error", html:"An adult who requests assessment for gender incongruence or dysphoria should be offered referral to an appropriate NHS gender service without requiring a prior psychiatric diagnosis or proof of identity. In England, from 1 October 2026 adult referrals go to the Gender National Referral Support Service (GNRSS), which manages one national waiting list, not to individual clinics; self-referral is no longer accepted. Document the patient's consent and request. You do not need a mental-health assessment first, a psychiatric opinion, a diagnosis, or any evidence that the person is “really” trans — requiring any of these delays care and is not supported by GMC guidance. <b>You do not need to be a gender specialist to make the referral</b>, and declining to refer because you feel inexpert is itself a barrier. Personal beliefs must not lead to discriminatory delay or withdrawal of care. A doctor who cannot provide a particular aspect of care must ensure that the patient is not abandoned and that timely alternative arrangements are made (GMC)."},
    {tone:"red", h:"The risk is high — ask every time", html:"Trans and gender-diverse people have markedly higher rates of depression, anxiety, self-harm and suicide. Mental-health difficulties are common and may be associated with minority stress, discrimination, rejection, dysphoria, social circumstances and ordinary psychiatric morbidity. Assess and treat these factors without assuming that every symptom is caused by gender identity or by hormone treatment. Gender incongruence itself is not a mental illness. Ask directly and compassionately about mood, self-harm and suicidal thoughts at the first appointment and at every review; do not wait for the person to raise it, and do not treat the disclosure as a reason to pause the referral."},
    {tone:"amber", h:"Self-sourced hormones: engage, do not refuse", html:"Refusing to be involved does not stop the person taking hormones — it removes the monitoring and drives concealment. In exceptional circumstances, a GP may consider a harm-reduction prescription for an adult who is already self-prescribing, or is highly likely to obtain hormones from an unregulated source, where prescribing is intended to reduce serious harm or risk of self-harm, the GP has sought specialist advice, and the GP is competent to prescribe and monitor the treatment (GMC; NHS SPS). It is not a routine entitlement or a standard primary-care initiation pathway. Whatever is decided about prescribing, confirm the actual products, give harm-reduction advice, seek specialist advice, and offer baseline and monitoring bloods and blood pressure where clinically appropriate — monitoring is not a reward for obtaining hormones through approved channels."},
    {tone:"blue", h:"Screen by anatomy, not by recorded gender", html:"A trans man with a cervix needs cervical screening; breast-screening eligibility depends on age, anatomy, hormone exposure, surgery and programme criteria; anyone with a prostate retains prostate risk. National screening programmes invite by the gender recorded on the GP system, so changing the recorded gender silently removes the person from some invitation lists and adds them to others. Whenever the recorded gender is changed, review every screening programme and arrange the missing ones manually — this is the commonest avoidable clinical harm in trans healthcare."},
    {tone:"green", h:"The wait is the clinical problem", html:"Adult gender service waits are now routinely several years from referral to first appointment. Adults wait on a single national waiting list managed by the GNRSS, which keeps referral information up to date and keeps patients informed while they wait. The referral is therefore not the end of the GP's involvement — it is the start of a long period in which the GP is the only clinician the person sees. <b>Plan for it explicitly:</b> named clinician for continuity, scheduled reviews rather than waiting to be asked, mental-health treatment, monitoring, screening, ordinary general practice care, and signposting to peer and third-sector support. Do not initiate routine gender-affirming hormones in primary care unless an appropriate specialist-led bridging/shared-care arrangement exists and you are competent to prescribe and monitor."},
    {tone:"purple", h:"Children and young people", html:"Under-18s are not referred by the GP: since 1 September 2024, referrals to NHS Children and Young People's Gender Services must come from NHS paediatric services or NHS children and young people's mental health services (CAMHS), so the GP refers to local paediatrics or CAMHS. Do not initiate puberty-suppressing GnRH analogues or gender-affirming hormones in primary care. Puberty blockers (GnRH analogues) for gender incongruence/dysphoria in under-18s are restricted indefinitely (legislation made indefinite from 1 January 2025, review in 2027): new patients can receive them only within the PATHWAYS clinical trial, accessed through NHS Children and Young People's Gender Services; people already established on treatment may continue, and licensed uses such as precocious puberty are unaffected. Masculinising/feminising hormones for under-18s are prescribed only by NHS Children and Young People's Gender Services, and NHS England consulted in 2026 on removing routine access for new patients. <b>GPs must not prescribe, continue or agree shared care for hormones supplied to under-18s by unregulated providers</b> (NHS England guidance to primary care, April 2025). Check the current national policy before advising a family. <b>Provide respectful, non-directive, developmentally appropriate support</b> — use the young person's chosen name and pronouns, assess mental health and safeguarding, support family communication, and refer to the current specialist children and young people's service."}
  ],
  pathwaySub:"The whole consultation. The first move sets the tone for everything that follows.",
  pathway:[
    {title:"Open by affirming, and commit to the referral", html:"Ask the person's name and pronouns and update the record. Say early that you will offer referral to the appropriate NHS gender service and that no psychiatric diagnosis or proof of identity is needed. Most trans patients arrive braced for rejection — the trust built in the first minute is what makes the rest of the consultation possible."},
    {title:"Assess mental health and risk — proactively", html:"Mood, anxiety, self-harm, suicidal ideation with a direct question, support network, experience of discrimination or abuse — a proper mental state assessment, not a passing enquiry; PHQ-9/GAD-7 do not replace a clinical suicide-risk assessment. Stratify urgency by intent, plan, means and ability to stay safe. Treat what you find; a mental-health need is a reason to add support, never a reason to delay the gender referral.", alert:true},
    {title:"Ask about hormones, without judgement", html:"“Are you taking anything you have sourced yourself?” — asked so that an honest answer is safe. If yes: confirm the actual products, harm reduction, baseline bloods, blood pressure and specialist advice; a bridging prescription only exceptionally, with specialist advice and within your competence."},
    {title:"Refer — and say what you are doing", html:"For adults in England, referral to the Gender National Referral Support Service (GNRSS) using its current form, documenting consent and the request (self-referral is no longer accepted); for under-18s, referral to local NHS paediatrics or CAMHS, who refer on to the NHS Children and Young People's Gender Service. Tell the person the referral is made, be honest about the length of the wait, and give them a copy of the letter if they want it."},
    {title:"Plan the wait", html:"Named GP, scheduled reviews, mental-health treatment, monitoring bloods if on hormones, anatomy-based screening, general health checks, peer support, and a safety-net with crisis contacts. “I will keep seeing you throughout” is the clinically active part of this plan."}
  ],
  sections:[

    {id:"safety", nav:"Risk", title:"Risk and safeguarding — the part that is easy to leave unasked",
     sub:"The referral is the reason for the appointment. The risk assessment is the reason the appointment matters.",
     blocks:[
       {b:"table", head:["Risk","Why it matters here","Action"], rows:[
         ["<b>Suicidal thoughts, a plan, or recent self-harm</b>","Rates of suicidal ideation and attempt in trans people are several times those of the general population, and highest in those who are unsupported, rejected by family, or waiting without contact","<b>Imminent risk, active intent, plan, access to means, inability to maintain safety or recent serious self-harm:</b> same-day urgent mental-health assessment or emergency services. <b>Suicidal thoughts without immediate intent or plan:</b> collaborative safety plan, prompt review, appropriate mental-health referral and clear crisis access. <b>Recent self-harm:</b> assess intent, lethality, repetition risk, safeguarding and psychosocial context; urgency depends on the assessment. In every case: ask about access to medication, ligatures and other means; involve a trusted person with consent where appropriate; give local crisis contacts and NHS 111 option 2 where applicable; short prescription quantities; arrange follow-up rather than leaving it open"],
         ["<b>Depression and anxiety</b>","Very common and frequently untreated, because the person expects any symptom to be attributed to their gender","Treat on the same basis as for any other patient — PHQ-9 and GAD-7 (not a substitute for a clinical suicide-risk assessment), SSRI and/or NHS Talking Therapies. Do not make treatment conditional on anything gender-related"],
         ["<b>Rejection, harassment or abuse — family, partner, workplace</b>","Minority stress is an important contributor to poor mental health in this group; family rejection and lack of social support are important risk factors for self-harm and suicide attempts, particularly in young people","Ask about it directly, including domestic abuse and sexual exploitation. Domestic abuse referral routes apply as for any patient; the Equality Act protects against workplace discrimination and supports adjustments"],
         ["<b>Unmonitored self-sourced hormones</b>","Unknown product, unknown dose, no baseline, no monitoring — and the person will usually not volunteer it unless asked in a way that makes honesty safe","See <a href='#bridging'>Bridging</a>. Harm reduction and monitoring regardless of the prescribing decision"],
         ["Under-18, or a young person presenting with a parent who is hostile to their identity","Safeguarding, family conflict, and a risk of the young person disengaging from healthcare altogether","<b>Refer via local NHS paediatrics or CAMHS (GPs cannot refer directly to the NHS Children and Young People's Gender Service); assess safeguarding and Gillick competence; <b>for those 16 and over presume capacity and assess it only if there is reason to doubt it</b>; see the young person alone for part of the consultation; support the family without conceding the young person's safety</b>"],
         ["<b>Conversion practices, in any form</b>","Attempts to change or suppress gender identity are unethical, harmful, and associated with increased suicidality; they are opposed by the GMC, the RCGP and every UK medical royal college","Never provide, endorse or refer for them. If a family requests one, say clearly that it is harmful and not available"]
       ]},
       {b:"warn", html:"A mental-health problem is a reason to provide mental-health treatment. It is not a reason to withhold or postpone the gender referral, and presenting it as one is the most common form of gatekeeping. <b>The two run in parallel: refer today, treat the depression today.</b> Similarly, a person who is self-medicating has not disqualified themselves from care — they have told you something important, usually at some cost, and the response determines whether they tell you anything again."}
     ]},

    {id:"refer-early", nav:"Refer", title:"The referral — offered without gatekeeping",
     blocks:[
       {b:"dl", rows:[
         ["<b>Who can refer</b>","Any GP. An adult who requests assessment for gender incongruence or dysphoria should be offered referral to an appropriate NHS gender service without requiring a prior psychiatric diagnosis or proof of identity; check the referral criteria and route for the relevant service, and document the patient's consent and request. A referral to an adult Gender Identity Clinic does not require a psychiatric assessment, a second opinion, a formal diagnosis or evidence of “living in role”. <b>From 1 October 2026, adult gender clinics in England no longer take referrals directly and self-referral is not accepted: the GP (or another healthcare professional) refers to the Gender National Referral Support Service (GNRSS), which manages the single national waiting list</b> (introduced on a phased basis from 17 August 2026; referrals by email to agem.agsreferrals@nhs.net, using the current form at genderreferralservice.nhs.uk). Do not re-refer to individual clinics, and do not use uncertainty about the route as a reason to defer"],
         ["<b>What the letter should contain</b>","The person's name and pronouns, that they are requesting assessment for gender dysphoria or incongruence, a brief history in their own terms, any current mental-health issues and what you are doing about them, any safeguarding concerns, current medication and hormone use (including self-sourced), the patient's consent to share this information, and your contact details for shared care. <b>It does not need to argue a case</b> — and offer the person a copy"],
         ["<b>What not to do</b>","Do not require a mental-health assessment first. Do not ask the person to prove their identity or provide a history of childhood evidence. Do not delay pending a “trial period”. Do not decline because you lack expertise — the referral is the mechanism for obtaining that expertise. Personal beliefs must not lead to discriminatory delay or withdrawal of care (gender reassignment is a protected characteristic). A doctor who cannot provide a particular aspect of care must ensure that the patient is not abandoned and that timely alternative arrangements are made"],
         ["<b>Children and young people</b>","Under-18s are not referred by the GP: since 1 September 2024, referrals to NHS Children and Young People's Gender Services must come from NHS paediatric services or NHS children and young people's mental health services (CAMHS), so the GP refers to local paediatrics or CAMHS. Do not initiate puberty-suppressing GnRH analogues or gender-affirming hormones in primary care. Puberty blockers (GnRH analogues) for gender incongruence/dysphoria in under-18s are restricted indefinitely (legislation made indefinite from 1 January 2025, review in 2027): new patients can receive them only within the PATHWAYS clinical trial, accessed through NHS Children and Young People's Gender Services; people already established on treatment may continue, and licensed uses such as precocious puberty are unaffected. Masculinising/feminising hormones for under-18s are prescribed only by NHS Children and Young People's Gender Services, and NHS England consulted in 2026 on removing routine access for new patients. <b>GPs must not prescribe, continue or agree shared care for hormones supplied to under-18s by unregulated providers</b> (NHS England guidance to primary care, April 2025); check the current national policy before advising a family. Respectful, non-directive, developmentally appropriate support, mental-health assessment, safeguarding and support for family communication are still the GP's job"],
         ["<b>Honesty about the wait</b>","Say plainly that the wait is years, not months, and that you know that is unacceptable. False optimism about timescales is experienced as another dismissal — and the honest version is what makes the offer of continuing support credible"]
       ]},
       {b:"say", html:"Before we go any further — I'd like to refer you to the NHS gender service today, and you don't need a psychiatric diagnosis or to prove anything to me. That's not my role and it's not what the referral needs. What I would like to do, if you're happy, is use the rest of our time to make sure you're supported while you wait, because I have to be honest with you that the wait is likely to be a few years. That's not acceptable, and it means the person looking after you in the meantime is me. So can we talk about how you're doing in yourself, and about anything you might already be taking?"}
     ]},

    {id:"bridging", nav:"Bridging", title:"Self-sourced hormones and bridging prescriptions",
     sub:"The decision is not whether the person takes hormones. It is whether anyone is monitoring them.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"What the GMC actually says", html:"GMC guidance, which applies to adults, allows a GP to consider a bridging prescription in exceptional circumstances while the patient awaits specialist assessment, when three conditions are all met: the patient is already self-prescribing, or seems highly likely to self-prescribe, with hormones from an unregulated source; the bridging prescription is intended to mitigate a risk of self-harm or suicide; and the doctor has sought a gender specialist's advice. A bridging prescription is not a routine entitlement, a standard primary-care initiation pathway, automatically within the competence of every GP, or simply a response to a long waiting list. It is initiation or continuation of hormone treatment; its distinguishing features are the clinical rationale, the exceptional circumstances, the specialist advice and the harm-reduction purpose. Prescribe only within your competence."},
         {tone:"amber", h:"The three conditions in practice", html:"(1) The person is already self-prescribing from an unregulated source, or is highly likely to. (2) The prescription is intended to reduce serious harm or a risk of self-harm or suicide. (3) You have sought advice from the gender specialist service — document attempts if no reply comes. Then: document the clinical rationale and consent; confirm the product, route and dose; use a recognised local/shared-care protocol where available; prescribe only within your competence; define monitoring, review and escalation arrangements; and explain that treatment is off-label where relevant. Do not use “lowest acceptable dose” as a substitute for an individualised, specialist-informed plan. Use the NHS Specialist Pharmacy Service bridging and shared-care resources."},
         {tone:"blue", h:"If you decide not to bridge", html:"You may decline to prescribe where this is outside your competence or where a valid shared-care arrangement is not in place — but that does not end your involvement. Continue general medical care, risk assessment, screening, monitoring where clinically appropriate and communication with the specialist service; the patient should not be left without an identified prescriber or safety plan. Still take a history of what is being taken, still do baseline and monitoring bloods, still check blood pressure, still give harm-reduction advice, and still document it. <b>Declining to prescribe is not a reason to decline to monitor</b>, and a person left entirely unmonitored because they are using an unapproved supply is worse off for having told you."},
         {tone:"green", h:"Shared care once the GIC is involved", html:"When the specialist service initiates treatment it will propose a shared-care agreement covering monitoring and repeat prescribing. Declining shared care wholesale — while it may be within the letter of a GP's rights — leaves the patient without a prescriber and is strongly discouraged by the RCGP. If you have genuine concerns about a specific element, raise them with the service rather than refusing the whole arrangement. Long-term shared-care prescribing requires a valid specialist-led agreement and GP competence. <b>Before accepting shared care, confirm that the current GMMMG protocol, specialist service, contact route, monitoring schedule and prescribing responsibilities remain valid.</b> The Greater Manchester shared-care protocols were approved in March 2021 with a review date of March 2024 — treat them as pending local review until GMMMG confirms they are current."},
         {tone:"red", h:"Harm reduction to give regardless", html:"Never inject into a vein; use clean needles and the local needle exchange; never share equipment. <b>Do not double a dose to make up a missed one.</b> Bring the actual product or a photograph of the packaging to the next appointment — dose and preparation are frequently not what the person believes them to be. Hepatitis B vaccination and BBV screening where injecting equipment may have been shared."},
         {tone:"blue", h:"Fertility — say it before treatment starts", html:"<b>Testosterone and oestrogen/anti-androgen treatment can suppress fertility, sometimes substantially. Recovery after stopping treatment is variable and cannot be guaranteed.</b> Gonadectomy and removal of ovarian/testicular tissue are irreversible causes of infertility. Discuss fertility preservation before treatment, including before a bridging prescription, and document the discussion; NICE recommends offering sperm, oocyte or embryo cryopreservation where appropriate before treatment likely to impair fertility. Fertility preservation may still be possible after hormones have started; the process may itself worsen dysphoria; NHS eligibility and funding vary locally; refer to an appropriate fertility service; and coordinate any pause in hormones for fertility treatment with the specialist team."},
         {tone:"blue", h:"Pregnancy and contraception", html:"<b>Testosterone is not a contraceptive</b> and is contraindicated in pregnancy — stop it if pregnancy occurs. Pregnancy remains possible with amenorrhoea on testosterone. Discuss contraception according to anatomy and sexual exposure, not gender identity (FSRH). Trans women may retain fertility and may contribute sperm to a pregnancy; sperm production may recover after stopping oestrogen/anti-androgen treatment, but recovery is variable. Do not assume that GnRH analogues, finasteride, spironolactone or cyproterone provide reliable contraception."}
       ]}
     ]},

    {id:"monitor", nav:"Monitoring", title:"Monitoring on hormone therapy",
     sub:"Monitoring is product-, regimen- and specialist-protocol-specific. The harm-reduction principle applies whether hormones were prescribed by a clinic, bridged by you, or bought online, but this table is not a complete prescribing protocol — follow the current specialist or shared-care protocol.",
     blocks:[
       {b:"table", head:["What","When","Why it matters"], rows:[
         ["<b>Baseline before or at the point of starting</b>","As directed by the specialist protocol. <b>Testosterone:</b> FBC/haematocrit; testosterone, with timing appropriate to formulation; LFTs where required by the local protocol; blood pressure, weight and cardiovascular risk; lipids and HbA1c/glucose according to baseline risk and local protocol; menstrual/bleeding history; pregnancy possibility where relevant. <b>Feminising hormones:</b> blood pressure, weight/BMI and smoking; FBC; renal function/electrolytes, particularly with spironolactone; LFTs; lipids and HbA1c/glucose where clinically indicated; oestradiol and testosterone; prolactin where relevant; thromboembolic and cardiovascular risk assessment. The GMMMG protocol lists a broader panel including prolactin, SHBG, LH and FSH (but is overdue for review)","Establishes the comparator. Without a baseline, a later abnormal haematocrit cannot be interpreted"],
         ["<b>Testosterone — haematocrit</b>","At baseline, then at the intervals set by the specialist or shared-care protocol","Secondary polycythaemia is the most important and most frequently missed complication of testosterone therapy. <b>A rising haematocrit, particularly ≥0.54, requires urgent review of dose, route and contributing factors with specialist advice; do not proceed directly to venesection without assessing the underlying cause and local protocol.</b> Consider smoking, sleep apnoea, dehydration and pulmonary disease as contributors — cessation support is part of the monitoring"],
         ["<b>Oestrogen — VTE risk</b>","Assess at initiation and whenever circumstances change (surgery, immobility, pregnancy in a partner is irrelevant — the risk is the patient's own)","Oestrogen raises VTE risk, and the risk is higher with ethinylestradiol and with oral preparations than with transdermal. Smoking cessation matters more here than almost anywhere else in the review"],
         ["<b>Blood pressure, lipids and cardiovascular risk</b>","<b>At baseline and at least annually</b>","Standard cardiovascular risk calculators are not validated in trans people and are sensitive to which gender is entered. Calculate using both, discuss the range honestly, and treat modifiable risk factors on their merits rather than relying on a single score"],
         ["<b>Bone health</b>","Consider DXA where there has been gonadectomy with any period off hormone therapy or inadequate sex-steroid replacement, prolonged interruption of treatment, hypogonadism, GnRH analogue use, or other osteoporosis risk factors","<b>Sex steroid deficiency after gonadectomy causes rapid bone loss.</b> A person who stops hormones after gonadectomy — for cost, supply or any other reason — is at real risk, so ask about continuity of supply rather than assuming it"],
         ["<b>Hormone levels — testosterone or oestradiol</b>","Per the shared-care protocol; timing relative to the dose matters and varies by preparation","Interpret results according to the formulation, timing of sampling, treatment objective and specialist protocol. Laboratory reference ranges may not automatically reflect the intended treatment range, and there is no universally agreed target range for every patient, formulation or stage of treatment — interpret with the specialist team where uncertain"],
         ["<b>Mental health</b>","<b>Every review</b>","Hormone therapy often improves dysphoria substantially; it does not treat depression, and improvement in one is regularly mistaken for resolution of the other"]
       ]},
       {b:"table", head:["Finding","GP action","Treatment and urgency"], rows:[
         ["<b>Haematocrit rising, particularly ≥0.54</b>","Repeat promptly; review dose, route, smoking, sleep apnoea, dehydration and pulmonary disease","Urgent specialist advice on whether to reduce, change route or pause testosterone; no direct venesection without assessing cause and local protocol"],
         ["<b>Raised potassium on spironolactone</b>","Repeat and check renal function; manage as for any hyperkalaemia using the local pathway","Same-day if severe; otherwise prompt specialist advice on whether to stop or reduce spironolactone"],
         ["<b>Raised prolactin</b>","Repeat; ask about headache, visual disturbance and galactorrhoea","Routine specialist advice; urgent if headache or visual symptoms"],
         ["<b>Deteriorating liver tests</b>","Look for other causes; review all hormones and anti-androgens, particularly cyproterone","Specialist advice on whether to stop or change treatment; urgent if jaundiced or unwell"],
         ["<b>Persistent hypertension</b>","Confirm and manage as for any patient; review spironolactone, oestrogen and testosterone use","Routine specialist advice on the regimen"],
         ["<b>VTE symptoms</b>","Same-day assessment as for any patient","Urgent specialist advice on whether to stop oestrogen"],
         ["<b>New breast or prostate symptoms</b>","Use the same symptom-led suspected-cancer pathways as for other patients","Specialist advice where interpretation is uncertain"],
         ["<b>Local contacts</b>","Gender service advice line, shared-care contact and out-of-hours route","To be completed locally"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"💊 Spironolactone", html:"Monitor potassium, renal function and blood pressure."},
         {tone:"amber", h:"💊 Cyproterone", html:"Meningioma risk, liver toxicity, depression and cumulative-dose considerations — check the current MHRA safety advice and SPC."},
         {tone:"amber", h:"💊 Finasteride", html:"Sexual and psychiatric adverse effects, including persistent symptoms in some patients — check the current MHRA safety advice and SPC."},
         {tone:"amber", h:"💊 GnRH analogues", html:"Bone health, metabolic effects and specialist monitoring. Trans-related use of finasteride, cyproterone and spironolactone requires reference to the gender-service arrangements (Greater Manchester formulary)."}
       ]}
     ]},

    {id:"screening", nav:"Screening", title:"Anatomy-based screening and general health",
     sub:"The single most common avoidable harm in trans healthcare is a screening invitation that was never sent.",
     blocks:[
       {b:"table", head:["Programme","Who needs it","The system problem"], rows:[
         ["<b>Cervical screening</b>","Anyone with a cervix, including trans men and non-binary people registered as male","<b>Registered as male: no automatic invitations, but they remain eligible if they have a cervix.</b> <b>The GP practice should recall and arrange screening.</b> Screening is offered, not compulsory — respect an informed decision to decline. The examination is often dysphoric and painful, particularly on testosterone which causes atrophic change — offer smaller specula, adequate lubricant, extra time, self-insertion where acceptable, and the option to stop at any point. Local vaginal oestrogen may be considered for testosterone-associated atrophy only after discussing dysphoria and preference (individualised, usually off-label). Self-sampling is not equivalent to the standard pathway unless provided through an approved programme. Consider a sexual-health or specialist service if the practice cannot provide a tolerable examination"],
         ["<b>Breast screening</b>","Eligibility depends on age, anatomy, hormone exposure, surgery and local programme criteria. Trans women and trans men who have received female hormone therapy may remain eligible. Trans men: chest surgery does not eliminate all breast tissue or cancer risk; after complete bilateral mastectomy routine population mammography is generally not applicable, but new symptoms need assessment; after chest reduction or with residual tissue, discuss local screening arrangements individually","Registered as male: may not be invited. If a person with breast tissue is not being invited appropriately, contact the local NHS breast-screening service rather than relying on self-referral alone. Registered as female after mastectomy: invitations still arrive — both directions cause harm, and both need an explicit note in the record"],
         ["<b>Abdominal aortic aneurysm screening</b>","Trans women assigned male at birth remain eligible for NHS AAA screening but may not receive an invitation if registered female","Advise them to contact the local AAA screening programme, or arrange access through the current NHS pathway. Follow programme eligibility — opportunistic scanning outside the national programme is not routinely needed"],
         ["<b>Prostate</b>","Anyone with a prostate, including trans women — the prostate is not removed in genital reconstruction surgery","PSA is androgen-dependent and may be lower after oestrogen, anti-androgen therapy or orchidectomy; there is no universally accepted adjusted PSA threshold. Interpret PSA, symptoms and examination in the context of age, prostate status, duration of feminising treatment, anti-androgen use and local prostate-cancer pathways. A low PSA does not completely exclude clinically important disease. Use the same symptom-led pathway as for other patients, and seek urology advice where symptoms, examination or PSA are concerning or interpretation is uncertain"],
         ["<b>Bowel screening</b>","<b>Everyone in the age range</b>","Invited on the recorded gender but sent to everyone, so this one usually works"]
       ]},
       {b:"cards", items:[
         {tone:"blue", h:"📋 When the recorded gender changes", html:"Changing recorded sex/gender may result in a new NHS number or a new record, depending on the national system. Screening invitations, QOF recalls and chronic-disease registers may not transfer reliably. Whenever this happens, actively review every screening programme, every chronic-disease register and every recall — and record the anatomy present, with the person's consent, so future clinicians can screen correctly."},
         {tone:"green", h:"🏥 Everything else is just general practice", html:"Contraception and pregnancy testing according to anatomy and sexual exposure — testosterone is not a contraceptive and does not reliably prevent pregnancy even when periods stop. Include: smoking cessation (extra weight alongside oestrogen and testosterone); alcohol and recreational-drug assessment; obesity, diabetes and hypertension; cardiovascular risk; sexual-health screening according to anatomy and exposure; HPV, hepatitis A/B and other vaccination where indicated; domestic abuse and sexual exploitation; sleep apnoea risk, particularly with testosterone; and osteoporosis risk after gonadectomy, prolonged hormone interruption or low sex-steroid exposure."},
         {tone:"amber", h:"⚠ Do not attribute everything to the hormones", html:"Chest pain, headache, abdominal pain and low mood in a trans patient are investigated exactly as they would be in anyone else. “Trans broken arm syndrome” — attributing unrelated symptoms to gender identity or hormone therapy — is a recognised and consequential diagnostic failure."},
         {tone:"purple", h:"🗂 Records and the law", html:"A person can change their name and gender on the GP record without a Gender Recognition Certificate and without any medical evidence. Gender history is confidential information. Seek explicit consent before disclosing it unless there is a clear legal or safeguarding basis for disclosure. Apply the Gender Recognition Act and GMC confidentiality requirements where relevant — confidentiality applies to all patients, not only those with a Gender Recognition Certificate. <b>Be careful with referral letters, results and reception conversations.</b>"}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 24-year-old trans man (he/him), assigned female at birth, attends asking for a referral to a gender clinic and opens with “I'm guessing you'll want me to jump through hoops first?” He has socially transitioned and has years of persistent distress. As trust builds he discloses <b>low mood and episodes of self-harm</b> with no current support, and — hesitantly — that he has <b>started buying testosterone online</b> because the wait is years. He is <b>registered as female and overdue cervical screening</b>, which he finds distressing."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Asks and uses correct name and pronouns, and commits to the referral in the first minute without requiring proof or a mental-health pre-assessment; proactively and compassionately asks about mood, self-harm and suicidal thoughts, and treats them <b>in parallel with — not instead of — the referral</b>; asks about self-sourced hormones in a way that makes honesty safe and responds with harm reduction, specialist advice, monitoring bloods and — only exceptionally and within competence — consideration of a bridging prescription, rather than refusal; <b>raises fertility preservation before any prescribing</b>; arranges cervical screening on anatomy despite the recorded gender, with sensitivity about how distressing it is; is <b>honest that the wait is years</b>; signposts peer support; and <b>offers explicit continuity</b> — “I'll keep seeing you throughout.” Fails on: misgendering, gatekeeping, pathologising, refusing all involvement with the hormones, or missing the screening."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every position on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>GMC — Trans healthcare: ethical guidance for doctors</b><br><a href="https://www.gmc-uk.org/ethical-guidance/ethical-hub/trans-healthcare" rel="noopener">gmc-uk.org — trans healthcare</a><span class="rd"> — referral without specialist pre-assessment, the bridging-prescription position (exceptional circumstances, already self-medicating or at risk, specialist advice sought, prescriber competence, monitoring), shared care, and that personal beliefs must not lead to discriminatory delay or abandonment</span></li>'+
         '<li>RCGP — position statement on the role of the GP in caring for gender-questioning and transgender patients<span class="rd"> — the expectation of non-discriminatory care, the limits of GP competence, and the strong discouragement of blanket refusal of shared care</span></li>'+
         '<li><b>Gender National Referral Support Service (GNRSS) — information for referrers and professionals</b><br><a href="https://www.genderreferralservice.nhs.uk/referrers-and-professionals" rel="noopener">genderreferralservice.nhs.uk</a><span class="rd"> — from 1 October 2026 adult referrals in England go to the GNRSS and the single national waiting list, not to individual clinics; no self-referral</span></li>'+
         '<li><b>NHS England — Referral pathway for Children and Young People\u2019s Gender Services</b><br><a href="https://www.england.nhs.uk/long-read/referral-pathway-for-children-and-young-peoples-gender-services-community-and-hospital-paediatric-services/" rel="noopener">england.nhs.uk — CYP gender services referral pathway</a><span class="rd"> — since 1 September 2024 referrals only from NHS paediatric or children and young people\u2019s mental health services, not from GPs</span></li>'+
         '<li>NHS England — guidance to primary care about unregulated providers who supply hormone medications to children and young people for gender incongruence (April 2025)<span class="rd"> — GPs should not prescribe or agree shared care with unregulated providers for under-18s</span></li>'+
         '<li>Cass Review — Independent review of gender identity services for children and young people (2024)<br><a href="https://cass.independent-review.uk/" rel="noopener">cass.independent-review.uk</a><span class="rd"> — background to the current restrictions on puberty blockers and the holistic multidisciplinary model for under-18s</span></li>'+
         '<li>UK Government — indefinite restriction on puberty blockers and the response to the targeted consultation (gov.uk)<span class="rd"> — restriction of new GnRH analogue prescribing for gender incongruence in under-18s, exceptions for established treatment, licensed indications and research, and review in 2027 (<a href="https://www.gov.uk/government/news/ban-on-puberty-blockers-to-be-made-indefinite-on-experts-advice" rel="noopener">gov.uk press release</a>)</span></li>'+
         '<li>King\u2019s College London — PATHWAYS research programme<br><a href="https://www.kcl.ac.uk/research/pathways" rel="noopener">kcl.ac.uk/research/pathways</a><span class="rd"> — the only route to puberty blockers for new under-18 patients, accessed through NHS Children and Young People\u2019s Gender Services</span></li>'+
         '<li><b>Equality Act 2010</b><span class="rd"> — gender reassignment as a protected characteristic; protection against discriminatory delay or withdrawal of care, and workplace adjustments</span></li>'+
         '<li><b>Gender Recognition Act 2004</b><span class="rd"> — section 22: protected information obtained in an official capacity, with exemptions and lawful disclosures; confidentiality applies to all patients under GMC guidance</span></li>'+
         '<li>NHS screening programmes: information for GPs, and Cervical screening: programme overview (GOV.UK) — screening for trans and non-binary people<span class="rd"> — the anatomy-based screening rules and the recorded-gender invitation failures for cervical, breast and AAA screening</span></li>'+
         '<li>Primary care hormone monitoring standards (shared-care protocols; Endocrine Society guideline 2017, international)<span class="rd"> — haematocrit monitoring on testosterone, VTE risk on oestrogen, bone health after gonadectomy, and the limits of cardiovascular risk calculators</span></li>'+
         '<li><b>NHS Specialist Pharmacy Service — bridging guidelines for gender incongruence and shared care</b><br><a href="https://www.sps.nhs.uk" rel="noopener">sps.nhs.uk</a><span class="rd"> — exceptional bridging, competence, documentation and monitoring</span></li>'+
         '<li>GMMMG — Greater Manchester gender shared-care protocols (approved March 2021; review date March 2024)<br><a href="https://gmmmg.nhs.uk" rel="noopener">gmmmg.nhs.uk</a><span class="rd"> — baseline panel and shared-care responsibilities; overdue for review, so confirm current status with GMMMG before use</span></li>'+
         '<li>Greater Manchester Joint Formulary<br><a href="https://www.greatermanchesterformulary.nhs.uk" rel="noopener">greatermanchesterformulary.nhs.uk</a><span class="rd"> — trans-related use of finasteride, cyproterone and spironolactone by reference to the gender-service arrangements</span></li>'+
         '<li><b>NICE — Fertility problems: assessment and treatment (current version)</b><br><a href="https://www.nice.org.uk" rel="noopener">nice.org.uk</a><span class="rd"> — discussing fertility preservation and offering sperm, oocyte or embryo cryopreservation before treatment likely to impair fertility</span></li>'+
         '<li>FSRH CEU Statement — Contraceptive choices and sexual health for transgender and non-binary people (2017)<span class="rd"> — testosterone does not provide adequate contraception</span></li>'+
         '<li>MHRA — current Drug Safety Update advice on cyproterone (meningioma) and finasteride (psychiatric and sexual adverse effects), and the product SPC for every hormone and anti-androgen named<span class="rd"> — anti-androgen safety</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Gender dysphoria — GMC ethical guidance on trans healthcare, RCGP position statement, NHS England gender dysphoria service specifications, the Cass Review (2024), and the Equality Act 2010. Offer referral to the appropriate NHS gender service without requiring a psychiatric diagnosis or proof of identity; assess and treat mental health and suicide risk proactively; respond to self-sourced hormones with harm reduction, specialist advice, monitoring and — only exceptionally and within competence — a bridging prescription; screen by anatomy, hormone exposure, surgery and programme rules rather than recorded gender; and provide continuity and ordinary general practice care through waits measured in years. Adults in England are referred to the Gender National Referral Support Service (from 1 October 2026; no self-referral). Under-18s are referred via NHS paediatrics or CAMHS to the NHS Children and Young People's Gender Service; puberty blockers only within the PATHWAYS trial; never prescribe hormones or blockers for under-18s in primary care or in shared care with unregulated providers. Verify all doses and shared-care arrangements against the BNF, product SPCs and the local protocol before prescribing, and confirm that GMMMG shared-care protocols are current."
});
