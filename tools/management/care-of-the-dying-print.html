MG.render({
  icon:"\u{1F54A}️",

  stemTitle:"The last days of life — recognise dying, plan with the family, prescribe ahead, and make the death go well",
  stemSub:"One page for the dying adult at home or in a care home: recognising that someone may be in the last days of life, the conversation, stopping what no longer helps, anticipatory (‘just-in-case’) medicines, the syringe pump, hydration, ReSPECT and capacity, and what happens after death under the statutory medical examiner system. Built on NICE NG31 and QS144, NICE NG142 and the five Priorities for Care of the Dying Person (One Chance to Get it Right, 2014). Symptom-specific detail lives on the palliative symptom protocols linked below.",
  guideline:"NICE NG31 (2015) · QS144 (2017) · NG142 (2019) · One Chance to Get it Right (2014)",
  meta:[
    {t:"NICE NG31 (2015) · last days of life"},
    {t:"NICE QS144 (2017) · quality standard"},
    {t:"NICE NG142 (2019) · service delivery"},

  ],
  lead:'<div class="mg-layers"><a href="#recognise"><b>Recognise</b><small>NG31 signs + uncertainty</small></a><a href="#anticipatory"><b>Just-in-case meds</b><small>Five symptoms</small></a><a href="#pump"><b>Syringe pump</b><small>When and how</small></a><a href="#afterdeath"><b>After death</b><small>Verification, MCCD, ME</small></a></div>',
  glance:[
    {lbl:"Pain / breathlessness", val:"Opioid SC PRN", sub:"morphine first-line if eGFR adequate"},
    {lbl:"Anxiety / agitation", val:"Benzodiazepine SC PRN", sub:"e.g. midazolam"},
    {lbl:"Delirium / agitation", val:"Antipsychotic SC PRN", sub:"e.g. haloperidol, levomepromazine"},
    {lbl:"Nausea / vomiting", val:"Antiemetic SC PRN", sub:"choose by likely cause"},
    {lbl:"Noisy secretions", val:"Antimuscarinic SC PRN", sub:"glycopyrronium / hyoscine butylbromide"},
    {lbl:"Syringe pump", val:"If >2–3 PRN doses / 24 h", sub:"NICE NG31"}
  ],
  quickSub:"If you read nothing else, read these five cards. Doses are deliberately not given here — NICE NG31 does not set them; use your local palliative formulary and the BNF.",
  quick:[
    {tone:"red", h:"Recognising dying is a clinical decision you keep reviewing", html:"Look for the NG31 cluster: <b>agitation, Cheyne–Stokes breathing, falling level of consciousness, mottled skin, noisy respiratory secretions, progressive weight loss</b>, increasing fatigue, loss of appetite, and functional decline. Exclude reversible causes that fit the person’s goals, accept uncertainty, and <b>reassess at least every 24 hours</b> — some people stabilise or recover."},
    {tone:"amber", h:"Say it early, say it plainly", html:"Tell the person (if they can hear it) and those important to them that death is likely within days, and be honest about uncertainty. Agree a <b>named lead clinician</b>, record preferences (place of death, religion, who to call) and a ReSPECT/DNACPR decision, and tell OOH and the district nurses the same day."},
    {tone:"blue", h:"Prescribe ahead for five symptoms", html:"Pain, breathlessness, nausea and vomiting, anxiety/agitation/delirium, and noisy respiratory secretions. <b>Individualised</b> anticipatory medicines with the <b>indication, dose and route</b> written down (NG31 1.6; QS144 statement 3) and a maximum frequency, plus the community medicines authorisation chart and the drugs physically in the home."},
    {tone:"purple", h:"Stop what no longer helps — and switch off the ICD", html:"Stop statins, antihypertensives, most diabetes drugs, bisphosphonates and anticoagulation for prevention; convert essential drugs to SC. Discuss <b>ICD shock deactivation</b> before the last hours — a shock in a dying patient is distressing and futile. Renal impairment changes the opioid: <b>seek specialist advice</b> (NICE CG140)."},
    {tone:"green", h:"Hydration is a conversation, not a default", html:"Assess hydration <b>daily</b>, support drinking if the person wants it, give frequent mouth care, and discuss the benefits and risks of clinically assisted hydration honestly: it may relieve distressing symptoms or signs of dehydration but may cause other problems, and it is <b>uncertain</b> whether it prolongs life or whether withholding it hastens death (NG31 1.4; QS144 statement 4)."}
  ],
  pathwaySub:"The last days in six moves. The red step is the one that most often goes wrong at 2 a.m. on a Saturday.",
  pathway:[
    {title:"Recognise and reassess", html:"Gather the signs, check for reversible causes that match the person’s wishes (infection, hypercalcaemia, opioid toxicity, AKI, hypoglycaemia), seek experienced advice if uncertain, and document that the person may be in the last days of life — with a review date."},
    {title:"Communicate and plan", html:"Explain to the person and family; explore wishes, spiritual needs and preferred place of death; confirm LPA/ADRT; complete or review <b>ReSPECT/DNACPR</b>; write an individualised care plan (the five Priorities for Care)."},
    {title:"Rationalise medicines", html:"Stop non-essential drugs, switch essential ones to the SC route, plan ICD deactivation, simplify diabetes management, and discuss hydration and mouth care."},
    {title:"Anticipatory prescribing — before the crisis", html:"Prescribe PRN SC medicines for the five symptoms with written indications and doses, authorise them on the community chart, make sure they are dispensed and in the home, and hand over to OOH/111 with a care-coordination record (e.g. EPaCCS).", alert:true},
    {title:"Titrate and review", html:"If more than 2–3 PRN doses are needed in 24 hours, consider a syringe pump (NG31). Review at least daily with the district nurse; titrate by PRN use; involve specialist palliative care early for refractory or escalating symptoms."},
    {title:"After death", html:"Expected death: no 999, no police. Verification by a competent nurse or doctor; MCCD by a doctor who attended in life, scrutinised by the <b>medical examiner</b> (statutory since 9 September 2024); note implanted devices; offer bereavement support."}
  ],
  sections:[

    {id:"recognise", nav:"Recognise", title:"Recognising the last days of life", sub:"NICE NG31 section 1.1. Dying is diagnosed from a pattern over time, not from one sign — and the diagnosis can be wrong.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"Signs that suggest the last days", html:"<b>Signs:</b> agitation, Cheyne–Stokes breathing, deterioration in level of consciousness, mottled skin, noisy respiratory secretions, progressive weight loss. <b>Symptoms:</b> increasing fatigue, loss of appetite. <b>Function:</b> changes in communication, deteriorating mobility or performance status, social withdrawal.", src:"NICE NG31 s1.1"},
         {tone:"blue", h:"Improvement matters too", html:"Be aware that improvement in signs, symptoms or function may mean the person is <b>stabilising or recovering</b>. Monitor for further changes at least every 24 hours and update the plan — recognising dying is a working diagnosis, not a label.", src:"NICE NG31 s1.1; QS144 statement 1"},
         {tone:"plain", h:"Gather the whole picture", html:"Use the history, previous trajectory, psychosocial and spiritual context, the person’s own goals, and what the family and carers are noticing. Consider whether investigations would change management — if they would not, avoid them.", src:"NICE NG31 s1.1"},
         {tone:"blue", h:"Uncertainty: ask for help", html:"When there is a high level of uncertainty about whether someone is entering the last days of life, seek advice from a colleague with more experience in end of life care (e.g. the local specialist palliative care team). Do not let uncertainty stop the conversation.", src:"NICE NG31 s1.1"}
       ]},
       {b:"table", head:["Reversible factor","Clue","Consider (only if consistent with goals)"], rows:[
         ["Opioid toxicity","Myoclonus, pinpoint pupils, drowsiness, hallucinations — especially with falling renal function","Reduce or switch opioid; seek specialist advice (NICE CG140)"],
         ["Hypercalcaemia","Confusion, thirst, constipation, vomiting in known malignancy","Calcium level only if treatment would be accepted"],
         ["Infection","Fever, new focus, rapid change","Antibiotics may be appropriate earlier in illness; discuss burden versus benefit"],
         ["Hypoglycaemia / hyperglycaemia","Drowsiness in a person on insulin or sulfonylurea who has stopped eating","Capillary glucose; simplify diabetes regimen"],
         ["Dehydration / AKI","Drug accumulation, delirium","Hydration discussion (NG31 s1.4); review renally cleared drugs"],
         ["Urinary retention / constipation","Restlessness, lower abdominal discomfort","Examine; catheter or rectal measures may transform comfort"]
       ]},
       {b:"why", html:"The Liverpool Care Pathway was withdrawn after the 2013 Neuberger review found it was sometimes applied as a tick-box protocol once someone was ‘labelled’ as dying. NG31 and One Chance to Get it Right (2014) replaced it with an individualised approach: recognise the possibility of dying, keep reviewing, and plan care around the person."}
     ]},

    {id:"priorities", nav:"Five priorities", title:"The five Priorities for Care of the Dying Person", sub:"Leadership Alliance for the Care of Dying People, One Chance to Get it Right (June 2014). Still the national framework referenced by the NACEL end of life care audit.",
     blocks:[
       {b:"kv", rows:[
         ["1 · Recognise","The possibility that a person may die within the next few days or hours is recognised and communicated clearly, decisions are made and actions taken in accordance with the person’s needs and wishes, and these are regularly reviewed and decisions revised accordingly."],
         ["2 · Communicate","Sensitive communication takes place between staff and the dying person, and those identified as important to them."],
         ["3 · Involve","The dying person, and those identified as important to them, are involved in decisions about treatment and care to the extent that the dying person wants."],
         ["4 · Support","The needs of families and others identified as important to the dying person are actively explored, respected and met as far as possible."],
         ["5 · Plan &amp; do","An individual plan of care, which includes food and drink, symptom control and psychological, social and spiritual support, is agreed, co-ordinated and delivered with compassion."]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"Individualised care plan", html:"Adults in the last days of life, and those important to them, are given opportunities to discuss, develop and review an <b>individualised care plan</b>: personal goals and wishes, preferred care setting, current and anticipated care needs, resources required, and cultural, religious or spiritual needs.", src:"NICE QS144 statement 2; NG31 s1.3"},
         {tone:"blue", h:"Named lead healthcare professional", html:"Identify a named lead clinician responsible for encouraging shared decision-making in the last days of life. In the community this is usually the GP, working with the district nursing team; make sure OOH knows who that is.", src:"NICE NG31 s1.3"}
       ]}
     ]},

    {id:"communicate", nav:"Communicate", title:"Communication and shared decision-making", sub:"NICE NG31 sections 1.2 and 1.3. The conversation is the intervention families remember.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"plain", h:"Establish communication needs", html:"Find out what the person wants to know and who they want present. Check whether they have hearing, visual, language or cognitive needs, and whether they want an interpreter or chaplain. Explore their understanding before giving information.", src:"NICE NG31 s1.2"},
         {tone:"plain", h:"Be honest about uncertainty", html:"Explain that the person may be in the last days of life, what signs suggested this, and that this is <b>uncertain</b> — they may improve. Give accurate information about prognosis without false reassurance. Offer to revisit as things change.", src:"NICE NG31 s1.2"},
         {tone:"plain", h:"Shared decisions", html:"Ask about the person’s goals and wishes, advance statements and ADRTs, LPA for health and welfare, preferred place of care and death, and whether they want to be involved in decisions about medicines, hydration and the syringe pump.", src:"NICE NG31 s1.3"},
         {tone:"plain", h:"Record and share", html:"Document discussions and decisions in the record and the care-coordination system, so the out-of-hours GP, 111, ambulance service and community nurses see the same plan. Provide the family with a written summary and contact numbers.", src:"NICE NG142 (2019)"}
       ]},
       {b:"say", html:"“I’m sorry to say that your dad is showing signs that he may be in the last days of his life. He’s sleeping much more, he’s stopped eating and his breathing has changed. We can’t be certain — sometimes people rally for a while — but I think it’s important we plan now so that he stays comfortable here at home, as he wanted. Can I explain what we’ll put in place, and what you might see over the next few days?”"},
       {b:"why", html:"NG31 was written partly because families under the Liverpool Care Pathway often said nobody told them their relative was dying, or why drugs and fluids were stopped. An explicit, recorded conversation — including the uncertainty — protects the person, the family and the clinician."}
     ]},

    {id:"capacity", nav:"ReSPECT & MCA", title:"ReSPECT, DNACPR, capacity and LPA", sub:"Legal and ethical footing for decisions in the last days. None of these require the person to be told they ‘must’ sign anything.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"CPR decisions", html:"Where CPR would not be successful, a DNACPR decision is a clinical one, but there is a <b>presumption in favour of discussing it</b> with the person (or, if they lack capacity, those close to them) unless it would cause physical or psychological harm. Record the decision and the discussion; a DNACPR decision does not mean ‘no other treatment’.", src:"BMA/Resuscitation Council UK/RCN Decisions relating to CPR (3rd ed, 1st revision)"},
         {tone:"amber", h:"ReSPECT", html:"The <b>ReSPECT</b> process records personalised recommendations for care in a future emergency when the person cannot express choices — including CPR, ceiling of treatment and whether hospital admission is wanted. Make sure the form is in the home and the details are on the shared record.", src:"Resuscitation Council UK ReSPECT process"},
         {tone:"blue", h:"Mental Capacity Act 2005", html:"Assume capacity; assess it decision-specifically; support the person to decide. If they lack capacity, act in their <b>best interests</b>, taking into account their past and present wishes and consulting those close to them. An IMCA is needed for serious medical treatment if nobody appropriate can be consulted.", src:"Mental Capacity Act 2005"},
         {tone:"blue", h:"LPA and ADRT", html:"A registered <b>health and welfare LPA</b> can make decisions about life-sustaining treatment only if the LPA expressly gives that power. A valid, applicable <b>ADRT</b> refusing life-sustaining treatment must be written, signed, witnessed and state that it applies even if life is at risk. Check the OPG register if unsure.", src:"Mental Capacity Act 2005 ss9–26"}
       ]},
       {b:"warn", html:"Families often believe they ‘have the final say’. Unless they hold a relevant LPA, they are consulted, not decision-makers. Explain this kindly, and remember that no one can demand treatment that is not clinically indicated."}
     ]},

    {id:"medicines", nav:"Stop meds & ICD", title:"Rationalising medicines and deactivating devices", sub:"Stop anything given for long-term prevention; keep and convert anything that gives comfort today.",
     blocks:[
       {b:"table", head:["Drug group","Usual action in the last days","Note"], rows:[
         ["Statins, antihypertensives, bisphosphonates, vitamins, antiplatelets for prevention","<b>Stop</b>","No benefit within days; tablets become a burden once swallowing fails"],
         ["Anticoagulants","Usually stop; discuss","Explain that the risk of a clot now matters less than comfort"],
         ["Oral diabetes drugs","Stop sulfonylureas and most others","Hypoglycaemia is a real risk as intake falls"],
         ["Insulin (type 1 or insulin-requiring type 2)","Simplify rather than always stop","Follow local end of life diabetes guidance; aim to avoid symptomatic hypo- and hyperglycaemia and reduce testing"],
         ["Regular opioids","Convert to SC (PRN or syringe pump)","Do not stop abruptly in someone on long-term opioids — withdrawal and pain"],
         ["Anticonvulsants","Convert — e.g. SC midazolam via pump, per specialist advice","Seizures in the last days are distressing; plan for them in brain tumours"],
         ["Corticosteroids","Review; convert or taper per specialist advice","Stopping high-dose steroids suddenly may worsen symptoms (see <a href='../management/palliative-corticosteroids.html'>palliative corticosteroids</a>)"],
         ["Parkinson’s drugs","Do not stop abruptly; seek advice","Abrupt withdrawal risks rigidity and parkinsonism-hyperpyrexia syndrome; non-oral options exist"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"ICD — discuss shock deactivation", html:"Discuss deactivating the <b>shock (defibrillator) function</b> of an ICD as part of advance care planning, ideally long before the last days. Deactivation is painless and does not cause death; a pacing function can be left on. Contact the device clinic early — in an emergency a clinical magnet placed over the device suspends shocks while it is in place.", src:"BHRS 2024 ICD shock discontinuation guideline; RCUK/BCS/NCPC CIED guidance 2015"},
         {tone:"blue", h:"Route and injections", html:"Consider different routes if the person cannot take or tolerate oral medicines. <b>Avoid intramuscular injections</b>; use the subcutaneous (or, if already in place, intravenous) route.", src:"NICE NG31 s1.5"},
         {tone:"plain", h:"Oxygen", html:"Do not routinely start oxygen for breathlessness. Only offer oxygen to people known or clinically suspected to have symptomatic hypoxaemia. Consider non-pharmacological measures (positioning, a fan, calm presence).", src:"NICE NG31 s1.5"},
         {tone:"plain", h:"Observations and investigations", html:"Consider investigations only if they are likely to affect care in the last days of life. Stop routine observations and blood tests that no longer change management, review glucose monitoring against local end of life diabetes guidance, and keep assessing comfort, pain, agitation, mouth and skin.", src:"NICE NG31 s1.1"}
       ]}
     ]},

    {id:"anticipatory", nav:"Anticipatory meds", title:"Anticipatory (‘just-in-case’) prescribing", sub:"NICE NG31 section 1.6 and QS144 statement 3. Named drugs are the usual UK choices; doses come from your local palliative formulary and the BNF, adjusted for opioid use, frailty and renal function.",
     blocks:[
       {b:"p", html:"Prescribe anticipatory medicines <b>as early as possible</b> for people likely to need symptom control in the last days of life, with the <b>indications for use and dosage</b> specified (NG31) and the <b>route</b> (QS144 statement 3). Discuss this with the person and those important to them, make sure the medicines are dispensed and available in the home, and review them as needs change. Before any anticipatory medicine is given, the symptoms should be reviewed and the plan adjusted (NG31 s1.6)."},
       {b:"table", head:["Symptom","Usual SC PRN choice(s) — dose per local formulary / BNF","What NG31 says","Detailed protocol"], rows:[
         ["<b>Pain</b>","Opioid — morphine for most; alternative opioid (e.g. oxycodone or alfentanil) in renal impairment on specialist advice. If already on an opioid, the PRN dose is derived from the current 24-hour dose","Assess the cause; choose drug and route to suit the person and their prior analgesia; seek specialist advice if unsure","<a href='../management/palliative-pain.html'>Palliative pain</a>"],
         ["<b>Breathlessness</b>","Opioid (e.g. morphine) and/or benzodiazepine (e.g. midazolam)","Consider an opioid or a benzodiazepine, or a combination; oxygen only for symptomatic hypoxaemia","<a href='../management/palliative-breathlessness.html'>Palliative breathlessness</a>"],
         ["<b>Nausea and vomiting</b>","Antiemetic chosen by likely cause — e.g. haloperidol (chemical/metabolic), cyclizine (central/vestibular), levomepromazine (broad-spectrum)","Assess likely causes (drugs, biochemistry, obstruction, raised ICP) and choose accordingly","<a href='../management/palliative-nausea-vomiting.html'>Palliative nausea &amp; vomiting</a>"],
         ["<b>Anxiety, agitation, delirium</b>","Benzodiazepine (e.g. midazolam) for anxiety/agitation; antipsychotic (e.g. haloperidol or levomepromazine) for delirium or agitation","Treat reversible causes first; seek specialist advice if diagnosis uncertain, no response, or unwanted sedation","<a href='../management/palliative-delirium-agitation.html'>Palliative delirium &amp; agitation</a>"],
         ["<b>Noisy respiratory secretions</b>","Antimuscarinic — glycopyrronium, hyoscine butylbromide or hyoscine hydrobromide (atropine is also listed)","Consider an antimuscarinic if secretions are causing distress; consider non-drug measures such as repositioning; explain to family; monitor for improvement (preferably every 4 hours, at least every 12 hours) and side effects; consider changing or stopping if still distressing after 12 hours","<a href='../management/palliative-respiratory-secretions.html'>Palliative respiratory secretions</a>"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"red", h:"Opioid-naive vs already on opioids", html:"A ‘standard’ PRN dose is only right for an opioid-naive adult with adequate renal function. If the person is already taking regular opioids, calculate the SC breakthrough from the current 24-hour dose using a recognised conversion (local palliative chart or BNF). Giving a naive dose to someone on high-dose opioids leaves them in pain.", src:"BNF — Prescribing in palliative care"},
         {tone:"red", h:"Renal impairment — the classic pitfall", html:"Morphine and its active metabolites accumulate as eGFR falls, causing drowsiness, myoclonus, hallucinations and agitation — which can be mistaken for terminal agitation and ‘treated’ with more sedation. <b>Seek specialist advice before prescribing strong opioids in moderate to severe renal or hepatic impairment.</b>", src:"NICE CG140 (2012, updated 2016)"},
         {tone:"amber", h:"Individualise, do not copy a template", html:"Anticipatory prescriptions should be individualised — drug, dose, route, indication and frequency — not a blanket bundle. Consider frailty, weight, prior benzodiazepine or antipsychotic exposure, Parkinson’s disease (dopamine-blocking antipsychotics such as haloperidol can worsen motor features — seek advice), and likely symptoms for this illness.", src:"NICE NG31 s1.6; QS144 statement 3; NICE NG71 (Parkinson’s)"},
         {tone:"blue", h:"Make it real in the home", html:"Authorise the drugs on the community medicines administration chart, arrange dispensing (not all pharmacies stock them — check local ‘stockist’ schemes), make sure water for injection and syringes are there, and tell the district nurses and OOH that the box is in the house.", src:"NICE NG142 (2019)"},
         {tone:"plain", h:"Antimuscarinics for secretions", html:"NG31 names atropine, glycopyrronium bromide, hyoscine butylbromide and hyoscine hydrobromide; the choice in practice follows the local formulary. Monitor regularly for side effects — NG31 highlights <b>delirium, agitation or excessive sedation with atropine or hyoscine hydrobromide</b> (both cross the blood–brain barrier); dry mouth can occur with any.", src:"NICE NG31 s1.5"},
         {tone:"plain", h:"Non-drug measures first", html:"Repositioning for secretions; a fan, window and calm presence for breathlessness; a familiar voice, lighting and routine for agitation; mouth care for thirst; treat urinary retention and constipation before sedating.", src:"NICE NG31 s1.4–1.5"}
       ]},
       {b:"warn", html:"<b>Never use anticipatory sedation to manage a problem you have not examined.</b> A full bladder, faecal impaction, pain or opioid toxicity presenting as agitation needs a different treatment. Seek specialist palliative care advice for refractory agitation or if continuous sedation is being considered."}
     ]},

    {id:"pump", nav:"Syringe pump", title:"The syringe pump (continuous subcutaneous infusion)", sub:"A syringe pump is a way of giving drugs, not a sign that death is being hastened. Explain that to the family.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1", title:"When to consider a pump", when:">2–3 PRN doses in 24 h",
          html:"NICE NG31 advises considering a syringe pump to deliver medicines for continuous symptom control if <b>more than 2 or 3 doses</b> of any ‘as required’ medicine have been given within 24 hours. It is also used when a person can no longer swallow their regular medicines (e.g. a long-acting opioid or an anticonvulsant)."},
         {step:"2", title:"Work out the 24-hour dose", when:"prescribe",
          fromLabel:"calculate",
          html:"Base the pump on the regular medicine the person was taking plus the PRN doses actually used in the previous 24 hours. For conversion from oral to SC opioids use the local palliative conversion chart or the BNF; the SC dose of morphine is lower than the oral dose. Keep a PRN SC breakthrough dose prescribed alongside the pump and recalculate it whenever the pump dose changes."},
         {step:"3", title:"Combine compatible drugs", when:"several symptoms",
          fromLabel:"mix",
          html:"An opioid, an antiemetic, a benzodiazepine and an antimuscarinic are commonly combined in one pump. Check compatibility and diluent in a recognised palliative drug reference or with the pharmacist; <b>cyclizine</b> is prone to precipitation in combinations and at higher concentrations. If in doubt, use two pumps or seek specialist advice."},
         {step:"4", title:"Review at least daily", when:"titrate",
          fromLabel:"monitor",
          html:"Review comfort, PRN use and site daily with the district nurse. If PRN use keeps rising, increase the pump in proportion and ask why symptoms are escalating. A pump takes a few hours to reach steady state — give PRN doses meanwhile."}
       ]},
       {b:"say", html:"“The pump is a small battery-powered device that gives his medicines slowly under the skin over 24 hours, because he can’t swallow tablets now. It isn’t there to make things happen faster — it’s there so he doesn’t have peaks and troughs of pain or sickness. The nurses will check it every day.”"}
     ]},

    {id:"hydration", nav:"Hydration & comfort", title:"Hydration, nutrition and comfort care", sub:"NICE NG31 section 1.4 and QS144 statement 4.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"Support drinking; assess daily", html:"Support the person to drink if they wish and can, with help to swallow safely. Assess hydration status, preferably <b>daily</b>, and review the possible need to start or stop clinically assisted hydration, respecting their wishes.", src:"NICE NG31 s1.4; QS144 statement 4"},
         {tone:"amber", h:"Discuss benefits and risks honestly", html:"Clinically assisted hydration may relieve distressing symptoms or signs of dehydration but may cause other problems (e.g. oedema, secretions, cannula burden). It is <b>uncertain</b> whether giving it prolongs life or extends the dying process, or whether not giving it hastens death.", src:"NICE NG31 s1.4"},
         {tone:"blue", h:"If a trial of fluids is started", html:"Monitor at least every 12 hours for changes in symptoms or signs of dehydration and for any benefit or harm. Continue, reduce or stop as the person nears death. In the community, SC fluids (hypodermoclysis) can be given where locally supported.", src:"NICE NG31 s1.4"},
         {tone:"plain", h:"Mouth care and the family", html:"Offer frequent care of the mouth and lips. Encourage those important to the person to help with mouth and lip care or giving drinks if they wish, and provide aids and advice on giving drinks safely.", src:"NICE NG31 s1.4"}
       ]},
       {b:"tiles", v:"life", items:[
         {t:"\u{1F6CF}️ Skin & position", html:"Pressure-area care, repositioning for comfort and secretions; pressure-relieving mattress via the community team."},
         {t:"\u{1F6BD} Bladder & bowel", html:"Catheter for retention or distressing incontinence; check for faecal impaction when restless."},
         {t:"\u{1F54A}️ Spiritual & cultural", html:"Ask about faith, rituals around death and after death, and who should be called; involve chaplaincy or faith leaders."},
         {t:"\u{1F46A} Being there", html:"Many families want to be present; explain what to expect, practical rota, and that it is fine to rest."}
       ]}
     ]},

    {id:"service", nav:"Community care", title:"Organising care at home — NICE NG142", sub:"Service-level recommendations the GP practice is part of.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Identify people early", html:"Use a systematic approach to identify adults likely to be approaching the end of life — NG142 names tools such as the <b>Gold Standards Framework</b>, the AMBER care bundle and <b>SPICT</b>. In practice this means a palliative care register and regular MDT meetings.", src:"NICE NG142 (2019)"},
         {tone:"blue", h:"Advance care planning", html:"Offer advance care planning discussions to people approaching the end of life, including preferred place of care and death, and share the result with the services that will need it (OOH, ambulance, care home).", src:"NICE NG142 (2019)"},
         {tone:"blue", h:"Carers", html:"Identify carers and people important to the dying person, and offer a carer’s needs assessment in line with the <b>Care Act 2014</b>. Carers need practical and emotional support before and after the death.", src:"NICE NG142 (2019)"},
         {tone:"blue", h:"Care coordination and 24/7 access", html:"Ensure care is coordinated across settings with a named contact, shared records (e.g. EPaCCS), and access to advice and equipment out of hours, including specialist palliative care advice.", src:"NICE NG142 (2019)"}
       ]},
       {b:"dl", rows:[
         ["Palliative care register","Practices keep a register and review it at regular MDT meetings with district nurses and the community palliative care team"],
         ["Handover to OOH","Share diagnosis, ceiling of care, ReSPECT/DNACPR, anticipatory medicines in the home, preferred place of death, and who has been told what"],
         ["Care homes","Ensure the home has the anticipatory medicines, the chart, the ReSPECT form, and knows the verification process and who to call"],
         ["Equipment","Hospital bed, pressure mattress, commode, syringe pump — order early; delays cause unwanted admissions"]
       ]}
     ]},

    {id:"afterdeath", nav:"After death", title:"After the death — verification, certification and the medical examiner", sub:"England and Wales. The statutory medical examiner system started on 9 September 2024.",
     blocks:[
       {b:"timeline", items:[
         {n:"1", when:"Death occurs", title:"Expected death at home", html:"The family does not need to call 999 or the police. They call the district nurse, the practice or the OOH service. Undertakers can be called after verification."},
         {n:"2", when:"Hours", title:"Verification of death", html:"Confirmation that death has occurred, by a doctor or a <b>registered nurse assessed as competent</b> under local policy. Record time, who verified it, and any implanted devices."},
         {n:"3", when:"Promptly", title:"MCCD and the medical examiner", html:"A doctor who attended the deceased <b>at any time in their life</b> completes the MCCD; the medical examiner reviews it and offers the bereaved a conversation before registration."},
         {n:"4", when:"Within 5 days", title:"Registration", html:"The family registers the death once the ME has agreed the cause (or the coroner has been involved). The statutory 5 days now starts when the registrar receives the cause of death from the ME or coroner."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"plain", h:"Verification by registered nurses", html:"Hospice UK guidance supports competent registered nurses verifying an expected adult death, with a competency framework and a checklist of the examination. Check who is authorised locally — and whether the ReSPECT/DNACPR and expected-death documentation is in the home.", src:"Hospice UK RNVoEAD guidance (6th ed, 2025)"},
         {tone:"amber", h:"Who can complete the MCCD", html:"Since <b>9 September 2024</b> any registered medical practitioner who attended the deceased during their lifetime may complete the MCCD, if they can state the cause of death to the best of their knowledge. The old requirement to have seen the patient in the 28 days before death, or after death, has been withdrawn.", src:"DHSC death certification reforms, England and Wales (9 Sep 2024); Chief Coroner Guidance No. 47 (2024)"},
         {tone:"purple", h:"Medical examiner scrutiny", html:"All deaths in England and Wales not investigated by the coroner are reviewed by an independent <b>medical examiner</b> before registration. The ME reviews the records, discusses the cause with the certifying doctor and gives the bereaved a chance to ask questions or raise concerns.", src:"Medical Examiners (England) Regulations 2024; Medical Examiners (Wales) Regulations 2024"},
         {tone:"red", h:"When to notify the coroner", html:"Notify the senior coroner, in writing, if the death may be unnatural (e.g. a fall, injury, industrial disease, neglect, or related to treatment), the cause is unknown, the person died in state detention, or no doctor can certify. ‘Expected’ does not exempt a death from notification if one of these applies.", src:"Notification of Deaths Regulations 2019"},
         {tone:"blue", h:"Implanted devices and cremation", html:"Information about implanted medical devices (pacemakers, ICDs and other implants), previously recorded on Cremation Form 4, is now recorded on the MCCD and passed by the registrar to the burial or cremation authority. <b>Cremation Form 4 is no longer required</b> from 9 September 2024; Form 5 was permanently removed in March 2022.", src:"Death certification reforms, England and Wales (9 Sep 2024)"},
         {tone:"green", h:"Bereavement support", html:"Contact the family after the death, offer an appointment, and signpost bereavement services (hospice, local and national bereavement charities). Watch for prolonged or complicated grief in carers at later consultations.", src:"NICE NG142 (2019)"}
       ]}
     ]},

    {id:"safety", nav:"Safety-net", title:"Safety-netting and preparing the family", sub:"What families most often say afterwards: “nobody told us what it would look like.”",
     blocks:[
       {b:"table", head:["What they may see","What to tell them","Who to call"], rows:[
         ["Sleeping more, harder to wake","Normal as the body slows; keep talking to them — they may still hear you","No call needed unless distressed"],
         ["Rattly breathing","Usually secretions the person can no longer clear; it rarely distresses them; turning helps","District nurse if the person seems distressed"],
         ["Pauses in breathing, irregular breaths","Common in the last hours (Cheyne–Stokes)","No call needed"],
         ["Restlessness, pulling at sheets, calling out","Can be pain, a full bladder, or delirium","District nurse / OOH — anticipatory medicines may help"],
         ["Pain, vomiting, breathlessness","Treatable — medicines are in the house","District nurse / OOH promptly"],
         ["Cold, mottled hands and feet","Circulation slowing","No call needed"],
         ["Death","No need for 999 or the police in an expected death; take your time","Practice or OOH / district nurse for verification"]
       ]},
       {b:"say", html:"“Over the next few days he’ll probably sleep more and more, and his breathing may change — there may be pauses, or a rattle, which usually bothers the people around more than him. The medicines in the box are there so the nurses can act quickly if he’s in pain, sick, restless or breathless — day or night. If you’re worried about anything, ring this number; you won’t be bothering anyone. When he dies, you don’t need to ring 999 — ring the nurses or the out-of-hours doctor, and take whatever time you need first.”"}
     ]},

    {id:"pitfalls", nav:"Pitfalls", title:"Common pitfalls", sub:"Most complaints and significant events in end of life care trace to one of these.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"No meds in the house on Friday evening", html:"Anticipatory medicines prescribed but not dispensed, no authorisation chart, or not handed over to OOH — so a distressing death, or an unwanted 999 call and admission.", src:"NICE QS144 statement 3"},
         {tone:"red", h:"Opioid toxicity mistaken for terminal agitation", html:"Rising morphine with falling renal function causes myoclonus and agitation; more midazolam masks it. Reduce the opioid and seek specialist advice.", src:"NICE CG140 (2012, updated 2016)"},
         {tone:"amber", h:"Dying not recognised — or not revisited", html:"Tablets continued, no conversation, or the reverse: a person labelled ‘dying’ who then stabilises but whose plan is never reviewed.", src:"NICE NG31 s1.1"},
         {tone:"amber", h:"ICD fires in the last hours", html:"No deactivation discussion. Ask about implanted devices in every person on the palliative register with heart disease.", src:"BHRS 2024 ICD shock discontinuation guideline"},
         {tone:"amber", h:"Hydration decided without discussion", html:"Families told ‘fluids are not given at the end of life’ as a rule; NG31 asks for a daily, individual assessment and an honest discussion.", src:"NICE NG31 s1.4"},
         {tone:"plain", h:"Unnecessary coroner referral — or a missed one", html:"Old ‘28-day’ habits persist; conversely, a fall-related death in a frail person may still need notification.", src:"Notification of Deaths Regulations 2019"}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"plain", h:"Classic scenario", html:"Telephone consultation with the daughter of an 84-year-old man with metastatic prostate cancer and CKD stage 4, at home. He has been in bed for three days, barely drinking, confused at night. She asks: “Should he be on a drip? Is he dying? Mum says we should call an ambulance if anything happens.”"},
       {tone:"plain", h:"Examiner-style checkpoints", html:"Gathers the picture and considers reversible causes (opioid toxicity with CKD, retention, hypercalcaemia); names dying sensitively and acknowledges uncertainty; explores wishes and preferred place of death; addresses hydration honestly (NG31 s1.4); checks ReSPECT/DNACPR and LPA; plans anticipatory medicines with renal-appropriate opioid and specialist advice; arranges a home visit and district nurse; tells the family what to expect and that they need not call 999 at the death; handover to OOH; offers support to the daughter and mother."}
     ]}]},
