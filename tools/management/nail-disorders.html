  stemTitle:"Most nail change is fungal or psoriatic — but a new or changing solitary pigmented nail in an adult is possible nail-unit melanoma until assessed, and confirming fungus by mycology comes before any oral antifungal",
  stemSub:"One page for the whole presentation: screen first for subungual melanoma and hand-space infection, then classify by colour, texture and distribution — distribution helps localise the differential but is not diagnostic. Confirm onychomycosis with clippings before committing anyone to months of terbinafine, distinguish the psoriatic oil drop sign from fungus, never incise a herpetic whitlow, and assess diabetic foot risk (NICE NG19) rather than treating nail disease in diabetes as purely cosmetic.",

  lead:'<div class="mg-layers"><a href="#severe"><b>Exclude first</b><small>Melanoma · clubbing · hand sepsis</small></a><a href="#differential"><b>Differential</b><small>Fungus · psoriasis · others</small></a><a href="#confirm"><b>Classify</b><small>Colour · texture · infection</small></a><a href="#workup"><b>Assess</b><small>All 20 nails · mycology</small></a><a href="#ladder"><b>Treat</b><small>Confirm before prescribing</small></a><a href="#monitor"><b>Review</b><small>Slow response · surveillance</small></a></div>',
  quickSub:"If you read nothing else on this page, read these six cards. Every number traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"purple", h:"⚠ A new or changing solitary pigmented nail in an adult is possible melanoma until assessed", html:"Hutchinson's sign — pigment extending onto the proximal or lateral nail fold or cuticle — is suspicious for subungual melanoma but not diagnostic (pseudo-Hutchinson sign and benign periungual pigmentation occur). Nail dystrophy, periungual pigmentation, widening, colour variegation or progressive change warrant urgent dermatology assessment; do not biopsy or excise in primary care. Do not attribute progressive nail pigmentation in an adult to trauma or ethnic melanonychia without dermatology assessment. Subungual melanoma is a small share of melanoma in white populations but a much larger share in people with darker skin, where acral melanoma makes up more of the total. → <b>Urgent dermatology referral (suspected cancer pathway) using clinical judgement and local pathway criteria — NG12 has no nail-specific criteria.</b>"},
    {tone:"red", h:"Never incise a herpetic whitlow", html:"Multiple clustered vesicles on an erythematous base with pain disproportionate to appearance, and no central fluctuance — incising it worsens the condition and spreads the virus. <b>Do not incise or drain. Consider early antiviral treatment, particularly for severe, extensive, recurrent or immunocompromised infection; verify dose, renal adjustment and duration against the current BNF/local antiviral protocol.</b> This is the single most important error to avoid in an acutely painful finger."},
    {tone:"amber", h:"Clubbing is never dismissed", html:"Clinical examination teaching (not NG12 criteria): loss of the normal angle at the nail fold (about 160°), a fluctuant nail base and increased longitudinal curvature — confirm true clubbing clinically. Ask about respiratory symptoms and smoking. Causes include lung cancer, mesothelioma, bronchiectasis or interstitial lung disease, inflammatory bowel disease, cyanotic heart disease, infective endocarditis (fever, murmur or systemic illness) and liver disease — not equally likely. <b>Aged 40 and over with finger clubbing: consider an urgent direct-access chest X-ray, normally within 2 weeks (NICE NG12). Investigate younger patients according to clinical context.</b> Febrile with a murmur: same-day assessment for endocarditis."},
    {tone:"blue", h:"Confirm the fungus before the tablet", html:"Positive mycology (microscopy and culture) comes before an oral antifungal — clinical diagnosis alone is not enough given the treatment length and side effects. Sample technique is a common reason for a false negative: sample before treatment, remove varnish or artificial nails, clean the nail according to local laboratory instructions, remove superficial debris and obtain generous material from the active diseased area — usually proximal subungual debris or the underside of the affected nail, not merely the distal dead nail — in the laboratory-approved dry container or paper pack, not a swab. <b>A negative culture does not exclude fungus; review the technique and repeat the sample if suspicion is high, and consider PCR or PAS histology through specialist/laboratory pathways.</b>"},
    {tone:"blue", h:"The oil drop sign favours psoriasis over fungus", html:"A pink-salmon translucent discolouration of the nail bed that looks like a drop of oil under the nail is characteristic of psoriasis — more telling than onycholysis or subungual hyperkeratosis alone. If present, look for hidden psoriasis (hairline, natal cleft, umbilicus, ears) and ask about joints: nail disease is common in psoriatic arthritis and can come before the joint symptoms."},
    {tone:"cream", h:"Nail dystrophy in diabetes: assess the foot risk", html:"Onychomycosis can breach the skin barrier in a foot already compromised by neuropathy or ischaemia. Confirm and treat clinically significant onychomycosis where benefits outweigh harms (terbinafine 250 mg daily, usually 12–16 weeks for toenails — BAD 2014), assess diabetic foot risk with the NICE NG19 assessment and give nail/foot-care advice. Nail dystrophy alone does not define moderate/high risk and is not an indication for urgent specialist referral."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step takes 30 seconds and is the one that is skipped.",
  pathway:[
    {title:"Screen melanoma and hand-space infection", html:"A new or changing solitary pigmented band in an adult, or Hutchinson's sign → urgent dermatology referral (suspected cancer pathway). Acute paronychia with fluctuance → drainage; with Kanavel signs, a felon or lymphangitis → same-day hand surgery. New clubbing → investigate.", alert:true},
    {title:"Classify by pattern", html:"Colour (leukonychia, Terry's, Muehrcke's, melanonychia), texture (onycholysis, pitting, Beau's lines, koilonychia, splinter haemorrhages), infection (onychomycosis, paronychia, herpetic whitlow). <b>Distribution helps localise the differential but is not diagnostic</b> — correlate with skin, joint and systemic findings."},
    {title:"Examine all 20 nails and test appropriately", html:"<b>Nail plate, bed, folds, lunula and periungual skin</b> — plus nail clippings for mycology when systemic antifungal treatment is being considered; other tests (FBC and ferritin, TFTs, LFTs and albumin, CXR) only if clinically indicated by the examination."},
    {title:"Treat the confirmed diagnosis", html:"Mycology-positive dermatophyte onychomycosis → terbinafine (itraconazole for confirmed Candida or non-dermatophyte infection where appropriate). Psoriatic nails → treat the psoriasis. Koilonychia → correct the iron. Chronic paronychia → stop the wet work."},
    {title:"Review with the right clock", html:"Clinical improvement is slow — fingernails usually take several months and toenails often 9–18 months to grow out — so allow time before judging response. Melanonychia surveillance, LFT monitoring on terbinafine, and document the nail examination."}
  ],
  sections:[

    {id:"severe", nav:"Exclude first", title:"Red flags — malignancy, systemic disease and hand-space infection",
     sub:"A new or changing solitary pigmented nail in an adult is possible nail-unit melanoma until assessed, especially with a widening band or pigment spreading onto the nail fold.",
     blocks:[
       {b:"table", head:["Presentation","Suggests","Action"], rows:[
         ["Pigmented longitudinal band (melanonychia striata) + darkening + widening + irregular borders + Hutchinson's sign (pigment extending onto the nail fold or cuticle)","<b>Subungual melanoma</b> (also consider subungual squamous cell carcinoma). Hutchinson's sign is suspicious but not diagnostic — pseudo-Hutchinson sign and benign periungual pigmentation occur","Urgent dermatology referral (suspected cancer pathway) using clinical judgement and local pathway criteria. Photograph and measure if this does not delay referral. Do not biopsy or excise in primary care. Do not attribute to trauma or ethnic melanonychia without dermatology assessment in any adult with progressive nail pigmentation"],
         ["<b>Nail change + clubbing</b> (clinical examination teaching, not NG12 criteria: loss of the normal angle of about 160° at the nail fold, fluctuant nail base, increased longitudinal curvature)","Lung cancer, mesothelioma, bronchiectasis or interstitial lung disease, IBD, cyanotic heart disease, infective endocarditis, liver disease, cystic fibrosis — not equally likely; weigh smoking and respiratory symptoms","Aged 40 and over: consider an urgent direct-access CXR, normally within 2 weeks (NG12); younger patients — investigate according to clinical context. Fever with a murmur: same-day medical assessment for endocarditis (blood cultures and echocardiogram in hospital). Do not dismiss clubbing"],
         ["<b>Acute paronychia + spreading cellulitis + lymphangitis</b> (red streaking up the forearm) + fever + systemic illness","<b>Ascending infection or a deep hand-space infection</b>","Same-day hand surgery or 999 if septic. IV antibiotics in hospital. Surgical drainage if a deep space is involved — flexor tenosynovitis, Kanavel signs: fusiform swelling, flexed finger posture, pain on passive extension, tenderness along the flexor tendon sheath"],
         ["<b>Felon</b> — tense, throbbing swelling of the finger pulp","Closed-space infection of the pulp","Same-day hand surgery for drainage"],
         ["Nail dystrophy + dyspnoea + cough + effusions + yellow-green discolouration of all nails","<b>Yellow nail syndrome</b> — with lymphoedema, pleural effusion, bronchiectasis, chronic sinusitis","<b>CXR + spirometry + lymphoedema assessment + respiratory referral</b>"],
         ["White nails + hypoalbuminaemia + oedema + chronic illness","<b>Muehrcke's lines</b> (paired white transverse bands parallel to the lunula — hypoalbuminaemia) or <b>Terry's nails</b> (white with a narrow distal pink-brown band — cirrhosis, heart failure, type 2 diabetes, CKD)","<b>LFTs + albumin + renal function + urine protein, and NT-proBNP if heart failure is suspected</b>"],
         ["Rapidly progressing nail destruction + periungual erythema + tenderness on anti-VEGF or EGFR inhibitor therapy","Drug-induced paronychia or nail toxicity from targeted cancer therapy","Contact the oncology team the same day. Topical corticosteroid + antiseptic while awaiting advice. Dose modification is the oncologist's decision"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"purple", h:"Suspected cancer · NICE NG12 (updated April 2026) — melanoma", html:"NG12 does not contain nail-specific criteria. It supports suspected cancer pathway referral for a suspicious pigmented skin lesion scoring 3 or more on the weighted 7-point checklist (1.7.1) or where dermoscopy suggests melanoma (1.7.2) — <b>do not calculate the 7-point score as if it were validated for nail lesions.</b> Refer a suspicious or changing nail-unit lesion urgently using clinical judgement and local dermatology pathway criteria: new or changing solitary longitudinal melanonychia in an adult; widening, irregular or variegated pigmentation; pigment involving the nail fold or cuticle; nail-plate splitting, destruction, bleeding or a subungual nodule; unexplained persistent dystrophy of one nail; suspected subungual squamous cell carcinoma.", src:"NICE NG12 (updated April 2026) recs 1.7.1 and 1.7.2; PCDS nail disorders"},
         {tone:"purple", h:"NICE NG12 (updated April 2026) — finger clubbing and lung cancer", html:"Finger clubbing is one of the findings for which NG12 advises considering an urgent direct-access chest X-ray (normally within 2 weeks) to assess for lung cancer or mesothelioma in people aged 40 and over. Investigate younger patients according to clinical context. If the X-ray suggests lung cancer, or the clinical picture is highly suspicious, use the lung cancer suspected cancer pathway.", src:"NICE NG12 (updated April 2026) — lung and pleural cancers"},
         {tone:"red", h:"Hand-space infection", html:"Flexor tendon sheath infection (Kanavel signs), a felon or tense pulp-space infection, lymphangitis or rapidly spreading infection, systemic illness or sepsis, severe pain out of proportion, or suspected deep abscess, septic arthritis or osteomyelitis → same-day hand surgery / urgent surgical assessment (999 if septic). Do not manage a deep space infection with oral antibiotics alone.", src:"NICE NG141 (2019) cellulitis — refer if severe or systemically unwell"},
         {tone:"amber", h:"Drug-induced nail toxicity", html:"Painful periungual inflammation or pyogenic granuloma on an EGFR inhibitor or other targeted therapy → contact the oncology team the same day; do not stop the drug without them.", src:"SPC for the relevant EGFR inhibitor — paronychia listed as a common adverse effect"}
       ]},
       {b:"why", html:"Subungual melanoma is the most important life-threatening nail diagnosis to identify in primary care. It makes up a larger proportion of melanomas in people with darker skin, where acral lentiginous melanoma is relatively more common, and it usually presents in later adult life. The clinical challenge: benign longitudinal melanonychia is common in people with darker skin and can be entirely normal — the discriminating features are Hutchinson's sign, a band wider than 3 mm, irregular or blurred borders, several colours within the band, progressive widening or darkening, and nail dystrophy. The ABCDEF rule (Levit et al, J Am Acad Dermatol 2000): A (age — peak in later adulthood; African, Asian or Native American background), B (band — brown to black, width 3 mm or more, blurred borders), C (change in the band, or no improvement in a dystrophic nail despite treatment), D (digit — thumb, great toe or index finger; single digit more than several), E (extension of pigment onto the nail fold — Hutchinson's sign), F (family or personal history of melanoma or dysplastic naevi)."},
       {b:"why", html:"Beau's lines are one of the most useful retrospective signs in nail examination — transverse grooves caused by temporary cessation of nail matrix activity during significant systemic illness, severe nutritional deficiency or chemotherapy. Because nails grow at a fairly steady (though variable) rate, the distance of the line from the proximal nail fold gives a rough date for the precipitating illness, which can direct the history. <b>Multiple parallel lines indicate multiple separate insults.</b> Common causes: septicaemia, major surgery, severe infection, myocardial infarction, severe nutritional depletion and chemotherapy cycles."},
       {b:"dl", rows:[
         ["<b>NG12 — the criteria that apply here</b>","Two routes. Melanoma: NG12 has no nail-specific criteria and its weighted 7-point checklist is not validated for nail lesions — refer a suspicious or changing nail-unit lesion urgently using clinical judgement and local dermatology pathway criteria. Lung and pleural cancer: finger clubbing in someone aged 40 and over is a reason to consider an urgent direct-access chest X-ray, normally within 2 weeks; investigate younger patients according to clinical context. The current version is NICE NG12 (updated April 2026; accessed October 2026); the April 2026 amendments did not change the melanoma or lung recommendations. Restated in <a href='#refer'>Refer</a>"]
       ]}
     ]},

    {id:"differential", nav:"Differential", title:"Differential diagnosis — the common nail problems side by side",
     sub:"Most dystrophic nails are fungal, psoriatic or traumatic. The discriminating features below decide the next step.",
     blocks:[
       {b:"table", head:["Condition","Discriminating features","Next step"], rows:[
         ["<b>Onychomycosis</b>","Often toenails, asymmetric; yellow-brown discolouration, subungual hyperkeratosis and distal onycholysis spreading proximally; tinea pedis often present","Clippings for microscopy and culture before any oral antifungal"],
         ["<b>Nail psoriasis</b>","Several nails, often fingernails; irregular pitting, oil drop or salmon patch, onycholysis with a red-brown border; psoriasis elsewhere or joint symptoms","Look for skin and joint disease; treat the psoriasis. Clinical overlap with fungus is substantial — mycology when systemic antifungal treatment is being considered"],
         ["<b>Trauma</b>","Great toenails, footwear or sport history; subungual haematoma that grows out with the nail; no skin disease","Footwear advice; photograph and review a haematoma until it grows out"],
         ["<b>Subungual melanoma</b>","Single nail; brown-black band that widens or darkens; Hutchinson's sign; nail dystrophy","Urgent dermatology referral (clinical judgement and local pathway criteria)"],
         ["<b>Lichen planus</b>","Thinning, longitudinal ridging, splitting, pterygium; may have oral or skin lichen planus","Dermatology referral early — scarring is permanent"],
         ["<b>Chronic paronychia</b>","Swollen proximal nail fold, lost cuticle, wet-work history; nail ridging secondary to fold inflammation","Stop wet work, restore the cuticle barrier, topical corticosteroid; imidazole only if yeast involvement is suspected or documented"],
         ["<b>Yellow nail syndrome</b>","All nails yellow-green, thick, slow-growing, curved; lymphoedema; chest disease","CXR, spirometry, respiratory referral"],
         ["<b>Systemic signs</b>","All nails: koilonychia (iron), Terry's (liver, heart, kidney), Muehrcke's (albumin), Beau's lines (past illness), clubbing","Investigate the underlying disease"]
       ]}
     ]},

    {id:"confirm", nav:"Classify", title:"Classification — colour, texture and infection",
     blocks:[
       {b:"dl", rows:[
         ["<b>Colour changes</b>","<b>White (leukonychia):</b> superficial — trauma, fungal; <b>Terry's nails</b> (mostly white with a narrow distal pink-brown band) = liver cirrhosis, heart failure, type 2 diabetes, CKD; <b>Muehrcke's lines</b> (paired white transverse bands that do not move with growth, reflecting the nail bed not the plate) = hypoalbuminaemia, and they fade when the albumin is corrected; <b>half-and-half nails</b> (proximal white, distal red-brown) = CKD. <b>Yellow:</b> fungal onychomycosis (most common), yellow nail syndrome, psoriasis, nicotine staining. <b>Brown or black:</b> melanonychia — ethnic, drug-induced, benign naevus, melanoma (Hutchinson's sign); subungual haematoma (recent trauma, painful). <b>Blue or purple:</b> cyanosis, argyria, antimalarials, minocycline"],
         ["<b>Texture and structure</b>","<b>Onycholysis</b> (separation from the bed): psoriasis, thyroid disease, trauma, drugs (tetracyclines, including doxycycline — photo-onycholysis), fungal. <b>Pitting:</b> psoriasis (multiple irregular pits), alopecia areata (geometric, grid-like), eczema. <b>Beau's lines:</b> systemic illness, nutritional deficiency, chemotherapy. <b>Koilonychia</b> (spoon nails): iron deficiency anaemia (classic), haemochromatosis, Raynaud's. <b>Splinter haemorrhages:</b> infective endocarditis (proximal, with systemic features) versus trauma (distal and asymptomatic — much the commonest)"],
         ["<b>Infections</b>","<b>Onychomycosis</b> — the most common nail disorder; <b>Trichophyton rubrum</b> the commonest cause; patterns are distal lateral subungual (DLSO, commonest), white superficial, proximal subungual, endonyx and candidal. <b>Paronychia</b> — acute (bacterial, usually S. aureus) versus chronic (irritant and wet-work driven, often with secondary Candida). <b>Herpetic whitlow</b> — vesicular, extremely painful, HSV-1 or HSV-2"],
         ["<b>Onychomycosis patterns</b>","<b>DLSO (most common):</b> distal onycholysis, subungual hyperkeratosis and yellow-brown discolouration progressing proximally. <b>WSO:</b> white powdery nail plate surface (T. mentagrophytes, moulds). <b>PSO:</b> a white area proximally under an intact plate — associated with immunosuppression. <b>Endonyx:</b> diffuse milky white nail without onycholysis. <b>Total dystrophic:</b> complete destruction in long-standing disease. <b>Candidal:</b> especially immunocompromised, mixed with chronic paronychia"],
         ["<b>Mimics of onychomycosis</b>","<b>Psoriasis</b> (onycholysis + subungual hyperkeratosis + pitting + oil drop sign) · <b>trauma</b> (haematoma, mechanical) · <b>lichen planus</b> (thinning, longitudinal ridging, pterygium formation — the nail fold fused to the plate) · <b>eczema/contact dermatitis</b> (irregular pitting, plate thickening) · <b>chronic paronychia</b> · <b>bacterial “green nail”</b> (Pseudomonas) · <b>retronychia</b> · <b>onychotillomania</b> · <b>subungual squamous cell carcinoma</b> · <b>glomus tumour</b> · <b>onychomatricoma</b> · <b>yellow nail syndrome</b> · <b>drug-induced nail disease</b>"],
         ["<b>Psoriatic nail features</b>","<b>Pitting</b> (deeper and more irregularly distributed than the geometric pitting of alopecia areata) · <b>onycholysis with the oil drop sign</b> · <b>subungual hyperkeratosis</b> (thick friable material under the plate) · <b>salmon patch</b> · <b>red lunula</b> (rare). Nail disease is common in psoriatic arthritis and can precede or occur without skin psoriasis"]
       ]},
       {b:"why", html:"The psoriatic oil drop sign is one of the more telling findings in dermatology — a pink, salmon or yellowish-brown translucent discolouration of the nail bed, usually proximally, resembling a drop of oil beneath the nail. The pathological correlate is foci of parakeratosis in the nail bed epithelium, the same process as a psoriatic plaque. It is more characteristic of psoriasis than onycholysis or subungual hyperkeratosis alone. Where the diagnosis is uncertain between fungal and psoriatic, the oil drop sign should prompt a look for psoriasis at hidden sites (hairline, natal cleft, umbilicus, ears) and questions about the joints, since nail changes may precede joint disease. Nail psoriasis with onycholysis and pitting should not be treated with systemic antifungals — mycology should confirm or exclude concurrent fungal infection first."}
     ]},

    {id:"workup", nav:"Assess", title:"History, examination and investigations",
     blocks:[
       {b:"table", head:["Domain","Detail"], rows:[
         ["<b>History</b>","<b>Duration and progression</b> (sudden = trauma or illness; gradual = chronic disease or fungal) · <b>all nails or a single nail</b> (distribution helps localise the differential but is not diagnostic — fungal disease, psoriasis, trauma and drug effects can affect several or all nails, and systemic disease can be asymmetrical) · trauma (subungual haematoma) · skin and joint disease (psoriasis, eczema, lichen planus) · systemic disease (diabetes, thyroid, IBD, liver disease, CKD, connective tissue disease) · <b>occupation</b> (wet work, nail technician, chemical exposure, trauma, nail biting)"],
         ["<b>Drug history</b>","Tetracyclines (photo-onycholysis) · hydroxychloroquine (blue-brown nails) · anti-VEGF and EGFR inhibitors (paronychia) · chemotherapy (Beau's lines, onycholysis) · retinoids (thin nails). Also nail care — artificial and gel nails contribute to onycholysis and allergic contact dermatitis. Immunosuppression raises the risk of atypical fungal or bacterial nail infection"],
         ["<b>Examination — inspect all 20 nails systematically</b>","<b>Nail plate:</b> colour, surface texture (pitting, ridging, grooves), integrity. <b>Nail bed:</b> colour (cyanosis, Terry's, Muehrcke's), extent of onycholysis. <b>Lateral nail folds:</b> acute paronychia (swelling, pus), chronic paronychia (swelling, cuticle loss), <b>periungual pigmentation (Hutchinson's)</b>. <b>Lunula:</b> absent or red (red lunula in psoriasis and systemic disease). <b>Proximal nail fold: capillaroscopy</b> — dilated tortuous capillaries indicate connective tissue disease (systemic sclerosis, dermatomyositis). <b>Periungual:</b> tophi (gout). <b>Cuticle loss:</b> chronic paronychia, connective tissue disease. Also examine the scalp, flexures, natal cleft, elbows and knees for psoriasis; the feet, interdigital spaces and footwear; the joints (DIP joints, dactylitis, enthesitis); and diabetes-related foot risk where relevant"],
         ["<b>Investigations</b>","<b>Only if clinically indicated — directed by the phenotype and examination:</b> <b>nail clippings for mycology (microscopy and culture)</b> when systemic antifungal treatment is being considered · <b>dermoscopy</b> for melanonychia (nail unit dermoscopy requires training) · <b>FBC + ferritin</b> (koilonychia) · <b>TFTs</b> (onycholysis) · <b>LFTs + albumin</b> (Terry's, Muehrcke's) · <b>ANA and extractable nuclear antigens</b> only for capillaroscopy changes or features of connective tissue disease — not for common nail changes alone · <b>CXR</b> for clubbing · <b>HSV PCR swab</b> if a whitlow is uncertain · <b>pus for culture</b> when a paronychia is drained"]
       ]},
       {b:"warn", html:"Nail sampling technique matters, and poor technique is a common reason for a false-negative fungal culture. <b>(1) Obtain samples before oral antifungal treatment; remove nail varnish or artificial nails where possible, and clean the nail according to local laboratory instructions</b> (alcohol cleaning only if the receiving laboratory advises it). <b>(2) Remove superficial debris and obtain generous material from the active diseased area</b> — usually proximal subungual debris or the underside of the affected nail — not merely the distal dead nail. <b>(3) Include subungual debris</b> — this has the highest yield. (4) For white superficial onychomycosis, scrape the white material from the nail surface. <b>(5) Use the laboratory-approved dry container or paper pack, not a swab unless specifically requested</b> — swabs are unsuitable for nail. <b>(6) Send a generous amount of material.</b> Even with good technique, culture misses a proportion of true infections, so a negative culture does not exclude fungal nail disease — review the sampling technique and repeat the sample if suspicion stays high; consider PCR or PAS histology through specialist/laboratory pathways. Culture results take several weeks (BAD guideline, Ameen et al 2014)."}
     ]},

    {id:"ladder", nav:"Treat", title:"Onychomycosis, paronychia and nail psoriasis",
     blocks:[
       {b:"table", head:["Condition","Treatment"], rows:[
         ["<b>Onychomycosis — oral, mycology-confirmed</b>","<b>Terbinafine 250 mg once daily</b> — first-line for dermatophyte infection. <b>Fingernails 6 weeks; toenails 12–16 weeks</b> (BAD 2014). Before prescribing: confirm the organism and clinical diagnosis and check the current product SPC. <b>Avoid in active or chronic liver disease</b>; check alcohol history and other hepatotoxic medicines. <b>Baseline LFTs</b> and review at approximately 4–6 weeks for a standard course. Assess renal function; check pregnancy/breastfeeding status where relevant. <b>Stop and investigate promptly if there are symptoms or signs of liver injury</b> (jaundice, dark urine, pale stools, severe pruritus, persistent nausea, abdominal pain, fever or rash) <b>or clinically significant or worsening biochemical abnormalities</b>; seek specialist advice where appropriate. Terbinafine inhibits <b>CYP2D6</b> — check the complete current interaction list, particularly CYP2D6 substrates and inhibitors/inducers; review antidepressants, antipsychotics, beta-blockers, antiarrhythmics and other regular medicines. Warn about taste or smell disturbance, which can rarely persist, and that the nail may stay abnormal after eradication until it grows out. Specialist advice for children (GMMMG)"],
         ["<b>Itraconazole pulse therapy</b>","For <b>confirmed Candida or non-dermatophyte mould</b> infection where appropriate, or terbinafine failure. Non-dermatophyte moulds may be contaminants or secondary colonisers and a single positive culture is often insufficient — treatment is species-directed, after confirming clinical significance (usually repeat mycology) and with specialist or local antimicrobial advice. 200 mg twice daily for 7 days each month — 2 pulses for fingernails, 3 for toenails (BNF). More interactions than terbinafine (<b>CYP3A4</b> — statins, some anticoagulants, many others). <b>Avoid in heart failure or ventricular dysfunction</b> (SPC)"],
         ["<b>Topical antifungal</b>","For limited distal disease: BAD 2014 advises topical treatment alone only when less than 80% of the nail is affected and the lunula (matrix) is spared. <b>Follow the current GMMMG formulary and antimicrobial guidance: amorolfine 5% nail lacquer and other nail lacquers/paints are not routinely supported</b> (very limited evidence of effectiveness). If a topical is used on specialist advice, check the product SPC for the regimen and duration"],
         ["<b>Acute paronychia</b>","<b>Mild/localised without abscess:</b> warm soaks, local care and avoidance of trauma. <b>Systemic antibiotics only for</b> cellulitis, systemic illness, significant immunocompromise or selected high-risk cases — treat as cellulitis per NICE NG141 (2019): <b>flucloxacillin 500 mg four times daily for 5–7 days</b> (higher doses only where clinically justified, checked against current local guidance and documented), or clarithromycin 500 mg twice daily if penicillin-allergic. <b>Abscess/fluctuance:</b> drainage is the key treatment — incision and drainage — digital block and release of pus along the lateral nail fold, in primary care if trained or in an urgent treatment centre; culture the pus. Lymphangitis, severe infection, immunocompromise or failure to improve → specialist assessment"],
         ["<b>Herpetic whitlow</b>","Do NOT incise or drain — this spreads the virus. Consider early antiviral treatment (e.g. aciclovir), particularly for severe, extensive, recurrent or immunocompromised infection — verify dose, renal adjustment and duration against the current BNF/local antiviral protocol. Analgesia and a loose dressing. Consider bacterial superinfection or an alternative diagnosis if the presentation is atypical"],
         ["<b>Chronic paronychia</b>","Primarily an irritant/inflammatory disorder driven by wet work and chemical irritants; Candida may be secondary. <b>(1) Stop wet work and irritant exposure</b> (waterproof gloves with a cotton liner); <b>(2) protect and restore the cuticle</b> — do not cut or push it back; <b>(3) topical corticosteroid</b> for the inflammatory component; <b>(4) topical imidazole</b> (miconazole or clotrimazole) only where yeast/fungal involvement is suspected or documented, or on local dermatology advice. Refer if persistent, atypical, unilateral, destructive or diagnostically uncertain (dermatology — systemic treatment, nail fold surgery)"],
         ["<b>Nail psoriasis</b>","<b>Topical first-line:</b> a potent topical corticosteroid, or calcipotriol with betamethasone, to the proximal nail fold and under the free edge, for several months. Nails grow slowly — allow 6–12 months before assessing response. <b>Intralesional triamcinolone</b> into the proximal nail fold (dermatology). <b>Systemic and biologic treatment</b> — dermatology-initiated for severe or disabling nail disease or psoriatic arthritis (NICE CG153, 2012). CG153 does not give a detailed primary-care regimen for nail psoriasis — the topical options above follow dermatology practice"],
         ["<b>Koilonychia and systemic signs</b>","Treat the iron deficiency and find its cause — see the <a href='iron-deficiency-anaemia.html'>iron deficiency anaemia protocol</a>; continue iron for about 3 months after the haemoglobin normalises to replenish stores (BSG 2021). Koilonychia can lag for months behind the blood count because the new nail must grow out. <b>Proximal splinter haemorrhages with fever and a murmur:</b> same-day medical admission — blood cultures before antibiotics and echocardiography in hospital. <b>Distal splinters are usually benign</b> (trauma, manual work) — no investigation if isolated and the patient is well. <b>Terry's and Muehrcke's:</b> treat the underlying liver disease, nephrotic syndrome or malnutrition"]
       ]},
       {b:"why", html:"The herpetic whitlow distinction from bacterial paronychia is critical, because incising a herpetic whitlow worsens it and spreads the virus. Herpetic whitlow presents as multiple clusters of vesicles on an erythematous base with intense burning or throbbing pain disproportionate to the appearance, and without the central fluctuance of a bacterial abscess. The tell-tale features: vesicles rather than a single pointing abscess, absence of purulent exudate, and disproportionate pain. Risk groups: dental and medical workers, and patients with oral or genital herpes (autoinoculation). If uncertain, swab for HSV PCR and treat empirically with an antiviral while awaiting the result — do not perform incision and drainage."},
       {b:"why", html:"Lichen planus of the nails needs early dermatology referral to prevent permanent destruction — it affects a minority of people with lichen planus and can occur without skin or mucosal disease. Changes include thinning, brittleness, longitudinal ridging (onychorrhexis), fraying, loss of shine and — crucially — pterygium formation, the forward growth of the proximal nail fold over the plate caused by matrix scarring. Pterygium is permanent: once the matrix is scarred, no further nail grows in that area. Early specialist treatment with potent topical or intralesional corticosteroid, before scarring is established, is what prevents it."},
       {b:"why", html:"<b>Biologics have changed the outlook for severe nail psoriasis</b>, with response measured on the <b>NAPSI (Nail Psoriasis Severity Index)</b> — used in specialist settings when there is major functional or cosmetic impact or specifically targeted nail treatment; each nail is divided into quadrants and scored for matrix and nail bed features, giving 0–8 per nail (Rich and Scher, J Am Acad Dermatol 2003). Trials of anti-IL-17, anti-IL-23 and anti-TNF agents report meaningful nail improvement, but nail psoriasis responds more slowly than plaque psoriasis: the first 3–6 months of biologic treatment may show little nail change because the nail must physically grow out. Counselling patients about this lag prevents premature discontinuation of an effective treatment."}
     ]},

    {id:"lifestyle", nav:"Nail care", title:"Prevention, footwear and occupational exposure",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"🦶 Onychomycosis prevention", html:"Keep nails dry and trimmed short. Dry between the toes after bathing — moisture drives tinea pedis and secondary nail infection. Avoid walking barefoot in gym showers, pools and changing rooms. Change socks daily. Treat tinea pedis promptly: it is the usual reservoir for nail infection — a topical azole or terbinafine per BNF, continued until the skin has cleared. Antifungal powder in shoes can help prevent recurrence.", src:"BAD onychomycosis guideline (Ameen et al, 2014) — tinea pedis as reservoir; BNF topical antifungals"},
         {tone:"blue", h:"👟 Footwear", html:"Tight footwear causes trauma-induced onycholysis and subungual haematoma in the first and second toes. <b>Wide toe box, about 1 cm of space beyond the longest toe, low heel.</b> Ill-fitting running shoes cause repetitive microtrauma and nail dystrophy in runners. In diabetes, footwear advice is part of the foot assessment.", src:"NICE NG19 (current version) — foot assessment includes footwear"},
         {tone:"amber", h:"💧 Wet work and chronic paronychia", html:"Prolonged or frequent wet work is the commonest cause of chronic paronychia — healthcare workers, kitchen staff, cleaners, hairdressers, swimmers. Waterproof gloves with a cotton liner, emollient after work, and cuticle oil. <b>The cuticle is a biological barrier — do not trim or push it back</b>, a common nail salon practice that lets moisture and microorganisms into the nail fold.", src:"BAD onychomycosis guideline (2014) — chronic paronychia and Candida"},
         {tone:"amber", h:"💅 Artificial and gel nails", html:"Can cause onycholysis from filing and trapped moisture, chronic paronychia, and allergic contact dermatitis to (meth)acrylates — increasingly common, and relevant to later dental and medical adhesives. Patch testing if periungual dermatitis develops. Removal allows assessment of the underlying nail and resolution of inflammation."},
         {tone:"cream", h:"🩺 Diabetes and nail care", html:"In a person with diabetes and nail dystrophy, examine both feet and assess neuropathy (including a 10 g monofilament), pulses/ischaemia, callus, deformity, ulceration, infection, gangrene and Charcot arthropathy. <b>Confirm and treat clinically significant onychomycosis where benefits outweigh harms</b> (terbinafine 250 mg daily, 12–16 weeks for toenails) and give nail/foot-care advice. Refer according to diabetic-foot risk: moderate or high risk → foot protection service; an active diabetic foot problem → multidisciplinary foot service, generally within 1 working day; immediate acute referral for sepsis, limb ischaemia, gangrene or suspected deep soft-tissue or bone infection. Nail dystrophy alone is not an indication for urgent specialist referral. Assess the foot at diagnosis, annually, when a problem arises and on hospital admission.", src:"NICE NG19 (current version, recs 1.3.3–1.3.11); BAD onychomycosis guideline (2014)"},
         {tone:"cream", h:"🚭 Smoking", html:"Nicotine staining of the fingernails and periungual skin fades after stopping as the nail grows out. More importantly, smoking increases the risk of psoriasis, peripheral arterial disease and lung cancer (associated with clubbing). Offer stop-smoking support.", src:"NICE NG209 (2021) stop-smoking support"},
         {tone:"blue", h:"🔍 Nails as a window on systemic health", html:"<b>Opportunistic nail examination at chronic disease reviews:</b> koilonychia (iron deficiency), Terry's nails (liver disease, including in people who drink heavily), Beau's lines (recent significant illness), splinter haemorrhages, clubbing. Document the findings — a “nails normal” entry demonstrates proactive assessment.", src:"NICE NG12 (updated April 2026) — clubbing in the lung criteria"},
         {tone:"blue", h:"🗣️ What patients should watch for", html:"A new dark streak that is widening or spreading onto the skin → urgent review. New finger clubbing → GP for a chest X-ray. New pale nails with fatigue → blood test. Nail fold redness or visible dilated vessels with joint symptoms → review for connective tissue or psoriatic joint disease.", src:"NICE NG12 (updated April 2026); NICE CG153 (2012)"}
       ]},
       {b:"why", html:"The diabetic patient with onychomycosis may justify more proactive treatment than the “wait and see” approach often used in people without diabetes. In the diabetic foot the skin barrier in the toe webs and around the nail is already compromised by neuropathy (reduced protective sensation), microangiopathy (impaired healing) and dry, cracked skin. Onychomycosis adds a portal of entry for Staphylococcus aureus and gram-negative organisms that can progress to cellulitis, osteomyelitis and ultimately amputation. The NICE NG19 foot assessment includes the nails, so annual reviews should identify onychomycosis, confirm it with mycology and treat clinically significant disease where benefits outweigh harms rather than dismissing it as cosmetic — while recognising that nail dystrophy alone does not define moderate or high foot risk."}
     ]},

    {id:"monitor", nav:"Review", title:"Follow-up, monitoring and surveillance",
     sub:"Nails grow slowly — response is judged in months, not weeks.",
     blocks:[
       {b:"table", head:["What","Detail"], rows:[
         ["<b>Onychomycosis monitoring</b>","Baseline LFTs before oral terbinafine and review at approximately 4–6 weeks for a standard course (SPC/local policy). Stop and investigate promptly for symptoms or signs of liver injury (jaundice, dark urine, pale stools, severe pruritus, persistent nausea, abdominal pain, fever or rash) or clinically significant or worsening LFTs. Review at completion: mycological cure and clinical cure (normal appearance may take additional months as the new nail grows out). Reassess the diagnosis if there is no proximal healthy nail growth after an appropriate interval. Recurrence is common, and re-treatment should follow repeat mycology"],
         ["<b>Melanonychia surveillance</b>","Where specialist assessment has judged a band benign: photograph and measure every 3–6 months. Return urgently if the width increases, borders become irregular, Hutchinson's sign appears, colour becomes heterogeneous, or nail dystrophy develops. Any new pigmented band in an adult: photograph, measure, dermoscopy if available, and refer if there is any concern. If a patient declines a suspected cancer pathway referral, document the discussion and the safety-net"],
         ["<b>Psoriatic nail review</b>","At 3–6 months: clinical assessment and functional impact (NAPSI in specialist settings). If topical treatment is inadequate → dermatology for intralesional steroid or systemic treatment. <b>Screen for psoriatic arthritis</b> (NICE CG153 recommends annual screening with the PEST questionnaire in people with psoriasis) — ask about DIP joint pain, early morning stiffness and dactylitis; PEST does not detect axial arthritis or inflammatory back pain, so ask about these separately"],
         ["<b>Systemic nail signs</b>","Terry's nails and Muehrcke's lines: follow the underlying condition's monitoring. Beau's lines: document, date the illness, review at about 6 months (fingernail lines should have grown out). Clubbing: re-examine at reviews and repeat the chest X-ray if new chest symptoms develop or clubbing progresses"],
         ["<b>Fungal nail review</b>","Review at 3–6 months — response is slow. Reassess if there is no improvement or the diagnosis is uncertain"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 999 / same-day", html:"Flexor tenosynovitis (Kanavel signs), a felon or tense pulp-space infection, severe pain out of proportion, or suspected deep abscess, septic arthritis or osteomyelitis → hand surgery same day · spreading cellulitis with lymphangitis from a paronychia, or systemic illness → same-day assessment for IV antibiotics.", src:"NICE NG141 (2019) cellulitis — severity and referral"},
         {tone:"purple", h:"🟣 Suspected cancer · NICE NG12 (updated April 2026)", html:"A new or changing solitary pigmented band in an adult · widening, irregular or variegated pigment · Hutchinson's sign (suspicious, not diagnostic) · nail-plate destruction, bleeding or a subungual nodule · dermoscopy suggesting melanoma → urgent dermatology referral (suspected cancer pathway) on clinical judgement — the weighted 7-point checklist is not validated for nail lesions.", src:"NICE NG12 (updated April 2026) recs 1.7.1 and 1.7.2"},
         {tone:"amber", h:"🟠 Don't dismiss", html:"<b>New clubbing → investigate: consider an urgent direct-access chest X-ray (normally within 2 weeks) if 40 or over; younger patients according to clinical context; onward as indicated.</b>", src:"NICE NG12 (updated April 2026) — lung cancer"},
         {tone:"green", h:"📋 Document it", html:"The nail examination takes about 30 seconds — inspect hands and feet systematically at relevant chronic disease reviews and record the findings.", src:"NICE NG19 (current version) — foot assessment at diagnosis, annually, when a problem arises and on hospital admission"}
       ]},
       {b:"why", html:"Documenting nail examination findings at chronic disease reviews is a simple quality and medicolegal standard. GPs performing annual diabetic foot checks, heart failure, COPD and IBD reviews are expected to examine relevant physical signs including the nails. A note stating “nails: koilonychia noted for first time — ferritin requested” demonstrates appropriate clinical observation. Conversely, a review note that does not mention nail examination, where the patient subsequently presents with a subungual melanoma that was present at the time, is hard to defend."},
       {b:"say", html:"Most nail problems are either fungal or related to psoriasis, and both are treatable — but I do not want to start you on months of tablets without first confirming what it is, so I am going to take some nail clippings. The one thing I always check for is a dark streak in a single nail, particularly if it is widening or the colour is spreading onto the skin at the base, because that needs a specialist opinion quickly. Whatever we treat, be patient with it: nails grow slowly, especially toenails, so it takes many months — often a year or more for toenails — before the new nail grows out and we can judge whether treatment has worked."}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999 / same-day hand surgery", html:"Acute paronychia with flexor tenosynovitis (Kanavel signs — fusiform swelling, flexed posture, pain on passive extension, flexor sheath tenderness) · a felon or tense pulp-space infection · lymphangitis or rapidly spreading infection · systemic illness or sepsis · severe pain out of proportion · suspected deep abscess, septic arthritis or osteomyelitis. Do not manage suspected deep-space infection with oral antibiotics alone.", src:"NICE NG141 (2019) cellulitis — refer if severe or systemically unwell"},
         {tone:"purple", h:"Urgent dermatology referral — suspected nail-unit malignancy", html:"NG12 has no nail-specific criteria (its weighted 7-point checklist and dermoscopy criteria are for pigmented skin lesions) — refer a suspicious or changing nail-unit lesion urgently on clinical judgement and local pathway criteria: new or changing solitary longitudinal melanonychia in an adult · widening, irregular or variegated pigmentation · pigment involving the nail fold or cuticle (Hutchinson's sign) · nail-plate splitting, destruction, bleeding or a subungual nodule · unexplained persistent dystrophy of one nail · suspected subungual squamous cell carcinoma. Photograph and measure if this does not delay referral; do not biopsy or excise in primary care.", src:"NICE NG12 (updated April 2026) recs 1.7.1 and 1.7.2; PCDS nail disorders"},
         {tone:"purple", h:"NICE NG12 (updated April 2026) — clubbing", html:"Aged 40 and over with finger clubbing: consider an urgent direct-access chest X-ray, normally within 2 weeks, to assess for lung cancer or mesothelioma (investigate younger patients according to clinical context); use the lung suspected cancer pathway if the X-ray suggests cancer.", src:"NICE NG12 (updated April 2026) — lung and pleural cancers"},
         {tone:"amber", h:"Dermatology (urgent or routine)", html:"Lichen planus of the nails (pterygium formation — early treatment prevents permanent damage) · yellow nail syndrome · drug-induced nail toxicity (anti-VEGF, EGFR, with oncology) · nail biopsy needed · chronic paronychia not responding to topical treatment · diagnostic uncertainty after negative mycology.", src:"BAD onychomycosis guideline (2014); NICE CG153 (2012)"},
         {tone:"blue", h:"Rheumatology", html:"Psoriatic nail changes with joint symptoms (psoriatic arthritis) · capillaroscopy changes at the proximal nail fold (systemic sclerosis, dermatomyositis) · nail changes with systemic autoimmune features.", src:"NICE CG153 (2012) — refer suspected psoriatic arthritis to rheumatology"},
         {tone:"green", h:"Podiatry or foot protection service", html:"<b>People with diabetes</b> — route by NG19 risk: moderate or high risk (neuropathy, ischaemia, deformity, callus, previous ulceration) → foot protection service; an active foot problem → multidisciplinary foot service, generally within 1 working day, or acute services if limb- or life-threatening. Nail dystrophy alone is not an indication for urgent referral.", src:"NICE NG19 (current version)"},
         {tone:"cream", h:"GP management (the majority)", html:"Onychomycosis: confirm with mycology then terbinafine (or itraconazole for confirmed Candida/non-dermatophyte infection), per GMMMG guidance; nail lacquers not routinely supported. Acute paronychia: warm soaks and local care, drainage if fluctuant; antibiotics only for cellulitis or systemic illness. Chronic paronychia: stop wet work, protect the cuticle, topical corticosteroid (imidazole only if yeast involvement is suspected). Koilonychia: treat and investigate the iron deficiency. Splinter haemorrhages without systemic features: reassurance and review.", src:"BAD onychomycosis guideline (2014); BNF"}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 62-year-old asks for “something for fungal toenails”, having tried an over-the-counter lacquer for a year. On examining all twenty nails you find thickened yellow great toenails — and, incidentally, a 4 mm brown longitudinal band in the right thumbnail that he says has been “there a while but looks darker”, with faint pigment at the cuticle. He has type 2 diabetes.", src:"NICE NG12 (updated April 2026) — melanoma"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Examines all 20 nails rather than only the presenting complaint — which is how the thumb band is found; <b>recognises Hutchinson's sign and refers on the suspected cancer pathway rather than reassuring</b>; takes clippings for mycology before prescribing terbinafine, and knows clinical diagnosis alone is insufficient; <b>checks for liver disease, baseline LFTs, renal function and the full interaction list (including CYP2D6)</b>; treats the diabetes as raising the stakes — portal of entry for cellulitis and osteomyelitis, so a foot assessment and podiatry as the risk level indicates; and — the step candidates miss — sets a realistic expectation for response (toenails often 9–18 months to grow out), and documents the nail examination findings.", src:"BAD onychomycosis guideline (2014); NICE NG19 (current version)"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (updated April 2026; accessed October 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — melanoma 1.7.1 (weighted 7-point checklist score 3 or more) and 1.7.2 (dermoscopy suggests melanoma), for pigmented skin lesions — NG12 has no nail-specific criteria; lung and pleural cancer recommendations that include finger clubbing as a reason to consider an urgent direct-access chest X-ray in people aged 40 and over</span></li>'+
         '<li><b>Ameen M et al. British Association of Dermatologists guidelines for the management of onychomycosis 2014. Br J Dermatol 2014;171:937–58</b><br><a href="https://doi.org/10.1111/bjd.13358" rel="noopener">doi:10.1111/bjd.13358</a> · <a href="https://pubmed.ncbi.nlm.nih.gov/25409999/" rel="noopener">PubMed 25409999</a><span class="rd"> — mycological confirmation and sampling, terbinafine 6 weeks (fingernails) and 12–16 weeks (toenails), topical treatment alone only if under 80% of the nail with the lunula spared. Now dated: check evidence and licensing against current local guidance and the product SPC</span></li>'+
         '<li><b>Current UK SPCs — terbinafine 250 mg tablets; itraconazole capsules</b><br><a href="https://www.medicines.org.uk/emc/search?q=terbinafine%20250%20mg%20tablets" rel="noopener">emc: terbinafine 250 mg tablets</a> · <a href="https://www.medicines.org.uk/emc/search?q=itraconazole%20capsules" rel="noopener">emc: itraconazole capsules</a><span class="rd"> — contraindications, hepatic warnings, renal impairment, interactions, pregnancy and breastfeeding, adverse effects and monitoring (baseline LFTs and review at about 4–6 weeks for terbinafine; itraconazole and heart failure). Use the SPC for the exact formulation prescribed</span></li>'+
         '<li><b>Greater Manchester Medicines Management Group — Greater Manchester Antimicrobial Guidelines (October 2024) and GMMMG Formulary: Infections</b><br><a href="https://gmmmg.nhs.uk" rel="noopener">gmmmg.nhs.uk</a> · <a href="https://www.greatermanchesterformulary.nhs.uk" rel="noopener">greatermanchesterformulary.nhs.uk</a><span class="rd"> — laboratory confirmation before treatment; terbinafine preferred for dermatophytes; itraconazole for confirmed Candida or non-dermatophyte infection; specialist advice for children; amorolfine 5% and other nail lacquers not routinely prescribed</span></li>'+
         '<li><b>Primary Care Dermatology Society — Nail disorders</b><br><a href="https://www.pcds.org.uk/clinical-guidance/nails" rel="noopener">pcds.org.uk</a><span class="rd"> — nail-unit melanoma and other nail-unit malignancy, mimics of onychomycosis</span></li>'+
         '<li><b>NICE NG19 — Diabetic foot problems: prevention and management (current version, accessed October 2026), recommendations 1.3.3–1.3.11</b><br><a href="https://www.nice.org.uk/guidance/ng19" rel="noopener">nice.org.uk/guidance/ng19</a><span class="rd"> — foot assessment at diagnosis, annually, when a problem arises and on admission, including a 10 g monofilament test; risk stratification; moderate/high risk to foot protection services; active foot problems to the multidisciplinary foot service, generally within 1 working day</span></li>'+
         '<li><b>NICE CG153 — Psoriasis: assessment and management (2012, updated 2017)</b><br><a href="https://www.nice.org.uk/guidance/cg153" rel="noopener">nice.org.uk/guidance/cg153</a><span class="rd"> — annual psoriatic arthritis screening with PEST (which does not detect axial arthritis or inflammatory back pain), rheumatology referral for suspected psoriatic arthritis, NAPSI in specialist settings, and specialist systemic and biologic treatment; no detailed primary-care regimen for nail psoriasis</span></li>'+
         '<li><b>NICE NG141 — Cellulitis and erysipelas: antimicrobial prescribing (2019)</b><br><a href="https://www.nice.org.uk/guidance/ng141" rel="noopener">nice.org.uk/guidance/ng141</a><span class="rd"> — antibiotic choice where a paronychia is complicated by spreading cellulitis, and when to refer</span></li>'+
         '<li><b>British Society of Gastroenterology — guidelines for the management of iron deficiency anaemia in adults (Snook et al, Gut 2021)</b><span class="rd"> — continue iron for about 3 months after the haemoglobin normalises</span></li>'+
         '<li><b>Levit EK et al. The ABC rule for clinical detection of subungual melanoma. J Am Acad Dermatol 2000</b><span class="rd"> — the ABCDEF features of subungual melanoma</span></li>'+
         '<li><b>Rich P, Scher RK. Nail Psoriasis Severity Index. J Am Acad Dermatol 2003</b><span class="rd"> — the NAPSI score, 0–8 per nail</span></li>'+
         '<li><b>NICE NG209 — Tobacco: preventing uptake, promoting quitting and treating dependence (2021)</b><br><a href="https://www.nice.org.uk/guidance/ng209" rel="noopener">nice.org.uk/guidance/ng209</a><span class="rd"> — stop-smoking support</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — terbinafine, itraconazole (pulse regimen), amorolfine, flucloxacillin, clarithromycin, aciclovir, topical corticosteroids and calcipotriol with betamethasone: doses and interactions</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Nail disorders — NICE NG12 (updated April 2026), the British Association of Dermatologists onychomycosis guideline (2014), NICE NG19 (diabetic foot), NICE CG153 (psoriasis), NICE NG141 (cellulitis), GMMMG antimicrobial guidance and formulary, PCDS nail guidance, the product SPCs and the BNF. A new or changing solitary pigmented nail in an adult is possible nail-unit melanoma until assessed, and mycological confirmation is required before any oral antifungal. Fungal skin infection elsewhere is covered by the <a href=\"fungal-skin-infection.html\">fungal skin infection protocol</a>. Verify all doses and interactions against the current BNF before prescribing."
});
