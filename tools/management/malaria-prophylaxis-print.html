<script>
MG.render({
  icon:"🦟",
  title:"Malaria Prophylaxis",
  eyebrow:"Protocol · pre-travel advice and the returning traveller",
  stemTitle:"Malaria prevention — the tablets are the third letter, not the first",
  stemSub:"Most UK malaria deaths are avoidable, and most failures are not about the choice of drug: the traveller did not know the risk, stopped the tablets on the plane home, was bitten every evening, or had a fever that nobody tested. The UK Malaria Expert Advisory Group (UKMEAG, formerly ACMP) builds its annual guidance around four letters — Awareness of risk, Bite prevention, Chemoprophylaxis, and prompt Diagnosis and treatment. This page follows those letters and the 2026 edition. UKHSA UKMEAG Malaria prevention guidelines for travellers from the UK (2026) · MHRA Drug Safety Update (2013) · BNF and BNFC · Health Protection (Notification) Regulations 2010.",
  guideline:"UKHSA UKMEAG Malaria prevention guidelines for travellers from the UK (2026 edition, June 2026) · MHRA Drug Safety Update, mefloquine (2013) · BNF and BNFC · UK malaria treatment guidelines (J Infect 2016) · Health Protection (Notification) Regulations 2010",
  meta:[
    {t:"UKHSA UKMEAG malaria prevention guidelines · 2026"},
    {t:"MHRA DSU · mefloquine neuropsychiatric warnings"},
    {t:"BNF and BNFC · antimalarial doses"},
    {t:"Notifiable disease · statutory duty", tone:"tw"}
  ],
  lead:"<div class='mg-layers'><a href='#fever'><b>Fever after travel</b><small>Malaria until proven otherwise</small></a><a href='#risk'><b>A · Awareness</b><small>Destination and traveller</small></a><a href='#bites'><b>B · Bites</b><small>DEET up to 50%</small></a><a href='#drugs'><b>C · Chemoprophylaxis</b><small>Start, stop, contraindications</small></a><a href='#special'><b>Special groups</b><small>Pregnancy, children, epilepsy</small></a></div>",
  quickSub:"The six points that change what you do. Every figure traces to a source listed under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"Fever after travel is malaria until proven otherwise", html:"Any fever or compatible systemic illness during travel or after return from a malaria-risk area requires <b>urgent same-day malaria testing</b> and discussion with the receiving laboratory or acute medical team: malaria antigen rapid diagnostic test where available, thick and thin blood films for parasite detection and speciation, and FBC, renal function, liver tests and glucose as clinically indicated. UKMEAG asks clinicians to consider malaria in every ill patient who has returned from the tropics in the <b>previous year</b>, especially the <b>previous 3 months</b> — and it can present considerably later, particularly with <i>P. vivax</i> and <i>P. ovale</i>. Do not wait for fever spikes. If the first test is negative but suspicion remains, repeat according to the local laboratory or hospital protocol, commonly over the next 24–48 hours.", src:"UKHSA UKMEAG guidelines 2026 — Diagnosis"},
    {tone:"amber", h:"Match the drug to the destination — check the country table every time", html:"Resistance patterns and recommendations change. Look up the current UKMEAG country recommendations (reproduced on TravelHealthPro by NaTHNaC) for the exact itinerary — including rural or border areas, season and length of stay — before choosing a drug or deciding that bite prevention alone is enough.", src:"UKHSA UKMEAG guidelines 2026 — Country recommendations"},
    {tone:"blue", h:"The three main options and their timings", html:"<b>Atovaquone-proguanil</b>: one adult tablet daily with food or a milky drink, start 1–2 days before, continue <b>7 days</b> after leaving. <b>Doxycycline 100 mg daily</b>: start 1–2 days before, continue <b>4 weeks</b> after. <b>Mefloquine 250 mg weekly</b>: start 2–3 weeks before (to test tolerance), continue <b>4 weeks</b> after. Children’s doses are weight-based — use the current UKHSA weight-band table or BNFC; do not rely on partial dose lists.", src:"UKHSA UKMEAG guidelines 2026 — Chemoprophylaxis · BNF"},
    {tone:"red", h:"Mefloquine: screen for psychiatric history — every time", html:"Do not use mefloquine prophylaxis in anyone with current or previous depression, generalised anxiety disorder, psychosis, suicidal thoughts or attempts, self-harm, another psychiatric disorder, or a history of seizures. Use the current prescriber checklist and provide the patient alert card. Ask about previous reactions to mefloquine, vestibular symptoms or significant balance disorder, cardiac disease and QT-prolonging drugs; avoid with amiodarone. If neuropsychiatric, vestibular or significant mental-state symptoms develop, stop taking mefloquine and seek urgent medical advice about an alternative preventive regimen — do not simply remain without prophylaxis.", src:"MHRA Drug Safety Update, mefloquine (2013) · Lariam SPC"},
    {tone:"green", h:"Bite prevention works for every traveller", html:"<b>DEET-based repellent up to 50%</b> is suitable in pregnancy, breastfeeding and for infants over 2 months. Apply sunscreen first and repellent afterwards. Use according to the product instructions, avoiding eyes, mouth, mucous membranes and damaged skin; a higher DEET concentration mainly prolongs duration rather than proportionally increasing efficacy. Sleep under an insecticide-treated net unless the room is screened or air-conditioned, and cover up, especially from dusk to dawn — and through the day where daytime-biting mosquitoes (e.g. dengue) are a risk. Repellent is not a substitute for clothing, screens, nets and air conditioning. Icaridin 20% and Eucalyptus citriodora oil (hydrated, cyclized) are alternatives.", src:"UKHSA UKMEAG guidelines 2026 — Bite prevention"},
    {tone:"purple", h:"Malaria is notifiable — the doctor’s duty", html:"The registered medical practitioner should notify <b>suspected</b> malaria to the proper officer, normally via the local UKHSA Health Protection Team (Greater Manchester HPT for Bolton) or the local notification route. Follow the current UKHSA reporting instructions. Laboratories notify separately on confirmation — do not wait for laboratory confirmation.", src:"Health Protection (Notification) Regulations 2010 · UKHSA notifiable diseases guidance"}
  ],
  pathwaySub:"Four letters and a safety net. The last step is the one that saves lives.",
  pathway:[
    {title:"A — Awareness of risk", html:"Where exactly (countries and areas, urban/rural/border, altitude, several countries?), season, for how long, how they will live (rural, camping, cruise, city hotel), likely access to medical care, and why (holiday, business, visiting friends and relatives). Who is travelling: age and weight, pregnancy or plans for it, breastfeeding, epilepsy or seizures, psychiatric history, renal or hepatic disease, asplenia, immunosuppression, current medicines (particularly warfarin, antiepileptics, amiodarone and QT-prolonging medicines), previous antimalarial intolerance. Check the current UKMEAG/TravelHealthPro country advice each time."},
    {title:"B — Bite prevention", html:"DEET up to 50% (sunscreen first, repellent on top), insecticide-treated bed nets, covering up especially from dusk to dawn (and by day where daytime-biting mosquitoes are a risk), screened or air-conditioned rooms, appropriately treated clothing. The same advice protects against dengue and other mosquito-borne infections for which there are no tablets."},
    {title:"C — Chemoprophylaxis", html:"Choose an agent the destination needs and the traveller can take: atovaquone-proguanil, doxycycline or mefloquine. Explain start and stop dates in writing. The commonest failure is stopping early after return — especially the 4-week tail for doxycycline and mefloquine."},
    {title:"D — Diagnose promptly", html:"Any fever during travel or in the year after return (or later — especially <i>P. vivax</i> and <i>P. ovale</i>): same-day malaria test and say where you have been. For remote travel more than 24 hours from medical care, emergency standby treatment may be added to prophylaxis after specialist or experienced travel-medicine assessment."},
    {title:"Safety net for the returning traveller", html:"<b>Fever after travel = same-day malaria films or RDT.</b> Negative but still suspected → repeat per the local laboratory protocol. Severe features (confusion, reduced consciousness, jaundice, breathlessness, bleeding, low urine output, hypoglycaemia, severe anaemia, unable to take or absorb oral treatment) → immediate admission; do not delay transfer awaiting results. Notify on suspicion.", alert:true}
  ],
  sections:[
    {id:"fever", nav:"Fever after travel", title:"The returning traveller with a fever", sub:"This is where malaria kills in the UK. Chemoprophylaxis reduces the risk; it never removes it.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Fever or flu-like illness after a malaria area", html:"Treat as malaria until excluded. <b>Urgent same-day</b> malaria testing — malaria antigen RDT where available, plus thick and thin blood films for parasite detection and speciation, with FBC, renal function, liver tests and glucose as clinically indicated — arranged with the receiving laboratory or acute medical team, telling them the travel history. Consider malaria in any unwell patient who has returned from the tropics in the previous year, and especially in the previous 3 months; it can present considerably later, particularly with <i>P. vivax</i> and <i>P. ovale</i>. Falciparum malaria can deteriorate within hours.", src:"UKHSA UKMEAG guidelines 2026 — Diagnosis"},
         {tone:"red", h:"🔴 Severe or complicated malaria features", html:"Impaired consciousness or confusion, seizures, jaundice, breathlessness, pulmonary oedema/ARDS, metabolic acidosis or acidotic breathing, hypoglycaemia, severe anaemia, spontaneous bleeding, acute kidney injury or reduced urine output, shock, parasitaemia with clinical deterioration, or inability to take or absorb oral treatment → <b>emergency admission</b>. Suspected severe malaria is a medical emergency: arrange immediate hospital admission, tell the receiving team malaria is suspected, and do not delay transfer while awaiting confirmatory results — never manage it in primary care awaiting outpatient testing. Children may present with non-specific illness, drowsiness or poor feeding.", src:"UK malaria treatment guidelines, Lalloo DG, et al., J Infect 2016"},
         {tone:"amber", h:"🟠 One negative test does not exclude malaria", html:"A single negative film or RDT does not exclude malaria. If the initial test is negative but suspicion remains, arrange repeat malaria testing according to the local laboratory or hospital protocol, commonly with repeat films over the next 24–48 hours. Do not wait for periodic fever: the textbook pattern is often absent, especially with falciparum.", src:"UKHSA UKMEAG guidelines 2026 — Diagnosis · UK malaria treatment guidelines, J Infect 2016"},
         {tone:"amber", h:"🟠 Prophylaxis taken ≠ malaria excluded", html:"No regimen is 100% protective, and partial prophylaxis can delay and blur the presentation. Taking tablets correctly makes malaria less likely; it does not remove the need to test.", src:"UKHSA UKMEAG guidelines 2026 — General issues"},
         {tone:"purple", h:"⚖️ Notify on suspicion", html:"Malaria is a notifiable disease. The registered medical practitioner should notify suspected malaria to the proper officer, normally via the local UKHSA Health Protection Team or the local notification route, following current UKHSA reporting instructions — without waiting for laboratory confirmation. The laboratory notifies separately on confirmation.", src:"Health Protection (Notification) Regulations 2010 · UKHSA notifiable diseases guidance"}
       ]},
       {b:"why", html:"<b>Why ‘within a year’?</b> Falciparum malaria usually presents within weeks of return, but prophylaxis can lengthen the interval, and <i>P. vivax</i> and <i>P. ovale</i> can relapse from dormant liver stages months later — and malaria can present considerably later than a year. A remote history of travel to a malaria-endemic area remains relevant, especially where the clinical picture is unexplained. The cases that go wrong are the ones where nobody asked about travel. Put it in the safety-net for every traveller and in the history for every febrile adult."}
     ]},

    {id:"risk", nav:"A · Awareness", title:"A — Assessing the risk: destination and traveller", sub:"The same drug is not right for the same country for every traveller.",
     blocks:[
       {b:"table", head:["Ask about","Why it matters","What changes"], rows:[
         ["<b>Exact itinerary</b>","Risk varies within countries (rural versus urban, border areas, altitude) and by season","Use the current UKMEAG country recommendations; some areas need bite prevention only"],
         ["<b>Length of stay</b>","Cumulative exposure; adherence falls on long trips","Long-stay options and drug duration limits (see Special groups)"],
         ["<b>Visiting friends and relatives</b>","Travellers who grew up in endemic countries often believe they are immune; immunity wanes quickly after leaving","Explain the loss of immunity; same prophylaxis as other travellers"],
         ["<b>Pregnancy, plans for pregnancy, breastfeeding</b>","Malaria is more severe in pregnancy; drug choice narrows","Advise against travel to high-risk areas if possible; see Special groups"],
         ["<b>Psychiatric history or seizures</b>","Mefloquine contraindicated; chloroquine unsuitable in epilepsy","Atovaquone-proguanil or doxycycline"],
         ["<b>Renal function</b>","Avoid atovaquone-proguanil for prophylaxis in severe renal impairment as specified in the current product information","Choice depends on destination, contraindications and interactions — seek specialist travel advice if renal impairment limits the standard options"],
         ["<b>Asplenia or severe immunosuppression</b>","Higher risk of severe malaria, which may deteriorate rapidly","Specialist travel-health advice before travel; rigorous adherence; fever after travel → urgent hospital assessment"],
         ["<b>Current medicines</b>","Mefloquine with amiodarone is contraindicated; check QT-prolonging medicines and cardiac disease; antimalarials interact with warfarin and antiepileptics","Check the BNF interaction entries; on warfarin, agree a monitoring plan with the anticoagulation service"],
         ["<b>Previous antimalarial experience</b>","Tolerability and adherence","Use what worked if it suits the destination"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"📋 Use the UKMEAG template", html:"The guidelines include a template for recording the risk assessment and the advice given (Appendix 2). Recording the itinerary, the drug, the start and stop dates and the fever advice protects the patient and the clinician.", src:"UKHSA UKMEAG guidelines 2026 — Appendix 2"},
         {tone:"cream", h:"🌿 Homeopathic ‘prophylaxis’ does not work", html:"There is no evidence that homeopathic remedies prevent malaria, and UKHSA advises against them. Travellers who rely on them are unprotected.", src:"UKHSA — Malaria: homeopathic remedies"}
       ]}
     ]},

    {id:"bites", nav:"B · Bites", title:"B — Bite prevention", sub:"Anopheles mosquitoes bite mainly between dusk and dawn, but mosquitoes that spread dengue and other infections bite by day, so avoidance may need to continue throughout the day. Layers of protection work better than any single measure.",
     blocks:[
       {b:"tiles", v:"life", items:[
         {t:"🧴 DEET up to 50%", html:"The UKMEAG first choice. Suitable in pregnancy and breastfeeding and for infants over 2 months (seek advice under 2 months). Use according to the product instructions; avoid eyes, mouth, mucous membranes and damaged skin. Higher concentrations mainly prolong duration rather than proportionally increasing efficacy. Wash off the hands and breast skin before handling or feeding a baby."},
         {t:"☀️ Sunscreen first", html:"Apply sunscreen, then the repellent on top. UKMEAG suggests SPF 30–50 to allow for DEET reducing sunscreen effect. Sunscreen is not needed from dusk to dawn."},
         {t:"🌿 Alternatives", html:"Icaridin 20% gives protection comparable to DEET 20%. Eucalyptus citriodora oil (hydrated, cyclized) is the only plant-based active UKMEAG recommends — it may have age restrictions and needs more frequent reapplication."},
         {t:"🛏️ Nets", html:"An insecticide (pyrethroid)-treated bed net, tucked in, unless the room is screened or air-conditioned. Treated nets protect even where skin touches the net."},
         {t:"👕 Clothing", html:"Long sleeves and trousers from dusk; clothing can be treated with permethrin — do not apply permethrin clothing-treatment products directly to skin. Repellent is not a substitute for covering clothing, screens, nets and air conditioning."},
         {t:"🚫 What does not work", html:"Electronic buzzers, vitamin B1, garlic and homeopathic remedies have no useful protective effect."}
       ]},
       {b:"why", html:"<b>Why bite prevention first?</b> It is the only measure that also protects against dengue, chikungunya and other infections without a vaccine or tablet, and it reduces the dose of malaria parasites the tablets have to deal with. Pregnant women are more attractive to mosquitoes, which makes it even more important in pregnancy (UKMEAG 2026)."}
     ]},

    {id:"drugs", nav:"C · Chemoprophylaxis", title:"C — Choosing and using chemoprophylaxis", sub:"Adult doses below are those stated in the UKMEAG guidelines and the BNF; children’s doses are by body weight — use the BNFC tables.",
     blocks:[
       {b:"table", head:["Drug","Adult regimen","Start / stop","Key cautions"], rows:[
         ["<b>Atovaquone-proguanil</b>","One adult tablet (250 mg/100 mg) daily with food or a milky drink","Start 1–2 days before entering; continue daily while there and for <b>7 days</b> after leaving","Avoid for prophylaxis in severe renal impairment as specified in the current product information. Absorption may be reduced by vomiting or severe diarrhoea. Interacts with warfarin. Long-term use may be appropriate per the current UKMEAG destination recommendation, with adherence, tolerability, renal function and supply reviewed. Paediatric tablets by weight (UKHSA weight-band table/BNFC)"],
         ["<b>Doxycycline</b>","100 mg once daily","Start 1–2 days before; continue daily while there and for <b>4 weeks</b> after leaving","Unsuitable under 12 years. Photosensitivity — use high-factor sunscreen. Swallow with a full glass of water, remain upright and do not take immediately before sleep (oesophagitis). Separate from antacids and iron-, calcium- and magnesium-containing products. Vaginal candidiasis. Generally avoided in pregnancy — specialist decision only"],
         ["<b>Mefloquine</b>","250 mg once weekly","Start 2–3 weeks before (to assess tolerability); continue weekly while there and for <b>4 weeks</b> after leaving","Contraindicated with current or previous psychiatric disorder (including depression, generalised anxiety, psychosis, suicidal thoughts or self-harm) or seizures; contraindicated with amiodarone. Ask about previous mefloquine reactions, vestibular/balance disorder, cardiac disease and QT-prolonging drugs. Neuropsychiatric effects can persist after stopping (MHRA). Protective efficacy 90% or more (UKMEAG)"],

       ]},
       {b:"ladder", steps:[
         {step:"First", title:"Confirm the destination needs tablets", when:"country table", fromLabel:"UKMEAG 2026",
          html:"Some destinations need bite prevention only; others need a specific agent. Check the current country recommendation, including the traveller’s specific area and season."},
         {step:"Then", title:"Exclude what the traveller cannot take", when:"history", fromLabel:"patient factors",
          html:"Psychiatric history or seizures → no mefloquine. Under 12 → no doxycycline. Severe renal impairment → avoid atovaquone-proguanil per the product information; seek specialist advice if options are limited. Pregnancy → specialist advice (see Special groups). Check interactions (warfarin, antiepileptics, amiodarone, QT-prolonging medicines) in the BNF."},
         {step:"Choose", title:"Fit the regimen to the trip", when:"practicalities", fromLabel:"adherence",
          html:"Short or last-minute trips: a daily agent with a short tail (atovaquone-proguanil) is often easiest. Long stays: a weekly agent (mefloquine) if suitable, or doxycycline, or atovaquone-proguanil. Someone already taking doxycycline long-term for another reason still needs the malaria dose and timing confirmed."},
         {step:"Explain", title:"Start and stop dates in writing", when:"every traveller", fromLabel:"the failure point",
          html:"Write the start date, daily or weekly schedule and stop date, and explain the post-travel tail explicitly. The tail after return (7 days for atovaquone-proguanil; 4 weeks for doxycycline and mefloquine) is where most adherence fails. If vomiting within 1 hour of a dose, repeat the dose (atovaquone-proguanil SPC)."}
       ]},
       {b:"warn", html:"<b>Mefloquine safeguards (MHRA, 2013).</b> Use the prescriber checklist; give the patient alert card; ask directly about depression, generalised anxiety, psychosis, suicidal thoughts or attempts, self-harm, other psychiatric disorders and seizures, previous mefloquine reactions, vestibular symptoms or balance disorder, cardiac disease and QT-prolonging drugs (avoid with amiodarone). If neuropsychiatric, vestibular or significant mental-state symptoms develop, the patient should stop mefloquine and seek urgent medical advice about an alternative preventive regimen — not remain without prophylaxis. Dizziness, vertigo and loss of balance have occasionally persisted for months after stopping."}
     ]},

    {id:"sbet", nav:"D · Diagnose", title:"D — Diagnosis abroad and emergency standby treatment", sub:"For most travellers, the plan for a fever is ‘see a doctor the same day and get tested’. Standby treatment is for the few who cannot.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"🎒 Who needs emergency standby treatment", html:"Travellers going somewhere they may be unable to consult a doctor or get a diagnosis <b>within 24 hours</b> of a fever starting. UKMEAG regimens are in its country-recommendations section (Table 7); options include artemether-lumefantrine and atovaquone-proguanil at treatment doses. Prescribe only after specialist or experienced travel-medicine assessment; the choice depends on the prophylactic drug and destination, regimens are not interchangeable, and the same drug should not normally be used for both prophylaxis and standby treatment. It is not a substitute for medical assessment.", src:"UKHSA UKMEAG guidelines 2026 — Chemoprophylaxis and Appendix 3"},
         {tone:"amber", h:"📝 What the traveller must be given", html:"Written instructions (UKMEAG Appendix 3 leaflet): the symptoms that suggest malaria, including a temperature of <b>38°C or above</b>; when to start; how to take the course; expected side effects; and the possibility of treatment failure. Give written instructions and an emergency plan. Seek urgent clinical assessment as soon as possible even after self-treating — treatment failure, severe malaria, mixed infection and non-malarial diagnoses remain possible. Restart or continue prophylaxis only according to the specific UKMEAG regimen and specialist instructions after standby treatment; do not improvise the timing.", src:"UKHSA UKMEAG guidelines 2026 — Appendix 3"}
       ]},
       {b:"say", html:"If you get a temperature or feel flu-ish while you’re away or in the year after you come back — or even later — get a malaria test the same day and tell them where you’ve been. It’s not something to sleep on — this kind of malaria can get dangerous within a day. The tablets make it much less likely, but no tablet is 100%."}
     ]},

    {id:"special", nav:"Special groups", title:"Special risk groups", sub:"Where the choice narrows or the stakes rise.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"🤰 Pregnancy", html:"Malaria is more severe in pregnancy, so advise against travel to high-risk areas if it can be avoided. If travel is unavoidable, <b>arrange specialist travel-health advice</b> — prophylaxis is justified but the choice is specialist-led. <b>Mefloquine</b> may be used in selected high-risk settings, including the first trimester, following current UKMEAG advice. <b>Doxycycline</b> is generally avoided in pregnancy; if travel is unavoidable and standard options are unsuitable, involve an experienced travel-medicine or infectious-diseases clinician — any use (UKMEAG allows a course completed, including the post-travel tail, before 15 weeks’ gestation) is an individualised specialist decision. <b>Atovaquone-proguanil</b> has limited pregnancy safety data and should generally be specialist-led; if specialist advice supports it in pregnancy or when conception is planned, follow the current UKMEAG advice on folic acid dose. Accidental exposure to antimalarial prophylaxis is not an indication for termination. Fever or flu-like illness after travel, even up to a year or longer, needs urgent assessment.", src:"UKHSA UKMEAG guidelines 2026 — Special risk groups · RCOG Green-top Guideline 54a"},
         {tone:"amber", h:"👶 Children", html:"Doses are weight-based — use the current UKHSA weight-band table, BNFC or the local paediatric travel service rather than a partial dose list. Involve specialist travel advice for infants, young children travelling to high-risk areas or complex itineraries. Doxycycline is unsuitable under 12 years (UKMEAG — check the current paediatric product information). DEET up to 50% from 2 months of age. Store tablets out of reach — antimalarials are dangerous in overdose.", src:"UKHSA UKMEAG guidelines 2026 · BNFC"},
         {tone:"amber", h:"🧠 Epilepsy", html:"Mefloquine is contraindicated with a seizure history, and chloroquine should not be used in epilepsy. A history of febrile convulsions alone does not contraindicate any current agent. Mefloquine antagonises antiepileptic drugs. Atovaquone-proguanil or doxycycline are the usual choices; enzyme-inducing antiepileptics may lower doxycycline levels — check the BNF and UKMEAG Table 11.", src:"UKHSA UKMEAG guidelines 2026 — Special risk groups (Table 11)"},
         {tone:"amber", h:"🫀 Asplenia and immunosuppression", html:"People with an absent or dysfunctional spleen, significant immunosuppression, or other high-risk conditions should receive specialist travel-health advice before travel to a malaria-risk area. Malaria may deteriorate rapidly in these groups: stress rigorous prophylaxis and bite prevention, and fever after travel needs urgent hospital assessment, not just community testing.", src:"UKHSA — Information for patients with an absent or dysfunctional spleen · UKMEAG guidelines 2026"},
         {tone:"blue", h:"🍼 Breastfeeding", html:"The small amounts of antimalarial in breast milk do not protect the baby — the infant needs an individual risk assessment and, where indicated, their own prophylaxis (choice by age and weight) and bite prevention. Seek specialist advice where the breastfeeding parent takes an unusual agent or the infant is young or medically vulnerable. DEET is suitable; wash it off hands and breast skin before feeding.", src:"UKHSA UKMEAG guidelines 2026 — Special risk groups"},
         {tone:"blue", h:"🧳 Long-term travellers", html:"Atovaquone-proguanil: long-term use may be appropriate according to the current UKMEAG destination recommendation, provided adherence, tolerability, renal function and access to a reliable supply are reviewed. This does not remove the need for fever advice or bite prevention for the whole stay.", src:"UKHSA UKMEAG guidelines 2026 — Special categories of travel"}
       ]}
     ]},

    {id:"interact", nav:"Interactions", title:"Interactions and practical prescribing points", sub:"The BNF interaction checker is the reference — these are the ones that come up in general practice.",
     blocks:[
       {b:"table", head:["Situation","Issue","Action"], rows:[
         ["<b>Warfarin</b>","The proguanil component of atovaquone-proguanil may enhance warfarin; diet and alcohol changes abroad also shift the INR","Discuss travel plans with the anticoagulation service. Ensure the INR is stable before departure and enough anticoagulant for the trip, arrange an appropriate monitoring plan during and after travel, and consider dietary and alcohol changes as well as the antimalarial interaction"],
         ["<b>Amiodarone</b>","Mefloquine: risk of ventricular arrhythmia","Contraindicated — use another agent"],
         ["<b>QT-prolonging medicines or cardiac disease</b>","Mefloquine: arrhythmia risk","Check the BNF and SPC; consider another agent"],
         ["<b>Antiepileptics</b>","Mefloquine lowers seizure threshold; enzyme inducers affect doxycycline","Avoid mefloquine; check doxycycline dosing in the BNF"],
         ["<b>Combined hormonal contraception</b>","Doxycycline is not enzyme-inducing","No additional contraceptive precautions needed for the antibiotic effect (FSRH drug interactions guidance)"],
         ["<b>Vomiting</b>","Missed absorption","Atovaquone-proguanil: repeat the dose if vomiting within 1 hour (SPC)"],
         ["<b>Oral typhoid vaccine (live)</b>","Antibacterials, including doxycycline, and some antimalarials inactivate it","Check the current Green Book typhoid chapter and the vaccine product information when oral typhoid vaccine and malaria prophylaxis overlap. Antibacterial medicines can impair the live oral vaccine response. Atovaquone-proguanil may be used concomitantly where permitted by current national guidance; verify the timing of other antimalarials separately. Or use the injectable vaccine"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"cream", h:"🩺 GP role", html:"Keep separate the clinical assessment, NHS prescribing policy, private travel-clinic or community pharmacy services, and local practice arrangements. Assess risk, give ABCD advice and record it, prescribe or signpost to a travel clinic or pharmacy service — a pharmacy travel service does not remove the need for GP assessment where there is pregnancy, complex comorbidity, drug interactions or uncertainty — and, most importantly, make sure the fever message is heard and written down.", src:"UKHSA UKMEAG guidelines 2026 — Executive summary"},
         {tone:"cream", h:"📚 Where to check the detail", html:"The current UKHSA/UKMEAG country recommendation first (also on TravelHealthPro, NaTHNaC); the SPC for each product; BNF and BNFC for doses and interactions; the current Green Book; local laboratory and Health Protection Team pathways for urgent malaria testing and notification.", src:"UKHSA UKMEAG guidelines 2026 · BNF · BNFC"}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — who, when, where", sub:"Pre-travel advice rarely needs a referral; the febrile returning traveller always needs same-day action.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same day — febrile returning traveller", html:"Fever or flu-like illness within a year of travel to a malaria area (especially within 3 months, but later presentation is possible) → <b>same-day malaria films and/or RDT</b>, via the local laboratory pathway, acute medicine or the emergency department. Severe features or unable to take oral treatment → immediate admission, without waiting for results.", src:"UKHSA UKMEAG guidelines 2026 — Diagnosis"},
         {tone:"purple", h:"Statutory — notify suspected malaria", html:"Notify the proper officer, normally via the local UKHSA Health Protection Team (Greater Manchester HPT) or the local notification route, on clinical suspicion, following current UKHSA reporting instructions — without waiting for laboratory confirmation.", src:"Health Protection (Notification) Regulations 2010 · UKHSA notifiable diseases guidance"},
         {tone:"amber", h:"Specialist travel-medicine advice", html:"Pregnancy with unavoidable travel to a high-risk area; young children to high-risk areas; asplenia or significant immunosuppression; complex multi-country or prolonged itineraries; severe renal or hepatic impairment; significant psychiatric or seizure history where options are limited; a traveller who cannot take any of the standard agents; anyone needing emergency standby treatment.", src:"UKHSA UKMEAG guidelines 2026 — Special risk groups"},
         {tone:"cream", h:"Manage in primary care or pharmacy", html:"Straightforward trips with a clear country recommendation and a traveller who can take a standard agent.", src:"UKHSA UKMEAG guidelines 2026"}
       ]},
       {b:"say", html:"Think of it as four steps: know the risk where you’re going, stop the mosquitoes biting — especially from dusk — take the tablets exactly as written, including after you get home, and if you get a fever in the next year — or even later — get tested that day and mention the trip."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card; the Casebook holds full teaching cases.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 34-year-old man born in Nigeria is flying to Lagos in 5 days for a month-long family wedding. He says he ‘never gets malaria’ and didn’t take tablets last time. He had a depressive episode two years ago, and his wife, who is 10 weeks pregnant, wants to come too."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Explains <b>waning immunity</b> in VFR travellers without lecturing; checks the <b>country recommendation</b>; rules out <b>mefloquine</b> because of the depression history; offers <b>atovaquone-proguanil</b> (fits a 5-day lead time) or doxycycline with correct start and stop dates; addresses the <b>pregnancy</b> — advises against travel if possible and, if travel is unavoidable, arranges specialist travel-health advice rather than prescribing routinely; covers <b>DEET and nets</b>; gives the <b>fever-within-a-year</b> safety net in writing."}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Every recommendation above traces to one of these primary sources.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>UKHSA UK Malaria Expert Advisory Group (UKMEAG, formerly ACMP) — Malaria prevention guidelines for travellers from the UK 2026</b> (published 17 June 2026, updated July 2026)<br><a href="https://www.gov.uk/government/publications/malaria-prevention-guidelines-for-travellers-from-the-uk-2026" rel="noopener">gov.uk/government/publications/malaria-prevention-guidelines-for-travellers-from-the-uk-2026</a><span class="rd"> — ABCD framework; country recommendations; atovaquone-proguanil daily from 1–2 days before to 7 days after, long-term use with review of adherence, tolerability and renal function; doxycycline 100 mg daily to 4 weeks after, unsuitable under 12; mefloquine 250 mg weekly from 2–3 weeks before to 4 weeks after, efficacy 90% or more; DEET up to 50% in pregnancy, breastfeeding and infants over 2 months; sunscreen before repellent; icaridin 20%; pregnancy (specialist-led: mefloquine in first trimester in high-risk areas, doxycycline course completed before 15 weeks, atovaquone-proguanil and folic acid dose); epilepsy (Table 11); consider malaria in illness within a year of return, especially 3 months; emergency standby treatment within 24 hours rule and Appendix 3 leaflet</span></li>'+
         '<li><b>MHRA Drug Safety Update — Mefloquine: strengthened warnings on neuropsychiatric side effects</b> (2013)<br><a href="https://www.gov.uk/drug-safety-update/mefloquine-strengthened-warnings-on-neuropsychiatric-side-effects" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> — not for prophylaxis with current or previous depression, generalised anxiety disorder, psychosis, suicidal thoughts or attempts, self-harm, other psychiatric disorders or seizures; stop and seek advice on an alternative if neuropsychiatric symptoms; prescriber checklist and patient alert card; persistent vestibular symptoms</span></li>'+
         '<li><b>Lariam (mefloquine) SPC and risk-minimisation materials</b> — electronic Medicines Compendium<span class="rd"> — checklist for healthcare professionals; patient alert card; amiodarone contraindication</span></li>'+
         '<li><b>Atovaquone-proguanil SPC</b><span class="rd"> — take with food or a milky drink; repeat the dose if vomiting within 1 hour; severe renal impairment; warfarin interaction</span></li>'+
         '<li><b>BNF and BNFC</b> — atovaquone-proguanil, doxycycline, mefloquine<br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — adult and weight-based paediatric doses; interactions</span></li>'+
         '<li><b>Lalloo DG, et al. UK malaria treatment guidelines 2016.</b> J Infect 2016;72:635–49<span class="rd"> — features of severe malaria; consider malaria irrespective of prophylaxis; a single negative test may be insufficient</span></li>'+
         '<li><b>RCOG Green-top Guideline No. 54a — Malaria in pregnancy: prevention</b> (2010)<span class="rd"> — specialist advice for unavoidable travel in pregnancy; urgent assessment of fever after travel, even up to a year or longer</span></li>'+
         '<li><b>The Health Protection (Notification) Regulations 2010</b> and <b>UKHSA — Notifiable diseases and causative organisms: how to report</b><br><a href="https://www.gov.uk/guidance/notifiable-diseases-and-causative-organisms-how-to-report" rel="noopener">gov.uk</a><span class="rd"> — registered medical practitioners notify suspected cases to the proper officer</span></li>'+
         '<li><b>UKHSA — Malaria: homeopathic remedies</b> and <b>Information for patients with an absent or dysfunctional spleen</b><br><a href="https://www.gov.uk/government/publications/malaria-homeopathic-remedies" rel="noopener">gov.uk</a></li>'+
         '<li><b>UKHSA — Immunisation against infectious disease (Green Book), chapter 33 Typhoid</b> (check current version)<br><a href="https://www.gov.uk/government/publications/typhoid-the-green-book-chapter-33" rel="noopener">gov.uk — Green Book chapter 33</a><span class="rd"> — oral typhoid vaccine: antibacterials impair the response; atovaquone-proguanil may be used concomitantly where permitted; verify timing of other antimalarials and review at each update</span></li>'+
         '<li><b>FSRH (now CoSRH) Clinical Guidance — Drug interactions with hormonal contraception</b> (2022)<span class="rd"> — non-enzyme-inducing antibiotics do not reduce contraceptive effectiveness</span></li>'+
         '<li><b>NaTHNaC TravelHealthPro</b> — country information pages reproducing UKMEAG recommendations<br><a href="https://travelhealthpro.org.uk" rel="noopener">travelhealthpro.org.uk</a></li>'+

         '</ul></div>'}
     ]}
  ],
  foot:"Malaria prevention for travellers from the UK — UKHSA UKMEAG guidelines (2026 edition), MHRA Drug Safety Update on mefloquine (2013), BNF and BNFC, UK malaria treatment guidelines (2016) and the Health Protection (Notification) Regulations 2010. Always check the current country recommendation before prescribing. Fever after travel: same-day malaria testing via the local laboratory pathway, and notify suspected malaria through the local Health Protection Team route. Not a substitute for clinical judgement."
});
