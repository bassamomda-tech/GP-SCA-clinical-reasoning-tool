MG.render({

  title:"Raynaud's phenomenon — the complete guide",

  stemTitle:"Primary or secondary decides the plan — and critical digital ischaemia decides the urgency",
  stemSub:"This is an adult primary-care guide for suspected Raynaud's phenomenon. It is not a protocol for established systemic sclerosis, critical limb ischaemia, paediatric Raynaud's, or specialist treatment of digital ulcers. Screen for critical digital ischaemia, digital ulcers and features of connective tissue disease; confirm episodic colour change with cold or stress; then classify primary versus secondary by weighing onset, symmetry, tissue damage, nailfold changes, systemic features and, in context, ANA together — no single feature is diagnostic. Primary Raynaud's is common and benign and is managed with warmth and trigger avoidance; secondary Raynaud's, most often systemic sclerosis, needs rheumatology. Investigate where it changes management, and use nifedipine — the only commonly used UK medicine with a specific Raynaud's licence (licence wording is product-specific) — when attacks are troublesome despite lifestyle measures.",
  guideline:"BSR systemic sclerosis guideline (2024) · EULAR SSc recommendations (2023) · PCDS · nifedipine SPCs · HSE (HAVS) · NHS England commissioning policy · SPS · Greater Manchester formulary",
  reviewed:"25 September 2026",
  nextReview:"25 September 2027",
  meta:[
    {t:"Critical ischaemia or gangrene → same-day emergency", tone:"tw"},

  ],
  lead:"<div class='mg-layers'><a href='#severe'><b>Red flags</b><small>Ischaemia · ulcers · systemic</small></a><a href='#classify'><b>Classify</b><small>Primary vs secondary</small></a><a href='#lifestyle'><b>Lifestyle</b><small>First-line</small></a><a href='#ladder'><b>Drugs</b><small>Nifedipine, then specialist</small></a><a href='#refer'><b>Refer</b><small>Rheumatology · vascular</small></a></div>",
  quickSub:"If you read nothing else on this page, read these six cards. Every figure traces to the source cited under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Critical digital ischaemia is an emergency", html:"Arrange <b>same-day emergency assessment</b> for a digit that remains painful and pale or blue despite gentle warming, rapidly progressive ischaemia, necrosis, gangrene, or markedly reduced or absent pulses. Suspected acute arterial occlusion requires emergency vascular assessment. <b>New digital ulcers or necrosis require urgent specialist assessment</b> via the local rheumatology/systemic sclerosis, vascular or acute medical pathway; new necrosis or critical ischaemia should be assessed urgently, preferably within 48 hours (BSR 2024). A stable, superficial, uncomplicated ulcer without critical ischaemia needs urgent rheumatology/systemic sclerosis review and a wound-care plan, not necessarily an emergency department attendance."},
    {tone:"amber", h:"Asymmetry is atypical", html:"Asymmetry, single-digit involvement, abnormal pulses or an abnormal Allen test are atypical for primary Raynaud's — consider embolism or occlusion, atherosclerosis, hypothenar hammer syndrome, thoracic outlet disease, thromboangiitis obliterans, trauma or vibration injury. Arrange vascular assessment or imaging with urgency set by pain, colour persistence, tissue loss, pulses and progression; emergency advice if acute ischaemia is suspected. With normal pulses and no tissue loss, assess promptly for vascular, occupational, traumatic and neurological causes."},
    {tone:"blue", h:"Weigh the features together — no single one decides primary versus secondary", html:"Primary Raynaud's is more likely with young onset, bilateral symmetrical attacks, no tissue damage, a normal examination and no systemic features. Consider secondary disease at any age — particularly with later onset, male sex, asymmetry, severe or progressive symptoms, ulcers or pitting scars, puffy fingers, sclerodactyly, abnormal nailfolds or pulses, or symptoms of connective tissue disease. No single feature — age, ANA titre or asymmetry — decides it alone."},
    {tone:"green", h:"Lifestyle is first-line for everyone", html:"Keep the whole body warm; gloves or heated mittens; avoid known triggers and sudden cold; rewarm numb digits gradually with warm — not scalding — water and avoid direct heat, because burns can occur when sensation is reduced; stop smoking and avoid nicotine-containing products; review vasoconstricting medicines and decongestants; protect the skin and treat fissures promptly; reduce vibration exposure."},
    {tone:"green", h:"Nifedipine when attacks are troublesome", html:"A long-acting dihydropyridine calcium-channel blocker — usually nifedipine, the only commonly used UK medicine with a specific licence for Raynaud's phenomenon, though the licence and pregnancy wording depend on the individual product. Start with a low dose of the locally preferred prolonged-release preparation and titrate gradually according to symptom response, blood pressure, tolerability and the product SPC; prescribe the exact modified-release product, as preparations are not interchangeable. Consider amlodipine if nifedipine is not tolerated. Common effects: headache, flushing, dizziness, palpitations, hypotension and peripheral oedema, which may be dose-limiting. Seasonal use is an optional, patient-led choice."},
    {tone:"amber", h:"Secondary disease and digital ulcers are specialist-led", html:"<b>Refractory Raynaud's:</b> PDE-5 inhibitors (sildenafil or tadalafil, off-label, specialist-initiated) and IV prostanoids (iloprost) for severe disease. <b>Digital ulcers:</b> wound assessment and protective dressings, infection assessment, analgesia, antibiotics if clinically infected, assessment for osteomyelitis if deep or persistent, and specialist vasodilator therapy and wound care; bosentan reduces the development of new digital ulcers in systemic sclerosis (it does not heal an existing ulcer) and needs specialist monitoring. <b>PDE-5 inhibitors must never be combined with nitrates or nicorandil.</b>"}
  ],
  pathwaySub:"The whole consultation in five moves.",
  pathway:[
    {title:"Screen for critical ischaemia and systemic disease", html:"Persistent painful pallor or cyanosis despite warming, necrosis, gangrene, rapidly progressive ischaemia or absent/reduced pulses → same-day emergency assessment (emergency vascular if acute arterial occlusion is suspected) — do not delay while awaiting ANA or routine bloods. New digital ulcer or necrosis → urgent specialist assessment. Asymmetry → vascular assessment, urgency by severity. Systemic or CTD features → rheumatology, urgency by severity.", alert:true},
    {title:"Confirm the diagnosis", html:"A clinical diagnosis: recurrent, clearly demarcated episodes of pallor and/or cyanosis, usually affecting fingers or toes, provoked by cold or emotional stress and improving with rewarming. Triphasic white–blue–red change is characteristic but not required. Photographs and a diary help but are not essential. Consider mimics if persistent, unilateral, non-cold-related or with neurological symptoms."},
    {title:"Classify primary versus secondary", html:"Onset and progression, symmetry, tissue damage, nailfold changes, ANA in context, systemic features, drugs and occupation — interpreted together; no single age, ANA result or distribution pattern is diagnostic."},
    {title:"Examine and investigate selectively", html:"Pulses and both-arm BP; hands for ulcers, pitting and sclerodactyly; no routine tests for typical primary Raynaud's; directed bloods when the presentation is atypical or features suggest secondary disease."},
    {title:"Lifestyle first, then nifedipine; review", html:"Start the locally preferred prolonged-release nifedipine low and review BP, adverse effects and benefit within a few weeks of titration. Refer secondary disease, digital ulcers and refractory symptoms."}
  ],
  sections:[
    {id:"severe", nav:"Red flags", title:"Red flags — critical ischaemia and systemic disease",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Acute digital ischaemia", html:"Persistent painful pallor or cyanosis that does not reperfuse with gentle warming, tissue necrosis or gangrene, rapidly progressive ischaemia, or absent or markedly reduced pulses → same-day emergency assessment; suspected arterial occlusion or critical limb ischaemia → emergency vascular."},
         {tone:"red", h:"🔴 New digital ulcer or necrosis", html:"Urgent specialist assessment via the local rheumatology/systemic sclerosis, vascular or acute pathway — new necrosis or critical ischaemia preferably within 48 hours (BSR 2024). A painful, infected, deep or non-healing ulcer, or one associated with systemic sclerosis → urgent same-day or rapid specialist assessment according to the local pathway. A stable, superficial, uncomplicated ulcer without critical ischaemia → urgent rheumatology/systemic sclerosis review and a wound-care plan; not necessarily an emergency department attendance."},
         {tone:"amber", h:"🟠 Asymmetric or single-digit", html:"With normal pulses and no tissue loss → prompt assessment for vascular, occupational, traumatic and neurological causes; urgency depends on severity and progression. Abnormal pulses → vascular assessment or imaging."},
         {tone:"amber", h:"🟠 Features of connective tissue disease", html:"Puffy fingers, sclerodactyly or skin tightening or itching, telangiectasia, calcinosis, reflux or dysphagia, breathlessness, cough or reduced exercise tolerance, inflammatory arthritis, rash, proximal weakness, sicca symptoms, or unexplained weight loss → rheumatology, with urgency set by severity and the local pathway."},
         {tone:"blue", h:"🔵 Later onset or worsening", html:"Consider secondary disease at any age. Later onset, or a known 'primary' pattern that becomes more severe or develops new features → directed investigation for secondary disease; refer if found."}
       ]}
     ]},

    {id:"confirm", nav:"Confirm", title:"Confirm — the targeted history",
     blocks:[
       {b:"table", head:["Feature","Detail"], rows:[
         ["<b>Colour change</b>","A clinical diagnosis: recurrent, clearly demarcated episodes of pallor and/or cyanosis, usually affecting fingers or toes, provoked by cold or emotional stress and improving with rewarming. Triphasic white–blue–red change is characteristic but not required; pallor or cyanosis alone is common. May affect toes, ears, nose or nipples. See the mimics under <a href='#classify'>Classify</a>"],
         ["<b>Triggers</b>","Cold, temperature change, emotional stress, vibration"],
         ["<b>Distribution</b>","Usually fingers, often toes; bilateral and symmetrical in primary disease"],
         ["<b>Diary and photographs</b>","Attack photographs and a record of frequency, severity, duration and triggers support diagnosis and measure response — useful but not essential"],
         ["<b>Medicines and substances</b>","Non-selective beta-blockers, ergotamine and triptans, some chemotherapy (e.g. bleomycin, cisplatin), interferon, sympathomimetic decongestants, stimulants such as amphetamines and cocaine, and nicotine can cause or aggravate it"],["<b>Systemic enquiry</b>","Ulcers or pitting scars, puffy fingers, skin tightening or itching, rash, joint pain, myalgia or weakness, reflux or dysphagia, breathlessness or cough, dry eyes or mouth, weight loss"],
         ["<b>Occupation</b>","Vibrating tools — ask specifically about cumulative exposure, tool type, duration, cold working conditions, sensory symptoms and functional impairment. Hand–arm vibration risk depends on intensity, duration, cumulative exposure and individual susceptibility"]
       ]}
     ]},

    {id:"classify", nav:"Classify", title:"Classify — primary versus secondary",
     blocks:[
       {b:"table", head:["Category","Picture","Route"], rows:[
         ["<b>Primary Raynaud's</b>","Young onset, symmetrical, no tissue damage, normal examination, no systemic features","Primary care: lifestyle, diary, CCB if troublesome"],
         ["<b>Secondary, no tissue loss</b>","Features of connective tissue disease, abnormal nailfolds or pulses, drug or vibration cause","Directed investigation; rheumatology, vascular or occupational health by findings"],
         ["<b>Systemic sclerosis digital vasculopathy</b>","Digital ulcers, pitting scars, puffy fingers, sclerodactyly","Rheumatology/systemic sclerosis service; urgent specialist assessment for new ulcers or necrosis (preferably within 48 hours for new necrosis or critical ischaemia)"],
         ["<b>Acute digital ischaemia</b>","Persistent painful pallor or cyanosis, necrosis, absent pulses","Same-day emergency assessment; emergency vascular for suspected occlusion"]
       ]},
       {b:"table", head:["Feature","Primary","Secondary"], rows:[
         ["<b>Onset</b>","More often young or long-standing onset","More likely with later onset — a risk feature, not a cut-off; consider secondary disease at any age"],
         ["<b>Pattern</b>","Symmetrical; no tissue damage","Asymmetrical, severe, or with ulcers or pitting scars"],
         ["<b>Nailfolds and ANA</b>","Normal; usually negative","Abnormal capillaries; clinically relevant ANA or disease-specific autoantibodies (a low-titre positive ANA alone is common and not diagnostic)"],
         ["<b>Associations</b>","None; common and benign","Systemic sclerosis (most common), SLE, Sjögren's, mixed connective tissue disease, myositis, vasculitis, rheumatoid arthritis"],
         ["<b>Interpretation</b>","These are risk features, not diagnostic criteria","Consider secondary Raynaud's at any age, especially with later onset, male sex, progressive or severe symptoms, asymmetry, digital ulcers or pitting scars, abnormal nailfolds, puffy fingers, sclerodactyly, abnormal pulses, or symptoms of connective tissue disease. Interpret them together; no single age, ANA result or distribution pattern is diagnostic"]
       ]},
       {b:"table", head:["Other cause","Action"], rows:[
         ["<b>Drug-induced</b>","Review and, where appropriate and safe, change the culprit"],
         ["<b>Hand–arm vibration syndrome</b>","Ask about cumulative exposure, tool type, duration, cold working conditions, sensory symptoms and functional impairment. Refer to occupational health for formal assessment and workplace control measures (HSE, Control of Vibration at Work Regulations). Avoid or reduce vibration exposure; gloves may preserve warmth but do not reliably prevent vibration transmission. Look for neurological as well as vascular disease"],
         ["<b>Structural or other</b>","Atherosclerosis, embolism, thoracic outlet syndrome, carpal tunnel syndrome, hypothyroidism, cryoglobulinaemia or haematological causes — investigate as the history directs"]
       ]},
       {b:"warn", html:"<b>Differential diagnosis — mimics to consider:</b> acrocyanosis · erythromelalgia · chilblains (pernio) · peripheral arterial disease or acute arterial occlusion · embolic disease · hypothenar hammer syndrome · thoracic outlet syndrome · hand–arm vibration syndrome · drug-induced vasoconstriction · vasculitis or cryoglobulinaemia · neuropathy or carpal tunnel syndrome · local trauma or pressure-related lesions. Persistent colour change, unilateral disease or symptoms unrelated to cold should not automatically be labelled Raynaud's."}
     ]},

    {id:"exam", nav:"Examination", title:"Examination",
     blocks:[
       {b:"table", head:["What","How or finding","Significance"], rows:[
         ["<b>Pulses and BP</b>","Radial and ulnar pulses; compare upper-limb pulses and BP in both arms where vascular disease is suspected; Allen test only if clinically relevant and performed appropriately","Asymmetry or a clear arm-to-arm BP difference → vascular assessment"],
         ["<b>Hands and feet</b>","Capillary refill and temperature of affected digits; ulcers, pitting scars, fingertip pulp loss, gangrene, calcinosis, sclerodactyly, puffy fingers; trauma or pressure lesions","Tissue damage means secondary disease until shown otherwise"],
         ["<b>Any ulcer</b>","Infection, cellulitis, discharge; depth and persistence","Infected → antibiotics; deep, persistent or suspected bone involvement → assess for osteomyelitis"],
         ["<b>Nailfolds</b>","Dilated loops, capillary dropout or haemorrhages — a dermatoscope can help those trained in it, but it is operator-dependent and not equivalent to formal videocapillaroscopy","Possible scleroderma-pattern abnormality → rheumatology. A normal view is reassuring but does not exclude connective tissue disease if suspicion remains"],
         ["<b>Skin and systems</b>","Telangiectasia, rash, livedo, embolic signs, features of vasculitis; chest crackles; proximal weakness; joint swelling; dry eyes or mouth","Points to a specific connective tissue disease → urgent rheumatology"],
         ["<b>Mimics</b>","Carpal tunnel and thoracic outlet signs","Identifies coexisting or alternative causes"]
       ]}
     ]},

    {id:"workup", nav:"Work-up", title:"Investigations — when they change management",
     blocks:[
       {b:"table", head:["Test","When","Interpretation"], rows:[
         ["<b>Directed bloods</b>","When secondary disease is suspected or the presentation is atypical: FBC; ESR and/or CRP; ANA; renal function and urinalysis; liver profile if systemic disease or drug treatment is relevant; TFTs if clinically indicated; CK if weakness suggests myositis. Targeted tests only when the history or examination points there: serum electrophoresis and immunoglobulins, cryoglobulins, hepatitis serology, complement, antiphospholipid antibodies","Request ANA only when the history or examination raises suspicion of secondary disease, and interpret it in clinical context. A positive ANA alone — particularly low titre — does not establish connective tissue disease; a negative ANA does not exclude it where clinical suspicion is strong. Discuss a positive ANA with systemic features, abnormal nailfolds or disease-specific autoantibodies with rheumatology"],
         ["<b>Specialist autoantibodies</b>","Anti-centromere, anti-Scl-70 and others","Need not be performed indiscriminately in general practice — usually coordinated by rheumatology or per the local laboratory/referral pathway"],
         ["<b>Imaging</b>","Arterial imaging or Doppler for asymmetry, abnormal pulses or suspected occlusion. Do not order chest imaging solely for Raynaud's — respiratory symptoms, crackles, abnormal oxygen saturation or known systemic sclerosis should lead to the appropriate respiratory or systemic sclerosis pathway","Not needed for typical bilateral primary Raynaud's"],
         ["<b>Not needed</b>","Typical bilateral, symmetrical Raynaud's of young or long-standing onset, with no ulcers or pitting scars, normal pulses and examination, no systemic features and no significant progression","Reassure and give lifestyle advice; investigate if the picture changes"]
       ]},
       {b:"cards", items:[
         {tone:"blue", h:"No NG12 criterion for Raynaud's", html:"Raynaud's phenomenon is not itself a NICE suspected-cancer referral criterion. If independent cancer symptoms or signs are present, follow the relevant NICE NG12 pathway rather than attributing them to Raynaud's."}
       ]}
     ]},

    {id:"lifestyle", nav:"Lifestyle", title:"Lifestyle — first-line for everyone",
     blocks:[
       {b:"table", head:["Measure","What to do"], rows:[
         ["<b>🧤 Keep warm</b>","Whole-body warmth: layers, hat, gloves or mittens; pre-warm the car; heated gloves or hand warmers for outdoor work"],
         ["<b>❄️ Temperature change</b>","Avoid sudden cold, including cold drinks and freezer aisles; rewarm gradually with warm, not scalding, water, and avoid direct heat sources when sensation is reduced"],
         ["<b>🤲 During an attack</b>","Move somewhere warm, swing the arms, clench and unclench the hands, rewarm gently"],
         ["<b>🚭 Smoking</b>","Advise cessation of smoking and avoidance of nicotine-containing products, which may worsen vasoconstriction; refer to the stop-smoking service"],
         ["<b>🎯 Triggers</b>","Stress management where stress triggers attacks; reduce caffeine if it seems to"],
         ["<b>💊 Medicines</b>","Review medicines that may worsen symptoms, particularly non-selective beta-blockers, sympathomimetics (including decongestants), ergot derivatives, stimulants and vasoconstricting migraine treatments. A beta-blocker is not an absolute contraindication — weigh indication, severity, cardioselectivity and alternatives. Do not stop a beta-blocker abruptly or withdraw one needed for a cardiac indication without an alternative plan"],
         ["<b>🧴 Skin</b>","Regular emollient; protect the fingers; prompt attention to any break in the skin"],
         ["<b>🔧 Vibration</b>","Avoid or reduce vibration exposure; gloves may preserve warmth but do not reliably prevent vibration transmission; refer to occupational health for formal assessment and workplace control measures"]
       ]}
     ]},

    {id:"ladder", nav:"Drugs", title:"Drug treatment — nifedipine, then specialist",
     blocks:[
       {b:"table", head:["Severity","Approach","Detail"], rows:[
         ["<b>Mild primary</b>","Lifestyle only","Review if it worsens"],
         ["<b>Troublesome attacks despite lifestyle</b>","<b>Long-acting dihydropyridine CCB</b> — usually nifedipine (the only commonly used UK medicine with a specific Raynaud's licence; licence wording is product-specific — check the SPC); amlodipine if nifedipine is not tolerated","Start with a low dose of the locally preferred prolonged-release preparation and titrate gradually according to symptom response, blood pressure, tolerability and the product SPC; modified-release preparations differ and are not interchangeable — prescribe the exact product according to the SPC and Greater Manchester formulary. Trial for several weeks. Seasonal use is an optional, patient-led adjustment"],
         ["<b>First CCB not tolerated</b>","Switch dihydropyridine CCB","Consider amlodipine if nifedipine is not tolerated; seek advice in cardiac disease"],
         ["<b>Refractory or secondary Raynaud's</b>","Refer — specialist therapy","PDE-5 inhibitors (sildenafil or tadalafil — off-label, specialist-initiated, not routine GP prescribing) as second line for refractory systemic sclerosis Raynaud's; intravenous prostanoids (iloprost) in severe disease; occasionally other specialist-directed vasodilator strategies. Do not use PDE-5 inhibitors with nitrates or nicorandil; use caution with alpha-blockers and other antihypertensives; consider contraindications and significant interactions before initiation"],
         ["<b>Digital ulcers</b>","Wound care plus specialist referral","Wound assessment and protective dressings; infection assessment; appropriate analgesia; antibiotics if clinically infected; assessment for osteomyelitis if deep, persistent or clinically suspected; specialist vasodilator therapy and rheumatology/systemic sclerosis wound care. Bosentan (second line, specialist only) reduces the development of new digital ulcers in systemic sclerosis — it does not heal an existing ulcer — and needs liver-function monitoring; it is teratogenic, so reliable contraception and pregnancy testing are needed where applicable, and it reduces the effectiveness of hormonal contraception through enzyme induction; specialist and high-cost-drug commissioning requirements apply"]
       ]},
       {b:"kv", rows:[
         ["Warn about","Common: headache, flushing, dizziness, palpitations, hypotension, peripheral oedema (common and may be dose-limiting)"],
         ["Monitor","BP and adverse effects after starting or changing the dose, with review within a few weeks of titration; benefit against attack frequency, duration, severity, functional impact and the patient diary"],
         ["Cautions","Check the current SPC for product-specific contraindications, warnings and dose adjustments. Clinically important issues include hypotension, significant aortic stenosis, acute coronary instability, cardiogenic shock, significant hepatic impairment and potential worsening of oedema"],["Pregnancy and breastfeeding","If treatment is required during pregnancy, do not automatically withhold nifedipine. Check the SPC for the prescribed product and seek advice from obstetric/maternal-medicine or medicines-in-pregnancy services where the SPC is restrictive or the dose is high. Nifedipine is considered compatible with pregnancy and breastfeeding in the BSR comorbidity-medication guideline (2022), generally at doses below 90 mg/day, subject to clinical risk–benefit assessment; manufacturers may use precautionary wording because of limited trial data. In breastfeeding, SPS identifies nifedipine as a preferred dihydropyridine — monitor a vulnerable infant for hypotension, lethargy, pallor, poor feeding or inadequate weight gain"],
         ["Interactions","Additive hypotension with other vasodilators, antihypertensives and alpha-blockers; review hypotension risk carefully with PDE-5 inhibitors; CYP3A4 inhibitors (e.g. clarithromycin, erythromycin, azole antifungals, some HIV medicines) raise levels; rifampicin and other potent enzyme inducers lower them; grapefruit where relevant to the individual product"]
       ]},
       {b:"say", html:"For most people Raynaud's is harmless, and the most effective things are keeping your whole body warm, avoiding sudden cold and not smoking. If attacks are still troublesome, there's a tablet that relaxes the blood vessels. I'll check there's nothing linked to another condition — and please get seen the same day if a finger stays white or blue and painful after warming, or develops a sore."}
     ]},

    {id:"monitor", nav:"Monitor", title:"Follow-up and safety-netting",
     blocks:[
       {b:"table", head:["When","What"], rows:[
         ["<b>After starting or changing a vasodilator</b>","Review within a few weeks after titration: BP, adverse effects, and benefit against attack frequency, duration, severity, functional impact and the diary; adjust the dose"],
         ["<b>Stable primary Raynaud's</b>","Periodic review; re-examine and test further only if new features emerge — do not repeat the ANA in an unchanged patient"],
         ["<b>Re-assess if</b>","Progressive symptoms, tissue damage or a digital ulcer, asymmetry, systemic features, a clinically relevant positive ANA with compatible features, or disease refractory to lifestyle and a calcium-channel blocker — possible evolution to secondary disease"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"📞 Same-day emergency", html:"Seek same-day help if a finger or toe remains painful, pale or blue despite gentle warming, becomes black, develops rapidly worsening pain, or loses sensation."},
         {tone:"amber", h:"🟠 Urgent", html:"Report any new ulcer, non-healing wound, spreading redness, discharge or fever urgently · rapidly worsening attacks · new systemic symptoms."},
         {tone:"cream", h:"💬 Safety-net scripts", html:"“A finger or toe that stays painful, pale or blue after warming, or develops a sore or blackened skin — get seen the same day.” “Joint pains, rashes, trouble swallowing, breathlessness or tight skin on the fingers — tell us.” “Whole-body warmth and not smoking are the most effective everyday measures.”"}
       ]}
     ]},

    {id:"loop", nav:"Not improving?", title:"Not improving? Re-check before escalating",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"1 · Secondary disease?", html:"Asymmetry, ulcers, abnormal nailfolds, a clinically relevant ANA with compatible features, or systemic features → rheumatology or vascular as appropriate."},
         {tone:"amber", h:"2 · Aggravating drugs", html:"Decongestants, stimulants, nicotine, a non-selective beta-blocker still in use?"},
         {tone:"amber", h:"3 · Triggers", html:"Cold, vibration, smoking and stress genuinely addressed?"},
         {tone:"amber", h:"4 · Adequate trial", html:"Nifedipine at a tolerated, titrated dose for several weeks?"},
         {tone:"red", h:"5 · Critical?", html:"Persistent pain or colour change despite warming, or tissue breakdown → same-day emergency assessment; new ulcers → urgent specialist assessment."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral criteria",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same-day emergency", html:"Critical digital ischaemia, gangrene, rapidly progressive ischaemia or absent/reduced pulses → local vascular or acute pathway; suspected acute arterial occlusion → emergency vascular assessment. Do not delay referral while awaiting ANA or routine blood tests."},
         {tone:"red", h:"Urgent specialist assessment", html:"New necrosis, digital ulceration, rapidly worsening symptoms or suspected infection → local rheumatology/systemic sclerosis, vascular or acute service according to the findings; new necrosis or critical ischaemia preferably within 48 hours."},{tone:"amber", h:"Rheumatology", html:"Pitting scars, puffy fingers, sclerodactyly or other connective tissue disease features; a clinically relevant positive ANA with compatible features or abnormal nailfolds; later-onset unexplained disease; systemic symptoms — urgency by severity and the local pathway."},
         {tone:"amber", h:"Vascular", html:"Asymmetric or single-digit disease, absent or unequal pulses, abnormal Allen test — urgency by severity; emergency for suspected acute ischaemia."},
         {tone:"blue", h:"Routine rheumatology", html:"Later-onset Raynaud's under investigation; abnormal nailfolds; refractory to lifestyle and a calcium-channel blocker; significant functional impact."},
         {tone:"blue", h:"Occupational health", html:"Suspected hand–arm vibration syndrome — formal assessment and workplace control measures."},
         {tone:"green", h:"Primary care manages", html:"Typical primary Raynaud's: lifestyle advice, a symptom diary, a CCB if troublesome, and review if it changes. Use the local Greater Manchester referral and advice-and-guidance routes and the <a href='https://www.greatermanchesterformulary.nhs.uk/' rel='noopener'>Greater Manchester formulary</a>."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 46-year-old male groundworker describes two winters of fingers “going dead white then blue” — only on the right hand, worst in the index and middle fingers. He uses a breaker most days, smokes 15 a day, and has a small non-healing sore on one fingertip. He wants “circulation tablets like my wife got”."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Does not treat this as primary Raynaud's: recognises later onset, asymmetry and a non-healing digital ulcer; arranges urgent specialist assessment of the ulcer (same-day if infected, ischaemic or necrotic) and vascular assessment for the asymmetry rather than simply prescribing; checks pulses, capillary refill and both-arm BP, examines the ulcer for infection, and looks for connective tissue disease features; sends directed bloods (FBC, ESR/CRP, ANA, renal function and urinalysis; TFTs if indicated); recognises possible hand–arm vibration syndrome and involves occupational health; addresses smoking; safety-nets a digit that does not recover with warming."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>British Society for Rheumatology — 2024 guideline for management of systemic sclerosis</b> (Rheumatology 2024)<br><a href="https://doi.org/10.1093/rheumatology/keae394" rel="noopener">doi.org/10.1093/rheumatology/keae394</a><span class="rd"> — nailfold assessment, calcium-channel blockers, PDE-5 inhibitors, prostanoids, bosentan; severe digital vasculopathy as an emergency</span></li>'+'<li><b>British Society for Rheumatology — prescribing in pregnancy and breastfeeding: comorbidity medications (2022)</b><br><a href="https://doi.org/10.1093/rheumatology/keac552" rel="noopener">doi.org/10.1093/rheumatology/keac552</a><span class="rd"> — nifedipine compatible in pregnancy and breastfeeding</span></li>'+'<li><b>Primary Care Dermatology Society — Raynaud\'s phenomenon</b><br><a href="https://www.pcds.org.uk/" rel="noopener">pcds.org.uk</a><span class="rd"> — primary-care presentation, risk features for secondary disease, directed investigation; long-acting nifedipine or amlodipine first-line</span></li>'+
         '<li><b>EULAR — recommendations for the treatment of systemic sclerosis (2023 update)</b> (Ann Rheum Dis 2024)<br><a href="https://doi.org/10.1136/ard-2024-226430" rel="noopener">doi.org/10.1136/ard-2024-226430</a><span class="rd"> — calcium-channel blockers first-line; PDE-5 inhibitors, iloprost and bosentan for severe disease and digital ulcers</span></li>'+

         '<li><b>SPS — Using calcium-channel blockers during breastfeeding</b><br><a href="https://www.sps.nhs.uk/articles/using-calcium-channel-blockers-during-breastfeeding/" rel="noopener">sps.nhs.uk</a><span class="rd"> — nifedipine a preferred dihydropyridine; infant monitoring</span></li>'+
         '<li><b>Greater Manchester formulary (GMMMG) — cardiovascular system</b><br><a href="https://www.greatermanchesterformulary.nhs.uk/" rel="noopener">greatermanchesterformulary.nhs.uk</a><span class="rd"> — locally preferred nifedipine product and dosing; formulary status of sildenafil, bosentan and iloprost</span></li>'+
         '</ul></div>'}

  foot:"Raynaud's phenomenon in primary care. Critical digital ischaemia or gangrene: same-day emergency assessment. Digital ulcers, connective tissue disease features and asymmetry: urgent specialist assessment. Classify primary versus secondary by weighing onset, symmetry, tissue damage, nailfolds, systemic features and ANA together. Lifestyle is first-line; nifedipine (product-specific licence; prescribe the exact modified-release product) for troublesome attacks; specialist-initiated therapy for secondary disease and digital ulcers. Sources: BSR (2024), BSR pregnancy guidance (2022), EULAR (2023), PCDS, nifedipine SPCs, NHS England commissioning policy, HSE, SPS, Greater Manchester formulary. Verify doses against the SPC for the exact product and the local formulary."
