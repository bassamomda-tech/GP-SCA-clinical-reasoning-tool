MG.render({
  icon:"🫁",
  title:"Pre-school wheeze — the complete guide",
  eyebrow:"Protocol · NICE NG9 · NG245 · episodic viral wheeze or suspected asthma — review over time",
  stemTitle:"Most wheezy under-5s have episodic viral-triggered wheeze that often improves with age — but some have asthma, which usually cannot be confirmed objectively under 5. Describe the pattern, use a time-limited treatment trial where indicated, and review over time",
  stemSub:"One page for wheeze in the under-5s. The central task is <b>classification</b>: bronchiolitis, a clinical syndrome usually affecting children under 2 years and most common in the first year (where bronchodilators do not work and NG9 sets the referral thresholds), episodic viral wheeze, multiple-trigger wheeze, and the mimics that are not wheeze at all — croup, inhaled foreign body, and the chronic red flags that suggest cystic fibrosis or a structural cause. Then the two decisions that follow: what to give in an acute episode, and whether this child has earned a preventer trial. For confirmed asthma in an older child see <a href='asthma-children.html'>asthma in children</a>. <b>NG245 governs diagnosis and chronic management; the BTS/SIGN acute-asthma recommendations govern acute attack severity and treatment, subject to local paediatric emergency pathways. Verify all paediatric doses against the current BNF for Children and local paediatric pathway.</b>",
  guideline:"NICE NG9 (2015, updated 2021) · NICE NG245 (2024, joint with BTS and SIGN) · BTS/SIGN 158 (2019, amended 2024) acute-attack sections, which NG245 does not cover",
  reviewed:"13 September 2026",
  nextReview:"13 March 2027",
  meta:[
    {t:"NICE NG9 — bronchiolitis in children"},

    {t:"v1.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#safety"><b>Admit now</b><small>NG9 · red flags</small></a><a href="#classify"><b>Classify</b><small>Which wheeze?</small></a><a href="#acute"><b>Acute</b><small>What to give</small></a><a href="#preventer"><b>Preventer?</b><small>Trial, not label</small></a><a href="#parents"><b>Parents</b><small>Spacer · what to expect</small></a></div>',
  quickSub:"First decide whether this is bronchiolitis, wheeze or an upper-airway problem. Bronchiolitis usually affects children under 2 years and is treated supportively — do not give salbutamol, steroids, antibiotics, ipratropium or nebulised adrenaline. In a child with recurrent wheeze, describe the pattern as episodic viral-triggered wheeze or suspected asthma rather than assuming either diagnosis is proven. Treat mild-to-moderate wheeze with salbutamol through a pMDI and spacer, assess response and teach technique. Consider an 8–12-week twice-daily low-dose ICS trial when symptoms require maintenance treatment or episodes are severe, then stop and review if symptoms resolve. Always look for foreign body, croup and chronic respiratory red flags. Sources are cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ NICE NG9 — bronchiolitis: emergency transfer or urgent hospital assessment", html:"Arrange emergency transfer for apnoea (observed or reported), central cyanosis, severe respiratory distress (grunting, marked recession, respiratory rate over 70), severe exhaustion, or a seriously unwell appearance. Consider urgent hospital assessment for persistent SpO₂ below 92% in air, respiratory rate over 60, clinical dehydration or oral intake around 50–75% of usual, taking account of age and risk factors. A normal or borderline oxygen saturation does not override a seriously unwell clinical appearance — interpret pulse oximetry alongside the whole clinical assessment. Lower the threshold for age under 3 months, prematurity, chronic lung disease, congenital heart disease, neuromuscular disease and immunodeficiency."},
    {tone:"red", h:"⛔ Bronchodilators do not work in bronchiolitis", html:"NG9 is explicit: do not use salbutamol, ipratropium, adrenaline (nebulised), montelukast, antibiotics, or systemic or inhaled corticosteroids in bronchiolitis. <b>Management is supportive — feeding support, fluids and oxygen.</b> A first episode of respiratory distress with coryza, cough, tachypnoea and wheeze/crackles in an infant is suggestive of bronchiolitis; reassess if the pattern is atypical or recurrent. Age, first episode and wheeze alone are not sufficient for diagnosis. Do not use a lack of response to salbutamol to exclude asthma, and do not use a single episode of wheeze in an infant to confirm bronchiolitis."},
    {tone:"amber", h:"Episodic viral wheeze is a pattern, not proof that asthma is absent", html:"Episodic viral wheeze describes wheeze occurring only during viral infections, with no symptoms between episodes. It is common in preschool children and may resolve with age, but some children with asthma have predominantly viral-triggered symptoms. In children under 5, asthma usually cannot be confirmed with routine objective testing (NG245); <b>document a working description such as \"episodic viral wheeze\" or \"suspected asthma\", and review the pattern over time</b> — especially with recurrent severe episodes, interval symptoms, eczema, food allergy, allergic rhinitis, a strong family history, repeated oral-steroid courses or hospital attendances."},
    {tone:"blue", h:"The acute episode: pMDI and spacer first", html:"For mild-to-moderate acute wheeze in a cooperative child, salbutamol via a pressurised metered-dose inhaler and a valved SPACER (face mask if the child cannot seal around a mouthpiece; mouthpiece as soon as competent) is an effective alternative to nebulised treatment and may cause fewer systemic adverse effects. Nebulised treatment remains appropriate for severe disease, exhaustion or inability to use a spacer effectively. Typically 2–10 puffs, one puff at a time with 5 tidal breaths each, repeated as needed and reviewed. Reassess clinical response before discharge. <b>Give and check the spacer technique in the room</b> — the commonest reason an inhaler \"doesn't work\" is that the drug never reached the lung."},
    {tone:"green", h:"Multiple-trigger wheeze earns a preventer TRIAL", html:"Wheeze between colds — on exercise, laughing, crying, cold air, smoke or allergen exposure — suggests multiple-trigger wheeze and a higher probability of asthma/suspected asthma, especially with eczema, food allergy or a strong family history. Where symptoms need maintenance treatment, or episodes are severe (for example hospital admission or two or more courses of oral corticosteroids), NG245 advises an <b>8–12 week trial of twice-daily paediatric low-dose ICS</b> (SABA as needed), then stop it and review after a further 3 months — the stop date is what distinguishes a trial from a label."},
    {tone:"red", h:"🔴 When it is not wheeze at all", html:"A sudden choking episode then persistent unilateral wheeze or cough suggests inhaled foreign body → urgent same-day assessment for bronchoscopy, even if the child now looks well. <b>Barking cough with stridor = croup, not wheeze.</b> Wheeze from the first weeks of life, failure to thrive, wet chronic cough, clubbing, or a persistently abnormal chest = cystic fibrosis, primary ciliary dyskinesia, tracheobronchomalacia or a structural anomaly → paediatric referral. Atypical, recurrent or treatment-resistant wheeze requires reconsideration of the diagnosis: consider aspiration, gastro-oesophageal/laryngeal disease, congenital airway or cardiac disease, cystic fibrosis, primary ciliary dyskinesia, immunodeficiency and foreign body — do not simply give repeated salbutamol trials."}
  ],
  pathwaySub:"Four steps. Skipping the first one is how a foreign body becomes a three-month cough.",
  pathway:[
    {title:"Exclude the emergencies and the mimics", html:"NG9 referral criteria in bronchiolitis (usually under 2 years) · stridor and barking cough (croup) · sudden choking then focal signs (foreign body) · the chronic red flags that suggest a structural or genetic cause.", alert:true},
    {title:"Classify the wheeze", html:"Bronchiolitis (usually under 2; coryza then cough, tachypnoea, wheeze and/or fine crackles — not diagnosed on age or first episode alone) · episodic viral wheeze (only with colds, well in between — a pattern, not proof that asthma is absent) · multiple-trigger wheeze or suspected asthma (symptoms between colds). Confirm it IS wheeze — ask the parent to describe or imitate the sound, because \"wheeze\" is used for almost any noisy breathing."},
    {title:"Treat the acute episode", html:"Salbutamol via pMDI and spacer with a face mask, titrated to response; oral prednisolone only for a severe episode needing emergency or hospital-level treatment or per the child's documented acute asthma plan; oxygen and admission by the BTS/SIGN 158 acute severity criteria and local paediatric emergency pathways."},
    {title:"Decide about prevention — and set a stop date", html:"Episodic viral wheeze: no routine preventer. Symptoms needing maintenance treatment (often multiple-trigger wheeze) or severe episodes (for example admission or two or more oral corticosteroid courses): an 8–12 week trial of twice-daily paediatric low-dose ICS, then stop and review after 3 months (NG245). Ask about tobacco smoke and vaping exposure at every contact and offer direct cessation support."}
  ],
  sections:[

    {id:"safety", nav:"Admit now", title:"Red flags — admission, and the diagnoses that are not wheeze",
     blocks:[
       {b:"table", head:["Feature","Meaning","Action"], rows:[
         ["Apnoea, grunting, marked recession, respiratory rate over 70, central cyanosis, severe exhaustion, or a child who looks seriously unwell","<b>Severe bronchiolitis</b>","<b>Immediate referral for emergency care — call 999 where emergency transfer is needed.</b> These are the NG9 emergency-referral criteria and they apply regardless of how the child looked an hour ago. A normal or borderline SpO₂ does not override a seriously unwell appearance"],
         ["Respiratory rate over 60, difficulty breastfeeding or feeding at 50–75% of usual volume, clinical dehydration, or oxygen saturation persistently below 92% in air","<b>Moderate bronchiolitis</b>","<b>Consider urgent hospital assessment (NG9)</b>, taking account of age and risk factors — lower threshold for age under 3 months, prematurity, chronic lung disease, congenital heart disease, neuromuscular disease and immunodeficiency. <b>Feeding is the most useful single question to a parent</b> — a baby too breathless to feed is a baby in trouble"],
         ["Silent chest, exhaustion, poor respiratory effort, altered consciousness, agitation or cyanosis in a wheezy child (with SpO₂ under 92%)","<b>Life-threatening acute wheeze / asthma attack</b>","<b>999.</b> A silent chest may indicate minimal air movement — deterioration, not improvement"],
         ["In a child with suspected acute asthma/wheeze: SpO₂ below 92%, too breathless to talk or feed, HR over 140 or RR over 40 (age 2–5)","<b>Severe acute wheeze</b> (BTS/SIGN 158)","Oxygen, salbutamol 10 puffs via spacer or nebulised, oral prednisolone, and <b>emergency treatment and hospital assessment</b>. Consider the clinical picture, measurement reliability and response to initial treatment"],
         ["Sudden choking or coughing episode, then persistent cough or unilateral wheeze","<b>Inhaled foreign body</b>","Urgent same-day paediatric assessment for bronchoscopy — even if the child now appears well. The symptom-free interval after the initial event is what causes the delay in diagnosis"],
         ["<b>Barking cough, hoarse voice, inspiratory stridor</b>","<b>Croup — not wheeze</b>","Dexamethasone per the current local croup pathway: a single dose of 0.15 mg/kg may be used for mild disease; higher doses may be required for moderate or severe disease. Refer/admit for stridor at rest, marked recession, hypoxia, exhaustion or deterioration. Keep the child calm — distress worsens the obstruction — and avoid unnecessary throat examination"],
         ["Drooling, unable to swallow, muffled voice, tripod position, toxic-looking","<b>Epiglottitis or bacterial tracheitis</b>","<b>999. Do NOT examine the throat</b>"],
         ["Wheeze from the first weeks of life · failure to thrive · chronic wet or productive cough · clubbing · persistent focal or asymmetrical chest signs · recurrent or focal pneumonia · aspiration, swallowing difficulty or cough with feeds · choking or cyanotic episodes · persistent hypoxia · poor response to appropriate treatment · recurrent hospital admissions · abnormal cardiac signs · parental consanguinity or relevant family history · abnormal newborn screening or recurrent infections","Atypical, recurrent or treatment-resistant wheeze: cystic fibrosis, primary ciliary dyskinesia, tracheobronchomalacia, vascular ring, congenital airway or cardiac disease, gastro-oesophageal/laryngeal disease, immunodeficiency, aspiration or foreign body","<b>Paediatric referral — these do not get another salbutamol trial.</b> Check the newborn bloodspot result for CF"],
         ["<b>Fever with focal chest signs, and an unwell child</b>","<b>Pneumonia</b>","Treat per the <a href='chest-infections.html'>chest infections protocol</a>; admit if hypoxic, dehydrated or systemically unwell"]
       ]},
       {b:"warn", html:"<b>Two errors define this area.</b> <b>Treating typical bronchiolitis as asthma</b> — giving salbutamol that NG9 explicitly says does not work, and sometimes steroids too. <b>And getting the label wrong in either direction</b> — labelling every wheezy 2-year-old as asthmatic when asthma usually cannot be objectively confirmed at that age, or falsely reassuring that \"viral wheeze is not asthma\" in a child with recurrent severe episodes, interval symptoms or atopy. The correct posture in the under-5s is a provisional description and a therapeutic trial with a review date, not a diagnosis."}
     ]},

    {id:"classify", nav:"Classify", title:"Which wheeze is this?",
     sub:"The classification determines everything that follows.",
     blocks:[
       {b:"table", head:["Pattern","Recognising it","What it means"], rows:[
         ["<b>Bronchiolitis</b>","Usually under 2 years, most commonly in the first year (particularly 3–6 months). Typically follows 1–3 days of coryza, then cough, tachypnoea, increased work of breathing, fine inspiratory crackles and/or high-pitched expiratory wheeze, with feeding difficulty. Age, first episode and wheeze alone are not sufficient for diagnosis — an infant can also have asthma-like wheeze, congenital airway disease, aspiration, foreign body or cardiac disease. Low-grade fever. RSV in most cases; peak at days 3–5","Supportive care only. Bronchodilators, steroids, antibiotics and montelukast are all specifically NOT recommended (NG9). Cough can persist for up to 3 weeks — tell the parents this, or they will return worried"],
         ["<b>Episodic viral wheeze</b>","Wheeze ONLY during viral upper respiratory infections, completely well and symptom-free between episodes. No interval symptoms, often no atopy. Typically 1–5 years","Episodic viral-triggered wheeze; asthma cannot be confirmed under 5, and many children improve with age. Review if episodes become severe or frequent, or interval symptoms develop. <b>No routine preventer; treat episodes with salbutamol via spacer</b>"],
         ["<b>Multiple-trigger wheeze</b>","Wheeze with colds AND between them — on exercise, laughing, crying, cold air, smoke or allergen exposure. Often with eczema, food allergy, allergic rhinitis or a strong family history of atopy","<b>Higher probability of asthma/suspected asthma</b>, especially with atopy or family history. <b>Consider an ICS TRIAL with a planned stop and reassessment if maintenance treatment is indicated</b>"],
         ["<b>Focal/unilateral or abrupt-onset symptoms</b>","Unilateral wheeze or focal signs, sudden onset or a choking episode","Consider foreign body or structural disease — see red flags"],
         ["<b>Suspected asthma (over 5)</b>","Interval symptoms, nocturnal cough or wheeze, exercise limitation, documented response to a bronchodilator, atopy","<b>Over 5, objective testing becomes possible.</b> See <a href='asthma-children.html'>asthma in children</a>"],
         ["<b>Not wheeze at all</b>","Stridor (inspiratory, upper airway) · stertor (snoring, nasal) · transmitted upper-airway noise from secretions · a wet rattly chest from post-nasal drip","Ask the parent to imitate the sound, or listen yourself before accepting the word. Parental \"wheeze\" corresponds to true wheeze on examination in only a minority of cases"]
       ]},
       {b:"dl", rows:[
         ["<b>Why the under-5 label matters so much</b>","In children under 5, asthma usually cannot be confirmed with routine objective testing (NG245). Diagnosis is based on symptom pattern, examination, exclusion of alternative diagnoses and response to a time-limited treatment trial, and should be recorded as \"episodic viral wheeze\" or \"suspected asthma\" with a review date. If symptoms persist to age 5, attempt objective testing where feasible"],
         ["<b>What raises the probability of true asthma</b>","Interval symptoms between infections · eczema or food allergy · allergic rhinitis · parental asthma or atopy · male sex · early sensitisation to aeroallergens · frequent or severe episodes requiring repeated oral-steroid courses, hospital attendances or admission"],
         ["<b>What lowers it</b>","Symptoms only with colds · complete freedom from symptoms in between · no personal or family atopy · onset in infancy with a clear viral trigger each time"]
       ]}
     ]},

    {id:"acute", nav:"Acute", title:"Treating the acute episode",
     blocks:[
       {b:"table", head:["Situation","Treatment","Notes"], rows:[
         ["Mild–moderate acute wheeze, child over 1 with episodic viral or multiple-trigger wheeze","Salbutamol via pMDI and valved spacer — face mask where the child cannot use a mouthpiece effectively, mouthpiece as soon as competent — typically 2–10 puffs, ONE puff at a time with about 5 tidal breaths after each, repeated according to response. Observe the technique","For mild-to-moderate acute wheeze in a cooperative child, pMDI plus spacer is an effective alternative to nebulised treatment and may cause fewer systemic adverse effects (tremor, tachycardia). Do not routinely prescribe a nebuliser for mild/moderate wheeze. Reassess clinical response after treatment and before discharge"],
         ["<b>Severe episode</b>","Oxygen to SpO₂ 94–98%, salbutamol 10 puffs via spacer or nebulised, adding ipratropium if the response is poor, oral prednisolone, and admission (BTS/SIGN 158)","In suspected acute asthma/wheeze, <b>SpO₂ below 92%, silent chest, exhaustion, altered consciousness or cyanosis indicates severe or life-threatening disease → emergency treatment and hospital assessment (999 if life-threatening)</b>. A silent chest may indicate minimal air movement, not improvement"],
         ["<b>Oral corticosteroid</b>","Consider oral prednisolone for a severe acute wheeze/asthma episode requiring emergency or hospital-level treatment, or in accordance with the child's documented acute asthma plan. The BTS/SIGN 158 acute-asthma regimen is 20 mg once daily for age 2–5, usually for up to 3 days (BNFC 1–2 mg/kg, max 40 mg) — verify against the current BNFC and local acute-asthma pathway","Do not routinely prescribe oral corticosteroids for mild episodic viral wheeze managed in the community — the evidence for benefit in that group is weak. Repeated systemic steroid courses are not benign and should prompt paediatric review"],
         ["<b>Bronchiolitis (usually under 2)</b>","<b>Supportive only: feeding and hydration assessment and support, fluids, oxygen if needed</b>","Do NOT give salbutamol, ipratropium, nebulised adrenaline, montelukast, antibiotics (unless there is another bacterial infection) or corticosteroids (NG9). Do not use a lack of response to salbutamol to exclude asthma; reassess the diagnosis if wheeze recurs, with marked atopy, persistent symptoms or an atypical examination"],
         ["<b>Croup</b>","Oral dexamethasone as a single dose per the current local croup pathway — 0.15 mg/kg may be used for mild disease; higher doses may be required for moderate or severe disease (prednisolone is an alternative if dexamethasone is unavailable). Nebulised adrenaline may be used in moderate/severe croup according to local emergency guidance — it is not recommended in bronchiolitis, but is not contraindicated in croup","Refer/admit for stridor at rest, marked recession, hypoxia, exhaustion or deterioration. <b>Keep the child calm and on the parent's lap</b> and avoid unnecessary throat examination"],
         ["<b>Antibiotics</b>","<b>Not indicated for wheeze or bronchiolitis</b>","Only for genuine bacterial infection — focal signs, high fever and an unwell child. See <a href='chest-infections.html'>chest infections</a>"],
         ["<b>Montelukast</b>","Not for bronchiolitis. Not routinely useful in episodic viral wheeze — the evidence is inconsistent","Before prescribing, discuss possible neuropsychiatric effects, including nightmares, sleep disturbance, aggression, anxiety, mood change, suicidal thoughts and behaviour (MHRA). Advise the parent/carer to seek medical advice promptly if these occur; <b>discontinue montelukast if new or worsening neuropsychiatric symptoms develop</b>. Review it specifically at the next appointment"]
       ]}
     ]},

    {id:"preventer", nav:"Preventer?", title:"Prevention — a trial with a stop date, not a label",
     blocks:[
       {b:"table", head:["Situation","Action"], rows:[
         ["<b>Episodic viral wheeze, infrequent mild episodes</b>","No routine preventer. Salbutamol via spacer for episodes, a written plan, and review"],
         ["Suspected asthma with symptoms needing maintenance treatment (often multiple-trigger wheeze), or severe acute episodes (for example hospital admission or two or more courses of oral corticosteroids). Frequent urgent attendances may also prompt specialist assessment according to clinical judgement","Trial twice-daily paediatric low-dose ICS plus SABA as needed for 8–12 weeks (NG245). If symptoms resolve, <b>stop the ICS and review after a further 3 months</b>. If there is no clear benefit, do not continue it by default"],
         ["<b>Symptoms recur by the 3-month review, or an attack needs systemic steroids or hospital</b>","This supports a working diagnosis of suspected asthma: restart regular paediatric low-dose ICS with SABA as needed (NG245), titrate to the lowest effective dose and review at least annually. See <a href='asthma-children.html'>asthma in children</a>"],
         ["<b>No benefit on the trial</b>","<b>Stop the ICS, revisit the diagnosis (NG245), and reconsider the mimics</b> — check inhaler technique, adherence and environmental exposures including smoke, reconsider alternative diagnoses including a structural or genetic cause, and refer if these do not explain the lack of response"],
         ["Uncontrolled on paediatric moderate-dose ICS: an LTRA trial for approximately 8–12 weeks (3 months), stopped if ineffective or if adverse effects occur (NG245); frequent oral steroid courses","<b>Paediatric referral</b> if still uncontrolled"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"red", h:"🚭 Ask about smoke and vaping exposure", html:"Ask about tobacco smoke and vaping exposure at every contact, including smoking in the home or car and residue on clothing. Smoking outside reduces but does not eliminate exposure. <b>Offer direct, practical smoking-cessation support</b>, because exposure worsens symptoms, exacerbation risk and treatment response."},
         {tone:"blue", h:"🔬 What to check before escalating", html:"Inhaler and spacer technique (observed, not asked about) · adherence · smoke exposure · whether the sound is actually wheeze · the chronic red flags. Escalating treatment past poor technique is the commonest avoidable error."},
         {tone:"amber", h:"⚠ Review the label as the child grows", html:"A \"pre-school wheeze\" or \"suspected asthma\" entry needs revisiting at school age. Many children will have stopped wheezing entirely; others will have persistent or recurrent symptoms — if symptoms persist to age 5, attempt objective testing where feasible (NG245)."},
         {tone:"green", h:"✓ Allergy and atopy", html:"Treat coexisting eczema and allergic rhinitis properly — both worsen wheeze control. See <a href='eczema.html'>eczema</a> and <a href='allergic-rhinitis.html'>allergic rhinitis</a>; consider <a href='cmpa.html'>CMPA</a> in an infant with wheeze, eczema and gut symptoms."}
       ]}
     ]},

    {id:"parents", nav:"Parents", title:"What to tell the family",
     blocks:[
       {b:"say", html:"What Alfie has is what we call pre-school viral wheeze. His airways are small and springy, and when he catches a cold they narrow and make that whistling sound. It can look and sound like asthma. Many children improve as their airways mature, but symptoms may persist or recur later, so we'll keep reviewing the pattern over time. Because he's completely well between colds, I'm not starting a daily preventer inhaler today — but if he starts having symptoms between colds or more severe episodes, we'll look at this again. What I will do is give you the blue inhaler and a spacer for when he's wheezy, show you exactly how to use it, and tell you the signs that mean he needs to be seen the same day."},
       {b:"cards", items:[
         {tone:"red", h:"🔴 Emergency assessment — 999 / A&amp;E now", html:"\"Blue lips or face · pauses in breathing · sucking in hard under the ribs or at the neck · grunting · drowsy, floppy or less responsive · a very quiet chest while working hard to breathe · unable to feed, speak or drink because of breathlessness · you think something has been breathed in or choked on · noisy breathing in (stridor) at rest with distress · or the inhaler is not helping, or is needed much more often than advised (for example not lasting 4 hours).\""},
         {tone:"amber", h:"🟠 Same-day appointment", html:"\"Breathing getting harder work, needing the inhaler repeatedly or more often than usual, feeding less than about half normal or fewer wet nappies, a fever that persists with fast breathing, or you are simply worried and it is getting worse rather than better.\""},
         {tone:"blue", h:"💊 The spacer, every time", html:"\"Use a valved spacer — with a face mask until he can seal his lips around the mouthpiece. One puff at a time into the spacer, then five normal breaths, then the next puff. Never puff several times into the spacer at once. Clean it according to the manufacturer's instructions and let it drip dry — don't rub it, as that creates static that sticks the drug to the wall. Show me how you'd do it.\""},
         {tone:"green", h:"✓ What to expect", html:"\"The cough after a chest infection can go on for up to three weeks even though he's getting better. Many children improve as their airways mature, but symptoms may persist or recur later — come back if he has symptoms between colds or more severe episodes.\""}
       ]}
     ]},

    {id:"monitor", nav:"Follow up", title:"Review",
     blocks:[
       {b:"table", head:["When","What to do"], rows:[
         ["<b>After an acute episode</b>","Review within 48 hours if managed at home, and after any hospital attendance. Check technique, confirm the plan and identify triggers"],
         ["<b>8–12 weeks into an ICS trial</b>","Reassess deliberately: if symptoms have resolved, stop the ICS and review again after 3 months (NG245); if there was no clear benefit, stop it and revisit the diagnosis. Never let a trial become an indefinite prescription by default"],
         ["<b>At least annually in any child on a preventer</b>","Technique observed, adherence, growth (height and weight plotted), smoke exposure, episode frequency, and whether the treatment is still needed"],
         ["<b>At school age</b>","Revisit the diagnosis. If symptoms persist to age 5, attempt objective testing where feasible (NG245); many children will have stopped wheezing and can have the label removed"]
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Emergency transfer / immediate admission", html:"NG9 emergency criteria: apnoea, severe respiratory distress (grunting, marked recession, RR over 70), central cyanosis, severe exhaustion, or a child who looks seriously unwell. SpO₂ below 92% in suspected acute asthma/wheeze (BTS/SIGN 158). <b>Silent chest, exhaustion or altered consciousness in a wheezy child.</b> <b>Suspected epiglottitis — do not examine the throat.</b>"},
         {tone:"red", h:"⚡ Urgent same-day — inhaled foreign body", html:"A sudden choking episode followed by persistent cough or unilateral wheeze needs same-day paediatric assessment for bronchoscopy, even if the child now looks well. The well-looking interval after the event is precisely why this diagnosis is delayed."},
         {tone:"amber", h:"Paediatric referral", html:"Chronic red flags (wheeze from the first weeks of life, failure to thrive, wet chronic cough, clubbing, focal or asymmetrical signs, recurrent pneumonia) · diagnostic uncertainty · frequent severe episodes · still uncontrolled on paediatric moderate-dose ICS after an LTRA trial (NG245) · repeated oral steroid courses · frequent urgent attendances (clinical judgement) · atypical, recurrent or treatment-resistant wheeze, including cough with feeds, choking or cyanotic episodes, persistent hypoxia, recurrent admissions, abnormal cardiac signs or recurrent infections."},
         {tone:"blue", h:"Allergy / respiratory paediatrics", html:"Significant coexisting food allergy or suspected allergic asthma requiring specialist assessment."},
         {tone:"cream", h:"GP management", html:"Primary care owns: classifying the wheeze, the acute spacer-delivered salbutamol, deciding whether a preventer trial is justified and stopping it if it fails, smoke-exposure work, technique teaching, the written plan and the safety-net. Related pages: <a href='asthma-children.html'>asthma in children</a> · <a href='chest-infections.html'>chest infections</a> · <a href='eczema.html'>eczema</a> · <a href='allergic-rhinitis.html'>allergic rhinitis</a> · <a href='cmpa.html'>CMPA</a> · <a href='../algorithms/wheeze-child.html'>wheeze in children pathway</a>."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A <b>2-year-old</b> is brought by his mother with his <b>fourth wheezy episode this winter</b>, each one starting with a runny nose and settling within a week. He is <b>completely well between episodes</b>, running about normally, with no eczema and no family history of asthma. His mother is exhausted, says <b>\"the nursery keeps saying he's asthmatic\"</b>, and asks to be <b>started on a brown preventer inhaler</b> like her sister's child. She smokes, <b>\"but only outside\"</b>. Today he is wheezy but feeding, alert and not recessing."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Classifies this as episodic viral wheeze — wheeze only with colds, symptom-free between, no atopy — and explains it as a pattern that often improves with age rather than proof that asthma is absent; explains that under 5 asthma usually cannot be confirmed by routine objective testing, so a label would be provisional and carries consequences; <b>declines the preventer with a reason rather than a refusal</b>, and says what would change that decision (symptoms between colds, frequent severe attacks); treats today's episode with salbutamol via pMDI and spacer and TEACHES the technique in the room, one puff with five breaths; addresses smoking including third-hand smoke on clothing and offers cessation support to her, not just advice; <b>gives the red-flag safety-net in concrete parent language</b> (too breathless to feed, recession, inhaler not helping or needed more often than advised); <b>warns the cough may persist up to 3 weeks</b>; arranges review and explains many children improve with age but the pattern will be reviewed over time; and <b>validates her exhaustion rather than dismissing the nursery's comment.</b>"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Sources and the recommendations each supports. Use NG245 for diagnosis and chronic pharmacological management; use the current BTS/SIGN acute-asthma recommendations for acute attack severity and treatment, subject to local paediatric emergency pathways. Verify all paediatric doses against the current BNF for Children and local paediatric pathway.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG9 — Bronchiolitis in children: diagnosis and management</b><br><a href="https://www.nice.org.uk/guidance/ng9" rel="noopener">nice.org.uk/guidance/ng9</a><span class="rd"> — updated August 2021: the emergency-referral criteria (apnoea, looks seriously unwell, severe respiratory distress, central cyanosis), the consider-referral criteria (RR over 60, 50\u201375% of usual intake, dehydration, SpO\u2082 persistently below 92% in air), the risk groups, and the explicit recommendations against bronchodilators, adrenaline, montelukast, antibiotics and corticosteroids</span></li>'+
         '<li>NICE NG245 (joint with BTS and SIGN) — Asthma: diagnosis, monitoring and chronic asthma management (2024)<br><a href="https://www.nice.org.uk/guidance/ng245" rel="noopener">nice.org.uk/guidance/ng245</a><span class="rd"> — that asthma usually cannot be confirmed by objective testing in the under-5s, with objective tests attempted at age 5 if symptoms persist; the 8\u201312 week trial of twice-daily paediatric low-dose ICS, stopping and review after 3 months, restarting if symptoms recur, and the LTRA trial then referral</span></li>'+
         '<li><b>BTS/SIGN 158 — British guideline on the management of asthma (2019, amended 2024)</b><br><a href="https://www.sign.ac.uk/sign-158-british-guideline-on-the-management-of-asthma" rel="noopener">sign.ac.uk/sign-158</a><span class="rd"> — NG245 replaced its diagnosis, monitoring and chronic-management sections in November 2024; the acute-attack sections cited here remain current — acute severity in children aged 2\u20135 (SpO\u2082 under 92%, HR over 140, RR over 40), spacer-delivered salbutamol 2\u201310 puffs, and prednisolone 20 mg for up to 3 days in 2\u20135s</span></li>'+
         '<li><b>International: ERS Task Force — Brand PLP et al. Definition, assessment and treatment of wheezing disorders in preschool children: an evidence-based approach. Eur Respir J 2008;32(4):1096–1110</b><br><a href="https://pubmed.ncbi.nlm.nih.gov/?term=Brand+wheezing+disorders+preschool+children+evidence-based+approach" rel="noopener">pubmed.ncbi.nlm.nih.gov</a><span class="rd"> — the episodic viral versus multiple-trigger wheeze terminology (no UK guideline defines these terms). A phenotype/classification framework for describing patterns, not a diagnostic standard that proves a child does or does not have asthma</span></li>'+
         '<li><b>MHRA Drug Safety Update — Montelukast: reminder of the risk of neuropsychiatric reactions</b><br><a href="https://www.gov.uk/drug-safety-update" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> — neuropsychiatric reactions including sleep disturbance, nightmares, aggression, anxiety, mood change, suicidal thoughts and behaviour; counsel families, seek advice promptly, and stop montelukast if new or worsening neuropsychiatric symptoms develop</span></li>'+
         '<li><b>BNF for Children</b><br><a href="https://bnfc.nice.org.uk" rel="noopener">bnfc.nice.org.uk</a><span class="rd"> — salbutamol, corticosteroid and dexamethasone dosing in children, including dexamethasone 150 micrograms/kg as a single dose for mild croup (higher doses may be required for moderate or severe croup — follow the local croup pathway). All doses on this page must be verified against the current BNFC and local paediatric pathway</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Pre-school wheeze — NICE NG9 (updated 2021), NICE NG245 (2024, joint with BTS and SIGN), BTS/SIGN 158 (2019, amended 2024) for acute attack severity and treatment only, subject to local paediatric emergency pathways, and the MHRA montelukast advice. Episodic viral wheeze is a pattern, not proof that asthma is absent: wheeze only with colds and complete freedom from symptoms in between often improves with age, but some children have asthma, and under 5 asthma usually cannot be confirmed by routine objective testing — so record a working description (episodic viral wheeze or suspected asthma) with a review date. Bronchiolitis usually affects children under 2 years. In bronchiolitis, bronchodilators, steroids, antibiotics and montelukast are all specifically not recommended; management is supportive and NG9 sets the admission thresholds. Treat acute episodes with salbutamol via a pMDI and spacer, teaching the technique in the room. A preventer is a time-limited trial with a planned stop, not a default. Verify all doses against the BNF for Children before prescribing."
});
