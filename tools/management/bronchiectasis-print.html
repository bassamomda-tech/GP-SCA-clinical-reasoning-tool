MG.render({

  title:"Bronchiectasis — the complete guide",

  stemTitle:"The cornerstone of bronchiectasis management is a physiotherapy technique, not a prescription — and the commonest primary-care error is treating an exacerbation like an ordinary chest infection",
  stemSub:"One page for established disease under shared care. Bronchiectasis is a self-perpetuating cycle of impaired mucus clearance → infection → inflammation → further airway damage, so <b>daily airway clearance is the single most important ongoing treatment</b> and adherence to it is worth checking at every review. Exacerbations need <b>sputum sent BEFORE antibiotics and a prolonged course of about 14 days</b>, not the five days a simple chest infection gets. Then the two findings that change everything — <b>Pseudomonas colonisation</b> and <b>non-tuberculous mycobacteria</b>.",

  nextReview:"14 March 2027",
  meta:[
    {t:"British Thoracic Society — bronchiectasis guideline"},
    {t:"BTS 2019 · NICE NG117 — bronchiectasis"},
    {t:"Exacerbation course ≈14 days, culture-guided", tone:"tw"},
    {t:"Check for NTM before any long-term macrolide", tone:"tw"},

  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"green", h:"Daily airway clearance is the most important treatment", html:"Active cycle of breathing techniques or a clearance device, performed DAILY — including when well. Refer to respiratory physiotherapy to be taught properly; this is not advice that works from a leaflet. <b>Adherence is the first thing to check when someone deteriorates</b>, before any escalation of drugs."},
    {tone:"red", h:"⚠ Send sputum BEFORE starting antibiotics", html:"Treat empirically if needed, then refine to sensitivities — but the sample must go before the first dose or the culture is wasted. Courses are typically about 14 days, considerably longer than for a simple chest infection, and under-treating an exacerbation is the commonest error on this page."},
    {tone:"amber", h:"Pseudomonas changes the prognosis and the plan", html:"<b>Pseudomonas colonisation is associated with worse outcomes.</b> Treat per sensitivities — often ciprofloxacin — and refer, because a FIRST isolation may warrant a specialist-guided eradication attempt. That window is easily missed if the result is simply filed."},
    {tone:"red", h:"⛔ Check for non-tuberculous mycobacteria before any long-term macrolide", html:"Azithromycin monotherapy in undiagnosed NTM infection drives macrolide resistance and compromises later treatment. Sputum for mycobacteria, plus ECG and LFTs, before a prophylactic macrolide is started — which is a specialist decision, not a primary-care one."},
    {tone:"blue", h:"Find the cause — some are treatable", html:"Post-infective, immunodeficiency, ABPA, cystic fibrosis, primary ciliary dyskinesia, aspiration, and rheumatoid- or IBD-associated disease. Baseline: sputum culture including Pseudomonas and mycobacteria, spirometry and immunoglobulins. Identifying a treatable cause changes management, so \"idiopathic\" should be a conclusion, not a default."},
    {tone:"green", h:"Prevention: vaccines, rehab, and treating the cause", html:"Annual influenza, pneumococcal and COVID-19 vaccination · pulmonary rehabilitation where breathlessness limits activity · smoking cessation and avoiding respiratory irritants · adequate hydration · nutrition maintained. Three or more exacerbations a year is the threshold for specialist prophylaxis."}
  ],
  pathwaySub:"Five steps. The second is the treatment; the third is where it goes wrong.",

    {title:"Treat exacerbations properly", html:"Sputum before antibiotics, empirical start, refine to sensitivities, about 14 days. <b>Give known patients a self-management or rescue plan.</b>"},
    {title:"Vaccinate, rehabilitate, treat the cause and comorbidities", html:"Influenza, pneumococcal and COVID-19; pulmonary rehab; smoking cessation; nutrition."},
    {title:"Monitor frequency, organism and function", html:"Exacerbations per year, sputum colonisation, spirometry trend and clearance adherence — with ≥3 a year triggering referral for prophylaxis."}

  sections:[

       {b:"table", head:["Element","Detail"], rows:[
         ["<b>Diagnosis</b>","Chronic productive cough with recurrent infections, confirmed on CT chest showing airway dilatation"],
         ["<b>Find a cause</b>","Post-infective · immunodeficiency · ABPA · cystic fibrosis · primary ciliary dyskinesia · aspiration · rheumatoid- or IBD-associated"],
         ["<b>Baseline investigations</b>","Sputum culture including Pseudomonas and mycobacteria · spirometry · immunoglobulins · consider specialist work-up"],
         ["<b>Assess severity</b>","Exacerbation frequency, sputum colour and volume, breathlessness, and which organisms are colonising"]
       ]},
       {b:"why", html:"Bronchiectasis is a self-perpetuating cycle: impaired mucus clearance leads to infection, which drives inflammation, which causes further airway damage and worse clearance. That is why daily airway clearance is the cornerstone rather than an adjunct, and why exacerbations need prolonged, culture-guided courses rather than the five days a simple chest infection gets. Identifying a treatable cause and detecting Pseudomonas colonisation both change management materially."}
     ]},

    {id:"clearance", nav:"Clearance", title:"Step 2 — airway clearance and prevention: the non-drug cornerstone",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"🌬️ Airway clearance — daily", html:"<b>Active cycle of breathing techniques, or a clearance device.</b> The most important ongoing treatment — refer to respiratory physiotherapy to be taught it properly, and reinforce that it continues when well."},
         {tone:"green", h:"💉 Vaccination", html:"<b>Annual influenza, pneumococcal and COVID-19.</b>"},
         {tone:"blue", h:"🏃 Pulmonary rehabilitation", html:"<b>For those whose breathlessness limits activity.</b>"},
         {tone:"amber", h:"🚭 Smoking and irritants", html:"<b>Cessation support; avoid respiratory irritants.</b>"},
         {tone:"blue", h:"💧 Hydration and mucoactives", html:"Adequate hydration; humidification or mucoactive agents on specialist advice."},
         {tone:"green", h:"🍽️ Nutrition and comorbidity", html:"<b>Maintain nutrition; treat the underlying cause and any comorbidities.</b>"}
       ]}
     ]},

    {id:"exacerbation", nav:"Exacerbation", title:"Step 3 — exacerbations and maintenance antibiotics",
     blocks:[
       {b:"table", head:["Situation","Treatment","Detail"], rows:[
         ["<b>Exacerbation</b>","<b>Culture-guided antibiotics, prolonged course of about 14 days</b>","Send sputum BEFORE starting; treat empirically, then refine to sensitivities. <b>Courses are longer than for simple chest infections.</b> Give known patients a self-management or rescue plan"],
         ["<b>Pseudomonas isolated</b>","<b>Targeted therapy per sensitivities — often ciprofloxacin</b>","<b>A first isolation may prompt a specialist-guided eradication attempt</b> — refer rather than simply filing the result"],
         ["<b>Frequent exacerbations — 3 or more a year</b>","Specialist maintenance: long-term prophylactic antibiotics (for example azithromycin 250–500 mg three times weekly), nebulised antibiotics, or mucoactive treatment","Specialist-initiated only, with ECG, LFTs and a mycobacteria check before any macrolide"]
       ]},
       {b:"warn", html:"Do not under-treat an exacerbation — it needs a longer course and culture guidance. Pseudomonas colonisation worsens prognosis and warrants specialist input. And check for non-tuberculous mycobacteria before starting a long-term macrolide, because azithromycin monotherapy in undiagnosed NTM drives resistance and compromises the treatment the patient will later need."}
     ]},

    {id:"monitor", nav:"Monitor", title:"Step 4 — monitoring and review",

       {b:"table", head:["What","When","Action"], rows:[

         ["<b>Airway clearance adherence</b>","<b>Each review</b>","Reinforce — it is the key ongoing therapy and the first thing to check when control slips"]
       ]},

         ["<b>After diagnosis</b>","Establish care: airway clearance and physiotherapy, vaccinations, a self-management plan, and treatment of the underlying cause"],

         ["<b>Annually and ongoing</b>","Structured review: exacerbation frequency, sputum and colonisation, spirometry, adherence and comorbidity"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 Massive haemoptysis", html:"<b>\"Coughing up a large amount of blood — call 999.\"</b>"},
         {tone:"amber", h:"🟠 Exacerbation", html:"\"More or discoloured phlegm, more breathless, or feeling unwell — contact us early. You will likely need a longer antibiotic course and a phlegm sample.\""},
         {tone:"green", h:"🌬️ Clearance", html:"\"Daily breathing and clearance exercises are the most important treatment — keep them up even when you feel well.\""},
         {tone:"green", h:"💉 Vaccines", html:"\"Keep your flu, pneumonia and COVID vaccines up to date — they reduce infections.\""}
       ]}
     ]},

    {id:"troubleshoot", nav:"Frequent flares?", title:"Frequent exacerbations or declining? Check this first",
     sub:"Optimise the basics and identify colonisation before escalating.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"1 · Airway clearance", html:"<b>Is daily physiotherapy actually being done?</b> Ask specifically how and how often, not whether."},
         {tone:"amber", h:"2 · Organism", html:"<b>Sputum culture — is Pseudomonas or NTM driving the exacerbations?</b>"},
         {tone:"amber", h:"3 · Course length", html:"Were the exacerbations treated for long enough (about 14 days) and culture-guided?"},
         {tone:"blue", h:"4 · Cause", html:"Is the underlying cause — immunodeficiency, ABPA, reflux or aspiration — actually being treated?"},
         {tone:"blue", h:"5 · Refer", html:"3 or more exacerbations a year, Pseudomonas, or functional decline → respiratory specialist."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"When to refer to respiratory",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Emergency", html:"Massive haemoptysis, or a severe exacerbation with respiratory failure → 999 or admit."},
         {tone:"amber", h:"Pseudomonas or NTM", html:"New Pseudomonas isolation (for possible eradication) or non-tuberculous mycobacteria → specialist."},
         {tone:"amber", h:"Frequent exacerbations", html:"3 or more a year, or for consideration of long-term or nebulised antibiotics or mucoactive therapy."},
         {tone:"blue", h:"Cause work-up", html:"Suspected immunodeficiency, ABPA, cystic fibrosis or ciliary dyskinesia → specialist."},
         {tone:"blue", h:"Declining function", html:"<b>Progressive symptoms or lung-function decline.</b>"},
         {tone:"cream", h:"GP management", html:"Shared care: airway clearance and physiotherapy referral, vaccination, prompt culture-guided exacerbation treatment, pulmonary rehabilitation, nutrition and the structured annual review all belong here. Related pages: <a href='asthma.html'>asthma</a> · <a href='copd.html'>COPD</a> · <a href='chest-infections.html'>chest infections</a> · <a href='../algorithms/chronic-cough.html'>chronic cough pathway</a>."}
       ]},
       {b:"say", html:"The cornerstone of managing bronchiectasis is daily airway-clearance exercises — a physiotherapist will teach you, and they matter most on the days you feel well. When you get a flare-up, we treat it early with a longer antibiotic course than usual, guided by a phlegm sample — so send one in before you start the tablets. And keep your vaccinations up to date."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 58-year-old woman with post-infective bronchiectasis attends having had <b>four courses of antibiotics in the past year</b>, each <b>five days of amoxicillin</b> issued by different clinicians, with <b>no sputum samples sent</b>. She reports daily green sputum and increasing breathlessness. She was shown breathing exercises \"years ago\" but <b>stopped doing them once she felt better</b>. She asks whether she should be on \"a permanent antibiotic\"."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Recognises the exacerbations were systematically under-treated — five days instead of about 14, and empirical instead of culture-guided; sends sputum for culture INCLUDING Pseudomonas and mycobacteria before the next course; identifies lapsed airway clearance as the modifiable cornerstone and re-refers to respiratory physiotherapy rather than treating this as a drug problem; <b>explains why clearance continues when well</b>; recognises ≥3 exacerbations a year as the referral threshold for prophylaxis and refers rather than starting azithromycin in primary care; knows that NTM must be excluded and ECG and LFTs checked before any long-term macrolide, and can explain the resistance risk; <b>checks vaccination status and offers pulmonary rehabilitation</b>; <b>revisits the underlying cause</b>; and <b>gives the haemoptysis and exacerbation safety-net</b>."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",

         '<li><b>NICE NG117 \u2014 Bronchiectasis (non-cystic fibrosis), acute exacerbation: antimicrobial prescribing</b><br><a href="https://www.nice.org.uk/guidance/ng117" rel="noopener">nice.org.uk/guidance/ng117</a><span class="rd"> — the primary-care role under shared care, baseline investigations, the cause list, vaccination and pulmonary rehabilitation, the review structure, and the referral thresholds including 3 or more exacerbations a year</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — azithromycin 250–500 mg three times weekly for prophylaxis, ciprofloxacin for Pseudomonas, and the ECG and hepatic monitoring required with long-term macrolides</span></li>'+
         '</ul></div>'}
     ]}

  foot:"Bronchiectasis in adults — British Thoracic Society guidance (2019) and NICE NG117. Daily airway clearance is the cornerstone and the first thing to check when control slips. Send sputum before starting antibiotics, and treat exacerbations for about 14 days guided by culture — not the five days a simple chest infection gets. Pseudomonas colonisation worsens prognosis and a first isolation may warrant specialist-guided eradication. Exclude non-tuberculous mycobacteria and check ECG and LFTs before any long-term macrolide. Three or more exacerbations a year is the threshold for specialist prophylaxis. Verify doses against the current BNF before prescribing."
