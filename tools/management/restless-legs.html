  stemSub:"One page for the whole condition. Exclude the mimics (cramps, akathisia, claudication, neuropathy) and the secondary causes; confirm all four URGE criteria; check ferritin and transferrin saturation, treating to a ferritin above 75 even when the lab calls it normal — and if you find unexplained iron-deficiency anaemia, complete the NICE NG12 GI cancer pathway rather than just replacing iron. Then correct iron and drug triggers first, and use an alpha-2-delta ligand ahead of a dopamine agonist because of augmentation. AASM 2024 · NICE NG12.",

  ],
  lead:"<div class='mg-layers'><a href='#severe'><b>Red flags</b><small>Mimics · IDA · cord</small></a><a href='#diagnose'><b>Diagnose</b><small>All four URGE criteria</small></a><a href='#ladder'><b>Treat</b><small>Iron first, then α-2-δ</small></a><a href='#augmentation'><b>Augmentation</b><small>Do not raise the dose</small></a></div>",
  quickSub:"If you read nothing else on this page, read these six cards. Every figure traces to the source cited under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"purple", h:"⚠ Unexplained iron-deficiency anaemia → the NG12 GI cancer pathway <span class='tw'>2WW</span>", html:"RLS is strongly iron-linked, so you will check ferritin — which makes this page a cancer safety net. If iron-deficiency anaemia is found and unexplained, follow the NICE NG12 route: offer FIT to any adult with iron-deficiency anaemia, and refer on the suspected colorectal cancer pathway if FIT is ≥10 µg Hb/g; a negative FIT does not rule out referral if concern persists. Men and post-menopausal women with new IDA also warrant upper and lower GI investigation (BSG 2021). <b>Do not simply replace the iron and discharge</b> — RLS is the presenting symptom, but the occult colorectal or gastric cancer is the diagnosis you must not miss.", src:"NICE NG12"},
    {tone:"amber", h:"Ferritin above 75 — “normal” is not the target", html:"Check serum ferritin AND transferrin saturation. Replace iron if ferritin is ≤75 µg/L or TSAT &lt;20% (oral or IV); if ferritin is 75–100 µg/L, oral iron is poorly absorbed, so IV iron (e.g. ferric carboxymaltose, specialist route) is the option (AASM 2024). Check iron studies in the morning, avoiding iron-containing food and supplements for 24 hours. Even when ferritin is within the laboratory normal range, a level below 75 warrants iron replacement in symptomatic RLS, because the relevant deficiency is in the brain, not necessarily the blood. Ferritin is an acute-phase reactant — check CRP alongside, since inflammation elevates it spuriously and masks functional iron deficiency."},
    {tone:"blue", h:"All four URGE criteria are required", html:"U — Urge to move the legs with an uncomfortable crawling, creeping or fizzing sensation. R — Rest or inactivity worsens it. G — Gets better with movement, for as long as the movement continues. E — Evening or night predominance. <b>The circadian element is the most discriminating feature.</b> The question that does the work: “is it worse when you sit still in the evening, and does getting up and walking ease it?”"},
    {tone:"green", h:"Alpha-2-delta ligands now come BEFORE dopamine agonists", html:"Gabapentin 300 mg or pregabalin 75 mg in the evening (titrated) is preferred first-line — no augmentation, and helpful where pain, neuropathy or anxiety coexist; caution sedation, dependence and falls in older people. Dopamine agonists (ropinirole 0.25–4 mg, pramipexole 88–540 micrograms, rotigotine 1–3 mg/24 h patch) are no longer recommended for routine use (AASM 2024 advises against standard use; cabergoline strongly against) — they work at first but frequently cause augmentation and impulse-control disorders over months to years. Reserve for individualised, usually short-term or intermittent use after counselling; patients already on one need monitoring, not abrupt withdrawal."},
    {tone:"red", h:"Augmentation: earlier, worse, spreading — never increase the dose", html:"A paradoxical drug-induced worsening from long-term dopamine agonists: symptoms start earlier in the day, become more intense, spread to previously unaffected limbs (arms, trunk), and each dose gives shorter relief. It is often misread as disease progression, prompting a dose increase — which makes it worse, and is one of the commonest reasons RLS becomes refractory. Management: do not escalate; recheck and optimise iron; reduce and cross-taper to an alpha-2-delta ligand (usually with neurology), expecting a temporary withdrawal flare."},
    {tone:"teal", h:"Ask about gambling directly — patients will not volunteer it", html:"Dopamine agonists carry a real risk of impulse-control disorders — new gambling, compulsive shopping, hypersexuality, binge eating. Ask directly at every review, because patients rarely disclose spontaneously; their presence mandates dose reduction or withdrawal. Also warn about <b>sudden-onset sleep</b> and driving. Low-dose levodopa is for predictable occasional symptoms only (e.g. a long flight) — daily use carries the highest augmentation risk of all."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step is where the cancer and the cord lesion hide.",
  pathway:[
    {title:"Exclude the mimics, the secondary causes and the sinister", html:"Painful, unilateral or fixed-position leg symptoms → not typical RLS: consider radiculopathy, neuropathy or claudication; examine pulses and neurology. New restlessness on a dopamine antagonist → akathisia, not RLS. Unexplained iron-deficiency anaemia → the NG12 GI pathway. Pregnancy (up to 1 in 5 in the third trimester) → iron and folate, non-drug measures. Renal failure or dialysis → check U&amp;E, liaise with renal. Rapidly progressive, or with weakness, a sensory level or bladder/bowel change → exclude cord or cauda equina pathology.", alert:true},
    {title:"Confirm all four URGE criteria", html:"Urge to move · Rest worsens · Gets better with movement · Evening or night predominance. Add the <b>sleep and bed-partner history</b> (severe sleep-onset and maintenance insomnia; periodic limb movements of sleep in about 80%, with the partner reporting rhythmic kicks), the <b>family history</b> (50% of primary RLS is familial, autosomal dominant, and early onset is more often genetic), and the <b>drug and substance triggers</b>."},
    {title:"Examine and investigate — ferritin is the test that matters", html:"Neurological examination (normal in primary RLS; sensory signs suggest neuropathy or radiculopathy) and vascular examination (pulses, capillary refill, ABPI if claudication is suspected). Bloods: ferritin + transferrin saturation with CRP, FBC, U&amp;E, HbA1c or glucose, TFTs, B12 and folate, pregnancy test where relevant. No routine imaging or sleep study — polysomnography only for diagnostic doubt, suspected sleep apnoea or atypical features."},
    {title:"Correct iron and drug triggers, then medicate if troublesome", html:"Oral ferrous sulfate or fumarate with vitamin C, alternate-day dosing for absorption and tolerability; recheck ferritin at 3 months; IV ferric carboxymaltose if oral is not tolerated, malabsorption or no response. Review and rationalise aggravating drugs. Reserve regular medication for frequent, troublesome, sleep-disrupting symptoms — then an alpha-2-delta ligand first, a dopamine agonist as the alternative at the lowest effective dose."},
    {title:"Review iron, response and augmentation", html:"Recheck ferritin and TSAT about 3 months after starting iron. At every dopamine-agonist review ask about earlier onset, greater intensity, arm involvement and impulse-control behaviours — and act early rather than increasing the dose. Review symptom frequency, sleep quality and daytime function; consider drug holidays in intermittent disease. Re-examine and refer if the picture drifts towards unilateral, painful or neurologically abnormal symptoms."}
  ],
  sections:[
    {id:"severe", nav:"Red flags", title:"Red flags — mimics, secondary causes and the iron-deficiency link", sub:"RLS is a clinical diagnosis, but these presentations mean it is not simple RLS — or that the ferritin check has found something more important.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"🟠 Painful, unilateral or fixed-position leg symptoms", html:"Not typical RLS (which is bilateral and movement-relieved). Consider lumbosacral radiculopathy, peripheral neuropathy, or peripheral arterial disease / claudication (pain on walking, relieved by rest — the opposite of RLS). Examine pulses and neurology."},
         {tone:"amber", h:"🟠 New “restlessness” on a dopamine antagonist", html:"Antipsychotics, metoclopramide and prochlorperazine cause akathisia — an inner restlessness mistaken for RLS. Onset is drug-related, not circadian. Review and stop the offending drug."},
         {tone:"purple", h:"🔴 Unexplained iron-deficiency anaemia <span class='tw'>2WW</span>", html:"RLS is strongly iron-linked, so you will check ferritin. If iron-deficiency anaemia is found, follow the NICE NG12 route: offer FIT to any adult with iron-deficiency anaemia, and refer on the suspected colorectal cancer pathway if FIT is ≥10 µg Hb/g; a negative FIT does not rule out referral if concern persists. Men and post-menopausal women with new IDA also warrant upper and lower GI investigation (BSG 2021).", src:"NICE NG12"},
         {tone:"blue", h:"🔵 Pregnancy", html:"Up to 1 in 5 pregnant women develop RLS (third trimester), usually iron- or folate-related and resolving after delivery. Avoid dopaminergic and alpha-2-delta drugs — correct iron and folate and use non-drug measures."},
         {tone:"blue", h:"🔵 Renal failure / on dialysis", html:"Uraemic RLS is common and often severe. Check U&amp;E. Manage iron, and liaise with the renal team — symptoms cluster around dialysis sessions."},
         {tone:"red", h:"🔴 Rapidly progressive, or with neurological signs", html:"Weakness, a sensory level, or bladder or bowel change → exclude cord or cauda equina pathology. This is not RLS."}
       ]},
       {b:"why", html:"RLS (Willis–Ekbom disease) is a clinical diagnosis, but its single most important modifiable driver is brain iron deficiency, which can exist even with a “normal” ferritin. Guidelines recommend treating to a serum ferritin above 75 µg/L (and transferrin saturation above 20%). Crucially, the ferritin check is also a safety net: finding genuine iron-deficiency anaemia mandates a search for a cause, and in adults that means actively excluding gastrointestinal malignancy under NICE NG12 — RLS is the presenting symptom, but the occult colorectal or gastric cancer is the diagnosis you must not miss."}
     ]},

    {id:"diagnose", nav:"Diagnose", title:"History — the URGE criteria and the triggers", sub:"All four criteria are required for the diagnosis.",
     blocks:[
       {b:"table", head:["Criterion","Detail","Note"], rows:[
         ["<b>U — Urge to move</b>","An urge to move the legs, usually with an uncomfortable “crawling, creeping, fizzing” sensation deep in the legs","<b>All four criteria are required for diagnosis</b>"],
         ["<b>R — Rest worsens</b>","<b>Symptoms begin or worsen during rest or inactivity (sitting, lying)</b>","Distinguishes it from exertional pain"],
         ["<b>G — Gets better with movement</b>","Partial or complete relief while moving (walking, stretching) — for as long as the activity continues","The mirror image of claudication"],
         ["<b>E — Evening/night predominance</b>","Symptoms are worse in the evening or at night (a circadian pattern). This is what disrupts sleep and causes daytime fatigue","<b>The most discriminating feature</b>"],
         ["<b>Sleep and bed-partner history</b>","Severe sleep-onset and maintenance insomnia. Periodic limb movements of sleep (PLMS) in about 80% — the partner reports rhythmic leg kicks","Ask the partner directly where possible"],
         ["<b>Family history</b>","50% of primary RLS is familial (autosomal dominant pattern); early-onset disease is more often genetic","Supports a primary diagnosis"],
         ["<b>Drug and substance triggers</b>","Antidepressants (mirtazapine, SSRIs, SNRIs, TCAs), sedating antihistamines, dopamine antagonists (metoclopramide, antipsychotics), caffeine, alcohol, nicotine — all precipitate or worsen RLS","Often the most effective thing to change"]
       ]},
       {b:"why", html:"The mnemonic URGE captures the four essential diagnostic criteria — all must be present. The circadian element (evening or night worsening) is the most discriminating feature and reflects the underlying dopaminergic and iron pathophysiology, which follows a daily rhythm. Asking specifically “is it worse when you sit still in the evening, and does getting up and walking ease it?” rapidly separates RLS from nocturnal cramps (sudden painful muscle contraction, no urge), positional discomfort, and akathisia (constant, drug-related, not circadian)."}
     ]},

    {id:"differential", nav:"Differential", title:"Differential diagnosis", sub:"The commonest misdiagnosis is conflating RLS with nocturnal leg cramps — they are managed completely differently.",
     blocks:[
       {b:"table", head:["Condition","Features","Discriminator"], rows:[
         ["<b>Nocturnal leg cramps</b>","Sudden, painful, palpable muscle contraction (calf or foot), relieved by stretching the muscle","No urge to move, no crawling sensation. A different entity with different management — see the <a href='leg-cramps.html'>leg cramps protocol</a>"],
         ["<b>Akathisia</b>","Drug-induced (antipsychotics, metoclopramide, SSRIs) inner restlessness — whole body, not circadian, no relief pattern","<b>Review medication</b>"],
         ["<b>Peripheral neuropathy</b>","Burning or numbness in a stocking distribution, often diabetic. Sensory signs on examination","<b>May coexist with RLS. Check glucose/HbA1c and B12</b>"],
         ["<b>Peripheral arterial disease</b>","Claudication: cramping calf pain brought on by walking, relieved by rest — the mirror image of RLS","<b>Absent pulses, low ABPI</b>"],
         ["<b>Positional discomfort / “fidgets”</b>","<b>Relieved simply by repositioning</b>","<b>Lacks the compelling urge and the circadian pattern</b>"],
         ["<b>Growing pains (children)</b>","<b>Bilateral evening leg aches in children — overlaps with paediatric RLS</b>","<b>Check ferritin and family history</b>"],
         ["<b>Venous insufficiency</b>","<b>Aching and swelling, worse on standing; varicose veins, skin changes</b>","Chronic and postural, not circadian"]
       ]},
       {b:"why", html:"The most common misdiagnosis is conflating RLS with nocturnal leg cramps — they are managed completely differently. Cramps are a painful, visible, palpable muscle contraction relieved by passively stretching the muscle; RLS is an urge to move with an unpleasant (but usually not painful) deep sensation relieved by voluntary movement. The other clinically vital distinction is claudication, because it is relieved by rest and worsened by exercise — exactly opposite to RLS — and it signals arterial disease needing vascular assessment."}
     ]},

    {id:"workup", nav:"Work-up", title:"Examination and investigations", sub:"Ferritin is the investigation that changes management. Almost nothing else is routine.",
     blocks:[
       {b:"table", head:["What","Detail","Why"], rows:[
         ["<b>Neurological examination</b>","<b>Power, sensation, reflexes — usually normal in primary RLS</b>","<b>Sensory signs suggest neuropathy or radiculopathy</b>"],
         ["<b>Vascular examination</b>","<b>Peripheral pulses, capillary refill, ABPI if claudication is suspected</b>","Excludes the mirror-image diagnosis"],
         ["<b>Iron studies</b>","Serum ferritin + transferrin saturation — the key tests. Replace if ferritin &lt;75 µg/L; target &gt;75 µg/L (some guidance targets &gt;100 µg/L for full repletion) and TSAT &gt;20%. Ferritin is an acute-phase reactant (falsely raised in inflammation) — check CRP alongside","<b>The investigation that changes management</b>"],
         ["<b>Bloods for secondary causes</b>","FBC (anaemia) · U&amp;E (uraemia) · HbA1c or glucose (neuropathy) · TFTs · B12 and folate · pregnancy test where relevant","Finds the treatable drivers"],
         ["<b>When to investigate further</b>","No routine imaging or sleep study needed for typical RLS. Polysomnography only if there is diagnostic doubt, suspected sleep apnoea, or atypical features","Avoids unnecessary referral"]
       ]},
       {b:"why", html:"Ferritin is the investigation that changes management. Even when it is within the laboratory “normal” range, a level below 75 µg/L warrants iron replacement in symptomatic RLS, because the relevant deficiency is in the brain, not necessarily the blood. Transferrin saturation below 20% supports the case for treatment, including intravenous iron. Always interpret ferritin against CRP, since infection or inflammation can elevate it spuriously and mask functional iron deficiency."}
     ]},

    {id:"ladder", nav:"Treat", title:"Correct iron, review drugs, then first-line medication", sub:"A substantial proportion of patients improve with iron repletion and trigger removal alone. Verify all doses in the BNF.",
     blocks:[
       {b:"table", head:["Situation","Action","Detail"], rows:[
         ["<b>Iron deficiency (ferritin &lt;75 or TSAT &lt;20%)</b>","<b>Oral ferrous sulfate or fumarate + vitamin C</b>","Alternate-day dosing improves absorption and tolerability. Recheck ferritin at 3 months; target &gt;75. IV iron (ferric carboxymaltose) if oral is not tolerated, malabsorption, or no response"],
         ["<b>Aggravating drugs</b>","<b>Review and rationalise</b>","Where possible switch or stop precipitants: sedating antihistamines, mirtazapine, SSRIs/SNRIs, dopamine antagonists (metoclopramide, antipsychotics). Reduce caffeine, alcohol and nicotine"],
         ["<b>Intermittent symptoms</b>","<b>Non-drug measures + PRN</b>","Sleep hygiene, targeted movement, treat iron. Reserve regular medication for frequent, troublesome, sleep-disrupting symptoms"]
       ]},
       {b:"ladder", steps:[
         {step:"Step 1", title:"Alpha-2-delta ligand — gabapentin or pregabalin", when:"persistent, troublesome symptoms", fromLabel:"preferred first-line",
          html:"Taken in the evening — gabapentin 300 mg at night (titrate) or pregabalin 75 mg at night. Now preferred first-line over dopamine agonists: no augmentation, and helpful if pain, neuropathy or anxiety coexist. <b>Caution: sedation, dependence potential, and falls in older people.</b>"},
         {step:"Alternative", title:"Dopamine agonist — ropinirole, pramipexole or rotigotine", when:"if an alpha-2-delta ligand is unsuitable", fromLabel:"lowest effective dose, shortest time",
          html:"Ropinirole 0.25–4 mg, pramipexole 88–540 micrograms, or a rotigotine 1–3 mg/24 h patch at the lowest effective dose. Effective, but carries the risk of augmentation and impulse-control disorders (gambling, hypersexuality, compulsive shopping) — counsel explicitly and ask about these at every review."},
         {step:"Intermittent", title:"As-needed options", when:"infrequent symptoms", fromLabel:"if symptoms are intermittent",
          html:"For occasional symptoms, intermittent low-dose treatment or non-drug measures may suffice. Low-dose levodopa \u2014 <span class='rx'>co-careldopa 100/25 mg</span> as a single as-needed dose \u2014 can be used for predictable, occasional symptoms (e.g. a long flight) but daily use has the highest augmentation risk — avoid regular use."},
         {step:"Avoid", title:"What not to do", when:"", fromLabel:"",
          html:"Avoid a routine dopamine agonist as first-line in young patients. Opioids only via a specialist, for refractory disease."}
       ]},
       {b:"why", html:"The treatment paradigm has shifted: alpha-2-delta ligands (gabapentin, pregabalin) are now favoured first-line ahead of dopamine agonists, because dopamine agonists — although initially very effective — frequently cause augmentation over months to years and carry a real risk of impulse-control disorders that patients will not volunteer unless asked. The foundation beneath any drug, though, is iron repletion and removal of pharmacological triggers: a substantial proportion of patients improve with these alone and need no ongoing RLS-specific medication."},
       {b:"say", html:"Often the most powerful step is correcting your iron levels and reviewing other medicines, so let's start there. If we do need a regular medicine, I'll explain which one and a couple of side effects to watch for."}
     ]},

    {id:"augmentation", nav:"Augmentation", title:"Recognising and managing augmentation", sub:"The single most important iatrogenic complication of RLS treatment — and the reason guidelines have demoted dopamine agonists.",
     blocks:[
       {b:"table", head:["Aspect","Detail"], rows:[
         ["<b>What augmentation is</b>","A paradoxical, drug-induced worsening of RLS caused (usually) by long-term dopamine agonists: symptoms start earlier in the day, become more intense, spread to previously unaffected limbs (arms, trunk), and the duration of relief from each dose shortens"],
         ["<b>Why it matters</b>","Often misread as “disease progression”, prompting a dose increase — which makes augmentation worse. It is one of the commonest reasons RLS becomes refractory"],
         ["<b>Management</b>","Do not escalate the dopamine agonist. Recheck and optimise iron. Reduce and switch to an alpha-2-delta ligand (usually with neurology). Expect a temporary withdrawal-related flare during the switch"],
         ["<b>Impulse-control disorders</b>","Ask directly about new gambling, compulsive shopping, hypersexuality and binge eating at every dopamine-agonist review — patients rarely disclose spontaneously. Their presence mandates dose reduction or withdrawal"]
       ]},
       {b:"warn", html:"<b>Augmentation</b> (symptoms earlier in the day, more intense, spreading) is the main long-term problem with dopamine agonists — <b>do not simply increase the dose; reduce or switch and seek advice</b>. Warn about impulse-control disorders (gambling, hypersexuality) and sudden-onset sleep."},
       {b:"why", html:"Augmentation is the single most important iatrogenic complication of RLS treatment and the reason guidelines have demoted dopamine agonists. The tell-tale features are temporal (symptoms creeping earlier into the afternoon), spatial (spreading to the arms), and pharmacodynamic (each dose helps for less time). The instinct to raise the dose accelerates the problem. Correct management is iron optimisation and a planned cross-taper to an alpha-2-delta ligand, anticipating a rebound flare during withdrawal."}
     ]},

    {id:"lifestyle", nav:"Self-management", title:"Self-management and sleep hygiene", sub:"Not a token gesture — for mild and intermittent disease these are often sufficient, and for everyone they reduce the dose and number of drugs required.",
     blocks:[
       {b:"table", head:["Measure","What to do","Why"], rows:[
         ["<b>☕ Reduce dietary triggers</b>","Cut caffeine (coffee, tea, cola, chocolate), alcohol and nicotine — all worsen RLS, especially in the evening. A 2–3 week trial of removing evening caffeine is a simple, effective first step","The highest-yield lifestyle change"],
         ["<b>🤸 Movement and stretching</b>","Walking, calf and hamstring stretches, and leg massage relieve acute symptoms. Regular moderate daytime exercise helps; avoid vigorous exercise late in the evening, which can aggravate","Exploits the movement-relief mechanism"],
         ["<b>🛁 Temperature tricks</b>","A warm bath, or alternating warm and cool packs to the legs before bed, helps many patients settle symptoms enough to fall asleep","Free and effective"],
         ["<b>🧩 Mental alerting at rest</b>","During unavoidable sitting (long flights, theatre), engaged mental activity (puzzles, conversation, games) genuinely reduces symptoms","<b>Exploits the same arousal pathways that movement does</b>"],
         ["<b>🛏️ Sleep hygiene</b>","Regular bed and wake times, cool dark bedroom, screen limits — RLS plus poor sleep hygiene is doubly disruptive. Treating coexisting insomnia drivers helps","See the <a href='insomnia.html'>insomnia protocol</a>"],
         ["<b>💊 Review all medicines</b>","Bring every prescription and OTC product to review — sedating antihistamines (in cold and allergy remedies) and anti-nausea drugs are common hidden triggers","<b>Hidden dopamine antagonists are easily missed</b>"],
         ["<b>🧘 During episodes</b>","<b>Get up and move; use distraction techniques during an attack</b>","Shortens the episode"]
       ]},
       {b:"why", html:"Non-pharmacological measures are not a token gesture in RLS — for mild and intermittent disease they are often sufficient, and for everyone they reduce the dose and number of drugs required. The highest-yield changes are eliminating evening caffeine, alcohol and nicotine, auditing the medication list for hidden dopamine antagonists and sedating antihistamines, and using movement, stretching and temperature manoeuvres at symptom onset."}
     ]},

    {id:"monitor", nav:"Monitor", title:"Follow-up, monitoring and safety-netting", sub:"Two jobs: confirm iron repletion is achieved and maintained, and screen vigilantly for augmentation and impulse-control disorders.",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["<b>Recheck iron</b>","Repeat ferritin and TSAT about 3 months after starting iron; target ferritin &gt;75 µg/L","Persistent deficiency despite oral iron → consider malabsorption, ongoing loss (re-examine the NG12 GI risk), or IV iron"],
         ["<b>Monitor for augmentation</b>","<b>At every dopamine-agonist review</b>","Ask about earlier onset, greater intensity, or arm symptoms, and about impulse-control behaviours. Act early — do not increase the dose"],
         ["<b>Treatment response</b>","<b>Each review</b>","Review symptom frequency, sleep quality and daytime function. Step medication up or down accordingly; consider drug holidays in intermittent disease"],
         ["<b>Pregnancy</b>","<b>As it arises</b>","Reassure that pregnancy-related RLS usually resolves after delivery; manage with iron and folate and non-drug measures, avoiding dopaminergic and alpha-2-delta drugs"],
         ["<b>Review / refer</b>","<b>If the picture changes</b>","New neurological signs, unilateral or painful symptoms, claudication features, or refractory disease → re-examine and refer (neurology or vascular as appropriate)"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 Safety-net", html:"Unexplained iron-deficiency anaemia → the NG12 GI pathway. New bladder or bowel dysfunction or leg weakness → urgent assessment for cord or cauda equina pathology."},
         {tone:"amber", h:"🎲 Impulse control", html:"“These medicines can rarely cause urges to gamble, shop or other compulsive behaviour — tell us or a family member if you notice this.”"},
         {tone:"amber", h:"😴 Sudden sleep", html:"“Dopamine medicines can cause sudden sleepiness — take care with driving until you know how they affect you.”"},
         {tone:"cream", h:"📈 Augmentation &amp; iron", html:"“If your symptoms start earlier in the day or get worse on treatment, contact us — don't just take more.” “Treating low iron can make a big difference — take the supplement as advised.”"}
       ]},
       {b:"why", html:"Follow-up in RLS has two jobs: confirming that iron repletion has been achieved and maintained, and vigilantly screening for augmentation and impulse-control disorders in anyone on a dopamine agonist. The safety-net never closes on the iron-deficiency question — if anaemia was present and unexplained, the GI cancer pathway must be completed, and recurrent or refractory deficiency should prompt you to revisit it. Any drift towards unilateral, painful or neurologically abnormal symptoms means the diagnosis is no longer simple RLS."}
     ]},

    {id:"loop", nav:"Worse on treatment?", title:"Worse on treatment? Think augmentation", sub:"Worsening on a dopamine agonist is often augmentation, not undertreatment.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"1 · Augmentation", html:"Earlier-in-day, more intense, spreading symptoms → reduce or switch the dopamine agonist."},
         {tone:"amber", h:"2 · Iron", html:"<b>Recheck ferritin — deficiency may have recurred.</b>"},
         {tone:"amber", h:"3 · Drugs", html:"<b>Has a new aggravating medication been added?</b>"},
         {tone:"amber", h:"4 · Adherence / dose", html:"<b>Has an adequate dose of an alpha-2-delta ligand been tried?</b>"},
         {tone:"amber", h:"5 · Refer", html:"<b>Refractory disease or augmentation → specialist.</b>"}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways", sub:"Most RLS is managed entirely in primary care.",
     blocks:[
       {b:"cards", items:[
         {tone:"purple", h:"2WW lower/upper GI <span class='tw'>NG12</span>", html:"Unexplained iron-deficiency anaemia found on work-up — urgent direct-access FIT and GI investigation for occult malignancy. Do not simply replace iron and discharge.", src:"NICE NG12"},
         {tone:"amber", h:"Neurology", html:"Diagnostic uncertainty · refractory symptoms despite optimised iron and first-line drugs · suspected augmentation requiring a drug switch · early-onset or rapidly progressive disease."},
         {tone:"blue", h:"Sleep medicine", html:"Suspected coexisting obstructive sleep apnoea, or severe PLMS with unrefreshing sleep."},
         {tone:"blue", h:"Renal / obstetric", html:"Uraemic RLS (renal team) · RLS in pregnancy not controlled by iron, folate and non-drug measures (obstetric input — avoid dopaminergics)."},
         {tone:"plain", h:"IV iron service", html:"Ferritin low with oral iron intolerance, malabsorption, or inadequate response — for parenteral iron."},
         {tone:"green", h:"Primary care manages", html:"Typical RLS: iron correction, drug-trigger review, self-management, an alpha-2-delta ligand where medication is needed, and augmentation surveillance."}
       ]},
       {b:"why", html:"Most RLS is managed entirely in primary care. The two situations that genuinely need specialist input are augmentation (a paradoxical drug-induced worsening that requires careful agent switching, usually under neurology) and refractory disease where combination therapy or IV iron is being considered. The non-negotiable referral, however, is the patient with unexplained iron-deficiency anaemia, who enters the NG12 cancer pathway regardless of how typical their leg symptoms appear."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 63-year-old man describes eighteen months of an irresistible need to move his legs every evening once he settles in front of the television, easing the moment he walks about. His wife reports rhythmic kicking all night. He looks pale and mentions he has been more breathless on the stairs. He asks for “something to help me sleep”."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Confirms <b>all four URGE criteria</b> rather than treating this as insomnia; takes the <b>bed-partner history</b> for PLMS; checks <b>ferritin and transferrin saturation with CRP</b>, plus FBC — and on finding iron-deficiency anaemia in a man, recognises the NG12 duty: urgent direct-access FIT and upper and lower GI investigation, not iron replacement alone; reviews the drug list for <b>sedating antihistamines and dopamine antagonists</b>; addresses <b>evening caffeine and alcohol</b>; and if medication is needed later, chooses an <b>alpha-2-delta ligand ahead of a dopamine agonist</b> and explains <b>augmentation and impulse-control</b> in plain words."}
     ]}]},
