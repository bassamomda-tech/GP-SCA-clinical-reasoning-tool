MG.render({
  icon:"👁️",
  title:"Blepharitis — the complete guide",
  eyebrow:"Protocol · adults · chronic lid-margin disease",
  stemTitle:"Blepharitis is chronic and relapsing — controlled by daily lid hygiene, not cured by antibiotics",
  stemSub:"<b>Primary-care management of blepharitis.</b> Confirm the diagnosis and exclude corneal, intraocular, infective and orbital disease. Lid hygiene — a warm compress, gentle massage and lid-margin cleaning — is first-line and long-term. Treat associated dry eye. A defined course of topical chloramphenicol is for persistent anterior disease, and oral doxycycline for persistent posterior disease/MGD or ocular rosacea, only after good lid care. <b>Pain, photophobia, reduced vision, corneal signs or a painful red eye in a contact-lens wearer need same-day eye assessment.</b> Persistent, atypical or same-site recurrent lid lesions need ophthalmic assessment to exclude malignancy.",
  guideline:"College of Optometrists CMG — blepharitis · NHS Scotland Eye Care guidance · NICE NG12 · MHRA SPCs",
  reviewed:"25 September 2026",
  nextReview:"25 September 2027",
  meta:[
    {t:"Pain is not blepharitis", tone:"tw"},
    {t:"Lid hygiene is the treatment", tone:"ok"},
    {t:"v2.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#assess"><b>Assess</b><small>Exclude serious red eye</small></a><a href="#hygiene"><b>Lid hygiene</b><small>First-line, long-term</small></a><a href="#drugs"><b>Drugs</b><small>Defined, second-line</small></a><a href="#lesion"><b>Lid lesions</b><small>Exclude malignancy</small></a><a href="#refer"><b>Refer</b><small>When and where</small></a></div>',
  quickSub:"The five that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Same-day eye assessment", html:"Moderate or severe pain · photophobia · blurred vision that does not clear with blinking · corneal opacity or staining · hypopyon · marked ciliary injection · <b>painful red eye in a contact-lens wearer</b> · suspected herpes · proptosis · painful or restricted eye movements · new diplopia · significant peri-/orbital swelling · trauma or chemical injury."},
    {tone:"green", h:"Lid hygiene is the treatment", html:"A warm (not hot) compress for 5–10 minutes, gentle massage, then lid-margin cleaning — twice daily in a flare, once daily long-term. No cleaning method is proven superior."},
    {tone:"amber", h:"Chloramphenicol — a defined course", html:"For persistent anterior/staphylococcal disease despite good lid hygiene: chloramphenicol 1% eye ointment to the lid margin twice daily, usually for <b>2–4 weeks</b>, off-label. Review; no repeat courses without reassessing the diagnosis."},
    {tone:"amber", h:"Doxycycline — time-limited, second-line", html:"For persistent posterior disease/MGD or ocular rosacea after good lid care: 100 mg once daily initially, reviewed at 4–12 weeks. 100 mg is a standard systemic dose, not a low-dose regimen. Not indefinite."},
    {tone:"red", h:"⚠ No ocular steroids in primary care", html:"Do not start topical ocular corticosteroids or antibiotic–steroid combinations unless directed by a local eye-care pathway or a specialist."}

  pathwaySub:"Five steps. The first is to make sure this is blepharitis.",
  pathway:[

    {title:"Lid hygiene, long-term", html:"Warm compress, massage and cleaning; treat associated dry eye; everyday measures."},
    {title:"Second-line drugs only if persistent", html:"Defined chloramphenicol course for anterior disease; time-limited doxycycline for MGD/ocular rosacea."},

  ],
  sections:[

    {id:"assess", nav:"Assess", title:"Step 1 — confirm it is blepharitis",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>Examine</b>","Visual acuity · pupils · corneal clarity · contact-lens use · pain and photophobia · eye movements · discharge · lid position and periocular swelling · lid margin and lashes for collarettes, ulceration, lash loss and focal lesions"],
         ["<b>Symptoms</b>","Bilateral gritty, burning, itchy, crusty lid margins; worse on waking; remitting and relapsing. Discomfort and itch are typical — moderate or severe <b>pain</b> suggests another diagnosis"],
         ["<b>Anterior</b>","Lash-base crusting and collarettes — staphylococcal or seborrhoeic"],
         ["<b>Posterior (MGD)</b>","Oily or blocked meibomian glands, foamy tear film, often with rosacea"],
         ["<b>Differentials</b>","Infective or allergic conjunctivitis · dry-eye disease · marginal keratitis · anterior uveitis · corneal abrasion or ulcer · herpes simplex keratitis · acute glaucoma · preseptal/orbital cellulitis · ocular rosacea · contact dermatitis or medication-related blepharitis"],
         ["<b>Associations</b>","Dry eye · rosacea · seborrhoeic dermatitis · chalazia · recurrent styes"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"red", h:"Other emergencies", html:"Corneal foreign body or trauma · chemical injury · severe headache with nausea/vomiting and a fixed or irregular pupil (acute angle-closure glaucoma). Lower the threshold after recent ocular surgery or in immunosuppression."},
         {tone:"amber", h:"Marginal keratitis", html:"Peripheral corneal infiltrates with staphylococcal hypersensitivity → eye-care assessment."}
       ]},
       {b:"why", html:"Unilateral redness alone is not an emergency, but it should prompt a careful look for the same-day features."}
     ]},

    {id:"hygiene", nav:"Lid hygiene", title:"Step 2 — lid hygiene, first-line and long-term",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"🔥 Warm compress", html:"A clean <b>warm</b> (not hot) compress or a proprietary eyelid-warming device for 5–10 minutes. Hot compresses risk periocular burns."},
         {tone:"green", h:"🧽 Massage and clean", html:"Gentle lid massage, then clean the lid margin with a commercial lid wipe or cleanser, or a well-diluted cleansing solution. If baby shampoo is used, dilute it well and stop if it irritates — it is not proven superior to lid-specific products."},
         {tone:"green", h:"🔁 Keep it going", html:"Twice daily in a flare, then once daily long-term. Stopping is the commonest reason for relapse."},
         {tone:"blue", h:"🧴 Everyday measures", html:"Avoid rubbing the eyes · avoid eye make-up, especially mascara and eyeliner, in a flare, and replace old make-up · leave contact lenses out during an acute flare or while using eye ointment · treat seborrhoeic dermatitis and rosacea · screen breaks where dry eye is prominent."},
         {tone:"green", h:"💧 Associated dry eye", html:"Artificial tears, preservative-free if used frequently. See <a href='dry-eye-disease.html'>dry eye disease</a>."}
       ]}
     ]},

    {id:"drugs", nav:"Drugs", title:"Step 3 — second-line drugs, only if persistent",
     blocks:[
       {b:"table", head:["Drug","When and how","Notes"], rows:[
         ["<b>Chloramphenicol 1% eye ointment</b>","Persistent anterior/staphylococcal disease despite good lid hygiene: to the lid margin twice daily, usually 2–4 weeks, per local guidance","Lid-margin use is off-label. Review the response; no repeat courses without reassessing the diagnosis. Check the SPC for contraindications, including a personal or family history of blood dyscrasia or bone-marrow suppression"],
         ["<b>Doxycycline</b>","Persistent posterior disease/MGD or ocular rosacea after good lid care: 100 mg once daily initially, reviewed after 4–12 weeks (some local pathways step down to 50 mg)","A standard systemic dose, not sub-antimicrobial — the two are not interchangeable. Evidence is limited; often specialist- or locally guided; should not become indefinite"]
       ]},

         {tone:"amber", h:"⚠ Doxycycline cautions", html:"Avoid routinely in pregnancy and in children under 12 · weigh breastfeeding individually for longer courses · photosensitivity · oesophagitis — take with plenty of water and stay upright · GI upset · new headache or visual disturbance may be intracranial hypertension — caution with isotretinoin · separate from antacids, iron, calcium, magnesium and zinc · avoid minocycline for ocular rosacea. Erythromycin is not an automatic substitute — choose with local or specialist advice."},
         {tone:"red", h:"⚠ No ocular steroids in primary care", html:"Topical ocular corticosteroids and antibiotic–steroid combinations can worsen herpetic, fungal or acanthamoeba keratitis and cause glaucoma and cataract. Start only under a local eye-care pathway or specialist direction."}

     ]},

         {tone:"amber", h:"Refer for ophthalmic assessment", html:"A chalazion or lid lesion that is persistent, recurrent in the same place, atypical, associated with lash loss or lid-margin distortion, ulcerated or bleeding, or not responding to conservative treatment. Biopsy may be needed to exclude sebaceous carcinoma or basal cell carcinoma. Urgency is set by the malignant features."},
         {tone:"purple", h:"Suspected skin cancer of the lid <span class='tw'>2WW</span>", html:"<b>NICE NG12:</b> a lesion suggesting squamous cell carcinoma or melanoma → suspected cancer pathway referral. A lesion suggesting basal cell carcinoma is usually routine, but consider a suspected cancer pathway referral when delay could matter because of its site or size — the eyelid is such a site."}
       ]}
     ]},

    {id:"troubleshoot", nav:"Not settling?", title:"Not settling? Re-check before escalating",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"1 · Red flags", html:"Pain, photophobia, reduced vision or corneal signs → same-day pathway."},
         {tone:"amber", h:"2 · Technique and adherence", html:"Is lid hygiene being done daily, correctly, and continued after the flare settles?"},
         {tone:"blue", h:"3 · Drivers", html:"Rosacea, seborrhoeic dermatitis, dry eye, contact lenses or make-up addressed?"},
         {tone:"blue", h:"4 · Right diagnosis?", html:"Persistent disease despite good adherence → reconsider the diagnosis rather than escalating antibiotics."},
         {tone:"amber", h:"5 · Any focal lesion?", html:"Lash loss, ulceration or distortion → see Lid lesions."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Step 5 — review and referral",
     blocks:[
       {b:"table", head:["When","Situation","Action"], rows:[
         ["<b>Same day</b>","Any same-day feature in Step 1","Local urgent eye pathway — eye casualty, same-day ophthalmology advice or ED"],
         ["<b>Mild, improving</b>","Self-care with lid hygiene","No routine review; safety-net"],
         ["<b>4–6 weeks</b>","Treatment prescribed, symptoms persist, or technique needs checking","Check acuity if symptoms have changed, pain or photophobia, corneal symptoms, adherence, dry eye, rosacea/seborrhoeic dermatitis, adverse effects and any suspicious lid or lash change"],
         ["<b>Refractory</b>","Persistent despite optimal care, marginal keratitis, diagnostic uncertainty","Most do not need hospital referral — community optometrist, MECS or an independent-prescribing optometrist first; routine ophthalmology if needed"],
         ["<b>Lid lesion</b>","As in Lid lesions","Ophthalmology or oculoplastics, urgency by features; NG12 where skin cancer is suspected"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"Safety-net", html:"\"If your eye becomes painful, sensitive to light, or your vision blurs and does not clear with blinking — or if you wear contact lenses and your eye becomes painful — get checked the same day.\""},
         {tone:"cream", h:"GP management", html:"Triage, lid hygiene and the defined drug courses belong here. Related pages: <a href='chalazion.html'>chalazion</a> · <a href='dry-eye-disease.html'>dry eye disease</a> · <a href='rosacea.html'>rosacea</a> · <a href='seborrhoeic-dermatitis.html'>seborrhoeic dermatitis</a>."}
       ]},
       {b:"say", html:"Blepharitis is inflammation of the eyelid edges — common, not dangerous, but it tends to come and go. The key treatment is a daily routine: a warm (not hot) compress, a gentle massage and cleaning the lid margins. Keep it up even when things settle. If your eye becomes painful, sensitive to light, or your vision blurs and doesn't clear with blinking, get checked the same day."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 45-year-old with facial rosacea has sore, crusty eyelids for a year. She has had three courses of chloramphenicol drops and asks for 'something stronger'. She wears contact lenses."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Excludes red flags, including contact-lens keratitis; checks lid-hygiene technique before escalating; explains chronicity; recognises MGD/ocular rosacea; offers a time-limited doxycycline course with cautions, or optometry assessment; avoids repeat antibiotic courses and ocular steroids; safety-nets."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>College of Optometrists — Clinical Management Guideline: blepharitis (lid margin disease)</b><span class="rd"> — lid hygiene as the main long-term treatment; no method proven superior</span></li>'+
         '<li><b>NHS Scotland Eye Care — blepharitis, anterior and posterior; eye antimicrobial guidance</b><span class="rd"> — chloramphenicol and doxycycline courses; most cases do not need hospital referral</span></li>'+

  ],
  foot:"Blepharitis in primary care. Exclude serious red eye first — pain, photophobia, reduced vision, corneal signs or a painful red eye in a contact-lens wearer: same-day eye assessment. Lid hygiene is first-line and long-term. Chloramphenicol 1% eye ointment to the lid margin for a defined 2–4 week course for persistent anterior disease; time-limited doxycycline for persistent MGD/ocular rosacea. No ocular steroids in primary care. Persistent, atypical or same-site recurrent lid lesions: ophthalmic assessment; NICE NG12 where skin cancer is suspected. Sources: College of Optometrists CMG, NHS Scotland Eye Care guidance, NICE NG12, MHRA SPCs. Verify drugs and doses against the current BNF and local guidance."
