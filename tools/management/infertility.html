MG.render({
  icon:"🌱",
  title:"Infertility — the complete guide",
  eyebrow:"Protocol · NICE NG257 · both partners, from the first appointment",
  stemTitle:"The one-year rule has more exceptions than applications, and the single commonest failure in primary care is investigating one partner while the other waits",
  stemSub:"This page is the whole of infertility in one place — the diagnostic reasoning and the management. It is what primary care actually does: decide whether to investigate now or at a year, complete the investigation set for <b>both</b> partners in parallel, get the semen analysis right (including how and when to repeat it), deliver preconception care that measurably improves outcomes, understand the funding criteria that make referral timing consequential rather than administrative, and hold a consultation in which two people are hearing the same words differently.",
  guideline:"NICE NG257 (2026) · NICE NG23 (updated April 2026) · NICE NG12 (updated April 2026) · HFEA",
  reviewed:"12 September 2026",
  nextReview:"12 March 2027",
  meta:[
    {t:"NICE NG257 (2026) — fertility problems: assessment and treatment"},
    {t:"NG257 replaced CG156 (31 March 2026)"},
    {t:"HFEA — treatment information and clinic data"},
    {t:"Refer early when indicated — tests in parallel", tone:"tw"},
    {t:"v1.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#when"><b>When to act</b><small>Before 1 year?</small></a><a href="#investigate"><b>Investigate</b><small>Both partners</small></a><a href="#semen"><b>Semen analysis</b><small>And repeating it</small></a><a href="#preconception"><b>Preconception</b><small>What changes outcomes</small></a><a href="#refer"><b>Refer</b><small>Early · local ICB policy</small></a></div>',
  quickSub:"The six that change outcomes. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"blue", h:"The rule, and the number that makes it reassuring", html:"Investigate after 1 year of regular unprotected intercourse (every 2–3 days) without conception. <b>More than 80% of couples in this population conceive within 1 year, and the cumulative chance is over 90% by 2 years</b> (NICE NG257; person providing the eggs under 40, regular intercourse without contraception) — population estimates, not an individual prediction. So many people presenting at nine months need information rather than investigation — unless the person trying to conceive is aged 36 or over or there is a predictive history."},
    {tone:"amber", h:"Refer EARLIER than a year if any of these", html:"Offer specialist referral at presentation, with investigations in parallel: person trying to conceive aged 36 or over · suspected or known cause or predisposing factor in either partner · a history predicting a problem — amenorrhoea or oligomenorrhoea, PID or pelvic surgery, endometriosis, undescended testes, previous chemotherapy or radiotherapy, mumps orchitis, testicular surgery or trauma, or erectile or ejaculatory dysfunction. Age is the dominant variable and it is not recoverable — waiting out the year in a 38-year-old is a real harm, not a cautious approach."},
    {tone:"red", h:"⚠ Investigate BOTH partners, in parallel, from the start", html:"A male factor contributes in roughly half of cases, and in a substantial minority it is the sole cause. Arranging a day-21 progesterone while the semen analysis waits for \"the next step\" wastes months and is the commonest structural error in this pathway. Book both at the first appointment — and invite both partners to attend."},
    {tone:"blue", h:"Semen analysis: repeat it properly before believing it", html:"Abstinence of 2–7 days, sample to the laboratory within 1 hour, kept close to body temperature — the laboratory's own collection and transport instructions take precedence. If the first result is abnormal, repeat it — ideally after 3 months, to allow one full spermatogenesis cycle — but repeat promptly, and refer without waiting for the repeat, if azoospermia or a grossly deficient sperm count is reported. A single abnormal result is not a diagnosis: transient illness, fever and collection error all produce one."},
    {tone:"green", h:"Preconception care is the part that genuinely works", html:"Folic acid 400 micrograms daily from before conception until 12 weeks (5 mg when indicated by current national guidance — e.g. previous neural tube defect, diabetes or certain antiseizure medicines; BMI alone does not trigger 5 mg) · smoking cessation for both partners · alcohol within limits and none in pregnancy · BMI toward 20–25 · rubella status checked · cervical screening up to date · medication review · vitamin D per national pregnancy guidance (general preconception advice, not a fertility treatment). Higher BMI may reduce natural and assisted-conception success — discuss weight sensitively, but do not make weight loss a blanket precondition for referral; NHS treatment eligibility is determined by local ICB policy."},
    {tone:"purple", h:"🟣 Statutory and safeguarding considerations", html:"Where infertility presents alongside sexual dysfunction, non-consensual sex, coercion or reproductive control, the safeguarding duty takes precedence over the fertility workup — ask, separately and in private. Female genital mutilation identified in a patient under 18 carries a mandatory reporting duty to the police; in an adult it requires risk assessment for her and any daughters. Treat the person in front of you separately from the couple, and always offer a single-partner appointment."}
  ],
  pathwaySub:"Five steps, and the first is a decision about timing that sets everything else.",
  pathway:[
    {title:"Decide: investigate now, or reassure and review?", html:"Person trying to conceive under 36, no predictive history and under a year of trying → information, preconception care and a review date. Aged 36 or over, or a suspected/known cause or predisposing factor in either partner → offer specialist referral at presentation, investigating in parallel. A year elapsed → investigate both partners without delay.", alert:true},
    {title:"Take a history from both, including the part people do not volunteer", html:"Cycle regularity and length · previous pregnancies for each of them, with any partner · coital frequency and timing, and any pain or difficulty · PID, STIs, endometriosis, pelvic or testicular surgery · chemotherapy or radiotherapy · drugs including anabolic steroids and testosterone · occupational heat and toxins · smoking, alcohol, recreational drugs and BMI · erectile or ejaculatory problems · safeguarding and coercion assessment, including private time with each person."},
    {title:"Investigate in parallel", html:"Person providing eggs: mid-luteal progesterone timed 7 days before the expected period; rubella status if vaccination is uncertain; chlamydia testing before uterine instrumentation (or earlier if clinically or STI-risk indicated); FSH/LH only where cycles are irregular or absent; prolactin and TFTs only when clinically indicated; AMH only where it will inform specialist counselling. <b>Person providing sperm: semen analysis.</b> <b>Both booked at the same visit — not sequentially.</b>"},
    {title:"Give preconception care and correct what is correctable", html:"Folic acid at the right dose · smoking cessation · weight · alcohol · medication review · timing advice (every 2–3 days, not ovulation-hunting). These are the interventions primary care owns; NHS treatment eligibility is set by local ICB policy."},
    {title:"Refer early when indicated — tests in parallel", html:"Refer early when indicated, while arranging relevant primary-care investigations in parallel. Do not delay referral solely to complete semen analysis, progesterone or other baseline tests — include available results and clearly identify outstanding tests. <b>Check the local ICB criteria before promising anything.</b>"}
  ],
  sections:[

    {id:"when", nav:"When to act", title:"When to investigate — and when to reassure",
     blocks:[
       {b:"table", head:["Situation","Action","Why"], rows:[
         ["<b>Trying under 1 year, person trying to conceive under 36, no predictive history</b>","<b>Information, preconception care, timing advice and a review date</b>","<b>More than 80% conceive within 1 year</b> (population estimate, not an individual prediction). Premature investigation medicalises a normal process and creates anxiety that itself affects the relationship"],
         ["<b>1 year of regular unprotected intercourse without conception</b>","<b>Investigate both partners without delay</b>","The NICE NG257 threshold"],
         ["<b>Person trying to conceive aged 36 or over</b>","<b>Offer specialist referral at presentation, investigating in parallel — do not wait out the year</b>","In the person providing the eggs, ovarian reserve and oocyte quality decline with age; both spontaneous conception and treatment success fall with each year. Local ICB funding policies also include age criteria, so delay can remove options"],
         ["<b>Amenorrhoea, oligomenorrhoea or irregular cycles</b>","<b>Offer referral at presentation and investigate in parallel</b> — cycle assessment, and see <a href='pcos.html'>PCOS</a> or <a href='hyperprolactinaemia.html'>hyperprolactinaemia</a>","<b>Anovulation is the most treatable cause of infertility</b>, and irregular cycles point straight to it"],
         ["Previous PID, chlamydia, ectopic pregnancy, pelvic surgery or known endometriosis","<b>Offer referral at presentation and investigate in parallel</b>","Tubal factor is likely and needs imaging that primary care cannot arrange"],
         ["Undescended testes, testicular surgery or trauma, mumps orchitis, previous chemotherapy or radiotherapy","<b>Semen analysis now, and offer referral at presentation</b>","Predictable spermatogenic failure; earlier knowledge changes the options, including surgical sperm retrieval"],
         ["Erectile dysfunction, ejaculatory failure, or intercourse that is not happening","<b>Address this first — it is the cause until proven otherwise</b>","Frequently not volunteered and easily missed if the conversation stays on tests. Ask directly and separately. See <a href='erectile-dysfunction.html'>erectile dysfunction</a>"],
         ["Same-sex couples, single people, trans and non-binary people, and those needing donor gametes or surrogacy","Refer per local pathway; the investigation set is unchanged where relevant. NICE NG257 applies to women, trans men and non-binary people with female reproductive organs, trans women and non-binary people with male reproductive organs, and people seeking conception regardless of sexual orientation or partnership status","Eligibility is set by local ICB policy and differs by area — check the current NHS Greater Manchester ICB fertility policy before advising"]
       ]},
       {b:"say", html:"Before we start any tests, one number is worth knowing, because it changes how worried to be. Of couples trying for a baby, more than eight in ten conceive within a year, and over nine in ten within two years — those are averages, not a prediction for you. So at nine months, if none of the reasons not to wait apply, tests are often not needed yet. That said, there are good reasons not to wait in some situations, and I want to check whether any apply to you. The two that matter most are age and anything in either of your histories that points to a specific cause. If neither applies, my advice is to keep trying, do the things that genuinely help, and come back at a year — or sooner if anything changes or you would rather not wait."}
     ]},

    {id:"investigate", nav:"Investigate", title:"The primary-care investigation set — both partners, same visit",
     blocks:[
       {b:"table", head:["Test","Who and when","Interpretation"], rows:[
         ["<b>Semen analysis</b>","<b>Person providing sperm, at the first appointment</b>","The single most important test in primary care, and the one most often delayed. See <a href='#semen'>Semen analysis</a> for technique, thresholds and repeat timing"],
         ["<b>Mid-luteal (day-21) progesterone</b>","Person providing eggs — offered during infertility investigation, including with regular cycles (NICE NG257). In a regular cycle take it approximately 7 days before the expected next period: about day 25 in a 32-day cycle, about day 28 in a 35-day cycle. In prolonged or irregular cycles, take it later and repeat weekly if necessary until the next period","<b>Supports ovulation.</b> A single low concentration does not definitively prove anovulation — timing errors and pulsatile secretion can produce misleading results. Low or equivocal → repeat with correct timing before concluding anovulation"],
         ["<b>Chlamydia testing</b>","<b>The person undergoing uterine instrumentation, before that procedure</b> (NICE NG257); otherwise offer STI testing according to age, symptoms and sexual-health risk","If positive, ensure treatment, partner notification and appropriate sexual-health management. A previous treated chlamydia infection is a risk factor for tubal disease but does not itself indicate active infection"],
         ["<b>Rubella immunity</b>","<b>Her</b>","Offer testing where vaccination status is uncertain. If susceptible, offer MMR (not during pregnancy) and advise contraception/avoiding conception for at least 1 month afterwards — worth doing early, but do not delay fertility referral solely to complete vaccination"],
         ["<b>FSH and LH (early follicular, days 2–5)</b>","<b>Person providing eggs, when cycles are irregular, prolonged or absent</b> — to investigate ovulatory or endocrine dysfunction","<b>Not needed with regular cycles.</b> Do not use FSH routinely as an ovarian-reserve or IVF-response test (NICE NG257). Low FSH and LH suggest hypogonadotrophic hypogonadism. Request oestradiol only where clinically indicated or as part of specialist assessment"],
         ["<b>Anti-Müllerian hormone (AMH)</b>","Her — a marker of ovarian reserve, cycle-independent; availability in primary care varies locally","AMH is not a test of whether someone can conceive naturally. Where available and clinically appropriate, it may help predict ovarian response during assisted conception and inform counselling. Do not use a single AMH result to diagnose infertility, POI or PCOS, or to determine urgency in isolation; thresholds are assay- and laboratory-dependent. Not necessary in every primary-care infertility assessment"],
         ["<b>TFTs and prolactin</b>","<b>Her, where there is menstrual disturbance, galactorrhoea or symptoms</b>","<b>Not a routine screen with regular cycles and no symptoms.</b> Treat hypothyroidism before conception. Check prolactin when there is amenorrhoea, oligomenorrhoea, galactorrhoea or symptoms suggestive of pituitary disease; repeat an unexpected elevation under appropriate conditions and consider medication (especially antipsychotics and antiemetics), pregnancy, stress/venepuncture, thyroid disease and macroprolactin; refer for endocrine assessment and imaging according to the level, symptoms and local pathway"],
         ["HbA1c, BMI, blood pressure, cervical screening status","<b>Both / as applicable</b>","Opportunistic and genuinely useful preconception care. Vitamin D is general preconception and pregnancy advice per current national guidance and individual risk — not a fertility treatment or funding prerequisite"],
         ["<b>What NOT to do in primary care</b>","Do not routinely arrange: tubal patency testing (HSG, HyCoSy) unless locally commissioned; diagnostic laparoscopy; post-coital testing; antisperm antibody testing; sperm-DNA-fragmentation testing; AMH as a test of natural fertility; FSH as a test of IVF response; routine \"fertility\" vitamin or antioxidant panels","Tubal assessment is secondary care. Post-coital testing has no predictive value and is explicitly not recommended"]
       ]},
       {b:"why", html:"The reason both partners must be investigated in parallel is arithmetic rather than etiquette. Male factor contributes in around half of couples, so investigating the woman first leaves a coin-flip chance that months of testing will not touch the cause. And because a semen analysis frequently needs repeating after three months to allow a full spermatogenesis cycle, a delayed first sample does not cost weeks — it costs a season. Practically: invite both partners to the first appointment, hand over the semen-analysis form at that visit, and book her bloods around her cycle rather than around the appointment."}
     ]},

    {id:"semen", nav:"Semen analysis", title:"Semen analysis — technique, thresholds and when to repeat",
     blocks:[
       {b:"dl", rows:[
         ["<b>Collection</b>","The laboratory's own collection and transport instructions take precedence · abstinence of 2–7 days · collect by masturbation into the laboratory-supplied sterile container · do not use an ordinary condom or non-laboratory lubricant; if collection with a special non-spermicidal condom is necessary, discuss with the laboratory · complete sample including the first fraction, which carries most of the sperm · to the laboratory within 1 hour, kept near body temperature (an inside pocket, not a car dashboard)"],
         ["<b>Reference values (current NICE NG257)</b>","Volume ≥1.4 mL · sperm concentration ≥16 million/mL · total sperm number ≥39 million per ejaculate · total motility ≥42% · progressive motility ≥30% · vitality ≥54% · normal morphology ≥4%. These are lower reference limits derived from fertile populations, not diagnostic thresholds for infertility — interpret them with the couple's history and with the laboratory's validated WHO methodology"],
         ["<b>When to repeat</b>","Abnormal result → repeat, ideally after 3 months to allow one complete spermatogenesis cycle. Azoospermia or a grossly deficient sperm count → arrange prompt repeat testing (NICE NG257) and refer without waiting for the repeat result"],
         ["<b>Before calling a result abnormal, exclude the artefacts</b>","Incomplete collection · a spilled first fraction · lubricant or condom use · delay or cold in transit · a febrile illness or infection in the preceding 2–3 months (which affects the sperm produced then, not now) · very short or very long abstinence"]
       ]},
       {b:"table", head:["Result","Meaning","Action"], rows:[
         ["<b>Normal</b>","Male factor unlikely","Continue with the couple's assessment"],
         ["<b>Mild to moderate abnormality</b>","<b>Common, often transient, and frequently compatible with conception</b>","<b>Repeat at 3 months.</b> After two abnormal analyses: testicular/scrotal examination and consider testosterone and gonadotrophins (NICE NG257). Address reversible factors: smoking, alcohol, recreational drugs, anabolic steroids and exogenous testosterone (a genuinely common and reversible cause that men do not disclose unless asked directly), obesity, occupational heat, and certain drugs (sulfasalazine, cimetidine, spironolactone, nitrofurantoin, chemotherapy)"],
         ["<b>Azoospermia or grossly deficient sperm count</b>","Obstructive or non-obstructive spermatogenic failure; may indicate Klinefelter syndrome, Y-chromosome microdeletion, CF-associated vas deferens absence, or hypogonadotrophic hypogonadism","<b>Repeat as soon as possible AND refer to a fertility service or urology now.</b> Examine for testicular volume, varicocele and vas deferens; check FSH, LH and testosterone; karyotype and genetic testing are specialist-arranged. <b>Do not wait for the repeat before referring</b>"],
         ["<b>Normal count with very poor motility or morphology</b>","May still substantially reduce natural conception","Repeat at 3 months; refer if persistent"],
         ["<b>Retrograde ejaculation or no ejaculate</b>","<b>Diabetes, spinal injury, bladder-neck surgery, alpha-blockers</b>","Post-ejaculatory urine microscopy; refer to urology"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"red", h:"⛔ Testosterone is a contraceptive, not a fertility treatment", html:"Exogenous testosterone — prescribed, bought online, or taken as part of anabolic steroid use — suppresses the HPG axis and can cause azoospermia. <b>Exogenous testosterone suppresses gonadotrophins and spermatogenesis and should not be started as treatment for male infertility.</b> If symptomatic hypogonadism is suspected, refer for specialist assessment; do not substitute testosterone for a fertility-directed treatment. Ask about gym supplements and steroid use explicitly and without judgement; recovery after stopping takes months and is not always complete."},
         {tone:"amber", h:"⚠ Do not let the semen result end the conversation", html:"An abnormal result lands hard, and men are frequently given it by letter or in a sentence. Deliver it in person where possible, with the repeat already arranged and the reversible factors named — and make clear that mild abnormalities are common and often transient."},
         {tone:"blue", h:"🔬 Which tests are NOT useful", html:"Antisperm antibody testing and post-coital testing are not recommended. NICE NG257 advises against testing sperm DNA integrity (fragmentation). <b>Do not order what will not change the plan.</b>"},
         {tone:"green", h:"✓ What genuinely helps sperm quality", html:"Stop smoking and recreational drugs · alcohol within limits · lose weight if obese · stop anabolic steroids and exogenous testosterone · avoid prolonged scrotal heat (hot baths, saunas, laptops on the lap, long-haul driving) · review culprit medications. Loose underwear is often mentioned; the evidence is weak but the advice is harmless."}
       ]}
     ]},

    {id:"preconception", nav:"Preconception", title:"Preconception care, timing advice, and the couple in the room",
     blocks:[
       {b:"table", head:["Element","What to do","Detail"], rows:[
         ["<b>Folic acid</b>","<b>400 micrograms daily from before conception until 12 weeks' gestation.</b> Use 5 mg daily when indicated by current national guidance — for example, previous pregnancy affected by a neural-tube defect, diabetes, or certain antiseizure medicines. Consider malabsorption conditions such as coeliac disease individually and follow current local prescribing guidance. BMI ≥30 alone does not automatically require 5 mg (NICE pregnancy nutrition guidance)","One of the few interventions with an unambiguous, large effect — start it at the first appointment, not at the referral. The MRC Vitamin Study (1991) showed a 72% reduction in neural tube defect recurrence with 4 mg daily in high-risk women, which is why the high-dose arm exists at all"],
         ["<b>Previous or current pelvic inflammatory disease</b>","<b>Do not prescribe antibiotics for a remote history of PID</b> in the absence of current infection. <b>Suspected acute PID:</b> pregnancy test and assess for ectopic pregnancy, tubo-ovarian abscess, appendicitis and other differentials; outpatient regimen per BASHH 2019 and the Greater Manchester antimicrobial guideline (ceftriaxone 1 g IM single dose, then doxycycline 100 mg BD plus metronidazole 400 mg BD for 14 days) — doxycycline is unsuitable in pregnancy, so check pregnancy status first. Refer to sexual-health services where appropriate; treat and notify partners according to the relevant STI pathway","Consider admission or urgent specialist assessment for severe illness, pregnancy, suspected abscess, inability to tolerate oral treatment or failure to improve. Previous PID is a tubal-factor risk and a reason for early referral, not for antibiotics"],
         ["<b>Caffeine</b>","Avoid excessive caffeine. During pregnancy, use the current NHS/NICE recommended limit of 200 mg a day","There is insufficient justification for presenting 300 mg a day as a validated infertility threshold; patients routinely underestimate mug sizes and forget tea, cola and energy drinks"],
         ["<b>Coital timing</b>","<b>Intercourse every 2–3 days throughout the cycle</b>","This is deliberately simpler than ovulation tracking, and better: timed-intercourse regimens and ovulation kits increase stress without improving conception rates. Saying so relieves a burden most couples have taken on"],
         ["<b>Smoking</b>","Cessation for BOTH partners — it reduces fertility in each; NHS treatment eligibility (including smoking status) is set by local ICB policy","Offer varenicline or NRT plus behavioural support. <b>Passive smoking also matters</b>"],
         ["<b>Alcohol and recreational drugs</b>","Her: no alcohol is the safest option when trying to conceive. Him: within recommended limits — excess impairs semen quality. Stop recreational drugs and anabolic steroids","Cannabis and cocaine both impair fertility; anabolic steroids can cause azoospermia"],
         ["<b>Weight</b>","Explain that higher BMI may reduce natural and assisted-conception success (BMI ≥30 is associated with taking longer to conceive; BMI outside 19–30 may reduce assisted-reproduction success — NICE NG257). Aim toward 20–25","Discuss weight management sensitively, but do not make weight loss a blanket precondition for referral — delaying referral solely for weight loss may be harmful in an older person. NHS treatment eligibility is determined by local ICB policy"],
         ["<b>Medication and vaccination review</b>","Review teratogens and fertility-impairing drugs; check rubella immunity; ensure cervical screening is up to date; vitamin D per current national pregnancy guidance and individual risk (general preconception advice, not a fertility treatment)","Do this now: it takes months to switch an antiepileptic or complete an MMR course safely"],
         ["<b>Chronic conditions</b>","Optimise diabetes (HbA1c pre-pregnancy), thyroid disease, epilepsy, hypertension, inflammatory arthritis and IBD BEFORE conception, with the relevant specialist","See <a href='thyroid-pregnancy.html'>thyroid disease in pregnancy</a> and <a href='epilepsy.html'>epilepsy</a>. Several drugs (ACE inhibitors, methotrexate, sodium valproate, isotretinoin) require a planned switch"],
         ["<b>The consultation itself</b>","Invite both partners. Then offer each a private appointment as a matter of routine","Two people in the room are often at different stages, and some information — a previous pregnancy or termination, an STI, a doubt about the relationship, coercion, or sexual difficulty — will only ever be said alone. Make the single appointment normal rather than exceptional"]
       ]},
       {b:"cards", items:[
         {tone:"green", h:"💬 Name the emotional weight", html:"Infertility carries grief, shame, blame and isolation, and it strains relationships — say so rather than leaving it in the room unspoken. Signpost <b>Fertility Network UK</b>, and offer counselling: NICE QS73 expects it to be offered before, during and after treatment — it is not a soft extra."},
         {tone:"amber", h:"⚠ Beware the unequal narrative", html:"The investigation set can imply that the problem is hers, because her tests outnumber his. Say explicitly at the outset that this is a couple's assessment and that male factor accounts for around half — it prevents blame settling on one person while the workup proceeds."},
         {tone:"blue", h:"📋 What to have ready for the referral", html:"Duration of trying · both ages · cycle history · previous pregnancies for each · relevant surgical and infection history · smoking, alcohol and BMI for both · semen analysis (with repeat if done) · day-21 progesterone · chlamydia and rubella status · any known condition and its drugs. Include available results and clearly identify outstanding tests — do not delay referral solely to complete them."},
         {tone:"green", h:"✓ Say what the odds actually are", html:"Give real figures rather than optimism or gloom: more than 80% conceive within a year and over 90% within two (population estimates, not individual predictions); for those needing treatment, use current HFEA data or clinic-specific figures, stating the denominator. <b>Accurate numbers are more supportive than encouragement.</b>"}
       ]}
     ]},

    {id:"treatment", nav:"Treatment", title:"What happens in secondary care — and what a GP needs to be able to explain",
     sub:"A GP does not initiate any of this, but is asked about all of it.",
     blocks:[
       {b:"table", head:["Treatment","What it is and who it is for","What the GP needs to know"], rows:[
         ["<b>Letrozole — ovulation induction in PCOS</b>","An aromatase inhibitor, now preferred first-line for ovulation induction in PCOS by many UK fertility clinics. Off-label; supported by contemporary PCOS guidance. Specialist initiation and monitoring arrangements vary","Higher live birth rate and lower multiple-pregnancy rate than clomifene (Legro et al, NEJM 2014). <b>Off-label for this indication in the UK</b> — it is licensed as a breast cancer treatment, which alarms patients who read the leaflet, so say it first"],
         ["<b>Clomifene citrate</b>","The traditional ovulation-induction agent; still widely used under specialist or agreed local-pathway arrangements (NICE NG257 no longer covers ovulation induction in PCOS — its PCOS recommendations were withdrawn pending a separate guideline in development)","Requires ovarian and cycle monitoring — it should not be initiated or repeated in primary care without an agreed local pathway. Risks: multiple pregnancy, and ovarian hyperstimulation"],
         ["<b>Antioxidant supplements for male factor</b>","<b>Do not routinely recommend antioxidant supplements for male infertility</b> (ESHRE advises against routine adjunct antioxidant therapy)","Discuss them only if specifically requested, explaining that evidence for improved live birth is insufficient, they may be costly, and they do not replace investigation or andrology referral. Stopping smoking, reducing alcohol and avoiding scrotal heat matter more"],
         ["<b>Metformin in PCOS</b>","<b>Do not initiate metformin solely to improve fertility.</b> Consider it for a recognised metabolic indication or when advised by the fertility/PCOS team, following the current PCOS guideline","It is not a substitute for ovulation induction and not first-line ovulation induction. Fasting insulin is not routinely required, and BMI &gt;30 does not establish insulin resistance. A GP may be asked to continue it when started by the specialist team"],
         ["<b>Gonadotrophin therapy</b>","Injectable stimulation where oral agents fail, and pulsatile GnRH or gonadotrophin therapy in hypogonadotrophic hypogonadism","<b>Entirely specialist. Carries the highest OHSS risk</b> — see the red-flag card below"],
         ["<b>IVF</b>","<b>Indications: tubal factor, unexplained infertility, mild male factor</b>","Explain that IVF success declines with increasing age, and use the current HFEA data or clinic-specific figures, clearly stating the denominator and whether figures refer to pregnancy, live birth, initiated cycle or embryo transfer. <b>Age-related decline is the honest basis for urgency</b> — explaining it is kinder than implying time is unlimited"],
         ["<b>ICSI</b>","<b>A single sperm injected directly into each egg.</b> ICSI may be considered for severe male-factor infertility, surgically retrieved sperm (e.g. PESA/TESA or testicular sperm extraction), or previous failed or very poor fertilisation. The fertility specialist decides whether ICSI is appropriate — no single sperm-count cut-off is an automatic indication","The existence of ICSI is why a very low count is not the end of the conversation — a man told his count is \"almost zero\" often assumes it is hopeless"],
         ["<b>Ovarian reserve testing</b>","<b>AMH, and antral follicle count on pelvic ultrasound</b>","AMH or antral follicle count may be used to predict ovarian response and support counselling about assisted conception (NICE NG257); AMH thresholds are assay- and laboratory-dependent and should not be used as stand-alone diagnostic labels. AMH does not predict the chance of natural conception — the most misread result in this pathway"],
         ["<b>Pelvic ultrasound</b>","For all women: antral follicle count, fibroids, ovarian cysts and endometrioma","Arrange in primary care where locally permitted; <b>chlamydia NAAT before any uterine instrumentation</b>"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"red", h:"⚠ OHSS — the emergency a GP may see first", html:"Ovarian hyperstimulation syndrome presents after stimulation with abdominal distension and pain, nausea and vomiting, reduced urine output, and breathlessness. Severe OHSS is life-threatening — ascites, pleural effusion, haemoconcentration and VTE. Any woman recently through stimulation who presents unwell needs same-day discussion with her fertility unit, not a routine appointment. Highest risk with gonadotrophins and in the PCOS phenotype."},
         {tone:"amber", h:"🧬 CBAVD and cystic fibrosis", html:"Congenital bilateral absence of the vas deferens is found in over 95% of men with cystic fibrosis, If congenital absence of the vas deferens is identified, refer for specialist and genetic assessment. CFTR testing should be arranged for the affected person and partner as appropriate. Do not quote a fixed reproductive risk without the genetic results and genetic counselling. This is why the vas is palpated rather than assumed."},
         {tone:"blue", h:"🔬 Other specialist investigations", html:"HyCoSy or HSG for tubal patency (specialist-arranged) · karyotype and FMR1 in premature ovarian insufficiency · karyotype, FSH and testicular biopsy to distinguish obstructive from non-obstructive azoospermia. Sperm DNA integrity (fragmentation) testing is <b>not</b> recommended by NICE NG257."},
         {tone:"green", h:"🩺 Endocrine and urological routes", html:"Hyperprolactinaemia (interpret in context — repeat an unexpected elevation, consider medication, pregnancy, thyroid disease and macroprolactin, then endocrine assessment and imaging according to the level, symptoms and local pathway) · premature ovarian insufficiency (karyotype, FMR1, HRT initiation) · hypogonadotrophic hypogonadism. Varicocele detected on clinical examination WITH reduced semen parameters in a man trying to conceive → NICE NG257 (2026) advises considering radiological (embolisation) or surgical treatment, taking female fertility factors into account (this reverses CG156). A varicocele with normal semen parameters is not an indication; see <a href='varicocele.html'>varicocele</a>."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral and funding",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"Refer WITHOUT waiting for results", html:"Person trying to conceive aged 36 or over · suspected or known cause or predisposing factor in either partner · azoospermia or a grossly deficient sperm count · known cause of infertility (previous cancer treatment, bilateral tubal disease, premature ovarian insufficiency) · amenorrhoea with a suspected endocrine cause. <b>Delay in these groups costs options that do not come back.</b>"},
         {tone:"blue", h:"Refer after 1 year — tests in parallel", html:"<b>After 1 year of trying, investigate both partners without delay and refer.</b> Include available results from \"What to have ready\" and clearly identify outstanding tests — do not delay referral solely to complete semen analysis, progesterone or other baseline tests."},
         {tone:"amber", h:"⚠ Funding — check before you promise", html:"NHS funding for IVF is decided by the local ICB and varies substantially: the number of cycles, the woman's age limits, BMI thresholds, smoking status, whether either partner has an existing child (including from a previous relationship), and a required period of trying or of self-funded IUI. NICE NG257 recommends 3 full cycles under 40 and 1 full cycle at 40–41 (before the 42nd birthday) if there has been no previous IVF, no evidence of low ovarian reserve, and the implications have been discussed, but local policy frequently offers less. NICE recommendations are clinical recommendations and should not be described as an entitlement; NHS-funded treatment depends on the current local ICB policy, including age, BMI, smoking, previous IVF, existing children, duration of infertility and other criteria. Check the current NHS Greater Manchester ICB fertility policy (and record the date accessed) before the conversation, and do not promise or imply a specific number of cycles — an expectation set wrongly here is remembered for years."},
         {tone:"blue", h:"Urology / andrology", html:"Azoospermia or a grossly deficient sperm count · suspected obstruction · varicocele with abnormal parameters · absent vas deferens (specialist and genetic assessment) · retrograde ejaculation · suspected hypogonadism. A testicular mass is not managed as male infertility or referred routinely to a fertility clinic — see NG12 below."},
         {tone:"purple", h:"Suspected cancer · NICE NG12 — the cancers found during a fertility workup", html:"Infertility has no suspected-cancer criterion of its own, and none is invented here — but two NG12 routes run directly through this assessment and both are found on examination or first-line tests. A non-painful enlargement or change in shape or texture of the testis → consider a suspected cancer pathway referral for testicular cancer (and consider an urgent direct-access ultrasound for unexplained or persistent testicular symptoms). A cervix whose appearance on examination is consistent with cervical cancer → consider a suspected cancer pathway referral — a recent normal cervical screening result does not exclude the need for urgent referral when the cervix appears suspicious. Post-coital bleeding is not itself an NG12 criterion, but it is the reason to examine the cervix and needs gynaecology assessment per local pathway if persistent or unexplained. Genital examination is part of this workup and must not be skipped because the presenting request is a fertility referral."},
         {tone:"green", h:"Counselling and support", html:"Offer counselling — NICE NG257 recommends it before, during and after investigation and treatment, independent of the medical pathway. <b>Fertility Network UK</b>, and local NHS or clinic-based fertility counselling."},
         {tone:"cream", h:"GP management", html:"Primary care owns: the timing decision, the parallel investigation of both partners, semen-analysis technique and its repeat, preconception care and folic acid, optimising chronic disease and switching teratogenic drugs, weight and smoking, the emotional support, and a referral complete enough to be useful. Related pages: <a href='pcos.html'>PCOS</a> · <a href='hyperprolactinaemia.html'>hyperprolactinaemia</a> · <a href='erectile-dysfunction.html'>erectile dysfunction</a> · <a href='testosterone-deficiency.html'>testosterone deficiency</a>."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A couple attend together: she is <b>37</b>, he is 39. They have been trying for <b>14 months</b>. Her cycles are regular at 32 days. She has had <b>chlamydia treated at 22</b>. He mentions in passing that he has been \"doing a proper gym programme\" for a year and takes \"a supplement stack\" a friend recommended. Her BMI is <b>32</b>, she smokes 10 a day, and she asks directly: <b>\"Can you refer us for IVF today?\"</b> She adds that her sister got three free rounds."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Recognises that at 37 with 14 months of trying, referral should be offered now, with investigations arranged in parallel rather than awaited; arranges BOTH a semen analysis and a day-21 progesterone at this visit — and knows that in a 32-day cycle the correct day is 25, not 21; asks directly and non-judgementally about the \"supplement stack\", identifying probable anabolic steroid or testosterone use as a reversible cause of azoospermia, and explains that testosterone acts as a contraceptive; <b>notes the previous treated chlamydia as a tubal-factor risk</b> (not active infection) and offers STI testing per risk, with chlamydia testing before any uterine instrumentation; addresses smoking and BMI as fertility factors and possible ICB eligibility criteria — framed as practical information, not judgement, without making weight loss a precondition for referral; <b>starts folic acid 400 micrograms (BMI alone does not indicate 5 mg)</b>; <b>gives the every-2–3-days advice rather than ovulation tracking</b>; <b>does not promise IVF funding</b>, explaining that ICB criteria vary and that her sister's entitlement may differ, while committing to check; says explicitly that this is a couple's assessment and male factor accounts for about half, so blame does not settle on her; <b>offers each of them a separate appointment</b>; and acknowledges the emotional weight and signposts counselling and Fertility Network UK."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG257 — Fertility problems: assessment and treatment (31 March 2026; replaced CG156)</b><br><a href="https://www.nice.org.uk/guidance/ng257" rel="noopener">nice.org.uk/guidance/ng257</a><span class="rd"> — the 1-year threshold and the early-investigation exceptions, over 80% conceiving within 1 year and over 90% within 2 years, the current semen-analysis reference values, intercourse every 2–3 days rather than timed regimens, the primary-care investigation set, semen-analysis repeat timing, the recommendation against post-coital and antisperm antibody testing, the counselling recommendation, the 3-cycle / 40–41 IVF access recommendations (clinical recommendations, not an NHS entitlement — see <a href="https://www.nice.org.uk/guidance/ng257/chapter/Recommendations" rel="noopener">NG257 recommendations</a>), the advice against sperm DNA integrity testing, and considering treatment of a clinical varicocele with reduced semen parameters</span></li>'+
         '<li><b>NICE NG257 \u2014 Fertility problems: assessment and treatment</b><br><a href="https://www.nice.org.uk/guidance/ng257" rel="noopener">nice.org.uk/guidance/ng257</a><span class="rd"> — the primary-care workup, mid-luteal progesterone timing in non-28-day cycles, and referral criteria</span></li>'+
         '<li>WHO laboratory manual for the examination and processing of human semen, 6th edition (2021) — use the edition validated by the local laboratory<span class="rd"> — collection and transport conditions; reference values on this page follow NICE NG257</span></li>'+
         '<li><b>BASHH — UK national guideline for the management of pelvic inflammatory disease (2019 update)</b><br><a href="https://www.bashh.org/guidelines" rel="noopener">bashh.org/guidelines</a><span class="rd"> — suspected acute PID: outpatient ceftriaxone 1 g IM, then doxycycline and metronidazole for 14 days; pregnancy testing, admission criteria and partner management</span></li>'+
         '<li><b>Greater Manchester Antimicrobial Guidelines (GMMMG, October 2024)</b><br><a href="https://gmmmg.nhs.uk" rel="noopener">gmmmg.nhs.uk</a><span class="rd"> — local PID antibiotic choice</span></li>'+
         '<li><b>NICE — Maternal and child nutrition: nutrition and weight management in pregnancy</b><span class="rd"> — 400 micrograms folic acid is sufficient unless another risk factor is present; no evidence for high-dose folic acid solely because of BMI</span></li>'+
         '<li><b>ESHRE — Evidence-based guideline on unexplained infertility (2023)</b><span class="rd"> — advises against routine adjunct antioxidant therapy</span></li>'+
         '<li><b>NHS Greater Manchester ICB — fertility (assisted conception) commissioning policy</b><span class="rd"> — determines actual NHS eligibility; check the current version and record the date accessed</span></li>'+
         '<li>NICE NG23 — Menopause: identification and management (updated April 2026), including its premature ovarian insufficiency section<span class="rd"> — the ovarian-reserve context for AMH and FSH interpretation</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — suspected cancer pathway referral for a non-painful enlargement or change in shape or texture of the testis (direct-access ultrasound for unexplained or persistent testicular symptoms), and for a cervix whose appearance is consistent with cervical cancer</span></li>'+
         '<li><b>HFEA — Human Fertilisation and Embryology Authority</b><br><a href="https://www.hfea.gov.uk" rel="noopener">hfea.gov.uk</a><span class="rd"> — current national and clinic-level success data by age (state the denominator: pregnancy, live birth, initiated cycle or embryo transfer), and patient information on treatment options, donor conception and surrogacy</span></li>'+
         '<li><b>Fertility Network UK</b><br><a href="https://fertilitynetworkuk.org" rel="noopener">fertilitynetworkuk.org</a><span class="rd"> — the patient support organisation signposted throughout</span></li>'+
         '<li>FGM mandatory reporting duty (Serious Crime Act 2015) · local safeguarding procedures<span class="rd"> — the statutory duties referenced in the safeguarding card</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Infertility — NICE NG257 (2026, replaced CG156), the WHO semen analysis manual, NG12 and HFEA. Investigate after 1 year — but offer specialist referral at presentation when the person trying to conceive is 36 or over, or with a suspected or known cause in either partner, with tests in parallel rather than awaited, because age is the one variable that does not come back. Investigate BOTH partners in parallel from the first appointment: male factor contributes in about half. Get the semen analysis technique right and repeat an abnormal result at 3 months. Do not start testosterone as treatment for male infertility. Time the mid-luteal progesterone 7 days before the expected period, not on day 21. Start folic acid 400 micrograms (5 mg only when nationally indicated), address smoking and weight without making them a blanket precondition for referral, and check the current local ICB policy before setting any expectation — NICE recommendations are not an entitlement. Verify all doses against the BNF before prescribing."
