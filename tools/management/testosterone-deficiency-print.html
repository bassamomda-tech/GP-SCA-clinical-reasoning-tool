  quickSub:"If you read nothing else on this page, read these six cards. Every number traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Exclude a pituitary cause before prescribing", html:"TT &lt;5.2 nmol/L with low LH and FSH, or a raised prolactin → refer endocrinology or arrange a pituitary MRI to exclude an adenoma BEFORE starting TRT. Treating a prolactinoma with TRT alone will not restore testicular function, will not shrink the tumour, and may allow it to grow undetected — whereas cabergoline alone normalises testosterone in 60–70% of men within 3–6 months."},
    {tone:"red", h:"The fertility conversation happens BEFORE the prescription", html:"TRT suppresses LH and FSH → azoospermia and testicular atrophy, potentially irreversible after prolonged use; recovery of spermatogenesis may take 6–24 months and is not guaranteed. An active desire for children — now or possibly in future — is a contraindication. Use <b>hCG or clomifene</b> instead. <b>This conversation must be documented.</b>"},
    {tone:"amber", h:"One low level is not enough", html:"Diagnosis needs symptoms PLUS two morning (7–11am) fasting samples ≥4 weeks apart. Testosterone has a diurnal rhythm — afternoon levels run up to 35% lower, so a single low afternoon result may be normal variation. <b>Measure an initial prolactin and FBC in everyone, and LH to classify.</b>"},
    {tone:"blue", h:"LH is the branch point", html:"High LH → primary (testicular) failure — needs TRT but NOT pituitary imaging. Low or inappropriately normal LH → secondary (central) — needs MRI pituitary before TRT. <b>This distinction cannot be made from testosterone alone.</b>"},
    {tone:"green", h:"Functional hypogonadism is fixable — TRT is not the answer", html:"Obesity, T2DM, OSA, opioids and alcohol all suppress testosterone reversibly. 10% weight loss raises testosterone by about 3–5 nmol/L; bariatric surgery normalises it in 70–80% of morbidly obese men. <b>Opioids suppress it in around 70% of men on long-term treatment.</b> Correct the cause first — that is potentially curative, where TRT is lifelong."},
    {tone:"purple", h:"Two numbers govern safety on treatment", html:"<b>Haematocrit must stay &lt;0.54 (&lt;54%, roughly Hb 18 g/dL)</b> — TRT drives erythropoiesis, and the risk is thrombosis. 0.50–0.54: reduce the dose or extend the interval. &gt;0.54: withhold and seek specialist advice. PSA: stop and refer to urology for a rise &gt;1.4 ng/mL in 12 months, &gt;0.4 ng/mL in 6 months, an absolute PSA &gt;4, or a new abnormal DRE."}
  ],

    {title:"Screen the right men, and check for contraindications", html:"All men with ED, loss of spontaneous erections or low sexual desire; T2DM, CKD, BMI BMI &gt;30 or waist &gt;102 cm; long-term opiates, antipsychotics or anticonvulsants. Then the absolute contraindications.", alert:true},

    {title:"Classify with LH", html:"High LH → primary. Low or normal LH → secondary → exclude a pituitary adenoma — prolactinoma, non-functioning adenoma or other sellar mass — before treating. Identify <b>functional</b> causes separately — they are reversible."},

  sections:[

    {id:"severe", nav:"Before TRT", title:"Red flags, pituitary exclusion and absolute contraindications",
     sub:"Diagnosis requires symptoms PLUS two morning levels below threshold. Low testosterone with low LH/FSH requires a pituitary cause to be excluded before TRT.",
     blocks:[
       {b:"warn", html:"<b>Main contraindications to T Therapy (BSSM 2023):</b> prostate cancer (locally advanced or metastatic) · male breast cancer · an active desire to have children (now or possibly in the future) · haematocrit &gt;54% · severe chronic heart failure (NYHA class IV). Establish PSA, DRE, FBC/haematocrit and fertility wishes before starting."},
       {b:"table", head:["Finding","Why it matters","Action"], rows:[
         ["<b>TT &lt;5.2 nmol/L + low LH/FSH, or raised prolactin</b>","Pituitary adenoma — prolactinoma most common; hyperprolactinaemia suppresses GnRH, LH and FSH → secondary TD","<b>Refer endocrinology or arrange a pituitary MRI.</b> A dopamine agonist (cabergoline) treats a prolactinoma and restores testosterone — TRT alone without treating the tumour is inappropriate"],
         ["<b>Low testosterone + anaemia + bone pain + fatigue, age ≥50</b>","Haematological malignancy (multiple myeloma) or prostate cancer bone metastases","<b>PSA and DRE before any TRT.</b> TRT is contraindicated in locally advanced or metastatic prostate cancer"],
         ["<b>Haematocrit &gt;54% (&gt;0.54)</b>","Contraindication to initiation — TRT increases erythropoiesis and can cause polycythaemia with thrombosis risk","Check FBC before starting; haematocrit must remain &lt;54% on treatment — recheck at 3, 6 and 12 months then yearly"],
         ["<b>Untreated severe obstructive sleep apnoea</b>","<b>TRT can worsen OSA</b>, and undiagnosed OSA often coexists with TD","<b>Treat the OSA first (CPAP). Screen with STOP-BANG</b>"],
         ["<b>Active desire for fertility, now or possibly in future</b>","TRT suppresses the HPG axis → reduced spermatogenesis → testicular atrophy","Avoid T Therapy. In secondary TD with low or low-normal LH, offer hCG or clomifene (unlicensed in men), or refer to reproductive endocrinology — these are not used if pituitary function is compromised"]
       ]},
       {b:"why", html:"The pituitary exclusion before starting TRT is the most important safety step in testosterone deficiency management. Secondary hypogonadism can be caused by a prolactinoma, a non-functioning pituitary adenoma, a craniopharyngioma, or hypopituitarism. The key investigation is a serum prolactin alongside LH and FSH: raised prolactin with low LH/FSH and low testosterone is a prolactinoma until proven otherwise → urgent MRI pituitary. Treating a prolactinoma with TRT alone will not restore testicular function, will not shrink the tumour, and may allow it to grow undetected — whereas cabergoline alone typically normalises testosterone in 60–70% of men within 3–6 months."},
       {b:"why", html:"The TRT and fertility issue is one of the most important counselling points in younger men. TRT causes iatrogenic infertility by suppressing FSH (needed for spermatogenesis) and LH (needed for intratesticular testosterone production), and this is potentially irreversible after prolonged use because of testicular atrophy. Recovery of spermatogenesis after stopping may take 6–24 months and is not guaranteed. Any man who may wish to have biological children must be counselled specifically about this before starting TRT, with alternatives (hCG, clomiphene) discussed — and the conversation documented."},
       {b:"dl", rows:[
         ["<b>NG12 — the criterion that applies here</b>","Because a PSA and DRE are mandatory before TRT, this pathway generates NG12 referrals directly. NICE NG12: refer men on a suspected cancer pathway (for an appointment within 2 weeks) for prostate cancer if their prostate feels malignant on digital rectal examination, or if their PSA is above the age-specific range (age-specific reference range). That applies both at baseline and on treatment — and a PSA &gt;4 ng/mL or an abnormal DRE before TRT means prostate cancer exclusion first. Restated in <a href='#refer'>Refer</a>"]
       ]}
     ]},

    {id:"confirm", nav:"Confirm", title:"Who to screen, the symptoms, and biochemical confirmation",
     sub:"Diagnosis requires both consistent symptoms AND confirmed biochemical deficiency. Symptoms alone do not justify treatment.",
     blocks:[
       {b:"dl", rows:[
         ["<b>Who to screen (BSSM 2023)</b>","Adult men with consistent, multiple signs of TD · all men with ED, loss of spontaneous erections or reduced sexual desire · men with type 2 diabetes, CKD, BMI &gt;30 kg/m² or waist &gt;102 cm · men on long-term opiate, antipsychotic or anticonvulsant medication"],
         ["<b>The three most common symptoms</b>","Erectile dysfunction, loss of early-morning erections, and low sexual desire"],
         ["<b>Sexual symptoms — most specific</b>","Reduced libido (the most consistent symptom) · erectile dysfunction (reduced morning erections is specific — nocturnal penile tumescence is testosterone-dependent) · reduced ejaculatory volume · reduced penile or scrotal sensation · infertility (azoospermia)"],
         ["<b>Physical symptoms</b>","Reduced muscle mass and strength · increased central adiposity, gynaecomastia · reduced body and facial hair · fatigue, reduced stamina · hot flushes and sweating · reduced bone density (osteoporosis, fragility fractures) · anaemia (normocytic — testosterone stimulates erythropoiesis)"],
         ["<b>Psychological symptoms — less specific</b>","Low mood, depression, irritability · poor concentration and memory · reduced motivation, vitality and wellbeing. Psychological symptoms alone are non-specific and should not drive a TRT prescription without biochemical confirmation — depression and burnout mimic TD"],
         ["<b>Validated questionnaire — AMS</b>","Ageing Males' Symptoms (AMS) scale — 17 questions scoring psychological, somatic and sexual symptoms. A score ≥37 indicates moderate-to-severe symptoms. Useful for documenting baseline burden and tracking response. The ADAM questionnaire (Androgen Deficiency in Ageing Males) is a simpler 10-question screen but less validated — use AMS for structured assessment"],
         ["<b>Differential diagnosis</b>","Symptoms overlap significantly with depression, hypothyroidism, anaemia, OSA, type 2 diabetes, chronic ill health, alcohol excess and anabolic steroid abuse. Exclude these before attributing symptoms to TD"]
       ]},
       {b:"table", head:["Biochemical confirmation","Detail"], rows:[
         ["<b>Total testosterone × 2</b>","Two 7–11am fasting samples, at least 2 occasions ≥4 weeks apart. TT &lt;12 nmol/L = low or borderline (use &lt;14 in pre-diabetes)"],
         ["<b>Thresholds</b>","Confirmed TD: TT &lt;12 and/or free T &lt;0.225 nmol/L; TT below 8 and/or free T &lt;0.180 nmol/L. Borderline 8–12 → calculate free T"],
         ["<b>LH and FSH</b>","LH classifies primary versus secondary. FSH is chiefly needed if fertility is relevant"],
         ["<b>Prolactin and FBC in everyone</b>","An initial prolactin to exclude hyperprolactinaemia, and an FBC because anaemia is a frequent finding"],
         ["<b>SHBG</b>","Add to calculate free testosterone (Vermeulen or PCTAG calculator) when TT is borderline"]
       ]},
       {b:"why", html:"The requirement for two separate morning measurements is fundamental — testosterone has a diurnal rhythm, peaking at 7–9am with afternoon and evening troughs up to 35% lower, so a single low afternoon level may simply reflect normal variation. BSSM and EAU both specify at least two early-morning fasting measurements below the reference range on separate occasions (typically 4–12 weeks apart) before TRT is initiated — this prevents treating transient suppression from acute illness, stress, obesity or alcohol. And the differential is why structure matters: a middle-aged man with fatigue, low mood, low libido and weight gain could have hypothyroidism, type 2 diabetes, depression, OSA or anaemia — all more common than true hypogonadism, and all addressable at the root cause without the risks and commitments of TRT."}
     ]},

    {id:"workup", nav:"Classify", title:"Primary, secondary, age-related or functional — and the investigations",
     sub:"The LH result is the critical branch point. Functional hypogonadism is the one that should not be treated with testosterone.",
     blocks:[
       {b:"dl", rows:[
         ["<b>Primary (hypergonadotropic)</b>","<b>Testicular failure → low testosterone + elevated LH + elevated FSH.</b> Causes: Klinefelter syndrome (47 XXY — the most common; small firm testes, tall, gynaecomastia, infertility, and 30% undiagnosed until adulthood), bilateral orchidectomy, bilateral testicular torsion, chemotherapy or radiotherapy gonadotoxicity, mumps orchitis, trauma, autoimmune. FSH rises with loss of inhibin B feedback; LH rises with loss of testosterone feedback"],
         ["<b>Secondary (hypogonadotropic)</b>","Pituitary or hypothalamic failure → low testosterone + low or inappropriately normal LH + low FSH. Causes: <b>pituitary adenoma (prolactinoma — most important)</b>, haemochromatosis, <b>Kallmann syndrome (congenital — anosmia plus hypogonadism)</b>, hypopituitarism (post-radiotherapy, traumatic brain injury, Sheehan's), opioid-induced, glucocorticoid suppression, anabolic steroid suppression. <b>MRI pituitary mandatory</b>"],
         ["<b>Age-related (late-onset hypogonadism)</b>","Gradual decline of 1–2% per year after 30. Symptomatic LOH requires both biochemical deficiency AND consistent symptoms, with reversible causes excluded. Not all older men with low testosterone need treatment — many are asymptomatic"],
         ["<b>Functional</b>","Low testosterone secondary to a reversible systemic condition — obesity (aromatase converts testosterone to oestradiol in adipose tissue), type 2 diabetes, hypothyroidism, liver disease, renal failure, anabolic steroid use, opioids, alcohol. Not \u201ctrue\u201d hypogonadism — correct the underlying cause first. Weight loss of 10% raises testosterone by approximately 3–5 nmol/L"]
       ]},
       {b:"why", html:"Functional hypogonadism from obesity is one of the most clinically important and actionable diagnoses. Severely obese men (BMI &gt;40) frequently have total testosterone in the hypogonadal range from increased aromatisation to oestradiol in adipose tissue and altered SHBG binding — and bariatric surgery in morbidly obese men routinely normalises testosterone without TRT. Starting TRT in a functionally hypogonadal obese man without addressing the obesity means continuous treatment dependency, HPG axis suppression and testicular atrophy — whereas weight loss is potentially curative. Opioid-induced hypogonadism is similarly under-recognised, affecting approximately 70% of men on long-term opioids: any man on long-term opioids with TD symptoms should have the regimen reviewed as a priority — dose reduction, rotation, or a switch to buprenorphine (less HPG suppression) may restore testosterone without TRT."},
       {b:"table", head:["Investigation","Detail"], rows:[
         ["<b>Secondary investigations</b>","PSA and DRE (prostate health before TRT) · haematocrit (must be &lt;54%) · CV risk assessment · HbA1c · TSH · LFTs and ferritin (haemochromatosis) · DXA bone density / BMD (osteoporosis in longstanding TD; treat per NICE with calcium + vitamin D + a bisphosphonate if the T-score is below −2.5)"],
         ["<b>Pituitary MRI</b>","Arrange via endocrinology if TT is &lt;5.2 nmol/L with low LH and FSH, or prolactin is raised. <b>Do not start TRT until the cause of secondary TD is clarified</b>"],
         ["<b>Karyotype</b>","Consider in primary hypogonadism in a young man with small firm testes and gynaecomastia → Klinefelter (47 XXY). The most common sex chromosome disorder (1 in 600 male births) and the most common cause of male infertility. Testosterone replacement is required; some sperm retrieval is possible with <b>testicular sperm extraction (TESE)</b>"]
       ]},
       {b:"why", html:"<b>The SHBG calculation of free testosterone matters in borderline cases</b> — total testosterone can be misleadingly low where SHBG is low (obesity, diabetes, hypothyroidism, nephrotic syndrome) because a higher fraction is free and bioavailable, and misleadingly normal where SHBG is very high (ageing, liver disease, hyperthyroidism) while the bioavailable fraction is deficient. The Vermeulen formula calculates free testosterone from total testosterone, SHBG and albumin, and is the standard method in BSSM and EAU guidance. Separately, haemochromatosis as a cause of secondary hypogonadism is under-recognised: iron deposition in the anterior pituitary impairs gonadotrophin secretion, so in a man with low LH/FSH, low testosterone, liver disease, diabetes, arthropathy and bronze skin, check ferritin and transferrin saturation urgently."}
     ]},

    {id:"ladder", nav:"Treat", title:"Optimise first, then testosterone replacement",
     sub:"Baseline breast and prostate check, haematocrit, CV risk and lifestyle advice before any prescription.",
     blocks:[
       {b:"table", head:["Preparation","Detail"], rows:[
         ["<b>Transdermal gel — often preferred first-line</b>","Testosterone 1% or 2% gel, applied once daily. Short duration of action allows withdrawal if side effects occur. Apply to shoulders, upper arms or abdomen (not genitals); dry before dressing; wash hands; cover with clothing — <b>avoid skin transfer to partners and children</b>. Fast onset, uniform 24-hour levels. Titrate to total T 15–30 nmol/L, checked about 2–4 hours post-application"],
         ["<b>Short-acting injectable — preferred to start</b>","Testosterone enanthate IM every 2–3 weeks. BSSM 2023 favours short-acting preparations initially so therapy can be adjusted or stopped. Levels fluctuate — check trough before the next dose. Enanthate is associated with more erythrocytosis — monitor haematocrit. Testosterone propionate is also available; maintenance can extend to every 3–6 weeks"],
         ["<b>Long-acting injectable — steady state</b>","Testosterone undecanoate (Nebido) 1000 mg IM, repeated at 6 weeks, then every 10–14 weeks adjusted to maintain a trough &gt;12 nmol/L. Steady levels and infrequent dosing aid adherence, but <b>the long duration delays withdrawal if side effects occur</b>. Injection-site reaction; rare pulmonary oil microembolism (POME) — observe for about 30 minutes post-injection"],
         ["<b>Prolactinoma (secondary TD)</b>","Cabergoline 0.5 mg twice weekly — shrinks the prolactinoma, normalises prolactin, restores LH and FSH, and normalises testosterone in 60–70% of men within 3–6 months. TRT is added only if testosterone remains low despite therapeutic cabergoline. Endocrinology-initiated; monitor prolactin monthly until normalised"],
         ["<b>ED with TD</b>","<b>Add a PDE5 inhibitor — ideally daily tadalafil — alongside T Therapy.</b> T Therapy is appropriate for ED particularly at TT &lt;8 nmol/L and salvages oral-ED-treatment failures at TT &lt;10.4; since it can take months to improve erections, a PDE5i can be co-prescribed in all men with ED and no contraindication"],
         ["<b>Fertility-seeking man</b>","hCG (Pregnyl) 1500–2500 IU SC or IM three times a week — stimulates Leydig cells directly, maintaining intratesticular testosterone and spermatogenesis; or clomifene (unlicensed in men). If the response is inadequate after 3–6 months, add recombinant FSH. Semen analysis at 3–6 months. Specialist-initiated. <b>Do NOT start TRT while hCG or FSH treatment is ongoing</b>"]
       ]},
       {b:"why", html:"Transdermal gel is preferred first-line because it provides stable daily levels mimicking the normal diurnal rhythm, rather than the supraphysiological peaks and subphysiological troughs of fortnightly injections. The principal safety concern is transfer to female partners and children — testosterone exposure can cause virilisation in women (acne, hair growth, clitoral enlargement) and precocious puberty in prepubertal children. The prevention message (dry before contact, cover with clothing, hand-washing) must be given explicitly at prescription and documented. POME with Nebido is rare but real — the castor oil vehicle can form microemboli during injection, causing coughing, dyspnoea, chest tightness and rarely anaphylaxis, typically during or within minutes of injection; NHS England recommends a 30-minute observation and that the first injection is given in a healthcare setting. The target range (15–30 nmol/L for gel, trough 12–15 for injections) provides adequate replacement without supraphysiological levels that increase polycythaemia, aggression, cardiovascular and sleep apnoea risks."},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"⚖️ Weight loss — the most effective lifestyle intervention", html:"<b>10% weight loss raises testosterone by approximately 3–5 nmol/L</b> — through reduced aromatase activity in adipose tissue, reduced SHBG binding and reduced inflammatory cytokines (IL-6, TNF-α suppress Leydig cell function). Bariatric surgery in morbidly obese men normalises testosterone in 70–80%."},
         {tone:"blue", h:"🏋️ Resistance exercise", html:"Compound resistance training (squats, deadlifts, bench press, rows) acutely raises testosterone by 15–25% post-exercise and improves Leydig cell sensitivity over time. Three sessions a week minimum. Also builds muscle mass, improves body composition and reduces insulin resistance. More evidence than any single dietary supplement."},
         {tone:"blue", h:"😴 Sleep and OSA", html:"70% of testosterone is secreted during sleep, particularly REM and stages 3–4. Chronically short sleep (&lt;6 hours) reduces testosterone by 10–15% within a week. Target 7–9 hours. Treat OSA with CPAP — it causes significant suppression and is highly prevalent in this population. STOP-BANG screen everyone."},
         {tone:"amber", h:"🍺 Alcohol", html:"Alcohol acutely suppresses synthesis through direct Leydig cell toxicity, and chronically reduces testosterone by 30–50% in heavy drinkers. <b>Reducing to &lt;14 units a week raises testosterone.</b> Chronic alcoholics may have irreversible Leydig cell damage — check LH/FSH to classify."},
         {tone:"plain", h:"💊 Opioid review", html:"Long-term opioids suppress GnRH and reduce testosterone in around 70% of patients. Review necessity, reduce dose where possible, consider a switch to buprenorphine (less HPG suppression) — for men on methadone this can raise testosterone significantly without TRT. Document the discussion."},
         {tone:"cream", h:"🧪 Zinc, vitamin D and stress", html:"Zinc is a cofactor for testosterone synthesis — dietary sources are red meat, shellfish, legumes and nuts; supplement 25–45 mg/day if deficient (check serum zinc). Vitamin D deficiency correlates with lower testosterone — cholecalciferol 1000–2000 IU/day to correct. Neither replaces TRT in true hypogonadism. Chronic stress raises cortisol, which inhibits GnRH pulsatility — mindfulness and CBT for chronic stress help, and burnout mimics TD and should be assessed specifically."},
         {tone:"red", h:"🚫 Anabolic steroids — recovery of the HPG axis uses hCG plus clomiphene post-cycle therapy (PCT) under endocrinology guidance", html:"Illicit anabolic steroid use causes prolonged HPG suppression — testosterone and LH/FSH can remain suppressed for years after stopping. Ask directly in gym-going men: \u201chave you ever used anabolic steroids or testosterone injections?\u201d Recovery uses hCG plus clomiphene under endocrinology guidance. Document the disclosure confidentially."}
       ]},
       {b:"why", html:"The evidence for lifestyle optimisation before TRT in functional hypogonadism is compelling — a 2019 meta-analysis showed intensive lifestyle intervention in obese men raised testosterone by an average of 2.9 nmol/L, equivalent to the lower end of TRT dose titration. In men with borderline testosterone (8–12 nmol/L) and functional risk factors, a structured 3-month lifestyle programme before reassessment is both evidence-based and clinically responsible: it avoids lifelong TRT in men who can reach eugonadal levels by other means, prevents the fertility-suppressing effect in younger men, and addresses the underlying metabolic risk."}
     ]},

    {id:"monitor", nav:"Monitor", title:"Monitoring on TRT, and the annual review",
     sub:"Evaluate at 3, 6 and 12 months, then yearly. TRT must not continue on automatic repeat prescription.",
     blocks:[
       {b:"table", head:["When","What"], rows:[
         ["<b>Before starting — document</b>","Two testosterone levels with dates · LH/FSH · prolactin · PSA and DRE · FBC and haematocrit · TSH · HbA1c · the fertility discussion and its outcome · gel transfer safety counselling · written patient information provided · MRI pituitary result if secondary"],
         ["<b>3 months</b>","Testosterone (gel: 2–4 hours post-application; Nebido: trough before the third injection) — adjust to target. FBC and haematocrit. PSA. Symptom reassessment (AMS). Any gynaecomastia — aromatisation to oestradiol, add anastrozole if troublesome (specialist decision)"],
         ["<b>6 months</b>","Repeat FBC, PSA, testosterone, AMS score, blood pressure, weight, any adverse effects. If there is no benefit by 6 months (libido, sexual and muscle function, body fat) → review the treatment and investigate other causes"],
         ["<b>Annually thereafter</b>","FBC and haematocrit · PSA · testosterone · DRE · AMS score · metabolic screen (HbA1c, lipids) · DXA (BMD) every 2 years if osteoporosis at baseline · OSA review if relevant"],
         ["<b>Target range</b>","Total testosterone mid-upper range, 15–30 nmol/L; haematocrit must stay &lt;0.54"],
         ["<b>Treatment duration</b>","TRT is lifelong for true hypogonadism (primary, or secondary with an irreversible cause), with annual reassessment of benefits versus risks. Consider a trial of cessation in functional hypogonadism if the underlying cause has been corrected. After long-term use the HPG axis may take 6–24 months to recover — taper slowly with specialist guidance, do not stop abruptly"]
       ]},
       {b:"warn", html:"<b>PSA thresholds — stop TRT and refer to urology if:</b> PSA rises &gt;1.4 ng/mL above baseline in any 12-month period · PSA velocity &gt;0.4 ng/mL in 6 months · absolute PSA &gt;4 ng/mL at any time on TRT · new abnormal DRE. TRT does NOT cause prostate cancer, but it can unmask subclinical disease by stimulating pre-existing cancer cells. Haematocrit management: 0.50–0.54 → reduce the dose or extend the injection interval. &gt;0.54 → withhold TRT and refer. Consider venesection (therapeutic phlebotomy) if very high, and check erythropoietin, smoking status and OSA."},
       {b:"why", html:"The concern with PSA is not that TRT causes prostate cancer, but that it can stimulate pre-existing occult cancer cells previously quiescent in a low-testosterone environment. The velocity thresholds are more sensitive than the absolute level in men on TRT, because TRT causes a modest acceptable PSA rise — but a rapid rise suggests stimulation of occult cancer. Polycythaemia is the most common significant adverse effect: testosterone stimulates erythropoietin, increasing red cell mass, and the clinical risk is venous and arterial thrombosis from increased viscosity. Injectable preparations cause higher peaks and greater erythropoietic stimulation than gels, so switching to gel or reducing the dose or frequency often resolves it without stopping TRT. On cardiovascular safety, the TRAVERSE trial (Lincoff et al., NEJM 2023) showed no significant increase in major cardiovascular events with TRT in men with hypogonadism and high cardiovascular risk — reassuring for prescribing, though the polycythaemia effect remains a genuine risk requiring active monitoring."},
       {b:"cards", items:[
         {tone:"red", h:"🔴 Same-day GP", html:"Chest pain or breathlessness after a Nebido injection (POME) · severe gynaecomastia or breast pain on TRT · new mood symptoms (aggression, mania) · a significant unexpected PSA rise."},
         {tone:"amber", h:"🟠 Stop and seek specialist review", html:"PSA rise &gt;1.4 ng/mL in 12 months or &gt;0.4 ng/mL in 6 months · haematocrit &gt;0.54 · new or worsening prostatic obstruction symptoms · confirmed prostate cancer · a new desire for fertility (switch to hCG)."},
         {tone:"blue", h:"🔁 No benefit at 6 months", html:"Review the treatment and investigate other causes rather than escalating the dose — the symptoms may never have been testosterone-driven."},
         {tone:"green", h:"📋 Annual formal review", html:"Is he still symptomatic without TRT? Is the benefit maintained? Any new contraindications? Can the dose be reduced? Any side effects? Document the ongoing indication — treatment should not continue indefinitely without formal review."}
       ]},
       {b:"say", html:"Before we talk about treatment, I want to be clear about two things. First, one low reading is not enough to diagnose this — testosterone is much higher first thing in the morning, so I need two samples taken between seven and eleven, and some other hormones alongside them to work out where the problem is. Second, if we do end up treating, there is one conversation we need to have first: testosterone treatment switches off sperm production, and that does not always come back. So if there is any chance you might want children — now or years from now — tell me, because there are different treatments that protect fertility. And if your weight, sleep or the painkillers you are on are part of the picture, tackling those can genuinely fix this, whereas testosterone is usually for life."}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Urgent endocrinology", html:"Secondary hypogonadism (low LH/FSH with low T) — MRI pituitary required before treatment · hyperprolactinaemia (prolactin &gt;1000 mU/L) — prolactinoma likely · pan-hypopituitarism features (cortisol deficiency and adrenal crisis risk) · suspected haemochromatosis with pituitary involvement."},
         {tone:"purple", h:"2WW urology · NICE NG12", html:"A prostate that feels malignant on DRE, or a PSA above the age-specific reference range → suspected cancer pathway referral. Also <b>PSA &gt;4 ng/mL or an abnormal DRE before TRT</b>, and a PSA rise &gt;1 ng/mL per year or &gt;0.4 ng/mL in 6 months while on TRT."},
         {tone:"amber", h:"Endocrinology (routine)", html:"Primary hypogonadism — initiation and titration in a specialist setting, though many trusts have GP initiation protocols for straightforward cases · Klinefelter syndrome management · complex cases: borderline testosterone, multiple comorbidities, previous prostate cancer history."},
         {tone:"blue", h:"Reproductive endocrinology / andrology", html:"Any man wishing to preserve or achieve fertility — hCG, clomiphene, FSH injections, sperm banking before TRT; TESE for Klinefelter's. <b>Refer BEFORE any TRT is commenced.</b>"},
         {tone:"cream", h:"GP initiation, where the local pathway permits", html:"Clear primary hypogonadism (elevated LH/FSH with low testosterone × 2), no red flags, normal baseline PSA, normal DRE, normal haematocrit, and the patient counselled on fertility, prostate risk and polycythaemia. <b>Check your local commissioning protocol.</b>"}
       ]},
       {b:"why", html:"NHS England and BSSM guidance have shifted significantly toward GP-led TRT initiation in straightforward primary hypogonadism, to reduce specialist waiting times. The prerequisite is that the full diagnostic workup has been done — two morning testosterone levels, LH/FSH, prolactin, SHBG, PSA, FBC, DRE, TSH — and primary hypogonadism confirmed with no contraindications. Secondary hypogonadism (low LH/FSH) always requires specialist assessment first, and GPs should follow their local commissioned pathway. On fertility: hCG works as an LH analogue, stimulating Leydig cells directly to produce intratesticular testosterone — which must be roughly 50–100 times higher than serum testosterone for spermatogenesis. That is the paradox of TRT: it raises serum testosterone but reduces intratesticular testosterone by suppressing LH, causing azoospermia despite normal blood levels. hCG bypasses this by stimulating the testes without suppressing the pituitary."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 34-year-old gym-goer attends having bought a private blood test showing a testosterone of 9.1 nmol/L, taken at 4pm. He reports low mood, fatigue and reduced libido, wants \u201cTRT like my mate is on\u201d, has a BMI of 34, sleeps badly and snores. He and his partner have talked about starting a family \u201cin a couple of years\u201d."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Does not act on the afternoon private result — explains diurnal variation and arranges two 7–11am fasting samples with LH, FSH, prolactin and FBC; <b>asks directly and non-judgementally about anabolic steroid use</b>; identifies functional contributors (BMI 34, probable OSA — STOP-BANG) and frames weight loss and CPAP as potentially curative where TRT is lifelong; screens for depression as a genuine differential rather than a diagnosis of exclusion; and — the step candidates miss — has the fertility conversation NOW rather than at prescription, because \u201cin a couple of years\u201d makes TRT the wrong treatment, and documents it."}
     ]}]},

  foot:"Testosterone deficiency — BSSM 2023 (Hackett G et al., Trends in Urology and Men's Health), EAU Male Hypogonadism guidance, NICE, NHS England TRT prescribing guidance, the TRAVERSE trial (Lincoff et al., NEJM 2023) and NICE NG12. Diagnosis requires symptoms plus two morning (7–11am) testosterone levels. Exclude a pituitary cause before starting TRT in secondary deficiency, and have the fertility conversation before prescribing. The reasoning pathway remains at the <a href=\"../algorithms/testosterone-deficiency.html\">testosterone deficiency pathway</a>. Follow your local commissioning pathway and verify all doses against the current BNF."
