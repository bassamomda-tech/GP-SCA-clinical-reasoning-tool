<script>
MG.render({
  icon:"👁️",
  title:"Blepharitis — the complete guide",
  eyebrow:"Protocol · adults · chronic lid-margin disease",
  stemTitle:"Blepharitis is chronic and relapsing — controlled by daily lid hygiene, not cured by antibiotics",
  stemSub:"<b>Primary-care management of adult blepharitis</b> — chronic anterior blepharitis, posterior blepharitis/meibomian gland dysfunction (MGD) or ocular rosacea. This guide does not replace assessment of a painful red eye, corneal disease, orbital disease or suspected malignancy; children, contact-lens-related disease and suspected corneal disease need a lower threshold for eye-care assessment. Confirm the diagnosis and exclude corneal, intraocular, infective and orbital disease. Lid hygiene — a warm compress, gentle massage and lid-margin cleaning — is first-line and long-term. Treat associated dry eye. Antibiotics are not routine: if disease persists despite good lid care, seek eye-care advice — any topical antibiotic (anterior disease) or oral doxycycline (posterior disease/MGD or ocular rosacea) is off-label for blepharitis, follows the local eye-care pathway and is a defined, reviewed course. <b>Pain, photophobia, reduced vision, corneal signs or a painful red eye in a contact-lens wearer need same-day eye assessment.</b> Persistent, atypical or same-site recurrent lid lesions need ophthalmic assessment to exclude malignancy.",
  guideline:"College of Optometrists CMG — blepharitis · NICE NG12 · MHRA SPCs (doxycycline, chloramphenicol eye ointment) · GMMMG formulary · NHS Greater Manchester eye-care pathway",
  reviewed:"25 September 2026",
  nextReview:"25 September 2027",
  meta:[
    {t:"Pain is not blepharitis", tone:"tw"},
    {t:"Lid hygiene is the treatment", tone:"ok"},
    {t:"v2.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#assess"><b>Assess</b><small>Exclude serious red eye</small></a><a href="#hygiene"><b>Lid hygiene</b><small>First-line, long-term</small></a><a href="#drugs"><b>Drugs</b><small>Not routine, pathway-led</small></a><a href="#lesion"><b>Lid lesions</b><small>Exclude malignancy</small></a><a href="#refer"><b>Refer</b><small>When and where</small></a></div>',
  quickSub:"The five that matter. Sources, with direct links, are listed under <a href=\"#provenance\">Evidence</a>; verify prescribing against the current SPC and local pathway.",
  quick:[
    {tone:"red", h:"⚠ Same-day eye assessment", html:"Moderate or severe pain · photophobia · new or persistent reduced vision · blurred vision that does not clear with blinking · corneal opacity, infiltrate, ulceration or significant staining · marked ciliary injection · hypopyon · <b>painful red eye in a contact-lens wearer</b> · suspected herpes simplex keratitis · proptosis · painful or restricted eye movements · new diplopia · significant peri-orbital swelling · trauma or chemical injury · recent intraocular surgery with a red or painful eye · significant immunosuppression with atypical or severe disease. <b>Do not patch the eye. Stop contact lenses. Do not prescribe topical ocular steroids or antibiotic–steroid combinations while awaiting assessment.</b>"},
    {tone:"green", h:"Lid hygiene is the treatment", html:"A clean, warm (not hot) compress to closed eyelids for 5–10 minutes, gentle massage towards the lash line, then lid-margin cleaning with a commercially prepared lid wipe or suitable cleanser — twice daily in a flare, once daily as maintenance. There is no established need for an expensive proprietary product; choose a method the patient can perform consistently without irritating the eye."},
    {tone:"amber", h:"Topical antibiotic — not routine", html:"Do not routinely prescribe topical antibiotics for uncomplicated chronic blepharitis. If persistent anterior disease is clearly documented despite good lid hygiene, seek advice from or refer to an appropriate eye-care professional. A defined course may be advised under the local eye-care pathway; <b>lid-margin application is off-label</b>. Do not prescribe repeated courses without reassessing the diagnosis and lid-hygiene technique."},
    {tone:"amber", h:"Doxycycline — off-label, pathway-led", html:"Persistent posterior blepharitis/MGD or ocular rosacea: consider referral to a community optometrist with appropriate competence, an independent prescribing optometrist or ophthalmology. An oral tetracycline may be considered only after adequate lid hygiene and treatment of associated dry eye/rosacea, using the local or specialist regimen. If doxycycline is prescribed off-label, document the indication, intended duration and review date. <b>Avoid in pregnancy and breastfeeding.</b> Do not continue indefinitely."},
    {tone:"red", h:"⚠ Do not start ocular steroids in general practice", html:"Do not initiate topical ocular corticosteroids or antibiotic–steroid combinations in routine general practice. They should only be prescribed within a local eye-care pathway or following specialist assessment, with appropriate monitoring."}
  ],
  pathwaySub:"Five steps. The first is to make sure this is blepharitis.",
  pathway:[
    {title:"Exclude serious red eye", html:"Any same-day feature → local urgent eye pathway. Stop contact lenses; do not patch; no ocular steroids.", alert:true},
    {title:"Confirm blepharitis and its type", html:"Usually bilateral. Anterior (lash-base crusting) or posterior (MGD); look for dry eye, rosacea and focal lid lesions; reconsider persistent unilateral disease."},
    {title:"Lid hygiene, long-term", html:"Warm compress, massage and cleaning; treat associated dry eye; everyday measures."},
    {title:"Antibiotics only if persistent, via the eye-care pathway", html:"Eye-care advice first; any topical antibiotic or doxycycline is off-label, follows the local pathway and is time-limited."},
    {title:"Review, reconsider or refer", html:"Review if treated or persistent; reconsider the diagnosis before escalating; refer suspicious lesions."}
  ],
  sections:[

    {id:"assess", nav:"Assess", title:"Step 1 — confirm it is blepharitis",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>Examine and document</b>","Visual acuity in each eye · pupils · ocular motility · pain and photophobia · contact-lens use · degree and distribution of conjunctival injection · corneal clarity and fluorescein findings if available · discharge · lid position and closure · lash loss, distortion or misdirection · collarettes · focal nodules, ulceration or bleeding · peri-orbital swelling · rosacea, facial flushing and telangiectasia · seborrhoeic dermatitis · symptoms of dry eye. If corneal involvement is suspected or cannot be adequately excluded, arrange same-day eye-care assessment"],
         ["<b>Symptoms</b>","Usually bilateral gritty, burning, itchy, crusty lid margins; fluctuating, with a recurrent or chronic course; worse on waking; remitting and relapsing. Discomfort and itch are typical — moderate or severe <b>pain</b> suggests another diagnosis"],
         ["<b>Anterior</b>","Lash-base crusting and collarettes — staphylococcal or seborrhoeic"],
         ["<b>Posterior (MGD)</b>","Lid-margin thickening, oily or blocked meibomian glands, oily or foamy tear film, often with rosacea"],
         ["<b>Demodex</b>","Collarettes or cylindrical dandruff around the lashes can suggest Demodex. Avoid recommending tea-tree oil directly in primary care — periocular tea-tree preparations can irritate the ocular surface and need appropriate formulation and instruction"],
         ["<b>Unilateral</b>","Persistent unilateral disease should prompt reconsideration of localised infection · foreign body · allergic or irritant contact dermatitis · lash abnormality · eyelid tumour · unilateral Demodex infestation · canalicular or lacrimal pathology"],
         ["<b>Differentials</b>","Infective or allergic conjunctivitis · dry-eye disease · marginal keratitis · anterior uveitis · corneal abrasion or ulcer · herpes simplex keratitis · acute glaucoma · preseptal/orbital cellulitis · ocular rosacea · contact dermatitis or medication-related blepharitis"],
         ["<b>Associations</b>","Dry eye · rosacea · seborrhoeic dermatitis · chalazia · recurrent styes"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"red", h:"Other emergencies", html:"Corneal foreign body or trauma · chemical injury · severe headache with nausea/vomiting and a fixed or irregular pupil (acute angle-closure glaucoma). Lower the threshold after recent ocular surgery or in immunosuppression."},
         {tone:"amber", h:"Marginal keratitis", html:"Peripheral corneal infiltrates with staphylococcal hypersensitivity → eye-care assessment."}
       ]},
       {b:"why", html:"Unilateral redness alone is not an emergency, but it should prompt a careful look for the same-day features. A small, uncomplicated epithelial defect is not automatically microbial keratitis, but a painful red eye with a corneal epithelial defect or infiltrate is urgent. Contact-lens wearers with a painful red eye should be assessed through the local urgent eye pathway, not managed as routine blepharitis — advise them to remove their lenses and not restart until assessed and clinically recovered."}
     ]},

    {id:"hygiene", nav:"Lid hygiene", title:"Step 2 — lid hygiene, first-line and long-term",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"🔥 Warm compress", html:"A clean <b>warm</b> (not hot) compress or a proprietary eyelid-warming device for 5–10 minutes. Hot compresses risk periocular burns."},
         {tone:"green", h:"🧽 Massage and clean", html:"Gently massage the eyelids towards the lash line, then clean the lid margins with a commercially prepared lid wipe or suitable cleanser. Do not put shampoo or cleanser into the eye, and stop any product that causes irritation. There is no established need for an expensive proprietary product."},
         {tone:"green", h:"🔁 Keep it going", html:"Twice daily in a flare, then once daily as long-term maintenance. Explain that the aim is control rather than cure. If symptoms do not improve, review the technique rather than escalating treatment."},
         {tone:"blue", h:"🧴 Everyday measures", html:"Wash hands before and after lid care · do not share towels · avoid rubbing the eyes · avoid eye make-up, especially mascara and eyeliner, in a flare, and replace old mascara/eyeliner · leave contact lenses out during an acute flare or while using eye ointment · treat seborrhoeic dermatitis and rosacea · screen breaks where dry eye is prominent."},
         {tone:"green", h:"💧 Associated dry eye", html:"Artificial tears or lubricants — use preservative-free lubricants if drops are needed frequently. See <a href='dry-eye-disease.html'>dry eye disease</a>."}
       ]}
     ]},

    {id:"drugs", nav:"Drugs", title:"Step 3 — antibiotics: not routine, off-label and pathway-led",
     blocks:[
       {b:"table", head:["Drug","When and how","Notes"], rows:[
         ["<b>Topical antibiotic (e.g. chloramphenicol 1% eye ointment)</b>","Not routine for uncomplicated chronic blepharitis. Only for persistent, clearly documented anterior disease despite good lid hygiene, after discussion with or referral to a suitable eye-care professional — a defined course under the local eye-care pathway. Not appropriate for a painful red eye, corneal disease or suspected contact-lens-related keratitis","Licensed for bacterial conjunctivitis, not chronic blepharitis or lid-margin application — lid-margin use is off-label; record the local source of the regimen, the maximum duration and the review date. Avoid repeated or intermittent courses; reassess the diagnosis first. SPC contraindications: hypersensitivity · previous myelosuppression following chloramphenicol · family history of blood dyscrasias. The SPC warns of systemic absorption and rare bone-marrow hypoplasia, aplastic anaemia and death after topical use. Avoid with concurrent marrow-suppressive drugs unless specialist advice has been obtained, in pregnancy or breastfeeding unless specifically judged essential, and contact-lens wear during treatment. A blood count is not routinely needed for a short, defined course — the SPC advises blood profiling may be advisable with long-term or intermittent use; the key safety measure is to avoid prolonged or repeated unsupervised exposure"],
         ["<b>Doxycycline (oral tetracycline)</b>","Persistent posterior blepharitis/MGD or ocular rosacea only after adequate lid hygiene, treatment of associated dry eye, management of facial rosacea where relevant and reconsideration of the diagnosis — consider referral to a community optometrist with appropriate competence, an independent prescribing optometrist or ophthalmology. Possible specialist/local-pathway regimen: doxycycline 100 mg once daily, initially for 6–12 weeks, with review and a defined stopping plan","Off-label for blepharitis/MGD — the SPC does not list chronic blepharitis or MGD as an indication. Use only with a local or specialist pathway; document the indication, intended duration and review date. Evidence is limited and practice varies. Do not assume that a standard antibacterial dose and a sub-antimicrobial anti-inflammatory dose are interchangeable — follow the local pathway. Do not continue indefinitely"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"⚠ Doxycycline cautions", html:"<b>Avoid in pregnancy and breastfeeding.</b> Do not routinely use in children under 12 years for blepharitis; children aged 8–11 years should only be considered following specialist advice or a locally agreed pathway. It is contraindicated under 8 years except in exceptional serious infections where benefits outweigh risks · ask about isotretinoin and other systemic retinoids — new headache or visual disturbance may be intracranial hypertension · caution in hepatic impairment or with hepatotoxic medicines · can interact with warfarin · warn about severe photosensitivity · oesophagitis and oesophageal ulceration — take with plenty of fluid while sitting or standing, and not immediately before bed · GI upset; antibiotic-associated diarrhoea, including possible <i>C. difficile</i> infection · separate from iron, calcium, magnesium, zinc, antacids and bismuth · stop and seek urgent medical attention for visual disturbance, severe headache with vomiting, severe rash, blistering or mucosal involvement · avoid minocycline for ocular rosacea. Erythromycin is not an automatic substitute — choose with local or specialist advice."},
         {tone:"red", h:"⚠ Do not start ocular steroids in general practice", html:"Do not initiate topical ocular corticosteroids, antibiotic–steroid combinations or other ophthalmic anti-inflammatory treatment in routine general practice. Risks: worsening or masking herpetic, fungal or acanthamoeba keratitis · raised intraocular pressure and glaucoma · cataract · delayed corneal healing · possible exacerbation of infection. Prescribe only within a local eye-care pathway or following specialist assessment, with appropriate monitoring."}
       ]}
     ]},

    {id:"lesion", nav:"Lid lesions", title:"Lid lesions — exclude malignancy",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"Routine or expedited eye-care/oculoplastic assessment", html:"Persistent lesion despite appropriate conservative treatment · recurrent lesion in the same location · atypical appearance · lash loss or distortion · ulceration or bleeding · firm, infiltrative or destructive lesion · unexplained unilateral chronic blepharitis · concern about sebaceous carcinoma or other malignancy. Biopsy may be needed. Use a graded approach — not every persistent chalazion needs urgent ophthalmology; urgency is set by the malignant features."},
         {tone:"purple", h:"Suspected skin cancer of the lid <span class='tw'>Suspected cancer</span>", html:"<b>NICE NG12:</b> a lesion suggesting squamous cell carcinoma or melanoma → suspected cancer pathway referral. A lesion suggesting basal cell carcinoma is usually routine, but consider a suspected cancer pathway referral when delay could significantly affect outcome because of its site or size — the eyelid is anatomically high-risk. For a lesion suspicious of malignancy on or near the eyelid, use the local eyelid/oculoplastic or skin-cancer pathway; do not assume that a routine dermatology pathway is appropriate. Sebaceous carcinoma is not covered by the NICE BCC referral wording — refer through an appropriate ophthalmic/oculoplastic pathway based on clinical suspicion."}
       ]}
     ]},

    {id:"troubleshoot", nav:"Not settling?", title:"Not settling? Re-check before escalating",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"1 · Red flags", html:"Pain, photophobia, reduced vision or corneal signs → same-day pathway."},
         {tone:"amber", h:"2 · Technique and adherence", html:"Is lid hygiene being done daily, correctly, and continued after the flare settles? Review the technique rather than escalating treatment."},
         {tone:"blue", h:"3 · Drivers", html:"Rosacea, seborrhoeic dermatitis, dry eye, contact lenses or make-up addressed?"},
         {tone:"blue", h:"4 · Right diagnosis?", html:"Persistent disease despite good adherence → reconsider the diagnosis rather than escalating antibiotics."},
         {tone:"amber", h:"5 · Any focal lesion?", html:"Lash loss, ulceration or distortion → see Lid lesions."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Step 5 — review and referral",
     blocks:[
       {b:"table", head:["When","Situation","Action"], rows:[
         ["<b>Same day</b>","Any same-day feature in Step 1, including a painful red eye in a contact-lens wearer","Local urgent eye pathway — eye casualty, same-day ophthalmology advice or ED. Stop contact lenses; do not patch the eye; no topical ocular steroids or antibiotic–steroid combinations while awaiting assessment"],
         ["<b>Mild, improving</b>","Self-care with lid hygiene","Continue lid hygiene and treat associated dry eye; no routine medical review; safety-net"],
         ["<b>4–6 weeks</b>","Treatment prescribed, symptoms persist, adherence or technique needs checking, pain/photophobia/visual symptoms or concern about corneal involvement, adverse effects, or a new focal lid lesion or lash change","Check acuity if symptoms have changed, pain or photophobia, corneal symptoms, adherence, dry eye, rosacea/seborrhoeic dermatitis, adverse effects and any suspicious lid or lash change"],
         ["<b>Refractory</b>","Persistent symptoms despite correctly performed lid hygiene, diagnostic uncertainty, suspected marginal keratitis, significant MGD or ocular rosacea requiring systemic treatment, recurrent or persistent chalazion, unexplained unilateral chronic disease","Use the locally commissioned NHS Greater Manchester pathway — for example, community optometry/MECS where appropriate, an independent prescribing optometrist, or ophthalmology/oculoplastics according to clinical urgency. Do not rely on MECS terminology unless the service is commissioned and available locally"],
         ["<b>Lid lesion</b>","As in Lid lesions — lash loss, ulceration, bleeding, lid-margin distortion, same-site recurrence or suspected malignancy","Local eyelid/oculoplastic or skin-cancer pathway, urgency by features; NG12 where skin cancer is suspected"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"Safety-net", html:"\"If your eye becomes painful, sensitive to light, or your vision blurs and does not clear with blinking — or if you wear contact lenses and your eye becomes painful — get checked the same day.\""},
         {tone:"cream", h:"GP management", html:"Triage, lid hygiene, treatment of associated dry eye and safety-netting belong here; topical antibiotics, doxycycline and ocular steroids follow the local eye-care pathway. Related pages: <a href='chalazion.html'>chalazion</a> · <a href='dry-eye-disease.html'>dry eye disease</a> · <a href='rosacea.html'>rosacea</a> · <a href='seborrhoeic-dermatitis.html'>seborrhoeic dermatitis</a>."}
       ]},
       {b:"say", html:"Blepharitis is inflammation of the eyelid edges — common, not dangerous, but it tends to come and go. The key treatment is a daily routine: a warm (not hot) compress, a gentle massage and cleaning the lid margins. Keep it up even when things settle. If your eye becomes painful, sensitive to light, or your vision blurs and doesn't clear with blinking, get checked the same day."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 45-year-old with facial rosacea has sore, crusty eyelids for a year. She has had three courses of chloramphenicol drops and asks for 'something stronger'. She wears contact lenses."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Excludes red flags, including contact-lens keratitis; checks lid-hygiene technique before escalating; explains chronicity; recognises MGD/ocular rosacea; offers optometry/eye-care pathway assessment, with any doxycycline off-label, pathway-led and time-limited, and its cautions (pregnancy, breastfeeding, retinoids, photosensitivity); avoids repeat antibiotic courses and ocular steroids; safety-nets."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Each source is listed with its issuing organisation, direct link, date checked and the recommendations it supports.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>College of Optometrists — Clinical Management Guideline: blepharitis (lid margin disease)</b> (current version; checked 3 October 2026)<br><a href="https://www.college-optometrists.org/clinical-guidance/clinical-management-guidelines/blepharitis_lidmargindisease" rel="noopener">college-optometrists.org — CMG: blepharitis</a><span class="rd"> — lid hygiene as the main long-term treatment</span></li>'+
         '<li><b>Patient.info (professional) — Blepharitis</b> (checked 3 October 2026)<br><a href="https://patient.info/doctor/ophthalmology/blepharitis-pro" rel="noopener">patient.info/doctor/ophthalmology/blepharitis-pro</a><span class="rd"> — systemic antibiotics as an option for refractory disease, often for 6–12 weeks</span></li>'+
         '<li><b>Greater Manchester Medicines Management Group (GMMMG) Formulary — Eye</b> (checked 3 October 2026)<br><a href="https://www.greatermanchesterformulary.nhs.uk/" rel="noopener">greatermanchesterformulary.nhs.uk</a><span class="rd"> — chloramphenicol 0.5% drops first choice and 1% ointment second choice for ophthalmic antibacterials; this formulary positioning does not validate prolonged lid-margin treatment for chronic blepharitis</span></li>'+
         '<li><b>NHS Greater Manchester — local urgent eye-care and community optometry pathway</b><span class="rd"> — same-day assessment and referral routes; use the locally commissioned service</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a> (checked 3 October 2026)<span class="rd"> — skin cancer referral criteria, including non-urgent BCC referral unless delay could significantly affect outcome because of site or size</span></li>'+
         '<li><b>MHRA SPC — Doxycycline 100 mg capsules (PL 20416/0460)</b> (checked 3 October 2026)<br><a href="https://products.mhra.gov.uk/" rel="noopener">products.mhra.gov.uk</a><span class="rd"> — licensed indications; contraindicated in pregnancy and breastfeeding; paediatric restrictions; retinoids, hepatic impairment, photosensitivity, oesophageal injury, warfarin and absorption interactions</span></li>'+
         '<li><b>MHRA SPC — Chloramphenicol Eye Ointment BP (PL 18956/0005)</b> (checked 3 October 2026)<br><a href="https://products.mhra.gov.uk/" rel="noopener">products.mhra.gov.uk</a><span class="rd"> — licensed for bacterial conjunctivitis; contraindications; systemic absorption, bone-marrow toxicity, prolonged/intermittent exposure and contact-lens warnings</span></li>'+
         '</ul></div>'},
       {b:"why", html:"This is a primary-care educational pathway, not a substitute for clinical assessment or local eye-care arrangements. It should be approved through the practice/PCN/ICB governance process and reviewed at least annually, or sooner if the local formulary, urgent eye-care pathway, SPCs or national guidance change."}
     ]}
  ],
  foot:"Blepharitis in primary care. Exclude serious red eye first — pain, photophobia, reduced vision, corneal signs or a painful red eye in a contact-lens wearer: same-day eye assessment. Lid hygiene is first-line and long-term. Topical antibiotics are not routine; for persistent disease despite good lid hygiene, seek eye-care advice — any topical antibiotic or doxycycline is off-label, pathway-led and time-limited, and doxycycline is avoided in pregnancy and breastfeeding. Do not start ocular steroids in general practice. Persistent, atypical or same-site recurrent lid lesions: ophthalmic assessment; NICE NG12 where skin cancer is suspected. Sources: College of Optometrists CMG, NICE NG12, MHRA SPCs, GMMMG formulary. Verify all prescribing against the current MHRA SPC, local NHS Greater Manchester formulary and the relevant local eye-care pathway before implementation."
});
</script>
