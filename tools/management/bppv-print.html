  stemSub:"For the differential reasoning across all vertigo use the <a href='../algorithms/vertigo.html'>vertigo pathway</a>. This page is the doing: first telling brief positional episodes from continuous acute vestibular syndrome, a focused neurological and neck-safety check, Dix-Hallpike and the supine roll test, the Epley manoeuvre step by step, alternatives when Epley is not suitable, observation as an option in selected patients, why vestibular suppressants are not a BPPV treatment, and what to do about recurrence, falls and driving (NICE NG127).",

  ],
  lead:'<div class="mg-layers"><a href="#safety"><b>Identify the syndrome</b><small>Positional or continuous</small></a><a href="#diagnose"><b>Diagnose</b><small>Dix-Hallpike · roll test</small></a><a href="#epley"><b>Epley</b><small>Step by step</small></a><a href="#other"><b>If it fails</b><small>Reconsider</small></a><a href="#after"><b>Aftercare</b><small>Recurrence · falls · driving</small></a></div>',
  quickSub:"The six that matter. Numbered, linked sources are listed under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ First, positional or continuous?", html:"<b>Brief, position-triggered episodes</b> point to BPPV: a focused neurological and safety assessment, then Dix-Hallpike if safe. <b>Acute vestibular syndrome (AVS)</b> is acute, persistent vertigo or dizziness, generally lasting hours to days, with spontaneous nystagmus, nausea/vomiting, gait unsteadiness or head-motion intolerance — urgent stroke-pathway assessment. HINTS should only be used in a patient with ongoing AVS by a clinician trained and experienced in the examination; otherwise refer immediately (NICE NG127). It is not a test for brief positional episodes, isolated dizziness or a patient who is currently asymptomatic. <b>A normal or apparently reassuring gait does not by itself exclude posterior-circulation stroke.</b>"},
    {tone:"blue", h:"The history that makes BPPV likely", html:"Brief rotational vertigo — seconds, usually under a minute — reliably triggered by rolling in bed, lying down, sitting up, looking up or bending, after a latency of a few seconds; normal or mildly unsteady between attacks; no persistent spontaneous vertigo, new hearing loss or focal symptoms."},
    {tone:"blue", h:"Dix-Hallpike, then the supine roll test", html:"Dix-Hallpike, on both sides where safe, diagnoses posterior-canal BPPV — most cases. A negative test does not exclude BPPV if the history is convincing. If it is negative but the history is convincing, do the <b>supine roll test</b> for horizontal-canal BPPV — a minority, often missed, and treated with a different manoeuvre (Lempert or Gufoni)."},
    {tone:"green", h:"Treat with a repositioning manoeuvre", html:"NICE NG127: after diagnosing BPPV, offer a canalith repositioning manoeuvre such as Epley, if you are trained and there is no unstable cervical-spine disease. Most people improve after one or more manoeuvres. Warn that vertigo and nausea may be intense but brief at each step. Observation with safety-netting is reasonable for confirmed BPPV if the patient declines treatment, cannot tolerate the manoeuvre or has mild improving symptoms; repositioning is preferred when symptoms are troublesome or create a falls or occupational risk (AAO-HNS)."},
    {tone:"amber", h:"Vestibular suppressants are not a BPPV treatment", html:"Do not use prochlorperazine, cinnarizine or other vestibular suppressants routinely (AAO-HNS), and avoid prolonged use. If nausea or vomiting is severe, a short course of an appropriate antiemetic may be considered after checking contraindications, interactions and sedation/falls risk. It does not treat the underlying BPPV and should not delay repositioning or referral. Prolonged use can cause sedation, impaired balance and falls, and may obscure ongoing symptoms. <b>Betahistine should not be prescribed for typical BPPV.</b> Consider an alternative diagnosis, such as Ménière's disease, only when the clinical features support it."},
    {tone:"purple", h:"🚗 DVLA — driving", html:"Do not drive while vertigo, visual disturbance, imbalance or medication effects could impair control of the vehicle. Advise the patient to check current DVLA guidance, particularly if episodes are sudden, disabling, unprovoked/unpredictable or persistent, or if they drive professionally or hold a Group 2 licence. Typical, reliably position-triggered BPPV differs from recurrent sudden unprovoked disabling giddiness — the decision depends on the actual pattern and functional impact. <b>Document the advice and the patient's occupational driving requirements.</b>"}
  ],
  pathwaySub:"Five steps. The first decides which pathway the patient is on.",
  pathway:[
    {title:"Identify the syndrome", html:"Brief positional episodes → this page. Acute vestibular syndrome → urgent stroke-pathway assessment; HINTS only if trained and experienced and the AVS is ongoing, otherwise refer immediately (NICE NG127).", alert:true},
    {title:"Focused neurological and safety check", html:"Cranial nerves, limb power and sensation, dysarthria, dysphagia, diplopia, gait and sitting balance, cerebellar signs, new headache or neck pain, hearing symptoms, cervical-spine safety."},
    {title:"Confirm with Dix-Hallpike, then the supine roll test", html:"Dix-Hallpike on both sides, where safe, for the posterior canal; supine roll test if negative and the history fits. Document latency, duration, direction and plane of nystagmus, fatigability, symptoms and whether symptoms reverse on sitting up."},
    {title:"Treat with the matching manoeuvre", html:"Posterior canal → Epley. Horizontal canal → Lempert or Gufoni. Reassess; repeat if appropriate and tolerated. Observation with safety-netting if declined, not tolerated or mild and improving."},
    {title:"Aftercare and review", html:"Home exercises if suitable, falls assessment in line with NICE NG249, medication review, DVLA-based driving advice, and review within 1 month if symptoms persist, recur frequently or the diagnosis remains uncertain."}
  ],
  sections:[

    {id:"safety", nav:"Identify the syndrome", title:"Positional vertigo or acute vestibular syndrome — and the red flags",
     blocks:[
       {b:"table", head:["Picture","Features","Action"], rows:[
         ["<b>Typical BPPV</b>","Brief (seconds, usually under a minute) rotational vertigo triggered by head position change, latency of a few seconds, normal between attacks, no persistent vertigo, no new hearing loss or focal symptoms","Focused neurological and safety assessment, then Dix-Hallpike if safe"],
         ["<b>Acute vestibular syndrome</b>","Acute, persistent vertigo or dizziness, generally lasting hours to days, with spontaneous nystagmus, nausea or vomiting, gait unsteadiness or head-motion intolerance","Urgent stroke-pathway assessment. HINTS only in ongoing AVS and only by a trained, experienced clinician; otherwise immediate referral. HINTS is not for brief positional episodes, isolated dizziness or a currently asymptomatic patient. See <a href='vestibular-neuronitis.html'>vestibular neuronitis</a>"]
       ]},
       {b:"table", head:["Red flag","Meaning","Action"], rows:[
         ["Any focal neurological symptom or sign — dysarthria, diplopia, dysphagia, limb weakness or incoordination, facial numbness","Brainstem or cerebellar event","<b>999 / emergency stroke pathway</b>"],
         ["Direction-changing gaze-evoked nystagmus, or vertical or persistent pure torsional nystagmus","Central","<b>Emergency assessment</b>"],
         ["New severe headache or neck pain, especially after neck trauma or manipulation","Possible vertebral artery dissection","Emergency assessment; <b>no positional testing or manoeuvre</b>"],
         ["Severe truncal ataxia, or unable to sit or stand unaided","Cerebellar lesion","<b>Emergency assessment</b>. A normal or apparently reassuring gait does not by itself exclude posterior-circulation stroke — acute vestibular syndrome with vascular risk factors may still need urgent assessment"],
         ["<b>New sudden unilateral hearing loss with acute vertigo</b>","Sudden sensorineural hearing loss · labyrinthine infarction · AICA or posterior-circulation ischaemia · Ménière's disease or another peripheral disorder","<b>Urgent same-day assessment.</b> If the presentation is continuous, or associated with gait unsteadiness, spontaneous nystagmus, neurological features or vascular risk, use the <b>emergency stroke pathway</b> rather than directing the patient only to ENT. Do not assume labyrinthitis or Ménière's disease"],
         ["Continuous vertigo not explained by BPPV","Vestibular neuritis, Ménière's, central cause","Urgent reassessment — stroke pathway if AVS features; no positional manoeuvre; see the <a href='../algorithms/vertigo.html'>vertigo pathway</a> and <a href='menieres.html'>Ménière's</a>"],
         ["Downbeat, vertical, direction-changing, persistent pure torsional or otherwise atypical positional nystagmus, including without latency or not fatiguing","Potentially central positional vertigo","<b>Urgent neurological/stroke assessment</b>; MRI or other neuroimaging determined through that pathway. Do not perform repeated repositioning manoeuvres"]
       ]},
       {b:"warn", html:"<b>Do not perform positional testing or a repositioning manoeuvre in any red-flag presentation above</b> — use 999/emergency stroke pathways according to the presentation and local arrangements. <b>Neck safety comes before the couch.</b> Assess whether the patient can safely tolerate neck rotation and extension and lie flat. NICE NG127 specifies <i>unstable</i> cervical-spine disease: stable cervical spondylosis or osteoarthritis is not automatically a contraindication, but severe restriction, pain, neurological symptoms, inflammatory/unstable cervical disease, recent trauma or surgery, suspected cervical instability, or suspected vertebral-artery dissection requires modification or referral. Do not force neck movement — use an alternative position or refer to a suitably trained vestibular physiotherapist or audiovestibular service. Also refer if you are not trained in the manoeuvre. Consider cardiovascular or orthostatic symptoms where relevant. The Semont manoeuvre still involves rapid movement and may be unsuitable for patients unable to tolerate rapid movement."}
     ]},

    {id:"diagnose", nav:"Diagnose", title:"Dix-Hallpike and the supine roll test",
     blocks:[
       {b:"dl", rows:[
         ["<b>Dix-Hallpike — how</b>","Patient sits so the head will extend over the end of the couch when supine. Turn the head 45° toward the side being tested. Support the head, lie them back to 20–30° below horizontal, keeping the rotation. Watch the eyes for at least 30 seconds. Sit up slowly; test both sides where safe."],
         ["<b>A positive result</b>","Latency of a few seconds, then upbeat-torsional nystagmus with vertigo, lasting under a minute and fatiguing on repetition. The provoking side is usually, but not always, the affected side in posterior-canal BPPV — particularly with bilateral, multi-canal or atypical disease. <b>Document latency, duration, direction and plane of nystagmus, fatigability, symptoms and whether symptoms reverse on sitting up.</b> A negative test does not exclude BPPV if the history is convincing — perform the supine roll test."],
         ["<b>Supine roll test</b>","When Hallpike is negative but the history is convincing: supine, head slightly flexed; turn the head rapidly to one side, observe, return, then the other side. Horizontal nystagmus indicates horizontal-canal BPPV. The geotropic or apogeotropic pattern and relative intensity help determine the affected side and manoeuvre. Geotropic: consider Lempert (barbecue roll) or Gufoni according to training. Apogeotropic, bilateral or complex findings: refer to vestibular physiotherapy or audiovestibular services if you are not trained in their management."],
         ["<b>No routine tests</b>","Typical BPPV needs no imaging, blood tests or audiology."]
       ]},
       {b:"table", head:["Pattern","Canal / condition","Treatment"], rows:[
         ["<b>Upbeat-torsional nystagmus on Dix-Hallpike, with latency, fatiguing</b>","Posterior-canal BPPV (most cases)","Epley"],
         ["<b>Horizontal nystagmus on supine roll test</b>","Horizontal-canal BPPV (a minority)","Geotropic: Lempert (barbecue roll) or Gufoni according to training — not Epley. Apogeotropic or complex: refer if not trained"],
         ["<b>Downbeat nystagmus, no latency, not fatiguing</b>","Central positional vertigo, or rare anterior-canal BPPV","Urgent neurological/stroke assessment; neuroimaging through that pathway; no repeated manoeuvres — treat as central until excluded. Rare anterior-canal BPPV is not a reason to delay excluding a central cause"],
         ["<b>Convincing history, repeatedly negative testing</b>","BPPV in remission, vestibular migraine or PPPD","Re-test another day; consider vestibular migraine and PPPD"],
         ["<b>After head injury</b>","Post-traumatic BPPV — often bilateral or multi-canal","Lower threshold for vestibular physiotherapy"]
       ]},
       {b:"say", html:"I'm going to lie you back quickly with your head turned. If this is what I think, the room may spin hard for up to half a minute. It's unpleasant, but it helps me find the problem. Please keep your eyes open and stay in position until I say — I'll be holding your head the whole time and I'll tell you before each move."}
     ]},

    {id:"epley", nav:"Epley", title:"The Epley manoeuvre — step by step",
     sub:"For LEFT posterior-canal BPPV. Mirror every direction for the right side.",
     blocks:[
       {b:"dl", rows:[
         ["<b>Before you start</b>","Confirm the neck-safety and neurological questions, and that the patient can lie flat, extend the neck and tolerate rapid positional change. Warn that vertigo and nausea may be intense but brief. Position them so the head can extend beyond the end of the couch. Have a vomit bowl within reach."],
         ["<b>Step 1</b>","Sitting, head turned 45° to the left."],
         ["<b>Step 2</b>","Lie back, head still 45° left and extended 20–30° below horizontal. Hold until vertigo and nystagmus settle, and for at least about 30 seconds."],
         ["<b>Step 3</b>","Turn the head 90° to the right (now 45° right), keeping it extended. Hold as above."],
         ["<b>Step 4</b>","Roll onto the right side while turning the head a further 90°, so the nose points toward the floor. Hold as above. This step often provokes a second burst — talk them through it."],
         ["<b>Step 5</b>","Sit up slowly, head still turned, then bring it to neutral with the chin slightly down. Let them sit for a minute or two before standing."],
         ["<b>Then</b>","Reassess. Repeat during the same consultation only if appropriate and tolerated — but persistent positivity should prompt reconsideration of the canal, technique or diagnosis."]
       ]},
       {b:"cards", items:[
         {tone:"blue", h:"📋 No routine restrictions afterwards", html:"Routine advice to sleep upright, avoid bending or wear a collar is not needed. Do advise standing up slowly and temporarily avoiding driving, ladders, heights, hazardous machinery and swimming alone while symptomatic or unsteady."},
         {tone:"amber", h:"⚠ Some residual unsteadiness is common", html:"Mild residual disequilibrium for several days can occur after a successful manoeuvre and is not failure — warn about it in advance. Persistent or worsening symptoms require reassessment."},
         {tone:"green", h:"🏠 Home exercises, if appropriate", html:"Home repositioning exercises or vestibular rehabilitation may be offered to suitable patients. Brandt-Daroff exercises are less targeted than a correctly performed canalith-repositioning manoeuvre and should be taught with clear written or demonstrated instructions; the local physiotherapy pathway should determine the preferred regimen. Where confirmed unilateral posterior-canal BPPV has a clear diagnosis and side, a home Epley manoeuvre may be more targeted, if the patient can perform it safely. Avoid unsupervised self-treatment with diagnostic uncertainty, atypical or persistent nystagmus, significant cervical disease, severe imbalance, neurological symptoms, new hearing loss, or inability to understand or safely perform the manoeuvre. Stop and seek review if symptoms become continuous, neurological or associated with hearing loss."}
       ]}
     ]},

    {id:"other", nav:"If it fails", title:"When it does not settle — reassess, do not just repeat",
     blocks:[
       {b:"table", head:["Situation","What to do","Notes"], rows:[
         ["<b>Horizontal-canal BPPV</b>","Lempert or Gufoni","Epley does not treat the horizontal canal — a 'failed Epley' is sometimes the wrong canal"],
         ["<b>Persistent, frequently recurring or uncertain — review within 1 month</b>","Repeat positional assessment if appropriate, then refer to vestibular physiotherapy, ENT or audiovestibular medicine","Reconsider wrong canal or wrong side · horizontal-canal or multi-canal BPPV · bilateral or post-traumatic BPPV · vestibular migraine · Ménière's disease · PPPD · vestibular neuritis · central positional vertigo · medication effects or postural hypotension. Avoid repeatedly performing Epley without documenting the nystagmus pattern or reconsidering the diagnosis"],
         ["<b>Recurrent BPPV</b>","Re-treat; home exercises for self-management","Recurrence is common and not a sign anything was done wrongly"],
         ["<b>Persistent imbalance after successful BPPV treatment</b>","Consider vestibular hypofunction, PPPD, medication effects, neurological disease and other causes — vestibular rehabilitation where appropriate","Repeating manoeuvres will not help"],
         ["<b>Older patient (65 and over)</b>","Ask about falls, near-falls, gait and balance. Single fall without gait/balance impairment: assess the circumstances and gait/balance. Offer comprehensive falls assessment and management when NICE NG249 criteria are met — including frailty, injury requiring medical treatment, loss of consciousness, inability to get up independently or two or more falls in the preceding year — or with recurrent falls or gait/balance impairment","Address dizziness, medication (sedatives, antihypertensives), vision, hearing, cardiovascular status, footwear, gait/balance, home hazards and osteoporosis/fracture risk as appropriate. Do not routinely test vitamin D solely because BPPV has recurred; assess vitamin D or bone health only when indicated by broader risk factors or the local falls/osteoporosis pathway. BPPV increases falls risk — address falls prevention rather than prescribing suppressants"],
         ["<b>Vestibular suppressant on repeat for BPPV</b>","Review and deprescribe","Check why it was started and whether another diagnosis, such as Ménière's or vestibular neuritis, is being treated before stopping. Consider sedation, postural hypotension, extrapyramidal effects and anticholinergic burden; use particular caution in older people and in Parkinson's disease, dementia, glaucoma, urinary retention or significant falls risk"]
       ]},
       {b:"why", html:"BPPV is caused by displaced otoconia in a semicircular canal. A repositioning manoeuvre uses gravity to move them out of the sensitive part of the canal; a suppressant can only dampen the symptom — which is why the manoeuvre, not a prescription, is the treatment."}
     ]},

    {id:"after", nav:"Aftercare", title:"Aftercare, driving, and what to tell the patient",
     blocks:[
       {b:"cards", items:[
         {tone:"green", h:"✓ The explanation", html:"\"The pattern and your eye movements suggest that small crystals in the inner ear have moved into one of the balance canals. The manoeuvre uses gravity to move them out of the sensitive part. If the pattern turns out to be unusual, persistent, or comes with other symptoms, we'll look for a different cause.\""},
         {tone:"purple", h:"🚗 DVLA", html:"Do not drive while vertigo, visual disturbance, imbalance or medication effects could impair control of the vehicle. Advise the patient to check current <a href='https://www.gov.uk/government/publications/assessing-fitness-to-drive-a-guide-for-medical-professionals' rel='noopener'>DVLA guidance</a>, particularly if episodes are sudden, disabling, unprovoked/unpredictable or persistent, or if they drive professionally or hold a Group 2 licence. Typical, reliably position-triggered BPPV is different from recurrent sudden unprovoked disabling giddiness — the decision depends on the actual pattern and functional impact. Document the advice and the patient's occupational driving requirements."},
         {tone:"amber", h:"⚠ Safety in the meantime", html:"Avoid driving, ladders, heights, machinery and swimming alone while symptomatic or unsteady. Get out of bed in stages. In older people, review home falls hazards."},
         {tone:"blue", h:"📅 Safety-net", html:"\"Come back urgently if the dizziness stops being brief and positional and becomes constant, or if you develop weakness, slurred speech, double vision, a bad headache or hearing loss.\""},
         {tone:"green", h:"🔁 Recurrence, honestly", html:"\"This comes back in a fair proportion of people. That doesn't mean anything went wrong, and it can be treated the same way again.\""}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Emergency — 999 / same day", html:"Focal neurological signs · central nystagmus · new severe headache or neck pain · severe truncal ataxia or unable to sit or stand · suspected vertebral artery dissection · continuous acute vestibular syndrome without a trained HINTS assessment · sudden hearing loss with continuous vertigo, gait unsteadiness, spontaneous nystagmus, neurological features or vascular risk · persistent vertigo not explained by BPPV. <b>No positional manoeuvre in any of these.</b>"},
         {tone:"amber", h:"Same-day assessment — sudden hearing loss", html:"New sudden unilateral hearing loss with acute vertigo — urgent same-day assessment. If continuous, or with gait unsteadiness, spontaneous nystagmus, neurological features or vascular risk, use the emergency stroke pathway rather than ENT alone; otherwise same-day ENT or audiovestibular assessment via the local pathway."},
         {tone:"blue", h:"Vestibular physiotherapy", html:"Not trained in the manoeuvre · unstable cervical spine or recent neck injury · not resolved at about 4 weeks · multi-canal, post-traumatic or apogeotropic BPPV · PPPD · balance rehabilitation."},
         {tone:"blue", h:"ENT / audiovestibular medicine", html:"Diagnostic uncertainty · atypical nystagmus · cochlear symptoms · suspected Ménière's · refractory BPPV. See <a href='menieres.html'>Ménière's disease</a>."},
         {tone:"amber", h:"Urgent neurological / stroke assessment", html:"Downbeat, vertical, direction-changing, persistent pure torsional or otherwise atypical positional nystagmus, positional vertigo without latency or fatigue, or suspected central positional vertigo. MRI or other neuroimaging is determined through that pathway; no repeated repositioning manoeuvres."},
         {tone:"green", h:"Falls service", html:"Older patient meeting NICE NG249 criteria for comprehensive falls assessment — frailty, a fall with injury requiring medical treatment, loss of consciousness, inability to get up independently, two or more falls in the preceding year — or with gait/balance impairment."},
         {tone:"cream", h:"GP management", html:"Typical BPPV can often be diagnosed and treated in primary care when a trained clinician is available: identify the syndrome, neurological and neck check, Dix-Hallpike and roll test, the matching manoeuvre or observation, reassessment, home exercises and deprescribing. Use the local Bolton/Greater Manchester stroke, vestibular physiotherapy, ENT/audiovestibular and falls referral pathways. Related pages: <a href='../algorithms/vertigo.html'>vertigo pathway</a> · <a href='menieres.html'>Ménière's</a> · <a href='vestibular-neuronitis.html'>vestibular neuronitis</a> · <a href='../algorithms/falls.html'>falls</a>."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 68-year-old woman describes <b>10 days of the room spinning for about 20 seconds</b> whenever she rolls over in bed or looks up at a high cupboard. Between episodes she feels normal. No hearing loss, tinnitus or headache. She was given prochlorperazine out of hours and has taken it three times a day since, with <b>two near-falls</b>. She has cervical osteoarthritis, asks for \"a stronger tablet\", and drives her grandchildren to school."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Takes the positional history properly and recognises brief positional episodes rather than acute vestibular syndrome — so <b>does not use HINTS</b>; does a focused neurological screen; asks about the neck and judges whether the cervical osteoarthritis is stable and the neck movement tolerated for Dix-Hallpike and Epley, or needs a modified approach or vestibular physiotherapy; treats with a manoeuvre if safe and trained; reviews and deprescribes the prochlorperazine, explaining why; warns about the brief vertigo during the manoeuvre; imposes no routine sleeping restrictions; addresses falls in line with NICE NG249, including gait and balance assessment; gives DVLA-based individualised driving advice and records it with her driving requirements; frames recurrence honestly; safety-nets for continuous symptoms or new neurological features."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Numbered references with direct links; check the current local formulary, SPC and prescribing information before prescribing.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>[1] NICE NG127 — Suspected neurological conditions: recognition and referral</b> — recommendation 1.2.6 (transient rotational vertigo/BPPV) and the section 1.2 recommendations on acute vestibular syndrome<br><a href="https://www.nice.org.uk/guidance/ng127" rel="noopener">nice.org.uk/guidance/ng127</a><span class="rd"> — Dix-Hallpike for transient rotational vertigo; canalith repositioning if trained and no unstable cervical spine; HINTS only if trained, otherwise immediate referral</span></li>'+
         '<li><b>[2] Bhattacharyya N, Gubbels SP, Schwartz SR, et al. Clinical Practice Guideline: Benign Paroxysmal Positional Vertigo (Update). Otolaryngol Head Neck Surg. 2017 (AAO-HNS)</b><br><a href="https://doi.org/10.1177/0194599816689667" rel="noopener">doi.org/10.1177/0194599816689667</a><span class="rd"> — repositioning as first-line; observation as an acceptable initial option; reassessment within 1 month; against routine imaging and vestibular suppressants; no routine post-manoeuvre restrictions</span></li>'+
         '<li><b>[3] von Brevern M, Bertholon P, Brandt T, et al. Benign paroxysmal positional vertigo: diagnostic criteria. Consensus document of the Committee for the Classification of Vestibular Disorders of the Bárány Society. J Vestib Res. 2015;25(3–4):105–17</b><br><a href="https://doi.org/10.3233/VES-150553" rel="noopener">doi.org/10.3233/VES-150553</a><span class="rd"> — nystagmus characteristics by canal; central positional vertigo</span></li>'+
         '<li><b>[4] DVLA — Assessing fitness to drive: a guide for medical professionals (current version)</b><br><a href="https://www.gov.uk/government/publications/assessing-fitness-to-drive-a-guide-for-medical-professionals" rel="noopener">gov.uk — assessing fitness to drive</a><span class="rd"> — liability to sudden disabling giddiness; Group 1 and Group 2</span></li>'+
         '<li><b>[5] NICE NG249 — Falls: assessment and prevention in older people and in people 50 and over at higher risk (April 2025; replaces CG161)</b><br><a href="https://www.nice.org.uk/guidance/ng249" rel="noopener">nice.org.uk/guidance/ng249</a><span class="rd"> — criteria for comprehensive falls assessment and management; assessment of dizziness, medication, gait/balance, vision, hearing and cardiovascular status</span></li>'+
         '<li><b>[6] Local Greater Manchester formulary and MHRA SPCs</b><br><a href="https://products.mhra.gov.uk/" rel="noopener">products.mhra.gov.uk</a><span class="rd"> — antiemetic and vestibular-suppressant choice and cautions (prochlorperazine, cinnarizine); betahistine indications. Used for prescribing verification: the prescriber must check the current local formulary, SPC and prescribing information</span></li>'+
         '</ul></div>'},
       {b:"table", head:["Version control","Detail"], rows:[
         ["Author/editor","To be completed locally"],
         ["Clinical owner","To be completed locally"],
         ["Approval body","Practice/PCN/ICB clinical governance — to be completed"],
         ["Implementation date","To be completed on approval"],
