<script>
MG.render({
  icon:"🌀",
  title:"BPPV — the complete guide",
  eyebrow:"Protocol · the treatment is a manoeuvre, not a prescription",
  stemTitle:"Typical BPPV can often be diagnosed and treated in primary care when a trained clinician is available — the two ways it goes wrong are prescribing a sedative instead, or treating a central cause as an inner-ear problem",
  stemSub:"For the differential reasoning across all vertigo use the <a href='../algorithms/vertigo.html'>vertigo pathway</a>. This page is the doing: first telling brief positional episodes from continuous acute vestibular syndrome, a focused neurological and neck-safety check, Dix-Hallpike and the supine roll test, the Epley manoeuvre step by step, alternatives when Epley is not suitable, why vestibular suppressants are not a BPPV treatment, and what to do about recurrence, falls and driving (NICE NG127).",
  guideline:"NICE NG127 · AAO-HNS 2017 · Bárány Society criteria · DVLA",
  reviewed:"25 September 2026",
  nextReview:"25 September 2027",
  meta:[
    {t:"HINTS is for acute vestibular syndrome only", tone:"tw"},
    {t:"Manoeuvre, not medication", tone:"ok"},
    {t:"v1.1 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#safety"><b>Identify the syndrome</b><small>Positional or continuous</small></a><a href="#diagnose"><b>Diagnose</b><small>Hallpike · roll test</small></a><a href="#epley"><b>Epley</b><small>Step by step</small></a><a href="#other"><b>If it fails</b><small>Reconsider</small></a><a href="#after"><b>Aftercare</b><small>Recurrence · falls · driving</small></a></div>',
  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ First, positional or continuous?", html:"<b>Brief, position-triggered episodes</b> point to BPPV: a neurological screen, then Hallpike if safe. <b>Continuous vertigo for hours to days</b> with spontaneous nystagmus, nausea and gait unsteadiness is <b>acute vestibular syndrome</b> — use HINTS only if you are trained and experienced in it; otherwise refer immediately via the stroke pathway (NICE NG127). HINTS is not a pre-Hallpike test and must not be used to reassure positional symptoms."},
    {tone:"blue", h:"The history that makes BPPV likely", html:"Brief rotational vertigo — seconds, usually under a minute — reliably triggered by rolling in bed, lying down, sitting up, looking up or bending, after a latency of a few seconds; normal or mildly unsteady between attacks; no persistent spontaneous vertigo, new hearing loss or focal symptoms."},
    {tone:"blue", h:"Dix-Hallpike, then the supine roll test", html:"Hallpike diagnoses posterior-canal BPPV — most cases. If it is negative but the history is convincing, do the <b>supine roll test</b> for horizontal-canal BPPV — a minority, often missed, and treated with a different manoeuvre (Lempert or Gufoni)."},
    {tone:"green", h:"Treat with a repositioning manoeuvre", html:"NICE NG127: after diagnosing BPPV, offer a canalith repositioning manoeuvre such as Epley, if you are trained and there is no unstable cervical-spine disease. Most people improve after one or more manoeuvres. Warn that it provokes vertigo briefly at each step."},
    {tone:"amber", h:"Vestibular suppressants are not a BPPV treatment", html:"Do not use prochlorperazine, cinnarizine or other vestibular suppressants routinely. If nausea is severe, a short, limited antiemetic course may be considered — but it does not replace repositioning, and prolonged use may impair vestibular recovery and add falls risk. <b>Betahistine is not a BPPV treatment</b> — it is a different drug used in Ménière's pathways."},
    {tone:"purple", h:"🚗 DVLA — driving", html:"Do not drive while symptomatic or while a head movement could provoke disabling vertigo. DVLA notification may be required where there is a persistent or unpredictable liability to sudden disabling giddiness — check the current guidance, especially for Group 2 and occupational drivers. <b>Record the advice given.</b>"}
  ],
  pathwaySub:"Five steps. The first decides which pathway the patient is on.",
  pathway:[
    {title:"Identify the syndrome", html:"Brief positional episodes → this page. Continuous acute vestibular syndrome → HINTS only if trained, otherwise immediate stroke-pathway referral (NICE NG127).", alert:true},
    {title:"Focused neurological and safety check", html:"Cranial nerves, limb power and sensation, dysarthria, dysphagia, diplopia, gait and sitting balance, cerebellar signs, new headache or neck pain, hearing symptoms, cervical-spine safety."},
    {title:"Confirm with Dix-Hallpike, then the supine roll test", html:"Hallpike each side for the posterior canal; supine roll test if negative and the history fits. Document nystagmus direction and latency."},
    {title:"Treat with the matching manoeuvre", html:"Posterior canal → Epley. Horizontal canal → Lempert or Gufoni. Reassess; repeat if appropriate and tolerated."},
    {title:"Aftercare and review", html:"Home exercises if suitable, falls and medication review in older people, driving advice, and review at about 4 weeks if unresolved."}
  ],
  sections:[

    {id:"safety", nav:"Identify the syndrome", title:"Positional vertigo or acute vestibular syndrome — and the red flags",
     blocks:[
       {b:"table", head:["Picture","Features","Action"], rows:[
         ["<b>Typical BPPV</b>","Brief (seconds, usually under a minute) rotational vertigo triggered by head position change, latency of a few seconds, normal between attacks, no persistent vertigo, no new hearing loss or focal symptoms","Neurological screen, then Hallpike if safe"],
         ["<b>Acute vestibular syndrome</b>","Continuous vertigo for hours to days, spontaneous nystagmus, nausea or vomiting, gait unsteadiness, head-motion intolerance","HINTS only by a trained, experienced clinician; otherwise immediate stroke-pathway referral. See <a href='vestibular-neuronitis.html'>vestibular neuronitis</a>"]
       ]},
       {b:"table", head:["Red flag","Meaning","Action"], rows:[
         ["Any focal neurological symptom or sign — dysarthria, diplopia, dysphagia, limb weakness or incoordination, facial numbness","Brainstem or cerebellar event","<b>999 / emergency stroke pathway</b>"],
         ["Direction-changing gaze-evoked nystagmus, or vertical or persistent pure torsional nystagmus","Central","<b>Emergency assessment</b>"],
         ["New severe headache or neck pain, especially after neck trauma or manipulation","Possible vertebral artery dissection","Emergency assessment; <b>no positional testing or manoeuvre</b>"],
         ["Severe truncal ataxia, or unable to sit or stand unaided","Cerebellar lesion","<b>Emergency assessment</b>. A normal or near-normal gait does not exclude stroke — acute vestibular syndrome with vascular risk factors may still need urgent assessment"],
         ["<b>Sudden unilateral hearing loss with vertigo</b>","Sudden sensorineural hearing loss; also consider AICA or posterior-circulation ischaemia","<b>Urgent same-day ENT or audiovestibular assessment</b>; treatment follows the local pathway. Do not assume labyrinthitis or Ménière's"],
         ["Continuous vertigo not explained by BPPV","Vestibular neuritis, Ménière's, central cause","Reassess; see the <a href='../algorithms/vertigo.html'>vertigo pathway</a> and <a href='menieres.html'>Ménière's</a>"],
         ["Positional nystagmus without latency, not fatiguing, or downbeat","Central positional vertigo","Neurology and MRI — not a manoeuvre"]
       ]},
       {b:"warn", html:"<b>Neck safety comes before the couch.</b> If there is unstable cervical-spine disease, recent neck injury or surgery, or suspected vertebral artery dissection, do not perform Hallpike or a repositioning manoeuvre in primary care — refer to a clinician experienced in modified manoeuvres or to vestibular physiotherapy (NICE NG127). Also refer if you are not trained in the manoeuvre. The Semont manoeuvre still involves rapid movement and is not a safe substitute in these situations."}
     ]},

    {id:"diagnose", nav:"Diagnose", title:"Dix-Hallpike and the supine roll test",
     blocks:[
       {b:"dl", rows:[
         ["<b>Dix-Hallpike — how</b>","Patient sits so the head will extend over the end of the couch when supine. Turn the head 45° toward the side being tested. Support the head, lie them back to 20–30° below horizontal, keeping the rotation. Watch the eyes for at least 30 seconds. Sit up slowly; repeat on the other side."],
         ["<b>A positive result</b>","Latency of a few seconds, then upbeat-torsional nystagmus with vertigo, lasting under a minute and fatiguing on repetition. The provoking side is usually the affected side in posterior-canal BPPV — <b>document the direction and latency of the nystagmus</b>, particularly if atypical or bilateral."],
         ["<b>Supine roll test</b>","When Hallpike is negative but the history is convincing: supine, head slightly flexed; turn the head rapidly to one side, observe, return, then the other side. Horizontal nystagmus indicates horizontal-canal BPPV. With apogeotropic nystagmus the affected side and manoeuvre choice are more complex — vestibular physiotherapy or audiovestibular services may be preferable."],
         ["<b>No routine tests</b>","Typical BPPV needs no imaging, blood tests or audiology."]
       ]},
       {b:"table", head:["Pattern","Canal / condition","Treatment"], rows:[
         ["<b>Upbeat-torsional nystagmus on Hallpike, with latency, fatiguing</b>","Posterior-canal BPPV (most cases)","Epley"],
         ["<b>Horizontal nystagmus on supine roll test</b>","Horizontal-canal BPPV (a minority)","Lempert (barbecue roll) or Gufoni — not Epley"],
         ["<b>Downbeat nystagmus, no latency, not fatiguing</b>","Central positional vertigo, or rare anterior-canal BPPV","Neurology and MRI — treat as central until excluded"],
         ["<b>Convincing history, repeatedly negative testing</b>","BPPV in remission, vestibular migraine or PPPD","Re-test another day; consider vestibular migraine and PPPD"],
         ["<b>After head injury</b>","Post-traumatic BPPV — often bilateral or multi-canal","Lower threshold for vestibular physiotherapy"]
       ]},
       {b:"say", html:"I'm going to lie you back quickly with your head turned. If this is what I think, the room may spin hard for up to half a minute. It's unpleasant, but it helps me find the problem. Please keep your eyes open and stay in position until I say — I'll be holding your head the whole time and I'll tell you before each move."}
     ]},

    {id:"epley", nav:"Epley", title:"The Epley manoeuvre — step by step",
     sub:"For LEFT posterior-canal BPPV. Mirror every direction for the right side.",
     blocks:[
       {b:"dl", rows:[
         ["<b>Before you start</b>","Confirm the neck-safety and neurological questions. Warn the patient. Position them so the head can extend beyond the end of the couch. Have a vomit bowl within reach."],
         ["<b>Step 1</b>","Sitting, head turned 45° to the left."],
         ["<b>Step 2</b>","Lie back, head still 45° left and extended 20–30° below horizontal. Hold until vertigo and nystagmus settle, and for at least about 30 seconds."],
         ["<b>Step 3</b>","Turn the head 90° to the right (now 45° right), keeping it extended. Hold as above."],
         ["<b>Step 4</b>","Roll onto the right side while turning the head a further 90°, so the nose points toward the floor. Hold as above. This step often provokes a second burst — talk them through it."],
         ["<b>Step 5</b>","Sit up slowly, head still turned, then bring it to neutral with the chin slightly down. Let them sit for a minute or two before standing."],
         ["<b>Then</b>","Reassess. Repeat if appropriate and tolerated — but persistent positivity should prompt reconsideration of the canal, technique or diagnosis."]
       ]},
       {b:"cards", items:[
         {tone:"blue", h:"📋 No routine restrictions afterwards", html:"Routine advice to sleep upright, avoid bending or wear a collar is not needed. Do advise standing up slowly and avoiding ladders, heights, hazardous machinery and driving while still dizzy or unsteady."},
         {tone:"amber", h:"⚠ Some residual unsteadiness is common", html:"A day or two of vague imbalance after a successful manoeuvre is common and is not failure — warn about it in advance."},
         {tone:"green", h:"🏠 Home exercises, if appropriate", html:"Brandt-Daroff exercises are less targeted than a correctly performed repositioning manoeuvre but useful where Epley is unavailable or unsuitable, or for self-management of recurrence. Teach them with a demonstrated or written plan (one common regimen: about 5 repetitions three times a day until free of vertigo for two days). Stop and seek review if symptoms become continuous, neurological or associated with hearing loss."}
       ]}
     ]},

    {id:"other", nav:"If it fails", title:"When it does not settle — reassess, do not just repeat",
     blocks:[
       {b:"table", head:["Situation","What to do","Notes"], rows:[
         ["<b>Horizontal-canal BPPV</b>","Lempert or Gufoni","Epley does not treat the horizontal canal — a 'failed Epley' is sometimes the wrong canal"],
         ["<b>Not resolved at about 4 weeks</b>","Reassess, then refer to vestibular physiotherapy, ENT or audiovestibular medicine","Confirm the correct canal was tested; review the nystagmus pattern; consider bilateral or multi-canal disease, vestibular migraine, PPPD, Ménière's, vestibular neuritis or central positional vertigo"],
         ["<b>Recurrent BPPV</b>","Re-treat; home exercises for self-management","Recurrence is common and not a sign anything was done wrongly. Consider vitamin D assessment where there are other risk factors for deficiency, osteoporosis or falls, and treat documented deficiency — routine testing because BPPV has recurred is not established"],
         ["<b>Persistent dizziness after the BPPV has gone</b>","Consider PPPD — vestibular rehabilitation","Repeating manoeuvres will not help"],
         ["<b>Older patient</b>","Multifactorial falls assessment if there has been a fall, near-fall or persistent imbalance","Medication review (sedatives, antihypertensives), vision, footwear, gait and balance, and fracture-risk assessment where indicated. BPPV increases falls risk, particularly in older adults — address falls prevention rather than prescribing suppressants"],
         ["<b>Vestibular suppressant on repeat for BPPV</b>","Review and deprescribe","Check why it was started and whether another diagnosis, such as Ménière's or vestibular neuritis, is being treated before stopping"]
       ]},
       {b:"why", html:"BPPV is caused by displaced otoconia in a semicircular canal. A repositioning manoeuvre uses gravity to move them out of the sensitive part of the canal; a suppressant can only dampen the symptom — which is why the manoeuvre, not a prescription, is the treatment."}
     ]},

    {id:"after", nav:"Aftercare", title:"Aftercare, driving, and what to tell the patient",
     blocks:[
       {b:"cards", items:[
         {tone:"green", h:"✓ The explanation", html:"\"The pattern and your eye movements suggest that small crystals in the inner ear have moved into one of the balance canals. The manoeuvre uses gravity to move them out of the sensitive part. If the pattern turns out to be unusual, persistent, or comes with other symptoms, we'll look for a different cause.\""},
         {tone:"purple", h:"🚗 DVLA", html:"Do not drive while symptomatic or while a head movement could provoke disabling vertigo. DVLA notification may be required where there is a persistent or unpredictable liability to sudden disabling giddiness; Group 2 and occupational drivers face stricter standards — check the current guidance. Once fully free of positional vertigo and not impaired by residual imbalance or medication, driving can generally resume — individualise and document."},
         {tone:"amber", h:"⚠ Safety in the meantime", html:"Avoid ladders, heights, machinery and swimming alone while symptomatic. Get out of bed in stages. In older people, review home falls hazards."},
         {tone:"blue", h:"📅 Safety-net", html:"\"Come back urgently if the dizziness stops being brief and positional and becomes constant, or if you develop weakness, slurred speech, double vision, a bad headache or hearing loss.\""},
         {tone:"green", h:"🔁 Recurrence, honestly", html:"\"This comes back in a fair proportion of people. That doesn't mean anything went wrong, and it can be treated the same way again.\""}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Emergency — 999 / same day", html:"Focal neurological signs · central nystagmus · new severe headache or neck pain · severe truncal ataxia or unable to sit or stand · suspected vertebral artery dissection · continuous acute vestibular syndrome without a trained HINTS assessment. <b>No positional manoeuvre in any of these.</b>"},
         {tone:"amber", h:"Same-day ENT / audiovestibular", html:"Sudden hearing loss with vertigo — urgent assessment; treatment follows the local pathway."},
         {tone:"blue", h:"Vestibular physiotherapy", html:"Not trained in the manoeuvre · unstable cervical spine or recent neck injury · not resolved at about 4 weeks · multi-canal, post-traumatic or apogeotropic BPPV · PPPD · balance rehabilitation."},
         {tone:"blue", h:"ENT / audiovestibular medicine", html:"Diagnostic uncertainty · atypical nystagmus · cochlear symptoms · suspected Ménière's · refractory BPPV. See <a href='menieres.html'>Ménière's disease</a>."},
         {tone:"amber", h:"Neurology and MRI", html:"Downbeat nystagmus, positional vertigo without latency or fatigue, or suspected central positional vertigo."},
         {tone:"green", h:"Falls service", html:"Older patient with BPPV and a fall, near-fall or unsteadiness between episodes."},
         {tone:"cream", h:"GP management", html:"Typical BPPV can often be diagnosed and treated in primary care when a trained clinician is available: identify the syndrome, neurological and neck check, Hallpike and roll test, the matching manoeuvre, reassessment, home exercises and deprescribing. Related pages: <a href='../algorithms/vertigo.html'>vertigo pathway</a> · <a href='menieres.html'>Ménière's</a> · <a href='vestibular-neuronitis.html'>vestibular neuronitis</a> · <a href='../algorithms/falls.html'>falls</a>."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 68-year-old woman describes <b>10 days of the room spinning for about 20 seconds</b> whenever she rolls over in bed or looks up at a high cupboard. Between episodes she feels normal. No hearing loss, tinnitus or headache. She was given prochlorperazine out of hours and has taken it three times a day since, with <b>two near-falls</b>. She has cervical osteoarthritis, asks for \"a stronger tablet\", and drives her grandchildren to school."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Takes the positional history properly and recognises brief positional episodes rather than acute vestibular syndrome — so <b>does not use HINTS</b>; does a focused neurological screen; asks about the neck and judges whether the cervical disease is stable enough for Hallpike and Epley or needs vestibular physiotherapy; treats with a manoeuvre if safe and trained; reviews and deprescribes the prochlorperazine, explaining why; warns about the brief vertigo during the manoeuvre; imposes no routine sleeping restrictions; addresses falls with a multifactorial approach; gives and records individualised driving advice; frames recurrence honestly; safety-nets for continuous symptoms or new neurological features."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG127 — Suspected neurological conditions: recognition and referral</b><br><a href="https://www.nice.org.uk/guidance/ng127" rel="noopener">nice.org.uk/guidance/ng127</a><span class="rd"> — Hallpike for transient rotational vertigo; canalith repositioning if trained and no unstable cervical spine; HINTS only if trained, otherwise immediate referral</span></li>'+
         '<li><b>AAO-HNS — Clinical Practice Guideline: BPPV (2017 update)</b><span class="rd"> — repositioning as first-line; against routine imaging and vestibular suppressants; no routine post-manoeuvre restrictions</span></li>'+
         '<li><b>Bárány Society — diagnostic criteria for BPPV</b><span class="rd"> — nystagmus characteristics by canal; central positional vertigo</span></li>'+
         '<li><b>DVLA — Assessing fitness to drive</b><br><a href="https://www.gov.uk/guidance/assessing-fitness-to-drive-a-guide-for-medical-professionals" rel="noopener">gov.uk — assessing fitness to drive</a><span class="rd"> — liability to sudden disabling giddiness; Group 1 and Group 2</span></li>'+
         '<li><b>NICE NG249 — Falls: assessment and prevention</b><br><a href="https://www.nice.org.uk/guidance/ng249" rel="noopener">nice.org.uk/guidance/ng249</a><span class="rd"> — multifactorial falls assessment</span></li>'+
         '<li><b>BNF · MHRA SPCs</b><span class="rd"> — prochlorperazine and cinnarizine cautions; betahistine indications</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"BPPV — NICE NG127, AAO-HNS 2017, Bárány Society criteria and DVLA. First distinguish brief positional episodes from continuous acute vestibular syndrome: HINTS only in acute vestibular syndrome and only by a trained clinician. For typical positional vertigo, neurological and neck-safety check, then Hallpike and the supine roll test; treat with the matching repositioning manoeuvre if trained and there is no unstable cervical-spine disease. No routine vestibular suppressants; betahistine is not a BPPV treatment. Reassess at about 4 weeks if unresolved. Individualised, documented driving advice. Verify doses against the BNF."
});
