<script>
MG.render({
  icon:"🦠",
  title:"Whooping Cough (Pertussis)",
  eyebrow:"Protocol · assess and manage in one place",
  stemTitle:"Pertussis — think of it, notify it, treat inside the window, and shield the youngest babies",
  stemSub:"Whooping cough in primary care: recognising it in vaccinated teenagers and adults as well as in infants, the statutory notification, which test suits which week of illness, when an antibiotic still helps (and when it only reduces spread), which contacts the health protection team will target, exclusion from school and work, and the maternal vaccine that protects newborns. UKHSA pertussis guidance · Green Book chapter 24 (2025) · Health Protection (Notification) Regulations 2010 · Cochrane.",
  guideline:"UKHSA pertussis public health guidance (2024–25) · Green Book ch. 24 (Dec 2025) · Health Protection (Notification) Regulations 2010",
  meta:[
    {t:"UKHSA · pertussis public health management"},
    {t:"Green Book ch. 24 · Dec 2025"},
    {t:"Statutory notification · HP (Notification) Regs 2010", tone:"tw"},
    {t:"Cochrane · Altunaiji 2007, Wang 2014"},
    {t:"NICE NG12 (updated April 2026) · cough in over-40s"}
  ],
  quickSub:"Six cards for the consultation. Every figure traces to a source in the <a href='#provenance'>Evidence</a> section. <b>Time windows, exclusion periods and priority-group definitions follow the current UKHSA pertussis guidance, which changes with the level of pertussis activity; local health protection team advice on the day takes precedence.</b>",
  quick:[
    {tone:"red", h:"Young babies die of this — assess them in hospital", html:"Severe complications and deaths occur mostly in <b>infants under 6 months</b>. In young infants the whoop may never appear. Instead, coughing spasms are followed by <b>apnoea</b>, cyanosis, bradycardia or feeding failure (Green Book ch. 24). Any infant with suspected pertussis and apnoea, cyanosis, poor feeding or breathing difficulty → 999 or same-day paediatrics. Any suspected pertussis in an infant <b>under 3 months</b> should be discussed urgently with paediatrics, even if currently well between coughing episodes; keep a particularly low threshold under 6 months."},
    {tone:"purple", h:"Statutory duty: notify on suspicion", html:"Whooping cough is a notifiable disease under the <b>Health Protection (Notification) Regulations 2010</b>. The registered medical practitioner must notify the <b>proper officer of the local authority</b>; in England this is normally done through the local UKHSA Health Protection Team/local notification arrangements, in writing within 3 days. In urgent situations (for example, a vulnerable infant in the household), phone the HPT immediately and complete the required written notification. <b>Do not wait for laboratory confirmation.</b>"},
    {tone:"amber", h:"Antibiotic window: usually 14 days, up to 21 in some cases (current UKHSA)", html:"The usual clinical benefit from antibiotics is greatest when started within <b>14 days</b> of cough onset. If the case is <b>pregnant</b> or has a close contact in <b>priority group 1</b> (young, under-protected infants), UKHSA may recommend treatment up to <b>21 days</b> after cough onset. A pregnant contact from 32 weeks is a priority group 2 contact — phone the HPT. After 21 days, routine public-health action and antibiotic benefit are usually limited, but follow current UKHSA/HPT advice, especially in vulnerable-household or healthcare settings. Treatment is primarily to reduce transmission: once the paroxysmal cough is established it commonly continues despite successful treatment (Cochrane, Altunaiji 2007). These windows depend on the current UKHSA guidance and HPT decision."},
    {tone:"blue", h:"Match the test to the week", html:"<b>PCR on a nasopharyngeal swab</b> early in the illness (roughly the first 2–3 weeks of cough). Once the cough has lasted over 2 weeks, antibody testing becomes useful: an <b>oral fluid test for notified cases aged 2 to under 17</b>, arranged through the health protection team, or <b>serum anti-pertussis toxin IgG</b> in adults. Recent pertussis vaccination makes antibody results hard to interpret. Interpret every result in the clinical and epidemiological context, and never let testing delay notification, treatment or public-health action."},
    {tone:"green", h:"Maternal vaccine: every pregnancy, 16–32 weeks", html:"Offer a pertussis-containing vaccine in <b>every pregnancy</b>, ideally from around 20 weeks (after the anomaly scan) and not before 16 weeks. It is still worth giving after 32 weeks and up to labour, although late doses give the baby less passive protection. It is about 90% effective at protecting young infants (Green Book ch. 24, Dec 2025)."},
    {tone:"amber", h:"Exclusion: follow the current UKHSA exclusion table", html:"Exclude from nursery, school or work according to the current UKHSA exclusion table: usually until <b>48 hours after starting</b> an appropriate antibiotic, or for the relevant untreated period specified by the current guidance (traditionally <b>21 days from the onset of the cough</b>). In healthcare, childcare and outbreak settings, follow HPT/occupational-health instructions. Advise keeping away from newborns and women in late pregnancy for the same period."}
  ],
  pathwaySub:"Five moves. The first step is where infants come to harm.",
  pathway:[
    {title:"Assess severity — and ask who they live with", html:"<b>Infant:</b> apnoea, cyanosis, bradycardia, poor feeding, exhaustion, seizures → 999 or same-day paediatrics; any suspected pertussis under 3 months → urgent paediatric discussion, even if well between bouts. <b>Any age:</b> hypoxia, pneumonia, dehydration, rib fracture. <b>Then ask:</b> is there a baby under 1 in the household, a pregnant woman, or someone who works with infants? This decides how urgent the public health response is.", alert:true},
    {title:"Recognise it clinically", html:"An acute cough lasting <b>14 days or more</b> without another apparent cause, plus paroxysms, post-tussive vomiting, an inspiratory whoop, or (in infants) apnoeic episodes, meets the UKHSA clinical case definition. Contact with a confirmed case in the previous 21 days strengthens it. Vaccinated children and adults often have only a persistent paroxysmal cough. Suspect it before 14 days with a characteristic paroxysmal cough, post-tussive vomiting, whoop, infant apnoea, a compatible household contact or an outbreak context — notification and management should not wait until day 14."},
    {title:"Notify, then test", html:"<b>Notify on suspicion</b> (statutory). Test according to the week of illness: PCR early, oral fluid (ages 2 to under 17, via the HPT) or serum serology later. Notification does not depend on a result, and testing should not delay treatment or public-health action."},
    {title:"Treat if inside the window", html:"Cough onset usually within <b>14 days</b> → consider a macrolide; up to <b>21 days</b> if the case is pregnant or has a priority group 1 contact (current UKHSA guidance; check HPT advice). Choose the drug by age and pregnancy (UKHSA): <b>clarithromycin</b> under 1 month, <b>azithromycin or clarithromycin</b> from 1 month and in non-pregnant adults, <b>erythromycin</b> in pregnancy, and <b>co-trimoxazole</b> if a macrolide cannot be used (not in pregnancy or under 6 weeks). Agent, dose and duration per the current UKHSA age-specific treatment table and BNF/BNFC."},
    {title:"Protect contacts and prevent the next case", html:"The HPT decides on <b>chemoprophylaxis</b> for close contacts in priority groups (the time window, commonly 14 days, is set by current UKHSA guidance and the HPT) and on vaccinating contacts. You apply the <b>exclusion</b> advice, check the <b>maternal and childhood vaccination</b> status in the household, and set expectations for a cough that may last weeks to months."}
  ],
  sections:[
    {id:"recognise", nav:"Recognise", title:"Recognising pertussis at every age", sub:"The textbook whoop is the exception in adults and vaccinated children, and it may never appear in young infants.",
     blocks:[
       {b:"timeline", items:[
         {n:"1", when:"Incubation, about 6–20 days", title:"Exposure", html:"Spread by respiratory droplets within households, schools and workplaces. Contact with a known case in the preceding 3 weeks is a useful clue (Green Book ch. 24; UKHSA case definition)."},
         {n:"2", when:"Week 1–2", title:"Catarrhal phase — the most infectious", html:"Coryza, mild cough, low-grade fever. It is indistinguishable from a cold, and it is when transmission is highest. PCR is most sensitive now."},
         {n:"3", when:"Weeks 2–6+", title:"Paroxysmal phase", html:"Bouts of rapid coughing, often worse at night, sometimes ending in an inspiratory whoop, vomiting or exhaustion, with the patient often well between bouts. Infants may have apnoea or cyanosis instead of a whoop."},
         {n:"4", when:"Weeks to months", title:"Convalescence", html:"The paroxysms fade slowly. Coughing bouts can return with later viral infections. The cough can last 2–3 months in total."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"UKHSA clinical case definition", html:"Acute cough lasting <b>14 days or more</b> without an apparent cause, plus one or more of: paroxysms of coughing, post-tussive vomiting, inspiratory whoop, or undiagnosed apnoeic attacks in young infants. Someone with compatible symptoms who has been in contact with a confirmed case in the previous 21 days also counts. Suspect pertussis before 14 days when there is a characteristic paroxysmal cough, post-tussive vomiting, inspiratory whoop, apnoea in an infant, a compatible household contact or an outbreak context. The formal case definition uses cough of at least 14 days, but suspicion, notification, testing and treatment should not wait until day 14.", src:"UKHSA pertussis public health guidance (2024–25)"},
         {tone:"blue", h:"It is common in vaccinated school-age children", html:"In a UK primary-care cohort of 279 children aged 5–15 with a cough of 2–8 weeks, about <b>1 in 5</b> had evidence of recent pertussis, even after the pre-school booster. Some coughed more than 400 times in 24 hours. A persistent paroxysmal cough in a fully vaccinated child can still be pertussis.", src:"Wang K, et al., BMJ 2014"}
       ]},
       {b:"why", html:"Immunity after either infection or vaccination wanes, so adolescents and adults are both a reservoir and the usual source for unprotected infants. That is why the question “who lives with you?” matters more than the diagnosis itself in an adult with a two-week cough. The public health response is designed around protecting babies too young to have completed their primary course."}
     ]},

    {id:"redflags", nav:"Red flags", title:"Red flags — and the NG12 point for adults with a persistent cough", sub:"The dangers are in the infant and in complications of forceful coughing. In an adult over 40, pertussis should not become an excuse to skip the lung-cancer criteria.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Infant with apnoea, cyanosis or poor feeding", html:"Any infant, particularly under 6 months, with pauses in breathing, colour change, bradycardia, choking spasms, feeding difficulty, weight loss or exhaustion → 999 or same-day paediatrics. Pertussis in young infants can progress to respiratory failure, pulmonary hypertension and death.", src:"Green Book ch. 24 (Dec 2025)"},
         {tone:"red", h:"Seizures or reduced consciousness", html:"Seizures or encephalopathy (from hypoxia during paroxysms) at any age → emergency admission.", src:"Green Book ch. 24 (Dec 2025); clinical practice"},
         {tone:"red", h:"Pneumonia or hypoxia", html:"Fever returning in the paroxysmal phase, tachypnoea, focal chest signs or low saturations suggest a secondary pneumonia → assess the same day and admit if hypoxic.", src:"Green Book ch. 24 (complications); clinical practice"},
         {tone:"amber", h:"Complications of forceful coughing", html:"Rib fracture, syncope, subconjunctival haemorrhage, hernia, urinary incontinence, pneumothorax, and weight loss from post-tussive vomiting. Examine for them and explain them. They are distressing but usually self-limiting."},
         {tone:"amber", h:"Pregnancy near term", html:"A woman beyond 32 weeks with suspected pertussis needs prompt treatment and notification, because her newborn will be exposed; involve maternity services where appropriate. Erythromycin remains the preferred pregnancy option in the UKHSA pathway unless specialist advice indicates otherwise. A newborn exposed to maternal pertussis around delivery requires urgent HPT/paediatric advice regarding chemoprophylaxis, irrespective of maternal vaccination status. Pregnancy alone does not mean admission: that depends on severity, complications, oral intake and obstetric/clinical assessment.", src:"UKHSA pertussis guidance (priority groups, antibiotic choice)"},
         {tone:"purple", h:"NG12 — unexplained cough in people aged 40 and over", html:"The urgent chest X-ray recommendation applies when the cough is unexplained and cannot reasonably be attributed to confirmed pertussis or another established diagnosis. A negative pertussis test does not remove the need for NG12 assessment when the cough remains unexplained. <b>Offer an urgent chest X-ray (to be performed within 2 weeks)</b> to assess for lung cancer in people aged 40 and over with 2 or more unexplained symptoms (cough, fatigue, shortness of breath, chest pain, weight loss, appetite loss), or with 1 or more if they have ever smoked.", src:"NICE NG12 (updated April 2026)"}
       ]},
       {b:"warn", html:"A “100-day cough” label can be falsely reassuring. If the history does not fit (no paroxysms, weight loss, haemoptysis, persistent focal signs), or tests are negative in a smoker over 40, apply NG12 and investigate the cough on its own merits."}
     ]},

    {id:"notify", nav:"Notify", title:"Notification — the statutory duty", sub:"This is a legal requirement for the doctor who suspects the infection, not an optional courtesy to public health.",
     blocks:[
       {b:"cards", items:[
         {tone:"purple", h:"Who, when and how", html:"Under the <b>Health Protection (Notification) Regulations 2010</b>, a registered medical practitioner who has reasonable grounds to suspect whooping cough must notify the <b>proper officer</b> of the local authority. In England, this is normally done through the local UKHSA Health Protection Team/local notification arrangements. Notify <b>in writing within 3 days</b> of forming the suspicion, or <b>orally as soon as reasonably practicable</b> if the case is urgent — for urgent situations, phone the HPT immediately and complete the required written notification.", src:"Health Protection (Notification) Regulations 2010, Schedule 1; UKHSA notifiable diseases guidance"},
         {tone:"blue", h:"Suspicion is enough", html:"Notification is based on <b>clinical suspicion</b>. Do not delay it until a swab or antibody result returns. The laboratory reports confirmed results separately, which does not replace your notification.", src:"Health Protection (Notification) Regulations 2010; UKHSA pertussis guidance"},
         {tone:"amber", h:"When to phone rather than write", html:"Phone the HPT urgently when there is a priority-group contact, particularly a <b>vulnerable infant</b>, a <b>pregnant contact from 32 weeks</b>, or a <b>healthcare/childcare exposure involving young infants</b>, or when the case is part of a cluster. These are the situations where chemoprophylaxis and vaccination decisions are time-critical.", src:"UKHSA pertussis guidance (priority groups; chemoprophylaxis window)"}
       ]},
       {b:"say", html:"Whooping cough is one of the infections doctors have a legal duty to report to the local health protection team. It doesn’t mean you’ve done anything wrong. It means they can check whether anyone around you, especially a young baby or a pregnant woman, needs protecting."}
     ]},

    {id:"tests", nav:"Tests", title:"Testing — choose by the week of illness", sub:"The best test depends on how long the cough has been present, and on the patient’s age.",
     blocks:[
       {b:"table", head:["Situation","Test","Notes"], rows:[
         ["<b>Early illness</b> (roughly the first 2–3 weeks of cough), any age","<b>PCR</b> on a nasopharyngeal (per-nasal) swab or aspirate; culture in some laboratories","Most sensitive while bacteria are still present; falls off as the cough continues and after antibiotics"],
         ["<b>Cough over 2 weeks, aged 2 to under 17</b>","<b>Oral fluid anti-pertussis toxin IgG</b>","Available for <b>notified</b> cases and arranged by the HPT; not a routine primary-care test"],
         ["<b>Cough over 2 weeks, adults</b>","<b>Serum anti-pertussis toxin IgG</b>","A high titre indicates recent infection; most useful later in the illness. Check local laboratory availability and interpretation thresholds"],
         ["<b>Recently vaccinated</b> (including pregnancy vaccine)","Antibody tests are unreliable","Rely on PCR, or on the clinical and epidemiological picture"],
         ["<b>Infants in hospital</b>","PCR; FBC (a marked lymphocytosis suggests severe disease)","Managed by paediatrics"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Oral fluid testing is a public health service", html:"UKHSA offers oral fluid testing for notified cases aged 2 to under 17. Notify the case, and the HPT arranges the kit. It avoids a blood test in children who have had a cough for more than 2 weeks, when PCR is often negative.", src:"UKHSA — pertussis oral fluid testing instructions (gov.uk)"},
         {tone:"blue", h:"A negative test does not cancel the plan", html:"A negative PCR late in illness or negative serology early in illness does not exclude pertussis, and recent vaccination makes anti-pertussis toxin antibody results difficult to interpret. Choose the test by illness duration, but interpret all results in the clinical and epidemiological context: a negative result does not override a convincing clinical diagnosis or HPT advice, and testing should not delay notification, treatment or public-health action. If the clinical picture fits, <b>treat and exclude according to the clinical diagnosis</b> and let the HPT decide on contacts.", src:"UKHSA pertussis public health guidance (2024–25)"}
       ]}
     ]},

    {id:"treat", nav:"Antibiotics", title:"Antibiotics — who, when and which", sub:"The antibiotic is given mainly to stop transmission. It may shorten illness only if started early.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1", title:"Is the cough inside the window?", when:"decide first", tone:"cream",
          html:"<b>Cough onset within the last 14 days</b> → consider treatment. <b>Within 21 days</b> → treat if the case is <b>pregnant</b> (ideally starting at least 3 days before delivery), or has a household or other close contact in <b>priority group 1</b>. <b>Beyond 21 days</b> → routine public-health action and antibiotic benefit are usually limited, but follow current UKHSA/HPT advice, especially in vulnerable-household or healthcare settings. Untreated pertussis is generally considered infectious until 21 days after cough onset, while appropriate antibiotics shorten infectiousness to 48 hours after treatment begins. A cough persisting beyond 21 days still needs clinical assessment if the patient is deteriorating, develops pneumonia or has a vulnerable contact. These windows follow the current UKHSA guidance and level of pertussis activity."},
         {step:"2", title:"Choose the drug by age and pregnancy", when:"UKHSA preferred agents", fromLabel:"inside the window", tone:"cream",
          html:"<b>Under 1 month:</b> clarithromycin. <b>1 month and over, and non-pregnant adults:</b> azithromycin or clarithromycin. <b>Pregnancy:</b> erythromycin. <b>Macrolide contraindicated or not tolerated:</b> co-trimoxazole, but not in pregnancy or in infants under 6 weeks. <b>Use the current UKHSA age-specific treatment table and BNF/BNFC for agent, dose and duration.</b> Erythromycin remains the preferred pregnancy option in the UKHSA pathway unless specialist advice indicates otherwise. Co-trimoxazole may be off-label; follow the current UKHSA table and BNF/BNFC."},
         {step:"3", title:"Supportive care and expectation-setting", when:"everyone", fromLabel:"whether or not an antibiotic is given", tone:"green",
          html:"Fluids, small frequent feeds or meals (vomiting after paroxysms is common), rest, and paracetamol or ibuprofen for fever or rib pain (dose per BNF). Explain that treatment is primarily intended to reduce transmission. It may shorten illness if started early, but once the paroxysmal cough is established, the cough commonly continues despite successful treatment — this is not antibiotic failure."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"What the antibiotic achieves", html:"Across 13 trials (2,197 participants), antibiotics eradicated <i>B. pertussis</i> from the nasopharynx but <b>did not change the clinical outcome</b>. Short courses (azithromycin 3–5 days, or clarithromycin or erythromycin 7 days) were as effective as 10–14 days of erythromycin, with fewer side effects.", src:"Altunaiji S, et al., Cochrane 2007 (CD004404)"},
         {tone:"amber", h:"Macrolide cautions", html:"Check for QT-prolonging drugs and interacting medicines (for example statins with clarithromycin or erythromycin), and renal and hepatic function where relevant, before prescribing; use erythromycin and clarithromycin with caution in QT prolongation. Macrolides in young infants have been linked with infantile hypertrophic pyloric stenosis, so warn parents about projectile vomiting. The benefit usually outweighs this risk in a young infant with pertussis.", src:"BNF / BNFC macrolide monographs"}
       ]},
       {b:"why", html:"Earlier versions of this page gave a single 21-day window and fixed adult doses. The current UKHSA approach is more targeted: <b>14 days for most cases</b>, extended to <b>21 days where the case is pregnant or a priority group 1 infant is a contact</b>. This reflects the evidence that antibiotics mainly shorten carriage, and that their value to contacts falls off with time. Doses now defer to the BNF and the UKHSA table, which are updated more often than a static page. These windows have changed with pertussis activity, so check the current UKHSA guidance and HPT advice."}
     ]},

    {id:"contacts", nav:"Contacts", title:"Contacts — priority groups and chemoprophylaxis", sub:"The HPT leads this. The GP’s job is to identify vulnerable contacts quickly and often to prescribe what the HPT advises.",
     blocks:[
       {b:"table", head:["Group","Who","Why they matter"], rows:[
         ["<b>Priority group 1</b> — at risk of severe disease","Infants under 2 months born before 32 weeks (whatever the mother’s vaccination). Infants under 2 months born from 32 weeks whose mother was not vaccinated in pregnancy (after 16 weeks and at least 2 weeks before delivery). Infants aged 2 months to under 1 year who are unimmunised or partially immunised (fewer than 3 doses)","Most deaths occur in this group. Priority-group definitions are subject to the current UKHSA pertussis guidance and may be modified (including the infant age threshold) during periods of high activity — check the current HPT guidance before deciding on chemoprophylaxis"],
         ["<b>Priority group 2</b> — at risk of passing it to group 1","Pregnant women from 32 weeks. Healthcare workers and others who work with young infants or pregnant women. People who live with an infant too young to be fully vaccinated","Protecting them protects the infant"]
       ]},
       {b:"cards", items:[
         {tone:"blue", h:"Chemoprophylaxis window", html:"Chemoprophylaxis is most useful when started promptly. Current UKHSA high-activity guidance commonly uses a <b>14-day window</b> from cough onset/exposure, while other national versions have used 21 days — confirm the current local HPT policy. The HPT determines whether a contact qualifies for chemoprophylaxis, which contacts should receive it, whether vaccination should be brought forward, and the relevant time window. Use the same drugs as for treatment, at the same doses.", src:"UKHSA pertussis public health guidance (2024–25)"},
         {tone:"blue", h:"Evidence for prophylaxis is limited", html:"Cochrane found <b>insufficient evidence</b> of clinical benefit from treating healthy contacts. This is why prophylaxis is targeted at households containing a vulnerable infant, and primary care should not routinely provide prophylaxis to whole classes, workplaces or non-priority contacts.", src:"Altunaiji S, et al., Cochrane 2007"},
         {tone:"green", h:"Vaccinate as well as treat", html:"The HPT may advise bringing forward or completing the <b>infant primary course</b>, and offering a pertussis-containing vaccine to a <b>pregnant contact</b> who has not had one in this pregnancy. Check the household’s records while the family is with you.", src:"Green Book ch. 24 (Dec 2025); UKHSA pertussis guidance"}
       ]}
     ]},

    {id:"prevent", nav:"Vaccination", title:"Prevention — maternal, infant and occupational vaccination", sub:"The maternal programme is the single most effective protection for newborns, who are too young for their own vaccine.",
     blocks:[
       {b:"cards", items:[
         {tone:"green", h:"Pregnancy — every pregnancy", html:"Offer a pertussis-containing vaccine (dTaP/IPV) in <b>every pregnancy</b>. The best window is <b>16 to 32 weeks</b>, ideally around 20 weeks after the anomaly scan. Do not give it before 16 weeks. After 32 weeks, still offer it up to labour: late vaccination may give the baby less passive protection, but it protects the mother and so reduces the baby’s exposure. The programme is about 90% effective at protecting young infants.", src:"Green Book ch. 24 (Dec 2025); UKHSA maternal pertussis programme"},
         {tone:"green", h:"Infant and pre-school schedule", html:"6-in-1 (hexavalent) primary course at <b>8, 12 and 16 weeks</b>, with further doses and the pre-school booster per the <a href='https://www.gov.uk/government/publications/the-complete-routine-immunisation-schedule' rel='noopener'>current UKHSA routine immunisation schedule</a>. Check the live schedule at each review, because childhood timings and programme details change. Opportunistically check and catch up missed doses.", src:"UKHSA complete routine immunisation schedule; Green Book ch. 11 (March 2026)"},
         {tone:"green", h:"Health and care workers", html:"UKHSA recommends occupational pertussis vaccination for eligible healthcare workers in the defined priority occupational groups — not every healthcare employee with any patient contact — namely those who have regular contact with pregnant women or young infants and have not had a pertussis-containing vaccine in the last 5 years.", src:"UKHSA occupational pertussis vaccination of healthcare workers"},
         {tone:"blue", h:"Previous infection does not guarantee immunity", html:"Immunity after natural infection or vaccination wanes. A woman who had whooping cough before, or was vaccinated in a previous pregnancy, should still be vaccinated in this one, because each pregnancy needs fresh antibodies to transfer to the baby.", src:"Green Book ch. 24 (Dec 2025)"}
       ]},
       {b:"say", html:"The whooping cough jab in pregnancy passes your antibodies to the baby, so they are protected from birth until they can have their own vaccines at 8 weeks. It works best from about 20 weeks, and it’s needed in every pregnancy, even if you had it last time."}
     ]},

    {id:"exclusion", nav:"Exclusion", title:"Exclusion, symptom relief and what to expect", sub:"Clear rules about staying away, and honest expectations about a long cough.",
     blocks:[
       {b:"dl", rows:[
         ["Nursery, school, work","Exclude according to the current UKHSA exclusion table: usually until <b>48 hours after appropriate antibiotics begin</b>, or for the relevant untreated period specified by the current guidance (traditionally <b>21 days from the onset of the cough</b>). Untreated pertussis is generally considered infectious until 21 days after cough onset; after that, routine public-health action is usually not required, but follow HPT advice in vulnerable-household or outbreak situations"],
         ["Healthcare and childcare staff","Follow HPT and occupational-health instructions; arrangements can differ from the school rule, particularly during periods of high activity and for staff who work with infants"],
         ["Babies and late pregnancy","Avoid close contact with newborns and women in late pregnancy for the same infectious period"],
         ["Hygiene","Catch coughs in tissues, bin them, and wash hands, especially around infants"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"Cough medicines do not help", html:"A Cochrane review of symptomatic treatment (corticosteroids, salbutamol, antihistamines, pertussis immunoglobulin, leukotriene antagonists) found <b>insufficient evidence</b> that any of them reduces the paroxysms. Over-the-counter cough and cold medicines should not be given to children under 6.", src:"Wang K, et al., Cochrane 2014 (CD003257); MHRA/CHM advice February 2009"},
         {tone:"green", h:"What actually helps", html:"Small, frequent feeds or meals after coughing bouts, fluids, sleeping propped up if that helps, avoiding smoke and other triggers, and simple analgesia for chest-wall or rib pain. Reassure the patient that the cough will fade over weeks and may briefly return with the next cold.", src:"Wang K, et al., Cochrane 2014; clinical practice"}
       ]},
       {b:"say", html:"Even with the antibiotic, this cough can go on for weeks, sometimes two or three months, which is why it’s called the hundred-day cough. The antibiotic stops you passing it on. Usually, after 48 hours of treatment you can go back to school or work, unless the health protection team advises differently. Please keep away from newborn babies and anyone heavily pregnant until then. If you have a baby at home, we’ll make sure they’re protected too."}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — destinations and thresholds", sub:"The statutory notification and the NG12 threshold are repeated here so they are in front of you at the point of action.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999 / same-day paediatrics", html:"Infants with apnoea, cyanosis, bradycardia, feeding difficulty, respiratory distress or seizures. Discuss any suspected pertussis in an infant under 3 months urgently with paediatrics, even if currently well between coughing episodes, and keep a particularly low threshold for same-day paediatric assessment under 6 months.", src:"Green Book ch. 24 (Dec 2025)"},
         {tone:"red", h:"Same-day admission at any age", html:"Hypoxia, pneumonia, seizures or encephalopathy, dehydration from vomiting, or suspected pneumothorax.", src:"Clinical practice; Green Book ch. 24"},
         {tone:"purple", h:"Statutory notification — every suspected case", html:"Notify the proper officer of the local authority (in England, normally through the local UKHSA Health Protection Team/local notification arrangements) under the Health Protection (Notification) Regulations 2010, on reasonable clinical suspicion: <b>in writing within 3 days</b>, or <b>by phone immediately if urgent</b>, then complete the written notification. Phone the HPT urgently when there is a priority-group contact, particularly a vulnerable infant, a pregnant contact from 32 weeks, or a healthcare/childcare exposure involving young infants.", src:"Health Protection (Notification) Regulations 2010; UKHSA notifiable diseases guidance"},
         {tone:"purple", h:"NG12 — urgent chest X-ray", html:"People aged 40 and over with an <b>unexplained</b> cough plus one other unexplained symptom (fatigue, shortness of breath, chest pain, weight loss, appetite loss), or with a cough alone if they have ever smoked → <b>offer an urgent chest X-ray (to be performed within 2 weeks)</b> to assess for lung cancer. This applies when the cough cannot reasonably be attributed to confirmed pertussis or another established diagnosis; a negative pertussis test does not remove the need for NG12 assessment. Aged 40 and over with <b>unexplained haemoptysis</b> → suspected cancer pathway referral for lung cancer.", src:"NICE NG12 (updated April 2026)"},
         {tone:"blue", h:"HPT-led actions", html:"Chemoprophylaxis for priority-group contacts (eligibility and time window per current UKHSA guidance and HPT decision). Oral fluid testing for ages 2 to under 17. Outbreak management in schools, nurseries and healthcare settings.", src:"UKHSA pertussis public health guidance (2024–25)"}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card. The marks come from the household question and the public health actions.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Scenario", html:"A 34-year-old teacher has had a cough for 10 days. It comes in bouts that make her retch, and it is worst at night. Her sister, who is 35 weeks pregnant, is staying with her. She wants “a strong cough medicine” so she can get back to work on Monday.", src:"UKHSA pertussis guidance (case definition; priority groups)"},
       {tone:"cream", h:"What a good consultation does", html:"Recognises the paroxysmal pattern before the 14-day mark. Asks who she lives with and identifies the pregnant sister as a <b>priority group 2</b> contact (pregnant from 32 weeks) whose baby will be born into the household, and who may be eligible for chemoprophylaxis — the HPT decides, using the current window, as the case’s cough began within 14 days. Explains the <b>statutory notification</b> and notifies on suspicion, by phone given the pregnant contact. Arranges PCR. Prescribes <b>azithromycin or clarithromycin</b> (dose per BNF) because onset was within 14 days. Advises <b>48 hours off work after starting it</b>, and keeping away from her sister in the meantime. Checks the sister has had her pregnancy vaccine and explains that the HPT will advise on prophylaxis. Declines cough medicine with a reason (Cochrane) and sets a realistic expectation for how long the cough will last.", src:"UKHSA pertussis guidance; Health Protection (Notification) Regulations 2010; Green Book ch. 24"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Primary sources only. Doses are deferred to the BNF/BNFC and the UKHSA antibiotic table.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>UKHSA — Pertussis: guidance on the public health management of cases and contacts (national pertussis guidance; high-activity guidance 2024; current version on gov.uk)</b><br><a href="https://www.gov.uk/government/publications/pertussis-guidelines-for-public-health-management" rel="noopener">gov.uk — pertussis public health management</a><span class="rd"> — clinical case definition (cough of 14 days or more plus paroxysms, whoop, post-tussive vomiting or infant apnoea); antibiotics considered within 14 days of cough onset (previously 21), and recommended for all cases within 21 days if the case is pregnant or has a priority group 1 contact; no public health action for most cases reported more than 21 days after onset; drug choice by age and pregnancy (clarithromycin under 1 month; azithromycin or clarithromycin from 1 month; erythromycin in pregnancy; co-trimoxazole if a macrolide is unsuitable, not in pregnancy or under 6 weeks); priority groups 1 and 2; chemoprophylaxis for priority-group contacts within 14 days (previously 21); windows, exclusion arrangements and priority-group definitions vary with the level of pertussis activity, so check the current version</span></li>'+
         '<li><b>UKHSA — Health protection in children and young people settings, including education: exclusion table</b><br><a href="https://www.gov.uk/government/publications/health-protection-in-schools-and-other-childcare-facilities" rel="noopener">gov.uk — exclusion table</a><span class="rd"> — whooping cough: 2 days (48 hours) from starting antibiotic treatment, or 21 days from onset of symptoms if no antibiotic treatment</span></li>'+
         '<li><b>UKHSA — Pertussis antibodies in oral fluid test: instructions for health protection teams</b><br><a href="https://www.gov.uk/government/publications/pertussis-whooping-cough-oral-fluid-laboratory-request-form-and-instructions" rel="noopener">gov.uk — oral fluid testing</a><span class="rd"> — for notified cases aged 2 to under 17</span></li>'+
         '<li><b>Green Book, chapter 24: Pertussis (UKHSA, updated 19 December 2025)</b><br><a href="https://www.gov.uk/government/publications/pertussis-the-green-book-chapter-24" rel="noopener">gov.uk — Green Book chapter 24</a><span class="rd"> — incubation about 6–20 days; absent whoop and apnoea in infants; deaths concentrated in young infants; maternal vaccination from 16 weeks, ideally about 20 weeks, 16–32 weeks optimal, still offered up to labour with less passive protection when given late; about 90% effectiveness in protecting infants</span></li>'+
         '<li><b>UKHSA — Complete routine immunisation schedule (from January 2026); Green Book chapter 11</b><br><a href="https://www.gov.uk/government/publications/the-complete-routine-immunisation-schedule" rel="noopener">gov.uk — complete routine immunisation schedule (check the live version)</a><span class="rd"> — hexavalent vaccine at 8, 12 and 16 weeks plus a fourth dose at 18 months (born on or after 1 July 2024; Hib/MenC at 1 year withdrawn July 2025, 18-month appointments from January 2026, when MMRV replaced MMR); dTaP/IPV pre-school booster at 3 years 4 months</span></li>'+
         '<li><b>UKHSA — Occupational pertussis vaccination of healthcare workers</b><span class="rd"> — offer to staff in regular contact with pregnant women or young infants who have not had a pertussis-containing vaccine in the last 5 years</span></li>'+
         '<li><b>The Health Protection (Notification) Regulations 2010 (SI 2010/659)</b><br><a href="https://www.legislation.gov.uk/uksi/2010/659" rel="noopener">legislation.gov.uk/uksi/2010/659</a><span class="rd"> — whooping cough in Schedule 1; the registered medical practitioner notifies the proper officer on suspicion, in writing within 3 days, or orally as soon as practicable if urgent</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (2015, updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — urgent chest X-ray within 2 weeks for people aged 40 and over with unexplained cough and other symptoms, or ever-smokers with 1 symptom</span></li>'+
         '<li><b>Altunaiji S, et al. Antibiotics for whooping cough (pertussis). Cochrane Database Syst Rev 2007 (CD004404)</b><br><a href="https://www.cochranelibrary.com/cdsr/doi/10.1002/14651858.CD004404.pub3/full" rel="noopener">cochranelibrary.com</a><span class="rd"> — 13 trials, 2,197 participants; eradication without change in clinical course; short courses as effective as long ones; insufficient evidence for contact prophylaxis</span></li>'+
         '<li><b>Wang K, et al. Symptomatic treatment of the cough in whooping cough. Cochrane Database Syst Rev 2014 (CD003257; update of Bettiol et al. 2012)</b><br><a href="https://www.cochranelibrary.com/cdsr/doi/10.1002/14651858.CD003257.pub5/full" rel="noopener">cochranelibrary.com</a><span class="rd"> — insufficient evidence for any symptomatic treatment</span></li>'+
         '<li><b>Wang K, Fry NK, Campbell H, et al. Whooping cough in school age children presenting with persistent cough in UK primary care after introduction of the preschool pertussis booster vaccination: prospective cohort study. BMJ 2014</b><br><a href="https://pubmed.ncbi.nlm.nih.gov/24961836/" rel="noopener">pubmed.ncbi.nlm.nih.gov/24961836</a><span class="rd"> — about 1 in 5 of 279 children aged 5–15 with a cough of 2–8 weeks had evidence of recent pertussis</span></li>'+
         '<li><b>MHRA / Commission on Human Medicines — over-the-counter cough and cold medicines for children (February 2009)</b><span class="rd"> — not to be used under 6 years</span></li>'+
         '<li><b>BNF / BNFC</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — doses and durations for azithromycin, clarithromycin, erythromycin and co-trimoxazole; macrolide interactions and cautions</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Whooping cough (pertussis) — assessment and management in primary care, using UKHSA pertussis public health guidance, Green Book chapter 24 (December 2025), the Health Protection (Notification) Regulations 2010, NICE NG12 (cough in people aged 40 and over) and Cochrane reviews of antibiotics (2007) and symptomatic treatment (2014). Health protection teams may vary thresholds during periods of high activity, so follow their advice on the day. Verify doses in the current BNF/BNFC."
