MG.render({
  icon:"🦠",
  title:"Whooping Cough (Pertussis)",
  eyebrow:"Protocol · assess and manage in one place",
  stemTitle:"Pertussis — think of it, notify it, treat inside the window, and shield the youngest babies",
  stemSub:"Whooping cough in primary care: recognising it in vaccinated teenagers and adults as well as in infants, the statutory notification, which test suits which week of illness, when an antibiotic still helps (and when it only reduces spread), which contacts the health protection team will target, exclusion from school and work, and the maternal vaccine that protects newborns. UKHSA pertussis guidance · Green Book chapter 24 (2025) · Health Protection (Notification) Regulations 2010 · Cochrane.",
  guideline:"UKHSA pertussis public health guidance (2024–25) · Green Book ch. 24 (Dec 2025) · Health Protection (Notification) Regulations 2010",
  meta:[
    {t:"UKHSA · pertussis public health management"},
    {t:"Green Book ch. 24 · Dec 2025"},
    {t:"Statutory notification · HP (Notification) Regs 2010", tone:"tw"},
    {t:"Cochrane · Altunaiji 2007, Wang 2014"},
    {t:"NICE NG12 · cough in over-40s"}
  ],
  quickSub:"Six cards for the consultation. Every figure traces to a source in the <a href='#provenance'>Evidence</a> section. Local health protection teams may adapt thresholds during outbreaks, so their advice on the day takes precedence.",
  quick:[
    {tone:"red", h:"Young babies die of this — assess them in hospital", html:"Severe complications and deaths occur mostly in <b>infants under 6 months</b>. In young infants the whoop may never appear. Instead, coughing spasms are followed by <b>apnoea</b>, cyanosis, bradycardia or feeding failure (Green Book ch. 24). Any infant with suspected pertussis and apnoea, cyanosis, poor feeding or breathing difficulty → 999 or same-day paediatrics."},
    {tone:"purple", h:"Statutory duty: notify on suspicion", html:"Whooping cough is a notifiable disease under the <b>Health Protection (Notification) Regulations 2010</b>. The registered medical practitioner who suspects it notifies the proper officer (in practice the UKHSA health protection team) in writing within 3 days, or by phone as soon as practicable if urgent (for example, a vulnerable infant in the household). <b>Do not wait for laboratory confirmation.</b>"},
    {tone:"amber", h:"Antibiotic window: 14 days, or 21 if pregnant or a vulnerable infant contact", html:"UKHSA: consider antibiotics for a case whose cough started within the <b>last 14 days</b>. Treat <b>all cases within 21 days</b> of cough onset if the case is <b>pregnant</b> or has a household or close contact in <b>priority group 1</b> (young, under-protected infants). A pregnant contact is a priority group 2 contact — phone the HPT. After 3 weeks, antibiotics are not recommended. Antibiotics clear the organism but do not alter the clinical course once the cough is established (Cochrane, Altunaiji 2007)."},
    {tone:"blue", h:"Match the test to the week", html:"<b>PCR on a nasopharyngeal swab</b> early in the illness (roughly the first 2–3 weeks of cough). Once the cough has lasted over 2 weeks, antibody testing becomes useful: an <b>oral fluid test for notified cases aged 2 to under 17</b>, arranged through the health protection team, or <b>serum anti-pertussis toxin IgG</b> in adults. Recent pertussis vaccination makes antibody results hard to interpret."},
    {tone:"green", h:"Maternal vaccine: every pregnancy, 16–32 weeks", html:"Offer a pertussis-containing vaccine in <b>every pregnancy</b>, ideally from around 20 weeks (after the anomaly scan) and not before 16 weeks. It is still worth giving after 32 weeks and up to labour, although late doses give the baby less passive protection. It is about 90% effective at protecting young infants (Green Book ch. 24, Dec 2025)."},
    {tone:"amber", h:"Exclusion: 48 hours after starting antibiotics, or 21 days untreated", html:"Stay off nursery, school or work until <b>48 hours after starting</b> an appropriate antibiotic, or for <b>21 days from the onset of the cough</b> if no antibiotic is taken (UKHSA exclusion table). Advise keeping away from newborns and women in late pregnancy for the same period."}
  ],
  pathwaySub:"Five moves. The first step is where infants come to harm.",
  pathway:[
    {title:"Assess severity — and ask who they live with", html:"<b>Infant:</b> apnoea, cyanosis, bradycardia, poor feeding, exhaustion, seizures → 999 or same-day paediatrics. <b>Any age:</b> hypoxia, pneumonia, dehydration, rib fracture. <b>Then ask:</b> is there a baby under 1 in the household, a pregnant woman, or someone who works with infants? This decides how urgent the public health response is.", alert:true},
    {title:"Recognise it clinically", html:"An acute cough lasting <b>14 days or more</b> without another apparent cause, plus paroxysms, post-tussive vomiting, an inspiratory whoop, or (in infants) apnoeic episodes, meets the UKHSA clinical case definition. Contact with a confirmed case in the previous 21 days strengthens it. Vaccinated children and adults often have only a persistent paroxysmal cough."},
    {title:"Notify, then test", html:"<b>Notify on suspicion</b> (statutory). Test according to the week of illness: PCR early, oral fluid (ages 2 to under 17, via the HPT) or serum serology later. Notification does not depend on a result."},
    {title:"Treat if inside the window", html:"Cough onset within <b>14 days</b> → consider a macrolide. Within <b>21 days</b> for all cases who are pregnant or have a priority group 1 contact. Choose the drug by age and pregnancy (UKHSA): <b>clarithromycin</b> under 1 month, <b>azithromycin or clarithromycin</b> from 1 month and in non-pregnant adults, <b>erythromycin</b> in pregnancy, and <b>co-trimoxazole</b> if a macrolide cannot be used (not in pregnancy or under 6 weeks). Doses per BNF/BNFC."},
    {title:"Protect contacts and prevent the next case", html:"The HPT decides on <b>chemoprophylaxis</b> for close contacts in priority groups (within 14 days of the case’s cough onset) and on vaccinating contacts. You apply the <b>exclusion</b> advice, check the <b>maternal and childhood vaccination</b> status in the household, and set expectations for a cough that may last weeks to months."}
  ],
  sections:[
    {id:"recognise", nav:"Recognise", title:"Recognising pertussis at every age", sub:"The textbook whoop is the exception in adults and vaccinated children, and it may never appear in young infants.",
     blocks:[
       {b:"timeline", items:[
         {n:"1", when:"Incubation, about 6–20 days", title:"Exposure", html:"Spread by respiratory droplets within households, schools and workplaces. Contact with a known case in the preceding 3 weeks is a useful clue (Green Book ch. 24; UKHSA case definition)."},
         {n:"2", when:"Week 1–2", title:"Catarrhal phase — the most infectious", html:"Coryza, mild cough, low-grade fever. It is indistinguishable from a cold, and it is when transmission is highest. PCR is most sensitive now."},
         {n:"3", when:"Weeks 2–6+", title:"Paroxysmal phase", html:"Bouts of rapid coughing, often worse at night, sometimes ending in an inspiratory whoop, vomiting or exhaustion, with the patient often well between bouts. Infants may have apnoea or cyanosis instead of a whoop."},
         {n:"4", when:"Weeks to months", title:"Convalescence", html:"The paroxysms fade slowly. Coughing bouts can return with later viral infections. The cough can last 2–3 months in total."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"UKHSA clinical case definition", html:"Acute cough lasting <b>14 days or more</b> without an apparent cause, plus one or more of: paroxysms of coughing, post-tussive vomiting, inspiratory whoop, or undiagnosed apnoeic attacks in young infants. Someone with compatible symptoms who has been in contact with a confirmed case in the previous 21 days also counts. You can notify on clinical suspicion before 14 days.", src:"UKHSA pertussis public health guidance (2024–25)"},
         {tone:"blue", h:"It is common in vaccinated school-age children", html:"In a UK primary-care cohort of 279 children aged 5–15 with a cough of 2–8 weeks, about <b>1 in 5</b> had evidence of recent pertussis, even after the pre-school booster. Some coughed more than 400 times in 24 hours. A persistent paroxysmal cough in a fully vaccinated child can still be pertussis.", src:"Wang K, et al., BMJ 2014"}
       ]},
       {b:"why", html:"Immunity after either infection or vaccination wanes, so adolescents and adults are both a reservoir and the usual source for unprotected infants. That is why the question “who lives with you?” matters more than the diagnosis itself in an adult with a two-week cough. The public health response is designed around protecting babies too young to have completed their primary course."}
     ]},

    {id:"redflags", nav:"Red flags", title:"Red flags — and the NG12 point for adults with a persistent cough", sub:"The dangers are in the infant and in complications of forceful coughing. In an adult over 40, pertussis should not become an excuse to skip the lung-cancer criteria.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Infant with apnoea, cyanosis or poor feeding", html:"Any infant, particularly under 6 months, with pauses in breathing, colour change, bradycardia, choking spasms, feeding difficulty, weight loss or exhaustion → 999 or same-day paediatrics. Pertussis in young infants can progress to respiratory failure, pulmonary hypertension and death.", src:"Green Book ch. 24 (Dec 2025)"},
         {tone:"red", h:"Seizures or reduced consciousness", html:"Seizures or encephalopathy (from hypoxia during paroxysms) at any age → emergency admission.", src:"Green Book ch. 24 (Dec 2025); clinical practice"},
         {tone:"red", h:"Pneumonia or hypoxia", html:"Fever returning in the paroxysmal phase, tachypnoea, focal chest signs or low saturations suggest a secondary pneumonia → assess the same day and admit if hypoxic.", src:"Green Book ch. 24 (complications); clinical practice"},
         {tone:"amber", h:"Complications of forceful coughing", html:"Rib fracture, syncope, subconjunctival haemorrhage, hernia, urinary incontinence, pneumothorax, and weight loss from post-tussive vomiting. Examine for them and explain them. They are distressing but usually self-limiting."},
         {tone:"amber", h:"Pregnancy near term", html:"A woman beyond 32 weeks with suspected pertussis needs prompt treatment and notification, because her newborn will be exposed. Erythromycin is the UKHSA choice in pregnancy.", src:"UKHSA pertussis guidance (priority groups, antibiotic choice)"},
         {tone:"purple", h:"NG12 — unexplained cough in people aged 40 and over", html:"If pertussis is not confirmed and the cough is unexplained, NG12 applies. <b>Offer an urgent chest X-ray (to be performed within 2 weeks)</b> to assess for lung cancer in people aged 40 and over with 2 or more unexplained symptoms (cough, fatigue, shortness of breath, chest pain, weight loss, appetite loss), or with 1 or more if they have ever smoked.", src:"NICE NG12 (updated April 2026)"}
       ]},
       {b:"warn", html:"A “100-day cough” label can be falsely reassuring. If the history does not fit (no paroxysms, weight loss, haemoptysis, persistent focal signs), or tests are negative in a smoker over 40, apply NG12 and investigate the cough on its own merits."}
     ]},

    {id:"notify", nav:"Notify", title:"Notification — the statutory duty", sub:"This is a legal requirement for the doctor who suspects the infection, not an optional courtesy to public health.",
     blocks:[
       {b:"cards", items:[
         {tone:"purple", h:"Who, when and how", html:"Under the <b>Health Protection (Notification) Regulations 2010</b>, a registered medical practitioner who has reasonable grounds to suspect whooping cough must notify the <b>proper officer</b> of the local authority. In England, the local UKHSA health protection team fulfils this role. Notify <b>in writing within 3 days</b> of forming the suspicion, or <b>orally as soon as reasonably practicable</b> if the case is urgent.", src:"Health Protection (Notification) Regulations 2010, Schedule 1; UKHSA notifiable diseases guidance"},
         {tone:"blue", h:"Suspicion is enough", html:"Notification is based on <b>clinical suspicion</b>. Do not delay it until a swab or antibody result returns. The laboratory reports confirmed results separately, which does not replace your notification.", src:"Health Protection (Notification) Regulations 2010; UKHSA pertussis guidance"},
         {tone:"amber", h:"When to phone rather than write", html:"Phone the HPT the same day if the case lives with, or works with, <b>young infants or women in late pregnancy</b>, is in a healthcare or childcare setting, or is part of a cluster. These are the situations where chemoprophylaxis and vaccination decisions are time-critical.", src:"UKHSA pertussis guidance (priority groups; 14-day chemoprophylaxis window)"}
       ]},
       {b:"say", html:"Whooping cough is one of the infections doctors have a legal duty to report to the local health protection team. It doesn’t mean you’ve done anything wrong. It means they can check whether anyone around you, especially a young baby or a pregnant woman, needs protecting."}
     ]},

    {id:"tests", nav:"Tests", title:"Testing — choose by the week of illness", sub:"The best test depends on how long the cough has been present, and on the patient’s age.",
     blocks:[
       {b:"table", head:["Situation","Test","Notes"], rows:[
         ["<b>Early illness</b> (roughly the first 2–3 weeks of cough), any age","<b>PCR</b> on a nasopharyngeal (per-nasal) swab or aspirate; culture in some laboratories","Most sensitive while bacteria are still present; falls off as the cough continues and after antibiotics"],
         ["<b>Cough over 2 weeks, aged 2 to under 17</b>","<b>Oral fluid anti-pertussis toxin IgG</b>","Available for <b>notified</b> cases and arranged by the HPT"],
         ["<b>Cough over 2 weeks, adults</b>","<b>Serum anti-pertussis toxin IgG</b>","A high titre indicates recent infection"],
         ["<b>Recently vaccinated</b> (including pregnancy vaccine)","Antibody tests are unreliable","Rely on PCR, or on the clinical and epidemiological picture"],
         ["<b>Infants in hospital</b>","PCR; FBC (a marked lymphocytosis suggests severe disease)","Managed by paediatrics"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Oral fluid testing is a public health service", html:"UKHSA offers oral fluid testing for notified cases aged 2 to under 17. Notify the case, and the HPT arranges the kit. It avoids a blood test in children who have had a cough for more than 2 weeks, when PCR is often negative.", src:"UKHSA — pertussis oral fluid testing instructions (gov.uk)"},
         {tone:"blue", h:"A negative test does not cancel the plan", html:"Late PCR or early serology can be falsely negative. If the clinical picture fits, <b>treat and exclude according to the clinical diagnosis</b> and let the HPT decide on contacts.", src:"UKHSA pertussis public health guidance (2024–25)"}
       ]}
     ]},

    {id:"treat", nav:"Antibiotics", title:"Antibiotics — who, when and which", sub:"The antibiotic is given mainly to stop transmission. It helps symptoms only if started very early.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1", title:"Is the cough inside the window?", when:"decide first", tone:"cream",
          html:"<b>Cough onset within the last 14 days</b> → consider treatment. <b>Within 21 days</b> → treat if the case is <b>pregnant</b> (ideally starting at least 3 days before delivery), or has a household or other close contact in <b>priority group 1</b>. <b>Beyond 21 days</b> → antibiotics are not recommended, because the patient is no longer meaningfully infectious (UKHSA)."},
         {step:"2", title:"Choose the drug by age and pregnancy", when:"UKHSA preferred agents", fromLabel:"inside the window", tone:"cream",
          html:"<b>Under 1 month:</b> clarithromycin. <b>1 month and over, and non-pregnant adults:</b> azithromycin or clarithromycin. <b>Pregnancy:</b> erythromycin. <b>Macrolide contraindicated or not tolerated:</b> co-trimoxazole, but not in pregnancy or in infants under 6 weeks. <b>Doses and durations per BNF/BNFC and the UKHSA antibiotic table.</b>"},
         {step:"3", title:"Supportive care and expectation-setting", when:"everyone", fromLabel:"whether or not an antibiotic is given", tone:"green",
          html:"Fluids, small frequent feeds or meals (vomiting after paroxysms is common), rest, and paracetamol or ibuprofen for fever or rib pain (dose per BNF). Explain that the cough will continue for weeks after the antibiotic course, and that this is not treatment failure."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"What the antibiotic achieves", html:"Across 13 trials (2,197 participants), antibiotics eradicated <i>B. pertussis</i> from the nasopharynx but <b>did not change the clinical outcome</b>. Short courses (azithromycin 3–5 days, or clarithromycin or erythromycin 7 days) were as effective as 10–14 days of erythromycin, with fewer side effects.", src:"Altunaiji S, et al., Cochrane 2007 (CD004404)"},
         {tone:"amber", h:"Macrolide cautions", html:"Check for QT-prolonging drugs and interacting medicines (for example statins with clarithromycin or erythromycin) before prescribing. Macrolides in young infants have been linked with infantile hypertrophic pyloric stenosis, so warn parents about projectile vomiting. The benefit usually outweighs this risk in a young infant with pertussis.", src:"BNF / BNFC macrolide monographs"}
       ]},
       {b:"why", html:"Earlier versions of this page gave a single 21-day window and fixed adult doses. The current UKHSA approach is more targeted: <b>14 days for most cases</b>, extended to <b>21 days where the case is pregnant or a priority group 1 infant is a contact</b>. This reflects the evidence that antibiotics mainly shorten carriage, and that their value to contacts falls off with time. Doses now defer to the BNF and the UKHSA table, which are updated more often than a static page."}
     ]},

    {id:"contacts", nav:"Contacts", title:"Contacts — priority groups and chemoprophylaxis", sub:"The HPT leads this. The GP’s job is to identify vulnerable contacts quickly and often to prescribe what the HPT advises.",
     blocks:[
       {b:"table", head:["Group","Who","Why they matter"], rows:[
         ["<b>Priority group 1</b> — at risk of severe disease","Infants under 2 months born before 32 weeks (whatever the mother’s vaccination). Infants under 2 months born from 32 weeks whose mother was not vaccinated in pregnancy (after 16 weeks and at least 2 weeks before delivery). Infants aged 2 months to under 1 year who are unimmunised or partially immunised (fewer than 3 doses)","Most deaths occur in this group"],
         ["<b>Priority group 2</b> — at risk of passing it to group 1","Pregnant women from 32 weeks. Healthcare workers and others who work with young infants or pregnant women. People who live with an infant too young to be fully vaccinated","Protecting them protects the infant"]
       ]},
       {b:"cards", items:[
         {tone:"blue", h:"Chemoprophylaxis window", html:"Close contacts who fall into a priority group are eligible for antibiotic chemoprophylaxis for up to <b>14 days after the onset of cough in the case</b>. This was previously 21 days, and was shortened because effectiveness falls with time since exposure. Use the same drugs as for treatment, at the same doses.", src:"UKHSA pertussis public health guidance (2024–25)"},
         {tone:"blue", h:"Evidence for prophylaxis is limited", html:"Cochrane found <b>insufficient evidence</b> of clinical benefit from treating healthy contacts. This is why prophylaxis is targeted at households containing a vulnerable infant, and not given to whole classes or workplaces.", src:"Altunaiji S, et al., Cochrane 2007"},
         {tone:"green", h:"Vaccinate as well as treat", html:"The HPT may advise bringing forward or completing the <b>infant primary course</b>, and offering a pertussis-containing vaccine to a <b>pregnant contact</b> who has not had one in this pregnancy. Check the household’s records while the family is with you.", src:"Green Book ch. 24 (Dec 2025); UKHSA pertussis guidance"}
       ]}
     ]},

    {id:"prevent", nav:"Vaccination", title:"Prevention — maternal, infant and occupational vaccination", sub:"The maternal programme is the single most effective protection for newborns, who are too young for their own vaccine.",
     blocks:[
       {b:"cards", items:[
         {tone:"green", h:"Pregnancy — every pregnancy", html:"Offer a pertussis-containing vaccine (dTaP/IPV) in <b>every pregnancy</b>. The best window is <b>16 to 32 weeks</b>, ideally around 20 weeks after the anomaly scan. Do not give it before 16 weeks. After 32 weeks, still offer it up to labour: late vaccination may give the baby less passive protection, but it protects the mother and so reduces the baby’s exposure. The programme is about 90% effective at protecting young infants.", src:"Green Book ch. 24 (Dec 2025); UKHSA maternal pertussis programme"},
         {tone:"green", h:"Infant and pre-school schedule", html:"6-in-1 (hexavalent) vaccine at <b>8, 12 and 16 weeks</b>, with a <b>fourth hexavalent dose at 18 months</b> for children born on or after 1 July 2024 (introduced from 1 July 2025, replacing Hib/MenC at 1 year; the 18-month appointments started in January 2026, when MMRV was also added), and a dTaP/IPV pre-school booster at 3 years 4 months. Opportunistically check and catch up missed doses.", src:"UKHSA complete routine immunisation schedule; Green Book ch. 11 (March 2026)"},
         {tone:"green", h:"Health and care workers", html:"UKHSA recommends occupational pertussis vaccination for healthcare workers who have regular contact with pregnant women or young infants and have not had a pertussis-containing vaccine in the last 5 years.", src:"UKHSA occupational pertussis vaccination of healthcare workers"},
         {tone:"blue", h:"Previous infection does not guarantee immunity", html:"Immunity after natural infection or vaccination wanes. A woman who had whooping cough before, or was vaccinated in a previous pregnancy, should still be vaccinated in this one, because each pregnancy needs fresh antibodies to transfer to the baby.", src:"Green Book ch. 24 (Dec 2025)"}
       ]},
       {b:"say", html:"The whooping cough jab in pregnancy passes your antibodies to the baby, so they are protected from birth until they can have their own vaccines at 8 weeks. It works best from about 20 weeks, and it’s needed in every pregnancy, even if you had it last time."}
     ]},

    {id:"exclusion", nav:"Exclusion", title:"Exclusion, symptom relief and what to expect", sub:"Clear rules about staying away, and honest expectations about a long cough.",
     blocks:[
       {b:"dl", rows:[
         ["Nursery, school, work","Stay off until <b>48 hours after starting</b> an appropriate antibiotic, or for <b>21 days from the onset of the cough</b> if no antibiotic is taken. Once the cough is more than 21 days old, the case is no longer considered infectious (UKHSA)"],
         ["Healthcare and childcare staff","Same 48-hour rule. The HPT and occupational health may add requirements for staff who work with infants"],
         ["Babies and late pregnancy","Avoid close contact with newborns and women in late pregnancy for the same infectious period"],
         ["Hygiene","Catch coughs in tissues, bin them, and wash hands, especially around infants"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"Cough medicines do not help", html:"A Cochrane review of symptomatic treatment (corticosteroids, salbutamol, antihistamines, pertussis immunoglobulin, leukotriene antagonists) found <b>insufficient evidence</b> that any of them reduces the paroxysms. Over-the-counter cough and cold medicines should not be given to children under 6.", src:"Wang K, et al., Cochrane 2014 (CD003257); MHRA/CHM advice February 2009"},
         {tone:"green", h:"What actually helps", html:"Small, frequent feeds or meals after coughing bouts, fluids, sleeping propped up if that helps, avoiding smoke and other triggers, and simple analgesia for chest-wall or rib pain. Reassure the patient that the cough will fade over weeks and may briefly return with the next cold.", src:"Wang K, et al., Cochrane 2014; clinical practice"}
       ]},
       {b:"say", html:"Even with the antibiotic, this cough can go on for weeks, sometimes two or three months, which is why it’s called the hundred-day cough. The antibiotic stops you passing it on. After 48 hours of treatment you can go back to school or work. Please keep away from newborn babies and anyone heavily pregnant until then. If you have a baby at home, we’ll make sure they’re protected too."}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — destinations and thresholds", sub:"The statutory notification and the NG12 threshold are repeated here so they are in front of you at the point of action.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999 / same-day paediatrics", html:"Infants with apnoea, cyanosis, bradycardia, feeding difficulty, respiratory distress or seizures. Most infants under 6 months with suspected pertussis warrant same-day paediatric assessment, even if they look well between bouts.", src:"Green Book ch. 24 (Dec 2025)"},
         {tone:"red", h:"Same-day admission at any age", html:"Hypoxia, pneumonia, seizures or encephalopathy, dehydration from vomiting, or suspected pneumothorax.", src:"Clinical practice; Green Book ch. 24"},
         {tone:"purple", h:"Statutory notification — every suspected case", html:"Notify the proper officer (the UKHSA health protection team) under the Health Protection (Notification) Regulations 2010: <b>in writing within 3 days</b>, or <b>by phone as soon as practicable if urgent</b>. Phone the same day when a priority group 1 infant or a pregnant woman is a contact.", src:"Health Protection (Notification) Regulations 2010; UKHSA notifiable diseases guidance"},
         {tone:"purple", h:"NG12 — urgent chest X-ray", html:"People aged 40 and over with an <b>unexplained</b> cough plus one other unexplained symptom (fatigue, shortness of breath, chest pain, weight loss, appetite loss), or with a cough alone if they have ever smoked → <b>offer an urgent chest X-ray (to be performed within 2 weeks)</b> to assess for lung cancer. Aged 40 and over with <b>unexplained haemoptysis</b> → suspected cancer pathway referral for lung cancer.", src:"NICE NG12 (updated April 2026)"},
         {tone:"blue", h:"HPT-led actions", html:"Chemoprophylaxis for priority-group contacts (within 14 days of the case’s cough onset). Oral fluid testing for ages 2 to under 17. Outbreak management in schools, nurseries and healthcare settings.", src:"UKHSA pertussis public health guidance (2024–25)"}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card. The marks come from the household question and the public health actions.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Scenario", html:"A 34-year-old teacher has had a cough for 10 days. It comes in bouts that make her retch, and it is worst at night. Her sister, who is 35 weeks pregnant, is staying with her. She wants “a strong cough medicine” so she can get back to work on Monday.", src:"UKHSA pertussis guidance (case definition; priority groups)"},
       {tone:"cream", h:"What a good consultation does", html:"Recognises the paroxysmal pattern before the 14-day mark. Asks who she lives with and identifies the pregnant sister as a <b>priority group 2</b> contact (pregnant from 32 weeks) whose baby will be born into the household, and who is eligible for chemoprophylaxis because the case’s cough began within 14 days. Explains the <b>statutory notification</b> and notifies on suspicion, by phone given the pregnant contact. Arranges PCR. Prescribes <b>azithromycin or clarithromycin</b> (dose per BNF) because onset was within 14 days. Advises <b>48 hours off work after starting it</b>, and keeping away from her sister in the meantime. Checks the sister has had her pregnancy vaccine and explains that the HPT will advise on prophylaxis. Declines cough medicine with a reason (Cochrane) and sets a realistic expectation for how long the cough will last.", src:"UKHSA pertussis guidance; Health Protection (Notification) Regulations 2010; Green Book ch. 24"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Primary sources only. Doses are deferred to the BNF/BNFC and the UKHSA antibiotic table.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>UKHSA — Pertussis: guidance on the public health management of cases and contacts (national pertussis guidance; high-activity guidance 2024; current version on gov.uk)</b><br><a href="https://www.gov.uk/government/publications/pertussis-guidelines-for-public-health-management" rel="noopener">gov.uk — pertussis public health management</a><span class="rd"> — clinical case definition (cough of 14 days or more plus paroxysms, whoop, post-tussive vomiting or infant apnoea); antibiotics considered within 14 days of cough onset (previously 21), and recommended for all cases within 21 days if the case is pregnant or has a priority group 1 contact; no public health action for most cases reported more than 21 days after onset; drug choice by age and pregnancy (clarithromycin under 1 month; azithromycin or clarithromycin from 1 month; erythromycin in pregnancy; co-trimoxazole if a macrolide is unsuitable, not in pregnancy or under 6 weeks); priority groups 1 and 2; chemoprophylaxis for priority-group contacts within 14 days (previously 21)</span></li>'+
         '<li><b>UKHSA — Health protection in children and young people settings, including education: exclusion table</b><br><a href="https://www.gov.uk/government/publications/health-protection-in-schools-and-other-childcare-facilities" rel="noopener">gov.uk — exclusion table</a><span class="rd"> — whooping cough: 2 days (48 hours) from starting antibiotic treatment, or 21 days from onset of symptoms if no antibiotic treatment</span></li>'+
         '<li><b>UKHSA — Pertussis antibodies in oral fluid test: instructions for health protection teams</b><br><a href="https://www.gov.uk/government/publications/pertussis-whooping-cough-oral-fluid-laboratory-request-form-and-instructions" rel="noopener">gov.uk — oral fluid testing</a><span class="rd"> — for notified cases aged 2 to under 17</span></li>'+
         '<li><b>Green Book, chapter 24: Pertussis (UKHSA, updated 19 December 2025)</b><br><a href="https://www.gov.uk/government/publications/pertussis-the-green-book-chapter-24" rel="noopener">gov.uk — Green Book chapter 24</a><span class="rd"> — incubation about 6–20 days; absent whoop and apnoea in infants; deaths concentrated in young infants; maternal vaccination from 16 weeks, ideally about 20 weeks, 16–32 weeks optimal, still offered up to labour with less passive protection when given late; about 90% effectiveness in protecting infants</span></li>'+
         '<li><b>UKHSA — Complete routine immunisation schedule (from January 2026); Green Book chapter 11</b><span class="rd"> — hexavalent vaccine at 8, 12 and 16 weeks plus a fourth dose at 18 months (born on or after 1 July 2024; introduced July 2025, 18-month appointments from January 2026); dTaP/IPV pre-school booster at 3 years 4 months</span></li>'+
         '<li><b>UKHSA — Occupational pertussis vaccination of healthcare workers</b><span class="rd"> — offer to staff in regular contact with pregnant women or young infants who have not had a pertussis-containing vaccine in the last 5 years</span></li>'+
         '<li><b>The Health Protection (Notification) Regulations 2010 (SI 2010/659)</b><br><a href="https://www.legislation.gov.uk/uksi/2010/659" rel="noopener">legislation.gov.uk/uksi/2010/659</a><span class="rd"> — whooping cough in Schedule 1; the registered medical practitioner notifies the proper officer on suspicion, in writing within 3 days, or orally as soon as practicable if urgent</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (2015, updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — urgent chest X-ray within 2 weeks for people aged 40 and over with unexplained cough and other symptoms, or ever-smokers with 1 symptom</span></li>'+
         '<li><b>Altunaiji S, et al. Antibiotics for whooping cough (pertussis). Cochrane Database Syst Rev 2007 (CD004404)</b><br><a href="https://www.cochranelibrary.com/cdsr/doi/10.1002/14651858.CD004404.pub3/full" rel="noopener">cochranelibrary.com</a><span class="rd"> — 13 trials, 2,197 participants; eradication without change in clinical course; short courses as effective as long ones; insufficient evidence for contact prophylaxis</span></li>'+
         '<li><b>Wang K, et al. Symptomatic treatment of the cough in whooping cough. Cochrane Database Syst Rev 2014 (CD003257; update of Bettiol et al. 2012)</b><br><a href="https://www.cochranelibrary.com/cdsr/doi/10.1002/14651858.CD003257.pub5/full" rel="noopener">cochranelibrary.com</a><span class="rd"> — insufficient evidence for any symptomatic treatment</span></li>'+
         '<li><b>Wang K, Fry NK, Campbell H, et al. Whooping cough in school age children presenting with persistent cough in UK primary care after introduction of the preschool pertussis booster vaccination: prospective cohort study. BMJ 2014</b><br><a href="https://pubmed.ncbi.nlm.nih.gov/24961836/" rel="noopener">pubmed.ncbi.nlm.nih.gov/24961836</a><span class="rd"> — about 1 in 5 of 279 children aged 5–15 with a cough of 2–8 weeks had evidence of recent pertussis</span></li>'+
         '<li><b>MHRA / Commission on Human Medicines — over-the-counter cough and cold medicines for children (February 2009)</b><span class="rd"> — not to be used under 6 years</span></li>'+
         '<li><b>BNF / BNFC</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — doses and durations for azithromycin, clarithromycin, erythromycin and co-trimoxazole; macrolide interactions and cautions</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Whooping cough (pertussis) — assessment and management in primary care, using UKHSA pertussis public health guidance, Green Book chapter 24 (December 2025), the Health Protection (Notification) Regulations 2010, NICE NG12 (cough in people aged 40 and over) and Cochrane reviews of antibiotics (2007) and symptomatic treatment (2014). Health protection teams may vary thresholds during periods of high activity, so follow their advice on the day. Verify doses in the current BNF/BNFC."
