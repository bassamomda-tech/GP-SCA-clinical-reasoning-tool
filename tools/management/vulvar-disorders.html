  stemTitle:"Examine every persistent vulval symptom — the classic error is repeated blind antifungal prescribing, and it is one way vulval cancer gets diagnosed late",
  stemSub:"One page for the whole presentation, reasoning pathway and management together: look before treating, because a non-resolving lesion, ulcer or white patch can be lichen sclerosus or vulval cancer. Sort the presentation by pattern and work through a short differential, diagnose lichen sclerosus properly and treat it with enough clobetasol for long enough, use the cotton-swab (Q-tip) test to map vestibular pain once infection, dermatoses and GSM have been assessed, treat genitourinary syndrome of menopause rather than accepting it as ageing, confirm the species before committing anyone to six months of antifungal, and keep every woman with lichen sclerosus under long-term review.",
  guideline:"BAD lichen sclerosus (2018) · BASHH vulval conditions (2024) · BASHH VVC (2019) · BASHH HSV (2024) · BASHH/RCOG HSV in pregnancy (2024) · NICE NG12 (updated April 2026) · NICE NG23 · BNF",

  lead:'<div class="mg-layers"><a href="#severe"><b>Exclude first</b><small>Cancer · VIN · safeguarding</small></a><a href="#confirm"><b>Classify</b><small>LS · LP · LSC · infection</small></a><a href="#ddx"><b>Differential</b><small>By pattern</small></a><a href="#workup"><b>Assess</b><small>Examine · Q-tip · swab</small></a><a href="#ladder"><b>Treat</b><small>Clobetasol · GSM · pain</small></a><a href="#monitor"><b>Surveillance</b><small>LS review</small></a></div>',
  quickSub:"If you read nothing else on this page, read these six cards. Every number traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Examine, don't just prescribe", html:"<b>An unexplained vulval lump, ulceration or bleeding should prompt consideration of an urgent suspected-cancer referral (NICE NG12, updated April 2026).</b> Persistent, indurated, ulcerated, pigmented, bleeding or treatment-resistant lesions require examination by an appropriately experienced clinician and biopsy or specialist referral where indicated. NG12 does not create a two-week-wait rule for all vulval itch, pain or persistent symptoms. <b>The classic error is repeated blind antifungal prescribing</b> — a vulval symptom that keeps coming back needs to be looked at before the next prescription."},
    {tone:"amber", h:"Never assume vulval itch is benign after the menopause", html:"Persistent or unexplained vulval symptoms after menopause require examination and a low threshold for specialist referral. Biopsy or urgent suspected-cancer referral is indicated for a persistent ulcer, lump, induration, thickening, bleeding, pigmentation or lesion not responding to appropriate treatment. <b>Do not allow repeated empirical antifungal or steroid prescriptions without examination.</b>"},
    {tone:"amber", h:"Lichen sclerosus is the condition to get right", html:"Frequently misdiagnosed as candida or contact dermatitis and treated empirically for months or years, it causes irreversible architectural change if undertreated, and is associated with a small but clinically important risk of vulval squamous-cell carcinoma (lifetime under 5%, BAD 2018). Adequate treatment and follow-up reduce active disease and may reduce risk, but do not remove the need for self-examination and assessment of new suspicious lesions. White, atrophic, shiny skin in a figure-of-eight around the vulva and anus, often with purpura, is the classic picture."},
    {tone:"blue", h:"Under-application is a common reason clobetasol “fails”", html:"Apply a thin film to <b>all</b> affected skin, including perianal skin, and give written instructions and a diagram. Patients under-apply because they fear steroid thinning; in fact adequate treatment restores atrophic lichen sclerosus skin, and it is untreated lichen sclerosus that causes the atrophy. As an approximate guide, not a rigid prescribing limit, a 30 g tube lasts about 3 months of the induction regimen (BAD, 2018). If symptoms or active disease persist, reassess the diagnosis, adherence, contact allergy, lichen planus, infection and VIN/cancer."},
    {tone:"blue", h:"Map vestibular pain with a cotton swab", html:"Map pain with a gentle cotton-swab examination of the vestibule and document the distribution and severity (0–10). Pain may be anterior, posterior, diffuse or mixed; no single site is diagnostic in isolation. A positive test supports provoked vestibulodynia only after infection, inflammatory dermatoses, GSM, fissuring and other causes have been assessed. Initial management: explanation, irritant avoidance, lubrication, pelvic-floor assessment and physiotherapy, and psychosexual or CBT-informed support; medicines are individualised. Diffuse unprovoked pain is generalised vulvodynia."},
    {tone:"green", h:"Confirm the species before six months of antifungal", html:"Recurrent VVC is 4 or more symptomatic episodes in 12 months, with <b>at least two microbiologically confirmed</b> (BASHH 2019): examine and obtain microscopy and/or culture with speciation before committing to prolonged suppressive treatment. The commonest error is repeated short fluconazole courses without ever confirming the species — non-albicans species such as <i>C. glabrata</i> are often less azole-susceptible and often need specialist-directed treatment. For confirmed susceptible <i>C. albicans</i>: induction fluconazole 150 mg every 72 hours × 3, then 150 mg weekly for 6 months, after checking pregnancy status, drug interactions and liver disease. It suppresses rather than cures and relapse after stopping is common — say so at the outset. Full detail: <a href='recurrent-thrush.html'>recurrent thrush</a>."}
  ],
  pathwaySub:"The whole consultation in six moves. The red step is inspection.",
  pathway:[
    {title:"Look, and exclude cancer and abuse", html:"Unexplained vulval lump, ulceration or bleeding → consider an NG12 suspected cancer referral. Persistent, indurated, pigmented or treatment-resistant lesion → biopsy or specialist referral by an appropriately experienced clinician. Suspected abuse or assault → local safeguarding and sexual-assault (SARC) pathways; no forensic or repeated genital examination outside your competence, but if urgent medical assessment is needed perform only the minimum clinically necessary examination, with consent and appropriate support.", alert:true},
    {title:"Classify by pattern", html:"Inflammatory dermatoses (LS, LP, LSC) · infections (VVC, HSV, trichomonas, HPV) · vulvodynia and vestibulodynia · other (GSM, contact dermatitis, psoriasis, Bartholin)."},
    {title:"Examine systematically and test", html:"Consent and chaperone, good lighting; mons → labia → clitoris → vestibule → introitus → perineum → perianal skin. <b>Cotton-swab pain mapping, vaginal pH as an adjunct, swabs, HbA1c where indicated, and lesion-directed biopsy where indicated.</b>"},
    {title:"Narrow the differential", html:"The dominant symptom (itch, pain, burning, discharge, lump), the colour and texture of the skin, the pH and the swab results separate the common causes."},
    {title:"Treat the diagnosis properly", html:"LS → clobetasol induction then individualised maintenance. GSM → moisturisers/lubricants and vaginal oestrogen for as long as needed, with review. Vestibulodynia → exclude dermatoses and infection, assess the pelvic floor, individualise treatment and refer if persistent. Candida → microbiologically confirmed regimen. Bartholin abscess → drainage; urgent assessment if atypical, recurrent or aged 40 or over."},
    {title:"Keep LS under review", html:"Long-term review with symptom score, documented architectural change and biopsy or referral of anything new and suspicious. Review vulvodynia at 3 months, GSM annually, and re-assess anything not improving rather than repeat-prescribing."}
  ],
  sections:[

    {id:"severe", nav:"Exclude first", title:"Red flags — vulvar cancer, malignant transformation and safeguarding",
     sub:"Vulval itch is usually benign, but persistent or atypical lesions must be examined, with biopsy or referral of suspicious or treatment-resistant lesions, to exclude VIN and vulval carcinoma.",
     blocks:[
       {b:"table", head:["Presentation","Suggests","Action"], rows:[
         ["Persistent vulval ulcer, nodule or thickened white or red plaque not healing with appropriate treatment, particularly over 50","Suspicious for vulval squamous cell carcinoma (SCC) or VIN (vulval intraepithelial neoplasia). Risk factors: lichen sclerosus (lifetime risk under 5%, BAD 2018), HPV-related VIN, smoking, immunosuppression","<b>Unexplained lump, ulceration or bleeding: consider a suspected cancer pathway referral (NICE NG12, updated April 2026)</b> to gynaecology. Persistent, indurated or treatment-resistant lesions: examination by an appropriately experienced clinician and lesion-directed biopsy or specialist referral — do not keep treating empirically"],
         ["Lichen sclerosus + new erosion, fissure or indurated plaque not responding to treatment","<b>Possible malignant transformation within LS</b> — not every new erosion is malignant, but the risk is higher in undertreated disease","Any persistent or clinically suspicious new erosion, ulcer, lump, induration, thickening, bleeding or colour change in lichen sclerosus should be biopsied or referred urgently"],
         ["Vulval pruritus + thickened hyperkeratotic plaque + bleeding + postmenopausal","Lichen simplex chronicus complicated by SCC, or primary vulval SCC","Suspected cancer pathway referral for bleeding or an unexplained lump or ulcer. Persistent or unexplained vulval symptoms after menopause need examination and a low threshold for specialist referral — biopsy or refer any suspicious lesion"],
         ["Vulval pain + purulent discharge + fever + tender inguinal lymphadenopathy + labial ulcer in a sexually active woman","<b>Bartholin gland abscess, chancroid, or HSV with secondary infection.</b> STI screen needed","Bartholin abscess → drainage (Word catheter) or same-day gynaecology if severe or septic. Suspected chancroid (<i>Haemophilus ducreyi</i>) → GUM same-day"],
         ["<b>Bartholin mass in a woman aged 40 or over</b>, particularly if solid, irregular, fixed or recurrent","<b>Bartholin gland malignancy must be excluded</b>","<b>Urgent gynaecology assessment</b> and consideration of biopsy or excision"],
         ["Vulval lesion + child or vulnerable adult + unexplained injury inconsistent with the history","<b>Sexual abuse</b>","Follow local safeguarding and sexual-assault referral pathways. Do not conduct a forensic examination or repeated genital examination outside your competence. If urgent medical assessment is required, perform only the minimum clinically necessary examination with consent and appropriate support, and arrange specialist paediatric, safeguarding or SARC assessment. Document the history in the patient’s own words and avoid leading questions. Police involvement if acute assault"],
         ["Recurrent vestibular pain or dyspareunia + progressive difficulty with intercourse + relationship distress + pain catastrophising","<b>Vulvodynia with significant functional impact</b> — risk of relationship breakdown, depression and sexual dysfunction","<b>Psychosexual referral plus specialist vulval clinic</b>"],
         ["<b>Irregular pigmented vulval lesion with bleeding or rapid change</b>","<b>Vulval melanoma</b>","<b>Suspected cancer pathway referral</b> (NICE NG12 melanoma criteria)"],
         ["<b>Vulval itch in a child</b>","<b>Usually irritant, threadworm or hygiene-related</b>; lichen sclerosus also occurs in children","Treat the cause — but <b>consider safeguarding if there are features of abuse</b>. Recurrent candidiasis is uncommon before puberty: consider irritants, hygiene, threadworm, dermatoses and safeguarding. Do not apply the adult cotton-swab, recurrent-VVC or treatment algorithms uncritically to children; paediatric genital examination follows local safeguarding and paediatric protocols"],
         ["<b>Generalised pruritus including the vulva</b>","Systemic causes — iron deficiency (check ferritin), liver or renal disease, thyroid disease, lymphoma","<b>Screen if the history suggests it.</b> A sedating antihistamine at night can break the itch-scratch cycle meanwhile"]
       ]},
       {b:"cards", items:[
         {tone:"purple", h:"Suspected cancer · NICE NG12 (updated April 2026) — vulval cancer", html:"<b>Consider a suspected cancer pathway referral (for an appointment within 2 weeks) for vulval cancer in a woman with an unexplained vulval lump, ulceration or bleeding.</b> NG12 does not create a universal two-week-wait rule for all vulval itch, pain or persistent symptoms. Persistent, indurated, ulcerated, pigmented, bleeding or treatment-resistant lesions — including a suspicious new lesion in LS — need examination by an appropriately experienced clinician and biopsy or specialist referral where indicated. An irregular pigmented lesion follows the suspected melanoma route.", src:"NICE NG12 (updated April 2026)"}
       ]},
       {b:"why", html:"Vulval SCC is often diagnosed late, and part of that delay happens through repeated empirical treatment without examination or biopsy. There are two routes to it: (1) the HPV-related pathway — typically younger women, high-grade VIN, HPV 16/18, cigarette smoking; and (2) the non-HPV pathway — older women, arising on a background of lichen sclerosus, lichen planus or differentiated VIN, the last being easily missed because it resembles reactive change. The key GP principle: persistent or unexplained vulval symptoms after menopause require examination and a low threshold for specialist referral; biopsy or urgent suspected-cancer referral is indicated for a persistent ulcer, lump, induration, thickening, bleeding, pigmentation or lesion not responding to appropriate treatment. Do not allow repeated empirical antifungal or steroid prescriptions without examination."}
     ]},

    {id:"confirm", nav:"Classify", title:"Classification of vulvar conditions",
     blocks:[
       {b:"dl", rows:[
         ["<b>Lichen sclerosus (LS)</b>","A common chronic vulval dermatosis. White, atrophic, shiny plaques in a figure-of-eight distribution (vulva plus perianal skin), often with purpura. Intense pruritus. Architectural distortion — labial fusion, clitoral phimosis, introital stenosis. A small but clinically important SCC risk (lifetime under 5%, BAD 2018). Occurs in children as well as adults. Biopsy when the diagnosis is uncertain, the appearance is atypical, there is persistent hyperkeratosis, erosion, ulceration, induration, bleeding or a nodule, response is inadequate despite correct treatment, or LP, VIN or malignancy is suspected — not every clinically typical case needs biopsy. Treatment: clobetasol propionate 0.05% ointment, the first-line ultra-potent topical corticosteroid"],
         ["<b>Lichen planus (LP)</b>","Vulvovaginal-gingival syndrome; erosive LP is the commonest vulval pattern — glazed red erosions with a white lacy (Wickham's striae) edge, vaginal involvement and adhesions. Also carries a malignancy risk, so persistent or changing lesions are biopsied. Suspected erosive vulvovaginal LP generally merits specialist vulval, dermatology or gynaecology assessment, particularly with vaginal involvement, scarring or adhesions, persistent erosions, oral or gingival disease, or diagnostic uncertainty; histology must be interpreted with the clinical findings"],
         ["<b>Lichen simplex chronicus (LSC)</b>","The itch → scratch → lichenification cycle; thick leathery vulval skin, highly reactive. Treat the underlying cause and break the cycle"],
         ["<b>Vulvovaginal candidiasis (VVC)</b>","A common cause of vulval itch — thick white discharge, erythema, satellite lesions, excoriation; vaginal pH usually 4.5 or below, though pH cannot exclude VVC. <i>C. albicans</i> causes most episodes; non-albicans species (especially <i>C. glabrata</i>) respond poorly to azoles. Recurrent VVC (4 or more symptomatic episodes in 12 months, at least two microbiologically confirmed): consider diabetes, immunosuppression and non-albicans species"],
         ["<b>Other infections</b>","HSV (genital herpes): painful vesicles or ulcers, tender inguinal lymphadenopathy, prodromal tingling. Trichomonas: yellow-green frothy discharge, sometimes a “strawberry” cervix. HPV / condylomata acuminata: soft fleshy warts"],
         ["<b>Vulvodynia and vestibulodynia</b>","Vulvodynia: chronic vulval pain lasting more than 3 months without an identifiable cause. Subtypes: generalised (spontaneous, unprovoked) or localised provoked vestibulodynia (the commonest — insertion provokes intense burning at the vaginal entrance). A diagnosis of exclusion. Mechanisms include central sensitisation, peripheral neuroinflammation and pelvic floor overactivity. Commonest in younger adult women, with significant impact on sexual function and quality of life"],
         ["<b>Genitourinary syndrome of menopause (GSM)</b>","Postmenopausal — thin pale mucosa, labial atrophy, loss of rugae, dyspareunia, dryness, urgency and recurrent UTI (also called vulvovaginal atrophy or atrophic vaginitis)"],
         ["<b>Contact dermatitis, psoriasis and Bartholin disease</b>","Contact dermatitis (allergic or irritant — panty liners, soap, detergents, topical anaesthetics, particularly benzocaine). Psoriasis: the inverse pattern — well-defined red plaques without scale in the skin folds. Bartholin's cyst or abscess: duct obstruction; a cyst is non-tender and lateral to the introitus, an abscess is acutely tender, fluctuant and red. A Bartholin mass in a woman aged 40 or over needs urgent gynaecology assessment to exclude malignancy"]
       ]},
       {b:"why", html:"Lichen sclerosus is the most important vulval condition for GPs to diagnose and manage correctly, for four reasons: (1) it is common in postmenopausal women and also occurs in premenopausal women and children; (2) it is frequently misdiagnosed as candidal infection or contact dermatitis and treated empirically for months to years; (3) untreated or inadequately treated LS leads to progressive architectural change — labial fusion, clitoral phimosis, introital stenosis — which is irreversible; and (4) it is associated with a small but clinically important risk of vulval SCC (lifetime under 5%, British Association of Dermatologists, 2018); adequate treatment and follow-up may reduce the risk but do not remove the need for self-examination and assessment of new suspicious lesions. The diagnosis is clinical in most cases — the figure-of-eight distribution of white atrophic shiny skin with purpura is characteristic. Biopsy is needed for atypical presentations, resistance to treatment and any suspicious lesion. Where the GP is uncertain about the diagnosis of a vulval condition, referral to gynaecology, dermatology or a specialist vulval clinic is better than prolonged empirical treatment."}
     ]},

    {id:"ddx", nav:"Differential", title:"Differential diagnosis — the feature that separates each",
     sub:"Three bedside discriminators do most of the work: the dominant symptom, the look of the skin, and the vaginal pH.",
     blocks:[
       {b:"table", head:["Condition","Discriminating features","Next step"], rows:[
         ["<b>Lichen sclerosus</b>","Itch (often nocturnal); white, crinkled, shiny skin in a figure-of-eight around the vulva and anus; purpura, fissures, loss of labia minora; little or no discharge; no lasting response to antifungals","Clobetasol induction and maintenance; biopsy if atypical (BAD, 2018)"],
         ["<b>Erosive lichen planus</b>","Pain more than itch; glazed red erosions with a white lacy edge; vaginal involvement and adhesions; often oral lesions","Vulval clinic for biopsy and specialist treatment"],
         ["<b>Lichen simplex chronicus</b>","Severe itch; thickened leathery skin with exaggerated markings; often an atopic background or a trigger","Potent topical steroid, emollient, break the itch-scratch cycle; biopsy if bleeding or a plaque"],
         ["<b>Vulvovaginal candidiasis</b>","Itch, thick white discharge, erythema and satellite lesions; <b>pH usually 4.5 or below</b> (does not exclude other causes); improves with an antifungal","Swab with speciation if recurrent; see <a href='recurrent-thrush.html'>recurrent thrush</a>"],
         ["<b>Contact dermatitis</b>","Itch and burning linked to a product (soaps, wipes, pads, spermicides, latex, topical anaesthetics or repeated antifungal creams); erythema without satellite lesions; negative culture","Remove the cause, soap substitute, short course of hydrocortisone 1% (BNF); patch testing if refractory"],
         ["<b>Genital herpes</b>","Recurrent painful blisters or ulcers in the same area, often with a prodrome and tender nodes","HSV PCR swab from the base of a lesion — see <a href='genital-herpes.html'>genital herpes</a>"],
         ["<b>Trichomoniasis / bacterial vaginosis</b>","Offensive discharge with <b>pH above 4.5</b> (supports, but does not diagnose alone); frothy yellow-green (TV) or thin grey fishy (BV); little vulval skin change","Swabs; sexual health for TV — see <a href='trichomoniasis.html'>trichomoniasis</a> and <a href='bacterial-vaginosis.html'>BV</a>"],
         ["<b>Vestibulodynia / vulvodynia</b>","Burning or rawness rather than itch; provoked by touch, sex or tampons; normal-looking skin; repeatedly negative cultures; <b>positive cotton-swab test</b> (anterior, posterior, diffuse or mixed) once infection, dermatoses and GSM are excluded","Individualised management below; specialist vulval or pain service if persistent or severe"],
         ["<b>Genitourinary syndrome of menopause</b>","Postmenopausal dryness, soreness and dyspareunia; pale thin mucosa, loss of rugae; pH raised","Vaginal oestrogen — see <a href='menopause.html'>menopause</a>"],
         ["<b>Psoriasis or eczema</b>","Well-defined red plaques in the folds (psoriasis, little scale) or ill-defined itchy eczema; disease elsewhere (scalp, nails, elbows)","Treat the dermatosis; emollients"],
         ["<b>Bartholin cyst or abscess</b>","Swelling at 4 or 8 o'clock lateral to the introitus; non-tender (cyst) or acutely tender, fluctuant and red (abscess)","Expectant for a small asymptomatic cyst; drainage for an abscess; urgent gynaecology for a mass at 40 or over"],
         ["<b>VIN or vulval cancer</b>","Persistent raised, pigmented, warty, ulcerated or thickened area; itch or bleeding; older women or HPV risk","NICE NG12 (updated April 2026) route — see <a href='#severe'>red flags</a>"]
       ]},
       {b:"why", html:"Each of these is commonly labelled as thrush. The pH is usually normal in candida and raised in BV, trichomoniasis and atrophy, but use it as an adjunct to examination and microscopy, not a standalone test — blood, semen, recent intercourse and vaginal products affect it; itch favours candida and the dermatoses, while burning or pain with normal-looking skin favours vulvodynia; and the skin itself is white and scarred in lichen sclerosus and eroded in lichen planus. A swab that repeatedly grows nothing while symptoms persist is itself diagnostic information — it points away from infection and towards a dermatosis, vulvodynia or an irritant cause. Repeated use of topical antifungals and anaesthetics can itself cause contact dermatitis."}
     ]},

    {id:"workup", nav:"Assess", title:"History, examination and investigations",
     blocks:[
       {b:"table", head:["Domain","Detail"], rows:[
         ["<b>Symptom profile</b>","Itch (LS, candida, LSC, contact dermatitis) · pain (LP, vulvodynia, herpes, Bartholin abscess) · burning (vulvodynia, GSM, candida) · discharge (VVC, BV, STI) · dyspareunia (vestibulodynia, GSM, LS, LP) · bleeding (LS, LP, trauma, VIN, SCC)"],
         ["<b>Pattern and triggers</b>","Duration and pattern — intermittent or cyclical suggests candida; constant suggests LS, LP or vulvodynia. Triggers: sexual activity (vestibulodynia), specific products (contact dermatitis), menstrual cycle (cyclical VVC)"],
         ["<b>Context</b>","Menopausal status (GSM) · sexual history (STIs) · previous vulval conditions · skin and autoimmune conditions (psoriasis, atopic eczema) · medications (antibiotics → candida; hormonal contraception and vulval dryness) · vaginal products (soaps, douches, panty liners — irritants) · pregnancy status · topical preparations and antifungal exposure · urinary and bowel symptoms · previous biopsy or vulval diagnosis"],
         ["<b>Examination technique</b>","Adequate lighting, a comfortable position (left lateral or lithotomy), consent and a chaperone. Systematic inspection: mons pubis → labia majora and minora → clitoris (phimosis) → vestibule (erythema, tenderness) → introitus → perineum → perianal skin"],
         ["<b>What to look for</b>","Colour: white (LS, LP, LSC, vitiligo), red (candida, contact dermatitis, erosive LP), grey-brown (melanosis, VIN). Texture: atrophic (LS, GSM), lichenified (LSC), vesicles or ulcers (HSV, LP). Architecture: labial fusion, clitoral phimosis, introital stenosis — late LS or LP"],
         ["<b>Q-tip test for vestibulodynia</b>","Map pain with a gentle cotton-swab examination of the vestibule and document the distribution and severity. Pain may be anterior, posterior, diffuse or mixed. A positive test supports provoked vestibulodynia only after infection, inflammatory dermatoses, GSM, fissuring and other causes have been assessed"],
         ["<b>Investigations</b>","High vaginal swab, plus STI tests if infection is suspected · vaginal pH as an adjunct, not a standalone test (4.5 or below is usual before the menopause and in VVC; above 4.5 suggests BV, trichomonas or GSM but does not diagnose them; blood, semen, recent intercourse and vaginal products affect it) · microscopy and/or culture with speciation, and sensitivities where clinically indicated, in recurrent VVC · HbA1c (recurrent candida, where clinically indicated) · lesion-directed vulval biopsy by an experienced clinician, usually via a vulval, dermatology or gynaecology service (any suspicious lesion, atypical or unresponsive LS, confirmation of LP) · HSV PCR swab from an ulcer · ferritin, renal, liver and thyroid tests if generalised itch"]
       ]},
       {b:"why", html:"The cotton-swab (Q-tip) test is a simple bedside examination. Touch a moistened cotton-tipped swab gently to the vestibule at the positions of a clock face, asking the patient to rate pain 0–10 at each touch, and document the distribution and severity. Pain may be anterior, posterior, diffuse or mixed, and no single site is diagnostic in isolation. A positive test supports provoked vestibulodynia only after infection, inflammatory dermatoses, GSM, fissuring and other causes have been assessed; it is distinct from the diffuse unprovoked pain of generalised vulvodynia. BASHH (2024) describes vulvodynia as multifactorial, and coexisting dermatoses and pelvic-floor overactivity are common. Initial management includes explanation, avoidance of irritants, lubrication, pelvic-floor assessment and physiotherapy, and psychosexual or CBT-informed support. Neuropathic-pain medicines, topical lidocaine and other pharmacological treatments should be individualised; persistent or severe cases should be referred to a specialist vulval or pain service."},
       {b:"dl", rows:[
         ["<b>Bartholin gland cyst versus abscess</b>","The Bartholin glands are paired mucus-secreting glands at the 4 and 8 o'clock positions of the vaginal introitus. Cyst: duct obstruction → mucus accumulation → a non-tender fluctuant swelling lateral to the introitus. Abscess: secondary infection, usually polymicrobial (including <i>S. aureus</i>, <i>E. coli</i>, and <i>N. gonorrhoeae</i> in sexually active women — always screen for STIs), presenting as an acutely tender, fluctuant, red swelling, with fever and systemic illness in severe cases. A small asymptomatic cyst can be managed expectantly; an abscess needs drainage. A Bartholin mass in a woman aged 40 or over, particularly if solid, irregular, fixed or recurrent, requires urgent gynaecology assessment and consideration of biopsy or excision to exclude malignancy"],
         ["<b>Vestibulodynia assessment</b>","Provoked pain at the vaginal entrance, with onset at first attempted intercourse or after a trigger (recurrent candida, childbirth, topical medications), leading to secondary sexual avoidance, relationship distress, depression and anxiety. Vestibular erythema may be present but is not diagnostic. Diagnosis needs the characteristic history, a positive cotton-swab test, and exclusion of other causes (infection including candida and herpes, inflammatory dermatoses including LS, GSM and fissuring). Assess the pelvic floor for overactivity, which is common"],
         ["<b>Recurrent vulvovaginal candidiasis</b>","4 or more symptomatic episodes in 12 months, at least 2 confirmed by microscopy or culture, at least 1 a positive culture with moderate or heavy growth (BASHH 2019). Examine the patient and obtain microscopy and/or culture with speciation, and sensitivity testing where clinically indicated; at least two episodes should be microbiologically confirmed before committing to prolonged suppressive treatment. Consider HbA1c and immunosuppression risk factors (HIV test where there are risk factors or features of immunosuppression) where clinically indicated. Full pathway: <a href='recurrent-thrush.html'>recurrent thrush</a>"]
       ]}
     ]},

    {id:"ladder", nav:"Treat", title:"Lichen sclerosus, GSM and vulvodynia",
     blocks:[
       {b:"table", head:["Condition","Treatment"], rows:[
         ["<b>Lichen sclerosus — induction</b>","Clobetasol propionate 0.05% ointment (ultra-potent topical corticosteroid), first-line: once daily at night for 4 weeks, then alternate nights for 4 weeks, then twice weekly for 4 weeks — a 3-month induction (BAD, 2018). Apply a thin layer to all affected skin including perianal. Provide written application instructions, since patients often under-apply"],
         ["<b>Lichen sclerosus — maintenance</b>","An individualised maintenance regimen for ongoing active disease, continued as needed to keep symptoms and signs controlled — often once or twice weekly — to prevent progression and architectural damage. Pruritus improves within weeks; white plaques take months. Emollient as a soap substitute and for dryness. Long-term review: symptoms, architectural change, and biopsy of any new suspicious lesion"],
         ["<b>GSM — vaginal oestrogen</b>","Estradiol 10 microgram vaginal tablet daily for 2 weeks, then twice weekly; or estriol 0.1% cream daily initially, then reducing to twice weekly (per SPC). Systemic absorption is generally low; follow the product information. Continue for as long as needed, with review: symptoms commonly return when it stops (NICE NG23). Vaginal oestrogen is not a treatment for unexplained bleeding, which needs assessment. For women with current or previous breast cancer, especially on aromatase inhibitors, use shared decision-making with the oncology and menopause teams"],
         ["<b>GSM — other options</b>","Offer non-hormonal vaginal moisturisers and water-based lubricants for symptomatic relief, alone or alongside oestrogen. Ospemifene (oral SERM) is not a routine primary-care alternative: check contraindications and specialist/local guidance before it is considered for moderate to severe postmenopausal vulvovaginal atrophy in women who are not candidates for vaginal oestrogen (dose per SPC)"],
         ["<b>Vulvodynia and vestibulodynia — individualised</b>","Exclude infection, inflammatory dermatoses, GSM and fissuring first. Initial management: explanation, avoidance of irritants, lubrication, pelvic-floor assessment and physiotherapy, and psychosexual or CBT-informed support. Neuropathic-pain medicines (for example low-dose amitriptyline, off-label; BNF neuropathic pain dosing), topical lidocaine and other pharmacological treatments should be individualised. Refer persistent or severe cases to a specialist vulval or pain service. Surgery (vestibulectomy) and botulinum toxin are specialist options for carefully selected refractory patients, not routine later steps"],
         ["<b>Contact dermatitis</b>","<b>Remove the irritant, plus hydrocortisone 1% and an emollient</b> (BNF)"]
       ]},
       {b:"why", html:"The clobetasol application technique is one of the most practically important points at diagnosis — patients under-apply topical corticosteroids to the vulva because they worry about steroid side effects. Apply a thin film to all affected skin including the perianal area; as an approximate guide rather than a rigid limit, a 30 g tube lasts about 3 months of the induction regimen (BAD, 2018), which gives patients a practical check on whether they are using enough or far too much. Inadequate application is a common reason for apparent treatment failure, but reassess the diagnosis, adherence, contact allergy, lichen planus, infection and VIN/cancer if symptoms or active disease persist. Provide clear written instructions and ideally a diagram at the first prescription. Two patient concerns to address directly: (1) skin thinning — adequate clobetasol treatment restores the atrophic LS skin toward normal, and it is untreated LS itself that causes the atrophy; (2) absorption — the small weekly amount used in maintenance is far below the dose that causes systemic corticosteroid effects."},
       {b:"why", html:"The GSM conversation is one of the most useful interventions in a menopause consultation. GSM is common, causes vaginal dryness, dyspareunia, urinary urgency and recurrent UTIs, and is usually treatable with vaginal oestrogen. Unlike vasomotor symptoms, which often improve over time, GSM tends to progress without treatment. It is under-treated because women are embarrassed to mention symptoms, clinicians do not ask, it is assumed to be normal ageing, and women worry that vaginal oestrogen carries the risks of systemic HRT. NICE NG23 advises offering vaginal oestrogen to women with urogenital atrophy, including those on systemic HRT, and continuing it for as long as needed, with review. Offer non-hormonal moisturisers/lubricants and consider vaginal oestrogen; investigate unexplained bleeding; and for breast cancer survivors, particularly those receiving aromatase inhibitors, discuss with the oncology and menopause teams."}
     ]},

    {id:"infections", nav:"Infections", title:"Candida, herpes and Bartholin abscess",
     blocks:[
       {b:"table", head:["Condition","Treatment"], rows:[
         ["<b>Uncomplicated VVC</b>","Clotrimazole 500 mg pessary as a single dose, or fluconazole 150 mg orally as a single dose (BASHH 2019); clotrimazole 1% or 2% cream to the vulva for external symptoms. <b>Pregnancy: topical imidazole for 7 days; avoid oral fluconazole (BNF)</b>"],
         ["<b>Severe VVC</b>","Fluconazole 150 mg, two doses 72 hours apart (BASHH 2019). Immunosuppression or a non-albicans species: culture and specialist advice"],
         ["<b>Recurrent VVC (4 or more in 12 months)</b>","Examine and confirm microbiologically first (at least two episodes, with speciation). For confirmed susceptible <i>C. albicans</i>: fluconazole 150 mg every 72 hours × 3 doses (induction), then 150 mg weekly for 6 months (maintenance) (BASHH 2019). Check pregnancy status, drug interactions and liver disease; explain that maintenance is suppressive rather than reliably curative; obtain culture if symptoms break through treatment. Treat a partner only if symptomatic (for example balanitis). Avoid soap and shower gel on the vulva, and tight synthetic underwear. A water-based lubricant reduces friction during intercourse"],
         ["<b>Non-albicans (for example C. glabrata) or azole-resistant</b>","Do not keep prescribing fluconazole; refer or seek specialist advice, as non-albicans candidiasis often needs specialist-directed treatment. Specialist options (BASHH 2019) include nystatin pessaries and boric acid pessaries (unlicensed; intravaginal only) — GUM or gynaecology initiation"],
         ["<b>Genital herpes — first episode</b>","Aciclovir 400 mg three times daily for 5 days, or valaciclovir 500 mg twice daily for 5 days (BASHH HSV 2024; BNF), started within 5 days of onset or while new lesions are still forming. Analgesia (paracetamol, ibuprofen). Local measures: saline bathing, passing urine in a warm bath if dysuria is severe, topical lidocaine; assess for urinary retention"],
         ["<b>Genital herpes — recurrent and suppressive</b>","Episodic: aciclovir 800 mg three times daily for 2 days (BASHH HSV 2024), or 200 mg five times daily for 5 days (BNF). Suppression for frequent recurrences: aciclovir 400 mg twice daily, reviewed after about a year. Counselling: telling partners, condoms reduce but do not abolish transmission, and the pregnancy implications below"],
         ["<b>Bartholin abscess</b>","Drainage with a Word catheter where local skills and equipment allow, or gynaecology: under local anaesthetic, a small stab incision on the inner (mucosal) aspect of the abscess, drain, insert the catheter and inflate the balloon with 2–3 mL of water; it stays in for about 4 weeks to allow a new duct to form. Culture the pus and screen for gonorrhoea and chlamydia in sexually active women. Antibiotics are not routinely required after adequate drainage — only if there is cellulitis, systemic illness or a specific STI or other indication (for example co-amoxiclav 500/125 mg three times daily, BNF). Refer if severe, recurrent, atypical or in a woman aged 40 or over. Recurrence: marsupialisation"]
       ]},
       {b:"why", html:"Recurrent vulvovaginal candidiasis needs systematic investigation — confirming the diagnosis microbiologically, identifying the species, and excluding predisposing conditions — before long-term maintenance therapy. The commonest error is repeated short courses of fluconazole without ever confirming the species; <i>C. glabrata</i> is inherently less susceptible to fluconazole, so women who fail standard treatment should have the species confirmed, and non-albicans candidiasis often needs specialist-directed treatment. BASHH (2019) recommends induction with fluconazole 150 mg every 72 hours for 3 doses, then 150 mg weekly for 6 months, based on Sobel et al. (NEJM 2004), where most women stayed free of symptomatic episodes during treatment but relapse was common after stopping — discuss this at the outset."},
       {b:"why", html:"Word catheter drainage of a Bartholin abscess can be done as an outpatient procedure and can avoid theatre and admission. The principles: adequate local anaesthetic infiltration; a stab incision on the inner, mucosal aspect of the labium minus at the 4 or 8 o'clock position rather than the outer skin, which avoids visible scarring; drainage of the abscess contents; insertion of the catheter and inflation of the balloon; and the catheter tip tucked into the vagina for comfort. It stays for about 4 weeks while a permanent new duct epithelialises, and the patient can continue normal activities with it in place. Where the GP does not have the training or equipment, same-day gynaecology is the route."}
     ]},

    {id:"lifestyle", nav:"Self-care", title:"Vulvar hygiene, self-care and sexual wellbeing",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"\u{1F9FC} Hygiene — the less-is-more principle", html:"Avoid all soap, shower gel, bubble bath, deodorant, antiseptic and feminine wipes on the vulva — alkaline and fragranced products disrupt the vulval skin barrier. Wash with plain warm water only, or an unfragranced emollient as a soap substitute, and pat dry. Never douche. Unscented cotton pads; loose cotton underwear; <b>go without underwear in bed where possible</b> to reduce heat and moisture.", src:"BASHH vulval conditions (2024) · BAD 2018"},
         {tone:"amber", h:"⚠️ Irritants and allergens", html:"Common vulval irritants and allergens: fragrances (the commonest allergen), rubber accelerators (latex condoms), propylene glycol (in many topical preparations and lubricants), lanolin, tea tree oil, and topical anaesthetics such as benzocaine — avoid prolonged use of over-the-counter anaesthetic creams. Patch testing by a dermatologist identifies specific allergens in refractory vulval dermatitis.", src:"BASHH vulval conditions (2024)"},
         {tone:"blue", h:"\u{1F4A7} Lubricants", html:"Water-based lubricants are suitable for all vulval conditions and for latex condoms. Oil-based products (coconut oil, petroleum jelly, baby oil) degrade latex condoms. Silicone-based are long-lasting and condom-compatible but not for use with silicone toys. Avoid warming, flavoured and sugary lubricants, which irritate and may encourage candida in susceptible women.", src:"FSRH Barrier Methods for Contraception and STI Prevention (2012, amended 2015) — condom compatibility"},
         {tone:"green", h:"\u{1F9D8} Pelvic floor physiotherapy and self-help", html:"NHS referral via the GP or specialist for vestibulodynia and vulvodynia. While awaiting the appointment: gentle desensitisation and perineal massage as taught by the physiotherapist. Vaginal dilators for significant introital narrowing (LS or LP related) or vaginismus — a graded set used progressively over weeks to months. Avoid aggressive or painful dilation, which can worsen pain sensitisation.", src:"BASHH vulval conditions (2024)"},
         {tone:"cream", h:"\u{1F338} Lichen sclerosus — patient education", html:"LS is a long-term condition needing long-term treatment — stopping clobetasol usually leads to symptom recurrence. LS UK, the lichen sclerosus patient charity, provides support and information (check the current web address). Regular review: symptoms, examination for new lesions, and documentation of architectural change. Treatment may reduce, but does not remove, the small cancer risk, so self-examine regularly. Seek urgent review for any new lump, bleeding, ulcer or rapid change in appearance.", src:"BAD 2018"},
         {tone:"cream", h:"\u{1F930} Pregnancy", html:"Candida: topical imidazole for 7 days; avoid oral fluconazole (BNF). LS: continue the maintenance steroid. HSV: a first episode of genital HSV in late pregnancy requires urgent obstetric and sexual-health advice. Antiviral treatment, suppressive therapy and delivery planning should follow the current BASHH/RCOG pregnancy guideline (2024); planned caesarean birth is not automatic for every third-trimester first episode — it depends on timing, lesion status, viral shedding risk and obstetric assessment.", src:"BASHH/RCOG HSV in pregnancy (2024) · BNF · BAD 2018"},
         {tone:"blue", h:"\u{1F9E0} Psychosexual support", html:"Chronic vulval pain and lichen sclerosus affect sexual function and self-image. Refer to a psychosexual therapist (COSRT-registered) for vestibulodynia with secondary vaginismus, relationship distress, or anxiety and depression related to chronic vulval pain; Relate for couple therapy. Ask about mood at chronic vulval condition reviews (PHQ-9 and GAD-7 help) — depression and anxiety are common comorbidities.", src:"BASHH vulval conditions (2024)"},
         {tone:"green", h:"\u{1F5E3}️ Ask menopausal women directly", html:"GSM is common and under-treated. Unlike hot flushes it does not settle with time, and tends to worsen without treatment. Ask proactively: <em>“Some women notice vaginal dryness, discomfort, or pain with sex after the menopause — is this something you've experienced?”</em> Reassure that GSM is treatable and that vaginal oestrogen has generally low systemic absorption; for women with current or previous breast cancer, particularly on aromatase inhibitors, discuss with the oncology and menopause teams.", src:"NICE NG23"}
       ]}
     ]},

    {id:"monitor", nav:"Surveillance", title:"Follow-up, surveillance and safety-netting",
     blocks:[
       {b:"table", head:["Group","Follow-up"], rows:[
         ["<b>Lichen sclerosus — review</b>","Review after the 3-month induction, then long term (at least annually for most, per local arrangements): symptom control, architectural change (labial fusion, phimosis, introital stenosis — photograph or describe for comparison), and any new lesion (ulcer, nodule, new redness or thickening). Biopsy or refer if there is a persistent or suspicious new lesion, symptoms poorly controlled despite adequate clobetasol, or any clinical concern"],
         ["<b>Vulvodynia review</b>","At 3 months: pain score, sexual function, tolerability of any individualised medicine, pelvic floor physiotherapy attendance. At 6 months with minimal improvement: specialist vulval clinic. Significant depression or anxiety: NHS Talking Therapies"],
         ["<b>Recurrent candida review</b>","At completion of 6 months' maintenance: recheck symptoms, and repeat culture if there were breakthrough episodes. On stopping, explain that relapse is common and agree a plan (swab while symptomatic, restart if confirmed). If a non-albicans species or azole resistance is confirmed: seek specialist advice or refer"],
         ["<b>GSM</b>","Review at 3 months, then annually: symptom response and prescription renewal. Continue for as long as needed — symptoms commonly return after stopping (NICE NG23). Unexpected bleeding on vaginal oestrogen needs assessment"],
         ["<b>Re-assess rather than repeat-prescribe</b>","Re-assess any symptom not improving with first-line care rather than repeat-prescribing antifungals or steroids blindly. Review lichen sclerosus response and watch for thickened or ulcerated change"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"\u{1F534} Return urgently", html:"A new vulval ulcer, lump or bleeding — especially after the menopause — or an irregular pigmented lesion → suspected cancer route · LS with a persistent or suspicious new erosion, ulcer, lump, induration, thickening, bleeding or colour change → biopsy or urgent referral · a hot, rapidly enlarging, very painful swelling or fever → same-day review.", src:"NICE NG12 (updated April 2026) · BAD 2018"},
         {tone:"amber", h:"\u{1F7E0} Within days", html:"Bartholin abscess (urgent drainage) · Bartholin mass at 40 or over (urgent gynaecology) · suspected first-episode herpes in late pregnancy (urgent obstetric and sexual-health advice) · recurrent VVC with a non-albicans species identified (GUM or specialist).", src:"BASHH/RCOG HSV in pregnancy (2024) · BASHH 2019"},
         {tone:"blue", h:"\u{1F50D} The governing rule", html:"<b>Always examine a persistent vulval symptom.</b> Examine, then refer or biopsy suspicious or treatment-resistant lesions; an unexplained lump, ulceration or bleeding prompts consideration of an NG12 suspected cancer referral.", src:"NICE NG12 (updated April 2026) · BASHH vulval conditions (2024)"},
         {tone:"green", h:"\u{1F6AD} Smoking", html:"<b>Offer smoking cessation</b> — smoking is a risk factor for HPV-related VIN and vulval cancer.", src:"BASHH vulval conditions (2024)"}
       ]},
       {b:"why", html:"Documenting lichen sclerosus architectural change at review protects both the patient and the GP — progressive fusion of the labia minora, clitoral phimosis or introital narrowing that is not documented or acted upon is a missed opportunity to prevent irreversible damage. Serial clinical photographs, with consent, allow year-on-year comparison and justify escalating treatment or referring when progression is documented. Without photography, a detailed written description gives a baseline — for example, <em>“bilateral labia minora reduced to about half of normal size, clitoral hood beginning to adhere to the glans, introitus admits two fingers”</em>."},
       {b:"say", html:"Before I give you anything, I want to look — that matters more than it sounds, because vulval symptoms that keep coming back are often not thrush, and treating blind is how the important things get missed. If this is the white, shiny skin change I suspect, the treatment is a strong steroid ointment, not an antifungal. Two things about that ointment: use enough to cover all the affected skin in a thin layer — as a rough guide, a small tube lasts around three months — and it does not thin the skin, it repairs it; it is the condition itself that does the thinning. It is a long-term condition, so we keep going with a small maintenance amount, and I will see you regularly to check the skin and make sure nothing new has appeared."}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways",
     blocks:[
       {b:"cards", items:[
         {tone:"purple", h:"Suspected cancer · NICE NG12 (updated April 2026)", html:"<b>Unexplained vulval lump, ulceration or bleeding → consider a suspected cancer pathway referral (for an appointment within 2 weeks) for vulval cancer.</b> NG12 is not a rule for every persistent vulval symptom. Biopsy or urgent specialist referral for: persistent ulceration · indurated or thickened lesion · suspicious pigmented lesion · persistent or suspicious new lesion in lichen sclerosus · lichen planus with progressive destruction · lesion persisting despite appropriate treatment. A postmenopausal woman with persistent unexplained vulval symptoms: examine, with a low threshold for specialist referral. An irregular pigmented lesion → suspected melanoma route.", src:"NICE NG12 (updated April 2026)"},
         {tone:"amber", h:"Gynaecology (urgent)", html:"Bartholin abscess needing drainage or marsupialisation, or that is severe, recurrent or atypical · Bartholin mass in a woman aged 40 or over, particularly if solid, irregular, fixed or recurrent (consider biopsy or excision) · suspected LP or LS needing diagnostic biopsy · suspected VIN.", src:"BASHH vulval conditions (2024)"},
         {tone:"amber", h:"GUM / sexual health (urgent)", html:"Suspected STI (first-episode HSV, gonorrhoea, syphilis, chancroid) · recurrent HSV needing suppressive therapy · partner notification.", src:"BASHH HSV (2024)"},
         {tone:"blue", h:"Specialist vulval clinic / dermatology", html:"Vulvodynia or vestibulodynia that is persistent or severe (specialist vulval or pain service) · suspected erosive vulvovaginal lichen planus, especially with vaginal involvement, scarring or adhesions, persistent erosions, oral or gingival disease · refractory lichen sclerosus · psoriasis with significant vulval involvement · diagnosis uncertain after initial assessment.", src:"BAD 2018 · BASHH vulval conditions (2024)"},
         {tone:"green", h:"Pelvic floor physiotherapy", html:"Vestibulodynia with pelvic floor overactivity · vaginismus · dyspareunia from pelvic floor dysfunction.", src:"BASHH vulval conditions (2024)"},
         {tone:"cream", h:"GP management", html:"Uncomplicated candida: clotrimazole pessary or fluconazole 150 mg orally. GSM: vaginal oestrogen. Confirmed LS: clobetasol 0.05% ointment, 3-month induction then individualised maintenance. Bartholin abscess: drainage. Contact dermatitis: remove the irritant plus hydrocortisone 1% and an emollient. HSV recurrence: aciclovir 800 mg three times daily for 2 days.", src:"BASHH 2019 · BAD 2018 · BASHH HSV (2024) · BNF"}
       ]},
       {b:"why", html:"The specialist vulval clinic is an underused resource — a multidisciplinary clinic typically led by a dermatologist or gynaecologist with an interest in vulval disease, sometimes supported by a pelvic floor physiotherapist and specialist nurse. These clinics provide biopsy, treatment of lichen sclerosus and planus, management of vulvodynia, and liaison with psychosexual therapy. Many women with chronic vulval conditions are managed in primary care for years with repeated antifungals or steroid creams without an adequate examination, biopsy or specialist input. Keep a low threshold for referral for any vulval condition that has not been clearly diagnosed, or is not responding to appropriate treatment within 3 months."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 64-year-old has had vulval itch for over a year, worst at night, and has had four courses of clotrimazole — two of them issued by phone. She now finds intercourse painful and has noticed “the skin looks pale”. She has never been examined for this. She asks for “something stronger for the thrush”.", src:"BAD 2018 · BASHH vulval conditions (2024)"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Examines rather than re-prescribing, and names why: blind antifungal prescribing is how vulval cancer is missed; recognises white atrophic figure-of-eight change as lichen sclerosus, not candida; prescribes clobetasol 0.05% with the induction-then-maintenance regimen AND a practical quantity instruction (a thin layer to all affected skin; a 30 g tube lasting about 3 months); addresses the steroid-thinning fear correctly — adequate treatment restores the skin; arranges long-term review with documented architectural change and states the small (under 5%) SCC risk; treats coexisting <b>GSM with vaginal oestrogen</b> rather than attributing dyspareunia to LS alone; and — the step candidates miss — sets the explicit rule that anything not settling with treatment gets biopsied or referred rather than another cream.", src:"BAD 2018 · NICE NG12 (updated April 2026) · NICE NG23"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>British Association of Dermatologists — guidelines for the management of lichen sclerosus (2018)</b>. Lewis FM et al. Br J Dermatol 2018<br><a href="https://www.bad.org.uk/guidelines-and-standards/clinical-guidelines/" rel="noopener">bad.org.uk</a><span class="rd"> — clobetasol propionate 0.05% 3-month reducing induction and maintenance, a 30 g tube lasting about 3 months, lifetime SCC risk under 5%, long-term follow-up and biopsy of new lesions</span></li>'+
         '<li><b>BASHH — 2024 UK national guideline on the management of vulval conditions</b>. Int J STD AIDS 2025<br><a href="https://journals.sagepub.com/doi/10.1177/09564624241311629" rel="noopener">journals.sagepub.com</a><span class="rd"> — examination and biopsy of persistent vulval disease, lichen planus and lichen simplex, vulvodynia as multifactorial with individualised management, irritant avoidance</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (2015, updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — vulval cancer: consider a suspected cancer pathway referral for an unexplained vulval lump, ulceration or bleeding; and the suspected melanoma route for a pigmented lesion</span></li>'+
         '<li><b>BASHH — UK national guideline for the management of vulvovaginal candidiasis (2019)</b>. Saxon C et al. Int J STD AIDS 2020<br><a href="https://journals.sagepub.com/doi/10.1177/0956462420943034" rel="noopener">journals.sagepub.com</a><span class="rd"> — the RVVC definition, acute and severe treatment, fluconazole induction then weekly maintenance for 6 months, and non-albicans management; based on Sobel JD et al., NEJM 2004;351:876–83</span></li>'+
         '<li><b>BASHH — UK national guideline for the management of anogenital herpes (2024)</b>. Patel R et al. Int J STD AIDS 2025<br><a href="https://journals.sagepub.com/doi/10.1177/09564624241282396" rel="noopener">journals.sagepub.com</a><span class="rd"> — first-episode, episodic and suppressive aciclovir and valaciclovir regimens</span></li>'+
         '<li><b>BASHH/RCOG — national UK guideline for the management of HSV in pregnancy and the neonate (2024 update)</b>. Clarke E et al. Int J STD AIDS 2025<br><a href="https://journals.sagepub.com/doi/10.1177/09564624241280734" rel="noopener">journals.sagepub.com</a><span class="rd"> — consider planned caesarean birth for a first episode in the third trimester, particularly within 6 weeks of delivery, with aciclovir 400 mg three times daily until delivery; suppressive aciclovir 400 mg three times daily from 36 weeks for recurrent HSV</span></li>'+
         '<li><b>NICE NG23 — Menopause: identification and management (2015, updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng23" rel="noopener">nice.org.uk/guidance/ng23</a><span class="rd"> — vaginal oestrogen for urogenital atrophy, continued long term; specialist discussion after breast cancer</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — clobetasol, hydrocortisone, clotrimazole, fluconazole (avoid in pregnancy), aciclovir, valaciclovir, co-amoxiclav, amitriptyline, lidocaine, estradiol and estriol; and the Vagifem, Ovestin and ospemifene SPCs (medicines.org.uk)</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Vulvar disorders — BAD lichen sclerosus guideline (2018), BASHH vulval conditions (2024), BASHH VVC (2019), BASHH HSV (2024), BASHH/RCOG HSV in pregnancy (2024), NICE NG12 (updated April 2026), NICE NG23 and the BNF. Always examine a persistent vulval symptom: suspicious or treatment-resistant lesions need biopsy or referral, an unexplained lump, ulceration or bleeding prompts consideration of NG12 referral, and repeated blind antifungal prescribing delays diagnosis. This page replaces the former pruritus vulvae card. Verify all doses against the current BNF before prescribing."
});
