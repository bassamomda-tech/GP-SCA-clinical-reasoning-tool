MG.render({

  stemTitle:"Diagnosis and routine antiseizure medication initiation are normally specialist-led — but recognising the seizure, the urgent referral, the DVLA advice, individualised SUDEP counselling, valproate and topiramate safety and the contraception interactions are all part of the GP role",
  stemSub:"One page for the whole condition: identify a suspected seizure, exclude immediate mimics and emergencies, refer every first suspected seizure urgently to a clinician with expertise in first seizures and epilepsy within 2 weeks, give DVLA advice that runs from the date of the seizure rather than the date of the appointment, discuss SUDEP risk proportionately with the people it applies to, know the prescribing rules that cause the most harm (valproate and topiramate reproductive safety, and carbamazepine or phenytoin in absence or myoclonic seizures), and get the individual rescue plan and seizure first aid in place before the specialist is ever seen.",
  guideline:"NICE NG217 (2022, updated August 2026) · DVLA Assessing fitness to drive · MHRA valproate safety measures (2018, updated 2024) · MHRA topiramate Pregnancy Prevention Programme (2024) · FSRH drug interactions with hormonal contraception · GMC confidentiality guidance · BNF and local shared-care protocols",

    {t:"NICE NG217 — Epilepsies in children, young people and adults (2022, updated August 2026)"},

  ],
  lead:'<div class="mg-layers"><a href="#severe"><b>Emergency</b><small>Status · 5-minute rule</small></a><a href="#confirm"><b>Characterise</b><small>Witness · semiology</small></a><a href="#workup"><b>Investigate</b><small>2 weeks · local pathway</small></a><a href="#ladder"><b>AEDs</b><small>Specialist starts, GP monitors</small></a><a href="#monitor"><b>DVLA &amp; SUDEP</b><small>Legal · individualised</small></a></div>',
  quickSub:"If you read nothing else on this page, read these six cards. Every number traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Diagnosis and routine AED initiation are normally specialist-led", html:"The GP identifies a suspected seizure, excludes immediate mimics and emergencies, arranges specialist assessment within 2 weeks and provides interim safety advice. Every first suspected seizure is referred urgently to a clinician with expertise in first seizures and epilepsy (NICE NG217). <b>Do not delay urgent referral while arranging tests</b>: ECG and metabolic blood tests belong in the initial assessment; EEG and MRI should usually be coordinated through the first-seizure/epilepsy service, although local pathways may allow direct requesting. A normal EEG or CT does not exclude epilepsy, but MRI is not automatically required after a single suspected seizure."},
    {tone:"red", h:"DVLA runs from the date of the seizure, not today", html:"The patient must stop driving immediately after a suspected seizure, notify the DVLA and check the current DVLA rules. The qualifying period runs from the DATE of the seizure, but the exact restriction depends on the seizure circumstances (first isolated seizure or epilepsy, provoked or unprovoked, sleep-only, medication withdrawal, investigation findings) and the licence group — do not present one fixed rule as applying to every first seizure. As a guide only: after a first isolated unprovoked seizure, Group 1 (car, motorcycle) is generally 6 months, or 12 months if recurrence risk is increased, and Group 2 (HGV, bus, PSV) is generally 5 years seizure-free off medication; established epilepsy usually requires 12 months seizure-free (Group 1) and 10 years seizure-free off medication (Group 2). If they continue to drive, follow the GMC confidentiality framework (see Driving below). <b>Document the seizure date, the advice given, and whether the patient agrees to stop driving.</b>"},
    {tone:"amber", h:"The prescribing rules that cause the most harm", html:"Do not use carbamazepine, oxcarbazepine or phenytoin for absence or myoclonic seizures (including JME) unless specifically directed by an epilepsy specialist — they can worsen them. <b>Do not initiate sodium valproate in anyone under 55, male or female,</b> unless two specialists independently agree and document that no other effective and tolerated treatment is suitable, or that reproductive risks do not apply; women and girls who could become pregnant need the Pregnancy Prevention Programme, and men need reproductive-risk counselling. <b>Topiramate also has a Pregnancy Prevention Programme.</b> The GP does not independently initiate or switch these drugs. <b>And never stop an AED abruptly</b> — rebound seizures, with driving implications."},
    {tone:"blue", h:"Contraception and AEDs interact both ways", html:"Combined hormonal contraception can substantially reduce lamotrigine levels, particularly during active-pill use — a cause of breakthrough seizures — and levels may rise during the hormone-free interval or when it is stopped. This needs specialist dose and monitoring advice; serum-level monitoring is not routinely required in every patient. Enzyme-inducing AEDs (carbamazepine, phenytoin, phenobarbital, primidone, oxcarbazepine, topiramate at higher doses) can reduce the effectiveness of combined hormonal contraception, the implant and oral progestogen-only pills; depot medroxyprogesterone acetate, the LNG-IUS and the copper IUD are generally unaffected. <b>Before any AED is started or changed, document current contraception and pregnancy intentions</b>, and follow current FSRH guidance."},
    {tone:"amber", h:"SUDEP: individualised counselling, not a fixed script", html:"Explain that SUDEP is uncommon but risk is higher with uncontrolled generalised tonic-clonic or nocturnal seizures. NICE NG217 recommends discussing SUDEP risk with people who have seizures during sleep, including families and carers where appropriate. Discuss it proportionately where epilepsy is confirmed — particularly with generalised tonic-clonic or nocturnal seizures, uncontrolled seizures, poor adherence, or where the patient or family is concerned — rather than as a detailed risk script after every single possible seizure. Risk factors include nocturnal seizures, sleeping arrangements (prone or alone), alcohol and missed medication. <b>The most effective risk-reduction measures are seizure control, adherence, avoiding missed medication and appropriate night-time safety measures.</b>"},
    {tone:"green", h:"The 5-minute rule is what carers need", html:"Convulsive status epilepticus is a convulsive seizure lasting 5 minutes or more, or repeated seizures without recovery between them. Call 999 and give the patient's prescribed buccal midazolam or rectal diazepam according to the individual emergency plan, using the product-specific, age/weight-based dose — there is no universal dose. Do not repeat doses unless specifically directed by the plan or local protocol. <b>Time it, protect from injury, recovery position once convulsions stop, nothing in the mouth, do not restrain.</b>"}
  ],
  pathwaySub:"The whole consultation in five moves. Every one of them is the GP's job.",
  pathway:[
    {title:"Treat the emergency", html:"Convulsive seizure lasting 5 minutes or more, or repeated seizures without recovery → status epilepticus: <b>call 999</b> and give prescribed rescue medication per the individual plan and age/weight-based dose. Also 999 for persistent impaired consciousness, airway or breathing compromise, significant injury, meningism, new focal deficit, suspected intracranial haemorrhage, any seizure in pregnancy or postpartum, or severe hypoglycaemia or other major metabolic disturbance.", alert:true},
    {title:"Characterise the event", html:"Two narratives: what the patient remembers (prodrome, aura, partial recall) and what the witness saw (semiology, duration, post-ictal state). Hunt the provoking factors — <b>sleep deprivation, alcohol, missed meals, illness, missed doses</b> — and ask about prior morning myoclonus. Examine the patient."},
    {title:"Refer urgently, and follow the local pathway", html:"<b>Clinician with expertise in first seizures and epilepsy, within 2 weeks.</b> Do the <b>12-lead ECG and clinically indicated blood tests</b>. Arrange EEG or imaging through the local first-seizure pathway and never let it delay the referral; urgent imaging if there are structural red flags. Do not start or stop an AED without specialist advice (except rescue treatment under a prescribed plan), and do not use a normal EEG or CT to reassure. Occupational health where the job carries risk."},
    {title:"Give the information only you can give today", html:"Stop driving now, notify the DVLA and check the current DVLA guidance · SUDEP where relevant · seizure first aid for the household · contraception and pregnancy intentions before the specialist chooses · trigger avoidance · water, heights and cooking safety."},
    {title:"Then hold the long-term shared care", html:"AED prescriptions under shared care, side-effect and interaction monitoring, valproate and topiramate reproductive-safety checks under shared care, adherence, annual review, and preconception advice including folic acid 5 mg for women with epilepsy who may become pregnant."}
  ],
  sections:[

    {id:"severe", nav:"Emergency", title:"Status epilepticus and the first-seizure emergency",
     sub:"Most seizures stop by themselves. These are the ones that do not, and the ones that are not epilepsy.",
     blocks:[
       {b:"table", head:["Presentation","Meaning","Action"], rows:[
         ["Convulsive seizure lasting 5 minutes or more, or repeated seizures without recovery between them","<b>Status epilepticus</b> — a medical emergency with rising mortality and neuronal injury the longer it continues","<b>999.</b> Give the prescribed buccal midazolam or rectal diazepam according to the individual emergency plan, using the product-specific, age/weight-based dose; do not delay emergency transfer while waiting to see whether it works. Benzodiazepines cause respiratory depression — do not repeat doses unless specifically directed by the plan or local protocol. Hospital treatment follows the local status epilepticus protocol"],
         ["<b>Seizure cluster — the pattern defined in the individual's rescue plan, or a clear increase from their usual seizure frequency</b>","<b>Risk of progression to status.</b> Hunt the trigger: non-adherence, sleep deprivation, alcohol, intercurrent illness, a missed dose","<b>Follow the rescue plan; urgent clinical advice — 999 if seizures are prolonged, occur without recovery, or come with injury or breathing difficulty</b>"],
         ["<b>First seizure with fever, neck stiffness or photophobia</b>","<b>CNS infection — meningitis or encephalitis</b>","<b>999</b>"],
         ["First seizure with significant head injury, new focal neurological deficit, persistent impaired consciousness or failure to return to baseline — or in a person on anticoagulation, with known cancer or immunosuppression","Structural intracranial cause — haemorrhage, tumour, stroke. Look for papilloedema and other features of raised ICP","<b>999 — emergency CT may be needed immediately</b>"],
         ["<b>Any seizure during pregnancy or postpartum</b>","<b>Obstetric emergency. Presume eclampsia until excluded, particularly from 20 weeks' gestation or postpartum and with hypertension, headache, visual symptoms or other pre-eclampsia features — but other causes also need urgent assessment</b>","<b>999, obstetric emergency</b>"],
         ["<b>Airway or breathing compromise, significant injury, or severe hypoglycaemia or other major metabolic disturbance</b>","<b>Immediate threat to life, or a reversible provoking cause</b>","<b>999</b>"],
         ["<b>New seizure in an older adult, or with progressive focal deficit</b>","<b>Structural lesion including tumour</b>","<b>Urgent neurological/neuroimaging assessment per local pathway — may be an emergency; see the note below</b>"]
       ]},
       {b:"why", html:"The 5-minute rule is the single most important thing to teach a household. The instruction set is short and should be given verbally and in writing: time the seizure from onset; protect the head; recovery position once the convulsions stop; do NOT restrain; do NOT put anything in the mouth; remove nearby hazards; stay with the person throughout. Do not give food, drink or oral medication until the person is fully alert. Call 999 if the seizure lasts 5 minutes or more, another seizure follows before recovery, breathing does not recover, the person does not regain consciousness within 10 minutes, there is a significant injury, or it is a first seizure. A trained carer gives the prescribed rescue medication at 5 minutes, or earlier if the individual plan says so, and calls 999 if there is no response within the plan's specified period. A GP or ambulance clinician calls emergency services promptly when status is suspected and does not delay transfer while waiting to see whether rescue medication works. After a first seizure, emergency assessment is usually required, particularly if the diagnosis is uncertain or there are red flags — a person with injury, persistent confusion, a recurrent seizure or an abnormal examination should not wait at home for the 2-week clinic. Rescue medication (buccal midazolam or rectal diazepam) is prescribed as part of an individualised emergency plan agreed with the specialist — product, age/weight-based dose, and whether a second dose is authorised — with carers trained; it is not routinely prescribed after a single first seizure without recurrence risk factors."},
       {b:"dl", rows:[
         ["<b>NG12 stated honestly</b>","Epilepsy itself has no NICE NG12 suspected-cancer criterion, and none should be invented for one — a first seizure is a 2-week epilepsy specialist referral under NG217, which is a different pathway from a suspected cancer referral. The NG12 adjacency that matters: where the picture is a progressive, sub-acute loss of central neurological function, NG12 advises an urgent direct-access MRI brain (or CT if MRI is contraindicated) within 2 weeks to assess for brain or CNS cancer. So if a first seizure comes with progressive focal neurological deficit, personality or cognitive change, persistent or progressive headache or other concern for an intracranial structural lesion, arrange urgent neurological/neuroimaging assessment according to local pathways — do not rely on the routine first-seizure pathway alone. Papilloedema (suspected raised intracranial pressure) needs same-day emergency assessment. The urgency may be emergency rather than a 2-week pathway, and not every new seizure with headache needs an NG12 cancer referral. Restated in <a href='#refer'>Refer</a>"]
       ]}
     ]},

    {id:"confirm", nav:"Characterise", title:"Characterise the event — the witness account is the diagnosis",
     sub:"The GP contribution to the specialist's diagnosis is a good history. It cannot be reconstructed later.",
     blocks:[
       {b:"dl", rows:[
         ["<b>Two narratives, both needed</b>","<b>What the patient remembers</b> — prodrome, aura, the last thing recalled, partial awareness. <b>What the witness saw</b> — onset (focal or generalised), semiology (tonic, clonic, automatisms, head turning), <b>duration</b>, tongue biting (lateral is suggestive), incontinence, colour, and the <b>post-ictal state</b> and its length. <b>Contact the witness directly if possible</b>"],
         ["<b>Provoking factors</b>","<b>Sleep deprivation (the most potent trigger in idiopathic generalised epilepsy, especially JME), alcohol, missed meals, intercurrent illness or fever, missed AED doses, recreational stimulants (cocaine, amphetamine, MDMA), <b>prescribed drugs that lower the seizure threshold (tramadol, bupropion, quinolone antibiotics, mefloquine, an antipsychotic — especially clozapine — lithium, ciclosporin)</b>, benzodiazepine or alcohol withdrawal, and photosensitivity (3–5% of epilepsy).</b> A provoked seizure is not the same as epilepsy — but the patient must still stop driving and check the current DVLA rules, which differ for provoked seizures"],
         ["<b>Ask specifically about prior events</b>","Morning myoclonic jerks (dropping the cereal bowl) suggest juvenile myoclonic epilepsy and are almost never volunteered. Also brief absences, déjà vu, epigastric rising sensations, and previous unexplained falls or nocturnal tongue biting"],
         ["<b>The differential for transient loss of consciousness</b>","<b>Syncope</b> (prodromal pallor, sweating, tunnel vision; postural or situational trigger, postural hypotension; rapid recovery; brief myoclonic jerks are common and do NOT mean epilepsy), <b>cardiac arrhythmia</b> (exertional, no prodrome, ECG), <b>non-epileptic attack disorder</b>, hypoglycaemia, TIA, and parasomnia or non-REM arousal disorder in nocturnal events. The undifferentiated presentation is covered by the <a href='../algorithms/fits-funny-turns.html'>fits and funny turns pathway</a>"],
         ["<b>Seizure classification (specialist confirms)</b>","<b>Focal</b> — aware or impaired awareness, with or without progression to bilateral tonic-clonic. <b>Generalised</b> — tonic-clonic, absence, myoclonic, atonic. <b>Syndromes:</b> juvenile myoclonic epilepsy, childhood absence epilepsy, and the focal epilepsies. <b>Classification drives AED choice, which is why the history matters.</b> Epilepsy is over-represented in learning disability and autism — where communication difficulty can mask both seizures and side effects, and safeguarding considerations may apply"]
       ]},
       {b:"dl", rows:[
         ["<b>Paediatric note — febrile seizures (follow the local paediatric pathway)</b>","Simple febrile seizure: under 15 minutes, generalised, resolves spontaneously, one episode in this illness. Reassurance: febrile seizures can recur, but most children do not develop epilepsy or have long-term neurological consequences. Complex features — focal, longer than 15 minutes, multiple within one illness, or post-ictal weakness — need assessment for CNS infection and paediatric neurology referral. Management: paracetamol or ibuprofen for comfort rather than to prevent recurrence, <b>999 if a seizure lasts 5 minutes or more, with rescue medication only under an individual plan</b>, and parent education for future episodes"]
       ]}
     ]},

    {id:"workup", nav:"Investigate", title:"Investigation and referral — assess, refer urgently, do not delay",
     blocks:[
       {b:"table", head:["Action","Detail"], rows:[
         ["<b>Urgent referral — within 2 weeks</b>","NICE NG217: refer every first suspected seizure urgently to a clinician with expertise in first seizures and diagnosing epilepsy, for review within 2 weeks. Do not delay the referral while arranging tests. The letter should carry: seizure type and duration from the witness account; prodrome and aura; post-ictal state; trigger factors; previous episodes including morning myoclonus; family history; medications, <b>current contraception and pregnancy intentions</b>; occupation; ECG and blood results; and the DVLA discussion outcome. Ask explicitly for advice on DVLA, AED initiation and pregnancy or contraception management"],
         ["<b>GP investigations</b>","An assessment of transient loss of consciousness and possible seizure — not confirmation of epilepsy. <b>12-lead ECG</b> in every case, because cardiac syncope can mimic epilepsy: assess rhythm, conduction disease, pre-excitation, Brugada pattern and long QT (QTc &gt;450 ms in men or &gt;470 ms in women), and ask about family history of sudden cardiac death and exertional or supine syncope. Capillary glucose; FBC, U&amp;E, calcium, magnesium and LFTs where a metabolic or systemic cause is suspected, guided by the presentation and the local first-seizure pathway. Hyponatraemia, hypocalcaemia, hypomagnesaemia and hypoglycaemia are all reversible provoking causes, and a first-degree relative with epilepsy raises the recurrence risk. Pregnancy test where relevant"],
         ["<b>Occupational health</b>","<b>Within 2–4 weeks where the job carries risk</b> — healthcare, driving, heights, machinery. Include duties and specific concerns; request a fitness-for-duty assessment and advice on temporary modification. Do not comment on professional registration — that is a professional body matter — and do not determine fitness for clinical duties unilaterally"],
         ["<b>EEG — through the local first-seizure pathway</b>","Do not request EEG as a reflex test for every blackout, and do not let EEG arrangements delay urgent specialist referral. NICE: consider EEG when the history suggests an epileptic seizure; it is usually coordinated by the first-seizure/epilepsy service, although local pathways may allow direct requesting. If requested after a first seizure, it should be performed as soon as possible, ideally within 72 hours; sleep-deprived or ambulatory EEG if uncertainty persists. <b>A normal EEG does not exclude epilepsy</b>"],
         ["<b>Imaging — CT acutely, MRI when indicated</b>","CT may be required immediately with red flags: persistent altered consciousness, focal deficit, significant head injury, anticoagulant use, fever or meningism, suspected intracranial haemorrhage or raised intracranial pressure. MRI is the preferred structural investigation once epilepsy is diagnosed (unless idiopathic generalised epilepsy or self-limited epilepsy with centrotemporal spikes) or a structural cause is suspected; CT where MRI is contraindicated. MRI is not automatically required after every single suspected seizure — it depends on specialist assessment and local imaging pathways"],
         ["<b>Do not start or stop an AED without specialist advice</b>","<b>Diagnosis and routine AED initiation are normally specialist-led (NG217)</b>, except emergency rescue treatment under a prescribed plan. NICE does not recommend routine treatment after every first unprovoked seizure; the specialist may start treatment in selected cases — neurological deficit, unequivocal epileptiform activity on EEG, structural brain abnormality, or unacceptable recurrence risk after shared decision-making"],
         ["<b>Do NOT reassure on the basis of a normal CT</b>","<b>A normal CT does not exclude epilepsy</b> — but MRI is not automatically required after a single suspected seizure (see Imaging)"],
         ["<b>Do NOT give vague DVLA advice, or fail to document it</b>","Document the seizure date, the advice given (stop driving, notify the DVLA, check the current DVLA guidance) and the patient's response"]
       ]},
       {b:"why", html:"The referral letter is the GP's main clinical contribution to the diagnosis. The specialist cannot re-take a witness history weeks later, and the classification — focal versus generalised, and specifically whether this is juvenile myoclonic epilepsy — determines the AED choice and therefore the pregnancy, contraception and driving consequences that follow. A letter that records \u201ccollapse ?seizure, please assess\u201d wastes the one piece of information only primary care could capture."}
     ]},

    {id:"ladder", nav:"AEDs", title:"Antiepileptic drugs — the specialist starts, the GP monitors",
     sub:"Shared care means the GP issues, monitors and counsels. That requires knowing the pharmacology.",
     blocks:[
       {b:"table", head:["Setting","First-line options (NICE NG217 — specialist-led; doses per specialist titration)"], rows:[
         ["<b>Focal epilepsy</b>","<b>Lamotrigine or levetiracetam — equal first-line.</b> <b>Lamotrigine:</b> broad-spectrum, safer in pregnancy, <b>must be titrated slowly (Stevens-Johnson risk with rapid escalation)</b> — rash, mucosal involvement or systemic symptoms need urgent assessment — and <b>combined hormonal contraception can substantially reduce its level</b>. <b>Levetiracetam:</b> faster titration, no significant interactions, <b>renally cleared (renal dosing per specialist advice and product information)</b>, but psychiatric effects — irritability, aggression, depression or suicidal ideation — which patients must be warned about. <b>Carbamazepine</b> causes <b>hyponatraemia through SIADH</b>, and dose-related <b>diplopia and ataxia</b>; it is effective in focal epilepsy but is an enzyme inducer, reduces hormonal contraceptive efficacy, and needs HLA-B*1502 testing before use in patients of East or South Asian ancestry"],
         ["<b>Generalised epilepsy (JME, GTCS, absence)</b>","<b>Medication choice must be syndrome-specific and specialist-led.</b> For generalised tonic-clonic seizures NICE offers a choice of lamotrigine, levetiracetam or sodium valproate, with the MHRA safety restrictions determining whether valproate can be used. Valproate may remain the most effective option for some generalised epilepsies, but carries <b>hepatotoxicity, pancreatitis, thrombocytopenia, tremor and weight gain</b> and is highly restricted (see below). <b>In JME, avoid carbamazepine and phenytoin; lamotrigine may aggravate myoclonus in some patients</b>, and levetiracetam may be preferred in some people. Do not substitute lamotrigine automatically for valproate without specialist review. <b>Ethosuximide is first-line for childhood absence epilepsy only</b> — not for GTCS; if GTCS coexists, the specialist reviews the choice"]
       ]},
       {b:"warn", html:"<b>Four rules that must not be broken.</b> <b>(1) Do not use carbamazepine, oxcarbazepine or phenytoin for absence or myoclonic seizures (including JME) unless specifically directed by an epilepsy specialist</b> — they can worsen them, and drug choice depends on the confirmed seizure type and syndrome. (2) Do not initiate sodium valproate in anyone under 55, male or female, unless the current MHRA/NICE criteria are met (two specialists independently agree); the GP does not independently initiate or switch valproate. Women and girls who could become pregnant need the Pregnancy Prevention Programme, men need reproductive-risk counselling, and topiramate has its own Pregnancy Prevention Programme. <b>(3) NEVER stop an AED abruptly</b> — rebound seizures follow, reduction must be a gradual specialist-supervised taper, and discontinuation is only considered after a long seizure-free period as a shared decision, and a seizure during withdrawal has driving implications. (4) HLA-B*1502 before carbamazepine in patients of East or South Asian ancestry — carriers have around a tenfold increased risk of Stevens-Johnson syndrome."},
       {b:"dl", rows:[
         ["<b>Valproate — current MHRA/NICE rules and shared care</b>","Do not initiate sodium valproate in anyone under 55 years unless the current MHRA/NICE criteria are met, including independent agreement by two specialists that no other effective and tolerated treatment is suitable, or that reproductive risks do not apply. The GP should not independently initiate or switch valproate. For women and girls who could become pregnant, comply with the Valproate Pregnancy Prevention Programme and current MHRA risk-acknowledgement documentation. For men, discuss potential reproductive risks and effective contraception in accordance with current MHRA guidance; men planning a family should discuss fertility and treatment risks with the specialist. <b>Shared-care responsibility:</b> at each relevant review confirm effective contraception and that the required specialist review and documentation are in place — do not assume annual paperwork is complete; if it is absent, do not continue prescribing without urgently contacting the epilepsy team and following local prescribing governance. <b>Check the patient carries the MHRA Valproate User Card.</b> Use the current MHRA safety materials to explain the risks. Do not stop valproate abruptly; urgent specialist advice is required if pregnancy is planned, suspected or confirmed, with folic acid 5 mg daily pre-conception"],
         ["<b>Topiramate — Pregnancy Prevention Programme</b>","Topiramate is subject to a Pregnancy Prevention Programme for women and girls who could become pregnant (MHRA 2024). It carries important fetal risks and should not be stopped abruptly in epilepsy. Review contraception, pregnancy intentions and specialist follow-up at each relevant medication review"],
         ["<b>Contraception and AED interactions</b>","Before starting or changing contraception or any AED, check the antiseizure medication, document current contraception and pregnancy intentions, and consult current FSRH/epilepsy interaction guidance or seek specialist, pharmacy or sexual-health advice. Enzyme-inducing AEDs — carbamazepine, phenytoin, phenobarbital, primidone, oxcarbazepine, topiramate at higher doses and some other specialist medicines — may reduce the effectiveness of combined hormonal contraception, the etonogestrel implant and oral progestogen-only pills. Depot medroxyprogesterone acetate, the LNG-IUS and the copper IUD are generally unaffected. Lamotrigine runs the other way: combined hormonal contraception can substantially reduce lamotrigine levels and seizure control, particularly during active-pill use, and levels may rise during the hormone-free interval or after stopping — this needs specialist dose and monitoring advice rather than an automatic dose change; serum-level monitoring is not routinely required in every patient"],
         ["<b>Epilepsy in pregnancy</b>","Discuss pregnancy intentions early. Women with epilepsy who may become pregnant should receive preconception advice, including folic acid 5 mg daily from before conception until 12 weeks' gestation, and specialist review of antiseizure treatment — do not stop AEDs abruptly. Lamotrigine is relatively safe in pregnancy — but its levels fall through increased renal clearance, so the specialist often needs to increase the dose to maintain control. Joint obstetric and neurology management. Valproate is teratogenic and carbamazepine carries a cleft palate risk; seizures in pregnancy carry their own risks — placental abruption, pre-eclampsia, fetal hypoxia, trauma from falls — so control matters more, not less"]
       ]},
       {b:"why", html:"The GP's prescribing role in epilepsy is issuing under shared care, monitoring side effects and interactions, managing adherence and reviewing annually — and every one of those requires understanding the pharmacology rather than simply reissuing. The two interactions that most often cause breakthrough seizures in practice are the COCP–lamotrigine interaction and enzyme-inducing AEDs undermining hormonal contraception, and both are usually discovered in primary care rather than in clinic. Around 70% of people with epilepsy achieve complete seizure control on medication — a figure worth saying out loud, because the prognosis patients imagine is usually far worse than the reality."}
     ]},

    {id:"monitor", nav:"DVLA &amp; SUDEP", title:"Driving, SUDEP and safety — the conversations only the GP will have",
     blocks:[
       {b:"table", head:["Domain","What to do"], rows:[
         ["<b>DVLA — Group 1 (car, motorcycle)</b>","The patient <b>stops driving immediately</b> after a suspected seizure and notifies the DVLA themselves at gov.uk. The period runs <b>from the DATE of the seizure</b>, but the exact restriction depends on first isolated seizure or epilepsy, provoked or unprovoked, sleep-only seizures, seizures during medication withdrawal, seizures that do not impair consciousness, and relevant investigation findings — <b>give the current DVLA guidance rather than a single fixed rule</b>. As a guide only: a first isolated unprovoked seizure is generally 6 months off driving, increasing to 12 months if there are factors indicating increased recurrence risk; established epilepsy usually requires 12 months seizure-free. The DVLA then writes to the GP and specialist for medical evidence before reinstatement"],
         ["<b>DVLA — Group 2 (HGV, bus, PSV)</b>","First isolated unprovoked seizure: generally 5 years seizure-free and off antiseizure medication, with specialist assessment and other criteria. Epilepsy: usually 10 years seizure-free without medication. Sleep-only seizures and other circumstances differ — always check the current DVLA guidance"],
         ["<b>If the patient keeps driving</b>","Follow GMC confidentiality guidance: advise the patient to notify the DVLA; explain the risk and that they must stop; explain that you may disclose information if they continue to drive when unsafe, and attempt to obtain consent where practicable; if necessary inform the DVLA, telling the patient beforehand unless this would increase the risk of harm, and disclose only relevant information. <b>Do not issue a fit-to-drive letter without specialist involvement.</b> Document everything"],
         ["<b>SUDEP</b>","<b>Individualised and proportionate — not a fixed numerical script for every first-seizure patient.</b> NICE NG217 recommends discussing SUDEP risk with people who have seizures during sleep, including families and carers where appropriate. Discuss SUDEP risk as part of individualised epilepsy counselling, particularly in people with nocturnal seizures, generalised tonic-clonic seizures, drug-resistant epilepsy or poor adherence, or where the patient or family is concerned. Explain that SUDEP is uncommon but risk is higher with <b>uncontrolled GTCS or nocturnal seizures, missed medication, alcohol and sleeping arrangements (prone or alone)</b>. Explain that seizure control and medication adherence reduce risk, and offer practical advice about nocturnal supervision or monitoring where appropriate"],
         ["<b>Safety measures</b>","Shower rather than bath while seizures are uncontrolled; never lock the bathroom door; tell a household member. Swim only with a lifeguard who knows, and never alone. Use the back rings of the hob and sit to cook; prefer the microwave. No ladders or work at heights. Inform the household about the recovery position and the 5-minute rule"],
         ["<b>Trigger management</b>","Consistent sleep times including days off; avoid alcohol combined with sleep deprivation or missed meals; eat regularly; treat febrile illness proactively. Photosensitive epilepsy (3–5%): polarised sunglasses, screen filters, viewing distance"],
         ["<b>Annual review</b>","Seizure frequency, type and diary, AED adherence and side effects, rescue medication use, rash or hypersensitivity, interactions (especially contraception), contraception and pregnancy plans, valproate and topiramate reproductive-safety status under shared care, renal or hepatic issues where relevant, DVLA status, SUDEP risk factors, mood and suicidality (PHQ-9 — depression and anxiety are common and are themselves seizure triggers), bone health on enzyme-inducing AEDs, alcohol (AUDIT-C), and safety at work, in water, at heights and around cooking"],
         ["<b>Resources</b>","Epilepsy Action (epilepsy.org.uk, 0808 800 5050), Epilepsy Society, SUDEP Action. Written seizure first aid card for patient and carer; seizure diary or app"]
       ]},
       {b:"why", html:"The DVLA conversation cannot be deferred, and it is a common source of both patient harm and medicolegal exposure. The rule runs <b>from the date of the seizure, not the date of the consultation</b> — which frequently means a patient who has driven to the appointment has already been driving unlawfully, and needs to be told so kindly but unambiguously. <b>Soft or vague advice is the failure mode.</b> The documentation standard is: <em>\u201cDVLA advice given [date]: must not drive from date of seizure [date]; current DVLA guidance given and likely period discussed [details]; patient must notify DVLA at gov.uk. Patient acknowledged / declined. [Action taken.]\u201d</em>"},
       {b:"cards", items:[
         {tone:"red", h:"🔴 999", html:"Seizure lasting 5 minutes or more · a second seizure before recovery · breathing does not recover · not regaining consciousness within 10 minutes · significant injury · first seizure with fever and neck stiffness, head injury or focal deficit · any seizure in pregnancy or postpartum."},
         {tone:"amber", h:"🟠 Urgent review", html:"Seizure cluster as defined in the rescue plan, or a clear increase in usual seizure frequency · breakthrough seizure after a period of control (check adherence, sleep, alcohol, illness, interactions) · new AED side effects, rash on lamotrigine, or mood change or suicidal thoughts on levetiracetam."},
         {tone:"red", h:"💊 Never stop abruptly", html:"\u201cDon't ever stop the medication suddenly, even if you've been seizure-free — it can bring seizures back, and it can mean you have to stop driving again.\u201d"},
         {tone:"green", h:"🤰 Planning pregnancy", html:"Come before conceiving, not after — the AED may need changing and folic acid 5 mg starts pre-conception."}
       ]},
       {b:"say", html:"There are two things I have to be straight with you about today, and then some good news. First, the law says you must stop driving from the date of the seizure — not from today — and you need to tell the DVLA yourself; how long depends on the circumstances, so I'll give you the current DVLA guidance and write down what we've discussed. I'm sorry, I know that's a big practical hit. Second, the diagnosis and any decision about starting medication are normally made by a specialist in first seizures, and I'm referring you urgently to be seen within two weeks. What I can do is give you the information you need now: how to keep safe, what your flatmate should do if it happens again, and one thing worth telling the specialist — you're on the pill, and that interacts with some of the epilepsy medicines in both directions. And the good news: around seven in ten people with epilepsy become completely seizure-free on treatment."}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999", html:"Status epilepticus (convulsive seizure lasting 5 minutes or more, or repeated seizures without recovery) · persistent impaired consciousness, breathing compromise or significant injury · first seizure with fever and meningism, head injury, focal deficit or suspected intracranial haemorrhage · any seizure in pregnancy or postpartum (presume eclampsia until excluded) · severe hypoglycaemia or other major metabolic disturbance."},
         {tone:"amber", h:"First-seizure/epilepsy specialist — within 2 weeks", html:"All first suspected seizures (NICE NG217) — a clinician with expertise in first seizures and epilepsy. Also breakthrough seizures on treatment, and anyone on valproate or topiramate planning pregnancy (urgently if pregnancy is suspected or confirmed)."},
         {tone:"purple", h:"NG12 — the adjacency, stated honestly", html:"<b>Epilepsy has no NG12 criterion of its own.</b> But progressive sub-acute loss of central neurological function → urgent direct-access MRI brain (or CT if MRI is contraindicated) within 2 weeks for suspected brain or CNS cancer — so a first seizure with progressive focal deficit, personality or cognitive change, persistent or progressive headache needs urgent neurological/neuroimaging assessment by the local pathway — sometimes as an emergency — not the routine first-seizure pathway alone. Papilloedema (suspected raised intracranial pressure) needs same-day emergency assessment."},
         {tone:"blue", h:"Occupational health", html:"Within 2–4 weeks where the job carries risk — healthcare, driving, heights, machinery. Fitness-for-duty assessment and temporary modification. Not professional registration advice — that is a professional body matter."},
         {tone:"green", h:"Joint obstetric + neurology", html:"Pregnancy in a woman with epilepsy, and pre-conception planning where an AED switch is needed."},
         {tone:"cream", h:"GP shared care", html:"AED prescribing under shared care, side-effect and interaction monitoring, valproate and topiramate reproductive-safety checks (contact the specialist team if documentation is absent), adherence support, annual review, DVLA documentation, and SUDEP and safety counselling."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 24-year-old nurse attends three days after her first witnessed generalised tonic-clonic seizure at a party — little sleep the night before, four units of alcohol, missed meals. She is on the COCP, has read about SUDEP online and is frightened, and is worried about her registration. Her opening line: <em>\u201cI drove here today \u2014 am I OK to drive?\u201d</em>"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Addresses the DVLA question first, kindly and unambiguously — the rule runs from the date of the seizure, so she could not lawfully have driven here; knows diagnosis and AED initiation are normally specialist-led, and refers urgently to a first-seizure/epilepsy specialist within 2 weeks; <b>does not let tests delay the referral, and does not reassure on a normal CT or EEG</b>; <b>addresses her SUDEP concern honestly and proportionately rather than deflecting</b>; flags the COCP–lamotrigine interaction so she can raise it with the specialist; teaches <b>seizure first aid and the 5-minute rule to the flatmate</b>; refers to <b>occupational health without commenting on NMC registration</b>; and — the step candidates miss — <b>documents the seizure date, the DVLA advice given and her response.</b>"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG217 — Epilepsies in children, young people and adults (2022, updated August 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng217" rel="noopener">nice.org.uk/guidance/ng217</a><span class="rd"> — first suspected seizure referred urgently to a clinician with expertise in first seizures and epilepsy within 2 weeks; ECG, EEG (ideally within 72 hours if requested) and MRI; treatment initiation; AED choice by seizure type and syndrome; valproate under-55 rule; SUDEP risk discussion (seizures during sleep); convulsive status epilepticus</span></li>'+
         '<li><b>DVLA — Assessing fitness to drive: a guide for medical professionals</b><br><a href="https://www.gov.uk/government/publications/assessing-fitness-to-drive-a-guide-for-medical-professionals" rel="noopener">gov.uk — assessing fitness to drive</a><span class="rd"> — licensing periods depend on seizure type and circumstances, recurrence risk, medication changes and licence group, so check the current guide rather than quoting a single rule; the patient\u2019s duty to notify</span></li>'+
         '<li><b>MHRA — Valproate safety measures (National Patient Safety Alert, November 2023; Drug Safety Update, September 2024) and updated educational materials</b><br><a href="https://www.gov.uk/drug-safety-update" rel="noopener">gov.uk — Drug Safety Update</a><span class="rd"> — no new initiation under 55 (male or female) unless two specialists independently agree; Pregnancy Prevention Programme for women and girls who could become pregnant; reproductive-risk counselling for men; risk-acknowledgement documentation; Valproate User Card</span></li>'+
         '<li><b>MHRA — Topiramate (Topamax): new safety measures, including a Pregnancy Prevention Programme (2024)</b><span class="rd"> — contraindicated in pregnancy and in women of childbearing potential unless the Pregnancy Prevention Programme conditions are fulfilled</span></li>'+
         '<li><b>FSRH — Drug interactions with hormonal contraception</b><br><a href="https://www.fsrh.org" rel="noopener">fsrh.org</a><span class="rd"> — enzyme-inducing antiseizure medicines and contraceptive choice</span></li>'+
         '<li>GMC — Confidentiality: patients\u2019 fitness to drive and reporting concerns to the DVLA<span class="rd"> — advise the patient to notify; seek consent where practicable; disclose only relevant information if they continue to drive when unsafe</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — no criterion applies to epilepsy; the adjacency is urgent direct-access MRI (or CT if MRI is contraindicated) within 2 weeks for progressive, sub-acute loss of central neurological function</span></li>'+
         '<li><b>Epilepsy Action, Epilepsy Society and SUDEP Action</b><br><a href="https://www.epilepsy.org.uk" rel="noopener">epilepsy.org.uk</a> · helpline <b>0808 800 5050</b><span class="rd"> — patient resources, seizure first aid cards and SUDEP information</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — dosing and interactions, checked alongside current product information</span></li>'+
         '<li><b>Local shared-care protocols, product information (SmPC) and local emergency seizure/status protocols</b><span class="rd"> — dose, interaction and rescue-plan details; local neurology, medicines-safety and shared-care governance approval required before adoption</span></li>'+
         '<li><b>Review dates</b><span class="rd"> — the review and update dates on this page apply only where NICE NG217, DVLA, MHRA, FSRH and local shared-care documents were each re-checked on that date; re-verify them at every review</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Epilepsy — NICE NG217 (2022, updated August 2026), DVLA Assessing fitness to drive, MHRA valproate and topiramate safety measures, FSRH guidance, GMC confidentiality guidance and the BNF. Diagnosis and routine initiation of antiepileptic drugs are normally specialist-led: refer every first suspected seizure urgently to a clinician with expertise in first seizures and epilepsy, within 2 weeks. Undifferentiated transient loss of consciousness is covered by the <a href=\"../algorithms/fits-funny-turns.html\">fits and funny turns pathway</a>. Verify all doses against the current BNF, product information and the patient's individual plan before prescribing, and follow local shared-care agreements."
});
