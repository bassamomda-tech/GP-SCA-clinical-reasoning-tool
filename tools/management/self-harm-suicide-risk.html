<script>
MG.render({ snapshot:"summaries/self-harm-suicide-risk.html",
  icon:"🤝",
  title:"Self-harm and suicide risk",
  eyebrow:"Protocol · mental health · assess, keep safe and follow up",
  stemTitle:"Self-harm and suicidal thoughts: treat the body first, then understand the person, plan for safety together and follow up within 48 hours",
  stemSub:"One page for the GP who meets self-harm or suicidal thoughts in surgery, on the phone or after an ED attendance. NICE NG225 (2022) moved practice away from scoring people as low, medium or high risk: risk tools and scales do not predict who will die by suicide and must not decide who gets care. Instead, assess physical harm and needs, understand why the person self-harmed, agree a safety plan, reduce access to means, involve family and carers where the person agrees, safeguard children and young people, and keep in contact. Overdose and serious injury go to the emergency department the same day.",
  guideline:"NICE NG225 (2022) · NICE NG134 (2019) · NICE QS34 (2013, updated 2023) · NCISH Annual Report (2025) · GMC Confidentiality (2017) · DHSC Suicide prevention strategy for England (2023)",
  reviewed:"15 October 2026",
  nextReview:"April 2027",
  meta:[
    {t:"NICE NG225 · self-harm (2022)"},
    {t:"No risk tools or scales to predict or allocate care", tone:"tw"},
    {t:"Aftercare within 48 hours"},
    {t:"Under 18: safeguarding and CAMHS"},
    {t:"Reviewed October 2026 · next review April 2027"}
  ],
  lead:"<div class='mg-layers'><a href='#redflags'><b>Same day or 999</b><small>overdose, injury, intent</small></a><a href='#assess'><b>Assess</b><small>needs, not a score</small></a><a href='#safety'><b>Safety plan</b><small>and reduce means</small></a><a href='#followup'><b>Follow up</b><small>within 48 hours</small></a></div>",
  quickSub:"Six points that change what you do today. Each one is traced to a named source under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"Overdose or serious injury: emergency department today", html:"Any <b>intentional overdose</b>, however small and however well the person looks, goes to the <b>emergency department the same day</b>; call <b>999</b> if they are drowsy, confused, have taken an unknown amount, or will not or cannot travel safely. <b>Paracetamol</b> causes no early symptoms: treatment depends on a timed blood level from 4 hours and acetylcysteine works best within 8 hours of ingestion. Deep or contaminated wounds, burns or ligature use need same-day hospital assessment."},
    {tone:"red", h:"Do not score risk as low, medium or high", html:"NICE NG225 says <b>do not use risk assessment tools and scales to predict future suicide or repetition of self-harm</b>, and do not use them, or a global risk label, to decide who is offered treatment or who is discharged. Most people who die by suicide were judged low risk. Use the conversation to understand the person's needs, what is driving the self-harm and what keeps them safe."},
    {tone:"amber", h:"Same-day mental health route when concern is high", html:"Where there is <b>high concern for safety</b>, for example a clear plan or intent, recent escalation, psychosis, severe agitation or hopelessness, or the person cannot agree a plan to stay safe, arrange a <b>same-day mental health assessment</b> through the crisis or home treatment team or liaison psychiatry. In England, <b>NHS 111, option 2</b> reaches the local mental health crisis line. Do not leave someone alone who you believe is in immediate danger."},
    {tone:"cream", h:"Write a safety plan with them, not for them", html:"Agree a short <b>written safety plan</b>: warning signs, things that help, people and places that distract, who to contact, crisis numbers, and how to make the environment safer. Discuss <b>reducing access to means</b>, such as medicines at home, ligature points and other methods the person has considered. Offer to involve a family member or friend, with the person's consent."},
    {tone:"blue", h:"Under 18: safeguarding and CAMHS, every time", html:"A child or young person who has self-harmed needs a <b>same-day discussion</b> with CAMHS or the paediatric or crisis team and a <b>safeguarding</b> assessment. Ask about abuse, exploitation, bullying and online harm, and follow local child protection procedures. Involve parents or carers unless doing so would put the young person at risk, and record the reasoning."},
    {tone:"green", h:"Aftercare within 48 hours, and safer prescribing", html:"If you carried out the psychosocial assessment and safety concerns remain, NG225 advises <b>initial aftercare within 48 hours</b>, ideally with the same clinician. After an ED attendance, make contact soon after the discharge letter arrives. Prescribe <b>limited quantities</b> of medicines that are toxic in overdose, review what is already at home, and do not offer drug treatment as a specific intervention to reduce self-harm."}
  ],
  pathwaySub:"Five moves. The first decides where this consultation happens.",
  pathway:[
    {title:"Physical danger first", alert:true, html:"Ask directly what was taken or done, when and how much. Overdose, serious injury, ligature, intoxication or reduced consciousness → emergency department the same day, or 999. Arrange transport and do not let the person drive."},
    {title:"Ask about suicide directly", html:"Asking does not put the idea in someone's head. Ask about thoughts, plans, preparations, intent, previous attempts and what has stopped them so far. Ask about access to means."},
    {title:"Understand needs, not a score", html:"Use the psychosocial assessment: why now, mental health, alcohol and drugs, physical health, relationships, debt, work, housing, safeguarding, and protective factors. Agree with the person what would help."},
    {title:"Decide the route and safety-plan", alert:true, html:"High concern for safety → same-day crisis or liaison assessment. Otherwise agree a written safety plan, reduce access to means, involve trusted others with consent, and refer for psychological support and treatment of any underlying condition."},
    {title:"Keep in contact", html:"Initial aftercare within 48 hours if you assessed and concerns remain. Name a clinician, set the next contact date, give crisis numbers, prescribe safely and share information appropriately."}
  ],
  sections:[
    {id:"redflags", nav:"Red flags", title:"Red flags: who goes to hospital or crisis services today", sub:"Physical harm is treated first. Psychological distress is assessed alongside it, not after it.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Any intentional overdose", html:"Send <b>every</b> intentional overdose to the <b>emergency department the same day</b>, including small amounts and 'only a few tablets'. Call <b>999</b> if drowsy, confused, vomiting repeatedly, breathless, seizing, or if the amount or time is unknown. Ask the person or a relative to bring the packets. Use TOXBASE (via the poisons service) for advice on specific agents.", src:"NICE NG225 (2022) · TOXBASE"},
         {tone:"red", h:"🔴 Paracetamol: well now does not mean safe", html:"Early paracetamol poisoning is often <b>symptom-free</b>. Hospital management uses a timed paracetamol level from <b>4 hours</b> after ingestion (or immediate treatment for staggered or uncertain timing), and acetylcysteine is most effective when started within <b>8 hours</b>. Any deliberate paracetamol overdose → emergency department today.", src:"Acetylcysteine SPC · MHRA (2012) paracetamol overdose treatment"},
         {tone:"red", h:"🔴 Serious injury or a ligature", html:"Deep, gaping or contaminated wounds, tendon or nerve injury, burns, or any attempted hanging or strangulation (even if the person now looks well) → same-day hospital assessment; <b>999</b> for airway or breathing difficulty, reduced consciousness or heavy bleeding.", src:"NICE NG225 (2022)"},
         {tone:"red", h:"🔴 High concern for safety", html:"Current plan or intent, preparations (stockpiling, a note, saying goodbye), a recent high-lethality attempt, psychosis with distressing voices, severe agitation, severe hopelessness, or unable to engage with a safety plan → <b>same-day</b> assessment by the crisis or home treatment team or liaison psychiatry. If the person is in immediate danger and will not wait, call <b>999</b>.", src:"NICE NG225 (2022)"},
         {tone:"amber", h:"🟠 Children and young people under 18", html:"Discuss the <b>same day</b> with CAMHS, the crisis team or paediatrics, according to the local pathway, and consider safeguarding every time. Young people under 16 who have self-harmed after an overdose or injury go to the emergency department like adults.", src:"NICE NG225 (2022) · Working Together to Safeguard Children (2023)"},
         {tone:"amber", h:"🟠 Intoxication, capacity and refusal", html:"Intoxication increases impulsivity but is not a reason to delay assessment of physical harm. If the person declines help and you are worried, assess <b>mental capacity</b> for that decision; in an emergency, act in their best interests and involve the crisis team or emergency services. Record the decision and your reasoning.", src:"NICE NG225 (2022) · Mental Capacity Act 2005"}
       ]},
       {b:"why", html:"Self-harm is the strongest single predictor of later suicide: the risk is highest in the first weeks after an episode. The physical consequences of overdose, especially paracetamol, can be delayed and irreversible, so a well-looking patient is not reassuring. Psychosocial assessment does not wait for medical treatment to finish; both start on the same day."}
     ]},

    {id:"assess", nav:"Assess", title:"Assessment: understanding the person, not scoring them", sub:"NICE NG225 asks for a psychosocial assessment that builds a therapeutic relationship and a shared understanding of why the person self-harmed.",
     blocks:[
       {b:"table", head:["Area","What to ask or check","Why it matters"], rows:[
         ["<b>The act</b>","What happened, when, method, planning, intent, whether alone, whether anyone was told, how they feel now that they survived.","Separates physical urgency from psychological need and shows how the person is coping."],
         ["<b>Suicidal thoughts</b>","Thoughts, frequency, plans, preparations, access to means, previous attempts, what has held them back.","Directly asked questions are acceptable and helpful. Do not translate the answers into a risk score."],
         ["<b>Mental health</b>","Depression, anxiety, psychosis, eating disorder, personality-related difficulties, neurodevelopmental conditions, trauma.","Treatable conditions are common and change the plan (see NICE NG222 and the NICE guidance for the specific condition)."],
         ["<b>Alcohol and drugs</b>","Quantity, dependence, intoxication at the time of the act.","Increases impulsivity and lethality; links to other services."],
         ["<b>Social context</b>","Relationships, loss, debt, gambling, housing, work or school, isolation, abuse, domestic violence, legal problems.","These often drive the episode and need practical help."],
         ["<b>Physical health</b>","Chronic pain, new serious diagnosis, disability, insomnia, medicines at home.","Raises distress and gives access to means."],
         ["<b>Protective factors</b>","Reasons for living, children, pets, faith, plans, people they trust, previous coping.","Builds the safety plan."]
       ]},
       {b:"warn", html:"<b>Do not use risk assessment tools or scales</b> (for example SAD PERSONS or similar scores) to predict future suicide or repetition of self-harm, or to decide who is offered treatment or who is discharged. Do not use a global label of low, medium or high risk to allocate care. Tools may be used, if at all, to help structure a conversation (NICE NG225)."},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"🗣️ How to ask", html:"Be open and non-judgemental, and give time. 'Sometimes when people feel this bad they think about ending their life. Has that happened to you?' Then: 'Have you made any plans? What has stopped you?' Ask about the method used, because people often repeat it.", src:"NICE NG225 (2022)"},
         {tone:"blue", h:"🧾 Who else to hear from", html:"With consent, speak to a family member or friend; their account often adds important information. Share information without consent when there is a serious and imminent risk to life (GMC guidance). Check records for previous episodes and recent contacts.", src:"GMC Confidentiality (2017) · NICE NG225 (2022)"},
         {tone:"amber", h:"⚠️ Higher-risk circumstances", html:"Groups who are over-represented among suicides include middle-aged men, people recently discharged from psychiatric inpatient care, people in contact with criminal justice, people with chronic physical illness, and those facing debt or bereavement by suicide. These raise concern and inform the plan; they are not a score.", src:"NCISH Annual Report (2025) · DHSC strategy (2023)"},
         {tone:"cream", h:"⚕️ Physical examination", html:"Examine wounds and check for signs of toxicity. Check tetanus status for wounds. Look for older scars and ask about them sensitively. Consider pregnancy where relevant, because it changes medicine choices and safeguarding."}
       ]}
     ]},

    {id:"safety", nav:"Safety plan", title:"Management: safety plan, means and support", sub:"Most people who self-harm are managed in the community. The plan is agreed with the person and shared, with consent, with those who will help.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Today", tone:"red", title:"Physical harm and high concern for safety", when:"overdose, injury, intent", fromLabel:"emergency or crisis route",
          html:"Emergency department for overdose or serious injury. Same-day crisis team, home treatment team or liaison psychiatry assessment where concern for safety is high. In England, NHS 111 option 2 for the mental health crisis line."},
         {step:"Today", tone:"cream", title:"Safety plan and means", when:"every person", fromLabel:"agree together",
          html:"Write a personalised safety plan with the person: warning signs and triggers; coping strategies; people and places for distraction; people to ask for help; professionals and crisis lines; making the environment safe. Free templates such as Staying Safe can help. Remove or reduce access to means: return surplus medicines to a pharmacy, ask a trusted person to hold medicines, and remove ligatures or weapons where possible."},
         {step:"Within days", tone:"cream", title:"Treatment and support", when:"after the safety plan", fromLabel:"refer for help",
          html:"Refer to NHS Talking Therapies or secondary mental health services as appropriate. NG225 recommends <b>considering</b> a structured psychological intervention (for example cognitive behavioural therapy-informed) specifically tailored for adults who self-harm, and for children and young people with significant emotional dysregulation who frequently self-harm, consider dialectical behaviour therapy adapted for adolescents (DBT-A). Treat underlying depression, anxiety or psychosis according to the relevant NICE guideline."},
         {step:"Ongoing", tone:"green", title:"Keep in contact", when:"follow-up", fromLabel:"named clinician",
          html:"Initial aftercare within 48 hours where you assessed and concerns remain, then regular reviews of self-harm, mood, safety plan and medicines. Share the plan with the person's other services with consent."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"cream", h:"🤕 Harm minimisation", html:"For some people who self-harm repeatedly, discussing harm minimisation, such as wound care and avoiding substances, can be appropriate as part of a wider plan. Do not offer advice on 'safer' self-poisoning: there is no safe overdose. Take advice from the person's mental health team.", src:"NICE NG225 (2022)"},
         {tone:"cream", h:"👪 Family, friends and carers", html:"Ask who the person wants involved. Give carers information about self-harm, the safety plan and crisis contacts, and offer them support in their own right. Ask about other children or dependants in the household.", src:"NICE NG225 (2022)"},
         {tone:"blue", h:"🧑‍⚕️ Practical problems", html:"Debt, housing and benefits problems are common triggers. Signpost to debt advice, social prescribing, domestic abuse services, and bereavement support (including support after suicide).", src:"DHSC Suicide prevention strategy for England (2023)"},
         {tone:"amber", h:"🔁 Repeated self-harm", html:"Each episode needs a fresh assessment; do not assume it is 'the same as usual'. Agree a consistent plan across services, with one named professional where possible, and avoid frequent changes of clinician.", src:"NICE NG225 (2022)"}
       ]},
       {b:"say", html:"I'm really glad you told me. Lots of people feel like this at some point, and it can get better. Let's work out together what's going on and what would help, and write down a plan for the moments when things feel worst, including who you can contact, day or night."}
     ]},

    {id:"prescribing", nav:"Prescribing", title:"Prescribing safely after self-harm", sub:"Medicines can be both treatment and means. NG225 says not to offer drug treatment as a specific intervention to reduce self-harm.",
     blocks:[
       {b:"table", head:["Action","Detail"], rows:[
         ["<b>Limit quantities</b>","Prescribe medicines that are toxic in overdose in <b>limited quantities</b> (for example weekly or fortnightly supplies), and consider asking the pharmacy to dispense in instalments. Check repeat lists for stockpiling and early requests."],
         ["<b>Choose lower-toxicity options</b>","When treating depression in someone at risk of overdose, consider toxicity: tricyclic antidepressants are more dangerous in overdose; venlafaxine carries a higher overdose risk than SSRIs (NICE NG222). Avoid co-prescribing opioids, gabapentinoids and benzodiazepines where possible."],
         ["<b>Young adults starting antidepressants</b>","People under 25 starting an antidepressant are at increased risk of suicidal thoughts early in treatment: review within <b>1 week</b> of starting (NICE NG222), with clear safety-netting. <span class=mg-dose>Usual adult dose: sertraline 50 mg once daily initially (NICE/SPC; check doses in the SPC and your local formulary; <a href=https://www.medicines.org.uk/emc/search?q=sertraline target=_blank rel=noopener>SPC: sertraline</a>).</span>"],
         ["<b>Review what is already at home</b>","Ask about over-the-counter paracetamol, other people's medicines and old supplies. Encourage return of unwanted medicines to a pharmacy."],
         ["<b>No drug to reduce self-harm</b>","Do not offer drug treatment as a specific intervention to reduce self-harm (NG225). Treat co-existing conditions on their own merits."]
       ]},
       {b:"warn", html:"<b>Paracetamol and OTC medicines.</b> Pack-size limits on paracetamol and aspirin sold over the counter reduced deaths from overdose; prescribing large quantities bypasses that protection. Think twice before issuing 100 paracetamol tablets to someone who has self-harmed."}
     ]},

    {id:"special", nav:"Special groups", title:"Special groups", sub:"Groups where the default plan changes.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"🧒 Children and young people", html:"Same-day discussion with CAMHS, crisis or paediatrics; safeguarding enquiry; involve parents or carers unless that increases risk; consider Gillick competence and confidentiality, which can be broken to protect life. Tell the school only with consent, unless safeguarding requires it. Ask about online content, bullying, exploitation and sexual abuse.", src:"NICE NG225 (2022) · Working Together to Safeguard Children (2023)"},
         {tone:"amber", h:"👵 Older people", html:"Self-harm in an older adult is more often associated with suicidal intent and higher lethality. Treat it as a serious event: assess for depression, pain, physical illness, cognitive impairment, isolation and recent bereavement, and involve older adult mental health services.", src:"NICE NG225 (2022)"},
         {tone:"amber", h:"🤰 Pregnancy and the postnatal year", html:"Suicide is a leading cause of maternal death in the year after birth. New thoughts of self-harm, or a sudden change in mental state, in pregnancy or after birth → same-day perinatal mental health or crisis assessment.", src:"MBRRACE-UK (2024) · NICE CG192 (2014, updated 2020)"},
         {tone:"blue", h:"🧩 Autism and learning disability", html:"Adapt communication, allow more time, involve people who know the person well, and consider reasonable adjustments. Self-injury may have different functions and needs specialist assessment.", src:"NICE NG225 (2022)"},
         {tone:"blue", h:"🍷 Alcohol or drug use", html:"Address substance use as part of the plan, not as a reason to exclude someone from mental health care. Refer to local drug and alcohol services.", src:"NICE NG225 (2022)"},
         {tone:"blue", h:"🕊️ Bereaved by suicide", html:"Family and friends bereaved by suicide are themselves at increased risk. Offer support and signpost to bereavement services, such as Support After Suicide.", src:"DHSC Suicide prevention strategy for England (2023)"}
       ]}
     ]},

    {id:"followup", nav:"Follow-up", title:"Monitoring and follow-up", sub:"The risk of repetition and suicide is highest in the weeks after an episode or a discharge.",
     blocks:[
       {b:"kv", rows:[
         ["After a GP assessment","Initial aftercare within <b>48 hours</b> where concerns about safety remain, ideally with the same clinician (NG225). Agree how and when with the person."],
         ["After an ED attendance","Read the discharge letter promptly and make contact soon, ideally within 48 hours; check the safety plan and any referrals made."],
         ["After psychiatric inpatient discharge","Contact within 72 hours of discharge is the national standard for mental health services; the GP should also be alert to this high-risk period."],
         ["Ongoing","Regular follow-up appointments, review of self-harm behaviour, mood, alcohol and drug use, the safety plan and medicines; code self-harm in the record."],
         ["Did not attend","Follow up a missed appointment actively by phone, and contact the mental health team if you cannot reach the person and are concerned."]
       ]},
       {b:"why", html:"NICE NG225 emphasises continuity: people describe feeling dismissed after self-harm, and early, respectful contact improves engagement with further help. A named clinician and a clear next contact date matter more than a single long assessment."}
     ]},

    {id:"refer", nav:"Refer", title:"Referral routes", sub:"Who, where and how fast.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999 or emergency department", html:"Overdose (every one), serious injury, ligature or attempted hanging, reduced consciousness, or someone in immediate danger who will not wait.", src:"NICE NG225 (2022)"},
         {tone:"red", h:"Same day: crisis or liaison mental health", html:"High concern for safety: plan or intent, preparations, psychosis, severe agitation or hopelessness, cannot agree a safety plan, or no support at home. In England, NHS 111 option 2 reaches the local crisis line; many areas have crisis cafés or safe havens.", src:"NICE NG225 (2022) · NHS England (2024) NHS 111 option 2"},
         {tone:"red", h:"Same day: CAMHS or paediatrics", html:"Any child or young person under 18 who has self-harmed, with a safeguarding referral where indicated.", src:"NICE NG225 (2022)"},
         {tone:"amber", h:"Within days: community mental health", html:"Ongoing self-harm, significant mental illness, or need for a specific psychological intervention: community mental health team, NHS Talking Therapies (adults with common mental health problems), or CAMHS.", src:"NICE NG225 (2022) · NICE NG222 (2022)"},
         {tone:"green", h:"Alongside: practical and voluntary support", html:"Debt advice, domestic abuse services, social prescribing, drug and alcohol services, and bereavement support. Samaritans (116 123), Shout (text 85258), and for under-35s, PAPYRUS HOPELINE247 (0800 068 4141).", src:"DHSC Suicide prevention strategy for England (2023)"}
       ]}
     ]},

    {id:"patient", nav:"Safety-net", title:"Patient information and safety-netting", sub:"Give crisis contacts in writing and check the person knows how to use them.",
     blocks:[
       {b:"say", html:"If you feel you can't keep yourself safe, or you've taken something or hurt yourself badly, call 999 or go to A&amp;E now. If you need to talk to someone today, ring NHS 111 and choose option 2 for the mental health crisis team, or call Samaritans on 116 123 at any time. Keep your safety plan somewhere you can find it, and we'll speak again within two days."},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"✅ Before they leave", html:"Safety plan written and copied; crisis numbers saved in their phone; means discussed; next contact date booked; consent recorded for sharing with family or services; a trusted person aware where possible.", src:"NICE NG225 (2022)"},
         {tone:"green", h:"📄 Trusted information", html:"NHS website: self-harm and help for suicidal thoughts; Mind; YoungMinds (for young people and parents); Staying Safe safety-planning resources; Support After Suicide Partnership.", src:"NHS website · Mind · YoungMinds"}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Scenario", html:"A 19-year-old student books a telephone appointment for 'sleeping tablets'. During the call she says she took 16 paracetamol last night after an argument and feels fine now. She asks you not to tell her parents.", src:"NICE NG225 (2022)"},
       {tone:"cream", h:"What a good consultation does", html:"Recognises that a paracetamol overdose needs the <b>emergency department today</b>, whatever she feels like, and explains why. Asks directly about suicidal thoughts and intent. Avoids labelling risk as low or high. Respects confidentiality while explaining when it can be broken. Does not prescribe hypnotics in quantity. Arranges <b>follow-up within 48 hours</b> and a safety plan, and gives crisis numbers.", src:"NICE NG225 (2022)"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Every recommendation on this page traces to a named primary source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG225 — Self-harm: assessment, management and preventing recurrence (September 2022)</b><br><a href="https://www.nice.org.uk/guidance/ng225" rel="noopener">nice.org.uk/guidance/ng225</a><span class="rd"> — do not use risk tools or scales to predict suicide or repetition or to allocate care; psychosocial assessment; safety planning and means; primary care assessment and aftercare within 48 hours; children and young people; no drug treatment specifically to reduce self-harm; replaces CG16 and CG133</span></li>'+
         '<li><b>NICE QS34 — Self-harm quality standard (2013, updated 2023)</b><br><a href="https://www.nice.org.uk/guidance/qs34" rel="noopener">nice.org.uk/guidance/qs34</a><span class="rd"> — psychosocial assessment, risk tools not used to predict, safety plans</span></li>'+
         '<li><b>NICE NG222 — Depression in adults: treatment and management (2022)</b><br><a href="https://www.nice.org.uk/guidance/ng222" rel="noopener">nice.org.uk/guidance/ng222</a><span class="rd"> — toxicity in overdose, review within 1 week for under-25s starting antidepressants</span></li>'+
         '<li><b>NICE CG123 — Common mental health problems: identification and pathways to care (2011; withdrawn May 2024, background only)</b><br><a href="https://www.nice.org.uk/guidance/cg123" rel="noopener">nice.org.uk/guidance/cg123</a><span class="rd"> — referral for risk to self</span></li>'+

         '<li><b>National Confidential Inquiry into Suicide and Safety in Mental Health — Annual Report (2025)</b><br><a href="https://sites.manchester.ac.uk/ncish/" rel="noopener">sites.manchester.ac.uk/ncish</a><span class="rd"> — most patients who die by suicide were judged low risk; post-discharge risk</span></li>'+
