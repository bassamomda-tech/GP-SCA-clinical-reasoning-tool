<script>
MG.render({
  icon:"🌀",
  title:"Suspected vestibular neuronitis and labyrinthitis — the complete guide",
  eyebrow:"Protocol · adults over 16 · acute vestibular syndrome",
  stemTitle:"Acute sustained vertigo with nausea and unsteadiness is acute vestibular syndrome — do not call it vestibular neuronitis until posterior-circulation stroke and other central causes have been assessed",
  stemSub:"<b>Assessment and initial management of suspected acute vestibular syndrome in adults over 16, after appropriate assessment for central causes.</b> Acute vestibular syndrome (AVS) is acute-onset, persistent vertigo or dizziness lasting hours to days, usually with nausea or vomiting, spontaneous nystagmus and gait unsteadiness, present at rest and worsened by head movement. It is different from brief, triggered positional episodes, which need a separate BPPV assessment. Vestibular neuronitis and labyrinthitis are diagnoses of exclusion, particularly in the first 24–72 hours. Use HINTS only if you are trained and experienced in it; otherwise refer immediately through the local stroke pathway (NICE NG127). <b>New sudden hearing loss is an urgent ENT or ED problem</b>, not simply evidence of labyrinthitis (NICE NG98). Once a peripheral cause is judged safe: short-term symptom relief only, oral fluids if tolerated, gradual supported mobilisation, and vestibular rehabilitation when imbalance or functional limitation persists. Use the local Greater Manchester stroke referral, Bolton same-day emergency, ENT on-call, audiovestibular and vestibular rehabilitation or balance-service routes.",
  guideline:"NICE NG127 · NICE NG98 · NICE NG252 · Greater Manchester formulary · product SPCs (MHRA)",
  reviewed:"25 September 2026",
  nextReview:"25 September 2027",
  meta:[
    {t:"Stroke first — HINTS only if trained", tone:"tw"},
    {t:"Sudden hearing loss: seen within 24 h", tone:"tw"},
    {t:"v2.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#assess"><b>Assess</b><small>Central first</small></a><a href="#hearing"><b>Hearing</b><small>NG98 windows</small></a><a href="#relief"><b>Relief</b><small>Short-term</small></a><a href="#recover"><b>Recover</b><small>Mobilise · rehab</small></a><a href="#refer"><b>Refer</b><small>When and where</small></a></div>',
  quickSub:"The five that matter. Sources are cited under <a href=\"#provenance\">Evidence</a>; the 2–3-day suppressant limit, review intervals, formulation choices and rehabilitation timing are local practical recommendations based on pharmacological principles and local formulary practice, not NICE thresholds.",
  quick:[
    {tone:"red", h:"⚠ Posterior-circulation stroke can look identical", html:"Any new neurological deficit, atypical nystagmus, or sudden dizziness with focal signs, new unsteadiness or new deafness → <b>immediate stroke-pathway referral</b> (NICE NG127). Inability to stand or walk unaided, marked truncal ataxia or a new severe gait disturbance is a central warning sign requiring urgent stroke assessment — particularly when disproportionate, new, or with neurological signs — but it is not by itself diagnostic of stroke; keep the threshold for emergency assessment low. A normal non-contrast CT head does not reliably exclude posterior-fossa ischaemia; imaging and further stroke assessment are arranged through the receiving stroke or neuroimaging pathway."},
    {tone:"amber", h:"HINTS — only in the right patient, only if trained", html:"HINTS applies only to <b>continuous acute vestibular syndrome with spontaneous nystagmus and gait unsteadiness</b>, performed and interpreted by a clinician trained and experienced in it. It is not a general dizziness screen and must not be used to reassure episodic or positional symptoms. <b>HINTS suggesting stroke → immediate neuroimaging; no trained clinician → immediate stroke-pathway referral</b> (NICE NG127). Perform the complete three-part examination and interpret it together — no single component rules out stroke. A normal head-impulse test in continuous AVS is concerning for a central cause; direction-changing nystagmus or skew deviation needs immediate neuroimaging. A reassuring HINTS is not a reason to avoid referral if it was incomplete, the patient is atypical or concern remains. Basic GP training does not confer HINTS competence."},
    {tone:"red", h:"⚠ Sudden hearing loss is time-critical", html:"Sudden hearing loss developing over 3 days or less, within the past 30 days, not explained by external or middle-ear disease → <b>immediate ENT or ED referral, seen within 24 hours</b> (NICE NG98) — not necessarily 999; use 999 or the stroke pathway if there are focal neurological signs, severe unsteadiness, reduced consciousness or other features of acute stroke. Hearing loss suggests cochlear involvement, but it can also mean sudden sensorineural hearing loss, labyrinthine ischaemia, stroke or Ramsay Hunt."},
    {tone:"amber", h:"Vestibular suppressants: shortest practical course", html:"Use one vestibular suppressant or antiemetic only when symptoms are severe, at the lowest effective dose and for the shortest practical period. A short course, often no more than 2–3 days, is usually sufficient (a local practical recommendation, not a universally validated or NICE duration). Review if symptoms remain severe or medication is still required. Prolonged use impairs vestibular compensation and increases sedation and falls."},
    {tone:"green", h:"Recovery depends on moving again", html:"Rest and oral fluids if tolerated in the most severe phase; then mobilise gradually as soon as it is safe — supervised at first where gait is unsafe, with falls precautions. Consider vestibular rehabilitation once acute vomiting and severe symptoms are controlled, particularly when imbalance, visual-motion sensitivity or functional limitation persists; it need not wait several weeks."}
  ],
  pathwaySub:"Five steps. The first is to make sure this is not a stroke.",
  pathway:[
    {title:"Assess for a central cause first", html:"Classify the dizziness first: continuous AVS · episodic spontaneous vertigo · brief positional vertigo · light-headedness or presyncope. Then: onset, duration, continuous or triggered · ability to sit, stand and walk · eye movements and nystagmus · cranial nerves · limb coordination, speech, power and sensation · otoscopy · bedside hearing comparison (Weber and Rinne only if competent and equipped — they must not delay referral) · blood glucose where relevant · postural BP if presyncopal. HINTS only if trained, and only in continuous AVS with spontaneous nystagmus.", alert:true},
    {title:"Check the hearing", html:"Sudden hearing loss → NICE NG98 time windows, not routine audiology."},
    {title:"Short-term symptom relief if needed", html:"One agent only if required, shortest practical course (often no more than 2–3 days — a local practical rule), with its cautions checked."},
    {title:"Supportive care and gradual mobilisation", html:"Oral fluids if tolerated (no routine IV fluids in primary care), mobilise gradually with support, falls precautions, no driving or hazardous work while symptomatic or sedated."},
    {title:"Review, rehabilitate or refer", html:"Review interval by severity, ability to hydrate and home support — earlier if severe, uncertain or deteriorating. Stop suppressants as soon as possible; arrange vestibular rehabilitation if function remains limited; refer persistent, recurrent or atypical symptoms."}
  ],
  sections:[

    {id:"assess", nav:"Assess", title:"Step 1 — assess for a central cause first",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>Classify the dizziness first</b>","<b>Continuous</b>, spontaneous vertigo for hours to days with nausea and gait unsteadiness: AVS · <b>brief episodes triggered by position</b>: assess for BPPV (Hallpike by a trained clinician) · <b>episodic spontaneous vertigo</b>: consider vestibular migraine, Ménière's disease, arrhythmia or other causes · <b>light-headedness or presyncope</b>: cardiovascular or orthostatic pathway"],
         ["<b>Acute vestibular syndrome</b>","Acute-onset, persistent vertigo or dizziness lasting hours to days, usually with nausea or vomiting, spontaneous nystagmus and gait unsteadiness; present at rest and worsened by head movement. May follow a viral illness — this is not required. <b>HINTS must not be used for episodic, positional or non-vestibular dizziness</b>"],
         ["<b>Vestibular neuronitis</b>","Acute vestibular syndrome <b>without</b> hearing loss, after central causes have been assessed"],
         ["<b>Labyrinthitis</b>","A peripheral diagnosis with vestibular and cochlear symptoms — hearing loss and/or tinnitus. <b>Sudden sensorineural hearing loss with vertigo requires urgent ENT or stroke assessment before it is attributed to labyrinthitis</b> (Step 2)"],
         ["<b>Examine</b>","Ability to sit, stand and walk unaided · eye movements, spontaneous and gaze-evoked nystagmus · cranial nerves · limb coordination, speech, limb power and sensation · otoscopy (wax, otitis, perforation, vesicles, cholesteatoma, mastoid signs) · bedside hearing comparison; Weber and Rinne only if competent and equipped, and never delaying referral · blood glucose where clinically indicated · postural BP if the history suggests presyncope or orthostatic symptoms. <b>A normal limb neurological examination does not exclude posterior-circulation stroke</b>"],
         ["<b>Central warning signs</b>","New neurological deficit · atypical, vertical or direction-changing nystagmus · skew deviation · a normal head-impulse test in continuous AVS · severe headache, neck pain or suspected vertebral dissection · inability to stand or walk unaided, marked truncal ataxia or new severe gait disturbance — a warning sign needing urgent stroke assessment, especially if disproportionate or with neurological signs, though not by itself diagnostic of stroke (severe peripheral vestibulopathy can also prevent walking)"],
         ["<b>Other diagnoses to consider</b>","Cerebellar infarction or haemorrhage · vertebral artery dissection (neck pain, recent trauma or manipulation) · MS or other brainstem disease · BPPV · vestibular migraine · Ménière's disease · orthostatic hypotension · medication or intoxication · hypoglycaemia · cardiac arrhythmia or presyncope · anxiety or hyperventilation · vestibular schwannoma (persistent unilateral auditory symptoms) · Ramsay Hunt syndrome · otitis media or externa and mastoiditis · perilymphatic fistula after trauma, pressure change or barotrauma"],
         ["<b>Otological red flags</b>","Ear pain with vesicles in or around the ear, facial weakness or hearing loss suggests <b>Ramsay Hunt syndrome</b> → same-day ENT or neurological assessment. Also refer urgently for mastoid tenderness or swelling · purulent otorrhoea with systemic illness · severe otalgia in an immunocompromised or diabetic patient · facial nerve palsy · suspected perilymphatic fistula after trauma or barotrauma"]
       ]},
       {b:"why", html:"<b>Not BPPV:</b> brief, positionally triggered episodes point to BPPV and need a Hallpike test by a trained clinician, not treatment as vestibular neuronitis. A patient dizzy only when turning in bed does not have AVS and should not have HINTS. BPPV can also follow labyrinthitis. A normal-looking ear with new hearing loss is not reassuring — sudden sensorineural hearing loss often has a normal otoscopic examination."}
     ]},

    {id:"hearing", nav:"Hearing", title:"Step 2 — hearing loss: the NICE NG98 time windows",
     blocks:[
       {b:"table", head:["Hearing loss","Action"], rows:[
         ["<b>Sudden, developing over 3 days or less, within the past 30 days, not explained by external or middle-ear disease</b>","<b>Immediate referral — seen within 24 hours</b> (ENT or emergency department, per local pathway) — not necessarily 999 or an ambulance in a stable patient"],
         ["<b>Sudden, but more than 30 days ago</b>","Urgent referral — seen within 2 weeks"],
         ["<b>Rapidly worsening over 4–90 days</b>","Urgent referral — seen within 2 weeks"],
         ["<b>With focal neurological signs, severe unsteadiness, reduced consciousness or other features of acute stroke</b>","999 or emergency stroke pathway"]
       ]},
       {b:"warn", html:"Do not route sudden hearing loss to routine audiology — the treatment window is lost. Do not prescribe steroids in primary care as a substitute for urgent ENT assessment; any steroid treatment belongs in the local sudden sensorineural hearing loss pathway."}
     ]},

    {id:"relief", nav:"Relief", title:"Step 3 — short-term symptom relief",
     blocks:[
       {b:"table", head:["Drug","Regimen","Notes"], rows:[
         ["<b>Prochlorperazine</b>","5 mg tablets: oral 5 mg three times a day; or 3 mg buccal tablets, dosed according to the exact product SPC (buccal dosing is formulation-specific). Tablet use for vertigo may be unlicensed depending on the product — check the current MHRA SPC and the Greater Manchester formulary before prescribing","Acute symptoms only (Greater Manchester formulary). Extrapyramidal reactions and dystonia. Cautions: Parkinson's disease and parkinsonism · dementia with Lewy bodies · previous dystonic or extrapyramidal reactions · epilepsy · significant QT prolongation or interacting QT-prolonging medicines · hypotension · glaucoma and urinary retention · older or frail patients"],
         ["<b>Cyclizine</b>","Oral 50 mg up to three times a day, per the current product SPC and local formulary","Anticholinergic burden · sedation and falls · urinary retention · glaucoma · cognitive impairment · cardiac disease · pregnancy and breastfeeding · interaction with other sedatives — caution in older or frail patients"],
         ["<b>Injectable antiemetics</b>","Only where locally authorised, by clinicians familiar with the preparation, after checking the current product information","If vomiting prevents oral fluids or treatment, consider urgent referral instead"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"⚠ Cautions for both", html:"Sedation and impaired driving · postural hypotension and falls · older or frail patients · QT-prolonging medicines and cardiac risk (one of several cautions — see each drug above). <b>Pregnancy:</b> avoid initiating vestibular suppressants unless clinically necessary; check the product SPC and seek obstetric or medicines-in-pregnancy advice where uncertain. <b>Breastfeeding:</b> consider the individual product and infant factors. <b>Do not prescribe prochlorperazine and cyclizine together routinely</b> — combining dopamine-antagonist and antihistamine or anticholinergic agents increases sedation, anticholinergic effects and falls without clear evidence of benefit."},
         {tone:"amber", h:"⏳ Stop early", html:"Lowest effective dose for the shortest practical period — a short course, often no more than 2–3 days, is usually sufficient (local practical recommendation). Review if symptoms remain severe or medication is still required, and stop as symptoms improve; no prolonged or repeated courses without reassessment."}
       ]}
     ]},

    {id:"recover", nav:"Recover", title:"Step 4 — supportive care and recovery",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"💧 Supportive care", html:"Encourage normal oral fluids if tolerated. Assess for dehydration where vomiting is persistent. Arrange urgent assessment if the patient cannot maintain oral hydration or has significant electrolyte, renal or haemodynamic concerns. Do not routinely give IV fluids in primary care for uncomplicated peripheral vertigo."},
         {tone:"green", h:"🚶 Mobilise gradually", html:"Allow rest in the most severe phase. As soon as it is safe, begin gradual mobilisation and normal activity — prolonged inactivity may delay compensation. Mobilisation must be supervised initially where gait is unsafe, with falls precautions; do not encourage patients to mobilise alone if they cannot stand safely."},
         {tone:"amber", h:"🚗 Safety", html:"Falls precautions · no ladders, heights or machinery · no driving while symptomatic or sedated · occupational safety advice."},
         {tone:"green", h:"🤸 Vestibular rehabilitation", html:"Consider vestibular rehabilitation once acute vomiting and severe symptoms are controlled, particularly when imbalance, visual-motion sensitivity or functional limitation persists — it need not wait until several weeks have elapsed. Refer to a suitable local physiotherapy, audiovestibular or balance service (NICE NG252 supports targeted exercises for stability, mobility and vestibular problems where indicated)."}
       ]}
     ]},

    {id:"troubleshoot", nav:"Not recovering?", title:"Not recovering? Re-check before referring",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"1 · Central signs", html:"Any new neurological sign, severe or disproportionate ataxia, or atypical nystagmus → urgent stroke assessment."},
         {tone:"amber", h:"2 · Still on suppressants?", html:"Stop them as soon as possible — prolonged use delays compensation. Review if still needed."},
         {tone:"green", h:"3 · Rehabilitation", html:"Has vestibular rehabilitation started? If function remains limited, refer to the local physiotherapy, audiovestibular or balance service."},
         {tone:"red", h:"4 · Hearing", html:"New or worsening hearing loss → NICE NG98 windows (Step 2)."},
         {tone:"blue", h:"5 · Another diagnosis?", html:"Episodic or positional (BPPV — Hallpike) · progressive or fluctuating hearing loss · persistent unilateral tinnitus · migraine features · bilateral symptoms · neck pain or trauma · otorrhoea, mastoid tenderness or vesicles · spontaneous nystagmus that is vertical, direction-changing, with skew deviation, atypical, with new neurological signs, or worsening or not following the expected trajectory (persistent nystagmus alone can occur during recovery and is not on its own a central red flag)."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Step 5 — review and referral",
     blocks:[
       {b:"table", head:["When","Situation","Action"], rows:[
         ["<b>Immediate</b>","Central signs, new neurological deficit, severe or disproportionate truncal or gait ataxia, vertical or direction-changing nystagmus, skew deviation, normal head impulse in continuous AVS, severe headache, neck pain or suspected vertebral dissection, or suspected stroke","Immediate stroke pathway (999 if unstable) — even when a peripheral diagnosis seems plausible"],
         ["<b>Within 24 hours</b>","Sudden hearing loss within the NG98 window","Immediate ENT or ED referral, seen within 24 hours"],
         ["<b>Same day</b>","Ramsay Hunt features, mastoiditis, purulent otorrhoea with systemic illness, facial nerve palsy, suspected perilymphatic fistula · inability to maintain hydration or serious systemic illness","Same-day ENT, neurological or hospital assessment per local pathway"],
         ["<b>Same day or urgent</b>","Severe vomiting, dehydration, inability to mobilise or diagnostic uncertainty","Same-day hospital assessment or urgent review"],
         ["<b>By severity</b>","Clinically safe presumed peripheral AVS","Short-interval review according to severity, ability to hydrate and home support; earlier if deteriorating"],
         ["<b>When function remains limited</b>","Persistent functional imbalance or visual-motion sensitivity","Stop suppressants; reassess gait and hearing; vestibular rehabilitation"],
         ["<b>Persistent, recurrent or atypical</b>","Persistent symptoms, recurrent episodes, atypical features, or unilateral auditory symptoms","ENT, audiovestibular medicine or a balance service"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"Stroke safety-net", html:"\"Sudden severe headache, double vision, slurred speech, face or limb weakness, or being unable to stand or walk — call 999.\""},
         {tone:"red", h:"Hearing safety-net", html:"\"If you lose hearing suddenly, contact us the same day — it needs to be seen within 24 hours. Ear pain with blisters, or weakness of the face, also needs seeing the same day.\""},
         {tone:"cream", h:"GP management", html:"The central assessment, the hearing check, short-term relief, supportive care and the review points belong here. Local routes: Greater Manchester stroke referral, the Bolton same-day emergency pathway, local ENT on-call or urgent referral, audiovestibular medicine, and the vestibular rehabilitation or balance service. Related pages: <a href='bppv.html'>BPPV</a> · <a href='menieres.html'>Ménière's disease</a> · <a href='../algorithms/vertigo.html'>vertigo pathway</a> · <a href='tia-stroke.html'>stroke and TIA</a>."}
       ]},
       {b:"say", html:"This looks like an inflamed balance nerve, which usually settles over days to weeks. The anti-sickness tablets are for a few days at most — usually no more than two or three. Keep sipping fluids, and come back if you can't keep them down. Rest while it's at its worst, then start moving again gradually, with someone to help you at first — that's what helps the balance system recover — and we can arrange balance exercises if your balance or day-to-day activities are still affected once the worst has settled. Don't drive while you're dizzy or on the tablets. If you develop double vision, slurred speech, weakness, a severe headache, can't stand, or lose your hearing suddenly, get help straight away."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 48-year-old man woke <b>yesterday</b> with constant spinning and vomiting after a cold. He can walk with support. Hearing is normal. He has <b>horizontal nystagmus beating one way</b>. He smokes and has hypertension, and asks for tablets to stop the dizziness so he can drive to work."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Treats this as acute vestibular syndrome and assesses for a central cause first; is honest about HINTS competence and knows to refer if not trained; checks hearing and knows the NG98 windows; prescribes one vestibular suppressant for the shortest practical course (often no more than 2–3 days) with cautions; advises no driving; explains gradual mobilisation and rehabilitation; and gives a clear stroke and hearing safety-net."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Named sources, with local practical recommendations labelled as such.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG127 — Suspected neurological conditions: recognition and referral</b><br><a href="https://www.nice.org.uk/guidance/ng127" rel="noopener">nice.org.uk/guidance/ng127</a><span class="rd"> — HINTS only if trained; immediate referral if not; sudden dizziness with focal deficits, new unsteadiness or new deafness; Hallpike for positional symptoms</span></li>'+
         '<li><b>NICE NG98 — Hearing loss in adults: assessment and management</b><br><a href="https://www.nice.org.uk/guidance/ng98" rel="noopener">nice.org.uk/guidance/ng98</a><span class="rd"> — sudden hearing loss referral windows: immediate (seen within 24 hours), or urgent (within 2 weeks)</span></li>'+
         '<li><b>Greater Manchester Medicines Management Group formulary — central nervous system</b><br><a href="https://www.greatermanchesterformulary.nhs.uk/" rel="noopener">greatermanchesterformulary.nhs.uk</a><span class="rd"> — prochlorperazine 5 mg tablets and 3 mg buccal tablets for acute symptoms only; cyclizine as an acute option</span></li>'+
         '<li><b>MHRA product SPCs — Buccastem / prochlorperazine 3 mg buccal tablets (PL 16853/0101); Valoid / cyclizine hydrochloride 50 mg tablets (PL 20072/0241)</b><br><a href="https://products.mhra.gov.uk/" rel="noopener">products.mhra.gov.uk</a><span class="rd"> — formulation-specific doses, licensing and cautions; check the current SPC for the exact product prescribed</span></li>'+
         '<li><b>NICE NG252 — Rehabilitation for chronic neurological disorders including acquired brain injury</b><br><a href="https://www.nice.org.uk/guidance/ng252" rel="noopener">nice.org.uk/guidance/ng252</a><span class="rd"> — targeted exercises for stability, mobility and vestibular problems where indicated</span></li>'+
         '<li><b>Local practical recommendations</b><span class="rd"> — the 2–3-day suppressant limit, review intervals, formulation and dose choices and vestibular rehabilitation timing are based on pharmacological principles and local formulary practice, not directly specified by NICE</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Suspected vestibular neuronitis and labyrinthitis (adults over 16). Acute sustained vertigo with nausea and unsteadiness is acute vestibular syndrome: assess for posterior-circulation stroke and other central causes first. Use HINTS only if trained and experienced; otherwise refer immediately via the stroke pathway (NICE NG127). Sudden hearing loss over 3 days or less within the past 30 days: immediate ENT or ED referral, seen within 24 hours (NICE NG98) — 999 only with stroke features. Once a peripheral cause is judged safe: one vestibular suppressant only if required, for the shortest practical course (often no more than 2–3 days — a local practical rule), oral fluids if tolerated, gradual supported mobilisation and vestibular rehabilitation when imbalance or functional limitation persists. Sources: NICE NG127, NICE NG98, NICE NG252, Greater Manchester formulary, product SPCs."
});
</script>
