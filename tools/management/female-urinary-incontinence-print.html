    {tone:"red", h:"\u26a0 Dipstick before you label it", html:"<b>Visible haematuria is a cancer flag, not an incontinence symptom.</b> NG12: aged 45 and over (\u226545) with unexplained visible haematuria without UTI \u2014 or visible haematuria that persists or recurs after successful treatment of a UTI \u2014 <b>2WW bladder and renal cancer</b>. Aged 60 and over (\u226560) with non-visible haematuria plus dysuria or a raised white cell count \u2192 2WW bladder cancer. Bladder carcinoma can present as urgency with painless haematuria in up to 20% of cases \u2014 examine the abdomen and dipstick every patient before calling it stress or urge incontinence.", src:"NICE NG12"},

       {b:"warn", html:"<b>Visible haematuria is never a symptom of stress or urge incontinence.</b> Send an MSU if infection is plausible, but a visible bleed still needs the cancer pathway \u2014 and every fresh episode of haematuria needs the 2WW route unless the patient is already referred."},
       {b:"table", head:["Red flag","Points to","Action"], rows:[

    {id:"confirm", nav:"Confirm the type", title:"Define the type \u2014 it dictates the whole plan", sub:"Treatment differs fundamentally by subtype; the wrong first-line treatment simply fails.",
     blocks:[
       {b:"table", head:["Type","Symptom pattern","Mechanism / note"], rows:[
         ["<b>Stress UI (SUI)</b>","Leakage on coughing, sneezing, laughing, exercise or lifting. <b>No preceding urge sensation</b>, typically small volumes","Urethral sphincter and pelvic-floor weakness (childbirth, age, prolapse). <b>The commonest type in younger women</b>"],
         ["<b>Urgency UI (UUI) / OAB</b>","A <b>sudden compelling urge to void followed by leakage</b> \u2014 often cannot reach the toilet in time; frequency, nocturia","Detrusor overactivity. <b>Key discriminator: the urgency precedes the leak.</b> Exclude UTI, caffeine and diabetes"],
         ["<b>Mixed UI</b>","Symptoms of both","<b>Identify which is predominant \u2014 that guides the first treatment.</b> Common in older women"],
         ["<b>Overflow UI</b>","Constant dribbling, incomplete emptying, straining to void","Consider after previous pelvic surgery, in neurological disease, or with severe prolapse. <b>Refer \u2014 and never give antimuscarinics</b>"],
         ["<b>Functional UI</b>","Unable to reach the toilet for mobility or cognitive reasons rather than bladder pathology","Assess cognition and mobility (MMSE, mobility assessment); prompted or timed voiding and carer support"]
       ]},
       {b:"dl", rows:[
         ["<b>Key questions</b>","Frequency, nocturia, <b>pad use per day</b>, quality-of-life impact, duration, <b>obstetric history and parity</b>, menopausal status, medications (diuretics, ACE-inhibitor cough), fluid intake and caffeine intake, and how much it bothers her"],
         ["<b>ICIQ-SF score (ICI-Q-SF)</b>","The validated <b>3-question</b> tool (frequency + volume + impact), recommended by NICE as an objective severity measure: 1\u20135 mild, 6\u201312 moderate, 13\u201318 severe, 19\u201321 very severe. Use it to guide management and to monitor response"],
         ["<b>3-day bladder diary</b>","Request it at the first consultation: times voided, volumes, leakage episodes, urgency severity and fluid intake. <b>The most valuable diagnostic tool in primary care</b> \u2014 it exposes nocturnal polyuria (which needs desmopressin, not an antimuscarinic), excessive or inadequate fluid intake and the caffeine load. Total volume &lt;1.5 L/day suggests under-hydration; &lt;8 voids a day is normal. Essential before specialist referral"],
         ["<b>How far the history gets you</b>","The history alone classifies the type in about <b>75% of cases</b> (NG123). PFMT is first-line for stress; bladder training plus, if needed, an antimuscarinic is first-line for urgency \u2014 using the wrong one fails the patient and wastes the appointment"]
       ]}
     ]},

    {id:"reversibles", nav:"Reversibles", title:"DIAPPERS \u2014 exclude the reversible causes first", sub:"Up to 30% of incontinence has a reversible cause. Treat it before labelling the incontinence as primary.",
     blocks:[
       {b:"table", head:["","Cause","What to do"], rows:[
         ["<b>D</b>","Delirium","Acute confusion means she cannot recognise or respond to the urge \u2014 address the underlying cause"],
         ["<b>I</b>","Infection","UTI causes transient urgency and frequency. <b>Always dipstick.</b> Nitrites or leucocytes \u2192 MSU and treat. <b>Do not treat asymptomatic bacteriuria in non-pregnant women</b>"],
         ["<b>A</b>","Atrophic vaginitis","Post-menopausal oestrogen deficiency \u2192 urgency, frequency, dysuria. Pale, thin, dry mucosa on examination. <b>Topical oestrogen resolves symptoms in 60\u201380% within 3 months</b>, with minimal systemic absorption \u2014 under-recognised because women rarely volunteer vaginal symptoms"],
         ["<b>P</b>","Pharmacological","<b>Diuretics</b> (urgency), <b>ACE inhibitors</b> (cough \u2192 repeated Valsalva \u2192 stress leak; <b>switch to an ARB</b>), antipsychotics and opioids (retention \u2192 overflow), sedatives, \u03b1-blockers, calcium-channel blockers. <b>Review the medication list every time</b>"],
         ["<b>P</b>","Psychological","Anxiety, depression, severe mental illness \u2014 consider when a functional aetiology dominates the history"],
         ["<b>E</b>","Endocrine / excess urine output","Diabetes mellitus (polyuria, recurrent UTI), diabetes insipidus (high volumes), heart failure, hypercalcaemia. <b>Check HbA1c in new presentations</b>"],
         ["<b>R</b>","Restricted mobility","Cannot reach the toilet in time \u2192 functional incontinence. Physiotherapy, walking aids, a commode near the bed"],
         ["<b>S</b>","Stool impaction","Faecal loading causes detrusor instability and urgency. History of constipation, PR examination. <b>Treat the constipation first</b>"]
       ]},
       {b:"why", html:"NG123 is explicit that reversible causes come first. UTI is the commonest and will not respond to pelvic-floor exercises; atrophic vaginitis is only found on examination; ACE-inhibitor cough drives genuine stress leakage and resolves on switching to an ARB. These are the classic examination traps and the classic real-life ones."}
     ]},

    {id:"exam", nav:"Examination", title:"Targeted examination \u2014 what changes the plan", sub:"Purposeful, not comprehensive. A chaperone is always required for pelvic examination.",
     blocks:[
       {b:"table", head:["Examination","Looking for","Threshold / action"], rows:[
         ["Abdominal","Distended bladder (palpable, percussion dullness), pelvic masses","<b>Palpable bladder \u2192 residual and urgent referral</b>; mass \u2192 2WW gynaecology"],
         ["<b>BMI</b>","Obesity \u2014 <b>BMI &gt;30</b> is an independent risk factor for stress UI","<b>BMI \u226530 \u2192 target 5\u201310% weight loss</b> (a minimum of about 5 kg); refer to the NHS weight-management programme"],
         ["Vaginal / perineal","Atrophy (pale, thin, dry mucosa); <b>pelvic organ prolapse</b> \u2014 ask her to cough or strain and look for cystocele, rectocele or vault prolapse; exclude fistula (constant leakage)","Grade prolapse (POP-Q or Baden-Walker); grade \u22653 needs gynaecology referral before starting conservative treatment"],
         ["<b>Cough stress test</b>","Immediate leakage at the urethral meatus on coughing with a full bladder, standing if possible","Immediate leak confirms stress UI (about 86% sensitivity with a full bladder); delayed leakage suggests urgency UI"],
         ["Neurological screen","<b>Perianal sensation (S2\u2013S4)</b>, anal tone on PR if indicated, lower-limb reflexes","Absent ankle jerks \u2192 peripheral neuropathy \u2192 overflow risk. Upper motor neurone signs \u2192 neurology. Screens for cord compression, MS and diabetic autonomic neuropathy"],
         ["Pelvic-floor assessment","Contraction strength on the <b>modified Oxford scale (0\u20135)</b> if trained \u2014 0 = no contraction, 5 = strong contraction against resistance","Guides PFMT intensity; if she cannot contract, specialist PFMT with biofeedback or electrical stimulation"],
         ["<b>Post-void residual</b>","Bladder scan after voiding, or ultrasound if no scanner","PVR over 150 mL suggests voiding dysfunction or retention \u2014 refer, and withhold antimuscarinics"]
       ]}
     ]},

    {id:"workup", nav:"Work-up", title:"Investigations \u2014 and the ones not to order", sub:"Most incontinence is managed in primary care without extensive investigation. Investigate only where it changes management.",
     blocks:[
       {b:"table", head:["Test","When","Why"], rows:[
         ["<b>Urine dipstick (urinalysis)</b>","<b>Urinalysis in every patient \u2014 mandatory</b>","Nitrites or leucocytes \u2192 MSU; <b>blood \u2192 haematuria pathway regardless of other findings</b>; glucose \u2192 diabetes screen; protein \u2192 renal disease"],
         ["MSU for culture","Dipstick suggests UTI, or recurrent UTI","Confirms infection before treatment. <b>Do not treat asymptomatic bacteriuria in non-pregnant women</b>"],
         ["<b>3-day bladder diary</b>","All \u2014 request at the first visit","Diagnosis, behavioural-therapy targets and objective monitoring"],
         ["HbA1c","Polyuria, polydipsia, recurrent infections, or diabetes risk factors","Uncontrolled diabetes causes an osmotic diuresis that mimics OAB"],
         ["U&amp;E / renal function","Recurrent UTI, suspected retention, hypertension, or before an antimuscarinic in an older woman","Renal impairment alters drug clearance"],
         ["Post-void residual ultrasound","Suspected overflow \u2014 constant dribbling, straining to void, previous pelvic surgery, neurological disease","<b>PVR over 150 mL \u2192 refer urology or urogynaecology</b>"],
         ["Urodynamics (cystometry, uroflowmetry)","<span class='src'>Specialist only</span> Diagnosis unclear after history and examination, failed primary-care treatment, before surgery, or suspected voiding dysfunction","<b>Not routine in primary care</b> \u2014 it adds cost and delay without changing initial management"],
         ["<b>Do NOT routinely order</b>","Cystoscopy, urodynamics, renal ultrasound","Specialist investigations; uncomplicated stress or urgency UI does not need them to be managed well"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"purple", h:"NG12 in this presentation", html:"The cancer link in female incontinence is <b>haematuria</b>, plus the pelvic mass and post-menopausal bleeding routes. Visible haematuria aged \u226545 without UTI (or persisting/recurring after UTI treatment) \u2192 2WW bladder and renal cancer. Non-visible haematuria aged \u226560 with dysuria or a raised WCC \u2192 2WW bladder cancer. Recurrent or persistent unexplained UTI aged \u226560 \u2192 consider non-urgent bladder-cancer referral.", src:"NICE NG12 (May 2025)"},
         {tone:"cream", h:"Where the sources differ \u2014 read this once", html:"Older guidance said <b>haematuria at any age \u2192 2WW</b> and quoted <b>2WW for visible or non-visible haematuria in women aged 60 and over</b>. <b>NG12 is the rule</b> and its thresholds are the ones above. The pathway\u2019s lower threshold is kept here as a safety-first stance rather than a referral criterion: <b>visible haematuria at any age always needs explanation</b> \u2014 under 45 that means urology or nephrology assessment, not the 2WW route, and not watchful waiting."}
       ]}
     ]},

    {id:"conservative", nav:"Conservative", title:"Type-led conservative therapy \u2014 always first-line", sub:"Lifestyle and behavioural therapy are core treatment, not an afterthought. Quantify the effect \u2014 it motivates.",
     blocks:[
       {b:"table", head:["Intervention","For","Detail and target"], rows:[
         ["<b>Supervised PFMT</b>","Stress / mixed","<b>\u22658 contractions \u00d7 3 sets daily for a minimum of 3 months</b> before offering a drug \u2014 first-line. Self-directed version: <b>8 sustained contractions of about 10 seconds \u00d7 3 sets daily</b>. Refer to a continence nurse or physiotherapist: <b>supervised beats a leaflet</b>. Consider <b>biofeedback or electrical stimulation if she cannot contract</b>. Teach <b>the Knack</b> \u2014 contract the pelvic floor before coughing or sneezing. The <b>Squeezy</b> NHS app aids adherence"],
         ["<b>Bladder training</b>","Urgency / OAB","<b>Minimum 6 weeks.</b> Scheduled voiding, lengthening intervals by about 15 minutes each week towards intervals of 3\u20134 hours, with urge-suppression techniques (distraction, perineal pressure). Support it with a written retraining programme"],
         ["<b>Weight loss</b>","BMI \u226530","5\u201310% loss reduces incontinence episodes by 50\u201360% in obese women (PRIDE) \u2014 the single most effective intervention in overweight women with stress UI. Target at least about 5 kg"],
         ["<b>Caffeine reduction</b>","Urgency","Reduce to &lt;200 mg/day (roughly 2 standard coffees) \u2014 this cuts urgency episodes by about 25\u201330%. Caffeine is a direct detrusor irritant; switch to decaffeinated and quantify intake from the diary"],
         ["Fluid management","All","<b>Aim 1.5\u20132 L/day.</b> Do not under-drink \u2014 concentrated urine irritates the bladder and worsens urgency; avoid excess. Spread intake across the day and <b>reduce after about 6 pm for nocturia</b>"],
         ["Smoking cessation","All, especially stress UI","Chronic cough worsens stress leakage, and smoking is a bladder-cancer risk factor. NHS Stop Smoking Service, NRT or varenicline"],
         ["Cough and constipation","All","Treat chronic cough (including <b>ACE-inhibitor cough \u2014 switch to an ARB</b>) and constipation: fibre, hydration, a regular toilet routine, lactulose or macrogol if needed. Straining worsens pelvic-floor dysfunction and faecal loading directly causes detrusor instability"],
         ["Vaginal pessary","Prolapse-associated stress UI","A ring, incontinence or shelf pessary supports the bladder neck \u2014 useful where prolapse coexists or surgery is declined or unsuitable. Fitted by a continence nurse specialist, gynaecology, or a GP with extended training"],
         ["Containment products","Interim or refractory","Pads, pants and sheath systems (for example Tena, Kylie, Conveen ranges, prescribable on FP10) with skin care. NICE recommends these as an interim measure and an adjunct \u2014 never a substitute for treatment \u2014 but they preserve dignity while treatment works, or long-term when other options are exhausted. Refer to the continence service for product assessment"],
         ["Psychological support","All","Incontinence has real effects on mood, sexual function and social isolation. Screen with <b>PHQ-9 / GAD-7</b>; CBT or mindfulness for OAB-related anxiety; signpost <b>Bladder &amp; Bowel UK</b>"]
       ]},
       {b:"why", html:"<b>PFMT:</b> Cochrane 2018 (Dumoulin) found PFMT far more effective than no treatment for cure of stress UI (RR 8.38), and 3 months is the minimum needed to see benefit \u2014 supervised programmes outperform unsupervised advice (RR 0.87 for cure or improvement). <b>PRIDE (NEJM 2009):</b> a 47% reduction in incontinence episodes with \u22658% weight loss versus 28% in controls. <b>Caffeine:</b> reducing to &lt;100 mg/day cut urgency episodes by about 25% (Bryant 2002). <b>The Knack</b> reduces stress leakage by about 73% (Miller 2008). Lifestyle change is not \u201ctry this instead of treatment\u201d \u2014 it is the treatment."}
     ]},

       {b:"warn", html:"<b>No effective first-line drug exists for stress urinary incontinence</b> \u2014 conservative therapy and then surgery are the mainstays. <b>Antimuscarinics are contraindicated in overflow or retention</b>, and cumulative anticholinergic burden in older or frail women means falls, confusion and dementia risk."},

          splits:[
            {cond:"Preferred \u2014 lower CNS penetration", drug:"Solifenacin 5 mg OD", note:"Increase to 10 mg OD if the response is inadequate at 4 weeks. Lower cognitive side-effect profile than oxybutynin. <b>Review at 4 weeks</b>"},
            {cond:"Alternatives", drug:"Tolterodine 2 mg BD (or MR 4 mg OD) \u00b7 trospium", note:"Similar efficacy. Counsel dry mouth, constipation, blurred vision, urinary retention"},
            {cond:"Avoid", drug:"Oxybutynin \u2014 avoid in frail or older women", note:"High CNS penetration \u2192 confusion, cognitive impairment, falls; NICE NG123 advises avoiding oxybutynin in older people because of dementia risk. If used at all: immediate release 2.5\u20135 mg TDS"}
          ]},
         {step:"OAB 2nd", title:"Mirabegron", when:"antimuscarinic unsuitable, not tolerated or ineffective", fromLabel:"frail, cognitive concern, or high anticholinergic load",
          splits:[
            {cond:"Dose", drug:"50 mg OD (25 mg in renal or hepatic impairment)", note:"Beta-3 agonist \u2014 <b>no anticholinergic load, so preferred in older women</b>"},
            {cond:"Caution", drug:"Check BP before starting and at the 4-week review", note:"<b>Contraindicated in severe uncontrolled hypertension (BP &gt;180/110)</b>"}
          ]},
         {step:"OAB 3rd", title:"Combination \u2014 mirabegron plus an antimuscarinic", when:"monotherapy inadequate", fromLabel:"specialist-initiated",
          html:"Specialist-initiated. Increased risk of urinary retention \u2014 check the post-void residual."},
         {step:"Atrophy", title:"Topical vaginal oestrogen", when:"post-menopausal with vaginal atrophy", fromLabel:"treat alongside, at any rung",
          html:"Estradiol 10 microgram pessary (Vagifem / Vagirux) daily for 2 weeks then twice weekly, or estriol cream (Ovestin) 0.5 mg daily for 2\u20133 weeks then twice weekly. Long-term use is safe \u2014 minimal systemic absorption and <b>no progestogen needed with topical vaginal oestrogen</b>. Helps OAB symptoms and genitourinary syndrome of the menopause. <b>Systemic HRT does not treat incontinence and may worsen it</b> \u2014 offer it for vasomotor symptoms per NG23, not for the bladder (combined HRT if she has an intact uterus)."},
         {step:"Stress UI", title:"Duloxetine \u2014 second-line only", when:"surgery declined or unsuitable", fromLabel:"NOT first-line",
          html:"<b>40 mg BD, starting 20 mg BD for 2 weeks to reduce nausea.</b> Offer only if PFMT is declined or inadequate <em>and</em> she is not planning surgery. NNT of about 3 for a 50% reduction in leakage episodes, but around half discontinue because of nausea \u2014 counsel carefully, warn about discontinuation effects, and taper to stop."},
         {step:"3rd-line", title:"Specialist procedures", when:"refractory OAB or stress UI", fromLabel:"after an adequate trial of two drug classes",
          html:"<b>Intravesical botulinum toxin A (onabotulinumtoxinA 100 units)</b> \u2014 70\u201380% response in refractory urgency UI, lasting 6\u20139 months; <b>she must accept the possibility of self-catheterisation</b>. <b>Sacral neuromodulation</b> or <b>percutaneous tibial nerve stimulation (PTNS)</b>. For stress UI: colposuspension, autologous or mid-urethral sling (TVT/TOT), or bulking agents \u2014 mesh mid-urethral slings are restricted, so shared decision-making and registry entry apply (NICE NG123 mesh guidance)."}
       ]},
       {b:"why", html:"<b>Antimuscarinics:</b> NNT of about 5 for one extra dry day a week versus placebo \u2014 a modest effect that has to be weighed against anticholinergic harm. The <b>MHRA 2021</b> drug-safety advice links long-term anticholinergic use, oxybutynin especially, with dementia risk; mirabegron avoids it. <b>Botulinum toxin A</b> gives 70\u201380% response in drug-refractory urgency UI for 6\u20139 months."}
     ]},

    {id:"groups", nav:"Special groups", title:"Populations that change the plan", sub:"Same diagnosis, different first move.",
     blocks:[
       {b:"table", head:["Group","What changes"], rows:[
         ["<b>Pregnancy and postnatal</b>","<b>Antenatal and postnatal PFMT both prevents and treats</b> \u2014 first-line; avoid drugs. Most postnatal stress UI improves \u2014 review at 3 months and refer if it persists"],
         ["<b>Post-menopausal</b>","<b>Vaginal atrophy is a common and treatable driver</b> \u2192 topical oestrogen. <b>Systemic HRT does not treat incontinence and may worsen it.</b> Ask about post-menopausal bleeding (NG12 2WW aged 55 and over)"],
         ["<b>Frail or older women</b>","<b>Minimise anticholinergic burden</b> (falls, confusion, dementia) \u2014 <b>mirabegron preferred</b>. Treat constipation and mobility, consider timed toileting and containment, and check renal function before an antimuscarinic"],
         ["<b>Cognitive impairment</b>","Prompted or timed voiding with carer support; <b>antimuscarinics worsen cognition</b> \u2014 monitor with MMSE or MoCA if there is any concern and stop the drug if cognition declines"],
         ["<b>Neurological disease (MS, stroke, spinal)</b>","Assume complex \u2014 <b>higher retention risk, so check the residual before any antimuscarinic</b>; specialist or neuro-urology input"],
         ["<b>Obesity</b>","<b>Weight loss is a genuine treatment</b> \u2014 5\u201310% meaningfully reduces stress UI"],
         ["<b>Previous pelvic surgery or radiotherapy</b>","Higher risk of fistula, voiding dysfunction and overflow \u2192 residual measurement and urogynaecology referral rather than empirical drugs"]
       ]}
     ]},

    {id:"monitor", nav:"Review", title:"The review rhythm \u2014 and what each review is for", sub:"Structured follow-up is what makes conservative therapy work; most failures are technique and adherence, not the wrong diagnosis.",
     blocks:[
       {b:"table", head:["When","What to check","Action"], rows:[
         ["<b>4\u20136 weeks</b>","Bladder diary completed? PFMT adherence <b>and technique</b>; drug tolerability; <b>repeat ICIQ-SF and document the change from baseline</b>; MSU result","Correct technique (many bear down instead of lifting); reinforce lifestyle; adjust or switch the drug"],
         ["<b>OAB drug at 4 weeks</b>","Effect versus side effects: dry mouth, constipation, blurred vision, retention symptoms, and <b>cognition in older women (MMSE/MoCA if concerned)</b>","Increase solifenacin to 10 mg if under-treated; <b>stop if cognitive decline is suspected</b>; switch class if poorly tolerated"],
         ["<b>Mirabegron</b>","<b>BP before starting and at the 4-week review</b>; retention symptoms if combined with an antimuscarinic","Stop if BP is uncontrolled (contraindicated above 180/110); check residual if retention is suspected"],
         ["<b>3 months</b>","Full response assessment, repeat ICIQ-SF","&lt;50% improvement in stress UI \u2192 physiotherapist-supervised PFMT or urogynaecology. &lt;50% improvement in urgency UI on bladder training \u2192 add an antimuscarinic or mirabegron"],
         ["Topical oestrogen","Response at 3 months","Long-term use is safe with <b>no scheduled monitoring</b>; review continuing need at the annual medication review"],
         ["Anticholinergic burden","Every review in older women","Reduce cumulative load; consider switching to mirabegron"],
         ["<b>6\u201312 months</b>","Sustained benefit","Consider stepping down if much improved; reassess if symptoms recur. Warn that symptoms can return after the menopause, with weight gain, or with a new medicine"],
         ["Records / QOF","Incontinence is <b>not currently a QOF indicator</b>","Document diagnosis, <b>type, ICIQ-SF score, treatment offered and review date</b>; review opportunistically at diabetes, hypertension and menopause reviews"]
       ]},
       {b:"cards", items:[
         {tone:"amber", h:"Not improving? Check these before calling it refractory", html:"<b>1 \u00b7 Right type treated?</b> Did the treatment match the dominant type. <b>2 \u00b7 Adherence and technique</b> \u2014 PFMT done correctly and supervised; bladder training sustained for 6 weeks. <b>3 \u00b7 Reversibles</b> \u2014 UTI, atrophy, constipation, diuretics, glucose all addressed. <b>4 \u00b7 Drug trial</b> \u2014 an adequate trial and a switch tried. <b>5 \u00b7 Overflow?</b> Incomplete emptying or dribbling \u2192 check the residual; antimuscarinics make it worse. <b>6 \u00b7 Then refer</b> \u2014 urogynaecology or the continence service."}
       ]},
       {b:"tiles", v:"safety", items:[
         {t:"\ud83d\udd34 999", html:"\u201cNew weakness in both legs, numbness around the saddle area, severe perineal pain, or you suddenly cannot pass urine at all \u2014 that is a 999 problem, not one to wait on.\u201d"},
         {t:"\u26a0\ufe0f Same-day", html:"\u201cIf you cannot pass urine and have suprapubic pain, or you see fresh blood in the urine and are not already being investigated \u2014 contact us the same day.\u201d"},
         {t:"\ud83e\ude78 Any blood", html:"\u201cBlood in the urine \u2014 always tell us. It needs investigating even if it settles, and even if you have had it before.\u201d"},
         {t:"\ud83d\udca7 Overflow", html:"\u201cConstant dribbling with a feeling that you never empty \u2014 let us know; the bladder may not be emptying properly.\u201d"},
         {t:"\ud83e\uddda Infections and pain", html:"\u201cRepeated infections, new pelvic pain, or any bleeding after the menopause \u2014 get assessed rather than treated over the phone.\u201d"},
         {t:"\ud83e\udde0 Bladder-tablet effects", html:"\u201cConfusion, constipation or a very dry mouth on the bladder tablet \u2014 tell us and we will switch it.\u201d"},
         {t:"\ud83d\udcc5 No better at 3 months", html:"\u201cIf the exercises or bladder training have not helped after three proper months, come back \u2014 that is the point at which we change the plan.\u201d"}
       ]},
       {b:"say", html:"Incontinence is common and very treatable \u2014 and the right approach depends on which type you have, which is why the diary matters. The exercises or bladder training help most women, but they take a few months to work, so stick with them; if we don\u2019t get you there, the continence specialists have effective options."}
     ]},

    {id:"loop", nav:"Not responding?", title:"Not improving? Re-check before referral", sub:"",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"1 · Right type treated?", html:"Did treatment match the dominant type (stress vs urgency)?"},
         {tone:"blue", h:"2 · Adherence", html:"PFMT done correctly + supervised; bladder training sustained ≥6 weeks?"},
         {tone:"blue", h:"3 · Reversibles", html:"UTI, atrophy, constipation, diuretics, glucose all addressed?"},
         {tone:"blue", h:"4 · Drug trial", html:"Adequate OAB drug trial, and a switch tried, before calling it refractory?"},
         {tone:"amber", h:"5 · Overflow?", html:"Incomplete emptying / dribble → check residual (antimuscarinics make it worse)."},
         {tone:"blue", h:"6 · Refer", html:"Refractory → urogynaecology / continence service."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer \u2014 who goes where, and what secondary care offers", sub:"Most female incontinence is managed entirely in primary care. Knowing when not to refer matters as much as knowing when to.",
     blocks:[
       {b:"table", head:["Route","Trigger"], rows:[
         ["<span class='mg-pill mg-pill-red'>999 / same-day</span>","<b>Acute urinary retention</b> (unable to void, suprapubic pain, distended bladder). New neurological symptoms with incontinence \u2014 suspected cauda equina. Suspected sepsis from a urinary source"],
         ["<span class='tw'>2WW urology</span>","<b>NICE NG12:</b> unexplained <b>visible haematuria aged 45 and over</b> without UTI, or visible haematuria persisting or recurring after successful UTI treatment; non-visible haematuria aged 60 and over with dysuria or a raised white cell count. Suspected bladder or urethral malignancy"],
         ["<span class='tw'>2WW gynaecology</span>","<b>NG12:</b> a <b>pelvic or abdominal mass</b> not obviously fibroids (with or without ascites); <b>post-menopausal bleeding aged 55 and over</b>. <b>CA-125 \u226535 IU/mL \u2192 urgent abdominal and pelvic ultrasound</b>"],
         ["Non-urgent cancer referral","NG12: recurrent or persistent unexplained UTI aged 60 and over \u2192 consider non-urgent direct referral for bladder cancer. Also consider urology for \u22653 UTIs in 12 months with no clear cause"],
         ["Urogynaecology (stress UI)","<b>Refractory after at least 3 months of supervised PFMT</b> \u2192 surgical options. Diagnostic complexity needing urodynamics. <b>Prolapse grade \u22653 coexisting with incontinence.</b> Considering surgery. Previous pelvic surgery or radiotherapy"],
         ["Specialist continence service (OAB)","Refractory after bladder training plus an adequate trial of \u22652 drugs. Also for supervised PFMT where symptoms are moderate to severe (ICIQ-SF \u22656) before drug treatment, and for containment product assessment"],
         ["Urology (non-cancer)","Recurrent UTI with no clear cause; <b>suspected vesico-vaginal fistula</b> (constant wetness, no urge); <b>PVR over 150 mL on two occasions</b>; voiding dysfunction that is not resolving"],
         ["Complex / neurological","Neurogenic bladder, fistula, previous failed surgery, high residual \u2192 <b>urodynamics first</b>"],
         ["<b>Keep in primary care</b>","Uncomplicated stress UI with a normal examination; urgency UI with no haematuria or mass; mixed UI \u2014 treat the dominant component; <b>mild symptoms (ICIQ-SF \u22645)</b> \u2014 conservative therapy first"]
       ]},
       {b:"table", head:["Secondary-care option","For","Note"], rows:[
         ["Urodynamics","Diagnostic uncertainty or pre-surgery","Confirms the type before invasive treatment"],
         ["Colposuspension / autologous sling","Stress UI","<b>Mesh mid-urethral slings are now restricted</b> \u2014 shared decision-making and registry entry"],
         ["Mid-urethral sling (TVT / TOT)","Stress UI","Counsel mesh complications per NICE NG123"],
         ["Bulking agents","Stress UI","Less effective but less invasive; day-case"],
         ["Botulinum toxin A (detrusor)","Refractory OAB","onabotulinumtoxinA 100 units, 70\u201380% response for 6\u20139 months \u2014 she must accept possible self-catheterisation"],
         ["Sacral neuromodulation / PTNS","Refractory OAB","For drug-refractory urgency UI"]
       ]},
       {b:"say", html:"You\u2019ve given the exercises and the tablets a fair go \u2014 the continence specialists can offer the next options, from bladder Botox injections to supportive surgery, and they\u2019ll do detailed bladder-pressure tests first to pick the right one for you."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only \u2014 the Casebook keeps the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 58-year-old woman, three years post-menopausal, asks for \u201csomething for my waterworks\u201d. She leaks when she coughs but also rushes to the toilet, has had two courses of antibiotics for cystitis this year, takes ramipril and has a troublesome dry cough, and mentions in passing that she saw blood in the urine once last month. She has stopped going to her exercise class."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Separates <b>stress from urgency and names the dominant component</b>; asks about pad use and impact rather than only frequency; acts on the single episode of visible haematuria \u2014 NG12 2WW urology aged 45 and over, and does not let the UTI history explain it away; identifies the <b>ACE-inhibitor cough</b> and offers an ARB switch; examines with a chaperone for <b>atrophy and prolapse</b> and offers <b>topical oestrogen</b>; sets up <b>supervised PFMT for 3 months plus a bladder diary and ICIQ-SF</b> rather than reaching for an antimuscarinic; and safety-nets blood in the urine explicitly. <a href='../../cases/urinary-incontinence.html'>Open the full casebook chapter \u2192</a>"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>NICE NG123 \u2014 Urinary incontinence and pelvic organ prolapse in women: management (2019, updated 2023)<br><a href="https://www.nice.org.uk/guidance/ng123" rel="noopener">nice.org.uk/guidance/ng123</a><span class="rd"> \u2014 type classification, the bladder diary, supervised PFMT for at least 3 months, bladder training for at least 6 weeks, the OAB drug sequence, mirabegron, duloxetine as second-line for stress UI, and referral thresholds; advises against routine urodynamics in primary care</span></li>'+
         '<li><b>NICE NG12 \u2014 Suspected cancer: recognition and referral (May 2025)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> \u2014 bladder and renal cancer: visible haematuria aged 45 and over without UTI, or persisting/recurring after UTI treatment \u2192 2WW; non-visible haematuria aged 60 and over with dysuria or raised WCC \u2192 2WW; recurrent or persistent unexplained UTI aged 60 and over \u2192 consider non-urgent referral. Ovarian: ascites or a pelvic/abdominal mass \u2192 urgent referral, CA-125 \u226535 IU/mL \u2192 urgent ultrasound. Endometrial: post-menopausal bleeding aged 55 and over \u2192 2WW</span></li>'+
         '<li><b>NICE NG23 \u2014 Menopause: diagnosis and management</b><br><a href="https://www.nice.org.uk/guidance/ng23" rel="noopener">nice.org.uk/guidance/ng23</a><span class="rd"> \u2014 topical vaginal oestrogen for genitourinary syndrome of the menopause, long-term use without added progestogen, and systemic HRT decisions</span></li>'+
         '<li><b>MHRA Drug Safety Update 2021 \u2014 anticholinergic burden</b><span class="rd"> \u2014 long-term anticholinergic use, oxybutynin in particular, and dementia risk; minimise cumulative burden in older women</span></li>'+
         '<li>Cochrane 2018 \u2014 Dumoulin et al., pelvic floor muscle training for urinary incontinence in women<span class="rd"> \u2014 PFMT versus no treatment for cure of stress UI (RR 8.38); supervised versus unsupervised programmes (RR 0.87 for cure or improvement)</span></li>'+
         '<li><b>PRIDE trial \u2014 NEJM 2009</b><span class="rd"> \u2014 47% reduction in incontinence episodes with \u22658% weight loss versus 28% in controls; 5\u201310% loss reduces episodes by 50\u201360% in obese women</span></li>'+
         '<li><b>Bryant 2002 (caffeine reduction); Miller 2008 (the Knack)</b><span class="rd"> \u2014 caffeine &lt;100 mg/day reduced urgency episodes by about 25%; a pre-cough pelvic-floor contraction reduced stress leakage by about 73%</span></li>'+
         '<li>NICE NG123 \u2014 urinary incontinence and pelvic organ prolapse in women<span class="rd"> \u2014 restricted use of mesh mid-urethral slings with shared decision-making and registry entry; primary-care operationalisation. ICIQ-SF severity bands and Squeezy app support</span></li>'+
         '<li><b>Bladder &amp; Bowel UK</b><br><a href="https://www.bbuk.org.uk" rel="noopener">bbuk.org.uk</a><span class="rd"> \u2014 patient information, product advice and support</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> \u2014 all doses: solifenacin, tolterodine, trospium, oxybutynin, mirabegron, duloxetine, estradiol pessary, estriol cream</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Female urinary incontinence \u2014 NICE NG123 (2019, updated 2023), NG12 (May 2025), NG23, MHRA 2021 anticholinergic advice, Cochrane 2018 (Dumoulin) and the PRIDE trial, with NICE. Assessment and management are merged on this page; there is no separate female incontinence pathway to cross-check. A chaperone is required for pelvic examination. Verify all doses against the current BNF before prescribing."
