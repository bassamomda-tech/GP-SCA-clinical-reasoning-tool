<script>
MG.render({
  icon:"🦵",
  title:"Leg cramps — the complete guide",
  eyebrow:"Protocol · assess &amp; manage in one place",
  stemTitle:"Cramp is a diagnosis of exclusion — the mimics are the whole risk",
  stemSub:"One page for the whole condition. Exclude DVT, acute limb ischaemia, claudication, MND and severe hypokalaemia before anything else; confirm a TRUE cramp and separate it from restless legs, neuropathy and claudication; screen the treatable secondary causes (the drug chart, CKD, thyroid, and electrolytes including magnesium when risk factors are present); then climb a short ladder where stretching does most of the work and quinine is a last resort with MHRA-grade caution. MHRA 2010 · Cochrane 2015.",
  guideline:"MHRA · Cochrane",
  reviewed:"8 September 2026",
  nextReview:"8 March 2027",
  meta:[
    {t:"MHRA 2010 quinine restriction"},
    {t:"Cochrane 2015 · J Physiother 2012 (Hallegraeff)"},
    {t:"Suspected cancer · NG12 criteria that surface here", tone:"tw"},
    {t:"v2.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:"<div class='mg-layers'><a href='#severe'><b>Red flags</b><small>DVT · ischaemia · MND</small></a><a href='#confirm'><b>Confirm</b><small>True cramp vs the mimics</small></a><a href='#classify'><b>Classify</b><small>Idiopathic vs secondary</small></a><a href='#ladder'><b>Treat</b><small>Stretch · correct causes · (quinine)</small></a></div>",
  quickSub:"If you read nothing else on this page, read these six cards. Every figure traces to the source cited under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ A cold, pale, pulseless, painful leg is not cramp", html:"A suddenly painful, pale or mottled, cold limb with absent or markedly reduced pulses, sensory loss or weakness is <b>acute limb ischaemia</b> (pain, pallor, pulselessness, paraesthesia, paralysis, perishing cold) → 999 for immediate emergency vascular assessment; do not wait for ABPI or imaging. Unilateral calf swelling, pain, warmth or tenderness → <b>formal DVT assessment using the local 2-level Wells pathway</b> — do not diagnose cramp. DVT is <b>commonly mistaken for cramp</b>; in pregnancy, use the pregnancy-specific local pathway."},
    {tone:"amber", h:"Stretching is the treatment — fewer and milder cramps", html:"Nightly calf and hamstring stretches immediately before sleep cut nocturnal cramps by a mean of 1.2 more cramps per night than control at 6 weeks, and reduced their severity (Hallegraeff, J Physiother 2012); many patients add daytime stretches as well. Prescribe it properly: stand facing a wall, knee straight, heel on the floor, hold 30 seconds each leg. <b>Dorsiflexion during a cramp gives immediate relief.</b> It outperforms every drug on this page and has no safety profile to manage."},
    {tone:"blue", h:"Magnesium: test when risk factors are present, replace if low", html:"Consider serum magnesium in patients with frequent, severe or new cramps, particularly with diuretic use, diarrhoea, malabsorption, alcohol excess, CKD or other electrolyte abnormalities — it is NOT included in a standard U&amp;E and must be requested specifically. Serum magnesium is an imperfect marker of total-body magnesium, but a normal level should not justify indiscriminate supplementation. <b>Replace confirmed hypomagnesaemia and correct the underlying cause</b>, according to the local formulary, the preparation's elemental-magnesium content and renal function. <b>Routine magnesium supplementation is not required for every patient with idiopathic cramps</b>, and a fixed over-the-counter dose is not a universal regimen."},
    {tone:"green", h:"Read the drug chart before you prescribe anything", html:"Diuretics (thiazide and loop), statins, beta-agonists, nifedipine, clonazepam withdrawal, alcohol and dialysis all cause cramps. If cramps occur with muscle pain or weakness on a statin, check CK and renal function where clinically indicated; stop and urgently assess if CK is markedly raised (particularly &gt;10× ULN), or if rhabdomyolysis is suspected (severe pain, weakness, dark urine). Once symptoms and CK have resolved, consider a lower dose, alternative statin or intermittent regimen according to cardiovascular risk. Do not stop a statin for isolated uncomplicated cramps without assessing the overall picture. Correcting the cause avoids years of unnecessary treatment."},
    {tone:"amber", h:"Quinine: narrow margin, real deaths, mandatory review", html:"Quinine sulfate 200–300 mg at night reduces cramp number by only ~28% (Cochrane 2015) and has a narrow therapeutic index — cinchonism (tinnitus, dizziness, visual disturbance), rare but severe thrombocytopenia (platelets &lt;10, and it can occur after months of use), irreversible retinal damage at high cumulative doses, and it is dangerous — potentially fatal — in overdose. In June 2010 the MHRA advised that quinine must not be used routinely for nocturnal leg cramps. Consider only for very painful or frequent cramps that regularly disturb sleep, after secondary causes and conservative measures have been addressed: 4-week trial, stop if no clear benefit, reassess at approximately 3 months with a trial stop. Warn the patient to stop and seek advice for tinnitus, hearing or visual disturbance, confusion, unusual bruising, petechiae or bleeding. Check QT-prolongation risk, interactions (including warfarin and digoxin) and renal/hepatic disease against the current SPC. Contraindicated with haemoglobinuria, myasthenia gravis, optic neuritis and tinnitus (SPC); avoid in pregnancy unless specialist advice supports use."},
    {tone:"blue", h:"Restless legs is not cramp — and needs different management", html:"Restless-legs syndrome is commonly misdiagnosed as cramps: an urge to move the limbs, worse at rest and in the evening, without sustained muscle hardening (patients may describe discomfort or occasional brief movements, so the diagnosis remains clinical). Check ferritin/iron status where clinically indicated and treat iron deficiency; review medicines and sleep factors. <b>Do not routinely initiate dopamine agonists in primary care</b> (augmentation and impulse-control risks); refer or seek specialist advice for persistent disease — see the <a href='restless-legs.html'>restless legs protocol</a>. Likewise claudication: pain on walking, reliably reproducible, relieved by standing still rather than sitting — treating that as 'cramp' delays revascularisation."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step is where limbs and lives are lost.",
  pathway:[
    {title:"Exclude serious pathology first", html:"Suddenly painful, pale or mottled, cold limb with absent or markedly reduced pulses, sensory loss or weakness → 999 (acute limb ischaemia — immediate emergency vascular assessment; do not wait for ABPI). Unilateral calf swelling, pain, warmth or tenderness (including in pregnancy) → formal DVT assessment on the local 2-level Wells pathway. Reproducible exertional calf, thigh or buttock pain relieved by rest → intermittent claudication (pulses, cardiovascular risk, ABPI, local PAD pathway); rest pain, tissue loss, gangrene or non-healing ulceration → urgent vascular assessment. Progressive objective weakness, wasting, bulbar symptoms, widespread fasciculations or mixed upper- and lower-motor-neuron signs → urgent neurology. Cramps + severe or symptomatic hypokalaemia (arrhythmia, ECG changes, weakness or paralysis) → 999 or same-day correction.", alert:true},
    {title:"Confirm it is a true cramp", html:"Sudden, painful, involuntary muscle contraction with visible or palpable tightening, calf or foot most commonly, lasting seconds to under 10 minutes, relieved by stretching, tender for hours after. Nocturnal leg cramps are common in older adults; persistent, progressive, atypical or function-limiting cramps need assessment for vascular, neurological, medication-related and metabolic causes. Rule out the three mimics: restless legs, peripheral neuropathy, claudication."},
    {title:"Classify — idiopathic or secondary", html:"Screen: the drug chart, systemic disease (CKD/uraemia, hypothyroidism, diabetes, cirrhosis, PAD), dehydration and overexertion, pregnancy, and — for frequent, severe, new or progressive cramps or relevant risk factors — targeted bloods (U&amp;E, calcium, magnesium when indicated, glucose/HbA1c, TFTs). Typical occasional cramps with a normal examination may need no tests. Examine pulses, lower-limb neurology, calf, muscle bulk, thyroid and fluid status. Most nocturnal cramps in the over-50s are idiopathic — benign but distressing."},
    {title:"Treat the cause, then climb the ladder", html:"1) Correct documented electrolyte or metabolic abnormalities, review the culprit drug, treat thyroid/diabetes/CKD. 2) Stretching — during the cramp and regular calf stretching before bed (plus daytime if wished). 3) Address hydration, excessive exertion, sleep and footwear. 4) Magnesium only when deficiency is demonstrated or strongly suspected. 5) Quinine ONLY if cramps are severe or frequent, regularly disrupt sleep and conservative treatment has failed. No routine vitamin E or vitamin-B preparations."},
    {title:"Review, and stop what isn't working", html:"4–6 weeks: improving? adherence to stretching? electrolyte results? 4 weeks on quinine: stop if no clear benefit. Then approximately every 3 months: reassess need, symptom-led safety check (bruising, bleeding, tinnitus, hearing or visual disturbance), lowest effective dose, stop if ineffective or toxic. Refer if cramps are progressive, atypical, associated with weakness/fasciculations or vascular findings, or the diagnosis is uncertain. Annually: medication review and repeat electrolytes on diuretics or in CKD. As causes are addressed, cramps often settle — avoid indefinite quinine prescribing."}
  ],
  sections:[
    {id:"severe", nav:"Red flags", title:"Red flags — exclude serious pathology first", sub:"Most leg cramps are benign and idiopathic, but several serious conditions present similarly. Exclude before treating symptomatically.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Acute limb ischaemia", html:"<b>A suddenly painful, pale or mottled, cold limb with absent or markedly reduced pulses, sensory loss or weakness is acute limb ischaemia → 999.</b> Classic features: pain, pallor, pulselessness, paraesthesia, paralysis, perishing cold. Arrange immediate emergency vascular assessment; do not delay transfer to measure ABPI or arrange imaging."},
         {tone:"red", h:"🔴 DVT", html:"Unilateral calf swelling, pain, warmth or tenderness requires formal DVT assessment rather than a cramp diagnosis. Use the local 2-level Wells pathway: DVT likely → urgent proximal leg-vein ultrasound, with interim anticoagulation if imaging is delayed; DVT unlikely → D-dimer first, then ultrasound if positive. Do not use D-dimer alone to exclude DVT in pregnancy, after recent surgery, or with cancer, infection or older age, where it is frequently raised. DVT is commonly mistaken for cramp."},
         {tone:"red", h:"🔴 DVT in pregnancy", html:"New unilateral calf swelling, pain, warmth or tenderness in pregnancy requires urgent assessment for DVT using the pregnancy-specific local pathway, rather than attribution to pregnancy-related cramps — pregnancy is a high-risk state."},
         {tone:"amber", h:"🟠 Peripheral arterial disease — claudication vs chronic limb-threatening ischaemia", html:"Reproducible exertional calf, thigh or buttock pain relieved by rest suggests intermittent claudication: assess pulses and cardiovascular risk, arrange ABPI where appropriate and follow the local PAD pathway. <b>Rest pain, tissue loss, gangrene or non-healing ulceration requires urgent vascular assessment</b> (chronic limb-threatening ischaemia); sudden onset with a cold, pale or pulseless limb is an emergency. Walking distance alone is not a referral threshold."},
         {tone:"amber", h:"🟠 Motor neurone disease / motor neuropathy", html:"Isolated cramps or fasciculations are not a diagnosis of MND and are usually benign. Arrange urgent neurological assessment for progressive objective weakness, wasting, bulbar symptoms, widespread fasciculations, mixed upper- and lower-motor-neuron signs, or progressive functional decline."},
         {tone:"red", h:"🔴 Severe hypokalaemia", html:"Cramps + severe or symptomatic hypokalaemia (arrhythmia, ECG changes, weakness or paralysis) → 999 or same-day electrolyte correction. Hypokalaemia from diuretics or eating disorders can cause dangerous arrhythmias."}
       ]}
     ]},

    {id:"confirm", nav:"Confirm", title:"Confirm the diagnosis — characterise the cramps", sub:"A true muscle cramp is a sudden, painful, involuntary contraction lasting seconds to minutes and relieved by stretching. Distinguish it from the mimics.",
     blocks:[
       {b:"table", head:["Feature","Detail","Implication"], rows:[
         ["<b>True cramp</b>","Sudden onset; calf or foot most common; visible or palpable muscle tightening; lasts &lt;10 min; relieved by stretching; tender for hours afterwards","The diagnosis this page treats"],
         ["<b>Nocturnal cramps</b>","During sleep or on waking. Common in older adults","Persistent, progressive, atypical or function-limiting cramps need assessment for vascular, neurological, medication-related and metabolic causes"],
         ["<b>Exercise-induced</b>","During or immediately after exercise — ask about hydration, electrolyte intake and training volume","Heat, dehydration, fatigue and unusually strenuous exercise may contribute. Address fluid intake, training load and relevant electrolyte abnormalities when clinically suspected — routine electrolyte replacement is not required"],
         ["<b>NOT cramp: restless legs</b>","<b>Urge to move the limbs, worse at rest and in the evening, without sustained muscle hardening</b> — patients may describe discomfort or occasional brief movements, so the diagnosis remains clinical","A different condition with different management: check ferritin/iron status where clinically indicated and treat iron deficiency; review medicines and sleep factors. Do not routinely initiate dopamine agonists in primary care; refer or seek specialist advice for persistent disease. Commonly misdiagnosed as cramp"],
         ["<b>NOT cramp: peripheral neuropathy or radiculopathy</b>","Burning, tingling, a 'dead' sensation, stocking distribution (neuropathy); dermatomal pain with a root distribution (radiculopathy)","Check HbA1c, B12 and alcohol history. Neuromuscular causes — peripheral neuropathy, radiculopathy and MND (if weakness or fasciculation) — are a different pathway"],
         ["<b>NOT cramp: claudication</b>","Reproducible exertional calf, thigh or buttock pain, relieved by rest (standing still, not needing to sit)","Distinguishing cramp from claudication is critical — treating 'cramps' without investigating claudication delays revascularisation"]
       ]}
     ]},

    {id:"classify", nav:"Classify", title:"Classify — idiopathic versus secondary", sub:"Most cramps are idiopathic. Screen for the secondary causes — many are treatable.",
     blocks:[
       {b:"table", head:["Category","Detail","Action"], rows:[
         ["<b>Idiopathic</b>","No systemic disease, no medication cause, normal examination and bloods. Most nocturnal cramps in adults over 50. Benign but distressing","Conservative management"],
         ["<b>Electrolyte disturbance</b>","Hypomagnesaemia (risk with diuretics, diarrhoea, malabsorption, alcohol excess, renal tubular disease), hypokalaemia, hypocalcaemia, hyponatraemia","Targeted bloods when risk factors are present; replace confirmed deficiency and correct the underlying cause"],
         ["<b>Medication-induced</b>","Diuretics (thiazide/loop), statins, beta-agonists, nifedipine, clonazepam withdrawal, alcohol, dialysis","Review the prescription chart. Statins: check CK if cramps come with muscle pain or weakness; do not stop for isolated uncomplicated cramps without assessing the overall picture"],
         ["<b>Systemic disease</b>","CKD (uraemia), hypothyroidism, diabetes (peripheral neuropathy component), cirrhosis, peripheral vascular disease","Treat the underlying condition"],
         ["<b>Dehydration / overexertion</b>","Heat, dehydration, fatigue and unusually strenuous exercise","Address fluid intake and training load; check electrolytes only when an abnormality is clinically suspected"],
         ["<b>Pregnancy</b>","Common in pregnancy, especially the 2nd and 3rd trimesters. New unilateral calf swelling, pain, warmth or tenderness requires urgent DVT assessment rather than attribution to pregnancy-related cramps","<b>Stretching, reassurance and review of hydration and medicines; avoid quinine</b>; avoid magnesium supplementation unless deficiency or a specific specialist indication exists"]
       ]},
       {b:"why", html:"Most idiopathic nocturnal cramps have no proven reversible biochemical cause. Magnesium deficiency can contribute, particularly with diuretics, diarrhoea, malabsorption, alcohol excess or renal tubular disease, so test when those risks are present rather than routinely. Statins can cause myopathy, but isolated cramps need the overall picture assessed. Identifying genuine secondary causes avoids unnecessary long-term treatment with quinine."}
     ]},

    {id:"exam", nav:"Examination", title:"Targeted examination", sub:"Examination guides whether cramps are idiopathic or secondary to vascular, neurological or systemic disease.",
     blocks:[
       {b:"table", head:["What","How / finding","Means"], rows:[
         ["<b>Peripheral pulses</b>","Palpate femoral, popliteal, dorsalis pedis and posterior tibial. Absent or reduced → vascular disease; ABPI if available","ABI &lt;0.9 = PAD — and in a patient presenting with leg cramps that changes the diagnosis and the whole management pathway"],
         ["<b>Lower-limb neurology</b>","Sensation (light touch, vibration with a 128 Hz tuning fork), reflexes (ankle jerk absent in neuropathy), power. Objective weakness with wasting or fasciculations, or mixed upper- and lower-motor-neuron signs → urgent neurology (MND / motor neuropathy)","Ankle-jerk absence with normal vibration sensation localises the neuropathy"],
         ["<b>Calf assessment</b>","Assess for unilateral swelling, calf tenderness, warmth, erythema and asymmetry. Do not use Homan's sign to rule in or rule out DVT","Apply the formal 2-level Wells pathway if DVT is possible"],
         ["<b>Muscle bulk</b>","<b>Wasting suggests systemic disease, MND or prolonged immobility</b>","Raises the referral threshold"],
         ["<b>Thyroid</b>","<b>Goitre, slow-relaxing reflexes, dry skin, bradycardia → hypothyroidism</b>","<b>Slow-relaxing reflexes suggest hypothyroidism — check TFTs</b>"],
         ["<b>Fluid status</b>","Skin turgor and mucous membranes → dehydration. Oedema → CKD, cardiac failure, liver disease","Directs the blood panel"]
       ]},
       {b:"why", html:"A normal examination supports idiopathic cramps and avoids unnecessary investigation — which is the other half of this section's value."}
     ]},

    {id:"workup", nav:"Work-up", title:"Investigations — targeted, not routine", sub:"No investigation may be needed when symptoms are typical, examination is normal, and there are no systemic features and no relevant medication or disease risk. Consider targeted tests for frequent, severe, new or progressive cramps or the risk factors below.",
     blocks:[
       {b:"table", head:["Test","When","Interpretation"], rows:[
         ["<b>Targeted bloods</b>","Frequent, severe, new or progressive cramps; abnormal neurological or vascular examination; diuretic use; CKD; diarrhoea or malabsorption; diabetes or neuropathy; thyroid symptoms; pregnancy; alcohol excess. Tests: U&amp;E/creatinine, calcium, magnesium when clinically indicated, glucose/HbA1c, TFTs; ferritin/iron studies only where clinically relevant (e.g. suspected restless legs)","Magnesium is NOT included in a standard U&amp;E and must be specifically requested. Serum magnesium is an imperfect marker of total-body magnesium, but a normal level should not justify indiscriminate supplementation. Do not treat magnesium as a mandatory first test in every case"],
         ["<b>Creatine kinase (CK)</b>","<b>If on a statin, or with significant post-exertional pain</b>","Check CK and renal function where clinically indicated. Stop and urgently assess if CK is markedly raised, particularly &gt;10× ULN, or if rhabdomyolysis is suspected (severe muscle pain, weakness, dark urine). Once symptoms and CK have resolved, consider a lower dose, alternative statin or intermittent regimen according to cardiovascular risk — not a fixed rechallenge timing"],
         ["<b>Vitamin D</b>","Widespread musculoskeletal symptoms, elderly, housebound, or BMI &gt;30","Correct deficiency"],
         ["<b>B12 / folate</b>","Neuropathy features (tingling, numbness, reduced reflexes), alcohol use, metformin use","Identifies a treatable neuropathy"],
         ["<b>ABPI</b>","Claudication suspected, absent or reduced peripheral pulses, or cardiovascular risk factors","<b>ABI &lt;0.9 = PAD</b>"],
         ["<b>Not routinely needed</b>","Any blood tests for typical occasional cramps with a normal examination and no risk factors. MRI or nerve conduction studies if there is no clinical evidence of neurological disease. D-dimer only within the 2-level Wells pathway when DVT is unlikely — not to exclude DVT in pregnancy or where it is frequently raised","Avoids over-investigation"]
       ]},
       {b:"cards", items:[
         {tone:"purple", h:"NG12 criteria that surface here <span class='tw'>Suspected cancer</span>", html:"Leg cramps have no NICE NG12 criterion of their own, and this page does not invent one — the cramp itself is a benign symptom and the danger list above is vascular and neurological, not oncological. Two NG12 routes can nevertheless arise from this work-up and should be acted on if they do:<br>• An unexplained lump that is increasing in size → consider urgent direct-access ultrasound (within 2 weeks) for suspected soft-tissue sarcoma, and a suspected cancer pathway referral if the ultrasound suggests sarcoma, or is uncertain and concern persists. Persistent focal calf swelling that is not DVT and not cramp deserves this thought.<br>• An X-ray suggesting possible bone sarcoma → suspected cancer pathway referral (in an adult); unexplained bone swelling or pain in a child or young person → very urgent direct-access X-ray within 48 hours.<br>Cramp that is actually fixed, progressive, focal limb pain is not cramp — re-examine rather than re-prescribe.", src:"NICE NG12 (updated April 2026)"}
       ]}
     ]},

    {id:"ladder", nav:"Treat", title:"The treatment ladder — stepwise, cause first", sub:"Treat underlying causes first. For idiopathic and nocturnal cramps, escalate from non-pharmacological to pharmacological. Verify all doses and supplementation advice against the BNF, current SPC and local formulary.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Step 1", title:"Treat the underlying cause", when:"always first", fromLabel:"the highest-yield step",
          html:"Confirm a typical cramp and exclude DVT, limb ischaemia, claudication and neurological disease. Correct documented electrolyte or metabolic abnormalities, review medicines and comorbidity (stopping or adjusting causative medications where appropriate), and treat hypothyroidism, diabetes and CKD. Address hydration, excessive exertion, sleep and footwear where relevant."},
         {step:"Step 2", title:"Stretching exercises", when:"first-line for idiopathic and nocturnal cramps", fromLabel:"most evidence",
          html:"Calf and hamstring stretches every night immediately before sleep — the regimen with trial evidence for nocturnal cramps (daytime stretches can be added). Dorsiflexion during a cramp provides immediate relief. Physiotherapy referral if needed. In a 6-week RCT of adults over 55 it cut cramps by a mean of 1.2 more per night than control (Hallegraeff, J Physiother 2012)."},
         {step:"Step 3", title:"Magnesium replacement — only if deficiency is shown or strongly suspected", when:"documented hypomagnesaemia or strong clinical risk of deficiency", fromLabel:"not routine",
          html:"Magnesium replacement is appropriate for documented hypomagnesaemia or a strong clinical risk of deficiency; <b>routine magnesium supplementation is not established as effective treatment for most idiopathic nocturnal cramps</b>. Replace according to the local formulary, the preparation's <b>elemental-magnesium content</b> (not the salt weight) and renal function — do not use a fixed over-the-counter dose as a universal regimen. Use caution in CKD or significant renal impairment, diarrhoea, interacting medicines, and repeated or high-dose supplementation. Correct the underlying cause."},
         {step:"Step 4", title:"Quinine sulfate 200–300 mg at night", when:"regular sleep disturbance AND steps 1–3 failed", fromLabel:"NOT for routine use",
          html:"Quinine is not routine treatment (MHRA): consider only for very painful or frequent cramps that regularly disturb sleep after secondary causes and conservative measures have been addressed. Time-limited 4-week trial, stop if there is no clear benefit, and reassess at approximately 3 months. Warn the patient to stop and seek medical advice for tinnitus, hearing or visual disturbance, confusion, unusual bruising, petechiae or bleeding. QT-prolongation risk; interactions including warfarin and digoxin; caution in renal/hepatic disease; potential toxicity in overdose — check the current SPC before prescribing. Contraindicated with haemoglobinuria, myasthenia gravis, optic neuritis and tinnitus (SPC); avoid in pregnancy unless specialist advice supports use. Reduces cramp number by ~28% (Cochrane 2015) with a narrow therapeutic index — cinchonism (tinnitus, dizziness, visual disturbance) and rare thrombocytopenia; the MHRA (Drug Safety Update, June 2010) advised it must not be used routinely for nocturnal leg cramps."},
         {step:"Step 5", title:"Refractory cramps — reassess and seek advice", when:"genuinely refractory", fromLabel:"no routine vitamins",
          html:"Do not routinely offer vitamin E or vitamin-B preparations for idiopathic leg cramps — evidence is limited and inconsistent, and vitamin E is not risk-free (possible bleeding risk and interaction with anticoagulants). Investigate and treat a specific deficiency where present. Consider specialist advice for genuinely refractory cramps after the diagnosis and secondary causes have been reviewed."}
       ]},
       {b:"warn", html:"Avoid: quinine in pregnancy unless specialist advice supports use · routine quinine use without trialling conservative measures first · prolonged quinine without approximately 3-monthly review · fixed over-the-counter magnesium doses · routine vitamin E or vitamin-B preparations. Quinine sulfate 200 mg at night has a narrow margin — rare but potentially fatal thrombocytopenia, cinchonism, cardiac and QT effects, interactions (including warfarin and digoxin), and serious, potentially fatal toxicity in overdose, including permanent visual loss. Review every 3 months and trial a stop periodically to confirm ongoing need."},
       {b:"say", html:"These cramps are usually harmless, and regular calf stretches are the best treatment — they can reduce how often they happen and how bad they are. I'd rather not jump to quinine because it has real risks, so let's give the stretches a proper try, review your other tablets and check bloods if anything points to a cause, and see where we are in a month."}
     ]},

    {id:"lifestyle", nav:"Self-care", title:"Non-pharmacological measures — first-line", sub:"Cheap, safe, and where most of the benefit lives. Two of these are free and frequently never mentioned.",
     blocks:[
       {b:"table", head:["Measure","How","Why"], rows:[
         ["<b>Calf stretching</b>","Every night before bed (daytime too if wished): stand facing a wall, knee straight, heel on the floor, hold 30 seconds each leg","<b>Fewer and less severe night cramps (RCT, 6 weeks)</b>"],
         ["<b>Hydration</b>","Maintain normal hydration and replace fluid losses, particularly in hot weather or with heavy exercise. Avoid prescriptive fluid targets in people with heart, renal or liver disease, fluid restriction or hyponatraemia — follow their existing fluid plan. Avoid alcohol excess","<b>Alcohol is dehydrating and directly myotoxic</b>"],
         ["<b>Footwear</b>","Supportive footwear with heel support; avoid flat shoes or barefoot walking in recurrent sufferers","Reduces mechanical triggering"],
         ["<b>Bedding adjustments</b>","Untuck the bed sheets at the foot of the bed; elevate the foot of the bed slightly","Tight sheets plantar-flex the ankles and trigger cramps — loose bedding reduces frequency by reducing nocturnal plantar-flexion: a simple, free intervention"],
         ["<b>Exercise warm-down</b>","Gentle stretching after exercise; gradual cool-down; avoid sudden increases in training load","Prevents exercise-induced cramps"],
         ["<b>Dietary electrolytes</b>","Potassium (bananas, avocado, potato), magnesium (nuts, dark chocolate, leafy greens), calcium (dairy, broccoli) — especially if dietary intake is poor. Do not advise potassium-rich foods or electrolyte products without considering renal impairment, ACE inhibitors, ARBs and potassium-sparing diuretics","Dietary improvement is more physiological than supplementation and avoids medication side effects"],
         ["<b>Avoid aggravants</b>","<b>Reduce caffeine and alcohol</b>","<b>Both deplete magnesium and cause dehydration</b>"]
       ]}
     ]},

    {id:"monitor", nav:"Monitor", title:"Follow-up, monitoring and safety-netting", sub:"The review exists to stop treatment that isn't working — especially quinine.",
     blocks:[
       {b:"table", head:["When","What","Action"], rows:[
         ["<b>4–6 weeks</b>","Are cramps improving? Review any blood results. Assess adherence to the stretching programme","Escalate treatment if no benefit; improving with stretching → continue conservative measures"],
         ["<b>At ~4 weeks on quinine</b>","<b>Benefit check</b>","<b>No clear benefit → stop</b>"],
         ["<b>3 months on quinine</b>","Reassess need (approximately every 3 months): is it still effective? Use the lowest effective dose. Symptom-led safety monitoring — ask about tinnitus, hearing or visual disturbance, confusion, unusual bruising, petechiae or bleeding","<b>Stop if not clearly beneficial; trial a stop to confirm ongoing need</b>"],
         ["<b>Annually</b>","Review medication (quinine, statins, diuretics); repeat electrolytes if on diuretics or with CKD; reassess for new cardiovascular or neurological symptoms","<b>If the pattern changes → re-screen for a secondary cause</b>"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"📞 999 safety-net", html:"Sudden cold, pale, pulseless, painful leg → 999 (acute limb ischaemia). Cardiac arrhythmia symptoms with muscle weakness → 999."},
         {tone:"amber", h:"🟠 Same-day", html:"New unilateral calf swelling, pain, warmth or tenderness (DVT) · progressive leg weakness, wasting or fasciculations · on quinine: stop and seek advice for tinnitus, hearing or visual changes, confusion, unusual bruising, petechiae or bleeding."},
         {tone:"amber", h:"💊 Quinine monitoring and counselling", html:"No routine fixed 3-month FBC — monitor by symptoms and reassess need about every 3 months. Instruct the patient to stop immediately and seek medical advice for tinnitus, hearing or visual disturbance, confusion, unusual bruising, petechiae or bleeding (rare but potentially fatal thrombocytopenia). “Keep quinine well away from children — even a small overdose is very dangerous. Take it exactly as prescribed.”"},
         {tone:"blue", h:"🦵 Vascular / neuro script", html:"“Cramp-like calf pain only on walking that eases with rest, or new numbness or weakness — get checked.” “Regular calf stretches are the most effective thing — keep them up even once the cramps settle.”"}
       ]},
       {b:"why", html:"Quinine-induced thrombocytopenia can occur even after months of treatment and can be severe (platelet count &lt;10). Visual toxicity — irreversible retinal damage — occurs at high cumulative doses. Regular review allows early detection. Cramps often improve over months as underlying causes are addressed, so medication can frequently be stopped — avoid indefinite quinine prescribing."}
     ]},

    {id:"loop", nav:"Not improving?", title:"Not improving? Re-think the cause", sub:"Persistent or atypical cramps warrant re-examining the diagnosis.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"1 · Drugs", html:"<b>Re-review for a precipitating medication</b> — diuretics, statins, beta-agonists, nifedipine, alcohol."},
         {tone:"amber", h:"2 · Secondary cause", html:"Electrolytes (magnesium when clinically indicated), renal and liver disease, thyroid, PAD, neurological signs."},
         {tone:"amber", h:"3 · Right diagnosis?", html:"<b>Claudication, restless legs, dystonia or neuropathy mimicking cramps?</b>"},
         {tone:"amber", h:"4 · Stretching", html:"<b>Has a genuine, sustained stretching regimen actually been tried?</b>"},
         {tone:"amber", h:"5 · Quinine review", html:"<b>On quinine without benefit → stop; consider referral.</b> Reversible causes excluded and conservative measures tried → review quinine or refer."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — who, when, how urgently", sub:"Idiopathic, electrolyte-related, medication-induced and pregnancy-related cramps are managed in primary care.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999", html:"Suddenly painful, cold, pale or mottled leg with absent or markedly reduced pulses, sensory loss or weakness (acute limb ischaemia — do not wait for ABPI) · severe hypokalaemia with cardiac arrhythmia."},
         {tone:"red", h:"Same-day", html:"Suspected DVT on the 2-level Wells pathway — DVT likely: urgent proximal leg-vein ultrasound (interim anticoagulation if imaging is delayed, per local pathway); DVT unlikely: D-dimer, then ultrasound if positive. Pregnancy: pregnancy-specific local pathway."},
         {tone:"amber", h:"Urgent vascular", html:"Chronic limb-threatening ischaemia — rest pain, tissue loss, gangrene or non-healing ulceration → urgent vascular assessment. Intermittent claudication alone (exertional pain relieved by rest, ABPI &lt;0.9) follows the local PAD pathway; walking distance is not by itself an urgent-referral threshold. Sudden onset with a cold, pale or pulseless limb → 999."},
         {tone:"amber", h:"Urgent neurology", html:"Progressive objective weakness, wasting, bulbar symptoms, widespread fasciculations or mixed upper- and lower-motor-neuron signs (possible MND) · rapidly progressive neuropathy. Isolated cramps or fasciculations are not a diagnosis of MND."},
         {tone:"blue", h:"Routine", html:"Confirmed PAD for vascular assessment and an exercise programme · refractory cramps despite treatment · diagnostic doubt or atypical features · suspected underlying neurological, vascular or metabolic disease. PAD with ABPI &lt;0.9 benefits from a supervised exercise programme — first-line for intermittent claudication in NICE CG147 — plus cardiovascular risk reduction."},
         {tone:"green", h:"Primary care", html:"Idiopathic cramps, electrolyte-related cramps, medication-induced cramps and pregnancy-related cramps — manage in primary care."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only — the Casebook keeps the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 68-year-old man asks for “those quinine tablets my friend gets” for calf cramps waking him most nights for three months. He takes bendroflumethiazide and atorvastatin. On direct questioning the calf also aches when he walks to the shops and eases when he stands still. Foot pulses are hard to feel."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Separates <b>nocturnal cramp from the claudication history</b> and does not treat both as cramp; palpates <b>pulses and arranges ABPI</b>, recognising <b>ABI &lt;0.9 = PAD</b> with cardiovascular risk work; reviews the <b>thiazide and statin as contributors</b> and checks <b>magnesium because of the thiazide (requested specifically, not assumed to be in the U&amp;E)</b> plus CK if there is muscle pain or weakness; prescribes <b>calf stretching properly</b> (technique, every night before sleep, the trial evidence) and the <b>free bedding change</b>; declines quinine at this stage with the <b>MHRA reasoning</b> stated kindly; and safety-nets <b>acute limb ischaemia and DVT</b> in plain words."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>MHRA Drug Safety Update \u2014 quinine for leg cramps</b><span class="rd"> \u2014 exclusion of secondary causes, stretching first-line, and the restricted role of quinine with a 4-week trial and approximately 3-monthly reassessment; rare but potentially fatal thrombocytopenia and serious overdose toxicity including permanent visual loss</span></li>'+
         '<li><b>MHRA Drug Safety Update (June 2010) \u2014 quinine: not to be used routinely for nocturnal leg cramps</b><span class="rd"> \u2014 the sleep-disturbance-plus-failed-conservative-measures threshold</span></li>'+
         '<li>El-Tawil S et al. \u2014 Quinine for muscle cramps, Cochrane Database of Systematic Reviews 2015<span class="rd"> \u2014 the ~28% reduction in cramp number and the adverse-effect profile</span></li>'+
         '<li><b>Hallegraeff JM et al., J Physiother 2012;58:17\u201322</b><span class="rd"> \u2014 nightly calf and hamstring stretching before sleep reduced nocturnal cramp frequency (mean difference 1.2 cramps per night) and severity at 6 weeks</span></li>'+
         '<li><b>NICE CG147 \u2014 Peripheral arterial disease (2012, updated 2020)</b><span class="rd"> \u2014 supervised exercise and cardiovascular-risk management for intermittent claudication; no universal walking-distance threshold for urgent referral</span></li>'+
         '<li><b>NICE NG12 \u2014 Suspected cancer (updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> \u2014 the soft-tissue sarcoma (unexplained lump increasing in size \u2192 urgent direct-access ultrasound) and bone-cancer routes noted for the fixed, progressive limb pain that is not cramp</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> \u2014 verify quinine and magnesium dosing (elemental-magnesium content), contraindications, interactions and monitoring against the BNF, current SPC and local formulary before prescribing</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Primary-care assessment and management of leg cramps \u2014 the MHRA 2010 quinine restriction, Cochrane 2015, Hallegraeff (J Physiother 2012), NICE CG147 for supervised exercise in claudication, and NICE NG12 (updated April 2026) for the limb-lump routes. Assessment and management are merged on this page; the former algorithm is retired. Verify every dose and supplement against the current BNF, SPC and local formulary before prescribing."
