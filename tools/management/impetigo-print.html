MG.render({
  icon:"🧴",
  title:"Impetigo",
  eyebrow:"Protocol · assess and manage in one place",
  stemTitle:"Count the lesions, check the child, then pick antiseptic, cream or tablets — one antimicrobial route at a time",
  stemSub:"One page for the whole consultation. Make sure it is impetigo and not something that needs a same-day look (scalded skin, eczema herpeticum, preseptal or orbital cellulitis, a baby with widespread blistering or who is unwell). Then let the extent decide: a small non-bullous patch gets hydrogen peroxide 1% cream, a topical antibiotic only if the antiseptic is unsuitable, and widespread, bullous or systemic disease gets oral flucloxacillin for 5 days. Pair it with hygiene and the UKHSA exclusion rule, keep group A strep in mind in outbreaks, A first typical episode is diagnosed clinically without a swab; swab when treatment fails, disease recurs, MRSA is suspected, the presentation is atypical, or microbiological information would alter treatment. NICE NG153 (2020) · NICE NG190 (2021) · UKHSA exclusion guidance · Greater Manchester antimicrobial guidelines · BNF and BNFC.",
  guideline:"NICE NG153 (Feb 2020) · UKHSA children and young people settings exclusion guidance · UKHSA scarlet fever outbreak guidelines (Jan 2023) · BNF and BNFC · NICE NG12 (updated April 2026)",
  meta:[
    {t:"NICE NG153 (2020) · impetigo antimicrobial prescribing"},
    {t:"UKHSA · exclusion from school and nursery"},
    {t:"UKHSA 2023 · scarlet fever and iGAS"},
    {t:"BNF and BNFC · flucloxacillin, clarithromycin"},
    {t:"NICE NG190 · infected eczema · GMMMG · mupirocin on microbiology advice"},
    {t:"Suspected cancer referral only if a non-healing crusted lesion suggests SCC · NICE NG12", tone:"tw"},
    {t:"v2.0 · primary sources re-verified Sep 2026", tone:"ok"}
  ],
  lead:"<div class='mg-layers'><a href='#redflags'><b>Not impetigo?</b><small>Scalded skin, herpes, cellulitis</small></a><a href='#extent'><b>How much?</b><small>Localised, widespread, bullous</small></a><a href='#treat'><b>Treat</b><small>Antiseptic, cream or tablets</small></a><a href='#refer'><b>Refer</b><small>Babies, unwell, immunosuppressed</small></a></div>",
  quickSub:"If you read nothing else, read these six cards. Every dose and interval traces to a primary source listed under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Unwell, a baby with widespread blisters, or skin peeling in sheets — this is not routine impetigo", html:"Fever, lethargy or poor feeding, diffuse tender erythema with superficial blistering or a positive Nikolsky sign/skin shearing (staphylococcal scalded skin), punched-out erosions over eczema (eczema herpeticum), spreading hot, painful redness (cellulitis) or eyelid swelling with fever or eye signs (preseptal or orbital cellulitis) all need a <b>same-day</b> assessment. NICE NG153 asks you to <b>consider referral or specialist advice</b> for bullous impetigo, <b>particularly in babies aged 1 year and under</b>, and for anyone systemically unwell or at high risk of complications.", src:"NICE NG153 (2020) · clinical practice"},
    {tone:"cream", h:"A small patch, child well: hydrogen peroxide 1% cream first", html:"For <b>localised non-bullous impetigo</b> in someone who is not systemically unwell or at high risk of complications, NG153 says <b>consider hydrogen peroxide 1% cream, applied 2 or 3 times a day for 5 days</b>. It is an antiseptic, so it spares an antibiotic, and the committee found it about as effective as a topical antibiotic for this group.", src:"NICE NG153 (2020) · BNF hydrogen peroxide"},
    {tone:"cream", h:"Antiseptic unsuitable? Fusidic acid 2% — not both creams, not a long course", html:"If hydrogen peroxide is unsuitable (for example, lesions close to the eyes) offer a short course of a topical antibiotic: <b>fusidic acid 2% three times a day for 5 days</b>. Use <b>mupirocin 2% three times a day for 5 days</b> only if fusidic acid resistance is suspected or confirmed, or when specifically advised by microbiology (particularly suspected or confirmed MRSA) — not as a routine second empirical cream. Longer or repeated courses breed resistance.", src:"NICE NG153 (2020) · BNF · GMMMG antimicrobial guidelines"},
    {tone:"amber", h:"Widespread, bullous or systemic: oral flucloxacillin 500 mg four times a day for 5 days", html:"Adults: <b>flucloxacillin 500 mg four times a day for 5 days</b>. Widespread non-bullous impetigo in a well person may be treated with <i>either</i> a topical <i>or</i> an oral antibiotic by shared decision; bullous impetigo, systemic illness or high risk of complications → oral. True penicillin allergy (confirm immediate or severe allergy versus a non-allergic adverse effect): <b>clarithromycin 250 mg twice a day</b> (up to 500 mg twice a day if severe, by clinical judgement) — check interactions, QT risk and hepatic impairment; in pregnancy <b>erythromycin 250–500 mg four times a day</b>, not clarithromycin. Five days is enough for most; 7 days by clinical judgement.", src:"NICE NG153 (2020) · BNF flucloxacillin, clarithromycin"},
    {tone:"blue", h:"Never combine a topical and an oral antibiotic", html:"NG153 is explicit: <b>do not offer combination treatment with a topical and an oral antibiotic</b>. In the trials the combination worked no better than a topical antibiotic alone and adds adverse effects and resistance pressure. If you move to tablets, stop the antibiotic cream. Hygiene measures and gentle cleansing continue alongside any treatment.", src:"NICE NG153 (2020)"},
    {tone:"green", h:"Off school until crusted and healed, or 48 hours after starting antibiotics", html:"UKHSA’s exclusion table for schools and nurseries: keep the child off <b>until the lesions are crusted and healed, or 48 hours after starting antibiotic treatment</b>. The 48-hour rule applies only after starting an antibiotic; with hydrogen peroxide alone, the child stays off until lesions are crusted and healed. Hygiene is part of the treatment: hand-washing before and after applying cream, a clean cloth each time, and no shared towels or flannels.", src:"UKHSA exclusion periods in children and young people’s settings · NICE NG153 (2020)"}
  ],
  pathwaySub:"Five moves. The first one is where children come to harm — do it before anything else.",
  pathway:[
    {title:"Is it impetigo, and is the patient well?", html:"Look for honey-coloured crusts on a red base (non-bullous) or flaccid blisters that leave a thin collar of scale (bullous). Check temperature, feeding, hydration and how ill the patient looks. <b>Same-day action</b> for scalded-skin signs, eczema herpeticum, spreading cellulitis, eyelid swelling with fever or eye signs (preseptal or orbital cellulitis), a baby with widespread blistering, poor feeding, fever, lethargy or diagnostic uncertainty, or an immunosuppressed patient with extensive disease.", alert:true},
    {title:"Grade the extent", html:"<b>Localised non-bullous</b> — a few lesions in one area. <b>Widespread non-bullous</b> — many lesions or several sites (NICE sets no fixed lesion count — use clinical judgement; the NHS England Pharmacy First pathway uses 4 or more lesions or clusters as an operational threshold for that service only). <b>Bullous</b> — any blistering form. The extent, blisters and systemic state together choose the treatment."},
    {title:"Match the treatment to the grade", html:"Localised: <b>hydrogen peroxide 1% cream</b> 2–3 times a day for 5 days → fusidic acid 2% if unsuitable. Widespread and well: topical <i>or</i> oral antibiotic by shared decision. Bullous, unwell or high risk: <b>oral flucloxacillin</b> (clarithromycin if truly penicillin-allergic; erythromycin if also pregnant). One antimicrobial route at a time — never a topical plus an oral antibiotic; hygiene and gentle cleansing continue."},
    {title:"Hygiene, exclusion and the household", html:"Explain spread and the UKHSA exclusion rule, write down the return date, treat the underlying itch (eczema, scabies, head lice) and ask about similar lesions in siblings. In a nursery or school cluster, or where scarlet fever is circulating, think group A strep and the health protection team."},
    {title:"Safety-net, review and recurrence", html:"Return if it worsens quickly or significantly at any time, or has not improved when the course ends. Then reconsider the diagnosis, <b>send a skin swab</b>, and step up (topical failure → oral). Frequent recurrence → skin swab, nasal swab for <i>Staphylococcus aureus</i> carriage, and consider microbiology-guided decolonisation. Swab earlier if MRSA is suspected, the presentation is atypical, or the result would alter treatment."}
  ],
  sections:[
    {id:"redflags", nav:"Red flags", title:"Red flags — look for the child who needs more than a cream", sub:"Most impetigo is trivial. These are the presentations that look like impetigo and are not, or are impetigo in someone who cannot be managed at home.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Staphylococcal scalded skin syndrome", html:"A febrile, irritable child (usually under 5) with diffuse tender erythema and superficial blistering or a positive Nikolsky sign (skin shearing with light pressure), often starting around the mouth, neck and flexures. Crusting around the mouth can look like impetigo. <b>Same-day paediatric admission</b> — this is a toxin-mediated illness needing intravenous antibiotics, fluids and pain control. It is not managed with topical treatment or routine oral impetigo antibiotics in primary care.", src:"Clinical practice · NICE NG153 (2020) referral advice"},
         {tone:"red", h:"🔴 Eczema herpeticum", html:"Painful clusters of monomorphic punched-out erosions or vesicles on eczematous skin, often with fever. Secondary impetiginisation can coexist, so a child with eczema whose ‘impetigo’ is spreading fast or is painful rather than itchy needs <b>same-day</b> assessment. Start systemic aciclovir promptly according to the BNF or BNFC and local paediatric or dermatology advice — do not wait for swab results — and seek same-day ophthalmology advice if periocular involvement is suspected. Coexisting bacterial impetiginisation must not distract from the herpes simplex diagnosis.", src:"Clinical practice · BNFC aciclovir"},
         {tone:"red", h:"🔴 Systemically unwell, cellulitis or a baby with widespread blisters", html:"Fever, rigors, spreading hot and painful erythema, lymphangitis or poor feeding means deeper or invasive infection. Not all blisters are bullous impetigo: a baby with widespread blistering, poor feeding, fever, lethargy or diagnostic uncertainty needs same-day paediatric assessment. Group A strep can become invasive, especially after chickenpox. NG153: consider referral or specialist advice for <b>bullous impetigo, particularly in babies aged 1 year and under</b>, and for anyone <b>systemically unwell</b> or at <b>high risk of complications</b>.", src:"NICE NG153 (2020) · UKHSA scarlet fever outbreak guidelines (Jan 2023)"},
         {tone:"amber", h:"🟠 Impetigo or cellulitis?", html:"Impetigo can have some surrounding redness. Spreading erythema, warmth and tenderness, lymphangitis, fever or systemic upset, disproportionate pain or deeper swelling suggest cellulitis — follow the <a href='cellulitis.html'>cellulitis</a> pathway rather than treating it as uncomplicated impetigo.", src:"Clinical practice"},
         {tone:"amber", h:"🟠 Immunosuppressed with widespread impetigo", html:"NG153 names people who are immunocompromised with widespread impetigo as a group in whom referral or specialist advice should be considered. Include people on biologics, high-dose steroids, chemotherapy and those with uncontrolled diabetes in your threshold.", src:"NICE NG153 (2020)"},
         {tone:"amber", h:"🟠 Periorbital lesions", html:"Crusts on the eyelids or around the eye: hydrogen peroxide is unsuitable near the eyes, so use a topical antibiotic (or oral if extensive), and consider the differential — localised impetigo, blepharitis, preseptal cellulitis, orbital cellulitis and eczema herpeticum. <b>Same-day assessment</b> for eyelid swelling with fever, pain on eye movement, restricted eye movements, proptosis, reduced vision, severe headache or systemic illness; <b>suspected orbital cellulitis is an emergency</b>. Topical antibiotic advice must not delay this assessment.", src:"NICE NG153 (2020) · clinical practice"},
         {tone:"purple", h:"Adult with a crusted lesion that will not heal — think skin cancer, not impetigo", html:"A single crusting, keratinised or ulcerated lesion on sun-exposed skin in an older or immunosuppressed adult that has not settled with a course of treatment is not impetigo until proven otherwise. NICE NG12: <b>consider a suspected cancer pathway referral (for an appointment within 2 weeks) for people with a skin lesion that raises the suspicion of squamous cell carcinoma.</b>", src:"NICE NG12 (updated April 2026)"}
       ]},
       {b:"why", html:"Impetigo is common and harmless enough that the danger is anchoring. A crust around a toddler’s mouth is usually impetigo — but scalded skin syndrome often starts in the same place, and a child with eczema can carry herpes simplex in the same crusts. The one question that separates them is <b>how ill is the child</b>: impetigo itches and the child plays; scalded skin and eczema herpeticum hurt and the child is miserable and febrile."}
     ]},

    {id:"recognise", nav:"Recognise", title:"What you are looking at — the two forms and their mimics", sub:"Diagnosis is clinical. A swab is not needed for a first, typical episode — swab when treatment fails, disease recurs, MRSA is suspected, the presentation is atypical, or the result would alter treatment.",
     blocks:[
       {b:"table", head:["Feature","Non-bullous impetigo","Bullous impetigo"], rows:[
         ["<b>How common</b>","The large majority of cases","Less common; mainly infants and young children"],
         ["<b>Organism</b>","<i>Staphylococcus aureus</i>, <i>Streptococcus pyogenes</i> (group A strep), or both","<i>S. aureus</i> strains producing exfoliative toxin, which splits the superficial epidermis"],
         ["<b>Appearance</b>","A thin-walled vesicle or pustule that ruptures quickly, leaving <b>golden-brown (honey-coloured) crusts</b> on a red base","<b>Flaccid, fluid-filled blisters</b> 1–2 cm or larger that burst to leave a shallow, moist erosion with a collar of scale"],
         ["<b>Where</b>","Face (around the nose and mouth), hands, limbs; often at a site of broken skin (eczema, insect bites, scabies, cuts)","Trunk, flexures, nappy area, limbs"],
         ["<b>Symptoms</b>","Itch; usually otherwise well","More often mild systemic upset; lymphadenopathy"],
         ["<b>Treatment route</b>","Localised → antiseptic or topical antibiotic; widespread → topical or oral","<b>Oral antibiotic</b> (NICE NG153); consider specialist advice, especially under 1 year"]
       ]},
       {b:"table", head:["Could it be…","Clue","What to do instead"], rows:[
         ["<b>Herpes simplex (cold sore, eczema herpeticum)</b>","Grouped vesicles, tingling first, painful; recurrent at the same site; punched-out erosions over eczema","Antiviral per BNF or BNFC; same-day review if eczema herpeticum"],
         ["<b>Atopic eczema flare — inflamed, colonised or infected</b>","Background eczema, weeping, itch-scratch cycle","Distinguish true impetigo from an inflamed or colonised eczema flare and treat the eczema barrier and inflammation. Do not assume every weeping or crusted flare needs antibiotics — follow NICE NG190 (if systemically well, antibiotics are not routinely offered). No routine swab at a first presentation of suspected infected eczema in a well child"],
         ["<b>Tinea (ringworm)</b>","Annular, scaly edge, slow spread, little crust","Skin scrapings; topical antifungal"],
         ["<b>Scabies or head lice</b>","Burrows, nocturnal itch, family members itching; nits","Treat the infestation — secondary impetigo then settles"],
         ["<b>Insect bites, chickenpox</b>","Crops of papules or vesicles at different stages","Watch for secondary infection; in chickenpox, a new fever or spreading redness is a group A strep warning"],
         ["<b>Contact dermatitis, pemphigus, bullous pemphigoid</b>","Distribution matching a trigger; in adults, tense or widespread blisters without crust","Dermatology if blistering in an adult does not fit impetigo"]
       ]},
       {b:"why", html:"Impetigo lives on damaged skin. The honey-coloured crust is dried serum, not pus, which is why it lifts off easily and why the lesions spread by touch and scratching. Treating the itch — eczema, scabies, lice — is how you stop it coming back."}
     ]},

    {id:"extent", nav:"Grade", title:"Grading the extent — the decision that picks the treatment", sub:"NICE NG153 builds its recommendations on three questions: bullous or not, localised or widespread, and systemically well or not.",
     blocks:[
       {b:"table", head:["Presentation","First choice","If that is unsuitable or fails"], rows:[
         ["<b>Localised non-bullous</b>, systemically well, not high risk","<b>Consider hydrogen peroxide 1% cream</b> 2–3 times a day for 5 days","Topical antibiotic: fusidic acid 2% three times a day for 5 days (mupirocin 2% only if fusidic acid resistance is suspected or confirmed, or on microbiology advice)"],
         ["<b>Widespread non-bullous</b>, systemically well, not high risk","<b>A short course of a topical or an oral antibiotic</b> — an individual decision","Weigh local resistance data, the patient’s preference, how practical cream application is across many sites, adverse effects and recent antibiotic use"],
         ["<b>Bullous impetigo</b>, or systemically unwell, or high risk of complications","<b>Oral antibiotic</b> — flucloxacillin","Clarithromycin if truly penicillin-allergic or flucloxacillin unsuitable; erythromycin in pregnancy. Consider referral or specialist advice, particularly in babies"],
         ["<b>Not improved after a topical antibiotic course</b>","<b>Offer a short course of an oral antibiotic</b> and consider a skin swab","Reconsider the diagnosis before escalating"],
         ["<b>Not improved after an oral antibiotic</b>","<b>Send a skin swab</b>","Narrow-spectrum antibiotic guided by the result"],
         ["<b>Fusidic acid resistance or MRSA concern</b>","<b>Microbiology advice</b>","Mupirocin only when indicated"],
         ["<b>Widespread impetigo, immunocompromised</b>","<b>Specialist advice or hospital assessment</b>","—"],
         ["<b>Frequent recurrence</b>","<b>Skin swab</b>; consider a nasal swab","Decolonisation guided by swab results and microbiology"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"What counts as ‘widespread’", html:"NICE NG153 does not define widespread impetigo by a fixed lesion count — use clinical judgement in general practice. The NHS England Pharmacy First pathway, which follows NG153, uses <b>4 or more lesions or clusters</b> as an operational threshold for that service only and treats people aged 1 year and over; bullous impetigo and children under 1 are outside the pharmacy service and come to the practice.", src:"NICE NG153 (2020) · NHS England Pharmacy First impetigo pathway (2024)"},
         {tone:"blue", h:"What counts as ‘high risk of complications’", html:"Clinical judgement: immunosuppression, significant underlying skin disease over a wide area, very young infants, and people who cannot reliably apply creams or return if worse. These patients drop a rung — oral treatment and a lower threshold for specialist advice.", src:"NICE NG153 (2020) · clinical practice"}
       ]}
     ]},

    {id:"treat", nav:"Treatment", title:"Treatment — antiseptic, then cream, then tablets", sub:"Adult doses below are those in NICE NG153 and the BNF. Children’s doses are in the next section. One route at a time.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Step 1", tone:"cream", title:"Hydrogen peroxide 1% cream", when:"localised non-bullous, systemically well", html:"<span class='rx'>Apply 2 or 3 times a day for 5 days</span>. Clean away loose crusts gently with warm water first. An antiseptic rather than an antibiotic, so it carries no resistance cost. Avoid use near the eyes."},
         {step:"Step 2", tone:"cream", title:"Topical antibiotic — fusidic acid 2%", when:"hydrogen peroxide unsuitable or ineffective", fromLabel:"if the antiseptic will not do", html:"<span class='rx'>Fusidic acid 2% cream three times a day for 5 days</span>. Only if fusidic acid resistance is suspected or confirmed (recent use, swab result), or when specifically advised by microbiology — particularly where MRSA is suspected or confirmed: <span class='rx'>mupirocin 2% three times a day for 5 days</span>. Do not use it routinely as a second empirical topical treatment. Do not repeat topical antibiotic courses back to back; a second episode soon after the first is a reason to swab."},
         {step:"Step 3", tone:"amber", title:"Oral antibiotic — flucloxacillin", when:"widespread (by shared decision), bullous, systemically unwell, high risk, or topical failure", fromLabel:"if widespread, bullous or unwell", html:"Adults: <span class='rx'>flucloxacillin 500 mg four times a day for 5 days</span>. Take at least 1 hour before or 2 hours after food if possible; check for previous immediate penicillin hypersensitivity, significant hepatic dysfunction and relevant interactions. True penicillin allergy (confirm immediate or severe allergy versus a non-allergic adverse effect) or flucloxacillin unsuitable: <span class='rx'>clarithromycin 250 mg twice a day for 5 days</span>, increased to 500 mg twice a day if severe by clinical judgement and local antimicrobial guidance — check macrolide interactions, QT risk and hepatic impairment. Pregnant and penicillin-allergic (not clarithromycin): <span class='rx'>erythromycin 250–500 mg four times a day for 5 days</span>. NG153: 5 days is sufficient for most; extend to 7 days by clinical judgement, depending on severity and the number of lesions.", warn:"Stop the antibiotic cream when starting tablets — NG153 advises against combining topical and oral antibiotics. Hygiene and gentle cleansing continue."},
         {step:"Step 4", tone:"amber", title:"Treatment failure or recurrence — swab and target", when:"worse, not improved, or frequent recurrence", fromLabel:"if not better", html:"Send a <b>skin swab</b> for culture and sensitivities, and change to a <b>narrow-spectrum antibiotic guided by the result</b>. For MRSA on culture, discuss the choice with the local microbiologist. For frequent recurrence, add a <b>nasal swab</b> for <i>S. aureus</i> carriage and consider a <b>decolonisation regimen</b> (nasal, skin or both) based on the clinical pattern, swab results and local microbiology advice. Avoid empirical repeated courses of nasal mupirocin or antiseptic body washes without a clear indication. For recurrent boils or abscesses, severe recurrent skin infection or household clusters, consider PVL-producing <i>S. aureus</i> and seek microbiology or health protection advice."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Why hydrogen peroxide before an antibiotic", html:"NG153 reviewed limited evidence comparing hydrogen peroxide 1% with topical antibiotics and found no important difference in clinical cure for localised non-bullous impetigo. Because fusidic acid resistance in <i>S. aureus</i> is common and rises with use, the committee put the antiseptic first.", src:"NICE NG153 (2020) evidence review"},
         {tone:"blue", h:"Why no combination and why short courses", html:"Topical plus oral antibiotic was no more effective than topical alone. Short courses (5 days) cure most people and limit adverse effects and resistance. A Cochrane review found topical antibiotics at least as effective as oral ones for limited impetigo.", src:"NICE NG153 (2020) · Koning et al., Cochrane Database Syst Rev 2012 (CD003261)"}
       ]}
     ]},

    {id:"children", nav:"Children’s doses", title:"Children’s oral doses — by age band", sub:"Flucloxacillin bands are those in the NICE NG153 dosing table, which follow the BNFC. Clarithromycin in children is dosed by body weight — use the BNFC table.",
     blocks:[
       {b:"table", head:["Age","Flucloxacillin (oral, 5 days; 7 by judgement)","If penicillin-allergic"], rows:[
         ["<b>1 month to 1 year</b>","<b>62.5–125 mg four times a day</b>","Clarithromycin — weight-banded dose per BNFC, twice a day for 5 days"],
         ["<b>2 to 9 years</b>","<b>125–250 mg four times a day</b>","Clarithromycin — weight-banded dose per BNFC"],
         ["<b>10 to 17 years</b>","<b>250–500 mg four times a day</b>","Clarithromycin — weight-banded per BNFC up to 11 years; 12 to 17 years 250 mg twice a day (up to 500 mg twice a day if severe, by clinical judgement)"],
         ["<b>Under 1 month</b>","Specialist advice — do not manage a neonate with impetigo in primary care alone","—"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"cream", h:"Making the liquid work", html:"Flucloxacillin oral solution tastes unpleasant and four-times-daily dosing on an empty stomach is hard around school. Talk it through — a missed afternoon dose is the usual reason ‘the antibiotics didn’t work’. If a child cannot take it, clarithromycin twice a day is the NG153 alternative.", src:"NICE NG153 (2020) · BNFC flucloxacillin"},
         {tone:"blue", h:"Topical treatment in children", html:"Hydrogen peroxide 1% and fusidic acid 2% are used at the same frequency and duration in children as in adults. Pharmacy First supplies them for children aged 1 year and over with non-bullous impetigo; under 1 year needs a GP assessment.", src:"NICE NG153 (2020) · NHS England Pharmacy First impetigo pathway (2024)"}
       ]}
     ]},

    {id:"exclusion", nav:"Hygiene and exclusion", title:"Hygiene and exclusion — what to tell the family", sub:"Impetigo spreads by direct contact and shared towels. The family needs a clear return date.",
     blocks:[
       {b:"tiles", v:"life", items:[
         {t:"🏫 School, nursery and work", html:"UKHSA: exclude <b>until lesions are crusted and healed, or 48 hours after starting antibiotic treatment</b>. Antiseptic cream does not trigger the 48-hour rule — a child on hydrogen peroxide returns when the lesions have crusted and healed."},
         {t:"🧼 Hand hygiene", html:"Wash hands before and after applying cream. Use a clean cloth each time to wash and dry the lesions."},
         {t:"🧺 Towels and flannels", html:"Do not share towels, flannels, bedding or clothes until healed; wash them on a hot cycle."},
         {t:"✋ Hands off", html:"Try not to scratch or pick; keep nails short; cover lesions loosely where possible."},
         {t:"🩹 Adults at work", html:"Food handlers, healthcare and childcare workers should follow the same rule and tell their occupational health service."},
         {t:"👪 Household", html:"Look at siblings and parents. Treat anyone who develops lesions; there is no need to treat unaffected contacts."}
       ]},
       {b:"say", html:"This is impetigo — a surface skin infection. It isn’t serious, but it does spread easily. Use the cream on the patches two or three times a day for five days, wash your hands before and after, and keep your own towel. She can go back to nursery once the patches have crusted over and healed. If it spreads, blisters, or she gets a temperature, bring her back the same day."}
     ]},

    {id:"gas", nav:"Group A strep", title:"Group A strep — where impetigo meets scarlet fever and iGAS", sub:"Group A streptococcus causes impetigo as well as scarlet fever and tonsillitis, and occasionally invasive disease. Outbreaks in nurseries and schools link them.",
     blocks:[
       {b:"cards", items:[
         {tone:"purple", h:"Scarlet fever is notifiable — impetigo is not", html:"If a child with impetigo also has the sandpaper rash, flushed cheeks and strawberry tongue of scarlet fever, manage it as scarlet fever: <b>notify the local UKHSA health protection team</b> — scarlet fever is a notifiable disease in England, and suspected outbreaks and cases of iGAS need prompt notification or discussion with the team according to current local arrangements — treat with an antibiotic per UKHSA and BNFC advice, and exclude <b>until 24 hours after starting antibiotics</b>.", src:"UKHSA scarlet fever outbreak guidelines (Jan 2023) · Health Protection (Notification) Regulations 2010"},
         {tone:"amber", h:"Clusters in a setting", html:"A cluster of impetigo or scarlet fever in the same class or nursery can signal a group A strep outbreak. If there is concern about an outbreak, seek local public-health advice — the health protection team, not this protocol, sets the threshold. Schools and nurseries report these to their UKHSA health protection team, which advises on swabbing, cleaning and exclusion.", src:"UKHSA scarlet fever outbreak guidelines (Jan 2023) · UKHSA children and young people settings guidance"},
         {tone:"red", h:"Chickenpox plus a new fever or spreading redness", html:"UKHSA asks clinicians to keep a <b>high index of suspicion for invasive group A strep</b> in children with a preceding viral infection, particularly chickenpox, and in close contacts of scarlet fever. A child with chickenpox whose fever returns, who looks unwell, or whose lesions become hot, painful and spreading needs a same-day assessment.", src:"UKHSA scarlet fever outbreak guidelines (Jan 2023)"},
         {tone:"blue", h:"Close contacts of iGAS", html:"When a household member has invasive group A strep, the health protection team leads contact management, including antibiotic prophylaxis for specified close contacts. A household contact who develops impetigo in that window should be discussed with the team rather than treated as routine.", src:"UKHSA invasive group A streptococcal disease: managing close contacts in community settings (Dec 2022)"}
       ]},
       {b:"why", html:"Flucloxacillin covers both <i>S. aureus</i> and group A strep, which is why it is the single oral choice for impetigo. Hydrogen peroxide and fusidic acid are aimed at the local lesion only — if the story suggests systemic group A strep (scarlet fever rash, sore throat, fever), you are no longer treating ‘just impetigo’."}
     ]},

    {id:"review", nav:"Review and recurrence", title:"Review, failure and recurrence", sub:"Most impetigo clears within a week of treatment. Failure means the diagnosis, the adherence or the organism is wrong.",
     blocks:[
       {b:"timeline", items:[
         {n:"1", when:"Any time", title:"Worse quickly or significantly", html:"NG153: seek medical help if symptoms worsen rapidly or significantly at any time. Reassess for cellulitis, scalded skin, herpes and systemic illness."},
         {n:"2", when:"End of the 5-day course", title:"Not improved", html:"After hydrogen peroxide: move to a topical antibiotic. After a topical antibiotic: <b>offer an oral antibiotic and consider a skin swab</b>. After an oral antibiotic: <b>send a skin swab</b> and change to a narrow-spectrum antibiotic guided by the result."},
         {n:"3", when:"Frequent recurrence", title:"Find the reservoir", html:"Skin swab for sensitivities; <b>nasal swab</b> if <i>S. aureus</i> carriage is suspected; consider a <b>nasal and/or skin decolonisation regimen</b> guided by the results and local microbiology advice. Treat eczema, scabies and head lice. Look at the household — a carrier in the family reseeds the child."},
         {n:"4", when:"After decolonisation", title:"Still recurring", html:"Consider dermatology or microbiology advice, especially with MRSA, suspected PVL-producing <i>S. aureus</i> (recurrent boils or abscesses, household clusters), immunosuppression, or blistering in an adult that may not be impetigo."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"Do not keep repeating fusidic acid", html:"Repeated or prolonged topical fusidic acid selects resistant <i>S. aureus</i>. NG153 keeps topical antibiotic courses short and moves on to swabbing when a course fails, rather than repeating it.", src:"NICE NG153 (2020)"},
         {tone:"cream", h:"Recurrence and the practice formulary", html:"Decolonisation products and their duration vary by locality — follow your local formulary or microbiology advice for the regimen rather than improvising one. NG153 leaves the choice of decolonisation regimen to clinical judgement and the swab results. Greater Manchester guidance: do not prescribe mupirocin for routine impetigo unless advised by microbiology (resistance or MRSA situations).", src:"NICE NG153 (2020) · GMMMG antimicrobial guidelines"}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — who, when, how urgently", sub:"Nearly all impetigo is managed in primary care or by the community pharmacist. These are the exceptions.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same-day (paediatrics, acute medicine or dermatology on call)", html:"Suspected <b>staphylococcal scalded skin syndrome</b> · suspected <b>eczema herpeticum</b> · <b>systemically unwell</b> (fever, lethargy, poor feeding, spreading cellulitis) · a <b>baby</b> with widespread blistering, poor feeding, fever, lethargy or diagnostic uncertainty · any <b>neonate</b> with impetigo · suspected preseptal or orbital cellulitis (orbital cellulitis is an emergency).", src:"NICE NG153 (2020) · clinical practice"},
         {tone:"amber", h:"Specialist advice (dermatology, paediatrics or microbiology)", html:"Bullous impetigo, particularly at 1 year and under · immunocompromised with widespread impetigo · high risk of complications · MRSA on culture or fusidic acid resistance concern (microbiology) · suspected PVL-producing <i>S. aureus</i> (microbiology or health protection) · recurrent disease despite decolonisation · diagnostic doubt in an adult with blistering.", src:"NICE NG153 (2020)"},
         {tone:"purple", h:"Urgent referral routes <span class='tw'>Suspected cancer</span> · NICE NG12", html:"<b>Consider a suspected cancer pathway referral (for an appointment within 2 weeks) for people with a skin lesion that raises the suspicion of squamous cell carcinoma</b> — for example, a persistent crusted or ulcerated lesion in an older or immunosuppressed adult that is not behaving like impetigo.", src:"NICE NG12 (updated April 2026)"},
         {tone:"cream", h:"UKHSA health protection team", html:"Concern about an outbreak or cluster in a nursery or school (the team sets the threshold), suspected scarlet fever outbreak, suspected iGAS, or impetigo in a household contact of invasive group A strep.", src:"UKHSA scarlet fever outbreak guidelines (Jan 2023) · UKHSA iGAS contacts guidance (Dec 2022)"},
         {tone:"green", h:"Community pharmacy — Pharmacy First", html:"Non-bullous impetigo in someone aged 1 year and over who is well can be treated by the community pharmacist under the NHS England Pharmacy First pathway, which follows NG153. Bullous impetigo, under-1s and frequent recurrence come back to the practice.", src:"NHS England Pharmacy First impetigo pathway (2024) · NICE NG153 (2020)"}
       ]},
       {b:"say", html:"This is impetigo. A few patches like this are treated with an antiseptic cream — no antibiotic needed yet. If it spreads or blisters we’ll use antibiotic medicine instead, but not both together. Keep him off nursery until the patches have crusted and healed. If he gets a temperature, stops feeding, or the skin starts to peel or look burnt, bring him back straight away."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A mother brings her 4-year-old with crusted, weeping patches around the nose and mouth for 3 days. He has eczema. She asks for ‘the antibiotic cream that worked last time’ — fusidic acid, prescribed 6 weeks ago — and wants a note for nursery. On video, you count six clusters across the face and both forearms; he is running around and eating normally."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Asks about <b>fever, pain and feeding</b> and screens for eczema herpeticum (painful, punched-out lesions); <b>grades the extent</b> — this is widespread, so a topical <i>or</i> oral antibiotic by shared decision; recognises that <b>recent fusidic acid</b> raises resistance risk (oral flucloxacillin, or mupirocin only on microbiology advice — not a repeat of the same cream); explains <b>never both</b> an antibiotic cream and tablets; gives the <b>UKHSA exclusion rule</b> with a date; distinguishes impetigo from a colonised eczema flare and treats the <b>eczema</b> as the driver; <b>safety-nets</b> for spread, blistering or fever; and offers a <b>swab</b> if this is the second episode in 6 weeks.", src:"NICE NG153 (2020) · UKHSA exclusion guidance"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Every figure on this page traces to a named primary source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG153 — Impetigo: antimicrobial prescribing</b> (published 26 February 2020)<br><a href="https://www.nice.org.uk/guidance/ng153/chapter/Recommendations" rel="noopener">nice.org.uk/guidance/ng153 — recommendations</a><span class="rd"> — consider hydrogen peroxide 1% cream (2–3 times a day, 5 days) for localised non-bullous impetigo; topical antibiotic if unsuitable (fusidic acid 2% three times a day, 5 days; mupirocin 2% if fusidic acid resistance); topical or oral for widespread non-bullous; oral for bullous, systemically unwell or high risk; flucloxacillin 500 mg four times a day (child bands 62.5–125 / 125–250 / 250–500 mg); clarithromycin 250 mg twice a day (up to 500 mg if severe, by judgement); erythromycin 250–500 mg four times a day in pregnancy; 5 days, 7 by judgement; no topical plus oral combination; swab on failure or recurrence; nasal swab and decolonisation for recurrence; referral groups.</span></li>'+
         '<li><b>UKHSA — Health protection in children and young people settings, including education: exclusion periods</b> (gov.uk, current version)<br><a href="https://www.gov.uk/government/publications/health-protection-in-schools-and-other-childcare-facilities/public-health-exclusion-periods-in-children-and-young-peoples-settings" rel="noopener">gov.uk — exclusion periods</a><span class="rd"> — impetigo: until lesions are crusted and healed, or 48 hours after starting antibiotic treatment.</span></li>'+
         '<li><b>UKHSA — Guidelines for the public health management of scarlet fever outbreaks in schools, nurseries and other childcare settings</b> (January 2023)<br><a href="https://www.gov.uk/government/publications/scarlet-fever-managing-outbreaks-in-schools-and-nurseries" rel="noopener">gov.uk — scarlet fever outbreaks</a><span class="rd"> — notification, exclusion until 24 hours of antibiotics, high index of suspicion for iGAS after chickenpox.</span></li>'+
         '<li><b>UKHSA — Invasive group A streptococcal disease: managing close contacts in community settings</b> (December 2022)<br><a href="https://www.gov.uk/government/publications/invasive-group-a-streptococcal-disease-managing-community-contacts" rel="noopener">gov.uk — iGAS contacts</a></li>'+
         '<li><b>Health Protection (Notification) Regulations 2010</b> — scarlet fever is notifiable in England; notify suspected outbreaks and iGAS cases, or discuss them, through the local UKHSA health protection team arrangements.</li>'+
         '<li><b>NHS England — Pharmacy First: impetigo clinical pathway and patient group directions</b> (2024, PGDs updated 2025)<br><a href="https://www.england.nhs.uk/primary-care/pharmacy/pharmacy-services/pharmacy-first/" rel="noopener">england.nhs.uk — Pharmacy First</a><span class="rd"> — non-bullous impetigo, age 1 year and over; widespread = 4 or more lesions or clusters.</span></li>'+
         '<li><b>BNF and BNFC</b> — hydrogen peroxide 1% cream, fusidic acid, mupirocin, flucloxacillin, clarithromycin, erythromycin, aciclovir<br><a href="https://bnf.nice.org.uk/" rel="noopener">bnf.nice.org.uk</a> · <a href="https://bnfc.nice.org.uk/" rel="noopener">bnfc.nice.org.uk</a></li>'+
         '<li><b>NICE NG190 — Secondary bacterial infection of eczema and other common skin conditions: antimicrobial prescribing</b> (2021)<br><a href="https://www.nice.org.uk/guidance/ng190" rel="noopener">nice.org.uk/guidance/ng190</a><span class="rd"> — infected eczema in people who are not systemically unwell: antibiotics not routinely offered.</span></li>'+
         '<li><b>Greater Manchester Medicines Management Group — GM antimicrobial guidelines and formulary</b> (current version)<br><a href="https://gmmmg.nhs.uk" rel="noopener">gmmmg.nhs.uk</a><span class="rd"> — do not prescribe mupirocin for routine impetigo unless advised by microbiology.</span></li>'+
         '<li><b>UKHSA — PVL-associated <i>Staphylococcus aureus</i> infections: diagnosis and management</b> (current version)<br><a href="https://www.gov.uk/government/publications/pvl-staphylococcus-aureus-infections-diagnosis-and-management" rel="noopener">gov.uk — PVL <i>S. aureus</i></a><span class="rd"> — recurrent boils or abscesses, severe recurrent skin infection, household clusters.</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral</b> (2015, last updated 15 April 2026)<br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — skin lesion that raises the suspicion of squamous cell carcinoma: consider a suspected cancer pathway referral.</span></li>'+
         '<li><b>Koning S, van der Sande R, Verhagen AP, et al. Interventions for impetigo.</b> Cochrane Database of Systematic Reviews 2012; CD003261.</li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Impetigo in primary care — NICE NG153 (February 2020), UKHSA exclusion guidance for children and young people settings, UKHSA scarlet fever outbreak guidelines (January 2023) and iGAS contacts guidance (December 2022), NHS England Pharmacy First, NICE NG190, GMMMG antimicrobial guidelines, UKHSA PVL guidance, BNF and BNFC, and NICE NG12 (updated April 2026). Check every dose against the current BNF or BNFC and your local formulary. Not a substitute for clinical judgement."
