  lead:'<div class="mg-layers"><a href="#severe"><b>Exclude first</b><small>Decompensation · suspected cancer</small></a><a href="#confirm"><b>MASLD or ALD?</b><small>Metabolic vs alcohol</small></a><a href="#workup"><b>Stage it</b><small>FIB-4 · ELF · FibroScan</small></a><a href="#ladder"><b>Treat</b><small>CV risk · weight · drugs</small></a><a href="#refer"><b>Refer</b><small>Hepatology · surveillance</small></a></div>',
  quickSub:"If you read nothing else on this page, read these six cards. Every number traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Decompensation is the turning point", html:"<b>Jaundice, new ascites, variceal bleeding or encephalopathy → same-day.</b> Median survival after a first decompensation is 1–2 years without transplant. Acute liver failure — ALT &gt;10× ULN with INR &gt;1.5 and encephalopathy — is a medical emergency."},
    {tone:"amber", h:"Most is benign; the job is finding the high-risk subgroup", html:"MASLD is common, but the clinically important issue is identifying the subgroup with advanced fibrosis or progressive disease. Risk is substantially higher in people with type 2 diabetes, obesity, persistent liver-test abnormalities or established fibrosis. Use the local NHS fibrosis pathway: a common BSG/EASL pathway is FIB-4 first, followed by ELF or transient elastography for indeterminate results; NICE NG49 uses ELF, with ELF ≥10.51 indicating advanced fibrosis."},
    {tone:"blue", h:"FIB-4 bands", html:"Thresholds vary by pathway — use the local validated pathway and do not mix cut-offs from different guidelines; in the absence of a local pathway, confirm the chosen threshold with hepatology. Commonly: &lt;1.30 — low risk; manage in primary care. Indeterminate up to 2.67 (EASL) or 3.25 (older BSG pathways) — NOT to be managed as low risk: ELF or FibroScan. Above the upper cut-off — high risk; hepatology. In adults over 65 a lower-risk threshold around 2.0 is commonly used because age inflates FIB-4 (McPherson et al., Am J Gastroenterol 2017). Less reliable in acute hepatitis, thrombocytopenia and other conditions affecting AST, ALT or platelets."},
    {tone:"green", h:"They die of heart attacks, not liver failure", html:"Cardiovascular disease is the commonest cause of death in MASLD, and MASLD is an important cardiovascular risk enhancer. <b>Assess cardiovascular risk and treat hypertension, diabetes, dyslipidaemia and smoking</b> — use QRISK3 where appropriate and valid, but not as the sole determinant in established CVD, diabetes or FH — this is a core part of management, not an afterthought."},
    {tone:"green", h:"Statins are safe — the fear is an evidence-based myth", html:"Stable MASLD, compensated cirrhosis and mildly raised transaminases are not reasons to withhold an indicated statin (NICE NG238: do not routinely exclude people if transaminases are raised but &lt;3× ULN). Repeat transaminases and lipids at 2–3 months after starting or changing the dose, at 12 months, then only if clinically indicated. If ALT/AST is &gt;3× ULN, investigate the cause and follow the lipid/statin pathway rather than automatically attributing it to MASLD. Check CK only with clinically significant muscle symptoms or relevant risk factors."},
    {tone:"cream", h:"Weight loss is the treatment, and it is dose-dependent", html:"5% or more reduces steatosis · 7% or more improves MASH · 10% or more reduces fibrosis — weight loss of ≥10% is the only intervention consistently shown to reverse significant fibrosis. For a 90 kg patient that is 9 kg. A structured Tier 3 programme beats self-directed effort."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step is where cirrhosis and cancer are missed.",
  pathway:[
    {title:"Exclude decompensation and acute hepatitis", html:"Jaundice with coagulopathy, ascites, variceal bleed, encephalopathy, a nodular liver on imaging — and suspected cholangitis — and <b>a marked or progressive liver-test derangement (e.g. ALT above 3× ULN) should not be labelled uncomplicated MASLD</b>.", alert:true},
    {title:"Confirm the diagnosis and the aetiology", html:"<b>MASLD requires hepatic steatosis plus at least one cardiometabolic risk factor, after considering alcohol exposure and other causes of steatotic liver disease.</b> Quantify current and previous alcohol in units with AUDIT-C and a detailed history; mixed metabolic and alcohol-related disease is MetALD. An AST:ALT ratio above 2, raised GGT and macrocytosis may support alcohol-related disease, but none is diagnostic alone. Examine for jaundice, hepatosplenomegaly, ascites, oedema and encephalopathy; record BMI/waist, diabetes status, lipids and BP. Arrange the viral, autoimmune and metabolic liver screen and review drugs, supplements and herbal medicines."},
    {title:"Stage the fibrosis", html:"<b>Use the local fibrosis pathway</b> — commonly FIB-4 first, then ELF or transient elastography for indeterminate results, and hepatology for high scores or advanced ELF (NICE NG49: ELF ≥10.51). Interpret all non-invasive tests alongside BMI, inflammation, thrombocytopenia, alcohol use and clinical features."},
    {title:"Treat the metabolic drivers and the CV risk", html:"Weight loss, Mediterranean diet, fructose elimination, exercise, alcohol reduction; <b>cardiovascular risk assessment, with a statin where indicated</b>; <b>GLP-1 agonists, SGLT2 inhibitors or pioglitazone for their established indications</b>, not as MASLD-specific primary-care treatment."},
    {title:"Re-stratify and safety-net", html:"<b>Repeat fibrosis assessment at the local-pathway interval</b> (commonly every 2–3 years for low risk; NICE NG49: ELF every 3 years), or sooner if metabolic risk worsens; <b>6-monthly ultrasound ± AFP once cirrhotic</b>; and give the same-day list."}
  ],
  sections:[

    {id:"severe", nav:"Exclude first", title:"Red flags — when fatty liver signals advanced disease",
     sub:"Fatty liver is extremely common and mostly benign. These features mean it is not.",
     blocks:[
       {b:"table", head:["Red flag","Features","Action"], rows:[
         ["<b>Jaundice with deranged LFTs</b>","<b>Bilirubin &gt;50 µmol/L, coagulopathy (INR &gt;1.5), encephalopathy</b>","<b>Same-day — decompensated liver disease or acute liver failure</b>"],
         ["<b>Haematemesis or melaena</b>","Suspected variceal bleed","<b>999</b> — a cirrhosis-related portal hypertension complication"],
         ["<b>New-onset ascites</b>","Abdominal distension, <b>shifting dullness</b>, peripheral oedema","<b>Same-day specialist/hospital assessment — decompensated cirrhosis.</b> Do not delay diagnostic paracentesis or specialist management"],
         ["<b>Hepatic encephalopathy</b>","Confusion, <b>asterixis (liver flap)</b>, behavioural change in chronic liver disease","<b>Same-day.</b> Look for the precipitant — infection, GI bleed, constipation, drugs"],
         ["<b>RUQ pain + fever + jaundice</b>","<b>Charcot's triad</b>","<b>Same-day — ascending cholangitis</b>, not fatty liver; exclude a biliary cause"],
         ["<b>Marked or progressive transaminase rise (e.g. ALT &gt;3× ULN)</b>","Needs active investigation","<b>Not simple MASLD</b> — consider acute hepatitis (viral, drug-induced, autoimmune, ischaemic)"],
         ["<b>Established cirrhosis + new weight loss or RUQ pain</b>","Surveillance failure","Urgent hepatology/radiology review via the local HCC pathway if AFP is rising, the USS is abnormal or there are new RUQ symptoms — suspected hepatocellular carcinoma"],
         ["<b>Alcohol: acute binge with deranged LFTs</b>","<b>AST:ALT ratio &gt;2:1, GGT markedly elevated</b>","Same-day if severe alcoholic hepatitis is suspected (Maddrey score &gt;32)"]
       ]},
       {b:"why", html:"MASLD is common, but the clinically important task is identifying the subgroup with advanced fibrosis or progressive disease — risk is substantially higher with type 2 diabetes, obesity, persistent liver-test abnormalities or established fibrosis. Decompensation (jaundice, ascites, encephalopathy, variceal bleed) is a major turning point: median survival after the first episode is 1–2 years without transplant. An AST:ALT ratio above 2 in a drinker supports alcohol-related liver disease, though it is not diagnostic alone — AST is disproportionately elevated because of pyridoxine deficiency. Acute liver failure (ALT &gt;10× ULN + INR &gt;1.5 + encephalopathy) needs same-day specialist assessment."},
       {b:"dl", rows:[
         ["<b>NG12 — the criterion that applies here</b>","Fatty liver itself has no NICE NG12 suspected-cancer criterion, and none should be invented for one — but cirrhosis is a premalignant state. A new liver lesion on ultrasound, a rising AFP, or known cirrhosis with new right upper quadrant pain or weight loss requires urgent hepatology/radiology review via the local HCC pathway — it is not automatically an NG12 referral. HCC surveillance is confined to confirmed cirrhosis (6-monthly ultrasound ± AFP) rather than offered to everyone with steatosis — the distinction is what avoids mass over-investigation. Restated with the threshold in <a href='#refer'>Refer</a>"]
       ]}
     ]},

    {id:"confirm", nav:"MASLD or ALD?", title:"Confirm the diagnosis — and separate metabolic from alcohol-related disease",
     sub:"Both present with a raised ALT and GGT and a bright liver on ultrasound. The distinction determines the treatment pathway.",
     blocks:[
       {b:"dl", rows:[
         ["<b>MASLD criteria (2023)</b>","Hepatic steatosis on imaging (a bright echogenic liver on USS) or biopsy, PLUS at least one cardiometabolic risk factor, after considering alcohol exposure and other causes of steatotic liver disease (obesity does not exclude alcohol-related disease): BMI &gt;25 (or waist &gt;94/80 cm, men/women — waist &gt;94 cm in men, &gt;80 cm in women), triglycerides &gt;1.7 mmol/L, HDL &lt;1.0 (men) or &lt;1.3 mmol/L (women), BP ≥130/85, HbA1c ≥5.7%, or type 2 / pre-diabetes. <b>Replaces the term \u201cNAFLD\u201d</b>"],
         ["<b>MetALD and ALD</b>","Quantify alcohol in units and assess current and previous consumption; do not classify solely by weekly units (14 units/week is the UK low-risk drinking guideline, not a diagnostic threshold). EASL 2024: <b>MetALD</b> = MASLD with moderate alcohol intake, approximately 20–50 g/day in women or 30–60 g/day in men (10 g ≈ 1 UK unit, so about 2–5 or 3–6 units/day); <b>ALD</b> = higher intake, approximately &gt;50 g/day in women or &gt;60 g/day in men. With both metabolic risk and moderate alcohol exposure, manage both the metabolic disease and the alcohol use. An AST:ALT ratio &gt;2, raised GGT, macrocytosis and raised CDT may support alcohol-related disease, but none is diagnostic alone"],
         ["<b>Quantify the alcohol properly</b>","<b>Use AUDIT-C, and be direct: \u201cHow many units per week?\u201d</b> 1 unit = 10 mL pure alcohol = a small glass of wine = half a pint of beer = a single spirit. <b>Document the actual consumption, not \u201csocial drinker\u201d</b>"],
         ["<b>Drug-induced steatosis</b>","Amiodarone, methotrexate, tamoxifen, corticosteroids, antipsychotics (olanzapine), NSAIDs, and rarely statins. Review the complete drug history including over-the-counter medicines and supplements"],
         ["<b>Other causes to exclude</b>","Per the BSG abnormal liver blood-test pathway: <b>hepatitis B</b> (HBsAg, with further testing if positive) · <b>hepatitis C</b> (antibody with reflex RNA or core antigen) · <b>autoimmune hepatitis</b> (autoantibodies and immunoglobulins) · <b>haemochromatosis</b> (ferritin and transferrin saturation) · <b>coeliac testing</b> where clinically appropriate · <b>alpha-1 antitrypsin</b> where indicated · <b>caeruloplasmin</b> in younger adults or where Wilson's disease is plausible (unexplained liver disease, neurological or psychiatric features) — not every adult with fatty liver · drug, supplement and herbal medicine review"],
         ["<b>What the ultrasound tells you</b>","A bright echogenic liver means steatosis. An irregular surface means cirrhosis. Splenomegaly means portal hypertension. A hepatic nodule is HCC until proved otherwise. <b>USS cannot differentiate fibrosis stages</b>"]
       ]},
       {b:"why", html:"The 2023 nomenclature change from NAFLD to MASLD (metabolic dysfunction-associated steatotic liver disease) is clinically meaningful — it explicitly ties fatty liver to metabolic syndrome and drops the stigmatising \u201cnon-alcoholic\u201d label. The two frequently co-exist as dual-aetiology steatotic liver disease (MetALD), and the treatments differ: ALD requires alcohol cessation as the primary intervention, MASLD requires metabolic risk reduction. On markers: GGT is the most sensitive marker of alcohol use but has low specificity — many drugs, obesity and diabetes raise it — whereas an MCV &gt;100 fL with a raised GGT supports significant alcohol intake, though neither is diagnostic alone."}
     ]},

    {id:"workup", nav:"Stage it", title:"Investigations and fibrosis staging — follow the local pathway",
     sub:"Fibrosis stage determines prognosis and referral. Use the local NHS fibrosis pathway, and do not mix cut-offs from different guidelines.",
     blocks:[
       {b:"dl", rows:[
         ["<b>FIB-4</b>","<b>FIB-4 = (age × AST) ÷ (platelets × √ALT)</b>, with age in years, AST and ALT in U/L and platelets in 10⁹/L"],
         ["<b>FIB-4 &lt;1.30 — low risk</b>","Advanced fibrosis unlikely. Lifestyle and metabolic management; repeat at the local-pathway interval (commonly 2–3 years) or if metabolic risk changes"],
         ["<b>FIB-4 indeterminate (1.30 up to 2.67 or 3.25, by pathway)</b>","Refer for an ELF test (Enhanced Liver Fibrosis) or FibroScan. Do NOT manage as low risk"],
         ["<b>FIB-4 high risk (above 2.67 or 3.25, by pathway)</b>","Hepatology referral for specialist staging (elastography and/or ELF; biopsy only if uncertainty remains)"],
         ["<b>FIB-4 limitations</b>","Less accurate in the over-65s (age &gt;65) (falsely elevated), in acute hepatitis (transaminase spike) and in thrombocytopenia. In adults over 65 a lower-risk threshold around 2.0 is commonly used because age inflates FIB-4 (McPherson 2017). Do not calculate FIB-4 during acute hepatitis or a transient transaminase spike, and interpret thrombocytopenia clinically rather than treating the score as definitive. In the absence of a local pathway, confirm the chosen threshold with hepatology"],
         ["<b>NG49 and the FIB-4 first step</b>","NICE NG49 (2016) itself uses the ELF test (advanced fibrosis at 10.51 or above); FIB-4 as the first primary care step comes from BSG/EASL and local NHS pathways (BSG: Newsome et al., Gut 2018). Older BSG pathways use 1.30 and 3.25; recent EASL pathways use about 2.67 as the high-risk threshold. Indeterminate scores go for ELF or FibroScan via the local pathway"]
       ]},
       {b:"table", head:["Investigation","Detail"], rows:[
         ["<b>First-line in all patients</b>","LFTs (ALT, AST, GGT, ALP, bilirubin, albumin), FBC (platelets for portal hypertension, MCV for alcohol), INR/PT (synthetic function), U&amp;E/renal function, fasting lipids, HbA1c, TFTs"],
         ["<b>Fibrosis score</b>","<b>FIB-4 — needs age, AST, ALT and platelets; use per the local pathway.</b> Plus <b>ferritin and transferrin saturation</b> to exclude haemochromatosis"],
         ["<b>Exclude other causes</b>","HBsAg (further testing if positive); hepatitis C antibody with reflex RNA or core antigen — part of the standard liver aetiology screen (BSG 2018); autoantibodies (ANA, ASMA, anti-LKM1) and immunoglobulins for autoimmune hepatitis; coeliac serology where clinically appropriate; alpha-1 antitrypsin where indicated; <b>caeruloplasmin</b> in younger adults or where Wilson's disease is plausible (unexplained liver disease, neurological or psychiatric features)"],
         ["<b>USS abdomen</b>","<b>First-line imaging.</b> Confirms steatosis, excludes biliary obstruction, detects a focal lesion, estimates liver size and splenomegaly. <b>Does NOT reliably stage fibrosis</b>"],
         ["<b>ELF test</b>","<b>Hyaluronic acid, TIMP-1 and PIIINP panel</b>, via secondary care or some community pathways. For indeterminate FIB-4. <b>NICE NG49 threshold: ELF ≥10.51 indicates advanced fibrosis.</b> Some BSG/local laboratory pathways use ELF ≥9.8 as a high-risk referral threshold — the two are not interchangeable; follow the reporting laboratory and local hepatology pathway"],
         ["<b>FibroScan (transient elastography)</b>","<b>Liver stiffness in kPa.</b> Fasting per local protocol; an XL probe is often needed in obesity. <b>Interpret using the local liver pathway, including probe type and quality criteria</b> — commonly used approximate cut-offs (around 8 kPa and 12 kPa) are not universal staging rules. Stiffness is raised by active inflammation, cholestasis, congestion/heart failure, recent food intake and alcohol. Borderline or discordant results require specialist interpretation; no single kPa value definitively diagnoses fibrosis or cirrhosis"],
         ["<b>Liver biopsy</b>","Specialist-led and reserved for unresolved diagnostic or staging uncertainty — discordant or inconclusive non-invasive tests, suspected competing liver disease, or where histology will alter specialist treatment. Not required for most patients with MASLD"]
       ]},
       {b:"why", html:"<b>Test for hepatitis C in anyone with abnormal liver tests</b> (BSG 2018 aetiology screen) — many people acquired it through injecting drug use in the 1980s and 90s and are unaware; the treat-all policy with direct-acting antivirals cures over 95% and reverses fibrosis — direct-acting antivirals (DAAs). And <b>autoimmune hepatitis is commonly missed in primary care</b>: it typically presents in a young woman with a raised ALT, raised IgG and positive ANA or ASMA, and missing it risks progression to cirrhosis without immunosuppressive treatment — so check autoimmune markers whenever the LFTs are unexpectedly elevated, particularly in women of reproductive age."}
     ]},

    {id:"cvrisk", nav:"CV risk", title:"Cardiovascular risk — the overlooked priority",
     sub:"Patients with MASLD are more likely to die from cardiovascular disease than from liver disease.",
     blocks:[
       {b:"table", head:["Domain","Action"], rows:[
         ["<b>Why it dominates</b>","The commonest cause of death in MASLD is cardiovascular — MI and stroke — not liver failure. MASLD is an important cardiovascular risk enhancer"],
         ["<b>Cardiovascular risk assessment</b>","BP, full lipid profile, HbA1c, smoking, renal function and urine ACR where indicated, atrial fibrillation and established CVD, obesity and sleep apnoea, family history of premature CVD. <b>Use QRISK3 where appropriate and valid</b> — it is not required when treatment is already indicated by established CVD, diabetes, FH or another high-risk condition, and must not delay an indicated statin. Statin eligibility is independent of mildly abnormal ALT. <b>Treat every modifiable component</b>"],
         ["<b>Statins</b>","Stable MASLD, compensated cirrhosis and mildly raised transaminases are not reasons to withhold an indicated statin; do not routinely exclude people if transaminases are raised but &lt;3× ULN (NICE NG238). Repeat transaminases and lipids at 2–3 months after starting or changing the dose, at 12 months, then only if clinically indicated. If ALT/AST is &gt;3× ULN, investigate the cause and follow the lipid/statin pathway rather than attributing it to MASLD. CK only with clinically significant muscle symptoms or relevant risk factors"],
         ["<b>Type 2 diabetes</b>","Use GLP-1 agonists, SGLT2 inhibitors or pioglitazone for their established diabetes indications per the current diabetes pathway — any liver benefit is an additional potential benefit, not a primary-care MASLD indication. Pioglitazone is contraindicated in heart failure, previous or active bladder cancer and unexplained visible haematuria; pioglitazone or vitamin E for MASLD is a specialist/off-label decision (NICE NG49: advanced fibrosis, secondary or tertiary care only). Metformin is neutral on the liver"],
         ["<b>Blood pressure</b>","Hypertension commonly accompanies MASLD. Choose treatment by the usual NICE NG136 indications and treat to the NG136 target (clinic BP below 140/90 mmHg under 80 years)"],
         ["<b>Dyslipidaemia</b>","Manage dyslipidaemia according to NICE NG238 and local lipid guidance. Treat severe hypertriglyceridaemia according to pancreatitis and lipid-specialist pathways; do not prescribe fibrates or omega-3 products solely to treat MASLD"]
       ]},
       {b:"warn", html:"The single most important clinical message about MASLD: most of these patients die from heart attacks, not liver failure. That changes the priority — treating hypertension, dyslipidaemia, diabetes and obesity is the primary intervention. The fear of statin-induced liver damage in MASLD is an evidence-based myth."}
     ]},

    {id:"ladder", nav:"Treat", title:"Treatment — weight loss, drugs, and cirrhosis care",
     blocks:[
       {b:"ladder", steps:[
         {step:"Everyone", title:"Weight loss — the dose-dependent treatment", when:"MASLD without diabetes",
          html:"Target above 5–7% as a minimum: ≥5% reduces steatosis, ≥7% improves MASH (steatohepatitis — inflammation), ≥10% reduces fibrosis. Diet plus exercise, with referral to a <b>structured tier 2 or tier 3 service</b>. <b>There are no licensed drugs for MASLD in primary care as of 2025.</b>"},
         {step:"With diabetes", title:"GLP-1 agonist — for its established indication", when:"MASLD + type 2 diabetes",
          fromLabel:"dual indication",
          html:"Use GLP-1 agonists when indicated for type 2 diabetes or obesity, following the current diabetes/obesity pathway. Any liver benefit is currently an additional potential benefit, not a primary-care MASLD indication. Pioglitazone is not a routine second-line MASLD drug: it is contraindicated in heart failure, previous or active bladder cancer and unexplained visible haematuria, and NICE NG49 allows pioglitazone or vitamin E for advanced fibrosis only in secondary or tertiary care (specialist/off-label decisions)."},
         {step:"If alcohol-related", title:"Alcohol cessation — essential, not optional", when:"ALD",
          fromLabel:"the primary treatment",
          html:"Assess alcohol dependence and withdrawal risk and arrange specialist alcohol-service involvement. High-risk withdrawal, previous seizures/DTs, severe dependence, significant liver disease or poor social support may require inpatient medically assisted withdrawal; in the community use a local fixed-dose protocol with regular monitoring (symptom-triggered regimens need 24-hour monitoring and trained staff) — do not provide unsupervised benzodiazepine detoxification. Chlordiazepoxide and diazepam may accumulate in advanced liver disease, so seek specialist advice. Prescribe thiamine according to local alcohol-treatment guidance and nutritional risk; suspected Wernicke's encephalopathy requires urgent hospital assessment and parenteral thiamine. Acamprosate or oral naltrexone with psychological treatment after successful withdrawal — naltrexone needs particular caution in significant liver disease. Refer to the alcohol team."},
         {step:"If cirrhotic", title:"Cirrhosis care and surveillance", when:"confirmed cirrhosis",
          fromLabel:"advanced fibrosis confirmed",
          html:"Specialist hepatology follow-up. HCC surveillance — six-monthly ultrasound with or without AFP (NICE NG50), considering whether surveillance is appropriate at the end of life or where curative treatment would not be. Portal hypertension — endoscopy and/or non-invasive criteria per the hepatology pathway; prophylaxis may involve carvedilol, propranolol or band ligation according to findings and contraindications. New ascites requires same-day specialist/hospital assessment — do not delay diagnostic paracentesis or specialist management; diuretics are specialist-initiated. Avoid NSAIDs, particularly with ascites, renal dysfunction or portal hypertension (AKI and hepatorenal risk)."},
         {step:"Selected", title:"Bariatric surgery", when:"BMI &gt;40, or &gt;35 with comorbidity",
          fromLabel:"advanced fibrosis with obesity",
          html:"Bariatric surgery offers the greatest degree of liver fibrosis regression in MASLD with advanced fibrosis. <b>Tier 3 weight management referral first.</b>"}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"💉 Vaccination", html:"<b>Check vaccination status.</b> People with cirrhosis or chronic liver disease may require hepatitis A, hepatitis B, influenza, pneumococcal, COVID-19 and other vaccines according to the Green Book and local policy — guided by the degree of liver disease, aetiology, occupational/travel risk and the national schedule."},
         {tone:"red", h:"🚫 Medicines review in cirrhosis", html:"In cirrhosis, review all medicines for renal, bleeding and encephalopathy risk. Avoid NSAIDs particularly in ascites, renal dysfunction or portal hypertension. Use sedatives and opioids only when clinically necessary, at low doses with specialist input where appropriate. Check the local liver/palliative formulary for paracetamol dosing. Co-amoxiclav can cause hepatotoxicity; review metformin if eGFR &lt;30; avoid herbal supplements."},
         {tone:"blue", h:"🔬 Resmetirom — watch this space", html:"Resmetirom (Rezdiffra) is an emerging specialist treatment for non-cirrhotic MASH with significant fibrosis (FDA-approved in the USA, March 2024). Do not prescribe it in primary care or assume NHS availability until the current MHRA product information, the NICE technology appraisal (in development) and the local commissioning pathway are confirmed."}
       ]},
       {b:"why", html:"Weight loss of ≥10% is the only intervention consistently shown to reverse significant hepatic fibrosis in MASLD — for a 100 kg patient, 10 kg. Semaglutide 2.4 mg resolved steatohepatitis without worsening fibrosis in 62.9% versus 34.3% on placebo at 72 weeks in the phase 3 ESSENCE trial (Sanyal et al., NEJM 2025), with fibrosis also improving more often than on placebo, and earlier histological improvement in the LEAN and SUSTAIN programmes, making them the most promising pharmacological option — though not yet a primary-care MASLD indication. And HCC risk rises exponentially with fibrosis stage: cirrhosis carries a 2–4% annual HCC risk, which is what makes 6-monthly surveillance cost-effective."}
     ]},

    {id:"lifestyle", nav:"Lifestyle", title:"Lifestyle — the foundation of treatment",
     sub:"Quantifying each intervention is what makes the conversation persuasive.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"⚖️ Weight loss target ≥10%", html:"<b>The single most effective intervention — for a 90 kg patient, 9 kg.</b> Achievable with a <b>500–750 kcal/day deficit</b>. A structured programme (Tier 3 service) is superior to self-directed effort. Set a 6-month target."},
         {tone:"green", h:"🫒 Mediterranean diet", html:"<b>The highest evidence base in MASLD.</b> Olive oil, oily fish, legumes, vegetables, nuts, wholegrains. Reduces hepatic fat by 20–30% over 6 months independently of calorie restriction. Avoid ultra-processed foods."},
         {tone:"amber", h:"🥤 Fructose and sugar", html:"High fructose intake — fizzy drinks, fruit juice, processed food — directly drives hepatic de novo lipogenesis. Eliminate all sugar-sweetened beverages: a significant and rapid effect on liver fat, because fructose is metabolised almost exclusively in the liver."},
         {tone:"blue", h:"🚶 Aerobic exercise", html:"≥150 min/week (150–300 minutes a week) of moderate intensity reduces liver fat by 5–10% even without weight loss. Walking, cycling, swimming — <b>exercise alone still meaningfully reduces steatosis</b>."},
         {tone:"blue", h:"🏋️ Resistance training", html:"2–3 sessions a week improves insulin sensitivity and reduces liver fat. Combined aerobic plus resistance is more effective than either alone, and is particularly valuable in sarcopenic obesity."},
         {tone:"amber", h:"🍷 Alcohol", html:"Alcohol adds to liver injury in MASLD — people with metabolic risk and moderate alcohol exposure fall within the MetALD spectrum, and management should address both. Recommend complete abstinence if MASH or fibrosis is present. AUDIT-C screening."},
         {tone:"cream", h:"☕ Coffee", html:"3–4 cups of regular coffee a day is associated with about 40% lower cirrhosis risk and reduced HCC risk — cafestol, kahweol and antioxidants reduce hepatic inflammation. <b>The evidence supports encouraging coffee, not decaf.</b>"},
         {tone:"blue", h:"😴 Sleep and OSA", html:"Obstructive sleep apnoea is independently associated with more severe fatty liver — screen obese patients with STOP-BANG. CPAP may reduce hepatic inflammation, because untreated OSA causes intermittent hypoxia which activates hepatic stellate cells and drives fibrosis."}
       ]}
     ]},

    {id:"monitor", nav:"Monitoring", title:"Follow-up, re-stratification and surveillance",
     blocks:[
       {b:"table", head:["Group","Monitoring"], rows:[
         ["<b>Low risk (FIB-4 &lt;1.30)</b>","Metabolic and cardiovascular review (HbA1c, lipids, BP, weight) per the relevant NICE pathways; LFTs when clinically indicated rather than routinely every year. Repeat the locally chosen non-invasive fibrosis assessment at the local-pathway interval — commonly every 2–3 years for low-risk adults; NICE NG49 specifies three-year reassessment using ELF (ELF below 10.51), with no interim tests required. Do not arrange routine serial ultrasound solely to monitor uncomplicated steatosis — repeat ultrasound only for a specific indication (new symptoms, abnormal examination, cholestasis or cirrhosis surveillance). No hepatology referral needed"],
         ["<b>Indeterminate / post-FibroScan</b>","Follow specialist advice. If no significant fibrosis is confirmed on the local pathway, manage as low risk and recheck at the pathway interval. If F2 or above, hepatology follow-up per specialist advice"],
         ["<b>Confirmed cirrhosis</b>","Specialist hepatology follow-up. HCC surveillance — ultrasound with or without AFP every 6 months (NICE NG50). Upper GI endoscopy after diagnosis unless planning carvedilol or propranolol to prevent decompensation; if no varices and not on carvedilol/propranolol, repeat every 3 years; medium or large varices → carvedilol/propranolol, or band ligation if beta-blockers are unsuitable (NICE NG50). Annual FBC, LFTs, INR, albumin and creatinine; MELD/Child-Pugh monitoring; vaccination, nutrition, bone health and medication review; safety-net for jaundice, ascites, confusion, bleeding and infection"],
         ["<b>ALD monitoring</b>","LFTs monthly for 3 months after cessation, then 3-monthly. GGT normalises in 4–6 weeks of abstinence; MCV normalises in 3 months. Persistent GGT elevation suggests ongoing drinking"],
         ["<b>Cardiovascular</b>","Continue cardiovascular risk management — the commonest cause of death in MASLD"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 Same-day", html:"New jaundice · new ascites · confusion or encephalopathy · haematemesis · melaena · acute RUQ pain with fever (cholangitis)."},
         {tone:"amber", h:"🟠 Within 48 hours", html:"Rising bilirubin · worsening oedema on diuretics · new peripheral oedema in known liver disease · a significant ALT rise (more than 3× the baseline)."},
         {tone:"blue", h:"🔁 Rising FIB-4", html:"Fibrosis risk evolves — a rising score means re-testing with ELF or elastography, or referral."}
       ]},
       {b:"say", html:"Your scan shows fat in the liver, which about a quarter of adults have — on its own it is usually not dangerous. The blood score I have calculated tells me how likely it is that there is any scarring, and yours is in the low band, so we manage this here rather than sending you to a specialist. Two things matter far more than the liver result itself. First, losing about a tenth of your weight is the one thing proven to reverse liver scarring — that is the treatment. Second, people with fatty liver are much more likely to have a heart attack than liver trouble, which is why I want you on a statin: it is safe in fatty liver, and I am not going to stop it for a slightly abnormal liver test."}
     ]},

    {id:"refer", nav:"Refer", title:"Referral criteria",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same-day", html:"Jaundice with coagulopathy, new ascites, GI or variceal bleeding, encephalopathy, suspected cholangitis, or acute liver failure (ALT &gt;10× ULN + INR &gt;1.5 + encephalopathy)."},
         {tone:"purple", h:"Suspected cancer · NICE NG12 (updated April 2026)", html:"NG12's liver criterion: consider an urgent direct-access ultrasound (within 2 weeks) to assess for liver cancer in people with an upper abdominal mass consistent with an enlarged liver. A rising AFP or a new lesion on cirrhosis surveillance, or known cirrhosis with new RUQ pain or weight loss, is not itself an NG12 criterion — it requires urgent hepatology/radiology review via the local HCC pathway."},
         {tone:"blue", h:"Hepatology (routine)", html:"High FIB-4 or advanced ELF per the local pathway (NICE NG49: ELF ≥10.51; some local pathways use ≥9.8) · indeterminate FIB-4 (for ELF or FibroScan) · borderline or discordant non-invasive results · ALT persistently above 3× ULN without a clear cause · suspected autoimmune hepatitis · confirmed hepatitis B or C."},
         {tone:"green", h:"Community FibroScan", html:"Many ICBs have community transient elastography services — refer directly for an indeterminate FIB-4 without a hepatology outpatient appointment. Check the local pathway."},
         {tone:"amber", h:"Alcohol services", html:"Harmful or dependent drinking with abnormal LFTs — community alcohol team (SMART Recovery, CGL, Turning Point). Specialist-led assisted withdrawal if dependent — inpatient if high risk, previous seizures/DTs, significant liver disease or poor social support."},
         {tone:"cream", h:"Manage in primary care", html:"Low risk on the local fibrosis pathway with stable LFTs (ALT &lt;3× ULN) and ongoing metabolic risk factor management. Repeat fibrosis assessment at the local-pathway interval (commonly 2–3 years; NICE NG49: ELF every 3 years); no routine serial ultrasound for uncomplicated steatosis."}
       ]},
       {b:"why", html:"<b>FIB-4 is the primary care gatekeeper deliberately</b> (BSG 2018; NG49 names ELF) — hepatology services are overwhelmed by MASLD referrals because the prevalence is so high, and most patients with a low FIB-4 never need to be seen. The community FibroScan pathway lets primary care access elastography directly for indeterminate-risk patients without a specialist appointment. And confining HCC surveillance to confirmed cirrhosis, rather than all MASLD, is what keeps the surveillance burden proportionate."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 54-year-old with type 2 diabetes and a BMI of 33 has a bright liver reported incidentally on an ultrasound done for gallstones, with an ALT of 68. He drinks \u201ca couple of glasses of wine most nights\u201d. He has read that his statin causes liver damage and has stopped taking it."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"<b>Calculates FIB-4 rather than referring or reassuring on the ALT alone</b>; <b>quantifies the alcohol in units with AUDIT-C and considers MetALD</b>; excludes the other causes (viral, autoimmune, haemochromatosis, drugs); restarts the statin and explains that it is safe and that a rise &lt;3× ULN is acceptable; <b>assesses cardiovascular risk (QRISK3 where valid) and treats the metabolic drivers</b>; sets a <b>quantified weight-loss target with a Tier 3 referral</b>; and — the step candidates miss — says which FIB-4 band the patient is in and when it will be recalculated, rather than leaving the risk unstratified."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>NICE NG49 — Non-alcoholic fatty liver disease (NAFLD): assessment and management (formal title; update adopting MASLD/MASH terminology in development)<br><a href="https://www.nice.org.uk/guidance/ng49" rel="noopener">nice.org.uk/guidance/ng49</a><span class="rd"> — the ELF test (advanced fibrosis at 10.51 or above), reassessment every 3 years if ELF is below 10.51 with no interim tests, and pioglitazone or vitamin E for advanced fibrosis in secondary or tertiary care</span></li>'+
         '<li><b>BSG — Guidelines on the management of abnormal liver blood tests (Newsome et al., Gut 2018)</b><span class="rd"> — FIB-4 as the first-line primary care fibrosis score (older pathway thresholds 1.30 and 3.25) and the standard liver aetiology screen including hepatitis B and C, autoimmune, iron, coeliac, alpha-1 antitrypsin and caeruloplasmin where indicated</span></li>'+
         '<li><b>NICE NG50 — Cirrhosis in over 16s: assessment and management</b><br><a href="https://www.nice.org.uk/guidance/ng50" rel="noopener">nice.org.uk/guidance/ng50</a><span class="rd"> — 6-monthly ultrasound (with or without AFP) for HCC surveillance, with consideration of appropriateness at the end of life; endoscopy after diagnosis unless taking carvedilol or propranolol, repeated every 3 years when no varices were found; carvedilol/propranolol or band ligation for medium or large varices</span></li>'+
         '<li><b>McPherson S et al. Age as a confounding factor for the accurate non-invasive diagnosis of advanced NAFLD fibrosis. Am J Gastroenterol 2017</b><span class="rd"> — FIB-4 low-risk cut-off of 2.0 at age 65 and over</span></li>'+
         '<li><b>EASL-EASD-EASO Clinical Practice Guidelines on the management of MASLD (J Hepatol 2024) (international)</b><br><a href="https://doi.org/10.1016/j.jhep.2024.04.031" rel="noopener">doi.org/10.1016/j.jhep.2024.04.031</a><span class="rd"> — the MASLD diagnostic criteria and the 2023 nomenclature change, MetALD alcohol ranges (about 20–50 g/day women, 30–60 g/day men), FIB-4 thresholds, and GLP-1 agonists for their established diabetes/obesity indications</span></li>'+
         '<li><b>BSG NAFLD guidelines (2021)</b><span class="rd"> — fibrosis staging pathway, approximate FibroScan cut-offs (around 8 and 12 kPa), interpreted with probe type, quality criteria and the local pathway, and surveillance</span></li>'+
         '<li><b>NICE CG115 — Alcohol-use disorders</b><br><a href="https://www.nice.org.uk/guidance/cg115" rel="noopener">nice.org.uk/guidance/cg115</a><span class="rd"> — AUDIT-C, fixed-dose community assisted withdrawal with regular monitoring (symptom-triggered regimens only with 24-hour monitoring), thiamine prophylaxis, and acamprosate or naltrexone for relapse prevention</span></li>'+
         '<li><b>ESSENCE trial (Sanyal et al., NEJM 2025;392:2089), and the LEAN and SUSTAIN programmes</b><span class="rd"> — semaglutide 2.4 mg: steatohepatitis resolution without worsening fibrosis 62.9% vs 34.3% placebo at 72 weeks</span></li>'+
         '<li><b>NICE NG238 — Cardiovascular disease: risk assessment and reduction, including lipid modification</b><br><a href="https://www.nice.org.uk/guidance/ng238" rel="noopener">nice.org.uk/guidance/ng238</a><span class="rd"> — do not routinely exclude people from statins if transaminases are raised but below 3x ULN; transaminases at 2 to 3 months, at 12 months, then only if clinically indicated; no routine fibrates for prevention</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — the liver criterion: urgent direct-access ultrasound for an upper abdominal mass consistent with an enlarged liver; no criterion for fatty liver itself</span></li>'+
         '<li><b>Resmetirom (Rezdiffra) — FDA approval March 2024; NICE technology appraisal in development</b><span class="rd"> — an emerging specialist treatment for non-cirrhotic MASH with significant fibrosis; confirm current MHRA product information, the NICE appraisal and local commissioning before assuming NHS availability</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — fixed drug doses are not given on this page; check the current SPC/BNF and local hepatology, lipid, diabetes and alcohol-service pathways before prescribing</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Fatty liver disease (MASLD / ALD) — NICE NG49, NICE NG50, BSG abnormal liver blood tests 2018, NICE NG238, EASL-EASD-EASO clinical practice guidelines 2024 (international), BSG NAFLD 2021 and NICE CG115. MASLD/MASH terminology is used clinically; NICE NG49 (Non-alcoholic fatty liver disease) remains the formal guideline until its update is published. For the reasoning route from an incidental fatty liver or abnormal LFTs, see the <a href=\"../algorithms/abnormal-lfts.html\">abnormal LFTs pathway</a>. Verify any prescribing against the current SPC/BNF and local pathways."
});
