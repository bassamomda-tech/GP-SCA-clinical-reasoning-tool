MG.render({

  stemSub:"One page for the whole condition: exclude the vaginal mass that is actually a cancer and the acute complications (retention, procidentia with renal obstruction, decubitus ulcer), stage by compartment against the hymen, then offer supervised pelvic floor muscle training and a pessary (with vaginal oestrogen if there are genitourinary symptoms or signs) before surgery is discussed. Check for masked stress incontinence before referring for repair, and refer any suspected mesh complication through the locally commissioned regional mesh-complication pathway. The page applies to women, trans men and non-binary people with female pelvic organs.",
  guideline:"NICE NG123 (2019) · NICE HTG444 (formerly IPG583, 2017) · NICE NG12 (updated April 2026) · NICE NG210 · NICE HTG435 · NICE NG23 · MHRA mesh guidance",
  reviewed:"10 September 2026",
  nextReview:"10 March 2027",
  meta:[
    {t:"NICE NG123 — urinary incontinence &amp; POP in women (2019)"},
    {t:"NICE HTG444 (formerly IPG583, 2017) — sacrocolpopexy with mesh"},
    {t:"MHRA 2018 vaginal mesh pause · IMMDS (Cumberlege) Review 2020"},

    {t:"v1.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#severe"><b>Exclude first</b><small>Cancer · retention · mesh</small></a><a href="#confirm"><b>Stage it</b><small>POP-Q · compartments</small></a><a href="#workup"><b>Assess</b><small>Masked SUI · PVR</small></a><a href="#ladder"><b>Treat</b><small>PFMT · pessary · surgery</small></a><a href="#monitor"><b>Follow-up</b><small>Pessary reviews</small></a></div>',
  quickSub:"If you read nothing else on this page, read these six cards. Every number traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Examine the bulge — don't assume it is \u201cjust a prolapse\u201d", html:"Examine the prolapse and the cervix. An irregular, friable, fixed or persistently ulcerated lesion that cannot confidently be explained by trauma needs a suspected cancer pathway referral, and NICE NG12 recommends considering one for any unexplained palpable mass in or at the entrance to the vagina. Unexplained PMB not attributable to HRT: refer at 55 or over and consider referral under 55 (NICE NG12, updated April 2026). Not every area of ulcerated prolapsed mucosa is malignant, but persistent, atypical, indurated or irregular lesions need urgent assessment. <b>Safety precaution (not a NICE recommendation): do not attempt manual reduction of a suspicious mass.</b> PMB in a woman with prolapse is easily and wrongly attributed to a decubitus ulcer — <b>endometrial carcinoma can present alongside prolapse.</b>"},
    {tone:"red", h:"Procidentia can obstruct the kidneys", html:"Retention with flank pain, renal impairment or suspected hydronephrosis suggests upper tract obstruction from urethral or ureteric kinking. Arrange same-day specialist assessment; acute retention needs bladder decompression and urgent gynaecology or urology advice. Renal tract imaging is guided by the acute clinical assessment and local pathway, and reduction is for clinicians trained in it."},
    {tone:"amber", h:"Treat by symptoms, not by the stage number", html:"Symptomatic prolapse needing treatment is defined by the patient's symptoms and quality-of-life impact, not the stage alone. A Stage 2 prolapse causing severe urinary and sexual dysfunction needs treatment; an asymptomatic Stage 3 may be observed, with appropriate examination, safety-netting and review. The simplified GP staging uses the hymen as the reference point."},
    {tone:"blue", h:"Supervised PFMT for at least 16 weeks", html:"NICE NG123: refer for supervised pelvic health physiotherapy for symptomatic POP-Q stage 1–2 prolapse for at least 16 weeks. The physiotherapist assesses contraction and relaxation, tailors the programme, addresses breathing and pressure management, and advises ongoing exercise if beneficial. A leaflet or app can support adherence but does not replace supervised assessment where she cannot contract correctly or symptoms are significant. Often available by NHS self-referral."},
    {tone:"green", h:"A pessary is a real alternative to surgery", html:"Consider a pessary for symptomatic prolapse; a ring pessary is a reasonable first option and is <b>not merely a bridge to surgery</b>. Success varies with prolapse stage, pessary type and follow-up, and fitting depends on local competency and service provision. Agree a follow-up and removal plan before fitting: <b>remove it at least every 6 months</b>. Consider low-dose vaginal oestrogen if there are symptoms or signs of genitourinary syndrome of menopause or vaginal atrophy, particularly with a pessary; it is not required routinely in every menopausal woman with prolapse."},
    {tone:"amber", h:"Mesh complications: refer through the regional pathway", html:"Suspected complications of previous pelvic mesh surgery — pain, exposure or extrusion, bleeding, recurrent UTI, urinary or bowel dysfunction, dyspareunia or fistula, at any interval, even years later — are referred to an appropriate specialist through the locally commissioned regional mesh-complication pathway or specialist centre (confirm the current Greater Manchester route). <b>Do not attempt mesh removal in primary care.</b> Report via Yellow Card, and issue a prescription-charge exemption letter."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step is the one that stops a cancer being called a prolapse.",
  pathway:[
    {title:"Exclude cancer and acute complications", html:"Suspicious vaginal mass, or unexplained PMB not attributable to HRT → suspected cancer pathway referral. Acute retention → same-day assessment and bladder decompression. Severe pain or suspected strangulated or irreducible prolapse, suspected upper-tract obstruction, heavy or unexplained bleeding with haemodynamic concern, or infected or severely ulcerated procidentia → same-day assessment.", alert:true},
    {title:"Stage by compartment", html:"<b>With consent, speculum plus bimanual; ask her to cough or strain.</b> Anterior (cystocele) · posterior (rectocele or enterocele) · apical (uterine or vaginal vault). Document the leading edge against the hymen, whether it reduces, the cervix, vaginal tissue, ulceration or bleeding, and any pelvic mass; treat atrophy or ulceration before fitting a pessary."},
    {title:"Assess function and the traps", html:"Bladder and bowel symptoms, QoL impact (ICIQ-VS or PFDI-20), post-void residual if there is voiding difficulty or recurrent UTI, and — before any surgical referral — consider a cough stress test with the prolapse reduced, where appropriate, to look for occult stress incontinence."},
    {title:"Conservative care first", html:"Supervised PFMT for at least 16 weeks (NG123), a pessary, and vaginal oestrogen if there are genitourinary symptoms or signs — with lifestyle measures that reduce intra-abdominal load. <b>Reserve surgery for failed conservative care or patient choice.</b>"},
    {title:"Review and safety-net", html:"Pessary removed at least every 6 months, with review interval set by pessary type, self-management, tissue condition and local protocol, and inspection for erosion; PFMT review at 16 weeks. Same-day for retention, an irremovable pessary, or new bleeding or offensive discharge."}
  ],
  sections:[

    {id:"severe", nav:"Exclude first", title:"Red flags — malignancy, obstruction and acute complications",
     sub:"Every vaginal bulge is examined. The job of this step is to find the ones that are not prolapse, or not only prolapse.",
     blocks:[
       {b:"table", head:["Presentation","Suggests","Action"], rows:[
         ["Vaginal mass + irregular surface + bleeding + friable tissue + age &gt;60 + does not reduce","<b>Vaginal or cervical malignancy masquerading as prolapse</b>","Gynaecology suspected cancer pathway referral; specialist assessment and biopsy. Safety precaution: do not attempt manual reduction"],
         ["Procidentia + urinary retention + hydronephrosis + bilateral flank pain","Complete prolapse with urethral or ureteric kinking causing urinary tract obstruction","Same-day specialist assessment (urology or gynaecology). Bladder decompression if in retention. Renal tract imaging guided by the acute assessment and local pathway"],
         ["<b>Prolapse + acute urinary retention</b> (unable to void, suprapubic pain, distended bladder)","<b>Cystocele with severe anterior wall descent kinking the urethra</b>","Same-day assessment, bladder decompression and urgent gynaecology or urology advice. Reduction only by a clinician trained in it"],
         ["Prolapse + ulceration + bleeding of the prolapsed tissue + chronic exposed mucosa","<b>Decubitus ulcer of the prolapsed vaginal wall</b>, from chronic mucosal trauma against clothing","Urgent gynaecology. Oestrogen cream to the ulcer bed plus a ring pessary to reduce the prolapse. Delay definitive surgery until the ulcer has healed. Persistent, atypical, indurated or irregular ulceration → suspected cancer pathway"],
         ["<b>Post-menopausal bleeding + prolapse + endometrial thickening on USS</b>","<b>Endometrial carcinoma presenting alongside prolapse</b> — the bleeding may be wrongly attributed to a decubitus ulcer","<b>Gynaecology suspected cancer pathway referral. Endometrial biopsy plus transvaginal USS</b>"],
         ["Chronic pelvic pain + dyspareunia + palpable mesh erosion through the vaginal wall","<b>Vaginal mesh erosion or extrusion — a notifiable complication</b>","Refer through the locally commissioned regional mesh-complication pathway or specialist centre. Do NOT attempt mesh removal in primary care"]
       ]},
       {b:"why", html:"NICE NG123 recommends referring suspected mesh-related complications to an appropriate specialist (urogynaecology, urology or colorectal surgery), with regional specialist assessment where required. Following the Independent Medicines and Medical Devices Safety (IMMDS) Review — the Cumberlege Report, 2020 — NHS England has designated specialist mesh complication centres, multidisciplinary teams with expertise in mesh removal, urological reconstruction and chronic pain management. The GP's job is fourfold: (1) recognise mesh complications — dyspareunia, pelvic pain, vaginal discharge, palpable mesh, recurrent UTI, urinary symptoms — occurring at any time after insertion, even years later; (2) refer through the locally commissioned regional mesh-complication pathway, confirming the current Greater Manchester route; (3) report to MHRA via Yellow Card if not already reported; (4) issue a medical exemption letter for prescription charges, for which patients with mesh complications qualify. Attempting to manage or reassure about mesh complications in primary care without specialist referral is inappropriate."},
       {b:"dl", rows:[
         ["<b>NG12 — the criteria that apply here</b>","<b>Three NICE NG12 (updated April 2026) routes are directly relevant.</b> Vaginal cancer: consider a suspected cancer pathway referral for a woman with an unexplained palpable mass in or at the entrance to the vagina — which is exactly what an irregular, friable or fixed \u201cprolapse\u201d may turn out to be. Endometrial cancer: refer women aged 55 and over with unexplained post-menopausal bleeding that cannot be attributed to HRT on a suspected cancer pathway, and consider a suspected cancer pathway referral under 55. Ovarian cancer: ascites, or a pelvic or abdominal mass that is not obviously uterine fibroids found on examination → suspected cancer pathway referral; persistent pelvic or abdominal pain, bloating, early satiety, or urinary urgency or frequency aged 40 or over → CA125, with urgent direct-access ultrasound at or above the age threshold (35 IU/mL at 40–49, 31 at 50–59, 24 at 60–69, 25 at 70–79, 31 at 80 or over); aged 39 or under, do not use CA125 alone — consider ultrasound. The trap this page exists to prevent is attributing PMB to a prolapse decubitus ulcer and never investigating it. Restated in <a href='#refer'>Refer</a>"]
       ]}
     ]},

    {id:"confirm", nav:"Stage it", title:"Classification — POP-Q, compartments and consequences",
     blocks:[
       {b:"dl", rows:[
         ["<b>POP-Q staging</b>","Stage 0 — no prolapse. Stage 1 — leading edge more than 1 cm above the hymen. Stage 2 — leading edge between 1 cm above and 1 cm below the hymen. Stage 3 — leading edge more than 1 cm beyond the hymen, but less than total vaginal length minus 2 cm. Stage 4 — complete or near-complete vaginal eversion. Procidentia generally corresponds to advanced uterine prolapse, often stage 4, but the terms are not interchangeable. Formal POP-Q is documented during specialist assessment (NICE NG123); in primary care, record compartment, leading edge against the hymen, whether it reduces, ulceration or bleeding, and symptoms"],
         ["<b>Cystocele (anterior wall)</b>","Bladder descends into the anterior vaginal wall — the most common form. Dragging sensation, difficulty voiding, incomplete emptying, stress urinary incontinence"],
         ["<b>Rectocele (posterior wall)</b>","Rectum herniates into the posterior vaginal wall. Difficulty defecating with splinting and digitation — the patient inserts a finger into the vagina to support the posterior wall to facilitate defecation"],
         ["<b>Uterine and vaginal vault prolapse, enterocele</b>","Uterine: descent of the uterus through the vaginal canal — Grades I–III, or POP-Q Stage 1-4. Vault: descent of the vaginal vault after hysterectomy. Enterocele: small bowel herniation into the upper posterior vaginal wall, often post-hysterectomy"],
         ["<b>Functional consequences</b>","Urinary: stress incontinence, urge incontinence and urinary urgency, voiding difficulty, incomplete emptying, recurrent UTI. Bowel: obstructive defecation, splinting, incomplete emptying. Sexual: dyspareunia, reduced sensation, avoidance. Psychological: shame, reduced quality of life, social withdrawal"],
         ["<b>Differential for a vaginal lump</b>","Cystocele · rectocele · the uterine cervix (firm, central) · vaginal cysts — Gartner duct cyst (lateral wall, benign), Bartholin cyst, inclusion cyst (post-repair) · urethral diverticulum (suburethral mass, dysuria, post-void dribbling, dyspareunia) · vaginal malignancy (irregular, friable, bleeds on contact — suspected cancer pathway referral without delay)"]
       ]},
       {b:"why", html:"The POP-Q system replaced the older Baden-Walker grading as the international standard — it uses six fixed anatomical reference points (Aa, Ba, Ap, Bp, C, D) measured in centimetres relative to the hymenal ring (negative above, positive below), allowing objective comparison across examinations, operators and trials. For GPs the simplified staging using the hymen is sufficient: Stage 1 (above) → reassure plus lifestyle, with PFMT if symptomatic; Stage 2 (at the level) → pelvic floor physiotherapy plus pessary discussion; Stage 3–4 (beyond) → referral if symptoms are significant, while asymptomatic advanced prolapse may be observed with examination, safety-netting and review. The governing principle is not the number: symptomatic prolapse requiring treatment is defined by the patient's symptoms and quality-of-life impact, not the stage alone."}
     ]},

    {id:"workup", nav:"Assess", title:"History, examination and investigations",
     sub:"Two things here change management: the masked stress incontinence check, and the connective tissue question in a young woman.",
     blocks:[
       {b:"table", head:["Domain","Detail"], rows:[
         ["<b>History</b>","Bulge or lump felt or seen — the most specific symptom (\u201csomething coming down\u201d); pelvic pressure or dragging, worse at the end of the day or after prolonged standing. Urinary: urgency, frequency, stress incontinence, incomplete emptying, recurrent UTI. Bowel: straining, incomplete emptying, splinting (suggests rectocele), faecal incontinence. Effect on exercise, work and sleep. Menopause/GSM symptoms. Previous mesh surgery. Use a validated pelvic floor symptom questionnaire where available. Sexual: dyspareunia, awareness of a lump during intercourse. Obstetric: parity, instrumental delivery, large babies, prolonged second stage, perineal lacerations. Menopause status. BMI and chronic straining. Previous prolapse surgery. Family history of connective tissue disorders"],
         ["<b>Examination</b>","With consent: supine (Sims' speculum) and/or lithotomy, with bimanual examination. Ask her to cough or strain (Valsalva) to demonstrate it. Identify anterior wall descent, posterior wall descent (anterior blade retracted), uterine descent, or vault if post-hysterectomy. Pelvic floor muscle assessment on digital examination — squeeze strength on the 0–5 Oxford scale"],
         ["<b>The masked SUI check</b>","Before surgical referral, ask about urinary leakage and consider a cough stress test with the prolapse reduced, where clinically appropriate — leakage suggests masked (occult) stress urinary incontinence. Document the result"],
         ["<b>Investigations</b>","Investigate selectively: urine dipstick if urinary symptoms · MSU if infection is suspected or recurrent · bladder diary if urgency, frequency or incontinence is prominent · post-void residual (bladder scan or catheter) if voiding dysfunction, incomplete emptying or recurrent UTI — interpret clinically; a persistently high or symptomatic residual needs assessment and usually referral · pregnancy test where relevant · cervical screening up to date · pelvic ultrasound only for a separate indication (PMB, pelvic pain, suspected pelvic mass) — do not routinely image prolapse that is demonstrated clinically (NICE NG123) · no routine urodynamics in primary care"],
         ["<b>Risk factors</b>","Vaginal birth, particularly instrumental delivery. Oestrogen deficiency. Obesity (BMI &gt;30). Connective tissue disorders — Marfan, Ehlers-Danlos, joint hypermobility. Chronic straining — constipation, chronic cough (COPD), heavy manual labour. Prior pelvic surgery — hysterectomy raises vault prolapse risk, and prolapse can recur after previous surgery. Ethnicity: lower risk in Black and South Asian women"],
         ["<b>Quality of life</b>","ICIQ-VS and PFDI-20 are validated PROMs — administer at first consultation and after treatment. Ask proactively about sexual function. Treatment decisions are guided by QoL impact, not anatomical stage alone"]
       ]},
       {b:"warn", html:"Masked stress incontinence is the pre-operative check that prevents an avoidable surgical complication. In significant anterior wall prolapse the prolapsing bladder and urethra kink or compress the urethra, preventing or reducing stress incontinence. When the prolapse is repaired and the urethra straightened, pre-existing sphincter weakness is unmasked — a woman with no stress incontinence before surgery develops it afterwards (\u201cde novo stress incontinence\u201d, or unmasked SUI). Before surgical referral, ask about leakage and consider a cough stress test with the prolapse reduced, where clinically appropriate, and document the result. Specialist assessment will determine whether further urodynamics or concurrent continence surgery is appropriate; not every woman with occult SUI needs a sling."},
       {b:"why", html:"The connective tissue disorder screen in young women with POP is underperformed. Symptomatic prolapse in a nulliparous woman, or in a woman under 40 with minimal obstetric history, should raise the possibility of an underlying connective tissue disorder. The <b>Beighton score</b> — a 9-point hypermobility scale (passive dorsiflexion of the 5th MCP joint &gt;90°, thumb apposition to the forearm, elbow and knee hyperextension &gt;10°, and palms flat on the floor with straight knees) — identifies joint hypermobility, and a score ≥5/9 suggests hypermobile Ehlers-Danlos syndrome (hEDS) or hypermobility spectrum disorder. Women with hEDS and POP benefit from connective tissue-aware physiotherapy, have a higher risk of surgical failure, and should be referred to specialist urogynaecology centres experienced in connective tissue disorders for surgical planning."}
     ]},

    {id:"ladder", nav:"Treat", title:"Conservative management first, then surgery",
     sub:"NICE NG123: offer supervised PFMT and consider a pessary (with vaginal oestrogen if there are genitourinary symptoms or signs) before surgery; offer surgery if symptoms have not improved with, or she has declined, non-surgical treatment.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Step 1", title:"Supervised pelvic floor muscle training", when:"symptomatic stage 1–2 (NG123)",
          html:"Refer for supervised pelvic health physiotherapy for symptomatic stage 1–2 POP for <b>at least 16 weeks</b> (NICE NG123). The physiotherapist assesses contraction and relaxation, tailors the programme, addresses breathing and pressure management, and advises ongoing exercise if beneficial. A leaflet or app supports adherence but does not replace supervised assessment. Continue PFMT if it helps."},
         {step:"Step 2", title:"Pessary (vaginal oestrogen if GSM)", when:"consider for symptomatic prolapse",
          fromLabel:"alternative to surgery, or a bridge while waiting",
          html:"Ring pessary (first-line type): flexible silicone ring sitting in the posterior fornix and over the pubic symphysis. Sizes 50–100 mm in 5 mm increments. Fitting: insert in Sims' or lithotomy position; confirm she can micturate comfortably, has no pain, and the ring is not palpable or visible at the introitus. <b>Remove at least every 6 months</b> (NICE NG123); offer women who cannot self-manage (physical or cognitive impairment) planned review, generally at least every 6 months, per the local pessary-service protocol. Other types: Gellhorn (central stem) and shelf pessaries for higher stage, cube pessary for severe prolapse, ring-with-support for cystocele. Before fitting, explain that more than one fitting may be needed, the effect on intercourse, possible discharge, bleeding, discomfort, expulsion and difficulty removing it, and assess whether she can self-manage. Seek specialist pessary care if fitting or follow-up is not available locally. Consider vaginal oestrogen only for GSM or atrophy symptoms or signs, after checking contraindications; product and regimen per current SmPC and local formulary. After breast cancer, use non-hormonal moisturisers or lubricants first and consider vaginal oestrogen only after individualised discussion, with breast oncology input particularly for women taking an aromatase inhibitor."},
         {step:"Step 3", title:"Lifestyle — reduce intra-abdominal load", when:"alongside, not afterwards",
          fromLabel:"modifiable drivers",
          html:"Weight management where BMI is over 30, treat chronic constipation and avoid straining, treat chronic cough, minimise heavy lifting if it aggravates symptoms, stop smoking, keep physically active, and manage coexisting urinary symptoms. Topical oestrogen for atrophy also improves tissue tolerance of a pessary."},
         {step:"Step 4", title:"Surgery — native tissue repair", when:"failed conservative care, or patient choice",
          fromLabel:"16 weeks PFMT plus pessary trial",
          html:"Offer specialist discussion of surgical options when symptoms remain troublesome despite, or she declines, conservative management. Explain that surgery may improve bulge symptoms but recurrence and urinary, bowel and sexual complications are possible. Options include anterior colporrhaphy (cystocele) and posterior colporrhaphy (rectocele). Sacrospinous ligament fixation (SSLF) or uterosacral ligament suspension for vault or uterine prolapse. Manchester repair for cervical or uterine prolapse, preserving the uterus. NICE NG123: offer uterus-preserving surgery as an option if the patient prefers — sacrospinous hysteropexy or laparoscopic pectopexy."},
         {step:"Step 5", title:"Sacrocolpopexy using mesh — selected vault prolapse", when:"specialist teams only",
          fromLabel:"specialist decision",
          html:"For selected women with vaginal vault prolapse, specialist teams may consider open or laparoscopic sacrocolpopexy using mesh (mesh from the vaginal vault to the sacrum). NICE HTG444 (formerly IPG583, 2017) applies specifically to vault prolapse: standard arrangements for clinical governance, consent and audit, performed by clinicians specialising in POP and urinary incontinence. It is not a first-line primary-care treatment and is not suitable for all apical or uterine prolapse. It needs specialist assessment and detailed consent covering mesh erosion, recurrence, and urinary, bowel and sexual complications. Sacrocolpopexy with hysterectomy for uterine prolapse is a separate procedure (NICE HTG435) with its own governance requirements."}
       ]},
       {b:"warn", html:"Sacrocolpopexy with mesh is different from the paused transvaginal mesh, but abdominal mesh is not risk-free or exempt from mesh concerns — this is a critical point of patient communication. The MHRA's 2018 pause applies specifically to transvaginal mesh placement for POP (anterior and posterior mesh kits placed through the vagina). Sacrocolpopexy places mesh via a laparoscopic intraperitoneal route, on the outside of the vaginal wall rather than through the vaginal mucosa — which is the main reason for the different complication profile. Sacrocolpopexy is still performed: NICE HTG444 (formerly IPG583, 2017) allows it with standard arrangements, whereas transvaginal mesh repair of anterior or posterior wall prolapse is research-only (NICE HTG456, formerly IPG599, 2017) — but serious recognised complications, including mesh erosion, still apply, and NICE recommends registry and audit arrangements."},
       {b:"why", html:"The pelvic health physiotherapist is the key referral in conservative POP management: NICE NG123 recommends supervised PFMT for at least 16 weeks for symptomatic stage 1–2 prolapse, and a Cochrane review (Hagen et al., 2011) supports PFMT for prolapse symptoms. In many areas this is available as NHS self-referral. Pessaries are not just a temporary bridge — many women use them as long-term preferred management. Advantages over surgery: no operative risk and reversible. Who fits and follows up pessaries depends on local competency and service provision; seek specialist pessary care if it is not available locally."}
     ]},

    {id:"lifestyle", nav:"Pelvic floor health", title:"Prevention, self-management and patient education",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"🏋️ Lifelong pelvic floor exercises", html:"<b>The physiotherapist tailors the programme; continue it if it helps.</b> Correctly performed: contract the pubococcygeus as if stopping midstream urine and passing wind simultaneously, hold 10 seconds, relax fully. Common error: holding the breath and contracting the abdominals instead — counterproductive, because it raises intra-abdominal pressure. <b>Squeezy NHS app</b> (free, designed by NHS physiotherapists) for reminders and programmes."},
         {tone:"blue", h:"💪 \u201cThe knack\u201d — teachable in 60 seconds", html:"Deliberately contract the pelvic floor 1–2 seconds before and throughout a cough, sneeze, lift or jump. Miller et al. (1998) showed the knack reduced leakage during medium-intensity coughing by 73% and maximum-intensity coughing by 98%. Teach it in the room: ask her to cough; if she leaks, say <em>\u201cnow squeeze your pelvic floor first, then cough\u201d</em> — most notice an immediate difference."},
         {tone:"amber", h:"🚽 Constipation and toilet posture", html:"<b>Straining is a direct cause of progressive pelvic floor damage</b> — repetitive Valsalva stretches the pudendal nerve and traumatises levator ani. 30 g dietary fibre plus 1.5–2 L water a day, macrogol if needed. Footstool to raise the knees (the squatting angle reduces puborectalis angulation). Never strain: if nothing after 5 minutes, stop, walk around, try later."},
         {tone:"green", h:"⚖️ Weight management", html:"BMI &gt;30 raises intra-abdominal pressure, and weight management is part of conservative care. Refer via the NHS weight management pathway — Tier 2 group programme, or Tier 3 specialist service. NICE NG123 advises weight loss for women with prolapse and a BMI over 30; before any prolapse surgery aim for a BMI below 30 where possible, since obesity increases wound infection and VTE risk and reduces surgical success."},
         {tone:"green", h:"🫁 Chronic cough", html:"Chronic cough repeatedly raises intra-abdominal pressure. Optimise the cause — COPD inhaler review, intranasal corticosteroid for rhinitis, <b>switch an ACE inhibitor to an ARB</b> — and teach the knack."},
         {tone:"cream", h:"🏃 Return to exercise", html:"Timing of a return to impact exercise after birth or prolapse surgery is individualised by the physiotherapist or surgical team. <b>Low-impact activity is encouraged</b> — swimming, stationary cycling, yoga, walking. If heavy lifting aggravates symptoms, minimise it and avoid breath-holding while lifting."},
         {tone:"blue", h:"🔄 Pessary self-management", html:"Some women prefer to insert and remove their own ring — independence, fewer GP visits, and spontaneous sexual activity (remove before intercourse). Training by a women's health physiotherapist or specialist nurse. Technique: fold the ring in half, insert posteriorly like a tampon, rotate so it sits in the posterior fornix behind the pubic symphysis; remove by hooking a finger inside and pulling gently. Remove and clean as agreed with the clinician, and at least every 6 months."},
         {tone:"cream", h:"💬 Sexual health — you raise it", html:"<b>Ask proactively about dyspareunia, vaginal dryness, sexual activity and the effect of prolapse or a pessary on intercourse.</b> Open it yourself: <em>\u201cSome women with prolapse notice changes in their sex life — is that something that's affecting you?\u201d</em> Vaginal oestrogen may help dyspareunia where there is GSM; include sexual function in shared decision-making and surgical consent. <b>Do not recommend abstinence as management — it prolongs the impact.</b>"}
       ]},
       {b:"dl", rows:[
         ["<b>Post-natal pelvic floor care</b>","PFMT starts as soon as comfortable after vaginal delivery, even day 1. Third- and fourth-degree perineal tears (involving the anal sphincter) get a post-natal physiotherapy referral. Prolapse symptoms in the first year post-natal → women's health physiotherapy. Symptoms may change as the pelvic floor recovers after birth, so reassess staging later in the postnatal period. High obstetric risk (third- or fourth-degree tear, forceps, large baby): pelvic floor assessment at the 6-week check regardless of symptoms"]
       ]}
     ]},

    {id:"monitor", nav:"Follow-up", title:"Pessary reviews, physiotherapy outcomes and post-operative care",
     blocks:[
       {b:"table", head:["What","Detail"], rows:[
         ["<b>Pessary review — removal at least every 6 months</b>","Interval set by pessary type, self-management, tissue condition, symptoms and the local pessary-service protocol. Remove, inspect the vaginal walls for erosion (a grey-white area of thinned mucosa) or ulceration, clean the ring with warm water and soap, reinsert or resize. Apply topical oestrogen at review if the mucosa is atrophic. If there is discharge or odour: take an HVS, exclude bacterial vaginosis, and check the ring is not too small. Document pessary type and size, whether she can remove and replace it, the planned removal/review date, vaginal inspection findings, and the advice given about discharge, bleeding, pain, urinary symptoms, expulsion, difficulty removing it and what to do if it cannot be removed"],
         ["<b>Physiotherapy outcome — 16 weeks</b>","Has PFMT improved symptoms? Compare ICIQ-VS before and after. Improvement → continue the exercise programme if it is helping. Minimal improvement at 16 weeks → gynaecology referral for pessary or surgery discussion"],
         ["<b>Post-surgery — 6 weeks</b>","GP wound check, urine culture if there are LUTS, and confirm the physiotherapy referral for post-operative pelvic floor rehabilitation"],
         ["<b>Post-surgery — 3 and 12 months</b>","At 3 months: sexual function, continence status, recurrence check. At 12 months: specialist urogynaecology review. Recurrence of bulge symptoms → re-examine and refer back"],
         ["<b>Pessary safety-netting</b>","Contact the GP or A&amp;E for inability to remove the pessary, severe pelvic pain, urinary retention or unusual bleeding. Do not attempt to remove an impacted or retained pessary without examination — refer to gynaecology if it cannot be removed at a routine appointment"]
       ]},
       {b:"why", html:"Pelvic floor muscle training around prolapse surgery has not been shown to improve outcomes. In randomised trials, perioperative supervised PFMT improved the ability to contract the pelvic floor but made no significant difference to prolapse symptoms, quality of life or recurrence (<b>McClurg, Hilton, Frawley et al., 2014</b>, feasibility RCT; <b>Nyhus et al., 2020</b>). NICE NG123 makes no recommendation for routine post-operative PFMT; it recommends PFMT as a treatment option for symptomatic prolapse, advises continuing an exercise programme if PFMT is helping, and recommends a review 6 months after prolapse surgery that includes a vaginal examination, with access to further referral for recurrent symptoms or suspected complications. The GP's part: follow the surgical team's post-operative advice, check that the 6-month review happens, encourage women who were already benefiting from PFMT to keep going, and refer back promptly if symptoms recur."},
       {b:"cards", items:[
         {tone:"red", h:"🔴 Same-day", html:"Inability to pass urine (retention) · severe pain or suspected strangulated or irreducible prolapse · suspected upper-tract obstruction · heavy bleeding with haemodynamic concern · infected or severely ulcerated procidentia · a pessary that cannot be removed · new bleeding or offensive discharge."},
         {tone:"purple", h:"🟣 Suspected cancer", html:"A suspicious vaginal mass, or unexplained post-menopausal bleeding not attributable to HRT (NICE NG12 (updated April 2026)), developing at any point."},
         {tone:"amber", h:"🟠 Back to gynaecology", html:"<b>Symptoms progressing despite conservative care → urogynaecology.</b>"},
         {tone:"green", h:"📱 Support", html:"Squeezy NHS app for exercise reminders; women's health physiotherapy self-referral where available locally."}
       ]},
       {b:"say", html:"What you can feel is a prolapse — the wall of the vagina has lost some of its support, so the bladder or bowel presses into it. It is very common and most prolapse is not dangerous. I have examined it properly, which matters, because occasionally a lump turns out to be something else that needs checking urgently — yours does not. The most important thing is that we do not jump to surgery. Supervised pelvic floor physiotherapy helps many women, and a small silicone ring called a pessary can be fitted if you would like one — plenty of women use one for years and never need an operation. If you have vaginal dryness or soreness, a small amount of vaginal oestrogen may make the tissue more comfortable. What decides the treatment is how much it is bothering you, not the grade I write in the notes."}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways",
     blocks:[
       {b:"cards", items:[
         {tone:"purple", h:"Gynaecology suspected cancer referral · NICE NG12 (updated April 2026)", html:"<b>An unexplained vaginal mass, or an irregular, fixed, friable or atypical vaginal lesion, or a cervical lesion suspicious of malignancy</b> (NG12: consider for an unexplained palpable mass in or at the entrance to the vagina) · unexplained post-menopausal bleeding that cannot be attributed to HRT — refer on a suspected cancer pathway at 55 and over, and consider one under 55 · ascites, or a pelvic or abdominal mass that is not obviously uterine fibroids → suspected cancer pathway (ovarian); persistent pelvic or abdominal pain, bloating, early satiety, or urinary urgency or frequency aged 40 or over → CA125, with urgent direct-access ultrasound at or above the age threshold (35 IU/mL at 40–49, 31 at 50–59, 24 at 60–69, 25 at 70–79, 31 at 80 or over); aged 39 or under, do not use CA125 alone — consider ultrasound · cannot clinically distinguish from malignancy. Source: NICE NG12 (updated April 2026)."},
         {tone:"red", h:"Same-day urology / gynaecology", html:"Urinary retention from prolapse (acute obstruction) · suspected upper-tract obstruction · severe pain or suspected strangulated or irreducible prolapse · heavy or unexplained bleeding with haemodynamic concern · infected or severely ulcerated procidentia."},
         {tone:"amber", h:"Suspected mesh complication", html:"Pain, exposure or extrusion, bleeding, recurrent UTI, urinary or bowel dysfunction, dyspareunia or fistula after previous pelvic mesh surgery: do not attempt mesh removal in primary care. Refer through the locally commissioned regional mesh-complication pathway or specialist centre (urogynaecology, urology or colorectal as appropriate; NICE NG123). Confirm the current Greater Manchester referral route and keep its link in the practice pathway."},
         {tone:"blue", h:"Gynaecology (routine)", html:"Symptoms troublesome despite conservative treatment · declines conservative management and wants to discuss surgery · stage 3–4 prolapse with significant symptoms · apical or vault prolapse · persistent voiding dysfunction, recurrent UTI or obstructed defaecation · uncertain diagnosis · pessary care not safely available in primary care · recurrent prolapse. Include examination findings and compartment, symptoms and validated score if available, urinary and bowel history, past medical, obstetric and surgical history, previous mesh surgery, urine results, PVR if measured, the reduced-prolapse cough stress test result if performed, and her treatment preference."},
         {tone:"green", h:"Women's health physiotherapy", html:"Symptomatic POP stage 1–2 for supervised PFMT for at least 16 weeks (NICE NG123), and other stages where it helps symptoms — often available as NHS self-referral. Also post-operative rehabilitation, and post-natal referral after third- or fourth-degree tears."},
         {tone:"cream", h:"GP management", html:"Stage 1–2 with mild symptoms: supervised PFMT and lifestyle measures; a pessary considered for symptomatic women, as an alternative to surgery or a bridge while awaiting it, where fitting is available locally; vaginal oestrogen only if there are genitourinary symptoms or signs. Asymptomatic prolapse: examination, safety-netting and review."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 61-year-old describes \u201csomething coming down\u201d for a year, worse by the evening, and has started splinting to open her bowels. She mentions in passing that she had \u201ca bit of spotting\u201d twice last month, which she has assumed is from the prolapse rubbing. She had a forceps delivery and two vaginal births, and asks whether she will \u201cjust have to have it all taken away\u201d."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Does not attribute the post-menopausal bleeding to the prolapse — recognises PMB at 61 as an endometrial suspected cancer pathway referral in its own right and refers while managing the prolapse; <b>examines and stages by compartment rather than accepting the label</b>; identifies the <b>rectocele from splinting</b>; <b>checks for masked stress incontinence before any surgical discussion</b>; offers supervised PFMT and a pessary, with vaginal oestrogen if there are genitourinary symptoms, and corrects the assumption that surgery is inevitable; and — the step candidates miss — raises the sexual-function conversation herself rather than waiting to be asked."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>NICE NG123 — Urinary incontinence and pelvic organ prolapse in women: management (2019)<br><a href="https://www.nice.org.uk/guidance/ng123" rel="noopener">nice.org.uk/guidance/ng123</a><span class="rd"> — supervised PFMT for at least 16 weeks as a first option for symptomatic stage 1–2, pessary use, uterus-preserving surgery as an option, and a review 6 months after prolapse surgery including a vaginal examination (NG123 makes no recommendation for routine post-operative PFMT); pessary removal at least every 6 months; vaginal oestrogen considered for genitourinary symptoms; PVR only for voiding symptoms or recurrent UTI; no routine imaging; mesh complications referred to an appropriate specialist. <b>This is the primary UK guideline for POP.</b> Some secondary sources additionally cite an \u201cRCOG Green-top Guideline for POP (2018)\u201d; the RCOG Green-top in this area is <b>No. 46, Post-Hysterectomy Vaginal Vault Prolapse</b>, which covers vault prolapse specifically rather than POP as a whole — check the current RCOG listing before citing it</span></li>'+
         '<li>NICE HTG444 (formerly IPG583, 2017; IPG583 replaced IPG283) — Sacrocolpopexy using mesh to repair vaginal vault prolapse<br><a href="https://www.nice.org.uk/guidance/htg444" rel="noopener">nice.org.uk/guidance/htg444</a><span class="rd"> — vault prolapse only; standard arrangements for governance, consent and audit; specialist clinicians; serious complications include mesh erosion</span></li>'+
         '<li>NICE HTG435 — Sacrocolpopexy with hysterectomy using mesh to repair uterine prolapse<br><a href="https://www.nice.org.uk/guidance/htg435" rel="noopener">nice.org.uk/guidance/htg435</a><span class="rd"> — a separate procedure with different governance requirements</span></li>'+
         '<li>NICE NG210 — Pelvic floor dysfunction: prevention and non-surgical management (2021)<br><a href="https://www.nice.org.uk/guidance/ng210" rel="noopener">nice.org.uk/guidance/ng210</a><span class="rd"> — prevention, lifestyle and non-surgical management</span></li>'+
         '<li>NICE NG23 — Menopause: identification and management (evidence review B2, genitourinary symptoms after breast cancer)<br><a href="https://www.nice.org.uk/guidance/ng23" rel="noopener">nice.org.uk/guidance/ng23</a> · British Menopause Society consensus statement on genitourinary syndrome of menopause (November 2025)<br><a href="https://thebms.org.uk/" rel="noopener">thebms.org.uk</a><span class="rd"> — vaginal oestrogen for GSM; non-hormonal options first after breast cancer</span></li>'+
         '<li>Local Greater Manchester (GMMMG) pessary, gynaecology, suspected-cancer and mesh-complication pathways<br><a href="https://gmmmg.nhs.uk/" rel="noopener">gmmmg.nhs.uk</a><span class="rd"> — confirm the current local referral routes</span></li>'+
         '<li><b>MHRA — surgical mesh guidance and the 2018 pause on transvaginal mesh</b><span class="rd"> — the pause applies to transvaginal mesh kits, not to laparoscopic sacrocolpopexy; Yellow Card reporting for mesh complications</span></li>'+
         '<li>Independent Medicines and Medical Devices Safety Review (Cumberlege Report, 2020) and NHS England Mesh Specialist Centres<span class="rd"> — regional specialist mesh complication centres, reached through the locally commissioned referral pathway, and prescription-charge exemption for affected patients</span></li>'+
         '<li>Hagen S et al. Pelvic floor muscle training for pelvic organ prolapse. <em>Cochrane Database Syst Rev</em> 2011<span class="rd"> — PFMT improves prolapse symptoms</span></li>'+
         '<li><b>McClurg D, Hilton P, Dolan L, Monga A, Hagen S, Frawley H, Dickinson L. Pelvic floor muscle training as an adjunct to prolapse surgery: a randomised feasibility study. <em>Int Urogynecol J</em> 2014</b><span class="rd"> — one pre- and six post-operative PFMT sessions: no significant between-group difference in prolapse symptoms or quality of life at 12 months</span></li>'+
         '<li><b>Nyhus MØ et al. Effect of preoperative pelvic floor muscle training on pelvic floor muscle contraction and symptomatic and anatomical pelvic organ prolapse after surgery: randomized controlled trial. <em>Ultrasound Obstet Gynecol</em> 2020</b><span class="rd"> — no improvement in prolapse outcomes after surgery</span></li>'+
         '<li><b>Miller JM et al. <em>Am J Obstet Gynecol</em> 1998 — the knack manoeuvre</b><span class="rd"> — 73% reduction in leakage during medium-intensity coughing and 98% at maximum intensity</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — vaginal cancer: an unexplained palpable mass in or at the entrance to the vagina; endometrial cancer (amended April 2026): unexplained post-menopausal bleeding that cannot be attributed to HRT, refer at 55 and over and consider under 55; ovarian cancer (amended April 2026): pelvic or abdominal mass or ascites, and age-specific CA125 thresholds for urgent direct-access ultrasound from age 40</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — vaginal oestrogen and macrogol prescribing; check the current SmPC and local formulary</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Pelvic organ prolapse — NICE NG123 (2019), NICE HTG444 (formerly IPG583, 2017), NICE NG12 (updated April 2026), MHRA surgical mesh guidance, the IMMDS (Cumberlege) Review 2020 and NHS England Mesh Specialist Centres, the Cochrane PFMT review (Hagen 2011) and the BNF. Examine every vaginal bulge: an irregular, friable or fixed mass, or unexplained post-menopausal bleeding not attributable to HRT, follows the suspected cancer pathway. Offer supervised PFMT and consider a pessary before surgery, with vaginal oestrogen only for genitourinary symptoms or signs. Coexisting urinary incontinence is covered by the <a href=\"female-urinary-incontinence.html\">female urinary incontinence protocol</a>. Verify all doses against the current BNF before prescribing."
