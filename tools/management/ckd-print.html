  quickSub:"If you read nothing else on this page, read these six cards. Every number traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"\u26a0 Don't miss albuminuria", html:"<b>A normal eGFR with ACR \u226530 mg/mmol still signals significant CKD</b> and a higher cardiovascular and progression risk. <b>Risk = eGFR (G) \u00d7 ACR (A)</b> \u2014 always quantify ACR and stage on both axes. Risk rises diagonally across the grid, and a <b>G2A3</b> patient needs more intensive management than a stable <b>G3aA1</b> one."},
    {tone:"red", h:"Exclude AKI before you manage CKD", html:"Creatinine rise \u226526.5 \u00b5mol/L in 48 hours, or \u22651.5\u00d7 baseline within 7 days (KDIGO), is AKI \u2014 urgently assess volume, sepsis, obstruction and drugs; withhold metformin; review NSAIDs, and ACEi/ARB and diuretics individually. AKI on CKD is common and can cause lasting nephron loss. A step-change in creatinine is <b>AKI-on-CKD or an artefact until proven otherwise</b>."},
    {tone:"amber", h:"The 90-day rule", html:"CKD = abnormal kidney structure or function for &gt;3 months: eGFR &lt;60 on two occasions \u226590 days apart, or persistent damage markers (confirmed albuminuria, structural abnormality, hereditary disease). A single low eGFR is NOT CKD \u2014 repeat within 2 weeks if new (to exclude AKI), then establish chronicity. Mislabelling causes needless anxiety; missing it delays cardiovascular risk reduction."},
    {tone:"blue", h:"The expected eGFR dip is not a reason to stop", html:"On starting or up-titrating an ACEi or ARB, a creatinine rise up to 30%, or an eGFR fall up to 25%, is EXPECTED, haemodynamic, and acceptable \u2014 do not stop for it. Check U&amp;E before and <b>1\u20132 weeks</b> after each change. <b>Stopping for the expected dip deprives the patient of renoprotection</b> \u2014 in REIN, ramipril halved progression to end-stage disease in proteinuric CKD."},
    {tone:"cream", h:"Four drugs protect the kidney", html:"<b>ACEi/ARB where indicated by ACR, hypertension or diabetes</b>, titrated to maximum tolerated; <b>dapagliflozin 10 mg OD</b> per NICE TA1075 (DAPA-CKD); <b>atorvastatin 20 mg</b> for adults with CKD unless contraindicated or already on appropriate therapy; and <b>finerenone</b> in eligible T2D stage 3\u20134 CKD with persistent albuminuria (TA877). <b>Never combine an ACEi with an ARB</b> \u2014 ONTARGET showed harm without benefit."},
    {tone:"green", h:"Refer on risk, not on a single number", html:"The NG203 headline criterion is a 5-year risk of needing renal replacement &gt;5% on the 4-variable Kidney Failure Risk Equation (age, sex, eGFR, ACR). It also rationally <b>reassures the stable elderly G3a patient, whose risk is often <b>&lt;1%</b></b>. <b>Plot the trajectory, not the snapshot</b> \u2014 eGFR 38 stable for five years is a different disease from eGFR 38 that was 60 two years ago."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step is where patients come to harm.",
  pathway:[
    {title:"Exclude AKI and the emergencies first", html:"AKI (KDIGO) \u00b7 K\u207a \u22656.5 or ECG changes \u00b7 severe oliguria/anuria or retention \u00b7 uraemic encephalopathy or pericarditis \u00b7 hypertensive emergency (BP \u2265180/120 with acute end-organ features) \u00b7 pulmonary oedema \u2192 same-day emergency assessment. A stable new eGFR &lt;15 \u2192 urgent renal discussion.", alert:true},
    {title:"Confirm it is chronic", html:"Two readings <b>\u226590 days apart</b>. Early-morning urine ACR; <b>dip for blood, send for ACR</b> \u2014 reagent strips only for protein if they measure albumin and report ACR. Consider cystatin-C eGFR where muscle mass distorts the estimate."},
    {title:"Stage on the G\u00d7A grid and find the cause", html:"G1\u2013G5 \u00d7 A1\u2013A3 sets monitoring frequency, referral threshold and treatment intensity. Then look actively for a cause \u2014 obstruction, drugs, myeloma, PKD, vasculitis \u2014 not just \u201cdiabetes and hypertension\u201d."},
    {title:"Deploy the big four and dose-gate the rest", html:"BP to target with ACEi/ARB by ACR, then SGLT2 inhibitor, statin, and finerenone where indicated. Review every drug against its renal gate."},
    {title:"Monitor by risk cell and safety-net", html:"Recall per grid cell; U&amp;E 1\u20132 weeks after any RAAS change; <b>KFRE annually from G3</b>; sick-day rules in writing; and the structured annual review (QOF CKD006)."}
  ],
  sections:[

    {id:"severe", nav:"Exclude AKI", title:"Exclude AKI and the CKD emergencies", sub:"Before managing CKD, rule out AKI, accelerated decline, and complications needing emergency treatment.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"AKI by KDIGO criteria", html:"Creatinine rise \u226526.5 \u00b5mol/L in 48 hours, or to \u22651.5\u00d7 baseline within 7 days, or urine output &lt;0.5 mL/kg/h for 6 hours \u2192 <b>urgent assessment</b> of volume, sepsis, obstruction and drugs. Withhold metformin; review NSAIDs and nephrotoxins; ACEi/ARB and diuretics may need temporary withholding in hypovolaemia, hypotension, severe AKI or significant hyperkalaemia \u2014 individualise and document."},
         {tone:"red", h:"Oliguria or anuria", html:"Severe oliguria or anuria, urinary retention, hypotension, sepsis or deterioration \u2192 <b>same-day hospital assessment</b> (ambulance by severity; urine output is rarely measured reliably at home). Exclude <b>post-renal obstruction</b>."},
         {tone:"red", h:"Hyperkalaemia \u22656.0 mmol/L", html:"Risk of fatal arrhythmia \u2192 <b>same-day ECG and urgent management</b>. <b>K\u207a \u22656.5, or any ECG change \u2192 999.</b> The most immediately life-threatening CKD complication \u2014 requires treatment within minutes."},
         {tone:"red", h:"Uraemic symptoms", html:"Nausea, vomiting, confusion, encephalopathy, <b>pericarditis (pleuritic chest pain with a rub)</b> \u2192 <b>999</b> \u2014 approaching the dialysis threshold. <b>Uraemic pericarditis is a dialysis indication regardless of eGFR.</b>"},
         {tone:"red", h:"BP \u2265180/120 with end-organ damage", html:"Headache, visual disturbance, <b>papilloedema</b> \u2014 <b>\u2265180/120 mmHg</b> with acute end-organ features \u2192 <b>same-day emergency assessment</b>. Severe asymptomatic hypertension \u2192 repeat correctly, assess symptoms and arrange prompt review (not automatically 999)."},
         {tone:"red", h:"Pulmonary oedema / fluid overload", html:"Breathlessness, crackles, raised JVP, peripheral oedema \u2192 <b>999 if severe</b>; same-day if new and significant."},
         {tone:"red", h:"New eGFR &lt;15 (G5) at first presentation", html:"\u2192 <b>urgent renal discussion</b>; admission only for acute complications (severe hyperkalaemia, pulmonary oedema, uraemia, AKI)."},
         {tone:"amber", h:"Macroscopic (visible) haematuria", html:"Unexplained visible haematuria aged 45+ \u2192 suspected cancer pathway (below). <b>Emergency</b> only with clot retention, obstruction, haemodynamic compromise, severe pain or suspected AKI."},
         {tone:"purple", h:"Suspected cancer \u00b7 NICE NG12 \u2014 urological cancer", html:"Unexplained visible haematuria aged 45 and over \u2192 urgent suspected-cancer referral for bladder and renal cancer (USS and cystoscopy). Visible haematuria goes down the urology suspected cancer pathway first \u2014 before the CKD workup. Persistent non-visible haematuria with ACR \u226530 points instead to glomerular disease \u2192 nephrology; non-visible haematuria on 2 of 3 dipsticks \u2192 eGFR + ACR + urology referral. Also consider <b>myeloma</b> in a patient over 60 with anaemia and a raised calcium \u2014 serum electrophoresis and light chains."}
       ]},
       {b:"why", html:"AKI on CKD is common; missing it can cause lasting nephron loss. The AKI e-alert system is triggered by KDIGO criteria \u2014 GPs should know these thresholds. Hyperkalaemia is the most immediately life-threatening complication, K\u207a \u22656.5 mmol/L or ECG changes needs emergency hospital management."}
     ]},

    {id:"confirm", nav:"Confirm &amp; stage", title:"Confirm it is chronic, stage it on the grid, find the cause", sub:"CKD is defined as abnormalities of kidney structure or function persisting more than 3 months. A single low eGFR is not sufficient.",
     blocks:[
       {b:"dl", rows:[
         ["<b>Definition</b>","Abnormal kidney structure or function for &gt;3 months with implications for health: eGFR &lt;60 mL/min/1.73m\u00b2 on two occasions \u226590 days apart, or persistent damage markers (albuminuria, structural abnormality, hereditary disease) (NG203). If new, repeat within 2 weeks to exclude AKI; establish chronicity from old results or repeat testing"],
         ["First abnormal result","<b>Do not diagnose CKD yet.</b> If new, repeat eGFR within 2 weeks to exclude AKI; then confirm chronicity from previous results or repeat eGFR + ACR over at least 90 days; document <b>\u201cpossible CKD\u201d</b>, and stop nephrotoxins if applicable"],
         ["<b>ACR</b>","<b>Early-morning urine sample.</b> A1 &lt;3 mg/mmol (normal) \u00b7 A2 3\u201330 mg/mmol (moderately increased) \u00b7 A3 &gt;30 mg/mmol (severely increased). Confirm a result of <b>3\u201370 with a repeat; \u226570 needs no repeat</b>. Avoid testing during UTI, acute illness, menstruation or just after strenuous exercise. ACR is more sensitive than PCR for early diabetic nephropathy and is now the preferred marker"],
         ["<b>Dip for blood, send for ACR</b>","Reagent strips for protein only if they measure albumin and report ACR; dipstick for haematuria is appropriate. Persistent non-visible haematuria with ACR \u226530 \u2192 nephrology (glomerular); visible haematuria aged 45 and over \u2192 urology suspected cancer pathway referral first"],
         ["<b>eGFR caveats</b>","Calculated by <b>CKD-EPI</b> in NHS labs. Overestimates function in muscle wasting, underestimates in the very muscular \u2014 <b>use cystatin C</b> where there is uncertainty, particularly to confirm G3a with A1 in an otherwise well patient. Avoid meat-heavy meals before the test"],
         ["<b>What is NOT CKD</b>","A single eGFR without repeat confirmation; <b>transient proteinuria</b> (UTI, exercise, fever, postural); and eGFR 45\u201359 without other markers in someone aged 70+, which may be normal ageing"],
         ["<b>Find the CAUSE</b>","Diabetes (commonest in the UK) and hypertension explain most \u2014 but actively check: <b>obstruction</b> (LUTS \u2192 bladder scan and USS), <b>drugs</b> (NSAIDs, lithium, PPIs causing interstitial nephritis), <b>myeloma</b> in the over-60 with anaemia and high calcium (serum electrophoresis + light chains), <b>family history</b> (PKD \u2192 USS), and <b>systemic features</b> (vasculitis \u2192 urgent). Document the aetiology: diabetic nephropathy, hypertensive, glomerulonephritis, renovascular, polycystic, obstructive, or unknown"],
         ["<b>USS if</b>","Accelerated decline, visible haematuria, obstruction symptoms, family history of PKD, or a newly found eGFR &lt;30 — these are the NICE NG203 indications (also persistent non-visible haematuria, and before a kidney biopsy). <b>It is not required for every new diagnosis</b>, but have a low threshold where obstruction is possible, because obstructive uropathy is potentially fully reversible. <b>Not needed for routine monitoring</b>"]
       ]},
       {b:"table", head:["G\u00d7A grid \u2014 NICE NG203 minimum eGFR tests per year (a minimum framework, not a rigid schedule)","A1 (&lt;3)","A2 (3\u201330)","A3 (&gt;30)"], rows:[
         ["<b>G1\u2013G2 (eGFR \u226560)</b>","0\u20131 (not CKD unless another marker)","1","\u22651"],
         ["<b>G3a (45\u201359)</b>","1","1","2"],
         ["<b>G3b (30\u201344)</b>","1\u20132","2","\u22652"],
         ["<b>G4 (15\u201329)</b>","2","2","3"],
         ["<b>G5 (eGFR &lt;15 ml/min/1.73m\u00b2)</b>","4 (under nephrology)","\u22654 (under nephrology)","\u22654 (under nephrology)"]
       ]},
       {b:"dl", rows:[
         ["What each G stage adds","<b>G1 (eGFR \u226590)</b> normal or high \u2014 CKD only if ACR \u22653 or a structural abnormality. <b>G2 (60\u201389)</b> mildly decreased \u2014 CKD only with other markers; <b>high cardiovascular risk, so treat modifiable factors aggressively</b>. <b>G3a (45\u201359)</b> mild\u2013moderate. <b>G3b (30\u201344)</b> moderate\u2013severe \u2014 check PTH, phosphate, bicarbonate, Hb. <b>G4 (15\u201329)</b> severely decreased \u2014 refer if not already; RRT modality and access planning with the renal team by KFRE, trajectory, comorbidity and preference. <b>G5 (eGFR &lt;15 ml/min/1.73m\u00b2)</b> kidney failure \u2014 individualised review under nephrology; dialysis, transplant or conservative kidney management"],
         ["What each A stage means","<b>A1</b> lower cardiovascular and progression risk for any given G stage. <b>A2</b> higher progression risk \u2014 ACEi/ARB if diabetic (ACR \u22653) or hypertensive with ACR &gt;30. <b>A3</b> high progression risk \u2014 <b>offer ACEi/ARB</b> (ACR \u226570 irrespective of BP), renal dietitian, and nephrology if it persists despite treatment"]
       ]},
       {b:"why", html:"The grid is the whole disease in one picture: <b>risk rises diagonally</b>, and ACR is both the risk marker and the treatment target \u2014 it selects who gets RAAS blockade, who gets an SGLT2 inhibitor, and who gets referred. The KDIGO heat map identifies high, very high and highest-risk combinations predicting both progression and cardiovascular events. <b>This replaced the old \u201cstage 1\u20135\u201d system</b> because it risk-stratifies far better."}
     ]},

    {id:"exam", nav:"Examination", title:"Targeted examination", sub:"Identifies reversible causes, quantifies complications, and changes the urgency of intervention.",
     blocks:[
       {b:"table", head:["What","Look for","Why it changes the plan"], rows:[
         ["<b>Blood pressure, both arms</b>","ACR &lt;70: <b>&lt;140/90 mmHg</b> (120\u2013139/&lt;90); <b>ACR \u226570: &lt;130/80</b> (120\u2013129/&lt;80) (NG203); individualise for frailty and postural symptoms. Orthostatic drop suggests autonomic neuropathy or over-diuresis","A difference &gt;15 mmHg suggests subclavian stenosis or aortic coarctation, both commoner in CKD with atherosclerosis"],
         ["<b>Fluid status</b>","Raised JVP, bibasal crackles, peripheral oedema \u2192 overload \u2192 restrict fluid and optimise the loop diuretic. Postural hypotension \u2192 over-diuresis \u2192 reduce the diuretic","Fluid overload is the commonest cause of \u201cresistant hypertension\u201d in CKD "],
         ["Cardiovascular","Murmurs, <b>irregular pulse (AF)</b>, and <b>pericardial rub \u2192 uraemic emergency, 999</b>","Rub \u2192 dialysis indication"],
         ["Abdomen","<b>Palpable kidneys (bilateral \u2014 ADPKD)</b>, bladder distension (obstructive uropathy \u2192 catheterise urgently), <b>renal artery bruit</b> (renovascular disease)","Bilateral renal enlargement warrants urgent USS for ADPKD, which carries genetic counselling implications"],
         ["Peripheral vascular","Absent pulses, ABPI","PAD is common in advanced CKD \u2014 affects wound healing and vascular-access planning"],
         ["Skin","<b>Uraemic frost</b> (very late, G5), pallor (anaemia from reduced EPO), excoriation from pruritus","Marks advanced disease"],
         ["Neurological","<b>Restless legs</b>, peripheral neuropathy (sensory loss, reduced reflexes)","Advanced uraemia or concurrent diabetic neuropathy"],
         ["Weight, BMI, muscle","<b>Protein-energy wasting is common in G4\u20135</b>","<b>Low muscle mass overestimates eGFR \u2014 consider cystatin C</b>"]
       ]}
     ]},

    {id:"workup", nav:"Investigations", title:"Investigations by stage", sub:"Three purposes: confirm the diagnosis, identify reversible causes, detect complications.",
     blocks:[
       {b:"dl", rows:[
         ["All CKD at baseline","U&amp;E + eGFR, FBC, early-morning urine albumin:creatinine ratio (ACR), HbA1c, lipid profile, urine dipstick (and MC&amp;S if indicated)"],
         ["<b>G3a\u2013G3b additions</b>","<b>Bicarbonate</b> (persistently below the local range \u2014 discuss with nephrology), <b>calcium and phosphate</b>, and <b>PTH</b>"],
         ["<b>G4\u2013G5 additions</b>","<b>25-OH vitamin D</b> (replace if deficient), <b>ferritin and transferrin saturation</b>, reticulocyte count, uric acid"],
         ["Renal ultrasound","<b>NICE NG203 indications:</b> accelerated progression, visible or persistent non-visible haematuria, symptoms of urinary tract obstruction, family history of PKD (aged over 20), eGFR &lt;30, or before a kidney biopsy. Look for obstruction, <b>asymmetry &gt;1.5 cm (renovascular)</b>, small echobright kidneys (chronic damage), ADPKD cysts, calculi"],
         ["Cause-specific","If glomerulonephritis suspected: ANCA, ANA/dsDNA, complement C3/C4, anti-GBM, hepatitis B and C serology \u2014 <b>discuss with nephrology before requesting</b>"],
         ["<b>CKD\u2013MBD</b>","PTH, calcium, phosphate, ALP. Interpret together, as trends, in G4\u2013G5; abnormal values \u2192 renal-team advice (binders and activated vitamin D are renal-directed)"],
         ["<b>Anaemia of CKD</b>","<b>Check iron stores first</b> \u2014 FBC indices, ferritin, TSAT, CRP, B12 and folate; consider blood loss. Do not attribute anaemia to CKD automatically, especially with eGFR &gt;60 or atypical indices"],
         ["<b>Do NOT routinely request</b>","<b>CT IVP</b> (nephrotoxic contrast if eGFR &lt;30); <b>DMSA scan</b> from primary care; <b>renal biopsy</b> (nephrology only); <b>serum creatinine alone</b> (use eGFR); <b>24-hour urine collection</b> (ACR is now preferred)"]
       ]},
       {b:"warn", html:"<b>Gadolinium MRI contrast is contraindicated at eGFR &lt;30</b> \u2014 risk of nephrogenic systemic fibrosis. <b>Check the eGFR before ordering any contrast investigation.</b>"},
       {b:"why", html:"Bicarbonate monitoring from G3a matters because metabolic acidosis activates catabolic pathways that accelerate muscle loss and CKD progression ; evidence for routine bicarbonate to slow progression is still evolving. CKD\u2013mineral bone disease contributes to vascular calcification and cardiovascular risk."}
     ]},

    {id:"ladder", nav:"The big four", title:"The four kidney-protecting drugs \u2014 exact criteria", sub:"CKD treatment targets two linked problems: slowing decline, and reducing cardiovascular mortality — the commonest cause of death in CKD.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1", title:"BP to target, with ACEi/ARB if proteinuric", when:"the foundation",
          html:"<b>ACR &lt;70: &lt;140/90 (120\u2013139/&lt;90); ACR \u226570: &lt;130/80 (120\u2013129/&lt;80)</b> (NG203; ACR \u226430 follows NICE hypertension guidance) \u2014 individualise for frailty. <b>Offer an ACEi/ARB</b> (e.g. ramipril or losartan, per SPC and formulary) titrated to the maximum tolerated dose for: ACR \u226570 (irrespective of BP), ACR &gt;30 with hypertension, or ACR \u22653 with diabetes. Check eGFR, sodium and K\u207a before. U&amp;E and K\u207a before, and 1\u20132 weeks after each dose increase. Rise in creatinine &gt;30% or eGFR fall \u226525% \u2192 look for volume depletion, NSAIDs and other causes. Choose an ACEi first and switch to an ARB for cough. <b>Never combine an ACEi with an ARB.</b>"},
         {step:"1b", title:"Non-proteinuric CKD without diabetes", when:"where RAAS blockade is not indicated",
          fromLabel:"different first agent",
          html:"<b>Amlodipine 5 mg OD titrated to 10 mg</b>, or a thiazide-like diuretic \u2014 <b>indapamide 1.5 mg MR</b>. Target <b>&lt;140/90 mmHg</b>. Add an ACEi as third agent if resistant. <b>Avoid thiazides if eGFR &lt;30 \u2014 they are ineffective.</b>"},
         {step:"2", title:"SGLT2 inhibitor (gliflozin \u2014 dapagliflozin or empagliflozin)", when:"eligible CKD per TA1075, with or without diabetes",
          fromLabel:"on top of maximised ACEi/ARB",
          html:"Dapagliflozin 10 mg OD (NICE TA1075; empagliflozin is the alternative gliflozin), added to optimised care including the highest tolerated ACEi/ARB unless contraindicated, when: <b>eGFR 20 to &lt;45 \u2014 regardless of ACR</b>; or <b>eGFR 45\u201390 with ACR \u226522.6 mg/mmol or type 2 diabetes</b>. (The licence is broader \u2014 use the NICE criteria and local commissioning.) Slows CKD progression (DAPA-CKD). <b>Expect an initial eGFR dip of around 3\u20135 \u2014 do not stop.</b> <b>Do not initiate if eGFR &lt;20 \u2014 NICE TA1075 (2025) sets the initiation range at eGFR 20 to 90.</b> Cautions: genital mycotic infection, volume depletion (adjust diuretics), rare euglycaemic DKA, Fournier's gangrene; pause in serious acute illness, prolonged fasting and peri-operatively; not for type 1 diabetes in this pathway; individualise with foot ulceration, frailty or low-carbohydrate diets (GM SGLT2 guidance)."},
         {step:"3", title:"Statin", when:"adults with CKD",
          fromLabel:"cardiovascular risk is the main killer",
          html:"<b>Offer atorvastatin 20 mg</b> regardless of cholesterol unless contraindicated or already on appropriate lipid therapy \u2014 tailor for dialysis, transplant and established CVD per the GM lipid pathway. Monitoring frequency runs from <b>annual (eGFR \u226545 with ACR \u226430)</b> to <b>3-monthly (eGFR &lt;15)</b>. SHARP supports lipid lowering in CKD. Aspirin 75 mg only if established CVD \u2014 not for primary prevention in CKD (bleeding risk)."},
         {step:"4", title:"Finerenone", when:"type 2 diabetes with CKD still proteinuric",
          fromLabel:"the newest addition",
          html:"<b>Finerenone (NICE TA877)</b>: type 2 diabetes with stage 3\u20134 CKD and persistent albuminuria (<b>ACR \u22653 mg/mmol</b>), <b>eGFR \u226525</b>, on optimised ACEi/ARB and an SGLT2 inhibitor (unless unsuitable). Usually start <b>10 mg OD if eGFR 25\u201359, 20 mg if \u226560</b>, titrated by K\u207a and eGFR per SPC; do not start above the product-specific K\u207a threshold. <b>K\u207a and eGFR at baseline, about 1 month, then at least 4-monthly</b>; withhold or reduce per SPC \u2014 <b>hyperkalaemia is the main risk</b>. Confirm local shared-care arrangements before GP initiation."},
         {step:"Alt", title:"Resistant hypertension \u2014 spironolactone", when:"on >3 agents",
          fromLabel:"with caution",
          html:"Consider spironolactone per NICE hypertension guidance and local protocols \u2014 it is commonly combined with an ACEi/ARB. Check K\u207a and renal function before and shortly after starting or changing the dose; avoid or seek specialist advice with significant renal impairment or baseline hyperkalaemia. (The \u2018dual RAAS\u2019 harm applies to ACEi + ARB or a renin inhibitor.)"}
       ]},
       {b:"table", head:["Everyday drug","Renal gate","Action"], rows:[
         ["<b>Metformin</b>","eGFR 30\u201344 \u2192 reduce dose and review; &lt;30 \u2192 do not use; withhold in significant AKI, dehydration, hypoxia or sepsis","Switch per the diabetes ladder"],
         ["<b>Sulfonylureas</b>","<b>eGFR &lt;30</b>","Hypoglycaemia risk \u2014 <b>avoid glibenclamide</b>; cautious low-dose gliclazide. <b>SGLT2i is the preferred add-on in CKD + T2DM.</b> HbA1c target <b>53\u201358 mmol/mol</b>, less tight if frail or hypo-prone"],
         ["<b>DOACs</b>","<b>Use CrCl (Cockcroft\u2013Gault), not eGFR</b>","Apply each DOAC's own reduction rules; at very low CrCl the choice is individual \u2014 specialist advice"],
         ["<b>Nitrofurantoin</b>","<b>eGFR &lt;45</b>","Avoid below 30; eGFR 30\u201344 only a short course in selected patients where benefit outweighs risk, per the GM antimicrobial guideline. Not trimethoprim if K\u207a is high: it raises K\u207a and raises creatinine cosmetically"],
         ["<b>Opioids</b>","<b>G4\u20135</b>","<b>Morphine accumulates, and oxycodone can too</b> \u2014 cautious, indication-specific choice; start low, go slow; palliative, pain or renal advice"],
         ["<b>Bisphosphonates</b>","<b>eGFR &lt;30</b>","Individualise \u2014 consider renal bone disease; specialist or osteoporosis-pathway advice"],
         ["Digoxin, gabapentinoids (gabapentin, pregabalin), aciclovir, allopurinol, LMWH","Renally cleared","<b>Dose-reduce per the SPC/BNF renal tables</b> \u2014 building that habit is the point"]
       ]},
       {b:"why", html:"The permitted rise on ACEi/ARB initiation is one of the most important practical points in CKD care. Stopping for an expected haemodynamic dip deprives patients of renoprotection \u2014 REIN showed ramipril halved progression to end-stage disease in proteinuric CKD. Avoiding combined ACEi + ARB is equally critical: ONTARGET showed increased AKI, hyperkalaemia and death without additional renal benefit."}
     ]},

    {id:"complications", nav:"Complications", title:"Manage the complications by the numbers", sub:"Anaemia, potassium, bone, acidosis and gout — each with a threshold and an action.",
     blocks:[
       {b:"table", head:["Complication","Screen when","Threshold \u2192 action"], rows:[
         ["<b>Anaemia</b>","Hb at every review from G3b, or if symptomatic","Hb \u2264110 g/L or symptomatic \u2192 investigate: FBC indices, ferritin, TSAT, CRP, B12, folate; consider blood loss and systemic causes \u2014 do not assume CKD. Iron route (oral or IV) depends on absolute versus functional deficiency, severity, tolerance, inflammation and whether an ESA is planned \u2014 per the local renal anaemia protocol (UKKA 2024). <b>ESAs are renal-led</b>; the Hb 100\u2013120 g/L target applies only to patients on an ESA"],
         ["<b>Hyperkalaemia</b>","With every U&amp;E","<b>5.5\u20135.9:</b> dietary advice, review K\u207a-raising drugs (<b>trimethoprim, spironolactone, NSAIDs</b>), recheck. Repeat promptly if unexpected (haemolysis), and review constipation and acidosis too. <b>\u22656.0:</b> same-day assessment, urgent repeat + ECG per local pathway. <b>\u22656.5 or ECG changes:</b> emergency hospital management. Persistent hyperkalaemia limiting RAAS therapy: sodium zirconium cyclosilicate (TA1148, confirmed K\u207a \u22655.5) or patiromer (TA623, \u22656.0) \u2014 <b>initiated and monitored under the renal/cardiology shared-care pathway</b>, never as a substitute for emergency treatment"],
         ["<b>Bone \u2014 CKD\u2013MBD</b>","<b>Calcium, phosphate, PTH, vitamin D from G4</b> (this page follows NG203; screening from G3a is also widely practised \u2014 see the note below)","Interpret calcium, phosphate, PTH, ALP and vitamin D together, as trends. Correct vitamin D deficiency with colecalciferol or ergocalciferol where appropriate. Persistent hyperphosphataemia, significant secondary hyperparathyroidism or abnormal calcium \u2192 renal-team advice; <b>phosphate binders and activated vitamin D are renal-initiated</b>"],
         ["<b>Acidosis</b>","Bicarbonate from G4 (and from G3a where monitored)","Confirm persistent acidosis; exclude respiratory or measurement causes; review K\u207a, renal function, volume and medicines. Persistent bicarbonate below the local range (particularly &lt;20\u201322 mmol/L) \u2192 <b>discuss with nephrology before starting sodium bicarbonate</b>; consider sodium load, hypertension, oedema and heart failure. Benefit on progression is still evolving"],
         ["<b>Gout</b>","Clinically","<b>Allopurinol dose-adjusted \u2014 start 50\u2013100 mg.</b> <b>NO NSAIDs</b> \u2192 <b>low-dose colchicine 500 micrograms OD\u2013BD</b>, or a short steroid course for flares"]
       ]},
       {b:"warn", html:"<b>Two thresholds where the sources differ, resolved deliberately.</b> <b>Bone screening:</b> NG203 specifies calcium, phosphate, PTH and vitamin D <b>from G4</b>, and that is the rule here; screening <b>from G3a</b> is common practice and reasonable where progression is rapid \u2014 both are recorded so neither is lost. <b>Anaemia:</b> <b>investigate at Hb &lt;110 g/L</b>, and <b>ESA treatment is a renal-team decision</b> once iron deficiency is corrected; the Hb 100\u2013120 g/L target applies only to patients on an ESA \u2014 these are two different decisions, not a contradiction."}
     ]},

    {id:"lifestyle", nav:"Protect", title:"Protecting the kidneys \u2014 the daily rules", sub:"Lifestyle modification is integral treatment, not an afterthought. Address every point at every annual review.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"\ud83d\udeab NSAIDs \u2014 the number one avoidable nephrotoxin", html:"Including <b>OTC ibuprofen and topical-to-oral drift</b>. <b>Stop in G3 and above.</b> Flag it on the record and offer alternatives \u2014 <b>paracetamol is fine</b>."},
         {tone:"amber", h:"\ud83e\udd22 Sick-day rules \u2014 in writing", html:"Significant vomiting, diarrhoea, fever with poor intake or dehydration \u2192 seek advice. Metformin and SGLT2 inhibitors are generally paused; ACEi/ARB and diuretics are reviewed by volume, BP and renal function; insulin is never stopped without diabetes advice. Restart once recovered and eating and drinking normally, with renal-function review if illness was significant or prolonged \u2014 no blanket 48-hour rule."},
         {tone:"green", h:"\ud83e\uddc2 Salt \u2014 the most under-used intervention", html:"Reduce salt to &lt;5g/day (2 g sodium) \u2014 lowers BP by 5\u201310 mmHg; the UK adult population target (SACN Salt and Health, 2003) is &lt;6 g/day, and NICE NG203 advises salt guidance matched to CKD severity. A 1 g/day sodium reduction lowers systolic BP by about 2\u20133 mmHg; restricting to 2 g/day reduces it by around 10 mmHg \u2014 equivalent to adding a second antihypertensive. Avoid liquorice and excess caffeine. <b>Home BP monitoring with a validated cuff.</b>"},
         {tone:"blue", h:"\ud83e\udd69 Protein \u2014 what this page recommends", html:"<b>No routine protein restriction in primary care</b> \u2014 the risk of malnutrition outweighs the benefit, and it is not a primary-care intervention. Any protein restriction is renal-dietitian led and balanced against nutritional status. <b>Renal dietitian</b> for potassium, phosphate or protein advice where indicated. Avoid very high-protein diets and gym supplements."},
         {tone:"blue", h:"\u26a1 Potassium", html:"Potassium restriction only for persistent hyperkalaemia, ideally renal-dietitian led \u2014 crude food lists can worsen diet quality. Avoid <b>salt substitutes (LoSalt)</b>."},
         {tone:"blue", h:"\ud83e\uddea Phosphate", html:"From G3b: limit processed foods, cola drinks and excess dairy. <b>Phosphate additives (E numbers) in processed food are rapidly absorbed</b> \u2014 fresh food is preferred, and this works synergistically with binders."},
         {tone:"green", h:"\ud83d\udead Smoking", html:"Smoking accelerates CKD progression and cardiovascular risk. NHS Stop Smoking Service; varenicline or combination NRT."},
         {tone:"green", h:"\ud83c\udfc3 Exercise and weight", html:"<b>150 minutes/week</b> moderate aerobic activity; resistance training from G3b with dietitian input. Reduces BP, improves insulin resistance, and <b>slows sarcopenia</b>.  Avoid dehydration during exercise. Cardiovascular death is the commonest CKD outcome \u2014 these count double."},
         {tone:"blue", h:"\ud83d\udca7 Hydration", html:"Maintain normal hydration unless a renal, heart-failure or other fluid restriction is prescribed; avoid deliberate overhydration. Dehydration can trigger AKI."},
         {tone:"blue", h:"\ud83d\udc89 Vaccination", html:"Annual influenza; COVID per the current schedule. <b>Pneumococcal per the current Green Book (chapter 25, 2026 \u2014 PCV20)</b>: CKD stage 4\u20135, nephrotic syndrome, dialysis or transplant; revaccination intervals per the programme. Hepatitis B (renal-specific vaccine, follow-up serology) for those likely to need renal replacement therapy, ideally before dialysis (chapter 18)."},
         {tone:"cream", h:"\ud83d\udccb Medication review \u2014 every review", html:"Hunt dose errors against the renal gates, drugs whose indication has lapsed, and interacting OTC or herbal products. Review nephrotoxins: NSAIDs, aminoglycosides (renal dosing), and contrast agents against the eGFR threshold."}
       ]}
     ]},

    {id:"monitor", nav:"Review", title:"The structured review \u2014 track the trajectory, not the snapshot", sub:"NICE NG203 minimum eGFR monitoring per year — G3a: 1/1/2 (A1/A2/A3) · G3b: 1–2/2/≥2 · G4: 2/2/3 · G5: 4/≥4/≥4 — a minimum framework, not a rigid schedule; ACR individualised.",
     blocks:[
       {b:"table", head:["What","When","Why"], rows:[
         ["<b>eGFR + ACR</b>","Per the grid cell \u2014 annual to 3-monthly","<b>Plot the TRAJECTORY.</b> Accelerated progression = a sustained eGFR fall \u226525% with a category change within 12 months, or \u226515 mL/min/year \u2192 work through the loop below and refer. "],
         ["<b>4-variable KFRE</b>","<b>Annually from G3</b>","Age + sex + eGFR + ACR \u2192 5-year kidney-failure risk. <b>&gt;5% = refer (NG203)</b>; it also rationally reassures the stable elderly G3a patient, whose risk is often under 1%"],
         ["<b>U&amp;E after any RAAS or diuretic change</b>","<b>1\u20132 weeks</b>","<b>Acceptable: eGFR fall \u226425% or creatinine rise \u226430%.</b> SGLT2i: eGFR + K\u207a at 4 weeks. Finerenone: K\u207a at 1 month. Spironolactone: K\u207a at 1 week"],
         ["<b>Annual bundle</b>","Once a year","BP, weight, HbA1c if diabetic, lipids, <b>Hb from G3b</b>, medication and nephrotoxin review, <b>sick-day-rule reinforcement</b>, vaccination check"],
         ["<b>By stage</b>","\u2014","<b>G1\u2013G2:</b> annual eGFR, ACR, U&amp;E, BP and dipstick. <b>G3a:</b> annual eGFR, ACR, U&amp;E, FBC, bicarbonate, calcium, phosphate, HbA1c, lipids; BP at each contact. <b>G3b:</b> 6-monthly eGFR, ACR, FBC, U&amp;E, calcium, phosphate, PTH, bicarbonate; BP every 3\u20136 months. <b>G4:</b> nephrology involved; RRT and access planning per the renal team. <b>G5:</b> individualised review under nephrology with primary-care co-management, transplant assessment, conservative-care discussion, <b>advance care planning</b>"]
       ]},
       {b:"kv", rows:[
         ["<b>Annual review checklist</b>","eGFR trajectory plotted \u00b7 ACR trend \u00b7 BP at target \u00b7 HbA1c if diabetic \u00b7 smoking status \u00b7 medication review including nephrotoxins and dose gates \u00b7 vaccinations \u00b7 <b>sick-day rules given</b> \u00b7 statin prescribed \u00b7 <b>SGLT2 inhibitor considered</b> \u00b7 dietitian referral if G3b and above"]
       ]},
       {b:"cards", items:[
         
       ]},
       {b:"cards", items:[
         {tone:"red", h:"\ud83d\udea8 999", html:"\u201cSudden breathlessness or chest pain, confusion or reduced consciousness, <b>no urine for 12+ hours</b>, severe swelling, or muscle weakness with a high potassium \u2014 call 999.\u201d"},
         {tone:"amber", h:"\ud83d\udd34 Same-day GP", html:"\u201cUrine output significantly reduced, a high potassium we have told you about, very high blood pressure with symptoms, any illness causing dehydration if you are in stage 4\u20135, new leg swelling, or new blood in the urine.\u201d"},
         {tone:"amber", h:"\ud83e\udd22 The sick-day card", html:"\u201cIf you're vomiting, have diarrhoea or can't keep fluids down, ring us \u2014 we'll tell you which tablets to pause (usually metformin and the 'flozin'; the kidney, BP and water tablets depending on how you are), and when to restart.\u201d"},
         {tone:"amber", h:"\ud83d\udc8a Painkillers", html:"\u201cNo ibuprofen or naproxen-type drugs \u2014 including ones bought over the counter. Paracetamol is fine.\u201d"},
         {tone:"green", h:"\u26a1 Potassium", html:"\u201cIf we've told you your potassium runs high: watch salt substitutes like LoSalt, and mention it whenever anyone prescribes you something new.\u201d"}
       ]},
       {b:"say", html:"Your kidneys are working at about [X]% and our job is to keep them there \u2014 the blood-pressure tablet and the newer 'flozin' tablet both protect them directly, and the main things that hurt them are ibuprofen-type painkillers and getting dehydrated when you're unwell. That's what the sick-day card is for."},
       {b:"why", html:"Plotting eGFR as a trend line is more informative than any single value \u2014 eGFR 38 stable for five years is a very different patient from eGFR 38 that has fallen from 60 in two years; the latter needs urgent nephrology. The QOF CKD annual-review indicator (<b>CKD006</b>: annual review with ACR, eGFR and BP) is both a quality requirement and the mechanism by which deterioration is detected early. The 1\u20132 week U&amp;E check after starting an ACEi/ARB prevents undetected severe hyperkalaemia. Advance care planning from G4 respects patient autonomy and prevents unwanted intervention near the end of life \u2014 conservative kidney management without dialysis is a valid option for frail elderly patients, offered alongside RRT in NICE NG107."}
     ]},

    {id:"loop", nav:"Not responding?", title:"eGFR falling faster than expected? Check before blaming CKD", sub:"CKD progresses slowly. A step-change in creatinine is AKI-on-CKD or an artefact until proven otherwise.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"1 · AKI on CKD", html:"Dehydration, sepsis, new drug, contrast within 7 days? Treat the insult, recheck in 1\u20132 weeks."},
         {tone:"blue", h:"2 · Obstruction", html:"Men + LUTS, palpable bladder, single kidney → bladder scan + renal USS."},
         {tone:"blue", h:"3 · Drug artefact", html:"Trimethoprim raises creatinine ~20% without real GFR change; creatine supplements; big meat meal pre-test."},
         {tone:"blue", h:"4 · New nephrotoxin", html:"NSAID (incl. OTC), PPI (interstitial nephritis), lithium level, recently added diuretic + ACEi + dehydration."},
         {tone:"red", h:"5 · The kidneys themselves", html:"Active urine sediment (blood + protein new) → glomerulonephritis/vasculitis → urgent renal; myeloma screen in the older patient."},
         {tone:"amber", h:"6 · Real and sustained?", html:"Confirm on repeat before acting — one reading is not a trajectory."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Nephrology \u2014 by risk, not just by number", sub:"About 60% of UK CKD is managed solely in primary care — the system depends on knowing when NOT to refer as much as when to refer.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same-day / 999", html:"AKI on CKD \u00b7 new eGFR &lt;15 with an acute complication (if stable \u2192 urgent renal discussion) \u00b7 K\u207a \u22656.5 mmol/L or ECG changes \u00b7 pulmonary oedema secondary to CKD \u00b7 uraemic encephalopathy or pericarditis \u00b7 fluid overload with oliguria."},
         {tone:"amber", h:"Urgent \u2014 within days", html:"<b>eGFR 15\u201329 (G4) not previously known to nephrology</b>; <b>rapid decline \u2014 &gt;25% fall in 12 months</b>; <b>unexplained eGFR fall &gt;15 mL/min in 3 months</b>; new nephrotic syndrome (ACR &gt;220 mg/mmol with hypoalbuminaemia and oedema)."},
         {tone:"blue", h:"Routine nephrology \u2014 the NG203 criteria", html:"<b>KFRE 5-year risk &gt;5%</b> \u2014 the headline criterion. <b>eGFR &lt;30 (eGFR&lt;30, G4\u2013G5)</b> as a practical advanced kidney-care trigger (local pathway); modality and access planning by the renal team. <b>ACR \u226570 mg/mmol</b> unless it is established diabetic nephropathy already on treatment, or <b>despite 3 months of optimised ACEi/ARB</b>. <b>Sustained ACR &gt;300 mg/mmol.</b> <b>ACR &gt;30 with persistent haematuria.</b> <b>Resistant hypertension despite \u22654 agents.</b> Sustained eGFR fall \u226525% with a category change within 12 months, or \u226515 mL/min/year. Suspected rare or genetic disease or renal artery stenosis. Suspected glomerulonephritis, vasculitis or myeloma nephropathy."},
         {tone:"blue", h:"Cause needs a specialist", html:"Suspected glomerular disease (active urinary sediment), PKD, myeloma, renal artery stenosis \u2014 suspect if creatinine jumps &gt;25% on an ACEi, a young patient with early CKD, or a single kidney with declining function. Consider renal and vascular genetics."},
         {tone:"blue", h:"Complications", html:"ESA-territory anaemia, or <b>unexplained anaemia not responding to iron</b>; G4 bone disease; resistant hyperkalaemia; BP uncontrolled on 3\u20134 agents; eGFR declining in G3 despite optimised management (consider a GP-to-consultant advice request first)."},
         {tone:"blue", h:"Urology", html:"<b>Obstructive uropathy on USS</b>; haematuria with a renal lesion; recurrent renal calculi; suspected bladder-outflow obstruction contributing to CKD. <b>Suspected cancer pathway referral if visible haematuria aged 45 and over.</b>"},
         {tone:"blue", h:"Renal dietitian", html:"<b>From G3b:</b> dietitian-led protein guidance where clinically indicated (balanced against nutritional status), phosphate restriction in hyperphosphataemia, and <b>potassium restriction if K\u207a &gt;5.5 mmol/L on an ACEi/ARB</b>."},
         {tone:"cream", h:"Continue in primary care", html:"G1\u2013G3a with a stable eGFR, ACR &lt;70, a known cause (diabetic or hypertensive nephropathy), controlled BP and no complications \u2014 on the annual review protocol."}
       ]},
       {b:"why", html:"Timely referral matters because access planning, if dialysis is chosen, takes months. KFRE is less reliable during AKI, at extremes of muscle mass, with an unreliable ACR, or in some primary renal diseases (UK eCKD Guide). The rapid-decline threshold captures accelerated CKD from renovascular disease, myeloma or uncontrolled diabetes \u2014 <b>all reversible if caught early</b>. <b>ACR &gt;300 mg/mmol is the nephrotic-range threshold</b> that often indicates primary glomerular disease requiring biopsy."},
       {b:"say", html:"I'm referring you to the kidney team \u2014 not because dialysis is coming, but because your numbers put you in the group where a specialist plan now prevents that later. We'll keep running your day-to-day care together."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only \u2014 the Casebook keeps the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 58-year-old woman with type 2 diabetes, eGFR 52, ACR 45 mg/mmol on two samples three months apart, BP 148/86, on metformin and atorvastatin. She has read that \u201cthe blood pressure tablet damages your kidneys\u201d because her creatinine rose when it was started, and stopped it herself."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Stages her as <b>G3aA3</b> and explains that the ACR matters as much as the eGFR; explains that the creatinine rise on starting the ACEi was expected and acceptable up to 30%, and restarts it with a 1\u20132 week U&amp;E; targets BP <b>&lt;140/90</b> (ACR &lt;70, per NG203), individualised; <b>adds dapagliflozin</b> (T2DM, eGFR 45–90 — TA1075); calculates the <b>KFRE</b> rather than referring on eGFR alone; and gives individualised <b>sick-day advice</b>. <a href='../../cases/ckd.html'>Open the full casebook chapter \u2192</a>"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>NICE NG203 \u2014 Chronic kidney disease: assessment and management (2021)<br><a href="https://www.nice.org.uk/guidance/ng203" rel="noopener">nice.org.uk/guidance/ng203</a><span class="rd"> \u2014 the 90-day rule, ACR-based staging and the G\u00d7A grid, BP targets by ACR, ACEi/ARB indications and the acceptable eGFR fall, renal ultrasound indications, minimum monitoring frequency by G\u00d7A category, CKD\u2013MBD screening from G4, KFRE &gt;5% as the referral criterion, and QOF CKD006</span></li>'+
         '<li><b>KDIGO CKD Guideline (2024, international)</b><span class="rd"> \u2014 the G1\u2013G5 \u00d7 A1\u2013A3 heat map and its risk categories, and the AKI criteria used to exclude AKI-on-CKD</span></li>'+
         '<li><b>NICE TA1075 (2025) \u2014 Dapagliflozin for CKD</b><span class="rd"> \u2014 added to optimised ACEi/ARB: eGFR 20 to &lt;45 regardless of ACR, or eGFR 45\u201390 with ACR \u226522.6 mg/mmol or type 2 diabetes (NICE criteria, not the broader licence); replaced TA775</span></li>'+
         '<li><b>NICE TA877 \u2014 Finerenone for CKD with type 2 diabetes</b><span class="rd"> \u2014 ACR threshold, eGFR \u226525, product-specific K\u207a initiation threshold (SPC), and potassium monitoring</span></li>'+
         '<li>NICE TA623 \u2014 Patiromer for treating hyperkalaemia (2020); NICE TA1148 \u2014 Sodium zirconium cyclosilicate for treating hyperkalaemia (April 2026; replaced TA599)<span class="rd"> \u2014 enabling continuation of RAAS blockade rather than losing renoprotection</span></li>'+
         '<li>DAPA-CKD; FIDELIO-DKD; SHARP; REIN; ONTARGET; SPRINT; BICAR-RCT; STEPPING<span class="rd"> \u2014 trial evidence for dapagliflozin, finerenone, statins and ramipril in CKD; the harm of dual RAAS blockade; intensive BP lowering; bicarbonate and exercise trials (benefit on progression still evolving)</span></li>'+
         '<li><b>NICE NG12 \u2014 Suspected cancer: recognition and referral (updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> \u2014 unexplained visible haematuria aged 45 and over \u2192 urgent suspected bladder or renal cancer referral; myeloma screening in the older patient with anaemia and hypercalcaemia</span></li>'+
         '<li>NICE NG203 \u2014 chronic kidney disease; NHS England AKI Programme; BHS hypertension guidance<span class="rd"> \u2014 primary-care operationalisation, sick-day rules, and BP measurement standards</span></li>'+
         '<li><b>UK Kidney Association \u2014 Anaemia in CKD (2024); UK eCKD Guide</b><br><a href="https://www.ukkidney.org" rel="noopener">ukkidney.org</a><span class="rd"> \u2014 iron assessment before ESA, renal-led ESA therapy, and KFRE limitations (consensus guidance, distinct from NICE recommendations)</span></li>'+
         '<li><b>UKHSA Green Book \u2014 chapter 25 (pneumococcal) and chapter 18 (hepatitis B)</b><br><a href="https://www.gov.uk/government/collections/immunisation-against-infectious-disease-the-green-book" rel="noopener">gov.uk \u2014 the Green Book</a><span class="rd"> \u2014 CKD stage 4\u20135, nephrotic syndrome, dialysis or transplant eligibility; hepatitis B before dialysis</span></li>'+
         '<li><b>Greater Manchester Medicines Management Group (GMMMG)</b><br><a href="https://gmmmg.nhs.uk" rel="noopener">gmmmg.nhs.uk</a><span class="rd"> \u2014 local SGLT2 safe-prescribing guidance, lipid pathway, and patiromer/potassium-binder shared-care protocols (check the current version and review date)</span></li>'+
         '<li><b>BNF \u2014 renal impairment tables</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> \u2014 every dose gate on this page: metformin, sulfonylureas, DOACs by CrCl, nitrofurantoin, opioids, bisphosphonates, digoxin, gabapentinoids, aciclovir, allopurinol</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Confirmed CKD in adults \u2014 NICE NG203 (2021) with KDIGO 2024, TA1075 (dapagliflozin, 2025), TA877 (finerenone) and TA623 (patiromer). Diagnosis, staging and management are merged on this page; there is no separate CKD pathway to cross-check. Verify all doses against the current BNF renal impairment tables before prescribing."
