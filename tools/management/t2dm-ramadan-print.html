MG.render({
  icon:"🌙",
  title:"Type 2 diabetes in Ramadan — the complete guide",

  stemTitle:"Most people with diabetes will fast whether or not you advise it — so the useful consultation is not about permission, it is about risk stratification, retiming every drug to iftar and suhoor, and agreeing in advance when to break the fast",
  stemSub:"One page for the whole condition. Stratify with the IDF-DAR/BIMA three tiers <b>6–8 weeks before</b> Ramadan, because switching a sulfonylurea, trialling a fast and arranging education cannot be done once it has started. Then the four things that make fasting safe: the break-the-fast thresholds, the bigger dose moved to iftar with the suhoor dose trimmed, a late suhoor with slow-release carbohydrate and real hydration, and the IDF-DAR and BIMA advice that finger-prick testing does not invalidate the fast — a common barrier to safe monitoring. Complex medication changes — insulin, SGLT2 inhibitors, type 1 diabetes — are made with the diabetes team.",
  guideline:"IDF-DAR 2021 (international) · BIMA 2020 · NICE NG28 (updated February 2026) · MHRA Drug Safety Update (April 2016, March 2020) · GMMMG Safe prescribing of SGLT2 inhibitors in type 2 diabetes · local Greater Manchester diabetes pathway · Diabetes &amp; Primary Care 2023",

    {t:"IDF-DAR (2021) Diabetes and Ramadan: Practical Guidelines (international)"},

  ],
  lead:'<div class="mg-layers"><a href="#safety"><b>Break the fast</b><small>Agreed IDF-DAR rules</small></a><a href="#risk"><b>Risk tiers</b><small>IDF-DAR / BIMA</small></a><a href="#oral"><b>Oral agents</b><small>Retime to iftar</small></a><a href="#insulin"><b>Insulin</b><small>Starting frameworks · specialist</small></a><a href="#lifestyle"><b>Diet</b><small>Suhoor · hydration</small></a></div>',
  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Break the fast immediately if…", html:"Agree in advance the IDF-DAR break-fast thresholds used locally; follow the individual diabetes-team plan where it differs. <b>Blood glucose below 3.9 mmol/L</b> — impending hypoglycaemia; treat, and do not continue the fast. <b>Blood glucose above 16.7 mmol/L.</b> Any hypoglycaemic symptoms — sweating, tremor, palpitations, confusion — even without a meter to hand. <b>Any acute illness, vomiting, suspected ketosis or inability to maintain hydration</b> → apply the <a href='sick-day-rules.html'>sick day rules</a> and resume when health is back to normal. <b>Agree these rules out loud before Ramadan, not during it.</b>"},
    {tone:"blue", h:"Finger-prick testing and the fast", html:"<b>IDF-DAR and BIMA education materials advise that finger-prick glucose testing does not invalidate the fast.</b> Testing is medically necessary and should be encouraged. The belief that testing invalidates the fast is a common barrier to safe self-monitoring; confirm the patient's own religious understanding where needed and offer access to a trusted scholar or community resource. Vaccination advice should follow the current NHS programme; if the patient is concerned about whether vaccination affects the fast, signpost to an appropriate Islamic scholar or BIMA resource."},
    {tone:"amber", h:"The assessment belongs 6–8 weeks before Ramadan", html:"Offer a structured pre-Ramadan assessment and education session 6–8 weeks ahead. That lead time is the point: switching a high-hypoglycaemia-risk drug, arranging a supervised trial fast for selected lower-risk people, supplying a meter and training on it, and starting any planned new agent all have to happen BEFORE the month begins. <b>Avoid non-urgent initiation or major treatment changes during Ramadan.</b> If treatment is clinically necessary — for example symptomatic hyperglycaemia, recurrent hypoglycaemia or acute metabolic deterioration — involve the diabetes team, provide enhanced monitoring and document the fasting-specific plan."},
    {tone:"blue", h:"The retiming principle in one line", html:"<b>The bigger dose moves to iftar; the suhoor dose is the dangerous one.</b> <b>Metformin: total dose unchanged, only the timing changes.</b> Sulfonylurea: avoid glibenclamide where possible; if continued, gliclazide is generally preferred, with the dose and timing individualised to the glucose profile — usually favouring the iftar dose and reducing the suhoor dose. DPP-4 inhibitors are lower risk (check renal dosing); GLP-1 receptor agonists need caution with nausea, escalation and co-prescribed insulin or sulfonylurea; pioglitazone carries fluid-retention and heart-failure risk."},
    {tone:"amber", h:"SGLT2 inhibitors — an individual risk–benefit decision", html:"SGLT2 inhibitors require an individual risk–benefit decision before Ramadan. Fasting and dehydration increase the risk of euglycaemic DKA and AKI. <b>Do not advise routine continuation simply by moving the dose to iftar.</b> The drug may have important heart-failure or renal benefits, so stopping it is not an automatic GP decision: discuss temporary withholding or an alternative plan with the diabetes team, particularly with previous DKA, recurrent dehydration, acute illness, poor oral intake, CKD, frailty or significant diuretic therapy. If continued, provide explicit sick-day rules, hydration advice, ketone/DKA safety-netting and a clear stop/restart plan."},
    {tone:"green", h:"Exemption — explain respectfully, offer a scholar", html:"Islamic guidance, as summarised by BIMA, recognises exemption for those whose health is harmed by fasting. The alternatives are worth naming: non-consecutive fasts, fasting in the winter months when fasts are shorter, feeding others, and fidyah (a charitable donation; the amount is set locally). Strongly advise against fasting where IDF-DAR/BIMA classify the person as very high risk, explain the medical reasons, and offer discussion with a trusted scholar if the patient wishes. If the patient chooses to fast, do not abandon care: document the decision and provide harm-reduction education, monitoring and specialist support."}
  ],
  pathwaySub:"Five steps, and the first one has to happen weeks before the month starts.",
  pathway:[
    {title:"Book the pre-Ramadan assessment 6–8 weeks ahead", html:"Structured education, a meter and SMBG training, a review of every drug, and time to switch anything high-risk. A supervised trial fast may be considered for selected lower-risk people after risk assessment, education and a written monitoring plan."},
    {title:"Stratify the risk — IDF-DAR / BIMA three tiers", html:"Category 1 (very high) — strongly advise against fasting · Category 2 (high) — advise against, individualise · Category 3 (moderate/low) — may fast at the patient's discretion. Use the tool as a framework and review the classification clinically. Weigh diabetes type, hypoglycaemia risk and awareness, current drugs, complications, comorbidities, social and work circumstances, and previous fasting experience."},
    {title:"Agree the break-the-fast rules", html:"IDF-DAR thresholds: BG below 3.9 or above 16.7 mmol/L, any hypoglycaemic symptoms, acute illness, vomiting, suspected ketosis or inability to maintain hydration. <b>And explain that IDF-DAR/BIMA advise testing does not invalidate the fast.</b>", alert:true},
    {title:"Retime and adjust every drug", html:"Bigger dose to iftar; metformin total usually unchanged; sulfonylurea individualised with the suhoor dose trimmed; insulin adjusted from IDF-DAR starting frameworks guided by glucose data, with specialist input where complex; SGLT2 inhibitor by individual risk–benefit decision with the diabetes team. Written drug plan for every patient."},
    {title:"Educate, document, and review after Ramadan", html:"Late suhoor with slow-release carbohydrate, hydration between iftar and suhoor, moderate exercise avoiding the pre-iftar window. Record the risk category, the plan and the advice given — particularly if the patient fasts against advice — then revert the doses and timings afterwards, checking that reduced insulin or altered timing has not been continued accidentally."}
  ],
  sections:[

    {id:"safety", nav:"Break the fast", title:"The agreed break-the-fast rules (IDF-DAR), and the risks being balanced",
     sub:"Every fasting patient must leave the consultation able to state these without prompting.",
     blocks:[
       {b:"table", head:["Trigger","Action","Why"], rows:[
         ["<b>Blood glucose below 3.9 mmol/L</b>","Break the fast immediately, treat the hypoglycaemia, and do not resume that day","Impending hypoglycaemia. <b>Mid-to-late afternoon is the highest-risk window</b> — the longest interval since suhoor"],
         ["<b>Blood glucose above 16.7 mmol/L</b>","<b>Break the fast</b>; recheck glucose; assess hydration and ketones if unwell or taking an SGLT2 inhibitor; seek same-day advice if persistent or associated with symptoms. Not every isolated high reading requires 999","Significant hyperglycaemia; risks dehydration and progression to DKA or HHS over a long fast"],
         ["<b>Any hypoglycaemic symptoms — sweating, tremor, palpitations, confusion</b>","<b>Break the fast even if no meter is available</b>","<b>Do not require a reading before acting</b> — this is the rule patients most often get wrong, waiting to confirm rather than treating"],
         ["<b>Any acute illness developing while fasting</b>","Break the fast, apply the <a href='sick-day-rules.html'>sick day rules</a>, resume when health is back to normal","Intercurrent illness plus fasting plus dehydration is the combination that produces admissions"],
         ["<b>Vomiting, abdominal pain, dehydration, drowsiness, confusion, deep/rapid breathing, significant hyperglycaemia or ketonaemia</b>","<b>Suspect DKA or HHS — arrange immediate hospital assessment. 999 if confused, collapsed, severely dehydrated, unable to travel safely or clinically unstable</b>","An alert, stable patient with moderate hyperglycaemia and no ketones may need urgent same-day diabetes advice rather than an ambulance. On an SGLT2 inhibitor, glucose may be normal or only mildly raised — symptoms and blood ketones matter more than the glucose value"],
         ["<b>Long summer fast (10–21 hours in the UK), poor fluid intake</b>","<b>Prioritise water and sugar-free fluids between iftar and suhoor; avoid excessive caffeine and sweetened drinks.</b> Heart failure, advanced CKD or dialysis need individual fluid advice","<b>Dehydration risks AKI and thrombosis</b>, and compounds every other risk on this list"]
       ]},
       {b:"info", html:"<b>IDF-DAR and BIMA education materials advise that finger-prick glucose testing does not invalidate the fast</b>; confirm the patient's own religious understanding where needed and offer a trusted scholar or community resource. Vaccination follows the current NHS programme — signpost to a scholar or BIMA resource if the patient is concerned about the fast. The five fasting risks to name are hypoglycaemia, hyperglycaemia, dehydration with thrombosis and AKI, DKA including euglycaemic DKA, and HHS."},
       {b:"say", html:"Before we talk about your tablets, I want to agree four rules with you, and I would like you to be able to tell them back to me. Break your fast straight away if your sugar goes below 3.9 or above 16.7. Break it if you feel shaky, sweaty or confused — even if you cannot get to your meter, because waiting to check is what gets people into trouble. And break it if you are vomiting, cannot keep fluids up, or become unwell with anything else. One more thing, because a lot of people worry about it: the international diabetes and Ramadan guidance and the British Islamic Medical Association advise that testing your blood sugar does not break your fast — if you are unsure, it is worth checking with a scholar you trust. So please test as often as you need to — that is what keeps this safe."}
     ]},

    {id:"risk", nav:"Risk tiers", title:"Risk stratification — very high, high, moderate/low",
     sub:"The IDF-DAR/BIMA three tiers are a framework, not fixed diagnoses: use the risk tool, then review the classification clinically. Stratify before adjusting anything.",
     blocks:[
       {b:"table", head:["Category","Who","Advice"], rows:[
         ["<b>Category 1 — very high risk</b>","Type 1 diabetes — generally, particularly on multiple daily injections or pump therapy · DKA, HHS or severe/disabling hypoglycaemia in the last 3 months · hypoglycaemia unawareness · advanced macrovascular disease · CKD stage 4–5 · insulin-treated T2DM WITHOUT safe-fasting experience · pregnancy in pre-existing diabetes, or insulin- or sulfonylurea-treated gestational diabetes · acute illness · the frail elderly","<b>Strongly advise against fasting.</b> Explain the medical reasons, the religious exemption and alternatives, and offer discussion with a trusted scholar. If the patient chooses to fast, do not abandon care: document the decision; specialist involvement, structured education, intensive SMBG/CGM (and ketone monitoring in type 1), and explicit break-fast rules"],
         ["<b>Category 2 — high risk</b>","T2DM with sustained poor control (HbA1c above 75 mmol/mol for over 12 months) · insulin-treated T2DM WITH safe-fasting experience · T2DM on an SGLT2 inhibitor · stable macrovascular disease · CKD stage 3 · metformin- or diet-controlled gestational diabetes","<b>Advise against fasting — individualise carefully.</b> If the patient proceeds: education, SMBG and dose adjustment are mandatory, not optional"],
         ["<b>Category 3 — moderate / low risk</b>","Well-controlled T2DM on diet and lifestyle alone, metformin, a DPP-4 inhibitor, a GLP-1 receptor agonist, pioglitazone or acarbose. A second-generation sulfonylurea or basal insulin sits at the moderate end and needs regular SMBG","<b>May fast — the decision is the patient's.</b> Adjust medication and give the education and safety-net"]
       ]},
       {b:"dl", rows:[
         ["<b>Type 1 diabetes</b>","People with type 1 diabetes should generally be advised not to fast. If an individual chooses to fast despite advice, this should be managed by the diabetes specialist team with CGM/SMBG, ketone monitoring, detailed insulin adjustment and explicit break-fast rules. Do not give type 1 or complex insulin-adjustment advice from this page"],
         ["<b>What to weigh</b>","Type of diabetes · glycaemic control · hypoglycaemia frequency and awareness · previous fasting experience · treatment regimen and insulin complexity · renal function · cardiovascular disease · frailty · pregnancy/breastfeeding · occupation and ability to monitor · climate and expected fast duration · hydration restrictions · ability to access help. Treatment with insulin or an SGLT2 inhibitor should prompt at least a cautious/high-risk assessment, not an automatic category. Previous safe fasting is useful history, but does not automatically downgrade risk with new CKD, medication changes or previous dizziness/hypoglycaemia"],
         ["<b>The trial fast</b>","A supervised trial fast may be considered for selected lower-risk people after risk assessment, education and a written monitoring plan; review the glucose readings. Do not arrange a trial fast for people with type 1 diabetes, recent DKA/HHS, recurrent severe hypoglycaemia, hypoglycaemia unawareness, pregnancy, advanced CKD or unstable complications without specialist agreement"],
         ["<b>If uncertain</b>","<b>A risk calculator is available in IDF-DAR chapter 5.</b> Use it rather than guessing at the boundary between categories 2 and 3"],
         ["<b>Document</b>","Record the risk category, the advice given, and — if the patient chooses to fast despite being category 1 or 2 — that this was discussed and the safety-net given. This protects the patient more than it protects you: it is what the next clinician reads"]
       ]},
       {b:"why", html:"The three-tier stratification exists because \"don't fast\" is advice most patients will not take. Roughly 116 million people with diabetes fast worldwide, and the majority fast despite being advised otherwise — so a consultation framed around permission fails, while one framed around risk minimisation succeeds. <b>Doing it 6–8 weeks ahead is what makes the category actionable:</b> a category 2 patient on glibenclamide can be switched to gliclazide, given a meter, trained, and trialled — all before the month starts. The same conversation in the first week of Ramadan can only remove treatment, not improve it."}
     ]},

    {id:"oral", nav:"Oral agents", title:"Oral medication — retiming drug by drug",
     sub:"The bigger dose moves to iftar. The suhoor dose is the one that causes harm.",
     blocks:[
       {b:"table", head:["Drug","Adjustment","Notes"], rows:[
         ["<b>Metformin — total dose usually unchanged</b>","Usually maintain the total daily dose, redistributing doses to iftar and suhoor according to the formulation and meal pattern (e.g. once daily → iftar; twice daily → iftar and suhoor). Do not combine doses in a way that creates an excessive single dose or worsens GI symptoms. Modified-release → follow the product information and local diabetes advice","Minimal hypoglycaemia risk, so usually only the timing changes"],
         ["<b>Sulfonylurea — the main oral hypoglycaemia culprit</b>","Avoid glibenclamide where possible. If a sulfonylurea is continued, gliclazide is generally preferred over glimepiride; adjust the dose and timing according to the patient's glucose profile, usually favouring the iftar dose and reducing the suhoor dose. Any dose reduction is individualised","Glibenclamide is specifically avoided: its long action and high hypoglycaemia rate make it the worst sulfonylurea for fasting. The suhoor dose acts through the entire daytime fast with no food behind it"],
         ["<b>Sulfonylurea combination tablets</b>","Check carefully for hidden sulfonylurea content. Usually take at iftar, with the suhoor/morning sulfonylurea component reduced or omitted — individualise to the glucose profile, with diabetes-team advice if unsure","Easy to miss, because the sulfonylurea is hidden inside a combination product — check the constituents of every fixed-dose combination"],
         ["<b>SGLT2 inhibitors</b>","<b>Individual risk–benefit decision before Ramadan</b> — do not advise routine continuation simply by moving the dose to iftar. Discuss temporary withholding or an alternative plan with the diabetes team (weigh heart-failure and renal benefits), particularly with previous DKA, recurrent dehydration, acute illness, poor oral intake, CKD, frailty or significant diuretic therapy. If continued: explicit sick-day rules, hydration advice, ketone/DKA safety-netting and a clear stop/restart plan","Fasting/starvation and dehydration are DKA risk factors (GMMMG). <b>Sick-day rules:</b> stop the SGLT2 inhibitor during vomiting, diarrhoea, dehydration, reduced oral intake, acute serious illness or suspected DKA; seek urgent advice for nausea, vomiting, abdominal pain, unusual fatigue, rapid/deep breathing or confusion; do not rely on glucose alone to exclude DKA — use blood ketones where available; restart only when eating and drinking normally and clinically recovered, per local protocol"],
         ["<b>DPP-4 inhibitors — sitagliptin, linagliptin, alogliptin</b>","<b>Usually no dose modification — check the dose against renal function</b>","Low hypoglycaemia risk; generally lower-risk options for a fasting patient. Check the dose against renal function — some agents need renal adjustment"],
         ["<b>GLP-1 receptor agonists</b>","Do not start immediately before or during Ramadan if significant nausea/vomiting is likely; consider delaying dose escalation; reduce or review concomitant insulin or sulfonylurea because of hypoglycaemia risk; ensure adequate hydration; reassess if vomiting or poor intake develops. Oral semaglutide must be taken according to the product instructions — with water and an appropriate interval before food, drink or other medicines","The oral semaglutide administration rule may be practically difficult at iftar — discuss timing specifically"],
         ["<b>Pioglitazone</b>","<b>Usually no dose modification — iftar or suhoor</b>","Low hypoglycaemia risk, but fluid retention and heart-failure risk remain relevant — not automatically suitable for every fasting patient"],
         ["<b>Glinides (prandial glucose regulators) — e.g. repaglinide</b>","Three-times-daily dosing is reduced and redistributed to two doses, taken with iftar and suhoor","Meal-linked by design, so it follows the meals rather than the clock"],
         ["<b>Acarbose</b>","<b>Take with meals (iftar/suhoor); generally no specific change</b>","Low hypoglycaemia risk"]
       ]},
       {b:"why", html:"The whole scheme follows from one physiological fact: the pre-dawn dose has a 10–21 hour fast behind it and the evening dose has a meal. So agents that cause hypoglycaemia are trimmed or removed at suhoor and largely preserved at iftar, while agents with low hypoglycaemia risk — DPP-4 inhibitors, GLP-1 receptor agonists, pioglitazone, acarbose — usually need little change, though each has its own cautions (renal dosing, nausea and co-prescribed insulin/sulfonylurea, fluid retention). That is also why the pre-Ramadan switch matters more than the retiming: moving a patient off glibenclamide onto gliclazide removes more risk than any amount of dose juggling."}
     ]},

    {id:"insulin", nav:"Insulin", title:"Insulin-treated type 2 diabetes",
     sub:"Insulin treatment should prompt at least a cautious/high-risk assessment, reviewed clinically. The adjustments below are IDF-DAR starting frameworks, not fixed prescriptions — individualise to insulin type, dosing time, pre-Ramadan glucose patterns, meal carbohydrate, CGM/SMBG data, renal function, prior hypoglycaemia and fast duration.",
     blocks:[
       {b:"table", head:["Regimen","Adjustment","Notes"], rows:[
         ["<b>Basal insulin</b>","<b>Usually given at iftar; a reduction may be appropriate (IDF-DAR starting framework about 15–20% if control is good), guided by glucose data</b>","Needs regular SMBG. The reduction protects against daytime hypoglycaemia"],
         ["<b>Basal–bolus</b>","Keep the basal (adjusted as above); prandial insulin follows the meals actually eaten — with iftar and a smaller dose with suhoor; no daytime (lunch) bolus. Give clear instructions for correction doses and ketone assessment","<b>There is no daytime meal, so there is no daytime bolus</b> — stated plainly, because patients on fixed regimens often continue it. Complex basal–bolus treatment needs a specialist plan"],
         ["<b>Premixed / biphasic insulin</b>","Twice daily: take the usual MORNING dose at iftar, and REDUCE the usual evening dose by 25–50% and take it at suhoor (IDF-DAR). Once daily: take the usual dose at iftar","Requires particular caution: the fixed ratio may not match iftar/suhoor carbohydrate intake. IDF-DAR starting guidance — individualise, usually with diabetes-team input"],
         ["<b>Monitoring</b>","Intensify SMBG, including mid-afternoon — the highest-risk time. Break the fast if BG is below 3.9 mmol/L","Check pre-dawn at suhoor, morning, midday, mid-afternoon, pre-sunset at iftar, 2 hours after iftar, and any time symptomatic or unwell"],
         ["<b>Who needs specialist input before Ramadan</b>","Type 1 diabetes · complex basal–bolus treatment · no prior safe-fasting experience · brittle control · recurrent or disabling hypoglycaemia · poor hypoglycaemia awareness · advanced complications · CKD 4–5 still wishing to fast","<b>Detailed insulin titration in fasting is specialist territory.</b> This page is a primary-care framework — refer early, not mid-month"]
       ]},
       {b:"warn", html:"Insulin is the highest-hypoglycaemia-risk therapy during fasting. Insulin adjustments are starting frameworks, not fixed prescriptions. Any person with type 1 diabetes, complex basal–bolus treatment, recurrent hypoglycaemia, poor awareness, CKD 4–5 or no previous safe fasting experience should have a specialist diabetes plan before Ramadan — and that referral has to be made weeks ahead."}
     ]},

    {id:"lifestyle", nav:"Diet &amp; activity", title:"Diet, hydration and exercise",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"🌅 Eat suhoor as late as possible", html:"A late pre-dawn meal shortens the effective daytime fast and flattens the glucose swings that make fasting risky. This is the single most useful piece of dietary advice."},
         {tone:"blue", h:"🌾 Choose slow-release carbohydrate", html:"High-fibre starchy foods that release energy slowly — chapatis, rice, oat cereals, grains, seeds, beans and pulses — at suhoor rather than refined carbohydrate."},
         {tone:"amber", h:"💧 Hydration between iftar and suhoor", html:"Prioritise water and sugar-free fluids between iftar and suhoor, and avoid excessive caffeine and sweetened drinks — unless fluid restriction is clinically indicated: heart failure, advanced CKD or dialysis need individual fluid advice. <b>UK fasts run 10–21 hours; dehydration drives AKI and thrombosis risk.</b>"},
         {tone:"amber", h:"🍩 Fried and sugary foods, and dates", html:"<b>Limit fried items — pakoras, samosas — and sugary foods at iftar.</b> Discuss portion size and carbohydrate content of dates, sweet drinks and traditional foods, and incorporate them into the meal plan rather than presenting them as forbidden. Carbohydrate counting and meal-matched insulin are more useful than blanket avoidance."},
         {tone:"green", h:"🥗 Fruit, vegetables and salad", html:"<b>Include fresh fruit, vegetables and salads for fibre and satiety</b> at both meals."},
         {tone:"green", h:"🚶 Light-to-moderate exercise", html:"Advisable, but avoid strenuous activity during fasting hours and especially in the period just before iftar — the peak hypoglycaemia window. The physical activity of nightly taraweeh prayers adds up: factor it into hypoglycaemia risk after iftar."}
       ]},
       {b:"say", html:"Two practical things that make the biggest difference. Eat your suhoor as late as you can — it shortens the fast your body actually experiences. And make it slow-release: chapatti, rice, oats, beans, something with fibre, rather than anything sugary. Then between sunset and dawn, drink plenty of water and sugar-free drinks, and do not overdo the coffee, tea or sweet drinks. At iftar, dates and your usual foods are fine — let us just talk about portion sizes so they fit into your plan."}
     ]},

    {id:"exempt", nav:"Exemption", title:"Exemption, alternatives and the shared decision",
     blocks:[
       {b:"cards", items:[
         {tone:"green", h:"🕌 Religious exemption", html:"Islamic guidance, as summarised by BIMA, recognises exemption for those for whom fasting is detrimental — for example the frail and elderly, children, and people with significant comorbidities; pregnancy and breastfeeding are circumstances in which many Islamic scholars provide exemption. The clinician explains the medical risk; the religious decision is the patient's, and a trusted scholar can help if the patient wishes."},
         {tone:"blue", h:"🕌 The religious test for breaking a fast", html:"As described by BIMA: break or abstain if the illness is worsened by fasting, if recovery is delayed by fasting, or if there is substantial fear of either — judged by prior experience, common knowledge, or a clinician's advice. This is the religiously grounded counterpart to the medical risk stratification, and quoting it is what makes the advice land."},
         {tone:"green", h:"✓ The alternatives are concrete", html:"Non-consecutive fasts · fasting in the winter months when the fasts are much shorter · feeding others · fidyah, a charitable donation (the amount is set locally — a scholar or community resource can advise). Explain these respectfully and offer a trusted scholar if the patient wishes, because many patients assume there are no alternatives and fast unsafely rather than ask."},
         {tone:"blue", h:"🤝 Community and cultural working", html:"Work with local religious scholars and community leaders; offer group education and Ramadan-specific materials where the fasting population is large. This is evidence-based — it improves reach and trust, and embeds the safety messages where patients actually hear them."},
         {tone:"amber", h:"⚠ Pregnancy", html:"Pregnancy and breastfeeding are circumstances in which many Islamic scholars provide exemption from fasting. Pregnant people with pre-existing diabetes or gestational diabetes should be advised to discuss fasting with their obstetric and diabetes teams. Insulin-treated or sulfonylurea-treated gestational diabetes is particularly high risk."},
         {tone:"cream", h:"📋 Document the shared decision", html:"Record the risk category, the medication plan, the advice given, and the review arrangements. Particularly where a category 1 or 2 patient chooses to fast anyway — do not abandon care: document the decision and provide harm-reduction education, monitoring and specialist support. That is precisely the record the next clinician needs."}
       ]}
     ]},

    {id:"monitor", nav:"Follow up", title:"Review and safety-netting",
     blocks:[
       {b:"table", head:["When","What to do"], rows:[
         ["<b>6–8 weeks before Ramadan</b>","Assess type of diabetes, HbA1c and recent glucose profile, hypoglycaemia frequency and awareness, previous fasting experience, medications, renal and cardiovascular complications, pregnancy/breastfeeding, occupation and ability to monitor, expected fast duration and hydration restrictions. Provide: risk category · written drug plan · meter/CGM education · break-fast thresholds · sick-day rules · ketone advice where appropriate · nutrition and hydration advice · switch any high-hypoglycaemia-risk agent · start any planned new agent now, not later · trial fast only for selected lower-risk people · diabetes specialist referral if type 1, insulin complexity, SGLT2 risk or complications"],
         ["<b>During Ramadan</b>","Review category 1 and 2 patients who are fasting — by telephone, virtually or face to face — with SGLT2-inhibitor and insulin patients reviewed earlier. Review SMBG/CGM records; assess hypoglycaemia, dehydration, vomiting and adherence, and whether the break-fast rules have been needed; ensure the patient knows how to access same-day diabetes advice. Complex insulin titration needs diabetes-team access"],
         ["<b>After Ramadan</b>","Revert medication timings and doses to the usual regimen — this step is routinely forgotten and leaves patients on a reduced basal or an iftar-timed schedule for months. Check that reduced insulin or altered timing has not been continued accidentally; review hypoglycaemia, hyperglycaemia and dehydration episodes; reassess HbA1c at the appropriate time; and review the next Ramadan plan in people who had difficulty fasting"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 Urgent help", html:"\"Vomiting, tummy pain, drowsiness, confusion, deep fast breathing, high ketones or very high sugar — break the fast and get seen in hospital straight away; call 999 if you are confused, collapsed or very unwell. Do not wait for sunset.\""},
         {tone:"amber", h:"🟠 Break the fast and check", html:"\"Below 3.9 or above 16.7, or any shakiness, sweating or confusion — break the fast and check your sugar. If you cannot check, break it anyway.\""},
         {tone:"blue", h:"💊 Testing is encouraged", html:"\"The diabetes and Ramadan guidance and BIMA advise that testing your blood sugar does not break your fast — check with a scholar you trust if you are unsure. Test as often as you need.\""},
         {tone:"green", h:"🔁 After the month", html:"\"Come back after Ramadan so we can put your doses and timings back to normal — otherwise you stay on the fasting plan all year.\""}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Emergency — immediate hospital assessment / 999", html:"Suspected DKA (including euglycaemic DKA on an SGLT2 inhibitor) or HHS: vomiting, abdominal pain, dehydration, drowsiness, confusion, deep/rapid breathing, significant hyperglycaemia or ketonaemia. 999 if confused, collapsed, severely dehydrated, unable to travel safely or clinically unstable."},
         {tone:"amber", h:"Diabetes specialist team — before Ramadan", html:"Type 1 diabetes · complex insulin regimens or insulin-treated T2DM without safe-fasting experience · SGLT2-inhibitor risk–benefit decisions · recurrent or disabling hypoglycaemia or poor awareness · advanced complications · CKD 4–5 in someone who still wishes to fast. <b>Refer 6–8 weeks ahead, not mid-month.</b>"},
         {tone:"amber", h:"Obstetric / diabetes care", html:"Pre-existing diabetes in pregnancy, or insulin- or sulfonylurea-treated gestational diabetes, in a woman intending to fast."},
         {tone:"blue", h:"Structured education", html:"Pre-Ramadan group education where available, plus SMBG training and a meter. Ramadan-specific materials in the relevant community languages."},
         {tone:"cream", h:"GP management", html:"Primary care leads the risk category, the break-fast rules, simple oral-drug retiming, the diet and hydration advice, the documentation and the post-Ramadan reversion — with diabetes-team access for insulin, SGLT2 and type 1 decisions, in line with the local Greater Manchester diabetes pathway. Related pages: <a href='type-2-diabetes.html'>type 2 diabetes</a> · <a href='sick-day-rules.html'>sick day rules</a> · <a href='dka.html'>DKA</a> · <a href='diabetes-unwell-insulin.html'>feeling unwell on insulin</a>."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 54-year-old man with T2DM attends three weeks before Ramadan intending to fast. He takes <b>metformin 1 g TDS, gliclazide 80 mg BD and dapagliflozin 10 mg</b>. HbA1c is 62 mmol/mol, eGFR 58. He fasted last year \"and felt dizzy some afternoons but got through it\". He asks whether he can fast, and says he has been told <b>testing his blood sugar would break the fast</b> so he did not check at all last year."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"<b>Corrects the testing misconception early and explicitly</b> — it is the reason last year was unsafe; <b>recognises the dizzy afternoons as probable hypoglycaemia</b> rather than accepting \"got through it\"; stratifies risk clinically and names the category — the SGLT2 inhibitor, CKD and probable previous hypoglycaemia prompt at least a high-risk assessment; discusses dapagliflozin with the diabetes team, considering withholding during Ramadan only after a cardiorenal and metabolic review, with a documented stop/restart plan and sick-day rules; retimes metformin correctly (suhoor dose, then afternoon + evening combined at iftar) without changing the total; <b>reduces or omits the suhoor gliclazide dose</b> and explains why the pre-dawn dose is the dangerous one; <b>agrees the four break-fast rules and checks them back</b>; <b>arranges a meter and SMBG training, and offers a trial fast</b> — possible only because he came three weeks early; gives <b>hydration and late-suhoor advice</b>; <b>avoids non-urgent new agents during the fast</b>; frames it as a shared decision, mentions exemption and alternatives respectfully, offering a trusted scholar if wished; and <b>documents the category, plan and advice</b>."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>IDF-DAR (2021) — Diabetes and Ramadan: Practical Guidelines (international)</b> (Hassanein M et al., <i>Diabetes Res Clin Pract</i> 2022)<br><a href="https://idf.org/news-and-resources/resources/diabetes-and-ramadan-practical-guidelines-2021/" rel="noopener">idf.org — diabetes and Ramadan</a><span class="rd"> — the three-tier risk categories, the break-the-fast thresholds of 3.9 and 16.7 mmol/L, the drug-by-drug retiming to iftar and suhoor, the insulin adjustments (including the twice-daily premix switch: morning dose at iftar, evening dose reduced by 25–50% at suhoor), and the risk calculator in chapter 5</span></li>'+
         '<li>British Islamic Medical Association (2020) — Ramadan Rapid Review risk table<br><a href="https://britishima.org" rel="noopener">britishima.org</a><span class="rd"> — the UK-adapted risk stratification, the exemption framework, and the religious test for breaking a fast (illness worsened, recovery delayed, or substantial fear of either)</span></li>'+
         '<li><b>Gilani A (2023) — How to manage diabetes in Ramadan.</b> <i>Diabetes &amp; Primary Care</i> 25: 27–9<span class="rd"> — the primary-care framework, the 6–8 week pre-Ramadan assessment window, and the SGLT2-inhibitor caution (an individual risk–benefit decision with the diabetes team)</span></li>'+
         '<li><b>Hassanein M et al (2017)</b> <i>Diabetes Res Clin Pract</i> 126: 303–16 (international)<span class="rd"> — the IDF-DAR evidence base for risk categorisation and medication adjustment</span></li>'+
         '<li><b>NICE NG28 — Type 2 diabetes in adults: management (2015, updated February 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng28" rel="noopener">nice.org.uk/guidance/ng28</a><span class="rd"> — the underlying drug choices and the sulfonylurea hypoglycaemia caution</span></li>'+
         '<li><b>MHRA Drug Safety Update — SGLT2 inhibitors: updated advice on the risk of DKA (April 2016); monitor ketones in blood during treatment interruption for surgical procedures or acute serious medical illness (March 2020)</b><br><a href="https://www.gov.uk/drug-safety-update/sglt2-inhibitors-monitor-ketones-in-blood-during-treatment-interruption-for-surgical-procedures-or-acute-serious-medical-illness" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> — SGLT2 inhibitors and the risk of diabetic ketoacidosis with near-normal blood glucose; interrupt during acute serious illness and monitor blood ketones</span></li>'+
         '<li><b>Greater Manchester Medicines Management Group — Guidelines for safe prescribing of SGLT2 inhibitors in type 2 diabetes</b><span class="rd"> — fasting/starvation, dehydration and acute illness as DKA risk factors, and detailed sick-day education</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Type 2 diabetes in Ramadan — IDF-DAR (2021, international), BIMA Ramadan Rapid Review, Gilani (2023) and NICE NG28 (updated February 2026). Assess 6–8 weeks before Ramadan, not during it, and avoid non-urgent new antidiabetic agents or major changes mid-month. IDF-DAR: break the fast if blood glucose is below 3.9 or above 16.7 mmol/L, for any hypoglycaemic symptoms even without a meter, or for acute illness, vomiting, suspected ketosis or inability to stay hydrated. Move the bigger dose to iftar and trim the suhoor dose; metformin's total is usually unchanged; avoid glibenclamide; insulin adjustments are starting frameworks with specialist input; SGLT2 inhibitors need an individual risk–benefit decision with the diabetes team. IDF-DAR and BIMA advise that testing blood glucose does not invalidate the fast. Revert doses and timings after Ramadan. Verify all doses against the BNF before prescribing."
});
