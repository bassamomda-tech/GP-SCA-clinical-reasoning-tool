<script>
MG.render({
  icon:"🔬",
  title:"Balanitis",
  eyebrow:"Protocol · people aged 16 years and over · assessment and management",
  reviewed:"24 September 2026",
  nextReview:"24 September 2027",
  stemTitle:"Balanitis \u2014 a description, not a diagnosis: find the cause, treat that, and refer what persists",
  stemSub:"Primary-care management of balanitis and balanoposthitis in <b>people aged 16 years and over</b>; use a separate paediatric/adolescent pathway where appropriate. Balanitis has many causes: irritant or contact dermatitis and dermatoses are common, and <b>Candida is one possible cause</b>, but a positive Candida swab may represent secondary colonisation or superinfection of an underlying irritant dermatitis or dermatosis. Do not assume that all red or sore balanitis is candidal. Hygiene and irritant avoidance for everyone, cause-directed treatment, and a low threshold for STI assessment, biopsy or referral when a lesion persists.",
  guideline:"BASHH National Guideline on the Management of Balanoposthitis, 2025 (current web version 5, March 2026) \u00b7 NICE NG12 recommendations 1.6.9 and 1.6.10 \u00b7 Greater Manchester formulary and self-care policy \u00b7 local antimicrobial and sexual-health advice",
  foot:"Balanitis in people aged 16 years and over. Irritant dermatitis and dermatoses are common; Candida is one possible cause and may be secondary to an underlying dermatosis. Interpret swab results cautiously. Do not forcibly retract a non-retractile foreskin, and treat paraphimosis as an emergency. Consider a suspected penile cancer pathway referral per NICE NG12 recommendations 1.6.9 and 1.6.10, in parallel with STI assessment when a lesion is clinically suspicious. Miconazole interacts with warfarin; trimethoprim and co-trimoxazole interact with methotrexate. Sources: BASHH National Guideline on the Management of Balanoposthitis, 2025 (current web version 5, March 2026), NICE NG12, the Greater Manchester formulary and self-care policy, and local antimicrobial and sexual-health advice.",
  glance:[
    {lbl:"Commonest", val:"Irritant / dermatosis", sub:"do not assume Candida"},
    {lbl:"All patients", val:"Hygiene + emollient", sub:"soap substitute; avoid irritants"},
    {lbl:"Candidal", val:"Clotrimazole 1% BD", sub:"7\u201314 days \u00b1 short hydrocortisone"},
    {lbl:"Bacterial", val:"By clinical syndrome", sub:"BASHH; sexual-health or microbiology advice"},
    {lbl:"Check", val:"Glucose / HbA1c", sub:"severe, persistent or recurrent"},
    {lbl:"Emergency", val:"Paraphimosis", sub:"same-day urology"}
  ],
  flow:[
    {t:"node", d:"found", n:"1", tag:"Foundation", title:"Assess and find the cause",
      blocks:[
        {b:"kv", rows:[
          ["Causes","Irritant or allergic dermatitis (soaps, over-washing as well as poor hygiene) \u00b7 candidal \u00b7 anaerobic or aerobic bacterial \u00b7 HSV, syphilis and other STIs \u00b7 lichen sclerosus \u00b7 lichen planus \u00b7 psoriasis \u00b7 Zoon\u2019s balanitis \u00b7 fixed drug eruption \u00b7 circinate balanitis (reactive arthritis) \u00b7 penile intraepithelial neoplasia \u00b7 penile cancer"],
          ["Examine","Glans, foreskin and whole shaft \u00b7 erythema, erosions, ulcers, papules, plaques, discharge, scarring \u00b7 foreskin retractability and phimosis \u00b7 meatus and urinary stream \u00b7 inguinal nodes. <b>Do not forcibly retract a non-retractile foreskin</b>; replace a retracted foreskin before the patient leaves. <b>If a retracted foreskin cannot be returned over the glans, this is paraphimosis and requires same-day emergency urological assessment.</b> For a persistent lesion, document its exact site, size, morphology, duration and the inguinal nodes"],
          ["History","Sexual history, new partners and STI risk \u00b7 diabetes, immunosuppression \u00b7 recent antibiotics \u00b7 products used on the area \u00b7 current medicines, especially warfarin and methotrexate"],
          ["Tests","Sub-preputial swab if infection is suspected, symptoms are severe or persistent, there is discharge, or treatment has failed \u2014 <b>growth of Candida or bacteria does not prove the cause</b>. Balanitis alone is not necessarily an STI, but STI assessment is indicated with ulcers, vesicles, urethral discharge, new partners, sexual exposure risk or a compatible syndrome. <b>HSV:</b> NAAT swab from a fresh ulcer or vesicle where possible — a negative result from an older or crusted lesion does not reliably exclude HSV. <b>Syphilis:</b> take appropriate serology for genital ulceration; lesion-based testing is specialist-dependent and not routine GP NAAT testing. <b>Urethritis or discharge:</b> arrange sexual-health assessment rather than managing solely as bacterial balanitis. Full STI screen as indicated; consider HIV testing in severe, persistent, atypical or recurrent disease. Urinalysis for glucose or HbA1c in severe, persistent or recurrent cases"]
        ]},
        {b:"why", html:"Clinical appearances suggest a cause but are not diagnostic, so treatment follows the most likely cause and is reassessed rather than repeated. Two things should not be missed: <strong>lichen sclerosus</strong>, which scars and carries an increased risk of penile squamous-cell carcinoma, and a <strong>persistent lesion</strong> that needs biopsy or a suspected cancer referral."}
      ]},
    {t:"node", d:"life", n:"2", tag:"Non-drug \u00b7 every patient", title:"Hygiene and irritant avoidance",
      blocks:[
        {b:"tiles", v:"life", items:[
          {t:"\ud83d\udebf Gentle hygiene", html:"Wash daily with water; retract the foreskin to clean and dry only if it retracts comfortably; avoid over-washing."},
          {t:"\ud83e\uddfc Avoid irritants", html:"Stop soaps, shower gels and perfumed products on the area; use an emollient as a soap substitute."},
          {t:"\ud83e\uddfa Dry thoroughly", html:"Dry gently after washing; loose cotton underwear to reduce moisture and friction."},
          {t:"\ud83d\udc91 Partners", html:"Candidal balanitis is not usually an STI. Assess and treat symptomatic partners if indicated; asymptomatic partners do not routinely need treatment. Suspected STI \u2192 sexual-health pathway with partner notification."},
          {t:"\u26a0\ufe0f Condoms", html:"Creams and emollients can weaken latex condoms \u2014 counsel on this."}
        ]}
      ]},
    {t:"node", d:"drug", n:"3", tag:"Medication \u00b7 by cause", title:"Cause-directed treatment",
      blocks:[
        {b:"ladder", steps:[
          {step:"All", title:"Hygiene + irritant avoidance", when:"foundation",
           html:"Suspected uncomplicated irritant dermatitis: stop irritants and use an emollient soap substitute; consider hydrocortisone 1% briefly if clinically appropriate; review if persistent or recurrent."},
          {step:"Candidal", title:"Topical antifungal", when:"suspected candidal balanoposthitis",
           fromLabel:"candidal balanitis",
           html:"<b>Clotrimazole 1% or miconazole 2% cream twice daily for 7\u201314 days.</b> Add <b>hydrocortisone 1%</b> only for marked inflammation and for a short course, usually no more than 7–14 days; reassess if not improving rather than repeatedly prescribing a steroid–antifungal combination. <b>Fluconazole 150 mg as a single oral dose</b> only for severe symptoms — check interactions, especially anticoagulants and other CYP-mediated medicines, and consider liver disease. <b>Miconazole oral or topical preparations can interact with warfarin and cause significant INR elevation — avoid or seek anticoagulation advice.</b> Check glucose/HbA1c if severe, persistent or recurrent. Avoid repeated empiric antifungal courses; seek specialist or sexual-health advice for recurrent disease. Prescribe or advise purchase in line with the current Greater Manchester formulary and self-care policy."},
          {step:"Bacterial", title:"By clinical syndrome", when:"suspected bacterial infection",
           fromLabel:"bacterial balanitis",
           html:"Assess the clinical syndrome and take a sub-preputial swab where appropriate; <b>do not treat a culture result alone</b>. Manage according to the clinical syndrome, swab results where appropriate and the current BASHH guideline; the general Greater Manchester antimicrobial guidance may not give a specific balanitis regimen. Seek sexual-health, microbiology or local antimicrobial advice for discharge, ulcers, lymphadenopathy, recurrent disease or suspected STI. Suspected <b>anaerobic</b> balanoposthitis (foul odour, discharge, erosions, oedema): <b>metronidazole 400–500 mg twice daily for 7 days</b> (BASHH); alternatives include co-amoxiclav or topical clindamycin, supported by lower-grade evidence — follow local advice. <b>Trimethoprim and co-trimoxazole interact with methotrexate</b> (serious bone-marrow toxicity) — avoid in patients taking methotrexate."},
          {step:"Dermatosis", title:"Lichen sclerosus and other dermatoses", when:"suspected dermatosis",
           fromLabel:"inflammatory dermatosis",
           html:"Suspected lichen sclerosus \u2014 porcelain-white or pale patches, scarring, progressive phimosis, fissuring, meatal narrowing \u2014 should not be treated repeatedly as infection; avoid repeated empiric antifungal treatment. Suspected lichen sclerosus should prompt dermatology or urology referral, particularly where there is scarring, phimosis, meatal disease, diagnostic uncertainty or a persistent lesion. A clinician competent in genital dermatoses may initiate an ultra-potent topical corticosteroid according to the local lichen-sclerosus protocol while arranging follow-up. Refer for lichen planus, Zoon’s balanitis, psoriasis, fixed drug eruption or diagnostic uncertainty, with biopsy through the dermatology or urology pathway as appropriate."}
        ]},
        {b:"warn", html:"<b>Do not keep re-treating empirically.</b> A lesion that persists, or looks atypical, needs STI testing, biopsy or referral. Lichen sclerosus requires long-term safety-netting for new induration, ulceration, lumps, bleeding, persistent erosions or changes in texture, because of its association with penile intraepithelial neoplasia and penile cancer. A clinically suspicious lesion should not be repeatedly treated as balanitis while waiting for a further episode."}
      ]},
    {t:"node", d:"monitor", n:"4", tag:"Monitoring", title:"Response and recurrence",
      blocks:[
        {b:"table", head:["What","When","Action"], rows:[
          ["Clearly resolving, uncomplicated irritant episode","Resolving","No routine review needed"],
          ["Not clearly improving, infection suspected and treated, or diagnosis uncertain","Within 7\u201314 days","Review: reassess cause, swab, test for STI, consider referral"],
          ["Recurrence","Any","Glucose/HbA1c, immunosuppression, STI risk, reconsider cause and irritants. Recurrent balanitis with phimosis, scarring, meatal narrowing or poor response to appropriate treatment \u2192 refer rather than repeatedly treat in primary care"],
          ["Persistent or atypical lesion","Any time","Biopsy or referral rather than further empirical cream; STI testing; consider the NICE NG12 pathway; document site, size, morphology, duration and nodes"],
          ["Phimosis, scarring, meatal or urinary symptoms","Any time","Urology"]
        ]}
      ]},
    {t:"loop", icon:"\ud83d\udd01", title:"Not resolving / recurrent? Re-check",
      arrow:"\u2026if balanitis persists or recurs",
      intro:"Reconsider the cause before prescribing again.",
      checks:[
        {b:"1 \u00b7 Right cause", html:"Irritant vs dermatosis vs candidal vs bacterial vs STI \u2014 re-examine; interpret swabs cautiously."},
        {b:"2 \u00b7 Irritants", html:"Soaps or over-washing still contributing?"},
        {b:"3 \u00b7 Glucose and immunity", html:"Glucose/HbA1c; consider immunosuppression and HIV testing where indicated."},
        {b:"4 \u00b7 STI", html:"HSV, syphilis and STI screen; sexual-health pathway if suspected."},
        {b:"5 \u00b7 Refer", html:"Suspected lichen sclerosus, dysplasia or cancer, or non-resolving \u2192 dermatology, urology or GUM."}
      ],
      back:"Cause re-checked, irritants removed, glucose and STIs tested \u2192 refer if persistent or atypical"},
    {t:"node", d:"safety", n:"5", tag:"Safety-net", title:"Safety-netting",
      blocks:[
        {b:"tiles", v:"safety", items:[
          {t:"\ud83d\udd34 Emergency", html:"\u201cIf the foreskin is pulled back and won\u2019t go forward again, you can\u2019t pass urine, or there is rapidly increasing swelling, severe pain, discolouration or you feel unwell \u2014 go to A&E the same day.\u201d"},
          {t:"\ud83d\udd34 Persistent change", html:"\u201cA sore that doesn\u2019t heal, a lump, a velvety red or scaly patch, bleeding, or a change you can\u2019t see under a tight foreskin \u2014 come back; we\u2019ll examine and may refer.\u201d"},
          {t:"\ud83d\udd52 Not improving", html:"\u201cIf it isn\u2019t clearly better within one to two weeks, or keeps coming back, book a review.\u201d"},
          {t:"\ud83e\uddfc Prevention", html:"\u201cGentle washing with water and a soap substitute usually prevents recurrence.\u201d"}
        ]}
      ]},
    {t:"node", d:"refer", n:"6", tag:"Refer", title:"When to refer",
      arrow:"persistent, atypical, or red flags",
      blocks:[
        {b:"tiles", v:"refer", items:[
          {t:"\ud83d\udd34 Same day", html:"Suspected paraphimosis \u2014 a retracted foreskin that cannot be returned over the glans: same-day emergency urology \u00b7 urinary retention \u00b7 rapidly progressive swelling \u00b7 severe pain, tissue discolouration or suspected necrotising infection \u00b7 systemic illness or spreading cellulitis. <b>Suspected Fournier\u2019s gangrene or necrotising infection: treat as a surgical emergency with immediate hospital admission and sepsis management.</b>"},
          {t:"Suspected cancer \u00b7 NICE NG12", html:"Consider a suspected penile cancer pathway referral for a penile mass or ulcerated lesion once an STI has been excluded as the cause, or a lesion persisting after appropriate STI treatment (NG12 recommendation 1.6.9), or unexplained/persistent symptoms affecting the glans or foreskin (NG12 recommendation 1.6.10). <b>If the lesion is clinically suspicious for malignancy, arrange STI assessment and urgent urology referral in parallel rather than delaying referral while awaiting test results.</b> Concerning clinical features (not separate NICE criteria): a velvety red or glazed, warty, scaly or indurated lesion, a bleeding or non-healing ulcer, unexplained inguinal nodes, or a lesion hidden by phimosis. A persistent case with a confident benign diagnosis that is improving does not automatically need the cancer pathway."},
          {t:"Urology", html:"Pathological or progressive phimosis \u00b7 recurrent balanoposthitis with scarring \u00b7 meatal stenosis or weak stream \u00b7 lichen sclerosus with structural change \u00b7 recurrent balanitis with phimosis, scarring, meatal narrowing or poor response to appropriate treatment."},
          {t:"Dermatology / GUM", html:"Diagnostic uncertainty needing biopsy \u00b7 suspected lichen sclerosus, lichen planus, Zoon\u2019s balanitis, psoriasis or fixed drug eruption \u00b7 suspected STI, urethritis or discharge \u2014 sexual-health assessment (with partner notification)."}
        ]},
        {b:"say", html:"Balanitis means inflammation of the head of the penis, and it has several causes \u2014 often irritation from soaps, and sometimes a yeast or a skin condition. Gentle washing with water and a soap substitute helps in every case, and I\u2019ll treat the most likely cause. If it isn\u2019t better in a week or two, or keeps coming back, I\u2019ll want to look again and may test or refer, rather than just giving more cream."}
      ]}
  ]
});
