<script>
MG.render({ snapshot:"summaries/bites.html",
icon:"\u{1F415}",
  title:"Animal and human bites",
  eyebrow:"Protocol · assess and manage in one place",
  stemTitle:"Bites: clean the wound, decide on antibiotics by animal, depth and site, then check tetanus, rabies and blood-borne viruses",
  stemSub:"One page for human and animal bites in primary care, following NICE NG184. Find the wounds that need same-day surgical review first: hands, face, joints, deep or crushing injuries and anything infected and spreading. Clean the wound thoroughly. Decide on antibiotic prophylaxis by who bit, whether the skin was broken and blood drawn, where the bite is and who was bitten. Then check tetanus, think rabies for bats and bites abroad, and assess blood-borne virus risk after a human bite.",
  guideline:"NICE NG184 Human and animal bites: antimicrobial prescribing (2020) · NICE CKS bites (human and animal) · UKHSA Green Book chapter 30: tetanus · UKHSA rabies post-exposure guidelines (2023; immunoglobulin interim advice 2025) · BHIVA/BASHH PEP guideline (2021) · Green Book chapter 18: hepatitis B · co-amoxiclav, doxycycline, metronidazole SPCs",
  reviewed:"15 October 2026",
  nextReview:"15 April 2027",
  meta:[
    {t:"NICE NG184 (2020) · antibiotics"},
    {t:"Green Book ch.30 · tetanus"},
    {t:"UKHSA rabies guidance · RIgS"},
    {t:"BHIVA/BASHH 2021 · PEP after human bites"},
    {t:"v1.0 · reviewed Oct 2026", tone:"ok"}
  ],
  lead:"<div class='mg-layers'><a href='#redflags'><b>Refer today?</b><small>hand · face · deep · sepsis</small></a><a href='#antibiotics'><b>Antibiotics</b><small>prophylaxis 3 days, treatment 5</small></a><a href='#tetanus'><b>Tetanus · rabies</b><small>Green Book · UKHSA</small></a><a href='#bbv'><b>Human bites</b><small>hepatitis B, C and HIV</small></a></div>",
  quickSub:"The six points that change what you do today. Each one is traced to a named source under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"Hands, face, joints, deep wounds and sepsis go the same day", html:"Arrange <b>same-day</b> surgical assessment (emergency department, plastics or hand surgery as locally arranged) for: a bite over a <b>joint or tendon</b>, including a <b>closed-fist ('fight bite') injury</b> over the knuckles; <b>facial</b> wounds that may need closure; deep, crushing or puncture wounds needing exploration or debridement; suspected fracture or foreign body (tooth); and spreading infection or a <b>systemically unwell</b> patient. Sepsis features → <b>999</b>."},
    {tone:"cream", h:"Clean thoroughly; usually leave open", html:"Irrigate with plenty of warm running tap water or saline, remove debris, and do not close primarily unless specialist advice says so (facial wounds are often closed after specialist assessment). Do not send a swab from an uninfected wound. Elevate and immobilise a bitten hand."},
    {tone:"cream", h:"Prophylaxis depends on who bit, blood and site", html:"<b>Skin not broken</b>: no antibiotics. <b>Human bite</b>: <b>offer</b> if skin broken and blood drawn; <b>consider</b> when no blood was drawn but the bite is in a high-risk area or the person is at risk. <b>Cat bite</b>: <b>offer</b> if skin broken and blood drawn; <b>consider</b> if the wound could be deep. <b>Dog or other pet</b>: <b>offer</b> if blood drawn and it penetrates bone, joint, tendon or vessels, is in a high-risk area or the person is at risk; <b>consider</b> if deep tissue damage or visible contamination."},
    {tone:"amber", h:"Co-amoxiclav: 3 days prophylaxis, 5 days treatment", html:"First choice for adults: <b>co-amoxiclav 250/125 mg or 500/125 mg three times daily</b>. <b>Penicillin allergy</b>: <b>doxycycline plus metronidazole</b> (adults and young people 12 and over); <b>co-trimoxazole (off-label) for children under 12</b>; seek specialist advice in pregnancy with penicillin allergy. Prophylaxis <b>3 days</b>; treatment of an infected bite <b>5 days</b>, reviewed."},
    {tone:"amber", h:"Tetanus and rabies are separate checks", html:"<b>Tetanus</b>: bites can be tetanus-prone; give a booster and, for high-risk wounds, human tetanus immunoglobulin according to immunisation status (Green Book chapter 30). <b>Rabies</b>: any <b>bat</b> contact in the UK, or a mammal bite or scratch abroad in a rabies-risk country, needs a <b>same-day</b> risk assessment with the local health protection team or the UKHSA Rabies and Immunoglobulin Service."},
    {tone:"blue", h:"Human bites: think hepatitis B, C and HIV", html:"If the skin was broken and blood drawn, assess the source's risk. Check the bitten person's hepatitis B immunity and give accelerated <b>hepatitis B vaccination</b> (with immunoglobulin if the source is known positive) as Green Book chapter 18 advises; baseline and follow-up testing for hepatitis C and HIV. <b>HIV PEP is rarely indicated</b> after a bite, but any decision must be made within 72 hours, so discuss the same day."}
  ],
  pathwaySub:"The consultation in five moves. Step one sets where the patient is treated.",
  pathway:[
    {title:"Screen for same-day referral", html:"Sepsis, hand or joint involvement, fight bite, facial wound needing closure, deep or crushing injury, fracture or foreign body, spreading infection. Consider safeguarding if a child or vulnerable adult was bitten."},
    {title:"Clean and document", html:"Irrigate thoroughly, debride superficially, leave open, elevate. Record animal or human, time, site, depth, whether blood was drawn, and the bitten person's risk factors."},
    {title:"Decide on antibiotics", html:"Use the NG184 table: prophylaxis for 3 days or treatment for 5 days. Co-amoxiclav first; doxycycline with metronidazole, or co-trimoxazole in children under 12, if penicillin-allergic."},
    {title:"Tetanus, rabies, viruses", html:"Check tetanus immunisation and wound risk. Bat or foreign animal exposure → rabies risk assessment today. Human bite with blood → hepatitis B, C and HIV assessment."},
    {title:"Safety-net and review", html:"Review if symptoms worsen rapidly or there is no improvement within 24–48 hours of starting antibiotics. Give written advice on the signs of infection."}
  ],
  sections:[
    {id:"redflags", nav:"Red flags", title:"Red flags: bites that need same-day hospital care", sub:"Most bites are minor. These are not.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Sepsis or rapidly spreading infection", html:"Fever, rigors, hypotension, confusion, tachycardia, or cellulitis spreading quickly from the bite (<i>Pasteurella</i> infection after cat and dog bites can progress within hours) → <b>999</b> or <b>same-day</b> admission depending on severity. Asplenia raises the risk of overwhelming <i>Capnocytophaga</i> sepsis after dog bites.", src:"NICE NG184 (2020)"},
         {tone:"red", h:"🔴 Hand and joint injuries, including the fight bite", html:"A small wound over a knuckle after punching a mouth can seed the joint or tendon sheath. Any bite involving a <b>joint, tendon</b> or the <b>hand</b> with significant depth, reduced movement, or pain on passive movement → <b>same-day</b> hand surgery or plastics assessment for exploration and washout.", src:"NICE CKS bites"},
         {tone:"red", h:"🔴 Face, deep and crushing wounds", html:"Facial bites (cosmetic outcome, possible primary closure), deep puncture or crush injuries, devitalised tissue, suspected fracture or a retained tooth → <b>same-day</b> emergency department or specialist assessment.", src:"NICE CKS bites"},
         {tone:"amber", h:"🟠 Bat contact or bite abroad", html:"Any physical contact with a bat in the UK (bites may not be seen or felt), or a mammal bite, scratch or lick on broken skin in a rabies-risk country → <b>same-day</b> rabies risk assessment.", src:"UKHSA rabies guidelines (2023)"},
         {tone:"amber", h:"🟠 Safeguarding", html:"A human bite on a child, especially an adult-sized bite mark, or a pattern of injuries in a child or vulnerable adult → follow local safeguarding procedures the same day. Dog bites to young children often happen at home; give prevention advice.", src:"NICE CKS bites"},
         {tone:"amber", h:"🟠 Wild or exotic animals", html:"Bites from wild, exotic or farm animals (including rodents and reptiles) carry unusual organisms. Seek microbiology advice on antibiotics.", src:"NICE NG184 (2020)"}
       ]},
       {b:"why", html:"Bite wounds look trivial and are often small punctures, but they inoculate mouth flora deep into tissue. Hands are the classic trap: a 5 mm knuckle wound can hide an infected joint, and the damage is permanent if surgery is delayed. Sorting these out first stops a routine antibiotic decision masking a surgical emergency."}
     ]},

    {id:"confirm", nav:"Assess", title:"Assess and clean the wound", sub:"History, examination and wound care come before the prescription.",
     blocks:[
       {b:"kv", rows:[
         ["History","Animal or human; the animal's ownership, health and vaccination status (and where in the world); time since injury; how it happened; immunisation history (tetanus, hepatitis B); comorbidities and immunosuppression."],
         ["Examine","Site, depth, whether the skin was broken and <b>blood drawn</b>, tendon, joint, nerve and vascular function, foreign bodies, and signs of infection (redness spreading, swelling, pus, lymphangitis, fever)."],
         ["High-risk areas","<b>Hands, feet, face, genitals</b>, skin overlying cartilaginous structures, and areas of poor circulation."],
         ["People at risk of serious infection","Diabetes, immunosuppression, asplenia or impaired splenic function, decompensated liver disease, and others with comorbidities that increase risk (for example a prosthetic joint or valve)."]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"🚿 Wound care", html:"Irrigate with plenty of warm tap water or saline; remove debris; superficial debridement. Leave open in most cases; facial wounds may be closed after specialist assessment. Cover with a non-adherent dressing; elevate a bitten limb.", src:"NICE CKS bites"},
         {tone:"blue", h:"🧪 Swabs and X-rays", html:"Swab only an infected wound (before antibiotics where possible). X-ray if a fracture or retained tooth is possible, including fight bites.", src:"NICE NG184 (2020)"}
       ]}
     ]},

    {id:"antibiotics", nav:"Antibiotics", title:"Antibiotics: prophylaxis and treatment (NICE NG184)", sub:"Prophylaxis for 3 days; treatment of an infected bite for 5 days. Keep the offer and consider wording.",
     blocks:[
       {b:"table", head:["Bite","Skin broken, no blood drawn","Skin broken and blood drawn"], rows:[
         ["<b>Human</b>","<b>Consider</b> if in a high-risk area or the person is at risk of serious infection","<b>Offer</b>"],
         ["<b>Cat</b>","<b>Consider</b> if the wound could be deep","<b>Offer</b>"],
         ["<b>Dog or other traditional pet</b>","Do not offer","<b>Offer</b> if it penetrates bone, joint, tendon or vascular structures, is in a high-risk area, or the person is at risk of serious infection; <b>consider</b> if it has caused considerable deep tissue damage or is visibly contaminated"],
         ["<b>Wild or exotic animal</b>","Seek specialist (microbiology) advice","Seek specialist (microbiology) advice"]
       ]},
       {b:"info", html:"Skin not broken: <b>do not offer</b> antibiotics for any bite. An infected bite: <b>offer</b> treatment, and take a swab."},
       {b:"table", head:["Group","First choice","Penicillin allergy or co-amoxiclav unsuitable"], rows:[
         ["<b>Adults</b>","<b>Co-amoxiclav</b> — <span class=mg-dose>Usual adult dose: 250/125 mg or 500/125 mg three times daily; 3 days for prophylaxis, 5 days for treatment (NICE NG184/SPC; check the SPC, BNF and local formulary; <a href='https://www.medicines.org.uk/emc/search?q=co-amoxiclav' target=_blank rel=noopener>SPC: co-amoxiclav</a>)</span>","<b>Doxycycline with metronidazole</b> — <span class=mg-dose>Usual adult dose: doxycycline 200 mg on day 1, then 100 mg or 200 mg daily, plus metronidazole 400 mg three times daily (NICE NG184/SPC; check the SPC, BNF and local formulary; <a href='https://www.medicines.org.uk/emc/search?q=doxycycline' target=_blank rel=noopener>SPC: doxycycline</a>, <a href='https://www.medicines.org.uk/emc/search?q=metronidazole' target=_blank rel=noopener>SPC: metronidazole</a>)</span>"],
         ["<b>Young people 12–17</b>","Co-amoxiclav (dose per the BNFC)","Doxycycline with metronidazole (doses per the BNFC)"],
         ["<b>Children 1 month to 11 years</b>","Co-amoxiclav (dose by age or weight per the BNFC)","<b>Co-trimoxazole</b> (off-label; dose per the BNFC)"],
         ["<b>Under 1 month</b>","Specialist advice","Specialist advice"],
         ["<b>Pregnancy</b>","Co-amoxiclav","Seek specialist advice (doxycycline is contraindicated)"]
       ]},
       {b:"warn", html:"<b>Review</b> if symptoms worsen rapidly or significantly at any time, do not start to improve within 24–48 hours of antibiotics, or the person becomes systemically unwell. Consider IV antibiotics and referral for severe infection. Metronidazole: avoid alcohol during and for 48 hours after the course. Doxycycline: take with water, upright, and avoid strong sunlight."}
     ]},

    {id:"tetanus", nav:"Tetanus and rabies", title:"Tetanus and rabies", sub:"Two separate questions for every animal bite; tetanus for human bites too.",
     blocks:[
       {b:"table", head:["Tetanus status","Clean wound","Tetanus-prone wound (for example a contaminated or deep bite)"], rows:[
         ["<b>Fully immunised</b> (5 doses)","Nothing more","Nothing more, unless high-risk (heavy contamination): human tetanus immunoglobulin"],
         ["<b>Primary course complete, boosters incomplete</b>","Consider a reinforcing dose to complete the schedule","Reinforcing dose; immunoglobulin if high-risk"],
         ["<b>Incomplete, unknown or never immunised</b>","Immediate reinforcing dose, then complete the schedule","Immediate dose plus human tetanus immunoglobulin; complete the schedule"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"🦇 Rabies: UK bats", html:"Bats in the UK can carry European bat lyssavirus. Any direct contact with a bat (bite, scratch, or saliva on broken skin or mucous membranes) — or uncertain contact, such as waking to find a bat in the room — needs a <b>same-day</b> risk assessment through the local health protection team or the UKHSA Rabies and Immunoglobulin Service (RIgS, 0330 128 1020, 9.30 am to 5 pm, 7 days; out-of-hours for highest-risk exposures). Wash the wound with soap and water for several minutes.", src:"UKHSA rabies guidelines (2023)"},
         {tone:"amber", h:"🌍 Rabies: bites abroad", html:"A bite, scratch or lick on broken skin from a mammal (especially dogs, cats, monkeys, bats) in a rabies-risk country → <b>same-day</b> risk assessment, even weeks later. Post-exposure vaccine (and sometimes immunoglobulin, per the June 2025 interim UKHSA advice) is issued through UKHSA. Ask whether treatment was started abroad and with which product.", src:"UKHSA rabies guidelines (2023) · UKHSA interim HRIG advice (2025)"}
       ]}
     ]},

    {id:"bbv", nav:"Human bites", title:"Human bites: blood-borne viruses", sub:"Transmission is uncommon but possible when blood is involved.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"🩸 Hepatitis B", html:"If the skin was broken and blood drawn, check the bitten person's vaccination and immunity. Offer an accelerated course of hepatitis B vaccine if not immune, plus hepatitis B immunoglobulin if the source is known to be HBsAg positive, as Green Book chapter 18 advises. The biter may also be exposed if they had blood in their mouth.", src:"Green Book ch.18 · NICE CKS bites"},
         {tone:"blue", h:"🩸 Hepatitis C and HIV", html:"Baseline testing, with follow-up testing as the local virology or sexual health service advises. <b>HIV PEP is not generally recommended</b> after a human bite; it may be considered if the source is known to have HIV with a detectable viral load and there was blood in the biter's mouth. Discuss the same day (within 72 hours) with the local sexual health, infectious diseases or emergency department team.", src:"BHIVA/BASHH PEP guideline (2021)"}
       ]},
       {b:"say", html:"Human mouths carry a lot of bacteria, so we'll clean this well and give you a short course of antibiotics to stop it getting infected. Because blood was involved, we'll also check your hepatitis B protection and arrange some blood tests now and in a few months. The chance of catching a virus from a bite is very small, but it's worth checking."}
     ]},

    {id:"special", nav:"Special groups", title:"Special groups", sub:"Groups where the default plan changes.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"🤰 Pregnancy", html:"Co-amoxiclav is the first choice. With penicillin allergy, seek specialist advice: doxycycline is contraindicated.", src:"NICE NG184 (2020)"},
         {tone:"amber", h:"🧒 Children", html:"Doses by age or weight per the BNFC. Co-trimoxazole (off-label) for under-12s with penicillin allergy. Under 1 month: specialist advice. Consider safeguarding.", src:"NICE NG184 (2020)"},
         {tone:"red", h:"🛡️ Asplenia and immunosuppression", html:"Offer prophylaxis more readily (they count as at risk of serious infection), and keep a low threshold for same-day assessment if unwell.", src:"NICE NG184 (2020)"},
         {tone:"cream", h:"🧓 Older people and diabetes", html:"Poor circulation and diabetes increase infection risk, especially on the feet and lower legs. Review early.", src:"NICE NG184 (2020)"}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer: who, where and how fast", sub:"Most bites are managed in primary care after careful cleaning.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999 or same-day admission", html:"Sepsis; rapidly spreading infection; systemically unwell; severe infection needing IV antibiotics.", src:"NICE NG184 (2020)"},
         {tone:"red", h:"Same-day surgical assessment", html:"Hand, joint or tendon involvement including fight bites; facial wounds that may need closure; deep, crushing or contaminated wounds needing debridement; fracture or retained tooth.", src:"NICE CKS bites"},
         {tone:"amber", h:"Same-day advice", html:"Rabies risk (health protection team or UKHSA RIgS); possible HIV PEP (sexual health, infectious diseases or emergency department); safeguarding concerns; wild or exotic animal bites (microbiology).", src:"UKHSA rabies guidelines (2023) · BHIVA/BASHH (2021)"},
         {tone:"green", h:"Stays in primary care", html:"Clean, superficial bites without high-risk features, with or without prophylaxis, tetanus checked, and safety-netting.", src:"NICE NG184 (2020)"}
       ]}
     ]},

    {id:"safety", nav:"Safety-net", title:"Patient information and safety-netting", sub:"Say it, give it in writing, document it.",
     blocks:[
       {b:"say", html:"Call 999 if you feel very unwell, shivery, confused or faint. Contact us the same day if the redness spreads, the area becomes more painful or swollen, you get a fever, or you can't move a finger or joint properly. If you're not starting to improve within 2 days of the antibiotics, come back. Keep the bite clean, raised and uncovered or lightly dressed."},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"📄 Information", html:"NHS: animal and human bites. UKHSA: information for people bitten by a bat.", src:"NHS bites information · UKHSA"},
         {tone:"green", h:"🐕 Prevention", html:"Never leave young children alone with a dog; teach children not to approach dogs that are eating or sleeping. Avoid touching bats; use gloves if one must be moved. Pre-travel rabies vaccine for higher-risk travel.", src:"NHS bites information · UKHSA"}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 24-year-old man with a 1 cm wound over his right middle knuckle from 'catching it on a door' last night. It is swollen and he cannot fully bend the finger. He is allergic to penicillin.", src:"NICE CKS bites"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Explores the mechanism and recognises a likely <b>fight bite</b>. Arranges <b>same-day hand surgery</b> assessment rather than oral antibiotics alone. Knows the penicillin-allergy alternative (<b>doxycycline with metronidazole</b>). Checks <b>tetanus</b> and discusses <b>blood-borne virus</b> risk non-judgementally. Safety-nets.", src:"NICE NG184 (2020) · Green Book ch.30"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Every recommendation on this page traces to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG184 — Human and animal bites: antimicrobial prescribing (November 2020)</b><br><a href="https://www.nice.org.uk/guidance/ng184" rel="noopener">nice.org.uk/guidance/ng184</a><span class="rd"> — when to offer or consider prophylaxis, high-risk areas and people, co-amoxiclav, doxycycline with metronidazole, co-trimoxazole in children under 12, 3-day prophylaxis and 5-day treatment, review at 24–48 hours, wild and exotic animals</span></li>'+
         '<li><b>NICE CKS — Bites (human and animal)</b><br><a href="https://cks.nice.org.uk/topics/bites-human-animal/" rel="noopener">cks.nice.org.uk — bites</a><span class="rd"> — wound care, closure, referral, blood-borne virus assessment</span></li>'+
         '<li><b>UKHSA — Tetanus: the Green Book, chapter 30</b><br><a href="https://www.gov.uk/government/publications/tetanus-the-green-book-chapter-30" rel="noopener">gov.uk — Green Book chapter 30</a><span class="rd"> — tetanus-prone wounds, boosters and immunoglobulin</span></li>'+
         '<li><b>UKHSA — Guidelines on managing rabies post-exposure (January 2023)</b> and <b>interim recommendations on human rabies immunoglobulin (June 2025)</b><br><a href="https://www.gov.uk/government/collections/rabies-risk-assessment-post-exposure-treatment-management" rel="noopener">gov.uk — rabies risk assessment and post-exposure treatment</a><span class="rd"> — UK bats, bites abroad, RIgS contact</span></li>'+
         '<li><b>UKHSA — Hepatitis B: the Green Book, chapter 18</b><br><a href="https://www.gov.uk/government/publications/hepatitis-b-the-green-book-chapter-18" rel="noopener">gov.uk — Green Book chapter 18</a><span class="rd"> — post-exposure vaccination and immunoglobulin</span></li>'+
         '<li><b>BHIVA/BASHH — UK guideline for the use of HIV post-exposure prophylaxis (2021)</b><br><a href="https://www.bhiva.org/PEP-guidelines" rel="noopener">bhiva.org — PEP guidelines</a><span class="rd"> — PEP not generally recommended after human bites</span></li>'+
         '<li><b>SPCs — co-amoxiclav, doxycycline, metronidazole, co-trimoxazole</b><br><a href="https://www.medicines.org.uk/emc" rel="noopener">medicines.org.uk/emc</a><span class="rd"> — doses, contraindications, interactions</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Animal and human bites in primary care — NICE NG184 (2020), NICE CKS, UKHSA Green Book chapters 18 and 30, UKHSA rabies guidelines (2023) and interim immunoglobulin advice (2025), BHIVA/BASHH PEP guideline (2021) and the antibiotic SPCs. Children's doses per the BNFC. Not a substitute for clinical judgement."
});
