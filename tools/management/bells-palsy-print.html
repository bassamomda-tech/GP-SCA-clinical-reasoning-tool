<script>
MG.render({
  icon:"😐",
  title:"Bell's palsy — the complete guide",
  eyebrow:"Protocol · adults aged 16 and over · acute lower motor neurone facial palsy",
  stemTitle:"Confirm a lower motor neurone pattern, look actively for a central or secondary cause, start prednisolone within 72 hours, and protect the eye",
  stemSub:"One page for acute facial palsy in <b>adults aged 16 years and over</b> (use a separate paediatric pathway for children and young people). Bell's palsy is an acute, usually unilateral, lower motor neurone facial nerve palsy affecting the forehead, eye closure and lower face, <b>with no identified alternative cause</b>; it usually evolves over hours, may be present on waking, and may progress for up to 72 hours. The forehead finding is an important clue but not a complete test, so a full cranial and neurological examination comes first. Then do the three things that matter: <b>prednisolone as early as possible within 72 hours</b>, <b>eye protection for anyone who cannot fully close the eye</b>, and recognition of <b>Ramsay Hunt syndrome</b>.",
  guideline:"NICE NG127 · Cochrane antivirals review (Gagyor 2019) · Greater Manchester/local formulary · local Ramsay Hunt pathway · House–Brackmann (optional)",
  reviewed:"24 September 2026",
  nextReview:"24 September 2027",
  meta:[
    {t:"Forehead sparing suggests a central lesion", tone:"tw"},
    {t:"Prednisolone within 72 hours of onset", tone:"tw"},
    {t:"Adults 16+ · separate paediatric pathway"},
    {t:"v3.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#confirm"><b>Confirm</b><small>Pattern + mimics</small></a><a href="#eye"><b>The eye</b><small>Protect it</small></a><a href="#steroid"><b>Steroid</b><small>Within 72 h</small></a><a href="#monitor"><b>Recovery</b><small>Review points</small></a><a href="#refer"><b>Refer</b><small>Stroke · eye · ENT</small></a></div>',
  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Forehead sparing suggests a central lesion — not a complete test", html:"Bell's palsy weakens the whole side, including the forehead and eye closure. <b>Forehead sparing suggests a central facial weakness</b>: if acute, and especially with arm or leg weakness, speech disturbance, visual symptoms, ataxia or sensory loss, use the emergency stroke pathway. The sign does not work in reverse — a brainstem lesion can cause a complete palsy that involves the forehead — so do not use forehead involvement to rule out stroke. <b>Any acute focal neurological deficit beyond an isolated complete facial palsy should be managed through the emergency stroke pathway</b> — arm or leg weakness, facial or limb sensory loss, dysarthria or aphasia, visual field or visual loss, ataxia or marked imbalance, other cranial-nerve abnormalities, altered consciousness, or severe sudden headache — even if the forehead is weak. Examine all cranial nerves, limbs, speech and coordination."},
    {tone:"red", h:"Prednisolone, started within 72 hours", html:"Start oral prednisolone as soon as possible, ideally within 72 hours of symptom onset. Do not delay treatment while awaiting routine investigations or specialist review. <b>Prescribe according to the current Greater Manchester adult formulary</b>; if the local regimen is <b>60 mg once daily for 5 days followed by a reduction of 10 mg daily for 5 days</b>, use that regimen consistently. Assess relevant risks — diabetes, active infection, previous steroid-related psychiatric illness, severe hypertension, pregnancy and immunosuppression; these usually require an individual risk–benefit decision rather than automatic exclusion. Do not delay treatment solely to obtain routine blood tests."},
    {tone:"red", h:"⚠ Protect the eye — the avoidable harm", html:"If eye closure is incomplete: <b>preservative-free lubricating drops frequently by day (often at least every 2 hours when exposure is significant), lubricating ointment at night</b>, and protect the eye during sleep with gentle lid taping or a moisture chamber. <b>Avoid any dressing or eye pad that presses on the globe or can abrade the cornea.</b> Seek urgent ophthalmic advice if the cornea is exposed, the patient cannot reliably protect the eye, corneal sensation is reduced, or there are any eye symptoms. Stop contact lenses; wraparound sunglasses outdoors; avoid wind, dust and long screen use."},
    {tone:"amber", h:"Ramsay Hunt — vesicles may be absent", html:"Consider Ramsay Hunt syndrome when facial palsy is accompanied by <b>severe or disproportionate ear pain, vesicles in or around the ear or mouth, hearing loss, tinnitus, vertigo or other cranial-nerve findings</b>. Ear pain alone does not establish it — mild peri-auricular discomfort can occur in typical Bell's palsy. Vesicles may be delayed or absent (zoster sine herpete). Seek same-day discussion with ENT, neurology or the local acute facial-palsy pathway: treatment usually combines an antiviral with a corticosteroid, ideally within 72 hours, with renal-dose adjustment, per your local shingles or Ramsay Hunt pathway. Do not use a corticosteroid alone if herpes zoster oticus is suspected."},
    {tone:"blue", h:"Antivirals are not routine in Bell's palsy", html:"<b>Do not prescribe an antiviral routinely</b> for straightforward Bell's palsy, and never alone. The evidence for routine antivirals is limited and corticosteroids remain the key treatment. Discuss with ENT/neurology or follow the local Ramsay Hunt pathway if there is complete/severe paralysis, marked otalgia, vesicles, hearing loss, vertigo, other cranial-nerve involvement or significant immunosuppression. Check renal function, frailty, hydration, interactions, pregnancy and breastfeeding against the product information."},
    {tone:"green", h:"Most recover — and review points are set", html:"Most people improve over weeks, and maximum recovery can take several months. Arrange a review or contact point at about <b>3 weeks</b> if there is no early improvement — <b>this is local safety-netting rather than a specific NICE requirement</b>. Refer earlier if the diagnosis is uncertain or atypical. Consider specialist facial-palsy referral at about <b>3 months</b> if recovery remains incomplete, and consider neurology from about <b>5 months</b> for synkinesis, gustatory sweating or jaw-winking (NICE NG127)."}
  ],
  pathwaySub:"Five steps. The examination comes first, and the prescription must not wait for tests.",
  pathway:[
    {title:"Establish onset and do a full examination", html:"Exact onset and progression · forehead movement, eye closure, smile, cheek puff and lip seal · otoscopy (external canal, tympanic membrane, vesicles or crusting, otorrhoea), pinna, mastoid, mouth and palate · hearing, taste, hyperacusis, vertigo and nystagmus · all cranial nerves · limb power, sensation, coordination, gait, speech and language · visual symptoms · parotid region and neck nodes.", alert:true},
    {title:"Central signs → emergency stroke pathway", html:"Any acute focal neurological deficit beyond an isolated complete facial palsy goes to the emergency stroke pathway, whatever the forehead shows."},
    {title:"Typical Bell's within 72 hours → prednisolone now", html:"Current Greater Manchester/local formulary regimen, used consistently (for example 60 mg once daily for 5 days, then reduce by 10 mg daily for 5 days), with food. No routine blood tests or imaging."},
    {title:"Protect the eye immediately if closure is incomplete", html:"Preservative-free drops frequently by day, ointment at night, gentle lid taping or moisture chamber in sleep. Avoid any pad that presses on the globe."},
    {title:"Contact point at 3 weeks if not improving; consider referral at 3 months if incomplete", html:"The 3-week point is local safety-netting, not a NICE requirement. Refer from about 5 months for synkinesis or aberrant reinnervation. Earlier assessment for anything atypical."}
  ],
  sections:[

    {id:"confirm", nav:"Confirm", title:"Step 1 — confirm the pattern and look for another cause",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>Bell's palsy</b>","An acute, usually unilateral, lower motor neurone facial nerve palsy affecting the forehead, eye closure and lower face, with no identified alternative cause (neurological, otological, parotid, traumatic or systemic). Usually evolves over hours and may be present on waking; may progress for up to 72 hours"],
         ["<b>Central lesion</b>","Forehead sparing suggests a central cause — stroke, intracranial mass, demyelination. Any acute focal neurological deficit beyond an isolated complete facial palsy → emergency stroke pathway. A brainstem lesion can still involve the forehead, so do not use forehead involvement to rule out stroke"],
         ["<b>Atypical — reconsider</b>","Progression beyond 72 hours · recurrent or bilateral palsy · severe or persistent ear pain · hearing loss, vertigo or otorrhoea · fever or systemic illness · parotid or neck mass · other cranial-nerve or neurological signs · trauma or ear surgery · tick exposure or travel (Lyme) · persistent or severe pain in the facial nerve distribution · history of head and neck malignancy · unexplained persistent otorrhoea · immunosuppression · dysphagia, dysphonia or respiratory symptoms"],
         ["<b>Differential</b>","Stroke (including brainstem) · multiple sclerosis · Guillain–Barré (not usually an isolated unilateral palsy — suspect if bilateral facial weakness with limb weakness, areflexia, ataxia, bulbar or respiratory symptoms) · Ramsay Hunt · otitis media, cholesteatoma or temporal-bone disease · parotid malignancy · sarcoidosis · HIV · lymphoma or leukaemia · Lyme disease"],
         ["<b>Investigations</b>","None routinely for a typical, uncomplicated case. Investigate or refer if the diagnosis is uncertain, onset is gradual, the palsy is recurrent or bilateral, or there are other neurological, ear, parotid or skull-base concerns. Targeted tests by history: Lyme serology with compatible exposure, erythema migrans or endemic travel/residence · glucose/HbA1c if diabetes is suspected or relevant · HIV test with risk factors or atypical, recurrent or bilateral disease · MRI of the internal auditory canals/brain or skull-base imaging for gradual, recurrent, persistent, bilateral or otherwise atypical palsy · ENT assessment for otitis media, cholesteatoma, temporal-bone or parotid disease. Avoid routine broad blood tests or MRI in typical acute Bell's palsy"]
       ]},
       {b:"why", html:"<b>The forehead finding is a discriminator, not a diagnosis.</b> Forehead sparing points centrally because the upper face has bilateral cortical supply — but a brainstem lesion can cause a complete ipsilateral palsy, so a normal-looking forehead pattern never replaces the rest of the neurological examination. Bell's is a diagnosis of exclusion: a typical story and a normal examination apart from the face."}
     ]},

    {id:"eye", nav:"The eye", title:"Step 2 — protect the eye",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"👁️ Lubricate", html:"Use preservative-free lubricating drops frequently during the day, often at least every 2 hours when exposure is significant, with ointment at night. Increase the frequency if symptoms or exposure persist. If drops are needed more than four times daily, preservative-free products are preferred. Ointment may blur vision; use it at night unless specialist advice indicates otherwise."},
         {tone:"red", h:"😴 Protect during sleep", html:"Prefer gentle eyelid taping or a moisture chamber. <b>Avoid any dressing or eye pad that presses on the globe or can abrade the cornea.</b> If an eye pad is used locally, it must not contact or press on the corneal surface."},
         {tone:"amber", h:"🕶️ Everyday protection", html:"Stop contact lenses · wraparound sunglasses outdoors · avoid wind, dust and prolonged screen use."},
         {tone:"amber", h:"⚠️ Incomplete closure — act now", html:"If eye closure is incomplete, start lubrication and night-time lid protection immediately. Seek urgent ophthalmic advice if the cornea is exposed, the patient cannot reliably protect the eye or tape the lid correctly, corneal sensation is reduced, Bell's phenomenon is poor, or there are any eye symptoms."},
         {tone:"red", h:"🚨 Same-day ophthalmology", html:"Eye pain, photophobia, foreign-body sensation, increasing redness, visual change, corneal staining or suspected ulcer, or inability to protect the eye reliably — suspected exposure keratopathy or corneal ulcer."},
         {tone:"blue", h:"🍽️ Eating and mouth care", html:"Food pools on the weak side — advice on chewing and oral hygiene."},
         {tone:"green", h:"🫶 Reassure", html:"Most people recover well; explain that recovery may take weeks to months."}
       ]}
     ]},

    {id:"steroid", nav:"Steroid", title:"Step 3 — early corticosteroid; antivirals only selectively",
     blocks:[
       {b:"table", head:["Step","Treatment","Notes"], rows:[
         ["<b>Prednisolone</b>","Current Greater Manchester/local adult formulary regimen, used consistently — for example 60 mg once daily for 5 days, then reduce by 10 mg daily for 5 days, if that is the approved local regimen. Take in the morning with food","As soon as possible, ideally within 72 hours; do not delay for routine tests or specialist review. Assess diabetes, active infection, previous steroid-related psychiatric illness, severe hypertension, pregnancy and immunosuppression — an individual risk–benefit decision, not automatic exclusion. Diabetes should not usually delay treatment: warn about hyperglycaemia and advise glucose monitoring where appropriate. Counsel on insomnia, mood change, dyspepsia and hyperglycaemia, and to seek advice for severe mood or behavioural change. Gastroprotection by individual GI risk, not routinely — a PPI is more relevant with previous ulcer disease, concurrent NSAID, anticoagulant or antiplatelet treatment, or other significant GI risk"],
         ["<b>Antiviral — not routine</b>","Do not prescribe routinely for uncomplicated Bell's palsy and do not use alone. Discuss with ENT/neurology or follow the local Ramsay Hunt pathway if there is complete/severe paralysis, marked otalgia, vesicles, hearing loss, vertigo, other cranial-nerve involvement or significant immunosuppression","Check renal function, frailty, hydration, interactions, pregnancy and breastfeeding against the product information"],
         ["<b>Ramsay Hunt</b>","Antiviral plus corticosteroid, ideally within 72 hours, with renal-dose adjustment; dose and duration per local shingles/Ramsay Hunt pathway. Do not use a corticosteroid alone if herpes zoster oticus is suspected","Same-day discussion with ENT, neurology or the local acute facial-palsy pathway. Arrange urgent hospital assessment if there is severe vertigo, hearing loss, multiple cranial-nerve involvement, disseminated zoster, immunosuppression or systemic illness"],
         ["<b>Eye protection</b>","For everyone who cannot fully close the eye","Do not omit"]
       ]},
       {b:"warn", html:"<b>Do not delay steroids</b> for investigations or a review appointment. <b>Do not prescribe unsupervised forceful facial strengthening or electrical stimulation as routine acute treatment.</b> If weakness persists, refer for specialist facial-palsy physiotherapy, where exercises are tailored to the stage of recovery and the risk of synkinesis."}
     ]},

    {id:"monitor", nav:"Recovery", title:"Step 4 — review points and safety-netting",
     blocks:[
       {b:"table", head:["When","What","Action"], rows:[
         ["<b>At diagnosis</b>","Pattern, eye, ear, neuro","Prednisolone, eye protection, safety-net. Formal House–Brackmann grading is optional in primary care but can be useful when documenting severity, communicating with facial-palsy services or monitoring recovery"],
         ["<b>About 3 weeks</b>","No improvement","Arrange a review or contact point — local safety-netting rather than a specific NICE requirement. Reassess the diagnosis; consider ENT, neurology or a facial-palsy service"],
         ["<b>About 3 months</b>","Incomplete recovery","Consider specialist facial-palsy referral (ENT, neurology or facial-palsy service), particularly with complete palsy, severe weakness, pain, no objective improvement or functional impairment; some incomplete recovery at 3 months may still improve"],
         ["<b>From about 5 months</b>","Synkinesis, gustatory sweating, jaw-winking","Consider neurological or facial-palsy assessment (NICE NG127)"],
         ["<b>Any time</b>","Gradual, recurrent, bilateral or progressive palsy; severe pain; hearing loss; parotid or neck mass; trauma; systemic illness; other cranial-nerve findings; uncertain or atypical diagnosis","Earlier specialist assessment"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 Stroke", html:"\"Call 999 immediately for new limb weakness, speech or language disturbance, visual loss, severe imbalance, new sensory loss, confusion or worsening neurological symptoms.\""},
         {tone:"red", h:"👁️ Eye danger", html:"\"Eye pain, light sensitivity, increasing redness or any change in vision — same-day eye assessment.\""},
         {tone:"amber", h:"🟠 Ramsay Hunt", html:"\"Severe ear pain, blisters in the ear or mouth, hearing loss, ringing or dizziness — contact us the same day.\""},
         {tone:"green", h:"🫶 Recovery", html:"\"Most people recover well, though it can take months. Contact us if there is no improvement after about three weeks.\""}
       ]}
     ]},

    {id:"troubleshoot", nav:"Not recovering?", title:"Not improving by 3 weeks? Re-check before referring",
     sub:"Reconsider the diagnosis and the treatment timing.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"1 · Is the diagnosis right?", html:"Central signs, ear or parotid findings, hearing loss, progression beyond 72 hours, or bilateral palsy → reconsider."},
         {tone:"amber", h:"2 · Steroid timing", html:"<b>Were steroids started within 72 hours?</b>"},
         {tone:"red", h:"3 · The eye", html:"<b>Has the cornea been protected throughout? Any exposure damage?</b>"},
         {tone:"blue", h:"4 · Another cause", html:"Lyme disease, tumour, multiple sclerosis, sarcoidosis, HIV or lymphoma in atypical or non-resolving cases — use targeted tests (Lyme serology, glucose/HbA1c, HIV test, MRI, ENT assessment) according to the history."},
         {tone:"blue", h:"5 · Refer", html:"<b>Local ENT, neurology or facial-palsy pathway.</b>"}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"When to refer",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Emergency — 999", html:"Suspected stroke or any acute neurological deficit beyond the face → stroke pathway. See <a href='tia-stroke.html'>stroke and TIA</a>."},
         {tone:"red", h:"Same day", html:"Eye pain, photophobia, visual loss or suspected corneal ulcer, or inability to protect the eye reliably · suspected Ramsay Hunt → same-day discussion with ENT, neurology or the local acute facial-palsy pathway (urgent hospital assessment if severe vertigo, hearing loss, multiple cranial-nerve involvement, disseminated zoster, immunosuppression or systemic illness) · palsy with severe otitis, mastoid signs or systemic illness · rapidly progressive or bilateral palsy · significant trauma."},
         {tone:"blue", h:"ENT, neurology or facial-palsy service", html:"No improvement at about 3 weeks · incomplete recovery at about 3 months · synkinesis or aberrant reinnervation from about 5 months · gradual, recurrent or atypical palsy · persistent or severe facial pain · history of head and neck malignancy · persistent otorrhoea · immunosuppression · persistent weakness needing specialist facial-palsy physiotherapy."},
         {tone:"cream", h:"GP management", html:"Typical uncomplicated Bell's palsy needs no routine specialist referral or imaging. The examination, early prednisolone, eye protection, Ramsay Hunt recognition and the review points all belong here. Related pages: <a href='tia-stroke.html'>stroke and TIA</a> · <a href='shingles.html'>shingles</a> · <a href='lyme-disease.html'>Lyme disease</a>."}
       ]},
       {b:"say", html:"This is a weakness of the facial nerve, and most people recover well — a steroid tablet started early helps, which is why I'd like you to start it today. It can take weeks or sometimes months to recover fully. The most important thing meanwhile is protecting the eye, because it cannot close properly: drops by day, ointment at night and taping it gently shut when you sleep. If the eye becomes painful or red, or your vision changes, that needs same-day attention."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 41-year-old man attends having woken <b>yesterday</b> unable to move the right side of his face. He is frightened he has had a stroke. On examination the <b>right forehead does not wrinkle</b> and he <b>cannot close the right eye</b>; limbs, speech and the other cranial nerves are normal. He mentions <b>an ache deep in the right ear</b> for two days beforehand. He works outdoors as a groundsman."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Does a full cranial and neurological examination rather than relying on the forehead alone, and explains why the findings are reassuring; examines the ear canal, tympanic membrane, pinna, mastoid and mouth for vesicles, otitis or otorrhoea and asks about hearing, taste, hyperacusis and vertigo given the ear ache (uncomplicated Bell's, otitis, herpes zoster oticus or temporal-bone disease); starts prednisolone the same day within the 72-hour window; arranges eye protection — preservative-free drops, night ointment and gentle lid taping, nothing pressing on the globe — relevant to outdoor work; gives the stroke, eye and Ramsay Hunt safety-net; and sets the 3-week and 3-month review points."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG127 — Suspected neurological conditions: recognition and referral</b><br><a href="https://www.nice.org.uk/guidance/ng127/chapter/Recommendations-for-adults" rel="noopener">nice.org.uk/guidance/ng127 — recommendations for adults</a><span class="rd"> — no routine referral for typical Bell\'s palsy, eye-care advice, and referral for aberrant reinnervation from about 5 months</span></li>'+
         '<li><b>Gagyor I, Madhok VB, Daly F, Sullivan F. Antiviral treatment for Bell\'s palsy (idiopathic facial paralysis). Cochrane Database Syst Rev 2019;9:CD001869</b><br><a href="https://doi.org/10.1002/14651858.CD001869.pub9" rel="noopener">doi.org/10.1002/14651858.CD001869.pub9</a><span class="rd"> — evidence for antivirals in uncomplicated Bell\'s palsy only: they add little to corticosteroids and are not used alone. Not a source for the treatment of herpes zoster oticus/Ramsay Hunt, which follows the local shingles pathway</span></li>'+
         '<li><b>Ramsay Hunt syndrome — DermNet</b><br><a href="https://dermnetnz.org/topics/ramsay-hunt-syndrome" rel="noopener">dermnetnz.org/topics/ramsay-hunt-syndrome</a><span class="rd"> — clinical features, delayed or absent vesicles, and combined antiviral and corticosteroid treatment ideally within 72 hours</span></li>'+
         '<li><b>Local Ramsay Hunt/shingles pathway</b><span class="rd"> — check the current Greater Manchester/local pathway for antiviral choice, dose, renal adjustment and the same-day specialist route</span></li>'+
         '<li><b>Patient.info Professional — Facial nerve palsy (Bell\'s palsy)</b><br><a href="https://patient.info/doctor/facial-nerve-palsy" rel="noopener">patient.info/doctor/facial-nerve-palsy</a><span class="rd"> — prednisolone regimens used in UK practice, eye-lubrication frequency and preservative-free drops</span></li>'+
         '<li><b>Greater Manchester adult formulary (GMMMG) and product information (SPC)</b><br><a href="https://gmmmg.nhs.uk" rel="noopener">gmmmg.nhs.uk</a><span class="rd"> — the locally approved prednisolone regimen (check the dose in the current formulary), antiviral regimens, cautions and dose adjustment</span></li>'+
         '<li><b>House JW, Brackmann DE. Facial nerve grading system. Otolaryngol Head Neck Surg 1985;93:146–7</b><span class="rd"> — severity grading; formal grading is optional in primary care but can help when documenting severity, communicating with facial-palsy services or monitoring recovery</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Bell's palsy in adults. Examine fully: forehead sparing suggests a central lesion, but any acute focal neurological deficit beyond an isolated complete facial palsy goes to the emergency stroke pathway whatever the forehead shows. Start prednisolone as soon as possible, ideally within 72 hours, using the current Greater Manchester/local formulary regimen consistently. Protect the eye with frequent preservative-free drops, night ointment and gentle lid taping or a moisture chamber — nothing pressing on the globe. Consider Ramsay Hunt with severe or disproportionate ear pain, vesicles, hearing loss, tinnitus, vertigo or other cranial-nerve findings, even without vesicles. Arrange a contact point at about 3 weeks if not improving (local safety-netting), and consider referral at about 3 months if incomplete. Sources: NICE NG127, Cochrane (Gagyor 2019), DermNet, Greater Manchester/local formulary, local Ramsay Hunt pathway and SPC."
});
</script>
