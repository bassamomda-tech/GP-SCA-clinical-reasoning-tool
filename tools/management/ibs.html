MG.render({
  icon:"🫃",
  title:"Irritable bowel syndrome — the complete guide",
  eyebrow:"Protocol · NICE CG61 · subtype decides the drug",
  stemTitle:"IBS is a positive diagnosis, not a label of exclusion — and the subtype matters because the same diagnosis needs opposite treatments: a laxative for one patient and an antidiarrhoeal for the next",
  stemSub:"One page for the whole condition. Make the diagnosis positively once red flags are absent and the <b>two tests that actually change management</b> — coeliac serology and faecal calprotectin — are done. Then <b>subtype it</b>, because IBS-C and IBS-D diverge completely: soluble fibre for one, reduced insoluble fibre for the other. Treat the dominant symptom, <b>avoid lactulose</b> because its fermentation worsens the very bloating patients complain of, add a <b>low-dose neuromodulator for persistent pain</b>, and keep the NG12 safety net live because IBS is a long-term relapsing condition in which new alarm features still mean investigation.",
  guideline:"NICE CG61 · NG12",
  reviewed:"14 September 2026",
  nextReview:"14 March 2027",
  meta:[
    {t:"NICE CG61 — irritable bowel syndrome in adults"},
    {t:"Coeliac serology + faecal calprotectin in everyone", tone:"tw"},
    {t:"Avoid lactulose — it worsens bloating", tone:"tw"},
    {t:"v2.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#diagnose"><b>Diagnose</b><small>Positive · subtype</small></a><a href="#lifestyle"><b>Diet</b><small>Fibre by subtype</small></a><a href="#drugs"><b>Drugs</b><small>Dominant symptom</small></a><a href="#review"><b>Review</b><small>Relapsing condition</small></a><a href="#refer"><b>Refer</b><small>NG12 · refractory</small></a></div>',
  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"blue", h:"Two tests change management — do both in everyone", html:"<b>Coeliac serology and faecal calprotectin.</b> <b>Plus FBC and CRP or ESR, and CA-125 if there is any ovarian concern.</b> These are the two tests that most change what you do: a positive coeliac screen or a raised calprotectin means the diagnosis is not IBS — and both conditions present identically to it."},
    {tone:"blue", h:"Diagnose positively, then subtype", html:"Abdominal pain related to defecation plus altered stool form or frequency for 6 months or more, with bloating or mucus, and no red flags. Then classify: IBS-C (constipation), IBS-D (diarrhoea) or IBS-M (mixed) — because that choice directs the drug. Subtyping is not academic tidiness; it is the difference between a laxative and loperamide."},
    {tone:"amber", h:"Fibre advice is opposite in the two subtypes", html:"<b>IBS-C: SOLUBLE fibre — ispaghula.</b> <b>IBS-D or bloating: REDUCE insoluble fibre — bran.</b> <b>Generic \"eat more fibre\" advice makes half of IBS patients worse</b>, which is why so many arrive saying diet advice did not help. Regular meals, adequate fluid, and reduce caffeine, alcohol, fizzy drinks, fatty or processed foods and sweeteners such as sorbitol."},
    {tone:"red", h:"⛔ Avoid lactulose in IBS", html:"<b>Its fermentation worsens the very bloating IBS patients complain of.</b> <b>Use an alternative laxative for IBS-C</b> — and if a patient reports that a laxative made them much more bloated, lactulose is usually the reason. For pain: mebeverine 135 mg TDS, hyoscine butylbromide 10–20 mg TDS, or peppermint oil 1–2 capsules TDS. For diarrhoea: loperamide 2 mg titrated to response."},
    {tone:"blue", h:"Low-dose neuromodulators for persistent pain", html:"Low-dose amitriptyline 10 mg at night, titrated — off-label, as a gut neuromodulator that dampens visceral hypersensitivity — with counselling on drowsiness and anticholinergic effects. <b>An SSRI is the alternative if a TCA fails.</b> <b>Refractory IBS-C: linaclotide 290 micrograms OD.</b> Refractory IBS-D has specialist options."},
    {tone:"purple", h:"🟣 NICE NG12 — the safety net stays live for life", html:"Offer FIT for a change in bowel habit or iron-deficiency anaemia at any age, rectal bleeding with abdominal pain or weight loss under 50, rectal bleeding, abdominal pain or weight loss at 50+, or an abdominal mass → FIT, with a 2WW referral at ≥10 µg Hb/g; a rectal mass → 2WW without waiting for FIT. An established IBS label does not retire the red flags — it conceals them, because both patient and clinician attribute new symptoms to the known diagnosis. Restated in <a href='#refer'>Refer</a>."}
  ],
  pathwaySub:"Five steps, and the second is the one that makes dietary advice work rather than backfire.",
  pathway:[

    {title:"Subtype it — IBS-C, IBS-D or IBS-M", html:"This directs everything that follows, including whether fibre goes up or down."},
    {title:"Diet and lifestyle first", html:"Regular meals, trigger reduction, fibre BY SUBTYPE, activity and stress — with a structured low-FODMAP diet if symptoms persist, ideally dietitian-led."},
    {title:"Treat the dominant symptom", html:"Antispasmodic, laxative (not lactulose) or loperamide; then a low-dose neuromodulator for persistent pain."},
    {title:"Review as a long-term relapsing condition", html:"Re-screen red flags, re-match treatment to the current dominant symptom, and stop what is not working."}
  ],
  sections:[

    {id:"diagnose", nav:"Diagnose", title:"Step 1 — confirming IBS and its subtype",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>Diagnosis</b>","Abdominal pain related to defecation plus altered stool form or frequency for 6 months or more, with bloating or mucus"],
         ["<b>Exclude organic disease</b>","FBC, CRP or ESR, coeliac serology, faecal calprotectin (IBD); CA-125 if there is ovarian concern"],
         ["<b>Subtype</b>","IBS-C (constipation), IBS-D (diarrhoea), IBS-M (mixed) — this directs drug choice"],
         ["<b>Red flags</b>","<b>See the safety-net — these must be absent to diagnose IBS confidently</b>"]
       ]},
       {b:"why", html:"IBS is a positive clinical diagnosis once red flags and the key mimics — coeliac disease and IBD — are excluded; calprotectin and coeliac serology are the two tests that most change management. Subtyping matters because the same diagnosis needs opposite treatments: a laxative versus an antidiarrhoeal, and fibre advice that helps one subtype actively harms the other."}
     ]},

    {id:"lifestyle", nav:"Diet", title:"Step 2 — diet, lifestyle and the gut–brain link",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"🍽️ Regular meals", html:"<b>A regular eating pattern; do not skip or rush meals; adequate fluid.</b>"},
         {tone:"blue", h:"☕ Limit triggers", html:"Reduce caffeine, alcohol, fizzy drinks, fatty and processed foods, and sweeteners such as sorbitol."},
         {tone:"amber", h:"🌾 Fibre BY SUBTYPE", html:"SOLUBLE fibre (ispaghula) for IBS-C. REDUCE insoluble fibre (bran) for IBS-D and bloating. Getting this backwards is why generic fibre advice so often fails."},
         {tone:"blue", h:"🦠 Probiotics", html:"A trial for 4 weeks or more if the patient wishes — discontinue if there is no benefit."},
         {tone:"green", h:"🏃 Activity and stress", html:"<b>Physical activity; address stress, which is a strong symptom driver.</b>"},
         {tone:"blue", h:"🥗 Low-FODMAP", html:"If symptoms persist — a structured low-FODMAP diet, ideally dietitian-led rather than unsupervised exclusion."}
       ]}
     ]},

    {id:"drugs", nav:"Drugs", title:"Step 3 — treat the dominant symptom",
     blocks:[
       {b:"table", head:["Step","When","Treatment"], rows:[
         ["<b>First-line, by symptom</b>","<b>Antispasmodic / laxative / loperamide</b>","Pain or spasm: an antispasmodic — mebeverine 135 mg TDS, hyoscine butylbromide 10–20 mg TDS, or peppermint oil 1–2 capsules TDS. Constipation: a laxative — AVOID lactulose (bloating). Diarrhoea: loperamide 2 mg titrated to response"],
         ["<b>Step 2 — low-dose amitriptyline</b>","<b>Persistent pain despite first-line</b>","A low-dose tricyclic (off-label) as a gut neuromodulator; counsel on drowsiness and anticholinergic effects"],

       ]},

     ]},

    {id:"review", nav:"Review", title:"Step 4 — monitoring and follow-up",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["<b>Symptom response</b>","<b>Each review</b>","<b>Adjust diet and drug by subtype; stop ineffective drugs</b>"],
         ["<b>Red flags</b>","<b>Ongoing</b>","<b>Any new alarm feature → investigate or refer</b>"],
         ["<b>FODMAP and probiotic trials</b>","<b>After about 4–8 weeks</b>","<b>Continue only if there is benefit; involve a dietitian</b>"],
         ["<b>Mood and stress</b>","<b>As needed</b>","<b>Treat comorbid anxiety or depression; consider psychological therapy</b>"]
       ]},
       {b:"dl", rows:[
         ["<b>After diet plus first-line drug</b>","<b>Reassess symptoms, adherence and triggers; adjust by subtype</b>"],
         ["<b>If persistent</b>","Escalate the non-drug measures: dietitian-led low-FODMAP, add a neuromodulator, consider psychological therapy"],
         ["<b>Periodically</b>","Confirm the diagnosis still fits, re-screen the red flags, and manage it as a long-term relapsing condition"]
       ]}
     ]},

    {id:"notresponding", nav:"Not responding?", title:"Not responding? Re-think before escalating",
     sub:"Persistent symptoms warrant revisiting the diagnosis and the drivers.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"1 · Red flags and mimics", html:"Re-screen; confirm coeliac serology and calprotectin were actually done."},
         {tone:"blue", h:"2 · Subtype", html:"<b>Has treatment been matched to the CURRENT dominant symptom?</b> Subtypes shift over time."},
         {tone:"blue", h:"3 · Diet", html:"<b>Structured low-FODMAP via a dietitian — not unsupervised exclusion</b>, which risks nutritional inadequacy and rarely works."},
         {tone:"green", h:"4 · Psychological", html:"Stress, anxiety or prior trauma — CBT or gut-directed therapy for refractory IBS."},
         {tone:"amber", h:"5 · Drug trial", html:"An adequate trial of an antispasmodic with or without a neuromodulator before declaring failure."}
       ]}
     ]},

    {id:"safety", nav:"Safety-net", title:"Safety-netting",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Alarm features", html:"\"Bleeding from the back passage, unintentional weight loss, a tummy or back-passage lump, or new symptoms over 60 — come back; we'll investigate.\""},
         {tone:"amber", h:"🟠 Nocturnal or progressive", html:"\"Symptoms that wake you at night, or that steadily worsen, need re-checking.\""},
         {tone:"amber", h:"🩸 Anaemia", html:"\"If you feel increasingly tired or look pale, we'll check your blood count.\""},
         {tone:"green", h:"🧠 It's real", html:"\"IBS is a genuine condition, not 'in your head' — but stress can flare it, so we treat both.\""}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"When to refer",
     blocks:[
       {b:"cards", items:[
         {tone:"purple", h:"2WW · NICE NG12", html:"Alarm features — a change in bowel habit or iron-deficiency anaemia at any age, rectal bleeding with abdominal pain or weight loss under 50, rectal bleeding, abdominal pain or weight loss at 50+, or an abdominal mass → FIT, with a 2WW referral at ≥10 µg Hb/g; a rectal mass → 2WW without waiting for FIT."},
         {tone:"amber", h:"Refractory", html:"Symptoms unresponsive to optimal diet, drugs and psychological therapy."},
         {tone:"blue", h:"Diagnostic doubt", html:"Atypical features, raised calprotectin (IBD) or positive coeliac serology → gastroenterology."},
         {tone:"blue", h:"Severe impact", html:"<b>Major psychological comorbidity or quality-of-life impact.</b>"},
         {tone:"cream", h:"GP management", html:"The positive diagnosis and the two mimics, subtyping, diet and fibre by subtype, symptom-targeted drugs, neuromodulators and the long-term review all belong here. Related pages: <a href='coeliac-disease.html'>coeliac disease</a> · <a href='crohns-disease.html'>Crohn's disease</a> · <a href='ulcerative-colitis.html'>ulcerative colitis</a> · <a href='constipation-adult.html'>constipation</a> · <a href='../algorithms/chronic-diarrhoea.html'>chronic diarrhoea pathway</a>."}
       ]},
       {b:"say", html:"Your tests rule out the serious causes, which is reassuring. IBS is real and manageable — we'll work on diet and the dominant symptom, and if needed a dietitian and a gut-calming medication. One thing worth knowing: fibre advice depends on which type you have, so please don't just add bran. And tell me if any of the warning signs I mentioned appear, even years from now."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 34-year-old woman has 2 years of <b>cramping lower abdominal pain, bloating and loose stools</b> 3–4 times most mornings, easing after opening her bowels. She was told she had IBS by a previous GP; <b>the record shows no coeliac serology or calprotectin</b>. She was advised to \"increase fibre\" and added <b>bran, since which she is much more bloated</b>. She has tried <b>lactulose</b> for the days she feels constipated, which made it worse. No weight loss, no bleeding, normal FBC last year."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Does the two tests that were never done — coeliac serology and faecal calprotectin — before accepting the inherited IBS label, and can say why they are the two that change management; identifies the fibre advice as the wrong kind for IBS-D: insoluble bran should be REDUCED, not added, which explains her worsening bloating; stops the lactulose, naming fermentation as the reason it worsens bloating; subtypes her as IBS-D and treats accordingly with loperamide titrated to response plus an antispasmodic for the cramp, rather than a generic prescription; considers low-dose amitriptyline only for persistent pain after first-line; <b>offers dietitian-led low-FODMAP rather than unsupervised exclusion</b> if symptoms persist; <b>validates the diagnosis as real while naming stress as a flare driver</b>; and gives the NG12 safety-net explicitly, including that it still applies years into an established diagnosis."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>NICE CG61 — Irritable bowel syndrome in adults: diagnosis and management<br><a href="https://www.nice.org.uk/guidance/cg61" rel="noopener">nice.org.uk/guidance/cg61</a><span class="rd"> — the positive diagnostic criteria, the exclusion tests including coeliac serology and CA-125, the dietary advice with soluble fibre for constipation and reduced insoluble fibre for diarrhoea and bloating, the antispasmodic/laxative/loperamide first line with the recommendation to avoid lactulose, and low-dose tricyclics then SSRIs as second and third line for pain</span></li>'+
         '<li>NICE DG11 — Faecal calprotectin diagnostic tests for inflammatory diseases of the bowel<br><a href="https://www.nice.org.uk/guidance/dg11" rel="noopener">nice.org.uk/guidance/dg11</a><span class="rd"> — calprotectin to distinguish IBS from inflammatory bowel disease in primary care</span></li>'+
         '<li>NICE TA318 — Linaclotide for treating moderate to severe irritable bowel syndrome with constipation<span class="rd"> — linaclotide 290 micrograms once daily in refractory IBS-C</span></li>'+
         '<li><b>NICE CG61 \u2014 Irritable bowel syndrome in adults</b><br><a href="https://www.nice.org.uk/guidance/cg61" rel="noopener">nice.org.uk/guidance/cg61</a><span class="rd"> — subtyping into IBS-C, IBS-D and IBS-M, the probiotic trial period, the structured dietitian-led low-FODMAP approach, and the review structure for a relapsing condition</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (May 2025)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — the colorectal routes applied to alarm features arising in a patient with an established IBS diagnosis, including FIT at \u226510 \u00b5g Hb/g</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — mebeverine, hyoscine butylbromide, peppermint oil, loperamide and amitriptyline dosing, and the off-label status of low-dose tricyclics in IBS</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Irritable bowel syndrome in adults — NICE CG61, DG11, TA318, NICE and NG12. A positive clinical diagnosis once red flags are absent and coeliac serology and faecal calprotectin are done — those are the two tests that most change management. Subtype it, because IBS-C and IBS-D need opposite treatments: soluble fibre (ispaghula) for constipation, REDUCED insoluble fibre (bran) for diarrhoea and bloating. Avoid lactulose: fermentation worsens the bloating. Treat the dominant symptom, add low-dose amitriptyline for persistent pain, and use a dietitian-led low-FODMAP diet rather than unsupervised exclusion. The NG12 safety net stays live for life — an established IBS label conceals new alarm features rather than retiring them. Verify all doses against the current BNF before prescribing."
});
