  stemSub:"One page for the whole condition. Irritant nappy dermatitis is the commonest infantile rash and resolves in days with <b>nappy care and a barrier preparation</b> — frequent changes, gentle cleaning, nappy-free time and a thin barrier layer at every change. Fold involvement with satellite papules, or failure to settle after 3 days, means candida and needs a topical imidazole. A <b>short course of mild hydrocortisone</b> helps a markedly inflamed rash, but <b>never a potent steroid under an occlusive nappy</b>. And when the rash is atypical, blistering, eroded or the baby is unwell, <b>reconsider the diagnosis — including safeguarding.</b>",

    {tone:"green", h:"Barrier and nappy care clears most of it in days", html:"Change nappies promptly and frequently; high-absorbency nappies; clean gently with water or fragrance-free wipes; nappy-free time to air and dry; pat dry without rubbing; and a THIN layer of a barrier product (zinc and castor oil, or soft white paraffin) at every change. <b>Avoid soap, bubble bath, talcum powder and fragranced products.</b>"},

  foot:"Nappy rash — PCDS napkin dermatitis guidance, the BNF for Children, and NICE NG153 for secondary impetigo. One sign directs treatment: irritant dermatitis spares the skin folds, while candida involves them with satellite lesions. Nappy care and a thin barrier preparation at every change clears most irritant rash within days. Topical clotrimazole 1% or miconazole 2% for candida — and check the mouth, because an untreated oral reservoir reseeds the area. Hydrocortisone 1% once daily for up to 7 days if markedly inflamed, but never a potent steroid under an occlusive nappy. A rash not improving despite correct treatment is a diagnostic question: reconsider seborrhoeic dermatitis, eczema, psoriasis, impetigo and the rare causes — and consider safeguarding where the rash is severe, persistent or unusually distributed. Verify all doses against the BNF for Children before prescribing."
