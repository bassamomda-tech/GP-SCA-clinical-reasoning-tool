MG.render({
  icon:"🧒",
  title:"Nappy rash — the complete guide",
  eyebrow:"Protocol · primary care · the folds are a useful clue",
  stemTitle:"One physical sign is a useful clue: irritant dermatitis usually SPARES the skin folds, while candida commonly INVOLVES them with satellite lesions — read it with the overall pattern",
  stemSub:"One page for the whole condition. Irritant nappy dermatitis is the commonest infantile rash and typically begins improving within several days of <b>nappy care and a barrier preparation</b> — frequent changes, gentle cleaning, nappy-free time and a thin barrier layer at every change. Fold involvement with satellite papules, or failure to settle after 3 days, suggests candida and a topical imidazole. A <b>short course of mild hydrocortisone</b> helps a markedly inflamed rash, but <b>never a potent steroid under an occlusive nappy</b>. And when the rash is atypical, blistering, eroded or the baby is unwell, <b>reconsider the diagnosis — and assess safeguarding where indicated.</b> Any infant under 3 months with a temperature of 38°C or above needs urgent same-day paediatric assessment.",
  guideline:"PCDS · BNFC · NICE NG153 (secondary impetigo) · GMMMG formulary",
  reviewed:"14 September 2026",
  nextReview:"14 March 2027",
  meta:[
    {t:"PCDS — napkin dermatitis"},
    {t:"Folds usually spared = irritant · folds involved = candida (a clue, not a rule)", tone:"tw"},
    {t:"No potent steroids under a nappy", tone:"tw"},
    {t:"v2.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#diagnose"><b>Diagnose</b><small>The folds</small></a><a href="#care"><b>Barrier care</b><small>First-line</small></a><a href="#drug"><b>Medication</b><small>When to add</small></a><a href="#review"><b>Review</b><small>3–7 days</small></a><a href="#refer"><b>Refer</b><small>Atypical</small></a></div>',
  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"blue", h:"The folds are a useful diagnostic sign", html:"Irritant dermatitis: erythema commonly affecting the convex skin in contact with the nappy — buttocks and genitals — relatively SPARING the skin folds, caused by urine, faeces, friction and moisture. Candida: beefy-red rash commonly INVOLVING the folds, and may have satellite papules or pustules. <b>Use the overall clinical pattern rather than this sign alone</b> — severe irritant dermatitis, seborrhoeic dermatitis, psoriasis and secondary infection may involve the folds, and candida may not initially show obvious satellite lesions."},
    {tone:"green", h:"Barrier and nappy care settles most irritant rash", html:"Change nappies promptly and frequently; high-absorbency nappies; clean gently with water or fragrance-free wipes; nappy-free time to air and dry; pat dry without rubbing; and a THIN layer of a barrier product (zinc and castor oil, or soft white paraffin) at every change — thin, not a thick build-up that prevents cleaning. Wash hands before and after changing nappies. <b>Avoid frequent vigorous wiping, and avoid routine soap, antiseptic products, bubble bath, talcum powder and fragranced products.</b> Barrier products are usually self-care/OTC — check the Greater Manchester formulary before NHS prescribing."},
    {tone:"amber", h:"Candida: topical imidazole, and check the mouth", html:"Clotrimazole 1% or miconazole 2% cream, applied 2–3 times daily, for candidal nappy dermatitis — continuing the barrier care alongside. <b>Examine the mouth for oral candidiasis when the nappy rash is candidal, recurrent or follows antibiotics.</b> Treat oral thrush if clinically present, according to the current paediatric formulary. Do not assume that oral treatment is required for every candidal nappy rash. Suspect candida after antibiotics, or if the rash has not responded after 3 days."},
    {tone:"red", h:"⛔ No potent steroids under an occlusive nappy", html:"For marked inflammation, consider a thin layer of hydrocortisone 1% once daily for up to 7 days, to the inflamed skin only and in the smallest quantity necessary, alongside barrier care. Use the lowest potency for the shortest duration and reassess if treatment is ineffective or repeated courses are needed. Avoid potent topical steroids (unless under specialist supervision), repeated unsupervised courses and prolonged steroid use in the nappy area — the nappy is an occlusive dressing, which greatly increases absorption and the risk of skin atrophy."},
    {tone:"red", h:"⚠ Febrile, systemic or eroded — urgent review; safeguarding with care", html:"<b>Any infant under 3 months with a temperature of 38°C or above requires urgent same-day paediatric assessment</b>, irrespective of whether the rash appears mild. Fever with ill appearance, poor feeding, lethargy, reduced urine output, rapidly spreading erythema, blistering, skin pain out of proportion, purpura, mucosal involvement, or concern about eczema herpeticum or serious bacterial infection → urgent assessment. A febrile infant should not be managed solely through the nappy-rash pathway. If the rash is severe, recurrent, untreated, unusually distributed or accompanied by poor growth, developmental concerns or other signs of neglect or harm, assess safeguarding in accordance with local procedures — consider practical barriers and offer support before drawing conclusions."},
    {tone:"blue", h:"Know the mimics before calling it treatment failure", html:"Seborrhoeic dermatitis (folds plus scalp cradle cap) · atopic eczema · psoriasis · allergic contact dermatitis · bacterial infection such as impetigo or bullous impetigo · <b>perianal streptococcal dermatitis</b> (sharply demarcated bright-red perianal rash, easily mistaken for candida) · <b>eczema herpeticum</b> in a child with eczema · scabies — and rarely <b>Langerhans cell histiocytosis, zinc deficiency and immunodeficiency</b>. A rash not improving despite correct treatment is a diagnostic question, not a dosing one."}
  ],
  pathwaySub:"Five steps, and the first is a single look at the skin folds.",
  pathway:[
    {title:"Diagnose and distinguish", html:"Folds usually spared = irritant; folds involved ± satellite lesions = likely candida — a clue, not a rule. Check temperature (under 3 months ≥38°C → urgent paediatrics). Consider the mimics.", alert:true},
    {title:"Nappy care and a barrier preparation", html:"Hand hygiene, frequent changes, gentle cleaning without vigorous wiping, nappy-free time, thin barrier at every change, avoid irritants."},
    {title:"Add medication only where indicated", html:"Topical imidazole for candida; short thin course of mild hydrocortisone if markedly inflamed; antibiotic only for clinical signs of secondary bacterial infection."},
    {title:"Reassess at 3–7 days", html:"A typical irritant rash should begin improving within several days. Lack of improvement, worsening or recurrence → reassess for candida, bacterial infection or another diagnosis rather than simply adding stronger treatment."},
    {title:"Reconsider or refer the atypical", html:"Persistent, severe, systemic or unusually distributed → other diagnoses, dermatology, or safeguarding."}
  ],
  sections:[

    {id:"diagnose", nav:"Diagnose", title:"Step 1 — diagnose and distinguish",
     blocks:[
       {b:"table", head:["Type","Appearance"], rows:[
         ["<b>Irritant (commonest)</b>","Erythema commonly affecting the convex skin in contact with the nappy (buttocks, genitals), relatively SPARING the skin folds — from urine, faeces, friction and moisture"],
         ["<b>Candidal</b>","Beefy-red rash commonly INVOLVING the folds, and may have satellite papules or pustules (not always obvious early). Consider after antibiotics, or if unresponsive for more than 3 days"],
         ["<b>Mimics</b>","Seborrhoeic dermatitis (folds plus scalp or cradle cap), atopic eczema, psoriasis, allergic contact dermatitis, bacterial infection (impetigo, bullous impetigo), perianal streptococcal dermatitis (sharply demarcated bright-red perianal rash, may be mistaken for candida), eczema herpeticum, scabies; rarely Langerhans cell histiocytosis, zinc deficiency, immunodeficiency"],
         ["<b>Fold sign</b>","A useful sign, not an absolute rule — severe irritant dermatitis, seborrhoeic dermatitis, psoriasis and secondary infection may involve the folds. Use the overall clinical pattern rather than this sign alone"],
         ["<b>Assess</b>","Duration, severity, feeding and recent antibiotics, temperature (infant under 3 months ≥38°C → urgent same-day paediatric assessment), systemic features, the mouth for oral thrush, growth, and other skin sites"]
       ]},
       {b:"why", html:"Nappy rash is usually simple irritant dermatitis, which spares the folds — but <b>involvement of the folds with satellite lesions suggests candida</b> (use the overall pattern, not this sign alone), and atypical, persistent or systemic features should prompt reconsidering the diagnosis, including, rarely, safeguarding or a serious dermatosis."}
     ]},

    {id:"care", nav:"Barrier care", title:"Step 2 — nappy care and barrier preparation",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"👶 Frequent changes", html:"Wash hands before and after changing nappies. Change nappies promptly and frequently; high-absorbency nappies; clean gently with water or fragrance-free wipes."},
         {tone:"green", h:"💨 Nappy-free time", html:"<b>Let the skin air and dry; pat dry and avoid vigorous rubbing or frequent vigorous wiping.</b>"},
         {tone:"blue", h:"🛡️ Barrier preparation", html:"A thin layer of a barrier product (e.g. zinc and castor oil, or soft white paraffin) at each change to protect the skin — apply thinly rather than building up a thick layer that prevents cleaning. Barrier products are usually self-care/OTC; some are restricted for routine NHS prescribing on the Greater Manchester formulary."},
         {tone:"amber", h:"🧴 Avoid irritants", html:"<b>Avoid routine soap, antiseptic products, bubble bath, talcum powder and fragranced products.</b> If contact allergy is suspected, avoid changing multiple products at the same time."}
       ]}
     ]},

    {id:"drug", nav:"Medication", title:"Step 3 — when to add medication",
     blocks:[
       {b:"table", head:["Step","What","When"], rows:[
         ["<b>Step 1 — barrier and nappy care</b>","A typical irritant rash should begin improving within several days of effective nappy care; more severe rash may take longer. Barrier products are usually self-care/OTC","<b>All</b>"],
         ["<b>Step 2 — topical antifungal</b>","A topical imidazole — clotrimazole 1% or miconazole 2% cream, applied 2–3 times daily — for candidal nappy dermatitis, alongside barrier care. Examine the mouth when the rash is candidal, recurrent or follows antibiotics; treat oral thrush only if clinically present, per the current paediatric formulary","Candida suspected or confirmed: folds involved, satellite lesions, or more than 3 days unresponsive"],
         ["<b>Step 3 — short mild topical corticosteroid</b>","A thin layer of hydrocortisone 1% once daily for up to 7 days, to affected inflamed skin only, in the smallest quantity necessary; not beneath occlusion unless specifically directed; avoid prolonged or repeated unsupervised courses and review if not clearly improving. If candidiasis is significantly inflamed, a short course of mild hydrocortisone may be used alongside the topical antifungal, provided the diagnosis is clear and the steroid is limited to the shortest clinically necessary duration — not routine combination therapy; verify the age indication and product information of any combination product. AVOID potent steroids and potent steroid–antifungal combinations in the nappy area","<b>Significantly inflamed</b>"],
         ["<b>Step 4 — antibiotic</b>","Do not use topical or oral antibiotics for an uncomplicated irritant or candidal nappy rash, or for colonisation alone. <b>Consider antibiotics only where there are clinical signs of secondary bacterial infection</b> — spreading erythema, pustules, purulent discharge, honey-coloured crusting, rapidly worsening lesions, fever or systemic illness. Localised infection: topical treatment may be appropriate; extensive or systemic infection: oral antibiotics per NICE NG153 and the local paediatric antimicrobial guideline","<b>Clinical signs of bacterial infection</b>"]
       ]},
       {b:"warn", html:"Avoid potent topical steroids and prolonged steroid use in the occluded nappy area. Reconsider the diagnosis if the rash is not improving despite appropriate treatment, rather than simply adding stronger treatment. Check the Greater Manchester formulary: distinguish self-care/OTC options, medicines appropriate for NHS prescribing, and preparations needing a clinical indication or local formulary approval."}
     ]},

    {id:"review", nav:"Review", title:"Step 4 — review and recurrence",
     blocks:[
       {b:"dl", rows:[
         ["<b>3–7 days</b>","Reassess: a typical irritant rash should begin improving within several days of effective nappy care. If not improving, worsening or recurring, reassess for CANDIDA (satellite lesions → topical imidazole) or bacterial infection"],
         ["<b>Persistent or atypical</b>","Reconsider the diagnosis: seborrhoeic or atopic dermatitis, psoriasis, allergic contact dermatitis, perianal streptococcal dermatitis, or — rarely — zinc deficiency or immunodeficiency if persistent, severe or atypical. Check that treatment is being applied correctly"],
         ["<b>Prevention</b>","Hand hygiene, frequent nappy changes, a thin barrier preparation at each change, nappy-free time, gentle cleaning without vigorous wiping, and avoiding soap and fragranced wipes"]
       ]},
       {b:"say", html:"Frequent changes, a barrier cream and some nappy-free time usually clears it in a few days. If it's not settling, or there are little red spots spreading out from the rash and it's got into the skin creases, it may be thrush and need an antifungal cream."}
     ]},

    {id:"safety", nav:"Safety-net", title:"When to reassess",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"🟠 Not settling", html:"No better after a few days of barrier care, or worsening → reassess for candida (satellite lesions) or bacterial infection."},
         {tone:"red", h:"🔴 Systemic or atypical", html:"Infant under 3 months with a temperature of 38°C or above → urgent same-day paediatric assessment, however mild the rash. Fever with ill appearance, poor feeding, lethargy, reduced urine output, rapidly spreading erythema, blistering, skin pain out of proportion, purpura or mucosal involvement → urgent same-day assessment; consider serious bacterial infection and other diagnoses."},
         {tone:"red", h:"🔴 Eczema herpeticum", html:"Painful clustered vesicles, punched-out erosions, fever or a rapidly worsening rash in a child with eczema may indicate eczema herpeticum and require same-day paediatric/dermatology assessment."},
         {tone:"red", h:"💬 Safety-net", html:"\"If the rash blisters, weeps, spreads, or your baby is unwell or feverish, see us promptly.\""},
         {tone:"green", h:"🫶 Reassurance", html:"\"This is very common and not serious — it usually starts to improve within a few days with the barrier cream and frequent changes.\""}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"Reconsider / dermatology", html:"Lower threshold to refer: no improvement after correctly applied barrier care and appropriate treatment; recurrent rash needing repeated antifungal or steroid courses; widespread or severe dermatitis; suspected zinc deficiency or immunodeficiency; recurrent bacterial infection; poor growth, chronic diarrhoea or other systemic symptoms; diagnostic uncertainty; suspected psoriasis or a serious dermatosis."},
         {tone:"red", h:"Safeguarding / paediatrics", html:"Infant under 3 months with a temperature of 38°C or above, an unwell child, or suspected eczema herpeticum → same-day paediatrics. If the rash is severe, recurrent, untreated, unusually distributed or accompanied by poor growth, developmental concerns or other signs of neglect or harm, assess safeguarding in accordance with local procedures; consider practical barriers and offer support before drawing conclusions. See <a href='faltered-growth.html'>faltering growth</a>."},
         {tone:"cream", h:"GP management", html:"Typical irritant or candidal nappy rash responding to standard care belongs here — the fold distinction, barrier and nappy care, the imidazole, the short mild steroid, and the 3–7 day review. Related pages: <a href='cmpa.html'>CMPA</a> · <a href='eczema.html'>eczema</a> · <a href='faltered-growth.html'>faltering growth</a> · <a href='constipation-child.html'>constipation in children</a>."}
       ]},
       {b:"say", html:"This is nappy rash — very common and not serious. The key is frequent nappy changes, gentle cleaning, some nappy-free time to let the skin breathe, and a barrier cream at each change. If it gets into the skin creases with little spots around it, that's a yeast infection and needs an antifungal cream instead."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 7-month-old has had a nappy rash for <b>10 days</b> despite barrier cream. She finished a course of <b>amoxicillin for an ear infection</b> a fortnight ago. The rash is <b>beefy-red, extends into the groin creases</b>, and there are <b>small red spots spreading onto the thighs</b>. Her mother has been using a potent steroid cream borrowed from an older sibling's eczema prescription and asks for \"something stronger\". The baby is well and feeding normally."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Reads the folds — involvement of the creases with satellite lesions means candida, not treatment-resistant irritant dermatitis, which is the entire diagnostic move in this case; <b>links it to the recent amoxicillin</b> as the precipitant; stops the borrowed potent steroid and explains that the nappy acts as an occlusive dressing, greatly increasing absorption and atrophy risk — and addresses the sharing of prescribed medicines without lecturing; prescribes a topical imidazole (clotrimazole 1% or miconazole 2%) 2–3 times daily and continues barrier care; examines the mouth for oral candidiasis (the rash is candidal and followed antibiotics) and treats oral thrush only if clinically present; <b>reinforces the nappy-care basics</b>; confirms the baby is systemically well and there are no erosions or blistering; and safety-nets non-response, spread and systemic features with a review point."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>PCDS — napkin eczema, napkin dermatitis</b><br><a href="https://www.pcds.org.uk/clinical-guidance/eczema-napkin-eczema" rel="noopener">pcds.org.uk/clinical-guidance/eczema-napkin-eczema</a><span class="rd"> — relative fold sparing in irritant dermatitis versus fold involvement and satellite lesions in candida, frequent changes, gentle cleaning, drying and a thin protective barrier, nappy care and barrier preparations as first-line, topical imidazole for candida, hydrocortisone 1% once daily for up to 7 days for inflamed dermatitis, the advice against potent steroids in the nappy area, the mimics and rarer causes, and the review and referral thresholds</span></li>'+
         '<li><b>NICE NG153 — Impetigo: antimicrobial prescribing</b><br><a href="https://www.nice.org.uk/guidance/ng153" rel="noopener">nice.org.uk/guidance/ng153</a><span class="rd"> — antibiotics only for clinically supported secondary bacterial infection complicating nappy rash, not colonisation; topical for localised, oral for extensive or systemic infection</span></li>'+
         '<li><b>BNF for Children</b><br><a href="https://bnfc.nice.org.uk" rel="noopener">bnfc.nice.org.uk</a><span class="rd"> — clotrimazole 1% and miconazole 2% cream, hydrocortisone 1%, barrier preparations including zinc and castor oil ointment, and the caution on topical corticosteroid potency under occlusion</span></li>'+
         '<li><b>RCPCH / local safeguarding guidance</b><span class="rd"> — assessing safeguarding where a rash is severe, recurrent, untreated or unusually distributed, particularly with poor growth, developmental concerns or other signs of harm, after considering practical barriers</span></li>'+
         '<li><b>MHRA — topical steroid withdrawal reactions</b><br><a href="https://www.gov.uk/drug-safety-update/topical-corticosteroids-information-on-the-risk-of-topical-steroid-withdrawal-reactions" rel="noopener">gov.uk — Drug Safety Update</a><span class="rd"> — caution with prolonged or inappropriate topical steroid use</span></li>'+
         '<li><b>NICE NG143 — Fever in under 5s</b><br><a href="https://www.nice.org.uk/guidance/ng143" rel="noopener">nice.org.uk/guidance/ng143</a><span class="rd"> — infant under 3 months with a temperature of 38°C or above needs urgent same-day paediatric assessment</span></li>'+
         '<li><b>GMMMG Formulary — Skin</b><br><a href="https://www.greatermanchesterformulary.nhs.uk" rel="noopener">greatermanchesterformulary.nhs.uk</a><span class="rd"> — local restrictions on routine primary-care prescribing of barrier and some topical nappy-rash preparations</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Nappy rash — PCDS napkin dermatitis guidance, the BNF for Children, and NICE NG153 for secondary impetigo. A useful sign: irritant dermatitis usually spares the skin folds, while candida commonly involves them with satellite lesions — read it with the overall clinical pattern. With nappy care and a thin barrier preparation at every change, a typical irritant rash begins improving within several days. Topical clotrimazole 1% or miconazole 2% for candida — and examine the mouth, treating oral thrush only if clinically present. Antibiotics only for clinical signs of secondary bacterial infection. A thin layer of hydrocortisone 1% once daily for up to 7 days if markedly inflamed, but never a potent steroid under an occlusive nappy. A rash not improving despite correct treatment is a diagnostic question: reconsider seborrhoeic dermatitis, eczema, psoriasis, impetigo, perianal streptococcal dermatitis, eczema herpeticum and the rare causes — and assess safeguarding where the rash is severe, recurrent, untreated or unusually distributed, considering practical barriers first. Any infant under 3 months with a temperature of 38°C or above needs urgent same-day paediatric assessment. Verify all doses against the BNF for Children before prescribing."
});
