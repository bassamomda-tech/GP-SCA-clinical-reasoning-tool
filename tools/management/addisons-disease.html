  quickSub:"If you read nothing else on this page, read these six cards. Every figure traces to the source cited under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Adrenal crisis: hydrocortisone 100 mg IM/IV before ANY test", html:"Hypotension or collapse, vomiting, abdominal pain, fever, confusion — especially during illness or after missed steroid doses. Give hydrocortisone 100 mg IM or IV immediately and do not wait for cortisol results (NG243: never delay steroids for tests). Anyone — the patient, a relative or a carer — can give the IM injection. Then <b>1 L 0.9% saline IV over 30 minutes</b> (in hospital), treat hypoglycaemia, and <b>call 999 for emergency transfer</b> — do not delay treatment while arranging tests, referral or transport. Adjust fluids in older adults, renal impairment and heart failure. Adrenal crisis causes circulatory collapse, volume depletion, hypoglycaemia and electrolyte disturbance; <b>hyperkalaemia is particularly suggestive of primary adrenal insufficiency</b>, and hypoglycaemia may be more prominent in children and secondary disease. The crisis is reversible with timely steroid."},
    {tone:"amber", h:"Up to 50% of Addison's is first diagnosed AT the crisis", html:"Keep a low threshold in unexplained shock — the new presentation can BE the crisis. The biochemical signature is hyponatraemia + hyperkalaemia (in primary disease) ± hypoglycaemia (and mild hypercalcaemia) — <b>treat empirically while confirming</b>. Take a random cortisol (and ideally ACTH) before the steroid <b>only if it does not delay treatment</b>."},
    {tone:"blue", h:"The chronic picture is mislabelled for over a year", html:"Profound fatigue, weakness, anorexia, weight loss, nausea, postural dizziness — frequently mislabelled as depression, CFS, anorexia or IBS for months to years; the mean delay to diagnosis exceeds a year. The two most discriminating features of primary disease: <b>salt craving</b> (mineralocorticoid deficiency) and <b>hyperpigmentation</b> of palmar creases, buccal mucosa, scars and pressure areas. Low Na⁺ with high K⁺ on routine bloods is the classic trigger to think of it."},
    {tone:"blue", h:"Test: 8–9am cortisol → specialist confirmation → ACTH localises", html:"8–9am cortisol in a stable patient (NICE NG243, modern immunoassays): &lt;150 nmol/L → start management and refer to endocrinology; 151–200 → refer to endocrinology or arrange a short Synacthen test; 201–300 → consider repeating, and if it stays there refer or arrange a short Synacthen test; &gt;300 → very unlikely. <b>Cortisol thresholds are assay-dependent</b> — interpret with the local laboratory and endocrinology, allowing for timing, recent glucocorticoid exposure, oral oestrogen and acute illness; a single cortisol does not establish the cause. Do not use a 9am cortisol to diagnose adrenal insufficiency in someone taking oral glucocorticoids at physiological-equivalent doses or above without specialist advice. The <b>short Synacthen test</b> is a specialist-arranged confirmatory test in most settings (local endocrine protocol; assay-specific threshold). Once deficiency is established, paired ACTH helps localise: high ACTH supports primary disease; low or inappropriately normal ACTH supports secondary/tertiary — where <b>steroid withdrawal is the commonest cause</b>. Discuss interpretation with endocrinology."},
    {tone:"amber", h:"The sick-day rules are the highest-yield intervention", html:"Rule 1 — oral: during significant illness, fever requiring bed rest or infection requiring antibiotics, increase oral hydrocortisone to <b>at least 40 mg daily in 2–4 divided doses</b> (or prednisolone at least 10 mg daily in 1–2 doses), or follow the individual steroid plan, until recovered. Rule 2 — parenteral: vomiting within 30 minutes of a dose → repeat at double the dose once vomiting settles; vomiting again within 30 minutes, or persistent vomiting or diarrhoea preventing absorption → IM hydrocortisone from the emergency kit and attend the emergency department. Surgery, major dental work and colonoscopy prep need peri-procedure parenteral cover. Every patient carries the <b>NHS Steroid Emergency Card (2020) + MedicAlert</b> and <b>two or three in-date IM hydrocortisone emergency kits</b> — and at least one family member or carer is trained to use them. <b>Many adrenal crises are preventable</b> through reliable steroid supply, sick-day education, emergency kits, medical alert identification and early treatment of illness — but crises can still occur despite appropriate management."},
    {tone:"cream", h:"Replacement is physiological — and never stops abruptly", html:"Hydrocortisone 15–25 mg/day in 2–3 divided doses, largest on waking (e.g. 10/5/5 mg), titrated clinically — not to random cortisol or cortisol day curves. Fludrocortisone in PRIMARY disease only, usually started at 50 µg daily and titrated; up to 300 µg daily may be needed, higher only on specialist advice (secondary insufficiency preserves the renin–angiotensin–aldosterone axis). <b>Never stop glucocorticoid abruptly — it precipitates crisis.</b> Over-replacement causes weight gain, hypertension, dysglycaemia and osteoporosis."}

  pathwaySub:"The whole consultation in five moves. The red step is where patients die — do not skip it.",
  pathway:[
    {title:"Crisis? Treat before confirming", html:"Shock, collapse, vomiting, abdominal pain, fever or confusion in known or possible adrenal insufficiency → hydrocortisone 100 mg IM/IV stat + IV saline + 999. Also: people at risk of glucocorticoid-induced adrenal insufficiency who cannot absorb oral steroids because of persistent vomiting or diarrhoea → urgent parenteral hydrocortisone and hospital assessment, following their steroid emergency plan; <b>hypoglycaemia</b> (especially children and secondary disease) → IV glucose + hydrocortisone; <b>Waterhouse–Friderichsen</b> — adrenal haemorrhage in meningococcal or severe sepsis, purpura + shock → 999.", alert:true},
    {title:"Suspect the insidious picture", html:"Fatigue, weight loss, postural dizziness, salt craving, pigmentation; low Na⁺ + high K⁺ ± hypoglycaemia on bloods. Ask explicitly about steroid use — abrupt withdrawal of long-term oral, inhaled or topical steroids is the commonest cause of secondary insufficiency. Ask about pituitary disease, surgery or radiotherapy. Autoimmune clues: personal or family T1DM, thyroid disease, vitiligo, pernicious anaemia, coeliac."},
    {title:"Confirm and localise", html:"8–9am cortisol in a stable patient, interpreted for the local assay with steroid-withholding advice where relevant (NG243: &lt;150 refer and treat; 151–200 refer or short Synacthen; 201–300 consider repeat, then refer or Synacthen; &gt;300 very unlikely); refer urgently to endocrinology if low or indeterminate. Specialist-arranged short Synacthen to confirm, paired ACTH to localise (high = primary, low or inappropriately normal = secondary), U&amp;E, glucose. Antibodies and imaging (adrenal CT, TB screen, pituitary MRI and full axis) are specialist-led."},
    {title:"Replace, and refer to endocrinology", html:"All confirmed or suspected disease → endocrinology for confirmation, cause work-up and initiation. Hydrocortisone 15–25 mg/day divided; fludrocortisone in primary disease, started at 50 µg OD and titrated (usually up to 300 µg) to postural symptoms, BP and U&amp;E, with renin where useful. GP delivers long-term shared care — uninterrupted supply, sick-day reinforcement, monitoring."},
    {title:"Educate, equip, and review", html:"Sick-day rules rehearsed at every contact; NHS Steroid Emergency Card + MedicAlert; two or three in-date IM kits with a family member or carer trained; written sick-day and peri-procedure instructions; flag the medical record. Review more often after diagnosis, dose changes, pregnancy, intercurrent illness or unstable symptoms, and annually once stable: wellbeing, weight, lying/standing BP and pulse, U&amp;E in primary disease (renin only if mineralocorticoid adequacy is uncertain), over-replacement screen, targeted autoimmune screening, bone health."}

    {id:"crisis", nav:"Crisis", title:"Adrenal crisis — recognise and treat before confirming", sub:"The can't-miss emergency. Treatment always precedes confirmatory tests.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Shock + known or possible adrenal insufficiency", html:"Hypotension or postural drop, collapse, vomiting, abdominal pain, fever, confusion → 999 + immediate IM/IV hydrocortisone 100 mg. Often precipitated by illness or steroid withdrawal. Or milder symptoms in someone with known or high-risk adrenal insufficiency — the commoner primary-care presentation."},
         {tone:"red", h:"🔴 Hyponatraemia + hyperkalaemia", html:"Low Na⁺ with raised K⁺ ± hypoglycaemia and mild hypercalcaemia is the classic biochemical signature — treat empirically while confirming. Hyperkalaemia is particularly suggestive of primary disease; it is not expected in isolated secondary or tertiary insufficiency."},
         {tone:"red", h:"🔴 Intercurrent illness / missed steroids", html:"People at risk of glucocorticoid-induced adrenal insufficiency who cannot absorb oral steroids because of persistent vomiting or diarrhoea → urgent parenteral hydrocortisone and hospital assessment; follow the steroid emergency plan where available. Risk depends on steroid type, dose, duration and route, recent taper or withdrawal, intercurrent illness and confirmed HPA-axis suppression."},
         {tone:"red", h:"🔴 Waterhouse–Friderichsen", html:"Adrenal haemorrhage in meningococcal or severe sepsis → purpura + shock → 999."},
         {tone:"red", h:"🔴 Hypoglycaemia", html:"Especially in children and in secondary adrenal insufficiency → treat with IV glucose + hydrocortisone."},
         {tone:"amber", h:"🟠 The new presentation can BE the crisis", html:"Up to 50% of Addison's is diagnosed at first crisis — keep a low threshold in unexplained shock."}
       ]},
       {b:"kv", rows:[
         ["Immediate management","Hydrocortisone 100 mg IM or IV stat — anyone (patient, relative, carer) can give it IM · call 999 for emergency transfer; do not delay treatment while arranging tests, referral or transport · in hospital: 1 L 0.9% saline IV over 30 minutes, then further fluid according to haemodynamics, renal function and cardiac status (adjust in older adults, renal impairment and heart failure) · treat hypoglycaemia · continue hydrocortisone 200 mg over 24 hours by infusion, or 50 mg IM/IV every 6 hours, until stable and absorbing oral medication · identify and treat the precipitant"],
         ["Bloods","Take a random cortisol (and ideally ACTH, U&amp;E and glucose) before the steroid only if it does not delay treatment — treatment always comes first (NG243: never delay steroids for tests)"],
         ["Children","<b>This is an adult primary-care guide.</b> For children and young people, use BSPED age/weight-based emergency guidance and involve paediatric endocrinology — the same principles (hydrocortisone, fluids, rapid transfer) with age-based emergency hydrocortisone doses adopted in NICE NG243 (IM/IV: 25 mg under 1 year, 50 mg 1–5 years, 100 mg 6 years and over)"],
         ["The records","<b>Flag the notes of everyone with known adrenal insufficiency</b> so the crisis risk is visible to every clinician they meet"]
       ]},
       {b:"why", html:"Adrenal crisis carries significant mortality and is reversible with timely steroid — it causes circulatory collapse, volume depletion, hypoglycaemia and electrolyte disturbance (hyperkalaemia particularly in primary disease). Patients cannot mount a stress cortisol response, so any illness or surgery needs extra steroid and missed doses can be fatal: <b>everything else on this page follows from that single fact</b>."}
     ]},

       {b:"table", head:["Ask about","Detail","Why it matters"], rows:[
         ["<b>Core symptoms</b>","<b>Profound fatigue, weakness, anorexia, weight loss, nausea, dizziness</b>","Frequently mislabelled as depression, CFS, anorexia or IBS for months to years"],
         ["<b>Salt craving</b>","<b>Highly suggestive of mineralocorticoid deficiency</b>","One of the <b>two most discriminating clinical features</b> for primary disease"],
         ["<b>Postural symptoms</b>","Dizziness or lightheadedness on standing → postural hypotension from aldosterone deficiency and volume depletion","Points to the mineralocorticoid axis"],
         ["<b>Hyperpigmentation</b>","Primary (Addison's) only: ACTH-driven pigmentation of palmar creases, buccal mucosa, scars and pressure areas. Absent in secondary (pituitary) causes","The other most-discriminating feature — <b>its absence does not exclude the disease</b>"],
         ["<b>Autoimmune clues</b>","Personal or family history of type 1 diabetes, autoimmune thyroid disease, vitiligo, pernicious anaemia, coeliac","Autoimmune polyglandular (Schmidt) syndrome — recognising the cluster shortens the diagnostic journey"],
         ["<b>Steroid history</b>","Abrupt withdrawal of long-term oral, inhaled or topical steroids → secondary (tertiary) adrenal insufficiency. Ask explicitly about steroid use","<b>Steroid withdrawal is the commonest cause of secondary insufficiency</b>"],

    {id:"workup", nav:"Work-up", title:"Investigations — confirm, localise, and find the cause", sub:"Confirm cortisol deficiency, then localise (primary vs secondary), then seek the cause. Never let testing delay treatment in a crisis.",
     blocks:[
       {b:"table", head:["Test","Detail","Interpretation"], rows:[
         ["<b>8–9am serum cortisol — first-line</b>","Stable patient; timed to the circadian peak. Not in someone taking oral glucocorticoids at physiological-equivalent doses or above without specialist advice — steroid withholding before testing only when clinically safe, never if acutely unwell or at risk of crisis","<b>Thresholds are assay-dependent</b> — interpret with the local laboratory and endocrinology, allowing for timing, recent glucocorticoid exposure, oral oestrogen and acute illness; a single result does not establish the cause. NG243 (modern immunoassays): &lt;150 nmol/L → start management and refer · 151–200 → refer to endocrinology or arrange short Synacthen · 201–300 → consider repeat; if it stays there, refer or arrange short Synacthen · &gt;300 → very unlikely; short Synacthen to confirm"],
         ["<b>Short Synacthen test — confirmatory</b>","Specialist-arranged in most settings; dose and sampling times per the local endocrine protocol","The diagnostic cut-off is assay- and laboratory-dependent (modern immunoassays and LC-MS/MS differ) — interpret with endocrinology"],
         ["<b>Plasma ACTH</b>","Paired with cortisol; never delays crisis treatment","Once cortisol deficiency is established: high ACTH supports primary (Addison's) · low or inappropriately normal ACTH supports secondary/tertiary (pituitary/hypothalamic). Acute illness and recent exogenous glucocorticoids can complicate interpretation — discuss with endocrinology"],
         ["<b>U&amp;E / glucose</b>","At presentation","Hyponatraemia, hyperkalaemia, hypoglycaemia, mild hypercalcaemia, raised urea"],
         ["<b>Adrenal autoantibodies</b>","<b>21-hydroxylase antibodies</b>","<b>Positive in autoimmune Addison's — the commonest UK cause</b>"],
         ["<b>Renin / aldosterone</b>","Primary disease","<b>High renin with low aldosterone confirms mineralocorticoid deficiency</b>"],
         ["<b>Cause work-up</b>","Antibody-negative → adrenal CT (TB, haemorrhage, metastases, infiltration) + TB screen · secondary → pituitary MRI + full pituitary axis","Imaging is specialist-led; antibody-negative disease needs imaging"]
       ]},
       {b:"cards", items:[
         {tone:"purple", h:"NG12 criteria that surface in this work-up <span class='tw'>Suspected cancer</span>", html:"Addison's disease itself has no NICE NG12 suspected-cancer criterion, and this page does not invent one. But the cause work-up can surface cancer, and two NG12 routes matter here:<br>• Bilateral adrenal metastases found on CT as the cause of adrenal failure → refer via the appropriate suspected-cancer pathway for the primary — most often lung: NG12 gives chest X-ray (urgent, within 2 weeks) for the smokers over 40 with unexplained weight loss, appetite loss or fatigue that this presentation mimics, and a lung suspected cancer pathway referral for CXR findings suggestive of lung cancer.<br>• The presenting complaint — unexplained weight loss with appetite loss in an adult — is itself an NG12 trigger symptom: if the adrenal work-up is negative, return to it (weight loss with abdominal pain aged 60+ → urgent direct-access CT for pancreatic cancer; consider CXR per above). <b>Do not let a normal Synacthen close the weight-loss question.</b>", src:"NICE NG12 (updated April 2026) · house rule"}
       ]}
     ]},

    {id:"ladder", nav:"Replace", title:"Replacement therapy — named drugs and doses", sub:"Physiological and titrated clinically — lifelong in primary disease; secondary or tertiary insufficiency may recover. Verify doses in the BNF; initiation is specialist-led.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Glucocorticoid", title:"Hydrocortisone 15–25 mg/day in 2–3 divided doses", when:"usually lifelong in primary disease", fromLabel:"first-line",
          html:"Largest dose on waking to mimic the circadian rhythm (e.g. 10/5/5 mg) — the morning-loaded regimen reduces fatigue. Prednisolone once daily is an alternative. Titrate clinically — do not use random cortisol or cortisol day curves for routine titration. Secondary or tertiary adrenal insufficiency may recover, depending on cause and duration; tapering and recovery testing must be supervised by endocrinology."},
         {step:"Mineralocorticoid", title:"Fludrocortisone — start 50 µg once daily", when:"PRIMARY disease only", fromLabel:"not needed in secondary",
          html:"Usually started at 50 micrograms daily and titrated according to postural symptoms, blood pressure, electrolytes and, where useful, plasma renin. Doses up to 300 micrograms daily may be required; higher doses need specialist advice. Not needed in secondary (pituitary) insufficiency because the renin–angiotensin–aldosterone axis is preserved."},
         {step:"Selected", title:"DHEA", when:"specialist-only, non-routine", fromLabel:"not recommended routinely",
          html:"NICE does not recommend routine DHEA replacement. Endocrinology may occasionally consider it in selected women with persistent symptoms despite adequate glucocorticoid and mineralocorticoid replacement — specialist-only."}
       ]},
       {b:"warn", html:"Never stop glucocorticoid abruptly — sudden cessation precipitates crisis. Under-replacement risks crisis; over-replacement causes Cushingoid harm — weight gain, hypertension, dysglycaemia and osteoporosis. Dose adequacy is judged clinically and biochemically, never by a single random cortisol."},
       {b:"why", html:"<b>Replacement aims to reproduce physiological cortisol secretion</b> — the adrenal output the body can no longer make. Mineralocorticoid replacement is the piece the non-specialist forgets: <b>it is required in primary disease only</b>, and it is titrated to postural symptoms, BP and electrolytes, with renin where useful."}
     ]},

    {id:"sickday", nav:"Sick-day rules", title:"Sick-day rules and crisis prevention — the critical education", sub:"The most examinable, life-saving element of the whole condition. Rehearse it at every contact.",
     blocks:[
       {b:"kv", rows:[
         ["Sick-day rule 1 — oral","During significant illness, fever requiring bed rest, or infection requiring antibiotics: increase oral hydrocortisone to at least 40 mg daily in 2–4 divided doses (or prednisolone at least 10 mg daily in 1–2 divided doses), or follow the individual steroid plan, until the acute illness has resolved. Ensure sufficient additional tablets. Individualise for baseline dose, modified-release hydrocortisone, prednisolone or dexamethasone use, severity and duration of illness, pregnancy, diabetes and heart failure"],
         ["Sick-day rule 2 — parenteral","Vomiting within 30 minutes of an oral dose → repeat at double the original dose once vomiting subsides · vomiting recurs within 30 minutes → IM hydrocortisone from the emergency kit and attend the emergency department · persistent vomiting or diarrhoea with inability to absorb steroids → hospital admission and parenteral hydrocortisone"],
         ["Procedures","Surgery, major dental work, colonoscopy prep → peri-procedure parenteral steroid cover per protocol — coordinate it, including for dental work; give written sick-day and peri-procedure instructions"],
         ["Steroid Emergency Card","Issue the NHS Steroid Emergency Card (the 2020 initiative that standardised peri-operative and sick-day management) + a MedicAlert bracelet; ensure it is documented on the records and prescriptions"],
         ["Who needs a card or kit","Diagnosed primary or secondary adrenal insufficiency, and people at risk from exogenous steroids — long-term oral glucocorticoids (e.g. prednisolone 5 mg/day or more, or equivalent, for 4 weeks or more), high-dose inhaled, topical or other steroid exposure, recent steroid withdrawal, or repeated courses with clinical concern. Follow current NHS Steroid Emergency Card guidance and local policy — not every brief inhaled or topical course needs a card"],
         ["Emergency kit","Provide two or three emergency management kits, each with hydrocortisone for IM injection, syringes and needles, written instructions and a steroid emergency card; train the patient AND at least one family member or carer to use it; check the number, location and expiry of kits at review and replace before expiry"],
         ["Never stop abruptly","Sudden cessation precipitates crisis — reinforce adherence at every review"]
       ]},
       {b:"say", html:"Your body can’t make its own steroid hormone any more, so the tablets do that job every day — and when you’re ill, your body would normally make more, so you take the extra dose written on your sick-day plan. If you’re vomiting and can’t keep the tablets down, that’s what the injection is for: anyone can give it, then call for help straight away. Carry your steroid card everywhere, and never stop the tablets suddenly."},
       {b:"why", html:"Many adrenal crises are preventable through reliable steroid supply, sick-day education, emergency kits, medical alert identification and early treatment of illness — though crises can still occur despite appropriate management — and patients who reliably apply the sick-day rules and carry emergency steroid have far fewer life-threatening episodes. The SCA examiner expects explicit, structured safety-netting delivered in plain language: increase the oral dose to the stress dose for significant illness, switch to IM if vomiting, call for help. Empowering family members to inject provides the critical safety margin during severe illness."}
     ]},

    {id:"lifestyle", nav:"Living with it", title:"Self-management and living with adrenal insufficiency", sub:"Self-management is the cornerstone of preventing crisis.",
     blocks:[
       {b:"table", head:["Topic","Advice","Why"], rows:[
         ["<b>Adherence</b>","Non-negotiable medication (lifelong in primary disease). Use reminders or dosette boxes; never run out — order in advance and carry spares when travelling","A missed supply is a crisis risk, not an inconvenience"],
         ["<b>Identification</b>","Carry the Steroid Emergency Card and wear a MedicAlert bracelet at all times","Makes the crisis treatable by strangers"],
         ["<b>Travel</b>","Extra medication and the IM hydrocortisone kit in hand luggage with a doctor's letter; know how to access care abroad","Hold luggage gets lost; crises don't wait"],
         ["<b>Vaccination &amp; infection</b>","Keep immunisations up to date; treat infections promptly and apply the sick-day rules early","Infection is the commonest precipitant"],
         ["<b>Family training</b>","Teach family and carers to recognise crisis and administer the emergency IM hydrocortisone","The patient who needs the injection most may be too unwell to give it"],
         ["<b>Support</b>","<b>Signpost the Addison's Disease Self-Help Group (ADSHG)</b>","Peer support and patient resources"]
       ]}
     ]},

    {id:"monitor", nav:"Monitor", title:"Follow-up and monitoring", sub:"Balance the harms of under- and over-replacement, and screen for the autoimmune cluster when clinically indicated.",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["<b>Symptoms of under- and over-replacement, weight, BP (lying AND standing), pulse, pigmentation where relevant</b>","<b>Each GP/endocrine review</b>","<b>Assess over- vs under-replacement; adjust with endocrinology — do not use random cortisol or cortisol day curves for routine titration</b>"],
         ["<b>U&amp;E (primary disease); renin only if mineralocorticoid adequacy is uncertain</b>","<b>At review</b>","Titrate fludrocortisone to postural symptoms, BP and electrolytes; watch for hypertension, oedema, hypokalaemia or salt craving. Renin is not needed routinely without symptoms of under- or over-replacement"],
         ["<b>Sick-day knowledge, kit and card</b>","<b>Each review — re-educate at every contact</b>","Check the number (two or three), location and expiry of emergency kits; confirm the patient and at least one family member or carer can inject; confirm the card is carried and the record flagged"],
         ["<b>Medication supply, adherence, psychosocial impact and quality of life</b>","Each review","No gaps in supply; support and signposting"],
         ["<b>Over-replacement screen</b>","Each review","Weight gain, hypertension, dysglycaemia, osteoporosis — minimise the glucocorticoid dose accordingly"],
         ["<b>Associated autoimmune disease</b>","<b>When clinically indicated</b> — guided by symptoms, history and previous results","Consider testing for autoimmune thyroid disease, type 1 diabetes, coeliac disease, pernicious anaemia/B12 deficiency, vitiligo and other autoimmune disease"],
         ["<b>Specialist review</b>","<b>More often after diagnosis, dose changes, pregnancy, intercurrent illness or unstable symptoms; may be annual once stable</b>","Coordinate endocrinology follow-up; bone health assessment as indicated"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"📞 999 + IM hydrocortisone", html:"Vomiting, collapse, severe weakness, or any acute illness with shock — give the injection first (anyone can), then 999. Treat first, confirm later."},
         {tone:"amber", h:"🟠 Same-day / urgent", html:"Any acute illness or vomiting in a patient who cannot apply the sick-day rules · a patient found to have stopped their steroid · an expired or missing emergency kit in someone currently unwell."},
         {tone:"blue", h:"🩺 Routine review", html:"Replacement review (annual once stable) · repeat prescriptions with no gaps · immunisations · new symptoms of the autoimmune cluster (thyroid, B12, coeliac, T1DM)."}
       ]},
       {b:"why", html:"Long-term monitoring balances the harms of under- and over-replacement and detects the additional autoimmune conditions that cluster with autoimmune Addison's. Repeated reinforcement of the sick-day rules at every encounter is the highest-yield safety intervention in the chronic care of this disease."}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — who, when, how urgently", sub:"Diagnosis and initiation are specialist-led; the GP delivers long-term shared care.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999 / acute medicine", html:"Suspected adrenal crisis — admit after the first-dose parenteral hydrocortisone and IV fluids. Never delay the steroid for the ambulance."},
         {tone:"amber", h:"Urgent endocrinology", html:"New biochemical or clinical suspicion — low or indeterminate 8–9am cortisol, abnormal Synacthen, suggestive electrolytes — for confirmation, cause work-up and treatment initiation. <b>All confirmed or suspected disease is referred:</b> replacement, sick-day rules, the steroid emergency card and home IM hydrocortisone are initiated under endocrinology."},
         {tone:"blue", h:"Pituitary / neurosurgery", html:"Secondary insufficiency with a pituitary lesion on MRI → joint endocrine and neurosurgical care."},
         {tone:"amber", h:"Oncology <span class='tw'>Suspected cancer</span>", html:"Bilateral adrenal metastases identified on imaging as the cause (e.g. from lung cancer) → manage the primary malignancy via the appropriate suspected-cancer pathway — see the NG12 card under <a href='#workup'>Work-up</a>."},
         {tone:"green", h:"GP manages (shared care)", html:"Repeat prescriptions with no gaps · sick-day reinforcement at every contact · immunisations · monitoring between specialist reviews · coordinating endocrinology review · flagging the record · peri-procedure steroid cover coordination."}
       ]},
       {b:"why", html:"Although diagnosis and stabilisation are specialist-led, primary care is central to safe long-term care: uninterrupted steroid supply, reinforcing the sick-day rules, and recognising decompensation early. Bilateral adrenal metastases are an important non-autoimmune cause and the route into the relevant cancer pathway."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only — the Casebook keeps the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 38-year-old woman attends with eighteen months of exhaustion, half a stone of weight loss and dizziness on standing, previously coded as low mood and tiredness-all-the-time. Bloods last week: Na⁺ 128, K⁺ 5.4. She mentions she has started salting everything she eats. Her sister has coeliac disease."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Connects <b>low Na⁺ + high K⁺</b> with the story rather than repeating the bloods; elicits <b>salt craving</b> and looks for <b>palmar-crease and buccal pigmentation</b> and a <b>postural drop</b>; asks explicitly about <b>steroid use</b>; arranges <b>8–9am cortisol (interpreted for the local assay), U&amp;E, glucose and ACTH</b> with <b>urgent endocrinology referral</b> rather than waiting; safety-nets in plain language — if you start vomiting or feel dramatically worse, that is an emergency: call 999 and say you may have an adrenal problem; and picks up the family autoimmune history. <a href='../../cases/addisons-disease.html'>Open the full casebook chapter →</a>"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>NICE NG243 \u2014 Adrenal insufficiency: identification and management (2024)<br><a href="https://www.nice.org.uk/guidance/ng243" rel="noopener">nice.org.uk/guidance/ng243</a><span class="rd"> \u2014 never delay steroids for tests; hydrocortisone 100 mg IM/IV + fluids first; crisis recognition in known and high-risk patients</span></li>'+
         '<li>Society for Endocrinology — Endocrine Emergency Guidance: emergency management of acute adrenal insufficiency (adrenal crisis) in adult patients (Endocrine Connections, 2016)<br><a href="https://doi.org/10.1530/EC-16-0054" rel="noopener">doi.org/10.1530/EC-16-0054</a><span class="rd"> — the crisis bundle: 100 mg hydrocortisone stat, 1 L 0.9% saline over 30 min with fluids adjusted in older adults, renal impairment and heart failure, treat hypoglycaemia, rapid emergency transfer</span></li>'+
         '<li><b>NHS England \u2014 Steroid Emergency Card (2020)</b><span class="rd"> \u2014 the standardised card, eligibility for people at risk from exogenous steroids, record-flagging and peri-procedure cover</span></li>'+
         '<li><b>NICE NG243 \u2014 adrenal insufficiency</b><span class="rd"> \u2014 the diagnostic thresholds (8\u20139am cortisol &lt;150 / 150\u2013300 / &gt;300 nmol/L, modern immunoassays), assay-dependent interpretation and steroid withholding before testing; at least 40 mg hydrocortisone daily during significant illness; fludrocortisone from 50 micrograms, up to 300 micrograms; two or three emergency kits; no routine cortisol day curves or routine renin</span></li>'+
         '<li><b>Endocrine Society clinical practice guideline — primary adrenal insufficiency (2016, international)</b><span class="rd"> \u2014 replacement titration, DHEA only in selected women (specialist, non-routine), and targeted autoimmune screening</span></li>'+
         '<li><b>BSPED guidance</b><span class="rd"> \u2014 paediatric adrenal crisis: same principles, age-based doses (25 / 50 / 100 mg) as adopted by NG243</span></li>'+
         '<li><b>NICE NG12 \u2014 Suspected cancer (updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> \u2014 the weight-loss trigger symptoms and the lung-cancer CXR and suspected cancer pathway referral routes relevant to adrenal metastases</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> \u2014 verify all doses before prescribing</span></li>'+
         '</ul></div>'}

  foot:"Primary-care recognition, referral and long-term shared care of adrenal insufficiency in adults — NICE NG243 (2024), Society for Endocrinology emergency guidance, NHS Steroid Emergency Card (2020). For children and young people use BSPED guidance and involve paediatric endocrinology. Diagnosis and initiation are specialist-led; assessment and management are merged on this page and the former diagnostic algorithm is retired. Verify every dose against the current BNF and local protocols."
