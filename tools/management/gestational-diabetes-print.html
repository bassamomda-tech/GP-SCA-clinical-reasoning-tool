  quickSub:"If you read nothing else on this page, read these six cards. Every number traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ An HbA1c of 48 or more is NOT gestational diabetes", html:"An HbA1c ≥48 mmol/mol — at booking where it was measured, or at GDM diagnosis, when NICE NG3 asks for it — or a fasting or random glucose in the diabetic range, means undiagnosed pre-existing type 1 or type 2 diabetes. That needs the diabetes-in-pregnancy pathway: tighter surveillance, folic acid 5 mg until 12 weeks, retinal and renal assessment, and aspirin 75–150 mg daily from 12 weeks until birth, because type 1 or type 2 diabetes is a high-risk factor for pre-eclampsia (NICE NG133). Gestational diabetes alone is not."},
    {tone:"amber", h:"The two diagnostic numbers", html:"On a 75 g OGTT, GDM is diagnosed if the fasting plasma glucose is ≥5.6 mmol/L OR the 2-hour glucose is ≥7.8 mmol/L (NICE NG3) — <b>either one alone makes the diagnosis</b>. <b>HbA1c does not diagnose GDM</b>, because pregnancy alters red-cell turnover."},
    {tone:"blue", h:"The fasting glucose picks the starting rung", html:"Fasting &lt;7 mmol/L with no fetal complications → a 1–2 week trial of diet and exercise. <b>Fasting 7 or above at diagnosis → offer insulin immediately</b> — too high for a lifestyle trial. Fasting 6.0–6.9 with macrosomia or hydramnios → <b>consider</b> immediate insulin (NICE NG3)."},
    {tone:"green", h:"Targets are tight on purpose", html:"Fasting below 5.3, 1-hour post-meal below 7.8, or 2-hour below 6.4 mmol/L — and <b>keep above 4</b> to avoid hypoglycaemia on insulin or glibenclamide (NICE NG3). Maternal hyperglycaemia drives fetal overgrowth, and poorly controlled diabetes carries a raised stillbirth risk."},
    {tone:"blue", h:"Growth and liquor scans at 28, 32 and 36 weeks", html:"Every 4 weeks from 28 to 36 weeks (NICE NG3). <b>Macrosomia and polyhydramnios both signal suboptimal control</b> and inform the timing and mode of birth. <b>Advise birth no later than 40+6 weeks, offering elective birth if she has not delivered by then</b>; earlier if there is macrosomia or poor control."},
    {tone:"cream", h:"The postnatal test is the most-missed action in the pathway", html:"Stop all glucose-lowering drugs immediately after birth and check glucose before transfer to community care. Then a fasting plasma glucose at 6–13 weeks postpartum; after 13 weeks, a fasting plasma glucose, or an HbA1c if a fasting test is not possible (NICE NG3). Then an annual HbA1c — because up to half develop type 2 diabetes within about five years."}

         ["HbA1c ≥48 mmol/mol at booking (where measured) or at GDM diagnosis, or fasting/random glucose in the diabetic range","Undiagnosed pre-existing type 1 or type 2 diabetes — NOT gestational diabetes","Manage as diabetes in pregnancy: tighter surveillance, folic acid 5 mg until 12 weeks, retinal and renal assessment, and aspirin 75–150 mg daily from 12 weeks until birth (NICE NG133)"],

       {b:"why", html:"Two acute emergencies threaten both mother and baby here — <b>DKA, which can be euglycaemic in pregnancy</b>, and <b>pre-eclampsia</b>. NICE NG133 lists type 1 and type 2 diabetes among the high-risk factors for which aspirin is advised, but not gestational diabetes on its own — one more reason to separate the two at the start. Running underneath all of it is the unspoken red flag: the raised stillbirth risk of poorly controlled diabetes, which is precisely why glucose targets in pregnancy are so tight and fetal surveillance so structured."},
       {b:"dl", rows:[
         ["<b>NICE NG12 (updated April 2026) stated honestly</b>","Gestational diabetes has no NG12 suspected-cancer criterion, and none should be invented for one. One adjacency is worth carrying forward after the pregnancy rather than during it: NG12 advises considering an urgent direct-access CT (within 2 weeks) to assess for pancreatic cancer in people aged 60 and over with weight loss and new-onset diabetes — irrelevant to an obstetric population, but relevant to the same woman decades later if diabetes emerges alongside unexplained weight loss"]

    {id:"confirm", nav:"Screen &amp; diagnose", title:"Who to screen, when, and the diagnostic thresholds",
     sub:"NICE NG3 screens by risk factor rather than universally, so the screening question is what makes the diagnosis — most GDM is silent.",
     blocks:[
       {b:"dl", rows:[
         ["<b>Risk factors — any ONE triggers an OGTT</b>","BMI above 30 kg/m² · a previous macrosomic baby weighing 4.5 kg or more · previous gestational diabetes · a first-degree relative with diabetes · a minority ethnic family origin with a high prevalence of diabetes (for example South Asian, Black Caribbean, Middle Eastern) — NICE NG3. The GP record often holds the trigger (previous GDM, birthweights, family history), so check it when a pregnancy is first registered"],
         ["<b>Previous GDM</b>","Offer early self-monitoring of blood glucose or a 75 g OGTT as soon as possible after booking, and a further OGTT at 24–28 weeks if the first is normal — this group has the highest recurrence rate"],
         ["<b>All other risk factors</b>","<b>75 g OGTT at 24–28 weeks</b>"],
         ["<b>Not for risk assessment</b>","NICE NG3 advises against using fasting or random glucose, HbA1c, a glucose challenge test or urinalysis to assess the risk of GDM — risk comes from the factors above, and diagnosis is by OGTT"],
         ["<b>Timing trap</b>","A normal early OGTT in a woman with previous GDM does not end the story — it is repeated at 24–28 weeks because insulin resistance rises through the second and third trimesters"],
         ["<b>When the OGTT is unsuitable</b>","After bariatric surgery (dumping risk) or with severe vomiting, agree an alternative such as capillary glucose profiles with the antenatal diabetes team rather than omitting testing"],
         ["<b>Glycosuria on routine testing</b>","2+ on one occasion, or 1+ on two or more occasions → consider further testing for GDM"],
         ["<b>Symptoms</b>","<b>Most GDM is asymptomatic and found on screening</b>, but thirst, polyuria, fatigue or recurrent thrush should prompt glucose testing <b>at any gestation</b>"],
         ["<b>Diagnose GDM if EITHER</b>","Fasting plasma glucose ≥5.6 mmol/L OR 2-hour plasma glucose ≥7.8 mmol/L on the 75 g OGTT (NICE NG3)"],
         ["<b>Overt diabetes, not GDM</b>","HbA1c ≥48 mmol/mol, or fasting ≥7.0, or random ≥11.1 with symptoms — manage as pre-existing diabetes"],
         ["<b>HbA1c in pregnancy</b>","Not used to diagnose GDM — red-cell turnover changes make it unreliable. <b>Measure it at GDM diagnosis</b> to pick out pre-existing type 2 diabetes (NICE NG3); a booking value, where one was taken, does the same job earlier"],
         ["<b>Near-miss results</b>","Values just below the thresholds do not make the diagnosis, but repeat testing is reasonable if symptoms, glycosuria or fetal overgrowth develop later in pregnancy"]
       ]},
       {b:"table", head:["Differential","Recognise it by","Note"], rows:[
         ["<b>Gestational diabetes</b>","Glucose intolerance <b>first recognised in pregnancy</b>, typically second or third trimester, <b>resolving after delivery</b>","The default when OGTT thresholds are met and the HbA1c is below 48"],
         ["<b>Pre-existing type 2 diabetes</b>","Often undiagnosed beforehand — a high booking HbA1c, obesity, strong risk factors, or hyperglycaemia in the first trimester","<b>Needs more intensive management and a different risk conversation</b>"],
         ["<b>New type 1 diabetes</b>","<b>Younger, lean, rapid osmotic symptoms, weight loss, ketosis-prone</b>","<b>A specialist emergency — do not mislabel as GDM</b>"],
         ["<b>Monogenic diabetes (for example glucokinase MODY)</b>","Stable, mildly raised fasting glucose with a small rise on the OGTT, and a parent with lifelong \u201cborderline\u201d glucose","Raise with the specialist team — it changes fetal management and needs genetic testing"],
         ["<b>Drug-induced hyperglycaemia</b>","Systemic corticosteroids for other conditions, some antipsychotics","Review the medication list"],
         ["<b>Transient steroid hyperglycaemia</b>","After <b>antenatal corticosteroids</b> given for fetal lung maturity","Transient; may need short-term insulin cover — not a new diagnosis of GDM"],
         ["<b>Renal glycosuria</b>","<b>Glucose in the urine with a normal blood glucose</b> — a lowered renal threshold, common in pregnancy and benign","Confirm with blood glucose or OGTT before labelling — do not rely on the dipstick"]
       ]},
       {b:"warn", html:"<b>How the diagnosis is delivered matters clinically.</b> Explain that good control greatly reduces the risks, that it often resolves after birth, and that it is not caused by anything she did wrong — addressing guilt and engaging her early genuinely improves outcomes, because reaching tight targets depends on her doing the daily work."},
       {b:"why", html:"The differential matters because pre-existing type 2 diabetes needs more intensive management and a different risk conversation, and new type 1 diabetes is a specialist emergency. Monogenic diabetes is uncommon but easily missed: the persistent, modest fasting rise with a flat OGTT curve and a family pattern is the clue. Steroid hyperglycaemia after antenatal corticosteroids is transient, and pregnancy-related renal glycosuria reflects a lowered renal threshold — both are settled by measuring blood glucose rather than trusting the dipstick."}
     ]},

    {id:"workup", nav:"Targets", title:"Monitoring and fetal surveillance",
     blocks:[
       {b:"table", head:["What","Detail"], rows:[
         ["<b>Self-monitoring of blood glucose</b>","<b>Fasting and 1-hour post-meal capillary glucose</b>"],
         ["<b>Targets</b>","Fasting below 5.3 · 1-hour post-meal below 7.8 · or 2-hour below 6.4 mmol/L. Keep above 4 mmol/L to avoid hypoglycaemia if on insulin or glibenclamide (NICE NG3)"],
         ["<b>Growth and liquor scans</b>","Ultrasound for fetal growth and amniotic fluid volume every 4 weeks from 28 to 36 weeks (28, 32 and 36 — NICE NG3) — more often if there are concerns about macrosomia or polyhydramnios"],
         ["<b>Pre-eclampsia surveillance</b>","<b>Regular BP and urinalysis; aspirin prophylaxis where NICE NG133 criteria are met</b>"],
         ["<b>At every antenatal contact</b>","Review the self-monitoring records and escalate treatment promptly if targets are not met"],
         ["<b>If she sees the GP</b>","Ask for her glucose diary, check BP and urine, ask about fetal movements, and pass any concern to the antenatal diabetes team the same day rather than changing treatment in isolation"]
       ]},
       {b:"why", html:"Management is driven by capillary glucose self-monitoring against deliberately tight targets — a fasting value below 5.3 and a one-hour post-meal value below 7.8 — because maternal hyperglycaemia drives fetal overgrowth and its complications. Serial growth and liquor-volume scans at 28, 32 and 36 weeks detect macrosomia and polyhydramnios, which both signal suboptimal control and inform the timing and mode of birth. The specialist team owns the treatment plan; the GP\u2019s contribution during pregnancy is to spot the obstetric warning signs and route them quickly."}
     ]},

    {id:"ladder", nav:"Treat", title:"Stepwise glucose control — diet → metformin → insulin",
     sub:"Treatment escalates in steps, but the starting rung is decided by the fasting glucose at diagnosis.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Step 1", title:"Diet and exercise — a 1–2 week trial", when:"fasting &lt;7 mmol/L, no fetal complications",
          html:"Low-glycaemic-index carbohydrates, portion control, and regular activity such as walking after meals. Refer to a dietitian. Review glucose in 1–2 weeks. <b>Many women reach target on diet and activity alone</b> — this is genuinely therapeutic, not a holding step."},
         {step:"Step 2", title:"Add metformin", when:"targets not met after the trial",
          fromLabel:"lifestyle insufficient",
          html:"Metformin is the first-line oral medication in pregnancy (NICE NG3). Start low with food and increase weekly as tolerated — <span class='rx'>dose and maximum per BNF</span>. GI upset is the usual limit. If metformin is contraindicated or unacceptable to her, offer insulin instead."},
         {step:"Step 3", title:"Insulin (± metformin)", when:"fasting ≥7 at diagnosis, or 6.0–6.9 with macrosomia or hydramnios, or targets still unmet",
          fromLabel:"straight here if fasting ≥7",
          html:"Offer insulin immediately if the fasting glucose is ≥7 mmol/L at diagnosis — too high for a lifestyle trial — and consider it immediately at 6.0–6.9 mmol/L when there is macrosomia or hydramnios (NICE NG3). Otherwise <b>add it to metformin when diet plus metformin are insufficient</b>. <b>Counsel on hypoglycaemia recognition and treatment.</b>"},
         {step:"Alternative", title:"Glibenclamide", when:"targets unmet on metformin and insulin declined, OR metformin not tolerated",
          fromLabel:"a narrow indication",
          html:"NICE NG3: consider glibenclamide for a woman whose targets are not met on metformin but who declines insulin, or who cannot tolerate metformin. <span class='rx'>Dose per BNF</span>, titrated to response; counsel on hypoglycaemia and keep capillary glucose above 4 mmol/L."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"🥗 Carbohydrate quality", html:"Choose low-glycaemic-index carbohydrates, control portions, and spread intake across meals and snacks to blunt post-meal peaks. <b>Dietitian input is part of standard care.</b>", src:"NICE NG247 (2025) · NICE NG3"},
         {tone:"blue", h:"🚶 Physical activity", html:"A 20–30 minute walk after meals is especially effective at lowering post-prandial glucose. Encourage regular moderate activity unless there is an obstetric contraindication.", src:"NICE NG3"},
         {tone:"amber", h:"⚖️ Weight and gestational gain", html:"Avoid excessive gestational weight gain with healthy-eating advice. <b>Weight loss is not pursued during pregnancy.</b>", src:"NICE NG3"},
         {tone:"amber", h:"🚭 Smoking", html:"Offer referral to stop-smoking support as part of standard antenatal care — smoking compounds fetal growth risk and long-term cardiovascular risk.", src:"NICE NG209 (2021) tobacco"},
         {tone:"blue", h:"🩸 Self-monitoring skills", html:"Teach reliable capillary testing, recognising and treating hypoglycaemia (if on insulin or glibenclamide), <b>and keeping a glucose diary to guide reviews.</b>", src:"NICE NG3"},
         {tone:"green", h:"🤱 Breastfeeding", html:"Encourage it — it benefits maternal glucose metabolism and reduces the child's later obesity and diabetes risk. Metformin and insulin are compatible with breastfeeding.", src:"NICE NG3 · BNF"},
         {tone:"cream", h:"📅 Future pregnancies", html:"Explain the high recurrence rate, the value of pre-conception weight optimisation, and early testing in any future pregnancy.", src:"NICE NG3"}
       ]}
     ]},

    {id:"monitor", nav:"Postnatal", title:"Birth, postnatal care and the long-term follow-up",
     sub:"Two safety priorities bracket the birth — and the second is the most frequently neglected step in the whole pathway.",
     blocks:[
       {b:"table", head:["When","What"], rows:[
         ["<b>Timing of birth</b>","<b>Advise birth no later than 40+6 weeks in GDM, and offer elective birth to women who have not given birth by then (NICE NG3)</b>; earlier if there is macrosomia, poor control or other complications — agreed with obstetrics"],
         ["<b>Immediately after delivery</b>","Stop ALL glucose-lowering medication right after birth, and check blood glucose before transfer to community care to exclude persisting hyperglycaemia. Feed the baby early and monitor neonatal blood glucose — there is a risk of neonatal hypoglycaemia, jaundice and respiratory distress"],
         ["<b>6–13 weeks postpartum</b>","<b>Fasting plasma glucose</b> (NICE NG3)"],
         ["<b>If that window is missed</b>","<b>After 13 weeks: fasting plasma glucose, or HbA1c if a fasting test is not possible</b> (NICE NG3)"],
         ["<b>Reading the result</b>","Fasting glucose below 6.0 mmol/L → low probability of diabetes now, but continuing risk. HbA1c 39–47 mmol/mol → high risk of type 2 diabetes: offer prevention advice and interventions. A result in the diabetic range → confirm and manage as type 2 diabetes (NICE NG3)"],
         ["<b>Then annually</b>","Annual HbA1c (NICE NG3; NICE QS109) — up to half develop type 2 diabetes within about five years, and a meta-analysis found roughly a ten-fold higher risk than after a normoglycaemic pregnancy (Vounzoulaki et al., BMJ 2020)"],
         ["<b>Coding and recall</b>","Code \u201chistory of gestational diabetes\u201d so the annual HbA1c recall and early testing in the next pregnancy happen automatically"],
         ["<b>Prevention</b>","Weight management, diet and activity advice reduce progression to type 2 diabetes. Address pre-conception care for future pregnancies"],
         ["<b>Recurrence</b>","High in future pregnancies — arrange early self-monitoring or an OGTT soon after the next booking"]
       ]},
       {b:"warn", html:"The postnatal glucose test is forgotten in a large proportion of women, and it is the single most important long-term action on this page. Gestational diabetes is a powerful, actionable predictor of future type 2 diabetes — the pregnancy has effectively performed a stress test on her glucose handling and it failed. Make sure the test is coded, requested and followed up, and that she knows why it matters."},
       {b:"cards", items:[
         {tone:"red", h:"🔴 Same-day", html:"<b>Reduced fetal movements</b> · <b>suspected DKA</b> (vomiting, abdominal pain, thirst, breathlessness, ketones — even with a normal-looking glucose) · <b>signs of pre-eclampsia</b> (headache, visual disturbance, epigastric pain, swelling).", src:"NICE NG3 · NICE NG133"},
         {tone:"amber", h:"🟠 Prompt review", html:"<b>Symptomatic hyperglycaemia or hypoglycaemia</b> · targets persistently not met · <b>accelerating growth or polyhydramnios on scan</b>.", src:"NICE NG3"},
         {tone:"blue", h:"🩸 Postnatally", html:"Symptoms of hyperglycaemia after delivery — thirst, polyuria, weight loss → test for diabetes, do not wait for the scheduled check.", src:"NICE NG3"},
         {tone:"green", h:"✅ The two never-miss actions", html:"Stop the glucose-lowering drugs at delivery. Do the 6–13 week fasting glucose test — and code the history so the annual HbA1c follows.", src:"NICE NG3 · NICE QS109"}
       ]},
       {b:"say", html:"Your pregnancy test for diabetes has come back positive, and I want to start by saying clearly that this is not something you caused. What happens is that the placenta makes hormones that work against your own insulin, and in some women the body cannot quite keep up. The reason we treat it carefully is that your glucose crosses to the baby and makes the baby grow larger, which matters for the birth. Most women get their levels where we want them with changes to food and a short walk after meals; some need tablets or insulin, and that is not a failure. It usually goes away after the birth — but I will want a blood test around two to three months afterwards, because up to half of women who have this go on to develop type 2 diabetes within a few years, and that is something we can act on early."}
     ]},

    {id:"refer", nav:"Refer", title:"Referral and shared care",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"Joint diabetes-antenatal clinic", html:"Refer all women with GDM to be seen within 1 week of diagnosis for combined obstetric and diabetes-team care, including a dietitian and a diabetes specialist nurse or midwife.", src:"NICE NG3"},
         {tone:"red", h:"Manage as pre-existing diabetes", html:"HbA1c ≥48 (at booking or at diagnosis), or first-trimester hyperglycaemia → the pre-existing diabetes pathway, with tighter surveillance, folic acid 5 mg until 12 weeks, retinal and renal assessment, and aspirin 75–150 mg daily from 12 weeks.", src:"NICE NG3 · NICE NG133"},
         {tone:"amber", h:"Medication review — pre-existing diabetes", html:"Stop ACE inhibitors, ARBs and statins and review other diabetes drugs as soon as pregnancy is confirmed; agree replacements with the specialist team.", src:"NICE NG3"},
         {tone:"red", h:"Same-day", html:"Suspected DKA, severe pre-eclampsia, reduced fetal movements, or possible new type 1 diabetes → urgent obstetric or specialist assessment.", src:"NICE NG3"},
         {tone:"blue", h:"Neonatal planning", html:"Deliver in a unit with neonatal facilities and alert the neonatal team — risk of neonatal hypoglycaemia, jaundice and respiratory distress.", src:"NICE NG3"},
         {tone:"blue", h:"Anaesthetic / obstetric", html:"Macrosomia or other complications → consultant-led birth planning: timing, mode of birth, and intrapartum glucose control.", src:"NICE NG3"},
         {tone:"blue", h:"What to send", html:"Gestation, both OGTT values, HbA1c, BMI, previous birthweights and any previous GDM, current medicines, and any symptoms — enough for the clinic to decide at triage whether the fasting value puts her straight onto insulin.", src:"NICE NG3"},
         {tone:"cream", h:"The GP's role", html:"Recognise the diagnosis, distinguish pre-existing diabetes, remove drugs unsafe in pregnancy, initiate safe early advice, act urgently on the obstetric and metabolic emergencies while specialist care is arranged — and own the postnatal and annual testing afterwards.", src:"NICE NG3 · NICE QS109"},
         {tone:"blue", h:"NICE NG12 (updated April 2026) — no criterion", html:"Hyperglycaemia in pregnancy maps to no suspected-cancer criterion. The only later-life adjacency — weight loss with new-onset diabetes at 60 or over — is described under red flags.", src:"NICE NG12 (updated April 2026)"}
       ]},
       {b:"why", html:"Prompt referral — within a week of diagnosis, as NICE NG3 recommends — gets dietary advice, monitoring and, where needed, medication started during the window when they most influence fetal growth. The specialist clinic runs the pregnancy; primary care's distinctive contribution is at the two ends: spotting the diagnosis (and the pre-existing diabetes hiding behind it) at the start, and delivering the long-term prevention afterwards."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 32-year-old at 26 weeks in her second pregnancy, BMI 33, whose first baby weighed 4.6 kg. Her OGTT shows a fasting glucose of 5.8 and a 2-hour of 7.2. She is upset and asks whether she has \u201cgiven the baby diabetes\u201d, and mentions her booking HbA1c was 44.", src:"NICE NG3"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"<b>Recognises that a fasting of 5.8 alone makes the diagnosis</b> even though the 2-hour is below 7.8; checks the booking HbA1c and correctly excludes pre-existing diabetes at 44; <b>refers to the joint clinic within a week</b>; gives the <b>actual targets</b> rather than \u201ckeep it down\u201d; starts a <b>1–2 week diet and exercise trial because the fasting is below 7</b>; addresses the guilt explicitly; and — the step candidates miss — books the 6–13 week postnatal glucose test at the point of diagnosis, and explains that up to half develop type 2 diabetes within about five years. Bonus: notes that aspirin is not indicated for GDM alone (NICE NG133).", src:"NICE NG3 · NICE NG133"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG3 — Diabetes in pregnancy: management from preconception to the postnatal period (2015, updated 2020)</b><br><a href="https://www.nice.org.uk/guidance/ng3" rel="noopener">nice.org.uk/guidance/ng3</a><span class="rd"> — the risk-factor screening list and what not to use for risk assessment, the 75 g OGTT thresholds (fasting ≥5.6 / 2-hour ≥7.8 mmol/L), HbA1c at diagnosis, the glycosuria thresholds, joint-clinic review within 1 week, the glucose targets and the floor of 4 mmol/L, the diet→metformin→insulin ladder with the fasting-7 rule and immediate insulin to consider at 6.0–6.9 with complications, the glibenclamide indication, scans every 4 weeks from 28 to 36 weeks, birth by 40+6, stopping ACE inhibitors, ARBs and statins in pre-existing diabetes, and the postnatal testing schedule and its interpretation</span></li>'+
         '<li><b>NICE NG133 — Hypertension in pregnancy (2019)</b><br><a href="https://www.nice.org.uk/guidance/ng133" rel="noopener">nice.org.uk/guidance/ng133</a><span class="rd"> — aspirin 75–150 mg daily from 12 weeks until birth for women at high risk of pre-eclampsia, a group that includes type 1 and type 2 diabetes but not gestational diabetes alone</span></li>'+
         '<li><b>NICE QS109 — Diabetes in pregnancy (2016, updated January 2023)</b><br><a href="https://www.nice.org.uk/guidance/qs109" rel="noopener">nice.org.uk/guidance/qs109</a><span class="rd"> — annual HbA1c after gestational diabetes</span></li>'+

         '<li><b>NICE NG209 — Tobacco: preventing uptake, promoting quitting and treating dependence (2021)</b><br><a href="https://www.nice.org.uk/guidance/ng209" rel="noopener">nice.org.uk/guidance/ng209</a><span class="rd"> — stop-smoking support in pregnancy</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — no criterion applies to gestational diabetes; the only adjacency is the later-life pancreatic route (consider urgent direct-access CT within 2 weeks at 60 and over with weight loss and new-onset diabetes)</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — metformin, insulin and glibenclamide doses, folic acid 5 mg, and aspirin for pre-eclampsia prophylaxis</span></li>'+

  foot:"Gestational diabetes — NICE NG3 (2015, updated 2020), NICE NG133 (2019) and NICE QS109. Diagnostic thresholds on the 75 g OGTT are a fasting glucose of 5.6 mmol/L or above, or a 2-hour glucose of 7.8 mmol/L or above. An HbA1c of 48 mmol/mol or above, at booking or at diagnosis, is pre-existing diabetes, not gestational diabetes. Verify all doses against the current BNF before prescribing."
