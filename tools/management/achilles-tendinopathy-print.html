MG.render({
  icon:"🦵",
  title:"Achilles Tendinopathy",
  eyebrow:"Protocol · assess and manage in one place",
  stemTitle:"Prove the tendon is intact, then load it — slowly and on purpose",
  stemSub:"Gradual load-related Achilles pain is commonly tendinopathy — but rupture, infection, DVT, inflammatory enthesitis and bony pathology must be considered first. This page covers adults, mainly midportion disease; it does not replace local pathways for acute rupture, infection, DVT, enthesitis, malignancy, children or complex partial tears. The two things that go wrong in primary care are a missed complete rupture (a calf-squeeze test settles it in a minute) and a tendon made worse by a fluoroquinolone or a steroid injection. Tendon-loading exercise is the first-line treatment (JOSPT 2024, international); shockwave therapy sits under special arrangements (NICE HTG426).",
  guideline:"JOSPT/APTA midportion Achilles CPG 2024 (international) · NICE HTG426 (2016, migrated 2026) · MHRA DSU fluoroquinolones Mar 2019 and Jan 2024",
  meta:[
    {t:"JOSPT 2024 · international CPG"},
    {t:"NICE HTG426 · HTG299"},
    {t:"MHRA DSU · fluoroquinolones 2019/2024"},
    {t:"UKSTAR · Lancet 2020"},
    {t:"NG12 · sarcoma lump or bone pain", tone:"tw"}
  ],
  lead:"<div class='mg-layers'><a href='#redflags'><b>Is it intact?</b><small>Calf-squeeze test</small></a><a href='#examine'><b>Where is it?</b><small>Midportion or insertion</small></a><a href='#load'><b>Load it</b><small>About 12 weeks</small></a><a href='#refer'><b>Refer</b><small>Same day or routine</small></a></div>",
  quickSub:"Six cards that carry most of the consultation. Each figure is traced under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"A sudden ‘kick’ at the back of the ankle is a rupture until proven otherwise", html:"A snap or the sense of being struck on the heel, followed by weak push-off, is the classic story. Lie the patient prone with feet over the couch edge and squeeze the calf: <b>no plantarflexion = rupture</b>. It is strongly suggestive of complete rupture (Maffulli: sensitivity 0.96) but does not exclude partial, proximal or chronic rupture — an equivocal or discordant result needs urgent specialist assessment. Preserved walking or some plantarflexion does not exclude rupture (accessory plantarflexors). A positive test goes to the fracture clinic or emergency department <b>the same day</b> — do not arrange a routine community ultrasound first.", src:"Maffulli, Am J Sports Med 1998"},
    {tone:"amber", h:"Fluoroquinolones — stop if current; never re-expose", html:"Ciprofloxacin, levofloxacin, moxifloxacin and ofloxacin can cause tendinitis and rupture, most often of the Achilles. Tendon damage can begin <b>within 48 hours</b> of the first dose and can surface <b>months after</b> the course ends. Risk rises over 60, with renal impairment, after solid-organ transplant and with a corticosteroid. If currently taking one, stop it and contact the prescriber for an alternative; if the course has finished, do not re-expose without a documented specialist indication; since January 2024 these antibiotics should only be prescribed when other commonly recommended antibiotics are inappropriate.", src:"MHRA DSU Mar 2019 and Jan 2024"},
    {tone:"green", h:"Tendon-loading exercise is the treatment", html:"Progressive calf-loading, at loads as high as tolerated and usually at least 2–3 times a week, is first-line in the 2024 JOSPT guideline (midportion disease). It should be tailored to the person and paired with education about the condition. Eccentric heel drops, heavy slow resistance and isometrics all fit — no single protocol is mandatory. Complete rest does not help, and continuing sport under a pain-monitoring rule did as well as six weeks of rest in a randomised trial.", src:"JOSPT CPG 2024 (international); Silbernagel, Am J Sports Med 2007"},
    {tone:"red", h:"Do not inject steroid into the Achilles tendon", html:"The Depo-Medrone SPC states that the Achilles tendon should not be injected, because it has no true tendon sheath. Avoid injection around the tendon in routine primary care too (rupture risk, diagnostic uncertainty). If a separate structure such as a bursa is suspected, refer — a specialist may occasionally inject a separate structure under image guidance. Local safety rule: refractory pain → specialist review, not a GP injection.", src:"Depo-Medrone SPC (medicines.org.uk)"},
    {tone:"blue", h:"Shockwave therapy: available, but under special arrangements", html:"NICE HTG426 (formerly IPG571) found no major safety concerns with extracorporeal shockwave therapy for Achilles tendinopathy, but the efficacy evidence is inconsistent and limited in quality and quantity. It is therefore used <b>only with special arrangements</b> for clinical governance, consent and audit or research. Access varies locally and it is a specialist/MSK decision for refractory disease; patients need clear information about the uncertainty.", src:"NICE HTG426 (IPG571, Dec 2016)"},
    {tone:"purple", h:"A growing lump or unexplained bone pain is a sarcoma question", html:"Tendon thickening alone is not a sarcoma red flag; persistent rest or night pain, unexplained bony swelling or a non-mechanical pattern are reasons to reconsider the diagnosis. But NG12 applies to an <b>unexplained lump that is increasing in size</b> (adults: consider an urgent direct access ultrasound within 2 weeks) and to <b>unexplained bone swelling or pain</b> in a child or young person (consider a very urgent direct access X-ray within 48 hours).", src:"NICE NG12 rec 1.11.4 and bone sarcoma recommendations (updated April 2026)"}
  ],
  pathwaySub:"Five moves. The first one is where harm happens if it is skipped.",
  pathway:[
    {title:"Exclude rupture and the other emergencies", html:"Ask about a sudden snap or kick sensation. Do the calf-squeeze test prone on every new posterior ankle pain. Check for a hot, swollen heel with fever (septic bursitis or arthritis), new unilateral calf swelling or tenderness (local DVT pathway), and a growing lump. A positive test, or a convincing rupture history despite an equivocal test = same-day fracture clinic or emergency department — no routine ultrasound first.", alert:true},
    {title:"Place the pain: midportion or insertion", html:"Pinch the tendon from the heel upwards. <b>Midportion</b>: tender, often thickened, roughly 2–6 cm above the heel. <b>Insertional</b>: pain where the tendon meets the calcaneus, sometimes with a bony bump or retrocalcaneal bursitis. The loading programme differs — insertional disease is not taken into dorsiflexion off a step."},
    {title:"Read the drug chart and the story", html:"Fluoroquinolone? Stop it if still taking it; if finished, record a serious suspected adverse reaction so it is not re-prescribed; consider a Yellow Card. Systemic or recent local steroid? Recent training change, new shoes, weight gain, diabetes or raised lipids? Bilateral heel pain with back pain, psoriasis, uveitis or IBD points to enthesitis (NG65)."},
    {title:"Start the loading programme and explain the timescale", html:"Teach a progressive calf-loading programme and refer to physiotherapy where needed. Some discomfort during loading can be acceptable; reduce the load if pain clearly escalates, alters gait, causes a significant next-day flare or morning stiffness keeps worsening. Adjust training rather than stopping all activity. Heel lifts or supportive shoes can reduce pain in the short term. Analgesia only to support rehabilitation — a topical NSAID for localised pain."},
    {title:"Review at 6 and 12 weeks, then escalate", html:"Expect gradual improvement. Review at about 6 weeks if function-limited or adherence is uncertain; at about 12 weeks reassess the diagnosis and progression, and refer to MSK or physiotherapy-led services if little better despite an appropriate programme. Imaging and options such as shockwave therapy are decided there."}
  ],
  sections:[
    {id:"redflags", nav:"Red flags", title:"Red flags — what must not be missed", sub:"Screen every new posterior heel or ankle pain for these before calling it tendinopathy.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Complete Achilles rupture", html:"Sudden pain at the back of the ankle during push-off or landing, often with an audible snap or the feeling of being kicked. Weak plantarflexion and a flat-footed gait. <b>Calf-squeeze (Simmonds–Thompson) test</b>: patient prone, feet over the couch edge; squeezing the calf should plantarflex the foot. No movement is a positive test. An equivocal test does not exclude partial or chronic rupture. <b>Same-day orthopaedic assessment</b>, including for a convincing history with an equivocal test.", src:"Maffulli, Am J Sports Med 1998"},
         {tone:"amber", h:"🟠 Fluoroquinolone exposure", html:"If currently taking a systemic fluoroquinolone, stop it and contact the prescriber for an alternative; protect the tendon; avoid corticosteroids. If the course has finished, do not re-expose without specialist indication. Ask specifically — the reaction can appear months later. Record a serious suspected adverse reaction (not automatically an ‘allergy’), warn about other tendons, neuropathy, weakness or gait change, and consider a Yellow Card without delaying assessment.", src:"MHRA DSU Mar 2019"},
         {tone:"amber", h:"🟠 Enthesitis that is not mechanical", html:"Refer people with enthesitis that has no apparent mechanical cause to rheumatology for a spondyloarthritis assessment. This applies if it is persistent or in several sites, or if there is also back pain without an apparent mechanical cause, current or past uveitis or psoriasis, a gastrointestinal or genitourinary infection, inflammatory bowel disease, or a first-degree relative with spondyloarthritis or psoriasis. A normal CRP/ESR does not exclude it; unilateral mechanical pain after a clear training change does not need rheumatology.", src:"NICE NG65 (2017) rec 1.1.10"},
         {tone:"red", h:"🔴 Hot, swollen heel with fever", html:"A red, hot retrocalcaneal area with fever or systemic upset suggests septic bursitis, osteomyelitis or gout, not tendinopathy. New unilateral calf swelling, tenderness, warmth or disproportionate pain → local suspected-DVT pathway, particularly after rupture or immobilisation — never assume it is the tendon injury. Assess the same day.", src:"clinical practice · NICE NG158 for suspected DVT"},
         {tone:"purple", h:"NG12 — sarcoma", html:"<b>Adults:</b> consider an urgent direct access ultrasound scan (within 2 weeks) for soft tissue sarcoma in an adult with an <b>unexplained lump that is increasing in size</b>. <b>Children and young people:</b> consider a very urgent direct access X-ray (within 48 hours) for bone sarcoma in a child or young person with <b>unexplained bone swelling or pain</b>, for example calcaneal pain with no loading history.", src:"NICE NG12 rec 1.11.4 and bone sarcoma recommendations (updated April 2026)"}
       ]},
       {b:"why", html:"Complete ruptures are missed because the patient can still walk, and sometimes stand on tiptoe, using the long toe flexors and peroneals. A palpable gap fills with haematoma within hours. The calf-squeeze test is quick, needs no equipment, and is the most sensitive of the bedside tests. Doing it on every new posterior heel pain is the habit that prevents the missed rupture."}
     ]},

    {id:"examine", nav:"Examine", title:"Examination — which part of the tendon, and is it really the tendon?", sub:"A clinical diagnosis. Imaging for doubt, suspected partial tear, deterioration, delayed recovery or a specialist decision.",
     blocks:[
       {b:"table", head:["Feature","Midportion tendinopathy","Insertional tendinopathy"], rows:[
         ["<b>Where it hurts</b>","The body of the tendon, typically 2–6 cm above the heel; often a tender, fusiform swelling","Where the tendon inserts into the back of the calcaneus; may coexist with retrocalcaneal bursitis or a prominent posterosuperior calcaneus (Haglund)"],
         ["<b>Pattern</b>","Stiffness on first steps in the morning or after sitting; pain at the start of a run that may ease, then returns afterwards or the next day","Pain with uphill running, stairs and shoes pressing on the heel; worse with dorsiflexion under load"],
         ["<b>Typical person</b>","Runners and jumping-sport athletes; also inactive middle-aged adults, often with raised BMI","Common in older runners and inactive people, often bilateral with increased BMI — not diagnostically defining"],
         ["<b>Loading approach</b>","Full-range loading, including heel drops off a step","Avoid loaded dorsiflexion past neutral while irritable: floor heel raises with a temporary heel lift, bilateral → single-leg → loaded; no heel drops below step level initially"]
       ]},
       {b:"dl", rows:[
         ["<b>History to take</b>","Onset (gradual versus sudden); any snap; recent training change (distance, speed, hills, surface, new shoes); fluoroquinolone or steroid exposure; diabetes, lipids and weight; other enthesis or joint symptoms; what the tendon stops the person doing"],
         ["<b>Look and feel</b>","Compare both sides standing and prone. Palpate the tendon from the calf down to the insertion, noting thickening, nodules, crepitus and the exact point of maximum tenderness. Do the calf-squeeze test on both legs"],
         ["<b>Load tests</b>","Double-leg then single-leg heel raises: count how many the person can do and whether they reproduce the pain. Hopping can be used in athletes. These provide a baseline to compare against at review"],
         ["<b>Imaging</b>","Not needed to make the diagnosis. Ultrasound or MRI for diagnostic uncertainty, suspected partial tear, sudden deterioration, delayed recovery despite rehabilitation, marked asymmetry, or before specialist intervention. X-ray for suspected bony or calcaneal pathology, stress fracture, marked insertional prominence, or unexplained persistent pain (especially in a young person — NG12 bone criteria). Never a substitute for urgent rupture assessment"],
         ["<b>Differentials</b>","Partial or complete rupture; retrocalcaneal or superficial Achilles bursitis; posterior ankle impingement (os trigonum) in dancers and footballers; sural nerve irritation; calcaneal stress fracture; plantaris involvement; referred S1 radicular pain; inflammatory enthesitis; gout or xanthoma in hyperlipidaemia"]
       ]},
       {b:"why", html:"Separating midportion from insertional disease matters because the exercise prescription differs. Taking an irritable insertion into full dorsiflexion off a step compresses the tendon against the heel bone and often makes it worse. The JOSPT guideline covers midportion disease specifically. For insertional disease the recommendations may not generalise; keep the loading principle but limit dorsiflexion, and consider imaging or MSK referral for a marked bony prominence, suspected bursitis, uncertainty or failure to improve."}
     ]},

    {id:"rupture", nav:"Acute rupture", title:"Suspected acute rupture — what to do today", sub:"A positive calf-squeeze test changes the plan from rehabilitation to immobilisation.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Send the same day", html:"Arrange same-day assessment through the local fracture clinic, virtual fracture clinic or emergency department. Secondary care decides operative versus non-operative management and equinus immobilisation. Do not send the patient home to wait for a routine ultrasound.", src:"UKSTAR, Costa et al., Lancet 2020 · Maffulli 1998"},
         {tone:"blue", h:"What happens next — brace or cast", html:"In the UKSTAR trial (39 UK hospitals, patients aged 16 or over treated non-operatively for 8 weeks), early weight-bearing in a functional brace gave outcomes similar to a plaster cast at 9 months on the Achilles Tendon Rupture Score. There was no evidence of a difference in re-rupture. Functional bracing with early weight-bearing is commonly used where appropriate, but treatment depends on the local pathway and patient factors.", src:"UKSTAR, Costa et al., Lancet 2020"},
         {tone:"purple", h:"Driving in a boot — safe control", html:"Do not drive if a boot, pain, weakness or restricted ankle movement prevents safe control of the vehicle. Advise checking with the insurer and current DVLA advice — wearing an Achilles boot does not by itself require DVLA notification. Record the advice.", src:"GOV.UK broken limbs and driving (DVLA)"},
         {tone:"amber", h:"Thromboprophylaxis is decided by the treating team", html:"People discharged with lower-limb immobilisation should have a VTE risk assessment to decide whether they need pharmacological prophylaxis. The fracture clinic or emergency department does this when the boot or cast is applied (NICE QS201); local arrangements take priority. In primary care, check it was done and stay alert for calf swelling, chest pain or breathlessness.", src:"NICE NG89 (2018) — VTE in people with lower-limb immobilisation"}
       ]}
     ]},

    {id:"load", nav:"Loading", title:"The loading programme — the core treatment", sub:"Strengthen the calf–tendon unit progressively and keep the person active within a pain rule.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1", title:"Settle and isometrics", when:"irritable tendon, first 1–2 weeks", html:"Cut back the aggravating load (speed work, hills, jumping) rather than stopping everything. Start holding heel raises (isometric calf contractions) for 30–45 seconds, repeated several times, and double-leg heel raises within comfort. A heel lift in both shoes can reduce pain during daily activity."},
         {step:"2", title:"Build strength", when:"weeks 2–12", fromLabel:"core phase", html:"Progress to single-leg heel raises and then add load. <b>Eccentric option</b>: e.g. the historical Alfredson protocol (heel lowered slowly off a step, knee straight and bent) — one option, not a required regimen; midportion only. <b>Heavy slow resistance</b> (for example calf-raise machine or weighted raises, about 3 times a week) is an alternative that people often find easier to stick to. Choose what the person will actually do."},
         {step:"3", title:"Return to energy-storage activity", when:"when strength is near symmetric", fromLabel:"athletes", html:"Add skipping, hopping and running drills, then gradually return running volume before speed and hills. Keep a strength session going twice a week once back to sport."},
         {step:"4", title:"Not improving after about 3 months of proper adherence", when:"refractory", fromLabel:"escalate", html:"Check the programme was really done and progressed, and re-examine for another diagnosis or partial tear. Refer to MSK or physiotherapy-led services. Options such as shockwave therapy, imaging and a surgical opinion are considered there."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"The pain-monitoring rule", html:"Some discomfort during loading can be acceptable — there is no universal 5/10 threshold. <b>Reduce the load</b> if pain clearly escalates, alters gait, causes a significant next-day flare, morning stiffness worsens week on week, or swelling or bruising develops. In Silbernagel’s trial, continuing activity under a pain-monitoring model did as well as six weeks of rest.", src:"Silbernagel et al., Am J Sports Med 2007"},
         {tone:"green", h:"Education is part of the treatment", html:"The JOSPT guideline recommends education about the condition, self-management and the benefits of staying active. Explain that the tendon is painful and currently load-intolerant, that gradual strengthening is the treatment and complete rest usually does not help — and agree the plan together.", src:"JOSPT CPG 2024 (international)"},
         {tone:"cream", h:"Load modifiers to discuss", html:"Training errors (sudden jumps in mileage, hills, speed); footwear; body weight; sitting all day followed by weekend sport; calf strength deficits. Heel lifts may be used to temporarily reduce dorsiflexion during activity. Intramuscular dry needling of the calf can be used by physiotherapists for calf pain and stiffness when loading is not tolerated.", src:"JOSPT CPG 2024 (international)"},
         {tone:"blue", h:"Where the eccentric programme came from", html:"The eccentric programme (Alfredson 1998, a small historical series) started the loading approach. Later trials show other forms of progressive loading work too, so the principle matters more than the exact protocol.", src:"Alfredson et al., Am J Sports Med 1998"}
       ]}
     ]},

    {id:"adjuncts", nav:"Pain relief", title:"Pain relief and adjuncts — support the rehabilitation, do not replace it", sub:"Nothing here speeds tendon healing on its own. Use it to make the exercise possible.",
     blocks:[
       {b:"table", head:["Option","Place","Point to note"], rows:[
         ["<b>Paracetamol</b>","Simple analgesia to enable loading","Evidence of Achilles-specific benefit is limited. Dose per BNF"],
         ["<b>Topical NSAID</b> (for example diclofenac or ibuprofen gel)","Reasonable first choice for localised pain","Cochrane (Derry 2015) supports topical NSAIDs for acute musculoskeletal pain generally — not an Achilles-specific effect. Minimal systemic absorption. Dose per BNF"],
         ["<b>Oral NSAID</b>","Short course only, at the lowest effective dose — symptom relief, not healing","Assess prior ulcer or GI bleed, renal function and dehydration, heart failure, cardiovascular disease, hypertension, anticoagulants or antiplatelets, corticosteroids or SSRIs, age and frailty; consider gastroprotection. Avoid routinely in pregnancy, particularly later pregnancy. The MHRA contraindicates diclofenac in ischaemic heart disease, peripheral arterial disease, cerebrovascular disease and heart failure (NYHA II–IV). Ibuprofen at 2,400 mg a day or more carries a cardiovascular risk similar to diclofenac, which is not seen at up to 1,200 mg a day. Dose per BNF"],
         ["<b>Corticosteroid injection</b>","<b>Not used</b>","The Depo-Medrone SPC states that the Achilles should not be injected, because it has no true tendon sheath"],
         ["<b>Shockwave therapy</b>","Secondary care or specialist MSK, for refractory disease","Special arrangements for governance, consent and audit or research (NICE HTG426)"],
         ["<b>Autologous blood or PRP injection</b>","Not a primary-care option","Evidence inadequate or uncertain (NICE HTG299) — not offered routinely; if considered, only within specialist governance and consent"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"Oral NSAID cardiovascular cautions", html:"Diclofenac: new contraindications from June 2013 after a review found an arterial thrombotic risk similar to the COX-2 inhibitors. High-dose ibuprofen (2,400 mg a day or more): June 2015 warning of a similar risk. Keep courses short and avoid both in established cardiovascular disease.", src:"MHRA DSU Jun 2013 and Jun 2015"},
         {tone:"blue", h:"Shockwave therapy — what NICE HTG426 says", html:"Shockwaves are passed through the skin to the tendon. Low-energy devices can be repeated without local anaesthetic; high-energy ones may need it. NICE HTG426 advises clinicians to tell their clinical governance leads, make sure patients understand the uncertainty about efficacy, and provide clear information. It is a specialist/MSK decision for refractory disease, and access varies locally.", src:"NICE HTG426 (IPG571, Dec 2016)"}
       ]},
       {b:"warn", html:"<b>No steroid into the Achilles tendon — and no empirical injection around it in primary care.</b> If someone arrives having had one elsewhere, warn them about the risk of rupture and do the calf-squeeze test at every review."}
     ]},

    {id:"medicines", nav:"Medicines review", title:"Medicines that injure tendons — fluoroquinolones in detail", sub:"A drug history is part of every Achilles consultation.",
     blocks:[
       {b:"dl", rows:[
         ["<b>Which drugs</b>","Systemic and inhaled fluoroquinolones (MHRA) — e.g. ciprofloxacin, levofloxacin, moxifloxacin and ofloxacin; also restricted by the GM antimicrobial guideline"],
         ["<b>Timing</b>","Tendon damage can occur within 48 hours of starting treatment. Symptoms may be delayed until several months after stopping"],
         ["<b>Higher-risk groups</b>","Aged over 60; renal impairment; solid-organ transplant recipients; anyone taking a corticosteroid at the same time. Avoid combining a fluoroquinolone with a corticosteroid"],
         ["<b>What to do</b>","If currently taking it: stop at the first sign of tendinitis, contact the prescriber if an antibiotic is still needed, protect the tendon, avoid corticosteroids. If finished: do not re-expose unless a specialist documents a compelling indication. Record a serious suspected adverse reaction; consider a Yellow Card"],
         ["<b>Prescribing rule since January 2024</b>","Systemic fluoroquinolones should only be prescribed when other commonly recommended antibiotics are inappropriate. This is a useful point when explaining to a patient why their antibiotic is being changed"]
       ]},
       {b:"cards", items:[
         {tone:"amber", h:"Fluoroquinolone checklist for the consultation", html:"Ask about any antibiotic course in the last few months, including one prescribed abroad or by a sexual-health or urology service. If a current fluoroquinolone is implicated, stop it and switch if still needed; if the course has finished there is nothing to stop — prevent re-exposure. Record a serious suspected adverse drug reaction visible to future prescribers. Warn about other tendons, neuropathic symptoms, weakness or gait change.", src:"MHRA DSU Mar 2019 and Jan 2024"}
       ]}
     ]},

    {id:"followup", nav:"Follow-up", title:"Follow-up and safety-netting — measuring progress", sub:"Progress is measured against the baseline heel-raise count and what the person can do.",
     blocks:[
       {b:"timeline", items:[
         {n:"1", when:"Day 0", title:"Diagnose and start", html:"Calf-squeeze test normal; drug history checked; loading programme taught or physiotherapy requested; baseline single-leg heel raises recorded; load-monitoring advice explained."},
         {n:"2", when:"About 6 weeks", title:"Check adherence and progression", html:"Is the programme being done (usually at least 2–3 times a week) and has the load increased? Morning stiffness should be settling. If pain is flaring, drop back a step rather than stopping."},
         {n:"3", when:"About 12 weeks", title:"Judge the response", html:"Check adherence and progression, reassess the diagnosis, record function, heel-raise capacity and goals. Little change despite an appropriate programme → refer to MSK or physiotherapy-led services."},
         {n:"4", when:"3–6 months and beyond", title:"Specialist options", html:"Imaging, shockwave therapy under special arrangements and, rarely, a surgical opinion. Keep strengthening meanwhile."}
       ]},
       {b:"say", html:"Come straight back, or go to A&amp;E, if you feel a sudden snap or kick at the back of your heel, or suddenly can’t push off to walk. Also seek urgent help if swelling or bruising rapidly increases, the heel becomes hot and red with fever, your calf swells or hurts, you get chest pain or breathlessness, a lump keeps growing, or you have persistent pain at rest or at night."}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — who, how fast and where", sub:"Most people are managed in primary care with physiotherapy. These are the exceptions.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same day — fracture clinic or emergency department", html:"Positive calf-squeeze test or a history strongly suggesting a complete rupture. Convincing rupture history with an equivocal test. Open injury or neurovascular compromise. Hot swollen heel with fever (septic bursitis or osteomyelitis). Suspected DVT, per the local DVT pathway. Rapidly progressive pain, swelling or loss of function.", src:"Maffulli 1998 · UKSTAR, Lancet 2020 · NICE NG158"},
         {tone:"purple", h:"Suspected cancer pathway — NICE NG12", html:"<b>Adults, soft tissue — 1.11.4</b>: consider an urgent direct access ultrasound scan (to be performed within 2 weeks) to assess for soft tissue sarcoma in adults with an unexplained lump that is increasing in size. <b>1.11.5</b>: consider a suspected cancer pathway referral for adults if the ultrasound findings are suggestive of soft tissue sarcoma, or if the findings are uncertain and clinical concern persists. <b>Adults, bone</b>: consider a suspected cancer pathway referral if an X-ray suggests the possibility of bone sarcoma. <b>Children and young people</b>: consider a very urgent direct access X-ray (to be performed within 48 hours) to assess for bone sarcoma with unexplained bone swelling or pain, and a very urgent referral (appointment within 48 hours) if the X-ray suggests bone sarcoma; for an unexplained lump that is increasing in size, consider a very urgent direct access ultrasound scan (within 48 hours), with very urgent referral if it is suggestive or uncertain and concern persists.", src:"NICE NG12 recs 1.11.4 and 1.11.5, and bone and childhood sarcoma recommendations (updated April 2026)"},
         {tone:"amber", h:"Rheumatology", html:"Enthesitis with no mechanical cause that is persistent, in several places, or occurs alongside back pain without a mechanical cause, uveitis, psoriasis, IBD, a GI or GU infection, or a first-degree relative with spondyloarthritis or psoriasis — refer for spondyloarthritis assessment.", src:"NICE NG65 (2017) rec 1.1.10"},
         {tone:"cream", h:"Physiotherapy — at diagnosis", html:"Anyone who needs help to build or progress a loading programme, athletes planning a return to running, and anyone whose pain is limiting work or daily life.", src:"JOSPT CPG 2024 (international)"},
         {tone:"blue", h:"MSK service or orthopaedics — refractory", html:"Little improvement after about 12 weeks of an appropriate loading programme, diagnostic doubt, suspected partial tear, deterioration, or insertional disease with a marked bony prominence or suspected bursitis. Shockwave therapy, if offered, is under NICE HTG426 special arrangements.", src:"NICE HTG426 (IPG571, Dec 2016)"}
       ]},
       {b:"say", html:"I’ve checked the tendon is intact. It’s painful and can’t take much load at the moment, but gradual strengthening is the treatment — complete rest usually doesn’t help. A little discomfort during the exercises can be fine; ease back if it’s much worse the next morning. We don’t inject steroid into the tendon, because it can weaken it."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only — the Casebook keeps the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 58-year-old man who has taken up running for his weight has 4 weeks of pain and morning stiffness at the back of his right heel. He finished a course of ciprofloxacin for prostatitis 3 weeks ago. He is asking for a steroid injection because his brother had one for tennis elbow, and he wants to know when he can run his charity 10 km.", src:"MHRA DSU Mar 2019 · Depo-Medrone SPC"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Performs the <b>calf-squeeze test</b> and says why. Links the tendon pain to the <b>ciprofloxacin</b>, explains the delayed-onset risk, notes the course has finished so there is nothing to stop, records a serious suspected adverse reaction to prevent re-exposure and suggests a Yellow Card. Declines the <b>steroid injection</b> with a clear reason and without dismissing him. Offers a concrete <b>loading programme</b> with load-monitoring advice and a <b>realistic, individualised timescale</b> for the 10 km. Safety-nets for rupture.", src:"MHRA DSU Mar 2019 · JOSPT CPG 2024 · Maffulli 1998"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Primary sources for every recommendation and figure on this page.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>Chimenti RL et al. — Achilles pain, stiffness and muscle power deficits: midportion Achilles tendinopathy revision – 2024</b> (JOSPT/APTA clinical practice guideline, J Orthop Sports Phys Ther 2024;54(12)) — international; no UK guideline covers GP management<br><a href="https://www.jospt.org/doi/10.2519/jospt.2024.0302" rel="noopener">jospt.org/doi/10.2519/jospt.2024.0302</a><span class="rd"> — midportion disease only; tendon-loading exercise first-line, education, imaging when uncertain or delayed, heel lifts and dry needling as adjuncts</span></li><li><b>Greater Manchester Antimicrobial Guidelines (October 2024)</b><span class="rd"> — local fluoroquinolone restriction</span></li><li><b>NICE QS201 — VTE quality statement 2</b><span class="rd"> — VTE risk assessment for people discharged with lower-limb immobilisation</span></li>'+
         '<li><b>NICE HTG426 — Extracorporeal shockwave therapy for Achilles tendinopathy</b> (published as IPG571, December 2016; migrated to HealthTech guidance January 2026)<br><a href="https://www.nice.org.uk/guidance/htg426" rel="noopener">nice.org.uk/guidance/htg426</a><span class="rd"> — no major safety concerns; efficacy inconsistent and limited; special arrangements for governance, consent and audit or research</span></li>'+
         '<li><b>NICE HTG299 — Autologous blood injection for tendinopathy</b> (published as IPG438, January 2013)<br><a href="https://www.nice.org.uk/guidance/htg299" rel="noopener">nice.org.uk/guidance/htg299</a><span class="rd"> — efficacy inadequate; special arrangements only</span></li>'+
         '<li><b>MHRA Drug Safety Update — Fluoroquinolone antibiotics: new restrictions and precautions (March 2019)</b> and <b>must now only be prescribed when other commonly recommended antibiotics are inappropriate (January 2024)</b><br><a href="https://www.gov.uk/drug-safety-update/fluoroquinolone-antibiotics-must-now-only-be-prescribed-when-other-commonly-recommended-antibiotics-are-inappropriate" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> — onset within 48 hours or months later; higher risk over 60, renal impairment, transplant, corticosteroids; stop at the first sign of tendinitis</span></li>'+
         '<li><b>MHRA Drug Safety Update — Diclofenac: new contraindications and warnings (June 2013)</b>; <b>High-dose ibuprofen (≥2400 mg/day): small increase in cardiovascular risk (June 2015)</b><br><a href="https://www.gov.uk/drug-safety-update/diclofenac-new-contraindications-and-warnings" rel="noopener">gov.uk/drug-safety-update</a></li>'+
         '<li><b>Depo-Medrone 40 mg/ml SPC</b> (electronic medicines compendium)<br><a href="https://www.medicines.org.uk/emc/product/8957/smpc" rel="noopener">medicines.org.uk/emc/product/8957/smpc</a><span class="rd"> — the Achilles tendon should not be injected (no true tendon sheath)</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral</b> (2015, updated April 2026)<br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — recs 1.11.4 and 1.11.5 (adult soft tissue sarcoma ultrasound and referral); very urgent X-ray within 48 hours for children and young people with unexplained bone swelling or pain; suspected cancer pathway referral for an adult X-ray suggesting bone sarcoma</span></li>'+
         '<li><b>NICE NG65 — Spondyloarthritis in over 16s: diagnosis and management</b> (2017)<br><a href="https://www.nice.org.uk/guidance/ng65" rel="noopener">nice.org.uk/guidance/ng65</a><span class="rd"> — rec 1.1.10, referral criteria for enthesitis without a mechanical cause</span></li>'+
         '<li><b>NICE NG89 — Venous thromboembolism in over 16s</b> (2018, updated 2019) and <b>NICE NG158 — Venous thromboembolic diseases</b> (2020, updated 2023)<br><a href="https://www.nice.org.uk/guidance/ng89" rel="noopener">nice.org.uk/guidance/ng89</a><span class="rd"> — VTE risk with lower-limb immobilisation; suspected DVT pathway</span></li>'+
         '<li><b>Maffulli N.</b> The clinical diagnosis of subcutaneous tear of the Achilles tendon. Am J Sports Med 1998;26(2):266–70<br><a href="https://doi.org/10.1177/03635465980260021801" rel="noopener">doi.org/10.1177/03635465980260021801</a><span class="rd"> — calf-squeeze sensitivity 0.96, specificity 0.93; Matles 0.88; palpable gap 0.73</span></li>'+
         '<li><b>Costa ML et al. (UKSTAR).</b> Plaster cast versus functional brace for non-surgical treatment of Achilles tendon rupture. Lancet 2020<br><a href="https://www.thelancet.com/journals/lancet/article/PIIS0140-6736(19)32942-3/fulltext" rel="noopener">thelancet.com</a><span class="rd"> — 39 UK hospitals; similar ATRS at 9 months; no difference in re-rupture</span></li>'+
         '<li><b>Alfredson H et al.</b> Heavy-load eccentric calf muscle training for the treatment of chronic Achilles tendinosis. Am J Sports Med 1998;26(3):360–6<br><a href="https://pubmed.ncbi.nlm.nih.gov/9617396/" rel="noopener">pubmed 9617396</a></li>'+
         '<li><b>Silbernagel KG et al.</b> Continued sports activity, using a pain-monitoring model, during rehabilitation in patients with Achilles tendinopathy. Am J Sports Med 2007;35(6):897–906<br><a href="https://pubmed.ncbi.nlm.nih.gov/17307888/" rel="noopener">pubmed 17307888</a></li>'+
         '<li><b>Derry S et al.</b> Topical NSAIDs for acute musculoskeletal pain in adults. Cochrane Database Syst Rev 2015 (CD007402)<br><a href="https://www.cochranelibrary.com/cdsr/doi/10.1002/14651858.CD007402.pub3/full" rel="noopener">cochranelibrary.com</a></li>'+
         '<li><b>GOV.UK — Broken limbs and driving</b> (DVLA)<br><a href="https://www.gov.uk/broken-limbs-driving" rel="noopener">gov.uk/broken-limbs-driving</a><span class="rd"> — general advice; not an Achilles-specific notification rule</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — all analgesic and NSAID doses</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Achilles tendinopathy in adults: JOSPT/APTA midportion Achilles tendinopathy CPG 2024 (international), NICE HTG426 and HTG299, NICE NG12 (updated April 2026), NICE NG65, MHRA Drug Safety Updates (fluoroquinolones March 2019 and January 2024; diclofenac June 2013; ibuprofen June 2015), the Depo-Medrone SPC, and trial evidence (Maffulli 1998, UKSTAR 2020, Alfredson 1998, Silbernagel 2007). Check all doses in the current BNF. Not a substitute for clinical judgement."
