<script>
MG.render({
  icon:"🦵",
  title:"Achilles Tendinopathy",
  eyebrow:"Protocol · assess and manage in one place",
  stemTitle:"Prove the tendon is intact, then load it — slowly and on purpose",
  stemSub:"A painful, stiff Achilles is usually an overloaded tendon that gets better with a graded calf-strengthening programme. The two things that go wrong in primary care are a missed complete rupture (a calf-squeeze test settles it in a minute) and a tendon made worse by a fluoroquinolone or a steroid injection. Tendon-loading exercise is the first-line treatment (JOSPT 2024, international); shockwave therapy sits under special arrangements (NICE HTG426).",
  guideline:"JOSPT/APTA midportion Achilles CPG 2024 (international) · NICE HTG426 (2016, migrated 2026) · MHRA DSU fluoroquinolones Mar 2019 and Jan 2024",
  meta:[
    {t:"JOSPT 2024 · international CPG"},
    {t:"NICE HTG426 · HTG299"},
    {t:"MHRA DSU · fluoroquinolones 2019/2024"},
    {t:"UKSTAR · Lancet 2020"},
    {t:"NG12 · sarcoma lump or bone pain", tone:"tw"}
  ],
  lead:"<div class='mg-layers'><a href='#redflags'><b>Is it intact?</b><small>Calf-squeeze test</small></a><a href='#examine'><b>Where is it?</b><small>Midportion or insertion</small></a><a href='#load'><b>Load it</b><small>About 12 weeks</small></a><a href='#refer'><b>Refer</b><small>Same day or routine</small></a></div>",
  quickSub:"Six cards that carry most of the consultation. Each figure is traced under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"A sudden ‘kick’ at the back of the ankle is a rupture until proven otherwise", html:"A snap or the sense of being struck on the heel, followed by weak push-off, is the classic story. Lie the patient prone with feet over the couch edge and squeeze the calf: <b>no plantarflexion = rupture</b>. In Maffulli’s series the calf-squeeze test had a <b>sensitivity of 0.96 and specificity of 0.93</b>, better than feeling for a gap (0.73). Walking and tiptoeing on the other muscles do not exclude it. A positive test goes to the fracture clinic or emergency department <b>the same day</b>.", src:"Maffulli, Am J Sports Med 1998"},
    {tone:"amber", h:"Stop the fluoroquinolone", html:"Ciprofloxacin, levofloxacin, moxifloxacin and ofloxacin can cause tendinitis and rupture, most often of the Achilles. Tendon damage can begin <b>within 48 hours</b> of the first dose and can surface <b>months after</b> the course ends. Risk rises over 60, with renal impairment, after solid-organ transplant and with a corticosteroid. The MHRA advice is to stop the drug at the first sign of tendon pain; since January 2024 these antibiotics should only be prescribed when other commonly recommended antibiotics are inappropriate.", src:"MHRA DSU Mar 2019 and Jan 2024"},
    {tone:"green", h:"Tendon-loading exercise is the treatment", html:"Progressive calf-loading, at loads as high as tolerated, is the first-line treatment in the 2024 JOSPT guideline. It should be tailored to the person and paired with education about the condition. Eccentric heel drops, heavy slow resistance and isometrics all fit the principle. Complete rest does not help, and continuing sport under a pain-monitoring rule did as well as six weeks of rest in a randomised trial.", src:"JOSPT CPG 2024 (international); Silbernagel, Am J Sports Med 2007"},
    {tone:"red", h:"Never inject steroid into the Achilles", html:"The Depo-Medrone SPC states that the Achilles tendon should not be injected, because it has no true tendon sheath. A corticosteroid injection risks rupture of a tendon already under load. If the pain is refractory, the next step is specialist review, not a GP injection.", src:"Depo-Medrone SPC (medicines.org.uk)"},
    {tone:"blue", h:"Shockwave therapy: available, but under special arrangements", html:"NICE found no major safety concerns with extracorporeal shockwave therapy for Achilles tendinopathy, but the efficacy evidence is inconsistent and limited in quality and quantity. It is therefore used <b>only with special arrangements</b> for clinical governance, consent and audit or research. Patients need clear written information about the uncertainty.", src:"NICE HTG426 (IPG571, Dec 2016)"},
    {tone:"purple", h:"A growing lump or unexplained bone pain is a sarcoma question", html:"The fusiform thickening of a tendinopathic tendon is not a sarcoma. But NG12 applies to an <b>unexplained lump that is increasing in size</b> (adults: consider an urgent direct access ultrasound within 2 weeks) and to <b>unexplained bone swelling or pain</b> in a child or young person (consider a very urgent direct access X-ray within 48 hours).", src:"NICE NG12 rec 1.11.4 and bone sarcoma recommendations (updated April 2026)"}
  ],
  pathwaySub:"Five moves. The first one is where harm happens if it is skipped.",
  pathway:[
    {title:"Exclude rupture and the other emergencies", html:"Ask about a sudden snap or kick sensation. Do the calf-squeeze test prone on every new posterior ankle pain. Check for a hot, swollen joint or heel (septic bursitis or arthritis), a calf that is swollen and tender (DVT), and a growing lump. A positive calf-squeeze test = same-day fracture clinic or emergency department.", alert:true},
    {title:"Place the pain: midportion or insertion", html:"Pinch the tendon from the heel upwards. <b>Midportion</b>: tender, often thickened, roughly 2–6 cm above the heel. <b>Insertional</b>: pain where the tendon meets the calcaneus, sometimes with a bony bump or retrocalcaneal bursitis. The loading programme differs — insertional disease is not taken into dorsiflexion off a step."},
    {title:"Read the drug chart and the story", html:"Fluoroquinolone in the last few months? Stop it and report on a Yellow Card. Systemic or recent local steroid? Recent training change, new shoes, weight gain, diabetes or raised lipids? Bilateral heel pain with back pain, psoriasis, uveitis or IBD points to enthesitis (NG65)."},
    {title:"Start the loading programme and explain the timescale", html:"Teach a calf-loading programme to do at home and refer to physiotherapy. Explain that pain up to about 5/10 during exercise is acceptable if it settles by the next morning. Adjust training rather than stopping all activity. Heel lifts or supportive shoes can reduce pain in the short term. Offer paracetamol or a topical NSAID for pain if needed."},
    {title:"Review at 6 and 12 weeks, then escalate", html:"Expect gradual, not rapid, improvement: the landmark eccentric programme ran for 12 weeks. If the person has done a structured programme properly for about 3 months and is not improving, refer to MSK or physiotherapy-led services. Imaging and options such as shockwave therapy are decided there."}
  ],
  sections:[
    {id:"redflags", nav:"Red flags", title:"Red flags — what must not be missed", sub:"Screen every new posterior heel or ankle pain for these before calling it tendinopathy.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Complete Achilles rupture", html:"Sudden pain at the back of the ankle during push-off or landing, often with an audible snap or the feeling of being kicked. Weak plantarflexion and a flat-footed gait. <b>Calf-squeeze (Simmonds–Thompson) test</b>: patient prone, feet over the couch edge; squeezing the calf should plantarflex the foot. No movement is a positive test. The Matles test (the affected foot hangs in more dorsiflexion when both knees are bent to 90° prone) had a sensitivity of 0.88. <b>Same-day orthopaedic assessment.</b>", src:"Maffulli, Am J Sports Med 1998"},
         {tone:"amber", h:"🟠 Fluoroquinolone in the last few months", html:"Stop the drug at the first sign of tendon pain or swelling, rest the leg and do not restart it. Avoid a fluoroquinolone together with a corticosteroid. Ask specifically, because the reaction can appear months after the course has finished. Report it on a Yellow Card.", src:"MHRA DSU Mar 2019"},
         {tone:"amber", h:"🟠 Enthesitis that is not mechanical", html:"Refer people with enthesitis that has no apparent mechanical cause to rheumatology for a spondyloarthritis assessment. This applies if it is persistent or in several sites, or if there is also back pain without an apparent mechanical cause, current or past uveitis or psoriasis, a gastrointestinal or genitourinary infection, inflammatory bowel disease, or a first-degree relative with spondyloarthritis or psoriasis.", src:"NICE NG65 (2017) rec 1.1.10"},
         {tone:"red", h:"🔴 Hot, swollen heel with fever", html:"A red, hot retrocalcaneal area with fever or systemic upset suggests septic bursitis, osteomyelitis or gout, not tendinopathy. A swollen, tender calf after a rupture or immobilisation raises the question of DVT. Assess the same day.", src:"clinical practice · NICE NG158 for suspected DVT"},
         {tone:"purple", h:"NG12 — sarcoma", html:"<b>Adults:</b> consider an urgent direct access ultrasound scan (within 2 weeks) for soft tissue sarcoma in an adult with an <b>unexplained lump that is increasing in size</b>. <b>Children and young people:</b> consider a very urgent direct access X-ray (within 48 hours) for bone sarcoma in a child or young person with <b>unexplained bone swelling or pain</b>, for example calcaneal pain with no loading history.", src:"NICE NG12 rec 1.11.4 and bone sarcoma recommendations (updated April 2026)"}
       ]},
       {b:"why", html:"Complete ruptures are missed because the patient can still walk, and sometimes stand on tiptoe, using the long toe flexors and peroneals. A palpable gap fills with haematoma within hours. The calf-squeeze test is quick, needs no equipment, and is the most sensitive of the bedside tests. Doing it on every new posterior heel pain is the habit that prevents the missed rupture."}
     ]},

    {id:"examine", nav:"Examine", title:"Examination — which part of the tendon, and is it really the tendon?", sub:"A clinical diagnosis. Imaging is kept for doubt, a suspected partial tear, or a specialist decision.",
     blocks:[
       {b:"table", head:["Feature","Midportion tendinopathy","Insertional tendinopathy"], rows:[
         ["<b>Where it hurts</b>","The body of the tendon, typically 2–6 cm above the heel; often a tender, fusiform swelling","Where the tendon inserts into the back of the calcaneus; may coexist with retrocalcaneal bursitis or a prominent posterosuperior calcaneus (Haglund)"],
         ["<b>Pattern</b>","Stiffness on first steps in the morning or after sitting; pain at the start of a run that may ease, then returns afterwards or the next day","Pain with uphill running, stairs and shoes pressing on the heel; worse with dorsiflexion under load"],
         ["<b>Typical person</b>","Runners and jumping-sport athletes; also inactive middle-aged adults, often with raised BMI","Older runners and inactive people; commonly bilateral with increased BMI"],
         ["<b>Loading approach</b>","Full-range loading, including heel drops off a step","Avoid dorsiflexion past neutral early on: exercise on the flat floor and use a heel lift"]
       ]},
       {b:"dl", rows:[
         ["<b>History to take</b>","Onset (gradual versus sudden); any snap; recent training change (distance, speed, hills, surface, new shoes); fluoroquinolone or steroid exposure; diabetes, lipids and weight; other enthesis or joint symptoms; what the tendon stops the person doing"],
         ["<b>Look and feel</b>","Compare both sides standing and prone. Palpate the tendon from the calf down to the insertion, noting thickening, nodules, crepitus and the exact point of maximum tenderness. Do the calf-squeeze test on both legs"],
         ["<b>Load tests</b>","Double-leg then single-leg heel raises: count how many the person can do and whether they reproduce the pain. Hopping can be used in athletes. These provide a baseline to compare against at review"],
         ["<b>Imaging</b>","Not needed to make the diagnosis. Ultrasound or MRI is used when the diagnosis is unclear, a partial tear is suspected, or specialist treatment is being planned. An X-ray is needed for suspected bony pathology, including the NG12 bone criteria in a young person"],
         ["<b>Differentials</b>","Partial or complete rupture; retrocalcaneal or superficial Achilles bursitis; posterior ankle impingement (os trigonum) in dancers and footballers; sural nerve irritation; calcaneal stress fracture; plantaris involvement; referred S1 radicular pain; inflammatory enthesitis; gout or xanthoma in hyperlipidaemia"]
       ]},
       {b:"why", html:"Separating midportion from insertional disease matters because the exercise prescription differs. Taking an irritable insertion into full dorsiflexion off a step compresses the tendon against the heel bone and often makes it worse. The JOSPT guideline covers midportion disease specifically. For insertional disease, most clinicians keep the same loading principle but limit dorsiflexion."}
     ]},

    {id:"rupture", nav:"Acute rupture", title:"Suspected acute rupture — what to do today", sub:"A positive calf-squeeze test changes the plan from rehabilitation to immobilisation.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Send the same day", html:"Arrange same-day assessment through the local fracture clinic, virtual fracture clinic or emergency department. Treatment is started in secondary care, usually in equinus (toes pointing down), either operatively or non-operatively. Do not send the patient home to wait for a routine ultrasound.", src:"UKSTAR, Costa et al., Lancet 2020 · Maffulli 1998"},
         {tone:"blue", h:"What happens next — brace or cast", html:"In the UKSTAR trial (39 UK hospitals, patients aged 16 or over treated non-operatively for 8 weeks), early weight-bearing in a functional brace gave outcomes similar to a plaster cast at 9 months on the Achilles Tendon Rupture Score. There was no evidence of a difference in re-rupture. So most patients can expect a boot and early weight-bearing rather than a long period in plaster.", src:"UKSTAR, Costa et al., Lancet 2020"},
         {tone:"purple", h:"Driving in a boot — the driver’s duty", html:"The driver must be able to control the vehicle at all times, and a boot on the right leg usually makes that impossible. GOV.UK guidance on broken limbs and driving (the nearest DVLA guidance for a lower-limb injury) says the driver must tell DVLA if they will be unable to drive for more than 3 months. It also advises checking with the insurer. Advise the patient and record the advice.", src:"GOV.UK broken limbs and driving (DVLA)"},
         {tone:"amber", h:"Thromboprophylaxis is decided by the treating team", html:"People discharged with lower-limb immobilisation should have a VTE risk assessment to decide whether they need pharmacological prophylaxis. The fracture clinic or emergency department does this when the boot or cast is applied. In primary care, stay alert for calf swelling, chest pain or breathlessness during the immobilisation period.", src:"NICE NG89 (2018) — VTE in people with lower-limb immobilisation"}
       ]}
     ]},

    {id:"load", nav:"Loading", title:"The loading programme — the core treatment", sub:"Strengthen the calf–tendon unit progressively and keep the person active within a pain rule.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1", title:"Settle and isometrics", when:"irritable tendon, first 1–2 weeks", html:"Cut back the aggravating load (speed work, hills, jumping) rather than stopping everything. Start holding heel raises (isometric calf contractions) for 30–45 seconds, repeated several times, and double-leg heel raises within comfort. A heel lift in both shoes can reduce pain during daily activity."},
         {step:"2", title:"Build strength", when:"weeks 2–12", fromLabel:"core phase", html:"Progress to single-leg heel raises and then add load. <b>Eccentric option</b>: Alfredson’s protocol lowers the heel slowly off a step with the knee straight and bent, 3 sets of 15 each, twice a day, for 12 weeks. <b>Heavy slow resistance</b> (for example calf-raise machine or weighted raises, about 3 times a week) is an alternative that people often find easier to stick to. Choose what the person will actually do."},
         {step:"3", title:"Return to energy-storage activity", when:"when strength is near symmetric", fromLabel:"athletes", html:"Add skipping, hopping and running drills, then gradually return running volume before speed and hills. Keep a strength session going twice a week once back to sport."},
         {step:"4", title:"Not improving after about 3 months of proper adherence", when:"refractory", fromLabel:"escalate", html:"Check the programme was really done and progressed, and re-examine for another diagnosis. Refer to MSK or physiotherapy-led services. Options such as shockwave therapy, imaging and a surgical opinion are considered there."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"The pain-monitoring rule", html:"Pain up to about <b>5 out of 10</b> during or after exercise is acceptable, as long as it settles by the next morning and morning stiffness is not getting worse week on week. If it is, drop the load back a step. In Silbernagel’s trial, patients who kept running and jumping under this rule did as well as those who stopped for 6 weeks.", src:"Silbernagel et al., Am J Sports Med 2007"},
         {tone:"green", h:"Education is part of the treatment", html:"The JOSPT guideline recommends education about the condition, self-management and the benefits of staying active. Explain that the tendon is an overloaded structure that adapts to graded load, not a tear that needs rest, and agree the plan together.", src:"JOSPT CPG 2024 (international)"},
         {tone:"cream", h:"Load modifiers to discuss", html:"Training errors (sudden jumps in mileage, hills, speed); footwear; body weight; sitting all day followed by weekend sport; calf strength deficits. Heel lifts may be used to temporarily reduce dorsiflexion during activity. Intramuscular dry needling of the calf can be used by physiotherapists for calf pain and stiffness when loading is not tolerated.", src:"JOSPT CPG 2024 (international)"},
         {tone:"blue", h:"Where the eccentric programme came from", html:"In the original eccentric programme, 15 recreational athletes with chronic midportion Achilles tendinosis did 12 weeks of heavy-load eccentric calf training. All returned to their previous running level. Later trials show that other forms of progressive loading work too, so the principle matters more than the exact protocol.", src:"Alfredson et al., Am J Sports Med 1998"}
       ]}
     ]},

    {id:"adjuncts", nav:"Pain relief", title:"Pain relief and adjuncts — support the rehabilitation, do not replace it", sub:"Nothing here speeds tendon healing on its own. Use it to make the exercise possible.",
     blocks:[
       {b:"table", head:["Option","Place","Point to note"], rows:[
         ["<b>Paracetamol</b>","Simple analgesia to enable loading","Dose per BNF"],
         ["<b>Topical NSAID</b> (for example diclofenac or ibuprofen gel)","Reasonable first choice for localised pain","Cochrane (Derry 2015) found topical NSAIDs relieve acute musculoskeletal pain better than placebo, with diclofenac Emulgel having an NNT of 1.8. Minimal systemic absorption. Dose per BNF"],
         ["<b>Oral NSAID</b>","Short course only, at the lowest effective dose","Check GI, renal and cardiovascular risk. The MHRA contraindicates diclofenac in ischaemic heart disease, peripheral arterial disease, cerebrovascular disease and heart failure (NYHA II–IV). Ibuprofen at 2,400 mg a day or more carries a cardiovascular risk similar to diclofenac, which is not seen at up to 1,200 mg a day. Dose per BNF"],
         ["<b>Corticosteroid injection</b>","<b>Not used</b>","The Depo-Medrone SPC states that the Achilles should not be injected, because it has no true tendon sheath"],
         ["<b>Shockwave therapy</b>","Secondary care or specialist MSK, for refractory disease","Special arrangements for governance, consent and audit or research (NICE HTG426)"],
         ["<b>Autologous blood or PRP injection</b>","Not a primary-care option","NICE HTG299 (formerly IPG438): efficacy inadequate; special arrangements only"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"Oral NSAID cardiovascular cautions", html:"Diclofenac: new contraindications from June 2013 after a review found an arterial thrombotic risk similar to the COX-2 inhibitors. High-dose ibuprofen (2,400 mg a day or more): June 2015 warning of a similar risk. Keep courses short and avoid both in established cardiovascular disease.", src:"MHRA DSU Jun 2013 and Jun 2015"},
         {tone:"blue", h:"Shockwave therapy — what NICE says", html:"Shockwaves are passed through the skin to the tendon. Low-energy devices can be repeated without local anaesthetic; high-energy ones may need it. NICE advises clinicians to tell their clinical governance leads, make sure patients understand the uncertainty about efficacy, and give clear written information.", src:"NICE HTG426 (IPG571, Dec 2016)"}
       ]},
       {b:"warn", html:"<b>No steroid into or around the Achilles.</b> If someone arrives having had one elsewhere, warn them about the risk of rupture and do the calf-squeeze test at every review."}
     ]},

    {id:"medicines", nav:"Medicines review", title:"Medicines that injure tendons — fluoroquinolones in detail", sub:"A drug history is part of every Achilles consultation.",
     blocks:[
       {b:"dl", rows:[
         ["<b>Which drugs</b>","Systemic fluoroquinolones — ciprofloxacin, levofloxacin, moxifloxacin and ofloxacin"],
         ["<b>Timing</b>","Tendon damage can occur within 48 hours of starting treatment. Symptoms may be delayed until several months after stopping"],
         ["<b>Higher-risk groups</b>","Aged over 60; renal impairment; solid-organ transplant recipients; anyone taking a corticosteroid at the same time. Avoid combining a fluoroquinolone with a corticosteroid"],
         ["<b>What to do</b>","Stop the fluoroquinolone at the first sign of tendinitis, and do not restart it. Advise rest of the affected tendon, reconsider the antibiotic choice with the prescriber, and report on a Yellow Card"],
         ["<b>Prescribing rule since January 2024</b>","Systemic fluoroquinolones should only be prescribed when other commonly recommended antibiotics are inappropriate. This is a useful point when explaining to a patient why their antibiotic is being changed"]
       ]},
       {b:"cards", items:[
         {tone:"amber", h:"Fluoroquinolone checklist for the consultation", html:"Ask about any antibiotic course in the last few months, including one prescribed abroad or by a sexual-health or urology service. If a fluoroquinolone is implicated, stop it and switch if still needed. Document the reaction as an allergy or intolerance so the drug is not given again. Warn that other tendons can be affected too.", src:"MHRA DSU Mar 2019 and Jan 2024"}
       ]}
     ]},

    {id:"followup", nav:"Follow-up", title:"Follow-up and safety-netting — measuring progress", sub:"Progress is measured against the baseline heel-raise count and what the person can do.",
     blocks:[
       {b:"timeline", items:[
         {n:"1", when:"Day 0", title:"Diagnose and start", html:"Calf-squeeze test normal; drug history checked; loading programme taught or physiotherapy requested; baseline single-leg heel raises recorded; pain rule explained."},
         {n:"2", when:"About 6 weeks", title:"Check adherence and progression", html:"Is the exercise being done most days, and has the load increased? Morning stiffness should be settling. If pain is flaring, drop back a step rather than stopping."},
         {n:"3", when:"About 12 weeks", title:"Judge the response", html:"Most people are improving by now. Keep a maintenance strength session going. If there is little change despite a genuine programme, re-examine and refer to MSK or physiotherapy-led services."},
         {n:"4", when:"3–6 months and beyond", title:"Specialist options", html:"Imaging, shockwave therapy under special arrangements and, rarely, a surgical opinion. Keep strengthening meanwhile."}
       ]},
       {b:"say", html:"Come straight back, or go to A&amp;E, if you feel a sudden snap or kick at the back of your heel, or suddenly can’t push off to walk. Also come back if the heel becomes hot and swollen, if your calf swells, or if a lump appears and keeps growing."}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — who, how fast and where", sub:"Most people are managed in primary care with physiotherapy. These are the exceptions.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same day — fracture clinic or emergency department", html:"Positive calf-squeeze test or a history strongly suggesting a complete rupture. Hot swollen heel with fever (septic bursitis or osteomyelitis). Suspected DVT after immobilisation, per the local DVT pathway.", src:"Maffulli 1998 · UKSTAR, Lancet 2020 · NICE NG158"},
         {tone:"purple", h:"Suspected cancer pathway — NICE NG12", html:"<b>Adults, soft tissue — 1.11.4</b>: consider an urgent direct access ultrasound scan (to be performed within 2 weeks) to assess for soft tissue sarcoma in adults with an unexplained lump that is increasing in size. <b>1.11.5</b>: consider a suspected cancer pathway referral for adults if the ultrasound findings are suggestive of soft tissue sarcoma, or if the findings are uncertain and clinical concern persists. <b>Adults, bone</b>: consider a suspected cancer pathway referral if an X-ray suggests the possibility of bone sarcoma. <b>Children and young people</b>: consider a very urgent direct access X-ray (to be performed within 48 hours) to assess for bone sarcoma with unexplained bone swelling or pain, and a very urgent referral (appointment within 48 hours) if the X-ray suggests bone sarcoma; for an unexplained lump that is increasing in size, consider a very urgent direct access ultrasound scan (within 48 hours), with very urgent referral if it is suggestive or uncertain and concern persists.", src:"NICE NG12 recs 1.11.4 and 1.11.5, and bone and childhood sarcoma recommendations (updated April 2026)"},
         {tone:"amber", h:"Rheumatology", html:"Enthesitis with no mechanical cause that is persistent, in several places, or occurs alongside back pain without a mechanical cause, uveitis, psoriasis, IBD, a GI or GU infection, or a first-degree relative with spondyloarthritis or psoriasis — refer for spondyloarthritis assessment.", src:"NICE NG65 (2017) rec 1.1.10"},
         {tone:"cream", h:"Physiotherapy — at diagnosis", html:"Anyone who needs help to build or progress a loading programme, athletes planning a return to running, and anyone whose pain is limiting work or daily life.", src:"JOSPT CPG 2024 (international)"},
         {tone:"blue", h:"MSK service or orthopaedics — refractory", html:"Little or no improvement after about 3 months of a well-done loading programme, diagnostic doubt, a suspected partial tear, or insertional disease with a large bony prominence. Shockwave therapy, if offered, is under NICE special arrangements.", src:"NICE HTG426 (IPG571, Dec 2016)"}
       ]},
       {b:"say", html:"Your tendon is overloaded rather than torn — I’ve checked that it’s intact. The treatment that works best is a strengthening programme for your calf, done most days for at least three months. Some discomfort during the exercises is fine as long as it has settled by the next morning. We don’t inject steroid here, because it can weaken the tendon."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only — the Casebook keeps the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 58-year-old man who has taken up running for his weight has 4 weeks of pain and morning stiffness at the back of his right heel. He finished a course of ciprofloxacin for prostatitis 3 weeks ago. He is asking for a steroid injection because his brother had one for tennis elbow, and he wants to know when he can run his charity 10 km.", src:"MHRA DSU Mar 2019 · Depo-Medrone SPC"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Performs the <b>calf-squeeze test</b> and says why. Links the tendon pain to the <b>ciprofloxacin</b>, explains the delayed-onset risk, records it as an adverse reaction and suggests a Yellow Card report. Declines the <b>steroid injection</b> with a clear reason and without dismissing him. Offers a concrete <b>loading programme</b> with the pain rule, and a <b>realistic timescale</b> of about 12 weeks for the 10 km. Safety-nets for rupture.", src:"MHRA DSU Mar 2019 · JOSPT CPG 2024 · Maffulli 1998"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Primary sources for every recommendation and figure on this page.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>Chimenti RL et al. — Achilles pain, stiffness and muscle power deficits: midportion Achilles tendinopathy revision – 2024</b> (JOSPT/APTA clinical practice guideline, J Orthop Sports Phys Ther 2024;54(12)) — international; no UK guideline covers GP management<br><a href="https://www.jospt.org/doi/10.2519/jospt.2024.0302" rel="noopener">jospt.org/doi/10.2519/jospt.2024.0302</a><span class="rd"> — tendon-loading exercise first-line, education, heel lifts and dry needling as adjuncts</span></li>'+
         '<li><b>NICE HTG426 — Extracorporeal shockwave therapy for Achilles tendinopathy</b> (published as IPG571, December 2016; migrated to HealthTech guidance January 2026)<br><a href="https://www.nice.org.uk/guidance/htg426" rel="noopener">nice.org.uk/guidance/htg426</a><span class="rd"> — no major safety concerns; efficacy inconsistent and limited; special arrangements for governance, consent and audit or research</span></li>'+
         '<li><b>NICE HTG299 — Autologous blood injection for tendinopathy</b> (published as IPG438, January 2013)<br><a href="https://www.nice.org.uk/guidance/htg299" rel="noopener">nice.org.uk/guidance/htg299</a><span class="rd"> — efficacy inadequate; special arrangements only</span></li>'+
         '<li><b>MHRA Drug Safety Update — Fluoroquinolone antibiotics: new restrictions and precautions (March 2019)</b> and <b>must now only be prescribed when other commonly recommended antibiotics are inappropriate (January 2024)</b><br><a href="https://www.gov.uk/drug-safety-update/fluoroquinolone-antibiotics-must-now-only-be-prescribed-when-other-commonly-recommended-antibiotics-are-inappropriate" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> — onset within 48 hours or months later; higher risk over 60, renal impairment, transplant, corticosteroids; stop at the first sign of tendinitis</span></li>'+
         '<li><b>MHRA Drug Safety Update — Diclofenac: new contraindications and warnings (June 2013)</b>; <b>High-dose ibuprofen (≥2400 mg/day): small increase in cardiovascular risk (June 2015)</b><br><a href="https://www.gov.uk/drug-safety-update/diclofenac-new-contraindications-and-warnings" rel="noopener">gov.uk/drug-safety-update</a></li>'+
         '<li><b>Depo-Medrone 40 mg/ml SPC</b> (electronic medicines compendium)<br><a href="https://www.medicines.org.uk/emc/product/8957/smpc" rel="noopener">medicines.org.uk/emc/product/8957/smpc</a><span class="rd"> — the Achilles tendon should not be injected (no true tendon sheath)</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral</b> (2015, updated April 2026)<br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — recs 1.11.4 and 1.11.5 (adult soft tissue sarcoma ultrasound and referral); very urgent X-ray within 48 hours for children and young people with unexplained bone swelling or pain; suspected cancer pathway referral for an adult X-ray suggesting bone sarcoma</span></li>'+
         '<li><b>NICE NG65 — Spondyloarthritis in over 16s: diagnosis and management</b> (2017)<br><a href="https://www.nice.org.uk/guidance/ng65" rel="noopener">nice.org.uk/guidance/ng65</a><span class="rd"> — rec 1.1.10, referral criteria for enthesitis without a mechanical cause</span></li>'+
         '<li><b>NICE NG89 — Venous thromboembolism in over 16s</b> (2018, updated 2019) and <b>NICE NG158 — Venous thromboembolic diseases</b> (2020, updated 2023)<br><a href="https://www.nice.org.uk/guidance/ng89" rel="noopener">nice.org.uk/guidance/ng89</a><span class="rd"> — VTE risk with lower-limb immobilisation; suspected DVT pathway</span></li>'+
         '<li><b>Maffulli N.</b> The clinical diagnosis of subcutaneous tear of the Achilles tendon. Am J Sports Med 1998;26(2):266–70<br><a href="https://doi.org/10.1177/03635465980260021801" rel="noopener">doi.org/10.1177/03635465980260021801</a><span class="rd"> — calf-squeeze sensitivity 0.96, specificity 0.93; Matles 0.88; palpable gap 0.73</span></li>'+
         '<li><b>Costa ML et al. (UKSTAR).</b> Plaster cast versus functional brace for non-surgical treatment of Achilles tendon rupture. Lancet 2020<br><a href="https://www.thelancet.com/journals/lancet/article/PIIS0140-6736(19)32942-3/fulltext" rel="noopener">thelancet.com</a><span class="rd"> — 39 UK hospitals; similar ATRS at 9 months; no difference in re-rupture</span></li>'+
         '<li><b>Alfredson H et al.</b> Heavy-load eccentric calf muscle training for the treatment of chronic Achilles tendinosis. Am J Sports Med 1998;26(3):360–6<br><a href="https://pubmed.ncbi.nlm.nih.gov/9617396/" rel="noopener">pubmed 9617396</a></li>'+
         '<li><b>Silbernagel KG et al.</b> Continued sports activity, using a pain-monitoring model, during rehabilitation in patients with Achilles tendinopathy. Am J Sports Med 2007;35(6):897–906<br><a href="https://pubmed.ncbi.nlm.nih.gov/17307888/" rel="noopener">pubmed 17307888</a></li>'+
         '<li><b>Derry S et al.</b> Topical NSAIDs for acute musculoskeletal pain in adults. Cochrane Database Syst Rev 2015 (CD007402)<br><a href="https://www.cochranelibrary.com/cdsr/doi/10.1002/14651858.CD007402.pub3/full" rel="noopener">cochranelibrary.com</a></li>'+
         '<li><b>GOV.UK — Broken limbs and driving</b> (DVLA)<br><a href="https://www.gov.uk/broken-limbs-driving" rel="noopener">gov.uk/broken-limbs-driving</a><span class="rd"> — tell DVLA if unable to drive for more than 3 months</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — all analgesic and NSAID doses</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Achilles tendinopathy in adults: JOSPT/APTA midportion Achilles tendinopathy CPG 2024 (international), NICE HTG426 and HTG299, NICE NG12 (updated April 2026), NICE NG65, MHRA Drug Safety Updates (fluoroquinolones March 2019 and January 2024; diclofenac June 2013; ibuprofen June 2015), the Depo-Medrone SPC, and trial evidence (Maffulli 1998, UKSTAR 2020, Alfredson 1998, Silbernagel 2007). Check all doses in the current BNF. Not a substitute for clinical judgement."
