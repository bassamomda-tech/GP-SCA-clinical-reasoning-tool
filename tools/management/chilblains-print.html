  icon:"🥶",

  stemTitle:"A cold-season rash that should behave itself: warm it, protect it, and investigate the one that does not",
  stemSub:"Chilblains are itchy or tender red-purple swellings on the toes, fingers, ears or nose that appear some hours after exposure to cold, damp, non-freezing conditions and fade over one to three weeks. Most are idiopathic and need nothing more than warmth, skin care and a clear explanation. The clinical work is spotting the minority that are secondary — chilblain lupus, cryoglobulins or cold agglutinins, a haematological disorder, arterial insufficiency — and the solitary or non-resolving lesion that deserves a diagnosis rather than automatic labelling as perniosis. Sources: PCDS perniosis and chilblains guidance · BSR SLE guideline 2026 (established SLE) · NHS frostbite guidance · NICE CG147 · NICE NG12 (updated April 2026) · nifedipine SPC and BNF · Rustin et al 1989 · Souwer et al 2016 · Cappel and Wetter 2014.",
  guideline:"PCDS perniosis and chilblains guidance (accessed Sep 2026) · BSR SLE guideline (2026; first edition 2017/18) · NICE CG147 (2012, updated 2020) · NICE NG12 (updated April 2026) · nifedipine SPC and BNF (off-label use)",
  meta:[
    {t:"PCDS · perniosis and chilblains (accessed Sep 2026)"},

    {t:"NICE CG147 (2012, updated 2020) · arterial differential"},

  lead:"<div class='mg-layers'><a href='#recognise'><b>Recognise</b><small>cold, acral, delayed</small></a><a href='#redflags'><b>Rule out</b><small>ischaemia, lupus, melanoma</small></a><a href='#warmth'><b>Treat</b><small>warmth and skin care</small></a><a href='#refer'><b>Refer</b><small>the one that misbehaves</small></a></div>",
  quickSub:"The six points that decide this consultation. Every figure is traced to a named primary source under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"blue", h:"Cold, damp, acral and delayed — that is the pattern", html:"A chilblain is an inflammatory reaction of small skin vessels to <b>cold, damp but non-freezing</b> conditions. Lesions come up some hours after the exposure, itch or burn at first and become tender, and sit on the <b>toes</b>, fingers, heels, ears or nose. In a retrospective specialist-centre series (Mayo Clinic, 104 patients — not population estimates) the toes were affected in 82% and the fingers in 30%, and 79% of patients were women. Individual crops usually fade over one to three weeks, and many people have them every winter.", src:"PCDS perniosis guidance · Cappel and Wetter, Mayo Clin Proc 2014"},
    {tone:"green", h:"Warmth is the main treatment — medicines are a sideline", html:"Evidence for preventive measures comes mainly from clinical guidance and experience rather than high-quality trials. Keep the whole body warm, not just the feet: insulated socks, gloves and footwear, a heated home, and less time in cold, damp conditions. The PCDS also advises avoiding things that constrict skin vessels, such as <b>caffeine and decongestants</b>. Most idiopathic chilblains settle with these measures alone.", src:"PCDS perniosis guidance"},
    {tone:"amber", h:"Persistent, ulcerating or out of season = look for a cause", html:"When the lesions are <b>more severe or persistent, ulcerate or necrose</b>, or sit alongside other significant skin changes, the PCDS advises investigating for <b>connective tissue disease, cryoglobulinaemia and haematological malignancy</b>. Lesions that persist into warm months, affect unusual sites, or come with joint pain, photosensitive rash, mouth ulcers or systemic symptoms belong in this group.", src:"PCDS perniosis guidance"},
    {tone:"amber", h:"Lupus is an important secondary cause", html:"Connective-tissue disease, particularly <b>lupus erythematosus</b>, is an important secondary cause of chilblain-like lesions; chilblain lupus is a form of cutaneous lupus. Consider it where lesions persist beyond the cold season, scar, ulcerate, or occur with other lupus features. If lupus is suspected, the PCDS advises sending <b>both ANA and ENA</b>, because some cutaneous lupus is ANA-negative but ENA-positive. If SLE or cutaneous lupus is suspected, refer or discuss with rheumatology/dermatology; hydroxychloroquine is usually specialist-led, particularly where the diagnosis is uncertain or systemic disease is possible.", src:"Dubey et al, Rheumatology 2022 · PCDS · BSR SLE guideline 2026"},
    {tone:"cream", h:"Nifedipine: off-label, with conflicting trials", html:"Nifedipine is licensed in the UK for Raynaud’s phenomenon, not chilblains. Nifedipine may benefit some patients, but evidence is inconsistent: a small 1989 placebo-controlled trial suggested benefit; a 2016 primary-care crossover RCT found no benefit over placebo (trial details under Medicines). Consider it only for severe, recurrent or disabling disease after preventive measures have been tried; explain the off-label use, specify the formulation, and check the dose against the current product information and local prescribing guidance. Start cautiously, particularly where baseline blood pressure is low.", src:"Rustin et al, Br J Dermatol 1989 · Souwer et al, Ann Fam Med 2016 · nifedipine SPC"},
    {tone:"purple", h:"A solitary or non-resolving lesion deserves a diagnosis", html:"A solitary, persistent, changing, bleeding, nodular or periungual lesion should not be assumed to be a chilblain. Amelanotic or non-pigmented melanoma is possible (sole, palm, nail unit) — use the clinical appearance and NICE referral criteria rather than pigmentation alone; examine with dermoscopy if trained. If suspicion remains but criteria are not met, use dermatology advice-and-guidance or urgent dermatology referral with safety-netting. NICE NG12: <b>refer people using a suspected cancer pathway referral for melanoma if they have a suspicious pigmented skin lesion with a weighted 7-point checklist score of 3 or more</b>; and <b>consider a suspected cancer pathway referral for melanoma in people with a pigmented or non-pigmented skin lesion that suggests nodular melanoma</b>.", src:"NICE NG12 recs 1.7.1 and 1.7.3 (updated April 2026)"}
  ],
  pathwaySub:"Five moves. The red one is where ischaemia, lupus and melanoma get filed as ‘just chilblains’.",
  pathway:[
    {title:"Screen out what it is not", html:"<b>Acute limb ischaemia or a cold, pale, pulseless or neurologically compromised digit</b> (emergency — immediate vascular assessment, do not wait for ABPI) · <b>ulceration, necrosis, black or white digits, rest pain or absent foot pulses</b> (chronic limb-threatening ischaemia, cryoglobulinaemic vasculitis) · a <b>single persistent, changing or bleeding acral lesion</b> (melanoma, especially under or around a nail) · <b>palpable purpura</b> or lesions above the ankles (vasculitis) · <b>tissue frozen hard and white after sub-zero exposure</b> (frostbite, an emergency) · <b>systemic features</b>: fever, weight loss, arthritis, photosensitive rash, mouth ulcers. Any of these changes the destination.", alert:true},
    {title:"Confirm the typical picture", html:"Ask about the <b>cold, damp exposure</b> and the delay of hours before the lesions appeared, previous winters, footwear and heating, smoking, weight and eating, and other symptoms. Examine every digit, the ears and the heels; <b>feel the foot pulses</b>, check skin temperature and capillary refill; look at the nail folds, for ulcers, purpura, livedo or necrosis, at the face and the mouth, and at any solitary or periungual lesion. Typical symmetrical seasonal lesions in a well person, with normal pulses and no ulceration, systemic features or diagnostic uncertainty, usually do not require routine blood tests."},
    {title:"Warm, protect and explain", html:"Whole-body warmth, insulated socks, gloves and footwear, a warm home, dry feet, and avoiding caffeine and decongestants (PCDS). Rewarm cold extremities gently rather than in front of direct heat. Review vasoconstricting medicines where appropriate; emollient and simple analgesia. Keep blistered or broken skin clean and covered; do not scratch. Secondary bacterial infection needs separate assessment and treatment per local antimicrobial guidance — do not assume all painful or ulcerated chilblains are infected. Set the expectation: <b>each crop fades over one to three weeks</b>."},
    {title:"Investigate the atypical", html:"Persistent, ulcerating or out-of-season lesions, or systemic features: tests are directed by the clinical picture. <b>Connective-tissue disease suspected:</b> FBC, renal function, urinalysis for blood/protein, ANA, ENA, anti-dsDNA where appropriate, C3/C4, ESR or CRP. <b>Vasculitis or cryoprotein disease suspected:</b> add blood film, rheumatoid factor, immunoglobulins and electrophoresis, hepatitis B/C and HIV where indicated, and cryoglobulins/cold agglutinins with the lab or specialist (temperature-controlled sample). Manual Doppler ABPI if pulses are reduced (NICE CG147)."},
    {title:"Treat severe recurrent disease and refer the unexplained", html:"Severe, recurrent, disabling chilblains despite good preventive measures: discuss <b>off-label nifedipine</b> for the cold season (specify the formulation; check the exact SPC and local prescribing guidance). Refer <b>dermatology</b> for diagnostic doubt or biopsy, <b>rheumatology</b> for suspected lupus or other connective tissue disease, <b>vascular</b> for arterial insufficiency, and refer a suspicious solitary acral lesion urgently if <b>NICE NG12 melanoma criteria</b> are met (otherwise advice-and-guidance or urgent dermatology). Use local Greater Manchester vascular, dermatology and laboratory pathways."}
  ],
  sections:[
    {id:"recognise", nav:"Recognise", title:"Recognising a chilblain", sub:"An inflammatory, not a freezing, cold injury. The diagnosis is clinical and rests on the season, the site and the timing.",
     blocks:[
       {b:"table", head:["Feature","Typical finding","Why it matters"], rows:[
         ["<b>Trigger</b>","Cold combined with <b>damp</b>, at temperatures above freezing; typical in a UK autumn and winter","Damp, poorly heated homes and wet footwear are more relevant than extreme cold. Tissue that actually froze is frostbite, a different injury"],
         ["<b>Timing</b>","Lesions appear <b>hours</b> after the exposure, not during it; each crop fades over <b>one to three weeks</b>","Colour change during the cold exposure itself and recovering within minutes to hours is Raynaud’s phenomenon"],
         ["<b>Look</b>","Red to purple (violaceous) swellings, papules or plaques; may blister or erode; often symmetrical","Crusting, ulceration or necrosis moves the case into the ‘look for a cause’ group"],
         ["<b>Symptoms</b>","Itch and burning at first, then tenderness","Severe constant pain at rest is not typical — think ischaemia"],
         ["<b>Sites</b>","Toes (82% in a retrospective specialist-centre series), fingers (30%), heels, ears, nose","Unusual sites or a single lesion widen the differential"],
         ["<b>Who</b>","More often women (79% in that retrospective specialist-centre series — not a population estimate); a mean age at diagnosis of 38 in that series; associations include low body weight and a family tendency","Very low body weight (for example anorexia nervosa) is a contributory factor to ask about sensitively"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"🔎 What the history must cover", html:"Cold and damp exposure (work, commute, outdoor sport, heating at home), how many winters this has happened, <b>whether lesions clear in spring</b>, smoking, weight and eating, medicines that constrict vessels, and a systems enquiry for lupus: joint pain or swelling, photosensitive rash, mouth ulcers, hair loss, dry eyes or mouth, Raynaud’s attacks, fever or weight loss.", src:"PCDS perniosis guidance · BSR SLE guideline 2026"},
         {tone:"blue", h:"🦶 What the examination must cover", html:"All ten toes and fingers, heels, ears and nose; nail folds (dilated or dropped-out capillaries suggest connective tissue disease); <b>femoral, popliteal and foot pulses</b>; skin temperature and capillary refill; the face, scalp and mouth for discoid or other lupus lesions; and any solitary lesion with dermoscopy.", src:"NICE CG147 · LeRoy and Medsger 1992 (international)"}
       ]},
       {b:"why", html:"The underlying mechanism is an abnormal vascular response to cold: prolonged constriction of small skin arterioles, then an inflammatory reaction around the vessels as they reperfuse. That is why lesions come up <b>after</b> the exposure, why damp (which conducts heat away) matters as much as temperature, and why rapid rewarming of a cold, constricted digit tends to make the inflammation worse."}
     ]},

    {id:"redflags", nav:"Red flags", title:"Red flags and what must not be missed", sub:"Most chilblains are harmless. These features mean the lesion is either not a chilblain, or a chilblain with a cause.",
     blocks:[
       {b:"warn", html:"<b>Emergency:</b> acute limb ischaemia, a cold, pale or pulseless digit, rapidly progressive tissue loss or severe rest pain — arrange immediate vascular assessment and do not delay transfer for ABPI; suspected frostbite (hard, white, numb after sub-zero exposure) — emergency assessment; systemic illness with suspected vasculitis or infection. <b>Urgent:</b> ischaemic rest pain, non-healing ulceration, gangrene or tissue loss (chronic limb-threatening ischaemia) — urgent vascular assessment. <b>Soon:</b> ulceration, necrosis, palpable purpura, systemic upset or lesions that persist into the warm months need investigation. <b>Urgent dermatology / suspected cancer pathway if NICE criteria are met:</b> a solitary acral lesion that is changing, bleeding or involves the nail unit."},
       {b:"cards", cols:2, items:[
         {tone:"red", h:"🚨 Acute or chronic limb-threatening ischaemia", html:"<b>Acute limb ischaemia</b> — sudden painful, pale or cold limb/digit, pulselessness, paraesthesia, weakness or paralysis: immediate emergency vascular assessment / 999-supported transfer; do not wait for an ABPI or outpatient referral. <b>Chronic limb-threatening ischaemia</b> — ischaemic rest pain, non-healing ulceration, gangrene or tissue loss with reduced or absent pulses: urgent vascular assessment; NICE CG147 says all people with critical limb ischaemia should be assessed by a vascular multidisciplinary team. Examine the legs and feet and check femoral, popliteal and foot pulses. ABPI: use manual Doppler and document waveforms; do not exclude PAD in diabetes solely because the ABPI is normal or raised (above about 1.4 may indicate incompressible vessels) — consider toe pressures, waveform analysis or imaging if suspicion remains.", src:"NICE CG147 (2012, updated 2020)"},
         {tone:"red", h:"🧊 Frostbite", html:"Freezing injury after sub-zero exposure: skin that was hard, white or waxy and numb, later blistering (clear or blood-filled) or turning black. This is not a chilblain. Suspected frostbite requires emergency assessment. Treat hypothermia first; remove constricting jewellery or clothing; protect from further cold and avoid refreezing; do not rub, massage or apply direct dry heat (no radiators, fires or hot-water bottles). Controlled rewarming (warm-water bath where appropriate and safe) and analgesia are undertaken according to emergency-care guidance, with specialist assessment as needed.", src:"NHS — Frostbite"},
         {tone:"amber", h:"🟠 Features of connective tissue disease", html:"Chilblains outside winter, lesions with scale or scarring, <b>arthralgia or synovitis, photosensitive or malar rash, mouth ulcers, alopecia, Raynaud’s with digital ulcers</b>, or abnormal nail-fold capillaries. Send ANA and ENA (both — some cutaneous lupus is ANA-negative, ENA-positive), with FBC, renal function, urinalysis, C3/C4 and anti-dsDNA where appropriate, and refer or discuss with rheumatology/dermatology if positive or clinically convincing.", src:"PCDS · BSR SLE guideline 2026 · Dubey et al, Rheumatology 2022"},
         {tone:"amber", h:"🟠 Blood and protein disorders", html:"Chilblain-like lesions that ulcerate, sit alongside purpura or livedo, or occur in an older person with systemic symptoms: consider <b>cryoglobulinaemia, cold agglutinins and haematological malignancy</b>. In a retrospective specialist-centre series (Mayo; not population estimates) 3% had an associated haematological malignancy and cold agglutinins were positive in 11 of the 20 patients tested.", src:"PCDS perniosis guidance · Cappel and Wetter, Mayo Clin Proc 2014"},
         {tone:"purple", h:"🎗 Acral melanoma mimicking a chilblain", html:"One lesion rather than a crop, on a sole, heel, palm or nail unit, that <b>does not fade with warmth over a few weeks</b>, is growing, changing colour, bleeding, or spreading into the nail fold. Nail unit: longitudinal pigmented nail-band change, pigment extending onto the proximal or lateral nail fold, a ‘haematoma’ that fails to grow out as expected, or nail dystrophy with periungual extension → urgent dermatological assessment via the local suspected skin-cancer pathway. Do not excise a lesion suspected to be melanoma in primary care unless the local skin-cancer pathway specifically supports it. NICE NG12 rec 1.7.1: <b>refer people using a suspected cancer pathway referral for melanoma if they have a suspicious pigmented skin lesion with a weighted 7-point checklist score of 3 or more.</b> Rec 1.7.3: <b>consider a suspected cancer pathway referral for melanoma in people with a pigmented or non-pigmented skin lesion that suggests nodular melanoma.</b>", src:"NICE NG12 recs 1.7.1 and 1.7.3 (updated April 2026)"},
         {tone:"amber", h:"🟠 Vasculitis", html:"Palpable purpura, lesions spreading up the legs, haematuria or proteinuria, or systemic upset. Check urine for blood and protein and quantify proteinuria with urine ACR/PCR if dip-positive or renal involvement is suspected; check renal function; lower threshold for biopsy and specialist input. A positive urine dip alone is not diagnostic of vasculitis or lupus."}
       ]}
     ]},

    {id:"differentials", nav:"Differentials", title:"What else a cold, purple digit can be", sub:"The table sorts the look-alikes by the single feature that separates each from an idiopathic chilblain.",
     blocks:[
       {b:"table", head:["Condition","The separating feature","What to do"], rows:[
         ["<b>Idiopathic chilblains</b>","Crops of tender, itchy violaceous lesions hours after cold, damp exposure; clear in 1–3 weeks and in spring; the person is otherwise well","Warmth, skin care, explanation; usually no routine blood tests"],
         ["<b>Chilblain lupus</b>","Persistent lesions, often with scale, crust or scarring; may outlast winter; other lupus features or discoid lesions on the face","ANA and ENA, FBC, renal function, C3/C4, urinalysis; rheumatology or dermatology referral; biopsy (histology ± direct immunofluorescence — specify on referral) may help, interpreted with clinical and laboratory findings"],
         ["<b>Raynaud’s phenomenon</b>","Episodic, sharply demarcated white then blue then red colour change of the digits <b>during</b> cold or stress, recovering within minutes to hours; no persistent lumps","Assess primary versus secondary: LeRoy and Medsger (international) criteria — symmetrical attacks, no necrosis or ulceration, no secondary cause, normal nail folds, negative ANA and normal ESR"],
         ["<b>Cryoglobulinaemia or cold agglutinin disease</b>","Purpura, livedo, ulceration or necrosis; acral cyanosis in cold; associated hepatitis C, lymphoproliferative disease or connective tissue disease","FBC and film, complement (low C4), rheumatoid factor, protein electrophoresis; cryoglobulins need a temperature-controlled sample (commonly close to 37°C until serum separation) — confirm the local laboratory protocol before sampling"],
         ["<b>Peripheral arterial disease</b>","Older smoker or person with diabetes; claudication, rest pain, cool pale foot, reduced or absent pulses, poor capillary refill","Pulses and manual Doppler ABPI (NICE CG147); urgent vascular assessment if chronic limb-threatening ischaemia; immediate emergency assessment if acute limb ischaemia"],
         ["<b>Frostbite</b>","Tissue frozen after sub-zero exposure; numb, hard, white, then blisters or necrosis","Emergency assessment; do not rub or apply direct dry heat; avoid refreezing"],
         ["<b>Chilblain-like lesions with viral infection</b>","Acral red-purple lesions, often in children and young adults, described during COVID-19 as ‘pseudo-chilblains’ (historical note), usually with mild disease","Usually self-limiting; manage as chilblains and test only if clinically indicated"],
         ["<b>Acral melanoma</b>","Solitary lesion on sole, palm or nail unit that grows, changes or bleeds, and does not fade with warmth","Dermoscopy if trained; urgent referral if NICE NG12 melanoma criteria are met, otherwise advice-and-guidance or urgent dermatology — see <a href='#refer'>Refer</a>"],
         ["<b>Cutaneous vasculitis</b>","Palpable purpura, lower-leg distribution, systemic features","Urinalysis for blood/protein (ACR/PCR if positive), renal function; biopsy and specialist input"],
         ["<b>Erythromelalgia</b>","Burning, red, hot feet made <b>worse</b> by warmth and relieved by cooling — the reverse of chilblains","Check FBC (associated with myeloproliferative disorders); specialist advice"]
       ]},
       {b:"why", html:"Two timing questions do most of the work. <b>When does it appear?</b> During the cold and gone within the hour is Raynaud’s; hours after the cold and lasting days is a chilblain. <b>When does it go?</b> A chilblain that is still there in May, or a lesion that never came in a crop, is no longer an idiopathic chilblain."}
     ]},

    {id:"workup", nav:"Tests", title:"Who needs tests, and which", sub:"Typical winter chilblains in a well adult usually do not require routine blood tests. Test when the picture is atypical, severe, persistent or systemic — and let the clinical picture choose the tests.",
     blocks:[
       {b:"kv", rows:[
         ["No tests needed","Typical symmetrical crops in winter, clearing within weeks and in spring, clearly triggered by cold/damp, in a person who is otherwise well with normal pulses, no ulceration, purpura or other skin findings, no systemic features and no diagnostic uncertainty"],
         ["If connective-tissue disease is suspected","<b>FBC, renal function, urinalysis for blood/protein, ANA, ENA, anti-dsDNA where appropriate, C3/C4, ESR or CRP</b>. The PCDS advises sending both ANA and ENA if lupus is suspected; ENA is not a universal test for all chilblains"],
         ["If vasculitis or cryoprotein disease is suspected","Guided by the presentation: <b>FBC and blood film, renal function and urinalysis, ESR/CRP, C3/C4, rheumatoid factor, serum immunoglobulins and electrophoresis</b>; hepatitis B/C and HIV testing where clinically indicated. Request rheumatoid factor for inflammatory joint symptoms, suspected rheumatoid disease or suspected cryoglobulinaemia — not routinely for every case. Normal complement and rheumatoid factor make cryoglobulinaemia less likely but do not exclude it when suspicion is high (purpura, livedo, ulceration, necrosis, neuropathy, renal abnormalities or systemic symptoms)"],
         ["Urinalysis","Check urine for blood and protein when SLE, vasculitis or cryoglobulinaemia is suspected; quantify proteinuria with urine ACR/PCR if dip-positive or renal involvement is suspected. A positive dip alone is not diagnostic"],
         ["Second-line, with the lab or specialist","<b>Cryoglobulins</b> (collect, transport and process at the laboratory’s specified temperature, commonly close to 37°C until serum separation — confirm the local protocol first; a mishandled specimen can give a false negative), <b>cold agglutinins</b>, <b>serum protein electrophoresis</b>, antiphospholipid antibodies, hepatitis B and C serology where cryoglobulinaemia is suspected"],
         ["Vascular","Pulses and <b>manual Doppler ABPI</b> with documented waveforms if the pulses are reduced or there are features of arterial disease (NICE CG147). Do not exclude PAD in diabetes solely because the ABPI is normal or raised; above about 1.4 may indicate incompressible vessels — consider toe pressures, waveform analysis or vascular imaging if suspicion remains. Never delay emergency transfer for ABPI in acute limb ischaemia"],
         ["Biopsy","Usually through dermatology or an appropriately experienced clinician when the diagnosis is uncertain or chilblain lupus is suspected: a skin biopsy may help distinguish idiopathic perniosis from chilblain lupus, vasculitis, occlusive vasculopathy and other mimics, but must be interpreted with the clinical and laboratory findings. Where lupus is suspected, state on the referral whether routine histology and direct immunofluorescence are required"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"🧪 Reading a positive ANA", html:"A low-titre ANA is common in healthy people and on its own does not make a diagnosis. A positive ANA plus a specific ENA or anti-dsDNA, low complement, cytopenias, proteinuria or clinical lupus features is what matters. The BSR advises supplementing ANA with more specific tests (anti-dsDNA, ENA) when SLE is suspected, and specialist assessment to confirm the diagnosis.", src:"BSR SLE guideline 2026"},
         {tone:"blue", h:"🩸 What one specialist-centre series found", html:"In a retrospective specialist-centre series (Mayo Clinic; selected patients — not population estimates), of 104 patients with pernio, <b>37% had at least one abnormal laboratory result</b>. Four per cent had an associated connective tissue disease other than lupus and 3% an associated haematological malignancy. Most people still had idiopathic disease — test to find the minority, not by reflex.", src:"Cappel and Wetter, Mayo Clin Proc 2014"}
       ]}
     ]},

    {id:"warmth", nav:"Warmth and skin care", title:"Warmth and skin care: the main treatment", sub:"There is no drug that replaces keeping warm. This section is most of the management for most people; the evidence for these measures comes mainly from clinical guidance rather than high-quality trials.",
     blocks:[
       {b:"tiles", v:"life", items:[
         {t:"🧦 Warm and dry extremities", html:"Insulated, dry socks and gloves, roomy warm footwear (tight shoes reduce blood flow), and changing out of wet socks promptly. Hand and foot warmers can help (PCDS)."},
         {t:"🏠 Warm the whole body", html:"Core temperature drives skin blood flow. Layered clothing, a hat, and a heated home all matter. Ask about fuel poverty and signpost to local support where heating is unaffordable."},
         {t:"☕ Cut vasoconstrictors", html:"The PCDS advises avoiding caffeine and decongestants, which constrict skin vessels. Review other medicines that may cause cold extremities with the patient."},
         {t:"🚭 Stop smoking", html:"Smoking constricts skin vessels and damages arteries. Offer stop-smoking support; it is also the most important step if arterial disease is part of the picture."},
         {t:"🔥 Rewarm gently", html:"Warm cold hands and feet gradually. Avoid putting them straight onto radiators, fires or hot-water bottles, which can intensify the burning and itch."},
         {t:"🩹 Protect broken skin", html:"Do not scratch. Keep blisters and erosions clean and covered with a simple dressing; watch for spreading redness, pus or fever that would suggest secondary infection, which needs separate assessment and treatment per local antimicrobial guidance. Not every painful or ulcerated chilblain is infected."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"cream", h:"🧴 Symptom relief", html:"A bland emollient keeps the skin supple. For troublesome itch on intact lesions, a short trial of an appropriately potent topical corticosteroid may be considered, although evidence is limited: use the lowest appropriate potency for the shortest duration, do not apply to ulcerated, necrotic or clinically infected skin, avoid routine potent steroid without a clear diagnosis, and reassess persistent or atypical lesions. Simple analgesia for tenderness.", src:"BNF topical corticosteroids (safe-use principles only — not evidence of efficacy in perniosis)"},
         {tone:"green", h:"⚖ Weight and nutrition", html:"Low body weight is a recognised contributory factor. Ask sensitively about eating and weight in a young person with severe chilblains, and consider an eating disorder where the history fits.", src:"PCDS perniosis guidance"}
       ]},
       {b:"say", html:"These are chilblains — the small blood vessels in your skin over-react when your feet get cold and damp, and the swelling comes up a few hours later. They’re not dangerous and each crop fades over one to three weeks. The treatment is keeping all of you warm, not just your feet: dry, warm socks and roomy shoes, a warm house, and warming up slowly rather than putting your feet on the radiator. Cutting down caffeine and stopping smoking both help. If a sore won’t heal, a patch goes black, or they are still there when the weather warms up, come back."}
     ]},

    {id:"medicines", nav:"Medicines", title:"Medicines: what the evidence allows", sub:"Drug treatment is for severe, recurrent, disabling chilblains after warmth measures have been tried properly. All oral options are off-label.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Step 1", title:"Warmth, skin care, vasoconstrictor avoidance", when:"everyone",
          html:"Start the measures in the section above immediately and review response according to severity — typically within several weeks, or sooner if ulceration, necrosis, infection or diagnostic uncertainty develops. Most idiopathic chilblains need nothing more."},
         {step:"Step 2", title:"Symptom relief", when:"itchy or tender intact lesions", fromLabel:"symptomatic",
          html:"Emollient; a short trial of topical corticosteroid on intact skin only if itch is troublesome (low evidence; lowest appropriate potency, shortest duration; not on ulcerated, necrotic or infected skin); simple analgesia."},
         {step:"Step 3", title:"Nifedipine — off-label", when:"severe, recurrent, disabling", fromLabel:"after warmth measures",
          html:"Consider only for severe, recurrent or disabling disease after preventive measures have been tried. Nifedipine is licensed in the UK for Raynaud’s phenomenon, not chilblains: discuss the off-label use and evidence uncertainty, and document consent and the monitoring plan. Confirm blood pressure and relevant cardiovascular history; check interactions and the exact SPC. <b>Specify the formulation</b> — immediate-release, modified-release or prolonged-release — and do not substitute between preparations without checking the product information; check the dose against the current product information and local formulary/prescribing guidance, and start cautiously where baseline blood pressure is low. It can be taken through the cold months and stopped in spring. Review for hypotension, dizziness, flushing, headache and ankle oedema; reassess the diagnosis if ineffective."},
         {step:"Step 4", title:"Specialist options", when:"refractory or secondary", fromLabel:"refer",
          html:"Refractory disease, diagnostic doubt, or chilblain lupus: dermatology or rheumatology. Hydroxychloroquine and other treatments for chilblain lupus are started and monitored in specialist care."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"⚠ Before prescribing nifedipine", html:"Check the current SPC for the selected nifedipine preparation — contraindications and pregnancy wording differ between products. Important cautions include <b>hypotension, cardiogenic shock, significant aortic stenosis, unstable angina, recent myocardial infarction and hepatic impairment</b>. Interactions: strong CYP3A4 inhibitors/inducers, other antihypertensives and vasodilators, magnesium/aluminium-containing medicines where relevant to the formulation, and <b>grapefruit juice</b>. Check blood pressure first; many people with chilblains are young women with low-normal pressure. <b>Pregnancy and breastfeeding:</b> nifedipine is used for some licensed indications, but evidence and product wording vary by preparation; for off-label chilblain treatment discuss pregnancy, breastfeeding and alternatives, and check the exact SPC and current UKTIS/BNF advice.", src:"Nifedipine SPC (exact local preparation) · BNF nifedipine · NICE NG133 · SPS nifedipine"},
         {tone:"blue", h:"📊 What the two trials actually showed", html:"<b>Rustin et al (Br J Dermatol 1989):</b> pilot, double-blind placebo-controlled and long-term open phases; nifedipine 20–60 mg daily reduced time to clearance, prevented new lesions and eased pain and irritation. <b>Souwer et al (Ann Fam Med 2016):</b> 32 Dutch primary-care patients, crossover, nifedipine 30 mg MR twice daily for 6 weeks; the difference in symptom score versus placebo was 1.84 mm on a 100-mm scale and not significant (P = .44). Evidence is thin and conflicting.", src:"Rustin et al, Br J Dermatol 1989 · Souwer et al, Ann Fam Med 2016"}
       ]},
       {b:"why", html:"Nifedipine makes physiological sense — it relaxes the constricted arterioles that drive the inflammation — and it has a licence for Raynaud’s, which is why it has become the default. But the only modern primary-care RCT was negative, both trials were small, and the side effects (flushing, headache, dizziness, oedema) are real for a benign, self-limiting condition. Offer it as a trial for the person whose winters are genuinely disrupted, not as a routine prescription."}
     ]},

    {id:"followup", nav:"Follow-up", title:"Follow-up and prevention across the winter", sub:"Chilblains recur, so plan for next winter rather than only this crop.",
     blocks:[
       {b:"timeline", items:[
         {n:"1", when:"Now", title:"Explain and start warmth measures", html:"Diagnosis, expected course (one to three weeks per crop), warmth and skin care, vasoconstrictor avoidance, smoking support. Document pulses and any solitary lesion."},
         {n:"2", when:"2–4 weeks", title:"Review if not settling", html:"Lesions should be fading. Not settling, ulcerating, or new systemic features → move to investigation. New lesions despite warming or diagnostic uncertainty → reassess. A single lesion that has not changed with warmth → re-examine with dermoscopy and refer urgently if NICE melanoma criteria are met (otherwise advice-and-guidance or urgent dermatology)."},
         {n:"3", when:"Spring", title:"Expect clearance", html:"Idiopathic chilblains clear as the weather warms. Lesions still present in the warm months → investigate for a secondary cause and consider dermatology referral."},
         {n:"4", when:"Next autumn", title:"Prevent the next season", html:"Start warmth measures before the first cold, damp spell. For severe recurrent disease that responded to nifedipine, a seasonal off-label trial can be discussed again (same formulation; check the exact SPC)."}
       ]},
       {b:"say", html:"The best time to deal with chilblains is before they start. When the weather turns cold and damp, get the warm socks, gloves and proper shoes out, keep the house warm, and warm up slowly when you come in. If they’re still there when the weather warms up, or a sore doesn’t heal, that’s the time to come back so we can look for a cause."}
     ]},

    {id:"refer", nav:"Refer", title:"When to refer, and to whom", sub:"Match the route to the question you need answered, using the local Greater Manchester vascular, dermatology and laboratory pathways.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"purple", h:"🎗 Suspected cancer pathway — melanoma (NICE NG12)", html:"<b>Refer people using a suspected cancer pathway referral for melanoma if they have a suspicious pigmented skin lesion with a weighted 7-point checklist score of 3 or more</b> (rec 1.7.1). <b>Refer people using a suspected cancer pathway referral if dermoscopy suggests melanoma of the skin</b> (rec 1.7.2). <b>Consider a suspected cancer pathway referral for melanoma in people with a pigmented or non-pigmented skin lesion that suggests nodular melanoma</b> (rec 1.7.3). A solitary, persistent, changing, bleeding, nodular or periungual lesion should not be assumed to be a chilblain: examine with dermoscopy if trained and refer urgently if these criteria are met; if suspicion remains but criteria are not met, use dermatology advice-and-guidance or urgent dermatology referral with safety-netting. Nail-unit changes (longitudinal band, pigment on the nail fold, a ‘haematoma’ that does not grow out, dystrophy with periungual extension) → urgent dermatological assessment. Do not excise a suspected melanoma in primary care unless the local skin-cancer pathway supports it.", src:"NICE NG12 recs 1.7.1–1.7.3 (updated April 2026)"},
         {tone:"red", h:"🚨 Same day", html:"Acute limb ischaemia or a cold, pale, pulseless or neurologically compromised digit, or rapidly progressive necrosis → immediate emergency vascular assessment (999-supported transfer; do not wait for ABPI). Chronic limb-threatening ischaemia (rest pain, non-healing ulceration, gangrene, tissue loss) → urgent vascular assessment with vascular MDT involvement (NICE CG147). Suspected frostbite → emergency department. Rapidly spreading infection around an ulcerated lesion, or systemic illness with suspected vasculitis or infection → same-day assessment.", src:"NICE CG147 (2012, updated 2020)"},
         {tone:"amber", h:"🟠 Rheumatology", html:"Positive ANA or ENA with clinical features, low complement, cytopenias, proteinuria, synovitis, or Raynaud’s with digital ulcers — possible SLE, chilblain lupus with systemic disease, or another connective tissue disease. Specialist confirmation; hydroxychloroquine, if indicated, is usually specialist-led.", src:"BSR SLE guideline 2026 · Dubey et al, Rheumatology 2022"},
         {tone:"amber", h:"🟠 Haematology", html:"Cytopenias or an abnormal film, a paraprotein, positive cryoglobulins or cold agglutinins, or chilblain-like lesions with purpura and systemic symptoms in an older adult.", src:"PCDS perniosis guidance · Cappel and Wetter, Mayo Clin Proc 2014"},
         {tone:"blue", h:"🔵 Dermatology (routine or urgent by severity)", html:"Diagnostic doubt; lesions persisting beyond winter; scarring, scaling or ulcerating lesions for biopsy (state whether histology and direct immunofluorescence are needed); suspected chilblain lupus confined to the skin; or severe recurrent disease despite warmth measures and a trial of nifedipine.", src:"PCDS perniosis guidance"},
         {tone:"blue", h:"🔵 Vascular (routine)", html:"Reduced pulses or an abnormal ABPI without critical ischaemia, with claudication or other features of peripheral arterial disease — for assessment and secondary prevention per NICE CG147.", src:"NICE CG147 (2012, updated 2020)"}
       ]},
       {b:"say", html:"Most chilblains need nothing more than what we’ve talked about. Because yours are behaving differently — they’re not clearing and they’ve started to break down — I’d like to do some blood tests and ask a specialist to have a look, just to make sure there isn’t something underneath that needs treating in its own right."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 24-year-old student who walks to lectures in canvas trainers has itchy, sore purple lumps on several toes for three weeks in January. She says they come every winter. She is slim, drinks a lot of coffee, and is worried because a friend told her it could be ‘poor circulation’. On direct questioning she has had a sore, stiff wrist and a rash on her cheeks after being in the sun last summer.", src:"PCDS perniosis guidance · BSR SLE guideline 2026"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Makes a confident clinical diagnosis of chilblains from the timing and site; <b>examines the pulses and every digit</b>; <b>does not stop at the diagnosis</b> — picks up the wrist symptoms and photosensitive rash and explains why a symptom-led lupus screen (ANA with ENA, FBC, renal function, C3/C4, urinalysis for blood/protein) is now justified; asks sensitively about weight and eating; gives practical warmth, footwear and caffeine advice; explains that nifedipine is <b>off-label with conflicting evidence</b> and is not needed yet; safety-nets for ulceration, necrosis and a non-healing single lesion; arranges review of the results.", src:"PCDS · BSR SLE guideline 2026 · Souwer et al, Ann Fam Med 2016"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Every figure on this page is traceable to a named primary source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>Primary Care Dermatology Society (PCDS) — Perniosis (syn. chilblains)</b> and <b>Chilblains</b> clinical guidance (accessed September 2026)<br><a href="https://www.pcds.org.uk/clinical-guidance/perniosis" rel="noopener">pcds.org.uk/clinical-guidance/perniosis</a><span class="rd"> — itchy or tender red-purple acral lesions as a reaction to cold; contributory factors including low body weight; reduce cold and damp exposure, warm gloves and socks, hand and foot warmers; avoid caffeine and decongestants; investigate for connective tissue disease, cryoglobulinaemia and haematological malignancy when lesions are severe, persistent, ulcerate or necrose</span></li>'+
         '<li><b>PCDS — Investigations</b> and <b>Cutaneous lupus erythematosus</b> guidance (accessed September 2026)<br><a href="https://www.pcds.org.uk/investigations" rel="noopener">pcds.org.uk/investigations</a><span class="rd"> — send both ANA and ENA if lupus is suspected; investigations directed by the clinical picture; normal complement and rheumatoid factor make cryoglobulins less likely but do not exclude them; cryoglobulin samples need strict temperature control</span></li>'+
                  '<li><b>British Society for Rheumatology — The 2026 BSR guideline for the management of children, young people and adults with systemic lupus erythematosus</b> (Rheumatology 2026;65(6):keag223; executive summary keag224)<br><a href="https://academic.oup.com/rheumatology/article/65/6/keag223/8713811" rel="noopener">academic.oup.com/rheumatology</a><span class="rd"> — used here for established SLE management and hydroxychloroquine principles only — not a perniosis guideline; hydroxychloroquine for all with established SLE unless contraindicated; photoprotection; smoking cessation; supplementary specific antibody testing; updates the first BSR SLE guideline (Gordon C, et al., Rheumatology 2018;57(1):e1–e45)</span></li>'+
         '<li><b>Dubey S, Joshi N, Stevenson O, Gordon C, Reynolds JA. Chilblains in immune-mediated inflammatory diseases: a review.</b> Rheumatology 2022;61(12):4631–4642<span class="rd"> — SLE is the most common immune-mediated association; chilblain lupus epidemiology and treatment</span></li>'+
         '<li><b>NICE CG147 — Peripheral arterial disease: diagnosis and management</b> (August 2012, updated December 2020)<br><a href="https://www.nice.org.uk/guidance/cg147" rel="noopener">nice.org.uk/guidance/cg147</a><span class="rd"> — ask about claudication and critical limb ischaemia, examine legs and feet, check femoral, popliteal and foot pulses, measure ABPI by manual Doppler; do not exclude PAD in diabetes on a normal or raised ABPI alone; all people with critical limb ischaemia assessed by a vascular multidisciplinary team</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral</b> (2015, updated April 2026)<br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — recs 1.7.1 (weighted 7-point checklist score 3 or more), 1.7.2 (dermoscopy suggests melanoma), 1.7.3 (lesion suggesting nodular melanoma)</span></li>'+
         '<li><b>Nifedipine Summary of Product Characteristics — the exact preparation, formulation and manufacturer used locally</b> (MHRA product information)<br><a href="https://products.mhra.gov.uk" rel="noopener">products.mhra.gov.uk</a><span class="rd"> — immediate-release nifedipine licensed for Raynaud’s phenomenon (not chilblains); contraindications, interactions and pregnancy wording are product-specific; avoid grapefruit juice</span></li>'+
         '<li><b>NICE NG133 — Hypertension in pregnancy: diagnosis and management</b><br><a href="https://www.nice.org.uk/guidance/ng133" rel="noopener">nice.org.uk/guidance/ng133</a><span class="rd"> — nifedipine products have differing pregnancy information; check the individual SPC</span></li>'+
         '<li><b>NHS Specialist Pharmacy Service — Nifedipine</b><br><a href="https://www.sps.nhs.uk" rel="noopener">sps.nhs.uk</a><span class="rd"> — compatible with breastfeeding in healthy full-term infants; check the preparation and clinical context</span></li>'+
         '<li><b>NHS — Frostbite</b><br><a href="https://www.nhs.uk/conditions/frostbite/" rel="noopener">nhs.uk/conditions/frostbite</a><span class="rd"> — emergency assessment; do not rub or apply direct heat; avoid refreezing</span></li>'+
         '<li><b>BNF</b> — nifedipine; topical corticosteroids<br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — doses, cautions, pregnancy advice</span></li>'+
         '<li><b>Rustin MH, Newton JA, Smith NP, Dowd PM. The treatment of chilblains with nifedipine: the results of a pilot study, a double-blind placebo-controlled randomized study and a long-term open trial.</b> Br J Dermatol 1989;120(2):267–275<span class="rd"> — 20–60 mg daily reduced time to clearance, prevented new lesions, reduced pain and irritation</span></li>'+
         '<li><b>Souwer IH, Bor JH, Smits P, Lagro-Janssen AL. Nifedipine vs placebo for treatment of chronic chilblains: a randomized controlled trial.</b> Ann Fam Med 2016;14(5):453–459<span class="rd"> — 32 patients, crossover, nifedipine 30 mg controlled-release twice daily; difference 1.84 mm on a 100-mm VAS at 6 weeks, P = .44</span></li>'+
         '<li><b>Cappel JA, Wetter DA. Clinical characteristics, etiologic associations, laboratory findings, treatment, and proposal of diagnostic criteria of pernio (chilblains) in a series of 104 patients at Mayo Clinic, 2000 to 2011.</b> Mayo Clin Proc 2014;89(2):207–215<span class="rd"> — retrospective single specialist-centre series (selected patients; not population estimates): 79% women, mean age 38.3; toes 82%, fingers 30%; 37% at least one abnormal test; cold agglutinins positive in 11 of 20 tested; 4% non-lupus connective tissue disease; 3% haematological malignancy</span></li>'+
         '<li><b>Galván Casas C, et al. Classification of the cutaneous manifestations of COVID-19: a rapid prospective nationwide consensus study in Spain with 375 cases.</b> Br J Dermatol 2020;183(1):71–77<span class="rd"> — historical note only: pseudo-chilblain pattern in younger patients with less severe disease</span></li>'+
         '<li><b>International — LeRoy EC, Medsger TA Jr. Raynaud’s phenomenon: a proposal for classification.</b> Clin Exp Rheumatol 1992;10(5):485–488<span class="rd"> — used only because no UK criteria exist: primary Raynaud’s defined by symmetrical attacks, no necrosis, ulceration or gangrene, no secondary cause, normal nail-fold capillaries, negative ANA and normal ESR</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Chilblains (perniosis) in primary care — PCDS perniosis and chilblains guidance, the 2026 BSR SLE guideline, NICE CG147 (2012, updated 2020), NICE NG12 (updated April 2026), the nifedipine SPC and BNF, and the Rustin 1989 and Souwer 2016 trials; LeRoy and Medsger 1992 (international) for Raynaud’s classification. Nifedipine is off-label for chilblains: specify the formulation and verify every dose against the exact SPC, current BNF and local formulary. Not a substitute for clinical judgement or your local formulary."
});
