<script>
MG.render({
  icon:"👄",
  title:"Aphthous ulcer — the complete guide",
  eyebrow:"Protocol · NG12 · the 3-week rule",
  stemTitle:"Typical recurrent aphthous ulcers are benign and self-limiting — which is exactly why an unexplained ulcer lasting more than 3 weeks should normally be referred on the suspected oral-cancer pathway",
  stemSub:"One page for the whole condition. Most aphthous ulcers need only symptomatic care and self-care. Three things matter beyond that. <b>Examine properly</b> — site, edge, base, induration, the rest of the mouth and the neck. <b>Look for a treatable cause</b> in recurrent, severe or atypical ulceration: haematinic deficiency, coeliac disease, IBD, Behçet's or a drug. And <b>apply NICE NG12</b>: for unexplained oral ulceration lasting more than 3 weeks NICE says <i>consider</i> a suspected cancer pathway referral; this page's local safety policy is to refer by default — less pain is not healing. GPs do not need to make a definitive oral medicine diagnosis.",
  guideline:"NICE NG12 · PCDS · BAD/BSR Behçet's guideline (2025) · Greater Manchester formulary, OTC policy and methotrexate shared care · SPS/MHRA medicine-safety advice",
  reviewed:"25 September 2026",
  nextReview:"25 September 2027",
  meta:[
    {t:"Unexplained ulcer >3 weeks → consider suspected cancer pathway referral", tone:"tw"},
    {t:"Less pain is not healing", tone:"tw"},
    {t:"v2.1 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#examine"><b>Examine</b><small>And classify</small></a><a href="#urgent"><b>Urgent</b><small>Not just cancer</small></a><a href="#screen"><b>Causes</b><small>Recurrent or severe</small></a><a href="#drug"><b>Topical</b><small>Diagnosed aphthae only</small></a><a href="#refer"><b>Refer</b><small>Suspected cancer · dental · oral med</small></a></div>',
  quickSub:"The five that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"purple", h:"The 3-week rule — NICE NG12 <span class='tw'>Suspected cancer</span>", html:"<b>Unexplained ulceration in the oral cavity lasting more than 3 weeks</b> → consider a suspected oral cancer pathway referral (NICE wording); <b>local safety policy: refer as the default</b> via the local head-and-neck route, documenting duration, site and examination findings. Do not use a topical corticosteroid as a diagnostic trial. Reduced pain does not confirm healing — document whether the lesion has fully resolved. Smoking and alcohol raise the risk but are not required. Restated in <a href='#refer'>Refer</a>."},
    {tone:"amber", h:"Lumps and patches are a different route", html:"A lump on the lip or in the mouth, or a red or red-and-white patch consistent with erythroplakia or erythroleukoplakia → <b>urgent dental assessment</b> (NICE NG12); if the dentist considers the lesion suspicious for cancer, the dentist can make the suspected cancer pathway referral. Do not automatically send every oral lump as a suspected cancer referral — consider the dental pathway and local arrangements. A persistent unexplained neck lump → suspected cancer pathway."},
    {tone:"red", h:"⚠ Urgent, and not only cancer", html:"Airway compromise or rapidly progressive swelling · unable to maintain hydration or nutrition · extensive erosions with skin or eye involvement (possible SJS/TEN) · severe gingivitis with fever · immunocompromised with extensive ulceration · suspected methotrexate toxicity with systemic symptoms or possible overdose · ulceration on chemotherapy, radiotherapy or other systemic anticancer treatment (acute oncology pathway) → same-day assessment."},
    {tone:"blue", h:"Minor, major, herpetiform", html:"Minor: usually under 10 mm, heal in about 7–14 days without scarring. Major: over 10 mm, deeper, can take 10–40 days and scar. Herpetiform: many small grouped ulcers, not caused by herpes. These are clinical patterns, not definitive diagnoses. <b>A presumed major aphthous ulcer still needs referral if it stays unexplained beyond 3 weeks.</b>"},
    {tone:"green", h:"Self-care first", html:"Most uncomplicated ulcers settle with self-care and pharmacy advice. Topical corticosteroids are for <b>clinically diagnosed</b> aphthous ulceration — never a trial for a persistent unexplained ulcer."}
  ],
  pathwaySub:"Five steps, and the first one is a safety act.",
  pathway:[
    {title:"Examine and apply NICE NG12", html:"Structured oral and neck examination; unexplained ulceration beyond 3 weeks → consider suspected cancer pathway referral (local default: refer); lumps and red or red-white patches → urgent dental assessment.", alert:true},
    {title:"Check for urgent non-cancer causes", html:"Airway, hydration, SJS/TEN, severe infection, immunocompromise, methotrexate or other drug toxicity, anticancer treatment (acute oncology)."},
    {title:"Look for a cause if recurrent, severe or atypical", html:"Selective, not routine: FBC, ferritin/iron studies, B12, folate, coeliac serology; targeted further tests; medicine review."},
    {title:"Self-care and topical relief", html:"Trigger avoidance and dental review; benzydamine or lidocaine for pain; topical steroid for diagnosed aphthae."},
    {title:"Review and refer", html:"Dental, oral medicine, OMFS or suspected cancer pathway according to the presentation."}
  ],
  sections:[

    {id:"examine", nav:"Examine", title:"Step 1 — examine, classify, and apply the 3-week rule",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>The ulcer</b>","Exact site, size and number · duration, and whether recurrent or a first episode · edge and base · induration, tethering, fixation or bleeding · keratinised or non-keratinised mucosa · solitary or multiple"],
         ["<b>The rest of the mouth</b>","Red, white or mixed mucosal change · tongue, including the ventral surface · floor of mouth · gums, palate and oropharynx · teeth, dentures and possible trauma"],
         ["<b>The neck and history</b>","Cervical lymph nodes · weight loss, dysphagia, odynophagia, otalgia, trismus, voice change"],
         ["<b>Types</b>","Minor (usually under 10 mm, heal in about 7–14 days, no scarring) · major (over 10 mm, deeper, more painful, 10–40 days, may scar) · herpetiform (numerous small grouped ulcers; not herpes infection). These are clinical patterns, not definitive diagnoses"],
         ["<b>Lowers the threshold</b>","Induration, tethering, fixation, unexplained bleeding or cervical lymphadenopathy lower the threshold for urgent referral — they do not automatically equal a cancer referral; the route depends on whether the lesion is an ulcer, lump, patch or suspected infection"]
       ]},
       {b:"why", html:"Not every ulcer beyond 3 weeks is cancer — but a large, solitary, indurated, atypical or persistent lesion should not be labelled major aphthosis without reassessment, and a persistent unexplained ulcer should never be kept in primary care without specialist confirmation."},
       {b:"cards", items:[
         {tone:"cream", h:"The GP's role — no definitive oral medicine diagnosis needed", html:"1 · Exclude immediate threats · 2 · Identify and remove trauma where appropriate · 3 · Recognise persistent unexplained lesions · 4 · Request selective investigations for recurrent or severe disease · 5 · Refer through dental, oral medicine, OMFS or cancer pathways according to the presentation."}
       ]}
     ]},

    {id:"urgent", nav:"Urgent", title:"Urgent or same-day — not only cancer",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"Same-day assessment", html:"Airway compromise, stridor or rapidly progressive oropharyngeal swelling · unable to maintain hydration or nutrition · extensive mucosal erosions with skin or eye involvement (possible Stevens–Johnson syndrome/TEN) · severe gingivitis with fever or systemic illness · immunocompromised patient with extensive ulceration or suspected invasive infection · suspected methotrexate toxicity with systemic symptoms or possible overdose · rapidly progressive lesions."},
         {tone:"red", h:"Methotrexate", html:"New oral ulceration on methotrexate may mean mucositis, folate deficiency, bone-marrow toxicity, overdose or accidental daily dosing, or infection. <b>Withhold the next dose pending urgent clinical review, arrange an urgent FBC and renal/liver blood tests, and discuss promptly with the specialist/shared-care team</b> (current GMMMG oral methotrexate shared-care protocol). Assess the dose, weekly dosing day, renal function, folic acid use, recent antibiotics and possible dosing error. <b>Urgent same-day assessment</b> if fever, sore throat, bruising, bleeding, systemic illness, severe mucositis, reduced intake or suspected overdose. Safety checks: once weekly, never daily · oral tablets generally 2.5 mg only · avoid trimethoprim and co-trimoxazole (severe bone-marrow suppression) · ask about NSAIDs, dehydration and renal deterioration · folic acid on a different day from methotrexate. MHRA: overdose can cause mucositis, oral ulceration, pancytopenia, renal failure and fatal toxicity."},
         {tone:"red", h:"Chemotherapy, radiotherapy or systemic anticancer treatment", html:"Mouth ulceration may be mucositis, neutropenia, infection or treatment toxicity. Check temperature and observations · ability to eat, drink and pass urine · FBC/neutrophils · renal function · systemic infection or sepsis. <b>Follow the acute oncology pathway</b> rather than treating as simple aphthosis."}
       ]}
     ]},

    {id:"screen", nav:"Causes", title:"Step 2 — recurrent, severe or atypical: look for a cause",
     sub:"Selective, not routine — not every patient needs every test.",
     blocks:[
       {b:"table", head:["Test or check","When"], rows:[
         ["<b>FBC</b>","Recurrent, severe, prolonged, major or atypical ulceration, or systemic symptoms"],
         ["<b>Ferritin/iron studies</b>","Recurrent or severe ulcers; anaemia, fatigue or dietary/menstrual risk"],
         ["<b>B12 and folate</b>","Recurrent, severe, prolonged or unexplained ulcers"],
         ["<b>Coeliac serology (tTG)</b>","Recurrent ulcers with iron deficiency, diarrhoea, weight loss, bloating or family history"],
         ["<b>Faecal calprotectin</b>","Persistent diarrhoea, abdominal pain, rectal bleeding, perianal disease or weight loss"],
         ["<b>HIV test</b>","Risk-based, atypical, severe or refractory disease"],
         ["<b>U&E and LFTs</b>","Systemic disease or medicine toxicity suspected"],
         ["<b>HSV, bacterial or fungal testing</b>","Compatible clinical appearance or immunocompromise. Avoid routine HSV swabbing of typical aphthous ulcers"],
         ["<b>Deficiency found</b>","A deficiency result should prompt investigation of the cause, not merely replacement. Treat per the relevant deficiency guideline, investigate its cause where appropriate (iron deficiency needs its own GI, menstrual or dietary evaluation), and reassess ulcer recurrence rather than only the serum result"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Medicines that can cause oral ulceration", html:"Nicorandil · NSAIDs · methotrexate · azathioprine · chemotherapy and immunosuppressants · ACE inhibitors and ARBs · some antidepressants · drugs causing lichenoid reactions. Evidence for causality varies. Review newly started medicines and the temporal relationship with ulceration. Persistent or recurrent oral ulceration is a recognised adverse effect of nicorandil — review and discuss with the prescriber. Do not stop essential treatment without discussing the risks and alternatives with the prescriber or specialist."},
         {tone:"amber", h:"Behçet's disease", html:"Consider Behçet's in recurrent oral ulceration with recurrent genital ulceration, uveitis or other visual symptoms, erythema-nodosum-like or papulopustular lesions, vascular disease, neurological symptoms or inflammatory arthritis → multispecialty assessment (BAD/BSR 2025; ocular, neurological, vascular and gastrointestinal risk). Recurrent aphthae alone do not establish the diagnosis, and classification criteria do not diagnose it. A new painful red eye, photophobia or visual disturbance → same-day ophthalmic assessment. Do not start systemic treatment such as colchicine from primary care without specialist assessment."}
       ]}
     ]},

    {id:"nondrug", nav:"Self-care", title:"Step 3 — triggers and self-care",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"🪥 SLS-free toothpaste", html:"A trial of sodium lauryl (or laureth) sulfate-free toothpaste may reduce irritation or recurrence in some patients — particularly where episodes seem linked to toothpaste."},
         {tone:"blue", h:"🍋 Triggers", html:"Avoid trauma and acidic or spicy foods during episodes; identify personal triggers."},
         {tone:"green", h:"🧂 Saltwater rinse", html:"Warm saline rinses for comfort and hygiene."},
         {tone:"amber", h:"🦷 Dental review", html:"Sharp or broken teeth, ill-fitting dentures, orthodontic trauma, local irritation or suspected dental infection."},
         {tone:"blue", h:"🏪 Self-care prescribing", html:"Use self-care and pharmacy advice for uncomplicated minor aphthae. Prescribe only when clinically indicated, taking account of the current Greater Manchester OTC/self-care policy and the patient's age, frailty, swallowing ability and comorbidity. The GM formulary lists benzydamine 0.15% mainly for palliative care or after radiotherapy and chlorhexidine 0.2% as a formulary option; local anaesthetic gels and hydrocortisone buccal tablets are not routinely prescribed for uncomplicated self-limiting mouth ulcers."}
       ]}
     ]},

    {id:"drug", nav:"Topical", title:"Step 4 — topical treatment",
     blocks:[
       {b:"table", head:["Treatment","Use","Notes"], rows:[
         ["<b>Benzydamine 0.15%</b> mouthwash or spray","Symptomatic relief","May provide symptomatic relief; it does not treat the underlying process. Follow the specific product instructions (SPC), including age restrictions and maximum use; it may sting and can cause oral numbness. The GM formulary lists it mainly for palliative care and after radiotherapy"],
         ["<b>Lidocaine</b> gel","Severe pain — not routinely prescribed for uncomplicated self-limiting ulcers (GM)","Only use a formulation licensed or suitable for oral use; avoid excessive or repeated dosing. If the mouth or throat feels numb, avoid eating or drinking until sensation returns — choking and aspiration risk, especially in children, frail adults and people with dysphagia"],
         ["<b>Chlorhexidine 0.2%</b> mouthwash","A short course for painful, recurrent or secondarily infected ulceration","May reduce severity and aids local hygiene, but does not prevent recurrence and is not needed for every ulcer. Tooth staining, taste disturbance, mucosal irritation, rare serious hypersensitivity; use at a different time from toothpaste. Should generally be short term. Do not use in known or suspected chlorhexidine allergy — it can rarely cause severe hypersensitivity or anaphylaxis (MHRA)"],
         ["<b>Topical corticosteroid</b> — hydrocortisone 2.5 mg oromucosal tablets, or betamethasone 500 microgram soluble tablet as a mouthwash","Clinically diagnosed aphthous ulceration with substantial symptoms or frequent episodes; a short course, ideally early in the episode or during the prodrome","Hydrocortisone muco-adhesive buccal tablets are licensed for local treatment of aphthous ulceration (not routinely prescribed for uncomplicated self-limiting ulcers in GM). Betamethasone soluble tablets as a mouthwash are off-label — dissolve, rinse and spit out, do not swallow (systemic corticosteroid exposure); take the volume from the current local formulary or SPS guidance. Check age and product-specific licensing. Avoid where herpes, fungal infection, SJS/TEN or other infection is suspected; monitor for oral candidiasis. Caution where immunosuppression or a non-aphthous diagnosis is possible. <b>Not a trial treatment for an unexplained ulcer persisting beyond 3 weeks</b>"],
         ["<b>Treat the cause</b>","If one is identified","Correct deficiency, treat coeliac disease or IBD, review causative medicines"]
       ]}
     ]},

    {id:"persistent", nav:"Persistent?", title:"Persistent or recurrent? Re-check",
     sub:"Distinguish benign recurrence from a sinister, systemic or drug cause.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"purple", h:"1 · The 3-week rule <span class='tw'>Suspected cancer</span>", html:"Unexplained oral ulceration beyond 3 weeks → consider suspected oral cancer pathway referral (NICE NG12); local default is to refer."},
         {tone:"amber", h:"2 · Deficiency", html:"Iron, B12, folate and coeliac disease screened and corrected, with recurrence reassessed?"},
         {tone:"blue", h:"3 · Systemic disease", html:"IBD, Behçet's, or a medicine cause?"},
         {tone:"amber", h:"4 · Trauma", html:"A sharp tooth or denture → dental review."},
         {tone:"blue", h:"5 · Refer", html:"Severe, major, complex or refractory recurrence → oral medicine."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"When to refer",
     blocks:[
       {b:"cards", items:[
         {tone:"purple", h:"Suspected cancer pathway referral · NICE NG12 — oral cancer", html:"<b>Unexplained ulceration in the oral cavity lasting more than 3 weeks</b>, or a <b>persistent unexplained neck lump</b> → consider a suspected cancer pathway referral (NICE wording); local safety policy is to refer by default, whether or not symptoms have improved. <b>Urgent dentist assessment:</b> a lump on the lip or in the oral cavity, or a red or red-white patch consistent with erythroplakia or erythroleukoplakia; if the dentist considers it suspicious, the dentist can make the suspected cancer pathway referral. <b>Same-day emergency assessment:</b> airway compromise · rapidly progressive swelling · severe systemic illness or inability to maintain hydration. Induration, tethering or bleeding lower the threshold for urgent referral but do not automatically equal a cancer referral. Use the local head-and-neck pathway and document duration, exact site, size, induration, risk factors, and examination of the rest of the mouth and the neck."},
         {tone:"blue", h:"Oral medicine or OMFS", html:"Severe, frequent or disabling recurrent aphthosis · major or complex aphthosis · recurrence despite correcting a deficiency · suspected Behçet's, IBD or autoimmune blistering disease · suspected lichen planus or other chronic mucosal disease · diagnostic uncertainty. Routine minor aphthae can stay in primary care after appropriate assessment."},
         {tone:"amber", h:"Systemic disease", html:"Suspected Behçet's, IBD or another systemic cause → the relevant specialty. See <a href='crohns-disease.html'>Crohn's disease</a>."},
         {tone:"cream", h:"GP management", html:"Examination, the 3-week rule, the cause screen, self-care and the topical ladder belong here. Related pages: <a href='coeliac-disease.html'>coeliac disease</a> · <a href='iron-deficiency-anaemia.html'>iron deficiency anaemia</a> · <a href='crohns-disease.html'>Crohn's disease</a> · <a href='../algorithms/mouth-ulcers.html'>mouth ulcers pathway</a>."}
       ]},
       {b:"cards", items:[
         {tone:"red", h:"Safety-net", html:"\"Typical mouth ulcers are usually harmless and heal within 1–2 weeks. If an ulcer hasn't healed within 3 weeks, or it bleeds, feels hard, keeps getting rubbed by a tooth, or you notice a lump in your neck, come back — it needs checking urgently. Smoking and alcohol raise mouth-cancer risk.\""}
       ]},
       {b:"say", html:"Typical mouth ulcers are usually harmless and heal in a week or two, and we can ease the pain meanwhile. The one important rule: if an ulcer hasn't fully healed in three weeks — even if it hurts less — come straight back so we can get it checked urgently."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 58-year-old man who smokes 20 a day and drinks most evenings attends about a <b>painful ulcer on the side of his tongue, present for about 5 weeks</b>. He says it is \"less sore than it was\" since using a mouthwash from the pharmacy, and has come mainly because his wife insisted. He has had occasional mouth ulcers before that settled in a week."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Refers on the suspected oral cancer pathway under NICE NG12 — the decisive action; recognises that improving symptoms do not mean healing; notes the lateral tongue site, smoking and alcohol as compounding risk; examines the whole mouth, the floor of the mouth and the neck; <b>does not prescribe a topical steroid as a trial</b>; explains the referral without alarm or false reassurance; addresses smoking and alcohol; and documents the duration explicitly."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (current version; check the last-updated date on the NICE page)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — unexplained oral ulceration over 3 weeks and persistent neck lump (suspected cancer pathway); lip or oral lumps and red or red-and-white patches (urgent dental assessment)</span></li>'+
         '<li><b>Primary Care Dermatology Society — oral lesions</b><span class="rd"> — clinical assessment and primary-care practice guidance: classification, investigations, medicine causes, topical treatment</span></li>'+
         '<li><b>DermNet — aphthous ulceration; mouth ulcers</b><br><a href="https://dermnetnz.org/topics/aphthous-ulcer" rel="noopener">dermnetnz.org/topics/aphthous-ulcer</a><span class="rd"> — investigation of frequent, prolonged, large or severe ulcers</span></li>'+
         '<li><b>BAD / BSR — living guideline for managing people with Behçet\'s (2025)</b><span class="rd"> — Behçet’s specialist guideline: when to suspect and refer; organ-specific risk</span></li>'+
         '<li><b>Greater Manchester Medicines Management Group — formulary (ear, nose and oropharynx), OTC policy, methotrexate shared-care protocol</b><br><a href="https://www.greatermanchesterformulary.nhs.uk" rel="noopener">greatermanchesterformulary.nhs.uk</a> · <a href="https://gmmmg.nhs.uk" rel="noopener">gmmmg.nhs.uk</a> (current OTC/self-care policy and current oral methotrexate shared-care protocol — do not use 2020–2021 versions without confirming they remain current)<span class="rd"> — local formulary and prescribing policy; methotrexate toxicity action</span></li>'+
         '<li><b>Local head-and-neck / oral cancer referral pathway</b><span class="rd"> — use the current locality suspected cancer referral route</span></li>'+
         '<li><b>SPS / MHRA — medicine-safety advice</b><span class="rd"> — methotrexate once-weekly dosing and interactions; chlorhexidine hypersensitivity; hydrocortisone muco-adhesive buccal tablets; betamethasone soluble tablets used as mouthwash; product SPCs for benzydamine and chlorhexidine</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Aphthous ulceration in primary care — NICE NG12. Typical minor aphthae heal in about 1–2 weeks. Unexplained oral ulceration lasting more than 3 weeks, or a persistent unexplained neck lump: consider suspected cancer pathway referral (local default: refer), whatever the symptom response. Oral lumps and red or red-white patches: urgent dental assessment; the dentist refers if suspicious. Same-day for airway, hydration, SJS/TEN, severe infection, immunocompromise, methotrexate toxicity with systemic symptoms or possible overdose, or anticancer treatment (acute oncology). Methotrexate ulceration: withhold the next dose, urgent FBC and renal/liver tests, discuss with the shared-care team. Selective tests in recurrent, severe or atypical ulceration for deficiency, coeliac disease, IBD, Behçet's and medicines. Self-care first; topical corticosteroid only for diagnosed aphthae. Sources: NICE NG12, PCDS, BAD/BSR (2025), Greater Manchester formulary, MHRA SPCs. Verify doses against the current BNF."
});
</script>
