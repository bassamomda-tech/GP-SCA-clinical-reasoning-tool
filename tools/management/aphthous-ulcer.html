MG.render({

  stemTitle:"Typical recurrent aphthous ulcers are benign and self-limiting — which is exactly why an unexplained ulcer lasting more than 3 weeks must prompt a suspected cancer referral",
  stemSub:"One page for the whole condition. Most aphthous ulcers need only symptomatic care and self-care. Three things matter beyond that. <b>Examine properly</b> — site, edge, base, induration, the rest of the mouth and the neck. <b>Look for a treatable cause</b> in recurrent, severe or atypical ulceration: haematinic deficiency, coeliac disease, IBD, Behçet's or a drug. And <b>apply NICE NG12</b>: unexplained oral ulceration lasting more than 3 weeks warrants a suspected oral cancer pathway referral — less pain is not healing.",

  reviewed:"25 September 2026",
  nextReview:"25 September 2027",
  meta:[
    {t:"Unexplained ulcer >3 weeks → 2WW", tone:"tw"},
    {t:"Less pain is not healing", tone:"tw"},
    {t:"v2.1 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#examine"><b>Examine</b><small>And classify</small></a><a href="#urgent"><b>Urgent</b><small>Not just cancer</small></a><a href="#screen"><b>Causes</b><small>Recurrent or severe</small></a><a href="#drug"><b>Topical</b><small>Diagnosed aphthae only</small></a><a href="#refer"><b>Refer</b><small>2WW · dental · oral med</small></a></div>',
  quickSub:"The five that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"purple", h:"The 3-week rule — NICE NG12 <span class='tw'>2WW</span>", html:"<b>Unexplained ulceration in the oral cavity lasting more than 3 weeks</b> → consider a suspected oral cancer pathway referral. Reduced pain does not confirm healing — document whether the lesion has fully resolved. Smoking and alcohol raise the risk but are not required. Restated in <a href='#refer'>Refer</a>."},
    {tone:"amber", h:"Lumps and patches are a different route", html:"A lump on the lip or in the mouth, or a red or red-and-white patch consistent with erythroplakia or erythroleukoplakia → <b>urgent dental assessment</b> (NICE NG12). A persistent unexplained neck lump → suspected cancer pathway."},
    {tone:"red", h:"⚠ Urgent, and not only cancer", html:"Airway compromise or rapidly progressive swelling · unable to maintain hydration or nutrition · extensive erosions with skin or eye involvement (possible SJS/TEN) · severe gingivitis with fever · immunocompromised with extensive ulceration · ulceration on methotrexate (possible toxicity) → same-day assessment."},
    {tone:"blue", h:"Minor, major, herpetiform", html:"Minor: usually under 10 mm, heal in about 7–14 days without scarring. Major: over 10 mm, deeper, can take 10–40 days and scar. Herpetiform: many small grouped ulcers, not caused by herpes. <b>A presumed major aphthous ulcer still needs referral if it stays unexplained beyond 3 weeks.</b>"},

       {b:"table", head:["Element","Detail"], rows:[
         ["<b>The ulcer</b>","Exact site, size and number · duration, and whether recurrent or a first episode · edge and base · induration, tethering, fixation or bleeding"],
         ["<b>The rest of the mouth</b>","Red, white or mixed mucosal change · tongue, including the ventral surface · floor of mouth · gums, palate and oropharynx · teeth, dentures and possible trauma"],
         ["<b>The neck and history</b>","Cervical lymph nodes · weight loss, dysphagia, odynophagia, otalgia, trismus, voice change"],
         ["<b>Types</b>","Minor (usually under 10 mm, heal in about 7–14 days, no scarring) · major (over 10 mm, deeper, more painful, 10–40 days, may scar) · herpetiform (numerous small grouped ulcers)"],
         ["<b>Lowers the threshold</b>","Induration, tethering, fixation, unexplained bleeding or cervical lymphadenopathy → urgent referral"]
       ]},
       {b:"why", html:"Not every ulcer beyond 3 weeks is cancer — but a persistent unexplained ulcer should never be labelled a major aphthous ulcer and kept in primary care without specialist confirmation."}
     ]},

    {id:"urgent", nav:"Urgent", title:"Urgent or same-day — not only cancer",
     blocks:[

         ["<b>Faecal calprotectin</b>","Persistent diarrhoea, abdominal pain, rectal bleeding, perianal disease or weight loss"],
         ["<b>HIV test</b>","Where risk or atypical or refractory disease makes it clinically indicated"],
         ["<b>Inflammatory markers, renal and liver tests</b>","If systemic inflammation, systemic disease or medicine toxicity is possible"],

         {tone:"amber", h:"Behçet's disease", html:"Recurrent oral ulcers plus recurrent genital ulceration, uveitis or visual symptoms, erythema nodosum-like or papulopustular lesions, or other systemic features → specialist assessment (BAD/BSR 2025). A new painful red eye or visual symptoms → same-day ophthalmology. Do not diagnose Behçet's from recurrent aphthae alone."}
       ]}

         {tone:"green", h:"🧂 Saltwater rinse", html:"Warm saline rinses for comfort and hygiene."},
         {tone:"amber", h:"🦷 Dental review", html:"Sharp or broken teeth, ill-fitting dentures, orthodontic trauma, local irritation or suspected dental infection."},
         {tone:"blue", h:"🏪 Self-care prescribing", html:"For uncomplicated mild mouth ulcers, self-care and pharmacy advice are usually appropriate. Check the current Greater Manchester OTC and self-care policy before prescribing benzydamine, lidocaine, chlorhexidine or hydrocortisone."}
       ]}
     ]},

    {id:"drug", nav:"Topical", title:"Step 4 — topical treatment",
     blocks:[
       {b:"table", head:["Treatment","Use","Notes"], rows:[
         ["<b>Benzydamine 0.15%</b> mouthwash or spray","Symptomatic relief — rinse or gargle 15 mL every 1.5–3 hours, per the product","A topical analgesic; it does not treat the underlying process. May sting, especially undiluted — can be diluted. Check the product's age and dosing instructions. The GM formulary lists it mainly for palliative care and after radiotherapy"],
         ["<b>Lidocaine</b> gel","Severe pain","If the throat feels numb, avoid eating or drinking until sensation returns — choking and aspiration risk, especially in children, frail adults and people with dysphagia"],
         ["<b>Chlorhexidine 0.2%</b> mouthwash","A short course for painful, recurrent or secondarily infected ulceration","May reduce severity and aids local hygiene, but does not prevent recurrence and is not needed for every ulcer. Tooth staining, taste disturbance, mucosal irritation, rare serious hypersensitivity; use at a different time from toothpaste; avoid in chlorhexidine allergy"],
         ["<b>Topical corticosteroid</b> — hydrocortisone 2.5 mg oromucosal tablets, or betamethasone 500 microgram soluble tablet as a mouthwash","Clinically diagnosed aphthous ulceration with substantial symptoms or frequent episodes; a short course, ideally early in the episode or during the prodrome","Betamethasone as a mouthwash is unlicensed — rinse and spit out, do not swallow. Candidiasis can occur. Caution where infection, immunosuppression or a non-aphthous diagnosis is possible. <b>Not a trial treatment for an unexplained ulcer persisting beyond 3 weeks</b>"],
         ["<b>Treat the cause</b>","If one is identified","Correct deficiency, treat coeliac disease or IBD, review causative medicines"]
       ]}
     ]},

         {tone:"blue", h:"3 · Systemic disease", html:"IBD, Behçet's, or a medicine cause?"},
         {tone:"amber", h:"4 · Trauma", html:"A sharp tooth or denture → dental review."},
         {tone:"blue", h:"5 · Refer", html:"Severe, major, complex or refractory recurrence → oral medicine."}

    {id:"refer", nav:"Refer", title:"When to refer",
     blocks:[
       {b:"cards", items:[
         {tone:"purple", h:"2WW · NICE NG12 — suspected oral cancer", html:"<b>Unexplained ulceration in the oral cavity lasting more than 3 weeks</b>, or a <b>persistent unexplained neck lump</b> → suspected cancer pathway referral, whether or not symptoms have improved. A lump on the lip or in the mouth, or a red or red-and-white patch consistent with erythroplakia or erythroleukoplakia → urgent dental assessment. Use the local head-and-neck pathway and document duration, exact site, size, induration, risk factors, and examination of the rest of the mouth and the neck."},
         {tone:"blue", h:"Oral medicine or OMFS", html:"Severe, frequent or disabling recurrent aphthosis · major or complex aphthosis · recurrence despite correcting a deficiency · suspected Behçet's, IBD or autoimmune blistering disease · suspected lichen planus or other chronic mucosal disease · diagnostic uncertainty. Routine minor aphthae can stay in primary care after appropriate assessment."},
         {tone:"amber", h:"Systemic disease", html:"Suspected Behçet's, IBD or another systemic cause → the relevant specialty. See <a href='crohns-disease.html'>Crohn's disease</a>."},
         {tone:"cream", h:"GP management", html:"Examination, the 3-week rule, the cause screen, self-care and the topical ladder belong here. Related pages: <a href='coeliac-disease.html'>coeliac disease</a> · <a href='iron-deficiency-anaemia.html'>iron deficiency anaemia</a> · <a href='crohns-disease.html'>Crohn's disease</a> · <a href='../algorithms/mouth-ulcers.html'>mouth ulcers pathway</a>."}
       ]},
       {b:"cards", items:[
         {tone:"red", h:"Safety-net", html:"\"Typical mouth ulcers are usually harmless and heal within 1–2 weeks. If an ulcer hasn't healed within 3 weeks, or it bleeds, feels hard, keeps getting rubbed by a tooth, or you notice a lump in your neck, come back — it needs checking urgently. Smoking and alcohol raise mouth-cancer risk.\""}
       ]},
       {b:"say", html:"Typical mouth ulcers are usually harmless and heal in a week or two, and we can ease the pain meanwhile. The one important rule: if an ulcer hasn't fully healed in three weeks — even if it hurts less — come straight back so we can get it checked urgently."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 58-year-old man who smokes 20 a day and drinks most evenings attends about a <b>painful ulcer on the side of his tongue, present for about 5 weeks</b>. He says it is \"less sore than it was\" since using a mouthwash from the pharmacy, and has come mainly because his wife insisted. He has had occasional mouth ulcers before that settled in a week."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Refers on the suspected oral cancer pathway under NICE NG12 — the decisive action; recognises that improving symptoms do not mean healing; notes the lateral tongue site, smoking and alcohol as compounding risk; examines the whole mouth, the floor of the mouth and the neck; <b>does not prescribe a topical steroid as a trial</b>; explains the referral without alarm or false reassurance; addresses smoking and alcohol; and documents the duration explicitly."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",

  foot:"Aphthous ulceration in primary care — NICE NG12. Typical minor aphthae heal in about 1–2 weeks. Unexplained oral ulceration lasting more than 3 weeks, or a persistent unexplained neck lump: suspected cancer pathway, whatever the symptom response. Oral lumps and red or red-and-white patches: urgent dental assessment. Same-day for airway, hydration, SJS/TEN, severe infection, immunocompromise or methotrexate ulceration. Screen recurrent, severe or atypical ulceration for deficiency, coeliac disease, IBD, Behçet's and medicines. Self-care first; topical corticosteroid only for diagnosed aphthae. Sources: NICE NG12, PCDS, BAD/BSR (2025), Greater Manchester formulary, MHRA SPCs. Verify doses against the current BNF."
