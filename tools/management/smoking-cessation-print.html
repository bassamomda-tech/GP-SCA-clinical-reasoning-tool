MG.render({
  icon:"🚭",
  title:"Smoking cessation",
  eyebrow:"Protocol · advise, treat and follow up in one place",
  stemTitle:"Ask everyone, advise briefly, then pair behavioural support with an effective treatment",
  stemSub:"One page for helping people stop smoking. Ask about smoking at every contact and give very brief advice, refer to a stop smoking service, and match behavioural support with one of the options NICE NG209 (updated February 2025) rates as most likely to work — varenicline, cytisinicline, combination NRT or a nicotine vape. Time the quit date to the drug, adapt for pregnancy and mental illness, and check the medicines whose exposure or effect may change when tobacco smoke stops, coordinating any dose change with the relevant prescriber. NICE NG209 · NICE QS207 (2022) · MHRA DSU Aug 2020 · SPCs · NCSCT.",
  guideline:"NICE NG209 (2021, updated Feb 2025) · NICE QS207 (Dec 2022) · MHRA Drug Safety Update (Aug 2020) · SPCs · BNF · NCSCT",
  meta:[
    {t:"NICE NG209 (2021, updated Feb 2025)"},
    {t:"NICE QS207 (Dec 2022)"},

  ],
  lead:"<div class='mg-layers'><a href='#vba'><b>Ask and advise</b><small>Every contact</small></a><a href='#choose'><b>Choose treatment</b><small>With support</small></a><a href='#interactions'><b>Interactions</b><small>Levels rise on quitting</small></a><a href='#pregnancy'><b>Pregnancy</b><small>CO test and NRT</small></a><a href='#refer'><b>Refer</b><small>Stop smoking service</small></a></div>",
  quickSub:"Six points that change what you do in the room. Each traces to a named source under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"green", h:"Ask, advise, act — at every contact", html:"Record smoking status, advise that the most effective way to stop is with specialist support plus medication or a nicotine vape, and offer a referral there and then. The NCSCT model is <b>Ask – Advise – Act</b>, and it takes well under a minute. You don’t need the person to be ‘ready’ — the offer itself prompts quit attempts.", src:"NICE QS207 statements 1–3 · NCSCT very brief advice"},
    {tone:"cream", h:"Support plus an effective treatment", html:"NICE NG209: behavioural support combined with <b>varenicline</b>, <b>cytisinicline</b>, <b>combination NRT (short-acting plus long-acting)</b> or a <b>nicotine-containing e-cigarette</b> is more likely to lead to a successful quit than other options; bupropion is an additional option. The options are not interchangeable in every patient: select through shared decision-making on preference, age, pregnancy or breastfeeding, renal function, seizure risk, eating-disorder and psychiatric history, cardiovascular disease, current medicines and interactions, and access to local stop smoking support, and check the relevant SPC. Do not routinely combine pharmacotherapies other than combination NRT without specialist advice or a local protocol. Offer behavioural support whichever option the person chooses.", src:"NICE NG209 (updated Feb 2025)"},
    {tone:"blue", h:"Time the quit date to the drug", html:"NICE NG209: <b>varenicline</b> — start 1 to 2 weeks before the quit date; <b>cytisinicline</b> — quit date within the first 5 days; <b>bupropion</b> — quit date within the first 2 weeks; <b>NRT</b> — have it ready to start the day before the quit date.", src:"NICE NG209 (updated Feb 2025)"},
    {tone:"red", h:"Levels rise when the smoke stops", html:"Tobacco smoke (not nicotine) induces CYP1A2. On stopping — including switching to NRT or a vape — levels of <b>clozapine, olanzapine and theophylline</b> can rise within days. The MHRA advises checking clozapine levels when someone stops smoking or switches to e-cigarettes. NRT and vapes do not reverse this. Coordinate monitoring and any dose change with the relevant prescriber or specialist — do not make automatic dose changes.", src:"MHRA DSU Aug 2020 · SPS smoking interactions"},
    {tone:"amber", h:"Age limits and contraindications", html:"NICE NG209: do not offer <b>varenicline, cytisinicline or bupropion under 18</b>, and do not offer <b>cytisinicline at 66 or over</b>. Cytisinicline is contraindicated in pregnancy, breastfeeding, unstable angina, recent MI or stroke and significant arrhythmia; bupropion in seizure disorder or any seizure history, current or past bulimia or anorexia nervosa, and the other conditions in the SPC. <b>Assess renal function before varenicline</b> — dose reduction is required in severe renal impairment (SPC).", src:"NICE NG209 · SPC cytisinicline · SPC varenicline · SPC Zyban"},
    {tone:"green", h:"Pregnancy: CO test, opt-out referral, NRT", html:"Offer carbon monoxide testing <b>at booking and at 36 weeks</b>, with additional testing where the person smokes, is quitting, has recently stopped or had a reading of <b>4 ppm or above</b>, and an <b>opt-out referral</b> to specialist maternity stop smoking support in these circumstances. NG209 supports NRT in pregnancy and <b>financial incentives</b> for biochemically validated abstinence. During pregnancy or breastfeeding, do not offer varenicline, cytisinicline or bupropion.", src:"NICE NG209 (pregnancy recommendations)"}
  ],
  pathwaySub:"Five steps from the first question to staying stopped. Step 1 is the one to screen before anything else.",
  pathway:[
    {title:"Check what stopping will change", html:"Before the quit date: <b>clozapine, olanzapine, theophylline or aminophylline, warfarin, insulin, erlotinib or methadone</b>? Pregnant or breastfeeding? Renal function (varenicline)? History of seizures, an eating disorder, MAOI use or alcohol/benzodiazepine withdrawal (bupropion)? Age 66 or over, recent MI, stroke or unstable angina (cytisinicline)? Current psychiatric stability, or severe mental illness needing closer review? These shape the choice of drug and the monitoring plan.", alert:true},
    {title:"Very brief advice and an offer", html:"<b>Ask</b> and record smoking status. <b>Advise</b> that stopping in one go is the best approach, and that specialist support combined with treatment is more effective than trying alone. <b>Act</b>: refer to the local stop smoking service or start treatment today (NCSCT; NICE QS207). If not ready to stop in one go, offer a harm-reduction route (QS207 statement 4)."},
    {title:"Assess dependence and history", html:"Cigarettes per day, time to the first cigarette after waking (within 30 minutes suggests higher dependence), past attempts, previous NRT response and what helped or got in the way, triggers, other household smokers, and preferences about medication and vaping."},
    {title:"Choose and start treatment", html:"Behavioural support <b>plus</b> varenicline, cytisinicline, combination NRT or a nicotine vape (NG209). Bupropion is a further option, where appropriate. Select the treatment through shared decision-making and check the relevant SPC. Set the quit date to suit the drug, document smoking status and the plan, and give practical instructions and a follow-up date."},
    {title:"Follow up and prevent relapse", html:"Review within the first 1–2 weeks after starting treatment or around the quit date: cravings, withdrawal, adherence, adverse effects, mental state, NRT dose, CO reading if available, and affected medicines and drug levels. Treat a lapse as an opportunity to reassess triggers, treatment dose and support. Maintain relapse-prevention support beyond the treatment course and re-offer at every future contact."}
  ],
  sections:[
    {id:"vba", nav:"Ask and advise", title:"Very brief advice — every smoker, every time", sub:"NICE QS207 sets asking, advising and offering treatment as the expected standard. The NCSCT model makes it fit any consultation.",
     blocks:[
       {b:"kv", rows:[
         ["ASK","Ask whether the person smokes and record it — at key contacts and whenever the record is out of date (NICE QS207 statement 1)"],
         ["ADVISE","Advise on the most effective way to stop: <b>specialist support combined with medication or a nicotine vape</b>. Keep it personal and free of judgement (NCSCT; QS207 statement 2)"],
         ["ACT","Offer referral to the local stop smoking service and/or start treatment now; for those who decline, leave the door open and record the offer (QS207 statement 3)"],
         ["Not ready to stop in one go?","Offer harm reduction: cutting down with the help of licensed nicotine products, temporary abstinence, or switching completely to a vape (NICE QS207 statement 4; NG209)"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"Don’t wait for motivation", html:"Very brief advice is designed to be given opportunistically by any health professional, to any smoker, in almost any setting. Offering help, rather than asking whether someone wants to stop, generates more quit attempts.", src:"NCSCT very brief advice · NICE QS207 statements 2–3"},
         {tone:"blue", h:"Why the service matters", html:"People using specialist stop smoking support are substantially more likely to stop than those attempting to stop without support (around three times in observational service data, compared with unsupported attempts). Referral is the single highest-yield action in the consultation.", src:"NCSCT clinical case for stop smoking services · NICE NG209"}
       ]},
       {b:"say", html:"Can I check — do you smoke at the moment? The single most useful thing I can tell you is that people who stop with support from the stop smoking service plus a treatment, like tablets, nicotine replacement or a vape, are far more likely to succeed than going cold turkey. Would you like me to refer you today?"},
       {b:"why", html:"<b>Why every contact?</b> Most people who smoke want to stop and most attempts are unaided, which is the least successful route. A brief, routine offer of effective help shifts people from unaided attempts to supported ones. <b>Why record it?</b> Smoking status drives risk assessment (cardiovascular risk, pregnancy, surgery) and the interaction checks below."}
     ]},

    {id:"choose", nav:"Choose treatment", title:"Choosing a treatment — the NG209 options", sub:"All options are paired with behavioural support and chosen through shared decision-making — they are not interchangeable in every patient. Licensed indications, NICE recommendations and off-label use are distinguished below. Do not routinely combine pharmacotherapies other than combination NRT without specialist advice or a local protocol. Doses are from the SPCs — check the current BNF and SPC before prescribing.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Option", title:"Varenicline", when:"adults 18 and over", fromLabel:"back in NHS supply",
          html:"Partial agonist at nicotinic receptors. Start <b>1 to 2 weeks before the quit date</b> (NICE NG209). SPC titration: <span class='rx'>0.5 mg once daily on days 1–3, 0.5 mg twice daily on days 4–7, then 1 mg twice daily</span> for a <b>12-week course</b>. After a successful 12-week course, consider a further 12 weeks for people at high risk of relapse or who prefer continued support, after reviewing benefit, adverse effects and renal function — relapse prevention, not automatic continuation. <b>Assess renal function before prescribing</b>: dose reduction is required in severe renal impairment; consult the current SPC. Not usually initiated without specialist advice in severe renal impairment or dialysis. Common effects: nausea (take with food and water), abnormal dreams, insomnia, headache. Branded varenicline was withdrawn in 2021 because of a nitrosamine impurity; an MHRA-approved generic returned to NHS use in England in November 2024."},
         {step:"Option", title:"Cytisinicline (cytisine)", when:"adults 18 to 65", fromLabel:"added to NG209 in 2025",
          html:"Plant-derived partial agonist with a fixed <b>25-day course</b> of 1.5 mg tablets (SPC): <span class='rx'>days 1–3, 1 tablet every 2 hours (max 6 a day); days 4–12, every 2.5 hours (max 5); days 13–16, every 3 hours (max 4); days 17–20, every 5 hours (max 3); days 21–25, 1–2 a day</span>. NG209: set the quit date <b>within the first 5 days</b>; no difference in effectiveness was found against varenicline. Not under 18 or at 66 and over (NG209). Contraindicated in pregnancy, breastfeeding, unstable angina, recent MI or stroke and clinically significant arrhythmia (SPC). NICE recommends it as an option combined with behavioural support; do not routinely combine it with varenicline, bupropion, NRT, vaping or other smoking-cessation treatments unless directed by a specialist or an evidence-based local protocol."},
         {step:"Option", title:"Combination NRT", when:"from 12 years; pregnancy; heart disease", fromLabel:"patch plus a fast-acting form",
          html:"A <b>long-acting patch plus a short-acting product</b> (gum, lozenge, inhalator, mouth or nasal spray) used together — combination beats a single form (Cochrane, Lindson 2019: RR 1.25, high certainty). Select the initial patch strength and short-acting NRT according to cigarette consumption, time to first cigarette, dependence and previous response — not cigarette count alone (also consider morning cravings, withdrawal, high-strength tobacco or roll-ups, concurrent vaping, and continued smoking after starting NRT). For example, for 10 or more cigarettes a day, <span class='rx'>21 mg/24 h</span> or <span class='rx'>25 mg/16 h</span> per SPC, stepping down over the course. NG209: have NRT ready the day before the quit date; starting the patch before quit day (‘preloading’) modestly increases quitting (Cochrane, Theodoulou 2023: RR 1.25, moderate certainty). Titrate the short-acting product to cravings and withdrawal symptoms."},
         {step:"Option", title:"Nicotine-containing e-cigarette", when:"adults who want to use one", fromLabel:"not a licensed medicine",
          html:"NICE NG209 lists nicotine vapes among the most effective options when combined with behavioural support. Give clear, up-to-date information: they are <b>not licensed medicines</b> (none was licensed and on the UK market at the time of the 2025 update), they are <b>much less harmful than smoking</b> because most harmful components of smoke are absent, and <b>long-term harms are not yet known</b>. Vaping is a regulated tobacco-dependence intervention, not a licensed medicine: advise reputable, legally regulated products and <b>complete switching rather than dual use</b>, then aim to stop vaping when the risk of returning to smoking is low. Using a vape together with high-dose NRT is not routine; it may suit selected people with high dependence, guided by the stop smoking service or local protocol. Do not smoke or vape near home oxygen equipment (fire risk). Cochrane (Lindson et al, updated 2025) found high-certainty evidence that nicotine vapes increase quit rates compared with NRT."},
         {step:"Further option", title:"Bupropion", when:"adults 18 and over", fromLabel:"check contraindications",
          html:"SPC: <span class='rx'>150 mg once daily for 6 days, then 150 mg twice daily</span>, for <b>7 to 9 weeks</b>. NG209: set the quit date within the <b>first 2 weeks</b> of treatment. Dose-related seizure risk — check the current SPC. Contraindicated with a current seizure disorder or any history of seizures and current or past <b>bulimia or anorexia nervosa</b>; also check the SPC for MAOI treatment or recent MAOI use, abrupt withdrawal from alcohol, benzodiazepines, barbiturates or antiepileptics, severe hepatic cirrhosis, bipolar disorder or significant psychiatric history, medicines that lower the seizure threshold, other bupropion-containing preparations and uncontrolled hypertension. A further option, not preferred first-line over cytisinicline, varenicline, combination NRT or a nicotine vape. Not offered in pregnancy or breastfeeding (NG209)."}
       ]},
       {b:"table", head:["Treatment","When to set the quit date (NG209)","Course (SPC)"], rows:[
         ["Varenicline","Start 1–2 weeks before the quit date","12 weeks; a further 12 may be considered for relapse prevention (not automatic); check renal function"],
         ["Cytisinicline","Within the first 5 days","25 days"],
         ["Bupropion","Within the first 2 weeks","7–9 weeks"],
         ["NRT","Ready to start the day before (or preload)","Typically about 8–12 weeks, stepping down per SPC"],
         ["Nicotine vape","As agreed with the person","Aim to stop vaping once confident of staying smoke-free"]
       ]},
       {b:"why", html:"<b>Why these options?</b> The NG209 committee found that behavioural support plus varenicline, cytisinicline, combination NRT or a nicotine vape gave the best chance of success, with similar effectiveness among them. That puts the person’s preference, contraindications and past experience at the centre of the choice. <b>Neuropsychiatric safety:</b> the EAGLES trial (Anthenelli et al, Lancet 2016) found no significant increase in serious neuropsychiatric events with varenicline or bupropion compared with nicotine patch or placebo, in people with or without stable psychiatric disorders. This applies to clinically stable participants under trial conditions: assess current mental state, suicide risk and treatment adherence, and arrange closer follow-up where clinically indicated."}
     ]},

    {id:"support", nav:"Behavioural support", title:"Behavioural support — half of the treatment", sub:"NICE NG209 asks for behavioural support whichever option the person chooses. What that looks like in general practice.",
     blocks:[
       {b:"tiles", v:"life", items:[
         {t:"📅 Quit date and ‘not a puff’", html:"Agree a date, timed to the drug. From then, aim for no cigarettes at all. For those not ready, cutting down with licensed nicotine products is a legitimate step (QS207 statement 4)."},
         {t:"🤝 Stop smoking service", html:"Weekly support over the first weeks, CO monitoring and access to medication — offered by local authority services and community pharmacies."},
         {t:"🧠 Triggers and routines", html:"Plan for the high-risk moments: alcohol, coffee, work breaks, stress, other smokers. Rehearse what to do instead."},
         {t:"🏠 Home and car", html:"Encourage a smoke-free home and car, and invite household smokers to stop at the same time."},
         {t:"⚖️ Weight worries", html:"Some weight gain is common after stopping. Acknowledge it and plan activity and eating, but be clear the health gain far outweighs it."},
         {t:"📱 Digital and phone support", html:"Signpost the NHS Quit Smoking app and national helpline as extras, not replacements for a service referral."}
       ]},
       {b:"say", html:"Stopping is much more likely to work with support and a treatment than on willpower alone. I’ll refer you to the stop smoking service, we’ll pick the treatment that suits you and set a quit date that fits it. If you slip, that isn’t failure — it tells us what to change for the next go."}
     ]},

    {id:"interactions", nav:"Interactions", title:"Medicines that change when someone stops smoking", sub:"Polycyclic aromatic hydrocarbons in tobacco smoke induce CYP1A2. The induction wears off after stopping, so levels of some drugs rise. Nicotine itself — from NRT or a vape — does not cause the induction. The table separates the pharmacokinetic risk, the monitoring needed and decisions that belong to the specialist prescriber; not every listed medicine shows a predictable clinically significant change.",
     blocks:[
       {b:"table", head:["Medicine","What happens on stopping","What to do"], rows:[
         ["Clozapine","Removal of smoke-related CYP1A2 induction: levels can rise rapidly and toxicity can occur — warn about sedation, hypersalivation, dizziness, tachycardia, constipation or ileus, seizures, and confusion or delirium","Contact the clozapine/mental health team before the quit date where possible. Record baseline smoking status and arrange the local clozapine monitoring plan; <b>plasma levels</b> when smoking stops or changes (MHRA DSU Aug 2020). Do not independently reduce clozapine unless agreed with the specialist prescriber"],
         ["Olanzapine","Levels may rise","Inform the prescribing mental health team and monitor for sedation, extrapyramidal symptoms, hypotension and other adverse effects; dose adjustment may be required, decided by the prescriber (SPS)"],
         ["Theophylline, aminophylline","Concentrations can increase — toxicity: nausea, vomiting, tremor, palpitations, arrhythmias, seizures","Check theophylline levels and adjust with the respiratory prescriber or medicines-optimisation team (SPS; BNF)"],
         ["Warfarin","Clearance falls; INR may rise","Arrange additional INR monitoring after a significant smoking change and adjust warfarin only according to INR and the anticoagulation service/local protocol; do not pre-emptively alter the dose (SPS)"],
         ["Insulin","Insulin sensitivity may improve and requirements may change","Encourage closer glucose monitoring during the first weeks and adjust insulin according to glucose results; no automatic dose change (SPS)"],
         ["Erlotinib, methadone and others","Exposure or clinical effect may change after smoking cessation; a clinically significant change is not predictable for every medicine","Check the individual medicine in the SPS resource and SPC, and coordinate monitoring with the prescriber"]
       ]},
       {b:"warn", html:"<b>The interaction follows the smoke, not the nicotine.</b> Someone on clozapine who switches overnight from cigarettes to a vape or NRT has lost the enzyme induction just as if they had stopped altogether. The same applies to people admitted to a smoke-free hospital. Plan it with the prescriber before the quit date."},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"Restarting smoking reverses it", html:"If someone relapses after the dose was reduced, levels will fall again — ask about smoking status at every review of clozapine, olanzapine, theophylline and warfarin, and reassess monitoring after any relapse.", src:"SPS managing specific interactions with smoking · BNF interactions"},
         {tone:"blue", h:"MHRA: when to check clozapine levels", html:"Stopping smoking or switching to e-cigarettes, interacting medicines, pneumonia or other serious infection, suspected reduced metabolism, or suspected toxicity.", src:"MHRA DSU Aug 2020"}
       ]}
     ]},

    {id:"pregnancy", nav:"Pregnancy", title:"Pregnancy and the year after birth", sub:"NICE NG209 has a dedicated set of recommendations. Smoking in pregnancy is the setting where the stakes and the support are highest.",
     blocks:[
       {b:"cards", items:[
         {tone:"green", h:"CO test and opt-out referral", html:"Offer CO testing <b>at booking and at 36 weeks</b>, with additional testing during pregnancy where the person smokes, is quitting, has recently stopped or had a previous reading of <b>4 ppm or above</b>. Provide an <b>opt-out referral</b> to specialist maternity stop smoking support if they smoke, stopped within the previous 2 weeks, have a CO reading of 4 ppm or above, or have not engaged after a previous referral. Biochemical validation of cessation at the quit date and 4 weeks later is recommended where feasible; cotinine interpretation must account for NRT.", src:"NICE NG209 (pregnancy)"},
         {tone:"cream", h:"NRT is the medicinal option", html:"Explain that most harm comes from the other components of tobacco smoke rather than nicotine, and that any risk from NRT is much lower than from smoking. Use enough nicotine to control withdrawal and avoid compensatory smoking: a 16-hour patch can be removed overnight, combined with short-acting NRT when needed. Offer intensive behavioural support with specialist maternity stop smoking support, and agree a review plan.", src:"NICE NG209 (pregnancy) · SPC NRT"},
         {tone:"green", h:"Financial incentives", html:"NG209 recommends financial incentives (such as vouchers) for pregnant women who stop, conditional on abstinence verified biochemically, for example a CO reading below 4 ppm.", src:"NICE NG209 (incentives evidence review)"},
         {tone:"blue", h:"Vapes in pregnancy", html:"The NICE NG209 recommendations were checked in 2023 against a large trial of e-cigarettes versus patches in pregnancy and did not change them, but added text on the uncertainty about their effectiveness and safety. NICE does not recommend vapes as the routine first-line medicinal option in pregnancy. If someone is already vaping and this has enabled complete smoking cessation, avoid encouraging a return to smoking and involve the specialist maternity stop smoking team.", src:"NICE NG209 (2023 surveillance)"},
         {tone:"amber", h:"Not in pregnancy or breastfeeding", html:"During pregnancy or breastfeeding, do not offer varenicline, cytisinicline or bupropion (NICE NG209). Offer intensive behavioural support and consider NRT, with specialist maternity stop smoking support.", src:"NICE NG209 · SPC cytisinicline · SPC varenicline · SPC Zyban"}
       ]},
       {b:"say", html:"The nicotine isn’t what harms the baby — it’s the carbon monoxide and the other chemicals in the smoke. Nicotine replacement is much safer than smoking, and the midwife’s stop smoking team can give you support and, in many areas, vouchers when you stay stopped."}
     ]},

    {id:"special", nav:"Special groups", title:"People who need a different approach", sub:"Where the plan changes because of the person, not the product.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"🧠 Severe mental illness", html:"Smoking rates are far higher and life expectancy most affected, so offer help actively. Varenicline and bupropion have not shown a significant excess of serious neuropsychiatric adverse events compared with NRT or placebo in the EAGLES trial, including in people with stable psychiatric illness. Assess current mental state, suicide risk and treatment adherence, and arrange closer follow-up where clinically indicated. EAGLES does not override current mania or psychosis, active suicidal risk, uncontrolled psychiatric illness, clozapine monitoring requirements or the need to liaise with secondary mental health services; plan the <b>clozapine and olanzapine</b> monitoring with the mental health team.", src:"Anthenelli et al, Lancet 2016 · MHRA DSU Aug 2020"},
         {tone:"blue", h:"❤️ Cardiovascular and respiratory disease", html:"Stopping is among the most valuable single interventions in COPD, coronary and cerebrovascular disease and diabetes. NRT can be used in stable cardiovascular disease; check cytisinicline contraindications (unstable angina, recent MI or stroke, significant arrhythmia).", src:"SPC cytisinicline · NICE NG209"},
         {tone:"cream", h:"🧒 Young people", html:"NRT can be used from 12 years. Do not offer varenicline, cytisinicline or bupropion under 18. Vapes are not for young people who don’t smoke, and sale to under-18s is illegal.", src:"NICE NG209 (updated Feb 2025)"},
         {tone:"blue", h:"🏥 Before surgery or admission", html:"Hospitals are expected to offer treatment on admission (QS207 statement 5). A planned operation is a strong motivator — refer early and consider the interaction checks for anyone admitted.", src:"NICE QS207 statement 5"},
         {tone:"cream", h:"👴 Older adults", html:"Cytisinicline is not offered at 66 or over (NG209); varenicline (check renal function), combination NRT and vapes remain options.", src:"NICE NG209 (updated Feb 2025)"},
         {tone:"red", h:"🔥 Home oxygen", html:"People using home oxygen must not smoke or vape near oxygen equipment because of the fire risk."}
       ]}
     ]},

    {id:"followup", nav:"Follow up", title:"Follow-up and relapse prevention", sub:"The first few weeks decide most quit attempts. Build the review in at the start.",
     blocks:[
       {b:"table", head:["When","Focus","Action"], rows:[
         ["Before the quit date","Start the drug (timing per NG209)","Varenicline 1–2 weeks before; cytisinicline quit within 5 days; bupropion quit within 2 weeks; NRT ready or preloaded"],
         ["Quit date","Interacting medicines","Clozapine and theophylline levels per the prescriber’s plan; extra INR checks if on warfarin; glucose monitoring if on insulin — dose changes by the relevant prescriber"],
         ["Weeks 1–2 (then to week 4)","Cravings, withdrawal, adherence, adverse effects, mental state","Adjust NRT, take varenicline with food, consider CO reading; troubleshoot triggers"],
         ["End of course","Staying stopped","Varenicline: consider a further 12 weeks for people at high risk of relapse or who prefer continued support, after reviewing benefit, adverse effects and renal function (SPC); maintain relapse-prevention support; plan for high-risk situations"],
         ["Any lapse","Reassess","Treat a lapse as an opportunity to reassess triggers, treatment dose and support. Check whether regular smoking has restarted, the treatment is being used correctly, a change is needed and clozapine/theophylline/warfarin monitoring is required. If regular smoking has restarted, reset the quit plan and reassess medicines affected by smoking status"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"1 · Enough treatment?", html:"Single-form NRT at too low a dose is the commonest gap — move to combination and titrate the fast-acting form.", src:"Cochrane, Lindson 2019 · SPC NRT"},
         {tone:"amber", h:"2 · Support in place?", html:"Actually referred and attending, or going it alone?", src:"NICE NG209 · NCSCT"},
         {tone:"amber", h:"3 · Side effects driving relapse?", html:"Nausea or dreams on varenicline, skin reactions to patches → switch product rather than abandon the attempt.", src:"SPC varenicline · SPC NRT"},
         {tone:"green", h:"4 · Try another option", html:"Any of varenicline, cytisinicline, combination NRT or a vape can follow a failed attempt with another (switch rather than routinely combine, other than combination NRT); re-offer at the next contact.", src:"NICE NG209 (updated Feb 2025)"}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer and signpost", sub:"Stopping smoking is managed in primary care and stop smoking services. There is no NG12 criterion for smoking itself — smoking raises risk, but the cancer referral criteria are symptom-based.",
     blocks:[
       {b:"cards", items:[
         {tone:"cream", h:"Local stop smoking service", html:"Behavioural support, CO monitoring and access to medication. The highest-yield referral in the consultation.", src:"NICE NG209 · NCSCT"},
         {tone:"cream", h:"Community pharmacy", html:"NHS pharmacy smoking cessation services can supply treatment and support, including continuing support started in hospital.", src:"NHS England community pharmacy smoking cessation service · NICE QS207 statement 5"},
         {tone:"amber", h:"Mental health team", html:"Before the quit date for anyone on clozapine or olanzapine, so that levels and doses can be managed by the specialist prescriber. Likewise involve the respiratory prescriber for theophylline and the anticoagulation service for warfarin.", src:"MHRA DSU Aug 2020 · SPS"},
         {tone:"green", h:"Maternity stop smoking support", html:"Opt-out referral if the person smokes, stopped within the previous 2 weeks, has a CO reading of 4 ppm or above, or has not engaged after a previous referral; incentive schemes where available.", src:"NICE NG209 (pregnancy)"},
         {tone:"blue", h:"Symptoms, not smoking, trigger cancer referral", html:"Unexplained haemoptysis, persistent cough, weight loss or other symptoms are assessed against NICE NG12 on their own merits; smoking history lowers the threshold for chest X-ray in the NG12 lung criteria.", src:"NICE NG12 (updated April 2026)"}
       ]},
       {b:"say", html:"I’m going to put you in touch with the stop smoking service — the people who use it do much better than those who try alone. We’ll get a treatment started around your quit date, and I’ll keep an eye on anything else your stopping affects."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 46-year-old man with schizophrenia, stable on clozapine, attends for a medication review. He smokes 25 cigarettes a day, has tried to stop twice using a single nicotine patch, and says his sister stopped with a vape. He wants to try again because his first child is due in the summer."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Uses <b>Ask–Advise–Act</b> without judgement; explores past attempts and why single-form NRT failed; offers <b>behavioural support plus</b> varenicline, cytisinicline, <b>combination NRT</b> or a <b>vape</b> and lets him choose; sets the quit date to suit the drug; recognises that <b>clozapine levels will rise</b> whether he stops or switches to a vape, and arranges <b>levels and liaison with the mental health team</b> before the quit date (MHRA DSU Aug 2020); reassures about neuropsychiatric safety in stable illness (EAGLES) while assessing current mental state and planning a mood review; does not change the clozapine dose without the specialist prescriber; refers to the stop smoking service; and mentions support for his partner through maternity services.", src:"NICE NG209 · MHRA DSU Aug 2020 · Anthenelli et al, Lancet 2016"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every recommendation and figure on this page traces to a named primary source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG209 — Tobacco: preventing uptake, promoting quitting and treating dependence</b> (November 2021, last updated February 2025)<br><a href="https://www.nice.org.uk/guidance/ng209" rel="noopener">nice.org.uk/guidance/ng209</a><span class="rd"> — behavioural support with varenicline, cytisinicline, combination NRT or a nicotine vape as most likely to succeed; quit-date timing for each drug; no varenicline, cytisinicline or bupropion under 18, no cytisinicline at 66 or over; information about nicotine vapes; pregnancy: CO testing at booking and 36 weeks, opt-out referral, NRT, no varenicline, cytisinicline or bupropion in pregnancy or breastfeeding, financial incentives; 2023 surveillance on vapes in pregnancy</span></li>'+
         '<li><b>NICE QS207 — Tobacco: treating dependence</b> (15 December 2022)<br><a href="https://www.nice.org.uk/guidance/qs207" rel="noopener">nice.org.uk/guidance/qs207</a><span class="rd"> — asking about tobacco, advice, offering support and treatment, harm reduction, treatment on hospital admission</span></li>'+
         '<li><b>MHRA Drug Safety Update — Clozapine and other antipsychotics: monitoring blood concentrations for toxicity</b> (August 2020)<br><a href="https://www.gov.uk/drug-safety-update/clozapine-and-other-antipsychotics-monitoring-blood-concentrations-for-toxicity" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> — check levels on stopping smoking or switching to e-cigarettes</span></li>'+
         '<li><b>NHS Specialist Pharmacy Service — Managing specific interactions with smoking; Considering drug interactions with smoking</b><br><a href="https://www.sps.nhs.uk/articles/managing-specific-interactions-with-smoking/" rel="noopener">sps.nhs.uk</a><span class="rd"> — CYP1A2 induction by smoke not nicotine; clozapine, olanzapine, theophylline, warfarin, insulin, erlotinib, methadone</span></li>'+
         '<li><b>Summaries of Product Characteristics</b> — varenicline (titration, 12 + 12 weeks, dose reduction in severe renal impairment); cytisinicline 1.5 mg (25-day schedule, contraindications, not recommended over 65); Zyban (150 mg daily for 6 days then twice daily, 7–9 weeks, seizure, eating-disorder, MAOI, alcohol/benzodiazepine-withdrawal and hepatic contraindications and cautions); NiQuitin and Nicorette Invisi patches (strength by cigarettes per day)</li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — smoking cessation drugs and theophylline interactions</span></li>'+
         '<li><b>NCSCT — Very Brief Advice on Smoking; the clinical case for stop smoking services</b><br><a href="https://www.ncsct.co.uk" rel="noopener">ncsct.co.uk</a><span class="rd"> — Ask, Advise, Act; specialist support substantially increases the chance of stopping (around three times in observational service data, compared with unsupported attempts)</span></li>'+
         '<li><b>NHS England — NHS rolls out stop-smoking pill</b> (November 2024)<br><a href="https://www.england.nhs.uk/2024/11/nhs-rolls-out-stop-smoking-pill-to-help-tens-of-thousands-quit/" rel="noopener">england.nhs.uk</a><span class="rd"> — MHRA-approved generic varenicline returned to NHS use</span></li>'+
         '<li><b>Anthenelli RM, et al. EAGLES trial.</b> Lancet 2016;387:2507–20<span class="rd"> — no significant increase in serious neuropsychiatric adverse events with varenicline or bupropion versus nicotine patch or placebo, in clinically stable participants under trial conditions</span></li>'+
         '<li><b>Lindson N, et al. Different doses, durations and modes of delivery of NRT.</b> Cochrane 2019 (CD013308)<span class="rd"> — combination versus single-form NRT RR 1.25, high certainty</span></li>'+
         '<li><b>Theodoulou A, et al.</b> Cochrane 2023 (CD013308.pub2)<span class="rd"> — preloading NRT before quit day RR 1.25, moderate certainty</span></li>'+
         '<li><b>Lindson N, et al. Electronic cigarettes for smoking cessation.</b> Cochrane living review (CD010216, updated 2025)<span class="rd"> — high-certainty evidence that nicotine vapes increase quit rates compared with NRT</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Smoking cessation in adults — NICE NG209 (2021, updated February 2025) and QS207 (2022), MHRA Drug Safety Update (August 2020), the SPCs and BNF, NHS Specialist Pharmacy Service interaction guidance, NCSCT training materials, and Cochrane reviews for effect sizes. Verify every dose against the current BNF and SPC before prescribing (including renal function for varenicline), coordinate dose changes of interacting medicines with the relevant prescriber, and check local stop smoking service arrangements."
