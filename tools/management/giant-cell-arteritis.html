<script>
MG.render({
  icon:"👁️",
  title:"Giant cell arteritis",
  eyebrow:"Protocol · assess and manage in one place",
  stemTitle:"Giant cell arteritis — steroid in the same consultation, specialist the same day, sight is the clock",
  stemSub:"For the person aged 50 or over with new cranial symptoms, visual symptoms, jaw or tongue claudication or compatible systemic/PMR features. Assess the clinical probability of GCA: if suspicion is strong, start prednisolone immediately without waiting for blood results or imaging, get the patient onto the local fast-track GCA pathway the same working day, make sure urgent ultrasound or biopsy happens through that pathway, assess fracture risk and protect adrenals (and the stomach where GI risk warrants it) from the first prescription, and follow an individualised specialist taper with a plan for relapse. Sources: BSR GCA guideline 2020 · NICE TA518 · NOGG 2024 · NICE NG243 · DVLA · EULAR 2018/2023 and ACR/EULAR 2022 (international).",
  guideline:"BSR GCA guideline (Mackie et al. 2020) · NICE TA518 (2018) · NOGG 2024",
  meta:[
    {t:"BSR GCA guideline · Mackie 2020"},
    {t:"NICE TA518 · tocilizumab (2018)"},
    {t:"NOGG 2024 · NICE NG243 (2024)"},
    {t:"DVLA · visual field defect duty", tone:"tw"},
    {t:"EULAR 2018/2023 · ACR/EULAR 2022 (international)"},
    {t:"No NG12 criterion maps to GCA"}
  ],
  lead:"<div class='mg-layers'><a href='#recognise'><b>Suspect</b><small>Over 50, new cranial symptoms</small></a><a href='#treat'><b>Treat now</b><small>Prednisolone today</small></a><a href='#confirm'><b>Confirm</b><small>Urgent USS or biopsy</small></a><a href='#refer'><b>Refer</b><small>Same working day</small></a></div>",
  quickSub:"The six things that decide whether this patient keeps their sight. Each figure is traced to the source named under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"Treat on suspicion — do not wait for any test", html:"When GCA is strongly suspected, the GP starts glucocorticoid in the same consultation and refers urgently to the local GCA pathway at the same time. Neither ultrasound, biopsy nor the specialist appointment should hold back the first dose. Most GCA-related sight loss happens before treatment starts or soon after it, which is why the BSR guideline puts the prescription before the confirmation. A raised ESR or CRP supports the diagnosis but is not diagnostic; normal markers make GCA less likely but do not exclude it, particularly with visual symptoms. <b>Do not treat an isolated raised ESR/CRP as GCA without clinical evidence</b> — consider infection, malignancy, other inflammatory disease and drug-related causes.", src:"BSR GCA guideline 2020 (Mackie et al.)"},
    {tone:"red", h:"Dose: 40–60 mg — sight at risk means same-day specialist care", html:"Strongly suspected GCA without visual or other ischaemic complications: <b>prednisolone 40–60 mg once daily</b> as a single morning dose. <b>Current or recent visual loss, diplopia or other cranial ischaemia</b> (amaurosis, a curtain, new diplopia): start treatment immediately (established visual loss: commonly <b>60 mg daily</b>, to protect the other eye) and arrange same-day ophthalmology/acute GCA assessment. <b>Specialist advice determines whether IV methylprednisolone is indicated</b> — it is given under an acute specialist pathway, not prescribed by the GP.", src:"BSR GCA guideline 2020"},
    {tone:"amber", h:"Seen by a specialist the same working day — and never later than 3 working days", html:"The BSR standard is specialist assessment <b>ideally on the same working day and in all cases within 3 working days</b> of referral. Any visual symptom turns that into a same-day eye assessment. Know your local fast-track route (rheumatology hot clinic, ophthalmology or acute medicine) before you need it.", src:"BSR GCA guideline 2020"},
    {tone:"blue", h:"Rapid specialist confirmation — imaging ideally before or within 72 hours", html:"Diagnosis is confirmed or excluded by <b>dedicated ultrasound of the temporal and axillary arteries by an appropriately trained operator</b> (a general vascular ultrasound is not equivalent), a <b>temporal artery biopsy at least 1 cm long</b>, or both, arranged urgently through the local fast-track pathway. Ultrasound performance falls after glucocorticoid starts, so scan before treatment or as soon as possible afterwards, <b>preferably within 72 hours where feasible</b>; biopsy is arranged promptly per the local pathway and may remain useful after treatment. Imaging must never delay treatment. Interpret results against pre-test probability: a negative or equivocal result does not automatically exclude GCA.", src:"BSR GCA guideline 2020 · EULAR imaging 2023 (international)"},
    {tone:"cream", h:"Assess fracture risk with the first steroid, not after a DXA", html:"GCA usually requires prolonged high-dose glucocorticoids, so <b>assess fracture risk at treatment initiation</b>. In NOGG 2024, 7.5 mg or more of prednisolone a day for 3 months or longer in a postmenopausal woman or a man aged 50 or over is a trigger for assessment and likely bone-protective treatment — not an automatic prescription — and DXA need not precede treatment in a high-risk patient. Add an NHS Steroid Emergency Card and sick-day advice. PPI: only according to GI risk. Aspirin: not routinely.", src:"NOGG 2024 · NatPSA/2020/005 · BSR GCA guideline 2020"},
    {tone:"purple", h:"Sight loss and driving — a statutory duty", html:"Advise the patient not to drive while visual symptoms are present or until visual acuity and fields have been assessed. The patient must notify DVLA if they have a visual field defect or do not meet the required eyesight standard — not every patient with GCA needs to notify. Document the advice.", src:"DVLA Assessing fitness to drive (2025) · GOV.UK"}
  ],
  pathwaySub:"Five moves, in this order. The first two happen in the same consultation.",
  pathway:[
    {title:"Suspect it in anyone aged 50 or over with new cranial or visual symptoms", html:"New headache (often temporal), scalp tenderness, jaw or tongue claudication, visual disturbance, or polymyalgic symptoms with systemic upset. Assess the clinical probability of GCA. Check <b>ESR and CRP, FBC, U&amp;E, LFT and glucose</b> the same day if this does not delay treatment — do not wait for them if suspicion is strong. Examine the temporal arteries and record visual acuity, fields, pupils and fundi where competent.", alert:true},
    {title:"Start prednisolone today", html:"<b>40–60 mg once daily</b> for strongly suspected GCA without visual or ischaemic complications; document the date and time of the first dose. Any visual symptom, diplopia or cranial ischaemia: start treatment immediately (commonly <b>60 mg</b> where sight is already lost) and arrange same-day ophthalmology/acute GCA assessment; the specialist team decides on IV methylprednisolone. Focal neurological deficits: use the acute stroke pathway as well. Do not wait for ESR/CRP, ultrasound or biopsy."},
    {title:"Refer to the GCA fast-track pathway the same day", html:"Specialist review ideally the same working day, and in all cases within 3 working days. Tell the team what you have prescribed and when, because ultrasound yield falls after treatment starts — imaging ideally before or within 72 hours where feasible."},
    {title:"Protect from the first prescription", html:"Fracture-risk assessment and bone-protective treatment where indicated (NOGG 2024), calcium and vitamin D advice or supplementation, a PPI only according to GI risk, Steroid Emergency Card and sick-day rules, and a baseline for blood pressure, glucose or HbA1c and weight. Low-dose aspirin is not given routinely for GCA."},
    {title:"Taper slowly, watch for relapse and harm", html:"Hold the starting dose until symptoms and inflammatory markers settle, then taper gradually according to the specialist/local GCA protocol; the total course commonly lasts 12–24 months and is individualised. Do not change the dose on inflammatory markers alone. Relapsing or steroid-toxic disease goes back to the specialist for consideration of steroid-sparing treatment (methotrexate, or tocilizumab per NICE TA518)."}
  ],
  sections:[
    {id:"recognise", nav:"Suspect", title:"Who to suspect — the over-50 with something new above the neck", sub:"GCA is a large- and medium-vessel vasculitis of people aged 50 and over. The diagnosis is clinical first and confirmed later.",
     blocks:[
       {b:"table", head:["Feature","What to ask or look for","Why it matters"], rows:[
         ["<b>New headache</b>","Recent-onset, often temporal or occipital, different from any headache the patient has had before","The commonest presenting symptom; it is the newness in an older person that counts"],
         ["<b>Scalp tenderness</b>","Pain brushing or combing the hair, or lying on a pillow","A cranial ischaemia clue that other headaches rarely give"],
         ["<b>Jaw or tongue claudication</b>","Ache in the jaw muscles that builds while chewing and eases on stopping","Linked with a higher risk of ischaemic eye complications — lowers your threshold for same-day review"],
         ["<b>Visual disturbance</b>","Transient loss (amaurosis fugax), a curtain, blurring, new double vision, or sudden painless loss","Sight loss may already be permanent; the other eye is the one you are now protecting"],
         ["<b>Temporal artery signs</b>","Tender, thickened, beaded or pulseless artery","Supportive — a normal artery on examination does not exclude GCA"],
         ["<b>Polymyalgic and systemic features</b>","Shoulder and hip girdle stiffness, fatigue, fever, weight loss, night sweats","PMR and GCA overlap; systemic-only presentations may be large-vessel GCA"],
         ["<b>Inflammatory markers</b>","ESR and CRP, FBC (anaemia, thrombocytosis), LFTs (raised ALP)","Usually raised and supportive, but not diagnostic; normal markers make GCA less likely but do not rule it out, particularly with visual symptoms or a compelling clinical picture. An isolated raised ESR/CRP without clinical evidence is not GCA — consider infection, malignancy, other inflammatory disease and drug-related causes"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"ACR/EULAR 2022 criteria — not a diagnostic score", html:"The 2022 ACR/EULAR criteria are classification criteria for research, not a diagnostic rule for primary care. <b>Do not use the score to decide whether to start steroids or refer.</b>", src:"ACR/EULAR 2022 GCA classification criteria (Ponte et al., Ann Rheum Dis 2022) — international"},
         {tone:"amber", h:"Presentations that are easy to miss", html:"Large-vessel GCA may present with fever, weight loss, raised markers and no headache, or with arm claudication, unequal arm blood pressures or a subclavian bruit. Some patients present with stroke (especially vertebrobasilar) or sudden visual loss as the first event. Ask about cranial symptoms in every patient with PMR, and about girdle stiffness in every patient with suspected GCA.", src:"BSR GCA guideline 2020 · EULAR imaging 2023 (international)"}
       ]},
       {b:"why", html:"The pre-test question is simple: is this person aged 50 or over with something new — a headache they have never had, jaw pain on chewing, scalp soreness, a visual event — alongside an inflammatory picture? Primary care cannot confirm GCA, and does not need to. The GP's contribution is recognising the pattern and acting in the same consultation. The ACR/EULAR classification criteria were built for research cohorts; they are not a diagnostic score and should never be used to decide on, or argue a patient out of, treatment or referral."}
     ]},

    {id:"redflags", nav:"Red flags", title:"Red flags — the features that make it an emergency", sub:"Sight and stroke are the stakes. These features change the destination and the dose, not just the urgency.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Acute or intermittent visual loss", html:"Any new visual disturbance — transient monocular visual loss, a curtain/field defect, diplopia or sudden visual reduction — is a <b>same-day emergency</b>. Start oral prednisolone immediately if GCA is strongly suspected and arrange <b>same-day ophthalmological or acute GCA assessment</b>. Diplopia may represent ocular or cranial ischaemia; field loss needs formal ophthalmological assessment — visual acuity alone is insufficient. The specialist team decides whether IV methylprednisolone is indicated.", src:"BSR GCA guideline 2020"},
         {tone:"red", h:"Established visual loss", html:"Sight already lost in one eye → <b>prednisolone 60 mg daily</b> to protect the fellow eye, and same-day eye assessment. Visual loss may be irreversible, but urgent treatment is still required to prevent further ischaemic injury and protect the fellow eye.", src:"BSR GCA guideline 2020"},
         {tone:"red", h:"Stroke or TIA symptoms", html:"Focal neurology in a patient with GCA features → 999 or the acute stroke pathway, with the GCA suspicion stated clearly so steroid is not forgotten.", src:"BSR GCA guideline 2020 · clinical practice"},
         {tone:"amber", h:"Jaw or tongue claudication", html:"A marker of ischaemic risk. It does not change the recommended dose range, but it should push the referral to the same working day.", src:"BSR GCA guideline 2020"},
         {tone:"amber", h:"Limb claudication, bruits or unequal arm pressures", html:"Suggests large-vessel involvement → specialist imaging (ultrasound of axillary arteries, FDG-PET, MRI or CT).", src:"EULAR imaging recommendations 2023 (international)"},
         {tone:"blue", h:"No NG12 criterion maps to GCA", html:"GCA itself is not a suspected-cancer presentation. If the steroid response is poor or atypical, reconsider the diagnosis (infection, malignancy, other vasculitis) rather than simply increasing the dose. The myeloma criterion that applies to polymyalgic presentations is on the <a href='polymyalgia-rheumatica.html#redflags'>PMR page</a>.", src:"NICE NG12 (updated April 2026)"}
       ]},
       {b:"warn", html:"<b>Visual symptoms are never a routine referral.</b> Transient visual loss that has fully recovered is still a warning of imminent permanent loss — treat it as seriously as a current deficit."}
     ]},

    {id:"treat", nav:"Treat now", title:"Start the steroid in this consultation", sub:"Single daily dose, prescribed today, with the referral going out at the same time.",
     blocks:[
       {b:"table", head:["Presentation","Glucocorticoid","Who and where"], rows:[
         ["<b>Strongly suspected GCA, no visual or ischaemic complication</b>","<b>Prednisolone 40–60 mg once daily</b>","GP starts it; urgent referral to the local GCA pathway the same day"],
         ["<b>Acute or intermittent visual loss, diplopia or other cranial ischaemia</b>","<b>Start oral prednisolone immediately</b>; IV methylprednisolone (500 mg–1 g daily for up to 3 days) only if the specialist team decides it is indicated","Same-day ophthalmology or acute GCA pathway; IV treatment is given under an acute specialist pathway, not prescribed by the GP. Focal neurology: acute stroke pathway as well"],
         ["<b>Established visual loss</b>","<b>Prednisolone 60 mg daily</b>","Same-day eye assessment; the aim is to protect the fellow eye"],
         ["<b>Relapse during the taper</b>","Ischaemic symptoms are treated as possible new GCA with same-day specialist assessment; for non-ischaemic symptoms, reassess clinically and return to the last effective dose only within the agreed specialist/local protocol","Discuss with the specialist team the same day if cranial or visual features return"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"cream", h:"How to prescribe it", html:"A <b>single daily dose</b>, rather than divided or alternate-day dosing, as a morning dose. Give enough tablets to reach the specialist review and beyond. Record the date and time of the first dose on the referral — the specialist needs it to schedule imaging or biopsy.", src:"BSR GCA guideline 2020 · BNF"},
         {tone:"green", h:"What response to expect", html:"Most patients improve symptomatically within 1–7 days of starting 40–60 mg. Established visual loss, stroke or tissue necrosis may be irreversible, but treatment still prevents further ischaemic injury. A patient whose symptoms do not respond should prompt the specialist to reconsider the diagnosis.", src:"BSR GCA guideline 2020"}
       ]},
       {b:"say", html:"I think the headache and the ache in your jaw may be caused by inflammation in the arteries of your head, which can affect your eyesight. I want you to start a steroid tablet today, before any tests, because it protects your sight. I'm also arranging for you to be seen by the specialist team today or as soon as they can, and they'll do a scan or a small biopsy to confirm it."}
     ]},

    {id:"protect", nav:"Protect", title:"Protect bone, stomach and adrenals from the first prescription", sub:"This is a high-dose course lasting a year or more. The harms are predictable, so risk assessment and protection start on day one.",
     blocks:[
       {b:"cards", items:[
         {tone:"cream", h:"Bone protection — assess fracture risk now, DXA later", html:"Because GCA usually requires prolonged high-dose glucocorticoids, <b>assess fracture risk at treatment initiation</b> and arrange calcium/vitamin D advice or supplementation and anti-resorptive treatment where indicated. Postmenopausal women and men aged 50 or over starting <b>7.5 mg or more of prednisolone a day for 3 months or more</b> meet the NOGG trigger for assessment and likely treatment — not an automatic prescription. Do not delay steroid treatment waiting for DXA; DXA need not precede treatment in a high-risk patient. Choose a bisphosphonate or alternative according to fracture risk, renal function (check before oral or IV bisphosphonate), dental and oesophageal factors, pregnancy potential, contraindications and local osteoporosis guidance. Continue or review bone protection after steroids stop according to fracture risk. See the <a href='osteoporosis.html'>osteoporosis page</a> for drug choice.", src:"NOGG 2024"},
         {tone:"cream", h:"Gastroprotection — by GI risk", html:"Use gastroprotection according to gastrointestinal risk — for example, previous ulcer or GI bleeding, concurrent NSAID, antiplatelet or anticoagulant treatment, or other significant risk factors. <b>Corticosteroid treatment alone is not an automatic indication for a PPI.</b> Dose per BNF.", src:"BSR GCA guideline 2020 · BNF"},
         {tone:"amber", h:"Aspirin — not routine", html:"Do not start aspirin solely because the patient has GCA. Continue or initiate antiplatelet therapy only where there is a separate cardiovascular/cerebrovascular indication or specialist advice, after assessing bleeding risk.", src:"BSR GCA guideline 2020"},
         {tone:"amber", h:"Steroid Emergency Card and sick-day rules", html:"Patients taking 5 mg or more of prednisolone a day for 4 weeks or longer should generally receive an NHS Steroid Emergency Card, issued according to current local policy. Explain that the steroid must never stop suddenly, and give patient-specific sick-day rules for illness and surgery — patients should not self-increase to very high doses without an agreed plan. Vomiting or inability to absorb oral steroid needs urgent medical advice, and suspected adrenal crisis needs emergency treatment, not simply oral advice — see <a href='https://www.nice.org.uk/guidance/ng243' rel='noopener'>NICE NG243</a> for adrenal crisis and glucocorticoid withdrawal.", src:"NatPSA/2020/005 (2020) · NICE NG243 (2024)"},
         {tone:"blue", h:"Baseline and ongoing checks", html:"Blood pressure, glucose or HbA1c, weight and mood at baseline and at reviews. Tell people with diabetes to expect higher readings and to test more often. Ask about eye symptoms of cataract and glaucoma over the longer course.", src:"BSR GCA guideline 2020 · BSR/BHPR GCA guideline 2010"},
         {tone:"blue", h:"Vaccines", html:"Induction doses of 40–60 mg, and a taper that stays above 20 mg for more than 2 weeks, fall within the Green Book corticosteroid thresholds that contraindicate live vaccines (and for 3 months after) — check chapter 6 before any live vaccine. Inactivated vaccines (influenza, pneumococcal, COVID-19) should be kept up to date.", src:"UKHSA Green Book chapter 6"}
       ]},
       {b:"why", html:"Fracture risk rises within weeks of starting a glucocorticoid and at doses well below those used in GCA, which is why NOGG says not to wait for a scan. The Steroid Emergency Card exists because patients on long courses have died of unrecognised adrenal crisis when their steroid was omitted during an admission or an intercurrent illness."}
     ]},

    {id:"confirm", nav:"Confirm", title:"Confirming the diagnosis — urgent and probability-based", sub:"Specialist-led. The standard is same-day/urgent specialist access and rapid diagnostic confirmation or exclusion; the GP's role is to get the patient into the pathway fast enough for the tests to still work.",
     blocks:[
       {b:"table", head:["Test","What it shows","Timing and caveats"], rows:[
         ["<b>Ultrasound — temporal and axillary arteries</b>","Halo sign (wall swelling) and a non-compressible artery; axillary involvement suggests large-vessel disease","Recommended as the first-line imaging test for suspected GCA; a dedicated GCA scan by an appropriately trained operator (a general vascular ultrasound is not equivalent). Performance falls after steroid starts — ideally before treatment or as soon as possible afterwards, preferably within 72 hours where feasible; never delay treatment for it"],
         ["<b>Temporal artery biopsy</b>","Granulomatous inflammation of the arterial wall","At least 1 cm long; arranged promptly according to the local pathway, and may remain diagnostically useful after treatment has started. Skip lesions mean a negative biopsy does not exclude GCA"],
         ["<b>FDG-PET, MRI or CT</b>","Aortic and large-branch inflammation","Specialist-led for suspected large-vessel GCA or systemic presentations. CTA/MRA may assess structural damage, stenosis, aneurysm or aortic involvement; FDG-PET has limitations after glucocorticoid treatment. Routine repeat imaging is not required in clinical and biochemical remission — repeat imaging is individualised"],
         ["<b>Bloods</b>","ESR, CRP, FBC, LFT, U&amp;E, glucose","Baseline for monitoring; they support but never confirm the diagnosis"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Interpret against pre-test probability", html:"The BSR accepts a biopsy of at least 1 cm, an ultrasound of the temporal and axillary arteries, or both as confirmatory tests. A positive expert ultrasound may be sufficient in a patient with high clinical suspicion. <b>A negative or equivocal result requires specialist review and may require biopsy or alternative imaging; it does not automatically exclude GCA.</b> Many UK fast-track clinics now scan first and biopsy only when the scan is negative or equivocal but suspicion remains.", src:"BSR GCA guideline 2020"},
         {tone:"blue", h:"Why imaging comes first internationally", html:"The 2023 EULAR imaging update recommends ultrasound of the temporal and axillary arteries as the first imaging test in all patients with suspected GCA, with pooled sensitivity 88% and specificity 96% against clinical diagnosis. FDG-PET or MRI are alternatives. Imaging should be early, preferably before or soon after glucocorticoids, must not delay treatment, and needs additional work-up when clinical probability and the imaging result are discordant.", src:"EULAR imaging recommendations 2023 (Dejaco et al.) — international"}
       ]},
       {b:"warn", html:"<b>The sequence is always treat, refer, confirm — with same-day/urgent specialist access and rapid confirmation or exclusion.</b> Never withhold or stop steroid to improve test yield, and never cancel a strongly suspected diagnosis on a single negative test."}
     ]},

    {id:"taper", nav:"Taper", title:"The taper — slow, symptom-led, individualised", sub:"There is no trial-proven regimen. The BSR-style schedule below is a template only: once symptoms have settled and the specialist has confirmed the plan, taper gradually according to the local GCA protocol.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1", when:"until settled — individualised", tone:"red", title:"Hold the starting dose", html:"Continue 40–60 mg until symptoms and laboratory abnormalities have resolved. Some patients may be ready for reduction sooner; others need longer at the initial dose."},
         {step:"2", when:"every 2 weeks", tone:"amber", fromLabel:"symptoms gone, markers settled", title:"Reduce by 10 mg to 20 mg", html:"Each step is reviewed for returning headache, jaw pain, visual symptoms or polymyalgic stiffness."},
         {step:"3", when:"every 2–4 weeks", tone:"amber", fromLabel:"stable on 20 mg", title:"Reduce by 2.5 mg to 10 mg", html:"The pace slows as the dose falls, because relapse is most common in the lower half of the taper."},
         {step:"4", when:"every 1–2 months", tone:"cream", fromLabel:"stable on 10 mg", title:"Reduce by 1 mg towards zero", html:"Provided there is no return of symptoms, signs or inflammatory markers, the total course commonly lasts 12–24 months, individualised according to relapse, disease phenotype, cumulative steroid toxicity and steroid-sparing treatment. Below physiological doses, think about adrenal recovery (NICE NG243)."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"cream", h:"Symptoms lead, markers follow", html:"Reduce on the basis of symptoms and signs together with ESR and CRP. A rising marker alone, with no symptoms, is a reason to review closely and look for another cause (infection, for example): do not increase prednisolone solely because of an isolated ESR or CRP rise without reassessing symptoms, examination, infection, medication adherence and alternative causes.", src:"BSR GCA guideline 2020"},
         {tone:"green", h:"Shared care from about 3 months", html:"Once the patient is stable, follow-up from around month 3 is often shared with primary care. Agree in writing who adjusts the dose, who checks bloods, and how the patient reaches the team quickly if symptoms return.", src:"BSR/BHPR GCA guideline 2010"}
       ]},
       {b:"say", html:"We'll bring the dose down step by step, usually over one to two years. Please don't reduce it yourself or stop it suddenly — your body gets used to it. If the headache, the jaw ache or anything with your eyes comes back as the dose comes down, ring us that day."}
     ]},

    {id:"relapse", nav:"Relapse", title:"Relapse and steroid-sparing treatment", sub:"Relapse is common during tapering. Steroid-sparing drugs are specialist-initiated; the GP needs to know when to ask for them.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Ischaemic relapse — treat as new GCA", html:"New visual symptoms, jaw or tongue claudication or other ischaemic symptoms → same-day specialist or ophthalmology assessment and treatment as possible new GCA (high-dose treatment, 40–60 mg).", src:"BSR GCA guideline 2020"},
         {tone:"amber", h:"Non-ischaemic relapse", html:"Headache alone is nonspecific — consider recurrent GCA, tension headache, migraine, hypertension, infection, steroid withdrawal or another neurological or ophthalmological disorder. Non-ischaemic symptoms (headache, polymyalgic or systemic symptoms) require clinical reassessment; return to the last effective dose only within the agreed specialist/local protocol, and inform the specialist team.", src:"BSR GCA guideline 2020"},
         {tone:"cream", h:"Methotrexate", html:"A specialist-initiated steroid-sparing option for selected patients, particularly where relapse or steroid toxicity is problematic; its efficacy in GCA is modest and inconsistent. Not routinely initiated or dose-adjusted in primary care without a formal shared-care protocol. <b>Once weekly</b> (MHRA: record the day of the week), with folic acid; oral doses prescribed in 2.5 mg tablets with the total dose in milligrams written on the prescription. FBC, LFT and renal monitoring; advise on pulmonary and infection symptoms, pregnancy and contraception, and alcohol and hepatotoxicity. Dose per BNF.", src:"BSR GCA guideline 2020 · MHRA Drug Safety Update (September 2020)"},
         {tone:"cream", h:"Tocilizumab — NICE TA518", html:"Recommended for adults with <b>relapsing or refractory</b> GCA who have not previously received tocilizumab, used with a tapering glucocorticoid course and subsequently alone after glucocorticoid withdrawal where appropriate; generally <b>stopped after 1 year of uninterrupted treatment</b> unless the specialist/local pathway provides a different current arrangement. Initiation is specialist-led and subject to local commissioning — not simply because tapering is inconvenient or after one steroid course. Specialist-prescribed; the GP records it on the repeat list as hospital-supplied so interactions and infection risk are visible.", src:"NICE TA518 (2018)"},
         {tone:"blue", h:"The trial behind tocilizumab", html:"In GiACTA, sustained remission at week 52 was 56% with weekly tocilizumab plus a 26-week prednisone taper, against 14% with a 26-week taper alone and 18% with a 52-week taper alone.", src:"Stone et al., N Engl J Med 2017 (GiACTA)"},
         {tone:"amber", h:"Infection on IL-6 blockade", html:"Infection may be serious despite a normal CRP or absent fever during IL-6 blockade. Assess symptoms, examination, observations, cultures and imaging clinically; do not use CRP alone to exclude infection, and have a low threshold for same-day review. Neutropenia, thrombocytopenia and transaminase abnormalities may occur, and lipid monitoring may be required. Diverticulitis symptoms need urgent review. Vaccines, TB/hepatitis screening and infection precautions are specialist-led; no live vaccines while significantly immunosuppressed.", src:"Tocilizumab SPC · clinical practice"}
       ]}
     ]},

    {id:"monitor", nav:"Follow-up", title:"Follow-up and monitoring in the first year", sub:"Agree a written monitoring schedule with the GCA specialist team. The earlier BSR/BHPR (2010) schedule below is one practical template, not a universal requirement; local shared-care protocols take precedence.",
     blocks:[
       {b:"timeline", items:[
         {n:"0", when:"Day of suspicion", title:"Treat, refer, baseline", html:"Prednisolone started; referral sent; ESR, CRP, FBC, U&amp;E, LFT, glucose; fracture-risk assessment and bone protection where indicated, calcium and vitamin D, Steroid Emergency Card; blood pressure and weight recorded."},
         {n:"1", when:"Weeks 1, 3 and 6", title:"Early reviews", html:"Symptom response, visual symptoms and diplopia, blood pressure, glucose, steroid adverse effects and relapse; blood tests tailored to disease activity, steroid toxicity, comorbidity and steroid-sparing therapy. Confirm the ultrasound or biopsy has been done."},
         {n:"2", when:"Months 3, 6, 9 and 12", title:"Taper reviews", html:"Relapse screen (cranial, visual, polymyalgic, systemic, vascular), bloods where clinically appropriate, blood pressure, glucose or HbA1c, weight, mood and sleep, cataract or glaucoma symptoms, and bone health. Extra visits for any relapse or adverse effect."},
         {n:"3", when:"Year 2 and when stopping", title:"Coming off", html:"Final reductions below physiological doses, with attention to adrenal symptoms; review whether bone-protective treatment should continue once the steroid stops."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"What the bloods are for", html:"FBC, renal function, LFT, ESR or CRP and glucose track disease activity and steroid harm, but are tailored to disease activity, steroid toxicity, comorbidity and steroid-sparing therapy rather than a fixed schedule. <b>On tocilizumab, inflammatory markers are unreliable — clinical review is paramount.</b>", src:"BSR GCA guideline 2020 · BSR/BHPR GCA guideline 2010"},
         {tone:"cream", h:"Relapse checklist for every review", html:"Headache, scalp tenderness, jaw or tongue claudication, any visual event or diplopia, shoulder or hip girdle stiffness, fever, weight loss and systemic symptoms, limb claudication or vascular symptoms. Then steroid harm: blood pressure and weight, glucose or HbA1c, fracture risk and bone protection, mood, sleep and neuropsychiatric effects, cataract or glaucoma symptoms, and infection. Ask them all, every time.", src:"BSR GCA guideline 2020"}
       ]}
     ]},

    {id:"driving", nav:"Driving", title:"Driving after GCA-related sight loss", sub:"A statutory duty sits with the licence holder; the GP's job is to tell them clearly and document it.",
     blocks:[
       {b:"cards", items:[
         {tone:"purple", h:"Visual field defect — must tell DVLA", html:"Drivers must tell DVLA if they have a visual field defect. The field standards are set out in the current DVLA guidance — refer to it rather than relying on remembered figures; formal field assessment is done by the eye team.", src:"DVLA Assessing fitness to drive (November 2025) · GOV.UK visual field defects and driving"},
         {tone:"purple", h:"Eyesight standard", html:"Anyone who cannot read a number plate at 20 metres, or whose acuity is below 6/12 with both eyes open (or in the only eye), must not drive and must notify DVLA. Sight in only one eye has its own GOV.UK guidance, and bus and lorry (Group 2) standards are stricter.", src:"DVLA Assessing fitness to drive (November 2025) · GOV.UK"},
         {tone:"cream", h:"What to say and record", html:"Advise the patient not to drive while visual symptoms are present or until visual acuity and fields have been assessed by the eye team. The patient must notify DVLA if they have a visual field defect or do not meet the required eyesight standard — not every patient with GCA needs to notify. Do not tell the patient they are cleared to drive; the patient and the DVLA process determine fitness to drive. If the patient is the sole driver for a dependent person, discuss alternative transport and support. Document the advice.", src:"DVLA Assessing fitness to drive (November 2025)"}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — who, where, how fast", sub:"Every strongly suspected GCA is referred on the day of suspicion. The only question is which door.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999 or emergency department", html:"Stroke or TIA symptoms, or a patient too unwell to travel to a clinic. State the GCA suspicion and the steroid given.", src:"BSR GCA guideline 2020 · clinical practice"},
         {tone:"red", h:"Same-day ophthalmology or acute GCA pathway", html:"Any visual symptom — transient or current, including new diplopia. Start oral prednisolone immediately if GCA is strongly suspected; the specialist team decides whether IV methylprednisolone is indicated. Established visual loss → commonly prednisolone 60 mg daily.", src:"BSR GCA guideline 2020"},
         {tone:"amber", h:"GCA fast-track pathway — same working day, within 3 working days at the latest", html:"All other suspected GCA, with prednisolone 40–60 mg already started. Ultrasound or biopsy arranged urgently through the local fast-track pathway — ultrasound ideally before or within 72 hours of the first dose where feasible.", src:"BSR GCA guideline 2020"},
         {tone:"amber", h:"Back to the specialist — relapse or toxicity", html:"Repeated relapses, inability to taper, or significant steroid harm → specialist consideration of steroid-sparing treatment: methotrexate for selected patients, or tocilizumab (TA518: relapsing or refractory disease, not previously treated, generally stopped after 1 year; subject to local commissioning).", src:"NICE TA518 (2018) · BSR GCA guideline 2020"},
         {tone:"blue", h:"Large-vessel imaging", html:"Arm claudication, unequal arm pressures, bruits, or persistent systemic inflammation despite treatment → specialist for FDG-PET, MRI, CT or axillary ultrasound. Persistent systemic inflammation does not automatically prove active large-vessel GCA — reconsider infection and malignancy.", src:"EULAR imaging recommendations 2023 (international)"},
         {tone:"purple", h:"Statutory — DVLA", html:"Visual field defect, or unable to meet the eyesight standard after GCA-related sight loss → the patient must tell DVLA. Advise no driving while visual symptoms are present or until acuity and fields have been assessed; fitness to drive is determined through the DVLA process, not by the clinician.", src:"DVLA Assessing fitness to drive (November 2025)"}
       ]},
       {b:"say", html:"This is one of the few times I start treatment before the diagnosis is proven, because waiting could cost you your sight. You'll start the steroid now, the specialist team will see you today or very soon, and they'll arrange the scan or biopsy. If anything changes with your vision before then, go straight to the eye emergency service or A and E."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card for the exam and for real consultations.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 74-year-old woman phones about a headache for 10 days, worse over the right temple, and says her jaw aches when she eats toast. Yesterday the vision in her right eye went grey for about a minute and came back. She drives her husband to his dialysis appointments three times a week.", src:"Scenario built on BSR GCA guideline 2020 features"},
       {tone:"cream", h:"What a strong consultation does", html:"Recognises GCA from the new headache, jaw claudication and transient visual loss; treats the visual event as an emergency despite recovery; arranges <b>same-day</b> ophthalmology or the acute GCA pathway and gives <b>prednisolone</b> now rather than waiting for the transfer; explains why steroid comes before tests; assesses fracture risk and starts <b>bone protection</b> where indicated, issues a <b>Steroid Emergency Card</b>; and handles the <b>driving</b> question honestly — advising no driving until acuity and fields are assessed, discussing alternative transport for her husband's dialysis — while explaining that any field defect must be reported to DVLA.", src:"BSR GCA guideline 2020 · NOGG 2024 · DVLA (2025)"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Every recommendation on this page is traceable to a named primary source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>British Society for Rheumatology guideline on diagnosis and treatment of giant cell arteritis</b> (Mackie et al., Rheumatology 2020;59:e1–e23; executive summary 2020;59:487–494)<br><a href="https://academic.oup.com/rheumatology/article/59/3/e1/5714024" rel="noopener">academic.oup.com/rheumatology/article/59/3/e1/5714024</a><span class="rd"> — primary UK source: treat on strong clinical suspicion; prednisolone 40–60 mg; specialist-led IV methylprednisolone in acute visual loss; 60 mg in established visual loss; specialist within 3 working days, ideally same day; urgent ultrasound or biopsy (at least 1 cm) via the fast-track pathway; single daily dose; individualised taper template; aspirin not routine; gastroprotection by GI risk; methotrexate and tocilizumab</span></li>'+
         '<li><b>BSR and BHPR guidelines for the management of giant cell arteritis</b> (Dasgupta et al., Rheumatology 2010;49:1594–1597)<br><a href="https://academic.oup.com/rheumatology/article/49/8/1594/1789465" rel="noopener">academic.oup.com/rheumatology/article/49/8/1594/1789465</a><span class="rd"> — older first-year follow-up template (weeks 0, 1, 3, 6; months 3, 6, 9, 12), now tailored locally; shared care from month 3</span></li>'+
         '<li><b>NICE TA518 — Tocilizumab for treating giant cell arteritis</b> (2018)<br><a href="https://www.nice.org.uk/guidance/ta518" rel="noopener">nice.org.uk/guidance/ta518</a><span class="rd"> — relapsing or refractory disease, not previously treated with tocilizumab, with a tapering glucocorticoid course then alone, generally stopped after 1 year of uninterrupted treatment; specialist-led and subject to local commissioning</span></li>'+
         '<li><b>NOGG 2024 — UK clinical guideline for the prevention and treatment of osteoporosis</b> (National Osteoporosis Guideline Group)<br><a href="https://www.nogg.org.uk/sites/nogg/download/NOGG-Guideline-2024.pdf" rel="noopener">nogg.org.uk</a><span class="rd"> — prompt fracture-risk assessment and treatment where indicated in postmenopausal women and men aged 50 or over taking 7.5 mg/day or more of prednisolone for 3 months or longer; DXA need not precede treatment in high-risk patients</span></li>'+
         '<li><b>NICE NG243 — Adrenal insufficiency: identification and management</b> (2024)<br><a href="https://www.nice.org.uk/guidance/ng243" rel="noopener">nice.org.uk/guidance/ng243</a><span class="rd"> — sick-day dosing, adrenal crisis and glucocorticoid withdrawal</span></li>'+
         '<li><b>National Patient Safety Alert NatPSA/2020/005/NHSPS — Steroid Emergency Card</b> (NHS England, August 2020)<br><a href="https://www.england.nhs.uk/publication/national-patient-safety-alert-steroid-emergency-card-to-support-early-recognition-and-treatment-of-adrenal-crisis-in-adults/" rel="noopener">england.nhs.uk</a><span class="rd"> — card for adults on 5 mg or more of prednisolone a day for 4 weeks or longer</span></li>'+
         '<li><b>MHRA Drug Safety Update — Methotrexate once-weekly for autoimmune diseases</b> (September 2020)<br><a href="https://www.gov.uk/drug-safety-update" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> — once-weekly dosing, recording the day of the week, 2.5 mg tablets, total dose in milligrams</span></li>'+
         '<li><b>UKHSA Green Book, chapter 6 — Contraindications and special considerations</b><br><a href="https://www.gov.uk/government/publications/contraindications-and-special-considerations-the-green-book-chapter-6" rel="noopener">gov.uk</a><span class="rd"> — high-dose corticosteroids and live vaccines</span></li>'+
         '<li><b>DVLA — Assessing fitness to drive: a guide for medical professionals</b> (November 2025) and GOV.UK visual disorders guidance<br><a href="https://www.gov.uk/guidance/visual-disorders-assessing-fitness-to-drive" rel="noopener">gov.uk/guidance/visual-disorders-assessing-fitness-to-drive</a><span class="rd"> — visual field defect notification and the eyesight standard; use the current guidance for field requirements</span></li>'+
         '<li><b>2022 ACR/EULAR classification criteria for giant cell arteritis</b> (Ponte et al., Ann Rheum Dis 2022;81:1647–1653) — international<span class="rd"> — research classification criteria only; not a diagnostic rule for primary care</span></li>'+
         '<li><b>EULAR recommendations for the use of imaging in large vessel vasculitis in clinical practice: 2023 update</b> (Dejaco et al., Ann Rheum Dis 2024) — international<span class="rd"> — temporal and axillary ultrasound first line by a trained operator; pooled sensitivity 88%, specificity 96%; FDG-PET or MRI as alternatives; imaging early, preferably before or soon after glucocorticoids, never delaying treatment; further work-up when probability and imaging are discordant; repeat imaging individualised</span></li>'+
         '<li><b>2018 update of the EULAR recommendations for the management of large vessel vasculitis</b> (Hellmich et al., Ann Rheum Dis 2020;79:19–30) — international<span class="rd"> — immediate high-dose glucocorticoid 40–60 mg; methotrexate or tocilizumab reduce relapse and glucocorticoid exposure</span></li>'+
         '<li><b>Trial of tocilizumab in giant-cell arteritis (GiACTA)</b> (Stone et al., N Engl J Med 2017;377:317–328)<span class="rd"> — sustained remission at week 52: 56% weekly tocilizumab vs 14% and 18% on taper alone</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral</b> (updated April 2026)<br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — checked: no criterion maps to GCA itself; the myeloma criterion for polymyalgic presentations is on the PMR page</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — prednisolone, methylprednisolone, PPIs, bisphosphonates, calcium and vitamin D, methotrexate</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Giant cell arteritis in adults — BSR GCA guideline 2020 (Mackie et al.), BSR/BHPR 2010, NICE TA518 (2018), NICE NG243 (2024), NOGG 2024, NatPSA/2020/005, MHRA Drug Safety Update (September 2020), UKHSA Green Book chapter 6 and DVLA (2025); EULAR 2018 and 2023 and ACR/EULAR 2022 as international sources. Treat on clinical suspicion. Check every dose against the current BNF before prescribing; this page does not replace clinical judgement or your local GCA pathway."
});
