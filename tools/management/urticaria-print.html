  stemTitle:"Most urticaria is benign, but three patterns change management: suspected anaphylaxis, angioedema without wheals, and wheals lasting over 24 hours",
  stemSub:"<b>Airway, breathing or circulation compromise:</b> treat suspected anaphylaxis immediately with IM adrenaline and call 999. <b>Angioedema without wheals</b>, especially on an ACE inhibitor or with a family history: consider bradykinin-mediated disease; stop the ACE inhibitor permanently and assess the airway urgently. <b>Individual wheals lasting longer than 24 hours</b>, particularly if painful or bruising: reconsider simple urticaria and assess for urticarial vasculitis. For chronic spontaneous urticaria, use one non-sedating H1 antihistamine regularly, increase up to four times the licensed dose off-label if needed, and refer for specialist treatment when control remains inadequate. Omalizumab is specialist-led and should follow NICE TA339 criteria. BAD/EAACI · NICE TA339 · NICE NG258.",
  guideline:"BAD chronic urticaria guideline (2021) · EAACI/GA²LEN/EuroGuiDerm/APAAACI urticaria guideline (2022, international) · BSACI (2015) · NICE TA339 (2015) · Resuscitation Council UK (2021) · NICE NG258 (anaphylaxis follow-up) · NICE NG12 (updated April 2026)",

  lead:"<div class='mg-layers'><a href='#severe'><b>Red flags</b><small>Anaphylaxis · ACEi · vasculitis</small></a><a href='#classify'><b>Classify</b><small>Acute · CSU · inducible</small></a><a href='#ladder'><b>Treat</b><small>Up to 4× licensed dose</small></a><a href='#special'><b>Special</b><small>Physical · HAE · auto-injectors</small></a></div>",
  quickSub:"If you read nothing else on this page, read these six cards. Every figure traces to the source cited under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Suspect anaphylaxis — give IM adrenaline immediately", html:"Suspect anaphylaxis when there is acute airway, breathing or circulation compromise, usually with skin or mucosal features (skin features may be absent; urticaria alone is not anaphylaxis). Give IM adrenaline 500 micrograms (0.5 mg) into the anterolateral thigh for adults and children over 12, then 999 immediately; repeat after 5 minutes if airway, breathing or circulation problems persist. Lie flat with legs raised and do not allow the patient to stand or walk. High-flow oxygen, monitoring, IV access and a crystalloid bolus if hypotension or shock; escalate to refractory-anaphylaxis management after two appropriate IM doses. Do not delay treatment for antihistamines — never use an antihistamine as the first treatment for anaphylaxis. IV antihistamine and hydrocortisone are hospital additions, not substitutes."},
    {tone:"amber", h:"ACE-inhibitor and hereditary angioedema are bradykinin-mediated — antihistamines are generally ineffective", html:"Angioedema of the tongue, lip or larynx WITHOUT urticarial wheals suggests bradykinin-mediated disease: ACE-inhibitor-induced or hereditary angioedema. Antihistamines and corticosteroids are generally ineffective; if the diagnosis is uncertain or anaphylaxis cannot be excluded, treat immediately according to the anaphylaxis pathway. Airway assessment and early senior or anaesthetic involvement take priority. ACE-inhibitor angioedema is not an allergy, and it can occur months to years after starting the ACE inhibitor — it is not a type I hypersensitivity reaction. Stop the ACE inhibitor permanently (a class effect — do not substitute another ACE inhibitor or rechallenge) and document it as “ACE-inhibitor-associated angioedema — avoid all ACE inhibitors permanently”. An ARB may be considered later, after the acute episode and a risk–benefit assessment (lower risk, not absent). Icatibant or C1-inhibitor concentrate is specialist or hospital-led and is not routinely effective in every ACE-inhibitor case."},
    {tone:"blue", h:"A wheal lasting more than 24 hours in one place is a red flag", html:"Ordinary wheals form and resolve within 24 hours (&lt;24 h), moving location as new ones appear. A lesion persisting beyond 24 hours in the same location, especially if painful, burning, purpuric or bruising, should prompt assessment for urticarial vasculitis or another inflammatory dermatosis — a red flag, not a diagnosis (pressure and other inducible urticarias can occasionally last longer). In primary care: urinalysis for blood and protein, FBC, renal function, LFTs, ESR/CRP and blood pressure. Arrange dermatology assessment and biopsy if clinically indicated; ANA, complement, hepatitis serology and other tests if there are systemic features or after specialist advice."},
    {tone:"green", h:"Up-dose to 4× licensed before you refer — and say why", html:"Non-sedating antihistamine at licensed dose first (cetirizine 10 mg, loratadine 10 mg, fexofenadine 120–180 mg OD); if chronic disease is uncontrolled after an appropriate trial, increase that same agent up to 4× the licensed dose. Do not routinely combine multiple second-generation H1 antihistamines. BAD and EAACI both recommend this before omalizumab; it is off-label, so document the indication and evidence, and tell the patient it is deliberately above the packet dose and why. Avoid regular sedating antihistamines (chlorphenamine) — sedation, cognitive impairment and tolerance."},
    {tone:"blue", h:"Omalizumab for refractory chronic spontaneous urticaria — specialist-led", html:"Omalizumab (Xolair) 300 mg SC every 4 weeks — NICE TA339 for severe chronic spontaneous urticaria (UAS7 of 28 or more) that has not responded to H1-antihistamines and leukotriene receptor antagonists, in patients aged 12 and over, with severity objectively assessed. Prescribed and administered under secondary-care specialist management (NICE TA339). Stop at or before the fourth dose if there is no response; if responsive, stop at the end of six doses (the NICE commissioning course, not a universal duration) to assess spontaneous remission, and restart only on relapse. Long-term continuation or off-label dose escalation is specialist-led."},
    {tone:"amber", h:"Two adrenaline auto-injectors after anaphylaxis", html:"After emergency treatment for anaphylaxis, NICE generally recommends two adrenaline auto-injectors with brand-specific training and a written action plan, unless the trigger is an easily avoidable drug and specialist advice indicates they are not needed. Match the device dose to age, weight and product licence (150 micrograms for smaller children, 300 micrograms for many older children and adults, 500 micrograms for some larger adults depending on device and local policy). The two devices need not be the same brand, but if different devices are supplied the patient must be trained in both. Carry both together; use the second after 5 minutes if symptoms have not improved or recur, while awaiting emergency help. Any use of an auto-injector requires emergency assessment, with observation set by risk."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step contains a drug that must be given in seconds, and a drug that must be stopped forever.",
  pathway:[
    {title:"Screen for anaphylaxis, bradykinin angioedema and vasculitis", html:"Acute airway, breathing or circulation compromise, usually with skin or mucosal features → suspect anaphylaxis: IM adrenaline 0.5 mg then 999. Angioedema of tongue, lip or larynx without wheals → consider bradykinin-mediated disease (HAE or ACE inhibitor): 999 if the airway is involved; antihistamines are generally ineffective, but treat as anaphylaxis if it cannot be excluded. Recent or long-standing ACE inhibitor with angioedema → stop it permanently. Wheals lasting over 24 hours, especially painful, burning, purpuric or bruising, or with joint pain, fever or abdominal pain → assess for urticarial vasculitis. Urticaria with fever, lymphadenopathy, weight loss and night sweats → consider a haematology suspected cancer pathway referral for lymphoma if lymphadenopathy or splenomegaly is unexplained. A child with urticaria after infection plus joint swelling, haematuria and abdominal pain → Henoch-Schönlein purpura, paediatric referral.", alert:true},
    {title:"Classify the type", html:"Acute (&lt;6 weeks) — commonly follows viral infection (especially in children); also drugs, foods, contact and physical triggers; often no identifiable cause. Chronic spontaneous (&gt;6 weeks) — about 50% autoimmune, with anti-TPO in around 25%. Inducible or physical — dermographism, cold, cholinergic, solar, pressure, aquagenic. Drug-induced — NSAID (non-allergic COX-1 mechanism; cross-reactivity common but not universal), penicillin (IgE), opioid and contrast (direct degranulation), ACE inhibitor (bradykinin). Lesions lasting over 24 hours — a red flag for urticarial vasculitis."},
    {title:"Assess and investigate minimally", html:"History: duration per wheal (the key discriminator), triggers, full drug history including OTC ibuprofen, timing, angioedema and airway involvement, family history of HAE, atopy, systemic symptoms. Examination: wheal character, distribution, dermographism (stroke firmly — a wheal within 3 minutes), non-pitting angioedema, lymphadenopathy, joints; stridor is an emergency. Investigations for chronic disease: FBC, ESR/CRP, TFT plus anti-TPO — and nothing else unless there are clinical pointers. Specific IgE or skin-prick testing only where a convincing, reproducible history suggests an IgE-mediated trigger — not a broad food panel."},
    {title:"Score, then step the antihistamine up", html:"Score UAS7 (wheals plus itch daily for 7 days, maximum 42): 0–6 well controlled, 7–15 mild, 16–27 moderate, 28–42 severe. Step 1 licensed-dose non-sedating antihistamine. Step 2 the same agent up to 4× licensed dose, reviewed after 2–4 weeks during escalation (sooner if severe, frequent angioedema or major quality-of-life impact). If still uncontrolled, consider adding montelukast (BAD 2021; off-label; MHRA neuropsychiatric warning) and refer — NICE TA339 requires an inadequate response to a leukotriene receptor antagonist as well as H1 antihistamines. Step 3 omalizumab via specialist (NICE TA339). Step 4 ciclosporin, methotrexate or dapsone (specialist). A short clinician-directed oral corticosteroid course may be considered for a severe flare only — repeated or maintenance oral corticosteroids are inappropriate."},
    {title:"Follow up, and safety-net the airway", html:"Acute: review at 6 weeks if unresolved (that redefines it as chronic). Chronic: monthly during titration, then 3-monthly; attempt step-down after 6 months of good control. Post-anaphylaxis: refer to an allergy service with urgency set by severity, trigger, recurrence risk and local pathway; two suitable auto-injectors, training and a written action plan. Urticarial vasculitis: urinalysis, blood pressure and CRP/ESR at each review; further tests specialist-guided."}
  ],
  sections:[
    {id:"severe", nav:"Red flags", title:"Red flags — anaphylaxis, bradykinin angioedema and urticarial vasculitis", sub:"Most urticaria is benign and self-limiting. Anaphylaxis is the life-threatening exception — identify and act within seconds. Urticarial vasculitis is the chronic systemic exception requiring investigation.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Suspected anaphylaxis", html:"Acute airway, breathing or circulation compromise, usually with skin or mucosal features (skin may be absent) → IM adrenaline 500 micrograms (adults and children over 12) into the anterolateral thigh → 999 immediately. Lie flat with legs raised; do not allow the patient to stand or walk. Repeat adrenaline after 5 minutes if airway, breathing or circulation problems persist. High-flow oxygen, monitoring, IV access and crystalloid bolus if hypotension or shock; refractory-anaphylaxis management after two appropriate IM doses. Adrenaline is treatment, not a diagnostic test — give it immediately when anaphylaxis is suspected and do not delay for antihistamines."},
         {tone:"red", h:"🔴 Angioedema of tongue, lip or larynx WITHOUT wheals", html:"Hereditary angioedema (HAE) or ACE-inhibitor-induced angioedema — bradykinin-mediated, so antihistamines and corticosteroids are generally ineffective. If the diagnosis is uncertain or anaphylaxis cannot be excluded, treat according to the anaphylaxis pathway. 999 if the airway is involved; airway assessment and early senior or anaesthetic involvement take priority. C1-inhibitor concentrate (HAE) or icatibant (a bradykinin B2 receptor antagonist) — specialist or hospital-led. An ACE inhibitor must be stopped permanently."},
         {tone:"amber", h:"🟠 Wheals lasting over 24 hours in the same location", html:"A lesion persisting beyond 24 hours in the same location, especially if painful, burning, purpuric or bruising, or with systemic features (joint pain, fever, abdominal pain), should prompt assessment for urticarial vasculitis or another inflammatory dermatosis. In primary care: urinalysis, FBC, renal function, LFTs, ESR/CRP and blood pressure. Arrange dermatology assessment and biopsy if clinically indicated (often the key investigation); ANA, complement, hepatitis serology and other tests if there are systemic features or after specialist advice. Rheumatology if systemic disease."},
         {tone:"amber", h:"🟠 Recent introduction of an ACE inhibitor", html:"ACEi-induced angioedema — bradykinin-mediated (ACE inhibitors block bradykinin breakdown) and can occur months to years after starting. Stop the ACE inhibitor permanently, do not rechallenge or substitute another ACE inhibitor, and document the adverse drug reaction. An ARB may be considered later, after the acute episode and a risk–benefit assessment (lower risk, not absent). Antihistamines and steroids are generally ineffective. Airway symptoms → emergency assessment."},
         {tone:"purple", h:"🟣 Urticaria + fever, lymphadenopathy, weight loss, night sweats <span class='tw'>Suspected cancer</span>", html:"Urticaria as a paraneoplastic feature of lymphoma (especially Hodgkin's), or as a feature of serum sickness or drug reaction → consider a haematology suspected cancer pathway referral for lymphoma (NG12 trigger: unexplained lymphadenopathy or splenomegaly), with FBC and LDH from primary care; CT staging is a specialist test arranged by haematology after referral.", src:"NICE NG12 (updated April 2026)"},
         {tone:"blue", h:"🔵 Child with urticaria + joint swelling, haematuria, abdominal pain", html:"Henoch-Schönlein purpura (IgA vasculitis) — palpable purpura on buttocks and legs, arthritis, abdominal pain, renal involvement (IgA nephropathy). Urinalysis for haematuria and proteinuria. Paediatric referral."}
       ]},
       {b:"why", html:"The ACE-inhibitor angioedema mechanism is fundamentally different from allergic urticaria and angioedema — it is bradykinin-mediated, not histamine-mediated. ACE inhibitors block angiotensin-converting enzyme, which also breaks down bradykinin; accumulated bradykinin causes vasodilation and increased vascular permeability in the face, lips, tongue and upper airway. This matters because it generally does not respond to antihistamines or corticosteroids, it can occur months to years after starting the drug (it is not a type I hypersensitivity reaction), and it can be fatal with upper-airway involvement. Management is to stop the ACE inhibitor permanently — switching to another ACE inhibitor does not eliminate the risk, as it is a class effect. ARBs carry a lower bradykinin risk but not zero, so consider one only after the acute episode and a risk–benefit assessment. Icatibant or C1-inhibitor concentrate is specialist or hospital-led and is not routinely effective in every case. GPs identifying ACEi angioedema should record it as an adverse drug reaction — “ACE-inhibitor-associated angioedema — avoid all ACE inhibitors permanently” — with the mechanism and clinical features, rather than simply as an IgE allergy, so no future prescriber restarts it."}
     ]},

    {id:"classify", nav:"Classify", title:"Classification — the types of urticaria", sub:"Type determines whether you investigate, what you avoid, and which drug will work.",
     blocks:[
       {b:"table", head:["Type","Features","Management implication"], rows:[
         ["<b>Acute urticaria (&lt;6 weeks)</b>","The most common. Commonly follows viral infection (particularly in children). Other triggers: drugs (NSAIDs, penicillin, aspirin), foods (nuts, shellfish, eggs, dairy, additives — IgE-mediated in true allergy, guided by a convincing reproducible history), contact (latex, nickel, cosmetics), physical (exercise, cold, heat, pressure, dermographism). Often no identifiable cause","Usually self-limiting; most resolve within 6 weeks on a regular non-sedating antihistamine"],
         ["<b>Chronic spontaneous urticaria (CSU, &gt;6 weeks)</b>","Spontaneous wheals ± angioedema daily or near-daily for &gt;6 weeks with no external trigger. The commonest chronic type. About 50% autoimmune: IgG autoantibodies to the IgE receptor (FcεRI) or to IgE itself — analogous to Graves' disease of the mast cell. Associated with thyroid autoimmunity","Check TFT and anti-TPO; investigate further only if features suggest underlying disease. Non-sedating antihistamine, up-dosed"],
         ["<b>Inducible / physical urticaria</b>","Reproducibly triggered by a specific physical stimulus: dermographism (stroking the skin — the commonest physical urticaria), cold urticaria, cholinergic urticaria (exercise, heat, sweating — small wheals), solar urticaria, delayed pressure urticaria (hours after sustained pressure, not immediate), aquagenic","<b>Avoidance plus antihistamine — see <a href='#special'>Special situations</a></b>"],
         ["<b>Drug-induced urticaria</b>","NSAIDs and aspirin: pharmacological (cyclo-oxygenase inhibition alters arachidonic acid metabolism causing mast-cell degranulation) — NOT IgE-mediated. Cross-reactivity between non-selective COX-1 inhibitors is common in NSAID-exacerbated urticaria, but not every NSAID reaction represents universal cross-reactivity; specialist challenge may be needed. Penicillins and cephalosporins: IgE-mediated true allergy, may cross-react. Opioids and radiographic contrast: direct mast-cell degranulation. ACE inhibitors: bradykinin, so no response to antihistamines","<b>Mechanism dictates whether switching within the class is possible</b>"],
         ["<b>Urticarial vasculitis</b>","Wheals persist &gt;24 h in the same location (ordinary urticaria moves within &lt;24 h), may leave bruising, with systemic features. Biopsy shows a neutrophilic infiltrate around vessels with fibrinoid necrosis. Associated with SLE (anti-dsDNA), hepatitis B and C, and cryoglobulinaemia","<b>Dermatology assessment and biopsy if clinically indicated; targeted work-up guided by clinical features and specialist advice</b>"]
       ]},
       {b:"why", html:"The “ordinary urticaria moves within 24 hours” rule is the single most important clinical distinction between simple urticaria and urticarial vasculitis. Normal wheals form and resolve within 24 hours, with individual wheals changing location as new ones appear elsewhere. If a patient shows you a wheal that has been in the same place for three days, or is painful rather than itchy, or leaves a bruise as it fades — it should prompt assessment for urticarial vasculitis or another inflammatory dermatosis (although lesions can occasionally persist longer in pressure or other inducible urticarias, so the full history and examination remain important). The significance is that urticarial vasculitis can be associated with serious systemic disease (SLE, hepatitis B and C, Sjögren's syndrome, and hypocomplementaemic urticarial vasculitis syndrome — HUVS) and needs a different pathway: dermatology assessment and skin biopsy (often the key investigation); in primary care urinalysis for blood and protein, FBC, renal function, LFTs, ESR/CRP and blood pressure; and ANA, complement, hepatitis serology and other tests if there are systemic features or after specialist advice — not as a routine GP panel."}
     ]},

    {id:"assess", nav:"Assess", title:"Assessment — history, examination and investigations", sub:"The duration of each individual wheal is the highest-yield question in the whole consultation.",
     blocks:[
       {b:"table", head:["Domain","Detail","Why"], rows:[
         ["<b>History</b>","Wheal morphology — size, shape, distribution, and duration PER WHEAL (the key: &lt;24 h = ordinary, &gt;24 h = red flag for vasculitis). Triggers: specific foods, drugs, exercise, cold, heat, stress, infection. Drug history: NSAIDs including OTC ibuprofen, aspirin, ACE inhibitors, antibiotics. Food diary if a food trigger is suspected. Timing: acute versus chronic (&gt;6 weeks). Angioedema — face, lip, tongue, throat: is the upper airway involved? Family history (HAE). Atopy. Systemic symptoms (fever, joint pain, fatigue, weight loss — vasculitis or malignancy)","The diagnosis is made here, not in the laboratory"],
         ["<b>Examination</b>","Wheal characteristics: erythematous, raised, evanescent and itchy (ordinary) versus persistent and bruising (vasculitis). Distribution: localised or generalised. Dermographism — stroke the skin firmly; a wheal within 3 minutes is positive (present in about 5% of the population). Angioedema: non-pitting swelling of face, lips, tongue, hands. Systemic: lymphadenopathy, hepatosplenomegaly, joint swelling","<b>Urgent: throat or laryngeal involvement with stridor is an emergency</b>"],
         ["<b>Investigations — chronic urticaria</b>","BAD and BSACI: minimal investigation is needed for CSU in the absence of specific clinical pointers. First-line: FBC with differential (eosinophilia — atopy, parasites), ESR/CRP (elevated suggests vasculitis or systemic disease), TFT plus anti-TPO antibodies (thyroid autoimmunity in about 25% of CSU). Only if there are clinical pointers: ANA/dsDNA, complement, ANCA, hepatitis serology, immunoglobulins, skin biopsy","Over-investigation adds anxiety, not answers"],
         ["<b>Allergy testing</b>","Where a specific IgE-mediated trigger is suspected: specific IgE (RAST) or skin-prick testing via an allergy clinic. Food allergy testing should be guided by a convincing, reproducible history, not by a broad food panel. Total IgE is non-discriminatory. NSAID urticaria is NOT IgE-mediated — skin-prick testing is negative, so confirm by history and NSAID avoidance; oral challenge at an allergy clinic if uncertain","Prevents both false reassurance and false labelling"]
       ]},
       {b:"cards", items:[
         {tone:"purple", h:"NG12 criteria that surface here <span class='tw'>Suspected cancer</span>", html:"Urticaria has no NICE NG12 criterion of its own, and this page does not invent one — but urticaria can be paraneoplastic, and the systemic screen puts two NG12 routes directly in front of you:<br>• Urticaria with unexplained fever, lymphadenopathy, weight loss or night sweats → consider a haematology suspected cancer pathway referral for suspected lymphoma, with FBC and LDH; unexplained persistent lymphadenopathy or splenomegaly is the NG12 trigger, and a very urgent FBC where features suggest leukaemia.<br>• Unexplained weight loss with other trigger symptoms → the relevant urgent suspected-cancer pathway for the site indicated rather than attributing constitutional symptoms to chronic urticaria.<br>Chronic urticaria that is systemically unwell is not simply chronic urticaria.", src:"NICE NG12 (updated April 2026)"}
       ]},
       {b:"why", html:"The anti-TPO antibody association with chronic spontaneous urticaria is an important clinical connection — approximately 25% of patients with CSU have elevated anti-thyroid peroxidase antibodies, suggesting an autoimmune basis. Practically: CSU patients should have TFTs checked (hypothyroidism may coexist), and the presence of anti-TPO antibodies does not cause urticaria through thyroid dysfunction — the autoimmunity reflects a general propensity to produce autoantibodies, including IgG antibodies to the high-affinity IgE receptor (FcεRI) on mast cells, which trigger degranulation without IgE involvement. This explains why antihistamines often give only partial relief in autoimmune CSU, why omalizumab works so well (reducing free IgE available to bind mast-cell receptors, and possibly reducing receptor density), and why thyroid hormone replacement in hypothyroid CSU patients can improve urticaria independent of correcting thyroid status."}
     ]},

    {id:"severity", nav:"Severity", title:"Severity assessment", sub:"UAS7 turns “a bit better” into a number, and the number drives the step-up decision.",
     blocks:[
       {b:"table", head:["Tool","How","Interpretation"], rows:[
         ["<b>Urticaria Activity Score 7 (UAS7)</b>","Score daily for 7 days: wheals (0 = none, 1 = &lt;20 wheals, 2 = 20–50, 3 = &gt;50) plus itch (0 = none, 1 = mild, 2 = moderate, 3 = severe). Maximum 42","0–6 well controlled · 7–15 mild · 16–27 moderate · 28–42 severe. Use at each consultation to track response and benchmark step-up decisions"],
         ["<b>Angioedema risk assessment</b>","Angioedema of the lips or face (not the upper airway) is uncomfortable but not immediately life-threatening. Angioedema of the tongue, uvula or throat is an airway emergency","Suspected anaphylaxis or throat swelling with urticaria → two suitable adrenaline auto-injectors with training and an action plan, and refer to an allergy service. HAE → on-demand treatment planned by the allergy or immunology service"],
         ["<b>Dermographism test</b>","Stroke a blunt instrument (tongue depressor) firmly along the forearm — a raised erythematous wheal along the stroke line within 3 minutes is positive","Indicates symptomatic dermographism, the commonest physical urticaria; treatable with an antihistamine"],
         ["<b>Differentiate from a maculopapular rash</b>","Urticaria: raised, erythematous, evanescent (moves and changes), extremely pruritic. Fixed drug eruption: persistent, same location each time the drug is taken. Erythema multiforme: target lesions. Drug-induced maculopapular rash: flat red spots, symmetrical. Viral exanthem: fever prodrome, typically fine and widespread","Prevents mislabelling a drug reaction as urticaria"]
       ]},
       {b:"why", html:"UAS7 is the validated outcome measure used in all CSU clinical trials and is recommended by BSACI and EAACI for monitoring treatment response in primary care. It takes about 2 minutes per week for the patient to complete (or they can use the Urticaria App on iOS and Android). Using it at each CSU review gives an objective measure of disease activity, documents treatment response, and triggers appropriate step-up: a UAS7 consistently above 15 despite a standard antihistamine means step up to double or quadruple dose; above 15 on high-dose antihistamine means specialist referral; NICE TA339 funds omalizumab only when UAS7 is 28 or more and the urticaria has not responded to H1-antihistamines and leukotriene receptor antagonists."}
     ]},

    {id:"ladder", nav:"Treat", title:"The antihistamine step-up ladder", sub:"Regular, not as-needed — and up-dosed before referral. Verify all doses in the BNF.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Step 1", title:"Non-sedating H1 antihistamine at licensed dose", when:"acute or mild chronic disease", fromLabel:"first-line",
          html:"Cetirizine 10 mg OD, loratadine 10 mg OD, or fexofenadine 120–180 mg OD. Use one agent, at the licensed dose, taken regularly, not just as needed. Review after 2–4 weeks, sooner if symptoms are severe, angioedema is frequent or quality of life is substantially impaired. Most acute urticaria resolves within 6 weeks."},
         {step:"Step 2", title:"Up-dose to 4× the licensed dose", when:"chronic disease not controlled", fromLabel:"inadequate control",
          html:"If control is inadequate after an appropriate trial, increase that same agent up to 4× the licensed dose off-label, with documentation and counselling (for example cetirizine up to 10 mg QDS). Check doses against the local formulary and product information; fexofenadine above the licensed dose is off-label and needs specialist or local protocol support. A BAD/EAACI recommendation. Review after 2–4 weeks during dose escalation. Avoid sedating antihistamines (chlorphenamine) for regular use — sedation, cognitive impairment and tolerance. Do not routinely combine multiple second-generation H1 antihistamines. If control is still inadequate at the up-dosed level, consider adding montelukast (see Adjuncts) while arranging specialist referral — NICE TA339 expects a leukotriene receptor antagonist to have been tried before omalizumab."},
         {step:"Step 3", title:"Omalizumab (specialist)", when:"refractory chronic spontaneous urticaria", fromLabel:"refractory to up-dosed antihistamine",
          html:"Omalizumab 300 mg SC every 4 weeks (NICE TA339): aged 12 or over; confirmed severe CSU with objective severity assessment (e.g. UAS7 28 or more); inadequate response to H1 antihistamines and leukotriene receptor antagonists; prescribed and administered under secondary-care specialist management — it is not a GP-prescribed drug. Stop at or before the fourth dose if no response; if responsive, stop at the end of six doses to assess spontaneous remission and restart only on relapse."},
         {step:"Step 4", title:"Ciclosporin and other immunosuppression", when:"omalizumab failure", fromLabel:"specialist dermatology",
          html:"Ciclosporin 3–5 mg/kg/day (short-term, specialist), methotrexate, or dapsone. Further biological agents are in clinical trials."},
         {step:"Adjuncts", title:"Short steroid and add-ons", when:"severe acute flare, or partial response", fromLabel:"",
          html:"A short specialist- or clinician-directed oral corticosteroid course may be considered for a severe acute flare only, after reconsidering anaphylaxis, infection, vasculitis and other diagnoses; use cautiously in diabetes, hypertension, infection risk and pregnancy; repeated or maintenance oral corticosteroids are inappropriate, and recurrent courses need review. H2-antihistamine addition has uncertain benefit and is not routinely recommended — consider only on specialist or local advice. Montelukast (10 mg OD, off-label): the BAD 2021 guideline suggests considering it as an add-on to the antihistamine when chronic urticaria remains inadequately controlled despite standard and up-dosed antihistamine. Evidence is limited (not routine from the outset, and not in the 2022 international EAACI algorithm), but NICE TA339 requires an inadequate response to a leukotriene receptor antagonist before omalizumab. Before starting, ask about mood, sleep and previous psychiatric illness and give the MHRA neuropsychiatric (boxed) warning; review benefit within a few weeks and stop if there is no response."}
       ]},
       {b:"warn", html:"<b>Avoid repeated or long-term oral steroids for chronic urticaria.</b> For <b>angioedema affecting the airway</b>, treat as an emergency — adrenaline if anaphylaxis; and remember antihistamines and steroids are generally ineffective in ACE-inhibitor or hereditary angioedema — airway assessment takes priority."},
       {b:"why", html:"The 4× antihistamine dose recommendation for CSU is evidence-based (a Cochrane review confirms superiority over standard dose) but technically off-label for most antihistamines — BAD and EAACI urticaria guidelines both recommend increasing one agent to 4× licensed dose, rather than combining agents, before escalating to omalizumab. The rationale is that H1 receptor occupancy follows dose–response kinetics and some patients need higher occupancy for control. Cetirizine 10 mg QDS is the most commonly used escalation: generally well tolerated, non-sedating, and achieving near-complete H1 receptor occupancy. When prescribing above the licensed dose, document the indication and the evidence base, and tell the patient this is higher than the packaging states and why — “off-label” does not mean unsafe, it means the manufacturer has not submitted the higher dose for licensing, typically for commercial reasons."},
       {b:"say", html:"Hives are usually harmless and settle with a regular antihistamine — take it every day, not just when it flares, because that's how it controls it. If that isn't enough we can safely go up to four times the packet dose, and there's a very effective injection treatment via the specialist if we still need it. The one thing to act on immediately is swelling of the lips, tongue or throat with any breathing difficulty — that's a 999 situation."}
     ]},

    {id:"special", nav:"Special situations", title:"Physical urticaria, anaphylaxis aftercare and hereditary angioedema", sub:"Four situations with their own rules — including the screening tests for HAE.",
     blocks:[
       {b:"table", head:["Situation","Management","Note"], rows:[
         ["<b>Dermographism</b>","Cetirizine 10 mg OD or BD is highly effective — the wheal response to minor trauma is histamine-mediated and completely blocked by H1 antihistamines in most patients","Does NOT require investigation in the absence of other features. Advise avoiding tight clothing and belts, and breaking the itch–scratch–wheal cycle"],
         ["<b>Cold urticaria</b>","Avoid cold-water immersion (risk of a systemic reaction including syncope and anaphylaxis). NEVER swim alone in cold water — anaphylactic syncope in water is fatal. Cetirizine BD or TDS","Ice-cube test: apply an ice cube in a bag to the forearm for 5 minutes, then observe for 10 minutes after removal — a wheal at the site is positive"],
         ["<b>Cholinergic urticaria</b>","Small (1–3 mm) itchy wheals on the trunk with exercise, a hot bath or emotional stress. Antihistamine taken 1 hour before exercise; adjust exercise intensity","Often confused with exercise-induced anaphylaxis — a different entity with larger wheals and systemic features"],
         ["<b>Post-anaphylaxis management</b>","Generally prescribe two adrenaline auto-injectors (NICE NG258), unless the trigger is an easily avoidable drug and specialist advice indicates they are not needed. Match the dose to age, weight and product licence (150, 300 or 500 micrograms depending on device and local policy). Brand-specific training for patient and family (both devices if different brands). Carry both together; second dose after 5 minutes if not improving or symptoms recur. Written anaphylaxis action plan, positioning and emergency advice. Medic-alert bracelet. Refer to an allergy service, with urgency determined by severity, trigger, recurrence risk and local pathway","<b>NEVER use an antihistamine as the first treatment for anaphylaxis</b>"],
         ["<b>Hereditary angioedema (HAE)</b>","C1-inhibitor deficiency (Type I: low level and activity; Type II: low activity, normal level), with a family history of angioedema. Measure C4 and C1-inhibitor level and function when HAE is suspected. Treatment: C1-inhibitor concentrate (Berinert, Ruconest) or icatibant (Firazyr) for acute attacks; long-term prophylaxis is a specialist decision (danazol is not a routine primary-care option because of adverse effects and contraindications). Later-onset recurrent angioedema without a family history → consider acquired angioedema (C1q; assess for lymphoproliferative or autoimmune disease)","A low C4 supports the diagnosis, but a normal C4 does not exclude it. Refer to an allergy or immunology service for confirmation and management"]
       ]},
       {b:"why", html:"The C4 level as an initial screening test for hereditary angioedema is a practical point that can expedite diagnosis in primary care — C4 is often low in HAE Types I and II because unregulated complement activation from C1-inhibitor deficiency continuously consumes it. Unlike C3 (which may be normal or mildly reduced), C4 is usually low, particularly during an attack — but it may be normal in some patients, so a normal C4 does not completely exclude HAE. Diagnosis requires C1-inhibitor antigenic level and functional assay, and repeat testing with specialist interpretation may be needed. In later-onset disease without a family history, consider acquired angioedema (C1q, and assessment for lymphoproliferative or autoimmune disease). Any patient with recurrent angioedema — especially facial or laryngeal, without urticarial wheals, with a family history of similar episodes — should have C4, C3 and C1-inhibitor level and function checked. The absence of urticarial wheals accompanying the angioedema is the key distinguishing feature from allergic angioedema, because HAE is bradykinin-mediated rather than histamine-mediated — which is also why HAE attacks are generally not relieved by antihistamines or steroids."}
     ]},

    {id:"lifestyle", nav:"Trigger avoidance", title:"Trigger avoidance and quality of life", sub:"Including the analgesia rule that patients most often get wrong, and the psychological burden that is routinely under-recognised.",
     blocks:[
       {b:"table", head:["Topic","What to advise","Why"], rows:[
         ["<b>🍽️ Food diary (IgE-mediated allergy)</b>","For suspected food-triggered urticaria: a detailed food diary for 2 weeks (time of reaction plus all foods eaten in the preceding 2 hours). Common culprits: peanuts, tree nuts, shellfish, fish, milk (especially children), eggs, wheat, sesame. Avoid suspected triggers while awaiting the allergy clinic. Testing should be guided by a convincing, reproducible history, not a broad food panel","<b>NOT useful in CSU — the trigger there is internal, not dietary</b>"],
         ["<b>💊 NSAID and aspirin avoidance</b>","NSAIDs and aspirin can exacerbate urticaria in some CSU patients via cyclo-oxygenase inhibition (not IgE-mediated). In suspected NSAID-induced urticaria, avoid non-selective COX-1 inhibitors pending assessment. Do not assume that all patients will react to every NSAID; specialist challenge may be needed when an anti-inflammatory is clinically important. Paracetamol is lower risk but is not guaranteed to be tolerated at high doses; selective COX-2 inhibitors (celecoxib) may be tolerated but should be considered cautiously, with specialist challenge where necessary","Ibuprofen is available over the counter and must be specifically named and avoided"],
         ["<b>❄️ Itch relief — the cheap measures that work</b>","<b>Keep cool: cool showers, cool compresses or an ice pack over the wheals, a cool bedroom, and no hot baths during a flare (heat lowers the wheal threshold). Cooling <b>emollients</b> — aqueous cream with menthol 1% or 2%, or calamine — applied liberally for symptomatic itch relief, and a plain emollient if the skin is dry or excoriated. Loose, non-constricting cotton clothing, especially in delayed-pressure and cholinergic urticaria. Keep the nails short</b>","Emollients and cooling do not treat the urticaria — they treat the itch, which is what keeps patients awake, and they are safe to combine with any step of the ladder"], ["<b>🧠 Stress management</b>","Emotional stress significantly worsens CSU (sympathetic activation causing mast-cell degranulation). Regular exercise — adapted for cholinergic urticaria, starting slowly with a warm-up. Mindfulness, CBT. Sleep (inadequate sleep worsens mast-cell reactivity). Address psychosocial stressors at each chronic urticaria review","A modifiable amplifier, not a psychological dismissal"],
         ["<b>🍺 Alcohol</b>","Alcohol causes vasodilation and directly triggers mast-cell degranulation, worsening urticaria and lowering the reaction threshold. Patients with food or drug allergies should be especially cautious — alcohol potentiates IgE-mediated reactions by increasing gastrointestinal permeability to food antigens as well as its direct mast-cell effects. Reduce or avoid during flares","Often the unrecognised reason for a flare"],
         ["<b>🆔 MedicAlert and action plan</b>","<b>Any patient with a history of anaphylaxis: a MedicAlert bracelet documenting the allergy and the adrenaline auto-injector requirement; a written one-page anaphylaxis action plan (when and how to use the auto-injector, when to call 999, what to tell A&amp;E); two suitable auto-injectors carried together at all times; a school or workplace anaphylaxis protocol for children</b>","Turns knowledge into a usable emergency response"],
         ["<b>😔 Psychological impact</b>","<b>CSU significantly impairs quality of life — sleep disturbance from nocturnal itch, social embarrassment, activity restriction, and anxiety about unpredictable attacks. Use the Dermatology Life Quality Index (DLQI) at each review. NHS Talking Therapies referral if depression or an anxiety disorder develops. Urticaria Network (urticarianetwork.org) for patient support</b>","Routinely under-recognised in a “benign” condition"],
         ["<b>🤰 Antihistamines in pregnancy</b>","<b>In pregnancy, loratadine or cetirizine are commonly preferred. Consider fexofenadine only after checking current UKTIS and product information and if clinically appropriate. Avoid routine sedating antihistamines (chlorphenamine) where possible. All antihistamines are excreted in breast milk in small amounts — loratadine preferred if breastfeeding</b>","A common and easily answered question"],
         ["<b>📅 Annual review for CSU</b>","<b>UAS7 score, current antihistamine dose, impact on sleep and daily activities, DLQI, whether a trigger has been identified, any new drug introduced, TFT if not already checked. Attempt step-down after 6 months of well-controlled disease</b>","Prevents indefinite high-dose prescribing"]
       ]},
       {b:"why", html:"<b>After emergency treatment for anaphylaxis, NICE NG258 generally recommends prescribing two adrenaline auto-injectors, with brand-specific training and an action plan, unless the trigger is an easily avoidable drug and specialist advice indicates they are not needed.</b> The reasons: a device may not be used correctly; the first dose may be insufficient, particularly in large adults or severe reactions; and peak plasma adrenaline after IM injection is reached in about 8 minutes and begins to fall by 20 minutes — so in biphasic anaphylaxis (reported in 1–20% of cases, with a second wave 1–72 hours after the initial reaction) a second dose may be needed. Match the device dose to the patient’s age, weight and product licence. There is no clinical requirement that both devices are the same brand — using the same device type simplifies training, but if different devices are supplied the patient must be trained in both, as the activation mechanisms differ. Carry both together and use the second after 5 minutes if symptoms have not improved or recur, while awaiting emergency help. A brief technique demonstration is insufficient: the patient AND their family or carers must practise with a trainer pen, available free from the manufacturer."}
     ]},

    {id:"monitor", nav:"Follow-up", title:"Follow-up and safety-netting", sub:"Review by type, and the biphasic-anaphylaxis rule every patient given adrenaline must hear.",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["<b>Acute urticaria</b>","Review at 6 weeks if not resolved — &gt;6 weeks defines it as CSU (≥6 weeks by some definitions)","Most acute urticaria self-resolves — no follow-up needed if improving. If a new drug was started within 6 weeks, consider a drug cause and stop the drug"],
         ["<b>CSU monitoring</b>","Monthly initially during antihistamine dose titration (with UAS7). Once stable on maximum antihistamine: 3-monthly","After 6 months of good control (UAS7 &lt;7), consider step-down to a lower dose. 50% of CSU remits spontaneously within 5 years"],
         ["<b>Post-anaphylaxis</b>","Refer to an appropriate allergy service, with urgency determined by severity, trigger, recurrence risk and local pathway (investigate the cause, threshold testing, auto-injector review)","Confirm the patient carries two auto-injectors; document the anaphylaxis action plan in the record. DVLA: not notifiable unless there is an ongoing syncope risk"],
         ["<b>Urticarial vasculitis monitoring</b>","<b>Each review</b>","Urinalysis for haematuria and proteinuria (renal involvement), blood pressure, renal function, CRP/ESR, joint examination; complement and other tests as specialist-guided — rheumatology or dermatology-led"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"📞 999", html:"Any throat tightening, stridor or voice change with urticaria (anaphylaxis or HAE) → adrenaline IM plus 999 · an HAE attack not responding to home treatment · biphasic anaphylaxis, with symptoms returning 1–24 hours after the initial reaction."},
         {tone:"amber", h:"🟠 Same-day or urgent", html:"New wheals persisting &gt;24 h in the same location (possible vasculitis) → dermatology · CSU worsening rapidly despite maximum antihistamine → step up or refer dermatology · ACE-inhibitor angioedema → stop it permanently, document the adverse drug reaction (avoid all ACE inhibitors), and arrange emergency assessment if there is any airway involvement."},
         {tone:"cream", h:"💬 What to say", html:"“Swelling of the tongue, throat or lips with difficulty breathing or swallowing, or feeling faint — call 999 and use your adrenaline pen if you have one.” “If you take a ‘-pril’ blood-pressure tablet and get facial or tongue swelling, stop it and contact us — it can cause this even years later.” “If individual spots last more than a day, hurt, or bruise, tell us — that needs different assessment.” “Take the antihistamine regularly, not just when it flares.”"}
       ]},
       {b:"why", html:"The biphasic anaphylaxis concept is important for patient safety counselling — biphasic reactions are reported in between 1% and 20% of anaphylaxis cases, with symptoms recurring 1–72 hours after the initial reaction (most commonly 6–12 hours) without re-exposure to the trigger. This is why everyone treated for anaphylaxis is observed in hospital, for a period set by risk — from 2 hours after a prompt, complete response to a single adrenaline dose to 6 hours or more after two doses, a previous biphasic reaction, severe asthma or possible ongoing absorption (Resuscitation Council UK 2021). The counselling sentence to use: “The reaction can sometimes come back hours later. If you use your EpiPen and your symptoms improve, you still need to call 999 and go to hospital, because the reaction may return even after it appears to have settled.” Any use of an adrenaline auto-injector requires emergency assessment — it is not safe to go home just because symptoms have improved. Observation duration is determined by the clinical response, number of adrenaline doses, severity, comorbidity and local emergency protocol (NICE NG258: some low-risk patients may be considered for discharge at least 2 hours after resolution; at least 6 hours if two adrenaline doses were needed or there is a previous biphasic reaction; at least 12 hours after severe anaphylaxis, significant respiratory compromise, possible ongoing absorption, out-of-hours presentation or limited access to emergency care)."}
     ]},

    {id:"loop", nav:"Not controlled?", title:"Not controlled? Check before escalating", sub:"Confirm adequate antihistamine dosing and reconsider the diagnosis.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"1 · Dose", html:"<b>Regular (not PRN) and up-dosed to 4× licensed for chronic disease?</b>"},
         {tone:"amber", h:"2 · Triggers and drugs", html:"<b>NSAIDs, ACE inhibitor, alcohol and physical triggers removed?</b>"},
         {tone:"amber", h:"3 · Diagnosis", html:"Wheals over 24 hours, painful or bruising → urticarial vasculitis; angioedema without wheals → a bradykinin cause."},
         {tone:"amber", h:"4 · Adherence", html:"<b>Taken consistently? Many patients under-use antihistamines.</b>"},
         {tone:"amber", h:"5 · Refer", html:"<b>Refractory chronic urticaria → dermatology for omalizumab.</b>"}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways", sub:"Emergency for the airway; allergy clinic for anyone who has had throat swelling; dermatology for refractory chronic disease.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999", html:"Suspected anaphylaxis (acute airway, breathing or circulation compromise) · an HAE upper-airway crisis · severe generalised urticaria not responding to adrenaline."},
         {tone:"amber", h:"Allergy clinic (urgency by severity, trigger, recurrence risk and local pathway)", html:"Any suspected anaphylaxis or urticaria with a history of throat swelling (auto-injector review plus allergy work-up) · suspected food allergy with IgE-mediated urticaria · drug allergy requiring confirmation (penicillin allergy re-testing) · physical urticaria with severe functional impact."},
         {tone:"blue", h:"Dermatology", html:"CSU not controlled on maximum-dose antihistamine (step up to omalizumab) · suspected urticarial vasculitis (skin biopsy plus systemic work-up) · chronic urticaria with diagnostic uncertainty."},
         {tone:"blue", h:"Rheumatology", html:"Urticarial vasculitis with systemic features (joint pain, proteinuria, positive ANA or ANCA) · possible SLE-associated urticarial vasculitis."},
         {tone:"blue", h:"Immunology / haematology", html:"Recurrent isolated angioedema without wheals → C1-esterase inhibitor deficiency or an ACE-inhibitor cause · suspected or confirmed HAE for C4/C1-inhibitor confirmation, on-demand treatment and prophylaxis planning · later-onset recurrent angioedema without family history → acquired angioedema assessment (C1q; lymphoproliferative or autoimmune disease)."},
         {tone:"green", h:"GP manages", html:"Acute urticaria: non-sedating antihistamine plus trigger identification and avoidance. CSU: non-sedating antihistamine with step-up. Dermographism: antihistamine. Physical urticaria: avoidance plus antihistamine."}
       ]},
       {b:"why", html:"Omalizumab (Xolair) is a transformative treatment for chronic spontaneous urticaria, approved under NICE TA339 (2015), and one of the most significant advances in dermatology in the past decade — a humanised anti-IgE monoclonal antibody that binds free IgE and prevents it binding to IgE receptors on mast cells and basophils. In CSU it is given as 300 mg SC every 4 weeks. The NICE TA339 criteria: confirmed severe CSU with objective severity assessment (for example UAS7 of 28 or more) that has not responded to standard treatment with H1-antihistamines and leukotriene receptor antagonists, in adults and young people aged 12 and over, prescribed and administered under secondary-care specialist management; stop at or before the fourth dose if there is no response. Six doses is the NICE commissioning course rather than a universal duration — responders stop at the end of six doses to assess spontaneous remission and restart only on relapse. Long-term continuation or off-label dose escalation is specialist-led. NICE TA339 recommends it only under the management of a secondary care specialist."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 58-year-old woman describes four months of daily itchy hives and asks for “a stronger cream”. She has been taking cetirizine 10 mg “when they're bad”. She takes ramipril for blood pressure and has had two episodes of lip and tongue swelling without any hives, one needing A&amp;E. She also shows you a spot on her forearm she says has been there since Sunday and is now bruised."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Separates <b>three problems in one consultation</b>: recognises the isolated angioedema without wheals on an ACE inhibitor as bradykinin-mediated — stops ramipril <b>permanently</b>, documents ACE-inhibitor-associated angioedema as an adverse drug reaction (avoid all ACE inhibitors), considers an alternative antihypertensive — an ARB only after risk–benefit assessment (lower risk, not absent) — and explains that <b>antihistamines and steroids are generally ineffective</b> for it; applies the <b>&gt;24 h-plus-bruising rule</b> to the forearm lesion as a red flag, checks urinalysis, FBC, renal function, LFTs, ESR/CRP and blood pressure, and arranges dermatology assessment and biopsy for possible urticarial vasculitis, with further serology if there are systemic features or on specialist advice; and for the CSU itself corrects <b>PRN to regular dosing</b>, up-doses to <b>4× licensed with the off-label explanation documented</b>, checks <b>FBC, ESR/CRP, TFT and anti-TPO</b>, scores <b>UAS7</b>, and safety-nets <b>airway swelling as 999</b>. <a href='../../cases/urticaria.html'>Open the full casebook chapter →</a>"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>British Association of Dermatologists guidelines for the management of people with chronic urticaria 2021</b> (Br J Dermatol 2022)<br><a href="https://doi.org/10.1111/bjd.20892" rel="noopener">doi:10.1111/bjd.20892</a><span class="rd"> — principal UK urticaria reference: single-agent up-dosing, minimal investigation, montelukast as an add-on to consider when up-dosed antihistamine fails, specialist escalation, and natural history (about half remit within 6 months to 5 years; around 1 in 5 still active at 10 years)</span></li>'+
         '<li><b>EAACI/GA²LEN/EuroGuiDerm/APAAACI international urticaria guideline</b><br><a href="https://doi.org/10.1111/all.15090" rel="noopener">doi:10.1111/all.15090</a><span class="rd"> — up-dose one second-generation H1 antihistamine up to 4×; no routine combination of H1 agents; insufficient evidence for routine H2 addition</span></li>'+
         '<li><b>BSACI — guideline for the management of chronic urticaria and angioedema</b> (Powell RJ et al. Clin Exp Allergy 2015;45:547–65) and <b>EAACI/GA²LEN/EuroGuiDerm/APAAACI guideline for urticaria</b> (Zuberbier T et al. Allergy 2022;77:734–66; international)<span class="rd"> \u2014 the up-dose to 4\u00d7 licensed dose recommendation, UAS7 for monitoring, the two-auto-injector rule, and the avoid-regular-sedating-antihistamine advice</span></li>'+
         '<li>NICE TA339 (omalizumab for chronic spontaneous urticaria, 2015)<br><a href="https://www.nice.org.uk/guidance/ta339" rel="noopener">nice.org.uk/guidance/ta339</a><span class="rd"> \u2014 300 mg SC 4-weekly for severe CSU (UAS7 28 or more) not responding to H1-antihistamines and leukotriene receptor antagonists, aged 12 and over, under a secondary care specialist; stop at or before the fourth dose if no response (minimal investigation of CSU comes from BSACI, not TA339)</span></li>'+
         '<li><b>Resuscitation Council UK \u2014 Emergency treatment of anaphylaxis: guidelines for healthcare providers (May 2021)</b><br><a href="https://www.resus.org.uk/library/additional-guidance/guidance-anaphylaxis/emergency-treatment" rel="noopener">resus.org.uk</a><span class="rd"> \u2014 IM adrenaline 500 micrograms for adults and children over 12, repeated after 5 minutes if ABC problems persist, lie flat with legs raised, oxygen, fluids and refractory-anaphylaxis escalation, emergency assessment after community adrenaline with a risk-stratified observation period, and biphasic reactions reported in 1\u201320%</span></li>'+
         '<li><b>NICE NG258 (2026, replaced CG134) — Anaphylaxis: assessment and referral</b><br><a href="https://www.nice.org.uk/guidance/ng258" rel="noopener">nice.org.uk/guidance/ng258</a><span class="rd"> — two auto-injectors with training and action plan, risk-stratified observation (2, 6 or 12 hours after resolution), and specialist allergy referral</span></li>'+
         '<li><b>UKTIS / BUMPS — medicines in pregnancy</b><br><a href="https://www.medicinesinpregnancy.org" rel="noopener">medicinesinpregnancy.org</a><span class="rd"> — antihistamine choice in pregnancy; check with product information and the local formulary</span></li>'+
         '<li>Cochrane review — H1 antihistamines for chronic spontaneous urticaria<span class="rd"> \u2014 confirms the superiority of higher-dose over standard-dose antihistamine</span></li>'+
         '<li><b>NICE NG12 \u2014 Suspected cancer: recognition and referral (updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> \u2014 the lymphoma route for urticaria with fever, lymphadenopathy, weight loss or night sweats</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> \u2014 cetirizine, loratadine, fexofenadine, prednisolone, famotidine, montelukast (MHRA neuropsychiatric warning), ciclosporin and icatibant: verify against the BNF, product information and local formulary before prescribing</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Primary-care assessment and management of acute and chronic urticaria \u2014 BSACI/EAACI urticaria guidelines, NICE TA339 (omalizumab), Resuscitation Council UK anaphylaxis guidance, and NICE NG12 (updated April 2026) for the lymphoma route. Assessment and management are merged on this page; the former algorithm is retired. Give IM adrenaline immediately when anaphylaxis is suspected, never antihistamine first; antihistamines and steroids are generally ineffective in ACE-inhibitor or hereditary angioedema, where airway assessment takes priority. BAD 2021 and NICE NG258 also inform this page. Verify every dose against the current BNF before prescribing."
});
