  stemSub:"One page for the whole condition. Give adrenaline before antihistamine in anaphylaxis; recognise the bradykinin-mediated angioedemas (ACE inhibitor, hereditary) that do not respond to antihistamines or steroids at all; apply the wheal-lasting-over-24-hours rule that separates ordinary urticaria from urticarial vasculitis; classify acute, chronic spontaneous and inducible disease; score with UAS7; then step the non-sedating antihistamine up to four times the licensed dose before referring for omalizumab. BSACI/EAACI · NICE TA339.",

  ],
  lead:"<div class='mg-layers'><a href='#severe'><b>Red flags</b><small>Anaphylaxis · ACEi · vasculitis</small></a><a href='#classify'><b>Classify</b><small>Acute · CSU · inducible</small></a><a href='#ladder'><b>Treat</b><small>Up to 4× licensed dose</small></a><a href='#special'><b>Special</b><small>Physical · HAE · EpiPen</small></a></div>",
  quickSub:"If you read nothing else on this page, read these six cards. Every figure traces to the source cited under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Anaphylaxis is the diagnosis until adrenaline is given", html:"Urticaria + throat tightening + stridor + bronchospasm + hypotension or collapse → adrenaline 0.5 mg IM anterolateral thigh, then 999 immediately. Lie flat with legs raised. Second dose at 5 minutes if there is no improvement. Do NOT delay for an antihistamine alone — never use an antihistamine as the first treatment for anaphylaxis. IV antihistamine and hydrocortisone are hospital additions, not substitutes."},
    {tone:"amber", h:"ACE-inhibitor and hereditary angioedema are bradykinin-mediated — antihistamines do nothing", html:"Angioedema of the tongue, lip or larynx WITHOUT urticarial wheals is bradykinin-mediated: ACE-inhibitor-induced or hereditary angioedema. It does not respond to antihistamines or corticosteroids, and it can occur months to years after starting the ACE inhibitor — it is not a type I hypersensitivity reaction. Stop the ACE inhibitor permanently (a class effect — switching ACE inhibitor does not help), switch to an ARB (lower risk, not zero), record it as an absolute allergy, and use icatibant or C1-inhibitor concentrate in hospital for airway involvement."},
    {tone:"blue", h:"A wheal lasting more than 24 hours in one place is NOT ordinary urticaria", html:"Ordinary wheals form and resolve within 24 hours (&lt;24 h), moving location as new ones appear. A wheal lasting &gt;24 h in the same place, or that is painful rather than itchy, or bruises as it fades, is urticarial vasculitis until a biopsy proves otherwise. It is associated with SLE (about 5%), hepatitis B and C, Sjögren's and cryoglobulinaemia — so it needs biopsy, ANA, dsDNA, complement (C3, C4, CH50), ANCA, hepatitis serology and cryoglobulins."},
    {tone:"green", h:"Up-dose to 4× licensed before you refer — and say why", html:"Non-sedating antihistamine at licensed dose first (cetirizine 10 mg, loratadine 10 mg, fexofenadine 120–180 mg OD); if chronic disease is uncontrolled, increase to up to 4× the licensed dose — cetirizine 10 mg QDS is the commonest escalation. BSACI and EAACI both recommend this before omalizumab; it is off-label, so document the indication and evidence, and tell the patient it is deliberately above the packet dose and why. Avoid regular sedating antihistamines (chlorphenamine) — sedation, cognitive impairment and tolerance."},
    {tone:"purple", h:"Omalizumab transforms refractory chronic disease", html:"Omalizumab (Xolair) 300 mg SC every 4 weeks for 6 months — NICE TA339 for chronic spontaneous urticaria inadequately controlled on high-dose non-sedating antihistamine in patients aged 12 and over (≥12 years). Meaningful improvement in about 70%, complete control (UAS7 = 0) in about 35–40%. Dermatology initiates; GPs may administer in shared care. About 50% remain in remission after stopping, and it can be re-introduced on relapse."},
    {tone:"teal", h:"Two adrenaline auto-injectors, always — never one", html:"Every patient with a history of anaphylaxis must be prescribed and carry TWO auto-injectors of the same device type (both EpiPen or both Jext — never mixed): devices misfire in about 5%, one dose can be insufficient, and biphasic anaphylaxis occurs in about 20% of cases with symptoms returning 1–72 hours later (commonly 6–12 hours). BSACI identifies prescribing a single EpiPen as a prescribing-quality issue. Adrenaline used in the community is ALWAYS followed by hospital observation, even if symptoms settle."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step contains a drug that must be given in seconds, and a drug that must be stopped forever.",
  pathway:[
    {title:"Screen for anaphylaxis, bradykinin angioedema and vasculitis", html:"Urticaria with throat tightening, stridor, bronchospasm, hypotension or collapse → adrenaline 0.5 mg IM then 999. Angioedema of tongue, lip or larynx without wheals → bradykinin-mediated (HAE or ACE inhibitor): 999 if the airway is involved; antihistamines are ineffective. Recent or long-standing ACE inhibitor with angioedema → stop it permanently. Wheals lasting over 24 hours with purpura, joint pain, fever or abdominal pain → urticarial vasculitis. Urticaria with fever, lymphadenopathy, weight loss and night sweats → 2WW haematology for lymphoma. A child with urticaria after infection plus joint swelling, haematuria and abdominal pain → Henoch-Schönlein purpura, paediatric referral.", alert:true},
    {title:"Classify the type", html:"Acute (&lt;6 weeks) — drugs in around 50%, foods, viral URTI (especially children), contact and physical triggers; 50–60% have no identifiable cause. Chronic spontaneous (&gt;6 weeks) — about 50% autoimmune, with anti-TPO in around 25%. Inducible or physical — dermographism, cold, cholinergic, solar, pressure, aquagenic. Drug-induced — NSAID (pharmacological, so ALL NSAIDs cross-react), penicillin (IgE), opioid and contrast (direct degranulation), ACE inhibitor (bradykinin). Urticarial vasculitis — the over-24-hour exception."},
    {title:"Assess and investigate minimally", html:"History: duration per wheal (the key discriminator), triggers, full drug history including OTC ibuprofen, timing, angioedema and airway involvement, family history of HAE, atopy, systemic symptoms. Examination: wheal character, distribution, dermographism (stroke firmly — a wheal within 3 minutes), non-pitting angioedema, lymphadenopathy, joints; stridor is an emergency. Investigations for chronic disease: FBC, ESR/CRP, TFT plus anti-TPO — and nothing else unless there are clinical pointers. Specific IgE or skin-prick testing only where an IgE-mediated trigger is suspected."},
    {title:"Score, then step the antihistamine up", html:"Score UAS7 (wheals plus itch daily for 7 days, maximum 42): 0–6 well controlled, 7–15 mild, 16–27 moderate, 28–42 severe. Step 1 licensed-dose non-sedating antihistamine, reviewed at 4 weeks. Step 2 up to 4× licensed dose. Step 3 omalizumab via dermatology. Step 4 ciclosporin, methotrexate or dapsone. Prednisolone 40 mg for 5–7 days for a severe acute flare only — never for chronic maintenance."},
    {title:"Follow up, and safety-net the airway", html:"Acute: review at 6 weeks if unresolved (that redefines it as chronic). Chronic: monthly during titration, then 3-monthly; attempt step-down after 6 months of good control. Post-anaphylaxis: allergy clinic within 4 weeks, two auto-injectors confirmed, written action plan. Urticarial vasculitis: urinalysis, CRP/ESR and complement at each review."}
  ],
  sections:[
    {id:"severe", nav:"Red flags", title:"Red flags — anaphylaxis, bradykinin angioedema and urticarial vasculitis", sub:"Most urticaria is benign and self-limiting. Anaphylaxis is the life-threatening exception — identify and act within seconds. Urticarial vasculitis is the chronic systemic exception requiring investigation.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Anaphylaxis", html:"Urticaria + throat tightening + stridor + bronchospasm + hypotension + collapse → adrenaline 0.5 mg IM anterolateral thigh → 999 immediately. Lie flat with legs raised. Second adrenaline at 5 minutes if no improvement. IV antihistamine and hydrocortisone in hospital. Anaphylaxis is the diagnosis until adrenaline is given — do NOT delay for antihistamine alone."},
         {tone:"red", h:"🔴 Angioedema of tongue, lip or larynx WITHOUT wheals", html:"Hereditary angioedema (HAE) or ACE-inhibitor-induced angioedema — bradykinin-mediated, so antihistamines are INEFFECTIVE. 999 if the airway is involved. C1-inhibitor concentrate (HAE) or icatibant (a bradykinin B2 receptor antagonist) — hospital-initiated. An ACE inhibitor must be stopped permanently."},
         {tone:"amber", h:"🟠 Wheals lasting over 24 hours in the same location", html:"With purpura and systemic features (joint pain, fever, abdominal pain) → urticarial vasculitis. Not simple urticaria: each lesion persists beyond 24 hours and may bruise. Skin biopsy (leucocytoclastic vasculitis on histology), ANA, ANCA, complement, hepatitis B and C, cryoglobulins. Rheumatology plus dermatology."},
         {tone:"amber", h:"🟠 Recent introduction of an ACE inhibitor", html:"ACEi-induced angioedema — bradykinin-mediated (ACE inhibitors block bradykinin breakdown) and can occur months to years after starting. Stop the ACE inhibitor permanently and switch to an ARB (lower risk but not zero). Antihistamines and steroids are NOT effective."},
         {tone:"purple", h:"🟣 Urticaria + fever, lymphadenopathy, weight loss, night sweats <span class='tw'>2WW</span>", html:"Urticaria as a paraneoplastic feature of lymphoma (especially Hodgkin's), or as a feature of serum sickness or drug reaction → 2WW haematology, with FBC, LDH and CT.", src:"NICE NG12"},
         {tone:"blue", h:"🔵 Child with urticaria + joint swelling, haematuria, abdominal pain", html:"Henoch-Schönlein purpura (IgA vasculitis) — palpable purpura on buttocks and legs, arthritis, abdominal pain, renal involvement (IgA nephropathy). Urinalysis for haematuria and proteinuria. Paediatric referral."}
       ]},
       {b:"why", html:"The ACE-inhibitor angioedema mechanism is fundamentally different from allergic urticaria and angioedema — it is bradykinin-mediated, not histamine-mediated. ACE inhibitors block angiotensin-converting enzyme, which also breaks down bradykinin; accumulated bradykinin causes vasodilation and increased vascular permeability in the face, lips, tongue and upper airway. This matters because it does not respond to antihistamines or corticosteroids, it can occur months to years after starting the drug (it is not a type I hypersensitivity reaction), and it can be fatal with upper-airway involvement. Management is to stop the ACE inhibitor permanently — switching to another ACE inhibitor does not eliminate the risk, as it is a class effect. ARBs carry a lower bradykinin risk but not zero. Icatibant is the specific antidote in hospital. GPs identifying ACEi angioedema must record it as an absolute allergy so no future prescriber can restart it."}
     ]},

    {id:"classify", nav:"Classify", title:"Classification — the types of urticaria", sub:"Type determines whether you investigate, what you avoid, and which drug will work.",
     blocks:[
       {b:"table", head:["Type","Features","Management implication"], rows:[
         ["<b>Acute urticaria (&lt;6 weeks)</b>","The most common. Drugs (NSAIDs, penicillin, aspirin — around 50% of acute urticaria), foods (nuts, shellfish, eggs, dairy, additives — IgE-mediated in true allergy), infections (viral URTI is the commonest trigger, especially in children), contact (latex, nickel, cosmetics), physical (exercise, cold, heat, pressure, dermographism). 50–60% have no identifiable cause","Usually self-limiting; 90% resolve within 6 weeks on a regular non-sedating antihistamine"],
         ["<b>Chronic spontaneous urticaria (CSU, &gt;6 weeks)</b>","Spontaneous wheals ± angioedema daily or near-daily for &gt;6 weeks with no external trigger. The commonest chronic type. About 50% autoimmune: IgG autoantibodies to the IgE receptor (FcεRI) or to IgE itself — analogous to Graves' disease of the mast cell. Associated with thyroid autoimmunity","Check TFT and anti-TPO; investigate further only if features suggest underlying disease. Non-sedating antihistamine, up-dosed"],
         ["<b>Inducible / physical urticaria</b>","Reproducibly triggered by a specific physical stimulus: dermographism (stroking the skin — the commonest physical urticaria), cold urticaria, cholinergic urticaria (exercise, heat, sweating — small wheals), solar urticaria, delayed pressure urticaria (hours after sustained pressure, not immediate), aquagenic","<b>Avoidance plus antihistamine — see <a href='#special'>Special situations</a></b>"],
         ["<b>Drug-induced urticaria</b>","NSAIDs and aspirin: pharmacological (cyclo-oxygenase inhibition alters arachidonic acid metabolism causing mast-cell degranulation) — NOT IgE-mediated, so ALL NSAIDs cause it. Penicillins and cephalosporins: IgE-mediated true allergy, may cross-react. Opioids and radiographic contrast: direct mast-cell degranulation. ACE inhibitors: bradykinin, so no response to antihistamines","<b>Mechanism dictates whether switching within the class is possible</b>"],
         ["<b>Urticarial vasculitis</b>","Wheals persist &gt;24 h in the same location (ordinary urticaria moves within &lt;24 h), may leave bruising, with systemic features. Biopsy shows a neutrophilic infiltrate around vessels with fibrinoid necrosis. Associated with SLE (anti-dsDNA), hepatitis B and C, and cryoglobulinaemia","<b>Biopsy and systemic work-up — a different pathway entirely</b>"]
       ]},
       {b:"why", html:"The “ordinary urticaria moves within 24 hours” rule is the single most important clinical distinction between simple urticaria and urticarial vasculitis. Normal wheals form and resolve within 24 hours, with individual wheals changing location as new ones appear elsewhere. If a patient shows you a wheal that has been in the same place for three days, or is painful rather than itchy, or leaves a bruise as it fades — it is NOT ordinary urticaria; it is urticarial vasculitis until a skin biopsy proves otherwise. The significance is that urticarial vasculitis can be associated with serious systemic disease (SLE in about 5% of cases, hepatitis B and C, Sjögren's syndrome, and hypocomplementaemic urticarial vasculitis syndrome — HUVS) and needs a different investigation and management pathway: skin biopsy (a GP can arrange this or refer dermatology), ANA, dsDNA, complement (C3, C4, CH50), ANCA, hepatitis B and C serology, and cryoglobulins."}
     ]},

    {id:"assess", nav:"Assess", title:"Assessment — history, examination and investigations", sub:"The duration of each individual wheal is the highest-yield question in the whole consultation.",
     blocks:[
       {b:"table", head:["Domain","Detail","Why"], rows:[
         ["<b>History</b>","Wheal morphology — size, shape, distribution, and duration PER WHEAL (the key: &lt;24 h = ordinary, &gt;24 h = vasculitis). Triggers: specific foods, drugs, exercise, cold, heat, stress, infection. Drug history: NSAIDs including OTC ibuprofen, aspirin, ACE inhibitors, antibiotics. Food diary if a food trigger is suspected. Timing: acute versus chronic (&gt;6 weeks). Angioedema — face, lip, tongue, throat: is the upper airway involved? Family history (HAE). Atopy. Systemic symptoms (fever, joint pain, fatigue, weight loss — vasculitis or malignancy)","The diagnosis is made here, not in the laboratory"],
         ["<b>Examination</b>","Wheal characteristics: erythematous, raised, evanescent and itchy (ordinary) versus persistent and bruising (vasculitis). Distribution: localised or generalised. Dermographism — stroke the skin firmly; a wheal within 3 minutes is positive (present in about 5% of the population). Angioedema: non-pitting swelling of face, lips, tongue, hands. Systemic: lymphadenopathy, hepatosplenomegaly, joint swelling","<b>Urgent: throat or laryngeal involvement with stridor is an emergency</b>"],
         ["<b>Investigations — chronic urticaria</b>","NICE and BSACI: minimal investigation is needed for CSU in the absence of specific clinical pointers. First-line: FBC with differential (eosinophilia — atopy, parasites), ESR/CRP (elevated suggests vasculitis or systemic disease), TFT plus anti-TPO antibodies (thyroid autoimmunity in about 25% of CSU). Only if there are clinical pointers: ANA/dsDNA, complement, ANCA, hepatitis serology, immunoglobulins, skin biopsy","Over-investigation adds anxiety, not answers"],
         ["<b>Allergy testing</b>","Where a specific IgE-mediated trigger is suspected: specific IgE (RAST) or skin-prick testing via an allergy clinic. Total IgE is non-discriminatory. NSAID urticaria is NOT IgE-mediated — skin-prick testing is negative, so confirm by history and NSAID avoidance; oral challenge at an allergy clinic if uncertain","Prevents both false reassurance and false labelling"]
       ]},
       {b:"cards", items:[
         {tone:"purple", h:"NG12 criteria that surface here <span class='tw'>2WW</span>", html:"Urticaria has no NICE NG12 criterion of its own, and this page does not invent one — but urticaria can be paraneoplastic, and the systemic screen puts two NG12 routes directly in front of you:<br>• Urticaria with unexplained fever, lymphadenopathy, weight loss or night sweats → 2-week-wait haematology for suspected lymphoma, with FBC and LDH; unexplained persistent lymphadenopathy or splenomegaly is the NG12 trigger, and a very urgent FBC where features suggest leukaemia.<br>• Unexplained weight loss with other trigger symptoms → the relevant urgent suspected-cancer pathway for the site indicated rather than attributing constitutional symptoms to chronic urticaria.<br>Chronic urticaria that is systemically unwell is not simply chronic urticaria.", src:"NICE NG12 (updated May 2025) · house rule"}
       ]},
       {b:"why", html:"The anti-TPO antibody association with chronic spontaneous urticaria is an important clinical connection — approximately 25% of patients with CSU have elevated anti-thyroid peroxidase antibodies, suggesting an autoimmune basis. Practically: CSU patients should have TFTs checked (hypothyroidism may coexist), and the presence of anti-TPO antibodies does not cause urticaria through thyroid dysfunction — the autoimmunity reflects a general propensity to produce autoantibodies, including IgG antibodies to the high-affinity IgE receptor (FcεRI) on mast cells, which trigger degranulation without IgE involvement. This explains why antihistamines often give only partial relief in autoimmune CSU, why omalizumab works so well (reducing free IgE available to bind mast-cell receptors, and possibly reducing receptor density), and why thyroid hormone replacement in hypothyroid CSU patients can improve urticaria independent of correcting thyroid status."}
     ]},

    {id:"severity", nav:"Severity", title:"Severity assessment", sub:"UAS7 turns “a bit better” into a number, and the number drives the step-up decision.",
     blocks:[
       {b:"table", head:["Tool","How","Interpretation"], rows:[
         ["<b>Urticaria Activity Score 7 (UAS7)</b>","Score daily for 7 days: wheals (0 = none, 1 = &lt;20 wheals, 2 = 20–50, 3 = &gt;50) plus itch (0 = none, 1 = mild, 2 = moderate, 3 = severe). Maximum 42","0–6 well controlled · 7–15 mild · 16–27 moderate · 28–42 severe. Use at each consultation to track response and benchmark step-up decisions"],
         ["<b>Angioedema risk assessment</b>","Angioedema of the lips or face (not the upper airway) is uncomfortable but not immediately life-threatening. Angioedema of the tongue, uvula or throat is an airway emergency","Any history of throat swelling with urticaria → prescribe an adrenaline auto-injector (EpiPen or Jext) and refer to an allergy clinic. HAE history → arrange a C1-inhibitor concentrate prescription"],
         ["<b>Dermographism test</b>","Stroke a blunt instrument (tongue depressor) firmly along the forearm — a raised erythematous wheal along the stroke line within 3 minutes is positive","Indicates symptomatic dermographism, the commonest physical urticaria; treatable with an antihistamine"],
         ["<b>Differentiate from a maculopapular rash</b>","Urticaria: raised, erythematous, evanescent (moves and changes), extremely pruritic. Fixed drug eruption: persistent, same location each time the drug is taken. Erythema multiforme: target lesions. Drug-induced maculopapular rash: flat red spots, symmetrical. Viral exanthem: fever prodrome, typically fine and widespread","Prevents mislabelling a drug reaction as urticaria"]
       ]},
       {b:"why", html:"UAS7 is the validated outcome measure used in all CSU clinical trials and is recommended by BSACI and EAACI for monitoring treatment response in primary care. It takes about 2 minutes per week for the patient to complete (or they can use the Urticaria App on iOS and Android). Using it at each CSU review gives an objective measure of disease activity, documents treatment response, and triggers appropriate step-up: a UAS7 consistently above 15 despite a standard antihistamine means step up to double or quadruple dose; above 15 on high-dose antihistamine means omalizumab referral, which is the NICE-approved indication."}
     ]},

    {id:"ladder", nav:"Treat", title:"The antihistamine step-up ladder", sub:"Regular, not as-needed — and up-dosed before referral. Verify all doses in the BNF.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Step 1", title:"Non-sedating H1 antihistamine at licensed dose", when:"acute or mild chronic disease", fromLabel:"first-line",
          html:"Cetirizine 10 mg OD, loratadine 10 mg OD, or fexofenadine 120–180 mg OD. Start at the licensed dose and take it regularly, not just as needed. Review at 4 weeks. 90% of acute urticaria resolves within 6 weeks on this alone."},
         {step:"Step 2", title:"Up-dose to 4× the licensed dose", when:"chronic disease not controlled", fromLabel:"inadequate control",
          html:"Increase the non-sedating antihistamine to up to 4× licensed dose: cetirizine 10 mg QDS, or loratadine 10 mg BD, or fexofenadine 180 mg BD–TDS. A BSACI recommendation, off-label above the licensed dose — discuss with the patient. Avoid sedating antihistamines (chlorphenamine) for regular use — sedation, cognitive impairment and tolerance. Consider adding a different second-generation agent."},
         {step:"Step 3", title:"Omalizumab (specialist)", when:"refractory chronic spontaneous urticaria", fromLabel:"refractory to up-dosed antihistamine",
          html:"Omalizumab 300 mg SC every 4 weeks for 6 months (NICE TA339). Dramatic response in 70%, complete response in about 35%. Initiated by dermatology; the GP may administer the SC injection in shared care."},
         {step:"Step 4", title:"Ciclosporin and other immunosuppression", when:"omalizumab failure", fromLabel:"specialist dermatology",
          html:"Ciclosporin 3–5 mg/kg/day (short-term, specialist), methotrexate, or dapsone. Further biological agents are in clinical trials."},
         {step:"Adjuncts", title:"Short steroid and add-ons", when:"severe acute flare, or partial response", fromLabel:"",
          html:"Prednisolone 40 mg OD for 5–7 days for a severe acute flare ONLY — not for chronic maintenance. An H2 antihistamine (famotidine — ranitidine was withdrawn in the UK in 2020) gives a modest additive effect. Montelukast (a leukotriene receptor antagonist) is a modestly effective add-on in aspirin-sensitive urticaria."}
       ]},
       {b:"warn", html:"<b>Avoid repeated or long-term oral steroids for chronic urticaria.</b> For <b>angioedema affecting the airway</b>, treat as an emergency — adrenaline if anaphylaxis; and remember antihistamines and steroids do not work at all in ACE-inhibitor or hereditary angioedema."},
       {b:"why", html:"The 4× antihistamine dose recommendation for CSU is evidence-based (a Cochrane review confirms superiority over standard dose) but technically off-label for most antihistamines — BSACI and EAACI urticaria guidelines both recommend increasing to 4× licensed dose before escalating to omalizumab. The rationale is that H1 receptor occupancy follows dose–response kinetics and some patients need higher occupancy for control. Cetirizine 10 mg QDS is the most commonly used escalation: generally well tolerated, non-sedating, and achieving near-complete H1 receptor occupancy. When prescribing above the licensed dose, document the indication and the evidence base, and tell the patient this is higher than the packaging states and why — “off-label” does not mean unsafe, it means the manufacturer has not submitted the higher dose for licensing, typically for commercial reasons."},
       {b:"say", html:"Hives are usually harmless and settle with a regular antihistamine — take it every day, not just when it flares, because that's how it controls it. If that isn't enough we can safely go up to four times the packet dose, and there's a very effective injection treatment via the specialist if we still need it. The one thing to act on immediately is swelling of the lips, tongue or throat with any breathing difficulty — that's a 999 situation."}
     ]},

    {id:"special", nav:"Special situations", title:"Physical urticaria, anaphylaxis aftercare and hereditary angioedema", sub:"Four situations with their own rules — including the one blood test that screens for HAE.",
     blocks:[
       {b:"table", head:["Situation","Management","Note"], rows:[
         ["<b>Dermographism</b>","Cetirizine 10 mg OD or BD is highly effective — the wheal response to minor trauma is histamine-mediated and completely blocked by H1 antihistamines in most patients","Does NOT require investigation in the absence of other features. Advise avoiding tight clothing and belts, and breaking the itch–scratch–wheal cycle"],
         ["<b>Cold urticaria</b>","Avoid cold-water immersion (risk of a systemic reaction including syncope and anaphylaxis). NEVER swim alone in cold water — anaphylactic syncope in water is fatal. Cetirizine BD or TDS","Ice-cube test: apply an ice cube in a bag to the forearm for 5 minutes, then observe for 10 minutes after removal — a wheal at the site is positive"],
         ["<b>Cholinergic urticaria</b>","Small (1–3 mm) itchy wheals on the trunk with exercise, a hot bath or emotional stress. Antihistamine taken 1 hour before exercise; adjust exercise intensity","Often confused with exercise-induced anaphylaxis — a different entity with larger wheals and systemic features"],
         ["<b>Post-anaphylaxis management</b>","Prescribe TWO adrenaline auto-injectors (EpiPen 300 mcg or Jext 300 mcg — the same drug, different devices). Train patient and family in technique. Written anaphylaxis action plan. Medic-alert bracelet. Urgent allergy clinic referral for trigger identification, skin-prick or RAST testing, and threshold testing if needed","<b>NEVER use an antihistamine as the first treatment for anaphylaxis</b>"],
         ["<b>Hereditary angioedema (HAE)</b>","C1-inhibitor deficiency (Type I: low level and activity; Type II: low activity, normal level), with a family history of angioedema. Check C3, C4, and C1-inhibitor level and function. Treatment: C1-inhibitor concentrate (Berinert, Ruconest) or icatibant (Firazyr) for acute attacks; prophylaxis with tranexamic acid or androgens (danazol)","C4 is persistently low in HAE — the best screening test. Specialist haematology or allergy management"]
       ]},
       {b:"why", html:"The C4 level as a screening test for hereditary angioedema is a practical point that can expedite diagnosis in primary care — C4 is chronically low in HAE Types I and II because unregulated complement activation from C1-inhibitor deficiency continuously consumes it. Unlike C3 (which may be normal or mildly reduced), C4 is persistently low even between attacks, so a normal C4 essentially excludes HAE Types I and II. Any patient with recurrent angioedema — especially facial or laryngeal, without urticarial wheals, with a family history of similar episodes — should have C4, C3 and C1-inhibitor level and function checked. The absence of urticarial wheals accompanying the angioedema is the key distinguishing feature from allergic angioedema, because HAE is bradykinin-mediated rather than histamine-mediated — which is also why HAE attacks are not relieved by antihistamines or steroids."}
     ]},

    {id:"lifestyle", nav:"Trigger avoidance", title:"Trigger avoidance and quality of life", sub:"Including the analgesia rule that patients most often get wrong, and the psychological burden that is routinely under-recognised.",
     blocks:[
       {b:"table", head:["Topic","What to advise","Why"], rows:[
         ["<b>🍽️ Food diary (IgE-mediated allergy)</b>","For suspected food-triggered urticaria: a detailed food diary for 2 weeks (time of reaction plus all foods eaten in the preceding 2 hours). Common culprits: peanuts, tree nuts, shellfish, fish, milk (especially children), eggs, wheat, sesame. Avoid suspected triggers while awaiting the allergy clinic","<b>NOT useful in CSU — the trigger there is internal, not dietary</b>"],
         ["<b>💊 NSAID and aspirin avoidance</b>","NSAIDs and aspirin cause urticaria in approximately 10–20% of CSU patients via cyclo-oxygenase inhibition (not IgE-mediated). ALL NSAIDs cross-react — switching to a different NSAID will not help. Safe analgesia: paracetamol (no significant COX-1 inhibition); selective COX-2 inhibitors (celecoxib) are lower risk but not zero","Ibuprofen is available over the counter and must be specifically named and avoided"],
         ["<b>🧠 Stress management</b>","Emotional stress significantly worsens CSU (sympathetic activation causing mast-cell degranulation). Regular exercise — adapted for cholinergic urticaria, starting slowly with a warm-up. Mindfulness, CBT. Sleep (inadequate sleep worsens mast-cell reactivity). Address psychosocial stressors at each chronic urticaria review","A modifiable amplifier, not a psychological dismissal"],
         ["<b>🍺 Alcohol</b>","Alcohol causes vasodilation and directly triggers mast-cell degranulation, worsening urticaria and lowering the reaction threshold. Patients with food or drug allergies should be especially cautious — alcohol potentiates IgE-mediated reactions by increasing gastrointestinal permeability to food antigens as well as its direct mast-cell effects. Reduce or avoid during flares","Often the unrecognised reason for a flare"],
         ["<b>🆔 MedicAlert and action plan</b>","<b>Any patient with a history of anaphylaxis: a MedicAlert bracelet documenting the allergy and the adrenaline auto-injector requirement; a written one-page anaphylaxis action plan (when and how to use the EpiPen, when to call 999, what to tell A&amp;E); two EpiPens carried at all times; a school or workplace anaphylaxis protocol for children</b","Turns knowledge into a usable emergency response"],
         ["<b>😔 Psychological impact</b>","<b>CSU significantly impairs quality of life — sleep disturbance from nocturnal itch, social embarrassment, activity restriction, and anxiety about unpredictable attacks. Use the Dermatology Life Quality Index (DLQI) at each review. NHS Talking Therapies referral if depression or an anxiety disorder develops. Urticaria Network (urticarianetwork.org) for patient support</b","Routinely under-recognised in a “benign” condition"],
         ["<b>🤰 Antihistamines in pregnancy</b>","<b>Loratadine is preferred in pregnancy (the most safety data). Cetirizine is also considered safe (extensive use data). Avoid chlorphenamine (sedating) and fexofenadine in the first trimester. All antihistamines are excreted in breast milk in small amounts — loratadine preferred if breastfeeding</b","A common and easily answered question"],
         ["<b>📅 Annual review for CSU</b>","<b>UAS7 score, current antihistamine dose, impact on sleep and daily activities, DLQI, whether a trigger has been identified, any new drug introduced, TFT if not already checked. Attempt step-down after 6 months of well-controlled disease</b","Prevents indefinite high-dose prescribing"]
       ]},
       {b:"why", html:"<b>The two-EpiPen prescription rule is a Resuscitation Council UK, BSACI and allergy-society recommendation — every patient with a history of anaphylaxis should be prescribed and carry two adrenaline auto-injectors at all times.</b> The reasons: the first device may misfire (failure rate approximately 5%); the first dose may be insufficient, particularly in large adults or severe reactions; and peak plasma adrenaline after IM injection is reached in about 8 minutes and begins to fall by 20 minutes — so in biphasic anaphylaxis (about 20% of cases, with a second wave 1–72 hours after the initial reaction) a second dose may be needed. GPs must not prescribe a single EpiPen — BSACI specifically identifies this as a prescribing-quality issue. Both auto-injectors should be the same device type (both EpiPen or both Jext — never mixed, as the activation mechanisms differ). A brief technique demonstration is insufficient: the patient AND their family or carers must practise with a trainer pen, available free from the manufacturer."}
     ]},

    {id:"monitor", nav:"Follow-up", title:"Follow-up and safety-netting", sub:"Review by type, and the biphasic-anaphylaxis rule every patient given adrenaline must hear.",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["<b>Acute urticaria</b>","Review at 6 weeks if not resolved — &gt;6 weeks defines it as CSU (≥6 weeks by some definitions)","Most acute urticaria self-resolves — no follow-up needed if improving. If a new drug was started within 6 weeks, consider a drug cause and stop the drug"],
         ["<b>CSU monitoring</b>","Monthly initially during antihistamine dose titration (with UAS7). Once stable on maximum antihistamine: 3-monthly","After 6 months of good control (UAS7 &lt;7), consider step-down to a lower dose. 50% of CSU remits spontaneously within 5 years"],
         ["<b>Post-anaphylaxis</b>","Allergy clinic within 4 weeks (investigate the cause, threshold testing, prescribe the auto-injector)","Confirm the patient carries two auto-injectors; document the anaphylaxis action plan in the record. DVLA: not notifiable unless there is an ongoing syncope risk"],
         ["<b>Urticarial vasculitis monitoring</b>","<b>Each review</b>","Urinalysis for haematuria and proteinuria (renal involvement), CRP/ESR, joint examination, complement levels — rheumatology or dermatology-led"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"📞 999", html:"Any throat tightening, stridor or voice change with urticaria (anaphylaxis or HAE) → adrenaline IM plus 999 · an HAE attack not responding to home treatment · biphasic anaphylaxis, with symptoms returning 1–24 hours after the initial reaction."},
         {tone:"amber", h:"🟠 Same-day or urgent", html:"New wheals persisting &gt;24 h in the same location (vasculitis) → dermatology · CSU worsening rapidly despite maximum antihistamine → step up or refer dermatology · ACE-inhibitor angioedema → stop it permanently, document the allergy, and consider emergency referral if there is any airway involvement."},
         {tone:"cream", h:"💬 What to say", html:"“Swelling of the tongue, throat or lips with difficulty breathing or swallowing, or feeling faint — call 999 and use your adrenaline pen if you have one.” “If you take a ‘-pril’ blood-pressure tablet and get facial or tongue swelling, stop it and contact us — it can cause this even years later.” “If individual spots last more than a day, hurt, or bruise, tell us — that needs different assessment.” “Take the antihistamine regularly, not just when it flares.”"}
       ]},
       {b:"why", html:"The biphasic anaphylaxis concept is important for patient safety counselling — approximately 20% of anaphylaxis cases have a biphasic reaction, with symptoms recurring 1–72 hours after the initial reaction (most commonly 6–12 hours) without re-exposure to the trigger. This is why all patients treated for anaphylaxis should be observed in hospital for a minimum of 6 hours, or 12 hours if severe. The counselling sentence to use: “The reaction can sometimes come back hours later. If you use your EpiPen and your symptoms improve, you still need to call 999 and go to hospital, because the reaction may return even after it appears to have settled.” Anaphylaxis treated with adrenaline in the community is ALWAYS followed by hospital observation — it is not safe to go home after using an auto-injector just because symptoms have improved."}
     ]},

    {id:"loop", nav:"Not controlled?", title:"Not controlled? Check before escalating", sub:"Confirm adequate antihistamine dosing and reconsider the diagnosis.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"1 · Dose", html:"<b>Regular (not PRN) and up-dosed to 4× licensed for chronic disease?</b>"},
         {tone:"amber", h:"2 · Triggers and drugs", html:"<b>NSAIDs, ACE inhibitor, alcohol and physical triggers removed?</b>"},
         {tone:"amber", h:"3 · Diagnosis", html:"Wheals over 24 hours, painful or bruising → urticarial vasculitis; angioedema without wheals → a bradykinin cause."},
         {tone:"amber", h:"4 · Adherence", html:"<b>Taken consistently? Many patients under-use antihistamines.</b>"},
         {tone:"amber", h:"5 · Refer", html:"<b>Refractory chronic urticaria → dermatology for omalizumab.</b>"}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways", sub:"Emergency for the airway; allergy clinic for anyone who has had throat swelling; dermatology for refractory chronic disease.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999", html:"Anaphylaxis (urticaria with throat or airway involvement and collapse) · an HAE upper-airway crisis · severe generalised urticaria not responding to adrenaline."},
         {tone:"amber", h:"Allergy clinic (urgent, within 4 weeks)", html:"Any urticaria with a history of throat swelling or anaphylaxis (auto-injector prescription plus allergy work-up) · suspected food allergy with IgE-mediated urticaria · drug allergy requiring confirmation (penicillin allergy re-testing) · physical urticaria with severe functional impact."},
         {tone:"blue", h:"Dermatology", html:"CSU not controlled on maximum-dose antihistamine (step up to omalizumab) · suspected urticarial vasculitis (skin biopsy plus systemic work-up) · chronic urticaria with diagnostic uncertainty."},
         {tone:"blue", h:"Rheumatology", html:"Urticarial vasculitis with systemic features (joint pain, proteinuria, positive ANA or ANCA) · possible SLE-associated urticarial vasculitis."},
         {tone:"plain", h:"Immunology / haematology", html:"Recurrent isolated angioedema without wheals → C1-esterase inhibitor deficiency or an ACE-inhibitor cause · confirmed HAE for C1-inhibitor concentrate and prophylaxis planning."},
         {tone:"green", h:"GP manages", html:"Acute urticaria: non-sedating antihistamine plus trigger identification and avoidance. CSU: non-sedating antihistamine with step-up. Dermographism: antihistamine. Physical urticaria: avoidance plus antihistamine."}
       ]},
       {b:"why", html:"Omalizumab (Xolair) is a transformative treatment for chronic spontaneous urticaria, NICE-approved under TA339 (2015), and one of the most significant advances in dermatology in the past decade — a humanised anti-IgE monoclonal antibody that binds free IgE and prevents it binding to IgE receptors on mast cells and basophils. In CSU it achieves complete symptom control (UAS7 = 0) in approximately 35–40% of patients and meaningful improvement in approximately 70%, given as 300 mg SC every 4 weeks. The NICE criteria: CSU inadequately controlled by high-dose non-sedating antihistamine (up to 4× standard dose) in adults and adolescents ≥12 years. A 6-month course is typical — responders can discontinue and re-introduce on relapse, and approximately 50% remain in remission after stopping. Dermatology initiates; GPs can administer the injections in shared care after specialist training."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 58-year-old woman describes four months of daily itchy hives and asks for “a stronger cream”. She has been taking cetirizine 10 mg “when they're bad”. She takes ramipril for blood pressure and has had two episodes of lip and tongue swelling without any hives, one needing A&amp;E. She also shows you a spot on her forearm she says has been there since Sunday and is now bruised."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Separates <b>three problems in one consultation</b>: recognises the isolated angioedema without wheals on an ACE inhibitor as bradykinin-mediated — stops ramipril <b>permanently</b>, records it as an absolute allergy, switches to an ARB and explains that <b>antihistamines and steroids do not work</b> for it; applies the <b>&gt;24 h-plus-bruising rule</b> to the forearm lesion and arranges biopsy plus ANA, complement, ANCA and hepatitis serology for urticarial vasculitis; and for the CSU itself corrects <b>PRN to regular dosing</b>, up-doses to <b>4× licensed with the off-label explanation documented</b>, checks <b>FBC, ESR/CRP, TFT and anti-TPO</b>, scores <b>UAS7</b>, and safety-nets <b>airway swelling as 999</b>. <a href='../../cases/urticaria.html'>Open the full casebook chapter →</a>"}
     ]}]},

  foot:"Primary-care assessment and management of acute and chronic urticaria \u2014 BSACI/EAACI urticaria guidelines, NICE TA339 (omalizumab), Resuscitation Council UK anaphylaxis guidance, and NICE NG12 (May 2025) for the lymphoma route. Assessment and management are merged on this page; the former algorithm is retired. Adrenaline comes before antihistamine in anaphylaxis, and antihistamines and steroids do not work in ACE-inhibitor or hereditary angioedema. Verify every dose against the current BNF before prescribing."
