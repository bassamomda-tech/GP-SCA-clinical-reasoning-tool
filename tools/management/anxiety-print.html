MG.render({
  icon:"\u{1F300}",

  stemSub:"One page for the whole condition. Consider physical, medication and substance causes guided by history and examination, use GAD-7 and PHQ-9 to measure (not diagnose), work out <em>which</em> anxiety disorder it is because that decides the therapy pathway, run disorder-specific stepped care with psychology first, start low where activation is likely, and judge response after an adequate, disorder-appropriate trial.",

  meta:[
    {t:"NICE CG113 \u00b7 GAD &amp; panic"},
    {t:"NG116 PTSD \u00b7 CG31 OCD"},
    {t:"NG23 menopause \u00b7 MHRA SSRI"},

  ],
  lead:'<div class="mg-layers"><a href="#severe"><b>Mimics &amp; risk</b><small>Mimics · risk</small></a><a href="#classify"><b>Which disorder?</b><small>It picks the therapy</small></a><a href="#ladder"><b>Drug treatment</b><small>Disorder-specific</small></a><a href="#refer"><b>Refer</b><small>The specialist tracks</small></a></div>',
  quickSub:"If you read nothing else on this page, read these six cards. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"\u26a0 Consider the physical and substance causes", html:"New, atypical, severe or unexplained anxiety warrants consideration of physical, medication, substance-related and psychiatric causes \u2014 <b>investigations guided by history and examination</b> (e.g. TSH for thyroid features, ECG for palpitations, syncope or chest symptoms). Assess chest pain on its own pathway (ACS, arrhythmia, PE) \u2014 not by age alone \u2014 and once appropriately assessed, do not keep labelling typical panic as cardiac."},
    {tone:"red", h:"Ask about suicide, every time", html:"Severe anxiety, especially with depression, raises suicide risk. Ask directly \u2014 then assess intent, plan, means, preparation, previous attempts, intoxication, psychosis and protective factors. <b>Screen for past mania/hypomania, psychosis, domestic abuse and safeguarding</b> before starting an antidepressant. Benzodiazepines disinhibit \u2014 assess risk before prescribing."},
    {tone:"amber", h:"Measure both \u2014 diagnose clinically", html:"GAD-7 (5\u20139 mild \u00b7 10\u201314 moderate \u00b7 15\u201321 severe) measures severity and monitors change \u2014 it is <b>not a diagnostic test or an automatic referral threshold</b>. GAD needs excessive, hard-to-control worry across several domains for at least 6 months, with distress or impairment. GAD-2 \u22653 is a case-finding prompt. Score PHQ-9 too \u2014 comorbid depression is common; <b>treat the primary disorder</b> (the more severe one, where treatment will most improve function) (NICE CG113)."},
    {tone:"blue", h:"Which disorder decides the therapy", html:"GAD, panic disorder, agoraphobia, social anxiety, health anxiety, OCD and PTSD each need a <em>different</em> psychological therapy. PTSD needs individual trauma-focused CBT (or EMDR) first-line (NG116). <b>OCD needs exposure and response prevention.</b> Health anxiety needs CBT targeting the reassurance cycle \u2014 investigate only when clinically indicated. Mislabelling everything \u201canxiety\u201d sends the patient to the wrong service."},
    {tone:"cream", h:"Start low \u2014 it stops people quitting", html:"Consider a <b>lower starting dose</b> (e.g. sertraline 25\u201350 mg) where early activation or panic is likely, then titrate per the SPC (sertraline for GAD may be off-label \u2014 document consent). SSRIs can transiently worsen jitteriness in weeks 1\u20132 \u2014 warn explicitly and review early. Benzodiazepines are not for routine GAD or panic treatment (NICE) \u2014 crisis-only, fixed quantity and end date."},
    {tone:"green", h:"Judge response by the disorder, not one clock", html:"Review every 2\u20134 weeks in the first 3 months (NICE CG113), then judge after an adequate trial at a therapeutic dose \u2014 12 weeks is particularly relevant to OCD and social anxiety, not a universal rule. <b>Premature switching is serial under-treatment.</b> Continue after response for the period recommended for the specific disorder, then taper slowly. Success is restored function, not zero worry."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step is where patients come to harm.",
  pathway:[
    {title:"Consider the mimics — by history", html:"Targeted tests: <b>TFTs</b> for thyroid features, an <b>ECG</b> for palpitations, syncope or chest symptoms; ask about <b>caffeine, alcohol, stimulants, cannabis and medicines</b>; consider pregnancy and menopause. Rare causes (phaeochromocytoma, epilepsy) only when the picture points there."},
    {title:"Assess risk", html:"Imminent risk, intent, a plan, inability to stay safe, severe self-neglect or psychosis \u2192 same-day urgent mental-health assessment (local GM crisis pathway). Screen for bipolarity, psychosis, domestic abuse and safeguarding. Severe functional impairment or self-neglect \u2192 urgent mental health. Ask about alcohol and substances as self-medication.", alert:true},
    {title:"Score and classify", html:"GAD-7 and PHQ-9 as measures. Then decide <b>which</b> anxiety disorder \u2014 with a trauma history ask directly about re-experiencing, avoidance, hyperarousal and dissociation (a tool such as PC-PTSD-5 is case-finding only)."},
    {title:"Stepped care \u2014 psychology first", html:"Education and active monitoring \u2192 low-intensity guided self-help or digital CBT \u2192 high-intensity CBT and/or an SSRI \u2192 specialist. <b>NHS Talking Therapies self-referral \u2014 give the link or number.</b>"},
    {title:"Start, review, continue", html:"Low start with explicit warning \u2192 <b>review within 1 week if under 30 or at increased risk (then weekly for the first month), otherwise 1\u20132 weeks</b> (CG113) \u2192 every 2\u20134 weeks for 3 months \u2192 judge after an adequate disorder-appropriate trial \u2192 continue per disorder \u2192 slow taper."}
  ],
  sections:[

    {id:"severe", nav:"Mimics &amp; red flags", title:"Organic mimics and psychiatric emergencies", sub:"Anxiety symptoms can occasionally be the presenting feature of medical pathology. Consider causes guided by history and examination — without over-investigating.",
     blocks:[
       {b:"warn", html:"New, atypical, severe or unexplained anxiety warrants consideration of physical, medication and substance causes. Assess chest symptoms on their own pathway — but once appropriately assessed, do not keep treating typical recurrent panic as cardiac disease."},
       {b:"cards", items:[
         {tone:"red", h:"Anxiety + palpitations + weight loss + heat intolerance + tremor", html:"<b>Hyperthyroidism (thyrotoxicosis) \u2014 TSH suppressed.</b> <b>Thyroid storm</b> (extreme anxiety, hyperpyrexia, tachycardia, altered consciousness) \u2192 <b>999</b>. Phaeochromocytoma is rare \u2014 consider only with episodic severe hypertension, headache and sweating (specialist-directed testing)."},
         {tone:"red", h:"Anxiety + chest tightness + palpitations, aged \u226540 or with cardiac risk factors", html:"<b>Cardiac arrhythmia (SVT, AF, VT) presenting as anxiety or panic.</b> Acute coronary syndrome. <b>PE</b> \u2014 anxiety with breathlessness, pleuritic pain and DVT risk. ECG where palpitations, syncope or chest symptoms; Wells score and D-dimer if PE is suspected."},
         {tone:"red", h:"Atypical first presentation", html:"Let the history guide: glucose if hypoglycaemic symptoms, thyroid features, arrhythmia, medication or substance effects, menopause. Rarer causes (phaeochromocytoma, carcinoid, temporal-lobe epilepsy) are clinically targeted, specialist diagnoses \u2014 not a routine GP panel."},
         {tone:"red", h:"Anxiety + suicidal ideation or self-harm", html:"<b>Severe anxiety is a significant independent risk factor for suicide</b>, and <b>comorbid anxiety with depression carries the highest risk</b>. Assess intent, plan, means, preparation, previous attempts, intoxication, psychosis and protective factors; <b>same-day urgent assessment for imminent risk, intent, a plan or inability to stay safe</b> (local GM crisis pathway). <b>Benzodiazepines disinhibit \u2014 assess risk before prescribing.</b>"},
         {tone:"amber", h:"Stimulants, caffeine, or substance withdrawal", html:"<b>Stimulant misuse (cocaine, amphetamines, MDMA)</b> causes acute anxiety and panic. Cannabis is bidirectional \u2014 it causes acute anxiety and panic AND is used to self-medicate anxiety. <b>Alcohol or benzodiazepine withdrawal:</b> severe anxiety, tremor, sweating \u2192 <b>seizure risk \u2192 medical management</b>. Ask about caffeine and energy drinks \u2014 reduce gradually if they worsen symptoms. Also salbutamol and steroids."},
         {tone:"amber", h:"Intrusive trauma memories + hypervigilance + avoidance", html:"<b>Consider PTSD, not GAD</b> \u2014 individual trauma-focused CBT (or EMDR) is first-line. Ask directly about re-experiencing, avoidance, hyperarousal, dissociation and impairment (PC-PTSD-5 is case-finding only \u2014 a negative screen does not exclude it). Refer to a trauma-specialist NHS Talking Therapies pathway, or CMHT if the trauma is complex."},
         {tone:"blue", h:"NG12 \u2014 no criterion applies", html:"Anxiety is not a NICE NG12 suspected-cancer criterion. But <b>anxiety about symptoms does not exempt those symptoms from assessment</b> \u2014 where the presentation includes unexplained weight loss, a lump, rectal bleeding or haemoptysis, follow the relevant NG12 route on its own merits. Health anxiety is a diagnosis of what the symptoms <em>are</em>, not a reason to skip the exclusion."}
       ]},
       {b:"why", html:"The overlap between anxiety symptoms and medical pathology is one of the most important diagnostic pitfalls in primary care. Hyperthyroidism is treatable and worth considering when thyroid features are present. Rare causes such as phaeochromocytoma are considered only when the clinical picture fits (episodic severe hypertension, headache, sweating), with specialist-directed testing."}
     ]},

    {id:"score", nav:"Scores", title:"GAD-7, GAD-2 and the PHQ-9 you must score alongside", sub:"Measurement and monitoring tools — not diagnostic tests or automatic escalation thresholds.",
     blocks:[
       {b:"dl", rows:[
         ["<b>GAD-2 gateway screen</b>","\u201cOver the past 2 weeks, how often have you been bothered by: (1) feeling nervous, anxious or on edge? (2) not being able to stop or control worrying?\u201d Scored 0\u20133 each. <b>GAD-2 \u22653 is a case-finding prompt</b> \u2014 a positive score needs clinical assessment; it does not establish GAD. Use it proactively in multimorbidity, diabetes and cardiovascular reviews"],
         ["<b>GAD-7</b>","7 items scored 0\u20133, total 0\u201321. <b>5\u20139 mild \u00b7 10\u201314 moderate \u00b7 15\u201321 severe.</b> Measures severity and monitors response \u2014 not a diagnosis or a referral threshold. Assess function clinically (work, social, daily life) rather than from one item. Record it at every contact"],
         ["<b>PHQ-9 co-scoring</b>","Comorbid depression is common and worsens prognosis. NICE CG113: treat the primary disorder \u2014 the more severe one, where treatment is most likely to improve overall function \u2014 then reassess the other. The treatment overlaps: SSRI plus CBT works for both"],
         ["Functional impairment","<b>Work</b> \u2014 absence, presenteeism, performance. <b>Relationships</b> \u2014 conflict, withdrawal, avoidance. <b>Social</b> \u2014 activities avoided, isolation. <b>Physical</b> \u2014 somatic symptoms (IBS, tension headache, chronic pain) driven by anxiety. Document it specifically: <b>\u201cWhat has anxiety stopped you doing that you want to do?\u201d</b>"]
       ]},
       {b:"why", html:"The GAD-7 was developed and validated by <b>Spitzer et al. (2006, Archives of Internal Medicine)</b> as a brief primary-care measure for GAD, \u2014 it supports measurement but not diagnosis or referral thresholds. Like the PHQ-9, its value is <b>serial measurement</b>."}
     ]},

    {id:"classify", nav:"Which disorder", title:"Which anxiety disorder is it? \u2014 because that picks the therapy", sub:"Each specific disorder has its own guideline — NICE CG113 (GAD and panic disorder), NICE CG159 (social anxiety disorder), NICE CG31 (OCD) and NICE NG116 (PTSD) — and the psychological therapy required is distinct. The diagnosis determines the referral pathway, not just the severity score.",
     blocks:[
       {b:"table", head:["Disorder","Features","Treatment"], rows:[
         ["<b>Generalised anxiety disorder</b>","Persistent, excessive, uncontrollable worry across multiple domains (work, health, family, finances) <b>most days for \u22656 months</b>, plus \u22653 of: restlessness, fatigue, poor concentration, irritability, muscle tension, sleep disturbance \u2014 with functional impairment. GAD-7 \u226510","Psychological therapy \u2014 CBT focusing on worry postponement, cognitive restructuring, and applied relaxation \u2014 \u00b1 SSRI. GAD is the default diagnosis: the specific disorders must be excluded first"],
         ["<b>Panic disorder</b>","Recurrent unexpected panic attacks \u2014 discrete episodes of intense fear <b>peaking within 10 minutes</b> (palpitations, sweating, tremor, breathlessness, chest tightness, depersonalisation, fear of dying or losing control) \u2014 plus persistent concern about further attacks and behavioural change. <b>A first panic attack always needs cardiac and organic exclusion</b>","<b>Panic-focused CBT with interoceptive exposure</b> (deliberately inducing feared bodily sensations to demonstrate they are harmless) and panic-cycle psychoeducation, \u00b1 SSRI. <b>NOT benzodiazepines</b>"],
         ["<b>Agoraphobia</b>","Anxiety and avoidance of situations where escape is difficult or help unavailable \u2014 public transport, open spaces, crowds, leaving home alone. Often secondary to panic disorder; causes profound disability","<b>CBT with graded exposure</b> + SSRI. <b>Home visits for the housebound.</b> Phobia-specific CBT is superior to generic anxiety management"],
         ["<b>Social anxiety disorder</b>","Marked fear of social situations involving scrutiny or embarrassment (public speaking, eating in public, meeting people); avoidance or endurance with intense distress, <b>\u22656 months</b>. Often misdiagnosed as shyness \u2014 the most underdiagnosed anxiety disorder","<b>Individual</b> disorder-specific CBT (Clark and Wells or Heimberg model) first \u2014 not group CBT in preference (NICE CG159); escitalopram or sertraline if medication is preferred or CBT declined"],
         ["<b>Health anxiety</b> (illness anxiety disorder)","Persistent preoccupation with having or developing serious illness <b>despite medical reassurance</b>; excessive health-seeking or health avoidance. Exacerbated by internet symptom-checking and repeated investigation. Investigation and reassurance give only transient relief and worsen the cycle","<b>CBT specifically for health anxiety.</b> Explain the reassurance cycle \u2014 but investigate when clinically indicated (health anxiety does not exclude physical disease)"],
         ["<b>OCD</b>","Recurrent intrusive obsessional thoughts (contamination, harm, symmetry, religious) plus compulsive rituals to reduce anxiety (washing, checking, ordering, counting, praying). <b>Ego-dystonic.</b> Diagnosis rests on distress, impairment, time consumed and interference — no fixed hours-per-day threshold","<b>CBT with exposure and response prevention (ERP)</b> \u2014 the patient is exposed to the feared stimulus and <em>prevented</em> from performing the compulsion \u2014 plus an SSRI at <b>higher doses than for depression (sertraline 200 mg, fluoxetine 60 mg)</b>"],
         ["<b>PTSD</b>","After traumatic events: re-experiencing (intrusive memories, nightmares, flashbacks), avoidance of reminders, negative cognitions and mood, hyperarousal (hypervigilance, exaggerated startle, sleep disturbance). <b>&gt;1 month</b> with functional impairment. <b>PC-PTSD-5</b> screen","Individual trauma-focused CBT first-line; EMDR an option by timing and trauma type (NICE NG116). Sertraline or venlafaxine if the person prefers drug treatment. Refer to a trauma-specialist track"]
       ]},
       {b:"warn", html:"Mislabelling everything \u201canxiety\u201d leads to the wrong therapy referral. NICE NG116 recommends individual trauma-focused CBT for PTSD or clinically important symptoms; non-trauma-focused CBT may help specific residual symptoms if someone cannot or will not engage in trauma-focused work."},
       {b:"why", html:"<b>Health anxiety is the counterintuitive one</b> \u2014 repeated investigation and reassurance not driven by clinical need tend to maintain it. And social anxiety is common yet often attributed to \u201cpersonality\u201d rather than recognised as treatable."}
     ]},

    {id:"workup", nav:"Investigations", title:"Investigations and organic exclusion", sub:"Targeted by history and examination — plus a social and substance history that changes management more than any blood test.",
     blocks:[
       {b:"dl", rows:[
         ["<b>Targeted, not mandatory</b>","Examination, medication and substance review, pregnancy consideration, then tests by symptoms: <b>TSH</b> for thyroid features \u00b7 <b>FBC</b> for anaemia \u00b7 <b>glucose</b> for hypoglycaemic symptoms \u00b7 <b>ECG</b> for palpitations, syncope, chest symptoms or relevant drug (QT) risk"],
         ["<b>Targeted by presentation</b>","Rare mimics (phaeochromocytoma, carcinoid, temporal-lobe epilepsy) only when the clinical picture strongly fits \u2014 specialist-directed. Alcohol or substance use \u2192 <b>GGT, MCV, LFTs</b>. Menopausal symptoms \u2192 FSH and oestradiol"],
         ["<b>Substance screen</b>","<b>AUDIT-C in all anxiety presentations</b> \u2014 alcohol and anxiety are bidirectionally linked. Cannabis assessment (self-medication is common; it worsens anxiety long-term). Stimulant screen if episodic severe anxiety. Caffeine and energy-drink history \u2014 where they worsen symptoms, advise gradual reduction (abrupt cessation causes withdrawal headache)"],
         ["<b>Social history and life events</b>","Recent stressors (bereavement, relationship breakdown, redundancy, debt, housing insecurity); childhood adversity \u2014 ACEs show a dose-response relationship with anxiety disorder risk; domestic situation; caring responsibilities; work environment (occupational stress, harassment, burnout); and sleep quality, assessed independently \u2014 poor sleep is both cause and consequence"]
       ]},
       {b:"why", html:"The ECG before an SSRI in a patient with palpitations does two jobs: it excludes arrhythmia as the organic cause, and it gives a baseline QTc before citalopram or escitalopram, which cause dose-dependent QTc prolongation. <b>WPW syndrome</b> (short PR with a delta wave) causes paroxysmal SVT presenting in young adults as sudden palpitations, anxiety and near-syncope \u2014 potentially life-threatening, entirely manageable with ablation, and should never be managed with anxiolytics. "}
     ]},

    {id:"stepped", nav:"Stepped care", title:"Stepped care \u2014 psychology before pills", sub:"An antidepressant is a Step 3 intervention. The aim is neither to medicalise mild anxiety nor to under-treat severe anxiety.",
     blocks:[
       {b:"p", html:"<b>Steps 1\u20132 come first</b> \u2014 medication is offered when low-intensity work fails or symptoms are marked, and ideally <em>alongside</em> psychology rather than instead of it."},
       {b:"cards", items:[
         {tone:"blue", h:"Step 1 \u00b7 Education and active monitoring", html:"Explain anxiety, the worry cycle, and that <b>anxiety is not dangerous</b>. Appropriate for subthreshold or mild symptoms without significant impairment \u2014 many improve with this plus review. <b>Don\u2019t medicalise mild, recent worry.</b>"},
         {tone:"blue", h:"Step 2 \u00b7 Low intensity", html:"Individual guided self-help (CBT-based), psychoeducational groups, computerised CBT \u2014 <b>SilverCloud, Every Mind Matters</b>, books on prescription. NHS Talking Therapies self-referral \u2014 give the link or number."},
         {tone:"cream", h:"Step 3 \u00b7 High intensity", html:"Marked symptoms or impairment (by clinical assessment, not score alone). <b>Individual CBT</b> or applied relaxation, or an SSRI, by preference. Panic-focused CBT for panic disorder; individual disorder-specific CBT for social anxiety."},
         {tone:"amber", h:"Step 4 \u00b7 Specialist", html:"Significant impairment not responding, refractory or complex presentations, or high risk \u2192 CMHT and complex psychological therapy or medication combinations."},
         {tone:"green", h:"\ud83c\udfc3 Exercise", html:"Helpful in mild\u2013moderate anxiety. Be specific \u2014 \u201c30 minutes brisk walking 5\u00d7/week\u201d beats \u201cexercise more\u201d."},
         {tone:"green", h:"\ud83e\udee8 Breathing retraining", html:"Anxiety-driven <b>hyperventilation lowers CO\u2082</b>, producing dizziness, tingling and palpitations that are misinterpreted as dangerous \u2014 perpetuating panic. Diaphragmatic breathing: 4 seconds in through the nose, 6 out through pursed lips; practise 10 minutes daily to build the skill <em>before</em> needing it. <b>Box breathing (4-4-4-4).</b> <b>Teach it in the consultation \u2014 demonstrate and watch them do it.</b>"},
         {tone:"amber", h:"\u2615 Caffeine and alcohol", html:"Caffeine and energy drinks can worsen anxiety and panic \u2014 reduce gradually where they clearly aggravate symptoms (no rigid universal threshold). Alcohol\u2019s short-term anxiolytic effect masks the fact that it markedly worsens anxiety next day via rebound sympathetic activation. AUDIT-C. Alcohol dependence needs specialist management before anxiety treatment can work."},
         {tone:"amber", h:"\ud83d\ude34 Sleep", html:"Sleep deprivation dramatically worsens anxiety \u2014 the prefrontal cortex is highly sleep-sensitive. Sleep hygiene, and referral to CBT-I or digital CBT-I where appropriate (sleep restriction is a specific CBT-I technique, not a simple GP instruction)."},
         {tone:"green", h:"\ud83e\uddd8 Mindfulness", html:"Mindfulness (e.g. 8-week MBSR) teaches decentred observation of anxious thoughts rather than engagement or suppression. Apps (Headspace, Calm, Insight Timer) are reasonable Step 1 interventions but <b>do not replace CBT for moderate\u2013severe anxiety</b>."},
         {tone:"green", h:"\ud83d\udcdd Worry postponement \u2014 teachable in 10 minutes", html:"A core CBT-for-GAD technique deliverable in primary care: designate a specific 20-minute \u201cworry time\u201d each day (not in the evening). Outside it, note intruding worries briefly and postpone them. Many worries resolve before worry time arrives, breaking the constant-vigilance cycle."},
         {tone:"cream", h:"\ud83e\udd1d Social connection and social prescribing", html:"Isolation is both cause and consequence \u2014 avoidance maintains anxiety. Prescribe gradual re-engagement: one social contact per week to start, not a group \u2014 too threatening initially. Where anxiety is driven by <b>debt, housing or loneliness</b>, refer to the PCN social prescribing link worker and Citizens Advice \u2014 they address root causes treatment cannot."}
       ]},
       {b:"kv", rows:[
         ["Named resources \u2014 prescribe specifically, don\u2019t say \u201clook online\u201d","<b>SilverCloud</b> (online CBT via NHS Talking Therapies self-referral) \u00b7 <b>Every Mind Matters</b> \u00b7 <b>No Panic helpline 0300 772 9844</b> (panic and OCD) \u00b7 <b>Anxiety UK 0344 477 5774</b> \u00b7 <b>Samaritans 116 123</b> \u00b7 Mind and Rethink (peer support) \u00b7 No More Panic \u00b7 OCD UK and OCD Action. Write the name and access route on a printed sheet given at the consultation"]
       ]},
       {b:"why", html:"Worry postponement is one of the most evidence-based and most under-used brief interventions in primary care. It is a secondary technique from CBT, not a substitute for NICE disorder-specific therapy. The key stepped-care principle is <b>not to start at Step 3 for someone who could be managed at Step 2</b> \u2014 but equally, patients with moderate\u2013severe anxiety who clearly will not benefit from self-help should go straight to Step 3."}
     ]},

    {id:"ladder", nav:"Medication", title:"Drug treatment \u2014 sertraline first, start low, judge at 12 weeks", sub:"Medication is disorder-specific and usually follows, or accompanies, the recommended psychological treatment — GAD: CBT/applied relaxation or an SSRI at step 3 · panic: panic-focused CBT, SSRI where appropriate · social anxiety: individual CBT first · OCD: CBT with ERP ± SSRI · PTSD: trauma-focused CBT or EMDR first. No benzodiazepines for routine treatment.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1st", title:"An SSRI \u2014 sertraline is the cost-effective GAD option", when:"Step 3, if medication is chosen", html:"Sertraline (NICE CG113: cost-effective for GAD; <b>may be off-label for GAD \u2014 check the SPC and document consent</b>). Consider a lower start (e.g. 25\u201350 mg) if activation, panic, frailty or prior intolerance, then titrate per the SPC. Use an SSRI licensed for the indication where possible. Warn explicitly that it may increase anxiety and agitation in the first 1\u20132 weeks \u2014 common, transient; reassure and persist, reducing the dose temporarily if severe. Take with food. Escitalopram is an alternative. Paroxetine: licensing varies by indication, and its discontinuation, sexual and pregnancy considerations need explicit discussion."},
         {step:"2nd", title:"Alternative SSRI, then an SNRI", when:"sertraline not tolerated or ineffective",
          fromLabel:"after an adequate dose and time",
          html:"Another SSRI (<b>escitalopram 5\u201310\u201320 mg</b>). Then an SNRI: <b>venlafaxine MR 75\u2013225 mg OD</b> (titrate to 150 mg after 2 weeks if tolerated; <b>monitor BP \u2014 the noradrenergic effect raises it</b>; significant discontinuation syndrome, taper slowly), or <b>duloxetine 30\u201360 mg OD</b> \u2014 useful with comorbid pain or depression. <b>Each needs an adequate trial before moving on.</b>"},
         {step:"3rd", title:"Pregabalin \u2014 effective, but with real caution", when:"SSRI and SNRI failed or not tolerated",
          fromLabel:"third-line",
          html:"Pregabalin \u2014 licensed for GAD; NICE: consider when SSRIs/SNRIs are unsuitable or not tolerated. Class C (Schedule 3) controlled drug: risk-assess substance use, diversion, concurrent opioids, alcohol, benzodiazepines and other CNS depressants, respiratory or neurological disease, renal function (dose adjustment), age over 65 and pregnancy \u2014 MHRA respiratory-depression and misuse warnings. Dose per SPC. Never stop abruptly. <b>Not recommended for panic disorder or PTSD.</b>"},
         {step:"Adjunct", title:"Not routine NICE pathway options", when:"selected cases only", fromLabel:"check SPC and formulary", html:"<b>Propranolol</b> is not a NICE treatment for GAD, panic or PTSD \u2014 at most for selected performance-related autonomic symptoms after checking asthma/COPD, bradycardia, hypotension, heart block, diabetes and PVD; it does not treat worry or panic. <b>Hydroxyzine and buspirone</b> are outside the CG113 pathway \u2014 specialist or off-label only, per local formulary (hydroxyzine: sedation, QT prolongation)."},
         {step:"Judge", title:"An adequate, disorder-appropriate trial", when:"assessing response", fromLabel:"not one universal clock", html:"Review every 2\u20134 weeks for the first 3 months (CG113), then judge after an adequate trial at a therapeutic dose \u2014 12 weeks is particularly relevant in OCD and social anxiety. Before switching: adherence, dose and duration, diagnosis, bipolarity, substances, and whether the psychological pathway was accessed. Judge by symptoms and function, not GAD-7 alone."},
         {step:"Last", title:"Benzodiazepines \u2014 last resort, time-limited", when:"crisis only",
          fromLabel:"never long-term",
          html:"Not for routine GAD or panic (NICE). Crisis-only, lowest effective dose, fixed quantity and end date, usually no longer than 2\u20134 weeks; assess falls, driving, alcohol, opioids, respiratory disease and dependence risk. <b>Not for PTSD.</b> They block the habituation and exposure learning that recovery requires."}
       ]},
       {b:"table", head:["Side effect / issue","Detail","Fix"], rows:[
         ["<b>Early jitteriness or worse anxiety</b>","SSRIs, first 1\u20132 weeks \u2014 the commonest reason anxious patients quit","<b>Low start, pre-warn, review early</b>"],
         ["<b>Activation syndrome</b>","Under 30s, first weeks \u2014 agitation, impulsivity, energy before the anxiolytic effect","Warn about increased suicidal thinking; review within 1 week and weekly for the first month (CG113); urgent review or crisis team if ideation emerges"],
         ["Sexual dysfunction","SSRIs and SNRIs \u2014 common","Ask actively \u2014 patients rarely volunteer it; dose-reduce or switch"],
         ["Discontinuation syndrome","Paroxetine and venlafaxine worst","<b>Taper slowly and proportionately</b>; warn never to stop abruptly"],
         ["Hyponatraemia","Older age, previous hyponatraemia, low weight, diuretics, other SIADH drugs","Sodium in those at risk; urgent review for confusion, headache, nausea, seizures or worsening fatigue"],
         ["Bleeding risk","SSRI with an NSAID or anticoagulant","Assess individual GI risk and gastroprotection indication — not a routine PPI; consider alternatives"]
       ]},
       {b:"why", html:"The transient worsening of anxiety in the first 1\u20132 weeks is a real pharmacological effect, caused by acute stimulation of anxiogenic 5-HT2C receptors before the anxiolytic down-regulation of 5-HT1A receptors has occurred. Patients who are not warned frequently stop within the first week, concluding it is making them worse. A brief explanation at prescription \u2014 \u201cyou may feel slightly more anxious or jittery for the first 1\u20132 weeks; this is common and temporary, and it will start to help from week 2\u20134\u201d \u2014 dramatically improves adherence. Pregabalin\u2019s 2019 scheduling as a Class C controlled drug followed evidence of significant misuse, particularly in opioid use disorder."}
     ]},

    {id:"specific", nav:"Duration &amp; specifics", title:"Treatment duration, and the disorder-specific rules", sub:"Premature discontinuation is the commonest cause of relapse — counsel every patient at initiation.",
     blocks:[
       {b:"dl", rows:[
         ["<b>Duration</b>","Continue for the period recommended for the specific disorder, with relapse-prevention planning, then taper slowly — e.g. GAD and panic after remission; social anxiety and OCD longer per CG159/CG31. <b>PTSD:</b> duration individualised with regular review (NG116 sets no universal minimum)"],
         ["<b>Panic disorder \u2014 the acute attack</b>","<b>Controlled breathing: the 4-7-8 technique</b> (inhale 4 seconds, hold 7, exhale 8) breaks the hyperventilation cycle. Diaphragmatic breathing. <b>Grounding: 5-4-3-2-1 senses.</b> Cold water on the face activates the dive reflex, slowing the heart via vagal tone. A panic diary to identify triggers. Interoceptive exposure is delivered in CBT. Once serious causes have been assessed and the episode matches the patient's established panic disorder, use the agreed panic plan and avoid unnecessary reassurance-seeking \u2014 <b>new, atypical or changing chest symptoms still need urgent assessment</b>"],
         ["<b>OCD \u2014 higher doses</b>","OCD needs higher SSRI doses than depression: sertraline up to 200 mg/day, fluoxetine up to 60 mg/day, fluvoxamine 300 mg/day (licensed for OCD). <b>Minimum 12-week trial before concluding it is ineffective.</b> Inadequate response to appropriate SSRI and ERP trials \u2192 multidisciplinary/specialist review (augmentation is specialist-led). ERP is essential \u2014 an SSRI alone is less effective than SSRI plus ERP"],
         ["<b>Health anxiety \u2014 avoid the reassurance trap</b>","Reassurance-seeking is the compulsion of health anxiety \u2014 repeated reassurance maintains the disorder. Instead: acknowledge the distress without confirming the feared illness, explain the reassurance cycle, and redirect to psychological treatment. Agree that investigations will be performed only where there is a clinical indication \u2014 not in response to anxiety \u2014 and document that rationale clearly"],
         ["<b>Anxiety in the menopause</b>","New-onset anxiety in a woman in her 40s\u201350s with menstrual irregularity, flushes or sleep disturbance should prompt a menopause assessment: NICE NG23 (updated April 2026) advises considering HRT for low mood that arises with the menopause, and CBT for low mood or anxiety linked to it. NG23 notes there is no clear evidence for SSRIs or SNRIs easing low mood in menopausal women who have not been diagnosed with depression, and does not routinely recommend them first-line for vasomotor symptoms alone. A diagnosed anxiety disorder is still treated on its own pathway"]
       ]},
       {b:"why", html:"OCD often needs higher SSRI doses than depression, so a low dose with no response may be under-dosing rather than failure. And for established panic disorder, explaining the panic cycle and teaching controlled breathing offers what repeated investigation cannot \u2014 while new or changing symptoms are still assessed."}
     ]},

    {id:"monitor", nav:"Follow-up", title:"Follow-up, monitoring and safety-netting", sub:"The early review is a patient-safety requirement, not a courtesy.",
     blocks:[
       {b:"table", head:["When","What","Action"], rows:[
         ["<b>Within 1 week if under 30 or higher risk (then weekly for a month); otherwise 1\u20132 weeks</b>","Tolerability and risk","Nausea, agitation, insomnia, increased anxiety (common, transient), activation syndrome \u2014 watch for suicidal ideation in the first 2 weeks. Intolerable early effects \u2192 reduce to 25 mg for 2 more weeks then retry 50 mg. Worsening suicidal ideation \u2192 review urgently or contact the crisis team. Catch the early-jitteriness quit point and reassure that it passes"],
         ["<b>4\u20136 weeks</b>","GAD-7 and PHQ-9 repeat","Assess symptoms and function (GAD-7 supports, not decides). Inadequate response \u2192 check adherence and dose, then optimise. Check the therapy referral was made, accepted, and what the waiting time is \u2014 if waiting &gt;6 weeks with moderate\u2013severe anxiety, escalate the SSRI dose rather than waiting. Review lifestyle progress: was the caffeine reduction achieved?"],
         ["<b>About 3 months</b>","Adequate response by symptoms and function?","<b>Yes \u2192 agree the disorder-specific continuation plan.</b> <b>No \u2192 review the diagnosis first</b> (was this PTSD, OCD or health anxiety needing a specific pathway?), confirm adequate dose and duration, confirm therapy engagement, then consider venlafaxine. Functional review: are work, relationships and activities improving alongside the scores?"],
         ["Discontinuation","Taper","<b>Taper SSRIs over at least 4\u20138 weeks, longer if taken over a year</b>, with smaller steps at the end. Pregabalin: never stop abruptly \u2014 withdrawal seizure risk; taper 25\u201350 mg/week. Benzodiazepine dependence: individualised taper per local/UK withdrawal guidance (diazepam substitution is not right for everyone \u2014 liver disease, older age, respiratory disease, polypharmacy); involve the community drug and alcohol team. Distinguish withdrawal (days, physical) from relapse (weeks, the worry returns)"],
         ["Long term","Annual review","GAD-7 and PHQ-9 with the trend documented. Anxiety disorders are episodic \u2014 relapse is common and does not represent failure. Re-refer promptly on relapse (waiting lists exist). <b>MBCT for recurrent anxiety.</b> Help the patient recognise their own relapse signature. Re-screen for depression, alcohol self-medication, and whether the therapy actually happened"]
       ]},
       {b:"cards", items:[
         
       ]},
       {b:"cards", items:[
         {tone:"red", h:"\ud83d\udd34 Crisis \u2014 save these now", html:"\u201cIf you ever feel unsafe or have thoughts of harming yourself \u2014 <b>999 or A&amp;E, NHS 111 option 2, Samaritans 116 123</b>.\u201d Same-day: active suicidal ideation at any follow-up; activation syndrome with suicidal ideation in the first 2 weeks; benzodiazepine or alcohol withdrawal seizure risk (tremor, sweating, confusion) \u2192 hospital assessment."},
         {tone:"amber", h:"\u26a0\ufe0f The first fortnight", html:"\u201cIf you feel more anxious or agitated, or get new dark thoughts, in the first couple of weeks \u2014 contact us the same day. It is a known early effect and we act on it.\u201d"},
         {tone:"amber", h:"\ud83d\udc8a Don\u2019t stop dead", html:"\u201cThese aren\u2019t addictive, but stopping suddenly can make you feel dizzy and unwell \u2014 we always reduce them slowly together.\u201d"},
         {tone:"amber", h:"\ud83d\udd34 Urgent, same week", html:"Significantly increased anxiety on a new SSRI not settling after 2 weeks; new panic attacks in someone previously stable; <b>unexpected pregabalin dose-escalation request (misuse risk)</b>; new PTSD symptoms emerging during generic anxiety treatment."},
         {tone:"green", h:"\u2615 Self-help starts working first", html:"\u201cCutting caffeine and alcohol, and the breathing techniques, start working before any tablet does.\u201d"}
       ]},
       {b:"say", html:"Two things to expect. First, this type of tablet can make you feel a bit MORE wired for the first week or two \u2014 that\u2019s temporary and actually a sign it\u2019s active; ring me rather than stopping it. Second, it works slowly for anxiety \u2014 we review regularly and judge it properly after a fair trial, not at three weeks. And the talking therapy does at least as much of the work, so let\u2019s get that going alongside."},
       {b:"why", html:"The 2-week review carries the same patient-safety imperative as in depression \u2014 the MHRA warning about increased suicidal ideation early in SSRI treatment applies equally to anxiety disorders, and anxiety patients have an independently elevated suicide risk. A 2-week review (a phone call is acceptable) is the minimum standard and should be documented. Benzodiazepine dependence is a major iatrogenic problem. Withdrawal is individualised per local/UK guidance (the Ashton manual is a resource, not a national standard); do not attempt rapid withdrawal in the community without specialist support, because of seizure risk."}
     ]},

    {id:"loop", nav:"Not responding?", title:"Not responding? Run this before switching or referring", sub:"",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"1 · Adequate trial?", html:"Right dose, actually taken, for an adequate disorder-appropriate duration?"},
         {tone:"amber", h:"2 · The mimics", html:"Thyroid re-checked? Caffeine/energy drinks, alcohol, stimulants, cannabis withdrawal honestly quantified?"},
         {tone:"blue", h:"3 · Right diagnosis?", html:"Panic disorder, PTSD, OCD, social anxiety, health anxiety — different therapy pathways. Bipolar (anxiety can herald a mixed state)?"},
         {tone:"blue", h:"4 · Comorbid depression", html:"Untreated depression under the anxiety → treat it; drives non-response."},
         {tone:"blue", h:"5 · Therapy on board?", html:"CBT actually accessed, or drug alone? Combination beats either."},
         {tone:"blue", h:"6 · Self-medication", html:"Alcohol or benzodiazepines masking and worsening it — address before escalating."}
       ]},
       {b:"cards", items:[
         {tone:"green", h:"All six confirmed?", html:"Then switch or refer \u2014 most \u201ctreatment-resistant\u201d anxiety fails one of the six rather than needing a third agent."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer \u2014 and specify the track", sub:"Naming the suspected disorder on the referral is the clinical action that gets the right therapy delivered.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same-day / 999", html:"<b>Active suicidal ideation with a plan \u2192 crisis team or 999.</b> Severe self-neglect. <b>Thyroid storm</b> (hyperpyrexia, tachycardia, anxiety, altered consciousness) \u2192 999. Suspected phaeochromocytoma crisis (BP &gt;200/120 with headache, sweating and severe anxiety) \u2192 999. Panic attack with chest pain and ECG changes \u2192 999."},
         {tone:"blue", h:"NHS Talking Therapies \u2014 mild to moderate", html:"<b>Mild to moderate by clinical assessment: self-refer or GP refer.</b> Step 2 psychoeducation, guided self-help, computerised CBT. Step 3 individual CBT 12\u201316 sessions or group CBT. <b>Self-referral is available online in most areas \u2014 give the link.</b>"},
         {tone:"amber", h:"NHS Talking Therapies \u2014 specialist tracks", html:"PTSD \u2192 trauma-specialist track (TF-CBT or EMDR) \u2014 specify trauma on the referral and do NOT use the generic anxiety pathway. <b>OCD \u2192 OCD-specialist track</b>, or OCD UK / OCD Action. Health anxiety \u2192 specific health-anxiety CBT track, not generic CBT. <b>Social anxiety \u2192 individual disorder-specific CBT.</b>"},
         {tone:"amber", h:"CMHT / psychiatry \u2014 Step 4", html:"Severe anxiety with significant impairment not responding to therapy plus an SSRI; psychosis or mania; significant substance misuse; <b>complex PTSD</b> (chronic trauma, borderline personality comorbidity, dissociation); <b>severe OCD</b>; comorbid psychosis; high suicide risk needing intensive support; treatment-resistant anxiety \u2014 two adequate SSRI trials failed with CBT completed."},
         {tone:"blue", h:"Endocrinology / cardiology", html:"<b>Confirmed hyperthyroidism \u2192 endocrinology</b> (carbimazole, radioiodine). <b>Elevated metanephrines \u2192 endocrinology urgently.</b> <b>WPW on ECG \u2192 cardiology for electrophysiology and ablation.</b> Arrhythmia \u2192 cardiology. Carcinoid \u2192 gastroenterology or oncology."},
         {tone:"blue", h:"Perinatal", html:"Moderate or worse anxiety in pregnancy or the postnatal period \u2192 perinatal mental health team, with a low threshold."},
         {tone:"cream", h:"Social prescribing", html:"Where anxiety is driven by social determinants \u2014 <b>debt, housing, isolation, loneliness</b> \u2014 refer to the PCN social prescribing link worker, plus Citizens Advice for financial anxiety and Mind or Rethink for peer support. <b>Peer contact specifically reduces shame.</b>"}
       ]},
       {b:"say", html:"You\u2019ve given a fair trial to the treatment and you\u2019re still struggling more than you should \u2014 that\u2019s a reason to bring in the specialist team for the therapies and options they can add, not a sign you\u2019ve failed. We keep going here alongside them."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only \u2014 the Casebook keeps the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 47-year-old woman with six months of worry, palpitations and poor sleep. GAD-7 16, PHQ-9 11. She drinks four coffees and two energy drinks daily, her periods have become irregular, and she has had two normal ECGs at A&amp;E for \u201cheart racing\u201d. She wants \u201csomething to calm me down\u201d."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Checks <b>TFTs</b> (palpitations, perimenopause) and asks about the <b>caffeine load</b> before labelling; recognises the perimenopausal pattern and discusses HRT and CBT for the menopausal contribution (NICE NG23) alongside treating the anxiety disorder itself; measures <b>both GAD-7 and PHQ-9</b>, treats the primary disorder, and screens for past mania; <b>asks directly about self-harm</b>; explains why repeat A&amp;E attendance reinforces the fear; declines a benzodiazepine with a reason rather than a refusal; offers <b>NHS Talking Therapies self-referral</b>; and if starting sertraline, starts low with the early-jitteriness warning, off-label consent for GAD, and a 1\u20132 week review. <a href='../../cases/anxiety.html'>Open the full casebook chapter \u2192</a>"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>NICE CG113 \u2014 Generalised anxiety disorder and panic disorder in adults (2011, updated 2019)<br><a href="https://www.nice.org.uk/guidance/cg113" rel="noopener">nice.org.uk/guidance/cg113</a><span class="rd"> \u2014 the stepped-care model, psychological therapy before medication, sertraline as first-line, pregabalin as an option, the recommendation to record GAD-7 at every contact, and the advice against benzodiazepines beyond short-term use. <b>Note on guideline numbering:</b> the legacy pathway cited stepped care as \u201cNG197\u201d; the current anxiety guidance is <b>NICE CG113</b>, which is what this page follows</span></li>'+
         '<li><b>NICE NG116 \u2014 Post-traumatic stress disorder (2018)</b><br><a href="https://www.nice.org.uk/guidance/ng116" rel="noopener">nice.org.uk/guidance/ng116</a><span class="rd"> \u2014 trauma-focused CBT or EMDR as first-line for all PTSD, with drug treatment second-line; minimum 12 months of pharmacological treatment where used</span></li>'+
         '<li>NICE CG31 \u2014 Obsessive-compulsive disorder and body dysmorphic disorder (2005)<span class="rd"> \u2014 exposure and response prevention, and the higher SSRI doses required in OCD</span></li>'+
         '<li><b>NICE NG23 \u2014 Menopause: identification and management (2015, updated April 2026)</b><span class="rd"> \u2014 HRT and CBT for menopausal mood and anxiety symptoms</span></li>'+
         '<li>MHRA \u2014 SSRI safety guidance (2004, updated 2014); MHRA pregabalin and gabapentin advice<span class="rd"> \u2014 suicidal ideation early in treatment particularly under 30; the 2019 reclassification of pregabalin as a Class C controlled drug, and respiratory depression with opioids</span></li>'+
         '<li><b>Spitzer et al., Archives of Internal Medicine 2006</b><span class="rd"> \u2014 development and validation of the GAD-7, and the \u226510 cut-off with 89% sensitivity and 82% specificity</span></li>'+
         '<li>Cipriani et al., Lancet 2018; Bandelow et al., Dialogues in Clinical Neuroscience 2017<span class="rd"> \u2014 comparative antidepressant efficacy, and anxiety-disorder pharmacotherapy</span></li>'+
         '<li><b>Ashton benzodiazepine withdrawal manual (Newcastle University)</b><span class="rd"> \u2014 the diazepam-substitution taper, endorsed for structured benzodiazepine withdrawal</span></li>'+
         '<li><b>Borkovec et al. \u2014 worry postponement; Kabat-Zinn \u2014 MBSR</b><span class="rd"> \u2014 the two brief non-drug techniques with the best primary-care evidence</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> \u2014 all doses: sertraline, escitalopram, venlafaxine, duloxetine, pregabalin, propranolol, hydroxyzine, buspirone, clomipramine, and the benzodiazepines</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Anxiety disorders in adults \u2014 NICE CG113 (GAD and panic disorder), NG116 (PTSD), CG31 (OCD) and NG23 (menopause), with MHRA SSRI and pregabalin safety guidance. Assessment and management are merged on this page; there is no separate anxiety pathway to cross-check. Verify all doses against the current BNF before prescribing, and check your local NHS Talking Therapies pathways and self-referral routes."
