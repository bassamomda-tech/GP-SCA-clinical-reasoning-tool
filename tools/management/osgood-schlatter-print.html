  stemSub:"For adolescents with activity-related pain at the tibial tubercle. Osgood-Schlatter is a traction apophysitis, diagnosed clinically when the presentation is typical and the examination is reassuring. Manage with symptom-guided activity modification, rehabilitation and short-term analgesia. Adapted from Royal Children\u2019s Hospital Melbourne guidance; <b>local paediatric, radiology and urgent referral pathways take precedence</b>.",
