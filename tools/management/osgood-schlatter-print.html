<script>
MG.render({
  icon:"🦵",
  title:"Osgood-Schlatter Disease",
  eyebrow:"Protocol · adolescents · suspected Osgood-Schlatter",
  reviewed:"24 September 2026",
  nextReview:"24 September 2027",
  stemTitle:"Suspected Osgood-Schlatter disease in primary care \u2014 a clinical diagnosis once the red flags and the hip have been checked",
  stemSub:"For adolescents with activity-related pain at the tibial tubercle. Osgood-Schlatter is a traction apophysitis, diagnosed clinically when the presentation is typical and the examination is reassuring. Manage with symptom-guided activity modification, rehabilitation and short-term analgesia. This is a clinical guide for typical presentations; it does not replace local pathways or urgent paediatric/orthopaedic advice. Adapted from Royal Children\u2019s Hospital Melbourne guidance. <b>Follow the current Bolton and Greater Manchester paediatric MSK/orthopaedic referral pathways. Local urgent-care and paediatric advice services take precedence over this educational protocol.</b>",
  guideline:"RCH Melbourne clinical guideline (adapted) \u00b7 Victorian paediatric knee referral criteria \u00b7 NICE NG12 (suspected cancer) \u00b7 SPS NSAID safety advice",
  glance:[
    {lbl:"Who", val:"Active adolescents", sub:"growth spurt; running, jumping, kicking"},
    {lbl:"Hallmark", val:"Tender tibial tubercle", sub:"pain on resisted extension; prominence alone is not diagnostic"},
    {lbl:"Diagnosis", val:"Clinical", sub:"no routine imaging if typical"},
    {lbl:"1st-line", val:"Activity modification", sub:"symptom-guided, not total rest"},
    {lbl:"Always check", val:"The hip", sub:"SUFE / Perthes refer to the knee"},
    {lbl:"Red flag", val:"Night/rest pain, limp, systemic", sub:"= not typical OSD"}
  ],
  flow:[
    {t:"node", d:"found", n:"1", tag:"Foundation", title:"Assess and diagnose clinically",
      blocks:[
        {b:"kv", rows:[
          ["Typical","OSD is most likely when an otherwise well adolescent (commonly 10\u201315 years, around a recent growth spurt, doing running, jumping or kicking sport) has gradually developing, activity-related, focal tenderness at the <b>tibial tubercle</b>, eased by rest, with pain reproduced by resisted knee extension and no significant effusion, restricted knee movement, systemic features or abnormal hip examination. It may affect one or both knees"],
          ["Signs","Localised tenderness \u00b1 prominence or swelling at the tubercle \u00b7 pain on resisted knee extension or quadriceps loading \u00b7 generally well \u00b7 normal or near-normal knee movement \u00b7 normal gait or only mild activity-related discomfort \u00b7 no significant intra-articular findings. A prominent tubercle is not diagnostic by itself \u2014 it may persist after symptoms resolve, be a normal variant or reflect an old injury. <b>A significant knee effusion is not typical of uncomplicated OSD and should prompt reconsideration of the diagnosis</b>"],
          ["Examine","Document: temperature and general appearance \u00b7 gait and ability to weight-bear \u00b7 focal tenderness and swelling \u00b7 tibial-tubercle prominence \u00b7 knee range of movement \u00b7 effusion, warmth and erythema \u00b7 extensor mechanism and ability to straight-leg raise \u00b7 pain with resisted knee extension \u00b7 ligament and meniscal signs if there was trauma \u00b7 compare with the other side \u00b7 relevant lymphadenopathy, pallor, bruising or systemic features if the history is concerning"],
          ["Hip","<b>Always examine the hip in an adolescent with knee pain</b>: gait and weight-bearing \u00b7 hip flexion and abduction \u00b7 internal and external rotation, compared with the other side \u00b7 look for an externally rotated limb or loss of internal rotation. A painful or restricted hip examination moves the patient out of the routine OSD pathway"],
          ["Imaging","Imaging is not routinely required for a typical presentation in a well adolescent with focal tibial-tubercle tenderness, normal gait, preserved knee movement, no effusion, a normal hip examination and no red flags. Obtain plain radiographs or seek paediatric/orthopaedic advice when the presentation is atypical or uncertain, severe, traumatic (including suspected avulsion), progressive, associated with night/rest pain, a limp, a mass or swelling, or focal bony tenderness away from the tibial tubercle, persists despite an appropriate management trial, or continues after skeletal maturity. A normal radiograph does not override concerning clinical features: discuss with paediatrics/orthopaedics and consider further imaging, usually MRI, where infection, tumour, stress injury or another important diagnosis remains possible. Ultrasound is not routinely required; MRI is generally arranged through paediatric/orthopaedic or MSK pathways"]
        ]},
        {b:"why", html:"Osgood-Schlatter is a clinical diagnosis \u2014 but only once the examination has excluded the alternatives. Night or rest pain, a limp or systemic features are not \u201catypical OSD\u201d: they send the patient down a different diagnostic pathway."}
      ]},
    {t:"node", d:"safety", n:"2", tag:"Safety-net", title:"Differential and red flags",
      blocks:[
        {b:"tiles", v:"safety", items:[
          {t:"\ud83d\udd34 Same-day emergency assessment", html:"Suspected septic arthritis or osteomyelitis \u00b7 hot, swollen or acutely painful joint, particularly with fever or systemic illness \u00b7 inability to weight-bear because of severe pain \u00b7 suspected tibial tubercle avulsion fracture \u00b7 loss of active knee extension or suspected extensor mechanism injury \u00b7 suspected SUFE (limp, hip/groin or referred knee pain, painful or restricted hip movement, externally rotated limb). Suspected musculoskeletal infection needs urgent paediatric/orthopaedic assessment; plain radiographs may be normal early in osteomyelitis and MRI is the preferred second-line imaging when indicated (<a href=\"https://www.rch.org.au/clinicalguide/\" rel=\"noopener\">RCH bone and joint infection guideline</a>)."},
          {t:"\ud83d\udfe0 Urgent assessment and imaging/specialist discussion", html:"Persistent night or rest pain, especially if waking the patient \u00b7 progressive, unexplained or disproportionate pain \u00b7 persistent or unexplained limp \u00b7 unexplained focal bony tenderness away from the tibial tubercle \u00b7 enlarging mass or swelling \u00b7 unexplained fever, weight loss, pallor, bruising or general deterioration \u00b7 significant effusion \u00b7 locking, instability or marked restriction of knee movement \u00b7 persistent functional impairment despite appropriate management \u00b7 atypical age or presentation \u2014 consider malignancy, infection or other bone pathology. For unexplained persistent bone pain or bone swelling, follow the <a href=\"https://www.nice.org.uk/guidance/ng12\" rel=\"noopener\">NICE NG12 suspected-cancer pathway</a> (very urgent assessment or imaging). Unexplained persistent bone pain should prompt consideration of a full blood count, especially with constitutional features, generalised bone pain, pallor, bruising or recurrent infection \u2014 not as routine testing for typical OSD."},
          {t:"\ud83d\udfe0 Hip/referred pain", html:"SUFE, Perthes disease and other hip pathology can present as knee pain \u2014 examine gait, weight-bearing, hip flexion, abduction and internal/external rotation against the other side every time. An externally rotated limb or loss of internal rotation, or acute inability to weight-bear, is a red flag."},
          {t:"\ud83d\udfe0 Infection/inflammation", html:"Septic arthritis \u00b7 osteomyelitis \u00b7 juvenile idiopathic arthritis \u00b7 inflammatory enthesitis."},
          {t:"\ud83d\udfe0 Trauma/structural pathology", html:"Tibial tubercle avulsion fracture \u00b7 patellar or quadriceps tendon injury \u00b7 meniscal or ligament injury \u00b7 osteochondritis dissecans \u00b7 stress injury. A significant effusion, locking or instability is not typical of OSD."},
          {t:"\ud83d\udfe0 Other anterior knee pain", html:"Patellofemoral pain \u00b7 Sinding\u2013Larsen\u2013Johansson (inferior pole of patella) \u00b7 patellar tendinopathy \u00b7 prepatellar/infrapatellar bursitis."},
          {t:"\ud83d\udfe0 Malignancy", html:"Bone tumour \u00b7 leukaemia \u00b7 soft-tissue tumour."}
        ]},
        {b:"why", html:"The can\u2019t-miss diagnoses are referred hip pathology, infection and, rarely, a bone tumour around the knee. Localise the pain precisely: tibial tubercle is Osgood-Schlatter; the inferior pole of the patella is Sinding\u2013Larsen\u2013Johansson."}
      ]},
    {t:"node", d:"life", n:"3", tag:"Non-drug \u00b7 cornerstone", title:"Activity modification and rehabilitation",
      blocks:[
        {b:"tiles", v:"life", items:[
          {t:"\ud83c\udfc3 Modify activity", html:"Reduce or temporarily stop activities that clearly provoke pain \u2014 especially jumping, sprinting, kicking and kneeling \u2014 and keep lower-impact activity going. Complete avoidance of all sport is not usually needed. Return gradually as symptoms allow."},
          {t:"\u26a0\ufe0f When to stop", html:"Do not continue sport if pain causes limping, marked pain during activity, or worse symptoms later that day or the next morning."},
          {t:"\ud83e\uddd8 Graded rehabilitation", html:"Quadriceps and hamstring flexibility (calf and hip where tight) \u00b7 progressive quadriceps, hip and trunk strengthening \u00b7 lower-limb movement control \u00b7 gradual reintroduction of running and impact. Provide a written load-management and exercise plan; many patients can be managed initially with advice and a home programme. Refer to physiotherapy where symptoms restrict school or sport, the patient cannot progress independently, there are strength or movement-control deficits, pain is recurrent despite modification, or a structured return-to-sport plan is required."},
          {t:"\u2705 Return-to-sport criteria (pragmatic advice)", html:"Walking and stairs without a limp \u00b7 full or near-full knee movement \u00b7 no significant tenderness at rest \u00b7 able to squat, jog and hop with acceptable symptoms \u00b7 no worsening later that day or the following morning \u00b7 then increase training volume and intensity gradually. \u201cPain-free\u201d is not always necessary, but pain should be mild, non-progressive and should not alter gait or persist into the following day."},
          {t:"\ud83e\uddca Ice and protection", html:"Ice after activity if helpful; knee protection for kneeling; an infrapatellar strap or sleeve may provide symptomatic benefit for some patients."},
          {t:"\ud83d\ude0c Reassure", html:"Normal activity does not usually cause permanent damage, but repeatedly exercising through significant pain can prolong symptoms. The bony prominence may remain after the pain settles."}
        ]}
      ]},
    {t:"node", d:"drug", n:"4", tag:"Symptom relief", title:"Analgesia",
      blocks:[
        {b:"kv", rows:[
          ["Simple analgesia","Paracetamol and/or ibuprofen at age- and weight-appropriate doses (local paediatric formulary), shortest effective duration, for comfort and function \u2014 not to enable painful high-impact sport or continued activity that is causing significant pain. Doses are not given here: verify against the current local paediatric formulary/BNFc. Do not routinely prescribe prolonged NSAID courses, and do not combine ibuprofen with another NSAID"],
          ["Before ibuprofen","Check for previous NSAID reaction or NSAID-sensitive asthma (risk of bronchospasm) \u00b7 dehydration or intercurrent vomiting/diarrhoea \u00b7 renal disease \u00b7 ulceration or GI bleeding \u00b7 anticoagulants or other interacting medicines \u00b7 concurrent NSAID use. Gastroprotection is not routine in adolescents \u2014 assess individual GI risk and follow the local formulary"],
          ["No role for","Routine imaging in a typical presentation \u00b7 injection treatments are not routine options in primary care \u2014 <b>no corticosteroid injection</b> around the patellar tendon or tibial tubercle"]
        ]}
      ]},
    {t:"node", d:"monitor", n:"5", tag:"Follow-up", title:"Review and prognosis",
      blocks:[
        {b:"timeline", items:[
          {n:"1", when:"Ongoing", title:"Self-limiting", html:"Symptoms commonly fluctuate with activity, often for several months; most improve as skeletal maturity is reached. Symptoms occasionally persist after skeletal maturity because of a symptomatic ossicle or prominent tubercle, and the bony prominence may remain."},
          {n:"2", when:"Not improving", title:"Review", html:"Review if not improving after a reasonable period of load modification and rehabilitation \u2014 earlier if symptoms are worsening, function is deteriorating, the diagnosis is uncertain or there is poor adherence/response to the management plan. Consider physiotherapy for persistent functional restriction. Review timings are pragmatic, not evidence-based thresholds."},
          {n:"3", when:"Persisting despite treatment", title:"Consider referral", html:"Consider routine paediatric MSK/orthopaedic referral when symptoms persist despite appropriate management, particularly beyond approximately 18 months, remain problematic after skeletal maturity, or the diagnosis is uncertain. The 18-month figure is a pragmatic referral criterion from the RCH/Victorian paediatric orthopaedic pathways, not a universal biological cut-off \u2014 and not a reason to delay assessment where there are red flags."}
        ]}
      ]},
    {t:"node", d:"refer", n:"6", tag:"Refer", title:"When to refer",
      arrow:"atypical, persistent or red flag",
      blocks:[
        {b:"tiles", v:"refer", items:[
          {t:"Same-day emergency assessment", html:"Suspected septic arthritis or osteomyelitis, hot swollen or acutely painful joint with fever or systemic illness, suspected tubercle avulsion fracture or extensor mechanism injury (loss of active extension), inability to weight-bear because of severe pain, or suspected SUFE."},
          {t:"Urgent assessment", html:"Persistent night or rest pain, progressive or disproportionate pain, persistent or unexplained limp, an enlarging mass or focal bony tenderness away from the tubercle, unexplained fever, weight loss, pallor or bruising, significant effusion, locking or instability, or atypical age or presentation. Unexplained persistent bone pain or bone swelling: NICE NG12 suspected-cancer pathway."},
          {t:"Physiotherapy", html:"Symptoms restricting sport or school, unable to progress independently with a home programme, recurrent pain despite modification, deficits in strength or movement control, or a structured return-to-sport plan needed."},
          {t:"Routine paediatric MSK/orthopaedics (local pathway)", html:"Persistent symptoms despite appropriate management, particularly beyond approximately 18 months (pragmatic referral criterion), marked functional restriction, diagnostic uncertainty, suspected avulsion, a symptomatic persistent ossicle, or symptoms after skeletal maturity."}
        ]},
        {b:"say", html:"This is likely to be Osgood-Schlatter disease, where the tendon attaches below the kneecap during growth. It usually settles as growth finishes, although the bump may remain. Reduce activities that cause pain, keep active with activities that are comfortable, and use ice and simple pain relief if needed. Seek urgent medical help if there is fever, a hot or very swollen knee, severe pain, inability to walk, a limp that persists, pain at night or at rest, a new lump, worsening symptoms, or pain in the hip. Come back for review if it isn\u2019t settling."}
      ]}
    ,{t:"node", d:"follow", n:"7", tag:"Governance", title:"Local pathway check, evidence status and audit",
      arrow:"document and audit",
      blocks:[
        {b:"warn", html:"<b>Local pathway check:</b> follow the current Bolton and Greater Manchester paediatric physiotherapy, MSK and orthopaedic referral pathways. Local urgent-care and paediatric advice services take precedence over this educational protocol."},
        {b:"kv", rows:[
          ["Guideline-supported","Clinical diagnosis, hip examination and red flags, conservative management (RCH) \u00b7 bone and joint infection assessment (RCH) \u00b7 very urgent pathway for unexplained bone pain or swelling (NICE NG12) \u00b7 NSAID cautions (SPS)"],
          ["Expert/pragmatic advice","Return-to-sport criteria \u00b7 review timings \u00b7 the approximately 18-month referral criterion (Victorian pathway)"],
          ["Local pathway-dependent","Physiotherapy, MSK and orthopaedic referral routes \u00b7 imaging access \u00b7 analgesic doses (local paediatric formulary)"],
          ["Audit","Hip examination documented \u00b7 gait/weight-bearing documented \u00b7 red flags recorded \u00b7 imaging avoided in typical cases \u00b7 safety-netting documented \u00b7 follow-up or referral plan documented"]
        ]}
      ]}
  ],
  evidenceSub:"The sources behind this page and the recommendations each supports. Guideline recommendations are distinguished from pragmatic and local-pathway advice in step 7.",
  evidence:[
    {t:"Royal Children\u2019s Hospital Melbourne \u2014 Osgood-Schlatter disease (for health professionals)", url:"https://www.rch.org.au/ortho/", urlText:"rch.org.au/ortho", detail:"clinical features, initial assessment, conservative management and referral criteria"},
    {t:"Royal Children\u2019s Hospital Melbourne \u2014 Osgood-Schlatter disease patient factsheet", url:"https://www.rch.org.au/kidsinfo/", urlText:"rch.org.au/kidsinfo", detail:"activity modification rather than complete cessation, ice, stretching, strengthening and prognosis"},
    {t:"Royal Children\u2019s Hospital Melbourne clinical practice guideline \u2014 The limping or non-weight-bearing child", url:"https://www.rch.org.au/clinicalguide/", urlText:"rch.org.au/clinicalguide", detail:"hip examination, hip pathology presenting as knee pain, inability to weight-bear as a red flag, investigation principles"},
    {t:"Royal Children\u2019s Hospital Melbourne clinical practice guideline \u2014 Bone and joint infection", url:"https://www.rch.org.au/clinicalguide/", urlText:"rch.org.au/clinicalguide", detail:"suspected osteomyelitis/septic arthritis: urgent assessment; radiographs may be normal early; MRI as second-line imaging"},
    {t:"NICE NG12 \u2014 Suspected cancer: recognition and referral", url:"https://www.nice.org.uk/guidance/ng12", urlText:"nice.org.uk/guidance/ng12", detail:"unexplained persistent bone pain, bone swelling and possible bone sarcoma in children and young people"},
    {t:"Victorian Department of Health \u2014 statewide referral criteria: assessment of atraumatic knee conditions in children (paediatric orthopaedics)", url:"https://www.health.vic.gov.au/", urlText:"health.vic.gov.au", detail:"the >18-month referral criterion and referral information requirements (pragmatic criterion)"},
    {t:"NHS Specialist Pharmacy Service \u2014 Using NSAIDs in asthma; NSAIDs monitoring", url:"https://www.sps.nhs.uk/", urlText:"sps.nhs.uk", detail:"NSAID-related bronchospasm, renal, GI, cardiovascular and interacting-drug risks"},
    {t:"BNF for Children and local paediatric formulary", url:"https://bnfc.nice.org.uk/", urlText:"bnfc.nice.org.uk", detail:"age- and weight-based paracetamol and ibuprofen dosing"},
    {t:"Bolton and Greater Manchester paediatric physiotherapy, MSK and orthopaedic referral pathways", url:"https://gmmmg.nhs.uk/", urlText:"gmmmg.nhs.uk", detail:"local referral routes \u2014 take precedence over this protocol"}
  ],
  foot:"Suspected Osgood-Schlatter disease in primary care \u2014 a clinical diagnosis once red flags and the hip have been checked; no routine imaging in a typical presentation; image or seek advice for atypical, severe, traumatic, progressive or persistent presentations. Adapted from Royal Children's Hospital Melbourne guidance and the Victorian paediatric knee referral criteria; sources and the recommendations they support are listed in the Evidence panel. Bolton and Greater Manchester paediatric pathways take precedence."
});
