MG.render({
  icon:"\u{1F99F}",

  stemTitle:"Lyme disease — treat typical erythema migrans clinically; use serology when there is no typical EM or the diagnosis is uncertain",
  stemSub:"One page for Lyme disease in UK primary care. Erythema migrans is a clinical diagnosis: treat it without testing. Without typical EM, or when the diagnosis is uncertain, the two-tier test (ELISA then immunoblot) guides the decision; a negative early test does not rule Lyme out, but persistently negative results mean reassessing the diagnosis. The regimen is chosen by presentation, and neurological or cardiac involvement changes the urgency.",
  guideline:"NICE NG95 (2018, updated Oct 2018) · NICE QS186 (2019) · UKHSA RIPL",
  meta:[
    {t:"NICE NG95 Lyme disease (2018)"},
    {t:"NICE QS186 quality standard (2019)"},
    {t:"UKHSA RIPL · national reference lab"},
    {t:"Doses per NG95 · check BNF / BNFc"}
  ],
  lead:'<div class="mg-layers"><a href="#diagnose"><b>Diagnosis</b><small>EM is clinical</small></a><a href="#test"><b>Testing</b><small>ELISA → immunoblot</small></a><a href="#treat"><b>Treat</b><small>Regimen by presentation</small></a><a href="#refer"><b>Refer</b><small>Neuro · cardiac · doubt</small></a></div>',
  glance:[
    {lbl:"EM rash", val:"Treat clinically", sub:"no test needed"},
    {lbl:"No typical EM", val:"ELISA → immunoblot", sub:"test, then treat per result"},
    {lbl:"Adult 1st-line", val:"Doxycycline", sub:"100 mg BD or 200 mg OD · 21 days"},
    {lbl:"Alternatives", val:"Amoxicillin · azithromycin", sub:"1 g TDS 21 d · 500 mg OD 17 d"},
    {lbl:"Tick bite, well", val:"No antibiotics", sub:"advise and safety-net"},
    {lbl:"Disseminated", val:"Neuro / cardiac", sub:"specialist ± IV ceftriaxone"}
  ],
  quickSub:"If you read nothing else, read these five cards. Every dose on this page is taken from NICE NG95 — check the current BNF/BNFc before prescribing.",
  quick:[
    {tone:"green", h:"Erythema migrans = diagnose and treat now", html:"An expanding red rash appearing days to weeks after a (possible) tick bite is <b>erythema migrans</b>. Diagnose Lyme disease <b>clinically and start antibiotics without laboratory testing</b> (NICE NG95; QS186 statement 1). Serology is often negative this early and only delays treatment. <b>Do not exclude EM solely because it is smaller than 5 cm, lacks central clearing, or the patient does not recall a tick bite.</b>"},
    {tone:"blue", h:"Adult first-line: doxycycline 21 days", html:"For EM and/or non-focal symptoms in adults and young people aged 12 and over: <b>oral doxycycline 100 mg twice daily or 200 mg once daily for 21 days</b>. Alternatives: <b>amoxicillin 1 g three times daily for 21 days</b>, then <b>azithromycin 500 mg daily for 17 days</b> (NICE NG95). Avoid azithromycin with cardiac involvement (QT effect). Check the local (Greater Manchester) antimicrobial guidance before prescribing."},
    {tone:"amber", h:"No typical EM? Test — and don’t trust an early negative", html:"Suspected Lyme without typical EM (or an uncertain diagnosis) → <b>ELISA</b>; positive or equivocal → <b>immunoblot</b>. Negative ELISA within 4 weeks of symptom onset and still suspected → <b>repeat ELISA 4–6 weeks later</b>. Symptoms for 12 weeks or more with a negative ELISA and still suspected → <b>immunoblot</b>. High suspicion → do not rule Lyme out on a negative result (NICE NG95; QS186 statement 2) — but if repeat or confirmatory testing is negative, reassess the diagnosis, actively consider alternative causes and seek specialist advice. Do not test solely for a tick bite, outdoor exposure or non-specific fatigue."},
    {tone:"red", h:"Red flags: face, meninges, heart", html:"Facial nerve palsy or other cranial neuropathy, radiculopathy, meningitis or encephalitis features, and <b>carditis</b> (heart block, syncope, breathlessness, chest pain). Follow usual emergency practice — e.g. suspected CNS infection or complete heart block → same-day emergency referral <b>even if Lyme disease is suspected</b> (NICE NG95). Do not delay emergency care for Lyme serology."},
    {tone:"green", h:"Well after a tick bite? No prophylaxis", html:"Do not give antibiotics to someone who is well after a tick bite. Explain tick removal, what EM looks like, and to return if a rash or flu-like illness develops over the following weeks. Most tick bites do not result in Lyme disease, but transmission risk varies with tick attachment, local prevalence and duration of attachment."}
  ],
  pathwaySub:"The consultation in six moves. The red step is where harm happens — missed carditis and neuroborreliosis.",
  pathway:[
    {title:"Exposure and rash", html:"Ask about outdoor activity (woodland, moorland, parks, gardens), travel, and tick bites — but <b>many patients do not recall a bite</b>. Look at the whole skin: is there an expanding erythema migrans?"},
    {title:"EM present → treat", html:"EM is diagnostic. <b>Start the NG95 regimen the same day</b>; do not send serology to ‘confirm’ it. Record the size, site and appearance (a photo helps)."},
    {title:"Screen for dissemination", html:"Cranial nerve palsy (especially facial), radicular pain, meningism, confusion; palpitations, syncope, breathlessness, chest pain (ECG); swollen joint; eye symptoms. Emergency features → same-day referral.", alert:true},
    {title:"No typical EM → test sensibly", html:"A compatible clinical syndrome plus plausible exposure → ELISA, then immunoblot if positive/equivocal, with the NG95 timing rules for repeat testing. Do not test people without symptoms after a tick bite, or for outdoor exposure or non-specific fatigue alone. Persistently negative results → reassess the diagnosis and consider alternatives."},
    {title:"Treat by presentation", html:"Non-focal/EM: 21 days oral. Cranial nerve or peripheral nerve involvement: 21 days oral. Arthritis or acrodermatitis chronica atrophicans: 28 days. Stable carditis: cardiology/infection discussion, oral doxycycline (IV ceftriaxone alternative). CNS disease or haemodynamically unstable carditis: specialist-led IV ceftriaxone. Under-18s other than a single EM lesion with no other symptoms: specialist discussion. Pregnancy: an antibiotic suitable in pregnancy."},
    {title:"Review and close the loop", html:"Warn that recovery from fatigue and aches can take weeks. Ongoing symptoms → reassess rather than assume treatment failure (persistent symptoms do not by themselves demonstrate active infection); consider <b>one second course of an alternative antibiotic</b> if treatment may have failed; <b>after 2 courses, do not routinely offer further antibiotics</b> — seek specialist advice."}
  ],
  sections:[

    {id:"diagnose", nav:"Diagnose", title:"Recognising Lyme disease", sub:"Lyme disease is caused by Borrelia burgdorferi sensu lato, transmitted by infected Ixodes ticks. Most presentations in primary care are erythema migrans.",
     blocks:[
       {b:"kv", rows:[
         ["Erythema migrans","A red rash that <b>expands over days</b>, may have central clearing, and is usually <b>not itchy, hot or painful</b>. Central clearing is variable — a ‘bull’s-eye’ appearance is not required. EM usually develops days to weeks after exposure, but the timing is variable: the rash’s expansion and clinical appearance matter more than a precise interval or a recalled tick bite. <b>Do not exclude EM solely because it is smaller than 5 cm, lacks central clearing, or no tick bite is recalled.</b> <b>Diagnose and treat clinically — do NOT wait for, or rely on, tests</b>"],
         ["Early reaction at the bite site","A rash that <b>develops and recedes within 48 hours</b> of the bite, and is more likely than EM to be <b>hot, itchy or painful</b>, is usually a <b>tick-bite reaction</b> rather than EM — advise and review rather than treat"],
         ["Non-focal symptoms","Fever and sweats, swollen lymph glands, malaise, fatigue, neck pain or stiffness, migratory joint or muscle aches, cognitive difficulties, headache, paraesthesia. Non-specific on their own — consider Lyme with exposure, and test"],
         ["Focal (disseminated) features","<b>Neuroborreliosis</b> (facial palsy or other cranial neuropathy, radiculopathy, meningitis, encephalitis); <b>carditis</b> (heart block, pericarditis); <b>Lyme arthritis</b> (usually a large joint, often the knee); <b>acrodermatitis chronica atrophicans</b> (bluish-red, later atrophic skin on an extremity); lymphocytoma; eye involvement (uveitis, keratitis)"],
         ["Context","Tick-endemic exposure in the UK or abroad; <b>many recall no bite</b>. Ticks are small (nymphs are poppy-seed sized) and bites are painless"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"EM is enough on its own", html:"People presenting with erythema migrans should be diagnosed and treated for Lyme disease on clinical assessment, without laboratory testing.", src:"NICE QS186 statement 1 (2019); NICE NG95 (2018)"},
         {tone:"amber", h:"Don’t diagnose on a bite alone", html:"A tick bite without symptoms is not Lyme disease. Do not test or treat asymptomatic people; advise and safety-net instead.", src:"NICE NG95 (2018); NICE NG182 (2020)"}
       ]},
       {b:"why", html:"Erythema migrans is a <strong>clinical diagnosis</strong> because the antibody response takes weeks to develop. Testing an EM rash both delays treatment and falsely reassures when it comes back negative. Without EM, the two-tier test (ELISA then immunoblot) is used, and disseminated features change the urgency and the route of treatment."}
     ]},

    {id:"redflags", nav:"Red flags", title:"Red flags and same-day action", sub:"Disseminated Lyme disease is uncommon, but carditis and CNS infection can be dangerous. Lyme is a reason to add treatment, never to delay usual emergency care.",
     blocks:[
       {b:"warn", html:"<b>Follow usual clinical practice for emergency referral</b> — for example symptoms suggesting <b>central nervous system infection</b>, <b>uveitis</b>, or cardiac complications such as <b>complete heart block</b> — even if Lyme disease is suspected. Do not wait for Lyme serology."},
       {b:"cards", items:[
         {tone:"red", h:"Carditis — heart block", html:"Palpitations, syncope or presyncope, breathlessness or chest pain in someone with possible Lyme → <b>ECG</b>. Second/third-degree AV block, syncope or haemodynamic compromise → <b>999 / same-day admission</b> (may need temporary pacing). A single normal ECG does not exclude intermittent conduction disease — discuss with the acute/cardiology team if syncope, presyncope or significant symptoms persist. Do not delay emergency care to obtain Lyme serology.", src:"NICE NG95 (2018)"},
         {tone:"red", h:"Meningitis / encephalitis", html:"Headache with neck stiffness, photophobia, confusion, reduced consciousness or seizures → same-day emergency assessment as for any suspected CNS infection. Lyme neuroborreliosis affecting the CNS is treated with IV ceftriaxone under specialist care.", src:"NICE NG95 (2018)"},
         {tone:"red", h:"Eye involvement", html:"Red painful eye, photophobia or visual change (uveitis, keratitis) → same-day ophthalmology.", src:"NICE NG95 (2018)"},
         {tone:"amber", h:"Facial palsy", html:"Facial palsy (can be bilateral), other cranial neuropathy or radiculopathy after possible tick exposure: arrange <b>urgent specialist discussion</b>, obtain appropriate serology, and start the recommended oral regimen when clinical suspicion is sufficient — without unnecessarily delaying treatment. Not every facial palsy after outdoor exposure is Lyme disease: exclude stroke and other causes of facial weakness as usual.", src:"NICE NG95 (2018)"},
         {tone:"amber", h:"Radiculopathy", html:"Severe, often nocturnal, radicular pain or sensory/motor deficit in a nerve root distribution — consider peripheral nervous system Lyme. Urgent specialist discussion, appropriate serology, and the recommended oral regimen when clinical suspicion is sufficient.", src:"NICE NG95 (2018)"}
       ]},
       {b:"why", html:"Lyme carditis usually presents as fluctuating AV conduction block and can progress rapidly to complete heart block. That is why any cardiac symptom in suspected Lyme gets an ECG, and why azithromycin (which prolongs the QT interval) is avoided when there is cardiac involvement."}
     ]},

    {id:"tick", nav:"Tick bites", title:"Tick bites, removal and prevention", sub:"Most tick bites do not result in Lyme disease, but transmission risk varies with tick attachment, local prevalence and duration of attachment. The job after a bite is removal, advice and safety-netting — not antibiotics.",
     blocks:[
       {b:"tiles", items:[
         {t:"\u{1FA9D} Remove it promptly", html:"Use a <b>plastic tick-removal device</b> if available, or fine-tipped tweezers. Get under the tick’s body close to the skin and lift or pull it off steadily without squeezing or crushing the body. Clean the area afterwards."},
         {t:"\u{1F48A} No prophylactic antibiotics", html:"Do not offer antibiotics to people who have been bitten by a tick and have no symptoms. Watch for symptoms instead."},
         {t:"\u{1F9EA} No testing after a bite", html:"Do not test asymptomatic people for Lyme disease after a tick bite — antibodies take weeks to appear and a result would not change management."},
         {t:"\u{1F455} Prevention", html:"Cover skin, tuck trousers into socks, keep to paths, use an insect repellent, and check skin (including scalp, groin and behind knees; children’s heads and necks) after being outdoors."},
         {t:"\u{1F4DA} What to look for", html:"An expanding red rash, or a flu-like illness, in the weeks after the bite — return and it will be treated. Photograph the site."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"Advice after a tick bite", html:"Remove the tick (prompt, correct removal reduces the risk of transmission), explain that most bites do not result in Lyme disease although risk varies with attachment duration and local prevalence, describe EM, and advise to seek help if symptoms appear in the weeks afterwards.", src:"NICE NG95 (2018)"},
         {tone:"blue", h:"Public awareness", html:"Local authorities should organise health promotion activities to raise public awareness of how to prevent Lyme disease.", src:"NICE QS186 statement 4 (2019)"}
       ]}
     ]},

    {id:"test", nav:"Testing", title:"Laboratory testing when there is no typical EM or the diagnosis is uncertain", sub:"Two-tier serology. The timing rules matter: antibodies may be absent early in infection.",
     blocks:[
       {b:"table", head:["Situation","Test","Next step"], rows:[
         ["<b>Erythema migrans</b>","<b>None</b>","Diagnose and treat clinically"],
         ["Tick bite, outdoor exposure or non-specific fatigue alone","<b>None</b>","Reserve testing for a compatible clinical syndrome with a plausible exposure"],
         ["Symptoms suggestive of Lyme, no typical EM (atypical or uncertain rash, rash no longer visible, focal presentation)","<b>ELISA</b> (combined IgG/IgM)","Consider starting treatment while awaiting results if clinical suspicion is high"],
         ["ELISA positive or equivocal","<b>Immunoblot</b>","Positive immunoblot + compatible symptoms → diagnose and treat"],
         ["ELISA negative, tested <b>within 4 weeks</b> of symptom onset, still suspected","Repeat ELISA <b>4–6 weeks</b> after the first","Explain why a repeat is needed"],
         ["ELISA negative, symptoms for <b>12 weeks or more</b>, still suspected","<b>Immunoblot</b>","Interpret with the clinical picture"],
         ["Immunoblot negative but high suspicion / symptoms persist","—","If repeat or confirmatory testing is negative, reassess the diagnosis and actively consider alternative causes; seek specialist advice where the clinical picture remains strongly suggestive. A negative result alone does not exclude Lyme, but high suspicion is not a reason for open-ended repeated antibiotics"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"Repeat the early negative", html:"A negative ELISA taken within 4 weeks of symptoms starting is repeated 4 to 6 weeks later if Lyme disease is still suspected.", src:"NICE QS186 statement 2 (2019); NICE NG95 (2018)"},
         {tone:"blue", h:"Where samples go", html:"The UKHSA <b>Rare and Imported Pathogens Laboratory (RIPL)</b>, Porton Down, is the national Lyme reference laboratory and uses standard two-tier testing (screening ELISA, then immunoblot). Use its Lyme request form with the clinical details; RIPL also offers clinical advice.", src:"UKHSA — Lyme disease: sample testing advice (gov.uk)"},
         {tone:"blue", h:"Use validated tests only", html:"Use UKAS-accredited laboratories with validated tests. Tests not validated for Lyme diagnosis (e.g. some privately marketed assays) should not be used to make or exclude the diagnosis.", src:"NICE NG95 (2018)"},
         {tone:"blue", h:"Serology after treatment", html:"Antibodies can persist for months or years after successful treatment. A positive result does not prove active infection — do not re-treat on serology alone.", src:"UKHSA — Lyme disease: sample testing advice (gov.uk)"}
       ]},
       {b:"why", html:"Serology misses early infection because IgM and IgG take several weeks to rise; this is why EM is treated without testing and why an early negative ELISA is repeated. Immunocompromised people may not mount an antibody response, so specialist advice is sensible when suspicion stays high."}
     ]},

    {id:"treat", nav:"Treat", title:"Antibiotic treatment by presentation (adults and ≥12 years)", sub:"The regimen, dose and duration depend on the presentation (NICE NG95; QS186 statement 3). Doses below are the NG95 adult/12+ doses — check the local (Greater Manchester) antimicrobial guidance before prescribing.",
     blocks:[
       {b:"ladder", steps:[
         {step:"EM / non-focal", title:"Doxycycline 21 days", when:"first-line",
          html:"<b><span class='rx'>Doxycycline 100 mg twice daily or 200 mg once daily for 21 days</span></b>. First alternative: <b><span class='rx'>amoxicillin 1 g three times daily for 21 days</span></b>. Second alternative: <b><span class='rx'>azithromycin 500 mg daily for 17 days</span></b> (not with cardiac involvement)."},
         {step:"Cranial / peripheral nerves", title:"Oral, 21 days + specialist discussion", when:"e.g. facial palsy, radiculopathy",
          fromLabel:"focal neurological",
          html:"<span class='rx'>Doxycycline 100 mg twice daily or 200 mg once daily</span>, or <span class='rx'>amoxicillin 1 g three times daily</span>, for <b>21 days</b>. Discuss with or refer to a specialist, without delaying treatment."},
         {step:"Central nervous system", title:"Specialist-led — IV ceftriaxone", when:"meningitis, encephalitis",
          fromLabel:"CNS neuroborreliosis", tone:"red",
          html:"Emergency referral. First-line <span class='rx'>IV ceftriaxone 2 g twice daily or 4 g once daily for 21 days</span>; alternative <span class='rx'>oral doxycycline 200 mg twice daily or 400 mg once daily for 21 days</span> (higher dose for CNS penetration; also used as the oral switch once stabilised). Hospital-initiated."},
         {step:"Arthritis / ACA", title:"Oral, 28 days", when:"Lyme arthritis, acrodermatitis chronica atrophicans",
          fromLabel:"late or joint/skin",
          html:"<span class='rx'>Doxycycline 100 mg twice daily or 200 mg once daily</span> or <span class='rx'>amoxicillin 1 g three times daily</span>, each for <b>28 days</b>; IV ceftriaxone may be used under specialist care if oral options are unsuitable. Reassess and consider rheumatology/dermatology input."},
         {step:"Carditis", title:"Doxycycline 21 days — or IV if unstable", when:"heart block, myocarditis",
          fromLabel:"cardiac", tone:"red",
          html:"<b>Stable Lyme carditis:</b> specialist/cardiology discussion; oral <span class='rx'>doxycycline 100 mg twice daily or 200 mg once daily for 21 days</span> is first-line, with <span class='rx'>IV ceftriaxone 2 g once daily for 21 days</span> as an alternative. <b>Haemodynamic compromise, syncope or high-grade AV block:</b> emergency admission and <span class='rx'>IV ceftriaxone</span> under specialist care. <b>Not azithromycin</b> (QT). Specialist/cardiology-led."}
       ]},
       {b:"cards", items:[
         {tone:"blue", h:"Choice and duration by presentation", html:"People with Lyme disease have initial antibiotic treatment, with the antibiotic, dosage and duration determined by their symptoms.", src:"NICE QS186 statement 3 (2019)"},
         {tone:"red", h:"Azithromycin and the heart", html:"Do not use azithromycin to treat people with cardiac abnormalities associated with Lyme disease, because of its effect on the QT interval.", src:"NICE NG95 (2018)"},
         {tone:"amber", h:"Focal symptoms → specialist, don’t delay", html:"Adults with focal symptoms: consider discussion with or referral to a specialist, <b>without delaying treatment</b>.", src:"NICE NG95 (2018)"}
       ]},
       {b:"warn", html:"Warn about the <b>Jarisch–Herxheimer reaction</b>: fever, chills, headache and worsening aches or rash, or a transient worsening of the rash, usually within the first 24 hours of antibiotics. This may be a Jarisch–Herxheimer reaction and usually settles; it does not usually require stopping treatment. But <b>severe deterioration, breathing difficulty, facial swelling, hypotension or persistent fever requires urgent assessment for allergy, sepsis or another complication</b> — do not use it to dismiss all early deterioration. Doxycycline: take with a full glass of water sitting upright, avoid lying down straight after, and use high-factor sun protection (photosensitivity)."}
     ]},

    {id:"special", nav:"Children & pregnancy", title:"Children and pregnancy", sub:"EM is still treated clinically, but under-18s need a specialist discussion unless there is a single typical EM lesion and no other symptoms.",
     blocks:[
       {b:"warn", html:"<b>Children and young people under 18:</b> discuss diagnosis and management with paediatrics, paediatric infection or another appropriate specialist, <b>unless there is a single typical EM lesion with no other symptoms</b> (NICE NG95). Children with focal disease require specialist input. The doses below do not imply that GPs should independently manage non-EM disease in children."},
       {b:"table", head:["Group","First choice","Alternatives / notes"], rows:[
         ["<b>Children under 9</b>","<b><span class='rx'>Amoxicillin</span></b> — generally first choice — for 21 days (single EM lesion without other symptoms; other uncomplicated disease after specialist discussion) — <b>30 mg/kg three times daily</b> for children 33 kg and under","<span class='rx'>Azithromycin 10 mg/kg daily for 17 days</span> for children 50 kg and under (off-label under 12). Doxycycline is avoided under 9 (tooth staining)"],
         ["<b>Children 9–11</b>","Doxycycline may be used <b>by specialist clinicians</b> for courses of 28 days or less, despite being off-label under 12 years — discuss and document the treatment decision. Under 45 kg: <span class='rx'>5 mg/kg in 2 divided doses on day 1, then 2.5 mg/kg daily in 1 or 2 divided doses</span>, total 21 days (up to 5 mg/kg daily for severe infection); 45 kg and over: adult dose. Off-label under 12","NG95 judged dental risk low with courses of 28 days or less. Amoxicillin or azithromycin as alternatives"],
         ["<b>Young people 12+</b>","Adult regimens","As the treatment section"],
         ["<b>Pregnancy / breastfeeding</b>","Use an antibiotic <b>suitable for pregnancy</b> — commonly amoxicillin for uncomplicated EM. Avoid doxycycline unless specialist advice indicates otherwise","Discuss focal or disseminated disease (including CNS or cardiac) with infection/obstetric specialists — amoxicillin is not automatically correct for these. Check current pregnancy and breastfeeding prescribing information before treatment"],
         ["<b>Children with focal disease</b>","Specialist (paediatric/infection) care","CNS involvement: <span class='rx'>IV ceftriaxone 80 mg/kg (max 4 g) once daily for 21 days</span> for children under 50 kg, under specialist care"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"cream", h:"Paediatric doses", html:"Amoxicillin 30 mg/kg three times daily (≤33 kg) and azithromycin 10 mg/kg daily (≤50 kg) are the NG95 weight-based regimens for EM/non-focal disease. For any presentation other than a single EM lesion with no other symptoms, discuss with a specialist first. Check BNFc for maximum doses.", src:"NICE NG95 (2018)"},
         {tone:"cream", h:"Pregnancy", html:"Treat pregnant women following usual practice, but with antibiotics that are suitable in pregnancy — commonly amoxicillin for uncomplicated EM. Discuss focal or disseminated disease with infection/obstetric specialists, and check current pregnancy and breastfeeding prescribing information.", src:"NICE NG95 (2018)"}
       ]}
     ]},

    {id:"persist", nav:"Persistent symptoms", title:"Ongoing symptoms after treatment", sub:"Fatigue, aches and poor concentration often take weeks to settle after a correct course. Persistence is not proof of ongoing infection.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1", title:"Reassess before re-treating", when:"symptoms persist after the first course",
          html:"Was the diagnosis right? Was the correct drug, dose and duration taken? Any new focal features (neuro, cardiac, joint, eye)? Could reinfection have occurred? Consider alternative diagnoses."},
         {step:"2", title:"Consider a second course of an alternative antibiotic", when:"if treatment may have failed",
          fromLabel:"possible treatment failure",
          html:"NICE NG95: consider a second course of antibiotics for ongoing symptoms if treatment may have failed, <b>using an alternative antibiotic</b> to the initial course (e.g. amoxicillin after doxycycline)."},
         {step:"3", title:"After 2 courses: no more routine antibiotics", when:"still symptomatic",
          fromLabel:"two courses completed", tone:"amber",
          html:"<b>Do not routinely offer further antibiotics.</b> Consider discussion with the national reference laboratory (UKHSA RIPL) or discussion with/referral to an appropriate specialist (infection, neurology, rheumatology, paediatrics) depending on symptoms."},
         {step:"4", title:"Support the person", when:"throughout",
          html:"Acknowledge the symptoms are real, manage them symptomatically, review function, mood, sleep and comorbidity, reassess alternative diagnoses, and agree a follow-up plan. Consider referral for help with the impact of ongoing symptoms."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"Second course", html:"Consider a second course of antibiotics if treatment may have failed, using an alternative antibiotic to the first.", src:"NICE NG95 (2018)"},
         {tone:"amber", h:"After 2 completed courses", html:"Do not routinely offer further antibiotics; consider discussion with a national reference laboratory, or discussion with or referral to an appropriate specialist.", src:"NICE NG95 (2018)"}
       ]},
       {b:"why", html:"Correctly treated Lyme disease usually resolves, but some people have fatigue, pain or cognitive symptoms for months. Repeated or prolonged antibiotics have not been shown to help and cause harm (C. difficile, adverse drug reactions, resistance). Serology can remain positive after cure, so a positive result is not a reason to re-treat. Persistent fatigue, pain or cognitive symptoms do not by themselves demonstrate active Borrelia infection — avoid using ‘chronic Lyme’ as an unqualified diagnosis."}
     ]},

    {id:"followup", nav:"Follow-up", title:"Follow-up and monitoring", sub:"Most early Lyme needs one review. Build the checkpoints into the plan at the first consultation.",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["Treatment started + education","At diagnosis","Start antibiotic (clinically for EM); explain Jarisch–Herxheimer; describe disseminated features to watch for"],
         ["Rash and symptom response","During / at end of course","EM usually fades during treatment; tiredness and aches can lag behind by weeks"],
         ["Repeat ELISA","4–6 weeks after a negative early ELISA","Only if tested within 4 weeks of onset and Lyme is still suspected"],
         ["New focal features","Any time","Neuro, cardiac, joint or eye symptoms → same-day or urgent specialist route as appropriate"],
         ["Persistent symptoms","After the course","Reassess; consider one alternative-antibiotic second course if treatment may have failed; after 2 courses → specialist/RIPL advice, not more antibiotics"],
         ["Test interpretation","If serology used","Interpret in clinical context; serology can stay positive after cure"]
       ]},
       {b:"timeline", items:[
         {n:"1", when:"Day 0", title:"Diagnose, treat, educate", html:"Start the NG95 regimen; photograph the rash; warn about Jarisch–Herxheimer and disseminated features."},
         {n:"2", when:"End of course (3–4 weeks)", title:"Response review", html:"Confirm improvement; reassess if symptoms persist or progress."},
         {n:"3", when:"If persisting", title:"Reassess / refer", html:"Alternative diagnosis? Treatment failure → consider an alternative-antibiotic second course; after 2 courses → specialist advice."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral — who, how fast, where", sub:"Treat first where appropriate; referral should not delay antibiotics.",
     blocks:[
       {b:"table", head:["Presentation","Urgency","Where","What to send"], rows:[
         ["Syncope, 2nd/3rd-degree heart block, haemodynamic compromise","<b>999 / same day</b>","Emergency department / cardiology","ECG, exposure history, antibiotics given"],
         ["Suspected meningitis, encephalitis","<b>Same day</b>","Acute medicine / ED","Neuro findings, timeline, any rash photo"],
         ["Uveitis or other eye involvement","<b>Same day</b>","Eye casualty","Symptoms, visual acuity"],
         ["Facial palsy or other cranial neuropathy, radiculopathy","Urgent discussion — don’t delay treatment","Infection / neurology (per local pathway)","Serology result or request, treatment started"],
         ["Lyme arthritis, acrodermatitis chronica atrophicans","Routine/soon","Rheumatology / dermatology / infection","Serology, joint findings, 28-day course details"],
         ["Children and young people under 18 — anything other than a single EM lesion with no other symptoms","Discuss — urgent if focal disease","Paediatrics / paediatric infection","As above"],
         ["Diagnostic doubt, persistent symptoms after 2 courses","Routine","Infection specialist; UKHSA RIPL clinical advice","Full treatment history, test results"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"Emergency referral trumps Lyme", html:"Symptoms suggesting CNS infection, uveitis, or cardiac complications such as complete heart block → usual emergency referral, even if Lyme is suspected.", src:"NICE NG95 (2018)"},
         {tone:"blue", h:"Specialist discussion for focal disease", html:"Consider discussion with or referral to a specialist for adults with focal symptoms, without delaying treatment. Discuss all children and young people under 18 with a specialist unless they have a single EM lesion and no other symptoms; children with focal symptoms need specialist input.", src:"NICE NG95 (2018)"}
       ]}
     ]},

    {id:"safety", nav:"Safety-net", title:"Safety-netting", sub:"Give the patient the words, and write down what you said.",
     blocks:[
       {b:"tiles", items:[
         {t:"\u{1F534} Heart", html:"“If you have a racing or very slow heartbeat, faint or nearly faint, get breathless or have chest pain, call 999 or go to A&amp;E — Lyme can occasionally affect the heart’s rhythm.”"},
         {t:"\u{1F9E0} Nerves and brain", html:"“If one side of your face droops, you get a severe headache with a stiff neck or dislike of light, confusion, or new shooting nerve pains or weakness, contact us the same day.”"},
         {t:"\u{1F441} Eyes", html:"“A painful red eye or blurred vision needs to be seen the same day.”"},
         {t:"\u{1F4C8} Feeling worse at first", html:"“You may feel briefly worse — fever, aches — in the first day of the antibiotic. That is expected and usually settles; keep taking it. But if you become very unwell, have trouble breathing, facial swelling, feel faint, or the fever doesn\u2019t settle, get urgent help.\u201d"},
         {t:"\u{1FA9D} New rash after a bite", html:"“A new spreading red rash or flu-like illness in the weeks after a tick bite — come back; we’ll treat it.”"}
       ]},
       {b:"say", html:"That spreading red rash is typical of Lyme disease, and it is enough to diagnose it — we don’t need a blood test, which is often negative this early. A three-week course of doxycycline treats it well. Take it with a full glass of water while sitting up, and protect your skin from the sun. You might feel briefly worse on the first day — that is expected, so keep going, but get urgent help if you become very unwell, have trouble breathing or facial swelling, or the fever doesn’t settle. If your face droops, you get a bad headache with a stiff neck, palpitations or faints, contact us straight away. Tiredness can take a few weeks to lift after the course; if it doesn’t, come back and we’ll review it together."}
     ]},

    {id:"pitfalls", nav:"Pitfalls", title:"Common pitfalls", sub:"Where Lyme consultations go wrong.",
     blocks:[
       {b:"dl", rows:[
         ["Testing an EM rash","Delays treatment and a negative result falsely reassures. EM is treated on sight"],
         ["Excluding EM on size, shape or no recalled bite","Do not exclude EM because it is smaller than 5 cm, lacks central clearing or a ‘bull’s-eye’, or the patient recalls no tick bite — expansion and appearance are what matter"],
         ["Antibiotics for a tick bite","Not recommended for people who are well after a bite. Advise, safety-net, and treat if EM or symptoms develop"],
         ["Calling the 48-hour bite reaction EM","A rash that develops and recedes within 48 hours of the bite (often hot, itchy or painful) is usually a tick-bite reaction, not EM"],
         ["One early negative ELISA → ‘not Lyme’","If tested within 4 weeks of onset and still suspected, repeat 4–6 weeks later; if symptoms for 12+ weeks, immunoblot. If repeat testing is negative, reassess the diagnosis and consider alternatives"],
         ["Azithromycin in carditis","QT prolongation — avoid with cardiac involvement"],
         ["Doxycycline in pregnancy or young children","Use an antibiotic suitable for pregnancy (commonly amoxicillin for uncomplicated EM) and amoxicillin first-choice under 9 (azithromycin alternative). Specialist advice for focal or disseminated disease in pregnancy, and for under-18s beyond a single EM lesion"],
         ["Missing the ECG","Any palpitations, dizziness, syncope or breathlessness in suspected Lyme → ECG for AV block; a single normal ECG does not exclude intermittent conduction disease"],
         ["Endless antibiotic courses","After 2 completed courses, do not routinely offer more; seek specialist or reference-laboratory advice"],
         ["Re-treating on a positive antibody test","Antibodies can persist after cure; treat the patient, not the serology"],
         ["Relying on unvalidated private tests","Use accredited laboratories and validated two-tier testing"]
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card — the classic Lyme station tests whether you treat without testing, and how you handle a patient who wants a test.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 38-year-old woman back from a walking holiday in the New Forest has an 8 cm expanding red rash on her thigh with central clearing, and mild aches. She found a tick two weeks ago. She asks for ‘the Lyme blood test’ before taking any antibiotics, and mentions she is trying to conceive.", src:"NICE NG95 (2018) — scenario"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Recognises EM and explains why no test is needed (and why an early test can be falsely negative); <b>asks about pregnancy</b> before prescribing (doxycycline vs amoxicillin); screens for neuro/cardiac/eye features; gives the correct regimen and duration; warns about Jarisch–Herxheimer and photosensitivity; safety-nets red flags; addresses the fear of ‘chronic Lyme’ honestly; arranges review.", src:"NICE NG95 (2018); NICE QS186 (2019)"}
     ]}]},
