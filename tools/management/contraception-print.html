  stemSub:"One page for the whole consultation. Establish the need and reasonably exclude pregnancy, run the UKMEC safety screen, counsel by effectiveness with named UK products, start the method TODAY, teach the missed-pill and sickness rules, offer the coil for emergency contraception, fix bleeding and side effects rather than letting her stop, switch without a gap, and get the over-40s and stopping rules right. Based on UKMEC 2025, FSRH clinical guidelines current at the date of review, NICE CG30/PH51/NG12, BASHH guidance and current product information. A practice aid — not a substitute for the current SPC, FSRH, UKMEC and local PGD guidance.",
