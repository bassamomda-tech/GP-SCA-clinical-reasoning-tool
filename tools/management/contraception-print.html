  ],
  lead:"<div class='mg-layers'><a href='#ukmec'><b>Screen</b><small>UKMEC 2025 — is CHC suitable, then each method</small></a><a href='#choose'><b>Choose</b><small>Effectiveness first, then preference</small></a><a href='#ladder'><b>Start today</b><small>Quick-start + named products</small></a><a href='#refer'><b>Refer</b><small>Fitting, complexity, safeguarding</small></a></div>",
  quickSub:"If you read nothing else on this page, read these six cards. Numbered references [1]–[19] point to the sources under <a href='#provenance'>Evidence</a>. Always check the current SPC, local formulary/PGD and FSRH guidance before prescribing.",
  quick:[
    {tone:"red", h:"⚠ Migraine WITH aura + combined hormonal contraception = UKMEC 4", html:"Migraine with aura at ANY age is an absolute contraindication to the combined pill, patch and ring — the oestrogen raises ischaemic stroke risk. The algorithm this page absorbed put it at <b>2× increased stroke risk</b>, and the evidence range is a <b>2–8 fold</b> increase. This is one of the most commonly missed contraindications in general practice. A NEW aura on CHC → stop the oestrogen immediately and switch to a progestogen-only or non-hormonal method the same day."},
    {tone:"amber", h:"Quick-start: never send her away to wait for a period", html:"If you are reasonably certain she is not pregnant (FSRH pregnancy-exclusion criteria), start ANY method today. FSRH Quick Start guidance allows initiation at any point in the menstrual cycle, or from <b>21 days post-delivery</b>. If pregnancy cannot be fully excluded but risk is ongoing: quick-start the pill or implant anyway (not harmful to an early pregnancy), pregnancy test in 3 weeks — <b>do not insert an LNG-IUD where pregnancy cannot reasonably be excluded</b>; a Cu-IUD may still be appropriate as EC within the permitted timeframe [2]. If it is &gt;21 days since the LMP with no unprotected sex a test is not required, but document the reasoning."},
    {tone:"blue", h:"Counsel by effectiveness — LARC is a different order of reliability", html:"LARC methods have the lowest failure rates because they do not depend on daily adherence. First-year typical-use pregnancy rates are approximately below 1% for the implant, LNG-IUD and Cu-IUD; exact rates vary by device and data source. User-dependent methods (pill, patch, ring, condoms) fail more often in typical use. <b>NICE CG30: everyone seeking contraception should be given information on, and offered a choice of, all methods including LARC</b> — this is a choice, not a direction to LARC: the best method is still the one she will keep using [9].", src:"CG30 · PH51"},
    {tone:"green", h:"Emergency contraception — offer the coil to everyone", html:"The copper IUD is the most effective EC. It can be inserted within 5 days of the first episode of UPSI, or within 5 days after the earliest estimated date of ovulation — whichever permits the later insertion date. It is unaffected by BMI or enzyme inducers, and becomes ongoing contraception. FSRH: offer it to ALL women requesting EC. UPA (ellaOne 30 mg) is licensed up to 120 h and is more effective than levonorgestrel, especially at 72–120 h and near ovulation — after UPA, delay starting or restarting progestogen-containing contraception for 5 days, then use condoms until the method is effective. LNG-EC is licensed up to 72 h; FSRH supports consideration up to 96 h off-label: 3 mg if weight &gt;70 kg, BMI &gt;26 or on an enzyme inducer — check your local PGD [3][4]. Oral EC can be repeated in the same cycle after a further episode of UPSI."},
    {tone:"amber", h:"Enzyme inducers break the pill, the POP, the implant and the patch", html:"Carbamazepine, phenytoin, rifampicin, St John’s Wort (available over the counter) and some antiretrovirals make CHC, POP, implant and patch unreliable — levonorgestrel levels fall by up to 50%. <b>Use DMPA, the copper IUD or the LNG-IUD instead</b> (their efficacy is unaffected). Broad-spectrum antibiotics do NOT reduce COC efficacy (FSRH 2017) — no additional precautions are needed routinely; the old advice was wrong and has been corrected."},
    {tone:"amber", h:"Persistent unscheduled bleeding is not “just the method”", html:"Unscheduled bleeding is the commonest reason women stop a method — and unplanned pregnancy follows. Reassure and troubleshoot for the first <b>3 months</b>, but bleeding beyond 3 months means excluding pregnancy, STIs, adherence problems and drug interactions, cervical pathology, missed screening and (in older patients or those with risk factors) endometrial pathology — examine and test before you change hormones. Then rescue it: a 3-month course of a levonorgestrel COC (off-label; only if CHC is medically suitable — never with a new contraindication to oestrogen) or a 5-day course of mefenamic acid (off-label), and only then switch method. Undiagnosed abnormal vaginal bleeding must be investigated before starting hormonal contraception — it can mask malignancy."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step is where patients come to harm — do not skip it.",
  pathway:[
    {title:"Screen the emergencies and absolute contraindications first", html:"Confirmed or suspected pregnancy · undiagnosed abnormal vaginal bleeding · current breast cancer or breast cancer within 5 years · severe cardiovascular disease (MI, stroke, TIA, pulmonary hypertension, complicated valvular disease) · current or past VTE (eligibility is method- and circumstance-specific — check UKMEC) · migraine with aura · BP ≥160/100 · significant liver disease (UKMEC differs for acute or chronic viral hepatitis, compensated or decompensated cirrhosis, and hepatocellular adenoma or carcinoma) · time-critical EC (LNG licensed to 72 h, off-label to 96 h; UPA to 120 h; Cu-IUD within 5 days of first UPSI or earliest estimated ovulation) · safeguarding or Fraser concerns. Any of these changes the method — or the destination — before you prescribe.", alert:true},
    {title:"Establish the need and exclude pregnancy with the FSRH checklist", html:"Why now (new start, switching, EC, post-pregnancy, post-abortion, pill running out), current method and why she is stopping it, LMP, unprotected sex, current medications (enzyme inducers), STI risk, cervical screening status and future fertility plans. Use the FSRH pregnancy-exclusion criteria and perform a urine pregnancy test where indicated — <b>a negative test cannot exclude pregnancy after recent UPSI</b>, and testing must not delay time-critical EC [2][3]."},
    {title:"Run the UKMEC 2025 screen — is CHC suitable, then each method?", html:"Document BP and BMI, migraine and aura history, smoking, personal and family VTE history, breast cancer history and drug interactions before any combined method. <b>UKMEC 4 = do not use · 3 = risks outweigh benefits · 1–2 = fine.</b> Progestogen-only and intrauterine methods suit most people the CHC screen excludes — but check method-specific contraindications and interactions (DMPA bone and VTE considerations, drospirenone and hyperkalaemia, intrauterine contraindications, breast cancer, enzyme inducers). The fallback is never “no contraception”."},
    {title:"Choose by effectiveness, then by preference — and start today", html:"Offer information on all methods including LARC (lowest failure rates, fit-and-forget), then discuss bleeding wishes, procedure aversion, adherence reality, acne, heavy periods and fertility plans. All UKMEC 1–2 methods are medically appropriate, so <b>patient choice drives selection</b>. Quick-start it, tell her exactly when it becomes effective (7 days for most, 2 days for desogestrel or traditional POPs, 7 days for drospirenone, immediately for the copper IUD), and give the missed-pill and sickness rules in writing."},
    {title:"Review, fix problems, and never leave a gap", html:"CHC: BP and review at 3 months, then annually. DMPA: injection interval per product information (Depo-Provera® / Sayana Press®); review at least every 2 years. Implant: replace at 3 years. Cu-IUD/LNG-IUD: teach the thread check. <b>Fix bleeding and side effects rather than letting her stop</b>, and when switching, <b>overlap by the new method’s own time-to-effective</b>. Safety-net VTE symptoms, new aura, missing threads and a positive pregnancy test."}
  ],
  sections:[
    {id:"need", nav:"Establish the need", title:"Establish the need and reasonably exclude pregnancy", sub:"Contraception is a consultation about a person’s circumstances, not a prescription decision — and pregnancy must be reasonably excluded before anything is started.",
     blocks:[
       {b:"table", head:["Ask","Detail","Changes what"], rows:[
         ["<b>Reason for the request</b>","New start, switching method, emergency contraception (EC), post-pregnancy, post-abortion, or the pill running out","Sets the urgency and whether EC is needed today"],
         ["<b>Current contraception</b>","What is she using now, and why is she switching? (side effects, failure, inconvenience, partner change, new relationship)","<b>An unfixed side effect is a fixable problem — see <a href='#sideeffects'>Side effects</a></b>"],
         ["<b>LMP and unprotected sex</b>","<b>Last menstrual period, to confirm current pregnancy status</b>","Quick-start criteria: hormonal contraception can be started at any time if pregnancy is excluded, or from 21 days post-delivery"],
         ["<b>Pregnancy test</b>","Use the FSRH pregnancy-exclusion criteria. Urine βhCG where pregnancy is possible — a negative test cannot exclude pregnancy after recent UPSI. Assess the possibility of an existing pregnancy before oral EC, but a test must not delay time-critical EC [2][3]","If &gt;21 days since the LMP with no unprotected sex, a test is not required — but document the reasoning"],
         ["<b>Current medications</b>","Enzyme inducers — rifampicin, carbamazepine, phenytoin, St John’s Wort, some antiretrovirals — render the COC, POP, implant and patch ineffective","<b>Switch to DMPA, the copper IUD or the LNG-IUD</b>"],
         ["<b>Lamotrigine</b>","<b>CHC lowers lamotrigine levels (seizure risk on, toxicity off)</b>","<b>Prefer non-oestrogen methods, or take specialist advice</b>"],
         ["<b>STI risk</b>","Take a sexual history and offer STI testing to anyone with relevant risk factors. Do not insert intrauterine contraception with current PID, purulent cervicitis, known gonorrhoea or symptomatic chlamydia","In asymptomatic patients, chlamydia/gonorrhoea testing can be done at the time of insertion and insertion need not await the result [2][8]"],
         ["<b>Cervical screening</b>","<b>Check the screening status as an opportunistic reminder</b>","<b>An overdue smear does not delay starting contraception</b> — arrange it separately"],
         ["<b>Future fertility plans</b>","The timing of a desired pregnancy influences method choice; reversibility and the return-to-fertility timeline must be discussed","<b>Wants pregnancy soon → avoid DMPA</b> (see <a href='#choose'>Choose</a>)"],
         ["<b>Age and capacity</b>","Under 16 (&lt;16): assess capacity and document Fraser criteria. Under 13: safeguarding referral always","Any concern about coercion, exploitation or trafficking → safeguarding before prescribing"]
       ]},
       {b:"why", html:"FSRH Quick Start guidance allows contraception to be initiated at any point in the menstrual cycle — this removes a barrier to access without waiting for “day 1”, and it is evidence-based. Enzyme inducers reduce levonorgestrel levels by up to 50%, and a missed drug interaction is a significant cause of contraceptive failure. Undiagnosed chlamydia at insertion increases pelvic infection risk, so offer STI testing to anyone with risk factors — in asymptomatic patients it can be done at the time of insertion [2][8]."}
     ]},

    {id:"ukmec", nav:"UKMEC", title:"The UKMEC 2025 screen — is CHC suitable, and which methods are?", sub:"UKMEC 1 = use freely · 2 = benefits outweigh risks · 3 = risks outweigh benefits (relative contraindication) · 4 = absolute contraindication (unacceptable risk).",
     blocks:[
       {b:"warn", html:"<b>UKMEC 2025 [1]:</b> updates include chronic kidney disease, multiple sclerosis, sickle-cell trait, multiple VTE risk factors and revised DMPA classifications in some VTE-risk situations, with updated breast-cancer terminology and hypertension classifications. Check the current UKMEC table or online tool rather than relying on this summary."},
       {b:"table", head:["UKMEC","Meaning","Key examples (CHC)"], rows:[
         ["<b>4 — do NOT use</b>","Unacceptable risk","Migraine WITH aura (any age) · current or past VTE or a thrombogenic mutation · BP ≥160/100 · smoker ≥35y at ≥15/day · &lt;6 weeks postpartum and breastfeeding · current breast cancer · ischaemic heart disease or stroke · major surgery with prolonged immobilisation · severe (decompensated) cirrhosis, hepatocellular adenoma or carcinoma — acute and chronic viral hepatitis are categorised separately (check UKMEC)"],
         ["<b>3 — risks outweigh</b>","Avoid unless nothing else is suitable","BMI ≥35 · smoker ≥35y at &lt;15/day (or stopped &lt;1 year ago) · adequately controlled hypertension, or BP 140–159/90–99 · family history of VTE in a first-degree relative aged &lt;45 · immobility · past breast cancer &gt;5 years ago · gallbladder disease"],
         ["<b>1–2 — fine</b>","Benefits outweigh risks","Most women. Well-controlled diabetes without vascular disease, migraine without aura (initiation = 2), obesity BMI 30–34, age alone"]
       ]},
       {b:"table", head:["Factor","UKMEC detail","Note"], rows:[
         ["<b>Age</b>","Under 16 (&lt;16): Fraser criteria plus a capacity assessment. Over 35 and smoking: COC UKMEC 3–4. Over 40 (&gt;40): consider perimenopausal management. Stopping: a non-hormonal user stops after 2 years of amenorrhoea if under 50, or 1 year if 50 or over — see <a href='#special'>the stopping rules</a>","Age alone is never a contraindication to a progestogen-only or intrauterine method"],
         ["<b>BMI</b>","BMI ≥35: COC UKMEC 3 (VTE risk). The patch is less effective above 90 kg (&gt;90 kg). POP, IUD, LNG-IUD and implant are unaffected by weight","<b>Document BMI before any combined method</b>"],
         ["<b>Blood pressure</b>","Check BP before the COC. Systolic ≥160 or diastolic ≥100: COC UKMEC 4. The POP is UKMEC 1 at all BP levels","<b>Target &lt;140/90; recheck 3 months after starting, then annually</b>"],
         ["<b>Smoking</b>","Over 35 years and &gt;15 cigarettes/day: COC UKMEC 4. Under 35 (&lt;35): COC UKMEC 2. Aged 35 or over and &lt;15/day, or stopped &lt;1 year ago: COC UKMEC 3. CHC is contraindicated if aged ≥35 and smoking ≥15/day","Always advise smoking cessation — refer to the NHS Stop Smoking service"],
         ["<b>Migraine</b>","Without aura: COC UKMEC 2. With aura: COC UKMEC 4. POP UKMEC 2 in both. Implant UKMEC 2","<b>A new aura on CHC = stop the oestrogen the same day</b>"],
         ["<b>Diabetes</b>","Without complications: COC UKMEC 2. With vascular disease: COC UKMEC 3–4. LNG-IUD UKMEC 2 for all","Well-controlled diabetes without vascular disease is not a barrier"],
         ["<b>VTE history</b>","History of DVT or PE: COC UKMEC 4. POP UKMEC 2. Copper IUD UKMEC 1. Factor V Leiden: seek specialist advice before the COC","Eligibility is method- and circumstance-specific — UKMEC 2025 adds multiple VTE risk factors and revises some DMPA categories [1]. Check drug interactions with anticoagulants (e.g. liver enzyme inducers)"],
         ["<b>Breastfeeding</b>","COC: avoid &lt;6 weeks postpartum (it affects milk, UKMEC 4). POP and implant: any time postpartum, including while breastfeeding. Cu-IUD/LNG-IUD: within 48 hours of delivery, or from 4 weeks","CHC is not used before 3 weeks (&lt;3 weeks) postpartum regardless of feeding"],
         ["<b>Liver disease</b>","UKMEC differs for acute viral hepatitis, chronic viral hepatitis, compensated or decompensated cirrhosis, and hepatocellular adenoma or carcinoma — check the UKMEC table for each method. Copper IUD UKMEC 1 (non-hormonal)","The non-hormonal option is almost always available"]
       ]},
       {b:"kv", rows:[
         ["Always check before CHC","BP + BMI (documented), migraine and aura history, smoking, personal and family VTE history, breast cancer history, drug interactions"],
         ["Progestogen-only + intrauterine","Suitable for most people the CHC screen excludes, but check method-specific contraindications and interactions — the fallback is never “no contraception”"],
         ["The online tool","The FSRH provides an online UKMEC tool (ukmec.org) that can be used during the consultation"]
       ]},
       {b:"why", html:"<strong>First establish whether CHC is medically suitable. Then assess method-specific contraindications, interactions, bleeding preferences and patient priorities</strong> — DMPA bone and VTE considerations, contraindications to intrauterine contraception, drospirenone-associated hyperkalaemia, breast cancer with progestogen-only methods and enzyme inducers all matter. The UKMEC framework (current edition UKMEC 2025 [1]) replaces clinical guesswork with evidence-based categorical risk assessment, reducing both under-prescribing (denying contraception inappropriately) and over-prescribing (prescribing despite an absolute contraindication). Studies show GP prescribing errors are most common in women with migraine with aura, hypertension and enzyme-inducing medications — which is exactly the list to run through out loud."}
     ]},

    {id:"severe", nav:"Red flags", title:"Red flags and absolute contraindications", sub:"Identify UKMEC 4 conditions and the presentations that need urgent management before anything is prescribed.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Current pregnancy", html:"Confirmed or suspected pregnancy — contraception is inappropriate. Urine βhCG if there is any doubt, then manage accordingly."},
         {tone:"red", h:"🔴 Undiagnosed abnormal vaginal bleeding", html:"Must be investigated before initiating hormonal contraception — it can mask malignancy. See the NG12 criteria under <a href='#workup'>Work-up</a> and <a href='#refer'>Refer</a>."},
         {tone:"red", h:"🔴 Breast cancer — current, or within 5 years", html:"All hormonal contraception is UKMEC 4. The copper IUD is generally the only UKMEC 1 option among the commonly used highly effective methods — insertion still requires assessment of uterine anatomy, infection risk and pregnancy status, and specialist/oncology input may be appropriate in complex cases. Do not prescribe oestrogen or progestogen — liaise with oncology if uncertain. <b>Past breast cancer more than 5 years ago is UKMEC 3.</b>"},
         {tone:"red", h:"🔴 Severe cardiovascular disease", html:"MI, stroke, TIA, pulmonary hypertension or complicated valvular disease — the COC is UKMEC 4. Use the POP, an IUD, or take specialist input."},
         {tone:"red", h:"🔴 Migraine with aura and the COC", html:"An absolute contraindication (UKMEC 4) — 2× increased stroke risk (evidence range 2–8 fold). Switch to a progestogen-only method or the copper IUD; do not prescribe the COC. <b>A new aura while on CHC → stop it immediately.</b>"},
         {tone:"red", h:"🔴 DVT or PE on anticoagulation", html:"CHC is UKMEC 4 (thrombogenic). Eligibility for other methods is method- and circumstance-specific (UKMEC 2025 revises some DMPA categories) — check the UKMEC table [1]. Options usually include the POP, LNG-IUD or copper IUD; and check for interactions with the anticoagulant (e.g. liver enzyme inducers)."},
         {tone:"amber", h:"🟠 EC window exceeded", html:"LNG-EC beyond 72 hours (licensed; FSRH supports consideration to 96 hours off-label), or UPA-EC beyond 120 hours. A copper IUD may still be possible within 5 days of the first UPSI, or within 5 days after the earliest estimated ovulation, whichever is later — refer urgently; it is the most effective EC [3]."},
         {tone:"amber", h:"🟠 Safeguarding / Fraser concerns", html:"Under 16: apply Fraser guidelines and document capacity and competence. Under 13: safeguarding referral always. Any concern about coercion, trafficking or child sexual exploitation → safeguarding referral before prescribing."},
         {tone:"red", h:"🔴 After Cu-IUD/LNG-IUD fitting — 999 features", html:"Severe abdominal pain with fever and haemodynamic instability → uterine perforation or sepsis, 999. VTE symptoms on the COC — unilateral leg swelling, chest pain, breathlessness → same-day or 999 assessment."}
       ]},
       {b:"warn", html:"Persistent unscheduled bleeding is never just “the method” until you have excluded pregnancy, STIs, adherence and drug interactions, cervical pathology, missed screening and (where at risk) endometrial pathology — examine, test, and only then troubleshoot hormonally. Undiagnosed abnormal vaginal bleeding is a red flag, not a side effect to be waited out."},
       {b:"why", html:"<b>UKMEC 4 means the risk is unacceptable — not “relative”.</b> Migraine with aura plus the COC increases ischaemic stroke risk 2–8 fold, and it is one of the most commonly missed contraindications in general practice. The copper IUD is the most effective emergency contraceptive (within its 5-day window [3]) and can then serve as ongoing contraception — which is why it belongs in every EC conversation, including the ones that arrive at the far edge of the window."}
     ]},

    {id:"exam", nav:"Examination", title:"Targeted examination and measurements", sub:"Contraception rarely needs an examination — but the few measurements that are needed are the ones that make prescribing safe, and there are three situations where you must look.",
     blocks:[
       {b:"table", head:["What","When / how","Changes what"], rows:[
         ["<b>Blood pressure</b>","Mandatory before the COC, patch or ring, and documented. Target &lt;140/90","≥160/100 = UKMEC 4 → no oestrogen. 140–159/90–99 = UKMEC 3. Recheck at 3 months, then annually"],
         ["<b>Weight and BMI</b>","<b>Documented before any combined method; document weight before DMPA</b>","BMI ≥35 = COC UKMEC 3. The patch is less effective above 90 kg. DMPA: weight gain is variable and not inevitable — counsel before prescribing"],
         ["<b>Pulse and cardiovascular</b>","Opportunistic, and where symptoms suggest it","Supports the arterial-risk conversation in smokers and the over-35s"],
         ["<b>Speculum and pelvic examination</b>","Not routine. Indicated for persistent unscheduled bleeding beyond 3 months, post-coital bleeding, discharge, pelvic pain, or before or at Cu-IUD/LNG-IUD fitting","An appearance of the cervix consistent with cervical cancer → consider a suspected cancer pathway referral, whatever the contraception plan (NICE NG12, updated April 2026)"],
         ["<b>Breast examination</b>","Not routine for contraception. Examine a reported lump or nipple change","<b>An unexplained breast lump aged 30 or over → breast suspected cancer pathway referral (NICE NG12, updated April 2026)</b>"],
         ["<b>Implant arm check</b>","<b>Palpate the implant in the inner upper arm at review</b>","Non-palpable or deep implant → do not attempt removal; refer to the specialist removal service"],
         ["<b>Cu-IUD/LNG-IUD threads</b>","Teach self-checking; examine if she cannot feel the threads, or has pain, dyspareunia or abnormal bleeding","Missing threads → EC plus an interim method now, then ultrasound ± abdominal X-ray; if the device is not seen → gynaecology (assume expulsion)"]
       ]},
       {b:"why", html:"Blood pressure measurement before the COC is the single most important investigation in this consultation — oestrogen-containing contraceptives increase BP in approximately 5% of users, and can precipitate a hypertensive crisis. <b>Everything else is targeted:</b> a pelvic or breast examination performed only where a symptom demands it is better medicine than a routine ritual, and it is the persistent-bleeding presentation — not the well woman starting a pill — where examination finds pathology."}
     ]},

    {id:"workup", nav:"Work-up", title:"Investigations before prescribing — and what NOT to order", sub:"Almost nothing is needed. The value of this section is knowing which four things matter and which five are a waste of the patient’s time.",
     blocks:[
       {b:"table", head:["Test","When","Why it matters"], rows:[
         ["<b>Blood pressure</b>","Mandatory before the COC, patch and ring. Target &lt;140/90. Recheck 3 months after starting, then annually","New hypertension occurs in about 5% of CHC users and requires a method switch"],
         ["<b>Pregnancy test (urine βhCG)</b>","Where pregnancy is possible, guided by the FSRH pregnancy-exclusion criteria and local IUC protocol. A negative test cannot exclude pregnancy after recent UPSI and should not delay time-critical EC [2][3]","Quick-start: if &gt;21 days since the LMP without unprotected sex, a test is not required — but document the reasoning"],
         ["<b>Chlamydia NAAT</b>","Offer to anyone with STI risk factors on sexual history — not by age alone. In asymptomatic patients, test at the time of insertion; insertion need not await the result","Do not insert with current PID, purulent cervicitis, known gonorrhoea or symptomatic chlamydia. Treat a positive result; the device can usually stay in situ [2][8]"],
         ["<b>Weight and BMI</b>","<b>For COC risk stratification, and to document a baseline before DMPA</b>","DMPA: weight gain is variable and not inevitable. Not a contraindication, but it changes the counselling"],
         ["<b>NOT routinely needed</b>","Clotting or thrombophilia screen (unless a personal or family history of VTE) · pelvic ultrasound (unless symptomatic) · hormone levels (FSH, LH, oestradiol) · a cervical smear before starting contraception (arrange separately if overdue)","Routine thrombophilia screening before the COC is not cost-effective or evidence-based (FSRH 2019) — it does not reduce VTE risk in unselected populations, and it causes anxiety and delay"]
       ]},
       {b:"cards", items:[
         {tone:"purple", h:"NG12 criteria that surface in a contraception consultation <span class='tw'>Suspected cancer</span>", html:"Contraception itself is not a NICE NG12 criterion — but three NG12 criteria regularly present in this consultation, and each one outranks the prescribing decision:<br>• Unexplained post-menopausal bleeding aged 55 and over that is not attributable to HRT → suspected cancer pathway referral for endometrial cancer. Aged under 55 with post-menopausal bleeding → consider a suspected cancer pathway referral. Unscheduled bleeding on HRT → assess per BMS joint guideline (2024).<br>• An appearance of the cervix consistent with cervical cancer on speculum → consider a suspected cancer pathway referral — do not wait for, or be reassured by, a smear result.<br>• An unexplained breast lump aged 30 and over → breast suspected cancer pathway referral (and remember current breast cancer is UKMEC 4 for all hormonal methods).<br>Also: visible haematuria aged 45 and over without a UTI, or persisting after treatment → bladder and renal suspected cancer pathway referral. NG12 applies to England — follow local referral pathways. Post-menopausal bleeding means bleeding more than 12 months after the menopause; HRT-related bleeding follows current BMS guidance and local pathways. Abnormal bleeding in a premenopausal patient is not automatically a suspected cancer referral, but persistent or concerning symptoms need assessment and safety-netting [10]. Restated with the same thresholds under <a href='#refer'>Refer</a>.", src:"NICE NG12 (updated April 2026)"}
       ]},
       {b:"why", html:"<b>Investigate only where the result changes the decision.</b> The three tests that change management are BP (oestrogen eligibility), pregnancy assessment (FSRH criteria, with a test where indicated) and STI testing where risk factors are present (which can be done at insertion). Everything else on the “not needed” list delays a woman’s access to contraception without making it safer — and an overdue smear in particular must never be used as a reason to withhold a method."}
     ]},

    {id:"choose", nav:"Choose", title:"Effectiveness-led counselling — then let preference decide", sub:"Lead with effectiveness, because that is the information women are most often not given. Then, among the UKMEC 1–2 options, her preference decides.",
     blocks:[
       {b:"table", head:["Tier","Method","Typical-use pregnancy rate, first year","Key selling points"], rows:[
         ["<b>1 — LARC</b>","<b>LNG-IUD · copper IUD · implant</b>","Approximately &lt;1% (exact rates vary by device and data source)","Fit-and-forget; the lowest failure rates; no user-dependent failure; rapid return of fertility on removal"],
         ["<b>2 — injectable</b>","<b>DMPA</b>","<b>~4%</b>","<b>12–13 weekly; amenorrhoea is common and often welcome</b>"],
         ["<b>2 — pills / patch / ring</b>","<b>COC · POP · Evra® patch · vaginal ring</b>","<b>~7–9%</b>","User-controlled; the COC gives cycle control and helps acne, dysmenorrhoea, PMS and heavy bleeding"],
         ["<b>3 — barrier / fertility awareness</b>","<b>Condoms · diaphragm · fertility awareness</b>","<b>~13–24%</b>","Condoms are the only method that protects against STIs — promote them WITH any method"]
       ]},
       {b:"table", head:["Preference","What to offer","Detail"], rows:[
         ["<b>Efficacy is the priority</b>","<b>LARC — implant, LNG-IUD or copper IUD</b>","Lowest first-year pregnancy rates (approximately &lt;1%); no user-dependent failure. Offered within a choice of all methods, not as a default (NICE CG30 [9])"],
         ["<b>Wants lighter or no periods</b>","<b>LNG-IUD (Mirena®) or the implant</b>","The 52 mg LNG-IUD reduces heavy menstrual bleeding by ~90%, with amenorrhoea in ~20% at 1 year"],
         ["<b>Wants a normal, regular bleed</b>","<b>Copper IUD, the COC, or barrier methods</b>","<b>Irregular bleeding acceptable? The implant and DMPA become options</b>"],
         ["<b>Convenience / dosing rhythm</b>","Daily: COC, POP. Weekly: patch. Monthly: vaginal ring. 3-monthly: DMPA. 3 years: implant. 3–10 years: LNG-IUD, IUD","Match the interval to the life, not to the formulary"],
         ["<b>Wants pregnancy soon</b>","<b>Avoid DMPA</b>","Return of fertility: DMPA median 9–10 months (delayed up to 1 year) · POP and COC within 1 month · Cu-IUD/LNG-IUD immediately on removal · implant within 1 week"],
         ["<b>Wants no hormones</b>","<b>Copper IUD (the most effective non-hormonal method) or barrier methods</b>","Discuss efficacy honestly: condoms fail far more often in typical use than the copper IUD (first-year rate below 1%)"],
         ["<b>Worried about hormones</b>","Validate the concern; discuss the actual evidence on mood, libido and weight","Some women do have genuine adverse hormonal responses — offer alternatives, not dismissal"],
         ["<b>Non-contraceptive wins</b>","LNG-IUD is first-line for heavy menstrual bleeding · the COC helps acne, dysmenorrhoea, PMS and PCOS and reduces ovarian and endometrial cancer risk · DMPA helps sickle crises","Often the argument that settles the choice"],
         ["<b>Under 16</b>","Assess capacity and document Fraser criteria; under 13 is a safeguarding referral always","<b>Adolescents needing enhanced support → sexual health services</b>"],
         ["<b>STI risk</b>","<b>Screen opportunistically; give the dual-protection message</b>","Condoms alongside whatever is chosen"]
       ]},
       {b:"why", html:"FSRH standards require that contraceptive counselling covers all available methods — not just the ones the prescriber is comfortable with — and that the exploration of patient preference is documented. LARC removes user failure, the main driver of unintended pregnancy (cost-effectiveness depends on assumptions, continuation and local prices), and <b>NICE CG30 asks that everyone seeking contraception is offered a choice of all methods including LARC</b>. But shared decision-making, not prescriber preference, should determine method selection: the method she keeps using beats the method with the better failure rate on paper."}
     ]},

    {id:"ladder", nav:"Start", title:"Named first-lines and exactly how to start each", sub:"Doses and brands are named for orientation — always check the current SPC, local formulary/PGD (Greater Manchester formulary [11]) and current FSRH guidance before prescribing.",
     blocks:[
       {b:"ladder", steps:[
         {step:"LNG-IUD", title:"Levonorgestrel IUD (LNG-IUD; “hormonal coil” for patients) — 52 mg first (Mirena®, Levosert®, Benilexa®)", when:"wants LARC ± lighter periods", fromLabel:"first-line LARC",
          html:"52 mg LNG-IUDs: FSRH supports 8 years for contraception when inserted before age 45; <b>inserted at 45 or over → can generally remain for contraception until 55.</b> Duration for heavy menstrual bleeding and HRT endometrial protection differs from contraceptive duration — <b>a 52 mg LNG-IUD used for HRT endometrial protection should be changed after 5 years</b>, irrespective of the longer contraceptive licence. Licensed durations differ between brands — check the SPC [2][7]. Smaller frames for a narrow canal or nulliparity: <b>Kyleena® 19.5 mg (5 years)</b>, <b>Jaydess® 13.5 mg (3 years)</b> — but expect more bleeding than with 52 mg. Reduces heavy menstrual bleeding by ~90%; amenorrhoea in ~20% at 1 year. <b>Start:</b> any time if reasonably sure she is not pregnant; <b>effective after 7 days</b> (immediately if fitted on days 1–7 of the cycle)."},
         {step:"Cu-IUD", title:"Copper IUD — hormone-free", when:"wants no hormones, or needs EC", fromLabel:"or as emergency contraception",
          html:"UK devices: T-Safe Cu380A, TT380® Slimline, Nova-T 380, Flexi-T. Lasts 5–10 years (TT380® 10 years). A ≥300 mm² device fitted at ≥40 can be kept until the menopause. <b>Effective IMMEDIATELY.</b> <b>Also emergency contraception if fitted within 5 days of the first UPSI, or within 5 days after the earliest estimated ovulation, whichever is later [3].</b> Expect heavier and longer periods initially — <b>counsel upfront; it is the commonest reason for removal</b>. <b>Refer if you are not trained to fit.</b>"},
         {step:"Implant", title:"Etonogestrel implant (Nexplanon®) 68 mg", when:"wants LARC, avoids procedures “down there”", fromLabel:"one needle every 3 years",
          html:"68 mg etonogestrel, 3 years, first-year pregnancy rate below 1%, inserted in the inner upper arm. <b>Start:</b> days 1–5 = immediate cover; any other time = <b>7 days of condoms</b>. <b>Main issue: unpredictable or irregular bleeding (~40%)</b> — see <a href='#sideeffects'>Side effects</a>. Give a card with the insertion date and the removal due date."},
         {step:"POP", title:"Progestogen-only pill — desogestrel 75 mcg first (Cerazette®, Cerelle®, Feanolla®, Zelleta®)", when:"wants a pill, or oestrogen is not allowed", fromLabel:"the default pill when in doubt",
          html:"Desogestrel 75 mcg once daily, continuously — no breaks. A 12-hour missed-pill window; it inhibits ovulation in 97% of cycles (traditional POPs: about 60%), and carries no increase in VTE risk, so it is safe where the COC is contraindicated. Alternatives: drospirenone POP (Slynd®, 4 mg, 24 active/4 placebo regimen with a 24-hour window — missed active pills in the final active-pill week mean omitting the placebo interval; avoid in severe renal impairment or acute renal failure; consider potassium and renal function where there is hyperkalaemia risk, e.g. potassium-sparing drugs or supplements [5]; may help acne); traditional norethisterone (Noriday®) or levonorgestrel (Norgeston®) with a strict 3-hour window — largely superseded, a last resort. <b>Start:</b> days 1–5 = immediate; otherwise condoms/abstinence for <b>2 days</b> (traditional or desogestrel POP) or <b>7 days</b> (drospirenone) [5]."},
         {step:"COC", title:"Combined pill (COC, formerly COCP) — levonorgestrel 30 mcg first (Microgynon 30®, Rigevidon®, Ovranette®, Levest®, Maexeni®)", when:"UKMEC 1–2 and wants cycle control", fromLabel:"lowest-VTE choice",
          html:"Levonorgestrel 150 mcg + ethinylestradiol 30 mcg, one daily for 21 days then a 7-day break — or tricycled. Second-generation: the lowest VTE risk, so start here. <b>Loestrin 20/30® (norethisterone) if a lower oestrogen dose is wanted.</b> <b>Start:</b> days 1–5 = immediate; otherwise <b>7 days of condoms</b>. FSRH prefers tailored regimens — continuous use, or tricycling (3 packs back-to-back then a 4-day break): fewer withdrawal bleeds and fewer escape-ovulation windows; off-licence but standard practice. Acne, PMS or bloating: an anti-androgenic pill — Yasmin®/Lucette® (drospirenone), Marvelon®/Mercilon® or Gedarel® (desogestrel), Femodene®/Millinette® (gestodene) — slightly higher VTE risk than second-generation, so reserve them for a clear indication. Marked acne or hirsutism: co-cyprindiol (Dianette®, Clairette® — cyproterone acetate + ethinylestradiol): higher VTE risk; it should not be used solely for contraception and should be discontinued 3–4 months after acne/hirsutism has adequately improved (check current SPC and MHRA advice). Non-daily combined: the patch (Evra®) weekly ×3 of every 4 weeks — less effective above 90 kg; the ring (NuvaRing®, SyreniRing®), one ring for 3 weeks. Same contraindications and rules as the COC."},
         {step:"DMPA", title:"Depot injection (Sayana Press® SC self-injected · Depo-Provera® IM)", when:"wants privacy or amenorrhoea, but not a LARC", fromLabel:"every 12–13 weeks",
          html:"Depo-Provera® 150 mg intramuscular, or Sayana Press® 104 mg subcutaneous (can be self-administered) — injection interval and late-injection management per current product information/local protocol. <b>Start:</b> days 1–5 = immediate; otherwise 7 days of condoms. Counsel: irregular bleeding then amenorrhoea · weight gain is variable and not inevitable · bone-density effects are generally reversible, but assess bone risk (avoid if there is osteoporosis risk) · <b>review at least every 2 years</b> rather than renewing indefinitely · delayed return to fertility (median 9–10 months, up to 1 year), so not a preferred method if pregnancy is wanted soon."},
         {step:"Barrier", title:"Condoms, diaphragm and fertility awareness", when:"declines or cannot use the above", fromLabel:"and alongside everything else",
          html:"Typical-use failure ~13–24% (condoms 13–18%; 82% typical-use effectiveness) — be honest about it. Condoms are the only method that protects against STIs, so promote them alongside every hormonal and intrauterine method (dual protection), especially with a new partner."}
       ]},
       {b:"warn", html:"<b>Check before prescribing:</b> always check the current SPC, local formulary/PGD and current FSRH guidance. Brand availability, licensed duration, regimen and missed-dose advice may change — particularly for Mirena®, Levosert® and Benilexa®, the drospirenone POP, Evra® and vaginal rings, emergency contraception, and Sayana Press® and Depo-Provera®."},
       {b:"warn", html:"<b>Quick-start rule (FSRH):</b> if you are reasonably certain she is not pregnant, <b>start ANY method today</b> — do not send her away to wait for a period. If pregnancy cannot be fully excluded but the risk is ongoing: quick-start the pill or implant anyway (it is not harmful to an early pregnancy) and test in 3 weeks; do not insert an LNG-IUD where pregnancy cannot reasonably be excluded (a Cu-IUD may still be appropriate as EC within the permitted timeframe). Contraception can be started at any point in the cycle, or from <b>21 days post-delivery</b>."},
       {b:"say", html:"The coil and the implant are the most effective options and you can forget about them once they’re in — but the best method is the one that fits your life, and if it doesn’t suit you we can switch without any gap in protection. Whatever we pick, condoms are still the only thing that protects against infections."}
     ]},

    {id:"rules", nav:"The rules", title:"Missed pills, vomiting and diarrhoea — what to tell her", sub:"Incorrect missed-pill advice is a major driver of contraceptive failure in UK primary care. Give these rules in writing at the first prescription.",
     blocks:[
       {b:"warn", html:"<b>Which products?</b> The COC rows apply to standard monophasic 20–35 microgram ethinylestradiol COCs used in a 21/7 regimen. They do not apply to Qlaira®, Zoely®, Eloine®, estetrol-containing products or other non-standard regimens — follow the product-specific instructions or FSRH guidance [6]. Check the current SPC before advising."},
       {b:"table", head:["Situation","Rule","Extra"], rows:[
         ["<b>COC — ONE pill missed (24–48 h late)</b>","<b>Take it now and continue the pack</b>","<b>No extra precautions needed</b> (current FSRH missed-pill rule; the legacy pathway’s more cautious reading was “more than 24 hours late → condoms for 7 days”)"],
         ["<b>COC — TWO or more missed (&gt;48 h)</b>","<b>Take the most recent pill now and use condoms for 7 days</b>","If missed in week 1 with unprotected sex → consider EC. If missed in week 3 → run the packs together and skip the break"],
         ["<b>POP late</b>","Traditional POP &gt;3 h · desogestrel &gt;12 h · drospirenone (Slynd®) &gt;24 h = missed","Take it now. Additional precautions: <b>48 hours</b> for traditional and desogestrel POPs, <b>7 days</b> for drospirenone [5]. Drospirenone: missed active pills in the final active-pill week → omit the placebo interval. Consider EC if there was UPSI before protection was re-established"],
         ["<b>Vomiting after a pill</b>","If vomiting occurs soon enough after a dose that absorption may be incomplete, follow the product information — for many oral contraceptives this is within 3 hours, although some products use a 2-hour threshold. Take another pill","Persistent vomiting or diarrhoea for more than 24 hours → follow the missed-pill rules for each day, or use a barrier method until 7 days after it settles"],
         ["<b>Patch or ring detached, removed or delayed</b>","Management depends on the week of use (1, 2 or 3), how long the patch or ring was detached, and whether the hormone-free interval has been extended — not a blanket “two missed pills” rule","Follow the FSRH CEU incorrect-use guidance or product information for condoms ± EC [6]"],
         ["<b>DMPA late (&gt;14w — more than 14 weeks from the last injection)</b>","<b>Pregnancy test, condoms, and EC may be needed</b>","<b>Re-inject once pregnancy is excluded (or bridge with the POP)</b> — follow current product information/local protocol, as Depo-Provera® and Sayana Press® intervals differ"]
       ]},
       {b:"kv", rows:[
         ["Interactions she should know","St John’s Wort — available over the counter — reduces hormonal contraceptive efficacy. Broad-spectrum antibiotics do NOT reduce COC efficacy (FSRH 2017); no additional precautions are needed routinely"],
         ["Written instructions","Provide the missed-pill and sickness rules in writing at first prescribing, and signpost how to access EC"]
       ]},
       {b:"why", html:"The week-1 versus week-3 asymmetry: <b>the hormone-free interval is when the ovary wakes up</b>. Missing pills adjacent to the break stretches it beyond 7 days — EC territory in week 1, skip-the-break in week 3. <b>Tailored and continuous regimens delete the problem</b>, which is another reason FSRH prefers them. FSRH updated its missed-pill guidance in 2011, and the old advice that antibiotics reduce efficacy was wrong and has been corrected — repeating it undermines confidence in everything else you say."}
     ]},

    {id:"ec", nav:"Emergency", title:"Emergency contraception — always offer the coil", sub:"Three options, in order of effectiveness. The commonest error is not offering the copper IUD.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1st", title:"Copper IUD", when:"within 5 days of the first UPSI, or within 5 days after the earliest estimated ovulation — whichever permits the later insertion", fromLabel:"most effective",
          html:"The most effective EC — especially important when UPSI occurred earlier in the cycle or there have been multiple episodes [3] — unaffected by BMI or enzyme inducers, and it provides ongoing contraception. <b>FSRH: offer it to ALL women requesting EC</b> — arrange fitting, and bridge with oral EC plus a quick-started method if the fitting is delayed."},
         {step:"weight", title:"Weight and enzyme-inducer rule", when:"before choosing an oral EC", fromLabel:"applies to levonorgestrel", html:"A 1.5 mg levonorgestrel dose should NOT be used above 70 kg or BMI above 26 — give the 3 mg double dose (as in the SPS national PGD — check local PGD and commissioning [4]), or preferably a Cu-IUD or ulipristal. Enzyme inducers reduce the efficacy of BOTH oral ECs, which makes the Cu-IUD the reliable choice (or a doubled LNG dose if the coil is declined)."}, {step:"2nd", title:"Ulipristal acetate 30 mg (ellaOne®)", when:"within 120 hours", fromLabel:"if the IUD is declined or unavailable",
          html:"More effective than levonorgestrel, especially at 72–120 hours and around ovulation (about 85% efficacy at 72–120 h, versus below 60% for LNG-EC). <b>Delay starting or restarting progestogen-containing contraception for 5 days</b> (progestogen blunts UPA), then use condoms until the method is effective. Follow the specific FSRH exception for an established CHC user with the defined missed-pill scenario — use the current FSRH EC algorithm [3]. Repeat the dose if she vomits within 3 hours. Breastfeeding: after a single 30 mg dose, breastfeeding can continue without interruption (FSRH EC amendment, April 2026) — confirm current FSRH advice if local medicines information has not yet been updated [3]. Avoid if she is on an enzyme inducer, or on high-dose oral steroids for severe asthma."},
         {step:"3rd", title:"Levonorgestrel 1.5 mg (Levonelle®)", when:"within 72 hours (licensed); up to 96 hours off-label", fromLabel:"if UPA is unsuitable",
          html:"Double the dose to 3 mg if BMI &gt;26, weight &gt;70 kg, or she is on an enzyme inducer [4]. Efficacy about 95% at ≤24 hours, falling to 58% at 48–72 hours. No effect on an existing pregnancy. Hormonal contraception can be started or continued IMMEDIATELY (condoms for 7 days, or 2 days for desogestrel or traditional POPs; 7 days for drospirenone). Repeat the dose if she vomits within 3 hours."}
       ]},
       {b:"kv", rows:[
         ["Every EC consultation","Quick-start ongoing contraception · offer an STI screen · pregnancy test if the period is more than 7 days late (assess for existing pregnancy, but do not delay EC) · safeguarding radar (age, coercion)"],
         ["Repeat EC","Oral EC can be repeated in the same cycle if there is a further episode of UPSI, provided the chosen product remains clinically appropriate [3]"],
         ["Check before prescribing","Current FSRH EC guidance, the SPC and your local PGD — EC advice has changed recently (April 2026 amendment)"]
       ]},
       {b:"why", html:"LNG-EC is licensed up to 72 hours after UPSI; FSRH supports consideration of use up to 96 hours off-label where appropriate. UPA-EC is licensed up to 120 hours. The Cu-IUD remains the most effective option and should be offered wherever appropriate [3]. UPA-EC maintains about 85% efficacy at 72–120 hours whereas LNG-EC falls below 60% — the difference is clinically meaningful and women should be told about the choice. The copper IUD outperforms both and is the only option whose effectiveness does not decay across the window or with body weight, which is why FSRH asks that it be offered to everyone, not just to the women who mention it."}
     ]},

    {id:"sideeffects", nav:"Side effects", title:"Fix the problem — method by method", sub:"Most discontinuation is an unfixed bleeding problem or an unswitched side effect. Work down these columns before she simply stops.",
     blocks:[
       {b:"table", head:["Problem","Method","Fix, in order"], rows:[
         ["<b>Unscheduled bleeding in the first 3 months</b>","Any new method","Reassure (it settles in most) · check adherence · exclude STI, pregnancy and missed cervical screening — examine if it persists"],
         ["<b>Bleeding beyond 3 months</b>","POP / implant / LNG-IUD","1) Exclude a cause first — pregnancy assessment, STI testing where appropriate, adherence and drug-interaction review, cervical screening status, examination for persistent, post-coital or otherwise concerning bleeding, and endometrial pathology in older patients or those with risk factors · 2) add a levonorgestrel COC for 3 months (off-label) only if CHC is medically suitable — never with a new contraindication to oestrogen · 3) or a 5-day course of mefenamic acid (off-label) · 4) switch method. Irregular bleeding is the commonest reason for stopping; on the POP, no single POP is proven better — trial a different one or switch class"],
         ["<b>Breakthrough bleeding on the COC</b>","COC","Check missed pills, vomiting and interactions · use at least 30 mcg oestrogen (Microgynon 30® rather than a 20 mcg brand) · change the progestogen or generation (e.g. Microgynon → Marvelon® or Femodene®) or try a higher-progestogen pill · consider tricycling · examine and screen if it persists beyond 3 months"],
         ["<b>Nausea, breast tenderness or bloating</b>","CHC","Usually settles within 3 months — take it at night with food. Persistent bloating or fluid retention → trial a drospirenone pill (Yasmin®). Breast tenderness → a lower oestrogen dose (20 mcg, e.g. Loestrin 20® or Gedarel 20®) or a change of route"],
         ["<b>Low mood or reduced libido</b>","CHC → or any method","Trial a different progestogen, or switch to a non-hormonal method or LARC. Screen for depression — do not reflexively blame the pill, and do not add an antidepressant without trying a method switch first"],
         ["<b>Acne worse</b>","POP / implant / LNG-IUD (androgenic)","Switch to the drospirenone POP (Slynd®), or to a COC if eligible (Gedarel®; co-cyprindiol/Dianette® if severe — time-limited)"],
         ["<b>Headaches in the pill-free week</b>","COC","Tailored or continuous regimen — delete the break (tricycling: 3 packs back-to-back)"],
         ["<b>NEW migraine aura on CHC</b>","COC / patch / ring","STOP the oestrogen immediately → switch to a POP or LARC the same day (UKMEC 4)"],
         ["<b>Weight gain</b>","DMPA (the only method with evidence)","Counsel that weight gain on DMPA is variable and not inevitable; if troublesome switch to the implant, LNG-IUD or POP. For other methods there is no consistent causal evidence — explore other causes"],
         ["<b>DMPA bone-density concern</b>","DMPA","Review at least every 2 years (bone-density effects are generally reversible, but assess risk); FSRH advises reassessing DMPA use after 2 years in women under 18. At age 50 → advise switching to another method (see <a href='#special'>Special groups</a>)"],
         ["<b>Copper IUD — heavier, more painful periods</b>","Cu-IUD","Exclude other causes, then tranexamic acid plus mefenamic acid (off-label where applicable) for the first few months; if it persists and is unacceptable, switch to the LNG-IUD (which lightens bleeding)"],
         ["<b>Post-insertion aftercare questions</b>","Implant / IUD / LNG-IUD","Implant: arm bruising is normal for about a week. IUD: period-type cramps for 24–48 hours. Check the threads 4–6 weeks after fitting. Contact us for pain, fever, missing threads or pregnancy symptoms"]
       ]},
       {b:"cards", cols:2, items:[

         {tone:"cream", h:"💬 Mood, and being believed", html:"Some women do experience mood changes on hormonal contraception. Validate it and offer alternatives. <b>The progestogen in DMPA may affect mood — monitor.</b> A large Danish cohort study (Skovlund et al, JAMA Psychiatry 2016, about 1 million women) found a modest increase in the risk of depression with hormonal contraception — real, but with a large number needed to harm. Women deserve accurate information rather than minimisation, and it is not evidence-based to prescribe an antidepressant alongside hormonal contraception without first trialling a method switch."}
       ]},
       {b:"warn", html:"Persistent unscheduled bleeding is never just “the method” until you have excluded pregnancy, chlamydia, cervical pathology and missed screening — examine, test, then troubleshoot hormonally. Pregnancy, STIs, adherence, drug interactions and (in older patients or those with risk factors) endometrial pathology come first, and most hormonal bleeding treatments are off-label."}
     ]},

    {id:"switch", nav:"Switching", title:"Switching methods without a gap", sub:"One rule generates this whole table: never leave a window where neither method is established.",
     blocks:[
       {b:"table", head:["From → To","How","Extra precautions"], rows:[
         ["<b>COC → POP</b>","<b>Start the POP the day after ANY COC pill (skip the break)</b>","<b>None if no break was taken</b>"],
         ["<b>POP → COC</b>","<b>Start the COC immediately</b>","<b>7 days of condoms</b>"],
         ["<b>Pill → implant / LNG-IUD / injection</b>","<b>Overlap: fit or inject while she continues the pill for 7 more days</b>","Covered by the overlap"],
         ["<b>Implant / LNG-IUD / DMPA → pill</b>","Start the pill 7 days before removal (or by 14 weeks from the last DMPA)","Covered by the overlap"],
         ["<b>Cu-IUD → hormonal method</b>","<b>Start the hormonal method 7 days BEFORE the coil is removed</b>","Sperm survive 7 days — removal after recent unprotected sex risks pregnancy"],
         ["<b>Anything → Cu-IUD</b>","<b>Fit at any time (immediate cover)</b>","<b>None</b>"]
       ]},
       {b:"why", html:"The single rule behind this table: <strong>never leave a window where neither method is established</strong>. Overlap by the new method’s own time-to-effective — 7 days for most, 2 days for desogestrel or traditional POPs, 7 days for drospirenone, none for the copper IUD."}
     ]},

    {id:"lifestyle", nav:"Counselling", title:"Counselling, adherence and STI prevention", sub:"The non-prescribing half of the consultation — and the half that determines whether the method is still in use in a year.",
     blocks:[
       {b:"table", head:["Topic","What to advise","Why / effect"], rows:[
         ["<b>Effectiveness, honestly</b>","Counsel on typical-use failure rates and that LARC is the most effective","Discussing bleeding-pattern expectations up front improves continuation — the expectation, not the bleeding, is usually what fails"],
         ["<b>STI protection</b>","No method except condoms protects against STIs. Discuss dual protection, especially with new partners, and offer chlamydia screening","Recommend condoms alongside a hormonal method wherever there is STI risk"],
         ["<b>Smoking cessation</b>","A mandatory discussion for every CHC user — refer to the NHS Stop Smoking service","Smoking and oestrogen synergistically increase cardiovascular risk; cessation substantially reduces VTE and stroke risk. CHC is contraindicated at ≥35 years with ≥15 cigarettes/day"],
         ["<b>BP, BMI and modifiable arterial risk</b>","<b>Address BP, BMI and smoking before and during CHC use</b>","These are the three modifiable inputs to the UKMEC category she sits in"],
         ["<b>Drug interactions the patient should know</b>","St John’s Wort (over the counter) reduces efficacy. Broad-spectrum antibiotics do NOT (FSRH 2017)","Prevents both an unplanned pregnancy and unnecessary condom use"],
         ["<b>Sickness protocol</b>","Vomiting soon after a pill (within 3 hours for many products, 2 hours for some — check the product information) → take another pill. Severe diarrhoea lasting more than 24 hours → use a barrier method","<b>Provide written instructions at first prescribing</b>"],
         ["<b>Implant and IUD aftercare</b>","Implant: arm bruising is normal for a week. IUD: period-type cramps for 24–48 hours. Check the threads 4–6 weeks after LNG-IUD/Cu-IUD insertion","<b>Contact us for pain, fever, missing threads or pregnancy symptoms</b>"],
         ["<b>Mood and mental health</b>","Validate reported mood change and offer alternatives; monitor mood on DMPA","Skovlund et al, JAMA Psychiatry 2016 (about 1 million women): a modest increase in depression risk — real, but the number needed to harm is large"],
         ["<b>Cervical screening</b>","Ensure screening is up to date: in England, ages 25–64 every 5 years after an HPV-negative result (NHS Cervical Screening Programme, from 1 July 2025), sooner if HPV-positive","Hormonal contraception does not increase cervical cancer risk — HPV infection is the driver"],
         ["<b>Access and continuity</b>","Explain how to get EC quickly, and that sexual health clinics offer direct access to the full range including LARC","Removes the delay that turns a missed pill into a pregnancy"]
       ]},
       {b:"why", html:"Incorrect missed-pill advice is a major driver of contraceptive failure in UK primary care, and out-of-date antibiotic advice is still being given. LARC counselling should explicitly address the benefit of having no doses to miss — that is the mechanism behind the effectiveness difference, and saying it plainly is more persuasive than quoting percentages."}
     ]},

    {id:"monitor", nav:"Monitor", title:"Follow-up, monitoring and safety-net scripts", sub:"Short, method-specific and mostly opportunistic — with four things that must not be missed.",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["<b>CHC review</b>","<b>3 months after starting, then annually</b>","BP (mandatory) + BMI + new UKMEC flags (new migraine or aura? BP? smoking?); reassess eligibility as the history changes; issue 12 months at a time"],
         ["<b>POP / implant / LNG-IUD</b>","<b>Annual, opportunistic</b>","Bleeding pattern and satisfaction; no routine bloods or examinations needed"],
         ["<b>DMPA</b>","<b>Injection interval per product information (Depo-Provera® / Sayana Press®); review at least every 2 years</b>","Bone-density risk–benefit, weight trend, ongoing preference. At 50, advise switching to another method; if continued, document an individualised benefit–risk assessment"],
         ["<b>Implant</b>","<b>Replace at 3 years; annual opportunistic arm check</b>","Confirm the device is still palpable; give a card with the insertion and removal-due dates"],
         ["<b>IUD / LNG-IUD</b>","Teach the thread check. The legacy pathway advised a thread check 4–6 weeks after insertion; FSRH does not mandate routine follow-up, so review at ~6 weeks if there are problems","Confirm the threads are palpable at the cervical os; if missing → ultrasound to confirm the device is in situ. Ask about pain, fever and discharge; pain, dyspareunia or missing threads → examine ± ultrasound"],
         ["<b>First pill review (COC or POP)</b>","<b>At 3 months</b>","BP recheck, side effects, adherence, satisfaction; address bleeding changes (with the LNG-IUD or implant, spotting is expected for up to 6 months)"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"📞 Call 999", html:"After Cu-IUD or LNG-IUD fitting: severe abdominal pain with fever and haemodynamic instability — uterine perforation or sepsis. On the COC: unilateral leg swelling, chest pain or breathlessness — VTE or PE. “Severe tummy pain with a fever after a coil fitting, or chest pain and breathlessness on the pill — that’s a 999 call, not a wait-and-see.”"},
         {tone:"amber", h:"🟠 Same-day", html:"A positive pregnancy test on contraception · missing IUD threads · a new severe headache on the COC (possible migraine with aura — stop it immediately) · signs of PID after an IUD."},
         {tone:"red", h:"🛑 Stop the CHC and seek help", html:"New migraine with aura · severe calf pain or swelling (VTE) · chest pain or breathlessness (PE) · sudden neurological symptoms. Say it as a sentence she will remember, and write it down."},
         {tone:"blue", h:"🩺 Routine review", html:"Unscheduled bleeding beyond 3 months (exclude STI, pregnancy and pathology) · LARC approaching expiry · turning 50 on CHC or DMPA · planning a pregnancy."}
       ]},
       {b:"say", html:"Three things to take away. Come back at three months so I can check your blood pressure and how you’re getting on. If you miss pills, the rules are on this leaflet — and there’s no such thing as a silly question about them. And if you get a new headache with visual changes, calf pain, or chest pain and breathlessness, stop the pill and contact us straight away."},
       {b:"why", html:"Blood pressure monitoring at 3 months and annually is recommended in FSRH combined hormonal contraception guidance and is evidence-based — new hypertension on the COC occurs in approximately 5% of users and requires a method switch. A thread check about 6 weeks after fitting covers the highest-risk period for expulsion (a 5% first-year rate) and perforation (1–2 per 1000 insertions). DMPA bone-density reduction is clinically significant in adolescents, and FSRH recommends reassessing DMPA use after 2 years in women under 18."}
     ]},

    {id:"special", nav:"Special groups", title:"Special situations — the over-40s, postpartum, and the interfaces", sub:"Only the groups where management genuinely differs, and the questions that come up in every clinic.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"🕐 Age 50 — stop CHC; advise switching from DMPA", html:"<b>Advise women to stop CHC at age 50</b> and change to a safer alternative (POP, implant, LNG-IUD, copper IUD or barrier methods). <b>DMPA: at 50, advise switching to another method</b> because safer alternatives are available; if DMPA is continued, document an individualised benefit–risk assessment and review regularly [7]. The legacy pathway’s <b>“over 50: contraception until 2 years after the LMP”</b> was wrong: in the non-hormonal rule below it is 1 year of amenorrhoea at 50 or over, and 2 years under 50."},
         {tone:"blue", h:"🧮 Stopping in the 40s and 50s", html:"Non-hormonal contraception: stop after 2 years of amenorrhoea if under 50, or 1 year if 50 or over. <b>CHC: do not use FSH to determine menopause.</b> <b>POP, implant or LNG-IUD: usually continue until 55</b>, or — if she is over 50 and wants to stop earlier — follow the specific FSRH FSH pathway (measurements generally about 1–2 months apart; a single raised FSH may suffice depending on the method and context; if FSH is above 30, continue for one more year then stop) [7]. <b>HRT is not contraception.</b> An LNG-IUD fitted at ≥45 can be retained to 55; a ≥300 mm² copper device fitted at ≥40 can be kept until the menopause."},
         {tone:"amber", h:"🌡️ The HRT interface", html:"<b>HRT is NOT contraception.</b> Use the POP alongside HRT, or the 52 mg LNG-IUD as the progestogen arm of HRT (change after 5 years in that role, irrespective of the longer contraceptive licence [7]). See the <a href='hrt-prescribing.html'>HRT prescribing protocol</a>. Unexplained post-menopausal bleeding aged 55 or over that is not attributable to HRT is a suspected cancer pathway referral (NICE NG12, updated April 2026); unscheduled bleeding on HRT is assessed per current BMS guidance (2024) and local pathways — neither is a contraceptive side effect."},
         {tone:"green", h:"👶 Postpartum and breastfeeding", html:"<b>Fertility returns from day 21.</b> POP and implant: any time, including immediately. CHC: not before 6 weeks if breastfeeding (UKMEC 4), and not before 3 weeks (&lt;3 weeks) regardless. Cu-IUD/LNG-IUD: within 48 hours of delivery, or wait 4 weeks. Lactational amenorrhoea is reliable only if under 6 months (&lt;6 months) postpartum, amenorrhoeic and fully breastfeeding."},
         {tone:"cream", h:"🧒 Under 16s and safeguarding", html:"Assess capacity and document Fraser criteria. Under 13 is always a safeguarding referral. Any concern about coercion, exploitation or trafficking → safeguarding referral before prescribing. Adolescents needing enhanced support can be referred to sexual health services."},
         {tone:"blue", h:"💊 Enzyme inducers and complex medical disease", html:"Carbamazepine, phenytoin, rifampicin, St John’s Wort and some antiretrovirals → use DMPA, the copper IUD or the LNG-IUD. Lamotrigine: CHC lowers lamotrigine levels — prefer non-oestrogen methods or take specialist advice. Post-bariatric surgery, multiple UKMEC 3 conditions, HIV, transplant or autoimmune disease on immunosuppressants → specialist contraception advice."}
       ]}
     ]},

    {id:"loop", nav:"Not responding?", title:"Unhappy with the method? Re-run before she just stops", sub:"Most discontinuation is an unfixed bleeding problem or an unswitched side effect — and unplanned pregnancy follows.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"1 · Bleeding", html:"Pregnancy, STI, adherence, interactions, cervix (and endometrium if at risk) excluded, then the off-label 3-month COC (only if CHC suitable) or mefenamic rescue tried?"},
         {tone:"blue", h:"2 · Side effect", html:"Progestogen type switched? Different method class offered?"},
         {tone:"blue", h:"3 · Adherence", html:"Is the real problem remembering? \u2192 LARC conversation again"},
         {tone:"blue", h:"4 · New UKMEC", html:"New aura/BP/VTE \u2014 does the method need to CHANGE for safety?"},
         {tone:"amber", h:"5 · Bridge", html:"Never remove/stop one method without the next one already effective"}
       ]},
       {b:"cards", items:[
         {tone:"green", h:"Genuinely unsuitable?", html:"Then move her to <b>a different tier</b>, or refer to the <b>sexual health clinic</b> \u2014 an onward route, never a stop with nothing after it."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — who, when, how urgently", sub:"Most contraception is primary care. These are the exceptions, with the NG12 thresholds restated.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999 / emergency", html:"Severe abdominal pain with fever and haemodynamic instability after Cu-IUD or LNG-IUD insertion (perforation, sepsis) · suspected PE or VTE on the COC (chest pain, breathlessness, unilateral leg swelling)."},
         {tone:"red", h:"Urgent gynaecology", html:"Suspected IUD perforation with acute symptoms · PID with intrauterine contraception in situ: review after 48–72 hours — if clinically improving the device can usually remain; if there is no improvement, consider removal with specialist advice, assessing pregnancy risk and ongoing contraceptive needs · Actinomyces on a cervical smear in a symptomatic woman."},
         {tone:"purple", h:"Suspected cancer pathway referral · NICE NG12 (updated April 2026)", html:"Contraception itself is not an NG12 criterion — but these NG12 criteria arise in this consultation and take precedence over the prescribing decision:<br>• Unexplained post-menopausal bleeding aged 55 and over that is not attributable to HRT → suspected cancer pathway referral for endometrial cancer. Aged under 55 with post-menopausal bleeding → consider a suspected cancer pathway referral. Unscheduled bleeding on HRT → assess per BMS joint guideline (2024).<br>• An appearance of the cervix consistent with cervical cancer → consider a suspected cancer pathway referral, without waiting for a smear result.<br>• An unexplained breast lump aged 30 and over → breast suspected cancer pathway referral.<br>• Visible haematuria aged 45 and over (without a UTI, or persisting after treatment) → bladder and renal suspected cancer pathway referral.<br>NICE NG12 applies to England — follow local referral pathways. Post-menopausal bleeding means bleeding more than 12 months after the menopause; HRT-related bleeding follows current BMS guidance and local pathways. Abnormal vaginal bleeding in a premenopausal patient is not automatically a suspected cancer referral, but persistent or concerning symptoms need assessment and safety-netting [10].<br>Undiagnosed abnormal vaginal bleeding must be investigated before hormonal contraception is started — it can mask malignancy.", src:"NICE NG12 (updated April 2026)"},
         {tone:"amber", h:"Sexual health / contraception clinic", html:"LARC fitting where it is not done in-house · complex UKMEC 3–4 scenarios · a difficult cervix or a previously failed insertion · adolescents requiring enhanced support. Follow current local sexual-health/LARC pathways (Greater Manchester [11]). GPs with DFSRH or DRCOG training fit IUDs and implants — but this needs formal training and ongoing competency, and an untrained GP should refer for LARC insertion rather than default to a user-dependent method with a higher failure rate."},
         {tone:"blue", h:"Gynaecology (routine)", html:"Failed or problematic IUD removal · lost threads (ultrasound ± abdominal X-ray first; if the device is not seen → gynaecology, assume expulsion and give EC plus an interim method meanwhile) · a failed or deep implant removal → the specialist removal service · sterilisation requests."},
         {tone:"blue", h:"Specialist contraception advice", html:"Enzyme-inducing medication in someone needing highly effective contraception · multiple UKMEC 3 conditions · medically complex patients (HIV, transplant, autoimmune disease on immunosuppressants) · post-bariatric surgery."},
         {tone:"amber", h:"Oncology liaison", html:"Breast cancer, current or recent, in a woman requesting contraception — the copper IUD is likely to be the only option; confirm with the oncology team."},
         {tone:"green", h:"GP manages", html:"All standard UKMEC 1–2 prescribing · follow-up and side-effect management · switching between methods · emergency contraception (both LNG-EC and UPA-EC) · quick-starting · sterilisation counselling (vasectomy is safer and simpler than tubal occlusion) with referral per the local pathway and interim contraception ensured."}
       ]},
       {b:"say", html:"Fitting a coil or an implant is a short procedure, and if we don’t do it here I can refer you to the clinic that does — you can also go to them directly. In the meantime we’ll start something today so you’re not left unprotected while you wait."},
       {b:"why", html:"Sexual health clinics offer same-day access to the full contraceptive range including LARC, EC and STI services, and patients should be told that direct access exists. Referring for LARC rather than defaulting to a pill is the right call for an untrained prescriber — the failure-rate difference between tiers is larger than any difference between brands within a tier."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only — the Casebook keeps the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 34-year-old woman asks to restart “the pill” she was on years ago. She has two children, a BMI of 36, smokes 10 a day, and mentions in passing that she has started getting “flashing lights” before her headaches. She wants something she cannot forget to take, but says a friend gained weight on the injection and she is put off coils."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Elicits the <b>aura</b> and recognises it as <b>UKMEC 4 for any combined method</b>, without becoming the doctor who says no and stops there; documents <b>BP and BMI</b>; screens for <b>enzyme inducers and VTE history</b>; counsels by <b>effectiveness</b> (LARC first-year failure below 1% versus the pill at ~9% typical-use failure) while genuinely exploring her worry about coils; <b>quick-starts a desogestrel POP today</b> with the 12-hour window and 2 days of condoms explained; offers <b>chlamydia screening and condoms for dual protection</b>; checks <b>cervical screening</b>; raises <b>smoking cessation</b>; and safety-nets <b>bleeding beyond 3 months</b> and the <b>stop-the-pill</b> features. <a href='../../cases/contraception.html'>Open the full casebook chapter →</a>"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Numbered references [1]–[19] in the text link each high-risk recommendation to its source below.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>[1] UK Medical Eligibility Criteria for Contraceptive Use \u2014 UKMEC 2025 (CoSRH); Summary of key changes, 2 December 2025<br><a href="https://www.fsrh.org/ukmec" rel="noopener">fsrh.org/ukmec</a><span class="rd"> \u2014 every category on this page, and the online tool (ukmec.org) for use in the consultation</span></li>'+
         '<li>[9] NICE CG30 (2005, updated 2019) \u2014 Long-acting reversible contraception; [12] NICE PH51 (2014) \u2014 Contraceptive services for under-25s<br><a href="https://www.nice.org.uk/guidance/ph51" rel="noopener">nice.org.uk/guidance/ph51</a><span class="rd"> \u2014 offer everyone a choice of all methods including LARC (a choice, not a default); cost-effectiveness depends on assumptions, continuation and local prices</span></li>'+
         '<li>[10] NICE NG12 \u2014 Suspected cancer: recognition and referral (2015, updated April 2026; applies to England)<br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> \u2014 unexplained post-menopausal bleeding at 55+ not attributable to HRT (endometrial recommendations amended April 2026), consider referral under 55, cervical appearance consistent with cancer, unexplained breast lump at 30+, and visible haematuria at 45+</span></li>'+
         '<li>[13] British Menopause Society joint guideline (with RCOG, BGCS, BSGE, FSRH, RCGP and GIRFT) \u2014 Management of unscheduled bleeding on HRT (2024; updated May 2026)<br><a href="https://thebms.org.uk/publications/bms-guidelines/management-of-unscheduled-bleeding-on-hormone-replacement-therapy-hrt/" rel="noopener">thebms.org.uk</a><span class="rd"> \u2014 assessment of unscheduled bleeding in women taking HRT, which NG12 (April 2026) now separates from the post-menopausal bleeding referral criterion</span></li>'+
         '<li>[14] NHS England \u2014 NHS Cervical Screening Programme: 5-yearly screening for HPV-negative people aged 25\u201364 (from 1 July 2025)<br><a href="https://www.england.nhs.uk/2025/06/nhs-rolls-out-more-personalised-cervical-screening-for-millions/" rel="noopener">england.nhs.uk</a><span class="rd"> \u2014 the screening interval quoted in the health-promotion table</span></li>'+
         '<li>[15] FSRH \u2014 Quick Starting Contraception (2017) and Quick Start guidance (2023)<span class="rd"> \u2014 start any method today when pregnancy is reasonably excluded; the 21-day and 3-week test rules</span></li>'+
         '<li><b>[3] FSRH Clinical Guideline \u2014 Emergency Contraception (March 2017, amended April 2026)</b><span class="rd"> \u2014 offer the copper IUD to all and its timing rule; UPA versus LNG across the window; the 5-day rule after UPA and its CHC exception; breastfeeding can continue after UPA; repeat oral EC in the same cycle</span></li>'+
         '<li>[4] SPS \u2014 Levonorgestrel emergency contraception national PGD template (2024)<br><a href="https://www.sps.nhs.uk" rel="noopener">sps.nhs.uk</a><span class="rd"> \u2014 LNG-EC to 96 hours, and 3 mg above BMI 26 or weight 70 kg or with an enzyme inducer; check local PGD and commissioning</span></li>'+
         '<li>[2] FSRH Clinical Guideline \u2014 Intrauterine Contraception (March 2023, amended January 2025)<span class="rd"> \u2014 LNG-IUD terminology, pregnancy exclusion before insertion, STI testing at insertion, 52 mg LNG-IUD duration</span></li>'+
         '<li>[5] FSRH Clinical Guideline \u2014 Progestogen-only Pills (August 2022, amended April 2026)<span class="rd"> \u2014 desogestrel, traditional and drospirenone POP start and missed-pill rules, drospirenone renal and potassium cautions</span></li>'+
         '<li>[6] FSRH CEU Guidance \u2014 Recommended Actions after Incorrect Use of Combined Hormonal Contraception (March 2020, amended July 2021)<span class="rd"> \u2014 product scope of the COC missed-pill rules, and patch and ring errors by week of use</span></li>'+
         '<li>[8] FSRH CEU statement \u2014 Antibiotic cover for urgent insertion of intrauterine contraception in women at high risk of STI (May 2019)<span class="rd"> \u2014 testing at the time of insertion</span></li>'+
         '<li>[16] FSRH \u2014 Combined Hormonal Contraception, Progestogen-only Injectables and Progestogen-only Implants guidelines<span class="rd"> \u2014 tailored and continuous regimens, the 3-month COC or mefenamic acid rescue for problematic bleeding, DMPA review at 2 years, and the antibiotic correction (2017)</span></li>'+
         '<li><b>[7] FSRH Clinical Guideline \u2014 Contraception for Women Aged over 40 Years (August 2017, amended May 2025)</b><span class="rd"> \u2014 stopping CHC at 50 and counselling a switch from DMPA, continuing to 55, the FSH pathway, 52 mg LNG-IUD duration and the 5-year HRT limit, and device retention at 40 and 45</span></li>'+
         '<li><b>[17] BASHH guidelines</b><span class="rd"> \u2014 STI testing and PID management, including review at 48–72 hours with intrauterine contraception in situ</span></li>'+
         '<li>[18] Skovlund CW et al. Association of hormonal contraception with depression. JAMA Psychiatry / Danish national cohort, reported 2016 (~1 million women)<span class="rd"> \u2014 the modest increase in depression risk quoted in the counselling section</span></li>'+
         '<li><b>[19] BNF and the SPCs</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> \u2014 all doses, brands, licences and durations: verify before prescribing</span></li>'+
         '<li>[11] Greater Manchester Medicines Management Group formulary and local PGDs<br><a href="https://www.greatermanchesterformulary.nhs.uk" rel="noopener">greatermanchesterformulary.nhs.uk</a><span class="rd"> \u2014 local formulary, PGDs and current sexual-health/LARC pathways for Bolton and Greater Manchester</span></li>'+
         '<li><b>Document control</b><span class="rd"> \u2014 version 2.0; evidence checked against UKMEC 2025 and the FSRH EC amendment (April 2026); approval group and responsible clinical owner to be recorded locally. Annual review, with an earlier update triggered by changes to UKMEC, EC guidance, product licences, MHRA safety alerts, the local formulary or PGDs, or NICE NG12</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Contraceptive counselling and prescribing in primary care \u2014 UKMEC 2025 (CoSRH), FSRH clinical guidelines current at the date of review, NICE CG30/PH51/NG12 (suspected cancer, updated April 2026), BASHH guidance and current product information. Assessment and prescribing are merged on this page: the former contraception request algorithm is retired. This guide is a practice aid and not a substitute for the current SPC, FSRH, UKMEC and local PGD guidance — check the current SPC, local formulary/PGD and FSRH guidance before prescribing."
});
