<script>
MG.render({
  icon:"💊",
  title:"PPI prescribing and deprescribing — the complete guide",
  eyebrow:"Protocol · NICE CG184 · an acute script, not a repeat",
  stemTitle:"Prescribing the first course as an ACUTE script with a review date is a useful practical habit that helps stop a 4-week course becoming a 4-year one",
  stemSub:"One page for the whole drug class. Confirm the indication, exclude alarm features, use a defined course, test and treat H. pylori appropriately, gastroprotect according to individual GI-bleed risk, avoid omeprazole/esomeprazole with clopidogrel, and review long-term treatment regularly. <b>Choose a formulary PPI at an appropriate dose for the indication</b>, taking account of cost, formulation, swallowing ability, interactions and previous response — PPIs have broadly similar efficacy at appropriate equivalent doses but are not interchangeable milligram-for-milligram. Know the two situations that must not be got wrong: <b>omeprazole and esomeprazole with clopidogrel</b>, and <b>the PPI around investigations</b> — off it for 2 weeks before H. pylori breath or stool testing, and never letting a PPI trial delay an indicated endoscopy or suspected cancer referral (follow the local endoscopy service's instructions rather than routinely stopping it). Then review long-term PPIs regularly and deprescribe where there is no ongoing indication — warning in advance that transient acid-related symptoms may occur.",
  guideline:"NICE CG184 · NG12 (updated April 2026) · MHRA clopidogrel–PPI advice · GMMMG formulary and antimicrobial guidelines",
  reviewed:"14 September 2026",
  nextReview:"14 March 2027",
  meta:[
    {t:"NICE CG184 · NICE NG12 · MHRA"},
    {t:"Off PPI 2 weeks before H. pylori breath/stool test · don't routinely stop before OGD", tone:"tw"},
    {t:"On clopidogrel: avoid omeprazole and esomeprazole", tone:"tw"},
    {t:"v2.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#before"><b>Before</b><small>Indication · alarm</small></a><a href="#start"><b>Start</b><small>Formulary · defined course</small></a><a href="#gastroprotect"><b>Protect</b><small>Risk-based</small></a><a href="#notresponding"><b>Not working?</b><small>Reassess first</small></a><a href="#deprescribe"><b>Deprescribe</b><small>Check indication</small></a></div>',
  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ The PPI around investigations: H. pylori washout, and never delay the endoscopy", html:"PPIs cause false-negative H. pylori breath and stool tests — stop the PPI for 2 weeks beforehand (NICE CG184); recent antibiotics or bismuth can also reduce accuracy, so follow the local laboratory or eradication-pathway washout. Do not start or escalate a PPI in a way that delays indicated endoscopy or suspected-cancer referral. If a patient is already taking a PPI, follow the local endoscopy service's instructions; do not routinely stop it unless specifically requested (the routine pre-endoscopy washout was removed from NICE CG184 in 2014). Document the indication and current PPI dose on the referral. Review NSAIDs too. <b>Do not start a PPI that delays a needed investigation</b> — the reflex to \"try a PPI first\" in someone with alarm features is exactly how an upper GI cancer gets a three-month delay."},
    {tone:"red", h:"⛔ On clopidogrel, avoid omeprazole and esomeprazole", html:"<b>Both inhibit CYP2C19 and may reduce clopidogrel activation (MHRA).</b> If clopidogrel and a PPI are both clinically indicated, <b>pantoprazole is a reasonable preferred option; lansoprazole or rabeprazole may also be used according to the local formulary.</b> The MHRA advice should not be extended to all other PPIs. Do not stop clopidogrel without specialist advice. This is one of the commonest avoidable interactions in primary care, because the PPI is often added by a different clinician from the one who started the clopidogrel."},
    {tone:"blue", h:"Choose a formulary PPI for the indication", html:"Choose a formulary PPI at an appropriate dose for the indication, taking account of cost, formulation, swallowing ability, interactions and previous response. PPIs have broadly similar efficacy when used at appropriate equivalent doses, but are not interchangeable milligram-for-milligram. Select the appropriate gastro-resistant formulation according to swallowing ability, enteral-tube requirements, product characteristics, cost and local formulary. <b>Taking it before food</b> often improves efficacy — once daily usually before breakfast; twice daily before breakfast and the evening meal — following the product information."},
    {tone:"amber", h:"Prescribe the first course as an ACUTE script", html:"Full dose for a defined course — dyspepsia 4 weeks; GORD 4 or 8 weeks; severe oesophagitis or ulcer usually 8 weeks — as an acute prescription with a recorded review date, then step down to the lowest effective dose or stop. <b>Only move to a repeat once a long-term need is established.</b> The acute-script-first approach is a useful local prescribing habit."},
    {tone:"amber", h:"Gastroprotect the at-risk, not everyone on an NSAID", html:"Prescribe gastroprotection when the anticipated gastrointestinal bleeding risk from NSAID, antiplatelet or anticoagulant therapy outweighs the harms and burden of a PPI. Weigh the NSAID (dose, duration, standard vs COX-2 selective, concurrent aspirin or antiplatelet), patient factors (previous ulcer or GI bleed, older age or frailty, significant comorbidity, H. pylori) and co-medications (antiplatelets, anticoagulants, corticosteroids, other NSAIDs; an SSRI adds risk in the context of other factors but does not by itself require a PPI). Not every patient on low-dose aspirin or a single antiplatelet needs a PPI. Review the indication whenever the culprit medicine is changed or stopped."},
    {tone:"green", h:"Warn about rebound — but reassess persistent symptoms", html:"Warn that transient acid-related symptoms may occur after reducing or stopping a PPI, particularly after long-term treatment. These may settle over days to weeks and can be managed with an alginate or antacid. <b>If symptoms are persistent, severe, progressive or associated with alarm features, reassess rather than assuming rebound</b> — not every symptom after withdrawal is rebound, and some is recurrence of the original disease."}
  ],
  pathwaySub:"Six steps. The first prevents harm, and the last prevents a lifelong prescription.",
  pathway:[
    {title:"Confirm the indication and screen for alarm features", html:"Document the indication. Review culprit drugs, give lifestyle advice, consider an alginate first. <b>Do not let a PPI trial delay NG12 referral.</b> For uninvestigated dyspepsia, offer H. pylori test-and-treat early (2-week PPI washout first).", alert:true},
    {title:"Choose a formulary PPI and treat for a defined course", html:"An appropriate dose for the indication (e.g. omeprazole 20 mg or lansoprazole 30 mg once daily), usually before breakfast, as an acute script with a review date."},
    {title:"Gastroprotect according to individual GI-bleed risk", html:"Lansoprazole 15–30 mg or omeprazole 20 mg, for the duration of the culprit drug, when bleeding risk outweighs PPI harms. <b>Not omeprazole or esomeprazole with clopidogrel.</b>"},
    {title:"If not responding, reassess before escalating", html:"Check the diagnosis, adherence, timing, NSAIDs and triggers, H. pylori status and whether endoscopy is indicated; then consider dose optimisation, a PPI switch, an alginate or H2-receptor antagonist, or gastroenterology referral. Do not escalate indefinitely."},
    {title:"Review every long-term PPI regularly (at least annually)", html:"Is there a valid long-term indication? If yes, lowest effective dose. If no, deprescribe. Annual review is a practice standard; NICE CG184 says regular review."},
    {title:"Deprescribe, and manage the rebound", html:"Confirm no ongoing indication → stop directly after a short or low-dose course, or reduce gradually over several weeks after prolonged or high-dose use → lowest effective dose, on-demand or stop → alginate or antacid rescue plan; stop the PPI if it was only for gastroprotection and the culprit drug has stopped."}
  ],
  sections:[

    {id:"before", nav:"Before", title:"Step 1 — before you prescribe",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>Confirm the indication</b>","Uninvestigated dyspepsia, GORD, peptic ulcer disease, H. pylori eradication, gastroprotection, Barrett's oesophagus, severe oesophagitis, oesophageal stricture, Zollinger–Ellison syndrome, or specialist-directed or palliative use — follow NICE CG184. Check previous endoscopy and specialist advice. <b>Document the indication on the prescription</b>"],
         ["<b>Review culprit drugs</b>","Stop or reduce drugs that cause or worsen dyspepsia where possible, and note antiplatelet and anticoagulant therapy: NSAIDs, aspirin and antiplatelets, calcium-channel blockers, nitrates, theophylline, bisphosphonates, corticosteroids, SSRIs, TCAs, anticholinergics"],
         ["<b>Lifestyle for all</b>","Weight loss, smaller meals, avoid trigger foods (fatty and spicy, coffee, chocolate, alcohol), stop smoking, don't eat 3–4 hours before bed, raise the head of the bed, manage stress"],
         ["<b>Try an alginate first</b>","Consider a trial of an alginate or antacid (e.g. Gaviscon Advance®) and review in 1 month, if referral is not needed"],
         ["<b>Suspected-cancer referral (NG12)</b>","Dysphagia at any age, or age 55 or over with weight loss plus upper-abdominal pain, reflux or dyspepsia → suspected cancer pathway referral. Do not delay referral to provide a PPI trial"],
         ["<b>Urgent assessment</b>","Haematemesis or melaena, significant or symptomatic anaemia, persistent vomiting with dehydration, an epigastric or upper-abdominal mass, or severe acute abdominal pain"],
         ["<b>Consider non-urgent direct-access endoscopy (NG12)</b>","Age 55 or over with treatment-resistant dyspepsia; upper-abdominal pain with low haemoglobin; raised platelet count with nausea, vomiting, weight loss, reflux, dyspepsia or upper-abdominal pain; or nausea or vomiting with weight loss, reflux, dyspepsia or upper-abdominal pain"],
         ["<b>Uninvestigated dyspepsia: test and treat H. pylori early</b>","After excluding alarm features and reviewing NSAIDs, aspirin and other causative medicines, arrange H. pylori testing where appropriate — 2-week PPI washout before breath or stool testing, and check recent antibiotic or bismuth exposure (follow the local laboratory or eradication-pathway washout). If negative, or symptoms persist after eradication, offer a defined PPI course and reassess the diagnosis if there is no response"],
         ["<b>If H. pylori is detected</b>","Use the current Greater Manchester formulary/antimicrobial guideline rather than a universal fixed regimen. Check previous macrolide, metronidazole, quinolone and eradication-treatment exposure, clarify the nature of any penicillin allergy, and arrange specialist advice after failed eradication. Do not give eradication treatment for uncomplicated GORD solely because reflux is present. Arrange post-treatment testing where indicated (peptic ulcer disease, relapse or specialist advice), with an appropriate washout before the test of cure"]
       ]},
       {b:"warn", html:"PPIs cause false-negative H. pylori tests: stop the PPI for 2 weeks before H. pylori testing (NICE CG184). <b>Do not start or escalate a PPI in a way that delays indicated endoscopy or suspected-cancer referral.</b> If a patient is already taking a PPI, follow the local endoscopy service's instructions; do not routinely stop it unless specifically requested. Document the indication and current PPI dose on the referral. Review NSAIDs too."},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"🍽️ Lifestyle", html:"Weight loss, smaller meals, avoid late eating and triggers, raise the bed-head, reduce alcohol and caffeine."},
         {tone:"blue", h:"📉 Plan the step-down from the start", html:"Step down to the lowest effective dose or on-demand use once healed; avoid an indefinite PPI by default. <b>Avoid leaving patients on full dose indefinitely.</b>"},
         {tone:"green", h:"🚭 Smoking", html:"<b>Stop smoking — it worsens reflux and dyspepsia.</b>"},
         {tone:"blue", h:"💬 Frame it as a course", html:"Telling the patient at the outset that this is a defined course with a review, not a permanent tablet, is what makes the later step-down conversation easy."}
       ]}
     ]},

    {id:"start", nav:"Start", title:"Step 2 — choose a formulary PPI and treat for a defined course",
     blocks:[
       {b:"info", html:"<b>Choose a formulary PPI at an appropriate dose for the indication</b>, taking account of cost, formulation, swallowing ability, interactions and previous response. PPIs have broadly similar efficacy at appropriate equivalent doses, but are not interchangeable milligram-for-milligram. Commonly: omeprazole 20 mg or lansoprazole 30 mg once daily. Prescribe as an ACUTE 1-month script with a review — only move to a repeat once a long-term need is established."},
       {b:"table", head:["PPI","Standard (full) dose","Low / on-demand","High / double dose (specialist advice, documented indication or local pathway)"], rows:[
         ["<b>Omeprazole (1st line)</b>","<b>20 mg once daily</b>","10 mg once daily","40 mg once daily (40 mg BD in severe oesophagitis only on specialist advice or local pathway — not routine primary-care escalation)"],
         ["<b>Lansoprazole (1st line)</b>","<b>30 mg once daily</b>","15 mg once daily","30 mg twice daily"],
         ["<b>Esomeprazole</b>","20 mg once daily","—","40 mg once daily"],
         ["<b>Pantoprazole / rabeprazole</b>","40 mg / 20 mg once daily","20 mg / 10 mg","BD (non-formulary in many areas)"]
       ]},
       {b:"table", head:["Practical point","Detail"], rows:[
         ["<b>Typical courses</b>","\"Full dose\" depends on the indication. Dyspepsia: full dose for 4 weeks. GORD: 4 or 8 weeks depending on the clinical situation. Severe oesophagitis: 8 weeks. Peptic ulcer disease: generally 8 weeks. Long-term maintenance for selected indications only. Record a review date; then step down to the lowest effective dose, or stop"],
         ["<b>How to take</b>","Before food often improves efficacy: once daily usually before breakfast; twice daily before breakfast and the evening meal. Follow the product information and indication"],
         ["<b>Formulation</b>","Select the appropriate gastro-resistant formulation according to swallowing ability, enteral-tube requirements, product characteristics, cost and local formulary — capsules are not intrinsically preferable to tablets"],
         ["<b>Swallowing difficulty or NG tube</b>","Esomeprazole gastro-resistant capsules or dispersible tablets, lansoprazole orodispersible (Fastab), or omeprazole dispersible tablets — see the SPC"]
       ]},
       {b:"why", html:"<b>PPIs are over-prescribed and frequently continued without indication.</b> Front-loading a defined course on an acute script, set at full dose, with the expectation of step-down, is a useful local prescribing habit to help prevent a 4-week course becoming a 4-year one."}
     ]},

    {id:"gastroprotect", nav:"Protect", title:"Step 3 — gastroprotect according to individual GI-bleed risk",
     blocks:[
       {b:"info", html:"Prescribe gastroprotection when the anticipated gastrointestinal bleeding risk from NSAID, antiplatelet or anticoagulant therapy outweighs the harms and burden of a PPI. Review the indication whenever the culprit medicine is changed or stopped. <b>Dose: lansoprazole 15–30 mg or omeprazole 20 mg.</b>"},
       {b:"table", head:["Drug","Gastroprotect when…","Notes"], rows:[
         ["<b>NSAID</b>","Assess the NSAID (dose, duration, standard vs COX-2 selective, concurrent aspirin or antiplatelet); patient factors (previous peptic ulcer or GI bleeding, older age or frailty, significant comorbidity, H. pylori; renal or hepatic impairment is a reason to reconsider the NSAID itself); and co-medications (antiplatelets, anticoagulants, corticosteroids, other NSAIDs, other drugs that increase bleeding risk). An SSRI adds risk alongside other factors but does not alone require a PPI","Co-prescribe the PPI for the duration of the NSAID when risk justifies it; use the lowest NSAID dose and review whether it is needed; stop the PPI when the NSAID stops"],
         ["<b>Aspirin / antiplatelet</b>","Risk-based: prior ulcer or bleed, older or frail, dual antiplatelet therapy, high-dose aspirin, H. pylori, or concurrent NSAID, anticoagulant or corticosteroid (an SSRI adds risk alongside these). Not every patient on low-dose aspirin or a single antiplatelet needs a PPI","<b>Lowest aspirin dose (75 mg); NOT enteric-coated</b>"],
         ["<b>Anticoagulant (DOAC or warfarin)</b>","<b>Prior ulcer or bleed, or on an antiplatelet or NSAID</b>; corticosteroids or an SSRI add to the risk","<b>Monitor INR closely if starting a PPI with warfarin</b>"],
         ["<b>Corticosteroid</b>","Prior ulcer, older age, serious comorbidity, or on an NSAID, anticoagulant, antiplatelet or SSRI","<b>A steroid alone is low-risk; PPI for the steroid course only</b>"]
       ]},
       {b:"warn", html:"Clopidogrel interaction: omeprazole and esomeprazole inhibit CYP2C19 and may reduce clopidogrel activation (MHRA). If clopidogrel and a PPI are both clinically indicated, avoid omeprazole and esomeprazole. Pantoprazole is a reasonable preferred option; lansoprazole or rabeprazole may also be used according to the local formulary — the advice should not be extended to all PPIs. Do not stop clopidogrel without specialist advice."},
       {b:"why", html:"Younger patients under 45 with no GI-bleed risk factors on an NSAID alone usually do NOT need a PPI. Reflexive co-prescribing of a PPI with every NSAID is a major driver of inappropriate long-term use — and the PPI should stop when the precipitating drug stops."}
     ]},

    {id:"notresponding", nav:"Not working?", title:"Step 4 — inadequate control: optimise before escalating",
     blocks:[
       {b:"table", head:["Step","When","Action"], rows:[
         ["<b>4a — check adherence, timing and lifestyle</b>","<b>First move</b>","Check the diagnosis is correct; confirm the PPI is taken daily and before food, and that trigger foods, alcohol, smoking and culprit drugs (NSAIDs, CCBs, nitrates, bisphosphonates) have been addressed; check H. pylori status, whether endoscopy is indicated, and whether symptoms could be cardiac, biliary, pancreatic or functional"],
         ["<b>4b — increase to high or double dose</b>","<b>Adherence and timing confirmed, symptoms persist</b>","Consider dose optimisation (e.g. omeprazole 40 mg OD). High-dose or twice-daily treatment should generally be based on specialist advice, a documented indication (e.g. proven severe oesophagitis) or a local pathway. Review at 4–8 weeks"],
         ["<b>4c — switch to a different PPI</b>","<b>Dose optimised, still symptomatic</b>","Some patients respond to a different PPI — trial an alternative (omeprazole → lansoprazole or esomeprazole) before declaring failure"],
         ["<b>4d — confirm H. pylori status</b>","<b>Not already done (ideally done earlier — see Step 1)</b>","Stop the PPI for 2 weeks (and check recent antibiotic or bismuth exposure), then stool antigen or urea breath test. If positive, treat using the current Greater Manchester formulary/antimicrobial guideline, checking previous macrolide, metronidazole, quinolone and eradication exposure and the nature of any penicillin allergy. After treatment failure, review adherence and antibiotic exposure and seek specialist advice"],
         ["<b>4e — add an alginate, reassess the diagnosis</b>","<b>Breakthrough or atypical symptoms</b>","Add an alginate (Gaviscon Advance®) for breakthrough symptoms, or an H2-receptor antagonist where appropriate. Reconsider functional dyspepsia, cardiac, biliary or pancreatic causes, the need for endoscopy, or gastroenterology referral. Do not escalate indefinitely without reassessing the diagnosis"]
       ]}
     ]},

    {id:"review", nav:"Annual review", title:"Step 5 — review every long-term PPI, at least annually",
     blocks:[
       {b:"info", html:"Every patient on a PPI beyond a defined course needs a regular risk–benefit review — at least annually is a reasonable practice standard (NICE CG184 says regular review). Check indication, dose and formulation, ongoing NSAID/antithrombotic exposure and new alarm features. First decide whether there is a valid indication to continue long-term — if so, use the lowest effective dose; if not, deprescribe."},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"✓ Continue long-term", html:"Subject to specialist documentation: Barrett's oesophagus where maintenance is advised (the lowest effective maintenance dose recommended by the specialist or local pathway), severe oesophagitis (LA grade C or D), oesophageal stricture or previous dilation, Zollinger-Ellison syndrome, recurrent ulcer bleeding or selected high-risk ulcer patients, ongoing high-risk NSAID/antithrombotic gastroprotection, specialist-directed gastroprotection, palliative symptom control. Pancreatic enzyme replacement is not an automatic indication — a PPI may be used in selected patients (e.g. inadequate response to enteric-coated enzymes) on clinical or specialist advice."},
         {tone:"amber", h:"⏸ Don't review yet", html:"Healing courses still within their window, current H. pylori eradication, awaiting or under gastroenterology review or endoscopy, grade 3–4 oesophagitis, immunosuppression or chemotherapy — leave until the course or episode completes."},
         {tone:"green", h:"📉 Step-down candidates", html:"On a healing or high dose with symptoms controlled → step to the lowest maintenance dose and review for stopping 2–3 months later."},
         {tone:"green", h:"🛑 Stop candidates", html:"On maintenance beyond 8 weeks with no valid long-term indication → trial stopping."}
       ]},
       {b:"warn", html:"PPI-associated concerns include hypomagnesaemia, enteric infection including C. difficile, fractures, B12 or iron deficiency, acute interstitial nephritis, and possible pneumonia and other observational associations — but many long-term associations are confounded by age, frailty and comorbidity. Use the lowest effective dose and review the continuing indication. <b>Do not perform routine universal monitoring of magnesium, vitamin B12 or iron solely because a patient is taking a PPI</b>; investigate when there are symptoms, relevant comorbidity, prolonged high-dose therapy, interacting medicines or abnormal blood results."}
     ]},

    {id:"deprescribe", nav:"Deprescribe", title:"Step 6 — step down or stop, and manage rebound",
     blocks:[
       {b:"info", html:"For mild-to-moderate GORD or dyspepsia (no erosions, no Barrett's) controlled and asymptomatic for 2 weeks or more, or where the precipitating drug has stopped — deprescribe. <b>Confirm there is no ongoing indication first</b> — continue or seek specialist advice for severe erosive oesophagitis (LA grade C/D), oesophageal stricture or previous dilation, Barrett's oesophagus where maintenance has been advised, Zollinger–Ellison syndrome, recurrent ulcer bleeding, ongoing high-risk NSAID/antithrombotic therapy, specialist-directed gastroprotection, or selected patients needing a PPI to optimise pancreatic enzyme replacement. There is no single evidence-based tapering regimen for every patient; warn about transient rebound symptoms."},
       {b:"table", head:["Step","When","Action"], rows:[
         ["<b>6a — reduce, or stop directly</b>","<b>Short course or low dose: stopping directly is often possible. Long-term or high dose: consider gradual reduction</b>","Reduce to the lowest effective dose or on-demand use where appropriate (e.g. omeprazole 20 mg → 10 mg). After prolonged or high-dose treatment — or where rebound is likely to be troublesome, the patient is anxious, or withdrawal has been difficult before — a gradual reduction over several weeks may improve tolerability"],
         ["<b>6b — stop, or switch to PRN / on-demand</b>","<b>Controlled and tolerating the lower dose</b>","Stop the PPI, or move to on-demand use for symptom flares. Agree a rescue plan with an alginate or antacid (e.g. OTC) and review if symptoms persist"],
         ["<b>6c — cover rebound with an alginate</b>","<b>During and after tapering — warn in advance</b>","Transient acid-related symptoms may occur after reducing or stopping, particularly after long-term treatment, and may settle over days to weeks — cover with an alginate or antacid. If symptoms are persistent, severe, progressive or associated with alarm features, reassess rather than assuming rebound"],
         ["<b>6d — stop the PPI if the trigger drug stops</b>","<b>Gastroprotection only; NSAID, antiplatelet or steroid discontinued</b>","If the PPI was purely for gastroprotection and the culprit drug has stopped, STOP the PPI too"]
       ]},
       {b:"table", head:["Then","Detail"], rows:[
         ["<b>Monitor</b>","Review at 4–8 weeks for heartburn, epigastric pain, weight loss or appetite loss"],
         ["<b>If symptoms return significantly</b>","Revert to the lowest effective dose; if continuing, review annually; consider H. pylori testing (off the PPI for 2 weeks)"],
         ["<b>Hospital or antibiotics</b>","Review the PPI indication whenever antibiotics are prescribed. Stop or reduce it if unnecessary, particularly in someone with previous or current C. difficile infection (GM antimicrobial guidance: stop unnecessary PPIs in confirmed or suspected C. difficile), but maintain it when there is a clear ongoing indication"]
       ]}
     ]},

    {id:"safety", nav:"Safety", title:"Rebound, side effects, and what to warn about",
     blocks:[
       {b:"table", head:["Issue","What happens","What to do"], rows:[
         ["<b>Rebound acid hypersecretion</b>","<b>Transient acid-related symptoms after stopping or reducing, particularly after long-term use; duration varies (days to weeks)</b>","<b>Pre-warn; consider gradual reduction after long-term or high-dose use; alginate cover; reassess persistent, severe, progressive or atypical symptoms rather than assuming rebound</b>"],
         ["<b>Common short-term effects</b>","Headache, diarrhoea, nausea, abdominal pain, constipation, rash","Usually mild and reversible; trial a different PPI or stop if troublesome"],
         ["<b>Hypomagnesaemia</b>","Cramps, arrhythmia — especially with diuretics or digoxin, on long-term use","Consider magnesium in long-term users with symptoms or those taking diuretics or digoxin; correct; review the need. No routine universal monitoring"],
         ["<b>B12 and iron deficiency</b>","Reduced absorption over years","<b>Investigate unexplained anaemia or neurological symptoms on their own merits; no routine universal B12 or iron monitoring solely because of a PPI</b>"],
         ["<b>C. difficile, fractures, pneumonia, acute interstitial nephritis</b>","Uncommon associations — many observational and confounded by age, frailty and comorbidity","<b>Lowest effective dose; review the need; stop if AIN is suspected</b>"]
       ]},
       {b:"warn", html:"Don't ignore NEW alarm features in a patient already on a PPI: dysphagia, weight loss, GI bleeding or iron-deficiency anaemia, persistent vomiting, or an epigastric mass → urgent assessment or a suspected cancer pathway referral (NICE NG12 (updated April 2026)), even if the symptoms seem controlled. <b>Symptomatic control on acid suppression is not reassurance.</b>"}
     ]},

    {id:"loop", nav:"Symptoms back?", title:"Symptoms back after stopping? Re-run the checklist",
     sub:"Symptoms after stopping may be rebound, a fixable trigger or recurrence of the original disease — reassess rather than assuming.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"1 · Rebound?", html:"<b>Recently stopped? Transient symptoms may settle over days to weeks with an alginate — reassess if persistent, severe, progressive or with alarm features.</b>"},
         {tone:"blue", h:"2 · Indication", html:"Is there a valid long-term indication — Barrett's, severe oesophagitis, stricture, Zollinger-Ellison, recurrent ulcer bleeding, high-risk or specialist-directed gastroprotection?"},
         {tone:"amber", h:"3 · Trigger drugs", html:"NSAID, aspirin, CCB, nitrate, bisphosphonate or steroid still on board?"},
         {tone:"green", h:"4 · Lifestyle", html:"<b>Weight, late meals, alcohol, smoking and trigger foods addressed?</b>"},
         {tone:"blue", h:"5 · H. pylori", html:"<b>Tested, off the PPI for 2 weeks? If positive, treat using the current Greater Manchester regimen.</b>"}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"When to scope or refer",
     blocks:[
       {b:"cards", items:[
         {tone:"purple", h:"Suspected cancer pathway referral (NICE NG12 (updated April 2026))", html:"Suspected cancer pathway referral for oesophageal or stomach cancer: dysphagia at any age; age 55 and over with weight loss plus upper-abdominal pain, reflux or dyspepsia (this replaced urgent direct-access endoscopy in 2025). Consider a suspected cancer pathway referral for an upper abdominal mass consistent with stomach cancer. Consider non-urgent direct-access upper-GI endoscopy at 55 or over for treatment-resistant dyspepsia, upper-abdominal pain with low haemoglobin, raised platelets or nausea/vomiting with the NG12 symptom combinations. Haematemesis or melaena, significant or symptomatic anaemia, persistent vomiting with dehydration, an epigastric mass or severe acute abdominal pain need urgent assessment in their own right. Do not delay the referral to trial a PPI; document the indication and current PPI dose on the referral and follow the local endoscopy service's instructions."},
         {tone:"amber", h:"Refractory GORD or dyspepsia", html:"Persistent symptoms despite reassessment of the diagnosis, optimised dose, a PPI switch, H. pylori eradication and lifestyle change, or failed H. pylori eradication → gastroenterology or specialist advice."},
         {tone:"blue", h:"Confirmed complications", html:"Barrett's oesophagus, severe (LA grade C or D) oesophagitis, or stricture → specialist follow-up plus long-term PPI."},
         {tone:"blue", h:"Suspected Zollinger-Ellison", html:"Refractory or multiple ulcers, diarrhoea, a very high PPI requirement → gastroenterology (fasting gastrin)."},
         {tone:"cream", h:"GP management", html:"Indication and documentation, drug choice and dosing, the acute-script habit, risk-based gastroprotection, optimisation before escalation, the annual review and the deprescribing plan all belong here. Related pages: <a href='gord.html'>GORD</a> · <a href='ibs.html'>IBS</a> · <a href='antiplatelets-anticoagulants.html'>antiplatelets and anticoagulants</a> · <a href='iron-deficiency-anaemia.html'>iron deficiency anaemia</a>."}
       ]},
       {b:"say", html:"We'll treat this with a short, full-strength course rather than an open-ended one, sort out anything that's triggering it, and then step you down to the lowest dose — or stop — once you're settled. Some heartburn for a few days or weeks when we reduce it is common and can be eased with an alginate — but tell us if it is severe, keeps going, or comes with new symptoms such as difficulty swallowing or weight loss."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 71-year-old man on <b>clopidogrel</b> after a stroke and <b>naproxen</b> for knee osteoarthritis attends for a medication review. He has been on <b>omeprazole 20 mg</b> for 6 years — originally a 4-week course for indigestion, since on repeat. He mentions <b>occasional muscle cramps</b>, and that he has become <b>more tired recently</b>. He is worried about \"being on too many tablets\" and asks whether he can stop the omeprazole."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Spots the clopidogrel–omeprazole interaction and switches to pantoprazole (or lansoprazole or rabeprazole per the local formulary), without stopping the clopidogrel — the highest-value action in the case, and one that survives regardless of the deprescribing decision; recognises he DOES need gastroprotection, because he is elderly on an NSAID plus an antiplatelet, so this is not a stop-the-PPI case but a change-the-PPI case; <b>checks magnesium for the cramps and investigates the fatigue (including FBC and haematinics)</b> on its own merits rather than attributing it automatically to the PPI; <b>reviews the naproxen and ideally stops or replaces it</b>, since stopping it would change the gastroprotection requirement; explains that the original indication expired years ago but a new one has taken its place, which is why the answer to \"can I stop?\" is a qualified no; <b>documents the indication</b> so the next reviewer is not left guessing; would warn about rebound and cover with an alginate if stopping were appropriate; and <b>safety-nets the new alarm features</b>, noting the iron-deficiency anaemia route."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE CG184 — Gastro-oesophageal reflux disease and dyspepsia in adults (2014, updated 2019)</b><br><a href="https://www.nice.org.uk/guidance/cg184" rel="noopener">nice.org.uk/guidance/cg184</a><span class="rd"> — the four PPI indications, full-dose courses of 4 weeks (8 with oesophagitis or ulcer), the 2-week PPI washout before H. pylori testing (the 2004 washout before endoscopy was removed in the 2014 update), step-down to the lowest effective dose or on-demand use, H. pylori test-and-treat as part of initial management of uninvestigated dyspepsia, and regular review of long-term use</span></li>'+
         '<li><b>NICE CG184 \u2014 Gastro-oesophageal reflux disease and dyspepsia in adults</b><br><a href="https://www.nice.org.uk/guidance/cg184" rel="noopener">nice.org.uk/guidance/cg184</a><span class="rd"> — 4 weeks for dyspepsia and 4 or 8 weeks for GORD, step-down to the lowest effective dose, and discussing as-needed treatment when symptoms recur</span></li>'+
         '<li><b>GMMMG — Greater Manchester formulary (gastro-intestinal system) and Greater Manchester antimicrobial guidelines</b><br><a href="https://www.greatermanchesterformulary.nhs.uk/" rel="noopener">greatermanchesterformulary.nhs.uk</a> · <a href="https://gmmmg.nhs.uk/" rel="noopener">gmmmg.nhs.uk</a><span class="rd"> — local formulary PPI choice and gastroprotection risk assessment, current local H. pylori eradication regimens (taking previous antibiotic exposure into account), and stopping unnecessary PPIs in C. difficile infection</span></li>'+
         '<li><b>MHRA Drug Safety Update — clopidogrel and proton pump inhibitors: interaction, updated advice (April 2010)</b><br><a href="https://www.gov.uk/drug-safety-update/clopidogrel-and-proton-pump-inhibitors-interaction-updated-advice" rel="noopener">gov.uk — Drug Safety Update</a><span class="rd"> — concomitant omeprazole or esomeprazole with clopidogrel should be discouraged; the advice should not be extended to all other PPIs</span></li>'+
         '<li><b>Bramble MG et al. — Detection of upper gastrointestinal cancer in patients taking antisecretory therapy prior to gastroscopy (Gut 2000)</b><br><a href="https://pubmed.ncbi.nlm.nih.gov/10716673/" rel="noopener">pubmed.ncbi.nlm.nih.gov/10716673</a><span class="rd"> — older observational study: acid suppression before the index gastroscopy was associated with missed cancer. Historical background only; not a basis for routinely stopping PPIs before endoscopy</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — dysphagia at any age, and age 55 and over with weight loss plus upper-abdominal pain, reflux or dyspepsia, as suspected cancer pathway referrals (recommendations 1.2.1 and 1.2.7, amended 2025, which replaced the urgent direct-access endoscopy route), and the criteria for considering non-urgent direct-access upper-GI endoscopy in people aged 55 or over</span></li>'+
         '<li><b>BNF and the individual Summaries of Product Characteristics</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — the dose table, formulations and dispersible options, timing before food, and the long-term association warnings (hypomagnesaemia, B12 and iron deficiency, C. difficile, fracture, acute interstitial nephritis)</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"PPI prescribing and deprescribing — NICE CG184, NICE NG12 (updated April 2026), MHRA and the GMMMG formulary and antimicrobial guidelines. Confirm the indication, exclude alarm features, and choose a formulary PPI at an appropriate dose for the indication — broadly similar efficacy at equivalent doses, but not interchangeable milligram-for-milligram. Prescribe the first course as an acute script for a defined duration (dyspepsia 4 weeks; GORD 4 or 8 weeks; severe oesophagitis or ulcer usually 8 weeks), then step down or stop. Test and treat H. pylori early in uninvestigated dyspepsia using the current local regimen. Gastroprotect according to individual GI-bleed risk, and review the PPI when the culprit drug changes or stops. On clopidogrel, avoid omeprazole and esomeprazole; pantoprazole is a reasonable preferred option. Off the PPI for 2 weeks before H. pylori testing; never let a PPI trial delay endoscopy, and follow the endoscopy service's instructions rather than routinely stopping it. Review long-term PPIs regularly, and when deprescribing, warn that transient symptoms may occur but reassess persistent or alarm symptoms. Verify all doses against the current BNF before prescribing."
});
