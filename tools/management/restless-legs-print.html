  stemSub:"One page for the whole condition. Exclude the mimics (cramps, akathisia, claudication, neuropathy) and the secondary causes; confirm all four URGE criteria and that the symptoms are not better explained by another condition; check ferritin and transferrin saturation, and consider iron when ferritin is ≤75 µg/L or TSAT is &lt;20% (there is no universal ferritin target) — and if you find unexplained iron-deficiency anaemia, use the NICE NG12 FIT pathway for colorectal triage plus appropriate GI investigation rather than just replacing iron and discharging. Then correct iron and drug triggers first, and generally prefer an alpha-2-delta ligand to routine dopamine-agonist treatment because of augmentation. AASM guideline (J Clin Sleep Med 2025, international) · NICE NG12 (updated April 2026).",

  meta:[
    {t:"AASM RLS and PLMD treatment guideline (J Clin Sleep Med 2025, international)"},

  ],
  lead:"<div class='mg-layers'><a href='#severe'><b>Red flags</b><small>Mimics · IDA · cord</small></a><a href='#diagnose'><b>Diagnose</b><small>URGE + not better explained</small></a><a href='#ladder'><b>Treat</b><small>Iron first, then α-2-δ</small></a><a href='#augmentation'><b>Augmentation</b><small>Do not raise the dose</small></a></div>",
  quickSub:"If you read nothing else on this page, read these six cards. Every figure traces to the source cited under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"purple", h:"⚠ Unexplained iron-deficiency anaemia → the NG12 GI cancer pathway <span class='tw'>Suspected cancer</span>", html:"RLS is strongly iron-linked, so you will check ferritin — which makes this page a cancer safety net. If iron-deficiency anaemia is found and unexplained, offer quantitative FIT to adults with iron-deficiency anaemia to guide colorectal-cancer referral (NICE NG12). Refer via the suspected colorectal cancer pathway when FIT is ≥10 µg Hb/g. A negative or unavailable FIT does not exclude cancer and must not delay referral where clinical concern persists. FIT is a colorectal triage test, not a replacement for upper-GI assessment: men and post-menopausal women with new unexplained IDA generally need bidirectional GI investigation (BSG 2021). In premenopausal women, consider menstrual loss, pregnancy or postpartum status, diet, blood donation, GI symptoms and family history, coeliac disease and persistence despite treatment — not automatic bidirectional endoscopy. Check coeliac serology, and do not delay oral iron while awaiting investigation. <b>Do not simply replace the iron and discharge</b> — RLS is the presenting symptom, but the occult colorectal or gastric cancer is the diagnosis you must not miss.", src:"NICE NG12 (updated April 2026); BSG 2021; ACPGBI/BSG FIT guideline 2022"},
    {tone:"amber", h:"Ferritin ≤75 or TSAT &lt;20% — consider iron", html:"Check serum ferritin AND transferrin saturation. In symptomatic RLS, consider iron replacement when ferritin is ≤75 µg/L or TSAT is &lt;20%, after considering the clinical context. If ferritin is 75–100 µg/L and symptoms are clinically significant, oral absorption may be limited and specialist or local-pathway advice about IV iron may be appropriate (AASM, J Clin Sleep Med 2025). Treatment choice depends on severity, symptoms, inflammation, renal disease, tolerability and local practice. Check iron studies in the morning, avoiding iron-containing food and supplements for 24 hours. There is no universally agreed serum-ferritin target for RLS. A laboratory-normal ferritin does not necessarily exclude clinically relevant iron deficiency in RLS, particularly with inflammation, but this is not an indication for indiscriminate iron therapy. Ferritin is an acute-phase reactant, falsely raised in infection, inflammation, liver disease and malignancy — interpret it with CRP and the clinical context. TSAT below 20% supports iron-restricted erythropoiesis; serum iron alone should not be used to diagnose iron deficiency."},
    {tone:"blue", h:"All four URGE criteria — and not better explained by another condition", html:"U — Urge to move the legs with an uncomfortable crawling, creeping or fizzing sensation. R — Rest or inactivity worsens it. G — Gets better with movement, for as long as the movement continues. E — Evening or night predominance. <b>And the symptoms must not be better explained by another condition</b> such as cramps, akathisia, neuropathy, venous disease or positional discomfort. <b>The circadian element is the most discriminating feature.</b> The question that does the work: “is it worse when you sit still in the evening, and does getting up and walking ease it?”"},
    {tone:"green", h:"Alpha-2-delta ligands are generally preferred to dopamine agonists", html:"For persistent, troublesome RLS after correction of iron deficiency and aggravating medicines, an alpha-2-delta ligand (gabapentin or pregabalin, taken in the evening and titrated) is generally preferred to routine dopamine-agonist treatment because it avoids the substantial long-term augmentation risk of dopamine agonists. Alpha-2-delta ligands have a substantially lower augmentation risk, but adverse effects, dependence and withdrawal remain important; both need renal dose adjustment, and choice should consider renal function, respiratory disease, falls, sedation, weight gain, mood, substance-use history and patient preference. Do not use dopamine agonists as routine first-line treatment (the AASM advises against standard use of pramipexole, ropinirole and rotigotine, and strongly against cabergoline). They may be considered in selected patients when alpha-2-delta ligands are unsuitable or ineffective, at the lowest effective dose with regular review, after discussing augmentation, impulse-control disorders and sudden-onset sleep; patients already on one need monitoring, not abrupt withdrawal."},
    {tone:"red", h:"Augmentation: earlier, worse, spreading — never increase the dose", html:"A paradoxical drug-induced worsening from long-term dopamine agonists: symptoms start earlier in the day, become more intense, spread to previously unaffected limbs (arms, trunk), and each dose gives shorter relief. It is often misread as disease progression, prompting a dose increase — which makes it worse, and is one of the commonest reasons RLS becomes refractory. It can occur even when the original RLS was well controlled. Management: do not respond by increasing the dopamine-agonist dose; recheck iron status, review aggravating medicines and seek specialist advice for gradual dose reduction and transition to an alpha-2-delta ligand. Avoid abrupt withdrawal where possible because severe rebound symptoms may occur."},
    {tone:"amber", h:"Ask about gambling directly — patients will not volunteer it", html:"Dopamine agonists carry a real risk of impulse-control disorders — new gambling, compulsive shopping, hypersexuality, binge eating. Ask directly at every review, because patients rarely disclose spontaneously; their presence mandates dose reduction or withdrawal. Also warn about <b>sudden-onset sleep</b> and driving. Avoid regular levodopa for RLS: if a specialist or local pathway supports intermittent use for a predictable isolated event, give clear instructions that it must not become daily or frequent treatment because of augmentation risk."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step is where the cancer and the cord lesion hide.",
  pathway:[
    {title:"Exclude the mimics, the secondary causes and the sinister", html:"Painful, unilateral or fixed-position leg symptoms → not typical RLS: consider radiculopathy, neuropathy or claudication; examine pulses and neurology. New restlessness on a dopamine antagonist → akathisia, not RLS. Unexplained iron-deficiency anaemia → NG12 FIT for colorectal triage plus age- and sex-appropriate GI investigation. Pregnancy → non-drug measures, investigate and treat iron deficiency using obstetric guidance, review folate; medication generally avoided. Renal failure or dialysis → check U&amp;E, liaise with renal. Rapidly progressive, or with weakness, a sensory level or bladder/bowel change → exclude cord or cauda equina pathology.", alert:true},
    {title:"Confirm all four URGE criteria and exclude mimics", html:"Urge to move · Rest worsens · Gets better with movement · Evening or night predominance — and not better explained by another condition. Add the <b>sleep and bed-partner history</b> (sleep-onset and maintenance insomnia; the partner may report rhythmic kicks), the <b>family history</b> and the <b>drug and substance triggers</b>. Family history, sleep disturbance and periodic limb movements are not diagnostic requirements."},
    {title:"Examine and investigate — ferritin is the test that matters", html:"Neurological examination (normal in primary RLS; sensory signs suggest neuropathy or radiculopathy) and vascular examination (pulses, capillary refill, ABPI if claudication is suspected). Bloods: ferritin, transferrin saturation and FBC in most new patients; add CRP, U&amp;E/eGFR, HbA1c or glucose, B12 and folate, TFTs, coeliac serology and a pregnancy test according to clinical context. No routine imaging or sleep study — sleep assessment only for diagnostic uncertainty, suspected obstructive sleep apnoea, parasomnia, severe sleep disruption or another sleep disorder."},
    {title:"Correct iron and drug triggers, then medicate if troublesome", html:"Oral ferrous sulfate or fumarate with vitamin C, alternate-day dosing for absorption and tolerability; recheck ferritin at 3 months; specialist or local-pathway IV iron if oral is not tolerated, malabsorption or no response. Do not delay oral iron while IDA is being investigated. Review and rationalise aggravating drugs. Reserve regular medication for frequent, troublesome, sleep-disrupting symptoms — then an alpha-2-delta ligand is generally preferred (check renal function), with a dopamine agonist only in selected patients at the lowest effective dose."},
    {title:"Review iron, response and augmentation", html:"Recheck ferritin and TSAT about 3 months after starting iron. At every dopamine-agonist review ask about earlier onset, greater intensity, arm involvement and impulse-control behaviours — and act early rather than increasing the dose. Review symptom frequency, sleep quality and daytime function; consider drug holidays in intermittent disease. Re-examine and refer if the picture drifts towards unilateral, painful or neurologically abnormal symptoms."}
  ],
  sections:[
    {id:"severe", nav:"Red flags", title:"Red flags — mimics, secondary causes and the iron-deficiency link", sub:"RLS is a clinical diagnosis, but these presentations mean it is not simple RLS — or that the ferritin check has found something more important.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"🟠 Painful, unilateral or fixed-position leg symptoms", html:"Not typical RLS (which is bilateral and movement-relieved). Consider lumbosacral radiculopathy, peripheral neuropathy, or peripheral arterial disease / claudication (pain on walking, relieved by rest — the opposite of RLS). Examine pulses and neurology."},
         {tone:"amber", h:"🟠 New “restlessness” on a dopamine antagonist", html:"Antipsychotics, metoclopramide and prochlorperazine cause akathisia — an inner restlessness mistaken for RLS. Onset is drug-related, not circadian. Review and stop the offending drug."},
         {tone:"purple", h:"🔴 Unexplained iron-deficiency anaemia <span class='tw'>Suspected cancer</span>", html:"RLS is strongly iron-linked, so you will check ferritin. If iron-deficiency anaemia is found, offer quantitative FIT to guide colorectal-cancer referral and refer via the suspected colorectal cancer pathway when FIT is ≥10 µg Hb/g (NICE NG12). A negative or unavailable FIT does not exclude cancer and must not delay referral where concern persists. Men and post-menopausal women with new unexplained IDA generally need upper and lower GI investigation (BSG 2021); in premenopausal women consider menstrual and other blood loss first. Check coeliac serology.", src:"NICE NG12 (updated April 2026); BSG 2021; ACPGBI/BSG FIT guideline 2022"},
         {tone:"blue", h:"🔵 Pregnancy", html:"RLS is common in pregnancy, particularly in the third trimester, and usually resolves after delivery. Prioritise non-pharmacological measures and investigate and treat iron deficiency using obstetric guidance and the pregnancy-specific ferritin interpretation in the local maternity pathway; review folate status and other contributors — do not assume all pregnancy-related RLS is due to iron deficiency. Medication should generally be avoided; avoid self-directed IV iron in primary care. Severe or refractory symptoms, or significant anaemia, need obstetric, sleep or neurology input."},
         {tone:"blue", h:"🔵 Renal failure / on dialysis", html:"Uraemic RLS is common and often severe. Check U&amp;E. Manage iron, and liaise with the renal team — symptoms cluster around dialysis sessions."},
         {tone:"red", h:"🔴 Rapidly progressive, or with neurological signs", html:"Weakness, a sensory level, or bladder or bowel change → exclude cord or cauda equina pathology. This is not RLS."}
       ]},
       {b:"why", html:"RLS (Willis–Ekbom disease) is a clinical diagnosis, but its single most important modifiable driver is brain iron deficiency, which can exist even with a “normal” ferritin. The AASM uses iron parameters to guide treatment — consider iron when ferritin is ≤75 µg/L or TSAT is &lt;20% — but there is no universally agreed ferritin target. Crucially, the ferritin check is also a safety net: finding genuine iron-deficiency anaemia mandates a search for a cause, and in adults that means NICE NG12 FIT for colorectal triage plus age- and sex-appropriate GI investigation — RLS is the presenting symptom, but the occult colorectal or gastric cancer is the diagnosis you must not miss."}
     ]},

    {id:"diagnose", nav:"Diagnose", title:"History — the URGE criteria and the triggers", sub:"All four criteria are required, and the symptoms must not be better explained by another condition.",
     blocks:[
       {b:"table", head:["Criterion","Detail","Note"], rows:[
         ["<b>U — Urge to move</b>","An urge to move the legs, usually with an uncomfortable “crawling, creeping, fizzing” sensation deep in the legs","<b>All four criteria are required for diagnosis, plus the exclusion criterion below</b>"],
         ["<b>R — Rest worsens</b>","<b>Symptoms begin or worsen during rest or inactivity (sitting, lying)</b>","Distinguishes it from exertional pain"],
         ["<b>G — Gets better with movement</b>","Partial or complete relief while moving (walking, stretching) — for as long as the activity continues","The mirror image of claudication"],
         ["<b>E — Evening/night predominance</b>","Symptoms are worse in the evening or at night (a circadian pattern). This is what disrupts sleep and causes daytime fatigue","<b>The most discriminating feature</b>"],
         ["<b>Not better explained by another condition</b>","<b>The symptoms are not solely accounted for by another medical or behavioural condition</b> — such as cramps, akathisia, neuropathy, venous disease or positional discomfort","<b>Required (IRLSSG)</b>"],
         ["<b>Sleep and bed-partner history</b>","Sleep-onset and maintenance insomnia. Periodic limb movements may coexist with RLS — the partner may report rhythmic leg kicks — but they are not required for diagnosis, do not confirm RLS, and should not be assumed without polysomnography","Ask the partner directly where possible; not a diagnostic requirement"],
         ["<b>Family history</b>","Primary RLS is often familial; early-onset disease is more often genetic","Supportive, but not a diagnostic requirement"],
         ["<b>Drug and substance triggers</b>","Antidepressants (mirtazapine, SSRIs, SNRIs, TCAs), sedating antihistamines, dopamine antagonists (metoclopramide, antipsychotics), caffeine, alcohol, nicotine — can precipitate or worsen RLS in some people","Often the most effective thing to change"]
       ]},
       {b:"why", html:"The mnemonic URGE captures the four essential diagnostic criteria — all must be present, and the symptoms must not be better explained by another condition. The circadian element (evening or night worsening) is the most discriminating feature and reflects the underlying dopaminergic and iron pathophysiology, which follows a daily rhythm. Asking specifically “is it worse when you sit still in the evening, and does getting up and walking ease it?” rapidly separates RLS from nocturnal cramps (sudden painful muscle contraction, no urge), positional discomfort, and akathisia (constant, drug-related, not circadian)."}
     ]},

    {id:"differential", nav:"Differential", title:"Differential diagnosis", sub:"The commonest misdiagnosis is conflating RLS with nocturnal leg cramps — they are managed completely differently.",
     blocks:[
       {b:"table", head:["Condition","Features","Discriminator"], rows:[
         ["<b>Nocturnal leg cramps</b>","Sudden, painful, palpable muscle contraction (calf or foot), relieved by stretching the muscle","No urge to move, no crawling sensation. A different entity with different management — see the <a href='leg-cramps.html'>leg cramps protocol</a>"],
         ["<b>Akathisia</b>","Drug-induced (antipsychotics, metoclopramide, SSRIs) inner restlessness — whole body, not circadian, no relief pattern","<b>Review medication</b>"],
         ["<b>Peripheral neuropathy</b>","Burning or numbness in a stocking distribution, often diabetic. Sensory signs on examination","<b>May coexist with RLS. Check glucose/HbA1c and B12</b>"],
         ["<b>Peripheral arterial disease</b>","Claudication: cramping calf pain brought on by walking, relieved by rest — the mirror image of RLS","<b>Absent pulses, low ABPI</b>"],
         ["<b>Positional discomfort / “fidgets”</b>","<b>Relieved simply by repositioning</b>","<b>Lacks the compelling urge and the circadian pattern</b>"],
         ["<b>Growing pains (children)</b>","<b>Bilateral evening leg aches in children — overlaps with paediatric RLS</b>","<b>Check ferritin and family history</b>"],
         ["<b>Venous insufficiency</b>","<b>Aching and swelling, worse on standing; varicose veins, skin changes</b>","Chronic and postural, not circadian"]
       ]},
       {b:"why", html:"The most common misdiagnosis is conflating RLS with nocturnal leg cramps — they are managed completely differently. Cramps are a painful, visible, palpable muscle contraction relieved by passively stretching the muscle; RLS is an urge to move with an unpleasant (but usually not painful) deep sensation relieved by voluntary movement. The other clinically vital distinction is claudication, because it is relieved by rest and worsened by exercise — exactly opposite to RLS — and it signals arterial disease needing vascular assessment."}
     ]},

    {id:"workup", nav:"Work-up", title:"Examination and investigations", sub:"Ferritin is the investigation that changes management. Almost nothing else is routine.",
     blocks:[
       {b:"table", head:["What","Detail","Why"], rows:[
         ["<b>Neurological examination</b>","<b>Power, sensation, reflexes — usually normal in primary RLS</b>","<b>Sensory signs suggest neuropathy or radiculopathy</b>"],
         ["<b>Vascular examination</b>","<b>Peripheral pulses, capillary refill, ABPI if claudication is suspected</b>","Excludes the mirror-image diagnosis"],
         ["<b>Iron studies</b>","Serum ferritin + transferrin saturation — the key tests. Consider iron when ferritin is ≤75 µg/L or TSAT is &lt;20%; if ferritin is 75–100 µg/L with significant symptoms, seek specialist or local-pathway advice about IV iron. There is no universal ferritin target. Ferritin is falsely raised in infection, inflammation, liver disease and malignancy — interpret it with CRP and the clinical context; do not use serum iron alone to diagnose iron deficiency","<b>The investigation that changes management</b>"],
         ["<b>Bloods for secondary causes</b>","Core in most new patients: ferritin, TSAT and FBC (anaemia). Add according to clinical context: CRP · U&amp;E/eGFR (uraemia; also before gabapentin or pregabalin) · HbA1c or glucose (neuropathy) · B12 and folate · TFTs if thyroid disease is suspected or the differential is broad · coeliac serology in unexplained iron deficiency · pregnancy test · vascular or neurological testing","Finds the treatable drivers without over-investigating typical RLS"],
         ["<b>When to investigate further</b>","No routine imaging or sleep study needed for typical RLS. Arrange sleep assessment only where there is diagnostic uncertainty, suspected obstructive sleep apnoea, parasomnia, severe sleep disruption or another sleep disorder. Treat clinically significant symptoms, not an incidental PLMS index","Avoids unnecessary referral"]
       ]},
       {b:"why", html:"Ferritin is the investigation that changes management. A laboratory-normal ferritin does not necessarily exclude clinically relevant iron deficiency in symptomatic RLS, because the relevant deficiency is in the brain, but this is not an indication for indiscriminate iron therapy: consider iron when ferritin is ≤75 µg/L or transferrin saturation is below 20%, in clinical context. Always interpret ferritin against CRP, since infection or inflammation can elevate it spuriously and mask functional iron deficiency."}
     ]},

    {id:"ladder", nav:"Treat", title:"Correct iron, review drugs, then first-line medication", sub:"A substantial proportion of patients improve with iron repletion and trigger removal alone. Check the current BNF, SPC and local formulary for doses, renal adjustment and licensed indications.",
     blocks:[
       {b:"table", head:["Situation","Action","Detail"], rows:[
         ["<b>Iron deficiency (ferritin &lt;75 or TSAT &lt;20%)</b>","<b>Oral ferrous sulfate or fumarate + vitamin C</b>","Alternate-day dosing improves absorption and tolerability. Recheck ferritin and TSAT at 3 months and interpret with symptoms and CRP. Specialist or local-pathway IV iron if oral is not tolerated, malabsorption, no response, or ferritin 75–100 µg/L with clinically significant symptoms"],
         ["<b>Aggravating drugs</b>","<b>Review and rationalise</b>","Where possible switch or stop precipitants: sedating antihistamines, mirtazapine, SSRIs/SNRIs, dopamine antagonists (metoclopramide, antipsychotics). Try reducing caffeine, alcohol and nicotine as individual trials"],
         ["<b>Intermittent symptoms</b>","<b>Non-drug measures</b>","Sleep hygiene, targeted movement, treat iron. Reserve regular medication for frequent, troublesome, sleep-disrupting symptoms"]
       ]},
       {b:"ladder", steps:[
         {step:"Step 1", title:"Alpha-2-delta ligand — gabapentin or pregabalin", when:"persistent, troublesome symptoms", fromLabel:"generally preferred",
          html:"Taken in the evening — typical adult starting doses with normal renal function are gabapentin 300 mg at night (titrate) or pregabalin 75 mg at night. Generally preferred to routine dopamine-agonist treatment: a substantially lower (not zero) augmentation risk, and helpful if pain, neuropathy or anxiety coexist. <b>Gabapentin and pregabalin require renal dose adjustment.</b> Start lower and titrate more slowly in older or frail patients and those with renal impairment, respiratory disease, obstructive sleep apnoea, falls risk or concurrent CNS depressants. Adverse effects include dizziness, somnolence, ataxia and falls, cognitive impairment, oedema, weight gain, misuse and dependence, withdrawal symptoms, and respiratory depression — particularly with opioids, alcohol, benzodiazepines or other sedatives; the MHRA has warned of severe respiratory depression with pregabalin, including cases without opioids. <b>Do not stop gabapentin or pregabalin abruptly; taper gradually according to dose, duration and patient factors.</b>"},
         {step:"Alternative", title:"Dopamine agonist — ropinirole, pramipexole or rotigotine", when:"selected patients: alpha-2-delta ligand unsuitable or ineffective", fromLabel:"lowest effective dose, regular review",
          html:"Do not use as routine first-line treatment. Ropinirole, pramipexole or a rotigotine patch at the lowest effective dose — use product-specific doses and licensed indications from the current SPC or local formulary (ranges such as ropinirole 0.25–4 mg, pramipexole 88–540 micrograms or rotigotine 1–3 mg/24 h are not routine targets). Effective, but carries the risk of augmentation, impulse-control disorders (gambling, hypersexuality, compulsive shopping) and sudden-onset sleep — discuss these before prescribing and ask about them at every review. Seek specialist advice where treatment is prolonged, complex or augmentation is present."},
         {step:"Intermittent", title:"As-needed options", when:"infrequent symptoms", fromLabel:"if symptoms are intermittent",
          html:"For occasional symptoms, intermittent low-dose treatment or non-drug measures may suffice. Avoid regular levodopa for RLS. If a specialist or local pathway supports intermittent use for a predictable isolated event (for example <span class='rx'>co-careldopa 100/25 mg</span> as a single dose before a long flight), give clear instructions that it must not become daily or frequent treatment because of augmentation risk."},
         {step:"Avoid", title:"What not to do", when:"", fromLabel:"",
          html:"Do not use a dopamine agonist as routine first-line treatment. Avoid regular levodopa. Do not stop gabapentin or pregabalin abruptly. Opioids only via a specialist, for refractory disease."}
       ]},
       {b:"why", html:"The treatment paradigm has shifted: alpha-2-delta ligands (gabapentin, pregabalin) are now generally preferred to routine dopamine-agonist treatment, because dopamine agonists — although initially very effective — frequently cause augmentation over months to years and carry a real risk of impulse-control disorders that patients will not volunteer unless asked. The foundation beneath any drug, though, is iron repletion and removal of pharmacological triggers: a substantial proportion of patients improve with these alone and need no ongoing RLS-specific medication."},
       {b:"say", html:"Often the most powerful step is correcting your iron levels and reviewing other medicines, so let's start there. If we do need a regular medicine, I'll explain which one and a couple of side effects to watch for."}
     ]},

    {id:"augmentation", nav:"Augmentation", title:"Recognising and managing augmentation", sub:"The single most important iatrogenic complication of RLS treatment — and the reason guidelines have demoted dopamine agonists.",
     blocks:[
       {b:"table", head:["Aspect","Detail"], rows:[
         ["<b>What augmentation is</b>","A paradoxical, drug-induced worsening of RLS caused (usually) by long-term dopamine agonists: symptoms start earlier in the day, become more intense, spread to previously unaffected limbs (arms, trunk), the duration of relief from each dose shortens, and response falls despite dose escalation. It can occur with dopaminergic treatment even when the original RLS was well controlled"],
         ["<b>Why it matters</b>","Often misread as “disease progression”, prompting a dose increase — which makes augmentation worse. It is one of the commonest reasons RLS becomes refractory"],
         ["<b>Management</b>","Do not respond to suspected augmentation by increasing the dopamine-agonist dose. Recheck iron status, review aggravating medicines and seek specialist advice for gradual dose reduction and transition to an alpha-2-delta ligand. Avoid abrupt withdrawal where possible because severe rebound symptoms may occur"],
         ["<b>Impulse-control disorders</b>","Ask directly about new gambling, compulsive shopping, hypersexuality and binge eating at every dopamine-agonist review — patients rarely disclose spontaneously. Their presence mandates dose reduction or withdrawal"]
       ]},
       {b:"warn", html:"<b>Augmentation</b> (symptoms earlier in the day, more intense, spreading) is the main long-term problem with dopamine agonists — <b>do not increase the dose; recheck iron and seek specialist advice for gradual reduction and switch, avoiding abrupt withdrawal</b>. Warn about impulse-control disorders (gambling, hypersexuality) and sudden-onset sleep."},
       {b:"why", html:"Augmentation is the single most important iatrogenic complication of RLS treatment and the reason guidelines have demoted dopamine agonists. The tell-tale features are temporal (symptoms creeping earlier into the afternoon), spatial (spreading to the arms), and pharmacodynamic (each dose helps for less time). The instinct to raise the dose accelerates the problem. Correct management is iron optimisation and a planned, gradual cross-taper to an alpha-2-delta ligand with specialist advice, anticipating a rebound flare during withdrawal."}
     ]},

    {id:"lifestyle", nav:"Self-management", title:"Self-management and sleep hygiene", sub:"Not a token gesture — for mild and intermittent disease these are often sufficient, and for everyone they reduce the dose and number of drugs required.",
     blocks:[
       {b:"table", head:["Measure","What to do","Why"], rows:[
         ["<b>☕ Reduce dietary triggers</b>","Many patients find reducing evening caffeine (coffee, tea, cola, chocolate), alcohol and nicotine helpful. The evidence for these as universal triggers is variable, so offer a trial — for example 2–3 weeks without evening caffeine — rather than mandatory abstinence","A simple individual trial"],
         ["<b>🤸 Movement and stretching</b>","Walking, calf and hamstring stretches, and leg massage relieve acute symptoms. Regular moderate daytime exercise helps; avoid vigorous exercise late in the evening, which can aggravate","Exploits the movement-relief mechanism"],
         ["<b>🛁 Temperature tricks</b>","A warm bath, or alternating warm and cool packs to the legs before bed, helps many patients settle symptoms enough to fall asleep","Free and often helpful"],
         ["<b>🧩 Mental alerting at rest</b>","During unavoidable sitting (long flights, theatre), engaged mental activity (puzzles, conversation, games) helps many patients","<b>Exploits the same arousal pathways that movement does</b>"],
         ["<b>🛏️ Sleep hygiene</b>","Regular bed and wake times, cool dark bedroom, screen limits — RLS plus poor sleep hygiene is doubly disruptive. Treating coexisting insomnia drivers helps","See the <a href='insomnia.html'>insomnia protocol</a>"],
         ["<b>💊 Review all medicines</b>","Bring every prescription and OTC product to review — sedating antihistamines (in cold and allergy remedies) and anti-nausea drugs are common hidden triggers","<b>Hidden dopamine antagonists are easily missed</b>"],
         ["<b>🧘 During episodes</b>","<b>Get up and move; use distraction techniques during an attack</b>","Shortens the episode"]
       ]},
       {b:"why", html:"Non-pharmacological measures are not a token gesture in RLS — for mild and intermittent disease they are often sufficient, and for everyone they reduce the dose and number of drugs required. Many patients find evening caffeine and alcohol reduction, moderate daytime exercise, stretching, massage, heat or cold measures, mental distraction and regular sleep timing helpful; auditing the medication list for hidden dopamine antagonists and sedating antihistamines is also worthwhile."}
     ]},

    {id:"monitor", nav:"Monitor", title:"Follow-up, monitoring and safety-netting", sub:"Two jobs: confirm iron repletion is achieved and maintained, and screen vigilantly for augmentation and impulse-control disorders.",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["<b>Recheck iron</b>","Repeat ferritin and TSAT about 3 months after starting iron; interpret with symptoms, TSAT and CRP — there is no universal ferritin target","Persistent deficiency despite oral iron → consider malabsorption, ongoing loss (re-examine the NG12 GI risk), or IV iron"],
         ["<b>Monitor for augmentation</b>","<b>At every dopamine-agonist review</b>","Ask about earlier onset, greater intensity, or arm symptoms, and about impulse-control behaviours. Act early — do not increase the dose"],
         ["<b>Treatment response</b>","<b>Each review</b>","Review symptom frequency, sleep quality and daytime function. Step medication up or down accordingly; consider drug holidays in intermittent disease"],
         ["<b>Pregnancy</b>","<b>As it arises</b>","Reassure that pregnancy-related RLS usually resolves after delivery; prioritise non-drug measures, treat iron deficiency using obstetric guidance and review folate; medication should generally be avoided, and severe or refractory symptoms need obstetric, sleep or neurology input"],
         ["<b>Review / refer</b>","<b>If the picture changes</b>","New neurological signs, unilateral or painful symptoms, claudication features, or refractory disease → re-examine and refer (neurology or vascular as appropriate)"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 Safety-net", html:"Unexplained iron-deficiency anaemia → NG12 FIT for colorectal triage plus appropriate GI investigation; safety-net if FIT is negative or not returned, and refer anyway if concern persists. New bladder or bowel dysfunction or leg weakness → urgent assessment for cord or cauda equina pathology."},
         {tone:"amber", h:"🎲 Impulse control", html:"“These medicines can rarely cause urges to gamble, shop or other compulsive behaviour — tell us or a family member if you notice this.”"},
         {tone:"amber", h:"😴 Sudden sleep", html:"“Dopamine medicines can cause sudden sleepiness — take care with driving until you know how they affect you.”"},
         {tone:"amber", h:"💊 Gabapentin or pregabalin", html:"“Tell us about drowsiness, dizziness, falls or any breathing problems, especially with other sedating medicines or alcohol — and don't stop the tablets suddenly.”"},
         {tone:"cream", h:"📈 Augmentation &amp; iron", html:"“If your symptoms start earlier in the day or get worse on treatment, contact us — don't just take more.” “Treating low iron can make a big difference — take the supplement as advised.”"}
       ]},
       {b:"why", html:"Follow-up in RLS has two jobs: confirming that iron repletion has been achieved and maintained, and vigilantly screening for augmentation and impulse-control disorders in anyone on a dopamine agonist. The safety-net never closes on the iron-deficiency question — if anaemia was present and unexplained, the GI cancer pathway must be completed, and recurrent or refractory deficiency should prompt you to revisit it. Any drift towards unilateral, painful or neurologically abnormal symptoms means the diagnosis is no longer simple RLS."}
     ]},

    {id:"loop", nav:"Worse on treatment?", title:"Worse on treatment? Think augmentation", sub:"Worsening on a dopamine agonist is often augmentation, not undertreatment.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"1 · Augmentation", html:"Earlier-in-day, more intense, spreading symptoms → do not increase the dose; seek specialist advice for gradual reduction and switch."},
         {tone:"amber", h:"2 · Iron", html:"<b>Recheck ferritin — deficiency may have recurred.</b>"},
         {tone:"amber", h:"3 · Drugs", html:"<b>Has a new aggravating medication been added?</b>"},
         {tone:"amber", h:"4 · Adherence / dose", html:"<b>Has an adequate dose of an alpha-2-delta ligand been tried?</b>"},
         {tone:"amber", h:"5 · Refer", html:"<b>Refractory disease or augmentation → specialist.</b>"}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways", sub:"Most RLS is managed entirely in primary care.",
     blocks:[
       {b:"cards", items:[
         {tone:"purple", h:"Unexplained IDA: FIT for colorectal triage, plus age- and sex-appropriate GI investigation <span class='tw'>NG12</span>", html:"Unexplained iron-deficiency anaemia found on work-up — FIT for colorectal triage, with suspected colorectal cancer pathway referral if FIT is ≥10 µg Hb/g (NICE NG12). A FIT below 10, or not returned, needs safety-netting and does not exclude referral when concern persists. Men and post-menopausal women with new IDA generally require upper and lower GI investigation (BSG 2021). Consider coeliac disease, and investigate menstrual or other blood loss in premenopausal women. Do not delay oral iron, and do not simply replace iron and discharge.", src:"NICE NG12 (updated April 2026); BSG 2021; ACPGBI/BSG FIT guideline 2022"},
         {tone:"amber", h:"Neurology", html:"Diagnostic uncertainty · refractory symptoms despite optimised iron and first-line drugs · suspected augmentation requiring a drug switch · prolonged or complex dopamine-agonist treatment · early-onset or rapidly progressive disease."},
         {tone:"blue", h:"Sleep medicine", html:"Diagnostic uncertainty, suspected obstructive sleep apnoea, parasomnia, severe sleep disruption or another sleep disorder."},
         {tone:"blue", h:"Renal / obstetric", html:"Uraemic RLS (renal team) · severe or refractory RLS in pregnancy, or significant anaemia (obstetric, sleep or neurology input — medication generally avoided)."},
         {tone:"blue", h:"IV iron service", html:"Ferritin low with oral iron intolerance, malabsorption or inadequate response, or ferritin 75–100 µg/L with clinically significant symptoms — for parenteral iron via the local pathway."},
         {tone:"green", h:"Primary care manages", html:"Typical RLS: iron correction, drug-trigger review, self-management, an alpha-2-delta ligand (with renal dose adjustment) where medication is needed, and augmentation surveillance."}
       ]},
       {b:"why", html:"Most RLS is managed entirely in primary care. The two situations that genuinely need specialist input are augmentation (a paradoxical drug-induced worsening that requires careful agent switching, usually under neurology) and refractory disease where combination therapy or IV iron is being considered. The non-negotiable referral, however, is the patient with unexplained iron-deficiency anaemia, who needs NG12 FIT triage and appropriate GI investigation regardless of how typical their leg symptoms appear."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 63-year-old man describes eighteen months of an irresistible need to move his legs every evening once he settles in front of the television, easing the moment he walks about. His wife reports rhythmic kicking all night. He looks pale and mentions he has been more breathless on the stairs. He asks for “something to help me sleep”."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Confirms <b>all four URGE criteria</b> rather than treating this as insomnia; takes the <b>bed-partner history</b> for PLMS; checks <b>ferritin and transferrin saturation with CRP</b>, plus FBC — and on finding iron-deficiency anaemia in a man, recognises the NG12 route: FIT, with a suspected colorectal cancer pathway referral if it is ≥10 µg Hb/g, plus upper and lower GI investigation (BSG 2021), not iron replacement alone — a FIT below 10 does not exclude upper-GI pathology or colorectal cancer when concern persists; examines for pallor and signs of heart failure given the breathlessness, treating it as possibly significant anaemia; asks about GI symptoms, weight loss, altered bowel habit and family history; considers coeliac serology; does not delay iron while arranging investigation; checks renal function before gabapentin or pregabalin; reviews the drug list for <b>sedating antihistamines and dopamine antagonists</b>; addresses <b>evening caffeine and alcohol</b>; and if medication is needed later, chooses an <b>alpha-2-delta ligand ahead of a dopamine agonist</b> and explains <b>augmentation and impulse-control</b> in plain words."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>AASM (international) \u2014 Winkelman JW et al. The treatment of restless legs syndrome and periodic limb movement disorder: an American Academy of Sleep Medicine clinical practice guideline. <em>J Clin Sleep Med</em> 2025;21(1):137\u2013152</b><br><a href="https://aasm.org/new-guideline-provides-treatment-recommendations-for-restless-legs-syndrome/" rel="noopener">aasm.org</a><span class="rd"> \u2014 iron treatment thresholds (ferritin \u226475 \u00b5g/L or TSAT &lt;20%; IV iron may be considered at 75\u2013100 \u00b5g/L), not a universal ferritin target; iron correction and trigger review first, alpha-2-delta ligands ahead of dopamine agonists, augmentation and impulse-control surveillance, and referral thresholds</span></li>'+
         '<li>NICE NG12 \u2014 Suspected cancer: recognition and referral (updated April 2026)<br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> \u2014 offer FIT to adults with iron-deficiency anaemia; suspected colorectal cancer pathway referral if FIT \u226510 \u00b5g Hb/g; safety-netting if FIT is negative or not returned</span></li>'+
         '<li>BSG 2021 \u2014 Snook J et al. British Society of Gastroenterology guidelines for the management of iron deficiency anaemia in adults. <em>Gut</em> 2021<span class="rd"> \u2014 bidirectional endoscopy and IDA investigation (including coeliac serology) for new IDA in men and post-menopausal women; predates the current NICE NG12 FIT recommendations</span></li>'+
         '<li>ACPGBI/BSG 2022 \u2014 Faecal immunochemical testing (FIT) in patients with signs or symptoms of suspected colorectal cancer: a joint guideline. <em>Gut</em> 2022<br><a href="https://doi.org/10.1136/gutjnl-2022-327985" rel="noopener">doi.org/10.1136/gutjnl-2022-327985</a><span class="rd"> \u2014 limitations of FIT and safety-netting</span></li>'+
         '<li>IRLSSG (international) \u2014 International Restless Legs Syndrome Study Group diagnostic criteria (Allen et al., <em>Sleep Med</em> 2014)<span class="rd"> \u2014 the four essential (URGE) criteria plus the requirement that symptoms are not solely accounted for by another condition; periodic limb movements are associated but not diagnostic</span></li>'+
         '<li><b>MHRA Drug Safety Update \u2014 Pregabalin (Lyrica): reports of severe respiratory depression (2021)</b><br><a href="https://www.gov.uk/drug-safety-update/pregabalin-lyrica-reports-of-severe-respiratory-depression" rel="noopener">gov.uk/drug-safety-update</a></li>'+
         '<li><b>Gabapentin and pregabalin SPCs; BNF</b><span class="rd"> \u2014 renal dose adjustment, respiratory depression, sedation, falls, misuse and dependence, gradual withdrawal</span></li>'+
         '<li><b>Ropinirole, pramipexole and rotigotine SPCs; BNF</b><span class="rd"> \u2014 impulse-control disorders and sudden-onset sleep: counsel explicitly and ask at every review</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> \u2014 gabapentin, pregabalin, ropinirole, pramipexole, rotigotine and iron dosing: verify before prescribing</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Primary-care assessment and management of restless legs syndrome (Willis\u2013Ekbom disease) \u2014 AASM guideline (J Clin Sleep Med 2025, international), ACPGBI/BSG FIT guideline 2022, MHRA gabapentinoid warnings, IRLSSG diagnostic criteria (international), dopamine-agonist SPC safety warnings, BSG 2021, and NICE NG12 (updated April 2026) for the unexplained iron-deficiency-anaemia cancer pathway. Assessment and management are merged on this page; the former algorithm is retired. Correct iron and drug triggers before prescribing, generally prefer an alpha-2-delta ligand to a dopamine agonist, and verify every dose, including renal adjustment, against the current BNF, SPC and local formulary."
