  stemSub:"One page for the paediatric surgical problems met in general practice. Screen first for the surgical emergencies: <b>green or yellow-green (bile-stained) vomiting is intestinal obstruction — possible malrotation with volvulus — until proven otherwise</b>; intussusception (the classic triad is uncommon); testicular torsion (immediate transfer); incarcerated hernia; appendicitis; obstruction; and button battery or multiple magnet ingestion. Then identify the cause by age and pattern, refer at the right urgency, advise, and safety-net. Never delay transfer of an acutely unwell child to obtain imaging. This guide does not replace the local paediatric emergency, surgical or ambulance pathway.",

  meta:[

  lead:"<div class='mg-layers'><a href='#severe'><b>Emergencies</b><small>Volvulus · torsion · intussusception</small></a><a href='#age'><b>By age</b><small>Neonate · infant · child</small></a><a href='#groin'><b>Groin &amp; scrotum</b><small>Hernia · hydrocele · UDT</small></a><a href='#refer'><b>Refer</b><small>Immediate · same-day · outpatient</small></a><a href='#monitor'><b>Follow-up</b><small>After surgery</small></a></div>",
  quickSub:"If you read nothing else on this page, read these six cards. Every figure traces to the source cited under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Green vomiting is obstruction until proven otherwise", html:"<b>Green or yellow-green (bile-stained) vomiting in any infant or child</b> is a red flag for intestinal obstruction — manage as possible malrotation with midgut volvulus (time-critical) until excluded. <b>Immediate same-day hospital assessment</b>; 999 if shocked, deteriorating, severely unwell or there is concern about volvulus. Never delay transfer to obtain abdominal radiography or ultrasound in general practice — a normal AXR does not exclude volvulus."},
    {tone:"red", h:"⚠ Intussusception — the classic triad is uncommon", html:"Episodic severe pain or distress (drawing up knees), pallor or lethargy, vomiting, or unexplained rectal bleeding in an infant or young child → <b>immediate hospital assessment</b> (999 if shocked or deteriorating). Redcurrant-jelly stool is a late feature, a palpable mass is not necessary, and the child may appear well between episodes."},
    {tone:"red", h:"⚠ Testicular torsion — immediate transfer", html:"Sudden severe unilateral scrotal or lower abdominal pain is torsion until proven otherwise — time-critical (aim for exploration within about 4–6 hours of onset). <b>Always examine the testes</b> in a boy with abdominal pain. Transfer directly to a centre capable of scrotal exploration per the local (GIRFT) pathway; do not send for community ultrasound, and do not use a TWIST score in general practice to downgrade risk."},
    {tone:"red", h:"⚠ Abdominal mass — very urgent, and do not repeatedly palpate", html:"A palpable abdominal mass or unexplained enlarged abdominal organ (e.g. Wilms tumour) → <b>very urgent referral for specialist assessment within 48 hours (NICE NG12)</b>; immediate hospital assessment if shock, severe pain, hypertension or clinical deterioration. Do NOT repeatedly palpate (tumour rupture risk)."},
    {tone:"amber", h:"Irreducible hernia, ingestions — immediate assessment", html:"An irreducible, painful, erythematous or tense inguinal hernia → immediate hospital assessment; do NOT attempt forceful manual reduction in primary care. Button battery, multiple magnets or magnet plus metal object ingestion → immediate hospital assessment, even if initially asymptomatic."},
    {tone:"blue", h:"Same-day and planned referral", html:"Suspected appendicitis without peritonism and suspected pyloric stenosis → <b>same-day</b> paediatric assessment. Every child with a suspected inguinal hernia → paediatric surgery (prompt in young infants). Undescended testis still not scrotal at the 4–5-month review (corrected age) → paediatric surgery/urology, to be seen by 6 months (treatment ideally by 12 months, at the latest 18 months); bilateral undescended testes at the 6–8-week check → urgent paediatric referral, seen within 2 weeks — see the <a href='undescended-testis.html'>undescended testis protocol</a>."}
  ],
  pathwaySub:"The whole consultation in five moves.",
  pathway:[
    {title:"Screen for a surgical emergency", html:"Bilious vomiting (malrotation/volvulus) · intussusception · incarcerated hernia · testicular torsion · appendicitis · obstruction · button battery/multiple magnet ingestion → immediate hospital assessment via the local paediatric/surgical pathway; 999 if unstable, shocked, peritonism, severe respiratory compromise, uncontrolled pain or rapid deterioration. Don't delay transfer for imaging.", alert:true},
    {title:"Present the problem, then examine the whole child", html:"Vomiting (bilious?), abdominal pain/distension, groin/scrotal swelling, bleeding, bowel habit. Examine the abdomen, hernial orifices and genitalia — always the testes in a boy with abdominal pain."},
    {title:"Assess by age and pattern", html:"History and examination guide management: hernia or hydrocele (common), acute abdomen (appendicitis, intussusception, malrotation/volvulus, obstruction → emergency), or other (pyloric stenosis, undescended testis, causes of rectal bleeding → refer)."},
    {title:"Refer at the right urgency", html:"Immediate hospital assessment, same-day paediatric assessment, or outpatient paediatric surgery/urology — with a referral that includes history, time of onset, observations, examination findings and analgesia given."},
    {title:"Advise, safety-net and follow up", html:"Safety-net the watch-and-wait conditions with clear written red-flag advice to carers; manage constipation (a common mimic); support recovery after surgery and code the surgical history for lifelong safety."}
  ],
  sections:[
    {id:"severe", nav:"Red flags", title:"Red flags — surgical emergencies and malignancy", sub:"Each of these needs immediate or very urgent assessment. This guide does not replace the local paediatric emergency, surgical or ambulance pathway.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Green or yellow-green (bile-stained) vomiting at any age", html:"Red flag for intestinal obstruction — manage as possible malrotation with midgut volvulus (time-critical) until excluded; other causes include intestinal atresia. → Immediate same-day hospital assessment; discuss with the receiving paediatric/surgical team. Do not delay transfer to obtain abdominal radiography or ultrasound in general practice. Call 999 if the child is shocked, deteriorating, severely unwell or there is concern about volvulus. (An urgent same-day upper GI contrast study for unexplained bile-stained vomiting in an infant is a hospital investigation — NICE NG1.)"},
         {tone:"red", h:"🔴 Possible intussusception", html:"Infant or young child with episodic severe abdominal pain or distress (drawing up knees), pallor or lethargy, vomiting, or unexplained rectal bleeding. Consider intussusception — usually infants and young children. The classic triad of colicky pain, vomiting and redcurrant-jelly stool is uncommon; redcurrant-jelly stool is a late feature and a palpable mass is not necessary. The child may appear well between episodes. → Immediate hospital assessment (999 if shocked or deteriorating). Ultrasound is the usual diagnostic test (hospital); AXR is not routinely required. Reduction is a hospital procedure."},
         {tone:"red", h:"🔴 Possible testicular torsion", html:"Sudden severe unilateral scrotal or lower abdominal pain ± nausea/vomiting, high-riding or abnormal testis, marked tenderness or absent cremasteric reflex. Treat as testicular torsion until proven otherwise — time-critical (aim for exploration within about 4–6 hours of onset). Torsion can present with abdominal pain without reported scrotal pain — always examine the testes. An absent cremasteric reflex is supportive but not essential; a normal reflex does not exclude torsion. → Immediate transfer directly to the appropriate emergency department/paediatric surgical centre capable of scrotal exploration, per the local (GIRFT) pathway. Do not send for community ultrasound or wait for routine imaging — ultrasound must not delay transfer or surgery. Ambulance if unstable, severely distressed, uncontrolled pain/vomiting, or cannot safely be transported. Do not use a TWIST score in general practice to downgrade risk."},
         {tone:"red", h:"🔴 Abdominal mass — possible Wilms tumour", html:"Painless abdominal mass (especially right-sided, flank) + haematuria + age under 5: Wilms tumour (nephroblastoma). → Very urgent referral for specialist assessment within 48 hours (NICE NG12, updated April 2026: palpable abdominal mass or unexplained enlarged abdominal organ); immediate hospital assessment if shock, severe pain, hypertension or clinical deterioration (999 if shocked or unstable). Do NOT repeatedly palpate (tumour rupture risk)."},
         {tone:"red", h:"🔴 Incarcerated inguinal hernia", html:"Groin lump that is irreducible (not returning to the abdomen when the child lies down or gentle pressure is applied) + vomiting + peritonism → strangulation risk (in girls the hernia may contain an ovary or fallopian tube). An irreducible, painful, erythematous or tense hernia, particularly with vomiting, abdominal distension or systemic illness → immediate hospital assessment; 999 if shocked, severely unwell or peritonism. Do NOT attempt forceful manual reduction in primary care — reduction, if attempted, is a hospital procedure by an appropriately experienced clinician, with urgent surgery if reduction fails or strangulation is suspected."},
         {tone:"red", h:"🔴 Neonatal obstruction", html:"Neonate or early infant with bile-stained vomiting + failure to pass meconium within 48h of birth + abdominal distension. Differential: Hirschsprung's disease, anorectal malformation, intestinal atresia, meconium ileus and other obstructive causes. → Immediate hospital assessment (999 if shocked or deteriorating). Failure to pass meconium within 48 hours in a term newborn, especially with distension, vomiting, poor feeding or later severe constipation, needs urgent paediatric assessment. Rectal biopsy is a specialist diagnostic procedure."},
         {tone:"red", h:"🔴 Button battery or magnet ingestion", html:"Button battery → urgent emergency assessment, particularly if oesophageal impaction is possible. Multiple magnets or magnet plus metal object → emergency referral even if initially asymptomatic. → Immediate hospital assessment (999 if unstable)."},
         {tone:"amber", h:"🟠 Oesophageal foreign body or food bolus", html:"Dysphagia, drooling, respiratory symptoms or inability to swallow → urgent referral for immediate hospital assessment."},
         {tone:"amber", h:"🟠 Newborn with anorectal malformation or abdominal wall defect", html:"→ Immediate neonatal/paediatric surgical assessment."},
         {tone:"red", h:"🔴 Inconsistent history or unexplained injuries", html:"Consider safeguarding and non-accidental injury → follow local safeguarding procedures alongside urgent clinical care."}
       ]},
       {b:"warn", html:"<b>Green or yellow-green vomiting in any infant or child is intestinal obstruction (possible volvulus) until proven otherwise</b> — immediate same-day hospital assessment; never delay transfer for imaging. An inguinal hernia in a young infant carries an incarceration risk warranting prompt referral. This guide does not replace the local paediatric emergency, surgical or ambulance pathway."},
       {b:"why", label:"Why is bilious vomiting treated as volvulus?", html:"Midgut volvulus from malrotation is the most time-critical surgical emergency in paediatrics and one of the most important diagnoses not to miss in a vomiting infant — the median age at presentation is 1 month (though it can occur at any age, including adulthood). The critical presentation: a previously well infant or child who suddenly vomits bright-green (bilious) fluid. The RULE: bilious vomiting at any paediatric age = surgical emergency until intestinal obstruction excluded. The mechanism: in malrotation, the small intestine is attached by a narrow pedicle that allows it to twist around the superior mesenteric artery. Occlusion of the SMA causes rapidly progressive ischaemia of the midgut — volvulus is time-critical — leading to massive bowel resection, short gut syndrome, and lifelong TPN dependence, or death. The definitive diagnosis (in hospital): upper gastrointestinal contrast study (the Ligament of Treitz is displaced to the right side instead of the normal left-of-midline position). A normal AXR does NOT exclude volvulus — the AXR may be completely normal in early volvulus. Never delay transfer from primary care to obtain imaging."}
     ]},

    {id:"age", nav:"By age", title:"Common paediatric surgical conditions — an age-based framework",
     blocks:[
       {b:"table", head:["Age","Conditions to consider"], rows:[
         ["<b>Neonatal period (0–4 weeks)</b>","<b>Pyloric stenosis:</b> non-bilious projectile vomiting from 2–8 weeks (peak onset 3–6 weeks), more common in firstborn males; an olive-shaped epigastric mass may be palpable, but repeated or deep palpation is unnecessary in primary care; USS arranged by the receiving service confirms. <b>Duodenal atresia:</b> “double bubble” on AXR (stomach + duodenum) — Down syndrome association. <b>Oesophageal atresia:</b> frothing at mouth, unable to tolerate feeds — unable to pass nasogastric tube. <b>Hirschsprung's disease:</b> failure to pass meconium in first 48h, constipation, abdominal distension."],
         ["<b>Infancy (1–12 months)</b>","<b>Intussusception:</b> most cases in infants and young children; episodic pain, pallor/lethargy, vomiting — redcurrant-jelly stool is a late feature and often absent. <b>Inguinal hernia:</b> indirect hernia (patent processus vaginalis) — most common surgical condition of infancy; right &gt; left; boys &gt; girls (in girls may contain an ovary or fallopian tube); risk in premature infants. <b>Undescended testis:</b> see the <a href='undescended-testis.html'>undescended testis protocol</a>. <b>Dacryocystitis</b> (nasolacrimal duct obstruction — presents as watery eye in infancy; most resolve during the first year). <b>Developmental dysplasia of hip (DDH):</b> Barlow/Ortolani at birth; Galeazzi sign at 6 weeks."],
         ["<b>Childhood (1–12 years)</b>","<b>Appendicitis:</b> peak 10–12 years (can occur at any age; infants have high perforation rate at presentation — atypical presentation). <b>Inguinal hernia</b> (older boys). <b>Hydrocele.</b> <b>Meckel's diverticulum:</b> painless rectal bleeding (commonest cause in child under 5) or Meckel's diverticulitis mimicking appendicitis. <b>Cryptorchidism</b> (undescended testis — if not corrected by 18 months). <b>Acute scrotum differential:</b> torsion of appendix testis (often less acute; blue dot sign at scrotal apex), epididymo-orchitis, incarcerated hernia, trauma and Henoch–Schönlein purpura (IgA vasculitis) — testicular torsion must be excluded first."]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"teal", h:"Related presentations", html:"Vomiting without a surgical cause: <a href='../algorithms/vomiting-children.html'>vomiting in children</a> and <a href='infant-reflux.html'>reflux in infants</a>. Abdominal pain: <a href='../algorithms/abdominal-pain-children.html'>abdominal pain in children</a>. Acute scrotum: <a href='../algorithms/scrotal-pain.html'>scrotal pain</a>."},
         {tone:"teal", h:"Common mimics", html:"Urinary tract infection mimics appendicitis — see <a href='uti-children.html'>UTI in children</a>. Constipation is a common mimic — see <a href='constipation-child.html'>constipation (child)</a>, but do not label functional constipation until obstructive and congenital causes have been considered."}
       ]},
       {b:"why", label:"Why is appendicitis so easily missed in young children?", html:"Appendicitis in young children (under 5 years) has a very high perforation rate at diagnosis — a high proportion of children under 2 years present with a perforated appendix. The reason: the appendix in young children has a thin wall and short lumen, and the greater omentum is less developed, meaning it cannot 'wall off' a perforating appendix. Additionally, young children cannot communicate their symptoms clearly, and atypical presentations (diffuse peritonism, diarrhoea, irritability) are common. The GP assessment: any child with lower abdominal pain, fever, and anorexia who is unwell and systemically ill should be assessed in hospital — the classical Rovsing's sign, psoas sign, and rebound tenderness may be absent in younger children. The Paediatric Appendicitis Score (PAS) or Alvarado score can be used in older children but are unreliable in under-5s. The key message: suspected appendicitis requires same-day paediatric assessment; peritonism, shock, marked toxicity or severe uncontrolled pain requires emergency transfer. Do not rely on a normal FBC or CRP to exclude appendicitis."}
     ]},

    {id:"assess", nav:"Assess", title:"Assessment — history and examination",
     blocks:[
       {b:"table", head:["Element","What to cover"], rows:[
         ["<b>Structured paediatric surgical history</b>","Age-appropriate history. Parents and child (if old enough). <b>Onset:</b> sudden (volvulus, torsion, intussusception) vs gradual (appendicitis, hernia). <b>Vomiting:</b> bilious (green = obstruction, emergency) vs non-bilious (feeding problem, pyloric stenosis, reflux). <b>Character:</b> colicky (intussusception, hernia obstruction, appendicitis) vs constant (peritonitis, ischaemia). <b>Associated:</b> fever (appendicitis, intussusception), rectal bleeding (intussusception, Meckel's), urinary (UTI — mimics appendicitis), testicular pain (torsion). Last normal stool + bowel habit. Previous episodes. Birth history (risk of malrotation, Hirschsprung's in NICU graduates). Possible ingestion of button batteries, magnets or foreign bodies. Is the history consistent with any injury (safeguarding)?"],
         ["<b>Examination (child-specific)</b>","Distress level (crying = pain vs calm = misleadingly reassuring in early peritonitis). <b>Vital signs:</b> HR — assess trends and interpret alongside temperature, distress, perfusion, capillary refill, blood pressure, respiratory rate, mental state and urine output; persistent tachycardia despite settling, analgesia or treatment of fever is concerning. Temperature. Pallor, capillary refill time (&gt;2s = circulation concern). <b>Abdomen:</b> tenderness (gentle, warm hands, allow child to cry out — note if maximum tenderness is localised), guarding and rigidity (peritonism), auscultation (absent bowel sounds in late obstruction). <b>Genitalia:</b> ALWAYS examine testes in boys with abdominal pain (torsion can present as abdominal pain without scrotal symptoms). <b>Hernia orifices:</b> inguinal and femoral. <b>Rectal examination:</b> do not perform a digital rectal examination routinely in primary care; if Hirschsprung disease or anorectal pathology is suspected, refer urgently to a clinician/service experienced in paediatric assessment."]
       ]},
       {b:"why", label:"Why does the cremasteric reflex matter — and not decide?", html:"The cremasteric reflex assessment for testicular torsion is an essential clinical skill for any GP examining a boy with scrotal pain — the cremasteric reflex is elicited by stroking the inner thigh, causing reflex contraction of the cremaster muscle and upward movement of the ipsilateral testis. In testicular torsion, the cremasteric reflex is often absent on the affected side (because the torted testis has an abnormal lie, and the reflex arc is disrupted). Importantly, a present cremasteric reflex makes torsion less likely, but does not exclude it — the reflex is supportive but not essential. The other key findings in torsion: horizontal lie of the testis (the testis lies transversely rather than with the long axis vertical — 'bell-clapper deformity'), epididymis may be anteriorly placed rather than posteriorly. The medicolegal principle: any boy with acute scrotal pain where torsion cannot be confidently excluded should be transferred immediately to a centre capable of scrotal exploration. Ultrasound may be used selectively in hospital where it will materially alter management, but must not delay transfer or surgery. Alternative diagnoses (torsion of appendix testis, epididymo-orchitis, incarcerated hernia, trauma, Henoch–Schönlein purpura) are considered only once torsion has been excluded. A TWIST score can support hospital assessment, but a low score does not exclude torsion."}
     ]},

    {id:"workup", nav:"Work-up", title:"Investigations — never a reason to delay transfer",
     blocks:[
       {b:"warn", html:"<b>Never delay transfer of an acutely unwell child to obtain imaging</b> — definitive imaging follows the local paediatric surgical/radiology pathway."},
       {b:"table", head:["Test","Setting","When and why"], rows:[
         ["<b>Urine dipstick + MSU</b>","Primary care","UTI mimics appendicitis"],
         ["<b>FBC + CRP</b>","Primary care","Only if they will not delay assessment — normal results do not exclude appendicitis"],
         ["<b>USS abdomen</b>","Hospital-led","Usual test for intussusception (target sign); useful but operator-dependent in appendicitis; hernia contents; hydrocele"],
         ["<b>AXR</b>","Hospital-led","Selected suspected obstruction, perforation or foreign body per local protocol — do not request for suspected constipation, or use to exclude intussusception or malrotation in primary care"],
         ["<b>Upper GI contrast study</b>","Hospital-led","Urgent same-day for unexplained bile-stained vomiting in infants — malrotation"],
         ["<b>CT</b>","Hospital-led","Not routine — only per local pathway, with radiation minimisation"]
       ]}
     ]},

    {id:"groin", nav:"Groin &amp; scrotum", title:"Inguinal hernia, undescended testis and hydrocele",
     blocks:[
       {b:"table", head:["Condition","Assessment and management"], rows:[
         ["<b>Inguinal hernia in children</b>","<b>Aetiology:</b> patent processus vaginalis (failure of peritoneal diverticulum to obliterate after testicular descent). Indirect inguinal hernia most common. <b>Presentation:</b> inguinal lump, usually intermittent (visible on crying/straining, disappears on lying down), right side more common, bilateral in a minority. <b>Incarceration:</b> hernia becomes non-reducible — irreducible, painful, erythematous or tense hernia (especially with vomiting, distension or systemic illness) → immediate hospital assessment; 999 if shocked, severely unwell or peritonism. <b>Signs of strangulation:</b> tense, tender, erythematous hernia + peritonism + systemic illness. <b>Management:</b> refer every child with a suspected inguinal hernia for paediatric surgical assessment — elective repair (herniotomy — ligation of patent processus vaginalis) is usually required; timing depends on age, prematurity, symptoms, reducibility and local arrangements. In girls the hernia may contain an ovary or fallopian tube. Do not confuse with an uncomplicated umbilical hernia, which is usually observed."],
         ["<b>Undescended testis (cryptorchidism)</b>","More common in preterm boys. Spontaneous descent mostly occurs in the first few months; unlikely after 6 months. Examine and document testicular position at birth (NIPE) and at the 6–8-week review. Bilateral undescended testes at the 6–8-week check → urgent referral to a paediatrician, to be seen within 2 weeks. A unilateral testis still undescended at 6–8 weeks → re-examine at 4–5 months (corrected for gestational age); if still undescended, or if it becomes impalpable, refer to paediatric surgery/urology to be seen by 6 months, so that orchidopexy can be done from about 6 months and completed ideally by 12 months and by 18 months at the latest (NICE CKS). A retractile testis (can be brought into the scrotum and stays) needs no referral but yearly review, because some ascend; an ascending testis is referred when found. Do not routinely request ultrasound to locate an undescended testis — it often does not reliably locate or exclude an intra-abdominal testis; specialist examination and, where necessary, examination under anaesthesia/laparoscopy are used. At the newborn check, bilateral impalpable testes, a unilateral impalpable testis, or an undescended testis with hypospadias → senior paediatric review within 24 hours (NIPE); bilateral non-palpable testes found later, genital ambiguity, or hypospadias with impalpable testes → urgent specialist/endocrine assessment (possible difference of sex development). <b>Risk:</b> increased risk of testicular germ cell tumour (early orchidopexy reduces, but does not abolish, the excess risk) and subfertility (especially bilateral)."],
         ["<b>Hydrocele</b>","<b>Communicating hydrocele:</b> patent processus vaginalis → fluid from peritoneum fills scrotal sac. Fluctuates with intra-abdominal pressure (larger after activity, smaller in morning). Transilluminates. Most uncomplicated infant hydroceles resolve spontaneously and can be observed initially. Refer earlier if the swelling is painful, rapidly enlarging, associated with a suspected hernia, the testis cannot be assessed, or there is concern about torsion, trauma, infection or a tumour. Persistent or communicating hydrocele → paediatric surgical review according to local practice (age alone is not an absolute threshold). <b>Non-communicating hydrocele:</b> closed fluid collection (no patent processus) — many infant hydroceles of this type also resolve spontaneously. <b>Acute painful scrotal swelling:</b> manage as an acute scrotum (same-day/immediate assessment) — ultrasound must not delay exploration when torsion is clinically suspected."]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"teal", h:"Undescended testis — full protocol", html:"The retractile-versus-true distinction, the examination technique, the NIPE referral timetable, urgent DSD/CAH presentations and lifelong testicular awareness are covered in full in the <a href='undescended-testis.html'>undescended testis protocol</a>."},
         {tone:"teal", h:"Hernia — full protocol", html:"Groin landmarks, the groin or scrotal lump that is not a hernia, and adult hernia management are covered in the <a href='hernia.html'>hernia protocol</a>."}
       ]},
       {b:"why", label:"Why orchidopexy by 12–18 months?", html:"The orchidopexy timing at 12–18 months for undescended testis is a specific timing standard that is important for GPs monitoring cryptorchidism — before 2009, the UK standard was orchidopexy at 5 years. The change in practice was based on evidence showing that: (1) spermatogonial cell numbers (the precursors to sperm) decline progressively from birth in undescended testes, with significant loss by 2 years; (2) germ cell tumour risk is increased in cryptorchidism but is not significantly modified by orchidopexy after age 5; and (3) malignancy risk in post-pubertal orchidopexy is not reduced. Therefore, the primary indication for early orchidopexy (by 18 months) is fertility preservation, not malignancy prevention. GPs should ensure testicular position is documented at birth and at the 6–8-week review, and that any boy whose testis is still undescended at the 4–5-month review (corrected age) is referred to paediatric surgery/urology, to be seen by 6 months, so that treatment can be completed ideally by 12 months and by 18 months at the latest. Late referral needs prompt (not emergency) action unless there is acute pain, bilateral non-palpable testes or possible difference of sex development."}
     ]},

    {id:"treat", nav:"Treat", title:"Managing common paediatric surgical conditions",
     blocks:[
       {b:"table", head:["Condition","GP role and hospital management"], rows:[
         ["<b>Appendicitis</b>","<b>GP role:</b> suspected appendicitis requires same-day paediatric assessment; peritonism, shock, marked toxicity or severe uncontrolled pain requires emergency transfer. Do not rely on a normal FBC or CRP to exclude appendicitis, and do not manage conservatively in the community. <b>In hospital:</b> ultrasound is useful but operator-dependent; further imaging follows the local paediatric surgical/radiology pathway with radiation minimisation (CT is not the routine next test). Operative, non-operative and antibiotic management is determined by the surgical team and local antimicrobial policy."],
         ["<b>Pyloric stenosis</b>","<b>Presentation:</b> 2–8 weeks, non-bilious projectile vomiting, hungry after vomiting, more common in boys (especially firstborn), an olive may be palpable (repeated or deep palpation is unnecessary in primary care). Progressively forceful, non-bilious vomiting with persistent hunger, dehydration or poor weight gain → same-day hospital assessment; USS arranged by the receiving service or an established urgent pathway. <b>Metabolic:</b> hypochloraemic hypokalaemic metabolic alkalosis — dehydration and electrolyte/acid–base abnormalities must be corrected before pyloromyotomy. <b>Surgery:</b> Ramstedt's pyloromyotomy (longitudinal incision of hypertrophied pyloric muscle) — curative."],
         ["<b>Intussusception</b>","<b>Diagnosis:</b> USS (target/doughnut sign). <b>Treatment (hospital):</b> air enema reduction (pneumatic reduction under radiology guidance — contraindicated if peritonism/perforation). Post-reduction observation duration follows the local paediatric surgical protocol; recurrence can occur. <b>Surgery:</b> if air enema fails — manual reduction + appendicectomy (lead point if found)."],
         ["<b>Torsion of testis</b>","Immediate surgical scrotal exploration — ultrasound must not delay transfer or surgery (selective hospital use only where it will materially alter management without delay). Detorsion + bilateral orchidopexy (3-point fixation). Viability falls with duration; salvage also varies with degree of torsion, age and intermittent torsion. If necrotic: orchidectomy + contralateral orchidopexy. Inform parents about fertility implications if bilateral torsion or late presentation."]
       ]},
       {b:"why", label:"Why air enema — and what the GP should not do", html:"The air enema reduction of intussusception is a radiological procedure that has replaced surgical reduction as the first-line treatment in the majority of uncomplicated cases in UK paediatric centres — it is performed under fluoroscopic (or ultrasound) guidance with air (or water/contrast) instilled under pressure via a rectal catheter, pushing the intussusceptum back into the colon. Success is high in uncomplicated cases without peritonism — a hospital-level outcome, not a GP-relevant expectation. The contraindications: peritonism (perforation risk), haemodynamic instability, prolonged obstruction (&gt;48–72 hours). After successful pneumatic reduction: observation follows local protocol (recurrence can occur). Recurrent intussusception (&gt;2 episodes) requires investigation for a pathological lead point (Meckel's diverticulum, intestinal polyp, lymphoma) — CT abdomen or laparoscopy. GPs managing a child with suspected intussusception should arrange immediate hospital assessment (999 if shocked or deteriorating) and not attempt any manual abdominal manipulation."}
     ]},

    {id:"neonatal", nav:"Neonates &amp; infants", title:"Neonatal and infant conditions — GP awareness",
     blocks:[
       {b:"table", head:["Condition","Recognition and action in primary care"], rows:[
         ["<b>Pyloric stenosis — recognition in primary care</b>","A mother presenting with a 4–6 week old infant who vomits after every feed (non-bilious, projectile, immediately after feeding, hungry afterwards) should have pyloric stenosis high on the differential. Avoid repeated or deep palpation for an “olive” — it is not necessary in primary care and may distress the infant. Progressively forceful, non-bilious vomiting in an infant (typically 2–8 weeks old) with persistent hunger, dehydration or poor weight gain → same-day hospital assessment (NICE NG1: same-day specialist assessment for infants under 2 months with progressively worsening or forceful vomiting); ultrasound is arranged by the receiving service or an established urgent pathway. In hospital, dehydration and electrolyte/acid–base abnormalities are corrected before pyloromyotomy (potassium added only when appropriate, after renal function and urine output are considered)."],
         ["<b>Hirschsprung's disease — GP awareness</b>","Hirschsprung's (congenital aganglionic megacolon) usually presents in neonatal period with failure to pass meconium within 48h of birth. Shorter-segment disease (more common) may present in infancy or childhood with severe constipation not responding to standard laxatives, chronic abdominal distension, and failure to thrive. Do not perform a digital rectal examination routinely in primary care — rectal examination and biopsy should only be undertaken by clinicians competent in identifying Hirschsprung's (NICE CG99); the “explosive stool” sign is not reliable enough to use diagnostically. Failure to pass meconium within 48 hours in a term newborn, especially with abdominal distension, vomiting, poor feeding or subsequent severe constipation, requires urgent paediatric assessment. Do not label the child as having functional constipation until obstructive and congenital causes have been considered."],
         ["<b>Umbilical hernia management</b>","Most uncomplicated umbilical hernias can be observed and usually close spontaneously during early childhood. No active treatment required in infancy. Refer if painful, irreducible, associated with skin compromise, enlarging, or persistent beyond the usual age of spontaneous closure according to local paediatric surgical policy. No belts or strapping (ineffective, potentially harmful). No urgent investigation needed in uncomplicated umbilical hernia."]
       ]},
       {b:"why", label:"Why consider Hirschsprung's in a constipated child?", html:"The recognition of Hirschsprung's disease in older children presenting to primary care with 'constipation' is an important but challenging clinical skill — while the majority of children with constipation have functional constipation (no organic cause), Hirschsprung's disease (affecting approximately 1 in 5,000 live births) can present with constipation throughout childhood if the aganglionic segment is short (ultra-short segment disease). The discriminating features that should prompt urgent specialist referral rather than empirical laxative treatment alone: (1) severe constipation present since birth (never had a normal stool frequency without intervention); (2) failure to respond to adequate doses of macrogol; (3) constipation accompanied by significant abdominal distension; (4) failure to thrive despite adequate caloric intake; and (5) features of Hirschsprung's enterocolitis (a dangerous complication needing immediate assessment). Rectal examination and rectal biopsy are specialist-led — refer urgently when red-flag features are present (NICE CG99)."}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Immediate hospital assessment (999 if unstable)", html:"Green/yellow-green vomiting at any age · Suspected testicular torsion or acute unexplained scrotal pain · Irreducible painful inguinal hernia · Suspected intussusception · Suspected appendicitis with peritonism or systemic deterioration · Severe neonatal abdominal distension with vomiting or failure to pass meconium · Button battery, multiple magnet or magnet-plus-metal ingestion · Abdominal mass with shock, severe pain, hypertension or clinical deterioration. Call 999 if unstable, shocked, severe respiratory compromise, peritonism, uncontrolled pain or rapid deterioration."},
         {tone:"amber", h:"Same-day paediatric assessment", html:"Progressive forceful vomiting in an infant under 2 months / suspected pyloric stenosis · Suspected appendicitis without peritonism · Painful or acute scrotal swelling where torsion cannot be confidently excluded · Acute hydrocele or testicular swelling · Persistent severe constipation with red flags for Hirschsprung disease · Suspected abdominal mass without immediate instability (very urgent specialist assessment within 48 hours — NICE NG12)"},
         {tone:"blue", h:"Urgent outpatient referral (paediatric surgery/urology)", html:"Undescended testis still not scrotal at the 4–5-month review (corrected age), to be seen by 6 months (treatment ideally by 12 months, at the latest 18 months) · Reducible, asymptomatic inguinal hernia (all children; prompt in young infants) · Communicating or persistent hydrocele · Persistent umbilical hernia according to local criteria · Unexplained visible haematuria (palpable abdominal mass → very urgent NICE NG12 pathway)"},
         {tone:"blue", h:"Paediatric urology / urogynae", html:"Vesicoureteric reflux + recurrent UTI · Posterior urethral valves · Hypospadias management (specialist surgery) · Bilateral non-palpable testes, genital ambiguity or hypospadias with impalpable testes → urgent specialist/endocrine assessment"},
         {tone:"green", h:"GP management", html:"Uncomplicated infant hydrocele: observe initially; refer earlier if painful, enlarging, hernia suspected or testis can't be assessed. Dacryocystitis (sticky eye in infant): nasolacrimal massage + chloramphenicol drops if infected. Umbilical hernia: most close spontaneously during early childhood — observe; refer if painful, irreducible, skin compromise, enlarging, or persistent beyond the usual age of spontaneous closure per local paediatric surgical policy. No strapping or belts."},
         {tone:"cream", h:"Local referral details", html:"Record the local paediatric emergency department, paediatric surgical/urology advice line and ambulance criteria. The referral should include history, time of onset, observations, examination findings and analgesia given. Advise whether the child should be nil by mouth, and give analgesia and fluid advice pending transfer, per the local pathway."}
       ]},
       {b:"why", label:"Why observe most umbilical hernias?", html:"The umbilical hernia management pathway is frequently over-referred in UK primary care — the vast majority of umbilical hernias in children (which result from incomplete closure of the umbilical ring) resolve spontaneously without any intervention. The natural history: most umbilical hernias close spontaneously during early childhood. Complications (incarceration, strangulation) are extremely rare in children with umbilical hernias — in contrast to femoral and inguinal hernias which do have significant incarceration risk. The GP management: reassure parents, observe, and refer if the hernia is painful, irreducible, associated with skin compromise, enlarging, or persistent beyond the usual age of spontaneous closure according to local paediatric surgical policy (size/age thresholds are local criteria, not national standards). No strapping, belting, or coin-taping of umbilical hernias — these are ineffective, potentially harmful (skin maceration), and not recommended. This approach avoids unnecessary paediatric surgery referrals and parental anxiety."}
     ]},

    {id:"advice", nav:"Advice", title:"Advice — safety-net the watch-and-wait conditions",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"Hydrocele and hernia", html:"<b>Most infant hydroceles</b> resolve — observe; refer if painful, enlarging, hernia suspected or testis can't be assessed. <b>Inguinal hernia</b> needs paediatric surgical assessment for repair (prompt in young infants; timing per local surgical team) — teach parents the signs of incarceration."},
         {tone:"green", h:"Constipation, testes and written advice", html:"Manage constipation (a common mimic) with diet/fluids/laxatives. Ensure an undescended testis still not scrotal at the 4–5-month review is referred, to be seen by 6 months (treatment ideally by 12 months, at the latest 18 months). Give clear written red-flag advice to carers."}
       ]}
     ]},

    {id:"lifestyle", nav:"Recovery", title:"Perioperative support and child surgical recovery",
     blocks:[
       {b:"tiles", v:"life", items:[
         {t:"Preparing children for surgery — reducing anxiety", html:"Preoperative anxiety is common in children and can worsen postoperative pain and recovery. Strategies: age-appropriate explanation of what will happen (hospital play specialist), parental presence during induction of anaesthesia (most UK paediatric centres allow), any topical anaesthetic or premedication is prescribed and administered according to the anaesthetic/paediatric team's protocol. “Hospital books” (story books explaining hospital procedures) reduce anxiety in under-8s."},
         {t:"Postoperative wound care at home", html:"Most paediatric surgical wounds are closed with absorbable sutures or Steri-strips — no suture removal needed. Follow the operation-specific discharge instructions for keeping the wound dry, bathing and swimming. Signs of wound infection: increasing redness, swelling, discharge, fever — contact the surgical team or GP; wound infection may need examination, swabbing, drainage or specialist review. Laparoscopic port sites: usually 3–5 mm — heal rapidly, minimal restriction."},
         {t:"Return to school and activities after surgery", html:"Use the discharge letter and surgeon's advice for return to school, activities and sport — timelines vary with the operation and are longer after laparotomy, bowel resection or complications."},
         {t:"Constipation prevention post-hernia repair and after orchidopexy", html:"Straining at stool increases intra-abdominal pressure and can stress wound/suture line. If a laxative is needed, follow the surgical team's plan (dose depends on age, weight, stool pattern and hydration). High-fibre diet: fruit, vegetables, wholegrain cereals. Adequate fluid intake. Early ambulation."},
         {t:"Testicular self-awareness education after orchidopexy", html:"Boys who have had orchidopexy for undescended testis have an increased risk of testicular germ cell tumour (GCT), which early orchidopexy reduces but does not abolish. Provide adolescent education about testicular awareness: seek prompt assessment for a new lump, enlargement, asymmetry or persistent pain. This is a critical long-term outcome conversation that surgeons and GPs should initiate at adolescent reviews."},
         {t:"Parental communication after paediatric surgical emergencies", html:"Parents who have experienced a child's surgical emergency (torsion, intussusception, volvulus) often experience significant parental anxiety, post-traumatic stress, and over-protectiveness. Debriefing at follow-up GP appointment: explain what happened, why, what was done, and what to watch for. Signpost: paediatric surgical team follow-up letter. Address parental anxiety specifically: “Your reaction to this frightening event is completely normal — most children recover fully and have no long-term problems.” Parental mental health impact: refer to NHS Talking Therapies if significant anxiety or PTSD symptoms persist."},
         {t:"Nutrition after paediatric GI surgery", html:"After bowel surgery (appendicectomy, intussusception, Meckel's): clear fluids initially, then normal diet within days for most cases. After pyloric stenosis repair: small frequent feeds starting 4–6 hours post-op, increasing to full feeds within 24–48h. After bowel resection (volvulus, short bowel): specialist paediatric dietitian management — parenteral nutrition if significant bowel loss. B12 monitoring if terminal ileum resected. No long-term dietary restrictions for most paediatric surgical procedures."},
         {t:"Long-term follow-up after paediatric surgery", html:"Pyloric stenosis: no long-term GI sequelae after Ramstedt's. Annual weight/growth monitoring for 2 years. Cryptorchidism: document the history, ensure specialist follow-up where indicated, and provide adolescent testicular awareness education. Intussusception: recurrence can occur — parents educated to return immediately with same symptoms. Appendicectomy: stump appendicitis (very rare) — report new right iliac fossa pain. Bowel obstruction after abdominal surgery: abdominal adhesions → mechanical obstruction risk lifelong."}
       ]},
       {b:"why", label:"Why testicular awareness after orchidopexy?", html:"The testicular germ cell tumour risk education after cryptorchidism correction is a long-term GP responsibility that is frequently not completed — while orchidopexy by 12–18 months reduces the fertility risk of undescended testis and reduces but does not abolish the excess cancer risk, men with a history of cryptorchidism retain an increased risk of GCT. This elevated risk persists even after successful orchidopexy and into adulthood. GPs who review young men with a documented history of orchidopexy in childhood should: (1) confirm they are aware of their elevated GCT risk; (2) provide testicular awareness education; and (3) advise prompt assessment of any new lump, enlargement, asymmetry or persistent pain."}
     ]},

    {id:"monitor", nav:"Follow-up", title:"Follow-up, monitoring and post-surgical safety",
     blocks:[
       {b:"table", head:["After","What to do"], rows:[
         ["<b>Appendicectomy</b>","Follow local surgical follow-up arrangements; offer GP review if concerns arise. Suspected wound infection: examine and discuss with the surgical team — it may need swabbing, drainage, specialist review or a specific antibiotic strategy (no automatic GP antibiotic). If ongoing abdominal pain after appendicectomy: consider stump appendicitis (rare), post-surgical adhesion obstruction, or functional abdominal pain."],
         ["<b>Orchidopexy</b>","Review at 6–12 months (surgeon follow-up). GP role: document the clinical history accurately and ensure specialist follow-up where indicated. Adolescence: testicular awareness education and prompt assessment of a new lump, enlargement, asymmetry or persistent pain."],
         ["<b>Hernia repair</b>","Return to surgery if: recurrence of lump in groin (hernia recurrence — uncommon), new scrotal swelling (haematoma, recurrent hydrocele), or wound problems."],
         ["<b>Intussusception</b>","Parents education: if child develops same symptoms (colicky pain, drawing up knees, rectal bleeding), return to A&amp;E immediately — recurrence can occur."]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"📞 Immediate hospital assessment (999 if unstable)", html:"Green/yellow-green vomiting · Suspected torsion or acute unexplained scrotal pain · Irreducible painful inguinal hernia · Suspected intussusception · Appendicitis with peritonism or systemic deterioration · Button battery/multiple magnet ingestion · Abdominal mass with shock, severe pain, hypertension or deterioration (otherwise very urgent 48-hour specialist assessment — NICE NG12). 999 if unstable, shocked, severe respiratory compromise, peritonism, uncontrolled pain or rapid deterioration."},
         {tone:"amber", h:"🟠 Same-day paediatric assessment", html:"Suspected appendicitis without peritonism · Progressive forceful vomiting in an infant under 2 months (suspected pyloric stenosis) · Acute scrotal or testicular swelling where torsion cannot be confidently excluded · Severe constipation with Hirschsprung red flags. (Undescended testis not yet referred: prompt referral, not same-day — unless acute pain, bilateral non-palpable testes or possible difference of sex development.)"},
         {tone:"cream", h:"💬 Urgent return advice for carers", html:"<b>Immediate hospital assessment</b> (999 if unstable or deteriorating) for <b>green or yellow-green vomiting</b> (possible obstruction/volvulus — time-critical), episodic severe pain, pallor/lethargy, vomiting or rectal bleeding (possible intussusception — redcurrant-jelly stool is a late feature), sudden scrotal or lower abdominal pain (torsion until proven otherwise — time-critical), or a painful irreducible groin swelling. Abdominal mass → very urgent assessment within 48 hours (NICE NG12); do not repeatedly palpate. Re-examine if symptoms persist or evolve."}
       ]},
       {b:"why", label:"Why does the GP record matter for life?", html:"The GP's role after paediatric surgical procedures is to provide a longitudinal safety net and developmental monitoring function that specialist surgical teams cannot provide at single follow-up appointments — specifically for cryptorchidism (accurate documentation and adolescent testicular awareness education), for colon surgery (monitoring for bowel obstruction symptoms from adhesions, B12 monitoring after ileal resection), and for psychological recovery after emergency surgery (assessing both the child's adaptation and parental anxiety). The documentation of paediatric surgical history in the GP record is also critical for cancer risk monitoring — a boy who had orchidopexy at 18 months needs to have this coded in his GP record so that when he is 28 years old and presents as a new GP registration, the doctor is aware of his elevated GCT risk. SNOMED/Read code documentation of 'orchidopexy', 'undescended testis', and 'pyloric stenosis' in the structured problem list (not just free text in the notes) enables this longitudinal safety monitoring."}
     ]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG1 — Gastro-oesophageal reflux disease in children and young people</b><br><a href="https://www.nice.org.uk/guidance/ng1" rel="noopener">nice.org.uk/guidance/ng1</a><span class="rd"> — bile-stained vomiting (urgent same-day upper GI contrast study); same-day specialist assessment for infants under 2 months with progressively worsening or forceful vomiting (pyloric stenosis)</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral</b> (updated April 2026)<br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — Wilms tumour/neuroblastoma: very urgent referral within 48 hours for a palpable abdominal mass or unexplained enlarged abdominal organ</span></li>'+
         '<li><b>NICE CG99 — Constipation in children and young people</b><br><a href="https://www.nice.org.uk/guidance/cg99" rel="noopener">nice.org.uk/guidance/cg99</a><span class="rd"> — Hirschsprung\'s red flags; rectal examination and biopsy only by clinicians competent in identifying Hirschsprung\'s</span></li>'+
         '<li><b>NHS England / GIRFT — paediatric testicular torsion pathway</b><span class="rd"> — immediate transfer to a centre capable of scrotal exploration; imaging must not delay surgery</span></li>'+
         '<li><b>EAU — Paediatric Urology guideline</b><br><a href="https://uroweb.org/guidelines/paediatric-urology" rel="noopener">uroweb.org/guidelines/paediatric-urology</a><span class="rd"> — undescended testes (timing of referral and orchidopexy, no routine ultrasound), hydrocele</span></li>'+
         '<li><b>NICE Clinical Knowledge Summaries — Undescended testes</b><br><a href="https://cks.nice.org.uk/topics/undescended-testes/" rel="noopener">cks.nice.org.uk/topics/undescended-testes</a><span class="rd"> — bilateral undescended testes at 6–8 weeks: urgent paediatric referral, seen within 2 weeks; unilateral: re-examine at 4–5 months (corrected age), then refer to paediatric surgery/urology to be seen by 6 months; orchidopexy ideally before 12 months</span></li>'+
         '<li><b>NHS Newborn and Infant Physical Examination (NIPE) Programme</b><br><a href="https://www.gov.uk/government/publications/newborn-and-infant-physical-examination-programme-handbook" rel="noopener">gov.uk — NIPE programme handbook</a><span class="rd"> — testicular position at birth and at the 6–8-week review; senior paediatric review within 24 hours for bilateral or unilateral impalpable testes, or an undescended testis with hypospadias, at the newborn check</span></li>'+
         '<li><b>Supplementary (not national guidance): Patient.info — Surgical emergencies in childhood</b><span class="rd"> — background on paediatric surgical presentations</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Surgical problems in children in primary care. Green or yellow-green vomiting: intestinal obstruction (possible volvulus) until proven otherwise — immediate hospital assessment, never delay transfer for imaging. Suspected torsion: immediate transfer to a centre capable of scrotal exploration. Suspected intussusception, irreducible painful hernia, appendicitis with peritonism, button battery or magnet ingestion: immediate hospital assessment. Abdominal mass: very urgent assessment within 48 hours (NICE NG12). Undescended testis: re-examine at 6–8 weeks and 4–5 months; refer if still undescended, to be seen by 6 months (bilateral at 6–8 weeks: urgent paediatrics within 2 weeks). Educational use only. Sources: NICE NG1, NICE NG12 (updated April 2026), NICE CG99, NHS England/GIRFT paediatric testicular torsion pathway, EAU Paediatric Urology guideline, NHS NIPE Programme; supplementary (not national guidance): Patient.info. This guide does not replace the local paediatric emergency, surgical or ambulance pathway."
});
