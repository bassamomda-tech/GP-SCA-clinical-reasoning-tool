<script>
MG.render({
  icon:"🧬",
  title:"Familial hypercholesterolaemia — the complete guide",
  eyebrow:"Protocol · NICE CG71 · diagnosing one person is diagnosing a family",
  stemTitle:"FH is usually an inherited (often monogenic), lifelong and very-high-risk disorder, so it is never risk-scored with QRISK — and the defining action is not the statin but the cascade testing of relatives who carry the same untreated risk",
  stemSub:"One page for the whole condition. Recognise it — including the systematic record search that finds undiagnosed cases — and know that <b>QRISK underestimates FH and must not be applied to it</b>. Apply Simon Broome or DLCN criteria in primary care if competent to do so and refer for specialist assessment and DNA testing when the criteria are met, treat to a <b>≥50% LDL-C reduction</b> from the untreated baseline rather than an ordinary primary-prevention target, ensure cascade testing of first-, second- and, where feasible, third-degree relatives actually happens, and handle the two situations GPs get wrong: lipid-lowering medicines around pregnancy, and children.",
  guideline:"NICE CG71 (2008, updated 2019) · NICE QS41 · NICE NG238 (2023) · NICE TA393 and TA394 (2016) · NICE TA733 (2021) · NICE TA1002",
  reviewed:"14 September 2026",
  nextReview:"14 March 2027",
  meta:[
    {t:"NICE CG71 — familial hypercholesterolaemia"},
    {t:"Do NOT use QRISK in FH — it underestimates", tone:"tw"},
    {t:"Target: ≥50% reduction in LDL-C from baseline", tone:"tw"},
    {t:"v2.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#suspect"><b>Suspect</b><small>Thresholds · search</small></a><a href="#cascade"><b>Cascade</b><small>Test the family</small></a><a href="#treat"><b>Treat</b><small>≥50% LDL drop</small></a><a href="#monitor"><b>Monitor</b><small>Lipids · LFTs</small></a><a href="#refer"><b>Refer</b><small>Criteria-based</small></a></div>',
  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⛔ Never risk-score FH with QRISK", html:"FH is usually an inherited, lifelong disorder caused by a pathogenic lipid-related genetic variant (LDLR, APOB or PCSK9), but a clinical diagnosis may be made when genetic testing is negative or unavailable. It is very high risk and QRISK underestimates it. Unlike ordinary high cholesterol, FH is not risk-stratified — it is treated on the diagnosis. Applying a population risk calculator to an inherited lipid disorder produces a falsely reassuring number and delays treatment by years."},
    {tone:"amber", h:"When to suspect it", html:"Suspect FH in adults with total cholesterol >7.5 mmol/L, particularly when there is premature coronary heart disease (an event before 60 years) in the patient or a first-degree relative, or tendon xanthomata (child: TC above 6.7 or LDL above 4.0). Use the full lipid profile, family history, examination and clinical criteria rather than a single LDL-C cut-off alone. Search the records systematically: younger than 30 years with TC >7.5 mmol/L, or aged 30 years or older with TC >9.0 mmol/L. <b>These thresholds identify people who require assessment for FH; they do not establish the diagnosis.</b>"},
    {tone:"red", h:"⚠ Suspected homozygous FH goes straight to a specialist centre", html:"Consider homozygous FH in an adult with LDL-C >13 mmol/L or in a child/young person with LDL-C >11 mmol/L, and in a child with two affected parents, tendon or cutaneous xanthomata, childhood coronary disease or a very high LDL-C. Refer urgently to a specialist FH centre; do not allow application of heterozygous-FH (Simon Broome or DLCN) criteria to delay referral. This is a different disease in severity and needs apheresis-capable services."},
    {tone:"blue", h:"The target is a ≥50% LDL-C reduction", html:"A higher bar than ordinary primary prevention: offer a high-intensity statin (atorvastatin or rosuvastatin) at the maximum licensed or tolerated dose and aim for at least a 50% LDL-C reduction from the untreated baseline. Not met despite adherence → add ezetimibe 10 mg OD → refer to the specialist lipid service. PCSK9 inhibitors, inclisiran, other specialist agents or apheresis may be considered only if NICE, NHS England and local commissioning criteria are fulfilled."},
    {tone:"green", h:"Diagnosing one person means testing the family", html:"After genetic confirmation, cascade testing should be coordinated through the specialist service for first- AND second-degree relatives, and third-degree relatives where feasible, including children. Where the family mutation is known, offer relatives targeted DNA testing rather than LDL alone — and note that <b>simply telling a patient to \"tell your relatives\" does not work</b>; the cascade has to be organised."},
    {tone:"red", h:"⚠ Statins and pregnancy", html:"<b>Pregnancy is not contraindicated in FH. Statins are contraindicated in pregnancy: lipid-lowering medicines should generally be stopped three months before attempting conception and not restarted until breastfeeding is complete.</b> If pregnancy occurs while taking a statin, stop the statin and arrange prompt specialist/obstetric advice; inadvertent early exposure does not automatically indicate pregnancy termination. Plan contraception and offer pre-conception counselling as part of routine FH care, not as an afterthought. Children at risk of FH should be offered diagnostic testing by age 10, or earlier where homozygous FH is suspected; do not initiate or titrate paediatric statin therapy without an agreed specialist pathway."}
  ],
  pathwaySub:"Five steps, and the second is the one that distinguishes FH care from lipid care.",
  pathway:[
    {title:"Suspect it — and search for it", html:"Apply the thresholds, look for tendon xanthomata and premature family CHD, and run the systematic record search (TC >7.5 mmol/L under 30; TC >9.0 mmol/L at 30 or over). Obtain two LDL-C measurements where feasible. <b>Exclude secondary causes before labelling.</b>"},
    {title:"Apply the criteria, refer for DNA testing, then cascade the family", html:"Apply Simon Broome or DLCN criteria in primary care if competent to do so; refer for specialist lipid assessment and DNA testing when Simon Broome suggests possible/definite FH or the DLCN score is >5 — then coordinated testing of first-, second- and, where feasible, third-degree relatives.", alert:true},
    {title:"Treat to a ≥50% LDL reduction", html:"High-intensity statin at the maximum licensed or tolerated dose → ezetimibe → specialist referral (commissioned agents only where NICE and local criteria are met). <b>Lifestyle is an adjunct and cannot normalise FH lipids alone.</b>"},
    {title:"Monitor lipids, liver and the cascade", html:"Full lipid profile 2–3 months after starting or changing treatment, then at least annually once stable; liver transaminases before treatment and after initiation or dose change according to current NICE/local guidance; CK only if there are muscle symptoms or a specific indication; and check at every review that relatives are actually being tested."},
    {title:"Plan for pregnancy, lifelong", html:"Contraception, pre-conception counselling, and stopping lipid-lowering medicines three months before attempting conception, not restarting until breastfeeding is complete."}
  ],
  sections:[

    {id:"suspect", nav:"Suspect", title:"Step 1 — recognising FH, and finding the cases you have not diagnosed",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>Suspect FH</b>","Adults with total cholesterol >7.5 mmol/L, particularly with premature coronary heart disease (an event before 60 years) in the patient or a first-degree relative, or tendon xanthomata (child TC above 6.7 / LDL above 4.0). Use the full lipid profile, family history, examination and clinical criteria rather than a single LDL-C cut-off alone"],
         ["<b>Search the records systematically</b>","Younger than 30 years: TC >7.5 mmol/L; aged 30 years or older: TC >9.0 mmol/L. <b>These thresholds identify people who require assessment for FH; they do not establish the diagnosis.</b> Run a regular search of coded and uncoded lipid results, then manually review family history, secondary causes and previous statin treatment"],
         ["<b>Confirm LDL-C</b>","Obtain two LDL-C measurements where feasible before confirming FH, unless urgent specialist referral is required because of very severe hypercholesterolaemia or clinical features. Do not delay urgent referral for very high LDL-C, childhood xanthomata or premature coronary disease"],
         ["<b>Suspected homozygous FH</b>","Adult LDL-C >13 mmol/L, or child/young person LDL-C >11 mmol/L; also consider in a child with two affected parents, tendon or cutaneous xanthomata, childhood coronary disease or a very high LDL-C → refer urgently to a specialist FH centre; do not allow application of heterozygous-FH (Simon Broome or DLCN) criteria to delay referral"],
         ["<b>Diagnostic criteria</b>","Simon Broome or Dutch Lipid Clinic Network (DLCN) criteria can be applied in primary care by a competent clinician. Refer for specialist assessment and DNA testing when Simon Broome criteria indicate possible or definite FH or the DLCN score is >5. FH is usually monogenic, but a clinical diagnosis may be made when genetic testing is negative or unavailable"],
         ["<b>Exclude secondary causes first</b>","Hypothyroidism, nephrotic syndrome, chronic kidney disease, cholestasis and other liver disease, uncontrolled diabetes, obesity and dietary factors, pregnancy, excess alcohol (particularly where triglycerides are also raised), and medicines such as corticosteroids, ciclosporin, retinoids, some antipsychotics and antiretroviral therapy — before referral and before labelling anyone with FH"]
       ]},
       {b:"why", html:"FH is usually an inherited (often monogenic), lifelong, very-high-risk condition — and unlike ordinary high cholesterol it is not risk-scored with QRISK, which underestimates it. The defining feature is that diagnosing one person should trigger cascade testing of the whole family, because each affected relative carries the same untreated risk of early coronary disease. That is what makes FH a family diagnosis rather than an individual one, and it is the part most often left undone."}
     ]},

    {id:"cascade", nav:"Cascade", title:"Step 2 — cascade testing: the action that defines FH care",
     blocks:[
       {b:"dl", rows:[
         ["<b>Who to test</b>","After genetic confirmation, cascade testing should be coordinated through the specialist service for first- AND second-degree relatives, and third-degree relatives where feasible, including children"],
         ["<b>What test</b>","Where the family mutation is known, offer relatives targeted DNA testing rather than LDL measurement alone — LDL alone misses affected relatives whose levels overlap the normal range"],
         ["<b>Why it needs organising</b>","<b>Simply telling patients to \"tell your relatives\" does not work.</b> The cascade is a coordinated process, and checking that it has actually started is a legitimate primary-care task at every review"],
         ["<b>The GP role</b>","Ensure the patient understands the importance of cascade testing; check that the specialist service has initiated it; document barriers; involve the family or safeguarding team where appropriate. <b>Do not contact relatives independently without consent and an appropriate information-governance pathway</b>"],
         ["<b>Children</b>","<b>Children at risk of FH should be offered diagnostic testing by age 10, or earlier where homozygous FH is suspected.</b> Refer to a paediatric lipid specialist for treatment assessment; do not initiate or titrate paediatric statin therapy without an agreed specialist pathway. Specialist treatment may be appropriate before age 10 in severe or homozygous disease"]
       ]},
       {b:"say", html:"This is an inherited cause of very high cholesterol, so it may need specialist assessment and genetic testing and — importantly — testing of your relatives, because they may have it too. We will start a strong statin to cut your cholesterol by at least half and protect your heart for the long term. The family testing matters as much as your own treatment: your brothers, sisters, parents and children each have a real chance of carrying the same gene, and finding it early is what prevents heart attacks in them."}
     ]},

    {id:"treat", nav:"Treat", title:"Step 3 — lipid-lowering to a ≥50% LDL reduction",
     blocks:[
       {b:"table", head:["Step","Treatment","Detail"], rows:[
         ["<b>Step 1 — high-intensity statin</b>","Atorvastatin or rosuvastatin, at the maximum licensed or tolerated dose","Aim for at least a 50% LDL-C reduction from the untreated (pre-treatment) baseline — a higher bar than ordinary primary prevention. If the untreated level is unavailable, use the highest reliable historical level and document the limitation. Treatment is lifelong; interpret target attainment alongside adherence and tolerance. Treatment can start while awaiting specialist review when clinically indicated"],
         ["<b>Step 2 — add ezetimibe</b>","<b>Ezetimibe 10 mg once daily added to the statin</b>","<b>Where the ≥50% reduction is not achieved despite adherence.</b> Ezetimibe may be used alone if no statin dose is tolerated (then refer to the lipid service)"],
         ["<b>Step 3 — refer to the specialist lipid service</b>","If the ≥50% reduction is not achieved despite adherence to the maximum tolerated statin plus ezetimibe","PCSK9 inhibitors (alirocumab NICE TA393, evolocumab NICE TA394), inclisiran (NICE TA733), other specialist agents or apheresis may be considered <b>only if NICE, NHS England and local commissioning criteria are fulfilled</b> — not routine for all FH"],
         ["<b>Homozygous FH — specialist only</b>","Specialist FH centre","PCSK9-directed treatment where appropriate; evinacumab in line with NICE TA1002; lipoprotein apheresis; specialist combination therapy"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"red", h:"⚠ Pregnancy", html:"<b>Pregnancy is not contraindicated in FH.</b> Statins are contraindicated in pregnancy: stop lipid-lowering medicines three months before attempting conception and do not restart until breastfeeding is complete. If pregnancy occurs on a statin, stop it and arrange prompt specialist/obstetric advice — inadvertent early exposure does not automatically indicate termination. Homozygous FH needs specialist cardiology/obstetric input; assess for aortic stenosis and established coronary disease. Routine lipid monitoring is not usually useful in pregnancy. Bile-acid sequestrants may be considered if lipid-lowering is needed during pregnancy or breastfeeding; do not start PCSK9 inhibitors, inclisiran or ezetimibe in pregnancy unless specialist advice supports an exceptional decision. <b>Plan contraception and pre-conception counselling.</b> This applies to a young population on lifelong treatment, so it is a routine conversation, not an exceptional one."},
         {tone:"amber", h:"⚠ Children", html:"Children at risk of FH should be offered diagnostic testing by age 10, or earlier where homozygous FH is suspected. Refer to a paediatric lipid specialist for treatment assessment; do not initiate or titrate paediatric statin therapy without an agreed specialist pathway."},
         {tone:"amber", h:"💪 Statin intolerance", html:"Do not assume all muscle aches represent statin intolerance. If muscle symptoms occur, assess severity, timing, CK where clinically indicated, interacting medicines, thyroid function and other causes. Rechallenge with a lower dose, an alternative statin or intermittent dosing where appropriate. If no statin dose is tolerated, use ezetimibe and refer to the lipid service."},
         {tone:"green", h:"🥗 Lifestyle is an adjunct", html:"Cardioprotective diet and reduced saturated fat help but cannot normalise FH lipids alone. Smoking cessation is critical given the already very high coronary risk; regular activity, healthy weight, alcohol within limits."},
         {tone:"blue", h:"👨‍👩‍👧 Engage the family in both", html:"<b>Family testing and shared lifestyle change go together</b> — the household usually shares both the genes and the diet."}
       ]}
     ]},

    {id:"monitor", nav:"Monitor", title:"Step 4 — lipids, liver and the family",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["<b>LDL and lipid profile</b>","<b>Full lipid profile 2–3 months after starting or changing treatment, then at least annually once stable</b>","<b>Confirm the ≥50% reduction from untreated baseline; intensify if not achieved.</b> Also record the achieved absolute LDL-C and cardiovascular disease status (established ASCVD, homozygous or very-high-risk FH), because specialist treatment eligibility may depend on both"],
         ["<b>Liver transaminases</b>","<b>Before treatment, and after initiation or dose change according to current NICE (NG238)/local guidance</b>","If raised, consider the trend, symptoms, bilirubin, other causes and whether the abnormality is persistent; follow the current lipid-modification pathway and SPC"],
         ["<b>CK</b>","<b>Not routinely</b>","Check CK if muscle symptoms are severe, persistent or associated with weakness or dark urine; assess renal function if rhabdomyolysis is suspected"],
         ["<b>Adherence</b>","<b>Each review</b>","Address statin hesitancy proactively rather than waiting for the patient to disclose non-adherence; document adherence before escalating treatment"],
         ["<b>Cascade status</b>","<b>Ongoing</b>","Check that relatives are actually being tested — this is the step that quietly fails"]
       ]},
       {b:"dl", rows:[
         ["<b>After specialist diagnosis</b>","Establish treatment: high-intensity statin, lifestyle, and confirm cascade testing has been initiated"],
         ["<b>2–3 months</b>","<b>Recheck the full lipid profile; add ezetimibe or escalate if the reduction is under 50%</b>"],
         ["<b>Annually, lifelong</b>","Lipids, adherence, cardiovascular risk factors, family testing status, and pregnancy planning"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🫀 Cardiovascular symptoms", html:"\"Chest pain or breathlessness on exertion — get assessed promptly. Your heart risk is higher than average.\""},
         {tone:"red", h:"🤰 Pregnancy", html:"\"If you are planning a pregnancy, tell us — cholesterol medicines are usually stopped three months before trying to conceive. If you become pregnant while taking a statin, stop it and contact us promptly so we can plan it safely.\""},
         {tone:"amber", h:"💪 Muscle symptoms", html:"\"Severe muscle pain with dark urine — stop the statin and seek help. Lesser aches — contact us rather than just stopping.\""},
         {tone:"green", h:"👨‍👩‍👧 Family", html:"\"Your close relatives should be tested — early treatment can prevent heart attacks in them too.\""}
       ]}
     ]},

    {id:"troubleshoot", nav:"Not at target?", title:"LDL not down by 50%? Check before escalating",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"1 · Adherence", html:"Statin hesitancy is common — explore beliefs and side-effect fears rather than assuming the tablets are being taken."},
         {tone:"amber", h:"2 · Dose and intensity", html:"Is the patient on the maximal tolerated high-intensity statin, or on a starter dose that was never titrated?"},
         {tone:"blue", h:"3 · Add-on", html:"<b>Ezetimibe added? Refer to the specialist lipid service.</b> PCSK9 inhibitors and inclisiran only where NICE, NHS England and local commissioning criteria are fulfilled."},
         {tone:"blue", h:"4 · Secondary cause", html:"<b>Recheck thyroid function, alcohol and other contributors.</b>"},
         {tone:"green", h:"5 · Specialist", html:"<b>Persistent failure or true intolerance → lipid clinic.</b> Adherent, optimised and secondary causes excluded is the point to refer for specialist assessment, including eligibility for commissioned PCSK9-directed therapy."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"When to refer — criteria-based referral for DNA testing",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Urgent specialist — homozygous or severe", html:"Suspected homozygous FH: adult LDL-C >13 mmol/L, child/young person LDL-C >11 mmol/L, or a child with two affected parents, tendon or cutaneous xanthomata or childhood coronary disease. Refer urgently to a specialist FH centre; do not allow application of heterozygous-FH criteria to delay referral."},
         {tone:"blue", h:"Criteria met — refer for DNA testing", html:"Assess suspected FH in primary care using Simon Broome or DLCN criteria if competent to do so. Refer for specialist lipid assessment and DNA testing when Simon Broome criteria suggest possible/definite FH or the DLCN score is >5. Lipid-lowering treatment can begin while awaiting specialist review when clinically indicated."},
         {tone:"amber", h:"Refractory", html:"≥50% reduction not achieved despite adherence to the maximum tolerated statin plus ezetimibe, or no statin tolerated → specialist lipid service. PCSK9 inhibitors, inclisiran or apheresis only if NICE, NHS England and local commissioning criteria (including Greater Manchester pathway criteria) are fulfilled."},
         {tone:"amber", h:"Children and pregnancy", html:"Affected children, and pregnancy or pre-conception planning → specialist."},
         {tone:"cream", h:"GP management", html:"Suspecting FH, running the record search, excluding secondary causes, applying Simon Broome or DLCN criteria, delivering and titrating the statin, adding ezetimibe, monitoring lipids and LFTs, chasing the cascade, and pregnancy planning all belong here. Related pages: <a href='hypercholesterolaemia.html'>lipid management</a> · <a href='stable-angina.html'>stable angina</a> · <a href='mi-secondary-prevention.html'>post-MI secondary prevention</a> · <a href='hypertension.html'>hypertension</a> · <a href='contraception.html'>contraception</a>."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 31-year-old woman attends for a routine check. Her <b>total cholesterol is 9.8 mmol/L and LDL 7.2</b>. She is slim, a non-smoker and takes no medication. Her <b>father had a myocardial infarction at 44</b> and her <b>paternal aunt at 51</b>. She has <b>thickening over both Achilles tendons</b>. A previous entry two years ago recorded a cholesterol of 9.1 with the comment \"diet advice given\". She mentions she and her partner are <b>hoping to start a family next year</b>."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Recognises TC >9.0 mmol/L at age 30 or over as a threshold that requires assessment for FH (not a diagnosis), and does NOT calculate QRISK — explaining that a population risk score underestimates an inherited lipid disorder; <b>identifies the Achilles thickening as tendon xanthomata</b>; <b>notes the previous result was not acted on and says so without blame</b>, since the record search is exactly how these cases are found; <b>excludes secondary causes — thyroid, renal, alcohol — before labelling</b>; applies Simon Broome/DLCN criteria and refers to the specialist lipid clinic for DNA testing when they indicate possible/definite FH or a DLCN score >5; raises cascade testing of her father's side, her siblings and any future children as central, not incidental; addresses the pregnancy plan directly — pregnancy is not contraindicated, but statins are contraindicated in pregnancy and lipid-lowering medicines are stopped three months before attempting conception, so contraception and pre-conception counselling are part of the initial plan, and sequencing treatment around a planned pregnancy is the real clinical judgement here; and <b>sets the ≥50% LDL reduction target</b> rather than an ordinary one."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>NICE CG71 — Familial hypercholesterolaemia: identification and management<br><a href="https://www.nice.org.uk/guidance/cg71" rel="noopener">nice.org.uk/guidance/cg71</a><span class="rd"> — the suspicion threshold (TC >7.5 mmol/L with premature CHD before 60), the systematic record search (TC >7.5 mmol/L under 30; >9.0 mmol/L at 30 or over), two LDL-C measurements, Simon Broome and DLCN criteria in primary care with referral for DNA testing (possible/definite Simon Broome or DLCN >5), homozygous FH (adult LDL-C >13; child/young person >11 mmol/L), cascade testing of first-, second- and where possible third-degree relatives with targeted DNA testing where a mutation is known, pregnancy not being contraindicated, and the ≥50% LDL-C reduction target</span></li>'+
         '<li><b>NICE QS41 — Familial hypercholesterolaemia quality standard</b><br><a href="https://www.nice.org.uk/guidance/qs41" rel="noopener">nice.org.uk/guidance/qs41</a><span class="rd"> — diagnostic testing for children at risk of FH by age 10</span></li>'+
         '<li>NICE NG238 — Cardiovascular disease: risk assessment and lipid modification<br><a href="https://www.nice.org.uk/guidance/ng238" rel="noopener">nice.org.uk/guidance/ng238</a><span class="rd"> — high-intensity statin choice, ezetimibe as the first add-on, the position of the injectable agents, lipid, transaminase and CK monitoring, statin intolerance, and stopping lipid-lowering medicines three months before conception until breastfeeding is complete</span></li>'+
         '<li><b>NICE TA393 (alirocumab, 2016), TA394 (evolocumab, 2016) and TA733 (inclisiran, 2021)</b><span class="rd"> — the criteria under which alirocumab, evolocumab and inclisiran are funded</span></li>'+
         '<li><b>NICE TA1002 — Evinacumab for homozygous familial hypercholesterolaemia</b><br><a href="https://www.nice.org.uk/guidance/ta1002" rel="noopener">nice.org.uk/guidance/ta1002</a><span class="rd"> — specialist evinacumab in homozygous FH</span></li>'+
         '<li><b>NICE CG71 \u2014 Familial hypercholesterolaemia: identification and management</b><br><a href="https://www.nice.org.uk/guidance/cg71" rel="noopener">nice.org.uk/guidance/cg71</a><span class="rd"> — secondary causes to exclude before referral, monitoring, and pregnancy and breastfeeding advice</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — atorvastatin and rosuvastatin dosing, ezetimibe 10 mg once daily, and statin contraindication in pregnancy</span></li>'+
         '<li><b>GOV.UK — General information: assessing fitness to drive</b><br><a href="https://www.gov.uk/guidance/general-information-assessing-fitness-to-drive" rel="noopener">gov.uk/guidance/general-information-assessing-fitness-to-drive</a></li>'+
         '<li><b>Greater Manchester Medicines Management Group — lipid management pathways and formulary</b><br><a href="https://gmmmg.nhs.uk" rel="noopener">gmmmg.nhs.uk</a><span class="rd"> — local referral criteria and commissioning for PCSK9 inhibitors and inclisiran</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Familial hypercholesterolaemia — NICE CG71, NG238 and TA393/TA394/TA733. Never risk-score FH with QRISK: it is usually inherited (often monogenic), lifelong and very high risk, and is treated on the diagnosis. Suspect it at TC above 7.5 mmol/L, particularly with premature CHD or tendon xanthomata, and search your records for TC >7.5 under 30 and >9.0 at 30 or over. Apply Simon Broome or DLCN criteria and refer for DNA testing when they are met — and make sure cascade testing of first-, second- and, where feasible, third-degree relatives actually happens, because diagnosing one person is diagnosing a family. Treat to a ≥50% reduction in LDL-C from the untreated baseline; specialist agents only where commissioning criteria are met. Stop lipid-lowering medicines three months before conception and plan contraception. Verify doses against the current BNF before prescribing."
});
