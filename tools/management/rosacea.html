<script>
MG.render({
  icon:"🧴",
  title:"Rosacea — phenotype-led assessment and ongoing primary-care management",
  eyebrow:"Protocol · adults · chronic relapsing facial dermatosis",
  stemTitle:"Rosacea is managed by its dominant features — gentle skincare and sun protection for everyone, then the treatment that matches what you see, with the eyes checked at every review",
  stemSub:"A chronic, relapsing condition managed according to its <b>dominant phenotype</b>. Advise gentle skincare, moisturising, trigger modification and daily sun protection for everyone. Offer ivermectin, azelaic acid or metronidazole for papulopustular disease; consider a <b>time-limited</b> oral tetracycline for more severe disease, with antibiotic stewardship. Use brimonidine cautiously for persistent erythema, warning about rebound and cardiovascular effects. <b>Ask about the eyes at every review — eye pain, photophobia or visual change needs urgent ophthalmology.</b> Refer persistent or resistant disease, significant ocular disease, rhinophyma, diagnostic uncertainty or substantial psychological impact.",
  guideline:"BAD rosacea guideline (2021) · PCDS · MHRA Drug Safety Updates (brimonidine) · Greater Manchester formulary · SPCs",
  reviewed:"25 September 2026",
  nextReview:"25 September 2027",

    {t:"Eye pain or visual change → urgent ophthalmology", tone:"tw"},

  ],
  lead:'<div class="mg-layers"><a href="#assess"><b>Assess</b><small>Phenotype · differential</small></a><a href="#everyone"><b>Everyone</b><small>Skin · sun · triggers</small></a><a href="#treat"><b>Treat</b><small>By feature</small></a><a href="#eyes"><b>Eyes</b><small>Every review</small></a><a href="#refer"><b>Refer</b><small>By feature</small></a></div>',
  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"blue", h:"Document the dominant phenotype", html:"Persistent centrofacial erythema · transient flushing · telangiectasia · papules and pustules · phymatous change · ocular features · burning, stinging, dryness or oedema. <b>Features coexist</b> — they are not mutually exclusive subtypes. No comedones helps distinguish it from acne."},
    {tone:"green", h:"Everyone: skin, sun and triggers", html:"Gentle non-soap cleanser, fragrance-free moisturiser, daily broad-spectrum sun protection, and identifying personal triggers (heat, sun, alcohol, spicy food, hot drinks, stress). Green-tinted camouflage can help persistent redness."},
    {tone:"blue", h:"Papules and pustules: three first-line topicals", html:"Offer <b>ivermectin, azelaic acid or metronidazole</b>, chosen by irritancy, preference, cost and formulary — no single one is universally first. Ivermectin may suit suspected Demodex-associated lesions. Judge after 8–12 weeks; continue as maintenance if effective."},
    {tone:"amber", h:"Oral antibiotics: time-limited, with stewardship", html:"For more severe disease or an inadequate topical response: an oral tetracycline for about 3 months, then review. <b>Contraindicated in pregnancy; generally avoided under 12.</b> Avoid minocycline unless there is no suitable alternative, and avoid unnecessary continuation."},
    {tone:"amber", h:"Brimonidine: persistent erythema only, with care", html:"Not for papules, pustules or telangiectasia. Start with a small amount and titrate; warn about <b>rebound or exacerbation (up to 16%)</b>, burning and contact dermatitis. Do not apply to irritated, broken or recently lasered skin — systemic effects (bradycardia, hypotension, dizziness) are possible."},
    {tone:"red", h:"⚠ The eyes — ask every time", html:"Gritty or dry eyes, blepharitis, recurrent styes, photophobia, pain, blurred or reduced vision, pain on eye movement, sticky discharge, contact-lens use. <b>Eye pain, photophobia, reduced vision, pain on eye movement or suspected keratitis → same-day ophthalmology.</b>"}
  ],
  pathwaySub:"Five steps. Match the treatment to what you see.",
  pathway:[
    {title:"Document the phenotype and check the differential", html:"Coexisting features; acne, seborrhoeic dermatitis, periorificial dermatitis, contact dermatitis, lupus, dermatomyositis, photodermatosis, steroid-induced rosacea."},

    {id:"assess", nav:"Assess", title:"Step 1 — phenotype and differential",

       {b:"table", head:["Feature","Notes"], rows:[

         ["<b>Transient flushing</b>","Trigger management; propranolol in selected troublesome cases"],
         ["<b>Telangiectasia</b>","Does not respond to ivermectin, metronidazole, doxycycline or brimonidine — laser/IPL"],
         ["<b>Papules and pustules</b>","Topical ivermectin, azelaic acid or metronidazole; oral tetracycline if more severe"],
         ["<b>Phymatous change</b>","Not reversed by topicals or antibiotics — specialist laser or surgical debulking"],
         ["<b>Ocular features</b>","Carries corneal risk — not simply another subtype (see Step 4)"],
         ["<b>Burning, stinging, dryness, oedema</b>","Gentle skincare; choose less irritant topicals"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"🔎 Differential diagnosis", html:"Acne vulgaris · seborrhoeic dermatitis · periorificial dermatitis · contact dermatitis · lupus · dermatomyositis · photodermatosis · steroid-induced rosacea. <b>Diagnostic uncertainty or an atypical distribution → dermatology advice.</b>"},
         {tone:"blue", h:"🧠 Psychological impact", html:"Ask about distress, avoidance, low mood, anxiety, work and social impact, and body-image concerns. Consider psychological support or skin camouflage; BAD recommends psychological support where rosacea is associated with anxiety or depression."}
       ]}
     ]},

    {id:"everyone", nav:"Everyone", title:"Step 2 — for everyone",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"☀️ Sun protection", html:"Daily broad-spectrum sunscreen — UV is a major trigger."},
         {tone:"green", h:"🧼 Gentle skincare", html:"Non-soap cleanser and fragrance-free moisturiser; avoid astringents, abrasives and irritant products."},
         {tone:"green", h:"🌶️ Triggers", html:"Heat, sun, alcohol, spicy food, hot drinks, stress and temperature change — a diary helps identify personal triggers."},
         {tone:"amber", h:"🚫 Facial steroids", html:"<b>Avoid routine topical corticosteroids on the face</b> — they can induce or worsen steroid rosacea. If a potent steroid has been used regularly, assess for steroid-induced disease and avoid abrupt unsupervised withdrawal of prolonged potent use; seek dermatology advice if needed."}
       ]}
     ]},

    {id:"treat", nav:"Treat", title:"Step 3 — treat by the dominant feature",
     blocks:[
       {b:"table", head:["Feature","Treatment","Notes"], rows:[
         ["<b>Papules and pustules — first-line</b>","<b>Ivermectin 10 mg/g cream</b> once daily, or <b>azelaic acid 15% gel</b> twice daily, or <b>metronidazole 0.75% cream or gel</b> twice daily — per the local formulary","Choose by irritancy, preference and cost. Warn about initial irritation, especially azelaic acid. Judge after 8–12 weeks; continue as maintenance if effective. Avoid topical antibiotic monotherapy as a general strategy"],
         ["<b>Papules and pustules — more severe or inadequate topical response</b>","<b>Doxycycline 40 mg modified-release</b> once daily, <b>doxycycline 100 mg</b> once daily, or <b>lymecycline 408 mg</b> once daily, for an initial course of about 3 months","Review at 6–12 weeks and stop once controlled where possible. Add or continue a topical only if helpful and tolerated. Contraindicated in pregnancy (use specialist or local advice for an alternative); generally avoided under 12. Photosensitivity; take doxycycline with plenty of water and stay upright; separate from antacids, iron, calcium and magnesium. Avoid minocycline unless no suitable alternative"],
         ["<b>Persistent erythema</b>","<b>Brimonidine 3 mg/g (0.33%) gel</b>: small amount once daily initially, increasing cautiously by response, within the maximum daily amount","Transient benefit. Rebound or exacerbation in up to 16% (MHRA). Burning, contact dermatitis. Not on irritated, broken or recently lasered skin — bradycardia, hypotension, orthostatic hypotension and dizziness reported (MHRA). Stop if redness or burning worsens"],
         ["<b>Troublesome transient flushing</b>","Trigger management; consider <b>propranolol</b> in carefully selected patients, often specialist- or local-pathway-led","Check asthma or COPD, bradycardia, hypotension and heart block first. Does not treat fixed erythema or telangiectasia"],
         ["<b>Telangiectasia or persistent erythema not controlled</b>","Laser or IPL","Specialist; availability and commissioning vary locally"],
         ["<b>Rhinophyma</b>","Laser or surgical debulking","Specialist; not reversed by topicals or antibiotics"]
       ]}
     ]},

    {id:"eyes", nav:"Eyes", title:"Step 4 — ocular rosacea",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"👁️ Ask at every review", html:"Gritty or dry eyes · blepharitis and recurrent styes · photophobia · eye pain · blurred or reduced vision · pain on eye movement · sticky discharge · contact-lens use."},
         {tone:"green", h:"🧽 Treat", html:"Regular lid hygiene, warm compresses and ocular lubricants — preservative-free if used frequently. <b>Do not treat persistent ocular symptoms with facial rosacea therapy alone.</b> An oral tetracycline may help where ocular and skin disease coexist."},
         {tone:"red", h:"🚨 Same-day or urgent ophthalmology", html:"Eye pain · photophobia · reduced or blurred vision · pain on eye movement · suspected keratitis or corneal involvement. These do not wait for treatment failure."},
         {tone:"blue", h:"📅 Routine ophthalmology", html:"Persistent troublesome symptoms despite appropriate lid hygiene and lubrication."}
       ]}
     ]},

    {id:"troubleshoot", nav:"Not responding?", title:"Not responding? Re-check before escalating",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"1 · Right target?", html:"Is the treatment matched to the dominant feature? Telangiectasia and rhinophyma do not respond to topicals or antibiotics."},
         {tone:"amber", h:"2 · Facial steroid?", html:"Any topical steroid use — assess for steroid-induced disease."},
         {tone:"amber", h:"3 · Adequate trial?", html:"Topicals 8–12 weeks; oral tetracycline an adequate course."},
         {tone:"blue", h:"4 · Right diagnosis?", html:"Recheck the differential — periorificial dermatitis, seborrhoeic dermatitis, lupus, contact dermatitis."},
         {tone:"green", h:"5 · Then refer", html:"Resistant disease, laser/IPL, rhinophyma, ocular disease or distress → specialist."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"When to refer",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Ophthalmology — same day or urgent", html:"Eye pain, photophobia, reduced vision, pain on eye movement, suspected keratitis."},
         {tone:"blue", h:"Ophthalmology — routine", html:"Persistent ocular symptoms despite lid hygiene and lubrication."},
         {tone:"blue", h:"Dermatology", html:"Resistant papulopustular disease · laser/IPL for persistent erythema or telangiectasia · severe flushing needing propranolol · diagnostic uncertainty or atypical distribution · substantial psychological impact."},
         {tone:"blue", h:"Rhinophyma", html:"Dermatology or plastic surgery for laser or surgical debulking."},
         {tone:"cream", h:"GP management", html:"Phenotype-led treatment, skincare and sun advice, time-limited antibiotics and the eye check at every review belong here. Related pages: <a href='acne.html'>acne</a> · <a href='blepharitis.html'>blepharitis</a> · <a href='seborrhoeic-dermatitis.html'>seborrhoeic dermatitis</a>."}
       ]},
       {b:"say", html:"Rosacea is long-term and tends to come and go, but it can be kept well controlled. Daily sunscreen, gentle skincare and working out your triggers matter as much as the creams. We'll match the treatment to what's bothering you most — spots, redness or flushing — and review it after a couple of months. Please don't use steroid creams on your face for this. If your eyes become painful, sensitive to light or your vision blurs, get them checked the same day."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 42-year-old woman has a <b>red face with papules and pustules</b> over the cheeks and nose, worse with wine and hot drinks. She has been using her partner's <b>hydrocortisone cream</b>. Her eyes feel gritty. She is <b>trying to conceive</b> and asks for tablets because the creams \"take too long\"."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Documents the phenotype and differential; addresses the facial steroid; offers a first-line topical and explains the 8–12-week timescale; explains why a tetracycline is not suitable when trying to conceive; checks the eyes, advises lid hygiene and safety-nets for eye pain or visual change; discusses triggers, sunscreen and the emotional impact; and arranges review."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[

         '<li><b>Primary Care Dermatology Society — Rosacea</b><br><a href="https://www.pcds.org.uk" rel="noopener">pcds.org.uk</a><span class="rd"> — primary-care treatment pathway</span></li>'+
         '<li><b>MHRA Drug Safety Updates — brimonidine gel (Mirvaso)</b><span class="rd"> — exacerbation or rebound in up to 16%; systemic cardiovascular effects</span></li>'+
         '<li><b>Greater Manchester formulary, BNF and SPCs</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — doses, pregnancy, interactions and cautions</span></li>'+
         '</ul></div>'}
     ]}

  foot:"Rosacea. A chronic, relapsing condition managed by the dominant phenotype. Gentle skincare, moisturising, trigger modification and daily sun protection for everyone. Papulopustular: ivermectin, azelaic acid or metronidazole first-line; a time-limited oral tetracycline (about 3 months, reviewed at 6–12 weeks) for more severe disease, avoiding it in pregnancy. Brimonidine cautiously for persistent erythema — rebound in up to 16% and cardiovascular effects (MHRA). Avoid routine facial steroids. Ask about the eyes at every review: eye pain, photophobia or visual change needs urgent ophthalmology. Refer resistant disease, telangiectasia for laser/IPL, rhinophyma, significant ocular disease, diagnostic uncertainty or substantial psychological impact. Sources: BAD rosacea guideline (2021), PCDS, MHRA, Greater Manchester formulary, SPCs."
