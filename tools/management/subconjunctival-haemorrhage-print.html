MG.render({
  icon:"👁️",

  stemTitle:"Almost always benign — so the whole clinical task is the 90 seconds that prove it: measure the acuity, see the posterior border, swing the torch",
  stemSub:"One page for the whole condition: exclude the rare sinister causes (ruptured globe, traumatic asphyxia, meningococcal septicaemia, bleeding diathesis, carotid-cavernous fistula), reassure properly with the colour-change warning that prevents a second anxious attendance, take the diagnostic opportunity the haemorrhage offers by checking the blood pressure, and do not stop anticoagulation for an uncomplicated SCH without clinical advice. Recurrent, bilateral or unexplained bleeds earn a targeted work-up; an unexplained mechanism in a child or an older person earns a safeguarding thought. Uncomplicated SCH, traumatic SCH and suspected open-globe injury are separate pathways. For urgent eye problems, use the local Greater Manchester urgent eye-care service or on-call ophthalmology route agreed for your practice.",

  ],
  lead:'<div class="mg-layers"><a href="#severe"><b>Exclude first</b><small>Globe · asphyxia · sepsis</small></a><a href="#confirm"><b>Causes</b><small>Spontaneous · trauma · systemic</small></a><a href="#workup"><b>Examine</b><small>VA · border · RAPD</small></a><a href="#ladder"><b>Treat</b><small>Reassure · treat the cause</small></a><a href="#refer"><b>Refer</b><small>999 · ophthalmology</small></a></div>',
  quickSub:"If you read nothing else on this page, read these six cards. Every number traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Measure the visual acuity — every time", html:"In simple subconjunctival haemorrhage the visual acuity is completely normal. Any reduction in acuity with a red eye is NOT a simple SCH and needs urgent ophthalmology. Missing a reduced acuity in an apparently simple SCH is a recognised medicolegal pitfall in GP eye assessment. Record visual acuity in each eye separately using an appropriate chart or near-vision method, with the usual correction (note unaided or corrected) and compared with baseline where known. A new reduction, a marked asymmetry, or inability to assess reliably means this should not be treated as uncomplicated SCH."},
    {tone:"red", h:"Check the extent and the posterior limit", html:"A simple SCH should have a visible limit and normal vision. If the haemorrhage is extensive, circumferential, extends posteriorly or its full extent cannot be assessed — especially after trauma — do not apply pressure or manipulate the eye. Arrange urgent ophthalmic or emergency assessment; use 999 when there are features of serious ocular, orbital, head or systemic injury. This finding alone does not diagnose globe rupture."},
    {tone:"amber", h:"Bilateral SCH is atypical — assess carefully", html:"Bilateral SCH can follow coughing, vomiting, straining, childbirth, anticoagulation or platelet disorders, hypertension, systemic illness, trauma or head and neck compression, so it requires careful history and examination. <b>Emergency assessment is required when it follows significant head or neck compression or trauma, or is accompanied by neurological symptoms, impaired consciousness, facial petechiae, periorbital or mastoid bruising, CSF leak or other features of major injury</b> (possible traumatic asphyxia or base of skull fracture)."},
    {tone:"blue", h:"The swinging torch test takes 30 seconds", html:"A relative afferent pupillary defect is the single most important finding separating serious posterior segment injury from a benign surface bleed. Swing a bright torch between the eyes in a dim room: if the pupils paradoxically dilate as you move to the affected eye, that is an RAPD — retinal detachment, vitreous haemorrhage, traumatic optic neuropathy or posterior globe rupture. A new RAPD, reduced visual acuity, severe pain, abnormal pupil, proptosis or other signs of serious ocular injury requires immediate ophthalmology or eye-emergency assessment; use emergency services where the patient cannot be safely transferred or there is major trauma or neurological compromise. An RAPD may be pre-existing or hard to assess, and a normal pupil examination does not exclude all serious ocular injury."},
    {tone:"cream", h:"Do not stop anticoagulation for an uncomplicated SCH without advice", html:"Do not advise a patient to stop anticoagulation solely because of an uncomplicated SCH. If they have already stopped a DOAC or warfarin, contact the prescribing or anticoagulation team or responsible clinician promptly and assess whether it is safe to restart. Do not alter anticoagulation without considering the indication, bleeding severity and thromboembolic risk — significant ocular trauma, suspected open globe, major bleeding elsewhere, a markedly abnormal INR, severe hypertension, intracranial or orbital injury or a need for urgent eye surgery change the decision. <b>Warfarin:</b> check the INR if not recent, the bleed is recurrent or over-anticoagulation is possible. <b>DOAC:</b> INR does not assess anticoagulant intensity; check renal function and adherence as clinically indicated. Document it as a minor bleeding event."},
    {tone:"green", h:"Check the blood pressure — it is a free diagnostic opportunity", html:"Recurrent episodes can point to raised blood pressure (College of Optometrists CMG, 2025): chronic hypertension causes hyaline degeneration of small vessel walls, making conjunctival capillaries fragile enough to rupture on minor triggers. Any first SCH without a clear cause → check BP at the same consultation, and confirm a raised reading with ABPM or HBPM per NICE NG136. The SCH resolves regardless, but the diagnosis should not be wasted."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step is the 90 seconds that make the reassurance safe.",
  pathway:[
    {title:"Exclude the sinister causes", html:"Reduced acuity, a new RAPD, a haemorrhage whose full extent cannot be seen (especially after trauma), bilateral SCH after head or neck compression or trauma or with neurological or major-injury features, fever with a non-blanching rash, proptosis with chemosis or pulsatile tinnitus, or unexplained bruising and bleeding elsewhere (an NG12 leukaemia prompt).", alert:true},
    {title:"Identify the cause", html:"Spontaneous (commonest), Valsalva, traumatic, iatrogenic, or secondary to systemic disease — with the drug list: warfarin, DOACs, antiplatelets, aspirin plus NSAID, and blood-thinning supplements."},
    {title:"Examine properly and document it", html:"Visual acuity in each eye, pupil reactions and (where clinically appropriate) RAPD, pain and photophobia, trauma and contact-lens history, anterior segment, extent of haemorrhage and posterior limit, medication history, and BP where indicated — plus <b>lid eversion, if safe, in a contact lens wearer with foreign-body sensation, trauma or persistent irritation</b>. If open globe is suspected, stop after minimal safe inspection and use the eye-shield pathway. Differentiate from uveitis, angle-closure, conjunctivitis and episcleritis."},
    {title:"Reassure, and treat the contributors", html:"No specific treatment; cold compress in the first 24 hours; lubricants if gritty. Warn about the colour change and spreading. Do not stop prescribed anticoagulant or antiplatelet treatment without advice. Then BP, anticoagulation review, constipation, cough, contact lens problems, dry eye."},
    {title:"Safety-net and follow up", html:"<b>Usually clears in 1–2 weeks (larger bleeds can take longer); review at 3–4 weeks if not.</b> <b>Recurrent, bilateral, extensive or unexplained episodes → reassess the diagnosis, review medicines and triggers, check BP, and consider FBC with platelets and targeted coagulation or systemic tests.</b> Return urgently for reduced or changed vision, pain or photophobia, diplopia, increasing swelling or proptosis, new trauma, systemic illness or a non-blanching rash, or recurrent extensive bleeding or bruising elsewhere."}
  ],
  sections:[

    {id:"severe", nav:"Exclude first", title:"Red flags — the rare cases where an SCH signals serious pathology",
     sub:"The haemorrhage itself is almost always benign. The clinical task is identifying the exceptions.",
     blocks:[
       {b:"table", head:["Presentation","Suggests","Action"], rows:[
         ["SCH + significant blunt eye trauma + decreased visual acuity + afferent pupillary defect","<b>Ruptured globe or posterior segment injury — a possible globe injury</b>","Rigid eye shield (not a pad). Do not pad or press on the eye, measure intraocular pressure, forcefully evert the lids, remove a foreign body or instil drops unless ophthalmology advises. Ask the patient not to squeeze the lids shut and to avoid coughing, straining and nose-blowing where possible. Nil by mouth. Immediate ophthalmology or ED assessment (999 with major trauma or if safe transfer is not possible); imaging such as CT orbits is arranged by the specialist team"],
         ["SCH extending posterior to the equator — 360 degrees, very posterior, unable to see the border","<b>Possible occult ruptured globe, especially after trauma</b> — this finding alone does not diagnose globe rupture","<b>Do not apply pressure or manipulate the eye. Urgent ophthalmic or emergency assessment; 999 when there are features of serious ocular, orbital, head or systemic injury</b>"],
         ["Bilateral SCH post-trauma with no direct eye injury, or after head or neck compression","Possible traumatic asphyxia (Perthes sign) or base of skull fracture — but bilateral haemorrhage alone does not establish these (other causes: coughing, vomiting, straining, childbirth, anticoagulation or platelet disorders, hypertension, systemic illness). Look for CSF rhinorrhoea or otorrhoea, periorbital or mastoid bruising, facial petechiae, impaired consciousness or neurological symptoms","<b>Emergency assessment (999, with CT head as indicated) when it follows significant head or neck compression or trauma, or there are neurological symptoms, impaired consciousness, facial petechiae, periorbital or mastoid bruising, CSF leak or other features of major injury</b>"],
         ["<b>SCH + fever + photophobia + neck stiffness + non-blanching petechiae</b>","Possible meningococcal disease — conjunctival haemorrhage alone is not sufficient; the systemic features define the emergency","<b>Fever with a non-blanching petechial or purpuric rash, meningism, shock, altered consciousness or rapidly progressive illness: 999. Do not delay transfer to give parenteral antibiotics; if meningococcal disease is strongly suspected and it will not delay transfer, give IM or IV benzylpenicillin (or ceftriaxone) per NICE NG240 — benzylpenicillin 1.2 g for adults and children 10 years and over; younger children per BNFC. Check the dose against the current BNF or BNFC</b>"],
         ["<b>Recurrent bilateral or very large SCH + easy bruising + gum bleeding</b>","Bleeding diathesis — platelet disorder (ITP, anticoagulant toxicity), coagulation defect (haemophilia, liver failure), or leukaemia","<b>Adult with unexplained bruising, bleeding or petechiae: very urgent FBC within 48 hours (NG12), acting on the result promptly; targeted coagulation tests (INR if on warfarin) and renal or liver function if clinically indicated; haematology if abnormal. Child with unexplained petechiae or hepatosplenomegaly: immediate specialist assessment (NG12)</b>"],
         ["Proptosis + periorbital oedema + chemosis + arterialised conjunctival vessels + ophthalmoplegia, raised IOP, visual symptoms or pulsatile tinnitus","<b>Carotid-cavernous sinus fistula (post-traumatic or spontaneous) or other orbital vascular pathology</b>","<b>Same-day emergency ophthalmology or neurosurgical assessment, usually through the emergency department. Imaging such as CTA or MRA is arranged by the specialist team</b>"]
       ]},
       {b:"why", html:"A subconjunctival haemorrhage is bleeding into the potential space between the conjunctiva and the underlying sclera, from rupture of a small conjunctival vessel. The blood is bright red initially, may spread and darken over days, and usually clears within 1–2 weeks without treatment — a large bleed can take longer. The critical task for GPs is not managing the SCH but identifying the rare cases where it signals serious pathology. The most important distinguishing feature: in simple SCH, visual acuity is completely normal — any reduction in acuity with a red eye is not a simple SCH and requires urgent ophthalmology assessment. And the posterior limit of a benign SCH should be visible, because the blood does not extend beyond the equator of the globe — if its full extent cannot be seen, especially after trauma, a ruptured globe or posterior injury must be excluded by urgent assessment — although this finding alone does not diagnose globe rupture."},
       {b:"dl", rows:[
         ["<b>NG12 stated honestly</b>","A subconjunctival haemorrhage on its own is not an NG12 criterion. The time-critical routes here are ophthalmic and neurological — emergency assessment for a suspected open globe, bilateral haemorrhage with features of major injury, a new RAPD, possible meningococcal disease or a carotid-cavernous fistula. The malignancy to hold in mind is haematological: if the SCH occurs with unexplained bruising, bleeding, petechiae, pallor, persistent fatigue, fever, recurrent infection, lymphadenopathy or hepatosplenomegaly, arrange the urgent FBC pathway and act on the result promptly (card below)"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"purple", h:"Very urgent FBC · NICE NG12 (updated April 2026) — leukaemia", html:"<b>Adults:</b> consider a very urgent full blood count (within 48 hours) to assess for leukaemia with any of: pallor, persistent fatigue, unexplained fever, unexplained persistent or recurrent infection, generalised lymphadenopathy, <b>unexplained bruising, unexplained bleeding, unexplained petechiae</b> or hepatosplenomegaly. <b>Children and young people:</b> refer for immediate specialist assessment for leukaemia if there are unexplained petechiae or hepatosplenomegaly.", src:"NICE NG12 (updated April 2026) — haematological cancers, leukaemia"},
         {tone:"red", h:"Non-blanching rash with fever", html:"Fever with a non-blanching petechial or purpuric rash, meningism, shock, altered consciousness or rapidly progressive illness: 999 for possible meningococcal disease. Do not delay transfer to give parenteral antibiotics; if strongly suspected and it will not delay transfer, give benzylpenicillin or ceftriaxone per NICE NG240.", src:"NICE NG240 (2024); dose per BNF/BNFC"}
       ]}
     ]},

    {id:"confirm", nav:"Causes", title:"Causes — spontaneous, traumatic, Valsalva and systemic",
     blocks:[
       {b:"dl", rows:[
         ["<b>Spontaneous — most common</b>","Usually no identifiable cause. Risk factors: hypertension (check BP where there is no obvious trigger, recurrence or hypertension risk), anticoagulants (warfarin — check the INR if not recent or over-anticoagulation is possible; DOACs — review dose, renal function and interacting drugs as clinically indicated), antiplatelet agents (aspirin, clopidogrel), aspirin plus NSAID combination, and blood-thinning supplements (fish oil, ginkgo, garlic). Age — the elderly have fragile conjunctival vessels. Rarely a vigorous Valsalva: coughing, straining at stool, heavy lifting, sneezing, vomiting, childbirth"],
         ["<b>Traumatic</b>","Direct ocular trauma — assess carefully for globe injury or ruptured globe. Contact lens trauma (microtrauma from the lens edge — check the fitting). Foreign body (retained FB under the upper eyelid). Iatrogenic: post-cataract surgery, post-intravitreal injection, post-eyelid surgery"],
         ["<b>Valsalva manoeuvre</b>","Forceful coughing (pertussis, asthma exacerbation), vomiting (hyperemesis, bulimia), straining (constipation, heavy lifting, labour), vigorous exercise. The manoeuvre transiently raises intrathoracic pressure → raised venous pressure → rupture of conjunctival capillaries. Bilateral SCH from Valsalva is possible; emergency assessment is needed when it follows head or neck compression or trauma, or there are neurological or major-injury features"],
         ["<b>Secondary to systemic disease</b>","Anticoagulation (warfarin with a supratherapeutic INR; a DOAC at standard dose can also cause it). Bleeding diathesis (ITP, haemophilia, liver disease). Hypertension — a well-established association, so check BP. Diabetes (fragile microvasculature). Leptospirosis and viral haemorrhagic fevers (travel history). Allergic conjunctivitis (with associated conjunctival hyperaemia)"]
       ]},
       {b:"why", html:"<b>The hypertension–SCH association deserves special attention.</b> The mechanism: chronic hypertension causes hyaline degeneration of small vessel walls (arteriosclerosis), making conjunctival capillaries more fragile and prone to spontaneous rupture even with minor physiological triggers — rising from sleep, morning coughing. The practical approach: any patient with a first SCH and no clear cause should have their BP checked. If it is elevated, measure and manage according to NICE NG136, confirming a new diagnosis with ABPM or HBPM — a single raised clinic reading is not established hypertension unless the clinical situation requires immediate action; if hypertension is already known and treated, check adherence and control. This does not mean the SCH itself requires urgent hypertension treatment — it will resolve regardless — but it is a diagnostic opportunity not to be wasted."}
     ]},

    {id:"workup", nav:"Examine", title:"Examination, differentials and when to investigate",
     blocks:[
       {b:"table", head:["Pathway","Features","Action"], rows:[
         ["<b>Uncomplicated SCH</b>","Sharply demarcated bright-red patch on the sclera; painless or mild irritation only; normal visual acuity; normal pupils; no photophobia, discharge, significant trauma, proptosis or abnormal globe shape","Reassure, safety-net, check BP where indicated, review anticoagulant and antiplatelet medication; no tests generally needed for a first episode"],
         ["<b>Traumatic SCH</b>","Follows blunt or sharp injury, a foreign body or a contact-lens problem","Full gentle assessment of acuity, pupils and extent; if vision, pupils or extent are abnormal, urgent ophthalmology or eye-emergency assessment"],
         ["<b>Suspected open globe</b>","Significant trauma with reduced vision, abnormal pupil, flat anterior chamber, abnormal globe shape, or extent that cannot be assessed","Stop examination after minimal safe inspection. Rigid shield, no pressure, no IOP measurement, no manipulation or foreign-body removal; immediate ophthalmology or ED assessment"]
       ]},
       {b:"table", head:["Assessment","Detail"], rows:[
         ["<b>Visual acuity — mandatory</b>","Record visual acuity in each eye separately using an appropriate chart or near-vision method, with the usual correction where available, noting unaided or corrected and comparing with baseline where known. A new reduction, a marked asymmetry, or inability to assess reliably means this should not be treated as uncomplicated SCH"],
         ["<b>Pupil reactions</b>","A new relative afferent pupillary defect (RAPD) is a significant red flag for optic nerve, retinal or severe ocular injury — but it may be pre-existing or difficult to assess reliably, and a normal pupil examination does not exclude all serious ocular injury"],
         ["<b>Upper lid eversion</b>","In a contact-lens wearer, or where there is a foreign-body sensation, trauma or persistent irritation: remove the lens, inspect the cornea and evert the upper lid if safe to exclude a retained lens fragment or foreign body. Avoid lid eversion where there is significant trauma or suspected globe injury"],
         ["<b>Anterior chamber</b>","In a non-traumatic uncomplicated presentation, inspect the anterior segment gently for features of another red-eye diagnosis — hyphaema (layered blood) suggests blunt trauma and a flat chamber suggests ruptured globe. If open globe is suspected, stop after minimal safe inspection and use the eye-shield pathway"],
         ["<b>Intraocular pressure</b>","<b>Not needed in primary care — and never measure it if open globe is suspected</b>"],
         ["<b>Extent of haemorrhage</b>","<b>Can the posterior limit be seen? If the haemorrhage is extensive, circumferential, extends posteriorly or its full extent cannot be assessed — especially after trauma — do not press or manipulate the eye; urgent ophthalmic or emergency assessment (999 with features of serious ocular, orbital, head or systemic injury)</b>"],
         ["<b>History</b>","Onset (sudden is typical), photophobia, pain (SCH is painless — a painful red eye means uveitis, glaucoma or keratitis), vision change (none in SCH), trauma, contact lens use, anticoagulants, previous episodes, and systemic conditions (hypertension, diabetes, liver disease, haematological)"]
       ]},
       {b:"table", head:["Differentiating from other causes of red eye","Features"], rows:[
         ["<b>Subconjunctival haemorrhage</b>","Bright red flat haemorrhage, clearly demarcated, white sclera visible at the periphery, no pain, normal vision"],
         ["<b>Anterior uveitis</b>","Ciliary injection (a ring around the cornea, not diffuse), photophobia, small irregular pupil"],
         ["<b>Acute angle-closure glaucoma</b>","Rock-hard globe, mid-dilated fixed pupil, halos around lights, severe pain, nausea"],
         ["<b>Bacterial conjunctivitis</b>","<b>Diffuse conjunctival injection, mucopurulent discharge, no haemorrhage</b>"],
         ["<b>Episcleritis</b>","Sectoral redness, movable redness (moves with the conjunctiva when pressing the eyelid), mild ache"]
       ]},
       {b:"table", head:["Investigations","When"], rows:[
         ["<b>Isolated, first, uncomplicated SCH</b>","Usually no laboratory tests. Check blood pressure, particularly if there is no obvious trigger or the patient has hypertension risk, and review anticoagulant and antiplatelet medication"],
         ["<b>Recurrent, bilateral, unusually extensive or unexplained SCH</b>","Consider FBC with platelet count; blood pressure; INR if taking warfarin or if clinically indicated; renal and liver function if systemic disease or medication toxicity is suspected; further coagulation or haematology investigations only if history, examination or initial results suggest a bleeding disorder. HbA1c is not a routine SCH test"],
         ["<b>Recurrent SCH — before a blood panel</b>","<b>Reassess the diagnosis; review medicines, anticoagulants and antiplatelets; check BP; assess for trauma, coughing, vomiting, constipation and contact-lens problems; then FBC with platelets and targeted coagulation tests if clinically indicated.</b> Recurrent episodes can indicate raised blood pressure or a bleeding abnormality (College of Optometrists CMG, 2025)"],
         ["<b>On an anticoagulant</b>","<b>Warfarin:</b> check the INR if not recent, the bleed is recurrent or over-anticoagulation is possible; manage a supratherapeutic INR according to the anticoagulation protocol. <b>DOAC:</b> INR does not measure anticoagulant effect; check renal function when due or if there is acute illness, renal deterioration, dose concern or bleeding, and check adherence as clinically indicated. Do not routinely request a DOAC level or anti-Xa assay (specialist tests) for an isolated SCH. Review antiplatelets, NSAIDs, SSRIs and interacting drugs"],
         ["<b>Travel history + fever + SCH</b>","Blood film (malaria) + leptospirosis serology; if viral haemorrhagic fever is possible, isolate and follow the UKHSA VHF risk-assessment pathway with the local health protection team before taking samples"]
       ]},
       {b:"why", html:"The afferent pupillary defect is the single most important examination finding distinguishing serious posterior segment pathology from a benign superficial haemorrhage. The swinging flashlight test: in a dim room, swing a bright pen torch from one eye to the other. Normally both pupils constrict when light is directed at them. With an RAPD, when the torch swings from the normal eye to the affected eye the pupils paradoxically dilate rather than constrict — the optic nerve input from that eye is weaker, and the brain compares the two signals. An RAPD with a red eye or SCH after trauma indicates retinal detachment, vitreous haemorrhage, traumatic optic neuropathy or posterior globe rupture — all requiring emergency ophthalmology assessment. The test takes approximately 30 seconds and should be performed where clinically appropriate in a red eye — remembering that an RAPD may be pre-existing and that a normal result does not exclude all serious ocular injury."}
     ]},

    {id:"ladder", nav:"Treat", title:"Management — reassurance, and treating the precipitant",
     sub:"No specific treatment is required. The value of the consultation is accurate reassurance plus the contributors you find.",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>Self-limiting management</b>","No specific treatment required. Cold compress in the first 24 hours may reduce spreading. Artificial tear lubricant drops (for example hypromellose 0.3% or a carbomer gel) if the eye feels gritty or uncomfortable — use as needed, dose per BNF. Avoid rubbing the eye, which worsens spreading. Avoid adding non-essential aspirin or NSAIDs for symptom relief — an uncomplicated SCH is usually painless and does not require analgesia. Do not stop prescribed antiplatelet or anticoagulant treatment without advice from the prescribing clinician. No restrictions on activities, including driving — vision is unaffected"],
         ["<b>Hypertension</b>","<b>Measure and manage blood pressure according to NICE NG136 (2019, updated 2023)</b>, confirming a new diagnosis with ABPM or HBPM where appropriate. A single raised clinic reading should not be treated as established hypertension unless the clinical situation requires immediate action; emergency assessment only if there are symptoms or signs of hypertensive emergency. See the <a href='hypertension.html'>hypertension protocol</a>"],
         ["<b>Constipation (straining)</b>","<b>Dietary fibre and fluid first, then a macrogol or lactulose (adult lactulose 15 mL twice daily, adjusted to response — BNF)</b>"],
         ["<b>Chronic cough causing recurrent Valsalva</b>","<b>Investigate and treat the cause</b> — see the <a href='../algorithms/chronic-cough.html'>chronic cough pathway</a>"],
         ["<b>Supratherapeutic anticoagulation</b>","<b>Manage a supratherapeutic INR according to the anticoagulation protocol, with the anticoagulation service; do not alter anticoagulation without considering the indication, bleeding severity and thromboembolic risk</b>"],
         ["<b>Contact lens problems, and dry eye</b>","Optician review for lens fit; refer urgently if a corneal abrasion, retained foreign body, keratitis or reduced vision is suspected. For dry eye with fragile surface vessels, long-term lubricant drops"],
         ["<b>Recurrent SCH</b>","Reassess the diagnosis; review medications (anticoagulants, antiplatelets, fish oil in combination); check BP; assess for trauma, coughing, vomiting, constipation and contact-lens problems; then FBC with platelets and targeted coagulation testing if clinically indicated. Platelet abnormality → haematology. Liver disease → hepatology. Ophthalmology if atypical, persistent, unilateral and repeatedly localised, associated with a mass, or unexplained after initial assessment"],
         ["<b>Post-intravitreal injection SCH</b>","Iatrogenic SCH after intravitreal injection (anti-VEGF agents — ranibizumab, bevacizumab, aflibercept) is common, sits at the injection site, resolves within about 2 weeks and needs no treatment. Reassure that this is normal and expected, and does not affect the efficacy of treatment"]
       ]},
       {b:"why", html:"The management of anticoagulation in a patient with SCH is an important prescribing decision — stopping anticoagulation for an SCH exposes the patient to the very thromboembolic risks it was prescribed to prevent (stroke, DVT or PE, valve thrombosis). An isolated, uncomplicated SCH usually does not require interruption, and the patient should not stop treatment without advice. The approach: check the INR if on warfarin and it is not recent or over-anticoagulation is possible, managing a supratherapeutic INR per the anticoagulation protocol; on a DOAC, remember INR does not assess anticoagulant intensity and check renal function and adherence as clinically indicated; document the SCH as a minor bleeding event in the anticoagulation record. Management changes with significant ocular trauma, suspected open globe, major bleeding elsewhere, a markedly abnormal INR, severe hypertension, intracranial or orbital injury or a need for urgent eye surgery — then decisions weigh the indication, bleeding severity and thromboembolic risk with the prescribing team."},
       {b:"why", html:"The post-intravitreal injection SCH is worth specific inclusion because anti-VEGF therapy for wet AMD, diabetic macular oedema and retinal vein occlusion is now one of the commonest procedures in UK eye departments. After each injection a small SCH at the injection site is expected and normal, because the needle punctures the conjunctiva. Patients treated monthly or bimonthly may contact their GP about the red eye, and GPs must know to reassure rather than alarm — but any SCH in a different location from the injection site, or with reduced vision or pain, should be referred back to the ophthalmology team. What to say: <em>\u201cThis red patch near where you had your injection is completely normal — it is just a tiny bruise on the surface of the eye from the needle. It will disappear in 1–2 weeks and does not affect how well your eye injection is working.\u201d</em>"}
     ]},

    {id:"medicolegal", nav:"Medicolegal", title:"Four medicolegal traps",
     sub:"Each of these is preventable in under a minute, and each is a recognised source of avoidable harm.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"👁️ Always measure visual acuity", html:"Missing a reduction in visual acuity in a \u201csimple SCH\u201d is a recognised medicolegal pitfall in GP eye assessment. A patient with traumatic SCH plus ruptured globe or vitreous haemorrhage whose vision is incorrectly assessed as normal will have a delayed diagnosis of a sight-threatening injury. Record VA in each eye separately, with the usual correction (noting unaided or corrected) and compared with baseline where known; inability to assess reliably lowers the threshold for referral. Document the result in every red eye consultation.", src:"GMC Good Medical Practice (2024) records standard; College of Optometrists CMG sub-conjunctival haemorrhage (2025)"},
         {tone:"amber", h:"📐 Document the extent and posterior limit", html:"A simple SCH should have a visible limit and normal vision. If it is extensive, circumferential, extends posteriorly or its full extent cannot be assessed — especially after trauma — do not apply pressure or an eye pad; if globe injury is suspected apply a rigid eye shield and arrange urgent ophthalmic or emergency assessment (999 with serious ocular, orbital, head or systemic injury).", src:"College of Optometrists CMG trauma (penetrating) — shield, no pressure, emergency referral"},
         {tone:"blue", h:"🔍 Contact lens wearers with symptoms — remove, inspect, evert", html:"An SCH in a contact lens wearer can be caused by a retained lens fragment under the upper eyelid. <b>Where there is a foreign-body sensation, trauma or persistent irritation, remove the lens, inspect the cornea and evert the upper lid if safe</b> — not routinely in an isolated, atraumatic, asymptomatic SCH, and not where there is significant trauma or suspected globe injury. Refer urgently if a corneal abrasion, retained foreign body, keratitis or reduced vision is suspected. Failure to do so, with a fragment that then scratches the cornea repeatedly, causes a persistent corneal abrasion — <b>preventable with a 30-second examination</b>.", src:"College of Optometrists CMG sub-conjunctival haemorrhage (2025) — contact lens and trauma causes"},
         {tone:"amber", h:"🛡️ Unexplained mechanism — consider safeguarding", html:"An SCH in a child is not automatically evidence of abuse, and an unexplained SCH in an older adult does not itself establish elder abuse. Consider maltreatment where there is no suitable explanation, an inconsistent history, delay in seeking care, an injury inconsistent with developmental stage, recurrent or multiple injuries, or other bruising, petechiae or safeguarding concerns. Document the mechanism carefully — is it consistent with the injury? Safeguarding assessment if there is inconsistency: NICE CG89 for children (consider maltreatment when there is no suitable explanation for an injury), and local adult safeguarding procedures under the Care Act 2014 for adults.", src:"NICE CG89 (2009); NICE NG76 (2017); Care Act 2014"}
       ]},
       {b:"why", html:"Non-accidental injury should be considered when a child presents with an SCH without a clearly consistent mechanism — retinal haemorrhages, not visible to the GP without ophthalmoscopy, are a classical feature of abusive head trauma (“shaken baby syndrome”), and conjunctival haemorrhages can co-exist. An SCH in a child is not in itself evidence of abuse. A child presenting with an SCH where there is no suitable explanation, the parent's account is inconsistent, there was a delay in seeking care, the injury is inconsistent with developmental stage, there are recurrent or multiple injuries or other unexplained bruises or petechiae, or the child's behaviour is abnormal should trigger a safeguarding assessment under NICE CG89 and NG76 and local safeguarding procedures. Document the exact mechanism as described by the parent or guardian, and refer to paediatrics for full assessment if NAI is suspected (NICE CG89, 2009). The documentation standard: <em>\u201cMechanism of injury as described by parent: [exact statement]. Injury consistent/inconsistent with mechanism. Safeguarding concern: [yes/no and reasoning]. Action taken: [specify].\u201d</em>"},
       {b:"why", html:"A documented visual acuity measurement is medicolegally essential for every red eye consultation in primary care — GMC Good Medical Practice (2024) requires clinical assessments to be adequate and appropriate to the presenting condition, and in a red eye, VA measurement is a basic and mandatory component. A GP who documents \u201cvision normal\u201d without measuring VA, and whose patient subsequently has a missed retinal detachment or posterior segment injury, is in a far weaker position than one who can demonstrate that VA was formally measured and recorded. The documentation standard: <em>\u201cVA (usual correction): Right 6/6 (or \u2018reads news print at 30 cm\u2019). Left 6/6. Posterior border of haemorrhage visible. Pupils equal and reactive. No RAPD. Diagnosis: simple SCH. Management and safety-net provided.\u201d</em>"}
     ]},

    {id:"lifestyle", nav:"Prevention", title:"Preventing recurrence and wider eye health",
     sub:"General health advice — not part of the core SCH safety pathway.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"🩺 Blood pressure control", html:"Hypertension damages conjunctival vessels through the same hyaline arteriosclerosis mechanism that causes retinal haemorrhages and stroke — so an SCH is an opportunity to motivate BP treatment. <em>\u201cThis red eye is a reminder that your blood pressure needs to be controlled — high blood pressure makes your small blood vessels more fragile.\u201d</em> Give lifestyle advice as set out in NICE NG136.", src:"NICE NG136 (2019, updated 2023) lifestyle advice"},
         {tone:"amber", h:"💊 Anticoagulation awareness", html:"Patients on anticoagulants should know that minor bleeds — SCH, easy bruising, minor nosebleeds — are expected side effects and do not require emergency action. They should make contact for black or tarry stools, vomiting blood, severe headache, weakness or slurred speech (stroke), heavy menstrual bleeding, or a nosebleed that will not stop.", src:"BNF — anticoagulants: bleeding advice; BSH warfarin guideline (Keeling et al, Br J Haematol 2011)"},
         {tone:"blue", h:"💪 Avoiding Valsalva triggers", html:"Constipation: fibre towards the UK adult target of 30 g a day, 6–8 drinks of fluid daily, a macrogol if needed. Chronic cough: investigate and treat. Heavy weightlifting: breathe out during exertion — exhaling on the exertion phase reduces Valsalva-related venous pressure.", src:"College of Optometrists CMG sub-conjunctival haemorrhage (2025) — cough, heavy lifting as causes; SACN carbohydrates and health (2015) fibre target"},

         {tone:"cream", h:"💧 Dry eye and conjunctival fragility", html:"Chronic dry eye causes conjunctival surface fragility — desiccated epithelium tears more easily, predisposing to SCH. Symptoms: grittiness, burning, foreign body sensation, paradoxical excessive tearing, worse in air-conditioned environments. Preservative-free lubricants (hypromellose PF, sodium hyaluronate) as often as needed, lid hygiene and a humidifier; optician or ophthalmology referral for severe dry eye (punctal plugs; ciclosporin eye drops for severe keratitis per NICE TA369). See the <a href='dry-eye-disease.html'>dry eye protocol</a>.", src:"NICE TA369 (2015) ciclosporin for dry eye with severe keratitis; BNF lubricant eye preparations"},

         {tone:"cream", h:"🚭 Smoking and eye health", html:"Smoking is the main modifiable risk factor for age-related macular degeneration, and is also linked with cataract and dry eye. Every eye consultation is an opportunity to ask about smoking and offer NHS stop-smoking support.", src:"Thornton J et al, Eye 2005 (smoking and AMD review); NICE NG209 (2021) stop-smoking support"},
         {tone:"green", h:"🤰 Post-delivery reassurance", html:"SCH during childbirth from pushing (Valsalva) is common. Reassure proactively: <em>\u201cYou may notice a red area in the whites of your eyes after delivery — this is very common after the pushing during labour and will disappear completely in 2–3 weeks.\u201d</em> This prevents unnecessary post-natal GP attendances for reassurance about a normal finding.", src:"College of Optometrists CMG sub-conjunctival haemorrhage (2025) — Valsalva causes, self-limiting course"}
       ]},
       {b:"why", html:"The obstetric Valsalva SCH is worth specific mention because it is common and causes maternal anxiety if not proactively addressed, particularly after a prolonged second stage of labour. Ideally it is mentioned in antenatal education so mothers are not alarmed when they look in the mirror. GPs seeing post-natal women for the 6-week check should ask about eye symptoms and reassure about SCH if present — the condition is benign and self-limiting, but a new mother who notices \u201ca lot of blood in her eye\u201d without prior warning may experience significant anxiety and seek emergency care unnecessarily."}
     ]},

    {id:"monitor", nav:"Follow-up", title:"Follow-up and safety-netting",
     blocks:[
       {b:"table", head:["Group","Follow-up"], rows:[
         ["<b>First uncomplicated SCH</b>","No specific follow-up required. Review in 3–4 weeks if not resolved, to confirm normal resolution. Safety-net: return urgently for reduced or changed vision, pain or photophobia, diplopia, increasing swelling or proptosis, new trauma, systemic illness or a non-blanching rash, or recurrent extensive bleeding or bruising elsewhere"],
         ["<b>Recurrent SCH</b>","Review after any targeted investigation. Treat the identified cause. Ophthalmology referral if atypical, persistent, unilateral and repeatedly localised, associated with a mass, or unexplained after initial assessment"],
         ["<b>Anticoagulated patient</b>","Document in the anticoagulation record as a minor bleeding event. Do not stop anticoagulation without clinical advice. If on warfarin, check the INR if not recent or over-anticoagulation is possible; INR does not assess DOAC intensity. Review the anticoagulation risk–benefit if there are multiple minor bleeds. Haematology input if the decision is complex"],
         ["<b>Child with SCH</b>","Document mechanism and consistency. Safeguarding assessment (NICE CG89/NG76, local procedures) if there is no suitable explanation, an inconsistent history, delay in seeking care, an injury inconsistent with developmental stage, recurrent or multiple injuries, or other bruising or petechiae. Paediatric referral if NAI is a concern, or if the child has multiple haemorrhages"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 Return or refer same day", html:"Any vision change, pain or photophobia with SCH → same-day ophthalmology · full extent not visible, especially after trauma → urgent ophthalmic or emergency assessment · new RAPD → immediate eye-emergency assessment · suspected open globe → rigid shield and immediate ophthalmology or ED · bilateral SCH after head or neck compression or trauma, or with neurological or major-injury features → 999.", src:"College of Optometrists CMG sub-conjunctival haemorrhage (2025) — emergency referral if intracranial source suspected"},
         {tone:"amber", h:"🟠 Within 48 hours", html:"Contact lens wearer with foreign-body sensation, trauma or persistent irritation → lens removed, cornea inspected, lid everted if safe · SCH on warfarin → check the INR if not recent or over-anticoagulation is possible · on a DOAC → review the dose and interacting medicines, and renal function if due or indicated (INR does not assess DOAC effect).", src:"College of Optometrists CMG sub-conjunctival haemorrhage (2025); BNF anticoagulant monitoring"},
         {tone:"blue", h:"🎨 Warn about the colour change", html:"Tell the patient in advance that the haemorrhage may look larger or darker over days 2–5 before it begins to resolve — this single sentence prevents a second anxious attendance.", src:"College of Optometrists CMG sub-conjunctival haemorrhage (2025) — self-limiting course"},
         {tone:"green", h:"📅 Expected course", html:"Usually clears within 1–2 weeks without treatment (a large bleed can take a little longer); review if it has not cleared by 3–4 weeks, spreads, or vision becomes affected.", src:"College of Optometrists CMG sub-conjunctival haemorrhage (2025)"}
       ]},
       {b:"say", html:"This is a burst blood vessel on the surface of the eye — like a bruise on the skin. It looks far worse than it is. It will change colour from red to orange to yellow and usually disappears over the next week or two, with no treatment at all. It does not affect your vision and it will not damage your eye. One thing to expect: over the next few days it may look bigger or darker before it starts to fade — that is normal, not a sign it is getting worse. I have checked your vision and examined the eye, and everything is as it should be. The one thing I do want to do is check your blood pressure, because that can make these little vessels more fragile. And do come straight back if your vision changes, the eye becomes painful or sensitive to light, you see double, the eye swells or starts to bulge, you have a new injury, you feel unwell or get a rash, or you notice bleeding or bruising elsewhere."}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999", html:"Suspected open globe with major trauma, or where safe transfer is not possible · bilateral SCH after significant head or neck compression or trauma, or with neurological symptoms, impaired consciousness, facial petechiae, periorbital or mastoid bruising or CSF leak · suspected intracranial source · fever with a non-blanching rash, meningism, shock or altered consciousness.", src:"College of Optometrists CMG sub-conjunctival haemorrhage (2025); NICE NG240 (2024)"},
         {tone:"red", h:"Eye emergency — same day (ophthalmology or ED)", html:"Reduced or changed visual acuity · a new RAPD · severe pain or an abnormal pupil · suspected open globe (rigid shield, no pressure) · haemorrhage whose full extent cannot be assessed, especially after trauma · proptosis, chemosis, arterialised vessels or suspected carotid-cavernous fistula (usually via the emergency department). Use the local Greater Manchester urgent eye-care or on-call ophthalmology route.", src:"College of Optometrists CMG sub-conjunctival haemorrhage (2025); CMG trauma (penetrating)"},
         {tone:"amber", h:"Ophthalmology — urgent (24–48 hours)", html:"Traumatic SCH with normal vision in a contact lens wearer (foreign body exclusion) · suspected corneal abrasion, retained foreign body or keratitis in a contact lens wearer (same day if vision is reduced).", src:"College of Optometrists CMG sub-conjunctival haemorrhage (2025)"},
         {tone:"blue", h:"Ophthalmology — routine", html:"Recurrent SCH that is atypical, persistent, unilateral and repeatedly localised, associated with a mass, or unexplained after initial assessment. Typical recurrent anticoagulant-associated SCH with a reassuring primary-care evaluation does not need routine referral.", src:"College of Optometrists CMG sub-conjunctival haemorrhage (2025) — recurrent episodes"},
         {tone:"blue", h:"Haematology", html:"Recurrent SCH with a low platelet count or coagulation abnormality · suspected bleeding diathesis.", src:"College of Optometrists CMG sub-conjunctival haemorrhage (2025) — bleeding abnormality"},
         {tone:"purple", h:"Very urgent FBC · NICE NG12 (updated April 2026) — suspected leukaemia", html:"Adult with the SCH plus unexplained bruising, bleeding or petechiae (or pallor, fatigue, fever, recurrent infection, lymphadenopathy, hepatosplenomegaly): very urgent FBC within 48 hours, and act on the result the same day. Child or young person with unexplained petechiae or hepatosplenomegaly: immediate specialist assessment.", src:"NICE NG12 (updated April 2026) — leukaemia"},
         {tone:"cream", h:"GP management", html:"Single uncomplicated SCH: reassurance, lubricant drops for comfort, self-limiting over 1–2 weeks, and a BP check. Recurrent episode: reassess the diagnosis, review medicines and triggers, check BP, and use targeted tests only if indicated — then treat the underlying cause (hypertension, anticoagulation review, constipation causing straining).", src:"College of Optometrists CMG sub-conjunctival haemorrhage (2025); NICE NG136 (2019, updated 2023)"}
       ]},
       {b:"why", html:"The GP has a valuable reassurance opportunity at every SCH consultation — the haemorrhage looks alarming to patients (bright red, spreading, covering the white of the eye) and causes significant anxiety. Effective reassurance: <em>\u201cA subconjunctival haemorrhage is like a bruise on the skin — it looks worse than it is. It is caused by a tiny blood vessel on the surface of the eye breaking. It will gradually change colour from red to orange to yellow, and usually disappear over the next week or two without any treatment. It does not affect your vision and will not damage your eye.\u201d</em> Managing expectations matters: tell the patient in advance that the haemorrhage may look larger or darker over days 2–5 before it begins to resolve. Cold compresses in the first 24 hours reduce spreading, and artificial tear lubricants provide symptomatic relief if the eye is dry and uncomfortable — no eye drops, tablets or other specific treatment is needed."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 68-year-old on apixaban for atrial fibrillation attends alarmed by a bright red patch covering the outer half of the white of his right eye, noticed on waking. There was no trauma. He has stopped his apixaban since yesterday \u201cin case it made it worse\u201d, and his BP today is 168/96.", src:"NICE NG136 (2019, updated 2023) — clinic BP 140/90 or higher: offer ABPM to confirm"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"<b>Measures and documents the visual acuity rather than asking about it</b>; <b>confirms the posterior border is visible</b> and does the <b>swinging torch test</b>; advises restarting the apixaban (involving the prescribing or anticoagulation team if needed) and explains that an uncomplicated SCH does not usually require interruption of anticoagulation — naming the stroke risk he has taken on; <b>documents it as a minor bleed and reviews adherence, interacting medicines and renal function if due — knowing INR does not assess apixaban effect</b>; takes the hypertension seriously as the likely contributor and as a diagnostic opportunity in its own right; reassures with the <b>colour-change warning</b>; and \u2014 the step candidates miss \u2014 gives the explicit anticoagulation safety rules (which bleeds do warrant urgent contact) rather than leaving him to guess next time; offers ambulatory or home BP monitoring to confirm hypertension, with cardiovascular risk assessment — 168/96 in an otherwise well patient does not itself justify emergency referral.", src:"NICE NG136 (2019, updated 2023); College of Optometrists CMG sub-conjunctival haemorrhage (2025)"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>College of Optometrists — Clinical Management Guideline: sub-conjunctival haemorrhage (version published June 2025)</b><br><a href="https://www.college-optometrists.org/guidance/clinical-management-guidelines/sub-conjunctival-haemorrhage.html" rel="noopener">college-optometrists.org — CMG sub-conjunctival haemorrhage</a><span class="rd"> — causes (idiopathic, commoner over 50; trauma, surgery and contact lenses in younger adults), the 1–2 week self-limiting course, recurrent episodes pointing to raised BP or a bleeding abnormality, and same-day emergency referral if an intracranial source is suspected</span></li>'+
         '<li><b>College of Optometrists — Clinical Management Guideline: trauma (penetrating)</b><br><a href="https://www.college-optometrists.org/clinical-guidance/clinical-management-guidelines/trauma_penetrating" rel="noopener">college-optometrists.org — CMG trauma (penetrating)</a><span class="rd"> — suspected globe rupture: shield without pressure and emergency referral</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — leukaemia: very urgent FBC (within 48 hours) in adults with unexplained bruising, bleeding or petechiae and the other listed features; immediate specialist assessment for children and young people with unexplained petechiae or hepatosplenomegaly</span></li>'+
         '<li><b>NICE NG240 — Meningitis (bacterial) and meningococcal disease (2024)</b><br><a href="https://www.nice.org.uk/guidance/ng240" rel="noopener">nice.org.uk/guidance/ng240</a><span class="rd"> — parenteral benzylpenicillin or ceftriaxone outside hospital for suspected meningococcal disease, unless it would delay transfer</span></li>'+
         '<li><b>NICE NG136 — Hypertension in adults: diagnosis and management (2019, updated 2023)</b><br><a href="https://www.nice.org.uk/guidance/ng136" rel="noopener">nice.org.uk/guidance/ng136</a><span class="rd"> — measuring and managing blood pressure, and confirming a new diagnosis with ABPM or HBPM</span></li>'+
         '<li><b>NICE CG89 — Child maltreatment: when to suspect maltreatment in under 18s (2009)</b><br><a href="https://www.nice.org.uk/guidance/cg89" rel="noopener">nice.org.uk/guidance/cg89</a><span class="rd"> — consider maltreatment when there is no suitable explanation for a serious or unusual injury</span></li>'+
         '<li><b>NICE NG76 — Child abuse and neglect (2017)</b><br><a href="https://www.nice.org.uk/guidance/ng76" rel="noopener">nice.org.uk/guidance/ng76</a><span class="rd"> — recognising and responding to abuse and neglect</span></li>'+
         '<li><b>Care Act 2014 — adult safeguarding (sections 42–46)</b><br><a href="https://www.legislation.gov.uk/ukpga/2014/23/contents" rel="noopener">legislation.gov.uk</a><span class="rd"> — the framework for raising concern about suspected elder abuse</span></li>'+
         '<li><b>NICE TA369 — Ciclosporin for treating dry eye disease that has not improved despite treatment with artificial tears (2015)</b><br><a href="https://www.nice.org.uk/guidance/ta369" rel="noopener">nice.org.uk/guidance/ta369</a><span class="rd"> — severe keratitis in dry eye</span></li>'+
         '<li><b>Thornton J et al. Smoking and age-related macular degeneration: a review of association. Eye 2005</b> and <b>NICE NG209 — Tobacco (2021)</b><br><a href="https://www.nice.org.uk/guidance/ng209" rel="noopener">nice.org.uk/guidance/ng209</a><span class="rd"> — smoking as a risk factor for AMD; stop-smoking support</span></li>'+
         '<li><b>SACN — Carbohydrates and health (2015)</b><span class="rd"> — 30 g a day of fibre</span></li>'+

         '<li><b>Keeling D et al. Guidelines on oral anticoagulation with warfarin — fourth edition. Br J Haematol 2011 (BSH)</b><span class="rd"> — managing a raised INR and minor bleeding without stopping anticoagulation</span></li>'+
         '<li><b>UKHSA — Viral haemorrhagic fever: risk assessment algorithm</b><br><a href="https://www.gov.uk/government/publications/viral-haemorrhagic-fever-algorithm-and-guidance-on-management-of-patients" rel="noopener">gov.uk</a><span class="rd"> — isolate and involve the health protection team before sampling a febrile returning traveller at risk</span></li>'+
         '<li><b>GMC Good Medical Practice (2024)</b><br><a href="https://www.gmc-uk.org/professional-standards/the-professional-standards/good-medical-practice" rel="noopener">gmc-uk.org</a><span class="rd"> — the requirement that clinical assessments are thorough and appropriate to the presenting condition, behind the mandatory documented visual acuity</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — lubricant eye drop prescribing (hypromellose, carbomer, sodium hyaluronate), benzylpenicillin, lactulose and macrogols; adult and child 10 years and over benzylpenicillin 1.2 g for suspected meningococcal disease before transfer</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Subconjunctival haemorrhage — College of Optometrists CMG (2025), NICE NG12 (updated April 2026), NICE NG240 (2024), NICE NG136 (2019, updated 2023), NICE CG89 (2009), GMC Good Medical Practice (2024) and the BNF. Measure and document the visual acuity in every red eye consultation, and do not stop anticoagulation for an uncomplicated subconjunctival haemorrhage without clinical advice. The wider undifferentiated presentation is covered by the <a href=\"../algorithms/red-eye.html\">red eye pathway</a>. Verify all doses against the current BNF before prescribing."
