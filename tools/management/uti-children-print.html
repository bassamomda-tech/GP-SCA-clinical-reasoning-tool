MG.render({

  title:"UTI in children — the complete guide",

  stemTitle:"Under 3 months with a suspected UTI is a hospital problem — and above that age the whole management hinges on whether this is upper or lower tract, typical or atypical, first or recurrent",
  stemSub:"One page for the whole condition, from the fever in front of you to the scan result months later: who needs a urine test, getting a sample that means something, reading a dipstick whose rules change with age (NICE NG224, 2022), classifying the episode, choosing the antibiotic and the duration, deciding who needs imaging and when, and recognising the atypical or recurrent picture linked with renal scarring. The commonest errors are not the antibiotic choice: they are treating a contaminated sample as diagnostic, and never making the imaging request.",
  guideline:"NICE NG224 (2022) · NICE NG143 (2019) · NICE NG254 (2025) · NICE NG109 (2018) · NICE NG111 (2018) · NICE NG112 (2018) · NICE CG99 (2010) · NICE NG12 (updated April 2026) · BNFC",

  meta:[
    {t:"NICE NG224 — UTI in under 16s: diagnosis and management (2022)"},

  ],
  lead:'<div class="mg-layers"><a href="#safety"><b>Red flags</b><small>Under 3 months · sepsis · NG12</small></a><a href="#who"><b>Who to test</b><small>Fever ≥38 °C · by age</small></a><a href="#sample"><b>The sample</b><small>Clean catch</small></a><a href="#diagnose"><b>Dipstick</b><small>Rules by age</small></a><a href="#treat"><b>Antibiotics</b><small>Upper vs lower</small></a><a href="#imaging"><b>Imaging</b><small>USS · DMSA · MCUG</small></a></div>',
  quickSub:"If you read nothing else, read these six. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Under 3 months — refer immediately; hospital-led treatment", html:"An infant under 3 months with a suspected UTI is referred immediately to paediatric specialist care, with urine sent for urgent microscopy and culture (NICE NG224). The hospital/paediatric team decides and administers treatment according to NICE NG143 and the local neonatal/paediatric pathway. <b>Do not delay hospital treatment if a sample cannot immediately be obtained, and do not manage with an oral prescription alone in primary care.</b> The signs are non-specific — poor feeding, vomiting, lethargy, irritability, jaundice, faltering growth — and the infant may be hypothermic rather than febrile."},
    {tone:"amber", h:"A contaminated sample cannot diagnose a UTI", html:"Clean-catch urine is the recommended method. If that is not possible, use a urine collection pad — not cotton wool, gauze or sanitary towels. Catheter samples or suprapubic aspiration are for when non-invasive methods are not possible, usually in hospital (NG224). If a pad is used, follow the manufacturer's instructions and interpret a positive result cautiously because contamination is more likely; confirm with a better-quality sample when the diagnosis is uncertain or treatment would lead to admission, prolonged antibiotics or imaging."},
    {tone:"blue", h:"Dipstick rules change at 3 months and at 3 years", html:"<b>3 months to under 3 years (NG224, 2022):</b> leucocyte esterase or nitrite positive → start antibiotics and send urine for culture; both negative → UTI unlikely, no antibiotics and no culture unless another indication applies. <b>3 years and over:</b> nitrite positive → start antibiotics; leucocytes positive with nitrite negative → culture, and treat only with good clinical evidence of UTI; both negative → UTI unlikely, look for another cause. Use a fresh sample when interpreting nitrites; <b>clinical risk overrides the dipstick in a seriously ill child</b>."},
    {tone:"blue", h:"Upper or lower decides the drug and the duration", html:"Upper UTI (bacteriuria with fever of 38 °C or more, or with loin pain or tenderness below that temperature): urine culture and prompt antibiotics; consider paediatric referral (NG224), particularly in infants, systemically unwell children, structural or functional urinary abnormality, recurrent infection, dehydration, vomiting or diagnostic uncertainty; oral cefalexin or co-amoxiclav for 7–10 days if well enough (NICE NG111), IV via paediatrics if not. Lower UTI: 3 days of trimethoprim or nitrofurantoin if resistance risk is low (NICE NG109). <b>Regimen-level guidance only: check age-, weight-, renal-function- and indication-specific dosing in the BNFC and the local Greater Manchester antimicrobial guideline.</b>"},
    {tone:"green", h:"Safety-net at 24–48 hours, in words the parent can act on", html:"Return if the child is not improving after 24–48 hours of treatment, is drinking much less, is vomiting doses, has far fewer wet nappies, or develops new loin pain or high fever. <b>Give the sepsis signs explicitly.</b> Failure to respond within 48 hours defines atypical UTI — reassess, review the culture, and bring forward the ultrasound; do not just prescribe another course. Reassess earlier if symptoms worsen, fever persists, oral treatment is not tolerated or the child becomes systemically unwell — the 48-hour threshold is not a reason to wait in a deteriorating child."},
    {tone:"purple", h:"🟣 Two duties that override the UTI", html:"<b>A palpable abdominal mass or an unexplained enlarged abdominal organ</b> (or unexplained visible haematuria) is a very urgent referral, for an appointment within 48 hours, for Wilms' tumour or neuroblastoma (NICE NG12, updated April 2026) — never assume it is a full bladder without re-examining after voiding. <b>Safeguarding</b> cues — genital injury, an STI, a disclosure, or recurrent UTI with neglect — follow local procedures (Working Together to Safeguard Children). UTI alone is not evidence of abuse."}
  ],
  pathwaySub:"Six decisions, in order. Getting the first three right prevents most of the downstream error.",
  pathway:[
    {title:"Is this child under 3 months, septic, or carrying an NG12 flag?", html:"Under 3 months with a suspected UTI → immediate paediatric referral (NG224). Any high-risk sepsis feature (NICE NG254) or red traffic-light feature (NICE NG143) → immediate senior/paediatric assessment and emergency escalation according to clinical severity; do not delay treatment for urine collection. Abdominal mass → NG12 48-hour referral alongside the UTI pathway.", alert:true},
    {title:"Should this child have a urine test?", html:"Any child with symptoms or signs suggesting UTI, and <b>any child with unexplained fever of 38 °C or higher</b> (NG224). Continue to assess for respiratory, neurological, gastrointestinal, skin and other sources of infection — a positive urine result does not end the assessment of a systemically unwell child. Record the risk factors — they change imaging."},
    {title:"Get a sample that actually means something", html:"<b>Clean-catch if not toilet-trained; mid-stream if toilet-trained.</b> Pad only if clean-catch is impossible. Refrigerate or use boric acid if it cannot reach the lab within 4 hours."},
    {title:"Interpret by age, then classify", html:"Dipstick per NG224 for 3 months and over; culture when indicated. Classify: <b>upper or lower tract</b>, then <b>typical, atypical or recurrent</b> — and write the classification in the notes."},
    {title:"Treat for the right duration, and review at 48 hours", html:"<b>Upper: 7–10 days oral, or IV via paediatrics. Lower: 3 days.</b> Review with the culture in front of you; switch on sensitivities rather than escalating blindly. Reassess sooner if the child is deteriorating."},
    {title:"Decide who needs imaging — and actually arrange it", html:"Atypical or recurrent UTI, and infants under 6 months, follow the NG224 imaging table (ultrasound, DMSA, MCUG). DMSA and MCUG are selective, not routine. Document the NG224 category and the imaging plan; where specialist referral is required, the paediatric/urology team owns the imaging request and follow-up. The most consistently missed step in the whole pathway is the follow-up imaging request."}
  ],
  sections:[

    {id:"safety", nav:"Red flags", title:"Red flags — the age rule, and the child who is more than infected",
     sub:"Assess every febrile child with the NICE NG143 traffic-light features and the NICE NG254 sepsis risk criteria before thinking about the urine.",
     blocks:[
       {b:"table", head:["Feature","Meaning","Action"], rows:[
         ["<b>Under 3 months with a suspected UTI (febrile or not)</b>","High rate of bacteraemia; clinical signs are unreliable and localising features absent","<b>Immediate paediatric referral with urine for urgent microscopy and culture (NG224)</b>; the hospital/paediatric team decides and administers treatment (NG143, local neonatal/paediatric pathway). Do not manage with an oral prescription alone, and do not delay hospital treatment to obtain a sample"],
         ["Any age: mottled or ashen skin, non-blanching rash, reduced responsiveness, weak or high-pitched cry, grunting, tachypnoea, cold peripheries with prolonged capillary refill, reduced urine output","<b>Suspected sepsis</b>","<b>Immediate senior/paediatric assessment and emergency escalation according to clinical severity (NICE NG254). Do not delay treatment for urine collection.</b> 999 for unresponsiveness, severe breathing difficulty, shock or markedly prolonged capillary refill, non-blanching rash with serious illness, seizure or severe deterioration"],
         ["Unable to tolerate oral fluids or antibiotics; persistent vomiting; clinical dehydration","<b>Oral therapy will fail regardless of the organism</b>","<b>Refer or admit for paediatric assessment</b>; treatment (including IV antibiotics and fluids) depends on severity and hydration"],
         ["<b>Seriously ill, poor urine flow, abdominal or bladder mass, raised creatinine, septicaemia, no response to a suitable antibiotic within 48 hours, or a non-E. coli organism</b>","<b>ATYPICAL UTI (NG224 definition)</b>","Same-day paediatric discussion and ultrasound during the acute infection — see <a href='#imaging'>Imaging</a>"],
         ["<b>Palpable abdominal mass or unexplained enlarged abdominal organ; unexplained visible haematuria</b>","Atypical UTI — <b>and an NG12 criterion for Wilms' tumour or neuroblastoma</b>","<b>Very urgent referral, appointment within 48 hours (NICE NG12, updated April 2026)</b>, running in parallel with the UTI pathway"],
         ["<b>Known renal tract abnormality</b> — antenatal hydronephrosis, known reflux, single or duplex kidney, neuropathic bladder — with a febrile UTI","Higher risk of complicated infection and scarring","Same-day paediatric discussion"],
         ["<b>Faltering growth, raised blood pressure or proteinuria</b>","Underlying renal tract abnormality, reflux nephropathy or established scarring","Paediatric nephrology referral with blood pressure and renal function — not just another antibiotic course"],
         ["Genital injury, an STI, a disclosure, or recurrent UTI with neglect or poor attendance","<b>Safeguarding concern</b>","Follow local safeguarding procedures and discuss with the named professional. UTI alone is not evidence of abuse"]
       ]},
       {b:"dl", rows:[
         ["<b>NG12 — the criterion that applies here</b>","Consider a very urgent referral (for an appointment within 48 hours) for specialist assessment for neuroblastoma or Wilms' tumour in children with a palpable abdominal mass or unexplained enlarged abdominal organ; unexplained visible haematuria is also a Wilms' tumour criterion (NICE NG12, updated April 2026). Restated in <a href='#refer'>Refer</a>."]
       ]},
       {b:"why", html:"Urinary infection is a common cause of fever without a focus in young children, and in infants it may be bacteraemic with non-specific signs. That is why NG224 takes the under-3-months group out of primary care altogether: the decision is referral, not dipstick interpretation. Above that age, the sepsis and traffic-light assessment (NG254, NG143) decides where the child is managed; the urine decides what they have. An abdominal mass does double duty: it defines atypical UTI in NG224, and it is an NG12 criterion for very urgent referral, so it must never be attributed to a full bladder without checking again after voiding."},
       {b:"warn", html:"The two failures that cause harm here are both administrative rather than clinical. One: a UTI diagnosed on a contaminated sample, which labels a child, triggers imaging they did not need, and obscures the real cause of the fever. Two: a genuine upper or atypical UTI treated correctly and then never imaged or followed up — scarring causes no symptoms in childhood, and the moment it could have been detected was the request nobody made. Both are prevented by the same discipline: a proper sample, and the imaging decision made and documented at the time of diagnosis."}
     ]},

    {id:"who", nav:"Who to test", title:"Clinical probability — who needs a urine test, and what else it could be",
     sub:"NICE NG224: test the urine of any infant or child with symptoms or signs suggesting UTI, and of any child with unexplained fever of 38 °C or higher — while continuing to assess for respiratory, neurological, gastrointestinal, skin and other sources of infection.",
     blocks:[
       {b:"table", head:["Age","How UTI presents"], rows:[
         ["<b>Under 3 months</b>","Fever, vomiting, lethargy, irritability, poor feeding, faltering growth; less often abdominal pain, jaundice, haematuria or offensive urine. Localising urinary symptoms are rarely reported"],
         ["<b>3 months to under 3 years (preverbal)</b>","Fever is the commonest sign; also abdominal pain, loin tenderness, vomiting, poor feeding; less often lethargy, offensive urine, haematuria, new wetting"],
         ["<b>3 years and over (verbal)</b>","Frequency, dysuria, urgency, suprapubic or abdominal pain, new daytime wetting or enuresis, haematuria; loin pain or fever points to the upper tract"]
       ]},
       {b:"dl", rows:[
         ["<b>Risk factors to ask about and record (NG224)</b>","Poor urine flow · previous suspected or confirmed UTI · recurrent fever of uncertain origin · antenatally diagnosed renal abnormality · family history of vesicoureteric reflux or renal disease · constipation · dysfunctional voiding · enlarged bladder or abdominal mass · evidence of a spinal lesion · poor growth · raised blood pressure"]
       ]},
       {b:"table", head:["Differential","Discriminating features","Next step"], rows:[
         ["<b>Another source of fever</b>","Otitis media, pneumonia, viral illness, meningitis; leucocytes rise in many febrile illnesses, including Kawasaki disease and appendicitis","Examine ears, throat, chest, skin and meninges — a positive dipstick does not end the search in an unwell child"],
         ["<b>Vulvovaginitis or balanitis</b>","External dysuria from soreness; a clean sample grows nothing","Look at the genitalia; hygiene and barrier advice"],
         ["<b>Threadworm</b>","Nocturnal perianal or vulval itch with dysuria; negative culture","Treat the household"],
         ["<b>Constipation and voiding dysfunction</b>","Frequency, urgency and wetting without infection; loaded rectum; infrequent hard stools","Treat per NICE CG99; bladder and bowel advice"],
         ["<b>Diabetes</b>","Polyuria, thirst, new bed-wetting, weight loss","Capillary glucose the same day"],
         ["<b>Adolescents: STI or pregnancy</b>","Sexually active young person with dysuria or discharge","STI testing and pregnancy test; safeguarding assessment where relevant"]
       ]},
       {b:"why", html:"Children under about 3 cannot describe dysuria or frequency, so fever may be the only clue — which is why NG224 asks for urine testing in unexplained fever of 38 °C or higher rather than waiting for urinary symptoms. The risk-factor list matters because each item either raises the chance that this is a UTI or points to an underlying abnormality that changes imaging. The differentials matter because a urinary finding is easy to over-interpret: leucocytes appear in many febrile illnesses, and external soreness mimics dysuria."}
     ]},

    {id:"sample", nav:"The sample", title:"Getting a urine sample that can be believed",
     sub:"Almost every downstream error in this pathway starts with a contaminated sample.",
     blocks:[
       {b:"table", head:["Situation","Method","Practical detail"], rows:[
         ["<b>Not toilet-trained (infant or toddler)</b>","<b>Clean-catch urine — the recommended method (NG224)</b>","Remove the nappy, clean the area with water, and wait with a sterile pot. A feed often prompts a void within minutes; running water nearby can help. It takes patience and a parent who has been told what to do — allow for it in the appointment rather than defaulting to a pad"],
         ["<b>Clean-catch genuinely not possible</b>","<b>Urine collection pad</b> (not cotton wool balls, gauze or sanitary towels)","Follow the manufacturer's instructions and transfer promptly. Higher contamination risk — interpret a positive result cautiously, alongside symptoms, dipstick and culture. Confirm with a better-quality sample when the diagnosis is uncertain or treatment would lead to admission, prolonged antibiotics or imaging"],
         ["<b>Toilet-trained child</b>","<b>Mid-stream clean sample</b>","Explain it to the child and the parent; the first part of the stream carries the periurethral contamination"],
         ["Non-invasive methods not possible, or sample needed urgently in an unwell child","Catheter sample or suprapubic aspiration — usually in hospital, ideally ultrasound-guided for aspiration","<b>Never delay antibiotics in a septic child to obtain a clean sample</b>"],
         ["<b>Sample cannot be cultured within 4 hours</b>","<b>Refrigerate, or use a boric acid container filled to the correct line (NG224)</b>","An overfilled or underfilled boric acid container can give a false result — the preservative concentration matters"],
         ["<b>When to send for culture</b>","Under 3 months (all, via paediatrics) · 3 months to under 3 years with a positive dipstick · suspected upper UTI · high or intermediate risk of serious illness · a single positive dipstick result (leucocytes or nitrite alone) at 3 years and over · recurrent UTI · no response to treatment within 24–48 hours · symptoms and dipstick do not match (NG224)","Culture is the reference standard, and the only way the sensitivities that matter at 48 hours ever become available"]
       ]},
       {b:"say", html:"I need a clean urine sample, and with a child this age that takes a few minutes of patience rather than a special device. Take the nappy off, clean the area with plain water, and just wait with the pot ready — one of you holding her, one of you poised. A feed often gets things going. If we truly cannot catch it we can use a special pad, but the catch is more reliable, and that matters: a contaminated sample can tell us there is an infection when there isn't, and that means antibiotics she doesn't need and scans she doesn't need. So it is worth the ten minutes now."}
     ]},

    {id:"diagnose", nav:"Dipstick", title:"Dipstick and culture — the NG224 rules by age",
     blocks:[
       {b:"table", head:["Age and result","Meaning","What to do"], rows:[
         ["<b>Under 3 months</b>","<b>Dipstick does not decide management</b>","Immediate paediatric referral; urgent microscopy and culture are arranged as part of it (NG224)"],
         ["<b>3 months to under 3 years — leucocyte esterase OR nitrite positive</b>","Greatly increases the likelihood of a positive culture","<b>Start antibiotics and send urine for culture (NG224, 2022)</b>"],
         ["<b>3 months to under 3 years — both negative</b>","<b>UTI unlikely</b>","Do not start antibiotics; do not send for culture unless another culture indication applies (for example suspected upper UTI or high risk of serious illness). Look for another source"],
         ["<b>3 years and over — nitrite POSITIVE (leucocytes either)</b>","<b>Good predictive value</b>","<b>Start antibiotics</b>; send culture if a culture indication applies"],
         ["<b>3 years and over — leucocyte positive, nitrite negative</b>","Weak; leucocytes rise in any febrile illness, balanitis, vulvitis, appendicitis and Kawasaki disease","Send urine for culture and start antibiotics only if there is good clinical evidence of UTI"],
         ["<b>3 years and over — both negative</b>","<b>UTI unlikely</b>","Do not treat as UTI; look for another cause"],
         ["<b>Asymptomatic bacteriuria — a positive culture with no symptoms</b>","<b>Not a UTI</b>","<b>No routine antibiotics, prophylaxis or repeat urine testing in an otherwise well child (NG224)</b>; continue any clinically indicated follow-up for renal abnormalities, recurrent UTI, hypertension, proteinuria or growth concerns"]
       ]},
       {b:"dl", rows:[
         ["<b>Interpreting the dipstick</b>","Use a fresh urine sample — nitrite needs it. Clinical risk overrides the dipstick in a seriously ill child"],
         ["<b>Bloods</b>","Only if unwell or atypical: FBC, CRP, U&amp;E and creatinine, blood culture — usually in the paediatric assessment unit"],
         ["<b>Do not</b>","Routinely repeat urine testing in a clinically well child after treatment. Do not routinely use imaging to localise UTI, and do not use CT or plain abdominal radiographs routinely for UTI. Arrange ultrasound, DMSA or MCUG only according to the NG224 imaging tables or specialist advice (NG224)"]
       ]},
       {b:"why", html:"The 2022 update of NG224 changed practice for children aged 3 months to under 3 years: the dipstick is now used, antibiotics are started only if leucocyte esterase or nitrite is positive, and a double-negative dipstick makes UTI unlikely enough that culture is not needed unless another indication applies. The earlier teaching — do not rely on the dipstick under 3 years, culture everyone — is superseded. Nitrite remains the more specific marker because bacteria need urine to dwell in the bladder for some hours to produce it, so a negative nitrite is less reassuring in a child who voids frequently; leucocyte esterase is sensitive but non-specific, rising in many febrile illnesses."}
     ]},

    {id:"classify", nav:"Classify", title:"Classify the episode — upper or lower, typical, atypical or recurrent",
     sub:"NG224 classification decides antibiotic duration and the imaging schedule. Classify at the moment of diagnosis and write it in the notes.",
     blocks:[
       {b:"dl", rows:[
         ["<b>Upper UTI (acute pyelonephritis)</b>","Bacteriuria and fever of 38 °C or higher; or bacteriuria with fever below 38 °C plus loin pain or tenderness"],
         ["<b>Lower UTI (cystitis)</b>","Bacteriuria without fever or systemic features: frequency, dysuria, suprapubic pain"],
         ["<b>Atypical UTI</b>","Seriously ill · poor urine flow · abdominal or bladder mass · raised creatinine · septicaemia · failure to respond to a suitable antibiotic within 48 hours · infection with a non-E. coli organism"],
         ["<b>Recurrent UTI</b>","Two or more episodes of upper UTI; OR one episode of upper UTI plus one or more of lower UTI; OR three or more episodes of lower UTI. Confirm recurrence using credible clinical episodes and appropriate urine results — do not count every febrile illness or every contaminated sample as a UTI"],
         ["<b>First typical UTI</b>","Responds within 48 hours, E. coli, no atypical features. Over 6 months of age: no routine imaging"]
       ]},
       {b:"table", head:["Examine","What you are looking for"], rows:[
         ["<b>Traffic-light observations (NG143)</b>","Temperature, heart rate, respiratory rate, capillary refill, colour, activity and hydration, interpreted by age; any red feature → emergency pathway"],
         ["<b>Hydration</b>","Dry mucous membranes, sunken eyes or fontanelle, reduced skin turgor, fewer wet nappies"],
         ["<b>Abdomen and loins</b>","Suprapubic tenderness (lower tract); loin or renal-angle tenderness (upper tract); a palpable bladder after voiding or a renal or abdominal mass (atypical, and an NG12 flag)"],
         ["<b>External genitalia</b>","Vulvovaginitis, labial adhesions, phimosis or balanitis; injury or discharge"],
         ["<b>Spine and lower limbs</b>","Sacral dimple, hair tuft or naevus, abnormal gait or leg neurology — a spinal lesion causing a neuropathic bladder"],
         ["<b>Blood pressure and growth</b>","Measure BP with a correctly sized cuff in recurrent or atypical UTI and where scarring is known, against age, sex and height centiles; plot height and weight"],
         ["<b>Other focus</b>","Ears, throat, chest, skin and meninges — a urinary finding does not exclude a second source"]
       ]},
       {b:"why", html:"Classification drives two separate decisions. Upper versus lower sets the antibiotic course (7–10 days versus 3 days). Typical, atypical or recurrent, combined with age, sets the imaging. The middle limb of the recurrent definition is <b>one upper UTI plus at least one lower UTI</b> — not two lower with one upper. Previous episodes only count if they were genuinely UTIs, so check whether a culture confirmed them before adding them up. Blood pressure is the examination finding most often omitted, and it is the one that detects the long-term consequence of scarring."}
     ]},

    {id:"treat", nav:"Antibiotics", title:"Antibiotic choice and duration",
     sub:"The duration and antibiotic choice shown are regimen-level guidance only. Check age-, weight-, renal-function- and indication-specific dosing in the current BNFC and the local Greater Manchester antimicrobial guideline — local resistance and second-choice availability differ between laboratories.",
     blocks:[
       {b:"table", head:["Situation","Treatment","Notes"], rows:[
         ["<b>Under 3 months, any suspected UTI</b>","<b>Immediate paediatric referral (NG224); the hospital/paediatric team decides and administers treatment according to NG143 and the local neonatal/paediatric pathway</b>","<b>Do not manage with an oral prescription alone in primary care; do not delay hospital treatment if clinically indicated</b>"],
         ["Upper UTI / acute pyelonephritis, 3 months or over, well enough for oral treatment","<b>Urine culture and prompt antibiotics. Consider paediatric referral (NG224), particularly in infants, systemically unwell children, structural or functional urinary abnormality, recurrent infection, dehydration, vomiting or diagnostic uncertainty.</b> Oral antibiotic for 7–10 days — cefalexin, or co-amoxiclav if culture results are available and show sensitivity (NICE NG111)","Culture before starting; review at 48 hours if not improving. Refer if sepsis, significant dehydration, inability to take oral medication, pregnancy or increased risk of complications (NG111); IV treatment is via paediatrics. <b>Do not use nitrofurantoin</b> — it does not reach the kidney"],
         ["<b>Lower UTI / cystitis, 3 months or over</b>","<b>3 days</b> of trimethoprim or nitrofurantoin as first choice if the risk of resistance is low; amoxicillin (only if culture-sensitive) or cefalexin as second choice (NICE NG109)","Review if still unwell at 48 hours. Previous culture results and the local antibiogram guide the choice"],
         ["<b>Adjusting on the culture</b>","<b>Switch to the narrowest effective agent the organism is sensitive to</b>","A resistant organism with ongoing symptoms means a change — not a wait"],
         ["<b>Not improving at 48 hours</b>","Reassess earlier if symptoms worsen, fever persists, oral treatment is not tolerated or the child becomes systemically unwell. Reassess in person; review culture and sensitivities; ultrasound during the acute infection; paediatric discussion","<b>This defines atypical UTI and triggers imaging</b> — see <a href='#imaging'>Imaging</a>"],
         ["<b>Antibiotic prophylaxis</b>","<b>Not routinely after a first UTI (NG224).</b> May be considered in recurrent UTI, usually as a specialist-guided decision (NICE NG112)","Not for asymptomatic bacteriuria"],
         ["<b>Symptom relief and fluids</b>","<b>Paracetamol or ibuprofen for pain and fever; encourage fluids</b>","Avoid ibuprofen in clinical dehydration or suspected renal impairment"]
       ]},
       {b:"cards", items:[
         {tone:"blue", h:"Do not treat asymptomatic bacteriuria", html:"<b>A positive culture in a well, asymptomatic child is not a UTI.</b> Do not treat asymptomatic bacteriuria or arrange routine repeat urine testing in an otherwise well child (NG224) — treatment drives resistance and unnecessary imaging. Continue any clinically indicated follow-up for renal abnormalities, recurrent UTI, hypertension, proteinuria or growth concerns.", src:"NICE NG224 (2022)"},
         {tone:"amber", h:"⚠ Nitrofurantoin does not treat the kidney", html:"Nitrofurantoin reaches bladder but not renal tissue concentrations — a lower-tract drug only. Using it for suspected pyelonephritis is a recognised error. It is also avoided in infants under 3 months. Check renal function where relevant, consider G6PD deficiency and product-specific cautions, and use current BNFC dosing; beyond these restrictions, young age alone is not a contraindication.", src:"NICE NG111 (2018); BNFC"},
         {tone:"amber", h:"⚠ Trimethoprim, pregnancy and folate", html:"In an adolescent who might be pregnant, remember trimethoprim is a folate antagonist and is avoided in the first trimester. Ask about pregnancy before prescribing, and offer sexual-health advice where relevant.", src:"BNFC; NICE NG109 (2018)"},
         {tone:"green", h:"✓ Prevention that actually works", html:"Treat constipation, address dysfunctional voiding (deferring, rushing, incomplete emptying), ensure adequate fluids through the day, including at school. In a toilet-trained child with recurrent or febrile UTI, assess for constipation, daytime wetting, urgency and withholding, dysfunctional voiding and incomplete emptying, and manage per NICE CG99 and local bladder-and-bowel pathways. Do not move directly to antibiotic prophylaxis without addressing these factors.", src:"NICE CG99 (2010); NICE NG224 (2022)"}
       ]},
       {b:"why", html:"Durations and drug classes come from NG224 and the antimicrobial prescribing guidelines NICE NG109 (lower UTI) and NICE NG111 (pyelonephritis). Doses are deliberately not reproduced here because they depend on weight and age bands and change; the BNFC is the reference. The most important safety point is that nitrofurantoin is for bladder infection only. Failure to improve within 48 hours is not a cue to prescribe another course blind: it defines atypical UTI and brings forward ultrasound and a paediatric discussion."}
     ]},

    {id:"imaging", nav:"Imaging", title:"Imaging and follow-up — the most-missed part of this pathway",
     sub:"NICE NG224 — the imaging table by age is the definitive source. Classify the episode first: typical, atypical or recurrent. Do not routinely use imaging to localise UTI; CT and plain films are not routine. DMSA and MCUG are selective investigations, not routine tests.",
     blocks:[
       {b:"table", head:["Age","Typical UTI, responds well","Atypical UTI","Recurrent UTI"], rows:[
         ["<b>Under 6 months</b>","<b>Ultrasound within 6 weeks</b>","<b>Ultrasound during the acute infection · DMSA at 4–6 months · MCUG</b>","<b>Ultrasound during the acute infection · DMSA at 4–6 months · MCUG</b>"],
         ["<b>6 months to under 3 years</b>","<b>No routine imaging</b>","<b>Ultrasound during the acute infection · DMSA at 4–6 months</b> (MCUG not routine; consider if dilatation on ultrasound, poor urine flow, non-E. coli infection or a family history of reflux)","<b>Ultrasound within 6 weeks · DMSA at 4–6 months</b>"],
         ["<b>3 years and over</b>","<b>No routine imaging</b>","<b>Ultrasound during the acute infection</b> (DMSA not routine in the NG224 table; no routine MCUG)","<b>Ultrasound within 6 weeks · DMSA at 4–6 months</b> (MCUG not routine)"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"🔍 What each test is for", html:"<b>Ultrasound</b> — structural abnormality, obstruction, dilatation, bladder emptying. <b>DMSA scintigraphy</b> — renal parenchymal defects (scarring); used selectively according to the NG224 table by age, particularly after atypical or recurrent UTI, and not routinely after a first typical UTI in an older child who responds promptly; done at 4–6 months to reduce confusion between acute inflammatory changes and established defects, and brought forward if another UTI occurs while waiting. <b>MCUG</b> — vesicoureteric reflux, mainly in infants; invasive, needs antibiotic cover and a clear explanation to parents.", src:"NICE NG224 (2022)"},
         {tone:"amber", h:"⚠ The request that never gets made", html:"Imaging is triggered at diagnosis but performed weeks later, so it depends on someone creating the request and a safety-net for the result. Document the NG224 category and communicate the required imaging plan; diarise it, tell the parent what has been arranged and when, and check the result came back. Where the pathway requires specialist referral, the paediatric/urology team should own the imaging request and follow-up.", src:"NICE NG224 (2022)"},
         {tone:"green", h:"✓ After a first typical UTI over 6 months", html:"No routine imaging, no prophylaxis and no routine repeat urine test after recovery — most children have normal urinary tracts. <b>Say this to the parents explicitly</b>: the reassurance prevents an anxious cycle of repeat testing.", src:"NICE NG224 (2022)"},
         {tone:"blue", h:"📋 Where renal parenchymal defects are found", html:"Children with bilateral renal abnormalities, impaired kidney function, raised blood pressure or proteinuria need monitoring and treatment by a paediatric nephrologist. For others with scarring, check blood pressure and proteinuria as advised, and record it as a lifelong consideration — including in future pregnancy.", src:"NICE NG224 (2022)"}
       ]}
     ]},

    {id:"followup", nav:"Follow-up", title:"Prevention, carer advice and safety-netting",
     blocks:[
       {b:"table", head:["When or what","Action"], rows:[
         ["<b>48 hours</b>","Review the culture and the child: organism, sensitivities, response. Not improving → reassess in person and manage as atypical"],
         ["<b>Imaging</b>","Document the NG224 category and request at diagnosis per the NG224 table (or ensure the paediatric/urology team owns it where specialist referral is required); tell parents what is booked and when; diarise to check the ultrasound and DMSA were done and reviewed"],
         ["<b>No routine retest</b>","Do not routinely repeat urine testing in a child who is well after treatment (NG224); continue clinically indicated renal follow-up"],
         ["<b>Constipation</b>","A loaded rectum impairs bladder emptying and is one of the commonest reversible contributors to recurrence; manage per NICE CG99"],
         ["<b>Voiding and fluids</b>","Regular, unhurried, complete voiding through the day and at school; adequate drinks spread through the day"],
         ["<b>Hygiene</b>","Wipe front to back; avoid bubble baths, perfumed soaps and wipes if they cause vulval soreness"],
         ["<b>Early recognition</b>","Teach carers the symptoms for their child's age, and to bring a clean-catch sample and mention the previous UTI at any future feverish illness — it changes how the next episode is classified"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 Call 999", html:"Child floppy, unresponsive, very drowsy or hard to wake, mottled or blue, struggling to breathe or grunting, a rash that does not fade, a fit, or getting rapidly worse.", src:"NICE NG254 (2025); NICE NG143 (2019)"},
         {tone:"amber", h:"🟠 Same-day review", html:"Not improving after 24–48 hours of antibiotics, or getting worse at any point — do not wait for 48 hours if deteriorating. Vomiting doses, drinking much less, far fewer wet nappies, new loin pain or persistent or new high fever.", src:"NICE NG224 (2022); NICE NG143 (2019)"},
         {tone:"green", h:"✓ What will not happen", html:"No routine repeat urine test once she is well, no daily antibiotic after a first simple infection, and no scan unless the rules above say so — reassurance is part of the treatment.", src:"NICE NG224 (2022)"}
       ]},
       {b:"why", html:"The most common silent failure is imaging that was indicated but never requested, or requested and never checked. Scarring causes no symptoms in childhood and may present years later as hypertension or kidney disease, so the imaging decision should be made and documented at diagnosis. Safety-netting works best in plain language with a specific time frame (24–48 hours), because parents otherwise wait for the course to finish. Prevention in children is mostly about bladder and bowel habits rather than antibiotics."}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Emergency — same day / 999", html:"Any infant under 3 months with a suspected UTI — immediate paediatric referral, hospital-led treatment (NG224) · high-risk sepsis features at any age — emergency escalation according to clinical severity (NG254) · unable to tolerate oral fluids or antibiotics, or clinical dehydration — paediatric assessment, treatment according to severity and hydration · seriously ill.", src:"NICE NG224 (2022); NICE NG254 (2025)"},
         {tone:"purple", h:"48-hour · NICE NG12 (updated April 2026)", html:"<b>Palpable abdominal mass or unexplained enlarged abdominal organ → very urgent referral (appointment within 48 hours) for neuroblastoma or Wilms' tumour; unexplained visible haematuria → the same for Wilms' tumour.</b> Runs alongside the UTI pathway.", src:"NICE NG12 (updated April 2026)"},
         {tone:"amber", h:"Same-day paediatric discussion", html:"Atypical UTI (poor flow, mass, raised creatinine, septicaemia, no response at 48 hours, non-E. coli) · febrile UTI with a known renal tract abnormality.", src:"NICE NG224 (2022)"},
         {tone:"amber", h:"Consider paediatric referral", html:"Upper UTI in a child aged 3 months or over — NG224 advises considering referral, particularly in infants, systemically unwell children, structural or functional urinary abnormality, recurrent infection, dehydration, vomiting or diagnostic uncertainty · recurrent UTI where imaging and prophylaxis need specialist coordination.", src:"NICE NG224 (2022); NICE NG112 (2018)"},
         {tone:"blue", h:"Paediatric nephrology or urology", html:"Bilateral renal abnormalities · impaired kidney function · raised blood pressure or proteinuria · scarring on DMSA · reflux needing management.", src:"NICE NG224 (2022)"},
         {tone:"blue", h:"Imaging (direct request)", html:"<b>Ultrasound, DMSA and MCUG per the NG224 table.</b> Include the age, the episode classification and the organism on the request. Where the pathway requires specialist referral, the paediatric/urology team should own complex DMSA or MCUG requests and their follow-up.", src:"NICE NG224 (2022)"},
         {tone:"green", h:"Bladder and bowel service", html:"Dysfunctional voiding, deferring, daytime wetting, or constipation not responding to first-line treatment — often prevents more recurrences than prophylaxis.", src:"NICE CG99 (2010)"},
         {tone:"red", h:"🔴 Safeguarding", html:"Where recurrent UTI sits alongside neglect, poor engagement, unexplained injury, genital trauma, an STI or a disclosure — refer to children's social care under local procedures. UTI alone is not evidence of abuse and must not be recorded as such.", src:"Working Together to Safeguard Children"},
         {tone:"cream", h:"GP management", html:"A well child aged 3 months or over with a lower UTI, or a mild upper UTI tolerating oral antibiotics, is managed in primary care: the sample, the antibiotic, the 48-hour review, the constipation and voiding advice, the imaging request where indicated, and the parental explanation — using the local <a href='https://gmmmg.nhs.uk/' rel='noopener'>Greater Manchester antimicrobial guidance</a>. Related pages: <a href='recurrent-uti.html'>recurrent UTI</a> · <a href='constipation-child.html'>constipation in children</a> · <a href='nocturnal-enuresis.html'>nocturnal enuresis</a> · <a href='../algorithms/fever-children.html'>fever in a child</a>.", src:"NICE NG224 (2022)"}
       ]},
       {b:"why", html:"Referral depends on age, how unwell the child is and whether the episode is atypical. NG224 moves every infant under 3 months straight to paediatric care. For older children with upper UTI it advises considering referral rather than mandating it, so a well, drinking 2-year-old with pyelonephritis can often be treated at home with close review. An abdominal mass is the one finding where the NG12 48-hour pathway sits alongside the UTI pathway, and both should run in parallel."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 14-month-old girl is brought in with a <b>third febrile illness in four months</b>. Today she has a temperature of <b>38.6 °C</b>, is miserable and off her food, with no rash, normal chest and ears, and a soft abdomen. Her mother has brought a <b>wet nappy in a plastic bag</b> and says the last two episodes were \"a virus\" and \"a water infection treated with three days of antibiotics\" — no sample was ever sent and no scan arranged. She opens her bowels hard pellets every third day. Mum is exhausted and asks for \"the same antibiotic as last time\".", src:"NICE NG224 (2022)"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"<b>Declines the nappy sample and explains why</b>, arranging a clean-catch; applies the <b>NG224 dipstick rule for 3 months to under 3 years</b> (leucocytes or nitrite positive → antibiotics and culture) and sends a culture because this may be recurrent; <b>checks the previous episodes were genuinely UTIs</b> before counting them, and knows that a confirmed recurrence triggers ultrasound within 6 weeks and DMSA at 4–6 months at this age; distinguishes upper from lower tract on the fever and any loin tenderness, and picks the duration accordingly; identifies and treats the constipation; <b>does not offer prophylaxis unilaterally</b>; <b>gives an explicit 24–48 hour safety-net with the sepsis signs</b>; acknowledges the mother's exhaustion; and documents the imaging request with a plan to check the result.", src:"NICE NG224 (2022); NICE CG99 (2010)"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named primary source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG224 — Urinary tract infection in under 16s: diagnosis and management (2022)</b><br><a href="https://www.nice.org.uk/guidance/ng224" rel="noopener">nice.org.uk/guidance/ng224</a><span class="rd"> — who to test (fever 38 °C or higher), risk factors, urine collection and handling, the 2022 dipstick strategy by age, culture indications, upper/lower, atypical and recurrent definitions, the imaging table (ultrasound, DMSA at 4–6 months, MCUG), consider referral for upper UTI, no treatment or routine urine follow-up for asymptomatic bacteriuria, no routine retesting, imaging not used routinely to localise UTI (CT and plain films not routine), nephrology criteria</span></li>'+

         '<li><b>NICE NG254 — Suspected sepsis in under 16s: recognition, diagnosis and early management (2025)</b><br><a href="https://www.nice.org.uk/guidance/ng254" rel="noopener">nice.org.uk/guidance/ng254</a><span class="rd"> — sepsis risk features used in the red flags and safety-net</span></li>'+

         '<li><b>NICE NG111 — Pyelonephritis (acute): antimicrobial prescribing (2018)</b><br><a href="https://www.nice.org.uk/guidance/ng111" rel="noopener">nice.org.uk/guidance/ng111</a><span class="rd"> — oral cefalexin or co-amoxiclav for 7–10 days, IV when needed</span></li>'+
         '<li><b>NICE NG112 — Urinary tract infection (recurrent): antimicrobial prescribing (2018)</b><br><a href="https://www.nice.org.uk/guidance/ng112" rel="noopener">nice.org.uk/guidance/ng112</a><span class="rd"> — prophylaxis in recurrent UTI as a specialist-guided decision</span></li>'+
         '<li><b>NICE CG99 — Constipation in children and young people (2010)</b><br><a href="https://www.nice.org.uk/guidance/cg99" rel="noopener">nice.org.uk/guidance/cg99</a></li>'+

         '<li><b>Greater Manchester Medicines Management Group — Greater Manchester antimicrobial guidelines (current local version)</b><br><a href="https://gmmmg.nhs.uk/" rel="noopener">gmmmg.nhs.uk</a><span class="rd"> — local resistance patterns and first- and second-choice agents</span></li>'+
         '<li><b>Working Together to Safeguard Children (HM Government) · local safeguarding procedures</b><span class="rd"> — the safeguarding duty</span></li>'+

     ]}
  ],
  foot:"UTI in children — NICE NG224 (2022), NICE NG143, NICE NG254, NICE NG109, NICE NG111, NICE NG112, NICE CG99, NICE NG12 (updated April 2026) and the BNFC. Under 3 months: immediate paediatric referral; hospital-led treatment must not be delayed, and never an oral prescription alone in primary care. A clean-catch sample, because a contaminated sample cannot diagnose a UTI. From 3 months to under 3 years, use the NG224 dipstick rule. Upper tract 7–10 days, lower tract 3 days. Classify every episode as typical, atypical or recurrent, and document the NG224 imaging plan at the time of diagnosis — DMSA and MCUG are selective; CT and plain films are not routine. Treat the constipation. Verify all doses against the BNFC and the local Greater Manchester antimicrobial guideline for weight, age and renal function before prescribing."
});
