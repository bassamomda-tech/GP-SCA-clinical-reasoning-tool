  lead:"<div class='mg-layers'><a href='#severe'><b>Red flags</b><small>Prostatitis · thyroid · distress</small></a><a href='#define'><b>Define</b><small>ISSM · IELT</small></a><a href='#classify'><b>Subtype</b><small>The four EAU types</small></a><a href='#ladder'><b>Treat</b><small>Behavioural + drug together</small></a></div>",
  quickSub:"If you read nothing else on this page, read these six cards. Every figure traces to the source cited under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Acquired PE: check the thyroid and the prostate BEFORE prescribing", html:"Hyperthyroidism causes PE in up to 50% of affected men, and treating the thyroid alone normalises ejaculatory latency in around 80–83% — a fully reversible cure. Do not prescribe dapoxetine before checking TFTs in acquired PE. Chronic prostatitis / chronic pelvic pain syndrome is present in up to 64% of men with acquired PE — treating the PE without treating the prostatitis leads to treatment failure."},
    {tone:"amber", h:"Screen mood — the suicide risk here is underappreciated", html:"PE causing relationship breakdown, social withdrawal or suicidal thoughts → same-day mental health assessment. PE has high comorbidity with depression and anxiety, and has been associated with significantly elevated rates of suicidal ideation in epidemiological studies — this is underappreciated clinically. <b>Screen every presentation with PHQ-9 and GAD-7.</b>"},
    {tone:"blue", h:"Use the ISSM definition, not the patient's expectations", html:"PE = ejaculation always or nearly always before or within about 1 minute of penetration (lifelong), OR a significant reduction in latency to ≤3 minutes (acquired), AND an inability to delay, AND significant negative consequences. <b>Average IELT is 5.4 minutes.</b> Men with subjective PE (normal IELT of 3–5 minutes plus anxiety) do dramatically better with psychosexual therapy than dapoxetine — getting the subtype right prevents inappropriate prescribing and medicalising normal variation."},
    {tone:"green", h:"Two surgically curable causes you find by looking", html:"Phimosis and frenulum breve cause penile hypersensitivity and are surgically correctable — preputioplasty or frenuloplasty resolves the PE. Missing them means prescribing lifelong medication for a curable condition. Frenuloplasty is a minor day-case procedure under local anaesthetic with extremely high satisfaction rates. <b>A normal, matter-of-fact genital examination is itself therapeutic</b> — many men presenting with PE have significant genital anxiety."},
    {tone:"purple", h:"Dapoxetine: the numbers, and the first-dose rule", html:"Dapoxetine 30 mg 1–3 hours before intercourse, licensed for men 18–64, short-acting (t½ 1.3 h), max once daily; escalate to 60 mg if 30 mg is inadequate after 4 uses. It raises mean IELT from 0.9 to 2.8 minutes (30 mg) or 3.1 minutes (60 mg) — about 3×. Orthostatic syncope occurred in 0.2% in trials, mostly on first use, in heat, or with alcohol — take the first dose sitting down and observe for 2 hours; avoid alcohol. Contraindicated with MAOIs, other SSRIs/SNRIs, cardiac disease or prolonged QTc, syncope history, moderate–severe hepatic impairment, and outside 18–64."},
    {tone:"teal", h:"Behavioural work is not the soft option — and treatment should have an end-point", html:"Pelvic floor muscle training achieved a 61–64% cure rate at 12 weeks in RCT (Pastore 2014) — comparable to dapoxetine without drug cost or side effects — by letting voluntary puborectalis and bulbocavernosus contraction inhibit the ejaculatory reflex. Partner-involved treatment achieves 3× better outcomes than individual treatment. After 6–12 months of success, trial a drug holiday while maintaining the techniques — many men do not need lifelong pharmacotherapy."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step is where the curable causes hide.",
  pathway:[
    {title:"Screen the red flags", html:"New-onset PE + LUTS (frequency, urgency, dysuria, perineal or pelvic pain) → urgent urology for chronic prostatitis/CPPS. Suicidal ideation or severe depression → same-day mental health. New neurological symptoms (paraesthesia, weakness, spasticity) → neurology (MS, cord pathology). Hyperthyroid features → TFTs and treat the thyroid first. Post-prostatectomy, bladder surgery or pelvic radiotherapy → urology. Coercive control or partner pressure → safe enquiry. PE + ED together → investigate both (higher likelihood of organic cause). Review the drug history — tramadol, antipsychotics, opioid withdrawal.", alert:true},
    {title:"Confirm with the ISSM definition", html:"Ask the IELT question directly (“how long from penetration to ejaculation?”), and require all three limbs: short latency, inability to delay, and significant negative consequences. Normalise the consultation first — PE affects 20–30% of men at some point, and the consultation itself is therapeutic. Always ask about the partner's perspective."},
    {title:"Classify into one of four subtypes", html:"Lifelong (from first intercourse, IELT &lt;1 min, neurobiological) → dapoxetine or a daily SSRI with behavioural adjunct. Acquired (normal then new) → treat the underlying cause FIRST. Natural variable (inconsistent, situational — not a disorder) → reassurance and psychoeducation, no drug. Subjective (normal IELT, anxiety-driven) → psychosexual therapy first-line. Co-existing ED → treat the ED first. Screen PHQ-9 and GAD-7 in all."},
    {title:"Examine and investigate — targeted, not routine", html:"Acquired PE or suspected organic cause: BMI, BP, thyroid signs, gynaecomastia; genital examination for phimosis, frenulum breve, hypospadias, Peyronie's; DRE if acquired PE with LUTS (consider in all men over 45); bulbocavernosus reflex and perineal sensation; testicular size. Investigations by indication: TFTs, HbA1c, morning testosterone + LH, MSU MC&amp;S, PSA. Classic lifelong PE under 45 with a normal examination needs no investigations."},
    {title:"Treat both dimensions, then review with an end-point", html:"Combined pharmacological + behavioural treatment beats either alone (EAU 2024). Review at 4 weeks and 3 months; re-screen PHQ-9/GAD-7; taper paroxetine over 4–6 weeks if stopping; trial a drug holiday at 6–12 months."}
  ],
  sections:[
    {id:"severe", nav:"Red flags", title:"Red flags — underlying medical causes and psychological crisis", sub:"PE is usually lifelong or psychological, but new-onset or acquired PE may signal prostatitis, neurological disease or significant psychological distress.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 New-onset PE + lower urinary tract symptoms", html:"Frequency, urgency, dysuria, perineal pain, pelvic discomfort → same-day or urgent urology: chronic prostatitis / chronic pelvic pain syndrome causes acquired PE."},
         {tone:"red", h:"🔴 Suicidal ideation / severe depression", html:"PE causing significant relationship breakdown, social withdrawal or suicidal thoughts → same-day mental health assessment. PE has high comorbidity with depression and anxiety."},
         {tone:"amber", h:"🟠 New neurological symptoms", html:"PE acquired after neurological symptoms (paraesthesia, weakness, spasticity) → neurological assessment: multiple sclerosis or spinal cord pathology disrupts ejaculatory control."},
         {tone:"amber", h:"🟠 Thyroid symptoms", html:"New PE + hyperthyroid features (tremor, palpitations, weight loss, heat intolerance) → TFTs. Hyperthyroidism causes PE in up to 50% of affected men — treat the thyroid first."},
         {tone:"amber", h:"🟠 Post-pelvic surgery", html:"PE following prostatectomy, bladder surgery or pelvic radiotherapy → urology. Post-surgical ejaculatory dysfunction is distinct from primary PE."},
         {tone:"amber", h:"🟠 Relationship or domestic abuse", html:"PE presenting in the context of coercive control or partner pressure → safe enquiry. Sexual dysfunction can be a manifestation of intimate partner violence dynamics."},
         {tone:"amber", h:"🟠 Concurrent erectile dysfunction", html:"PE + ED together may indicate cardiovascular disease, diabetes or hypogonadism → investigate both simultaneously. ED + PE means a higher likelihood of an organic cause. See the <a href='erectile-dysfunction.html'>ED protocol</a>."},
         {tone:"plain", h:"💊 Drug-related PE", html:"Check whether PE onset coincided with medication changes: tramadol (which causes delayed ejaculation — sometimes used therapeutically), antipsychotics, opioid withdrawal. Review the full drug history."}
       ]},
       {b:"why", html:"CP/CPPS is present in up to 64% of men with acquired PE — treating PE without treating the prostatitis leads to treatment failure. Hyperthyroidism-induced PE resolves in 80% of cases with thyroid treatment alone — prescribing dapoxetine or an SSRI without TFTs wastes resources and delays cure. Acquired PE is a more specific indicator of organic disease than lifelong PE. Depression screening is mandatory."}
     ]},

    {id:"define", nav:"Define", title:"Confirm and characterise — the ISSM definition", sub:"Set the patient at ease and normalise the consultation before taking the history. Use the ISSM criteria rather than the patient's expectations.",
     blocks:[
       {b:"table", head:["Element","Detail","Why"], rows:[
         ["<b>ISSM definition</b>","Ejaculation that always or nearly always occurs before or within approximately 1 minute of vaginal penetration (lifelong PE), OR a significant reduction in latency time to ≤3 minutes (acquired PE), AND an inability to delay, AND significant negative consequences (distress, bother, frustration, avoidance of sexual intimacy)","All three limbs are required — short latency alone is not the diagnosis"],
         ["<b>IELT</b>","Ask: “How long from penetration to ejaculation?” Average IELT is 5.4 minutes. PE threshold ≤1 min (lifelong) or ≤3 min (acquired). Stop-watch recording is optional and rarely practical","The 1-minute threshold is the only criterion with strong epidemiological evidence (95th centile)"],
         ["<b>Lifelong (primary) PE</b>","Present from the first sexual encounter, with every partner and on every occasion. Likely neurobiological (serotonin receptor sensitivity, penile glans hypersensitivity)","<b>Responds well to pharmacological treatment</b>"],
         ["<b>Acquired (secondary) PE</b>","Normal ejaculatory control previously, then new onset. Triggers: prostatitis, relationship factors, ED, hyperthyroidism, psychological factors","<b>Investigate for an organic cause first</b>"],
         ["<b>Natural variable PE</b>","Occasional PE in certain situations (stress, new partner, after abstinence)","Not a disorder — reassurance ± behavioural techniques; no pharmacological treatment indicated"],
         ["<b>Subjective PE</b>","Normal IELT (3–5 min) but the patient perceives PE — often anxiety, unrealistic (pornography-influenced) expectations, or relationship issues","<b>Psychosexual therapy first-line</b>"],
         ["<b>Partner impact</b>","Always ask about the partner's perspective where applicable — relationship distress, partner anorgasmia, intimacy avoidance","<b>Partner involvement in treatment improves outcomes significantly</b>"]
       ]},
       {b:"why", html:"The ISSM 2014 evidence-based definition matters because PE is over-diagnosed in men with normal IELT but performance anxiety — treating normal IELT pharmacologically risks medicalising normal variation and creating drug dependence. The consultation itself is therapeutic: normalising PE (it affects 20–30% of men at some point) reduces shame and improves treatment engagement."}
     ]},

    {id:"classify", nav:"Subtype", title:"Classify the subtype — it drives treatment selection", sub:"The EAU 2024 guidelines classify PE into four subtypes, each needing a different primary treatment strategy.",
     blocks:[
       {b:"table", head:["Subtype","Features","Primary treatment"], rows:[
         ["<b>Lifelong PE</b>","From first intercourse, IELT &lt;1 min, always with every partner. Neurobiological basis (serotonergic hypofunction, penile hypersensitivity)","<b>Dapoxetine or a daily SSRI, with behavioural techniques as adjunct</b>"],
         ["<b>Acquired PE</b>","Normal history then PE develops. Triggers: CP/CPPS, ED, hyperthyroidism, relationship or psychological factors","Treat the underlying cause FIRST, then add dapoxetine if PE is residual"],
         ["<b>Natural variable PE</b>","<b>Inconsistent and situational — normal variation</b>","Reassurance + psychoeducation. Avoid pharmacological treatment — there is no disorder requiring medication"],
         ["<b>Subjective PE</b>","Normal IELT but perceived as PE; anxiety and unrealistic expectations drive it","Psychosexual therapy first-line; no drug unless a severe anxiety component warrants an SSRI"],
         ["<b>Co-existing ED</b>","<b>Anxiety about losing the erection often drives rapid ejaculation</b>","Treat the ED first with a PDE5 inhibitor — when the ED is treated the PE may resolve; add dapoxetine only if PE persists"],
         ["<b>Psychological assessment</b>","Screen with PHQ-9 (depression) and GAD-7 (anxiety) in ALL presentations","Treating comorbid depression or anxiety improves PE outcomes and wellbeing"]
       ]},
       {b:"why", html:"Treating acquired PE without addressing the underlying cause is ineffective in most cases. Chronic prostatitis causing acquired PE may need alpha-blocker therapy (tamsulosin 400 mcg OD) alongside antibiotics for Category II, or alpha-blockers plus physiotherapy for Category III — and the PE often resolves. Treating PE with dapoxetine when the real cause is performance anxiety from ED will fail until the ED is treated. The most efficient use of a 10-minute appointment is establishing the subtype and booking follow-up or a psychosexual referral, rather than prescribing dapoxetine to everyone."}
     ]},

    {id:"exam", nav:"Examination", title:"Targeted examination", sub:"Not always required for clear lifelong PE, but essential for acquired PE and whenever an organic cause is suspected.",
     blocks:[
       {b:"table", head:["What","Look for","Means"], rows:[
         ["<b>General</b>","BMI, BP (shared cardiovascular risk with ED); thyroid signs (tremor, goitre, tachycardia, exophthalmos); gynaecomastia","<b>Hyperthyroidism causes PE; gynaecomastia suggests hypogonadism</b>"],
         ["<b>Genital</b>","Phimosis (tight foreskin — penile hypersensitivity), frenulum breve (pain and hypersensitivity on erection), hypospadias, Peyronie's disease (penile plaques)","Phimosis and frenulum breve are surgically correctable causes — preputioplasty or frenuloplasty resolves the PE"],
         ["<b>Prostate</b>","DRE if acquired PE + LUTS — tenderness suggests prostatitis, enlargement BPH. Consider in all men over 45 (&gt;45) with acquired PE and urinary symptoms","Exquisite prostate tenderness changes management completely — ciprofloxacin 500 mg BD for 4 weeks (Category II) rather than dapoxetine"],
         ["<b>Neurological</b>","Bulbocavernosus reflex (S2–4 integrity — squeeze the glans and feel for anal sphincter contraction); perineal sensation","<b>Abnormal → neurology referral</b>"],
         ["<b>Secondary sexual characteristics</b>","Testicular size (small testes suggest hypogonadism), body hair distribution, voice","Relevant with concurrent ED or low libido"],
         ["<b>When it can be omitted</b>","Clear lifelong PE, no red flags: genital examination is optional but reassures and excludes anatomical causes — omit if the patient prefers and the history is classic","A normal, matter-of-fact examination reduces genital anxiety significantly"]
       ]}
     ]},

    {id:"workup", nav:"Work-up", title:"Investigations — targeted, not routine", sub:"Lifelong PE with no red flags needs minimal investigation. Acquired PE or concurrent ED needs a targeted panel.",
     blocks:[
       {b:"table", head:["Test","When","Interpretation"], rows:[
         ["<b>TFTs</b>","<b>All acquired PE</b>","Hyperthyroidism is present in 50% of acquired PE. Suppressed TSH + raised fT4 → treat the thyroid first. Do NOT prescribe dapoxetine before checking TFTs in acquired PE"],
         ["<b>Fasting glucose / HbA1c</b>","<b>Concurrent ED, obesity or risk factors</b>","Diabetes causes autonomic neuropathy and ejaculatory dysfunction — the PE may improve on treating it"],
         ["<b>Testosterone + LH</b>","<b>Low libido + PE + ED</b>","Morning testosterone (7–10 am — diurnal variation is significant, an afternoon sample may be falsely low); low is &lt;8 nmol/L; LH distinguishes primary from secondary hypogonadism"],
         ["<b>Urine MC&amp;S ± PSA</b>","<b>Suspected prostatitis; PSA if over 50 (&gt;50) with LUTS</b>","Bacteriuria in Category II prostatitis. Prostate cancer can cause ejaculatory dysfunction — discuss the pros and cons of PSA before testing"],
         ["<b>Nocturnal penile tumescence</b>","<b>Not a primary-care investigation</b>","Differentiates psychogenic from organic ED in secondary care"],
         ["<b>When NOT to investigate</b>","<b>Classic lifelong PE, no red flags, normal examination, under 45</b>","No investigations required — start treatment and review. Over-investigation delays treatment and increases anxiety"]
       ]},
       {b:"cards", items:[
         {tone:"purple", h:"NG12 criteria that surface here <span class='tw'>2WW</span>", html:"Premature ejaculation has no NICE NG12 criterion of its own, and this page does not invent one. Two NG12 routes can arise from the examination and work-up and must be acted on if they do:<br>• A prostate that feels malignant on DRE, or a PSA above the age-specific reference range → 2-week-wait suspected prostate cancer referral. The DRE and PSA offered here for prostatitis and LUTS are the same examination that finds this.<br>• A testicular nodule or non-transilluminating mass found on genital examination → 2-week-wait testicular cancer pathway (with direct-access ultrasound where the pathway specifies it).<br>Haematospermia with perineal pain is an urgent-urology, not a routine, presentation.", src:"NICE NG12 (updated May 2025) · house rule"}
       ]},
       {b:"why", html:"A systematic review found that treating hyperthyroidism normalised ejaculatory latency in 83% of men without any PE-specific treatment — a fully reversible cure, where prescribing dapoxetine instead means lifelong medication for a treatable condition. Testosterone deficiency rarely causes PE in isolation but frequently causes ED and reduced libido, producing rapid ejaculation through anxiety about losing the erection."}
     ]},

    {id:"ladder", nav:"Treat", title:"The treatment ladder — pharmacological and behavioural", sub:"EAU 2024: combined pharmacological + behavioural treatment is more effective than either alone. Address both dimensions. Verify doses in the BNF.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Step 1", title:"Psychoeducation + behavioural techniques", when:"all subtypes, first-line", fromLabel:"prescribe it as concretely as a drug",
          html:"Stop–start technique (Semans) or squeeze technique (Masters &amp; Johnson) — practise alone first, then with the partner; takes 4–8 weeks to show benefit. Pelvic floor (Kegel) exercises improve voluntary ejaculatory control. NNT ~3 for the combined techniques."},
         {step:"Step 2", title:"Dapoxetine 30 mg on demand", when:"first-line pharmacological", fromLabel:"1–3 hours before intercourse",
          html:"Licensed for PE in men 18–64 (not &lt;18 or &gt;65); short-acting SSRI (t½ 1.3 h); increases IELT 2–3× from baseline; maximum once daily. Escalate 30 mg → 60 mg if the response is inadequate after 4 uses. Contraindications: MAOIs (within 14 days), concurrent SSRIs/SNRIs (serotonin syndrome), significant cardiac disease or prolonged QTc, a history of syncope or orthostatic hypotension, moderate–severe hepatic impairment, and age under 18 (&lt;18) or over 65 (&gt;65)."},
         {step:"Step 3", title:"Topical anaesthetic — EMLA cream or Fortacin spray", when:"penile hypersensitivity", fromLabel:"can combine with dapoxetine",
          html:"EMLA (lidocaine/prilocaine) 2.5 g applied to the glans 20 minutes before intercourse, then wiped off. Fortacin (lidocaine 150 mg/mL, licensed for PE): 3 actuations to the glans, wait 5 minutes, wipe. Apply a condom to prevent partner anaesthesia. Reduces glans hypersensitivity; Fortacin offers more consistent dosing than EMLA and is preferred by many patients for convenience."},
         {step:"Step 4", title:"Daily SSRI (off-label) — paroxetine has the most evidence", when:"very short IELT, or on-demand inadequate", fromLabel:"most effective pharmacologically",
          html:"Paroxetine 10–40 mg OD (start 10 mg, increase to 20–40 mg): effect at 1–2 weeks, maximal at 3–4 weeks, IELT increase 6–10× from baseline. Alternatives: sertraline 50 mg up to 50–200 mg OD, fluoxetine 20–40 mg OD, or paroxetine 20 mg OD as a common maintenance dose. Warn about the 2–3-week latency, discontinuation syndrome (especially paroxetine) and sexual side effects."},
         {step:"Step 5", title:"Combination therapy", when:"refractory", fromLabel:"different mechanisms are additive",
          html:"Daily SSRI + on-demand dapoxetine — use cautiously because of serotonin syndrome risk when combining two SSRIs, though dapoxetine + paroxetine is commonly used in practice with monitoring. Add psychosexual therapy to any pharmacological regimen. Add a PDE5 inhibitor (sildenafil, tadalafil) if there is concurrent ED."}
       ]},
       {b:"warn", html:"Counsel on SSRI side effects (nausea, dizziness, mood and sexual effects) and the small early suicidality risk in younger men. Topical anaesthetic can numb the partner — use with a condom and wipe off before penetration. <b>Never stop paroxetine abruptly.</b>"},
       {b:"why", html:"Dapoxetine raises mean IELT from 0.9 to 2.8 minutes (30 mg) and 3.1 minutes (60 mg) in RCTs — roughly 3× — but patient-reported satisfaction is highest when behavioural techniques are added. Daily paroxetine increases IELT 6–10× (0.9 → 6–9 minutes): superior pharmacological efficacy, but daily dosing and discontinuation-syndrome risk. Dapoxetine + topical anaesthetic is additive through different mechanisms — central serotonergic delay plus a peripheral sensory threshold increase."},
       {b:"say", html:"This is common — it affects a fifth to a third of men at some point — and it is treatable. Simple techniques and a numbing cream help many men, there's a tablet you take only when you need it, and if it started recently we'll check there isn't a cause behind it that we can cure outright."}
     ]},

    {id:"lifestyle", nav:"Behavioural", title:"Behavioural techniques, psychological strategies and lifestyle", sub:"First-line for all subtypes, and prescribed as concretely as medication. Written resources or reputable online signposting aids adherence.",
     blocks:[
       {b:"table", head:["Technique","How","Evidence / note"], rows:[
         ["<b>Stop–start (Semans)</b>","Stimulate to the point of near-ejaculation, pause until the sensation reduces, restart — repeat 3 times before ejaculating. Practise alone for 2 weeks, then with the partner","Teaches recognition and control of the point of ejaculatory inevitability"],
         ["<b>Squeeze technique</b>","The partner applies firm pressure to the frenulum or glans for 10–20 seconds at the point of near-ejaculation until the urge passes; same progression as stop–start","<b>Partner involvement significantly improves outcomes</b>"],
         ["<b>Pelvic floor exercises</b>","Identify the PC muscle (the one used to stop urinating midstream); contract 3 seconds, relax 3 seconds; 3 sets of 10, three times daily. Results in 4–8 weeks. Free NHS pelvic floor leaflet","61–64% cure rate at 12 weeks in RCT — comparable to dapoxetine without drug cost or side effects"],
         ["<b>Mindfulness and sensate focus</b>","Sensate focus (Masters &amp; Johnson): gradual reintroduction of physical intimacy without performance pressure; refer to a psychosexual therapist for structured delivery","<b>Reduces anticipatory anxiety — the commonest PE amplifier</b>"],
         ["<b>Masturbation before intercourse</b>","1–2 hours before anticipated intercourse — exploits the refractory period to reduce sensitivity and extend latency","Practical, accessible, effective for mild cases"],
         ["<b>Condom use</b>","Thicker condoms reduce penile sensitivity by 20–30%; combines well with dapoxetine or EMLA","Practical, cheap, no side effects"],
         ["<b>Anxiety management</b>","CBT, especially cognitive restructuring of catastrophic beliefs about PE; exercise reduces cortisol and anxiety; sleep hygiene; address alcohol use","PE is self-reinforcing via performance anxiety. Alcohol is misunderstood: acute intoxication may delay ejaculation, but chronic use damages pudendal nerve function and worsens PE long-term"],
         ["<b>Partner communication</b>","Open discussion reduces shame and improves intimacy; partners often feel responsible, so psychoeducate both. Focus on non-penetrative intimacy to reduce performance pressure. NHS relationship therapy available via GP referral","Partner-involved treatment achieves 3× better outcomes than individual treatment — routinely include the partner or give them written information"]
       ]},
       {b:"why", html:"Masters &amp; Johnson (1970) reported 97% success with stop–start/squeeze plus psychosexual therapy, though modern long-term follow-up is less impressive (75% relapse at 3 years without maintenance). Pelvic floor training (Pastore et al., 2014 RCT) achieved a 64% cure rate at 12 weeks — the mechanism being that voluntary contraction of puborectalis and bulbocavernosus inhibits the autonomic ejaculatory reflex."}
     ]},

    {id:"monitor", nav:"Monitor", title:"Follow-up, monitoring and safety-netting", sub:"PE is a chronic condition for most men — but treatment should have a planned end-point, not default to lifelong prescribing.",
     blocks:[
       {b:"table", head:["When","What","Action"], rows:[
         ["<b>4 weeks</b>","Dapoxetine response: adequate (IELT improved and satisfied) → continue and review in 3 months. Inadequate → escalate to 60 mg, add a topical, or consider a daily SSRI. Review side effects: nausea, dizziness, diarrhoea, insomnia — common with dapoxetine, usually mild","Combine modalities rather than switching repeatedly"],
         ["<b>3 months</b>","Full review: IELT, patient satisfaction, partner satisfaction, psychological wellbeing, adherence to behavioural techniques. Re-screen PHQ-9 and GAD-7","<b>Consider dose reduction or a holiday if the response is good</b>"],
         ["<b>6 months</b>","If on a daily SSRI, review the need and consider trial withdrawal — taper paroxetine over 4 weeks, never stop abruptly. If acquired PE, re-assess the treated organic cause","Paroxetine discontinuation syndrome is one of the most distressing SSRI withdrawals — “brain zaps”, severe nausea, extreme anxiety, nightmares. Tapering over 4–6 weeks prevents it"],
         ["<b>Dapoxetine monitoring</b>","Syncope risk: take the first dose sitting down and monitor for 2 hours. Avoid with antihypertensives (additive hypotension) and avoid alcohol (syncope, nausea)","Orthostatic syncope occurred in 0.2% in trials — mostly first use, hot environments, or after alcohol. The first-dose rule prevents a dangerous fall"],
         ["<b>Treatment holiday</b>","After 6–12 months of successful treatment, trial a drug holiday while maintaining the behavioural techniques","Many men do not require lifelong pharmacotherapy — review if relapse occurs"],
         ["<b>Annual review</b>","For men on long-term dapoxetine or a daily SSRI: reassess the diagnosis and the need for treatment; screen for new organic causes if acquired PE returns","Also confirm coexisting ED remains treated and optimised"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"📞 Same-day", html:"Syncope after a dapoxetine dose · signs of serotonin syndrome (fever, myoclonus, agitation, tachycardia) if on other serotonergic drugs · worsening depression or suicidal ideation."},
         {tone:"cream", h:"💬 Safety-net scripts", html:"“Tell us if the tablet causes low mood, agitation or persistent sexual side effects — we can adjust.” “Use the numbing cream with a condom so it doesn't affect your partner.” “If this is causing significant distress or relationship difficulty, we can refer for couples or psychosexual support.” “If this is new, there may be a treatable cause — worth checking erections and thyroid.”"}
       ]},
       {b:"why", html:"Many men can successfully discontinue pharmacotherapy after mastering the behavioural techniques — treatment should have a clear end-point in the management plan. Men who achieve good control often find the confidence improvement generalises to reduced anxiety, better relationships and enhanced sexual satisfaction for both partners — the benefit extends well beyond IELT."}
     ]},

    {id:"loop", nav:"Not responding?", title:"Not responding? Re-check before referring", sub:"Reconsider the cause and combine modalities first.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"1 · ED treated?", html:"<b>Is coexisting erectile dysfunction optimised first?</b>"},
         {tone:"amber", h:"2 · Combine", html:"<b>Behavioural + topical + SSRI together often outperform any one alone.</b>"},
         {tone:"amber", h:"3 · Adherence and technique", html:"Are the behavioural techniques actually being practised, and the drug used correctly (timing, dose, not with alcohol)?"},
         {tone:"amber", h:"4 · Organic cause", html:"Acquired PE — were TFTs, prostatitis and drug causes fully excluded and treated?"},
         {tone:"amber", h:"5 · Psychological", html:"<b>Anxiety or relationship factors → psychosexual therapy.</b>"},
         {tone:"amber", h:"6 · Refer", html:"<b>Refractory or complex after 6 months → specialist.</b>"}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral criteria", sub:"Most PE can be managed entirely in primary care.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same-day mental health", html:"Suicidal ideation secondary to PE-related distress · severe depression requiring urgent psychiatric input · domestic or relationship crisis."},
         {tone:"red", h:"Urgent urology", html:"Suspected prostatitis with haematospermia or systemic sepsis · suspected anatomical abnormality requiring surgery (severe phimosis, frenulum breve) · PE after pelvic surgery or radiotherapy."},
         {tone:"amber", h:"Psychosexual therapy", html:"Subjective PE (normal IELT) → first-line referral · significant relationship or partner issues · treatment failure after 6 months of pharmacological treatment · patient preference · natural variable PE wanting behavioural techniques."},
         {tone:"blue", h:"Routine urology", html:"Acquired PE failing primary-care treatment · suspected CP/CPPS unresponsive to antibiotics · PE + ED together unresponsive to a PDE5 inhibitor."},
         {tone:"green", h:"Primary care manages", html:"Lifelong PE, acquired PE with no organic cause found, and subjective PE with mild anxiety — start treatment in primary care and review at 4 weeks and 3 months."}
       ]},
       {b:"why", html:"NHS psychosexual therapy waiting times exceed 6 months in some areas — where they are long, starting dapoxetine as a bridge is appropriate and improves compliance with psychotherapy, because reduced anxiety allows better engagement. Private psychosexual therapy (therapists registered with COSRT or UKCP) is faster and worth signposting; Relate and Relationships Scotland provide couples therapy with psychosexual elements. Frenuloplasty under local anaesthetic is a minor day-case procedure with extremely high satisfaction rates for PE secondary to frenulum breve."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 39-year-old man, embarrassed, says he now “finishes in under a minute” — it was never a problem until about eight months ago. He has lost half a stone without trying, feels hot and shaky, and has been getting up twice a night to pass urine with some perineal aching. His relationship is strained and he says he has “stopped bothering with any of it”."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Establishes this is <b>acquired, not lifelong, PE</b> and therefore hunts a cause rather than prescribing; picks up the <b>hyperthyroid cluster and checks TFTs before any dapoxetine</b>, knowing thyroid treatment alone cures ~80%; takes the <b>LUTS and perineal pain seriously as possible CP/CPPS</b> with DRE and MSU; <b>screens mood with PHQ-9/GAD-7</b> and asks directly about hopelessness given the withdrawal; normalises PE (20–30% of men) to reduce shame; explains that <b>behavioural work plus a drug beats either alone</b>; and safety-nets <b>haematospermia and worsening mood</b>."}
     ]}]},
