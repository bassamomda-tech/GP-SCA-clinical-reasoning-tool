  stemSub:"One page for the whole presentation: screen first for the four emergencies (paraphimosis, ischaemic priapism, penile fracture and Fournier's gangrene) and for penile cancer, then classify by foreskin, glans and structural disorder. The condition most worth getting right is lichen sclerosus — repeatedly misdiagnosed as recurrent candidal balanitis, treated with antifungals for years, and progressing to scarring, phimosis and meatal stenosis, with an increased risk of penile intraepithelial neoplasia and squamous cell carcinoma, when early topical corticosteroid treatment and review could have changed its course.",

  quickSub:"If you read nothing else on this page, read these six cards. Every number traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"\u26a0 Examine, test, and refer the persistent lesion", html:"Any unexplained, persistent, ulcerated, indurated, bleeding or warty penile lesion requires prompt examination and a clear follow-up or referral plan. <b>Do not repeatedly treat a persistent lesion as infection without reconsidering the diagnosis and excluding malignancy.</b> Refer a clinically suspicious lesion without waiting; review a lesion thought likely infective after treatment and refer if it persists \u2014 consider a suspected cancer pathway referral in accordance with NICE NG12 (in England this is generally the two-week-wait pathway). Risk factors: phimosis with retained smegma, HPV-16/18, lichen sclerosus, smoking, lack of circumcision, immunosuppression. Palpate and document both groins in any patient with a suspicious penile lesion."},
    {tone:"red", h:"Pain disproportionate to the skin is Fournier's gangrene", html:"Rapidly spreading scrotal, perineal or penile redness with severe pain out of proportion to the findings, crepitus, fever and systemic illness \u2192 a surgical emergency: arrange immediate emergency transfer, and do not delay transfer for imaging or outpatient investigations. Urgent surgical debridement is the primary treatment. <b>Stop an SGLT2 inhibitor if Fournier's gangrene is suspected.</b> Early skin appearance is deceptively mild; crepitus is a late sign and must not be awaited."},
    {tone:"amber", h:"Lichen sclerosus is the condition to stop missing", html:"White, atrophic, shiny plaques on the glans and inner foreskin, often with a white ring at the preputial orifice. Frequently misdiagnosed as recurrent candidal balanitis and treated with antifungals for months or years, while it progresses to scarring, phimosis and meatal stenosis. It is associated with an increased risk of PeIN and squamous cell carcinoma; published estimates vary. <b>Clobetasol 0.05% ointment often improves inflammation and symptoms, but may not reverse established scarring, phimosis or meatal stenosis \u2014 review response and refer if uncertain or not responding.</b>"},
    {tone:"blue", h:"Four emergencies, four clocks", html:"<b>Paraphimosis</b> \u2014 urgent same-day urology; reduction only by a trained clinician; delay worsens oedema and risks glans ischaemia. <b>Ischaemic priapism</b> \u2014 a painful erection lasting 4 hours or more needs <b>immediate emergency/urology assessment</b>; specialist treatment within <b>4\u20136 hours</b> preserves erectile function. <b>Penile fracture</b> \u2014 surgical repair <b>within 24 hours</b>. <b>Fournier's</b> \u2014 immediate debridement. Every hour of delay in priapism increases the risk of permanent erectile dysfunction."},
    {tone:"amber", h:"A painless penile ulcer needs urgent syphilis testing", html:"Primary syphilis is a single painless ulcer with a clean base, indurated edges and non-tender inguinal lymphadenopathy \u2014 unlike HSV, which is extremely painful. <b>It heals spontaneously in 3\u20136 weeks untreated, then progresses.</b> UK incidence has risen sharply since 2010: UKHSA recorded 9,535 early-stage syphilis diagnoses in England in 2024. A painless penile ulcer should prompt urgent syphilis testing and a full STI assessment (serology via the local laboratory algorithm; lesion PCR where available), while keeping a differential that includes HSV, trauma, fixed drug eruption, Behçet disease, inflammatory dermatoses, PeIN and SCC. Refer suspected syphilis to GUM."},
    {tone:"green", h:"Document the examination and your reasoning", html:"Record whether the foreskin was retracted, describe the lesion (size, colour, morphology, induration), state whether inguinal nodes were palpated, and record the suspected cancer referral decision with reasoning if not referred. Document the examination and clinical reasoning clearly, particularly if referral is not made."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step comes before any treatment.",
  pathway:[
    {title:"Screen for cancer and the four emergencies", html:"Penile mass or ulcerated/indurated lesion (STI excluded), or a lesion persisting after STI treatment \u2192 consider suspected cancer pathway referral (NICE NG12). Fournier's gangrene, ischaemic priapism, penile fracture \u2192 immediate emergency transfer. Paraphimosis \u2192 urgent same-day urology.", alert:true},
    {title:"Classify by site", html:"Foreskin (phimosis, paraphimosis, posthitis) \u00b7 glans and skin (balanitis, lichen sclerosus, erythroplasia of Queyrat, lichen planus) \u00b7 structural (Peyronie's) \u00b7 infective (HSV, syphilis, gonorrhoea, chlamydia, warts)."},
    {title:"Examine properly and swab", html:"With consent and a chaperone where appropriate, retract the foreskin only if safe and possible — never forcibly; examine foreskin, glans, coronal sulcus, frenulum, meatus, shaft, scrotum and both groins. <b>Targeted tests: STI screen, syphilis serology, HSV NAAT/PCR, subpreputial swab, HbA1c, HIV test as indicated; biopsy or specialist assessment if uncertain.</b>"},
    {title:"Treat by diagnosis", html:"Balanitis \u2192 manage per the BASHH balanoposthitis guideline (clotrimazole for suspected candidal balanitis; assess the cause). BXO \u2192 topical corticosteroid per the BASHH/local regimen with review. Peyronie's \u2192 analgesia and referral by functional and psychological impact. STI \u2192 GUM."},
    {title:"Review, safety-net, document", html:"Individualised review for BXO with education about recurrence and malignant-change symptoms; any suspicious, unexplained or persistent lesion \u2192 refer rather than re-treat. Document the examination and clinical reasoning."}
  ],
  sections:[

    {id:"severe", nav:"Emergencies", title:"Red flags — penile cancer, Fournier's gangrene, priapism and fracture",
     sub:"Examine every lesion properly; refer any suspicious, unexplained or persistent lesion. Four separate urological emergencies also present here.",
     blocks:[
       {b:"table", head:["Presentation","Diagnosis","Action"], rows:[
         ["Penile mass or ulcerated lesion where STI has been excluded, or a persistent lesion after STI treatment; any unexplained persistent, indurated, bleeding or warty lesion","<b>Possible penile squamous cell carcinoma or PeIN.</b> Risk factors: phimosis (retained smegma), HPV-16/18, lichen sclerosus, smoking, lack of circumcision, immunosuppression","<b>Consider a suspected cancer pathway referral (NICE NG12; in England generally the two-week-wait pathway)</b>. Palpate and document both groins"],
         ["Rapidly spreading scrotal, perineal or penile redness + severe pain disproportionate to findings + crepitus + fever + systemic illness","<b>Fournier's gangrene</b> (necrotising fasciitis of the genitalia and perineum). A surgical emergency","Arrange immediate emergency transfer; do not delay for imaging or outpatient investigations. Stop an SGLT2 inhibitor. Hospital teams start broad-spectrum IV antibiotics and urgent surgical debridement according to local protocol"],
         ["Painful erection lasting 4 hours or more unrelated to sexual stimulation","<b>Ischaemic priapism until proven otherwise</b> \u2014 compartment syndrome of the corpus cavernosum","Arrange immediate emergency/urology assessment; do not delay transfer for imaging. The receiving urology team decides on aspiration, washout, intracavernosal phenylephrine or surgery. Every hour of delay increases the risk of permanent erectile dysfunction"],
         ["Severe pain, tenderness, erythema or swelling of the genital or perineal area, with fever or malaise, in an SGLT2 inhibitor user (dapagliflozin, empagliflozin, canagliflozin, ertugliflozin)","<b>Suspected Fournier's gangrene associated with SGLT2 inhibitors</b> \u2014 rare but documented (MHRA Drug Safety Update)","Stop the SGLT2 inhibitor and arrange immediate emergency transfer for urgent treatment"],
         ["Sudden audible \u201ccrack\u201d during sexual activity + immediate loss of erection + rapid penile haematoma + \u201ceggplant deformity\u201d","<b>Penile fracture</b> \u2014 rupture of the tunica albuginea","999 or immediate urology. Surgical repair within 24 h reduces the risk of permanent penile deformity and ED"],
         ["Non-reducible foreskin retracted behind the glans + oedematous glans + pain","<b>Paraphimosis</b> \u2014 an urgent urological condition","Urgent same-day urological assessment. Emergency transfer if systemically unwell, the glans is discoloured or ischaemic, pain is severe, or urgent transfer cannot otherwise be achieved. Reduction only by a clinician trained and competent in it; dorsal slit or circumcision if reduction fails"]
       ]},
       {b:"why", html:"Fournier's gangrene is one of the most rapidly fatal infections in clinical medicine \u2014 a synergistic polymicrobial necrotising fasciitis (predominantly anaerobes plus gram-negative aerobes) of the genitalia, perineum and perianal region, and <b>a surgical emergency</b>. The critical diagnostic challenge is that the external appearance in early Fournier's is deceptively mild \u2014 initially only erythema, progressing rapidly to dusky or necrotic skin. The most important clinical sign is pain DISPROPORTIONATE to the visible skin changes, because the infection spreads along fascial planes deep to the dermis while the overlying skin looks relatively intact. Crepitus is a late and pathognomonic sign and must not be awaited before acting. Any man with genital pain, swelling, fever and systemic illness out of proportion to the visible changes should be considered to have Fournier's gangrene until proved otherwise \u2014 arrange immediate emergency transfer, stop an SGLT2 inhibitor, and do not delay transfer for imaging or outpatient investigations."},
       {b:"dl", rows:[
         ["<b>NG12 \u2014 the criterion that applies here</b>","NICE NG12 (updated April 2026): consider a suspected cancer pathway referral for penile cancer in men with either a penile mass or ulcerated lesion where a sexually transmitted infection has been excluded as a cause, or a persistent penile lesion after treatment for a sexually transmitted infection has been completed. NICE also advises considering referral for unexplained or persistent symptoms affecting the foreskin or glans. In practice: examine every lesion properly, exclude or test for infection where appropriate, refer any suspicious, unexplained or persistent lesion (a clinically suspicious lesion without waiting; a lesion thought likely infective if it persists after treatment), and biopsy or specialist-assess where the diagnosis remains uncertain \u2014 including erythroplasia of Queyrat and penile lichen sclerosus not responding to treatment. Do not repeatedly re-treat a persistent lesion as infection. This page follows NICE NG12 as updated in April 2026 (the penile recommendation is unchanged). Restated in <a href='#refer'>Refer</a>"]
       ]}
     ]},

    {id:"confirm", nav:"Classify", title:"Classification of penile disorders",
     blocks:[
       {b:"dl", rows:[
         ["<b>Foreskin disorders (intact foreskin)</b>","Phimosis (non-retractile foreskin): physiological phimosis is normal in boys until approximately 3\u20135 years \u2014 the foreskin fuses to the glans neonatally and separates progressively. Pathological phimosis: fibrous scarring of the preputial ring, often from lichen sclerosus (BXO \u2014 balanitis xerotica obliterans), with difficulty retracting for hygiene or intercourse, a spraying urinary stream, and recurrent infections. Paraphimosis: a retracted foreskin that cannot be reduced over the glans \u2014 an urgent urological condition needing same-day assessment. Posthitis: infection or inflammation of the foreskin"],
         ["<b>Glans and penile skin disorders</b>","Balanitis \u2014 inflammation of the glans. Candidal balanitis (moist environment, diabetes, recent antibiotics): erythema, white discharge under the foreskin, satellite lesions — do not assume it from erythema alone, as Candida may be a secondary coloniser. Consider lichen sclerosus, irritant dermatitis, psoriasis, Zoon balanitis and PeIN. Bacterial balanitis (anaerobes and gram-negatives): offensive discharge. Circinate balanitis (reactive arthritis): painless erythematous plaques. Lichen sclerosus (BXO): white atrophic shiny plaques on glans and foreskin, foreskin scarring, phimosis, meatal stenosis. Erythroplasia of Queyrat: penile intraepithelial neoplasia (PeIN) \u2192 suspected cancer pathway referral"],
         ["<b>Erectile and structural disorders</b>","Peyronie's disease: a fibrous plaque in the tunica albuginea causing penile curvature (typically upward or lateral during erection), pain in the acute phase and erectile dysfunction. Lichen planus (penile): violaceous papules or plaques on the glans, associated with oral LP. Genital warts (HPV). STIs with penile manifestations: HSV (painful vesicles or ulcers), syphilis (painless ulcer or chancre with non-tender lymphadenopathy), gonorrhoea and chlamydia (urethral discharge)"]
       ]},
       {b:"warn", html:"Penile lichen sclerosus is the most important benign penile condition for GPs to diagnose correctly, for three reasons: (1) it is frequently misdiagnosed as recurrent candidal balanitis and treated empirically with antifungals for months to years; (2) inadequately treated penile LS progresses to scarring, phimosis and meatal stenosis, and penile LS is associated with an increased risk of PeIN and squamous cell carcinoma (published estimates vary); and (3) a potent topical corticosteroid such as clobetasol 0.05% ointment often improves inflammation and symptoms, though it may not reverse established scarring. The appearance: white, atrophic, shiny plaques on the glans, inner foreskin and prepuce \u2014 often with a white ring at the preputial orifice causing pathological phimosis. Investigate where there is diagnostic uncertainty and consider biopsy for persistent or uncertain disease; refer to urology where PeIN or malignancy is possible. New ulceration, bleeding, induration, a persistent lesion or failure to respond to treatment requires specialist assessment and possible biopsy. Review is individualised, with explicit patient education about recurrence and malignant-change symptoms."}
     ]},

    {id:"workup", nav:"Assess", title:"History, examination and investigations",
     blocks:[
       {b:"table", head:["Domain","Detail"], rows:[
         ["<b>History \u2014 symptoms</b>","Pain (balanitis, paraphimosis, lichen sclerosus, priapism) \u00b7 discharge (balanitis, STI) \u00b7 difficulty retracting the foreskin (phimosis, LS/BXO) \u00b7 ulcer (SCC, syphilis, HSV, chancroid) \u00b7 penile curvature (Peyronie's) \u00b7 swelling (paraphimosis, acute Peyronie's, priapism, oedema)"],
         ["<b>History \u2014 risk</b>","Sexual history: new partners, unprotected intercourse, symptoms in a partner. Drug history: SGLT2 inhibitors (Fournier's risk), anticoagulants, alpha-blockers, and — for priapism — intracavernosal injections, antipsychotics, trazodone and recreational drugs. Medical history: diabetes (candidal balanitis, Fournier's risk), sickle cell disease (priapism \u2014 a major complication), haematological malignancy, spinal cord injury. Circumcision status"],
         ["<b>Examination</b>","With consent and a chaperone where appropriate, inspect the entire penis; retract the foreskin if this is safe and possible — never forcibly retract a non-retractile foreskin. Inspect the glans, coronal sulcus, frenulum, meatus, shaft and prepuce for ulceration, induration, nodules, warty lesions, erosions, plaques, colour change and discharge. Document whether the foreskin was retracted and whether urination is affected. Systematic: foreskin (phimosis, paraphimosis, posthitis, BXO changes) \u00b7 glans (colour, lesions \u2014 ulcers, plaques, warts, nodules \u00b7 meatus \u2014 stenosis, discharge) \u00b7 shaft (Peyronie's plaque \u2014 palpable cord-like induration) \u00b7 urethra (meatal position \u2014 hypospadias, discharge) \u00b7 scrotum and testes \u00b7 scrotum and testes when clinically relevant \u00b7 palpate both groins and document the number, laterality and characteristics of any nodes; in STI, tender means reactive and non-tender suggests metastatic or secondary syphilis"],
         ["<b>Investigations</b>","Targeted: full STI screen if STI is possible \u00b7 first-void urine or appropriate NAAT for chlamydia/gonorrhoea when indicated \u00b7 syphilis serology via the local laboratory algorithm (lesion PCR where available) \u00b7 HSV NAAT/PCR from a suitable lesion if herpes is suspected \u00b7 subpreputial swab for recurrent, uncertain or non-resolving balanoposthitis \u00b7 HbA1c if recurrent candidal balanitis or diabetes risk \u00b7 HIV test if an STI is diagnosed or there are risk factors \u00b7 biopsy or specialist assessment when the diagnosis is uncertain, persistent or suspicious. <b>Do not routinely request</b> penile ultrasound for uncomplicated Peyronie's disease, penile Doppler in primary care for suspected priapism, or blood film/haemoglobin electrophoresis for every episode of priapism \u2014 these are guided by urology/haematology assessment and the history"]
       ]},
       {b:"why", html:"The syphilis chancre is the most important STI diagnosis not to miss at a \u201cbalanitis\u201d or \u201cpenile ulcer\u201d consultation. Primary syphilis presents as a single, painless, well-defined ulcer with a clean base and indurated edges, typically on the glans or inner foreskin. It is painless (unlike HSV, which is extremely painful), has a hardened base (unlike the soft shallow base of aphthous ulcers), and comes with unilateral or bilateral non-tender inguinal lymphadenopathy. Untreated, the primary chancre heals spontaneously in 3\u20136 weeks \u2014 but syphilis then progresses to secondary and tertiary disease. UK incidence has risen dramatically since 2010, with 9,535 early-stage syphilis diagnoses in England in 2024 (UKHSA, June 2025). A painless penile ulcer should prompt urgent syphilis testing and a full STI assessment, while maintaining a differential diagnosis that includes HSV, traumatic ulceration, fixed drug eruption, Behçet disease, inflammatory dermatoses, PeIN and SCC. Refer suspected syphilis to GUM."},
       {b:"dl", rows:[
         ["<b>Paraphimosis \u2014 primary care actions</b>","If the foreskin is trapped behind the glans and cannot be reduced, arrange urgent same-day urological assessment. If the patient is systemically unwell, the glans is discoloured or ischaemic, pain is severe, or urgent transfer cannot otherwise be achieved, arrange emergency transfer. Manual reduction can be attempted in primary care only by clinicians trained and competent in the procedure, with adequate analgesia and appropriate support. After reduction, ensure that the foreskin is returned to its normal position and that the patient can pass urine; refer for definitive management if recurrent or associated with pathological phimosis. Oedema accumulates distal to the constricting ring, so any delay worsens reduction difficulty and risks glans ischaemia"],
         ["<b>Priapism \u2014 classification</b>","Ischaemic (low-flow): a medical emergency \u2014 prolonged painful erection from venous outflow obstruction, a compartment syndrome of the corpora cavernosa, which must be treated within 4\u20136 hours to preserve erectile function. Document the exact time of onset. Ask about intracavernosal injections (e.g. alprostadil), antipsychotics (chlorpromazine, olanzapine), trazodone, recreational drugs (e.g. cocaine), haematological disease (e.g. leukaemia) and sickle cell disease. Give analgesia if appropriate. High-flow (non-ischaemic): usually post-traumatic (an arteriovenous fistula from cavernosal artery injury), usually less painful, and not generally an immediate ischaemic emergency, but still requires urgent urological assessment. The urology team distinguishes the two — do not rely on penile Doppler before referral"]
       ]}
     ]},

    {id:"ladder", nav:"Treat", title:"Treatment by diagnosis",
     sub:"Fuller management of balanitis itself is on the <a href='balanitis.html'>balanitis protocol</a>; the essentials are kept here because they are part of this presentation.",
     blocks:[
       {b:"table", head:["Diagnosis","Treatment"], rows:[
         ["<b>Candidal balanitis</b>","For clinically suspected uncomplicated candidal balanitis, advise gentle washing with water or an emollient soap substitute (avoid soap, fragranced products and overwashing) and consider topical clotrimazole 1% twice daily until symptoms resolve, usually for 7\u201314 days, according to the current BASHH/local guideline. Check adherence and correct application. Routine treatment of an asymptomatic partner is not indicated \u2014 a symptomatic partner should seek assessment. Assess for diabetes and other causes (phimosis, recent antibiotics). Consider a subpreputial swab if the diagnosis is uncertain, recurrent or not responding, and consider lichen sclerosus, irritant dermatitis, psoriasis, Zoon balanitis and PeIN. Seek sexual-health or dermatology advice before using systemic antifungal treatment, particularly for recurrent, severe or atypical disease (consider liver disease, QT-prolonging drugs and interactions, and immunosuppression). If recurrent: check HbA1c, and consider prepuceplasty (surgical widening of a phimotic foreskin) or circumcision to improve hygiene"],
         ["<b>Bacterial balanitis</b>","Saline wash and hygiene advice. Avoid routine topical antibiotics (sensitisation and antimicrobial resistance) \u2014 prefer culture-directed treatment of a clearly identified infection, using the local Greater Manchester antimicrobial guideline where infection is suspected"],
         ["<b>Penile lichen sclerosus (BXO)</b>","Consider clobetasol propionate 0.05% ointment for clinically typical penile lichen sclerosus, applied to affected skin according to the current BASHH/local dermatology or urology regimen (potent or ultrapotent topical corticosteroid tapered according to response). Provide written instructions, avoid application to unaffected skin, and review response and foreskin function. Seek specialist advice if the diagnosis is uncertain, there is significant scarring, meatal symptoms, phimosis, poor response or any suspicious lesion. If phimosis has not improved at review \u2192 urology (prepuceplasty or circumcision). If a new ulcer or non-healing lesion develops on treated BXO \u2192 suspected cancer pathway referral"],
         ["<b>Peyronie's \u2014 active phase</b>","Education: the disease usually stabilises over months, and some men improve spontaneously. NSAIDs may be used for pain in the active phase. Oral agents (including vitamin E and colchicine) should not be offered with the expectation that they will reliably reduce curvature. Refer for assessment and counselling at any stage if the condition is significantly distressing or functionally limiting; traction is discussed by urology/andrology"],
         ["<b>Peyronie's \u2014 stable phase</b>","Refer to urology/andrology for discussion of traction, surgery and other specialist options according to sexual bother, difficulty with intercourse, curvature severity and direction, erectile function, pain, complex deformity and patient preference \u2014 not a rigid angle threshold. Surgery is generally considered once disease has stabilised, often after at least 3\u20136 months of stability and usually 9\u201312 months from onset. Collagenase is not routinely available in the UK and should not be presented as a standard GP referral expectation. Assessment of curvature: mild &lt;30\u00b0, moderate 30\u201360\u00b0, severe &gt;60\u00b0. Sildenafil if there is concurrent ED"],
         ["<b>Primary syphilis</b>","Refer to GUM for management rather than treating independently \u2014 GUM coordinates staging, pregnancy assessment, neurological/ocular symptoms, HIV and other STI testing, partner notification, serological follow-up, allergy and treatment-completion issues, and the Jarisch\u2013Herxheimer reaction. For reference, BASHH 2024 recommends benzathine penicillin as first-line treatment for early syphilis, with doxycycline as an alternative"],
         ["<b>Genital herpes (HSV)</b>","Test and manage suspected first-episode genital herpes in accordance with the current BASHH guideline, starting oral antiviral treatment promptly when clinically indicated (most useful within 5 days of onset or while new lesions are forming): aciclovir 400 mg TDS for 5 days, or valaciclovir 500 mg BD for 5 days (aciclovir 200 mg five times a day is an alternative); review and extend if lesions are still appearing or systemic symptoms persist. Adjust the dose in renal impairment. Analgesia; topical lidocaine may be used cautiously, but topical antivirals are not useful. Consider hospital assessment for urinary retention, meningism, severe systemic illness, disseminated disease or immunocompromise. Suppressive treatment is individualised \u2014 there is no absolute recurrence threshold. Refer to GUM for diagnostic uncertainty, severe disease, immunocompromise, pregnancy, urinary retention, meningism or recurrent troublesome disease. Counselling: inform the partner, condoms give partial protection, transmission is possible without active lesions through asymptomatic shedding, and there is a vertical transmission risk in a pregnant partner"],
         ["<b>Ischaemic priapism \u2014 while awaiting transfer</b>","A painful erection lasting 4 hours or more is ischaemic priapism until proven otherwise: arrange immediate emergency/urology assessment and do not delay transfer for imaging. Document the exact time of onset, ask about causes, and give analgesia if appropriate. Aspiration, washout and intracavernosal phenylephrine are specialist-led interventions with blood-pressure and pulse monitoring \u2014 the receiving urology team decides whether these or surgery are required. Sickle cell priapism: also oxygen, IV fluids, analgesia, and exchange transfusion if prolonged"]
       ]},
       {b:"why", html:"Collagenase clostridium histolyticum (Xiapex) has been withdrawn from the European market, although the evidence remains discussed in the EAU guideline \u2014 it is not routinely available in the UK and should not be presented to patients as a standard GP referral expectation. Refer Peyronie's disease according to functional and psychological impact rather than a rigid angle threshold; the urology/andrology team will discuss traction, surgery and other specialist options. Surgery is generally considered when the disease has stabilised, but patients may be referred earlier for assessment and counselling."},
       {b:"why", html:"The circumcision decision requires a nuanced approach \u2014 not all adult men with phimosis or balanitis need circumcision, and conservative management should be attempted first in most cases. For pathological phimosis from lichen sclerosus: a potent topical corticosteroid such as clobetasol 0.05% ointment, per the BASHH/local regimen, is first-line and may allow retraction without surgery. For recurrent candidal or bacterial balanitis: treat the underlying cause \u2014 diabetes, phimosis, hygiene \u2014 before recommending circumcision. Circumcision is appropriate for true pathological phimosis resistant to topical steroid, recurrent BXO with severe scarring, or recurrent paraphimosis. NHS circumcision for adults is available for pathological phimosis and BXO/LS but not for routine balanitis in most commissioning areas."}
     ]},

    {id:"lifestyle", nav:"Prevention", title:"Hygiene, sexual health and prevention",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"\u{1F9FC} Penile hygiene with an intact foreskin", html:"Daily gentle cleaning under the foreskin with warm water only \u2014 no soap, fragranced products or overwashing under the foreskin (an emollient soap substitute can be used), which can cause irritant balanitis. Retract if possible, clean the glans and inner foreskin, and <b>replace the foreskin after cleaning</b>. Clean before and after intercourse. Teach from childhood \u2014 physiological phimosis is normal until about age 5, and the foreskin must not be forcibly retracted. <b>After each urination ensure the foreskin is fully forward</b>, since retained urine under a partial phimosis causes balanitis."},
         {tone:"amber", h:"\u{1FA78} Diabetes and penile health", html:"Diabetic men are at significantly higher risk of candidal balanitis (urinary glucose feeds Candida under the foreskin), bacterial balanitis (impaired neutrophil function), penile LS/BXO, and Fournier's gangrene (immunocompromise, neuropathy and peripheral vascular disease). Check HbA1c or urine glucose where recurrent candidal balanitis or other features suggest possible diabetes."},
         {tone:"blue", h:"\u{1F6E1}\u{FE0F} Condoms, HPV and PrEP", html:"Condoms reduce but do not completely prevent transmission \u2014 HPV and HSV can be transmitted from unprotected shaft or perianal skin. HPV vaccination: Gardasil 9 for eligible gay, bisexual and other men who have sex with men up to age 45 via sexual health services (UKHSA Green Book, Chapter 18a). Regular STI screening yearly for sexually active MSM and those with new or multiple partners. PrEP (pre-exposure prophylaxis, tenofovir plus emtricitabine) for HIV prevention in high-risk MSM, via GUM."},
         {tone:"green", h:"\u{1F9E0} Peyronie's \u2014 the psychological impact", html:"Peyronie's commonly causes significant psychological distress \u2014 shame, depression, relationship difficulty, sexual avoidance, reduced self-esteem. <b>Explore the psychological impact with a patient-centred assessment and offer psychosexual or psychological support where indicated.</b> Say it explicitly: <em>\u201cThis condition is distressing for many men \u2014 the emotional side matters as much as the physical.\u201d</em> <b>Psychosexual therapy referral (COSRT) for avoidance and anxiety.</b>"},
         {tone:"red", h:"\u{1F6AD} Smoking", html:"Smoking raises the risk of penile SCC, erectile dysfunction, Peyronie's and Fournier's gangrene \u2014 it is the most important preventable intervention for overall penile health. Offer NHS Stop Smoking Services at every penile disorder consultation."},
         {tone:"cream", h:"\u{1FA79} Post-circumcision care", html:"Keep the wound clean and dry for 48\u201372 h, then daily saline bathing. Abstain from sexual activity for 4\u20136 weeks (wound tensile strength). Regular paracetamol and ibuprofen for the first 5\u20137 days. Contact the GP for increasing redness, discharge or odour. Expected: swelling, bruising and altered sensation, usually temporary; the glans keratinises over weeks to months."},
         {tone:"blue", h:"\u{1FA78} Sickle cell and priapism prevention", html:"Priapism is the most common penile complication in sickle cell disease. Hydroxycarbamide (hydroxyurea) significantly reduces frequency. For recurrent stuttering priapism, a PDE5 inhibitor (sildenafil 25\u201350 mg OD or tadalafil 5 mg OD) can prevent ischaemic episodes. Haematology co-management is essential, and <b>every man with SCD should have a written emergency plan</b>."},
         {tone:"blue", h:"\u{1F50D} When to seek review", html:"Advise patients to seek review for a new persistent ulcer, lump, induration, bleeding, change in colour, discharge or difficulty retracting the foreskin. <b>A painless penile ulcer needs urgent syphilis testing and a full STI assessment.</b> For men with lichen sclerosus, previous HPV-related disease, smoking or immunosuppression, give safety-net advice and arrange review based on disease activity and symptoms."}
       ]},
       {b:"why", html:"The sickle cell priapism emergency plan should be provided to every male with SCD at adolescent review. Priapism in SCD typically begins as \u201cstuttering priapism\u201d \u2014 repeated short episodes lasting under 3 hours \u2014 before progressing to a prolonged ischaemic episode. Key education points: (1) any erection lasting more than 2 hours not responding to a cold compress, gentle exercise or ejaculation is an emergency \u2014 attend A&amp;E immediately, do not wait for 4 hours; (2) at home, a warm bath, gentle exercise and ejaculation may help a partial erection, though full rigid priapism will not resolve with these measures; (3) the A&amp;E team must be told on arrival that the patient has sickle cell disease with priapism, which triggers the SCD priapism protocol \u2014 IV fluids, analgesia, oxygen and urology consultation. The plan should be documented in the GP record and shared with the haematologist."}
     ]},

    {id:"monitor", nav:"Follow-up", title:"Follow-up, safety-netting and the documentation standard",
     blocks:[
       {b:"table", head:["Group","Follow-up"], rows:[
         ["<b>Penile LS (BXO) monitoring</b>","Review response after starting topical corticosteroid: foreskin function, symptom improvement, any new lesion. Long-term review is individualised, with explicit patient education about recurrence and malignant-change symptoms; specialist assessment and possible biopsy for any new ulcer, induration or persistent lesion. Suspected cancer pathway referral without delay for a non-healing ulcer, new nodule or bleeding on a background of LS"],
         ["<b>STI follow-up</b>","HIV test with every new STI. Syphilis serological follow-up as arranged by GUM. Partner notification via GUM. HSV: inform the partner, condom advice, and discuss suppressive therapy"],
         ["<b>Peyronie's review</b>","Refer according to sexual bother, function, pain and patient preference \u2014 earlier for assessment and counselling if needed; surgery is generally considered once disease has stabilised (often at least 3\u20136 months of stability, usually 9\u201312 months from onset). Explore psychological impact and offer psychosexual or psychological support where indicated"],
         ["<b>Post-balanitis \u2014 find the cause</b>","If recurrent: HbA1c, subpreputial swab, HIV test where risk factors, and consider lichen sclerosus, irritant dermatitis, psoriasis, Zoon balanitis and PeIN — biopsy or specialist assessment if uncertain. Document the outcome of treatment"],
         ["<b>Any lesion</b>","Review balanitis and phimosis response at a few weeks. A clinically suspicious lesion is referred without waiting; a lesion thought likely infective is reviewed after treatment and referred if it persists \u2014 do not keep re-treating it as infection"]
       ]},
       {b:"warn", html:"A suggested documentation template for a persistent penile lesion: <em>\u201cPenile lesion [describe]: [size] \u00d7 [size] mm, [location], [colour], [induration yes/no], [duration]. Patient [age], [smoking/alcohol status]. Suspected cancer pathway referral [initiated/not initiated, with reasoning]. Safety-net: [review date / referral plan].\u201d</em> Document the examination and clinical reasoning clearly, particularly if referral is not made: whether the foreskin was retracted, a description of any lesion, whether inguinal nodes were palpated, and the suspected cancer referral decision with reasoning if not referred. Do not repeatedly treat a persistent lesion as infection without reconsidering the diagnosis."},
       {b:"cards", items:[
         {tone:"red", h:"\u{1F534} Immediate emergency transfer", html:"Suspected Fournier's gangrene (pain disproportionate to appearance; do not wait for crepitus) \u2014 stop an SGLT2 inhibitor \u00b7 painful erection lasting 4 hours or more \u00b7 penile fracture \u00b7 severe glans discoloration or suspected ischaemia \u00b7 systemic illness, sepsis or urinary obstruction with a penile condition. Paraphimosis \u2192 urgent same-day urology."},
         {tone:"purple", h:"\u{1F7E3} Suspected cancer", html:"Penile mass or ulcerated/indurated lesion (STI excluded) \u00b7 a lesion persisting after STI treatment \u00b7 unexplained persistent foreskin/glans symptoms \u00b7 erythroplasia of Queyrat (a bright red velvety plaque on the glans)."},
         {tone:"amber", h:"\u{1F7E0} Safety-net lichen sclerosus", html:"<b>Explicitly safety-net LS for malignant change</b> \u2014 any new ulcer, induration or non-healing lesion."},
         {tone:"green", h:"\u{1F4CB} Modifiable factors", html:"Genital hygiene, glycaemic control in recurrent candidal balanitis, partner assessment via GUM where an STI is diagnosed, STI screening for ulcers or discharge, smoking cessation and HPV awareness, and long-term topical steroid for LS as directed."}
       ]},
       {b:"say", html:"I need to examine this properly, including gently pulling the foreskin back if it moves comfortably \u2014 I will never force it \u2014 because the appearance tells me most of what I need to know. Most penile problems are benign and treatable \u2014 but the rule I work to is that a sore or lump that persists, or does not settle after treatment, gets referred rather than treated again with another cream. If this is the white, shiny skin change I think it may be, the right treatment is a strong steroid ointment rather than an antifungal; it often settles the inflammation and symptoms, though it may not undo scarring that is already there. Left untreated it can scar and, rarely, turn cancerous, so we will review how it responds, and I want you to come back sooner if you notice a new sore, lump, bleeding or hardening."}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Immediate emergency transfer", html:"Suspected Fournier's gangrene (necrotising fasciitis) \u00b7 painful erection lasting 4 hours or more \u00b7 penile fracture (sudden crack plus haematoma) \u00b7 severe glans discoloration or suspected ischaemia \u00b7 systemic illness, sepsis or urinary obstruction associated with a penile condition."},
         {tone:"red", h:"Same-day urology", html:"Paraphimosis if reduction is not promptly and safely achieved by a trained clinician \u00b7 recurrent or stuttering priapism \u00b7 significant phimosis with obstructive symptoms \u00b7 meatal stenosis affecting urinary flow \u00b7 suspected penile malignancy where an urgent specialist pathway is required."},
         {tone:"purple", h:"Urology suspected cancer referral \u00b7 NICE NG12 (updated April 2026)", html:"A penile mass or ulcerated lesion where STI has been excluded, or a persistent penile lesion after STI treatment has been completed \u2014 in practice: any suspicious, unexplained or persistent penile ulcer, nodule, induration or warty lesion (in England generally the two-week-wait pathway) \u00b7 unexplained persistent foreskin/glans symptoms \u00b7 erythroplasia of Queyrat (PeIN) \u00b7 penile LS (BXO) not responding to clobetasol \u00b7 lichen planus of the penis with severe erosions or possible PeIN."},
         {tone:"amber", h:"GUM / sexual health", html:"Suspected syphilis \u00b7 genital herpes \u00b7 urethritis or genital discharge \u00b7 genital warts or suspected STI-related balanitis \u00b7 suspected STI in a partner or need for contact tracing \u2014 all require a full STI screen and HIV testing."},
         {tone:"blue", h:"Urology (routine)", html:"Peyronie's disease according to sexual bother, function, pain, deformity and patient preference (not a rigid angle threshold) for discussion of traction, surgery and other specialist options \u00b7 phimosis requiring circumcision \u00b7 recurrent candidal balanitis despite treatment (exclude BXO) \u00b7 meatal stenosis with difficulty voiding or a poor stream."},
         {tone:"cream", h:"GP management", html:"Suspected candidal balanitis: water or emollient washing and clotrimazole 1% BD until symptoms resolve (usually 7\u201314 days), per BASHH/local guidance; partner assessed only if symptomatic. Bacterial balanitis: hygiene and culture-directed treatment per the Greater Manchester antimicrobial guideline. BXO/penile LS: clobetasol 0.05% ointment per the BASHH/local regimen, with review. First-episode herpes: aciclovir 400 mg TDS or valaciclovir 500 mg BD for 5 days per BASHH, with GUM referral. Syphilis: via GUM. Fuller balanitis management is on the <a href='balanitis.html'>balanitis protocol</a>."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 58-year-old attends for the third time in two months with \u201crecurrent thrush\u201d on the glans, having twice been given clotrimazole by phone without examination. He now finds the foreskin difficult to retract. On examination the glans and inner foreskin show white, shiny, atrophic plaques with a pale ring at the preputial opening. He smokes."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Examines rather than re-prescribing \u2014 and recognises white atrophic plaques with a preputial ring as lichen sclerosus, not candida; knows antifungals will not help and offers clobetasol 0.05% per the BASHH/local regimen with written instructions; explains the increased risk of PeIN and SCC and arranges individualised review with safety-netting for malignant-change symptoms; <b>checks HbA1c and addresses smoking as an SCC risk factor</b>; documents the examination and reasoning, including whether the foreskin was retracted and whether nodes were palpated; and \u2014 the step candidates miss \u2014 states the rule that a persistent or suspicious lesion is referred (NICE NG12) rather than getting another cream."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG12 \u2014 Suspected cancer: recognition and referral (updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> \u2014 penile cancer: consider a suspected cancer pathway referral for a penile mass or ulcerated lesion where STI has been excluded, or a persistent penile lesion after STI treatment has been completed; unchanged in the April 2026 update</span></li>'+
         '<li><b>BASHH/BHIVA \u2014 Guideline on the management of balanoposthitis (and related penile skin conditions) (2025)</b><br><a href="https://www.bashh.org" rel="noopener">bashh.org</a><span class="rd"> \u2014 principal reference for balanitis and penile dermatoses: investigation where uncertain, subpreputial swab, biopsy for persistent or uncertain disease, topical corticosteroid for lichen sclerosus tapered to response, urology referral where PeIN or malignancy is possible</span></li>'+
         '<li><b>BASHH \u2014 UK guidelines for the management of syphilis 2024</b><br><a href="https://doi.org/10.1177/09564624241280406" rel="noopener">doi.org/10.1177/09564624241280406</a><span class="rd"> \u2014 local laboratory testing algorithms, lesion PCR, benzathine penicillin first-line for early syphilis with doxycycline as an alternative, GUM-coordinated management and partner notification</span></li>'+
         '<li><b>BASHH \u2014 UK national guideline for the management of anogenital herpes 2024</b><br><a href="https://doi.org/10.1177/09564624241282396" rel="noopener">doi.org/10.1177/09564624241282396</a><span class="rd"> \u2014 first-episode aciclovir 400 mg TDS or valaciclovir 500 mg BD for 5 days (aciclovir 200 mg five times daily as an alternative), extension if lesions are still forming, individualised suppression</span></li>'+
         '<li><b>EAU/ASCO \u2014 Collaborative Guidelines on Penile Cancer (international)</b><br><a href="https://uroweb.org/guidelines/penile-cancer" rel="noopener">uroweb.org/guidelines/penile-cancer</a><span class="rd"> \u2014 the risk factor set, examination of the whole penis and both groins, and documenting the number, laterality and characteristics of suspicious nodes</span></li>'+
         '<li><b>EAU \u2014 Guidelines on Sexual and Reproductive Health (international, 2026)</b><br><a href="https://uroweb.org/guidelines/sexual-and-reproductive-health" rel="noopener">uroweb.org/guidelines/sexual-and-reproductive-health</a><span class="rd"> \u2014 ischaemic versus high-flow priapism, early specialist-led aspiration/washout and intracavernosal sympathomimetic treatment with monitoring; Peyronie\u2019s disease: oral agents not recommended for curvature, timing of surgery, collagenase withdrawn from the European market</span></li>'+
         '<li><b>Comparison of EAU and UK guidelines on priapism (BAUS-published consensus document, Journal of Clinical Urology 2017)</b><br><a href="https://doi.org/10.1177/2051415817691660" rel="noopener">doi.org/10.1177/2051415817691660</a><span class="rd"> \u2014 a consensus document rather than a current comprehensive BAUS guideline; UK practice draws on EAU/AUA-derived guidance and local pathways</span></li>'+
         '<li><b>MHRA Drug Safety Update \u2014 SGLT2 inhibitors: reports of Fournier\u2019s gangrene</b><br><a href="https://www.gov.uk/drug-safety-update" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> \u2014 severe pain, tenderness, erythema or swelling of the genital/perineal area with fever or malaise: suspect Fournier\u2019s gangrene, stop the SGLT2 inhibitor and treat urgently</span></li>'+
         '<li><b>UKHSA \u2014 Sexually transmitted infections and screening for chlamydia in England: 2024 report (June 2025)</b><br><a href="https://www.gov.uk/government/statistics/sexually-transmitted-infections-stis-annual-data-tables/sexually-transmitted-infections-and-screening-for-chlamydia-in-england-2024-report" rel="noopener">gov.uk</a><span class="rd"> \u2014 9,535 early-stage syphilis diagnoses in 2024</span></li>'+
         '<li><b>UKHSA \u2014 Human papillomavirus (HPV): the Green Book, Chapter 18a</b><br><a href="https://www.gov.uk/government/publications/human-papillomavirus-hpv-the-green-book-chapter-18a" rel="noopener">gov.uk</a><span class="rd"> \u2014 HPV vaccination for eligible gay, bisexual and other men who have sex with men up to age 45</span></li>'+
         '<li><b>Greater Manchester Antimicrobial Guidelines</b><br><a href="https://gmmmg.nhs.uk" rel="noopener">gmmmg.nhs.uk</a><span class="rd"> \u2014 local antimicrobial choice where bacterial balanitis or other infection is suspected</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> \u2014 clobetasol, clotrimazole, aciclovir, valaciclovir (including renal dose adjustment) and lidocaine gel</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Penile disorders \u2014 NICE NG12 (updated April 2026), BASHH balanoposthitis, syphilis and HSV guidelines, EAU penile cancer and sexual and reproductive health guidelines (international), and MHRA SGLT2 inhibitor advice. Examine every penile lesion properly and refer a suspicious, unexplained or persistent lesion: do not repeatedly re-treat it as infection. Balanitis has its own <a href=\"balanitis.html\">balanitis protocol</a>. Verify all doses against the current BNF before prescribing."
});
