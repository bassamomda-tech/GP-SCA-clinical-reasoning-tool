  stemTitle:"Glandular fever — confirm it, protect the spleen, keep amoxicillin away, and don’t let it hide a blood cancer",
  stemSub:"Epstein–Barr virus mononucleosis in teenagers and young adults: which signs actually shift the probability, why EBV serology (local laboratory pathway) rather than a Monospot confirms it, why the sore-throat antibiotic choice matters, what to say about sport, school and work, when the fatigue stops being expected, and the airway, splenic and haematological presentations that must not be managed as “just glandular fever”. NICE NG84 · NICE NG12 · Ebell JAMA 2016 · Cochrane 2015/2016 · amoxicillin SPC · UKHSA.",

  meta:[

    {t:"NICE NG12 · lymphadenopathy and leukaemia", tone:"tw"},
    {t:"Ebell JAMA 2016 · Bartlett Injury 2016 (case reports)"},

  ],
  quickSub:"Six cards for the consultation. Every figure is traceable to the named source in the <a href='#provenance'>Evidence</a> section.",
  quick:[
    {tone:"red", h:"Two emergencies hide inside a “simple” glandular fever", html:"<b>Airway:</b> stridor, respiratory distress, inability to maintain the airway or swallow saliva, or reduced consciousness → 999. Severe tonsillar enlargement with impaired swallowing but a stable airway → same-day hospital/ENT assessment. <b>Spleen:</b> sudden or severe left-upper-quadrant pain, left shoulder-tip pain, dizziness, pallor, tachycardia, hypotension or collapse → 999. Splenic rupture is rare but potentially fatal; published case reports show most reported injuries occur during the first month, although late rupture can occur. Exact incidence estimates are uncertain."},
    {tone:"amber", h:"Do not prescribe amoxicillin or ampicillin", html:"The amoxicillin SPC (section 4.4) advises avoiding it when infectious mononucleosis is suspected, because a widespread morbilliform rash follows its use. If a bacterial sore throat genuinely needs treatment, NICE NG84 names <b>phenoxymethylpenicillin</b> first line — not amoxicillin, ampicillin or co-amoxiclav."},
    {tone:"blue", h:"A negative Monospot early on does not exclude it", html:"Make <b>EBV-specific serology</b> the preferred confirmatory test, using the local laboratory pathway — many UK laboratories do not routinely use heterophile testing. The heterophile antibody test has a pooled sensitivity of about 87% and specificity of about 91% (Ebell, JAMA 2016), which is not enough to reassure when suspicion remains high; it is particularly unreliable in the <b>first week</b>, in <b>younger children</b>, in early primary infection and in some adults. An FBC showing atypical (reactive) lymphocytes supports EBV but is not diagnostic."},
    {tone:"green", h:"Treatment is supportive — steroids and antivirals are not routine", html:"Analgesia, fluids and paced activity. Cochrane found <b>insufficient evidence</b> that corticosteroids improve symptoms (Rezk 2015) and that antivirals help, with very low-quality evidence (De Paor 2016). Steroids are reserved for threatened airway obstruction or serious haematological complications, with specialist input."},
    {tone:"amber", h:"Sport and lifting: give clear, individualised advice", html:"Avoid contact, collision and strenuous activity during the acute illness and while febrile, systemically unwell or with abdominal symptoms. Once clinically recovered, resume gentle non-contact activity gradually. <b>Avoid contact sport for at least 4 weeks from symptom onset</b>; a more conservative <b>8-week restriction</b> may be advised, particularly for collision sports such as rugby, martial arts and competitive football, in line with local NHS advice. Individualise advice for elite athletes, high-risk activities and heavy manual work. School, college or work need no exclusion once the patient feels well enough (UKHSA)."},
    {tone:"purple", h:"NG12: lymphadenopathy that is not explained", html:"Features clearly attributable to an acute, clinically compatible EBV illness do not automatically meet NG12 criteria. Apply NG12 if the diagnosis is uncertain, the blood results are atypical, symptoms are disproportionate, or lymphadenopathy/splenomegaly persists, enlarges or fails to regress. Adults: consider a suspected cancer pathway referral (for an appointment within 2 weeks) for Hodgkin or non-Hodgkin lymphoma with unexplained lymphadenopathy (or splenomegaly for non-Hodgkin). Consider a very urgent FBC (within 48 hours) for leukaemia with generalised lymphadenopathy, pallor, persistent fatigue, petechiae or hepatosplenomegaly. Children and young people: <b>immediate</b> specialist assessment for unexplained petechiae or hepatosplenomegaly; consider very urgent referral (within 48 hours) for unexplained lymphadenopathy or splenomegaly with lymphoma features; very urgent FBC (within 48 hours) for pallor, persistent fatigue, unexplained fever, persistent infection, generalised lymphadenopathy, bone pain, bruising or bleeding. Lymphadenopathy during a confirmed, typical EBV illness is not automatically a cancer referral."}
  ],
  pathwaySub:"Five moves. The first is the one that prevents harm: screen before you reassure.",
  pathway:[
    {title:"Screen the dangerous presentations first", html:"Airway compromise (drooling, stridor, unable to swallow fluids) · signs of splenic rupture (LUQ or shoulder-tip pain, tachycardia, hypotension) · dehydration unable to take fluids · jaundice · unexplained petechiae, bruising or bleeding · severe unilateral tonsillar swelling with trismus or uvular deviation (quinsy). Also check hydration and urine output, lymph-node distribution and size, hepatosplenomegaly, pregnancy possibility, sexual-health risk, and medication exposure (especially amoxicillin/ampicillin). Any of the dangerous features changes where the patient is managed today.", alert:true},
    {title:"Estimate the probability from the examination", html:"Sore throat, fever and lymphadenopathy in a teenager or young adult, with profound fatigue. The signs that raise the likelihood most are <b>posterior cervical, axillary or inguinal nodes</b>, <b>palatal petechiae</b> and <b>splenomegaly</b>; absent cervical nodes and absent fatigue make it less likely (Ebell 2016). Score the throat with FeverPAIN or Centor as well (NG84)."},
    {title:"Confirm with the right test at the right time", html:"For a typical, stable adolescent or young adult where confirmation will alter advice: <b>FBC with differential</b>; a <b>blood film</b> if there is atypical lymphocytosis, cytopenia or haematological red flags; <b>EBV serology</b> according to the local laboratory pathway; <b>LFTs</b> if jaundice, hepatomegaly, marked systemic illness or otherwise clinically indicated; and a pregnancy test where relevant. A negative heterophile test, particularly in week 1, does not exclude EBV. Offer an <b>HIV test</b>: a mononucleosis-like illness is an indicator condition (BHIVA/BASHH/BIA 2020)."},
    {title:"Treat the symptoms and protect the spleen", html:"Fluids and soft or cool foods, suitable analgesia (see the cautions below), rest as symptoms dictate, avoid alcohol while unwell or while LFTs are abnormal. No routine corticosteroids or antivirals. <b>No amoxicillin, ampicillin or co-amoxiclav</b> if EBV is suspected. Explain the splenic risk and give clear, individualised advice on returning to contact sport. No exclusion from school or work is needed once they feel well enough."},
    {title:"Safety-net, review, and know when to rethink", html:"Written safety-net for airway and spleen symptoms. Review earlier if worse; otherwise review at about 2–4 weeks if symptoms are not improving, nodes are not reducing, splenomegaly persists, jaundice or abnormal LFTs continue, fatigue significantly limits function, or the diagnosis remains unconfirmed — and <b>apply NG12 if features remain unexplained or atypical</b>. All four key ME/CFS symptoms beyond 6 weeks in adults (4 weeks in children) with significant functional reduction and no better explanation → think ME/CFS (NICE NG206)."}
  ],
  sections:[
    {id:"recognise", nav:"Recognise", title:"Recognising it — which findings actually move the probability", sub:"Glandular fever is common in 15–24 year olds. The classic picture is easy; the discriminating signs are what help you decide who to test.",
     blocks:[
       {b:"p", html:"EBV spreads by saliva and has a long incubation period, so there is rarely an obvious contact. The illness usually begins with malaise and fatigue before the throat becomes sore. On examination you typically find exudative tonsillitis, fever and symmetrical cervical lymphadenopathy. The <b>posterior</b> chain is the clue, because streptococcal tonsillitis mainly enlarges the anterior nodes. Symptoms usually peak in the first 1–2 weeks. Fatigue commonly outlasts the sore throat by weeks."},
       {b:"table", head:["Finding","What it does to the probability","Practical use"], rows:[
         ["<b>Posterior cervical lymphadenopathy</b>","Raises it — one of the more useful single signs (Ebell 2016)","Examine behind the sternomastoid, not only the jugulodigastric node"],
         ["<b>Axillary or inguinal nodes</b>","Raises it — generalised lymphadenopathy points away from a purely local throat infection","Also makes you think about HIV seroconversion and haematological disease"],
         ["<b>Palatal petechiae</b>","Raises it — relatively specific","Look at the junction of the hard and soft palate"],
         ["<b>Splenomegaly</b>","Raises it when present, but clinical palpation is insensitive","A palpable spleen changes the sport advice; its absence does not remove the risk"],
         ["<b>No cervical nodes / no fatigue</b>","Lowers it (Ebell 2016)","Consider another cause of the sore throat"],
         ["<b>Rash after amoxicillin</b>","Strongly suggests EBV in retrospect","Record it as a delayed rash during suspected/confirmed EBV infection, not automatically as penicillin allergy, unless there were features of a serious reaction (see the antibiotics section)"],
         ["<b>Periorbital or eyelid oedema, jaundice</b>","Seen in a minority","Jaundice → check LFTs; with jaundice or a cholestatic/mixed pattern, review for alternative diagnoses and consider specialist advice"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Who is in the age group — and who is not", html:"In children under about 5 the infection is often mild or unnoticed, and the Monospot is often falsely negative. In older adults a glandular-fever-like illness is proportionally less often due to EBV. Before you settle on the diagnosis, think about <b>CMV, primary HIV, toxoplasmosis</b> and <b>haematological disease</b>.", src:"Ebell et al., JAMA 2016 (Monospot limits); clinical practice"},
         {tone:"blue", h:"Scoring the throat is still worth doing", html:"FeverPAIN (fever, purulence, attend rapidly within 3 days, inflamed tonsils, no cough or coryza) or Centor lets you document how likely streptococcus is. A <b>FeverPAIN of 0–1 or Centor of 0–2</b> → NG84 advises no antibiotic. A high score does not rule glandular fever out, because both conditions produce an exudative throat.", src:"NICE NG84 (2018)"}
       ]},
       {b:"why", html:"Ebell’s Rational Clinical Examination review found that no single symptom is diagnostic. Several signs shift the odds, though, and the blood film shifts them most. A lymphocyte proportion of about 40–50% or more plus atypical lymphocytes of at least 10% makes infectious mononucleosis more likely — atypical/reactive lymphocytes support EBV but are not diagnostic. That is why an FBC is worth sending alongside EBV serology rather than relying on a Monospot alone."}
     ]},

    {id:"redflags", nav:"Red flags", title:"Red flags — including the NG12 blood-cancer criteria", sub:"Most patients need reassurance and time. These are the presentations that need a different destination, today or within 48 hours.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Threatened airway", html:"Stridor, respiratory distress, inability to maintain the airway or swallow saliva, or reduced consciousness → <b>999 / emergency transfer</b>. Severe tonsillar enlargement with impaired swallowing but a stable airway → <b>same-day hospital/ENT assessment</b>. Consider epiglottitis/supraglottitis where severe odynophagia, drooling, muffled voice or respiratory symptoms are disproportionate to the oropharyngeal findings, and avoid excessive throat examination or anything that may provoke distress. Threatened airway is the main situation in which corticosteroids are used, under specialist direction.", src:"Rezk et al., Cochrane 2015 (steroid evidence); clinical practice"},
         {tone:"red", h:"Suspected splenic rupture", html:"Sudden left upper quadrant pain, pain referred to the left shoulder tip, pallor, tachycardia, hypotension or collapse → <b>999</b>. It can follow trivial trauma or none at all. Published case reports show most reported injuries occur during the first month, although late rupture can occur; these data are subject to publication and selection bias and do not give a reliable population incidence. Do not treat the absence of splenomegaly on palpation as reassuring.", src:"Bartlett et al., Injury 2016; Sylvester et al., Sports Health 2019"},
         {tone:"red", h:"Unable to take fluids", html:"Dehydration from odynophagia, especially with vomiting or reduced urine output → same-day assessment for IV fluids and analgesia.", src:"NICE NG84 (2018) — refer if severe systemic illness"},
         {tone:"red", h:"Quinsy or deep neck space infection", html:"Unilateral peritonsillar swelling with uvular deviation, trismus or neck swelling → same-day ENT. NG84 lists quinsy, parapharyngeal and retropharyngeal abscess and Lemierre syndrome as reasons for hospital referral.", src:"NICE NG84 (2018)"},
         {tone:"amber", h:"Haematological or hepatic complications", html:"Petechiae, bruising or bleeding (thrombocytopenia), pallor or dark urine (haemolysis), or jaundice → urgent bloods (FBC, film, LFTs) and a same-day discussion with haematology or medicine if there is clinically significant thrombocytopenia, haemolysis, significant jaundice or an abnormal blood film.", src:"Ebell et al., JAMA 2016 (laboratory features); clinical practice"},
         {tone:"purple", h:"NG12 — leukaemia", html:"Adults: <b>consider a very urgent full blood count (within 48 hours) to assess for leukaemia</b> with any of pallor, persistent fatigue, unexplained fever, unexplained persistent or recurrent infection, generalised lymphadenopathy, unexplained bruising, unexplained bleeding, unexplained petechiae or hepatosplenomegaly. Children and young people: <b>refer for immediate specialist assessment</b> for unexplained petechiae or hepatosplenomegaly, and offer a very urgent FBC (within 48 hours) for pallor, persistent fatigue, unexplained fever, persistent infection, generalised lymphadenopathy, persistent or unexplained bone pain, unexplained bruising or unexplained bleeding.", src:"NICE NG12 (updated April 2026)"},
         {tone:"purple", h:"NG12 — lymphoma", html:"Adults with <b>unexplained lymphadenopathy</b>: consider a suspected cancer pathway referral (for an appointment within 2 weeks) for Hodgkin lymphoma, and for non-Hodgkin lymphoma if there is unexplained lymphadenopathy or splenomegaly. Take into account fever, night sweats, shortness of breath, pruritus, weight loss and (Hodgkin) alcohol-induced node pain. Children and young people: consider a <b>very urgent referral (within 48 hours)</b> with unexplained lymphadenopathy (or splenomegaly, for non-Hodgkin), taking lymphoma features into account. Not every child with lymphadenopathy during a confirmed EBV infection needs a cancer referral, but a confirmed EBV result must not be used to dismiss persistent, progressive or atypical features.", src:"NICE NG12 (updated April 2026)"}
       ]},
       {b:"warn", html:"“Unexplained” is important. Features clearly attributable to an acute, clinically compatible EBV illness do not automatically meet NG12 criteria. Apply NG12 if the diagnosis is uncertain, the blood results are atypical, symptoms are disproportionate, or lymphadenopathy/splenomegaly persists, enlarges or fails to regress after the acute illness."}
     ]},

    {id:"tests", nav:"Tests", title:"Testing — what to send and how to read it", sub:"A diagnosis made on the blood tests protects you twice: it justifies the sport advice, and it stops you missing the conditions that mimic it.",
     blocks:[
       {b:"table", head:["Test","What it tells you","Pitfall"], rows:[
         ["<b>FBC with differential; blood film if indicated</b>","Atypical/reactive lymphocytes support EBV but are not diagnostic. Send a film for marked or atypical lymphocytosis, cytopenia, bruising, petechiae or bleeding, pallor, hepatosplenomegaly, or persistent or unexplained lymphadenopathy","A film with blasts, or with falling neutrophils, haemoglobin or platelets, is not glandular fever until proven otherwise. A normal FBC does not exclude lymphoma"],
         ["<b>Heterophile antibody (Monospot / Paul-Bunnell)</b>","Sensitivity about 87%, specificity about 91% overall (Ebell 2016)","A negative result, particularly during the first week, does not exclude EBV; unreliable in younger children, early primary infection and some adults. Many UK laboratories do not routinely use it — use the local EBV serology pathway"],
         ["<b>EBV-specific serology (preferred)</b>","The preferred confirmatory test, via the local laboratory pathway. Recent primary infection is supported by VCA IgM with absent EBNA antibody, interpreted with VCA IgG, the laboratory report and clinical context","Not definitive on its own: VCA IgM may persist and false positives occur. Especially useful in children and in pregnancy"],
         ["<b>LFTs — clinically directed</b>","Not needed in every uncomplicated case. Send for jaundice or dark urine, significant abdominal pain, hepatomegaly, marked systemic illness, suspected hepatitis, abnormal examination, or a baseline for follow-up. A mild transaminase rise is common","Jaundice or a cholestatic/mixed pattern → review for alternative diagnoses and consider specialist advice. Avoid alcohol while acutely unwell and while liver tests are abnormal"],
         ["<b>HIV test</b>","Primary HIV infection presents as a mononucleosis-like illness","It is an indicator condition — offer the test routinely on an opt-out basis, explain why, and document acceptance or decline; not only when a specific sexual risk is disclosed (NICE QS157; BHIVA/BASHH/BIA 2020)"],
         ["<b>Throat swab</b>","Not needed routinely — use FeverPAIN/Centor and clinical judgement (NG84)","Streptococcal carriage can coexist with EBV; a positive swab does not exclude glandular fever"],
         ["<b>Pregnancy test</b>","Where relevant","Before further investigations or treatment decisions"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Monospot negative, still suspicious?", html:"Do not rely on a repeat Monospot — send EBV serology (VCA IgM, VCA IgG and EBNA) via the local laboratory pathway. If it does not support EBV and the illness fits, test for <b>CMV</b>, <b>toxoplasma</b> and <b>HIV</b>. A pregnant woman with a mononucleosis-like illness needs this work-up promptly, because CMV and toxoplasma matter for the fetus.", src:"Ebell et al., JAMA 2016; BHIVA/BASHH/BIA HIV testing guidelines 2020"},
         {tone:"blue", h:"Why the HIV test belongs in this consultation", html:"The UK adult HIV testing guidelines list a mononucleosis-like syndrome among the clinical indicator conditions for which an HIV test should be offered. Offer it routinely on an opt-out basis, explain why, and document acceptance or decline. Use a fourth-generation laboratory test (antigen plus antibody), repeat it if exposure was within the window period, and seek urgent sexual-health advice if acute HIV is strongly suspected.", src:"BHIVA/BASHH/BIA adult HIV testing guidelines 2020"}
       ]},
       {b:"why", html:"The Monospot detects heterophile IgM, which takes several days to rise, so testing too early gives false reassurance. EBV-specific antibodies (VCA IgM, VCA IgG and EBNA), interpreted together with the laboratory report, help separate recent from past infection. The blood film adds diagnostic weight and can show features of the rare acute leukaemia presenting as a sore throat with lymphadenopathy — but it is not a complete leukaemia or lymphoma screen."}
     ]},

    {id:"differentials", nav:"Differentials", title:"Differential diagnosis — what else produces this picture", sub:"The mimics matter because two of them need a different treatment and two need a different referral.",
     blocks:[
       {b:"table", head:["Condition","Clues","What to do"], rows:[
         ["<b>Streptococcal tonsillitis</b>","Anterior nodes, abrupt onset, high FeverPAIN or Centor, less fatigue, no splenomegaly","Manage per NG84 — phenoxymethylpenicillin if an antibiotic is warranted. A positive streptococcal test does not exclude EBV"],
         ["<b>Scarlet fever</b>","Sandpaper rash, strawberry tongue, flushed cheeks","Manage per national guidance — phenoxymethylpenicillin, not an aminopenicillin, if EBV is possible"],
         ["<b>Adenovirus; influenza or COVID-19 where clinically relevant</b>","Pharyngitis with conjunctivitis or coryza; respiratory features","Supportive care; test where it changes management"],
         ["<b>Primary HIV infection</b>","Rash, mouth ulcers, generalised nodes, recent risk; Monospot negative","HIV test now, and repeat if in the window period (BHIVA/BASHH/BIA 2020)"],
         ["<b>CMV</b>","Mononucleosis-like illness with less pharyngitis; Monospot negative","CMV serology — urgent if pregnant"],
         ["<b>Toxoplasmosis</b>","Lymphadenopathy with mild systemic upset; cat or undercooked-meat exposure","Serology — urgent if pregnant"],
         ["<b>Acute leukaemia</b>","Pallor, bruising, petechiae, bone pain, abnormal film or cytopenias","NG12 — very urgent FBC (48 h) or immediate assessment as above"],
         ["<b>Lymphoma</b>","Persistent painless nodes, night sweats, weight loss, itch, alcohol-induced node pain","NG12 — suspected cancer pathway (adults) or very urgent referral (children)"],
         ["<b>Quinsy and deep-neck infection</b>","Unilateral swelling, uvular deviation, trismus, neck swelling","Same-day ENT (NG84)"],
         ["<b>Kawasaki disease</b>","Younger child with prolonged fever and mucocutaneous features","Same-day paediatric assessment"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"cream", h:"The heuristic that keeps you safe", html:"Treat glandular fever as a diagnosis that must be <b>earned by a test</b>, not assumed from the age group. Once it is confirmed, the fatigue, nodes and spleen are explained. Until then, each one is a potential NG12 feature.", src:"NICE NG12 (updated April 2026)"},
         {tone:"cream", h:"Co-infection is possible", html:"A positive throat swab for group A streptococcus does not exclude EBV, because carriage is common. If the patient fits glandular fever and the streptococcal score is high, treat any bacterial component with phenoxymethylpenicillin rather than amoxicillin.", src:"NICE NG84 (2018); amoxicillin SPC section 4.4"}
       ]}
     ]},

    {id:"antibiotics", nav:"Antibiotics", title:"The sore-throat antibiotic decision — and the amoxicillin rash", sub:"The single most common prescribing error in this condition is an aminopenicillin for what looks like tonsillitis.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1", title:"Score it before you prescribe", when:"every sore throat", tone:"cream",
          html:"FeverPAIN 0–1 or Centor 0–2 → no antibiotic. FeverPAIN 2–3 → consider no antibiotic or a back-up prescription. FeverPAIN 4–5 or Centor 3–4 → consider an immediate or back-up antibiotic (NICE NG84). In confirmed glandular fever the antibiotic does nothing for the viral illness."},
         {step:"2", title:"If an antibiotic is needed: phenoxymethylpenicillin", when:"NG84 first choice", fromLabel:"not an aminopenicillin", tone:"cream",
          html:"Phenoxymethylpenicillin for 5–10 days (dose per BNF). If penicillin-allergic, NG84 names clarithromycin, or erythromycin in pregnancy. <b>Avoid amoxicillin, ampicillin and co-amoxiclav</b> for the sore throat while glandular fever is suspected — this applies to treating the sore throat and does not mean amoxicillin is universally contraindicated in everyone who might have EBV."},
         {step:"3", title:"If the rash has already happened", when:"after amoxicillin", fromLabel:"counsel and document", tone:"amber",
          html:"Stop the amoxicillin. The widespread maculopapular or morbilliform eruption usually settles with an emollient and an antihistamine if itchy. Document it carefully: <b>“Delayed widespread maculopapular rash occurring during suspected/confirmed EBV infection after amoxicillin; no features of immediate allergy reported.”</b> Do not automatically code it as “penicillin allergy”. If there was urticaria, angio-oedema, wheeze, anaphylaxis, mucosal involvement, blistering or skin detachment, or a systemic drug reaction, manage and record it as a potentially serious drug reaction and refer through the appropriate allergy pathway. A viral-associated exanthem does not prove that future amoxicillin will be tolerated."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"What the SPC actually says", html:"Section 4.4 of the UK amoxicillin SPCs: avoid amoxicillin if infectious mononucleosis is suspected, because a morbilliform rash has been associated with this condition after its use. The same caution applies to ampicillin and to co-amoxiclav, which contains amoxicillin.", src:"Amoxicillin SPC (emc), section 4.4 — check the current version for the exact product"},
         {tone:"green", h:"Why a label matters", html:"A patient wrongly coded as penicillin-allergic in their teens may be steered to broader-spectrum antibiotics for decades. The EBV-amoxicillin rash is a drug-virus interaction, not a typical IgE-mediated allergy — although it does not prove that re-exposure is automatically safe. Write the record so the next prescriber can tell the difference.", src:"Amoxicillin SPC section 4.4; clinical practice"}
       ]}
     ]},

    {id:"supportive", nav:"Treatment", title:"Supportive treatment — what helps, and what the trials say does not", sub:"Almost everything that helps is simple. The evidence mainly tells you what not to add.",
     blocks:[
       {b:"tiles", v:"life", items:[
         {t:"💧 Fluids first", html:"Small, frequent drinks. Cold fluids and ice lollies ease swallowing. Watch the urine output in teenagers who stop drinking because it hurts."},
         {t:"💊 Simple analgesia", html:"Use age- and weight-appropriate paracetamol if suitable. Use ibuprofen only if appropriate, the patient is adequately hydrated and there are no renal, gastrointestinal, bleeding, pregnancy or NSAID-related contraindications (including NSAID-sensitive asthma or anticoagulant use). Avoid excessive paracetamol dosing, particularly with hepatic involvement or alcohol use. With significant thrombocytopenia, avoid NSAIDs and seek specialist advice. Check doses against the current local formulary and product information. Medicated lozenges or anaesthetic sprays for short-term relief."},
         {t:"🛌 Rest to symptoms", html:"Rest when tired and resume activity gradually. There is no need for enforced bed rest. Pace the return to study or work."},
         {t:"🍺 Alcohol", html:"Avoid alcohol while acutely unwell and while liver tests are abnormal."}
       ]},
       {b:"cards", items:[
         {tone:"amber", h:"Corticosteroids — not routine", html:"Seven trials (362 participants) gave <b>insufficient evidence</b> that steroids control symptoms, and side effects and long-term complications have not been studied. Reserve them for threatened airway obstruction and selected severe complications (for example marked haemolysis or thrombocytopenia), started by the specialist team.", src:"Rezk et al., Cochrane 2015 (CD004402)"},
         {tone:"amber", h:"Antivirals — no role in primary care", html:"Seven RCTs (333 participants) of aciclovir, valaciclovir and valomaciclovir: effectiveness <b>uncertain</b>, the quality of evidence very low, and any improvements modest and probably not clinically meaningful. Do not prescribe them for uncomplicated glandular fever.", src:"De Paor et al., Cochrane 2016 (CD011487)"},
         {tone:"green", h:"What you can promise", html:"Most people are over the acute illness within 2–4 weeks. Tiredness often takes longer, and post-infectious fatigue does not follow a predictable course in every patient — in one adolescent cohort a minority still met chronic fatigue criteria months later.", src:"Katz et al., Pediatrics 2009 (cohort data)"}
       ]},
       {b:"why", html:"Because steroids and antivirals look like “doing something”, patients and parents sometimes ask for them. Cochrane found no reliable benefit for either. Steroids may also carry risks that have not been studied in this group. The honest message is that time, fluids and analgesia are the treatment, and that the job of follow-up is to catch the rare complication, not to shorten the illness."}
     ]},

    {id:"sport", nav:"Spleen and sport", title:"The spleen, sport and heavy lifting", sub:"The question patients care about most: when can I play again? Give clear, individualised advice rather than “a while” — the fixed intervals are conservative practice, not proven thresholds.",
     blocks:[
       {b:"timeline", items:[
         {n:"1", when:"Acute illness", title:"Highest risk: no contact, collision or strenuous activity", html:"Avoid contact, collision and strenuous activity during the acute illness and while febrile, systemically unwell or experiencing abdominal symptoms. Published case reports and retrospective data (Bartlett 2016; Sylvester 2019) — subject to publication and selection bias — show most reported splenic injuries in the first month, although late rupture can occur."},
         {n:"2", when:"Once clinically recovered","title":"Gentle non-contact activity, built up gradually", html:"If afebrile, eating and drinking, and without abdominal symptoms, resume gentle non-contact activity gradually. International sports-medicine consensus (AMSSM 2023, not the default UK pathway) notes that heavy exertion earlier than 2–3 weeks from onset may prolong fatigue."},
         {n:"3", when:"As recovery allows","title":"Heavy manual work and strenuous training — individualised", html:"There is no strongly evidenced fixed date for heavy lifting or straining. For heavy manual work, gym weights and strenuous training, agree an individualised phased return based on symptom resolution and clinical status. Delay if the spleen is still enlarged or symptoms persist."},
         {n:"4", when:"At least 4 weeks (8 weeks if local policy)","title":"Contact and collision sport", html:"<b>Avoid contact sport for at least 4 weeks from symptom onset</b>; a more conservative <b>8-week restriction</b> may be advised, particularly for collision sports such as rugby, martial arts and competitive football, in line with local NHS advice (East Kent Hospitals NHS patient leaflet — local patient advice and a conservative UK practice recommendation, not a definitive evidence-based threshold). The AMSSM statement (2023) is international sports-medicine consensus, not the default UK pathway. Individualise for elite athletes or high-risk activities, with specialist sports-medicine input or imaging where the decision has major consequences, such as an elite contact athlete seeking an earlier return."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"A normal examination does not mean a normal spleen", html:"Palpation misses many enlarged spleens. The advice therefore rests on <b>time from symptom onset</b>, not on whether you can feel it. Routine ultrasound is not recommended for everyone; consider specialist sports-medicine input or imaging only where the decision has major consequences.", src:"AMSSM position statement 2023 (international); Putukian et al., Clin J Sport Med 2008"},
         {tone:"cream", h:"Make it concrete", html:"Write the agreed contact-sport date in the notes and on the advice sheet: at least 4 weeks from the first symptoms, or 8 weeks under the more conservative local policy, particularly for collision sports. Ask about the patient’s actual job and hobbies — rugby, football, martial arts, horse riding, trampolining, gym lifting and heavy manual work — and agree an individualised phased return for heavy work and lifting.", src:"East Kent Hospitals NHS glandular fever leaflet (local patient advice); Bartlett et al., Injury 2016; Sylvester et al., Sports Health 2019 (case-report and retrospective data)"}
       ]},
       {b:"say", html:"Your spleen, an organ under your left ribs, swells with this virus, and for the first month it is more fragile than usual. So no rugby, football or anything with contact until at least [agreed date — at least 4 weeks from when you got ill, or 8 weeks under our local advice], and we will plan a gradual return to the gym and heavy work as you recover. Gentle walking is fine as soon as you feel up to it. If you ever get sudden pain high on the left of your tummy or in the tip of your left shoulder, or you feel faint, call 999."}
     ]},

    {id:"school", nav:"School and work", title:"School, work, spread and relationships", sub:"Patients and families usually ask three things: can I go in, can I pass it on, and when will I be back to normal?",
     blocks:[
       {b:"cards", items:[
         {tone:"green", h:"No exclusion needed", html:"UKHSA’s exclusion table for schools and childcare settings lists <b>no exclusion period</b> for glandular fever. The patient can return to school, college or work as soon as they feel well enough.", src:"UKHSA, Health protection in children and young people settings — exclusion table"},
         {tone:"blue", h:"How it spreads", html:"EBV is transmitted mainly through saliva. Avoid kissing and sharing drinks, cutlery, toothbrushes, vapes and other items contaminated with saliva while acutely unwell. Viral shedding may continue for months, so prolonged isolation is neither practical nor recommended. Casual classroom contact is not a significant transmission risk.", src:"UKHSA exclusion table (no exclusion); clinical practice"},
         {tone:"cream", h:"Exams, deadlines and sick notes", html:"The fatigue can collide with exams. A letter supporting mitigating circumstances or a phased return is often the most useful thing you can offer. Adults can self-certify for 7 days and then need a fit note."}
       ]},
       {b:"say", html:"You can’t really “catch it again” in a way that matters, and you don’t need to stay away from school or work once you feel up to going in. Just don’t share drinks or cutlery for a while. The tiredness is the part that takes longest, so we’ll plan a gradual return rather than going straight back to everything."}
     ]},

    {id:"fatigue", nav:"Recovery", title:"Recovery, fatigue and when to review", sub:"A long tail of tiredness is normal. The review is there to separate a slow recovery from a missed diagnosis or ME/CFS.",
     blocks:[
       {b:"table", head:["When","What to check","Action"], rows:[
         ["<b>1–2 weeks</b>","Airway, fluids, abdominal pain, jaundice, bleeding","Safety-net; review sooner if worse"],
         ["<b>2–4 weeks</b>","Is the throat settling? Are the nodes shrinking? Is the spleen still palpable?","Confirm the return-to-sport advice. Review if symptoms are not improving, nodes are not reducing, splenomegaly persists, jaundice or abnormal LFTs continue, fatigue significantly limits function, or the diagnosis remains unconfirmed; apply NG12 if features remain unexplained or atypical"],
         ["<b>4–6 weeks</b>","Persisting fatigue, mood, sleep, school or work function","Pacing/energy-management advice and an individually negotiated, symptom-contingent return to education or work — do not prescribe a fixed graded exercise programme. Repeat FBC and LFTs if previously abnormal"],
         ["<b>Beyond 6 weeks (adults) / 4 weeks (children)</b>","Debilitating fatigue, post-exertional malaise, unrefreshing sleep, cognitive difficulty — all four","With significant reduction in function and no better explanation, suspect ME/CFS and follow NICE NG206. The diagnosis is confirmed if symptoms persist at 3 months"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"ME/CFS — the NG206 thresholds", html:"Suspect ME/CFS when all four key symptoms have lasted at least <b>6 weeks in adults or 4 weeks in children and young people</b>. There must also be a significant reduction in function and no better explanation from alternative diagnoses; the diagnosis is confirmed after 3 months. Give pacing/energy-management advice and an individually negotiated, symptom-contingent return to education or work — do not prescribe a fixed graded exercise programme — and refer children promptly to a paediatrician.", src:"NICE NG206 (2021)"},
         {tone:"blue", h:"How common a slow recovery is", html:"In a prospective cohort of adolescents, a minority met criteria for chronic fatigue syndrome at 6, 12 and 24 months after glandular fever, with fewer at each time point. These figures describe one cohort and do not mean that post-infectious fatigue follows a predictable course in every patient.", src:"Katz et al., Pediatrics 2009"}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — destinations and thresholds", sub:"The same NG12 thresholds as in the red-flags section, repeated so they are in front of you when you make the referral.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999 / emergency department", html:"Stridor or respiratory distress; inability to swallow saliva; airway compromise; collapse or haemodynamic instability; sudden left-upper-quadrant/shoulder-tip pain with dizziness or collapse; suspected splenic rupture; severe systemic illness or sepsis.", src:"NICE NG84 (2018); Bartlett et al., Injury 2016"},
         {tone:"amber", h:"Same-day hospital / ENT assessment", html:"Inability to maintain oral fluids; severe dehydration; quinsy or deep-neck infection; severe unilateral tonsillar swelling or trismus; significant jaundice; clinically significant thrombocytopenia, haemolysis or an abnormal blood film.", src:"NICE NG84 (2018); Ebell et al., JAMA 2016"},
         {tone:"blue", h:"Local pathway", html:"Use the local Bolton / Greater Manchester ENT, haematology, sexual-health and out-of-hours referral routes for these destinations.", src:"Local pathway"},
         {tone:"purple", h:"Suspected cancer / very urgent — NG12 lymphoma", html:"Adults: consider a <b>suspected cancer pathway referral (for an appointment within 2 weeks)</b> for Hodgkin lymphoma with unexplained lymphadenopathy, and for non-Hodgkin lymphoma with unexplained lymphadenopathy or splenomegaly. Consider fever, night sweats, shortness of breath, pruritus, weight loss and alcohol-induced node pain. Children and young people: consider a <b>very urgent referral (for an appointment within 48 hours)</b> for unexplained lymphadenopathy (or splenomegaly for non-Hodgkin).", src:"NICE NG12 (updated April 2026)"},
         {tone:"purple", h:"Very urgent FBC / immediate assessment — NG12 leukaemia", html:"Adults: consider a <b>very urgent full blood count (within 48 hours)</b> for pallor, persistent fatigue, unexplained fever, unexplained persistent or recurrent infection, generalised lymphadenopathy, unexplained bruising, bleeding or petechiae, or hepatosplenomegaly. Children and young people: <b>refer for immediate specialist assessment</b> if there are unexplained petechiae or hepatosplenomegaly.", src:"NICE NG12 (updated April 2026)"},
         {tone:"blue", h:"Routine or advice", html:"Recurrent tonsillitis after recovery (ENT per local criteria). Allergy clinic if a penicillin label is uncertain. Paediatrics or an ME/CFS service where NG206 criteria are met. Sexual health for HIV follow-up if positive.", src:"NICE NG206 (2021); BHIVA/BASHH/BIA 2020"}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card. The marks come from the safety-netting and the sport date, not from reciting the virology.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Scenario", html:"A 17-year-old rugby player, 6 days into a severe sore throat, was given amoxicillin at an out-of-hours centre 3 days ago and now has a widespread itchy rash. He has posterior cervical nodes and palatal petechiae. His mother wants to know if he is “allergic to penicillin now”, and he has a county trial in 10 days.", src:"Amoxicillin SPC section 4.4; Ebell et al., JAMA 2016"},
       {tone:"cream", h:"What a good consultation does", html:"Screens the airway and abdomen first. Explains the rash as a <b>virus-plus-amoxicillin</b> reaction, stops the drug and documents it carefully. Sends an FBC and EBV serology via the local laboratory pathway (film and LFTs if indicated), and offers an HIV test on an opt-out basis. Explains that a negative early heterophile test would not exclude EBV. Gives a clear <b>no-contact-sport date — at least 4 weeks from onset, and 8 weeks under conservative local advice for a collision sport like rugby</b> — so no trial in 10 days, and negotiates this with empathy. Safety-nets for splenic rupture in words he will remember. Arranges review and explains when a negative test would change the plan.", src:"East Kent Hospitals NHS glandular fever leaflet (local patient advice); Bartlett et al., Injury 2016; BHIVA/BASHH/BIA 2020"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Named sources, labelled by type. Check doses against the BNF, the current local formulary and product information.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG84 — Sore throat (acute): antimicrobial prescribing (2018)</b><br><a href="https://www.nice.org.uk/guidance/ng84" rel="noopener">nice.org.uk/guidance/ng84</a><span class="rd"> — FeverPAIN and Centor thresholds (no antibiotic for FeverPAIN 0–1 or Centor 0–2), phenoxymethylpenicillin 5–10 days as first choice, clarithromycin or erythromycin in penicillin allergy, and reasons for hospital referral (quinsy, deep neck space infection, Lemierre syndrome, severe systemic illness)</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — very urgent FBC for leukaemia in adults; immediate specialist assessment for unexplained petechiae or hepatosplenomegaly in children; suspected cancer pathway referral for Hodgkin and non-Hodgkin lymphoma in adults; very urgent referral within 48 hours for lymphoma in children and young people</span></li>'+
         '<li><b>NICE NG206 — ME/CFS: diagnosis and management (2021)</b><br><a href="https://www.nice.org.uk/guidance/ng206" rel="noopener">nice.org.uk/guidance/ng206</a><span class="rd"> — suspect ME/CFS when all four key symptoms persist for 6 weeks (adults) or 4 weeks (children) with significant functional reduction and no better explanation; confirm at 3 months; no fixed graded exercise programme</span></li>'+
         '<li><b>Ebell MH, Call M, Shinholser J, et al. Does this patient have infectious mononucleosis? The Rational Clinical Examination systematic review. JAMA 2016;315(14):1502–9</b><br><a href="https://jamanetwork.com/journals/jama/article-abstract/2512790" rel="noopener">jamanetwork.com</a><span class="rd"> — the value of posterior cervical, axillary and inguinal nodes, palatal petechiae and splenomegaly; lymphocytosis with atypical lymphocytes; heterophile test sensitivity about 87% and specificity about 91% — not sufficient to make a negative result reassuring when suspicion is high; early false negatives</span></li>'+
         '<li><b>Bartlett A, Williams R, Hilton M. Splenic rupture in infectious mononucleosis: a systematic review of published case reports. Injury 2016;47(3):531–8</b><br><a href="https://pubmed.ncbi.nlm.nih.gov/26563483/" rel="noopener">pubmed.ncbi.nlm.nih.gov/26563483</a><span class="rd"> — published case reports (subject to publication and selection bias): most reported injuries in the first month, with late cases; not a population incidence estimate</span></li>'+
         '<li><b>Sylvester JE, Buchanan BK, Paradise SL, Yauger JJ, Beutler AI. Association of splenic rupture and infectious mononucleosis: a retrospective analysis and review of return-to-play recommendations. Sports Health 2019;11:543–9</b><br><a href="https://pubmed.ncbi.nlm.nih.gov/31550435/" rel="noopener">pubmed.ncbi.nlm.nih.gov/31550435</a><span class="rd"> — retrospective analysis: risk of splenic injury may remain elevated beyond the first month; exact incidence estimates are uncertain</span></li>'+
         '<li><b>NHS (nhs.uk) — Glandular fever, accessed Sep 2026</b><br><a href="https://www.nhs.uk/conditions/glandular-fever/" rel="noopener">nhs.uk/conditions/glandular-fever</a><span class="rd"> — national patient information: do not do strenuous activities like heavy lifting or playing sports while recovering; most feel better within 2–4 weeks</span></li>'+
         '<li><b>East Kent Hospitals University NHS Foundation Trust — Glandular fever, patient information (Head and Neck)</b><br><a href="https://leaflets.ekhuft.nhs.uk/glandular-fever/html/" rel="noopener">leaflets.ekhuft.nhs.uk</a><span class="rd"> — local patient advice, not national guidance: avoid rough or contact sports for at least eight weeks (enlarged spleen). A conservative UK practice recommendation, not a definitive evidence-based threshold</span></li>'+
         '<li><b>American Medical Society for Sports Medicine position statement: mononucleosis and athletic participation. Clin J Sport Med 2023;33(4):359–67 — international sports-medicine consensus, not the default UK pathway</b>; and Putukian M et al., Clin J Sport Med 2008;18:309–15<span class="rd"> — heavy exertion earlier than 2–3 weeks may prolong fatigue; contact sport from 3–4 weeks with shared decision-making. Less conservative than the UK NHS advice, so not used as the default</span></li>'+
         '<li><b>Rezk E, et al. Steroids for symptom control in infectious mononucleosis. Cochrane Database Syst Rev 2015 (CD004402)</b><br><a href="https://www.cochranelibrary.com/cdsr/doi/10.1002/14651858.CD004402.pub3/full" rel="noopener">cochranelibrary.com</a><span class="rd"> — 7 trials, 362 participants; insufficient evidence of benefit</span></li>'+
         '<li><b>De Paor M, et al. Antiviral agents for infectious mononucleosis (glandular fever). Cochrane Database Syst Rev 2016 (CD011487)</b><br><a href="https://www.cochranelibrary.com/cdsr/doi/10.1002/14651858.CD011487.pub2/full" rel="noopener">cochranelibrary.com</a><span class="rd"> — 7 RCTs, 333 participants; effectiveness uncertain, evidence very low quality</span></li>'+
         '<li><b>Katz BZ, et al. Chronic fatigue syndrome after infectious mononucleosis in adolescents. Pediatrics 2009;124(1):189</b><span class="rd"> — cohort data on chronic fatigue after infectious mononucleosis in adolescents; does not imply a predictable course in all patients</span></li>'+
         '<li><b>Amoxicillin capsules SPC (emc), section 4.4 Special warnings</b><br><a href="https://www.medicines.org.uk/emc/product/10638/smpc" rel="noopener">medicines.org.uk/emc</a><span class="rd"> — avoid if infectious mononucleosis is suspected (morbilliform rash). Check the current version of the SPC for the exact product prescribed</span></li>'+
         '<li><b>BHIVA/BASHH/BIA adult HIV testing guidelines 2020</b><br><a href="https://bhiva.org/clinical-guideline/hiv-testing-guidelines/" rel="noopener">bhiva.org</a><span class="rd"> — mononucleosis-like syndrome as an indicator condition for HIV testing; fourth-generation test, repeat after the window period</span></li>'+
         '<li><b>NICE QS157 — HIV testing: encouraging uptake, quality statement 3 (indicator conditions)</b><br><a href="https://www.nice.org.uk/guidance/qs157" rel="noopener">nice.org.uk/guidance/qs157</a><span class="rd"> — offer HIV testing to people with an indicator condition</span></li>'+
         '<li><b>UKHSA — Health protection in children and young people settings, including education: exclusion table</b><br><a href="https://www.gov.uk/government/publications/health-protection-in-schools-and-other-childcare-facilities" rel="noopener">gov.uk</a><span class="rd"> — glandular fever: no exclusion</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — all doses (paracetamol, ibuprofen, phenoxymethylpenicillin, clarithromycin, erythromycin), checked with the local formulary and product information</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Glandular fever (infectious mononucleosis) — assessment and management in primary care, using NICE NG84 (sore throat), NICE NG12 (lymphadenopathy and leukaemia criteria) and NICE NG206 (ME/CFS), with Ebell (JAMA 2016), Bartlett (Injury 2016), Cochrane reviews of steroids (2015) and antivirals (2016), the amoxicillin SPC and the UKHSA exclusion table. EBV serology via the local laboratory pathway is the preferred confirmatory test. Contact sport is avoided for at least 4 weeks from onset, with a more conservative 8-week restriction (local NHS patient advice) particularly for collision sports; case-report timing data do not give a reliable incidence, and the AMSSM 2023 statement is international context only. Verify doses in the current BNF."
});
