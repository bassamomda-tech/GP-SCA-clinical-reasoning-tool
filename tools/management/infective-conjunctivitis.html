<script>
MG.render({ snapshot:"summaries/infective-conjunctivitis.html",
  icon:"👁️",
  title:"Infective conjunctivitis",
  eyebrow:"Protocol · ophthalmology · exclude the red eye that is not conjunctivitis",
  stemTitle:"Infective conjunctivitis: rule out the dangerous red eye, then self-care for most and a topical antibiotic only for some",
  stemSub:"One page for the sticky or gritty red eye. Most infective conjunctivitis is self-limiting: bacterial usually settles within 5–7 days and viral within 1–2 weeks (sometimes longer). The GP's job is to spot the red eye that is not simple conjunctivitis — pain, photophobia, reduced vision, a contact lens wearer, a newborn, or a hyperacute purulent discharge — and to avoid unnecessary antibiotics. NICE CKS supports self-care first, with chloramphenicol or fusidic acid when infection is severe or does not settle. Children do not need to stay off school (UKHSA).",
  guideline:"NICE CKS Conjunctivitis – infective (revised 2022) · UKHSA Health protection in children and young people settings (2023) · Chloramphenicol and fusidic acid SPCs · MHRA Drug Safety Update (July 2021) · College of Optometrists CMGs · BASHH chlamydia and gonorrhoea guidelines",
  reviewed:"15 October 2026",
  nextReview:"April 2027",
  meta:[
    {t:"NICE CKS · infective conjunctivitis"},
    {t:"Pain, photophobia, reduced vision → same day", tone:"tw"},
    {t:"UKHSA · no school exclusion"},
    {t:"Reviewed October 2026 · next review April 2027"}
  ],
  lead:"<div class='mg-layers'><a href='#redflags'><b>Red flags</b><small>pain, vision, lenses, neonate</small></a><a href='#diagnose'><b>Which type?</b><small>bacterial, viral, STI</small></a><a href='#treat'><b>Treat</b><small>self-care, then antibiotic</small></a><a href='#patient'><b>Advice</b><small>school, lenses, hygiene</small></a></div>",
  quickSub:"Six points that change what you do today. Each one is traced to a named source under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"Pain, photophobia or reduced vision: not simple conjunctivitis", html:"Conjunctivitis is gritty or itchy, not painful, and vision clears with blinking. <b>Moderate to severe eye pain</b>, <b>photophobia</b>, <b>reduced visual acuity</b>, a <b>fixed or irregular pupil</b>, <b>ciliary (perilimbal) redness</b> or a corneal opacity suggest keratitis, iritis, acute angle-closure glaucoma or scleritis → <b>same-day ophthalmology</b> (eye casualty)."},
    {tone:"red", h:"Contact lens wearer with a red eye: same day", html:"A contact lens wearer with a painful red eye, photophobia, reduced vision or a corneal lesion may have <b>microbial keratitis</b> (including Acanthamoeba) → stop lens wear and arrange <b>same-day eye assessment</b>. Do not treat as simple conjunctivitis. Advise no lenses until symptoms have resolved and 24 hours after finishing any treatment."},
    {tone:"red", h:"Babies under 28 days: ophthalmia neonatorum", html:"Conjunctivitis in a <b>neonate</b> (first 28 days) may be gonococcal or chlamydial and can damage the cornea quickly, or cause pneumonia → <b>same-day</b> referral to ophthalmology or paediatrics according to local pathway. The mother and partner need sexual health assessment."},
    {tone:"amber", h:"Hyperacute pus or sexual transmission: think gonorrhoea and chlamydia", html:"Copious purulent discharge with rapid onset, marked lid swelling and pain suggests <b>gonococcal</b> conjunctivitis → <b>same-day</b> ophthalmology. Chronic (more than 2 weeks), follicular conjunctivitis not responding to treatment, especially with genital symptoms or a new partner, suggests <b>chlamydial</b> infection → test and refer to sexual health; systemic treatment is needed."},
    {tone:"cream", h:"Antibiotics: not for most", html:"Most bacterial conjunctivitis settles in 5–7 days without treatment. Advise self-care (cleaning lids, cool compress, lubricants). <b>Consider</b> a topical antibiotic if severe, or a delayed prescription to use if not improving after about 3 days. <b>Chloramphenicol</b> is first line (MHRA 2021: borax-containing drops can be used under 2 years); <b>fusidic acid</b> is an alternative. Antibiotics do not help viral conjunctivitis."},
    {tone:"green", h:"School, work and the pharmacy", html:"<b>No school or nursery exclusion</b> is needed for conjunctivitis (UKHSA), unless there is an outbreak. Good hand and towel hygiene reduces spread. Community pharmacies can supply <b>chloramphenicol</b> over the counter for adults and children aged 2 and over."}
  ],
  pathwaySub:"Five moves. The first is the one that protects sight.",
  pathway:[
    {title:"Screen for the dangerous red eye", alert:true, html:"Pain, photophobia, reduced acuity, contact lenses, recent trauma or chemical injury, corneal staining, abnormal pupil, a neonate, immunosuppression. Any → same-day eye assessment."},
    {title:"Check visual acuity", alert:true, html:"Every red eye: record visual acuity (Snellen or a near chart) in each eye, with glasses. Use fluorescein if available."},
    {title:"Decide the type", html:"Bacterial (purulent, lids stuck), viral (watery, follicles, preauricular node, recent cold or contact), allergic (itch, bilateral, atopy), chlamydial or gonococcal (sexual history)."},
    {title:"Treat proportionately", html:"Self-care for most. Consider chloramphenicol (or fusidic acid) if severe or not settling, or a delayed prescription. No antibiotic for viral infection."},
    {title:"Advise and safety-net", html:"Hygiene, no lenses, no school exclusion, return if pain, photophobia or reduced vision, or not improving after 7 days (bacterial) or 2 weeks (viral)."}
  ],
  sections:[
    {id:"redflags", nav:"Red flags", title:"Red flags: the red eye that is not conjunctivitis", sub:"Pain, photophobia and reduced vision are the three questions that separate conjunctivitis from sight-threatening disease.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Keratitis, iritis, acute glaucoma or scleritis", html:"Moderate or severe pain, photophobia, reduced acuity, ciliary flush, corneal opacity or staining, irregular or fixed mid-dilated pupil, headache and vomiting (angle closure). → <b>same-day ophthalmology</b>.", src:"NICE CKS Red eye · NICE CKS Conjunctivitis – infective"},
         {tone:"red", h:"🔴 Contact lens wearer", html:"Painful red eye, photophobia or reduced vision in a lens wearer → stop lenses, <b>same-day</b> eye assessment for microbial keratitis. Do not prescribe a steroid.", src:"NICE CKS Conjunctivitis – infective · College of Optometrists CMG: microbial keratitis"},
         {tone:"red", h:"🔴 Neonate (under 28 days)", html:"Any conjunctivitis in the first 28 days → <b>same-day</b> ophthalmology or paediatric assessment; swabs for gonorrhoea and chlamydia (NAAT) and culture.", src:"NICE CKS Conjunctivitis – infective"},
         {tone:"red", h:"🔴 Suspected gonococcal conjunctivitis", html:"Hyperacute, profuse purulent discharge, lid swelling, pain → <b>same-day</b> ophthalmology; corneal perforation can occur within days. Refer contacts to sexual health.", src:"NICE CKS Conjunctivitis – infective · BASHH gonorrhoea guideline"},
         {tone:"red", h:"🔴 Chemical injury or penetrating trauma", html:"Chemical splash → irrigate immediately for at least 15–20 minutes, then <b>same-day</b> eye casualty. Suspected penetrating injury → shield the eye and arrange same-day eye casualty.", src:"NICE CKS Red eye"},
         {tone:"amber", h:"🟠 Peri-orbital swelling or systemic illness", html:"Painful swollen lids, fever, reduced eye movements or proptosis suggest orbital cellulitis → <b>same-day</b> hospital assessment. Herpes zoster or herpes simplex involving the eye → same-day eye assessment.", src:"NICE CKS Red eye"}
       ]},
       {b:"why", html:"Simple conjunctivitis inflames the conjunctiva only: the cornea, iris and pressure are normal, so vision is preserved and pain is mild. Anything that affects the cornea or the inside of the eye causes pain, photophobia and blurred vision. That is why acuity is the single most important measurement in any red eye."}
     ]},

    {id:"diagnose", nav:"Diagnose", title:"Which type of conjunctivitis?", sub:"The history and a quick look usually decide it. Swabs are not routine.",
     blocks:[
       {b:"table", head:["Type","Typical features","Course and action"], rows:[
         ["<b>Bacterial</b>","Purulent or mucopurulent discharge, lids stuck together in the morning, often starts in one eye then the other; mild gritty discomfort","Usually settles in 5–7 days. Self-care; consider topical antibiotic if severe or not settling."],
         ["<b>Viral (adenovirus)</b>","Watery discharge, follicles, tender preauricular lymph node, recent upper respiratory infection or contact; often both eyes, very contagious","Can last 1–2 weeks, sometimes 3 or more. Self-care; no antibiotic. Keratitis with blurred vision can follow."],
         ["<b>Herpes simplex</b>","Unilateral, vesicles on lids, dendritic ulcer with fluorescein, pain","Same-day eye assessment; never topical steroids."],
         ["<b>Chlamydial (adult inclusion)</b>","Chronic follicular conjunctivitis (more than 2 weeks), unilateral or bilateral, not responding to topical treatment; genital symptoms or new partner","Swab (NAAT) and refer to sexual health; needs oral treatment and partner notification."],
         ["<b>Gonococcal</b>","Hyperacute, profuse pus, marked swelling and pain","Same-day ophthalmology."],
         ["<b>Allergic</b>","Itch dominant, bilateral, watery, atopy, seasonal","See the allergic conjunctivitis protocol."]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"🧪 When to swab", html:"Not routinely. Swab for bacterial culture and viral and chlamydia NAAT if severe, recurrent or not responding to treatment, in neonates, or if gonococcal or chlamydial infection is suspected.", src:"NICE CKS Conjunctivitis – infective"},
         {tone:"blue", h:"🩺 Examination", html:"Visual acuity, lids and lashes, discharge, conjunctival versus ciliary redness, cornea with fluorescein, pupils, preauricular nodes.", src:"NICE CKS Conjunctivitis – infective"}
       ]}
     ]},

    {id:"treat", nav:"Treat", title:"Treatment", sub:"Self-care first. A topical antibiotic shortens bacterial conjunctivitis slightly but most people recover without one.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1", tone:"green", title:"Self-care", when:"all types", fromLabel:"then",
          html:"Clean lids with cooled boiled water and cotton wool, from the inner corner outwards. Cool compresses and lubricating drops for comfort. Do not share towels or pillows; wash hands after touching the eyes. No contact lenses until resolved."},
         {step:"2", tone:"cream", title:"Consider a topical antibiotic or a delayed prescription", when:"bacterial: severe, or not improving after about 3 days", fromLabel:"consider",
          html:"<span class=mg-dose>Usual adult dose: chloramphenicol 0.5% eye drops, 1 drop every 2 hours for the first 2 days, then every 4 hours while awake; continue for 48 hours after the eye has healed (NICE CKS/SPC; check the SPC, BNF and local formulary; <a href=https://www.medicines.org.uk/emc/search?q=chloramphenicol+eye target=_blank rel=noopener>SPC: chloramphenicol eye drops</a>).</span> Chloramphenicol 1% ointment can be used at night, or 3–4 times daily alone. <span class=mg-dose>Usual adult dose: fusidic acid 1% viscous eye drops, 1 drop twice daily for 7 days (NICE CKS/SPC; check the SPC, BNF and local formulary; <a href=https://www.medicines.org.uk/emc/search?q=fusidic+acid+eye target=_blank rel=noopener>SPC: fusidic acid eye drops</a>).</span> Children: see the BNFC."},
         {step:"3", tone:"amber", title:"Not settling", when:"after 7 days of treatment, or worsening", fromLabel:"reassess",
          html:"Re-examine; check acuity and the cornea; swab; consider chlamydia, herpes simplex or an alternative diagnosis; refer if unclear."}
       ]},
       {b:"table", head:["Situation","Choice"], rows:[
         ["<b>Children under 2</b>","Chloramphenicol drops containing borax or boric acid can be used (MHRA, July 2021). Pharmacy over-the-counter supply is for 2 years and over; under 2 needs a prescriber."],
         ["<b>Pregnancy and breastfeeding</b>","Check the SPC: fusidic acid is often preferred in pregnancy; chloramphenicol is generally avoided near term because of a theoretical risk to the baby."],
         ["<b>Viral</b>","No antibiotic. Lubricants and self-care. Refer if vision becomes blurred (keratitis)."],
         ["<b>Chlamydial or gonococcal</b>","Systemic treatment via sexual health or ophthalmology; topical antibiotics alone are not enough."]
       ]},
       {b:"warn", html:"<b>Never prescribe topical corticosteroids</b> for a red eye in primary care: they can worsen herpes simplex keratitis and fungal or bacterial keratitis and raise eye pressure."},
       {b:"say", html:"This looks like an eye infection that usually clears up on its own within about a week. Bathing the eye and keeping your hands and towels clean is the main treatment. If it isn't better in a few days, the antibiotic drops may speed things up a little. Come back the same day if the eye becomes painful, bright light hurts, or your vision goes blurry."}
     ]},

    {id:"special", nav:"Special groups", title:"Special groups", sub:"Where the default plan changes.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"👶 Neonates", html:"Same-day assessment for any conjunctivitis in the first 28 days. Sticky eyes from a blocked tear duct (watery, no redness) are common and different.", src:"NICE CKS Conjunctivitis – infective"},
         {tone:"amber", h:"🔍 Contact lens wearers", html:"Stop lenses until resolved and 24 hours after the last antibiotic dose; discard disposable lenses and the case. Painful red eye → same-day assessment.", src:"NICE CKS Conjunctivitis – infective"},
         {tone:"amber", h:"🛡️ Immunosuppression", html:"Lower threshold for swabbing and specialist advice.", src:"NICE CKS Conjunctivitis – infective"},
         {tone:"blue", h:"🏥 Recurrent or chronic", html:"Consider blepharitis, dry eye, chlamydia, allergy, or a lacrimal problem.", src:"NICE CKS Conjunctivitis – infective"}
       ]}
     ]},

    {id:"followup", nav:"Follow-up", title:"Monitoring and follow-up", sub:"No routine follow-up is needed.",
     blocks:[
       {b:"kv", rows:[
         ["Bacterial","Return if not improving after 7 days of treatment, or sooner if worse."],
         ["Viral","Can last 2–3 weeks; return if vision blurs, pain develops, or symptoms continue beyond 3 weeks."],
         ["Chlamydial","Follow sexual health advice on test of cure and partner notification."]
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral", sub:"Who, where and how fast.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same day: eye casualty or ophthalmology", html:"Pain, photophobia, reduced vision, corneal involvement, contact lens wearer with a painful red eye, suspected gonococcal infection, herpes simplex or zoster involving the eye, chemical or penetrating injury.", src:"NICE CKS Conjunctivitis – infective · NICE CKS Red eye"},
         {tone:"red", h:"Same day: paediatrics or ophthalmology", html:"Any neonate (under 28 days) with conjunctivitis.", src:"NICE CKS Conjunctivitis – infective"},
         {tone:"amber", h:"Sexual health", html:"Suspected or confirmed chlamydial or gonococcal conjunctivitis, for systemic treatment, other STI testing and partner notification.", src:"BASHH guidelines"},
         {tone:"amber", h:"Ophthalmology (soon)", html:"Symptoms persisting despite treatment with diagnostic uncertainty; recurrent infections. Many areas have community urgent eye care services (optometry) for these.", src:"NICE CKS Conjunctivitis – infective"}
       ]}
     ]},

    {id:"patient", nav:"Safety-net", title:"Patient information and safety-netting", sub:"Hygiene, school and lenses are the questions families ask.",
     blocks:[
       {b:"say", html:"Come back or contact NHS 111 the same day if your eye becomes painful, bright light hurts, your vision becomes blurred, or you wear contact lenses and the eye is getting worse. For a baby under four weeks old with a red or sticky eye, contact us the same day. Your child doesn't need to stay off school or nursery."},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"✅ Hygiene", html:"Wash hands often; do not share towels, pillows or make-up; throw away eye make-up used during the infection. Viral conjunctivitis spreads easily, including in swimming pools.", src:"NICE CKS Conjunctivitis – infective"},
         {tone:"green", h:"🏪 Pharmacy", html:"Pharmacists can advise and supply chloramphenicol drops or ointment for adults and children aged 2 and over. NHS website: conjunctivitis.", src:"Chloramphenicol (pharmacy) SPC · NHS website"}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Scenario", html:"A 28-year-old who wears monthly contact lenses has had a red, watering right eye for 2 days. She bought chloramphenicol from the pharmacy but the eye is now more painful and bright light hurts.", src:"NICE CKS Conjunctivitis – infective"},
       {tone:"cream", h:"What a good consultation does", html:"Recognises <b>pain and photophobia in a contact lens wearer</b> as possible microbial keratitis, checks visual acuity, advises stopping lens wear and arranges <b>same-day</b> eye assessment. Asks her to bring the lenses and case. Avoids steroids.", src:"NICE CKS Conjunctivitis – infective"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Every recommendation on this page traces to a named primary source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE Clinical Knowledge Summaries — Conjunctivitis: infective (revised 2022)</b><br><a href="https://cks.nice.org.uk/topics/conjunctivitis-infective/" rel="noopener">cks.nice.org.uk/topics/conjunctivitis-infective</a><span class="rd"> — types, red flags, self-care, consider topical antibiotic if severe or delayed prescribing, chloramphenicol and fusidic acid regimens, contact lenses, neonates, referral</span></li>'+
         '<li><b>NICE Clinical Knowledge Summaries — Red eye</b><br><a href="https://cks.nice.org.uk/topics/red-eye/" rel="noopener">cks.nice.org.uk/topics/red-eye</a><span class="rd"> — differential diagnosis and urgent referral</span></li>'+
         '<li><b>UKHSA — Health protection in children and young people settings, including education (exclusion table, 2023)</b><br><a href="https://www.gov.uk/government/publications/health-protection-in-schools-and-other-childcare-facilities" rel="noopener">gov.uk — exclusion table</a><span class="rd"> — no exclusion for conjunctivitis unless an outbreak</span></li>'+
         '<li><b>MHRA Drug Safety Update — Chloramphenicol eye drops containing borax or boric acid buffers: use in children younger than 2 years (July 2021)</b><br><a href="https://www.gov.uk/drug-safety-update/chloramphenicol-eye-drops-containing-borax-or-boric-acid-buffers-use-in-children-younger-than-2-years" rel="noopener">gov.uk — MHRA DSU July 2021</a><span class="rd"> — benefits outweigh risks under 2</span></li>'+
         '<li><b>College of Optometrists — Clinical Management Guidelines: conjunctivitis (bacterial, adenoviral, chlamydial) and microbial keratitis</b><br><a href="https://www.college-optometrists.org/clinical-guidance/clinical-management-guidelines" rel="noopener">college-optometrists.org — CMGs</a><span class="rd"> — contact lens keratitis, urgency</span></li>'+
         '<li><b>BASHH — UK national guidelines for Chlamydia trachomatis (2015) and gonorrhoea (2019)</b><br><a href="https://www.bashh.org/resources/guidelines" rel="noopener">bashh.org — guidelines</a><span class="rd"> — systemic treatment, partner notification</span></li>'+
         '<li><b>SPCs — chloramphenicol 0.5% eye drops and 1% ointment; fusidic acid 1% viscous eye drops</b><br><a href="https://www.medicines.org.uk/emc" rel="noopener">medicines.org.uk/emc</a><span class="rd"> — dosing, pharmacy supply age, pregnancy</span></li>'+
         '<li><b>Sheikh A, Hurwitz B. Antibiotics versus placebo for acute bacterial conjunctivitis. Cochrane Database Syst Rev (update Chen 2023, CD001211)</b><br><a href="https://www.cochranelibrary.com/cdsr/doi/10.1002/14651858.CD001211.pub4/full" rel="noopener">cochranelibrary.com — CD001211</a><span class="rd"> — modest benefit; high spontaneous resolution</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Infective conjunctivitis — NICE CKS Conjunctivitis – infective (revised 2022), NICE CKS Red eye, UKHSA exclusion guidance, MHRA (July 2021), College of Optometrists CMGs and BASHH guidelines. Check doses in the current SPC, BNF/BNFC and local formulary. Not a substitute for clinical judgement."
});
</script>
