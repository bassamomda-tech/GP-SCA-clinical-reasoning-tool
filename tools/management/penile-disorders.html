  quickSub:"If you read nothing else on this page, read these six cards. Every number traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"\u26a0 A non-healing penile lesion is cancer until proven otherwise", html:"A persistent ulcer, nodule or warty growth on the glans or shaft not healing within 3\u20134 weeks \u2192 2WW urology. <b>Do not keep re-treating it as infection.</b> Risk factors: phimosis with retained smegma, HPV-16/18, lichen sclerosus, smoking, lack of circumcision, immunosuppression. Palpable inguinal nodes are present in about 50% at diagnosis of penile SCC."},
    {tone:"red", h:"Pain disproportionate to the skin is Fournier's gangrene", html:"Rapidly spreading scrotal, perineal or penile redness with severe pain out of proportion to the findings, crepitus, fever and systemic illness \u2192 999. Mortality is approximately 20\u201340% even with treatment, and surgery \u2014 not antibiotics \u2014 is the primary treatment. <b>Stop any SGLT2 inhibitor.</b> Early skin appearance is deceptively mild; crepitus is a late sign and must not be awaited."},
    {tone:"amber", h:"Lichen sclerosus is the condition to stop missing", html:"White, atrophic, shiny plaques on the glans and inner foreskin, often with a white ring at the preputial orifice. Frequently misdiagnosed as recurrent candidal balanitis and treated with antifungals for months or years, while it progresses to phimosis, meatal stenosis and SCC in approximately 2\u20135%. <b>Clobetasol 0.05% ointment is highly effective if started early.</b>"},
    {tone:"blue", h:"Four emergencies, four clocks", html:"<b>Paraphimosis</b> \u2014 reduce promptly; delay worsens oedema and risks glans ischaemia. <b>Ischaemic priapism</b> \u2014 treat within <b>4\u20136 hours</b> to preserve erectile function. <b>Penile fracture</b> \u2014 surgical repair <b>within 24 hours</b>. <b>Fournier's</b> \u2014 immediate debridement. Every hour of delay in priapism increases the risk of permanent erectile dysfunction."},
    {tone:"purple", h:"A painless penile ulcer is syphilis until proven otherwise", html:"Primary syphilis is a single painless ulcer with a clean base, indurated edges and non-tender inguinal lymphadenopathy \u2014 unlike HSV, which is extremely painful. <b>It heals spontaneously in 3\u20136 weeks untreated, then progresses.</b> UK incidence has risen sharply since 2010, with about 8,000 cases a year in England. Any penile ulcer in a sexually active man needs syphilis serology (TPHA + RPR)."},
    {tone:"green", h:"Document the examination \u2014 it is the medicolegal standard", html:"Record whether the foreskin was retracted, describe the lesion (size, colour, morphology, induration), state whether inguinal nodes were palpated, and record the 2WW decision with reasoning if not referred. Treating a penile ulcer three times with antifungal cream over 6 weeks without biopsy, referral or documented examination is indefensible."}

  pathway:[
    {title:"Screen for cancer and the four emergencies", html:"Persistent ulcer, mass or induration \u2192 2WW. Paraphimosis, ischaemic priapism, penile fracture, Fournier's gangrene \u2192 999 or same-day urology.", alert:true},
    {title:"Classify by site", html:"Foreskin (phimosis, paraphimosis, posthitis) \u00b7 glans and skin (balanitis, lichen sclerosus, erythroplasia of Queyrat, lichen planus) \u00b7 structural (Peyronie's) \u00b7 infective (HSV, syphilis, gonorrhoea, chlamydia, warts)."},
    {title:"Examine properly and swab", html:"Retract the foreskin with consent; examine foreskin, glans, meatus, shaft, urethra, scrotum and inguinal nodes. <b>Swabs, syphilis serology, HSV PCR, HbA1c, HIV test as indicated.</b>"},
    {title:"Treat by diagnosis", html:"Candidal balanitis \u2192 clotrimazole and treat the cause. BXO \u2192 clobetasol induction then maintenance. Peyronie's \u2192 phase-dependent. STI \u2192 BASHH regimens plus GUM."},
    {title:"Review, safety-net, document", html:"Review at 3 months for BXO with annual malignancy surveillance; any lesion not healing at 3\u20134 weeks \u2192 2WW. Record the examination to the documentation standard."}

  sections:[

    {id:"severe", nav:"Emergencies", title:"Red flags — penile cancer, Fournier's gangrene, priapism and fracture",
     sub:"A non-healing penile lesion is cancer until proven otherwise. Four separate urological emergencies also present here.",
     blocks:[
       {b:"table", head:["Presentation","Diagnosis","Action"], rows:[
         ["Persistent ulcer, nodule or warty growth on the glans or shaft not healing within 3\u20134 weeks, in an older man","<b>Penile squamous cell carcinoma.</b> Risk factors: phimosis (retained smegma), HPV-16/18, lichen sclerosus (penile LS \u2192 SCC in approximately 2\u20135%), smoking, lack of circumcision, immunosuppression","<b>2WW urology</b>"],
         ["Rapidly spreading scrotal, perineal or penile redness + severe pain disproportionate to findings + crepitus + fever + systemic illness","<b>Fournier's gangrene</b> (necrotising fasciitis of the genitalia and perineum). <b>Mortality approximately 20\u201340% even with treatment</b>","999. Immediate surgical debridement is life-saving. IV antibiotics (ceftriaxone + metronidazole + vancomycin) are adjunctive \u2014 surgery is primary"],
         ["Painful persistent erection &gt;4 hours unrelated to sexual stimulation","<b>Ischaemic priapism</b> \u2014 compartment syndrome of the corpus cavernosum","999. Aspiration of the corpus cavernosum \u00b1 intracavernosal phenylephrine under urology guidance. Every hour of delay increases the risk of permanent erectile dysfunction"],
         ["Penile skin colour change, induration and progressive fibrosis in an SGLT2 inhibitor user (dapagliflozin, empagliflozin, canagliflozin)","<b>Fournier's gangrene associated with SGLT2 inhibitors</b> \u2014 rare but documented in FDA and MHRA pharmacovigilance","Stop the SGLT2 inhibitor and refer urgently to urology if there are any scrotal or penile skin changes with pain"],
         ["Sudden audible \u201ccrack\u201d during sexual activity + immediate loss of erection + rapid penile haematoma + \u201ceggplant deformity\u201d","<b>Penile fracture</b> \u2014 rupture of the tunica albuginea","999 or immediate urology. Surgical repair within 24 h reduces the risk of permanent penile deformity and ED"],
         ["Non-reducible foreskin retracted behind the glans + oedematous glans + pain","<b>Paraphimosis</b> \u2014 a urological emergency","999 or same-day urology. Manual reduction under local anaesthesia (ice and pressure to reduce oedema, then the foreskin manipulated forward). Dorsal slit or circumcision if reduction fails"]
       ]},
       {b:"why", html:"Fournier's gangrene is one of the most rapidly fatal infections in clinical medicine \u2014 a synergistic polymicrobial necrotising fasciitis (predominantly anaerobes plus gram-negative aerobes) of the genitalia, perineum and perianal region, with <b>mortality of approximately 20\u201340% despite modern treatment</b>. The critical diagnostic challenge is that the external appearance in early Fournier's is deceptively mild \u2014 initially only erythema, progressing rapidly to dusky or necrotic skin. The most important clinical sign is pain DISPROPORTIONATE to the visible skin changes, because the infection spreads along fascial planes deep to the dermis while the overlying skin looks relatively intact. Crepitus is a late and pathognomonic sign and must not be awaited before acting. Any man with genital pain, swelling, fever and systemic illness out of proportion to the visible changes should be considered to have Fournier's gangrene until proved otherwise \u2014 999."},
       {b:"dl", rows:[
         ["<b>NG12 \u2014 the criterion that applies here</b>","NICE NG12: consider a suspected cancer pathway referral for penile cancer in men with either a penile mass or ulcerated lesion where a sexually transmitted infection has been excluded as a cause, or a persistent penile lesion after treatment for a sexually transmitted infection has been completed. In practice on this page that means: any penile ulcer, nodule or warty growth not healing within 3\u20134 weeks, erythroplasia of Queyrat, and penile lichen sclerosus not responding to clobetasol \u2014 and it means not re-treating a persistent lesion as infection a third time. The source cites NG12 as a 2015 document; the current version is <b>May 2025</b>, which this page follows. Restated in <a href='#refer'>Refer</a>"]
       ]}
     ]},

    {id:"confirm", nav:"Classify", title:"Classification of penile disorders",
     blocks:[
       {b:"dl", rows:[
         ["<b>Foreskin disorders (intact foreskin)</b>","Phimosis (non-retractile foreskin): physiological phimosis is normal in boys until approximately 3\u20135 years \u2014 the foreskin fuses to the glans neonatally and separates progressively. Pathological phimosis: fibrous scarring of the preputial ring, often from lichen sclerosus (BXO \u2014 balanitis xerotica obliterans), with difficulty retracting for hygiene or intercourse, a spraying urinary stream, and recurrent infections. Paraphimosis: a retracted foreskin that cannot be reduced over the glans \u2014 an immediate emergency. Posthitis: infection or inflammation of the foreskin"],
         ["<b>Glans and penile skin disorders</b>","Balanitis \u2014 inflammation of the glans. Candidal balanitis (most common; moist environment, diabetes, recent antibiotics): erythema, white discharge under the foreskin, satellite lesions. Bacterial balanitis (anaerobes and gram-negatives): offensive discharge. Circinate balanitis (reactive arthritis): painless erythematous plaques. Lichen sclerosus (BXO): white atrophic shiny plaques on glans and foreskin, foreskin scarring, phimosis, meatal stenosis. Erythroplasia of Queyrat: penile intraepithelial neoplasia (VIN) \u2192 2WW"],
         ["<b>Erectile and structural disorders</b>","Peyronie's disease: a fibrous plaque in the tunica albuginea causing penile curvature (typically upward or lateral during erection), pain in the acute phase and erectile dysfunction \u2014 affecting approximately 3\u20139% of men. Lichen planus (penile): violaceous papules or plaques on the glans, associated with oral LP. Genital warts (HPV). STIs with penile manifestations: HSV (painful vesicles or ulcers), syphilis (painless ulcer or chancre with non-tender lymphadenopathy), gonorrhoea and chlamydia (urethral discharge)"]
       ]},
       {b:"warn", html:"Penile lichen sclerosus is the most important benign penile condition for GPs to diagnose correctly, for three reasons: (1) it is frequently misdiagnosed as recurrent candidal balanitis and treated empirically with antifungals for months to years; (2) inadequately treated penile LS progresses to phimosis, meatal stenosis and penile SCC (approximately 2\u20135% malignant transformation); and (3) first-line clobetasol 0.05% ointment is highly effective if started early. The appearance: white, atrophic, shiny plaques on the glans, inner foreskin and prepuce \u2014 often with a white ring at the preputial orifice causing pathological phimosis. Biopsy if the diagnosis is uncertain or the lesion is not responding to clobetasol. Annual examination for malignant transformation: any new ulcer, induration or non-healing lesion on a background of LS is a 2WW referral."}
     ]},

    {id:"workup", nav:"Assess", title:"History, examination and investigations",
     blocks:[
       {b:"table", head:["Domain","Detail"], rows:[
         ["<b>History \u2014 symptoms</b>","Pain (balanitis, paraphimosis, lichen sclerosus, priapism) \u00b7 discharge (balanitis, STI) \u00b7 difficulty retracting the foreskin (phimosis, LS/BXO) \u00b7 ulcer (SCC, syphilis, HSV, chancroid) \u00b7 penile curvature (Peyronie's) \u00b7 swelling (paraphimosis, acute Peyronie's, priapism, oedema)"],
         ["<b>History \u2014 risk</b>","Sexual history: new partners, unprotected intercourse, symptoms in a partner. Drug history: SGLT2 inhibitors (Fournier's risk), anticoagulants, alpha-blockers, and trazodone (priapism reported). Medical history: diabetes (candidal balanitis, Fournier's risk), sickle cell disease (priapism \u2014 a major complication), haematological malignancy, spinal cord injury. Circumcision status"],
         ["<b>Examination</b>","Retract the foreskin (with consent). Systematic: foreskin (phimosis, paraphimosis, posthitis, BXO changes) \u00b7 glans (colour, lesions \u2014 ulcers, plaques, warts, nodules \u00b7 meatus \u2014 stenosis, discharge) \u00b7 shaft (Peyronie's plaque \u2014 palpable cord-like induration, palpable in approximately 70% of cases) \u00b7 urethra (meatal position \u2014 hypospadias, discharge) \u00b7 scrotum and testes \u00b7 inguinal lymphadenopathy \u2014 in penile SCC, palpable nodes are present in approximately 50% at diagnosis; in STI, tender means reactive and non-tender suggests metastatic or secondary syphilis"],
         ["<b>Investigations</b>","Urethral swab and penile swab (gonorrhoea and chlamydia, STI screen) \u00b7 HbA1c \u00b7 syphilis serology (TPHA + RPR) for a painless ulcer \u00b7 HSV PCR swab for painful vesicles or ulcers \u00b7 HIV test if an STI is identified or there are risk factors \u00b7 penile USS (Peyronie's plaque characterisation; priapism flow assessment, high-flow versus low-flow) \u00b7 blood film and FBC (leukaemia \u2014 priapism) \u00b7 haemoglobin electrophoresis (sickle cell \u2014 priapism)"]
       ]},
       {b:"why", html:"The syphilis chancre is the most important STI diagnosis not to miss at a \u201cbalanitis\u201d or \u201cpenile ulcer\u201d consultation. Primary syphilis presents as a single, painless, well-defined ulcer with a clean base and indurated edges, typically on the glans or inner foreskin. It is painless (unlike HSV, which is extremely painful), has a hardened base (unlike the soft shallow base of aphthous ulcers), and comes with unilateral or bilateral non-tender inguinal lymphadenopathy. Untreated, the primary chancre heals spontaneously in 3\u20136 weeks \u2014 but syphilis then progresses to secondary and tertiary disease. UK incidence has risen dramatically since 2010, with approximately 8,000 cases reported per year in England (2023 PHE data). Any penile ulcer in a sexually active man must have syphilis serology requested."},
       {b:"dl", rows:[
         ["<b>Paraphimosis \u2014 reduction in primary care</b>","(1) Apply 2% lidocaine gel to the paraphimosed glans for topical anaesthesia. (2) Apply ice wrapped in cloth or a cold compress for 5\u201310 minutes to reduce oedema. (3) Firm sustained circumferential pressure on the glans with both thumbs for 2\u20135 minutes. (4) Attempt to pull the foreskin forward with both index fingers while pushing the glans back with both thumbs. Granulated sugar technique if that fails: apply granulated sugar paste to the glans for 30\u201360 minutes (osmotic reduction of oedema). If unsuccessful, or if the GP is not trained in the technique: 999 or urology for a dorsal slit under local anaesthesia. Oedema accumulates distal to the constricting ring, so any delay worsens reduction difficulty and risks glans ischaemia"],
         ["<b>Priapism \u2014 classification</b>","Ischaemic (low-flow): a medical emergency \u2014 prolonged painful erection from venous outflow obstruction, a compartment syndrome of the corpora cavernosa, which must be treated within 4\u20136 hours to preserve erectile function. Causes: sickle cell disease (the most common identifiable cause), intracavernosal alprostadil, antipsychotics (chlorpromazine, olanzapine), cocaine, leukaemia. High-flow (non-ischaemic): usually post-traumatic (an arteriovenous fistula from cavernosal artery injury), painless, and not an emergency. Penile USS distinguishes the two"]
       ]}
     ]},

    {id:"ladder", nav:"Treat", title:"Treatment by diagnosis",
     sub:"Fuller management of balanitis itself is on the <a href='balanitis.html'>balanitis protocol</a>; the essentials are kept here because they are part of this presentation.",
     blocks:[
       {b:"table", head:["Diagnosis","Treatment"], rows:[
         ["<b>Candidal balanitis</b>","Clotrimazole 1% cream (Canesten) to affected areas BD for 7\u201314 days. Treat the partner (candidal vulvovaginitis). Identify predisposing factors \u2014 diabetes (HbA1c), phimosis, recent antibiotics. Systemic fluconazole 150 mg stat if severe or if cream is not tolerated. If recurrent: check HbA1c, and consider prepuceplasty (surgical widening of a phimotic foreskin) or circumcision to improve hygiene"],
         ["<b>Bacterial balanitis</b>","Saline wash plus a topical antibiotic \u2014 metronidazole gel or fusidic acid"],
         ["<b>Penile lichen sclerosus (BXO)</b>","Clobetasol propionate 0.05% ointment applied thinly to all affected skin (glans, inner foreskin, prepuce) OD at night for 4 weeks, then alternate nights for 4 weeks, then twice weekly maintenance. Give written application instructions. Review at 3 months for symptom improvement and foreskin retractability. Maintenance twice weekly long-term. If phimosis has not improved at 3 months \u2192 urology (prepuceplasty or circumcision). If a new ulcer or non-healing lesion develops on treated BXO \u2192 2WW urgently"],
         ["<b>Peyronie's \u2014 active phase</b>","Education: most cases stabilise within 12\u201318 months, and approximately 30\u201350% improve spontaneously in the stable phase. Pain: ibuprofen 400 mg TDS during erections. Vitamin E 400 mg OD (limited RCT evidence \u2014 inexpensive and safe); colchicine 500 mcg BD has similarly limited evidence. Penile traction device (RestoreX, Andropenis): reduces curvature by approximately 10\u201320\u00b0 when used 1\u20132 h a day for 6 or more months"],
         ["<b>Peyronie's \u2014 stable phase</b>","Curvature \u226530\u00b0 impairing intercourse \u2192 urology for intralesional collagenase (Xiapex) or penile plication or plaque surgery. Assessment of curvature: mild &lt;30\u00b0, moderate 30\u201360\u00b0, severe &gt;60\u00b0. Sildenafil if there is concurrent ED"],
         ["<b>Primary syphilis</b>","Benzathine penicillin G 2.4 MU IM single dose (given in a GUM clinic). Penicillin-allergic: doxycycline 100 mg BD for 14 days. Notify GUM for partner notification, contact tracing and HIV co-testing (syphilis and HIV co-infection in MSM is common). Warn about the Jarisch-Herxheimer reaction \u2014 mild fever and chills within 24 h of treatment, expected and not treatment failure"],
         ["<b>Genital herpes (HSV)</b>","Primary episode: valaciclovir 500 mg BD for 5\u20137 days, or aciclovir 200 mg five times a day for 5 days. Analgesia (ibuprofen); topical lidocaine gel. Recurrence: aciclovir 800 mg TDS for 2 days. Suppression (\u22656 recurrences a year): aciclovir 400 mg BD continuously. Counselling: inform the partner, condoms give partial protection, transmission is possible without active lesions through asymptomatic shedding, and there is a vertical transmission risk in a pregnant partner"],
         ["<b>Ischaemic priapism \u2014 while awaiting transfer</b>","Call 999. If trained and equipped: corporal aspiration using a 16\u201321G butterfly needle at the base of the penis at the 3 or 9 o'clock position, aspirating 20\u201330 mL of dark blood from each corpus (typically 30-50 mL in total) \u2014 immediate improvement in rigidity confirms correct placement, while a bright red aspirate suggests high-flow priapism, for which aspiration alone is not the treatment; intracavernosal phenylephrine 100\u2013200 mcg per injection (dilute 1 mg/mL to 0.1 mg/mL in normal saline, inject 1\u20132 mL, maximum 500 mcg per dose), with BP and pulse monitoring. Hospital transfer regardless. Sickle cell priapism: also oxygen, IV fluids, analgesia, and exchange transfusion if prolonged"]
       ]},
       {b:"why", html:"Intralesional collagenase clostridium histolyticum (Xiapex) was the first licensed non-surgical treatment for Peyronie's disease (NICE did not appraise it for this use) \u2014 injected directly into the plaque under local anaesthesia to break down the collagen fibres. Protocol: 2 injections per cycle 24\u201372 hours apart, up to 4 cycles at 6-week intervals, with a penile modelling procedure 24\u201372 hours after each injection and at home for 6 weeks. IMPRESS I and II trial data: approximately 35% reduction in penile curvature versus 18% for placebo. Eligibility: stable Peyronie's (\u22653 months), curvature 30\u201390\u00b0, palpable plaque. Contraindications: a plaque involving the urethra, and Dupuytren's contracture of the hands (cross-reactive antibodies to collagenase). Separately, <b>the penile traction device has an increasingly strong evidence base</b> \u2014 mechanical traction stimulates mechanotransduction in the plaque, promoting collagen remodelling; used for at least 3 hours a day (or 2 hours for RestoreX) over 3\u20136 months it reduces curvature by an average of 10\u201320 degrees, is safe and non-invasive, does not preclude later Xiapex or surgery, and is applied to the flaccid penis."},
       {b:"why", html:"The circumcision decision requires a nuanced approach \u2014 not all adult men with phimosis or balanitis need circumcision, and conservative management should be attempted first in most cases. For pathological phimosis from lichen sclerosus: clobetasol 0.05% ointment OD for 3 months is first-line and achieves resolution of the phimosis in approximately 70\u201380% of cases, allowing retraction without surgery. For recurrent candidal or bacterial balanitis: treat the underlying cause \u2014 diabetes, phimosis, hygiene \u2014 before recommending circumcision. Circumcision is appropriate for true pathological phimosis resistant to topical steroid, recurrent BXO with severe scarring, or recurrent paraphimosis. NHS circumcision for adults is available for pathological phimosis and BXO/LS but not for routine balanitis in most commissioning areas."}
     ]},

    {id:"lifestyle", nav:"Prevention", title:"Hygiene, sexual health and prevention",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"\u{1F9FC} Penile hygiene with an intact foreskin", html:"Daily gentle cleaning under the foreskin with warm water only \u2014 no soap under the foreskin, which disrupts the natural microbiome and causes balanitis. Retract if possible, clean the glans and inner foreskin, and <b>replace the foreskin after cleaning</b>. Clean before and after intercourse. Teach from childhood \u2014 physiological phimosis is normal until about age 5, and the foreskin must not be forcibly retracted. <b>After each urination ensure the foreskin is fully forward</b>, since retained urine under a partial phimosis causes balanitis."},
         {tone:"amber", h:"\u{1FA78} Diabetes and penile health", html:"Diabetic men are at significantly higher risk of candidal balanitis (urinary glucose feeds Candida under the foreskin), bacterial balanitis (impaired neutrophil function), penile LS/BXO, and Fournier's gangrene (immunocompromise, neuropathy and peripheral vascular disease). Annual HbA1c in all men with recurrent balanitis without a clear cause; each 1% reduction in HbA1c reduces balanitis recurrence significantly."},
         {tone:"blue", h:"\u{1F6E1}\u{FE0F} Condoms, HPV and PrEP", html:"Condoms reduce but do not completely prevent transmission \u2014 HPV and HSV can be transmitted from unprotected shaft or perianal skin. HPV vaccination: Gardasil 9, recommended for MSM up to age 45 on the NHS (JCVI 2023). Regular STI screening yearly for sexually active MSM and those with new or multiple partners. PrEP (pre-exposure prophylaxis, tenofovir plus emtricitabine) for HIV prevention in high-risk MSM, via GUM."},
         {tone:"green", h:"\u{1F9E0} Peyronie's \u2014 the psychological impact", html:"Peyronie's causes significant psychological distress in approximately 80% of affected men \u2014 shame, depression, relationship difficulty, sexual avoidance, reduced self-esteem. <b>PHQ-9 and GAD-7 at every Peyronie's consultation.</b> Say it explicitly: <em>\u201cThis condition is distressing for many men \u2014 the emotional side matters as much as the physical.\u201d</em> <b>Psychosexual therapy referral (COSRT) for avoidance and anxiety.</b>"},
         {tone:"red", h:"\u{1F6AD} Smoking", html:"Smoking raises the risk of penile SCC (2\u20134\u00d7), erectile dysfunction, Peyronie's and Fournier's gangrene \u2014 it is the most important preventable intervention for overall penile health. Offer NHS Stop Smoking Services at every penile disorder consultation."},
         {tone:"cream", h:"\u{1FA79} Post-circumcision care", html:"Keep the wound clean and dry for 48\u201372 h, then daily saline bathing. Abstain from sexual activity for 4\u20136 weeks (wound tensile strength). Regular paracetamol and ibuprofen for the first 5\u20137 days. Contact the GP for increasing redness, discharge or odour. Expected: swelling, bruising and altered sensation, usually temporary; the glans keratinises over weeks to months."},
         {tone:"plain", h:"\u{1FA78} Sickle cell and priapism prevention", html:"Priapism is the most common penile complication in sickle cell disease, affecting approximately 30\u201340% of males with SCD at some point. Hydroxycarbamide (hydroxyurea) significantly reduces frequency. For recurrent stuttering priapism, a PDE5 inhibitor (sildenafil 25\u201350 mg OD or tadalafil 5 mg OD) can prevent ischaemic episodes. Haematology co-management is essential, and <b>every man with SCD should have a written emergency plan</b>."},
         {tone:"blue", h:"\u{1F50D} Penile self-examination", html:"Monthly penile and scrotal self-examination \u2014 new lumps, skin changes, ulcers or sores. Any new penile ulcer, regardless of pain: GP review within 1 week, and do not wait more than 3 weeks. <b>A painless penile ulcer is syphilis until proved otherwise.</b> Annual genital examination for men at risk of penile SCC \u2014 smokers, BXO/LS, HPV history, immunosuppressed."}
       ]},
       {b:"why", html:"The sickle cell priapism emergency plan should be provided to every male with SCD at adolescent review. Priapism in SCD typically begins as \u201cstuttering priapism\u201d \u2014 repeated short episodes lasting under 3 hours \u2014 before progressing to a prolonged ischaemic episode. Key education points: (1) any erection lasting more than 2 hours not responding to a cold compress, gentle exercise or ejaculation is an emergency \u2014 attend A&amp;E immediately, do not wait for 4 hours; (2) at home, a warm bath, gentle exercise and ejaculation may help a partial erection, though full rigid priapism will not resolve with these measures; (3) the A&amp;E team must be told on arrival that the patient has sickle cell disease with priapism, which triggers the SCD priapism protocol \u2014 IV fluids, analgesia, oxygen and urology consultation. The plan should be documented in the GP record and shared with the haematologist."}
     ]},

    {id:"monitor", nav:"Follow-up", title:"Follow-up, safety-netting and the documentation standard",
     blocks:[
       {b:"table", head:["Group","Follow-up"], rows:[
         ["<b>Penile LS (BXO) monitoring</b>","3-month review after starting clobetasol: foreskin retractability, symptom improvement, any new lesion. Annual long-term: photographic documentation, and biopsy of any new ulcer or induration. 2WW immediately for a non-healing ulcer, new nodule or bleeding on a background of LS"],
         ["<b>STI follow-up</b>","HIV test with every new STI. Syphilis serology at 3 and 6 months post-treatment to confirm serological cure. Partner notification via GUM. HSV: inform the partner, condom advice, and discuss suppressive therapy"],
         ["<b>Peyronie's review</b>","Active phase: 6-monthly review; once stable for \u22653 months, urology referral. Document curvature angle and plaque size at each visit. PHQ-9 at each review \u2014 depression is very common"],
         ["<b>Post-balanitis \u2014 find the cause</b>","If recurrent: HbA1c, foreskin culture, HIV test, and consider BXO with a clobetasol trial. Document the outcome of treatment"],
         ["<b>Any lesion</b>","Review balanitis and phimosis response at a few weeks. Any lesion not healing within 3\u20134 weeks \u2192 2WW \u2014 do not keep re-treating it as infection"]
       ]},
       {b:"warn", html:"The documentation standard for any penile lesion persisting beyond 2 weeks: <em>\u201cPenile lesion [describe]: [size] \u00d7 [size] mm, [location], [colour], [induration yes/no], [duration]. Patient [age], [smoking/alcohol status]. 2WW referral [initiated/not initiated, with reasoning]. Safety-net: review if not healed in 1 week / referred if not healed in 3 weeks.\u201d</em> Documenting the penile examination is a medicolegal standard: whether the foreskin was retracted, a description of any lesion, whether inguinal nodes were palpated, and the 2WW decision with reasoning if not referred. A GP who treats a penile ulcer three times with topical antifungal cream over 6 weeks without biopsy or referral, and without adequate documented examination findings, is in an indefensible position."},
       {b:"cards", items:[
         {tone:"red", h:"\u{1F534} 999", html:"Fournier's gangrene (pain and erythema disproportionate to appearance, with crepitus) \u00b7 ischaemic priapism &gt;4 hours \u00b7 penile fracture \u00b7 paraphimosis (trapped retracted foreskin) \u00b7 rapidly spreading genital pain and redness with systemic illness \u2014 stop any SGLT2 inhibitor."},
         {tone:"purple", h:"\u{1F7E3} 2WW", html:"Penile ulcer &gt;3 weeks \u00b7 an unexplained penile nodule or warty growth \u00b7 erythroplasia of Queyrat (a bright red velvety plaque on the glans)."},
         {tone:"amber", h:"\u{1F7E0} Safety-net lichen sclerosus", html:"<b>Explicitly safety-net LS for malignant change</b> \u2014 any new ulcer, induration or non-healing lesion."},
         {tone:"green", h:"\u{1F4CB} Modifiable factors", html:"Genital hygiene, glycaemic control in recurrent candidal balanitis, partner treatment where infective, STI screening for ulcers or discharge, smoking cessation and HPV awareness, and long-term topical steroid for LS as directed."}
       ]},
       {b:"say", html:"I need to examine this properly, including gently pulling the foreskin back, because the appearance tells me most of what I need to know. Most penile problems are benign and treatable \u2014 but the one rule I work to is that a sore or lump that has not healed within three or four weeks gets referred rather than treated again with another cream. If this is the white, shiny skin change I think it may be, the right treatment is a strong steroid ointment rather than an antifungal, and used early it usually resolves it \u2014 left untreated for years it can scar and, rarely, turn cancerous, so I will see you again at three months and then yearly."}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999 / same-day urology", html:"Fournier's gangrene (necrotising fasciitis) \u00b7 ischaemic priapism &gt;4 hours \u00b7 penile fracture (sudden crack plus haematoma) \u00b7 paraphimosis if primary care reduction fails."},
         {tone:"purple", h:"2WW urology \u00b7 NICE NG12", html:"A penile mass or ulcerated lesion where STI has been excluded, or a persistent penile lesion after STI treatment has been completed \u2014 in practice: a persistent penile ulcer or nodule &gt;3 weeks (penile SCC) \u00b7 erythroplasia of Queyrat (VIN) \u00b7 penile LS (BXO) not responding to clobetasol \u00b7 lichen planus of the penis with severe erosions or possible VIN."},
         {tone:"amber", h:"GUM / sexual health", html:"Suspected STI (HSV, syphilis, gonorrhoea, chlamydia) \u2014 all require a full STI screen plus contact tracing, and HIV testing."},
         {tone:"blue", h:"Urology (routine)", html:"Peyronie's disease (stable phase, curvature \u226530\u00b0, impairing intercourse) for Xiapex consideration \u00b7 phimosis requiring circumcision \u00b7 recurrent candidal balanitis despite treatment (exclude BXO) \u00b7 meatal stenosis with difficulty voiding or a poor stream."},
         {tone:"cream", h:"GP management", html:"Candidal balanitis: clotrimazole 1% cream BD \u00d7 14 days plus treat the partner. Bacterial balanitis: saline wash plus metronidazole gel or fusidic acid. BXO/penile LS: clobetasol 0.05% ointment OD \u00d7 3 months induction. Herpes: aciclovir 200 mg five times a day \u00d7 5 days. Syphilis: penicillin via GUM. Fuller balanitis management is on the <a href='balanitis.html'>balanitis protocol</a>."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 58-year-old attends for the third time in two months with \u201crecurrent thrush\u201d on the glans, having twice been given clotrimazole by phone without examination. He now finds the foreskin difficult to retract. On examination the glans and inner foreskin show white, shiny, atrophic plaques with a pale ring at the preputial opening. He smokes."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Examines rather than re-prescribing \u2014 and recognises white atrophic plaques with a preputial ring as lichen sclerosus, not candida; knows antifungals will not help and clobetasol 0.05% will, with the induction-then-maintenance regimen; names the ~2\u20135% SCC risk and arranges 3-month review plus annual surveillance; <b>checks HbA1c and addresses smoking as an SCC risk factor</b>; documents the examination to the medicolegal standard including whether the foreskin was retracted and whether nodes were palpated; and \u2014 the step candidates miss \u2014 states the rule that any lesion not healing at 3\u20134 weeks goes 2WW rather than getting another cream."}
     ]}]},

         '<li><b>JCVI (2023) \u2014 HPV vaccination</b><span class="rd"> \u2014 Gardasil 9 for MSM up to age 45 on the NHS</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> \u2014 clobetasol, clotrimazole, fluconazole, metronidazole gel, fusidic acid, aciclovir, valaciclovir, doxycycline, phenylephrine and lidocaine gel</span></li>'+

     ]}

  foot:"Penile disorders \u2014 NICE NG12 (May 2025), BASHH syphilis and HSV guidelines, EAU penile cancer guidelines, and BAUS guidelines on Peyronie's disease and priapism. A non-healing penile lesion is cancer until proven otherwise: do not re-treat it as infection. Balanitis has its own <a href=\"balanitis.html\">balanitis protocol</a>. Verify all doses against the current BNF before prescribing."
