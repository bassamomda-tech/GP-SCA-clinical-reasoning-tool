<script>
MG.render({
  icon:"👁️",
  title:"Glaucoma",
  eyebrow:"Protocol · the GP’s part in a specialist-led condition",
  stemTitle:"Glaucoma — catch the closed angle today, protect the open angle for decades",
  stemSub:"The GP rarely diagnoses or titrates glaucoma, but owns three things nobody else sees: the acutely painful red eye that walks into a same-day slot, the systemic medicines that can close a narrow angle or clash with eye drops, and the long-term conversation about adherence, family risk and driving. Sources: NICE NG81 (2017, updated January 2022), RCOphth angle-closure guideline (2022), College of Optometrists CMGs, DVLA visual standards, SPCs.",
  guideline:"NICE NG81 (2017, updated 2022) · RCOphth angle-closure guideline 2022 · College of Optometrists CMGs · DVLA visual disorders standards",
  meta:[
    {t:"NICE NG81 · 2017, updated Jan 2022"},
    {t:"RCOphth angle closure 2022 · College of Optometrists CMGs"},
    {t:"Product-specific SPCs · GMMMG eye formulary"},
    {t:"DVLA · statutory notification duty", tone:"tw"},
    {t:"No NG12 criterion applies"}
  ],
  lead:"<div class='mg-layers'><a href='#flags'><b>Red flags</b><small>Acute angle closure = same day</small></a><a href='#treat'><b>Treatment</b><small>SLT first, then drops</small></a><a href='#drugs'><b>Drug safety</b><small>Narrow-angle risks and beta-blockers</small></a><a href='#driving'><b>Driving</b><small>Both eyes = tell DVLA</small></a></div>",
  quickSub:"The six points that change what you do in the room. Each traces to a source listed under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"A painful red eye with haloes is angle closure until proven otherwise", html:"Sudden eye pain or brow ache, blurred vision, coloured haloes round lights, nausea or vomiting, a red eye with a hazy cornea and a mid-dilated, poorly reacting pupil. This is an ophthalmic emergency: <b>phone the on-call eye team for same-day assessment</b>. The College of Optometrists classes acute angle closure as a same-day referral; sight can be lost within hours. It is one of several same-day ophthalmic emergencies — any painful red eye with reduced vision, sudden visual loss or an abnormal pupil needs urgent ophthalmic assessment."},
    {tone:"amber", h:"Some medicines can precipitate closure in susceptible narrow angles", html:"Topiramate can cause acute myopia with secondary angle closure, usually soon after starting: <b>same-day ophthalmology</b>, and contact the prescribing clinician urgently to stop or rapidly withdraw it as clinically appropriate, balancing the indication and seizure risk. Pupil-dilating or anticholinergic medicines can precipitate angle closure in susceptible narrow-angle eyes — but there is no blanket ‘avoid in glaucoma’ rule, and treated open-angle glaucoma is different from an anatomically narrow angle. In a new painful red eye, <b>ask what was started recently</b>."},
    {tone:"blue", h:"First-line treatment is now laser, not drops", html:"NICE NG81 (January 2022 update) recommends <b>360° selective laser trabeculoplasty (SLT)</b> as first treatment for newly diagnosed COAG that is not advanced and for ocular hypertension with IOP of 24 mmHg or more at lifetime risk of visual impairment (not pigment dispersion syndrome). A generic prostaglandin analogue is offered when SLT is unsuitable, declined, unavailable or not enough on its own. SLT is specialist-delivered, not appropriate for every glaucoma type, and its effect can wane."},
    {tone:"amber", h:"Beta-blocker drops act on the lungs and heart", html:"Timolol eye drops are contraindicated in asthma or a history of asthma, severe COPD, sinus bradycardia, sick sinus syndrome and second- or third-degree heart block without a pacemaker (SPC). Check the exact preparation and its SPC, and <b>check every repeat list for timolol in combination bottles</b>. If wheeze, bronchospasm, syncope, bradycardia or heart block develops, withhold further doses if clinically necessary and contact the eye team urgently for an alternative pressure-lowering plan — do not leave glaucoma untreated."},
    {tone:"purple", h:"Driving: a statutory duty to tell DVLA", html:"Car and motorcycle drivers must tell DVLA about an eye condition that affects <b>both eyes</b> (or the only seeing eye). Bus and lorry drivers must tell DVLA if it affects <b>one or both eyes</b>. The duty to notify is the patient’s; the GP advises and documents. DVLA decisions depend on the visual field and acuity assessment, and taxi/private-hire licensing may apply additional local standards."},
    {tone:"green", h:"Relatives aged 40 or over get a free NHS sight test", html:"In England, parents, siblings and children aged 40 or over of someone with diagnosed glaucoma are usually eligible for a free NHS sight test, as are everyone aged 60 or over and people already diagnosed with glaucoma (subject to NHSBSA criteria; arrangements differ across UK nations). It is a sight test, not a specialist glaucoma assessment — relatives with symptoms or abnormal findings need appropriate referral. NG81 asks clinicians to tell people that glaucoma can run in families. <b>This is the single most useful family conversation</b> in a condition that is silent until late."}
  ],
  pathwaySub:"Five moves for any glaucoma consultation. The first is where sight is lost.",
  pathway:[
    {title:"Is this acute angle closure?", html:"Sudden pain, haloes, blurred vision, vomiting, red eye, cloudy cornea, fixed mid-dilated pupil. If yes: <b>same-day ophthalmology by phone now</b>. Keep the patient comfortable and supervised, avoid pupil dilation, give analgesia and antiemetic treatment where appropriate, and follow the eye team’s advice on positioning and any IOP-lowering medication. Urgently review a likely precipitating drug, particularly topiramate, balancing the underlying indication. Do not delay transfer, and do not send them home to see an optometrist tomorrow.", alert:true},
    {title:"Which type, and who is managing it?", html:"Chronic open-angle glaucoma (COAG), ocular hypertension (OHT), suspected COAG, or angle-closure disease. Diagnosis and treatment decisions sit with the hospital eye service or an accredited community glaucoma service. Your job is to know the plan and the drops."},
    {title:"Check the medicines both ways", html:"Eye drops that affect the body (timolol and asthma, COPD, bradycardia; brimonidine and MAOIs or relevant tricyclic/noradrenergic antidepressants, per its SPC) and body medicines that affect the eye (topiramate, pupil-dilating or anticholinergic drugs in narrow angles, prolonged or high-dose steroids). Reconcile the repeat list with the clinic letter."},
    {title:"Support adherence and technique", html:"NG81 asks for eye-drop technique to be demonstrated and observed, and for adherence and technique to be checked whenever IOP is not controlled. Missed drops cause silent field loss. Ask how many doses were missed last week, not whether they use them."},
    {title:"Driving, family, follow-up", html:"Advise the patient of their DVLA duty and document it, suggest first-degree relatives aged 40 or over get a free sight test, and make sure the person is not lost to follow-up: missed monitoring appointments are a common route to preventable sight loss."}
  ],
  sections:[
    {id:"flags", nav:"Red flags", title:"Red flags and emergencies", sub:"Acute angle closure is one same-day ophthalmic emergency. Any painful red eye with reduced vision, sudden visual loss or an abnormal pupil requires urgent ophthalmic assessment, even if glaucoma is not the final diagnosis. No NG12 suspected-cancer criterion maps to glaucoma.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Acute angle closure (acute primary angle closure crisis)", html:"Sudden unilateral eye pain or brow ache, reduced vision, rainbow-coloured haloes, nausea and vomiting (sometimes abdominal pain), a red eye with corneal haze and a mid-dilated, sluggish or fixed pupil. The eye may feel hard. Often starts in dim light or after pupil dilation. <b>Same-day ophthalmology.</b>", src:"College of Optometrists CMG, primary angle closure · Murray, Community Eye Health J 2018"},
         {tone:"red", h:"Drug-induced secondary angle closure", html:"Acute myopia with blurred vision and eye pain, often bilateral, usually soon after starting topiramate. Suspected topiramate-induced angle closure requires same-day ophthalmology. Contact the prescribing clinician urgently to stop or rapidly withdraw topiramate as clinically appropriate, balancing the indication and seizure risk. Do not leave the patient to stop it without an urgent alternative plan where it is being used for epilepsy.", src:"Topiramate SPC, section 4.4"},
         {tone:"amber", h:"Warning attacks: intermittent angle closure", html:"Short episodes of blurred vision, haloes and aching, often in the evening or in dim light, settling with sleep or bright light. These can precede an acute crisis. Arrange urgent eye assessment rather than routine review.", src:"College of Optometrists CMG, primary angle closure"},
         {tone:"red", h:"Other same-day eye emergencies", html:"Sudden visual loss or field loss, retinal vascular occlusion, retinal detachment, severe keratitis, uveitis, endophthalmitis and visual symptoms with suspected giant cell arteritis also need same-day assessment. Any painful red eye with reduced vision or an abnormal pupil → urgent ophthalmic assessment, even if glaucoma is not the final diagnosis.", src:"Royal College of Ophthalmologists; College of Optometrists CMGs"},
         {tone:"amber", h:"Sudden or new visual field loss", html:"Glaucoma loss is gradual and usually unnoticed. A patient who reports sudden field loss needs a different explanation (vascular, retinal, neurological), so assess urgently, not as ‘glaucoma getting worse’.", src:"College of Optometrists CMG, POAG (gradual, symptomless field loss)"},
         {tone:"blue", h:"No NG12 criterion applies", html:"No suspected-cancer referral criterion in NICE NG12 (updated April 2026) maps to glaucoma or raised eye pressure. Refer by the eye-emergency and glaucoma pathways instead.", src:"NICE NG12 (updated April 2026)"}
       ]},
       {b:"why", html:"Acute angle closure is the one presentation in this topic where a GP decision in the next hour decides whether the patient keeps sight in that eye. Pressure can climb high enough to damage the optic nerve within hours. Chronic open-angle glaucoma is the opposite: painless, slow, and found on an optometry check long before the patient notices anything. Mixing the two up — reassuring a painful red eye as conjunctivitis, or panicking over a routine OHT letter — is the characteristic error."}
     ]},

    {id:"aac", nav:"Acute closure", title:"Acute angle closure — what to do in the surgery", sub:"The eye team does the definitive treatment. The GP recognises it, rings the right person, and does no harm while transfer is arranged.",
     blocks:[
       {b:"timeline", items:[
         {n:"1", when:"Minutes 0–5", title:"Recognise and stop precipitants", html:"Take a brief history: onset, pain, haloes, vomiting, recent dilating drops, new medicines (topiramate, pupil-dilating or anticholinergic drugs). Check acuity, look at the pupil and cornea. <b>Contact the prescriber urgently to stop or rapidly withdraw topiramate as clinically appropriate (balancing seizure risk), and review any recently started pupil-dilating or anticholinergic medicine.</b>"},
         {n:"2", when:"Minutes 5–15", title:"Phone same-day ophthalmology", html:"Speak to the on-call eye team (eye casualty or ophthalmology registrar) and agree transfer. Where there is no direct eye service, send to the emergency department with a clear letter saying ‘suspected acute angle closure’."},
         {n:"3", when:"While waiting", title:"Comfort, supervision and symptom relief", html:"Keep the patient comfortable and supervised while arranging immediate transfer. Avoid pupil dilation. Give analgesia and antiemetic treatment where appropriate. Follow the receiving ophthalmology team’s advice regarding positioning and emergency IOP-lowering medication. Do not delay transfer to administer treatment in primary care."},
         {n:"4", when:"Only if the eye team advises", title:"IOP-lowering medication is specialist-directed", html:"<b>Do not instil pilocarpine or administer acetazolamide routinely in primary care.</b> Give these only after discussion with the receiving ophthalmology team and in accordance with the local acute angle-closure protocol — the choice, route and timing depend on IOP, corneal clarity, lens mechanism, renal function, sulfonamide allergy history, asthma/COPD and cardiovascular status, and any secondary cause."},
         {n:"5", when:"Afterwards", title:"Definitive treatment and the other eye", html:"The ophthalmology team will determine definitive treatment, which may include laser peripheral iridotomy (including the fellow eye where indicated), lens extraction or other pressure-lowering treatment according to the mechanism, IOP, lens status, optic-nerve damage and response to initial treatment (RCOphth angle-closure guideline 2022). The GP’s role is to check that an ophthalmology follow-up plan is in place."}
       ]},
       {b:"warn", html:"<b>Do not</b> put mydriatic drops into an eye you suspect of angle closure to ‘get a better look’, and do not send the patient to a high-street optometrist as an alternative to same-day hospital care. Do not delay transfer to give treatment in the surgery."}
     ]},

    {id:"types", nav:"Types", title:"The conditions behind the word ‘glaucoma’", sub:"The plan, the drops and the urgency all differ by type. Read the clinic letter with this table in mind.",
     blocks:[
       {b:"table", head:["Condition","What it means","What usually happens"], rows:[
         ["<b>Chronic open-angle glaucoma (COAG)</b>","Progressive optic neuropathy with characteristic field loss, angle open. Often but not always with raised IOP. The most common form in the UK — about 2% of people over 40, rising to 4–5% over 80 (College of Optometrists CMG)","360° SLT first-line for newly diagnosed COAG that is not advanced; generic prostaglandin analogue if SLT unsuitable; surgery with augmentation for advanced disease (NG81)"],
         ["<b>Ocular hypertension (OHT)</b>","IOP above normal with no optic nerve damage or field loss","Treat if IOP is 24 mmHg or more and the person is at risk of visual impairment in their lifetime (the IOP threshold is not a stand-alone indication): 360° SLT, except where associated with pigment dispersion syndrome, or generic PGA if SLT is unsuitable or not enough (NG81)"],
         ["<b>Suspected COAG</b>","Optic disc or field changes that might be glaucoma, not yet confirmed","Monitoring in the hospital or community glaucoma service; treatment decisions depend on risk"],
         ["<b>Primary angle closure disease</b>","The drainage angle is narrow or closed; from ‘suspect’ (anatomy only) through angle closure to angle-closure glaucoma with nerve damage","Laser iridotomy and/or lens extraction by the eye team. The RCOphth 2022 guideline limits referral and prophylactic laser in angle-closure suspects to those with ‘plus’ risk features"],
         ["<b>Secondary glaucoma</b>","Raised IOP from another cause: steroids, uveitis, trauma, pigment dispersion, drug-induced angle closure","Treat the cause as well as the pressure; the eye team leads"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Who is at higher risk of COAG", html:"Increasing age, a first-degree relative with glaucoma, African or African-Caribbean ancestry, raised IOP, thin corneas and high myopia. These people benefit most from regular sight tests.", src:"College of Optometrists CMG, POAG"},
         {tone:"blue", h:"Who is at higher risk of angle closure", html:"Long-sighted (hypermetropic) eyes with a shallow anterior chamber, older age, female sex, South or East Asian ancestry and a family history. The same people are those most at risk from pupil-dilating drugs.", src:"College of Optometrists CMG, primary angle closure"}
       ]}
     ]},

    {id:"findings", nav:"Case-finding", title:"How glaucoma is found and referred", sub:"Almost all chronic glaucoma is picked up at a sight test. Knowing the NG81 thresholds lets you read an optometry letter sensibly.",
     blocks:[
       {b:"dl", rows:[
         ["Referral thresholds (NG81)","Refer for further investigation and diagnosis if there is optic nerve head damage, a visual field defect consistent with glaucoma, or IOP of 24 mmHg or more on Goldmann-type applanation tonometry — after considering a repeat measurement on another occasion to confirm the field defect or IOP, unless clinical circumstances say otherwise. Referral should not be based solely on non-contact tonometry. These are optometry/primary-eye-care thresholds, not a GP diagnostic rule — GPs usually do not have Goldmann applanation tonometry, standard automated perimetry, stereoscopic optic-nerve assessment or gonioscopy."],
         ["Referral filtering","The College of Optometrists advises that in England, unless an urgent or emergency referral is needed, patients should have referral filtering (repeat measures or enhanced services) before hospital referral where local arrangements exist."],
         ["What the GP adds","A patient with an optometrist’s referral or abnormal eye-test result should not have a duplicate GP referral if the optometrist has already referred directly. The GP’s role is to identify urgency, reconcile medicines and ensure the patient is not lost to follow-up."],
         ["Monitoring (NG81)","People with OHT or suspected COAG are reviewed at intervals set by risk; people with confirmed COAG at intervals set by their risk of progression. Treatment to lower IOP needs to work for months before it is judged a success."]
       ]},
       {b:"why", html:"The 24 mmHg figure matters because NG81 now uses one threshold for both referral and treatment of OHT. A letter saying ‘IOP 22, discs healthy, recheck in 12 months’ is appropriate optometric care, not a missed diagnosis — and a GP re-referral in that situation adds nothing but waiting-list time."}
     ]},

    {id:"treat", nav:"Treatment", title:"Treatment — laser first, drops if needed, surgery for advanced disease", sub:"All specialist-initiated. Doses follow the SPC; check the BNF for current cautions.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1st", tone:"cream", title:"360° selective laser trabeculoplasty (SLT)", when:"newly diagnosed COAG (not advanced) or OHT with IOP ≥24 mmHg at lifetime risk of visual impairment (not pigment dispersion)", html:"A short, specialist-delivered outpatient laser treatment to the drainage meshwork. It is not appropriate for all glaucoma types, and advanced glaucoma may need treatment that gives a more immediate or predictable pressure reduction. NICE NG81 (updated January 2022) found no meaningful difference between SLT and eye drops in reaching target IOP, quality of life, adverse events or adherence, and it removes the daily-drop burden. The effect can wear off and SLT can be repeated."},
         {step:"Alternative", tone:"cream", title:"Generic prostaglandin analogue (PGA) eye drops", when:"SLT unsuitable, declined, unavailable or not enough", fromLabel:"if laser is not suitable or IOP is still too high", html:"For example latanoprost 50 micrograms/mL, <b>one drop into the affected eye once daily, best in the evening</b> (SPC). Warn about gradual, permanent browning of the iris (mostly in mixed-colour irides, usually in the first 8 months), longer, darker and thicker lashes (reversible), redness and periorbital darkening."},
         {step:"If not tolerated", tone:"amber", title:"Switch rather than stop", when:"intolerance", fromLabel:"if side effects", html:"NG81 advises offering an alternative generic PGA first, then a beta-blocker. If neither is tolerated: a non-generic PGA, carbonic anhydrase inhibitor, sympathomimetic (for example brimonidine), miotic, or a combination. Preservative-free preparations can help ocular surface irritation."},
         {step:"Beta-blocker", tone:"amber", title:"Timolol eye drops", when:"when chosen by the eye team", html:"<b>One drop of 0.25% twice daily</b>, increased to 0.5% twice daily if response is inadequate; IOP rechecked at about 4 weeks (timolol SPC). Contraindicated in asthma or past asthma, severe COPD, sinus bradycardia, sick sinus syndrome and second- or third-degree heart block without a pacemaker — check the SPC for the exact preparation, including combination products."},
         {step:"Advanced / uncontrolled", tone:"cream", title:"Surgery with pharmacological augmentation", when:"advanced COAG or progression despite two classes", fromLabel:"specialist decision", html:"NG81 recommends offering surgery with augmentation (for example mitomycin C) for advanced COAG, with interim generic PGA while waiting, and considering SLT or surgery for COAG at risk of sight loss despite medicines from two therapeutic classes."}
       ]},
       {b:"warn", html:"Never stop a patient’s glaucoma drops in primary care because of a side effect without speaking to the eye team first, unless an acute serious adverse reaction requires emergency action — and then contact the eye team urgently. Switching class or preparation is almost always possible; stopping loses the pressure control silently."}
     ]},

    {id:"drugs", nav:"Drug safety", title:"Medicines safety — both directions", sub:"The area where the GP prevents most harm. Drops reach the circulation; tablets and inhalers reach the eye.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"Timolol and other beta-blocker drops", html:"Systemically absorbed: bronchospasm (deaths reported in asthma), bradycardia, heart block, hypotension, masking of hypoglycaemia. Contraindicated in asthma or history of asthma, severe COPD, sinus bradycardia, sick sinus syndrome, sino-atrial block and second- or third-degree AV block not controlled with a pacemaker; use with caution in mild to moderate COPD. Check the exact preparation and its SPC, and check combination bottles (for example with latanoprost, dorzolamide or brimonidine). Systemic absorption occurs even with topical use; punctal occlusion reduces it. If wheeze, bronchospasm, syncope, bradycardia or heart block develops, withhold further doses if clinically necessary and contact the eye team urgently for an alternative pressure-lowering plan. Do not leave glaucoma untreated.", src:"Timolol SPC (exact preparation), sections 4.3–4.4; GMMMG eye formulary"},
         {tone:"amber", h:"Brimonidine", html:"Contraindicated in infants under 2 years (reports of apnoea, bradycardia, hypotension and loss of consciousness) and with certain antidepressants and interacting medicines — check the current brimonidine SPC. Avoid or seek specialist/pharmacy advice with MAOIs and relevant tricyclic or noradrenergic antidepressants — do not extrapolate this to every SSRI or every antidepressant.", src:"Brimonidine SPC (exact preparation), section 4.3"},
         {tone:"red", h:"Topiramate", html:"Can cause acute myopia with secondary angle-closure glaucoma, usually within the first month. Symptoms: sudden blurred vision and/or eye pain. Arrange same-day ophthalmology, and contact the prescribing clinician urgently to stop or rapidly withdraw topiramate as clinically appropriate, balancing the indication and seizure risk — never leave a patient with epilepsy to stop it without an urgent alternative plan.", src:"Topiramate SPC, section 4.4"},
         {tone:"amber", h:"Nebulised ipratropium", html:"Acute angle closure has been reported with nebulised ipratropium, particularly with face masks or poor nebuliser technique. Avoid ocular exposure, particularly in people with narrow angles: use a mouthpiece where possible, ensure a well-fitting mask if one is required, and advise patients to seek urgent care for eye pain, blurred vision or haloes. Do not withhold essential bronchodilator treatment without specialist advice.", src:"Ipratropium nebuliser SPC (Atrovent UDVs)"},
         {tone:"amber", h:"Other pupil-dilating drugs", html:"Pupil-dilating or anticholinergic medicines can precipitate angle closure in susceptible narrow-angle eyes; the risk is drug-, dose- and patient-dependent and not equivalent across medicines. Do not apply a blanket ‘avoid in glaucoma’ rule — particularly for antihistamines and SSRIs: treated open-angle glaucoma is different from an anatomically narrow angle. If a patient develops acute ocular symptoms after starting a medicine, seek urgent ophthalmological advice.", src:"Khurana et al., J Curr Glaucoma Pract 2012"},
         {tone:"amber", h:"Corticosteroids", html:"Prolonged or high-dose corticosteroid exposure can raise IOP in susceptible people. Do not start or continue ophthalmic steroid drops without ophthalmic supervision. Review long-term systemic, inhaled, nasal, dermatological and periocular corticosteroid exposure where IOP control is difficult — this does not mean all inhaled or nasal steroids routinely cause glaucoma.", src:"Prednisolone acetate eye drops SPC (Pred Forte)"}
       ]},
       {b:"why", html:"The asymmetry is worth teaching: for someone with treated open-angle glaucoma, an anticholinergic is usually fine; for someone with undiagnosed narrow angles, the same tablet can precipitate a crisis. That is why the history of haloes and evening aching matters more than the word ‘glaucoma’ in the problem list. Conversely, a patient with ‘well-controlled asthma’ who starts timolol drops at the eye clinic may deteriorate weeks later without anyone linking the two."}
     ]},

    {id:"adherence", nav:"Adherence", title:"Adherence, technique and living with drops", sub:"The daily routine is the treatment. Most failure is silent.",
     blocks:[
       {b:"tiles", v:"life", items:[
         {t:"💧 Show, then watch", html:"NG81 asks for correct instillation technique to be demonstrated and then observed when drops are first prescribed, and for technique and adherence to be checked if IOP is not controlled."},
         {t:"⏱️ Close the eye, press the corner", html:"Gently closing the eyelids or pressing on the inner corner of the eye for 2 minutes after a drop reduces systemic absorption and increases local effect (timolol SPC)."},
         {t:"🕰️ Spacing", html:"Where more than one drop is used, leave a few minutes between them so the first is not washed out. Put evening PGA drops by the toothbrush."},
         {t:"🖐️ Practical barriers", html:"Arthritis, tremor and poor vision make squeezing bottles hard. Ask about compliance aids, dispensing devices or a carer. Preservative-free units if the eye surface is sore."},
         {t:"🗓️ Keep the appointments", html:"The eye clinic measures whether treatment is working; no symptoms mean nothing. Missed monitoring is a common cause of avoidable sight loss."},
         {t:"👨‍👩‍👧 Family", html:"Tell relatives that glaucoma runs in families; parents, siblings and children aged 40 or over are usually eligible for a free NHS sight test in England (NHSBSA criteria) — and should be referred if they have symptoms or abnormal findings."}
       ]},
       {b:"say", html:"These drops don’t make you feel any different, and that’s exactly why they’re easy to forget. They’re protecting the side vision you’d only notice once it had gone, and once it’s gone it doesn’t come back. Can you show me how you put them in?"}
     ]},

    {id:"driving", nav:"Driving", title:"Driving and the DVLA", sub:"A statutory duty on the patient, and a documented advice duty on the clinician.",
     blocks:[
       {b:"cards", items:[
         {tone:"purple", h:"Car and motorcycle (Group 1)", html:"The licence holder must tell DVLA if they have an eye condition affecting <b>both eyes</b>, or the remaining eye if they have sight in only one. DVLA arranges an Esterman binocular field test with a contracted optician at no cost.", src:"DVLA · GOV.UK Eye conditions and driving (car or motorcycle)"},
         {tone:"purple", h:"Bus, coach and lorry (Group 2)", html:"The licence holder must tell DVLA about an eye condition affecting <b>one or both eyes</b>, using form V1V.", src:"DVLA · GOV.UK Eye conditions and driving (bus, coach or lorry)"},
         {tone:"blue", h:"What the field standard is", html:"For Group 1, DVLA requires a binocular field of at least 120° horizontally, extending at least 50° left and right, with no significant defect in the binocular field encroaching within 20° of fixation above or below the horizontal meridian (measured with a Goldmann III4e-equivalent target). DVLA licensing decisions depend on the visual field and visual acuity assessment — check the current DVLA guidance directly.", src:"DVLA Assessing fitness to drive — visual disorders"},
         {tone:"cream", h:"What to record", html:"The statutory duty to notify DVLA is the patient’s. Advise the patient to check the current DVLA guidance and notify DVLA when required, and document the advice, when it was given and what they said. Taxi and private-hire drivers may face additional local licensing standards. If the patient continues to drive despite significant safety concerns, follow GMC confidentiality guidance on disclosure.", src:"DVLA Assessing fitness to drive · GMC confidentiality guidance"}
       ]},
       {b:"why", html:"Most people with early glaucoma, or glaucoma in one eye, keep their Group 1 licence. The purpose of the conversation is not to take the car away but to make sure the licensing decision is based on a proper binocular field test rather than on the patient’s own impression, which is unreliable because glaucoma field loss is not noticed until advanced."}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — who, how fast, to whom", sub:"Urgency depends on the angle, not the word ‘glaucoma’.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same day — eye casualty or on-call ophthalmology", html:"Painful red eye with reduced vision; corneal haze; mid-dilated or poorly reactive pupil; coloured haloes with nausea or vomiting; acute blurred vision and eye pain after topiramate (urgent prescriber review of topiramate, balancing the indication); painful red eye with an abnormal pupil; and the other same-day eye emergencies (sudden visual loss, retinal detachment or vascular occlusion, severe keratitis, uveitis, endophthalmitis, suspected GCA). Do not dilate the eye or send to routine optometry; contact the eye team about any IOP-lowering medication.", src:"College of Optometrists CMG, primary angle closure · RCOphth 2022"},
         {tone:"amber", h:"Urgent eye assessment", html:"Symptoms of intermittent angle closure (evening haloes and aching that settle). Newly noticed visual field loss. Suspected steroid-induced pressure rise.", src:"College of Optometrists CMG · Pred Forte SPC"},
         {tone:"blue", h:"Routine — usually via the optometrist", html:"Suspected COAG or OHT found at a sight test, following NG81 thresholds (optic nerve damage, field defect, or IOP 24 mmHg or more after repeat) and any local referral-filtering scheme. No duplicate GP referral if the optometrist has already referred directly.", src:"NICE NG81 · College of Optometrists CMG, POAG"},
         {tone:"cream", h:"Back to the glaucoma clinic", html:"Intolerance of drops, contraindication discovered (new asthma on timolol), adherence the patient cannot sustain, lost to follow-up, or a patient who wants to discuss laser instead of drops.", src:"NICE NG81"},
         {tone:"green", h:"Routine GP responsibilities", html:"Reconcile glaucoma drops with the clinic letter; identify timolol in combination drops; ask about wheeze, asthma, COPD, bradycardia and syncope; reinforce adherence and correct administration; encourage punctal occlusion; check that follow-up has not been missed; advise about DVLA notification where applicable; and tell first-degree relatives about free NHS sight-test eligibility.", src:"NICE NG81 · product SPCs · DVLA · NHSBSA"},
         {tone:"blue", h:"No suspected cancer pathway applies", html:"There is no NICE NG12 (updated April 2026) suspected-cancer criterion for glaucoma, so no suspected cancer pathway referral card applies to this page.", src:"NICE NG12 (updated April 2026)"}
       ]},
       {b:"say", html:"I think the pressure inside your eye has shot up suddenly. It’s treatable, but it needs the eye specialists today, not tomorrow — I’m phoning them now so they’re expecting you."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card; the Casebook holds the full case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 66-year-old man with COPD on timolol and latanoprost for glaucoma attends with six weeks of worsening breathlessness. He admits he stopped the drops for a fortnight because they ‘made no difference’. He drives a taxi and his sister has just been told she has glaucoma.", src:"SCA practice scenario (site-authored), built on NICE NG81 and timolol SPC"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Links the breathlessness to <b>systemic absorption of timolol</b>; contacts the eye team about switching class rather than stopping drops alone; explains <b>why drops that feel like nothing still matter</b>; demonstrates punctal occlusion; addresses the <b>DVLA duty</b> (both eyes for Group 1; check what medical standard his local taxi licensing authority applies); and tells him his relatives aged 40 or over are entitled to a <b>free NHS sight test</b>.", src:"NICE NG81 · timolol SPC · DVLA · NHSBSA"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Every recommendation above traces to one of these primary sources.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG81 — Glaucoma: diagnosis and management</b> (2017, updated January 2022)<br><a href="https://www.nice.org.uk/guidance/ng81" rel="noopener">nice.org.uk/guidance/ng81</a><span class="rd"> — referral thresholds (optic nerve damage, field defect, IOP 24 mmHg or more; not on non-contact tonometry alone), 360° SLT first-line for non-advanced COAG and OHT at lifetime risk (not pigment dispersion), generic PGA when SLT unsuitable, the intolerance sequence, surgery with augmentation, eye-drop technique and adherence checks, family information</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral</b> (updated April 2026)<br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — checked: no criterion applies to glaucoma</span></li>'+
         '<li><b>Royal College of Ophthalmologists — Management of angle-closure glaucoma</b> (clinical guideline, 2022)<br><a href="https://www.rcophth.ac.uk/resources-listing/management-of-angle-closure-glaucoma-guideline/" rel="noopener">rcophth.ac.uk</a><span class="rd"> — specialist, mechanism-dependent management of acute angle closure (laser peripheral iridotomy or lens extraction, with emergency IOP lowering per local protocol); referral of angle-closure suspects with ‘plus’ features</span></li>'+
         '<li><b>RCOphth and College of Optometrists — Designing glaucoma care pathways using GLAUC-STRAT-FAST</b> (2022)<br><a href="https://www.rcophth.ac.uk/wp-content/uploads/2022/04/Designing-Glaucoma-Care-Pathways-using-GLAUC-STRAT-FAST.pdf" rel="noopener">rcophth.ac.uk</a><span class="rd"> — risk-stratified glaucoma pathways and community monitoring</span></li>'+
         '<li><b>College of Optometrists — Clinical Management Guidelines</b>: primary open angle glaucoma; ocular hypertension; primary angle closure / primary angle closure glaucoma<br><a href="https://www.college-optometrists.org/clinical-guidance/clinical-management-guidelines" rel="noopener">college-optometrists.org</a><span class="rd"> — prevalence and risk factors, same-day referral for acute angle closure, referral filtering</span></li>'+
         '<li><b>DVLA — Assessing fitness to drive: visual disorders</b>, and GOV.UK <i>Eye conditions and driving</i> (car or motorcycle; bus, coach or lorry)<br><a href="https://www.gov.uk/guidance/visual-disorders-assessing-fitness-to-drive" rel="noopener">gov.uk/guidance/visual-disorders-assessing-fitness-to-drive</a><span class="rd"> — the patient’s statutory notification duty (both eyes for Group 1, one or both for Group 2), the Group 1 field standard, and licensing decisions based on field and acuity assessment</span></li>'+
         '<li><b>NHS Business Services Authority — free NHS sight tests</b><br><a href="https://www.nhsbsa.nhs.uk/help-travel-eye-care-wigs-and-fabric-support-costs/sight-tests-glasses-and-contact-lenses" rel="noopener">nhsbsa.nhs.uk</a><span class="rd"> — eligibility in England (subject to NHSBSA criteria) for parents, siblings and children aged 40 or over of someone with glaucoma, everyone aged 60 or over, and people diagnosed with glaucoma; arrangements differ across UK nations</span></li>'+
         '<li><b>Summaries of Product Characteristics (emc) — use the current SPC for the exact preparation prescribed</b>: latanoprost 50 micrograms/mL (<a href="https://www.medicines.org.uk/emc/search?q=latanoprost" rel="noopener">emc: latanoprost</a>); timolol 0.25% and 0.5% and combination drops (<a href="https://www.medicines.org.uk/emc/search?q=timolol" rel="noopener">emc: timolol</a>); brimonidine 0.2% (<a href="https://www.medicines.org.uk/emc/search?q=brimonidine" rel="noopener">emc: brimonidine</a>); topiramate (<a href="https://www.medicines.org.uk/emc/search?q=topiramate" rel="noopener">emc: topiramate</a>); Atrovent UDVs, ipratropium nebuliser solution (<a href="https://www.medicines.org.uk/emc/search?q=atrovent" rel="noopener">emc: Atrovent</a>); Pred Forte, prednisolone acetate (<a href="https://www.medicines.org.uk/emc/search?q=pred%20forte" rel="noopener">emc: Pred Forte</a>)<span class="rd"> — doses, contraindications, nasolacrimal occlusion, topiramate angle closure, nebulised anticholinergic warning, steroid-induced IOP rise</span></li>'+
         '<li><b>Greater Manchester Medicines Management Group — GMMMG Formulary: Eye</b><br><a href="https://www.greatermanchesterformulary.nhs.uk" rel="noopener">greatermanchesterformulary.nhs.uk</a><span class="rd"> — local glaucoma preparations, including timolol and combination products</span></li>'+
         '<li><b>Murray D. Emergency management: angle-closure glaucoma.</b> Community Eye Health J 2018;31(103):64<br><a href="https://cehjournal.org/articles/10.56920/cehj.13" rel="noopener">cehjournal.org</a><span class="rd"> — symptoms and specialist emergency management; positioning and IOP-lowering medication are directed by the receiving eye team, not a GP protocol</span></li>'+
         '<li><b>Khurana AK, Khurana B, Khurana AK. Drug-induced angle-closure glaucoma.</b> J Curr Glaucoma Pract 2012;6(1):6–8 (international)<span class="rd"> — drug classes implicated in angle closure in susceptible narrow-angle eyes; risk is drug-, dose- and patient-dependent</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — current doses and cautions for eye drops and specialist-directed emergency medicines, alongside the exact SPC and local formulary</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Glaucoma in primary care: recognising acute angle closure, medicines safety, adherence, family risk and driving. Sources: NICE NG81 (2017, updated January 2022), RCOphth angle-closure guideline (2022), College of Optometrists CMGs, DVLA visual disorders standards, NHSBSA eligibility, product-specific SPCs, the GMMMG eye formulary and the BNF. Diagnosis, treatment decisions and emergency IOP-lowering medication belong to the eye service; acute angle closure is one of several same-day eye emergencies. Not a substitute for clinical judgement or your local formulary."
});
