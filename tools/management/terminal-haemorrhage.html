<script>
MG.render({
  icon:"🩸",
  title:"Catastrophic haemorrhage — the complete guide",
  eyebrow:"Protocol · GMEC Palliative · PCF8 · almost all the benefit is banked before it happens",
  stemTitle:"A catastrophic terminal bleed is often a dying event, though some bleeds remain treatable — so the work that changes the outcome is the anticipatory planning done weeks earlier, and in the moment presence matters more than drugs",
  stemSub:"Catastrophic haemorrhage is an emergency, but most of the benefit comes from planning before it occurs. <b>Identify and flag high-risk patients</b> — tumours near major vessels, fungating tumours, varices, severe thrombocytopenia, advanced haematological disease or clinically significant anticoagulation. <b>Treat a sentinel bleed as a same-day trigger</b> to confirm the treatment ceiling, review anticoagulants and antiplatelets, prescribe and site crisis medication, provide dark towels, and brief the family and out-of-hours services. If a catastrophic bleed occurs, <b>follow the agreed plan</b>: stay with the patient, position to protect the airway, use dark towels and give calm reassurance. If the patient is distressed and conscious enough to benefit, give midazolam 5–10 mg by the fastest safe route available under the local protocol — do not rely on subcutaneous absorption in a major bleed, and avoid buccal or sublingual administration if the mouth is filling with blood. Do not leave the patient to obtain equipment. If active treatment is wanted, call the emergency pathway; if care is comfort-focused, contact the agreed hospice, district nursing or out-of-hours service rather than 999 unless the plan says otherwise. Afterwards, support the family and team, document the event and review the plan for other high-risk patients.",
  guideline:"GMEC Palliative 6th ed · PCF8 · Scottish Palliative Care Guidelines",
  reviewed:"13 September 2026",
  nextReview:"13 March 2027",
  meta:[
    {t:"GMEC Palliative Care guidelines, 6th ed (April 2025)"},
    {t:"Palliative Care Formulary (PCF8)"},
    {t:"Scottish Palliative Care Guidelines"},
    {t:"Midazolam: NOT subcutaneous in a major bleed", tone:"tw"},
    {t:"v1.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#risk"><b>Who is at risk</b><small>Flag it early</small></a><a href="#sentinel"><b>Sentinel bleed</b><small>The warning</small></a><a href="#plan"><b>Plan ahead</b><small>Ceiling · meds · towels</small></a><a href="#crisis"><b>In the moment</b><small>Stay · route matters</small></a><a href="#after"><b>Afterwards</b><small>Debrief · support</small></a></div>',
  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Midazolam must NOT be given subcutaneously in a major bleed", html:"For a catastrophic bleed, use midazolam by the fastest safe route available to a competent professional — IV, IM, buccal or sublingual — following the local GMEC regimen. Avoid the subcutaneous route because absorption may be unreliable during peripheral shutdown. Buccal or sublingual administration is unsuitable when the mouth is filling with blood, there is profuse oral bleeding, the patient cannot retain the medicine, or giving it would cause distress or delay. IV or IM administration is not appropriate for every carer or every community clinician. If a syringe driver is already running, continue it unless there is a specific reason to stop, and give the crisis dose as a separate stat dose by a rapid route, recorded — do not rely on the driver."},
    {tone:"red", h:"⚠ Do not leave the patient", html:"Stay with them and give calm reassurance; a second person summons help and supports the family. In a true catastrophic bleed death often comes within minutes and consciousness is usually lost quickly — so chasing a cannula or a perfect dose can mean the patient dies alone. <b>Presence, positioning and dark towels are the priority, not the drug.</b> If the agreed plan is active treatment, the second person calls 999 or the agreed emergency pathway immediately."},
    {tone:"amber", h:"The sentinel bleed is a high-value warning sign", html:"A smaller \"herald\" bleed — a streak of haemoptysis, oozing from a fungating tumour, a small variceal bleed — may precede a major haemorrhage, although timing and progression are unpredictable. Treat any sentinel bleed as a same-day trigger to review the diagnosis, treatment ceiling, medication plan, crisis drugs, family preparation and out-of-hours communication."},
    {tone:"blue", h:"Anticipatory measures, all of them cheap", html:"Review anticoagulants and antiplatelet medicines urgently in the context of the goals of care — stopping may be appropriate if care is comfort-focused and bleeding risk outweighs preventive benefit; document the decision and rationale. Consider tranexamic acid for recurrent or low-volume bleeding only after assessing the source, renal function, thrombotic risk, anticoagulation and treatment goals, using the local palliative-care regimen or specialist advice. Prescribe crisis midazolam 5–10 mg (written in milligrams and route) and make sure it is physically in the house with a written crisis instruction. Put dark green or blue towels at the bedside to disguise blood and reduce distress, with gloves and waste bags to hand. A just-in-case box, and district nurses and out-of-hours who know the plan."},
    {tone:"green", h:"Prepare the family — including permission to just be present", html:"Explain sensitively what a bleed might look like, that the priority is staying close and keeping their person calm rather than heroics, to use the dark towels, and to follow the documented plan: in a comfort-focused plan, contact the agreed district nursing, hospice or out-of-hours service rather than 999 unless emergency transfer is wanted or required; if the plan is for active treatment, call 999 or the agreed emergency pathway immediately. Reassure carers that it is acceptable to be present without \"doing\" — comfort and company are the most valuable things they can give. Families who have been prepared cope far better, both at the time and in bereavement."},
    {tone:"amber", h:"Record the ceiling of care where everyone can see it", html:"Decide and document whether the plan is active (admission, transfusion, intervention) or comfort-focused at home or hospice — most catastrophic terminal bleeds are not survivable, so comfort is usually the realistic goal. Record the DNACPR decision and the wider emergency-care plan (ReSPECT) separately but consistently — a DNACPR decision does not mean \"no treatment\". Use EPaCCS where available, supplemented by the special patient note, ReSPECT document and direct handover, so out-of-hours, the ambulance service, district nurses and the hospice all see it instantly. Without that, a frightened carer dials 999 and the patient dies in transit."}
  ],
  pathwaySub:"Five steps, and four of them happen before any bleed.",
  pathway:[
    {title:"Identify and flag who is at risk", html:"Head and neck or central lung tumours near the great vessels, fungating or eroding tumours, oesophageal varices, severe thrombocytopenia, advanced haematological malignancy, hepatic failure with coagulopathy, and clinically significant anticoagulation. Make the risk visible to the whole team — GP, district nurses, out-of-hours, hospice."},
    {title:"Treat a sentinel bleed as the cue", html:"A sentinel bleed is a same-day trigger to review the plan — timing and progression are unpredictable. Confirm the ceiling, site the medication, brief the family and out-of-hours.", alert:true},
    {title:"Agree and record the ceiling of care", html:"Active or comfort-focused. DNACPR and ReSPECT completed and accessible. Plan shared on EPaCCS where available, the special patient note and direct handover, stating whether 999 and hospital transfer are wanted."},
    {title:"Put the anticipatory measures in place", html:"Review anticoagulants and antiplatelets against the goals of care · consider tranexamic acid case by case · crisis midazolam prescribed and IN the house · dark towels, gloves and waste bags at the bedside · just-in-case box · family briefed."},
    {title:"If it happens: stay, position, comfort — then debrief", html:"Follow the agreed plan — active treatment: 999 or emergency pathway; comfort-focused: the agreed team. Do not leave. Dark towels. Position to protect the airway. Midazolam by a fast route only if the patient is distressed and conscious enough to benefit. Afterwards: support and debrief the family and the team, document, and review the plan for others."}
  ],
  sections:[

    {id:"risk", nav:"Who is at risk", title:"Identifying the at-risk patient — step one, and the highest-value step",
     sub:"Most of the achievable benefit in a terminal bleed is banked before it happens.",
     blocks:[
       {b:"table", head:["Risk","Detail"], rows:[
         ["<b>High-risk situations</b>","Head and neck or central lung tumours lying near the great vessels · fungating or eroding tumours · oesophageal varices · severe thrombocytopenia · advanced haematological malignancy"],
         ["<b>Surface bleeding</b>","<b>Eroding skin or fungating tumour · carotid blow-out</b>"],
         ["<b>Internal bleeding</b>","Major haemoptysis · massive haematemesis or variceal bleed · gastrointestinal, rectal, vaginal or urinary tract bleeding · epistaxis"],
         ["<b>Coagulopathy and drugs</b>","DOACs, warfarin, antiplatelets, or hepatic failure with coagulopathy — flag these early and review them"],
         ["<b>Non-malignant disease</b>","<b>A terminal bleed is not exclusive to cancer</b> — advanced liver disease and haematological conditions carry the same risk"],
         ["<b>Make it visible</b>","Flag the risk in the record so the whole team sees it — GP, district nurses, out-of-hours, ambulance service and hospice — so the plan exists before any bleed"]
       ]},
       {b:"why", html:"Recognising who is at risk is what allows the team to plan: to agree goals of care, site crisis medication, and prepare the family, so that if a bleed occurs the response is calm and comforting rather than chaotic. Almost none of the benefit in this condition comes from what is done during the bleed — it comes from what was arranged weeks before — which is why identification is step one rather than an administrative preliminary."}
     ]},

    {id:"sentinel", nav:"Sentinel bleed", title:"The sentinel bleed, the types of bleeding, and what is still treatable",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"⚠ The herald bleed", html:"A small or self-limiting bleed — a streak of haemoptysis, oozing from a fungating tumour, a small variceal bleed — may precede a major haemorrhage, although timing and progression are unpredictable. It is a high-value warning sign: treat any sentinel bleed as a same-day trigger to review the diagnosis, treatment ceiling, medication plan, crisis drugs, family preparation and out-of-hours communication."},
         {tone:"blue", h:"🩸 Type of bleed shapes the response", html:"Haemoptysis, haematemesis, melaena, rectal, vaginal or urinary bleeding, surface or fungating bleeding, epistaxis, variceal bleeding. The type determines safe positioning and whether an oral, buccal or sublingual route will work or simply be overwhelmed by blood."},
         {tone:"red", h:"🔴 Signs in the moment", html:"Visible massive bleeding · hypotension · cool, clammy peripheries · air hunger · anxiety and a sense of impending doom."},
         {tone:"green", h:"✓ Ask early whether it is still treatable", html:"Before the patient is in extremis, ask whether the bleeding is amenable to treatment: radiotherapy for haemoptysis, endoscopy and banding for varices, interventional radiology embolisation, or palliative radiotherapy and topical measures for fungating tumours. Or whether the plan is purely comfort-focused. That question is much easier to answer in clinic than at 3 am."}
       ]}
     ]},

    {id:"plan", nav:"Plan ahead", title:"Goals of care, and the anticipatory measures",
     blocks:[
       {b:"table", head:["Element","What to do"], rows:[
         ["<b>The honest conversation</b>","Where appropriate, discuss the risk and the likely course sensitively and in advance with the patient and those close to them. Many people value knowing that a plan exists — but tailor how much detail you give to the individual"],
         ["<b>Agree the ceiling of treatment</b>","Decide and RECORD whether the plan is active (admission, transfusion, intervention) or comfort-focused at home or in the hospice. Most catastrophic terminal bleeds are not survivable, so comfort is usually the realistic goal"],
         ["<b>Resuscitation status</b>","For a clearly terminal catastrophic haemorrhage where death is imminent and unavoidable, attempted CPR is unlikely to be clinically beneficial. Make and document an individualised DNACPR decision within an advance-care-planning discussion, taking account of the patient's wishes, capacity, best interests and agreed ceiling of treatment"],
         ["<b>DNACPR is not \"no treatment\"</b>","Record the DNACPR decision and the wider emergency-care plan (ReSPECT) separately but consistently, alongside any legally applicable advance decision to refuse treatment and the overall ceiling of care. A DNACPR decision concerns CPR only; it should sit within a documented plan specifying which treatments remain appropriate, including admission, transfusion, antibiotics, reversal agents, radiotherapy or symptom control"],
         ["<b>Document and share</b>","Use EPaCCS where available, supplemented by the local special-patient note, ReSPECT document and direct handover to district nursing, hospice, out-of-hours and ambulance services. The flag should record: source and likely mechanism of bleeding · whether a sentinel bleed has occurred · agreed treatment ceiling · whether hospital transfer is wanted · DNACPR/ReSPECT status · preferred place of care · medication list and last anticoagulant dose · crisis midazolam dose and route · who should be called first · whether 999 is part of the plan · location of towels and medication · family/carer understanding · out-of-hours and ambulance communication"],
         ["<b>Review anticoagulation</b>","Review anticoagulants and antiplatelet medicines urgently in the context of the goals of care. If care is comfort-focused and bleeding risk outweighs preventive benefit, stopping may be appropriate. If active treatment or haemostasis is being considered, follow the relevant reversal/bleeding pathway and seek specialist advice. Weigh the indication, time since VTE, AF stroke risk, mechanical valve, recent coronary stent or acute coronary syndrome, reversibility of bleeding, prognosis and patient preference. <b>Do not stop antiplatelets automatically, particularly after recent coronary stenting.</b> Document the decision and rationale"],
         ["<b>Tranexamic acid</b>","Consider tranexamic acid for recurrent or low-volume bleeding only after assessing the likely source, renal function, thrombotic risk, concurrent anticoagulation and treatment goals. Use the local palliative-care regimen or specialist advice. Topical use may be considered for accessible surface or mucosal bleeding; oral use is not suitable for every bleeding source. Seek specialist advice in active thrombosis or significant renal impairment. It will not help a rapidly fatal arterial bleed and must not delay specialist haemostasis, emergency transfer where active treatment is wanted, airway management or symptom relief. Stop it if it is not helping"],
         ["<b>Reduce bleeding risk locally</b>","For selected surface or mucosal bleeds (e.g. fungating tumours), topical tranexamic acid, adrenaline-soaked gauze, sucralfate or palliative radiotherapy may help. Use topical haemostatic measures only where appropriate to the bleeding site and according to local palliative or specialist advice, with a locally agreed preparation and method. Topical adrenaline may be systemically absorbed (tachycardia, hypertension, arrhythmia). Avoid traumatic packing or repeated manipulation of friable tumour tissue"],
         ["<b>Crisis medication</b>","Anticipatory anxiolytic — midazolam 5–10 mg IV / IM / buccal / sublingual per the local GMEC regimen, written in milligrams and route rather than millilitres (injectable concentrations vary). Ensure it is PRESCRIBED and PHYSICALLY AVAILABLE where the patient is, with a clear written crisis instruction"],
         ["<b>Practical measures</b>","Dark-coloured (green or blue) towels readily accessible at the bedside before any bleed, to absorb and disguise blood loss and reduce visual distress; gloves and waste bags to hand. Do not conceal blood from a patient or family who want honest information, and do not let towels replace clinical assessment or appropriate escalation where active treatment is the agreed goal"],
         ["<b>Community patients</b>","A just-in-case box in the home, and district nurses and out-of-hours who know the plan. Consider family-carer administration of buccal or sublingual midazolam only where this is supported by local prescribing, consent, medicines-management and competency arrangements, with a written instruction specifying when and how to give it. Check the product, route and legal status locally — not all injectable midazolam preparations are licensed for buccal or sublingual use. Do NOT arrange this where oral bleeding is likely to prevent absorption or where administration may cause distress"]
       ]},
       {b:"why", html:"Without a documented, shared ceiling of care, a frightened carer dials 999 and the patient dies in transit or undergoing unwanted resuscitation — the opposite of what was wanted. Agreeing and recording the goal in advance is what makes a comfort-focused death in the preferred place actually achievable, rather than merely intended. And the simple measures — dark towels, a written plan, a just-in-case box — transform the experience of a terminal bleed for everyone in the room."}
     ]},

    {id:"crisis", nav:"In the moment", title:"During a catastrophic bleed",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"A. Active-treatment plan", html:"Consider urgent hospital or specialist management if consistent with the patient's wishes and clinical status: major haemoptysis · haematemesis or variceal bleeding · suspected carotid blow-out · uncontrolled bleeding from a potentially treatable tumour · significant but potentially reversible anticoagulant-related bleeding · haemodynamic compromise where transfusion, endoscopy, embolisation, surgery or radiotherapy may be appropriate. <b>Actions:</b> emergency ambulance transfer · blood tests and crossmatch · transfusion · anticoagulant reversal · endoscopy and variceal banding · interventional radiology · palliative radiotherapy · ENT, respiratory, gastroenterology or vascular input."},
         {tone:"green", h:"B. Comfort-focused plan", html:"Where the patient has chosen home or hospice care and active treatment is not appropriate: do not leave the patient · position to protect the airway · use dark towels · give anxiolysis only if distress is present and the patient can benefit · contact the agreed community/hospice team · support the family · avoid burdensome procedures."}
       ]},
       {b:"table", head:["Priority","Action","Why"], rows:[
         ["<b>First and always</b>","Do NOT leave the patient. Stay with them, give calm reassurance. A second person summons help and supports the family","Death often comes within minutes and consciousness is usually lost quickly — leaving to fetch equipment can mean the patient dies alone"],
         ["<b>Position</b>","Position according to the source of bleeding and level of consciousness. Haemoptysis: suspected bleeding lung down if known and tolerated, to protect the unaffected lung; otherwise a lateral position that best protects the airway. Haematemesis: sit upright if conscious; lateral recovery position if consciousness is reduced. Massive oral or upper-airway bleeding: a position that permits drainage and protects the airway — do not force the patient supine. Prioritise airway protection and comfort over a technically perfect position. Apply dark towels to absorb and conceal","Protects the airway and reduces the visual distress for everyone present"],
         ["<b>Massive bleed, clearly dying</b>","Comfort over drugs — presence and non-pharmacological care matter more than cannulating","Consciousness is usually lost within minutes; a cannula attempted at that point achieves nothing"],
         ["<b>Crisis sedation — indication</b>","Give midazolam ONLY if the patient is distressed or frightened and conscious enough to benefit. <b>It relieves anxiety; it does not stop the bleed</b>","The goal is rapid anxiolysis, not deep sedation the patient will not live long enough to need"],
         ["<b>Crisis sedation — dose</b>","Midazolam 5–10 mg stat by the agreed rapid route for distress or panic, using the lower end in frail or benzodiazepine-naïve patients (also consider age, benzodiazepine tolerance, severe respiratory disease, renal or hepatic impairment, current opioid and sedative burden, whether already unconscious, and whether death is expected within minutes). Repeat only according to the local palliative-care protocol and clinical response. Seek urgent specialist advice if distress persists. Prescribe in milligrams and route, not millilitres","Per GMEC and PCF8 — midazolam relieves anxiety and distress; it does not stop the haemorrhage"],
         ["<b>Crisis sedation — ROUTE</b>","The fastest safe route available to a competent professional — IV, IM, buccal or sublingual — following the local GMEC regimen. NOT subcutaneous in a major bleed — absorption may be unreliable during peripheral shutdown. Buccal or sublingual is unsuitable if the mouth is filling with blood, there is profuse oral bleeding, the patient cannot retain or absorb it, or giving it would cause distress or delay","This is the single most important technical point on the page: the right drug by the wrong route does nothing in the minutes available"],
         ["<b>If a syringe driver is already running</b>","Continue the driver unless there is a specific reason to stop it. Give the crisis dose as an ADDITIONAL stat dose by a separate rapid route and record it — do not rely on the driver to act quickly enough","A driver does not provide immediate peak drug levels and should not be the sole response to acute panic"]
       ]},
       {b:"say", html:"I am staying right here with you. You are not on your own. I am going to put these towels here and help you lie on your side — that is all we need to do. I have given you something to take the fear away and it will work quickly. Just keep hold of my hand. Your family are here with you too."},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"✓ What the family should be told to do", html:"Use the dark towels, stay close, talk reassuringly, and follow the documented plan. In a comfort-focused plan, contact the agreed district nursing, hospice or out-of-hours service rather than 999 unless emergency transfer is wanted or required. If the plan is for active treatment, call 999 or the agreed emergency pathway immediately. <b>And that being present without \"doing\" is enough.</b>"},
         {tone:"amber", h:"⚠ Where a carer has been trained to give midazolam", html:"Only where supported by local prescribing, consent, medicines-management and competency arrangements: show exactly how and when to give buccal or sublingual midazolam, with a written instruction — but do not set this up at all if heavy oral bleeding is likely, because it will not be absorbed and the attempt will distress everyone."}
       ]}
     ]},

    {id:"after", nav:"Afterwards", title:"Aftercare, debrief and team learning",
     blocks:[
       {b:"table", head:["Task","Detail"], rows:[
         ["<b>Support family and team</b>","Offer support and debriefing to both — and expect that it may need to be ongoing. Witnessing a terminal bleed is traumatic; consider proactive bereavement follow-up rather than waiting to be asked"],
         ["<b>Practical care of the environment</b>","Dispose of clinical waste appropriately; attend to the deceased and the surroundings with dignity BEFORE the family return to the bedside"],
         ["<b>Document</b>","Record what happened, what was given — drug, dose, route and time — and who was present. Verify death and follow the normal after-death processes"],
         ["<b>Staff psychological support</b>","Consider staff psychological support after a particularly traumatic event, especially where the death was witnessed by children, family members or inexperienced staff"],
         ["<b>Team learning</b>","A structured debrief helps staff process the event and improves the plan for the next high-risk patient"],
         ["<b>Review the wider plan</b>","Use the event to check that other at-risk patients on the caseload have their flag, their ceiling of care, their crisis medication and their towels in place"]
       ]},
       {b:"why", html:"A catastrophic bleed is one of the most distressing events families and staff witness, and the psychological consequences are real and lasting. Structured debriefing and ongoing support are part of good care rather than an optional extra — and the practical business of clearing the room before relatives return is a kindness that is easily forgotten in the aftermath."}
     ]},

    {id:"refer", nav:"Refer", title:"Referral and coordination",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"Specialist palliative care — IN ADVANCE", html:"Involve the specialist palliative care or hospice team early for high-risk patients — for advice on anticipatory prescribing, place-of-care planning, and support during and after the event. <b>Not at the point of crisis.</b>"},
         {tone:"blue", h:"Active options, discussed early", html:"Where treatment fits the goals of care: interventional radiology for embolisation, endoscopy and banding for varices, or palliative radiotherapy for haemoptysis or fungating bleeding. <b>Discuss before the patient is in extremis.</b>"},
         {tone:"green", h:"Community coordination", html:"Brief the district nurses, out-of-hours and ambulance service. Ensure the crisis plan, DNACPR and just-in-case medication are all in place and visible."},
         {tone:"green", h:"Out-of-hours handover", html:"Use the special patient note or EPaCCS so any responding clinician knows the plan instantly — the response is only as good as the weakest link in a chain that crosses five teams."},
         {tone:"cream", h:"What primary care owns", html:"Identifying and flagging risk, having the conversation, recording the ceiling of care, reviewing anticoagulation against the goals of care, prescribing and siting the crisis medication, putting the towels at the bedside, preparing the family, and debriefing afterwards. Related pages: <a href='care-of-the-dying.html'>care of the dying</a> · <a href='palliative-breathlessness.html'>palliative breathlessness</a> · <a href='palliative-delirium-agitation.html'>palliative delirium and agitation</a> · <a href='palliative-pain.html'>palliative pain</a> · <a href='palliative-corticosteroids.html'>palliative corticosteroids</a>."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"You visit a 71-year-old man with a <b>fungating squamous cell carcinoma of the neck</b>, now on a palliative pathway at home with his wife as main carer. Yesterday there was a <b>small bleed from the tumour that stopped on its own</b> after about a minute. He is on <b>apixaban</b> for a previous DVT. His wife is frightened and asks \"what do I do if it happens properly?\" There is a syringe driver running with morphine, and no DNACPR in place. He says he does not want to go back into hospital."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Recognises the small bleed as a SENTINEL bleed and treats it as the cue to finalise everything today, not as reassurance that it stopped; <b>reviews the apixaban against his comfort-focused goals and documents an individualised decision (stopping may be reasonable)</b>; agrees and records a comfort-focused ceiling of care and makes an individualised DNACPR decision within the wider ReSPECT plan, honouring his stated wish not to be readmitted; shares the plan on EPaCCS or a special patient note so out-of-hours and the ambulance service see it; <b>prescribes crisis midazolam and ensures it is physically in the house</b>, with a written instruction; specifies the route — IM or buccal (buccal only if the mouth is not filling with blood, and carer administration only under local governance), NOT subcutaneous — and explains why the SC route may be unreliable in a major bleed; <b>notes that the syringe driver continues but cannot deliver a crisis dose</b>; <b>places dark towels, gloves and waste bags at the bedside</b> and says what they are for; considers, with specialist palliative advice, topical tranexamic acid and palliative radiotherapy for the fungating tumour; prepares the wife concretely — stay close, use the towels, call the district nurse or hospice rather than 999, and that simply being present is enough; <b>judges how much graphic detail to give her</b>; and arranges specialist palliative care involvement and a plan for debrief and bereavement support."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>GMEC Palliative Care Pain &amp; Symptom Control Guidelines for Adults, 6th edition (modified April 2025, review April 2028)</b><br><a href="https://gmmmg.nhs.uk" rel="noopener">Greater Manchester Medicines Management Group — Clinical Guidance and Pathways</a><span class="rd"> — the anticipatory management framework, crisis midazolam 5\u201310 mg with the explicit instruction to avoid the subcutaneous route in a major bleed, dark towels at the bedside, positioning, and the emphasis on presence over intervention</span></li>'+
         '<li><b>Palliative Care Formulary (PCF8), local formulary and SPC</b><br><a href="https://www.medicines.org.uk/emc" rel="noopener">electronic medicines compendium (SPC)</a><span class="rd"> — the primary prescribing references for this protocol: midazolam dosing and routes for crisis sedation, tranexamic acid use including topical application, and the management of bleeding from fungating tumours</span></li>'+
         '<li><b>Scottish Palliative Care Guidelines</b><br><a href="https://rightdecisions.scot.nhs.uk/scottish-palliative-care-guidelines" rel="noopener">Scottish Palliative Care Guidelines</a><span class="rd"> — Bleeding section (catastrophic haemorrhage), accessed October 2026; supplementary evidence for the sentinel (herald) bleed as a warning sign, topical haemostatic measures for surface bleeding, family preparation, and the aftercare and debriefing recommendations</span></li>'+
         '<li><b>NICE NG31 — Care of dying adults in the last days of life</b><br><a href="https://www.nice.org.uk/guidance/ng31/chapter/Recommendations" rel="noopener">NICE NG31 recommendations</a><span class="rd"> — anticipatory prescribing and route selection</span></li>'+
         '<li><b>Resuscitation Council UK — ReSPECT and 2025 Ethics Guidelines (DNACPR and emergency-care planning)</b><br><a href="https://www.resus.org.uk/respect" rel="noopener">resus.org.uk/respect</a><span class="rd"> — person-centred, individualised emergency-care plans with the DNACPR rationale documented; — advance recording of resuscitation decisions, and the requirement that they be accessible to out-of-hours and ambulance services (EPaCCS / special patient note)</span></li>'+

  foot:"Catastrophic haemorrhage (palliative) — GMEC Palliative Care Guidelines 6th edition, PCF8 and the Scottish Palliative Care Guidelines. Almost all the achievable benefit is banked before the event: flag the at-risk patient, treat a sentinel bleed as the cue to finalise the plan, record a shared ceiling of care and DNACPR decision (on EPaCCS where available), review anticoagulation against the goals of care, and put crisis midazolam and dark towels physically in the home. In the moment, do not leave the patient — and follow the agreed active or comfort-focused plan, and give midazolam by the fastest safe route (IV, IM, buccal or sublingual), not subcutaneously in a major bleed. Debrief the family and the team afterwards. Verify all doses against PCF8, the local formulary or SPC before prescribing."
