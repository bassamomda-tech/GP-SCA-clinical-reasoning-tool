MG.render({
  icon:"🦠",
  title:"Hepatitis A",
  eyebrow:"Protocol · assess and manage in one place",
  stemTitle:"Hepatitis A: notify on suspicion, watch the INR and the conscious level, and protect the household within 14 days",
  stemSub:"One page for acute hepatitis A in primary care. The illness itself usually needs only supportive care. The GP's work is to support the diagnosis with HAV IgM in the right clinical context, spot the rare patient heading for liver failure, and meet the legal duty to notify. The notification lets the health protection team vaccinate close contacts while prophylaxis still works. Follow the health protection team's exclusion advice, usually until a week after jaundice starts. And assess jaundice in someone aged 40 or over urgently for pancreatic and biliary disease in line with NG12.",
  guideline:"UKHSA Public health control and management of hepatitis A (2024) · UKHSA hepatitis A immunoglobulin (2024) · UKHSA Green Book ch.17 (2024) · Health Protection (Notification) Regulations 2010 · BSG abnormal liver blood tests (Newsome 2018) · NICE NG12 (updated April 2026)",
  meta:[
    {t:"UKHSA 2024 · hepatitis A public health management"},
    {t:"Green Book ch.17 · hepatitis A vaccine"},
    {t:"Notifiable · Health Protection (Notification) Regulations 2010", tone:"tw"},
    {t:"BSG 2018 · abnormal liver blood tests"}
  ],
  lead:"<div class='mg-layers'><a href='#redflags'><b>Red flags</b><small>liver failure, NG12 jaundice</small></a><a href='#tests'><b>Confirm</b><small>HAV IgM in context, LFTs and INR</small></a><a href='#notify'><b>Notify</b><small>statutory, on suspicion</small></a><a href='#contacts'><b>Contacts</b><small>vaccine within 14 days</small></a></div>",
  quickSub:"The six points that change what you do today. Each one is traced to a named primary source under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"Drowsy, confused, bleeding or vomiting everything? Admit today", html:"<b>Encephalopathy with coagulopathy</b> should be treated as possible <b>acute liver failure</b> and needs same-day hospital assessment. A <b>raised or rising INR</b> in acute hepatitis needs urgent clinical assessment and discussion with acute medicine or hepatology. Other red flags: confusion, drowsiness or altered behaviour, asterixis, day-night reversal, bleeding or spontaneous bruising, persistent vomiting or inability to maintain hydration, hypoglycaemia, oliguria or AKI, rapidly increasing bilirubin, and severe abdominal pain or systemic deterioration. Avoid sedatives and other medicines that may obscure encephalopathy. The risk is highest in <b>older adults</b> and in those with <b>pre-existing liver disease</b>."},
    {tone:"purple", h:"Statutory duty: notify on clinical suspicion", html:"Acute infectious hepatitis is notifiable under the <b>Health Protection (Notification) Regulations 2010</b>. Notify on <b>clinical suspicion</b>; do not wait for laboratory confirmation. Notify the <b>proper officer</b> through the local notification route and <b>telephone the local UKHSA health protection team</b> promptly where urgent public health action is needed (UKHSA asks for a call within 24 hours). Follow the telephone notification with the required <b>written or electronic notification within 3 days</b>. Phone for hepatitis A, because contact prophylaxis is time-limited. Keep the local UKHSA North West health protection team contact details in the practice version of this protocol."},
    {tone:"blue", h:"Test HAV IgM in context, and check the INR", html:"<b>HAV IgM</b> strongly supports recent or current hepatitis A infection when consistent with the clinical and biochemical picture. Interpret unexpected or isolated positive results with the microbiology or virology laboratory and consider confirmatory testing, especially if the liver blood tests are cholestatic or the symptoms are atypical. HAV IgG or total antibody alone indicates previous infection or vaccination, not acute infection. Send <b>LFTs</b> (ALT is typically very high), <b>INR</b>, a full blood count, <b>U&amp;E</b> and glucose. Send the broader acute hepatitis screen (hepatitis B, C and E, plus a medicines, alcohol and supplement review) at the initial assessment where the diagnosis is uncertain, the illness is severe, the patient is immunocompromised or the exposure history is atypical. Do not wait for a negative HAV IgM if another diagnosis is clinically plausible."},
    {tone:"purple", h:"Jaundice at 40 or over: assess urgently in line with NG12", html:"NICE NG12 recommendation 1.2.4: refer people using a suspected cancer pathway referral for <b>pancreatic cancer</b> if they are <b>aged 40 and over and have jaundice</b>. For jaundice in a person aged 40 or over, assess urgently for pancreatic and biliary disease. A compatible positive HAV IgM with a hepatitic biochemical pattern may explain the jaundice and may mean that a cancer referral is not appropriate initially. <b>Persistent, painless, obstructive or predominantly cholestatic jaundice</b>, diagnostic uncertainty, a mass, or failure to improve should prompt urgent imaging and/or suspected cancer pathway referral. A positive HAV IgM does not exclude coexisting obstruction or another liver disease if the pattern is atypical."},
    {tone:"cream", h:"Care is supportive; exclusion is usually 7 days after jaundice", html:"There is no specific treatment. Offer rest, fluids and antiemetics. Use paracetamol cautiously, considering body weight, nutritional status, alcohol use, baseline liver disease and total paracetamol exposure. Advise no alcohol and review hepatotoxic drugs. The case is infectious from about <b>2 weeks before symptoms</b> until <b>1 week after jaundice</b> starts. Exclude from school, nursery or work according to the current UKHSA exclusion table, usually until <b>7 days after the onset of jaundice</b>. Where there is no jaundice, discuss the reference date with the health protection team. Food handlers and childcare workers need specific health protection team advice."},
    {tone:"green", h:"Contacts: the health protection team decides", html:"The <b>health protection team</b> defines close contacts, assesses prior immunity or vaccination, and arranges vaccine and/or HNIG. Do not decide the prophylaxis regimen without discussing the case with the team. Susceptible contacts aged 1 year or over generally receive <b>hepatitis A vaccine</b> within <b>14 days</b> of exposure. <b>Human normal immunoglobulin (HNIG)</b> may be added for people at higher risk of severe disease, such as those <b>aged over 60</b>, <b>immunosuppressed</b> or with <b>chronic liver disease, including hepatitis B or C</b>; in selected high-risk contacts it may be considered up to <b>28 days</b> after exposure. Infants under 1 year need individual advice. Symptomatic contacts need clinical assessment and testing, not prophylaxis alone."}
  ],
  pathwaySub:"The consultation in five moves. The first two are where harm happens if they are skipped.",
  pathway:[
    {title:"Screen for liver failure", html:"Conscious level, asterixis, bruising or bleeding, and the ability to keep fluids down. Check for pre-existing liver disease, alcohol use and age over 60. Encephalopathy with coagulopathy means possible acute liver failure: same-day hospital assessment. A raised or rising INR, hypoglycaemia or inability to keep fluids down needs urgent same-day discussion with acute medicine or hepatology."},
    {title:"Test and think wider", html:"HAV IgM, LFTs, INR, FBC, U&amp;E and glucose. Interpret HAV IgM with the clinical and biochemical picture. Send the hepatitis B, C and E screen at the first assessment if the diagnosis is uncertain, the illness is severe, the patient is immunocompromised or the exposure history is atypical, and review medicines, alcohol and supplements. Aged 40 or over with jaundice: assess urgently in line with NG12; persistent, painless, obstructive or cholestatic jaundice, a mass or failure to improve needs urgent imaging and/or a suspected cancer pathway referral."},
    {title:"Notify", html:"Notify the proper officer through the local route on suspicion, and phone the local UKHSA health protection team promptly when urgent public health action is needed. Have ready the patient's occupation (food handler, healthcare or care worker), any school or nursery attended, household and sexual contacts, and recent travel or foods eaten."},
    {title:"Support and exclude", html:"Supportive care at home, no alcohol, a medicines review, strict hand hygiene, no food preparation for others during the infectious period, and exclusion as advised by the health protection team (usually until 7 days after jaundice; if there is no jaundice, the team advises on the reference date)."},
    {title:"Follow to recovery, then prevent", html:"Repeat LFTs and INR according to severity and trajectory, until the patient is clinically well, synthetic function is stable or normal, and the trend is clearly improving. Reassure that hepatitis A does not become chronic and leaves lifelong immunity. Check that contacts have been dealt with, and use the episode to offer vaccination to others in at-risk groups."}
  ],
  sections:[
    {id:"redflags", nav:"Red flags", title:"Red flags: liver failure, and jaundice that is not hepatitis A", sub:"Most patients recover at home. These are the ones who must not be missed.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Encephalopathy", html:"New confusion, drowsiness, altered behaviour, slowed thinking, day-night reversal or asterixis in a jaundiced patient needs same-day hospital assessment. <b>Encephalopathy with coagulopathy</b> in a patient without established cirrhosis is <b>possible acute liver failure</b>. Avoid sedatives and other medicines that may obscure encephalopathy.", src:"BSG abnormal liver blood tests (Newsome 2018)"},
         {tone:"red", h:"🔴 Raised INR or bleeding", html:"A raised <b>INR</b>, spontaneous bruising, gum or nose bleeding. The INR is the best early marker of falling liver synthetic function. Check it at diagnosis and again if the patient deteriorates. A raised or rising INR in acute hepatitis needs <b>urgent clinical assessment and discussion with acute medicine or hepatology</b>. With encephalopathy, treat as possible acute liver failure.", src:"BSG abnormal liver blood tests (Newsome 2018)"},
         {tone:"red", h:"🔴 Unable to maintain hydration", html:"Persistent vomiting, oliguria or AKI on U&amp;E. Admit for fluids and monitoring, especially an older adult or someone with other illness."},
         {tone:"red", h:"🔴 Other warning features", html:"<b>Hypoglycaemia</b>, <b>rapidly increasing bilirubin</b>, <b>severe abdominal pain</b> or systemic deterioration. Arrange urgent same-day assessment."},
         {tone:"blue", h:"Use the terms precisely", html:"<b>Acute liver injury:</b> markedly abnormal liver blood tests. <b>Acute hepatic dysfunction:</b> INR rising or hypoglycaemia. <b>Acute liver failure:</b> coagulopathy plus encephalopathy in a patient without established cirrhosis. Using these terms improves communication with acute medicine and hepatology and avoids over- or under-triage."},
         {tone:"amber", h:"🟠 Higher-risk hosts", html:"<b>Older adults</b> and people with <b>chronic liver disease</b>, including chronic hepatitis B or C, or alcohol-related liver disease, have a higher case fatality. Review them more often and have a low threshold for specialist advice.", src:"Green Book ch.17 (2024)"},
         {tone:"amber", h:"🟠 Prolonged or relapsing course", html:"A small proportion have <b>cholestatic hepatitis</b>, with jaundice and itch lasting weeks to months, or a <b>relapse</b> after apparent recovery. Both usually still resolve, but discuss with hepatology and exclude other causes.", src:"UKHSA hepatitis A guidance (2024)"},
         {tone:"purple", h:"Jaundice aged 40 and over — NICE NG12 suspected cancer pathway referral", html:"<b>NICE NG12 1.2.4:</b> refer people using a suspected cancer pathway referral for pancreatic cancer if they are aged 40 and over and have jaundice. Assess urgently for pancreatic and biliary disease. A compatible HAV IgM-positive hepatitic illness is usually sufficient to explain the jaundice, and a cancer referral may not be appropriate initially. Where the serology is negative, or the jaundice is <b>persistent, painless, obstructive or predominantly cholestatic</b>, there is a mass, imaging is abnormal, symptoms fail to improve, or there is diagnostic uncertainty, arrange urgent imaging and/or the referral. Do not assume that a positive HAV IgM excludes coexisting obstruction or another liver disease if the biochemical pattern is atypical.", src:"NICE NG12 (updated April 2026), rec 1.2.4"}
       ]},
       {b:"why", html:"Hepatitis A does not become chronic, so its danger lies almost entirely in the first few weeks. It can fail the liver acutely, rarely, and mostly in older people or livers that were already damaged. Failure shows first as a rising INR and subtle confusion, long before the patient looks critically ill. The other trap is diagnostic: a hepatitis A outbreak in the news makes it easy to label every jaundiced patient as infective, and the NG12 age rule exists because painless jaundice in middle age is a classic presentation of pancreatic cancer."}
     ]},

    {id:"suspect", nav:"Suspect", title:"Who to suspect: exposure, incubation and presentation", sub:"Spread is faecal-oral. Most UK cases are linked to travel, a household or sexual contact, or a food-borne outbreak.",
     blocks:[
       {b:"table", head:["Feature","Detail"], rows:[
         ["<b>Incubation</b>","Usually about <b>28–30 days</b>, occasionally as short as <b>15</b> or as long as <b>50 days</b>. Ask about travel and exposures over the previous two months."],
         ["<b>Exposures</b>","Travel to countries with high or intermediate prevalence · household or sexual contact with a case · sex between men · injecting drug use · contaminated food (including shellfish and frozen berries in past outbreaks) or water · nurseries and residential settings"],
         ["<b>Prodrome</b>","Fever, malaise, anorexia, nausea, vomiting, aversion to smoking or fatty food, and right upper quadrant discomfort, lasting days to about a week"],
         ["<b>Icteric phase</b>","<b>Dark urine</b> and <b>pale stools</b> come first, then <b>jaundice</b>, often with itch. The fever usually settles as jaundice appears. There may be tender hepatomegaly."],
         ["<b>Age effect</b>","Young children often have a mild or silent infection and can spread it unnoticed. Adults are usually symptomatic and are more often jaundiced."],
         ["<b>Duration</b>","Most adults recover over several weeks. Fatigue can last longer. Infection does not become chronic and gives lifelong immunity."]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"🌍 Travel history", html:"Ask where, when, and whether they were vaccinated. Hepatitis A is one of the most common vaccine-preventable infections in travellers. A single dose before travel gives good protection, so an unvaccinated traveller is a missed prevention opportunity.", src:"Green Book ch.17 (2024)"},
         {tone:"blue", h:"🏳️‍🌈 Sexual history", html:"Outbreaks among <b>gay, bisexual and other men who have sex with men</b> recur. Ask sensitively about sexual contacts, which matters for tracing contacts. Offer a full STI and HIV screen, and vaccination of partners through the health protection team.", src:"Green Book ch.17 (2024) · UKHSA hepatitis A guidance (2024)"},
         {tone:"cream", h:"🍽️ Occupation matters", html:"<b>Food handlers</b>, healthcare and social care workers, and staff or children in <b>nurseries</b> create the biggest risk of onward spread. Record the occupation, and any setting attended, at the first contact, because it drives the public health response.", src:"UKHSA hepatitis A guidance (2024)"},
         {tone:"blue", h:"🔁 The same picture, a different virus", html:"<b>Hepatitis E</b> causes an almost identical acute illness and can be acquired in the UK as well as abroad. Include HEV IgM in the initial screen when the diagnosis is uncertain, and always when hepatitis A, B and C are negative.", src:"BSG abnormal liver blood tests (Newsome 2018)"}
       ]}
     ]},

    {id:"tests", nav:"Confirm", title:"Confirming it: serology, liver tests and what else to send", sub:"One set of bloods should confirm the diagnosis, grade the severity and rule out the other causes.",
     blocks:[
       {b:"table", head:["Test","What it tells you","Action"], rows:[
         ["<b>HAV IgM</b>","Strongly supports recent or current hepatitis A when consistent with the clinical and biochemical picture. Usually positive by the time symptoms appear. False-positive results, prolonged IgM positivity and recent vaccination can also give a positive result.","Positive and compatible: notify (if not already done) and manage as below. Unexpected or isolated positive, cholestatic LFTs or atypical symptoms: discuss with the microbiology or virology laboratory and consider confirmatory testing."],
         ["<b>HAV IgG / total antibody</b>","Past infection or vaccination, which means immunity","HAV IgG or total antibody alone indicates previous infection or vaccination, not acute infection. Look for another cause."],
         ["<b>ALT / AST</b>","Typically very high, often into the thousands, in a hepatitic pattern","Very high values alone do not predict a poor outcome. The INR and conscious level matter more."],
         ["<b>Bilirubin, ALP, GGT</b>","Bilirubin rises with jaundice. A dominant ALP rise suggests cholestasis or obstruction.","A cholestatic or obstructive picture needs imaging and makes NG12 more relevant."],
         ["<b>INR</b> (or prothrombin time)","Liver synthetic function","Raised or rising: urgent same-day discussion with acute medicine or hepatology. With encephalopathy: possible acute liver failure, same-day hospital assessment."],
         ["<b>FBC, U&amp;E, glucose</b>","Dehydration, AKI, hypoglycaemia in severe disease","Abnormal results in an unwell patient: admit."],
         ["<b>Acute hepatitis screen</b>","HBsAg and anti-HBc IgM, HCV antibody with reflex RNA, HEV IgM, plus a medication, alcohol and supplement review","Send at the initial assessment where the diagnosis is uncertain, the illness is severe, the patient is immunocompromised, or the exposure history is atypical. Do not wait for a negative HAV IgM if another diagnosis is clinically plausible. Otherwise send if HAV IgM is negative."],
         ["<b>Autoimmune liver screen</b>","Autoimmune hepatitis","Consider if viral and drug causes are not demonstrated."],
         ["<b>Ultrasound</b>","Biliary obstruction, mass, other liver disease","Consider if there is cholestasis, persistent jaundice, abdominal pain, hepatomegaly or concern about obstruction."],
         ["<b>Pregnancy test</b>","Pregnancy status","Where clinically relevant, before imaging or medication decisions."]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"🧪 Testing on suspicion", html:"Do not delay notification until the result is back. Notification is required on clinical suspicion. The health protection team may arrange oral fluid or other testing of contacts and genotyping of the case during an outbreak investigation.", src:"Health Protection (Notification) Regulations 2010 · UKHSA hepatitis A guidance (2024)"},
         {tone:"cream", h:"📈 Repeat bloods", html:"Repeat liver blood tests and INR according to clinical severity and trajectory. Base the frequency on age, comorbidity, severity, INR, bilirubin trend, hydration and symptoms. A practical approach: baseline LFTs, INR, glucose and U&amp;E on the day; repeat within a few days if older, unwell, jaundiced or with chronic liver disease; then at about 1–2-week intervals if abnormalities remain significant or symptoms persist. Continue until the patient is clinically well, synthetic function is stable or normal, and the biochemical trend is clearly improving. Aminotransferases can stay abnormal for some time after clinical recovery. Seek advice for a rising INR, worsening jaundice, persistent vomiting or failure of biochemical improvement. Persistent, worsening or cholestatic abnormalities need further investigation or hepatology advice.", src:"BSG abnormal liver blood tests (Newsome 2018)"},
         {tone:"blue", h:"🔎 Other causes to consider", html:"Hepatitis E · drug-induced liver injury · autoimmune hepatitis · biliary obstruction · acute hepatitis B · acute hepatitis C · EBV or CMV where appropriate · ischaemic hepatitis · pancreatic or hepatobiliary malignancy. A compatible HAV IgM-positive hepatitic illness is usually sufficient to explain the jaundice. Continue to investigate if the pattern is obstructive or cholestatic, there is a mass, imaging is abnormal, symptoms fail to improve, or there is diagnostic uncertainty.", src:"BSG abnormal liver blood tests (Newsome 2018) · NICE NG12"}
       ]}
     ]},

    {id:"notify", nav:"Notify", title:"The statutory duty: notify, and what the health protection team does next", sub:"Notification is the single step that protects the patient's household, workplace and community.",
     blocks:[
       {b:"cards", items:[
         {tone:"purple", h:"⚖️ Legal requirement", html:"<b>Acute infectious hepatitis</b> is a notifiable disease under the <b>Health Protection (Notification) Regulations 2010</b>. The attending registered medical practitioner must notify the proper officer of the local authority through the local notification route; in England the <b>UKHSA health protection team</b> manages the public health response. This is based on clinical suspicion. Do not wait for laboratory confirmation. The laboratory has a separate duty to report a positive HAV IgM.", src:"Health Protection (Notification) Regulations 2010 · UKHSA notifiable diseases guidance"},
         {tone:"purple", h:"⏱️ Timing", html:"The Regulations require notice <b>in writing within 3 days</b> of forming the suspicion, and oral notice as soon as reasonably practicable when the case is urgent. UKHSA guidance asks for urgent cases to be phoned to the health protection team <b>within 24 hours</b>, and all cases reported (for example online) within 3 days. Hepatitis A usually qualifies, because contact vaccination must happen within 14 days. Follow the telephone notification with the required written or electronic notification within 3 days.", src:"Health Protection (Notification) Regulations 2010 · UKHSA notifiable diseases guidance"},
         {tone:"amber", h:"📞 Local contact details", html:"Add the current local <b>UKHSA North West health protection team</b> contact number and notification route (including out of hours) to the practice version of this protocol before use.", src:"UKHSA notifiable diseases guidance"},
         {tone:"blue", h:"📋 Information to give", html:"Demographics, onset dates (first symptom and jaundice), occupation and workplace, school or nursery, household and sexual contacts, travel, foods eaten, and whether any contacts are pregnant, over 60, immunosuppressed or have liver disease.", src:"UKHSA hepatitis A guidance (2024)"},
         {tone:"green", h:"🤝 What the team then does", html:"The team defines close contacts, assesses prior immunity or vaccination, arranges vaccine and/or HNIG, and advises on exclusion for the case and for high-risk contacts. It looks for a common source and manages any outbreaks in nurseries, schools, food premises or among MSM. The GP's role is to notify early and to help with the practical steps.", src:"UKHSA hepatitis A guidance (2024)"}
       ]}
     ]},

    {id:"care", nav:"Supportive care", title:"Supportive care at home", sub:"No antiviral treatment exists. The aim is comfort, hydration and avoiding any further load on the liver.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Comfort", tone:"cream", title:"Symptom control", when:"everyone", fromLabel:"from day one",
          html:"Rest as needed. Small frequent meals and oral fluids. An antiemetic if vomiting, dose per BNF; choose it considering QT risk, sedation, renal or hepatic impairment and the possibility of encephalopathy. <b>Use paracetamol cautiously</b> for pain or fever, considering body weight, nutritional status, alcohol use, baseline liver disease and total paracetamol exposure. Avoid overdose and check combination products. Seek advice if there is significant hepatic impairment. Use a sedating antihistamine or emollient for itch."},
         {step:"Liver", tone:"amber", title:"Reduce the load on the liver", when:"until LFTs recover", fromLabel:"medicines review",
          html:"<b>No alcohol</b> until the liver tests are normal. Review all medicines, including over-the-counter and herbal products, and stop non-essential hepatotoxic drugs. Avoid NSAIDs in dehydration, AKI, gastrointestinal bleeding risk or significant hepatic or renal illness, and avoid sedatives and opioids that could mask or worsen encephalopathy. For oestrogen-containing contraception, check the FSRH UKMEC category for acute viral hepatitis."},
         {step:"Review", tone:"cream", title:"Planned follow-up", when:"by severity and trajectory", fromLabel:"do not leave it open",
          html:"Early review of hydration, conscious level and INR. Then repeat LFTs and INR at a frequency based on age, comorbidity, severity, INR, bilirubin trend, hydration and symptoms, until the patient is clinically well, synthetic function is stable or normal, and the trend is clearly improving. Persistent, worsening or cholestatic abnormalities need further investigation or hepatology advice. Safety-net clearly for confusion, bleeding and persistent vomiting."}
       ]},
       {b:"warn", html:"<b>Watch the older or already-cirrhotic patient closely.</b> The case fatality of hepatitis A rises with age and with pre-existing liver disease. For these patients, check the INR at diagnosis, review within 48 hours, and have a low threshold for discussion with hepatology."},
       {b:"say", html:"This is hepatitis A, a liver infection you catch from traces of the virus on hands, food or water. The good news is that it clears on its own. It doesn't become a long-term infection, and once you've had it you're immune for life. There isn't a tablet that kills the virus, so the treatment is rest, fluids, no alcohol, and letting the liver recover. I'll check your blood tests to make sure that's happening. If you become confused or very drowsy, start bruising or bleeding, or can't keep fluids down, you need to be seen that day."}
     ]},

    {id:"exclusion", nav:"Exclusion", title:"Infectivity, hygiene and exclusion", sub:"The virus is shed in stool, mostly before the patient knows they are ill.",
     blocks:[
       {b:"kv", rows:[
         ["Infectious period","From about <b>2 weeks before the first symptoms</b> until <b>1 week after the onset of jaundice</b>. If there is no jaundice, until 1 week after other clinical features such as dark urine or pale stools."],
         ["Exclusion of the case","Exclude from school, nursery or work according to the current UKHSA exclusion table, usually until <b>7 days after the onset of jaundice</b>. Where there is no jaundice, discuss the reference date with the health protection team. The team advises on individual and complex cases."],
         ["Food handlers","Exclude until 7 days after the onset of jaundice. Confirm return to work with the health protection team and the employer's occupational health pathway, rather than relying solely on a generic seven-day rule. The team advises on the premises, and there may be an investigation of the food business."],
         ["Children in nurseries","Young children often have silent infection and poor hygiene. The team assesses the setting as a whole and may offer vaccine to other children and staff. Childcare workers need specific health protection team advice on exclusion and return."],
         ["Hygiene at home","Wash hands thoroughly with soap and water after using the toilet and before handling food. Do not prepare food for others during the infectious period, and follow the exclusion period advised by the health protection team. Clean toilets and surfaces with a chlorine-based product. Do not share towels."],
         ["Sex","Avoid sexual contact, including oral-anal contact, during the infectious period. Partners should be assessed for vaccination."]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"🏫 The exclusion table", html:"UKHSA's exclusion table for children and young people settings gives hepatitis A as <b>exclusion until 7 days after onset of jaundice</b>. For a case without jaundice, discuss the reference date with the health protection team. Food handlers and childcare workers need specific team advice. The local health protection team manages the setting.", src:"UKHSA: Health protection in children and young people settings (exclusion table) · UKHSA hepatitis A guidance (2024)"},
         {tone:"green", h:"✅ Soap and water, not just gel", html:"Give cases and close contacts spoken and written advice on handwashing. <b>Soap and running water</b> is the standard in the household and in care settings, because alcohol-based rubs are less reliable against hepatitis A.", src:"UKHSA hepatitis A guidance (2024)"}
       ]}
     ]},

    {id:"contacts", nav:"Contacts", title:"Contacts and post-exposure prophylaxis", sub:"The health protection team defines close contacts, assesses prior immunity or vaccination, and arranges vaccine and/or HNIG. The GP should not decide the prophylaxis regimen without discussing the case with the team, but may be asked to give the vaccine or HNIG.",
     blocks:[
       {b:"table", head:["Close contact","Offer","Time window"], rows:[
         ["<b>Healthy, susceptible</b> household, sexual or other close contact aged <b>1 year and over</b>","<b>Hepatitis A vaccine</b>, single dose","Within <b>14 days</b> of exposure (the health protection team dates the exposure)"],
         ["Aged <b>over 60</b>, or <b>immunosuppressed</b>","Hepatitis A vaccine; <b>HNIG may be added</b> for higher risk of severe disease (team decides)","Within <b>14 days</b> of exposure"],
         ["<b>Chronic liver disease</b>, including chronic hepatitis B or C","Hepatitis A vaccine; <b>HNIG may be added</b> (team decides)","HNIG may be considered up to <b>28 days</b> after exposure in selected high-risk contacts, because the consequences of infection are more severe"],
         ["<b>Infants under 1 year</b>","Individual assessment by the health protection team. Hepatitis A vaccines are licensed from age 1.","As advised by the team"],
         ["<b>Beyond the window</b>, or already symptomatic","Prophylaxis is unlikely to help. Symptomatic contacts need clinical assessment and testing, not post-exposure prophylaxis alone. Advise hygiene.","—"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"💉 Vaccine, HNIG or both", html:"The choice between vaccine and HNIG is determined by time since exposure, age, susceptibility and risk of severe disease. HNIG and vaccine may be used together in selected contacts. The health protection team decides and arranges the supply of HNIG.", src:"UKHSA hepatitis A immunoglobulin guidance (2024)"},
         {tone:"cream", h:"🩺 GP role", html:"Do not decide the prophylaxis regimen independently. Give the vaccine promptly when the team asks, and record it. Flag any contacts known to be pregnant, immunosuppressed or to have liver disease. Tell symptomatic contacts to come forward for testing, and notify any new case.", src:"UKHSA hepatitis A guidance (2024)"},
         {tone:"green", h:"🤰 Pregnant contacts", html:"Hepatitis A vaccine is inactivated, and it can be given in pregnancy when the risk of infection is significant. Discuss with the health protection team.", src:"Green Book ch.17 (2024)"},
         {tone:"amber", h:"🟠 Completing the course", html:"A contact who receives one dose after exposure should be offered a <b>second (booster) dose</b> later if they remain in a risk group, such as MSM or a person with chronic liver disease, for long-term protection.", src:"Green Book ch.17 (2024)"}
       ]}
     ]},

    {id:"prevent", nav:"Prevention", title:"Pre-exposure vaccination: who should already be protected", sub:"Routine hepatitis A vaccination is for defined risk groups. Food-handler, childcare and healthcare-worker vaccination is based on health protection team advice and occupational or outbreak risk assessment, not routine practice-wide vaccination.",
     blocks:[
       {b:"table", head:["Group","Why"], rows:[
         ["<b>Travellers</b> to countries of high or intermediate prevalence","The most common route of UK infection. One dose before travel. A second dose 6–12 months later gives long-term protection."],
         ["<b>Chronic liver disease</b>, including hepatitis B or C and alcohol-related liver disease","Hepatitis A on a damaged liver carries a higher risk of liver failure and death."],
         ["<b>Gay, bisexual and other men who have sex with men</b>","Recurrent outbreaks through sexual transmission"],
         ["<b>People who inject drugs</b>","Outbreaks linked to poor hygiene and shared equipment"],
         ["<b>Haemophilia</b>","Historical risk from plasma-derived clotting factors"],
         ["<b>Occupational risk</b>","Selected laboratory, sewage and animal-exposure workers, as set out in the Green Book"],
         ["<b>Specified residential settings</b>","As set out in the Green Book"],
         ["<b>Food handlers, childcare and healthcare workers</b>","Not routinely indicated. Vaccinate only on health protection team advice during an outbreak or after an occupational risk assessment."]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"✅ Schedule", html:"Monovalent inactivated vaccine: a <b>single dose</b>, then a <b>booster at 6–12 months</b> for long-term protection. Combined hepatitis A and B, and hepatitis A and typhoid, vaccines exist for people who need both. A delayed booster does not mean restarting the course.", src:"Green Book ch.17 (2024)"},
         {tone:"blue", h:"🔎 Use the case", html:"When you diagnose hepatitis A, check the vaccination status of the practice's at-risk patients in the same household or network, such as partners with chronic liver disease or MSM contacts. Offer pre-exposure vaccination to anyone the health protection team has not already covered.", src:"Green Book ch.17 (2024)"}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer: who, where and how fast", sub:"The urgency is set by the liver and by public health.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same day: medical admission or urgent discussion", html:"Encephalopathy (with coagulopathy: possible acute liver failure) · bleeding or spontaneous bruising · persistent vomiting or dehydration · oliguria or AKI · hypoglycaemia · rapidly increasing bilirubin · severe abdominal pain or systemic deterioration · severe illness in an older adult or someone with chronic liver disease. A raised or rising INR alone: urgent same-day discussion with acute medicine or hepatology.", src:"BSG abnormal liver blood tests (Newsome 2018)"},
         {tone:"purple", h:"Statutory: notify the health protection team", html:"On clinical suspicion, notify the proper officer through the local route: telephone the UKHSA health protection team within 24 hours when urgent public health action is needed, then written or electronic notification within 3 days. This triggers contact tracing, vaccine or HNIG, and exclusion advice.", src:"Health Protection (Notification) Regulations 2010 · UKHSA notifiable diseases guidance"},
         {tone:"purple", h:"Suspected cancer pathway referral (appointment within 2 weeks) · NICE NG12 1.2.4", html:"Refer people using a suspected cancer pathway referral for <b>pancreatic cancer</b> if they are <b>aged 40 and over and have jaundice</b>. Assess urgently for pancreatic and biliary disease. A compatible positive HAV IgM with a hepatitic biochemical pattern may explain the jaundice and may mean that a cancer referral is not appropriate initially. Persistent, painless, obstructive or predominantly cholestatic jaundice, diagnostic uncertainty, a mass, or failure to improve should prompt urgent imaging and/or suspected cancer pathway referral.", src:"NICE NG12 (updated April 2026), rec 1.2.4"},
         {tone:"amber", h:"Soon: hepatology", html:"Pre-existing chronic liver disease · prolonged cholestasis or a relapsing course · persistent, worsening or cholestatic abnormalities, or failure of biochemical improvement · diagnostic uncertainty with a negative acute hepatitis screen.", src:"BSG abnormal liver blood tests (Newsome 2018)"},
         {tone:"green", h:"Stays in primary care", html:"Well, drinking, alert, INR normal: supportive care, notification, exclusion, LFTs and INR until clinically well with a clearly improving trend, and a check that contacts have been dealt with.", src:"UKHSA hepatitis A guidance (2024)"}
       ]},
       {b:"say", html:"We have to tell the public health team about hepatitis A by law. That isn't about you having done anything wrong. It's so they can offer a vaccine to the people you live with, because if they get it within two weeks it can stop them catching it. Please stay off work until the public health team says it's safe, usually a week after the yellowness started, and don't cook for anyone else until then."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card. The Casebook holds the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 34-year-old chef rings for results. His ALT is 2,400 and his bilirubin is raised, after two weeks of malaise and a week of dark urine following a trip abroad. HAV IgM is positive. He wants to go back to work tomorrow because the restaurant is short-staffed. He lives with his partner and their 3-year-old, who goes to nursery.", src:"UKHSA hepatitis A guidance (2024)"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Asks about <b>confusion, bleeding and vomiting</b> and checks the <b>INR</b>. Explains the <b>statutory notification</b>, and phones the health protection team. Advises <b>exclusion, usually until 7 days after jaundice</b>, explains why this is essential for a <b>food handler</b>, and says return to work is agreed with the health protection team and occupational health. Identifies the partner and the nursery child as likely close contacts whom the health protection team will assess for <b>vaccine within 14 days</b>. Gives hygiene advice with soap and water. Advises no alcohol and reviews medicines. Arranges repeat LFTs and INR based on severity. Handles his concern about the job with empathy, without giving way on exclusion.", src:"Health Protection (Notification) Regulations 2010 · UKHSA hepatitis A guidance (2024)"}
     ]}]},
