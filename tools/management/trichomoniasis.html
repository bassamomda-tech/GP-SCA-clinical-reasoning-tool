<script>
MG.render({
  icon:"🦠",
  title:"Trichomoniasis",
  eyebrow:"Protocol · assess and manage in one place",
  stemTitle:"Trichomonas: test with NAAT, give women 7 days of metronidazole, follow the sexual-health pathway for men, and treat the partner too",
  stemSub:"One page for Trichomonas vaginalis in primary care. It is a sexually transmitted protozoan that mimics bacterial vaginosis and thrush, is often silent in men, and is missed on routine swabs unless a NAAT is requested. Confirm it, treat women with the 7-day metronidazole course that outperforms the single dose in women, treat men according to the current BASHH/local sexual-health pathway, treat current partners epidemiologically through sexual health, screen for the other STIs including HIV, and recognise when discharge is not infection at all.",
  guideline:"BASHH Trichomonas vaginalis 2021 · Kissinger, Lancet Infect Dis 2018 · NICE NG12 (updated April 2026)",
  meta:[
    {t:"BASHH 2021 · Trichomonas vaginalis"},
    {t:"BASHH 2023 · STI testing"},
    {t:"BHIVA/BASHH/BIA 2020 · HIV testing"},
    {t:"Suspected cancer · NG12 cervix and vagina", tone:"tw"}
  ],
  lead:"<div class='mg-layers'><a href='#test'><b>Test</b><small>NAAT, not just microscopy</small></a><a href='#treat'><b>Treat</b><small>metronidazole 7 days (women)</small></a><a href='#partners'><b>Partners</b><small>treat regardless of result</small></a><a href='#failure'><b>Not cleared?</b><small>adherence, reinfection, resistance</small></a></div>",
  quickSub:"The six points that change what you do today. Each traces to a named primary source under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"cream", h:"In women, seven days beats one dose", html:"<b>Women: metronidazole 400–500 mg twice daily for 7 days is the preferred regimen</b> (BASHH 2021). In a randomised trial of 623 women, persistent infection at test of cure was <b>11% after 7 days versus 19% after a single 2 g dose</b>. <b>Men:</b> evidence comparing regimens is limited — follow the current BASHH/local sexual-health pathway; a single 2 g dose may be used in some circumstances, while a 7-day course may be preferred after treatment failure or where clinically indicated. Sexual-health advice is recommended."},
    {tone:"blue", h:"Ask for a TV NAAT — do not rely on the wet mount", html:"A <b>nucleic acid amplification test</b> on a vulvovaginal swab (women; urine may be less sensitive) or first-void urine or urethral swab according to local laboratory requirements (men) is the most sensitive test. Wet-mount microscopy has limited sensitivity and a negative result does not exclude infection. Check whether your laboratory offers TV NAAT and whether it is automatically included with chlamydia/gonorrhoea testing. A frothy discharge or a pH above 4.5 is suggestive, not diagnostic."},
    {tone:"amber", h:"Treat current partners whatever their result", html:"Current and recent partners (the <b>4 weeks before presentation</b>) should be offered a full STI screen and epidemiological treatment through sexual-health services. <b>Do not withhold partner treatment while waiting for a test result</b>, and treat current partners even if their own test is negative — a negative male NAAT does not reliably exclude infection because of limits of sensitivity and sampling. Sexual health services lead partner notification."},
    {tone:"blue", h:"It is an STI: screen for the rest, including HIV", html:"Offer chlamydia and gonorrhoea NAAT, syphilis serology and an <b>HIV test</b>, with hepatitis B and C testing according to risk and a pregnancy test where clinically relevant — guided by sexual history, local policy and patient preference. Trichomoniasis increases the risk of acquiring and passing on HIV, and a new STI diagnosis is an indication for HIV testing."},
    {tone:"green", h:"Pregnancy and breastfeeding: treat, using the 7-day course", html:"Treat symptomatic pregnant patients promptly with the standard 7-day course and involve the maternity/sexual-health team; high single doses are not recommended in pregnancy. TV is associated with adverse pregnancy outcomes, but the impact of treatment on obstetric outcomes is not certain. Routine screening of asymptomatic pregnant women is not recommended. UKTIS finds no increase in birth defects with metronidazole; it is generally compatible with breastfeeding — follow product information after a 2 g single dose."},
    {tone:"purple", h:"Discharge or bleeding with a suspicious cervix is a cancer question", html:"NICE NG12: consider a suspected cancer pathway referral if, on examination, the <b>appearance of the cervix is consistent with cervical cancer</b>, or for vaginal cancer with an <b>unexplained palpable mass in or at the entrance to the vagina</b>. Always look at the cervix when discharge persists — but persistent discharge alone is not a suspected-cancer referral: examine, test for STIs, review cervical screening and ask about abnormal or contact bleeding."}
  ],
  pathwaySub:"The consultation in five moves.",
  pathway:[
    {title:"Take a sexual history and look", html:"Symptoms, partners in the last few months, contraception, pregnancy, and previous STIs. Examine with a speculum where appropriate: discharge character, vulvitis, cervical appearance, and anything that is not simply infection (a mass, contact bleeding from an abnormal cervix)."},
    {title:"Test properly", html:"<b>TV NAAT</b> on a vulvovaginal swab (self-taken is acceptable) or first-void urine in men, alongside <b>chlamydia and gonorrhoea NAAT, syphilis serology and HIV</b>. Consider bacterial vaginosis and candida at the same time."},
    {title:"Treat: 7 days of metronidazole in women", html:"<b>Women: metronidazole 400–500 mg twice daily for 7 days</b>. Men: follow the current BASHH/local sexual-health pathway. Counsel on alcohol, the metallic taste and completing the course. Avoid vaginal, anal and oral sex until both partners have completed treatment and for at least 7 days, including with a new partner."},
    {title:"Partners through sexual health", html:"Refer or signpost for <b>partner notification</b> covering at least the previous 4 weeks. Current partners are treated epidemiologically, without waiting for their own test result; recent partners are offered testing and treatment according to sexual-health advice."},
    {title:"Retest if symptoms persist or partner treatment is uncertain", html:"A routine test of cure is not needed if symptoms settle and the partner has been treated. If symptoms persist or recur, or partner treatment is uncertain, retest with NAAT <b>no earlier than about 4 weeks after treatment</b> (sooner only after specialist discussion), and work through adherence, reinfection and resistance. Retest after a new exposure or suspected reinfection rather than repeatedly treating empirically."}
  ],
  sections:[
    {id:"recognise", nav:"Recognise", title:"Who has it and how it presents", sub:"Trichomoniasis often looks like something else, and in many people it causes no symptoms at all.",
     blocks:[
       {b:"table", head:["","Women","Men"], rows:[
         ["<b>Where the organism lives</b>","Vagina, urethra and paraurethral glands","Mainly the urethra; occasionally the subpreputial sac"],
         ["<b>Symptoms</b>","Vaginal discharge (sometimes frothy and yellow-green, often not), vulval itch and soreness, dysuria, offensive odour, superficial dyspareunia","Often none. Urethral discharge or dysuria when present"],
         ["<b>Signs</b>","Vulvitis and vaginitis; the classic punctate haemorrhagic ‘strawberry cervix’ is visible to the naked eye in only a small minority","Usually none"],
         ["<b>Silent infection</b>","Many have few or no symptoms","Most have few or no symptoms"],
         ["<b>Pregnancy</b>","Associated with adverse pregnancy outcomes (preterm birth, low birth weight and postpartum sepsis); the impact of treatment on obstetric outcomes is not certain","—"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"🔍 The common mimics", html:"<b>Bacterial vaginosis</b> (thin grey discharge, fishy odour, pH above 4.5 — like TV, but not sexually transmitted in the same way and no partner treatment) and <b>vulvovaginal candidiasis</b> (itch, thick white discharge, normal pH). Mixed infection is common, so a positive BV or candida result does not exclude TV.", src:"BASHH Trichomonas vaginalis 2021"},
         {tone:"amber", h:"🟠 Discharge that is not infection", html:"Cervical ectropion, a retained foreign body (tampon), atrophic vaginitis, cervicitis from chlamydia or gonorrhoea, and — rarely — cervical or vaginal cancer. Examine the cervix before assuming a persisting discharge is a resistant infection.", src:"BASHH STI testing 2023 · NICE NG12"}
       ]},
       {b:"why", html:"Trichomoniasis sits in the gap between the vaginal infections GPs treat empirically and the STIs they refer. Because it looks like BV and is often silent in men, it keeps circulating in couples: the woman is treated for BV repeatedly while the untreated partner reinfects her."}
     ]},

    {id:"test", nav:"Test", title:"Testing: getting the right sample to the right test", sub:"The diagnostic step is where most trichomoniasis is missed.",
     blocks:[
       {b:"table", head:["Test","Use","Notes"], rows:[
         ["<b>TV NAAT</b> — test of choice","Vulvovaginal swab (clinician or self-taken) in women; first-void urine or urethral swab in men","Most sensitive method. Check whether your laboratory offers TV NAAT and whether it is automatically included with chlamydia/gonorrhoea testing — <b>request it specifically</b> if not. In women, urine may be less sensitive than a vaginal swab; in men, use first-void urine or urethral swab according to local laboratory requirements. A negative NAAT from an inappropriate sample, or taken too soon after treatment, does not exclude infection"],
         ["<b>Wet-mount microscopy</b>","Point-of-care in sexual health clinics","Specific, but misses many infections; a negative result does not exclude TV"],
         ["<b>Vaginal pH</b>","Supporting only","Above 4.5 in TV and BV; normal in candida"],
         ["<b>Cervical cytology</b>","Not a diagnostic test","An incidental TV report on cytology should be confirmed with NAAT before treatment where possible"],
         ["<b>Other STIs</b>","Offer to everyone with TV — tailored to sexual history, local sexual-health policy and patient preference","Chlamydia and gonorrhoea NAAT, syphilis serology, HIV test; hepatitis B and C according to risk; pregnancy test where clinically relevant. Consider sexual-health referral for vaccination, partner notification and risk reduction"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"🧪 Testing men", html:"Men are tested mainly as <b>partners of women with TV</b>, or with persistent urethritis after standard treatment. A negative NAAT in a male partner does not reliably exclude infection — a limitation of test sensitivity and sampling, not a sign that most negative tests are false — which is why current partners are treated regardless.", src:"BASHH Trichomonas vaginalis 2021"},
         {tone:"blue", h:"🩸 HIV testing is part of the package", html:"An STI diagnosis is an indication to offer HIV testing. TV causes genital inflammation that increases both acquisition and transmission of HIV.", src:"BHIVA/BASHH/BIA HIV testing 2020"}
       ]}
     ]},

    {id:"redflags", nav:"Red flags", title:"Red flags and situations that change the plan", sub:"Trichomoniasis itself is rarely dangerous. What travels with it can be.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Pelvic pain, fever or an acute abdomen", html:"TV does not usually cause pelvic inflammatory disease, but it often coexists with other STIs. Pelvic pain with cervical motion tenderness or fever needs PID assessment; severe pain, peritonism or a possible ectopic pregnancy needs same-day hospital assessment.", src:"BASHH STI testing 2023"},
         {tone:"amber", h:"🟠 Pregnancy", html:"Associated with adverse pregnancy outcomes; the impact of treatment on obstetric outcomes is not certain. Treat symptomatic infection promptly with the 7-day course and involve the maternity/sexual-health team.", src:"BASHH Trichomonas vaginalis 2021"},
         {tone:"amber", h:"🟠 Metronidazole allergy", html:"There is no effective non-nitroimidazole alternative. Refer to sexual health or infectious diseases. Do not substitute topical metronidazole or empirically use another unrelated antimicrobial. Specialist desensitisation may be considered in selected cases.", src:"BASHH Trichomonas vaginalis 2021"},
         {tone:"amber", h:"🟠 Under 16, or signs of exploitation", html:"Any STI in a child or young person requires an age-appropriate safeguarding assessment. Sexual activity under 13 requires referral through local safeguarding procedures. For ages 13–15, assess competence, consent, partner age, coercion, exploitation and power imbalance, and follow local safeguarding guidance. Consider age and developmental stage, trafficking, online grooming and immediate safety. Use the current statutory safeguarding guidance and local pathway.", src:"Working Together to Safeguard Children 2026"},
         {tone:"purple", h:"Abnormal cervix or vaginal mass — NG12 <span class='tw'>Suspected cancer</span>", html:"Consider a suspected cancer pathway referral (for an appointment within 2 weeks) for women, and trans men and non-binary people with female reproductive organs, if on examination <b>the appearance of their cervix is consistent with cervical cancer</b>; and for vaginal cancer in those with an <b>unexplained palpable mass in or at the entrance to the vagina</b>.", src:"NICE NG12 (updated April 2026)"}
       ]}
     ]},

    {id:"treat", nav:"Treat", title:"Treatment", sub:"Oral nitroimidazoles are the only effective treatment. Topical metronidazole gel does not reach urethral and glandular reservoirs and should not be used.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Recommended", tone:"cream", title:"Metronidazole 7-day course", when:"women, including pregnancy and breastfeeding", fromLabel:"preferred in women",
          html:"<b>Women: metronidazole 400–500 mg twice daily for 7 days is the preferred regimen</b> (BASHH 2021). The 7-day course is supported by the Kissinger randomised trial, which found about half the rate of persistent infection compared with the single dose in women."},
         {step:"Men", tone:"cream", title:"Follow the sexual-health pathway", when:"men", fromLabel:"evidence limited",
          html:"Follow the current BASHH/local sexual-health pathway; a single 2 g dose may be used in some circumstances, while a 7-day course may be preferred after treatment failure or where clinically indicated. Sexual-health advice is recommended. Do not present the 7-day regimen as conclusively superior for men unless the local pathway adopts it."},
         {step:"Alternative", tone:"amber", title:"Single-dose regimen", when:"selected situations, after discussion with sexual health", fromLabel:"less effective in women",
          html:"A 2 g single dose of metronidazole is less effective than the 7-day regimen in women but may be considered in selected situations after discussion with sexual health — for example where adherence to a 7-day course is unlikely, rapid supervised treatment is necessary, the local sexual-health pathway recommends it, or a man is being treated under a local regimen. It should not be used as the preferred regimen in pregnancy. Tinidazole 2 g is a specialist/sexual-health alternative, particularly where metronidazole resistance or treatment failure is suspected."},
         {step:"Always", tone:"cream", title:"Partner treatment and abstinence", when:"every case", fromLabel:"prevents reinfection",
          html:"Current partners are treated epidemiologically at the same time through sexual health. Avoid vaginal, anal and oral sex until both partners have completed treatment and for at least 7 days, or until the local sexual-health service confirms that sexual contact can resume — including sex with a new partner during treatment."}
       ]},
       {b:"warn", html:"<b>Vaginal metronidazole gel is not an adequate eradication treatment for TV</b> because it does not reliably treat urethral and paraurethral reservoirs."},
       {b:"table", head:["Counselling point","What to say","Source"], rows:[
         ["<b>Alcohol</b>","Follow the current metronidazole product information; avoid alcohol during treatment and for the advised period afterwards (commonly <b>48 hours</b>). Evidence for a disulfiram-like reaction (flushing, nausea, vomiting, palpitations) is limited — it is possible, not inevitable","BNF · metronidazole SPC"],
         ["<b>Side effects</b>","Metallic taste, nausea and gastrointestinal upset are common; take with or after food","Metronidazole SPC"],
         ["<b>Interactions</b>","Enhances warfarin effect (check INR); raises lithium and busulfan levels","BNF"],
         ["<b>Completing the course</b>","Most treatment failures are missed doses or an untreated partner, not resistance","BASHH Trichomonas vaginalis 2021"]
       ]},
       {b:"why", html:"The single 2 g dose became standard for convenience rather than because it worked best. When it was compared directly with 7 days of 500 mg twice daily in 623 non-pregnant, HIV-negative women, the 7-day course left 11% still infected against 19% with the single dose. BASHH 2021 reflects this, and it is why this page does not present single-dose treatment as an equal first-line option in women. The trial was conducted in women; evidence comparing regimens in men is limited, so men are treated according to the current BASHH/local sexual-health pathway."}
     ]},

    {id:"partners", nav:"Partners", title:"Partners, abstinence and reinfection", sub:"Reinfection from an untreated partner is the commonest reason trichomoniasis ‘comes back’.",
     blocks:[
       {b:"timeline", items:[
         {n:"1", when:"Diagnosis", title:"Identify contacts", html:"Partners within the preceding <b>4 weeks</b>, or the last partner if longer ago: offer testing, notification and treatment according to sexual-health advice. Sexual health health-advisers can notify partners anonymously."},
         {n:"2", when:"Same time", title:"Treat current partners", html:"Treat current partners epidemiologically, <b>without waiting for their own test result</b>, and offer them a full STI screen including HIV. New partners after the index infection: assess for reinfection and treat if indicated."},
         {n:"3", when:"During treatment", title:"No sex", html:"Avoid vaginal, anal and oral sex until both partners have completed treatment and for at least 7 days, or until the local sexual-health service confirms that sexual contact can resume. This includes sex with a new partner during the treatment period."},
         {n:"4", when:"If symptoms persist", title:"Retest and review", html:"NAAT no earlier than about <b>4 weeks after treatment</b> (earlier tests can detect non-viable organism DNA; test sooner only after specialist discussion). Routine test of cure is not required if symptoms resolve and partner treatment is confirmed. Ask directly about missed doses and new or untreated partners, and retest after a new exposure or suspected reinfection rather than repeatedly treating empirically."}
       ]},
       {b:"say", html:"This is a sexually transmitted infection, and it’s easy to pass back and forth, so your partner needs treating at the same time even if their test comes back clear. The tablets are twice a day for a week. Avoid alcohol while taking them and for the time the leaflet advises afterwards, usually two days. No sex — vaginal, anal or oral, including with anyone new — until you’ve both finished treatment and for at least a week."},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"✅ Prevention", html:"Condoms reduce the risk of TV and other STIs. Encourage testing with each new partner, and a repeat screen after any new partner.", src:"BASHH Trichomonas vaginalis 2021"},
         {tone:"cream", h:"🩺 GP role in partner notification", html:"If the patient will not attend sexual health, document the conversation, give written information for partners, and offer treatment to partners who are registered with you.", src:"BASHH Trichomonas vaginalis 2021"}
       ]}
     ]},

    {id:"pregnancy", nav:"Pregnancy", title:"Pregnancy and breastfeeding", sub:"Treat symptomatic infection with the standard 7-day course; routine screening of asymptomatic pregnant women is not recommended.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"🤰 Pregnancy", html:"Treat symptomatic pregnant patients promptly with <b>metronidazole 400–500 mg twice daily for 7 days</b> and involve the maternity/sexual-health team; high single doses are not recommended in pregnancy. Routine screening of asymptomatic pregnant women is not currently recommended unless there is a specific clinical indication or local pathway. Trichomoniasis is associated with adverse pregnancy outcomes; treatment is recommended to treat infection and symptoms and reduce transmission. The impact on obstetric outcomes is not certain.", src:"BASHH Trichomonas vaginalis 2021"},
         {tone:"green", h:"✅ Metronidazole safety in pregnancy", html:"Metronidazole has been well studied in pregnancy and is not known to cause birth defects, stillbirth, low birth weight or preterm delivery.", src:"UKTIS metronidazole monograph"},
         {tone:"green", h:"🍼 Breastfeeding", html:"Metronidazole is generally compatible with breastfeeding. Follow the current product information and specialist/local advice, particularly after a 2 g single dose — manufacturers may advise caution or temporary interruption after a high single dose. Monitor the infant for diarrhoea, oral candidiasis or feeding problems. The 7-day regimen is preferred in pregnancy and avoids the need for a high single dose.", src:"SPS breastfeeding advice · BNF"}
       ]}
     ]},

    {id:"failure", nav:"Not cleared?", title:"Persistent or recurrent infection", sub:"Work through the causes in order before assuming resistance.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"1 · Was the course taken?", html:"Missed doses, vomiting, or stopping early because of taste or alcohol are the usual culprits.", src:"BASHH Trichomonas vaginalis 2021"},
         {tone:"amber", h:"2 · Was the partner treated?", html:"An untreated or new partner is the commonest cause of apparent failure.", src:"BASHH Trichomonas vaginalis 2021"},
         {tone:"amber", h:"3 · Repeat the standard course", html:"If adherent and reinfection is unlikely, repeat <b>metronidazole 400–500 mg twice daily for 7 days</b> if appropriate. After failure of a repeat standard course, with reinfection and non-adherence excluded, management should be specialist-led. Avoid repeated empiric courses because resistance and alternative diagnoses must be considered.", src:"BASHH Trichomonas vaginalis 2021"},
         {tone:"blue", h:"4 · Specialist-only regimens", html:"<b>Specialist only — do not initiate routinely in general practice.</b> Continuing infection after a repeat course is managed by sexual health: higher-dose metronidazole (for example 2 g daily for 5–7 days, or 800 mg three times daily for 7 days), tinidazole, and susceptibility testing. These regimens carry greater adverse-effect and toxicity risks.", src:"BASHH Trichomonas vaginalis 2021"},
         {tone:"red", h:"5 · Is it TV at all?", html:"Re-examine the cervix and vagina. Persisting discharge or bleeding with an abnormal cervix or a vaginal mass follows the NG12 pathway, not another antibiotic.", src:"NICE NG12 (updated April 2026)"},
         {tone:"blue", h:"6 · Co-infection", html:"Recheck for chlamydia, gonorrhoea, BV and candida, which commonly coexist and cause similar symptoms.", src:"BASHH STI testing 2023"}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer: who, where and how fast", sub:"Sexual health services are the default partner for every diagnosis.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same day", html:"Acute pelvic pain with peritonism, suspected ectopic pregnancy, or severe PID features with systemic illness.", src:"BASHH STI testing 2023"},
         {tone:"purple", h:"Urgent referral routes <span class='tw'>Suspected cancer</span> · NICE NG12", html:"Consider a suspected cancer pathway referral (for an appointment within 2 weeks) for women, and trans men and non-binary people with female reproductive organs, if on examination <b>the appearance of their cervix is consistent with cervical cancer</b>; and for vaginal cancer in those with an <b>unexplained palpable mass in or at the entrance to the vagina</b>.", src:"NICE NG12 (updated April 2026)"},
         {tone:"amber", h:"Soon — sexual health", html:"Every new diagnosis, for partner notification and a full STI screen, and men for treatment according to the local pathway. Also treatment failure after a repeat course, metronidazole allergy, HIV co-infection, and safeguarding concerns in a young person.", src:"BASHH Trichomonas vaginalis 2021"},
         {tone:"amber", h:"Maternity team", html:"Symptomatic TV diagnosed in pregnancy: treat with the 7-day course and involve the maternity/sexual-health team. TV is associated with adverse pregnancy outcomes, but the impact of treatment on obstetric outcomes is not certain.", src:"BASHH Trichomonas vaginalis 2021"},
         {tone:"green", h:"Stays in primary care", html:"Confirmed uncomplicated TV in a woman treated with a 7-day course, partner treatment arranged through sexual health, and a safety-net to retest if symptoms continue.", src:"BASHH Trichomonas vaginalis 2021"}
       ]},
       {b:"warn", html:"Do not treat recurrent ‘BV’ with repeated metronidazole without testing for TV and asking about partners. Recurrent discharge in a sexually active woman is a reason to test properly, not to prescribe again."},
       {b:"why", html:"<b>The 30-second answer.</b> Confirm trichomoniasis with a TV NAAT and involve sexual health. Wet-mount microscopy and vaginal pH are supportive only, and a negative microscopy result does not exclude infection. In women, the preferred regimen is oral metronidazole 400–500 mg twice daily for 7 days; pregnancy requires the 7-day regimen rather than a high single dose. Men should be treated according to the current BASHH/local sexual-health pathway because the evidence for 7-day treatment is less robust than in women. Treat current partners epidemiologically, offer recent partners a full STI screen and partner notification, and avoid sex until both partners have completed treatment and the recommended abstinence period has elapsed. Offer chlamydia, gonorrhoea, syphilis and HIV testing, with hepatitis testing according to risk. If symptoms persist or recur, check adherence and reinfection, then repeat NAAT no earlier than approximately 4 weeks after treatment and refer for specialist management if a repeat standard course fails. Examine the cervix when discharge persists and use the NICE suspected-cancer pathway for a suspicious cervix or vaginal mass."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card. The Casebook holds the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 29-year-old woman has had three courses of metronidazole gel for ‘BV’ in six months. The discharge keeps coming back. The latest swab report says Trichomonas vaginalis NAAT positive. She is upset and asks whether it means her husband has been unfaithful.", src:"BASHH Trichomonas vaginalis 2021"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Explains TV as a <b>sexually transmitted infection</b> without assigning blame (it can persist silently for long periods); prescribes <b>oral metronidazole 400–500 mg twice daily for 7 days</b> rather than gel or a single dose; addresses <b>partner treatment regardless of his result</b>; offers a <b>full STI screen and HIV test</b>; covers <b>alcohol as per the product information</b> and abstinence for at least 7 days and until both have completed treatment; examines the cervix; and safety-nets a retest if symptoms persist.", src:"BASHH Trichomonas vaginalis 2021 · BNF"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Every recommendation on this page traces to a named primary source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>BASHH — UK national guideline on the management of Trichomonas vaginalis (2021)</b>. Sherrard J et al. Int J STD AIDS 2022 (primary source)<br><a href="https://www.bashh.org/resources/20/trichomonas_vaginalis_2021/" rel="noopener">bashh.org — Trichomonas vaginalis 2021</a> · <a href="https://journals.sagepub.com/doi/10.1177/09564624221103035" rel="noopener">Int J STD AIDS — doi:10.1177/09564624221103035</a><span class="rd"> — sites of infection, NAAT diagnosis, 7-day metronidazole, pregnancy, partner notification look-back, abstinence, test of cure and treatment failure</span></li>'+
         '<li><b>Kissinger P et al. Single-dose versus 7-day-dose metronidazole for the treatment of trichomoniasis in women: an open-label, randomised controlled trial. Lancet Infect Dis 2018;18:1251–9</b><br><a href="https://www.thelancet.com/journals/laninf/article/PIIS1473-3099(18)30423-7/abstract" rel="noopener">thelancet.com</a><span class="rd"> — in women: persistent infection 11% (34/312) versus 19% (58/311), relative risk 0.55; not conducted in men</span></li>'+
         '<li><b>BASHH — Summary guidance on testing for sexually transmitted infections (2023)</b><br><a href="https://www.bashh.org/_userfiles/pages/files/resources/bashh_summary_guidance_on_stis_testing_2023.pdf" rel="noopener">bashh.org — STI testing 2023</a><span class="rd"> — accompanying STI screen</span></li>'+
         '<li><b>BHIVA/BASHH/BIA — Adult HIV testing guidelines (2020)</b><br><a href="https://bhiva.org/clinical-guideline/hiv-testing-guidelines/" rel="noopener">bhiva.org — HIV testing 2020</a><span class="rd"> — HIV testing after an STI diagnosis</span></li>'+
