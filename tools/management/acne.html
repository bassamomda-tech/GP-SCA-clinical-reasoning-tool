<script>
MG.render({
  icon:"🧴",
  title:"Acne Vulgaris",
  eyebrow:"Protocol · assess and manage in one place",
  stemTitle:"Acne vulgaris — count the lesions, commit to 12 weeks, never prescribe antibiotic monotherapy or combine topical and oral antibiotics, and refer before the scars set",
  stemSub:"Acne is judged by the lesion count and by what it is doing to the person. Pick the NG198 severity band from the count, start one fixed topical combination for a full 12 weeks, add an oral tetracycline only alongside a non-antibiotic topical, review it at 12 weeks and continue beyond 6 months only exceptionally, keep the gains with maintenance treatment, and refer promptly when there is scarring, pigmentation, fulminans, or a case for isotretinoin under the MHRA safeguards. Sources: NICE NG198 (2021, last updated 30 April 2026) · MHRA Drug Safety Updates (co-cyprindiol June 2013; cyproterone acetate and meningioma; isotretinoin October 2023, October 2025 and changes from 22 January 2026) · Greater Manchester antimicrobial guidance and formulary · BNF · product SPCs.",
  guideline:"NICE NG198 (2021, last updated 30 April 2026) · MHRA Drug Safety Updates (June 2013; October 2023; October 2025; 22 January 2026) · Greater Manchester antimicrobial guidance · BNF · SPCs",
  meta:[
    {t:"NICE NG198 · acne vulgaris management (2021, last updated 30 April 2026)"},
    {t:"MHRA DSU Oct 2023, Oct 2025 and 22 Jan 2026 · isotretinoin safeguards and PPP"},
    {t:"MHRA DSU Jun 2013 · co-cyprindiol · cyproterone and meningioma"},
    {t:"BNF · MHRA SPCs (Epiduo, Treclin, Duac Once Daily, Skinoren)"},
    {t:"SAFA trial · Santer et al., BMJ 2023"},
    {t:"Greater Manchester antimicrobial guidance · GMMMG Formulary"}
  ],
  lead:"<div class='mg-layers'><a href='#flags'><b>Red flags</b><small>Fulminans, scarring, mood</small></a><a href='#grade'><b>Grade</b><small>Count the lesions</small></a><a href='#firstline'><b>First line</b><small>Five 12-week regimens</small></a><a href='#refer'><b>Refer</b><small>Same day to routine</small></a></div>",
  quickSub:"Six cards that cover most acne consultations. Each figure traces to a source listed under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"Acne fulminans is a same-day referral", html:"Sudden severe inflammatory acne with ulceration or crusting, often with fever, joint pain or feeling unwell. NICE NG198 asks for <b>urgent referral the same day to the on-call hospital dermatology team</b>, for assessment within 24 hours. Do not manage routinely in primary care or wait for a standard 12-week review, and do not prescribe isotretinoin as a primary-care response.", src:"NICE NG198 (2021, last updated 30 April 2026)"},
    {tone:"blue", h:"Count, don’t guess", html:"NG198 uses two bands. <b>Mild to moderate:</b> any number of comedones, up to 34 inflammatory lesions, or up to 2 nodules. <b>Moderate to severe:</b> 35 or more inflammatory lesions, or 3 or more nodules. The band decides which first-line options are open.", src:"NICE NG198 (2021, last updated 30 April 2026)"},
    {tone:"cream", h:"Five first-line regimens, prescribed for 12 weeks", html:"Every NG198 first-line option is a combination of two agents with different actions, used for a <b>12-week course</b> before judging it. Benefit usually takes 6–8 weeks to show, so judge the course at 12 weeks rather than stopping early.", src:"NICE NG198 (2021, last updated 30 April 2026)"},
    {tone:"amber", h:"No antibiotic monotherapy", html:"No topical antibiotic on its own, no oral antibiotic on its own, and <b>never a topical and an oral antibiotic together</b>. An oral tetracycline goes with adapalene plus benzoyl peroxide, or with azelaic acid. Review at <b>12 weeks</b>: if clear, stop the oral antibiotic and continue the topical; if improved but not clear, continue for up to a further 12 weeks. Courses beyond <b>6 months</b> are for exceptional circumstances only, reviewed every 3 months.", src:"NICE NG198 (2021, last updated 30 April 2026)"},
    {tone:"amber", h:"Retinoids and tetracyclines: think pregnancy", html:"In pregnancy or when planning pregnancy, avoid topical retinoids and oral tetracyclines (avoid oral tetracyclines in breastfeeding too). Discuss effective contraception or consider benzoyl peroxide or azelaic acid; benzoyl peroxide monotherapy is the NG198 alternative when the standard options are contraindicated. Check the individual product information. Isotretinoin runs under a formal Pregnancy Prevention Programme.", src:"NICE NG198 (2021, last updated 30 April 2026) · MHRA isotretinoin PPP"},
    {tone:"green", h:"Scarring and distress move the threshold", html:"Scarring, persistent pigmentary change, and significant psychological distress are each a reason to refer rather than to repeat another course. NG198 is explicit that distress can occur with mild acne too, so ask about mood whatever the lesion count.", src:"NICE NG198 (2021, last updated 30 April 2026)"}
  ],
  pathwaySub:"Five moves from first look to specialist. The first step is where harm happens.",
  pathway:[
    {title:"Screen for what should not wait", html:"Systemic upset with ulcerating acne (fulminans) · active scarring or post-inflammatory pigmentation · thoughts of self-harm or suicide · nodulocystic or conglobate acne · virilisation or rapid endocrine change · features that suggest it is not acne at all (rosacea, perioral dermatitis, folliculitis, drug-induced acne, hidradenitis suppurativa, acneiform eruption, or androgen excess/PCOS). Any of these changes the plan before routine treatment.", alert:true},
    {title:"Grade by lesion count and ask about impact", html:"Count inflammatory lesions, nodules and comedones to place the person in the NG198 band. Record scarring, pigmentation and sites (face, back, chest). Ask directly how acne affects mood, confidence, work or school — and whether they pick or squeeze."},
    {title:"Start one first-line option for 12 weeks", html:"Choose with the person from the five NG198 first-line regimens, taking account of severity, preference, pregnancy plans, skin irritation and cost. Add basic skin-care advice. Explain that it will take weeks to see change and that early irritation usually settles."},
    {title:"Review at 12 weeks and decide", html:"Clear → stop any oral antibiotic and consider maintenance. Improved but not clear → continue the oral antibiotic with the topical for up to a further 12 weeks. Not improved → check adherence, technique and irritation, then try a different first-line regimen (mild to moderate) or one containing an oral antibiotic (moderate to severe, if not yet used). Hormonal options are second line and depend on contraceptive need and contraindications."},
    {title:"Refer when NG198 criteria are met", html:"Two completed courses without response (mild to moderate), failure of a course containing an oral antibiotic (moderate to severe), scarring, persistent pigmentation, acne conglobata or nodulocystic acne, diagnostic uncertainty, or persistent psychological distress. Isotretinoin is initiated only by a consultant dermatologist-led team; the NG198 treatment band is not the same as isotretinoin eligibility."}
  ],
  sections:[

    {id:"flags", nav:"Red flags", title:"Red flags — act on these first", sub:"Most acne is chronic and treatable in primary care. These presentations are not.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Acne fulminans", html:"Abrupt, severe, often ulcerated or haemorrhagic inflammatory acne, typically in adolescent males, sometimes with fever, arthralgia, malaise or bone pain. It can follow the start of isotretinoin. Refer urgently the same day to the on-call hospital dermatology team for assessment within 24 hours — some people need admission. Treatment may need hospital management, systemic corticosteroids and specialist-directed therapy. Do not manage routinely in primary care, wait for a 12-week review, or prescribe isotretinoin as a primary-care response.", src:"NICE NG198 (2021, last updated 30 April 2026)"},
         {tone:"red", h:"Current risk of self-harm or suicide", html:"Acne — and isotretinoin — can be linked with low mood. If there is current suicidal ideation or a plan, follow your local crisis pathway the same day. On isotretinoin, new depression, marked mood change, suicidal thoughts or self-harm need urgent contact with the prescribing dermatology team; suicidal ideation or imminent risk needs same-day emergency mental health assessment. Decide on stopping urgently with the prescribing team, unless immediate safety requires withholding the medicine.", src:"NICE NG198 (2021, last updated 30 April 2026) · MHRA DSU October 2023"},
         {tone:"amber", h:"Scarring or persistent pigmentary change", html:"Acne that is leading to scarring, or leaving persistent pigmentation, is itself a referral criterion. Scars are permanent; repeating another topical course while they form is the classic avoidable harm.", src:"NICE NG198 (2021, last updated 30 April 2026)"},
         {tone:"amber", h:"Acne conglobata or nodulocystic acne", html:"Deep, interconnecting nodules and cysts, sinus tracts, or extensive truncal involvement. Consider referral to a consultant dermatologist-led team rather than working up the primary-care options first.", src:"NICE NG198 (2021, last updated 30 April 2026)"},
         {tone:"amber", h:"Significant psychological distress", html:"Consider dermatology referral for acne of any severity causing persistent psychological distress or a mental health disorder. Consider mental health referral where there is significant distress, current or previous suicidal ideation or self-harm, severe depression or anxiety, or body dysmorphic disorder.", src:"NICE NG198 (2021, last updated 30 April 2026)"},
         {tone:"blue", h:"Sudden acne with virilisation", html:"New acne in a woman with rapid-onset hirsutism, deepening voice, clitoromegaly or menstrual disturbance points to an androgen source (PCOS at one end, an androgen-secreting tumour at the other). Check the history for anabolic steroids and other drugs, and investigate before treating it as ordinary acne."}
       ]},
       {b:"why", html:"Acne scars form from deep inflammation in the dermis. Once the collagen is lost or laid down abnormally, no topical or oral acne treatment reverses it. That is why NG198 treats scarring as a reason to refer rather than a reason to keep going — the goal of stepping up quickly is to stop new scars, not to fix old ones."}
     ]},

    {id:"grade", nav:"Grade", title:"Grading: the lesion count decides the band", sub:"NG198 swapped vague adjectives for numbers. Use them.",
     blocks:[
       {b:"table", head:["Band","Lesion count (any one is enough)","What it opens"], rows:[
         ["<b>Mild to moderate</b>","Any number of non-inflammatory lesions (comedones) · up to 34 inflammatory lesions (papules, pustules), with or without comedones · up to 2 nodules","Adapalene with benzoyl peroxide · tretinoin with clindamycin · benzoyl peroxide with clindamycin"],
         ["<b>Moderate to severe</b>","35 or more inflammatory lesions, with or without comedones · 3 or more nodules","Adapalene with benzoyl peroxide · tretinoin with clindamycin · <b>adapalene with benzoyl peroxide plus oral lymecycline or doxycycline</b> · <b>azelaic acid plus oral lymecycline or doxycycline</b>"]
       ]},
       {b:"p", html:"The NG198 treatment band is not synonymous with eligibility for isotretinoin. Isotretinoin is specialist initiated for severe, treatment-resistant acne, particularly where there is nodulocystic or conglobate disease or a risk of permanent scarring."},
       {b:"dl", rows:[
         ["<b>Nodules</b>","Firm, often painful lesions sitting under or within the skin and lasting weeks to months. Cysts are similar but fluctuant and pus-filled; both carry the highest scarring risk."],
         ["<b>Scarring</b>","Look for ice-pick, rolling and boxcar scars on the face, and hypertrophic or keloid scars on the chest, back and jawline. Record them — they change the plan."],
         ["<b>Pigmentation</b>","Post-inflammatory hyperpigmentation is common in darker skin and can outlast the acne by months. Persistent pigmentary change is an NG198 referral criterion."],
         ["<b>Impact</b>","Ask about mood, confidence, social withdrawal, bullying, work or school. NG198 highlights that distress does not track the lesion count."]
       ]},
       {b:"table", head:["Look-alike","Clue","What to do"], rows:[
         ["<b>Rosacea</b>","Older adult, central facial flushing, telangiectasia, papules and pustules but <b>no comedones</b>","Different treatment pathway; avoid topical steroids"],
         ["<b>Perioral dermatitis</b>","Small papules around mouth, nose or eyes, often after topical steroid use","Stop the steroid; treat as perioral dermatitis"],
         ["<b>Folliculitis</b>","Monomorphic pustules centred on hair follicles, often trunk or beard area; itchy if pityrosporum","Consider bacterial or yeast cause"],
         ["<b>Drug-induced acne</b>","Monomorphic papules after starting corticosteroids, anabolic steroids, lithium, some anticonvulsants or progestogen-only contraception","Review the drug where possible"],
         ["<b>Hidradenitis suppurativa</b>","Recurrent painful nodules and sinus tracts in axillae, groin, under breasts","Separate condition; refer if moderate to severe"]
       ]}
     ]},

    {id:"skincare", nav:"Skin care", title:"Skin care and what to tell people", sub:"Advice every person gets alongside any prescription.",
     blocks:[
       {b:"tiles", v:"life", items:[
         {t:"🧼 Cleanse gently", html:"A non-alkaline (pH-neutral or slightly acidic) synthetic detergent cleanser twice daily on acne-prone skin; soap bars are more irritant and leave a residue."},
         {t:"🚫 Hands off", html:"Persistent picking or scratching increases the risk of scarring."},
         {t:"🧴 Non-comedogenic", html:"Avoid oil-based and comedogenic skin products and make-up; take make-up off at the end of the day."},
         {t:"🍽️ Diet", html:"There is not enough evidence to recommend any particular diet for acne. Healthy eating is fine; blaming chocolate is not."},
         {t:"☀️ Sun", html:"Retinoids and benzoyl peroxide make skin more sun-sensitive, and doxycycline causes photosensitivity. Use a non-comedogenic sunscreen."},
         {t:"⏳ Time", html:"Most treatments take 6–8 weeks to show benefit. Early dryness or irritation usually settles; reduce frequency rather than stop."}
       ]},
       {b:"p", html:"The cleansing, picking and diet points above come from the NG198 skin-care recommendations. The sun-protection and irritation advice is standard product guidance from the individual SPCs."},
       {b:"say", html:"These creams work slowly — most people see a difference at around two months and the full effect at three. If it stings or dries your skin at first, use it every other night for a week rather than giving up."}
     ]},

    {id:"firstline", nav:"First line", title:"First-line options: five regimens, prescribed for 12 weeks", sub:"NG198 Table 1, in practical form. Choose one; do not stack them.",
     blocks:[
       {b:"table", head:["Option","Severity","Practical points"], rows:[
         ["<b>Adapalene with benzoyl peroxide</b> (fixed combination gel, e.g. Epiduo 0.1%/2.5%; a 0.3%/2.5% strength also exists and is not interchangeable)","Any","Once daily in the evening to the whole affected area, not individual lesions (SPC). Avoid eyes, lips and mucosal surfaces. May cause irritation and photosensitivity. Retinoid: avoid in pregnancy. Benzoyl peroxide bleaches hair and fabric. Licensed age restrictions differ from NG198 recommendations — check the SPC."],
         ["<b>Tretinoin with clindamycin</b> (fixed combination gel, e.g. Treclin 1%/0.025%)","Any","Once daily at bedtime (SPC). Contains a topical antibiotic: do not use with an oral antibiotic. Avoid in pregnancy and breastfeeding. Diarrhoea or colitis during treatment → consider antibiotic-associated colitis. Follow product-specific duration and storage requirements."],
         ["<b>Benzoyl peroxide with clindamycin</b> (fixed combination gel, e.g. Duac Once Daily 1%/3%; other Duac strengths and products exist and should not be conflated)","Mild to moderate","Once daily in the evening (SPC). Topical antibiotic exposure: do not add an oral antibiotic, and avoid unnecessary long-term or repeated use. Monitor for severe diarrhoea or colitis. Bleaches hair and fabric. Use with caution in pregnancy and breastfeeding. Stability after opening is product-specific — follow the storage instructions."],
         ["<b>Adapalene with benzoyl peroxide plus oral lymecycline or doxycycline</b>","Moderate to severe","The topical stays when the antibiotic stops. Avoid tetracyclines in pregnancy, breastfeeding and under 12s (check the product information). Never with isotretinoin (intracranial hypertension)."],
         ["<b>Azelaic acid 20% plus oral lymecycline or doxycycline</b>","Moderate to severe","Azelaic acid 20% cream twice daily to clean, dry skin (SPC). Once daily for the first week in sensitive skin is an irritation-management strategy, not the standard SPC regimen. Burning, stinging, itch and erythema are common at first; avoid eyes and mucous membranes; use caution with significant irritation. Useful when retinoids irritate."]
       ]},
       {b:"cards", items:[
         {tone:"cream", h:"Oral tetracycline doses", html:"<b>Lymecycline 408 mg once daily</b> or <b>doxycycline 100 mg once daily</b> (NG198 doses; check the current BNF and local formulary before prescribing). Both only in combination with adapalene plus benzoyl peroxide, or with azelaic acid. <b>Never prescribe a tetracycline with isotretinoin</b> (risk of intracranial hypertension).", src:"NICE NG198 (2021, last updated 30 April 2026) · BNF"},
         {tone:"cream", h:"When tetracyclines are unsuitable", html:"If the person cannot tolerate or has a contraindication to lymecycline or doxycycline, NG198 allows them to be replaced by <b>trimethoprim</b> or an <b>oral macrolide such as erythromycin</b> within the same combination. Dose per BNF.", src:"NICE NG198 (2021, last updated 30 April 2026) · BNF"},
         {tone:"amber", h:"Antibiotic combinations to avoid", html:"Do not use topical antibiotic monotherapy, oral antibiotic monotherapy, or a topical antibiotic combined with an oral antibiotic, and avoid routine long-term antibiotic repeats. Each drives resistance without adding benefit.", src:"NICE NG198 (2021, last updated 30 April 2026)"},
         {tone:"amber", h:"Pregnancy, planning pregnancy and breastfeeding", html:"In pregnancy or when planning pregnancy: avoid topical retinoids and oral tetracyclines. Consider benzoyl peroxide or azelaic acid; <b>benzoyl peroxide monotherapy</b> is the NG198 alternative when the standard options are contraindicated. Benzoyl peroxide with clindamycin may be used with caution; do not use tretinoin with clindamycin. Check the individual product information, particularly during breastfeeding.", src:"NICE NG198 (2021, last updated 30 April 2026)"},
         
         {tone:"green", h:"Why combinations beat single agents", html:"Retinoids clear the blocked follicle, benzoyl peroxide kills <i>C. acnes</i> without selecting resistance, and clindamycin or a tetracycline reduces inflammation. NG198 therefore recommends combinations with different actions rather than single agents.", src:"NICE NG198 (2021, last updated 30 April 2026) — rationale"},
         {tone:"blue", h:"Bolton / Greater Manchester prescribing note", html:"Mild acne should generally be managed with non-antibiotic topical treatment and self-care advice: the Greater Manchester antimicrobial guidance states antibiotics have no benefit in mild acne and should not be prescribed for it. Lymecycline 408 mg once daily or doxycycline 100 mg once daily are the usual oral options for moderate to severe acne; <b>minocycline should not normally be used</b>. Follow the current Greater Manchester formulary and antimicrobial guidance for formulary status, OTC restrictions, preferred antibiotic and referral arrangements.", src:"Greater Manchester Antimicrobial Guidelines · GMMMG Formulary (Skin)"}
       ]}
     ]},

    {id:"ladder", nav:"Stepping up", title:"When the first course is not enough", sub:"A ladder that respects the 12-week rule.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1", when:"first 12 weeks", title:"One NG198 first-line option", tone:"cream",
          html:"Chosen by severity and preference. Review at 12 weeks. Before judging failure, check it was used every day, on all affected skin, with irritation managed rather than the treatment stopped."},
         {step:"2", when:"next 12 weeks", title:"A different first-line option", tone:"cream", fromLabel:"not improved after 12 weeks",
          html:"Mild to moderate acne that has not improved → try a different first-line option. Moderate to severe acne not improved on a regimen without an oral antibiotic → consider one that includes lymecycline or doxycycline (or the NG198 alternatives). Moderate to severe acne despite an adequate regimen containing an oral antibiotic → refer."},
         {step:"2 · women", when:"added to topical", title:"Hormonal options (second line)", tone:"cream", fromLabel:"hormonal option",
          html:"The combined oral contraceptive is not a universal acne add-on: base it on contraceptive need, contraindications, preference and the clinical context. In PCOS, treat acne with a first-line regimen and add co-cyprindiol or an alternative combined pill if that is ineffective (NG198); a standard combined pill (no brand preferred) can be started alongside from the outset when she also wants it for contraception, cycle control or hirsutism (International PCOS guideline 2023). Co-cyprindiol is not first line (MHRA 2013; International PCOS guideline 2023). Co-cyprindiol (cyproterone acetate with ethinylestradiol) is second line and not a routine contraceptive choice solely for acne; never prescribe it with another hormonal contraceptive; review at 6 months; avoid with current or previous meningioma; prescribe only after assessing VTE risk and combined hormonal contraceptive contraindications."},
         {step:"3", when:"after 2 completed courses", title:"Refer to a consultant dermatologist-led team", tone:"amber", fromLabel:"criteria met",
          html:"For isotretinoin, photodynamic therapy or other specialist options. Continue a topical option while waiting."}
       ]},
       {b:"warn", html:"<b>Antibiotic review.</b> Review at 12 weeks: if clear, stop the oral antibiotic and continue the topical; if improved but not clear, continue for up to a further 12 weeks. Oral antibiotics should continue beyond <b>6 months</b> only in exceptional circumstances, with review every 3 months and the aim of stopping as soon as possible. Write the stop date in the notes when you start it."},
       {b:"cards", items:[
         {tone:"cream", h:"Spironolactone (specialist or local pathway)", html:"Off-label for acne and <b>not an NG198 first-line treatment</b>; use only under a local dermatology or formulary pathway. The UK SAFA trial in women with persistent acne used 50 mg daily rising to 100 mg after 6 weeks and found improved acne-specific quality of life versus placebo — a trial regimen, not a national prescribing recommendation. Contraindicated in pregnancy: address contraception and pregnancy planning. Check local requirements for renal function, potassium and monitoring.", src:"Santer et al., BMJ 2023 (SAFA trial) · BAD patient information leaflet"},
         {tone:"blue", h:"Co-cyprindiol: VTE and meningioma", html:"Co-cyprindiol has a rare but higher VTE risk than levonorgestrel-containing combined pills; assess individual VTE risk and counsel about VTE symptoms. It takes at least 3 months to relieve symptoms and the need to continue should be evaluated periodically. Using it alongside another hormonal contraceptive is contraindicated. Do not use cyproterone-containing products with current or previous meningioma.", src:"MHRA Drug Safety Update June 2013 · MHRA DSU cyproterone acetate and meningioma"}
       ]}
     ]},

    {id:"maintenance", nav:"Maintenance", title:"Keeping it clear: maintenance and relapse", sub:"Clearance is not the end of treatment.",
     blocks:[
       {b:"dl", rows:[
         ["<b>Maintenance first choice</b>","Maintenance is not always required; consider it for frequent relapse. First choice: the fixed combination of topical adapalene with benzoyl peroxide."],
         ["<b>If not tolerated or contraindicated</b>","Topical adapalene alone, topical azelaic acid alone, or topical benzoyl peroxide alone."],
         ["<b>Review</b>","Review maintenance treatment after 12 weeks to decide whether it should continue."],
         ["<b>Relapse after a good response</b>","Consider another 12-week course of the same first-line treatment, or a different one."],
         ["<b>Relapse after isotretinoin</b>","Mild to moderate relapse → a new 12-week first-line course. Moderate to severe relapse → either a first-line course or re-referral to the dermatology team."],
         ["<b>Antibiotics</b>","Oral antibiotics are not a maintenance treatment. Stop them and keep the topical."]
       ]},
       {b:"timeline", items:[
         {n:"1", when:"Week 0", title:"Start", html:"Grade, choose one option, give skin-care advice, discuss pregnancy and contraception, note any antibiotic stop date."},
         {n:"2", when:"Week 12", title:"Judge the course", html:"Clear → stop any oral antibiotic and consider maintenance. Improved but not clear → continue the oral antibiotic for up to a further 12 weeks. Not better → check adherence and irritation, then a different option, a hormonal option where appropriate, or an antibiotic combination for moderate to severe acne."},
         {n:"3", when:"By month 6", title:"Stop the antibiotic", html:"Only exceptional cases continue beyond 6 months, with 3-monthly review."},
         {n:"4", when:"Maintenance plus 12 weeks", title:"Review maintenance", html:"Continue, stop, or refer if relapsing despite maintenance."}
       ]}
     ]},

    {id:"isotretinoin", nav:"Isotretinoin", title:"Isotretinoin: what the GP needs to know", sub:"Specialist-initiated, but the patient still sees you.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"Who initiates it", html:"NG198 says people who may need isotretinoin should be referred to a consultant dermatologist-led team, in line with MHRA safety advice. The GP does not start it. The NG198 treatment band is not synonymous with eligibility: isotretinoin is for severe, treatment-resistant acne, particularly nodulocystic or conglobate disease or a risk of permanent scarring.", src:"NICE NG198 (2021, last updated 30 April 2026)"},
         {tone:"amber", h:"Acknowledgement of Risk form: all patients", html:"Isotretinoin is initiated and monitored by a consultant dermatologist-led service. From <b>22 January 2026</b>, a second prescriber’s sign-off is <b>no longer required</b> for patients under 18 years. The updated MHRA <b>Acknowledgement of Risk Form</b> and other current risk-minimisation materials apply to <b>all patients</b>. Patients should view the MHRA information video before starting, and mental health and sexual function should be assessed before treatment and monitored during treatment. Dermatology services are subject to audit of risk-minimisation measures.", src:"MHRA Drug Safety Update (isotretinoin; changes from 22 January 2026)"},
         {tone:"amber", h:"Mental health and sexual function", html:"Patients must be counselled about possible psychiatric and sexual side effects, assessed for both before starting, and monitored for both during treatment. Reported sexual effects include erectile dysfunction, reduced libido, vulvovaginal dryness and orgasm difficulties.", src:"MHRA Drug Safety Update October 2023"},
         {tone:"red", h:"Pregnancy Prevention Programme", html:"Isotretinoin is highly teratogenic. People who can become pregnant need contraception from 4 weeks before, throughout, and for 1 month after treatment, Prescribing, pregnancy testing and prescription duration must follow the current MHRA Pregnancy Prevention Programme materials and the local dermatology protocol — do not assume every prescription is limited to 30 days. Pregnancy during or within 1 month of stopping should be reported to the MHRA.", src:"MHRA isotretinoin Pregnancy Prevention Programme materials"},
         {tone:"blue", h:"What the GP picks up", html:"New low mood, anxiety or suicidal thoughts; sexual dysfunction; a possible pregnancy; severe dry lips and skin; headache with visual disturbance. New depression, marked mood change, suicidal thoughts or self-harm → urgent contact with the prescribing team; suicidal ideation or imminent risk → same-day emergency mental health assessment. Decide on stopping urgently with the prescribing team, unless immediate safety requires withholding it. Headache with visual disturbance may suggest intracranial hypertension, particularly with tetracycline exposure."},
         {tone:"cream", h:"Record it", html:"Isotretinoin is hospital-prescribed, so it may not appear on the GP repeat list. Add it to the record as a specialist medicine so interacting prescriptions (tetracyclines, vitamin A) are caught."},
         {tone:"red", h:"Never with tetracyclines or vitamin A", html:"Do not prescribe tetracyclines concurrently with isotretinoin because of the risk of intracranial hypertension. Avoid vitamin A supplements and vitamin-A-containing medicines.", src:"MHRA isotretinoin risk-minimisation materials · SPC"}
       ]}
     ]},

    {id:"monitoring", nav:"Troubleshoot", title:"Not working? Check before escalating", sub:"Most treatment failure is a technique problem.",
     blocks:[
       {b:"table", head:["Check","Question","Fix"], rows:[
         ["<b>Duration</b>","Was the course a genuine 12 weeks?","Re-start the clock; set a review date."],
         ["<b>Adherence</b>","Used daily on all affected skin, not just on spots?","Demonstrate a pea-sized amount spread over the whole area."],
         ["<b>Irritation</b>","Stopped because of dryness or stinging?","Alternate nights, add a non-comedogenic moisturiser, or switch to azelaic acid."],
         ["<b>Antibiotic pairing</b>","Is an antibiotic being used without benzoyl peroxide, retinoid or azelaic acid?","Correct the combination; do not combine topical and oral antibiotics."],
         ["<b>Aggravators</b>","Occlusive cosmetics, anabolic steroids, drug triggers, PCOS features?","Address the cause; consider a hormonal option in women."],
         ["<b>Diagnosis</b>","Is it really acne?","Reconsider rosacea, perioral dermatitis, folliculitis."]
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral: same day to routine", sub:"Referral routes from NG198.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same day · on-call dermatology", html:"<b>Acne fulminans</b> → urgent referral the same day to the on-call hospital dermatology team, for assessment within 24 hours.", src:"NICE NG198 (2021, last updated 30 April 2026)"},
         {tone:"red", h:"Same day · crisis mental health", html:"Current suicidal intent or a plan → same-day assessment through the local urgent mental health/crisis pathway.", src:"NICE NG198 (2021, last updated 30 April 2026)"},
         {tone:"amber", h:"Consultant dermatologist-led team (or accredited GPwER)", html:"Consider referral for: mild to moderate acne not responding to <b>2 completed courses</b> of treatment · moderate to severe acne not responding to previous treatment that <b>contained an oral antibiotic</b> · acne with <b>scarring</b> · acne with <b>persistent pigmentary changes</b> · <b>acne conglobata</b> or nodulocystic acne · <b>diagnostic uncertainty</b> · acne of any severity causing or contributing to <b>persistent psychological distress</b> or a mental health disorder.", src:"NICE NG198 (2021, last updated 30 April 2026)"},
         {tone:"amber", h:"Mental health services", html:"Consider referral for significant psychological distress or a mental health disorder — including a history of suicidal ideation or self-harm, severe depressive or anxiety disorder, or body dysmorphic disorder.", src:"NICE NG198 (2021, last updated 30 April 2026)"},
         {tone:"blue", h:"Endocrine assessment", html:"Acne with rapidly progressive virilisation, or a picture suggesting PCOS that needs confirming, is investigated and referred on the endocrine pathway rather than the acne one."},
         {tone:"cream", h:"Referring a possible isotretinoin candidate — document", html:"<ul><li>Number and type of previous adequate treatment courses, with duration and adherence</li><li>Whether treatment included an oral antibiotic plus appropriate topical therapy</li><li>Scarring or persistent pigmentation</li><li>Psychological impact; current and past mental health history</li><li>Sexual function concerns</li><li>Pregnancy potential and current contraception</li><li>Current medicines, especially tetracyclines and vitamin A</li><li>Relevant laboratory results if available</li><li>Your local dermatology referral pathway</li></ul>"}
       ]},
       {b:"say", html:"We’ve given two treatments a proper try and it’s still leaving marks, so I’d like the skin specialists to see you. They can offer stronger options, including a tablet called isotretinoin that we can’t start here. Keep using the gel while you wait — it stops things getting worse."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only — the Casebook keeps the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 17-year-old has had facial and back acne for two years. She used a gel ‘for a few weeks’, then lymecycline on its own for nine months from an online service. She now has early rolling scars on her cheeks, is avoiding college photographs, and asks for ‘the strong tablet’ her friend had.", src:"Scenario built on NICE NG198 (2021, last updated 30 April 2026)"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Counts lesions and names the severity band; spots the <b>antibiotic monotherapy</b>, the missing 12-week review and the 6-month limit; recognises that <b>scarring is a referral criterion</b> now; <b>asks about mood and self-harm</b>; explains that isotretinoin is started by dermatology and, completes the updated MHRA Acknowledgement of Risk form with the dermatologist (required for all patients; the under-18 second-prescriber rule was removed from 22 January 2026); bridges with adapalene plus benzoyl peroxide; discusses contraception; and safety-nets on mood and fulminans. <a href='../../cases/acne.html'>Open the full casebook chapter →</a>", src:"MHRA Drug Safety Updates October 2023 and January 2026 · NICE NG198"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Every figure on this page traces to one of these primary sources.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG198 — Acne vulgaris: management (June 2021, last updated 30 April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng198" rel="noopener">nice.org.uk/guidance/ng198</a><span class="rd"> — severity bands by lesion count; skin-care advice; the five first-line regimens and 12-week courses; lymecycline 408 mg and doxycycline 100 mg once daily; 12-week antibiotic review; antibiotic combinations to avoid; the 6-month antibiotic limit with 3-monthly review; trimethoprim or macrolide substitution; pregnancy contraindications and benzoyl peroxide alternative; combined oral contraceptive and co-cyprindiol (6-month review); maintenance and relapse; photodynamic therapy; referral criteria including diagnostic uncertainty, persistent psychological distress and same-day referral for acne fulminans; mental health referral</span></li>'+
         '<li><b>MHRA Drug Safety Update, October 2023 — Isotretinoin: introduction of new safety measures</b><br><a href="https://www.gov.uk/drug-safety-update/isotretinoin-roaccutanev-introduction-of-new-safety-measures-including-additional-oversight-of-the-initiation-of-treatment-for-patients-under-18-years-of-age" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> — October 2023 measures (two independent prescribers for under 18s — requirement removed by the MHRA from 22 January 2026; updated Acknowledgement of Risk form for all patients); assessment and monitoring of mental health and sexual function</span></li>'+
         '<li><b>MHRA Drug Safety Update — Isotretinoin: updates to prescribing guidance and survey of services (October 2025)</b><br><a href="https://www.gov.uk/drug-safety-update/isotretinoin-updates-to-prescribing-guidance-and-survey-of-services" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> — contraception 4 weeks before, during and 1 month after; prescription duration per PPP and specialist service process; reporting of pregnancies</span></li>'+
         '<li><b>MHRA Drug Safety Update — Isotretinoin: changes to prescribing guidance (effective 22 January 2026)</b><br><a href="https://www.gov.uk/drug-safety-update" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> — second prescriber no longer required for under 18s; updated Acknowledgement of Risk Form for all patients; MHRA patient information video; mental health and sexual function assessment and monitoring; audit of risk-minimisation measures</span></li>'+
         '<li><b>MHRA — Oral retinoid medicines: Pregnancy Prevention Programme materials (current)</b><br><a href="https://www.gov.uk/drug-safety-update" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> — contraception, pregnancy testing and prescribing and dispensing requirements by PPP category</span></li>'+
         '<li><b>MHRA Drug Safety Update, June 2013 — Co-cyprindiol: balance of benefits and risks remains positive</b><br><a href="https://www.gov.uk/drug-safety-update/cyproterone-acetate-with-ethinylestradiol-co-cyprindiol-balance-of-benefits-and-risks-remains-positive" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> — higher VTE risk than levonorgestrel pills; at least 3 months to relieve symptoms; periodic review; contraindicated with other hormonal contraception</span></li>'+
         '<li><b>MHRA Drug Safety Update — Cyproterone acetate: new advice to minimise risk of meningioma</b><br><a href="https://www.gov.uk/drug-safety-update/cyproterone-acetate-new-advice-to-minimise-risk-of-meningioma" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> — do not use with current or previous meningioma</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — check current doses of lymecycline, doxycycline and alternative oral antibiotics before prescribing</span></li>'+
         '<li><b>SPC — Epiduo 0.1%/2.5% gel (PL 10590/0057)</b><br><a href="https://products.mhra.gov.uk/search/?search=epiduo" rel="noopener">products.mhra.gov.uk</a><span class="rd"> — evening application to the whole affected area; irritation, photosensitivity, bleaching; pregnancy; licensed age. Epiduo 0.3%/2.5% gel has a separate SPC</span></li>'+
         '<li><b>SPC — Treclin 1%/0.025% gel (PL 46302/0192)</b><br><a href="https://products.mhra.gov.uk/search/?search=treclin" rel="noopener">products.mhra.gov.uk</a><span class="rd"> — once daily at bedtime; no oral antibiotic; colitis; pregnancy and breastfeeding; storage</span></li>'+
         '<li><b>SPC — Duac Once Daily 10 mg/g + 30 mg/g gel (PL 19494/0251)</b><br><a href="https://products.mhra.gov.uk/search/?search=duac" rel="noopener">products.mhra.gov.uk</a><span class="rd"> — once daily in the evening; colitis; bleaching; storage after opening</span></li>'+
         '<li><b>SPC — Skinoren 20% cream (PL 00043/0236)</b><br><a href="https://products.mhra.gov.uk/search/?search=skinoren" rel="noopener">products.mhra.gov.uk</a><span class="rd"> — twice daily to clean, dry skin; local irritation; avoid eyes and mucous membranes</span></li>'+
         '<li><b>Santer M et al. Effectiveness of spironolactone for women with acne vulgaris (SAFA). BMJ 2023</b><span class="rd"> — spironolactone 50 mg rising to 100 mg daily versus placebo in 410 women</span></li>'+
         '<li><b>British Association of Dermatologists — patient information leaflets: acne; spironolactone</b><br><a href="https://www.bad.org.uk/pils/spironolactone" rel="noopener">bad.org.uk/pils</a><span class="rd"> — off-licence use of spironolactone in women with acne</span></li>'+
