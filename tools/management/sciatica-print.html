MG.render({

  stemTitle:"Sciatica is the one pain presentation where the guideline's central recommendations are negative — no gabapentinoids, other antiepileptics, benzodiazepines or oral steroids, and no opioids for chronic sciatica — and most GPs remember the opposite",
  stemSub:"For the diagnostic route — distinguishing radicular pain from referred pain, stenosis and the mimics — use the <a href='../algorithms/back-pain.html'>back pain pathway</a>. This page is the management: the cauda equina safety-net in words a patient will act on, the NG59 do-not-offer list and what to use instead, staying active rather than resting, physiotherapy and the exercise programme, when imaging and a surgical opinion are actually justified, epidural injection, the fit note and the return to work, and a realistic prognosis that makes conservative management acceptable to someone in severe pain.",
  guideline:"NICE NG59 (2016, updated 2020) · NICE NG215 (2022) · NICE NG193 (2021) · NICE CG173 (2013, updated 2020) · NICE NG234 (2023) · NICE NG12 (updated April 2026)",
  reviewed:"12 September 2026",
  nextReview:"12 March 2027",
  meta:[
    {t:"NICE NG59 — low back pain and sciatica in over 16s"},
    {t:"NICE NG59 — sciatica (lumbar radiculopathy)"},

  ],
  lead:'<div class="mg-layers"><a href="#safety"><b>Cauda equina</b><small>The safety-net script</small></a><a href="#donot"><b>Do NOT offer</b><small>The NG59 list</small></a><a href="#treat"><b>Treat</b><small>What to use instead</small></a><a href="#active"><b>Stay active</b><small>Physio · exercise</small></a><a href="#refer"><b>Refer</b><small>Imaging · surgery</small></a></div>',
  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Cauda equina — say it, and give it in writing", html:"New urinary retention or altered urinary sensation, saddle/perineal anaesthesia, faecal incontinence or loss of anal tone, bilateral severe radicular symptoms, or progressive bilateral weakness requires immediate emergency referral through the local suspected cauda equina pathway (usually via ED or spinal services; urgent MRI is arranged by the receiving team). Do not arrange a routine outpatient scan or wait for a planned review. Ask specifically about sensation when wiping, perineal/genital sensation, whether they can feel the bladder filling, urinary hesitancy or retention, loss of urinary control, bowel control and sexual sensory change. Say the words out loud to every patient with sciatica, at every consultation — the deficit can be painless and develop quickly. Give clear verbal and written safety-netting and document the information provided and the patient's understanding."},
    {tone:"red", h:"⛔ NG59: do NOT offer gabapentinoids for sciatica", html:"NICE NG59 explicitly recommends AGAINST gabapentin, pregabalin, other antiepileptics, oral corticosteroids and benzodiazepines for managing sciatica — the 2020 evidence review found no overall benefit and evidence of harm. This is a NICE recommendation against offering them, not a formal pharmacological contraindication — and it is commonly inverted, because pregabalin for sciatica feels like textbook neuropathic prescribing. <b>Do not offer opioids for chronic sciatica either.</b>"},
    {tone:"blue", h:"What to offer instead", html:"An oral NSAID at the lowest effective dose for the shortest possible time, after assessing GI, renal, hepatic and cardiovascular risk and considering gastroprotection. Do not offer paracetamol alone. For acute sciatica the opioid evidence is insufficient: if severe acute pain and an NSAID is contraindicated, not tolerated or ineffective, consider a weak opioid per local guidance — smallest practical quantity, documented stop/review date, not for chronic sciatica. Alongside this: staying active, and a group exercise and physiotherapy programme."},
    {tone:"green", h:"A realistic prognosis makes conservative care bearable", html:"Most acute sciatica improves over time with conservative management, although improvement may be gradual and pain can remain severe for several weeks; some numbness may linger. Explain that persistent symptoms do not automatically mean that surgery is required, and that severe pain does not necessarily mean progressive nerve damage. <b>Say this explicitly and early</b> — a patient in severe radicular pain who has not been given a timeframe reasonably assumes nothing is being done. Pair it with honest acknowledgement that the pain is often severe, and with a specific review date rather than \"come back if it doesn't settle\"."},
    {tone:"amber", h:"Imaging does not help unless the plan is an intervention", host:"", html:"Do not request routine lumbar imaging for uncomplicated sciatica in primary care. In a specialist setting, image only when the result is likely to change management — i.e. when a spinal surgical or pain-intervention opinion is being sought — and the findings should correlate with the clinical syndrome. Incidental degenerative change is common and may not explain the symptoms. <b>Arrange emergency or urgent imaging through the appropriate pathway when cauda equina, MSCC, infection, fracture, malignancy or significant neurological deterioration is suspected.</b>"},
    {tone:"purple", h:"🟣 NICE NG12 — the cancers that present as back pain", html:"Aged 60 and over with persistent bone pain, particularly back pain, or an unexplained fracture → FBC, calcium, ESR or plasma viscosity, serum protein electrophoresis and serum free light chains, all together for myeloma (urine Bence-Jones if free light chain testing is not available); suspected cancer pathway referral if the results suggest myeloma. Pancreatic cancer: consider urgent direct-access CT (or ultrasound if CT is unavailable) in people aged 60 and over with unexplained weight loss plus back pain, abdominal symptoms, bowel change or new-onset diabetes. Bone sarcoma in adults: refer via the suspected cancer pathway if an X-ray suggests possible bone sarcoma (the 48-hour direct-access X-ray applies to children and young people). Restated in <a href='#refer'>Refer</a>."}
  ],
  pathwaySub:"Five steps. The first is a safety act that is repeated at every single contact.",
  pathway:[
    {title:"Screen for cauda equina and the serious causes — every time", html:"Bilateral symptoms, saddle anaesthesia, bladder or bowel dysfunction, progressive motor deficit, and the malignancy, infection and fracture flags. <b>Then give the safety-net verbally and in writing, and document it.</b>", alert:true},
    {title:"Confirm it is radicular, and grade the deficit", html:"Leg-dominant pain in a plausible nerve-root distribution, with or without sensory, reflex or motor change (a positive straight-leg raise supports but is not essential); document power, reflexes, sensation, gait (including heel and toe walking) and functional impact so the next clinician can tell progression from a stable deficit. <b>A significant or progressive motor deficit changes the pathway.</b>"},
    {title:"Treat the pain within the NG59 limits", html:"NSAID after individual risk assessment, considering gastroprotection, shortest course. No gabapentinoids, no benzodiazepines, no oral steroids. For acute pain only, and only if an NSAID is contraindicated, not tolerated or ineffective: a weak opioid per local guidance, smallest practical quantity, with a stop/review date. Say what you are NOT prescribing and why — otherwise it reads as a refusal."},
    {title:"Keep them active and get physiotherapy started", html:"Explicit advice against bed rest; a group exercise programme; manual therapy only as part of a package including exercise; support return to work. NICE NG59 psychological therapy and combined physical and psychological programme recommendations were withdrawn in July 2026 (partly based on retracted evidence) — address low mood or distress in its own right (e.g. NHS Talking Therapies), and use NG193 if features of chronic primary pain."},
    {title:"Review, and escalate on the right triggers", html:"Review at 2–4 weeks (a local interval). If pain or function remains substantially limited despite an appropriate trial of conservative care, reassess the diagnosis and red flags, then refer for specialist spinal/MSK assessment (NG59: decompression considered when non-surgical treatment has not improved pain or function and imaging is consistent) — no fixed week threshold. New, severe or progressive motor deficit → urgent."}
  ],
  sections:[

    {id:"safety", nav:"Cauda equina", title:"Red flags — and the safety-net script",
     sub:"The deficit is frequently painless. A patient who has not been told what to look for cannot report it.",
     blocks:[
       {b:"table", head:["Feature","Meaning","Action"], rows:[
         ["Saddle or perineal numbness · bilateral severe radicular symptoms or progressive bilateral weakness · new urinary retention, altered urinary sensation or incontinence · faecal incontinence or loss of anal tone · loss of sexual sensation","<b>Cauda equina syndrome.</b> Retention with overflow incontinence is often the presenting feature, and painless","Immediate emergency referral through the local suspected cauda equina pathway, usually via ED or spinal services, with urgent MRI arranged by the receiving team. Do not arrange a routine outpatient scan or wait for a planned review"],
         ["Progressive or severe motor weakness — foot drop, inability to stand on tiptoe or heel, weak knee extension","Significant nerve root compression; the deficit, not the pain, sets the urgency","Document power, reflexes and sensation at baseline. New, severe or progressive motor weakness — such as worsening foot drop, inability to heel- or toe-walk, or significant quadriceps weakness — requires urgent spinal/MSK assessment. A stable mild deficit may follow a different specialist or expedited outpatient pathway. Pain severity alone does not set the urgency"],
         ["Known cancer plus neurological symptoms or signs — limb weakness, gait disturbance, sensory loss or paraesthesia, bladder or bowel dysfunction, or radicular pain with other neurological features","<b>Metastatic spinal cord compression</b> — an oncological emergency","Contact the MSCC coordinator immediately and arrange emergency assessment; MRI as soon as possible and always within 24 hours (NG234). Dexamethasone 16 mg orally (or equivalent parenteral dose) as soon as possible, coordinated through the MSCC/acute oncology pathway"],
         ["Known cancer with pain suggestive of spinal metastases but no neurological signs — severe, progressive or unremitting, mechanical, worse on straining, nocturnal, local tenderness or claudication","<b>Spinal metastases</b>","Discuss with the MSCC coordinator within 24 hours; MRI should generally be arranged within 1 week (NG234)"],
         ["Fever, systemic upset, injecting drug use, immunosuppression or recent bacteraemia","<b>Spinal epidural abscess or discitis</b>","<b>Urgent MRI, FBC and CRP, blood cultures; emergency admission if septic</b>"],
         ["History of cancer · persistent, progressive or unremitting pain · pain aggravated by straining · focal vertebral tenderness · unexplained weight loss · systemic symptoms · myeloma features (age and night pain are context, not standalone urgent indications)","<b>Vertebral metastases, myeloma or primary bone tumour</b>","Use a risk-based assessment and the NG12 pathway below. Suspected spinal metastases without neurological signs: MSCC coordinator advice within 24 hours and MRI within 1 week where appropriate (NG234)"],
         ["Significant trauma, or minor trauma in osteoporosis or on long-term steroids","<b>Vertebral fragility fracture</b>","<b>X-ray; assess fracture risk and treat osteoporosis — see <a href='osteoporosis.html'>osteoporosis</a></b>"],
         ["Bilateral leg pain on walking, relieved by sitting or flexing forward, with preserved pedal pulses","Neurogenic claudication from lumbar spinal stenosis — a different condition with a different natural history","Not acute sciatica: manage conservatively, and refer for a decompression opinion if walking distance is significantly limited"],
         ["Unilateral leg pain with absent pulses, worse on exertion and relieved promptly by rest","<b>Vascular claudication</b>","Assess pulses and ankle-brachial index — the mimic most easily missed because the story sounds positional"]
       ]},
       {b:"say", html:"Before anything else, I need to tell you about one rare complication, and I want you to remember it rather than just take the leaflet. If you develop numbness around your back passage or between your legs — the area you sit on, or when you wipe — or if you cannot pass urine, or you lose control of your bladder or bowels, or the pain and weakness spread to both legs, you need to go to A&amp;E the same day. Not ring the surgery, not wait until morning. That combination can mean the nerves at the bottom of the spine are being squeezed, and it needs an urgent scan because waiting can cause permanent damage. It is uncommon, and I am not expecting it — but it can come on without much extra pain, so you would not necessarily know it was serious."},
       {b:"warn", html:"<b>Two things about that script matter.</b> <b>First, it must be spoken, backed up in writing, and documented</b> — record the information given and the patient's understanding. Second, ask the specific questions rather than \"any bladder problems?\": ask about sensation when wiping, perineal and genital sensation, whether they can feel the bladder filling, hesitancy or retention, loss of urinary or bowel control, and any sexual sensory change. A patient in retention with overflow may report \"a bit of leaking\" and think it unrelated to their back."},
       {b:"dl", rows:[
         ["<b>NG12 — the criteria that apply here</b>","Myeloma: aged 60 and over with persistent bone pain, particularly back pain, or an unexplained fracture → FBC, calcium, ESR or plasma viscosity, serum protein electrophoresis and serum free light chains, all together (urine Bence-Jones if free light chain testing is not available); suspected cancer pathway referral if the results suggest myeloma. This applies to persistent bone pain, not every acute back-pain presentation; suspected myeloma with acute kidney injury, hypercalcaemia, pathological fracture or cord compression needs urgent specialist assessment rather than routine referral. Pancreatic cancer: consider urgent direct-access CT (or ultrasound if CT is unavailable) in people aged 60 and over with unexplained weight loss plus back pain, abdominal symptoms, bowel change or new-onset diabetes. Bone sarcoma: adults with persistent unexplained focal bone pain or swelling need appropriate imaging via local suspected-cancer/MSK pathways, and suspected cancer pathway referral if the X-ray suggests bone sarcoma; the 48-hour direct-access X-ray applies to children and young people, not routinely to adults. Restated in <a href='#refer'>Refer</a>"]
       ]}
     ]},

    {id:"donot", nav:"Do NOT offer", title:"The NG59 do-not-offer list — and why it surprises people",
     sub:"The negative recommendations here are stronger and more specific than the positive ones.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"⛔ Gabapentinoids and other antiepileptics", html:"Do not offer gabapentin, pregabalin or other antiepileptics for sciatica — a NICE recommendation (not a formal contraindication) based on no overall benefit in sciatica and evidence of harm: sedation, dizziness, falls, cognitive impairment, dependence and misuse. Gabapentin and pregabalin are Class C controlled drugs, and the MHRA warns of misuse, dependence and potentially fatal CNS/respiratory depression, particularly with opioids or alcohol. If a patient is already on one for sciatica, assess the indication, dose, duration and dependence, discuss withdrawal problems and agree a gradual taper (NICE NG215)."},
         {tone:"red", h:"⛔ Benzodiazepines and oral corticosteroids", html:"Do not offer benzodiazepines for sciatica — including diazepam as a \"muscle relaxant\", which is common practice and not supported. <b>Do not offer oral corticosteroids.</b> Neither improves outcome, and both carry real harm: sedation, falls and dependence for one, and the full steroid burden for the other."},
         {tone:"red", h:"⛔ Opioids for chronic sciatica", html:"<b>Do not offer opioids for managing chronic sciatica.</b> If already taking one, discuss risks and withdrawal. In ACUTE sciatica evidence is insufficient; if considered (NSAID contraindicated, not tolerated or ineffective, severe pain), use a weak opioid per local guidance — smallest practical quantity, review and stop date, counselling on constipation, sedation, dependence and driving. See <a href='opioid-prescribing.html'>opioids in non-cancer pain</a>."},
         {tone:"amber", h:"⛔ Paracetamol alone, and the passive treatments", host:"", html:"<b>Do not offer paracetamol alone for low back pain.</b> Do not offer belts, corsets, foot orthotics, rocker-sole shoes, traction, or ultrasound, interferential therapy, PENS or TENS. <b>Do not offer acupuncture for low back pain with or without sciatica.</b> <b>Do not offer spinal injections for low back pain</b> (epidural for acute severe sciatica is a separate, permitted option — see below)."},
         {tone:"blue", h:"⛔ Do not routinely image", html:"Do not routinely offer imaging in a non-specialist setting; image only if the result would change management. Imaging outside the routine pathway is needed for suspected cauda equina, MSCC, infection, fracture, malignancy or significant or progressive neurological deficit. <b>Explain this rather than simply declining</b> — \"the scan would not change what we do, and it would show wear-and-tear that nearly everyone your age has\" is heard very differently from a refusal."},
         {tone:"green", h:"✓ Say what you are NOT prescribing, and why", html:"A patient who expected pregabalin and receives naproxen without explanation concludes they have been fobbed off. Name the guideline, give the reason (no benefit in sciatica, and real harms), and immediately offer what does work — the physiotherapy referral and the activity plan — so the consultation ends with a plan rather than a subtraction."}
       ]},
       {b:"why", html:"The reason this list is counter-intuitive is that sciatica is genuinely neuropathic pain, and neuropathic pain elsewhere is treated with exactly these drugs under CG173. The evidence simply does not transfer: trials in sciatica specifically have not shown benefit for gabapentinoids, while the harms are identical to those seen everywhere else. So CG173 governs diabetic neuropathy and post-herpetic neuralgia, and NG59 governs sciatica — and they give opposite advice about the same molecules. Knowing which guideline you are in is the whole of the prescribing decision here. Note also that persistent sciatica may be chronic secondary pain, chronic primary pain, or both: where the underlying condition adequately accounts for the pain, manage under NG59, and use NG193 chronic primary pain recommendations only where chronic primary pain coexists or better explains the pain — see <a href='chronic-pain.html'>chronic primary pain</a>."}
     ]},

    {id:"treat", nav:"Treat", title:"What to actually prescribe",
     blocks:[
       {b:"table", head:["Situation","Treatment","Notes"], rows:[
         ["<b>Acute sciatica, first line</b>","Oral NSAID — e.g. ibuprofen or naproxen (local formulary examples; doses per SPC) — at the lowest effective dose for the shortest possible time, considering gastroprotection","Before prescribing, assess renal function, heart failure, blood pressure, GI history, hepatic risk, age, pregnancy status, anticoagulants, antiplatelets, corticosteroids and other interacting medicines. Check the current BNF/SPC and local formulary for dose, contraindications, interactions and gastroprotection. NG59 asks you to consider gastroprotection whenever an oral NSAID is prescribed; the need is clinically assessed rather than automatic"],
         ["<b>NSAID contraindicated, not tolerated or ineffective</b>","If severe ACUTE pain: consider a weak opioid per local (GM) opioid guidance, smallest practical quantity","<b>Write the review/stop date at the point of prescribing</b> (no fixed NG59 duration). Review earlier if there is inadequate benefit, sedation, constipation, escalating use or concern about dependence. Consider a laxative, particularly if at risk of constipation; counsel on driving. <b>Not for chronic sciatica</b>"],
         ["<b>Severe acute radicular pain not controlled in primary care</b>","Consider referral for an epidural injection of local anaesthetic and steroid","NG59 permits this for ACUTE and SEVERE sciatica — it is the one injection option that is recommended rather than prohibited. Not for chronic sciatica and not for low back pain"],
         ["<b>An alternative neuropathic pain diagnosis is established</b>","Do not use the CG173 neuropathic-pain medication ladder for uncomplicated lumbar sciatica","Manage an established alternative diagnosis (e.g. peripheral neuropathy, post-herpetic neuralgia, trigeminal neuralgia) according to the relevant condition-specific guideline and local GMMMG pathway. See <a href='neuropathic-pain.html'>neuropathic pain</a>"],
         ["<b>Already taking a gabapentinoid, benzodiazepine or opioid for sciatica</b>","Review risks and benefits, discuss withdrawal problems, and agree a gradual, patient-centred taper (NICE NG215, GM opioid guidance)","<b>Do not stop abruptly</b> unless toxicity or a safety issue requires it. Use the current local withdrawal/deprescribing guidance for the drug and dose; review concurrent opioids, alcohol and other CNS depressants. Warn that symptoms may flare during withdrawal and adjust the pace. See <a href='chronic-pain.html'>chronic pain</a>"],
         ["<b>Osteoarthritis or spinal stenosis coexisting</b>","<b>Manage under its own guideline</b>","See <a href='osteoarthritis.html'>osteoarthritis</a>; stenosis is managed conservatively with a decompression opinion if walking distance is significantly limited"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"⚠ NSAID safety is the real prescribing risk here", html:"The patient with severe sciatica will take more than prescribed if the pain is bad. State the maximum dose explicitly, consider gastroprotection, and give a defined course length. Avoid or seek specialist/pharmacist advice in patients with major renal, cardiovascular or gastrointestinal risk, or when taking anticoagulants/antiplatelets; check the current BNF/SPC and local formulary — a PPI does not remove cardiovascular or renal risk."},
         {tone:"blue", h:"💊 Topical and adjunctive", html:"<b>Topical NSAIDs have little role in radicular pain</b> — the source is the nerve root, not a superficial structure. Heat or cold packs are harmless and some patients find them helpful; positioning advice is often more useful than either."},
         {tone:"green", h:"✓ Sleep and position", html:"Practical advice earns disproportionate goodwill: lying with the painful side up and a pillow between the knees, a rolled towel under the lumbar spine when sitting, getting out of bed by rolling to the side rather than sitting straight up. None of it is guideline material and all of it helps the first fortnight."},
         {tone:"red", h:"⛔ Do not advise bed rest", host:"", html:"<b>Avoid bed rest.</b> Prolonged inactivity may contribute to deconditioning and functional limitation; encourage activity within tolerable limits. Advise staying active and continuing normal activities as far as pain allows, explicitly and at the first consultation."}
       ]}
     ]},

    {id:"active", nav:"Stay active", title:"Activity, physiotherapy and the psychosocial half",
     blocks:[
       {b:"table", head:["Intervention","What to offer","Detail that matters"], rows:[
         ["<b>Self-management and activity</b>","Advice and information tailored to the person, encouraging continuation of normal activities; explicit advice against bed rest","Gentle movement and normal activity as tolerated generally support recovery; avoid prolonged bed rest, but don't force activity through severe or worsening neurological symptoms"],
         ["<b>Group exercise programme</b>","Offer a group exercise programme (biomechanical, aerobic, mind-body or a combination) within the NHS, taking preferences and ability into account","The core recommended non-drug treatment for low back pain and sciatica. Any modality; consistency and progression matter more than the type"],
         ["<b>Manual therapy</b>","Consider spinal manipulation, mobilisation or soft-tissue technique ONLY as part of a treatment package including exercise","<b>Not as a standalone treatment</b> — NG59 recommends it only within a package including exercise"],
         ["<b>Psychological and combined programmes</b>","<b>No longer an NG59 recommendation</b>: NICE withdrew the psychological therapy (cognitive behavioural approach) and combined physical and psychological programme recommendations in July 2026 because they were partly based on retracted evidence. Keep the plan built on exercise, self-management and staying active, with manual therapy only alongside exercise","Screen for fear-avoidance and catastrophising and address them within the exercise and self-management plan. Treat co-existing depression or anxiety in its own right (e.g. NHS Talking Therapies). Persistent sciatica may be chronic secondary pain, chronic primary pain, or both — use NG193 options where chronic primary pain coexists or better explains the pain"],
         ["<b>Return to work</b>","Encourage early return, with modified duties if needed; use the fit note to enable work rather than only to withdraw from it","Promote return to work and normal activities, using a fit note to support temporary adjustments or modified duties where appropriate (reduced lifting, altered hours, graded return). Discuss occupational-health input and signpost to Access to Work where relevant. Equality Act duties may apply where the legal definition of disability is met"],
         ["<b>Driving</b>","Advise not to drive while pain, weakness or sedating medication impairs control of the vehicle or emergency manoeuvres","General fitness-to-drive standards apply: check current DVLA guidance with a significant motor deficit (e.g. foot drop) or medication-related impairment; record the advice"],
         ["<b>What NOT to offer</b>","No belts, corsets, orthotics, rocker-soles, traction, ultrasound, interferential, PENS, TENS or acupuncture","<b>Several are actively sold to patients in severe pain</b> — saying explicitly that they do not work protects them from spending money on it"]
       ]},
       {b:"say", html:"I want to give you a realistic timeframe, because \"it should settle\" is not much use when you are in this much pain. Most sciatica improves over time without an operation, although improvement can be gradual and the pain can stay severe for several weeks. That does not mean the next few weeks will be comfortable, and if it is slow that does not automatically mean you need surgery. Keeping as active as the pain allows, and the physiotherapy I am referring you for, help you manage the pain and keep you moving; long periods in bed tend to leave people stiffer and weaker. I will see you in two to three weeks to check we are on the right line, and I have told you the warning signs that mean you do not wait for that appointment."}
     ]},

    {id:"monitor", nav:"Follow up", title:"Review and escalation triggers",
     blocks:[
       {b:"table", head:["When","What to check"], rows:[
         ["<b>2–4 weeks</b>","Trajectory — better, same or worse? Power, reflexes and sensation compared with the recorded baseline. Medication benefit and adverse effects; any opioid reviewed or stopped on its date, and any gabapentinoid use reviewed. Physiotherapy/exercise engagement. Work and daily activity. Alternative diagnoses considered. Red flags re-screened and the safety-net repeated"],
         ["<b>If not improving despite an appropriate trial of non-surgical care</b>","Reassess the diagnosis — stenosis, vascular claudication, hip pathology, or a non-radicular cause — red flags and function. Pain or functional impairment remaining substantial → refer for specialist spinal/MSK assessment (no fixed week threshold; imaging in that pathway when likely to change management). Screen for fear-avoidance and low mood; treat low mood or distress in its own right (e.g. NHS Talking Therapies) — NG59 no longer recommends psychological or combined programmes (withdrawn July 2026)"],
         ["<b>Any time</b>","Emergency referral for any cauda equina feature; urgent spinal/MSK assessment for new, severe or progressive motor weakness — regardless of how recently they were seen"],
         ["<b>Beyond 3 months</b>","Reassess whether the patient has persistent radicular pain with an identifiable underlying condition, chronic primary pain, or both. Continue management under NG59 for sciatica, and use NG193 options such as supervised exercise or ACT/CBT where chronic primary pain coexists or better explains the pain and disability. Review the analgesia against function rather than pain score, agree individualised withdrawal of any gabapentinoid or opioid (NG215), confirm the exercise programme is established, and address mood, sleep and work. See <a href='chronic-pain.html'>chronic pain</a>"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 A&amp;E the same day", html:"\"Numbness around the back passage or between your legs, unable to pass urine, losing control of bladder or bowels, or both legs becoming weak or numb — A&amp;E the same day, do not ring us first.\" Repeat at every consultation."},
         {tone:"amber", h:"🟠 Contact us urgently", html:"New or worsening weakness — a foot that drags or catches, or difficulty on stairs · rapidly worsening pain · fever with back pain · new night pain or weight loss."},
         {tone:"blue", h:"💊 About the tablets", host:"", html:"\"Take the anti-inflammatory with food, do not exceed the dose on the box even if the pain is bad, and if you've been given a stomach protector, take it alongside. If you've been given codeine, it's a small supply for acute pain only, until the review or stop date we agreed — it can constipate you, so use a laxative if advised, and don't drive if it makes you drowsy.\""},
         {tone:"green", h:"🔁 What recovery looks like", html:"\"Improvement is usually gradual and uneven — better one day, worse the next. The leg pain usually settles before the back pain, and some numbness or tingling can linger after the pain has gone. That pattern is normal and not a sign of damage.\""}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Emergency — same day", html:"Any cauda equina feature (emergency referral via the local suspected cauda equina pathway) · known cancer plus neurological signs (immediate MSCC coordinator/acute oncology pathway; MRI within 24 hours) · suspected spinal infection with systemic illness. <b>Urgent MRI is arranged by the receiving team — not an outpatient request.</b> Severe or progressive motor deficit → urgent spinal/MSK assessment; suspected fracture or malignancy → urgent investigation/referral."},
         {tone:"purple", h:"Suspected cancer routes · NICE NG12 (updated April 2026)", html:"Myeloma: aged 60 and over with persistent bone pain, particularly back pain, or an unexplained fracture → FBC, calcium, ESR or plasma viscosity, serum protein electrophoresis and serum free light chains, all together (urine Bence-Jones if free light chain testing is not available); suspected cancer pathway referral if the results suggest myeloma; suspected myeloma with acute kidney injury, hypercalcaemia, pathological fracture or cord compression needs urgent specialist assessment. Pancreatic cancer: consider urgent direct-access CT (or ultrasound if CT is unavailable) at 60 and over with unexplained weight loss plus back pain, abdominal symptoms, bowel change or new-onset diabetes. Bone sarcoma: in adults, suspected cancer pathway referral if an X-ray suggests possible bone sarcoma; the very urgent 48-hour direct-access X-ray for unexplained bone swelling or pain applies to children and young people."},
         {tone:"amber", h:"Spinal surgical opinion", html:"Pain or functional impairment remaining substantial despite an appropriate trial of non-surgical treatment, with the diagnosis and red flags reassessed (NG59: decompression considered when imaging is consistent; no fixed week threshold) · earlier if there is significant or progressive neurological deficit · neurogenic claudication with significantly limited walking distance being considered for decompression. Imaging is arranged in the specialist pathway when it is likely to change management, and should correlate with the clinical syndrome."},
         {tone:"blue", h:"Pain service — epidural injection", html:"Consider referral for epidural injection of local anaesthetic and steroid in ACUTE and SEVERE sciatica — a specialist pain/spinal procedure under local governance and consent (include duration, neurology, any imaging, anticoagulants, infection risk and function). <b>Not for chronic sciatica and not for low back pain</b>, where spinal injections are explicitly not recommended."},
         {tone:"blue", h:"Physiotherapy / MSK service", host:"", html:"For a group exercise programme, activity progression and manual therapy as part of a package. State the diagnosis, the neurological findings and the functional goal in the referral."},
         {tone:"green", h:"Persistent pain and distress", html:"NG59 no longer recommends psychological therapy or combined physical and psychological programmes (withdrawn July 2026; partly based on retracted evidence) — keep exercise, self-management and staying active. Treat co-existing depression or anxiety in its own right (NHS Talking Therapies); if features of chronic primary pain, see NG193 (ACT/CBT remains an option there) — a better use of the appointment than another scan."},
         {tone:"cream", h:"GP management", html:"Most sciatica is managed entirely in primary care: the verbal and written cauda equina safety-net, an NSAID after risk assessment (considering gastroprotection), explicit avoidance of gabapentinoids, benzodiazepines, oral steroids and long-term opioids, activity and physiotherapy, the fit note, and review at 2–4 weeks against a recorded neurological baseline. Use the local Greater Manchester MSCC, spinal, MSK, pain and medicines-withdrawal pathways. Related pages: <a href='../algorithms/back-pain.html'>back pain pathway (acute and chronic)</a> · <a href='chronic-pain.html'>chronic primary pain</a> · <a href='neuropathic-pain.html'>neuropathic pain</a> · <a href='opioid-prescribing.html'>opioids in non-cancer pain</a> · <a href='osteoarthritis.html'>osteoarthritis</a> · <a href='osteoporosis.html'>osteoporosis</a>."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 44-year-old warehouse supervisor has had <b>3 weeks of left leg pain</b> radiating from the buttock to the outer calf, worse on coughing, with tingling in the foot. Straight-leg raise is limited to 40° on the left; <b>power, reflexes and sensation are intact</b>. He has taken ibuprofen \"on and off\" and is <b>self-certified off work</b>. He arrives asking for \"pregabalin — my brother had it for the same thing and it sorted him out\", plus <b>\"a scan to see what's actually going on\"</b>, and a sick note for another month. He has a history of dyspepsia."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Screens for cauda equina with the specific questions and gives the safety-net verbally, documenting it; records power, reflexes and sensation as a baseline so progression is detectable; declines pregabalin and explains WHY — NG59 recommends not offering gabapentinoids for sciatica (no overall benefit, evidence of harm), and the reason his brother's experience differs is that the evidence does not support it, without dismissing the brother; <b>declines routine imaging with an explanation rather than a refusal</b>, noting it would not change management and that incidental degenerative findings are common; prescribes an NSAID at a defined dose and course length with gastroprotection given the dyspepsia, after checking GI, renal and CV risk; advises explicitly against bed rest and refers to physiotherapy for a group exercise programme; <b>gives a realistic prognosis</b> (most improve over time, often gradually) so conservative care is credible; addresses work actively — modified duties and a fit note that enables a graded return rather than another month off; <b>sets a 2–3 week review and names the escalation triggers</b>; and <b>ends with a plan rather than two refusals</b>."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>NICE NG215 — Medicines associated with dependence or withdrawal symptoms (2022)<span class="rd"> — individualised withdrawal of opioids, gabapentinoids and benzodiazepines</span></li><li>NICE NG59 — Low back pain and sciatica in over 16s: assessment and management (2016, updated 2020)<br><a href="https://www.nice.org.uk/guidance/ng59" rel="noopener">nice.org.uk/guidance/ng59</a><span class="rd"> — the do-not-offer recommendations for gabapentinoids, other antiepileptics, oral corticosteroids and benzodiazepines in sciatica; no opioids for chronic sciatica; NSAID first-line, considering gastroprotection; paracetamol not offered alone; the group exercise programme; manual therapy only within a package; the July 2026 withdrawal of the psychological therapy and combined physical and psychological programme recommendations (partly based on retracted evidence); epidural injection for acute severe sciatica; and the recommendations against belts, corsets, orthotics, traction, TENS/PENS, ultrasound, interferential therapy and acupuncture</span></li>'+
         '<li><b>NICE NG59 \u2014 Low back pain and sciatica in over 16s</b><br><a href="https://www.nice.org.uk/guidance/ng59" rel="noopener">nice.org.uk/guidance/ng59</a><span class="rd"> — the primary-care assessment, red-flag set, review intervals, prognosis and referral thresholds</span></li>'+
         '<li><b>NICE NG193 — Chronic pain (primary and secondary) in over 16s (2021)</b><br><a href="https://www.nice.org.uk/guidance/ng193" rel="noopener">nice.org.uk/guidance/ng193</a><span class="rd"> — manage under the underlying-condition guideline where it accounts for the pain; chronic primary pain recommendations only where chronic primary pain coexists or better explains it</span></li>'+
         '<li><b>NICE CG173 — Neuropathic pain in adults: pharmacological management (2013, updated 2020)</b><span class="rd"> — the ladder that governs neuropathic pain OTHER than sciatica, and the reason the two guidelines give opposite advice about the same drugs</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — myeloma bloods at 60 and over with persistent bone or back pain, pancreatic CT at 60 and over with weight loss plus back pain or other abdominal symptoms or new-onset diabetes, and suspected cancer pathway referral in adults when an X-ray suggests bone sarcoma (48-hour X-ray for children and young people)</span></li>'+
         '<li><b>NICE NG234 — Spinal metastases and metastatic spinal cord compression (2023)</b><br><a href="https://www.nice.org.uk/guidance/ng234" rel="noopener">nice.org.uk/guidance/ng234</a><span class="rd"> — MSCC with neurological signs: MSCC coordinator immediately, MRI within 24 hours, dexamethasone 16 mg; spinal metastasis pain without neurological signs: advice within 24 hours, MRI within 1 week</span></li>'+
         '<li><b>MHRA Drug Safety Updates</b><span class="rd"> — gabapentin and pregabalin as Class C controlled drugs (April 2019); misuse, dependence and potentially fatal CNS/respiratory depression with gabapentinoids, particularly with opioids or alcohol; NSAID cardiovascular and GI risk</span></li>'+
         '<li><b>Equality Act 2010</b><span class="rd"> — duties may apply where the legal definition of disability is met</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Sciatica — NICE NG59 (updated 2020), NG215, NG193, CG173 and NICE NG12 (updated April 2026). Give the cauda equina safety-net verbally at every consultation and document it. Do NOT offer gabapentin, pregabalin, other antiepileptics, benzodiazepines or oral corticosteroids for sciatica, and do not offer opioids for chronic sciatica — CG173's neuropathic ladder does not transfer here. Offer an NSAID after individual risk assessment at the lowest effective dose for the shortest time, considering gastroprotection. Advise against bed rest, refer for a group exercise programme, and give a realistic prognosis (most improve over time, often gradually). Image only when the result would change management. Verify all doses against the BNF before prescribing."
});
