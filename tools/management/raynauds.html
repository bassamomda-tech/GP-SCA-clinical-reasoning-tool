<script>
MG.render({
  icon:"🥶",
  title:"Raynaud's phenomenon — the complete guide",
  eyebrow:"Protocol · adults · assess &amp; manage in one place",
  stemTitle:"Primary or secondary decides the plan — and critical digital ischaemia decides the urgency",
  stemSub:"One page for the whole condition. Screen for critical digital ischaemia, digital ulcers and features of connective tissue disease; confirm episodic colour change with cold or stress; then classify primary versus secondary on age at onset, symmetry, tissue damage, nailfold changes and ANA. Primary Raynaud's is common and benign and is managed with warmth and trigger avoidance; secondary Raynaud's, most often systemic sclerosis, needs rheumatology. Investigate where it changes management, and use nifedipine — the only medicine licensed for Raynaud's in the UK — when attacks are troublesome despite lifestyle measures.",
  guideline:"BSR systemic sclerosis guideline (2024) · EULAR SSc recommendations (2023) · PCDS · nifedipine SPCs · HSE (HAVS) · NHS England commissioning policy · BNF",
  reviewed:"25 September 2026",
  nextReview:"25 September 2027",
  meta:[
    {t:"Critical ischaemia or gangrene → same day", tone:"tw"},
    {t:"Nifedipine: licensed, prescribe MR by brand", tone:"ok"},
    {t:"v2.1 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:"<div class='mg-layers'><a href='#severe'><b>Red flags</b><small>Ischaemia · ulcers · systemic</small></a><a href='#classify'><b>Classify</b><small>Primary vs secondary</small></a><a href='#lifestyle'><b>Lifestyle</b><small>First-line</small></a><a href='#ladder'><b>Drugs</b><small>Nifedipine, then specialist</small></a><a href='#refer'><b>Refer</b><small>Rheumatology · vascular</small></a></div>",
  quickSub:"If you read nothing else on this page, read these six cards. Every figure traces to the source cited under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Critical digital ischaemia is an emergency", html:"New digital ulceration, tissue necrosis or gangrene, persistent severe pain, or a digit that stays pale or blue and does not reperfuse with gentle warming → <b>urgent same-day clinical assessment</b>, contacting the local vascular, rheumatology/systemic sclerosis or acute medical service according to the findings. Suspected acute arterial occlusion or critical limb ischaemia → emergency vascular assessment. BSR 2024: severe digital vasculopathy with new necrosis or critical ischaemia is an emergency needing assessment, preferably within 48 hours."},
    {tone:"amber", h:"Asymmetry is atypical", html:"Asymmetry, single-digit involvement, abnormal pulses or an abnormal Allen test are atypical for primary Raynaud's — consider embolism or occlusion, atherosclerosis, hypothenar hammer syndrome, thoracic outlet disease, thromboangiitis obliterans, trauma or vibration injury. Arrange vascular assessment or imaging with urgency set by pain, colour persistence, tissue loss, pulses and progression; emergency advice if acute ischaemia is suspected."},
    {tone:"blue", h:"Age at onset and the features decide primary versus secondary", html:"Primary Raynaud's is more likely with young onset, bilateral symmetrical attacks, no tissue damage, a normal examination and no systemic features. Consider secondary disease at any age — particularly with later onset, male sex, asymmetry, severe or progressive symptoms, ulcers or pitting scars, puffy fingers, sclerodactyly, abnormal nailfolds or pulses, or symptoms of connective tissue disease. No single feature — age, ANA titre or asymmetry — decides it alone."},
    {tone:"green", h:"Lifestyle is first-line for everyone", html:"Keep the whole body warm; gloves or heated mittens; avoid known triggers and sudden cold; rewarm numb digits gradually with warm — not scalding — water and avoid direct heat, because burns can occur when sensation is reduced; stop smoking; review triggering medicines and decongestants."},
    {tone:"green", h:"Nifedipine when attacks are troublesome", html:"A long-acting dihydropyridine calcium-channel blocker — usually nifedipine, the only medicine licensed for Raynaud's in the UK (amlodipine is an alternative). Start low and titrate against response, BP and the specific product information; do not interchange modified-release preparations. Common effects: headache, flushing, dizziness, hypotension, peripheral oedema. Seasonal use is an optional, patient-led choice."},
    {tone:"amber", h:"Secondary disease and digital ulcers are specialist-led", html:"PDE-5 inhibitors (sildenafil or tadalafil) for refractory or systemic sclerosis-associated Raynaud's and digital ulcer healing; IV prostanoids (iloprost) for severe disease; bosentan to prevent new digital ulcers in systemic sclerosis — all specialist-started, with specialist wound care. <b>PDE-5 inhibitors must never be combined with nitrates.</b>"}
  ],
  pathwaySub:"The whole consultation in five moves.",
  pathway:[
    {title:"Screen for critical ischaemia and systemic disease", html:"Non-recovering or necrotic digit → same-day emergency. Digital ulcer → urgent. Asymmetry → urgent vascular. Systemic or CTD features → urgent rheumatology.", alert:true},
    {title:"Confirm the diagnosis", html:"Episodic, well-demarcated colour change (white, then often blue and red) with cold or emotional stress; photographs and a diary help."},
    {title:"Classify primary versus secondary", html:"Age at onset, symmetry, tissue damage, nailfold changes, ANA, systemic features, drugs and occupation."},
    {title:"Examine and investigate selectively", html:"Pulses and both-arm BP; hands for ulcers, pitting and sclerodactyly; bloods when onset is later or features suggest secondary disease."},
    {title:"Lifestyle first, then nifedipine; review", html:"Refer secondary disease, digital ulcers and refractory symptoms."}
  ],
  sections:[
    {id:"severe", nav:"Red flags", title:"Red flags — critical ischaemia and systemic disease",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Acute digital ischaemia", html:"Persistent painful pallor or cyanosis that does not reperfuse with gentle warming, tissue necrosis or gangrene, or absent or markedly reduced pulses → urgent same-day assessment; suspected arterial occlusion or critical limb ischaemia → emergency vascular."},
         {tone:"red", h:"🔴 New or non-healing digital ulcer", html:"Urgent same-day clinical assessment via the local rheumatology/systemic sclerosis, vascular or acute service according to the findings — BSR 2024 treats new necrosis as needing assessment preferably within 48 hours."},
         {tone:"amber", h:"🟠 Asymmetric or single-digit", html:"Vascular assessment or imaging, with urgency set by severity and the examination findings."},
         {tone:"amber", h:"🟠 Features of connective tissue disease", html:"Puffy fingers, sclerodactyly or skin tightening or itching, telangiectasia, calcinosis, reflux or dysphagia, breathlessness, cough or reduced exercise tolerance, inflammatory arthritis, rash, proximal weakness, sicca symptoms, or unexplained weight loss → rheumatology, with urgency set by severity and the local pathway."},
         {tone:"blue", h:"🔵 Later onset or worsening", html:"Later onset, or a known 'primary' pattern that becomes more severe or develops new features → directed investigation for secondary disease; refer if found."}
       ]}
     ]},

    {id:"confirm", nav:"Confirm", title:"Confirm — the targeted history",
     blocks:[
       {b:"table", head:["Feature","Detail"], rows:[
         ["<b>Colour change</b>","Episodic, well-demarcated pallor, often followed by cyanosis and then redness on rewarming — characteristic, not pathognomonic; pallor or cyanosis alone is common. May affect toes, ears, nose or nipples. Mimics include acrocyanosis, erythromelalgia, peripheral arterial and embolic disease"],
         ["<b>Triggers</b>","Cold, temperature change, emotional stress, vibration"],
         ["<b>Distribution</b>","Usually fingers, often toes; bilateral and symmetrical in primary disease"],
         ["<b>Diary and photographs</b>","Attack photographs and a record of frequency, severity, duration and triggers support diagnosis and measure response"],
         ["<b>Medicines and substances</b>","Non-selective beta-blockers, ergotamine and triptans, some chemotherapy (e.g. bleomycin, cisplatin), interferon, sympathomimetic decongestants, stimulants such as amphetamines and cocaine, and nicotine can cause or aggravate it"],["<b>Systemic enquiry</b>","Ulcers or pitting scars, puffy fingers, skin tightening or itching, rash, joint pain, myalgia or weakness, reflux or dysphagia, breathlessness or cough, dry eyes or mouth, weight loss"],
         ["<b>Occupation</b>","Vibrating tools — ask specifically. Hand–arm vibration risk depends on intensity, duration, cumulative exposure and individual susceptibility"]
       ]}
     ]},

    {id:"classify", nav:"Classify", title:"Classify — primary versus secondary",
     blocks:[
       {b:"table", head:["Category","Picture","Route"], rows:[
         ["<b>Primary Raynaud's</b>","Young onset, symmetrical, no tissue damage, normal examination, no systemic features","Primary care: lifestyle, diary, CCB if troublesome"],
         ["<b>Secondary, no tissue loss</b>","Features of connective tissue disease, abnormal nailfolds or pulses, drug or vibration cause","Directed investigation; rheumatology, vascular or occupational health by findings"],
         ["<b>Systemic sclerosis digital vasculopathy</b>","Digital ulcers, pitting scars, puffy fingers, sclerodactyly","Rheumatology/systemic sclerosis service; same day for new ulcers or necrosis"],
         ["<b>Acute digital ischaemia</b>","Persistent painful pallor or cyanosis, necrosis, absent pulses","Same day; emergency vascular for suspected occlusion"]
       ]},
       {b:"table", head:["Feature","Primary","Secondary"], rows:[
         ["<b>Onset</b>","Usually teens or twenties","Often later — after about 30–40"],
         ["<b>Pattern</b>","Symmetrical; no tissue damage","Asymmetrical, severe, or with ulcers or pitting scars"],
         ["<b>Nailfolds and ANA</b>","Normal; negative","Abnormal capillaries; positive ANA or specific autoantibodies"],
         ["<b>Associations</b>","None; common and benign","Systemic sclerosis (most common), SLE, Sjögren's, mixed connective tissue disease, myositis, vasculitis, rheumatoid arthritis"]
       ]},
       {b:"table", head:["Other cause","Action"], rows:[
         ["<b>Drug-induced</b>","Review and, where appropriate and safe, change the culprit"],
         ["<b>Hand–arm vibration syndrome</b>","Occupational health referral; the employer has duties under the Control of Vibration at Work Regulations, including risk assessment and exposure reduction. Reporting and benefit routes (RIDDOR, Industrial Injuries Disablement Benefit) should follow occupational health advice. Vibration-related Raynaud's does not in itself need vascular surgery"],
         ["<b>Structural or other</b>","Atherosclerosis, embolism, thoracic outlet syndrome, carpal tunnel syndrome, hypothyroidism, cryoglobulinaemia or haematological causes — investigate as the history directs"]
       ]}
     ]},

    {id:"exam", nav:"Examination", title:"Examination",
     blocks:[
       {b:"table", head:["What","How or finding","Significance"], rows:[
         ["<b>Pulses and BP</b>","Radial and ulnar pulses; BP in both arms","Asymmetry or a clear arm-to-arm BP difference → vascular assessment"],
         ["<b>Hands and feet</b>","Ulcers, pitting scars, gangrene, calcinosis, sclerodactyly, puffy fingers","Tissue damage means secondary disease until shown otherwise"],
         ["<b>Nailfolds</b>","Dilated loops, capillary dropout or haemorrhages — a dermatoscope can help those trained in it, but it is operator-dependent and not equivalent to formal videocapillaroscopy","Possible scleroderma-pattern abnormality → rheumatology. A normal view is reassuring but does not exclude connective tissue disease if suspicion remains"],
         ["<b>Skin and systems</b>","Telangiectasia, rash, livedo; chest crackles; proximal weakness; joint swelling; dry eyes or mouth","Points to a specific connective tissue disease → urgent rheumatology"],
         ["<b>Mimics</b>","Carpal tunnel and thoracic outlet signs","Identifies coexisting or alternative causes"]
       ]}
     ]},

    {id:"workup", nav:"Work-up", title:"Investigations — when they change management",
     blocks:[
       {b:"table", head:["Test","When","Interpretation"], rows:[
         ["<b>Directed bloods</b>","When secondary disease is suspected or the presentation is atypical: FBC, ESR or CRP, ANA; renal function and urinalysis if connective tissue disease or vasculitis is possible; TFTs if indicated; CK if weakness suggests myositis; electrophoresis, hepatitis serology or cryoglobulins only if the history points there","ANA supports a diagnosis only in the right clinical context — a low-titre positive ANA alone should not trigger referral. A negative ANA does not override strong clinical suspicion"],
         ["<b>Specialist autoantibodies</b>","Anti-centromere, anti-Scl-70 and others","Usually coordinated by rheumatology, per local arrangements"],
         ["<b>Imaging</b>","Chest X-ray for respiratory symptoms; arterial imaging for asymmetry or absent pulses","Not needed for typical bilateral primary Raynaud's"],
         ["<b>Not needed</b>","Typical bilateral, symmetrical Raynaud's starting young, with no tissue damage, normal examination and no systemic features","Reassure and give lifestyle advice; investigate if the picture changes"]
       ]},
       {b:"cards", items:[
         {tone:"blue", h:"No NG12 criterion for Raynaud's", html:"Raynaud's phenomenon is not itself a NICE suspected-cancer referral criterion. If independent cancer symptoms or signs are present, follow the relevant NICE NG12 pathway rather than attributing them to Raynaud's."}
       ]}
     ]},

    {id:"lifestyle", nav:"Lifestyle", title:"Lifestyle — first-line for everyone",
     blocks:[
       {b:"table", head:["Measure","What to do"], rows:[
         ["<b>🧤 Keep warm</b>","Whole-body warmth: layers, hat, gloves or mittens; pre-warm the car; heated gloves or hand warmers for outdoor work"],
         ["<b>❄️ Temperature change</b>","Avoid sudden cold, including cold drinks and freezer aisles; rewarm gradually with warm, not scalding, water, and avoid direct heat sources when sensation is reduced"],
         ["<b>🤲 During an attack</b>","Move somewhere warm, swing the arms, clench and unclench the hands, rewarm gently"],
         ["<b>🚭 Smoking</b>","Stop — nicotine causes vasoconstriction; refer to the stop-smoking service; nicotine vapes also constrict vessels"],
         ["<b>🎯 Triggers</b>","Stress management where stress triggers attacks; reduce caffeine if it seems to"],
         ["<b>💊 Medicines</b>","Avoid sympathomimetic decongestants; review a non-selective beta-blocker — do not stop a beta-blocker needed for a cardiac indication without discussion"],
         ["<b>🧴 Skin</b>","Regular emollient; protect the fingers; prompt attention to any break in the skin"],
         ["<b>🔧 Vibration</b>","Exposure reduction and the employer's risk assessment matter most — anti-vibration gloves do not reliably prevent transmission; involve occupational health"]
       ]}
     ]},

    {id:"ladder", nav:"Drugs", title:"Drug treatment — nifedipine, then specialist",
     blocks:[
       {b:"table", head:["Severity","Approach","Detail"], rows:[
         ["<b>Mild primary</b>","Lifestyle only","Review if it worsens"],
         ["<b>Troublesome attacks despite lifestyle</b>","<b>Long-acting dihydropyridine CCB</b> — usually nifedipine (licensed for Raynaud's); amlodipine is an alternative","Start at a low dose and titrate cautiously against response, BP and the specific product information and local formulary; modified-release preparations differ and are not interchangeable — prescribe by brand. Trial for several weeks. Seasonal use is an optional, patient-led adjustment"],
         ["<b>First CCB not tolerated</b>","Switch dihydropyridine CCB","e.g. nifedipine ↔ amlodipine; seek advice in cardiac disease"],
         ["<b>Refractory, secondary, or digital ulcers</b>","Refer — specialist therapy","Sildenafil or tadalafil (off-label) for refractory or systemic sclerosis-associated Raynaud's and digital ulcer healing or secondary prevention; bosentan second line to prevent new digital ulcers in systemic sclerosis; IV iloprost for severe or refractory disease; botulinum toxin — all specialist-initiated, with specialist wound care. PDE-5 inhibitors must never be combined with nitrates. Fluoxetine is an off-label, specialist-considered option only (limited evidence; it raises nifedipine levels via CYP3A4)"]
       ]},
       {b:"kv", rows:[
         ["Warn about","Common: headache, flushing, dizziness, hypotension, peripheral oedema"],
         ["Monitor","BP and side effects after starting or changing the dose; response against the diary"],
         ["Cautions","Clinically significant aortic stenosis, unstable angina, recent myocardial infarction, cardiogenic shock, hypotension, significant hepatic impairment, heart failure — check the SPC for the prescribed product"],["Pregnancy and breastfeeding","SPCs differ: some nifedipine prolonged-release products list pregnancy and breastfeeding as contraindications, while BSR pregnancy guidance (2022) considers nifedipine compatible. Check the SPC of the product prescribed and seek obstetric, maternal-medicine or medicines-in-pregnancy advice before treating in pregnancy"],
         ["Interactions","Additive hypotension with other antihypertensives and alpha-blockers; grapefruit and CYP3A4 inhibitors (e.g. clarithromycin, itraconazole, fluoxetine) raise levels; rifampicin lowers them"]
       ]},
       {b:"say", html:"For most people Raynaud's is harmless, and the most effective things are keeping your whole body warm, avoiding sudden cold and not smoking. If attacks are still troublesome, there's a tablet that relaxes the blood vessels. I'll check there's nothing linked to another condition — and please get seen the same day if a finger stays white or blue and painful after warming, or develops a sore."}
     ]},

    {id:"monitor", nav:"Monitor", title:"Follow-up and safety-netting",
     blocks:[
       {b:"table", head:["When","What"], rows:[
         ["<b>After starting or changing a vasodilator</b>","BP, adverse effects and benefit against the diary; adjust the dose"],
         ["<b>Stable primary Raynaud's</b>","Periodic review; re-examine and test further only if new features emerge — do not repeat the ANA in an unchanged patient"],
         ["<b>Re-assess if</b>","A digital ulcer, asymmetry, systemic features, a positive ANA, or disease refractory to lifestyle and a calcium-channel blocker — possible evolution to secondary disease"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"📞 Same-day emergency", html:"A digit that stays white or blue and painful despite rewarming · blackened or breaking-down skin."},
         {tone:"amber", h:"🟠 Urgent", html:"A new digital ulcer or non-healing wound · rapidly worsening attacks · new systemic symptoms."},
         {tone:"cream", h:"💬 Safety-net scripts", html:"“A finger or toe that stays painful, pale or blue after warming, or develops a sore or blackened skin — get seen the same day.” “Joint pains, rashes, trouble swallowing, breathlessness or tight skin on the fingers — tell us.” “Whole-body warmth and not smoking are the most effective everyday measures.”"}
       ]}
     ]},

    {id:"loop", nav:"Not improving?", title:"Not improving? Re-check before escalating",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"1 · Secondary disease?", html:"Asymmetry, ulcers, abnormal nailfolds, positive ANA or systemic features → rheumatology."},
         {tone:"amber", h:"2 · Aggravating drugs", html:"Decongestants, stimulants, a non-selective beta-blocker still in use?"},
         {tone:"amber", h:"3 · Triggers", html:"Cold, vibration, smoking and stress genuinely addressed?"},
         {tone:"amber", h:"4 · Adequate trial", html:"Nifedipine at a tolerated, titrated dose for several weeks?"},
         {tone:"red", h:"5 · Critical?", html:"Persistent pain, ulcers or tissue breakdown → urgent referral."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral criteria",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same-day emergency", html:"Critical digital ischaemia or gangrene → local vascular or acute pathway."},
         {tone:"red", h:"Same-day assessment", html:"New digital ulcer or necrosis → local rheumatology/systemic sclerosis, vascular or acute service according to the findings."},{tone:"amber", h:"Rheumatology", html:"Pitting scars, puffy fingers, sclerodactyly or other connective tissue disease features; a positive ANA with clinical features or abnormal nailfolds; systemic symptoms — urgency by severity and the local pathway."},
         {tone:"amber", h:"Vascular", html:"Asymmetric or single-digit disease, absent or unequal pulses, abnormal Allen test — urgency by severity; emergency for suspected acute ischaemia."},
         {tone:"blue", h:"Routine rheumatology", html:"Later-onset Raynaud's under investigation; abnormal nailfolds; refractory to lifestyle and a calcium-channel blocker; significant functional impact."},
         {tone:"blue", h:"Occupational health", html:"Suspected hand–arm vibration syndrome."},
         {tone:"green", h:"Primary care manages", html:"Typical primary Raynaud's: lifestyle advice, a symptom diary, a CCB if troublesome, and review if it changes. Use the local Greater Manchester referral and advice-and-guidance routes."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 46-year-old male groundworker describes two winters of fingers “going dead white then blue” — only on the right hand, worst in the index and middle fingers. He uses a breaker most days, smokes 15 a day, and has a small non-healing sore on one fingertip. He wants “circulation tablets like my wife got”."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Does not treat this as primary Raynaud's: recognises later onset, asymmetry and a non-healing digital ulcer; arranges same-day assessment of the ulcer and vascular assessment for the asymmetry rather than simply prescribing; checks pulses and both-arm BP and looks for connective tissue disease features; sends FBC, ESR/CRP, ANA and TFTs; recognises possible hand–arm vibration syndrome and involves occupational health; addresses smoking; safety-nets a digit that does not recover with warming."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>British Society for Rheumatology — 2024 guideline for management of systemic sclerosis</b> (Rheumatology 2024, doi:10.1093/rheumatology/keae394)<span class="rd"> — nailfold assessment, calcium-channel blockers, PDE-5 inhibitors, prostanoids, bosentan; severe digital vasculopathy as an emergency</span></li>'+'<li><b>British Society for Rheumatology — prescribing in pregnancy and breastfeeding: comorbidity medications (2022)</b><span class="rd"> — nifedipine in pregnancy</span></li>'+'<li><b>Primary Care Dermatology Society — Raynaud\'s phenomenon</b><span class="rd"> — risk features for secondary disease; long-acting nifedipine or amlodipine first-line</span></li>'+
         '<li><b>EULAR — recommendations for the treatment of systemic sclerosis (2023 update)</b><span class="rd"> — calcium-channel blockers first-line; PDE-5 inhibitors, iloprost and bosentan for severe disease and digital ulcers</span></li>'+
         '<li><b>MHRA SPCs — nifedipine prolonged-release products</b><span class="rd"> — contraindications, pregnancy and breastfeeding, interactions; products differ and are not interchangeable</span></li>'+
         '<li><b>NHS England — clinical commissioning policy: sildenafil and bosentan for digital ulceration in systemic sclerosis</b><span class="rd"> — specialist-initiated therapy</span></li>'+
         '<li><b>HSE — Control of Vibration at Work Regulations; RIDDOR</b><span class="rd"> — hand–arm vibration syndrome duties and reporting</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — nifedipine dosing, cautions and interactions</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Raynaud's phenomenon in primary care. Critical digital ischaemia or gangrene: same-day emergency assessment. Digital ulcers, connective tissue disease features and asymmetry: urgent specialist assessment. Classify primary versus secondary on age at onset, symmetry, tissue damage, nailfolds and ANA. Lifestyle is first-line; nifedipine (licensed; modified-release by brand) for troublesome attacks; specialist-initiated therapy for secondary disease and digital ulcers. Sources: BSR (2024), BSR pregnancy guidance (2022), EULAR (2023), PCDS, nifedipine SPCs, NHS England commissioning policy, HSE, BNF. Verify doses against the current BNF."
});
