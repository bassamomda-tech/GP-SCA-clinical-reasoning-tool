  stemSub:"One page for the whole condition. Screen for critical digital ischaemia and the systemic disease that Raynaud's often announces; confirm the triphasic colour change; then classify primary versus secondary on age, symmetry, tissue damage, nailfold capillaries and ANA — because primary is benign and managed with warmth, while secondary may be early systemic sclerosis with a closing window for disease modification. Investigate only where it changes management, treat lifestyle-first, and use nifedipine MR when attacks are troublesome. BSR · Cochrane.",

  ],
  lead:"<div class='mg-layers'><a href='#severe'><b>Red flags</b><small>Ulcers · asymmetry · systemic</small></a><a href='#classify'><b>Classify</b><small>Primary vs secondary</small></a><a href='#ladder'><b>Treat</b><small>Warmth first, then nifedipine</small></a><a href='#refer'><b>Refer</b><small>Vascular · rheumatology</small></a></div>",
  quickSub:"If you read nothing else on this page, read these six cards. Every figure traces to the source cited under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Digital ulceration or gangrene is a same-day referral", html:"Tissue loss, black necrotic areas or non-healing fingertip ulcers → same-day vascular surgery: critical limb ischaemia can cause irreversible tissue damage within hours. Systemic sclerosis carries a 40% digital-ulcer risk; 30% of SSc patients develop digital ulcers and 10% require amputation. Sudden severe pain with a cold pale digit not responding to warming within 30 minutes → acute arterial occlusion, 999."},
    {tone:"amber", h:"Asymmetry is not Raynaud's until proven otherwise", html:"Unilateral or single-digit involvement is atypical for primary Raynaud's and suggests a structural vascular abnormality (atherosclerosis, embolism, thoracic outlet compression) → 2-week vascular assessment with imaging to exclude occlusion. Primary disease is bilateral and symmetrical, fingers more than toes, with the thumbs often spared — because digital arteries there have less sympathetic innervation."},
    {tone:"blue", h:"Age at onset is the strongest predictor", html:"Primary Raynaud's affects 3–5% of the population and accounts for 90% of all cases, with a benign prognosis; it rarely develops after age 40. Age at onset is the strongest predictor: onset under 30 (&lt;30 years) is 95% primary, while onset over 40 (&gt;40 years) is 50% secondary. Primary Raynaud's has a low risk of progression to CTD (&lt;1%, and up to 1–2% across series, over 10 years) — but that is exactly why new ulcers, asymmetry or systemic features in a “known primary” patient mandate urgent reassessment."},
    {tone:"green", h:"Nailfold capillaroscopy — the best bedside test, done with a dermatoscope", html:"Use a dermatoscope or ophthalmoscope at 10–40× magnification. Normal: regular parallel loops. Abnormal: dilated loops, dropout (avascular areas), haemorrhages → refer rheumatology. Abnormal capillaries have 92% sensitivity for systemic sclerosis and predict progression to definite CTD in 80% at 5 years; normal capillaries virtually exclude significant CTD (99% negative predictive value)."},
    {tone:"purple", h:"Lifestyle IS the treatment — and core warmth beats hand warmth", html:"Lifestyle modification can reduce attack frequency by 50%, and 60% of patients improve with lifestyle alone. Maintain core temperature, not just the extremities — sympathetic vasoconstriction is triggered by core hypothermia; wearing a hat (30% of body heat is lost through the head) reduces digital vasospasm frequency by 30%. Never plunge cold hands into hot water — it causes painful reactive hyperaemia and can trigger chilblains; rewarm gradually with lukewarm water."},
    {tone:"teal", h:"Nifedipine MR — the only CCB with RCT evidence, and stop it in summer", html:"Nifedipine MR 30 mg OD (up to 60 mg) reduces attack frequency by 30–40% and severity by 30%, NNT 6; the modified-release formulation has fewer side effects than immediate-release. Start in October before winter; check BP at 2 weeks; warn about ankle swelling (20%), headache (15%) and flushing. Step the dose down or stop in the warmer months (April–September) and restart in October — this improves adherence and reduces the oedema burden."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step catches both the dying digit and the early scleroderma.",
  pathway:[
    {title:"Screen for critical ischaemia and systemic disease", html:"Digital ulceration or gangrene → same-day vascular surgery. Severe pain or permanent colour change → same-day (acute arterial occlusion). Asymmetric or single-digit → 2-week vascular. Systemic symptoms (weight loss, fever, arthralgia, rash, muscle weakness) → 2-week rheumatology. Digital pitting or sclerodactyly → urgent rheumatology. Onset over 40, especially male smokers → urgent rheumatology for early systemic sclerosis or vasculitis. Rapidly progressive → routine rheumatology.", alert:true},
    {title:"Confirm the diagnosis clinically", html:"Triphasic colour change — white (pallor) → blue (cyanosis) → red (hyperaemia), episodes lasting 15–20 minutes, though not all patients have all three phases. Triggers: cold, emotional stress, vibration. Bilateral, symmetrical, fingers more than toes, thumbs often spared, palms and soles spared. Ask for photographs of attacks and a symptom diary (frequency, severity 0–10, duration, triggers, functional impact). Take a drug and occupational history."},
    {title:"Classify primary versus secondary", html:"Primary: onset in the teens–20s, symmetrical, no tissue damage, normal nailfold capillaries, negative ANA. Secondary: onset over 30, asymmetric, digital ulcers or pitting scars, abnormal capillaries, positive autoantibodies, systemic symptoms — commonest cause systemic sclerosis, then SLE, RA, Sjögren's, MCTD and vasculitis. Also consider drug-induced, hand–arm vibration syndrome, hypothyroidism, carpal tunnel, thoracic outlet, cryoglobulinaemia, hepatitis C and haematological causes."},
    {title:"Examine and investigate selectively", html:"BP both arms, pulses, hands and feet for ulcers, pitting, calcinosis and sclerodactyly, nailfold capillaries, Allen's test, skin (telangiectasia, malar rash, livedo), systemic signs, and carpal tunnel/thoracic outlet tests. Bloods only if over 30 or red flags: FBC, ESR/CRP, ANA, TFTs ± protein electrophoresis. Do NOT investigate typical primary Raynaud's in young women."},
    {title:"Treat lifestyle-first, then nifedipine, and review", html:"Warmth, trigger avoidance, smoking cessation and culprit-drug review for everyone. Nifedipine MR 30 mg OD for moderate–severe attacks or functional impairment, up to 60 mg. Review at 2 and 6 weeks, then 3–6-monthly with seasonal dose adjustment. Refer refractory or secondary disease."}
  ],
  sections:[
    {id:"severe", nav:"Red flags", title:"Red flags — critical limb ischaemia and systemic disease", sub:"Exclude emergency vascular compromise and the secondary causes needing urgent specialist input.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Digital ulceration / gangrene", html:"Tissue loss, black necrotic areas, non-healing fingertip ulcers → same-day vascular surgery referral (critical limb ischaemia)."},
         {tone:"red", h:"🔴 Severe pain / permanent colour change", html:"Persistent cyanosis, or severe burning pain not relieved by warming → same-day assessment (acute arterial occlusion)."},
         {tone:"amber", h:"🟠 Asymmetric symptoms", html:"Unilateral or single-digit involvement → 2-week vascular assessment (arterial occlusion, thoracic outlet syndrome)."},
         {tone:"amber", h:"🟠 Systemic symptoms", html:"Weight loss, fevers, arthralgia, rash, muscle weakness → 2-week rheumatology (connective tissue disease, vasculitis)."},
         {tone:"amber", h:"🟠 Digital pitting / sclerodactyly", html:"Tight shiny skin on the fingers, loss of fingertip pulp → urgent rheumatology (systemic sclerosis)."},
         {tone:"amber", h:"🟠 Onset over 40 — especially male smokers", html:"→ urgent rheumatology (early systemic sclerosis, vasculitis). Young males with severe Raynaud's have a higher risk of underlying connective tissue disease than the typical primary demographic of young women with mild symptoms."},
         {tone:"blue", h:"🔵 Rapidly progressive", html:"Increasing frequency or severity over weeks, new functional impairment → routine rheumatology (secondary Raynaud's)."},
         {tone:"plain", h:"⚪ Unilateral facial or ear symptoms", html:"One-sided face, ear or nose involvement → routine ENT or neurology (temporal arteritis, neurological cause)."}
       ]},
       {b:"why", html:"Critical limb ischaemia can lead to irreversible tissue damage within hours, and digital ulcers suggest severe underlying vasculopathy — systemic sclerosis carries a 40% digital-ulcer risk. Missing early systemic sclerosis delays disease-modifying treatment. Asymmetric presentation is atypical for primary Raynaud's and suggests a structural vascular abnormality; single-digit involvement warrants imaging to exclude occlusion."}
     ]},

    {id:"confirm", nav:"Confirm", title:"Confirmation — the targeted history", sub:"Raynaud's is a clinical diagnosis. Confirm the classic triphasic colour change and the triggers.",
     blocks:[
       {b:"table", head:["Feature","Detail","Why"], rows:[
         ["<b>Classic features</b>","Triphasic colour change: white (pallor) → blue (cyanosis) → red (hyperaemia). Not all patients have all three phases. Episodes last 15–20 minutes","Pathognomonic — sequential arteriolar vasospasm (white), deoxygenated blood pooling (blue) and reperfusion (red). Some report only white or blue; the red phase may be a painful burning sensation"],
         ["<b>Triggers</b>","Cold exposure, emotional stress, vibration. Ask about occupational triggers (tools, typing)","Directs both avoidance advice and the HAVS question"],
         ["<b>Distribution</b>","Bilateral and symmetrical; fingers more than toes; thumbs often spared; typically spares the palm and sole","Bilateral symmetry distinguishes primary from secondary — structural vascular lesions cause asymmetry. Thumb sparing occurs because those digital arteries have less sympathetic innervation"],
         ["<b>Symptom diary</b>","Ask the patient to photograph attacks and record frequency, severity (0–10), duration, triggers and functional impact; bring it to the next appointment","Photographic evidence is invaluable — many patients struggle to describe episodes, and the diary quantifies treatment response"],
         ["<b>Drug history</b>","Beta-blockers, chemotherapy (bleomycin, cisplatin), ergot derivatives, clonidine, interferon, cocaine, amphetamines — all can cause or worsen Raynaud's","<b>Symptoms may resolve 2–4 weeks after stopping the culprit</b>"],
         ["<b>Occupational</b>","Vibrating tools (drill, chainsaw), repetitive trauma (typing, manual labour)","<b>May qualify for industrial injuries benefit</b>"]
       ]}
     ]},

    {id:"classify", nav:"Classify", title:"Classification — primary versus secondary", sub:"This distinction determines investigation, treatment and referral. Primary is benign; secondary may be the first sign of connective tissue disease.",
     blocks:[
       {b:"table", head:["Feature","Primary (benign)","Secondary (worrying)"], rows:[
         ["<b>Onset</b>","<b>Younger (teens–20s)</b>","<b>Older (&gt;30)</b>"],
         ["<b>Pattern</b>","<b>Symmetrical, no tissue damage</b>","<b>Asymmetrical, ulcers or pitting scars</b>"],
         ["<b>Nailfold capillaries / ANA</b>","<b>Normal / negative</b>","<b>Abnormal / positive autoantibodies</b>"],
         ["<b>Association</b>","None. Prevalence 3–5% of the population, 90% of all Raynaud's cases, benign prognosis","Connective-tissue disease — systemic sclerosis (most common), SLE, rheumatoid arthritis, Sjögren's, mixed connective tissue disease, vasculitis. Requires investigation"]
       ]},
       {b:"table", head:["Other category","Detail","Action"], rows:[
         ["<b>Drug-induced</b>","Beta-blockers, chemotherapy (cisplatin, bleomycin), interferon, clonidine, ergotamine","Review medication and consider alternatives — symptoms may resolve 2–4 weeks after cessation"],
         ["<b>Occupational — hand–arm vibration syndrome (HAVS)</b>","<b>Requires more than 5 years of vibration-tool use</b>","HSE notification, occupational health referral, advise on compensation claims"],
         ["<b>Other causes</b>","Hypothyroidism, carpal tunnel syndrome, thoracic outlet syndrome, cryoglobulinaemia, hepatitis C, haematological (polycythaemia, thrombocytosis)","Investigate as the history directs"]
       ]},
       {b:"why", html:"Age at onset is the strongest predictor — primary Raynaud's rarely develops after 40, and onset over 40 carries around a 50% chance of secondary disease. Secondary Raynaud's carries significant morbidity: 30% of systemic sclerosis patients develop digital ulcers and 10% require amputation. Early rheumatology input enables disease-modifying treatment (methotrexate, mycophenolate) before irreversible fibrosis. Connective tissue disease screening is cost-effective in new-onset Raynaud's over 30; a positive ANA has high sensitivity for systemic sclerosis but low specificity, and abnormal nailfold capillaries predict progression to definite CTD in 80% at 5 years."}
     ]},

    {id:"exam", nav:"Examination", title:"Examination — vascular and systemic disease", sub:"Focus on digital perfusion, tissue damage and signs of underlying connective tissue disease.",
     blocks:[
       {b:"table", head:["What","How / findings","Significance"], rows:[
         ["<b>Vital signs</b>","BP in both arms (a difference over 20 mmHg suggests subclavian stenosis), radial pulse symmetry, temperature","Screens for structural arterial disease"],
         ["<b>Hands and feet</b>","Digital ulcers, pitting scars, gangrene, calcinosis, sclerodactyly (tight shiny skin), nailfold changes","<b>Tissue damage = secondary Raynaud's requiring rheumatology referral</b>"],
         ["<b>Nailfold capillaries</b>","Dermatoscope or ophthalmoscope at 10–40× magnification. Normal: regular parallel loops. Abnormal: dilated loops, dropout (avascular areas), haemorrhages","Abnormal → refer rheumatology. 92% sensitivity for systemic sclerosis; normal capillaries virtually exclude significant CTD (99% NPV)"],
         ["<b>Vascular examination</b>","Allen's test (ulnar and radial artery patency), brachial/radial/ulnar pulses, capillary refill time (&lt;2 seconds is normal), Buerger's test (pallor on elevation)","Asymmetry → vascular imaging. An abnormal Allen's test (incomplete palmar arch) occurs in 5% of the population but increases digital ischaemia risk — refer for imaging"],
         ["<b>Skin</b>","Telangiectasia (face, hands — systemic sclerosis), malar rash (SLE), digital infarcts, livedo reticularis, calcinosis cutis","Points to the specific CTD"],
         ["<b>Systemic signs</b>","Lung crackles (interstitial lung disease), weak proximal muscles (myositis), dry eyes or mouth (Sjögren's), joint swelling (inflammatory arthritis)","<b>Present → urgent rheumatology</b>"],
         ["<b>Neurological</b>","Carpal tunnel signs (Tinel's, Phalen's) — can coexist with or mimic Raynaud's. Thoracic outlet tests (Adson's, Wright's)","Identifies the mimics"]
       ]},
       {b:"why", html:"Nailfold capillaroscopy is the single best bedside predictor of secondary Raynaud's. Digital ulcers are not just a marker of severity — they are a treatment trigger: their presence mandates a phosphodiesterase-5 inhibitor (sildenafil) or an endothelin receptor antagonist (bosentan) to prevent recurrence and amputation."}
     ]},

    {id:"workup", nav:"Work-up", title:"Investigations — the autoimmune work-up for secondary causes", sub:"Investigate ALL new Raynaud's over 30, or any red flags. Do NOT investigate typical primary Raynaud's in young women.",
     blocks:[
       {b:"table", head:["Test","Detail","Interpretation"], rows:[
         ["<b>Primary-care bloods</b>","FBC (anaemia in CTD; polycythaemia or thrombocytosis), ESR/CRP (inflammatory disease), ANA (connective tissue disease screen), TFTs (hypothyroidism), protein electrophoresis (cryoglobulinaemia if indicated). Do if age over 30 or red flags","The whole primary-care panel"],
         ["<b>ANA interpretation</b>","Positive (≥1:80) → refer rheumatology for the further autoantibody panel (anti-Scl70, anti-centromere, anti-RNP). Negative does NOT exclude CTD — 15% of systemic sclerosis is ANA-negative, and clinical suspicion overrides a negative ANA","Titre matters: 1:160 or higher is more significant. ANA has around 93% sensitivity for systemic sclerosis but only ~50% specificity, with many false positives in healthy and older people"],
         ["<b>Specialist bloods</b>","Rheumatology will request the ENA panel (anti-Scl70 = diffuse SSc, anti-centromere = limited SSc), anti-CCP/RF, cryoglobulins, complement C3/C4, ANCA","<b>Do NOT order these in primary care</b>"],
         ["<b>Imaging — when needed</b>","Chest X-ray if lung symptoms (ILD in SSc). Doppler arterial ultrasound if asymmetric, weak pulses, or severe unilateral disease","NOT routine in bilateral symmetrical Raynaud's — Doppler detects structural arterial disease but is normal in functional vasospasm"],
         ["<b>Do NOT investigate</b>","Young women with typical bilateral symmetrical symptoms, no tissue damage and no systemic features","Diagnosis is primary Raynaud's — reassure, give lifestyle advice, review if it worsens. Over-investigation generates false-positive autoantibodies, anxiety and unnecessary referrals"]
       ]},
       {b:"cards", items:[
         {tone:"purple", h:"NG12 criteria that surface here <span class='tw'>2WW</span>", html:"Raynaud's phenomenon has no NICE NG12 criterion of its own, and this page does not invent one — the urgency here is vascular and rheumatological. Two NG12 routes can nevertheless arise from the secondary work-up:<br>• Unexplained weight loss, fever or night sweats with lymphadenopathy or splenomegaly in the systemic screen → the lymphoma 2-week-wait route, with urgent FBC where the features suggest leukaemia. The constitutional symptoms that trigger a rheumatology referral here overlap with the haematological criteria.<br>• Raynaud's of recent onset can rarely be paraneoplastic — where a systemic screen shows unexplained weight loss with no CTD found, follow the relevant urgent suspected-cancer pathway for the site suggested by symptoms rather than attributing it to vasospasm.", src:"NICE NG12 (updated May 2025) · house rule"}
       ]}
     ]},

    {id:"ladder", nav:"Treat", title:"Treatment — lifestyle first, then the drug ladder", sub:"Start lifestyle measures FIRST. Escalate pharmacotherapy for moderate–severe symptoms or functional impairment. Verify doses in the BNF.",
     blocks:[
       {b:"table", head:["Severity","Approach","Detail"], rows:[
         ["<b>Mild primary Raynaud's</b>","<b>Lifestyle only — first-line</b>","Infrequent attacks, minimal functional impact, no digital damage. Annual review. Offer nifedipine if it worsens"],
         ["<b>Moderate–severe primary Raynaud's</b>","<b>Nifedipine MR — first-line drug</b>","30 mg OD, increasing to 60 mg OD if tolerated and needed; start low if elderly or frail; trial 4–6 weeks"],
         ["<b>Secondary Raynaud's / digital ulcers</b>","<b>Specialist therapy — refer</b>","Rheumatology will prescribe PDE5 inhibitors, endothelin antagonists and prostacyclin analogues — not initiated in primary care"]
       ]},
       {b:"ladder", steps:[
         {step:"Step 1", title:"Nifedipine MR 30 mg OD", when:"moderate–severe attacks", fromLabel:"most evidence",
          html:"Start in October before winter. Warn about ankle swelling (20%), headache (15%) and flushing. Check BP at 2 weeks. Nifedipine MR 10 mg OD titrated to 20 mg BD (i.e. 10–20 mg per dose) is an alternative lower-dose regimen where tolerability is a concern."},
         {step:"Step 2", title:"Nifedipine MR 60 mg OD", when:"partial response", fromLabel:"maximum tolerated dose",
          html:"<b>Monitor BP and oedema.</b>"},
         {step:"Step 3", title:"Alternative calcium-channel blocker", when:"nifedipine not tolerated", fromLabel:"less evidence",
          html:"Amlodipine 5–10 mg OD (less evidence but better tolerated if nifedipine causes headaches), or diltiazem 60 mg TDS (avoid in cardiac disease)."},
         {step:"Step 4", title:"Fluoxetine 20 mg OD (off-label)", when:"CCBs unsuitable", fromLabel:"some evidence in primary disease",
          html:"Consider where there is comorbid depression or anxiety. Warn about serotonin syndrome if on other antidepressants."},
         {step:"Step 5", title:"Refer rheumatology — specialist options", when:"refractory to a CCB", fromLabel:"secondary care",
          html:"Sildenafil 25–50 mg TDS, IV iloprost infusions (critical digital ischaemia), bosentan (digital ulcers in systemic sclerosis), botulinum toxin, sympathectomy."}
       ]},
       {b:"kv", rows:[
         ["Monitoring","BP at 2 weeks then 3-monthly; ask about ankle swelling and headaches; review the symptom diary; step the dose down in spring if symptoms are controlled"],
         ["Contraindications","Pregnancy (nifedipine is relatively safe but use caution), unstable angina, recent MI, severe aortic stenosis, heart failure"],
         ["Interactions","Nifedipine + alpha-blockers = severe hypotension. Grapefruit juice increases nifedipine levels, as do CYP3A4 inhibitors (erythromycin, itraconazole)"]
       ]},
       {b:"why", html:"Nifedipine is the only CCB with RCT evidence in Raynaud's — it reduces attack frequency by 30–40% and severity by 30%, NNT 6, and the modified-release formulation causes fewer side effects than immediate-release. The lifestyle-first approach respects the benign nature of primary Raynaud's and avoids medicalising a common physiological variant — 60% improve with lifestyle alone. Specialist therapies are not initiated in primary care because of high cost (£200–500/month), the need for specialist monitoring, and their role in severe secondary disease — sildenafil reduces digital-ulcer burden by 50% in systemic sclerosis but has no role in uncomplicated primary Raynaud's."},
       {b:"say", html:"For most people this is harmless, and the key is keeping your whole body warm and avoiding triggers, with a tablet if attacks are frequent. I'll just check there are no signs it's linked to another condition — and you should seek help urgently if a finger stays discoloured or develops a sore."}
     ]},

    {id:"lifestyle", nav:"Lifestyle", title:"Non-pharmacological management — first-line for everyone", sub:"Lifestyle modification is PRIMARY TREATMENT, not an optional add-on: it can reduce attack frequency by 50%.",
     blocks:[
       {b:"table", head:["Measure","What to do","Why"], rows:[
         ["<b>🧤 Keep warm — core temperature</b>","Maintain whole-body warmth, not just the extremities. Layers, thermal base layers, a hat (30% of body heat is lost through the head). Pre-warm the car and home","Sympathetic vasoconstriction is triggered by core hypothermia, not just local cold — wearing a hat decreases digital vasospasm frequency by 30%"],
         ["<b>❄️ Avoid rapid temperature changes</b>","Acclimatise gradually. Do NOT plunge hands into hot water during an attack — lukewarm rewarming only","Rapid rewarming causes painful reactive hyperaemia and can trigger chilblains"],
         ["<b>🔥 Heated gloves and hand warmers</b>","Battery-powered heated gloves (£50–150) for outdoor work; disposable hand warmers in pockets; electrically heated insoles for the feet","Practical and effective for occupational exposure"],
         ["<b>🚭 Smoking cessation</b>","Refer to the stop-smoking service. Vaping also contains nicotine — avoid","Nicotine causes vasoconstriction and smoking doubles attack frequency; in systemic sclerosis it worsens digital ulcers and increases amputation risk 3-fold. Non-negotiable in secondary disease"],
         ["<b>🎯 Avoid triggers</b>","Identify personal triggers (emotional stress, caffeine, cold drinks, air conditioning); stress-management techniques if stress-triggered; reduce caffeine if it is a trigger","Personalised avoidance beats generic advice"],
         ["<b>🏃 Exercise regularly</b>","30 minutes of moderate exercise 5×/week — swimming in a heated pool is ideal (warm plus aerobic)","Improves peripheral circulation"],
         ["<b>🤲 Hand exercises during an attack</b>","Swing the arms in circles, clench and unclench the fists to promote blood flow; gradual rewarming only","Shortens the attack without the hyperaemia"],
         ["<b>💊 Review medications</b>","Beta-blockers worsen Raynaud's — discuss alternatives. OTC decongestants (pseudoephedrine) can trigger attacks — avoid","Often the single most effective change"],
         ["<b>🧴 Moisturise hands</b>","<b>Emollient (Diprobase, Epaderm) 3–4× daily</b>","Prevents skin cracking and fissures, which are entry points for infection"],
         ["<b>🔧 Occupational modification</b>","With vibration tools: anti-vibration gloves, limit exposure duration, take warm-up breaks. Inform the employer","<b>HSE duty to reduce vibration exposure</b>"],
         ["<b>🩹 Skin care</b>","Protect the skin and give prompt attention to any breaks or ulcers, especially in secondary disease","Prevents ulcer progression"]
       ]}
     ]},

    {id:"monitor", nav:"Monitor", title:"Follow-up, monitoring and safety-netting", sub:"Review by severity and risk — and never assume stable primary Raynaud's stays benign.",
     blocks:[
       {b:"table", head:["When","What","Action"], rows:[
         ["<b>2 weeks</b>","If starting nifedipine: check BP, ask about ankle swelling, headache and flushing","<b>Adjust the dose if needed; confirm the patient has a symptom diary</b>"],
         ["<b>6 weeks</b>","<b>Review the symptom diary — frequency, severity, functional impact</b>","Ineffective → increase to 60 mg or consider an alternative CCB. Effective → continue and review in 3 months"],
         ["<b>3–6 monthly</b>","Primary Raynaud's on treatment: BP, symptom control, side effects; review the medication list for culprit drugs","Consider stepping the dose down in the warmer months (April–September) and restarting in October"],
         ["<b>Annual review</b>","Stable primary Raynaud's: check for new systemic symptoms, examine the hands for tissue damage, repeat ANA if new features emerge","Reassure if unchanged; discharge if asymptomatic for 2 years and the patient is confident self-managing"],
         ["<b>Re-refer if</b>","Known primary Raynaud's develops digital ulcers, asymmetric symptoms, systemic features, a positive ANA, or becomes refractory to a CCB plus lifestyle","Urgent rheumatology referral — it may have evolved to secondary disease"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"📞 999", html:"Sudden severe pain with a cold pale digit not responding to warming within 30 minutes → acute arterial occlusion. Black discolouration or tissue breakdown → critical ischaemia."},
         {tone:"amber", h:"🟠 Same-day", html:"A new digital ulcer or non-healing wound · rapidly worsening attacks (daily, severe pain) · new systemic symptoms (fever, weight loss, joint swelling, muscle weakness)."},
         {tone:"cream", h:"💬 Safety-net scripts", html:"“A finger or toe that stays painful, pale or blue, or develops a sore, ulcer or blackened skin — seek urgent help.” “Joint pains, rashes, swallowing problems or skin tightening — tell us; we may need to investigate further.” “Keeping your whole body warm and avoiding sudden cold is the most effective everyday measure.” “Smoking makes attacks worse — stopping genuinely helps.”"}
       ]},
       {b:"why", html:"Evolution to secondary Raynaud's is rare but important to catch — 1–2% of primary patients develop connective tissue disease over 10 years, so new ulcers, systemic symptoms or sudden worsening mandate urgent reassessment. Seasonal dose adjustment reduces unnecessary drug exposure: many patients can stop nifedipine in summer and restart in October, improving adherence and reducing ankle oedema. Non-healing ulcers can become superinfected (cellulitis, osteomyelitis) or progress to gangrene requiring amputation — same-day assessment enables early antibiotics, wound care and escalation of vasodilator therapy."}
     ]},

    {id:"loop", nav:"Not improving?", title:"Not improving? Re-check before escalating", sub:"Reconsider a secondary cause and the aggravating factors.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"1 · Secondary disease?", html:"Asymmetry, ulcers, abnormal nailfold capillaries, positive ANA → rheumatology."},
         {tone:"amber", h:"2 · Aggravating drugs", html:"<b>Beta-blockers or vasoconstrictors still in use?</b>"},
         {tone:"amber", h:"3 · Triggers", html:"<b>Cold exposure, vibration, smoking and stress genuinely addressed?</b>"},
         {tone:"amber", h:"4 · Drug trial", html:"Has an adequate nifedipine dose been tried and tolerated for 4–6 weeks?"},
         {tone:"amber", h:"5 · Critical?", html:"<b>Persistent pain, ulcers or gangrene → urgent referral.</b>"}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral criteria", sub:"Refer secondary Raynaud's, severe primary disease, or diagnostic uncertainty.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same-day", html:"Digital gangrene or severe ulceration → vascular surgery (acute critical limb ischaemia). Severe pain with permanent colour change → medical on-call (acute arterial occlusion)."},
         {tone:"amber", h:"2-week urgent", html:"Systemic symptoms (weight loss, fever, muscle weakness, rash) → rheumatology. Digital pitting scars or sclerodactyly → rheumatology (systemic sclerosis). Positive ANA with clinical features → rheumatology."},
         {tone:"blue", h:"Routine rheumatology", html:"Age at onset over 40 · abnormal nailfold capillaries · rapidly progressive symptoms · refractory to lifestyle plus nifedipine · functional impairment (unable to work or limited daily activities)."},
         {tone:"blue", h:"Vascular surgery", html:"Asymmetric or unilateral symptoms · absent pulses or a positive Allen's test · occupational HAVS if severe and persistent despite trigger avoidance."},
         {tone:"green", h:"Primary care manages", html:"Primary Raynaud's criteria met — age &lt;30, bilateral symmetrical, mild symptoms, normal examination, negative bloods if done: lifestyle advice, a nifedipine trial if moderate–severe, and annual review."}
       ]},
       {b:"why", html:"Early rheumatology referral in secondary Raynaud's prevents irreversible complications — systemic sclerosis patients benefit from immunosuppression before the fibrotic phase, and the window of opportunity is the first 3–5 years, so delayed referral is a missed chance for disease modification. Functional impairment justifies specialist input even in primary Raynaud's — patients unable to work in cold environments, handle frozen food or perform daily tasks benefit from advanced therapies."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 46-year-old male groundworker describes two winters of fingers “going dead white then blue” — but only on the right hand, worst in the index and middle fingers. He uses a breaker most days, smokes 15 a day, and has a small non-healing sore on one fingertip he says he caught on a fence. He wants “circulation tablets like my wife got”."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Refuses to treat this as primary Raynaud's: identifies <b>onset over 40, male smoker, asymmetry and a non-healing digital ulcer</b> as three separate red flags; arranges <b>same-day vascular assessment for the ulcer</b> rather than prescribing nifedipine; examines <b>nailfold capillaries with a dermatoscope</b>, checks <b>BP both arms, pulses and Allen's test</b>; sends <b>FBC, ESR/CRP, ANA and TFTs</b>; recognises <b>HAVS</b> with its occupational-health, HSE and compensation implications; addresses <b>smoking as non-negotiable</b>; and safety-nets <b>a digit not rewarming within 30 minutes</b>."}
     ]}]},
