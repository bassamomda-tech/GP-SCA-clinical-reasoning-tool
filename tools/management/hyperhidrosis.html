  stemSub:"One page for the whole condition. Separate benign primary focal hyperhidrosis (young, bilateral, focal, silent at night, often familial) from the secondary sweating that can be lymphoma, phaeochromocytoma, carcinoid, TB, thyrotoxicosis or a drug; score severity with the HDSS; investigate only on suspicion; and climb the six-step ladder from aluminium chloride to botulinum toxin — with sympathectomy as a heavily-counselled last resort. IHS · BNF.",

  ],
  lead:"<div class='mg-layers'><a href='#severe'><b>Red flags</b><small>Night sweats · phaeo · serotonin syndrome</small></a><a href='#history'><b>Classify</b><small>Primary vs secondary · HDSS</small></a><a href='#ladder'><b>Treat</b><small>The six-step ladder</small></a><a href='#refer'><b>Refer</b><small>Dermatology · 2WW · surgery</small></a></div>",
  quickSub:"If you read nothing else on this page, read these six cards. Every figure traces to the source cited under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Drenching night sweats are never 'just sweating'", html:"Night sweats + weight loss &gt;10% + lymphadenopathy → 2-week-wait haematology referral (NICE NG12) — do not reassure without FBC, ESR and LDH. Nocturnal absence is the single most reliable discriminator of primary hyperhidrosis: primary focal sweating does NOT occur during sleep. Ask it directly — “do you wake up drenched?” — and treat a yes as an investigation trigger, not a nuisance."},
    {tone:"amber", h:"~30% of presenting hyperhidrosis is secondary", html:"Generalised or nocturnal sweating, onset over 25, or a changed pattern → screen the causes: hyperthyroidism, diabetes, infection (TB), lymphoma, menopause, phaeochromocytoma, carcinoid, drugs, anxiety. New-onset sweating in someone with a cancer history is a red flag in itself — and a longstanding 'primary' label must never anchor away a NEW nocturnal pattern."},
    {tone:"blue", h:"The history makes the diagnosis — and the HDSS makes the case", html:"Primary focal: onset &lt;25, bilateral and symmetrical (axillae, palms, soles, craniofacial), stops in sleep, 30–50% have an affected first-degree relative (autosomal dominant, variable penetrance). Score the HDSS (1–4): ≥3 = barely tolerable or worse — the treatment-escalation and NHS botulinum-toxin eligibility threshold. Classic primary disease needs <b>NO investigations</b>."},
    {tone:"green", h:"Aluminium chloride first — technique is everything", html:"Aluminium chloride hexahydrate 20% (Driclor®, Anhydrol Forte®) to COMPLETELY dry skin at night, washed off in the morning; 2–3×/week then weekly maintenance; 4–6-week trial before stepping up. Residual moisture hydrolyses it to hydrochloric acid — the cause of the irritation that makes patients stop: manage with an emollient and 1% hydrocortisone next morning, alternate nights, or the 15% strength — don't just abandon it."},
    {tone:"purple", h:"The NHS-funded escalations most GPs under-use", html:"<b>Iontophoresis is first-line for palms and soles</b> (tap-water device, 20–30 min 3×/week then weekly — devices are FP10-prescribable in some areas; glycopyrronium can be added to the water). Botulinum toxin A is NHS-funded for axillary disease at HDSS ≥3 after aluminium chloride fails (50–100 units per axilla, lasts 4–6 months). Oral glycopyrronium 1–2 mg BD is NICE-approved (, 2021); oxybutynin 2.5–5 mg BD is the off-label alternative."},
    {tone:"teal", h:"Sympathectomy: the warning IS the counselling", html:"Endoscopic thoracic sympathectomy (T2–T4) is the irreversible last resort for refractory palmar/craniofacial disease — compensatory trunk-and-thigh sweating follows in 30–80% and is often rated worse than the original complaint. Axillary disease alone is NOT an indication (botulinum toxin is preferable). Document the counselling in the referral."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step is the one that finds the lymphoma.",
  pathway:[
    {title:"Exclude secondary and serious causes", html:"Night sweats + weight loss + lymphadenopathy → 2WW haematology with FBC/ESR/LDH. Episodic sweating + headache + palpitations + hypertension → phaeochromocytoma (plasma metanephrines). Flushing + diarrhoea + wheeze → carcinoid (24 h urine 5-HIAA). Cough ≥3 weeks + haemoptysis + risk factors → same-day CXR (TB). Sweating + rigidity + clonus + hyperthermia on a serotonergic drug → serotonin syndrome, 999.", alert:true},
    {title:"Classify — primary focal or secondary", html:"Onset age, distribution (focal bilateral vs generalised vs unilateral), the sleep question, family history, triggers, drug list (SSRIs up to 22%, SNRIs, opioids, tamoxifen, bupropion, cholinesterase inhibitors). Unilateral → think neurological (Frey's, Horner's)."},
    {title:"Quantify and examine", html:"HDSS score and quality-of-life impact (work, handshakes, clothing, mood — screen PHQ-9/GAD-7 where indicated). Examine: thyroid, lymph nodes, BP, axillary skin (erythrasma, intertrigo), neurological screen if unilateral. Minor's starch–iodine test maps distribution where needed."},
    {title:"Treat up the ladder", html:"Aluminium chloride 20% with proper technique → iontophoresis (palms/soles) → botulinum toxin (axillary, HDSS ≥3) → oral glycopyrronium () or oxybutynin → sympathectomy only for refractory palmar/craniofacial disease after full counselling. Treat the cause, not the sweat, in secondary disease."},
    {title:"Review, re-score, and stay alert", html:"4–6 weeks: technique + HDSS re-score. 3 months: oral-agent tolerability. 6 months: botulinum re-referral as effect wanes. Annually: does treatment continue (25% remit spontaneously by 40–50)? And ANY new nocturnal or constitutional symptoms → re-investigate — the old label does not cover new symptoms."}
  ],
  sections:[
    {id:"severe", nav:"Red flags", title:"Red flags — exclude secondary hyperhidrosis and serious pathology first", sub:"Generalised or nocturnal sweating in a patient over 25 demands secondary-cause exclusion before the primary label. Act on any of these urgently.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Lymphoma / haematological malignancy <span class='tw'>2WW</span>", html:"Drenching night sweats + weight loss &gt;10% + lymphadenopathy → 2-week-wait haematology referral (NICE NG12). Do not reassure without FBC, ESR and LDH. Any non-tender rubbery nodes → urgent referral.", src:"NICE NG12"},
         {tone:"red", h:"🔴 Serotonin syndrome", html:"Sweating + rigidity + clonus + hyperthermia on a serotonergic drug → stop the precipitant and admit as an emergency (up to 10% mortality untreated). Severe SSRI/SNRI/opioid-induced sweating short of that → urgent medication review."},
         {tone:"red", h:"🔴 Phaeochromocytoma", html:"Episodic sweating + palpitations + headache + hypertension = the classic triad → urgent endocrine referral; check plasma metanephrines (preferred) or 24 h urine catecholamines. Do not delay — rare (2–8 per million) but hypertensive crises carry ~10% mortality if undiagnosed at surgery. A phaeo crisis (severe hypertension + headache + palpitations + sweating) → 999."},
         {tone:"amber", h:"🟠 Carcinoid tumour", html:"Flushing + sweating + diarrhoea + wheeze → 24 h urine 5-HIAA; urgent gastroenterology or endocrine referral if suspected."},
         {tone:"amber", h:"🟠 Tuberculosis", html:"Night sweats + cough ≥3 weeks + haemoptysis + weight loss + risk factors (country of origin, contacts, HIV) → same-day chest X-ray + sputum AFB; refer respiratory/TB service."},
         {tone:"amber", h:"🟠 Severe thyrotoxicosis", html:"Sweating + weight loss + tremor + tachycardia + AF → TFTs; grossly elevated T3/T4 with cardiac instability → same-day acute medical review."}
       ]},
       {b:"why", html:"Secondary causes account for approximately 30% of hyperhidrosis presenting to primary care, and the pattern — generalised, nocturnal, new after 25, or changed — is what separates them from the benign focal disease that needs no tests at all. The 2WW rule and the phaeo triad are the two items on this card that save lives."}
     ]},

    {id:"history", nav:"History", title:"History — the primary/secondary discrimination and the HDSS", sub:"The history alone makes the diagnosis in the vast majority. Quantify impact with the Hyperhidrosis Disease Severity Scale.",
     blocks:[
       {b:"table", head:["Ask about","Primary pattern","Secondary pattern / red flag"], rows:[
         ["<b>Age of onset</b>","<b>Typically &lt;25, often adolescence</b>","Onset &gt;25, or a recent CHANGE in pattern; new sweating with a previous cancer history is a red flag in itself"],
         ["<b>Distribution</b>","<b>Focal, bilateral, symmetrical — axillae, palms, soles, craniofacial</b>","Generalised (whole-body); UNILATERAL suggests a neurological cause (Frey's syndrome, Horner's)"],
         ["<b>Timing — the sleep question</b>","<b>Does NOT occur during sleep — nocturnal absence is pathognomonic</b>","“Do you wake up drenched?” — nocturnal sweating is highly suggestive of a secondary cause; rapid-onset diurnal episodes suggest phaeochromocytoma"],
         ["<b>Family history</b>","30–50% have an affected first-degree relative (autosomal dominant, variable penetrance)","Absence in a young patient does not exclude primary, but prompts the secondary screen"],
         ["<b>Triggers</b>","Emotional stress, heat, exercise — but also unprovoked","Fever, weight loss, appetite change, thirst/polyuria (diabetes), heat intolerance, palpitations"],
         ["<b>Medications</b>","—","SSRIs (up to 22%), SNRIs, opioids, tamoxifen, bupropion, pilocarpine, cholinesterase inhibitors → reduce, switch, or (for SSRI sweating) consider low-dose mirtazapine off-label"],
         ["<b>HDSS score</b>","1 never noticeable · 2 tolerable, sometimes interferes · 3 barely tolerable, frequently interferes · 4 intolerable, always interferes","HDSS ≥3 = significant — the treatment-escalation trigger and the NHS botulinum-toxin eligibility threshold"],
         ["<b>Quality of life</b>","Occupation (handshakes, paperwork, keyboards), social life, relationships, clothing restrictions","Anxiety, depression and social phobia are common — screen with PHQ-9/GAD-7 where indicated"]
       ]},
       {b:"why", html:"The HDSS is the validated 4-point scale used in trials and NHS funding decisions — specifies HDSS ≥3 for axillary botulinum toxin — and <b>nocturnal absence is the single most reliable clinical discriminator</b>: its loss virtually excludes the primary diagnosis and mandates investigation."}
     ]},

    {id:"classify", nav:"Classify", title:"Classification — which hyperhidrosis is this?", sub:"Classification determines investigation, treatment pathway and referral destination. Primary focal is a diagnosis of exclusion once the red flags are cleared.",
     blocks:[
       {b:"table", head:["Type","Pattern","Management route"], rows:[
         ["<b>Primary axillary</b> — the most common","<b>Bilateral, symmetrical, impairing daily activities</b>","Aluminium chloride first; HDSS ≥3 qualifies for NHS botulinum toxin () — most referrals are this type"],
         ["<b>Primary palmoplantar</b>","<b>Palms ± soles — handshakes, grip, keyboards, paperwork</b>","Iontophoresis is first-line for hands and feet; palmar botulinum toxin is fundable but painful (nerve block or ice anaesthesia)"],
         ["<b>Primary craniofacial</b>","<b>Face/scalp, often with blushing and social phobia</b>","Dermatology referral; beta-blockers may help the blushing component. Exclude Frey's syndrome (unilateral gustatory sweating after parotid surgery)"],
         ["<b>Secondary endocrine</b>","Thyrotoxicosis, diabetes (autonomic neuropathy, nocturnal hypoglycaemia), phaeochromocytoma, carcinoid, acromegaly","Investigate and treat the cause — symptomatic treatment without addressing it is inappropriate. Menopausal flushes are thermoregulatory (oestrogen withdrawal), not true eccrine hyperhidrosis → the HRT pathway"],
         ["<b>Secondary drug-induced</b>","SSRIs (up to 22%), SNRIs, opioids, tamoxifen, bupropion, cholinesterase inhibitors","Reduce dose, switch agent, or add low-dose mirtazapine (off-label) for SSRI-induced sweating"],
         ["<b>Secondary neurological</b>","Spinal cord injury, stroke, Parkinson's, autonomic neuropathy; <b>compensatory hyperhidrosis post-sympathectomy (bilateral trunk/thighs)</b>","Neurology referral; compensatory disease has limited treatment options — which is the argument against creating it"]
       ]}
     ]},

    {id:"exam", nav:"Examination", title:"Examination — confirmation plus the secondary screen", sub:"For primary disease the examination confirms; where there is any doubt, the secondary screen is mandatory.",
     blocks:[
       {b:"table", head:["What","How / finding","Means"], rows:[
         ["<b>General inspection</b>","Visible sweating at rest; sweat-stained or deliberately dark/loose clothing; anxiety level","Coping behaviours are severity evidence"],
         ["<b>Minor's starch–iodine test</b>","<b>Paint iodine, dry, dust starch — sweat turns blue-black</b>","Maps distribution and severity objectively; guides botulinum injection patterns. Not routine in primary care but improvisable"],
         ["<b>Thyroid</b>","Goitre, bruit, tachycardia, fine tremor, lid lag, exophthalmos; pulse rate and rhythm (AF in new hyperthyroidism)","Thyrotoxicosis screen"],
         ["<b>Lymph nodes</b>","<b>Cervical, axillary, inguinal chains</b>","Generalised lymphadenopathy + night sweats = haematological malignancy until proven otherwise → 2WW"],
         ["<b>Blood pressure</b>","Both arms; labile or persistent hypertension in a young patient → phaeochromocytoma concern; postural drop → autonomic neuropathy","Directs the biochemical work-up"],
         ["<b>Axillary skin</b>","Erythrasma (coral-red under Wood's lamp), intertrigo, fungal infection; bromhidrosis (bacterial odour) — distinguish from hyperhidrosis itself","Erythrasma thrives in the warm moist axilla — topical fusidic acid or single-dose azithromycin 1 g; treating the hyperhidrosis cuts recurrence"],
         ["<b>Neurological screen</b>","If unilateral: Horner's (ptosis, miosis, ipsilateral facial anhidrosis), peripheral neuropathy, cord signs; ask about parotid surgery (Frey's)","Localises the secondary neurological causes"]
       ]}
     ]},

    {id:"workup", nav:"Work-up", title:"Investigations — targeted by suspicion, or none at all", sub:"Classic primary focal disease (young, bilateral, focal, silent at night, family history) needs NO investigations. Over-investigating medicalises a benign condition and delays treatment.",
     blocks:[
       {b:"table", head:["Test","When","Interpretation"], rows:[
         ["<b>TFTs (TSH + free T4)</b>","Thyrotoxicosis features","<b>TSH &lt;0.1 mU/L with raised free T4 confirms hyperthyroidism</b> → endocrine or antithyroid therapy per local protocol"],
         ["<b>FBC + ESR/CRP</b>","<b>Night sweats + constitutional symptoms</b>","Lymphocytosis or normochromic anaemia + raised ESR → lymphoma; neutrophilia → infection; eosinophilia → parasitic/allergic"],
         ["<b>Fasting glucose / HbA1c</b>","Diabetes screen","Autonomic neuropathy causes gustatory sweating; HbA1c ≥48 mmol/mol confirms diabetes; nocturnal hypoglycaemic sweating on insulin can masquerade as primary disease"],
         ["<b>LFTs + GGT</b>","Alcohol-related sweating; hepatic night sweats","Withdrawal and autonomic dysregulation"],
         ["<b>Plasma metanephrines</b> (or 24 h urine catecholamines)","<b>Episodic sweating + headache + palpitations + hypertension</b>","Metanephrines: 96% sensitivity (vs 86%) — preferred. Positive → urgent endocrine + adrenal CT. False positives: tricyclics, labetalol, heavy caffeine"],
         ["<b>Chest X-ray</b>","<b>TB or lymphoma suspected — same-day if urgent</b>","Mediastinal widening (lymphoma), upper-lobe infiltrates/cavities (TB), hilar nodes"],
         ["<b>24 h urine 5-HIAA</b>","Carcinoid features","&gt;50 mg/24 h strongly suggestive; avoid serotonin-rich foods (banana, avocado, pineapple) for 48 h before collection"]
       ]},
       {b:"cards", items:[
         {tone:"purple", h:"NG12 criteria that surface here <span class='tw'>2WW</span>", html:"Primary focal hyperhidrosis has no NICE NG12 criterion, and this page does not invent one — the cancer risk lives entirely in the secondary-sweating work-up:<br>• Unexplained lymphadenopathy or splenomegaly → 2-week-wait referral for lymphoma (adults); night sweats, fever, weight loss, pruritus or alcohol-induced node pain strengthen the case.<br>• <b>Unexplained night sweats with constitutional symptoms → urgent FBC</b> (leukaemia assessment within 48 hours where features suggest it).<br>• <b>Cough ≥3 weeks with weight loss or haemoptysis → urgent chest X-ray</b> — the TB/lung-cancer overlap route.<br>A longstanding primary diagnosis never covers NEW nocturnal sweating — re-run this table, not the treatment ladder.", src:"NICE NG12 (updated May 2025) · house rule"}
       ]}
     ]},

    {id:"ladder", nav:"Treat", title:"The treatment ladder — six steps, least invasive first", sub:"Escalate only after an adequate trial of each step. All treatments manage eccrine output; none are curative. Verify doses against the BNF and local formulary.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Step 1", title:"Aluminium chloride hexahydrate 20% (Driclor®, Anhydrol Forte®)", when:"first-line — best for axillae", fromLabel:"4–6-week trial",
          html:"Apply to COMPLETELY dry skin at night, wash off in the morning; 2–3×/week initially, then once-weekly maintenance. Residual moisture hydrolyses it to hydrochloric acid — the cause of the irritation: 1% hydrocortisone next morning, alternate nights, or the 15% strength. Less effective for palms/soles. <b>Prescribe it — standard commercial antiperspirants are insufficient.</b>"},
         {step:"Step 2", title:"Iontophoresis", when:"first-line for palms and soles", fromLabel:"device-based",
          html:"Tap-water iontophoresis (e.g. Hidrex®, Drionic®): hands/feet in water trays at 15–20 mA, 20–30 minutes, 3×/week then weekly maintenance. Devices are FP10-prescribable in some ICBs — check the local formulary. Mechanism: keratin plugging of sweat ducts. Glycopyrronium solution can be added to the water for enhanced effect."},
         {step:"Step 3", title:"Botulinum toxin A — axillary (NHS-funded)", when:"HDSS ≥3 + aluminium chloride failed", fromLabel:"via dermatology",
          html:"OnabotulinumtoxinA 50–100 units per axilla, intradermal grid guided by Minor's test; lasts 4–6 months → re-referral at 6 months. Palmar botulinum toxin (discretionary funding) is highly effective but painful — nerve block or topical/ice anaesthesia."},
         {step:"Step 4", title:"Oral glycopyrronium bromide 1–2 mg BD (, 2021)", when:"NICE-approved for primary axillary disease", fromLabel:"the newest formulary addition",
          html:"Anticholinergic — dry mouth, blurred vision, urinary retention, constipation limit tolerability. Contraindicated: glaucoma, BPH, myasthenia gravis, intestinal obstruction. Topical glycopyrronium (Qbrexza®-type wipes) is a licensed axillary alternative where aluminium chloride is not tolerated."},
         {step:"Step 5", title:"Oxybutynin 2.5–5 mg BD (off-label; propantheline is an older alternative)", when:"generalised or refractory disease", fromLabel:"good RCT evidence",
          html:"Start 2.5 mg OD and titrate to BD; extended-release reduces peak side effects. Caution: cognitive side effects in the elderly, and heat intolerance — reduced sweating impairs cooling in hot weather."},
         {step:"Step 6", title:"Endoscopic thoracic sympathectomy (ETS)", when:"refractory palmar/craniofacial disease only — last resort", fromLabel:"vascular/thoracic surgery",
          html:"T2–T4 sympathetic chain ablation — irreversible. Compensatory trunk/thigh hyperhidrosis in 30–80% (30–90% across reviews by level), often rated as bad as or worse than the original complaint. Axillary disease alone is NOT an indication — botulinum toxin is preferable. Document every prior treatment and the compensatory-sweating counselling in the referral."}
       ]},
       {b:"warn", html:"<b>Counsel every oral-anticholinergic patient on heat intolerance</b> — reduced sweating impairs thermoregulation: caution in hot climates and the elderly. <b>Treat the cause, not the sweat, in secondary disease.</b>"},
       {b:"say", html:"This is a recognised medical condition, not a hygiene problem — and it's treatable. The prescription antiperspirant goes on bone-dry skin at bedtime and washes off in the morning; some stinging is common and manageable, so don't just stop. If that's not enough there's a proper ladder — a water-bath treatment for hands and feet, Botox injections for the armpits on the NHS, and tablets — and we'll climb it together."}
     ]},

    {id:"lifestyle", nav:"Self-care", title:"Lifestyle, self-management and psychological support", sub:"The average patient has suffered for 7–9 years before asking — acknowledge the impact explicitly.",
     blocks:[
       {b:"table", head:["Measure","Detail","Why"], rows:[
         ["<b>Antiperspirant vs deodorant education</b>","Antiperspirants (aluminium salts) reduce sweating; deodorants only mask odour — and commercial products are insufficient: prescribe Driclor 20%","The commonest correctable misunderstanding"],
         ["<b>Axillary hair removal</b>","Shaving increases aluminium-chloride contact and efficacy and reduces the bacterial colonisation behind bromhidrosis — recommend before starting treatment","Cheap, effective, rarely said"],
         ["<b>Clothing</b>","Natural fibres (cotton, bamboo, merino), moisture-wicking layers for exercise, dark or patterned fabrics, dress shields","Conceals staining and reduces the social-anxiety loop"],
         ["<b>Dietary triggers</b>","Spicy food (capsaicin), hot drinks, alcohol, caffeine; gustatory sweating is worsened by spicy, sour and salty food","Reduce where personally implicated"],
         ["<b>Stress management and CBT</b>","Emotional sweating amplifies primary disease via sympathetic activation; CBT reduces frequency and severity by addressing catastrophising and avoidance; NHS Talking Therapies self-referral; mindfulness cuts stress-triggered episodes ~20–30% in observational data","<b>Social phobia affects up to 25% of palmoplantar patients</b>"],
         ["<b>Occupational adjustments</b>","HDSS ≥3 impacts employment — the Equality Act 2010 may apply where daily activities are substantially affected; occupational health referral where appropriate","Real-world severity deserves real-world adjustments"],
         ["<b>Skin hygiene</b>","Wash 2× daily in hot weather; antibacterial soap reduces Corynebacterium (erythrasma risk); antifungal powder to feet/groin if intertriginous; dry fully before aluminium chloride","Prevents the infective complications"],
         ["<b>Peer support</b>","International Hyperhidrosis Society (SweatHelp.org) — validated information and a treatment finder","<b>Normalising the condition reduces shame and improves adherence</b>"]
       ]},
       {b:"why", html:"Hyperhidrosis scores in the 'very large effect' DLQI band — a bigger quality-of-life hit than many chronic diseases including severe acne — and the average delay from onset to consultation is 7–9 years, driven by embarrassment and not knowing treatment exists. Saying 'this is a recognised, treatable condition' is itself an intervention."}
     ]},

    {id:"monitor", nav:"Monitor", title:"Follow-up, monitoring and safety-netting", sub:"Re-score the HDSS at every step — it documents response and justifies funded treatment.",
     blocks:[
       {b:"table", head:["When","What","Action"], rows:[
         ["<b>4–6 weeks</b>","Aluminium chloride response and technique (dry skin? night application?); HDSS re-score","Partial response → fix technique/frequency before escalating; intolerance → 15% strength or topical glycopyrronium wipes"],
         ["<b>3 months</b>","Oral anticholinergic efficacy and tolerability; dose titration; iontophoresis adherence and technique","Re-check the secondary screen if the picture is evolving"],
         ["<b>6 months</b>","Post-botulinum: effect typically wanes at 4–6 months → re-refer for repeat injection (NHS-funded); ongoing HDSS scoring","Progressively shortening effect → consider neutralising-antibody formation"],
         ["<b>Annually</b>","Still needed? Primary hyperhidrosis remits spontaneously in ~25% by age 40–50 (falling sympathetic tone)","Also re-screen the drug list for new induced causes, and revisit ambiguous histories"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"📞 999", html:"Phaeochromocytoma crisis — severe hypertension + headache + palpitations + sweating. Serotonin syndrome — new serotonergic drug + sweating + rigidity + clonus + hyperthermia."},
         {tone:"amber", h:"🟠 Urgent GP review", html:"NEW nocturnal sweating in a patient labelled primary · new constitutional symptoms (weight loss, fever, lymphadenopathy) at any point → re-run the secondary work-up — the old diagnosis must not anchor away the new disease."},
         {tone:"blue", h:"🩺 On re-presentation after successful treatment", html:"Consider: aluminium-chloride tolerance (rare), a secondary cause emerging de novo, or adherence — re-evaluate before restarting the ladder."},
         {tone:"cream", h:"💬 Safety-net scripts", html:"“Drenching night sweats with weight loss, fevers or lumps — come back, we'll investigate.” · “The tablets reduce sweating all over — take care in hot weather.” · “If the antiperspirant stings, use it less often with a moisturiser — don't just stop.” · “If the sweating is affecting your mood or social life, tell us — there are more options.”"}
       ]}
     ]},

    {id:"loop", nav:"Not responding?", title:"Not controlled? Re-check before escalating", sub:"Confirm the type and an adequate trial before referral.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"1 \u00b7 Secondary cause", html:"Generalised/night sweats or systemic features \u2192 investigate (thyroid, infection, malignancy)."},
         {tone:"blue", h:"2 \u00b7 Technique", html:"Antiperspirant applied correctly (dry skin, at night)?"},
         {tone:"blue", h:"3 \u00b7 Step up", html:"Topical anticholinergic / oral anticholinergic trialled?"},
         {tone:"blue", h:"4 \u00b7 Tolerability", html:"Side effects limiting oral therapy?"},
         {tone:"blue", h:"5 \u00b7 Refer", html:"Refractory focal disease \u2192 iontophoresis / botulinum toxin / dermatology."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — who, when, how urgently", sub:"Most primary hyperhidrosis is managed entirely in primary care. These are the exits.",
     blocks:[
       {b:"cards", items:[
         {tone:"purple", h:"Urgent suspected cancer <span class='tw'>2WW</span> · NICE NG12", html:"Night sweats + weight loss + lymphadenopathy (or any unexplained lymphadenopathy/splenomegaly) → 2-week-wait haematology for lymphoma, with FBC, ESR and LDH done — never reassurance without them.", src:"NICE NG12 (updated May 2025)"},
         {tone:"red", h:"Endocrine (urgent)", html:"Positive phaeochromocytoma biochemistry · suspected carcinoid · uncontrolled thyrotoxicosis · acromegaly."},
         {tone:"amber", h:"Dermatology", html:"Primary axillary disease at HDSS ≥3 failing aluminium chloride → NHS botulinum toxin () — allow a 6–8-week aluminium-chloride trial before referring. Refractory palmoplantar disease → iontophoresis assessment ± botulinum toxin. Skin complications."},
         {tone:"blue", h:"Menopause clinic / gynaecology", html:"Menopausal vasomotor sweating impairing quality of life → HRT discussion; where HRT is contraindicated (e.g. breast cancer): CBT, venlafaxine (off-label, RCT evidence), clonidine or gabapentin. See the <a href='hrt-prescribing.html'>HRT protocol</a>."},
         {tone:"blue", h:"Neurology", html:"Unilateral hyperhidrosis (Horner's, cord pathology) · compensatory post-sympathectomy sweating · unexplained autonomic neuropathy."},
         {tone:"plain", h:"Vascular / thoracic surgery — last resort", html:"ETS only for refractory palmar or craniofacial disease after everything else, with the 30–80% compensatory-sweating counselling documented. Axillary disease alone is not an indication."},
         {tone:"plain", h:"Psychology / NHS Talking Therapies", html:"HDSS ≥3 with anxiety, depression or social phobia as driver or consequence — CBT has evidence for hyperhidrosis-related anxiety; self-referral available in most areas."},
         {tone:"green", h:"GP manages", html:"The whole primary-care ladder: aluminium chloride with technique coaching, iontophoresis prescription, oral glycopyrronium () or oxybutynin, drug-cause switches, the HDSS record that unlocks funded treatment, and the annual review."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only — the Casebook keeps the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 19-year-old apprentice electrician attends with his mother, mortified: since school he has had soaking palms and axillae — he avoids handshakes, wears only black, and is about to fail a wiring assessment because tools slip. His father 'was the same'. He sleeps dry. He asks whether 'that operation' would fix it, having read about sympathectomy online."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Asks the <b>sleep question</b> and confirms the primary pattern (onset &lt;25, bilateral focal, family history) so <b>no investigations</b>; scores the <b>HDSS (4)</b> and acknowledges the psychosocial impact explicitly; teaches <b>aluminium chloride technique</b> (bone-dry skin, at night, irritation management) and plans <b>iontophoresis for the palms</b>; counsels honestly on <b>sympathectomy's 30–80% compensatory sweating</b> and reframes it as a last resort; flags the <b> botulinum route</b> if the axillae stay HDSS ≥3 after the trial; addresses the exam pressure (occupational adjustments) and offers <b>Talking Therapies</b>; safety-nets <b>new night sweats or systemic symptoms</b>."}
     ]}]},
