  stemSub:"One page for the whole condition. Apply Truelove and Witts to every flare — acute severe colitis is a medical emergency, not a prescription; send stool culture and <i>C. difficile</i> testing urgently, preferably before steroids — but never delay admission or IV corticosteroid in acute severe colitis; treat by disease extent, topical before oral; use corticosteroids to induce remission and never to maintain it; continue 5-ASA maintenance for most patients unless the IBD team advises otherwise; run the thiopurine and 5-ASA monitoring under the current shared-care protocol; and make sure surveillance colonoscopy is actually happening. NICE NG130 · NG199 · CG118 · NG12 · BSG adult IBD guideline 2025 · NHS Greater Manchester pathways.",
  guideline:"NICE NG130 (2019) · NICE CG118 (2011, updated 2022) · NICE NG199 (2021) · NICE NG12 (updated April 2026) · BSG adult IBD guideline (2025) · ECCO UC medical treatment guideline (2022, international) · NHS Greater Manchester IBD pathways",

  lead:"<div class='mg-layers'><a href='#severe'><b>Grade it first</b><small>Truelove &amp; Witts</small></a><a href='#infection'><b>Exclude infection</b><small>Stool + C. difficile</small></a><a href='#ladder'><b>Treat by extent</b><small>Topical before oral</small></a><a href='#surveillance'><b>Protect the colon</b><small>5-ASA + surveillance</small></a></div>",
  quickSub:"If you read nothing else on this page, read these six cards. Every figure traces to the source cited under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Acute severe colitis is an admission, not a prescription", html:"Truelove and Witts: ≥6 bloody stools a day PLUS any one systemic feature — temperature &gt;37.8°C, HR &gt;90, Hb &lt;105 g/L, ESR &gt;30 mm/h — is acute severe ulcerative colitis and needs same-day admission (CRP is a useful additional severity and prognostic marker, but the original criteria use ESR). In hospital the receiving trust's ASUC protocol applies. Suspected toxic megacolon — abdominal distension with systemic toxicity, worsening pain, ileus or reduced bowel sounds → 999; avoid antimotility agents and opioids and alert gastroenterology and colorectal surgery. Peritonism, free gas, or massive rectal bleeding with instability → 999. Managing severe UC in the community is inappropriate care."},
    {tone:"amber", h:"Send stool before you reach for prednisolone", html:"Send stool culture and <i>C. difficile</i> testing (the local laboratory algorithm, usually GDH/toxin with PCR arbitration) urgently in every flare, preferably before corticosteroids — but do not delay admission or IV corticosteroid in ASUC while awaiting results. Confirmed <i>C. difficile</i> infection: <b>oral vancomycin 125 mg QDS for 10 days</b> (NICE NG199), stop the precipitating antibiotic where possible, review PPIs and laxatives, avoid antimotility agents, assess severity and seek microbiology advice; fidaxomicin for specified recurrences per NICE and local Greater Manchester policy. Ask about travel (<i>Campylobacter</i>, <i>Salmonella</i>, amoebic dysentery), recent antibiotics or hospital contact, and food-poisoning exposure. <b>Not all bloody diarrhoea in a patient with UC is a UC flare</b>, and treating an infective colitis with immunosuppression is dangerous."},
    {tone:"blue", h:"Extent decides the route; severity decides the drug", html:"Proctitis → topical 5-ASA first-line (for example a mesalazine suppository). Proctosigmoiditis or left-sided disease → topical 5-ASA first-line, with oral 5-ASA added or substituted depending on response and preference. Extensive colitis → topical plus high-dose oral 5-ASA. Moderate disease needing systemic treatment → oral corticosteroid with 5-ASA continued. Reassess at about 4 weeks for most 5-ASA induction steps (NICE NG130). Prescribe the formulation-specific licensed or guideline dose; do not interchange gram-for-gram between preparations. Ask when the last colonoscopy was: if you do not know the extent, you cannot pick the route."},
    {tone:"cream", h:"Steroids induce remission — they never maintain it", html:"A typical induction regimen is prednisolone 40 mg once daily, followed by a planned taper according to response and the local IBD protocol; NICE describes corticosteroid courses as time-limited, normally 4–8 weeks depending on the corticosteroid. Do not continue or repeatedly escalate corticosteroids without specialist review. <b>Budesonide MMX</b> is an option only for selected mild-to-moderate disease (check product-specific duration, contraindications and CYP3A4 interactions) — not a general substitute for prednisolone in moderate–severe disease, and not for acute severe colitis. Never stop prednisolone abruptly after more than 3 weeks: adrenal suppression. Two or more steroid courses in 12 months, or inability to wean below 10 mg without flaring, is steroid dependence — that is a referral, not another course."},
    {tone:"green", h:"5-ASA maintenance — for most, not automatically for life", html:"Continue 5-ASA for most patients whose remission was induced with 5-ASA or corticosteroids, unless the IBD team recommends otherwise; BSG 2025 allows discontinuation after shared decision-making in prolonged remission with mucosal healing on immunomodulators or advanced therapies. Use the lowest effective maintenance dose. Its principal indication is prevention of inflammatory relapse; 5-ASA may have a chemopreventive effect. Discuss adherence, formulation and adverse effects. If headache or nausea is the problem, switch formulation (Pentasa, Asacol, Mezavant have different release and side-effect profiles) rather than stopping."},
    {tone:"amber", h:"Two things primary care must not let slip", html:"<b>Renal function on any 5-ASA</b> — before starting, at about 3 months, then annually (more often with renal impairment or other risk factors); investigate any unexplained creatinine rise or eGFR decline and discuss with gastroenterology, stopping mesalazine if renal toxicity is suspected. And surveillance colonoscopy: check the patient is actually enrolled and being invited — baseline at 8 years after symptom onset where the local service follows BSG 2025, 10 years under NICE CG118."}
  ],
  pathwaySub:"The whole flare consultation in five moves. The red step comes before any prescription.",
  pathway:[
    {title:"Grade the flare with Truelove and Witts", html:"Count bloody stools per day, day and night separately, then take the temperature, pulse, blood pressure and weight. ≥6 bloody stools a day plus any one of temperature &gt;37.8°C, HR &gt;90, Hb &lt;105 g/L or ESR &gt;30 mm/h is acute severe colitis — same-day admission (CRP adds prognostic information but is not part of the original criteria). Distension, peritonism or instability is a 999 call.", alert:true},
    {title:"Exclude infection before immunosuppressing", html:"Stool culture plus C. difficile testing (local algorithm) urgently in every flare, preferably before steroids — infection testing and treatment run in parallel and never delay admission in ASUC. Ask about travel, recent antibiotics, hospital contact and food poisoning. Review the drug list: avoid initiating NSAIDs where alternatives are suitable; do not stop low-dose aspirin for secondary cardiovascular prevention without assessing the indication and bleeding risk."},
    {title:"Establish extent and confirm true inflammation", html:"Find the disease extent from the last colonoscopy — proctitis, left-sided or extensive — because it decides topical versus systemic therapy. Send FBC, CRP, U&amp;E/eGFR, LFTs with albumin, and ferritin/iron studies if anaemia or recurrent disease (ESR not essential if CRP is available and the patient is not severely unwell); check pregnancy status where relevant before escalation; blood cultures and urgent sepsis assessment if febrile or systemically unwell. Use faecal calprotectin only where the question is flare versus functional symptoms — never let calprotectin or FIT delay admission."},
    {title:"Treat by extent, then by severity", html:"Mild: optimise topical 5-ASA and make sure the oral dose is the formulation-specific active-disease dose. Moderate: prednisolone 40 mg daily with the taper planned at the point of prescribing, mesalazine continued alongside. Severe: admit. No antimotility drugs and no opioids in an active flare."},
    {title:"Review on the clock, then step down and protect", html:"Review at 48–72 hours by phone and again at 5–7 days: is stool frequency falling, is the C. difficile result back? No better at 48–72 hours means urgent gastroenterology, not a bigger dose — and any worsening, inability to maintain oral intake, dehydration, systemic symptoms, increasing bleeding, significant anaemia, hypoalbuminaemia or uncertainty about severity warrants same-day specialist discussion. Calprotectin where useful to support response (endoscopy remains the reference for mucosal healing), then 5-ASA maintenance for most patients, drug monitoring and surveillance."}
  ],
  sections:[
    {id:"severe", nav:"Red flags", title:"The emergencies — toxic megacolon, perforation, haemorrhage and acute severe colitis", sub:"Four presentations that must leave your room by ambulance or on a same-day admission call. Everything else on this page can wait until they are excluded.",
     blocks:[
       {b:"warn", html:"Grade the flare before you treat it. A patient with ≥6 bloody stools a day and one systemic feature needs a hospital bed and intravenous steroid, and every hour spent trying oral prednisolone in the community is an hour of untreated severe colitis. Equally: never give loperamide, codeine or an antispasmodic in an active flare — antimotility drugs can precipitate colonic dilatation and toxic megacolon."},
       {b:"cards", cols:2, items:[
         {tone:"red", h:"Toxic megacolon → 999", html:"Suspect toxic megacolon in severe colitis with abdominal distension, systemic toxicity, worsening pain, ileus or reduced bowel sounds. The traditional definition is colonic dilatation, usually &gt;6 cm, with systemic toxicity; fever and marked tachycardia indicate severe toxicity but are not mandatory criteria, and peritonism may indicate perforation or another surgical complication. Hospital assessment includes urgent abdominal imaging and surgical review — a transverse-colon diameter &gt;6 cm supports the diagnosis, but it is clinical and radiological rather than dependent on every listed sign. <b>GP action: 999 emergency transfer/admission; avoid antimotility agents and opioids; alert gastroenterology and colorectal surgery.</b> Inpatient management follows local surgical, gastroenterology and antimicrobial protocols. Do not treat a suspected toxic megacolon orally."},
         {tone:"red", h:"Perforation → 999", html:"Sudden severe abdominal pain with peritonitis, absent bowel sounds and free gas on CXR or AXR. 999 — urgent laparotomy. A rigid, silent abdomen in a patient with colitis is a surgical emergency and needs no further tests in primary care."},
         {tone:"red", h:"Massive rectal haemorrhage → 999", html:"Heavy rectal bleeding with haemodynamic instability — HR &gt;100, BP &lt;90/60, rapidly falling haemoglobin. 999 — emergency transfer; resuscitation, transfusion and any surgical decision are made by the hospital team."},
         {tone:"red", h:"Acute severe UC → same-day admission", html:"≥6 bloody stools a day PLUS at least one of: HR &gt;90 · temperature &gt;37.8°C · Hb &lt;105 g/L · ESR &gt;30 mm/h (CRP is a useful additional marker but not part of the original criteria). Same-day gastroenterology or admission (BSG 2025) for IV corticosteroids under the receiving trust's ASUC protocol — typical regimens include hydrocortisone 100 mg IV six-hourly or methylprednisolone 30 mg IV twice daily — with flexible sigmoidoscopy and assessment of the likelihood of surgery. Do not delay admission while awaiting stool results. Telephone the on-call gastroenterologist directly and arrange a direct admission — for most patients that is faster than sending them to A&amp;E. A severe flare already on oral steroids that has not responded in 3 days is steroid-refractory and needs the same call."},
         {tone:"amber", h:"<i>C. difficile</i> superinfection", html:"A steroid-dependent or immunosuppressed patient with fever, pain and worsening diarrhoea, especially after antibiotics or hospital contact. Urgent stool for the local laboratory's <i>C. difficile</i> testing algorithm (usually GDH/toxin with PCR arbitration) — a positive PCR alone may represent colonisation, so interpret with symptoms and laboratory reporting. Avoid antimotility agents. Confirmed infection: oral vancomycin 125 mg QDS for 10 days (NICE NG199), stop the precipitating antibiotic where possible, review PPIs and laxatives, assess for severe or life-threatening infection, and seek prompt microbiology and gastroenterology advice; fidaxomicin for specified recurrent episodes per NICE and local Greater Manchester policy."},
         {tone:"amber", h:"New symptoms in long-standing colitis — think cancer", html:"New or changing symptoms, unexplained weight loss, iron-deficiency anaemia, abdominal or rectal mass, or a change in the established disease pattern should prompt assessment for colorectal cancer and review of surveillance status — known UC does not exempt the patient from NICE NG12. Long-standing extensive colitis carries an elevated cancer risk; see <a href='#refer'>Refer</a> for the NG12 thresholds and <a href='#surveillance'>Surveillance</a> for the programme."},
         {tone:"red", h:"New immunosuppressant plus fever", html:"Fever in a patient recently started on azathioprine, mercaptopurine or a biologic → urgent FBC and same-day review: neutropenic sepsis and opportunistic infection, including CMV colitis, both present this way. Do not attribute fever in an immunosuppressed patient to the colitis itself."},
         {tone:"amber", h:"Severe extraintestinal disease", html:"Pyoderma gangrenosum → same-day dermatology (and it must not be surgically debrided). Anterior uveitis — a painful red eye with photophobia → same-day ophthalmology; it is vision-threatening."}
       ]}
     ]},
    {id:"confirm", nav:"Grade the flare", title:"Severity classification — Truelove and Witts", sub:"Required in every flare consultation. The grade decides the setting of care, and getting it wrong causes harm in both directions: severe colitis treated at home, or a mild flare sent to hospital.",
     blocks:[
       {b:"cards", items:[
         {tone:"green", h:"Mild flare", html:"Fewer than 4 (&lt;4) bloody stools a day and no systemic disturbance: HR &lt;90, temperature &lt;37.8°C (some series use &lt;37.5°C), Hb &gt;115 g/L, ESR &lt;20 mm/h, CRP &lt;30 mg/L. Abdominal pain mild or absent. <b>Manage in the community</b>: rectal 5-ASA — a <b>mesalazine 1 g suppository nocte</b> for proctitis, an enema for left-sided disease — plus an oral 5-ASA at the formulation-specific active-disease dose where indicated. <b>Review within 2–4 weeks</b> (NICE reassesses most 5-ASA induction steps at about 4 weeks)."},
         {tone:"amber", h:"Moderate flare", html:"4–6 bloody stools a day with minimal systemic disturbance: HR &lt;90, temperature &lt;37.8°C, Hb &gt;105 g/L, ESR &lt;30 mm/h. Can be managed in the community with prednisolone 40 mg daily plus optimised 5-ASA, with gastroenterology advice within 48–72 hours — only where there is a clear local pathway and reliable follow-up. Review within 5–7 days. Failure to improve at 48–72 hours is not the only referral threshold: any worsening, inability to maintain oral intake, dehydration, systemic symptoms, increasing bleeding, significant anaemia, hypoalbuminaemia or uncertainty about severity warrants same-day specialist discussion."},
         {tone:"red", h:"Severe flare — Truelove and Witts severe", html:"≥6 bloody stools a day AND at least one of: HR &gt;90 · temperature &gt;37.8°C · Hb &lt;105 g/L · ESR &gt;30 mm/h (CRP is used in prognostic criteria but is not part of the original Truelove and Witts definition). Same-day hospital admission for IV corticosteroids under the receiving trust's ASUC protocol, with abdominal imaging to exclude toxic megacolon. The Oxford criteria are then applied on day 3 of IV steroid to predict colectomy risk."}
       ]},
       {b:"dl", rows:[
         ["Why these criteria","Truelove and Witts (1955) remain the most practically validated bedside tool for UC severity — the Oxford trial that produced them was the first RCT to show that corticosteroids reduce mortality in ulcerative colitis, and the classification it generated still underpins management more than 60 years later. Correct grading prevents both under-treatment of severe colitis and needless admission of mild flares."],
         ["The Oxford day-3 criteria","On day 3 of IV hydrocortisone: a stool frequency &gt;8/day, or CRP &gt;45 mg/L with a stool frequency of 3–8/day, predicts an approximately 85% probability of requiring colectomy. This identifies steroid-refractory patients who need rescue therapy before emergency surgery. It is an inpatient calculation, but knowing it explains why the hospital acts on day 3 rather than waiting."],
         ["Extent as well as severity","Proctitis (rectum only) · left-sided colitis (up to the splenic flexure) · extensive colitis or pancolitis (beyond the left flexure). Extent comes from the last colonoscopy and determines the route of therapy: topical first-line for proctitis, combined topical plus oral for left-sided, oral or systemic for extensive."],
         ["Flare pattern","Two or more flares a year needing steroids, or inability to reduce prednisolone below 10 mg without flaring, defines steroid dependence — the trigger for escalation to a thiopurine or a biologic. That conversation belongs with the gastroenterologist now, not deferred indefinitely in primary care; steroid-dependent UC has a materially worse prognosis and quality of life, and earlier biologic escalation gives higher remission rates and fewer admissions."]
       ]}
     ]},
    {id:"infection", nav:"Exclude infection", title:"Is this a flare, an infection, or neither?", sub:"The single most consequential safety step in a UC flare consultation: immunosuppressing an infective colitis makes it worse.",
     blocks:[
       {b:"cards", items:[
         {tone:"blue", h:"Stool — every flare, preferably before steroids", html:"Stool culture for bacterial pathogens (<i>Salmonella</i>, <i>Shigella</i>, <i>Campylobacter</i>, <i>E. coli</i> O157) according to local laboratory policy, plus <i>Clostridioides difficile</i> testing by the local laboratory algorithm (usually GDH/toxin with PCR arbitration), urgently in every flare and preferably before starting steroids. Do not delay hospital admission or IV corticosteroid in ASUC while awaiting results — testing and treatment run in parallel. Ova, cysts and parasites if there has been travel."},
         {tone:"blue", h:"Faecal calprotectin", html:"Use faecal calprotectin as an adjunct when the diagnosis of active inflammation is uncertain, particularly to distinguish IBD activity from a functional disorder. Interpret according to the local laboratory pathway — broad cut-offs are not universal, and results are affected by assay, age, NSAID use, infection, colorectal neoplasia, gastrointestinal bleeding and recent endoscopy. Calprotectin is a <b>calcium- and zinc-binding neutrophil protein</b> released into the stool when the colon is inflamed. It is not a substitute for clinical assessment, stool infection testing or urgent referral, and should not delay admission in suspected ASUC. A falling value is supportive, but a single value does not confirm mucosal healing — endoscopic assessment remains the reference."},
         {tone:"blue", h:"Travel and food history", html:"Recent foreign travel raises <i>Campylobacter</i>, <i>Salmonella</i> and amoebic dysentery; bloody diarrhoea within hours of a meal suggests <i>E. coli</i> O157 or <i>Salmonella</i>. Discuss before starting oral steroids in the community until tropical infection is excluded — but in ASUC do not delay admission."},
         {tone:"blue", h:"Recent antibiotics or hospital stay", html:"<i>C. difficile</i> — send stool for the local testing algorithm (PCR positivity alone may be colonisation). Coexisting <i>C. difficile</i> and a UC flare: oral vancomycin per NICE NG199 with prompt microbiology and gastroenterology advice."},
         {tone:"cream", h:"Medication review", html:"NSAIDs (ibuprofen, naproxen, diclofenac) can exacerbate IBD in some patients, although the evidence is inconsistent. Avoid initiating NSAIDs where alternatives are suitable, particularly during active disease. Do not stop low-dose aspirin prescribed for secondary cardiovascular prevention without assessing the indication and bleeding risk. Ask specifically about over-the-counter purchases, and about recent dietary change and stress."},
         {tone:"cream", h:"Histology settles it", html:"Distorted crypt architecture indicates the chronic change of UC; preserved goblet cells with only an acute inflammatory infiltrate indicates infective colitis. Sigmoidoscopy and biopsy are specialist steps, but the distinction is why the specialist scopes rather than simply escalating."}
       ]},
       {b:"warn", html:"Treating an infective colitis with prednisolone in the belief it is a UC flare can be dangerous — immunosuppressing an infective cause worsens the infection. In a patient on a biologic or a thiopurine, add CMV to the differential: CMV colitis both mimics and complicates steroid-refractory UC, and is diagnosed on serology plus histology."}
     ]},
    {id:"exam", nav:"Examination", title:"Targeted examination", sub:"Six things, each of which changes what you do next.",
     blocks:[{b:"cards", items:[
       {tone:"cream", h:"Vital signs", html:"Temperature, HR, BP, respiratory rate and oxygen saturation. Tachycardia is a severity marker; tachycardia with hypotension is sepsis or haemodynamic compromise → same-day hospital. HR and temperature are two of the four Truelove and Witts systemic criteria, so this is diagnostic, not routine."},
       {tone:"cream", h:"Abdomen", html:"Distension (toxic megacolon), tenderness — localised to the left iliac fossa or sigmoid suggests mild to moderate disease, generalised peritonism suggests severe — bowel sounds (reduced or absent means ileus or perforation), and a palpable colon. Toxic megacolon can develop with distension out of proportion to the reported symptoms, so examine the abdomen even when the history sounds mild."},
       {tone:"cream", h:"Rectal examination", html:"Tenderness, blood on the glove, an anal fissure, and perianal disease (fistula or abscess — more typical of Crohn's but it does occur)."},
       {tone:"cream", h:"Fluid status and weight", html:"Skin turgor, mucous membranes and capillary refill — dehydration is common in a severe flare. Weight and BMI: weight loss in a flare means malnutrition risk and warrants nutritional assessment."},
       {tone:"cream", h:"Skin", html:"Erythema nodosum — painful red nodules on the shins, paralleling bowel activity. Pyoderma gangrenosum — pustules breaking down into deep ulcers, needing same-day dermatology and systemic immunosuppression, never surgical debridement."},
       {tone:"cream", h:"Eyes and joints", html:"Uveitis or episcleritis — a painful red eye with photophobia needs same-day ophthalmology. Joints: peripheral arthropathy parallels colitis activity, axial spondyloarthritis runs independently of it."}
     ]}]},
    {id:"workup", nav:"Work-up", title:"Investigations — and the ones not to do", sub:"What every flare needs, what is selective, and the two tests that cause harm if requested in an active flare.",
     blocks:[
       {b:"cards", items:[
         {tone:"blue", h:"Bloods — every flare", html:"FBC (Hb, WBC, platelets), CRP as a severity marker (ESR is not essential if CRP is available and the patient is not severely unwell), U&amp;E/eGFR for dehydration and 5-ASA safety, LFTs with albumin, and ferritin and iron studies if anaemia or recurrent disease — with B12, folate and vitamin D as the nutritional baseline in any newly diagnosed or relapsing patient. Check pregnancy status where relevant before treatment escalation. Blood cultures and urgent sepsis assessment if febrile or systemically unwell. Hb &lt;105 g/L with CRP &gt;45 mg/L indicates severe disease. A raised WBC means consider infection before you immunosuppress. Albumin &lt;30 g/L marks a severe systemic and poor nutritional state — these patients often need admission whatever the stool frequency; hypoalbuminaemia at the softer threshold of &lt;35 g/L already predicts a poor response to medical treatment, so it is a reason to involve the IBD team early rather than to wait."},
         {tone:"blue", h:"Stool — every flare", html:"Stool culture according to local laboratory policy plus <i>C. difficile</i> testing (local algorithm), preferably before steroids but never delaying admission; faecal calprotectin only where the distinction between inflammatory activity and functional symptoms is uncertain. Do not allow calprotectin or FIT to delay urgent admission."},
         {tone:"blue", h:"Drug-specific monitoring", html:"On azathioprine or mercaptopurine: FBC for myelosuppression and LFTs. On a biologic: in suspected secondary loss of response to infliximab or adalimumab, the IBD team may use reactive drug levels and anti-drug antibodies to distinguish pharmacokinetic loss of response from mechanistic failure. GPs should not alter biologic dosing."},
         {tone:"amber", h:"AXR — only for a reason", html:"Abdominal imaging (in hospital) if toxic megacolon is suspected: a transverse-colon diameter &gt;6 cm supports the diagnosis alongside systemic toxicity. It is not needed in a mild or moderate flare."},
         {tone:"red", h:"No routine full colonoscopy in severe active colitis", html:"Do not arrange routine full colonoscopy in severe active colitis from primary care — it carries a perforation risk and is poorly tolerated. Flexible sigmoidoscopy may be required urgently by gastroenterology, with biopsies where appropriate, including assessment for CMV in severe or refractory disease (BSG 2025 includes it in hospital assessment of ASUC)."},
         {tone:"cream", h:"Pregnancy test", html:"Not routine before every corticosteroid course — check where pregnancy would change management, particularly before teratogenic drugs or selected treatment escalation. Confirm exactly which drugs the patient takes: methotrexate is teratogenic and is used in Crohn's rather than UC, but drug lists are not always what the diagnosis predicts."},
         {tone:"purple", h:"NG12 slot — colorectal cancer <span class='tw'>Suspected cancer</span>", html:"<b>Ulcerative colitis does not exempt a patient from NICE NG12.</b> A rectal mass → consider a suspected cancer pathway referral directly, without FIT. The other colorectal features — an abdominal mass, a change in bowel habit, iron-deficiency anaemia, or unexplained weight loss with abdominal pain at 40 and over — now route through FIT, with a suspected cancer pathway referral at ≥10 µg Hb/g (NG12 with NICE HTG690). FIT may be positive in IBD and cannot distinguish inflammation from cancer, but it does not override NG12: assess for colorectal cancer independently of presumed inflammatory activity, use FIT where recommended by NG12/the local pathway, and do not delay urgent referral because of a pending or negative FIT where clinical concern remains. FIT cannot replace surveillance colonoscopy or specialist assessment. Restated with the thresholds in <a href='#refer'>Refer</a>.", src:"NICE NG12 (updated April 2026) · NICE HTG690"}
       ]}
     ]},
    {id:"eim", nav:"Extraintestinal", title:"Extraintestinal manifestations", sub:"They are common in UC, and some of them run on a clock entirely independent of the bowel.",
     blocks:[
       {b:"table", head:["Manifestation","Relationship to bowel activity","What you do"], rows:[
         ["<b>Peripheral arthropathy</b>","Type 1 (pauciarticular) parallels UC activity; Type 2 (polyarticular) is independent of it","Not a GP treatment algorithm — discuss with the IBD team and rheumatology: activity-linked arthropathy often settles with flare control; persistent or polyarticular arthropathy needs rheumatology input"],
         ["<b>Axial spondyloarthritis / ankylosing spondylitis</b>","<b>Independent of UC activity — progresses on its own</b>","Back pain with reduced lumbar flexion; rheumatology, and do not wait for the colitis to settle"],
         ["<b>Primary sclerosing cholangitis (PSC)</b>","Independent; progressive stricturing of intra- and extrahepatic bile ducts","Raised ALP is the clue — investigate cholestatic liver tests and arrange appropriate liver follow-up. UC plus PSC increases colorectal-cancer risk — annual colonoscopy from the time of PSC diagnosis. Liver transplantation for end-stage disease"],
         ["<b>Erythema nodosum</b>","Parallels bowel activity","Painful red nodules on the shins — treat the flare"],
         ["<b>Aphthous mouth ulcers</b>","Parallels bowel activity","Oral aphthous ulcers are not specific for active UC — consider nutritional deficiency (iron, B12, folate), medication effects, infection and Behçet's disease"],
         ["<b>Pyoderma gangrenosum</b>","Broadly independent","Same-day dermatology; needs systemic immunosuppression and must not be debrided"],
         ["<b>Uveitis / episcleritis</b>","Independent","<b>Same-day ophthalmology — uveitis is vision-threatening</b>"]
       ]}
     ]},
    {id:"ladder", nav:"Treatment ladder", title:"Inducing remission — by extent, then by severity", sub:"The GP-led ladder. Topical before oral, oral before systemic, and steroids only to induce.",
     blocks:[
       {b:"warn", html:"Before you prescribe anything: no antimotility drugs and no opioids in an active flare. Loperamide, codeine and antispasmodics can precipitate colonic dilatation and toxic megacolon. Avoid initiating NSAIDs where alternatives are suitable, particularly in active disease. Use paracetamol for pain and control the colitis — that is what stops the pain."},
       {b:"cards", items:[
         {tone:"cream", h:"Step 1 · Proctitis (rectum only)", html:"Rectal 5-ASA first-line (NICE NG130) — for example a mesalazine suppository, or a foam enema if a suppository is not tolerated, at the formulation-specific dose. Reassess at about 4 weeks. Add or substitute oral 5-ASA or a topical corticosteroid if the response is inadequate or 5-ASA is not tolerated — topical corticosteroid choice and dose are preparation-specific (check the SPC). Seek gastroenterology advice if refractory."},
         {tone:"cream", h:"Step 2 · Left-sided or extensive, mild to moderate", html:"<b>Left-sided:</b> topical 5-ASA first-line, usually combined with high-dose oral 5-ASA where appropriate, with oral treatment added or substituted depending on response and preference. <b>Extensive:</b> topical plus high-dose oral 5-ASA initially. Prescribe the formulation-specific licensed or guideline dose (Pentasa, Asacol, Mezavant and others differ — check what they actually take, and check adherence); do not interchange gram-for-gram between preparations. Reassess within about 2–4 weeks; if the response is inadequate, use a time-limited oral corticosteroid and seek specialist advice if not improving. Avoid repeated steroid courses without an escalation plan."},
         {tone:"cream", h:"Step 3 · Moderate to severe — oral corticosteroid", html:"A typical induction regimen is prednisolone 40 mg once daily, followed by a planned taper according to response and the local IBD protocol — NICE describes corticosteroid courses as time-limited, normally 4–8 weeks depending on the corticosteroid. Do not continue or repeatedly escalate corticosteroids without specialist review, and do not taper a patient who is not responding: get gastroenterology advice. Mesalazine continues alongside, during and after steroid induction. Add bone protection for courses beyond 3 months (alendronate 70 mg weekly plus calcium and vitamin D; check eGFR before a bisphosphonate)."},
         {tone:"cream", h:"Step 3b · Steroid-sparing — budesonide MMX", html:"Budesonide MMX (multimatrix) only for selected mild-to-moderate disease that has failed optimised oral plus topical 5-ASA where systemic prednisolone is best avoided — diabetes, osteoporosis, previous steroid psychosis. Check the product-specific duration and contraindications, and consider CYP3A4 interactions. Lower systemic exposure than prednisolone, but not a general substitute for prednisolone in moderate–severe disease; NOT for acute severe colitis."},
         {tone:"cream", h:"Step 4 · Steroid-sparing maintenance — specialist-initiated", html:"Azathioprine 2–2.5 mg/kg/day, or mercaptopurine 1–1.5 mg/kg/day, for steroid-dependent or frequently relapsing disease — TPMT testing before starting, always: absent or very low TPMT → do not use; reduced/intermediate TPMT → lower dose under specialist supervision; normal TPMT does not eliminate the risk of myelosuppression. Initiated by gastroenterology; monitoring follows the current Greater Manchester shared-care protocol."},
         {tone:"cream", h:"Step 5 · Biologics and small molecules — specialist only", html:"Advanced therapies approved by NICE include infliximab, adalimumab, golimumab, vedolizumab, ustekinumab, tofacitinib, filgotinib, upadacitinib, ozanimod, etrasimod, mirikizumab, risankizumab and guselkumab, depending on the current appraisal and commissioning pathway — for steroid-dependent or refractory disease. Advanced therapy selection is specialist-led and must follow the current NICE technology appraisal, NHS England/ICB commissioning pathway, the Greater Manchester IBD high-cost-drug pathway and the local IBD protocol. Specialist initiation and monitoring only. Each agent is used within its own technology appraisal — <b>infliximab under TA163</b> (acute exacerbations of severe UC) and <b>vedolizumab under TA342</b> (moderately to severely active disease), with each other agent covered by its own appraisal; <b>the appraisal, not preference, sets the line of therapy</b>. The usual triggers are thiopurine failure or intolerance in moderate-to-severe UC, and severe acute colitis not responding to IV steroid (rescue therapy, to avoid colectomy)."},
         {tone:"cream", h:"Step 6 · Surgery", html:"Colectomy is curative for ulcerative colitis, and some patients will need it — framing it as a treatment option rather than a failure helps patients engage with the discussion. Detail in <a href='#rescue'>Rescue and surgery</a>."},
         {tone:"green", h:"After the flare — correct the deficiencies", html:"Check FBC and ferritin once the flare settles and treat iron deficiency: oral iron between flares, parenteral iron if it is not tolerated or the bowel is still actively inflamed, because absorption is poor and oral iron aggravates symptoms in active disease. Check B12 and folate where there has been extensive small-bowel involvement or resection, and vitamin D on steroids."}
       ]},
       {b:"warn", html:"Prednisolone must never be used as long-term maintenance: it has no mucosal-healing effect and causes substantial morbidity. Before starting azathioprine or mercaptopurine, TPMT testing is mandatory — people with low TPMT activity accumulate the active metabolite 6-thioguanine (6-TGN) to myelosuppressive levels. Prescribing a thiopurine without TPMT is a prescribing error with potentially fatal consequences: absent or very low TPMT → do not use; reduced/intermediate TPMT → lower dose under specialist supervision; normal TPMT does not eliminate the risk of myelosuppression."}
     ]},
    {id:"maintain", nav:"Maintenance", title:"Maintenance — the treatment that prevents relapse", sub:"The part patients stop taking when they feel well, which is exactly when it is working.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"5-ASA maintenance for most patients", html:"NICE NG130: oral 5-ASA maintenance for left-sided and extensive UC, and topical or oral options for proctitis/proctosigmoiditis, at the lowest effective formulation-specific dose (BSG 2025). Continue 5-ASA for most patients whose remission was induced with 5-ASA or corticosteroids, unless the IBD team recommends otherwise — patients in prolonged remission with mucosal healing on immunomodulators or advanced therapies may discontinue 5-ASA after shared decision-making (BSG 2025). Do not stop it between flares without discussion. <b>Discuss adherence, formulation and adverse effects.</b>"},
         {tone:"green", h:"Frame it as relapse prevention", html:"The principal indication for maintenance is prevention of inflammatory relapse; 5-ASA may have a chemopreventive effect, but do not describe it as lifelong for everyone or as providing a quantified cancer-risk reduction. Common side effects are headache and nausea: switch formulation rather than stopping, since Pentasa, Mezavant and Asacol have different release and side-effect profiles."},
         {tone:"cream", h:"Thiopurine maintenance", html:"Azathioprine or mercaptopurine for steroid-dependent or frequently relapsing UC: TPMT before initiation, then FBC, LFTs and U&amp;E/creatinine/eGFR according to the current Greater Manchester shared-care protocol — every 2 weeks until stable, then monthly for 3 months, then at least 12-weekly."},
         {tone:"cream", h:"Biologic maintenance", html:"Advanced therapies are specialist-initiated and specialist-monitored under the current NICE appraisal and local IBD pathway. GPs should not alter biologic dosing; reactive therapeutic drug monitoring may assist specialist assessment, particularly for anti-TNF loss of response."},
         {tone:"blue", h:"Biologic drug monitoring — what the IBD team is doing", html:"In suspected secondary loss of response to infliximab or adalimumab, the IBD team may use reactive drug levels and anti-drug antibodies to distinguish pharmacokinetic loss of response from mechanistic failure. Reactive TDM is useful, but it is not mandatory or equally validated for every biologic and clinical scenario. GPs should not alter biologic dosing — knowing this is why the GP refers rather than adjusts."},
         {tone:"blue", h:"Mucosal healing is the target", html:"Mucosal healing, confirmed endoscopically, is now the treatment target in UC — symptom resolution alone does not equal remission. Patients who do not achieve mucosal healing have higher relapse, colectomy and cancer rates. Calprotectin is increasingly used to guide step-down, with the gastroenterologist."}
       ]}
     ]},
    {id:"rescue", nav:"Rescue & surgery", title:"Steroid-refractory disease, rescue therapy and surgery", sub:"Hospital territory — but the GP who understands it refers at the right moment and prepares the patient properly.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"Day-3 rescue decision", html:"Oxford criteria on day 3 of IV steroid: stool frequency &gt;8/day, or CRP &gt;45 mg/L with 3–8 stools/day, means around an 85% colectomy risk without rescue therapy. The choice is then infliximab or ciclosporin — a specialist decision."},
         {tone:"blue", h:"Infliximab rescue", html:"Infliximab 5 mg/kg as a single infusion (anti-TNF) — response within 4–7 days; preferred where long-term biologic maintenance will be needed; avoid with sepsis or an abscess."},
         {tone:"blue", h:"Ciclosporin rescue", html:"Ciclosporin 2 mg/kg/day IV (calcineurin inhibitor) — rapid response, used as a bridge to thiopurine maintenance; not suitable for long-term use."},
         {tone:"blue", h:"Vedolizumab", html:"Anti-integrin, slower in onset — preferred where there is infection risk or intolerance of anti-TNF."},
         {tone:"red", h:"Emergency surgery", html:"Subtotal colectomy with ileostomy (Hartmann procedure) for toxic megacolon, perforation, massive haemorrhage or failure of medical rescue."},
         {tone:"cream", h:"Elective surgery and the J-pouch", html:"Proctocolectomy with ileo-anal pouch anastomosis (J-pouch, restorative proctocolectomy) is curative for UC: a reservoir fashioned from terminal ileum and anastomosed to the anus, with most patients achieving an acceptable bowel frequency. Considered for refractory disease, high-grade dysplasia on surveillance, or inability to wean steroids. <b>A permanent end ileostomy is the alternative</b> where a pouch is unsuitable or unwanted — poor sphincter function, older age, or the patient's own choice after counselling; both routes need stoma-nurse input, and the psychosocial impact (body image, work, intimacy) should be addressed explicitly rather than left to the surgical clinic."},
         {tone:"cream", h:"Pouchitis — the GP will see this", html:"New diarrhoea, urgency or bleeding after pouch surgery requires contact with the pouch/IBD team. Exclude infection with stool culture and <i>C. difficile</i> testing (BSG 2025), and the specialist team will consider pouchoscopy, pelvic imaging or other causes such as cuffitis, Crohn's disease of the pouch and irritable pouch syndrome. Antibiotics follow the local specialist pathway (fluoroquinolones carry important adverse effects); probiotics are not a routine recommendation. Chronic refractory pouchitis needs a specialist pouch clinic. <b>Cuffitis</b> — inflammation of the retained rectal cuff below the pouch — mimics pouchitis and is treated with <b>topical mesalazine</b> instead; both look like a UC flare in a patient who no longer has a colon, so send them back to the IBD team rather than restarting systemic therapy."},
         {tone:"blue", h:"The IBD multidisciplinary team", html:"All refractory, biologic-requiring or surgical UC belongs in an IBD MDT — gastroenterologist, colorectal surgeon, IBD nurse specialist, dietitian, psychologist and radiologist. The IBD nurse specialist is the key contact between appointments and can advise on flare management, biologic administration and dose adjustment; BSG IBD standards require IBD nurse access for every patient with UC."}
       ]}
     ]},
    {id:"lifestyle", nav:"Lifestyle", title:"Lifestyle — a treatment, not a preamble", sub:"Quantified where it can be, and honest where the evidence is uncomfortable.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"NSAID avoidance", html:"NSAIDs (ibuprofen, naproxen, diclofenac) can exacerbate IBD in some patients, although the evidence is inconsistent. Avoid initiating NSAIDs where alternatives are suitable, particularly during active disease; use paracetamol for analgesia and advise a pharmacist check before any over-the-counter purchase. Do not stop low-dose aspirin for secondary cardiovascular prevention without assessing the indication and bleeding risk."},
         {tone:"green", h:"Diet in flare and remission", html:"<b>No diet has been shown to induce remission in UC.</b> In an active flare a low-residue diet (cooked vegetables, white rice, fish) reduces stool frequency and cramping — avoid raw vegetables, nuts, seeds, high-insoluble-fibre and spicy food. Ensure adequate calories and protein: a flare is a protein-catabolic state. <b>In remission no restriction is needed</b> — a balanced diet with adequate fibre, soluble fibre from oats, bananas and cooked vegetables being generally well tolerated; fermented foods (yoghurt, kefir) offer a modest microbiome benefit; red meat is associated with increased relapse in observational studies, so moderate it. Low FODMAP is not applicable in UC. Crohn's and Colitis UK provides reliable dietary guidance."},
         {tone:"green", h:"Hydration", html:"Diarrhoea causes significant fluid loss — aim for 2–3 litres of water a day, oral rehydration salts for moderate dehydration, and IV fluids if admitted."},
         {tone:"amber", h:"The smoking paradox — stated honestly", html:"Smoking is paradoxically associated with REDUCED UC activity (nicotine has anti-inflammatory effects on gut mucosa), unlike Crohn's where it worsens disease. This never justifies smoking: cardiovascular, pulmonary and oncological harms vastly outweigh any bowel benefit, and ex-smokers with UC must not restart to control their bowel. <b>Warn patients who are stopping that UC activity may worsen temporarily</b>, and offer normal cessation support. If asked: &ldquo;Smoking does appear to have some effect on colitis symptoms, but it causes much more serious harm in other ways — we cannot recommend it.&rdquo; Nicotine patches are being trialled as an adjunct in research settings only."},
         {tone:"blue", h:"Psychological support is part of the treatment", html:"Anxiety and depression are common in IBD, and psychological comorbidity worsens the disease course. The relationship is bidirectional — stress can trigger or worsen flares via the gut–brain axis, the microbiome and HPA-axis dysregulation. CBT reduces IBD-related anxiety and improves quality of life. Score PHQ-9 and GAD-7 at every UC review and refer to NHS Talking Therapies or IBD-specific psychological support. Crohn's and Colitis UK (crohnsandcolitis.org.uk) runs peer support, local groups and a helpline on <b>0300 222 5700</b>."},
         {tone:"amber", h:"Vaccination before immunosuppression", html:"Patients on thiopurines, biologics or systemic steroids are immunosuppressed and need: annual inactivated influenza vaccine, COVID-19 vaccination according to the current programme, pneumococcal vaccination, recombinant zoster vaccine (Shingrix — non-live) where eligible, HPV vaccination where indicated, hepatitis B vaccination where appropriate, and assessment of varicella immunity before immunosuppression. Patients on immunosuppressive therapy should generally avoid live vaccines, but advice depends on the medicine, degree of immunosuppression, timing, pregnancy, previous exposure and the Green Book — confirm drug-specific advice with the IBD team; there is no blanket six-month live-vaccine delay after every biologic exposure. Check vaccination status at diagnosis and before starting any immunosuppressant — after it starts, the window has closed."},
         {tone:"cream", h:"Bone health", html:"Repeated prednisolone courses plus malabsorption in flares creates real osteoporosis risk. DEXA at diagnosis if high-risk — age over 50, multiple previous steroid courses, low BMI. Alendronate 70 mg weekly if the T-score is ≤−2.0 or cumulative prednisolone is likely to exceed 3 months. Calcium 1000 mg/day plus vitamin D 800 IU/day for all patients on prednisolone, and an annual vitamin D check given malabsorption risk."}
       ]}
     ]},
    {id:"special", nav:"Special groups", title:"Pregnancy, fertility and working life", sub:"The two conversations that determine whether UC derails a life or merely complicates it.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Pregnancy and fertility", html:"Quiescent UC at conception and through pregnancy gives fetal outcomes equivalent to the general population; active UC at conception is associated with preterm birth and low birthweight — so the goal is remission BEFORE conception, and the greatest risk to the pregnancy is uncontrolled disease, not the drugs. Pre-conception counselling should aim for steroid-free remission. <b>Do not stop effective UC treatment without specialist advice</b>, because active disease is itself associated with adverse pregnancy outcomes. Mesalazine and thiopurines are commonly continued where clinically indicated; methotrexate and mycophenolate are contraindicated. Thiopurines have rarely been associated with intrahepatic cholestasis of pregnancy (MHRA). Advanced therapy decisions — including whether to continue, timing of the final dose and infant live-vaccine timing based on in-utero exposure — are individualised and made jointly with the IBD and obstetric teams. Folic acid 5 mg is particularly relevant with sulfasalazine and specific risk contexts — not a universal requirement for every mesalazine-treated patient. Arrange combined gastroenterology–obstetric care."},
         {tone:"cream", h:"Work and disability", html:"Flares commonly affect work performance and can need extended sick leave. Issue a fit note for moderate to severe flares — diarrhoea 6–10 times a day with rectal bleeding and fatigue substantially impairs the ability to work. Refer to occupational health where the job has no toilet access (drivers, refuse collectors, teachers). Universal Credit and Personal Independence Payment (PIP) are available where UC has significant functional impact. A dietitian referral is appropriate for significant weight loss, nutritional deficiency or food fear."}
       ]}
     ]},
    {id:"surveillance", nav:"Surveillance", title:"Colorectal cancer surveillance — the GP's job is to make sure it happens", sub:"A life-saving programme that quietly fails when nobody checks the patient is on it.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"The risk", html:"Colorectal-cancer risk rises with the duration and extent of colitis (particularly extensive colitis beyond the left flexure) and with PSC, strictures, dysplasia, persistent moderate or severe inflammation and a relevant family history."},
         {tone:"blue", h:"The schedule", html:"Follow the current local IBD surveillance pathway. Where the local service follows BSG 2025, arrange or confirm a baseline assessment at 8 years after symptom onset; where NICE CG118 is applied, the formal threshold is 10 years for UC other than proctitis alone. Do not delay referral for a patient approaching either threshold, particularly where disease extent or duration is uncertain. Then risk-based intervals (NICE CG118): <b>low risk 5 years, intermediate risk 3 years, high risk 1 year</b> — high-risk features include PSC, stricture, dysplasia, moderate or severe active inflammation and relevant family history. Chromoendoscopy with indigo carmine or methylene blue is preferred for detecting dysplasia."},
         {tone:"red", h:"PSC changes everything", html:"UC plus primary sclerosing cholangitis carries the highest colorectal-cancer risk of all and requires annual colonoscopy from the time of the PSC diagnosis, not from the 8- or 10-year mark. Flag it explicitly on the record, and ensure liver follow-up."},
         {tone:"green", h:"What primary care actually does", html:"Check surveillance is occurring at the right interval; flag patients approaching 8 or 10 years of disease who have had no surveillance invitation; make sure a PSC co-diagnosis is flagged for annual colonoscopy; and continue 5-ASA maintenance where indicated. High-grade dysplasia found on surveillance is an indication for elective colectomy."}
       ]}
     ]},
    {id:"monitor", nav:"Monitoring", title:"Monitoring, follow-up and safety-netting", sub:"Two shared-care jobs primary care owns: the thiopurine bloods under the current Greater Manchester shared-care protocol, and the 5-ASA renal check.",
     blocks:[
       {b:"table", head:["What","When","Action threshold"], rows:[
         ["<b>Acute flare review</b>","<b>48–72 hours by phone, then 5–7 days (GP or IBD nurse)</b>","Is stool frequency falling? Any systemic deterioration? Is the <i>C. difficile</i> result back? Improving → taper prednisolone as planned and reinforce 5-ASA. Not improving or worsening → same-day gastroenterology, not a higher dose. Inability to maintain oral intake, dehydration, systemic symptoms, increasing bleeding, significant anaemia, hypoalbuminaemia or uncertainty about severity → same-day specialist discussion"],
         ["<b>Faecal calprotectin</b>","<b>Where clinically useful after treatment</b>","A falling value supports response; a persistently raised value suggests active disease — discuss with the IBD team. Endoscopic assessment remains the reference for mucosal healing"],
         ["<b>Azathioprine or mercaptopurine</b>","<b>FBC, LFTs and U&amp;E/creatinine/eGFR per the current Greater Manchester shared-care protocol: every 2 weeks until stable, then monthly for 3 months, then at least 12-weekly</b>","Follow the shared-care protocol. Withhold treatment and contact the IBD team urgently for significant or progressive cytopenia, neutropenia, thrombocytopenia, rising transaminases, falling albumin or deteriorating renal function — use local reference ranges and trends, not isolated values alone. Also act on pancreatitis (an early reaction — stop), severe infection, jaundice, or unexplained bruising or bleeding. Counsel on lymphoma and non-melanoma skin-cancer risk; check interactions, particularly allopurinol, febuxostat and trimethoprim"],
         ["<b>5-ASA renal function</b>","<b>Before starting, at approximately 3 months, then annually — more frequently with renal impairment or other risk factors</b>","Mesalazine can cause idiosyncratic interstitial nephritis, typically with a rising creatinine — a class effect shared by olsalazine and balsalazide. Monitor trends: investigate any unexplained creatinine rise or eGFR decline and discuss with gastroenterology; stop mesalazine if renal toxicity is suspected. Function usually recovers if caught early"],
         ["<b>Before a biologic</b>","At initiation (specialist)","<b>Hepatitis B and C screen, and TB screening by IGRA before any anti-TNF</b>; FBC and LFTs 3-monthly thereafter"],
         ["<b>Annual review</b>","Yearly","Disease activity and steroid-free status; adherence and 5-ASA tolerability; FBC and haemoglobin; renal function for 5-ASA; iron deficiency; vaccination status; bone health and steroid exposure (DEXA if steroid-exposed); pregnancy and contraception where relevant; smoking status; mental health, nutrition and work impact; surveillance-colonoscopy status; and access to the IBD nurse or flare advice line. Chase the gastroenterology annual review if the patient is not receiving one"],
         ["<b>Steroid taper</b>","During and after any course","Never stop abruptly after more than 3 weeks — adrenal suppression and adrenal crisis. If the patient flares during the taper, do not re-escalate in primary care: urgent gastroenterology advice"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"999 script", html:"&ldquo;If your tummy becomes swollen and very painful, or your abdomen goes rigid, or you pass a lot of blood and feel faint or confused — call 999. Do not wait for a surgery appointment.&rdquo;"},
         {tone:"red", h:"Same-day script", html:"&ldquo;If you are opening your bowels six or more times a day with blood, or you develop a fever, or your stool frequency is still going up after five days of steroids, or you cannot keep the tablets down — contact us the same day.&rdquo;"},
         {tone:"amber", h:"Maintenance script", html:"&ldquo;Keep taking your mesalazine even when you feel completely well — it helps keep the colitis settled. If side effects are a problem, talk to us about switching to a different form rather than stopping, and do not stop it without talking to us or the IBD team.&rdquo;"},
         {tone:"amber", h:"Immunosuppression script", html:"&ldquo;While you are on azathioprine or a biologic, any fever, sore throat, infection, jaundice or unexplained bruising or bleeding needs to be checked quickly — and check with us or the IBD team before any vaccine, because some live vaccines must be avoided. Tell any clinician who sees you which drug you are on.&rdquo;"}
       ]},
       {b:"say", html:"Colitis works in two halves. One half is calming this flare down — the steroids do that, and I want to hear from you in two or three days to check they are working. The other half is keeping you well afterwards, and that is the mesalazine, taken every single day even when you feel fine, because it helps keep you in remission. I also want to make sure you are getting your camera-test invitations on time. If things get worse rather than better, we do not increase the steroids in the surgery — we get the specialist involved the same day."}
     ]},
    {id:"refer", nav:"Refer", title:"Refer — when to step beyond primary care", sub:"Four tiers, each with the explicit trigger — plus what primary care keeps.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999 — emergency", html:"Peritonism or rigid abdomen · suspected perforation · haemodynamic instability · severe ongoing haemorrhage with syncope, confusion or shock · marked abdominal distension with systemic toxicity · suspected toxic megacolon. Avoid antimotility agents and opioids; alert gastroenterology and colorectal surgery."},
         {tone:"red", h:"Same-day hospital", html:"Acute severe UC by Truelove and Witts severe criteria — telephone the on-call gastroenterologist directly and arrange a direct admission for the IV corticosteroid pathway. Inability to maintain oral hydration or medication; significant dehydration; worsening symptoms despite oral corticosteroids (including a severe flare not responding within 3 days); a severe flare in a patient receiving biologic or immunosuppressive treatment; suspected <i>C. difficile</i> or other significant infection. Severe extraintestinal disease: painful red eye with photophobia, rapidly progressive pyoderma gangrenosum."},
         {tone:"amber", h:"Urgent gastroenterology (within 5–7 days)", html:"Moderate flare with inadequate response to prednisolone at 48–72 hours · any non-severe flare in a biologic- or immunosuppressant-treated patient (the IBD team may use drug levels and anti-drug antibodies; GPs do not alter biologic dosing) · a positive stool culture indicating an infective trigger · steroid dependence — unable to reduce prednisolone below 10 mg/day without flaring, or ≥2 steroid courses in 12 months · new pyoderma gangrenosum or anterior uveitis."},
         {tone:"purple", h:"Urgent referral routes <span class='tw'>Suspected cancer</span> · NICE NG12", html:"<b>Ulcerative colitis confers no exemption from NG12.</b> A rectal mass → consider a suspected cancer pathway referral directly. An abdominal mass, a change in bowel habit, iron-deficiency anaemia, or unexplained weight loss with abdominal pain at 40 and over → FIT, and a suspected cancer pathway referral if FIT is ≥10 µg Hb/g (NG12 recs 1.3.1–1.3.2; NICE HTG690, formerly DG56). Iron-deficiency anaemia that colitis does not explain still needs investigating. New or changing symptoms, unexplained weight loss, iron-deficiency anaemia, abdominal or rectal mass, or a change in the established disease pattern → assess for colorectal cancer and review surveillance status. FIT may be positive in IBD and cannot distinguish inflammation from cancer, but it does not override NG12: use FIT where recommended by NG12/the local pathway, do not delay urgent referral because of a pending or negative FIT where clinical concern remains, and remember FIT cannot replace surveillance colonoscopy or specialist assessment. High-grade dysplasia on surveillance → colorectal surgery for elective colectomy.", src:"NICE NG12 (updated April 2026) · NICE HTG690 · BSG 2025 · NICE CG118"},
         {tone:"blue", h:"Routine gastroenterology", html:"Stable disease annual review · escalation planning and immunomodulator initiation · a new diagnosis of UC needing endoscopic staging · surveillance findings or new diagnostic doubt · significant extraintestinal manifestations."},
         {tone:"green", h:"IBD nurse specialist — often the right first call", html:"For most flares, contact the IBD helpline before any GP intervention: the nurse can advise whether the patient's own rescue protocol (for example a patient-held steroid prescription) covers this flare, which prevents unnecessary GP and hospital contacts. BSG standards require every patient with UC to have this access."},
         {tone:"cream", h:"What primary care keeps", html:"Grading the flare, excluding infection, treating mild and moderate flares by extent, the 48–72-hour and 5–7-day reviews, the thiopurine and 5-ASA monitoring, bone protection, vaccination, iron and vitamin D replacement, psychological support, and making sure surveillance colonoscopy actually happens."}
       ]},
       {b:"say", html:"Referral sentence to the patient: &ldquo;This flare is more severe than we can safely treat at home, so I am speaking to the bowel specialists today and they will admit you directly — you will not have to sit in A&amp;E.&rdquo; Referral sentence to the specialist: &ldquo;Known extensive ulcerative colitis, now with X bloody stools per day, HR X, temperature X, Hb X, CRP X — Truelove and Witts severe. Stool sent for culture and <i>C. difficile</i> testing. Not on antimotility agents. Requesting same-day admission for IV corticosteroids.&rdquo;"}
     ]},
    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card. The full teaching case lives in the Casebook and is not duplicated here.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"cream", h:"Classic scenario", html:"A 28-year-old with known left-sided ulcerative colitis, in remission on mesalazine for two years, books an urgent appointment: &ldquo;It's back — I'm going to the toilet about five times a day and there's blood again. Can you just give me the steroids like last time?&rdquo; She has been taking ibuprofen for a knee injury for the past fortnight and admits she stopped the mesalazine &ldquo;months ago, because I was fine&rdquo;. The challenge is to resist the request long enough to grade the flare, send stool, and find the two reversible causes sitting in the history."},
         {tone:"cream", h:"Examiner-style checkpoints", html:"<b>Data gathering:</b> stool frequency day and night, blood, systemic features, observations — an explicit Truelove and Witts grade. <b>Clinical management:</b> stool culture and <i>C. difficile</i> testing, preferably before steroids; stop the NSAID; restart and optimise 5-ASA by extent at the formulation-specific dose; steroid with the taper planned at the point of prescribing. <b>Medical complexity:</b> the adherence conversation framed around relapse prevention, not compliance. <b>Relating to others:</b> acknowledging that she knows her disease while explaining why this is not simply last time repeated. <b>Safety-netting:</b> the 48–72-hour review and the explicit same-day and 999 triggers. <a href='../../cases/ulcerative-colitis.html'>Open the full casebook chapter →</a>"}
       ]}
     ]},
    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Each source traceable to the recommendations it supports.",
     blocks:[
       {b:"cards", items:[
         {tone:"blue", h:"Primary guidance (in order of authority)", html:"1. <b>NICE NG130 — Ulcerative colitis: management (2019)</b> (<a href='https://www.nice.org.uk/guidance/ng130' rel='noopener'>nice.org.uk/guidance/ng130</a>): induction and maintenance by extent and severity, the 5-ASA ladder, time-limited corticosteroids, IV corticosteroids for admitted ASUC, advanced therapies. 2. <b>NICE NG199 — Clostridioides difficile infection: antimicrobial prescribing (2021)</b> (<a href='https://www.nice.org.uk/guidance/ng199' rel='noopener'>nice.org.uk/guidance/ng199</a>): oral vancomycin 125 mg four times daily for 10 days first-line. 3. <b>NICE CG118 — Colorectal cancer prevention: colonoscopic surveillance (2011, updated 2022)</b> (<a href='https://www.nice.org.uk/guidance/cg118' rel='noopener'>nice.org.uk/guidance/cg118</a>): surveillance from 10 years after symptom onset and the 1-, 3- and 5-year risk intervals. 4. <b>NICE NG12 — Suspected cancer: recognition and referral (updated April 2026)</b> (<a href='https://www.nice.org.uk/guidance/ng12' rel='noopener'>nice.org.uk/guidance/ng12</a>) with <b>NICE HTG690 (FIT; formerly DG56):</b> the colorectal referral criteria restated in <a href='#refer'>Refer</a>. 5. <b>BSG guidelines on inflammatory bowel disease in adults (2025)</b>, Gut 2025 (<a href='https://doi.org/10.1136/gutjnl-2024-334395' rel='noopener'>doi:10.1136/gutjnl-2024-334395</a>): ASUC admission and IV corticosteroid regimens, flexible sigmoidoscopy in ASUC, 5-ASA maintenance and discontinuation, pregnancy, pouch assessment, baseline surveillance at 8 years. 6. <b>NHS Greater Manchester pathways</b> (<a href='https://gmmmg.nhs.uk/' rel='noopener'>gmmmg.nhs.uk</a>): IBD high-cost-drug pathway, <a href='https://gmmmg.nhs.uk/guidance/clinical-guidance-and-pathways/antimicrobial-guidance-and-resources/' rel='noopener'>antimicrobial guidance</a>, and the azathioprine/mercaptopurine adult shared-care protocol. 7. <b>Current SPCs and local shared-care protocols</b> for individual medicines."},
         {tone:"blue", h:"Specialist standards and evidence", html:"<b>BSG IBD standards</b> — IBD nurse access and MDT composition. <b>ECCO Guidelines on Therapeutics in Ulcerative Colitis: Medical Treatment (Raine T et al., J Crohns Colitis 2022;16:2–17; doi:10.1093/ecco-jcc/jjab178)</b> — severity definitions and rescue therapy (international). <b>NHS Specialist Pharmacy Service</b> — <a href='https://www.sps.nhs.uk/monitorings/azathioprine-monitoring/' rel='noopener'>azathioprine monitoring</a> and <a href='https://www.sps.nhs.uk/monitorings/mesalazine-monitoring/' rel='noopener'>mesalazine monitoring</a>. <b>MHRA Drug Safety Update — Thiopurines and intrahepatic cholestasis of pregnancy</b> (<a href='https://www.gov.uk/drug-safety-update' rel='noopener'>gov.uk/drug-safety-update</a>). <b>UK Green Book</b> — immunisation of immunosuppressed patients. <b>Truelove &amp; Witts (BMJ 1955)</b> — the severity criteria and the first RCT of cortisone in UC. <b>Oxford day-3 criteria (Travis et al.)</b> — colectomy prediction on IV steroid. <b>BNF and SPCs</b> as the current prescribing reference for 5-ASA, corticosteroid and immunosuppressant dosing — not as the evidential source for efficacy, cancer-prevention or monitoring claims."},
         {tone:"blue", h:"Patient-facing", html:"<b>Crohn's and Colitis UK</b> (crohnsandcolitis.org.uk) — patient information, dietary guidance, employment and travel advice, local groups, helpline <b>0300 222 5700</b>."}
       ]},
       {b:"warn", html:"<b>Educational use only — not a standalone GP protocol.</b> Doses are typical examples — verify every one against the current SPC and local shared-care protocol before prescribing, and follow local NHS Greater Manchester IBD pathways (high-cost-drug, antimicrobial and azathioprine/mercaptopurine shared-care), local emergency contact routes and IBD nurse specialist protocols, which frequently define a patient-held rescue plan that supersedes generic advice."}
     ]}
  ],
  foot:"Ulcerative colitis protocol v2.0 · reviewed 9 September 2026 · next review 9 March 2027. Merged from the v1 shared-care card and both legacy flare algorithms. NICE NG130 · NG199 · CG118 · NG12 (updated April 2026) · HTG690 · BSG adult IBD guideline 2025 · ECCO UC medical treatment 2022 · NHS Greater Manchester pathways · Truelove &amp; Witts 1955."
