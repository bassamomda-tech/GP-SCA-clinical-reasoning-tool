  stemSub:"One page for the whole condition. Apply Truelove and Witts to every flare — acute severe colitis is a medical emergency, not a prescription; send stool for culture and <i>C. difficile</i> toxin before steroids; treat by disease extent, topical before oral; use corticosteroids to induce remission and never to maintain it; keep mesalazine going lifelong for relapse prevention and colorectal-cancer protection; run the thiopurine and 5-ASA monitoring that primary care owns; and make sure surveillance colonoscopy is actually happening. NICE NG130 · NG151 · BSG IBD standards 2019 · ECCO 2023.",

  lead:"<div class='mg-layers'><a href='#severe'><b>Grade it first</b><small>Truelove &amp; Witts</small></a><a href='#infection'><b>Exclude infection</b><small>Stool + C. difficile</small></a><a href='#ladder'><b>Treat by extent</b><small>Topical before oral</small></a><a href='#surveillance'><b>Protect the colon</b><small>5-ASA + surveillance</small></a></div>",
  quickSub:"If you read nothing else on this page, read these six cards. Every figure traces to the source cited under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Acute severe colitis is an admission, not a prescription", html:"Truelove and Witts: ≥6 bloody stools a day PLUS any one systemic feature — temperature &gt;37.8°C, HR &gt;90, Hb &lt;105 g/L, ESR &gt;30 mm/h (or CRP &gt;45 mg/L) — is acute severe ulcerative colitis and needs same-day admission for IV hydrocortisone, IV fluids and VTE prophylaxis. Abdominal distension with systemic toxicity and a transverse colon &gt;6 cm on AXR is toxic megacolon → 999 — it complicates about <b>5% of acute severe UC and carries around 30% mortality without surgery</b>. Peritonism, free gas, or massive rectal bleeding with instability → 999. Managing severe UC in the community is inappropriate care."},
    {tone:"amber", h:"Send stool before you reach for prednisolone", html:"Stool MC&amp;S plus <i>C. difficile</i> toxin is mandatory in every flare, before steroids. <i>C. difficile</i> superinfection increases mortality about four-fold compared with a UC flare alone, and steroids make it worse — treat with <b>oral vancomycin 125 mg QDS for 10 days</b> and withhold antidiarrhoeals. Ask about travel (<i>Campylobacter</i>, <i>Salmonella</i>, amoebic dysentery), recent antibiotics or hospital contact, and food-poisoning exposure. <b>Not all bloody diarrhoea in a patient with UC is a UC flare</b>, and treating an infective colitis with immunosuppression is dangerous."},
    {tone:"blue", h:"Extent decides the route; severity decides the drug", html:"Proctitis → topical mesalazine first: a 1 g suppository nocte, because topical therapy reaches mucosal concentrations around 100× those of oral 5-ASA and has an NNT of about 3 for remission in distal disease. Left-sided disease → mesalazine enema plus oral mesalazine — combination beats either alone. Extensive colitis or pancolitis → oral 5-ASA at an active-disease dose (at least 2.4 g/day) with topical therapy added. Ask when the last colonoscopy was: if you do not know the extent, you cannot pick the route."},
    {tone:"plain", h:"Steroids induce remission — they never maintain it", html:"Prednisolone 40 mg daily for a moderate flare, held for 2–4 weeks according to response and then tapered by 5 mg a week (a total course of roughly 8–12 weeks). <b>Budesonide MMX 9 mg daily for up to 8 weeks</b> is the lower-systemic-exposure option where oral and topical 5-ASA has failed and prednisolone is best avoided — it is not for acute severe colitis. Never stop prednisolone abruptly after more than 3 weeks: adrenal suppression. Two or more steroid courses in 12 months, or inability to wean below 10 mg without flaring, is steroid dependence — that is a referral, not another course."},
    {tone:"green", h:"Mesalazine is a cancer-prevention drug, not just a symptom drug", html:"Long-term oral mesalazine 1.2–2.4 g/day reduces colorectal-cancer risk by approximately 75%, on top of preventing relapse — and stopping it is the commonest trigger of a flare. Telling patients it protects the bowel, rather than that it &ldquo;keeps things calm&rdquo;, transforms long-term adherence. If headache or nausea is the problem, switch formulation (Pentasa, Asacol, Mezavant have different release and side-effect profiles) rather than stopping."},
    {tone:"teal", h:"Two things primary care must not let slip", html:"<b>Annual renal function on any 5-ASA</b> — mesalazine causes an idiosyncratic interstitial nephritis in about <b>0.2–0.5%</b> of patients, usually in the first year; an unexplained fall in eGFR of more than 25%, or below 60 mL/min, means stop the mesalazine and refer. And surveillance colonoscopy: extensive colitis for more than 8 years carries a 4–5× population colorectal-cancer risk, so check the patient is actually enrolled and being invited (CG118 / NG151)."}
  ],
  pathwaySub:"The whole flare consultation in five moves. The red step comes before any prescription.",
  pathway:[
    {title:"Grade the flare with Truelove and Witts", html:"Count bloody stools per day, day and night separately, then take the temperature, pulse, blood pressure and weight. ≥6 bloody stools a day plus any one of temperature &gt;37.8°C, HR &gt;90, Hb &lt;105 g/L or ESR &gt;30 mm/h is acute severe colitis — same-day admission. Distension, peritonism or instability is a 999 call.", alert:true},
    {title:"Exclude infection before immunosuppressing", html:"Stool MC&amp;S plus C. difficile toxin in every flare, before steroids. Ask about travel, recent antibiotics, hospital contact and food poisoning. Review the drug list for NSAIDs and aspirin, which precipitate flares in 20–30% and can be the whole explanation."},
    {title:"Establish extent and confirm true inflammation", html:"Find the disease extent from the last colonoscopy — proctitis, left-sided or extensive — because it decides topical versus systemic therapy. Send FBC, CRP, ESR, U&amp;E, LFTs with albumin and ferritin, and use faecal calprotectin where the question is flare versus functional symptoms."},
    {title:"Treat by extent, then by severity", html:"Mild: optimise topical 5-ASA and make sure the oral dose is an active-disease dose. Moderate: prednisolone 40 mg daily with the taper planned at the point of prescribing, mesalazine continued alongside. Severe: admit. No antimotility drugs and no opioids in an active flare."},
    {title:"Review on the clock, then step down and protect", html:"Review at 48–72 hours by phone and again at 5–7 days: is stool frequency falling, is the C. difficile result back? No better at 48–72 hours means urgent gastroenterology, not a bigger dose. Calprotectin at 6–8 weeks to confirm mucosal healing, then lifelong maintenance 5-ASA, drug monitoring and surveillance."}
  ],
  sections:[
    {id:"severe", nav:"Red flags", title:"The emergencies — toxic megacolon, perforation, haemorrhage and acute severe colitis", sub:"Four presentations that must leave your room by ambulance or on a same-day admission call. Everything else on this page can wait until they are excluded.",
     blocks:[
       {b:"warn", html:"Grade the flare before you treat it. A patient with ≥6 bloody stools a day and one systemic feature needs a hospital bed and intravenous steroid, and every hour spent trying oral prednisolone in the community is an hour of untreated severe colitis. Equally: never give loperamide, codeine or an antispasmodic in an active flare — antimotility drugs can precipitate colonic dilatation and toxic megacolon."},
       {b:"cards", cols:2, items:[
         {tone:"red", h:"Toxic megacolon → 999", html:"Severe flare plus colonic dilatation &gt;6 cm (transverse colon on plain AXR, measured at its widest point) plus fever (&gt;38°C), tachycardia (&gt;120) and peritonism — localised or diffuse tenderness with guarding — and systemic toxicity. Transmural inflammation paralyses colonic motility and the colon distends progressively. 999. Nil by mouth. IV fluids, IV hydrocortisone 400 mg/day (100 mg QDS), IV antibiotics (ciprofloxacin 400 mg BD plus metronidazole 500 mg TDS), NG tube decompression, 6-hourly review with serial AXR, and a surgical team alert. Emergency subtotal colectomy if the diameter fails to fall or the patient deteriorates despite 24–72 hours of maximal medical therapy. It occurs in about <b>5% of acute severe UC with roughly 30% mortality without surgery</b>. Do not treat a suspected toxic megacolon orally."},
         {tone:"red", h:"Perforation → 999", html:"Sudden severe abdominal pain with peritonitis, absent bowel sounds and free gas on CXR or AXR. 999 — urgent laparotomy. A rigid, silent abdomen in a patient with colitis is a surgical emergency and needs no further tests in primary care."},
         {tone:"red", h:"Massive rectal haemorrhage → 999", html:"Heavy rectal bleeding with haemodynamic instability — HR &gt;100, BP &lt;90/60, rapidly falling haemoglobin. 999. Two large-bore IV cannulae, group and save plus cross-match 4 units, transfuse; emergency colectomy may be needed."},
         {tone:"red", h:"Acute severe UC → same-day admission", html:"≥6 bloody stools a day PLUS at least one of: HR &gt;90 · temperature &gt;37.8°C · Hb &lt;105 g/L · ESR &gt;30 mm/h (or CRP &gt;45 mg/L). Same-day gastroenterology or admission for IV hydrocortisone, IV fluids, VTE prophylaxis, a stool chart and daily AXR. Telephone the on-call gastroenterologist directly and arrange a direct admission — for most patients that is faster than sending them to A&amp;E. A severe flare already on oral steroids that has not responded in 3 days is steroid-refractory and needs the same call."},
         {tone:"amber", h:"<i>C. difficile</i> superinfection", html:"A steroid-dependent or immunosuppressed patient with fever, pain and worsening diarrhoea, especially after antibiotics or hospital contact. Urgent stool <i>C. difficile</i> toxin PCR. Withhold antidiarrhoeal agents. Oral vancomycin 125 mg QDS for 10 days, with gastroenterology review — C. difficile in UC carries roughly four-fold the mortality of a UC flare alone, and steroids worsen it."},
         {tone:"amber", h:"New symptoms in long-standing colitis — think cancer", html:"New abdominal symptoms, weight loss or a change in the character of the colitis in a patient aged &gt;50, with long-standing extensive disease, is colorectal cancer until proven otherwise → urgent colonoscopy and a suspected-cancer colorectal referral. Extensive UC for more than 8 years carries a substantially elevated cancer risk; see <a href='#refer'>Refer</a> for the NG12 thresholds and <a href='#surveillance'>Surveillance</a> for the programme."},
         {tone:"red", h:"New immunosuppressant plus fever", html:"Fever in a patient recently started on azathioprine, mercaptopurine or a biologic → urgent FBC and same-day review: neutropenic sepsis and opportunistic infection, including CMV colitis, both present this way. Do not attribute fever in an immunosuppressed patient to the colitis itself."},
         {tone:"amber", h:"Severe extraintestinal disease", html:"Pyoderma gangrenosum → same-day dermatology (and it must not be surgically debrided). Anterior uveitis — a painful red eye with photophobia → same-day ophthalmology; it is vision-threatening."}
       ]}
     ]},
    {id:"confirm", nav:"Grade the flare", title:"Severity classification — Truelove and Witts", sub:"Required in every flare consultation. The grade decides the setting of care, and getting it wrong causes harm in both directions: severe colitis treated at home, or a mild flare sent to hospital.",
     blocks:[
       {b:"cards", items:[
         {tone:"teal", h:"Mild flare", html:"Fewer than 4 (&lt;4) bloody stools a day and no systemic disturbance: HR &lt;90, temperature &lt;37.8°C (some series use &lt;37.5°C), Hb &gt;115 g/L, ESR &lt;20 mm/h, CRP &lt;30 mg/L. Abdominal pain mild or absent. <b>Manage in the community</b>: rectal 5-ASA — a <b>mesalazine 1 g suppository nocte</b> for proctitis, an enema for left-sided disease — plus an oral 5-ASA at an active-disease dose. <b>Review within 2 weeks.</b>"},
         {tone:"teal", h:"Moderate flare", html:"4–6 bloody stools a day with minimal systemic disturbance: HR &lt;90, temperature &lt;37.8°C, Hb &gt;105 g/L, ESR &lt;30 mm/h. Can be managed in the community with prednisolone 40 mg daily plus optimised 5-ASA, with gastroenterology advice within 48–72 hours. Review within 5–7 days, and same-day if there is no improvement at 48–72 hours."},
         {tone:"red", h:"Severe flare — Truelove and Witts severe", html:"≥6 bloody stools a day AND at least one of: HR &gt;90 · temperature &gt;37.8°C · Hb &lt;105 g/L · ESR &gt;30 mm/h (or CRP &gt;45 mg/L). Same-day hospital admission for IV hydrocortisone 400 mg/day, with an AXR to exclude toxic megacolon. The Oxford criteria are then applied on day 3 of IV steroid to predict colectomy risk."}
       ]},
       {b:"dl", rows:[
         ["Why these criteria","Truelove and Witts (1955) remain the most practically validated bedside tool for UC severity — the Oxford trial that produced them was the first RCT to show that corticosteroids reduce mortality in ulcerative colitis, and the classification it generated still underpins management more than 60 years later. Correct grading prevents both under-treatment of severe colitis and needless admission of mild flares."],
         ["The Oxford day-3 criteria","On day 3 of IV hydrocortisone: a stool frequency &gt;8/day, or CRP &gt;45 mg/L with a stool frequency of 3–8/day, predicts an approximately 85% probability of requiring colectomy. This identifies steroid-refractory patients who need rescue therapy before emergency surgery. It is an inpatient calculation, but knowing it explains why the hospital acts on day 3 rather than waiting."],
         ["Extent as well as severity","Proctitis (rectum only) · left-sided colitis (up to the splenic flexure) · extensive colitis or pancolitis (beyond the left flexure). Extent comes from the last colonoscopy and determines the route of therapy: topical first-line for proctitis, combined topical plus oral for left-sided, oral or systemic for extensive."],
         ["Flare pattern","Two or more flares a year needing steroids, or inability to reduce prednisolone below 10 mg without flaring, defines steroid dependence — the trigger for escalation to a thiopurine or a biologic. That conversation belongs with the gastroenterologist now, not deferred indefinitely in primary care; steroid-dependent UC has a materially worse prognosis and quality of life, and earlier biologic escalation gives higher remission rates and fewer admissions."]
       ]}
     ]},
    {id:"infection", nav:"Exclude infection", title:"Is this a flare, an infection, or neither?", sub:"The single most consequential safety step in a UC flare consultation: immunosuppressing an infective colitis makes it worse.",
     blocks:[
       {b:"cards", items:[
         {tone:"plain", h:"Stool — mandatory before steroids", html:"Stool MC&amp;S for bacterial pathogens (<i>Salmonella</i>, <i>Shigella</i>, <i>Campylobacter</i>, <i>E. coli</i> O157) plus <i>Clostridioides difficile</i> toxin PCR (CDT) in every flare, before starting steroids. Ova, cysts and parasites if there has been travel."},
         {tone:"plain", h:"Faecal calprotectin", html:"&gt;250 µg/g indicates active inflammation; &lt;50 µg/g makes inflammation unlikely — reconsider IBS or a functional overlay rather than a flare. Calprotectin is a <b>calcium- and zinc-binding neutrophil protein</b> released into the stool when the colon is inflamed, which is why it separates IBD activity from IBS. Sensitivity is around <b>80–90%</b> (approximately 90% in the primary-care IBD literature) with specificity about <b>80%</b>. GPs can request it directly. Serial measurements track treatment response: a falling value supports mucosal healing, a persistently raised one means active disease needing escalation."},
         {tone:"plain", h:"Travel and food history", html:"Recent foreign travel raises <i>Campylobacter</i>, <i>Salmonella</i> and amoebic dysentery; bloody diarrhoea within hours of a meal suggests <i>E. coli</i> O157 or <i>Salmonella</i>. Avoid steroids until tropical infection is excluded."},
         {tone:"plain", h:"Recent antibiotics or hospital stay", html:"<i>C. difficile</i> — check toxin PCR. Coexisting <i>C. difficile</i> and a UC flare may need vancomycin or metronidazole alongside gastroenterology review."},
         {tone:"cream", h:"Medication review", html:"NSAIDs (ibuprofen, naproxen, diclofenac) and aspirin precipitate flares in 20–30% through prostaglandin inhibition — identifying and stopping them can resolve a flare without any immunosuppression. Ask specifically about over-the-counter purchases, and about recent dietary change and stress."},
         {tone:"cream", h:"Histology settles it", html:"Distorted crypt architecture indicates the chronic change of UC; preserved goblet cells with only an acute inflammatory infiltrate indicates infective colitis. Sigmoidoscopy and biopsy are specialist steps, but the distinction is why the specialist scopes rather than simply escalating."}
       ]},
       {b:"warn", html:"Treating an infective colitis with prednisolone in the belief it is a UC flare can be dangerous — immunosuppressing an infective cause worsens the infection. In a patient on a biologic or a thiopurine, add CMV to the differential: CMV colitis both mimics and complicates steroid-refractory UC, and is diagnosed on serology plus histology."}
     ]},
    {id:"exam", nav:"Examination", title:"Targeted examination", sub:"Six things, each of which changes what you do next.",
     blocks:[{b:"cards", items:[
       {tone:"cream", h:"Vital signs", html:"Temperature, HR, BP, respiratory rate and oxygen saturation. Tachycardia is a severity marker; tachycardia with hypotension is sepsis or haemodynamic compromise → same-day hospital. HR and temperature are two of the four Truelove and Witts systemic criteria, so this is diagnostic, not routine."},
       {tone:"cream", h:"Abdomen", html:"Distension (toxic megacolon), tenderness — localised to the left iliac fossa or sigmoid suggests mild to moderate disease, generalised peritonism suggests severe — bowel sounds (reduced or absent means ileus or perforation), and a palpable colon. Toxic megacolon can develop with distension out of proportion to the reported symptoms, so examine the abdomen even when the history sounds mild."},
       {tone:"cream", h:"Rectal examination", html:"Tenderness, blood on the glove, an anal fissure, and perianal disease (fistula or abscess — more typical of Crohn's but it does occur)."},
       {tone:"cream", h:"Fluid status and weight", html:"Skin turgor, mucous membranes and capillary refill — dehydration is common in a severe flare. Weight and BMI: weight loss in a flare means malnutrition risk and warrants nutritional assessment."},
       {tone:"cream", h:"Skin", html:"Erythema nodosum — painful red nodules on the shins, paralleling bowel activity. Pyoderma gangrenosum — pustules breaking down into deep ulcers, needing same-day dermatology and systemic immunosuppression, never surgical debridement."},
       {tone:"cream", h:"Eyes and joints", html:"Uveitis or episcleritis — a painful red eye with photophobia needs same-day ophthalmology. Joints: peripheral arthropathy parallels colitis activity, axial spondyloarthritis runs independently of it."}
     ]}]},
    {id:"workup", nav:"Work-up", title:"Investigations — and the ones not to do", sub:"What every flare needs, what is selective, and the two tests that cause harm if requested in an active flare.",
     blocks:[
       {b:"cards", items:[
         {tone:"plain", h:"Bloods — every flare", html:"FBC (Hb, WBC, platelets), CRP and ESR as severity markers, U&amp;E for dehydration and 5-ASA safety, LFTs with albumin, and ferritin — with B12, folate and vitamin D as the nutritional baseline in any newly diagnosed or relapsing patient. Hb &lt;105 g/L with CRP &gt;45 mg/L indicates severe disease. A WBC &gt;15 × 10⁹/L means exclude infection before you immunosuppress — it is as likely to be bacterial superinfection or a steroid effect as colitis itself. Albumin &lt;30 g/L marks a severe systemic and poor nutritional state — these patients often need admission whatever the stool frequency; hypoalbuminaemia at the softer threshold of &lt;35 g/L already predicts a poor response to medical treatment, so it is a reason to involve the IBD team early rather than to wait."},
         {tone:"plain", h:"Stool — every flare", html:"MC&amp;S plus <i>C. difficile</i> toxin PCR, mandatory before steroids; faecal calprotectin where the diagnosis of flare versus functional symptoms is uncertain."},
         {tone:"plain", h:"Drug-specific monitoring", html:"On azathioprine or mercaptopurine: FBC for myelosuppression and LFTs. On a biologic: an infection screen before any dose escalation, and biologic drug levels plus anti-drug antibodies through the IBD team rather than a primary-care escalation."},
         {tone:"amber", h:"AXR — only for a reason", html:"Plain AXR only if toxic megacolon is suspected: a transverse-colon diameter &gt;6 cm is diagnostic. It is not needed in a mild or moderate flare."},
         {tone:"red", h:"Do NOT arrange colonoscopy in an active flare", html:"Acute colonoscopy in active colitis carries a perforation risk. It is arranged by gastroenterology once the flare has settled, or at remission review. Flexible sigmoidoscopy with biopsy in a severe flare is a specialist decision, not a primary-care request."},
         {tone:"cream", h:"Pregnancy test", html:"In women of reproductive age before oral corticosteroids, and before any escalation — it changes the drug choice. Confirm exactly which drugs the patient takes: methotrexate is teratogenic and is used in Crohn's rather than UC, but drug lists are not always what the diagnosis predicts."},
         {tone:"purple", h:"NG12 slot — colorectal cancer <span class='tw'>2WW</span>", html:"<b>Ulcerative colitis does not exempt a patient from NICE NG12.</b> A rectal or abdominal mass at any age, unexplained weight loss with abdominal pain at 40 and over, or an unexplained change in bowel habit or iron-deficiency anaemia at 60 and over all mandate an urgent suspected-cancer colorectal referral. Note the trap: FIT is not the discriminator in known ulcerative colitis, because active colitis makes it positive — in this population it is calprotectin, colonoscopy and the surveillance programme that answer the question, and a FIT result must never delay a referral that NG12 already requires. Restated with the thresholds in <a href='#refer'>Refer</a>.", src:"NICE NG12 (May 2025)"}
       ]}
     ]},
    {id:"eim", nav:"Extraintestinal", title:"Extraintestinal manifestations", sub:"They occur in 25–40% of patients with UC, and some of them run on a clock entirely independent of the bowel.",
     blocks:[
       {b:"table", head:["Manifestation","Relationship to bowel activity","What you do"], rows:[
         ["<b>Peripheral arthropathy</b>","Type 1 (pauciarticular) parallels UC activity; Type 2 (polyarticular) is independent of it","Type 1: treat the flare. Type 2: treat separately — controlling the colitis will not fix it"],
         ["<b>Axial spondyloarthritis / ankylosing spondylitis</b>","<b>Independent of UC activity — progresses on its own</b>","Back pain with reduced lumbar flexion; rheumatology, and do not wait for the colitis to settle"],
         ["<b>Primary sclerosing cholangitis (PSC)</b>","Independent; progressive stricturing of intra- and extrahepatic bile ducts","Raised ALP is the clue. UC plus PSC carries the highest colorectal-cancer risk of all — annual colonoscopy from the time of PSC diagnosis is mandatory. Liver transplantation for end-stage disease"],
         ["<b>Erythema nodosum</b>","Parallels bowel activity","Painful red nodules on the shins — treat the flare"],
         ["<b>Aphthous mouth ulcers</b>","Parallels bowel activity","Recurrent oral ulcers alongside bloody diarrhoea are an extra-intestinal manifestation, not a coincidence — they mark active systemic inflammation and settle when UC treatment is optimised. Exclude the other causes (iron, B12 or folate deficiency, drugs, Behçet's)"],
         ["<b>Pyoderma gangrenosum</b>","Broadly independent","Same-day dermatology; needs systemic immunosuppression and must not be debrided"],
         ["<b>Uveitis / episcleritis</b>","Independent","<b>Same-day ophthalmology — uveitis is vision-threatening</b>"]
       ]}
     ]},
    {id:"ladder", nav:"Treatment ladder", title:"Inducing remission — by extent, then by severity", sub:"The GP-led ladder. Topical before oral, oral before systemic, and steroids only to induce.",
     blocks:[
       {b:"warn", html:"Before you prescribe anything: no antimotility drugs and no opioids in an active flare. Loperamide, codeine and antispasmodics can precipitate colonic dilatation and toxic megacolon. Avoid NSAIDs, which trigger flares. Use paracetamol for pain and control the colitis — that is what stops the pain."},
       {b:"cards", items:[
         {tone:"plain", h:"Step 1 · Proctitis (rectum only)", html:"Mesalazine 1 g suppository nocte for 4–8 weeks — first-line, and superior to oral 5-ASA for proctitis because mucosal drug concentrations are around 100× higher (NNT approximately 3 for remission induction). A mesalazine 1 g or 2 g foam enema if a suppository is not tolerated. Add oral mesalazine 2.4 g/day if the response is inadequate. A prednisolone 5 mg suppository BD as an adjunct where 5-ASA alone is insufficient."},
         {tone:"plain", h:"Step 2 · Left-sided or extensive, mild to moderate", html:"Mesalazine enema nocte (1–2 g, and up to 4 g nocte for left-sided disease as far as the splenic flexure) PLUS oral mesalazine 2.4–4.8 g/day (Pentasa granules, Asacol, Mezavant — check what they actually take, and check compliance). Combined topical plus oral 5-ASA is superior to either alone. Step up to prednisolone 40 mg daily if there is no response at 2 weeks (review by 2–4 weeks)."},
         {tone:"plain", h:"Step 3 · Moderate to severe — oral corticosteroid", html:"Prednisolone 40 mg daily, continued 2–4 weeks according to response, then tapered by 5 mg a week — a total course of roughly 8–12 weeks. Do not taper a patient who is not responding: get gastroenterology advice. Mesalazine continues alongside, during and after steroid induction. Add bone protection for courses beyond 3 months (alendronate 70 mg weekly plus calcium and vitamin D; check eGFR before a bisphosphonate)."},
         {tone:"plain", h:"Step 3b · Steroid-sparing — budesonide MMX", html:"Budesonide MMX 9 mg daily (multimatrix, up to 8 weeks) where mild to moderate disease has failed optimised oral plus topical 5-ASA and systemic prednisolone is best avoided — diabetes, osteoporosis, previous steroid psychosis. Lower systemic exposure than prednisolone; NOT for acute severe colitis."},
         {tone:"cream", h:"Step 4 · Steroid-sparing maintenance — specialist-initiated", html:"Azathioprine 2–2.5 mg/kg/day, or mercaptopurine 1–1.5 mg/kg/day, for steroid-dependent or frequently relapsing disease — TPMT testing before starting, always. Initiated by gastroenterology."},
         {tone:"cream", h:"Step 5 · Biologics and small molecules — specialist only", html:"Infliximab, adalimumab, vedolizumab, ustekinumab, ozanimod for steroid-dependent or refractory disease. Specialist initiation and monitoring only. Each agent is used within its own NICE technology appraisal — <b>infliximab under TA163</b> (acute exacerbations of severe UC) and <b>vedolizumab under TA342</b> (moderately to severely active disease), with adalimumab, ustekinumab and ozanimod each covered by their own appraisal; <b>the appraisal, not preference, sets the line of therapy</b>. The usual triggers are thiopurine failure or intolerance in moderate-to-severe UC, and severe acute colitis not responding to IV steroid (rescue therapy, to avoid colectomy)."},
         {tone:"cream", h:"Step 6 · Surgery", html:"Colectomy is curative for ulcerative colitis. Around 15–20% of patients need a colectomy within 10 years of diagnosis — framing it as a treatment option rather than a failure helps patients engage with the discussion. Detail in <a href='#rescue'>Rescue and surgery</a>."},
         {tone:"green", h:"After the flare — correct the deficiencies", html:"Check FBC and ferritin once the flare settles and treat iron deficiency: oral iron between flares, parenteral iron if it is not tolerated or the bowel is still actively inflamed, because absorption is poor and oral iron aggravates symptoms in active disease. Check B12 and folate where there has been extensive small-bowel involvement or resection, and vitamin D on steroids."}
       ]},
       {b:"warn", html:"Prednisolone must never be used as long-term maintenance: it has no mucosal-healing effect and causes substantial morbidity. Before starting azathioprine, TPMT testing is mandatory — around 0.3% of the population are homozygous-deficient and about 11% heterozygous, and they accumulate the active metabolite 6-thioguanine (6-TGN) to myelosuppressive levels. Prescribing azathioprine without TPMT is a prescribing error with potentially fatal consequences: low activity means avoid or a much reduced dose with intensive monitoring, heterozygous means start at 50% of the standard dose."}
     ]},
    {id:"maintain", nav:"Maintenance", title:"Maintenance — the treatment that prevents both relapse and cancer", sub:"The part patients stop taking when they feel well, which is exactly when it is working.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"5-ASA for life", html:"Oral mesalazine 1.2–2.4 g/day long-term (commonly 2.4 g/day, and 2–4 g/day where a higher maintenance dose is needed), topical or oral according to extent — do not stop it between flares. It reduces colorectal-cancer risk by approximately 75% in addition to controlling inflammation, through anti-proliferative and pro-apoptotic effects on colonocytes independent of its anti-inflammatory action. <b>Adherence is the main driver of sustained remission.</b>"},
         {tone:"green", h:"Frame it as cancer prevention", html:"Patients should understand that mesalazine is not merely there &ldquo;to keep the UC calm&rdquo; but is also a cancer-prevention medicine — this framing dramatically improves long-term adherence. Common side effects are headache and nausea: switch formulation rather than stopping, since Pentasa, Mezavant and Asacol have different release and side-effect profiles."},
         {tone:"cream", h:"Thiopurine maintenance", html:"Azathioprine for steroid-dependent or frequently relapsing UC: TPMT before initiation, then FBC and LFTs 4-weekly for 3 months and 3-monthly thereafter."},
         {tone:"cream", h:"Biologic maintenance", html:"Infliximab 5 mg/kg every 8 weeks; vedolizumab; ustekinumab; ozanimod — specialist initiation and monitoring. Never escalate immunosuppression in a patient on a biologic without therapeutic drug monitoring and gastroenterology guidance."},
         {tone:"blue", h:"Biologic drug monitoring — what the IBD team is doing", html:"Trough infliximab levels of about 3–7 µg/mL are associated with sustained remission; below 3 µg/mL predicts loss of response, and anti-drug antibodies accelerate clearance. In a flare on infliximab, therapeutic drug monitoring (TDM) — levels plus antibodies — determines the move: low level with low antibodies → dose-optimise; low level with high antibodies → switch within class (adalimumab) or out of class (vedolizumab, ustekinumab); adequate level with negative antibodies → active disease despite therapeutic drug, so switch mechanism. Knowing this is why the GP refers rather than adjusts."},
         {tone:"blue", h:"Mucosal healing is the target", html:"Mucosal healing, confirmed endoscopically, is now the treatment target in UC — symptom resolution alone does not equal remission. Patients who do not achieve mucosal healing have higher relapse, colectomy and cancer rates. Calprotectin is increasingly used to guide step-down, with the gastroenterologist."}
       ]}
     ]},
    {id:"rescue", nav:"Rescue & surgery", title:"Steroid-refractory disease, rescue therapy and surgery", sub:"Hospital territory — but the GP who understands it refers at the right moment and prepares the patient properly.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"Day-3 rescue decision", html:"Oxford criteria on day 3 of IV steroid: stool frequency &gt;8/day, or CRP &gt;45 mg/L with 3–8 stools/day, means around an 85% colectomy risk without rescue therapy. The choice is then infliximab or ciclosporin — a specialist decision."},
         {tone:"plain", h:"Infliximab rescue", html:"Infliximab 5 mg/kg as a single infusion (anti-TNF) — response within 4–7 days; preferred where long-term biologic maintenance will be needed; avoid with sepsis or an abscess."},
         {tone:"plain", h:"Ciclosporin rescue", html:"Ciclosporin 2 mg/kg/day IV (calcineurin inhibitor) — rapid response, used as a bridge to thiopurine maintenance; not suitable for long-term use."},
         {tone:"plain", h:"Vedolizumab", html:"Anti-integrin, slower in onset — preferred where there is infection risk or intolerance of anti-TNF."},
         {tone:"red", h:"Emergency surgery", html:"Subtotal colectomy with ileostomy (Hartmann procedure) for toxic megacolon, perforation, massive haemorrhage or failure of medical rescue."},
         {tone:"cream", h:"Elective surgery and the J-pouch", html:"Proctocolectomy with ileo-anal pouch anastomosis (J-pouch, restorative proctocolectomy) is curative for UC: a reservoir fashioned from terminal ileum and anastomosed to the anus, with most patients achieving an acceptable 4–8 bowel movements a day (commonly quoted as 4–6) against 20–30 or more in severe active disease. Considered for refractory disease, high-grade dysplasia on surveillance, or inability to wean steroids. <b>A permanent end ileostomy is the alternative</b> where a pouch is unsuitable or unwanted — poor sphincter function, older age, or the patient's own choice after counselling; both routes need stoma-nurse input, and the psychosocial impact (body image, work, intimacy) should be addressed explicitly rather than left to the surgical clinic."},
         {tone:"cream", h:"Pouchitis — the GP will see this", html:"Inflammation of the pouch mucosa affects about 50% of pouch patients at some point within 10 years, presenting as increased stool frequency, urgency and rectal bleeding. First-line metronidazole 400 mg TDS for 14 days, or ciprofloxacin 500 mg BD for 14 days. The probiotic VSL#3 reduces recurrence in RCTs. Chronic refractory pouchitis needs a specialist pouch clinic. <b>Cuffitis</b> — inflammation of the retained rectal cuff below the pouch — mimics pouchitis and is treated with <b>topical mesalazine</b> instead; both look like a UC flare in a patient who no longer has a colon, so send them back to the IBD team rather than restarting systemic therapy."},
         {tone:"plain", h:"The IBD multidisciplinary team", html:"All refractory, biologic-requiring or surgical UC belongs in an IBD MDT — gastroenterologist, colorectal surgeon, IBD nurse specialist, dietitian, psychologist and radiologist. The IBD nurse specialist is the key contact between appointments and can advise on flare management, biologic administration and dose adjustment; BSG IBD standards require IBD nurse access for every patient with UC."}
       ]}
     ]},
    {id:"lifestyle", nav:"Lifestyle", title:"Lifestyle — a treatment, not a preamble", sub:"Quantified where it can be, and honest where the evidence is uncomfortable.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"NSAID avoidance", html:"NSAIDs (ibuprofen, naproxen, diclofenac) trigger flares in 20–30%. Use paracetamol for analgesia and advise a pharmacist check before any over-the-counter purchase — many patients take ibuprofen without any idea that it precipitates flares."},
         {tone:"green", h:"Diet in flare and remission", html:"<b>No diet has been shown to induce remission in UC.</b> In an active flare a low-residue diet (cooked vegetables, white rice, fish) reduces stool frequency and cramping — avoid raw vegetables, nuts, seeds, high-insoluble-fibre and spicy food. Ensure adequate calories and protein: a flare is a protein-catabolic state. <b>In remission no restriction is needed</b> — a balanced diet with adequate fibre, soluble fibre from oats, bananas and cooked vegetables being generally well tolerated; fermented foods (yoghurt, kefir) offer a modest microbiome benefit; red meat is associated with increased relapse in observational studies, so moderate it. Low FODMAP is not applicable in UC. Crohn's and Colitis UK provides reliable dietary guidance."},
         {tone:"green", h:"Hydration", html:"Diarrhoea causes significant fluid loss — aim for 2–3 litres of water a day, oral rehydration salts for moderate dehydration, and IV fluids if admitted."},
         {tone:"amber", h:"The smoking paradox — stated honestly", html:"Smoking is paradoxically associated with REDUCED UC activity (nicotine has anti-inflammatory effects on gut mucosa), unlike Crohn's where it worsens disease. This never justifies smoking: cardiovascular, pulmonary and oncological harms vastly outweigh any bowel benefit, and ex-smokers with UC must not restart to control their bowel. <b>Warn patients who are stopping that UC activity may worsen temporarily</b>, and offer normal cessation support. If asked: &ldquo;Smoking does appear to have some effect on colitis symptoms, but it causes much more serious harm in other ways — we cannot recommend it.&rdquo; Nicotine patches are being trialled as an adjunct in research settings only."},
         {tone:"blue", h:"Psychological support is part of the treatment", html:"IBD carries significantly elevated anxiety (approximately 30%) and depression (approximately 20%), affecting 30–40% of patients overall, and psychological comorbidity worsens the disease course. The relationship is bidirectional — stress can trigger or worsen flares via the gut–brain axis, the microbiome and HPA-axis dysregulation. CBT reduces IBD-related anxiety and improves quality of life. Score PHQ-9 and GAD-7 at every UC review and refer to NHS Talking Therapies or IBD-specific psychological support. Crohn's and Colitis UK (crohnsandcolitis.org.uk) runs peer support, local groups and a helpline on <b>0300 222 5700</b>."},
         {tone:"amber", h:"Vaccination before immunosuppression", html:"Patients on thiopurines, biologics or systemic steroids are immunosuppressed and need: annual inactivated influenza vaccine, pneumococcal (PCV20 or PPV23; PPV23 plus PCV13 in older schedules), shingles vaccine (Shingrix — recombinant, non-live, safe on biologics), COVID-19 boosters, and a hepatitis B screen. AVOID live vaccines: BCG, yellow fever, live typhoid, MMR boosters and oral polio are contraindicated in significant immunosuppression. Check vaccination status at diagnosis and before starting any immunosuppressant — after it starts, the window has closed."},
         {tone:"cream", h:"Bone health", html:"Repeated prednisolone courses plus malabsorption in flares creates real osteoporosis risk. DEXA at diagnosis if high-risk — age over 50, multiple previous steroid courses, low BMI. Alendronate 70 mg weekly if the T-score is ≤−2.0 or cumulative prednisolone is likely to exceed 3 months. Calcium 1000 mg/day plus vitamin D 800 IU/day for all patients on prednisolone, and an annual vitamin D check given malabsorption risk."}
       ]}
     ]},
    {id:"special", nav:"Special groups", title:"Pregnancy, fertility and working life", sub:"The two conversations that determine whether UC derails a life or merely complicates it.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Pregnancy and fertility", html:"Quiescent UC at conception and through pregnancy gives fetal outcomes equivalent to the general population; active UC at conception is associated with preterm birth and low birthweight — so the goal is remission BEFORE conception, and the greatest risk to the pregnancy is uncontrolled disease, not the drugs. Safe to continue: mesalazine (low risk) and azathioprine (NICE permits continuation where benefit outweighs risk — a specialist decision). Contraindicated: methotrexate and mycophenolate, both teratogenic. Infliximab: discontinue at 30 weeks because it affects neonatal immune function, or continue with neonatologist awareness. If the mother had infliximab in the third trimester, defer live vaccines in the baby until 6 months. <b>Prescribe folic acid 5 mg daily</b> — mesalazine and sulfasalazine impair folate absorption, so the standard 400 µg is not enough; arrange combined gastroenterology–obstetric care, and <b>never stop mesalazine in pregnancy without specialist advice</b>."},
         {tone:"cream", h:"Work and disability", html:"Around 30% of patients with IBD report reduced work performance during flares and about 10% need extended sick leave. Issue a fit note for moderate to severe flares — diarrhoea 6–10 times a day with rectal bleeding and fatigue substantially impairs the ability to work. Refer to occupational health where the job has no toilet access (drivers, refuse collectors, teachers). Universal Credit and Personal Independence Payment (PIP) are available where UC has significant functional impact. A dietitian referral is appropriate for significant weight loss, nutritional deficiency or food fear."}
       ]}
     ]},
    {id:"surveillance", nav:"Surveillance", title:"Colorectal cancer surveillance — the GP's job is to make sure it happens", sub:"A life-saving programme that quietly fails when nobody checks the patient is on it.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"The risk", html:"Extensive colitis (beyond the left flexure) for more than 8 years carries a colorectal-cancer risk approximately 4–5× that of the population, and UC overall carries a 2–3× risk after 10 years. Cumulative risk in extensive colitis is around 2% at 10 years, 8% at 20 years and 18% at 30 years."},
         {tone:"plain", h:"The schedule", html:"Surveillance colonoscopy after 8 years of extensive colitis or 10 years of left-sided disease, then every 1–3 years (and up to 5 years for the lowest-risk groups) according to risk stratification — chromoendoscopy findings, dysplasia history, PSC, and family history of colorectal cancer (CG118 / NG151). Chromoendoscopy with indigo carmine or methylene blue is preferred for detecting dysplasia."},
         {tone:"red", h:"PSC changes everything", html:"UC plus primary sclerosing cholangitis carries the highest colorectal-cancer risk of all and requires annual colonoscopy from the time of the PSC diagnosis, not from the 8-year mark. Flag it explicitly on the record."},
         {tone:"green", h:"What primary care actually does", html:"Check surveillance is occurring at the right interval; flag patients approaching 8 years of extensive disease who have had no surveillance invitation; make sure a PSC co-diagnosis is flagged for annual colonoscopy; and keep mesalazine going, since it is itself a chemoprotective intervention. High-grade dysplasia found on surveillance is an indication for elective colectomy."}
       ]}
     ]},
    {id:"monitor", nav:"Monitoring", title:"Monitoring, follow-up and safety-netting", sub:"Two shared-care jobs primary care owns outright: the thiopurine bloods, and the annual 5-ASA renal check.",
     blocks:[
       {b:"table", head:["What","When","Action threshold"], rows:[
         ["<b>Acute flare review</b>","<b>48–72 hours by phone, then 5–7 days (GP or IBD nurse)</b>","Is stool frequency falling? Any systemic deterioration? Is the <i>C. difficile</i> result back? Improving → taper prednisolone as planned and reinforce 5-ASA. Not improving or worsening → same-day gastroenterology, not a higher dose"],
         ["<b>Faecal calprotectin</b>","<b>6–8 weeks after treatment</b>","Confirms mucosal healing; persistently raised means active disease and escalation"],
         ["<b>Azathioprine or mercaptopurine</b>","<b>FBC and LFTs every 4 weeks for 3 months, then 3-monthly indefinitely</b>","Stop if WBC &lt;3.5, neutrophils &lt;2.0, platelets &lt;150 or ALT &gt;3× upper limit of normal. Pancreatitis is an early azathioprine reaction — stop immediately"],
         ["<b>5-ASA renal function</b>","<b>Baseline, 2–3 months, then annually for life</b>","Mesalazine causes idiosyncratic interstitial nephritis in about 0.2–0.5%, usually within the first 12 months, typically with a rising creatinine and no haematuria or proteinuria — a class effect shared by olsalazine and balsalazide. An unexplained eGFR fall &gt;25% from baseline, or below 60 mL/min → stop the mesalazine and refer to nephrology and gastroenterology. Function usually recovers if caught early"],
         ["<b>Before a biologic</b>","At initiation (specialist)","<b>Hepatitis B and C screen, and TB screening by IGRA before any anti-TNF</b>; FBC and LFTs 3-monthly thereafter"],
         ["<b>Annual review</b>","Yearly","Blood pressure, weight, vitamin D, DEXA if steroid-exposed (particularly ≥3 courses), immunisation review, and a surveillance-colonoscopy check. Chase the gastroenterology annual review if the patient is not receiving one"],
         ["<b>Steroid taper</b>","During and after any course","Never stop abruptly after more than 3 weeks — adrenal suppression and adrenal crisis. If the patient flares during the taper, do not re-escalate in primary care: urgent gastroenterology advice"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"999 script", html:"&ldquo;If your tummy becomes swollen and very painful, or your abdomen goes rigid, or you pass a lot of blood and feel faint or confused — call 999. Do not wait for a surgery appointment.&rdquo;"},
         {tone:"red", h:"Same-day script", html:"&ldquo;If you are opening your bowels six or more times a day with blood, or you develop a fever, or your stool frequency is still going up after five days of steroids, or you cannot keep the tablets down — contact us the same day.&rdquo;"},
         {tone:"amber", h:"Maintenance script", html:"&ldquo;Keep taking your mesalazine even when you feel completely well. Stopping it is the commonest reason people flare, and it also lowers your risk of bowel cancer.&rdquo;"},
         {tone:"amber", h:"Immunosuppression script", html:"&ldquo;While you are on azathioprine or a biologic, any fever, sore throat or infection needs to be checked quickly — and no live vaccines. Tell any clinician who sees you which drug you are on.&rdquo;"}
       ]},
       {b:"say", html:"Colitis works in two halves. One half is calming this flare down — the steroids do that, and I want to hear from you in two or three days to check they are working. The other half is keeping you well afterwards, and that is the mesalazine, taken every single day even when you feel fine, because it keeps you in remission and lowers your bowel-cancer risk. I also want to make sure you are getting your camera-test invitations on time. If things get worse rather than better, we do not increase the steroids in the surgery — we get the specialist involved the same day."}
     ]},
    {id:"refer", nav:"Refer", title:"Refer — when to step beyond primary care", sub:"Four tiers, each with the explicit trigger — plus what primary care keeps.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999 — emergency", html:"Toxic megacolon (colonic dilatation &gt;6 cm) · perforation or peritonism · massive rectal haemorrhage · fulminant colitis with haemodynamic compromise · acute confusion in the setting of colitis."},
         {tone:"red", h:"Same-day hospital", html:"Acute severe UC by Truelove and Witts severe criteria — telephone the on-call gastroenterologist directly and arrange a direct admission for the IV hydrocortisone pathway. A severe flare not responding to oral steroids within 3 days. Suspected <i>C. difficile</i> superinfection. Severe extraintestinal disease: pyoderma gangrenosum, anterior uveitis."},
         {tone:"amber", h:"Urgent gastroenterology (within 5–7 days)", html:"Moderate flare with inadequate response to prednisolone at 48–72 hours · any flare in a biologic- or immunosuppressant-dependent patient (drug levels and anti-drug antibodies are needed before anything changes) · a positive stool culture indicating an infective trigger · steroid dependence — unable to reduce prednisolone below 10 mg/day without flaring, or ≥2 steroid courses in 12 months · new pyoderma gangrenosum or anterior uveitis."},
         {tone:"purple", h:"Urgent suspected cancer <span class='tw'>2WW</span> · NICE NG12", html:"<b>Ulcerative colitis confers no exemption from NG12.</b> Refer on an urgent suspected-cancer colorectal pathway for: a rectal or abdominal mass at any age; unexplained weight loss with abdominal pain at 40 and over; an unexplained change in bowel habit at 60 and over; unexplained iron-deficiency anaemia at 60 and over (and in any man or post-menopausal woman where colitis does not explain it). New abdominal symptoms, weight loss, or a change in the character of the colitis in a patient aged &gt;50 with long-standing extensive disease → urgent colonoscopy plus a 2WW colorectal referral. The trap to know: FIT is not the discriminator in known ulcerative colitis, because active disease makes it positive — here calprotectin, colonoscopy and the surveillance programme answer the question, and no FIT result may delay a referral NG12 already requires. High-grade dysplasia on surveillance → colorectal surgery for elective colectomy.", src:"NICE NG12 (May 2025) · CG118 / NG151"},
         {tone:"plain", h:"Routine gastroenterology", html:"Stable disease annual review · escalation planning and immunomodulator initiation · a new diagnosis of UC needing endoscopic staging · surveillance findings or new diagnostic doubt · significant extraintestinal manifestations."},
         {tone:"green", h:"IBD nurse specialist — often the right first call", html:"For most flares, contact the IBD helpline before any GP intervention: the nurse can advise whether the patient's own rescue protocol (for example a patient-held steroid prescription) covers this flare, which prevents unnecessary GP and hospital contacts. BSG standards require every patient with UC to have this access."},
         {tone:"cream", h:"What primary care keeps", html:"Grading the flare, excluding infection, treating mild and moderate flares by extent, the 48–72-hour and 5–7-day reviews, the thiopurine and 5-ASA monitoring, bone protection, vaccination, iron and vitamin D replacement, psychological support, and making sure surveillance colonoscopy actually happens."}
       ]},
       {b:"say", html:"Referral sentence to the patient: &ldquo;This flare is more severe than we can safely treat at home, so I am speaking to the bowel specialists today and they will admit you directly — you will not have to sit in A&amp;E.&rdquo; Referral sentence to the specialist: &ldquo;Known extensive ulcerative colitis, now with X bloody stools per day, HR X, temperature X, Hb X, CRP X — Truelove and Witts severe. Stool sent for MC&amp;S and <i>C. difficile</i> toxin. Not on antimotility agents. Requesting same-day admission for IV hydrocortisone.&rdquo;"}
     ]},
    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card. The full teaching case lives in the Casebook and is not duplicated here.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"cream", h:"Classic scenario", html:"A 28-year-old with known left-sided ulcerative colitis, in remission on mesalazine for two years, books an urgent appointment: &ldquo;It's back — I'm going to the toilet about five times a day and there's blood again. Can you just give me the steroids like last time?&rdquo; She has been taking ibuprofen for a knee injury for the past fortnight and admits she stopped the mesalazine &ldquo;months ago, because I was fine&rdquo;. The challenge is to resist the request long enough to grade the flare, send stool, and find the two reversible causes sitting in the history."},
         {tone:"cream", h:"Examiner-style checkpoints", html:"<b>Data gathering:</b> stool frequency day and night, blood, systemic features, observations — an explicit Truelove and Witts grade. <b>Clinical management:</b> stool MC&amp;S and <i>C. difficile</i> before steroids; stop the NSAID; restart and optimise 5-ASA by extent; steroid with the taper planned at the point of prescribing. <b>Medical complexity:</b> the adherence conversation framed around relapse and cancer protection, not compliance. <b>Relating to others:</b> acknowledging that she knows her disease while explaining why this is not simply last time repeated. <b>Safety-netting:</b> the 48–72-hour review and the explicit same-day and 999 triggers. <a href='../../cases/ulcerative-colitis.html'>Open the full casebook chapter →</a>"}
       ]}
     ]},
    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Each source traceable to the recommendations it supports.",
     blocks:[
       {b:"cards", items:[
         {tone:"plain", h:"Primary guidance", html:"<b>NICE NG130 — Ulcerative colitis: management (2019):</b> induction and maintenance by extent and severity, the 5-ASA ladder, corticosteroid use, escalation triggers. <b>NICE CG118 / NG151:</b> colonoscopic surveillance intervals and risk stratification. <b>NICE NG12 — Suspected cancer: recognition and referral (May 2025):</b> the colorectal 2WW thresholds restated in <a href='#refer'>Refer</a>. <b>NICE NG130 — Ulcerative colitis</b> for the primary-care shared-care framing."},
         {tone:"plain", h:"Specialist standards and evidence", html:"<b>BSG guidelines on the management of IBD in adults (2019)</b> and the <b>BSG IBD standards</b> — IBD nurse access, MDT composition, monitoring schedules. <b>ECCO consensus guidelines on ulcerative colitis (2023)</b> — severity definitions and rescue therapy. <b>Truelove &amp; Witts (BMJ 1955)</b> — the severity criteria and the first RCT of cortisone in UC. <b>Oxford day-3 criteria (Travis et al.)</b> — colectomy prediction on IV steroid. <b>BNF</b> for all 5-ASA, corticosteroid and immunosuppressant dosing."},
         {tone:"plain", h:"Patient-facing", html:"<b>Crohn's and Colitis UK</b> (crohnsandcolitis.org.uk) — patient information, dietary guidance, employment and travel advice, local groups, helpline <b>0300 222 5700</b>."}
       ]},
       {b:"warn", html:"<b>Educational use only.</b> Doses are the named primary-care choices — verify every one in the BNF before prescribing, and follow local IBD pathways and IBD nurse specialist protocols, which frequently define a patient-held rescue plan that supersedes generic advice."}
     ]}
  ],
