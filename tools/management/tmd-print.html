<script>
MG.render({
  icon:"😬",
  title:"Temporomandibular disorders — the complete guide",
  eyebrow:"Protocol · adults · jaw joint and muscle pain",
  stemTitle:"TMD is a group of jaw-joint and chewing-muscle disorders — examine the teeth, joint, muscles and red flags, then treat uncomplicated TMD conservatively and refer what does not fit",
  stemSub:"Temporomandibular disorders are a group of muscular, articular and mixed conditions affecting the jaw joint, the chewing muscles and associated structures. Assess the teeth, joint, muscles, mouth opening, bite, ears, cranial nerves and red flags. For uncomplicated TMD: reassurance, a temporary soft diet, avoiding clenching, gum and wide opening, heat or gentle massage, comfortable jaw movement and short-term analgesia. A dentist may consider a reversible, monitored splint for selected bruxism. <b>Avoid routine benzodiazepines and muscle relaxants, irreversible bite adjustment and prolonged analgesia.</b> In people aged 50 or over, true jaw or tongue claudication with GCA features needs same-day assessment through the local GCA pathway; visual symptoms need emergency ophthalmology or acute medical assessment. Review if not improving after 6–12 weeks of conservative care; refer when persistent, disabling, progressive, atypical or diagnostically uncertain.",
  guideline:"DC/TMD diagnostic criteria (2014) · GIRFT oral and maxillofacial outpatient guidance (2023) · NICE NG12 (red flags) · BNF · local formulary and referral pathways",
  reviewed:"25 September 2026",
  nextReview:"25 September 2027",
  meta:[
    {t:"Conservative care first", tone:"ok"},
    {t:"Jaw claudication aged 50+ → same-day GCA pathway", tone:"tw"},
    {t:"v2.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#assess"><b>Assess</b><small>Type · examine</small></a><a href="#redflags"><b>Red flags</b><small>GCA · cancer</small></a><a href="#selfcare"><b>Self-care</b><small>First-line</small></a><a href="#treat"><b>Treat</b><small>Analgesia · splint</small></a><a href="#refer"><b>Refer</b><small>Dental · OMFS</small></a></div>',
  quickSub:"The five that matter. Sources are listed under <a href=\"#provenance\">Evidence</a>; there is no dedicated NICE TMD guideline, and some treatment advice rests on expert consensus.",
  quick:[
    {tone:"blue", h:"A group of disorders — name the type", html:"<b>Muscular</b> (muscle tenderness, pain with clenching or chewing) · <b>joint</b> (preauricular pain, crepitus, painful or restricted movement) · <b>disc displacement with reduction</b> (clicking) · <b>without reduction</b> (closed lock, limited opening) · degenerative or inflammatory joint disease · recurrent dislocation. <b>Clicking without pain, locking or functional limitation usually needs reassurance only.</b> Refer if clicking comes with recurrent locking, significant pain, progressive restriction, trauma or an abnormal examination. Do not recommend a splint solely to eliminate an asymptomatic click."},
    {tone:"green", h:"Most uncomplicated TMD settles with conservative care", html:"Reassurance, a temporary soft diet, avoiding gum, very hard foods and wide opening, heat or gentle massage, comfortable jaw movement and short-term analgesia. <b>Avoid prolonged jaw immobilisation</b> — it can worsen stiffness and fear of movement."},
    {tone:"amber", h:"Splints are selective, not routine", html:"After dental assessment, a dentist may consider a <b>reversible, monitored occlusal splint</b> for troublesome bruxism or selected persistent TMD. It is not needed for painless clicking or uncomplicated acute TMD, and evidence for individual treatments is variable. <b>Do not use irreversible occlusal adjustment, extensive restorative treatment or orthodontics as routine treatment for TMD pain or to “correct” a presumed bite cause</b> — consider these only for an independent dental indication."},
    {tone:"amber", h:"No routine muscle relaxants or benzodiazepines", html:"<b>Do not routinely prescribe benzodiazepines or muscle relaxants for TMD.</b> Any short course for severe acute spasm should be exceptional, time-limited and reviewed promptly, after considering dependence, sedation, falls, driving, respiratory depression and interactions. <b>Do not routinely use amitriptyline or another TCA for uncomplicated mechanical TMD</b> — consider it only when persistent pain has been reassessed and there is a chronic primary or neuropathic pain phenotype; specialist pain or oral-medicine advice may be appropriate."},
    {tone:"red", h:"⚠ Jaw claudication aged 50 or over — same day", html:"New pain or fatigue of the jaw or tongue brought on by chewing or talking and relieved by rest, especially with new headache, scalp tenderness, fever, polymyalgia symptoms or visual symptoms → <b>same-day assessment through the local GCA pathway</b>. Take FBC, CRP, ESR and U&amp;E/LFT as appropriate, but do not delay corticosteroids or specialist assessment when suspicion is high. Visual symptoms → emergency ophthalmology or acute medical assessment. Continuous jaw pain localised to the TMJ, with clicking or provoked by jaw movement and not relieved by rest, is not typical claudication."}
  ],
  pathwaySub:"Five steps. The examination separates TMD from what it is not.",
  pathway:[
    {title:"Name the type and examine fully", html:"Teeth · mouth opening (maximum comfortable, unassisted and, if appropriate, assisted; painful? deviating? locking?) · joint palpation on opening and closing · masseter and temporalis tenderness · pain on resisted opening and closing · clenching or bruxism · bite and any persistent new occlusal change · cranial nerves and sensation where indicated · neck nodes, parotid and face · otoscopy if ear symptoms · temporal arteries, scalp and GCA symptoms if aged 50 or over.", alert:true},
    {title:"Check the red flags", html:"GCA, oral or neck cancer, spreading dental or facial infection, airway or swallowing symptoms, salivary-gland swelling, fracture, dislocation, closed lock, trigeminal neuralgia or other neurological disease."},
    {title:"Conservative care", html:"Temporary soft diet, avoid gum and wide opening, heat or massage, gentle movement, stress and sleep, short-term analgesia."},
    {title:"Dental input when relevant", html:"Dental disease, occlusal assessment, selected bruxism or persistent TMD for a reversible, monitored splint after dental assessment."},
    {title:"Refer persistent, locked or atypical", html:"Review if not improving after 6–12 weeks of appropriate conservative care, or sooner if function is deteriorating. Refer closed lock, marked restriction, recurrent dislocation, persistent, disabling, progressive or atypical symptoms, diagnostic uncertainty or red flags — chronicity alone does not mandate OMFS referral."}
  ],
  sections:[

    {id:"assess", nav:"Assess", title:"Step 1 — name the type and examine",
     blocks:[
       {b:"table", head:["Type","Typical features"], rows:[
         ["<b>Muscular (myogenous)</b>","Masseter or temporalis tenderness, pain with clenching or chewing, diffuse facial or temporal pain"],
         ["<b>Joint (arthrogenous)</b>","Preauricular joint pain, crepitus, painful movement, restricted opening"],
         ["<b>Disc displacement with reduction</b>","Clicking or popping, often without significant pain — <b>clicking without pain, locking or functional limitation usually needs reassurance only</b>; refer if recurrent locking, significant pain, progressive restriction, trauma or an abnormal examination"],
         ["<b>Disc displacement without reduction</b>","Closed lock and limited opening"],
         ["<b>Degenerative or inflammatory joint disease · recurrent dislocation</b>","Crepitus, stiffness, inflammatory features; or recurrent open lock"]
       ]},
       {b:"table", head:["Examine","Why"], rows:[
         ["<b>Teeth and gums</b>","Obvious caries or infection — odontogenic pain"],
         ["<b>Mouth opening</b>","Document maximum comfortable opening, maximum unassisted opening and, if appropriate, maximum assisted opening; note pain, deviation and locking, and whether limitation is muscular pain, mechanical locking or fear-related guarding. No single value diagnoses TMD — marked restriction may be disc displacement without reduction, infection, trauma, malignancy or tetanus and needs context-based referral"],
         ["<b>Joint, masseter and temporalis</b>","Palpate on opening and closing; pain on resisted opening and closing"],
         ["<b>Bite</b>","A new bite change may be transient with pain, spasm or disc displacement. A persistent new change in occlusion, particularly with progressive pain, swelling, numbness, reduced opening or a mass, warrants dental or oral-medicine assessment"],
         ["<b>Cranial nerves and sensation</b>","Where indicated — numbness or deficits point away from TMD"],
         ["<b>Neck nodes, parotid, face</b>","Mass, swelling or asymmetry"],
         ["<b>Ears</b>","Otoscopy if ear symptoms"],
         ["<b>Clenching and bruxism</b>","Daytime clenching, night grinding, tooth wear"],
         ["<b>Temporal arteries and scalp</b>","Aged 50 or over with compatible symptoms — GCA"]
       ]},
       {b:"why", html:"Contributors include bruxism and clenching, stress and poor sleep, nail-biting, gum-chewing and trauma. Naming the type matters: painless clicking without locking usually needs reassurance only, a closed lock needs referral, and muscular pain responds best to self-care."}
     ]},

    {id:"redflags", nav:"Red flags", title:"Step 2 — the red flags",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"🔴 Giant cell arteritis", html:"In a person aged 50 or over with new jaw or tongue claudication (pain or fatigue brought on by chewing or talking, relieved by rest), new headache, scalp tenderness, constitutional symptoms, polymyalgia symptoms or visual symptoms → <b>same-day assessment through the local GCA pathway</b>. Take FBC, CRP, ESR and U&amp;E/LFT as appropriate, but <b>do not delay corticosteroid treatment or specialist assessment when clinical suspicion is high</b>. <b>Visual symptoms → emergency ophthalmology or acute medical assessment.</b> Jaw pain that is continuous, localised to the TMJ, associated with clicking or provoked by jaw movement but not relieved by rest is not typical claudication. See <a href='giant-cell-arteritis.html'>giant cell arteritis</a>."},
         {tone:"purple", h:"🟣 Suspected oral or head and neck cancer <span class='tw'>Suspected cancer</span>", html:"Unexplained oral ulceration lasting more than 3 weeks, or a persistent unexplained neck lump → <b>consider suspected cancer pathway referral (NICE NG12)</b>. <b>A lump on the lip or in the oral cavity, or a red or red-and-white patch (erythroplakia or erythroleukoplakia) → urgent dental referral</b>; the dentist may then refer through the suspected cancer pathway. Cancer referral should be driven by the relevant oral, mucosal, neck, neurological or systemic findings — persistent facial pain alone does not require a cancer referral."},
         {tone:"red", h:"🔴 Other urgent features", html:"Acute jaw dislocation · recent significant trauma or suspected fracture · profound or progressive trismus · inability to eat or drink · dental pain with facial swelling · fever or systemic illness · trismus with suspected odontogenic infection · dysphagia, odynophagia, drooling or airway symptoms · floor-of-mouth swelling · rapidly enlarging parotid or submandibular swelling · facial nerve weakness with a parotid mass · purulent dental or ear symptoms. <b>A spreading facial or dental infection with airway compromise is an emergency</b>, not a routine OMFS referral."},
         {tone:"amber", h:"🟠 Reconsider TMD", html:"Persistent or progressive unilateral pain · facial swelling or asymmetry · numbness or altered sensation · cranial nerve abnormalities · unexplained weight loss or fever · persistent new occlusal change · parotid mass. Consider dental infection, malignancy, fracture, inflammatory disease, parotid pathology or trigeminal neuralgia."},
         {tone:"amber", h:"🟠 Closed lock or dislocation", html:"<b>Do not forcefully manipulate the jaw in primary care.</b> Assess for infection, trauma and fracture. <b>Urgent referral</b> if unable to eat or drink, severe pain, fever, swelling or acute trauma; otherwise refer persistent closed lock or marked dysfunction for prompt oral medicine, OMFS or facial-pain assessment. <b>Acute dislocation</b> → emergency, dental or OMFS services; reduction should not be attempted by an untrained clinician."},
         {tone:"amber", h:"🟠 Features of trigeminal neuralgia", html:"Brief, electric-shock-like paroxysms, triggered by touch, chewing, speaking or cold air, usually unilateral in a trigeminal distribution. <b>Seek urgent specialist advice</b> with sensory loss, bilateral symptoms, onset under 40, deafness or other neurological symptoms, persistent background pain, visual symptoms or other cranial neuropathies. Do not manage atypical neuropathic pain indefinitely as muscular TMD. See <a href='trigeminal-neuralgia.html'>trigeminal neuralgia</a>."}
       ]}
     ]},

    {id:"selfcare", nav:"Self-care", title:"Step 3 — conservative care, first-line",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"🦷 Diet and movement", html:"Soft diet temporarily; avoid wide opening, gum and very hard foods. <b>Keep comfortable jaw movement and return gradually to a normal diet as pain allows</b> — avoid prolonged immobilisation."},
         {tone:"green", h:"🔥 Heat and massage", html:"Warm compresses and gentle masseter massage. Any exercises should be gentle and must not aggravate pain or cause locking."},
         {tone:"green", h:"😬 Habits", html:"Awareness of daytime clenching; avoid nail-biting and pen-chewing."},
         {tone:"blue", h:"🧠 Stress and sleep", html:"Address stress, sleep and bruxism — important drivers of muscle tension."},
         {tone:"green", h:"🫶 Reassure", html:"Most uncomplicated muscular or articular TMD is non-life-threatening and improves with conservative care. Persistent, progressive, unilateral or atypical facial pain requires reassessment for dental, neurological, salivary-gland, inflammatory, infectious or malignant disease — chronic facial pain is not benign simply because it resembles TMD."}
       ]}
     ]},

    {id:"treat", nav:"Treat", title:"Step 4 — analgesia and dental input",
     blocks:[
       {b:"table", head:["Option","Use","Safeguards"], rows:[
         ["<b>Paracetamol or an oral NSAID</b>","Short term only, alongside self-care, per the local (Greater Manchester) formulary, including local OTC prescribing restrictions and preferred preparations. TMD-specific evidence for analgesics is limited; treatment is symptom-directed","Lowest effective NSAID dose for the shortest duration; review interactions. Reduce the paracetamol maximum for low body weight, frailty, liver disease or high alcohol intake. Before an NSAID: renal, GI and cardiovascular risk, anticoagulants, antiplatelets, corticosteroids, NSAID-sensitive asthma. Never combine NSAIDs; risk-based gastroprotection. Topical NSAIDs are unlikely to reach deep joint or muscle pain"],
         ["<b>Reversible occlusal splint (dentist)</b>","Troublesome bruxism or selected persistent TMD, after dental assessment; evidence for individual treatments is variable","Dentist-assessed and reviewed. Must not permanently alter the bite. Avoid prolonged full-time use unless specifically supervised. Remove or review if pain, bite change or function worsens. Not needed for painless clicking or uncomplicated acute TMD"],
         ["<b>Muscle relaxants or benzodiazepines</b>","<b>Do not routinely prescribe for TMD.</b> If a short course is considered for severe acute spasm, it should be exceptional, time-limited, reviewed promptly and per local prescribing guidance; evidence and local practice vary","Dependence, sedation, falls, driving, respiratory depression, interactions"],
         ["<b>Low-dose TCA (off-label)</b>","Do not routinely use amitriptyline or another TCA for uncomplicated mechanical TMD. Consider only when persistent pain has been reassessed and there is a chronic primary or neuropathic pain phenotype; specialist pain or oral-medicine advice may be appropriate","Anticholinergic, cardiac, overdose, sedation and interaction risks. A TCA does not treat joint clicking or disc displacement"]
       ]},
       {b:"warn", html:"Keep analgesia short term. Avoid prescribing analgesics on a prolonged regular basis for persistent facial pain without reassessing the diagnosis and considering medication-overuse or chronic-pain mechanisms. <b>Do not use irreversible occlusal adjustment, extensive restorative treatment or orthodontics as routine treatment for TMD pain or to “correct” a presumed bite cause.</b> Consider orthodontic or restorative treatment only for an independent dental indication."}
     ]},

    {id:"troubleshoot", nav:"Not improving?", title:"Not improving? Re-check before referring",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"1 · Self-care genuinely tried?", html:"Soft diet short term, gentle movement, heat, habit reduction."},
         {tone:"amber", h:"2 · Bruxism", html:"Night grinding or clenching addressed — dental review for a reversible splint?"},
         {tone:"blue", h:"3 · Stress, sleep and mood", html:"Addressed, or needing support in their own right?"},
         {tone:"red", h:"4 · Is it really TMD?", html:"Dental disease, GCA in over-50s, trigeminal neuralgia, ear or parotid pathology, malignancy."},
         {tone:"green", h:"5 · Then refer", html:"Not improving after 6–12 weeks of appropriate conservative care (sooner if function is deteriorating), locked, disabling, progressive or atypical → dental, physiotherapy/facial-pain service, oral medicine or OMFS as appropriate."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Step 5 — when to refer",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same day or urgent", html:"Urgent medical or ophthalmic pathway: suspected GCA (visual symptoms → emergency ophthalmology or acute medicine) · spreading facial or dental infection, fever, or airway or swallowing symptoms (emergency) · acute dislocation · significant trauma or suspected fracture · inability to eat or drink · neurological red flags."},
         {tone:"blue", h:"Dental", html:"Caries, periodontal disease or suspected odontogenic pain · occlusal assessment · selected bruxism and splint management."},
         {tone:"blue", h:"Physiotherapy, MSK or facial-pain service", html:"Persistent muscular pain or movement dysfunction, delivered by someone familiar with orofacial pain: education and self-management · posture and cervical contribution · gentle jaw range-of-motion exercises · graded mobilisation · massage or manual therapy · management of fear-avoidance and parafunctional behaviour. Avoid exercises that provoke locking or substantially increase pain."},
         {tone:"blue", h:"Oral medicine or OMFS", html:"Closed lock or markedly restricted opening · recurrent dislocation · progressive symptoms · failure of an appropriate conservative trial · significant functional impairment · significant joint dysfunction · suspected inflammatory or degenerative joint disease · diagnostic uncertainty · marked psychological distress or pain-related fear · atypical neurological, dental, salivary or systemic features. Refer earlier where these are present; chronicity alone does not mandate OMFS referral. Use the local (Greater Manchester) dental, oral medicine and OMFS referral pathway."},
         {tone:"cream", h:"GP management", html:"The examination, red-flag check, conservative care and short-term analgesia belong here; most uncomplicated TMD does not need OMFS (GIRFT). Review if symptoms persist beyond 6–12 weeks despite appropriate conservative treatment. Refer when symptoms are persistent, disabling, progressive, atypical or diagnostically uncertain. Related pages: <a href='giant-cell-arteritis.html'>giant cell arteritis</a> · <a href='trigeminal-neuralgia.html'>trigeminal neuralgia</a> · <a href='../algorithms/jaw-pain.html'>jaw pain pathway</a>."}
       ]},
       {b:"say", html:"This is jaw-joint and jaw-muscle pain, which is common and usually settles with simple measures — softer food for a while, warmth, gently keeping the jaw moving, easing off clenching, and short-term painkillers. If grinding at night is a factor, your dentist may suggest a removable guard. If your jaw locks, you can't open your mouth, you notice a lump, a red or red-and-white patch or an ulcer that won't heal, you have facial swelling with fever or difficulty swallowing or breathing, or — if you're 50 or over — your jaw aches when you chew with a new headache or any change in your vision, get help the same day. If things are not improving after 6–12 weeks, come back for a review."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 34-year-old woman has had <b>aching around the left jaw joint for six weeks</b>, worse at the end of the day and when chewing, with a painless click. She has been sleeping badly during a stressful period at work, and her partner says she grinds her teeth. Mouth opening is full; the masseter is tender. She asks for a muscle relaxant."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Examines teeth, opening, joint, muscles, bite, nodes and cranial nerves; explains that the click is harmless and the pain is muscular; checks red flags; offers conservative care and short-term analgesia with safety checks; explains why muscle relaxants are not routine; suggests dental review for a reversible splint for night grinding; addresses stress and sleep; and sets review and safety-net points."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Named sources are listed below. There is no dedicated NICE TMD guideline; several treatment recommendations rest on secondary sources or expert consensus.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>Diagnostic Criteria for Temporomandibular Disorders (DC/TMD) — Schiffman et al., J Oral Facial Pain Headache 2014</b><br><a href="https://doi.org/10.11607/jop.1151" rel="noopener">doi.org/10.11607/jop.1151</a><span class="rd"> — the muscular, joint and disc-displacement types and their examination</span></li>'+
         '<li><b>GIRFT — Clinically-led specialty outpatient guidance: oral and maxillofacial surgery (2023)</b><br><a href="https://gettingitrightfirsttime.co.uk/" rel="noopener">gettingitrightfirsttime.co.uk</a><span class="rd"> — many patients with TMD can be managed in primary care; referral pathways should be locally defined</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — red flags only: oral ulceration over 3 weeks, persistent neck lump; urgent dental referral for an oral or lip lump or a red or red-and-white patch. Not a TMD management guideline</span></li>'+
         '<li><b>BNF, local formulary and SPCs</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — analgesic, NSAID, muscle relaxant and TCA cautions</span></li>'+
         '<li><b>Patient.info (professional) — Temporomandibular disorders and pain syndromes</b><span class="rd"> — secondary source: short benzodiazepine course described only as an exceptional option</span></li>'+
         '<li><b>Local Greater Manchester pathways</b><span class="rd"> — dental, oral medicine and OMFS referral pathway; GCA pathway; formulary guidance for NSAIDs and any exceptional sedative prescribing. Check the current local versions</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Temporomandibular disorders (adults). A group of jaw-joint and chewing-muscle disorders. Assess the teeth, joint, muscles, mouth opening, bite, ears, cranial nerves and red flags. For uncomplicated TMD: reassurance, a temporary soft diet, avoiding clenching, gum and wide opening, heat or gentle massage, comfortable jaw movement and short-term analgesia. A dentist may consider a reversible, monitored splint for selected bruxism. Avoid routine benzodiazepines and muscle relaxants, irreversible bite adjustment and prolonged analgesia. Review if not improving after 6–12 weeks of conservative care; refer persistent, disabling, progressive or atypical symptoms, closed lock, marked dysfunction, diagnostic uncertainty or red flags — chronicity alone does not mandate OMFS referral. Aged 50 or over, true jaw claudication with GCA features needs same-day assessment through the local GCA pathway; visual symptoms need emergency ophthalmology or acute medical assessment. Oral ulcer over 3 weeks or persistent neck lump: consider NICE NG12 referral; oral or lip lump or red or red-and-white patch: urgent dental referral. Sources: DC/TMD (2014), GIRFT OMFS guidance (2023), NICE NG12, BNF."
});
</script>
