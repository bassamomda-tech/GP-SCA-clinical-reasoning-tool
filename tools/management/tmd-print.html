<script>
MG.render({
  icon:"😬",
  title:"Temporomandibular disorders — the complete guide",
  eyebrow:"Protocol · adults · jaw joint and muscle pain",
  stemTitle:"TMD is a group of jaw-joint and chewing-muscle disorders — examine the teeth, joint, muscles and red flags, then treat uncomplicated TMD conservatively and refer what does not fit",
  stemSub:"Temporomandibular disorders are a group of muscular, articular and mixed conditions affecting the jaw joint, the chewing muscles and associated structures. Assess the teeth, joint, muscles, mouth opening, bite, ears, cranial nerves and red flags. For uncomplicated TMD: reassurance, a temporary soft diet, avoiding clenching, gum and wide opening, heat or gentle massage, comfortable jaw movement and short-term analgesia. A dentist may consider a reversible, monitored splint for selected bruxism. <b>Avoid routine benzodiazepines and muscle relaxants, irreversible bite adjustment and prolonged analgesia.</b> In people over 50, true jaw claudication with headache, scalp tenderness or visual symptoms needs same-day assessment for giant cell arteritis.",
  guideline:"DC/TMD diagnostic criteria (2014) · GIRFT oral and maxillofacial outpatient guidance (2023) · NICE NG12 (red flags) · BNF",
  reviewed:"25 September 2026",
  nextReview:"25 September 2027",
  meta:[
    {t:"Conservative care first", tone:"ok"},
    {t:"Jaw claudication over 50 → same-day GCA", tone:"tw"},
    {t:"v2.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#assess"><b>Assess</b><small>Type · examine</small></a><a href="#redflags"><b>Red flags</b><small>GCA · cancer</small></a><a href="#selfcare"><b>Self-care</b><small>First-line</small></a><a href="#treat"><b>Treat</b><small>Analgesia · splint</small></a><a href="#refer"><b>Refer</b><small>Dental · OMFS</small></a></div>',
  quickSub:"The five that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"blue", h:"A group of disorders — name the type", html:"<b>Muscular</b> (muscle tenderness, pain with clenching or chewing) · <b>joint</b> (preauricular pain, crepitus, painful or restricted movement) · <b>disc displacement with reduction</b> (clicking) · <b>without reduction</b> (closed lock, limited opening) · degenerative or inflammatory joint disease · recurrent dislocation. <b>Painless clicking alone needs no treatment or referral.</b>"},
    {tone:"green", h:"Most uncomplicated TMD settles with conservative care", html:"Reassurance, a temporary soft diet, avoiding gum, very hard foods and wide opening, heat or gentle massage, comfortable jaw movement and short-term analgesia. <b>Avoid prolonged jaw immobilisation</b> — it can worsen stiffness and fear of movement."},
    {tone:"amber", h:"Splints are selective, not routine", html:"A dentist may consider a <b>reversible, monitored occlusal splint</b> for troublesome nocturnal bruxism. It is not needed for painless clicking or uncomplicated acute TMD. <b>Do not undertake irreversible bite adjustment or routine orthodontics for TMD.</b>"},
    {tone:"amber", h:"No routine muscle relaxants or benzodiazepines", html:"For pain beyond about 3 months, confirm the diagnosis and consider oral medicine, a facial-pain or multidisciplinary pain service <b>before</b> starting an off-label TCA — which is not routine treatment for mechanical TMD."},
    {tone:"red", h:"⚠ Jaw claudication over 50 — same day", html:"New pain or fatigue of the jaw or tongue brought on by chewing or talking and relieved by rest, especially with new headache, scalp tenderness, fever, polymyalgia symptoms or visual symptoms → <b>same-day assessment for giant cell arteritis</b>; visual symptoms → emergency pathway. Not all jaw pain on chewing is GCA."}
  ],
  pathwaySub:"Five steps. The examination separates TMD from what it is not.",
  pathway:[
    {title:"Name the type and examine fully", html:"Teeth · mouth opening (measure; painful? deviating?) · joint palpation on opening and closing · masseter and temporalis tenderness · pain on resisted opening and closing · bite and any new occlusal change · cranial nerves and sensation where indicated · neck nodes, parotid and face · otoscopy if ear symptoms · temporal arteries and scalp if over 50.", alert:true},
    {title:"Check the red flags", html:"GCA, oral or neck cancer, infection, fracture, dislocation, neurological disease."},
    {title:"Conservative care", html:"Temporary soft diet, avoid gum and wide opening, heat or massage, gentle movement, stress and sleep, short-term analgesia."},
    {title:"Dental input when relevant", html:"Dental disease, occlusal assessment, selected bruxism for a reversible splint."},
    {title:"Refer persistent, locked or atypical", html:"Closed lock, marked restriction, recurrent dislocation, persistence beyond about 3 months, diagnostic uncertainty or red flags."}
  ],
  sections:[

    {id:"assess", nav:"Assess", title:"Step 1 — name the type and examine",
     blocks:[
       {b:"table", head:["Type","Typical features"], rows:[
         ["<b>Muscular (myogenous)</b>","Masseter or temporalis tenderness, pain with clenching or chewing, diffuse facial or temporal pain"],
         ["<b>Joint (arthrogenous)</b>","Preauricular joint pain, crepitus, painful movement, restricted opening"],
         ["<b>Disc displacement with reduction</b>","Clicking or popping, often without significant pain — <b>painless clicking needs no treatment or referral</b>"],
         ["<b>Disc displacement without reduction</b>","Closed lock and limited opening"],
         ["<b>Degenerative or inflammatory joint disease · recurrent dislocation</b>","Crepitus, stiffness, inflammatory features; or recurrent open lock"]
       ]},
       {b:"table", head:["Examine","Why"], rows:[
         ["<b>Teeth and gums</b>","Obvious caries or infection — odontogenic pain"],
         ["<b>Mouth opening</b>","Measure and document; note pain and deviation"],
         ["<b>Joint, masseter and temporalis</b>","Palpate on opening and closing; pain on resisted opening and closing"],
         ["<b>Bite</b>","A new occlusal change is a red flag"],
         ["<b>Cranial nerves and sensation</b>","Where indicated — numbness or deficits point away from TMD"],
         ["<b>Neck nodes, parotid, face</b>","Mass, swelling or asymmetry"],
         ["<b>Ears</b>","Otoscopy if ear symptoms"],
         ["<b>Temporal arteries and scalp</b>","Over 50 with compatible symptoms — GCA"]
       ]},
       {b:"why", html:"Contributors include bruxism and clenching, stress and poor sleep, nail-biting, gum-chewing and trauma. Naming the type matters: painless clicking needs nothing, a closed lock needs referral, and muscular pain responds best to self-care."}
     ]},

    {id:"redflags", nav:"Red flags", title:"Step 2 — the red flags",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"🔴 Giant cell arteritis", html:"True jaw or tongue claudication — brought on by chewing or talking, relieved by rest — especially over 50 with new headache, scalp tenderness, fever or polymyalgia symptoms → <b>same-day assessment</b>. <b>Visual symptoms → emergency pathway.</b> See <a href='giant-cell-arteritis.html'>giant cell arteritis</a>."},
         {tone:"purple", h:"🟣 Suspected oral or head and neck cancer <span class='tw'>2WW</span>", html:"Unexplained oral ulceration lasting more than 3 weeks, or a persistent unexplained neck lump → <b>suspected cancer pathway referral (NICE NG12)</b>. Also consider it with a non-healing mucosal lesion, progressive unilateral pain with numbness, or a history of malignancy."},
         {tone:"red", h:"🔴 Other urgent features", html:"Acute jaw dislocation · recent significant trauma or suspected fracture · profound or progressive trismus · inability to eat or drink · facial swelling with fever or purulent dental or ear symptoms."},
         {tone:"amber", h:"🟠 Reconsider TMD", html:"Persistent or progressive unilateral pain · facial swelling or asymmetry · numbness or altered sensation · cranial nerve abnormalities · unexplained weight loss or fever · new occlusal change · parotid mass. Consider dental infection, malignancy, fracture, inflammatory disease, parotid pathology or trigeminal neuralgia."}
       ]}
     ]},

    {id:"selfcare", nav:"Self-care", title:"Step 3 — conservative care, first-line",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"🦷 Diet and movement", html:"Soft diet temporarily; avoid wide opening, gum and very hard foods. <b>Keep comfortable jaw movement and resume a normal diet as pain allows</b> — avoid prolonged immobilisation."},
         {tone:"green", h:"🔥 Heat and massage", html:"Warm compresses and gentle masseter massage. Any exercises should be gentle and must not aggravate pain or cause locking."},
         {tone:"green", h:"😬 Habits", html:"Awareness of daytime clenching; avoid nail-biting and pen-chewing."},
         {tone:"blue", h:"🧠 Stress and sleep", html:"Address stress, sleep and bruxism — important drivers of muscle tension."},
         {tone:"green", h:"🫶 Reassure", html:"Uncomplicated TMD usually settles with these measures. That does not mean all chronic facial pain is benign — persistent pain needs reassessment."}
       ]}
     ]},

    {id:"treat", nav:"Treat", title:"Step 4 — analgesia and dental input",
     blocks:[
       {b:"table", head:["Option","Use","Safeguards"], rows:[
         ["<b>Paracetamol or an oral NSAID</b>","Short term only, alongside self-care, per the local formulary","Reduce the paracetamol maximum for low body weight, frailty, liver disease or high alcohol intake. Before an NSAID: renal, GI and cardiovascular risk, anticoagulants, antiplatelets, corticosteroids, NSAID-sensitive asthma. Never combine NSAIDs; risk-based gastroprotection. Topical NSAIDs are unlikely to reach deep joint or muscle pain"],
         ["<b>Reversible occlusal splint (dentist)</b>","Selected patients with troublesome nocturnal bruxism","Dentist-assessed and monitored. Must not permanently alter the bite. Not needed for painless clicking or uncomplicated acute TMD"],
         ["<b>Muscle relaxants or benzodiazepines</b>","<b>Not routine.</b> Any short course for severe acute spasm is exceptional, individually assessed and per local prescribing guidance","Sedation, dependence, falls, interactions"],
         ["<b>Low-dose TCA (off-label)</b>","Only for selected chronic primary or neuropathic facial pain, after the diagnosis is confirmed and specialist input considered","Not routine for mechanical TMD. Consider sleep, mood, interactions, cardiac risk, anticholinergic effects and overdose risk"]
       ]},
       {b:"warn", html:"Keep analgesia short term. Persistent pain needs reassessment and a broader approach, not escalating painkillers. <b>Avoid irreversible occlusal adjustment and routine orthodontic treatment for TMD.</b>"}
     ]},

    {id:"troubleshoot", nav:"Not improving?", title:"Not improving? Re-check before referring",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"1 · Self-care genuinely tried?", html:"Soft diet short term, gentle movement, heat, habit reduction."},
         {tone:"amber", h:"2 · Bruxism", html:"Night grinding or clenching addressed — dental review for a reversible splint?"},
         {tone:"blue", h:"3 · Stress, sleep and mood", html:"Addressed, or needing support in their own right?"},
         {tone:"red", h:"4 · Is it really TMD?", html:"Dental disease, GCA in over-50s, trigeminal neuralgia, ear or parotid pathology, malignancy."},

       ]}

    {id:"refer", nav:"Refer", title:"Step 5 — when to refer",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same day or urgent", html:"Suspected GCA · acute dislocation · suspected fracture · spreading facial infection · inability to eat or drink."},
         {tone:"blue", h:"Dental", html:"Caries, periodontal disease or suspected odontogenic pain · occlusal assessment · selected bruxism and splint management."},
         {tone:"blue", h:"Physiotherapy, MSK or facial-pain service", html:"Persistent muscular pain · postural or cervical contribution · restricted movement · supervised mobilisation, manual therapy or exercise · pain-related fear, stress or functional limitation."},
         {tone:"blue", h:"Oral medicine or OMFS", html:"Closed lock or markedly restricted opening · recurrent dislocation · persistent or worsening symptoms despite a reasonable conservative trial, or beyond about 3 months · significant joint dysfunction · suspected inflammatory or degenerative joint disease · diagnostic uncertainty · marked psychological distress · atypical features."},
         {tone:"cream", h:"GP management", html:"The examination, red-flag check, conservative care and short-term analgesia belong here; most uncomplicated TMD does not need OMFS. Related pages: <a href='giant-cell-arteritis.html'>giant cell arteritis</a> · <a href='trigeminal-neuralgia.html'>trigeminal neuralgia</a> · <a href='../algorithms/jaw-pain.html'>jaw pain pathway</a>."}
       ]},
       {b:"say", html:"This is jaw-joint and jaw-muscle pain, which is common and usually settles with simple measures — softer food for a while, warmth, gently keeping the jaw moving, easing off clenching, and short-term painkillers. If grinding at night is a factor, your dentist may suggest a removable guard. If your jaw locks, you can't open your mouth, you notice a lump or an ulcer that won't heal, or — if you're over 50 — your jaw aches when you chew with a new headache or any change in your vision, get help the same day."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 34-year-old woman has had <b>aching around the left jaw joint for six weeks</b>, worse at the end of the day and when chewing, with a painless click. She has been sleeping badly during a stressful period at work, and her partner says she grinds her teeth. Mouth opening is full; the masseter is tender. She asks for a muscle relaxant."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Examines teeth, opening, joint, muscles, bite, nodes and cranial nerves; explains that the click is harmless and the pain is muscular; checks red flags; offers conservative care and short-term analgesia with safety checks; explains why muscle relaxants are not routine; suggests dental review for a reversible splint for night grinding; addresses stress and sleep; and sets review and safety-net points."}
     ]}]},

  foot:"Temporomandibular disorders (adults). A group of jaw-joint and chewing-muscle disorders. Assess the teeth, joint, muscles, mouth opening, bite, ears, cranial nerves and red flags. For uncomplicated TMD: reassurance, a temporary soft diet, avoiding clenching, gum and wide opening, heat or gentle massage, comfortable jaw movement and short-term analgesia. A dentist may consider a reversible, monitored splint for selected bruxism. Avoid routine benzodiazepines and muscle relaxants, irreversible bite adjustment and prolonged analgesia. Refer persistent symptoms, closed lock, marked dysfunction, diagnostic uncertainty or red flags. Over 50, true jaw claudication with headache, scalp tenderness or visual symptoms needs same-day GCA assessment. Oral ulcer over 3 weeks or persistent neck lump: NICE NG12. Sources: DC/TMD (2014), GIRFT OMFS guidance (2023), NICE NG12, BNF."
