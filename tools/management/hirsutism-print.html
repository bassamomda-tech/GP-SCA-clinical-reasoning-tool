  quickSub:"The six that change outcomes. Sources are listed under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Rate of onset is the question that matters most", html:"Hirsutism developing rapidly over weeks to months, especially with virilisation — deepening voice, clitoromegaly, increased muscle bulk, male-pattern balding, breast atrophy — raises concern for an androgen-secreting ovarian or adrenal tumour, or Cushing's syndrome; do not assume the cause until assessed. This needs urgent endocrine or gynaecology referral and urgent bloods, not a six-month trial of a pill. Ask \"how quickly did this happen?\" in every consultation — it is the single highest-yield question on this page."},
    {tone:"blue", h:"Hirsutism is not hypertrichosis, and the distinction changes everything", html:"Hirsutism is excess terminal (coarse, pigmented) hair in ANDROGEN-DEPENDENT areas — upper lip, chin, chest, areolae, linea alba, lower back, buttocks, inner thighs, external genitalia. Hypertrichosis is excess hair of any type in non-androgenic distribution, generalised, and is usually drug-induced, familial or associated with systemic illness — and it is not usually improved by anti-androgen treatment; identify and address the medication, nutritional, endocrine, neurological or systemic cause where present. <b>Getting this wrong means months of ineffective hormonal treatment.</b>"},
    {tone:"amber", h:"PCOS is the commonest cause — but diagnose it, do not assume it", html:"PCOS is the commonest cause of hirsutism and androgen excess in reproductive-age women, but the likelihood depends on age, clinical phenotype, biochemical severity and referral population. Rapid progression, virilisation, marked biochemical androgen excess and postmenopausal onset are atypical for uncomplicated PCOS. In adults, PCOS is diagnosed after exclusion of other causes when two of three are present: ovulatory dysfunction, clinical or biochemical hyperandrogenism, and polycystic ovarian morphology (or, in appropriate adults, raised AMH). Where irregular cycles and clinical hyperandrogenism are both present, ovarian ultrasound is generally not required. Do not diagnose PCOS solely from hirsutism, ovarian morphology or a mildly abnormal LH:FSH ratio — the ratio is neither required nor diagnostic. In adolescents, do not use ultrasound or AMH routinely early after menarche (International PCOS guideline, 2023). Idiopathic hirsutism (normal cycles, normal androgens) is the next commonest. Together they account for the great majority, so the workup is a short, targeted screen — not an exhaustive endocrine hunt. See <a href='pcos.html'>PCOS</a>."},
    {tone:"blue", h:"The bloods, and the numbers that mean something", html:"Total testosterone is the primary test — take it in the morning (08:00–10:00, fasted), in the early follicular phase where cycles allow. A normal or mildly raised level fits PCOS or idiopathic hirsutism. <b>A total testosterone around or above 5 nmol/L</b> is a marker of severe biochemical androgen excess: confirm it using a reliable method, preferably LC-MS/MS, and arrange urgent endocrinology/gynaecology assessment and appropriate ovarian/adrenal imaging (Society for Endocrinology, 2025). Do not assume the cause is a tumour or CAH — and a lower level does not exclude a tumour where there is rapid progression or virilisation. Add SHBG with a calculated free androgen index, and HbA1c and lipids if PCOS or metabolic risk is present. Add by presentation only: prolactin (amenorrhoea, galactorrhoea, pituitary symptoms), TSH (thyroid symptoms or unexplained menstrual disturbance), 17-hydroxyprogesterone (if non-classic CAH is plausible), DHEAS (rapid progression, virilisation or adrenal concern), and cortisol testing only with convincing features of Cushing's. LH/FSH is not a routine part of the panel."},
    {tone:"green", h:"Hormonal treatment needs about 6 months — say so before starting", html:"Hormonal and anti-androgen treatment generally does not allow a fair assessment of hirsutism before approximately six months; maximum benefit takes 9–12 months. This does not apply to cosmetic treatment, which acts immediately or over several sessions, or to eflornithine, which may show benefit within about 8 weeks. Review sooner for adverse effects, pregnancy, virilisation or clinical deterioration. Existing terminal hair does not disappear — treatment stops NEW conversion, so cosmetic measures remain necessary alongside. A woman who expects results in six weeks stops at eight weeks and concludes nothing works. The expectation-setting is the intervention."},
    {tone:"purple", h:"🟣 NICE NG12 (updated April 2026) — the honest position", html:"Hirsutism itself has no NG12 suspected-cancer criterion, and none is invented here; hirsutism with mild bloating does not automatically meet the pathway. Apply the criteria exactly as written in the <a href='https://www.nice.org.uk/guidance/ng12/chapter/Recommendations-organised-by-site-of-cancer#gynaecological-cancers' rel='noopener'>NG12 gynaecological cancer recommendations</a>. But the NG12 ovarian route runs through the examination this page requires: any woman with ascites, or a pelvic or abdominal mass not obviously uterine fibroids → urgent suspected ovarian cancer referral; and, aged 40 or over with persistent or frequent (particularly more than 12 times a month) abdominal distension, early satiety or loss of appetite, pelvic or abdominal pain, or urinary urgency or frequency → CA-125, with urgent direct-access ultrasound if at or above the age-specific threshold (≥35 IU/mL at 40–49, ≥31 at 50–59, ≥24 at 60–69, ≥25 at 70–79, ≥31 at 80 and over); aged 39 or under, do not rely on CA-125 alone — consider ultrasound for persistent symptoms. An androgen-secreting ovarian tumour is found by pelvic examination and imaging, not by a hormone panel alone — so the examination is not optional."}
  ],
  pathwaySub:"Five steps. The first two take two minutes and sort the emergency from the everything-else.",
  pathway:[
    {title:"Ask how fast it came on", html:"Years, gradually, from puberty → PCOS or idiopathic. Weeks to months, progressive, with virilisation, or new after the menopause → urgent referral and urgent bloods for an androgen-secreting tumour or Cushing's.", alert:true},
    {title:"Confirm it is hirsutism, not hypertrichosis", html:"Terminal hair in androgen-dependent sites = hirsutism. Fine or generalised hair in non-androgenic distribution = hypertrichosis — review the drug list and look for systemic causes instead."},
    {title:"Quantify and examine", html:"Ferriman-Gallwey score across nine areas, interpreted by ethnicity and recent hair removal, and recorded as one measure of change alongside her own assessment of burden. Examine for acne, acanthosis nigricans, male-pattern balding, clitoromegaly, abdominal striae, a pelvic or abdominal mass, BMI and blood pressure."},
    {title:"Targeted bloods", html:"Morning early-follicular total testosterone and SHBG, with a calculated free androgen measure; HbA1c (or appropriate glucose assessment) and lipids where PCOS or metabolic risk is present. Only when indicated: prolactin and TSH; DHEAS for rapid progression, virilisation or adrenal concern; 17-OHP if CAH is plausible; cortisol testing only with clinical features of Cushing's. LH/FSH is not routine."},
    {title:"Treat — and commit to six months", html:"Shared decision-making: cosmetic measures immediately if wanted; supported weight management where relevant and wanted, never as a precondition; a combined hormonal contraceptive if suitable, with co-cyprindiol second-line after weighing VTE risk; an anti-androgen such as spironolactone only with effective contraception and generally after an adequate first-line trial; topical eflornithine for facial hair; metformin for metabolic indications. <b>Judge hormonal and anti-androgen efficacy at about 6 months; review safety and tolerability sooner.</b>"}
  ],

    {id:"safety", nav:"Red flags", title:"Red flags — the rare dangerous causes",
     blocks:[
       {b:"table", head:["Feature","Meaning","Action"], rows:[
         ["<b>Rapid onset over weeks to months, progressive</b>","<b>Androgen-secreting ovarian or adrenal tumour</b> — gradual onset over years is reassuring; speed is the discriminator","Urgent endocrine or gynaecology referral with urgent total testosterone and DHEAS. Do not start a hormonal trial and review in six months"],
         ["Virilisation: deepening voice, clitoromegaly, increased muscle bulk, male-pattern temporal balding, breast atrophy","<b>Marked androgen excess — tumour, or non-classical CAH</b>","Urgent referral. Voice change and clitoromegaly are the two most specific findings and must be asked about and examined for"],
         ["<b>Total testosterone around or above 5 nmol/L</b>","<b>Severe biochemical androgen excess</b> — not proof of a tumour or CAH; interpret against the assay, reference range and clinical presentation","Confirm using a reliable method, preferably LC-MS/MS, and arrange urgent endocrinology/gynaecology assessment, with ovarian and/or adrenal imaging as the specialist directs (Society for Endocrinology, 2025). A lower testosterone does not exclude a tumour where there is rapid progression or virilisation"],
         ["A result that does not fit the clinical picture","<b>Assay error, or an unexpected source of androgen</b>","Discuss urgently with endocrinology rather than acting on, or dismissing, a single number"],
         ["<b>New androgen excess after the menopause</b>","<b>Ovarian hyperthecosis or an androgen-secreting tumour</b> — the two overlap, and hyperthecosis tends to progress more slowly","Specialist assessment urgently; do not attribute it to PCOS, which begins in the reproductive years"],
         ["Hirsutism or other androgen signs <b>before puberty</b>","<b>Precocious puberty, CAH or a tumour</b>","Refer every child — see the <a href='precocious-puberty.html'>precocious puberty pathway</a>"],
         ["<b>Markedly raised DHEAS</b>","<b>Adrenal source — adrenal tumour or CAH</b>","<b>Urgent endocrinology referral</b>"],
         ["Proximal muscle weakness (difficulty rising from a chair), easy bruising, facial plethora, wide purple striae, new hypertension or diabetes","<b>Cushing's syndrome</b> — central weight gain and a round face alone are common in PCOS and do not discriminate","Overnight dexamethasone suppression test or late-night salivary cortisol, and endocrinology referral"],
         ["<b>Ascites, or a pelvic or abdominal mass not obviously fibroids</b>","<b>Ovarian malignancy</b>","NICE NG12 (updated April 2026): urgent suspected ovarian cancer referral. This is found on examination — which is why examination is part of this workup"],
         ["Hirsutism with severe insulin resistance — marked acanthosis nigricans, very high BMI, young onset","<b>Severe insulin-resistance syndromes; substantial metabolic risk</b>","HbA1c, lipids, blood pressure; treat as high cardiometabolic risk and seek urgent endocrinology assessment if a severe insulin-resistance syndrome is suspected"],
         ["Hirsutism with primary amenorrhoea, ambiguous genitalia, salt-wasting history or short stature","<b>Classical or non-classical congenital adrenal hyperplasia</b>","17-hydroxyprogesterone (early morning, follicular) and endocrinology referral"],
         ["Significant psychological distress, social withdrawal, or self-harm related to appearance","<b>The impact is frequently severe and routinely under-asked</b>","Ask directly, assess mood and risk on the day, and treat the distress alongside the hirsutism rather than after it"]
       ]},
       {b:"cards", items:[
         {tone:"purple", h:"Suspected cancer · NICE NG12 (updated April 2026) — ovarian features only", html:"Hirsutism itself has no NG12 criterion, and hirsutism with mild bloating does not automatically meet the pathway — apply the <a href='https://www.nice.org.uk/guidance/ng12/chapter/Recommendations-organised-by-site-of-cancer#gynaecological-cancers' rel='noopener'>NG12 gynaecological cancer recommendations</a> as written. The purple route applies only when the history or examination finds an ovarian feature: <b>ascites, or a pelvic or abdominal mass not obviously uterine fibroids → urgent suspected ovarian cancer referral</b>; aged 40 or over with persistent or frequent (particularly more than 12 times a month) bloating, early satiety or loss of appetite, pelvic or abdominal pain, or urinary urgency or frequency → CA-125, with urgent direct-access ultrasound if at or above the age-specific threshold (≥35 IU/mL at 40–49, ≥31 at 50–59, ≥24 at 60–69, ≥25 at 70–79, ≥31 at 80 and over); aged 39 or under, do not rely on CA-125 alone — consider ultrasound for persistent symptoms.", src:"NICE NG12 (updated April 2026)"}
       ]},
       {b:"why", html:"<b>Why pace matters more than quantity.</b> Androgen-secreting ovarian tumours (such as Sertoli–Leydig cell tumours) and adrenocortical tumours are rare — 0.2% in one historical specialist referral cohort (Azziz et al., JCEM 2004), which is not a primary-care prevalence — but they are the reason the question \"how quickly did this come on?\" matters more than how much hair there is. The Society for Endocrinology guideline (Elhassan et al., Clin Endocrinol 2025) advises that a testosterone around or above 5 nmol/L warrants urgent further investigation with mass-spectrometry confirmation and imaging — a marker of severe androgen excess rather than proof of a tumour — and notes that abrupt onset, rapid progression and virilisation (voice deepening, increased muscle mass) are the clinical pointers to an ovarian tumour. The Endocrine Society (international, 2018) likewise advises prompt evaluation for rapid progression or virilisation. Cushing's syndrome is screened for only when the catabolic features are present, because testing on central weight gain alone produces false positives."},
       {b:"warn" , html:"<b>Two errors, in opposite directions.</b> <b>The first is treating the rare case as routine:</b> a woman with six months of rapidly worsening facial hair and a voice her family has noticed does not need a six-month pill trial — she needs urgent bloods and a referral this week. <b>The second, far commoner, is over-investigating the typical case:</b> a woman with gradual hirsutism since her teens, irregular periods and a normal examination needs a short targeted screen and effective treatment, not a serial endocrine workup that delays the thing that would actually help. <b>The rate-of-onset question separates the two in one sentence.</b>"}
     ]},

    {id:"assess", nav:"Assess", title:"Assessment — hirsutism versus hypertrichosis, and quantifying it",
     blocks:[
       {b:"dl", rows:[
         ["<b>Hirsutism</b>","Excess TERMINAL hair — coarse, pigmented, over 5 mm — in androgen-dependent areas: upper lip, chin and jawline, chest and areolae, upper and lower abdomen (linea alba), upper and lower back, buttocks, inner thighs, external genitalia. <b>Androgen-driven, and therefore responsive to anti-androgen treatment.</b>"],
         ["<b>Hypertrichosis</b>","Excess hair of any type (including fine vellus) in a non-androgenic, often generalised distribution. Causes: drugs (minoxidil, ciclosporin, phenytoin, diazoxide, some antipsychotics, systemic corticosteroids), anorexia nervosa, hypothyroidism, porphyria, paraneoplastic syndromes, and familial or racial variation. It is not usually improved by anti-androgen treatment: identify and address the medication, nutritional, endocrine, neurological or systemic cause where present. Not every patient with generalised hair growth needs extensive endocrine investigation."],
         ["<b>Ferriman-Gallwey scoring</b>","Score 0–4 in each of nine androgen-sensitive areas (upper lip, chin, chest, upper abdomen, lower abdomen, upper back, lower back, upper arms, thighs); maximum 36. A modified score of 4–6 or more, depending on ethnicity, indicates hirsutism (International PCOS guideline, 2023; the older Endocrine Society cut-off of 8 is no longer used) — the threshold varies by ethnicity, and self-treatment (waxing, threading, laser) suppresses the score, so ask what she already removes. Record the number as one measure of change, alongside patient-reported burden, the time, cost and frequency of hair removal, quality of life, acne, menstrual and scalp-hair symptoms, and objective progression or stability. The score is less reliable after recent waxing, threading, shaving or laser treatment; it is a clinical aid, not a diagnostic threshold applicable uniformly across ethnicities."],
         ["<b>Ethnicity matters to interpretation</b>","Normal terminal hair density differs between populations — the International PCOS guideline (2023) uses a modified score of 4–6 or more depending on ethnicity, with lower thresholds in some (for example East Asian) populations. Ethnicity also changes the likelihood of non-classic CAH. Distress is not proportional to the score, and a woman below the threshold who is significantly distressed still warrants assessment and treatment."]
       ]},
       {b:"table", head:["Assessment element","What to look for"], rows:[
         ["<b>History</b>","Rate of onset and progression · age at onset relative to puberty, and any onset after the menopause · menstrual history — cycles shorter than 21 or longer than 35 days, or fewer than 8 a year, indicate ovulatory dysfunction (International PCOS guideline, 2023) · symptoms of Cushing's (weight gain, proximal weakness, bruising, low mood) · fertility and pregnancy plans · acne and greasy skin · scalp hair loss · weight change · voice change · libido and clitoral change · family history of hirsutism, PCOS or CAH · ethnicity · current and past hair-removal methods"],
         ["<b>Drug history — worth its own question</b>","<b>True hirsutism:</b> anabolic steroids and testosterone (including gym supplements, online purchases, and accidental transfer from a partner's testosterone gel) · danazol · progestogens with androgenic activity (norethisterone, levonorgestrel) · sodium valproate. <b>Hypertrichosis instead:</b> minoxidil · ciclosporin · phenytoin · diazoxide · systemic corticosteroids. Ask about anabolic steroid use directly and without judgement — it is under-disclosed and reversible"],
         ["<b>Examination</b>","Ferriman-Gallwey score · acne · seborrhoea · acanthosis nigricans (neck, axillae — a marker of insulin resistance) · male-pattern balding · clitoromegaly · breast atrophy · abdominal striae and central adiposity · abdominal and pelvic examination for a mass or ascites · thyroid (goitre, clinical hypo- or hyperthyroidism) · galactorrhoea (hyperprolactinaemia) · the discriminating Cushing's signs — proximal myopathy, thin skin with easy bruising, facial plethora, wide purple striae · BMI, waist circumference and blood pressure"],
         ["<b>Psychological impact</b>","Ask what it stops her doing — photographs, swimming, intimacy — how much time and money removal takes, and about mood, anxiety and social avoidance. Distress frequently exceeds what the score would predict, and it is the reason she has come"],
         ["<b>Fertility wishes</b>","Pregnancy plans decide the whole treatment choice — systemic anti-androgens are unsafe in pregnancy, and subfertility in PCOS needs a different route"]
       ]},
       {b:"why", html:"<b>Why the drug question and the hypertrichosis distinction come early.</b> Exogenous androgens — including transfer from a partner's gel — and anabolic steroids are under-disclosed and fully reversible, while minoxidil, ciclosporin and phenytoin produce generalised hypertrichosis that is not usually improved by an anti-androgen. The modified Ferriman–Gallwey score (Ferriman and Gallwey 1961, later modified) is the standard visual scale, and recording a baseline number, alongside her own assessment, helps make the six-month review objective. Acanthosis nigricans is a visible marker of insulin resistance and moves the metabolic screen up the list; clitoromegaly and voice change are the most specific signs of significant androgen excess and point towards a tumour or exogenous androgen rather than PCOS."}
     ]},

    {id:"ddx", nav:"Differential", title:"Differential diagnosis — make PCOS positively, then pick out what does not fit",
     sub:"PCOS is the commonest cause in reproductive-age women, but the likelihood depends on age, phenotype, biochemical severity and referral population. The workup is a short targeted screen.",
     blocks:[
       {b:"table", head:["Condition","Discriminating features","Next step"], rows:[
         ["<b>PCOS</b> — by far the commonest","Gradual onset around puberty, irregular cycles, normal or mildly raised testosterone, low SHBG; two of three Rotterdam criteria after excluding other causes — not diagnosed from hirsutism, ovarian morphology or LH:FSH alone","Metabolic screen (HbA1c, lipids, BP); treat in primary care — see <a href='pcos.html'>PCOS</a>"],
         ["<b>Idiopathic hirsutism</b> — next most common","Regular ovulatory cycles and normal androgens; thought to reflect increased skin sensitivity to androgen","Treat exactly as PCOS-related hirsutism"],
         ["<b>Non-classic CAH</b> — the great mimic","Looks like PCOS; clues are a strong family history, higher-risk ethnicity (for example Ashkenazi Jewish or Mediterranean), and onset around or before puberty","Early-morning follicular 17-hydroxyprogesterone; raised → endocrinology for an ACTH (Synacthen) stimulation test (Speiser et al., JCEM 2018)"],
         ["<b>Androgen-secreting ovarian or adrenal tumour</b> — rare but important","Rapid onset, virilisation, a confirmed testosterone around or above 5 nmol/L or a very high DHEAS — a lower testosterone does not exclude it","Urgent endocrinology/gynaecology assessment; imaging per specialist (Society for Endocrinology, 2025)"],
         ["<b>Ovarian hyperthecosis</b> (after the menopause)","New or worsening androgen excess after the menopause; slower than a tumour but the two overlap","Specialist assessment — do not label as PCOS"],
         ["<b>Cushing's syndrome</b>","Only when the discriminating features are present: proximal myopathy, bruising, plethora, wide purple striae","1 mg overnight dexamethasone suppression test or late-night salivary cortisol, then endocrinology"],
         ["<b>Hyperprolactinaemia or thyroid disease</b>","Menstrual disturbance plus galactorrhoea or thyroid symptoms","Prolactin and TSH; correcting the cause often restores the cycle"],
         ["<b>Severe insulin-resistance syndromes</b>","Marked acanthosis nigricans, very high BMI or young-onset diabetes, sometimes with severe androgen excess (Society for Endocrinology, 2025)","HbA1c and lipids; discuss with endocrinology if extreme"],
         ["<b>Drug-induced</b>","Androgens, anabolic steroids, danazol, valproate, a partner's testosterone gel","Stop or switch where safe and recheck"],
         ["<b>Hypertrichosis</b> (not hirsutism)","Fine or generalised hair in a non-androgenic distribution; minoxidil, ciclosporin, phenytoin, anorexia nervosa, hypothyroidism, familial","Treat the cause; anti-androgens do not usually help"]
       ]},
       {b:"why", html:"<b>Why a short screen rather than an exhaustive hunt.</b> PCOS is the commonest cause, although published proportions come from specialist referral cohorts — for example, in one historical referral series of 873 women with androgen excess, PCOS accounted for 82%, non-classic CAH for 1.6% and androgen-secreting neoplasms for 0.2% (Azziz et al., JCEM 2004) — and do not translate directly to primary care. Rapid progression, virilisation, marked biochemical androgen excess and postmenopausal onset are atypical for uncomplicated PCOS. The job is therefore to make the PCOS diagnosis positively, treat its metabolic risk, and pick out the few women whose pace, examination or testosterone does not fit. The Society for Endocrinology (2025) points out that severe androgen excess can also come from severe insulin-resistance syndromes, which is why marked acanthosis matters."}
     ]},

    {id:"bloods", nav:"Bloods", title:"Investigations and how to interpret them",
     blocks:[
       {b:"table", head:["Test","When and how","Interpretation"], rows:[
         ["<b>Total testosterone</b>","The primary test. Morning sample (08:00–10:00 after an overnight fast), in the early follicular phase where cycles allow, or at any time if she is oligo- or amenorrhoeic. Combined hormonal contraception increases SHBG and suppresses ovarian androgen production, making biochemical assessment difficult. If androgen measurement is essential, consider specialist or endocrinology advice before stopping it; if stopped, alternative effective contraception is required, and a minimum three-month washout may be needed for reliable interpretation","Normal or mildly raised → PCOS or idiopathic hirsutism. <b>Around or above 5 nmol/L → severe biochemical androgen excess</b>: confirm by LC-MS/MS and arrange urgent endocrinology/gynaecology assessment with ovarian/adrenal imaging (Society for Endocrinology, 2025). Do not assume a tumour or CAH; a lower level does not exclude a tumour where there is rapid progression or virilisation. Interpret against the local female reference range. A normal level does NOT exclude PCOS"],
         ["<b>SHBG (and calculated free androgen index)</b>","<b>With the testosterone.</b> Free androgen index = (total testosterone ÷ SHBG) × 100","SHBG is often LOW in PCOS, obesity and insulin resistance, which raises free (active) androgen even when total testosterone is normal — this explains clinically obvious hirsutism with an unremarkable testosterone. Use the laboratory's reference range for the FAI; it helps most when total testosterone is borderline"],
         ["<b>LH and FSH</b>","<b>Not routine</b> — not required to diagnose PCOS; consider where amenorrhoea raises ovarian insufficiency (early follicular where cycles allow)","The LH:FSH ratio is neither required nor diagnostic for PCOS; normal values do not exclude it. A high FSH with amenorrhoea points to ovarian insufficiency instead"],
         ["<b>DHEAS</b>","Where onset is rapid, virilisation is present, or an adrenal source is suspected","<b>Markedly raised → adrenal tumour or CAH → urgent endocrinology</b>. Mildly raised is common and non-specific. The Society for Endocrinology (2025) does not set a single safe cut-off because assays vary"],
         ["<b>Prolactin and TFTs</b>","Prolactin: amenorrhoea, galactorrhoea or other pituitary symptoms. TSH: thyroid symptoms or unexplained menstrual disturbance","Hyperprolactinaemia and thyroid disease both cause menstrual disturbance and are easily treated — see <a href='hyperprolactinaemia.html'>hyperprolactinaemia</a>, <a href='hypothyroidism.html'>hypothyroidism</a>"],
         ["<b>17-hydroxyprogesterone</b>","Early morning, follicular phase, where non-classical CAH is suspected — young onset, strong family history, particular ethnic backgrounds, or high androgens","<b>Raised → endocrinology referral for a short Synacthen (ACTH stimulation) test</b>, the confirmatory test in the Endocrine Society CAH guideline (Speiser et al., JCEM 2018)"],
         ["<b>Cortisol screen</b>","Overnight dexamethasone suppression test or late-night salivary cortisol where Cushing's features are present","<b>Do not screen for Cushing's routinely</b> — only where there are corroborating clinical features"],
         ["<b>Metabolic screen</b>","HbA1c or appropriate glucose assessment, lipid profile, blood pressure, BMI and waist circumference where PCOS is likely or suspected","PCOS carries genuine cardiometabolic risk, and this is the part of the consultation with the largest long-term effect — see <a href='pcos.html'>PCOS</a>"],
         ["<b>Pelvic ultrasound</b>","Where PCOS is being confirmed on Rotterdam criteria, where an adnexal mass is suspected, or where androgens are markedly raised (then urgently)","Not required to treat hirsutism, and generally not needed for diagnosis when irregular cycles and clinical hyperandrogenism are both present; a normal scan does not exclude PCOS if two other criteria are met. In adults, polycystic morphology is ≥20 follicles (2–9 mm) in either ovary on a transvaginal scan, or an ovarian volume ≥10 mL; AMH is an alternative in adults. Do not use ultrasound or AMH to diagnose PCOS within 8 years of menarche (International PCOS guideline, 2023)"]
       ]},
       {b:"why", html:"<b>Two interpretive traps are worth naming.</b> First, a normal total testosterone in a woman with obvious hirsutism is common and is not a reason to stop — low SHBG raises the free fraction, and idiopathic hirsutism is defined precisely by normal androgens with normal cycles, so the treatment is the same. Second, hormonal contraception suppresses androgen levels, so testing a woman already on the pill produces a reassuring number that means nothing. Immunoassays also over-read at the low testosterone concentrations found in women, which is why the Society for Endocrinology (2025) prefers liquid chromatography–mass spectrometry and asks for a high result to be confirmed that way. If the result would change management, either test before starting or accept that the numbers will be uninterpretable — and say which you are doing, rather than acting on a suppressed result. Do not advise stopping a combined pill without discussing pregnancy prevention, symptom control and the reason for testing."}
     ]},

    {id:"treat", nav:"Treat", title:"Treatment — and the six-month rule for hormonal and anti-androgen therapy",
     sub:"Existing terminal hair does not disappear. Treatment prevents new conversion, so cosmetic measures continue alongside.",
     blocks:[
       {b:"table", head:["Step","Treatment","Notes"], rows:[
         ["<b>0 · Set the expectation, before prescribing anything</b>","\"Hormonal and anti-androgen treatment generally cannot be fairly assessed before about 6 months; maximum benefit takes 9–12 months. Hair removal works straight away and the facial cream may help within weeks. It stops new coarse hair developing — it does not remove what is already there, so hair removal continues alongside.\"","This is the step that determines adherence. Without it, treatment is abandoned at 8 weeks and recorded as ineffective"],
         ["<b>1 · Weight and metabolic (where relevant and wanted)</b>","For people with higher weight and PCOS, supported lifestyle intervention can improve metabolic health and may improve cycle regularity and androgen excess. Benefits vary","Treatment should not be conditional on weight loss — it is not a prerequisite for treating hirsutism, contraception, menstrual symptoms or psychological distress. Offer evidence-based weight-management support according to her goals, comorbidities and preferences"],
         ["<b>2 · Cosmetic measures — offer them as legitimate treatment, from the start if wanted</b>","Plucking, waxing, threading, depilatory creams, shaving (which does NOT increase growth), bleaching; electrolysis for permanent removal of small areas and of pale or grey hair that laser cannot target; laser and IPL work best on dark hair, and long-pulsed Nd:YAG lasers are safer on darker skin types. Several sessions are needed","Shaving does not make hair grow back thicker — correct this myth explicitly, it is nearly universal. Laser and electrolysis are usually private; be honest about cost rather than implying NHS availability"],
         ["<b>3 · Hormonal first-line</b>","Consider a combined hormonal contraceptive for hirsutism and/or irregular cycles if medically eligible and acceptable to her; no single preparation is established as best for everyone. Co-cyprindiol (ethinylestradiol 35 µg / cyproterone acetate 2 mg) should generally be reserved for second-line use when the benefits for significant hirsutism or acne outweigh its increased VTE risk","Select the preparation using FSRH UKMEC and her VTE, cardiovascular, migraine, smoking, BMI and other risk factors. Co-cyprindiol carries a higher VTE risk than standard CHCs, is licensed for moderate-to-severe hirsutism and acne, and is not routine first-line — review the need periodically and withdraw 3–4 cycles after the condition has resolved (SPC). All CHCs also provide the contraception that anti-androgens require. Meningioma (<a href='https://www.gov.uk/drug-safety-update/cyproterone-acetate-new-advice-to-minimise-risk-of-meningioma' rel='noopener'>MHRA Drug Safety Update, June 2020</a>): risk increases with cumulative dose and is greatest with higher-dose cyproterone, which co-cyprindiol is not equivalent to; cyproterone-containing products are contraindicated in current or previous meningioma"],
         ["<b>4 · Add an anti-androgen if response is inadequate at 6 months</b>","Spironolactone 50–100 mg OD (off-label for hirsutism; dosing, including up to 200 mg, must follow the local formulary and specialist advice)","Effective, and the usual add-on. Avoid during pregnancy because of potential anti-androgenic effects on a male fetus; ensure effective contraception when pregnancy is possible and stop if pregnancy occurs. Check baseline renal function and potassium, and repeat after initiation or dose escalation according to the local protocol, age, renal function, dose and interacting medicines (<a href='https://www.sps.nhs.uk/monitorings/spironolactone-monitoring/' rel='noopener'>SPS monitoring</a>). Monitor more closely with CKD, older age, ACE inhibitors, ARBs, potassium supplements or other potassium-raising drugs — these are cautions requiring judgement and monitoring, not absolute contraindications. Menstrual irregularity is common"],
         ["<b>5 · Facial hair specifically</b>","<b>Topical eflornithine 11.5% cream</b> (Vaniqa) to the face and under the chin, twice daily at least 8 hours apart","Slows growth rather than removing hair; works best combined with laser or other removal. Improvement may be seen within 8 weeks; stop if there is no benefit after 4 months. Hair returns towards baseline within about 8 weeks of stopping (Vaniqa SPC). If irritation occurs, reduce to once daily. Judge it on this timescale, not the six-month rule, and prescribe and counsel according to the current product information and local formulary"],
         ["<b>6 · Where metabolic features dominate</b>","Metformin — modest effect on hirsutism, greater effect on cycle regularity, insulin resistance and ovulation","Not primarily a hirsutism drug: choose it when PCOS metabolic features or fertility are the main issue. See <a href='pcos.html'>PCOS</a>"],
         ["<b>7 · Specialist-only options</b>","Finasteride, flutamide and higher-dose cyproterone are not for primary-care initiation","Flutamide carries potentially severe hepatotoxicity and should not be initiated in routine primary care; finasteride is off-label, specialist-led in women and contraindicated in pregnancy. <b>Refer rather than initiate</b>"],
         ["<b>Medication review</b>","Stop or switch androgenic drugs where clinically safe; ask directly and without judgement about anabolic steroids or a partner's testosterone gel","A reversible cause is the quickest win on this page"],
         ["<b>What NOT to do</b>","Do not use an anti-androgen when pregnancy is possible unless effective contraception is in place — discuss contraception explicitly and document the decision · do not judge hormonal or anti-androgen treatment before about 6 months · do not expect anti-androgens to improve hypertrichosis — treat its cause · do not screen for Cushing's without clinical features","This matters most for spironolactone, finasteride, flutamide and higher-dose cyproterone, because of potential effects on a male fetus"]
       ]},
       {b:"say" , html:"I want to be honest about what treatment does and how long it takes, because this is where most people get disheartened. The tablets work by stopping new coarse hairs from developing — they do not remove the hairs that are already there. That means you will still need to manage those the way you do now, and the benefit shows up as less new growth over time. The tablets usually show little in the first three months. Six months is the earliest point at which we can fairly judge them, and the full effect takes nine to twelve. Hair removal works straight away, and the face cream can help within weeks. I will see you sooner if you have side effects or might be pregnant. So I would like us to agree now to stick with this until we review it properly at six months, rather than deciding at six weeks that it has not worked."},
       {b:"why", html:"<b>Why this order.</b> The Endocrine Society (international, 2018) suggests a combined oral contraceptive as initial treatment for most women with hirsutism who are not seeking pregnancy, adding an anti-androgen after six months if the response is not enough, and advises against anti-androgen monotherapy without adequate contraception because of the potential risk to a male fetus. The International PCOS guideline (2023) makes supported lifestyle intervention part of PCOS care — benefits vary, and treatment is not conditional on weight loss. It advises that 35 µg ethinylestradiol plus cyproterone acetate preparations should not be first-line because of adverse effects including VTE risk, and supports anti-androgens only with effective contraception after an inadequate response to at least six months of combined hormonal and/or cosmetic treatment. Drug treatment only stops new terminal hairs forming, so direct removal is part of treatment rather than an inferior alternative. Laser choice depends on skin type because melanin in darker skin absorbs shorter-wavelength light and risks pigment change."}
     ]},

    {id:"monitor", nav:"Follow up", title:"Review and monitoring",
     blocks:[
       {b:"table", head:["When","What to check"], rows:[
         ["<b>After starting or increasing spironolactone (timing per local protocol and SPS)</b>","Potassium, renal function and blood pressure; symptoms of hyperkalaemia; confirm contraception is in place and reliable"],
         ["<b>3 months</b>","Tolerance, adverse effects and adherence — NOT hormonal or anti-androgen efficacy. Reinforce that hormonal treatment is judged at about 6 months. Check contraception, pregnancy status and mood"],
         ["<b>6 months</b>","Repeat the Ferriman-Gallwey score against baseline · her own assessment of new growth, time and cost spent on removal and quality of life · add or escalate if inadequate · continue if improving, since benefit accrues to 9–12 months"],
         ["<b>Menstrual regularity (not on a CHC)</b>","If she has fewer than one bleed every 3–4 months, induce a withdrawal bleed with a progestogen, or offer a CHC or the levonorgestrel IUS, to protect the endometrium (RCOG Green-top Guideline No. 33, 2014); persistent abnormal bleeding needs assessment"],
         ["<b>Fertility planning</b>","When contraception is stopped for pregnancy, stop the anti-androgen first and optimise weight; refer for ovulation induction if needed"],
         ["<b>Annually</b>","BMI, blood pressure, HbA1c and lipids where PCOS — PCOS carries a raised risk of type 2 diabetes and gestational diabetes (RCOG GTG No. 33; International PCOS guideline, 2023) · ask about snoring and daytime sleepiness · UKMEC recheck and VTE risk on a CHC (particularly co-cyprindiol, where the continuing need should be reviewed) · potassium and renal function on spironolactone per local protocol · contraception still reliable · mood · fertility plans, which change the whole plan"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 Contact us urgently", html:"\"If your voice starts to deepen, or the hair growth speeds up noticeably, or you notice changes in your body shape, muscle bulk, breasts or genital area, or new excess hair after the menopause, or you develop new bloating or pelvic pain — come back promptly rather than waiting for the review.\"", src:"Society for Endocrinology 2025 · NICE NG12 (updated April 2026)"},
         {tone:"amber", h:"🟠 On spironolactone", html:"\"Use effective contraception if you could become pregnant, because this medicine may affect a developing male baby. Stop it and tell me straight away if you might be pregnant. Come for the blood tests to check your kidneys and potassium, and tell me about muscle weakness, palpitations, dizziness or feeling unwell.\"", src:"Spironolactone SPC · SPS spironolactone monitoring"},
         {tone:"blue", h:"💊 Judge the tablets at six months", html:"\"Do not assess the hormone tablets before six months, and do not stop at three because little seems to be happening — that is expected. Hair removal and the face cream can help sooner, and come back earlier if you have side effects or might be pregnant.\"", src:"Endocrine Society (international) — Martin et al., JCEM 2018"},
         {tone:"green", h:"✓ Shaving does not make it worse", html:"\"Shaving does not make hair grow back thicker or faster — that is a myth. Use whatever removal method suits you; it will not undermine the treatment.\"", src:"Endocrine Society (international) — Martin et al., JCEM 2018"}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Urgent endocrinology or gynaecology", html:"Rapid or progressive androgen excess · any virilisation (voice deepening, clitoromegaly, muscle bulk, breast atrophy) · marked testosterone elevation, approximately ≥5 nmol/L, after confirming the result · markedly raised DHEAS · new or worsening androgen excess after the menopause · suspected Cushing's syndrome (positive screen or strong clinical features) · suspected severe insulin-resistance syndrome · suspected ovarian or adrenal mass · a discordant result that does not fit the clinical picture. Refer on the clinical picture, not a single number alone. <b>Do not start a hormonal trial in any of these.</b> Gynaecology if the source looks ovarian. Use the local Greater Manchester endocrinology and gynaecology pathways.", src:"Society for Endocrinology 2025 · Endocrine Society (international) 2018"},
         {tone:"purple", h:"Suspected cancer · NICE NG12 (updated April 2026)", html:"Hirsutism has no NG12 criterion of its own and none is invented, and hirsutism with mild bloating does not automatically meet the pathway (see the <a href='https://www.nice.org.uk/guidance/ng12/chapter/Recommendations-organised-by-site-of-cancer#gynaecological-cancers' rel='noopener'>NG12 gynaecological cancer recommendations</a>) — but the ovarian route runs through the examination this workup requires. Ascites, or a pelvic or abdominal mass not obviously fibroids → urgent suspected ovarian cancer referral. Ovarian symptoms: aged 40 or over with persistent or frequent (particularly more than 12 times a month) abdominal distension, early satiety or loss of appetite, pelvic or abdominal pain, or urinary urgency or frequency → CA-125, with urgent direct-access ultrasound if at or above the age-specific threshold (≥35 IU/mL at 40–49, ≥31 at 50–59, ≥24 at 60–69, ≥25 at 70–79, ≥31 at 80 and over); aged 39 or under, do not rely on CA-125 alone — consider ultrasound for persistent symptoms.", src:"NICE NG12 (updated April 2026)"},
         {tone:"blue", h:"Endocrinology — routine", html:"Suspected non-classical congenital adrenal hyperplasia (raised 17-OHP) · diagnostic uncertainty · failure of appropriate primary-care treatment at adequate duration · need for finasteride, flutamide, higher-dose cyproterone or specialist hormonal therapy.", src:"Speiser et al., JCEM 2018 · Endocrine Society (international) 2018"},
         {tone:"blue", h:"Gynaecology / fertility", html:"Significant PCOS-related subfertility · anovulation requiring ovulation induction · suspected adnexal mass. See <a href='infertility.html'>infertility</a> and <a href='pcos.html'>PCOS</a>.", src:"International PCOS guideline (2023)"},
         {tone:"green", h:"Dermatology", html:"Severe hirsutism unresponsive to hormonal treatment · coexisting severe acne or hidradenitis · consideration of laser where locally commissioned.", src:"Endocrine Society (international) — Martin et al., JCEM 2018"},
         {tone:"green", h:"Psychological support", html:"Significant distress, social avoidance, low mood or anxiety related to appearance — refer to NHS Talking Therapies and treat alongside, not after. Appearance-related distress here is frequently severe and disproportionate to the score.", src:"International PCOS guideline (2023)"},
         {tone:"cream", h:"GP management", html:"Most hirsutism is managed entirely here: the rate-of-onset question, hirsutism versus hypertrichosis, a recorded Ferriman-Gallwey score, a short targeted blood screen, weight and metabolic risk, cosmetic measures offered as legitimate, a CHC if suitable (co-cyprindiol second-line), spironolactone with effective contraception if needed, and a six-month efficacy review — for gradual-onset PCOS or idiopathic hirsutism with no virilisation and no marked androgen excess. A patient with gradual hirsutism, clinical PCOS features and no virilisation need not routinely be referred before initial management. Prescribe according to the Greater Manchester formulary. Related pages: <a href='pcos.html'>PCOS</a> · <a href='hyperprolactinaemia.html'>hyperprolactinaemia</a> · <a href='acne.html'>acne</a> · <a href='contraception.html'>contraception</a> · <a href='../algorithms/irregular-periods.html'>irregular periods</a>.", src:"Society for Endocrinology 2025 · Endocrine Society (international) 2018"}
       ]},
       {b:"why", html:"<b>What the letter needs.</b> Give the pace of onset, the Ferriman–Gallwey score, the testosterone result (and whether she was on hormonal contraception when it was taken), and any virilising sign — these are what the specialist triages on. Urgent referral is kept for the features that predict a tumour or Cushing's, because delay in those cases risks progression of a malignant or hormonally active lesion; hirsutism alone is not a suspected-cancer referral, and the purple route belongs to the NG12 ovarian criteria only."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 24-year-old woman of South Asian heritage attends about facial hair on her chin and upper lip, which she has threaded weekly since she was 17 and which she says is \"getting worse\". Her periods come <b>every 6–10 weeks</b>. Her BMI is <b>31</b> and she has acne on her jawline and some darkening of the skin at the back of her neck. She has been using a friend's leftover \"hormone tablets\" for two months with no effect and is upset, saying she has stopped going to the gym and avoids photographs. She asks for <b>\"the laser on the NHS\"</b>.", src:"Endocrine Society (international) 2018 · International PCOS guideline (2023)"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Asks the rate-of-onset question and establishes this is gradual since her teens — not rapid virilisation; examines for virilisation and finds none, and identifies the acanthosis nigricans as insulin resistance; records a Ferriman-Gallwey score and asks what she already removes, recognising that threading suppresses the score; interprets the score in the context of her ethnicity while taking her distress seriously regardless; recognises the PCOS pattern on Rotterdam (oligomenorrhoea plus clinical hyperandrogenism) and does the metabolic screen — HbA1c, lipids, BP; sends a morning early-follicular testosterone and SHBG, and explains that a normal testosterone will not mean nothing is wrong; stops the borrowed medication and explains why sharing prescription hormones is unsafe; offers a CHC if UKMEC-eligible (co-cyprindiol only second-line, with the VTE caveat), and explains the six-month rule for hormonal treatment BEFORE prescribing; <b>corrects the expectation that treatment removes existing hair</b>; is honest that laser is rarely NHS-funded rather than implying it will be; offers weight-management support according to her goals and preferences, without making treatment conditional on weight loss; and asks about mood and social withdrawal, offering psychological support alongside.", src:"Society for Endocrinology 2025 · Endocrine Society (international) 2018 · FSRH UKMEC"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Sources for this page. Some statements rest on consensus guidance, product information or local policy rather than primary research.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>Endocrine Society (international) — Hirsutism clinical practice guideline (2018)</b><span class="rd"> — the hirsutism/hypertrichosis distinction, Ferriman-Gallwey scoring, the drug causes, the investigation set and thresholds for referral, and the treatment ladder with a 6-month trial for hormonal and anti-androgen treatment</span></li>'+
         '<li>Endocrine Society (international) — Evaluation and Treatment of Hirsutism in Premenopausal Women. Martin KA et al. J Clin Endocrinol Metab 2018;103:1233\u20131257<br><a href="https://academic.oup.com/jcem/article/103/4/1233/4924418" rel="noopener">academic.oup.com/jcem</a><span class="rd"> — combined oral contraceptive first, anti-androgen added after 6 months, no anti-androgen without contraception; ethnicity-adjusted Ferriman–Gallwey cut-offs; the role of SHBG and free androgen; and the position of spironolactone, finasteride and flutamide</span></li>'+
         '<li><b>Society for Endocrinology — Clinical Practice Guideline for the Evaluation of Androgen Excess in Women (2025)</b>. Elhassan YS et al. Clin Endocrinol 2025<br><a href="https://onlinelibrary.wiley.com/doi/10.1111/cen.15265" rel="noopener">onlinelibrary.wiley.com/doi/10.1111/cen.15265</a><span class="rd"> — testosterone above 5 nmol/L warrants further investigation with LC-MS/MS confirmation and ovarian/adrenal imaging; morning fasted early-follicular sampling; combined pill may need stopping for at least 3 months, with alternative contraception, where androgen measurement is essential; no single DHEAS cut-off; severe insulin resistance as a cause of severe androgen excess</span></li>'+
         '<li><b>International evidence-based guideline for the assessment and management of PCOS (international, 2023)</b><br><a href="https://academic.oup.com/jcem/article/108/10/2447/7242360" rel="noopener">academic.oup.com/jcem</a><span class="rd"> — irregular-cycle definitions, polycystic morphology (≥20 follicles or ≥10 mL; AMH in adults), no ultrasound or AMH within 8 years of menarche, adult and adolescent pathways separated, LH:FSH not diagnostic, combined pill for hyperandrogenism, 35 µg ethinylestradiol/cyproterone acetate not first-line (VTE), anti-androgens only with effective contraception after at least 6 months of hormonal and/or cosmetic treatment, lifestyle support, cardiometabolic risk</span></li>'+
         '<li><b>RCOG Green-top Guideline No. 33 — Long-term consequences of polycystic ovary syndrome (2014)</b><br><a href="https://www.rcog.org.uk/media/qmtlp2b0/gtg_33.pdf" rel="noopener">rcog.org.uk</a><span class="rd"> — withdrawal bleed at least every 3–4 months in oligo- or amenorrhoea; diabetes and gestational diabetes risk</span></li>'+
         '<li><b>MHRA Drug Safety Update, June 2020 — cyproterone acetate and meningioma</b><br><a href="https://www.gov.uk/drug-safety-update/cyproterone-acetate-new-advice-to-minimise-risk-of-meningioma" rel="noopener">gov.uk — Cyproterone acetate: new advice to minimise risk of meningioma</a><span class="rd"> — risk increases with cumulative dose, greatest with higher-dose cyproterone; contraindicated in current or previous meningioma for all indications</span></li>'+
         '<li><b>Vaniqa 11.5% cream — Summary of Product Characteristics</b><br><a href="https://www.medicines.org.uk/emc/product/6398/smpc" rel="noopener">medicines.org.uk/emc/product/6398</a><span class="rd"> — twice daily at least 8 hours apart; improvement within 8 weeks; stop after 4 months without benefit; relapse within 8 weeks of stopping</span></li>'+
         '<li>Endocrine Society (international) — Congenital adrenal hyperplasia due to steroid 21-hydroxylase deficiency. Speiser PW et al. J Clin Endocrinol Metab 2018<span class="rd"> — ACTH (Synacthen) stimulation to confirm non-classic CAH</span></li>'+
         '<li>Azziz R et al. Androgen excess in women: experience with over 1000 consecutive patients. J Clin Endocrinol Metab 2004<span class="rd"> — historical specialist referral cohort (not a primary-care prevalence): PCOS 82%, non-classic CAH 1.6%, androgen-secreting neoplasms 0.2% of 873 women</span></li>'+
         '<li><b>Rotterdam consensus criteria for PCOS (ESHRE/ASRM, international, 2003)</b><span class="rd"> — two of three: oligo/anovulation, clinical or biochemical hyperandrogenism, polycystic ovaries on ultrasound</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (2015, updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — urgent referral for ascites or a pelvic/abdominal mass, and the ovarian symptom set with age-specific CA-125 thresholds from age 40 and no reliance on CA-125 alone at 39 or under (recommendations 1.5.6\u20131.5.9 and 1.5.11 amended April 2026)</span></li>'+
         '<li><b>Product SPCs — co-cyprindiol, spironolactone, flutamide, finasteride</b><br><a href="https://www.medicines.org.uk/emc" rel="noopener">medicines.org.uk/emc</a><span class="rd"> — co-cyprindiol licensing, higher VTE risk and withdrawal 3–4 cycles after resolution; spironolactone pregnancy warnings; flutamide hepatotoxicity; finasteride contraindicated in pregnancy</span></li>'+
         '<li><b>NHS Specialist Pharmacy Service — Spironolactone monitoring</b><br><a href="https://www.sps.nhs.uk/monitorings/spironolactone-monitoring/" rel="noopener">sps.nhs.uk</a><span class="rd"> — baseline and follow-up potassium and renal function, risk-based frequency</span></li>'+
         '<li><b>Greater Manchester Medicines Management Group — formulary and local prescribing policy</b><br><a href="https://gmmmg.nhs.uk/" rel="noopener">gmmmg.nhs.uk</a></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — dose cross-check</span></li>'+
         '<li><b>FSRH — UKMEC</b><br><a href="https://www.fsrh.org" rel="noopener">fsrh.org</a><span class="rd"> — eligibility criteria applied before prescribing any combined hormonal contraceptive</span></li>'+
         '<li><b>Verity — the UK PCOS charity</b><br><a href="https://www.verity-pcos.org.uk" rel="noopener">verity-pcos.org.uk</a><span class="rd"> — patient support referenced for PCOS-related hirsutism</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Hirsutism — Society for Endocrinology (2025), Endocrine Society guidance (international, 2018), International PCOS guideline (2023), RCOG GTG No. 33 (2014), Rotterdam criteria (2003), NICE NG12 (updated April 2026), MHRA DSU (June 2020), product SPCs, SPS monitoring guidance, FSRH UKMEC and the BNF. Ask how fast it came on: gradual since puberty is usually PCOS or idiopathic, rapid with virilisation is a tumour until proven otherwise. Distinguish hirsutism from hypertrichosis — anti-androgens do not usually help the latter. Record a Ferriman-Gallwey score alongside her own assessment of burden. Targeted bloods; a confirmed testosterone around or above 5 nmol/L, or any virilisation, means urgent specialist assessment. Use a CHC first-line if suitable, co-cyprindiol second-line. Set the six-month expectation for hormonal and anti-androgen treatment before prescribing, and use spironolactone only with effective contraception when pregnancy is possible. Verify all doses against the BNF before prescribing."
});
