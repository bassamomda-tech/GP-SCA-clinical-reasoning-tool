MG.render({
  icon:"🌀",
  title:"Suspected vestibular neuronitis and labyrinthitis — the complete guide",
  eyebrow:"Protocol · adults over 16 · acute vestibular syndrome",
  stemTitle:"Acute sustained vertigo with nausea and unsteadiness is acute vestibular syndrome — do not call it vestibular neuronitis until posterior-circulation stroke and other central causes have been assessed",
  stemSub:"<b>Assessment and initial management of suspected acute vestibular syndrome in adults over 16, after appropriate assessment for central causes.</b> Vestibular neuronitis and labyrinthitis are diagnoses of exclusion, particularly in the first 24–72 hours. Use HINTS only if you are trained and experienced in it; otherwise refer immediately through the local stroke pathway (NICE NG127). <b>New sudden hearing loss is an urgent ENT or ED problem</b>, not simply evidence of labyrinthitis (NICE NG98). Once a peripheral cause is judged safe: short-term symptom relief only, supportive fluids, gradual mobilisation, and vestibular rehabilitation if symptoms persist.",

  nextReview:"25 September 2027",
  meta:[

  lead:'<div class="mg-layers"><a href="#assess"><b>Assess</b><small>Central first</small></a><a href="#hearing"><b>Hearing</b><small>NG98 windows</small></a><a href="#relief"><b>Relief</b><small>Short-term</small></a><a href="#recover"><b>Recover</b><small>Mobilise · rehab</small></a><a href="#refer"><b>Refer</b><small>When and where</small></a></div>',
  quickSub:"The five that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Posterior-circulation stroke can look identical", html:"Inability to stand or walk unaided, new marked truncal ataxia, any new neurological deficit, atypical nystagmus, or sudden dizziness with focal signs, new unsteadiness or new deafness → <b>emergency stroke pathway</b>, unless there is a clear benign explanation. A normal CT head does not exclude posterior-circulation stroke — imaging decisions belong to the stroke pathway."},
    {tone:"amber", h:"HINTS — only in the right patient, only if trained", html:"HINTS applies only to <b>continuous acute vestibular syndrome with spontaneous nystagmus and gait unsteadiness</b>, performed and interpreted by a clinician trained and experienced in it. It is not a general dizziness screen and must not be used to reassure episodic or positional symptoms. <b>HINTS suggesting stroke → immediate neuroimaging; no trained clinician → immediate stroke-pathway referral</b> (NICE NG127). Basic GP training does not confer HINTS competence."},
    {tone:"red", h:"⚠ Sudden hearing loss is time-critical", html:"Sudden hearing loss developing over 3 days or less, within the past 30 days, not explained by external or middle-ear disease → <b>immediate referral, seen within 24 hours</b> (NICE NG98). Hearing loss suggests cochlear involvement, but it can also mean sudden sensorineural hearing loss, labyrinthine ischaemia, stroke or Ramsay Hunt."},
    {tone:"amber", h:"Vestibular suppressants: shortest practical course", html:"Only for severe acute symptoms, usually no more than 2–3 days (a practical local rule, not a NICE threshold). Prolonged use impairs vestibular compensation and increases sedation and falls."},
    {tone:"green", h:"Recovery depends on moving again", html:"Rest and support fluids in the most severe phase; then mobilise gradually as soon as it is safe, with falls precautions. Offer vestibular rehabilitation if imbalance, visual-motion sensitivity or dizziness persists beyond the acute phase."}

       {b:"table", head:["Element","Detail"], rows:[
         ["<b>Acute vestibular syndrome</b>","Acute, sustained vertigo (hours to days), nausea or vomiting and gait unsteadiness, worse with head movement but present at rest. May follow a viral illness — this is not required"],
         ["<b>Vestibular neuronitis</b>","Acute vestibular syndrome <b>without</b> hearing loss, after central causes have been assessed"],

         ["<b>Examine</b>","Gait and whether they can stand unaided · spontaneous and gaze-evoked nystagmus · cranial nerves and full neurological examination · otoscopy (wax, otitis, perforation, vesicles, cholesteatoma, mastoid signs) · bedside hearing, Weber and Rinne if competent · blood glucose where clinically indicated"],

         ["<b>Sudden, but more than 30 days ago</b>","Urgent referral — seen within 2 weeks"],
         ["<b>Rapidly worsening over 4–90 days</b>","Urgent referral — seen within 2 weeks"],
         ["<b>With vertigo and focal neurological signs or new unsteadiness</b>","Emergency stroke pathway"]
       ]},
       {b:"warn", html:"Do not route sudden hearing loss to routine audiology — the treatment window is lost."}
     ]},

    {id:"relief", nav:"Relief", title:"Step 3 — short-term symptom relief",

       {b:"table", head:["Drug","Regimen","Notes"], rows:[
         ["<b>Prochlorperazine</b>","Oral 5 mg three times a day, or buccal 3–6 mg twice a day, per the SPC and local formulary","Acute symptoms only (Greater Manchester formulary). Extrapyramidal reactions and dystonia; caution in Parkinson's disease and dementia with Lewy bodies"],
         ["<b>Cyclizine</b>","Oral 50 mg up to three times a day, per the SPC and local formulary","Anticholinergic effects — caution in older or frail patients"],

       ]}
     ]},

         {tone:"amber", h:"2 · Still on suppressants?", html:"Stop them — they delay recovery."},
         {tone:"green", h:"3 · Rehabilitation", html:"Has vestibular rehabilitation started?"},
         {tone:"red", h:"4 · Hearing", html:"New or worsening hearing loss → NICE NG98 windows (Step 2)."},
         {tone:"blue", h:"5 · Another diagnosis?", html:"Episodic or positional (BPPV — Hallpike) · progressive or fluctuating hearing loss · persistent unilateral tinnitus · migraine features · bilateral symptoms · neck pain or trauma · otorrhoea, mastoid tenderness or vesicles · persistent spontaneous nystagmus."}

       {b:"table", head:["When","Situation","Action"], rows:[
         ["<b>Same day or emergency</b>","Suspected stroke · severe truncal or gait ataxia · new neurological signs · sudden hearing loss within the NG98 window · unable to maintain hydration · severe systemic illness","999, stroke pathway, ED or same-day ENT per local pathway — even when a peripheral diagnosis seems plausible"],
         ["<b>24–72 hours</b>","Severe symptoms · diagnostic uncertainty · persistent vomiting · falls or dehydration concerns","GP review"],

       {b:"cards", items:[

         {tone:"cream", h:"GP management", html:"The central assessment, the hearing check, short-term relief, supportive care and the review points belong here. Related pages: <a href='bppv.html'>BPPV</a> · <a href='menieres.html'>Ménière's disease</a> · <a href='../algorithms/vertigo.html'>vertigo pathway</a> · <a href='tia-stroke.html'>stroke and TIA</a>."}

     ]},

       {tone:"cream", h:"Examiner-style checkpoints", html:"Treats this as acute vestibular syndrome and assesses for a central cause first; is honest about HINTS competence and knows to refer if not trained; checks hearing and knows the NG98 windows; prescribes one vestibular suppressant for 2–3 days with cautions; advises no driving; explains gradual mobilisation and rehabilitation; and gives a clear stroke and hearing safety-net."}
     ]}]},

  foot:"Suspected vestibular neuronitis and labyrinthitis (adults over 16). Acute sustained vertigo with nausea and unsteadiness is acute vestibular syndrome: assess for posterior-circulation stroke and other central causes first. Use HINTS only if trained and experienced; otherwise refer immediately via the stroke pathway (NICE NG127). Sudden hearing loss over 3 days or less within the past 30 days: immediate referral, seen within 24 hours (NICE NG98). Once a peripheral cause is judged safe: one vestibular suppressant for the shortest practical course (usually 2–3 days), supportive fluids, gradual mobilisation and vestibular rehabilitation if symptoms persist. Sources: NICE NG127, NICE NG98, Greater Manchester formulary, SPCs."
