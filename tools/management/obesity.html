  quick:[
    {tone:"blue", h:"Ethnicity-adjusted thresholds, and waist-to-height at any BMI", html:"<b>Overweight 25–29.9 · obesity I 30–34.9 · II 35–39.9 · III ≥40.</b> Lower thresholds for South Asian, Chinese and other high-risk groups: overweight from 23, obesity from 27.5 — the same cardiometabolic risk arrives at a lower BMI. A waist-to-height ratio above 0.5 flags central adiposity risk at ANY BMI, and is most useful between BMI 25 and 35."},
    {tone:"green", h:"Ask permission before discussing weight", html:"Ask permission to discuss weight; use neutral language — \"weight\" and \"BMI\", not \"obese\" or \"fat\" — and set person-centred goals. <b>The opening line determines whether the patient engages at all</b>, and a consultation that begins badly here is usually lost for years, not minutes."},

    {tone:"amber", h:"Look for the drug that is causing it", html:"Antipsychotics (especially olanzapine and clozapine), steroids, insulin and sulfonylureas, sodium valproate, some antidepressants, gabapentinoids. Consider a swap to a weight-neutral alternative with the prescriber's agreement — fighting iatrogenic weight gain with diet alone rarely works. Also screen for hypothyroidism, Cushing's and PCOS."},
    {tone:"green", h:"The 5–10% goal is the honest one", html:"A realistic 5–10% loss meaningfully improves blood pressure, glycaemia, lipids, MASLD, obstructive sleep apnoea and fertility. <b>Sell the health wins, not a target dress size.</b> <b>And say that activity holds weight off more than it takes it off</b> — framing it honestly prevents the disillusionment that ends the attempt."},
    {tone:"amber", h:"GLP-1 drugs treat a chronic disease — the weight returns when they stop", html:"Semaglutide 2.4 mg weekly gives around 15% mean loss; tirzepatide titrated to 10–15 mg weekly is the most effective agent at around 20%. Weight is regained when they stop (STEP-4 and similar) — they are chronic-disease drugs like antihypertensives, not a course. <b>Counsel that upfront</b>, and beware unregulated online supply."}

    {id:"classify", nav:"Classify", title:"Step 1 — classify by BMI and waist, and ask permission first",

         ["<b>BMI categories</b>","<b>Overweight 25–29.9 · obesity I 30–34.9 · II 35–39.9 · III ≥40.</b> Lower thresholds for South Asian, Chinese and other high-risk groups: overweight ≥23, obesity ≥27.5 — the same cardiometabolic risk at a lower BMI"],

       {b:"why", html:"Obesity is a chronic relapsing disease driven by biology and environment, not willpower — and the framing changes the medicine. You screen for comorbidity, treat to protect organs, expect relapse, and support long-term rather than moralise. <b>Ethnicity-adjusted thresholds matter enormously in UK primary care</b>, where using the standard cut-offs systematically under-treats the populations at highest cardiometabolic risk."}

    {id:"causes", nav:"Causes", title:"Step 2 — secondary causes, and the comorbidity that IS the reason to treat",

    {id:"foundation", nav:"Foundation", title:"Step 3 — Tier 1–2: lifestyle and behaviour, the base of everything",

       {b:"cards", cols:2, items:[
         {tone:"green", h:"🥗 Diet", html:"A sustainable deficit of around 600 kcal/day, or a structured programme; cut sugary drinks and ultra-processed food. Total diet replacement at around 800 kcal/day can achieve substantial loss and type 2 diabetes remission in selected patients — see <a href='type-2-diabetes.html'>type 2 diabetes</a>."},

         {tone:"blue", h:"🧠 Behaviour", html:"Behavioural support, self-monitoring and goal-setting; refer to a structured Tier-2 weight-management service, which is the evidence-based way this is delivered."},

         {tone:"amber", h:"🤝 Barriers", html:"<b>Sleep, mood, medication-related gain, finances, the food environment</b> — address the real obstacles rather than restating the advice."},

       ]},
       {b:"say", html:"Aiming for around 5–10% of your weight is enough to genuinely improve your blood pressure, your sugars and your sleep — we are chasing health, not a number on a chart. And if the weight creeps back, that is the condition, not you failing; we just pick it back up together."}
     ]},

    {id:"drugs", nav:"Drugs", title:"Step 4 — the GLP-1 era: named agents, criteria and stopping rules",
     blocks:[
       {b:"table", head:["Agent","Dose and efficacy","Criteria and cautions"], rows:[
         ["<b>Semaglutide (Wegovy) — GLP-1 agonist, first-line drug</b>","2.4 mg SC weekly, titrated over 16–20 weeks. Around 15% mean weight loss","NICE TA875: within a specialist weight-management service; BMI ≥35, or 30–34.9 meeting referral criteria, with lower cut-offs for high-risk ethnicity, plus at least one weight-related comorbidity. Counsel: nausea (titrate slowly), gallstones, rare pancreatitis, pause peri-operatively per anaesthetic guidance, not in pregnancy"],
         ["<b>Tirzepatide (Mounjaro) — dual GIP/GLP-1, most potent</b>","Titrated to 10–15 mg SC weekly. Around 20% loss — the most effective agent","NICE TA1026 approves it for weight management within BMI and comorbidity criteria; phased NHS rollout via primary care and weight services. Same GI side-effect, stopping-rule and pregnancy cautions as semaglutide"],

         {tone:"cream", h:"GP management", html:"Classification, the secondary-cause and comorbidity screen, the conversation itself, Tier-2 referral, drug review for iatrogenic gain, shared-care pharmacotherapy and lifelong post-bariatric micronutrient monitoring all belong here. Related pages: <a href='type-2-diabetes.html'>type 2 diabetes</a> · <a href='osa.html'>obstructive sleep apnoea</a> · <a href='fatty-liver.html'>fatty liver disease</a> · <a href='hypertension.html'>hypertension</a> · <a href='pcos.html'>PCOS</a>."}

     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 41-year-old woman of South Asian background attends asking about <b>\"the weight-loss jab\"</b> she has read about. Her <b>BMI is 29</b>. She has <b>PCOS</b>, was started on <b>olanzapine 10 mg</b> eighteen months ago and has gained 14 kg since. She describes <b>eating large amounts in the evening and feeling out of control</b>, then feeling ashamed. She snores and her partner has noticed pauses in her breathing. She has <b>already ordered semaglutide from an online pharmacy</b> but has not started it."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Applies the ethnicity-adjusted threshold — BMI 29 is obesity in a South Asian patient, not overweight, which changes both the framing and her eligibility; identifies olanzapine as a major driver and raises a weight-neutral swap with the prescribing team rather than counselling on diet against an unchanged cause; recognises the evening eating as probable binge-eating disorder and treats that FIRST — a restrictive plan here would harm; <b>screens for OSA with Epworth or STOP-BANG</b> given the witnessed apnoeas; <b>addresses the unregulated online supply directly</b> — dosing errors, no monitoring, no eating-disorder screen — without shaming her for it; explains the real NICE route (TA875, within a specialist service) and the stopping rules, and that weight returns when the drug stops; <b>checks HbA1c, lipids, BP and FIB-4</b>; and asks permission before the weight conversation and uses neutral language throughout."}
     ]}]},

  foot:"Obesity in adults — NICE NG246, TA875 (semaglutide), TA1026 (tirzepatide) and NICE. Obesity is a chronic relapsing disease driven by biology and environment, not willpower. Use ethnicity-adjusted thresholds — overweight ≥23 and obesity ≥27.5 in South Asian, Chinese and other high-risk groups — and a waist-to-height ratio above 0.5 at any BMI. Ask permission before discussing weight. Screen for binge-eating disorder and depression before any restrictive plan, and look for the drug that is causing the gain. Aim at 5–10% for the health wins. GLP-1 agonists are chronic-disease treatment: the weight returns when they stop. Pharmacotherapy and surgery are adjuncts within specialist pathways. Verify against current NICE, local weight-service criteria and the BNF before prescribing."
