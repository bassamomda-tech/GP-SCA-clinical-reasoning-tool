<script>
MG.render({
  icon:"🧠",
  title:"OCD — the complete guide",
  eyebrow:"Protocol · NICE CG31 · higher dose, longer trial than depression",
  stemTitle:"Two things differ from depression and both cause premature switching: OCD needs HIGHER SSRI doses and at least a 12-week trial before you judge response",
  stemSub:"One page for the whole condition. Match treatment to severity on the stepped-care model. CBT with exposure and response prevention is the first-line psychological treatment, and ERP — deliberately facing triggers without ritualising — is the active ingredient, not an optional component. SSRIs often need higher doses than in depression and at least 12 weeks at an adequate dose before switching. Combine both for moderate-to-severe disease. And look for the maintaining factor that is invisible in the consulting room: <b>family accommodation of rituals.</b>",
  guideline:"NICE CG31",
  reviewed:"14 September 2026",
  nextReview:"14 March 2027",
  meta:[
    {t:"NICE CG31 — obsessive-compulsive disorder"},
    {t:"SSRI: higher dose, ≥12-week trial", tone:"tw"},
    {t:"ERP is the active ingredient of the therapy", tone:"tw"},
    {t:"v2.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#confirm"><b>Confirm</b><small>Severity · risk</small></a><a href="#therapy"><b>CBT + ERP</b><small>First-line</small></a><a href="#drug"><b>SSRI</b><small>Higher · longer</small></a><a href="#monitor"><b>Review</b><small>12 weeks</small></a><a href="#refer"><b>Refer</b><small>Severe · refractory</small></a></div>',
  quickSub:"The five that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"amber", h:"⚠ Higher dose, longer trial — do not switch prematurely", html:"OCD often needs higher SSRI doses than depression — sertraline up to 200 mg, fluoxetine up to 60 mg — and at least 12 WEEKS at an adequate dose before response is judged. Switching at 6 weeks, as you would in depression, is the commonest prescribing error in OCD and wastes months."},
    {tone:"blue", h:"ERP is the active ingredient, not a component", html:"CBT with exposure and response prevention — graded exposure to triggers while resisting the compulsion — is the first-line psychological treatment. Low-intensity or guided self-help for mild OCD; high-intensity CBT for moderate to severe. Therapy that is not ERP-based, or ERP that is not practised between sessions, is not an adequate trial."},
    {tone:"green", h:"Family accommodation maintains the disorder", html:"Relatives who provide reassurance, perform rituals, or reorganise the household around the OCD are maintaining it — usually with the best intentions. Reducing family accommodation is a treatment target, and supporting carers is part of it. This is the factor most often missed because it is invisible from the consulting room."},
    {tone:"red", h:"⚠ Assess risk and comorbidity", html:"Suicidality, severe self-neglect, and impact on dependants or safeguarding. <b>Monitor for suicidality early, especially under 25.</b> Depression, anxiety, tics, eating disorder and substance misuse are common and each can worsen or mask the OCD."},
    {tone:"blue", h:"Escalation: switch SSRI, then clomipramine, then combine", html:"Inadequate response after an adequate trial → switch to another SSRI, or to clomipramine (a TCA with strong OCD evidence — ECG and overdose-risk considerations apply). For moderate to severe disease, combine medication with high-intensity CBT/ERP, and refer if it is not responding."}
  ],
  pathwaySub:"Five steps, and the timing in step four is what most often goes wrong.",
  pathway:[
    {title:"Confirm OCD, grade severity, assess risk", html:"Obsessions plus compulsions that are distressing and time-consuming; functional impact sets the stepped-care level.", alert:true},
    {title:"CBT with ERP as first-line", html:"Guided self-help for mild; high-intensity CBT for moderate to severe. Involve the family and reduce accommodation."},
    {title:"Add an SSRI where indicated", html:"Titrated to a higher dose than in depression, with delayed onset explained."},
    {title:"Wait at least 12 weeks before judging it", html:"Then switch SSRI or try clomipramine. Combine drug and therapy for severe disease."},
    {title:"Review risk, dose and therapy engagement", html:"Continue effective treatment, often for 12 months or more, with relapse prevention."}
  ],
  sections:[

    {id:"confirm", nav:"Confirm", title:"Step 1 — confirm OCD, severity and risk",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>Features</b>","Obsessions (intrusive thoughts) plus compulsions (repetitive acts or rituals) that are distressing and time-consuming"],
         ["<b>Severity</b>","Functional impact — mild, moderate or severe — guides the stepped-care level"],
         ["<b>Risk</b>","Suicidality, severe self-neglect, impact on dependants and safeguarding"],
         ["<b>Comorbidity</b>","Depression, anxiety, tics, eating disorder, substance misuse — all common"]
       ]},
       {b:"why", html:"OCD responds to two evidence-based treatments — CBT with ERP and SSRIs — matched to severity via stepped care. Two features differ from depression: SSRIs often need higher doses and a longer trial (at least 12 weeks), and ERP — deliberately facing triggers without ritualising — is the active ingredient of the therapy."}
     ]},

    {id:"therapy", nav:"CBT + ERP", title:"Step 2 — CBT with exposure and response prevention",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"🧠 CBT + ERP", html:"First-line psychological treatment — graded exposure to triggers while resisting compulsions; low-intensity for mild, high-intensity for moderate to severe."},
         {tone:"green", h:"📚 Psychoeducation", html:"Explain the obsession–anxiety–compulsion–relief cycle and how ERP breaks it."},
         {tone:"green", h:"👨‍👩‍👧 Involve family", html:"Reduce family accommodation of rituals, which maintains OCD; support carers."},
         {tone:"blue", h:"📱 Guided self-help", html:"<b>For mild OCD — CBT-based self-help and digital resources.</b>"},
         {tone:"green", h:"🔗 Function", html:"<b>Support work and education; address avoidance.</b>"},
         {tone:"amber", h:"🧩 Comorbidity", html:"<b>Address depression and anxiety that worsen or mask the OCD.</b>"}
       ]}
     ]},

    {id:"drug", nav:"SSRI", title:"Step 3 — SSRIs: higher dose, longer trial",
     blocks:[
       {b:"table", head:["Step","What","When"], rows:[
         ["<b>Step 1 — an SSRI</b>","Sertraline up to 200 mg, fluoxetine up to 60 mg, paroxetine or fluvoxamine — OCD often needs HIGHER doses than for depression. Counsel on delayed onset","<b>Often titrated to a higher dose</b>"],
         ["<b>Adequate trial — wait ≥12 weeks</b>","Assess response over at least 12 weeks at an adequate dose before switching","<b>A longer trial than in depression</b>"],
         ["<b>Step 2 — switch SSRI or try clomipramine</b>","Switch to another SSRI, or to clomipramine (a TCA with strong OCD evidence; ECG and cautions apply)","<b>Inadequate response after an adequate trial</b>"],
         ["<b>Severe — combination</b>","Combine medication with high-intensity CBT/ERP; refer if not responding","<b>Moderate to severe</b>"]
       ]},
       {b:"warn", html:"OCD needs higher SSRI doses and a longer trial than depression — don't switch prematurely. Monitor suicidality early, especially under 25; clomipramine needs an ECG and consideration of overdose risk."}
     ]},

    {id:"monitor", nav:"Review", title:"Steps 4–5 — response, risk and dose",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["<b>Risk and early effects</b>","<b>1–2 weeks after starting (1 week if under 30 or at risk)</b>","<b>Escalate if risk rises</b>"],
         ["<b>Symptoms and function</b>","<b>Each review</b>","<b>Track over at least 12 weeks before judging the SSRI</b>"],
         ["<b>Dose</b>","<b>During titration</b>","<b>Push to an effective (often higher) dose as tolerated</b>"],
         ["<b>Therapy engagement</b>","<b>Ongoing</b>","<b>Ensure CBT/ERP is accessed AND practised between sessions</b>"]
       ]},
       {b:"dl", rows:[
         ["<b>1–2 weeks after starting the drug</b>","Early review: risk, tolerability, expectation-setting; refer for CBT/ERP"],
         ["<b>Over ≥12 weeks</b>","Response review: titrate the dose; assess over an adequate trial before switching"],
         ["<b>Ongoing</b>","Continuation: continue effective treatment (often 12 months or more); relapse prevention; escalate if refractory"]
       ]}
     ]},

    {id:"notresponding", nav:"Not responding?", title:"Not responding? Check before switching",
     sub:"Confirm an adequate — higher-dose, 12-week — trial and genuine ERP engagement.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"1 · Dose and duration", html:"<b>Was the SSRI at an adequate (often higher) dose for at least 12 weeks?</b>"},
         {tone:"blue", h:"2 · ERP", html:"Is the therapy genuinely ERP-based, and being practised between sessions?"},
         {tone:"green", h:"3 · Accommodation", html:"<b>Is family accommodation of rituals maintaining the symptoms?</b>"},
         {tone:"amber", h:"4 · Comorbidity", html:"<b>Untreated depression or anxiety undermining progress?</b>"},
         {tone:"blue", h:"5 · Escalate", html:"<b>Adequate trial failed → switch SSRI, try clomipramine, or refer.</b>"}
       ]}
     ]},

    {id:"safety", nav:"Safety-net", title:"Safety-netting",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Crisis", html:"\"If you feel unsafe or have thoughts of ending your life — call 999, go to A&amp;E, or ring NHS 111 or Samaritans on 116 123.\""},
         {tone:"blue", h:"⏳ Be patient", html:"\"The tablets can take longer to work in OCD than in depression — stick with it and we'll review the dose.\""},
         {tone:"amber", h:"⚠️ Early worsening", html:"\"If you feel more agitated or low in the first weeks of an antidepressant, contact us promptly.\""},
         {tone:"green", h:"🔄 Resisting rituals", html:"\"The therapy works by facing triggers without doing the ritual — it feels hard at first but the anxiety fades.\""}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"When to refer",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Urgent", html:"Significant suicide risk or severe functional collapse → urgent mental-health assessment."},
         {tone:"amber", h:"Severe", html:"Severe OCD, or marked impairment → specialist mental-health or OCD service."},
         {tone:"amber", h:"Refractory", html:"Inadequate response to CBT/ERP plus adequate SSRI and/or clomipramine trials."},
         {tone:"blue", h:"Diagnostic complexity", html:"Significant comorbidity (tics, eating disorder, psychosis) or diagnostic doubt."},
         {tone:"cream", h:"GP management", html:"Diagnosis and severity, the CBT/ERP referral, the SSRI at an adequate dose and duration, the family-accommodation conversation, and the review schedule all belong here. Related pages: <a href='anxiety.html'>anxiety</a> · <a href='depression.html'>depression</a> · <a href='ptsd.html'>PTSD</a> · <a href='postnatal-depression.html'>postnatal depression</a>."}
       ]},
       {b:"say", html:"OCD is very treatable. The two things that work are a specific therapy — facing the triggers without doing the rituals — and antidepressants, which in OCD often need a higher dose and a bit longer to work. Let's start both and review."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 26-year-old man describes <b>contamination fears and handwashing taking 3 hours a day</b>, with skin breakdown. He was started on <b>fluoxetine 20 mg</b> ten weeks ago and <b>switched to citalopram 20 mg at week six</b> because \"it wasn't working\". He has had <b>four sessions of generic counselling</b>, not ERP. His mother <b>buys the antibacterial products and does his laundry separately</b> to keep him calm. He is late for work most days and fears losing his job."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Identifies the two errors driving the failure: the SSRI was switched at 6 weeks when OCD needs at least 12, and neither agent was titrated to the higher doses OCD requires; <b>recognises that generic counselling is not ERP</b>, and refers specifically for CBT with exposure and response prevention rather than re-referring for \"therapy\"; names the mother's behaviour as family accommodation and explains, without blame, that it maintains the disorder — the factor invisible from the consulting room and the one the patient will not volunteer; <b>titrates the current SSRI properly rather than switching again</b>, and sets the 12-week expectation explicitly; <b>assesses risk and the skin breakdown</b>; addresses the employment threat as a functional-impact marker and a reason for prompt therapy access; and <b>knows clomipramine is the next step after an adequate trial fails</b>, with its ECG and overdose considerations."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE CG31 — Obsessive-compulsive disorder and body dysmorphic disorder</b><br><a href="https://www.nice.org.uk/guidance/cg31" rel="noopener">nice.org.uk/guidance/cg31</a><span class="rd"> — the stepped-care model, CBT including exposure and response prevention as first-line with low-intensity self-help for mild and high-intensity CBT for moderate to severe disease, SSRIs at higher doses than in depression, the minimum 12-week trial, clomipramine as the second-line agent, and combination treatment for severe OCD</span></li>'+
         '<li><b>NICE CG31 \u2014 Obsessive-compulsive disorder and body dysmorphic disorder</b><br><a href="https://www.nice.org.uk/guidance/cg31" rel="noopener">nice.org.uk/guidance/cg31</a><span class="rd"> — the review intervals, the family-accommodation point, continuation for at least 12 months after response, and the referral thresholds</span></li>'+
         '<li><b>MHRA and NICE guidance on antidepressants</b><span class="rd"> — early monitoring for suicidality particularly in those under 25, and the ECG and overdose-risk considerations with clomipramine</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — sertraline, fluoxetine, paroxetine, fluvoxamine and clomipramine dosing, including the higher OCD dose ranges</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Obsessive-compulsive disorder — NICE CG31 and NICE. Stepped care by severity. CBT with exposure and response prevention is first-line, and ERP is the active ingredient — generic counselling is not an adequate trial. SSRIs often need HIGHER doses than in depression (sertraline up to 200 mg, fluoxetine up to 60 mg) and at least 12 weeks at an adequate dose before response is judged; switching at 6 weeks is the commonest error. Then switch SSRI or try clomipramine, with ECG and overdose-risk considerations. Combine drug and high-intensity therapy for moderate to severe disease. Reducing family accommodation of rituals is a treatment target. Monitor suicidality early, especially under 25. Verify all doses against the current BNF before prescribing."
});
