MG.render({
  icon:"\u{1FAE7}",

  stemTitle:"Bullous pemphigoid — the itchy older patient whose “eczema” starts to blister",
  stemSub:"The commonest autoimmune blistering disease, seen mostly in people over 70. The GP’s job is to recognise it early (often in the itchy, urticated, pre-blister phase), separate it from pemphigus and infection, refer at the right speed, stop a likely drug trigger, and then keep a frail patient safe on months of steroids under dermatology shared care.",
  guideline:"BAD 2012 bullous pemphigoid · BAD 2017 pemphigus vulgaris · BLISTER (Lancet 2017) · EADV 2022 (international) · NOGG 2024",
  meta:[
    {t:"BAD bullous pemphigoid guideline (2012)"},
    {t:"BAD pemphigus vulgaris guideline (2017)"},
    {t:"BLISTER trial · Lancet 2017"},
    {t:"EADV S2k BP guideline (2022) · international"},
    {t:"NOGG 2024 · NatPSA/2020/005 steroid card"},
    {t:"Doses: verify against current BNF"}
  ],
  lead:'<div class="mg-layers"><a href="#recognise"><b>Recognise</b><small>Prodrome → tense blisters</small></a><a href="#redflags"><b>Red flags</b><small>Pemphigus, sepsis, extent</small></a><a href="#gp-start"><b>While you wait</b><small>What the GP can start</small></a><a href="#steroid-safety"><b>Steroid safety</b><small>Bone, card, sugar, BP</small></a></div>',
  glance:[
    {lbl:"Who", val:"Usually over 70", sub:"age is a clue, not a criterion; often frail"},
    {lbl:"Picture", val:"Itch → tense blisters", sub:"on urticated skin; mucosa spared or mildly involved"},
    {lbl:"Confirm", val:"Two biopsies", sub:"histology (formalin) + DIF (not formalin); serology supportive only"},
    {lbl:"Localised", val:"Clobetasol 0.05%", sub:"very potent topical steroid"},
    {lbl:"Extensive", val:"Dermatology-led", sub:"whole-body clobetasol, doxycycline or prednisolone"},
    {lbl:"Danger", val:"Pemphigus · sepsis", sub:"prominent mucosal erosions = urgent"}
  ],
  quickSub:"If you read nothing else, read these five cards. Sources for each point are named in the sections below and in the <a href=\"#provenance\">Evidence</a> panel.",
  quick:[
    {tone:"amber", h:"Think of it before the blisters appear", html:"An older person with <b>intense, persistent itch</b> and <b>urticated or eczematous plaques</b> that don’t behave like eczema may be in the <b>non-bullous (prodromal) phase</b> of pemphigoid — weeks to months before <b>large, tense, fluid-filled blisters</b> appear. Scabies, eczema and drug rash are the usual wrong labels."},
    {tone:"red", h:"Prominent mucosal erosions or flaccid blisters = reconsider the diagnosis urgently", html:"<b>Prominent painful mucosal erosions</b>, <b>flaccid</b> blisters, a positive Nikolsky sign or significant swallowing/ocular/genital symptoms should prompt urgent reconsideration of <b>pemphigus</b>, mucous membrane pemphigoid, SJS/TEN or another immunobullous disorder. Bullous pemphigoid can involve mucosa, though usually mildly; age is a clue, not a criterion. Same-day dermatology discussion (BAD 2017 pemphigus guideline). Widespread raw skin or a systemically unwell patient → admit."},
    {tone:"amber", h:"Check the drug list — especially gliptins", html:"<b>Review and discuss stopping the suspected DPP-4 inhibitor</b>, particularly where the temporal relationship is plausible and an alternative diabetes treatment is clinically suitable. Do not delay dermatology assessment. Document the suspected adverse drug reaction and involve the diabetes team if glycaemic control may deteriorate. Individual gliptin SmPCs advise discontinuation if pemphigoid is suspected; EADV 2022 finds the benefit of stopping uncertain. <b>Do not stop immune checkpoint inhibitors independently</b> — discuss urgently with oncology."},
    {tone:"blue", h:"Very potent topical steroid is first-line and systemic-sparing", html:"<b>Clobetasol propionate 0.05%</b> is first-line for localised disease (under dermatology or an agreed primary-care plan). Whole-body use in extensive disease is <b>dermatology-supervised</b>, with a clear quantity, application and tapering plan (BAD 2012; EADV 2022). Oral prednisolone or a <b>doxycycline-start strategy</b> (BLISTER, Lancet 2017) are dermatology-led choices for extensive disease. Topical steroid can often be started on dermatology advice while the biopsy is awaited."},
    {tone:"green", h:"Steroids in the frail: protect bone, carry the card, watch sugars", html:"<b>Assess fracture risk</b> at the start of oral corticosteroids; in higher-risk groups (postmenopausal women, men ≥50, prior fragility fracture, women ≥70, prednisolone ≥7.5 mg/day for about 3 months) start bone protection without waiting for DXA (NOGG 2024). <b>Steroid Emergency Card</b> and sick-day advice for prednisolone ≥5 mg/day for more than 4 weeks (NatPSA/2020/005). Capillary glucose within days, BP, look for infection, taper — never stop abruptly."}
  ],
  pathwaySub:"The consultation in six moves. The red step is where harm happens — missing pemphigus or sepsis.",
  pathway:[
    {title:"Suspect it", html:"Older patient, itch ± urticated plaques, tense blisters on flexures, trunk and limbs. Ask about <b>new drugs in the last months</b> (gliptins especially), mouth/eye/genital soreness, and how they are coping at home."},
    {title:"Screen for danger", html:"Assess ABCDE and observations. <b>Prominent mucosal erosions or flaccid blisters</b> (pemphigus), <b>extensive raw skin</b>, fever, sepsis features (NEWS2 where appropriate, alongside clinical concern and frailty), dehydration, AKI, or a frail person unable to manage → same-day dermatology/medical admission.", alert:true},
    {title:"Exclude mimics", html:"Bullous impetigo (swab), scabies (burrows, contacts), insect bites, herpes simplex/zoster, contact dermatitis, fixed drug eruption, SJS/TEN (unwell + mucosa + dusky skin → stop culprit drug, immediate hospital assessment; 999 if unstable), oedema blisters in heart failure."},
    {title:"Refer to confirm", html:"All suspected autoimmune blistering disease → dermatology for <b>two biopsies: fresh blister/blister edge in formalin for histology + perilesional skin for direct immunofluorescence (DIF; never in formalin)</b>. BP180/BP230 serology is supportive and does not replace DIF. Urgency matched to extent and frailty; do not delay hospital transfer for biopsy in a deteriorating patient."},
    {title:"Start what is safe", html:"On dermatology advice: <b>clobetasol 0.05%</b> to affected skin, emollient and soap substitute, blister care with non-adherent dressings, review a likely trigger (gliptin), treat clinically infected skin, district nurse for dressings."},
    {title:"Shared care", html:"Support the dermatology regimen (topical, doxycycline, prednisolone or steroid-sparing agent), bone protection, steroid card, glucose/BP, infection vigilance, and a gradual dermatology-directed taper — treatment may be needed for months or years."}
  ],
  sections:[

    {id:"recognise", nav:"Recognise", title:"Recognising bullous pemphigoid", sub:"A disease of older people: onset is typically over 70 (mean age about 80), but age is a clue, not a diagnostic criterion. The prodrome is the diagnostic opportunity most often missed.",
     blocks:[
       {b:"kv", rows:[
         ["Typical picture","Elderly patient; intense itch then <b>large, tense, fluid-filled blisters</b> (clear or blood-stained) on erythematous or urticated skin — flexures, inner thighs, lower abdomen, trunk and limbs. Blisters don’t rupture easily (<b>Nikolsky negative</b>). Healing erosions, crusts and milia may follow"],
         ["Prodromal (non-bullous) phase","Weeks to months of <b>itch with urticated, eczematous or excoriated plaques</b> and no blisters. Some patients never blister. Suspect pemphigoid in an older person with persistent, unexplained generalised itch or “eczema” that fails to settle"],
         ["Mucosa","<b>Usually spared or mildly involved</b>; mucosal involvement does not exclude bullous pemphigoid. Prominent painful mucosal disease should prompt urgent reconsideration of pemphigus, mucous membrane pemphigoid or SJS/TEN"],
         ["Associations","Neurological disease (dementia, Parkinson’s disease, stroke), frailty and immobility are commonly associated — many patients live in care homes"],
         ["Triggers / context","Often idiopathic; can be drug-associated — <b>gliptins/DPP-4 inhibitors</b> have the strongest signal, with loop diuretics, some antibiotics and PD-1/PD-L1 checkpoint inhibitors reported as possible associations rather than established triggers. Review medication"],
         ["Mechanism","Autoantibodies (IgG) against hemidesmosomal proteins <b>BP180 and BP230</b> at the dermo-epidermal junction → <b>subepidermal</b> split, so the roof is thick and blisters stay tense"],
         ["Course","Chronic and relapsing. The disease often eventually enters remission, but treatment may be required for months or years; relapses during tapering are common, and tapering should be gradual and directed by dermatology. Mortality is higher than in age-matched peers: bullous pemphigoid itself, infection, comorbidity, disease severity, frailty and treatment harms all contribute"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Diagnosis is dermatology-confirmed", html:"Dermatology arranges <b>two biopsies</b>: (1) <b>routine histology</b> from a fresh intact blister or the edge of a recent blister, in formalin (subepidermal blister, eosinophils); (2) <b>direct immunofluorescence</b> from normal-appearing or erythematous perilesional skin, usually about 1–2 cm from a fresh blister, in DIF transport medium (e.g. Michel’s) or on saline-soaked gauze per local laboratory instructions — <b>never in formalin</b>; contact the laboratory in advance where possible, as it may need same-day processing (linear IgG and/or C3 along the basement membrane). If DIF is negative but suspicion remains high, repeat the biopsy and review site, transport and processing. Anti-BP180/BP230 serology is supportive, may help when biopsy is difficult and can track activity, but <b>does not replace DIF</b> and may be negative in genuine disease.", src:"PCDS bullous pemphigoid guidance; BAD 2012 bullous pemphigoid guideline"},
         {tone:"amber", h:"The pre-bullous phase", html:"Itch with urticated or eczematous lesions can precede blisters by months. DIF on perilesional skin can be positive before blisters form, so a biopsy is worth discussing when a frail older person has refractory unexplained itch.", src:"EADV 2022 S2k bullous pemphigoid guideline, JEADV (international)"}
       ]},
       {b:"why", html:"Bullous pemphigoid needs <strong>dermatology confirmation by biopsy and immunofluorescence</strong> because treatment is prolonged immunosuppression in a frail group, and it must be distinguished from pemphigus (more dangerous, mucosal) and from common mimics. The GP’s role is prompt recognition and referral, then shared-care support of the steroid regimen, vigilance for complications, and review of drug triggers — notably DPP-4 inhibitors."}
     ]},

    {id:"differential", nav:"Pemphigoid vs pemphigus", title:"Differentials — above all, is this pemphigus?", sub:"Pemphigus vulgaris is rarer, usually affects a younger age group (age is a clue, not a criterion), often starts in the mouth and can be fatal without treatment. It changes the urgency.",
     blocks:[
       {b:"table", head:["Feature","Bullous pemphigoid","Pemphigus vulgaris"], rows:[
         ["Age","Usually &gt;70","Usually middle age (40s–60s)"],
         ["Blisters","<b>Tense</b>, large, often on urticated base; intact blisters common","<b>Flaccid</b>, fragile, rupture quickly → painful erosions; intact blisters rare"],
         ["Level of split","Subepidermal (BP180/BP230)","Intraepidermal (desmoglein 3 ± 1)"],
         ["Nikolsky sign","Negative","Often positive"],
         ["Mucosa","Usually spared or mild; prominent involvement → reconsider","<b>Oral erosions in most</b>, often the first sign (can precede skin lesions by months); eyes, genitals, larynx"],
         ["Itch vs pain","Itch dominates","Pain and soreness dominate; eating and swallowing affected"],
         ["Urgency","Urgent; same-day if extensive, rapidly progressive or unwell","<b>Urgent</b> dermatology; admit if extensive, unable to eat/drink or unwell"],
         ["Specialist treatment","Topical clobetasol; oral prednisolone or doxycycline; steroid-sparing agents","Systemic steroids plus early steroid-sparing therapy; rituximab now established"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"red", h:"Pemphigus vulgaris — do not sit on it", html:"Persistent painful <b>oral erosions</b> not explained by aphthae, candida or herpes, especially with skin erosions, need urgent dermatology (and oral medicine/ENT/ophthalmology as needed). Diagnosis is by biopsy with DIF and serology for desmoglein antibodies.", src:"BAD 2017 pemphigus vulgaris guideline"},
         {tone:"blue", h:"Rituximab has changed pemphigus care", html:"The BAD pemphigus guideline positions <b>rituximab</b> as an effective treatment across pemphigus, alongside systemic corticosteroids and steroid-sparing immunosuppressants. The GP needs to know the patient is heavily immunosuppressed (infection risk, vaccine timing).", src:"BAD 2017 pemphigus vulgaris guideline"}
       ]},
       {b:"table", head:["Mimic","Clue","Action"], rows:[
         ["Bullous impetigo","Younger, honey crust, contacts, rapid spread","Swab; treat per local antimicrobial guidance"],
         ["Scabies (can also trigger bullae in older people)","Burrows (web spaces, wrists), itchy contacts, care-home outbreak","Treat patient and contacts; re-examine if blisters persist"],
         ["Herpes simplex / zoster","Grouped vesicles, dermatomal, pain","Antivirals; urgent ophthalmology if eye involved"],
         ["Contact dermatitis / insect bites","Localised, pattern matches exposure","Avoid trigger; topical steroid"],
         ["Stevens–Johnson syndrome / TEN","Unwell, fever, <b>mucosal involvement</b>, dusky/targetoid skin, new drug in last 8 weeks","Stop suspected culprit drugs immediately; <b>immediate hospital assessment</b>; emergency ambulance if unstable, shocked, hypoxic, confused, rapidly deteriorating or unable to travel safely"],
         ["Oedema blisters","Tense bullae on swollen legs in heart failure/immobility","Treat oedema; blister care"],
         ["Dermatitis herpetiformis, linear IgA disease, mucous membrane pemphigoid","Coeliac link; younger; scarring mucosal disease","Dermatology (biopsy + DIF distinguishes)"]
       ]},
       {b:"why", html:"The tense-versus-flaccid distinction reflects where the split is. In pemphigoid the whole epidermis forms the blister roof, so blisters survive; in pemphigus only the upper epidermis lifts, so blisters break into raw, painful, infection-prone erosions and mucosa is involved. That is why pemphigus behaves more like a burn and why persistent unexplained mouth erosions in an adult deserve a biopsy rather than repeated mouthwash."}
     ]},

    {id:"redflags", nav:"Red flags", title:"Red flags — same-day or urgent action", sub:"Blistering disease in a frail older person can decompensate quickly through fluid loss, infection and inability to cope.",
     blocks:[
       {b:"warn", html:"<b>Urgent danger — same-day assessment / admission</b> for: painful flaccid blisters or extensive erosions; oral, ocular, genital or laryngeal involvement; fever, hypotension, confusion or suspected <b>sepsis</b>; rapidly progressive skin loss; dehydration, AKI or inability to eat, drink or manage dressings; suspected <b>SJS/TEN</b>. Use an emergency ambulance (999) for shock, airway concern, severe dehydration, marked confusion, high-risk sepsis or a patient unable to travel safely; otherwise arrange immediate hospital or same-day specialist assessment."},
{b:"cards", cols:2, items:[
  {tone:"blue", h:"Immediate GP actions", html:"<ul><li>Assess ABCDE, observations, hydration, renal function and ability to cope.</li><li>Review all medicines, including DPP-4 inhibitors and immune checkpoint inhibitors.</li><li>Arrange urgent dermatology assessment for suspected autoimmune blistering disease.</li><li>Do not delay hospital transfer for biopsy in a deteriorating patient.</li><li>Do not start systemic prednisolone for suspected pemphigus or extensive BP without dermatology/acute medical agreement unless following an established local pathway.</li><li>Provide non-adherent dressings, emollient care and district-nursing support.</li><li>If systemic steroids are started, address adrenal, bone, glucose, blood-pressure and infection risks immediately.</li></ul>"},
  {tone:"amber", h:"Recognise", html:"Older patient with persistent severe itch, urticated/eczematous plaques or tense blisters, particularly without a clear eczema response."}
]},
       {b:"cards", items:[
         {tone:"red", h:"Sepsis from infected erosions", html:"Eroded skin is a portal for <i>Staphylococcus aureus</i> and streptococci, and steroids blunt fever. Use NEWS2 where appropriate and your local sepsis pathway, but not as a substitute for clinical assessment — consider clinical concern, frailty and whether the patient can be managed safely outside hospital (NICE NG253); a frail patient with new confusion, falls or reduced intake needs same-day assessment."},
         {tone:"red", h:"Mucosal disease", html:"Prominent oral, ocular, genital or laryngeal erosions, dysphagia or hoarseness → same-day discussion with dermatology; ocular symptoms need urgent ophthalmology (risk of scarring in mucous membrane pemphigoid and pemphigus).", src:"BAD 2017 pemphigus vulgaris guideline"},
         {tone:"amber", h:"Extensive or rapidly progressive disease", html:"Extensive or rapidly progressive blistering/erosions need same-day or urgent dermatology/acute medical assessment for systemic treatment rather than a routine appointment.", src:"BAD 2012 bullous pemphigoid guideline"},
       ]}
     ]},

    {id:"triggers", nav:"Drug triggers", title:"Drug triggers — review every medicine", sub:"Evidence on whether pemphigoid settles faster once a suspected culprit is stopped is inconsistent; the decision needs clinical judgement.",
     blocks:[
       {b:"dl", rows:[
         ["Gliptins (DPP-4 inhibitors)","Strongest signal. The sitagliptin (Januvia) SmPC section 4.4 notes post-marketing reports and advises discontinuation if bullous pemphigoid is suspected; the linagliptin (Trajenta) SmPC is similar. EADV 2022 finds the benefit of stopping uncertain and makes no universal recommendation to stop or continue; switching drug class may be considered after interdisciplinary review. Check the product information for the specific gliptin. Latency can be months to years after starting"],
         ["Loop diuretics","Furosemide is a possible association, not an established trigger; review need and alternatives with the prescriber"],
         ["Immune checkpoint inhibitors","PD-1/PD-L1 inhibitors (e.g. pembrolizumab, nivolumab) — <b>do not stop independently</b>; discuss urgently with the oncology team, who will manage the immune-related adverse event"],
         ["Others reported","Penicillins and other antibiotics, spironolactone, NSAIDs, ACE inhibitors, terbinafine — possible associations at case-report level only; do not assume causation, and weigh against the need for the drug"],
         ["Practical step","Review and discuss stopping a suspected gliptin where the temporal relationship is plausible and an alternative diabetes treatment is clinically suitable (think about hypoglycaemia risk in the frail, and that steroids will raise glucose); involve the diabetes team if control may deteriorate. Assess whether each suspected medicine is actually necessary and whether an alternative is safe in this frail patient. Do not delay dermatology assessment. <b>Document the suspected adverse drug reaction</b>, report via the MHRA Yellow Card scheme, and tell the dermatologist"]
       ]},
       {b:"why", html:"Individual gliptin product information advises discontinuation if pemphigoid is suspected, but EADV 2022 notes the benefit of stopping is uncertain. A documented, clinically appropriate review — with an alternative diabetes plan that suits the patient, since oral steroids will worsen glycaemic control at the same time — is better than automatic cessation, and should never delay dermatology assessment."}
     ]},

    {id:"gp-start", nav:"While you wait", title:"What the GP can start while awaiting dermatology", sub:"Ideally after a same-week advice-and-guidance or telephone discussion, and never at the cost of delaying the biopsy.",
     blocks:[
       {b:"tiles", v:"life", items:[
         {t:"🩹 Blister/wound care", html:"Leave small intact blisters intact. Large tense blisters may be drained aseptically by an appropriately trained clinician or nurse, usually following dermatology or tissue-viability advice, <b>preserving the blister roof where possible</b>; avoid routine de-roofing. Use non-adherent dressings; avoid adhesive dressings on fragile skin; refer to district nursing/tissue viability for extensive dressings. No prophylactic antibiotics."},
         {t:"🧴 Emollients & hygiene", html:"Generous emollient and soap substitute; gentle cleansing; follow local tissue-viability/dermatology advice. Paraffin-containing emollients and dressings increase fire risk when soaked into dressings, bedding and clothing — warn about naked flames and smoking."},
         {t:"💊 Review triggers", html:"Review and discuss stopping a suspected gliptin with an alternative diabetes plan; review loop diuretics and recent new drugs; discuss checkpoint inhibitors with oncology."},
         {t:"🦴 Pressure care", html:"Pressure-area care, repositioning and falls prevention in frail/immobile patients."},
         {t:"🍽️ Nutrition & fluids", html:"Maintain nutrition and hydration (extensive disease → fluid and protein loss); dietitian if needed."},
         {t:"🧠 Support", html:"Carer support, district-nursing involvement for dressings and steroid application, psychological support; itch disturbs sleep. Sedating antihistamines add falls and confusion risk in older people \u2014 use cautiously if at all. Check whether the patient or care home can realistically apply large quantities of ointment; inability to cope at home is an admission criterion in itself."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Very potent topical steroid", html:"<b>Localised disease:</b> clobetasol propionate 0.05% to affected areas under dermatology or an agreed primary-care plan; it can usually be started on dermatology advice before the biopsy result. <b>Extensive disease:</b> whole-body super-potent topical corticosteroid only under dermatology supervision, with a clear quantity, application and tapering plan. The patient must have someone able to apply it safely and consistently. Monitor for skin atrophy, purpura, infection and systemic absorption. Dose and quantity per dermatology and BNF.", src:"BAD 2012 bullous pemphigoid guideline"},
         {tone:"amber", h:"Biopsy before treatment where feasible — but don’t delay treatment", html:"Take the biopsy before treatment whenever feasible, but do not delay treatment in an extensive, painful or systemically unwell patient. If immediate treatment is required, start treatment and inform dermatology of the treatment already given, as corticosteroids may reduce diagnostic yield.", src:"EADV 2022 S2k bullous pemphigoid guideline, JEADV (international)"},
         {tone:"amber", h:"Secondary infection", html:"Do not use prophylactic antibiotics. Swab only when there is clinical evidence of infection (increasing erythema, warmth, purulence, malodour, pain or systemic features), and treat clinically infected skin per local antimicrobial guidance. Doxycycline chosen as an anti-inflammatory disease strategy is not a substitute for appropriate treatment of significant infection."},
       ]},
       {b:"warn", html:"Starting <b>oral prednisolone</b> in primary care for suspected pemphigoid should normally be a dermatology-agreed decision: it commits a frail patient to months of steroid with bone, glucose, infection and adrenal consequences, and can blur the biopsy. Do not start systemic prednisolone for suspected pemphigus or extensive bullous pemphigoid without dermatology/acute medical agreement unless following an established local pathway — suspected pemphigus needs urgent specialist care."}
     ]},

    {id:"ladder", nav:"Treatment ladder", title:"Specialist-led treatment ladder the GP must understand", sub:"Most patients are started in dermatology and continued in primary care. Know what each step means for monitoring.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Localised/mild", title:"Very potent topical corticosteroid", when:"clobetasol propionate 0.05%",
          html:"First-line for localised or mild disease — <span class='rx'>clobetasol propionate 0.05%</span> to affected skin under dermatology or an agreed primary-care plan. Extensive disease: whole-body use only under dermatology supervision, with a clear quantity, application and tapering plan and documented intended duration; EADV 2022 suggests about <b>20–30 g/day in mild–moderate and 30–40 g/day in extensive disease</b>, usually excluding the face and anogenital areas initially; the trial regimen cited by BAD 2012 was 40 g/day applied whole-body, with better survival and fewer adverse events than prednisone 1 mg/kg in extensive disease. Practicality (who applies it) often limits this. Dermatology-guided, then tapered over months."},
         {step:"Extensive", title:"Oral prednisolone", when:"lowest effective dose",
          fromLabel:"widespread / inadequate topical control",
          html:"Oral prednisolone (the BLISTER comparator was <b>0.5 mg/kg/day</b>) to induce control, then taper to the lowest effective dose. <b>Assess fracture risk and start bone protection without waiting for DXA in higher-risk patients</b> (NOGG 2024), PPI only with additional GI risk, Steroid Emergency Card (≥5 mg/day for over 4 weeks), capillary glucose monitoring and BP."},
         {step:"Alternative start", title:"Doxycycline-start strategy", when:"BLISTER trial",
          fromLabel:"where steroid harm is the bigger worry",
          html:"<span class='rx'>Doxycycline 200 mg daily</span> may be considered by dermatology as an initial strategy (± limited topical steroid), particularly where systemic corticosteroid toxicity is a major concern. It is a treatment strategy, not a universally equivalent substitute for prednisolone: it is less rapid in controlling blistering, may require rescue or additional prednisolone, and has limited efficacy in severe disease, but caused fewer severe treatment-related events at a year. Counsel: take with a full glass of water while upright and avoid lying down soon after; photosensitivity; oesophagitis; nausea/diarrhoea; separate from calcium, iron, magnesium and antacids per the product information; review renal/hepatic context and interacting medicines."},
         {step:"Steroid-sparing", title:"Add an adjuvant", when:"to reduce steroid burden",
          fromLabel:"steroid-dependent / complications",
          html:"Immunosuppressants (azathioprine, methotrexate, mycophenolate mofetil) — prescribing and initiation remain specialist-led with baseline screening. Primary care accepts shared care only where a written local (Greater Manchester) shared-care protocol and specialist responsibility agreement exist; monitoring intervals and action thresholds differ by drug and come from that drug’s protocol."},
         {step:"Refractory", title:"Specialist escalation", when:"resistant disease",
          fromLabel:"inadequate response",
          html:"Other systemic agents or biologics (e.g. rituximab, omalizumab, dupilumab) per specialist; specialist-led and subject to current commissioning arrangements (some use is off-label)."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"BLISTER: what it showed", html:"253 patients randomised to start doxycycline 200 mg/day or prednisolone 0.5 mg/kg/day. At 6 weeks, <b>74%</b> (83/112) on doxycycline vs <b>91%</b> (92/101) on prednisolone had ≤3 blisters — adjusted difference 18.6%, within the pre-set 37% non-inferiority margin. Related severe, life-threatening or fatal events at 52 weeks: <b>18%</b> vs <b>36%</b>. The trial tested a doxycycline-start strategy, not doxycycline as a universal substitute for prednisolone.", src:"BLISTER trial, Williams et al., Lancet 2017"},
         {tone:"green", h:"So which start?", html:"A trade-off discussed with the patient: prednisolone controls blisters faster; a doxycycline start roughly halved serious treatment-related harm but may need rescue prednisolone. The choice is dermatology-led. In frail patients with diabetes, osteoporosis or infection risk, that matters.", src:"BLISTER trial, Williams et al., Lancet 2017"}
       ]},
       {b:"warn", html:"Long-term steroids in frail elderly patients carry major risks — <b>bone, GI, glucose, BP, infection, mood and adrenal suppression</b>. Immunosuppressants need baseline screening and regular bloods. Secondary skin infection is common → treat promptly."}
     ]},

    {id:"steroid-safety", nav:"Steroid safety", title:"Steroid safety — the GP’s main shared-care job", sub:"Topical clobetasol over large areas is absorbed too; do not assume it is systemically inert.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"Bone protection — assess fracture risk at the start", html:"Assess fracture risk at the start of oral corticosteroids. In older adults — particularly postmenopausal women, men aged ≥50, those with a previous fragility fracture, women aged ≥70, those above the FRAX intervention threshold, or those receiving <b>prednisolone ≥7.5 mg/day for about 3 months</b> — start bone protection (oral bisphosphonate first-line, or IV zoledronate) <b>without waiting for DXA</b>, in line with NOGG and local osteoporosis guidance. Assess calcium intake and vitamin D status; consider renal function, GI contraindications and ability to follow oral bisphosphonate instructions; arrange DXA where useful but don’t delay treatment in high-risk patients; review dental health and fall risk.", src:"NOGG 2024 UK osteoporosis guideline"},
         {tone:"amber", h:"Steroid Emergency Card vs Steroid Treatment Card", html:"Two different cards. A <b>Steroid Treatment Card</b> records current steroid treatment (systemic or substantial topical). A <b>Steroid Emergency Card</b> is for people at risk of adrenal insufficiency/adrenal crisis. Patients taking prednisolone 5 mg/day or more for over 4 weeks, or equivalent systemic steroid exposure, should be assessed for adrenal suppression and usually issued a Steroid Emergency Card with sick-day advice; never stop abruptly. Large-area, high-dose clobetasol — especially about 200 g/week or more, or combined with systemic steroids — may also cause adrenal suppression; seek dermatology/endocrine advice. Not every patient on topical clobetasol needs an emergency card: risk depends on quantity, duration, area, occlusion, age, skin integrity and concurrent steroid exposure.", src:"NatPSA/2020/005 Steroid Emergency Card; Society for Endocrinology/BAD/SPS exogenous steroids guidance 2020"},
         {tone:"blue", h:"Glucose and blood pressure", html:"Steroids raise afternoon glucose and BP. HbA1c shows background diabetes risk but will not detect rapid steroid-related hyperglycaemia: in people with diabetes or at high risk, arrange <b>capillary glucose monitoring, especially later in the day</b>, after starting or increasing prednisolone, and review glucose within days rather than waiting for a routine HbA1c. Check BP at baseline and during treatment; people with diabetes need a plan to adjust therapy (especially if the gliptin has just been stopped)."},
         {tone:"amber", h:"Infection and vaccination", html:"Immunosuppressed patients are at risk of skin and systemic infection, and of atypical presentation. Consider seasonal flu, COVID-19 and pneumococcal vaccination according to current eligibility (Green Book ch.7), not simply because steroids have been given. Live-vaccine advice depends on steroid dose, duration and route, concurrent immunosuppressants and biologics (Green Book ch.6) — check the current chapter rather than a single threshold. Inactivated vaccines can generally be given but may produce a reduced response; Shingrix is non-live and may be appropriate where indicated; rituximab and other biologics need specialist timing advice.", src:"UKHSA Green Book ch.6 and ch.7"},
         {tone:"cream", h:"GI protection", html:"Consider a PPI only for patients on oral steroid with additional GI risk (NSAID, antiplatelet or anticoagulant use, or previous ulcer disease); it is not mandatory for every steroid course."},
         {tone:"amber", h:"Skin atrophy from topical clobetasol", html:"Large-area very potent topical steroid can thin skin, cause purpura and be absorbed systemically; the dermatology plan should include a taper to the least frequent application that controls disease.", src:"EADV 2022 S2k bullous pemphigoid guideline, JEADV (international)"}
       ]}
     ]},

    {id:"monitor", nav:"Monitoring", title:"Follow-up and monitoring in shared care", sub:"Every row has an action. Most relapses happen during the taper.",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["Disease activity (new blisters, itch, healing)","Each review","A few new blisters a week during taper may be acceptable per dermatology; worsening or not controlled → dermatology"],
         ["Steroid complications","Regular","Capillary glucose (within days of starting or increasing), BP, weight, oedema; bone protection in place; infection; mood and sleep; proximal weakness; cataracts/glaucoma; dyspepsia"],
         ["Bone","At start of oral steroid","Fracture-risk assessment; bisphosphonate/zoledronate started with the steroid in higher-risk patients (NOGG 2024); DXA where useful"],
         ["Immunosuppressant bloods (shared care)","Per the drug-specific written shared-care protocol","Only under a written local shared-care protocol and specialist responsibility agreement; monitoring intervals, action thresholds, when to withhold and who to contact come from that drug’s protocol (azathioprine, methotrexate and mycophenolate differ); address pregnancy prevention (especially mycophenolate), infection, vaccination, renal impairment and interactions"],
         ["Skin infection","Each review","Increasing redness, pain, pus or odour → swab and antibiotics"],
         ["Doxycycline","During treatment","Photosensitivity, oesophagitis, nausea/diarrhoea; separate from calcium, iron, magnesium and antacids per product information; renal/hepatic context and interacting medicines"],
         ["Drug trigger","At diagnosis and any relapse","Gliptin reviewed and decision documented? New possible culprit drugs added since?"]
       ]},
       {b:"timeline", items:[
         {n:"1", when:"Soon after diagnosis", title:"Establish shared care", html:"Confirm dermatology plan, start skin/wound care, district nursing, fracture-risk assessment and bone protection if on steroids (PPI only with extra GI risk), Steroid Emergency Card where indicated, trigger review."},
         {n:"2", when:"Regular reviews", title:"Control and complications", html:"Disease activity, steroid/immunosuppressant monitoring, infection, nutrition, carer support."},
         {n:"3", when:"As disease settles", title:"Taper and maintain", html:"Support gradual steroid taper directed by dermatology; remission often follows, but treatment may be required for months or years and relapses during tapering are common."}
       ]}
     ]},

    {id:"notcontrolled", nav:"Not controlled?", title:"Not controlled or deteriorating? Check before blaming the treatment", sub:"Exclude infection and practical problems before assuming treatment failure.",
     blocks:[
       {b:"dl", rows:[
         ["1 · Infection","Secondary bacterial infection or sepsis → swab, treat, may need admission"],
         ["2 · Adherence/technique","Topical steroid applied adequately to all affected areas (who is applying it?); oral steroid taken and tapered correctly?"],
         ["3 · Drug trigger","Ongoing DPP-4 inhibitor or other possible trigger — review with the prescriber, diabetes or oncology team and dermatology"],
         ["4 · Complications","Fluid/protein loss, steroid harms, immobility → manage; consider admission if frail"],
         ["5 · Diagnosis","Is this really pemphigoid? New mucosal disease or flaccid erosions → urgent re-review for pemphigus or another blistering disease"],
         ["6 · Escalate","Active or extensive disease → dermatology for systemic or steroid-sparing escalation"]
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"When and where to refer", sub:"Refer all suspected autoimmune blistering disease; the urgency is set by extent, mucosa and frailty.",
     blocks:[
       {b:"table", head:["Situation","Urgency","Where / what to send"], rows:[
         ["Shock, airway concern, severe dehydration, marked confusion or high-risk sepsis","<b>Emergency ambulance / 999</b>","Acute medical admission; drug list with start dates"],
         ["Suspected SJS/TEN","<b>Immediate hospital assessment</b>; emergency transfer if unstable or unable to travel safely","Stop potential culprit drug; acute medicine or on-call dermatology; drug list with start dates"],
         ["Extensive or rapidly progressive blistering/erosions; unable to eat/drink or cope","<b>Same-day or urgent</b>","Dermatology or acute medical assessment; photos, extent, frailty, treatment started, gliptin status"],
         ["Prominent oral, ocular, genital or laryngeal involvement","<b>Same-day</b> discussion","Dermatology; urgent ophthalmology if ocular symptoms"],
         ["Suspected pemphigus (painful erosions, flaccid blisters, inability to eat/drink)","<b>Same-day</b> dermatology discussion; likely admission if unable to eat/drink","Dermatology ± oral medicine/ophthalmology; photos, duration, weight, ability to eat"],

         ["Localised or prodromal suspected pemphigoid","Clinically stable: urgent dermatology referral or same-week advice-and-guidance, according to the local Bolton dermatology pathway (PCDS)","Dermatology for biopsy + DIF; start clobetasol on advice"],
         ["Steroid/immunosuppressant complications or refractory disease","Urgent or routine by severity","Dermatology; bloods, glucose, BP"],
         ["Eye involvement","Urgent (same day if symptomatic)","Ophthalmology and dermatology"]
       ]},
       {b:"say", html:"These blisters are caused by the immune system attacking the skin; it’s treatable but needs a skin specialist to confirm it with a small skin sample and guide treatment, usually strong steroid creams, sometimes tablets or an antibiotic called doxycycline. We’ll arrange dressings and keep a close eye on the skin and on any side effects of treatment."}
     ]},

    {id:"safety", nav:"Safety-net", title:"Safety-netting", sub:"Give it to the carer or care-home staff in writing as well.",
     blocks:[
       {b:"tiles", v:"safety", items:[
         {t:"🔴 Sepsis / extensive disease", html:"“Widespread blistering with fever, shivering, confusion, feeling very unwell, or large areas of raw skin — call 999 or get urgent help the same day.”"},
         {t:"🦠 Skin infection", html:"“Spreading redness, pus, increasing pain or smell around the blisters — contact us the same day; it may need antibiotics.”"},
         {t:"💊 Steroid risks", html:"“On steroid tablets: don’t stop suddenly, carry your steroid card, and tell us about signs of infection, high sugars (thirst, passing lots of urine) or new tummy pain or black stools.”"},
         {t:"👁️ Mucosal/eye", html:"“Blisters or soreness in the mouth, eyes or genitals, or trouble swallowing — tell us promptly; this needs specialist review.”"}
       ]},
       {b:"say", html:"You have a condition where the immune system makes blisters on the skin. It isn’t catching, and it often settles in time, though treatment may be needed for months or sometimes years. The main treatment is a strong steroid ointment — you’ll need a lot of it, and the nurses can help apply it. I’d also like to talk about stopping your sitagliptin, because it can sometimes bring this on, and agree a different treatment for your diabetes with you. If you get a temperature, feel muddled or the skin becomes red, hot and smelly, don’t wait — ring us or 111 the same day."}
     ]},

    {id:"pitfalls", nav:"Pitfalls", title:"Common pitfalls", sub:"Most harm comes from delay, mislabelling and unprotected steroids.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"Calling the prodrome eczema or scabies", html:"Repeated scabies treatments or mild steroids for an older person’s itchy urticated rash delays diagnosis. Refer for biopsy when it doesn’t behave.", src:"EADV 2022 S2k bullous pemphigoid guideline, JEADV (international)"},
         {tone:"red", h:"Treating mouth erosions as ulcers or thrush", html:"Persistent oral erosions in an adult (typically, but not only, middle-aged) may be pemphigus; biopsy, don’t just repeat mouthwash.", src:"BAD 2017 pemphigus vulgaris guideline"},
         {tone:"amber", h:"Not reviewing the gliptin", html:"Product information advises discontinuation if pemphigoid is suspected, though the benefit of stopping is uncertain (EADV 2022). Review and document the decision with an alternative diabetes plan rather than leaving it unexamined."},
         {tone:"green", h:"Oral steroid without bone protection", html:"Assess fracture risk when prednisolone starts; higher-risk patients — including most frail older people on prednisolone for months — need bone protection from day one, not after DXA.", src:"NOGG 2024 UK osteoporosis guideline"},
         {tone:"amber", h:"Under-prescribing topical steroid", html:"Clobetasol works when enough is applied to all affected skin; a 30 g tube is not enough for extensive disease. Check who applies it.", src:"BAD 2012 bullous pemphigoid guideline"},
         {tone:"amber", h:"Stopping steroids abruptly", html:"Adrenal suppression is likely after weeks of prednisolone; taper per dermatology and issue a steroid emergency card.", src:"NatPSA/2020/005 Steroid Emergency Card (NHS England, with the Society for Endocrinology)"}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card — the classic older-patient blistering case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"An 82-year-old woman with type 2 diabetes (metformin and sitagliptin started a year ago) and mild dementia. Her daughter reports three months of “eczema” that itches all night and now large, tense, fluid-filled blisters on her thighs and tummy. No mouth soreness, afebrile, eating and drinking. She is worried it’s “something catching” from the care home."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Links itch prodrome + tense blisters + age to pemphigoid; asks about <b>mouth/eyes</b> and systemic features to exclude pemphigus, SJS and sepsis; recognises the <b>gliptin</b> as a possible trigger and reviews/discusses stopping it with an alternative plan for glucose; arranges <b>dermatology for biopsy + DIF</b> at the right urgency; starts clobetasol on advice with blister care and district nursing; if prednisolone is planned, addresses <b>bone protection, steroid card, glucose</b>; reassures it isn’t infectious; involves the daughter and care home; clear safety-net."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Named sources for every recommendation. No clinician review is recorded for this page yet.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>1. <b><a href="https://doi.org/10.1111/bjd.12072" target="_blank" rel="noopener">British Association of Dermatologists’ guidelines for the management of bullous pemphigoid 2012</a></b> (Venning et al., Br J Dermatol 2012;167:1200–14; doi:10.1111/bjd.12072)<span class="rd"> — still the current BAD BP guideline (no newer BAD BP guideline found, September 2026; the BAD 2024 national reaudit, Skin Health Dis 2025, reported increasing doxycycline use); diagnosis by biopsy + DIF, topical clobetasol, systemic steroids, tetracyclines, supportive care</span></li>'+
         '<li>2. <b><a href="https://doi.org/10.1111/bjd.15930" target="_blank" rel="noopener">British Association of Dermatologists’ guidelines for the management of pemphigus vulgaris 2017</a></b> (Harman et al., Br J Dermatol 2017;177:1170–1201; doi:10.1111/bjd.15930)<span class="rd"> — pemphigus diagnosis and treatment including rituximab</span></li>'+
         '<li>3. <b><a href="https://pubmed.ncbi.nlm.nih.gov/28279484/" target="_blank" rel="noopener">BLISTER trial</a></b> — Williams HC et al. Doxycycline versus prednisolone as an initial treatment strategy for bullous pemphigoid. Lancet 2017 (PMID 28279484)<span class="rd"> — doxycycline 200 mg/day vs prednisolone 0.5 mg/kg/day; 74% vs 91% blister control at 6 weeks; related severe/life-threatening/fatal events 18% vs 36% at 52 weeks</span></li>'+
         '<li>4. <b><a href="https://doi.org/10.1111/jdv.18220" target="_blank" rel="noopener">EADV updated S2k guideline for the management of bullous pemphigoid</a></b> (Borradori et al., JEADV 2022; doi:10.1111/jdv.18220; international)<span class="rd"> — European consensus on diagnosis, non-bullous presentations, topical clobetasol quantities, doxycycline and gliptin uncertainty, tapering</span></li>'+
         '<li>5. <b><a href="https://www.nogg.org.uk/full-guideline" target="_blank" rel="noopener">NOGG 2024 — UK clinical guideline for the prevention and treatment of osteoporosis</a></b> (section 7, glucocorticoid-induced osteoporosis)<span class="rd"> — start bone protection with glucocorticoids in higher-risk groups: prior fragility fracture, women ≥70, postmenopausal women and men ≥50 on ≥7.5 mg/day prednisolone for 3 months, or FRAX above the intervention threshold</span></li>'+
         '<li>6. <b>National Patient Safety Alert NatPSA/2020/005/NHSPS — Steroid Emergency Card to support early recognition and treatment of adrenal crisis in adults</b> (NHS England with the Society for Endocrinology, 13 August 2020)<span class="rd"> — primary reference for identifying and carding patients at risk of adrenal crisis</span></li>'+
         '<li>7. <b>Exogenous steroids treatment in adults with adrenal insufficiency and adrenal crisis</b> (Society for Endocrinology, BAD and Specialist Pharmacy Service; modified May 2020)<span class="rd"> — prednisolone ≥5 mg/day for over 4 weeks; substantial topical exposure as a cause of adrenal suppression</span></li>'+
         '<li>8. <b>Product information (SmPC section 4.4) for the specific DPP-4 inhibitor prescribed — e.g. sitagliptin (Januvia), linagliptin (Trajenta)</b><span class="rd"> — post-marketing reports of bullous pemphigoid; advise discontinuation if suspected (check via your approved medicines-information source)</span></li>'+
         '<li>9. <b><a href="https://www.gov.uk/government/publications/contraindications-and-special-considerations-the-green-book-chapter-6" target="_blank" rel="noopener">UKHSA Green Book chapters 6 and 7</a></b><span class="rd"> — ch.6 contraindications incl. live vaccines and steroid thresholds; ch.7 immunisation of individuals with underlying medical conditions (immunosuppression)</span></li>'+
         '<li>10. <b><a href="https://www.pcds.org.uk/clinical-guidance/bullous-pemphigoid" target="_blank" rel="noopener">Primary Care Dermatology Society (PCDS) — Bullous pemphigoid</a></b><span class="rd"> — two biopsies; DIF specimen same-day or in Michel’s medium; urgent referral</span></li>'+
         '<li>11. <b>Primary Care Dermatology Society (PCDS) — Drug rashes: severe</b><span class="rd"> — SJS/TEN: stop culprit drug, immediate specialist assessment and admission where appropriate</span></li>'+
         '<li>12. <b><a href="https://doi.org/10.1111/bjd.14530" target="_blank" rel="noopener">U.K. guidelines for the management of Stevens–Johnson syndrome/toxic epidermal necrolysis in adults 2016</a></b> (BAD, Br J Dermatol 2016; doi:10.1111/bjd.14530)</li>'+
         '<li>13. <b>NICE NG253 — Suspected sepsis in people aged 16 or over: recognition, assessment and early management</b><span class="rd"> — NEWS2 alongside clinical concern, frailty and the ability to manage safely outside hospital</span></li>'+
         '<li>14. <b>DermNet — Bullous drug eruptions</b><span class="rd"> — review and cessation of a likely culprit drug requires clinical judgement</span></li>'+
         '<li>15. <b>Local pathways</b><span class="rd"> — Greater Manchester shared-care protocols for azathioprine, methotrexate and mycophenolate; Bolton dermatology advice-and-guidance and emergency referral pathway</span></li>'+
         '<li>Further reading: BAD patient information leaflet on pemphigoid.</li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Bullous pemphigoid and pemphigus in primary care — BAD 2012 bullous pemphigoid guideline, BAD 2017 pemphigus vulgaris guideline, BLISTER trial (Lancet 2017), EADV 2022 S2k guideline, NOGG 2024 and NatPSA/2020/005. Diagnosis is dermatology-confirmed; whole-body clobetasol, doxycycline and all systemic treatment are dermatology-led. Verify all doses against the current BNF before prescribing."
});
