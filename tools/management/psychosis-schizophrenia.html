<script>
MG.render({
  icon:"🧠",
  title:"Psychosis and schizophrenia — the complete guide",
  eyebrow:"Protocol · diagnose &amp; manage in one place",
  stemTitle:"First-episode psychosis is a time-critical referral — do not wait for diagnostic certainty: earlier assessment and treatment are associated with better outcomes, and NICE recommends referral without delay",
  stemSub:"One page for the whole condition: assess risk and consider organic and substance-related causes, characterise positive, negative and disorganised symptoms with a collateral history, refer urgently to Early Intervention in Psychosis for a first episode regardless of age or duration of untreated psychosis (under 18: the local CAMHS/EIP pathway), then share the two long-term roles — physical health monitoring (secondary care retains responsibility for at least the first 12 months or until stable) and the relapse signature.",
  guideline:"NICE CG178 (2014) · NICE CG155 (2013, updated 2016) · NICE CG185 (2014, updated 2023) · NICE TA136 · NICE CG120 · current Mental Health Act and Code of Practice",
  reviewed:"9 September 2026",
  nextReview:"9 March 2027",
  meta:[
    {t:"NICE CG178 — psychosis and schizophrenia in adults (2014)"},
    {t:"NICE CG155 — children &amp; young people"},
    {t:"NICE CG185 — bipolar disorder"},
    {t:"NHS England EIP access &amp; waiting time standard"},
    {t:"NG12 only for progressive CNS deficit", tone:"tw"},
    {t:"v1.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#severe"><b>Exclude first</b><small>Risk · organic causes</small></a><a href="#confirm"><b>Characterise</b><small>Positive · negative · differential</small></a><a href="#workup"><b>Work-up</b><small>Exam · bloods · ECG</small></a><a href="#ladder"><b>Treat</b><small>EIP · specialist-led · CBTp</small></a><a href="#monitor"><b>GP role</b><small>Physical health · relapse</small></a></div>',
  quickSub:"If you read nothing else on this page, read these six cards. Every number traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Consider organic and substance-related causes", html:"An organic or substance-related cause occurs in a clinically important minority of first presentations — approximately 5–10% in the evidence considered by NICE. The proportion is higher when onset is atypical or acute, or accompanied by delirium, seizures, neurological signs or systemic illness; the clinical presentation, not a percentage, determines the work-up. <b>Missing encephalitis carries a mortality risk</b> — seek urgent medical/neurology advice with rapidly progressive psychosis, seizures, altered consciousness, catatonia, abnormal movements, autonomic instability, fever or focal signs."},
    {tone:"red", h:"Command hallucinations need an immediate risk assessment", html:"Assess directly the content and target of the command, intent to act, perceived ability to resist, access to means, immediacy, past behaviour, intoxication, protective factors and risk to identified others. <b>Use 999/emergency services when there is imminent or unmanageable risk, severe agitation, violence, serious self-neglect or inability to assess safely; otherwise arrange same-day crisis-team or urgent psychiatric assessment.</b> Suicidal thoughts: assess immediacy and means — imminent intent or inability to maintain safety warrants emergency action. Do not manage substantial risk alone in general practice."},
    {tone:"amber", h:"Refer without waiting for certainty", html:"Avoid delay: earlier assessment and treatment are associated with better outcomes, and NICE recommends referral without delay. Refer a first episode or first presentation urgently to Early Intervention in Psychosis, regardless of age or duration of untreated psychosis (CG178); NICE requires assessment without delay. NHS England has an access and waiting-time standard for a package of EIP care within two weeks for a defined proportion of people aged 14–65 — a service measure, not an individual entitlement; check local pathways and current national definitions. EIP teams assess and confirm the diagnosis — that is their job, not yours."},
    {tone:"blue", h:"Negative symptoms are common and easily missed", html:"Reduced expression (blunted affect), reduced speech (alogia), loss of motivation (avolition), loss of pleasure (anhedonia) and social withdrawal may precede florid psychosis. <b>Negative symptoms are common, clinically important and may be missed</b> — assess them directly, because they can substantially affect functioning and recovery."},
    {tone:"amber", h:"Baseline before any antipsychotic", html:"<b>Weight (plotted), waist circumference, pulse and BP, fasting glucose or HbA1c, lipids, prolactin, movement disorders, nutrition, diet and activity before starting</b> (CG178); FBC, U&amp;E, LFT and TFT belong to the medical work-up, not universal antipsychotic monitoring. <b>ECG</b> if the SPC requires one, cardiovascular risk is identified, there is a personal or family cardiac history, the person is being admitted, or QT-prolonging medication is being considered — interpret QTc with the ECG report, the SPC and local policy. <b>Antipsychotic initiation is specialist-led</b>; CG178 names no preferred antipsychotic and the choice is shared with the person."},
    {tone:"green", h:"Physical health — a shared, long-term role", html:"People with schizophrenia have substantially reduced life expectancy, largely from cardiovascular disease. Primary care has an important long-term role in physical-health monitoring, but <b>secondary care retains responsibility for monitoring antipsychotic treatment and physical health for at least the first 12 months or until the person is stable, whichever is longer</b>. Transfer to primary care should be explicit, communicated and supported by a shared-care plan."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step comes before any diagnostic label.",
  pathway:[
    {title:"Assess risk and screen for organic cause", html:"<b>Risk to self or others, command hallucinations, severe self-neglect</b> · <b>delirium, drug-induced, neurological</b> · acute behavioural disturbance. Imminent or unmanageable risk → 999; significant risk → same-day crisis team, duty psychiatrist or AMHP service.", alert:true},
    {title:"Characterise the psychosis", html:"<b>Positive, negative and disorganised symptoms</b>, duration, function and insight, with a collateral history — often the most reliable information when insight is impaired."},
    {title:"Exclude the secondary causes", html:"Full physical and neurological examination, bloods guided by clinical context, urine toxicology where clinically useful, HIV and syphilis testing where indicated, a pregnancy test if pregnancy is possible, and an ECG where indicated. Neuroimaging only on indication. Do not delay referral waiting for routine results."},
    {title:"Refer, then support the treatment", html:"EIP urgently for a first episode, regardless of age or duration of untreated psychosis; under 18: local CAMHS/EIP pathway (CG155); known relapse: the responsible CMHT/EIP team and crisis plan. Antipsychotics are <b>specialist-led</b> — do not start them in primary care unless in consultation with a consultant psychiatrist; <b>CBTp and family intervention sit alongside them as first-line</b>."},
    {title:"Share the long game", html:"After explicit transfer or shared-care agreement: annual physical health review, metabolic monitoring, cannabis and smoking cessation, and a documented relapse signature with the patient and carer."}
  ],
  sections:[

    {id:"severe", nav:"Exclude first", title:"Red flags — immediate danger and organic causes",
     sub:"Screen for organic causes and immediate risk before assuming primary psychiatric illness.",
     blocks:[
       {b:"table", head:["Red flag","Suggests","Action"], rows:[
         ["<b>Command hallucinations to harm</b>","Hearing voices instructing violence to self or others","<b>Immediate direct assessment of intent, controllability, access to means and risk to self or others.</b> 999 if imminent or unmanageable risk or unable to assess safely; otherwise same-day crisis-team or urgent psychiatric assessment"],
         ["<b>Suicidal thoughts with a plan</b>","Expressed intent, plan, access to means, previous attempts","<b>Assess immediacy and means.</b> Imminent intent or inability to maintain safety → emergency action and do not leave the person alone; otherwise same-day crisis assessment"],
         ["<b>Acute confusion with fever</b>","<b>Encephalitis or meningitis</b> — neck stiffness, photophobia, rash","<b>999</b>"],
         ["<b>New-onset seizures</b>","<b>Temporal lobe epilepsy, CNS lesion</b>","<b>Same-day neurology or A&amp;E</b>"],
         ["<b>Focal neurological signs</b>","New weakness, dysphasia, diplopia","<b>Urgent medical/neurological assessment (999 if acute stroke suspected)</b>"],
         ["<b>Severe agitation or violence risk</b>","Unable to engage safely; risk to the clinician","<b>999, with police support if needed</b>"],
         ["<b>Rapid cognitive decline over days to weeks</b>","<b>Delirium, or dementia with BPSD</b>","<b>Same-day medical review</b>"],
         ["<b>Substance intoxication or overdose</b>","Stimulants, cannabis, alcohol excess or withdrawal","<b>Suspected overdose or severe intoxication → emergency assessment</b>; otherwise same-day, with urine toxicology where clinically useful"],
         ["<b>Severe self-neglect</b>","Not eating or drinking, unsafe living conditions, vulnerable dependants","<b>Emergency hospital assessment if immediate medical risk</b>; otherwise same-day crisis team"]
       ]},
       {b:"warn", html:"<b>When someone declines help:</b> a Mental Health Act assessment is not triggered simply by hallucinations or delusions. If the person refuses assessment or treatment and there is significant risk, contact the local crisis/approved mental health professional (AMHP) service for advice about a Mental Health Act assessment — a formal assessment involves an AMHP and doctors, including a section 12 approved doctor. Police can use section 136 to remove a person from a public place to a place of safety if the statutory criteria are met; it cannot be used in a private dwelling or its garden, where a section 135 warrant may be relevant — not a route for a GP to arrange without local AMHP/police guidance. Do not attempt to manage substantial risk alone in general practice. Throughout: <b>keep calm, ensure staff safety, and debrief the team afterwards.</b>"},
       {b:"why", html:"An organic or substance-related cause occurs in a clinically important minority of first presentations (approximately 5–10% in the evidence considered by NICE), more often when onset is atypical or acute or there is delirium, seizures, neurological signs or systemic illness. Autoimmune encephalitis, CNS infection, metabolic derangement and substance-induced psychosis need considering before a psychiatric diagnosis is made, and missing encephalitis carries a mortality risk. Command hallucinations require an immediate, direct risk assessment — do not manage substantial risk alone in primary care."},
       {b:"dl", rows:[
         ["<b>NG12 stated honestly</b>","Psychosis has no NICE NG12 suspected-cancer criterion, and none should be invented for one. Do not routinely request brain imaging for uncomplicated first-episode psychosis. Arrange urgent medical/neurological assessment and appropriate imaging for focal neurological signs, new seizures, delirium, rapidly progressive cognitive or behavioural change, severe headache, papilloedema, atypical age of onset or other features suggesting CNS disease — these are not automatically an NG12 cancer pathway. Apply NG12 where there is <b>progressive, subacute loss of central neurological function</b>: urgent direct-access MRI (or CT if MRI is contraindicated) in adults. Worth holding in mind, because <b>CNS tumours can present with psychiatric symptoms</b>"]
       ]}
     ]},

    {id:"confirm", nav:"Characterise", title:"Confirm the psychotic features, then the differential",
     sub:"Accurate symptom characterisation determines urgency and referral pathway.",
     blocks:[
       {b:"dl", rows:[
         ["<b>Positive symptoms</b>","Hallucinations — auditory most common: voices commenting or commanding. Delusions — persecutory, referential, grandiose. Thought insertion and withdrawal. Passivity phenomena"],
         ["<b>Negative symptoms</b>","Blunted affect (less expressive), alogia (reduced speech), avolition (loss of motivation), anhedonia (loss of pleasure), social withdrawal — may precede florid psychosis and are frequently missed. Ask: has the person lost motivation or pleasure, become less expressive, stopped initiating activities, withdrawn socially or become less able to manage daily tasks? Could this instead be depression, sedation, akathisia or extrapyramidal effects, social anxiety, substance use, neurodevelopmental traits, trauma-related avoidance or cognitive impairment?"],
         ["<b>Disorganised symptoms</b>","Formal thought disorder (loosening of associations, tangentiality), disorganised behaviour, inappropriate affect"],
         ["<b>Duration and course</b>","Record duration, progression, functional decline and the relationship between psychotic symptoms and mood symptoms. Do not assign a definitive schizophrenia diagnosis in primary care based on duration alone — EIP/psychiatry establishes the diagnosis"],
         ["<b>Collateral history — essential</b>","<b>Contact family or carer with consent.</b> Baseline function, timeline of change, substance use, recent stressors. <b>Often the most reliable information when insight is impaired</b>"],
         ["<b>Mental state examination (MSE)</b>","Appearance, behaviour, speech (rate, form, content), mood, perception, cognition (orientation, memory), insight, judgement"]
       ]},
       {b:"table", head:["Diagnosis","Recognise it by","Action"], rows:[
         ["<b>Schizophrenia-spectrum psychosis</b>","Schizophrenia, schizoaffective disorder, delusional disorder","<b>Refer to EIP if this is a first episode</b>"],
         ["<b>Bipolar mania or mixed affective state with psychosis</b>","Elevated or mixed mood, grandiosity, reduced sleep, pressured speech, with psychotic features — which need not be mood-congruent; the key is the relationship between psychosis and mood episodes","<b>Urgent psychiatric referral</b> — see NICE CG185"],
         ["<b>Severe depression with psychosis</b>","Mood-congruent psychotic features — worthlessness, guilt, nihilistic delusions — with severe depression","<b>Urgent psychiatric referral</b>"],
         ["<b>Substance-induced</b>","Cannabis (high-potency \u201cskunk\u201d), stimulants (cocaine, amphetamine), alcohol withdrawal (hallucinosis), LSD, prescribed medicines","Ask directly about all substances and medicines; consider urine toxicology where it will assist assessment. A positive result does not prove causation, and a negative result does not exclude substance-related psychosis (NICE CG120 where they coexist)"],
         ["<b>Organic or secondary</b>","Delirium, dementia (BPSD), neurological disease, epilepsy, encephalitis or CNS lesion, endocrine/metabolic disorders (thyroid, calcium, B12), HIV, neurosyphilis, autoimmune encephalitis","<b>Targeted bloods plus urgent medical/neurology assessment where indicated</b>"],
         ["<b>Postpartum psychosis</b>","Onset in the weeks after childbirth — often rapid, with mood features","<b>Same-day specialist perinatal/crisis assessment</b>"],
         ["<b>Trauma-related or severe personality-related phenomena</b>","Intrusive perceptual experiences, dissociation or transient stress-related symptoms where relevant","<b>Specialist assessment to clarify the diagnosis</b>"],
         ["<b>At-risk mental state</b>","<b>Sub-threshold symptoms, help-seeking, brief limited psychotic episodes</b>","<b>With distress or functional decline: refer without delay to EIP or another specialist mental-health service</b>; do not prescribe antipsychotics solely to prevent psychosis"]
       ]},
       {b:"why", html:"<b>Treatment diverges significantly by diagnosis.</b> <b>Bipolar disorder requires mood stabilisers, not antipsychotics alone</b>, and <b>organic psychosis requires treatment of the underlying cause</b>. A short-lived episode after acute stress may resolve — but still needs urgent specialist input. And note the overlap rather than treating it as either/or: substance use and primary psychosis commonly co-exist, so a positive drug screen does not exclude a primary psychosis."}
     ]},

    {id:"workup", nav:"Work-up", title:"Examination and investigations",
     sub:"A full physical examination is mandatory in all new presentations of psychosis.",
     blocks:[
       {b:"table", head:["Examine","Looking for"], rows:[
         ["<b>Vital signs</b>","Temperature (infection or encephalitis), BP, HR, oxygen saturation — tachycardia with fever is an organic emergency"],
         ["<b>Neurological examination</b>","Cranial nerves, focal deficits, cerebellar signs, primitive reflexes, meningism — any abnormality goes to neurology same-day"],
         ["<b>Cognitive screen</b>","Orientation, MMSE or MoCA — disorientation suggests delirium or an organic cause, not primary psychosis"],
         ["<b>Eyes</b>","Kayser-Fleischer rings (Wilson's disease — rare), nystagmus (intoxication or cerebellar), pupil abnormalities"],
         ["<b>Thyroid</b>","<b>Goitre, lid lag, tremor — thyrotoxicosis can mimic mania or psychosis</b>"],
         ["<b>Substance signs</b>","Needle tracks, jaundice, parotid enlargement, ataxia, the smell of alcohol"]
       ]},
       {b:"table", head:["Investigation","Detail"], rows:[
         ["<b>Bloods — guided by clinical context</b>","<b>Consider FBC, U&amp;E/eGFR, LFT, glucose or HbA1c, TFT and calcium; B12/folate and CRP where indicated.</b> Do not delay urgent psychiatric or medical referral while waiting for routine results"],
         ["<b>Infection and autoimmune screen</b>","Consider HIV and syphilis testing when clinically indicated, particularly with sexual risk, neurological features, cognitive decline, atypical onset or relevant systemic findings (with consent). Seek urgent medical/neurology advice for possible autoimmune encephalitis with rapidly progressive psychosis, seizures, altered consciousness, catatonia, abnormal movements, autonomic instability, fever, focal signs or severe cognitive disturbance — antibody testing is specialist-guided, not based on sex or age alone"],
         ["<b>Urine toxicology</b>","Ask directly about alcohol, cannabis, stimulants, hallucinogens, prescribed medicines and other substances. Consider urine toxicology where it will assist assessment, particularly if the history is unavailable, unreliable or disputed, with consent and within local laboratory limits. A positive result does not prove causation; a negative result does not exclude substance-related psychosis"],
         ["<b>Pregnancy test</b>","<b>Offer a pregnancy test to anyone who could be pregnant before an antipsychotic is started</b>, with consent and explanation — it affects medication choice, emergency treatment and valproate exposure"],
         ["<b>ECG</b>","Before antipsychotic treatment if required by the SPC, cardiovascular risk is identified, there is a personal or family cardiac history, the patient is being admitted, or QT-prolonging medication is being considered (CG178). Interpret QTc with the ECG report, medication-specific SPC and local policy; seek specialist advice for significant QT prolongation or a marked increase from baseline"],
         ["<b>Neuroimaging</b>","Not routine for uncomplicated first-episode psychosis (NICE TA136). Urgent medical/neurological assessment and appropriate imaging for focal neurological signs, new seizures, delirium, rapidly progressive cognitive or behavioural change, severe headache, papilloedema or atypical age of onset"]
       ]},
       {b:"why", html:"A core panel plus additional tests guided by history and examination is the aim — not a universal mandatory panel. An ECG is needed before antipsychotic treatment where CG178 or the SPC indicates it, because QT prolongation increases the risk of torsades de pointes. There is also a bigger reason for the physical examination: people with severe mental illness receive fewer physical health assessments and have substantially reduced life expectancy, partly from physical comorbidity — so the first presentation is the moment to establish a baseline. Viral encephalitis and CNS tumours can present with psychiatric symptoms, which is why the neurological examination matters most."}
     ]},

    {id:"ladder", nav:"Treat", title:"Treatment — referral first, then medication and therapy together",
     sub:"The GP role is assessment, safety and referral. Antipsychotic initiation is specialist-led — do not start antipsychotic medication for a first presentation of sustained psychotic symptoms in primary care unless in consultation with a consultant psychiatrist (CG178).",
     blocks:[
       {b:"ladder", steps:[
         {step:"Step 1", title:"Refer to EIP — time-critical", when:"any first episode, any age",
          html:"A first episode or first presentation of psychosis goes urgently to Early Intervention in Psychosis, regardless of age or duration of untreated psychosis; NICE requires assessment without delay (the NHS England two-week access standard is a service measure for a defined proportion aged 14–65). <b>Under 18: use the local CAMHS/EIP pathway; refer sustained psychotic symptoms urgently, and do not initiate antipsychotic treatment in primary care without consultant child and adolescent psychiatry involvement (CG155).</b> <b>Do not wait for diagnostic certainty — EIP teams assess and confirm.</b> A known relapse goes to the <b>CMHT</b>: optimise treatment and address adherence."},
         {step:"Specialist-led", title:"Antipsychotic chosen with the person", when:"after specialist assessment",
          fromLabel:"consultant psychiatrist / EIP",
          html:"CG178 names no single preferred antipsychotic. The specialist team discusses options and adverse-effect profiles and selects one antipsychotic by shared decision-making — efficacy, previous response, physical health, metabolic risk, prolactin, movement-disorder risk, sedation, interactions, pregnancy potential and preference — starting at an appropriate dose and titrating cautiously, with psychological interventions alongside. Avoid routine antipsychotic polypharmacy except briefly during switching or under specialist direction."},

         {step:"Acute agitation", title:"Local rapid-tranquillisation pathway", when:"acutely agitated or unsafe",
          fromLabel:"not routine primary care",
          html:"If the person is acutely agitated or unsafe, use the local rapid-tranquillisation pathway with appropriate physical monitoring via emergency or crisis services; this is not a routine primary-care intervention."},
         {step:"Treatment-resistant", title:"Clozapine — specialist only", when:"after adequate trials of at least 2 antipsychotics, one a non-clozapine second-generation drug (CG178)",
          fromLabel:"CMHT-led",
          html:"The only evidence-based treatment for treatment-resistant schizophrenia, with mandatory monitoring under the current clozapine monitoring service and product-specific requirements, including blood-count monitoring and other safety monitoring. <b>Initiation and monitoring remain specialist-led.</b>"}
       ]},
       {b:"table", head:["Stage","What to do"], rows:[
         ["<b>Before starting any antipsychotic</b>","<b>Weight (plotted on a chart), waist circumference, pulse, BP, fasting glucose or HbA1c, lipids, prolactin, movement disorders, nutritional status, diet and physical activity (CG178)</b>; ECG where indicated; pregnancy status where relevant; physical examination and medication/substance review. FBC, U&amp;E, LFT and TFT are part of the medical work-up rather than universal antipsychotic-monitoring requirements"],
         ["<b>Throughout treatment</b>","The specialist team monitors response, side effects — EPS (akathisia, parkinsonism), sedation, weight gain — movement disorders and adherence"],
         ["<b>First 6 weeks, then 12 weeks</b>","Weight weekly for the first 6 weeks; at 12 weeks weight, pulse, BP, fasting glucose, HbA1c and lipids — then at 1 year and annually, with waist circumference annually (CG178)"],
         ["<b>Inadequate response after an adequate, adherent trial</b>","The specialist team reviews diagnosis, dose, adherence, substance use, interactions and adverse effects, and considers switching if appropriate. <b>Clozapine only after inadequate response to adequate trials of at least two antipsychotics, including at least one non-clozapine second-generation antipsychotic</b> (CG178)"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"🧩 CBT for psychosis (CBTp)", html:"Recommended by CG178 for everyone with first-episode or established psychosis, alongside medication. Reduces positive symptoms and improves insight. At least 16 planned sessions. Access via CMHT or EIP psychology."},
         {tone:"green", h:"👨‍👩‍👧 Family intervention", html:"Offer family intervention where the person lives with or is in close contact with family or carers (CG178: at least 10 planned sessions over 3 months to 1 year), via EIP."},
         {tone:"amber", h:"🌿 Cannabis cessation", html:"Cannabis, particularly frequent or high-potency use, is associated with psychosis risk and relapse. Ask about it routinely and offer evidence-based substance-use support; refer to drug services."},
         {tone:"green", h:"❤️ Physical health promotion", html:"Antipsychotics increase cardiometabolic risk — offer a combined healthy eating and physical activity programme and smoking cessation support (CG178)."},
         {tone:"cream", h:"💼 Employment and education", html:"Individual Placement and Support (IPS) via EIP — returning to work or education improves long-term outcomes, and IPS is more effective than traditional vocational services."},
         {tone:"cream", h:"🤝 Carer support", html:"Signpost Rethink Mental Illness, Mind and local carers' groups. Carer's assessment via the GP or social care. Identify a named carer."},
         {tone:"cream", h:"🍺 Substance use", html:"Address all substances — alcohol and stimulants worsen psychosis. Dual diagnosis pathway if the comorbidity is significant. Non-judgemental approach."},
         {tone:"blue", h:"😴 Sleep hygiene", html:"<b>A regular sleep-wake cycle helps, and sleep change can be an early warning sign of relapse.</b> Limit caffeine later in the day. <b>Assess insomnia as part of the relapse signature.</b>"}
       ]},
       {b:"why", html:"Antipsychotics are effective for many people with first-episode psychosis, and cautious titration reduces extrapyramidal side effects. Antipsychotics differ in metabolic, prolactin, movement and sedative effects, which is why the choice is specialist-led and shared with the person. But medication is only half of it: CBTp and family intervention sit alongside antipsychotics as first-line treatment, not as optional extras."}
     ]},

    {id:"monitor", nav:"GP role", title:"Follow-up, monitoring and the relapse signature",
     sub:"Secondary care retains responsibility for monitoring antipsychotic treatment and physical health for at least the first 12 months or until stable, whichever is longer; transfer to primary care should be explicit and supported by a shared-care plan.",
     blocks:[
       {b:"table", head:["When","What"], rows:[
         ["<b>1–2 weeks</b>","Medication tolerance, EPS — akathisia is restlessness, often mistaken for worsening psychosis — sedation, and compliance"],
         ["<b>4–6 weeks</b>","Treatment response — are positive symptoms improving? Liaise with EIP or CMHT. Weight and BP"],
         ["<b>12 weeks</b>","By the specialist team in the first year, or as agreed under shared care — full metabolic review per CG178: weight, pulse, BP, fasting glucose, HbA1c, lipids (waist circumference is annual). Depression screen with PHQ-9"],
         ["<b>Annual (after explicit transfer or shared-care agreement)</b>","Comprehensive physical health review: weight, waist, BP, glucose/HbA1c and lipids per the NICE schedule and local agreement; cardiovascular risk, obesity, diabetes, dyslipidaemia, smoking, dental and sexual health, substance use, adherence and adverse effects — with SMI register recall. Contact secondary care promptly for deterioration, suspected relapse, significant side effects, pregnancy or medication changes"],
         ["<b>Relapse signature</b>","Agree an individualised relapse signature with the patient and, where appropriate, carers; common warning signs include sleep change, social withdrawal, altered speech, irritability, suspiciousness and reduced adherence"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 999", html:"Imminent or unmanageable risk of harm to self or others, severe agitation or violence, or organic symptoms (fever, confusion, seizures). Return of command hallucinations or significant risk otherwise → same-day crisis team."},
         {tone:"amber", h:"🟠 Same-day GP", html:"Significant deterioration in mental state, new concerns from a carer, or a suspected medication side effect — for example dystonia, or neuroleptic malignant syndrome."},
         {tone:"red", h:"⚠️ Neuroleptic malignant syndrome", html:"Rare but life-threatening — hyperthermia, rigidity, altered consciousness and autonomic instability require emergency admission and immediate specialist management."},
         {tone:"green", h:"📋 Crisis plan", html:"<b>Give crisis contacts and a written safety plan</b>, and make sure the carer has them too."}
       ]},
       {b:"why", html:"Metabolic adverse effects of antipsychotics are common, and people with psychosis have substantially reduced life expectancy — a strong argument for SMI register recall being taken seriously, under an explicit shared-care arrangement, rather than treated as a tick-box. Relapse signatures allow early intervention and reduce the need for hospitalisation. And GP–CMHT communication is essential: GPs often see these patients more frequently and are well placed to detect early deterioration."},
       {b:"say", html:"What you have been experiencing — the voices, and the sense that people are watching you — is something we can treat, and treating it early makes a real difference to how things go. So I am going to refer you today to a team that specialises in exactly this; I am not waiting to be certain of a label first, because getting help early tends to lead to better outcomes. Before any medication is considered, the team and I will arrange some checks, such as blood tests and possibly a heart tracing, so there is a safe baseline. Two other things matter as much as tablets: talking therapy designed for these experiences, and involving whoever is closest to you, because that can reduce the chance of this coming back. And I will keep seeing you for your physical health — blood pressure, weight, sugar — because that is where people with this diagnosis get let down, and I do not intend to let that happen."}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999 / urgent", html:"Imminent risk of suicide or serious harm to others, severe violence or agitation, inability to assess or safely contain risk, delirium, fever with confusion, seizures, focal neurological signs or suspected encephalitis, suspected overdose or severe intoxication, or severe self-neglect with immediate medical risk."},
         {tone:"red", h:"Same-day", html:"First-episode psychosis with significant distress, poor insight, or risk to self or others that is significant but not immediately life-threatening — contact the crisis team, duty psychiatrist or AMHP service for same-day assessment."},
         {tone:"amber", h:"EIP — urgent", html:"First episode or first presentation of psychosis, regardless of age or duration of untreated psychosis (CG178); NICE requires assessment without delay. NHS England has a two-week access and waiting-time standard for a defined proportion aged 14–65 — check local pathways and current national definitions. Contact the local Early Intervention in Psychosis team directly."},
         {tone:"blue", h:"Known illness and at-risk states", html:"<b>Known psychotic illness with relapse:</b> contact the responsible CMHT/EIP team and follow the crisis plan. <b>Attenuated or transient psychotic symptoms with distress or functional decline:</b> refer without delay to EIP or another specialist mental-health service; do not prescribe antipsychotics solely to prevent psychosis."},
         {tone:"purple", h:"Section 136 / Mental Health Act", html:"If the person refuses assessment or treatment and there is significant risk, contact the local crisis/AMHP service for advice about a Mental Health Act assessment (AMHP and doctors, including a section 12 approved doctor). Police s136 applies to public places only, not a private dwelling or garden. Follow the current Mental Health Act, Code of Practice and local crisis/AMHP pathway — do not rely on this guide for statutory interpretation."},
         {tone:"cream", h:"Children and adolescents", href:"", html:"Under 18: use the local CAMHS/EIP pathway (EIP may be appropriate from age 14 where the service includes child and adolescent psychiatry expertise). Sustained psychotic symptoms should be referred urgently. Do not initiate antipsychotic treatment in primary care without consultant child and adolescent psychiatry involvement (CG155). Consider the CAMHS crisis line."}
       ]},
       {b:"why", html:"Avoid delay: earlier assessment and treatment are associated with better outcomes, and NICE recommends referral without delay. EIP services reduce relapse rates, improve employment and reduce hospitalisation, and CG178 says they should be accessible to people with a first episode or first presentation, irrespective of age or duration of untreated psychosis. GPs should not wait for certainty of diagnosis — EIP teams assess and confirm."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 21-year-old brought by his mother, who says he has stopped going to lectures, barely leaves his room and has been talking about the neighbours recording him. He is guarded but not hostile, smokes high-potency cannabis daily, and says he does not think anything is wrong. His mother mentions he has seemed \u201cflat\u201d since Christmas."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Takes a collateral history with consent and recognises the months of negative symptoms preceding the delusions; <b>asks directly about command hallucinations and risk</b>; screens for organic cause, arranges targeted bloods and considers urine toxicology with consent, leaving antipsychotic choice and any ECG to the specialist team; <b>refers urgently to EIP without waiting for diagnostic certainty</b>; knows cannabis is the key modifiable factor but does not attribute everything to it; and — the step candidates miss — engages the mother as a carer and flags the family intervention, and agrees how physical-health monitoring will be shared with the mental health team."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>NICE CG178 — Psychosis and schizophrenia in adults: prevention and management (2014)<br><a href="https://www.nice.org.uk/guidance/cg178" rel="noopener">nice.org.uk/guidance/cg178</a><span class="rd"> — the EIP referral requirement, shared antipsychotic choice with no single preferred drug, the baseline and ECG criteria, the physical health monitoring schedule and secondary-care responsibility for at least the first 12 months, no antipsychotic initiation in primary care without a consultant psychiatrist, clozapine after 2 antipsychotics, and CBTp (\u226516 sessions) and family intervention (\u226510 sessions) as first-line alongside medication</span></li>'+
         '<li>NICE CG155 — Psychosis and schizophrenia in children and young people (2013, updated 2016)<br><a href="https://www.nice.org.uk/guidance/cg155" rel="noopener">nice.org.uk/guidance/cg155</a><span class="rd"> — the under-18 pathway and CAMHS referral</span></li>'+
         '<li><b>NICE CG185 — Bipolar disorder (2014, updated 2023)</b><br><a href="https://www.nice.org.uk/guidance/cg185" rel="noopener">nice.org.uk/guidance/cg185</a><span class="rd"> — mania with psychosis, and why mood stabilisers rather than antipsychotics alone are needed</span></li>'+
         '<li>NHS England — Access and Waiting Time Standard for Early Intervention in Psychosis<span class="rd"> — a service-performance standard for a package of EIP care within two weeks for a defined proportion of people aged 14–65; check the current national definitions and local pathway</span></li>'+
         '<li><b>Mental Health Act and Code of Practice</b><span class="rd"> — follow the current Act, Code of Practice and local crisis/AMHP pathway; the legal position and operational arrangements may change, so do not rely on this guide for statutory interpretation</span></li>'+
         '<li><b>RCEM — A brief guide to section 136 for emergency departments (December 2025)</b><span class="rd"> — section 136 from public places only, not private dwellings</span></li>'+
         '<li><b>NICE TA136 — Structural neuroimaging in first-episode psychosis</b><br><a href="https://www.nice.org.uk/guidance/ta136" rel="noopener">nice.org.uk/guidance/ta136</a><span class="rd"> — organic cause in approximately 5–10% of presentations; selective rather than routine imaging</span></li>'+
         '<li><b>NICE CG120 — Coexisting severe mental illness (psychosis) and substance misuse</b><br><a href="https://www.nice.org.uk/guidance/cg120" rel="noopener">nice.org.uk/guidance/cg120</a><span class="rd"> — assessment and management where psychosis and substance misuse coexist</span></li>'+
         '<li><b>GMMMG — Shared care guideline for oral second-generation antipsychotics in adults (local; review date December 2025 — confirm the current version)</b><span class="rd"> — transfer requires specialist initiation and stabilisation, GP agreement and clear local arrangements</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — used only for the CNS criterion: urgent direct-access MRI (or CT if MRI is contraindicated) for adults with progressive, subacute loss of central neurological function</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — antipsychotic and clozapine cautions and monitoring; check current individual SPCs for ECG requirements, contraindications and adverse effects</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Psychosis and schizophrenia — NICE CG178 (adults), CG155 (children and young people), CG185 (bipolar disorder), the NHS England Access and Waiting Time Standard for Early Intervention in Psychosis, and the current Mental Health Act and Code of Practice. First-episode psychosis, regardless of age or duration of untreated psychosis, is an urgent EIP referral; antipsychotic initiation is specialist-led. The reasoning pathway for an acute psychotic presentation remains at the <a href=\"../algorithms/psychosis.html\">psychosis pathway</a>. Verify all doses against the current BNF before prescribing, and follow local EIP and CMHT pathways."
});
