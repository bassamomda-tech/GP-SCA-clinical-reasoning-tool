<script>
MG.render({
  icon:"🩺",
  title:"Superior vena cava obstruction — the complete guide",
  eyebrow:"Protocol · NICE NG12 immediate referral · GMEC Palliative · sit up, grade, admit",
  stemTitle:"SVCO is one of the few presentations NICE NG12 singles out for IMMEDIATE referral rather than a suspected cancer pathway referral — because a 2-week pathway is far too slow for an airway and raised-venous-pressure emergency",
  stemSub:"One page for the emergency. Compression, invasion or thrombosis of the superior vena cava by mediastinal tumour, nodes or thrombus — <b>malignancy, especially lung cancer and lymphoma, is an important cause, but catheter-related thrombosis and other benign or mediastinal causes must also be considered</b>, and it can be the first presentation of an undiagnosed thoracic malignancy. The primary-care moves are <b>sit them up, oxygen if hypoxic, admit immediately and hand over</b>; dexamethasone is urgent with airway or cerebral compromise and otherwise discussed with the receiving team. Two refinements decide how the hospital manages them: <b>grade the severity at the bedside</b>, because stridor or cerebral signs make it a blue-light transfer; and <b>where the patient is stable, a tissue diagnosis before steroid matters</b>, since steroids can obscure lymphoma histology.",
  guideline:"NICE NG12 · NICE NG122 · GMEC Palliative 6th ed · PANG 2016",
  reviewed:"13 September 2026",
  nextReview:"13 March 2027",
  meta:[
    {t:"NICE NG12 — SVCO and stridor: refer IMMEDIATELY"},
    {t:"GMEC Palliative Care guidelines, 6th ed (April 2025)"},
    {t:"Sit up, oxygen if hypoxic, admit today", tone:"tw"},
    {t:"Malignancy common — consider catheter thrombosis"},
    {t:"v1.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#safety"><b>Recognise</b><small>Swelling · veins · JVP</small></a><a href="#grade"><b>Grade</b><small>Airway · brain</small></a><a href="#act"><b>Act</b><small>Sit up · grade · admit</small></a><a href="#cause"><b>Cause</b><small>Tumour · thrombus</small></a><a href="#after"><b>After</b><small>Stent · ACP · recurrence</small></a></div>',
  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"purple", h:"🟣 NICE NG12 — SVCO is an IMMEDIATE referral, not a suspected cancer pathway referral", html:"NG12 states that people with symptoms of superior vena caval obstruction — facial or neck swelling with fixed elevation of the JVP — or with stridor should be referred IMMEDIATELY for emergency admission. <b>This overrides any suspected cancer pathway referral.</b> An urgent chest X-ray (within 2 weeks) is the right test for suspected lung cancer in a stable outpatient; it is the wrong response to suspected SVCO, which needs emergency admission, with contrast CT arranged by the hospital. Do not delay admission for a chest X-ray or outpatient CT."},
    {tone:"red", h:"⚠ Life-threatening features — 999", html:"Call 999 for stridor, severe respiratory distress, hypoxia or cyanosis, reduced consciousness, seizures, syncope, haemodynamic compromise or rapid deterioration. Sit up, oxygen, dexamethasone urgently per the local acute-oncology/emergency protocol without delaying transfer, and blue-light transfer. <b>Severe or rapidly progressive SVCO can become life-threatening, particularly with airway compromise, cerebral dysfunction or haemodynamic instability.</b> For suspected but currently stable SVCO, arrange immediate same-day hospital assessment and admission via the local emergency/acute oncology pathway."},
    {tone:"blue", h:"Recognise it clinically — the constellation, not a single sign", html:"Look for facial/neck/upper-limb swelling with fixed elevation of the JVP and venous collaterals · facial plethora · dilated chest-wall veins · dyspnoea, cough or orthopnoea · headache, dizziness, visual symptoms or confusion · symptoms worse when bending or lying flat. Do not rely on a single sign or wait for a classic Pemberton's sign — it may support the diagnosis but is not a necessary confirmation, and should not be provoked in a patient with severe airway symptoms. Angioedema, nephrotic syndrome, heart failure and cellulitis all cause facial swelling, but none gives a fixed elevated JVP with chest-wall collateral veins."},
    {tone:"amber", h:"Sit up, grade, admit", html:"Sit the patient up and avoid lying flat if this worsens symptoms. ABCDE assessment; oxygen if hypoxic. If there is airway compromise, cerebral involvement, severe respiratory distress or rapid deterioration, give dexamethasone urgently according to the local acute-oncology/emergency protocol (the GMEC local dose is 16 mg orally or 13.2 mg SC) and do not delay transfer. In a clinically stable patient, discuss corticosteroid with the receiving acute oncology/medical team where possible, because steroids may reduce diagnostic yield in lymphoma. Do not routinely give furosemide in primary care. Then admit — unless the patient is in the last days of life, in which case contact specialist palliative care urgently."},
    {tone:"blue", h:"Stenting — urgent specialist consideration, not automatic", html:"Endovascular stenting is often the fastest method of relieving severe symptomatic obstruction and should be considered urgently by interventional radiology. It is not automatically appropriate for every patient: the plan depends on CT findings, cause, severity, histology, thrombosis and overall goals of care (NICE NG122: consider a stent for immediate relief of severe symptoms or after failure of earlier treatment). Chemotherapy may be definitive in a chemo-sensitive tumour (small-cell lung cancer, lymphoma, germ-cell); radiotherapy gives relief over days to weeks; and in catheter-associated thrombosis, anticoagulation and management/removal of the line may be more appropriate; thrombolysis or stenting should be specialist-led."},
    {tone:"green", h:"Rate of onset changes the risk — and the plan", html:"A slowly developing obstruction allows venous collaterals to form and partially decompress the system; a rapid occlusion does not. So a fast onset is more dangerous, and a gradual one can often be worked up — including a tissue biopsy — before definitive treatment. That is the reasoning behind biopsy-first in the stable patient and treat-first in the crashing one."}
  ],
  pathwaySub:"Five steps; the first three happen before the patient leaves.",
  pathway:[
    {title:"Recognise it clinically", html:"Facial, neck or arm swelling with dyspnoea in a patient with — or at risk of — thoracic cancer. Look for fixed elevation of the JVP with facial/neck swelling and chest-wall collateral veins — the constellation, not a single sign. <b>SVCO is a clinical diagnosis that must trigger action before imaging.</b>"},
    {title:"Grade the severity at the bedside", html:"Stridor, severe respiratory distress, hypoxia or cyanosis, reduced consciousness, seizures, syncope, haemodynamic compromise or rapid deterioration → 999. Otherwise immediate same-day admission via the local emergency/acute oncology pathway. Ask how fast it came on, and whether they can lie flat for a scan.", alert:true},
    {title:"Act immediately", html:"Sit up · ABCDE and observations · oxygen if hypoxic · dexamethasone only per the local emergency/acute-oncology pathway, particularly with airway or cerebral compromise (record dose and time) · do not routinely give furosemide · do not delay transfer for chest X-ray, outpatient imaging or biopsy."},
    {title:"Refer — acute oncology or the on-call medical team", html:"Known cancer → acute oncology service. New presentation → on-call medical or respiratory team, for urgent contrast CT and interventional radiology. Pre-alert the receiving team with a telephone handover. <b>Admission lets diagnosis and treatment run in parallel.</b>"},
    {title:"Then: definitive treatment, prognosis, and the recurrence safety-net", html:"Stent, chemotherapy, radiotherapy or anticoagulation according to cause. Wean the steroid once obstruction is relieved. Prognosis depends on the underlying cause, tumour type, stage, treatment response and overall health; prognostic discussion is led by the treating oncology team, with palliative-care involvement where appropriate."}
  ],
  sections:[

    {id:"safety", nav:"Recognise", title:"Recognising SVCO",
     sub:"A clinical diagnosis. The constellation, not the scan, is what triggers action.",
     blocks:[
       {b:"table", head:["Feature","Detail","Note"], rows:[
         ["<b>Swelling</b>","<b>Face, neck and arms</b>","Often noticed first by the patient or family on waking"],
         ["<b>Dilated veins</b>","Distended veins of the neck, trunk and arms; dilated chest-wall collateral veins; facial plethora","<b>Collateral chest-wall veins indicate a more chronic obstruction</b> and help separate SVCO from other causes of facial swelling"],
         ["<b>Fixed elevation of the JVP</b>","<b>With facial or neck swelling</b>","NG12 names this alongside facial and neck swelling as the trigger for immediate referral. Do not rely on a single sign — use the overall constellation"],
         ["<b>Respiratory</b>","<b>Dyspnoea, cough or orthopnoea; STRIDOR, voice change and dysphagia are red-flag airway signs</b>","Stridor converts this from urgent to a 999 airway emergency"],
         ["<b>Neurological</b>","Headache, dizziness, visual symptoms, confusion, CNS depression, seizures — from raised intracranial venous pressure","Cerebral signs are the other 999 trigger"],
         ["<b>Postural aggravation</b>","<b>Classically worse on stooping or lying flat</b>","Also ask whether they can lie down for a scan — it affects how imaging is arranged"],
         ["<b>Pemberton's sign</b>","<b>Facial congestion and plethora on raising both arms above the head</b>","May support the diagnosis but is not a necessary confirmation; do not provoke it in a patient with severe airway symptoms"],
         ["<b>It may be the first presentation</b>","<b>Of an undiagnosed thoracic malignancy</b>","No cancer history does not lower the suspicion"]
       ]},
       {b:"why", html:"Recognising the combination of facial, neck or upper-limb swelling, fixed elevation of the JVP, venous collaterals and dyspnoea in someone with or at risk of thoracic cancer is the whole of the primary-care task. SVCO is a clinical diagnosis that must trigger urgent action before imaging, because the imaging that confirms it — contrast CT — is a hospital investigation, and arranging it from primary care is slower than admitting the patient who needs it."}
     ]},

    {id:"grade", nav:"Grade", title:"Severity grading — the pivot of the pathway",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Life-threatening — 999, blue-light", html:"Stridor · severe respiratory distress or laryngeal and airway oedema · hypoxia or cyanosis · reduced consciousness · seizures · syncope · haemodynamic compromise · rapid deterioration. <b>The airway and brain are at risk NOW.</b> Sit up, oxygen, dexamethasone urgently per the local acute-oncology/emergency protocol, immediate transfer."},
         {tone:"amber", h:"🟠 Stable — urgent admission", html:"<b>Gradual onset, no airway or cerebral compromise, collaterals formed.</b> <b>Still arrange immediate same-day hospital assessment and admission</b> via the local emergency/acute oncology pathway — do not manage in the community while awaiting investigations. In hospital there is usually time for contrast CT and a tissue diagnosis before definitive treatment."},
         {tone:"blue", h:"⏱️ Ask how fast it came on", html:"A rapid onset gives less time for collateral veins to form and is more dangerous; a slow onset means the system is partly decompressed. Rate of onset is the single most useful historical variable and it belongs in the referral."},
         {tone:"blue", h:"📋 Also ask and examine for", html:"Known or suspected thoracic malignancy · a previous central line, PICC or pacemaker (suggesting thrombotic SVCO) · orthopnoea · whether they can lie flat."},
         {tone:"amber", h:"📋 Pre-hospital checklist and handover", html:"ABCDE assessment · pulse, BP, respiratory rate, oxygen saturation and conscious level · whether the patient can lie flat · stridor, voice change or dysphagia · neurological symptoms · rate of symptom progression · known cancer and current treatment · central venous catheter, PICC or pacemaker · anticoagulants and bleeding risk · DNACPR/advance care planning information where relevant · exact time and dose of dexamethasone if given · telephone handover to the receiving team. Avoid inserting peripheral IV access in the arms if upper venous return is severely compromised unless clinically necessary; follow local emergency practice."}
       ]},
       {b:"why", html:"Severity grading decides emergency versus urgent, and whether the airway is the immediate threat. Stridor or cerebral signs make SVCO a true airway and neurological emergency requiring blue-light transfer and urgent steroid per the local protocol. A gradual onset with established collaterals can usually be worked up — including obtaining histology — before definitive treatment, which materially improves the oncological decisions that follow."}
     ]},

    {id:"act", nav:"Act", title:"Immediate management",
     blocks:[
       {b:"table", head:["Action","Detail"], rows:[
         ["<b>Position</b>","<b>Sit the patient up.</b> It lowers venous pressure immediately and costs nothing"],
         ["<b>Oxygen</b>","<b>Give oxygen if hypoxic</b>"],
         ["<b>Steroid</b>","<b>Airway compromise, cerebral involvement, severe respiratory distress or rapid deterioration:</b> give dexamethasone urgently according to the local acute-oncology/emergency protocol and do not delay transfer (GMEC local palliative dose: 16 mg orally or 13.2 mg SC stat, then 8 mg twice daily orally or 6.6 mg SC twice daily, morning and lunchtime). <b>Clinically stable, no airway or neurological compromise:</b> discuss corticosteroid with the receiving acute oncology/medical team where possible, because steroids may reduce diagnostic yield in lymphoma. Do not delay hospital transfer while seeking advice. Record the dose and time"],
         ["<b>Diuretic</b>","<b>Do not routinely give furosemide in primary care.</b> Consider it only after specialist advice where there is a clear associated fluid-overload or cardiac indication"],
         ["<b>Gastroprotection and monitoring</b>","<b>If high-dose steroid is given, co-prescribe a PPI and monitor blood glucose.</b> Take a baseline glucose before starting where you can"],
         ["<b>Admit</b>","Urgent ambulance/acute hospital transfer; pre-alert the receiving team and contact acute oncology or the on-call medical/respiratory team. Do not delay transfer for chest X-ray, outpatient imaging or biopsy — UNLESS the patient is in the last days of life and admission is not consistent with their goals, in which case contact specialist palliative care urgently for symptom-control advice"],
         ["<b>Breathlessness in the meantime</b>","Head-up positioning and oxygen if hypoxic. Do not use palliative breathlessness medication as the routine management of potentially reversible SVCO; benzodiazepines can worsen sedation and respiratory compromise and should not be introduced without a palliative-care plan — see <a href='palliative-breathlessness.html'>palliative breathlessness</a>"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"⚠ Tissue diagnosis versus steroid — the real tension", html:"<b>Steroids and radiotherapy can obscure lymphoma histology.</b> In a stable patient, obtain tissue diagnosis before steroids or definitive cancer treatment where this can be achieved without compromising safety, particularly when lymphoma is suspected. With airway, cerebral or haemodynamic compromise, emergency treatment takes priority; document the steroid dose and time because it may affect subsequent biopsy interpretation. Whether to delay steroids is a specialist hospital decision, not one for the GP alone."},
         {tone:"blue", h:"💊 Steroid stewardship if started", html:"<b>Morning and lunchtime dosing only — never evening.</b> PPI cover, glucose monitoring, and a plan to wean once the obstruction is relieved. Watch for agitation, hyperglycaemia, GI bleeding and infection."},
         {tone:"green", h:"✓ What to say", html:"\"Sitting upright will help straightaway. You need to go into hospital now for a scan to find out what is pressing on the vein. The hospital team will decide the best treatment — that may include a steroid or a procedure to open the vein up, which can relieve the symptoms quickly.\""},
         {tone:"red", h:"⛔ Do not send a suspected cancer pathway referral", html:"<b>Overt SVCO needs emergency admission.</b> The two-week chest X-ray route is for a stable outpatient with suspected lung cancer, and using it here is the commonest serious error in this presentation."}
       ]}
     ]},

    {id:"cause", nav:"Cause", title:"Causes, differential and investigations",
     blocks:[
       {b:"table", head:["Category","Detail","Treatment implication"], rows:[
         ["<b>Malignant — an important cause</b>","Especially lung cancer (small-cell and squamous) and lymphoma; also thymoma, germ-cell tumours and mediastinal metastases such as breast","A chemo-sensitive tumour — small-cell, lymphoma, germ-cell — may respond rapidly to chemotherapy and be controlled definitively"],
         ["<b>Thrombotic — increasingly common</b>","Thrombosis around central venous catheters, PICC lines and pacemaker leads","Anticoagulation and management/removal of the line may be more appropriate; thrombolysis or stenting should be specialist-led"],
         ["<b>Benign</b>","Fibrosing mediastinitis, retrosternal goitre, aortic aneurysm, post-radiotherapy fibrosis, tuberculosis","Changes the prognosis entirely"],
         ["<b>Differential of facial swelling</b>","<b>Angioedema, nephrotic syndrome, cardiac failure, cellulitis</b>","None of these gives a fixed elevated JVP with chest-wall collateral veins"],
         ["<b>Chest X-ray</b>","<b>Often shows a mediastinal mass or widening</b>","May be useful but should not delay admission or be used to exclude SVCO"],
         ["<b>CT with IV contrast (hospital-led)</b>","Hospital assessment should include urgent contrast-enhanced CT of the chest/mediastinum, usually with venous-phase imaging as appropriate, to define the level and cause of obstruction and plan intervention. Not for the GP to arrange before admission","Distinguishes extrinsic compression from intraluminal tumour from thrombus, which is what determines stent versus anticoagulation versus systemic therapy"],
         ["<b>Tissue diagnosis</b>","Sputum cytology, bronchoscopy, or nodal/mass biopsy — in a stable patient, obtain histology before steroids or definitive treatment where this can be achieved safely, particularly when lymphoma is suspected","It directs chemotherapy and radiotherapy. With airway, cerebral or haemodynamic compromise, emergency treatment takes priority; a specialist hospital decision"],
         ["<b>Bloods</b>","FBC, U&amp;Es, LFTs, LDH (lymphoma), clotting; baseline glucose before high-dose steroid","LDH supports a lymphoma suspicion"]
       ]}
     ]},

    {id:"after", nav:"After", title:"Definitive treatment, prognosis and the recurrence safety-net",
     blocks:[
       {b:"table", head:["Treatment","Detail","Speed"], rows:[
         ["<b>Endovenous stent</b>","Interventional radiology; often the fastest method of relieving severe symptomatic obstruction and considered urgently, but not automatically appropriate for every patient — depends on CT findings, cause, severity, histology, thrombosis and goals of care (NICE NG122)","<b>Often rapid relief</b>"],
         ["<b>Chemotherapy</b>","<b>Small-cell lung cancer, lymphoma, germ-cell tumours</b>","<b>Rapid response; may be definitive</b>"],
         ["<b>Radiotherapy</b>","<b>Radiosensitive tumours not suited to chemotherapy</b>","Relief over days to weeks"],
         ["<b>Anticoagulation ± thrombolysis</b>","Catheter-related thrombus; consider thrombolysis if a stent is blocked, and line removal","Per local protocol"],
         ["<b>Steroid weaning</b>","Wean dexamethasone once the obstruction is relieved; keep PPI cover and monitor glucose while the dose is high","Over days, guided by symptoms"],
         ["<b>Advance care planning</b>","Prognosis depends on the underlying cause, tumour type, stage, treatment response and overall health; prognostic discussion is led by the treating oncology team, with palliative care where appropriate. Discuss ceilings of treatment and preferred place of care sensitively","<b>Alongside treatment, not after it</b>"],
         ["<b>Recurrence</b>","Returning facial swelling, dyspnoea or collateral veins after stenting suggests stent occlusion or re-thrombosis → re-image urgently","<b>Reproduces the original emergency</b>"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 999 / return immediately", html:"\"If the breathlessness gets worse, you develop noisy or difficult breathing, the facial swelling comes back, or you become confused or have a fit — call 999. A stent can block, and that brings the problem straight back.\""},
         {tone:"amber", h:"🟠 On the steroid", html:"<b>Hyperglycaemia, GI bleeding, agitation and infection risk.</b> Monitor glucose actively in a patient with diabetes, keep the PPI, and wean as soon as the obstruction is relieved."},
         {tone:"green", h:"✓ Holistic support", html:"Specialist palliative care, clinical nurse specialist and carer support. This is a frightening and highly visible presentation — the face and neck swell, the voice changes — and the psychological impact on patient and family deserves explicit attention."},
         {tone:"blue", h:"📋 Where the patient is dying", html:"<b>Admission may be inappropriate in the last days of life.</b> Where admission is not consistent with their goals, contact the specialist palliative-care service urgently for symptom-control advice, alongside positioning and oxygen. This is separate from the emergency pathway for potentially reversible SVCO. See <a href='care-of-the-dying.html'>care of the dying</a>."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999 — life-threatening", html:"Stridor, severe respiratory distress, hypoxia, reduced consciousness, seizures, syncope or haemodynamic compromise. Sit up, oxygen, dexamethasone per the local emergency/acute-oncology protocol, blue-light transfer with a telephone handover."},
         {tone:"purple", h:"NICE NG12 — immediate emergency referral", html:"NG12: refer people with symptoms of superior vena caval obstruction (facial or neck swelling with fixed elevation of the JVP) or with stridor IMMEDIATELY for emergency admission. <b>This overrides any suspected cancer pathway referral</b>, and it is the one place in NG12 where \"immediately\" rather than \"within 2 weeks\" is specified for a thoracic presentation."},
         {tone:"amber", h:"Acute oncology service", html:"<b>Where the cancer is known</b> — route to urgent contrast CT and interventional radiology review. Use the current local Greater Manchester acute oncology referral route (and The Christie contact pathway for patients under The Christie)."},
         {tone:"amber", h:"On-call medical or respiratory team", html:"<b>Where this is a new presentation.</b> Admission allows diagnosis (biopsy) and treatment to proceed in parallel rather than sequentially."},
         {tone:"green", h:"Specialist palliative care", html:"Where the patient is in the last days of life and admission is not appropriate, or for symptom control alongside active treatment."},
         {tone:"cream", h:"What primary care owns", html:"Recognising it clinically, grading the severity, sitting the patient up, oxygen if hypoxic, steroid only per the local pathway by severity, immediate transfer with a telephone handover, and documenting observations and any treatment given — plus the recurrence safety-net afterwards. Related pages: <a href='mscc.html'>MSCC</a> · <a href='malignant-hypercalcaemia.html'>malignant hypercalcaemia</a> · <a href='palliative-breathlessness.html'>palliative breathlessness</a> · <a href='palliative-corticosteroids.html'>palliative corticosteroids</a> · <a href='care-of-the-dying.html'>care of the dying</a>."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 63-year-old smoker with a <b>3-week history of cough and 6 kg weight loss</b>, not yet investigated, is brought in by his wife because his <b>face and neck look swollen</b> and he is breathless. He has no known cancer. He is talking in full sentences, <b>no stridor</b>, saturations 94%. You note facial plethora, a fixed raised JVP, and dilated veins across the upper chest; the swelling is worse when he bends to tie his shoes. His wife asks whether he can \"have the chest X-ray we were told about\" and be seen next week."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Recognises SVCO clinically from fixed elevation of the JVP with facial/neck swelling and collateral veins, and does not attribute the swelling to another cause; grades severity — no stridor or cerebral signs, so not 999, but still immediate same-day admission; explicitly declines the suspected cancer pathway route and can quote why: NG12 names SVCO and stridor for IMMEDIATE referral; <b>sits the patient up, records ABCDE observations and gives oxygen if hypoxic</b>; <b>discusses any steroid with the receiving team rather than giving it routinely</b>, because he is stable and lymphoma is possible; does not give furosemide routinely; refers to the on-call medical or respiratory team because there is no known cancer, with a telephone handover, recognising that admission lets biopsy and treatment run in parallel; <b>asks about rate of onset and whether he can lie flat</b>, and puts both in the referral; explains that hospital treatment can relieve symptoms quickly to make the urgency concrete for the family; and handles the wife's expectation of next week without being dismissive of the advice she was given."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (May 2025)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — the recommendation to refer people with symptoms of superior vena caval obstruction (facial or neck swelling with fixed elevation of the JVP) or with stridor IMMEDIATELY for emergency admission, overriding the suspected cancer pathway route; and the urgent chest X-ray (within 2 weeks) that applies to stable suspected lung cancer instead</span></li>'+
         '<li>GMEC Palliative Care Pain &amp; Symptom Control Guidelines, 6th edition (April 2025)<span class="rd"> — local palliative/acute-oncology protocol (not a universal NICE primary-care requirement): sit up, oxygen if hypoxic, dexamethasone 16 mg oral or 13.2 mg SC then 8 mg BD (6.6 mg SC BD), PPI cover and glucose monitoring, and the instruction to admit unless the patient is in the last days of life</span></li>'+
         '<li><b>Palliative Adult Network Guidelines (2016)</b><span class="rd"> — the SVCO management framework and the supportive-care recommendations</span></li>'+
         '<li><b>NICE NG122 — Lung cancer: diagnosis and management</b><br><a href="https://www.nice.org.uk/guidance/ng122" rel="noopener">nice.org.uk/guidance/ng122</a><span class="rd"> — consider stent insertion for immediate relief of severe symptoms of SVCO or after failure of earlier treatment</span></li>'+
         '<li><b>NICE NG234 — Spinal metastases and metastatic spinal cord compression</b><br><a href="https://www.nice.org.uk/guidance/ng234" rel="noopener">nice.org.uk/guidance/ng234</a><span class="rd"> — analogous principle: corticosteroids urgent with neurological compromise, more selective without</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — dexamethasone and furosemide dosing, the 3.3 mg/mL injection strength used for subcutaneous administration, and high-dose corticosteroid cautions</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Superior vena cava obstruction — NICE NG12, GMEC Palliative Care Guidelines 6th edition and the Palliative Adult Network Guidelines. Recognise it clinically: facial, neck or upper-limb swelling with fixed elevation of the JVP and chest-wall collateral veins. NG12 requires IMMEDIATE emergency referral for SVCO or stridor — this overrides any suspected cancer pathway referral. Sit the patient up, give oxygen if hypoxic, give dexamethasone per the local emergency/acute-oncology protocol when there is airway or cerebral compromise (otherwise discuss with the receiving team), do not routinely give furosemide, and admit unless they are in the last days of life. Stenting is considered urgently by interventional radiology but is not automatic. Verify all doses against the BNF before prescribing."
});
</script>
