<script>
MG.render({
  icon:"🧬",
  title:"Metastatic spinal cord compression — the complete guide",
  eyebrow:"Protocol · NICE NG234 · neurology: steroid and scan within 24 hours · pain alone: MRI within 1 week",
  stemTitle:"New neurological symptoms or signs in a patient with cancer: suspect MSCC, give dexamethasone 16 mg promptly, contact the MSCC coordinator and arrange whole-spine MRI within 24 hours. Pain alone: suspect spinal metastases, seek MSCC-team advice within 24 hours and arrange whole-spine MRI within 1 week",
  stemSub:"One page for the emergency. The three moves are <b>suspect, steroid, scan</b>, and the only one that can be done in the consulting room is the first two. <b>A normal neurological examination does NOT exclude spinal metastases</b> — disease can be at a level distant from the pain and at more than one level, which is why the imaging is whole-spine and why the examination lowers your threshold to act rather than ever reassuring you. Thoracic back pain in a patient with cancer should be treated as suspected spinal metastases until assessed; ask specifically about gait, weakness, sensory change, radicular/band-like pain and bladder/bowel function. Corticosteroids are not routine for pain alone unless there is severe pain or a haematological malignancy. Ambulatory status at treatment is one of the strongest predictors of maintaining or regaining mobility.",
  guideline:"NICE NG234 · GMEC Palliative 6th ed · PCF8 · NICE NG12 (updated April 2026)",
  reviewed:"13 September 2026",
  nextReview:"13 March 2027",
  meta:[
    {t:"NICE NG234 — spinal metastases and MSCC (2023)"},
    {t:"GMEC Palliative Care guidelines, 6th ed (April 2025)"},
    {t:"Neurology: dexamethasone 16 mg + PPI promptly", tone:"tw"},
    {t:"Whole-spine MRI: 24 hours with neurology · 1 week for pain alone", tone:"tw"},
    {t:"v1.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#safety"><b>Suspect</b><small>The features · normal exam</small></a><a href="#steroid"><b>Steroid</b><small>16 mg if neurology</small></a><a href="#image"><b>Scan</b><small>Whole spine · 24h or 1 week</small></a><a href="#refer"><b>Refer</b><small>MSCC coordinator</small></a><a href="#after"><b>After</b><small>Taper · rehab · ACP</small></a></div>',
  quickSub:"The six that decide whether this patient walks again. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Neurological symptoms or signs: give dexamethasone promptly — do not wait for the scan", html:"NICE NG234: dexamethasone 16 mg orally (or equivalent parenterally) as soon as possible, then 16 mg daily while awaiting surgery or radiotherapy. Local GMEC/PCF8 regimen: 16 mg orally (or 13.2 mg subcutaneously) stat, then 8 mg twice daily (or 6.6 mg SC twice daily), with gastroprotection. <b>Start it on clinical suspicion of MSCC, before MRI confirms anything</b> — it reduces vasogenic oedema around the cord and buys time. If MRI excludes spinal metastases/MSCC, discontinue dexamethasone; if the patient proceeds to surgery or radiotherapy, taper under the treating oncology/spinal team’s plan. <b>NICE NG234 ties the steroid to neurological symptoms or signs:</b> with spinal pain alone (suspected spinal metastases, no neurology), corticosteroids are not routinely given unless there is severe pain or a haematological malignancy — seek advice through the MSCC coordinator within 24 hours instead, with MRI within 1 week."},
    {tone:"red", h:"⚠ A normal neurological examination does NOT exclude spinal metastases", html:"Disease can exist with a near-normal examination, and at a level distant from the pain. So the examination establishes a baseline and lowers your threshold to image — it never provides false reassurance. Thoracic back pain in a patient with cancer should be treated as suspected spinal metastases until assessed: ask specifically about gait, weakness, sensory change, radicular/band-like pain and bladder/bowel function. With no neurological symptoms or signs, the NICE pathway is generally MRI within 1 week, not automatically within 24 hours."},
    {tone:"amber", h:"Whole-spine MRI — not a targeted film", html:"MRI should cover the whole spine. <b>Use the 24-hour pathway (as soon as possible and within 24 hours) for suspected MSCC with neurological symptoms or signs.</b> Use the 1-week pathway for suspected spinal metastases presenting with concerning spinal pain but no neurological symptoms/signs. CT whole spine with thin slices and sagittal reconstruction if MRI is contraindicated. Whole-spine because compression can be at multiple levels and the clinical level is unreliable; the thoracic spine is the commonest site."},
    {tone:"blue", h:"Immediate MSCC coordinator contact, not a routine referral", html:"With neurological symptoms or signs: contact the network MSCC coordinator immediately (or oncology out-of-hours); emergency ambulance/admission if unstable, rapidly deteriorating or unsafe to transfer. Pain alone: MSCC-team advice within 24 hours. The MSCC coordinator arranges urgent treatment planning: radiotherapy is appropriate for many patients, while selected patients require surgical decompression and/or stabilisation — timing follows the local MSCC pathway and specialist decision."},
    {tone:"green", h:"The safety-net is the highest-yield long-term intervention", html:"Every patient with cancer — particularly prostate, breast, lung or myeloma — should be told to report new or worsening back pain, leg weakness or numbness, or any bladder or bowel change IMMEDIATELY and not wait for an appointment. Ambulatory status at treatment is one of the strongest predictors of maintaining or regaining mobility, which is why treatment must not wait for late bladder or bowel symptoms — teaching the early symptoms is high-yield."},
    {tone:"purple", h:"🟣 NICE NG12 — when MSCC is the FIRST presentation", html:"MSCC can be the index presentation of an unknown primary, and then NG12 applies in its own right. Aged 60 and over with persistent bone pain, particularly back pain, or an unexplained fracture → FBC, calcium, ESR or plasma viscosity, serum protein electrophoresis and serum free light chains, all together for myeloma (urine Bence-Jones if free light chain testing is not available); suspected cancer pathway referral if the results suggest myeloma. Do not arrange a routine direct-access X-ray route for bone sarcoma in an acute MSCC presentation — the immediate MSCC pathway takes precedence, and the primary tumour work-up is coordinated by oncology/haematology in parallel."}
  ],
  pathwaySub:"Five steps, and the first three should all happen in the same consultation.",
  pathway:[
    {title:"Suspect it — and separate the two pathways", html:"<b>Suspected MSCC:</b> known or suspected cancer plus gait disturbance or difficulty walking, limb weakness, sensory loss, paraesthesia or a sensory level, radicular pain, or bladder/bowel dysfunction → oncological emergency. <b>Suspected spinal metastases:</b> cancer plus severe, progressive or unremitting spinal pain, night pain, localised tenderness, radicular or band-like pain, or pain aggravated by coughing, sneezing or straining, but no neurological symptoms/signs. Commonest primaries are prostate, lung, breast and myeloma. Symptoms are often vague — the index of suspicion has to be low."},
    {title:"Give the steroid", html:"If there are neurological symptoms or signs (NICE NG234): dexamethasone 16 mg orally (or equivalent parenterally) as soon as possible with gastroprotection, then 16 mg daily (NICE) or 8 mg twice daily (local GMEC/PCF8). On suspicion, before imaging. Pain alone: not routine unless severe pain or haematological malignancy. Check blood glucose and individually assess VTE risk.", alert:true},
    {title:"Immobilise if unstable, then image", html:"Immobilise without delay — including during transfer — if MSCC is suspected with neurological symptoms/signs suggesting spinal instability; consider it with moderate-to-severe movement-related pain; obtain early expert advice to minimise unnecessary immobilisation. Whole-spine MRI within 24 hours with neurology; within 1 week for pain alone."},
    {title:"Contact the MSCC coordinator", html:"Immediately with neurological symptoms or signs; within 24 hours for pain alone. The coordinator arranges urgent treatment planning — radiotherapy for many, surgical decompression and/or stabilisation for selected patients, timed per the local MSCC pathway. If the patient is dying, admission and radiotherapy may be inappropriate — seek specialist palliative advice instead."},
    {title:"Afterwards: taper, rehabilitate, plan", html:"If MSCC is excluded, stop dexamethasone; after surgery or at the start of radiotherapy, reduce gradually until stopped per the treating team’s plan (a 1–2-week taper may suit longer courses or local specialist guidance). Pressure care, continence, bowel regimen, physiotherapy and OT. Discuss prognosis and advance care planning — MSCC signals advanced disease."}
  ],
  sections:[

    {id:"safety", nav:"Suspect", title:"Recognising it — the features, and why the examination cannot reassure you",
     sub:"Separate suspected MSCC (neurological symptoms or signs) from suspected spinal metastases (pain alone) — the window to preserve function is short.",
     blocks:[
       {b:"table", head:["Feature","What to ask and look for","Why it matters"], rows:[
         ["<b>Spinal or back pain</b>","Severe, progressive or unremitting. Radicular and band-like. Nocturnal — waking or preventing sleep. Worse on straining, coughing or standing. <b>It may not be present at all</b>","Thoracic back pain in a patient with cancer should be treated as suspected spinal metastases until assessed — pain alone without neurology is the 1-week MRI pathway. Nocturnal and band-like pain are the two most specific historical features"],
         ["<b>Limb weakness</b>","Out of proportion to the general condition; difficulty walking; claudication-like leg pain","Often the symptom the patient volunteers last, having attributed it to being unwell generally"],
         ["<b>Sensory change</b>","Tingling, numbness, \"my legs don't feel like mine\" — look specifically for a SENSORY LEVEL","A sensory level is the single most useful positive physical finding"],
         ["<b>Bladder and bowel</b>","Difficulty passing urine (usually late), constipation or faecal incontinence, a distended bladder","<b>These are LATE features — waiting for them is waiting too long.</b> Palpate for retention rather than relying on the history"],
         ["<b>Signs</b>","Localised spinal tenderness, limb weakness, absent OR increased reflexes, extensor plantars, clonus, reduced anal tone (late)","Reflexes may be absent or brisk depending on the level — neither pattern excludes it"],
         ["<b>The examination itself</b>","<b>A normal neurological examination does NOT exclude spinal metastases</b>","The examination gives you a baseline against which to judge treatment response, and it lowers your threshold to image. It never gives you grounds to wait"]
       ]},
       {b:"warn", html:"The failure mode is attributing the pain to something benign in a patient who has every reason to have back pain. Patients with advanced cancer are often frail, deconditioned, on opioids and already in pain — so new back pain gets absorbed into the existing picture. The discipline is to treat new or changed back pain in a patient with cancer as a different question from their established pain, and to ask specifically about nocturnal pain, band-like pain, leg weakness and bladder function every time."},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"🔬 Which cancers, and where", html:"Prostate, breast, lung and myeloma account for most spinal metastases; renal and thyroid also metastasise to bone. Mechanism: a vertebral body metastasis collapsing posteriorly onto the cord, or direct epidural extension. The thoracic spine is the commonest site."},
         {tone:"amber", h:"⚠ It can be the first presentation", html:"<b>MSCC may be the index presentation of an unknown primary.</b> Run the acute pathway AND the hunt for the primary — see the NG12 card. <b>Do not delay the steroid while investigating the cancer.</b>"},
         {tone:"amber", h:"⚠ Suspected lymphoma — steroid and biopsy", html:"Corticosteroids can rapidly reduce lymphoma tissue and compromise biopsy yield. If there are no neurological symptoms/signs and lymphoma is suspected, discuss urgently with haematology/MSCC specialists before giving corticosteroids where this will not delay emergency care. <b>If neurological deterioration is present, give dexamethasone immediately and do not delay treatment for tissue diagnosis.</b>"},
         {tone:"red", h:"🚨 Neurological emergency without known cancer", html:"Consider cauda equina syndrome, epidural abscess, epidural haematoma, vertebral fracture or primary spinal tumour. Arrange emergency spinal assessment and imaging — do not force the patient into the oncology pathway before assessing other emergencies. Suspected cauda equina syndrome requires immediate emergency referral for urgent MRI and spinal/neurosurgical assessment; do not delay transfer for outpatient imaging or routine review."},
         {tone:"blue", h:"🔍 Differential on MRI", html:"Benign causes (disc prolapse, epidural abscess, haematoma), degenerative stenosis, or non-compressive paraneoplastic or leptomeningeal disease. MRI distinguishes them — which is another reason the scan is urgent rather than optional."},
         {tone:"green", h:"✓ Document the baseline", html:"<b>Power, reflexes, plantars, sensory level and continence, written down.</b> It is what the receiving team compares against, and what tells anyone reviewing later whether the deficit is progressing."}
       ]}
     ]},

    {id:"steroid", nav:"Steroid", title:"Dexamethasone — the one treatment you start yourself",
     blocks:[
       {b:"table", head:["Step","Dose","Notes"], rows:[
         ["<b>Loading dose — on suspicion</b>","<b>Dexamethasone 16 mg orally as soon as possible, or equivalent parenterally (local GMEC/PCF8: 13.2 mg subcutaneously)</b>","<b>Before imaging confirms anything</b>, in a patient with neurological symptoms or signs (NICE NG234 does not routinely give corticosteroids without them). This is the single action in the whole pathway that a GP can take immediately and that changes the outcome"],
         ["<b>Maintenance</b>","NICE NG234: 16 mg daily while awaiting surgery or radiotherapy. Local GMEC/PCF8 regimen: 8 mg twice daily orally (or 6.6 mg subcutaneously twice daily — morning and lunchtime)","If MRI excludes spinal metastases/MSCC, discontinue dexamethasone — no prolonged taper is required after a brief course. After surgery or at the start of radiotherapy, reduce gradually until stopped under the treating oncology/spinal team’s plan. Avoid evening doses — insomnia and agitation"],
         ["<b>During radiotherapy</b>","<b>Per the treating oncology team’s plan (local practice may use 8 mg each morning)</b>","Then reduce gradually until stopped"],
         ["<b>Gastroprotection</b>","<b>Prescribe gastroprotection unless contraindicated and follow local formulary guidance</b>","Reasonable with high-dose dexamethasone"],
         ["<b>Monitoring</b>","Blood glucose — steroid-induced hyperglycaemia is common; in patients with diabetes, monitor more frequently and follow the local steroid-induced hyperglycaemia pathway","Also mood and sleep; steroid psychosis and agitation occur at these doses"],
         ["<b>VTE</b>","<b>Individual VTE risk assessment — do not anticoagulate automatically</b>","Account for bleeding risk, spinal/epidural disease, planned surgery, thrombocytopenia, mobility and current anticoagulant treatment"],
         ["<b>Stopping and taper</b>","<b>Stop if MSCC is excluded. After surgery or at the start of radiotherapy, reduce gradually until stopped — a 1–2-week taper may suit longer courses or local specialist guidance, not a universal requirement</b>","If the neurology deteriorates during reduction, return to the last effective dose for a further 2 weeks before retrying. Keep the PPI while the dose is high"]
       ]},
       {b:"why", html:"Dexamethasone works by reducing the vasogenic oedema around the compressed cord, which buys time and improves the outcome of whatever definitive treatment follows. In a patient with neurological symptoms or signs it is given on suspicion rather than on confirmation for a simple reason: the cost of giving a few doses of steroid to someone who turns out not to have MSCC is small and reversible, while the cost of waiting overnight for a scan in someone who does is permanent paralysis. That asymmetry is the whole argument, and it is worth saying out loud to a patient or relative who asks why treatment is starting before the diagnosis is certain."}
     ]},

    {id:"image", nav:"Scan", title:"Immobilisation and imaging",
     blocks:[
       {b:"dl", rows:[
         ["<b>Immobilise — when</b>","Immobilise without delay, including during transfer, if suspected MSCC is accompanied by signs of spinal instability. Consider immobilisation where there are suspected spinal metastases or MSCC with moderate-to-severe movement-related pain. Obtain early expert advice to minimise unnecessary immobilisation — prolonged immobilisation has harms, particularly in frail patients. Do not automatically immobilise every patient with cancer-related back pain. Keep the patient supported and avoid unnecessary movement; do not simply instruct the patient to lie flat unless directed by the transfer team"],
         ["<b>Imaging — what and when</b>","<b>MRI of the WHOLE spine as soon as possible and within 24 hours</b> for suspected MSCC (neurological symptoms or signs), with appropriate sagittal and axial sequences. If MRI is contraindicated: <b>CT of the whole spine with thin slices and sagittal reconstruction</b>. Pain suggestive of spinal metastases without neurology: MRI within 1 week, with advice through the MSCC coordinator (NICE NG234)"],
         ["<b>Why whole-spine</b>","Compression is frequently at more than one level, and the clinical level is unreliable — a targeted film at the level of the pain can miss the compression entirely"],
         ["<b>Bloods</b>","<b>As indicated by the underlying malignancy and fitness for treatment</b> — and, where MSCC is the first presentation, the NG12 myeloma screen"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"⛔ Do not arrange a routine outpatient scan for suspected MSCC", html:"For suspected MSCC with neurological symptoms or signs, urgent MRI means within 24 hours, via the acute pathway; pain alone follows the 1-week pathway through the MSCC coordinator. A routine or two-week outpatient request is not a treatment for an oncological emergency, and is the commonest way this pathway fails in practice."},
         {tone:"amber", h:"⚠ Moving the patient", html:"Keep the patient supported and avoid unnecessary movement. Use spinal immobilisation during transfer when instability is suspected or when movement causes moderate/severe pain, according to local ambulance/MSCC guidance — say so explicitly when you arrange the ambulance, not just in the referral letter."},
         {tone:"blue", h:"📋 What the referral needs", html:"Primary tumour and stage, the neurological findings with the baseline you recorded, time of symptom onset and rate of progression, current ambulant status, the steroid dose and time given, and performance status. Ambulant status and rate of progression are what the oncology team triage on."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral and definitive treatment",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Immediate — MSCC coordinator", html:"Known cancer plus neurological symptoms or signs: 1) contact the network MSCC coordinator immediately (or oncology out-of-hours); 2) emergency ambulance/admission if unstable, rapidly deteriorating or unsafe to transfer; 3) whole-spine MRI within 24 hours. Pain alone: MSCC-team advice within 24 hours and MRI within 1 week. Do not simply send every patient to A&amp;E without contacting the MSCC service. Record the local 24-hour Greater Manchester MSCC coordinator/Christie or network oncology contact number here."},
         {tone:"amber", h:"Radiotherapy — many patients", html:"<b>The MSCC coordinator arranges urgent treatment planning.</b> Radiotherapy is appropriate for many patients, under dexamethasone cover; timing follows the local MSCC pathway and specialist decision. Management depends on spinal stability, neurological status, number and level of lesions, tumour type and radiosensitivity, performance status, prognosis, previous radiotherapy, suitability for surgery and patient goals."},
         {tone:"amber", h:"Surgery — selected patients", html:"Surgical decompression with or without stabilisation where there is: no tissue diagnosis yet; a limited number of levels of compression; minor neurological impairment; progressive weakness despite prior radiotherapy at that level; or instability with fitness for surgery. Prognosis is one factor among several, assessed through the specialist MSCC pathway — there is no universal life-expectancy cut-off. Post-operative radiotherapy usually follows."},
         {tone:"blue", h:"Systemic therapy — tumour-specific", html:"Hormone therapy or chemotherapy where the tumour is highly hormone- or chemo-sensitive — prostate, lymphoma, myeloma, small-cell lung."},
         {tone:"green", h:"If the patient is dying", html:"Admission and radiotherapy may be inappropriate in the last days of life. <b>Seek specialist palliative care advice and focus on symptom control</b> — analgesia, positioning, catheterisation for retention, and honest conversation with the family. See <a href='care-of-the-dying.html'>care of the dying</a> and <a href='palliative-pain.html'>palliative pain</a>."},
         {tone:"purple", h:"Suspected cancer routes · NICE NG12 — if the primary is unknown", html:"Myeloma: aged 60 and over with persistent bone pain, particularly back pain, or an unexplained fracture → FBC, calcium, ESR or plasma viscosity, serum protein electrophoresis and serum free light chains, all together (urine Bence-Jones if free light chain testing is not available); suspected cancer pathway referral if the results suggest myeloma. The immediate MSCC pathway takes precedence over any routine direct-access X-ray route for bone sarcoma; the primary tumour work-up is coordinated by oncology/haematology. These run in PARALLEL with the acute pathway and never delay the steroid."},
         {tone:"cream", h:"What primary care owns", html:"Suspecting it, separating neurology from pain alone, giving the dexamethasone and gastroprotection when there are neurological symptoms or signs, arranging immobilisation where instability is suspected, contacting the MSCC coordinator, and giving every at-risk patient the safety-net. Related pages: <a href='sciatica.html'>sciatica</a> · <a href='cauda-equina.html'>cauda equina syndrome</a> · <a href='malignant-hypercalcaemia.html'>malignant hypercalcaemia</a> · <a href='svco.html'>superior vena cava obstruction</a> · <a href='palliative-corticosteroids.html'>palliative corticosteroids</a>."}
       ]},
       {b:"why", html:"Radiotherapy is appropriate for many patients because it relieves compression for many tumour types non-invasively. Surgery is preferred where the spine is unstable, where the compression is from bone rather than radiosensitive tumour, or where a single level can be decompressed in a patient fit enough to benefit — and the decision is driven by performance status and predicted survival rather than by the imaging alone. Outcome is strongly influenced by speed: ambulatory status at treatment is one of the strongest predictors of maintaining or regaining mobility — though some patients regain function after urgent treatment, particularly with rapid-onset deficits, favourable primary tumours and good performance status."}
     ]},

    {id:"after", nav:"After", title:"Supportive care, rehabilitation and follow-up",
     blocks:[
       {b:"table", head:["Domain","What to do"], rows:[
         ["<b>Pressure and VTE care</b>","Meticulous pressure-area care while immobile; individual VTE risk assessment (bleeding risk, spinal/epidural disease, planned surgery, thrombocytopenia, mobility, current anticoagulation); a bowel regimen from the outset"],
         ["<b>Bladder and bowel</b>","Continence support, catheterisation or intermittent self-catheterisation, and active bowel management for cord dysfunction"],
         ["<b>Rehabilitation</b>","Early physiotherapy and occupational therapy, mobility aids, falls prevention; spinal-cord-injury rehabilitation where appropriate"],
         ["<b>Psychological and social</b>","Support for the patient and family; equipment and care-package planning for new disability — often needed within days"],
         ["<b>Steroid taper</b>","Reduce gradually until stopped per the treating team’s plan (1–2 weeks may suit longer courses); if neurology worsens on reduction, return to the last effective dose for 2 weeks. Keep PPI cover and monitor glucose"],
         ["<b>Prognosis and advance care planning</b>","MSCC signals advanced disease — discuss prognosis and advance care planning. Ambulatory status at treatment is one of the strongest predictors of maintaining or regaining mobility, which is why treatment must not wait for late bladder or bowel symptoms"],
         ["<b>New or progressing neurology after treatment</b>","Urgent re-imaging and oncology review — do not assume it is expected progression"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 The safety-net, given verbally to every at-risk patient", html:"\"If you get new or worsening back pain, weakness or numbness in your legs, or any change in your bladder or bowels — contact us the same day or go to A&amp;E. Do not wait for an appointment and do not assume it is just your back.\""},
         {tone:"amber", h:"🟠 On the steroid", html:"\"Take it in the morning and at lunchtime, never in the evening — it will keep you awake. Take the stomach protector with it. Tell us if you feel agitated or your blood sugars run high.\""},
         {tone:"green", h:"✓ Honest framing", html:"\"We are treating this today rather than waiting for the scan, because the steroid protects the nerves while we get you seen. How you are walking now is one of the best guides to how you will walk afterwards — which is why we are not waiting.\""},
         {tone:"blue", h:"📋 Whom to warn", html:"Prioritise the safety-net conversation in patients with prostate, breast, lung or myeloma, and anyone with known bone metastases — and record that you gave it."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 68-year-old man with metastatic prostate cancer telephones about <b>3 weeks of mid-thoracic back pain</b>, now <b>waking him at night</b> and described as \"a band around my chest\". He mentions his legs feel \"heavy on the stairs\". He is already on <b>morphine sulfate MR 30 mg BD</b> for bone pain and assumed this was the same thing. On examination power is <b>5/5 throughout, reflexes brisk, plantars equivocal</b>, and he is still walking unaided. He asks whether he can \"wait for the oncology appointment next Thursday\"."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Recognises nocturnal band-like thoracic pain in prostate cancer as suspected MSCC despite the normal power; <b>states explicitly that a normal examination does not exclude it</b>; <b>asks specifically about bladder function and palpates for retention</b>; <b>gives dexamethasone 16 mg with a PPI THERE AND THEN, before imaging</b>, and can explain why; recognises the heavy legs and brisk reflexes as neurological symptoms/signs that put him on the 24-hour pathway; arranges whole-spine MRI within 24 hours — not a targeted film, not an outpatient request; <b>contacts the MSCC coordinator immediately rather than accepting Thursday</b>, and explains that walking now is one of the strongest predictors of walking later; <b>documents the neurological baseline</b>; <b>addresses the assumption that this is his existing bone pain</b> without dismissing it; <b>checks glucose and makes an individual VTE risk assessment</b>; and gives the return-immediately safety-net covering leg weakness and bladder change."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>NICE NG234 — Spinal metastases and metastatic spinal cord compression (2023)<br><a href="https://www.nice.org.uk/guidance/ng234" rel="noopener">nice.org.uk/guidance/ng234</a><span class="rd"> — dexamethasone 16 mg as soon as possible then 16 mg daily for suspected MSCC with neurological symptoms or signs (not routinely without them unless severe pain or haematological malignancy), stopping if MSCC is excluded and gradual reduction after surgery or the start of radiotherapy, whole-spine MRI within 24 hours of suspicion (within 1 week for suspected spinal metastases without neurology), immobilisation where instability is suspected, specialist-led treatment planning through the MSCC coordinator</span></li>'+
         '<li><b>NICE QS56 — Metastatic spinal cord compression in adults</b><span class="rd"> — the 24-hour MRI and MSCC coordinator standards</span></li>'+
         '<li>GMEC Palliative Care Pain &amp; Symptom Control Guidelines, 6th edition (April 2025)<span class="rd"> — the local GMEC/PCF8 regimen (16 mg loading and 8 mg twice daily maintenance, the subcutaneous equivalents 13.2 mg and 6.6 mg), gastroprotection, the return-to-last-effective-dose rule, and the local MSCC contact route</span></li>'+
         '<li><b>Greater Manchester Cancer Services MSCC pathway</b><span class="rd"> — the network MSCC coordinator route; cite the current Greater Manchester 24-hour MSCC coordinator contact details directly</span></li>'+
         '<li><b>Palliative Care Formulary (PCF8)</b><span class="rd"> — corticosteroid dosing, adverse effects and tapering in the palliative setting</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — the myeloma bloods route at 60 and over with persistent bone or back pain, which applies where MSCC is the index presentation of an unknown primary; in an acute MSCC presentation the immediate MSCC pathway takes precedence over the bone sarcoma X-ray route</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Metastatic spinal cord compression — NICE NG234, GMEC Palliative Care Guidelines 6th edition, the Greater Manchester MSCC pathway and PCF8. Suspect, steroid, scan. With neurological symptoms or signs: give dexamethasone 16 mg with gastroprotection on clinical suspicion, before imaging, contact the MSCC coordinator immediately and arrange whole-spine MRI within 24 hours. With pain alone: MSCC-team advice within 24 hours and whole-spine MRI within 1 week, without routine corticosteroids. A normal neurological examination does not exclude spinal metastases, and thoracic back pain in a patient with cancer should be treated as suspected spinal metastases until assessed. Ambulatory status at treatment is one of the strongest predictors of maintaining or regaining mobility. Verify all doses against the BNF before prescribing."
