MG.render({
  icon:"🔺",
  title:"Hernia — the complete guide",
  eyebrow:"Protocol · HerniaSurge · BAPS · landmarks guide the urgency",
  stemTitle:"Two facts carry most of the risk in this condition: a femoral hernia has a substantially higher risk of incarceration and strangulation than an inguinal one, and a strangulated hernia must never be pushed back in",
  stemSub:"Assessment and management in one place — the strangulation and obstruction emergency and the reason manual reduction can kill, the pubic tubercle landmark that helps separate inguinal from femoral, why femoral hernias are referred for timely repair even when they cause no symptoms, watchful waiting for suitable men with a reducible, asymptomatic or minimally symptomatic inguinal hernia and the trial evidence behind it, why children are the exception to that rule, the differential of a groin lump including the torsion trap, the MHRA pelvic-mesh alert and balanced inguinal mesh counselling, chronic post-repair groin pain as a real complication, and return to work and activity guided by pain, function and the surgeon's pathway.",
  guideline:"HerniaSurge 2018 and 2023 update (international) · BAPS · NICE NG12 (updated April 2026)",
  reviewed:"13 September 2026",
  nextReview:"13 March 2027",
  meta:[
    {t:"HerniaSurge 2018 (international) — groin hernia management (watchful waiting, laparoscopic indications)"},
    {t:"HerniaSurge 2023 update (international) — groin hernia management"},
    {t:"BAPS — paediatric hernia: no watchful waiting"},
    {t:"MHRA mesh alert is PELVIC mesh, not inguinal", tone:"tw"},
    {t:"v1.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#safety"><b>Strangulation</b><small>999 · never reduce</small></a><a href="#classify"><b>Classify</b><small>Pubic tubercle</small></a><a href="#differential"><b>Differential</b><small>Groin lump</small></a><a href="#manage"><b>Manage</b><small>Repair vs waiting</small></a><a href="#aftercare"><b>Aftercare</b><small>Work · recurrence</small></a></div>',
  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Do not attempt to reduce a suspected strangulated hernia", html:"Do not attempt manual reduction when strangulation is suspected: constant or escalating pain, marked tenderness, skin erythema, systemic illness, peritonism, obstruction or concern about bowel viability → 999, with no attempt at reduction. Reduction risks returning ischaemic bowel to the abdomen: the lump disappears, producing false reassurance while the patient develops peritonitis (the rare Maydl's configuration is one mechanism). Taxis of a recently irreducible but non-strangulated hernia is a hospital/surgical manoeuvre and requires observation after reduction. Strangulation is time-critical."},
    {tone:"red", h:"Femoral hernias — timely repair, symptoms or not", html:"Femoral hernias have a substantially higher risk of incarceration and strangulation than inguinal hernias — avoid quoting a single universal percentage — because the femoral ring is narrow and rigid, bounded by the inguinal and Cooper's ligaments and the femoral vein. Commonest in older women (female:male about 2:1) and frequently mistaken for a lymph node. Refer for timely surgical repair even when symptoms are minimal or absent: reducible and clinically well → urgent surgical referral (not necessarily 999); painful, irreducible, tender, enlarging, obstructed or systemically unwell → same-day emergency surgical assessment/999 depending on severity; diagnostic uncertainty → urgent surgical assessment or imaging per the local pathway. Watchful waiting does not apply."},
    {tone:"blue", h:"The pubic tubercle — a landmark, not a verdict", html:"Inguinal: above and medial to the pubic tubercle. Femoral: below and lateral. Find the tubercle by tracing the medial attachment of the inguinal ligament laterally from the symphysis — it sits about 1 cm off the midline. This is not an academic distinction: it is the difference between an urgent referral and a legitimate conversation about waiting. Examine standing (to demonstrate) and lying (for reducibility). The distinction can be difficult, particularly in obesity, large hernias and women — if uncertain, arrange dynamic ultrasound or urgent surgical assessment rather than confidently labelling a lump as a lymph node."},
    {tone:"green", h:"Watchful waiting — for suitable adult men", html:"In a man with a reducible, asymptomatic or minimally symptomatic inguinal hernia, watchful waiting may be offered after discussion of the likelihood of later surgery and the small but non-zero risk of emergency presentation, provided there is no significant activity limitation, reliable access to emergency care and an understanding of the safety-net (HerniaSurge). It is not appropriate for femoral hernia, symptomatic hernia, non-pregnant women with a groin hernia (an occult femoral hernia may be missed), children or a hernia with a history of incarceration. The Fitzgibbons (JAMA 2006) and O'Dwyer trials found low emergency-event rates in selected men, but long-term crossover to surgery is substantial — frame it as deferral rather than avoidance."},
    {tone:"amber", h:"⛔ No watchful waiting in children", html:"<b>Refer all suspected paediatric inguinal hernias to paediatric surgery for repair.</b> Urgency depends on age, reducibility and symptoms: an irreducible, painful, tense or vomiting child requires emergency assessment; a reducible hernia in a well child requires prompt paediatric surgical referral according to the local pathway — particularly prompt for infants and premature infants, who cannot report early incarceration. Umbilical hernias in children are the opposite: most close spontaneously; assess persistent or symptomatic ones per paediatric surgical guidance."},
    {tone:"blue", h:"The MHRA pelvic-mesh alert is not about inguinal mesh", html:"The 2018 MHRA pelvic-mesh alert concerned transvaginal mesh for pelvic organ prolapse and stress urinary incontinence, not standard inguinal hernia mesh — a different anatomical operation and complication profile. This does not mean inguinal mesh has no complications: chronic pain, infection, recurrence and nerve symptoms are recognised risks and should be discussed as part of informed consent. HerniaSurge recommends mesh repair as the usual first choice for adult groin hernia, with the technique selected by the surgeon according to hernia type, sex, recurrence, comorbidity, expertise and patient preference."}
  ],
  pathwaySub:"Five steps. The first two take under a minute and settle the urgency.",
  pathway:[
    {title:"Exclude strangulation and obstruction", html:"Constant severe pain, peritonism, skin erythema, systemic illness or shock → 999/emergency surgical assessment, nil by mouth, and NO reduction attempt. Vomiting, distension and absolute constipation with a hernia → emergency hospital assessment for obstruction. Recently irreducible, painful or enlarging hernia without systemic features → same-day surgical assessment.", alert:true},
    {title:"Locate it against the pubic tubercle", html:"<b>Above and medial = inguinal. Below and lateral = femoral</b> — landmarks that are less reliable in obesity, large hernias and women. Examine standing and supine, assess reducibility and cough impulse, inspect the scrotum and testes, and examine the contralateral side. If the origin of a groin or scrotal swelling is uncertain, arrange ultrasound or specialist assessment. <b>Mostly a clinical diagnosis</b> — imaging is for uncertainty, not routine."},
    {title:"Decide the urgency from the type", html:"Reducible femoral hernia in a well adult → urgent surgical referral for timely repair (not necessarily 999). Paediatric inguinal hernia → prompt paediatric surgical referral; emergency if irreducible, painful, vomiting or unwell. Non-pregnant woman with a groin hernia → timely surgical referral. Adult umbilical, paraumbilical or epigastric → elective referral if symptomatic, enlarging or affecting function; urgent if painful, irreducible or obstructed. Symptomatic inguinal → elective repair. Reducible, asymptomatic or minimally symptomatic inguinal in an adult man → discuss repair versus watchful waiting."},
    {title:"Optimise before any elective repair", html:"Weight, smoking cessation, and chronic cough, constipation and prostatism when clinically relevant — <b>treat them on their own merits</b>; they are not proven causes of recurrence in an individual patient."},
    {title:"Safety-net in words, and follow up after repair", html:"\"If it becomes painful, won't go back in, or the skin goes red — A&amp;E, not the surgery.\" Then follow the operating surgeon's postoperative pathway (many uncomplicated repairs need no routine face-to-face wound review if the patient has clear written advice and access to help), assess persistent or function-limiting pain, and consider recurrence at any new bulge."}
  ],
  sections:[

    {id:"safety", nav:"Red flags", title:"The emergency — and the one manoeuvre never to perform",
     blocks:[
       {b:"table", head:["Presentation","Meaning","Action"], rows:[
         ["Irreducible, tense, tender hernia · severe CONSTANT pain not relieved by lying · overlying skin erythema · fever or vomiting","<b>Strangulation</b> — arterial occlusion at the neck with bowel ischaemia. Erythema of the overlying skin suggests possible bowel ischaemia","<b>999, emergency surgery within hours.</b> IV access, nil by mouth, fluids, analgesia, antiemetic; antibiotics per local protocol. <b>NO attempt at reduction</b>"],
         ["Colicky abdominal pain · bilious vomiting · distension · absolute constipation, with an irreducible hernia","<b>Obstructed hernia</b> — bowel trapped and mechanically obstructed; may still be reducible","<b>Emergency hospital assessment for obstruction (999 if unwell).</b> CT in hospital; emergency surgery if complete obstruction is confirmed"],
         ["Large irreducible femoral hernia in an older woman with vomiting and colicky pain","<b>Femoral hernias have a substantially higher risk of incarceration and strangulation</b> than inguinal — the ring is narrow and rigid","<b>999. Do not attempt manual reduction before surgical assessment</b>"],
         ["Reducible femoral hernia in a clinically well adult","<b>Higher incarceration and strangulation risk, but not an emergency today</b>","<b>Urgent surgical referral for timely repair — not necessarily 999</b>"],
         ["Groin or scrotal swelling in an infant or child","<b>Paediatric inguinal hernia</b> — infants and premature infants cannot report early incarceration","<b>Prompt paediatric surgical referral per the local pathway; emergency assessment if irreducible, painful, tense, vomiting or systemically unwell</b>"],
         ["Sudden increase in size with new pain, a previously reducible hernia now irreducible, fever","<b>Acute incarceration</b>","<b>Same-day surgical assessment — not an elective appointment</b>"],
         ["Sudden severe central abdominal pain with peritonism, a previous repair scar and an irreducible midline bulge","<b>Perforated viscus through a mesh defect or recurrent incisional hernia</b>","<b>999</b>"],
         ["Acute severe scrotal pain, particularly in a child or adolescent — classic signs (high-riding testis, absent cremasteric reflex) may be absent","<b>Testicular torsion</b> — can mimic an incarcerated inguinoscrotal hernia, and pain is sometimes referred to the groin","<b>Treat as torsion until excluded: immediate urological/paediatric surgical assessment. Do not delay referral for ultrasound if suspicion is high. Viability falls steeply after 6 hours</b>"]
       ]},
       {b:"why", html:"Obstruction and strangulation are separated by the CHARACTER of the pain, not its severity. In obstruction the pain is colicky and the hernia may still reduce; in strangulation it is constant and unremitting, the lump is tense and tender rather than soft and compressible, the overlying skin reddens, and systemic features signal sepsis from transmural necrosis. The progression is venous occlusion first — which is why the hernia visibly enlarges — then arterial occlusion, ischaemia, necrosis, perforation and faecal peritonitis."},
       {b:"warn", html:"<b>The rule, and the reason behind it.</b> Do not attempt manual reduction when strangulation is suspected: constant or escalating pain, marked tenderness, skin erythema, systemic illness, peritonism, obstruction or concern about bowel viability. In primary care, do not attempt reduction if there is significant pain, tenderness, erythema, systemic illness, obstruction or diagnostic uncertainty. Taxis of a recently irreducible but non-strangulated hernia is a hospital/surgical manoeuvre — by an experienced clinician, with analgesia or sedation — and requires observation after reduction. Reducing ischaemic bowel makes the lump vanish and falsely reassures while the bowel perforates (the rare Maydl's configuration is one mechanism). Hard, tense, constantly painful, red or febrile means 999 with your hands off."}
     ]},

    {id:"classify", nav:"Classify", title:"Classification — and why the landmark matters more than the name",
     blocks:[
       {b:"table", head:["Type","Features","Management implication"], rows:[
         ["<b>Inguinal — about 75% of abdominal wall hernias</b>","Male:female roughly 8:1. <b>Above and medial to the pubic tubercle.</b> <b>Indirect</b>: through the deep ring along the canal, potentially to the scrotum, congenital (patent processus vaginalis), any age. <b>Direct</b>: through Hesselbach's triangle, acquired, usually middle-aged or older men","The direct/indirect distinction is far less clinically reliable than traditionally taught and is usually confirmed intraoperatively — it does not change primary-care management. Symptomatic → elective repair; reducible, asymptomatic or minimally symptomatic in a man → discuss repair versus watchful waiting; non-pregnant woman → timely surgical referral (an occult femoral hernia may be missed)"],
         ["<b>Femoral — 5–8% of groin hernias</b>","<b>Below and lateral to the pubic tubercle.</b> Female predominance about 2:1. Cough impulse often weak or absent; frequently hard and tender. <b>Commonly misdiagnosed as a lymph node</b>","Timely surgical repair in every case, symptomatic or not — substantially higher incarceration and strangulation risk. Reducible and well: urgent surgical referral (not necessarily 999); painful, irreducible, tender, enlarging or obstructed: same-day emergency assessment. Never watch and wait"],
         ["<b>Umbilical</b>","Through the umbilicus itself. Adults: acquired — obesity, ascites, pregnancy. Children: most close spontaneously","Children: assess persistent or symptomatic hernias per paediatric surgical guidance; emergency assessment if painful, tense, irreducible or vomiting. Adults: elective referral if symptomatic, enlarging or affecting function; urgent if painful, irreducible or obstructed"],
         ["<b>Paraumbilical</b>","Just above or below the umbilicus, not through it. Adults, typically overweight","<b>Elective referral if symptomatic, enlarging or affecting function; urgent if painful, irreducible or obstructed.</b> A small, asymptomatic, uncomplicated hernia may be managed according to symptoms, operative risk and patient preference. Not the same as the childhood umbilical hernia it is often confused with"],
         ["<b>Incisional</b>","Through a previous surgical scar. Risk factors: obesity, wound infection, haematoma, poor healing","Repair timing balances symptoms against operative risk. <b>Obesity substantially increases the risk after abdominal surgery</b>"],
         ["<b>Epigastric</b>","Fat, sometimes bowel, through the linea alba between xiphoid and umbilicus","Elective referral if symptomatic, enlarging or affecting function; urgent if painful, irreducible or obstructed — do not refer every asymptomatic epigastric hernia urgently"],
         ["<b>Spigelian</b>","Rare; at the lateral edge of the rectus sheath. Often occult and painful","Frequently missed — consider it in unexplained lateral abdominal wall pain and image"]
       ]},
       {b:"dl", rows:[
         ["<b>History</b>","Site · duration · reducibility (spontaneously on lying, or with gentle pressure?) · precipitants (lifting, coughing, Valsalva, pregnancy). Pain pattern is the safety question: on exertion is typical, at rest suggests incarceration, constant and severe means strangulation. Obstruction symptoms. Previous repairs. Risk factors — obesity, chronic cough or COPD, constipation, prostatism, heavy lifting, ascites, connective tissue disorder. <b>Occupation, because it determines the fit note after repair</b>"],
         ["<b>Examination</b>","<b>Examine standing and supine.</b> Visible bulge at rest or on coughing; assess reducibility and cough impulse; site relative to the pubic tubercle; consistency and tenderness; inspect the scrotum and testes; examine the contralateral side. <b>An expansile cough impulse supports the diagnosis, but its absence does not exclude a hernia.</b> Being unable to get above a scrotal swelling suggests a hernia but is not always reliable; transillumination is not a definitive test for hydrocele, and bowel sounds within a scrotal swelling are neither necessary nor sufficiently sensitive. If the origin of a scrotal or groin swelling is uncertain, arrange ultrasound or specialist assessment. DRE is not routine — assess for prostatism when the history indicates it"],
         ["<b>Investigations — for uncertainty, not routine</b>","<b>Diagnosis is mostly clinical.</b> Imaging is for an uncertain examination, an occult lump, obesity limiting examination, a suspected recurrent or complex hernia, or a differential (lymphadenopathy, vascular lesion, hydrocele) needing clarification. <b>Dynamic ultrasound is a practical first investigation where available</b>; it also separates hernia from lymphadenopathy, hydrocele, cord lipoma and saphena varix. <b>Operator-dependent, and less sensitive for femoral hernia in obesity.</b> <b>MRI for occult groin hernia</b> when ultrasound is negative or equivocal and suspicion remains. <b>CT for obstruction, complex, recurrent or incisional hernia, or acute intra-abdominal pathology</b>"]
       ]}
     ]},

    {id:"differential", nav:"Differential", title:"The groin or scrotal lump that is not a hernia",
     blocks:[
       {b:"table", head:["Diagnosis","Distinguishing features"], rows:[
         ["<b>Inguinal lymphadenopathy</b>","<b>No cough impulse, firm or rubbery, discrete nodes, not reducible.</b> Causes: infection (cellulitis, STI, tinea pedis) or malignancy — <b>lymphoma, metastatic melanoma, SCC of vulva, penis or lower limb</b>. <b>The commonest thing a femoral hernia is mistaken for, and vice versa</b>"],
         ["<b>Femoral artery aneurysm</b>","<b>Pulsatile and expansile</b>, firm, no cough impulse"],
         ["<b>Hydrocele</b>","<b>Transilluminates, fluctuant, you CAN get above it</b>, no cough impulse — supportive, not definitive; ultrasound if uncertain"],
         ["<b>Saphena varix</b>","<b>Soft and compressible, empties on lying down</b>, fluid thrill from the saphenofemoral junction on coughing"],
         ["<b>Testicular torsion</b>","<b>EMERGENCY and a genuine mimic</b> — acute severe pain often waking from sleep, nausea and vomiting, high-riding testis, absent cremasteric reflex, not relieved by elevation — but classic findings can be absent and the cremasteric reflex is not sensitive enough to exclude torsion. Pain is sometimes referred to the groin and read as incarceration"],
         ["<b>Testicular tumour</b>","<b>Painless hard mass within the testis</b> — a suspected-cancer referral, not a hernia pathway"],
         ["<b>Epididymo-orchitis</b>","Tender, warm, systemically unwell; gradual onset"],
         ["<b>Occult inguinal hernia</b>","<b>Clinically absent but symptomatic</b> — exertional groin pain, pain on Valsalva, deep tenderness. Dynamic USS or MRI confirms"],
         ["<b>Athletic pubalgia (\"sports hernia\")</b>","<b>Not a true hernia</b> — posterior inguinal wall weakness with adductor-related groin pain in athletes, often bilateral. MRI including pelvis, hip and adductors; physiotherapy or laparoscopic posterior wall reinforcement"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"red", h:"⚠ The torsion trap", html:"Acute severe scrotal pain, particularly in a child or adolescent, should be treated as testicular torsion until excluded, even when the story sounds like a hernia that has become stuck. Arrange immediate urological/paediatric surgical assessment. Torsion can occur without classic findings, and the cremasteric reflex is not sensitive enough to exclude it; do not delay referral for Doppler ultrasound if clinical suspicion is high — viability falls steeply beyond 6 hours."},
         {tone:"amber", h:"⚠ The lymph node that is a femoral hernia", html:"A firm, slightly tender lump below the inguinal ligament in an older woman is a femoral hernia far more often than clinicians expect. If there is any doubt, image it or refer it — do not label it reactive lymphadenopathy and review in six weeks."},
         {tone:"blue", h:"🔍 Get above it", html:"A useful scrotal test, but not always reliable: if you cannot place your fingers above the swelling, it is likely connected to the inguinal canal; if you can, it is more likely scrotal in origin — hydrocele, epididymal cyst or testicular. If the origin is uncertain, arrange ultrasound or specialist assessment."},
         {tone:"green", h:"✓ Bilateral examination, always", html:"<b>Contralateral hernias are common and frequently asymptomatic.</b> Finding one changes the operation — <b>HerniaSurge recommends laparoscopic repair for bilateral hernias</b>, so it is worth knowing before referral."}
       ]}
     ]},

    {id:"manage", nav:"Manage", title:"Repair, watchful waiting, and the truss",
     blocks:[
       {b:"table", head:["Option","Detail","Notes"], rows:[
         ["<b>Open repair — Lichtenstein tension-free mesh</b>","The gold-standard open technique: polypropylene mesh reinforcing the posterior wall. Local or general anaesthesia, day case","Complications: chronic groin pain (the most significant long-term complication; rates are technique-dependent), mesh infection, seroma, haematoma, recurrence. Technique is selected by the surgeon"],
         ["<b>Laparoscopic repair — TEP or TAPP</b>","HerniaSurge recommends laparoscopic repair for BILATERAL and RECURRENT hernias; also where rapid return to work matters. Recurrence broadly comparable with open mesh repair","Smaller incisions, less postoperative pain, faster recovery; requires general anaesthesia. A recurrence is usually repaired by the opposite approach to the original, to avoid scarred tissue planes"],
         ["<b>Femoral hernia repair</b>","Lockwood (low) or McVay open approach; laparoscopic TEP/TAPP gives excellent exposure of the femoral ring and allows simultaneous assessment for a concurrent inguinal hernia, which is common","Emergency repair includes assessment of bowel viability — resection with primary anastomosis, or a stoma in a contaminated field"],
         ["<b>Non-mesh (Shouldice) repair</b>","<b>Higher recurrence than mesh repair</b> — reserved for mesh infection risk, patient preference, or recurrence after previous mesh","<b>Biologic resorbable mesh is used in contaminated fields</b> such as bowel perforation or infected repair"],
         ["<b>Watchful waiting</b>","May be offered to a man with a reducible, asymptomatic or minimally symptomatic inguinal hernia, no significant activity limitation, no incarceration history and reliable access to emergency care, after discussion of the likelihood of later surgery and the small but non-zero risk of emergency presentation","Give written safety-netting and arrange follow-up according to symptoms, patient preference and the local surgical pathway — there is no universally mandated annual review. Any new pain, irreducibility or systemic feature converts it to a surgical referral. NOT appropriate for femoral hernia, symptomatic hernia, non-pregnant women with a groin hernia, children, or a hernia with a history of incarceration"],
         ["<b>Truss</b>","Does not repair anything; may reduce discomfort and protrusion in someone unfit for or declining surgery. Measured from symphysis pubis to ASIS and fitted by an orthotist or specialist nurse. <b>Applied lying down with the hernia reduced, before standing</b>","<b>Never over an irreducible hernia.</b> Watch for pressure sores. The patient must understand that a truss does not prevent incarceration — if the hernia becomes painful or irreducible, A&amp;E"],
         ["<b>Preoperative optimisation</b>","Weight, smoking cessation; treat chronic cough, constipation and prostatism when clinically relevant","Weight loss before elective repair reduces wound infection — the leading cause of mesh infection and repair failure — plus haematoma and pulmonary complications. See <a href='obesity.html'>obesity</a>, <a href='smoking-cessation.html'>smoking cessation</a>, <a href='copd.html'>COPD</a>, <a href='male-luts.html'>male LUTS</a>, <a href='../algorithms/constipation.html'>constipation</a>"]
       ]},
       {b:"why", html:"Two randomised trials support watchful waiting in selected men. Fitzgibbons (JAMA 2006) and O'Dwyer (UK, 2006) randomised men with minimally symptomatic inguinal hernias to watchful waiting or immediate repair: acute emergencies were uncommon and quality of life was equivalent in these selected men, but the emergency-event rate should not be presented as universally applicable. But most patients eventually crossed over to surgery as symptoms increased — so the honest framing is that waiting is safe and often temporary, not that repair is being avoided. None of this transfers to femoral hernias, to women with groin hernias, or to children."}
     ]},

    {id:"aftercare", nav:"Aftercare", title:"After repair — recovery, chronic pain and recurrence",
     blocks:[
       {b:"dl", rows:[
         ["<b>Return to work and activity — what patients actually ask</b>","Follow the operating surgeon's advice. Return to work and activity is guided by pain and function, adapted to the operation, occupation and any complications — not by a universal timetable or lifting limit. Drive only when an emergency stop can be performed safely without pain. Avoid prolonged activity restriction after uncomplicated repair unless the surgeon has advised it. For manual workers, a fit note for amended duties guided by the surgeon's advice is often more useful than time off"],
         ["<b>Wound care</b>","Keep dry 24–48 hours, then shower and pat dry. Follow the surgeon's local pathway — many uncomplicated repairs need no routine face-to-face wound review if the patient has clear written advice and access to help. Sutures are usually absorbable. Increasing redness, warmth, swelling, purulent discharge or fever → same-day review"],
         ["<b>Haematoma, seroma and scrotal oedema</b>","A soft swelling at the repair site is common and alarming to patients but usually resolves over weeks without intervention; ice and reassurance, surgical advice if tense, enlarging or infected. Scrotal oedema after inguinal repair is expected from lymphatic disruption — support, ice, elevation; usually settles over a few weeks"],
         ["<b>Chronic post-repair groin pain</b>","Generally considered when pain persists beyond approximately 3 months and affects activities; rates are approximate and technique-dependent. Persistent pain may be neuropathic (ilioinguinal, iliohypogastric or genital branch of the genitofemoral nerve), nociceptive, mesh-related, from recurrence, hip- or spine-related, or non-hernia pain. Risk factors: open repair, younger age, and pre-operative pain. Pain beyond 3 months, particularly if neuropathic or function-limiting, requires structured assessment: check for recurrence, infection, testicular pathology, hip/spine disease and neuropathic features. Manage with multimodal analgesia and refer to a specialist hernia or chronic-pain service if persistent or disabling; neurectomy only in an experienced specialist hernia/pain service. This is a genuine complication, not psychosomatic — see <a href='neuropathic-pain.html'>neuropathic pain</a> and <a href='chronic-pain.html'>chronic pain</a>"],
         ["<b>Recurrence</b>","Rates depend on technique, primary versus recurrent hernia, follow-up and definition — avoid quoting fixed figures. Presents as a bulge returning at the same site, weeks to years later. Examine as for the original; USS to confirm; re-refer for planned repair"],
         ["<b>Reducing recurrence</b>","Weight, chronic cough, constipation and straining, and lifting technique are worth addressing when clinically relevant, but they are not proven causes of recurrence in an individual patient. Treat constipation properly (fibre, fluids, macrogol if needed). <b>Address chronic cough if clinically indicated; review an ACE inhibitor only if the patient has a probable ACE-inhibitor cough, and switch according to the usual cardiovascular/renal indication — not simply because a hernia is present</b>"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 A&amp;E — say it plainly", html:"\"If the lump becomes painful, won't push back in, or the skin over it goes red or hot — or you start vomiting or get bad tummy pain — go straight to A&amp;E. Don't ring the surgery first.\" Give this to everyone with a hernia, repaired or not."},
         {tone:"amber", h:"🟠 Same-day surgical assessment", html:"A previously reducible hernia that has become irreducible but is not yet tender or systemically unwell · sudden enlargement with new pain · rapidly enlarging hernia."},
         {tone:"blue", h:"📋 Post-repair review points", html:"Follow the surgeon's postoperative pathway · persistent or function-limiting pain assessed at follow-up (chronic if beyond about 3 months) · scrotal oedema reviewed if not settling · fit note guided by pain, function and occupation."},
         {tone:"green", h:"👶 For parents", html:"\"Bring your child to A&amp;E immediately if the lump becomes hard, they are inconsolable, or they start vomiting.\" Most umbilical hernias in children close by themselves; inguinal ones need referral to a paediatric surgeon for repair."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999 / emergency", html:"Suspected strangulation (constant severe pain, peritonism, skin erythema, systemic illness or shock) — nil by mouth, no attempted reduction · obstruction (vomiting, distension, absolute constipation) · perforation · any hernia with cardiovascular compromise · femoral hernia that is painful, irreducible, tender, enlarging, obstructed or with systemic illness (999 or same-day emergency surgical assessment by severity) · suspected testicular torsion — acute scrotal pain in a child or adolescent: immediate urological/paediatric surgical assessment."},
         {tone:"amber", h:"Same-day surgical assessment", html:"Recently irreducible, painful or enlarging hernia without systemic features · suspected incarceration · femoral hernia with diagnostic uncertainty (urgent surgical assessment or imaging per the local pathway) · any child with an irreducible, painful or tense inguinal hernia, or vomiting (emergency assessment)."},
         {tone:"amber", h:"Urgent surgical referral", html:"Reducible femoral hernia in a clinically well adult — timely repair, not necessarily 999 · non-pregnant woman with a groin hernia (avoid routine watchful waiting; an occult femoral hernia may be missed) · recurrent incarceration episodes · painful or irreducible umbilical, paraumbilical or epigastric hernia · any paediatric inguinal hernia — prompt paediatric surgical referral per the local pathway, particularly for infants and premature infants."},
         {tone:"blue", h:"Routine surgical referral", html:"Symptomatic reducible inguinal hernia (including significant pain or functional limitation), and symptomatic, enlarging or function-limiting umbilical, paraumbilical, epigastric or incisional hernia, for elective repair · reducible asymptomatic or minimally symptomatic inguinal hernia in a man who prefers repair after discussing watchful waiting · uncertain groin lump → dynamic ultrasound or surgical assessment. Flag bilateral or recurrent hernias in the letter — HerniaSurge directs those to laparoscopic repair."},
         {tone:"blue", h:"Specialist hernia clinic", html:"Persistent or disabling chronic post-repair groin pain (beyond about 3 months) — specialist hernia or chronic-pain service · complex recurrent or incisional hernia · patients with mesh concerns who want a surgical discussion before consenting."},
         {tone:"purple", h:"Suspected cancer — the routes that run through a groin lump", html:"Hernia itself has no NICE NG12 criterion, and none should be invented. But two NG12 routes run through the differential of a groin or scrotal swelling and must not be missed while a hernia is assumed: a non-painful enlargement or change in shape or texture of the testis → consider a suspected cancer pathway referral for testicular cancer (and consider an urgent direct-access ultrasound for unexplained or persistent testicular symptoms), and unexplained lymphadenopathy in an adult → consider a suspected cancer pathway referral for lymphoma, taking into account fever, night sweats, breathlessness, pruritus or weight loss (NICE NG12, updated April 2026). Persistent inguinal lymphadenopathy with no infective cause is not a hernia and is not reactive by default."},
         {tone:"cream", h:"GP management", html:"Primary care does the diagnosis and the triage, the watchful-waiting conversation and follow-up according to symptoms and the local pathway, the truss discussion, preoperative optimisation, post-repair advice per the surgeon's pathway, chronic-pain assessment, recurrence detection, and the safety-net that actually prevents the emergency. Related pages: <a href='obesity.html'>obesity</a> · <a href='smoking-cessation.html'>smoking cessation</a> · <a href='copd.html'>COPD</a> · <a href='male-luts.html'>male LUTS</a> · <a href='../algorithms/constipation.html'>constipation pathway</a> · <a href='neuropathic-pain.html'>neuropathic pain</a> · <a href='chronic-pain.html'>chronic pain</a>."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A <b>71-year-old woman</b> attends with a <b>small lump in the right groin</b> noticed three weeks ago. It is <b>mildly tender, firm, and she cannot push it back</b>, but she is otherwise well — eating normally, bowels open, no vomiting. She has a chronic cough on <b>ramipril</b>, a BMI of 32, and assumed the lump was \"a gland\". She is <b>anxious about mesh</b> after a television programme, asks whether she can \"just leave it\", and is due to fly abroad in ten days."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Locates the lump against the pubic tubercle and identifies it as FEMORAL — below and lateral, rather than accepting \"a gland\"; recognises that a femoral hernia carries a substantially higher strangulation risk and that, because hers is irreducible and tender, she needs SAME-DAY surgical assessment even though she is otherwise well, and explicitly rejects watchful waiting for it; <b>does not attempt to reduce an irreducible tender hernia</b>; gives the strangulation safety-net verbally — A&amp;E, not the surgery — and documents it, addressing the imminent flight directly; corrects the mesh misconception accurately: the MHRA alert concerns transvaginal pelvic mesh, not inguinal or femoral hernia mesh, and discusses recognised mesh risks (chronic pain, infection, recurrence) as part of informed consent rather than dismissing the concern; reviews the chronic cough and whether it is a probable ACE-inhibitor cough, changing ramipril only on its usual cardiovascular/renal merits — not simply because of the hernia; addresses <b>weight before elective surgery</b> without making it a condition of referral; considers the differential she raised — a firm groin node — and says why the landmark makes a hernia likely and that imaging or surgical assessment resolves any doubt; and <b>offers to arrange a surgical discussion before she consents</b>, rather than arguing about mesh in the room."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>HerniaSurge international guidelines for groin hernia management (2018; updated 2023)</b><br><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10588975/" rel="noopener">pmc.ncbi.nlm.nih.gov/articles/PMC10588975</a><span class="rd"> — the primary-care assessment, the pubic tubercle landmark, the groin-lump differential, higher incarceration/strangulation risk and timely repair of femoral hernia, watchful waiting limited to suitable men, mesh repair as usual first choice, referral thresholds and truss practicalities; the 2023 update gives current recommendations on women with groin hernias, laparo-endoscopic and recurrent repair, chronic postoperative pain, perioperative optimisation and shared decision-making; the 2018 guideline is used only where unchanged</span></li>'+
         '<li><b>Fitzgibbons et al, JAMA 2006, and O\u2019Dwyer et al, 2006</b><span class="rd"> — the two randomised trials of watchful waiting versus immediate repair in selected men: low emergency-event rates (not universally applicable), equivalent quality of life, and substantial crossover to surgery over time</span></li>'+
         '<li><b>BAPS — British Association of Paediatric Surgeons hernia guidance</b><span class="rd"> — referral of all paediatric inguinal hernias for repair, with urgency by age, reducibility and symptoms per the local paediatric surgical pathway, and repair before neonatal discharge where clinically stable</span></li>'+
         '<li><b>MHRA — mesh safety alert (2018)</b><span class="rd"> — the alert applies to transvaginal PELVIC mesh for prolapse and stress urinary incontinence; it does not concern standard inguinal hernia mesh, which nonetheless carries recognised risks of chronic pain, infection and recurrence to discuss at consent</span></li>'+
         '<li><b>NICE NG125 — Surgical site infections (2019)</b><br><a href="https://www.nice.org.uk/guidance/ng125" rel="noopener">nice.org.uk/guidance/ng125</a><span class="rd"> — wound care and infection recognition after repair</span></li>'+
         '<li><b>British Hernia Society — repair standards</b><span class="rd"> — repair standards; recurrence and chronic post-repair pain vary by technique, primary versus recurrent hernia, follow-up and definition, so fixed rates are not quoted here</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — the suspected cancer pathway referral for a non-painful enlargement or change in shape or texture of the testis (with direct-access ultrasound for unexplained or persistent testicular symptoms), and the unexplained-lymphadenopathy route; hernia itself carries no NG12 criterion</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Hernia — HerniaSurge (international, 2018 and 2023 update), BAPS paediatric guidance and NICE NG12 (updated April 2026). Constant severe pain, peritonism, skin erythema, systemic illness or shock means 999 with no attempt at reduction; taxis of a non-strangulated irreducible hernia is a hospital manoeuvre. The pubic tubercle is a landmark, not a verdict: above and medial is inguinal, below and lateral is femoral, and femoral hernias are referred for timely repair whether or not they hurt — urgently if reducible and well, as an emergency if painful, irreducible or obstructed. Watchful waiting is for suitable men with a reducible, asymptomatic or minimally symptomatic inguinal hernia — not for women with groin hernias, femoral hernias or children. The MHRA alert concerns pelvic mesh, not inguinal mesh, but inguinal mesh still has risks to discuss. Verify all doses against the BNF before prescribing."
});
