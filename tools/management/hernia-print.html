  stemTitle:"Two facts carry most of the risk in this condition: a femoral hernia strangulates seven times more often than an inguinal one, and a strangulated hernia must never be pushed back in",
  stemSub:"Assessment and management in one place — the strangulation and obstruction emergency and the reason manual reduction can kill, the pubic tubercle landmark that separates inguinal from femoral, why every femoral hernia is repaired urgently even when it causes no symptoms, watchful waiting for asymptomatic inguinal hernia and the trial evidence behind it, why children are the exception to that rule, the differential of a groin lump including the torsion trap, the MHRA mesh warning that is routinely misapplied to inguinal repair, chronic post-repair groin pain as a real neuropathic complication, and the practical return-to-work and activity timelines patients actually ask about.",

  meta:[
    {t:"HerniaSurge 2018 — groin hernia management (watchful waiting, laparoscopic indications)"},

  ],
  lead:'<div class="mg-layers"><a href="#safety"><b>Strangulation</b><small>999 · never reduce</small></a><a href="#classify"><b>Classify</b><small>Pubic tubercle</small></a><a href="#differential"><b>Differential</b><small>Groin lump</small></a><a href="#manage"><b>Manage</b><small>Repair vs waiting</small></a><a href="#aftercare"><b>Aftercare</b><small>Work · recurrence</small></a></div>',
  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Never attempt to reduce a strangulated hernia — Maydl's is why", html:"Constant (not colicky) severe pain · tense, tender, irreducible · overlying skin erythema · fever or toxicity → 999, with no attempt at reduction. The reason is the Maydl's configuration: the strangulated loop can lie INSIDE the abdomen rather than in the sac, so forcing the hernia back delivers necrotic bowel into the peritoneal cavity and the lump disappears — producing false reassurance while the patient develops faecal peritonitis. Ischaemia begins within 4–6 hours and mortality climbs sharply after 6 hours."},
    {tone:"red", h:"Femoral hernias strangulate — repair them urgently, symptoms or not", html:"Roughly 22% are strangulated at first presentation, against about 3% for inguinal, because the femoral ring is narrow and rigid, bounded by the inguinal and Cooper's ligaments and the femoral vein. Commonest in older women (female:male about 2:1) and frequently mistaken for a lymph node. Every femoral hernia gets an urgent surgical referral — watchful waiting does not apply to them at any age or level of symptoms."},
    {tone:"blue", h:"The pubic tubercle decides which hernia it is", html:"Inguinal: above and medial to the pubic tubercle. Femoral: below and lateral. Find the tubercle by tracing the medial attachment of the inguinal ligament laterally from the symphysis — it sits about 1 cm off the midline. This is not an academic distinction: it is the difference between an urgent referral and a legitimate conversation about waiting. Examine standing (to demonstrate) and lying (for reducibility)."},
    {tone:"green", h:"Watchful waiting is evidence-based — in adults", html:"HerniaSurge supports watchful waiting for asymptomatic or minimally symptomatic inguinal hernia in men, provided they are informed of the risks and can access emergency care. The Fitzgibbons (JAMA 2006) and O'Dwyer trials found about 72% had no deterioration at 2 years, with acute hernia emergencies at roughly 1.8 per 1000 patient-years — very low but not zero. Most eventually cross over to surgery as symptoms increase, so frame it as deferral rather than avoidance."},
    {tone:"amber", h:"⛔ No watchful waiting in children", html:"<b>All paediatric inguinal hernias are repaired promptly after diagnosis.</b> Incarceration risk is roughly 12–17% in infants under 1 year and around 30% in premature infants — the neck is proportionally tighter and an infant cannot report early incarceration. Refer a groin swelling in a child under 1 to paediatric surgery within 24–48 hours, not to a routine clinic. Umbilical hernias in children are the opposite: most close by age 5."},
    {tone:"blue", h:"The MHRA mesh warning does not apply to inguinal mesh", html:"The 2018 MHRA alert concerns PELVIC mesh — transvaginal mesh for prolapse and stress incontinence, where erosion into vagina, bladder and bowel occurred. Inguinal hernia mesh sits in an extraperitoneal plane away from any mucosal surface, with 30 years of established use. Say this explicitly: patients arrive having read the media coverage, and the numbers favour mesh decisively — recurrence 1–3% with mesh against 10–15% for suture repair."}
  ],
  pathwaySub:"Five steps. The first two take under a minute and settle the urgency.",
  pathway:[
    {title:"Exclude strangulation and obstruction", html:"Constant severe pain, tense and irreducible, erythema, fever → 999, nil by mouth, IV access, analgesia, and NO reduction attempt. Colicky pain with vomiting, distension and absolute constipation → obstructed hernia, also 999.", alert:true},
    {title:"Locate it against the pubic tubercle", html:"<b>Above and medial = inguinal. Below and lateral = femoral.</b> Examine standing and lying; test the cough impulse; check whether you can get above a scrotal swelling. <b>Mostly a clinical diagnosis</b> — imaging is for uncertainty, not routine."},
    {title:"Decide the urgency from the type", html:"Any femoral hernia → urgent. Any paediatric inguinal hernia → prompt, and under 1 year within 24–48 hours. Paraumbilical and epigastric → repair (strangulation risk). Symptomatic inguinal → elective repair. Asymptomatic inguinal in an adult → watchful waiting is reasonable."},
    {title:"Optimise before any elective repair", html:"Weight, smoking cessation, and the pressure sources — chronic cough, constipation and prostatism. <b>These are also what prevent recurrence afterwards</b>, so they are worth addressing rather than listing."},
    {title:"Safety-net in words, and follow up after repair", html:"\"If it becomes painful, won't go back in, or the skin goes red — A&amp;E, not the surgery.\" Then wound check at 7–10 days, chronic pain assessed at 6–8 weeks, and recurrence considered at any new bulge."}
  ],
  sections:[

    {id:"safety", nav:"Red flags", title:"The emergency — and the one manoeuvre never to perform",
     blocks:[
       {b:"table", head:["Presentation","Meaning","Action"], rows:[
         ["Irreducible, tense, tender hernia · severe CONSTANT pain not relieved by lying · overlying skin erythema · fever or vomiting","<b>Strangulation</b> — arterial occlusion at the neck with bowel ischaemia. Erythema of the overlying skin implies necrotic bowel within","<b>999, emergency surgery within hours.</b> IV access, nil by mouth, fluids, analgesia, antiemetic; antibiotics per local protocol. <b>NO attempt at reduction</b>"],
         ["Colicky abdominal pain · bilious vomiting · distension · absolute constipation, with an irreducible hernia","<b>Obstructed hernia</b> — bowel trapped and mechanically obstructed; may still be reducible","<b>999.</b> AXR and CT abdomen; emergency surgery if complete obstruction is confirmed"],
         ["Large irreducible femoral hernia in an older woman with vomiting and colicky pain","<b>Femoral hernias incarcerate and strangulate faster</b> than inguinal — the ring is narrow and rigid","<b>999. Do not attempt manual reduction before surgical assessment</b>"],
         ["Scrotal swelling in an infant under 1, cannot get above it, bowel sounds in the scrotum","<b>Infant inguinal hernia with high incarceration risk</b>","<b>Same-day paediatric surgical referral</b>"],
         ["Sudden increase in size with new pain, a previously reducible hernia now irreducible, fever","<b>Acute incarceration</b>","<b>Same-day surgical assessment — not an elective appointment</b>"],
         ["Sudden severe central abdominal pain with peritonism, a previous repair scar and an irreducible midline bulge","<b>Perforated viscus through a mesh defect or recurrent incisional hernia</b>","<b>999</b>"],
         ["Acute severe scrotal pain, high-riding testis, absent cremasteric reflex","<b>Testicular torsion</b> — can mimic an incarcerated inguinoscrotal hernia, and pain is sometimes referred to the groin","<b>999 / immediate urology. Viability falls steeply after 6 hours</b>"]
       ]},
       {b:"why", html:"Obstruction and strangulation are separated by the CHARACTER of the pain, not its severity. In obstruction the pain is colicky and the hernia may still reduce; in strangulation it is constant and unremitting, the lump is tense and tender rather than soft and compressible, the overlying skin reddens, and systemic features signal sepsis from transmural necrosis. The progression is venous occlusion first — which is why the hernia visibly enlarges — then arterial occlusion, ischaemia, necrosis, perforation and faecal peritonitis."},
       {b:"warn", html:"<b>The absolute rule, and the reason behind it.</b> Taxis — gentle sustained manual reduction — belongs in hospital, under surgical supervision, with analgesia or sedation. Never in primary care without surgical backup, and NEVER on a suspected strangulation. In a Maydl's hernia the strangulated loop lies inside the abdominal cavity rather than in the sac: reduce it and the lump vanishes, the patient and clinician are falsely reassured, and dead bowel perforates internally. Hard, tense, constantly painful, red or febrile means 999 with your hands off."}
     ]},

    {id:"classify", nav:"Classify", title:"Classification — and why the landmark matters more than the name",
     blocks:[
       {b:"table", head:["Type","Features","Management implication"], rows:[
         ["<b>Inguinal — about 75% of abdominal wall hernias</b>","Male:female roughly 8:1. <b>Above and medial to the pubic tubercle.</b> <b>Indirect</b>: through the deep ring along the canal, potentially to the scrotum, congenital (patent processus vaginalis), any age. <b>Direct</b>: through Hesselbach's triangle, acquired, usually middle-aged or older men","The direct/indirect distinction is far less clinically reliable than traditionally taught and is usually confirmed intraoperatively — it does not change primary-care management. Symptomatic → elective repair; asymptomatic → watchful waiting is reasonable"],
         ["<b>Femoral — 5–8% of groin hernias</b>","<b>Below and lateral to the pubic tubercle.</b> Female predominance about 2:1. Cough impulse often weak or absent; frequently hard and tender. <b>Commonly misdiagnosed as a lymph node</b>","Urgent surgical referral in every case, symptomatic or not — about 22% strangulation at presentation. Never watch and wait"],
         ["<b>Umbilical</b>","Through the umbilicus itself. Adults: acquired — obesity, ascites, pregnancy. Children: usually closes by age 5","Children: observe, repair if persisting beyond 5 years or the defect exceeds 1.5 cm. Adults: repair if symptomatic or enlarging"],
         ["<b>Paraumbilical</b>","Just above or below the umbilicus, not through it. Adults, typically overweight","<b>Repair recommended — genuine strangulation risk</b>, unlike the childhood umbilical hernia it is often confused with"],
         ["<b>Incisional</b>","Through a previous surgical scar. Risk factors: obesity, wound infection, haematoma, poor healing","Repair timing balances symptoms against operative risk. <b>Ten-fold higher incidence after abdominal surgery in obesity</b>"],
         ["<b>Epigastric</b>","Fat, sometimes bowel, through the linea alba between xiphoid and umbilicus","Repair if symptomatic — strangulation risk warrants urgent referral"],
         ["<b>Spigelian</b>","Rare; at the lateral edge of the rectus sheath. Often occult and painful","Frequently missed — consider it in unexplained lateral abdominal wall pain and image"]
       ]},
       {b:"dl", rows:[
         ["<b>History</b>","Site · duration · reducibility (spontaneously on lying, or with gentle pressure?) · precipitants (lifting, coughing, Valsalva, pregnancy). Pain pattern is the safety question: on exertion is typical, at rest suggests incarceration, constant and severe means strangulation. Obstruction symptoms. Previous repairs. Risk factors — obesity, chronic cough or COPD, constipation, prostatism, heavy lifting, ascites, connective tissue disorder. <b>Occupation, because it determines the fit note after repair</b>"],
         ["<b>Examination</b>","<b>Standing to demonstrate, lying to test reducibility.</b> Visible bulge at rest or on coughing; site relative to the pubic tubercle; consistency and tenderness; <b>transillumination (hydrocele, not hernia)</b>; bowel sounds in the swelling; <b>cough impulse — a palpable expansile impulse confirms a hernia</b>. Can you get above a scrotal swelling? If not, it connects to the canal and is a hernia. Examine both sides. Consider DRE — a large prostate drives the straining"],
         ["<b>Investigations — for uncertainty, not routine</b>","<b>Diagnosis is mostly clinical.</b> <b>USS groin is first-line where there is doubt</b> (sensitivity about 85–90%, specificity about 82–88% when performed dynamically with straining); it also separates hernia from lymphadenopathy, hydrocele, cord lipoma and saphena varix. <b>Operator-dependent, and less sensitive for femoral hernia in obesity.</b> <b>CT</b> for complex, recurrent or incisional hernias and preoperative planning. <b>MRI is the most sensitive for occult inguinal hernia</b> — the test when USS is negative but suspicion remains. <b>AXR and erect CXR if obstruction or perforation is suspected</b>"]
       ]}
     ]},

    {id:"differential", nav:"Differential", title:"The groin or scrotal lump that is not a hernia",
     blocks:[
       {b:"table", head:["Diagnosis","Distinguishing features"], rows:[
         ["<b>Inguinal lymphadenopathy</b>","<b>No cough impulse, firm or rubbery, discrete nodes, not reducible.</b> Causes: infection (cellulitis, STI, tinea pedis) or malignancy — <b>lymphoma, metastatic melanoma, SCC of vulva, penis or lower limb</b>. <b>The commonest thing a femoral hernia is mistaken for, and vice versa</b>"],
         ["<b>Femoral artery aneurysm</b>","<b>Pulsatile and expansile</b>, firm, no cough impulse"],
         ["<b>Hydrocele</b>","<b>Transilluminates, fluctuant, you CAN get above it</b>, no cough impulse"],
         ["<b>Saphena varix</b>","<b>Soft and compressible, empties on lying down</b>, fluid thrill from the saphenofemoral junction on coughing"],
         ["<b>Testicular torsion</b>","<b>EMERGENCY and a genuine mimic</b> — acute severe pain often waking from sleep, nausea and vomiting, high-riding testis, absent cremasteric reflex, not relieved by elevation. Pain is sometimes referred to the groin and read as incarceration"],
         ["<b>Testicular tumour</b>","<b>Painless hard mass within the testis</b> — a suspected-cancer referral, not a hernia pathway"],
         ["<b>Epididymo-orchitis</b>","Tender, warm, systemically unwell; gradual onset"],
         ["<b>Occult inguinal hernia</b>","<b>Clinically absent but symptomatic</b> — exertional groin pain, pain on Valsalva, deep tenderness. Dynamic USS or MRI confirms"],
         ["<b>Athletic pubalgia (\"sports hernia\")</b>","<b>Not a true hernia</b> — posterior inguinal wall weakness with adductor-related groin pain in athletes, often bilateral. MRI including pelvis, hip and adductors; physiotherapy or laparoscopic posterior wall reinforcement"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"red", h:"⚠ The torsion trap", html:"An adolescent or young man with acute scrotal pain and swelling is a torsion until excluded, even when the story sounds like a hernia that has become stuck. Check the lie of the testis and the cremasteric reflex before anything else — viability falls steeply beyond 6 hours, and a wasted hour spent arranging a surgical hernia opinion is a lost testis."},
         {tone:"amber", h:"⚠ The lymph node that is a femoral hernia", html:"A firm, slightly tender lump below the inguinal ligament in an older woman is a femoral hernia far more often than clinicians expect. If there is any doubt, image it or refer it — do not label it reactive lymphadenopathy and review in six weeks."},
         {tone:"blue", h:"🔍 Get above it", html:"The single most useful scrotal test: if you cannot place your fingers above the swelling, it is connected to the inguinal canal and is a hernia. If you can, it is scrotal in origin — hydrocele, epididymal cyst or testicular."},
         {tone:"green", h:"✓ Bilateral examination, always", html:"<b>Contralateral hernias are common and frequently asymptomatic.</b> Finding one changes the operation — <b>HerniaSurge recommends laparoscopic repair for bilateral hernias</b>, so it is worth knowing before referral."}
       ]}
     ]},

    {id:"manage", nav:"Manage", title:"Repair, watchful waiting, and the truss",
     blocks:[
       {b:"table", head:["Option","Detail","Notes"], rows:[
         ["<b>Open repair — Lichtenstein tension-free mesh</b>","The gold-standard open technique: polypropylene mesh reinforcing the posterior wall. Local or general anaesthesia, day case. <b>Recurrence about 1–3%</b>","Complications: chronic groin pain (about 10–15% mild, 1–3% severe — the most significant long-term complication), mesh infection under 1%, seroma, haematoma, recurrence"],
         ["<b>Laparoscopic repair — TEP or TAPP</b>","HerniaSurge recommends laparoscopic repair for BILATERAL and RECURRENT hernias; also where rapid return to work matters. Recurrence equivalent at about 2–3%","Smaller incisions, less postoperative pain, faster recovery; requires general anaesthesia. A recurrence is usually repaired by the opposite approach to the original, to avoid scarred tissue planes"],
         ["<b>Femoral hernia repair</b>","Lockwood (low) or McVay open approach; laparoscopic TEP/TAPP gives excellent exposure of the femoral ring and allows simultaneous assessment for a concurrent inguinal hernia, which is common","Emergency repair includes assessment of bowel viability — resection with primary anastomosis, or a stoma in a contaminated field"],
         ["<b>Non-mesh (Shouldice) repair</b>","<b>Recurrence 8–10%</b> — reserved for mesh infection risk, patient preference, or recurrence after previous mesh","<b>Biologic resorbable mesh is used in contaminated fields</b> such as bowel perforation or infected repair"],
         ["<b>Watchful waiting</b>","Appropriate for a truly asymptomatic or minimally symptomatic, fully reducible inguinal hernia in an adult with no incarceration history — particularly where anaesthetic risk is high","Review annually: any new pain, irreducibility or systemic feature converts it to a surgical referral. NOT appropriate for femoral or paraumbilical hernias, symptomatic hernias, any hernia with an incarceration history, or any child"],
         ["<b>Truss</b>","Does not repair anything; may reduce discomfort and protrusion in someone unfit for or declining surgery. Measured from symphysis pubis to ASIS and fitted by an orthotist or specialist nurse. <b>Applied lying down with the hernia reduced, before standing</b>","<b>Never over an irreducible hernia.</b> Watch for pressure sores. The patient must understand that a truss does not prevent incarceration — if the hernia becomes painful or irreducible, A&amp;E"],
         ["<b>Preoperative optimisation</b>","Weight, smoking cessation, and the pressure sources: chronic cough, constipation, prostatism","Weight loss before elective repair reduces wound infection — the leading cause of mesh infection and repair failure — plus haematoma and pulmonary complications. See <a href='obesity.html'>obesity</a>, <a href='smoking-cessation.html'>smoking cessation</a>, <a href='copd.html'>COPD</a>, <a href='male-luts.html'>male LUTS</a>, <a href='../algorithms/constipation.html'>constipation</a>"]
       ]},
       {b:"why", html:"The watchful waiting question was settled by two randomised trials, and the numbers are worth carrying. Fitzgibbons (JAMA 2006) and O'Dwyer (UK, 2006) randomised men with minimally symptomatic inguinal hernias to watchful waiting or immediate repair: about 72% of the watchful waiting group had no deterioration at 2 years, acute emergencies occurred at roughly 1.8 per 1000 patient-years, and quality of life was equivalent. But most patients eventually crossed over to surgery as symptoms increased — so the honest framing is that waiting is safe and often temporary, not that repair is being avoided. None of this transfers to femoral hernias or to children, where the strangulation arithmetic is completely different."}
     ]},

    {id:"aftercare", nav:"Aftercare", title:"After repair — recovery, chronic pain and recurrence",
     blocks:[
       {b:"dl", rows:[
         ["<b>Return to work and activity — what patients actually ask</b>","Desk work about 1 week · light manual 2–3 weeks · heavy manual or gym 4–6 weeks (4 weeks after laparoscopic). Driving when an emergency stop can be performed without pain, usually 1–2 weeks. Swimming at 2 weeks once healed; cycling 3–4 weeks; running 3–4 weeks laparoscopic, 4–6 weeks open; contact sports 6 weeks; sex when comfortable, usually 1–3 weeks. For manual workers a fit note specifying \"no lifting over 10 kg\" for 4–6 weeks is more useful than time off"],
         ["<b>Wound care</b>","Keep dry 24–48 hours, then shower and pat dry. Wound check at 7–10 days. Sutures are usually absorbable. Increasing redness, warmth, swelling, purulent discharge or fever → same-day review"],
         ["<b>Haematoma, seroma and scrotal oedema</b>","A soft swelling at the repair site is common and alarming to patients but usually resolves over 6–12 weeks without intervention; ice and reassurance, surgical advice if tense, enlarging or infected. Scrotal oedema after inguinal repair is expected from lymphatic disruption — support, ice, elevation; resolves in 1–4 weeks"],
         ["<b>Chronic post-repair groin pain</b>","About 10–15% mild and 1–3% severe. Mechanism: injury to or entrapment of the ilioinguinal, iliohypogastric or genital branch of the genitofemoral nerve. Risk factors: open repair, younger age, and pre-operative pain — the strongest predictor. Ladder: simple analgesia → neuropathic agents (amitriptyline, gabapentin, pregabalin) → targeted nerve block → neurectomy at a specialist hernia centre. This is a genuine neuropathic complication, not psychosomatic, and warrants specialist review — see <a href='neuropathic-pain.html'>neuropathic pain</a> and <a href='chronic-pain.html'>chronic pain</a>"],
         ["<b>Recurrence</b>","Open Lichtenstein 1–3% · laparoscopic 2–3% · suture repair without mesh 10–15%. Presents as a bulge returning at the same site, weeks to years later. Examine as for the original; USS to confirm; re-refer for planned repair"],
         ["<b>Reducing recurrence</b>","The same four things that cause hernias: weight, chronic cough, constipation and straining, and lifting technique. Chronic straining generates Valsalva pressures of 40–90 mmHg against a resting intra-abdominal pressure of 5–7 mmHg — which is why constipation is worth treating properly (fibre around 30 g/day, fluids, macrogol if needed, and a footstool to change toilet posture). <b>An ACE-inhibitor cough is a reversible cause — switch to an ARB</b>"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 A&amp;E — say it plainly", html:"\"If the lump becomes painful, won't push back in, or the skin over it goes red or hot — or you start vomiting or get bad tummy pain — go straight to A&amp;E. Don't ring the surgery first.\" Give this to everyone with a hernia, repaired or not."},
         {tone:"amber", h:"🟠 Same-day surgical assessment", html:"A previously reducible hernia that has become irreducible but is not yet tender or systemically unwell · sudden enlargement with new pain · rapidly enlarging hernia."},
         {tone:"blue", h:"📋 Post-repair review points", html:"Wound at 7–10 days · scrotal oedema at 4 weeks if inguinoscrotal · chronic pain assessed at 6–8 weeks · fit note and occupational restriction documented."},
         {tone:"green", h:"👶 For parents", html:"\"Bring your child to A&amp;E immediately if the lump becomes hard, they are inconsolable, or they start vomiting.\" Umbilical hernias in children almost always close by themselves by age 5 — inguinal ones always need an operation."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999 / emergency", html:"Strangulation (constant pain, erythema, fever) · obstruction (colicky pain, vomiting, distension) · perforation · any hernia with cardiovascular compromise · suspected testicular torsion."},
         {tone:"amber", h:"Same-day surgical assessment", html:"Newly irreducible hernia · ALL femoral hernias · suspected incarceration without systemic features · any infant with an irreducible inguinoscrotal hernia."},
         {tone:"amber", h:"Urgent surgical referral", html:"Symptomatic inguinal hernia with significant pain or functional limitation · recurrent incarceration episodes · epigastric or paraumbilical hernia (strangulation risk) · any paediatric inguinal hernia — under 1 year within 24–48 hours."},
         {tone:"blue", h:"Routine surgical referral", html:"Symptomatic reducible inguinal, umbilical or incisional hernia for elective repair · asymptomatic inguinal hernia in a young or fit patient, where symptoms tend to progress and the strangulation risk persists. Flag bilateral or recurrent hernias in the letter — HerniaSurge directs those to laparoscopic repair."},
         {tone:"blue", h:"Specialist hernia clinic", html:"Chronic post-repair groin pain unresponsive to neuropathic agents, for nerve block or neurectomy · complex recurrent or incisional hernia · patients with mesh concerns who want a surgical discussion before consenting."},
         {tone:"purple", h:"Suspected cancer — the routes that run through a groin lump", html:"Hernia itself has no NICE NG12 criterion, and none should be invented. But two NG12 routes run through the differential of a groin or scrotal swelling and must not be missed while a hernia is assumed: a non-painful enlargement or change in shape or texture of the testis → urgent direct-access ultrasound for suspected testicular cancer, and unexplained lymphadenopathy → consider very urgent investigation or referral for lymphoma, with FBC and blood film. Persistent inguinal lymphadenopathy with no infective cause is not a hernia and is not reactive by default."},
         {tone:"cream", h:"GP management", html:"Primary care does the diagnosis and the triage, the watchful-waiting conversation and its annual review, the truss discussion, preoperative optimisation, the wound check, chronic-pain assessment, recurrence detection, and the safety-net that actually prevents the emergency. Related pages: <a href='obesity.html'>obesity</a> · <a href='smoking-cessation.html'>smoking cessation</a> · <a href='copd.html'>COPD</a> · <a href='male-luts.html'>male LUTS</a> · <a href='../algorithms/constipation.html'>constipation pathway</a> · <a href='neuropathic-pain.html'>neuropathic pain</a> · <a href='chronic-pain.html'>chronic pain</a>."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A <b>71-year-old woman</b> attends with a <b>small lump in the right groin</b> noticed three weeks ago. It is <b>mildly tender, firm, and she cannot push it back</b>, but she is otherwise well — eating normally, bowels open, no vomiting. She has a chronic cough on <b>ramipril</b>, a BMI of 32, and assumed the lump was \"a gland\". She is <b>anxious about mesh</b> after a television programme, asks whether she can \"just leave it\", and is due to fly abroad in ten days."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Locates the lump against the pubic tubercle and identifies it as FEMORAL — below and lateral, rather than accepting \"a gland\"; recognises that a femoral hernia in an older woman carries about 22% strangulation risk and needs URGENT surgical referral even though she is well, and explicitly rejects watchful waiting for it; <b>does not attempt to reduce an irreducible tender hernia</b>; gives the strangulation safety-net verbally — A&amp;E, not the surgery — and documents it, addressing the imminent flight directly; corrects the mesh misconception accurately: the MHRA alert concerns transvaginal pelvic mesh, not inguinal or femoral hernia mesh, and gives the recurrence figures rather than dismissing the concern; identifies the ACE-inhibitor cough as a reversible driver and switches ramipril to an ARB; addresses <b>weight before elective surgery</b> without making it a condition of referral; considers the differential she raised — a firm groin node — and says why the landmark settles it; and <b>offers to arrange a surgical discussion before she consents</b>, rather than arguing about mesh in the room."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>HerniaSurge international guidelines — groin hernia (2018)</b><span class="rd"> — the primary-care assessment, the pubic tubercle landmark, the groin-lump differential, referral thresholds and truss practicalities</span></li>'+
         '<li><b>Fitzgibbons et al, JAMA 2006, and O\u2019Dwyer et al, 2006</b><span class="rd"> — the two randomised trials of watchful waiting versus immediate repair: about 72% without deterioration at 2 years, acute emergencies around 1.8 per 1000 patient-years, equivalent quality of life, and substantial crossover to surgery over time</span></li>'+
         '<li><b>BAPS — British Association of Paediatric Surgeons hernia guidance</b><span class="rd"> — prompt repair of all paediatric inguinal hernias, incarceration risk of roughly 12\u201317% under 1 year and about 30% in premature infants, and repair before neonatal discharge where clinically stable</span></li>'+
         '<li><b>MHRA — mesh safety alert (2018)</b><span class="rd"> — the alert applies to transvaginal PELVIC mesh for prolapse and stress urinary incontinence; it does not apply to polypropylene inguinal hernia mesh, which sits in an extraperitoneal plane</span></li>'+
         '<li><b>NICE NG125 — Surgical site infections (2019)</b><br><a href="https://www.nice.org.uk/guidance/ng125" rel="noopener">nice.org.uk/guidance/ng125</a><span class="rd"> — wound care and infection recognition after repair</span></li>'+
         '<li><b>British Hernia Society — repair standards</b><span class="rd"> — recurrence rates by technique (Lichtenstein 1\u20133%, laparoscopic 2\u20133%, suture-only 8\u201315%) and chronic post-repair pain rates with their mechanism and management ladder</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (May 2025)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — the testicular ultrasound route for a non-painful enlargement or change in the testis, and the unexplained-lymphadenopathy route; hernia itself carries no NG12 criterion</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Hernia — HerniaSurge, HerniaSurge, BAPS paediatric guidance and NICE NG12. Constant pain, tense and irreducible, erythema or fever means 999 with no attempt at reduction — a Maydl's loop can strangulate inside the abdomen. The pubic tubercle decides the urgency: above and medial is inguinal, below and lateral is femoral, and every femoral hernia is referred urgently whether or not it hurts. Watchful waiting is evidence-based for asymptomatic inguinal hernia in adults and never applies to children. The MHRA mesh alert concerns pelvic mesh, not inguinal mesh. Verify all doses against the BNF before prescribing."
