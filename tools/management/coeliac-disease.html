MG.render({
  icon:"🌾",
  title:"Coeliac disease — the complete guide",
  eyebrow:"Protocol · NICE NG20 · test on gluten, or not at all",
  stemTitle:"The classic error is starting a gluten-free diet before testing — it normalises both serology and histology and makes a secure diagnosis impossible, sometimes for months",
  stemSub:"One page for the whole condition. Know who to test and test correctly: tTG-IgA with total IgA, while the patient is still eating gluten — in more than one meal a day for at least 6 weeks. Confirm with duodenal biopsy in adults and young people aged 16 and over. Then the treatment is a <b>lifelong gluten-free diet with dietitian support</b>, plus the three things coeliac adds that are easy to forget: deficiency replacement, risk-based bone assessment, and vaccination for functional hyposplenism following the current Green Book (pneumococcal where indicated) \u2014 and case-finding in first-degree relatives.",
  guideline:"NICE NG20 \u00b7 UKHSA Green Book",
  reviewed:"14 September 2026",
  nextReview:"14 March 2027",
  meta:[
    {t:"NICE NG20 — coeliac disease recognition and assessment"},
    {t:"Gluten in >1 meal/day for ≥6 weeks BEFORE testing", tone:"tw"},
    {t:"Functional hyposplenism \u2192 vaccinate per Green Book", tone:"tw"},
    {t:"v2.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#test"><b>Test</b><small>On gluten</small></a><a href="#complications"><b>Associations</b><small>Bone · spleen</small></a><a href="#diet"><b>Diet</b><small>Lifelong</small></a><a href="#wider"><b>Wider care</b><small>Family · labels</small></a><a href="#monitor"><b>Annual</b><small>Review \u00b7 risk-based tests</small></a></div>',
  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Do NOT start a gluten-free diet before the diagnosis is confirmed", html:"Going gluten-free normalises serology and histology, so it prevents a secure diagnosis. The patient must be eating gluten in more than one meal a day for at least 6 weeks before testing. If the patient has already reduced or excluded gluten, do not simply arrange a negative blood test: refer to gastroenterology for advice on whether a supervised gluten challenge is appropriate, and explain that reintroducing gluten may provoke significant symptoms and that diagnostic certainty may be difficult without adequate gluten exposure \u2014 which is why the sequence matters more than the speed."},
    {tone:"blue", h:"The right test is tTG-IgA WITH total IgA", html:"<b>Total IgA plus IgA tissue transglutaminase (tTG-IgA).</b> The total IgA is not optional — in IgA deficiency the tTG-IgA is falsely negative, and you need IgG-based testing (IgG tTG, IgG DGP or IgG EMA) instead (NICE NG20). Positive serology in adults and young people aged 16 and over \u2192 refer to gastroenterology for duodenal biopsy to confirm villous atrophy; continue gluten until the diagnosis is confirmed. Negative serology but high suspicion \u2192 refer to gastroenterology rather than closing the diagnosis. HLA-DQ2/DQ8 is not an initial primary-care test."},
    {tone:"amber", h:"Who to test — wider than the classic presentation", html:"Persistent GI symptoms (diarrhoea, bloating, abdominal pain) \u00b7 prolonged fatigue \u00b7 unexplained iron, B12 or folate deficiency \u00b7 severe or persistent mouth ulcers \u00b7 faltering growth \u00b7 unexplained weight loss \u00b7 type 1 diabetes \u00b7 autoimmune thyroid disease \u00b7 IBS-type symptoms \u00b7 dermatitis herpetiformis \u00b7 metabolic bone disorder or reduced bone mineral density \u00b7 unexplained neurological symptoms (particularly peripheral neuropathy or ataxia) \u00b7 persistently raised liver enzymes of unknown cause \u00b7 dental enamel defects \u00b7 Down syndrome \u00b7 Turner syndrome \u00b7 a first-degree relative with coeliac disease. Unexplained iron deficiency and \"IBS\" are the two that most often hide it."},
    {tone:"green", h:"The diet is the treatment, and the dietitian makes it work", html:"A strict lifelong gluten-free diet \u2014 excluding wheat, barley and rye, with oats only if tolerated and labelled gluten-free on dietitian advice \u2014 resolves symptoms and reduces complications. <b>Refer everyone newly diagnosed to a dietitian</b> for education, label-reading, cross-contamination avoidance and nutritional adequacy. <b>There is no drug substitute: adherence IS the treatment.</b> Signpost Coeliac UK."},
    {tone:"red", h:"\u26a0 Functional hyposplenism \u2014 vaccinate per the Green Book", html:"Assess for functional hyposplenism and follow the current Green Book/local immunisation guidance. Offer pneumococcal vaccination where indicated (NICE NG20). Consider additional vaccines, including influenza, Hib and MenACWY, according to the degree of hyposplenism and national eligibility criteria \u2014 not every patient automatically needs every asplenia vaccine and a pneumococcal booster. <b>This is the element most often missed entirely</b>, because nothing about the consultation prompts it unless you know to look."},
    {tone:"amber", h:"Malabsorption has consequences to check for", html:"Iron, B12, folate and vitamin D deficiency \u2014 check and replace at diagnosis, then individualise further testing. Low bone density from malabsorption \u2014 assess the need for DEXA or active bone treatment by risk, not for everyone. Persistent symptoms despite a gluten-free diet need structured reassessment, and weight loss, an abdominal mass, persistent unexplained abdominal pain, GI bleeding, anaemia, systemic symptoms or rapidly worsening symptoms need urgent specialist reassessment under the relevant GI pathway."}
  ],
  pathwaySub:"Five steps, and getting the first one in the wrong order costs months.",
  pathway:[
    {title:"Identify who to test — and test on gluten", html:"tTG-IgA with total IgA, while eating gluten in more than one meal a day for at least 6 weeks. <b>Do NOT start a gluten-free diet first.</b> Already gluten-free \u2192 gastroenterology advice on a supervised challenge.", alert:true},
    {title:"Confirm the diagnosis", html:"<b>Positive serology at 16 and over \u2192 gastroenterology for duodenal biopsy; keep eating gluten until confirmed.</b> Negative serology with high suspicion \u2192 gastroenterology."},
    {title:"Start the lifelong gluten-free diet with a dietitian", html:"Exclude wheat, barley and rye; oats only if tolerated and labelled gluten-free; education, labels and cross-contamination."},
    {title:"Correct the deficiencies and protect bone and spleen", html:"Iron, B12, folate, vitamin D and calcium as indicated; DEXA by risk; vaccination for hyposplenism per the current Green Book."},
    {title:"Annual review, and test the relatives", html:"Symptoms, weight and nutrition, adherence, dietitian input, blood tests as indicated, bone-health risk, vaccination status, growth in children \u2014 and offer testing to first-degree relatives."}
  ],
  sections:[

    {id:"test", nav:"Test", title:"Step 1 — who to test, and testing correctly",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>Who to test</b>","Persistent GI symptoms (diarrhoea, bloating, abdominal pain), prolonged fatigue, unexplained iron, B12 or folate deficiency, severe or persistent mouth ulcers, faltering growth, unexplained weight loss, type 1 diabetes, autoimmune thyroid disease, IBS-type symptoms, dermatitis herpetiformis, metabolic bone disorder or reduced bone mineral density, unexplained neurological symptoms (particularly peripheral neuropathy or ataxia), persistently raised liver enzymes of unknown cause, dental enamel defects, Down syndrome, Turner syndrome, or a first-degree relative"],
         ["<b>Test</b>","Total IgA PLUS IgA tissue transglutaminase (tTG-IgA); a low total IgA should trigger the laboratory's IgG-based testing pathway (IgG tTG, IgG DGP or IgG EMA). HLA-DQ2/DQ8 testing is not an initial primary-care diagnostic test"],
         ["<b>CRUCIAL</b>","The patient must be eating gluten — in more than one meal a day for at least 6 weeks before testing. Do NOT start a gluten-free diet before the diagnosis is confirmed"],
         ["<b>Already gluten-free</b>","If the patient has already excluded gluten, refer to gastroenterology for advice about reintroduction or a supervised gluten challenge \u2014 the amount and duration are set with specialist input, particularly with severe symptoms, pregnancy, significant malabsorption or previous severe reactions. Do not rely on a negative test obtained while gluten-free"],
         ["<b>Diagnosis</b>","Positive serology in adults and young people aged 16 and over \u2192 refer to gastroenterology for duodenal biopsy (villous atrophy) to confirm; serology alone is not normally sufficient. Continue gluten until the diagnosis is confirmed \u2014 a positive tTG should not lead to a gluten-free diet before specialist confirmation"],
         ["<b>Negative serology, high suspicion</b>","Refer to gastroenterology rather than simply closing the diagnosis"]
       ]},
       {b:"why", html:"The classic error is starting a gluten-free diet before testing — this normalises serology and histology and prevents a secure diagnosis. Test on gluten, confirm with biopsy, then commit to lifelong dietary change. <b>The order is the whole of it</b>: a patient who has been gluten-free for three months before their blood test needs gastroenterology advice on whether a supervised gluten challenge is appropriate before a diagnosis can be made."}
     ]},

    {id:"complications", nav:"Associations", title:"Associations and complications",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"🦴 Osteoporosis", html:"Malabsorption can lead to low bone density \u2014 assess the need for DEXA or active bone treatment during follow-up, by risk rather than for everyone."},
         {tone:"amber", h:"🩸 Anaemia and deficiency", html:"<b>Iron, B12, folate and vitamin D deficiency — check and replace.</b>"},
         {tone:"red", h:"🛡️ Hyposplenism", html:"Assess for functional hyposplenism; offer pneumococcal vaccination where indicated, and consider influenza, Hib and MenACWY according to the degree of hyposplenism and current Green Book eligibility."},
         {tone:"red", h:"🔴 Refractory or alarm features", html:"Persistent symptoms despite a gluten-free diet require structured reassessment rather than immediate labelling as refractory coeliac disease: check the original diagnosis, review gluten exposure with a specialist dietitian, and consider IBS, lactose intolerance, bacterial overgrowth, microscopic colitis, inflammatory bowel disease and other causes. Refer suspected refractory coeliac disease to a specialist centre. Weight loss, abdominal mass, persistent unexplained abdominal pain, GI bleeding, anaemia, systemic symptoms or rapidly worsening symptoms \u2192 urgent specialist reassessment under the relevant GI pathway (rare enteropathy-associated T-cell lymphoma and small-bowel cancer)."}
       ]}
     ]},

    {id:"diet", nav:"Diet", title:"Treatment — the lifelong gluten-free diet",
     blocks:[
       {b:"table", head:["Step","When","Detail"], rows:[
         ["<b>Cornerstone — strict gluten-free diet for life</b>","<b>All patients</b>","Exclude wheat, barley and rye; oats only if tolerated and labelled gluten-free, according to dietitian advice. Refer to a specialist dietitian for education, food labelling, avoiding cross-contamination (a major cause of persistent symptoms), nutritional adequacy (gluten-free products can be nutritionally poor or high in fat and sugar), practical adherence and locally available prescribed or subsidised gluten-free products. <b>Adherence resolves symptoms and reduces complications</b>"],
         ["<b>Baseline bloods and deficiencies</b>","<b>At diagnosis</b>","FBC; ferritin/iron studies; B12 and folate; calcium, albumin, ALP and vitamin D; liver tests; thyroid function where indicated. Replace deficiencies; individualise subsequent testing"],
         ["<b>Protect bone and spleen</b>","<b>Ongoing — complication prevention</b>","Assess bone health (DEXA by risk); assess for hyposplenism and vaccinate per the current Green Book \u2014 pneumococcal where indicated"],
         ["<b>Dermatitis herpetiformis</b>","<b>The skin variant</b>","Itchy vesicular rash on extensor surfaces. Suspected dermatitis herpetiformis warrants dermatology referral for confirmation, usually involving skin biopsy and direct immunofluorescence. A gluten-free diet is the long-term treatment; dapsone may be used by dermatology for symptom control while the diet takes effect \u2014 not a routine primary-care treatment (specialist initiation and monitoring, including G6PD status and haematological toxicity)"]
       ]},
       {b:"warn", html:"<b>Gluten-free \"free-from\" prescribing varies locally.</b> <b>There is no drug substitute for the diet — adherence is the treatment.</b> A gluten-free diet should not be started before diagnostic confirmation unless clinically necessary. <b>Lifelong, not a fad</b>, and that distinction is worth making explicitly to a patient who has met gluten-free eating as a lifestyle choice."}
     ]},

    {id:"wider", nav:"Wider care", title:"Beyond the diet — bone, vaccines, family and labels",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"🥗 Dietitian and support", html:"Refer to a dietitian to make the gluten-free diet effective and nutritionally complete; signpost Coeliac UK and prescribable gluten-free staples where available."},
         {tone:"amber", h:"🦴 Bone health", html:"Ensure adequate calcium and vitamin D. Consider DEXA particularly with prolonged untreated disease or severe malabsorption, fragility fracture, low BMI, delayed diagnosis, persistent biochemical deficiency, premature menopause or hypogonadism, older age, prolonged corticosteroid exposure or other osteoporosis risk factors \u2014 malabsorption risk alone does not mean every patient needs a scan."},
         {tone:"red", h:"💉 Vaccination", html:"Functional hyposplenism occurs in coeliac disease \u2014 assess for it and follow the current Green Book/local immunisation guidance: offer pneumococcal vaccination where indicated, and consider influenza, Hib and MenACWY by degree of hyposplenism and national eligibility."},
         {tone:"blue", h:"👪 Family and labels", html:"Offer testing to first-degree relatives. A negative test does not permanently exclude future coeliac disease: advise relatives to seek reassessment if symptoms develop, keep a low threshold for retesting relatives and people with type 1 diabetes if symptoms arise, and do not arrange annual serology for asymptomatic relatives unless part of a locally agreed specialist pathway. Teach gluten label-reading and cross-contamination avoidance."}
       ]},
       {b:"why", html:"The gluten-free diet is the treatment, but durable success depends on dietitian support and label literacy — and coeliac disease carries specific extras: risk-based bone assessment, vaccination for hyposplenism per the Green Book, and case-finding in relatives. <b>Those three are the ones a symptom-focused review misses</b>, because the patient feels well and nothing prompts them."}
     ]},

    {id:"monitor", nav:"Annual", title:"Annual review",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["<b>Symptoms, weight, nutritional status, adherence and inadvertent gluten exposure</b>","<b>Annually</b>","<b>Dietitian input if there are ongoing symptoms or poor adherence</b>; consider the need for specialist referral; family testing and patient education"],
         ["<b>Coeliac serology (tTG-IgA)</b>","<b>As one part of follow-up</b>","Interpret alongside dietary history, symptoms, nutritional markers and specialist/dietitian assessment \u2014 do not use serology alone to judge gluten exclusion; a normal or falling tTG does not prove mucosal healing or complete adherence. Persistent symptoms or persistently high titres after 12 months despite claimed gluten exclusion \u2192 dietetic review, reassess the diagnosis and consider repeat endoscopy/specialist review"],
         ["<b>Blood tests (e.g. FBC, ferritin/iron studies, B12, folate, calcium, vitamin D, liver tests, TFTs)</b>","<b>As clinically indicated \u2014 not a mandatory annual panel</b>","Choose by presenting deficiencies, symptoms, adherence, malabsorption, comorbidities and previous results. <b>Replace deficiencies; check for associated autoimmune disease where clinically indicated</b>"],
         ["<b>Bone health</b>","<b>Assess risk at review</b>","<b>Consider DEXA or active bone treatment by risk; manage osteoporosis</b>"],
         ["<b>Vaccination status</b>","<b>At review</b>","Hyposplenism vaccines per the current Green Book"],
         ["<b>Growth (children)</b>","<b>Each review</b>","<b>Expect catch-up growth on the diet</b>"]
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral",
     blocks:[
       {b:"cards", items:[
         {tone:"blue", h:"Gastroenterology", html:"Confirmatory duodenal biopsy for positive serology at 16 and over; negative serology with high clinical suspicion; already gluten-free (advice on a supervised gluten challenge); diagnostic uncertainty (especially IgA deficiency); persistent symptoms or high titres after 12 months. Suspected refractory coeliac disease \u2192 specialist centre."},
         {tone:"green", h:"Dietitian", html:"<b>All newly diagnosed patients — essential for education and adherence.</b>"},
         {tone:"blue", h:"Dermatology", html:"<b>Suspected dermatitis herpetiformis</b> \u2014 confirmation by skin biopsy and direct immunofluorescence; dapsone if needed is specialist-initiated."},
         {tone:"red", h:"Reassess / specialist", html:"Persistent symptoms despite a gluten-free diet \u2192 structured reassessment (diagnosis, gluten exposure with a specialist dietitian, alternative causes). Weight loss, abdominal mass, persistent unexplained abdominal pain, GI bleeding, anaemia, systemic or rapidly worsening symptoms \u2192 urgent specialist reassessment under the relevant GI pathway."},
         {tone:"cream", h:"GP management", html:"Case-finding and correct testing, the dietitian referral, deficiency replacement, bone protection, vaccination, relative testing and the annual review all belong here. Related pages: <a href='ibs.html'>IBS</a> · <a href='iron-deficiency-anaemia.html'>iron deficiency anaemia</a> · <a href='osteoporosis.html'>osteoporosis</a> · <a href='type-1-diabetes.html'>type 1 diabetes</a> · <a href='hypothyroidism.html'>hypothyroidism</a>."}
       ]},
       {b:"say", html:"Coeliac disease means gluten damages the gut lining. The important thing right now — keep eating gluten until the tests are done, a blood test and usually a camera-test biopsy, or we won't be able to confirm it. Once confirmed, the treatment is a strict gluten-free diet for life, which heals the gut. A dietitian will help, and we'll check your iron and bones, and offer the vaccinations recommended because coeliac can affect how the spleen works."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 27-year-old woman attends with 8 months of bloating, loose stools and tiredness. Her <b>ferritin is 6 µg/L with a normal haemoglobin</b>. She read about gluten online and <b>has been strictly gluten-free for 10 weeks</b>, feeling considerably better. She wants \"the coeliac test\" today to know for certain. Her <b>mother has coeliac disease</b>."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Recognises that testing now is uninterpretable — 10 weeks gluten-free normalises serology and histology, and explains why rather than just declining; refers to gastroenterology for advice on whether a supervised gluten challenge is appropriate, explaining that reintroducing gluten may provoke symptoms and that diagnostic certainty may be difficult, and negotiates it honestly given she feels better off gluten; <b>orders tTG-IgA WITH total IgA when the time comes</b>, and can say why the total IgA matters; treats the unexplained iron deficiency as a coeliac indication in its own right, and investigates and replaces it regardless; <b>notes the first-degree relative as an independent reason to test</b>; <b>does not start a gluten-free diet as \"a trial\" before diagnosis</b>, and explains what a secure diagnosis unlocks — dietitian support, prescribable staples, DEXA, vaccination and relative testing; <b>discusses vaccination for hyposplenism per the Green Book if confirmed</b>; and <b>arranges gastroenterology referral for biopsy on a positive result.</b>"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG20 — Coeliac disease: recognition, assessment and management (2015)</b><br><a href="https://www.nice.org.uk/guidance/ng20" rel="noopener">nice.org.uk/guidance/ng20</a><span class="rd"> — who to test, tTG-IgA with total IgA and the IgG-based alternative in IgA deficiency, the requirement to eat gluten in more than one meal a day for at least 6 weeks before testing, the instruction not to start a gluten-free diet before diagnosis, confirmatory duodenal biopsy in adults, the lifelong gluten-free diet with dietitian referral, and the annual review</span></li>'+
         '<li><b>NICE NG20 \u2014 Coeliac disease: recognition, assessment and management</b><br><a href="https://www.nice.org.uk/guidance/ng20" rel="noopener">nice.org.uk/guidance/ng20</a><span class="rd"> \u2014 the full case-finding list, referral when already gluten-free or with negative serology and high suspicion, annual review with blood tests as indicated, assessing the need for DEXA, pneumococcal immunisation, not using serology alone to judge gluten exclusion, persistent symptoms, dermatitis herpetiformis via dermatology, and a low threshold for retesting first-degree relatives</span></li>'+
         '<li>UKHSA Green Book, chapters on pneumococcal, Hib and meningococcal immunisation<br><a href="https://www.gov.uk/government/collections/immunisation-against-infectious-disease-the-green-book" rel="noopener">gov.uk — the Green Book</a><span class="rd"> \u2014 current eligibility for pneumococcal, influenza, Hib and MenACWY vaccination according to the degree of hyposplenism</span></li>'+
         '<li><b>NICE NG12 \u2014 Suspected cancer: recognition and referral (updated April 2026)</b><span class="rd"> \u2014 a referral guideline for suspected cancer only; it is not the source for managing refractory coeliac disease or coeliac-associated malignancy, which follow NICE NG20 and the relevant specialist GI pathway</span></li>'+
         '<li><b>Coeliac UK</b><br><a href="https://www.coeliac.org.uk" rel="noopener">coeliac.org.uk</a><span class="rd"> — patient education, label reading and the prescribable gluten-free staples position</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Coeliac disease in primary care \u2014 NICE NG20 and the UKHSA Green Book. Test on gluten or not at all: tTG-IgA with total IgA, while eating gluten in more than one meal a day for at least 6 weeks, and never after starting a gluten-free diet — that normalises both serology and histology. Already gluten-free \u2192 gastroenterology advice on a supervised gluten challenge. Positive serology at 16 and over needs confirmatory duodenal biopsy; negative serology with high suspicion \u2192 gastroenterology. Treatment is a strict lifelong gluten-free diet with dietitian support; there is no drug substitute. Remember the three easily-missed extras: deficiency replacement, risk-based bone assessment, and vaccination for functional hyposplenism per the current Green Book. Test first-degree relatives, and reassess them if symptoms develop. Verify against current NICE NG20."
});
