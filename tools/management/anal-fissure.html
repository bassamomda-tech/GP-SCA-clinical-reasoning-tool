<script>
MG.render({
  icon:"🩸",
  title:"Anal fissure — the complete guide",
  eyebrow:"Protocol · adults · a cycle to break, not just a tear to heal",
  stemTitle:"A fissure is kept open by hard stool, pain and sphincter spasm — so individualised stool softening is the foundation the topical treatments depend on",
  stemSub:"One page for adults. Recognise severe pain on defecation with bright-red bleeding, usually posterior midline. Most acute fissures improve with stool softening and symptom relief; persistent symptoms, or a fissure present for 6 weeks or more, should prompt consideration of a topical sphincter relaxant and/or referral. <b>Rectogesic (GTN 0.4%)</b> is licensed for pain in chronic fissure, with modest healing benefit, and headache is very common. <b>Diltiazem 2%</b> is an unlicensed alternative. A lateral, multiple, painless, indurated, large or non-healing fissure means reconsidering the diagnosis. <b>This pathway is for adults</b> — refer children with persistent or recurrent fissure early.",
  guideline:"MHRA SPC (Rectogesic) · Greater Manchester formulary · NICE NG12",
  reviewed:"25 September 2026",
  nextReview:"25 September 2027",
  meta:[
    {t:"Adults only — no Rectogesic under 18", tone:"tw"},
    {t:"Atypical fissure → reconsider the diagnosis", tone:"tw"},
    {t:"v2.1 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#confirm"><b>Confirm</b><small>Atypical → think again</small></a><a href="#nondrug"><b>Soften</b><small>Individualised</small></a><a href="#drug"><b>Topical</b><small>GTN · diltiazem</small></a><a href="#monitor"><b>Review</b><small>6–8 weeks</small></a><a href="#refer"><b>Refer</b><small>Colorectal</small></a></div>',
  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"blue", h:"The hallmark, and acute versus chronic", html:"Severe pain on or after defecation with bright-red bleeding, usually posterior midline, often after hard stool. <b>Acute:</b> under 6 weeks. <b>Chronic:</b> 6 weeks or more, often with a sentinel pile, hypertrophied anal papilla, exposed sphincter fibres or indurated edges."},
    {tone:"green", h:"Soft, easily passed stools", html:"Fluids, gradual fibre where appropriate, no straining — but choose or add an <b>osmotic laxative</b> if stools stay hard or fibre alone is not enough; fibre without enough fluid, or with faecal loading, can make things worse. Continue after healing to reduce recurrence."},
    {tone:"amber", h:"Persistent or chronic: consider a sphincter relaxant", html:"<b>Rectogesic 0.4%</b> (GM first choice, prescribe by brand) intra-anally every 12 hours, for up to 8 weeks — licensed for pain in chronic fissure; healing benefit is modest. Or <b>diltiazem 2%</b> (unlicensed) twice daily for about 6–8 weeks. It may also be considered earlier in adults with persistent pain despite initial care."},
    {tone:"red", h:"⚠ GTN: headache and contraindications", html:"Headache is very common (around 57% in SPC trials) and can be severe — warn before prescribing; stop and consider diltiazem or referral if it is not tolerated. <b>Do not use with PDE-5 inhibitors</b> (sildenafil, tadalafil, vardenafil) or other nitrates. Avoid in pregnancy; not recommended when breastfeeding."},
    {tone:"amber", h:"Atypical → reconsider the diagnosis", html:"Lateral, multiple, painless, indurated, unusually large, non-healing or recurrent → consider Crohn's, HIV or immunosuppression, TB, syphilis, inflammatory or haematological disease, malignancy or trauma — examine and refer rather than escalating the cream."},
    {tone:"blue", h:"Persistent → colorectal assessment", html:"Not healed despite stool regulation and topical therapy → colorectal surgery, where the specialist chooses between botulinum toxin, sphincterotomy and sphincter-preserving options according to continence, obstetric history and sphincter risk."}
  ],
  pathwaySub:"Five steps.",
  pathway:[
    {title:"Confirm, and look for atypical or red-flag features", html:"Typical posterior midline fissure; atypical features, abscess, fistula or colorectal symptoms change the pathway.", alert:true},
    {title:"Individualised stool softening", html:"Fluids, fibre where appropriate, an osmotic laxative if stools stay hard; short topical anaesthetic for severe pain."},
    {title:"Persistent or chronic: topical relaxant", html:"Rectogesic or diltiazem, with headache and contraindications checked."},
    {title:"Review at 6–8 weeks", html:"Healing, tolerability, stool consistency, atypical features."},
    {title:"Refer the persistent and the atypical", html:"Colorectal assessment; investigate another cause where indicated."}
  ],
  sections:[

    {id:"confirm", nav:"Confirm", title:"Step 1 — confirm, and consider atypical causes",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>Typical</b>","Severe pain on or after defecation with bright-red blood on the paper; usually posterior midline; linked to hard stool"],
         ["<b>Acute versus chronic</b>","Acute under 6 weeks; chronic 6 weeks or more — sentinel pile, hypertrophied papilla, exposed internal sphincter fibres, indurated edges, recurrent or persistent symptoms"],
         ["<b>Atypical</b>","Lateral, multiple, painless, indurated, unusually large, non-healing or recurrent → consider Crohn's, HIV or immunosuppression, TB, syphilis, inflammatory or autoimmune disease, haematological disease, anal or colorectal malignancy, trauma or iatrogenic injury"],
         ["<b>Examine</b>","Inspect gently where possible. A digital rectal examination is often too painful at first and need not be forced — but if examination is incomplete, arrange review or specialist assessment rather than assuming the fissure is uncomplicated. DRE may be appropriate later if another anorectal diagnosis needs considering"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"red", h:"⚠ Beyond a simple fissure", html:"Perianal abscess or fistula, systemic illness or immunosuppression → urgent assessment. Diarrhoea, abdominal pain or perianal Crohn's features → gastroenterology."},
         {tone:"purple", h:"Colorectal cancer features <span class='tw'>2WW</span>", html:"A fissure does not exclude colorectal pathology. Blood mixed with stool, change in bowel habit, unexplained weight loss, iron-deficiency anaemia, an abdominal or rectal mass, or persistent unexplained rectal bleeding → apply <b>NICE NG12</b>: offer FIT, and refer on the suspected colorectal cancer pathway if FIT is ≥10 µg Hb/g; a rectal or anal mass or unexplained anal ulceration → consider a suspected cancer pathway referral. See <a href='haemorrhoids.html'>haemorrhoids</a>."}
       ]}
     ]},

    {id:"nondrug", nav:"Soften", title:"Step 2 — individualised stool softening",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"🌾 Soft, easily passed stools", html:"Adequate fluids; increase dietary fibre gradually where appropriate. If stools stay hard, or fibre alone is not enough, choose or add an <b>osmotic laxative</b> and titrate to avoid diarrhoea. Bulk fibre can worsen symptoms without enough fluid or with faecal loading."},
         {tone:"amber", h:"🚽 Don't strain", html:"Avoid straining and prolonged sitting on the toilet; respond to the urge."},
         {tone:"green", h:"🛁 Warm baths", html:"Warm sitz baths can ease pain and sphincter spasm."},
         {tone:"blue", h:"🧴 Short topical anaesthetic", html:"Lidocaine before defecation for severe pain — a short course, generally up to about 14 days; reassess if pain persists rather than continuing indefinitely."},
         {tone:"green", h:"🔁 Keep going after healing", html:"Continue stool regulation after healing to reduce recurrence."}
       ]}
     ]},

    {id:"drug", nav:"Topical", title:"Step 3 — topical sphincter relaxants",
     blocks:[
       {b:"table", head:["Treatment","How","Notes"], rows:[
         ["<b>Rectogesic (GTN 0.4%) rectal ointment</b> — GM first choice, prescribe by brand","Intra-anally every 12 hours; maximum 8 weeks in adults","Licensed for pain associated with chronic anal fissure; the SPC reports modest pain benefit and no statistically significant healing effect versus placebo. Continue stool softening and reassess. Not for under-18s"],
         ["<b>Diltiazem 2%</b> cream or ointment","Twice daily for about 6–8 weeks","<b>Unlicensed</b> — prescribe per the GM formulary and specials arrangements. Used where GTN is not tolerated or unsuitable. Local irritation, pruritus or dermatitis can occur"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"red", h:"⚠ GTN — avoid or seek advice", html:"PDE-5 inhibitors (sildenafil, tadalafil, vardenafil) or other nitrates · hypotension or hypovolaemia · migraine or recurrent headache · significant anaemia · severe hepatic or renal disease · significant valvular disease or hypertrophic obstructive cardiomyopathy · closed-angle glaucoma · pregnancy (do not use) · breastfeeding (not recommended)."},
         {tone:"amber", h:"⚠ GTN — warn about", html:"Headache is very common (around 57% in SPC trials) and may be severe. Dizziness and postural hypotension — take care driving. Additive hypotension with antihypertensives, diuretics, beta-blockers, ACE inhibitors, calcium-channel blockers, tricyclics, alcohol and sedatives."}
       ]}
     ]},

    {id:"monitor", nav:"Review", title:"Step 4 — review at 6–8 weeks",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["<b>Pain and healing</b>","6–8 weeks","Healing, or persisting symptoms?"],
         ["<b>GTN tolerability</b>","On GTN","Headache or other intolerance → stop; diltiazem or referral"],
         ["<b>Stool consistency</b>","Ongoing","Keep soft — essential to healing and recurrence prevention"],
         ["<b>Atypical features</b>","If not healing","Reconsider the diagnosis and refer"]
       ]}
     ]},

    {id:"nothealing", nav:"Not healing?", title:"Not healing? Re-check before referral",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"1 · Stool soft?", html:"Genuinely soft stools, with an osmotic laxative if needed?"},
         {tone:"amber", h:"2 · Adequate course?", html:"Topical treatment used as directed for its course?"},
         {tone:"red", h:"3 · Tolerated?", html:"GTN stopped early because of headache → diltiazem."},
         {tone:"amber", h:"4 · Atypical?", html:"Lateral, multiple, painless, indurated or large → reconsider the cause."},
         {tone:"blue", h:"5 · Refer", html:"Persistent fissure → colorectal assessment."}
       ]}
     ]},

    {id:"safety", nav:"Safety-net", title:"Safety-netting",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Atypical bleeding or bowel change", html:"\"Blood mixed in with your stool, a change in bowel habit, weight loss or tiredness — come back so we can look further.\""},
         {tone:"red", h:"🔴 Swelling, fever or discharge", html:"\"A painful swelling, fever or discharge near the back passage needs to be seen urgently.\""},
         {tone:"amber", h:"🤕 GTN headache", html:"\"The GTN ointment often causes headaches — if it does, tell us and we'll switch you.\""},
         {tone:"green", h:"🌾 Soft stool", html:"\"Keeping stools soft is the key — keep it up even once it heals.\""}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"When to refer",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"Colorectal surgery", html:"Pain not resolved within about 6–8 weeks despite adequate stool regulation and topical therapy, recurrent fissures despite adherence, or a fissure persisting after about 12–16 weeks even if symptoms have settled. The specialist selects between botulinum toxin, lateral internal sphincterotomy, fissurectomy or advancement flap. Sphincterotomy is highly effective but carries a risk of flatus or faecal incontinence — higher with previous obstetric sphincter injury, existing incontinence, older age or sphincter injury."},
         {tone:"amber", h:"Atypical fissure", html:"Consider Crohn's, infection, inflammatory disease, immunosuppression or malignancy → appropriate referral. See <a href='crohns-disease.html'>Crohn's disease</a>."},
         {tone:"amber", h:"Children", html:"Early constipation management and analgesia; do not use Rectogesic routinely under 18 — refer persistent or recurrent fissure early to paediatrics or paediatric surgery. See <a href='constipation-child.html'>constipation in children</a>."},
         {tone:"cream", h:"GP management", html:"Diagnosis and the atypical check, individualised stool softening, short topical anaesthetic, the topical relaxant with its counselling, and the review belong here. Related pages: <a href='haemorrhoids.html'>haemorrhoids</a> · <a href='constipation-adult.html'>constipation</a> · <a href='crohns-disease.html'>Crohn's disease</a> · <a href='ibs.html'>IBS</a>."}
       ]},
       {b:"say", html:"This is a small tear, kept open by hard stools and muscle spasm — so the key is keeping your stools soft. If it doesn't settle, an ointment that relaxes the muscle can ease the pain; it often causes headaches, so tell me if it does and we'll switch."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 29-year-old woman has 3 months of severe pain on opening her bowels with bright-red blood on the paper. She was prescribed <b>Rectogesic</b> six weeks ago, used it for <b>five days and stopped because of severe headaches</b>, and assumed it had not worked. She is <b>still constipated</b> and takes no laxative. Gentle inspection shows a <b>posterior midline fissure with a skin tag</b>."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Recognises a chronic fissure; identifies headache, not inefficacy, as why the course stopped; checks contraindications and pregnancy plans; offers diltiazem 2%, explaining it is unlicensed; treats the constipation with an osmotic laxative rather than fibre alone; examines gently without forcing a DRE; confirms the typical site; asks about colorectal red flags; safety-nets and reviews at 6–8 weeks, with colorectal referral if it persists."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>MHRA SPC — Rectogesic 4 mg/g rectal ointment</b><span class="rd"> — indication (pain in chronic fissure), dosing, 8-week maximum, headache in ~57%, contraindications, interactions, pregnancy and breastfeeding, under-18s</span></li>'+
         '<li><b>Greater Manchester Medicines Management Group formulary — gastro-intestinal system</b><span class="rd"> — Rectogesic first choice by brand; diltiazem 2% unlicensed</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (May 2025)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — FIT and colorectal referral; rectal and anal mass or ulceration</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — laxative classes and topical anaesthetic preparations</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Anal fissure in adults. Individualised stool softening — an osmotic laxative if fibre alone is not enough — is the foundation. Persistent or chronic (6 weeks or more): consider Rectogesic 0.4% (licensed for pain; modest healing benefit; headache very common; not with PDE-5 inhibitors; not in pregnancy or under 18) or unlicensed diltiazem 2%. Atypical fissures and colorectal red flags change the pathway (NICE NG12). Persistent fissure → colorectal assessment, where the procedure is chosen individually. Sources: MHRA SPC, Greater Manchester formulary, NICE NG12, BNF."
});
