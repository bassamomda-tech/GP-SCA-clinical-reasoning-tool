    {tone:"green", h:"Stool softening breaks the cycle — it IS the treatment", html:"The fissure is caused and perpetuated by hard stool → pain → sphincter spasm → poor healing. Fibre, fluids and an osmotic or bulk laxative to keep stools soft is the single most important measure, and the reason topical agents work at all. <b>Warm sitz baths relax the sphincter and ease pain.</b>"},

  foot:"Anal fissure. The fissure is kept open by a cycle of hard stool, pain and sphincter spasm, so stool softening with fibre, fluids and a laxative is the treatment the topical agents depend on. Acute fissures heal with conservative measures plus a short course of topical local anaesthetic. Chronic means more than 6 weeks: topical GTN 0.4% or diltiazem 2% twice daily for a FULL 6–8 weeks. Warn about GTN headache — it is the usual reason the course is abandoned — and switch to diltiazem if it is not tolerated. A lateral, multiple or atypical fissure prompts thought of Crohn's, infection or malignancy. Refractory disease goes for botulinum toxin or lateral sphincterotomy. Verify all doses against the current BNF before prescribing."
