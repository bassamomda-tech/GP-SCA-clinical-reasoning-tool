<script>
MG.render({
  icon:"🌸",
  title:"Mastitis and breast abscess",
  eyebrow:"Protocol · lactational and non-lactational breast inflammation",
  stemTitle:"Mastitis — physiological feeding, not forced emptying; treat bacteria when they are there; and never let ‘infection’ hide a cancer",
  stemSub:"Most breast inflammation in a feeding mother settles with gentler feeding, cold and anti-inflammatory analgesia; antibiotics are for bacterial mastitis, a discrete or persisting lump needs ultrasound to distinguish abscess, phlegmon, galactocele and other pathology, and redness that will not go away is a breast-assessment question. ABM Protocol #36 and WHO guidance inform the clinical framework but do not replace local UK antimicrobial, breast-service, safeguarding or sepsis pathways. Sources: Academy of Breastfeeding Medicine Protocol #36 (2022, international), WHO Mastitis (2000, international), NICE NG12 (updated April 2026), NICE NG194 (2021), NICE NG253 and NG255 (2025), Dixon and Khan BMJ 2011, SPS breastfeeding guidance.",
  guideline:"ABM Protocol #36 (2022, international) · WHO 2000 (international) · NICE NG12 (updated April 2026) · NICE NG194 (2021) · NICE NG253 and NG255 (2025) · Dixon and Khan BMJ 2011",
  meta:[
    {t:"ABM Protocol #36 · 2022 (international)"},
    {t:"WHO Mastitis 2000 (international) · NICE NG194 2021"},
    {t:"NICE NG253 and NG255 sepsis · 2025"},
    {t:"SPS breastfeeding · BNF"},
    {t:"Suspected cancer · NICE NG12 breast 1.4.1–1.4.2", tone:"tw"}
  ],
  lead:"<div class='mg-layers'><a href='#flags'><b>Red flags</b><small>Sepsis, abscess, cancer</small></a><a href='#milk'><b>Feeding</b><small>Physiological feeding, no over-pumping</small></a><a href='#abx'><b>Antibiotics</b><small>Flucloxacillin per local formulary</small></a><a href='#refer'><b>Refer</b><small>Imaging, aspiration, suspected cancer</small></a></div>",
  quickSub:"Six cards that cover most consultations. Each figure traces to a source in <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"green", h:"Physiological feeding — don’t over-empty", html:"Continue breastfeeding or expressing according to the infant’s usual needs and maternal comfort. Do not deliberately ‘empty’ the breast, add routine pumping after feeds or increase milk removal beyond the baby’s intake. If direct feeding is too painful or a procedure interferes with feeding, express enough to maintain comfort and supply. ABM Protocol #36 (2022, international) supports avoiding excessive pumping and deep tissue massage; use cold packs with an anti-inflammatory painkiller."},
    {tone:"cream", h:"Antibiotics are for bacterial mastitis, not every red breast", html:"If she is systemically well, manage initially with physiological feeding, cold packs, analgesia and feeding support. Start antibiotics if there is no clear improvement after approximately 24–48 hours, or sooner if symptoms are worsening, she is systemically unwell, or there is clinically apparent bacterial infection — a clinical judgement, not a rigid clock (WHO 2000 and ABM 2022 thresholds are older/international; local UK antimicrobial guidance determines the final pathway). A fever alone does not prove bacterial mastitis; systemic illness from the outset should prompt earlier antibiotics and consideration of sepsis assessment. First-line: <b>flucloxacillin, using the current local antimicrobial formulary dose and duration</b>; if penicillin-allergic, a macrolide only where clinically appropriate and per local guidance, checking interactions. Penicillins and macrolides can be used while breastfeeding with routine infant monitoring (SPS)."},
    {tone:"amber", h:"A lump that stays or fluctuates needs ultrasound", html:"A discrete or persistent lump during mastitis requires ultrasound to distinguish abscess, phlegmon, galactocele and other pathology. Do not assume that a residual lump is an abscess or continue antibiotics without imaging. A drainable collection needs <b>ultrasound-guided needle aspiration</b>, often repeated — ABM #36 makes aspiration the first-line drainage method, with surgical drainage kept for failure or very large collections. Send the aspirate for culture."},
    {tone:"red", h:"Very unwell is a sepsis question, not a mastitis question", html:"Fever with a racing pulse, fast breathing, low blood pressure, confusion or mottled skin: assess against <b>NICE NG255 (2025)</b> if pregnant or recently pregnant, or <b>NG253 (2025)</b> otherwise, and send to hospital by 999 ambulance if high-risk criteria are met. Assess observations, mental state, perfusion, urine output and overall clinical trajectory; do not rely on a single vital-sign threshold to exclude sepsis."},
    {tone:"purple", h:"Redness that won’t settle can be inflammatory breast cancer", html:"NICE NG12 (updated April 2026): <b>consider a suspected cancer pathway referral for breast cancer in people with skin changes that suggest breast cancer</b>; and <b>refer using a suspected cancer pathway referral for breast cancer anyone aged 30 and over with an unexplained breast lump with or without pain</b>. If a lump, skin change or unilateral nipple change persists after appropriate treatment and inflammation has settled, arrange urgent breast assessment; apply NG12 if the abnormality is unexplained or has features suggestive of malignancy. Inflammatory breast cancer may present without a discrete mass and can mimic mastitis — failure to improve promptly should trigger breast imaging and specialist review."},
    {tone:"blue", h:"Not breastfeeding? Think periductal mastitis and smoking", html:"Non-lactational infection is usually periareolar. Periductal mastitis is strongly associated with smoking: ask about smoking and offer cessation support, as continued smoking increases recurrence and fistula risk. Follow the local breast/antimicrobial pathway — consider co-amoxiclav where appropriate, culture recurrent or non-responsive disease, and refer recurrent periductal disease or fistula to the breast service."}
  ],
  pathwaySub:"The consultation in five moves. The red step decides the setting of care.",
  pathway:[
    {title:"Screen for sepsis and a cancer mimic", html:"Observations first. Systemic toxicity → NG255/NG253 sepsis assessment. Not feeding, over 30, a persistent lump, skin thickening, peau d’orange, nipple retraction → the NG12 breast criteria, not antibiotics alone.", alert:true},
    {title:"Place it on the spectrum", html:"Engorgement or narrowed ducts → inflammatory mastitis → bacterial mastitis → phlegmon → abscess (ABM 2022). Lactational or non-lactational? The answer changes the likely organisms, the antibiotic and the differential."},
    {title:"Fix the feeding, cool the inflammation", html:"Feeding or expressing according to the infant’s usual needs and maternal comfort, no extra pumping to ‘empty’ the breast, attachment and positioning support, cold packs, ibuprofen and/or paracetamol, a supportive bra, avoid deep massage. Review the indication for nipple shields with skilled feeding support. Arrange infant-feeding support (NICE NG194)."},
    {title:"Add antibiotics when bacterial infection is likely", html:"No clear improvement after approximately 24–48 hours of feeding measures, or sooner if worsening, systemically unwell or clinically apparent bacterial infection (including a clinically infected nipple fissure) → flucloxacillin at the local formulary dose and duration (10–14 days is commonly used). Macrolide if allergic, per local guidance and after checking interactions. Send milk for culture if not responding at 48 hours, recurrent, hospital-acquired or severe (WHO 2000)."},
    {title:"Review at 48 hours and act on a lump", html:"Improving → complete the course. Not improving, or a discrete lump → urgent breast-service ultrasound, usually within days and sooner if systemically unwell, rapidly progressive, fluctuant, very painful or with skin necrosis. Review sooner if deteriorating. Any lump or skin change persisting after the inflammation settles → urgent breast assessment, and NG12 if unexplained or suggestive of malignancy."}
  ],
  sections:[
    {id:"flags", nav:"Red flags", title:"Red flags — the three things that must not be missed", sub:"Sepsis, an undrained abscess, and a cancer that looks like infection. NG12 criteria are stated here and repeated in the Refer section.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Sepsis", html:"Mastitis can progress to systemic infection. In someone pregnant or recently pregnant use the NICE NG255 (2025) risk criteria; otherwise NG253 (2025), where high-risk features include a respiratory rate of 25 or more, systolic BP of 90 mmHg or less, or heart rate over 130. Use NEWS2 and clinical judgement: assess observations, mental state, perfusion, urine output and overall clinical trajectory using the current NICE sepsis pathway — do not rely on a single vital-sign threshold to exclude sepsis. Also escalate for rapidly spreading cellulitis, necrotic skin, severe pain out of proportion, immunosuppression, inability to take oral treatment or suspected toxic shock. High risk → 999 transfer to hospital.", src:"NICE NG253 (updated September 2026) · NICE NG255 (2025)"},
         {tone:"amber", h:"Breast abscess", html:"A localised, very tender, sometimes fluctuant mass, often with fever, that persists despite antibiotics. A persistent lump is not necessarily an abscess — differentials include phlegmon, galactocele, infected galactocele, haematoma, fat necrosis, granulomatous mastitis and malignancy. Needs ultrasound; a drainable collection needs needle aspiration with culture, frequently more than once. Delay means a larger cavity and more likely surgery.", src:"ABM Protocol #36 (2022, international) · Dixon and Khan BMJ 2011"},
         {tone:"purple", h:"Inflammatory breast cancer or an underlying tumour — NICE NG12", html:"<b>NG12 1.4.2:</b> consider a suspected cancer pathway referral for breast cancer in people with skin changes that suggest breast cancer. <b>NG12 1.4.1:</b> refer using a suspected cancer pathway referral for breast cancer people aged 30 and over with an unexplained breast lump with or without pain, and people aged 50 and over with discharge, retraction or other changes of concern in one nipple only. Suspect it when redness, oedema or peau d’orange does not respond to treatment, there is no feeding-related trigger, or a mass persists after the infection settles. A clear, rapidly improving episode of lactational mastitis does not in itself need a cancer-pathway referral. Inflammatory breast cancer may present without a discrete mass and can mimic mastitis.", src:"NICE NG12 (updated April 2026), 1.4.1–1.4.2"},
         {tone:"amber", h:"Unusual pattern or organism", html:"Hospital-acquired infection, or no response to a correct antibiotic at 48 hours — culture the milk (or aspirate) to find resistant organisms such as MRSA and guide treatment. <b>Recurrent mastitis or abscess in the same location requires breast-service assessment and imaging to exclude duct disease, granulomatous mastitis, an underlying lesion or malignancy — even if it improves.</b>", src:"WHO Mastitis 2000 (international)"}
       ]},
       {b:"why", html:"The commonest serious error is not missing sepsis but repeating antibiotics for ‘mastitis that won’t shift’. Each extra course delays the ultrasound that would find an abscess or a tumour. A second course without imaging should prompt the question: what am I actually treating?"}
     ]},

    {id:"spectrum", nav:"Spectrum", title:"The mastitis spectrum — what is actually going on", sub:"ABM Protocol #36 (2022, international) reframed mastitis as a spectrum of inflammation, not a single infection.",
     blocks:[
       {b:"table", head:["Stage","What you see","What it needs"], rows:[
         ["<b>Engorgement / ductal narrowing</b>","Firm, tender areas, often both sides, early postpartum or after a change in feeding pattern. Well in herself","Normal feeding, cold, anti-inflammatory analgesia, no deep massage or extra pumping"],
         ["<b>Inflammatory mastitis</b>","A red, hot, tender, often wedge-shaped area; may have flu-like aches and fever","Same measures; many settle within a day or two without antibiotics"],
         ["<b>Bacterial mastitis</b>","No clear improvement after approximately 24–48 hours, worsening, systemically unwell, or a clinically infected nipple fissure","Antibiotics (flucloxacillin first-line, per local formulary) plus the same feeding measures"],
         ["<b>Phlegmon</b>","A firm, inflamed area without a drainable collection on ultrasound","Longer antibiotics and close follow-up with repeat imaging — can become an abscess"],
         ["<b>Abscess</b>","Discrete, tender, possibly fluctuant mass; confirmed on ultrasound","Ultrasound-guided needle aspiration (often repeated) with pus for culture and sensitivities, and antibiotics; surgical drainage for very large or multiloculated collections, overlying skin necrosis, failed aspiration or persistent/recurrent disease"],
         ["<b>Galactocele</b>","A soft, milk-filled cyst, usually painless","Reassurance or aspiration; not an infection"],
         ["<b>Subacute mastitis</b>","Recurrent burning or needle-like pain, a lower milk supply, no acute inflammation","Feeding assessment; avoid repeated antibiotic courses without culture"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Organisms", html:"Lactational bacterial mastitis and abscess are commonly due to <i>Staphylococcus aureus</i>, including MRSA in some settings, often entering via a cracked nipple. Non-lactational infection may involve mixed or anaerobic organisms. Culture guides treatment in non-response or recurrence.", src:"Dixon and Khan BMJ 2011 · WHO Mastitis 2000"},
         {tone:"blue", h:"Why ‘empty the breast’ changed", html:"Pumping after feeds to drain the breast raises supply and prolongs inflammation. ABM #36 recommends physiological milk removal — feeding according to the baby’s needs, not forced ‘emptying’ — and avoiding excessive pumping and deep tissue massage, which can injure tissue.", src:"ABM Protocol #36 (2022, international)"}
       ]}
     ]},

    {id:"assess", nav:"Assess", title:"Assessment in the consulting room", sub:"Five questions and a focused examination sort almost every presentation.",
     blocks:[
       {b:"dl", rows:[
         ["Is she breastfeeding, and how is it going?","Weeks since birth, feeding frequency, recent changes (return to work, baby sleeping longer, a missed feed), pumping habits, nipple pain or cracks, any nipple shields. Ask the baby’s weight gain."],
         ["How unwell is she?","Temperature, pulse, respiratory rate, BP, mental state. Compare against NG255 (recently pregnant) or NG253 (everyone else) sepsis criteria."],
         ["Where and what exactly?","A wedge of redness, a discrete lump, fluctuance, skin thickening, peau d’orange, nipple retraction or discharge, axillary nodes. Examine both breasts and axillae."],
         ["Nipple pain or a fissure — why?","A fissure is not necessarily infected. Assess attachment and positioning, infant oral thrush, maternal nipple vasospasm, eczema or dermatitis, bacterial colonisation only where clinically relevant, and recurrent trauma from poor latch or pumping technique. Consider antibiotics when a fissure is clinically infected — spreading cellulitis, purulent discharge, worsening pain, systemic symptoms or compatible culture results."],
         ["What has already been tried?","Duration, antibiotics taken and for how long, response at 48 hours, previous episodes in the same place."],
         ["Not feeding — who is this?","Age, smoking, previous periareolar infection or fistula, nipple changes. Over 30 with a lump, or any skin change suggestive of cancer, triggers the NG12 criteria."]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"When to send milk or pus for culture", html:"No response to antibiotics within 48 hours, recurrence, hospital-acquired mastitis, severe or unusual cases, and when a penicillin allergy limits the choice.", src:"WHO Mastitis 2000 (international)"},
         {tone:"blue", h:"When to image", html:"A discrete or persistent mass, fluctuance, no improvement on antibiotics, or recurrence in the same place → ultrasound through the breast service. Do not wait for multiple antibiotic courses before imaging a persistent mass. Mammography and biopsy are decided there when cancer is a possibility.", src:"ABM Protocol #36 (2022, international) · NICE NG12 (updated April 2026)"}
       ]}
     ]},

    {id:"milk", nav:"Feeding", title:"Non-drug treatment — the part that does most of the work", sub:"For lactational inflammation this is first-line, and it continues alongside any antibiotic.",
     blocks:[
       {b:"tiles", v:"life", items:[
         {t:"🤱 Feed according to the baby’s needs", html:"Continue breastfeeding or expressing according to the infant’s usual needs and maternal comfort. Breastfeeding from the affected side is usually safe and encouraged, but individualise the plan according to pain, drainage-site position, milk flow and infant feeding effectiveness. No routine pumping after feeds or deliberate ‘emptying’. If direct feeding is too painful, express enough to maintain comfort and supply. If she is exclusively pumping, keep volumes to what the baby needs (ABM 2022)."},
         {t:"🧊 Cold, not heat", html:"Cold packs between feeds reduce swelling. ABM 2022 recommends cold and anti-inflammatory analgesia over heat; brief warmth before a feed is fine if it helps let-down."},
         {t:"💊 Analgesia", html:"Ibuprofen and paracetamol are both compatible with breastfeeding; ibuprofen treats the inflammation as well as the pain (dose per BNF)."},
         {t:"🙌 Gentle touch only", html:"Very light lymphatic-style stroking towards the armpit is acceptable; deep massage to ‘break up a blockage’ can damage tissue (ABM 2022)."},
         {t:"👕 Support", html:"A well-fitted, supportive bra without wires pressing on the area; avoid topical oils or soaks. Review the indication for nipple shields and obtain skilled feeding support; do not introduce or stop them routinely without assessing attachment and milk transfer."},
         {t:"👩‍🍼 Attachment help", html:"Face-to-face infant-feeding support to check positioning and attachment; NICE NG194 expects women to be told about mastitis and when to seek help."}
       ]},
       {b:"why", html:"Mastitis in a feeding mother is usually a problem of inflammation and oversupply before it is a problem of bacteria. Physiological milk removal resolves most episodes. Abruptly stopping feeding on the affected side — a common instinct — can make things worse and puts the whole feeding relationship at risk; where pain, nipple trauma or a drainage site make direct feeding difficult, agree a temporary modified plan with expressing for comfort and supply."}
     ]},

    {id:"abx", nav:"Antibiotics", title:"Antibiotics — who, which, how long", sub:"Use the current local Greater Manchester antimicrobial formulary for choice, dose and duration; the international protocol doses below are for reference. Check the BNF before prescribing.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Trigger", tone:"cream", title:"Decide that bacterial mastitis is likely", when:"lactational", html:"If systemically well, start with physiological feeding, cold packs, analgesia and feeding support. Start antibiotics if there is no clear improvement after approximately 24–48 hours, or sooner if symptoms are worsening, she is systemically unwell (consider sepsis assessment), or there is clinically apparent bacterial infection, such as a clinically infected nipple fissure. A fever alone does not prove bacterial mastitis. WHO 2000 (12–24 hours) and ABM 2022 (24–48 hours) are older/international thresholds — clinical judgement, not a rigid clock."},
         {step:"1st line", tone:"cream", title:"Flucloxacillin", when:"no penicillin allergy", fromLabel:"prescribe", html:"<b>Use the current local antimicrobial formulary dose and duration.</b> ABM Protocol #36 (2022) gives 500 mg four times daily; a 10–14-day course is commonly used for bacterial mastitis, with clinical review if not improving within 48 hours. Consider penicillin allergy type, renal/hepatic function, local MRSA prevalence/risk and recent antibiotic exposure; culture in non-response or recurrence. Take on an empty stomach. Continue breastfeeding: penicillins are compatible; advise routine observation of the infant for diarrhoea, rash or oral thrush (SPS)."},
         {step:"Allergy", tone:"amber", title:"Macrolide", when:"penicillin allergy", fromLabel:"if allergic", html:"Erythromycin or clarithromycin (WHO 2000 lists erythromycin 250–500 mg four times daily; clarithromycin dose per BNF). Compatible with breastfeeding with routine infant monitoring (SPS). Use a macrolide only where clinically appropriate and in accordance with local guidance. Check drug interactions, particularly with clarithromycin, including QT-prolonging medicines, statins, anticoagulants and CYP3A4 substrates. A severe immediate penicillin allergy, pregnancy, resistant organisms or treatment failure may require microbiology/breast-service advice."},
         {step:"Non-lactational", tone:"amber", title:"Cover anaerobes", when:"not breastfeeding, periareolar, smoker", fromLabel:"if not lactating", html:"Follow the local breast/antimicrobial pathway. Consider co-amoxiclav where appropriate (mixed/anaerobic organisms may be involved). Do not use a macrolide plus metronidazole as a generic penicillin-allergy instruction without checking local guidance and patient-specific interactions. Examine, culture recurrent or non-responsive disease, image a lump or abscess, and refer recurrent periductal disease or fistula to the breast service."},
         {step:"Not responding", tone:"red", title:"Culture, image, rethink", when:"no response at 48 hours", fromLabel:"if not better at 48 h", html:"Send milk or aspirate for culture and switch according to sensitivities (MRSA is possible). Reassess the diagnosis, examine for abscess or phlegmon, check adherence and antibiotic choice, and arrange ultrasound. Consider breast cancer or inflammatory disease and the NG12 breast criteria. Do not simply prescribe a second empirical course."}
       ]},
       {b:"warn", html:"Admission and intravenous antibiotics are rarely needed; ABM #36 reserves them for sepsis, inability to tolerate oral treatment, or known multi-resistant organisms."}
     ]},

    {id:"abscess", nav:"Abscess", title:"Breast abscess — drainage, not just more antibiotics", sub:"Primary care confirms suspicion and gets the patient to imaging quickly.",
     blocks:[
       {b:"timeline", items:[
         {n:"1", when:"Suspect", title:"A lump, fluctuance or non-response", html:"A tender, defined mass, or mastitis that is not improving at 48 hours of the right antibiotic."},
         {n:"2", when:"Urgent — usually within days", title:"Breast service ultrasound", html:"Arrange urgent breast-service ultrasound, usually within days and sooner if systemically unwell, rapidly progressive, fluctuant, very painful or associated with skin necrosis, via the local breast unit or surgical assessment pathway. Continue antibiotics meanwhile."},
         {n:"3", when:"At imaging", title:"Needle aspiration", html:"Ultrasound-guided aspiration is the first-line drainage method and often needs repeating every few days until dry; pus goes for culture (ABM 2022)."},
         {n:"4", when:"If aspiration fails", title:"Surgical drainage", html:"Surgical drainage for very large or multiloculated collections, overlying skin necrosis, failure of aspiration, or persistent/recurrent disease."},
         {n:"5", when:"Afterwards", title:"Keep feeding, check resolution", html:"Continue breastfeeding where clinically feasible; if a wound or drain interferes with direct feeding, express from that side according to comfort and infant need. Make sure the mass fully resolves; a residual lump needs imaging to exclude an underlying tumour."}
       ]},
       {b:"say", html:"The scan is to see whether there is a pocket of pus. If there is, they drain it with a fine needle — it may need doing more than once — and you can keep feeding your baby throughout."}
     ]},

    {id:"nonlact", nav:"Non-lactational", title:"Non-lactational mastitis", sub:"A different disease, a different antibiotic and a different differential diagnosis.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Periductal mastitis", html:"Periareolar inflammation, sometimes with nipple retraction or a mass, in younger women, strongly associated with smoking. Damaged subareolar ducts become infected, often with anaerobes. It recurs and can lead to a mammary duct fistula needing surgery.", src:"Dixon and Khan BMJ 2011"},
         {tone:"amber", h:"Treatment", html:"Follow the local breast/antimicrobial pathway: consider co-amoxiclav where appropriate; for penicillin allergy, check local guidance and patient-specific interactions. Culture recurrent or non-responsive disease and image a lump or abscess. Abscesses are aspirated or drained by the breast team. Recurrent periductal disease or fistula → breast service referral.", src:"Dixon and Khan BMJ 2011"},
         {tone:"green", h:"Stop smoking", html:"Ask about smoking and offer cessation support, as continued smoking increases recurrence and fistula risk — a genuine treatment, not an afterthought.", src:"Dixon and Khan BMJ 2011"},
         {tone:"purple", h:"The NG12 lens", html:"A non-lactating woman with a breast lump aged 30 or over, skin changes suggesting cancer, or unilateral nipple retraction or discharge aged 50 or over meets NICE NG12 criteria — infection does not remove the need to exclude cancer.", src:"NICE NG12 (updated April 2026), 1.4.1–1.4.2"},
         {tone:"blue", h:"Other causes", html:"Granulomatous mastitis, infected sebaceous cysts and infection around piercings or implants are handled by the breast team; do not keep prescribing empirically.", src:"Dixon and Khan BMJ 2011"}
       ]}
     ]},

    {id:"follow", nav:"Follow-up", title:"Follow-up and safety-netting", sub:"Short intervals early; a definite end point.",
     blocks:[
       {b:"timeline", items:[
         {n:"1", when:"24 hours", title:"Self-check", html:"If no clear improvement with feeding measures over about 24–48 hours → contact the practice. Seek review sooner if symptoms worsen, she becomes systemically unwell, cannot feed or hydrate, or pain becomes disproportionate."},
         {n:"2", when:"48 hours on antibiotics", title:"Review", html:"Not clearly better → reassess the diagnosis; examine for abscess/phlegmon; check adherence and antibiotic choice; arrange ultrasound; send milk or aspirate for culture where indicated; consider breast cancer or inflammatory disease. Do not simply prescribe a second empirical course (WHO 2000; ABM 2022)."},
         {n:"3", when:"End of course", title:"Resolution check", html:"Redness, lump and pain should have gone. A lump, skin change or unilateral nipple change that persists after inflammation has settled → urgent breast assessment, and the NG12 route if unexplained or suggestive of malignancy."},
         {n:"4", when:"Recurrence", title:"Look for a cause", html:"Same site again → breast-service assessment, imaging and culture, even if it improves. Feeding review for recurrent lactational episodes; smoking and duct disease for non-lactational ones."}
       ]},
       {b:"say", html:"Keep feeding your baby as they need — no extra pumping — and use cold packs and ibuprofen. If you’re not clearly better in a day or two, or sooner if it is getting worse, you feel shivery and unwell, you can’t feed or drink, or the pain becomes much worse, call us. If a lump is left once the redness has gone, come back — we’ll want it scanned."}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — who, how fast, to whom", sub:"The NG12 thresholds are repeated here in NICE NG12 (updated April 2026) wording.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Emergency (999 / same day)", html:"Sepsis meeting high-risk criteria (NG255 if pregnant or recently pregnant; NG253 otherwise), judged with NEWS2 and clinical judgement, not a single vital sign. Rapidly spreading cellulitis, necrotic skin, severe pain out of proportion, immunosuppression, inability to take oral treatment or suspected toxic shock.", src:"NICE NG253 (updated September 2026) · NICE NG255 (2025)"},
         {tone:"purple", h:"Breast referral routes <span class='tw'>Suspected cancer</span> · NICE NG12 breast", html:"<b>Refer</b> using a suspected cancer pathway referral for breast cancer if aged <b>30 and over with an unexplained breast lump with or without pain</b>, or aged <b>50 and over with discharge, retraction or other changes of concern in one nipple only</b> (NG12 1.4.1). <b>Consider</b> a suspected cancer pathway referral for breast cancer in people with <b>skin changes that suggest breast cancer</b>, or aged 30 and over with an unexplained lump in the axilla (NG12 1.4.2).", src:"NICE NG12 (updated April 2026), 1.4.1–1.4.2"},
         {tone:"amber", h:"Urgent breast service (within days)", html:"Suspected abscess or phlegmon for ultrasound and aspiration — sooner if systemically unwell, rapidly progressive, fluctuant, very painful or with skin necrosis; mastitis not responding at 48 hours of appropriate antibiotics; recurrent infection at the same site; a lump, skin change or unilateral nipple change persisting after inflammation has settled. Urgent breast imaging is separate from the NG12 suspected-cancer pathway.", src:"ABM Protocol #36 (2022, international) · Dixon and Khan BMJ 2011"},
         {tone:"cream", h:"Routine breast surgical", html:"Recurrent periductal mastitis or a mammary duct fistula.", src:"Dixon and Khan BMJ 2011"},
         {tone:"green", h:"Infant-feeding support", html:"Health visitor or infant-feeding team for attachment, supply and pumping advice — for every lactational case, and especially recurrent ones.", src:"NICE NG194 (2021) · ABM Protocol #36 (2022, international)"},
         {tone:"cream", h:"Local pathways — record locally", html:"Bolton/Greater Manchester breast-service referral route; local same-day breast assessment contact; acute oncology/breast MDT pathway if available; local antimicrobial guidance; infant-feeding/health-visitor support; sepsis escalation route; out-of-hours advice."}
       ]},
       {b:"warn", html:"An unexplained breast lump in someone aged 30 or over does not become ‘explained’ because she is breastfeeding. A clear, rapidly improving episode of mastitis does not in itself need a cancer-pathway referral. If a lump, skin change or unilateral nipple change persists after appropriate treatment and inflammation has settled, arrange urgent breast assessment; apply NG12 (1.4.1 for a lump aged 30 and over) if the abnormality is unexplained or has features suggestive of malignancy. Do not wait for multiple antibiotic courses before imaging a persistent mass. Under 30, NG12 recommends considering a non-urgent referral for an unexplained breast lump — but a persisting lump after mastitis still needs imaging to exclude an abscess or phlegmon."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card; the Casebook holds the full case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 31-year-old, three weeks postpartum, with a hot, red, painful area in the right breast for two days and a temperature of 38.4 °C. She has stopped feeding from that side ‘to rest it’, is pumping hard after every feed, and has been massaging the lump firmly. Her mother tells her to give up breastfeeding.", src:"SCA practice scenario (site-authored), built on ABM Protocol #36 and WHO 2000"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Checks <b>observations against NG255</b>; examines both breasts for a discrete mass; explains <b>feeding according to the baby’s needs and her comfort</b>, including from the affected side where possible, but <b>stopping extra pumping and deep massage</b>; recommends cold and ibuprofen; uses clinical judgement on antibiotics (no clear improvement, worsening or systemically unwell) and, if indicated, prescribes <b>flucloxacillin at the local formulary dose and duration</b>; reassures that it is <b>safe for the baby</b>; arranges <b>review at 48 hours</b> with ultrasound if not better; safety-nets on sepsis and a persisting lump; supports her choice about feeding without judgement.", src:"ABM Protocol #36 · NICE NG255 · SPS"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Primary sources for every recommendation and figure on this page.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>Academy of Breastfeeding Medicine Clinical Protocol #36: The Mastitis Spectrum, Revised 2022</b> (Mitchell KB et al., Breastfeeding Medicine 2022) — international<br><a href="https://doi.org/10.1089/bfm.2022.29207.kbm" rel="noopener">doi.org/10.1089/bfm.2022.29207.kbm</a><span class="rd"> — the spectrum model, normal feeding without over-pumping, avoiding deep massage, cold and anti-inflammatory analgesia, flucloxacillin 500 mg four times daily for 10–14 days, aspiration as first-line abscess drainage, when admission is needed. ABM Protocol #36 and WHO guidance inform the clinical framework but do not replace local UK antimicrobial, breast-service, safeguarding or sepsis pathways</span></li>'+
         '<li><b>World Health Organization — Mastitis: causes and management</b> (WHO/FCH/CAH/00.13, 2000) — international<br><a href="https://www.who.int/publications/i/item/WHO_FCH_CAH_00.13" rel="noopener">who.int/publications/i/item/WHO_FCH_CAH_00.13</a><span class="rd"> — when to start antibiotics (no improvement 12–24 hours after improved milk removal, severe from the outset, or nipple fissure), erythromycin 250–500 mg four times daily, indications for milk culture</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral</b> (updated April 2026)<br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — breast recommendations 1.4.1 (aged 30 and over with an unexplained breast lump; aged 50 and over with unilateral nipple changes) and 1.4.2 (skin changes suggesting breast cancer; axillary lump aged 30 and over)</span></li>'+
         '<li><b>NICE NG194 — Postnatal care</b> (2021)<br><a href="https://www.nice.org.uk/guidance/ng194" rel="noopener">nice.org.uk/guidance/ng194</a><span class="rd"> — information on mastitis and when to seek help, face-to-face feeding support with positioning and attachment</span></li>'+
         '<li><b>NICE NG253 — Suspected sepsis in people aged 16 or over</b> (2025) and <b>NICE NG255 — Suspected sepsis in pregnant or recently pregnant people</b> (2025), replacing NG51<br><a href="https://www.nice.org.uk/guidance/ng253" rel="noopener">nice.org.uk/guidance/ng253</a> · <a href="https://www.nice.org.uk/guidance/ng255" rel="noopener">nice.org.uk/guidance/ng255</a><span class="rd"> — risk stratification and emergency transfer</span></li>'+
         '<li><b>Dixon JM, Khan LR. Treatment of breast infection.</b> BMJ 2011;342:d396<span class="rd"> — lactational and non-lactational antibiotic choice, periductal mastitis and its strong association with smoking, anaerobes, recurrence and fistula, abscess aspiration</span></li>'+
         '<li><b>Specialist Pharmacy Service — Using penicillin antibiotics during breastfeeding; Using macrolide antibiotics during breastfeeding</b><br><a href="https://www.sps.nhs.uk/category/guidance/safety-in-lactation-guidance/" rel="noopener">sps.nhs.uk</a><span class="rd"> — compatibility with breastfeeding and what to monitor in the infant</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — current doses and interactions for clarithromycin, co-amoxiclav, metronidazole, ibuprofen and paracetamol</span></li>'+
         '<li><b>Local Greater Manchester antimicrobial formulary and local pathways</b><span class="rd"> — antibiotic choice, dose and duration; local breast-unit pathway for ultrasound and aspiration; NICE NG12 for suspected-cancer referral; NICE NG253/NG255 for sepsis; local infant-feeding support pathways</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Mastitis and breast abscess in primary care, lactational and non-lactational. Sources: ABM Protocol #36 (2022, international), WHO Mastitis (2000, international), NICE NG12 (updated April 2026), NICE NG194 (2021), NICE NG253 and NG255 (2025), Dixon and Khan BMJ 2011, SPS breastfeeding guidance and the BNF. International sources do not replace local UK antimicrobial, breast-service, safeguarding or sepsis pathways. Not a substitute for clinical judgement or your local formulary."
});
