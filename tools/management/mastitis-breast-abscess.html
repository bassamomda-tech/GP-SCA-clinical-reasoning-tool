<script>
MG.render({
  icon:"🌸",
  title:"Mastitis and breast abscess",
  eyebrow:"Protocol · lactational and non-lactational breast inflammation",
  stemTitle:"Mastitis — keep the milk moving, treat bacteria when they are there, and never let ‘infection’ hide a cancer",
  stemSub:"Most breast inflammation in a feeding mother settles with gentler feeding, cold and anti-inflammatory analgesia; antibiotics are for bacterial mastitis, a fluctuant or persisting lump needs imaging and aspiration, and redness that will not go away in a woman who is not feeding is a cancer question. Sources: Academy of Breastfeeding Medicine Protocol #36 (2022, international), WHO Mastitis (2000, international), NICE NG12 (updated April 2026), NICE NG194 (2021), NICE NG253 and NG255 (2025), Dixon and Khan BMJ 2011, SPS breastfeeding guidance.",
  guideline:"ABM Protocol #36 (2022, international) · WHO 2000 (international) · NICE NG12 (updated April 2026) · NICE NG194 (2021) · NICE NG253 and NG255 (2025) · Dixon and Khan BMJ 2011",
  meta:[
    {t:"ABM Protocol #36 · 2022 (international)"},
    {t:"WHO Mastitis 2000 (international) · NICE NG194 2021"},
    {t:"NICE NG253 and NG255 sepsis · 2025"},
    {t:"SPS breastfeeding · BNF"},
    {t:"2WW · NICE NG12 breast 1.4.1–1.4.2", tone:"tw"}
  ],
  lead:"<div class='mg-layers'><a href='#flags'><b>Red flags</b><small>Sepsis, abscess, cancer</small></a><a href='#milk'><b>Feeding</b><small>Normal feeds, no over-pumping</small></a><a href='#abx'><b>Antibiotics</b><small>Flucloxacillin 10–14 days</small></a><a href='#refer'><b>Refer</b><small>Imaging, aspiration, 2WW</small></a></div>",
  quickSub:"Six cards that cover most consultations. Each figure traces to a source in <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"green", h:"Keep breastfeeding — from both sides — but don’t over-empty", html:"Continued breastfeeding is safe for the baby and part of the treatment. ABM Protocol #36 (2022, international) moved away from ‘empty the breast at every feed’: feed the baby normally on demand, avoid extra pumping to drain the breast, avoid deep massage, and use cold packs with an anti-inflammatory painkiller. Over-stimulating supply feeds the inflammation."},
    {tone:"cream", h:"Antibiotics are for bacterial mastitis, not every red breast", html:"Consider antibiotics when symptoms have not started improving despite these measures — WHO 2000 suggests after 12–24 hours of better milk removal, ABM 2022 allows 24–48 hours of conservative care if she is well — or when she is systemically unwell from the start or has an infected nipple fissure. ABM #36 gives <b>flucloxacillin 500 mg four times daily for 10–14 days</b>; if penicillin-allergic, a macrolide such as erythromycin or clarithromycin (dose per BNF). Penicillins and macrolides can be used while breastfeeding with routine infant monitoring (SPS)."},
    {tone:"amber", h:"A lump that stays or fluctuates is an abscess until imaged", html:"A tender, localised swelling, especially one that persists after 48 hours of antibiotics or is fluctuant, needs <b>ultrasound and needle aspiration</b>, often repeated — ABM #36 makes aspiration the first-line drainage method, with surgical drainage kept for failure or very large collections. Send the aspirate for culture."},
    {tone:"red", h:"Very unwell is a sepsis question, not a mastitis question", html:"Fever with a racing pulse, fast breathing, low blood pressure, confusion or mottled skin: assess against <b>NICE NG255 (2025)</b> if pregnant or recently pregnant, or <b>NG253 (2025)</b> otherwise, and send to hospital by 999 ambulance if high-risk criteria are met."},
    {tone:"purple", h:"Redness that won’t settle can be inflammatory breast cancer", html:"NICE NG12 (updated April 2026): <b>consider a suspected cancer pathway referral for breast cancer in people with skin changes that suggest breast cancer</b>; and <b>refer using a suspected cancer pathway referral for breast cancer anyone aged 30 and over with an unexplained breast lump with or without pain</b>. Erythema, oedema or peau d’orange that fails to resolve, particularly when not breastfeeding, belongs here."},
    {tone:"blue", h:"Not breastfeeding? Think periductal mastitis and smoking", html:"Non-lactational infection is usually periareolar and linked to smoking — about 90% of women with periductal mastitis smoke (Dixon and Khan, BMJ 2011). It involves anaerobes: co-amoxiclav, or a macrolide plus metronidazole if penicillin-allergic. It recurs and can form a fistula; stopping smoking is part of the treatment."}
  ],
  pathwaySub:"The consultation in five moves. The red step decides the setting of care.",
  pathway:[
    {title:"Screen for sepsis and a cancer mimic", html:"Observations first. Systemic toxicity → NG255/NG253 sepsis assessment. Not feeding, over 30, a persistent lump, skin thickening, peau d’orange, nipple retraction → the NG12 breast criteria, not antibiotics alone.", alert:true},
    {title:"Place it on the spectrum", html:"Engorgement or narrowed ducts → inflammatory mastitis → bacterial mastitis → phlegmon → abscess (ABM 2022). Lactational or non-lactational? The answer changes the likely organisms, the antibiotic and the differential."},
    {title:"Fix the feeding, cool the inflammation", html:"Normal on-demand feeding, no extra pumping to ‘empty’ the breast, attachment and positioning support, cold packs, ibuprofen and/or paracetamol, a supportive bra, avoid deep massage and nipple shields. Arrange infant-feeding support (NICE NG194)."},
    {title:"Add antibiotics when bacterial infection is likely", html:"Not improving after 12–24 hours (WHO 2000) to 24–48 hours (ABM 2022) of feeding measures, or unwell from the start, or a cracked infected nipple → flucloxacillin 500 mg QDS for 10–14 days (ABM 2022). Macrolide if allergic. Send milk for culture if not responding at 48 hours, recurrent, hospital-acquired or severe (WHO 2000)."},
    {title:"Review at 48 hours and act on a lump", html:"Improving → complete the course. Not improving, or a discrete lump → same-week ultrasound and aspiration via the breast service. Any lump or skin change persisting after the inflammation settles → NG12 route."}
  ],
  sections:[
    {id:"flags", nav:"Red flags", title:"Red flags — the three things that must not be missed", sub:"Sepsis, an undrained abscess, and a cancer that looks like infection. NG12 criteria are stated here and repeated in the Refer section.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Sepsis", html:"Mastitis can progress to systemic infection. In someone pregnant or recently pregnant use the NICE NG255 (2025) risk criteria; otherwise NG253 (2025), where high-risk features include a respiratory rate of 25 or more, systolic BP of 90 mmHg or less, or heart rate over 130. High risk → 999 transfer to hospital.", src:"NICE NG253 (2025) · NICE NG255 (2025)"},
         {tone:"amber", h:"Breast abscess", html:"A localised, very tender, sometimes fluctuant mass, often with fever, that persists despite antibiotics. Needs ultrasound confirmation and needle aspiration with culture, frequently more than once. Delay means a larger cavity and more likely surgery.", src:"ABM Protocol #36 (2022, international) · Dixon and Khan BMJ 2011"},
         {tone:"purple", h:"Inflammatory breast cancer or an underlying tumour — NICE NG12", html:"<b>NG12 1.4.2:</b> consider a suspected cancer pathway referral for breast cancer in people with skin changes that suggest breast cancer. <b>NG12 1.4.1:</b> refer using a suspected cancer pathway referral for breast cancer people aged 30 and over with an unexplained breast lump with or without pain, and people aged 50 and over with discharge, retraction or other changes of concern in one nipple only. Suspect it when redness, oedema or peau d’orange does not respond to treatment, there is no feeding-related trigger, or a mass persists after the infection settles.", src:"NICE NG12 (updated April 2026), 1.4.1–1.4.2"},
         {tone:"amber", h:"Unusual pattern or organism", html:"Recurrent episodes in the same place, hospital-acquired infection, or no response to a correct antibiotic at 48 hours — culture the milk (or aspirate) to find resistant organisms such as MRSA and guide treatment.", src:"WHO Mastitis 2000 (international)"}
       ]},
       {b:"why", html:"The commonest serious error is not missing sepsis but repeating antibiotics for ‘mastitis that won’t shift’. Each extra course delays the ultrasound that would find an abscess or a tumour. A second course without imaging should prompt the question: what am I actually treating?"}
     ]},

    {id:"spectrum", nav:"Spectrum", title:"The mastitis spectrum — what is actually going on", sub:"ABM Protocol #36 (2022, international) reframed mastitis as a spectrum of inflammation, not a single infection.",
     blocks:[
       {b:"table", head:["Stage","What you see","What it needs"], rows:[
         ["<b>Engorgement / ductal narrowing</b>","Firm, tender areas, often both sides, early postpartum or after a change in feeding pattern. Well in herself","Normal feeding, cold, anti-inflammatory analgesia, no deep massage or extra pumping"],
         ["<b>Inflammatory mastitis</b>","A red, hot, tender, often wedge-shaped area; may have flu-like aches and fever","Same measures; many settle within a day or two without antibiotics"],
         ["<b>Bacterial mastitis</b>","Not improving or worsening after about 24 hours, systemically unwell, or an infected nipple fissure","Antibiotics (flucloxacillin first-line) plus the same feeding measures"],
         ["<b>Phlegmon</b>","A firm, inflamed area without a drainable collection on ultrasound","Longer antibiotics and close follow-up with repeat imaging — can become an abscess"],
         ["<b>Abscess</b>","Discrete, tender, possibly fluctuant mass; confirmed on ultrasound","Needle aspiration (often repeated) and antibiotics; surgical drainage if aspiration fails"],
         ["<b>Galactocele</b>","A soft, milk-filled cyst, usually painless","Reassurance or aspiration; not an infection"],
         ["<b>Subacute mastitis</b>","Recurrent burning or needle-like pain, a lower milk supply, no acute inflammation","Feeding assessment; avoid repeated antibiotic courses without culture"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Organisms", html:"Lactational bacterial mastitis and abscess are usually due to <i>Staphylococcus aureus</i>, including MRSA in some settings, often entering via a cracked nipple. Non-lactational infection is more often mixed, with anaerobes.", src:"Dixon and Khan BMJ 2011 · WHO Mastitis 2000"},
         {tone:"blue", h:"Why ‘empty the breast’ changed", html:"Pumping after feeds to drain the breast raises supply and prolongs inflammation. ABM #36 recommends feeding the baby normally, not ‘emptying’, and avoiding vigorous massage, which can injure tissue.", src:"ABM Protocol #36 (2022, international)"}
       ]}
     ]},

    {id:"assess", nav:"Assess", title:"Assessment in the consulting room", sub:"Five questions and a focused examination sort almost every presentation.",
     blocks:[
       {b:"dl", rows:[
         ["Is she breastfeeding, and how is it going?","Weeks since birth, feeding frequency, recent changes (return to work, baby sleeping longer, a missed feed), pumping habits, nipple pain or cracks, any nipple shields. Ask the baby’s weight gain."],
         ["How unwell is she?","Temperature, pulse, respiratory rate, BP, mental state. Compare against NG255 (recently pregnant) or NG253 (everyone else) sepsis criteria."],
         ["Where and what exactly?","A wedge of redness, a discrete lump, fluctuance, skin thickening, peau d’orange, nipple retraction or discharge, axillary nodes. Examine both breasts and axillae."],
         ["What has already been tried?","Duration, antibiotics taken and for how long, response at 48 hours, previous episodes in the same place."],
         ["Not feeding — who is this?","Age, smoking, previous periareolar infection or fistula, nipple changes. Over 30 with a lump, or any skin change suggestive of cancer, triggers the NG12 criteria."]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"When to send milk or pus for culture", html:"No response to antibiotics within 48 hours, recurrence, hospital-acquired mastitis, severe or unusual cases, and when a penicillin allergy limits the choice.", src:"WHO Mastitis 2000 (international)"},
         {tone:"blue", h:"When to image", html:"A discrete mass, fluctuance, no improvement on antibiotics, or recurrence in the same place → ultrasound through the breast service. Mammography and biopsy are decided there when cancer is a possibility.", src:"ABM Protocol #36 (2022, international) · NICE NG12 (updated April 2026)"}
       ]}
     ]},

    {id:"milk", nav:"Feeding", title:"Non-drug treatment — the part that does most of the work", sub:"For lactational inflammation this is first-line, and it continues alongside any antibiotic.",
     blocks:[
       {b:"tiles", v:"life", items:[
         {t:"🤱 Feed normally, on demand", html:"From both breasts, as the baby wants. No extra ‘emptying’ with a pump. If she is exclusively pumping, keep volumes to what the baby needs (ABM 2022)."},
         {t:"🧊 Cold, not heat", html:"Cold packs between feeds reduce swelling. ABM 2022 recommends cold and anti-inflammatory analgesia over heat; brief warmth before a feed is fine if it helps let-down."},
         {t:"💊 Analgesia", html:"Ibuprofen and paracetamol are both compatible with breastfeeding; ibuprofen treats the inflammation as well as the pain (dose per BNF)."},
         {t:"🙌 Gentle touch only", html:"Very light lymphatic-style stroking towards the armpit is acceptable; deep massage to ‘break up a blockage’ can damage tissue (ABM 2022)."},
         {t:"👕 Support", html:"A well-fitted, supportive bra without wires pressing on the area; avoid nipple shields and topical oils or soaks."},
         {t:"👩‍🍼 Attachment help", html:"Face-to-face infant-feeding support to check positioning and attachment; NICE NG194 expects women to be told about mastitis and when to seek help."}
       ]},
       {b:"why", html:"Mastitis in a feeding mother is usually a problem of inflammation and oversupply before it is a problem of bacteria. Treating the milk-flow problem resolves most episodes, and stopping feeding on the affected side — a common instinct — makes things worse and puts the whole feeding relationship at risk."}
     ]},

    {id:"abx", nav:"Antibiotics", title:"Antibiotics — who, which, how long", sub:"Doses are those stated in the cited protocols; check the BNF before prescribing.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Trigger", tone:"cream", title:"Decide that bacterial mastitis is likely", when:"lactational", html:"Symptoms not improving after 12–24 hours of improved milk removal (WHO 2000) or 24–48 hours of conservative measures (ABM 2022), worsening, systemically unwell at presentation, or an infected nipple fissure."},
         {step:"1st line", tone:"cream", title:"Flucloxacillin", when:"no penicillin allergy", fromLabel:"prescribe", html:"<b>500 mg four times daily for 10–14 days</b> (ABM Protocol #36, 2022). Take on an empty stomach. Continue breastfeeding: negligible amounts reach milk; watch the baby for loose stools or thrush (SPS)."},
         {step:"Allergy", tone:"amber", title:"Macrolide", when:"penicillin allergy", fromLabel:"if allergic", html:"Erythromycin or clarithromycin (WHO 2000 lists erythromycin 250–500 mg four times daily; clarithromycin dose per BNF). Compatible with breastfeeding with routine infant monitoring (SPS). Check for interactions with clarithromycin."},
         {step:"Non-lactational", tone:"amber", title:"Cover anaerobes", when:"not breastfeeding, periareolar, smoker", fromLabel:"if not lactating", html:"Co-amoxiclav; if penicillin-allergic, erythromycin or clarithromycin with metronidazole (Dixon and Khan 2011). Dose and duration per BNF."},
         {step:"Not responding", tone:"red", title:"Culture, image, rethink", when:"no response at 48 hours", fromLabel:"if not better at 48 h", html:"Send milk or aspirate for culture and switch according to sensitivities (MRSA is possible). Arrange ultrasound for abscess or phlegmon. Consider the NG12 breast criteria rather than a third course."}
       ]},
       {b:"warn", html:"Admission and intravenous antibiotics are rarely needed; ABM #36 reserves them for sepsis, inability to tolerate oral treatment, or known multi-resistant organisms."}
     ]},

    {id:"abscess", nav:"Abscess", title:"Breast abscess — drainage, not just more antibiotics", sub:"Primary care confirms suspicion and gets the patient to imaging quickly.",
     blocks:[
       {b:"timeline", items:[
         {n:"1", when:"Suspect", title:"A lump, fluctuance or non-response", html:"A tender, defined mass, or mastitis that is not improving at 48 hours of the right antibiotic."},
         {n:"2", when:"Same or next day", title:"Breast service ultrasound", html:"Refer to the local breast unit or surgical assessment pathway for ultrasound. Continue antibiotics meanwhile."},
         {n:"3", when:"At imaging", title:"Needle aspiration", html:"Ultrasound-guided aspiration is the first-line drainage method and often needs repeating every few days until dry; pus goes for culture (ABM 2022)."},
         {n:"4", when:"If aspiration fails", title:"Surgical drainage", html:"Incision and drainage for very large, multiloculated or persistent abscesses, or thinned, necrotic overlying skin."},
         {n:"5", when:"Afterwards", title:"Keep feeding, check resolution", html:"She can usually continue breastfeeding, including on the affected side unless a wound or drain is in the way — then express from that side. Make sure the mass fully resolves; a residual lump needs imaging to exclude an underlying tumour."}
       ]},
       {b:"say", html:"The scan is to see whether there is a pocket of pus. If there is, they drain it with a fine needle — it may need doing more than once — and you can keep feeding your baby throughout."}
     ]},

    {id:"nonlact", nav:"Non-lactational", title:"Non-lactational mastitis", sub:"A different disease, a different antibiotic and a different differential diagnosis.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Periductal mastitis", html:"Periareolar inflammation, sometimes with nipple retraction or a mass, in younger women, strongly linked to smoking (about 90% of affected women smoke). Damaged subareolar ducts become infected, often with anaerobes. It recurs and can lead to a mammary duct fistula needing surgery.", src:"Dixon and Khan BMJ 2011"},
         {tone:"amber", h:"Treatment", html:"Co-amoxiclav, or a macrolide plus metronidazole if allergic. Abscesses are aspirated or drained by the breast team. Recurrent disease or fistula → breast surgical referral for duct excision.", src:"Dixon and Khan BMJ 2011"},
         {tone:"green", h:"Stop smoking", html:"Smoking cessation reduces recurrence risk and is a genuine treatment, not an afterthought. Offer referral to stop-smoking support.", src:"Dixon and Khan BMJ 2011"},
         {tone:"purple", h:"The NG12 lens", html:"A non-lactating woman with a breast lump aged 30 or over, skin changes suggesting cancer, or unilateral nipple retraction or discharge aged 50 or over meets NICE NG12 criteria — infection does not remove the need to exclude cancer.", src:"NICE NG12 (updated April 2026), 1.4.1–1.4.2"},
         {tone:"blue", h:"Other causes", html:"Granulomatous mastitis, infected sebaceous cysts and infection around piercings or implants are handled by the breast team; do not keep prescribing empirically.", src:"Dixon and Khan BMJ 2011"}
       ]}
     ]},

    {id:"follow", nav:"Follow-up", title:"Follow-up and safety-netting", sub:"Short intervals early; a definite end point.",
     blocks:[
       {b:"timeline", items:[
         {n:"1", when:"24 hours", title:"Self-check", html:"If not starting to improve with feeding measures, or feeling more unwell → contact the practice for antibiotics."},
         {n:"2", when:"48 hours on antibiotics", title:"Review", html:"Not clearly better → culture, ultrasound, and consider an alternative diagnosis (WHO 2000; ABM 2022)."},
         {n:"3", when:"End of course", title:"Resolution check", html:"Redness, lump and pain should have gone. Anything left → imaging, and the NG12 route if criteria are met."},
         {n:"4", when:"Recurrence", title:"Look for a cause", html:"Same site again → culture and imaging. Feeding review for recurrent lactational episodes; smoking and duct disease for non-lactational ones."}
       ]},
       {b:"say", html:"Keep feeding your baby as normal and use cold packs and ibuprofen. If you’re not starting to feel better in a day, or you feel shivery and unwell, call us. If a lump is left once the redness has gone, come back — we’ll want it scanned."}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — who, how fast, to whom", sub:"The NG12 thresholds are repeated here in NICE wording.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Emergency (999 / same day)", html:"Sepsis meeting high-risk criteria (NG255 if pregnant or recently pregnant; NG253 otherwise). Rapidly spreading cellulitis or necrotic skin over an abscess.", src:"NICE NG253 (2025) · NICE NG255 (2025)"},
         {tone:"purple", h:"Suspected cancer pathway <span class='tw'>2WW</span> · NICE NG12 breast", html:"<b>Refer</b> using a suspected cancer pathway referral for breast cancer if aged <b>30 and over with an unexplained breast lump with or without pain</b>, or aged <b>50 and over with discharge, retraction or other changes of concern in one nipple only</b> (NG12 1.4.1). <b>Consider</b> a suspected cancer pathway referral for breast cancer in people with <b>skin changes that suggest breast cancer</b>, or aged 30 and over with an unexplained lump in the axilla (NG12 1.4.2).", src:"NICE NG12 (updated April 2026), 1.4.1–1.4.2"},
         {tone:"amber", h:"Urgent breast service (within days)", html:"Suspected abscess or phlegmon for ultrasound and aspiration; mastitis not responding at 48 hours of appropriate antibiotics; recurrent infection at the same site.", src:"ABM Protocol #36 (2022, international) · Dixon and Khan BMJ 2011"},
         {tone:"cream", h:"Routine breast surgical", html:"Recurrent periductal mastitis or a mammary duct fistula.", src:"Dixon and Khan BMJ 2011"},
         {tone:"green", h:"Infant-feeding support", html:"Health visitor or infant-feeding team for attachment, supply and pumping advice — for every lactational case, and especially recurrent ones.", src:"NICE NG194 (2021) · ABM Protocol #36 (2022, international)"}
       ]},
       {b:"warn", html:"An unexplained breast lump in someone aged 30 or over does not become ‘explained’ because she is breastfeeding. If a lump persists after the inflammation has settled and is no longer explained by infection, the NG12 1.4.1 criterion applies (aged 30 and over). Under 30, NG12 recommends considering a non-urgent referral for an unexplained breast lump — but a persisting lump after mastitis still needs imaging to exclude an abscess or phlegmon."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card; the Casebook holds the full case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 31-year-old, three weeks postpartum, with a hot, red, painful area in the right breast for two days and a temperature of 38.4 °C. She has stopped feeding from that side ‘to rest it’, is pumping hard after every feed, and has been massaging the lump firmly. Her mother tells her to give up breastfeeding.", src:"SCA practice scenario (site-authored), built on ABM Protocol #36 and WHO 2000"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Checks <b>observations against NG255</b>; examines both breasts for a discrete mass; explains <b>continuing to feed on both sides</b> but <b>stopping extra pumping and deep massage</b>; recommends cold and ibuprofen; prescribes <b>flucloxacillin 500 mg QDS for 10–14 days</b> given fever over 24 hours; reassures that it is <b>safe for the baby</b>; arranges <b>review at 48 hours</b> with ultrasound if not better; safety-nets on sepsis and a persisting lump; supports her choice about feeding without judgement.", src:"ABM Protocol #36 · NICE NG255 · SPS"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Primary sources for every recommendation and figure on this page.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>Academy of Breastfeeding Medicine Clinical Protocol #36: The Mastitis Spectrum, Revised 2022</b> (Mitchell KB et al., Breastfeeding Medicine 2022) — international<br><a href="https://doi.org/10.1089/bfm.2022.29207.kbm" rel="noopener">doi.org/10.1089/bfm.2022.29207.kbm</a><span class="rd"> — the spectrum model, normal feeding without over-pumping, avoiding deep massage, cold and anti-inflammatory analgesia, flucloxacillin 500 mg four times daily for 10–14 days, aspiration as first-line abscess drainage, when admission is needed</span></li>'+
         '<li><b>World Health Organization — Mastitis: causes and management</b> (WHO/FCH/CAH/00.13, 2000) — international<br><a href="https://www.who.int/publications/i/item/WHO-FCH-CAH-00.13" rel="noopener">who.int/publications/i/item/WHO-FCH-CAH-00.13</a><span class="rd"> — when to start antibiotics (no improvement 12–24 hours after improved milk removal, severe from the outset, or nipple fissure), erythromycin 250–500 mg four times daily, indications for milk culture</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral</b> (2015, updated April 2026)<br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — breast recommendations 1.4.1 (aged 30 and over with an unexplained breast lump; aged 50 and over with unilateral nipple changes) and 1.4.2 (skin changes suggesting breast cancer; axillary lump aged 30 and over)</span></li>'+
         '<li><b>NICE NG194 — Postnatal care</b> (2021)<br><a href="https://www.nice.org.uk/guidance/ng194" rel="noopener">nice.org.uk/guidance/ng194</a><span class="rd"> — information on mastitis and when to seek help, face-to-face feeding support with positioning and attachment</span></li>'+
         '<li><b>NICE NG253 — Suspected sepsis in people aged 16 or over</b> (2025) and <b>NICE NG255 — Suspected sepsis in pregnant or recently pregnant people</b> (2025), replacing NG51<br><a href="https://www.nice.org.uk/guidance/ng253" rel="noopener">nice.org.uk/guidance/ng253</a> · <a href="https://www.nice.org.uk/guidance/ng255" rel="noopener">nice.org.uk/guidance/ng255</a><span class="rd"> — risk stratification and emergency transfer</span></li>'+
         '<li><b>Dixon JM, Khan LR. Treatment of breast infection.</b> BMJ 2011;342:d396<span class="rd"> — lactational and non-lactational antibiotic choice, periductal mastitis and smoking (about 90%), anaerobes, recurrence and fistula, abscess aspiration</span></li>'+
         '<li><b>Specialist Pharmacy Service — Using penicillin antibiotics during breastfeeding; Using macrolide antibiotics during breastfeeding</b><br><a href="https://www.sps.nhs.uk/home/guidance/safety-in-breastfeeding/" rel="noopener">sps.nhs.uk</a><span class="rd"> — compatibility with breastfeeding and what to monitor in the infant</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — current doses and interactions for clarithromycin, co-amoxiclav, metronidazole, ibuprofen and paracetamol</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Mastitis and breast abscess in primary care, lactational and non-lactational. Sources: ABM Protocol #36 (2022, international), WHO Mastitis (2000, international), NICE NG12 (updated April 2026), NICE NG194 (2021), NICE NG253 and NG255 (2025), Dixon and Khan BMJ 2011, SPS breastfeeding guidance and the BNF. Not a substitute for clinical judgement or your local formulary."
});
</script>
