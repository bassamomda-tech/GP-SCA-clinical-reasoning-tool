<title>Chalazion (Meibomian Cyst) — Protocol · Reasoning GP</title>
<meta name="description" content="Chalazion in primary care: separate orbital from preseptal cellulitis, warm compresses and gentle massage, no routine antibiotics, review at about 4–6 weeks (a reassessment, not automatic surgery), referral for assessment kept separate from referral for removal, specialist-guided doxycycline only, lower threshold in children, and specialist assessment with biopsy consideration for same-site recurrent or atypical lid lumps." />

<script>
MG.render({
  icon:"👁️",
  title:"Chalazion (meibomian cyst) — the complete guide",
  eyebrow:"Protocol · adults and children · eyelid lump",
  stemTitle:"A chalazion is usually a non-infectious lipogranulomatous inflammation from a blocked meibomian gland — conservative care first, no routine antibiotics, and specialist review for the same-site recurrence",
  stemSub:"<b>Primary-care management of a chalazion.</b> Treat an uncomplicated lesion with warm compresses, gentle massage and — where there is underlying blepharitis or MGD — lid hygiene. <b>Do not prescribe antibiotics routinely.</b> Improvement may take weeks or months. Review if it is not clearly improving after about 4–6 weeks of regular conservative care — to reassess the diagnosis, visual effect and need for referral, not automatically for surgery. Refer for assessment if it is large, symptomatic, vision-affecting, recurrent or atypical; refer for elective removal only when local commissioning criteria are met. Children need a lower threshold. A same-site recurrence, lash loss, ulceration or lid-margin distortion needs specialist assessment with consideration of biopsy. <b>Orbital signs, acute visual loss or corneal involvement need emergency eye assessment.</b> Local pathways supersede this educational summary.",
  guideline:"College of Optometrists CMG — chalazion · NICE NG12 · Greater Manchester EUR policy · Greater Manchester antimicrobial guidelines · Moorfields paediatric chalazion guidance · RCOphth · MHRA SPCs",
  reviewed:"25 September 2026",
  nextReview:"25 September 2027",
  meta:[
    {t:"Orbital signs = emergency", tone:"tw"},
    {t:"Same-site recurrence = consider biopsy", tone:"tw"},
    {t:"v2.1 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#assess"><b>Assess</b><small>Chalazion, stye or cellulitis</small></a><a href="#manage"><b>Manage</b><small>Conservative first</small></a><a href="#children"><b>Children</b><small>Lower threshold</small></a><a href="#lesion"><b>Atypical lumps</b><small>Consider biopsy</small></a><a href="#refer"><b>Refer</b><small>Assessment vs removal</small></a></div>',
  quickSub:"The five that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Orbital cellulitis — emergency", html:"Painful or restricted eye movements · proptosis · diplopia · reduced vision or impaired colour vision · relative afferent pupillary defect · chemosis · severe retro-orbital pain · systemic toxicity · severe headache or persistent vomiting · meningism or altered consciousness · rapidly progressive swelling · eye cannot be examined because of swelling → <b>emergency hospital assessment</b> with ophthalmology/paediatric involvement as appropriate — A&E or ambulance transfer if systemically unwell or vision is compromised. If unsure whether it is preseptal or orbital, seek urgent senior or ophthalmology advice rather than managing as simple preseptal cellulitis."},
    {tone:"amber", h:"Preseptal cellulitis — same day", html:"Diffuse erythematous, warm, tender lid swelling (not an isolated localised hordeolum or mildly inflamed chalazion) with normal eye movements, no proptosis and normal vision → <b>same-day clinical assessment</b>. In children, the systemically unwell, those with marked swelling, or where the eye cannot be adequately examined, seek same-day paediatric/ophthalmic assessment. Treat according to the current Greater Manchester antimicrobial pathway."},
    {tone:"green", h:"Conservative care, then review at about 4–6 weeks", html:"A comfortably warm (not scalding) compress for 5–10 minutes, then gentle massage towards the lid margin, 2–4 times a day, continued regularly for several weeks. Do not squeeze, puncture or lance. Improvement can take weeks or months, and symptoms may ease before the lump goes. Review is to reassess the diagnosis, vision and need for referral — not automatically for surgery. Small, asymptomatic lesions can be observed for longer."},
    {tone:"amber", h:"No routine antibiotics", html:"An uncomplicated chalazion is non-infectious — do not prescribe antibiotics just because it is large, red or inflamed. An uncomplicated hordeolum usually settles with warm compresses; consider topical antibiotic only for clinically supported secondary bacterial infection, significant blepharoconjunctivitis, discharge or spreading cellulitis, per the local antimicrobial pathway — never repeated courses for a recurrent 'chalazion' without reassessing the diagnosis."},
    {tone:"amber", h:"Same-site recurrence → specialist review", html:"Unilateral recurrence in the same place, lash loss, ulceration, bleeding, induration, lid-margin distortion or diffuse thickening → specialist assessment with consideration of biopsy. Sebaceous carcinoma can masquerade as a chalazion or chronic unilateral blepharoconjunctivitis. Do not repeatedly drain, curette or prescribe antibiotics for it without specialist reassessment."}
  ],
  pathwaySub:"Five steps.",
  pathway:[
    {title:"Exclude orbital and preseptal cellulitis", html:"Orbital signs → emergency; preseptal cellulitis → same-day assessment; uncertain preseptal vs orbital → urgent senior or ophthalmology advice.", alert:true},
    {title:"Assess the lump", html:"Site, size, duration, lid eversion only if trained and it will alter management, acuity (or visual behaviour in a child) if vision may be affected, atypical features, associated blepharitis, MGD or rosacea."},
    {title:"Conservative care", html:"Warm compress and massage; lid hygiene where there is underlying lid disease; no routine antibiotics."},
    {title:"Review at about 4–6 weeks", html:"Reassess the diagnosis, vision and need for referral — not automatic surgery. Large, symptomatic or vision-affecting → eye-care assessment; elective removal only when local commissioning criteria are met. Lower threshold in children."},
    {title:"Refer the recurrent or atypical", html:"Specialist assessment with consideration of biopsy; no repeated drainage or antibiotics; suspected-cancer pathway when the clinical appearance meets NICE NG12 criteria."}
  ],
  sections:[

    {id:"assess", nav:"Assess", title:"Step 1 — chalazion, hordeolum or cellulitis?",
     blocks:[
       {b:"table", head:["Picture","Features","Action"], rows:[
         ["<b>Chalazion</b>","Firm, slowly enlarging lump in the body of the lid — usually a non-infectious lipogranulomatous inflammation from meibomian-gland obstruction. It may follow a hordeolum and can occasionally become secondarily infected. It may be tender or inflamed at first, so the distinction from a hordeolum is not always absolute","Conservative care"],
         ["<b>Hordeolum (stye)</b>","An acute, tender inflammatory or infective lesion, external at the lash line or internal within the lid","An uncomplicated hordeolum usually settles with warm compresses. Consider topical antibiotic only for clinically supported secondary bacterial infection, significant blepharoconjunctivitis, discharge or spreading cellulitis, per the local antimicrobial pathway"],
         ["<b>Preseptal cellulitis</b>","Diffuse erythematous, warm, tender lid swelling — not an isolated localised hordeolum or mildly inflamed chalazion; normal eye movements; no proptosis; vision normal","Same-day clinical assessment. Children, the systemically unwell, marked swelling or an eye that cannot be adequately examined → same-day paediatric/ophthalmic assessment. Treat per the current Greater Manchester antimicrobial pathway"],
         ["<b>Orbital cellulitis</b>","Painful or restricted eye movements, proptosis, diplopia, reduced or impaired colour vision, RAPD, chemosis, severe retro-orbital pain, systemic toxicity, severe headache or vomiting, meningism or altered consciousness, rapidly progressive swelling","Emergency hospital assessment with ophthalmology/paediatric involvement — A&E or ambulance if systemically unwell or vision is compromised. If unsure preseptal vs orbital, seek urgent senior or ophthalmology advice"],
         ["<b>Atypical lid lump</b>","Lash loss, ulceration, bleeding, induration, lid-margin distortion, diffuse unilateral thickening, persistent unilateral blepharoconjunctivitis, atypical pigmentation or colour, rapid growth, same-site recurrence, failure to respond as expected","See Atypical lumps"]
       ]},
       {b:"table", head:["Examine","Detail"], rows:[
         ["<b>The lump</b>","Exact lid and lesion location · duration and change over time · size · tenderness and erythema · lash loss, ulceration, bleeding, induration and lid-margin distortion · evert the lid only if trained and able to do so safely, and if it will alter management — do not delay urgent referral when examination is limited by swelling or pain"],
         ["<b>The eye</b>","Visual acuity (or visual behaviour in a child) if vision may be affected · corneal distortion or visual symptoms · conjunctival or corneal involvement · contact-lens use where there is a red or painful eye"],
         ["<b>If cellulitis is possible</b>","Ocular motility and pain on movement, proptosis, pupils (RAPD), colour vision, chemosis, temperature, fever and systemic state"],
         ["<b>History</b>","Previous chalazia, lesions and procedures, blepharitis, meibomian gland dysfunction, rosacea"],
         ["<b>Document</b>","All of the above findings; photographs only in accordance with local information-governance requirements"]
       ]},
       {b:"why", html:"A persistent unilateral lesion should not be relabelled as a benign chalazion again and again without reconsidering the diagnosis."}
     ]},

    {id:"manage", nav:"Manage", title:"Step 2 — conservative care first",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"🔥 Warm compress and massage", html:"Wash hands. Apply a comfortably warm (not scalding) compress to the closed eyelid for 5–10 minutes, followed by gentle massage towards the lid margin, two to four times daily. Continue regularly for several weeks. Wash hands after."},
         {tone:"amber", h:"🚫 Don't squeeze", html:"Do not squeeze, puncture or lance the lump. Avoid eye make-up and contact lenses while it is inflamed."},
         {tone:"green", h:"🧽 Lid hygiene where there is lid disease", html:"Daily lid-margin cleaning matters most with blepharitis, meibomian gland dysfunction, ocular rosacea, or recurrent or multiple chalazia. It is not mandatory intensive treatment for an isolated first episode. Proprietary lid wipes or clean water are generally simpler than baby shampoo and avoid ocular irritation; follow local advice. See <a href='blepharitis.html'>blepharitis</a>."},
         {tone:"green", h:"⏳ Expect weeks, not days", html:"Resolution may take weeks or months; conservative care may improve symptoms without rapidly removing the lump. Small, asymptomatic lesions can be observed. Review if not clearly improving after about 4–6 weeks of regular conservative care — to reassess the diagnosis, visual effect and need for referral; it does not automatically indicate surgery. Persistent but uncomplicated lesions may be observed longer if asymptomatic and not affecting vision."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"💊 Recurrent or multiple chalazia with MGD or ocular rosacea — specialist-guided", html:"For recurrent or multiple chalazia associated with significant MGD or ocular rosacea, optimise lid hygiene and manage the underlying condition first. A time-limited oral tetracycline may be considered only after appropriate assessment, preferably with advice from an optometrist/ophthalmologist or clinician experienced in ocular surface disease; use for this indication may be off-label and should follow local guidance. This is not routine treatment for an isolated chalazion. <b>Cautions:</b> do not routinely prescribe for this indication in children under 12 years · avoid initiating in pregnancy or breastfeeding unless a specialist has advised that the benefits outweigh the risks — seek specialist or medicines-in-pregnancy advice · photosensitivity · gastrointestinal effects · oesophagitis — take with plenty of water and remain upright after administration · separate from iron, calcium, magnesium and antacids · avoid concurrent systemic retinoids where possible. Severe headache, vomiting or visual disturbance may indicate intracranial hypertension; stop the suspected medicine and arrange urgent assessment — the risk is increased with concomitant tetracyclines and systemic retinoids such as isotretinoin. Check the current product information (SPC) for the exact formulation and the local formulary."},
         {tone:"blue", h:"💉 Procedures are specialist-only", html:"Biopsy, incision and curettage, and intralesional steroid injection (for selected smaller or softer lesions) are specialist procedures and should not be performed in routine GP practice unless the clinician has specific training, competence, governance and an agreed local pathway. For a recurrent or suspicious lesion, specialist assessment should occur before further destructive treatment — repeated curettage can delay diagnosis and may remove tissue without appropriate histological handling. All removed recurrent or suspicious tissue should be sent for histology. Steroid injection risks include skin depigmentation, raised intraocular pressure and inadvertent ocular injury."}
       ]}
     ]},

    {id:"children", nav:"Children", title:"Children — a lower threshold",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"Refer sooner", html:"In children, assess visual behaviour/acuity where feasible, and ask about squint, reduced vision or abnormal head posture. Assess whether the lesion affects vision, causes corneal distortion, induces astigmatism or is associated with a squint — large or persistent chalazia can cause amblyopia, especially in younger children. Refer promptly for a large, prolonged, recurrent, visually significant or lid-distorting lesion, recurrent infection, or significant parental concern. Use a same-day pathway for acute diffuse swelling, suspected preseptal cellulitis or any concern about orbital involvement — urgently if orbital cellulitis is possible."},
         {tone:"amber", h:"Be cautious", html:"Do not use adult doxycycline advice in children without specialist input. Do not assume a persistent lid lump in a child is a simple chalazion if it is atypical or accompanied by systemic illness. Children with lid swelling are more likely to have preseptal or orbital cellulitis — assess the same day."}
       ]}
     ]},

    {id:"lesion", nav:"Atypical lumps", title:"Recurrent or atypical lumps — consider biopsy",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"Refer for specialist assessment and consideration of biopsy", html:"A lesion recurring in the same place, particularly if unilateral · lash loss (madarosis) · ulceration or bleeding · induration · lid-margin distortion · diffuse unilateral lid thickening · persistent unilateral blepharoconjunctivitis · atypical pigmentation or colour, or rapid growth · failure to respond as expected. Not every recurrence is cancer — but none should be treated repeatedly as benign without specialist review. Do not repeatedly drain, curette or prescribe antibiotics: refer for specialist assessment and biopsy consideration before further destructive treatment. Tissue from recurrent chalazia should generally be submitted for histological examination (RCOphth)."},
         {tone:"purple", h:"Suspected skin cancer of the lid <span class='tw'>Suspected cancer</span>", html:"Do not refer every recurrent chalazion through the suspected-cancer pathway — refer for specialist assessment and biopsy consideration. <b>NICE NG12:</b> suspected melanoma → suspected cancer pathway referral according to the relevant criteria · suspected squamous cell carcinoma → consider suspected cancer pathway referral · suspected basal cell carcinoma → usually non-urgent referral; consider a suspected cancer pathway referral only where delay may significantly affect outcome because of factors such as site or size. The eyelid may justify urgency, but this should be determined by the specialist/local pathway rather than assumed automatically. Sebaceous carcinoma may mimic recurrent chalazion or unilateral blepharoconjunctivitis, but it is not itself a specific NG12 referral criterion. Suspected malignancy follows the local suspected-cancer or eyelid-lesion pathway, not a routine benign-lesion referral."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Step 5 — review and referral",
     blocks:[
       {b:"table", head:["When","Situation","Action"], rows:[
         ["<b>Emergency</b>","Orbital signs — painful or restricted eye movements, proptosis, diplopia, reduced vision or colour vision, RAPD, chemosis, severe systemic illness, severe headache, vomiting or neurological symptoms, rapidly progressive swelling, or inability to examine the eye with concern for orbital disease","Emergency hospital assessment with ophthalmology/paediatric involvement — A&E or ambulance transfer if systemically unwell or vision is compromised"],
         ["<b>Same day</b>","Suspected preseptal cellulitis · acute red, hot and spreading lid swelling · fever or systemic symptoms · significant swelling in a child · acute visual change · corneal involvement or associated red-eye signs · diagnostic uncertainty between hordeolum, cellulitis and orbital disease","Local urgent pathway; same-day paediatric/ophthalmic assessment for children"],
         ["<b>Prompt assessment</b>","Affects vision · corneal distortion or induced astigmatism · large, painful or significantly symptomatic lesion · diagnosis uncertain · recurrent preseptal cellulitis · recurrence at the same site · inability to examine the eye adequately · children with a large, prolonged or visually significant lesion, or significant parental concern","Optometry or ophthalmology assessment — not a removal referral"],
         ["<b>Review at about 4–6 weeks</b>","Not clearly improving despite regular conservative care — reassess the diagnosis, visual effect and need for referral; persistent but uncomplicated, asymptomatic lesions not affecting vision may be observed longer","Continue conservative care, or refer for assessment if any prompt-assessment feature is present"],
         ["<b>Elective removal</b>","Only when local commissioning criteria are met — e.g. persistent troublesome disease despite an adequate conservative trial, significant visual/cosmetic impact or recurrent infection. Atypical lesions must not be routed through a routine removal pathway","Community or independent-prescribing optometrist, a minor-eyelid-lesion service, or ophthalmology/oculoplastics, per local commissioning — check the exact current Greater Manchester EUR policy criteria"],
         ["<b>By features</b>","Same-site recurrence or atypical lesion","Specialist assessment with consideration of biopsy — not a routine removal pathway; no repeated drainage or antibiotics; suspected-cancer pathway only where NG12 criteria are met"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"Safety-net", html:"\"If the eyelid becomes hot, red and swollen and it's spreading, you feel unwell, it hurts to move your eye, or your vision changes — get seen the same day. If your eye bulges, you see double, your vision is reduced, or you have a severe headache, vomiting or feel very unwell — go to A&E or call 999.\""},
         {tone:"cream", h:"GP management", html:"Distinguishing chalazion, hordeolum and cellulitis, conservative care and timely referral belong here. Use the local eye-casualty, paediatric and community-optometry referral routes; local pathways supersede this educational summary. Related pages: <a href='blepharitis.html'>blepharitis</a> · <a href='rosacea.html'>rosacea</a> · <a href='cellulitis.html'>cellulitis</a>."}
       ]},
       {b:"say", html:"This is a chalazion — a blocked oil gland in the eyelid. It usually isn't an infection, so antibiotics won't help. Warm compresses and a gentle massage a few times a day may help the gland drain; it can take weeks or even months to go completely, though it may feel better sooner. Please don't squeeze it. If it isn't clearly better in about 4–6 weeks, we'll look at it again; if it bothers your vision, we can refer you sooner. Get seen the same day if the eyelid becomes hot, swollen and painful, you feel unwell, it hurts to move your eye, or your vision changes."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 67-year-old has had a lump on the same upper eyelid drained twice. It has come back, and she has lost some lashes over it. She asks for another referral to 'have it popped' and some antibiotic cream."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Recognises same-site recurrence and lash loss as atypical; explains honestly, without alarming, why malignancy must be excluded; refers for specialist assessment with consideration of biopsy, not another drainage, and applies NG12 criteria (suspected-cancer pathway if SCC or melanoma is suspected, or a suspected BCC where site or size makes delay significant); declines antibiotics with a clear reason; checks for cellulitis; safety-nets."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>College of Optometrists — Clinical Management Guideline: chalazion (meibomian cyst)</b> (verify current version, publication date and URL before implementation)<br><a href="https://www.college-optometrists.org/clinical-guidance/clinical-management-guidelines" rel="noopener">college-optometrists.org — Clinical Management Guidelines</a><span class="rd"> — conservative care, referral for persistent and atypical lesions</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — skin cancer referral criteria</span></li>'+
         '<li><b>Greater Manchester EUR policy statement — eyelid lesions (link the exact current policy)</b><span class="rd"> — commissioning criteria for elective removal; not for atypical or suspicious lesions</span></li>'+
         '<li><b>MHRA SPC — doxycycline (exact formulation used)</b><br><a href="https://products.mhra.gov.uk/" rel="noopener">products.mhra.gov.uk</a><span class="rd"> — cautions and interactions</span></li>'+
         '<li><b>Greater Manchester Medicines Management Group — Greater Manchester Antimicrobial Guidelines</b> (October 2024)<br><a href="https://gmmmg.nhs.uk/" rel="noopener">gmmmg.nhs.uk</a><span class="rd"> — preseptal cellulitis and eye-infection treatment; linked rather than paraphrased</span></li>'+
         '<li><b>Moorfields Eye Hospital — Chalazion (paediatric guidance)</b><br><a href="https://www.moorfields.nhs.uk/" rel="noopener">moorfields.nhs.uk</a><span class="rd"> — conservative care for uncomplicated early lesions; non-urgent referral for chronic, recurrent, large, uncomfortable or vision-affecting lesions</span></li>'+
         '<li><b>Royal College of Ophthalmologists — Emergency eye care in hospital eye units and secondary care</b> (15 May 2024)<br><a href="https://www.rcophth.ac.uk/" rel="noopener">rcophth.ac.uk</a><span class="rd"> — clear pathways for emergency transfer of acutely unwell patients</span></li>'+
         '<li><b>Royal College of Ophthalmologists — Ophthalmic Pathology Services Guidance</b> (21 March 2024)<br><a href="https://www.rcophth.ac.uk/" rel="noopener">rcophth.ac.uk</a><span class="rd"> — recurrent chalazia should generally be submitted for histological examination</span></li>'+
         '<li><b>NICE NG198 — Acne vulgaris: management</b><br><a href="https://www.nice.org.uk/guidance/ng198" rel="noopener">nice.org.uk/guidance/ng198</a><span class="rd"> — oral tetracyclines not used in pregnancy; doxycycline restricted in younger children</span></li>'+
         '</ul></div>'},
       {b:"why", html:"This is an educational summary; local pathways supersede it. Before standalone use, verify the current version, publication date and URL of the College of Optometrists guideline and the exact current Greater Manchester removal policy, and add local service names, emergency eye-casualty contacts, the paediatric referral route, a named clinical owner, approval body, version and review date."}
     ]}
  ],
  foot:"Chalazion in primary care. Orbital signs — painful or restricted eye movements, proptosis, diplopia, visual impairment — need emergency assessment; suspected preseptal cellulitis needs same-day assessment. Warm compress and gentle massage; lid hygiene where there is underlying lid disease; no routine antibiotics; doxycycline only specialist-guided for recurrent disease with MGD or ocular rosacea. Review at about 4–6 weeks to reassess, not automatically for surgery; refer for assessment if large, symptomatic, vision-affecting or recurrent, with a lower threshold in children; elective removal only when local commissioning criteria are met. Same-site recurrent or atypical lesions: specialist assessment with consideration of biopsy, not repeated drainage; suspected-cancer pathway where NICE NG12 criteria are met. Sources: College of Optometrists CMG, NICE NG12, Greater Manchester EUR policy, Greater Manchester antimicrobial guidelines, Moorfields, RCOphth, MHRA SPC. Local pathways supersede this educational summary."
});
</script>
