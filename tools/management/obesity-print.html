MG.render({

  stemTitle:"Framing obesity as a chronic relapsing disease driven by biology and environment changes the medicine — you screen for comorbidity, treat to protect organs, expect relapse, and support long-term rather than moralise",
  stemSub:"One page for the whole condition. Classify with <b>ethnicity-adjusted thresholds</b>, which matter enormously in UK primary care, and <b>ask permission before discussing weight at all</b> — the opening line decides whether the patient engages. Look for secondary causes selectively and review weight-promoting medicines with the original prescriber; ask about eating behaviour, loss-of-control eating and mental health early, and if an eating disorder is suspected avoid unsupervised restrictive dieting and arrange support alongside weight-management care. Then an individualised health goal, the GLP-1 era with its real criteria, stopping rules and <b>local NHS Greater Manchester commissioning</b> (NICE eligibility does not guarantee immediate local access), bariatric surgery, and post-bariatric follow-up — at least 2 years with the bariatric service, then lifelong annual monitoring through shared care.",
  guideline:"NICE NG246 (2025) · NICE TA875 (2023) · NICE TA1026 (2024) · NHS England tirzepatide interim commissioning guidance (2025) · GMMMG incretin therapy guidance (2026)",

  nextReview:"14 March 2027",
  meta:[
    {t:"NICE NG246 — obesity identification and management"},

    {t:"Ask about eating behaviour early — no unsupervised restrictive diet if BED suspected", tone:"tw"},

  ],
  lead:'<div class="mg-layers"><a href="#classify"><b>Classify</b><small>Ethnicity-adjusted</small></a><a href="#causes"><b>Causes</b><small>Secondary · drugs</small></a><a href="#foundation"><b>Foundation</b><small>Individual goals</small></a><a href="#drugs"><b>Drugs</b><small>Criteria · local access</small></a><a href="#surgery"><b>Surgery</b><small>Shared aftercare</small></a></div>',
  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"blue", h:"Ethnicity-adjusted thresholds, and waist-to-height below BMI 35", html:"<b>Overweight 25–29.9 · obesity I 30–34.9 · II 35–39.9 · III ≥40.</b> Lower thresholds for South Asian, Chinese and other high-risk groups: overweight from 23, obesity from 27.5 — the same cardiometabolic risk arrives at a lower BMI. In adults with BMI below 35, use waist-to-height ratio as a practical estimate of central adiposity; a ratio of 0.5 or more indicates increased health risk. Do not rely on it to further classify risk at BMI ≥35. BMI classification does not by itself establish eligibility for a weight-management medicine or NHS-funded treatment."},
    {tone:"green", h:"Ask permission before discussing weight", html:"Ask permission to discuss weight; use neutral language — \"weight\" and \"BMI\", not \"obese\" or \"fat\" — and set person-centred goals. <b>The opening line determines whether the patient engages at all</b>, and a consultation that begins badly here is usually lost for years, not minutes."},
    {tone:"red", h:"⚠ Ask about eating behaviour and mental health early", html:"Ask about eating behaviour, loss-of-control eating, compensatory behaviours and mental health early. If binge-eating disorder or another eating disorder is suspected, avoid unsupervised restrictive dieting and arrange appropriate psychological or eating-disorder support alongside weight-management care. Supportive care can start meanwhile — permission-based discussion, regular eating, reducing stigma and shame, avoiding crash diets. Treat depression in its own right."},
    {tone:"amber", h:"Look for the drug that is causing it", html:"Antipsychotics (especially olanzapine and clozapine), steroids, insulin and sulfonylureas, sodium valproate, some antidepressants, gabapentinoids. Do not stop or switch antipsychotics, insulin, antiseizure medicines or other specialist treatment without agreement from the prescribing team; consider weight-neutral alternatives where clinically appropriate, balancing psychiatric, neurological or glycaemic control against weight effects. Investigate secondary causes (hypothyroidism, Cushing's, PCOS, hypothalamic disease) only when suggested by the history or examination."},
    {tone:"green", h:"Agree an individualised health goal", html:"Even modest weight loss (often 5–10%) may improve blood pressure, glycaemia, lipids, MASLD, obstructive sleep apnoea and fertility, but the appropriate target depends on baseline BMI, comorbidity, eating behaviour, age, frailty and patient preference. Treat comorbidities whether or not weight loss occurs, and do not frame regain as a failure of engagement. <b>Sell the health wins, not a target dress size.</b> <b>And say that activity holds weight off more than it takes it off</b> — framing it honestly prevents the disillusionment that ends the attempt."},
    {tone:"amber", h:"GLP-1 drugs treat a chronic disease — the weight returns when they stop", html:"Trial-population averages are around 15% loss with semaglutide 2.4 mg weekly and around 20% with tirzepatide 10–15 mg weekly — not an expected individual result. Weight is commonly regained when they stop (STEP-4 and similar), so the chronic-disease analogy is useful counselling, not a prescribing rule: duration depends on response, adverse effects, preference, pregnancy plans, local commissioning and an alternative long-term strategy. <b>Counsel that upfront, offer support to maintain weight loss when they stop</b>, and beware unregulated online supply."}
  ],
  pathwaySub:"Six steps; eating behaviour and mental health are assessed early, alongside the rest.",
  pathway:[
    {title:"Classify and assess — after asking permission", html:"Ethnicity-adjusted BMI, waist-to-height ratio if BMI is below 35, eating behaviour, mental health, sleep, mobility, medications and social determinants."},
    {title:"Screen for secondary causes, comorbidity and eating disorder", html:"HbA1c, BP, lipids and QRISK3, MASLD/FIB-4 where indicated, and OSA symptoms; TFTs, Cushing's or PCOS assessment only where clinically indicated; review weight-promoting medicines with the original prescriber. <b>Ask about binge-eating and depression early, and arrange support alongside weight care.</b>", alert:true},
    {title:"Build the foundation: lifestyle, behaviour, Tier 2", html:"A sustainable deficit, activity, behavioural support and a structured programme referral — aiming at individualised health goals."},
    {title:"Add pharmacotherapy within the criteria", html:"Semaglutide (specialist weight-management service) or tirzepatide (current NHS England and NHS Greater Manchester pathway) where NICE TA875 or TA1026 and local commissioning criteria are met, with the review rules applied; orlistat as an alternative."},
    {title:"Consider bariatric surgery", html:"Refer for specialist multidisciplinary assessment at BMI ≥40, or ≥35 with a significant comorbidity that would improve (lower thresholds for relevant ethnic groups) — and expedite recent-onset T2DM as defined by NG246."},
    {title:"Review, expect relapse, and maintain the aftercare", html:"Cardiometabolic screen annually, drug efficacy against the stopping rule, and shared-care post-bariatric monitoring after the bariatric service's 2-year follow-up."}
  ],
  sections:[

    {id:"classify", nav:"Classify", title:"Step 1 — classify by BMI and waist, and ask permission first",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>BMI categories</b>","<b>Overweight 25–29.9 · obesity I 30–34.9 · II 35–39.9 · III ≥40.</b> Lower thresholds for South Asian, Chinese and other high-risk groups: overweight ≥23, obesity ≥27.5 — the same cardiometabolic risk at a lower BMI. Classification does not automatically establish drug eligibility, which depends on the medicine, a qualifying weight-related comorbidity, specialist-service criteria and local commissioning"],
         ["<b>Waist and waist-to-height</b>","Measure waist circumference. In adults with BMI below 35, use waist-to-height ratio as a practical estimate of central adiposity; a ratio of 0.5 or more indicates increased health risk. Do not rely on waist-to-height ratio to further classify risk at BMI ≥35"],
         ["<b>Raise it sensitively</b>","Ask permission to discuss weight. Use neutral language — \"weight\", \"BMI\", not \"obese\" or \"fat\" — and set person-centred goals. <b>The opening line sets whether they engage at all</b>"],
         ["<b>Assess</b>","Eating behaviour including loss-of-control eating and compensatory behaviours, mental health, sleep and OSA, mobility, medications that drive gain, readiness to change, and social determinants — food access, shift work, finances"]
       ]},
       {b:"why", html:"Obesity is a chronic relapsing disease driven by biology and environment, not willpower — and the framing changes the medicine. You screen for comorbidity, treat to protect organs, expect relapse, and support long-term rather than moralise. <b>Ethnicity-adjusted thresholds matter enormously in UK primary care</b>, where using the standard cut-offs systematically under-treats the populations at highest cardiometabolic risk."}
     ]},

    {id:"causes", nav:"Causes", title:"Step 2 — secondary causes, and the comorbidity that IS the reason to treat",
     blocks:[
       {b:"table", head:["What to screen for","Detail"], rows:[
         ["<b>Secondary causes — selectively</b>","Investigate when suggested by the history or examination — for example rapid or disproportionate weight gain, Cushingoid features, amenorrhoea or androgen excess (PCOS), hypothalamic disease, or relevant medicines. TFTs where there are symptoms or other clinical indications. Routine investigation for Cushing's syndrome or hypothalamic disease is not indicated in uncomplicated obesity"],
         ["<b>Drug-induced gain</b>","Antipsychotics — especially olanzapine and clozapine · steroids · insulin and sulfonylureas · sodium valproate · some antidepressants · gabapentinoids. Do not stop or switch antipsychotics, insulin, antiseizure medicines or other specialist treatment without agreement from the prescribing team"],
         ["<b>Cardiometabolic screen</b>","HbA1c (type 2 diabetes) · blood pressure · lipids and QRISK3 · MASLD/NAFLD with FIB-4 · gout. These are the outcomes you are preventing, and they justify the intensity of treatment"],
         ["<b>Obstructive sleep apnoea</b>","Snoring, witnessed apnoeas and daytime somnolence → Epworth or STOP-BANG (screening tools, not diagnostic tests; STOP-BANG may overestimate risk in some populations) → refer according to the local sleep-service pathway. Do not delay other obesity treatment while awaiting a sleep study. Untreated OSA carries its own cardiovascular risk"],
         ["<b>Mental health and eating disorder</b>","Ask about eating behaviour, loss-of-control eating, compensatory behaviours and mental health early. If binge-eating disorder or another eating disorder is suspected, avoid unsupervised restrictive dieting and arrange appropriate psychological or eating-disorder support alongside weight-management care; address depression alongside, not necessarily before, all weight management"]
       ]},
       {b:"warn", html:"<b>Review medicines that may contribute to weight gain.</b> Do not stop or switch antipsychotics, insulin, antiseizure medicines or other specialist treatment without agreement from the prescribing team. Consider weight-neutral alternatives where clinically appropriate, balancing psychiatric, neurological or glycaemic control against weight effects — particularly with olanzapine, clozapine, sodium valproate and insulin."}
     ]},

    {id:"foundation", nav:"Foundation", title:"Step 3 — Tier 1–2: lifestyle and behaviour, the base of everything",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"🥗 Diet", html:"A sustainable deficit of around 600 kcal/day, or a structured programme; cut sugary drinks and ultra-processed food. Total diet replacement at around 800 kcal/day can achieve substantial loss and type 2 diabetes remission in selected patients, but low- and very-low-energy diets are not a long-term strategy and should be delivered through an appropriate NHS or specialist pathway with medication adjustment and monitoring — particularly in diabetes, CKD, frailty, eating disorders and people taking insulin or sulfonylureas. See <a href='type-2-diabetes.html'>type 2 diabetes</a>."},
         {tone:"green", h:"🏃 Activity", html:"Build to at least 150 minutes a week of moderate activity plus resistance work; reduce sedentary time. Activity holds weight off more than it takes it off — frame that honestly."},
         {tone:"blue", h:"🧠 Behaviour", html:"Behavioural support, self-monitoring and goal-setting; refer to a structured Tier-2 weight-management service, which is the evidence-based way this is delivered."},
         {tone:"green", h:"🎯 An individualised goal", html:"Agree an individualised health goal. Even modest weight loss may improve cardiometabolic risk, BP, glycaemia, lipids, MASLD, OSA and fertility, but the appropriate target depends on baseline BMI, comorbidity, eating behaviour, age, frailty and patient preference. <b>Sell the health wins, not a target dress size.</b>"},
         {tone:"amber", h:"🤝 Barriers", html:"<b>Sleep, mood, medication-related gain, finances, the food environment</b> — address the real obstacles rather than restating the advice."},
         {tone:"green", h:"🔁 Expect relapse", html:"<b>Weight regain is the biology of the disease, not failure.</b> <b>Re-engage non-judgementally, every time</b> — the willingness to do that is what keeps people coming back."}
       ]},
       {b:"say", html:"Even a modest weight loss can improve your blood pressure, your sugars and your sleep, and we will agree a goal that fits you — we are chasing health, not a number on a chart. And if the weight creeps back, that is the condition, not you failing; we just pick it back up together."}
     ]},

    {id:"drugs", nav:"Drugs", title:"Step 4 — the GLP-1 era: named agents, criteria and stopping rules",
     blocks:[
       {b:"table", head:["Agent","Dose and efficacy","Criteria and cautions"], rows:[
         ["<b>Semaglutide (Wegovy) — GLP-1 agonist; a specialist weight-management medicine for eligible adults, alongside a reduced-calorie diet and increased physical activity</b>","2.4 mg SC weekly, titrated according to the product information. Around 15% mean loss in trial populations — not an expected individual result","NICE TA875: within a specialist weight-management service; BMI ≥35, or 30–34.9 meeting referral criteria, with lower cut-offs for high-risk ethnicity, plus at least one weight-related comorbidity. Used only after dietary, physical-activity and behavioural approaches have been started and evaluated (NG246). <b>Normally a maximum of 2 years under TA875</b>; consider stopping if less than 5% of the initial weight has been lost after 6 months; continuing needs an ongoing benefit/risk assessment and a plan for weight maintenance after stopping. Counsel: nausea (titrate slowly), gallstones, rare pancreatitis, pause peri-operatively per anaesthetic guidance. Not in pregnancy — stop if pregnancy occurs and at least 2 months before a planned pregnancy"],
         ["<b>Tirzepatide (Mounjaro) — dual GIP/GLP-1</b>","Titrated to 10–15 mg SC weekly. Around 20% mean loss in trial populations — individual response varies, and comparisons depend on dose, population, duration and background intervention","NICE TA1026 approves it for weight management at BMI ≥35 with at least one weight-related comorbidity (lower thresholds for high-risk ethnic groups); not limited to 2 years, but if less than 5% of the initial weight has been lost after 6 months on the highest tolerated dose, discuss whether to continue based on benefits and risks; ongoing prescribing depends on response, tolerability, funding and local pathway requirements. <b>Tirzepatide may be prescribed only within the current NHS England and NHS Greater Manchester weight-management pathway</b> — implemented through a phased NHS England funding variation with priority cohorts; primary-care initiation only if locally commissioned and supported by wraparound care. NICE eligibility does not necessarily mean immediate local access: check the current GMMMG commissioning criteria, eligible cohort and service route before prescribing or promising treatment. Same GI side-effect cautions as semaglutide. Not in pregnancy — stop at least 1 month before a planned pregnancy; may reduce oral contraceptive effectiveness after initiation and dose escalation, so advise a non-oral or barrier method for the relevant period per the product information"],
         ["<b>Orlistat 120 mg TDS — lipase inhibitor</b>","<b>With meals; omit if a meal is missed or fat-free</b>","GI effects (steatorrhoea, urgency) are the adherence limiter and a behavioural feedback signal. <b>Continue beyond 3 months only if at least 5% has been lost.</b> Reduces fat-soluble vitamin absorption — consider a multivitamin containing fat-soluble vitamins, taken at least 2 hours apart from orlistat or at bedtime. Review GI adverse effects and adherence; consider interactions (ciclosporin, levothyroxine, warfarin); avoid in chronic malabsorption or cholestasis"],
         ["<b>The weight-regain caveat</b>","<b>Weight is regained when GLP-1 drugs stop (STEP-4 and similar)</b>","The chronic-disease analogy is useful counselling but not a prescribing rule: treatment duration depends on clinical response, adverse effects, patient preference, pregnancy plans, local commissioning, cost and service availability, and whether an alternative long-term strategy is in place (NHS semaglutide under TA875 is normally capped at 2 years). Offer support to maintain weight loss when weight-management medicines are stopped (NG246), and counsel upfront to prevent a sense of failure later"]
       ]},
       {b:"warn", html:"Pharmacotherapy is an adjunct to, never a replacement for, lifestyle change — and each agent has eligibility and stopping rules (NICE NG246, TA875, TA1026). NICE approval, NHS England funding variation and local GMMMG implementation are not identical — check the current GMMMG weight-management pathway and incretin-therapy guidance before prescribing or promising treatment. Beware unregulated online GLP-1 supply: dosing errors, no monitoring, and no eating-disorder screen."}
     ]},

    {id:"surgery", nav:"Surgery", title:"Step 5 — bariatric surgery (Tier 4): the most effective durable treatment",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>Thresholds (NG246)</b>","BMI ≥40, OR ≥35 with a significant comorbidity that would improve — type 2 diabetes, OSA, hypertension. <b>Lower thresholds for high-risk ethnic groups.</b> Refer for specialist multidisciplinary assessment via the local bariatric referral pathway"],
         ["<b>Expedite</b>","<b>Type 2 diabetes diagnosed within the last 10 years → offer expedited assessment at BMI ≥35; consider at 30–34.9 (NG246)</b>, because surgery can drive diabetes remission and the earlier the better"],
         ["<b>Procedures</b>","<b>Sleeve gastrectomy, Roux-en-Y bypass, gastric band (used less now)</b> — substantial durable loss and comorbidity remission; the most effective long-term treatment available"],
         ["<b>Follow-up — shared care</b>","Bariatric services should provide follow-up for at least 2 years. Thereafter, provide lifelong annual monitoring through an agreed shared-care pathway, with access to the bariatric service for nutritional, surgical or weight-regain problems. Micronutrient monitoring and supplementation (B12, iron, folate, calcium, vitamin D, thiamine) should follow the current specialist/BOMSS protocol, not be improvised in primary care. Watch for dumping syndrome and hypoglycaemia"],
         ["<b>Thiamine</b>","Routine post-operative supplementation is protocol-dependent. Urgent thiamine treatment is required with prolonged vomiting, poor intake or suspected deficiency; do not give glucose to a severely malnourished patient with suspected thiamine deficiency before appropriate thiamine replacement"],
         ["<b>Emergencies</b>","Acute abdominal pain after Roux-en-Y gastric bypass may represent internal hernia or obstruction. Vomiting, inability to tolerate fluids, tachycardia, fever, GI bleeding or collapse require emergency assessment. Communicate the bariatric surgical history clearly to the receiving team"]
       ]}
     ]},

    {id:"monitor", nav:"Review", title:"Step 6 — review: progress, comorbidity, and aftercare",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["<b>Weight, waist and goals</b>","<b>Regularly</b>","Reinforce, adjust, and expect and normalise relapse — re-engage rather than discharge"],
         ["<b>Cardiometabolic</b>","<b>Annually, more often if abnormal</b>","HbA1c, blood pressure, lipids and QRISK3, MASLD via FIB-4 — each treated to its own target"],
         ["<b>Drug therapy</b>","<b>Per the agent's schedule</b>","Efficacy against the agent's review rule (at least 5%), side effects, pregnancy plans and contraception, local funding criteria, and a maintenance plan for when treatment stops"],
         ["<b>Post-bariatric</b>","<b>Per the shared-care protocol</b>","Bariatric service for at least 2 years, then lifelong annual shared-care monitoring with micronutrients per the specialist/BOMSS protocol; new abdominal pain → urgent surgical review"],
         ["<b>Mood and eating</b>","<b>As needed</b>","Re-assess — treat depression and binge-eating disorder in their own right, alongside weight-management care"]
       ]},
       {b:"say", html:"We will keep an eye on the things the weight affects — sugars, blood pressure, liver and sleep — because improving those is the real win. If we use medication or surgery, they come with their own follow-up, and I will keep that going with you long-term."},
       {b:"cards", items:[
         {tone:"red", h:"🔴 Post-bariatric emergency", html:"\"Severe or persistent tummy pain after weight-loss surgery, vomiting or being unable to keep fluids down, a fast heartbeat, fever, bleeding or collapse — same-day or A&amp;E, and tell them about your surgery. Some complications, such as a twisted or blocked bowel after a bypass, are urgent.\""},
         {tone:"amber", h:"💉 GLP-1 side effects", html:"\"Nausea is common early and settles as we go up slowly. Severe ongoing tummy pain — contact us; rarely it is the pancreas or gallbladder.\""},
         {tone:"amber", h:"🤰 Pregnancy", html:"\"These injections are not used in pregnancy. If you are planning a pregnancy, they need stopping in advance — at least 2 months before for semaglutide and at least 1 month before for tirzepatide — and if you become pregnant, stop and tell us. Tirzepatide can reduce how well the pill works after starting and after each dose increase, so use a non-pill or barrier method during those times.\""},
         {tone:"red", h:"🌐 Online supply", html:"\"Please do not buy these injections from unregulated websites — wrong doses without monitoring cause real harm.\""}
       ]}
     ]},

    {id:"troubleshoot", nav:"Not progressing?", title:"Not progressing? Work through this",
     sub:"It is rarely \"just eat less\".",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"1 · Secondary or iatrogenic", html:"Features suggesting hypothyroidism, Cushing's or PCOS (investigate selectively) — or a weight-driving drug (antipsychotic, steroid, insulin) not yet reviewed with the prescribing team?"},
         {tone:"red", h:"2 · Eating disorder or mood", html:"<b>Binge-eating or depression undermining the plan → arrange psychological or eating-disorder support alongside weight care, and avoid restrictive dieting.</b>"},
         {tone:"blue", h:"3 · Structured support", html:"Actually in a Tier-2 programme, or going it alone? Has the referral been made?"},
         {tone:"blue", h:"4 · Drug eligibility", html:"Meets GLP-1 (NICE plus current GMMMG commissioning) or surgery criteria and has not been referred? Or on a drug below the 5% review threshold?"},
         {tone:"amber", h:"5 · Sleep and barriers", html:"<b>Untreated OSA, shift work, food insecurity — the real-world obstacles.</b>"},
         {tone:"green", h:"6 · Expectations", html:"Chasing an unrealistic target and disengaging → reset to individualised health goals."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"The tiered pathway",
     blocks:[
       {b:"cards", items:[
         {tone:"blue", h:"Tier 2 — community", html:"Structured weight-management and behavioural programmes — the evidence-based first referral for most patients."},
         {tone:"amber", h:"Tier 3 — specialist MDT", html:"Complex obesity, comorbidity, pharmacotherapy initiation, and pre-bariatric optimisation."},
         {tone:"amber", h:"Tier 4 — bariatric surgery", html:"<b>Meets NG246 thresholds after specialist input.</b> <b>Type 2 diabetes diagnosed within the last 10 years: offer expedited assessment at BMI ≥35; consider at 30–34.9 (lower thresholds for some ethnic groups).</b>"},
         {tone:"blue", h:"Endocrinology", html:"Suspected Cushing's or a hypothalamic cause, or PCOS needing specialist input. See <a href='pcos.html'>PCOS</a>."},
         {tone:"red", h:"Mental health / eating disorder service", html:"Binge-eating disorder, another suspected eating disorder or significant depression — support arranged alongside weight-management care. See <a href='depression.html'>depression</a>."},
         {tone:"cream", h:"GP management", html:"Classification, the secondary-cause and comorbidity screen, the conversation itself, Tier-2 referral, drug review for iatrogenic gain, pharmacotherapy only within the commissioned NHS Greater Manchester pathway, and shared-care post-bariatric monitoring after the bariatric service's 2-year follow-up all belong here. Use the current GMMMG weight-management pathway, incretin-therapy guidance, specialist weight-management and bariatric referral criteria, and shared-care micronutrient protocol (see Evidence). Related pages: <a href='type-2-diabetes.html'>type 2 diabetes</a> · <a href='osa.html'>obstructive sleep apnoea</a> · <a href='fatty-liver.html'>fatty liver disease</a> · <a href='hypertension.html'>hypertension</a> · <a href='pcos.html'>PCOS</a>."}
       ]},
       {b:"say", html:"Carrying extra weight is a medical condition, not a personal failing, and it responds to treatment — from structured support to newer medicines and, for some, surgery. We will start where it fits you, aim for changes that improve your health, and I will refer you into the right service."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 41-year-old woman of South Asian background attends asking about <b>\"the weight-loss jab\"</b> she has read about. Her <b>BMI is 29</b>. She has <b>PCOS</b>, was started on <b>olanzapine 10 mg</b> eighteen months ago and has gained 14 kg since. She describes <b>eating large amounts in the evening and feeling out of control</b>, then feeling ashamed. She snores and her partner has noticed pauses in her breathing. She has <b>already ordered semaglutide from an online pharmacy</b> but has not started it."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Applies the ethnicity-adjusted threshold — BMI 29 is obesity in a South Asian patient, not overweight, which changes her cardiometabolic classification and prompts a more intensive assessment, but does not by itself guarantee eligibility for anti-obesity medication (she would still need a qualifying comorbidity, the medicine-specific BMI threshold, service eligibility and local commissioning approval); identifies olanzapine as a major driver and discusses its indication and possible weight-neutral alternatives with the prescribing team rather than stopping or switching it independently; recognises the evening eating as probable binge-eating disorder and arranges eating-disorder support alongside supportive weight care, avoiding unsupervised restrictive dieting; <b>screens for OSA with Epworth or STOP-BANG</b> given the witnessed apnoeas and refers via the local sleep pathway; discusses contraception and pregnancy plans given PCOS; <b>addresses the unregulated online supply directly</b> — dosing errors, no monitoring, no eating-disorder screen — without shaming her for it; explains the real NICE TA875 route (within a specialist service) and the stopping rules, and that weight returns when the drug stops; <b>checks HbA1c, lipids, BP and FIB-4</b>; and asks permission before the weight conversation and uses neutral language throughout."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG246 — Overweight and obesity management (2025)</b><br><a href="https://www.nice.org.uk/guidance/ng246" rel="noopener">nice.org.uk/guidance/ng246</a><span class="rd"> — the BMI categories, the lower thresholds for South Asian, Chinese and other high-risk groups, the tiered pathway, and the bariatric surgery thresholds including expedited assessment for type 2 diabetes diagnosed within 10 years (offer at BMI ≥35; consider at 30–34.9)</span></li>'+
         '<li><b>NICE NG246 — Overweight and obesity management</b><br><a href="https://www.nice.org.uk/guidance/ng246" rel="noopener">nice.org.uk/guidance/ng246</a><span class="rd"> — waist-to-height ratio of 0.5 or more as a central adiposity measure in adults with BMI below 35 (not used to further classify risk at BMI 35 or above), medicines only after lifestyle approaches have been started and evaluated, support to maintain weight loss when medicines stop, low-energy diets not as a long-term strategy, bariatric follow-up for at least 2 years then shared-care annual monitoring, and the person-centred, permission-first approach to raising weight</span></li>'+

  foot:"Obesity in adults — NICE NG246, TA875 (semaglutide), and TA1026 (tirzepatide). Obesity is a chronic relapsing disease driven by biology and environment, not willpower. Use ethnicity-adjusted thresholds — overweight ≥23 and obesity ≥27.5 in South Asian, Chinese and other high-risk groups — and, below BMI 35, a waist-to-height ratio of 0.5 or more. Classification does not by itself establish drug eligibility. Ask permission before discussing weight. Ask about eating behaviour and mental health early, arranging eating-disorder support alongside weight care, investigate secondary causes selectively, and review weight-promoting medicines with the prescribing team. Agree individualised health goals. Weight commonly returns when GLP-1 drugs stop, so counsel upfront and plan maintenance. Semaglutide is used within a specialist service (normally up to 2 years); tirzepatide only within the current NHS England and NHS Greater Manchester pathway. Bariatric services follow up for at least 2 years, then lifelong annual shared-care monitoring. Pharmacotherapy and surgery are adjuncts within specialist pathways. Verify against NICE NG246, TA875 and TA1026, local weight-service criteria and the BNF before prescribing."
