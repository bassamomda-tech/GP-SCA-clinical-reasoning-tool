  icon:"🩺",
  title:"Premature ejaculation — the complete guide",

  stemTitle:"Get the subtype right and the treatment follows — acquired PE often has a treatable cause",
  stemSub:"One page for the whole condition. Screen the red flags (prostatitis, hyperthyroidism, new neurological disease, suicidal distress); confirm latency, perceived control, persistence, distress and impact rather than timing alone; classify into the four EAU subtypes, because each needs a different first move; treat the underlying cause in acquired PE before PE-directed treatment; prescribe dapoxetine safely — never with an SSRI, SNRI, TCA, tramadol or other serotonergic medicine, and not with a PDE5 inhibitor in routine primary care; and add behavioural or psychosexual support. EAU Limited Update March 2026 (international) · Priligy and Fortacin SPCs · ISSM 2014 (international) · BSSM position statement 2025 · NICE NG12 (updated April 2026).",
  guideline:"BSSM position statement on premature ejaculation (2025) · EAU Sexual and Reproductive Health, Limited Update March 2026 (international) · ISSM 2014 (international) · Priligy (dapoxetine) SPC July 2025 · Fortacin SPC November 2024 · NICE NG110 · NICE NG12 (updated April 2026)",

  ],
  lead:"<div class='mg-layers'><a href='#severe'><b>Red flags</b><small>Prostatitis · thyroid · distress</small></a><a href='#define'><b>Define</b><small>ISSM · IELT</small></a><a href='#classify'><b>Subtype</b><small>The four EAU types</small></a><a href='#ladder'><b>Treat</b><small>Behavioural + drug together</small></a></div>",
  quickSub:"If you read nothing else on this page, read these six cards. Sources are cited under <a href='#provenance'>Evidence</a>; verify doses and interactions against the current SPC.",
  quick:[
    {tone:"red", h:"⚠ Acquired PE: look for a treatable cause before PE-directed treatment", html:"Hyperthyroidism is a recognised, potentially reversible cause of acquired PE. Check TSH, with free T4 if indicated, when acquired PE comes with symptoms or signs suggestive of thyroid disease (weight loss, tremor, heat intolerance, palpitations, goitre, tachycardia), or consider it when the onset is otherwise unexplained; treat the thyroid disorder and reassess ejaculation before escalating PE treatment. New PE with dysuria, pelvic/perineal pain or LUTS should prompt assessment for prostatitis or another genitourinary condition — distinguish acute bacterial prostatitis, chronic bacterial prostatitis and chronic pelvic pain syndrome, and do not prescribe repeated antibiotics without microbiological or specialist justification."},
    {tone:"amber", h:"Ask about distress, mood and suicidal thoughts", html:"Ask directly about distress, low mood, anxiety, shame, relationship difficulties and avoidance, and about suicidal thoughts where there is severe distress, depression, hopelessness or social withdrawal. Use PHQ-9/GAD-7 where clinically indicated or when a formal mental-health assessment is being undertaken, and document the response and risk assessment. PE has high comorbidity with depression and anxiety. <b>Same-day mental-health assessment is for active suicidal ideation, imminent risk, severe self-neglect or a severe mental-health presentation — not simply because PE is present.</b>"},
    {tone:"blue", h:"Use the ISSM definition, not the patient's expectations", html:"PE = ejaculation always or nearly always before or within about 1 minute of penetration (lifelong), OR a significant reduction in latency to ≤3 minutes (acquired), AND an inability to delay, AND significant negative consequences, in most relevant sexual encounters. <b>Confirm the latency, perceived control, persistence, distress and impact on the patient and relationship — do not diagnose PE from timing alone.</b> Self-estimated IELT is acceptable; stopwatch measurement is not usually needed. Average IELT is 5.4 minutes. Men with subjective PE (normal IELT of 3–5 minutes plus anxiety) are best managed with education and psychosexual intervention rather than drug treatment — getting the subtype right prevents inappropriate prescribing and medicalising normal variation."},
    {tone:"green", h:"Look for an anatomical problem — but surgery is not a PE treatment", html:"Examine for clinically significant phimosis, frenulum breve, pain, inflammation, hypospadias or Peyronie’s disease where indicated. These may contribute to sexual dysfunction, but surgery is not a routine treatment for PE and should not be presented as a reliable cure. Refer to urology if there is pain, recurrent tearing, significant functional limitation or an anatomical abnormality requiring treatment; do not offer surgery solely to treat PE without a clear anatomical indication. <b>A normal, matter-of-fact genital examination is itself therapeutic</b> — many men presenting with PE have significant genital anxiety."},
    {tone:"amber", h:"Dapoxetine: dose, interactions and first-dose counselling", html:"Dapoxetine 30 mg about 1–3 hours before sexual activity, licensed for men 18–64 (efficacy and safety not established at 65 and over), short-acting (t½ 1.3 h), no more than once every 24 hours. Do not initiate at 60 mg; increase to 60 mg only if 30 mg is inadequate and tolerated — 60 mg causes more adverse effects, and do not escalate after orthostatic symptoms. Review after 4 weeks or at least 6 doses, then reassess the need at least every 6 months (SPC). It raises mean IELT from 0.9 to 2.8 minutes (30 mg) or 3.1 minutes (60 mg). Before prescribing, check for previous orthostatic symptoms or syncope and perform supine and standing BP and pulse. Explain that dizziness, light-headedness and syncope may occur, especially after the first dose and within the first 3 hours (syncope about 0.06% with 30 mg and 0.23% with 60 mg in phase 3 trials); advise good hydration, avoiding alcohol, rising slowly, sitting or lying down immediately if prodromal symptoms occur, and not driving or operating machinery if dizzy or after syncope. <b>Never combine with an SSRI, SNRI, TCA, MAOI, tramadol, triptan, linezolid, lithium, St John’s wort or other serotonergic medicine</b> (observe SPC washout periods), and <b>do not combine with a PDE5 inhibitor</b> (UK SPC). Also contraindicated: potent CYP3A4 inhibitors, significant cardiac disease, syncope history, a history of mania or severe depression, and moderate–severe hepatic impairment."},
    {tone:"green", h:"Behavioural work helps — and review the need for treatment", html:"Small trials suggest that pelvic-floor and behavioural interventions may improve perceived control and distress. The evidence is limited and heterogeneous. They are particularly useful for variable, subjective and acquired PE and may add benefit when combined with pharmacotherapy. Involving the partner can help. Review ongoing need, benefit, adverse effects and patient preference at least every 6 months; a trial without medication may be considered after sustained benefit, particularly where behavioural strategies are established — there is no requirement for a routine drug holiday."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step is where the treatable causes hide.",
  pathway:[
    {title:"Screen the red flags", html:"New PE with dysuria, pelvic/perineal pain or LUTS → assess for prostatitis or another genitourinary condition (urine testing, examination as appropriate); fever or systemic illness → acute bacterial prostatitis per NICE NG110; urgency is set by systemic illness, retention, haematuria, abnormal examination, recurrent infection or failure to improve. Active suicidal ideation, intent or plan, or severe depression → same-day mental health. New neurological symptoms (paraesthesia, weakness, spasticity) → neurological assessment (MS, cord pathology). Hyperthyroid features → TSH (± free T4) and treat the thyroid first. Post-prostatectomy, bladder surgery or pelvic radiotherapy → urology. Coercion, abuse or sexual pressure → safe enquiry. PE + ED together → assess both (higher likelihood of organic cause). Review the drug and substance history — tramadol, antipsychotics, opioid withdrawal, recent changes.", alert:true},
    {title:"Confirm with the ISSM definition", html:"Ask the IELT question directly (“how long from penetration to ejaculation?”), and confirm latency, perceived control, persistence across most encounters, and distress or impact on the patient and relationship — do not diagnose PE from timing alone; self-estimated IELT is enough. Ask whether it has been present since the first sexual experiences, whether it occurs with most partners, about ED, libido, pain, urinary or neurological symptoms, and privately about coercion, abuse or sexual pressure. Normalise the consultation first — PE affects 20–30% of men at some point, and the consultation itself is therapeutic. Always ask about the partner's perspective."},
    {title:"Classify into one of four subtypes", html:"Lifelong (from first intercourse, IELT &lt;1 min, neurobiological) → dapoxetine or Fortacin, with behavioural/psychosexual support; daily SSRI only as an off-label alternative. Acquired (normal then new) → treat the underlying cause FIRST. Natural variable (inconsistent, situational — not a disorder) → reassurance and psychoeducation, no drug. Subjective (normal IELT, anxiety-driven) → education and psychosexual intervention; avoid unnecessary drug treatment. Co-existing ED → treat the ED first or concomitantly. Assess distress and mood clinically, using PHQ-9/GAD-7 where indicated."},
    {title:"Examine and investigate — targeted, not routine", html:"Offer a focused examination at the initial assessment: BP and pulse, thyroid signs, genital examination (penile pain, plaques, phimosis, frenulum abnormality, hypospadias), testicular examination if symptoms indicate, focused neurological examination if there are neurological symptoms, and DRE only where prostatitis, LUTS or prostate pathology is clinically relevant. Investigate only if indicated: TSH ± free T4 if thyroid disease is suspected, MSU if urinary symptoms or suspected prostatitis, STI testing where indicated, HbA1c if ED, obesity or diabetes risk, early-morning testosterone if low libido, ED or hypogonadal symptoms, and PSA/DRE per NICE NG12 after considering infection and informed choice. No routine laboratory or physiological tests in an otherwise typical presentation."},
    {title:"Treat both dimensions, then review with an end-point", html:"Combined pharmacological + behavioural treatment may be beneficial (EAU 2026). Never combine dapoxetine with an SSRI or other serotonergic medicine, or with a PDE5 inhibitor. Review dapoxetine after 4 weeks or at least 6 doses, then at least every 6 months; reassess mood where clinically indicated; taper a daily SSRI gradually if stopping; no routine drug holiday — consider a trial without medication after sustained benefit."}
  ],
  sections:[
    {id:"severe", nav:"Red flags", title:"Red flags — underlying medical causes and psychological crisis", sub:"PE is usually lifelong or psychological, but new-onset or acquired PE may signal prostatitis, neurological disease or significant psychological distress.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"🟠 New-onset PE + lower urinary tract symptoms", html:"Frequency, urgency, dysuria, perineal pain, pelvic discomfort → assess for prostatitis or another genitourinary condition (urine testing, examination as clinically appropriate). <b>Acute bacterial prostatitis</b>: febrile/systemic illness, pelvic or perineal pain, dysuria, tender prostate — obtain an MSU before antibiotics where possible, treat promptly and reassess within 48 hours; hospital referral if sepsis, acute urinary retention, suspected prostatic abscess or no improvement within 48 hours (NICE NG110). <b>Chronic bacterial prostatitis</b>: recurrent urinary infection or persistent bacterial prostatitis — urology or microbiology input may be required. <b>Chronic pelvic pain syndrome</b>: pain for at least 3 months without established bacterial infection — do not label it bacterial prostatitis or prescribe repeated antibiotics without microbiological or specialist justification. Urgency is set by systemic illness, retention, haematuria, abnormal examination, recurrent infection or failure to improve — not by PE with LUTS alone. LUTS also bring in the NG12 PSA criterion below."},
         {tone:"red", h:"🔴 Suicidal ideation / severe depression", html:"Active suicidal ideation, intent or plan, severe depression or self-neglect, psychosis, mania or severe behavioural disturbance → same-day or emergency mental-health assessment. Ask directly about suicidal thoughts where there is severe distress, depression, hopelessness or social withdrawal. PE has high comorbidity with depression and anxiety."},
         {tone:"amber", h:"🟠 New neurological symptoms", html:"PE acquired after neurological symptoms (paraesthesia, weakness, spasticity) → neurological assessment: multiple sclerosis or spinal cord pathology disrupts ejaculatory control."},
         {tone:"amber", h:"🟠 Thyroid symptoms", html:"New PE + hyperthyroid features (tremor, palpitations, weight loss, heat intolerance) → TSH, with free T4 if indicated. Hyperthyroidism is a recognised, potentially reversible cause of acquired PE — treat the thyroid disorder and reassess ejaculation before escalating PE treatment."},
         {tone:"amber", h:"🟠 Post-pelvic surgery", html:"PE following prostatectomy, bladder surgery or pelvic radiotherapy → urology. Post-surgical ejaculatory dysfunction is distinct from primary PE."},
         {tone:"amber", h:"🟠 Relationship or domestic abuse", html:"PE presenting in the context of coercive control or partner pressure → safe enquiry. Sexual dysfunction can be a manifestation of intimate partner violence dynamics."},
         {tone:"amber", h:"🟠 Concurrent erectile dysfunction", html:"PE + ED together may indicate cardiovascular disease, diabetes or hypogonadism → assess both; treat ED first or concomitantly. Do not combine dapoxetine with a PDE5 inhibitor in routine primary care (UK Priligy SPC — possible orthostatic hypotension); seek specialist advice if combination treatment is being considered. ED + PE means a higher likelihood of an organic cause. See the <a href='erectile-dysfunction.html'>ED protocol</a>."},
         {tone:"blue", h:"💊 Drug-related PE", html:"Check whether PE onset coincided with medication changes: stopping tramadol or an SSRI (both delay ejaculation, so withdrawal can unmask PE), opioid withdrawal, antipsychotics. Review the full drug and substance history."}
       ]},
       {b:"why", html:"Acquired PE is a more specific indicator of organic disease than lifelong PE: look for ED, prostatitis or another genitourinary condition, thyroid disease, medication or substance changes and psychological causes, and treat them before PE-directed treatment. Hyperthyroidism is a potentially reversible cause, but thyroid tests are targeted to clinical features rather than routine. Assess distress, mood and suicidal ideation clinically, using validated tools when indicated."}
     ]},

    {id:"define", nav:"Define", title:"Confirm and characterise — the ISSM definition", sub:"Set the patient at ease and normalise the consultation before taking the history. Use the ISSM criteria rather than the patient's expectations.",
     blocks:[
       {b:"table", head:["Element","Detail","Why"], rows:[
         ["<b>ISSM definition</b>","Ejaculation that always or nearly always occurs before or within approximately 1 minute of vaginal penetration (lifelong PE), OR a significant reduction in latency time to ≤3 minutes (acquired PE), AND an inability to delay, AND significant negative consequences (distress, bother, frustration, avoidance of sexual intimacy)","Confirm latency, perceived control, persistence, distress and impact — do not diagnose PE from timing alone"],
         ["<b>IELT</b>","Ask: “How long from penetration to ejaculation?” Average IELT is 5.4 minutes. PE threshold ≤1 min (lifelong) or ≤3 min (acquired). Self-estimated IELT is acceptable; stopwatch measurement is not usually needed, and IELT alone is inadequate for characterising PE","The 1-minute threshold is the only criterion with strong epidemiological evidence (95th centile)"],
         ["<b>Lifelong (primary) PE</b>","Present from the first sexual encounter, with every partner and on every occasion. Likely neurobiological (serotonin receptor sensitivity, penile glans hypersensitivity)","<b>Responds well to pharmacological treatment</b>"],
         ["<b>Acquired (secondary) PE</b>","Normal ejaculatory control previously, then new onset. Triggers: prostatitis or other genitourinary conditions, relationship factors, ED, hyperthyroidism, medication or substance changes, neurological disease, pelvic surgery or radiotherapy, penile pain or abnormality, psychological factors","<b>Investigate for an organic cause first</b>"],
         ["<b>Natural variable PE</b>","Occasional PE in certain situations (stress, new partner, after abstinence)","Not a disorder — reassurance ± behavioural techniques; no pharmacological treatment indicated"],
         ["<b>Subjective PE</b>","Normal IELT (3–5 min) but the patient perceives PE — often anxiety, unrealistic (pornography-influenced) expectations, or relationship issues","<b>Education and psychosexual intervention; avoid unnecessary drug treatment</b>"],
         ["<b>Partner impact</b>","Always ask about the partner's perspective where applicable — relationship distress, partner anorgasmia, intimacy avoidance","<b>Partner involvement in treatment improves outcomes significantly</b>"]
       ]},
       {b:"why", html:"The ISSM 2014 evidence-based definition matters because PE is over-diagnosed in men with normal IELT but performance anxiety — treating normal IELT pharmacologically risks medicalising normal variation and creating drug dependence. The consultation itself is therapeutic: normalising PE (it affects 20–30% of men at some point) reduces shame and improves treatment engagement."}
     ]},

    {id:"classify", nav:"Subtype", title:"Classify the subtype — it drives treatment selection", sub:"The EAU guidelines (Limited Update March 2026) classify PE into four subtypes, each needing a different primary treatment strategy.",
     blocks:[
       {b:"table", head:["Subtype","Features","Primary treatment"], rows:[
         ["<b>Lifelong PE</b>","From first intercourse, IELT &lt;1 min, always with every partner. Neurobiological basis (serotonergic hypofunction, penile hypersensitivity)","<b>Dapoxetine or Fortacin (licensed for primary PE), with behavioural/psychosexual support; a daily SSRI only as an off-label alternative — never with dapoxetine</b>"],
         ["<b>Acquired PE</b>","Normal history then PE develops. Triggers: CP/CPPS, ED, hyperthyroidism, relationship or psychological factors","Treat ED, prostatitis, LUTS, thyroid disease, medication or psychological cause FIRST; reassess, then add PE-directed therapy only if symptoms persist"],
         ["<b>Natural variable PE</b>","<b>Inconsistent and situational — normal variation</b>","Reassurance + psychoeducation. Avoid pharmacological treatment — there is no disorder requiring medication"],
         ["<b>Subjective PE</b>","Normal IELT but perceived as PE; anxiety and unrealistic expectations drive it","Education and psychosexual intervention; avoid unnecessary drug treatment"],
         ["<b>Co-existing ED</b>","<b>Anxiety about losing the erection often drives rapid ejaculation</b>","Assess and treat ED first or concomitantly — when the ED is treated the PE may resolve. Do not combine dapoxetine with a PDE5 inhibitor in routine primary care (UK Priligy SPC — possible orthostatic hypotension); seek specialist advice if combination treatment is being considered"],
         ["<b>Psychological assessment</b>","Ask directly about distress, low mood, anxiety, shame, relationship difficulties, avoidance and (where indicated) suicidal thoughts; use PHQ-9/GAD-7 where clinically indicated","Treating comorbid depression or anxiety improves PE outcomes and wellbeing"]
       ]},
       {b:"why", html:"Treating acquired PE without addressing the underlying cause is ineffective in most cases. Prostatitis-related acquired PE needs the right diagnosis: chronic bacterial prostatitis may need urology or microbiology input, whereas chronic pelvic pain syndrome should not be treated with repeated antibiotics without evidence of infection. Treating PE with dapoxetine when the real cause is performance anxiety from ED will fail until the ED is treated. The most efficient use of a 10-minute appointment is establishing the subtype and booking follow-up or a psychosexual referral, rather than prescribing dapoxetine to everyone."}
     ]},

    {id:"exam", nav:"Examination", title:"Targeted examination", sub:"Offer a focused physical examination at the initial assessment, particularly where ED, acquired PE, pain, penile abnormality, neurological symptoms or an endocrine cause is suspected.",
     blocks:[
       {b:"table", head:["What","Look for","Means"], rows:[
         ["<b>General</b>","BMI, BP and pulse (supine and standing before dapoxetine; shared cardiovascular risk with ED); thyroid signs (tremor, goitre, tachycardia, exophthalmos); gynaecomastia","<b>Hyperthyroidism is a potentially reversible cause of PE; gynaecomastia suggests hypogonadism</b>"],
         ["<b>Genital</b>","Clinically significant phimosis, frenulum breve, penile pain or inflammation, hypospadias, Peyronie's disease (penile plaques)","May contribute to sexual dysfunction — refer to urology if there is pain, recurrent tearing, significant functional limitation or an anatomical abnormality requiring treatment; do not offer surgery solely to treat PE"],
         ["<b>Prostate</b>","DRE only where prostatitis, LUTS or prostate pathology is clinically relevant — tenderness suggests prostatitis, enlargement BPH. DRE is not a test for diagnosing PE","Exquisite prostate tenderness changes management completely — treat the prostatitis (antibiotic choice and duration per NICE NG110 and the BNF, noting the MHRA January 2024 fluoroquinolone restrictions; urology advice for chronic bacterial prostatitis) rather than dapoxetine"],
         ["<b>Neurological</b>","Focused neurological examination only if there are neurological symptoms — perineal sensation; bulbocavernosus reflex (S2–4) is not routine","<b>Abnormal → neurology referral</b>"],
         ["<b>Secondary sexual characteristics</b>","Testicular examination if symptoms indicate (small testes suggest hypogonadism), body hair distribution, voice","Relevant with concurrent ED or low libido"],
         ["<b>If the patient declines</b>","If the history is classic and the patient declines examination, document this and offer it again if symptoms persist or treatment fails","A normal, matter-of-fact examination reduces genital anxiety significantly"]
       ]}
     ]},

    {id:"workup", nav:"Work-up", title:"Investigations — targeted, not routine", sub:"No routine laboratory or physiological tests in an otherwise typical presentation — investigate only as the history and examination indicate.",
     blocks:[
       {b:"table", head:["Test","When","Interpretation"], rows:[
         ["<b>TSH (± free T4)</b>","<b>Acquired PE with symptoms or signs of thyroid disease</b> (weight loss, tremor, heat intolerance, palpitations, goitre, tachycardia); consider if onset is otherwise unexplained","About half of men with hyperthyroidism report PE (Carani 2005) — the reverse (hyperthyroidism in half of acquired PE) is not true. Hyperthyroidism is a recognised, potentially reversible cause: treat the thyroid disorder and reassess ejaculation before escalating PE treatment"],
         ["<b>Fasting glucose / HbA1c</b>","<b>Concurrent ED, obesity or risk factors</b>","Diabetes causes autonomic neuropathy and ejaculatory dysfunction — the PE may improve on treating it"],
         ["<b>Testosterone + LH</b>","<b>Low libido, ED or hypogonadal symptoms</b>","Morning testosterone (7–10 am — diurnal variation is significant, an afternoon sample may be falsely low); low is &lt;8 nmol/L; LH distinguishes primary from secondary hypogonadism"],
         ["<b>MSU ± STI testing; PSA</b>","<b>MSU if urinary symptoms or suspected prostatitis; STI testing where indicated; PSA and DRE considered in men with LUTS, erectile dysfunction or visible haematuria (NICE NG12)</b>","Discuss the pros and cons of PSA before testing. Do not routinely request PSA during acute prostatitis or active UTI — both can raise PSA; defer it until the infection or inflammation has resolved, using the local pathway"],
         ["<b>Nocturnal penile tumescence</b>","<b>Not a primary-care investigation</b>","Differentiates psychogenic from organic ED in secondary care"],
         ["<b>When NOT to investigate</b>","<b>Typical presentation, no red flags, normal examination</b>","No investigations required — start treatment and review. Over-investigation delays treatment and increases anxiety"]
       ]},
       {b:"cards", items:[
         {tone:"purple", h:"NG12 criteria that surface here <span class='tw'>Suspected cancer</span>", html:"Premature ejaculation has no NICE NG12 criterion of its own, and this page does not invent one. NG12 routes can arise from the history, examination and work-up and must be acted on if they do:<br>• Lower urinary tract symptoms, erectile dysfunction or visible haematuria → consider a PSA test and DRE to assess for prostate cancer.<br>• A prostate that feels malignant on DRE, or a PSA above the age-specific threshold (40–49: &gt;2.5; 50–59: &gt;3.5; 60–69: &gt;4.5; 70–79: &gt;6.5 micrograms/L; under 40 or over 79: clinical judgement) → suspected cancer pathway referral for prostate cancer. Do not routinely request PSA during acute prostatitis or active UTI. The DRE and PSA offered here for prostatitis and LUTS are the same examination that finds this.<br>• A non-painful enlargement or change in shape or texture of the testis → suspected cancer pathway referral for testicular cancer (direct-access ultrasound for unexplained or persistent testicular symptoms).<br>Haematospermia alone is not an NG12 cancer referral criterion; assess persistent or concerning haematospermia according to the local urology pathway.", src:"NICE NG12 (updated April 2026) — prostate and testicular recommendations"}
       ]},
       {b:"why", html:"Hyperthyroidism is a recognised, potentially reversible cause of acquired PE: when the history or examination suggests it, treat the thyroid disorder and reassess ejaculation before escalating PE treatment. Testosterone deficiency rarely causes PE in isolation but frequently causes ED and reduced libido, producing rapid ejaculation through anxiety about losing the erection."}
     ]},

    {id:"ladder", nav:"Treat", title:"The treatment ladder — pharmacological and behavioural", sub:"EAU 2026: pharmacotherapy is first-line for lifelong PE; psychological/behavioural treatment is an adjunct, particularly in acquired PE, and combined treatment may be beneficial. Verify doses against the current SPC and local formulary.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Step 1", title:"Psychoeducation + behavioural techniques", when:"all subtypes, first-line", fromLabel:"prescribe it as concretely as a drug",
          html:"Stop–start technique (Semans) or squeeze technique (Masters &amp; Johnson) — practise alone first, then with the partner; takes 4–8 weeks to show benefit. Pelvic floor exercises may improve perceived control (limited evidence)."},
         {step:"Step 2", title:"Dapoxetine 30 mg on demand", when:"first-line pharmacological", fromLabel:"1–3 hours before intercourse",
          html:"Licensed for PE in men aged 18–64 (efficacy and safety not established at 65 and over); short-acting SSRI (t½ 1.3 h); increases IELT 2–3× from baseline; no more than once every 24 hours. Do not initiate at 60 mg; increase to 60 mg only if 30 mg is inadequate and tolerated — 60 mg causes more adverse effects, and do not escalate after orthostatic symptoms. Review after 4 weeks or at least 6 doses, then at least every 6 months (SPC). Supine and standing BP and pulse before starting. Contraindications (SPC): concurrent SSRIs, SNRIs, TCAs, MAOIs, tramadol, triptans, linezolid, lithium, St John’s wort or other serotonergic products (observe the SPC washout periods), potent CYP3A4 inhibitors, significant cardiac disease, a history of syncope, a history of mania or severe depression, and moderate–severe hepatic impairment. Not recommended in severe renal impairment; maximum 30 mg with moderate CYP3A4 inhibitors; avoid grapefruit juice within 24 hours; caution with alpha-blockers, nitrates, anticoagulants and medicines affecting platelet function. <b>Do not combine with a PDE5 inhibitor</b> (UK SPC — possible orthostatic hypotension)."},
         {step:"Step 3", title:"Topical anaesthetic — Fortacin spray (or off-label lidocaine/prilocaine cream)", when:"primary (lifelong) PE", fromLabel:"Fortacin is licensed for primary PE",
          html:"Fortacin (lidocaine 150 mg/mL with prilocaine 50 mg/mL cutaneous spray) is licensed for primary (lifelong) PE in adult men: 3 actuations to the glans, wipe off excess after 5 minutes; maximum 3 doses in 24 hours, at least 4 hours apart. It can cause genital hypoaesthesia and erectile dysfunction, and partner vulvovaginal burning or hypoaesthesia. Do not use with polyurethane male or female condoms (latex, polyisoprene, nitrile and silicone condoms are compatible). If trying to conceive, avoid use or wash the glans thoroughly before intercourse — the SPC notes a possible reduction in sperm motility. A lidocaine/prilocaine cream may be considered off-label where an approved spray is unavailable or unsuitable: use only a locally approved regimen, warn about transfer of anaesthetic to the partner, and advise condom use compatible with the product or thorough washing before intercourse."},
         {step:"Step 4", title:"Daily SSRI (off-label alternative) — paroxetine has the most evidence", when:"if dapoxetine is ineffective or unsuitable — never alongside it", fromLabel:"off-label; check the SPC and local formulary",
          html:"An off-label alternative, not an add-on: stop dapoxetine first and assess interactions and washout. Paroxetine generally has the strongest ejaculation-delay evidence; sertraline and fluoxetine are alternatives. The BSSM favours on-demand dapoxetine over off-label daily SSRIs. Prescribe only after checking the current SPC and local formulary for dose, interactions and withdrawal advice; effect builds over 1–4 weeks. Warn about nausea and GI symptoms, fatigue or insomnia, reduced libido, erectile dysfunction, anorgasmia, emotional blunting, withdrawal symptoms, possible persistent sexual dysfunction, and serotonin toxicity with interacting medicines."},
         {step:"Step 5", title:"Combining safely", when:"refractory", fromLabel:"one drug + behavioural support",
          html:"Do not combine dapoxetine with a daily SSRI, SNRI, TCA, tramadol or other serotonergic medicine. If dapoxetine is ineffective or unsuitable, stop it and consider an alternative treatment after an appropriate interaction and washout assessment. Add psychosexual or behavioural support to any pharmacological regimen. If ED is present, assess and treat ED first or concomitantly; do not combine dapoxetine with a PDE5 inhibitor in routine primary care because of the UK SPC warning regarding orthostatic hypotension — seek specialist advice if combination treatment is being considered."}
       ]},
       {b:"warn", html:"<b>Never combine dapoxetine with another SSRI or serotonergic medicine, or with a PDE5 inhibitor.</b> Counsel on SSRI side effects (nausea, dizziness, mood and sexual effects, emotional blunting, possible persistent sexual dysfunction) and the small early suicidality risk in younger men. Topical anaesthetic can numb the partner — use a compatible (non-polyurethane) condom or wash the glans before intercourse. <b>Taper daily SSRIs gradually; never stop paroxetine abruptly.</b>"},
       {b:"why", html:"Dapoxetine raises mean IELT from 0.9 to 2.8 minutes (30 mg) and 3.1 minutes (60 mg) in RCTs — roughly 3× — but patient-reported satisfaction is highest when behavioural techniques are added. Daily paroxetine generally has the strongest ejaculation-delay evidence but is off-label, needs daily dosing and carries withdrawal and sexual adverse-effect risks — it is an alternative to dapoxetine, never an add-on. Dapoxetine + topical anaesthetic is additive through different mechanisms — central serotonergic delay plus a peripheral sensory threshold increase."},
       {b:"say", html:"This is common — it affects a fifth to a third of men at some point — and it is treatable. Simple techniques and a numbing spray help many men, there's a tablet you take only when you need it, and if it started recently we'll check there isn't a cause behind it that we can cure outright."}
     ]},

    {id:"lifestyle", nav:"Behavioural", title:"Behavioural techniques, psychological strategies and lifestyle", sub:"First-line for all subtypes, and prescribed as concretely as medication. Written resources or reputable online signposting aids adherence.",
     blocks:[
       {b:"table", head:["Technique","How","Evidence / note"], rows:[
         ["<b>Stop–start (Semans)</b>","Stimulate to the point of near-ejaculation, pause until the sensation reduces, restart — repeat 3 times before ejaculating. Practise alone for 2 weeks, then with the partner","Teaches recognition and control of the point of ejaculatory inevitability"],
         ["<b>Squeeze technique</b>","The partner applies firm pressure to the frenulum or glans for 10–20 seconds at the point of near-ejaculation until the urge passes; same progression as stop–start","<b>Partner involvement significantly improves outcomes</b>"],
         ["<b>Pelvic floor exercises</b>","Identify the pelvic floor muscles (the ones used to stop urinating midstream) and practise regular contractions; refer to a pelvic health physiotherapist or a specific physiotherapy resource for a structured programme","Small trials suggest pelvic-floor and behavioural interventions may improve perceived control and distress; the evidence is limited and heterogeneous"],
         ["<b>Mindfulness and sensate focus</b>","Sensate focus (Masters &amp; Johnson): gradual reintroduction of physical intimacy without performance pressure; refer to a psychosexual therapist for structured delivery","<b>Reduces anticipatory anxiety — the commonest PE amplifier</b>"],
         ["<b>Masturbation before intercourse</b>","1–2 hours before anticipated intercourse — exploits the refractory period to reduce sensitivity and extend latency","Practical, accessible, effective for mild cases"],
         ["<b>Condom use</b>","Thicker condoms reduce penile sensitivity; combines with dapoxetine or a topical anaesthetic (not polyurethane condoms with Fortacin)","Practical, cheap, no side effects"],
         ["<b>Anxiety management</b>","CBT, especially cognitive restructuring of catastrophic beliefs about PE; exercise reduces cortisol and anxiety; sleep hygiene; address alcohol use","PE is self-reinforcing via performance anxiety. Alcohol is misunderstood: acute intoxication may delay ejaculation, but chronic use damages pudendal nerve function and worsens PE long-term"],
         ["<b>Partner communication</b>","Open discussion reduces shame and improves intimacy; partners often feel responsible, so psychoeducate both. Focus on non-penetrative intimacy to reduce performance pressure. NHS relationship therapy available via GP referral","Involving the partner improves outcomes — routinely include the partner or give them written information"]
       ]},
       {b:"why", html:"Masters &amp; Johnson (1970) reported very high success with stop–start/squeeze plus psychosexual therapy, though modern long-term follow-up is less impressive, with frequent relapse without maintenance. Small studies of pelvic floor training (Pastore et al., Int J Androl 2012; Ther Adv Urol 2014, uncontrolled) suggest improved control, but the evidence is limited and heterogeneous, and the EAU describes psychosexual interventions as having weak and inconsistent evidence with uncertain long-term outcomes, although combined treatment may be beneficial. The proposed mechanism is that voluntary contraction of puborectalis and bulbocavernosus inhibits the autonomic ejaculatory reflex."}
     ]},

    {id:"monitor", nav:"Monitor", title:"Follow-up, monitoring and safety-netting", sub:"Review ongoing need, benefit, adverse effects and patient preference at least every 6 months — there is no requirement for a routine drug holiday.",
     blocks:[
       {b:"table", head:["When","What","Action"], rows:[
         ["<b>4 weeks or 6 doses</b>","Dapoxetine response: adequate (control improved and satisfied) → continue and reassess at least every 6 months. Inadequate → increase to 60 mg only if 30 mg was tolerated without orthostatic symptoms, or stop dapoxetine and consider an alternative (Fortacin, or an off-label daily SSRI after an interaction and washout assessment) — never add an SSRI to dapoxetine. Review side effects: nausea, dizziness, diarrhoea, insomnia — common with dapoxetine, usually mild","Add behavioural or psychosexual support rather than combining serotonergic drugs"],
         ["<b>3 months</b>","Full review: patient-reported control, distress and satisfaction, partner impact where applicable, adverse effects, alcohol and interacting medicines, ED and other sexual dysfunction, adherence to behavioural techniques, and whether continuing medication remains worthwhile. Assess mood and suicidal ideation where clinically indicated","<b>Consider dose reduction or a trial without medication after sustained benefit — no routine drug holiday</b>"],
         ["<b>6 months</b>","Reassess the need for dapoxetine at least every 6 months (evidence beyond 24 weeks is limited). If on a daily SSRI, review the need and consider trial withdrawal — taper gradually, never stop abruptly; do not use alternate-day dosing as a default, particularly with paroxetine; review for withdrawal symptoms and recurrence of depression or anxiety; discuss fertility and sexual adverse effects. If acquired PE, re-assess the treated organic cause","Paroxetine discontinuation syndrome is one of the most distressing SSRI withdrawals — “brain zaps”, severe nausea, extreme anxiety, nightmares. Gradual tapering reduces the risk"],
         ["<b>Dapoxetine monitoring</b>","Counsel rather than observe: dizziness, light-headedness and syncope may occur, especially after the first dose and within the first 3 hours — keep well hydrated, avoid alcohol, rise slowly, sit or lie down immediately at prodromal symptoms, and do not drive or operate machinery if dizzy or after syncope. Caution with antihypertensives, alpha-blockers, nitrates, anticoagulants and medicines affecting platelet function","Syncope occurred in about 0.06% (30 mg) to 0.23% (60 mg) in phase 3 trials, mostly after the first dose; routine post-dose observation in the practice is not an SPC requirement"],
         ["<b>Trial without medication</b>","May be considered after sustained benefit, particularly where behavioural strategies are established — a shared decision, not a requirement","There is no requirement for a routine drug holiday — review if relapse occurs"],
         ["<b>Long-term review (at least 6-monthly)</b>","For men on long-term dapoxetine or a daily SSRI: reassess the diagnosis and the need for treatment; screen for new organic causes if acquired PE returns","Also confirm coexisting ED remains treated and optimised"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"📞 Same-day", html:"Syncope after a dapoxetine dose · signs of serotonin syndrome (fever, myoclonus, agitation, tachycardia) if on other serotonergic drugs · worsening depression or suicidal ideation."},
         {tone:"cream", h:"💬 Safety-net scripts", html:"“Tell us if the tablet causes low mood, agitation or persistent sexual side effects — we can adjust.” “Use the numbing spray with a compatible (not polyurethane) condom, or wash it off before sex, so it doesn't affect your partner.” “If this is causing significant distress or relationship difficulty, we can refer for couples or psychosexual support.” “If this is new, there may be a treatable cause — worth checking erections, and your thyroid if you have other symptoms.”"}
       ]},
       {b:"why", html:"Many men can successfully discontinue pharmacotherapy after mastering the behavioural techniques — review the ongoing need at least every 6 months as a shared decision. Men who achieve good control often find the confidence improvement generalises to reduced anxiety, better relationships and enhanced sexual satisfaction for both partners — the benefit extends well beyond IELT."}
     ]},

    {id:"loop", nav:"Not responding?", title:"Not responding? Re-check before referring", sub:"Reconsider the cause and combine modalities first.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"1 · ED treated?", html:"<b>Is coexisting erectile dysfunction optimised first?</b>"},
         {tone:"amber", h:"2 · Combine", html:"<b>Add behavioural or psychosexual support to one drug — never combine dapoxetine with an SSRI, other serotonergic medicine or a PDE5 inhibitor.</b>"},
         {tone:"amber", h:"3 · Adherence and technique", html:"Are the behavioural techniques actually being practised, and the drug used correctly (timing, dose, not with alcohol)?"},
         {tone:"amber", h:"4 · Organic cause", html:"Acquired PE — were ED, prostatitis, thyroid disease (if clinically suggested) and drug causes assessed and treated?"},
         {tone:"amber", h:"5 · Psychological", html:"<b>Anxiety or relationship factors → psychosexual therapy.</b>"},
         {tone:"amber", h:"6 · Refer", html:"<b>Refractory or complex after 6 months → specialist.</b>"}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral criteria", sub:"Most PE can be managed entirely in primary care.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same-day or emergency mental health", html:"Active suicidal ideation · intent or plan · severe depression or self-neglect · psychosis, mania or severe behavioural disturbance."},
         {tone:"red", h:"Urgent medical/urological assessment", html:"Sepsis or suspected acute bacterial prostatitis · acute urinary retention · suspected prostatic abscess · persistent visible haematuria · suspected testicular torsion or acute scrotal pathology · suspicious testicular mass · significant neurological deficit or suspected spinal pathology."},
         {tone:"amber", h:"Psychosexual therapy", html:"Subjective PE · prominent performance anxiety or relationship distress · patient preference · persistent symptoms despite appropriate medication · natural variable PE requiring structured behavioural support."},
         {tone:"blue", h:"Routine urology or sexual-health referral", html:"Persistent acquired PE despite addressing likely causes · suspected chronic bacterial prostatitis · significant penile abnormality or pain · PE with ED not responding to appropriate ED treatment · complex drug interactions or need for dapoxetine/PDE5 combination consideration · failure of an adequate primary-care treatment trial · PE after pelvic surgery or radiotherapy."},
         {tone:"green", h:"Primary care manages", html:"Lifelong PE, acquired PE with no organic cause found, and subjective PE with mild anxiety — start treatment in primary care and review after 4 weeks or 6 doses, then at least every 6 months."}
       ]},
       {b:"why", html:"NHS psychosexual therapy waiting times exceed 6 months in some areas — where they are long, starting dapoxetine as a bridge is appropriate and improves compliance with psychotherapy, because reduced anxiety allows better engagement. Private psychosexual therapy (therapists registered with COSRT or UKCP) is faster and worth signposting; Relate and Relationships Scotland provide couples therapy with psychosexual elements. Surgery for phimosis or frenulum breve is for a clear anatomical indication (pain, recurrent tearing, functional limitation), not a treatment for PE itself."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 39-year-old man, embarrassed, says he now “finishes in under a minute” — it was never a problem until about eight months ago. He has lost half a stone without trying, feels hot and shaky, and has been getting up twice a night to pass urine with some perineal aching. His relationship is strained and he says he has “stopped bothering with any of it”."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Establishes this is <b>acquired, not lifelong, PE</b> and therefore hunts a cause rather than prescribing; picks up the <b>hyperthyroid cluster and checks TSH (± free T4) before PE-directed treatment</b>, knowing thyroid disease is a potentially reversible cause; takes the <b>LUTS and perineal pain seriously as possible prostatitis</b>, distinguishing bacterial prostatitis from CPPS, with MSU and DRE as clinically relevant and PSA deferred while infection is active; <b>asks directly about distress, mood and suicidal thoughts</b> given the hopelessness and withdrawal, using PHQ-9/GAD-7 if a formal assessment is needed; normalises PE (20–30% of men) to reduce shame; explains that <b>behavioural work can add to drug treatment</b>; and safety-nets <b>haematospermia and worsening mood</b>."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Sources underpinning this page; verify doses and interactions against the current SPC.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>EAU \u2014 Guidelines on Sexual and Reproductive Health (Limited Update March 2026)</b> \u2014 international, premature ejaculation section<br><a href="https://uroweb.org/guidelines/sexual-and-reproductive-health" rel="noopener">uroweb.org \u2014 Sexual and Reproductive Health</a><span class="rd"> \u2014 the four-subtype classification; diagnosis by medical and sexual history with self-estimated IELT, perceived control, distress and physical examination; no routine laboratory or physiological tests; pharmacotherapy first-line for lifelong PE; treating ED, prostatitis, LUTS, anxiety or hyperthyroidism first in acquired PE; psychological/behavioural treatment as an adjunct</span></li>'+
         '<li><b>ISSM \u2014 evidence-based definition of premature ejaculation (2014)</b> \u2014 international<span class="rd"> \u2014 the \u22641-minute (lifelong) and \u22643-minute (acquired) IELT thresholds with the inability-to-delay and negative-consequences limbs</span></li>'+
         '<li><b>BSSM \u2014 British Society for Sexual Medicine position statement on premature ejaculation</b> (World J Mens Health 2025)<br><a href="https://pubmed.ncbi.nlm.nih.gov/40034027/" rel="noopener">pubmed.ncbi.nlm.nih.gov/40034027</a><span class="rd"> \u2014 UK practice favouring on-demand dapoxetine as the licensed oral option over off-label daily SSRIs, PDE5 inhibitors, topical anaesthetics and psychosexual interventions</span></li>'+
         '<li><b>SPC \u2014 Priligy (dapoxetine) 30 mg film-coated tablets, revised July 2025</b><br><a href="https://products.mhra.gov.uk/" rel="noopener">products.mhra.gov.uk</a><span class="rd"> \u2014 1\u20133 hours before sexual activity, 30 mg increasing to 60 mg, orthostatic test before starting, reassessment after 4 weeks or 6 doses and at least every 6 months, contraindicated serotonergic co-medication and washout, not with PDE5 inhibitors, syncope rates, and the age, renal, hepatic and CYP3A4 restrictions</span></li>'+
         '<li><b>SPC \u2014 Fortacin 150 mg/mL + 50 mg/mL cutaneous spray, revised November 2024</b><br><a href="https://products.mhra.gov.uk/" rel="noopener">products.mhra.gov.uk</a><span class="rd"> \u2014 licensed for primary PE in adult men; dose and maximum frequency; condom compatibility; partner effects; possible reduction in sperm motility</span></li>'+
         '<li><b>Carani C et al. Multicenter study on the prevalence of sexual symptoms in male hypo- and hyperthyroid patients. J Clin Endocrinol Metab 2005</b><span class="rd"> \u2014 PE in about half of men with hyperthyroidism, improving after thyroid treatment; it does not establish a cure rate for all acquired PE or support routine thyroid testing</span></li>'+
         '<li><b>NICE NG110 \u2014 Prostatitis (acute): antimicrobial prescribing (2018)</b><br><a href="https://www.nice.org.uk/guidance/ng110" rel="noopener">nice.org.uk/guidance/ng110</a> and <b>MHRA Drug Safety Update (January 2024) \u2014 fluoroquinolones</b><br><a href="https://www.gov.uk/drug-safety-update/fluoroquinolone-antibiotics-must-now-only-be-prescribed-when-other-commonly-recommended-antibiotics-are-inappropriate" rel="noopener">gov.uk \u2014 fluoroquinolone restrictions</a><span class="rd"> \u2014 antibiotic choice for acute prostatitis, hospital referral for sepsis, acute urinary retention, suspected prostatic abscess or no improvement within 48 hours, and the restriction of fluoroquinolones to when other antibiotics are inappropriate</span></li>'+
         '<li>NICE NG12 \u2014 Suspected cancer: recognition and referral (updated April 2026)<br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> \u2014 PSA and DRE for LUTS, ED or visible haematuria, the age-specific PSA thresholds, and the prostate and testicular suspected cancer pathway referrals that arise from the examination</span></li>'+
         '<li><b>Pastore AL et al. Int J Androl 2012 (RCT) and Ther Adv Urol 2014</b><br><a href="https://pubmed.ncbi.nlm.nih.gov/22320846/" rel="noopener">pubmed.ncbi.nlm.nih.gov/22320846</a><span class="rd"> \u2014 small studies of pelvic floor rehabilitation vs on-demand dapoxetine in lifelong PE (40 men in the RCT; the 2014 series was uncontrolled) — limited, heterogeneous evidence that does not establish equivalence with dapoxetine</span></li>'+
         '<li><b>Masters WH &amp; Johnson VE (1970) \u00b7 Semans JH</b><span class="rd"> \u2014 the squeeze and stop\u2013start techniques and sensate focus, with the modern relapse caveat</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> \u2014 dapoxetine, Fortacin and SSRI prescribing information (lidocaine/prilocaine cream for PE is off-label); the product SPCs and local formulary take precedence: verify before prescribing</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Primary-care assessment and management of premature ejaculation \u2014 EAU Guidelines on Sexual and Reproductive Health (Limited Update March 2026, international), the ISSM 2014 definition (international), the BSSM position statement (2025), the Priligy and Fortacin SPCs and NICE NG110, with NICE NG12 (updated April 2026) for the prostate and testicular routes. Assessment and management are merged on this page; the former algorithm is retired. Dapoxetine is licensed for men aged 18\u201364; daily SSRIs for PE are off-label. Never combine dapoxetine with an SSRI or other serotonergic medicine, or with a PDE5 inhibitor. Verify every dose and contraindication against the current SPC and BNF before prescribing."
});
