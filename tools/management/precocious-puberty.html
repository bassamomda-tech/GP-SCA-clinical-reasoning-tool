  stemTitle:"Suspected precocious puberty needs paediatric assessment and boys are referred promptly — because in boys this is far more often pathological, and an accurate growth chart is the most useful thing primary care can add",
  stemSub:"Suspected precocious puberty requires paediatric assessment. Consider secondary sexual characteristics before 8 years in girls or before 9 years in boys. Plot accurate serial height and weight, document the sequence and rate of progression, examine for neurological, visual, abdominal and genital abnormalities, and ask about exogenous sex-steroid exposure. Boys require prompt specialist assessment because pathological causes are more common. In either sex, neurological signs, visual abnormalities, raised intracranial pressure, rapid progression, virilisation, polyuria/polydipsia, a testicular mass or vaginal bleeding without breast development require urgent escalation. A very urgent brain/CNS referral within 48 hours under NICE NG12 applies when there is newly abnormal central neurological function; early puberty alone does not meet this criterion. GnRH analogue treatment and imaging decisions are specialist-led. Primary care provides accurate growth plotting, safety-netting, family support and shared-care treatment only under a current specialist/local protocol.",
  guideline:"Bradley et al., BMJ 2020;368:l6597 · NICE NG12 (updated April 2026) · MHRA Drug Safety Update January 2023 · RCPCH UK-WHO growth charts · local paediatric endocrine shared-care protocol · Endocrine Society 2026 (international, specialist context only)",

  ],
  lead:'<div class="mg-layers"><a href="#severe"><b>Red flags</b><small>Intracranial · testicular</small></a><a href="#confirm"><b>Recognise</b><small>&lt;8 girls · &lt;9 boys</small></a><a href="#workup"><b>Assess</b><small>Growth · Tanner · neuro</small></a><a href="#refer"><b>Refer</b><small>Boys promptly · red flags urgently</small></a><a href="#monitor"><b>Then</b><small>Shared care · safety-net</small></a></div>',
  quickSub:"If you read nothing else on this page, read these six cards. Sources are cited under <a href=\"#provenance\">Evidence</a>; follow your local paediatric pathway for referral urgency.",
  quick:[
    {tone:"red", h:"⚠ Refer every boy promptly — even with a normal examination", html:"Precocious puberty in boys is much more likely to have a pathological cause, including an intracranial lesion. Refer all boys with suspected precocious puberty promptly to paediatrics/paediatric endocrinology; use the local urgent pathway, particularly where progression, neurological symptoms, testicular asymmetry or virilisation is present. This does not mean every boy needs same-day emergency attendance or a 48-hour suspected-cancer referral. In girls it is usually idiopathic central precocious puberty, so <b>urgency depends on red flags</b> and the local pathway."},
    {tone:"red", h:"This can be the first sign of a brain lesion", html:"Perform an age-appropriate neurological and visual assessment, including visual acuity, eye movements, pupils, gait/coordination and fundoscopy where feasible. Document whether papilloedema, visual-field symptoms or other neurological abnormalities are present. Do not delay urgent referral because a complete visual-field or fundoscopy examination is not possible in primary care. <b>A normal neurological examination does not exclude an intracranial lesion</b> — central precocious puberty is driven in a proportion of children, especially boys, by a hypothalamic hamartoma, glioma or the sequelae of cranial irradiation. Raised-ICP features → same-day emergency assessment; newly abnormal central neurological function → NICE NG12 very urgent route."},
    {tone:"amber", h:"The growth chart is your highest-value contribution", html:"<b>Plotting serial growth is the single most useful primary-care step.</b> A sustained increase in growth velocity, particularly with progressive secondary sexual characteristics, supports true puberty and should increase the urgency of specialist review; avoid using a single centile crossing over 3–6 months as a diagnostic threshold. Use accurate stadiometry, repeat an unexpectedly abnormal measurement, and calculate velocity only over an adequate interval with reliable measurements. Isolated breast development or pubic hair with a normal growth velocity is often a benign variant. Use the <b>RCPCH UK-WHO growth charts</b>, and add earlier measurements from the personal child health record or school nurse to turn a single plot into a velocity."},
    {tone:"blue", h:"Definition — and what counts in each sex", html:"Secondary sexual characteristics before age 8 in girls and before age 9 in boys. The first sign is usually breast development in girls and testicular enlargement (about 4 mL or more; orchidometry is operator-dependent, so if it is not reliable describe the testes as prepubertal, enlarged, asymmetric or associated with a mass) in boys. Pubic hair and body odour reflect adrenal androgen activity and do not by themselves establish central puberty; penile growth without testicular enlargement may suggest peripheral androgen exposure. Girls: progressive breast enlargement before 8 (especially with growth acceleration; distinguish from lipomastia), clitoromegaly, or menarche before 8. Boys: penile growth or testicular enlargement before 9 — and examine for a testicular mass. Vaginal bleeding without breast development is not early menarche."},
    {tone:"blue", h:"Central, peripheral, or a benign variant", html:"<b>Central (gonadotrophin-dependent):</b> early HPG-axis activation — idiopathic (commonest in girls), intracranial lesion, post-CNS insult; follows the normal pubertal sequence. <b>Peripheral (gonadotrophin-independent):</b> CAH, adrenal or gonadal tumour, McCune-Albright, exogenous steroids; <b>may be out of sequence</b>. <b>Benign variants:</b> premature thelarche and premature adrenarche — non-progressive, but still assessed. In boys, testicular size is the bedside discriminator: both testes enlarge in central puberty, not with an adrenal or exogenous androgen source."},
    {tone:"green", h:"Assess and refer — do not dismiss or indefinitely observe", html:"Do not simply dismiss or indefinitely observe suspected precocious puberty without assessment. Refer or discuss with paediatrics according to the local pathway; the diagnosis, the need for imaging and the GnRH-analogue decision are all specialist judgements. Once a specialist has confirmed a benign non-progressive variant, observation with documented growth and pubertal review may be appropriate. <b>Confirm the referral is made and attended, and chase non-attendance</b> — then keep plotting growth and escalate if red flags emerge."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step is the neurological examination.",
  pathway:[
    {title:"Screen for intracranial and serious causes", html:"Raised-ICP signs, new seizure or acute visual loss (same-day emergency assessment) · newly abnormal central neurological function (NICE NG12 48-hour route — early puberty alone does not qualify) · new headache or visual disturbance · polyuria and polydipsia · CNS disorder or injury · sustained growth acceleration on reliable measurements · pubic hair in infancy · virilisation in a girl · vaginal bleeding without breast development · a testicular mass or persistent asymmetry · acute painful testicular swelling (acute scrotal pathway).", alert:true},
    {title:"Confirm it meets the definition", html:"<b>Before 8 in girls, before 9 in boys.</b> Establish the sequence and the <b>rate of progression</b>, and review <b>exogenous sex-steroid exposure</b> — including a parent’s testosterone or oestrogen gel or cream, anabolic steroids, androgen supplements, and compounded or imported hormonal products — and perinatal or CNS history."},
    {title:"Examine and plot", html:"Tanner staging (breast tissue versus lipomastia; pubic/axillary hair, acne, body odour), accurate height, weight and BMI on a growth chart (growth velocity only where measurements are reliable), age-appropriate neurological and visual assessment (acuity, eye movements, pupils, gait/coordination, fundoscopy where feasible), abdomen for a mass or hepatosplenomegaly, testicular size, asymmetry and lumps in boys, skin for café-au-lait macules and neurofibromatosis, thyroid if indicated, and BP. Record parental heights. Document staging in words and numbers — do not photograph the child."},
    {title:"Refer — by local pathway, urgency by presentation", html:"Same-day emergency assessment for raised-ICP features, new seizure, acute visual loss, suspected torsion or a safeguarding emergency. NICE NG12 very urgent route for newly abnormal central neurological function. All boys promptly via the local urgent pathway. Girls urgently if any red flag, clitoromegaly, menarche before 8, or progressive breast development before 8 with growth acceleration; isolated non-progressive variants → routine referral or local discussion. <b>Highlight red flags in the letter.</b>"},
    {title:"Support, share care, safety-net", html:"Psychosocial support and school liaison, weight where relevant, stop or prevent further exogenous sex-steroid exposure where medically safe; administer depot GnRH analogue only under a current local shared-care agreement and specialist plan; keep plotting growth and escalate on new red flags."}
  ],
  sections:[

    {id:"severe", nav:"Red flags", title:"Red flags — intracranial and serious causes",
     sub:"Precocious puberty can be the first sign of an intracranial lesion. Perform an age-appropriate neurological assessment and plot growth in every child — a normal examination does not exclude an intracranial lesion.",
     blocks:[
       {b:"table", head:["Red flag","Significance","Action"], rows:[
         ["<b>Signs of raised intracranial pressure</b> — reduced consciousness, persistent vomiting with concerning headache, papilloedema, rapidly progressive visual symptoms, new seizure","<b>Possible intracranial pathology</b>","<b>Same-day emergency assessment</b> — do not arrange endocrine investigations first"],
         ["New headaches or visual disturbance without raised-ICP features or new neurological signs","<b>Possible intracranial pathology</b>","<b>Urgent paediatric referral — flag clearly in the letter</b>; headache alone does not meet the NG12 48-hour criterion"],
         ["<b>Polyuria and polydipsia</b>","Possible pituitary or hypothalamic cause — for example cranial diabetes insipidus from a hypothalamic lesion","<b>Urgent paediatric referral</b>"],
         ["<b>Newly abnormal cerebellar or other central neurological function</b> — visual-field loss, abnormal gait or coordination, cranial-nerve abnormalities (for example new squint), focal motor/sensory signs, seizures","<b>Possible brain or CNS tumour</b>","<b>NICE NG12 (updated April 2026): consider very urgent referral (appointment within 48 hours)</b> and state the neurological abnormality explicitly; same-day emergency assessment instead if papilloedema or other raised intracranial pressure features. Early puberty alone does not meet this criterion"],
         ["<b>History of CNS disorder or injury</b>","CNS trauma, meningitis, hydrocephalus, cranial irradiation, hypoxic-ischaemic injury, neurofibromatosis — all raise the risk of central precocious puberty","<b>Urgent paediatric referral</b>"],
         ["<b>Significant, sustained growth acceleration</b> on reliable serial measurements","<b>Supports true progressive precocious puberty and adds urgency</b>","<b>Urgent paediatric referral</b>"],
         ["<b>Pubic hair in infancy</b>","Distinguish transient infant mini-puberty from <b>congenital adrenal hyperplasia, a virilising adrenal or gonadal tumour, or exogenous androgen exposure</b>","<b>Urgent paediatric referral</b>"],
         ["<b>Pubic hair, body odour or acne with rapid progression</b>, growth acceleration, clitoromegaly, penile enlargement or advanced bone age","<b>Virilisation rather than premature adrenarche</b>","<b>Urgent paediatric referral</b>. Isolated, non-progressive premature adrenarche in a well child does not need urgent referral — routine assessment may be appropriate"],
         ["<b>A discrete testicular mass, persistent asymmetry, or firm unilateral enlargement</b>","<b>A possible gonadal source</b> — a Leydig-cell tumour is an important differential with unilateral enlargement and virilisation, but should not be assumed clinically; asymmetry can be physiological and a lump has several causes","<b>Urgent paediatric/urological assessment</b>, usually with ultrasound; note it prominently in the referral"],
         ["<b>Acute painful testicular enlargement or suspected torsion</b>","<b>Surgical emergency</b>","Follow the acute scrotal pathway — not the endocrine referral pathway"],
         ["<b>Virilisation in a girl</b> — clitoromegaly, rapidly progressive pubic hair, acne, voice change","<b>An androgen source</b> — CAH, adrenal or ovarian tumour, exogenous testosterone — rather than ordinary early puberty","<b>Urgent paediatric referral</b>; ask specifically about testosterone gel in the household"],
         ["<b>Vaginal bleeding without breast development</b>","<b>Not assumed to be menarche</b> — consider trauma, a foreign body, vulvovaginitis, infection, urethral or vaginal pathology, ovarian cyst/tumour and McCune–Albright syndrome","Urgent paediatric assessment; follow local safeguarding procedures where the history, examination or disclosure indicates concern"],
         ["<b>Rapid progression</b> — moving through Tanner stages within months, or menarche before 8","<b>A strong sex-steroid drive</b>","<b>Urgent paediatric referral</b> in either sex"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"purple", h:"🟣 NICE NG12 — very urgent (48 hours) brain and CNS route", html:"In a child or young person with newly abnormal cerebellar or other central neurological function, consider a very urgent referral (for an appointment within 48 hours) for suspected brain or central nervous system cancer. Precocious puberty with new neurological signs — such as visual-field loss, abnormal gait or coordination, cranial-nerve abnormalities, focal motor/sensory signs or seizures — meets this criterion (papilloedema or other raised-ICP features need same-day emergency assessment instead); state the neurological abnormality explicitly in the referral. Headache alone, or early puberty with a normal neurological examination, does not. Repeated in <a href=\'#refer\'>Refer</a>.", src:"NICE NG12 (updated April 2026) — children and young people, brain and CNS"},
         {tone:"red", h:"Vaginal bleeding without breast development", html:"Vaginal bleeding without breast development is not assumed to be menarche. Consider trauma, a foreign body, vulvovaginitis, infection, urethral or vaginal pathology, ovarian cyst/tumour and McCune–Albright syndrome. Consider safeguarding concerns where the history, examination or disclosure indicates them, and follow local safeguarding procedures. Isolated bleeding is not a safeguarding presentation by default.", src:"Bradley et al., BMJ 2020;368:l6597 · Working Together to Safeguard Children 2023"}
       ]},
       {b:"warn", html:"Refer every boy with suspected precocious puberty promptly via the local urgent pathway — pathology, including intracranial causes, is much more likely than in girls. Separate the urgency: <b>same-day emergency assessment</b> for raised-ICP features, reduced consciousness, new seizure, acute visual loss, suspected torsion or a safeguarding emergency; <b>NG12 very urgent referral</b> for newly abnormal central neurological function without immediate instability; <b>urgent paediatric/endocrine referral</b> for suspected progressive precocious puberty without neurological signs. Do not arrange endocrine investigations before emergency assessment where raised intracranial pressure is suspected."},
       {b:"why", html:"Central precocious puberty results from early activation of the hypothalamic-pituitary-gonadal axis, which in a proportion of children — especially boys — is driven by an intracranial lesion such as a hypothalamic hamartoma, glioma, or the sequelae of cranial irradiation or hydrocephalus. That is why an age-appropriate neurological and visual assessment (with fundoscopy where feasible), and attention to headache or raised-ICP features, belongs in every primary-care assessment — remembering that a normal examination does not exclude an intracranial lesion."},
       {b:"dl", rows:[
         ["<b>NG12 — the paediatric criterion that applies here</b>","NICE NG12 children and young people: consider a very urgent referral (for an appointment within 48 hours) for suspected brain or central nervous system cancer in a child or young person with newly abnormal cerebellar or other central neurological function. Precocious puberty with new neurological signs (visual-field loss, abnormal gait or coordination, cranial-nerve abnormalities, focal motor/sensory signs or seizures) meets that criterion — papilloedema and other raised-ICP features need same-day emergency assessment instead — and the referral should say so explicitly rather than going as a routine endocrine letter. Separately, <b>a discrete testicular mass, persistent asymmetry or firm unilateral enlargement warrants urgent paediatric/urological assessment in its own right</b>, usually with ultrasound; acute painful swelling follows the acute scrotal pathway. Precocious puberty itself, or headache alone, without neurological signs or a mass, has no NG12 criterion and none should be invented for one. The children\u2019s recommendations are unchanged in the April 2026 update"]
       ]}
     ]},

    {id:"confirm", nav:"Recognise", title:"Recognising precocious puberty, and the causes",
     blocks:[
       {b:"dl", rows:[
         ["<b>Definition</b>","Onset of secondary sexual characteristics before age 8 in girls and before age 9 in boys (Bradley et al., BMJ 2020). The first sign is breast development (thelarche) in girls and testicular enlargement in boys"],
         ["<b>Girls — features</b>","Progressive breast enlargement before 8 (a firm, often tender disc under the areola — Tanner B2 — especially with growth acceleration), clitoromegaly, or menarche before 8. Palpate to separate true breast tissue from fat (lipomastia)"],
         ["<b>Boys — features</b>","Penile growth or testicular enlargement before 9 — a volume of 4 mL or more on an orchidometer, or a length over 2.5 cm, marks the start of gonadal puberty. Measurement is operator-dependent — if orchidometry is not reliable, describe the testes as prepubertal, enlarged, asymmetric or associated with a mass. Penile growth without testicular enlargement may suggest peripheral androgen exposure. Examine for a testicular mass or lump"],
         ["<b>Boys — the testicular clue</b>","Both testes enlarged with virilisation → central (gonadotrophin-driven). Prepubertal-size testes with virilisation → an adrenal source, CAH or exogenous androgen. One enlarged testis or a mass → urgent paediatric/urological assessment and usually ultrasound; a Leydig-cell tumour is an important differential with unilateral enlargement and virilisation, but should not be assumed clinically"],
         ["<b>Reading the signs</b>","Pubic hair and body odour reflect adrenal androgen activity and do not by themselves establish central puberty. Breast development should be distinguished from lipomastia. Document Tanner staging in words and numbers — it does not need to be photographed"],
         ["<b>Exposure history</b>","Ask directly whether a parent or carer uses testosterone gel: the MHRA (Drug Safety Update, January 2023) reported a child with increased growth and genital enlargement after repeated accidental skin-to-skin transfer. Also oestrogen creams or gels, HRT gels, anabolic steroids, androgen supplements, and compounded or imported hormonal products"],
         ["<b>History</b>","Age and sequence of changes (true puberty follows an order); rate of progression; growth spurt; headache, visual symptoms, vomiting, polyuria and polydipsia; behaviour and mood change; exogenous sex-steroid exposure (creams, gels, supplements); body odour and acne; perinatal and CNS history (irradiation, infection, trauma, hydrocephalus); family age of puberty and any family history of CAH"]
       ]},
       {b:"table", head:["Cause group","Detail"], rows:[
         ["<b>Central (gonadotrophin-dependent)</b>","Early HPG-axis activation: idiopathic (commonest in girls), intracranial lesions (hypothalamic hamartoma, glioma), post-CNS insult. Follows a normal pubertal sequence"],
         ["<b>Peripheral (gonadotrophin-independent)</b>","Sex steroids from elsewhere: congenital adrenal hyperplasia, adrenal or gonadal tumours, McCune-Albright (autonomous ovarian cysts), hCG-secreting germ cell tumours in boys, exogenous steroids. May be out of normal sequence — for example virilisation in a girl, or pubic hair before testicular growth in a boy"],
         ["<b>Benign normal variants</b>","Premature thelarche (isolated breast development, most often in the first two years of life, normal growth, no progression) and premature adrenarche (pubic or axillary hair and body odour from adrenal androgens, no breast or testicular development, no rapid growth) — non-progressive; still need assessment to confirm"],
         ["<b>Don't forget</b>","Severe primary hypothyroidism — the paradox of pubertal signs with SLOW growth, which resolves with levothyroxine. McCune-Albright — café-au-lait macules with irregular borders, fibrous dysplasia of bone, and recurrent vaginal bleeding from ovarian cysts"]
       ]},
       {b:"why", html:"Distinguishing central from peripheral precocious puberty determines treatment: central is treated with a <b>GnRH analogue</b> to switch the axis back off and protect adult height and psychosocial wellbeing, whereas <b>peripheral causes require treatment of the source</b> — a tumour, CAH. The benign variants need recognition so that children are reassured and monitored rather than over-investigated, but the initial referral remains appropriate because the distinction is a specialist one — and a proportion of apparent premature thelarche goes on to progress."}
     ]},

    {id:"differential", nav:"Differential", title:"Differential diagnosis — bedside patterns for the referral letter",
     sub:"Pointers that shape the urgency and the letter. None of them replaces the specialist assessment.",
     blocks:[
       {b:"table", head:["Condition","Discriminating features","Next step"], rows:[
         ["<b>Premature thelarche</b>","Breast development only, usually under 2–3 years, normal growth velocity, no progression, no pubic hair","Routine referral or local discussion for confirmation; usually monitored rather than treated. Re-plot growth"],
         ["<b>Premature adrenarche</b>","Pubic or axillary hair and body odour only; no breast or testicular development; normal growth","Routine referral or local discussion if isolated, non-progressive and the child is otherwise well. Rapid progression, growth acceleration, virilisation, clitoromegaly, penile enlargement or advanced bone age instead suggests CAH, a tumour or exogenous androgen → urgent"],
         ["<b>Central precocious puberty</b>","Ordered progression through the normal sequence with a growth spurt; in boys both testes enlarge","Girls: usually idiopathic — urgency by red flags. Boys: a cause is more often found — refer promptly via the local urgent pathway"],
         ["<b>Peripheral precocious puberty</b>","Out of sequence or virilising; in boys virilisation with prepubertal-size testes, or one enlarged testis","Urgent referral; examine the abdomen and testes; ask about gels and creams"],
         ["<b>Exogenous sex steroid</b>","Parent or carer uses testosterone or oestrogen gel; genital enlargement or breast development with no other cause","Stop or prevent further transfer where medically safe (cover the site, wash hands, avoid skin contact) without abruptly stopping the adult’s essential prescribed hormones, and refer; changes may regress"],
         ["<b>Hypothyroidism</b>","Pubertal signs with slowing growth; hypothyroid features","TFTs in primary care, and refer"],
         ["<b>McCune-Albright syndrome</b>","Café-au-lait macules with irregular borders, fibrous dysplasia, recurrent vaginal bleeding","Urgent paediatric endocrinology"],
         ["<b>Intracranial lesion</b>","Headache, vomiting, visual field loss, papilloedema, squint, polyuria and polydipsia, CNS history","NICE NG12 very urgent (48-hour) route if newly abnormal central neurological function; same day if raised ICP"],
         ["<b>Non-pubertal vaginal bleeding</b>","Bleeding without breast development","Urgent paediatric assessment — trauma, foreign body, vulvovaginitis, infection, urethral or vaginal pathology, ovarian cyst/tumour, McCune–Albright; safeguarding procedures where history, examination or disclosure indicates"],
         ["<b>Lipomastia</b>","Soft fatty tissue without a firm subareolar disc, usually with overweight","Reassure if clearly fat and growth is normal; refer if in doubt"]
       ]},
       {b:"why", html:"In boys the testes are the best bedside discriminator, because gonadotrophins enlarge both testes while adrenal and exogenous androgens virilise without testicular growth. Parental heights put the child\u2019s own centile in context — a tall child of tall parents is less concerning than one crossing upwards away from the family centile — but parental height helps contextualise and does not exclude pathology, and neither parental height nor obesity should be used to dismiss early puberty. These patterns belong in the referral letter; they are not a diagnosis to act on alone."}
     ]},

    {id:"workup", nav:"Assess", title:"Examination, growth plotting, and what the specialist will do",
     sub:"The examination and the growth chart are yours; test only in selected cases and never let tests delay referral. Imaging and hormonal work-up are specialist-led.",
     blocks:[
       {b:"table", head:["GP assessment (primary care)","Detail"], rows:[
         ["<b>Examination</b>","Height, weight and BMI; Tanner staging; breast tissue versus lipomastia; pubic/axillary hair, acne and body odour; genital examination with testicular size and asymmetry; abdomen for a mass or hepatosplenomegaly; skin for café-au-lait lesions and signs of neurofibromatosis; blood pressure; neurological screening; visual symptoms, visual acuity where available, eye movements and fundoscopy if feasible (formal visual fields are not expected in every GP consultation); thyroid examination if clinically indicated; parental heights to estimate the target centile. In boys the testicular examination directs the work-up: asymmetric enlargement suggests a tumour, whereas bilateral enlargement suggests central activation"],
         ["<b>Growth plotting</b>","Plot serial height and weight on the RCPCH UK-WHO charts. Use accurate stadiometry where possible and repeat an unexpectedly abnormal measurement; obtain previous measurements from the red book, school nurse or previous consultations; calculate growth velocity only when there is an adequate interval and reliable measurements; plot BMI/weight because obesity may influence timing and interpretation. A sustained increase in growth velocity, particularly with progressive secondary sexual characteristics, supports true puberty and increases the urgency of specialist review — do not use a single centile crossing over 3–6 months as a diagnostic threshold. Parental heights help contextualise but do not exclude pathology. A slowing growth rate with pubertal signs points instead to hypothyroidism"],
         ["<b>Documentation</b>","Record Tanner stage in words and numbers and plot the measurements; do not photograph a child\u2019s genital or breast development for the referral"],
         ["<b>Syndromic clues</b>","Café-au-lait macules and facial asymmetry (McCune-Albright), neurofibromatosis stigmata, and signs of hyperthyroidism or Cushing's"],
         ["<b>Bone age</b>","Wrist X-ray for bone age is usually arranged by the specialist; an advanced bone age versus chronological age indicates significant sex-steroid exposure"],
         ["<b>Primary-care role in testing</b>","Selected tests only, and never at the expense of referral: TFTs if there is slow growth, hypothyroid symptoms or pubertal signs with growth deceleration; glucose/urinalysis if polyuria and polydipsia are present, while arranging urgent paediatric assessment; 17-hydroxyprogesterone and androgen testing only if supported by the local paediatric pathway and there is virilisation or marked premature adrenarche. Avoid random LH and oestradiol — they are hard to interpret and a normal random result does not exclude evolving central puberty. Do not arrange a routine brain MRI directly from primary care unless specifically supported by the local pathway; MRI, bone age, gonadotrophins, sex steroids and stimulation testing are generally specialist-led"]
       ]},
       {b:"table", head:["Specialist investigation (paediatrics — not for primary care to arrange)","What it shows"], rows:[
         ["<b>Bone age</b>","Wrist X-ray — advanced bone age quantifies the sex-steroid effect and predicts the impact on final height"],
         ["<b>Hormones</b>","Basal LH and FSH (an ultrasensitive assay is increasingly used first) and a GnRH (LHRH) stimulation test where needed to separate central (pubertal LH response) from peripheral (suppressed gonadotrophins); oestradiol or testosterone; 17-OHP, DHEAS and androgens if there is virilisation; hCG in boys with peripheral features; TFTs"],
         ["<b>Imaging</b>","Pituitary or brain MRI for central precocious puberty — particularly in boys and younger girls, and always with neurological signs; pelvic USS (uterine and ovarian maturation, cysts) in girls; testicular or adrenal USS if a peripheral source is suspected"],
         ["<b>Evolving practice (international, specialist context only)</b>","The Endocrine Society guideline (JCEM 2026, international) suggests MRI need not be routine in girls aged 6–8 or boys aged 8–9 with central precocious puberty and no neurological findings, and suggests watchful waiting with repeat examination for girls with thelarche at 7–8 years. These are specialist decisions and do not set GP referral thresholds — refer or discuss according to the local paediatric pathway"]
       ]},
       {b:"why", html:"<b>Plotting serial growth is the single most useful primary-care step:</b> a sustained increase in growth velocity on reliable measurements supports true precocious puberty and adds urgency, whereas isolated breast development or pubic hair with a normal growth velocity often represents a benign variant. The GnRH stimulation test is the pivotal specialist investigation, because it directly demonstrates whether the axis has been switched on (central) or is suppressed by a peripheral steroid source — a distinction random hormone levels cannot reliably make. Ultrasensitive basal LH now often answers the question before a stimulation test is needed (Endocrine Society, international, 2026). Brain MRI is most valuable where the pre-test probability of an intracranial lesion is highest — boys, very young girls and any child with neurological signs — and the 2026 international guidance narrows routine MRI in older children without neurological findings. That nuance sits with the specialist; it is one more reason the primary-care task is to refer with good growth data rather than to start testing."}
     ]},

    {id:"ladder", nav:"Treatment", title:"Specialist treatment and shared care",
     sub:"The treatment decision is specialist-led. The GP's part is often delivering it and monitoring the child.",
     blocks:[
       {b:"table", head:["Situation","Treatment"], rows:[
         ["<b>Central precocious puberty</b>","A GnRH analogue depot — for example depot leuprorelin or triptorelin — paradoxically suppresses the axis, halting progression to preserve adult height and reduce psychosocial impact. Initiated and monitored by paediatric endocrinology. Duration is a specialist decision, individualised to age at presentation, rate of progression, bone age, predicted adult height, psychosocial impact, treatment response, local specialist practice and patient/family preference — it is not a GP treatment rule"],
         ["<b>Peripheral precocious puberty</b>","Treat the source: surgery or oncology for a tumour; steroid replacement for CAH; specialist hormonal treatment in McCune-Albright; stop or prevent further exogenous sex-steroid exposure where medically safe"],
         ["<b>Benign variants</b>","Monitor — no drug — once a specialist has confirmed a benign non-progressive variant. Premature thelarche and adrenarche need reassurance and surveillance of growth and progression, not treatment"],
         ["<b>GP and shared-care role</b>","GnRH analogue treatment is initiated and monitored by paediatric endocrinology. GP administration should occur only under a current local shared-care agreement and specialist plan, with the exact product, dose, interval, reconstitution requirements and monitoring responsibilities clearly stated. Give the depot injections on time (missed doses can let puberty restart), monitor growth and pubertal staging, support adherence, and watch for injection-site or treatment effects — escalating concerns to the specialist. The GP does not independently start, stop or alter the dose or interval"]
       ]},
       {b:"warn", html:"<b>Missed or delayed depot dose:</b> if a depot dose is delayed, do not automatically administer a catch-up dose without checking the specialist plan or product instructions. Contact the paediatric endocrine team if a dose is missed, delayed or cannot be administered as scheduled."},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"⚠ GnRH analogue — adverse effects and safety", html:"Injection-site pain or reaction · sterile abscess, depending on preparation · headache · mood or behavioural change · vaginal bleeding may occur transiently after starting treatment · rare allergic reactions · renewed pubertal progression if doses are missed. Ensure the child and family know who to contact. The GP should not independently alter the depot interval or dose.", src:"Local paediatric endocrine shared-care protocol · product information"}
       ]},
       {b:"why", html:"GnRH analogues exploit the physiology of the axis: continuous (rather than pulsatile) GnRH stimulation desensitises the pituitary, switching gonadotrophin secretion off and arresting pubertal progression — buying time for growth and emotional maturation so final height and wellbeing are protected. The decision to treat balances predicted height loss and psychosocial impact against the burden of therapy, which is why it is specialist-led, often with the GP delivering the depot only under a current shared-care agreement and specialist plan."}
     ]},

    {id:"lifestyle", nav:"Family support", title:"Family support and modifiable factors",
     sub:"Support the child while the specialist work-up proceeds — this is genuine management, not a soft add-on.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"🫂 Psychosocial support", html:"Early development can affect self-esteem, peer relationships and behaviour — offer age-appropriate explanation and, where helpful, school liaison.", src:"Bradley et al., BMJ 2020;368:l6597"},
         {tone:"green", h:"⚖️ Weight", html:"Address adiposity where relevant — it associates with earlier puberty in girls — and support healthy diet and activity without blame. Do not use obesity to dismiss early puberty.", src:"Bradley et al., BMJ 2020;368:l6597"},
         {tone:"amber", h:"🧴 Exogenous steroids", html:"Ask about a parent’s testosterone or oestrogen gel or cream, anabolic steroids, androgen supplements, and compounded or imported hormonal products. Advise the adult to wash hands after application, allow the product to dry, cover the application site with clothing, wash the site before close skin-to-skin contact, avoid contact between the child and the application site, and wash contaminated skin promptly. Stop or prevent further exposure where this is medically safe, and discuss the prescribing adult’s treatment with the relevant clinician — do not abruptly stop essential prescribed hormone replacement without appropriate advice. Refer the child if exposure is suspected.", src:"MHRA Drug Safety Update January 2023 (topical testosterone)"},
         {tone:"cream", h:"💬 Reassurance", html:"Explain that benign normal variants (premature thelarche and adrenarche) are common but still warrant the assessment already arranged.", src:"Bradley et al., BMJ 2020;368:l6597"},
         {tone:"cream", h:"🩲 Practical preparation", html:"If periods are likely before specialist review, talk through menstrual products and school arrangements with the child and family.", src:"Bradley et al., BMJ 2020;368:l6597"},
         {tone:"amber", h:"🛡 Vulnerability", html:"A child who looks older than their age may face inappropriate expectations from adults, bullying, sexualisation, and distress about menstruation or body changes. Assess safeguarding according to the child’s circumstances, disclosures and examination findings — precocious puberty alone is not evidence of abuse. Give the family words to explain the changes to the child.", src:"Working Together to Safeguard Children 2023"}
       ]},
       {b:"why", html:"The impact of early puberty on the child — being physically out of step with peers, and the emotional consequences — is part of the specialist's decision about whether and when to treat, so acknowledging and supporting it is genuine management. Stopping or preventing exogenous steroid exposure is a concrete, reversible cause of peripheral changes that primary care can identify and act on directly; the MHRA advice on topical testosterone (January 2023) centres on preventing skin-to-skin transfer to children."}
     ]},

    {id:"monitor", nav:"Review", title:"Review, follow-up and safety-netting",
     blocks:[
       {b:"table", head:["What","Detail"], rows:[
         ["<b>Ensure the referral happens</b>","Confirm the referral is made and attended — do not dismiss or indefinitely observe without assessment. Chase non-attendance. Observation with documented growth and pubertal review is appropriate only once a specialist has confirmed a benign non-progressive variant"],
         ["<b>Keep plotting growth</b>","Use the RCPCH UK-WHO growth charts; accurate serial measurements and a documented sustained rise in growth velocity strengthen the referral and track progression"],
         ["<b>Escalate urgency</b>","Raised-ICP signs, reduced consciousness, new seizure, acute visual loss or acute painful testicular swelling → same-day emergency assessment; newly abnormal central neurological function → NICE NG12 48-hour route; new headache or visual disturbance without these, sustained growth acceleration or a new testicular mass → expedite the paediatric referral"],
         ["<b>Shared care</b>","If a GnRH analogue is started, give each depot on schedule only under the current shared-care agreement (no catch-up dose without checking the specialist plan or product instructions), record growth and staging at each visit, and tell the specialist about missed doses or renewed progression"],
         ["<b>Safety-net wording</b>","\u201cPlease come back straight away, before the appointment, if there are headaches — especially in the morning or with being sick — any change in vision, fits, unusual thirst or passing lots of urine, or if the changes speed up.\u201d"],
         ["<b>Reassure</b>","Most girls have a benign or idiopathic cause; specialist assessment is routine practice, and confirmed benign variants are monitored rather than treated"],
         ["<b>Re-examine and re-flag</b>","Re-examine and escalate the urgency if red flags develop; flag any red flag prominently in the referral"]
       ]},
       {b:"why", html:"Serial growth data and clear safety-netting are the most valuable things primary care can add while a child waits to be seen: a documented accelerating growth velocity both supports the diagnosis and raises the urgency, and the safety-net ensures that an evolving intracranial cause is escalated rather than missed. Specific symptoms in plain words — morning headache with vomiting, visual change, thirst — are easier for a family to act on than \u201ccome back if worse\u201d."},
       {b:"say", html:"What you have noticed does need a specialist opinion, and I am arranging that today — I am not going to just watch and wait, because working out the cause needs tests we do not do here. In girls this is usually simply early puberty with no underlying problem, and often it settles into being a normal variation; in boys we are more careful, which is why every boy is seen promptly by the specialist team. Two things I will do meanwhile: keep measuring and plotting height, because a growth spurt tells the specialist a great deal, and check there is nothing at home that could be contributing, like a hormone cream. And please come back sooner if there are headaches, any change in vision, or vomiting."}
     ]},

    {id:"refer", nav:"Refer", title:"Referral — urgency by presentation and the local paediatric pathway",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Emergency / same-day assessment", html:"Signs of raised intracranial pressure · reduced consciousness · new seizure · acute visual loss · persistent vomiting with concerning headache · acute painful testicular swelling or suspected torsion (acute scrotal pathway) · safeguarding emergency. Do not arrange endocrine investigations first.", src:"Bradley et al., BMJ 2020;368:l6597 · Working Together to Safeguard Children 2023"},
         {tone:"red", h:"All boys — prompt referral via the local urgent pathway", html:"Precocious puberty in boys is more often pathological → refer all boys with suspected precocious puberty promptly to paediatrics/paediatric endocrinology, even with a normal examination; use the local urgent pathway, particularly where progression, neurological symptoms, testicular asymmetry or virilisation is present. This is not a same-day emergency or 48-hour suspected-cancer referral unless those criteria are met. A testicular mass or unilateral enlargement needs urgent paediatric/urological assessment, usually with ultrasound.", src:"Bradley et al., BMJ 2020;368:l6597"},
         {tone:"red", h:"Urgent paediatric/endocrine referral", html:"All boys with suspected precocious puberty · rapid progression in either sex · virilisation or clitoromegaly · unilateral testicular enlargement or mass · pubic hair in infancy · vaginal bleeding without breast development · significant growth acceleration · CNS history or previous cranial irradiation · polyuria and polydipsia · suspected exogenous sex-steroid exposure with progressive changes. Highlight the red flags in the referral so paediatrics can judge how urgent.", src:"Bradley et al., BMJ 2020;368:l6597"},
         {tone:"purple", h:"Very urgent referral (48 hours) · NICE NG12", html:"Newly abnormal cerebellar or other central neurological function in a child or young person (for example visual-field loss or significant new visual abnormality, abnormal gait or coordination, focal weakness or sensory loss, cranial-nerve abnormalities, new seizure) → consider a very urgent referral (appointment within 48 hours) for suspected brain or CNS cancer; papilloedema or other raised-ICP features → same-day emergency assessment instead. Say so explicitly in the letter rather than sending a routine endocrine referral. Early puberty alone does not meet an NG12 criterion.", src:"NICE NG12 (updated April 2026) — children and young people, brain and CNS"},
         {tone:"amber", h:"Girls — urgent", html:"Any red flag, clitoromegaly or other virilisation, menarche before 8, or progressive breast development before 8 with growth acceleration.", src:"Bradley et al., BMJ 2020;368:l6597"},
         {tone:"blue", h:"Routine paediatric referral or local discussion", html:"Isolated, non-progressive premature thelarche · isolated, non-progressive premature adrenarche · girls aged 7–8 with isolated early breast development, normal growth and no red flags. The exact waiting-time category should follow the local paediatric service pathway rather than being inferred solely from sex. Watchful waiting for thelarche at 7–8 years (2026 international guideline) is a specialist decision, not an emergency and not a reason to skip assessment.", src:"Bradley et al., BMJ 2020;368:l6597 · Endocrine Society 2026 (international)"},
         {tone:"red", h:"Safeguarding", html:"Unexplained genital injury, a disclosure or concerning circumstances → follow local child-protection procedures alongside the medical referral. Isolated vaginal bleeding is not a safeguarding presentation by default, and precocious puberty alone is not evidence of abuse.", src:"Working Together to Safeguard Children 2023"},
         {tone:"cream", h:"Do not dismiss or indefinitely observe", html:"Do not simply dismiss or indefinitely observe suspected precocious puberty without assessment. Refer or discuss with paediatrics or paediatric endocrinology according to the local pathway. Once a specialist has confirmed a benign non-progressive variant, observation with documented growth and pubertal review may be appropriate. The diagnosis, the need for imaging and the GnRH-analogue decision are specialist judgements.", src:"Bradley et al., BMJ 2020;368:l6597"},
         {tone:"blue", h:"What to put in the letter", html:"Age at first change and the sequence since; the plotted growth chart with any previous measurements (personal child health record, school nurse); calculated growth velocity where reliable; weight/BMI trajectory; Tanner stage in words; parental heights and target height range; neurological and testicular findings; any exposure to hormone gels or creams; and whether an NG12 criterion is met.", src:"RCPCH UK-WHO growth charts · NICE NG12 (updated April 2026)"}
       ]},
       {b:"why", html:"The sex difference in referral urgency reflects the underlying epidemiology: in girls, precocious puberty is usually idiopathic central precocious puberty, whereas in boys an identifiable — and sometimes serious — cause is much more common, so every boy warrants prompt specialist assessment via the local pathway. Suspected cases are referred or discussed because the diagnosis, the need for imaging and the decision about GnRH-analogue treatment to preserve final height are specialist judgements. Previous measurements from the personal child health record or school nurse can turn a single plot into a velocity, which is often what decides the urgency at triage."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A mother brings her 7-year-old son because he has grown out of two shoe sizes since Easter, has developed pubic hair, and \u201csmells like a teenager\u201d. He has been getting early-morning headaches for a fortnight, which she attributes to screen time. His examination is otherwise unremarkable and she asks whether they can \u201cjust keep an eye on it\u201d.", src:"Bradley et al., BMJ 2020;368:l6597"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Knows the boys' threshold is before 9 and that every boy is referred promptly regardless of examination; takes the early-morning headaches seriously and performs an age-appropriate neurological and visual assessment with fundoscopy where feasible, escalating same day if there are raised-ICP features; plots the height and weight and recognises sustained growth acceleration as both diagnostic support and an urgency marker; recognises this meets the NG12 very-urgent brain/CNS criterion only if neurological function is newly abnormal, and says so in the letter; asks about <b>exogenous steroid exposure and CNS history</b>; declines the \u201ckeep an eye on it\u201d request with a clear explanation; and \u2014 the step candidates miss \u2014 commits to confirming the referral is attended and chasing non-attendance, rather than leaving the family to it. Bonus: asks whether anyone at home uses testosterone gel.", src:"Bradley et al., BMJ 2020;368:l6597 · NICE NG12 (updated April 2026) · MHRA DSU January 2023"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"The sources below underpin this page; local paediatric pathways and shared-care protocols take precedence.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>Bradley SH, Lawrence N, Steele C, Mohamed Z. Precocious puberty. <em>BMJ</em> 2020;368:l6597</b><br><a href="https://www.bmj.com/content/368/bmj.l6597" rel="noopener">bmj.com/content/368/bmj.l6597</a><span class="rd"> \u2014 the definitions (before 8 in girls, before 9 in boys), the red-flag set, early specialist assessment and the higher likelihood of pathology in boys (a clinical review, not a UK referral guideline), the central versus peripheral classification, the specialist work-up, and GnRH-analogue treatment</span></li>'+
         '<li><b>RCPCH UK-WHO growth charts</b><br><a href="https://www.rcpch.ac.uk/topic/growth-charts" rel="noopener">rcpch.ac.uk \u2014 growth charts</a><span class="rd"> \u2014 the charts used for serial plotting (the charts do not establish a centile-crossing diagnostic threshold)</span></li>'+
         '<li><b>NICE NG12 \u2014 Suspected cancer: recognition and referral (updated April 2026)</b>, children and young people<br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> \u2014 consider a very urgent referral (within 48 hours) for suspected brain or CNS cancer in a child or young person with newly abnormal cerebellar or other central neurological function; the children\u2019s recommendations are unchanged by the April 2026 update</span></li>'+
         '<li><b>MHRA Drug Safety Update, January 2023 \u2014 topical testosterone: risk of harm to children following accidental exposure</b><br><a href="https://www.gov.uk/drug-safety-update/topical-testosterone-testogel-risk-of-harm-to-children-following-accidental-exposure" rel="noopener">gov.uk — Topical testosterone (Testogel): risk of harm to children</a><span class="rd"> \u2014 the exposure history and the advice on preventing skin-to-skin transfer</span></li>'+
         '<li><b>Endocrine Society clinical practice guideline on central precocious puberty (international), J Clin Endocrinol Metab 2026</b><span class="rd"> \u2014 ultrasensitive basal LH, selective MRI in older children without neurological findings, watchful waiting for thelarche at 7\u20138 years, and GnRH analogue duration. Contextual specialist guidance only — it is not used to set GP referral thresholds or universal stopping ages</span></li>'+
         '<li><b>HM Government \u2014 Working Together to Safeguard Children (2023)</b><br><a href="https://www.gov.uk/government/publications/working-together-to-safeguard-children--2" rel="noopener">gov.uk \u2014 Working Together</a><span class="rd"> \u2014 following local child-protection procedures when bleeding or injury is unexplained</span></li>'+
         '<li><b>BNF for Children</b><br><a href="https://bnfc.nice.org.uk" rel="noopener">bnfc.nice.org.uk</a><span class="rd"> \u2014 GnRH analogue depot preparations (leuprorelin, triptorelin) as product information only; the specialist letter and the current local shared-care protocol take precedence for dose, interval and administration</span></li>'+
         '<li><b>British Society for Paediatric Endocrinology and Diabetes (BSPED) and the local paediatric endocrine shared-care protocol</b><br><a href="https://www.bsped.org.uk" rel="noopener">bsped.org.uk</a><span class="rd"> — UK paediatric endocrine practice; GnRH analogue administration, monitoring, missed doses and adverse effects follow the current local shared-care agreement</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Precocious puberty \u2014 Bradley et al. (BMJ 2020;368:l6597), RCPCH UK-WHO growth charts, NICE NG12 (updated April 2026), MHRA Drug Safety Update January 2023, the Endocrine Society 2026 guideline (international, specialist context) and the BNF for Children. Suspected cases are assessed and referred or discussed according to the local paediatric pathway, and boys are referred promptly; specialist services confirm the cause and decide on treatment. Adapt to local paediatric pathways."
});
