MG.render({
  icon:"\u{1F9A0}",
  title:"Chlamydia",
  eyebrow:"Protocol · test, treat, trace, retest",
  stemTitle:"Chlamydia — one week of doxycycline, then the real work: partners, the retest and the complication you must not miss",
  stemSub:"The infection itself is easy to cure. What decides the outcome is everything around the prescription: testing the right people with the right sample, treating pregnancy and breastfeeding differently, completing partner management before the patient has sex again, retesting young people within months, and recognising pelvic inflammatory disease, epididymo-orchitis and the chlamydia-exposed newborn early. Based on the BASHH 2026 chlamydia guideline (final, July 2026) and the National Chlamydia Screening Programme. For people aged 16 and over — under-16s are managed using the BASHH children and young people STI guideline and local safeguarding pathways.",
  guideline:"BASHH Chlamydia trachomatis 2026 (final, July 2026) · UKHSA NCSP 2021 · BASHH PID 2019 · BASHH epididymo-orchitis 2020 · BASHH children and young people 2021",
  meta:[
    {t:"BASHH chlamydia 2026"},
    {t:"UKHSA NCSP (2021 policy)"},
    {t:"BASHH PID 2019 · epididymo-orchitis 2020"},
    {t:"UKHSA STI data 2025"},
    {t:"Working Together 2026 · Fraser"}
  ],
  quickSub:"Six cards that carry the whole consultation. Sources, with version and date, are listed under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"Pelvic pain or a painful testis changes the plan today", html:"In a sexually active patient with lower abdominal or pelvic pain, suspect <b>pelvic inflammatory disease</b> when examination finds cervical motion tenderness, uterine tenderness or adnexal tenderness — treat empirically the same day without waiting for NAAT results, and do a pregnancy test where pregnancy is possible. A young man with acute scrotal pain needs <b>torsion excluded first</b>; epididymo-orchitis is a diagnosis of exclusion when the onset is sudden."},
    {tone:"blue", h:"Right sample, both bugs", html:"A <b>vulvovaginal swab</b> (self-taken is fine) in women and a <b>first-void urine</b> in men, with chlamydia and gonorrhoea NAATs requested using the local validated laboratory assay, usually from the same specimen. Add a rectal swab when indicated by symptoms, exposure or local protocol; pharyngeal sampling is primarily for gonorrhoea. Offer a full STI screen, including HIV and syphilis, according to risk, consent and the local sexual-health pathway."},
    {tone:"green", h:"Doxycycline is first-line", html:"<b>Doxycycline 100 mg twice daily for 7 days</b> is the first-line regimen for uncomplicated urogenital, rectal and pharyngeal infection in people who are not pregnant (BASHH 2026). Single-dose azithromycin is no longer the routine regimen for uncomplicated chlamydia. Azithromycin remains an option in pregnancy (preferably 1 g then 500 mg daily for 2 days), breastfeeding and selected doxycycline-intolerant patients per specialist guidance. <b>Do not use doxycycline alone for gonorrhoea, PID or suspected LGV.</b>"},
    {tone:"amber", h:"Pregnancy and breastfeeding are different", html:"<b>Pregnancy:</b> use azithromycin, erythromycin or amoxicillin according to the current BASHH regimen and local sexual-health advice; doxycycline should generally be avoided unless specialist advice confirms a complete course can be finished before 15 weeks' gestation. Every treated pregnancy needs a <b>test of cure no earlier than 3 weeks</b> after finishing treatment. <b>Breastfeeding/chestfeeding:</b> a short course of doxycycline may be considered where alternatives are unsuitable; monitor the infant for diarrhoea, vomiting or oral thrush. Tell the maternity team — the baby is at risk of conjunctivitis and pneumonia."},
    {tone:"amber", h:"No sex until partner management is complete", html:"Abstain from all vaginal, anal and oral sex until the course is finished, symptoms have gone <b>and</b> partner management is complete. An untreated partner is a common cause of reinfection and of a “failed” treatment."},
    {tone:"blue", h:"Retest young people", html:"BASHH 2026 advises retesting under-25s <b>between 2 and 6 months</b> after treatment; the NCSP frames the same offer as a retest <b>around 3 months</b> after treatment. Book it before they leave — a retest at the 3-month mark satisfies both. The retest detects reinfection; it does not confirm cure. Consider retesting at any age with ongoing risk or a new exposure."}
  ],
  pathwaySub:"Five moves from the first question to the retest. Early treatment reduces the risk of complications.",
  pathway:[
    {title:"Ask the question that finds it", html:"Most chlamydia causes no symptoms. Offer a test to women under 25 at contraception and other routine contacts (NCSP), and to anyone with a new partner, a partner with an STI, or symptoms — discharge, dysuria, intermenstrual or post-coital bleeding, pelvic or testicular pain. Ask about pregnancy possibility, the date and type of exposures (vaginal, anal, oral), partners and condom use, and safeguarding, coercion or sexual exploitation."},
    {title:"Exclude the complication first", html:"Pelvic pain with cervical motion, uterine or adnexal tenderness → suspect PID and treat now; pregnancy test to exclude ectopic pregnancy. Acute testicular pain → torsion pathway first. Pregnant → different drugs and a test of cure. Conjunctivitis in a newborn → same day. Under 13 → urgent safeguarding assessment; under 16 → BASHH young people guidance and local safeguarding.", alert:true},
    {title:"Take the right samples", html:"Vulvovaginal swab or first-void urine for chlamydia and gonorrhoea NAATs (local validated assay), plus a rectal swab if indicated; pharyngeal sampling mainly for gonorrhoea. Exposure within 2 weeks: repeat the NAAT 2 weeks after exposure if negative and concern remains. Offer HIV and syphilis testing, with hepatitis testing/vaccination where indicated. Symptomatic men with urethral discharge are better seen in sexual health for microscopy and gonorrhoea culture — doxycycline is not treatment for undifferentiated urethritis."},
    {title:"Treat and stop the chain", html:"Doxycycline 100 mg twice daily for 7 days (not in pregnancy; not alone for gonorrhoea, PID or suspected LGV). Arrange partner notification through the local sexual health service or a trained practice clinician. No vaginal, anal or oral sex until the course is finished, symptoms have resolved and partner management is complete."},
    {title:"Close the loop", html:"Book the retest for under-25s at 2–6 months, practically around 3 months. Arrange the test of cure in pregnancy and when otherwise indicated. Discuss condoms and contraception. Record partner-notification outcome. Refer complex cases to sexual health."}
  ],
  sections:[

    {id:"redflags", nav:"Red flags", title:"Red flags and complications", sub:"Chlamydia is usually silent. The presentations below are where it is not, and each one changes what you do in this consultation.",
     blocks:[
       {b:"warn", html:"Do not wait for a NAAT result to treat suspected PID. A normal-looking cervix and a negative chlamydia or gonorrhoea test do not exclude it, and each episode raises the risk of tubal infertility and ectopic pregnancy."},
       {b:"cards", items:[
         {tone:"red", h:"Pelvic inflammatory disease", html:"In a sexually active patient with lower abdominal or pelvic pain, suspect PID when one or more of cervical motion tenderness, uterine tenderness or adnexal tenderness is present on examination. Deep dyspareunia, abnormal bleeding or discharge may accompany it, but fever or deep dyspareunia alone does not establish PID. Cervicitis (discharge, contact bleeding, mucopus or cervical inflammation) is not PID. Do a pregnancy test where pregnancy is possible, and consider ectopic pregnancy, appendicitis, ovarian torsion or cyst, endometriosis, urinary and gastrointestinal causes; an acute abdomen needs emergency assessment. Treat empirically on clinical suspicion — the BASHH outpatient regimen is <b>ceftriaxone 1 g IM once, plus doxycycline 100 mg twice daily and metronidazole 400 mg twice daily for 14 days</b>. Doxycycline plus metronidazole alone is not an equivalent substitute where gonococcal PID is possible. Review clinically within 72 hours if not improving. Admit or seek same-day specialist advice if systemically unwell, pregnant, unable to tolerate oral treatment, a tubo-ovarian abscess is suspected, or there is diagnostic uncertainty.", src:"BASHH PID guideline 2018 with 2019 update"},
         {tone:"red", h:"Acute scrotal pain", html:"Sudden, severe testicular pain in a young man is <b>torsion until proven otherwise</b> — same-day urology. Gradual unilateral pain and swelling with urethral symptoms suggests sexually acquired epididymo-orchitis: chlamydia and gonorrhoea NAATs on first-void urine (with sexual health microscopy and gonorrhoea culture where possible), then ceftriaxone plus doxycycline as set out in the BASHH regimen, with partner notification.", src:"BASHH epididymo-orchitis guideline 2020"},
         {tone:"red", h:"Sticky eye in a newborn", html:"Conjunctivitis in an infant under 30 days may be chlamydial or gonococcal ophthalmia neonatorum; <b>gonococcal ophthalmia is an ophthalmic emergency</b>. It needs <b>same-day</b> paediatric/ophthalmology assessment. Obtain specimens before treatment where this will not delay urgent treatment. Topical treatment alone is inadequate for neonatal chlamydial infection. The mother and her partner(s) need STI assessment.", src:"College of Optometrists CMG — ophthalmia neonatorum"},
         {tone:"amber", h:"Pregnancy", html:"Untreated maternal infection can pass to the baby at delivery. Treat with azithromycin, erythromycin or amoxicillin per the current BASHH regimen and local sexual-health advice, arrange a <b>test of cure no earlier than 3 weeks</b> after finishing treatment, and share the result with the maternity team.", src:"BASHH chlamydia 2026"},
         {tone:"amber", h:"Rectal symptoms in men who have sex with men", html:"Proctitis — rectal pain, discharge, bleeding or tenesmus — with rectal chlamydia raises the possibility of <b>lymphogranuloma venereum</b>, which needs LGV genotyping and a longer doxycycline course. Refer to sexual health rather than treating as simple chlamydia.", src:"BASHH chlamydia 2026 (LGV managed under separate BASHH guidance)"},
         {tone:"amber", h:"Arthritis after an STI", html:"A new asymmetrical lower-limb arthritis, enthesitis or conjunctivitis a few weeks after a urethral or cervical infection suggests <b>sexually acquired reactive arthritis</b>. Treat the infection, test partners, and refer to rheumatology if the joint does not settle. A hot single joint needs aspiration to exclude septic arthritis.", src:"BASHH chlamydia 2026 — clinical features; rheumatology by local pathway"}
       ]}
     ]},

    {id:"who", nav:"Who to test", title:"Who to test and when", sub:"Opportunistic screening was refocused in 2021. Testing on symptoms or risk is unchanged and applies to everyone.",
     blocks:[
       {b:"p", html:"In June 2021 the National Chlamydia Screening Programme in England changed its aim from controlling transmission to <b>reducing the reproductive harm of untreated infection</b>. Because that harm falls on people with a womb and ovaries, the opportunistic offer outside specialist sexual health services now goes to young women; the NCSP opportunistic screening offer no longer routinely includes asymptomatic men under 25 in primary care and community settings. That describes screening policy, not a prohibition on testing: any man with symptoms, risk, an infected partner, or who requests a test should still be tested."},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Opportunistic screening (NCSP)", html:"Women and other people with a womb and ovaries <b>aged under 25</b>: offer a test at contraception appointments and other routine contacts, <b>annually</b> and <b>after a change of sexual partner</b>. Pair the offer with rapid results, prompt treatment, partner notification and retesting.", src:"UKHSA NCSP — changes to the programme, June 2021"},
         {tone:"blue", h:"Test on symptoms, at any age", html:"Women: altered discharge, dysuria, intermenstrual or post-coital bleeding, pelvic pain, deep dyspareunia. Men: urethral discharge, dysuria, testicular pain. Anyone: rectal pain or discharge after receptive anal sex, or conjunctivitis with genital symptoms.", src:"BASHH chlamydia 2026 — clinical features"},
         {tone:"blue", h:"Test on risk", html:"A new or casual partner, more than one partner, a partner diagnosed with an STI, a request for emergency contraception, termination of pregnancy, or an IUD fitting in someone at risk. Offer a full STI screen, including HIV and syphilis, according to risk, consent and the local sexual-health pathway. If exposure occurred within the preceding 2 weeks, test now if clinically indicated and repeat the chlamydia NAAT 2 weeks after exposure if the initial result is negative and concern remains.", src:"UKHSA NCSP 2021 · BASHH chlamydia 2026"},
         {tone:"green", h:"Why young women", html:"Chlamydia was the most commonly diagnosed STI in England in 2025, with <b>151,163 diagnoses</b> — 45.2% of all new STI diagnoses — and rates remain disproportionately high in people aged 15 to 24.", src:"UKHSA — STIs and chlamydia screening in England: 2025 report (June 2026)"}
       ]},
       {b:"why", label:"Why the screening offer changed", html:"The 2021 review concluded that the population benefit of screening young men had not been shown, while the harm of untreated infection — PID, tubal-factor infertility, ectopic pregnancy — falls almost entirely on women. Concentrating opportunistic screening on young women, and making sure positives are treated fast and retested, was judged the proportionate way to reduce that harm."}
     ]},

    {id:"diagnose", nav:"Samples", title:"Which sample, which test", sub:"A nucleic acid amplification test (NAAT) is the standard. The sample site matters more than the brand of test.",
     blocks:[
       {b:"table", head:["Who","Preferred sample","Add when"], rows:[
         ["Women and people with a vagina","<b>Vulvovaginal swab</b> — clinician- or self-taken; as sensitive as an endocervical swab and more acceptable","Endocervical swab if a speculum examination is being done anyway; rectal swab if indicated by symptoms, exposure or local protocol; pharyngeal swab mainly for gonorrhoea"],
         ["Men and people with a penis","<b>First-void urine</b> (the first part of the stream)","Sexual health assessment for men with urethral discharge — microscopy, gonorrhoea culture before treatment where possible, NAAT, and consideration of <i>Mycoplasma genitalium</i> and other causes if tests are negative or symptoms persist; rectal swab if indicated by symptoms, exposure or local protocol"],
         ["Receptive anal sex","<b>Rectal swab</b> — self-taken is acceptable","In men who have sex with men with proctitis, the lab or clinic will genotype for LGV"],
         ["Oral sex","<b>Pharyngeal swab</b> — primarily for gonorrhoea","Test for pharyngeal chlamydia only where supported by the local laboratory pathway or sexual-health-service protocol; routine asymptomatic pharyngeal chlamydia testing is not generally recommended"],
         ["Everyone tested","Chlamydia and gonorrhoea NAATs using the local validated laboratory assay, usually from the same specimen","Full STI screen including HIV and syphilis according to risk, consent and local pathway; hepatitis B and C testing and vaccination where indicated. Exposure within the past 2 weeks: repeat the chlamydia NAAT 2 weeks after exposure if negative and concern remains"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"A positive gonorrhoea NAAT on the same sample", html:"Doxycycline alone is not adequate treatment for gonorrhoea. Refer to sexual health the same week for culture before treatment and ceftriaxone — see the <a href='gonorrhoea.html'>gonorrhoea protocol</a>.", src:"BASHH gonorrhoea 2025"},
         {tone:"blue", h:"Men with urethritis and a negative NAAT", html:"Non-gonococcal urethritis has other causes, including <i>Mycoplasma genitalium</i> and <i>Trichomonas</i>. Sexual health services manage these under separate guidance. Do not present doxycycline treatment of chlamydia as treatment for undifferentiated urethritis.", src:"BASHH NGU guideline 2026"}
       ]},
       {b:"why", label:"Why not test too soon after treatment", html:"A NAAT detects nucleic acid, not live organisms. Non-viable chlamydial DNA can persist for some weeks after successful treatment, so a test repeated too early may be positive in a cured patient. That is why BASHH sets any test of cure at no earlier than three weeks after completing treatment."}
     ]},

    {id:"treat", nav:"Treatment", title:"Treatment", sub:"One first-line regimen. The alternatives exist for pregnancy and for people who genuinely cannot take a tetracycline.",
     blocks:[
       {b:"ladder", steps:[
         {step:"First line", when:"not pregnant", tone:"green", title:"Doxycycline 100 mg twice daily for 7 days", html:"Covers urogenital, rectal and pharyngeal infection. It is more effective than azithromycin, particularly for rectal infection. Check pregnancy status, tetracycline allergy, significant interacting medicines and swallowing difficulty. Advise taking with a full glass of water, remaining sitting or standing and not taking immediately before lying down; separating from antacids and oral iron, calcium, magnesium or zinc; sun protection for photosensitivity; and possible gastrointestinal effects. Not to be used alone for gonorrhoea, PID or suspected LGV."},
         {step:"Pregnant", when:"doxycycline generally avoided", fromLabel:"pregnant", tone:"amber", title:"Azithromycin, erythromycin or amoxicillin per BASHH", html:"Recommended regimens (BASHH 2026): <b>azithromycin 1 g orally, then 500 mg once daily for 2 further days</b> (2 g over 3 days; the preferred azithromycin regimen, grade 1D) — <b>azithromycin 1 g as a single dose</b> is an alternative (grade 2A); or <b>erythromycin 500 mg four times daily for 7 days</b>; or <b>erythromycin 500 mg twice daily for 14 days</b>; or <b>amoxicillin 500 mg three times daily for 7 days</b> — <b>confirm the regimen with your local sexual health service</b> before prescribing. Doxycycline should generally be avoided unless specialist advice confirms that a complete course can be finished before 15 weeks' gestation — discuss with sexual health, obstetric or medicines-in-pregnancy advice before prescribing it. Arrange a <b>test of cure no earlier than 3 weeks</b> after finishing treatment (later if the local service prefers)."},
         {step:"Breastfeeding or chestfeeding", when:"alternatives first", fromLabel:"breastfeeding", tone:"amber", title:"Current BASHH pregnancy/breastfeeding regimen", html:"Use the current BASHH pregnancy/breastfeeding regimen. A short course of doxycycline may be considered where alternatives are unsuitable or unacceptable; monitor the infant for diarrhoea, vomiting or oral thrush."},
         {step:"Tetracycline allergy or intolerance", when:"not pregnant", fromLabel:"cannot take doxycycline", tone:"cream", title:"Alternative per BASHH 2026 — agreed with sexual health", html:"Use the alternative regimen per BASHH 2026 — <b>confirm the regimen with your local sexual health service</b>, which will also decide whether a test of cure is needed; rectal infection responds less reliably to azithromycin than to doxycycline. Azithromycin cautions: known QT prolongation, significant arrhythmia, substantial electrolyte disturbance, other QT-prolonging medicines and clinically significant hepatic disease."},
         {step:"Always", when:"every case", fromLabel:"alongside any regimen", tone:"cream", title:"Partner notification and abstinence", html:"No vaginal, anal or oral sex until the course is complete, symptoms have resolved and partner management is complete. Start partner notification at the same visit. Discuss condoms and contraception."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"Epidemiological treatment of contacts", html:"Arrange partner notification through the local sexual health service or a trained practice clinician. <b>Symptomatic contacts</b> and <b>asymptomatic contacts presenting within 2 weeks of exposure</b> should usually receive epidemiological treatment after testing. For an asymptomatic contact whose last exposure was at least 2 weeks previously, testing and awaiting the result may be appropriate if reliable follow-up is available and onward transmission is avoided. Contacts using doxyPEP need specific specialist guidance. No sexual contact until management of both partners is complete.", src:"BASHH chlamydia 2026 · BASHH partner notification statement 2012"},
         {tone:"amber", h:"Doxycycline cautions", html:"Generally avoid in pregnancy unless specialist advice confirms a complete course before 15 weeks' gestation, and in children under 12 (tooth discolouration). Check for tetracycline allergy, interacting medicines and swallowing difficulty. Oesophageal irritation if taken lying down or with little water. Absorption is reduced by antacids and oral iron, calcium, magnesium and zinc. Photosensitivity — use sun protection.", src:"MHRA SPC — doxycycline"},
         {tone:"blue", h:"People taking doxycycline PEP", html:"DoxyPEP (200 mg within 72 hours of condomless sex) is used by some GBMSM and trans women to prevent syphilis. A chlamydia diagnosis in someone using it still needs the full 7-day treatment course; testing and partner management in this group need specific specialist guidance, so involve sexual health.", src:"BASHH doxyPEP guideline 2025 · BASHH chlamydia 2026"},
         {tone:"blue", h:"What changed in 2026", html:"Single-dose azithromycin, once the default, is <b>no longer the routine regimen</b> for uncomplicated chlamydia in non-pregnant patients (BASHH 2026). In pregnancy BASHH 2026 prefers azithromycin 1 g then 500 mg daily for 2 days, with single-dose 1 g as an alternative; azithromycin is also an option in breastfeeding and selected doxycycline-intolerant patients per specialist guidance. Doxycycline achieves higher cure rates, particularly for rectal infection.", src:"BASHH chlamydia 2026 (updating BASHH 2015 and the 2018 treatment update)"}
       ]}
     ]},

    {id:"testofcure", nav:"Test of cure", title:"Test of cure versus retest", sub:"Two different tests with two different purposes. Confusing them is the commonest follow-up error.",
     blocks:[
       {b:"table", head:["","Test of cure","Retest"], rows:[
         ["Question it answers","Did the treatment work?","Has the patient been reinfected?"],
         ["Who","Pregnancy (always); persistent symptoms; poor adherence or vomiting of treatment; re-exposure to an untreated partner; a non-standard or less effective regimen; complicated infection; when specialist advice recommends it (for example suspected LGV or selected rectal infections)","Everyone under 25 who tested positive; consider at any age with ongoing risk or a new exposure"],
         ["When","<b>No earlier than 3 weeks</b> after completing treatment, and later if clinically appropriate","BASHH 2026: <b>2 to 6 months</b> after treatment. NCSP: <b>around 3 months</b> after treatment — a practical target"],
         ["Why the timing","Earlier tests can detect dead organism DNA","Long enough for reinfection to show, short enough to limit untreated time"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Retest: the 2026 change", html:"The BASHH 2026 guideline moves the recommended retest window to <b>2–6 months</b> after treatment for people under 25. The retest detects reinfection; it does not confirm cure. A trial found positivity was similar across time points but more people actually returned for a test at 2 months.", src:"BASHH chlamydia 2026"},
         {tone:"blue", h:"Retest: the screening programme", html:"The NCSP includes a routine offer of retesting <b>around three months</b> after treatment in its case management standard. A retest booked at about 3 months meets both recommendations.", src:"UKHSA NCSP 2021"},
         {tone:"amber", h:"Test of cure in pregnancy", html:"Every pregnant patient treated for chlamydia needs a test of cure <b>no earlier than 3 weeks</b> after completing treatment.", src:"BASHH chlamydia 2026"},
         {tone:"green", h:"No routine test of cure otherwise", html:"A non-pregnant adult who completed 7 days of doxycycline, has no symptoms and has had no unprotected sex with an untreated partner does not need a test of cure. Offer the retest instead.", src:"BASHH chlamydia 2026"}
       ]},
       {b:"say", html:"“The tablets will clear this. The main risk now is catching it again from someone who hasn’t been treated, which is common. So I’d like to book you a repeat test in about three months, and it’s really important your partner is treated before you have sex again.”"}
     ]},

    {id:"partners", nav:"Partners", title:"Partner notification and abstinence", sub:"An untreated partner is a common cause of reinfection. This is the part of chlamydia care most often left undone.",
     blocks:[
       {b:"timeline", items:[
         {n:"1", when:"At diagnosis", title:"Discuss partner notification", html:"Everyone diagnosed should have partner notification discussed at the time of diagnosis by a trained professional. Sexual health health advisers can do this for you, including provider notification where the patient prefers not to tell a partner themselves."},
         {n:"2", when:"Look-back period", title:"Decide who to contact", html:"For people with <b>penile urethral symptoms</b>, BASHH 2026 advises notifying all partners since, and in the <b>4 weeks before</b>, symptom onset. For women, asymptomatic men and infection at other sites, the look-back is longer and is set by the health adviser from the sexual history; if no partner falls in the window, the most recent partner is contacted."},
         {n:"3", when:"During treatment", title:"Abstain", html:"No vaginal, anal or oral sex until the full course is finished, symptoms have resolved <b>and</b> management of both partners is complete."},
         {n:"4", when:"Partners", title:"Test and treat contacts", html:"Contacts are offered a full STI screen including HIV. Symptomatic contacts, and asymptomatic contacts presenting within 2 weeks of exposure, should usually receive epidemiological treatment after testing. For an asymptomatic contact whose last exposure was at least 2 weeks previously, testing and awaiting the result may be appropriate if reliable follow-up is available and onward transmission is avoided. Contacts using doxyPEP need specialist guidance."},
         {n:"5", when:"Record", title:"Document the outcome", html:"Note who was contacted and whether they were treated. An untreated partner is a common cause of a positive retest."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"cream", h:"If the patient will not tell their partner", html:"Offer provider (anonymous) notification through sexual health. Explore the reason — fear of violence or coercive control changes the plan and is a safeguarding matter, not a reason to skip notification.", src:"BASHH partner notification statement 2012"},
         {tone:"cream", h:"When to hand over to sexual health", html:"Multiple or untraceable partners, men who have sex with men, rectal symptoms, anyone under 16, and whenever you cannot offer partner notification support in the practice.", src:"BASHH chlamydia 2026 — level 3 services lead partner notification"}
       ]}
     ]},

    {id:"young", nav:"Under-16s", title:"Young people, consent and safeguarding", sub:"Chlamydia is a young person’s infection. Confidential care is what keeps them coming back; safeguarding is what keeps them safe. Both are required.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Under 13", html:"A child under 13 cannot consent to sexual activity in law. An STI in a child under 13 requires <b>urgent safeguarding assessment</b> and discussion with the designated safeguarding lead and children’s social care according to local procedures. Do not assume the STI alone proves the circumstances of acquisition; a full clinical, safeguarding and forensic assessment may be required. Manage using the BASHH children and young people STI guideline.", src:"Working Together to Safeguard Children 2026 (DfE)"},
         {tone:"amber", h:"13 to 15", html:"Young people can receive confidential testing and treatment if they are competent to consent. For contraception and sexual health advice, apply the <b>Fraser criteria</b>: they understand the advice, cannot be persuaded to tell a parent, are likely to continue having sex, their health would suffer without treatment, and it is in their best interests. Document the assessment. Fraser criteria alone do not resolve the safeguarding assessment — also assess competence, coercion, exploitation, age/power imbalance and risk of harm, using local safeguarding guidance and the BASHH children and young people STI guideline (2021); the BASHH adult chlamydia guideline is aimed primarily at people aged 16 and over.", src:"Gillick v West Norfolk and Wisbech AHA (House of Lords 1985) · Working Together 2026"},
         {tone:"amber", h:"Look for exploitation", html:"Ask about the age of partners, power imbalance, gifts or money, drugs or alcohol, going missing, and controlling behaviour. A much older partner, a partner in a position of trust, or signs of child sexual exploitation mean sharing information with safeguarding services, ideally with the young person’s knowledge.", src:"Working Together to Safeguard Children 2026 (DfE)"},
         {tone:"green", h:"Confidentiality is the default", html:"Explain the limits of confidentiality at the start: you will keep it private unless you are worried about serious harm to them or someone else, and you will tell them first if you need to share. That promise is why young people disclose.", src:"Working Together to Safeguard Children 2026 (DfE)"}
       ]},
       {b:"say", html:"“What you tell me stays between us. The only time I’d need to involve anyone else is if I was worried you were at risk of serious harm — and if that happened, I’d talk to you about it first.”"}
     ]},

    {id:"prevention", nav:"Prevention", title:"Prevention and the bigger picture", sub:"Cure is a week of tablets. Prevention is a conversation that has to happen at the same visit.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"Condoms and dual protection", html:"Hormonal contraception and IUDs do not protect against STIs. Offer condoms and discuss using them with new or casual partners, alongside the chosen contraceptive method.", src:"UKHSA NCSP 2021"},
         {tone:"green", h:"Regular testing", html:"Young women under 25: test annually and with each new partner. Anyone with ongoing risk: regular testing in sexual health services or through local online self-sampling kits.", src:"UKHSA NCSP 2021"},
         {tone:"blue", h:"HIV prevention", html:"A bacterial STI is a marker of HIV risk. Offer a full STI screen, including HIV and syphilis, according to risk, consent and the local sexual-health pathway, and signpost PrEP where the history suggests continuing risk.", src:"BASHH chlamydia 2026 — health promotion"},
         {tone:"blue", h:"The national picture", html:"Overall STI diagnoses in England fell by 8.3% between 2024 and 2025, but chlamydia remained the most common bacterial STI. Rates remain highest in young people and GBMSM.", src:"UKHSA — STIs and chlamydia screening in England: 2025 report"}
       ]},
       {b:"why", label:"Why reinfection matters more than resistance here", html:"Unlike gonorrhoea, chlamydia has not developed clinically important resistance to doxycycline. A positive result months after treatment almost always means reinfection from an untreated or new partner. That is why partner notification and the retest carry more weight than the choice of antibiotic."}
     ]},

    {id:"refer", nav:"Refer", title:"Refer", sub:"Most uncomplicated chlamydia can be treated in primary care. These are the situations where it should not be.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same day", html:"Suspected <b>ectopic pregnancy</b> in a patient with pelvic pain; <b>PID</b> with systemic illness, pregnancy, inability to tolerate oral treatment, suspected abscess or diagnostic uncertainty; <b>acute scrotal pain</b> where torsion has not been excluded; <b>conjunctivitis in an infant under 30 days</b>.", src:"BASHH PID 2019 · BASHH epididymo-orchitis 2020 · College of Optometrists CMG"},
         {tone:"red", h:"Safeguarding, same day", html:"Any child under 13 with an STI (urgent safeguarding assessment), or a young person at risk of sexual exploitation or abuse.", src:"Working Together to Safeguard Children 2026 (DfE)"},
         {tone:"amber", h:"Sexual health service, this week", html:"Co-infection with gonorrhoea or a positive gonorrhoea NAAT; symptomatic urethritis; rectal symptoms or suspected LGV; contacts or patients using doxyPEP; complex cases; men who have sex with men; recurrent positives despite treatment; partner notification the practice cannot support; anyone who prefers a specialist service.", src:"BASHH chlamydia 2026 · BASHH gonorrhoea 2025"},
         {tone:"cream", h:"Pregnancy", html:"Inform the maternity team, document treatment and the test-of-cure date, and make sure the result is visible at delivery.", src:"BASHH chlamydia 2026"},
         {tone:"cream", h:"Rheumatology", html:"Reactive arthritis that persists after treatment of the infection.", src:"BASHH chlamydia 2026 — complications"}
       ]},
       {b:"p", html:"Persistent post-coital or intermenstrual bleeding with a negative STI screen is a separate question — examine the cervix and follow the gynaecology pathway."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 19-year-old woman has a positive chlamydia result from an online self-sampling kit. She is on the combined pill, has a boyfriend of eight months and had sex with someone else at a festival six weeks ago. She asks for “the one tablet” a friend was given and does not want her boyfriend to know.", src:"Practice scenario based on BASHH chlamydia 2026"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Asks about <b>pelvic pain, dyspareunia and abnormal bleeding</b> and examines if present; checks for <b>pregnancy</b>; explains that single-dose azithromycin is <b>no longer the routine regimen</b> and prescribes <b>doxycycline 100 mg twice daily for 7 days</b> with its cautions; handles the partner question honestly — both partners are at risk — and offers <b>anonymous provider notification</b>; advises <b>no sex until partner management is complete</b>; offers <b>HIV and syphilis</b> testing; explains the <b>retest at about 3 months</b>; revisits <b>condoms</b> alongside the pill; and asks gently about <b>consent and coercion</b> at the festival.", src:"BASHH chlamydia 2026 · UKHSA NCSP 2021"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Sources with version, date and direct link. Verify each against the current published version before clinical use.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>BASHH — UK national guideline for the management of infection with <i>Chlamydia trachomatis</i> (2026, final, July 2026)</b><br><a href="https://www.bashh.org/_userfiles/pages/files/bashh_chlamydia_guideline_july_2026.pdf" rel="noopener">bashh.org — chlamydia guideline 2026 (PDF)</a><span class="rd"> — doxycycline 100 mg twice daily for 7 days as first-line treatment for uncomplicated infection; single-dose azithromycin no longer routine; pregnancy regimens (azithromycin, erythromycin, amoxicillin; doxycycline only if completed before 15 weeks with specialist advice) and breastfeeding advice; risk-based epidemiological treatment of contacts; test of cure no earlier than 3 weeks after treatment in pregnancy; retest for under-25s 2–6 months after treatment; partner-notification look-back of 4 weeks before symptom onset for penile urethral symptoms; considerations for people on doxyPEP. Updates the 2015 guideline and the 2018 treatment update.</span></li>'+
         '<li><b>BASHH — Update on the treatment of <i>Chlamydia trachomatis</i> infection (2018)</b> and <b>2015 UK national guideline</b><br><a href="https://www.bashh.org/_userfiles/pages/files/resources/updateonthetreatmentofchlamydiatrachomatisinfectionfinal16918.pdf" rel="noopener">bashh.org — 2018 treatment update (PDF)</a> (update dated 26 September 2018)<span class="rd"> — historical; useful context but superseded where the 2026 guidance differs</span></li>'+
         '<li><b>UKHSA — National Chlamydia Screening Programme: changes to the programme (June 2021)</b><br><a href="https://www.gov.uk/government/collections/national-chlamydia-screening-programme-ncsp" rel="noopener">gov.uk — National Chlamydia Screening Programme (NCSP) collection</a><span class="rd"> — opportunistic screening focused on young women under 25; annual and new-partner testing; routine offer of retesting around 3 months after treatment</span></li>'+
         '<li><b>UKHSA — Sexually transmitted infections and screening for chlamydia in England: 2025 report (June 2026)</b><br><a href="https://www.gov.uk/government/statistics/sexually-transmitted-infections-stis-annual-data-tables/sexually-transmitted-infections-and-screening-for-chlamydia-in-england-2025-report" rel="noopener">gov.uk — STI annual data 2025</a><span class="rd"> — 151,163 chlamydia diagnoses (45.2% of new STI diagnoses); overall STI diagnoses down 8.3% from 2024</span></li>'+
         '<li><b>BASHH — UK national guideline for the management of pelvic inflammatory disease (2018, 2019 update)</b><br><a href="https://www.bashh.org/_userfiles/pages/files/resources/pidupdate2019.pdf" rel="noopener">bashh.org — PID 2019 update</a> (2019 interim update, 26 January 2019)<span class="rd"> — minimum clinical criteria; outpatient regimen of ceftriaxone 1 g IM plus doxycycline and metronidazole for 14 days; ceftriaxone should not be omitted; review at 72 hours</span></li>'+
         '<li><b>BASHH — UK national guideline for the management of epididymo-orchitis (2020)</b><br><a href="https://www.bashh.org/_userfiles/pages/files/resources/eo2020.pdf" rel="noopener">bashh.org — epididymo-orchitis 2020</a><span class="rd"> — ceftriaxone plus doxycycline for sexually acquired epididymo-orchitis</span></li>'+
         '<li><b>BASHH — UK national guideline for the management of <i>Neisseria gonorrhoeae</i>, 2025</b> and <b>BASHH NGU guideline, 2026</b><br><a href="https://doi.org/10.1177/09564624251345195" rel="noopener">doi.org/10.1177/09564624251345195</a> (gonorrhoea 2025) · <a href="https://doi.org/10.1177/09564624261430584" rel="noopener">doi.org/10.1177/09564624261430584</a> (NGU 2026)<span class="rd"> — onward management when the dual NAAT finds gonorrhoea or when urethritis is NAAT-negative</span></li>'+
         '<li><b>BASHH — UK national guideline for the use of doxycycline post-exposure prophylaxis (2025)</b><br><a href="https://doi.org/10.1177/09564624251352053" rel="noopener">doi.org/10.1177/09564624251352053</a><span class="rd"> — 200 mg within 72 hours of condomless sex, for syphilis prevention in GBMSM and trans women at elevated risk</span></li>'+
         '<li><b>BASHH — Statement on partner notification for sexually transmissible infections (2012)</b><span class="rd"> — provider and patient referral; trained health advisers</span></li>'+
         '<li><b>College of Optometrists — Clinical Management Guideline: ophthalmia neonatorum</b><br><a href="https://www.college-optometrists.org/clinical-guidance/clinical-management-guidelines/ophthalmianeonatorum" rel="noopener">college-optometrists.org — ophthalmia neonatorum</a><span class="rd"> — chlamydial and gonococcal causes; urgent assessment of ophthalmia neonatorum</span></li>'+
         '<li><b>Department for Education — Working Together to Safeguard Children (2026)</b><br><a href="https://www.gov.uk/government/publications/working-together-to-safeguard-children--2" rel="noopener">gov.uk — Working Together</a><span class="rd"> — statutory safeguarding guidance, replacing the 2023 edition</span></li>'+
         '<li><b>Gillick v West Norfolk and Wisbech AHA (House of Lords, 1985)</b><span class="rd"> — competence to consent and the Fraser criteria</span></li>'+
         '<li><b>BASHH — National guideline on the management of sexually transmitted infections and related conditions in children and young people (2021)</b><br><a href="https://www.bashh.org/_userfiles/pages/files/resources/children_and_yp_2021.pdf" rel="noopener">bashh.org — children and young people 2021 (PDF)</a><span class="rd"> — management of under-16s with safeguarding</span></li>'+
         '<li><b>MHRA SPC — Doxycycline 100 mg capsules (PL 13931/0028)</b> and <b>MHRA SPC — azithromycin</b><br><a href="https://products.mhra.gov.uk/" rel="noopener">products.mhra.gov.uk</a><span class="rd"> — gastrointestinal effects, oesophageal irritation, photosensitivity, polyvalent-cation interactions; azithromycin QT and hepatic cautions</span></li>'+
         '<li><b>Greater Manchester Medicines Management Group — Greater Manchester Antimicrobial Guidelines</b> (October 2024; check the current local version)<br><a href="https://gmmmg.nhs.uk/" rel="noopener">gmmmg.nhs.uk</a><span class="rd"> — local antimicrobial choices</span></li>'+
         '</ul></div>'},
       {b:"why", html:"This is an educational summary; the local sexual health service and safeguarding pathways supersede it. Cite the relevant section for each major recommendation, and obtain practice/PCN/ICB governance approval before standalone clinical use."}
     ]}
  ],
  foot:"Genital chlamydia in primary care, for people aged 16 and over — BASHH Chlamydia trachomatis guideline 2026 (final, July 2026), BASHH children and young people STI guideline 2021, UKHSA National Chlamydia Screening Programme (2021 policy), BASHH PID (2019 update) and epididymo-orchitis (2020) guidelines, and Working Together to Safeguard Children 2026. Check doses against the current MHRA SPC, BNF and local antimicrobial guidance, and use your local sexual health service for partner notification and complex cases."
