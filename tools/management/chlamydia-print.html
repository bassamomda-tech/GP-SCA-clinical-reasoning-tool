MG.render({
  icon:"\u{1F9A0}",
  title:"Chlamydia",
  eyebrow:"Protocol · test, treat, trace, retest",
  stemTitle:"Chlamydia — one week of doxycycline, then the real work: partners, the retest and the complication you must not miss",
  stemSub:"The infection itself is easy to cure. What decides the outcome is everything around the prescription: testing the right people with the right sample, treating pregnancy differently, getting partners treated before the patient has sex again, retesting young people within months, and recognising pelvic inflammatory disease, epididymo-orchitis and the chlamydia-exposed newborn early. Built on the BASHH 2026 chlamydia guideline and the National Chlamydia Screening Programme.",
  guideline:"BASHH Chlamydia trachomatis 2026 · UKHSA NCSP 2021 · BASHH PID 2019 · BASHH epididymo-orchitis 2020",
  meta:[
    {t:"BASHH chlamydia 2026"},
    {t:"UKHSA NCSP (2021 policy)"},
    {t:"BASHH PID 2019 · epididymo-orchitis 2020"},
    {t:"UKHSA STI data 2025"},
    {t:"Working Together 2026 · Fraser"},
    {t:"No NG12 criterion applies", tone:"tw"}
  ],
  quickSub:"Six cards that carry the whole consultation. Every figure traces to a source listed under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"Pelvic pain or a painful testis changes the plan today", html:"Lower abdominal pain, deep dyspareunia or adnexal tenderness in a sexually active woman is <b>pelvic inflammatory disease until shown otherwise</b> — treat the same day without waiting for swab results. A young man with acute scrotal pain needs <b>torsion excluded first</b>; epididymo-orchitis is a diagnosis of exclusion when the onset is sudden."},
    {tone:"blue", h:"Right sample, both bugs", html:"A <b>vulvovaginal swab</b> (self-taken is fine) in women and a <b>first-void urine</b> in men, run as a dual chlamydia–gonorrhoea NAAT. Add rectal and pharyngeal swabs when the sexual history points there. Offer HIV and syphilis serology in the same visit."},
    {tone:"green", h:"Doxycycline is the only first-line drug", html:"<b>Doxycycline 100 mg twice daily for 7 days</b> is now the sole first-line regimen in BASHH 2026 for urogenital, rectal and pharyngeal infection. Single-dose azithromycin is <b>no longer recommended</b> for uncomplicated chlamydia at any site."},
    {tone:"amber", h:"Pregnancy is different", html:"Doxycycline is avoided. Use the pregnancy regimen per BASHH 2026 — <b>confirm the regimen with your local sexual health service</b> — and every treated pregnancy needs a <b>test of cure no earlier than 3 weeks</b> after finishing treatment. Tell the maternity team — the baby is at risk of conjunctivitis and pneumonia."},
    {tone:"amber", h:"No sex until partners are treated", html:"Abstain from all sex, including oral, until the course is finished, symptoms have gone <b>and</b> current partners have been treated. Reinfection from an untreated regular partner is the commonest reason for a “failed” treatment."},
    {tone:"blue", h:"Retest young people", html:"BASHH 2026 advises retesting under-25s <b>between 2 and 6 months</b> after treatment; the NCSP frames the same offer as a retest <b>around 3 months</b> after treatment. Book it before they leave — a retest at the 3-month mark satisfies both."}
  ],
  pathwaySub:"Five moves from the first question to the retest. The red step is where fertility is lost.",
  pathway:[
    {title:"Ask the question that finds it", html:"Most chlamydia causes no symptoms. Offer a test to women under 25 at contraception and other routine contacts (NCSP), and to anyone with a new partner, a partner with an STI, or symptoms — discharge, dysuria, intermenstrual or post-coital bleeding, pelvic or testicular pain."},
    {title:"Exclude the complication first", html:"Pelvic tenderness, fever or deep dyspareunia → treat as PID now. Acute testicular pain → torsion pathway first. Pregnant → different drugs and a test of cure. Under 13 → safeguarding referral.", alert:true},
    {title:"Take the right samples", html:"Vulvovaginal swab or first-void urine for a dual NAAT, plus rectal and pharyngeal swabs by history. Offer HIV and syphilis testing. Symptomatic men with urethral discharge are better seen in sexual health for microscopy."},
    {title:"Treat and stop the chain", html:"Doxycycline 100 mg twice daily for 7 days (not in pregnancy). Refer to sexual health for partner notification, or start it yourself with a clear plan. No sex until the course is finished and partners are treated."},
    {title:"Close the loop", html:"Book the retest for under-25s at 2–6 months. Arrange the test of cure in pregnancy. Revisit contraception and condoms. Record partner-notification outcome."}
  ],
  sections:[

    {id:"redflags", nav:"Red flags", title:"Red flags and complications", sub:"Chlamydia is usually silent. The presentations below are where it is not, and each one changes what you do in this consultation.",
     blocks:[
       {b:"warn", html:"Do not wait for a NAAT result to treat suspected PID. A normal-looking cervix and a negative chlamydia test do not exclude it, and each episode raises the risk of tubal infertility and ectopic pregnancy."},
       {b:"cards", items:[
         {tone:"red", h:"Pelvic inflammatory disease", html:"Lower abdominal pain with cervical motion or adnexal tenderness, often with deep dyspareunia, abnormal bleeding or discharge. Exclude ectopic pregnancy with a pregnancy test. Treat empirically on clinical suspicion — the BASHH outpatient regimen is <b>ceftriaxone 1 g IM once, plus doxycycline 100 mg twice daily and metronidazole 400 mg twice daily for 14 days</b>. Admit if systemically unwell, pregnant, a tubo-ovarian abscess is suspected, or oral treatment fails.", src:"BASHH PID guideline 2018 with 2019 update"},
         {tone:"red", h:"Acute scrotal pain", html:"Sudden, severe testicular pain in a young man is <b>torsion until proven otherwise</b> — same-day urology. Gradual unilateral pain and swelling with urethral symptoms suggests sexually acquired epididymo-orchitis: dual NAAT on first-void urine, then ceftriaxone plus doxycycline as set out in the BASHH regimen, with partner notification.", src:"BASHH epididymo-orchitis guideline 2020"},
         {tone:"red", h:"Sticky eye in a newborn", html:"Conjunctivitis in the first weeks of life can be chlamydial or gonococcal ophthalmia neonatorum. Chlamydia is now the commoner cause. It needs <b>same-day</b> paediatric or ophthalmic assessment for swabs and systemic treatment — and both parents need testing.", src:"College of Optometrists CMG — ophthalmia neonatorum"},
         {tone:"amber", h:"Pregnancy", html:"Untreated maternal infection can pass to the baby at delivery. Treat with a pregnancy-safe regimen, arrange a <b>test of cure no earlier than 3 weeks</b> after finishing treatment, and share the result with the maternity team.", src:"BASHH chlamydia 2026"},
         {tone:"amber", h:"Rectal symptoms in men who have sex with men", html:"Proctitis — rectal pain, discharge, bleeding or tenesmus — with rectal chlamydia raises the possibility of <b>lymphogranuloma venereum</b>, which needs LGV genotyping and a longer doxycycline course. Refer to sexual health rather than treating as simple chlamydia.", src:"BASHH chlamydia 2026 (LGV managed under separate BASHH guidance)"},
         {tone:"amber", h:"Arthritis after an STI", html:"A new asymmetrical lower-limb arthritis, enthesitis or conjunctivitis a few weeks after a urethral or cervical infection suggests <b>sexually acquired reactive arthritis</b>. Treat the infection, test partners, and refer to rheumatology if the joint does not settle. A hot single joint needs aspiration to exclude septic arthritis.", src:"BASHH chlamydia 2026 — clinical features; rheumatology by local pathway"}
       ]}
     ]},

    {id:"who", nav:"Who to test", title:"Who to test and when", sub:"Opportunistic screening was refocused in 2021. Testing on symptoms or risk is unchanged and applies to everyone.",
     blocks:[
       {b:"p", html:"In June 2021 the National Chlamydia Screening Programme in England changed its aim from controlling transmission to <b>reducing the reproductive harm of untreated infection</b>. Because that harm falls on people with a womb and ovaries, the opportunistic offer outside specialist sexual health services now goes to young women; men under 25 are no longer routinely offered asymptomatic screening in primary care and community settings. That is a screening decision, not a testing ban: any man with symptoms, a partner with an STI or a clear risk should still be tested."},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Opportunistic screening (NCSP)", html:"Women and other people with a womb and ovaries <b>aged under 25</b>: offer a test at contraception appointments and other routine contacts, <b>annually</b> and <b>after a change of sexual partner</b>. Pair the offer with rapid results, prompt treatment, partner notification and retesting.", src:"UKHSA NCSP — changes to the programme, June 2021"},
         {tone:"blue", h:"Test on symptoms, at any age", html:"Women: altered discharge, dysuria, intermenstrual or post-coital bleeding, pelvic pain, deep dyspareunia. Men: urethral discharge, dysuria, testicular pain. Anyone: rectal pain or discharge after receptive anal sex, or conjunctivitis with genital symptoms.", src:"BASHH chlamydia 2026 — clinical features"},
         {tone:"blue", h:"Test on risk", html:"A new or casual partner, more than one partner, a partner diagnosed with an STI, a request for emergency contraception, termination of pregnancy, or an IUD fitting in someone at risk. Offer HIV and syphilis testing alongside.", src:"UKHSA NCSP 2021 · BASHH chlamydia 2026"},
         {tone:"green", h:"Why young women", html:"Chlamydia was the most commonly diagnosed STI in England in 2025, with <b>151,163 diagnoses</b> — 45.2% of all new STI diagnoses — and rates remain disproportionately high in people aged 15 to 24.", src:"UKHSA — STIs and chlamydia screening in England: 2025 report (June 2026)"}
       ]},
       {b:"why", label:"Why the screening offer changed", html:"The 2021 review concluded that the population benefit of screening young men had not been shown, while the harm of untreated infection — PID, tubal-factor infertility, ectopic pregnancy — falls almost entirely on women. Concentrating opportunistic screening on young women, and making sure positives are treated fast and retested, was judged the proportionate way to reduce that harm."}
     ]},

    {id:"diagnose", nav:"Samples", title:"Which sample, which test", sub:"A nucleic acid amplification test (NAAT) is the standard. The sample site matters more than the brand of test.",
     blocks:[
       {b:"table", head:["Who","Preferred sample","Add when"], rows:[
         ["Women and people with a vagina","<b>Vulvovaginal swab</b> — clinician- or self-taken; as sensitive as an endocervical swab and more acceptable","Endocervical swab if a speculum examination is being done anyway; rectal and pharyngeal swabs by sexual history"],
         ["Men and people with a penis","<b>First-void urine</b> (the first part of the stream)","Urethral microscopy in sexual health for men with discharge; rectal and pharyngeal swabs by history"],
         ["Receptive anal sex","<b>Rectal swab</b> — self-taken is acceptable","In men who have sex with men with proctitis, the lab or clinic will genotype for LGV"],
         ["Oral sex","<b>Pharyngeal swab</b> (mainly for gonorrhoea, but run on the same dual NAAT)","—"],
         ["Everyone tested","Dual chlamydia–gonorrhoea NAAT","HIV and syphilis serology; hepatitis B and C where risk applies"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"A positive gonorrhoea NAAT on the same sample", html:"Do not treat gonorrhoea with doxycycline. Refer to sexual health the same week for culture before treatment and ceftriaxone — see the <a href='gonorrhoea.html'>gonorrhoea protocol</a>.", src:"BASHH gonorrhoea 2025"},
         {tone:"blue", h:"Men with urethritis and a negative NAAT", html:"Non-gonococcal urethritis has other causes, including <i>Mycoplasma genitalium</i> and <i>Trichomonas</i>. Sexual health services manage these under separate guidance.", src:"BASHH NGU guideline 2026"}
       ]},
       {b:"why", label:"Why not test too soon after treatment", html:"A NAAT detects nucleic acid, not live organisms. Non-viable chlamydial DNA can persist for some weeks after successful treatment, so a test repeated too early may be positive in a cured patient. That is why BASHH sets any test of cure at no earlier than three weeks after completing treatment."}
     ]},

    {id:"treat", nav:"Treatment", title:"Treatment", sub:"One first-line regimen. The alternatives exist for pregnancy and for people who genuinely cannot take a tetracycline.",
     blocks:[
       {b:"ladder", steps:[
         {step:"First line", when:"not pregnant", tone:"green", title:"Doxycycline 100 mg twice daily for 7 days", html:"Covers urogenital, rectal and pharyngeal infection. It is more effective than azithromycin, particularly for rectal infection. Advise swallowing with plenty of water while upright, avoiding antacids, iron or zinc within two hours of a dose, and sun protection for photosensitivity."},
         {step:"Pregnant or breastfeeding", when:"doxycycline avoided", fromLabel:"pregnant or breastfeeding", tone:"amber", title:"Pregnancy regimen per BASHH 2026", html:"Doxycycline is avoided in pregnancy and breastfeeding. Use the pregnancy regimen per BASHH 2026 — <b>confirm the regimen with your local sexual health service</b> before prescribing. Arrange a <b>test of cure no earlier than 3 weeks</b> after finishing treatment in pregnancy."},
         {step:"Tetracycline allergy or intolerance", when:"not pregnant", fromLabel:"cannot take doxycycline", tone:"cream", title:"Alternative per BASHH 2026 — agreed with sexual health", html:"Use the alternative regimen per BASHH 2026 — <b>confirm the regimen with your local sexual health service</b>, which will also decide whether a test of cure is needed; rectal infection responds less reliably to azithromycin than to doxycycline."},
         {step:"Always", when:"every case", fromLabel:"alongside any regimen", tone:"cream", title:"Partner notification and abstinence", html:"No sex, including oral sex, until the course is complete, symptoms have resolved and partners have been treated. Start partner notification at the same visit."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"Epidemiological treatment of contacts", html:"Sexual partners of someone with chlamydia are treated with the same regimen <b>without waiting for their own result</b>, after testing. Sexual health services and some pharmacies offer this directly.", src:"BASHH chlamydia 2026 · BASHH partner notification statement 2012"},
         {tone:"amber", h:"Doxycycline cautions", html:"Avoid in pregnancy and in children under 12 (tooth discolouration). Oesophageal irritation if taken lying down or with little water. Absorption is reduced by antacids and oral iron, calcium, magnesium and zinc. Photosensitivity — use sun protection.", src:"BNF — doxycycline"},
         {tone:"blue", h:"People taking doxycycline PEP", html:"DoxyPEP (200 mg within 72 hours of condomless sex) is used by some GBMSM and trans women to prevent syphilis. A chlamydia diagnosis in someone using it still needs the full 7-day treatment course; BASHH 2026 adds management notes for this group, so involve sexual health.", src:"BASHH doxyPEP guideline 2025 · BASHH chlamydia 2026"},
         {tone:"blue", h:"What changed in 2026", html:"Single-dose azithromycin, once the default, is <b>no longer recommended</b> for uncomplicated chlamydia at any site in any gender. Doxycycline achieves higher cure rates, particularly for rectal infection.", src:"BASHH chlamydia 2026 (updating BASHH 2015 and the 2018 treatment update)"}
       ]}
     ]},

    {id:"testofcure", nav:"Test of cure", title:"Test of cure versus retest", sub:"Two different tests with two different purposes. Confusing them is the commonest follow-up error.",
     blocks:[
       {b:"table", head:["","Test of cure","Retest"], rows:[
         ["Question it answers","Did the treatment work?","Has the patient been reinfected?"],
         ["Who","Pregnancy (always); persistent symptoms; doubtful adherence; a non-standard regimen","Everyone under 25 who tested positive; consider in anyone at ongoing risk"],
         ["When","<b>No earlier than 3 weeks</b> after completing treatment","BASHH 2026: <b>2 to 6 months</b> after treatment. NCSP: <b>around 3 months</b> after treatment"],
         ["Why the timing","Earlier tests can detect dead organism DNA","Long enough for reinfection to show, short enough to limit untreated time"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Retest: the 2026 change", html:"BASHH 2026 moved the recommended retest window to <b>2–6 months</b> after treatment for people under 25. A trial found positivity was similar across time points but more people actually returned for a test at 2 months.", src:"BASHH chlamydia 2026"},
         {tone:"blue", h:"Retest: the screening programme", html:"The NCSP includes a routine offer of retesting <b>around three months</b> after treatment in its case management standard. A retest booked at about 3 months meets both recommendations.", src:"UKHSA NCSP 2021"},
         {tone:"amber", h:"Test of cure in pregnancy", html:"Every pregnant patient treated for chlamydia needs a test of cure <b>no earlier than 3 weeks</b> after completing treatment.", src:"BASHH chlamydia 2026"},
         {tone:"green", h:"No routine test of cure otherwise", html:"A non-pregnant adult who completed 7 days of doxycycline, has no symptoms and has had no unprotected sex with an untreated partner does not need a test of cure. Offer the retest instead.", src:"BASHH chlamydia 2026"}
       ]},
       {b:"say", html:"“The tablets will clear this. The main risk now is catching it again from someone who hasn’t been treated, which is common. So I’d like to book you a repeat test in about three months, and it’s really important your partner is treated before you have sex again.”"}
     ]},

    {id:"partners", nav:"Partners", title:"Partner notification and abstinence", sub:"Treating the index patient without treating partners guarantees reinfection. This is the part of chlamydia care most often left undone.",
     blocks:[
       {b:"timeline", items:[
         {n:"1", when:"At diagnosis", title:"Discuss partner notification", html:"Everyone diagnosed should have partner notification discussed at the time of diagnosis by a trained professional. Sexual health health advisers can do this for you, including provider notification where the patient prefers not to tell a partner themselves."},
         {n:"2", when:"Look-back period", title:"Decide who to contact", html:"For people with <b>penile urethral symptoms</b>, BASHH 2026 advises notifying all partners since, and in the <b>4 weeks before</b>, symptom onset. For women, asymptomatic men and infection at other sites, the look-back is longer and is set by the health adviser from the sexual history; if no partner falls in the window, the most recent partner is contacted."},
         {n:"3", when:"During treatment", title:"Abstain", html:"No sexual contact, including oral sex, until the full course is finished, symptoms have resolved <b>and</b> partners have completed treatment."},
         {n:"4", when:"Partners", title:"Test and treat contacts", html:"Contacts are offered a full STI screen including HIV, and treated with the index regimen at the first visit without waiting for results."},
         {n:"5", when:"Record", title:"Document the outcome", html:"Note who was contacted and whether they were treated. An untreated regular partner is the most important risk for the retest being positive."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"cream", h:"If the patient will not tell their partner", html:"Offer provider (anonymous) notification through sexual health. Explore the reason — fear of violence or coercive control changes the plan and is a safeguarding matter, not a reason to skip notification.", src:"BASHH partner notification statement 2012"},
         {tone:"cream", h:"When to hand over to sexual health", html:"Multiple or untraceable partners, men who have sex with men, rectal symptoms, anyone under 16, and whenever you cannot offer partner notification support in the practice.", src:"BASHH chlamydia 2026 — level 3 services lead partner notification"}
       ]}
     ]},

    {id:"young", nav:"Under-16s", title:"Young people, consent and safeguarding", sub:"Chlamydia is a young person’s infection. Confidential care is what keeps them coming back; safeguarding is what keeps them safe. Both are required.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Under 13", html:"A child under 13 cannot consent to sexual activity in law. An STI in a child of this age requires a <b>safeguarding referral to children’s social care</b> in line with local procedures, and discussion with the named or designated safeguarding lead.", src:"Working Together to Safeguard Children 2026 (DfE)"},
         {tone:"amber", h:"13 to 15", html:"Young people can receive confidential testing and treatment if they are competent to consent. For contraception and sexual health advice, apply the <b>Fraser criteria</b>: they understand the advice, cannot be persuaded to tell a parent, are likely to continue having sex, their health would suffer without treatment, and it is in their best interests. Document the assessment.", src:"Gillick v West Norfolk and Wisbech AHA (House of Lords 1985) · Working Together 2026"},
         {tone:"amber", h:"Look for exploitation", html:"Ask about the age of partners, power imbalance, gifts or money, drugs or alcohol, going missing, and controlling behaviour. A much older partner, a partner in a position of trust, or signs of child sexual exploitation mean sharing information with safeguarding services, ideally with the young person’s knowledge.", src:"Working Together to Safeguard Children 2026 (DfE)"},
         {tone:"green", h:"Confidentiality is the default", html:"Explain the limits of confidentiality at the start: you will keep it private unless you are worried about serious harm to them or someone else, and you will tell them first if you need to share. That promise is why young people disclose.", src:"Working Together to Safeguard Children 2026 (DfE)"}
       ]},
       {b:"say", html:"“What you tell me stays between us. The only time I’d need to involve anyone else is if I was worried you were at risk of serious harm — and if that happened, I’d talk to you about it first.”"}
     ]},

    {id:"prevention", nav:"Prevention", title:"Prevention and the bigger picture", sub:"Cure is a week of tablets. Prevention is a conversation that has to happen at the same visit.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"Condoms and dual protection", html:"Hormonal contraception and IUDs do not protect against STIs. Offer condoms and discuss using them with new or casual partners, alongside the chosen contraceptive method.", src:"UKHSA NCSP 2021"},
         {tone:"green", h:"Regular testing", html:"Young women under 25: test annually and with each new partner. Anyone with ongoing risk: regular testing in sexual health services or through local online self-sampling kits.", src:"UKHSA NCSP 2021"},
         {tone:"blue", h:"HIV prevention", html:"A bacterial STI is a marker of HIV risk. Offer an HIV test every time, and signpost PrEP where the history suggests continuing risk.", src:"BASHH chlamydia 2026 — health promotion"},
         {tone:"blue", h:"The national picture", html:"Overall STI diagnoses in England fell by 8.3% between 2024 and 2025, but chlamydia remained the most common bacterial STI. Rates remain highest in young people and GBMSM.", src:"UKHSA — STIs and chlamydia screening in England: 2025 report"}
       ]},
       {b:"why", label:"Why reinfection matters more than resistance here", html:"Unlike gonorrhoea, chlamydia has not developed clinically important resistance to doxycycline. A positive result months after treatment almost always means reinfection from an untreated or new partner. That is why partner notification and the retest carry more weight than the choice of antibiotic."}
     ]},

    {id:"refer", nav:"Refer", title:"Refer", sub:"Most uncomplicated chlamydia can be treated in primary care. These are the situations where it should not be.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same day", html:"Suspected <b>ectopic pregnancy</b> in a patient with pelvic pain; <b>PID</b> with systemic illness, pregnancy or suspected abscess; <b>acute scrotal pain</b> where torsion has not been excluded; <b>conjunctivitis in a newborn</b>.", src:"BASHH PID 2019 · BASHH epididymo-orchitis 2020 · College of Optometrists CMG"},
         {tone:"red", h:"Safeguarding, same day", html:"Any child under 13 with an STI, or a young person at risk of sexual exploitation or abuse.", src:"Working Together to Safeguard Children 2026 (DfE)"},
         {tone:"amber", h:"Sexual health service, this week", html:"Co-infection with gonorrhoea; rectal symptoms or suspected LGV; men who have sex with men; recurrent positives despite treatment; partner notification the practice cannot support; anyone who prefers a specialist service.", src:"BASHH chlamydia 2026 · BASHH gonorrhoea 2025"},
         {tone:"cream", h:"Pregnancy", html:"Inform the maternity team, document treatment and the test-of-cure date, and make sure the result is visible at delivery.", src:"BASHH chlamydia 2026"},
         {tone:"cream", h:"Rheumatology", html:"Reactive arthritis that persists after treatment of the infection.", src:"BASHH chlamydia 2026 — complications"}
       ]},
       {b:"p", html:"No NG12 suspected-cancer criterion maps to this presentation. Persistent post-coital or intermenstrual bleeding with a negative STI screen is a separate question — examine the cervix and follow the gynaecology pathway."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 19-year-old woman has a positive chlamydia result from an online self-sampling kit. She is on the combined pill, has a boyfriend of eight months and had sex with someone else at a festival six weeks ago. She asks for “the one tablet” a friend was given and does not want her boyfriend to know.", src:"Practice scenario based on BASHH chlamydia 2026"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Asks about <b>pelvic pain, dyspareunia and abnormal bleeding</b> and examines if present; checks for <b>pregnancy</b>; explains that single-dose azithromycin is <b>no longer recommended</b> and prescribes <b>doxycycline 100 mg twice daily for 7 days</b> with its cautions; handles the partner question honestly — both partners are at risk — and offers <b>anonymous provider notification</b>; advises <b>no sex until both are treated</b>; offers <b>HIV and syphilis</b> testing; explains the <b>retest at about 3 months</b>; revisits <b>condoms</b> alongside the pill; and asks gently about <b>consent and coercion</b> at the festival.", src:"BASHH chlamydia 2026 · UKHSA NCSP 2021"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Every recommendation on this page traces to one of these primary sources.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>BASHH — UK national guideline for the management of infection with <i>Chlamydia trachomatis</i>, 2026</b> (Saunders et al., International Journal of STD and AIDS, 2026)<br><a href="https://doi.org/10.1177/09564624261475950" rel="noopener">doi.org/10.1177/09564624261475950</a><span class="rd"> — doxycycline 100 mg twice daily for 7 days as sole first-line treatment; single-dose azithromycin no longer recommended; pregnancy and breastfeeding regimens; test of cure no earlier than 3 weeks after treatment in pregnancy; retest for under-25s 2–6 months after treatment; partner-notification look-back of 4 weeks before symptom onset for penile urethral symptoms; considerations for people on doxyPEP. Updates the 2015 guideline and the 2018 treatment update.</span></li>'+
         '<li><b>BASHH — Update on the treatment of <i>Chlamydia trachomatis</i> infection (2018)</b> and <b>2015 UK national guideline</b><br><a href="https://www.bashh.org/resources/174/chlamydia_guidelines_2026" rel="noopener">bashh.org — chlamydia guidelines</a><span class="rd"> — historical; superseded by the 2026 guideline and cited only to explain what changed</span></li>'+
         '<li><b>UKHSA — National Chlamydia Screening Programme: changes to the programme (June 2021)</b><br><a href="https://assets.publishing.service.gov.uk/media/60c09c84e90e07439ba7500f/NCSP_Information_on_the_changes_June_2021.pdf" rel="noopener">gov.uk \u2014 NCSP: information on the changes (June 2021)</a><span class="rd"> — opportunistic screening focused on young women under 25; annual and new-partner testing; routine offer of retesting around 3 months after treatment</span></li>'+
         '<li><b>UKHSA — Sexually transmitted infections and screening for chlamydia in England: 2025 report (June 2026)</b><br><a href="https://www.gov.uk/government/statistics/sexually-transmitted-infections-stis-annual-data-tables/sexually-transmitted-infections-and-screening-for-chlamydia-in-england-2025-report" rel="noopener">gov.uk — STI annual data 2025</a><span class="rd"> — 151,163 chlamydia diagnoses (45.2% of new STI diagnoses); overall STI diagnoses down 8.3% from 2024</span></li>'+
         '<li><b>BASHH — UK national guideline for the management of pelvic inflammatory disease (2018, 2019 update)</b><br><a href="https://www.bashh.org/_userfiles/pages/files/resources/pidupdate2019.pdf" rel="noopener">bashh.org — PID 2019 update</a><span class="rd"> — outpatient regimen of ceftriaxone 1 g IM plus doxycycline and metronidazole for 14 days; ceftriaxone should not be omitted</span></li>'+
         '<li><b>BASHH — UK national guideline for the management of epididymo-orchitis (2020)</b><br><a href="https://www.bashh.org/_userfiles/pages/files/resources/eo2020.pdf" rel="noopener">bashh.org — epididymo-orchitis 2020</a><span class="rd"> — ceftriaxone plus doxycycline for sexually acquired epididymo-orchitis</span></li>'+
         '<li><b>BASHH — UK national guideline for the management of <i>Neisseria gonorrhoeae</i>, 2025</b> and <b>BASHH NGU guideline, 2026</b><span class="rd"> — onward management when the dual NAAT finds gonorrhoea or when urethritis is NAAT-negative</span></li>'+
         '<li><b>BASHH — UK national guideline for the use of doxycycline post-exposure prophylaxis (2025)</b><br><a href="https://doi.org/10.1177/09564624251352053" rel="noopener">doi.org/10.1177/09564624251352053</a><span class="rd"> — 200 mg within 72 hours of condomless sex, for syphilis prevention in GBMSM and trans women at elevated risk</span></li>'+
         '<li><b>BASHH — Statement on partner notification for sexually transmissible infections (2012)</b><span class="rd"> — provider and patient referral; trained health advisers</span></li>'+
         '<li><b>College of Optometrists — Clinical Management Guideline: ophthalmia neonatorum</b><br><a href="https://www.college-optometrists.org/clinical-guidance/clinical-management-guidelines/ophthalmianeonatorum" rel="noopener">college-optometrists.org — ophthalmia neonatorum</a><span class="rd"> — chlamydia is now the commoner cause; urgent assessment</span></li>'+
         '<li><b>Department for Education — Working Together to Safeguard Children (2026)</b><br><a href="https://www.gov.uk/government/publications/working-together-to-safeguard-children--2" rel="noopener">gov.uk — Working Together</a><span class="rd"> — statutory safeguarding guidance, replacing the 2023 edition</span></li>'+
         '<li><b>Gillick v West Norfolk and Wisbech AHA (House of Lords, 1985)</b><span class="rd"> — competence to consent and the Fraser criteria</span></li>'+
         '<li><b>BNF — doxycycline, azithromycin, erythromycin</b><br><a href="https://bnf.nice.org.uk/drugs/doxycycline/" rel="noopener">bnf.nice.org.uk — doxycycline</a><span class="rd"> — cautions, interactions and pregnancy advice</span></li>'+
         '</ul></div>'}

  foot:"Genital chlamydia in primary care — BASHH Chlamydia trachomatis guideline 2026, UKHSA National Chlamydia Screening Programme (2021 policy), BASHH PID (2019 update) and epididymo-orchitis (2020) guidelines, and Working Together to Safeguard Children 2026. Check doses against the current BNF and use your local sexual health service for partner notification and complex cases."
