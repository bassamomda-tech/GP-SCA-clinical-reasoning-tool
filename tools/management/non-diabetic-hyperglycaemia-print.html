<script>
MG.render({
  icon:"💉",
  title:"Non-diabetic hyperglycaemia (prediabetes)",
  eyebrow:"Protocol · endocrine · register, refer, review every year",
  stemTitle:"Non-diabetic hyperglycaemia: tell the person they are at high risk, refer them to the Diabetes Prevention Programme, and check HbA1c every year",
  stemSub:"One page for the HbA1c of 42–47 mmol/mol. NICE PH38 (2012, updated 2017) calls this high risk of type 2 diabetes. The risk can be reduced: the Healthier You NHS Diabetes Prevention Programme offers 9 months of structured lifestyle support, and people who complete it lose weight and are less likely to develop diabetes. The GP's tasks are to confirm the result is reliable, explain it without alarm, refer, address cardiovascular risk, and recall annually. Women with previous gestational diabetes are a related high-risk group.",
  guideline:"NICE PH38 (2012, updated 2017) · NICE NG28 (2015, updated February 2026) · NICE NG3 (2015, updated 2020) · NICE NG238 (2023) · NHS England Healthier You NHS DPP · QOF 2026/27 (NDH)",
  reviewed:"15 October 2026",
  nextReview:"April 2027",
  meta:[
    {t:"NICE PH38 · 2012, updated 2017"},
    {t:"HbA1c 42–47 mmol/mol"},
    {t:"Healthier You NHS DPP"},
    {t:"QOF NDH register and annual test"},
    {t:"Reviewed October 2026 · next review April 2027"}
  ],
  lead:"<div class='mg-layers'><a href='#diagnose'><b>Confirm</b><small>42–47 mmol/mol, reliable?</small></a><a href='#manage'><b>Refer</b><small>NHS DPP and lifestyle</small></a><a href='#monitor'><b>Annual review</b><small>HbA1c, weight, CVD risk</small></a><a href='#special'><b>After GDM</b><small>annual HbA1c</small></a></div>",
  quickSub:"Six points that change what you do today. Each one is traced to a named source under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"blue", h:"The numbers", html:"<b>HbA1c 42–47 mmol/mol</b> (6.0–6.4%) or <b>fasting plasma glucose 5.5–6.9 mmol/L</b> = high risk of type 2 diabetes (NICE PH38). HbA1c <b>48 mmol/mol or more</b> is in the diabetes range: repeat to confirm unless there are symptoms (NICE NG28). Code non-diabetic hyperglycaemia so the person joins the register and recall."},
    {tone:"amber", h:"Is the HbA1c reliable?", html:"HbA1c is unreliable in <b>pregnancy</b>, children, haemoglobinopathies, anaemia (including iron deficiency), recent blood loss or transfusion, advanced CKD, HIV treatment, and rapidly rising glucose (for example on steroids, or with symptoms of type 1 diabetes). Use fasting glucose, or an oral glucose tolerance test, where needed."},
    {tone:"cream", h:"Refer to the NHS Diabetes Prevention Programme", html:"<b>Offer</b> referral to the <b>Healthier You NHS Diabetes Prevention Programme</b> (face-to-face groups or digital) for adults with a qualifying HbA1c or fasting glucose result, usually within the last 12 months; local criteria vary. Exclusions include pregnancy and existing diabetes. Explain that high risk does not mean they will definitely develop diabetes, and that the risk can be reduced."},
    {tone:"cream", h:"Lifestyle: weight, activity, diet", html:"Aim for gradual weight loss towards a healthy BMI (losing 5–10% of body weight is valuable), at least <b>150 minutes</b> of moderate activity a week, less sitting, more fibre and wholegrains, fewer sugary drinks and less saturated fat, and alcohol within limits. Offer smoking cessation."},
    {tone:"amber", h:"Metformin: clinical judgement only", html:"NICE PH38 says use clinical judgement on whether to offer <b>standard-release metformin</b> to adults at high risk whose HbA1c or fasting glucose is <b>still rising</b> despite taking part in an intensive lifestyle programme, or who cannot take part, particularly with a BMI over 35. It is off-label for this use. Stop it if there is no effect after 6–12 months."},
    {tone:"green", h:"Every year: HbA1c, weight and cardiovascular risk", html:"Offer a blood test (preferably the same test) and a weight or BMI check <b>at least once a year</b>. Assess cardiovascular risk with QRISK3, check blood pressure and lipids, and treat according to NICE NG238. In QOF 2026/27, the annual HbA1c or fasting glucose indicator includes people with <b>previous gestational diabetes</b>."}
  ],
  pathwaySub:"Five moves.",
  pathway:[
    {title:"Confirm and exclude diabetes", alert:true, html:"HbA1c 42–47 or fasting glucose 5.5–6.9. HbA1c 48 or more, or symptoms → diabetes pathway. Check that HbA1c is reliable for this person."},
    {title:"Explain and code", html:"High risk, not diabetes; reversible. Code non-diabetic hyperglycaemia for the register and annual recall."},
    {title:"Refer and advise", html:"Healthier You NHS DPP, plus personalised lifestyle advice and support for weight, activity, diet, alcohol and smoking."},
    {title:"Treat cardiovascular risk", html:"QRISK3, blood pressure, lipids; statin according to NICE NG238. Consider metformin only if glucose keeps rising despite lifestyle."},
    {title:"Recall every year", html:"Annual HbA1c (or fasting glucose) and weight or BMI. Repeat sooner if symptoms develop."}
  ],
  sections:[
    {id:"redflags", nav:"Red flags", title:"Red flags: when this is not prediabetes", sub:"High glucose with symptoms needs a different pathway.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Possible type 1 diabetes or DKA", html:"Thirst, polyuria, weight loss and tiredness, especially in a younger or slim person, ketones, vomiting, abdominal pain or rapid breathing → <b>same-day</b> diabetes or medical assessment; <b>999</b> if drowsy or very unwell. Do not wait for HbA1c, which lags behind rapidly rising glucose. Children with suspected diabetes → same-day paediatrics.", src:"NICE NG17 (2015, updated 2022) · NICE NG18"},
         {tone:"amber", h:"🟠 Symptoms with a borderline HbA1c", html:"Osmotic symptoms with an HbA1c in the 42–47 range → check fasting or random glucose; a random glucose of 11.1 mmol/L or more with symptoms confirms diabetes.", src:"WHO (2011) · NICE NG28"},
         {tone:"amber", h:"🟠 Pregnancy", html:"HbA1c is not used to diagnose diabetes in pregnancy. Women with known non-diabetic hyperglycaemia who become pregnant need early glucose testing according to local antenatal pathways.", src:"NICE NG3 (2015, updated 2020)"},
         {tone:"amber", h:"🟠 Unexplained weight loss", html:"New hyperglycaemia with weight loss in someone aged 60 or over → consider pancreatic cancer and arrange CT according to NICE NG12.", src:"NICE NG12 (2015, updated 2026)"}
       ]}
     ]},

    {id:"diagnose", nav:"Confirm", title:"Confirming non-diabetic hyperglycaemia", sub:"Who to test, what the numbers mean, and when HbA1c misleads.",
     blocks:[
       {b:"table", head:["Test","Normal","Non-diabetic hyperglycaemia","Diabetes"], rows:[
         ["<b>HbA1c</b>","Under 42 mmol/mol","42–47 mmol/mol (6.0–6.4%)","48 mmol/mol or more (repeat to confirm if no symptoms)"],
         ["<b>Fasting plasma glucose</b>","Under 5.5 mmol/L","5.5–6.9 mmol/L","7.0 mmol/L or more"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"👥 Who to test", html:"NICE PH38 recommends a two-stage approach: a validated risk score (for example the Diabetes UK Know Your Risk tool), then a blood test for those at high risk. Groups include adults aged 40 and over, people of South Asian, Chinese, Black African or African-Caribbean family origin from age 25, and people with obesity, a history of gestational diabetes, cardiovascular disease, hypertension, PCOS or severe mental illness, or on antipsychotics. The NHS Health Check (ages 40–74) also identifies people.", src:"NICE PH38 (2012, updated 2017)"},
         {tone:"amber", h:"⚠️ When HbA1c is unreliable", html:"Pregnancy; children; haemoglobinopathies; anaemia, haemolysis, recent transfusion or blood loss; CKD stages 4–5; HIV treatment; recent illness or steroids; suspected type 1 diabetes. Use fasting glucose or an oral glucose tolerance test.", src:"WHO (2011) · NICE PH38"},
         {tone:"cream", h:"🧾 Coding", html:"Code non-diabetic hyperglycaemia (or pre-diabetes) so the person is on the practice register, can be recalled and can be referred. Avoid labelling as 'borderline diabetes'.", src:"QOF 2026/27 · NICE PH38"},
         {tone:"cream", h:"🗣️ Explaining it", html:"'Your blood sugar is higher than normal, but not in the diabetes range. It means you are at higher risk of getting type 2 diabetes in the future, but this can be prevented or delayed with changes we can help you make.'", src:"NICE PH38 (2012, updated 2017)"}
       ]}
     ]},

    {id:"manage", nav:"Manage", title:"Management: refer, advise, and treat risk", sub:"Lifestyle change is the treatment. The NHS Diabetes Prevention Programme delivers it.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1", tone:"cream", title:"Refer to Healthier You NHS DPP", when:"HbA1c 42–47 or FPG 5.5–6.9", fromLabel:"offer",
          html:"Offer referral to the programme: about 9 months of group, face-to-face or digital sessions on weight, diet and activity. Eligibility: aged 18 or over, not pregnant, no diabetes, with a qualifying blood result (usually within the last 12 months; some areas accept up to 24 months). Women with previous gestational diabetes may be eligible even with a normal result; check local criteria. When capacity is limited, PH38 (2017) prioritises HbA1c 44–47 or FPG 6.5–6.9."},
         {step:"2", tone:"cream", title:"Personalised lifestyle advice", when:"everyone", fromLabel:"alongside",
          html:"Weight loss towards a healthy BMI; at least 150 minutes a week of moderate activity; reduce sitting; more fibre, wholegrains, vegetables and fruit; less saturated fat and fewer sugary drinks; alcohol within 14 units a week; stop smoking. Consider weight management services or medicines for obesity according to NICE obesity guidance."},
         {step:"3", tone:"amber", title:"Consider metformin", when:"glucose still rising despite lifestyle, or cannot take part", fromLabel:"clinical judgement",
          html:"Use clinical judgement (NICE PH38). Off-label. Start low and increase gradually. <span class=mg-dose>Usual adult dose: standard-release metformin 500 mg once daily with food, increased gradually to 1,500–2,000 mg a day in divided doses (NICE/SPC; check the SPC, BNF and local formulary; <a href=https://www.medicines.org.uk/emc/search?q=metformin target=_blank rel=noopener>SPC: metformin</a>).</span> Check eGFR before starting and at least yearly. Stop if no benefit after 6–12 months."},
         {step:"4", tone:"green", title:"Cardiovascular risk", when:"everyone", fromLabel:"",
          html:"QRISK3, blood pressure and lipids; offer a statin and manage blood pressure according to NICE NG238 and NG136."}
       ]},
       {b:"say", html:"Your test shows your blood sugar is in the range we call prediabetes. It isn't diabetes, and many people bring it back to normal. There's a free NHS programme that helps with eating, activity and weight, and people who complete it are less likely to develop diabetes. We'll check your blood test every year."}
     ]},

    {id:"special", nav:"Special groups", title:"Special groups", sub:"Where the default plan changes.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"🤰 Previous gestational diabetes", html:"After gestational diabetes, offer a fasting glucose at 6–13 weeks after birth (or HbA1c from 13 weeks), then an <b>annual HbA1c</b> if the result is normal. An HbA1c of 39–47 mmol/mol after GDM means high risk of type 2 diabetes: advise on lifestyle and refer to the NHS DPP. Plan early glucose testing in future pregnancies.", src:"NICE NG3 (2015, updated 2020) · QOF 2026/27"},
         {tone:"amber", h:"🧠 Severe mental illness and antipsychotics", html:"Higher risk of hyperglycaemia; include glucose in the annual physical health check and discuss with the mental health team if glucose rises on antipsychotics.", src:"NICE CG178 (2014)"},
         {tone:"blue", h:"🌍 South Asian, Chinese, Black African and African-Caribbean people", html:"Higher risk at lower BMI: use a BMI of 23 as the threshold for overweight and 27.5 for obesity when advising on weight.", src:"NICE PH38 · NICE NG246 (2025)"},
         {tone:"blue", h:"👵 Older and frail people", html:"Balance benefit against burden; the NHS DPP may be less suitable over 80. Avoid harm from over-strict glucose targets.", src:"NHS England Healthier You NHS DPP"},
         {tone:"blue", h:"🧒 Children and young people", html:"HbA1c is not used to diagnose diabetes in children. A raised glucose in a child → same-day paediatric assessment for possible type 1 diabetes.", src:"NICE NG18 (2015, updated 2023)"}
       ]}
     ]},

    {id:"monitor", nav:"Monitor", title:"Monitoring and follow-up", sub:"Annual review keeps people on the path and finds diabetes early.",
     blocks:[
       {b:"kv", rows:[
         ["Every year","HbA1c (or fasting glucose, the same test as before where possible) and weight or BMI (NICE PH38). Discuss progress and motivation."],
         ["QOF 2026/27","NDH register; annual HbA1c or fasting glucose for people with non-diabetic hyperglycaemia or previous gestational diabetes (NDH003, which replaced NDH002). Check the current business rules."],
         ["If HbA1c reaches 48 or more","Repeat to confirm unless symptomatic, then manage as type 2 diabetes (NICE NG28)."],
         ["If HbA1c returns below 42","Continue lifestyle advice; keep on annual recall, as risk remains."],
         ["Cardiovascular risk","QRISK3 at least every 5 years, or when risk factors change; blood pressure at least every 5 years, more often if near thresholds."]
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral", sub:"Who, where and how fast.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same day", html:"Possible type 1 diabetes or DKA (symptoms, ketones, children).", src:"NICE NG17 · NICE NG18"},
         {tone:"amber", h:"Healthier You NHS DPP", html:"All eligible adults with non-diabetic hyperglycaemia, and women with previous gestational diabetes where local criteria allow.", src:"NICE PH38 · NHS England"},
         {tone:"amber", h:"Weight management services", html:"BMI and comorbidity meeting local tier 3 criteria, according to NICE obesity guidance.", src:"NICE NG246 (2025)"}
       ]}
     ]},

    {id:"patient", nav:"Safety-net", title:"Patient information and safety-netting", sub:"Make it hopeful and practical.",
     blocks:[
       {b:"say", html:"If you get very thirsty, are passing a lot of urine, are losing weight without trying or feel very tired, contact us the same day for a blood test. Otherwise we'll check your blood sugar and weight every year, and the prevention programme team will contact you."},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"📄 Information", html:"NHS website: non-diabetic hyperglycaemia and the Healthier You programme; Diabetes UK: prediabetes and Know Your Risk.", src:"NHS website · Diabetes UK"},
         {tone:"green", h:"✅ Before they leave", html:"Result explained; referral made or declined (and recorded); lifestyle goals agreed; annual recall set; CVD risk addressed.", src:"NICE PH38 (2012, updated 2017)"}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Scenario", html:"A 52-year-old man of Pakistani family origin, BMI 27, has an HbA1c of 45 mmol/mol at his NHS Health Check. He asks whether he should start 'diabetes tablets'.", src:"NICE PH38 (2012, updated 2017)"},
       {tone:"cream", h:"What a good consultation does", html:"Explains <b>non-diabetic hyperglycaemia</b> as high risk, not diabetes. Checks HbA1c reliability. Offers <b>NHS DPP referral</b> and personalised lifestyle goals using the lower BMI threshold for his ethnicity. Explains that metformin is a clinical-judgement option only if glucose keeps rising despite lifestyle. Addresses QRISK3 and sets <b>annual HbA1c</b> recall.", src:"NICE PH38 · NICE NG238"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Every recommendation on this page traces to a named primary source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE PH38 — Type 2 diabetes: prevention in people at high risk (July 2012, updated September 2017)</b><br><a href="https://www.nice.org.uk/guidance/ph38" rel="noopener">nice.org.uk/guidance/ph38</a><span class="rd"> — HbA1c 42–47 or FPG 5.5–6.9 as high risk; two-stage risk identification; intensive lifestyle programmes (2017 prioritisation of HbA1c 44–47 or FPG 6.5–6.9 when capacity limited); metformin by clinical judgement; annual blood test and weight</span></li>'+
         '<li><b>NICE QS209 — Preventing type 2 diabetes quality standard</b><br><a href="https://www.nice.org.uk/guidance/qs209" rel="noopener">nice.org.uk/guidance/qs209</a><span class="rd"> — adults at high risk offered referral to the NHS DPP</span></li>'+
         '<li><b>NHS England — Healthier You: NHS Diabetes Prevention Programme</b><br><a href="https://www.england.nhs.uk/diabetes/diabetes-prevention/" rel="noopener">england.nhs.uk — diabetes prevention</a><span class="rd"> — eligibility, referral, programme content</span></li>'+
         '<li><b>NHS England — Quality and Outcomes Framework 2026/27 (business rules v51): NDH indicators</b><br><a href="https://digital.nhs.uk/data-and-information/data-collections-and-data-sets/data-collections/quality-and-outcomes-framework-qof" rel="noopener">digital.nhs.uk — QOF</a><span class="rd"> — NDH003 annual HbA1c or FPG for NDH or previous gestational diabetes, replacing NDH002</span></li>'+
         '<li><b>NICE NG28 — Type 2 diabetes in adults (2015, updated February 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng28" rel="noopener">nice.org.uk/guidance/ng28</a><span class="rd"> — diagnosis and management</span></li>'+
         '<li><b>NICE NG3 — Diabetes in pregnancy (2015, updated 2020)</b><br><a href="https://www.nice.org.uk/guidance/ng3" rel="noopener">nice.org.uk/guidance/ng3</a><span class="rd"> — postnatal testing and annual HbA1c after gestational diabetes; HbA1c 39–47 as high risk</span></li>'+
         '<li><b>NICE NG238 — Cardiovascular disease: risk assessment and reduction (2023)</b><br><a href="https://www.nice.org.uk/guidance/ng238" rel="noopener">nice.org.uk/guidance/ng238</a><span class="rd"> — QRISK3 and statins</span></li>'+
         '<li><b>WHO — Use of glycated haemoglobin (HbA1c) in the diagnosis of diabetes mellitus (2011)</b><br><a href="https://www.who.int/publications/i/item/use-of-glycated-haemoglobin-(-hba1c)-in-diagnosis-of-diabetes-mellitus" rel="noopener">who.int — HbA1c in diagnosis</a><span class="rd"> — when HbA1c is unreliable</span></li>'+
         '<li><b>NICE NG17, NG18 (type 1 diabetes), NG12 (suspected cancer), NG246 (overweight and obesity management, 2025), CG178 (psychosis)</b><br><a href="https://www.nice.org.uk/guidance" rel="noopener">nice.org.uk/guidance</a><span class="rd"> — related pathways</span></li>'+
         '<li><b>Metformin SPC</b><br><a href="https://www.medicines.org.uk/emc/search?q=metformin" rel="noopener">medicines.org.uk — metformin</a><span class="rd"> — dose and renal monitoring</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Non-diabetic hyperglycaemia in primary care — NICE PH38 (2012, updated 2017), NICE NG28, NICE NG3, NICE NG238, NHS England Healthier You NHS DPP and QOF 2026/27. Metformin is off-label for prevention. Check doses in the current SPC, BNF and local formulary. Not a substitute for clinical judgement."
});
