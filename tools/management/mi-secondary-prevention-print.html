  foot:"MI secondary prevention — NICE NG185, NG238 and NICE. Five classes, all of them unless contraindicated, and titrated rather than merely prescribed: dual antiplatelet therapy, atorvastatin 80 mg, an ACE inhibitor, a beta-blocker, and an MRA where EF is 40% or less with heart failure or diabetes. Check U&Es and potassium 1–2 weeks after any ACE inhibitor or MRA change. Never stop DAPT early without cardiology advice — stent thrombosis is the risk. Refer everyone to cardiac rehabilitation and check they attended. Group 1 drivers stop for 1 week after PCI or 4 weeks otherwise; Group 2 must notify the DVLA. Verify all doses against the BNF before prescribing."
