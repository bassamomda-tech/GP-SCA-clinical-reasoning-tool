<script>
MG.render({ snapshot:"summaries/venous-leg-ulcer.html",
  icon:"🦵",
  title:"Venous leg ulcer",
  eyebrow:"Protocol · assess and manage in one place",
  stemTitle:"Rule out the red flags, start mild compression now, measure the ABPI within 14 days, then compress properly and refer for the veins",
  stemSub:"One page for venous leg ulcers in primary care, following the National Wound Care Strategy Programme (NWCSP) lower limb recommendations. Exclude limb-threatening ischaemia, spreading infection, DVT and skin cancer first. Give immediate and necessary care with mild compression at the first visit. Complete a full assessment, including ABPI, within 14 days. Use strong compression when the arterial supply is adequate, and refer for venous duplex and intervention (NICE CG168, supported by the EVRA trial). Give antibiotics only for clinical infection (NICE NG152). Keep the leg in hosiery for life once healed.",
  guideline:"NWCSP Lower Limb Recommendations (2020, reviewed 2024) · NICE CG168 Varicose veins (2013) · NICE NG152 Leg ulcer infection (2020) · NICE NG12 (updated April 2026) · SIGN 120 (2010) · EVRA trial (2018)",
  reviewed:"15 October 2026",
  nextReview:"15 April 2027",
  meta:[
    {t:"NWCSP lower limb recommendations · 14-day assessment"},
    {t:"NICE CG168 · refer for venous intervention"},
    {t:"NICE NG152 · antibiotics only if infected"},
    {t:"Suspected cancer · NG12 for a malignant-looking ulcer", tone:"tw"},
    {t:"v1.0 · reviewed Oct 2026", tone:"ok"}
  ],
  lead:"<div class='mg-layers'><a href='#redflags'><b>Red flags</b><small>ischaemia, infection, DVT, cancer</small></a><a href='#assess'><b>Assess</b><small>ABPI within 14 days</small></a><a href='#compression'><b>Compress</b><small>mild now, strong when safe</small></a><a href='#refer'><b>Refer</b><small>vascular for the veins</small></a></div>",
  quickSub:"Six cards for the consultation. Each one traces to a named source under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"Red flags first: ischaemia, infection, DVT, cancer", html:"Before any compression, look for <b>acute or chronic limb-threatening ischaemia</b> (rest pain, a cold, pale or pulseless foot, gangrene), <b>spreading infection or sepsis</b>, <b>suspected DVT</b> and <b>suspected skin cancer</b>. Acute limb ischaemia and sepsis go to hospital the <b>same day</b> (999 if the limb is acutely threatened or there is any sepsis high-risk criterion); chronic limb-threatening ischaemia needs an <b>urgent vascular referral</b>; a malignant-looking ulcer needs a <b>suspected cancer pathway referral</b>. Do not apply compression to a leg with any of these."},
    {tone:"cream", h:"Immediate and necessary care at the first visit", html:"If there are no red flags, at the first visit: clean the wound and the leg, apply a simple non-adherent dressing, moisturise the skin, and apply <b>mild compression (up to 20 mmHg)</b>, for example a compression wrap or a light compression bandage or hosiery kit. Give advice on walking, ankle exercises and elevating the leg. This starts treatment while the full assessment is arranged."},
    {tone:"amber", h:"Full assessment, with ABPI, within 14 days", html:"Every leg ulcer needs a <b>full assessment within 14 days</b> of first presentation: history, examination of both legs, wound assessment, and an <b>ankle–brachial pressure index (ABPI)</b> by handheld Doppler (toe pressures where ABPI is unreliable, for example in diabetes or calcified arteries). The aim is a diagnosis, not just a dressing plan. Most leg ulcers are venous, but a significant minority are arterial or mixed."},
    {tone:"cream", h:"ABPI 0.8 to 1.3: strong compression", html:"If the ABPI is between <b>0.8 and 1.3</b> and the ulcer is venous, offer <b>strong compression (40 mmHg or more at the ankle)</b> with multicomponent bandages or a two-layer hosiery kit, applied by trained staff. An ABPI below 0.8 or above 1.3 needs specialist (vascular) advice before anything stronger than mild compression; below 0.5, do not compress and refer urgently."},
    {tone:"blue", h:"Refer every venous ulcer for the veins", html:"NICE CG168 recommends referring people with an active or healed venous leg ulcer to a <b>vascular service</b>. The EVRA trial showed that <b>early endovenous ablation</b> of superficial venous reflux, alongside compression, heals ulcers faster and reduces recurrence. Refer early rather than after months of failed dressings."},
    {tone:"green", h:"Antibiotics only for infection; hosiery for life", html:"Most ulcers are colonised with bacteria; do not swab or treat without <b>signs of infection</b> (spreading redness or swelling, warmth, increasing pain, fever). If infected, <b>flucloxacillin</b> is first choice (NICE NG152). Once healed, recurrence is common: <b>lifelong compression hosiery</b>, skin care and venous intervention reduce it."}
  ],
  pathwaySub:"Five moves. Step one is where limbs and lives are lost.",
  pathway:[
    {title:"Screen for red flags", html:"Limb ischaemia, spreading infection or sepsis, DVT, suspected skin cancer, and a foot wound in someone with diabetes (which follows the diabetic foot pathway, NICE NG19). Act on any of these before compression.", alert:true},
    {title:"Immediate and necessary care", html:"Clean, dress with a simple non-adherent dressing, moisturise, apply mild compression (up to 20 mmHg) if no red flags, and give advice on mobility and elevation. Refer to the community nursing or leg ulcer service."},
    {title:"Full assessment within 14 days", html:"History, both legs, pulses, wound measurement and photograph, ABPI or toe pressures, and blood tests as indicated (FBC, glucose or HbA1c, renal function, albumin). Decide the cause: venous, arterial, mixed or atypical."},
    {title:"Treat the cause", html:"Strong compression for a venous ulcer with an adequate arterial supply; vascular referral for venous intervention; treat infection only if present; manage eczema, pain, oedema and nutrition."},
    {title:"Review and prevent recurrence", html:"Measure progress every 4 weeks. Refer if the ulcer is not healing by 12 weeks, or earlier if it is deteriorating or atypical. After healing, fit compression hosiery and plan reassessment."}
  ],
  sections:[
    {id:"redflags", nav:"Red flags", title:"Red flags: before any compression", sub:"These features change the plan from compression to referral. The NWCSP lists them as reasons not to apply compression until specialist assessment.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Acute limb ischaemia: 999 or same day", html:"Sudden pain, pallor, pulselessness, coldness, paraesthesia or paralysis of the limb. This is a vascular emergency: arrange immediate admission to the vascular team (call 999 if needed). No compression.", src:"NWCSP Lower Limb Recommendations · NICE CG147 (2012, updated 2020)"},
         {tone:"red", h:"🔴 Chronic limb-threatening ischaemia: urgent vascular referral", html:"Rest pain in the foot (often at night, eased by hanging the leg down), tissue loss or gangrene, absent foot pulses, or an ABPI below 0.5. Refer urgently to vascular surgery. Do not apply compression.", src:"NWCSP Lower Limb Recommendations · NICE CG147 (2012, updated 2020)"},
         {tone:"red", h:"🔴 Spreading infection or sepsis", html:"Spreading cellulitis, rapidly increasing pain, crepitus, systemic illness or sepsis features: same-day hospital assessment; any NICE NG253 sepsis high-risk criterion (respiratory rate 25 or more, heart rate above 130, systolic blood pressure 90 or less, or new confusion or altered mental state) means a 999 transfer with a pre-alert to hospital. Less severe infection is treated in the community (see Infection).", src:"NICE NG152 (2020) · NICE NG253 (2025)"},
         {tone:"red", h:"🔴 Suspected DVT", html:"Unilateral calf swelling, tenderness or pitting oedema: assess with the two-level Wells score and arrange a proximal leg vein ultrasound within 4 hours, or interim anticoagulation, under NICE NG158.", src:"NICE NG158 (2020, updated 2023)"},
         {tone:"purple", h:"🟣 Suspected skin cancer: suspected cancer pathway referral", html:"An ulcer with a <b>rolled or raised edge, overgranulation, unusual pigmentation, bleeding</b> or one that fails to heal despite good care may be a squamous cell carcinoma (including a Marjolin's ulcer in long-standing ulceration), basal cell carcinoma or melanoma. Refer using a <b>suspected cancer pathway referral</b> for suspected SCC or melanoma (NICE NG12); a biopsy is often done by the specialist.", src:"NICE NG12 (updated April 2026) · SIGN 120 (2010)"},
         {tone:"amber", h:"🟠 Atypical ulcers: urgent dermatology or specialist", html:"Rapidly enlarging, very painful ulcers with a violaceous undermined edge (pyoderma gangrenosum), ulcers with purpura or livedo (vasculitis), ulcers on the foot or upper leg, or in someone with rheumatoid arthritis, inflammatory bowel disease or sickle cell disease. These need specialist assessment, and compression may harm.", src:"SIGN 120 (2010) · NWCSP Lower Limb Recommendations"}
       ]},
       {b:"warn", html:"<b>Diabetes and the foot.</b> A wound on the foot in someone with diabetes is a diabetic foot problem, not a leg ulcer. Refer within 1 working day to the multidisciplinary foot care service (NICE NG19), and same day if there is limb-threatening ischaemia or a severe infection."}
     ]},

    {id:"assess", nav:"Assess", title:"Assessment and diagnosis", sub:"The full assessment is due within 14 days of first presentation. Its job is to name the cause.",
     blocks:[
       {b:"table", head:["Feature","Venous ulcer","Arterial ulcer"], rows:[
         ["<b>Site</b>","Gaiter area, often above the medial malleolus","Foot, toes, heel, or over bony prominences"],
         ["<b>Appearance</b>","Shallow, irregular edges, granulating or sloughy base, exudate","Punched out, deep, pale base, little granulation"],
         ["<b>Surrounding skin</b>","Oedema, haemosiderin staining, venous eczema, lipodermatosclerosis, atrophie blanche, varicose veins","Shiny, hairless, cool skin; pallor on elevation; slow capillary refill"],
         ["<b>Pain</b>","Aching, eased by elevation","Severe, worse on elevation and at night (rest pain)"],
         ["<b>History</b>","Varicose veins, previous DVT, leg injury, obesity, reduced mobility","Smoking, diabetes, cardiovascular disease, claudication"]
       ]},
       {b:"table", head:["ABPI","What it suggests","Compression"], rows:[
         ["<b>0.8 to 1.3</b>","No significant arterial disease","Strong compression (40 mmHg or more) for a venous ulcer"],
         ["<b>0.5 to less than 0.8</b>","Arterial disease (mixed ulcer if venous features too)","Specialist advice: reduced compression only under specialist or vascular direction; refer to vascular"],
         ["<b>Below 0.5</b>","Severe arterial disease","No compression; urgent vascular referral"],
         ["<b>Above 1.3</b>","Calcified, incompressible arteries (diabetes, CKD, older age)","Unreliable: use toe pressures or specialist assessment before strong compression"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"🧪 Tests", html:"Use tests to find contributing causes, guided by the history: FBC (anaemia), HbA1c or glucose, renal function, albumin and nutrition, and lipids for cardiovascular risk. Do not routinely swab an ulcer without signs of infection. Patch testing may be arranged by dermatology if contact dermatitis to dressings or creams is suspected.", src:"SIGN 120 (2010) · NICE NG152 (2020)"},
         {tone:"blue", h:"📏 Record a baseline", html:"Measure the ulcer (length and width, or tracing) and photograph it with consent. Reassess at least every 4 weeks; an ulcer reducing in size by less than about 40% after 4 weeks of good compression is unlikely to heal quickly and should prompt review of the diagnosis and referral.", src:"NWCSP Lower Limb Recommendations · SIGN 120 (2010)"}
       ]}
     ]},

    {id:"compression", nav:"Compression", title:"Compression: the treatment that heals venous ulcers", sub:"Compression is the main treatment. Dressings support it; they do not replace it.",
     blocks:[
       {b:"ladder", steps:[
         {step:"First visit", tone:"cream", title:"Mild compression (up to 20 mmHg)", when:"no red flags, before ABPI", fromLabel:"immediate and necessary care",
          html:"A compression wrap, a light bandage or a hosiery kit, with skin care and a simple dressing. Stop and seek advice if the foot becomes painful, numb, discoloured or cold."},
         {step:"By 14 days", tone:"cream", title:"Full assessment with ABPI", when:"all patients", fromLabel:"within 14 days",
          html:"Decide the cause and whether the arterial supply allows strong compression."},
         {step:"Venous, ABPI 0.8–1.3", tone:"green", title:"Strong compression (40 mmHg or more)", when:"diagnosis made", fromLabel:"treat the cause",
          html:"Multicomponent (two-layer or four-layer, or short-stretch) bandages, adjustable compression wraps, or a leg ulcer hosiery kit. Choice depends on exudate, leg shape, the patient's ability to manage the garment, and the local formulary. Bandages are applied by trained staff."},
         {step:"Healed", tone:"blue", title:"Compression hosiery for life", when:"ulcer closed", fromLabel:"prevent recurrence",
          html:"The strongest class the patient can tolerate and put on (often British Standard class 2 or 3), measured and refitted, with aids for applying them. Replace garments every 3 to 6 months."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"🟠 When compression is not safe", html:"Severe arterial disease (ABPI below 0.5), acute ischaemia, uncontrolled heart failure, severe peripheral neuropathy, or a suspected DVT that has not been assessed. Mixed disease needs reduced compression only under specialist or vascular direction.", src:"NWCSP Lower Limb Recommendations"},
         {tone:"cream", h:"🧴 Skin and wound care", html:"Wash the leg, use an emollient on the surrounding skin, and use a simple non-adherent, low-allergy dressing. For venous eczema, a short course of a moderately potent topical corticosteroid on the surrounding skin (not the ulcer bed). Avoid topical antibiotics and products with common sensitisers such as lanolin.", src:"SIGN 120 (2010) · NICE NG152 (2020)"},
         {tone:"green", h:"🚶 What the patient does", html:"Walk regularly, do ankle and calf exercises, elevate the legs above heart level when resting, avoid standing still for long periods, lose weight if needed, stop smoking, and eat well. Pain usually eases as compression takes effect.", src:"NWCSP Lower Limb Recommendations"},
         {tone:"blue", h:"💊 Pain", html:"Regular paracetamol, adding other analgesia as needed; review pain at each visit. Rising pain may mean infection, ischaemia or a garment that is too tight. Pentoxifylline is an off-label option that some specialists use to aid healing alongside compression.", src:"SIGN 120 (2010)"}
       ]},
       {b:"say", html:"The ulcer is there because the veins in your leg are not pumping blood back up properly, so pressure builds up in the skin. The bandages or stockings push back against that pressure, and that is what heals it. They can feel tight at first, but if your toes go numb, cold, white or blue, or the pain gets much worse, take them off and contact us the same day."}
     ]},

    {id:"infection", nav:"Infection", title:"Infection: antibiotics only when infected", sub:"NICE NG152: most leg ulcers are colonised and do not need antibiotics. Treat clinical infection, not a swab result.",
     blocks:[
       {b:"kv", rows:[
         ["Signs of infection","Redness or swelling spreading beyond the ulcer, localised warmth, increased pain, or fever. Other possible signs: increased exudate, new slough, odour, bleeding, delayed healing."],
         ["Before prescribing","Consider other causes of the symptoms. Take a sample (swab after cleaning, or tissue) for culture <b>only</b> if there are signs of infection. Do not swab a non-infected ulcer."],
         ["Severe infection","Same-day hospital assessment for sepsis, rapidly spreading infection, or if oral antibiotics cannot be taken."],
         ["Review","Reassess if symptoms worsen at any time or have not improved in 2 to 3 days; review the culture result and change to a narrower antibiotic if appropriate."]
       ]},
       {b:"table", head:["Situation","Antibiotic (adults)","Duration"], rows:[
         ["<b>First choice</b>","<span class=mg-dose>Usual adult dose: flucloxacillin 500 mg to 1 g four times daily (NICE NG152/SPC; check the SPC, BNF and local formulary; <a href='https://www.medicines.org.uk/emc/search?q=flucloxacillin' target=_blank rel=noopener>SPC: flucloxacillin</a>).</span>","7 days"],
         ["<b>Penicillin allergy</b>","<span class=mg-dose>Usual adult dose: doxycycline 200 mg on the first day, then 100 mg once daily (can be increased to 200 mg daily), or clarithromycin 500 mg twice daily (NICE NG152/SPC; check the SPC, BNF and local formulary; <a href='https://www.medicines.org.uk/emc/search?q=doxycycline' target=_blank rel=noopener>SPC: doxycycline</a>; <a href='https://www.medicines.org.uk/emc/search?q=clarithromycin' target=_blank rel=noopener>SPC: clarithromycin</a>).</span> In pregnancy: erythromycin 500 mg four times daily.","7 days"],
         ["<b>Second choice or worsening</b>","Guided by culture and local advice; NICE NG152 lists co-amoxiclav, or co-trimoxazole in penicillin allergy (off-label), with microbiology advice.","7 days"]
       ]},
       {b:"info", html:"Children's doses: use the BNFC. Leg ulcers are rare in children and need specialist assessment."}
     ]},

    {id:"special", nav:"Special groups", title:"Special groups", sub:"Where the default plan changes.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"💉 Diabetes", html:"ABPI can be falsely high because of calcified arteries; use toe pressures or specialist assessment. Foot wounds follow the diabetic foot pathway (NICE NG19). Neuropathy increases the risk of compression damage.", src:"NICE NG19 (2015, updated 2019) · NWCSP Lower Limb Recommendations"},
         {tone:"amber", h:"👵 Frailty and limited mobility", html:"Reduced calf-muscle pump function slows healing. Choose garments the patient or carer can manage, consider adjustable wraps, and involve community nursing. Oedema from heart failure, low albumin or dependency (chair-bound legs) needs its cause addressed.", src:"NWCSP Lower Limb Recommendations"},
         {tone:"blue", h:"🦵 Rheumatoid arthritis, vasculitis and sickle cell disease", html:"Ulcers may not be venous. Seek specialist advice early, and treat the underlying condition.", src:"SIGN 120 (2010)"},
         {tone:"cream", h:"🍽️ Nutrition", html:"Screen for malnutrition (for example with MUST) and treat; low albumin and weight loss slow healing.", src:"SIGN 120 (2010)"}
       ]}
     ]},

    {id:"monitor", nav:"Monitoring", title:"Monitoring, follow-up and preventing recurrence", sub:"Most venous ulcers heal within 12 weeks with good compression. The ones that do not need a fresh look.",
     blocks:[
       {b:"table", head:["When","What","Action"], rows:[
         ["Every visit","Pain, exudate, skin, signs of infection, garment fit","Change the plan if pain rises or the foot is affected"],
         ["Every 4 weeks","Ulcer size and photograph","Less than about 40% smaller: review the diagnosis and refer"],
         ["12 weeks","Healed?","Not healed: specialist review (vascular, tissue viability or dermatology); consider biopsy"],
         ["Healed, then regularly","Hosiery fit, skin, new ulcers; repeat ABPI if symptoms change","Lifelong hosiery; venous intervention if not done"]
       ]},
       {b:"why", html:"Venous ulcers recur in a large proportion of people within a year of healing. The two things that reduce recurrence are wearing compression hosiery and correcting superficial venous reflux. A healed ulcer is the start of prevention, not the end of care."}
     ]},

    {id:"refer", nav:"Refer", title:"Refer: who, where and how fast", sub:"Leg ulcer care is usually shared with community nursing or a specialist leg ulcer service.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999 or same day", html:"Acute limb ischaemia; sepsis or rapidly spreading infection; a diabetic foot with limb-threatening ischaemia or severe infection.", src:"NICE CG147 (2012, updated 2020) · NICE NG19 (2015, updated 2019)"},
         {tone:"red", h:"Urgent: vascular surgery", html:"Chronic limb-threatening ischaemia, rest pain, gangrene, or an ABPI below 0.5.", src:"NWCSP Lower Limb Recommendations"},
         {tone:"purple", h:"Suspected cancer pathway referral", html:"An ulcer suspicious for squamous cell carcinoma or melanoma (NICE NG12): rolled edge, overgranulation, unusual pigmentation, bleeding, or failure to heal despite good care.", src:"NICE NG12 (updated April 2026)"},
         {tone:"amber", h:"Vascular service: venous intervention", html:"All people with an active or healed venous leg ulcer, for duplex scanning and consideration of endovenous ablation (NICE CG168). Early referral is supported by the EVRA trial. Also refer ABPI 0.5 to less than 0.8 or above 1.3 for assessment before strong compression.", src:"NICE CG168 (2013) · Gohel et al., NEJM 2018 (EVRA)"},
         {tone:"amber", h:"Dermatology or tissue viability", html:"Atypical ulcers (pyoderma gangrenosum, vasculitis), suspected contact dermatitis needing patch testing, or an ulcer not healed by 12 weeks.", src:"SIGN 120 (2010)"},
         {tone:"green", h:"Stays in primary care", html:"Assessment and compression through community nursing or a leg ulcer clinic, pain and skin care, antibiotics for infection, and lifelong hosiery after healing.", src:"NWCSP Lower Limb Recommendations"}
       ]},
       {b:"say", html:"Keep the bandages on and walk as much as you can. If your toes go numb, cold, pale or blue, or the pain suddenly gets much worse, take the bandage off and contact us the same day. If the redness spreads up the leg, you get a fever or feel unwell, contact us or NHS 111 the same day. If your leg suddenly becomes cold, pale and very painful, call 999."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card. The Casebook holds the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 76-year-old woman with type 2 diabetes and varicose veins has had a weeping ulcer above her left ankle for 10 weeks. She has been buying dressings from the pharmacy and asks for antibiotics because 'the nurse said it grew bacteria'.", src:"NICE NG152 (2020)"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Excludes <b>red flags</b> (ischaemia, spreading infection, DVT, malignant features). Explains why a <b>positive swab without signs of infection</b> does not need antibiotics. Arranges a <b>full assessment with ABPI</b> (and toe pressures given diabetes). Explains <b>compression</b> as the treatment. Refers to the <b>vascular service</b> for venous intervention, and for <b>specialist review</b> because the ulcer is approaching 12 weeks. Safety-nets.", src:"NWCSP Lower Limb Recommendations · NICE CG168 (2013)"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Every recommendation on this page traces to a named primary source.",
     blocks:[
       {b:"html", html:"<div class='card'><h3>Evidence panel</h3><ul class='evlist'>"+
         "<li><b>National Wound Care Strategy Programme — Lower Limb Recommendations for Clinical Care (2020; reviewed 2024)</b><br><a href='https://www.nationalwoundcarestrategy.net/lower-limb/' rel='noopener'>nationalwoundcarestrategy.net — lower limb</a><span class='rd'> — red flags, immediate and necessary care with mild compression, full assessment and ABPI within 14 days, strong compression for venous ulcers</span></li>"+
         "<li><b>NICE CG168 — Varicose veins: diagnosis and management (2013)</b><br><a href='https://www.nice.org.uk/guidance/cg168' rel='noopener'>nice.org.uk/guidance/cg168</a><span class='rd'> — refer people with an active or healed venous leg ulcer to a vascular service</span></li>"+
         "<li><b>Gohel MS et al. A randomized trial of early endovenous ablation in venous ulceration (EVRA). N Engl J Med 2018;378:2105–14</b><br><a href='https://www.nejm.org/doi/full/10.1056/NEJMoa1801214' rel='noopener'>nejm.org — EVRA</a><span class='rd'> — early ablation plus compression heals ulcers faster; later follow-up showed fewer recurrences</span></li>"+
         "<li><b>NICE NG152 — Leg ulcer infection: antimicrobial prescribing (2020)</b><br><a href='https://www.nice.org.uk/guidance/ng152' rel='noopener'>nice.org.uk/guidance/ng152</a><span class='rd'> — signs of infection, when to sample, flucloxacillin first choice, penicillin allergy options, 7-day course, review</span></li>"+
         "<li><b>SIGN 120 — Management of chronic venous leg ulcers (2010)</b><br><a href='https://www.sign.ac.uk/' rel='noopener'>sign.ac.uk</a><span class='rd'> — assessment, atypical ulcers, skin care, pentoxifylline, recurrence</span></li>"+
         "<li><b>NICE NG12 — Suspected cancer: recognition and referral (updated April 2026)</b><br><a href='https://www.nice.org.uk/guidance/ng12' rel='noopener'>nice.org.uk/guidance/ng12</a><span class='rd'> — suspected squamous cell carcinoma and melanoma</span></li>"+
         "<li><b>NICE CG147 — Peripheral arterial disease (2012, updated 2020)</b>, <b>NICE NG158 — Venous thromboembolic diseases (2020, updated 2023)</b>, <b>NICE NG19 — Diabetic foot problems (2015, updated 2019)</b>, <b>NICE NG253 — Suspected sepsis in people aged 16 or over (2025)</b><br><a href='https://www.nice.org.uk/guidance/cg147' rel='noopener'>nice.org.uk/guidance/cg147</a> · <a href='https://www.nice.org.uk/guidance/ng158' rel='noopener'>ng158</a> · <a href='https://www.nice.org.uk/guidance/ng19' rel='noopener'>ng19</a> · <a href='https://www.nice.org.uk/guidance/ng253' rel='noopener'>ng253</a><span class='rd'> — red-flag pathways</span></li>"+
         "<li><b>SPCs — flucloxacillin, doxycycline, clarithromycin</b><br><a href='https://www.medicines.org.uk/emc' rel='noopener'>medicines.org.uk/emc</a><span class='rd'> — doses, interactions</span></li>"+
         "</ul></div>"}
     ]}
  ],
  foot:"Venous leg ulcers in primary care — NWCSP Lower Limb Recommendations (2020, reviewed 2024), NICE CG168, NICE NG152, SIGN 120, NICE NG12 and the EVRA trial. Compression is applied by trained staff after assessment; follow your local leg ulcer pathway and formulary. Not a substitute for clinical judgement."
});
