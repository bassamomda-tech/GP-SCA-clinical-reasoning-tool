  stemSub:"One page for confirmed proximal DVT in non-pregnant adults (NICE NG158 does not cover pregnancy; isolated distal DVT and under-18s follow local pathways). A DOAC first-line, dosed using Cockcroft–Gault creatinine clearance, with the specific situations that need a different anticoagulant or specialist input. Then the duration decision at 3 months, the occult-cancer thought in unprovoked disease, what to do about compression stockings and mobilisation, and the two safety-nets every patient must leave with — sudden breathlessness meaning PE, and the bleeding rules.",
  guideline:"NICE NG158 (2020, updated August 2023) · NICE NG12 (updated April 2026) · MHRA Drug Safety Update (June 2019): DOACs in APS · GMMMG DOAC guidelines (February 2026) · RCOG Green-top 37b (pregnancy)",

  lead:'<div class="mg-layers"><a href="#safety"><b>Red flags</b><small>PE · bleeding</small></a><a href="#classify"><b>Classify</b><small>Provoked or not</small></a><a href="#anticoag"><b>Anticoagulate</b><small>DOAC first-line</small></a><a href="#duration"><b>How long?</b><small>The 3-month call</small></a><a href="#monitor"><b>Monitor</b><small>CrCl · bleeding</small></a></div>',
  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Sudden breathlessness is PE until proven otherwise", html:"Sudden breathlessness, pleuritic chest pain, haemoptysis or collapse in a patient with DVT → 999. Say this out loud before they leave, because the patient with a painful leg is not expecting the dangerous symptom to be in the chest. See <a href='pulmonary-embolism.html'>pulmonary embolism</a>."},
    {tone:"blue", h:"A DOAC first-line, dosed by creatinine clearance", html:"<b>Apixaban or rivaroxaban for most adults with confirmed proximal DVT.</b> Where neither is suitable: LMWH for at least 5 days followed by dabigatran or edoxaban, or LMWH with warfarin until the INR is in range. Take baseline FBC, renal function with <b>Cockcroft–Gault creatinine clearance</b> (current weight, not eGFR), LFTs and clotting BEFORE starting — but do not wait for the results to start treatment. Rivaroxaban 15 mg and 20 mg doses are taken with food; check interacting medicines."},
    {tone:"red", h:"⛔ Established triple-positive APS: not a DOAC", html:"<b>Established triple-positive antiphospholipid syndrome: do not initiate a DOAC</b> — use LMWH with warfarin/VKA overlap until the INR is therapeutic, then continue the VKA, with haematology advice (NICE NG158; MHRA). <b>Suspected but unconfirmed APS:</b> do not automatically withhold a DOAC — discuss testing and anticoagulant choice with haematology, particularly with arterial or recurrent thrombosis or a high-risk phenotype. APS is acquired: a family history of VTE does not suggest it."},
    {tone:"amber", h:"Provoked or unprovoked sets the duration", html:"Provoked (surgery, immobility, combined oral contraceptive, pregnancy) → at least 3 months; consider stopping at 3 months if the provoking factor has resolved and the course has been uncomplicated, weighing recurrence risk, bleeding risk and preference. Unprovoked → consider continuing beyond 3 months, particularly where bleeding risk is low, after discussing the balance with the patient, and review for an underlying cause."},
    {tone:"purple", h:"🟣 NICE NG12 (updated April 2026) — unprovoked DVT and occult cancer", html:"<b>In unprovoked DVT the clot may be the presenting sign of a cancer.</b> Review the history, examine, and check baseline bloods and urinalysis (NG158); investigate further only where directed by symptoms or signs, and apply the NG12 criteria for any symptom that emerges — unexplained weight loss, a change in bowel habit, haematuria, or an abnormal examination finding. Do not order an untargeted whole-body screen; do not skip the assessment either."},
    {tone:"green", h:"Mobilise as tolerated — routine bed rest is not required", html:"<b>Mobilise as tolerated, with leg elevation when resting if helpful.</b> Graduated compression stockings may be considered for ongoing leg symptoms (with advice on fitting, use and replacement), NOT for routine prevention of post-thrombotic syndrome or recurrent VTE — a change many clinicians missed. <b>Review the combined oral contraceptive or HRT</b> as a provoking factor."}
  ],
  pathwaySub:"Five steps after objective confirmation of proximal DVT. Isolated distal (calf) DVT follows the local VTE/haematology pathway instead.",
  pathway:[
    {title:"Confirm the site, check suitability, start anticoagulation", html:"Confirm proximal versus isolated distal DVT from the ultrasound report and exclude PE clinically. Check suitability: active bleeding, renal and hepatic function, pregnancy, APS, active cancer, extremes of weight, interacting drugs, adherence and home circumstances. A DOAC first-line for most. Take FBC, renal function with Cockcroft–Gault creatinine clearance, LFTs, PT/APTT, a pregnancy test where relevant and urinalysis if unprovoked first — but start treatment without waiting for them.", alert:true},
    {title:"Classify: provoked or unprovoked", html:"A transient risk factor makes it provoked. Absence of one makes it unprovoked — which changes both the duration and the need to think about an underlying cause."},
    {title:"Give the two safety-nets before they leave", html:"Sudden breathlessness or pleuritic pain means 999 — that is PE. And the bleeding rules: black or bloody stools, vomiting blood, any bleed that will not stop, and urgent emergency assessment after any head injury."},
    {title:"Decide duration at 3 months", html:"Provoked with the factor resolved and an uncomplicated course → consider stopping, weighing recurrence risk, bleeding risk and preference. Unprovoked → consider continuing, particularly if bleeding risk is low."},
    {title:"Then review at least annually", html:"Renal function and creatinine clearance (DOACs are renally dosed), bleeding risk, recurrence, and whether the anticoagulant is still needed."}
  ],
  sections:[

    {id:"safety", nav:"Red flags", title:"Red flags — the chest, the bleed, and the leg that is getting worse",
     blocks:[
       {b:"table", head:["Feature","Meaning","Action"], rows:[
         ["<b>Sudden breathlessness, pleuritic chest pain, haemoptysis or collapse</b>","<b>Pulmonary embolism</b>","<b>999.</b> <b>Give this warning explicitly at the first consultation</b> — the patient is watching the leg, not the chest. See <a href='pulmonary-embolism.html'>pulmonary embolism</a>"],
         ["<b>Massive, tense, painful, dusky leg — extensive iliofemoral DVT</b>","Suspected phlegmasia or limb-threatening iliofemoral DVT. Catheter-directed thrombolysis is considered only in selected patients meeting specialist criteria (NICE: symptoms under 14 days, good functional status, life expectancy of at least 1 year, low bleeding risk) — it is not automatic","<b>Same-day vascular assessment</b>"],
         ["<b>Melaena, haematemesis, heavy vaginal bleeding, persistent epistaxis, haematuria, unexplained marked bruising, or any bleed that will not stop</b>","<b>Major bleeding on anticoagulation</b>","<b>Urgent assessment.</b> The patient must say they are anticoagulated"],
         ["<b>Head injury while anticoagulated, however minor it seemed</b>","<b>Intracranial haemorrhage — may be delayed and initially silent</b>","<b>Urgent clinical assessment — advise attending the emergency department, even if initially well</b>"],
         ["<b>Worsening leg pain and swelling despite treatment</b>","<b>Clot extension, or the diagnosis is wrong</b>","<b>Reassess — confirm adherence and dose, then seek specialist advice</b>"],
         ["<b>Recurrence while anticoagulated</b>","A red flag in itself: adherence, wrong dose, renal function, interacting medicines, antiphospholipid syndrome or occult cancer — and confirm the event objectively","<b>Haematology advice.</b> Do not simply switch agent without asking why"],
         ["Unprovoked DVT with weight loss, bowel-habit change, haematuria or an abnormal examination","<b>Occult malignancy presenting as thrombosis</b>","<b>Apply the relevant NG12 criteria — see <a href='#refer'>Refer</a></b>"]
       ]}
     ]},

    {id:"classify", nav:"Classify", title:"Classify the DVT, and take the baselines",
     blocks:[
       {b:"warn", html:"<b>Not covered by this page — use local referral pathways:</b> suspected DVT before imaging · suspected or confirmed PE · pregnancy-associated VTE (NICE NG158 does not cover pregnancy) · patients under 18 · isolated distal DVT · upper-limb or unusual-site thrombosis · recurrent thrombosis on anticoagulation · mechanical heart valves · severe renal failure · established APS · active bleeding · phlegmasia · patients needing thrombolysis or thrombectomy."},
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>Confirmed</b>","In suspected DVT, use the two-level DVT Wells score and the NICE diagnostic pathway — proximal leg-vein ultrasound, D-dimer where indicated, interim anticoagulation if imaging is delayed. A D-dimer never confirms DVT, and a negative D-dimer does not override an abnormal pathway. Once DVT is objectively confirmed, classify the site: <b>proximal DVT → this pathway</b>; <b>isolated distal (calf) DVT → discuss with the local VTE/haematology pathway</b> — anticoagulation or serial ultrasound surveillance depending on clot extent, symptoms, extension risk and bleeding risk. Do not automatically apply the proximal-DVT pathway"],
         ["<b>Provoked</b>","A transient risk factor: surgery, immobility, long-haul travel, combined oral contraceptive, HRT, pregnancy, trauma. <b>Review and stop the provoking drug where possible</b>"],
         ["<b>Unprovoked</b>","No identifiable transient factor → assess for possible underlying cancer (below). <b>The clot may be the presenting sign.</b> Do not request thrombophilia testing routinely: consider antiphospholipid antibodies, or selected hereditary thrombophilia testing, only if the result would change the decision about stopping anticoagulation — seek specialist advice, as anticoagulants affect interpretation"],
         ["<b>Other categories</b>","Active cancer-associated · recurrent · unusual or complex (unusual site, pregnancy, APS) — these need specialist input"],
         ["<b>Cancer assessment in unprovoked DVT</b>","Review the history, examination, available imaging and baseline blood results (FBC, renal and hepatic function), and offer urinalysis. Investigate further only if symptoms or signs suggest a specific cancer, using the NG12 criteria. <b>No routine CT or whole-body screen — but not nothing either</b>"],
         ["<b>Baseline tests</b>","FBC · renal function with <b>Cockcroft–Gault creatinine clearance</b> using current weight (this determines the DOAC dose; don't substitute eGFR, especially in older people, at extremes of weight or when renal function is changing) · weight · LFTs · PT and APTT · pregnancy test where relevant · urinalysis in unprovoked DVT. Take them before starting — but do not delay treatment waiting for the results"]
       ]},
       {b:"why", html:"Two questions shape the entire plan: which anticoagulant, and for how long. The first is answered by creatinine clearance and a short list of specific exceptions; the second is answered almost entirely by whether the DVT was provoked. And the unprovoked answer carries a second obligation — thinking about why it happened — because in this group the thrombosis is sometimes the first manifestation of a cancer that is otherwise silent."}
     ]},

    {id:"anticoag", nav:"Anticoagulate", title:"Anticoagulation — the agent",
     blocks:[
       {b:"table", head:["Situation","Agent","Notes"], rows:[
         ["<b>Most adults with confirmed proximal DVT</b>","<b>A DOAC — apixaban or rivaroxaban</b>","<b>First-line (NG158).</b> Prescribe the indication-specific dose using Cockcroft–Gault creatinine clearance and review as renal function changes. Rivaroxaban 15 mg and 20 mg with food. Check interacting medicines (strong CYP3A4/P-glycoprotein inhibitors or inducers); avoid concurrent anticoagulants unless deliberately switching or under specialist direction; assess bleeding risk, active bleeding, hepatic disease and extremes of body weight. Use the current SPC and local formulary rather than a dose table"],
         ["<b>DOAC unsuitable</b>","<b>LMWH for at least 5 days followed by dabigatran or edoxaban, or LMWH with warfarin (overlap at least 5 days and until the INR is in range)</b>","Severe renal impairment is a common reason — restrictions differ by drug and indication, so check the current product information and local formulary for the chosen agent"],
         ["<b>Established triple-positive APS</b>","<b>LMWH with a VKA (warfarin) until the INR is therapeutic, then the VKA alone — do not initiate a DOAC</b>","NICE NG158; MHRA: DOACs are not recommended in APS, particularly triple-positive, because of increased recurrent thrombosis. Haematology advice. <b>Suspected but unconfirmed APS:</b> do not automatically withhold a DOAC — discuss testing and choice with haematology, particularly with arterial or recurrent thrombosis. A family history of VTE does not suggest APS"],
         ["<b>Cancer-associated thrombosis</b>","<b>A DOAC where suitable; otherwise LMWH alone or LMWH with a vitamin K antagonist</b>","Consider a DOAC after assessing tumour site, gastrointestinal or genitourinary bleeding risk, drug interactions, absorption and patient preference — not automatically suitable for all cancer-associated VTE (NG158). Discuss with the oncology team where appropriate"],
         ["<b>Pregnancy</b>","<b>LMWH</b>","NG158 does not cover pregnancy — follow the RCOG/local pregnancy VTE guideline. <b>DOACs should not be used to treat VTE in pregnancy.</b> Warfarin is generally avoided but may be required in exceptional specialist circumstances (e.g. some mechanical heart valves). Refer directly for joint obstetric and haematology care"],
         ["<b>Anticoagulation contraindicated</b>","<b>Seek urgent specialist advice about temporary mechanical intervention</b>","Do not arrange an IVC filter routinely: NICE reserves it, as a specialist decision, for proximal DVT or PE when anticoagulation is contraindicated or PE occurs despite appropriate anticoagulation"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"⚠ Coordinate procedures and interacting drugs", html:"Plan surgery, invasive and neuraxial procedures in advance, and tell dentists and other clinicians. Review drugs that add bleeding risk: avoid NSAIDs unless specifically agreed; review antiplatelets; SSRIs may increase bleeding risk, but the decision is individualised. Check before any over-the-counter or herbal product, and never self-stop the anticoagulant. See <a href='antiplatelets-anticoagulants.html'>antiplatelets and anticoagulants</a>."},
         {tone:"green", h:"🚶 Mobilise, do not rest", html:"<b>Mobilise as tolerated, with leg elevation when resting if helpful.</b> <b>Routine bed rest is not required</b> — patients often assume the opposite and need telling."},
         {tone:"blue", h:"🧦 Compression stockings", html:"Not for routine prevention of post-thrombotic syndrome or recurrent VTE. May be considered for ongoing leg symptoms, with advice on fitting, use and replacement. This changed and is still widely prescribed the old way."},
         {tone:"green", h:"✈️ Preventing the next one", html:"For future travel give general advice on mobility and hydration — do not suggest self-administered LMWH or aspirin for flights; refer high-risk patients to an individualised travel-prophylaxis pathway. Flag the VTE history before future surgery or immobility, and address weight, activity and smoking."}
       ]}
     ]},

    {id:"duration", nav:"How long?", title:"Duration — the decision at 3 months",
     blocks:[
       {b:"table", head:["Category","Duration","Notes"], rows:[
         ["<b>Provoked, factor resolved</b>","<b>At least 3 months, then consider stopping</b>","Proximal DVT: consider stopping at 3 months if the provoking factor has resolved and the clinical course has been uncomplicated — still weigh recurrence risk, bleeding risk and patient preference (NG158)"],
         ["<b>Unprovoked</b>","<b>At least 3 months, then consider continuing</b>","Consider continuing beyond 3 months, particularly where bleeding risk is low — NICE: the benefits of continuing are then likely to outweigh the risks. Discuss the balance of recurrence and bleeding risk with the patient; do not rely solely on a prediction score. Complete the underlying-cause assessment before deciding"],
         ["<b>Cancer-associated</b>","<b>3 to 6 months, then review</b>","NG158: treat for 3–6 months, then decide on continuing by clinical need (for example the cancer is still active or being treated). Continuation beyond this is often appropriate while the cancer remains active or under treatment"],
         ["<b>Recurrent VTE</b>","<b>Usually long-term</b>","<b>Haematology advice — and ask why it recurred before extending blindly</b>: adherence, correct dosing, renal function, interacting medicines, malignancy, APS, and whether the event was objectively confirmed"]
       ]},
       {b:"say", html:"We treat the clot with a blood-thinning tablet, and the first decision point is three months. If we can point to a clear cause — the operation, the long flight, the pill — then once that has passed we usually consider stopping. If there was no obvious cause, the risk of another clot stays higher, and we will talk about staying on it long term, weighing that against the bleeding risk. Either way, take it every single day: a missed dose leaves you unprotected, and this is not a tablet where you can catch up later."}
     ]},

    {id:"monitor", nav:"Monitor", title:"Monitoring and review",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["<b>Renal function and Cockcroft–Gault creatinine clearance</b>","<b>At baseline, when renal function changes, and at least annually — more often if older, frail or renally impaired</b>","<b>Re-dose or switch the DOAC as renal function changes</b> — this is the commonest reason a dose becomes wrong over time"],
         ["<b>FBC, LFTs and bleeding review</b>","<b>FBC if clinically indicated and periodically per the local DOAC protocol; LFTs where indicated</b>","Anaemia may mean an occult bleed — investigate rather than attributing it to the drug"],
         ["<b>Duration decision</b>","<b>At 3 months</b>","Continue or stop, weighing recurrence risk, bleeding risk, the provoking factor and patient preference"],
         ["<b>Underlying cause</b>","<b>Unprovoked DVT</b>","<b>Complete the cancer review (history, examination, available imaging, baseline bloods and urinalysis).</b> Antiphospholipid and hereditary thrombophilia testing only in the NG158 groups, and only when planning to stop anticoagulation"],
         ["<b>Soon after starting</b>","<b>First follow-up</b>","Confirm the indication and site, the correct indication-specific dose, adherence, bleeding symptoms and leg symptoms; check that an anticoagulant alert card and written information, including missed-dose advice, were given"],
         ["<b>If continued long-term</b>","<b>At least annually</b>","Renal function and creatinine clearance, FBC per protocol, bleeding and anaemia, recurrence or new symptoms, interacting medicines, whether it is still needed, and pregnancy plans where relevant"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 999 — pulmonary embolism", html:"\"Sudden breathlessness, sharp chest pain that is worse when you breathe in, coughing up blood, or collapse — call 999.\""},
         {tone:"red", h:"🩸 Bleeding", html:"\"Black or bloody stools, vomiting blood, or a bleed that will not stop — get urgent help and tell them you are on a blood thinner. After any head injury, go to the emergency department straight away, even if you feel well — bleeding inside the head can be delayed. Also get urgent advice for heavy vaginal bleeding, a nosebleed that won't stop, blood in your urine or unexplained large bruises. Carry your anticoagulant alert card, and tell clinicians which anticoagulant you take, the dose and when you last took it.\""},
         {tone:"amber", h:"🦵 The leg getting worse", html:"\"Worsening pain or swelling in the leg despite treatment — contact us.\""},
         {tone:"blue", h:"💊 Do not miss doses", html:"\"Take it exactly as prescribed. Missed doses leave you unprotected, and with these tablets the effect wears off quickly. Don't stop it without medical advice unless you're told to in an emergency. Avoid anti-inflammatory painkillers unless we've agreed them, and check before taking any over-the-counter or herbal medicine.\""}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Emergency", html:"Suspected pulmonary embolism · suspected phlegmasia or limb-threatening iliofemoral DVT (same-day vascular assessment) · major bleeding · head injury on anticoagulation."},
         {tone:"purple", h:"Suspected cancer · NICE NG12 — the cancer that presented as a clot", html:"<b>Unprovoked DVT warrants an assessment for occult cancer.</b> Apply the age- and symptom-specific NG12 criteria to whatever the history and examination turn up: <b>colorectal</b> — FIT for an abdominal mass, a change in bowel habit, iron-deficiency anaemia, age 40 and over with unexplained weight loss and abdominal pain, selected combinations of rectal bleeding, age, abdominal pain or weight loss, and anaemia aged 60 and over even without iron deficiency; a FIT of at least 10 µg Hb/g → suspected colorectal cancer pathway, and a negative or unavailable FIT must not override persistent clinical concern · <b>bladder and renal</b> — aged 45 and over with unexplained visible haematuria without UTI, or visible haematuria persisting or recurring after successful UTI treatment; aged 60 and over with unexplained non-visible haematuria plus dysuria or a raised white-cell count · <b>lung</b> — urgent direct-access chest X-ray aged 40 and over with two or more unexplained relevant symptoms (cough, fatigue, shortness of breath, chest pain, weight loss, appetite loss), or one if they have ever smoked. Apply the current symptom-specific NG12 criteria rather than treating weight loss plus any single symptom as automatic."},
         {tone:"amber", h:"Haematology", html:"Recurrence despite anticoagulation · unusual-site thrombosis · established or suspected antiphospholipid syndrome · thrombophilia questions only where the result would change the decision to stop anticoagulation · isolated distal DVT (local VTE pathway) · severe renal impairment · high bleeding risk · difficult duration decisions."},
         {tone:"amber", h:"Obstetrics / specialist VTE", html:"<b>Pregnancy-associated VTE (outside NG158 — RCOG/local pathway, refer directly), complex cancer-associated thrombosis, mechanical heart valves, or patients under 18 (paediatric pathway).</b>"},
         {tone:"cream", h:"GP management", html:"For confirmed proximal DVT in non-pregnant adults: starting and dosing the DOAC, the provoked/unprovoked classification, the occult-cancer assessment, the 3-month duration decision, mobilisation and stockings, the safety-nets and the annual review all belong here. Related pages: <a href='pulmonary-embolism.html'>pulmonary embolism</a> · <a href='antiplatelets-anticoagulants.html'>antiplatelets and anticoagulants</a> · <a href='atrial-fibrillation.html'>atrial fibrillation</a> · <a href='varicose-veins.html'>varicose veins</a>."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 34-year-old woman has a confirmed left popliteal (proximal) DVT. She takes the <b>combined oral contraceptive pill</b> and flew back from Australia three weeks ago. She has <b>no other risk factors</b>, and mentions that her <b>mother had a clot in her thirties</b>. She asks how long she will be on tablets, whether she can still take the pill, and whether her <b>sister should be tested</b>."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Classifies it as provoked (COC plus long-haul flight) and gives the ≥3-month answer with the stop-review at 3 months; stops the combined pill and discusses safe alternatives — progestogen-only, the LNG-IUS — rather than leaving a gap; recognises the DVT is provoked by the combined pill and long-haul travel, so <b>does not routinely test for thrombophilia</b> (NICE) — specialist advice only if the family history is unusually strong, the event is not clearly provoked, or results would change management — and knows a family history alone does not suggest APS and that testing on anticoagulation is unreliable; <b>gives general mobility and hydration advice for future flights and flags the history before surgery</b>; <b>gives the PE and bleeding safety-nets explicitly</b>; <b>addresses mobilisation and corrects any assumption about bed rest</b>; and <b>answers the sister question honestly</b> — cascade testing is a specialist decision, not a routine one."}
     ]}]},
