<script>
MG.render({
  icon:"🦟",
  title:"Malaria Prophylaxis",
  eyebrow:"Protocol · pre-travel advice and the returning traveller",
  stemTitle:"Malaria prevention — the tablets are the third letter, not the first",
  stemSub:"Most UK malaria deaths are avoidable, and most failures are not about the choice of drug: the traveller did not know the risk, stopped the tablets on the plane home, was bitten every evening, or had a fever that nobody tested. The UK Malaria Expert Advisory Group (UKMEAG, formerly ACMP) builds its annual guidance around four letters — Awareness of risk, Bite prevention, Chemoprophylaxis, and prompt Diagnosis and treatment. This page follows those letters and the 2026 edition. UKHSA UKMEAG Malaria prevention guidelines for travellers from the UK (2026) · MHRA Drug Safety Update (2013) · BNF and BNFC · Health Protection (Notification) Regulations 2010.",
  guideline:"UKHSA UKMEAG Malaria prevention guidelines for travellers from the UK (2026 edition, June 2026) · MHRA Drug Safety Update, mefloquine (2013) · BNF and BNFC · UK malaria treatment guidelines (J Infect 2016) · Health Protection (Notification) Regulations 2010",
  meta:[
    {t:"UKHSA UKMEAG malaria prevention guidelines · 2026"},
    {t:"MHRA DSU · mefloquine neuropsychiatric warnings"},
    {t:"BNF and BNFC · antimalarial doses"},
    {t:"Notifiable disease · statutory duty", tone:"tw"},
    {t:"No NG12 criterion applies"}
  ],
  lead:"<div class='mg-layers'><a href='#fever'><b>Fever after travel</b><small>Malaria until proven otherwise</small></a><a href='#risk'><b>A · Awareness</b><small>Destination and traveller</small></a><a href='#bites'><b>B · Bites</b><small>DEET up to 50%</small></a><a href='#drugs'><b>C · Chemoprophylaxis</b><small>Start, stop, contraindications</small></a><a href='#special'><b>Special groups</b><small>Pregnancy, children, epilepsy</small></a></div>",
  quickSub:"The six points that change what you do. Every figure traces to a source listed under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"Fever after travel is malaria until proven otherwise", html:"Any fever or flu-like illness during travel or after return from a malaria-endemic area needs <b>same-day blood testing for malaria</b> (thick and thin films and/or a rapid diagnostic test). UKMEAG asks clinicians to consider malaria in every ill patient who has returned from the tropics in the <b>previous year</b>, especially the <b>previous 3 months</b>. Do not wait for fever spikes, and one negative film or RDT does not exclude it.", src:"UKHSA UKMEAG guidelines 2026 — Diagnosis"},
    {tone:"amber", h:"Match the drug to the destination — check the country table every time", html:"Resistance patterns and recommendations change. Look up the current UKMEAG country recommendations (reproduced on TravelHealthPro by NaTHNaC) for the exact itinerary — including rural or border areas, season and length of stay — before choosing a drug or deciding that bite prevention alone is enough.", src:"UKHSA UKMEAG guidelines 2026 — Country recommendations"},
    {tone:"blue", h:"The three main options and their timings", html:"<b>Atovaquone-proguanil</b>: one adult tablet daily, start 1–2 days before, continue <b>7 days</b> after leaving. <b>Doxycycline 100 mg daily</b>: start 1–2 days before, continue <b>4 weeks</b> after. <b>Mefloquine 250 mg weekly</b>: start 2–3 weeks before (to test tolerance), continue <b>4 weeks</b> after. Children’s doses are by weight (BNFC). Proguanil-alone tablets and chloroquine (Avloclor) are no longer available in the UK.", src:"UKHSA UKMEAG guidelines 2026 — Chemoprophylaxis · BNF"},
    {tone:"red", h:"Mefloquine: screen for psychiatric history — every time", html:"Mefloquine must not be used for prophylaxis in anyone with current or past depression, anxiety disorder, psychosis, schizophrenia or other psychiatric disorder, or a history of seizures. Use the prescriber checklist and give the patient alert card. Anyone who develops neuropsychiatric symptoms or a change in mental state should stop it and seek advice so it can be replaced.", src:"MHRA Drug Safety Update, mefloquine (2013) · Lariam SPC"},
    {tone:"green", h:"Bite prevention works for every traveller", html:"<b>DEET-based repellent up to 50%</b> is suitable in pregnancy, breastfeeding and for infants over 2 months. Apply sunscreen first and repellent afterwards. Sleep under an insecticide-treated net unless the room is screened or air-conditioned, and cover up from dusk to dawn. Icaridin 20% and Eucalyptus citriodora oil (hydrated, cyclized) are alternatives.", src:"UKHSA UKMEAG guidelines 2026 — Bite prevention"},
    {tone:"purple", h:"Malaria is notifiable — the doctor’s duty", html:"A registered medical practitioner who suspects malaria must notify the proper officer at the local council or the UKHSA health protection team. Laboratories notify on confirmation, but the clinician’s duty applies to <b>suspected</b> cases — do not wait for the film.", src:"Health Protection (Notification) Regulations 2010 · UKHSA notifiable diseases guidance"}
  ],
  pathwaySub:"Four letters and a safety net. The last step is the one that saves lives.",
  pathway:[
    {title:"A — Awareness of risk", html:"Where exactly, when, for how long, how they will live (rural, camping, cruise, city hotel), and why (holiday, business, visiting friends and relatives). Who is travelling: age, pregnancy or plans for it, breastfeeding, epilepsy, psychiatric history, renal function, asplenia, immunosuppression, current medicines. Check the current UKMEAG country table."},
    {title:"B — Bite prevention", html:"DEET up to 50% (sunscreen first, repellent on top), insecticide-treated bed nets, covering up from dusk to dawn, screened or air-conditioned rooms. The same advice protects against dengue and other mosquito-borne infections for which there are no tablets."},
    {title:"C — Chemoprophylaxis", html:"Choose an agent the destination needs and the traveller can take: atovaquone-proguanil, doxycycline or mefloquine. Explain start and stop dates in writing. The commonest failure is stopping early after return — especially the 4-week tail for doxycycline and mefloquine."},
    {title:"D — Diagnose promptly", html:"Any fever during travel or in the year after return: same-day malaria test and say where you have been. For remote travel more than 24 hours from medical care, consider emergency standby treatment in addition to prophylaxis."},
    {title:"Safety net for the returning traveller", html:"<b>Fever after travel = same-day malaria films or RDT.</b> Severe features (confusion, reduced consciousness, jaundice, breathlessness, bleeding, low urine output, vomiting and unable to keep tablets down) → emergency admission. Notify on suspicion.", alert:true}
  ],
  sections:[
    {id:"fever", nav:"Fever after travel", title:"The returning traveller with a fever", sub:"This is where malaria kills in the UK. Chemoprophylaxis reduces the risk; it never removes it.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Fever or flu-like illness after a malaria area", html:"Treat as malaria until proven otherwise. <b>Same-day</b> blood films (thick and thin) and/or an RDT — usually via the hospital acute team or laboratory, since results are needed within hours. Consider malaria in any unwell patient who has returned from the tropics in the previous year, and especially in the previous 3 months. Falciparum malaria can deteriorate within hours.", src:"UKHSA UKMEAG guidelines 2026 — Diagnosis"},
         {tone:"red", h:"🔴 Severe or complicated malaria features", html:"Impaired consciousness or confusion, seizures, jaundice, breathlessness or acidotic breathing, spontaneous bleeding, reduced urine output, shock, or vomiting that prevents oral treatment → <b>emergency admission</b>. Children may present with non-specific illness, drowsiness or poor feeding.", src:"UK malaria treatment guidelines, Lalloo DG, et al., J Infect 2016"},
         {tone:"amber", h:"🟠 One negative test does not exclude malaria", html:"A single negative film or RDT is not enough if suspicion remains — repeat testing is needed. Do not wait for periodic fever: the textbook pattern is often absent, especially with falciparum.", src:"UKHSA UKMEAG guidelines 2026 — Diagnosis · UK malaria treatment guidelines, J Infect 2016"},
         {tone:"amber", h:"🟠 Prophylaxis taken ≠ malaria excluded", html:"No regimen is 100% protective, and partial prophylaxis can delay and blur the presentation. Taking tablets correctly makes malaria less likely; it does not remove the need to test.", src:"UKHSA UKMEAG guidelines 2026 — General issues"},
         {tone:"purple", h:"⚖️ Notify on suspicion", html:"Malaria is a notifiable disease. The registered medical practitioner notifies the proper officer (via the UKHSA health protection team) when malaria is suspected; the laboratory notifies separately on confirmation.", src:"Health Protection (Notification) Regulations 2010 · UKHSA notifiable diseases guidance"}
       ]},
       {b:"why", html:"<b>Why ‘within a year’?</b> Falciparum malaria usually presents within weeks of return, but prophylaxis can lengthen the interval, and <i>P. vivax</i> and <i>P. ovale</i> can relapse from dormant liver stages months later. The cases that go wrong are the ones where nobody asked about travel. Put it in the safety-net for every traveller and in the history for every febrile adult."}
     ]},

    {id:"risk", nav:"A · Awareness", title:"A — Assessing the risk: destination and traveller", sub:"The same drug is not right for the same country for every traveller.",
     blocks:[
       {b:"table", head:["Ask about","Why it matters","What changes"], rows:[
         ["<b>Exact itinerary</b>","Risk varies within countries (rural versus urban, border areas, altitude) and by season","Use the current UKMEAG country recommendations; some areas need bite prevention only"],
         ["<b>Length of stay</b>","Cumulative exposure; adherence falls on long trips","Long-stay options and drug duration limits (see Special groups)"],
         ["<b>Visiting friends and relatives</b>","Travellers who grew up in endemic countries often believe they are immune; immunity wanes quickly after leaving","Explain the loss of immunity; same prophylaxis as other travellers"],
         ["<b>Pregnancy, plans for pregnancy, breastfeeding</b>","Malaria is more severe in pregnancy; drug choice narrows","Advise against travel to high-risk areas if possible; see Special groups"],
         ["<b>Psychiatric history or seizures</b>","Mefloquine contraindicated; chloroquine unsuitable in epilepsy","Atovaquone-proguanil or doxycycline"],
         ["<b>Renal function</b>","Atovaquone-proguanil not recommended as prophylaxis if eGFR under 30 mL/min","Doxycycline or mefloquine"],
         ["<b>Asplenia or severe immunosuppression</b>","Higher risk of severe malaria","Rigorous adherence; specialist travel advice"],
         ["<b>Current medicines</b>","Mefloquine with amiodarone is contraindicated; antimalarials interact with warfarin and antiepileptics","Check the BNF interaction entries; INR check before and during travel on warfarin"],
         ["<b>Previous antimalarial experience</b>","Tolerability and adherence","Use what worked if it suits the destination"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"📋 Use the UKMEAG template", html:"The guidelines include a template for recording the risk assessment and the advice given (Appendix 2). Recording the itinerary, the drug, the start and stop dates and the fever advice protects the patient and the clinician.", src:"UKHSA UKMEAG guidelines 2026 — Appendix 2"},
         {tone:"cream", h:"🌿 Homeopathic ‘prophylaxis’ does not work", html:"There is no evidence that homeopathic remedies prevent malaria, and UKHSA advises against them. Travellers who rely on them are unprotected.", src:"UKHSA — Malaria: homeopathic remedies"}
       ]}
     ]},

    {id:"bites", nav:"B · Bites", title:"B — Bite prevention", sub:"Anopheles mosquitoes bite mainly between dusk and dawn. Layers of protection work better than any single measure.",
     blocks:[
       {b:"tiles", v:"life", items:[
         {t:"🧴 DEET up to 50%", html:"The UKMEAG first choice. Suitable in pregnancy and breastfeeding and for infants over 2 months (seek advice under 2 months). Wash off the hands and breast skin before handling a baby."},
         {t:"☀️ Sunscreen first", html:"Apply sunscreen, then the repellent on top. UKMEAG suggests SPF 30–50 to allow for DEET reducing sunscreen effect. Sunscreen is not needed from dusk to dawn."},
         {t:"🌿 Alternatives", html:"Icaridin 20% gives protection comparable to DEET 20%. Eucalyptus citriodora oil (hydrated, cyclized) is the only plant-based active UKMEAG recommends — it needs more frequent reapplication."},
         {t:"🛏️ Nets", html:"An insecticide (pyrethroid)-treated bed net, tucked in, unless the room is screened or air-conditioned. Treated nets protect even where skin touches the net."},
         {t:"👕 Clothing", html:"Long sleeves and trousers from dusk; clothing can be treated with permethrin."},
         {t:"🚫 What does not work", html:"Electronic buzzers, vitamin B1, garlic and homeopathic remedies have no useful protective effect."}
       ]},
       {b:"why", html:"<b>Why bite prevention first?</b> It is the only measure that also protects against dengue, chikungunya and other infections without a vaccine or tablet, and it reduces the dose of malaria parasites the tablets have to deal with. Pregnant women are more attractive to mosquitoes, which makes it even more important in pregnancy (UKMEAG 2026)."}
     ]},

    {id:"drugs", nav:"C · Chemoprophylaxis", title:"C — Choosing and using chemoprophylaxis", sub:"Adult doses below are those stated in the UKMEAG guidelines and the BNF; children’s doses are by body weight — use the BNFC tables.",
     blocks:[
       {b:"table", head:["Drug","Adult regimen","Start / stop","Key cautions"], rows:[
         ["<b>Atovaquone-proguanil</b>","One adult tablet (250 mg/100 mg) daily with food or a milky drink","Start 1–2 days before entering; continue daily while there and for <b>7 days</b> after leaving","Not recommended for prophylaxis if eGFR under 30 mL/min. UKMEAG: no evidence of harm in long-term use — can be taken confidently for up to a year, and beyond if well tolerated. Paediatric tablets by weight (BNFC)"],
         ["<b>Doxycycline</b>","100 mg once daily","Start 1–2 days before; continue daily while there and for <b>4 weeks</b> after leaving","Unsuitable under 12 years. Photosensitivity — use high-factor sunscreen. Take with plenty of water, sitting or standing, not just before bed (oesophagitis). Vaginal candidiasis. Not in pregnancy beyond the limit below"],
         ["<b>Mefloquine</b>","250 mg once weekly","Start 2–3 weeks before (to assess tolerability); continue weekly while there and for <b>4 weeks</b> after leaving","Contraindicated with current or past psychiatric disorder or seizures; contraindicated with amiodarone. Neuropsychiatric effects can persist after stopping (MHRA). Protective efficacy 90% or more (UKMEAG)"],
         ["<b>Proguanil alone / chloroquine</b>","—","—","Proguanil-only tablets (Paludrine) were discontinued in the UK in December 2023, and chloroquine (Avloclor) is no longer available. Older leaflets that recommend them are out of date"]
       ]},
       {b:"ladder", steps:[
         {step:"First", title:"Confirm the destination needs tablets", when:"country table", fromLabel:"UKMEAG 2026",
          html:"Some destinations need bite prevention only; others need a specific agent. Check the current country recommendation, including the traveller’s specific area and season."},
         {step:"Then", title:"Exclude what the traveller cannot take", when:"history", fromLabel:"patient factors",
          html:"Psychiatric history or seizures → no mefloquine. Under 12 → no doxycycline. eGFR under 30 → avoid atovaquone-proguanil. Pregnancy → see Special groups. Check interactions (warfarin, antiepileptics, amiodarone) in the BNF."},
         {step:"Choose", title:"Fit the regimen to the trip", when:"practicalities", fromLabel:"adherence",
          html:"Short or last-minute trips: a daily agent with a short tail (atovaquone-proguanil) is often easiest. Long stays: a weekly agent (mefloquine) if suitable, or doxycycline, or atovaquone-proguanil. Someone already taking doxycycline long-term for another reason still needs the malaria dose and timing confirmed."},
         {step:"Explain", title:"Start and stop dates in writing", when:"every traveller", fromLabel:"the failure point",
          html:"Write the dates down. The tail after return (7 days for atovaquone-proguanil; 4 weeks for doxycycline and mefloquine) is where most adherence fails. If vomiting within 1 hour of a dose, repeat the dose (atovaquone-proguanil SPC)."}
       ]},
       {b:"warn", html:"<b>Mefloquine safeguards (MHRA, 2013).</b> Use the prescriber checklist; give the patient alert card; ask directly about depression, anxiety, psychosis, suicidal thoughts and seizures; tell the patient to stop and seek advice if they develop anxiety, depression, restlessness, confusion or other mental-state change so another agent can be substituted. Dizziness, vertigo and loss of balance have occasionally persisted for months after stopping."}
     ]},

    {id:"sbet", nav:"D · Diagnose", title:"D — Diagnosis abroad and emergency standby treatment", sub:"For most travellers, the plan for a fever is ‘see a doctor the same day and get tested’. Standby treatment is for the few who cannot.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"🎒 Who needs emergency standby treatment", html:"Travellers going somewhere they may be unable to consult a doctor or get a diagnosis <b>within 24 hours</b> of a fever starting. UKMEAG regimens are in its country-recommendations section (Table 7); options include artemether-lumefantrine and atovaquone-proguanil at treatment doses. Do not use the same drug as the traveller’s prophylaxis.", src:"UKHSA UKMEAG guidelines 2026 — Chemoprophylaxis and Appendix 3"},
         {tone:"amber", h:"📝 What the traveller must be given", html:"Written instructions (UKMEAG Appendix 3 leaflet): the symptoms that suggest malaria, including a temperature of <b>38°C or above</b>; when to start; how to take the course; expected side effects; and the possibility of treatment failure. Seek medical care as soon as possible even after self-treating. Restart prophylaxis <b>one week after the first treatment dose</b>.", src:"UKHSA UKMEAG guidelines 2026 — Appendix 3"}
       ]},
       {b:"say", html:"If you get a temperature or feel flu-ish while you’re away or in the year after you come back, get a malaria test the same day and tell them where you’ve been. It’s not something to sleep on — this kind of malaria can get dangerous within a day. The tablets make it much less likely, but no tablet is 100%."}
     ]},

    {id:"special", nav:"Special groups", title:"Special risk groups", sub:"Where the choice narrows or the stakes rise.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"🤰 Pregnancy", html:"Malaria is more severe in pregnancy, so advise against travel to high-risk areas if it can be avoided. If travel is unavoidable, prophylaxis is justified. <b>Mefloquine</b> can be used, including in the first trimester, in high-risk areas such as sub-Saharan Africa; inadvertent exposure is not a reason to terminate. <b>Doxycycline</b> is best avoided, but if needed before 15 weeks it should not be withheld when other options are unsuitable — the whole course, including the 4 weeks after travel, must finish <b>before 15 weeks’ gestation</b>. <b>Atovaquone-proguanil</b> has limited safety data; UKMEAG allows it if there is no other suitable option, with <b>folic acid 5 mg daily</b> when conception is planned and throughout pregnancy.", src:"UKHSA UKMEAG guidelines 2026 — Special risk groups"},
         {tone:"amber", h:"👶 Children", html:"Doses by body weight from the BNFC tables — atovaquone-proguanil paediatric tablets, mefloquine by weight band. Doxycycline is unsuitable under 12 years. DEET up to 50% from 2 months of age. Store tablets out of reach — antimalarials are dangerous in overdose.", src:"UKHSA UKMEAG guidelines 2026 · BNFC"},
         {tone:"amber", h:"🧠 Epilepsy", html:"Mefloquine is contraindicated with a seizure history, and chloroquine should not be used in epilepsy. A history of febrile convulsions alone does not contraindicate any current agent. Mefloquine antagonises antiepileptic drugs. Atovaquone-proguanil or doxycycline are the usual choices; enzyme-inducing antiepileptics may lower doxycycline levels — check the BNF and UKMEAG Table 11.", src:"UKHSA UKMEAG guidelines 2026 — Special risk groups (Table 11)"},
         {tone:"amber", h:"🫀 Asplenia and immunosuppression", html:"People without a functioning spleen are at risk of severe malaria. Stress rigorous prophylaxis, bite prevention and same-day testing for fever; involve a travel-medicine specialist if the destination is high risk.", src:"UKHSA — Information for patients with an absent or dysfunctional spleen · UKMEAG guidelines 2026"},
         {tone:"blue", h:"🍼 Breastfeeding", html:"The small amounts of antimalarial in breast milk do not protect the baby — the infant needs their own prophylaxis and bite prevention. DEET is suitable; wash it off hands and breast skin before feeding.", src:"UKHSA UKMEAG guidelines 2026 — Special risk groups"},
         {tone:"blue", h:"🧳 Long-term travellers", html:"Atovaquone-proguanil: no evidence of harm in long-term use — confidently up to a year and beyond if tolerated (UKMEAG). Consider how the traveller will obtain supplies, and give clear fever advice for the whole stay.", src:"UKHSA UKMEAG guidelines 2026 — Special categories of travel"}
       ]}
     ]},

    {id:"interact", nav:"Interactions", title:"Interactions and practical prescribing points", sub:"The BNF interaction checker is the reference — these are the ones that come up in general practice.",
     blocks:[
       {b:"table", head:["Situation","Issue","Action"], rows:[
         ["<b>Warfarin</b>","The proguanil component of atovaquone-proguanil may enhance warfarin; diet and alcohol changes abroad also shift the INR","UKMEAG: INR stable and in range before departure, enough anticoagulant for the trip, and recheck the INR once prophylaxis is finished"],
         ["<b>Amiodarone</b>","Mefloquine: risk of ventricular arrhythmia","Contraindicated — use another agent"],
         ["<b>Antiepileptics</b>","Mefloquine lowers seizure threshold; enzyme inducers affect doxycycline","Avoid mefloquine; check doxycycline dosing in the BNF"],
         ["<b>Combined hormonal contraception</b>","Doxycycline is not enzyme-inducing","No additional contraceptive precautions needed for the antibiotic effect (FSRH drug interactions guidance)"],
         ["<b>Vomiting</b>","Missed absorption","Atovaquone-proguanil: repeat the dose if vomiting within 1 hour (SPC)"],
         ["<b>Oral typhoid vaccine (live)</b>","Antibacterials, including doxycycline, and some antimalarials inactivate it","Green Book: no antibacterials for 3 days before or after the oral vaccine; complete the oral course at least 3 days before mefloquine or other antimalarials; atovaquone-proguanil may be given at the same time. Or use the injectable vaccine"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"cream", h:"🩺 GP role", html:"Assess risk, give ABCD advice and record it, prescribe or signpost to a travel clinic or community pharmacy service, and — most importantly — make sure the fever message is heard and written down.", src:"UKHSA UKMEAG guidelines 2026 — Executive summary"},
         {tone:"cream", h:"📚 Where to check the detail", html:"UKMEAG country recommendations and TravelHealthPro (NaTHNaC) country pages for current advice; BNF and BNFC for doses and interactions; the SPC for each product.", src:"UKHSA UKMEAG guidelines 2026 · BNF · BNFC"}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — who, when, where", sub:"Pre-travel advice rarely needs a referral; the febrile returning traveller always needs same-day action.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same day — febrile returning traveller", html:"Fever or flu-like illness within a year of travel to a malaria area (especially within 3 months) → <b>same-day malaria films and/or RDT</b>, usually via acute medicine or the emergency department. Severe features → emergency admission.", src:"UKHSA UKMEAG guidelines 2026 — Diagnosis"},
         {tone:"purple", h:"Statutory — notify suspected malaria", html:"Notify the proper officer (UKHSA health protection team) on clinical suspicion, without waiting for laboratory confirmation.", src:"Health Protection (Notification) Regulations 2010 · UKHSA notifiable diseases guidance"},
         {tone:"amber", h:"Specialist travel-medicine advice", html:"Pregnancy with unavoidable travel to a high-risk area; young children to high-risk areas; asplenia or significant immunosuppression; complex itineraries or long stays; a traveller who cannot take any of the standard agents; anyone needing emergency standby treatment advice.", src:"UKHSA UKMEAG guidelines 2026 — Special risk groups"},
         {tone:"cream", h:"Manage in primary care or pharmacy", html:"Straightforward trips with a clear country recommendation and a traveller who can take a standard agent.", src:"UKHSA UKMEAG guidelines 2026"},
         {tone:"blue", h:"No NG12 criterion applies", html:"Malaria prevention does not map to a suspected-cancer referral criterion.", src:"NICE NG12 (updated April 2026)"}
       ]},
       {b:"say", html:"Think of it as four steps: know the risk where you’re going, stop the mosquitoes biting — especially from dusk — take the tablets exactly as written, including after you get home, and if you get a fever in the next year, get tested that day and mention the trip."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card; the Casebook holds full teaching cases.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 34-year-old man born in Nigeria is flying to Lagos in 5 days for a month-long family wedding. He says he ‘never gets malaria’ and didn’t take tablets last time. He had a depressive episode two years ago, and his wife, who is 10 weeks pregnant, wants to come too."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Explains <b>waning immunity</b> in VFR travellers without lecturing; checks the <b>country recommendation</b>; rules out <b>mefloquine</b> because of the depression history; offers <b>atovaquone-proguanil</b> (fits a 5-day lead time) or doxycycline with correct start and stop dates; addresses the <b>pregnancy</b> — advises against travel if possible, and explains the doxycycline 15-week limit and the atovaquone-proguanil-plus-folic-acid option; covers <b>DEET and nets</b>; gives the <b>fever-within-a-year</b> safety net in writing."}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Every recommendation above traces to one of these primary sources.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>UKHSA UK Malaria Expert Advisory Group (UKMEAG, formerly ACMP) — Malaria prevention guidelines for travellers from the UK 2026</b> (published 17 June 2026, updated July 2026)<br><a href="https://www.gov.uk/government/publications/malaria-prevention-guidelines-for-travellers-from-the-uk-2026" rel="noopener">gov.uk/government/publications/malaria-prevention-guidelines-for-travellers-from-the-uk-2026</a><span class="rd"> — ABCD framework; country recommendations; atovaquone-proguanil daily from 1–2 days before to 7 days after, long-term use up to a year and beyond; doxycycline 100 mg daily to 4 weeks after, unsuitable under 12; mefloquine 250 mg weekly from 2–3 weeks before to 4 weeks after, efficacy 90% or more; DEET up to 50% in pregnancy, breastfeeding and infants over 2 months; sunscreen before repellent; icaridin 20%; pregnancy (mefloquine in first trimester in high-risk areas, doxycycline finished before 15 weeks, atovaquone-proguanil with folic acid 5 mg); epilepsy (Table 11); consider malaria in illness within a year of return, especially 3 months; emergency standby treatment within 24 hours rule and Appendix 3 leaflet; Paludrine discontinuation notice</span></li>'+
