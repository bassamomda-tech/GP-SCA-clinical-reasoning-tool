  quickSub:"If you read nothing else on this page, read these six cards. Every figure traces to the source cited under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Decompensated — new or known HF — stops the routine pathway", html:"Severe breathlessness, pulmonary oedema, hypoxia below the patient's expected baseline, hypotension or hypoperfusion = suspected decompensation: same-day emergency assessment — not a 6-week echo. Also for new confusion, significant AKI, severe hyperkalaemia, severe arrhythmia, chest pain, syncope or failure of an agreed community diuretic plan — judged on the whole picture and local acute-HF pathway, not one number. And NYHA-grade every patient at every contact: I none · II on exertion · III minimal exertion · IV at rest."},
    {tone:"amber", h:"The BNP clock — and the false-normal that catches people out", html:"NT-proBNP &gt;2000 ng/L → specialist assessment + echo within 2 WEEKS. 400–2000 ng/L → within 6 weeks. &lt;400 ng/L → HF unlikely. But BNP reads falsely LOW in obesity, African or African-Caribbean family background, and in patients on diuretics, ACEi, ARBs, ARNIs, beta-blockers or MRAs — a “normal” BNP in a breathless obese patient does NOT exclude heart failure. It reads falsely high with age, AF, CKD, LVH, pulmonary hypertension, sepsis, PE and COPD — it is a diagnostic test in new suspected HF, not a routine serial monitor."},
    {tone:"blue", h:"All four pillars, offered to everyone with HFrEF", html:"NG106 (September 2025): offer all four pillars — an ACE inhibitor, a HF-licensed beta-blocker, an MRA and an SGLT2 inhibitor — to everyone with HFrEF as first-line therapy, titrating each to the maximally tolerated dose. The MRA is no longer an add-on reserved for EF ≤35% or persisting symptoms. Aim to introduce all appropriate classes early at tolerable doses, then titrate individually — accounting for frailty, BP, renal function, K⁺, rate and rhythm, comorbidity and preference."},
    {tone:"green", h:"The diuretic is NOT a pillar", html:"Furosemide 20–40 mg (bumetanide 1 mg ≈ 40 mg furosemide) relieves congestion and symptoms — unlike the four disease-modifying classes, without the same established mortality benefit. Keep it mentally separate: titrate pillars UP for prognosis; titrate the diuretic to the lowest dose that keeps the patient decongested. <b>There is no blanket dose-doubling rule</b> — increases are individualised with renal function checked after. <b>Never combine an ACE inhibitor + ARB + MRA together.</b>"},
    {tone:"amber", h:"Symptomatic hypotension? Reduce the DIURETIC first", html:"The commonest fix for dizziness or a systolic BP of 90–100 in a euvolaemic patient is reducing the diuretic, not the pillars — then stagger dosing times, and drop nitrates, alpha-blockers and calcium-channel blockers before touching a pillar. <b>Asymptomatic low BP needs NO action.</b> Likewise, on ACEi/ARB/ARNI titration a creatinine rise ≤30% or an eGFR fall ≤25% is acceptable if the patient is stable and other causes are excluded — recheck, don't stop (this threshold does not apply to every drug or context), and CKD is a reason for slower titration, not no titration."},
    {tone:"blue", h:"Two things routinely missed: iron, and the Hb gate", html:"Iron deficiency affects about 50% of heart-failure patients. Consider IV iron in symptomatic HFrEF with ferritin &lt;100 µg/L or TSAT &lt;20% AND Hb &lt;150 g/L — the haemoglobin trigger is easy to miss and it gates eligibility. IV iron improves symptoms and function (hospitalisation outcomes vary by trial); oral iron has not shown adequate benefit in HFrEF and is not a substitute. Still look for the cause of the deficiency (blood loss, GI disease, CKD). Recheck iron per HF status and local pathway."}
  ],
  pathwaySub:"The whole condition in five moves. The red step is the one that must not wait for imaging.",
  pathway:[
    {title:"Recognise decompensation before you start the diagnostic clock", html:"Severe breathlessness, pulmonary oedema, hypoxia below expected baseline, hypotension or hypoperfusion, new confusion, significant AKI, severe hyperkalaemia, severe arrhythmia or failure of the agreed diuretic plan → same-day emergency assessment (local acute-HF pathway), and routine titration stops. Chest pain or syncope → 999. NYHA-grade at every contact.", alert:true},
    {title:"Set the echo clock and split the phenotype", html:"NT-proBNP &gt;2000 → echo and specialist assessment within 2 weeks; 400–2000 → within 6 weeks; &lt;400 → look elsewhere, but beware the false-lowerers. HFrEF (LVEF ≤40%) → offer all four pillars. HFmrEF (41–49%) → consider the same four classes. HFimpEF (was ≤40%, now higher) → continue prognostic therapy. HFpEF (≥50%, plus objective structural/functional abnormality and compatible natriuretic peptide) → consider an MRA and an SGLT2 inhibitor, plus a diuretic for congestion, and hunt the comorbidities. Baseline: ECG, CXR, U&amp;E, FBC, LFT, TFT, HbA1c, lipids, ferritin + TSAT, urinalysis (ACR where CKD possible). Diuretic may start before the echo if congested, with monitoring."},
    {title:"Lay the foundations that prevent admissions", html:"Daily weights with an agreed action trigger (e.g. +2 kg over 3 days) · cardiac rehab referral for everyone stable · avoid excess salt but no routine sodium or fluid restriction, minimal alcohol · stop the saboteurs (NSAIDs including OTC, pioglitazone, verapamil, diltiazem) · flu, pneumococcal and COVID vaccination · screen mood · a written HF plan with sick-day rules."},
    {title:"Build all four pillars, then titrate — fixing obstacles rather than stopping", html:"ACE inhibitor, HF-licensed beta-blocker, MRA and SGLT2 inhibitor at low dose within weeks, then up-titrate every 2–4 weeks. U&amp;E and K⁺ 1–2 weeks after every RAAS or MRA change; clinical review within 2 weeks of any change (QS9). Hypotension → reduce the diuretic first if euvolaemic. Rising K⁺ → stop K⁺-raisers and act per SPC/local protocol. Bradycardia → reduce the beta-blocker last. RAAS creatinine rise ≤30% → acceptable if stable and other causes excluded."},
    {title:"Review, re-check iron, and plan ahead", html:"Review within 2 weeks of medication changes and at least 6-monthly when stable (QS9; HF nurse ideal): pillars at target? adherence? rehab done? devices discussed? advance care conversation started? Iron, FBC and HbA1c per clinical status and diabetes. Decompensating but walking and talking → increase the loop diuretic per the individualised plan, U&amp;E in 3–5 days, review at 48 hours, keep the beta-blocker going."}
  ],

    {id:"lifestyle", nav:"Foundations", title:"Self-management — the admission-preventers", sub:"These are treatment, not advice. Daily weights are an important early-warning tool.",
     blocks:[
       {b:"cards", items:[
         {tone:"green", h:"⚖️ Daily weights", html:"Same scales, same time, after voiding. An agreed action trigger (e.g. +2 kg over 3 days) = ring the practice or HF nurse — often an early signal, though not a diagnostic threshold."},
         {tone:"green", h:"🏃 Cardiac rehab", html:"<b>Refer everyone stable</b> — improves symptoms, exercise capacity and quality of life."},
         {tone:"green", h:"🧂 Salt, fluid, alcohol", html:"Avoid excess salt, but NICE NG106 advises <b>against routine sodium or fluid restriction</b> — individualise only for hyponatraemia, recurrent congestion or advanced CKD; alcohol minimal — zero if alcohol cardiomyopathy."},
         {tone:"red", h:"🚫 The saboteurs", html:"<b>NSAIDs (including OTC), pioglitazone, verapamil and diltiazem</b>, flecainide in structural disease; <b>potassium supplements and K⁺-containing salt substitutes</b> alongside ACEi/ARB/ARNI + MRA; caution with <b>pregabalin (oedema)</b> and <b>corticosteroids (fluid)</b>."},
         {tone:"blue", h:"💉 Vaccines", html:"<b>Flu yearly, pneumococcal once, COVID per schedule.</b>"},
         {tone:"cream", h:"🧠 Mood and the written plan", html:"Depression is common and kills adherence — screen for it. Written HF plan: who to call, the weight rules, sick-day rules. <b>Diuretic self-adjustment only within an agreed plan</b> — the dose range, the trigger (weight up or ankles swelling), how long the higher dose runs, when bloods are due, and who to ring. Breathless at rest, chest pain or palpitations are never self-managed: breathlessness can be pneumonia, PE, ACS or arrhythmia."}
       ]}
     ]},

    {id:"pillars", nav:"Four pillars", title:"HFrEF — all four on board, then titrate to target", sub:"Doses are named for orientation; verify every one against the current SPC and the GM HF toolkit.",
     blocks:[
       {b:"why", html:"NG106 (September 2025 update): offer all four pillars — ACEi, a HF-licensed beta-blocker, an MRA and an SGLT2 inhibitor — to everyone with HFrEF as first-line therapy, and titrate each to the maximally tolerated dose. MRA is no longer an add-on reserved for EF ≤35% or persisting symptoms. Introduce all appropriate classes early at tolerable doses, then titrate individually as BP, HR, renal function, K⁺, congestion and preference allow. Still symptomatic on maximally tolerated doses of all four → consider switching the ACE inhibitor to an ARNI."},
       {b:"ladder", steps:[
         {step:"Pillar 1", title:"ACE inhibitor (ARB if cough) — ARNI where indicated", when:"day one", fromLabel:"start here",
          html:"<b>Ramipril 1.25–2.5 mg → target 10 mg</b> (or <b>candesartan 4–8 mg → 32 mg</b>). U&amp;E + K⁺ 1–2 weeks after every step. A creatinine rise ≤30% or eGFR fall ≤25% on RAAS blockade is acceptable if stable and other causes excluded — recheck, don't stop. Start an ACEi unless the HF team recommends an ARNI pathway. Persisting symptoms on maximum tolerated four-drug therapy → <b>consider switching to an ARNI</b>; ACEi intolerance other than angioedema → <b>ARNI (sacubitril/valsartan, per SPC)</b> with the other three. <b>After ACEi angioedema, no ARNI</b> — beta-blocker, MRA and SGLT2 inhibitor, and consider an ARB. <b>Never co-prescribe an ACE inhibitor and an ARNI; stop the ACEi at least 36 hours before the first ARNI dose</b> (angioedema risk)."},
         {step:"Pillar 2", title:"HF-licensed beta-blocker", when:"stable, not congested", fromLabel:"start alongside, titrate alternately",
          html:"<b>Bisoprolol 1.25 → 10 mg</b>, carvedilol 3.125 mg BD → 25–50 mg BD, or nebivolol (elderly). <b>Double no faster than 2-weekly.</b> Warn: “you may feel more tired for the first fortnight — that's the drug working, it passes.” Start and titrate only when stable and not significantly congested. Continue an established beta-blocker through worsening HF where possible; consider temporary reduction or withholding in cardiogenic shock, severe hypotension, symptomatic bradycardia or high-grade heart block."},
         {step:"Pillar 3", title:"MRA", when:"everyone with HFrEF — not just EF ≤35%", fromLabel:"the forgotten pillar — don't skip it",
          html:"<b>Spironolactone 25 → 50 mg</b> (eplerenone 25 → 50 mg if gynaecomastia or post-MI). Renal function and K⁺ before, 1–2 weeks after starting and after each dose increase, then every 3–6 months (NICE). Rising K⁺ or falling renal function → reduce or withhold per SPC and the local HF protocol; avoid K⁺ supplements, K⁺ salt substitutes, trimethoprim, NSAIDs and dehydration. Warn about gynaecomastia and menstrual change."},
         {step:"Pillar 4", title:"SGLT2 inhibitor", when:"everyone, diabetic or not", fromLabel:"no titration — the easy pillar",
          html:"<b>Dapagliflozin 10 mg or empagliflozin 10 mg OD.</b> No titration. Expect a small early creatinine dip — don't stop. Check eGFR against the product licence. <b>Safety:</b> volume depletion with a loop diuretic (review the diuretic dose); genital infection — hygiene counselling; <b>euglycaemic DKA</b> — pause during acute illness, vomiting or diarrhoea, prolonged fasting or surgery and if DKA is suspected (check ketones even with a normal glucose); avoid in type 1 diabetes or previous DKA unless specialist-directed; in diabetes, review insulin or sulfonylurea doses for hypoglycaemia."}
       ]},
       {b:"warn", html:"<b>The diuretic is not a pillar.</b> <b>Furosemide 20–40 mg (bumetanide 1 mg ≈ 40 mg furosemide)</b> relieves congestion and symptoms — unlike the four disease-modifying classes, without the same established mortality benefit. There is no blanket dose-doubling rule: increases are individualised, with renal function checked after. Keep it mentally separate: titrate pillars UP for prognosis, and titrate the diuretic to the lowest dose that keeps them decongested (a flexible self-adjustment plan for capable patients). <b>Never ACEi + ARB + MRA together.</b>"}
     ]},

    {id:"obstacles", nav:"Titration", title:"Every titration obstacle has a fix that is not “stop the pillar”", sub:"This table is where most under-treatment in UK primary care is generated.",
     blocks:[
       {b:"table", head:["Titration obstacle","Looks like","Fix — don't just stop the pillar"], rows:[
         ["<b>Symptomatic hypotension</b>","Dizzy, BP &lt;90–100 systolic","Stagger dosing times; reduce the DIURETIC first if euvolaemic (the commonest fix); drop nitrates, alpha-blockers and CCBs before touching pillars; asymptomatic low BP needs NO action"],
         ["<b>Bradycardia</b>","HR &lt;50 on a beta-blocker","ECG (block?); review other rate-limiting drugs (diltiazem; digoxin may still be needed for rate control or symptoms); reduce the beta-blocker LAST"],
         ["<b>K⁺ 5.5–5.9</b>","On ACEi + MRA","Stop K⁺-raisers (trimethoprim, NSAIDs, K⁺ supplements, salt substitutes), check for dehydration or AKI, recheck; MRA reduction or withholding per SPC and local HF protocol; ≥6.0 → urgent assessment (repeat, ECG, local hyperkalaemia protocol). Potassium binders are specialist or shared-care initiated"],
         ["<b>Creatinine climbing</b>","eGFR falling on titration","On ACEi/ARB/ARNI a rise ≤30% is acceptable when stable. Any rise → assess for hypovolaemia or over-diuresis, hypotension, NSAIDs, obstruction, sepsis, renal artery stenosis and worsening congestion (cardiorenal) — the threshold does not apply to every drug or context. CKD is a reason for SLOWER titration, not no titration"],
         ["<b>“Feels worse” on the beta-blocker</b>","Fatigue in weeks 1–2","<b>Expected and transient — pre-warned patients persist; don't abandon it</b>"]
       ]}
     ]},

    {id:"beyond", nav:"Beyond", title:"Still symptomatic on four pillars — what the HF team adds", sub:"Escalation is specialist-initiated, but knowing the menu makes the referral useful.",
     blocks:[
       {b:"kv", rows:[
         ["ARNI switch","Consider switching the ACEi to sacubitril/valsartan if symptoms persist on maximum tolerated four-drug therapy (36-hour washout from the ACEi); not after ACEi angioedema"],
         ["Ivabradine","Specialist-led (NICE TA267): stable chronic HF, <b>sinus rhythm, resting HR ≥75, LVEF ≤35%</b>, persisting symptoms, on (or unable to take) a beta-blocker"],
         ["IV iron","Consider in symptomatic HFrEF with iron deficiency (<b>ferritin &lt;100 µg/L or TSAT &lt;20%</b>) <b>and Hb &lt;150 g/L</b> — the haemoglobin trigger is easy to miss and it gates eligibility. IV iron improves symptoms and function; oral iron has not shown adequate benefit in HFrEF and is not a substitute; investigate the cause of the deficiency"],
         ["Devices","Specialist device-referral prompts, not GP rules: EF ≤35% despite about 3 months of optimal therapy → ICD discussion (aetiology, arrhythmia history, prognosis, preference); broad QRS/LBBB → CRT assessment (eligibility depends on LVEF, QRS, morphology, rhythm, NYHA class and pacing needs)"],
         ["Digoxin and others","<b>Symptom add-on, especially AF + HF; also hydralazine/nitrate</b> (Afro-Caribbean patients, or renal intolerance of RAAS blockade)"],
         ["AF + HF","Rate control with the beta-blocker (avoid verapamil or diltiazem in HFrEF unless specialist-directed); assess stroke and bleeding risk per NICE AF guidance and the local anticoagulation pathway (see the <a href='atrial-fibrillation.html'>AF protocol</a>); a rhythm strategy is a specialist decision — AF-mediated cardiomyopathy can be reversible"]
       ]}
     ]},

    {id:"hfpef", nav:"HFpEF", title:"HFpEF — a different disease, a different plan", sub:"The comorbidity list IS the treatment list.",
     blocks:[
       {b:"kv", rows:[
         ["What NG106 now says","<b>Consider an MRA AND an SGLT2 inhibitor</b> for treating HFpEF (NICE NG106, September 2025). <b>Loop diuretic on top, for congestion only.</b>"],
         ["Read it as “consider”, not “offer”","A shared-decision conversation alongside treating congestion and comorbidities. ACEi, ARBs, ARNIs and beta-blockers are used when there is another indication (hypertension, AF, previous MI, angina) rather than for HFpEF itself."],
         ["The real work","Treat what's driving it: hypertension to target, AF, obesity (weight loss genuinely improves HFpEF), diabetes, an OSA screen, CKD"],
         ["Think amyloid","Elderly + LVH + carpal tunnel history ± low-voltage ECG → cardiology (specialist amyloid pathway)"]
       ]},
       {b:"why", html:"HFpEF is stiff-heart disease driven by metabolic and vascular comorbidity — which is why the comorbidity list IS the treatment list, and why the GP (who owns the BP, the weight, the diabetes) matters more than any referral."}
     ]},

    {id:"monitor", nav:"Monitor", title:"Monitoring rhythm and community decompensation", sub:"Trend beats snapshot — and most decompensation can be handled at home if it is caught early.",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["<b>U&amp;E + K⁺</b>","Before, then 1–2 weeks after every RAAS or MRA start or dose change; then every 3–6 months when stable","Thresholds per the <a href='#obstacles'>obstacle table</a>"],
         ["<b>Weight + NYHA + BP/HR</b>","Every contact","<b>Trend beats snapshot</b>"],
         ["<b>Ferritin/TSAT + FBC</b> (HbA1c per diabetes status)","Per HF severity, prior deficiency and local pathway","<b>Iron deficiency meeting NICE criteria → IV iron referral</b>"],
         ["<b>Structured review</b>","<b>Within 2 weeks of any medication change, then at least 6-monthly (QS9; HF nurse ideal)</b>","Pillars at target? Adherence? Rehab done? Devices discussed? Advance care conversation started?"],
         ["<b>Decompensating in the community</b>","Weight up, orthopnoea, oedema — but walking, talking and SpO₂ OK","Increase the loop diuretic per the person's individualised self-management plan, or on HF-nurse or specialist advice — there is no “always double it” rule, and the safe increment depends on the current dose, renal function and how dry they already are. Then U&amp;E in 3–5 days, review at 48 hours; keep the beta-blocker going; involve the HF nurse the same week. No response or worse → same-day assessment via the local acute-HF pathway"],
         ["<b>Same-day emergency assessment</b>","Severe breathlessness or pulmonary oedema, hypoxia below baseline, hypotension or hypoperfusion, new confusion, significant AKI, severe hyperkalaemia, severe arrhythmia, chest pain, syncope, failure of the agreed diuretic plan","<b>Same day</b> — routine titration stops. <b>Do not start or up-titrate a beta-blocker</b> (continue an established one where possible; reduce or withhold in shock, severe hypotension, symptomatic bradycardia or high-grade block); hold ACEi/ARB/ARNI/MRA if hypotensive, in AKI or K⁺ ≥6.0 — on acute advice"]
       ]},
       {b:"say", html:"You have four different tablets because each one protects the heart in a different way. The water tablet is different: that one just controls the fluid, and you'll learn to adjust it yourself using the scales. The single most useful thing you can do is weigh yourself every morning."}
     ]},

    {id:"loop", nav:"Still symptomatic?", title:"Still symptomatic? Check these before calling it refractory", sub:"Most “refractory” HF is under-titration, congestion, iron, or an untreated driver.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"1 · Pillars at target?", html:"All four ON and titrated to target or maximum tolerated — not just started? (The commonest gap in UK primary care.)"},
         {tone:"amber", h:"2 · Actually dry?", html:"JVP, oedema, weight trend — hidden congestion is a common cause of persistent breathlessness."},
         {tone:"amber", h:"3 · Iron checked?", html:"<b>Ferritin &lt;100 or TSAT &lt;20% with Hb &lt;150 g/L in HFrEF → consider IV iron.</b> Checked as part of the structured HF review, per HF status and local pathway?"},
         {tone:"amber", h:"4 · A driver untreated?", html:"AF rate or rhythm, ischaemia (angina? → cardiology assessment guided by symptoms and pre-test probability), valve disease progressing, thyroid, anaemia, NSAID creep, alcohol."},
         {tone:"amber", h:"5 · The lungs?", html:"<b>COPD overlap, PE, effusion — not all breathlessness is the heart.</b>"},
         {tone:"amber", h:"6 · Right phenotype?", html:"Repeat the echo if the trajectory changed — EF recovers (stand down nothing without advice) or falls (devices territory)."}
       ]},
       {b:"why", html:"All optimised → HF team: ARNI, ivabradine, devices or advanced therapies."}
     ]},

    {id:"safety", nav:"Safety-net", title:"What the patient must know", sub:"Four sentences that prevent most avoidable admissions.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"⚖️ Your weight trigger", html:"“If your weight goes up by the amount on your plan (often 2 kg in 3 days) → ring us or the heart-failure nurse — don't wait for breathlessness.”"},
         {tone:"red", h:"🔴 Same day", html:"“Breathless at rest or lying flat, waking gasping, new confusion, passing much less urine or swelling fast — same-day call; chest pain or fainting — 999.”"},
         {tone:"blue", h:"🤢 Sick-day rules", html:"“If you're vomiting, have diarrhoea or can't eat or drink, contact us or the heart-failure team. The ‘flozin’ is usually paused; we'll tell you what to do with the other tablets depending on your blood pressure, fluid and blood tests. Don't drink extra if you're swollen or on a fluid limit, and never stop insulin without diabetes advice. Restart once you're well and eating and drinking normally — after a blood test if you were very unwell.”"},
         {tone:"cream", h:"💊 Painkillers", html:"“No ibuprofen-type drugs — they undo the water tablet and strain the kidneys. Paracetamol is fine.”"}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"HF team, cardiology — and the palliative conversation", sub:"Referral is routine here; the parallel palliative conversation is the one most often left too late.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"Every new diagnosis", html:"Specialist confirmation + a pillar plan (within 2 weeks if NT-proBNP &gt;2000); community HF nurse from day one."},
         {tone:"blue", h:"Escalation", html:"Symptomatic on maximally tolerated doses of all four pillars → consider ARNI switch, then specialist options (ivabradine, digoxin); EF ≤35% at about 3 months → device assessment (ICD/CRT eligibility is a specialist decision). <b>Kidneys or K⁺ blocking the pillars</b> → HF team (potassium binders via shared care). Suspected pulmonary hypertension → cardiology."},
         {tone:"blue", h:"Cause needs fixing", html:"Ischaemia → cardiology assessment (investigation guided by symptoms, pre-test probability and revascularisation considerations); significant valve disease → intervention MDT; suspected amyloid or familial cardiomyopathy → specialist clinic (+ family screening)."},
         {tone:"amber", h:"Recurrent admissions", html:"Two or more in 6 months despite optimisation → advanced HF assessment — and trigger the parallel palliative conversation."},
         {tone:"cream", h:"Palliative parallel planning", html:"Palliative care can start at any stage alongside active care — triggered by trajectory, goals and reversibility rather than NYHA IV alone: anticipatory care plan, ICD deactivation discussed with the device team, carefully monitored opioids for breathlessness, hospice support — alongside, not instead of, HF care. See the <a href='palliative-pain.html'>palliative pain protocol</a>."},
         {tone:"purple", h:"NG12 — stated honestly <span class='tw'>Suspected cancer</span>", html:"Heart failure has no NICE NG12 criterion of its own, and this page does not invent one. But two NG12 routes overlap with this presentation and must not be lost:<br>• Aged 40 and over with 2 or more unexplained symptoms from cough, fatigue, shortness of breath, chest pain, weight loss and appetite loss — or 1 or more if they have ever smoked → offer an urgent chest X-ray (within 2 weeks) for suspected lung cancer; chest signs consistent with lung cancer or pleural disease → consider one. Breathlessness attributed to HF on clinical grounds, with a normal BNP or an unconvincing echo, still needs this considered.<br>• Unexplained weight loss with other trigger symptoms → the relevant urgent suspected-cancer pathway. Cardiac cachexia is a recognised feature of advanced HF, but it must not be the default explanation for weight loss in a patient whose HF is otherwise stable.", src:"NICE NG12 (updated April 2026)"}
       ]},
       {b:"say", html:"I want the heart-failure team involved — not because you're at the end of the road, but because the next treatments (a newer tablet, possibly a special pacemaker) are theirs to start. We keep doing the day-to-day together — and the weighing scales remain your best early-warning system."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 71-year-old man with HFrEF (EF 32%) attends for review. He is on ramipril 2.5 mg, bisoprolol 2.5 mg and furosemide 40 mg, started eight months ago and never changed. He is NYHA III, says he feels “a bit dizzy standing up”, and his ankles are not swollen. His last U&amp;E was six months ago. He asks whether he can have “something stronger for the breathlessness”."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Recognises this as <b>under-titration, not refractory HF</b>: two pillars missing entirely (<b>MRA and SGLT2 inhibitor, both offered in HFrEF</b>) and the other two far below target; handles the dizziness correctly by reducing the diuretic first in a euvolaemic patient rather than the pillars; plans individual titration with U&amp;E and K⁺ 1–2 weeks after each RAAS or MRA change and review within 2 weeks; checks <b>ferritin and TSAT with the Hb &lt;150 g/L gate</b>; refers to <b>cardiac rehab</b>; teaches an <b>agreed weight trigger and individualised sick-day advice</b>; screens <b>mood</b>; and reviews for <b>NSAID creep</b>."}
     ]}]},

         '<li>NICE QS9 \u2014 Chronic heart failure in adults (quality standard)<br><a href="https://www.nice.org.uk/guidance/qs9" rel="noopener">nice.org.uk/guidance/qs9</a><span class="rd"> \u2014 review within 2 weeks of a medication change and at least 6-monthly</span></li>'+
         '<li>NICE TA267 \u2014 Ivabradine for treating chronic heart failure<br><a href="https://www.nice.org.uk/guidance/ta267" rel="noopener">nice.org.uk/guidance/ta267</a><span class="rd"> \u2014 ivabradine eligibility (specialist-led)</span></li>'+

         '<li>Current SPCs \u2014 ramipril, sacubitril/valsartan, spironolactone, eplerenone, dapagliflozin, empagliflozin<br><a href="https://www.medicines.org.uk/emc" rel="noopener">medicines.org.uk/emc</a><span class="rd"> \u2014 dosing, potassium and renal thresholds, ARNI washout</span></li>'+

  foot:"Heart failure in adults \u2014 NICE NG106, incorporating the September 2025 update (all four pillars offered in HFrEF; MRA + SGLT2i considered in HFpEF; mildly reduced EF treated pharmacologically) with ESC 2023 concepts, and NICE NG12 (updated April 2026) for the overlapping urgent-cancer routes. Diagnosis and management are on this one page; heart failure has no separate diagnostic algorithm. Verify doses against the current BNF before prescribing."
