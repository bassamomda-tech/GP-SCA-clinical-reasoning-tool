  quickSub:"If you read nothing else on this page, read these six cards. Every number traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Every boy is referred urgently — even with a normal examination", html:"Precocious puberty in boys is much more likely to have a pathological cause, including an intracranial lesion, so refer every boy urgently regardless of examination findings. In girls it is usually idiopathic central precocious puberty, so <b>urgency depends on red flags</b> — but every child is still referred."},
    {tone:"red", h:"This can be the first sign of a brain lesion", html:"New headaches, visual disturbance or signs of raised intracranial pressure → urgent referral, flagged clearly. A neurological examination including fundoscopy and visual fields is mandatory in the primary-care assessment, because central precocious puberty is driven in a proportion of children — especially boys — by a hypothalamic hamartoma, glioma or the sequelae of cranial irradiation."},
    {tone:"amber", h:"The growth chart is your highest-value contribution", html:"<b>Plotting serial growth is the single most useful primary-care step.</b> A pubertal growth spurt crossing ≥1 centile space in 3–6 months supports true progressive precocious puberty and adds urgency, whereas isolated breast development or pubic hair with a normal growth velocity is often a benign variant. Use the <b>RCPCH UK-WHO growth charts</b>, and add earlier measurements from the personal child health record or school nurse to turn a single plot into a velocity."},
    {tone:"blue", h:"Definition — and what counts in each sex", html:"Secondary sexual characteristics before age 8 in girls and before age 9 in boys. The first sign is usually breast development in girls and testicular enlargement (4 mL or more) in boys. Girls: progressive breast enlargement before 8 (especially with upward centile crossing), clitoromegaly, or menarche before 8. Boys: penile growth or testicular enlargement before 9 — and examine for a testicular mass. Vaginal bleeding without breast development is not early menarche."},
    {tone:"blue", h:"Central, peripheral, or a benign variant", html:"<b>Central (gonadotrophin-dependent):</b> early HPG-axis activation — idiopathic (commonest in girls), intracranial lesion, post-CNS insult; follows the normal pubertal sequence. <b>Peripheral (gonadotrophin-independent):</b> CAH, adrenal or gonadal tumour, McCune-Albright, exogenous steroids; <b>may be out of sequence</b>. <b>Benign variants:</b> premature thelarche and premature adrenarche — non-progressive, but still assessed. In boys, testicular size is the bedside discriminator: both testes enlarge in central puberty, not with an adrenal or exogenous androgen source."},

    {title:"Examine and plot", html:"Tanner staging, height and weight (and growth velocity where possible) on a growth chart, full neurological examination with fundoscopy and visual fields, abdomen, testicular volume and lumps in boys, skin for café-au-lait macules, thyroid status and BP. Record parental heights. Document staging in words and numbers — do not photograph the child."},
    {title:"Refer — all children, urgency by sex and red flags", html:"All boys urgently. Girls urgently if any red flag, clitoromegaly, menarche before 8, or progressive breast development before 8 with centile crossing; otherwise routine. <b>Highlight red flags in the letter.</b>"},

         ["<b>Polyuria and polydipsia</b>","Possible pituitary or hypothalamic cause — for example cranial diabetes insipidus from a hypothalamic lesion","<b>Urgent paediatric referral</b>"],
         ["<b>Newly abnormal cerebellar or other central neurological function</b> — papilloedema, visual field loss, new squint, ataxia","<b>Possible brain or CNS tumour</b>","<b>NICE NG12 (updated April 2026): consider very urgent referral (appointment within 48 hours)</b>; same-day paediatric assessment if raised intracranial pressure"],
         ["<b>History of CNS disorder or injury</b>","CNS trauma, meningitis, hydrocephalus, cranial irradiation, hypoxic-ischaemic injury, neurofibromatosis — all raise the risk of central precocious puberty","<b>Urgent paediatric referral</b>"],
         ["<b>Rapid growth crossing ≥1 centile space in 3–6 months</b>","<b>Supports true progressive precocious puberty and adds urgency</b>","<b>Urgent paediatric referral</b>"],

         ["<b>Rapid progression</b> — moving through Tanner stages within months, or menarche before 8","<b>A strong sex-steroid drive</b>","<b>Urgent paediatric referral</b> in either sex"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"purple", h:"🟣 NICE NG12 — very urgent (48 hours) brain and CNS route", html:"In a child or young person with newly abnormal cerebellar or other central neurological function, consider a very urgent referral (for an appointment within 48 hours) for suspected brain or central nervous system cancer. Early puberty plus a new neurological sign meets this criterion — write that it is met in the referral. Repeated in <a href=\'#refer\'>Refer</a>.", src:"NICE NG12 (updated April 2026) — children and young people, brain and CNS"},
         {tone:"red", h:"Safeguarding — isolated vaginal bleeding", html:"Vaginal bleeding in a young girl without breast development is not puberty. Consider trauma, a foreign body, infection, a tumour and McCune-Albright ovarian cysts — and sexual abuse. Follow local child-protection procedures alongside the medical referral.", src:"Bradley et al., BMJ 2020;368:l6597 · Working Together to Safeguard Children 2023"}
       ]},
       {b:"warn", html:"Every boy with precocious puberty is referred urgently — pathology, including intracranial causes, is much more likely than in girls. In both sexes, new headache, visual change or raised-ICP signs point to an intracranial cause and must be flagged in the referral."},
       {b:"why", html:"Central precocious puberty results from early activation of the hypothalamic-pituitary-gonadal axis, which in a proportion of children — especially boys — is driven by an intracranial lesion such as a hypothalamic hamartoma, glioma, or the sequelae of cranial irradiation or hydrocephalus. That is why a neurological examination with fundoscopy and visual fields, and attention to headache or raised-ICP features, is mandatory in the primary-care assessment."},
       {b:"dl", rows:[
         ["<b>NG12 — the paediatric criterion that applies here</b>","NICE NG12 children and young people: consider a very urgent referral (for an appointment within 48 hours) for suspected brain or central nervous system cancer in a child or young person with newly abnormal cerebellar or other central neurological function. Precocious puberty with new neurological signs, visual field loss, papilloedema on fundoscopy or raised-ICP features meets that criterion, and the referral should say so explicitly rather than going as a routine endocrine letter. Separately, <b>a testicular mass warrants urgent referral in its own right</b> — the source notes it may follow a urological rather than endocrine pathway. Precocious puberty itself, without neurological signs or a mass, has no NG12 criterion and none should be invented for one. The children\u2019s recommendations are unchanged in the April 2026 update"]
       ]}
     ]},

    {id:"confirm", nav:"Recognise", title:"Recognising precocious puberty, and the causes",
     blocks:[
       {b:"dl", rows:[
         ["<b>Definition</b>","Onset of secondary sexual characteristics before age 8 in girls and before age 9 in boys (Bradley et al., BMJ 2020). The first sign is breast development (thelarche) in girls and testicular enlargement in boys"],
         ["<b>Girls — features</b>","Progressive breast enlargement before 8 (a firm, often tender disc under the areola — Tanner B2 — especially with upward height-centile crossing), clitoromegaly, or menarche before 8. Palpate to separate true breast tissue from fat (lipomastia)"],
         ["<b>Boys — features</b>","Penile growth or testicular enlargement before 9 — a volume of 4 mL or more on an orchidometer, or a length over 2.5 cm, marks the start of gonadal puberty. Examine for a testicular mass or lump"],
         ["<b>Boys — the testicular clue</b>","Both testes enlarged with virilisation → central (gonadotrophin-driven). Prepubertal-size testes with virilisation → an adrenal source, CAH or exogenous androgen. One enlarged testis → a Leydig cell tumour until proven otherwise"],
         ["<b>Exposure history</b>","Ask directly whether a parent or carer uses testosterone gel: the MHRA (Drug Safety Update, January 2023) reported a child with increased growth and genital enlargement after repeated accidental skin-to-skin transfer. Also oestrogen creams, HRT gels and supplements"],
         ["<b>History</b>","Age and sequence of changes (true puberty follows an order); rate of progression; growth spurt; headache, visual symptoms, vomiting, polyuria and polydipsia; behaviour and mood change; exogenous sex-steroid exposure (creams, gels, supplements); body odour and acne; perinatal and CNS history (irradiation, infection, trauma, hydrocephalus); family age of puberty and any family history of CAH"]
       ]},
       {b:"table", head:["Cause group","Detail"], rows:[
         ["<b>Central (gonadotrophin-dependent)</b>","Early HPG-axis activation: idiopathic (commonest in girls), intracranial lesions (hypothalamic hamartoma, glioma), post-CNS insult. Follows a normal pubertal sequence"],
         ["<b>Peripheral (gonadotrophin-independent)</b>","Sex steroids from elsewhere: congenital adrenal hyperplasia, adrenal or gonadal tumours, McCune-Albright (autonomous ovarian cysts), hCG-secreting germ cell tumours in boys, exogenous steroids. May be out of normal sequence — for example virilisation in a girl, or pubic hair before testicular growth in a boy"],
         ["<b>Benign normal variants</b>","Premature thelarche (isolated breast development, most often in the first two years of life, normal growth, no progression) and premature adrenarche (pubic or axillary hair and body odour from adrenal androgens, no breast or testicular development, no rapid growth) — non-progressive; still need assessment to confirm"],
         ["<b>Don't forget</b>","Severe primary hypothyroidism — the paradox of pubertal signs with SLOW growth, which resolves with levothyroxine. McCune-Albright — café-au-lait macules with irregular borders, fibrous dysplasia of bone, and recurrent vaginal bleeding from ovarian cysts"]
       ]},
       {b:"why", html:"Distinguishing central from peripheral precocious puberty determines treatment: central is treated with a <b>GnRH analogue</b> to switch the axis back off and protect adult height and psychosocial wellbeing, whereas <b>peripheral causes require treatment of the source</b> — a tumour, CAH. The benign variants need recognition so that children are reassured and monitored rather than over-investigated, but the initial referral remains appropriate because the distinction is a specialist one — and a proportion of apparent premature thelarche goes on to progress."}
     ]},

    {id:"differential", nav:"Differential", title:"Differential diagnosis — bedside patterns for the referral letter",
     sub:"Pointers that shape the urgency and the letter. None of them replaces the specialist assessment.",
     blocks:[
       {b:"table", head:["Condition","Discriminating features","Next step"], rows:[
         ["<b>Premature thelarche</b>","Breast development only, usually under 2–3 years, normal growth velocity, no progression, no pubic hair","Routine referral for confirmation; usually monitored rather than treated. Re-plot growth"],
         ["<b>Premature adrenarche</b>","Pubic or axillary hair and body odour only; no breast or testicular development; normal growth","Routine referral. Virilisation, clitoromegaly or rapid growth instead suggests CAH or a tumour → urgent"],
         ["<b>Central precocious puberty</b>","Ordered progression through the normal sequence with a growth spurt; in boys both testes enlarge","Girls: usually idiopathic — urgency by red flags. Boys: a cause is more often found — always urgent"],
         ["<b>Peripheral precocious puberty</b>","Out of sequence or virilising; in boys virilisation with prepubertal-size testes, or one enlarged testis","Urgent referral; examine the abdomen and testes; ask about gels and creams"],
         ["<b>Exogenous sex steroid</b>","Parent or carer uses testosterone or oestrogen gel; genital enlargement or breast development with no other cause","Stop the transfer (cover the site, wash hands, avoid skin contact) and refer; changes may regress"],
         ["<b>Hypothyroidism</b>","Pubertal signs with slowing growth; hypothyroid features","TFTs in primary care, and refer"],
         ["<b>McCune-Albright syndrome</b>","Café-au-lait macules with irregular borders, fibrous dysplasia, recurrent vaginal bleeding","Urgent paediatric endocrinology"],
         ["<b>Intracranial lesion</b>","Headache, vomiting, visual field loss, papilloedema, squint, polyuria and polydipsia, CNS history","NICE NG12 very urgent (48-hour) route if newly abnormal central neurological function; same day if raised ICP"],
         ["<b>Non-pubertal vaginal bleeding</b>","Bleeding without breast development","Urgent assessment and safeguarding procedures"],
         ["<b>Lipomastia</b>","Soft fatty tissue without a firm subareolar disc, usually with overweight","Reassure if clearly fat and growth is normal; refer if in doubt"]
       ]},
       {b:"why", html:"In boys the testes are the best bedside discriminator, because gonadotrophins enlarge both testes while adrenal and exogenous androgens virilise without testicular growth. Parental heights put the child\u2019s own centile in context — a tall child of tall parents is less concerning than one crossing upwards away from the family centile. These patterns belong in the referral letter; they are not a diagnosis to act on alone."}
     ]},

    {id:"workup", nav:"Assess", title:"Examination, growth plotting, and what the specialist will do",
     sub:"Mostly refer rather than test — but the examination and the growth chart are yours.",
     blocks:[
       {b:"table", head:["Assessment","Detail"], rows:[
         ["<b>Examination</b>","Tanner staging; plot height, weight and (where possible) growth velocity; full neurological examination with fundoscopy and visual fields; abdominal examination; testicular volume and lumps in boys; skin for café-au-lait macules; thyroid status and blood pressure; parental heights to estimate the target centile. In boys the testicular examination directs the work-up: asymmetric enlargement suggests a tumour, whereas bilateral enlargement suggests central activation"],
         ["<b>Growth velocity</b>","A pubertal growth spurt crossing ≥1 centile space in 3–6 months supports true (progressive) precocious puberty and adds urgency. A slowing growth rate with pubertal signs points instead to hypothyroidism"],
         ["<b>Documentation</b>","Record Tanner stage in words and numbers and plot the measurements; do not photograph a child\u2019s genital or breast development for the referral"],
         ["<b>Syndromic clues</b>","Café-au-lait macules and facial asymmetry (McCune-Albright), neurofibromatosis stigmata, and signs of hyperthyroidism or Cushing's"],
         ["<b>Bone age</b>","Wrist X-ray for bone age is usually arranged by the specialist; an advanced bone age versus chronological age indicates significant sex-steroid exposure"],
         ["<b>Primary-care role in testing</b>","Mostly refer rather than test — plot serial growth, document staging, and check TFTs if growth is slowing or there are hypothyroid features. Random LH or oestradiol in primary care is hard to interpret and should not delay referral. The hormonal and imaging work-up is specialist-led"]
       ]},
       {b:"table", head:["Specialist investigation","What it shows"], rows:[
         ["<b>Bone age</b>","Wrist X-ray — advanced bone age quantifies the sex-steroid effect and predicts the impact on final height"],
         ["<b>Hormones</b>","Basal LH and FSH (an ultrasensitive assay is increasingly used first) and a GnRH (LHRH) stimulation test where needed to separate central (pubertal LH response) from peripheral (suppressed gonadotrophins); oestradiol or testosterone; 17-OHP, DHEAS and androgens if there is virilisation; hCG in boys with peripheral features; TFTs"],
         ["<b>Imaging</b>","Pituitary or brain MRI for central precocious puberty — particularly in boys and younger girls, and always with neurological signs; pelvic USS (uterine and ovarian maturation, cysts) in girls; testicular or adrenal USS if a peripheral source is suspected"],
         ["<b>Evolving practice (international)</b>","The Endocrine Society guideline (JCEM 2026, international) suggests MRI need not be routine in girls aged 6–8 or boys aged 8–9 with central precocious puberty and no neurological findings, and suggests watchful waiting with repeat examination for girls with thelarche at 7–8 years. These are specialist decisions — the GP rule stays: refer every child"]
       ]},
       {b:"why", html:"<b>Plotting serial growth is the single most useful primary-care step:</b> a pubertal growth spurt that crosses centile lines supports true precocious puberty and adds urgency, whereas isolated breast development or pubic hair with a normal growth velocity often represents a benign variant. The GnRH stimulation test is the pivotal specialist investigation, because it directly demonstrates whether the axis has been switched on (central) or is suppressed by a peripheral steroid source — a distinction random hormone levels cannot reliably make. Ultrasensitive basal LH now often answers the question before a stimulation test is needed (Endocrine Society, international, 2026). Brain MRI is most valuable where the pre-test probability of an intracranial lesion is highest — boys, very young girls and any child with neurological signs — and the 2026 international guidance narrows routine MRI in older children without neurological findings. That nuance sits with the specialist; it is one more reason the primary-care task is to refer with good growth data rather than to start testing."}
     ]},

    {id:"ladder", nav:"Treatment", title:"Specialist treatment and shared care",
     sub:"The treatment decision is specialist-led. The GP's part is often delivering it and monitoring the child.",
     blocks:[
       {b:"table", head:["Situation","Treatment"], rows:[
         ["<b>Central precocious puberty</b>","A GnRH analogue depot — for example depot leuprorelin or triptorelin — paradoxically suppresses the axis, halting progression to preserve adult height and reduce psychosocial impact. Continued to around the normal age of puberty, then stopped — the Endocrine Society (international, 2026) suggests against routinely continuing beyond about 10–11 years in girls or 11–12 years in boys (or the equivalent bone age)"],
         ["<b>Peripheral precocious puberty</b>","Treat the source: surgery or oncology for a tumour; steroid replacement for CAH; specialist hormonal treatment in McCune-Albright; remove exogenous steroid exposure"],
         ["<b>Benign variants</b>","Monitor — no drug. Premature thelarche and adrenarche need reassurance and surveillance of growth and progression, not treatment"],
         ["<b>GP and shared-care role</b>","Where agreed, administer the depot injections on time (missed doses can let puberty restart), monitor growth and pubertal staging, support adherence, and watch for injection-site or treatment effects — escalating concerns to the specialist. Doses and intervals follow the specialist letter and the BNF for Children"]
       ]},
       {b:"why", html:"GnRH analogues exploit the physiology of the axis: continuous (rather than pulsatile) GnRH stimulation desensitises the pituitary, switching gonadotrophin secretion off and arresting pubertal progression — buying time for growth and emotional maturation so final height and wellbeing are protected. The decision to treat balances predicted height loss and psychosocial impact against the burden of therapy, which is why it is specialist-led, often with the GP delivering the depot under shared care."}
     ]},

    {id:"lifestyle", nav:"Family support", title:"Family support and modifiable factors",
     sub:"Support the child while the specialist work-up proceeds — this is genuine management, not a soft add-on.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"🫂 Psychosocial support", html:"Early development can affect self-esteem, peer relationships and behaviour — offer age-appropriate explanation and, where helpful, school liaison.", src:"Bradley et al., BMJ 2020;368:l6597"},
         {tone:"green", h:"⚖️ Weight", html:"Address adiposity where relevant — it associates with earlier puberty in girls — and support healthy diet and activity without blame.", src:"Bradley et al., BMJ 2020;368:l6597"},
         {tone:"amber", h:"🧴 Exogenous steroids", html:"Review and remove any sex-steroid exposure — a parent\u2019s testosterone or oestrogen gel (cover the application site, wash hands, avoid skin-to-skin contact), creams or supplements. A concrete, reversible cause primary care can act on directly.", src:"MHRA Drug Safety Update January 2023 (topical testosterone)"},
         {tone:"cream", h:"💬 Reassurance", html:"Explain that benign normal variants (premature thelarche and adrenarche) are common but still warrant the assessment already arranged.", src:"Bradley et al., BMJ 2020;368:l6597"},
         {tone:"cream", h:"🩲 Practical preparation", html:"If periods are likely before specialist review, talk through menstrual products and school arrangements with the child and family.", src:"Bradley et al., BMJ 2020;368:l6597"},
         {tone:"amber", h:"🛡 Vulnerability", html:"A child who looks older than their age may be treated as older by others. Keep safeguarding in mind and give the family words to explain the changes to the child.", src:"Working Together to Safeguard Children 2023"}
       ]},
       {b:"why", html:"The impact of early puberty on the child — being physically out of step with peers, and the emotional consequences — is part of the specialist's decision about whether and when to treat, so acknowledging and supporting it is genuine management. Removing exogenous steroid exposure is a concrete, reversible cause of peripheral changes that primary care can identify and act on directly; the MHRA advice on topical testosterone (January 2023) centres on preventing skin-to-skin transfer to children."}
     ]},

    {id:"monitor", nav:"Review", title:"Review, follow-up and safety-netting",
     blocks:[
       {b:"table", head:["What","Detail"], rows:[
         ["<b>Ensure the referral happens</b>","Confirm the referral is made and attended — do not simply observe in primary care. Chase non-attendance"],
         ["<b>Keep plotting growth</b>","Use the RCPCH UK-WHO growth charts; a documented centile-crossing growth spurt strengthens the referral and tracks progression"],
         ["<b>Escalate urgency</b>","New headache, visual disturbance, vomiting or raised-ICP signs, rapid centile-crossing growth, or a new testicular mass → expedite (possible intracranial or serious cause); new neurological signs → NICE NG12 48-hour route"],
         ["<b>Shared care</b>","If a GnRH analogue is started, give each depot on schedule, record growth and staging at each visit, and tell the specialist about missed doses or renewed progression"],
         ["<b>Safety-net wording</b>","\u201cPlease come back straight away, before the appointment, if there are headaches — especially in the morning or with being sick — any change in vision, fits, unusual thirst or passing lots of urine, or if the changes speed up.\u201d"],
         ["<b>Reassure</b>","Most girls have a benign or idiopathic cause; referral is routine practice, and benign variants are monitored rather than treated"],
         ["<b>Re-examine and re-flag</b>","Re-examine and escalate the urgency if red flags develop; flag any red flag prominently in the referral"]
       ]},
       {b:"why", html:"Serial growth data and clear safety-netting are the most valuable things primary care can add while a child waits to be seen: a documented accelerating growth velocity both supports the diagnosis and raises the urgency, and the safety-net ensures that an evolving intracranial cause is escalated rather than missed. Specific symptoms in plain words — morning headache with vomiting, visual change, thirst — are easier for a family to act on than \u201ccome back if worse\u201d."},
       {b:"say", html:"What you have noticed does need a specialist opinion, and I am arranging that today — I am not going to just watch and wait, because working out the cause needs tests we do not do here. In girls this is usually simply early puberty with no underlying problem, and often it settles into being a normal variation; in boys we are more careful, which is why every boy is seen urgently. Two things I will do meanwhile: keep measuring and plotting height, because a growth spurt tells the specialist a great deal, and check there is nothing at home that could be contributing, like a hormone cream. And please come back sooner if there are headaches, any change in vision, or vomiting."}
     ]},

    {id:"refer", nav:"Refer", title:"Referral — all children, urgency by sex and red flags",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"All boys — urgent, always", html:"Precocious puberty in boys is more often pathological → refer every boy urgently, even with a normal examination. Note any testicular lump — it may follow a urological pathway.", src:"Bradley et al., BMJ 2020;368:l6597"},
         {tone:"red", h:"Any child with red flags — urgent", html:"Headache, visual disturbance or raised-ICP signs · polyuria and polydipsia · CNS history · steep centile-crossing growth · pubic hair in infancy · a testicular mass. Highlight the red flags in the referral so paediatrics can judge how urgent. Same-day paediatric assessment if there are signs of raised intracranial pressure.", src:"Bradley et al., BMJ 2020;368:l6597"},
         {tone:"purple", h:"2WW · NICE NG12 — very urgent (48 hours)", html:"Newly abnormal cerebellar or other central neurological function in a child or young person (for example papilloedema, visual field loss, new squint, ataxia) → consider a very urgent referral (appointment within 48 hours) for suspected brain or CNS cancer. Say so explicitly in the letter rather than sending a routine endocrine referral. Early puberty alone does not meet an NG12 criterion.", src:"NICE NG12 (updated April 2026) — children and young people, brain and CNS"},
         {tone:"amber", h:"Girls — urgent", html:"Any red flag, clitoromegaly or other virilisation, menarche before 8, or progressive breast development before 8 with height-centile crossing.", src:"Bradley et al., BMJ 2020;368:l6597"},
         {tone:"blue", h:"Girls — routine", html:"Otherwise — normal neurological and genital examination and normal growth → routine paediatric referral. The 2026 international guideline\u2019s watchful waiting for thelarche at 7–8 years is a specialist option, not a reason to hold the referral.", src:"Bradley et al., BMJ 2020;368:l6597 · Endocrine Society 2026 (international)"},
         {tone:"red", h:"Safeguarding", html:"Vaginal bleeding without breast development, genital injury or any disclosure → follow local child-protection procedures alongside the medical referral.", src:"Working Together to Safeguard Children 2023"},
         {tone:"cream", h:"Do not just observe", html:"Refer all suspected cases to paediatrics or paediatric endocrinology. The diagnosis, the need for imaging and the GnRH-analogue decision are specialist judgements.", src:"Bradley et al., BMJ 2020;368:l6597"},
         {tone:"blue", h:"What to put in the letter", html:"Age at first change and the sequence since; the plotted growth chart with any previous measurements (personal child health record, school nurse); Tanner stage in words; parental heights; neurological and testicular findings; any exposure to hormone gels or creams; and whether an NG12 criterion is met.", src:"RCPCH UK-WHO growth charts · NICE NG12 (updated April 2026)"}
       ]},
       {b:"why", html:"The sex difference in referral urgency reflects the underlying epidemiology: in girls, precocious puberty is usually idiopathic central precocious puberty, whereas in boys an identifiable — and sometimes serious — cause is much more common, so every boy warrants urgent specialist assessment. All children are referred because the diagnosis, the need for imaging and the decision about GnRH-analogue treatment to preserve final height are specialist judgements. Previous measurements from the personal child health record or school nurse can turn a single plot into a velocity, which is often what decides the urgency at triage."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A mother brings her 7-year-old son because he has grown out of two shoe sizes since Easter, has developed pubic hair, and \u201csmells like a teenager\u201d. He has been getting early-morning headaches for a fortnight, which she attributes to screen time. His examination is otherwise unremarkable and she asks whether they can \u201cjust keep an eye on it\u201d.", src:"Bradley et al., BMJ 2020;368:l6597"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Knows the boys' threshold is before 9 and that every boy is referred urgently regardless of examination; takes the early-morning headaches seriously and performs fundoscopy and visual fields; plots the height and weight and recognises centile crossing as both diagnostic support and an urgency marker; recognises this meets the NG12 very-urgent brain/CNS criterion if neurological function is abnormal, and says so in the letter; asks about <b>exogenous steroid exposure and CNS history</b>; declines the \u201ckeep an eye on it\u201d request with a clear explanation; and \u2014 the step candidates miss \u2014 commits to confirming the referral is attended and chasing non-attendance, rather than leaving the family to it. Bonus: asks whether anyone at home uses testosterone gel.", src:"Bradley et al., BMJ 2020;368:l6597 · NICE NG12 (updated April 2026) · MHRA DSU January 2023"}
     ]}]},

  foot:"Precocious puberty \u2014 Bradley et al. (BMJ 2020;368:l6597), RCPCH UK-WHO growth charts, NICE NG12 (updated April 2026), MHRA Drug Safety Update January 2023, the Endocrine Society 2026 guideline (international, specialist context) and the BNF for Children. All suspected cases are referred and every boy is referred urgently; specialist services confirm the cause and decide on treatment. Adapt to local paediatric pathways."
