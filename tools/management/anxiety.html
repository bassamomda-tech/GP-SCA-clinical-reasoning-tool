  stemSub:"One page for the whole condition. Screen for the physical mimics and the substances that fake it, score GAD-7 and PHQ-9 together, work out <em>which</em> anxiety disorder it is because that decides the therapy pathway, run stepped care with psychology first, start sertraline at half the depression dose, and allow a genuine 12 weeks before declaring failure.",

  lead:'<div class="mg-layers"><a href="#severe"><b>Mimics &amp; risk</b><small>Organic until proven</small></a><a href="#classify"><b>Which disorder?</b><small>It picks the therapy</small></a><a href="#ladder"><b>Drug treatment</b><small>Half-dose start</small></a><a href="#refer"><b>Refer</b><small>The specialist tracks</small></a></div>',
  quickSub:"If you read nothing else on this page, read these six cards. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"\u26a0 Exclude the organic mimic first", html:"About 10\u201315% of patients presenting to primary care with anxiety symptoms have an identifiable organic cause \u2014 hyperthyroidism and cardiac arrhythmia are commonest. <b>TSH is the single most important investigation.</b> New-onset anxiety after 40 with no clear precipitant is organic until proven otherwise. Never attribute chest tightness to anxiety in anyone aged \u226540 without an ECG and cardiac exclusion."},
    {tone:"red", h:"Ask about suicide, every time", html:"Severe anxiety is a significant independent risk factor for suicide \u2014 higher than depression alone in some studies \u2014 and <b>comorbid anxiety with depression is the highest-risk combination</b>. Ask directly: \u201cHave you had any thoughts of harming yourself or ending your life?\u201d Benzodiazepines reduce acute anxiety but disinhibit \u2014 assess risk before prescribing."},
    {tone:"amber", h:"Score both, not one", html:"GAD-7: 5\u20139 mild \u00b7 10\u201314 moderate \u00b7 15\u201321 severe; \u226510 is clinically significant (sensitivity 89%, specificity 82%). <b>GAD-2 \u22653 \u2192 proceed to the full GAD-7.</b> Score PHQ-9 too \u2014 50\u201360% of anxiety patients have comorbid depression, which has a worse prognosis than either alone. <b>Treat the depression first if present \u2014 it changes the plan.</b>"},
    {tone:"blue", h:"Which disorder decides the therapy", html:"GAD, panic disorder, agoraphobia, social anxiety, health anxiety, OCD and PTSD each need a <em>different</em> psychological therapy. PTSD needs trauma-focused CBT or EMDR \u2014 generic anxiety CBT is not adequate and can retraumatise. <b>OCD needs exposure and response prevention.</b> Health anxiety needs CBT targeting the reassurance cycle \u2014 not more investigation. Mislabelling everything \u201canxiety\u201d sends the patient to the wrong service."},
    {tone:"plain", h:"Start low \u2014 it stops people quitting", html:"<b>Sertraline 25\u201350 mg OD \u2014 half the depression starting dose</b> \u2014 titrating to 100\u2013200 mg. SSRIs transiently worsen anxiety and jitteriness in weeks 1\u20132: the single commonest reason anxious patients stop. Warn explicitly and review early. Benzodiazepines are not for anxiety beyond short-term crisis use of 2\u20134 weeks."},
    {tone:"green", h:"Judge at 12 weeks, not 3", html:"Anxiety responds more slowly than depression \u2014 allow up to 12 weeks at an adequate dose before declaring failure (6\u20138 weeks for a partial response, then optimise). <b>Premature switching is serial under-treatment.</b> <b>Continue an effective SSRI for at least 12 months</b> after response, then taper slowly. Success is restored function, not zero worry."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step is where patients come to harm.",
  pathway:[
    {title:"Screen for the organic mimic", html:"<b>TFTs</b> plus an <b>ECG</b> where there are palpitations or chest symptoms; quantify <b>caffeine, alcohol, stimulants and cannabis</b>. Consider hypoglycaemia, phaeochromocytoma, menopause, and temporal lobe epilepsy in atypical episodes."},
    {title:"Assess risk", html:"Suicidal ideation or self-harm risk \u2192 same-day crisis assessment if active. Severe functional impairment or self-neglect \u2192 urgent mental health. Ask about alcohol and substances as self-medication.", alert:true},
    {title:"Score and classify", html:"GAD-7 and PHQ-9. Then decide <b>which</b> anxiety disorder \u2014 screen for PTSD with <b>PC-PTSD-5</b> in anyone with a trauma history before referring to a generic service."},
    {title:"Stepped care \u2014 psychology first", html:"Education and active monitoring \u2192 low-intensity guided self-help or digital CBT \u2192 high-intensity CBT and/or an SSRI \u2192 specialist. <b>NHS Talking Therapies self-referral \u2014 give the link or number.</b>"},
    {title:"Start, review, continue", html:"Sertraline at half dose with explicit warning \u2192 <b>review at 1\u20132 weeks</b> (1 week if <b>&lt;30</b>, or <b>&lt;25</b> and higher risk \u2014 the age at which suicidality risk on SSRI initiation is highest) \u2192 GAD-7 at 4\u20136 weeks (a <b>&lt;50%</b> fall means optimise then switch) \u2192 <b>formal judgement at 12 weeks</b> \u2192 continue \u226512 months \u2192 slow taper."}
  ],
  sections:[

    {id:"severe", nav:"Mimics &amp; red flags", title:"Organic mimics and psychiatric emergencies", sub:"Anxiety symptoms can be the presenting feature of serious medical pathology. Exclude organic causes before attributing symptoms to a primary anxiety disorder.",
     blocks:[
       {b:"warn", html:"New-onset anxiety after age 40 without a clear precipitant is organic until proven otherwise. And do not attribute chest tightness to anxiety in any patient aged 40 or over without an ECG and cardiac exclusion."},
       {b:"cards", items:[
         {tone:"red", h:"Anxiety + palpitations + weight loss + heat intolerance + tremor", html:"<b>Hyperthyroidism (thyrotoxicosis) \u2014 TSH suppressed.</b> <b>Thyroid storm</b> (extreme anxiety, hyperpyrexia, tachycardia, altered consciousness) \u2192 <b>999</b>. <b>Phaeochromocytoma:</b> episodic anxiety with severe hypertension, headache and sweating \u2192 <b>24-hour urinary catecholamines or plasma metanephrines</b>. <b>Both mimic panic disorder precisely.</b>"},
         {tone:"red", h:"Anxiety + chest tightness + palpitations, aged \u226540 or with cardiac risk factors", html:"<b>Cardiac arrhythmia (SVT, AF, VT) presenting as anxiety or panic.</b> Acute coronary syndrome. <b>PE</b> \u2014 anxiety with breathlessness, pleuritic pain and DVT risk. <b>ECG mandatory</b>; Wells score and D-dimer if PE is suspected."},
         {tone:"red", h:"Sudden first episode aged over 40 with no psychiatric history", html:"Consider <b>hypoglycaemia</b> (check glucose), cardiac arrhythmia, hyperthyroidism, <b>phaeochromocytoma</b>, <b>carcinoid</b> (flushing, diarrhoea, wheeze, right heart valvular disease), <b>CNS pathology \u2014 temporal lobe epilepsy with ictal anxiety</b>, and menopause."},
         {tone:"red", h:"Anxiety + suicidal ideation or self-harm", html:"<b>Severe anxiety is a significant independent risk factor for suicide</b>, and <b>comorbid anxiety with depression carries the highest risk</b>. <b>Same-day crisis assessment if there is active ideation.</b> <b>Benzodiazepines disinhibit \u2014 assess risk before prescribing.</b>"},
         {tone:"amber", h:"Stimulants, caffeine, or substance withdrawal", html:"<b>Stimulant misuse (cocaine, amphetamines, MDMA)</b> causes acute anxiety and panic. Cannabis is bidirectional \u2014 it causes acute anxiety and panic AND is used to self-medicate anxiety. <b>Alcohol or benzodiazepine withdrawal:</b> severe anxiety, tremor, sweating \u2192 <b>seizure risk \u2192 medical management</b>. Caffeine excess &gt;400 mg/day causes clinical anxiety \u2014 a caffeine history is mandatory. Also salbutamol and steroids."},
         {tone:"amber", h:"Intrusive trauma memories + hypervigilance + avoidance", html:"<b>This is PTSD, not GAD</b> \u2014 it needs trauma-focused CBT or EMDR, not generic anxiety management. <b>Screen with the 5-item PC-PTSD-5.</b> Untreated PTSD managed as generalised anxiety has poor outcomes and can retraumatise. Refer to a trauma-specialist NHS Talking Therapies pathway, or CMHT if the trauma is complex."},
         {tone:"purple", h:"NG12 \u2014 no criterion applies", html:"Anxiety is not a NICE NG12 suspected-cancer criterion. But <b>anxiety about symptoms does not exempt those symptoms from assessment</b> \u2014 where the presentation includes unexplained weight loss, a lump, rectal bleeding or haemoptysis, follow the relevant NG12 route on its own merits. Health anxiety is a diagnosis of what the symptoms <em>are</em>, not a reason to skip the exclusion."}
       ]},
       {b:"why", html:"The overlap between anxiety symptoms and medical pathology is one of the most important diagnostic pitfalls in primary care. TSH is abnormal in a clinically significant proportion of patients presenting with new anxiety, and hyperthyroidism is entirely treatable \u2014 removing the anxiety without psychiatric intervention. Phaeochromocytoma is rare (1\u20132 per 100,000) but among the most dangerous missed diagnoses: any patient with episodic anxiety plus severe hypertension (<b>systolic &gt;200 mmHg during episodes</b>) or headache needs plasma metanephrines before panic disorder is confirmed."}
     ]},

    {id:"score", nav:"Scores", title:"GAD-7, GAD-2 and the PHQ-9 you must score alongside", sub:"Score at every anxiety assessment — it classifies severity, guides escalation, and tracks response.",
     blocks:[
       {b:"dl", rows:[
         ["<b>GAD-2 gateway screen</b>","\u201cOver the past 2 weeks, how often have you been bothered by: (1) feeling nervous, anxious or on edge? (2) not being able to stop or control worrying?\u201d Scored 0\u20133 each. <b>GAD-2 \u22653 \u2192 proceed to the full GAD-7.</b> <b>Sensitivity 86%, specificity 83%</b> for GAD. Use it proactively in multimorbidity, diabetes and cardiovascular reviews"],
         ["<b>GAD-7</b>","7 items scored 0\u20133, total 0\u201321. <b>5\u20139 mild \u00b7 10\u201314 moderate \u00b7 15\u201321 severe.</b> <b>\u226510 = clinically significant anxiety warranting intervention.</b> The 7th item directly assesses functional impairment. A 5-point reduction is a clinically meaningful improvement; a score below 8 at 8\u201312 weeks represents a treatment response. Record it at every contact"],
         ["<b>PHQ-9 co-scoring</b>","50\u201360% of patients with GAD have comorbid depression and vice versa. Comorbid anxiety\u2013depression has a worse prognosis than either alone and often needs more intensive treatment. Treat the condition causing greater impairment first, then reassess the other \u2014 and where depression is present, treating it first changes the whole plan. The treatment overlaps: SSRI plus CBT works for both"],
         ["Functional impairment","<b>Work</b> \u2014 absence, presenteeism, performance. <b>Relationships</b> \u2014 conflict, withdrawal, avoidance. <b>Social</b> \u2014 activities avoided, isolation. <b>Physical</b> \u2014 somatic symptoms (IBS, tension headache, chronic pain) driven by anxiety. Document it specifically: <b>\u201cWhat has anxiety stopped you doing that you want to do?\u201d</b>"]
       ]},
       {b:"why", html:"The GAD-7 was developed and validated by <b>Spitzer et al. (2006, Archives of Internal Medicine)</b> as a brief primary-care measure for GAD, and has since been validated across all anxiety disorders including panic, social anxiety and PTSD \u2014 making it universally applicable. Like the PHQ-9 in depression, <b>serial documentation is the primary mechanism for tracking response</b>."}
     ]},

    {id:"classify", nav:"Which disorder", title:"Which anxiety disorder is it? \u2014 because that picks the therapy", sub:"NICE has different treatment guidance for each specific disorder, and the psychological therapy required is distinct. The diagnosis determines the referral pathway, not just the severity score.",
     blocks:[
       {b:"table", head:["Disorder","Features","Treatment"], rows:[
         ["<b>Generalised anxiety disorder</b>","Persistent, excessive, uncontrollable worry across multiple domains (work, health, family, finances) <b>most days for \u22656 months</b>, plus \u22653 of: restlessness, fatigue, poor concentration, irritability, muscle tension, sleep disturbance \u2014 with functional impairment. GAD-7 \u226510","Psychological therapy \u2014 CBT focusing on worry postponement, cognitive restructuring, and applied relaxation \u2014 \u00b1 SSRI. GAD is the default diagnosis: the specific disorders must be excluded first"],
         ["<b>Panic disorder</b>","Recurrent unexpected panic attacks \u2014 discrete episodes of intense fear <b>peaking within 10 minutes</b> (palpitations, sweating, tremor, breathlessness, chest tightness, depersonalisation, fear of dying or losing control) \u2014 plus persistent concern about further attacks and behavioural change. <b>A first panic attack always needs cardiac and organic exclusion</b>","<b>Panic-focused CBT with interoceptive exposure</b> (deliberately inducing feared bodily sensations to demonstrate they are harmless) and panic-cycle psychoeducation, \u00b1 SSRI. <b>NOT benzodiazepines</b>"],
         ["<b>Agoraphobia</b>","Anxiety and avoidance of situations where escape is difficult or help unavailable \u2014 public transport, open spaces, crowds, leaving home alone. Often secondary to panic disorder; causes profound disability","<b>CBT with graded exposure</b> + SSRI. <b>Home visits for the housebound.</b> Phobia-specific CBT is superior to generic anxiety management"],
         ["<b>Social anxiety disorder</b>","Marked fear of social situations involving scrutiny or embarrassment (public speaking, eating in public, meeting people); avoidance or endurance with intense distress, <b>\u22656 months</b>. Often misdiagnosed as shyness \u2014 the most underdiagnosed anxiety disorder","CBT \u2014 cognitive restructuring and behavioural experiments; the Clark model group programme \u00b1 SSRI or SNRI (<b>sertraline and paroxetine are licensed specifically for social anxiety</b>)"],
         ["<b>Health anxiety</b> (illness anxiety disorder)","Persistent preoccupation with having or developing serious illness <b>despite medical reassurance</b>; excessive health-seeking or health avoidance. Exacerbated by internet symptom-checking and repeated investigation. Investigation and reassurance give only transient relief and worsen the cycle","<b>CBT specifically for health anxiety \u2014 NOT more investigation.</b> Explain the reassurance cycle explicitly to the patient"],
         ["<b>OCD</b>","Recurrent intrusive obsessional thoughts (contamination, harm, symmetry, religious) plus compulsive rituals to reduce anxiety (washing, checking, ordering, counting, praying). <b>Ego-dystonic.</b> Impairs function when rituals take <b>&gt;1 hour/day</b>","<b>CBT with exposure and response prevention (ERP)</b> \u2014 the patient is exposed to the feared stimulus and <em>prevented</em> from performing the compulsion \u2014 plus an SSRI at <b>higher doses than for depression (sertraline 200 mg, fluoxetine 60 mg)</b>"],
         ["<b>PTSD</b>","After traumatic events: re-experiencing (intrusive memories, nightmares, flashbacks), avoidance of reminders, negative cognitions and mood, hyperarousal (hypervigilance, exaggerated startle, sleep disturbance). <b>&gt;1 month</b> with functional impairment. <b>PC-PTSD-5</b> screen","Trauma-focused CBT or EMDR \u2014 first-line (NICE NG116). SSRI second-line only. Do NOT refer to generic anxiety NHS Talking Therapies without a trauma-specialist track"]
       ]},
       {b:"warn", html:"Mislabelling everything \u201canxiety\u201d leads to the wrong therapy referral. NICE NG116 specifies that trauma-focused psychological therapy \u2014 not drug treatment \u2014 is first-line for all PTSD. Treating PTSD with relaxation techniques or standard anxiety management can be actively harmful: exposure to triggers without proper trauma processing can worsen flashbacks."},
       {b:"why", html:"<b>Health anxiety is the counterintuitive one</b> \u2014 the clinical instinct is to investigate and reassure, whereas the evidence shows that investigation and reassurance <em>maintain and worsen</em> health anxiety by reinforcing the belief that the symptoms need investigating. And <b>social anxiety affects roughly 12% of the population at some point</b>, yet is frequently attributed to \u201cpersonality\u201d rather than recognised as treatable, despite substantial occupational impairment; <b>an SSRI plus CBT produces remission in the majority</b>."}
     ]},

    {id:"workup", nav:"Investigations", title:"Investigations and organic exclusion", sub:"A small, targeted panel — plus a social and substance history that changes management more than any blood test.",
     blocks:[
       {b:"dl", rows:[
         ["<b>Mandatory baseline</b>","<b>TSH</b> (hyperthyroidism \u2014 most important) \u00b7 <b>FBC</b> (anaemia causing fatigue and palpitations) \u00b7 <b>U&amp;E and glucose</b> (hypoglycaemia, hypokalaemia from hyperventilation, renal disease) \u00b7 <b>corrected calcium</b> (hypercalcaemia causes anxiety, depression and confusion) \u00b7 <b>ECG</b> (arrhythmia; baseline QTc before citalopram or escitalopram in cardiac patients; <b>WPW \u2014 delta waves with anxiety and palpitations</b>)"],
         ["<b>Targeted by presentation</b>","Episodic panic with severe hypertension \u2192 <b>plasma metanephrines</b>. Flushing, diarrhoea and wheeze \u2192 <b>24-hour urinary 5-HIAA</b> (carcinoid). Episodic anxiety with oral automatisms or d\u00e9j\u00e0 vu \u2192 <b>EEG</b> (temporal lobe epilepsy). Alcohol or substance use \u2192 <b>GGT, MCV, LFTs</b>. Menopausal symptoms \u2192 FSH and oestradiol"],
         ["<b>Substance screen</b>","<b>AUDIT-C in all anxiety presentations</b> \u2014 alcohol and anxiety are bidirectionally linked. Cannabis assessment (self-medication is common; it worsens anxiety long-term). Stimulant screen if episodic severe anxiety. Caffeine history \u2014 &gt;400 mg/day (more than 4 cups of coffee) is clinically anxiogenic, and caffeine-induced anxiety is reversible: advise gradual reduction, as abrupt cessation causes withdrawal headache"],
         ["<b>Social history and life events</b>","Recent stressors (bereavement, relationship breakdown, redundancy, debt, housing insecurity); childhood adversity \u2014 ACEs show a dose-response relationship with anxiety disorder risk; domestic situation; caring responsibilities; work environment (occupational stress, harassment, burnout); and sleep quality, assessed independently \u2014 poor sleep is both cause and consequence"]
       ]},
       {b:"why", html:"The ECG before an SSRI in a patient with palpitations does two jobs: it excludes arrhythmia as the organic cause, and it gives a baseline QTc before citalopram or escitalopram, which cause dose-dependent QTc prolongation. <b>WPW syndrome</b> (short PR with a delta wave) causes paroxysmal SVT presenting in young adults as sudden palpitations, anxiety and near-syncope \u2014 potentially life-threatening, entirely manageable with ablation, and should never be managed with anxiolytics. Separately, <b>temporal lobe epilepsy with ictal anxiety</b> is distinguished from panic by very brief episodes (<b>&lt;2 minutes versus 5\u201320 for panic</b>), automatisms, d\u00e9j\u00e0 or jamais vu, olfactory hallucination and post-ictal confusion."}
     ]},

    {id:"stepped", nav:"Stepped care", title:"Stepped care \u2014 psychology before pills", sub:"An antidepressant is a Step 3 intervention. The aim is neither to medicalise mild anxiety nor to under-treat severe anxiety.",
     blocks:[
       {b:"p", html:"<b>Steps 1\u20132 come first</b> \u2014 medication is offered when low-intensity work fails or symptoms are marked, and ideally <em>alongside</em> psychology rather than instead of it."},
       {b:"cards", items:[
         {tone:"blue", h:"Step 1 \u00b7 Education and active monitoring", html:"Explain anxiety, the worry cycle, and that <b>anxiety is not dangerous</b>. Appropriate for <b>subthreshold anxiety (GAD-7 &lt;10) without functional impairment</b> \u2014 many improve with this plus review. <b>Don\u2019t medicalise mild, recent worry.</b>"},
         {tone:"blue", h:"Step 2 \u00b7 Low intensity", html:"<b>GAD-7 5\u20139.</b> Individual guided self-help (CBT-based), psychoeducational groups, computerised CBT \u2014 <b>SilverCloud, Every Mind Matters</b>, books on prescription. NHS Talking Therapies self-referral \u2014 give the link or number: self-referral rates double when you do."},
         {tone:"plain", h:"Step 3 \u00b7 High intensity", html:"<b>GAD-7 10\u201314.</b> <b>Individual CBT 12\u201316 sessions</b>, group CBT, or applied relaxation \u2014 <b>equal in efficacy to drugs</b>; offer as an alternative or an addition. Panic-focused CBT for panic disorder; Clark model group CBT for social anxiety. \u00b1 SSRI."},
         {tone:"plain", h:"Step 4 \u00b7 Specialist", html:"<b>GAD-7 \u226515</b> with significant impairment not responding, refractory or complex presentations, or high risk \u2192 CMHT and complex psychological therapy or medication combinations."},
         {tone:"green", h:"\ud83c\udfc3 Exercise", html:"Reduces anxiety scores by 0.48 standard deviations \u2014 a moderate effect comparable to medication and CBT in mild\u2013moderate anxiety. <b>150 minutes/week</b>. Mechanism: reduced cortisol reactivity, increased GABA activity, better sleep, mastery experiences. Be specific \u2014 \u201c30 minutes brisk walking 5\u00d7/week\u201d beats \u201cexercise more\u201d. Green exercise in nature has superior anxiolytic effect to urban exercise."},
         {tone:"green", h:"\ud83e\udee8 Breathing retraining", html:"Anxiety-driven <b>hyperventilation lowers CO\u2082</b>, producing dizziness, tingling and palpitations that are misinterpreted as dangerous \u2014 perpetuating panic. Diaphragmatic breathing: 4 seconds in through the nose, 6 out through pursed lips; practise 10 minutes daily to build the skill <em>before</em> needing it. <b>Box breathing (4-4-4-4).</b> <b>Teach it in the consultation \u2014 demonstrate and watch them do it.</b>"},
         {tone:"amber", h:"\u2615 Caffeine and alcohol", html:"Caffeine is a competitive adenosine-receptor antagonist that increases adrenaline release, heart rate and cortisol \u2014 directly worsening anxiety and panic, and panic-disorder patients are measurably more sensitive to it. Reduce to &lt;200 mg/day (under 2 cups), gradually over 2 weeks to avoid withdrawal headache. Alcohol\u2019s short-term anxiolytic effect masks the fact that it markedly worsens anxiety next day via rebound sympathetic activation. AUDIT-C. Alcohol dependence needs specialist management before anxiety treatment can work."},
         {tone:"amber", h:"\ud83d\ude34 Sleep", html:"Sleep deprivation dramatically worsens anxiety \u2014 the prefrontal cortex is highly sleep-sensitive. CBT-I is first-line for comorbid anxiety and insomnia \u2014 NHS Sleepio (free digital CBT-I): fixed wake time, no daytime naps, stimulus control, sleep restriction. <b>Treating sleep reduces anxiety severity independently.</b>"},
         {tone:"plain", h:"\ud83e\uddd8 Mindfulness", html:"8-week MBSR (Kabat-Zinn): medium\u2013large effect sizes for GAD and panic. Teaches decentred observation of anxious thoughts rather than engagement or suppression. Apps (Headspace, Calm, Insight Timer) are reasonable Step 1 interventions but <b>do not replace CBT for moderate\u2013severe anxiety</b>."},
         {tone:"plain", h:"\ud83d\udcdd Worry postponement \u2014 teachable in 10 minutes", html:"A core CBT-for-GAD technique deliverable in primary care: designate a specific 20-minute \u201cworry time\u201d each day (not in the evening). Outside it, note intruding worries briefly and postpone them. Many worries resolve before worry time arrives, breaking the constant-vigilance cycle."},
         {tone:"cream", h:"\ud83e\udd1d Social connection and social prescribing", html:"Isolation is both cause and consequence \u2014 avoidance maintains anxiety. Prescribe gradual re-engagement: one social contact per week to start, not a group \u2014 too threatening initially. Where anxiety is driven by <b>debt, housing or loneliness</b>, refer to the PCN social prescribing link worker and Citizens Advice \u2014 <b>these address root causes that SSRIs and CBT cannot</b>."}
       ]},
       {b:"kv", rows:[
         ["Named resources \u2014 prescribe specifically, don\u2019t say \u201clook online\u201d","<b>SilverCloud</b> (online CBT via NHS Talking Therapies self-referral) \u00b7 <b>Every Mind Matters</b> \u00b7 <b>No Panic helpline 0300 772 9844</b> (panic and OCD) \u00b7 <b>Anxiety UK 0344 477 5774</b> \u00b7 <b>Samaritans 116 123</b> \u00b7 Mind and Rethink (peer support) \u00b7 No More Panic \u00b7 OCD UK and OCD Action. Write the name and access route on a printed sheet given at the consultation"]
       ]},
       {b:"why", html:"Worry postponement is one of the most evidence-based and most under-used brief interventions in primary care. Developed by Borkovec, it significantly reduces worry frequency and duration within 1\u20132 weeks of consistent practice. Its mechanism: most GAD worry is not solved by rumination but sustained by the belief that worrying prevents bad outcomes \u2014 scheduled worry time disrupts that belief by demonstrating the world does not fall apart when worry is postponed. Five minutes teaching this may be more therapeutically effective than the prescription pad. The key stepped-care principle is <b>not to start at Step 3 for someone who could be managed at Step 2</b> \u2014 but equally, patients with moderate\u2013severe anxiety who clearly will not benefit from self-help should go straight to Step 3."}
     ]},

    {id:"ladder", nav:"Medication", title:"Drug treatment \u2014 sertraline first, start low, judge at 12 weeks", sub:"SSRIs are first-line for all anxiety disorders. Benzodiazepines are not recommended for long-term management.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1st", title:"Sertraline \u2014 first-line, most cost-effective SSRI", when:"Step 3, or marked symptoms",
          html:"Sertraline 25\u201350 mg OD \u2014 half the depression starting dose \u2014 titrating to 100\u2013200 mg (titrate to 100 mg at 4\u20136 weeks if response is inadequate; maximum 200 mg/day). First-line for <b>GAD, panic disorder, social anxiety, PTSD and OCD</b>. Warn explicitly that it may increase anxiety and agitation in the first 1\u20132 weeks \u2014 common, transient; reassure and persist, reducing the dose temporarily if severe. Take with food. Escitalopram 10 mg OD is equally effective with possibly better tolerability. Paroxetine is licensed for all anxiety disorders but avoid it \u2014 the highest discontinuation-syndrome risk and hardest to stop."},
         {step:"2nd", title:"Alternative SSRI, then an SNRI", when:"sertraline not tolerated or ineffective",
          fromLabel:"after an adequate dose and time",
          html:"Another SSRI (<b>escitalopram 5\u201310\u201320 mg</b>). Then an SNRI: <b>venlafaxine MR 75\u2013225 mg OD</b> (titrate to 150 mg after 2 weeks if tolerated; <b>monitor BP \u2014 the noradrenergic effect raises it</b>; significant discontinuation syndrome, taper slowly), or <b>duloxetine 30\u201360 mg OD</b> \u2014 useful with comorbid pain or depression. <b>Each needs an adequate trial before moving on.</b>"},
         {step:"3rd", title:"Pregabalin \u2014 effective, but with real caution", when:"SSRI and SNRI failed or not tolerated",
          fromLabel:"third-line",
          html:"Pregabalin 75 mg BD, titrating to 150\u2013600 mg/day in 2\u20133 divided doses \u2014 licensed for GAD, with <b>anxiolytic effect within days</b> unlike the SSRI\u2019s 2\u20134 week onset. But: Class C controlled drug (Schedule 3 in England \u2014 CD prescription requirements); misuse and dependence potential, especially with a substance-use history; sedation; weight gain; withdrawal; and respiratory depression with opioids (MHRA). Screen for substance misuse before prescribing \u2014 do not prescribe in active opioid use disorder. Never stop abruptly. <b>Not recommended for panic disorder or PTSD.</b>"},
         {step:"Adjunct", title:"Short-term bridging only", when:"while awaiting SSRI effect or therapy",
          fromLabel:"symptomatic",
          html:"<b>Propranolol 10\u201340 mg PRN</b> for somatic symptoms (palpitations, tremor, flushing) \u2014 <b>no effect on the cognitive or psychological core</b>; useful for performance anxiety, taken 1 hour before. <b>Contraindicated in asthma, bradycardia and heart block.</b> <b>Hydroxyzine 25 mg TDS or nocte</b> \u2014 non-addictive antihistamine anxiolytic, sedating, useful if insomnia is prominent. <b>Buspirone 5 mg TDS titrating to 15 mg TDS</b> \u2014 non-addictive, slow onset over 2\u20134 weeks, a useful GAD adjunct with low abuse potential."},
         {step:"Judge", title:"The 12-week rule", when:"assessing response",
          fromLabel:"the discipline that prevents serial under-treatment",
          html:"Anxiety responds more slowly than depression \u2014 allow up to 12 weeks at an adequate dose before declaring failure, with 6\u20138 weeks for a partial response then optimisation. <b>Responder = \u226550% GAD-7 reduction.</b> <b>Premature switching is serial under-treatment.</b> Success is restored function, not zero worry."},
         {step:"Last", title:"Benzodiazepines \u2014 last resort, time-limited", when:"crisis only",
          fromLabel:"never long-term",
          html:"Maximum 2\u20134 weeks, with a fixed end date on the prescription \u2014 not open-ended PRN. <b>Diazepam 2\u20135 mg TDS PRN or lorazepam 0.5\u20131 mg PRN only.</b> <b>Not for PTSD \u2014 they worsen outcomes.</b> They block the habituation and exposure learning that recovery requires."}
       ]},
       {b:"table", head:["Side effect / issue","Detail","Fix"], rows:[
         ["<b>Early jitteriness or worse anxiety</b>","SSRIs, first 1\u20132 weeks \u2014 the commonest reason anxious patients quit","<b>Half-dose start, pre-warn, review early</b>; short-term propranolol 10\u201340 mg can bridge the physical symptoms (not in asthma)"],
         ["<b>Activation syndrome</b>","Young adults, first 2 weeks \u2014 agitation, impulsivity, energy before the anxiolytic effect","Watch for emergent suicidal ideation; review urgently or contact the crisis team (MHRA guidance, especially under 30)"],
         ["Sexual dysfunction","SSRIs and SNRIs, over 50%","Ask \u2014 they will not volunteer it; dose-reduce or switch"],
         ["Discontinuation syndrome","Paroxetine and venlafaxine worst","<b>Taper slowly and proportionately</b>; warn never to stop abruptly"],
         ["Hyponatraemia","Elderly, SSRI plus a diuretic","Sodium at 2\u20134 weeks in those at risk"],
         ["Bleeding risk","SSRI with an NSAID or anticoagulant","PPI cover, or switch"]
       ]},
       {b:"why", html:"The transient worsening of anxiety in the first 1\u20132 weeks is a real pharmacological effect, caused by acute stimulation of anxiogenic 5-HT2C receptors before the anxiolytic down-regulation of 5-HT1A receptors has occurred. Patients who are not warned frequently stop within the first week, concluding it is making them worse. A brief explanation at prescription \u2014 \u201cyou may feel slightly more anxious or jittery for the first 1\u20132 weeks; this is common and temporary, and it will start to help from week 2\u20134\u201d \u2014 dramatically improves adherence. Pregabalin\u2019s 2019 scheduling as a Class C controlled drug followed evidence of significant misuse, particularly in opioid use disorder."}
     ]},

    {id:"specific", nav:"Duration &amp; specifics", title:"Treatment duration, and the disorder-specific rules", sub:"Premature discontinuation is the commonest cause of relapse — counsel every patient at initiation.",
     blocks:[
       {b:"dl", rows:[
         ["<b>Duration</b>","Continue an effective SSRI for at least 12 months after response, then taper slowly. Minimums by disorder: at least 6 months after remission for GAD and panic disorder; at least 12 months for social anxiety (high relapse rate on discontinuation); minimum 12 months at full therapeutic dose for OCD; minimum 12 months for PTSD (NG116)"],
         ["<b>Panic disorder \u2014 the acute attack</b>","<b>Controlled breathing: the 4-7-8 technique</b> (inhale 4 seconds, hold 7, exhale 8) breaks the hyperventilation cycle. Diaphragmatic breathing. <b>Grounding: 5-4-3-2-1 senses.</b> Cold water on the face activates the dive reflex, slowing the heart via vagal tone. A panic diary to identify triggers. Interoceptive exposure is delivered in CBT. Avoid A&amp;E for panic attacks \u2014 it reinforces the belief that they are medically dangerous"],
         ["<b>OCD \u2014 higher doses</b>","OCD needs higher SSRI doses than depression: sertraline up to 200 mg/day, fluoxetine up to 60 mg/day, fluvoxamine 300 mg/day (licensed for OCD). <b>Minimum 12-week trial before concluding it is ineffective.</b> Augmentation with <b>clomipramine 25\u201375 mg</b> (specialist initiation), aripiprazole or risperidone. ERP is essential \u2014 an SSRI alone is less effective than SSRI plus ERP"],
         ["<b>Health anxiety \u2014 avoid the reassurance trap</b>","Reassurance-seeking is the compulsion of health anxiety \u2014 repeated reassurance maintains the disorder. Instead: acknowledge the distress without confirming the feared illness, explain the reassurance cycle, and redirect to psychological treatment. Agree that investigations will be performed only where there is a clinical indication \u2014 not in response to anxiety \u2014 and document that rationale clearly"],
         ["<b>Anxiety in the menopause</b>","<b>Oestrogen fluctuation disrupts GABAergic and serotonergic transmission</b>, causing new-onset anxiety and mood instability. New-onset anxiety in a woman in her 40s\u201350s with menstrual irregularity, flushes or sleep disturbance should be managed with HRT as first-line, not an SSRI \u2014 it addresses the hormonal aetiology rather than the symptom (NICE NG23). CBT for menopausal symptoms also helps. Where HRT is contraindicated, SSRIs or venlafaxine are effective for both the vasomotor symptoms and the anxiety"]
       ]},
       {b:"why", html:"The higher SSRI dose requirement in OCD is one of the most clinically important pharmacological principles here \u2014 OCD requires 2\u20133 times the serotonin reuptake inhibition needed for depression (sertraline 200 mg versus 50\u2013100 mg; fluoxetine 60 mg versus 20 mg), thought to reflect a different neurobiological substrate in the orbitofrontal\u2013caudate circuit. A GP who prescribes sertraline 50 mg for OCD and sees no response has under-dosed, not failed the drug. Similarly, patients who attend A&amp;E during panic attacks receive extensive investigation which powerfully reinforces the belief that panic is dangerous \u2014 explaining the panic cycle and teaching controlled breathing gives them something a hundred A&amp;E visits cannot."}
     ]},

    {id:"monitor", nav:"Follow-up", title:"Follow-up, monitoring and safety-netting", sub:"The early review is a patient-safety requirement, not a courtesy.",
     blocks:[
       {b:"table", head:["When","What","Action"], rows:[
         ["<b>1\u20132 weeks after starting</b> (<b>1 week if under 30 or higher risk</b>)","Tolerability and risk","Nausea, agitation, insomnia, increased anxiety (common, transient), activation syndrome \u2014 watch for suicidal ideation in the first 2 weeks. Intolerable early effects \u2192 reduce to 25 mg for 2 more weeks then retry 50 mg. Worsening suicidal ideation \u2192 review urgently or contact the crisis team. Catch the early-jitteriness quit point and reassure that it passes"],
         ["<b>4\u20136 weeks</b>","GAD-7 and PHQ-9 repeat","<b>Responder = \u226550% GAD-7 reduction.</b> No response \u2192 increase the dose (sertraline 50\u2192100 mg). Check the therapy referral was made, accepted, and what the waiting time is \u2014 if waiting &gt;6 weeks with moderate\u2013severe anxiety, escalate the SSRI dose rather than waiting. Review lifestyle progress: was the caffeine reduction achieved?"],
         ["<b>3 months \u2014 the formal judge point</b>","Remission (GAD-7 &lt;8)?","<b>Yes \u2192 agree the continuation plan (12 months from response).</b> <b>No \u2192 review the diagnosis first</b> (was this PTSD, OCD or health anxiety needing a specific pathway?), confirm adequate dose and duration, confirm therapy engagement, then consider venlafaxine. Functional review: are work, relationships and activities improving alongside the scores?"],
         ["Discontinuation","Taper","<b>Taper SSRIs over at least 4\u20138 weeks, longer if taken over a year</b>, with smaller steps at the end. Pregabalin: never stop abruptly \u2014 withdrawal seizure risk; taper 25\u201350 mg/week. Benzodiazepine dependence: structured taper (Ashton manual) \u2014 diazepam substitution then 10% reduction of the current dose every 1\u20132 weeks; refer the community drug and alcohol team. Distinguish withdrawal (days, physical) from relapse (weeks, the worry returns)"],
         ["Long term","Annual review","GAD-7 and PHQ-9 with the trend documented. Anxiety disorders are episodic \u2014 relapse is common and does not represent failure. Re-refer promptly on relapse (waiting lists exist). <b>MBCT for recurrent anxiety.</b> Help the patient recognise their own relapse signature. Re-screen for depression, alcohol self-medication, and whether the therapy actually happened"]
       ]},
       {b:"cards", items:[
         
       ]},
       {b:"cards", items:[
         {tone:"red", h:"\ud83d\udd34 Crisis \u2014 save these now", html:"\u201cIf you ever feel unsafe or have thoughts of harming yourself \u2014 <b>999 or A&amp;E, NHS 111 option 2, Samaritans 116 123</b>.\u201d Same-day: active suicidal ideation at any follow-up; activation syndrome with suicidal ideation in the first 2 weeks; benzodiazepine or alcohol withdrawal seizure risk (tremor, sweating, confusion) \u2192 hospital assessment."},
         {tone:"amber", h:"\u26a0\ufe0f The first fortnight", html:"\u201cIf you feel more anxious or agitated, or get new dark thoughts, in the first couple of weeks \u2014 contact us the same day. It is a known early effect and we act on it.\u201d"},
         {tone:"amber", h:"\ud83d\udc8a Don\u2019t stop dead", html:"\u201cThese aren\u2019t addictive, but stopping suddenly can make you feel dizzy and unwell \u2014 we always reduce them slowly together.\u201d"},
         {tone:"amber", h:"\ud83d\udd34 Urgent, same week", html:"Significantly increased anxiety on a new SSRI not settling after 2 weeks; new panic attacks in someone previously stable; <b>unexpected pregabalin dose-escalation request (misuse risk)</b>; new PTSD symptoms emerging during generic anxiety treatment."},
         {tone:"green", h:"\u2615 Self-help starts working first", html:"\u201cCutting caffeine and alcohol, and the breathing techniques, start working before any tablet does.\u201d"}
       ]},
       {b:"say", html:"Two things to expect. First, this type of tablet can make you feel a bit MORE wired for the first week or two \u2014 that\u2019s temporary and actually a sign it\u2019s active; ring me rather than stopping it. Second, it works slowly for anxiety \u2014 we judge it properly at around three months, not three weeks. And the talking therapy does at least as much of the work, so let\u2019s get that going alongside."},
       {b:"why", html:"The 2-week review carries the same patient-safety imperative as in depression \u2014 the MHRA warning about increased suicidal ideation early in SSRI treatment applies equally to anxiety disorders, and anxiety patients have an independently elevated suicide risk. A 2-week review (a phone call is acceptable) is the minimum standard and should be documented. Benzodiazepine dependence is a major iatrogenic problem: around 1.5 million people in the UK are estimated to be dependent on prescribed benzodiazepines or Z-drugs. The <b>Ashton manual</b> is the gold-standard withdrawal guide \u2014 switch to a diazepam equivalent, then reduce by 10% <em>of the current dose</em> every 1\u20134 weeks. Do not attempt rapid withdrawal in the community without specialist support, because of seizure risk."}
     ]},

    {id:"loop", nav:"Not responding?", title:"Not responding? Run this before switching or referring", sub:"",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"1 · Adequate trial?", html:"Right dose, actually taken, for a genuine 12 weeks (not 3)?"},
         {tone:"amber", h:"2 · The mimics", html:"Thyroid re-checked? Caffeine/energy drinks, alcohol, stimulants, cannabis withdrawal honestly quantified?"},
         {tone:"blue", h:"3 · Right diagnosis?", html:"Panic disorder, PTSD, OCD, social anxiety, health anxiety — different therapy pathways. Bipolar (anxiety can herald a mixed state)?"},
         {tone:"blue", h:"4 · Comorbid depression", html:"Untreated depression under the anxiety → treat it; drives non-response."},
         {tone:"blue", h:"5 · Therapy on board?", html:"CBT actually accessed, or drug alone? Combination beats either."},
         {tone:"blue", h:"6 · Self-medication", html:"Alcohol or benzodiazepines masking and worsening it — address before escalating."}
       ]},
       {b:"cards", items:[
         {tone:"green", h:"All six confirmed?", html:"Then switch or refer \u2014 most \u201ctreatment-resistant\u201d anxiety fails one of the six rather than needing a third agent."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer \u2014 and specify the track", sub:"Naming the suspected disorder on the referral is the clinical action that gets the right therapy delivered.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same-day / 999", html:"<b>Active suicidal ideation with a plan \u2192 crisis team or 999.</b> Severe self-neglect. <b>Thyroid storm</b> (hyperpyrexia, tachycardia, anxiety, altered consciousness) \u2192 999. Suspected phaeochromocytoma crisis (BP &gt;200/120 with headache, sweating and severe anxiety) \u2192 999. Panic attack with chest pain and ECG changes \u2192 999."},
         {tone:"plain", h:"NHS Talking Therapies \u2014 mild to moderate", html:"<b>GAD-7 5\u201315: self-refer or GP refer.</b> Step 2 psychoeducation, guided self-help, computerised CBT. Step 3 individual CBT 12\u201316 sessions or group CBT. <b>Self-referral is available online in most areas \u2014 give the link.</b>"},
         {tone:"amber", h:"NHS Talking Therapies \u2014 specialist tracks", html:"PTSD \u2192 trauma-specialist track (TF-CBT or EMDR) \u2014 specify trauma on the referral and do NOT use the generic anxiety pathway. <b>OCD \u2192 OCD-specialist track</b>, or OCD UK / OCD Action. Health anxiety \u2192 specific health-anxiety CBT track, not generic CBT. <b>Social anxiety \u2192 Clark model group CBT.</b>"},
         {tone:"plain", h:"CMHT / psychiatry \u2014 Step 4", html:"Severe anxiety (GAD-7 \u226515) with significant impairment not responding to therapy plus an SSRI; <b>complex PTSD</b> (chronic trauma, borderline personality comorbidity, dissociation); <b>OCD with rituals &gt;3 hours/day</b>; comorbid psychosis; high suicide risk needing intensive support; treatment-resistant anxiety \u2014 two adequate SSRI trials failed with CBT completed."},
         {tone:"plain", h:"Endocrinology / cardiology", html:"<b>Confirmed hyperthyroidism \u2192 endocrinology</b> (carbimazole, radioiodine). <b>Elevated metanephrines \u2192 endocrinology urgently.</b> <b>WPW on ECG \u2192 cardiology for electrophysiology and ablation.</b> Arrhythmia \u2192 cardiology. Carcinoid \u2192 gastroenterology or oncology."},
         {tone:"plain", h:"Perinatal", html:"Moderate or worse anxiety in pregnancy or the postnatal period \u2192 perinatal mental health team, with a low threshold."},
         {tone:"cream", h:"Social prescribing", html:"Where anxiety is driven by social determinants \u2014 <b>debt, housing, isolation, loneliness</b> \u2014 refer to the PCN social prescribing link worker, plus Citizens Advice for financial anxiety and Mind or Rethink for peer support. <b>Peer contact specifically reduces shame.</b>"}
       ]},
       {b:"say", html:"You\u2019ve given a fair trial to the treatment and you\u2019re still struggling more than you should \u2014 that\u2019s a reason to bring in the specialist team for the therapies and options they can add, not a sign you\u2019ve failed. We keep going here alongside them."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only \u2014 the Casebook keeps the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 47-year-old woman with six months of worry, palpitations and poor sleep. GAD-7 16, PHQ-9 11. She drinks four coffees and two energy drinks daily, her periods have become irregular, and she has had two normal ECGs at A&amp;E for \u201cheart racing\u201d. She wants \u201csomething to calm me down\u201d."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Checks <b>TFTs</b> and quantifies the <b>caffeine load</b> before labelling; recognises the perimenopausal pattern and considers HRT first-line rather than an SSRI; scores <b>both GAD-7 and PHQ-9</b> and addresses the comorbid depression; <b>asks directly about self-harm</b>; explains why repeat A&amp;E attendance reinforces the fear; declines a benzodiazepine with a reason rather than a refusal; offers <b>NHS Talking Therapies self-referral</b>; and if starting sertraline, starts at 25\u201350 mg with the early-jitteriness warning and a 2-week review. <a href='../../cases/anxiety.html'>Open the full casebook chapter \u2192</a>"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>NICE CG113 \u2014 Generalised anxiety disorder and panic disorder in adults (2011, updated 2019)<br><a href="https://www.nice.org.uk/guidance/cg113" rel="noopener">nice.org.uk/guidance/cg113</a><span class="rd"> \u2014 the stepped-care model, psychological therapy before medication, sertraline as first-line, pregabalin as an option, the recommendation to record GAD-7 at every contact, and the advice against benzodiazepines beyond short-term use. <b>Note on guideline numbering:</b> the legacy pathway cited stepped care as \u201cNG197\u201d; the current NICE anxiety guidance is <b>CG113</b>, which is what this page follows</span></li>'+
         '<li><b>NICE NG116 \u2014 Post-traumatic stress disorder (2018)</b><br><a href="https://www.nice.org.uk/guidance/ng116" rel="noopener">nice.org.uk/guidance/ng116</a><span class="rd"> \u2014 trauma-focused CBT or EMDR as first-line for all PTSD, with drug treatment second-line; minimum 12 months of pharmacological treatment where used</span></li>'+
         '<li>NICE CG31 \u2014 Obsessive-compulsive disorder and body dysmorphic disorder (2005)<span class="rd"> \u2014 exposure and response prevention, and the higher SSRI doses required in OCD</span></li>'+
         '<li><b>NICE NG23 \u2014 Menopause: diagnosis and management</b><span class="rd"> \u2014 HRT and CBT for menopausal mood and anxiety symptoms</span></li>'+
         '<li>MHRA \u2014 SSRI safety guidance (2004, updated 2014); MHRA pregabalin and gabapentin advice<span class="rd"> \u2014 suicidal ideation early in treatment particularly under 30; the 2019 reclassification of pregabalin as a Class C controlled drug, and respiratory depression with opioids</span></li>'+
         '<li><b>Spitzer et al., Archives of Internal Medicine 2006</b><span class="rd"> \u2014 development and validation of the GAD-7, and the \u226510 cut-off with 89% sensitivity and 82% specificity</span></li>'+
         '<li>Cipriani et al., Lancet 2018; Bandelow et al., Dialogues in Clinical Neuroscience 2017<span class="rd"> \u2014 comparative antidepressant efficacy, and anxiety-disorder pharmacotherapy</span></li>'+
         '<li><b>Ashton benzodiazepine withdrawal manual (Newcastle University)</b><span class="rd"> \u2014 the diazepam-substitution taper, endorsed for structured benzodiazepine withdrawal</span></li>'+
         '<li><b>Borkovec et al. \u2014 worry postponement; Kabat-Zinn \u2014 MBSR</b><span class="rd"> \u2014 the two brief non-drug techniques with the best primary-care evidence</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> \u2014 all doses: sertraline, escitalopram, venlafaxine, duloxetine, pregabalin, propranolol, hydroxyzine, buspirone, clomipramine, and the benzodiazepines</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Anxiety disorders in adults \u2014 NICE CG113 (GAD and panic disorder), NG116 (PTSD), CG31 (OCD) and NG23 (menopause), with MHRA SSRI and pregabalin safety guidance. Assessment and management are merged on this page; there is no separate anxiety pathway to cross-check. Verify all doses against the current BNF before prescribing, and check your local NHS Talking Therapies pathways and self-referral routes."
