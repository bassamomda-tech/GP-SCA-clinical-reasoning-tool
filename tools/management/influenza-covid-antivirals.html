<script>
MG.render({ snapshot:"summaries/influenza-covid-antivirals.html",
  icon:"🦠",
  title:"Influenza and COVID-19 antivirals",
  eyebrow:"Protocol · assess and treat in one place",
  stemTitle:"Spot the patient who needs hospital, then match the antiviral to the virus, the risk group and the clock",
  stemSub:"One page for prescribing antivirals for influenza and COVID-19 in primary care. First find the patient who is too unwell for an antiviral at home. For influenza, treat people in at-risk groups (and anyone at risk of complications) with oseltamivir while flu is circulating, ideally within 48 hours. For COVID-19, identify the smaller group at highest risk under NICE TA878 and TA1056, and get them assessed by the local COVID-19 treatment service within 5 days of symptoms. Check interactions before nirmatrelvir plus ritonavir, adjust doses for kidney function, and use the consultation to check vaccination.",
  guideline:"UKHSA influenza antiviral guidance (updated November 2025) · NICE TA878 (2023, updated 2025) · NICE TA1056 (2025, updated February 2026) · NICE TA971 (2024) · NICE NG143 (2019, updated 2021) · Green Book ch.14a and ch.19 · oseltamivir, zanamivir, Paxlovid and molnupiravir SPCs",
  reviewed:"15 October 2026",
  nextReview:"15 April 2027",
  meta:[
    {t:"UKHSA 2025 · influenza treatment and prophylaxis"},
    {t:"NICE TA878 · nirmatrelvir plus ritonavir"},
    {t:"NICE TA1056 · molnupiravir"},
    {t:"Green Book ch.19 and ch.14a · vaccines"},
    {t:"No NG12 cancer criterion applies", tone:"tw"},
    {t:"v1.0 · reviewed Oct 2026", tone:"ok"}
  ],
  lead:"<div class='mg-layers'><a href='#redflags'><b>Red flags</b><small>hypoxia, sepsis, confusion</small></a><a href='#flu'><b>Influenza</b><small>at-risk groups · 48 hours</small></a><a href='#covid'><b>COVID-19</b><small>highest-risk groups · 5 days</small></a><a href='#interactions'><b>Paxlovid</b><small>check every interaction</small></a><a href='#vaccines'><b>Vaccines</b><small>flu and COVID-19</small></a></div>",
  quickSub:"Six cards for the consultation. Each one traces to a named source under <a href='#provenance'>Evidence</a>. Eligibility for COVID-19 treatments has changed several times since 2023, so check the current NICE and NHS England lists.",
  quick:[
    {tone:"red", h:"Too unwell for tablets at home? Hospital first", html:"Breathlessness at rest, oxygen saturation below 94% on air (or below the patient's usual target in chronic lung disease), signs of sepsis, chest pain, dehydration or a rapidly worsening course need <b>same-day hospital assessment</b>; call <b>999</b> for severe respiratory distress, cyanosis, reduced consciousness, or suspected sepsis with any NICE NG253 high-risk criterion (respiratory rate 25 or more, heart rate above 130, systolic blood pressure 90 or less, or new confusion or altered mental state). An antiviral does not replace admission. In children, use the NICE NG143 traffic-light system."},
    {tone:"cream", h:"Influenza: treat at-risk groups while flu is circulating", html:"When UKHSA surveillance shows flu circulating in the community (or in a local outbreak), offer an antiviral to people in a <b>clinical at-risk group</b> or at risk of complications: aged <b>65 or over</b>, <b>pregnant</b> (and up to 2 weeks after delivery), under 6 months old, chronic heart, lung, kidney, liver or neurological disease, diabetes, <b>immunosuppression</b> or a <b>BMI of 40 or more</b>. Start within <b>48 hours</b> of symptom onset where possible; later treatment can still be considered in severe illness or severe immunosuppression. Previously healthy people usually need no antiviral."},
    {tone:"cream", h:"Oseltamivir first line; zanamivir if resistance is a concern", html:"<b>Oseltamivir 75 mg twice daily for 5 days</b> for most adults (reduce if creatinine clearance is 60 mL/min or less). Use <b>inhaled zanamivir</b> when oseltamivir resistance is suspected or known, or when it cannot be taken by mouth, taking specialist or virology advice in severe immunosuppression. Since <b>October 2025</b> NHS prescribing of these drugs is no longer limited to periods announced by the Chief Medical Officer, but the clinical trigger is still flu circulating."},
    {tone:"amber", h:"COVID-19: a small, highest-risk group only", html:"NICE recommends <b>nirmatrelvir plus ritonavir</b> (Paxlovid) for adults with COVID-19 who do not need supplemental oxygen and are at the <b>highest risk</b> of severe disease (the TA878 section 5 list, for example significant immunosuppression, solid organ or stem cell transplant, some cancers on treatment, chronic kidney disease stage 4 or 5, advanced liver disease, Down's syndrome and some rare neurological conditions). The groups added in 2024 (aged 70 or over, BMI 35 or more, diabetes, heart failure) were <b>removed in 2025</b>. Treatment starts within <b>5 days</b> of symptom onset after a positive test."},
    {tone:"red", h:"Paxlovid: check every interaction before it is prescribed", html:"Ritonavir strongly inhibits CYP3A4. It is contraindicated with drugs such as <b>amiodarone</b>, <b>simvastatin</b>, some anti-epileptics and rifampicin, and needs a plan for <b>DOACs, tacrolimus, ciclosporin and many statins</b>. Use the <a href='https://www.covid19-druginteractions.org/' target=_blank rel=noopener>Liverpool COVID-19 interaction checker</a> and the SPC. Reduce the dose if eGFR is 30–60; avoid if eGFR is below 30 or there is severe hepatic impairment. <b>Molnupiravir</b> is the option only when nirmatrelvir plus ritonavir is contraindicated or unsuitable (NICE TA1056)."},
    {tone:"green", h:"Prevention: vaccinate, and protect contacts", html:"Use the consultation to check <b>flu vaccine</b> and <b>COVID-19 vaccine</b> eligibility for the current season (Green Book chapters 19 and 14a). For influenza, <b>post-exposure prophylaxis</b> with oseltamivir or zanamivir can be offered to at-risk contacts who are unvaccinated, or vaccinated but unlikely to be protected, within 48 hours (oseltamivir) or 36 hours (zanamivir) of exposure. Care home outbreaks go through the local health protection team."}
  ],
  pathwaySub:"Five moves. Step one is where the harm happens if it is missed.",
  pathway:[
    {title:"Assess severity first", html:"Observations including oxygen saturation, respiratory rate, pulse, blood pressure, temperature and mental state. Use NEWS2 in adults where your service does, and the NG143 traffic-light system in children. Unwell patients go to hospital the same day, whatever the antiviral plan.", alert:true},
    {title:"Which virus, and is it circulating?", html:"Check local and national surveillance for influenza. Test where it changes management: a lateral flow test for COVID-19 in someone potentially eligible for treatment, and influenza testing where local pathways support it (care homes, immunosuppression, hospital). Do not delay influenza treatment for a test result in an at-risk patient during the season."},
    {title:"Is this patient in a risk group?", html:"Influenza: the UKHSA clinical at-risk groups, plus anyone you judge at risk of complications. COVID-19: only the NICE TA878 highest-risk list, checked against the current NHS England version."},
    {title:"Choose and check the drug", html:"Oseltamivir (or zanamivir) for influenza; nirmatrelvir plus ritonavir first line for COVID-19, molnupiravir only if that is contraindicated or unsuitable. Check creatinine clearance or eGFR, pregnancy, and for Paxlovid every interaction, including over-the-counter and herbal products such as St John's wort."},
    {title:"Safety-net, isolate and vaccinate", html:"Explain the warning signs, how long symptoms usually last, and when to come back. Give advice on staying away from others while unwell or feverish. Offer prophylaxis to eligible flu contacts and check vaccination status."}
  ],
  sections:[
    {id:"redflags", nav:"Red flags", title:"Red flags: who needs hospital, not a prescription", sub:"Most influenza and COVID-19 is managed at home. These features need assessment the same day or a 999 call.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Call 999", html:"Severe breathlessness or respiratory distress, cyanosis, inability to complete sentences, new confusion with reduced consciousness, signs of shock, or a seizure. Suspected sepsis with any high-risk criterion (respiratory rate 25 or more, heart rate above 130, systolic blood pressure 90 or less, or new confusion or altered mental state): 999 with a pre-alert to hospital. In children: grunting, marked chest recession, apnoea, a weak high-pitched or continuous cry, or not responding to social cues.", src:"NICE NG253 and NG254 (2025) · NICE NG143 (2019, updated 2021)"},
         {tone:"red", h:"🔴 Same-day hospital assessment", html:"Oxygen saturation below 94% on air (below 92% is a common admission threshold; use the patient's own target in chronic lung disease), signs of pneumonia with systemic upset, or suspected sepsis at moderate-to-high risk (for example respiratory rate 21 to 24, heart rate 91 to 130, systolic blood pressure 91 to 100) that cannot be managed safely at home. Also: severe dehydration, or a rapid deterioration on day 5 to 10 of COVID-19.", src:"NICE NG253 (2025) · NICE NG191 (2021, updated 2023)"},
         {tone:"amber", h:"🟠 Influenza complications to look for", html:"Secondary bacterial pneumonia (worsening after initial improvement, purulent sputum, focal chest signs), myocarditis, encephalitis, and decompensation of chronic disease (asthma, COPD, heart failure, diabetes). Treat a secondary pneumonia as community-acquired pneumonia under NICE NG250.", src:"UKHSA influenza antiviral guidance (2025) · NICE NG250 (2025)"},
         {tone:"amber", h:"🟠 Children under 5 and infants", html:"Infants under 6 months are an at-risk group for influenza. Assess any febrile child with the NICE NG143 traffic-light system and safety-net carefully. Antiviral doses for children come from the BNFC.", src:"NICE NG143 (2019, updated 2021) · UKHSA influenza antiviral guidance (2025)"}
       ]},
       {b:"why", html:"Antivirals shorten illness and reduce complications in higher-risk people, but they are not a treatment for respiratory failure or sepsis. The mistake to avoid is prescribing an antiviral and sending home a hypoxic or septic patient because the diagnosis feels settled."}
     ]},

    {id:"flu", nav:"Influenza", title:"Influenza: who gets an antiviral", sub:"The decision rests on three things: is flu circulating, is the patient in a risk group, and how long have they been ill?",
     blocks:[
       {b:"table", head:["Patient","Uncomplicated influenza","Complicated influenza (pneumonia, needing hospital, or exacerbating a chronic condition)"], rows:[
         ["<b>Previously healthy, not in a risk group</b>","No antiviral needed for most. Treat if you judge they are at serious risk of complications.","Oseltamivir; assess in hospital where indicated."],
         ["<b>Clinical at-risk group</b> (not severely immunosuppressed)","<b>Offer oseltamivir</b>, ideally within <b>48 hours</b> of onset. Starting later is off-label but can be considered on clinical judgement.","Oseltamivir, even after 48 hours; most need hospital assessment."],
         ["<b>Severely immunosuppressed</b>","<b>Offer oseltamivir</b>, starting even after 48 hours. If oseltamivir resistance is suspected or known, or the patient is not improving, discuss with virology or the specialist team about zanamivir.","Same-day hospital assessment; specialist and virology advice on the agent and duration."]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"🧾 The clinical at-risk groups", html:"Aged <b>65 or over</b>; <b>pregnant</b>, including up to 2 weeks after delivery; children <b>under 6 months</b>; chronic respiratory disease (including asthma needing inhaled or oral steroids); chronic heart, kidney, liver or neurological disease (including learning disability); diabetes; immunosuppression (disease or treatment, including asplenia); <b>BMI of 40 or more</b>. Residents of care homes are treated as at risk in outbreaks.", src:"UKHSA influenza antiviral guidance (2025)"},
         {tone:"blue", h:"📈 When flu is 'circulating'", html:"UKHSA publishes weekly surveillance. Antivirals are indicated when it shows influenza circulating in the community above baseline, or when there is a confirmed local outbreak (for example a care home). Since <b>1 October 2025</b>, NHS prescriptions for oseltamivir and zanamivir are no longer restricted to periods announced by the Chief Medical Officer, so a GP can prescribe out of season when clinically indicated (for example a laboratory-confirmed case or an outbreak).", src:"UKHSA influenza antiviral guidance (2025) · DHSC change to prescribing regulations (2025)"},
         {tone:"cream", h:"⏱️ The 48-hour window", html:"Benefit is greatest when treatment starts within 48 hours of symptom onset. The SPC licence for treatment is within 2 days. UKHSA supports later treatment, off-label, in severely immunosuppressed people and those with severe or complicated illness, where viral replication may continue.", src:"Oseltamivir SPC · UKHSA influenza antiviral guidance (2025)"},
         {tone:"cream", h:"🧪 Testing", html:"A test is not needed to treat an at-risk patient with influenza-like illness while flu is circulating. Testing helps in outbreaks, in severe immunosuppression, out of season, and when it would change infection-control decisions. Use local laboratory or point-of-care pathways.", src:"UKHSA influenza antiviral guidance (2025)"}
       ]}
     ]},

    {id:"fluRx", nav:"Flu doses", title:"Influenza: drugs, doses and prophylaxis", sub:"Doses are for adults. Children's doses depend on age and weight: use the BNFC.",
     blocks:[
       {b:"table", head:["Drug","Treatment (adults)","Post-exposure prophylaxis (adults)","Practical points"], rows:[
         ["<b>Oseltamivir</b> (oral)","<span class=mg-dose>Usual adult dose: 75 mg twice daily for 5 days (SPC; check the SPC, BNF and local formulary; <a href='https://www.medicines.org.uk/emc/search?q=oseltamivir' target=_blank rel=noopener>SPC: oseltamivir</a>).</span>","<span class=mg-dose>75 mg once daily for 10 days, starting within 48 hours of exposure (SPC).</span>","First line for most. Renal adjustment by creatinine clearance (below). Nausea is common; take with food. Capsules can be opened and mixed with something sweet, and an oral suspension exists. Severely immunosuppressed patients may need a longer course on specialist advice."],
         ["<b>Zanamivir</b> (inhaled)","<span class=mg-dose>Usual adult dose: 10 mg (two inhalations) twice daily for 5 days (SPC; check the SPC, BNF and local formulary; <a href='https://www.medicines.org.uk/emc/search?q=zanamivir' target=_blank rel=noopener>SPC: zanamivir</a>).</span>","<span class=mg-dose>10 mg once daily for 10 days, starting within 36 hours of exposure (SPC).</span>","For suspected or known oseltamivir resistance, or when oral treatment is unsuitable. Can cause <b>bronchospasm</b>: caution in asthma and COPD, with a short-acting bronchodilator to hand. The inhaler needs a reasonable technique. Intravenous zanamivir is hospital-only."]
       ]},
       {b:"table", head:["Creatinine clearance","Oseltamivir treatment","Oseltamivir prophylaxis"], rows:[
         ["More than 60 mL/min","75 mg twice daily","75 mg once daily"],
         ["More than 30 to 60 mL/min","30 mg twice daily","30 mg once daily"],
         ["More than 10 to 30 mL/min","30 mg once daily","30 mg every other day"],
         ["10 mL/min or less, or dialysis","Not routinely recommended: seek renal or specialist advice (SPC)","Seek renal or specialist advice"]
       ]},
       {b:"info", html:"<b>Renal function.</b> UKHSA advises that if renal function documented in the last 6 months shows no impairment, the standard dose can be prescribed without waiting for a new test. Where impairment is likely (older, frail, known CKD) and no recent result exists, use clinical judgement and the SPC table rather than delaying treatment."},
       {b:"cards", cols:2, items:[
         {tone:"cream", h:"🛡️ Who gets prophylaxis", html:"Offer post-exposure prophylaxis to people in a clinical at-risk group who have had close contact with a case of influenza-like illness in the same household or residential setting while flu is circulating, and who are <b>unvaccinated</b>, vaccinated less than 14 days ago, or vaccinated but unlikely to be protected (for example severe immunosuppression or a poorly matched vaccine). In a care home outbreak, prophylaxis may be offered regardless of vaccination status on health protection team advice.", src:"UKHSA influenza antiviral guidance (2025)"},
         {tone:"amber", h:"🏠 Care home outbreaks", html:"Two or more linked cases of influenza-like illness within 48 hours in a care home: report to the <b>local health protection team</b>, which advises on testing, treatment of cases and prophylaxis for residents. Local commissioned services often supply antivirals out of hours.", src:"UKHSA acute respiratory infection outbreaks in care homes guidance"}
       ]}
     ]},

    {id:"covid", nav:"COVID-19", title:"COVID-19: who is eligible for treatment in the community", sub:"Community COVID-19 treatment is for a small highest-risk group, not for everyone with risk factors. The list is set by NICE and applied by NHS England.",
     blocks:[
       {b:"kv", rows:[
         ["Who","Adults (and for some agents, young people aged 12 or over) with <b>symptomatic COVID-19</b> confirmed by a test, who <b>do not need supplemental oxygen</b>, and who are in a group at <b>increased risk of progression to severe COVID-19</b> as defined in NICE TA878 section 5."],
         ["Highest-risk groups (examples)","Down's syndrome and other chromosomal disorders affecting immunity · solid cancer on active treatment, or haematological malignancy · sickle cell disease · immune-mediated inflammatory disease on immunosuppressants or biologics · primary immunodeficiency · HIV with a low CD4 count or uncontrolled disease · solid organ or stem cell transplant · rare neurological conditions (for example multiple sclerosis, motor neurone disease, myasthenia gravis, Huntington's disease) · advanced liver disease · chronic kidney disease stage 4 or 5, including dialysis. Check the full current list."],
         ["Not now eligible","People eligible only because they are <b>aged 70 or over</b>, have a <b>BMI of 35 or more</b>, <b>diabetes</b> or <b>heart failure</b>: these groups were added in March 2024 and removed when NICE updated TA878 in 2025."],
         ["Timing","Treatment starts within <b>5 days</b> of symptom onset. Patients should test as soon as symptoms start; eligible patients may hold lateral flow tests at home."],
         ["Access","Eligible patients are assessed and treated through the local <b>COVID-19 treatment service</b> (formerly COVID medicine delivery units), now commissioned by integrated care boards. Patients may contact the service, their GP practice or NHS 111. Know your local referral route; GP prescribing depends on what is locally commissioned."]
       ]},
       {b:"table", head:["Drug","NICE position","Usual adult dose","Key cautions"], rows:[
         ["<b>Nirmatrelvir plus ritonavir</b> (Paxlovid, oral)","<b>First line</b> for eligible adults (NICE TA878).","<span class=mg-dose>Usual adult dose: nirmatrelvir 300 mg with ritonavir 100 mg twice daily for 5 days; eGFR 30–60: nirmatrelvir 150 mg with ritonavir 100 mg twice daily (NICE TA878/SPC; check the SPC, BNF and local formulary; <a href='https://www.medicines.org.uk/emc/search?q=paxlovid' target=_blank rel=noopener>SPC: Paxlovid</a>).</span>","Many serious interactions (see below). Not recommended if eGFR is below 30 or in severe hepatic impairment. Avoid in pregnancy unless the benefit clearly outweighs the risk; ritonavir may reduce the effect of combined hormonal contraception, so advise extra precautions."],
         ["<b>Molnupiravir</b> (oral)","Only if nirmatrelvir plus ritonavir is <b>contraindicated or unsuitable</b> (NICE TA1056, updated February 2026).","<span class=mg-dose>Usual adult dose: 800 mg twice daily for 5 days (NICE TA1056/SPC; check the SPC, BNF and local formulary; <a href='https://www.medicines.org.uk/emc/search?q=molnupiravir' target=_blank rel=noopener>SPC: molnupiravir</a>).</span>","<b>Not in pregnancy</b>. Effective contraception for women of childbearing potential during treatment and for 4 days after; for men with a partner who could become pregnant, during treatment and for 3 months after (SPC). Not licensed under 18."],
         ["<b>Sotrovimab</b> (intravenous)","Was second line under TA878; the UK marketing authorisation was <b>discontinued in February 2026</b>.","Not available.","Patients who cannot take either oral agent are discussed with the local COVID-19 treatment service or hospital team."],
         ["<b>Remdesivir</b> (intravenous)","Hospital use for people at high risk of serious illness (NICE TA971, 2024).","Hospital protocol.","Not a primary-care prescription."]
       ]},
       {b:"warn", html:"<b>Sotrovimab.</b> The manufacturer has discontinued sotrovimab in the UK, and in February 2026 NICE removed its recommendation from TA878 and from the molnupiravir guidance (TA1056); only the TA878 title still names it. Check the local COVID-19 treatment service for what is currently available for patients who cannot take nirmatrelvir plus ritonavir or molnupiravir."}
     ]},

    {id:"interactions", nav:"Paxlovid interactions", title:"Nirmatrelvir plus ritonavir: interactions and safe prescribing", sub:"Ritonavir is a potent CYP3A4 inhibitor. Most serious harms come from drugs already on the repeat list.",
     blocks:[
       {b:"table", head:["Group","Examples","Usual plan (confirm with the interaction checker and SPC)"], rows:[
         ["<b>Contraindicated</b>","Amiodarone, dronedarone, flecainide, propafenone; simvastatin, lovastatin; carbamazepine, phenytoin, phenobarbital; rifampicin; St John's wort; ergot derivatives; sildenafil for pulmonary hypertension; midazolam by mouth; lurasidone; colchicine","Do not prescribe Paxlovid; consider molnupiravir. Strong enzyme inducers lower nirmatrelvir levels, and stopping them does not remove the effect for some weeks."],
         ["<b>Pause or adjust</b>","Atorvastatin and rosuvastatin (often paused for the course); apixaban, rivaroxaban, edoxaban; ticagrelor and clopidogrel; tacrolimus, ciclosporin, sirolimus; some calcium-channel blockers; quetiapine; some opioids and benzodiazepines; inhaled or intranasal fluticasone and budesonide (long courses)","Use the checker for each drug. Transplant drugs need the transplant team's advice. Anticoagulant interactions need an individual plan: do not stop an anticoagulant without one."],
         ["<b>Monitor</b>","Warfarin (INR may change); levothyroxine; combined hormonal contraception","Check INR after the course; advise additional contraception for the course and until the next pill packet or 7 days afterwards."]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"red", h:"🔎 Use a checker every time", html:"Check the full medicines list, including hospital-only and specialist drugs, over-the-counter and herbal products, with the <a href='https://www.covid19-druginteractions.org/' target=_blank rel=noopener>University of Liverpool COVID-19 drug interaction checker</a> and the Paxlovid SPC. Record the plan for each interacting drug and when to restart it (usually 3 days after the last Paxlovid dose).", src:"Paxlovid SPC · University of Liverpool interaction resource"},
         {tone:"cream", h:"🧾 Before prescribing", html:"Confirm eligibility and the date symptoms started. Check eGFR (a result in the last 3 months is usually acceptable where kidney function is stable), liver disease and pregnancy status. Explain the common side effects: altered taste, diarrhoea, nausea.", src:"Paxlovid SPC · NICE TA878"}
       ]},
       {b:"say", html:"This medicine works best if it is started in the first five days. It interacts with quite a few other tablets, so I have gone through your list. I would like you to stop your atorvastatin while you take it and restart it three days after the last dose. Do not take any new medicines, including herbal remedies, without checking with a pharmacist first."}
     ]},

    {id:"special", nav:"Special groups", title:"Pregnancy, children, older people and kidney disease", sub:"The groups where the default plan changes.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"🤰 Pregnancy", html:"Pregnant women (and up to 2 weeks after delivery) are an influenza at-risk group: offer <b>oseltamivir</b>, which is the preferred antiviral in pregnancy and breastfeeding. For COVID-19, pregnancy alone is not a TA878 eligibility criterion. <b>Molnupiravir is contraindicated</b>, and nirmatrelvir plus ritonavir is used only if the benefit clearly outweighs the risk, with obstetric and COVID-19 treatment service advice.", src:"UKHSA influenza antiviral guidance (2025) · molnupiravir and Paxlovid SPCs"},
         {tone:"cream", h:"🧒 Children", html:"Children under 6 months, and those with chronic conditions, are influenza at-risk groups. Oseltamivir doses for children are by weight and age (BNFC). Zanamivir inhaled is licensed from 5 years. COVID-19 treatment for children is specialist-led. Assess febrile children with the NICE NG143 traffic-light system.", src:"BNFC · NICE NG143 (2019, updated 2021)"},
         {tone:"amber", h:"👵 Older and frail people", html:"Aged 65 or over is an influenza at-risk group, but for COVID-19, age alone no longer qualifies for treatment. Look for atypical presentations (confusion, falls, reduced intake), check renal function for oseltamivir, and review polypharmacy before Paxlovid.", src:"UKHSA influenza antiviral guidance (2025) · NICE TA878"},
         {tone:"blue", h:"🧾 Kidney disease", html:"Oseltamivir: adjust for creatinine clearance (table above). Paxlovid: reduce the dose at eGFR 30–60 and do not use below 30; CKD stage 4 or 5 is itself a COVID-19 treatment eligibility group, so molnupiravir or a specialist option is often needed.", src:"Oseltamivir and Paxlovid SPCs · NICE TA878"}
       ]}
     ]},

    {id:"vaccines", nav:"Vaccines", title:"Prevention: influenza and COVID-19 vaccines", sub:"Antivirals are an add-on to vaccination, never a substitute.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"💉 Influenza vaccine", html:"Offered every autumn to people aged 65 and over, clinical risk groups aged 6 months and over, pregnant women, children in the eligible age groups (nasal spray), care home residents, carers and frontline health and social care workers. Check the current season's annual flu letter and <a href='https://www.gov.uk/government/publications/influenza-the-green-book-chapter-19' target=_blank rel=noopener>Green Book chapter 19</a> for the exact cohorts and vaccine types.", src:"UKHSA Green Book ch.19 · annual flu letter"},
         {tone:"green", h:"💉 COVID-19 vaccine", html:"Offered in seasonal campaigns to groups advised by JCVI, which have narrowed in recent years (typically adults aged 75 and over, care home residents and people who are immunosuppressed, with the autumn and spring cohorts set each year). Check <a href='https://www.gov.uk/government/publications/covid-19-the-green-book-chapter-14a' target=_blank rel=noopener>Green Book chapter 14a</a> and the current campaign letter.", src:"UKHSA Green Book ch.14a · JCVI advice"},
         {tone:"cream", h:"🤰 Pregnancy", html:"Pregnant women are offered the inactivated flu vaccine at any stage of pregnancy. Check the current COVID-19 campaign for pregnancy advice. RSV and pertussis vaccines are also offered in pregnancy.", src:"UKHSA Green Book ch.19 and ch.14a"},
         {tone:"blue", h:"🩺 After an infection", html:"Vaccinate once the acute illness has resolved; a recent influenza or COVID-19 infection does not remove eligibility. Check the Green Book for any recommended interval after COVID-19.", src:"UKHSA Green Book ch.14a"}
       ]}
     ]},

    {id:"refer", nav:"Refer and safety-net", title:"Refer, follow up and safety-net", sub:"Most patients recover at home. These routes need to be known before the season starts.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999 or same day: hospital", html:"The red flags above: hypoxia, severe breathlessness, confusion, sepsis, chest pain, severe dehydration, or a severely immunosuppressed patient with complicated influenza.", src:"NICE NG253 and NG254 (2025)"},
         {tone:"amber", h:"Within 5 days of symptoms: COVID-19 treatment service", html:"Eligible highest-risk patients with a positive test. Refer the same day you see them: the window is short and assessment of interactions takes time.", src:"NICE TA878 · NHS England commissioning"},
         {tone:"amber", h:"Same day: health protection team", html:"Suspected influenza outbreak in a care home or other closed setting; influenza in an unusual setting or with unusual features (for example avian influenza exposure).", src:"UKHSA outbreak guidance"},
         {tone:"green", h:"Stays in primary care", html:"Uncomplicated influenza, with oseltamivir if at risk; prophylaxis for eligible contacts; COVID-19 in people not eligible for treatment (symptomatic care, isolation advice, safety-net).", src:"UKHSA influenza antiviral guidance (2025)"}
       ]},
       {b:"say", html:"Most people with flu or COVID start to feel better within a week, though tiredness and cough can last a few weeks. Call 999 if you are struggling to breathe, your lips go blue, or you become very drowsy or confused. Contact us or NHS 111 the same day if you are getting more breathless, have chest pain, cannot keep fluids down, or start to feel worse after you seemed to be getting better. Try to stay at home and avoid contact with other people while you have a high temperature or feel unwell."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card. The Casebook holds the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 58-year-old man who had a kidney transplant, on tacrolimus, atorvastatin and apixaban, rings on day 2 of a cough and fever with a positive COVID-19 lateral flow test. His wife, who is 72 and has COPD, has similar symptoms and it is January.", src:"NICE TA878 · UKHSA influenza antiviral guidance (2025)"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Checks <b>severity</b> first (saturation, breathlessness, confusion). Recognises he is in a <b>TA878 highest-risk group</b> and refers the same day to the <b>COVID-19 treatment service</b>. Identifies the <b>Paxlovid interactions</b> (tacrolimus, apixaban, atorvastatin) and involves the transplant team. Considers whether his wife has <b>influenza or COVID-19</b>: as an at-risk patient while flu is circulating, she should be offered <b>oseltamivir</b> within 48 hours, with a renal check. Safety-nets and checks vaccination.", src:"Paxlovid SPC · oseltamivir SPC"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Every recommendation on this page traces to a named primary source.",
     blocks:[
       {b:"html", html:"<div class='card'><h3>Evidence panel</h3><ul class='evlist'>"+
         "<li><b>UKHSA — Guidance on use of antiviral agents for the treatment and prophylaxis of seasonal influenza (updated November 2025)</b><br><a href='https://www.gov.uk/government/publications/influenza-treatment-and-prophylaxis-using-anti-viral-agents' rel='noopener'>gov.uk — influenza antiviral guidance</a><span class='rd'> — at-risk groups, when flu is circulating, oseltamivir first line, zanamivir and baloxavir for resistance, timing, prophylaxis, renal function within 6 months</span></li>"+
         "<li><b>DHSC — amendment to prescribing regulations for oseltamivir and zanamivir (from 1 October 2025)</b><br><a href='https://pharmaceutical-journal.com/article/news/government-removes-prescribing-restrictions-to-allow-certain-medicines-to-be-prescribed-outside-of-flu-season' rel='noopener'>pharmaceutical-journal.com — report of the change</a><span class='rd'> — prescribing no longer limited to CMO-announced periods</span></li>"+
         "<li><b>NICE TA878 — Nirmatrelvir plus ritonavir, sotrovimab and tocilizumab for treating COVID-19 (2023; partial reviews 2024 and 2025)</b><br><a href='https://www.nice.org.uk/guidance/ta878' rel='noopener'>nice.org.uk/guidance/ta878</a><span class='rd'> — eligibility (section 5 risk groups), removal in 2025 of the groups added in 2024</span></li>"+
         "<li><b>NICE TA1056 — Molnupiravir for treating COVID-19 (April 2025, updated February 2026)</b><br><a href='https://www.nice.org.uk/guidance/ta1056' rel='noopener'>nice.org.uk/guidance/ta1056</a><span class='rd'> — only if nirmatrelvir plus ritonavir is contraindicated or unsuitable; sotrovimab removed after UK discontinuation</span></li>"+
         "<li><b>NICE TA971 — Remdesivir and tixagevimab plus cilgavimab for treating COVID-19 (2024)</b><br><a href='https://www.nice.org.uk/guidance/ta971' rel='noopener'>nice.org.uk/guidance/ta971</a><span class='rd'> — remdesivir in hospital; tixagevimab plus cilgavimab not recommended</span></li>"+
         "<li><b>Scottish Medicines Consortium — sotrovimab (Xevudy) discontinued (February 2026)</b><br><a href='https://scottishmedicines.org.uk/about-us/latest-update/smc2555-sotrovimab-xevudy-has-been-discontinued-and-advice-removed-from-the-smc-website/' rel='noopener'>scottishmedicines.org.uk — SMC2555</a><span class='rd'> — UK marketing authorisation discontinued</span></li>"+
         "<li><b>NICE NG191 — COVID-19 rapid guideline: managing COVID-19 (2021, updated 2023)</b> and <b>NICE NG253 — Suspected sepsis in people aged 16 or over (2025)</b> and <b>NICE NG254 — Suspected sepsis in under 16s (2025)</b><br><a href='https://www.nice.org.uk/guidance/ng191' rel='noopener'>nice.org.uk/guidance/ng191</a> · <a href='https://www.nice.org.uk/guidance/ng253' rel='noopener'>nice.org.uk/guidance/ng253</a> · <a href='https://www.nice.org.uk/guidance/ng254' rel='noopener'>ng254</a><span class='rd'> — severity, escalation and red flags</span></li>"+
         "<li><b>NICE NG143 — Fever in under 5s (2019, updated 2021)</b> and <b>NICE NG250 — Pneumonia: diagnosis and management (2025; replaced NG138)</b><br><a href='https://www.nice.org.uk/guidance/ng143' rel='noopener'>nice.org.uk/guidance/ng143</a> · <a href='https://www.nice.org.uk/guidance/ng250' rel='noopener'>nice.org.uk/guidance/ng250</a><span class='rd'> — children; secondary bacterial pneumonia</span></li>"+
         "<li><b>UKHSA — Green Book chapter 19 (influenza) and chapter 14a (COVID-19)</b><br><a href='https://www.gov.uk/government/publications/influenza-the-green-book-chapter-19' rel='noopener'>gov.uk — chapter 19</a> · <a href='https://www.gov.uk/government/publications/covid-19-the-green-book-chapter-14a' rel='noopener'>gov.uk — chapter 14a</a><span class='rd'> — vaccine eligibility</span></li>"+
         "<li><b>SPCs — oseltamivir (Tamiflu), zanamivir (Relenza), nirmatrelvir plus ritonavir (Paxlovid), molnupiravir (Lagevrio)</b><br><a href='https://www.medicines.org.uk/emc' rel='noopener'>medicines.org.uk/emc</a><span class='rd'> — doses, renal adjustment, contraindications, contraception, interactions</span></li>"+
         "<li><b>University of Liverpool — COVID-19 drug interactions</b><br><a href='https://www.covid19-druginteractions.org/' rel='noopener'>covid19-druginteractions.org</a><span class='rd'> — interaction checking for nirmatrelvir plus ritonavir</span></li>"+
         "</ul></div>"}
     ]}
