<script>
MG.render({
  icon:"🚹",
  title:"Prostatitis",
  eyebrow:"Protocol · assess and manage in one place",
  stemTitle:"Prostatitis: a febrile infection or a chronic pain syndrome? Decide first, then treat",
  stemSub:"Two very different problems share one name. Acute bacterial prostatitis is a systemic infection that needs urine culture, a 14-day oral course reviewed at day 14, and hospital care if the man is septic, in retention or not improving by 48 hours. Chronic prostatitis / chronic pelvic pain syndrome is usually not an infection at all, and is managed as a persistent pain condition with several treatments at once. NICE NG110 lists ciprofloxacin or ofloxacin first, with trimethoprim when a fluoroquinolone is not appropriate; since January 2024 the MHRA requires that a fluoroquinolone is used only when other commonly recommended antibiotics are inappropriate, decided for the individual patient and documented. Adult primary care guide (adult men and people with male reproductive organs): follow current NICE guidance, MHRA safety advice, local Greater Manchester antimicrobial guidance and microbiology/urology advice where these differ, and check renal function, interactions, contraindications and the current SPC before prescribing.",
  guideline:"NICE NG110 (2018) · MHRA DSU Jan 2024 · NICE NG109 (2018) · NICE NG12 (updated April 2026) · EAU Chronic Pelvic Pain and Urological Infections 2026 (international) · NICE NG113 · UKHSA PCRMP · Greater Manchester Antimicrobial Guidelines (local)",
  meta:[
    {t:"NICE NG110 (2018) · acute prostatitis"},
    {t:"MHRA DSU Jan 2024 · fluoroquinolones"},
    {t:"EAU 2026 · international (chronic)"},
    {t:"Greater Manchester antimicrobial guidance · local"},
    {t:"Suspected cancer · NG12 prostate and haematuria", tone:"tw"}
  ],
  lead:"<div class='mg-layers'><a href='#classify'><b>Classify</b><small>acute infection or chronic pain</small></a><a href='#acute'><b>Acute</b><small>MSU, 14-day course, 48 h check</small></a><a href='#chronic'><b>Chronic</b><small>multimodal, not endless antibiotics</small></a><a href='#refer'><b>Refer</b><small>admit, urology, suspected cancer</small></a></div>",
  quickSub:"The six points that change what you do today. Sources are listed under <a href='#provenance'>Evidence</a>; local guidance and microbiology advice apply where they differ.",
  quick:[
    {tone:"red", h:"Septic, in retention, or not better at 48 hours: hospital", html:"NICE NG110 asks you to refer to hospital a man with acute prostatitis who shows signs of a more serious illness such as <b>sepsis, acute urinary retention or a prostatic abscess</b>. Symptoms should begin to settle <b>within 48 hours</b> of the antibiotic; NG110 also asks you to refer to hospital if they have not, and to reassess if they worsen at any point."},
    {tone:"amber", h:"Fluoroquinolones only when others are inappropriate — documented", html:"NICE NG110 lists <b>ciprofloxacin 500 mg or ofloxacin 200 mg twice daily</b> as first-choice oral options for acute prostatitis, but under the <b>MHRA Drug Safety Update of January 2024</b> systemic fluoroquinolones must only be prescribed when other commonly recommended antibiotics are inappropriate — for example resistance, contraindication, previous serious adverse effect or failure of another appropriate antibiotic. This must be decided for the individual patient and documented; better prostate penetration alone is not a reason. NG110’s alternative first choice when a fluoroquinolone is not appropriate is <b>trimethoprim 200 mg twice daily</b>, with specialist advice and susceptibility guidance when available. Use the most recent local laboratory and Greater Manchester resistance data, the patient’s previous cultures and recent antibiotic exposure — not historical national resistance figures. Each course is 14 days, then review."},
    {tone:"blue", h:"Urine before the first tablet", html:"Send a <b>midstream urine for culture and sensitivities before the first antibiotic dose</b>, without delaying treatment if he is seriously unwell (NG110; NG109 says the same for every man with a lower UTI). The result tells you whether the empirical choice will work, and it is the only way to justify a fluoroquinolone later. Check any previous cultures and recent antibiotic use."},
    {tone:"cream", h:"Fourteen days, then a decision", html:"The NG110 initial course is <b>14 days, then review</b> — a minimum, not always the whole course. At day 14, review history, symptoms, examination, urine and blood results and either <b>stop, or continue for a further 14 days</b> if symptoms persist. This is far longer than a man’s ordinary 7-day UTI course, so explain why before he stops early."},
    {tone:"green", h:"Chronic pelvic pain is usually not an infection", html:"Pain for at least 3 of the last 6 months with no proven infection is chronic prostatitis / chronic pelvic pain syndrome (NIH category III). Do not prescribe repeated or empirical antibiotic courses. Offer analgesia, pelvic-floor physiotherapy where appropriate and psychological support, and consider an alpha-blocker for prominent voiding symptoms within the first year. EAU 2026 (international) allows one time-limited antimicrobial trial in treatment-naive men with symptoms for <b>less than one year</b> — in primary care only after specialist advice."},
    {tone:"purple", h:"Do not let prostatitis hide a prostate cancer", html:"NICE NG12: refer on a suspected cancer pathway if the <b>prostate feels malignant on DRE</b>, or if the <b>PSA is above the age-specific threshold</b> in a man with possible symptoms. Do not measure PSA during infection: the UKHSA PSA programme advises waiting <b>at least 6 weeks</b> after a urinary infection. A high PSA should not be automatically attributed to prostatitis, and a malignant-feeling prostate needs urgent referral even if the PSA is normal or not yet available. Men aged 45 and over with visible haematuria that persists or recurs after the infection is treated also meet NG12."}
  ],
  pathwaySub:"The consultation in five moves. The red step is where men come to harm.",
  pathway:[
    {title:"Screen for the man who needs hospital", html:"Temperature, heart rate, blood pressure, respiratory rate and mental state. Can he pass urine? Is the bladder palpable? A fluctuant or exquisitely tender gland, persistent fever, deterioration or failure to improve raise concern for prostatic abscess and need hospital/urology assessment and imaging. Significant immunosuppression, diabetes or recent biopsy/instrumentation with systemic symptoms, or inability to take oral antibiotics, mean hospital. Sudden severe testicular pain is torsion until excluded. Signs of sepsis or retention mean hospital now, not a prescription.", alert:true},
    {title:"Classify: acute infection or chronic pain", html:"Sudden fever, rigors, perineal or low back pain with dysuria and frequency points to <b>acute bacterial prostatitis</b>. Months of pelvic, perineal, penile or ejaculatory pain with little or no systemic upset points to <b>chronic prostatitis / chronic pelvic pain syndrome</b>. Recurrent infections with the same organism suggest chronic bacterial prostatitis."},
    {title:"Test before treating", html:"MSU for culture before the first dose, without delaying treatment if he is seriously unwell. Chlamydia and gonorrhoea NAAT where there is sexual risk, urethral discharge or epididymo-orchitis. Examine the abdomen, flanks, genitals and scrotum; a gentle rectal examination only if clinically useful. Bloods (FBC, CRP, renal function, glucose) only if systemically unwell, higher risk or diagnostically uncertain. Avoid prostatic massage in acute infection. Leave the PSA for at least 6 weeks."},
    {title:"Treat the type you have found", html:"Acute: a 14-day NG110 course then review, chosen using the culture, previous results, recent antibiotic exposure, local resistance data and renal function. <b>Ciprofloxacin 500 mg or ofloxacin 200 mg twice daily</b> only when other commonly recommended antibiotics are inappropriate (MHRA January 2024), with the reason documented; <b>trimethoprim 200 mg twice daily</b> when a fluoroquinolone is inappropriate, with specialist advice and susceptibility guidance where available. Paracetamol with or without a low-dose weak opioid, or ibuprofen if suitable. Chronic: explanation, analgesia, alpha-blocker for prominent voiding symptoms within the first year, pelvic-floor physiotherapy and attention to mood and sleep — no repeated antibiotics."},
    {title:"Review at 48 hours and at day 14", html:"No improvement by 48 hours: refer to hospital (NG110). At day 14: stop, or continue for another 14 days. Recurrent infection, a suspected abscess, retention or refractory chronic pain: urology. Revisit PSA and NG12 at least 6 weeks after the infection; a PSA above the referral threshold is not simply repeated."}
  ],
  sections:[
    {id:"classify", nav:"Classify", title:"Four kinds of prostatitis, and why the label matters", sub:"The NIH consensus classification (Krieger, JAMA 1999) is still the shared language. The category decides whether antibiotics have any role.",
     blocks:[
       {b:"table", head:["NIH category","What it looks like","What it means for you"], rows:[
         ["<b>I · Acute bacterial</b>","Abrupt onset of fever, rigors, malaise, perineal, rectal or low back pain, dysuria, frequency, urgency and sometimes a poor stream or retention. The gland is hot, swollen and very tender","A systemic infection, usually with gut organisms such as <i>E. coli</i>. Culture, a 14-day initial course then review, and a low threshold for hospital"],
         ["<b>II · Chronic bacterial</b>","Recurrent urinary infections, often with the <b>same organism</b> each time, with pelvic or perineal discomfort between episodes","The prostate may be acting as a reservoir. Seek urology/microbiology advice; specialist assessment may include localised cultures, and prolonged antimicrobial treatment is specialist-led and susceptibility-directed"],
         ["<b>III · Chronic prostatitis / chronic pelvic pain syndrome</b>","Pelvic, perineal, testicular, penile or ejaculatory pain for at least 3 of the previous 6 months, often with urinary and sexual symptoms, and <b>no demonstrable infection</b>. Subdivided into IIIA (inflammatory cells present) and IIIB (none)","By far the commonest chronic form. A pain syndrome, managed with several treatments together; repeated antibiotics are not the answer"],
         ["<b>IV · Asymptomatic inflammatory</b>","No symptoms. Inflammation found incidentally on biopsy or semen analysis","No treatment is needed in most men"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Who gets acute bacterial prostatitis", html:"Men of any adult age, often with an ordinary ascending urinary infection. Recent urethral catheterisation, cystoscopy or prostate biopsy, an indwelling catheter, diabetes and immunosuppression all raise the risk and the chance of an unusual or resistant organism. After a prostate biopsy, involve urology early.", src:"NICE NG110 (2018) · EAU Urological Infections 2026 (international)"},
         {tone:"blue", h:"Who gets chronic pelvic pain syndrome", html:"Typically younger and middle-aged men with fluctuating pain for months. It overlaps with irritable bowel, other chronic pain conditions, anxiety and low mood. Pain after ejaculation is a characteristic complaint. It is a diagnosis made once infection, stones, cancer and other structural causes are reasonably excluded.", src:"EAU Chronic Pelvic Pain 2026 (international) · Krieger, JAMA 1999"}
       ]},
       {b:"why", html:"The word ‘prostatitis’ tempts people to reach for antibiotics every time. That is right for category I, sometimes right for category II, and usually wrong for category III, where the problem is sensitised pelvic nerves and muscles rather than bacteria. Getting the category right at the first consultation prevents months of fruitless courses, fluoroquinolone harms and a patient who feels disbelieved."}
     ]},

    {id:"redflags", nav:"Red flags", title:"Red flags — who cannot be managed at home", sub:"Acute bacterial prostatitis can seed the bloodstream. Screen every febrile man with urinary symptoms for these before prescribing.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Sepsis", html:"Rigors, high or low temperature, tachycardia, hypotension, raised respiratory rate, new confusion or mottled skin. Use your usual sepsis assessment. A man with prostatitis and these features needs hospital assessment and intravenous antibiotics, not an oral course from the surgery.", src:"NICE NG110 (2018)"},
         {tone:"red", h:"Acute urinary retention", html:"Inability to pass urine with a painful, palpable bladder. The swollen gland can close the outlet. Do not force urethral catheterisation through an inflamed prostate in general practice. Arrange same-day hospital/urology assessment for drainage.", src:"NICE NG110 (2018) · EAU Urological Infections 2026 (international)"},
         {tone:"amber", h:"Suspected prostatic abscess", html:"A fluctuant or exquisitely tender gland, persistent fever, deterioration or failure to improve should raise concern for prostatic abscess — it cannot reliably be diagnosed in general practice. More likely in diabetes, immunosuppression and after instrumentation. Needs hospital/urology assessment and imaging.", src:"NICE NG110 (2018)"},
         {tone:"red", h:"Not improving at 48 hours", html:"NG110 expects symptoms to start settling within 48 hours of the antibiotic. If they have not, NG110 asks you to refer to hospital, because of the risk of retention, abscess and a resistant organism (check the culture). Do not simply switch to a second oral agent at home.", src:"NICE NG110 (2018)"},
         {tone:"red", h:"High-risk man with systemic symptoms", html:"Significant immunosuppression, diabetes, or recent prostate biopsy or instrumentation with systemic symptoms; or unable to take or keep down oral antibiotics → same-day hospital assessment.", src:"NICE NG110 (2018)"},
         {tone:"amber", h:"Scrotal pain and swelling", html:"Infection can track to the epididymis and testis. In a younger man or where sexual risk exists, think of chlamydia and gonorrhoea; sudden severe unilateral testicular pain is torsion until excluded — do not delay surgical assessment for ultrasound if torsion is clinically possible.", src:"BASHH epididymo-orchitis 2020"},
         {tone:"purple", h:"NG12 prostate cancer criteria", html:"NICE NG12 (updated April 2026): refer using a suspected cancer pathway referral for prostate cancer if the <b>prostate feels malignant on digital rectal examination</b>. Consider a PSA and DRE in men with lower urinary tract symptoms (nocturia, frequency, hesitancy, urgency or retention), erectile dysfunction or visible haematuria, and consider a suspected cancer pathway referral if the <b>PSA is above the threshold for their age</b>. A tender, boggy gland in acute infection is not the same as a hard, irregular one; if in doubt, re-examine once the infection has settled. A hard, irregular or otherwise malignant-feeling prostate needs urgent suspected-cancer referral even if the PSA is normal or not yet available.", src:"NICE NG12 (2015, updated April 2026)"},
         {tone:"purple", h:"NG12 haematuria criterion", html:"NICE NG12: refer people <b>aged 45 and over</b> on a suspected cancer pathway for bladder or renal cancer if they have <b>unexplained visible haematuria without urinary tract infection</b>, or <b>visible haematuria that persists or recurs after successful treatment</b> of a urinary tract infection. Blood in the urine during prostatitis must be rechecked after treatment.", src:"NICE NG12 (2015, updated April 2026)"}
       ]},
       {b:"warn", html:"<b>No prostatic massage in acute infection.</b> Vigorous pressure on an infected gland can push bacteria into the bloodstream. A single gentle examination is enough to confirm tenderness; the EAU urological infections guideline (international) advises against massage in acute bacterial prostatitis."}
     ]},

    {id:"assess", nav:"Assess", title:"History, examination and tests", sub:"A short, targeted assessment separates the infected gland from the painful pelvis and finds the man who needs hospital.",
     blocks:[
       {b:"table", head:["Ask or do","What you are looking for","Why"], rows:[
         ["<b>Onset and fever</b>","Hours to days, with rigors and malaise, versus months of fluctuating pain","Acute systemic illness means category I and a treatment clock"],
         ["<b>Urinary symptoms</b>","Dysuria, frequency, urgency, poor stream, straining, retention","Obstruction and retention risk; baseline for later review"],
         ["<b>Pain map</b>","Perineum, rectum, suprapubic, penis, testes, low back; pain on or after ejaculation","Ejaculatory and perineal pain over months is typical of the chronic pain syndrome"],
         ["<b>Recent instrumentation</b>","Catheter, cystoscopy, prostate biopsy","Higher risk of resistant organisms; involve urology early"],
         ["<b>Risk factors</b>","Diabetes, immunosuppression, renal disease, renal-risk medication","Lower threshold for hospital and blood tests; renal dosing"],
         ["<b>Sexual history</b>","New or multiple partners, urethral discharge","Chlamydia and gonorrhoea can cause urethritis and epididymo-orchitis"],
         ["<b>Previous cultures and antibiotics</b>","Organisms, sensitivities, courses in the last 3 months","Recent trimethoprim use makes resistance more likely"],
         ["<b>Observations</b>","Temperature, pulse, blood pressure, respiratory rate, confusion","Sepsis screen"],
         ["<b>Abdomen and genitals</b>","Ability to pass urine, palpable bladder, flank tenderness, genital and scrotal examination including epididymal or testicular swelling","Retention, pyelonephritis, epididymo-orchitis"],
         ["<b>Gentle rectal examination</b>","Hot, swollen, very tender gland in acute infection; often normal or mildly tender in chronic pain. A hard, nodular gland is a different question","Only if clinically useful; one gentle pass; no massage"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Urine", html:"Midstream urine for <b>culture and susceptibility before the first dose</b>, without delaying treatment if he is seriously unwell. Dipstick may support the assessment but is not a substitute for MSU culture. Repeat culture if symptoms persist or recur.", src:"NICE NG110 (2018) · NICE NG109 (2018)"},
         {tone:"blue", h:"Blood tests", html:"Consider FBC, CRP, renal function and glucose where he is systemically unwell, has diabetes or immunosuppression, recent instrumentation, renal-risk medication or diagnostic uncertainty; they can inform the day-14 review. They are not required routinely in every stable patient managed in the community. Anyone septic needs blood cultures in hospital.", src:"NICE NG110 (2018)"},
         {tone:"blue", h:"STI testing", html:"If there is sexual risk, urethral discharge or epididymo-orchitis, first-void urine NAAT for chlamydia and gonorrhoea. <i>Mycoplasma genitalium</i> testing is relevant when urethritis is suspected or persistent, not routinely. Direct treatment of gonorrhoea, chlamydia and epididymo-orchitis, and partner notification, through local sexual-health pathways; prostatitis with sexual risk is not automatically treated with an epididymo-orchitis regimen.", src:"BASHH epididymo-orchitis 2020"},
         {tone:"amber", h:"PSA: not now", html:"Infection can push the PSA very high for weeks. The UKHSA Prostate Cancer Risk Management Programme advises not testing during an active urinary infection or within the <b>previous 6 weeks</b> (also avoid within 48 hours of ejaculation or vigorous exercise, and 6 weeks after a biopsy). Put a reminder in the notes to offer it later where indicated. A high PSA should not be automatically attributed to prostatitis, and a PSA above the urgent referral threshold should not simply be repeated after 6 weeks without considering referral. This differs from testing asymptomatic men after informed choice under the PCRMP.", src:"UKHSA PCRMP (gov.uk)"}
       ]},
       {b:"why", html:"A raised PSA taken in the middle of acute prostatitis generates an urgent referral, an anxious patient and often an unnecessary MRI, and a normal one taken too soon falsely reassures. The disciplined sequence is: treat the infection, wait at least 6 weeks, then decide whether a PSA is indicated on its own merits under NG12."}
     ]},

    {id:"acute", nav:"Acute", title:"Treating acute bacterial prostatitis at home", sub:"For a man who is not septic, can pass urine and can take tablets. Doses are those stated in NICE NG110; check renal function, interactions, contraindications and the current SPC, and follow local Greater Manchester antimicrobial guidance and microbiology advice where it differs.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1", when:"when a fluoroquinolone is inappropriate", tone:"cream", title:"Trimethoprim 200 mg twice daily for 14 days, then review", html:"NG110: trimethoprim is an alternative first-choice antibiotic when a fluoroquinolone is not appropriate; <b>seek specialist advice and use susceptibility guidance when available</b>. Check recent urine cultures and antibiotic exposure, and avoid empirical use where the risk of resistance is high — use current local laboratory and Greater Manchester resistance data. Check renal function; consider potassium and creatinine rises, particularly with ACE inhibitors, ARBs, potassium-sparing diuretics or significant renal impairment; avoid or seek specialist advice with methotrexate; consider folate deficiency and haematological toxicity where clinically relevant (trimethoprim SPC)."},
         {step:"2", when:"only when other recommended antibiotics are inappropriate", tone:"amber", fromLabel:"resistance, contraindication, previous serious adverse effect or failure", title:"Ciprofloxacin 500 mg or ofloxacin 200 mg twice daily for 14 days, then review", html:"NG110 lists these as first-choice oral options, but the MHRA restriction (January 2024) applies despite the NICE table: prescribe one only when other commonly recommended antibiotics are inappropriate for this patient — not simply because of better prostate penetration. <b>Document why other recommended antibiotics are inappropriate</b>; discuss disabling and potentially long-lasting or irreversible adverse effects and give the patient information sheet; advise stopping the fluoroquinolone and seeking medical advice for tendon pain or swelling, neuropathic symptoms, severe neuropsychiatric symptoms or other serious adverse effects; consider risks such as age over 60, corticosteroid treatment, renal impairment, transplant history, previous quinolone-related adverse effects, aneurysm or significant valvular disease; and check interactions, including QT-risk medicines and NSAIDs, and renal dosing."},
         {step:"3", when:"specialist advice only", tone:"amber", title:"Levofloxacin 500 mg once daily or co-trimoxazole 960 mg twice daily for 14 days", html:"NG110 second choices, used after discussion with a specialist. Levofloxacin is kept for more severe infection; co-trimoxazole is restricted in the UK and needs culture evidence of sensitivity."},
         {step:"Hospital", when:"red flags", tone:"red", fromLabel:"septic, retention, abscess or not improving at 48 h", title:"Intravenous antibiotics and urology", html:"NG110 recommends oral treatment first line where the man can take tablets and is not so unwell that intravenous therapy is needed. Otherwise he is admitted, treated intravenously and reviewed for a step down to oral treatment by 48 hours."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"cream", h:"Pain relief", html:"NG110: <b>paracetamol, with or without a low-dose weak opioid such as codeine</b>, or <b>ibuprofen</b> only if appropriate after considering renal, gastrointestinal, cardiovascular and interaction risks. A stool softener helps if defaecation is painful. Advise adequate hydration according to thirst and clinical circumstances.", src:"NICE NG110 (2018)"},
         {tone:"cream", h:"Why 14 days", html:"Antibiotics penetrate an inflamed prostate less well than they do the bladder, and relapse into chronic bacterial prostatitis is the concern. NG110 set a minimum of 14 days for every recommended agent, with a planned review at the end.", src:"NICE NG110 (2018)"},
         {tone:"amber", h:"Why not nitrofurantoin", html:"Nitrofurantoin is a first choice for a simple lower UTI in men under NG109, but it does not reach useful concentrations in prostate tissue. Where prostatitis is suspected, do not use it.", src:"NICE NG109 (2018)"},
         {tone:"amber", h:"Fluoroquinolone harms to counsel", html:"Tendon pain, swelling or rupture (higher risk over 60, with corticosteroids and after transplant), muscle and joint pain, peripheral neuropathy, and psychiatric effects including suicidal thoughts (MHRA, September 2023). Small increased risks of aortic aneurysm and dissection (November 2018) and heart valve regurgitation (December 2020). Advise him to stop and seek urgent medical advice at the first sign of tendon pain or swelling, neuropathic symptoms, marked weakness, severe psychiatric symptoms or other serious adverse effects.", src:"MHRA DSU Jan 2024 · Sep 2023 · Dec 2020 · Nov 2018"}
       ]},
       {b:"warn", html:"<b>Check the culture when it comes back.</b> If the organism is resistant to what he is taking and he is not improving, change to a susceptible agent, narrower-spectrum where possible. If he is improving on a drug the laboratory reports as resistant, review clinically rather than switching reflexively, and seek microbiology advice."}
     ]},

    {id:"review", nav:"Review", title:"Follow-up: 48 hours, day 14, and after", sub:"The review points are part of the treatment, not optional extras.",
     blocks:[
       {b:"timeline", items:[
         {n:"1", when:"Within 48 hours", title:"Is he getting better?", html:"Symptoms should begin to improve. Worse at any time: reassess. No better by 48 hours: refer to hospital, checking the culture (NICE NG110)."},
         {n:"2", when:"Day 14", title:"Stop or continue", html:"Review history, symptoms, examination, urine and blood results. Stop if he is clinically well and symptoms have resolved, or continue for <b>a further 14 days</b> if clinically indicated (NICE NG110)."},
         {n:"3", when:"At least 6 weeks after infection", title:"PSA and NG12, if indicated", html:"If he has lower urinary tract symptoms, erectile dysfunction or haematuria, or the gland felt abnormal, offer a PSA now and apply the NG12 age thresholds, considering symptoms, DRE, ethnicity, family history, comorbidity and life expectancy. Recheck urine for blood if haematuria was present."},
         {n:"4", when:"If it keeps coming back", title:"Chronic bacterial prostatitis", html:"Recurrent culture-positive infection with the same organism, persistent bacteriuria between episodes, or a suspected prostatic bacterial reservoir: urology/microbiology advice. Localised cultures and prolonged, susceptibility-directed treatment are specialist-led."}
       ]},
       {b:"say", html:"This is an infection in the prostate gland, which sits just under the bladder. Antibiotics find it harder to get into, so the course is two weeks rather than the usual one, and I may extend it. You should feel better within two days. If you get shivers, feel very unwell, or can’t pass water, go to A&amp;E straight away rather than waiting for us."}
     ]},

    {id:"chronic", nav:"Chronic", title:"Chronic prostatitis / chronic pelvic pain syndrome", sub:"There is no UK guideline for this condition; the European Association of Urology Chronic Pelvic Pain guidelines (2026 edition) are the most complete source and are labelled international throughout.",
     blocks:[
       {b:"p", html:"Chronic pelvic pain syndrome is persistent pain perceived in the prostate region for at least 3 of the previous 6 months, often with urinary, sexual and psychological symptoms, when infection and other structural disease have been reasonably excluded. The EAU now prefers the term <b>primary prostate pain syndrome</b> and frames it as a chronic pain condition with nervous-system sensitisation and pelvic-floor muscle tension, not a smouldering infection."},
       {b:"table", head:["Domain (UPOINT-style phenotyping)","What to ask or find","What helps"], rows:[
         ["<b>Urinary</b>","Frequency, urgency, poor stream, nocturia","Alpha-blocker for prominent voiding symptoms if within the first year; reduce caffeine and alcohol if they aggravate"],
         ["<b>Psychosocial</b>","Low mood, anxiety, catastrophising, sleep loss, relationship strain","Validation, explanation, pain-focused psychological therapy"],
         ["<b>Organ-specific</b>","Prostate tenderness, symptoms tied to the gland","Anti-inflammatory analgesia; urology if uncertain"],
         ["<b>Infection</b>","Documented organism, recurrent culture-positive episodes","That is category II, not III: urology/microbiology advice and susceptibility-directed antibiotics"],
         ["<b>Neurological / systemic</b>","Pain beyond the pelvis, IBS, fibromyalgia-type pain","Chronic pain approach; consider neuropathic agents with realistic expectations"],
         ["<b>Tenderness of pelvic floor muscles</b>","Tender pelvic floor or perineal trigger points","Specialist pelvic-floor physiotherapy"],
         ["<b>Sexual</b>","Pain on or after ejaculation, erectile difficulties","Address directly; it is often the most distressing symptom"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"cream", h:"Alpha-blocker: early disease only", html:"EAU 2026 supports an alpha-blocker for men whose symptoms have lasted <b>less than one year</b>; use it for prominent voiding symptoms, not automatically for pelvic pain. Tamsulosin 400 micrograms once daily is the usual dose for lower urinary tract symptoms; its use for primary prostate pain syndrome is off-label. Review benefit after about 4–6 weeks. Warn about postural hypotension, dizziness and ejaculatory dysfunction; assess concurrent antihypertensives and PDE5 inhibitors; and ask him to tell an ophthalmic surgeon before cataract or glaucoma surgery (intraoperative floppy iris syndrome).", src:"EAU Chronic Pelvic Pain 2026 (international) · tamsulosin SPC (MHRA products)"},
         {tone:"cream", h:"No repeated or empirical antibiotics", html:"Do not prescribe repeated or empirical antibiotic courses for chronic pelvic pain syndrome, and no antibiotics if cultures are negative and there is no convincing infective syndrome. In a treatment-naive patient with symptoms for less than one year, after excluding UTI, STI and relevant structural disease, specialist advice may be sought about one time-limited antimicrobial trial (EAU 2026, international — a weakly supported recommendation with modest effects, not routine primary-care prescribing). Do not use a fluoroquinolone for non-bacterial chronic prostatitis because of MHRA restrictions. If an STI or atypical pathogen is identified, treat according to the relevant sexual-health guideline.", src:"EAU Chronic Pelvic Pain 2026 (international) · MHRA DSU Mar 2019 and Jan 2024"},
         {tone:"cream", h:"Analgesia", html:"Consider paracetamol or a short NSAID trial if suitable; EAU 2026 supports NSAIDs, bearing long-term adverse effects in mind. EAU does not recommend pregabalin for this syndrome because of insufficient evidence of benefit; if a neuropathic agent is tried for wider chronic pain, set a review date and stop it if it does not help.", src:"EAU Chronic Pelvic Pain 2026 (international)"},
         {tone:"green", h:"Physiotherapy, psychology and acupuncture", html:"Pelvic-floor physiotherapy for muscle tenderness, and chronic-pain-focused psychological treatment when distress is significant, are central rather than add-ons. EAU also offers acupuncture as a weak recommendation.", src:"EAU Chronic Pelvic Pain 2026 (international)"},
         {tone:"green", h:"What you can say with confidence", html:"This pattern is commonly caused by a chronic pelvic pain syndrome and is not usually due to cancer — though persistent haematuria, an abnormal prostate, unexplained weight loss, bone pain or other concerning features need separate assessment; the pain is real and commonly multifactorial; it is not caught from or passed to a partner; and it usually improves with a combination of treatments over months rather than with one tablet. Setting that expectation early is the most useful intervention you have.", src:"EAU Chronic Pelvic Pain 2026 (international)"},
         {tone:"blue", h:"Chronic bacterial prostatitis is different", html:"Recurrent culture-positive infection with the same organism, persistent bacteriuria between episodes, or a suspected prostatic bacterial reservoir should prompt urology/microbiology advice. Specialist assessment may include localised (two- or four-glass) cultures; prolonged antimicrobial treatment is specialist-led and susceptibility-directed, and is not a general-practice prescription.", src:"EAU Urological Infections 2026 (international) · MHRA DSU Jan 2024"}
       ]},
       {b:"why", html:"Men with chronic pelvic pain often arrive having had several short antibiotic courses and a sense that something is being missed. Each extra course adds fluoroquinolone or resistance risk with little prospect of benefit, and reinforces the belief that infection is the cause. Reframing it as a pain syndrome, treating the domains that are present and offering physiotherapy and psychological support is what the evidence supports."}
     ]},

    {id:"special", nav:"Special groups", title:"Situations that change the plan", sub:"The same diagnosis behaves differently in these men.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"After prostate biopsy or instrumentation", html:"Infection after a biopsy is more often due to resistant organisms and can progress quickly to sepsis. Contact the urology team who did the procedure the same day.", src:"EAU Urological Infections 2026 (international) · NICE NG110 (2018)"},
         {tone:"amber", h:"Indwelling catheter", html:"Follow the catheter-associated UTI pathway (NICE NG113, 2018). If the catheter has been in place for more than 7 days, consider removal or replacement where appropriate, but do not delay antibiotics in a clinically infected patient. Obtain urine from the catheter sampling port using local laboratory instructions, not from the drainage bag. Seek microbiology/urology advice if prostatitis, obstruction or systemic illness is suspected.", src:"NICE NG113 (2018)"},
         {tone:"amber", h:"Diabetes or immunosuppression", html:"Higher risk of abscess and of atypical organisms. Lower your threshold for hospital review and for imaging if the response is slow.", src:"NICE NG110 (2018)"},
         {tone:"blue", h:"Younger man with sexual risk", html:"Consider urethritis or epididymo-orchitis from chlamydia or gonorrhoea. Test with NAAT and involve sexual health for treatment and partner notification.", src:"BASHH epididymo-orchitis 2020"},
         {tone:"amber", h:"Renal impairment", html:"Trimethoprim, ciprofloxacin and ofloxacin all need dose checks in reduced renal function. Trimethoprim can also raise creatinine and potassium.", src:"BNF · trimethoprim SPC"},
         {tone:"amber", h:"Fluoroquinolone high-risk groups", html:"Over 60, renal impairment, on corticosteroids, after solid organ transplant, with previous fluoroquinolone reactions, or with aneurysm or valve disease. These are the men in whom the MHRA restrictions matter most.", src:"MHRA DSU Jan 2024 · Nov 2018 · Dec 2020"}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — who, where, how fast", sub:"Most acute prostatitis is managed at home. These are the exceptions.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Hospital today", html:"Sepsis or systemic toxicity · acute urinary retention · suspected prostatic abscess · unable to take or keep down oral antibiotics · not improving 48 hours after starting the antibiotic, or worsening at any time · significant immunosuppression, diabetes or recent prostate biopsy/instrumentation with systemic symptoms.", src:"NICE NG110 (2018)"},
         {tone:"red", h:"Same-day surgical review", html:"Sudden severe unilateral testicular pain is torsion until excluded; do not delay surgical assessment for ultrasound if torsion is clinically possible.", src:"BASHH epididymo-orchitis 2020"},
         {tone:"purple", h:"Urgent referral routes <span class='tw'>Suspected cancer</span> · NICE NG12", html:"Refer using a suspected cancer pathway referral for prostate cancer if the <b>prostate feels malignant on digital rectal examination</b>. Consider referral if the <b>PSA is above the age-specific threshold</b> (NG12: above 2.5 microgram/L at 40 to 49, above 3.5 at 50 to 59, above 4.5 at 60 to 69, above 6.5 at 70 to 79; clinical judgement under 40 or over 79), taking the man’s preferences and comorbidities into account. A PSA above the threshold should not simply be repeated after 6 weeks without considering referral, nor automatically attributed to prostatitis. Refer people <b>aged 45 and over with unexplained visible haematuria without urinary tract infection, or visible haematuria that persists or recurs after successful treatment</b> of a urinary tract infection, for bladder or renal cancer.", src:"NICE NG12 (2015, updated April 2026)"},
         {tone:"amber", h:"Urology, soon", html:"Recurrent acute prostatitis, repeated isolation of the same organism or suspected chronic bacterial prostatitis (urology/microbiology advice) · infection after biopsy or instrumentation · persistent symptoms after a second 14-day course · diagnostic uncertainty, including an abnormal gland once infection has settled but not meeting NG12.", src:"NICE NG110 (2018) · EAU Urological Infections 2026 (international)"},
         {tone:"blue", h:"Urology or pelvic pain service, routine", html:"Chronic pelvic pain syndrome that is severe or refractory to a first-line multimodal plan, with recurrent positive cultures or red flags, or where the diagnosis is uncertain — urology, a pelvic-pain service or a chronic-pain service. Ask about local pelvic pain or pain-management services and pelvic-floor physiotherapy.", src:"EAU Chronic Pelvic Pain 2026 (international)"},
         {tone:"blue", h:"Sexual health", html:"Positive chlamydia or gonorrhoea test, urethral discharge, or ongoing sexual risk: treatment, a full STI screen and partner notification.", src:"BASHH epididymo-orchitis 2020"}
       ]},
       {b:"say", html:"We can treat this infection at home with a two-week course, and I’ll check how you are in a couple of days. Separately, once this has settled, I’d like to do a PSA blood test, because doing it now would give a misleadingly high reading."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 58-year-old man with two days of fever, shivers, burning urine and deep pain ‘behind the scrotum’. He had cystitis treated with trimethoprim four weeks ago. Temperature 38.4 °C, pulse 104, blood pressure normal, passing urine but with a poor stream. He asks for ‘the strong antibiotic my friend had’ (ciprofloxacin) and whether he should have a PSA test while he is here.", src:"NICE NG110 (2018) · MHRA DSU Jan 2024"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Screens for <b>sepsis and retention</b> and sets the 48-hour threshold; sends an <b>MSU before the first dose</b>; recognises that <b>recent trimethoprim</b> changes the choice and explains, in plain words, why a fluoroquinolone is now restricted and what side effects to watch for if one is genuinely needed; gives a <b>14-day course with a day-14 review</b>; declines the PSA today and <b>books it for at least 6 weeks</b> later with the reason; and safety-nets clearly for rigors, confusion and being unable to pass urine.", src:"NICE NG110 (2018) · UKHSA PCRMP · NICE NG12 (2015, updated April 2026)"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Sources for this page. Review it whenever NICE, MHRA, UKHSA or local Greater Manchester guidance changes.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>NICE NG110 — Prostatitis (acute): antimicrobial prescribing (October 2018)<br><a href="https://www.nice.org.uk/guidance/ng110/chapter/Recommendations" rel="noopener">nice.org.uk/guidance/ng110 — recommendations</a><span class="rd"> — MSU before antibiotics; oral first line; ciprofloxacin 500 mg or ofloxacin 200 mg twice daily, or trimethoprim 200 mg twice daily if a fluoroquinolone is not appropriate (with specialist advice and susceptibility guidance), for 14 days; levofloxacin and co-trimoxazole with specialist advice; review at day 14 and stop or continue for a further 14 days; paracetamol with or without low-dose codeine, or ibuprofen; refer to hospital for serious illness or if not improving 48 hours after starting the antibiotic; resistance data in the 2018 evidence are historical and are not current local data</span></li>'+
         '<li>MHRA Drug Safety Update — Fluoroquinolone antibiotics: must now only be prescribed when other commonly recommended antibiotics are inappropriate (January 2024); March 2019 restrictions, including no use for non-bacterial (chronic) prostatitis; earlier updates on suicidal thoughts and behaviour (September 2023), heart valve regurgitation (December 2020) and aortic aneurysm and dissection (November 2018)<br><a href="https://www.gov.uk/drug-safety-update/fluoroquinolone-antibiotics-must-now-only-be-prescribed-when-other-commonly-recommended-antibiotics-are-inappropriate" rel="noopener">gov.uk — fluoroquinolone restrictions (January 2024)</a></li>'+
         '<li>NICE NG109 — Urinary tract infection (lower): antimicrobial prescribing (October 2018)<br><a href="https://www.nice.org.uk/guidance/ng109" rel="noopener">nice.org.uk/guidance/ng109</a><span class="rd"> — urine culture before antibiotics in men; nitrofurantoin and trimethoprim for simple lower UTI in men</span></li>'+
         '<li>NICE NG12 — Suspected cancer: recognition and referral (2015, last updated April 2026)<br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12 — recommendations by site of cancer</a><span class="rd"> — prostate feels malignant on DRE; PSA and DRE for LUTS, erectile dysfunction or visible haematuria; age-specific PSA thresholds (clinical judgement under 40 or over 79); visible haematuria aged 45 and over</span></li>'+
         '<li>NICE NG113 — Urinary tract infection (catheter-associated): antimicrobial prescribing (2018)<br><a href="https://www.nice.org.uk/guidance/ng113/chapter/Recommendations" rel="noopener">nice.org.uk/guidance/ng113 — recommendations</a></li>'+
         '<li>UKHSA — Prostate Cancer Risk Management Programme: advising well men about the PSA test (gov.uk)<br><a href="https://www.gov.uk/government/publications/prostate-specific-antigen-testing-explanation-and-implementation/advising-well-men-about-the-psa-test-for-prostate-cancer-information-for-gps" rel="noopener">gov.uk: advising well men about the PSA test (information for GPs)</a><span class="rd"> — no PSA with an active urinary infection or within the previous 6 weeks; 48 hours after ejaculation or vigorous exercise; 6 weeks after biopsy</span></li>'+
         '<li>BASHH — UK national guideline for the management of epididymo-orchitis (2020; Int J STD AIDS 2021)<br><a href="https://doi.org/10.1177/09564624211003761" rel="noopener">doi.org/10.1177/09564624211003761</a></li>'+
         '<li>Krieger JN, Nyberg L, Nickel JC. NIH consensus definition and classification of prostatitis. JAMA 1999;282:236–237<span class="rd"> — categories I to IV</span></li>'+
         '<li>European Association of Urology — Guidelines on Chronic Pelvic Pain (2026 edition) <b>international</b><br><a href="https://uroweb.org/guidelines/chronic-pelvic-pain" rel="noopener">uroweb.org/guidelines/chronic-pelvic-pain</a><span class="rd"> — primary prostate pain syndrome; alpha-blockers when symptoms are under 1 year; a single time-limited antimicrobial trial in treatment-naive men with symptoms under 1 year (specialist decision, weak evidence); NSAIDs; acupuncture; pregabalin not recommended; phenotyping; psychological treatment</span></li>'+
         '<li>European Association of Urology — Guidelines on Urological Infections (2026 edition) <b>international</b><br><a href="https://uroweb.org/guidelines/urological-infections" rel="noopener">uroweb.org/guidelines/urological-infections</a><span class="rd"> — no prostatic massage in acute bacterial prostatitis; chronic bacterial prostatitis: localised cultures and prolonged, susceptibility-directed treatment (specialist-led)</span></li>'+
         '<li>Current SPCs — trimethoprim, ciprofloxacin, ofloxacin, levofloxacin, co-trimoxazole, tamsulosin (product-specific adverse effects, contraindications and interactions); BNF for dosing<br><a href="https://products.mhra.gov.uk/" rel="noopener">products.mhra.gov.uk</a> · <a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a></li>'+
         '<li>Greater Manchester Antimicrobial Guidelines (GMMMG) — local<br><a href="https://gmmmg.nhs.uk/guidance/clinical-guidance-and-pathways/antimicrobial-guidance-and-resources/" rel="noopener">gmmmg.nhs.uk — antimicrobial guidance</a><span class="rd"> — check the current Bolton/Greater Manchester antimicrobial pathway, local resistance data and microbiology advice</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"This guide is for adult primary care use in Greater Manchester. It summarises NICE NG110, MHRA fluoroquinolone safety advice, NICE NG12, UKHSA PSA guidance, local Greater Manchester antimicrobial guidance and selected EAU recommendations (2026, international). It does not replace clinical assessment. Check the current local antimicrobial guideline, renal function, interactions, contraindications and the current SPC before prescribing. Seek urgent hospital, urology or microbiology advice when red flags, treatment failure, recurrent culture-positive infection or diagnostic uncertainty are present."
});
