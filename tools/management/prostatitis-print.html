<script>
MG.render({
  icon:"🚹",
  title:"Prostatitis",
  eyebrow:"Protocol · assess and manage in one place",
  stemTitle:"Prostatitis: a febrile infection or a chronic pain syndrome? Decide first, then treat",
  stemSub:"Two very different problems share one name. Acute bacterial prostatitis is a systemic infection that needs urine culture, a 14-day oral course reviewed at day 14, and hospital care if the man is septic, in retention or not improving by 48 hours. Chronic prostatitis / chronic pelvic pain syndrome is usually not an infection at all, and is managed as a persistent pain condition with several treatments at once. NICE NG110 lists ciprofloxacin or ofloxacin first, with trimethoprim when a fluoroquinolone is not appropriate; since January 2024 the MHRA requires that a fluoroquinolone is used only when other commonly recommended antibiotics are inappropriate.",
  guideline:"NICE NG110 (2018) · MHRA DSU Jan 2024 · NICE NG109 (2018) · NICE NG12 (updated April 2026) · EAU Chronic Pelvic Pain and Urological Infections 2025 (international)",
  meta:[
    {t:"NICE NG110 (2018) · acute prostatitis"},
    {t:"MHRA DSU Jan 2024 · fluoroquinolones"},
    {t:"EAU 2025 · international (chronic)"},
    {t:"2WW · NG12 prostate and haematuria", tone:"tw"}
  ],
  lead:"<div class='mg-layers'><a href='#classify'><b>Classify</b><small>acute infection or chronic pain</small></a><a href='#acute'><b>Acute</b><small>MSU, 14-day course, 48 h check</small></a><a href='#chronic'><b>Chronic</b><small>multimodal, not endless antibiotics</small></a><a href='#refer'><b>Refer</b><small>admit, urology, 2WW</small></a></div>",
  quickSub:"The six points that change what you do today. Each traces to a named primary source under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"Septic, in retention, or not better at 48 hours: hospital", html:"NICE NG110 asks you to refer to hospital a man with acute prostatitis who shows signs of a more serious illness such as <b>sepsis, acute urinary retention or a prostatic abscess</b>. Symptoms should begin to settle <b>within 48 hours</b> of the antibiotic; NG110 also asks you to refer to hospital if they have not, and to reassess if they worsen at any point."},
    {tone:"amber", h:"Trimethoprim or a fluoroquinolone: decide deliberately", html:"NG110 first choices, each for 14 days: <b>ciprofloxacin 500 mg or ofloxacin 200 mg twice daily</b>, or <b>trimethoprim 200 mg twice daily</b> if a fluoroquinolone is not appropriate. The <b>MHRA Drug Safety Update of January 2024</b> says systemic fluoroquinolones must only be prescribed when other commonly recommended antibiotics are inappropriate (failed, resistant or unsafe). So ask first whether trimethoprim will work: no recent use, no known resistance, and remember that about 30% of <i>E. coli</i> in England were trimethoprim-resistant in the NG110 data. Record the reason for whichever you choose and check the culture."},
    {tone:"blue", h:"Urine before the first tablet", html:"Send a <b>midstream urine for culture and sensitivities before antibiotics start</b> (NG110; NG109 says the same for every man with a lower UTI). The result tells you whether the empirical choice will work, and it is the only way to justify a fluoroquinolone later. Check any previous cultures and recent antibiotic use."},
    {tone:"cream", h:"Fourteen days, then a decision", html:"The NG110 course is <b>14 days</b>. At day 14, review history, symptoms, examination, urine and blood results and either <b>stop, or continue for a further 14 days</b> if symptoms persist. This is far longer than a man’s ordinary 7-day UTI course, so explain why before he stops early."},
    {tone:"green", h:"Chronic pelvic pain is usually not an infection", html:"Pain for at least 3 of the last 6 months with no proven infection is chronic prostatitis / chronic pelvic pain syndrome (NIH category III). Repeated antibiotic courses rarely help. EAU 2025 (international) supports an alpha-blocker and a single antibiotic trial of at least 6 weeks <b>only in the first year</b>, alongside analgesia, pelvic-floor physiotherapy and psychological support."},
    {tone:"purple", h:"Do not let prostatitis hide a prostate cancer", html:"NICE NG12: refer on a suspected cancer pathway if the <b>prostate feels malignant on DRE</b>, or if the <b>PSA is above the age-specific threshold</b> in a man with possible symptoms. Do not measure PSA during infection: the UKHSA PSA programme advises waiting <b>at least 6 weeks</b> after a urinary infection. Men aged 45 and over with visible haematuria that persists after the infection is treated also meet NG12."}
  ],
  pathwaySub:"The consultation in five moves. The red step is where men come to harm.",
  pathway:[
    {title:"Screen for the man who needs hospital", html:"Temperature, heart rate, blood pressure, respiratory rate and mental state. Can he pass urine? Is the bladder palpable? Any fluctuant, exquisitely tender prostate or swinging fever suggesting an abscess? Immunosuppression, diabetes or recent instrumentation lower the threshold. Signs of sepsis or retention mean hospital now, not a prescription.", alert:true},
    {title:"Classify: acute infection or chronic pain", html:"Sudden fever, rigors, perineal or low back pain with dysuria and frequency points to <b>acute bacterial prostatitis</b>. Months of pelvic, perineal, penile or ejaculatory pain with little or no systemic upset points to <b>chronic prostatitis / chronic pelvic pain syndrome</b>. Recurrent infections with the same organism suggest chronic bacterial prostatitis."},
    {title:"Test before treating", html:"MSU for culture before the first dose. Consider chlamydia and gonorrhoea NAAT if there is any sexual risk. Examine the abdomen and genitals; a gentle rectal examination can confirm a hot, tender gland. Avoid prostatic massage in acute infection. Leave the PSA for at least 6 weeks."},
    {title:"Treat the type you have found", html:"Acute: a 14-day NG110 course, <b>trimethoprim 200 mg twice daily</b> where it is appropriate, or <b>ciprofloxacin 500 mg or ofloxacin 200 mg twice daily</b> when it is not (MHRA January 2024), with a documented reason, with paracetamol with or without low-dose codeine, or ibuprofen. Chronic: explanation, analgesia, alpha-blocker if within the first year and voiding symptoms are present, pelvic-floor physiotherapy and attention to mood and sleep."},
    {title:"Review at 48 hours and at day 14", html:"No improvement by 48 hours: refer to hospital (NG110). At day 14: stop, or continue for another 14 days. Recurrent infection, a suspected abscess, retention or refractory chronic pain: urology. Revisit PSA and NG12 once the infection is over."}
  ],
  sections:[
    {id:"classify", nav:"Classify", title:"Four kinds of prostatitis, and why the label matters", sub:"The NIH consensus classification (Krieger, JAMA 1999) is still the shared language. The category decides whether antibiotics have any role.",
     blocks:[
       {b:"table", head:["NIH category","What it looks like","What it means for you"], rows:[
         ["<b>I · Acute bacterial</b>","Abrupt onset of fever, rigors, malaise, perineal, rectal or low back pain, dysuria, frequency, urgency and sometimes a poor stream or retention. The gland is hot, swollen and very tender","A systemic infection, usually with gut organisms such as <i>E. coli</i>. Culture, a 14-day course and a low threshold for hospital"],
         ["<b>II · Chronic bacterial</b>","Recurrent urinary infections, often with the <b>same organism</b> each time, with pelvic or perineal discomfort between episodes","The prostate is acting as a reservoir. Needs urology input, localised cultures and a longer, targeted course"],
         ["<b>III · Chronic prostatitis / chronic pelvic pain syndrome</b>","Pelvic, perineal, testicular, penile or ejaculatory pain for at least 3 of the previous 6 months, often with urinary and sexual symptoms, and <b>no demonstrable infection</b>. Subdivided into IIIA (inflammatory cells present) and IIIB (none)","By far the commonest chronic form. A pain syndrome, managed with several treatments together; repeated antibiotics are not the answer"],
         ["<b>IV · Asymptomatic inflammatory</b>","No symptoms. Inflammation found incidentally on biopsy or semen analysis","No treatment is needed in most men"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Who gets acute bacterial prostatitis", html:"Men of any adult age, often with an ordinary ascending urinary infection. Recent urethral catheterisation, cystoscopy or prostate biopsy, an indwelling catheter, diabetes and immunosuppression all raise the risk and the chance of an unusual or resistant organism. After a prostate biopsy, involve urology early.", src:"NICE NG110 (2018) · EAU Urological Infections 2025 (international)"},
         {tone:"blue", h:"Who gets chronic pelvic pain syndrome", html:"Typically younger and middle-aged men with fluctuating pain for months. It overlaps with irritable bowel, other chronic pain conditions, anxiety and low mood. Pain after ejaculation is a characteristic complaint. It is a diagnosis made once infection, stones, cancer and other structural causes are reasonably excluded.", src:"EAU Chronic Pelvic Pain 2025 (international) · Krieger, JAMA 1999"}
       ]},
       {b:"why", html:"The word ‘prostatitis’ tempts people to reach for antibiotics every time. That is right for category I, sometimes right for category II, and usually wrong for category III, where the problem is sensitised pelvic nerves and muscles rather than bacteria. Getting the category right at the first consultation prevents months of fruitless courses, fluoroquinolone harms and a patient who feels disbelieved."}
     ]},

    {id:"redflags", nav:"Red flags", title:"Red flags — who cannot be managed at home", sub:"Acute bacterial prostatitis can seed the bloodstream. Screen every febrile man with urinary symptoms for these before prescribing.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Sepsis", html:"Rigors, high or low temperature, tachycardia, hypotension, raised respiratory rate, new confusion or mottled skin. Use your usual sepsis assessment. A man with prostatitis and these features needs hospital assessment and intravenous antibiotics, not an oral course from the surgery.", src:"NICE NG110 (2018)"},
         {tone:"red", h:"Acute urinary retention", html:"Inability to pass urine with a painful, palpable bladder. The swollen gland can close the outlet. He needs same-day decompression in hospital; the route of catheterisation in an inflamed prostate is a urology decision, not something to attempt forcefully in the surgery.", src:"NICE NG110 (2018) · EAU Urological Infections 2025 (international)"},
         {tone:"amber", h:"Suspected prostatic abscess", html:"Fever that swings or persists despite appropriate antibiotics, a fluctuant or exquisitely tender gland, or failure to improve within 48 hours. More likely in diabetes, immunosuppression and after instrumentation. Needs hospital imaging and possible drainage.", src:"NICE NG110 (2018)"},
         {tone:"red", h:"Not improving at 48 hours", html:"NG110 expects symptoms to start settling within 48 hours of the antibiotic. If they have not, NG110 asks you to refer to hospital, because of the risk of retention, abscess and a resistant organism (check the culture). Do not simply switch to a second oral agent at home.", src:"NICE NG110 (2018)"},
         {tone:"amber", h:"Scrotal pain and swelling", html:"Infection can track to the epididymis and testis. In a younger man or where sexual risk exists, think of chlamydia and gonorrhoea; sudden severe testicular pain in a young man is torsion until proved otherwise and needs same-day surgical review.", src:"BASHH epididymo-orchitis 2020"},
         {tone:"purple", h:"NG12 prostate cancer criteria", html:"NICE NG12 (updated April 2026): refer using a suspected cancer pathway referral for prostate cancer if the <b>prostate feels malignant on digital rectal examination</b>. Consider a PSA and DRE in men with lower urinary tract symptoms (nocturia, frequency, hesitancy, urgency or retention), erectile dysfunction or visible haematuria, and consider a suspected cancer pathway referral if the <b>PSA is above the threshold for their age</b>. A tender, boggy gland in acute infection is not the same as a hard, irregular one; if in doubt, re-examine once the infection has settled.", src:"NICE NG12 (2015, updated April 2026)"},
         {tone:"purple", h:"NG12 haematuria criterion", html:"NICE NG12: refer people <b>aged 45 and over</b> on a suspected cancer pathway for bladder or renal cancer if they have <b>unexplained visible haematuria without urinary tract infection</b>, or <b>visible haematuria that persists or recurs after successful treatment</b> of a urinary tract infection. Blood in the urine during prostatitis must be rechecked after treatment.", src:"NICE NG12 (2015, updated April 2026)"}
       ]},
       {b:"warn", html:"<b>No prostatic massage in acute infection.</b> Vigorous pressure on an infected gland can push bacteria into the bloodstream. A single gentle examination is enough to confirm tenderness; the EAU urological infections guideline (international) advises against massage in acute bacterial prostatitis."}
     ]},

    {id:"assess", nav:"Assess", title:"History, examination and tests", sub:"A short, targeted assessment separates the infected gland from the painful pelvis and finds the man who needs hospital.",
     blocks:[
       {b:"table", head:["Ask or do","What you are looking for","Why"], rows:[
         ["<b>Onset and fever</b>","Hours to days, with rigors and malaise, versus months of fluctuating pain","Acute systemic illness means category I and a treatment clock"],
         ["<b>Urinary symptoms</b>","Dysuria, frequency, urgency, poor stream, straining, retention","Obstruction and retention risk; baseline for later review"],
         ["<b>Pain map</b>","Perineum, rectum, suprapubic, penis, testes, low back; pain on or after ejaculation","Ejaculatory and perineal pain over months is typical of the chronic pain syndrome"],
         ["<b>Recent instrumentation</b>","Catheter, cystoscopy, prostate biopsy","Higher risk of resistant organisms; involve urology early"],
         ["<b>Sexual history</b>","New or multiple partners, urethral discharge","Chlamydia and gonorrhoea can cause urethritis and epididymo-orchitis"],
         ["<b>Previous cultures and antibiotics</b>","Organisms, sensitivities, courses in the last 3 months","Recent trimethoprim use makes resistance more likely"],
         ["<b>Observations</b>","Temperature, pulse, blood pressure, respiratory rate, confusion","Sepsis screen"],
         ["<b>Abdomen and genitals</b>","Palpable bladder, loin tenderness, epididymal or testicular swelling","Retention, pyelonephritis, epididymo-orchitis"],
         ["<b>Gentle rectal examination</b>","Hot, swollen, very tender gland in acute infection; often normal or mildly tender in chronic pain. A hard, nodular gland is a different question","One gentle pass only; no massage"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Urine", html:"Midstream urine for <b>culture and susceptibility before the first dose</b>. A dipstick adds little to the decision in a symptomatic febrile man and must not replace the culture. Repeat culture if symptoms persist or recur.", src:"NICE NG110 (2018) · NICE NG109 (2018)"},
         {tone:"blue", h:"Blood tests", html:"Where the man is being managed at home but is unwell, FBC, CRP, renal function and glucose help judge severity and provide a baseline for the day-14 review that NG110 describes. Anyone septic needs blood cultures in hospital.", src:"NICE NG110 (2018)"},
         {tone:"blue", h:"STI testing", html:"If there is sexual risk or urethral discharge, first-void urine NAAT for chlamydia and gonorrhoea, with a full sexual health screen through local services.", src:"BASHH epididymo-orchitis 2020"},
         {tone:"amber", h:"PSA: not now", html:"Infection can push the PSA very high for weeks. The UKHSA Prostate Cancer Risk Management Programme advises not testing during an active urinary infection or within the <b>previous 6 weeks</b> (also avoid within 48 hours of ejaculation or vigorous exercise, and 6 weeks after a biopsy). Put a reminder in the notes to offer it later where indicated.", src:"UKHSA PCRMP (gov.uk)"}
       ]},
       {b:"why", html:"A raised PSA taken in the middle of acute prostatitis generates an urgent referral, an anxious patient and often an unnecessary MRI, and a normal one taken too soon falsely reassures. The disciplined sequence is: treat the infection, wait at least 6 weeks, then decide whether a PSA is indicated on its own merits under NG12."}
     ]},

    {id:"acute", nav:"Acute", title:"Treating acute bacterial prostatitis at home", sub:"For a man who is not septic, can pass urine and can take tablets. Doses are those stated in NICE NG110; check interactions and renal function in the BNF.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1", when:"where trimethoprim is appropriate", tone:"cream", title:"Trimethoprim 200 mg twice daily for 14 days", html:"NG110 lists trimethoprim as the first-choice alternative when a fluoroquinolone is not appropriate, and the MHRA January 2024 restriction means asking first whether it is. It is less suitable if trimethoprim was used recently, if a previous culture shows resistance, or if it is otherwise unsafe; national <i>E. coli</i> resistance to trimethoprim was about 30% against about 11% for ciprofloxacin in the NG110 evidence, so the culture result matters. The BNF flags folate deficiency, hyperkalaemia (particularly with ACE inhibitors, ARBs or spironolactone) and the methotrexate interaction."},
         {step:"2", when:"when trimethoprim is inappropriate", tone:"amber", fromLabel:"resistant, failed or unsafe", title:"Ciprofloxacin 500 mg or ofloxacin 200 mg twice daily for 14 days", html:"The NG110 first-choice fluoroquinolones, which reach good prostate levels and cover more urinary pathogens. Under the MHRA Drug Safety Update (January 2024) prescribe one only when other commonly recommended antibiotics have failed, will not work because of resistance, or are unsafe for this patient. Record the reason and give the patient information sheet."},
         {step:"3", when:"specialist advice only", tone:"amber", title:"Levofloxacin 500 mg once daily or co-trimoxazole 960 mg twice daily for 14 days", html:"NG110 second choices, used after discussion with a specialist. Levofloxacin is kept for more severe infection; co-trimoxazole is restricted in the UK and needs culture evidence of sensitivity."},
         {step:"Hospital", when:"red flags", tone:"red", fromLabel:"septic, retention, abscess or not improving at 48 h", title:"Intravenous antibiotics and urology", html:"NG110 recommends oral treatment first line where the man can take tablets and is not so unwell that intravenous therapy is needed. Otherwise he is admitted, treated intravenously and reviewed for a step down to oral treatment by 48 hours."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"cream", h:"Pain relief", html:"NG110: <b>paracetamol, with or without a low-dose weak opioid such as codeine</b>, or <b>ibuprofen</b> if preferred and suitable. A stool softener helps if defaecation is painful. Plenty of fluids.", src:"NICE NG110 (2018)"},
         {tone:"cream", h:"Why 14 days", html:"Antibiotics penetrate an inflamed prostate less well than they do the bladder, and relapse into chronic bacterial prostatitis is the concern. NG110 set a minimum of 14 days for every recommended agent, with a planned review at the end.", src:"NICE NG110 (2018)"},
         {tone:"amber", h:"Why not nitrofurantoin", html:"Nitrofurantoin is a first choice for a simple lower UTI in men under NG109, but it does not reach useful concentrations in prostate tissue. Where prostatitis is suspected, do not use it.", src:"NICE NG109 (2018)"},
         {tone:"amber", h:"Fluoroquinolone harms to counsel", html:"Tendon pain, swelling or rupture (higher risk over 60, with corticosteroids and after transplant), muscle and joint pain, peripheral neuropathy, and psychiatric effects including suicidal thoughts (MHRA, September 2023). Small increased risks of aortic aneurysm and dissection (November 2018) and heart valve regurgitation (December 2020). Stop at the first sign of tendon or nerve symptoms.", src:"MHRA DSU Jan 2024 · Sep 2023 · Dec 2020 · Nov 2018"}
       ]},
       {b:"warn", html:"<b>Check the culture when it comes back.</b> If the organism is resistant to what he is taking and he is not improving, change to an agent it is sensitive to. If he is improving on a drug the laboratory reports as resistant, review clinically rather than switching reflexively, and seek microbiology advice."}
     ]},

    {id:"review", nav:"Review", title:"Follow-up: 48 hours, day 14, and after", sub:"The review points are part of the treatment, not optional extras.",
     blocks:[
       {b:"timeline", items:[
         {n:"1", when:"Within 48 hours", title:"Is he getting better?", html:"Symptoms should begin to improve. Worse at any time: reassess. No better by 48 hours: refer to hospital, checking the culture (NICE NG110)."},
         {n:"2", when:"Day 14", title:"Stop or continue", html:"Review history, symptoms, examination, urine and blood results. Continue for <b>a further 14 days</b> if symptoms such as fever or lower urinary tract symptoms persist; otherwise stop (NICE NG110)."},
         {n:"3", when:"At least 6 weeks after infection", title:"PSA and NG12, if indicated", html:"If he has lower urinary tract symptoms, erectile dysfunction or haematuria, or the gland felt abnormal, offer a PSA now and apply the NG12 age thresholds. Recheck urine for blood if haematuria was present."},
         {n:"4", when:"If it keeps coming back", title:"Chronic bacterial prostatitis", html:"Two or more infections with the same organism, or persistent symptoms between episodes: urology, for localised cultures and a planned longer course."}
       ]},
       {b:"say", html:"This is an infection in the prostate gland, which sits just under the bladder. Antibiotics find it harder to get into, so the course is two weeks rather than the usual one, and I may extend it. You should feel better within two days. If you get shivers, feel very unwell, or can’t pass water, go to A&amp;E straight away rather than waiting for us."}
     ]},

    {id:"chronic", nav:"Chronic", title:"Chronic prostatitis / chronic pelvic pain syndrome", sub:"There is no UK guideline for this condition; the European Association of Urology guidelines (2025) are the most complete source and are labelled international throughout.",
     blocks:[
       {b:"p", html:"Chronic pelvic pain syndrome is persistent pain perceived in the prostate region for at least 3 of the previous 6 months, often with urinary, sexual and psychological symptoms, when infection and other structural disease have been reasonably excluded. The EAU now prefers the term <b>primary prostate pain syndrome</b> and frames it as a chronic pain condition with nervous-system sensitisation and pelvic-floor muscle tension, not a smouldering infection."},
       {b:"table", head:["Domain (UPOINT-style phenotyping)","What to ask or find","What helps"], rows:[
         ["<b>Urinary</b>","Frequency, urgency, poor stream, nocturia","Alpha-blocker if within the first year; reduce caffeine and alcohol if they aggravate"],
         ["<b>Psychosocial</b>","Low mood, anxiety, catastrophising, sleep loss, relationship strain","Validation, explanation, pain-focused psychological therapy"],
         ["<b>Organ-specific</b>","Prostate tenderness, symptoms tied to the gland","Anti-inflammatory analgesia; urology if uncertain"],
         ["<b>Infection</b>","Documented organism, recurrent culture-positive episodes","That is category II, not III: urology and targeted antibiotics"],
         ["<b>Neurological / systemic</b>","Pain beyond the pelvis, IBS, fibromyalgia-type pain","Chronic pain approach; consider neuropathic agents with realistic expectations"],
         ["<b>Tenderness of pelvic floor muscles</b>","Tender pelvic floor or perineal trigger points","Specialist pelvic-floor physiotherapy"],
         ["<b>Sexual</b>","Pain on or after ejaculation, erectile difficulties","Address directly; it is often the most distressing symptom"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"cream", h:"Alpha-blocker: early disease only", html:"EAU 2025 supports an alpha-blocker for men whose symptoms have lasted <b>less than one year</b>. Tamsulosin 400 micrograms once daily is the BNF dose for lower urinary tract symptoms; its use in this syndrome is off-label. Warn about postural dizziness, ejaculatory change, and to tell an eye surgeon before cataract surgery (floppy iris syndrome, SPC).", src:"EAU Chronic Pelvic Pain 2025 (international) · BNF · tamsulosin SPC"},
         {tone:"cream", h:"One antibiotic trial, not repeated courses", html:"EAU 2025 supports a single course of a quinolone or tetracycline for <b>at least 6 weeks</b> only in treatment-naive men with symptoms for <b>less than one year</b>. Given the MHRA restrictions, a tetracycline such as doxycycline is usually the more defensible choice in primary care; stop if there is no benefit and do not repeat. The MHRA (March 2019) specifically advises against fluoroquinolones for non-bacterial (chronic) prostatitis.", src:"EAU Chronic Pelvic Pain 2025 (international) · MHRA DSU Mar 2019 and Jan 2024"},
         {tone:"cream", h:"Analgesia", html:"EAU 2025 supports NSAIDs, bearing long-term adverse effects in mind. EAU does not recommend pregabalin for this syndrome because of insufficient evidence of benefit; if a neuropathic agent is tried for wider chronic pain, set a review date and stop it if it does not help.", src:"EAU Chronic Pelvic Pain 2025 (international)"},
         {tone:"green", h:"Physiotherapy, psychology and acupuncture", html:"Pelvic-floor physiotherapy for muscle tenderness, and chronic-pain-focused psychological treatment when distress is significant, are central rather than add-ons. EAU also offers acupuncture as a weak recommendation.", src:"EAU Chronic Pelvic Pain 2025 (international)"},
         {tone:"green", h:"What you can say with confidence", html:"This is common, real and not cancer; it is not caught from or passed to a partner; and it usually improves with a combination of treatments over months rather than with one tablet. Setting that expectation early is the most useful intervention you have.", src:"EAU Chronic Pelvic Pain 2025 (international)"},
         {tone:"blue", h:"Chronic bacterial prostatitis is different", html:"Where cultures repeatedly grow the same organism, EAU Urological Infections 2025 (international) recommends a fluoroquinolone for 4 to 6 weeks, guided by localised (two- or four-glass) cultures. Under the UK restrictions this is a urology-led decision.", src:"EAU Urological Infections 2025 (international) · MHRA DSU Jan 2024"}
       ]},
       {b:"why", html:"Men with chronic pelvic pain often arrive having had several short antibiotic courses and a sense that something is being missed. Each extra course adds fluoroquinolone or resistance risk with little prospect of benefit, and reinforces the belief that infection is the cause. Reframing it as a pain syndrome, treating the domains that are present and offering physiotherapy and psychological support is what the evidence supports."}
     ]},

    {id:"special", nav:"Special groups", title:"Situations that change the plan", sub:"The same diagnosis behaves differently in these men.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"After prostate biopsy or instrumentation", html:"Infection after a biopsy is more often due to resistant organisms and can progress quickly to sepsis. Contact the urology team who did the procedure the same day.", src:"EAU Urological Infections 2025 (international) · NICE NG110 (2018)"},
         {tone:"amber", h:"Indwelling catheter", html:"Catheter-associated infection follows its own NICE guideline (NG113); prostatitis in a catheterised man needs urology involvement and a culture from a freshly changed catheter.", src:"NICE NG113 (2018)"},
         {tone:"amber", h:"Diabetes or immunosuppression", html:"Higher risk of abscess and of atypical organisms. Lower your threshold for hospital review and for imaging if the response is slow.", src:"NICE NG110 (2018)"},
         {tone:"blue", h:"Younger man with sexual risk", html:"Consider urethritis or epididymo-orchitis from chlamydia or gonorrhoea. Test with NAAT and involve sexual health for treatment and partner notification.", src:"BASHH epididymo-orchitis 2020"},
         {tone:"amber", h:"Renal impairment", html:"Trimethoprim, ciprofloxacin and ofloxacin all need dose checks in reduced renal function. Trimethoprim can also raise creatinine and potassium.", src:"BNF · trimethoprim SPC"},
         {tone:"amber", h:"Fluoroquinolone high-risk groups", html:"Over 60, renal impairment, on corticosteroids, after solid organ transplant, with previous fluoroquinolone reactions, or with aneurysm or valve disease. These are the men in whom the MHRA restrictions matter most.", src:"MHRA DSU Jan 2024 · Nov 2018 · Dec 2020"}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — who, where, how fast", sub:"Most acute prostatitis is managed at home. These are the exceptions.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Hospital today", html:"Sepsis or systemic toxicity · acute urinary retention · suspected prostatic abscess · unable to take or keep down oral antibiotics · not improving 48 hours after starting the antibiotic, or worsening at any time.", src:"NICE NG110 (2018)"},
         {tone:"red", h:"Same-day surgical review", html:"Sudden severe testicular pain, especially in a young man: exclude torsion before labelling it epididymo-orchitis.", src:"BASHH epididymo-orchitis 2020"},
         {tone:"purple", h:"Urgent suspected cancer <span class='tw'>2WW</span> · NICE NG12", html:"Refer using a suspected cancer pathway referral for prostate cancer if the <b>prostate feels malignant on digital rectal examination</b>. Consider referral if the <b>PSA is above the age-specific threshold</b> (NG12: above 2.5 microgram/L at 40 to 49, above 3.5 at 50 to 59, above 4.5 at 60 to 69, above 6.5 at 70 to 79; clinical judgement under 40 or over 79), taking the man’s preferences and comorbidities into account. Refer people <b>aged 45 and over with unexplained visible haematuria without urinary tract infection, or visible haematuria that persists or recurs after successful treatment</b> of a urinary tract infection, for bladder or renal cancer.", src:"NICE NG12 (2015, updated April 2026)"},
         {tone:"amber", h:"Urology, soon", html:"Recurrent acute prostatitis or suspected chronic bacterial prostatitis · infection after biopsy or instrumentation · persistent symptoms after a second 14-day course · diagnostic uncertainty, including an abnormal gland once infection has settled but not meeting NG12.", src:"NICE NG110 (2018) · EAU Urological Infections 2025 (international)"},
         {tone:"blue", h:"Urology or pelvic pain service, routine", html:"Chronic pelvic pain syndrome not responding to a first-line multimodal plan after several months, or where the diagnosis is uncertain. Ask about local pelvic pain or pain-management services and pelvic-floor physiotherapy.", src:"EAU Chronic Pelvic Pain 2025 (international)"},
         {tone:"blue", h:"Sexual health", html:"Positive chlamydia or gonorrhoea test, urethral discharge, or ongoing sexual risk: treatment, a full STI screen and partner notification.", src:"BASHH epididymo-orchitis 2020"}
       ]},
       {b:"say", html:"We can treat this infection at home with a two-week course, and I’ll check how you are in a couple of days. Separately, once this has settled, I’d like to do a PSA blood test, because doing it now would give a misleadingly high reading."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 58-year-old man with two days of fever, shivers, burning urine and deep pain ‘behind the scrotum’. He had cystitis treated with trimethoprim four weeks ago. Temperature 38.4 °C, pulse 104, blood pressure normal, passing urine but with a poor stream. He asks for ‘the strong antibiotic my friend had’ (ciprofloxacin) and whether he should have a PSA test while he is here.", src:"NICE NG110 (2018) · MHRA DSU Jan 2024"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Screens for <b>sepsis and retention</b> and sets the 48-hour threshold; sends an <b>MSU before the first dose</b>; recognises that <b>recent trimethoprim</b> changes the choice and explains, in plain words, why a fluoroquinolone is now restricted and what side effects to watch for if one is genuinely needed; gives a <b>14-day course with a day-14 review</b>; declines the PSA today and <b>books it for at least 6 weeks</b> later with the reason; and safety-nets clearly for rigors, confusion and being unable to pass urine.", src:"NICE NG110 (2018) · UKHSA PCRMP · NICE NG12 (2015, updated April 2026)"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Every figure on this page traces to one of these primary sources.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>NICE NG110 — Prostatitis (acute): antimicrobial prescribing (October 2018)<br><a href="https://www.nice.org.uk/guidance/ng110" rel="noopener">nice.org.uk/guidance/ng110</a><span class="rd"> — MSU before antibiotics; oral first line; ciprofloxacin 500 mg or ofloxacin 200 mg twice daily, or trimethoprim 200 mg twice daily if a fluoroquinolone is not appropriate, for 14 days; levofloxacin and co-trimoxazole with specialist advice; review at day 14 and stop or continue for a further 14 days; paracetamol with or without low-dose codeine, or ibuprofen; refer to hospital for serious illness or if not improving 48 hours after starting the antibiotic; national resistance of E. coli about 30% to trimethoprim and about 11% to ciprofloxacin</span></li>'+
         '<li>MHRA Drug Safety Update — Fluoroquinolone antibiotics: must now only be prescribed when other commonly recommended antibiotics are inappropriate (January 2024); March 2019 restrictions, including no use for non-bacterial (chronic) prostatitis; earlier updates on suicidal thoughts and behaviour (September 2023), heart valve regurgitation (December 2020) and aortic aneurysm and dissection (November 2018)<br><a href="https://www.gov.uk/drug-safety-update" rel="noopener">gov.uk/drug-safety-update</a></li>'+
         '<li>NICE NG109 — Urinary tract infection (lower): antimicrobial prescribing (October 2018)<br><a href="https://www.nice.org.uk/guidance/ng109" rel="noopener">nice.org.uk/guidance/ng109</a><span class="rd"> — urine culture before antibiotics in men; nitrofurantoin and trimethoprim for simple lower UTI in men</span></li>'+
         '<li>NICE NG12 — Suspected cancer: recognition and referral (2015, last updated April 2026)<br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — prostate feels malignant on DRE; PSA and DRE for LUTS, erectile dysfunction or visible haematuria; age-specific PSA thresholds (clinical judgement under 40 or over 79); visible haematuria aged 45 and over</span></li>'+
         '<li>NICE NG113 — Urinary tract infection (catheter-associated): antimicrobial prescribing (2018)<br><a href="https://www.nice.org.uk/guidance/ng113" rel="noopener">nice.org.uk/guidance/ng113</a></li>'+
         '<li>UKHSA — Prostate Cancer Risk Management Programme: advising well men about the PSA test (gov.uk)<br><a href="https://www.gov.uk/government/publications/prostate-specific-antigen-testing-explanation-and-implementation/advising-well-men-about-the-psa-test-for-prostate-cancer-information-for-gps" rel="noopener">gov.uk: advising well men about the PSA test (information for GPs)</a><span class="rd"> — no PSA with an active urinary infection or within the previous 6 weeks; 48 hours after ejaculation or vigorous exercise; 6 weeks after biopsy</span></li>'+
         '<li>BASHH — UK national guideline for the management of epididymo-orchitis (2020; Int J STD AIDS 2021)<br><a href="https://www.bashh.org" rel="noopener">bashh.org</a></li>'+
         '<li>Krieger JN, Nyberg L, Nickel JC. NIH consensus definition and classification of prostatitis. JAMA 1999;282:236–237<span class="rd"> — categories I to IV</span></li>'+
         '<li>European Association of Urology — Guidelines on Chronic Pelvic Pain (2025) <b>international</b><br><a href="https://uroweb.org/guidelines/chronic-pelvic-pain" rel="noopener">uroweb.org/guidelines/chronic-pelvic-pain</a><span class="rd"> — primary prostate pain syndrome; alpha-blockers and a single antimicrobial course of at least 6 weeks when symptoms are under 1 year; NSAIDs; acupuncture; pregabalin not recommended; phenotyping; psychological treatment</span></li>'+
         '<li>European Association of Urology — Guidelines on Urological Infections (2025) <b>international</b><br><a href="https://uroweb.org/guidelines/urological-infections" rel="noopener">uroweb.org/guidelines/urological-infections</a><span class="rd"> — no prostatic massage in acute bacterial prostatitis; chronic bacterial prostatitis: localised cultures and 4 to 6 weeks of a fluoroquinolone</span></li>'+
         '<li>BNF and SPCs — trimethoprim, ciprofloxacin, ofloxacin, levofloxacin, co-trimoxazole, tamsulosin<br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a> · <a href="https://www.medicines.org.uk/emc" rel="noopener">medicines.org.uk/emc</a></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Prostatitis in adult men: acute bacterial prostatitis per NICE NG110 (2018) read with the MHRA fluoroquinolone restrictions of January 2024; suspected cancer criteria per NICE NG12 (updated April 2026); chronic prostatitis and chronic pelvic pain per the EAU guidelines (2025, international), as no UK guideline covers it. Check every dose, interaction and renal adjustment in the current BNF and follow your local antimicrobial guidance. Not a substitute for clinical judgement."
