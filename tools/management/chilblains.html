MG.render({
  icon:"🥶",
  title:"Chilblains (perniosis)",
  eyebrow:"Protocol · assess and manage in one place",
  stemTitle:"A cold-season rash that should behave itself: warm it, protect it, and investigate the one that does not",
  stemSub:"Chilblains are itchy or tender red-purple swellings on the toes, fingers, ears or nose that appear some hours after exposure to cold, damp, non-freezing conditions and fade over one to three weeks. Most are idiopathic and need nothing more than warmth, skin care and a clear explanation. The clinical work is spotting the minority that are secondary — chilblain lupus, cryoglobulins or cold agglutinins, a haematological disorder, arterial insufficiency — and the single acral lesion that is not a chilblain at all. Sources: PCDS perniosis and chilblains guidance · BSR SLE guideline 2026 · NICE CG147 · NICE NG12 (updated April 2026) · nifedipine SPC and BNF · Rustin et al 1989 · Souwer et al 2016 · Cappel and Wetter 2014.",
  guideline:"PCDS perniosis and chilblains guidance (accessed Sep 2026) · BSR SLE guideline (2026; first edition 2017/18) · NICE CG147 (2012, updated 2020) · NICE NG12 (updated April 2026) · nifedipine SPC and BNF (off-label use)",
  meta:[
    {t:"PCDS · perniosis and chilblains (accessed Sep 2026)"},
    {t:"BSR SLE guideline 2026 · chilblain lupus context"},
    {t:"NICE CG147 (2012, updated 2020) · arterial differential"},
    {t:"Nifedipine SPC and BNF · off-label for chilblains"},

  ],
  lead:"<div class='mg-layers'><a href='#recognise'><b>Recognise</b><small>cold, acral, delayed</small></a><a href='#redflags'><b>Rule out</b><small>ischaemia, lupus, melanoma</small></a><a href='#warmth'><b>Treat</b><small>warmth and skin care</small></a><a href='#refer'><b>Refer</b><small>the one that misbehaves</small></a></div>",
  quickSub:"The six points that decide this consultation. Every figure is traced to a named primary source under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"blue", h:"Cold, damp, acral and delayed — that is the pattern", html:"A chilblain is an inflammatory reaction of small skin vessels to <b>cold, damp but non-freezing</b> conditions. Lesions come up some hours after the exposure, itch or burn at first and become tender, and sit on the <b>toes</b>, fingers, heels, ears or nose. In the largest single-centre series (104 patients) the toes were affected in 82% and the fingers in 30%, and 79% of patients were women. Individual crops usually fade over one to three weeks, and many people have them every winter.", src:"PCDS perniosis guidance · Cappel and Wetter, Mayo Clin Proc 2014"},
    {tone:"green", h:"Warmth is the treatment — medicines are a sideline", html:"Keep the whole body warm, not just the feet: insulated socks, gloves and footwear, a heated home, and less time in cold, damp conditions. The PCDS also advises avoiding things that constrict skin vessels, such as <b>caffeine and decongestants</b>. Most idiopathic chilblains settle with these measures alone.", src:"PCDS perniosis guidance"},
    {tone:"amber", h:"Persistent, ulcerating or out of season = look for a cause", html:"When the lesions are <b>more severe or persistent, ulcerate or necrose</b>, or sit alongside other significant skin changes, the PCDS advises investigating for <b>connective tissue disease, cryoglobulinaemia and haematological malignancy</b>. Lesions that persist into warm months, affect unusual sites, or come with joint pain, photosensitive rash, mouth ulcers or systemic symptoms belong in this group.", src:"PCDS perniosis guidance"},
    {tone:"amber", h:"Chilblain lupus is the commonest secondary cause", html:"Among immune-mediated causes, <b>SLE is the most frequent association</b>, and chilblain lupus is recognised as a form of cutaneous lupus. If lupus is suspected, the PCDS advises sending <b>both ANA and ENA</b>, because some cutaneous lupus is ANA-negative but ENA-positive. People with SLE should be offered hydroxychloroquine unless contraindicated, with sun protection and smoking cessation — a specialist-led plan.", src:"Dubey et al, Rheumatology 2022 · PCDS · BSR SLE guideline 2026"},
    {tone:"cream", h:"Nifedipine: off-label, with conflicting trials", html:"Nifedipine is licensed in the UK for Raynaud’s phenomenon, not chilblains. A 1989 placebo-controlled trial found <b>20–60 mg daily</b> shortened time to clearance and prevented new lesions; a 2016 primary-care crossover RCT of <b>32 patients</b> found nifedipine <b>30 mg modified-release twice daily</b> no better than placebo at 6 weeks. Reserve it for severe, recurrent, disabling chilblains after warmth measures, explain the off-label use, and dose per BNF.", src:"Rustin et al, Br J Dermatol 1989 · Souwer et al, Ann Fam Med 2016 · nifedipine SPC"},
    {tone:"purple", h:"A single acral lesion that will not settle is a melanoma question", html:"Acral melanoma (sole, palm, nail unit) can be pink rather than pigmented and can be mistaken for a chilblain or a bruise. NICE NG12: <b>refer people using a suspected cancer pathway referral for melanoma if they have a suspicious pigmented skin lesion with a weighted 7-point checklist score of 3 or more</b>; and <b>consider a suspected cancer pathway referral for melanoma in people with a pigmented or non-pigmented skin lesion that suggests nodular melanoma</b>.", src:"NICE NG12 recs 1.7.1 and 1.7.3 (updated April 2026)"}
  ],
  pathwaySub:"Five moves. The red one is where ischaemia, lupus and melanoma get filed as ‘just chilblains’.",
  pathway:[
    {title:"Screen out what it is not", html:"<b>Ulceration, necrosis, black or white digits, rest pain or absent foot pulses</b> (arterial disease, cryoglobulinaemic vasculitis) · a <b>single persistent, changing or bleeding acral lesion</b> (melanoma, especially under or around a nail) · <b>palpable purpura</b> or lesions above the ankles (vasculitis) · <b>tissue frozen hard and white after sub-zero exposure</b> (frostbite, an emergency) · <b>systemic features</b>: fever, weight loss, arthritis, photosensitive rash, mouth ulcers. Any of these changes the destination.", alert:true},
    {title:"Confirm the typical picture", html:"Ask about the <b>cold, damp exposure</b> and the delay of hours before the lesions appeared, previous winters, footwear and heating, smoking, weight and eating, and other symptoms. Examine every digit, the ears and the heels; <b>feel the foot pulses</b>; look at the nail folds, the face and the mouth. Typical symmetrical lesions in a well person in winter need no tests."},
    {title:"Warm, protect and explain", html:"Whole-body warmth, insulated socks, gloves and footwear, a warm home, dry feet, and avoiding caffeine and decongestants (PCDS). Rewarm cold extremities gently rather than in front of direct heat. Keep blistered or broken skin clean and covered; do not scratch. Set the expectation: <b>each crop fades over one to three weeks</b>."},
    {title:"Investigate the atypical", html:"Persistent, ulcerating or out-of-season lesions, or systemic features: <b>FBC, renal and liver function, ESR or CRP, ANA with ENA, complement, rheumatoid factor</b> and a urine dip; consider cryoglobulins, cold agglutinins and protein electrophoresis through the lab or specialist (cryoglobulin samples need to be kept warm). Measure the ABPI if pulses are reduced (NICE CG147)."},
    {title:"Treat severe recurrent disease and refer the unexplained", html:"Severe, recurrent, disabling chilblains despite good preventive measures: discuss <b>off-label nifedipine</b> for the cold season (dose per BNF; SPC contraindications apply). Refer <b>dermatology</b> for diagnostic doubt or biopsy, <b>rheumatology</b> for suspected lupus or other connective tissue disease, <b>vascular</b> for arterial insufficiency, and use the <b>NG12 melanoma pathway</b> for a suspicious solitary acral lesion."}
  ],
  sections:[
    {id:"recognise", nav:"Recognise", title:"Recognising a chilblain", sub:"An inflammatory, not a freezing, cold injury. The diagnosis is clinical and rests on the season, the site and the timing.",
     blocks:[
       {b:"table", head:["Feature","Typical finding","Why it matters"], rows:[
         ["<b>Trigger</b>","Cold combined with <b>damp</b>, at temperatures above freezing; typical in a UK autumn and winter","Damp, poorly heated homes and wet footwear are more relevant than extreme cold. Tissue that actually froze is frostbite, a different injury"],
         ["<b>Timing</b>","Lesions appear <b>hours</b> after the exposure, not during it; each crop fades over <b>one to three weeks</b>","Colour change during the cold exposure itself and recovering within minutes to hours is Raynaud’s phenomenon"],
         ["<b>Look</b>","Red to purple (violaceous) swellings, papules or plaques; may blister or erode; often symmetrical","Crusting, ulceration or necrosis moves the case into the ‘look for a cause’ group"],
         ["<b>Symptoms</b>","Itch and burning at first, then tenderness","Severe constant pain at rest is not typical — think ischaemia"],
         ["<b>Sites</b>","Toes (82% in the Mayo series), fingers (30%), heels, ears, nose","Unusual sites or a single lesion widen the differential"],
         ["<b>Who</b>","More often women (79% in the Mayo series); a mean age at diagnosis of 38 in that series; associations include low body weight and a family tendency","Very low body weight (for example anorexia nervosa) is a contributory factor to ask about sensitively"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"🔎 What the history must cover", html:"Cold and damp exposure (work, commute, outdoor sport, heating at home), how many winters this has happened, <b>whether lesions clear in spring</b>, smoking, weight and eating, medicines that constrict vessels, and a systems enquiry for lupus: joint pain or swelling, photosensitive rash, mouth ulcers, hair loss, dry eyes or mouth, Raynaud’s attacks, fever or weight loss.", src:"PCDS perniosis guidance · BSR SLE guideline 2026"},
         {tone:"blue", h:"🦶 What the examination must cover", html:"All ten toes and fingers, heels, ears and nose; nail folds (dilated or dropped-out capillaries suggest connective tissue disease); <b>femoral, popliteal and foot pulses</b>; skin temperature and capillary refill; the face, scalp and mouth for discoid or other lupus lesions; and any solitary lesion with dermoscopy.", src:"NICE CG147 · LeRoy and Medsger 1992 (international)"}
       ]},
       {b:"why", html:"The underlying mechanism is an abnormal vascular response to cold: prolonged constriction of small skin arterioles, then an inflammatory reaction around the vessels as they reperfuse. That is why lesions come up <b>after</b> the exposure, why damp (which conducts heat away) matters as much as temperature, and why rapid rewarming of a cold, constricted digit tends to make the inflammation worse."}
     ]},

    {id:"redflags", nav:"Red flags", title:"Red flags and what must not be missed", sub:"Most chilblains are harmless. These features mean the lesion is either not a chilblain, or a chilblain with a cause.",
     blocks:[
       {b:"warn", html:"<b>Same day:</b> tissue that froze (hard, white, numb after sub-zero exposure) is frostbite; digits that are black, white and cold, or have rest pain and absent pulses, are critical ischaemia. <b>Soon:</b> ulceration, necrosis, palpable purpura, systemic upset or lesions that persist into the warm months need investigation. <b>Suspected cancer pathway:</b> a solitary acral lesion that is changing, bleeding or involves the nail unit."},
       {b:"cards", cols:2, items:[
         {tone:"red", h:"🚨 Critical limb ischaemia or digital necrosis", html:"Rest pain, ulceration or tissue loss on the foot with reduced or absent pulses. NICE CG147 asks you to examine the legs and feet for evidence of critical limb ischaemia and to check femoral, popliteal and foot pulses; if present, arrange urgent vascular assessment. Remember that the ABPI can be falsely normal or raised in diabetes.", src:"NICE CG147 (2012, updated 2020)"},
         {tone:"red", h:"🧊 Frostbite", html:"Freezing injury after sub-zero exposure: skin that was hard, white or waxy and numb, later blistering (clear or blood-filled) or turning black. This is not a chilblain. Rewarming, analgesia and specialist burns or emergency care are needed the same day; do not rub the tissue."},
         {tone:"amber", h:"🟠 Features of connective tissue disease", html:"Chilblains outside winter, lesions with scale or scarring, <b>arthralgia or synovitis, photosensitive or malar rash, mouth ulcers, alopecia, Raynaud’s with digital ulcers</b>, or abnormal nail-fold capillaries. Send ANA and ENA (both — some cutaneous lupus is ANA-negative, ENA-positive) and refer rheumatology if positive or clinically convincing.", src:"PCDS · BSR SLE guideline 2026 · Dubey et al, Rheumatology 2022"},
         {tone:"amber", h:"🟠 Blood and protein disorders", html:"Chilblain-like lesions that ulcerate, sit alongside purpura or livedo, or occur in an older person with systemic symptoms: consider <b>cryoglobulinaemia, cold agglutinins and haematological malignancy</b>. In the Mayo series 3% had an associated haematological malignancy and cold agglutinins were positive in 11 of the 20 patients tested.", src:"PCDS perniosis guidance · Cappel and Wetter, Mayo Clin Proc 2014"},
         {tone:"purple", h:"🎗 Acral melanoma mimicking a chilblain", html:"One lesion rather than a crop, on a sole, heel, palm or nail unit, that <b>does not fade with warmth over a few weeks</b>, is growing, changing colour, bleeding, or spreading into the nail fold. NICE NG12 rec 1.7.1: <b>refer people using a suspected cancer pathway referral for melanoma if they have a suspicious pigmented skin lesion with a weighted 7-point checklist score of 3 or more.</b> Rec 1.7.3: <b>consider a suspected cancer pathway referral for melanoma in people with a pigmented or non-pigmented skin lesion that suggests nodular melanoma.</b>", src:"NICE NG12 recs 1.7.1 and 1.7.3 (updated April 2026)"},
         {tone:"amber", h:"🟠 Vasculitis", html:"Palpable purpura, lesions spreading up the legs, haematuria or proteinuria on the dip, or systemic upset. Cutaneous small-vessel vasculitis needs a urine dip, renal function, and a lower threshold for biopsy and specialist input."}
       ]}
     ]},

    {id:"differentials", nav:"Differentials", title:"What else a cold, purple digit can be", sub:"The table sorts the look-alikes by the single feature that separates each from an idiopathic chilblain.",
     blocks:[
       {b:"table", head:["Condition","The separating feature","What to do"], rows:[
         ["<b>Idiopathic chilblains</b>","Crops of tender, itchy violaceous lesions hours after cold, damp exposure; clear in 1–3 weeks and in spring; the person is otherwise well","Warmth, skin care, explanation; no tests"],
         ["<b>Chilblain lupus</b>","Persistent lesions, often with scale, crust or scarring; may outlast winter; other lupus features or discoid lesions on the face","ANA and ENA, FBC, complement, urine dip; rheumatology or dermatology referral; biopsy confirms"],
         ["<b>Raynaud’s phenomenon</b>","Episodic, sharply demarcated white then blue then red colour change of the digits <b>during</b> cold or stress, recovering within minutes to hours; no persistent lumps","Assess primary versus secondary: LeRoy and Medsger (international) criteria — symmetrical attacks, no necrosis or ulceration, no secondary cause, normal nail folds, negative ANA and normal ESR"],
         ["<b>Cryoglobulinaemia or cold agglutinin disease</b>","Purpura, livedo, ulceration or necrosis; acral cyanosis in cold; associated hepatitis C, lymphoproliferative disease or connective tissue disease","FBC and film, complement (low C4), rheumatoid factor, protein electrophoresis; cryoglobulins need a warm sample — arrange with lab or specialist"],
         ["<b>Peripheral arterial disease</b>","Older smoker or person with diabetes; claudication, rest pain, cool pale foot, reduced or absent pulses, poor capillary refill","ABPI and pulses (NICE CG147); urgent vascular referral if critical limb ischaemia"],
         ["<b>Frostbite</b>","Tissue frozen after sub-zero exposure; numb, hard, white, then blisters or necrosis","Emergency care the same day"],
         ["<b>Chilblain-like lesions with viral infection</b>","Acral red-purple lesions, often in children and young adults, described during COVID-19 as ‘pseudo-chilblains’ (19% of 375 cases in a Spanish series), usually with mild disease","Usually self-limiting; manage as chilblains and test only if clinically indicated"],
         ["<b>Acral melanoma</b>","Solitary lesion on sole, palm or nail unit that grows, changes or bleeds, and does not fade with warmth","NICE NG12 melanoma pathway — see <a href='#refer'>Refer</a>"],
         ["<b>Cutaneous vasculitis</b>","Palpable purpura, lower-leg distribution, systemic features","Urine dip, renal function; biopsy and specialist input"],
         ["<b>Erythromelalgia</b>","Burning, red, hot feet made <b>worse</b> by warmth and relieved by cooling — the reverse of chilblains","Check FBC (associated with myeloproliferative disorders); specialist advice"]
       ]},
       {b:"why", html:"Two timing questions do most of the work. <b>When does it appear?</b> During the cold and gone within the hour is Raynaud’s; hours after the cold and lasting days is a chilblain. <b>When does it go?</b> A chilblain that is still there in May, or a lesion that never came in a crop, is no longer an idiopathic chilblain."}
     ]},

    {id:"workup", nav:"Tests", title:"Who needs tests, and which", sub:"Typical winter chilblains in a well adult need no investigation. Test when the picture is atypical, severe, persistent or systemic.",
     blocks:[
       {b:"kv", rows:[
         ["No tests needed","Typical symmetrical crops in winter, clearing within weeks and in spring, in a person who is otherwise well with normal pulses and no other skin or systemic features"],
         ["First-line bloods when atypical","<b>FBC and film, renal and liver function, ESR or CRP, ANA with ENA, complement (C3, C4), rheumatoid factor</b> and a <b>urine dip</b> for blood and protein. The PCDS advises sending both ANA and ENA if lupus is suspected, and notes that cryoglobulins are very unlikely when complement and rheumatoid factor are normal"],
         ["Second-line, with the lab or specialist","<b>Cryoglobulins</b> (the sample must be kept at body temperature from collection to the lab), <b>cold agglutinins</b>, <b>serum protein electrophoresis</b>, antiphospholipid antibodies, hepatitis B and C serology where cryoglobulinaemia is suspected"],
         ["Vascular","Pulses and <b>ABPI</b> if the pulses are reduced or there are features of arterial disease (NICE CG147); remember calcified vessels in diabetes can give a falsely normal or high ABPI"],
         ["Biopsy","Through dermatology when the diagnosis is uncertain or chilblain lupus is suspected: histology can distinguish idiopathic perniosis from lupus, vasculitis and other mimics"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"🧪 Reading a positive ANA", html:"A low-titre ANA is common in healthy people and on its own does not make a diagnosis. A positive ANA plus a specific ENA or anti-dsDNA, low complement, cytopenias, proteinuria or clinical lupus features is what matters. The BSR advises supplementing ANA with more specific tests (anti-dsDNA, ENA) when SLE is suspected, and specialist assessment to confirm the diagnosis.", src:"BSR SLE guideline 2026"},
         {tone:"blue", h:"🩸 What the Mayo series found", html:"Of 104 patients with pernio, <b>37% had at least one abnormal laboratory result</b>. Four per cent had an associated connective tissue disease other than lupus and 3% an associated haematological malignancy. Most people still had idiopathic disease — test to find the minority, not by reflex.", src:"Cappel and Wetter, Mayo Clin Proc 2014"}
       ]}
     ]},

    {id:"warmth", nav:"Warmth and skin care", title:"Warmth and skin care: the treatment that works", sub:"There is no drug that replaces keeping warm. This section is most of the management for most people.",
     blocks:[
       {b:"tiles", v:"life", items:[
         {t:"🧦 Warm and dry extremities", html:"Insulated, dry socks and gloves, roomy warm footwear (tight shoes reduce blood flow), and changing out of wet socks promptly. Hand and foot warmers can help (PCDS)."},
         {t:"🏠 Warm the whole body", html:"Core temperature drives skin blood flow. Layered clothing, a hat, and a heated home all matter. Ask about fuel poverty and signpost to local support where heating is unaffordable."},
         {t:"☕ Cut vasoconstrictors", html:"The PCDS advises avoiding caffeine and decongestants, which constrict skin vessels. Review other medicines that may cause cold extremities with the patient."},
         {t:"🚭 Stop smoking", html:"Smoking constricts skin vessels and damages arteries. Offer stop-smoking support; it is also the most important step if arterial disease is part of the picture."},
         {t:"🔥 Rewarm gently", html:"Warm cold hands and feet gradually. Avoid putting them straight onto radiators, fires or hot-water bottles, which can intensify the burning and itch."},
         {t:"🩹 Protect broken skin", html:"Do not scratch. Keep blisters and erosions clean and covered with a simple dressing; watch for spreading redness, pus or fever that would suggest secondary infection."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"cream", h:"🧴 Symptom relief", html:"A bland emollient keeps the skin supple. For itchy, intact lesions some clinicians use a short course of a topical corticosteroid; trial evidence is limited, so use the least potent preparation that helps, and not on ulcerated or necrotic skin. Simple analgesia for tenderness.", src:"BNF topical corticosteroids (general principles)"},
         {tone:"green", h:"⚖ Weight and nutrition", html:"Low body weight is a recognised contributory factor. Ask sensitively about eating and weight in a young person with severe chilblains, and consider an eating disorder where the history fits.", src:"PCDS perniosis guidance"}
       ]},
       {b:"say", html:"These are chilblains — the small blood vessels in your skin over-react when your feet get cold and damp, and the swelling comes up a few hours later. They’re not dangerous and each crop fades over one to three weeks. The treatment is keeping all of you warm, not just your feet: dry, warm socks and roomy shoes, a warm house, and warming up slowly rather than putting your feet on the radiator. Cutting down caffeine and stopping smoking both help. If a sore won’t heal, a patch goes black, or they are still there when the weather warms up, come back."}
     ]},

    {id:"medicines", nav:"Medicines", title:"Medicines: what the evidence allows", sub:"Drug treatment is for severe, recurrent, disabling chilblains after warmth measures have been tried properly. All oral options are off-label.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Step 1", title:"Warmth, skin care, vasoconstrictor avoidance", when:"everyone",
          html:"The measures in the section above, for at least one cold season. Most idiopathic chilblains need nothing more."},
         {step:"Step 2", title:"Symptom relief", when:"itchy or tender intact lesions", fromLabel:"symptomatic",
          html:"Emollient; a short course of topical corticosteroid on intact skin if itch is troublesome (least potent that works, per BNF); simple analgesia."},
         {step:"Step 3", title:"Nifedipine — off-label", when:"severe, recurrent, disabling", fromLabel:"after warmth measures",
          html:"Nifedipine is licensed in the UK for Raynaud’s phenomenon, not chilblains, so explain the off-label use and record consent. Trial doses were <b>20–60 mg daily</b> (Rustin 1989, benefit) and <b>30 mg modified-release twice daily</b> (Souwer 2016, no benefit over placebo). <b>Dose per BNF</b>; it can be taken through the cold months and stopped in spring. Review blood pressure, dizziness, flushing, headache and ankle swelling."},
         {step:"Step 4", title:"Specialist options", when:"refractory or secondary", fromLabel:"refer",
          html:"Refractory disease, diagnostic doubt, or chilblain lupus: dermatology or rheumatology. Hydroxychloroquine and other treatments for chilblain lupus are started and monitored in specialist care."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"⚠ Before prescribing nifedipine", html:"SPC contraindications include <b>cardiogenic shock, clinically significant aortic stenosis, unstable angina, and use during or within one month of a myocardial infarction</b>. <b>Grapefruit juice</b> raises nifedipine levels and should be avoided. Check blood pressure first; many people with chilblains are young women with low-normal pressure. Discuss pregnancy plans and check current pregnancy advice in the BNF and SPC before prescribing.", src:"Nifedipine SPC (emc) · BNF nifedipine"},
         {tone:"blue", h:"📊 What the two trials actually showed", html:"<b>Rustin et al (Br J Dermatol 1989):</b> pilot, double-blind placebo-controlled and long-term open phases; nifedipine 20–60 mg daily reduced time to clearance, prevented new lesions and eased pain and irritation. <b>Souwer et al (Ann Fam Med 2016):</b> 32 Dutch primary-care patients, crossover, nifedipine 30 mg MR twice daily for 6 weeks; the difference in symptom score versus placebo was 1.84 mm on a 100-mm scale and not significant (P = .44). Evidence is thin and conflicting.", src:"Rustin et al, Br J Dermatol 1989 · Souwer et al, Ann Fam Med 2016"}
       ]},
       {b:"why", html:"Nifedipine makes physiological sense — it relaxes the constricted arterioles that drive the inflammation — and it has a licence for Raynaud’s, which is why it has become the default. But the only modern primary-care RCT was negative, both trials were small, and the side effects (flushing, headache, dizziness, oedema) are real for a benign, self-limiting condition. Offer it as a trial for the person whose winters are genuinely disrupted, not as a routine prescription."}
     ]},

    {id:"followup", nav:"Follow-up", title:"Follow-up and prevention across the winter", sub:"Chilblains recur, so plan for next winter rather than only this crop.",
     blocks:[
       {b:"timeline", items:[
         {n:"1", when:"Now", title:"Explain and start warmth measures", html:"Diagnosis, expected course (one to three weeks per crop), warmth and skin care, vasoconstrictor avoidance, smoking support. Document pulses and any solitary lesion."},
         {n:"2", when:"2–4 weeks", title:"Review if not settling", html:"Lesions should be fading. Not settling, ulcerating, or new systemic features → move to investigation. A single lesion that has not changed with warmth → re-examine with dermoscopy and consider the melanoma pathway."},
         {n:"3", when:"Spring", title:"Expect clearance", html:"Idiopathic chilblains clear as the weather warms. Lesions still present in the warm months → investigate for a secondary cause and consider dermatology referral."},
         {n:"4", when:"Next autumn", title:"Prevent the next season", html:"Start warmth measures before the first cold, damp spell. For severe recurrent disease that responded to nifedipine, a seasonal off-label trial can be discussed again (dose per BNF)."}
       ]},
       {b:"say", html:"The best time to deal with chilblains is before they start. When the weather turns cold and damp, get the warm socks, gloves and proper shoes out, keep the house warm, and warm up slowly when you come in. If they’re still there when the weather warms up, or a sore doesn’t heal, that’s the time to come back so we can look for a cause."}
     ]},

    {id:"refer", nav:"Refer", title:"When to refer, and to whom", sub:"Match the route to the question you need answered.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"purple", h:"🎗 Suspected cancer pathway — melanoma (NICE NG12)", html:"<b>Refer people using a suspected cancer pathway referral for melanoma if they have a suspicious pigmented skin lesion with a weighted 7-point checklist score of 3 or more</b> (rec 1.7.1). <b>Refer people using a suspected cancer pathway referral if dermoscopy suggests melanoma of the skin</b> (rec 1.7.2). <b>Consider a suspected cancer pathway referral for melanoma in people with a pigmented or non-pigmented skin lesion that suggests nodular melanoma</b> (rec 1.7.3). Apply these to any solitary acral lesion that does not behave like a chilblain.", src:"NICE NG12 recs 1.7.1–1.7.3 (updated April 2026)"},
         {tone:"red", h:"🚨 Same day", html:"Critical limb ischaemia or digital necrosis with reduced pulses → urgent vascular assessment (NICE CG147). Frostbite → emergency department. Rapidly spreading infection around an ulcerated lesion, or a systemically unwell patient → same-day assessment.", src:"NICE CG147 (2012, updated 2020)"},
         {tone:"amber", h:"🟠 Rheumatology", html:"Positive ANA or ENA with clinical features, low complement, cytopenias, proteinuria, synovitis, or Raynaud’s with digital ulcers — possible SLE, chilblain lupus with systemic disease, or another connective tissue disease. Specialist confirmation and a hydroxychloroquine-based plan.", src:"BSR SLE guideline 2026 · Dubey et al, Rheumatology 2022"},
         {tone:"amber", h:"🟠 Haematology", html:"Cytopenias or an abnormal film, a paraprotein, positive cryoglobulins or cold agglutinins, or chilblain-like lesions with purpura and systemic symptoms in an older adult.", src:"PCDS perniosis guidance · Cappel and Wetter, Mayo Clin Proc 2014"},
         {tone:"blue", h:"🔵 Dermatology (routine or urgent by severity)", html:"Diagnostic doubt; lesions persisting beyond winter; scarring, scaling or ulcerating lesions for biopsy; suspected chilblain lupus confined to the skin; or severe recurrent disease despite warmth measures and a trial of nifedipine.", src:"PCDS perniosis guidance"},
         {tone:"blue", h:"🔵 Vascular (routine)", html:"Reduced pulses or an abnormal ABPI without critical ischaemia, with claudication or other features of peripheral arterial disease — for assessment and secondary prevention per NICE CG147.", src:"NICE CG147 (2012, updated 2020)"}
       ]},
       {b:"say", html:"Most chilblains need nothing more than what we’ve talked about. Because yours are behaving differently — they’re not clearing and they’ve started to break down — I’d like to do some blood tests and ask a specialist to have a look, just to make sure there isn’t something underneath that needs treating in its own right."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 24-year-old student who walks to lectures in canvas trainers has itchy, sore purple lumps on several toes for three weeks in January. She says they come every winter. She is slim, drinks a lot of coffee, and is worried because a friend told her it could be ‘poor circulation’. On direct questioning she has had a sore, stiff wrist and a rash on her cheeks after being in the sun last summer.", src:"PCDS perniosis guidance · BSR SLE guideline 2026"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Makes a confident clinical diagnosis of chilblains from the timing and site; <b>examines the pulses and every digit</b>; <b>does not stop at the diagnosis</b> — picks up the wrist symptoms and photosensitive rash and explains why a lupus screen (ANA with ENA, FBC, complement, urine dip) is now justified; asks sensitively about weight and eating; gives practical warmth, footwear and caffeine advice; explains that nifedipine is <b>off-label with conflicting evidence</b> and is not needed yet; safety-nets for ulceration, necrosis and a non-healing single lesion; arranges review of the results.", src:"PCDS · BSR SLE guideline 2026 · Souwer et al, Ann Fam Med 2016"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Every figure on this page is traceable to a named primary source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>Primary Care Dermatology Society (PCDS) — Perniosis (syn. chilblains)</b> and <b>Chilblains</b> clinical guidance (accessed September 2026)<br><a href="https://www.pcds.org.uk/clinical-guidance/perniosis" rel="noopener">pcds.org.uk/clinical-guidance/perniosis</a><span class="rd"> — itchy or tender red-purple acral lesions as a reaction to cold; contributory factors including low body weight; reduce cold and damp exposure, warm gloves and socks, hand and foot warmers; avoid caffeine and decongestants; investigate for connective tissue disease, cryoglobulinaemia and haematological malignancy when lesions are severe, persistent, ulcerate or necrose</span></li>'+
         '<li><b>PCDS — Investigations</b> and <b>Cutaneous lupus erythematosus</b> guidance (accessed September 2026)<br><a href="https://www.pcds.org.uk/investigations" rel="noopener">pcds.org.uk/investigations</a><span class="rd"> — send both ANA and ENA if lupus is suspected; cryoglobulins unlikely if complement and rheumatoid factor normal; cryoglobulin samples need strict temperature control</span></li>'+
                  '<li><b>British Society for Rheumatology — The 2026 BSR guideline for the management of children, young people and adults with systemic lupus erythematosus</b> (Rheumatology 2026;65(6):keag223; executive summary keag224)<br><a href="https://academic.oup.com/rheumatology/article/65/6/keag223/8713811" rel="noopener">academic.oup.com/rheumatology</a><span class="rd"> — hydroxychloroquine for all with SLE unless contraindicated; photoprotection; smoking cessation; supplementary specific antibody testing; updates the first BSR SLE guideline (Gordon C, et al., Rheumatology 2018;57(1):e1–e45)</span></li>'+
         '<li><b>Dubey S, Joshi N, Stevenson O, Gordon C, Reynolds JA. Chilblains in immune-mediated inflammatory diseases: a review.</b> Rheumatology 2022;61(12):4631–4642<span class="rd"> — SLE is the most common immune-mediated association; chilblain lupus epidemiology and treatment</span></li>'+
         '<li><b>NICE CG147 — Peripheral arterial disease: diagnosis and management</b> (August 2012, updated December 2020)<br><a href="https://www.nice.org.uk/guidance/cg147" rel="noopener">nice.org.uk/guidance/cg147</a><span class="rd"> — ask about claudication and critical limb ischaemia, examine legs and feet, check femoral, popliteal and foot pulses, measure ABPI; ABPI may be normal or raised in diabetes</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral</b> (2015, updated April 2026)<br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — recs 1.7.1 (weighted 7-point checklist score 3 or more), 1.7.2 (dermoscopy suggests melanoma), 1.7.3 (lesion suggesting nodular melanoma)</span></li>'+
         '<li><b>Nifedipine Summary of Product Characteristics</b> (electronic medicines compendium and MHRA product information)<br><a href="https://www.medicines.org.uk/emc" rel="noopener">medicines.org.uk/emc</a><span class="rd"> — immediate-release nifedipine licensed for Raynaud’s phenomenon (not chilblains); contraindications including cardiogenic shock, clinically significant aortic stenosis, unstable angina, during or within one month of myocardial infarction; avoid grapefruit juice</span></li>'+
         '<li><b>BNF</b> — nifedipine; topical corticosteroids<br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — doses, cautions, pregnancy advice</span></li>'+
         '<li><b>Rustin MH, Newton JA, Smith NP, Dowd PM. The treatment of chilblains with nifedipine: the results of a pilot study, a double-blind placebo-controlled randomized study and a long-term open trial.</b> Br J Dermatol 1989;120(2):267–275<span class="rd"> — 20–60 mg daily reduced time to clearance, prevented new lesions, reduced pain and irritation</span></li>'+
         '<li><b>Souwer IH, Bor JH, Smits P, Lagro-Janssen AL. Nifedipine vs placebo for treatment of chronic chilblains: a randomized controlled trial.</b> Ann Fam Med 2016;14(5):453–459<span class="rd"> — 32 patients, crossover, nifedipine 30 mg controlled-release twice daily; difference 1.84 mm on a 100-mm VAS at 6 weeks, P = .44</span></li>'+
         '<li><b>Cappel JA, Wetter DA. Clinical characteristics, etiologic associations, laboratory findings, treatment, and proposal of diagnostic criteria of pernio (chilblains) in a series of 104 patients at Mayo Clinic, 2000 to 2011.</b> Mayo Clin Proc 2014;89(2):207–215<span class="rd"> — 79% women, mean age 38.3; toes 82%, fingers 30%; 37% at least one abnormal test; cold agglutinins positive in 11 of 20 tested; 4% non-lupus connective tissue disease; 3% haematological malignancy</span></li>'+
         '<li><b>Galván Casas C, et al. Classification of the cutaneous manifestations of COVID-19: a rapid prospective nationwide consensus study in Spain with 375 cases.</b> Br J Dermatol 2020;183(1):71–77<span class="rd"> — pseudo-chilblain pattern in 19%, younger patients, less severe disease</span></li>'+
         '<li><b>International — LeRoy EC, Medsger TA Jr. Raynaud’s phenomenon: a proposal for classification.</b> Clin Exp Rheumatol 1992;10(5):485–488<span class="rd"> — used only because no UK criteria exist: primary Raynaud’s defined by symmetrical attacks, no necrosis, ulceration or gangrene, no secondary cause, normal nail-fold capillaries, negative ANA and normal ESR</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Chilblains (perniosis) in primary care — PCDS perniosis and chilblains guidance, the 2026 BSR SLE guideline, NICE CG147 (2012, updated 2020), NICE NG12 (updated April 2026), the nifedipine SPC and BNF, and the Rustin 1989 and Souwer 2016 trials; LeRoy and Medsger 1992 (international) for Raynaud’s classification. Nifedipine is off-label for chilblains: verify every dose against the current BNF. Not a substitute for clinical judgement or your local formulary."
