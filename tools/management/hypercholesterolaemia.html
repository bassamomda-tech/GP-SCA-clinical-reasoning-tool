  quick:[
    {tone:"red", h:"\u26a0 Spot FH before you reach for QRISK", html:"Assess for familial hypercholesterolaemia (these are triggers, not standalone diagnoses) if <b>total cholesterol &gt;7.5 mmol/L</b> or <b>LDL &gt;4.9 mmol/L</b> in an adult, or there are <b>tendon xanthomata</b>, personal CHD &lt;60, or a first-degree relative with CHD &lt;60; <b>TC &gt;9 or non-HDL &gt;7.5 mmol/L</b> needs specialist assessment even without a family history. Use the complete clinical picture with Simon Broome or DLCN criteria, and exclude secondary causes. <b>Never put FH through QRISK \u2014 it underestimates the risk.</b> Search records for cholesterol <b>&gt;9 (aged \u226530)</b> or <b>&gt;7.5 (&lt;30)</b>. Suspect <b>homozygous</b> FH and refer directly if <b>LDL &gt;13 (\u226516y)</b> or <b>&gt;11 (&lt;16y)</b>."},
    {tone:"amber", h:"Who never needs a risk score", html:"<b>Established CVD</b> \u2192 secondary prevention. <b>Suspected FH</b> \u2192 FH pathway. <b>CKD, type 1 diabetes or HIV</b> \u2192 disease-specific criteria, not QRISK3 alone. <b>Age \u226585</b> \u2192 QRISK3 is not appropriate; individualise. <b>QRISK3 is for primary prevention only</b>, ages 25\u201384. A non-fasting lipid profile is sufficient."},

    {tone:"cream", h:"The dose depends on the track", html:"<b>Secondary prevention: atorvastatin 80 mg</b> at diagnosis, unless interactions, high adverse-effect risk, frailty, intolerance or patient preference indicate a lower dose. <b>Primary prevention (QRISK3 \u226510%): atorvastatin 20 mg</b> after informed discussion. <b>CKD: atorvastatin 20 mg</b> for primary or secondary prevention (a CKD-specific modification of the 80 mg approach). <b>Type 1 diabetes: atorvastatin 20 mg</b> when NICE age, duration, nephropathy or risk-factor criteria are met."},

  pathway:[
    {title:"Frame the patient", html:"Established CVD \u2192 secondary prevention, no score. Suspected FH \u2192 FH pathway, not QRISK3. CKD, type 1 diabetes or HIV \u2192 disease-specific guidance, not QRISK3 alone. Aged \u226585 \u2192 individual assessment. Otherwise primary prevention \u2192 QRISK3 (ages 25\u201384)."},

    {title:"Exclude secondary causes", html:"Renal function, ALT/AST, HbA1c where clinically appropriate, TSH if clinically indicated, alcohol history, drug review \u2014 treat secondary causes before labelling it primary hypercholesterolaemia or starting a primary-prevention statin, without avoidably delaying treatment in established CVD."},

  sections:[

    {id:"confirm", nav:"Frame &amp; confirm", title:"Framing the diagnosis \u2014 primary, secondary, or familial", sub:"Getting the frame right prevents both under-treating the high-risk and medicalising the low-risk.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Secondary prevention \u2014 no score needed", html:"<b>Established atherosclerotic CVD:</b> MI or ACS, angina, stroke or TIA, peripheral arterial disease, coronary or other arterial revascularisation. High-risk by definition \u2014 <b>do not calculate QRISK3</b>; the risk is already realised."},
         {tone:"blue", h:"Primary prevention \u2014 QRISK3 decides", html:"No established CVD \u2192 estimate 10-year risk with <b>QRISK3</b> (ages 25\u201384) and decide by shared decision. A non-fasting profile (total, HDL, non-HDL, triglycerides) is sufficient."}
       ]},
       {b:"dl", rows:[
         ["<b>Familial hypercholesterolaemia</b> \u2014 screen first","Suspect FH using the <b>complete clinical picture</b>: persistent untreated lipid levels, family history of premature coronary disease, tendon xanthomata, premature personal CVD and secondary-cause assessment \u2014 do not use lipid cut-offs alone. Triggers for assessment: <b>TC &gt;7.5 or LDL &gt;4.9 mmol/L</b> in an adult, tendon xanthomata, premature CVD, or a first-degree relative with CHD &lt;60; <b>TC &gt;9 or non-HDL &gt;7.5 mmol/L</b> needs specialist assessment even without a family history. Use <b>Simon Broome</b> or the <b>Dutch Lipid (DLCN) score</b> as a structured assessment \u2014 <b>3\u20135 possible, 6\u20138 probable, &gt;8 definite FH</b> \u2014 and refer possible or probable cases according to the local lipid pathway for genetic testing; <b>cascade screening of relatives</b> is arranged through the specialist FH service. Search records for cholesterol <b>&gt;9 mmol/L (aged \u226530)</b> or <b>&gt;7.5 (&lt;30)</b>. <b>Homozygous FH \u2014 refer directly without applying the criteria \u2014 if LDL &gt;13 (\u226516y) or &gt;11 (&lt;16y)</b>"],
         ["Simon Broome criteria","<b>Definite FH:</b> TC &gt;7.5 (adult) or LDL &gt;4.9, <b>plus tendon xanthomata</b> in the patient or a first- or second-degree relative. <b>Possible FH:</b> TC &gt;7.5 plus a family history of MI &lt;60, or TC &gt;7.5 in a first-degree relative"],
         ["Secondary causes \u2014 treat first","<b>Hypothyroidism</b> (TSH when symptoms or clinical features suggest it \u2014 investigate and treat clinically significant hypothyroidism before labelling dyslipidaemia primary), <b>nephrotic syndrome</b> (urine dipstick, hypoalbuminaemia, oedema), diabetes (HbA1c), CKD (eGFR), alcohol excess, pregnancy, and drugs (ciclosporin, amiodarone, retinoids)"],
         ["Common polygenic","Most cases, once secondary causes are excluded and FH criteria are not met"],
         ["Mixed dyslipidaemia","Raised triglycerides + raised LDL + low HDL \u2014 usually metabolic syndrome. Check fasting triglycerides, HbA1c, waist circumference and BP. <b>Statin remains the primary treatment</b>"],
         ["Hypertriglyceridaemia","<b>\u22654.5 mmol/L</b>: repeat a fasting sample and assess secondary causes; at 4.5\u20139.9 mmol/L CVD risk may be underestimated \u2014 optimise other risk factors, and seek specialist advice if non-HDL-C is &gt;7.5 mmol/L. <b>Calculated LDL-C may be unreliable above 4.5 mmol/L</b> \u2014 use non-HDL-C and/or specialist advice. <b>\u226510 mmol/L</b>: address alcohol, diabetes, hypothyroidism and medicines urgently, repeat a fasting sample (within 2 weeks at 10\u201320 mmol/L) and seek specialist advice, particularly if persistent. <b>\u226510 mmol/L with abdominal pain or vomiting: same-day assessment for pancreatitis.</b> <b>Very severe levels, particularly &gt;20 mmol/L: urgent specialist management</b> (NICE NG238). A triglyceride result alone does not require emergency admission in an asymptomatic patient"],
         ["Isolated low HDL","<b>&lt;1.0 mmol/L (men) or &lt;1.2 (women)</b> \u2014 no specific drug treatment; address lifestyle. Low HDL with high triglycerides indicates high cardiovascular risk"]
       ]},
       {b:"why", html:"Familial hypercholesterolaemia affects about <b>1 in 250</b> people in the UK \u2014 roughly 260,000 individuals \u2014 but only about <b>7% are diagnosed</b>. Untreated it carries a <b>50% risk of CHD by age 50 in men and 30% in women</b>, and a 35-year-old with untreated FH carries the risk of a 55-year-old without it. Every FH patient identified means each first-degree relative has a <b>50%</b> chance of being affected, which is why cascade screening through the NHS programme matters so much."}
     ]},

    {id:"severe", nav:"Red-flag branch", title:"When a lipid result is part of urgent disease", sub:"Most high cholesterol is incidental. These are the exceptions, and one of them is an emergency of a different organ altogether.",
     blocks:[
       {b:"warn", html:"<b>Never conflate a lipid result with clinical urgency \u2014 or the reverse.</b> Exertional or acute chest pain is <b>ACS until proven otherwise \u2192 999</b>, whatever the cholesterol is doing. And <b>triglycerides &gt;10 mmol/L with nausea, vomiting or abdominal pain is a same-day acute-pancreatitis risk</b>, not a lipid-clinic letter."},
       {b:"cards", items:[
         {tone:"red", h:"Triglycerides &gt;10 mmol/L with abdominal symptoms", html:"Nausea, abdominal pain, vomiting \u2192 <b>same-day</b> assessment for pancreatitis, consider admission. Eruptive xanthomata indicate severe hypertriglyceridaemia \u2192 urgent specialist advice. An asymptomatic high result alone needs urgent repeat, secondary-cause correction and specialist advice \u2014 not emergency admission."},
         {tone:"red", h:"Chest pain", html:"Exertional chest pain, known coronary disease, or acute onset \u2192 <b>999</b>. Treat as ACS until proven otherwise."},
         {tone:"amber", h:"Corneal arcus under 45 with TC &gt;7.5", html:"Or tendon xanthomata \u2192 <b>prompt</b> FH assessment with Simon Broome or DLCN criteria and referral according to the local lipid pathway. Corneal arcus is a normal finding in the elderly but significant under 45."},
         {tone:"amber", h:"Xanthelasma in a young patient", html:"Eyelid plaques under 50 with a family history of early MI \u2192 <b>prompt</b> FH assessment and lipid-clinic referral per the local pathway if criteria are met."},
         {tone:"blue", h:"Hypothyroidism as the cause", html:"Raised TSH, new or uncontrolled \u2014 secondary hyperlipidaemia. <b>Investigate and treat clinically significant hypothyroidism before labelling dyslipidaemia as primary.</b> In high-risk or secondary-prevention patients, discuss whether lipid-lowering treatment should start alongside thyroid treatment rather than delaying cardiovascular protection."},
         {tone:"blue", h:"Nephrotic syndrome as the cause", html:"Proteinuria +++, hypoalbuminaemia, peripheral oedema \u2192 <b>urgent medical assessment and investigation</b>. <b>Same-day admission</b> if there is acute kidney injury, severe oedema or respiratory compromise, thrombosis, infection, severe hypertension or systemic illness. Do not treat the cholesterol in isolation."},
         {tone:"purple", h:"NG12 \u2014 no criterion applies", html:"Hypercholesterolaemia is not a NICE NG12 suspected-cancer criterion. Where a lipid panel is being taken as part of a picture of <b>unexplained weight loss</b>, follow the relevant NG12 route on its own merits rather than treating the lipid result as the diagnosis."}
       ]},
       {b:"why", html:"Secondary causes \u2014 hypothyroidism, nephrotic syndrome, uncontrolled diabetes, alcohol \u2014 should be treated before primary-prevention statin initiation (without avoidably delaying treatment in established CVD), or the lipid picture will not resolve and the patient ends up on escalating doses for a problem the statin was never going to fix."}
     ]},

    {id:"risk", nav:"Risk &amp; QRISK3", title:"Cardiovascular risk \u2014 QRISK3 and the conversation", sub:"Risk stratification determines whether to treat, not the cholesterol level alone.",
     blocks:[
       {b:"table", head:["QRISK3 (10-year)","Interpretation","Action"], rows:[
         ["<b>&lt;10%</b>","Low risk","Lifestyle advice; a statin is <b>not routinely offered</b> \u2014 but do not rule it out if the patient chooses it after an informed discussion, or if risk is underestimated. <b>Recheck lipids and QRISK3 in 5 years</b>, or sooner if risk factors change"],
         ["<b>10\u201320%</b>","Moderate risk","Offer <b>atorvastatin 20 mg</b> as a shared decision; discuss lifestyle first, but do not delay treatment when the patient prefers it"],
         ["<b>&gt;20%</b>","High risk","Offer a statin <b>promptly \u2014 do not delay with a lifestyle-only period</b>. Atorvastatin 20 mg"],
         ["<b>Established CVD</b>","Secondary prevention","<b>Atorvastatin 80 mg</b> regardless of cholesterol level. Do not calculate QRISK3"],
         ["<b>Type 1 diabetes</b>","NICE criteria \u2014 do not use QRISK3 alone","Offer <b>atorvastatin 20 mg</b> if <b>aged &gt;40, diabetes &gt;10 years, nephropathy or other cardiovascular risk factors</b>; consider treatment in younger adults after individualised discussion"],
         ["<b>CKD (eGFR &lt;60 or ACR \u22653)</b>","CKD-specific \u2014 do not use QRISK3 alone","<b>Atorvastatin 20 mg</b> for primary and secondary prevention \u2014 a CKD-specific modification of the usual 80 mg secondary-prevention start; if the lipid target is not met and eGFR is \u226530, increase the dose if appropriate; seek renal/specialist advice before higher doses if eGFR &lt;30. <b>Do not use simvastatin above 10 mg if eGFR &lt;45</b>. SHARP trial evidence"],
         ["<b>Aged \u226585</b>","Individualise","QRISK3 is not appropriate. Consider atorvastatin 20 mg after individual assessment of frailty, polypharmacy, comorbidity, life expectancy, treatment goals and patient preference"]
       ]},
       {b:"dl", rows:[
         ["What QRISK3 needs","Age, sex, ethnicity, smoking, systolic BP, <b>total cholesterol:HDL ratio</b>, BMI, family history, and comorbidities (diabetes, CKD, AF, rheumatoid arthritis, SLE, severe mental illness). Available at qrisk.org or embedded in clinical systems"],
         ["Where QRISK3 underestimates","<b>HIV</b> (BHIVA HIV-specific guidance: offer a statin at \u226540 years, choosing the statin after checking antiretroviral interactions), severe mental illness, autoimmune disease, corticosteroids, recently stopped smoking, and drugs that raise lipids \u2014 treat the score as a starting point, not a verdict"],
         ["<b>Where QRISK must not be used, or not alone</b>","<b>FH and established CVD</b> \u2014 treat on their own pathways. <b>Type 1 diabetes, CKD and HIV</b> \u2014 use disease-specific criteria rather than QRISK3 alone. <b>Aged \u226585</b> \u2014 QRISK3 is not appropriate; individualise"],
         ["The insight","A patient with TC 8 mmol/L and QRISK3 5% needs lifestyle advice; a patient with TC 5 mmol/L and QRISK3 25% needs atorvastatin today"]
       ]},
       {b:"why", html:"QRISK3 replaced Framingham in UK guidance because it adds risk factors (severe mental illness, SLE, AF, deprivation, migraine) and calibrates better to UK populations. NG238 uses a <b>10%</b> threshold for offering a statin."}
     ]},

    {id:"exam", nav:"Examination", title:"Targeted examination", sub:"Two findings here change the diagnosis outright, and one measurement matters as much as the lipid result.",
     blocks:[
       {b:"table", head:["What","Look for","Why it changes the plan"], rows:[
         ["<b>Hands and tendons</b>","<b>Tendon xanthomata</b> \u2014 thickened Achilles tendons, extensor tendons of the hands. Run a finger along the tendon feeling for nodules. Tuberous xanthomata over knuckles suggest familial combined hyperlipidaemia","<b>Pathognomonic of FH</b> \u2014 with TC &gt;7.5 this gives <em>definite</em> FH on Simon Broome criteria without genetic testing"],
         ["<b>Eyes</b>","<b>Corneal arcus</b> with TC <b>&gt;7.5 mmol/L</b> (significant under 45, normal in the elderly), <b>xanthelasma</b> (eyelid plaques, significant in a patient <b>&lt;50</b>). Fundoscopy if diabetic","Trigger for FH assessment (Simon Broome or DLCN) \u2192 lipid clinic per the local pathway if criteria are met"],
         ["<b>Blood pressure</b>","Both arms, seated","Hypertension and hyperlipidaemia are <b>multiplicative</b> risk factors \u2014 <b>undertreated hypertension quadruples CV risk even on a statin</b>. Treat to the NICE NG136 target (clinic &lt;140/90 under 80)"],
         ["BMI and waist","BMI &gt;30, or waist &gt;102 cm (M) / &gt;88 cm (F)","Metabolic syndrome \u2014 interpret with the TC:HDL ratio and triglycerides"],
         ["Cardiovascular","Carotid bruits, peripheral pulses (ABPI \u2014 the ankle\u2013brachial index, ABI \u2014 if PAD suspected), murmurs, ankle oedema","May reveal undiagnosed established CVD \u2014 which moves the patient to secondary prevention"],
         ["Thyroid","Goitre, slow-relaxing reflexes, dry skin, bradycardia","Clinical hypothyroidism \u2192 check TSH and treat; in high-risk or secondary-prevention patients, discuss starting lipid-lowering alongside thyroid treatment"],
         ["Abdomen","Hepatomegaly (fatty liver, alcohol), splenomegaly, abdominal xanthomas","Severe hypertriglyceridaemia, or an alcohol contribution"]
       ]}
     ]},

    {id:"workup", nav:"Investigations", title:"Investigations and their interpretation", sub:"Non-fasting is fine for screening. What matters is what you do and do not order.",
     blocks:[
       {b:"dl", rows:[
         ["Lipid profile","Total cholesterol, LDL-C, HDL-C, triglycerides, <b>TC:HDL ratio</b>. <b>Non-fasting is acceptable for initial screening</b>; fasting preferred if triglycerides are raised. A <b>TC:HDL ratio &lt;4</b> is desirable, and the ratio is more predictive than total cholesterol alone. When triglycerides are &gt;4.5 mmol/L, calculated LDL-C may be unreliable — use non-HDL-C and/or specialist advice"],
         ["Baseline before a statin","<b>Renal function</b>, <b>liver transaminases (ALT/AST)</b>, <b>glucose/HbA1c</b> where clinically appropriate, and <b>TSH</b> when symptoms or clinical features suggest thyroid disease. Ask about persistent unexplained generalised muscle pain, tenderness or weakness: <b>measure CK if symptoms are present or the patient is at increased risk of myopathy</b>; do not measure CK routinely in asymptomatic patients. Baseline CK &gt;5\u00d7 ULN \u2192 repeat after 7 days and do not start if still &gt;5\u00d7 ULN; raised but &lt;5\u00d7 ULN \u2192 consider a lower-dose statin"],
         ["Treatment targets","<b>Primary prevention: &gt;40% reduction in non-HDL-C at 2\u20133 months</b> \u2014 no absolute LDL target. <b>Secondary prevention: LDL \u22642.0 mmol/L (2.0 mmol/L) or non-HDL \u22642.6 mmol/L</b> (NG238 / QOF)"],
         ["Genetic testing","Via lipid clinic \u2014 <b>LDLR, APOB, PCSK9</b> mutations. A positive result confirms FH and enables <b>cascade screening of relatives through the NHS programme</b>, which is free"],
         ["<b>When not to investigate</b>","Do <b>not</b> repeat lipids within 3 months of the last result; do <b>not</b> order CK routinely before a statin (asymptomatic exercise-related rises cause needless statin avoidance); do <b>not</b> check lipids during acute illness (falsely low)"],
         ["Repeat after treatment","<b>Full lipid profile and liver transaminases at 2\u20133 months</b> after starting or changing treatment; transaminases at <b>12 months</b>, then not routinely unless clinically indicated (NICE NG238); no routine CK unless symptomatic"]
       ]},
       {b:"why", html:"Non-HDL is the better target than LDL: it needs no fasting and captures all atherogenic particles. NG238 moved to LDL-C targets in secondary prevention in line with ESC guidance, supported by trials and Mendelian randomisation showing that lower is better."}
     ]},

    {id:"lifestyle", nav:"Lifestyle", title:"Lifestyle \u2014 a concurrent treatment, not an optional add-on", sub:"Offered to everyone, alongside statins rather than instead of them. Lifestyle interventions improve overall cardiovascular risk and may modestly improve lipids, but the magnitude varies considerably; they complement rather than replace statin treatment when pharmacological prevention is indicated.",
     blocks:[
       {b:"table", head:["Change","What to advise","Effect"], rows:[
         ["<b>Mediterranean diet</b>","Olive oil, <b>oily fish \u22652\u00d7/week</b>, legumes, nuts, vegetables, wholegrains","Improves overall cardiovascular risk (PREDIMED studied cardiovascular events; it is not a statin-equivalence trial). Lipid effect modest and variable"],
         ["<b>Saturated fat</b>","Replace butter, red meat and full-fat dairy with olive oil, avocado, oily fish","Replacing saturated fat with unsaturated fat modestly lowers LDL; the size varies"],
         ["<b>Plant sterols/stanols</b>","<b>Do not recommend</b> as a CVD-prevention treatment (NICE NG238) \u2014 including for people on primary or secondary prevention, or with CKD or diabetes","They may lower cholesterol, but this does not establish cardiovascular outcome benefit \u2014 focus on overall dietary pattern instead"],
         ["<b>Soluble fibre</b>","Oats, psyllium, beans \u2014 porridge for breakfast is a simple, evidence-based recommendation","Modest LDL lowering by binding bile acids; the size varies"],
         ["<b>Physical activity</b>","<b>\u2265150 minutes/week</b> moderate intensity; aerobic most effective","Improves triglycerides, HDL and overall cardiovascular risk; the size varies"],
         ["<b>Weight loss</b>","Structured support; BMI below 25 where achievable","Modest improvement in LDL, triglycerides and HDL; the size varies"],
         ["<b>Smoking cessation</b>","NHS stop-smoking service \u00b1 NRT or varenicline","Smoking lowers HDL, which recovers after quitting. Stop-smoking service support improves quit rates compared with willpower alone \u2014 and cardiovascular risk falls"],
         ["<b>Alcohol</b>","<b>&lt;14 units/week</b> with 2 alcohol-free days","Excess raises triglycerides and LDL \u2014 a common reversible cause of a \u201cbad\u201d profile"]
       ]},
       {b:"kv", rows:[
         ["Lifestyle alone","Reasonable for <b>QRISK &lt;10%</b>, or for those who decline a statin \u2014 with a defined reassessment interval. It complements rather than replaces a statin when pharmacological prevention is indicated"],
         ["Whole-risk optimisation","Treat the blood pressure and the diabetes, and review drugs that raise lipids \u2014 the lipid result is one component of the risk, not the whole of it"]
       ]}
     ]},

    {id:"ladder", nav:"Treatment", title:"Starting the statin \u2014 dose and intensity by group", sub:"Atorvastatin is first-line: potent per mg, once daily at any time, and far fewer interactions than simvastatin.",
     blocks:[
       {b:"table", head:["Indication","Statin","Notes"], rows:[
         ["<b>Secondary prevention</b> (established CVD)","<b>Atorvastatin 80 mg OD</b>","Start <b>immediately at diagnosis, including after ACS</b> \u2014 do not delay. Lower dose only for drug interactions, high adverse-effect risk, frailty, intolerance, CKD or patient preference"],
         ["<b>Primary prevention, QRISK3 \u226510%</b>","<b>Atorvastatin 20 mg OD</b>","Discuss lifestyle first, but do not delay treatment when the patient prefers it or risk is high (\u226520%: offer promptly)"],
         ["<b>CKD</b> (eGFR &lt;60 or ACR \u22653)","<b>Atorvastatin 20 mg OD</b>","For primary <em>and</em> secondary prevention \u2014 a CKD-specific modification of the usual 80 mg secondary-prevention start. If the target is not met and eGFR is \u226530, increase the dose if appropriate; seek renal/specialist advice before higher doses if eGFR &lt;30. <b>Avoid high-dose simvastatin in CKD</b>"],
         ["<b>Type 1 diabetes</b>","<b>Atorvastatin 20 mg OD</b>","If aged &gt;40, diabetes &gt;10 years, nephropathy or other cardiovascular risk factors (NICE); consider in younger adults after individualised discussion — not QRISK3 alone"],
         ["<b>Type 2 diabetes</b>","<b>Atorvastatin 20 mg OD</b>","Only if QRISK3 \u226510% (primary prevention) \u2014 not automatic for everyone with type 2 diabetes"],
         ["<b>HIV, aged \u226540</b>","Offer a statin (BHIVA HIV-specific guidance, not NICE lipid guidance)","QRISK underestimates risk in HIV; select the statin after checking antiretroviral interactions"],
         ["<b>Aged \u226585</b>","Consider atorvastatin 20 mg","QRISK3 not appropriate; individual assessment of frailty, polypharmacy, comorbidity, life expectancy, treatment goals and patient preference"]
       ]},
       {b:"dl", rows:[
         ["High- vs moderate-intensity","\u201cHigh-intensity\u201d means a <b>\u226540% LDL reduction</b>: atorvastatin 20\u201380 mg, rosuvastatin 10\u201340 mg"],
         ["Interactions","<b>Simvastatin</b> with amlodipine, diltiazem, verapamil, macrolides, azoles or some HIV drugs \u2192 dose caps and myopathy risk. <b>Hold the statin during a clarithromycin or erythromycin course.</b> Atorvastatin is cleaner but still check every new prescription. Grapefruit matters only at heavy intake"],
         ["Pregnancy","<b>Do not use statins during pregnancy.</b> Stop statins if pregnancy occurs or is being planned \u2014 usually three months before conception \u2014 and do not restart until breastfeeding is completed; follow current specialist advice regarding breastfeeding and the urgency of lipid treatment. Women with severe FH or established CVD may require specialist advice about bile-acid sequestrants or LDL apheresis. Counsel women of childbearing potential and discuss contraception"]
       ]},
       {b:"ladder", steps:[
         {step:"1", title:"Optimise before escalating", when:"target missed at 2\u20133 months",
          html:"Confirm <b>adherence</b> and correct dose timing, reinforce diet and lifestyle, and exclude or treat secondary causes (hypothyroidism, alcohol, drugs). <b>Apparent non-response is often adherence.</b> Recheck a full lipid profile at 2\u20133 months."},
         {step:"2", title:"Maximise the statin", when:"genuinely adherent",
          fromLabel:"titrate",
          html:"<b>Atorvastatin 20 \u2192 40 \u2192 80 mg OD</b> to the highest tolerated dose (about a <b>40\u201355% LDL fall at 80 mg</b>). Secondary-prevention patients should already be on 80 mg. Recheck at 2\u20133 months after each step."},
         {step:"3", title:"Switch to a more potent statin", when:"insufficient or partly intolerant",
          fromLabel:"potency per mg",
          html:"<b>Rosuvastatin 10 \u2192 20 \u2192 40 mg OD</b> \u2014 <b>rosuvastatin 20 mg \u2248 atorvastatin 40\u201380 mg</b>. Useful where atorvastatin 80 mg is not tolerated."},
         {step:"4", title:"Add ezetimibe 10 mg OD", when:"still above target on maximum tolerated statin",
          fromLabel:"first add-on",
          html:"A further <b>~15\u201320% LDL</b> (about 21% non-HDL) reduction, cheap and well tolerated, and available as a fixed-dose combination for adherence. <b>Add ezetimibe when the relevant NICE target is not reached on maximum tolerated statin therapy</b> \u2014 in secondary prevention, NICE NG238 (2023) advises adding it when LDL stays above 2.0 mmol/L (non-HDL above 2.6). Confirm adherence and statin dose first, and be clear whether this is primary or secondary prevention. Also the default monotherapy in true statin intolerance."},
         {step:"5", title:"Bempedoic acid", when:"statin contraindicated or not tolerated and ezetimibe inadequate",
          fromLabel:"NICE TA694 / local criteria",
          html:"<b>Bempedoic acid 180 mg OD with ezetimibe 10 mg OD</b>, as separate tablets or the fixed-dose combination \u2014 NICE TA694 recommends it only with ezetimibe, when statins are contraindicated or not tolerated and ezetimibe alone does not control LDL-C. <b>Not a routine add-on to a high-dose statin</b> \u2014 check the indication against NICE and local Greater Manchester commissioning criteria. Check uric acid and gout history (it may increase urate) and monitor for tendon problems."},
         {step:"6", title:"Inclisiran 284 mg SC", when:"secondary prevention with LDL \u22652.6 despite maximum therapy",
          fromLabel:"local pathway",
          html:"Established ASCVD with <b>LDL-C \u22652.6 mmol/L</b> despite maximum tolerated statin \u00b1 ezetimibe. Doses at <b>0 and 3 months, then 6-monthly</b>. Inclisiran is specialist- or locally commissioned pathway treatment for selected adults with established CVD (NICE TA733 \u2014 not a general primary-prevention treatment); follow the current Greater Manchester pathway for initiation and administration."},
         {step:"Refer", title:"PCSK9 inhibitor \u2014 specialist-initiated", when:"NICE TA393/394 thresholds",
          fromLabel:"lipid clinic",
          html:"<b>Evolocumab 140 mg SC every 2 weeks (or 420 mg monthly)</b>, or <b>alirocumab 75\u2013150 mg SC every 2 weeks</b> \u2014 a further <b>50\u201360% LDL fall</b>. Thresholds for persistent LDL despite maximum tolerated therapy: <b>FH without CVD &gt;5.0; CVD high-risk &gt;4.0; CVD very-high-risk &gt;3.5 mmol/L</b>. Cost is about \u00a34,500/year against \u00a320/year for a statin, hence specialist initiation."}
       ]},
       {b:"why", html:"Each 1 mmol/L reduction in LDL-C reduces major cardiovascular events by about <b>22%</b> (Cholesterol Treatment Trialists). A high-intensity statin in secondary prevention reduces events by <b>25\u201335% over 5 years</b> (NNT roughly 15\u201320), and adding ezetimibe gives a further <b>6\u20137%</b> event reduction (IMPROVE-IT). Fibrates are for severe hypertriglyceridaemia to prevent pancreatitis \u2014 not routine cholesterol treatment."}
     ]},

    {id:"myalgia", nav:"Myalgia", title:"Statin muscle symptoms \u2014 the main reason people quit, and mostly fixable", sub:"True statin myopathy is rare. Treat myalgia as a problem to solve, not a reason to leave a secondary-prevention patient unprotected.",
     blocks:[
       {b:"dl", rows:[
         ["The reality","Many reported statin symptoms are non-specific and may recur with placebo (SAMSON showed a substantial <b>nocebo</b> component in selected participants), but symptoms should be assessed seriously \u2014 do not dismiss them as \u201cnot the statin\u201d. Rechallenge, dose reduction or switching can recover useful statin treatment in many patients"],
         ["<b>Check CK and the red flags</b>","<b>On treatment:</b> severe muscle symptoms, weakness or dark urine \u2192 <b>stop the statin and check CK, renal function and urine</b>. <b>CK &gt;10\u00d7 ULN or suspected rhabdomyolysis \u2192 urgent assessment.</b> <b>CK 5\u201310\u00d7 ULN \u2192 stop and seek clinical advice</b>; repeat testing and rechallenge depend on symptoms and trend. Symptomatic with CK &lt;5\u00d7 ULN \u2192 can usually be reassured and assessed for other causes; work through the options below. <b>Before starting (baseline):</b> CK &gt;5\u00d7 ULN \u2192 repeat after 7 days, do not start if still &gt;5\u00d7; raised but &lt;5\u00d7 \u2192 consider a lower-dose statin (NICE NG238)"],
         ["The rechallenge approach","Stop for <b>2\u20134 weeks</b> \u2014 do the symptoms actually resolve? \u2192 rechallenge at the same or a lower dose, or with a different statin, or <b>alternate-day or twice-weekly rosuvastatin (e.g. 5 mg)</b>. Systematic rechallenge, dose reduction or switching recovers useful statin treatment in many patients"],
         ["Check the amplifiers","Vitamin D deficiency, hypothyroidism, drug interactions, new or unaccustomed exercise, alcohol \u2014 fix these before declaring intolerance"],
         ["True intolerance","Documented failure of <b>2\u20133 statins</b> including low-dose attempts \u2192 <b>ezetimibe 10 mg OD monotherapy</b>, then bempedoic acid with ezetimibe or injectables only according to NICE technology appraisals and local Greater Manchester commissioning and lipid-clinic pathways. <b>Do not leave them on nothing</b>"]
       ]},
       {b:"warn", html:"<b>Nocebo is real, but so is the cardiovascular benefit \u2014 and symptoms still deserve proper assessment.</b> Frame statins positively \u2014 the evidence is overwhelming \u2014 warn proportionately, and adjust rather than abandon."}
     ]},

    {id:"target", nav:"Monitoring", title:"Monitoring, follow-up and safety-netting", sub:"The 2\u20133 month recheck is the critical intervention point: without intensification there, around 60% of high-risk patients stay above target.",
     blocks:[
       {b:"table", head:["Check","When","Action"], rows:[
         ["<b>Full lipid profile</b>","<b>2\u20133 months</b> after starting or changing","<b>Primary prevention: aim &gt;40% reduction in non-HDL-C from baseline.</b> <b>Secondary prevention: LDL \u22642.0 mmol/L or non-HDL \u22642.6 mmol/L.</b> Not achieved \u2192 adherence and lifestyle \u2192 up-titrate \u2192 add ezetimibe"],
         ["<b>Liver transaminases</b>","<b>Baseline, at 2\u20133 months, and at 12 months</b> \u2014 then not routinely, only if clinically indicated (NICE NG238)","<b>Only stop if transaminases are persistently &gt;3\u00d7 ULN</b> \u2014 mild rises are common and not a reason to stop. Restart at a lower dose once resolved"],
         ["CK","Only if muscle symptoms","No routine CK in asymptomatic patients. Severe symptoms \u2192 stop and check CK; <b>&gt;10\u00d7 ULN or suspected rhabdomyolysis \u2192 urgent assessment</b>; 5\u201310\u00d7 ULN \u2192 stop and seek advice; &lt;5\u00d7 ULN \u2192 usually reassure and assess other causes"],
         ["HbA1c","In those at risk","Statins slightly raise type 2 diabetes risk \u2014 the net cardiovascular benefit clearly outweighs it; monitor rather than withhold"],
         ["Annual review","12 months onwards","Lipid profile, <b>QRISK3 recalculation</b> (it changes with age and new diagnoses), lifestyle review, adherence check"],
         ["Those not on treatment","Periodically","Reassess QRISK3 and lipids \u2014 <b>every 5 years</b> if QRISK &lt;10%, sooner if risk factors change"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"\ud83d\udd34 Stop and contact us the same day", html:"\u201cSevere unexplained muscle pain or weakness, or dark cola-coloured urine \u2014 stop the statin and contact us the same day so we can check a blood test.\u201d Jaundice \u2192 stop and urgent LFTs."},
         {tone:"red", h:"\ud83d\udea8 Chest pain is separate", html:"\u201cChest pain means 999, regardless of your cholesterol treatment.\u201d"},
         {tone:"amber", h:"\ud83d\udc8a Mild aches", html:"\u201cMild aches are common and often settle, but tell us rather than just stopping \u2014 we take them seriously, can check them, and can adjust the dose or switch; there is usually an option that works.\u201d"},
         {tone:"amber", h:"\ud83e\udd30 Pregnancy", html:"\u201cStatins should not be used in pregnancy. Tell us if you are planning a pregnancy \u2014 we usually stop them about three months beforehand \u2014 and stop and contact us if you become pregnant.\u201d"},
         {tone:"green", h:"\ud83e\uddec Family", html:"\u201cIf your cholesterol is very high and runs in the family, your relatives should be tested too, through the specialist family (cascade) testing service \u2014 it can be an inherited condition, and finding it early protects them.\u201d"}
       ]},
       {b:"say", html:"Cholesterol treatment is about the long game \u2014 lowering your risk of a heart attack or stroke years down the line. The statin does most of the work; we check a blood test in a couple of months to prove it is working, and a 40% drop is the goal. If muscle aches bother you we adjust rather than give up \u2014 there is almost always a version you can tolerate."}
     ]},

    {id:"loop", nav:"Not responding?", title:"Not at target? Work through this before escalating", sub:"",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"1 · Adherence", html:"Actually taking it? Explore myalgia beliefs, nocebo, dosing confusion — much apparent 'failure' is here."},
         {tone:"amber", h:"2 · The 40% test", html:"Non-HDL fallen ≥40%? If not on a supposedly-taken high-intensity statin, suspect non-adherence or interaction."},
         {tone:"blue", h:"3 · Secondary cause", html:"Untreated hypothyroidism, uncontrolled diabetes, alcohol, nephrotic — treat the driver."},
         {tone:"blue", h:"4 · Is it FH?", html:"Very high baseline + FHx → possible FH: assess with Simon Broome or DLCN, refer via the local lipid pathway; cascade screening through the specialist FH service."},
         {tone:"blue", h:"5 · Myalgia handled?", html:"Rechallenge/alternate-day tried, amplifiers fixed — or written off too soon?"},
         {tone:"amber", h:"6 · Escalate", html:"Genuinely maxed + adherent + still above target → ezetimibe → bempedoic acid, inclisiran or PCSK9 inhibitor only through NICE and local pathways; refer complex or refractory cases."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer \u2014 lipid clinic and specialist input", sub:"What primary care keeps is as important as what it sends on.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same day", html:"<b>Triglycerides \u226510 mmol/L with abdominal pain or vomiting</b> \u2192 same-day assessment for pancreatitis. <b>Very severe levels, particularly &gt;20 mmol/L \u2192 urgent specialist management.</b> Asymptomatic \u226510 mmol/L \u2192 address alcohol, diabetes, hypothyroidism and medicines urgently, repeat fasting (within 2 weeks at 10\u201320 mmol/L) and seek specialist advice, particularly if persistent; eruptive xanthomata \u2192 urgent specialist advice (NICE NG238). A triglyceride result alone does not require emergency admission in an asymptomatic patient."},
         {tone:"amber", h:"Lipid clinic \u2014 prompt", html:"Refer promptly according to the local (Greater Manchester) lipid pathway for <b>possible or probable FH</b> (Simon Broome or DLCN) for genetic testing; tendon xanthomata; premature CVD; <b>severe persistent LDL-C elevation meeting local specialist-referral criteria</b> (for example LDL &gt;4.9 mmol/L in an adult, or LDL &gt;4.0 under 40 \u2014 local criteria, not universal NICE rules, and not automatically FH); paediatric FH and children of FH patients; suspected homozygous FH. Same-day assessment is not usually required unless there is acute CVD, symptomatic severe hypertriglyceridaemia or another medical emergency. Cascade screening is arranged through the specialist FH service \u2014 do not ask relatives to self-interpret lipid results."},
         {tone:"blue", h:"Lipid clinic \u2014 routine", html:"LDL not at target despite maximum tolerated statin plus ezetimibe; <b>statin intolerance after \u22653 different statins</b>; consideration of a PCSK9 inhibitor or inclisiran; complex or mixed dyslipidaemia; diagnostic uncertainty."},
         {tone:"blue", h:"Cardiology", html:"A secondary-prevention patient not at LDL target on atorvastatin 80 mg where a PCSK9 inhibitor is being considered \u2014 specialist initiation is required on the NHS."},
         {tone:"blue", h:"Endocrinology", html:"Secondary hyperlipidaemia from uncontrolled diabetes or thyroid disease not responding to primary-care management."},
         {tone:"cream", h:"Primary care manages", html:"Primary prevention with QRISK3 10\u201320% \u2014 lifestyle discussion and a statin after informed discussion; secondary prevention on atorvastatin 80 mg achieving target; mild mixed dyslipidaemia with lifestyle modification; <b>inclisiran and bempedoic acid only where NICE criteria and the local Greater Manchester commissioning pathway allow primary-care initiation</b>."}
       ]},
       {b:"why", html:"PCSK9 inhibitors lower LDL by a further 50\u201360% on top of maximum statin therapy and are indicated when LDL stays above the NICE TA393/TA394 thresholds despite maximum tolerated treatment. FH cascade screening through the NHS programme is free and identifies high-risk relatives before they develop CVD \u2014 every FH diagnosis in primary care potentially protects several family members."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only \u2014 the Casebook keeps the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 38-year-old woman, total cholesterol 8.4 mmol/L, father had an MI at 52. She has read that statins \u201cdamage your muscles\u201d, feels well, and wants to \u201cfix it with diet\u201d. QRISK3 is 3%."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Recognises that QRISK is the wrong tool here and that this is possible FH; examines for tendon xanthomata and arcus; excludes secondary causes; explains the inherited nature and <b>cascade screening for relatives</b>; addresses the statin-myalgia belief with the nocebo evidence without dismissing her; refers to the lipid clinic; discusses pregnancy planning and statins. <a href='../../cases/hypercholesterolaemia.html'>Open the full casebook chapter \u2192</a>"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG238 \u2014 Cardiovascular disease: risk assessment and reduction, including lipid modification (2023)</b><br><a href="https://www.nice.org.uk/guidance/ng238" rel="noopener">nice.org.uk/guidance/ng238</a><span class="rd"> \u2014 QRISK3 use and the 10% threshold, who not to risk-score, atorvastatin doses by group, the &gt;40% non-HDL target, LDL \u22642.0 / non-HDL \u22642.6 in secondary prevention, ezetimibe even at target; type 1 diabetes and CKD statin criteria, triglyceride thresholds, baseline and on-treatment CK thresholds, full lipid profile and transaminases at 2\u20133 months, and no plant sterols or stanols for CVD prevention</span></li>'+
         '<li><b>NICE CG71 \u2014 Familial hypercholesterolaemia (2008, updated 2019)</b><br><a href="https://www.nice.org.uk/guidance/cg71" rel="noopener">nice.org.uk/guidance/cg71</a><span class="rd"> \u2014 Simon Broome criteria, record search thresholds, homozygous FH LDL levels, genetic testing and cascade screening</span></li>'+
         '<li><b>NICE NG238 \u2014 CVD risk assessment and lipid modification</b><span class="rd"> \u2014 primary-care operationalisation, monitoring intervals, statin intolerance pathway</span></li>'+
         '<li><b>NICE TA385, TA393, TA394, TA694 and TA733</b><span class="rd"> \u2014 TA385 ezetimibe; TA393 alirocumab and TA394 evolocumab with their LDL thresholds (FH without CVD &gt;5.0; CVD high-risk &gt;4.0; very-high-risk &gt;3.5 mmol/L); TA694 bempedoic acid; TA733 inclisiran</span></li>'+
         '<li><b>Cholesterol Treatment Trialists\u2019 Collaboration</b><span class="rd"> \u2014 each 1 mmol/L LDL reduction lowers major vascular events by ~22%</span></li>'+
         '<li><b>IMPROVE-IT; PREDIMED; SHARP; SAMSON</b><span class="rd"> \u2014 ezetimibe add-on benefit (6\u20137%); Mediterranean diet and cardiovascular events (not a statin-equivalence trial); statins in CKD; a substantial nocebo component of statin muscle symptoms in selected participants</span></li>'+
         '<li><b>Greater Manchester Medicines Management Group \u2014 lipid management pathways</b><br><a href="https://gmmmg.nhs.uk" rel="noopener">gmmmg.nhs.uk</a><span class="rd"> \u2014 Guidelines for Primary Prevention of Cardiovascular Disease through Lipid Management, and the Lipid Medication Eligibility Pathway for Secondary Prevention in Established Cardiovascular Disease (2025): local referral and high-cost-drug criteria for bempedoic acid, inclisiran and PCSK9 inhibitors</span></li>'+
         '<li><b>QRISK3</b><br><a href="https://qrisk.org" rel="noopener">qrisk.org</a><span class="rd"> \u2014 the calculator and its input variables</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> \u2014 all doses, statin interactions (macrolides, calcium-channel blockers, azoles, antiretrovirals), and pregnancy contraindications</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Lipid management and hypercholesterolaemia in adults \u2014 NICE NG238 (2023), CG71 (FH), NG238, TA385/393/394/694/733. Diagnosis and management are merged on this page; there is no separate high-cholesterol pathway to cross-check. Verify all doses against the current BNF, and check bempedoic acid, inclisiran and PCSK9 eligibility against NICE technology appraisals and the local Greater Manchester lipid pathways."
