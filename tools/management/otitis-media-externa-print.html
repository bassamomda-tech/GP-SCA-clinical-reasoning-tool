MG.render({

  stemTitle:"Middle ear or ear canal? Examine the canal, drum, pinna and mastoid — and assess the patient’s general condition",
  stemSub:"One page for the painful ear in primary care. Separate acute otitis media (usually self-limiting — pain relief first, antibiotics by NG91 criteria) from otitis externa (a topical problem) and glue ear (a hearing problem), and catch the few that are dangerous: mastoiditis, necrotising otitis externa in the diabetic or immunosuppressed patient, intracranial spread, sudden sensorineural hearing loss, and the adult with a one-sided effusion. NICE NG91 (2018, updated 2022; under 18s) · NICE NG233 (2023) · NICE NG98 (2018) · UKHSA antimicrobial summary · Greater Manchester (GMMMG) antimicrobial guidelines · ENT UK (2007, 2020) · BNF and BNFC. A clinical decision aid with prescribing references: check doses and cautions in the local formulary before prescribing.",
  guideline:"NICE NG91 (2018, updated March 2022) · NICE NG233 (2023) · NICE NG98 (2018) · NICE NG143 (2019) · UKHSA Summary of antimicrobial prescribing guidance (2025) · GMMMG Greater Manchester antimicrobial guidelines · ENT UK aminoglycoside consensus (2007) · ENT UK necrotising otitis externa guidance (2020) · BSO community management of hearing loss and aural blockage (2023) · MHRA Drug Safety Updates · BNF and BNFC",
  meta:[

  ],
  quickSub:"Six cards that cover most of the decisions. Every figure traces to a primary source listed under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"Look behind the ear before you look in it", html:"Swelling, redness or tenderness over the mastoid, with the pinna pushed forwards and outwards, in an unwell child is <b>mastoiditis</b>. NICE NG91: refer to hospital any child or young person with acute otitis media and a severe systemic infection or an acute complication — mastoiditis, meningitis, intracranial abscess, sinus thrombosis or facial nerve paralysis.", src:"NICE NG91 (2018, updated 2022)"},
    {tone:"red", h:"Severe ear-canal pain in a diabetic: think necrotising otitis externa", html:"Pain out of proportion to the findings (often worse at night), persistent discharge, granulation tissue in the canal floor, or a facial nerve palsy in someone with <b>diabetes, immunosuppression or frailty</b>, or failure to respond to appropriate topical treatment → treat as <b>possible necrotising otitis externa</b> and discuss with ENT the <b>same day</b>. Risk factors alone do not establish the diagnosis, and diabetes alone is not a referral trigger; diagnosis needs specialist assessment, microbiology and imaging. Do not prescribe repeated courses of drops without reassessment.", src:"ENT UK necrotising otitis externa guidance (2020) · Hodgson et al., BMJ Open 2023 (consensus definitions)"},
    {tone:"green", h:"Acute otitis media: pain relief first", html:"NICE NG91: most children and young people get better within about 3 days without antibiotics, though it can last up to a week. Offer <b>paracetamol or ibuprofen</b>. Where no immediate antibiotic is given and the drum is intact, <b>phenazone with lidocaine ear drops</b> are an option (added to NG91 in March 2022); review if symptoms do not improve within 7 days or worsen at any time. NG91 covers children and young people under 18 — adult AOM is not covered (see <a href='#aom'>adults</a>).", src:"NICE NG91 (2018, updated March 2022)"},
    {tone:"cream", h:"Antibiotic? No, back-up or immediate — by NG91 criteria", html:"<b>Immediate</b> for systemic illness, suspected serious infection or complication, or high risk of complications due to significant comorbidity or immunosuppression. For children with <b>otorrhoea</b>, or <b>under 2s with bilateral AOM</b>, <b>consider</b> no antibiotic, a back-up or an immediate antibiotic depending on severity, duration, systemic features and follow-up reliability — these groups may benefit more but do not automatically need an immediate antibiotic. Otherwise no antibiotic or a back-up. First choice <b>amoxicillin for 5 to 7 days</b>; clarithromycin (erythromycin in pregnancy) if allergic; <b>co-amoxiclav second choice</b> if symptoms worsen after at least 2 to 3 days of first-choice treatment.", src:"NICE NG91 (2018, updated 2022) · BNFC"},
    {tone:"blue", h:"Otitis externa is treated in the canal, not by mouth", html:"Analgesia, ear care and removing the cause for everyone. <b>Mild</b>: analgesia, ear care and acetic acid may be adequate. <b>Moderate/severe</b>: a <b>topical antibiotic with or without steroid</b> is usually more appropriate (acetic acid 2% is an option for moderate infection per GMMMG). Keep the ear dry and clean the canal if drops cannot get in. <b>Do not use oral antibiotics for uncomplicated OE</b>; consider oral treatment only for cellulitis extending beyond the canal or systemic illness, per the local antimicrobial guideline. Treatment failure: reconsider the diagnosis, drop delivery, fungal infection, contact dermatitis, foreign body or necrotising otitis externa.", src:"GMMMG antimicrobial guidelines · UKHSA antimicrobial summary (2025) · Cochrane, Kaushik 2010"},
    {tone:"amber", h:"Glue ear: watch for 3 months; one-sided effusion in an adult: look further", html:"NICE NG233: children with otitis media with effusion have <b>active observation for 3 months</b>, with autoinflation for those who can manage it, before hearing aids or grommets are considered. In adults, NICE NG98: consider a <b>suspected cancer pathway referral</b> to ENT for adults of Chinese or south-east Asian family origin with hearing loss and a middle-ear effusion not associated with an upper respiratory tract infection (nasopharyngeal cancer).", src:"NICE NG233 (2023) · NICE NG98 (2018)"}
  ],
  pathwaySub:"Five moves. The first step is the one that protects patients — do not skip it because the drum looks obvious.",
  pathway:[
    {title:"Screen for the dangerous ear", html:"Mastoid swelling or tenderness · a pinna pushed forwards · severe headache, neck stiffness, drowsiness or focal signs · facial weakness · suspected necrotising otitis externa · sudden hearing loss over 3 days or less · vesicles on the pinna or in the canal with facial weakness (Ramsay Hunt) · severe infection in a cochlear-implant patient · severe systemic illness or suspected sepsis · a very unwell or febrile young child (NICE NG143). Any of these changes the destination before any drug is chosen (NICE NG91).", alert:true},
    {title:"Decide where the problem is", html:"<b>Middle ear:</b> acute symptoms (usually otalgia or irritability) with a bulging or opaque drum, loss of landmarks or reduced mobility — acute otitis media; a red drum alone is insufficient. <b>Ear canal:</b> pain on moving the tragus or pinna, a swollen, moist or debris-filled canal — otitis externa. <b>Painless dull drum with muffled hearing:</b> glue ear. A normal ear with persistent otalgia requires examination of the teeth, TMJ, oral cavity, pharynx, larynx-related symptoms and neck; persistent unilateral otalgia, particularly with dysphagia, hoarseness, weight loss or smoking history, requires urgent head and neck assessment."},
    {title:"Acute otitis media: pain relief, then the antibiotic decision", html:"Paracetamol or ibuprofen for everyone. Ear drops with an anaesthetic if no immediate antibiotic and no perforation. Antibiotic strategy by the NICE NG91 criteria (under 18s); amoxicillin 5 to 7 days when needed. Adults: NG91 does not apply — confirm the diagnosis carefully and follow the local antimicrobial guideline (e.g. GMMMG)."},
    {title:"Otitis externa: clean, dry, topical", html:"Remove the cause (water, cotton buds, hearing-aid moulds, dermatitis), clear debris (aural toilet, microsuction or a wick) so drops reach the skin. Acetic acid for suitable mild/moderate disease; a topical antibiotic with or without steroid for more inflamed disease. Avoid aminoglycosides if a perforation or grommet is present unless specifically advised by ENT. Oral antibiotics only for extension beyond the canal or systemic illness (local antimicrobial guideline)."},
    {title:"Plan the follow-up", html:"Acute otitis media: reassess if not starting to improve after 3 days or worsening significantly at any time; the back-up prescription may then be used. Otitis externa: pain usually begins to improve within 48–72 hours (complete resolution can take up to 2 weeks); if not, check drop delivery and canal patency and reconsider the diagnosis — fungal, a blocked canal, or necrotising disease. Glue ear: 3 months of active observation with formal hearing testing and tympanometry (NICE NG233)."}
  ],
  sections:[
    {id:"distinguish", nav:"Which ear", title:"Telling the three apart at the bedside", sub:"History narrows it; the otoscope and the tragus decide it.",
     blocks:[
       {b:"table", head:["","Acute otitis media","Otitis externa","Otitis media with effusion (glue ear)"], rows:[
         ["<b>Typical patient</b>","Young child after a cold; less often an adult","Swimmers, people with eczema or psoriasis, cotton-bud users, hearing-aid wearers, diabetics","Young children, often after an episode of acute otitis media; children with Down syndrome or cleft palate"],
         ["<b>Main symptom</b>","Rapid-onset earache, fever, irritability, ear-pulling in infants","Itch then pain, discharge, a blocked feeling","Muffled hearing, inattention, speech or behaviour concerns; <b>little or no pain</b>"],
         ["<b>Key sign</b>","Bulging or opaque drum with loss of landmarks or reduced mobility (a red drum alone is insufficient — crying, fever or canal trauma can redden it); new otorrhoea not caused by otitis externa","Pain on moving the tragus or pinna; red, swollen canal with debris; drum may be hard to see","Dull or retracted drum, fluid level or bubbles, reduced mobility"],
         ["<b>First step</b>","Analgesia; antibiotic by NICE NG91 criteria","Aural toilet if needed; acetic acid (mild/moderate) or antibiotic ± steroid drops (local antimicrobial guideline)","Active observation for 3 months (NICE NG233)"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Examine more than the drum", html:"General condition first; then both ears (canal and drum where visible), the pinna and tragus, <b>behind the ear</b> (the mastoid), the cranial nerves (especially the facial nerve), the oral cavity, throat and teeth, the jaw joint, and the neck. Test hearing informally and note any asymmetry. A child also needs temperature, heart rate, capillary refill and a general look using the NICE NG143 traffic-light approach if febrile and under 5.", src:"NICE NG91 · NICE NG143 (2019)"},
         {tone:"amber", h:"A discharging ear hides the drum", html:"Otorrhoea with a history of acute pain that eased suddenly suggests a perforated drum from acute otitis media. Chronic painless discharge, especially foul-smelling, with a pocket or crust in the upper part of the drum suggests <b>cholesteatoma</b> — an ENT problem, not a drops problem. Do not irrigate an ear when cholesteatoma or a perforation is suspected, and avoid repeated empiric topical courses without ENT assessment. Refer suspected cholesteatoma to ENT, urgently if there is facial weakness, vertigo, severe pain, neurological features or rapidly progressive hearing loss. Treat what you can see and re-examine once the canal is clean.", src:"ENT UK 2007 · NICE NG91"}
       ]}
     ]},

    {id:"redflags", nav:"Red flags", title:"Red flags — the ears that need someone else today", sub:"Rare, but each one is missed by looking only in the canal.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"Acute mastoiditis", html:"Post-auricular swelling, redness and tenderness, a pinna pushed forwards and outwards, fever and a sick child, usually during or after acute otitis media. NICE NG91: refer to hospital.", src:"NICE NG91 (2018, updated 2022)"},
         {tone:"red", h:"Intracranial or facial nerve complications", html:"Severe headache, neck stiffness, drowsiness, vomiting, seizures or focal neurology, or a new facial palsy with an ear infection → emergency referral for meningitis, abscess, venous sinus thrombosis or facial nerve involvement (NICE NG91).", src:"NICE NG91 (2018, updated 2022)"},
         {tone:"red", h:"Necrotising (malignant) otitis externa", html:"Severe, persistent, often night-time ear pain and discharge in a person with diabetes or immunosuppression or in an older adult, with granulation tissue in the canal, failure of topical treatment, or cranial nerve palsies (VII first). Risk factors alone do not establish the diagnosis — it needs specialist assessment, swabs, canal clearance, microbiology and imaging, with malignancy considered when the presentation is atypical or response is poor. <b>Emergency admission/A&amp;E:</b> sepsis, cranial nerve palsy, neurological signs, severe systemic illness or suspected intracranial spread. <b>Same-day ENT discussion:</b> suspected necrotising otitis externa without instability. <b>Urgent ENT/aural care:</b> canal too swollen for drops or debris that cannot be cleared. The trigger is severe, persistent, disproportionate or treatment-resistant disease — not diabetes alone.", src:"ENT UK necrotising otitis externa guidance (2020) · Hodgson et al., BMJ Open 2023 (consensus definitions)"},
         {tone:"red", h:"The febrile, unwell young child", html:"Earache is common in febrile children, but so is serious bacterial illness. Use the NICE NG143 traffic-light features; any red feature needs same-day assessment whatever the ears look like.", src:"NICE NG143 (2019)"},
         {tone:"red", h:"Sudden sensorineural hearing loss", html:"Sudden hearing loss developing over 3 days or less, particularly if unilateral and not explained by wax, canal oedema or middle-ear effusion, requires <b>immediate/urgent ENT discussion</b> as possible sudden sensorineural hearing loss. Do not delay referral for routine audiology or a trial of antibiotics. Also urgent: sudden hearing loss with vertigo, new tinnitus with sudden hearing loss, facial weakness with ear symptoms, and vesicles on the pinna or in the canal suggesting Ramsay Hunt syndrome.", src:"BSO/ENT UK community management of hearing loss and aural blockage (2023) · NICE NG98 (2018)"},
         {tone:"amber", h:"Adult with a one-sided middle-ear effusion", html:"NICE NG98: for adults of Chinese or south-east Asian family origin with hearing loss and a middle-ear effusion not associated with an upper respiratory tract infection, consider a suspected cancer pathway referral to ENT (nasopharyngeal carcinoma). Separately (clinical practice, beyond NICE): any new, persistent or unexplained unilateral adult middle-ear effusion warrants ENT assessment to exclude nasopharyngeal or other obstructive pathology. Not every adult unilateral effusion meets suspected cancer (two-week-wait) referral criteria.", src:"NICE NG98 (2018)"},
         {tone:"amber", h:"Don’t-miss mimics", html:"Ramsay Hunt syndrome (vesicles in the canal or on the pinna with facial weakness), a foreign body, cholesteatoma, and referred pain from dental disease, the jaw joint or the throat — including persistent unilateral otalgia, particularly with dysphagia, hoarseness, weight loss or smoking history, which requires urgent head and neck assessment.", src:"NICE NG98 · NICE NG91"}
       ]},
       {b:"why", html:"<b>Why look behind the ear?</b> Mastoiditis is a complication of the middle-ear infection you are looking at, and the drum can look no worse than an ordinary otitis media. Necrotising otitis externa is the reverse trap: the canal looks like ordinary otitis externa, but the pain and the patient’s risk factors are what give it away."}
     ]},

    {id:"aom", nav:"Otitis media", title:"Acute otitis media — managing the pain and the antibiotic decision", sub:"NICE NG91 applies to children and young people under 18 years. Adult AOM is not covered by NG91; in adults, confirm the diagnosis carefully, assess for complications and use the local antimicrobial guideline/formulary for treatment and dosing.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Step 1", title:"Pain relief and explanation", when:"everyone", fromLabel:"the mainstay",
          html:"<b>Paracetamol or ibuprofen</b> at the right dose for age or weight (BNFC). Explain the usual course: about 3 days, sometimes up to a week (NICE NG91). Tell parents what to watch for."},
         {step:"Step 2", title:"Anaesthetic ear drops", when:"no immediate antibiotic, drum intact", fromLabel:"added March 2022",
          html:"NICE NG91: consider <span class='rx'>phenazone 40 mg/g with lidocaine 10 mg/g ear drops, 4 drops two or three times a day for up to 7 days</span> — only if an immediate oral antibiotic is not being given and there is no perforation or otorrhoea. Review if symptoms do not improve within 7 days or worsen at any time."},
         {step:"Step 3", title:"No antibiotic or a back-up prescription", when:"most children", fromLabel:"stewardship",
          html:"NICE NG91: offer no antibiotic or a <b>back-up prescription</b>, to be used if symptoms do not start to improve within 3 days or worsen significantly at any time. For children of any age with <b>otorrhoea</b>, or <b>under 2 with infection in both ears</b>, consider no antibiotic, a back-up prescription or an immediate antibiotic depending on severity, duration, systemic features and follow-up reliability — these groups may benefit more (NNT about 3 and 4 in the NG91 evidence summary) but do not automatically require an immediate antibiotic. Do not rely on a back-up prescription if there are signs of mastoiditis, systemic illness, facial palsy or intracranial complication."},
         {step:"Step 4", title:"Immediate antibiotic", when:"systemically very unwell or high risk", fromLabel:"first choice amoxicillin",
          html:"NICE NG91: immediate prescription for the systemically very unwell, those with symptoms or signs of a more serious illness, and those at high risk of complications due to significant comorbidity or immunosuppression. <b>Amoxicillin for 5 to 7 days</b> (dose by age per NICE NG91 and BNFC). Penicillin allergy: <b>clarithromycin</b>, or <b>erythromycin</b> in pregnancy. Second choice for worsening symptoms after at least 2 to 3 days of a first choice: <b>co-amoxiclav</b>. Adults: NG91 does not apply — follow the current local antimicrobial guideline (e.g. GMMMG: amoxicillin 500 mg–1 g three times daily for 5 days, 7 days for more severe or recurrent infection) and formulary."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"What does not help", html:"Decongestants and antihistamines add side effects without a clinically meaningful benefit in acute otitis media (Coleman and Moore, Cochrane 2008). A perforation that discharges during an acute infection usually heals once the infection settles; check that it has.", src:"Coleman and Moore, Cochrane 2008"},
         {tone:"amber", h:"Recurrent acute otitis media", html:"Frequent episodes, persistent perforation or discharge, or concerns about hearing and speech → ENT or audiology. Long-term antibiotic prophylaxis is not a primary care decision.", src:"NICE NG91 · NICE NG233"},
         {tone:"cream", h:"Adults with acute otitis media", html:"AOM is less common in adults, so be more cautious about alternative diagnoses. Examine the pharynx, teeth, temporomandibular joint and mastoid. Consider referred otalgia, otitis externa, dental disease, malignancy and cholesteatoma. Treat and dose per the local antimicrobial guideline (e.g. GMMMG). Persistent or recurrent unilateral symptoms require reassessment and possible ENT referral.", src:"GMMMG antimicrobial guidelines · NICE NG91 (scope: under 18s)"}
       ]},
       {b:"say", html:"This is a middle-ear infection. Most clear up by themselves in about three days, and antibiotics make only a small difference while giving some children tummy upsets and rashes. The most important thing is regular pain relief. If it isn’t starting to get better in three days, or gets much worse at any time, contact us so we can check again — the back-up prescription may then be used. If there’s swelling behind the ear, the ear sticks out, or your child becomes very unwell or drowsy, bring them straight back."}
     ]},

    {id:"oe", nav:"Otitis externa", title:"Acute otitis externa — clean, dry and topical", sub:"No UK national guideline is specific to otitis externa (NICE NG91 covers acute otitis media only). The UKHSA antimicrobial summary, the local antimicrobial guideline (e.g. GMMMG), the Cochrane review and ENT UK guidance give the UK approach; the AAO-HNSF guideline is international.",
     blocks:[
       {b:"table", head:["Step","What","Source"], rows:[
         ["<b>1 — everyone</b>","Analgesia and local heat (for example a warm flannel); remove or prevent the cause — water, cotton buds, hearing-aid moulds, irritant products, dermatitis","UKHSA antimicrobial summary (2025)"],
         ["<b>2 — topical treatment by severity</b>","<b>Mild:</b> analgesia, ear care and <b>topical acetic acid 2%</b> (over-12s) may be adequate. <b>Moderate/severe:</b> a <b>topical antibiotic with or without steroid</b> (for example a neomycin–corticosteroid combination, if the drum is intact) for 7 days is usually more appropriate; acetic acid is an option for moderate infection per GMMMG. Similar cure rates at 7 days; acetic acid is less effective when treatment has to continue beyond a week. <b>Treatment failure:</b> reconsider the diagnosis, drop delivery, fungal infection, contact dermatitis, foreign body or necrotising otitis externa","GMMMG antimicrobial guidelines · UKHSA antimicrobial summary · Cochrane, Kaushik 2010 · doses per local formulary/SPC"],
         ["<b>3 — cannot see the drum?</b>","If the drum cannot be visualised because of oedema or debris, its integrity is unknown. Arrange aural toilet, microsuction or an ear wick (ENT or aural care clinic) so that topical treatment can reach the canal. If a perforation or patent grommet is possible, avoid potentially ototoxic preparations and follow the local ENT/formulary pathway; a quinolone preparation may be preferred where clinically indicated (generally regarded as non-ototoxic, but not universally required or risk-free — follow local policy and product licensing). Do not use irrigation when perforation is suspected","Local ENT/formulary pathway · clinical practice"],
         ["<b>4 — spreading infection</b>","Do not use oral antibiotics for uncomplicated OE. Cellulitis extending beyond the canal or systemic illness → consider oral treatment per the local antimicrobial guideline (e.g. <b>oral flucloxacillin</b>; clarithromycin if allergic). In a patient with diabetes, immunosuppression or frailty, severe or persistent pain should prompt <b>same-day ENT discussion</b> rather than repeated primary-care antibiotic courses","GMMMG antimicrobial guidelines · UKHSA antimicrobial summary (2025)"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"Perforated drum or grommet: care with aminoglycosides", html:"Aminoglycoside drops (neomycin, gentamicin, framycetin) are ototoxic if they reach the middle ear. Avoid aminoglycoside-containing ear drops where the drum is perforated or a grommet is patent unless specifically advised by ENT and the expected benefit outweighs the risk. If used under specialist advice, limit duration and document the rationale. The 2007 ENT UK consensus (obvious infection, no more than 2 weeks, explain to the patient, baseline audiogram where practical) is a specialist-consensus exception, not a general primary-care prescribing rule; product SPCs and local ENT policy may be more restrictive. MHRA: aminoglycosides can cause ototoxicity, with additional risk in people with mitochondrial DNA variants or a maternal history of aminoglycoside-associated deafness. If the drum cannot be seen, its integrity is unknown — see step 3 above.", src:"ENT UK consensus, Phillips et al., Clin Otolaryngol 2007 · MHRA Drug Safety Update (aminoglycosides)"},
         {tone:"blue", h:"Oral antibiotics are rarely needed", html:"The AAO-HNSF guideline (international) advises against systemic antibiotics as initial therapy for uncomplicated diffuse otitis externa unless infection spreads beyond the canal or host factors (such as diabetes or immunosuppression) call for them. The UKHSA antimicrobial summary says the same for UK practice. Where diabetes, immunosuppression or frailty are present, severe or persistent pain should prompt same-day ENT discussion for possible necrotising otitis externa rather than repeated antibiotic courses.", src:"AAO-HNSF 2014 (international) · UKHSA antimicrobial summary (2025)"},
         {tone:"cream", h:"Fungal otitis externa", html:"White, black or fluffy debris and itch, often after antibiotic drops, suggests otomycosis. Clean the canal and use an antifungal ear preparation (dose per BNF); antibiotic-steroid drops can make it worse. Send a swab if it keeps coming back.", src:"BNF · Cochrane, Kaushik 2010"},
         {tone:"green", h:"Keeping it from coming back", html:"Keep the ears dry during treatment and for a while after (cotton wool with petroleum jelly in the shower, no swimming), stop cotton buds, treat underlying eczema or psoriasis, and consider acidifying drops before and after swimming for people who get it repeatedly.", src:"UKHSA antimicrobial summary (2025) · AAO-HNSF 2014 (international)"}
       ]},
       {b:"warn", html:"In a person with diabetes, immunosuppression or frailty, persistent severe or nocturnal pain, granulation tissue, cranial neuropathy or failure to respond to appropriate topical treatment should prompt same-day ENT discussion for possible necrotising otitis externa. Do not prescribe repeated courses of drops without reassessment."}
     ]},

    {id:"ome", nav:"Glue ear", title:"Otitis media with effusion — a hearing problem, not an infection", sub:"NICE NG233 (2023) for children under 12, which replaced CG60. Adults with a new effusion follow NICE NG98. A fuller page: <a href='otitis-media-effusion.html'>Otitis media with effusion</a>.",
     blocks:[
       {b:"kv", rows:[
         ["<b>Children — first 3 months</b>","NICE NG233: <b>active observation for 3 months</b> from onset (or from diagnosis if onset is unknown), with support for hearing at home and school. Suspected OME should enter a formal audiology pathway: assessment should include otoscopy, upper respiratory assessment, hearing testing and tympanometry, with consideration of development and the impact on communication and education. NG233 advises against antibiotics, antihistamines, decongestants, mucolytics, leukotriene receptor antagonists and anti-reflux medicines for glue ear. Do not offer oral or nasal corticosteroids for OME or OME-related hearing loss"],
         ["<b>Autoinflation</b>","NICE NG233: consider autoinflation during the observation period for children likely to manage the technique (a nasal balloon)"],
         ["<b>Persistent with hearing loss</b>","Bilateral OME with hearing loss: reassess hearing after 3 months; unilateral hearing loss: consider reassessment after 3 months; intervene earlier where hearing difficulty significantly affects daily living or communication. OME without hearing loss generally requires no treatment. If hearing loss persists, discuss hearing aids or grommets with the family, using the NG233 decision table of benefits and risks. The audiological threshold for grommets is set by the ENT service"],
         ["<b>Down syndrome or cleft palate</b>","NICE NG233 identifies craniofacial conditions such as Down syndrome and cleft palate as major risk factors: glue ear is more common and more persistent. Children with Down syndrome, cleft palate or other craniofacial anomalies should be referred or managed within the relevant specialist pathway rather than relying solely on routine primary-care observation"],
         ["<b>Adults</b>","Any new, persistent or unexplained unilateral adult middle-ear effusion warrants ENT assessment to exclude nasopharyngeal or other obstructive pathology (clinical practice); not every such effusion meets suspected cancer referral criteria. NICE NG98 specifically: consider a suspected cancer pathway referral for adults of Chinese or south-east Asian family origin with hearing loss and a middle-ear effusion not associated with an upper respiratory tract infection"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Why wait 3 months?", html:"Most effusions after an ear infection clear spontaneously within weeks to months. NG233 uses active observation — formal hearing testing and tympanometry, school informed, speech watched — rather than treatment in that window, because grommets and hearing aids help only when the effusion persists.", src:"NICE NG233 (2023)"},
         {tone:"amber", h:"Refer sooner", html:"In practice, speech and language delay, developmental or educational concerns, another sensory impairment, or a parent who is worried about hearing are reasons for earlier audiology or ENT referral rather than waiting out the full 3 months."}
       ]}
     ]},

    {id:"review", nav:"Review", title:"Follow-up and safety-netting", sub:"What to arrange, and what to tell patients.",
     blocks:[
       {b:"timeline", items:[
         {n:"1", when:"Acute otitis media · 3 days", title:"Is it starting to improve?", html:"If symptoms do not start to improve after 3 days, or worsen significantly at any time, the patient should be reassessed; a back-up prescription may then be used where appropriate. Do not rely on a back-up prescription if there are signs of mastoiditis, systemic illness, facial palsy or intracranial complication → same-day review (NICE NG91). Anaesthetic/analgesic drops: review if no improvement within 7 days or worsening at any time."},
         {n:"2", when:"Otitis externa · 48–72 hours", title:"Is the pain starting to improve?", html:"Pain should usually begin to improve within 48–72 hours, although complete resolution may take up to 2 weeks. If there is no improvement: check drop delivery and canal patency, reconsider the diagnosis, clean the canal, think fungal, check for a foreign body or dermatitis, and think necrotising otitis externa in anyone at risk."},
         {n:"3", when:"Perforation · after the acute episode", title:"Has the drum healed?", html:"Re-examine after the acute infection has settled. Persistent perforation or ongoing otorrhoea after the acute episode requires ENT review; follow the local ENT referral threshold, particularly where discharge persists, hearing loss is present or cholesteatoma is suspected."},
         {n:"4", when:"Glue ear · 3 months", title:"Re-examine and check hearing", html:"Bilateral OME with hearing loss: reassess hearing at 3 months; unilateral: consider reassessment. Persistent effusion with hearing loss → discuss hearing aids or grommets; OME without hearing loss generally needs no treatment (NICE NG233)."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"red", h:"Return the same day if…", html:"Swelling, redness or pain behind the ear; the ear sticking out; severe headache, stiff neck, drowsiness or a fit; weakness of the face; sudden loss of hearing, new dizziness or ringing with hearing loss, or blisters on or in the ear; severe or night-time ear pain with diabetes or a weak immune system; or a child who becomes floppy, pale or very unwell.", src:"NICE NG91 · NICE NG143"},
         {tone:"green", h:"Practical ear care", html:"Keep water out of an ear with otitis externa or a perforation; no cotton buds; finish the full drop course; lie with the ear up for a few minutes after drops so they reach the canal skin.", src:"UKHSA antimicrobial summary (2025)"},
         {tone:"amber", h:"Prescribing safety", html:"Penicillin allergy: distinguish immediate/severe allergy from intolerance. Macrolides: QT prolongation and interaction risk; clarithromycin interacts with statins, anticoagulants and antiarrhythmics; erythromycin in pregnancy when a macrolide is required. Adjust for renal/hepatic impairment where relevant. Aminoglycoside drops: ototoxicity. Systemic fluoroquinolones: only when other commonly recommended antibiotics are inappropriate (MHRA), with serious adverse effects. Check pregnancy and breastfeeding, infants under 1 month, grommets, previous ear surgery and drum perforation. Doses, contraindications and cautions per the current local formulary/BNF/BNFC.", src:"MHRA Drug Safety Updates · GMMMG antimicrobial guidelines · BNF and BNFC"}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — urgency and destination", sub:"There is no NICE NG12 criterion for these presentations; the suspected-cancer route for the ear comes from NICE NG98.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"Same day / admit", html:"Mastoiditis; meningitis, intracranial abscess, sinus thrombosis or facial nerve palsy; a severe systemic infection (NICE NG91). Emergency admission/A&amp;E for sepsis, cranial nerve palsy, neurological signs, severe systemic illness or suspected intracranial spread. Same-day ENT discussion for suspected necrotising otitis externa without instability. Immediate/urgent ENT discussion for sudden sensorineural hearing loss, Ramsay Hunt syndrome with facial weakness, or severe infection in a cochlear-implant patient. A febrile child with NG143 red features.", src:"NICE NG91 · NICE NG143 · ENT UK NOE guidance (2020) · BSO/ENT UK hearing loss recommendations (2023)"},
         {tone:"amber", h:"Urgent ENT", html:"Otitis externa with a canal too swollen for drops or debris that cannot be cleared (microsuction or wick). Cellulitis beyond the canal once oral antibiotics are started (UKHSA antimicrobial summary). Suspected cholesteatoma with facial weakness, vertigo, severe pain, neurological features or rapidly progressive hearing loss. Persistent unilateral otalgia with dysphagia, hoarseness, weight loss or smoking history (urgent head and neck assessment). NICE NG98: consider a suspected cancer pathway referral for an adult of Chinese or south-east Asian family origin with hearing loss and a middle-ear effusion not associated with a cold.", src:"UKHSA antimicrobial summary (2025) · NICE NG98 (2018)"},
         {tone:"cream", h:"Routine ENT or audiology", html:"Suspected cholesteatoma or chronic discharge (do not irrigate); persistent perforation or ongoing otorrhoea after the acute episode (local ENT threshold); persistent or recurrent unilateral symptoms in adults; recurrent acute otitis media; glue ear persisting beyond 3 months with hearing loss (NICE NG233); recurrent or chronic otitis externa.", src:"NICE NG233 (2023) · ENT UK 2007"},
         {tone:"blue", h:"Related pages", html:"<a href='otitis-media-effusion.html'>Otitis media with effusion</a> for glue ear in detail; the <a href='../../cases/hearing-loss.html'>hearing loss casebook chapter</a> for adults with a new hearing problem.", src:"NICE NG233 · NICE NG98"}
       ]},
       {b:"say", html:"Your ear canal skin is inflamed — it’s a bit like eczema with an infection on top. The drops do the work, but only if they can reach the skin, so keep the ear dry and don’t put anything in it. If the pain gets much worse, especially at night, or the pain isn’t starting to ease in 2 to 3 days, come back — with your diabetes we need to make sure it isn’t spreading deeper."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 72-year-old man with type 2 diabetes (HbA1c 78 mmol/mol) has had a painful, discharging right ear for 5 weeks. He has used two courses of antibiotic-steroid drops from the pharmacy and a walk-in centre. The pain now keeps him awake. He asks for “stronger drops”.", src:"Hodgson et al., BMJ Open 2023 · UKHSA antimicrobial summary (2025)"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Recognises that <b>pain out of proportion, night pain and failed topical treatment in a diabetic</b> point to <b>necrotising otitis externa</b>; examines the canal for granulation tissue and checks <b>cranial nerves, especially VII</b>; does not issue a third course of drops; arranges <b>same-day ENT</b> assessment; explains why in plain language without alarming; addresses glycaemic control; and safety-nets for facial weakness, headache or feeling unwell.", src:"Hodgson et al., BMJ Open 2023 · AAO-HNSF 2014 (international)"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named primary source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG91 — Otitis media (acute): antimicrobial prescribing</b> (March 2018, updated March 2022)<br><a href="https://www.nice.org.uk/guidance/ng91" rel="noopener">nice.org.uk/guidance/ng91</a><span class="rd"> — children and young people under 18 only (adult AOM not covered); course about 3 days; review drops if no improvement within 7 days or worsening; up to 1 week; paracetamol or ibuprofen; phenazone 40 mg/g with lidocaine 10 mg/g ear drops, 4 drops two or three times a day for up to 7 days (no immediate antibiotic, no perforation or otorrhoea); no, back-up or immediate antibiotic; back-up used if no improvement within 3 days; immediate for systemically very unwell, more serious illness or high risk; consider for otorrhoea or under 2 with bilateral infection; amoxicillin 5–7 days, clarithromycin or erythromycin (pregnancy) if allergic, co-amoxiclav second choice; referral to hospital for severe systemic infection or complications</span></li>'+
         '<li><b>NICE NG233 — Otitis media with effusion in under 12s</b> (August 2023; replaced CG60)<br><a href="https://www.nice.org.uk/guidance/ng233" rel="noopener">nice.org.uk/guidance/ng233</a><span class="rd"> — 3 months of active observation; autoinflation; hearing aids or grommets; do not offer antibiotics, antihistamines, decongestants, mucolytics, leukotriene receptor antagonists or anti-reflux medicines; do not offer oral or nasal corticosteroids; formal assessment with otoscopy, hearing testing and tympanometry; reassess hearing at 3 months (bilateral), consider (unilateral); Down syndrome, cleft palate and other craniofacial anomalies in specialist pathways</span></li>'+
         '<li><b>NICE NG98 — Hearing loss in adults: assessment and management</b> (2018)<br><a href="https://www.nice.org.uk/guidance/ng98" rel="noopener">nice.org.uk/guidance/ng98</a><span class="rd"> — consider suspected cancer pathway referral for adults of Chinese or south-east Asian family origin with hearing loss and a middle-ear effusion not associated with an upper respiratory tract infection</span></li>'+
         '<li><b>NICE NG143 — Fever in under 5s: assessment and initial management</b> (2019)<br><a href="https://www.nice.org.uk/guidance/ng143" rel="noopener">nice.org.uk/guidance/ng143</a><span class="rd"> — traffic-light assessment of the febrile young child</span></li>'+
         '<li><b>Greater Manchester Medicines Management Group (GMMMG) — Greater Manchester antimicrobial guidelines</b> (current version; operational prescribing reference for Bolton practices)<br><a href="https://gmmmg.nhs.uk/" rel="noopener">gmmmg.nhs.uk</a><span class="rd"> — adult AOM amoxicillin 500 mg–1 g three times daily for 5 days (7 days if more severe or recurrent); acetic acid 2% for moderate otitis externa with topical antibiotic/steroid alternatives; flucloxacillin for infection extending beyond the canal or systemic infection. Local operational arrangements take precedence</span></li>'+
         '<li><b>UKHSA — Summary of antimicrobial prescribing guidance: managing common infections</b> (2025; check the current update date before use)<br><a href="https://www.gov.uk/government/publications/managing-common-infections-guidance-for-primary-care" rel="noopener">gov.uk — managing common infections</a><span class="rd"> — acute otitis externa: analgesia and local heat; topical acetic acid or topical antibiotic with or without steroid, similar cure at 7 days; oral flucloxacillin and referral to exclude necrotising otitis externa if cellulitis extends beyond the canal or systemic signs</span></li>'+
         '<li><b>ENT UK — Evidence review and ENT-UK consensus report for the use of aminoglycoside-containing ear drops in the presence of an open middle ear</b> (Phillips JS, et al., Clin Otolaryngol 2007;32:330–336)<br><a href="https://pubmed.ncbi.nlm.nih.gov/?term=Phillips+2007+aminoglycoside+ear+drops+open+middle+ear+consensus" rel="noopener">PubMed</a><span class="rd"> — specialist-consensus exception (historical): only with obvious infection, no longer than 2 weeks, explain to the patient, baseline audiometry where practical. Product SPCs and local ENT policy may be more restrictive</span></li>'+
         '<li><b>MHRA Drug Safety Update — Aminoglycosides: increased risk of deafness in patients with mitochondrial DNA variants</b><br><a href="https://www.gov.uk/drug-safety-update" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> — ototoxicity; additional risk with mitochondrial DNA variants or a maternal history of aminoglycoside-associated deafness</span></li>'+
         '<li><b>MHRA Drug Safety Update — Fluoroquinolone antibiotics: must now only be prescribed when other commonly recommended antibiotics are inappropriate</b> (January 2024)<br><a href="https://www.gov.uk/drug-safety-update" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> — systemic fluoroquinolones restricted because of disabling and potentially long-lasting or irreversible adverse effects</span></li>'+
         '<li><b>ENT UK — Necrotising otitis externa</b> (31 May 2020)<br><a href="https://www.entuk.org/" rel="noopener">entuk.org</a><span class="rd"> — swabbing, canal clearance, assessment of risk factors, urgent imaging and specialist management where concern is present</span></li>'+
         '<li><b>British Society of Otology / ENT UK — Recommendations for community management of hearing loss and aural blockage</b> (6 April 2023)<br><a href="https://www.entuk.org/" rel="noopener">entuk.org</a><span class="rd"> — sudden or rapidly progressive hearing loss requires urgent specialist referral</span></li>'+
         '<li><b>Hodgson SH, et al. UK consensus definitions for necrotising otitis externa: a Delphi study.</b> BMJ Open 2023;13:e061349<br><a href="https://doi.org/10.1136/bmjopen-2022-061349" rel="noopener">doi.org/10.1136/bmjopen-2022-061349</a><span class="rd"> — UK case definitions and consensus statements for necrotising otitis externa (a consensus-definition study, not a NICE treatment guideline)</span></li>'+
         '<li><b>Kaushik V, Malik T, Saeed SR. Interventions for acute otitis externa.</b> Cochrane Database Syst Rev 2010;(1):CD004740<br><a href="https://doi.org/10.1002/14651858.CD004740.pub2" rel="noopener">doi.org/10.1002/14651858.CD004740.pub2</a><span class="rd"> — comparative topical efficacy (does not imply all otitis externa needs antimicrobial treatment); topical treatments effective; acetic acid comparable at 1 week but less effective when treatment extends beyond a week</span></li>'+
         '<li><b>Coleman C, Moore M. Decongestants and antihistamines for acute otitis media in children.</b> Cochrane Database Syst Rev 2008;(3):CD001727<br><a href="https://pubmed.ncbi.nlm.nih.gov/?term=CD001727+decongestants+antihistamines+acute+otitis+media" rel="noopener">PubMed</a><span class="rd"> — no clinically meaningful benefit, more adverse effects</span></li>'+
         '<li><b>International — AAO-HNSF Clinical practice guideline: acute otitis externa</b> (Rosenfeld RM, et al., Otolaryngol Head Neck Surg 2014;150(1 Suppl):S1–S24)<span class="rd"> — used only where no UK guideline covers the point: topical rather than systemic therapy for uncomplicated disease; systemic therapy only for spread beyond the canal or host factors</span></li>'+
         '<li><b>BNF and BNFC</b> — amoxicillin, clarithromycin, erythromycin, co-amoxiclav, flucloxacillin, ear preparations, paracetamol, ibuprofen<br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a> · <a href="https://bnfc.nice.org.uk" rel="noopener">bnfc.nice.org.uk</a></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"The painful ear in primary care — NICE NG91 (2018, updated 2022), NG233 (2023), NG98 (2018) and NG143 (2019), the UKHSA Summary of antimicrobial prescribing guidance (2025), ENT UK (2007), Hodgson et al. (BMJ Open 2023), Cochrane (Kaushik 2010) and, where no UK guidance exists, the international AAO-HNSF guideline (2014). This is a clinical decision aid with prescribing references, not a fully standalone prescribing guide: check doses, contraindications, renal/hepatic adjustments, pregnancy and breastfeeding information in the current local formulary (e.g. GMMMG), BNF or BNFC before prescribing. Not a substitute for clinical judgement."
