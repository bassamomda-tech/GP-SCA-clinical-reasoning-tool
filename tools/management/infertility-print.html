  stemSub:"This page is the whole of infertility in one place — the diagnostic reasoning and the management. It is what primary care actually does: decide whether to investigate now or at a year, complete the investigation set for <b>both</b> partners in parallel, get the semen analysis right (including how and when to repeat it), deliver preconception care that measurably improves outcomes, understand the funding criteria that make referral timing consequential rather than administrative, and hold a consultation in which two people are hearing the same words differently.",

  lead:'<div class="mg-layers"><a href="#when"><b>When to act</b><small>Before 1 year?</small></a><a href="#investigate"><b>Investigate</b><small>Both partners</small></a><a href="#semen"><b>Semen analysis</b><small>And repeating it</small></a><a href="#preconception"><b>Preconception</b><small>What changes outcomes</small></a><a href="#refer"><b>Refer</b><small>Funding criteria</small></a></div>',
  quickSub:"The six that change outcomes. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"blue", h:"The rule, and the number that makes it reassuring", html:"Investigate after 1 year of regular unprotected intercourse (every 2–3 days) without conception. <b>About 84% of couples conceive within a year and roughly 92% within two</b>, so most people presenting at nine months need information rather than investigation. Say the figure — it is the most effective reassurance available, and it is true."},
    {tone:"amber", h:"Investigate EARLIER than a year if any of these", html:"Woman aged 36 or over · known cause of infertility in either partner · a history predicting a problem — amenorrhoea or oligomenorrhoea, PID or pelvic surgery, endometriosis, undescended testes, previous chemotherapy or radiotherapy, mumps orchitis, testicular surgery or trauma, or erectile or ejaculatory dysfunction. Age is the dominant variable and it is not recoverable — waiting out the year in a 38-year-old is a real harm, not a cautious approach."},
    {tone:"red", h:"⚠ Investigate BOTH partners, in parallel, from the start", html:"A male factor contributes in roughly half of cases, and in a substantial minority it is the sole cause. Arranging a day-21 progesterone while the semen analysis waits for \"the next step\" wastes months and is the commonest structural error in this pathway. Book both at the first appointment — and invite both partners to attend."},
    {tone:"blue", h:"Semen analysis: repeat it properly before believing it", html:"Abstinence of 2–7 days, sample to the laboratory within 1 hour, kept close to body temperature. If the first result is abnormal, repeat it — ideally after 3 months, to allow one full spermatogenesis cycle — but repeat as soon as possible if the result was grossly abnormal (azoospermia or severe oligozoospermia). A single abnormal result is not a diagnosis: transient illness, fever and collection error all produce one."},
    {tone:"green", h:"Preconception care is the part that genuinely works", html:"Folic acid 400 µg daily (5 mg if BMI 30 or over, diabetes, epilepsy on certain drugs, coeliac disease, sickle cell or thalassaemia, or a previous neural tube defect) · smoking cessation for both partners · alcohol within limits and none in pregnancy · BMI toward 20–25 · rubella immunity checked · cervical screening up to date · medication review · vitamin D. A BMI of 30 or over reduces fertility and is a funding criterion in most areas — raising weight early is practical help, not judgement."},
    {tone:"purple", h:"🟣 Statutory and safeguarding considerations", html:"Where infertility presents alongside sexual dysfunction, non-consensual sex, coercion or reproductive control, the safeguarding duty takes precedence over the fertility workup — ask, separately and in private. Female genital mutilation identified in a patient under 18 carries a mandatory reporting duty to the police; in an adult it requires risk assessment for her and any daughters. Treat the person in front of you separately from the couple, and always offer a single-partner appointment."}
  ],
  pathwaySub:"Five steps, and the first is a decision about timing that sets everything else.",
  pathway:[
    {title:"Decide: investigate now, or reassure and review?", html:"Under 36 with a normal history and under a year of trying → information, preconception care and a review date. 36 or over, or any predictive feature, or a year elapsed → investigate now, both partners.", alert:true},
    {title:"Take a history from both, including the part people do not volunteer", html:"Cycle regularity and length · previous pregnancies for each of them, with any partner · coital frequency and timing, and any pain or difficulty · PID, STIs, endometriosis, pelvic or testicular surgery · chemotherapy or radiotherapy · drugs including anabolic steroids and testosterone · occupational heat and toxins · smoking, alcohol, recreational drugs and BMI."},
    {title:"Investigate in parallel", html:"Her: day-21 (mid-luteal) progesterone, chlamydia screen, rubella immunity; FSH/LH and other tests only where the cycle is irregular; AMH where relevant. <b>Him: semen analysis.</b> <b>Both booked at the same visit — not sequentially.</b>"},
    {title:"Give preconception care and correct what is correctable", html:"Folic acid at the right dose · smoking cessation · weight · alcohol · medication review · timing advice (every 2–3 days, not ovulation-hunting). These are the interventions primary care owns, and several are also funding prerequisites."},
    {title:"Refer with the results complete, and with the funding clock in mind", html:"Refer once both partners' baseline results are available — or immediately without waiting where age or a known cause makes delay harmful. <b>Check the local ICB criteria before promising anything.</b>"}
  ],
  sections:[

    {id:"when", nav:"When to act", title:"When to investigate — and when to reassure",
     blocks:[
       {b:"table", head:["Situation","Action","Why"], rows:[
         ["<b>Trying under 1 year, woman under 36, no predictive history</b>","<b>Information, preconception care, timing advice and a review date</b>","<b>About 84% conceive within a year.</b> Premature investigation medicalises a normal process and creates anxiety that itself affects the relationship"],
         ["<b>1 year of regular unprotected intercourse without conception</b>","<b>Investigate both partners</b>","The NICE NG257 threshold"],
         ["<b>Woman aged 36 or over</b>","<b>Investigate now — do not wait out the year</b>","Ovarian reserve and oocyte quality decline steeply and irreversibly; both spontaneous conception and treatment success fall with each year. Most funding criteria also have an upper age limit, so delay can remove the option entirely"],
         ["<b>Amenorrhoea, oligomenorrhoea or irregular cycles</b>","<b>Investigate now</b> — cycle assessment, and see <a href='pcos.html'>PCOS</a> or <a href='hyperprolactinaemia.html'>hyperprolactinaemia</a>","<b>Anovulation is the most treatable cause of infertility</b>, and irregular cycles point straight to it"],
         ["Previous PID, chlamydia, ectopic pregnancy, pelvic surgery or known endometriosis","<b>Investigate now</b>","Tubal factor is likely and needs imaging that primary care cannot arrange"],
         ["Undescended testes, testicular surgery or trauma, mumps orchitis, previous chemotherapy or radiotherapy","<b>Semen analysis now</b>","Predictable spermatogenic failure; earlier knowledge changes the options, including surgical sperm retrieval"],
         ["Erectile dysfunction, ejaculatory failure, or intercourse that is not happening","<b>Address this first — it is the cause until proven otherwise</b>","Frequently not volunteered and easily missed if the conversation stays on tests. Ask directly and separately. See <a href='erectile-dysfunction.html'>erectile dysfunction</a>"],
         ["Same-sex couples, single people, and those needing donor gametes or surrogacy","Refer per local pathway; the investigation set is unchanged where relevant","Funding criteria differ markedly by ICB and often require a documented number of self-funded IUI cycles first — check before advising"]
       ]},
       {b:"say", html:"Before we start any tests, one number is worth knowing, because it changes how worried to be. Of couples trying for a baby, about eighty-four in a hundred conceive within a year, and around ninety-two within two years — so at nine months, most of what I would be doing is looking for a problem that usually isn't there. That said, there are good reasons not to wait in some situations, and I want to check whether any apply to you. The two that matter most are age and anything in either of your histories that points to a specific cause. If neither applies, my advice is to keep trying, do the things that genuinely help, and come back at a year — or sooner if anything changes or you would rather not wait."}
     ]},

    {id:"investigate", nav:"Investigate", title:"The primary-care investigation set — both partners, same visit",
     blocks:[
       {b:"table", head:["Test","Who and when","Interpretation"], rows:[
         ["<b>Semen analysis</b>","<b>Him, at the first appointment</b>","The single most important test in primary care, and the one most often delayed. See <a href='#semen'>Semen analysis</a> for technique, thresholds and repeat timing"],
         ["<b>Mid-luteal (day-21) progesterone</b>","Her — 7 days BEFORE the expected period, not literally day 21 unless the cycle is 28 days","<b>Confirms ovulation.</b> In a 35-day cycle the correct day is 28; timing it wrongly is the usual reason for a spuriously low result. Low or equivocal → repeat with correct timing before concluding anovulation"],
         ["<b>Chlamydia screen</b>","<b>Both, before any uterine instrumentation</b>","Asymptomatic chlamydia is a tubal-factor cause and a contraindication to instrumentation until treated"],
         ["<b>Rubella immunity</b>","<b>Her</b>","If non-immune, offer MMR and advise avoiding pregnancy for 1 month afterwards — worth doing early rather than discovering it at the fertility clinic"],
         ["<b>FSH, LH and oestradiol (early follicular, days 2–5)</b>","<b>Her, where cycles are irregular or ovarian reserve is in question</b>","<b>Not needed in a woman with regular cycles.</b> Raised FSH suggests reduced ovarian reserve; low FSH and LH suggest hypogonadotrophic hypogonadism"],
         ["<b>Anti-Müllerian hormone (AMH)</b>","Her — a marker of ovarian reserve, cycle-independent; availability in primary care varies locally","AMH predicts the response to ovarian stimulation, NOT the chance of natural conception — and a low result in a young woman with regular cycles must not be presented as an inability to conceive. It is a counselling test, easily and harmfully misread"],
         ["<b>TFTs and prolactin</b>","<b>Her, where there is menstrual disturbance, galactorrhoea or symptoms</b>","<b>Not a routine screen in the euthyroid, regularly-cycling woman.</b> Treat hypothyroidism before conception"],
         ["HbA1c, BMI, blood pressure, cervical screening status, vitamin D 10 µg (400 IU) daily","<b>Both / her as applicable</b>","Opportunistic and genuinely useful: several are funding prerequisites as well as being good preconception care"],
         ["<b>What NOT to do in primary care</b>","Do not arrange tubal patency testing (HSG, HyCoSy, laparoscopy) or post-coital testing","Tubal assessment is secondary care. Post-coital testing has no predictive value and is explicitly not recommended"]
       ]},
       {b:"why", html:"The reason both partners must be investigated in parallel is arithmetic rather than etiquette. Male factor contributes in around half of couples, so investigating the woman first leaves a coin-flip chance that months of testing will not touch the cause. And because a semen analysis frequently needs repeating after three months to allow a full spermatogenesis cycle, a delayed first sample does not cost weeks — it costs a season. Practically: invite both partners to the first appointment, hand over the semen-analysis form at that visit, and book her bloods around her cycle rather than around the appointment."}
     ]},

    {id:"semen", nav:"Semen analysis", title:"Semen analysis — technique, thresholds and when to repeat",
     blocks:[
       {b:"dl", rows:[
         ["<b>Collection</b>","Abstinence of 2–7 days · produced by masturbation into a laboratory-supplied sterile container · no lubricant or condom (both are spermicidal) · complete sample including the first fraction, which carries most of the sperm · to the laboratory within 1 hour, kept near body temperature (an inside pocket, not a car dashboard)"],
         ["<b>Reference values (WHO, lower reference limits)</b>","Volume ≥1.4–1.5 mL · concentration ≥15 million/mL · total count ≥39 million · total motility ≥40% (progressive ≥30–32%) · normal morphology ≥4% · vitality ≥54%. These are reference limits from fertile populations, not a pass mark — men below them do conceive, and men above them present with infertility"],
         ["<b>When to repeat</b>","Abnormal result → repeat, ideally after 3 months to allow one complete spermatogenesis cycle. Grossly abnormal (azoospermia or severe oligozoospermia) → repeat as soon as possible (NICE NG257), and refer without waiting for the pattern to be confirmed"],
         ["<b>Before calling a result abnormal, exclude the artefacts</b>","Incomplete collection · a spilled first fraction · lubricant or condom use · delay or cold in transit · a febrile illness or infection in the preceding 2–3 months (which affects the sperm produced then, not now) · very short or very long abstinence"]
       ]},
       {b:"table", head:["Result","Meaning","Action"], rows:[
         ["<b>Normal</b>","Male factor unlikely","Continue with the couple's assessment"],
         ["<b>Mild to moderate abnormality</b>","<b>Common, often transient, and frequently compatible with conception</b>","<b>Repeat at 3 months.</b> Address reversible factors: smoking, alcohol, recreational drugs, anabolic steroids and exogenous testosterone (a genuinely common and reversible cause that men do not disclose unless asked directly), obesity, occupational heat, and certain drugs (sulfasalazine, cimetidine, spironolactone, nitrofurantoin, chemotherapy)"],
         ["<b>Severe oligozoospermia or azoospermia</b>","Obstructive or non-obstructive spermatogenic failure; may indicate Klinefelter syndrome, Y-chromosome microdeletion, CF-associated vas deferens absence, or hypogonadotrophic hypogonadism","<b>Repeat as soon as possible AND refer to a fertility service or urology now.</b> Examine for testicular volume, varicocele and vas deferens; check FSH, LH and testosterone; karyotype and genetic testing are specialist-arranged. <b>Do not wait for the repeat before referring</b>"],
         ["<b>Normal count with very poor motility or morphology</b>","May still substantially reduce natural conception","Repeat at 3 months; refer if persistent"],
         ["<b>Retrograde ejaculation or no ejaculate</b>","<b>Diabetes, spinal injury, bladder-neck surgery, alpha-blockers</b>","Post-ejaculatory urine microscopy; refer to urology"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"red", h:"⛔ Testosterone is a contraceptive, not a fertility treatment", html:"Exogenous testosterone — prescribed, bought online, or taken as part of anabolic steroid use — suppresses the HPG axis and can cause azoospermia. <b>Never prescribe testosterone to a man trying to conceive.</b> Ask about gym supplements and steroid use explicitly and without judgement; recovery after stopping takes months and is not always complete."},
         {tone:"amber", h:"⚠ Do not let the semen result end the conversation", html:"An abnormal result lands hard, and men are frequently given it by letter or in a sentence. Deliver it in person where possible, with the repeat already arranged and the reversible factors named — and make clear that mild abnormalities are common and often transient."},
         {tone:"blue", h:"🔬 Which tests are NOT useful", html:"Antisperm antibody testing and post-coital testing are not recommended. NICE NG257 advises against testing sperm DNA integrity (fragmentation). <b>Do not order what will not change the plan.</b>"},
         {tone:"green", h:"✓ What genuinely helps sperm quality", html:"Stop smoking and recreational drugs · alcohol within limits · lose weight if obese · stop anabolic steroids and exogenous testosterone · avoid prolonged scrotal heat (hot baths, saunas, laptops on the lap, long-haul driving) · review culprit medications. Loose underwear is often mentioned; the evidence is weak but the advice is harmless."}
       ]}
     ]},

    {id:"preconception", nav:"Preconception", title:"Preconception care, timing advice, and the couple in the room",
     blocks:[
       {b:"table", head:["Element","What to do","Detail"], rows:[
         ["<b>Folic acid</b>","<b>400 µg daily from before conception until 12 weeks.</b> 5 mg daily if BMI 30 or over, diabetes, coeliac disease, sickle cell or thalassaemia, on certain antiepileptics, or a previous neural tube defect","One of the few interventions with an unambiguous, large effect — start it at the first appointment, not at the referral. The MRC Vitamin Study (1991) showed a 72% reduction in neural tube defect recurrence with 4 mg daily in high-risk women, which is why the high-dose arm exists at all"],
         ["<b>Previous or current pelvic inflammatory disease</b>","Treat PID aggressively — doxycycline 100 mg BD plus metronidazole 400 mg TDS for 14 days (BASHH), with partner notification","Acute or chronic PID causes tubal damage, and tubal factor is a leading cause of female infertility. A low threshold for treating suspected PID in a woman trying to conceive is itself a fertility intervention"],
         ["<b>Caffeine</b>","Reduce high intake — above 300 mg a day (roughly 2–3 mugs of coffee) is associated with reduced fertility and increased miscarriage risk","Worth a specific number rather than “cut down”; patients routinely underestimate mug sizes and forget tea, cola and energy drinks"],
         ["<b>Coital timing</b>","<b>Intercourse every 2–3 days throughout the cycle</b>","This is deliberately simpler than ovulation tracking, and better: timed-intercourse regimens and ovulation kits increase stress without improving conception rates. Saying so relieves a burden most couples have taken on"],
         ["<b>Smoking</b>","Cessation for BOTH partners — it reduces fertility in each and is a funding criterion in many areas","Offer varenicline or NRT plus behavioural support. <b>Passive smoking also matters</b>"],
         ["<b>Alcohol and recreational drugs</b>","Her: no alcohol is the safest option when trying to conceive. Him: within recommended limits — excess impairs semen quality. Stop recreational drugs and anabolic steroids","Cannabis and cocaine both impair fertility; anabolic steroids can cause azoospermia"],
         ["<b>Weight</b>","BMI 30 or over reduces fertility and treatment success; BMI under 19 with irregular cycles may impair ovulation. Aim toward 20–25","Frame it as the most powerful modifiable factor she owns, and note that it is a funding prerequisite in most ICBs — that is practical information, not pressure"],
         ["<b>Medication and vaccination review</b>","Review teratogens and fertility-impairing drugs; check rubella immunity; ensure cervical screening is up to date; vitamin D supplementation","Do this now: it takes months to switch an antiepileptic or complete an MMR course safely"],
         ["<b>Chronic conditions</b>","Optimise diabetes (HbA1c pre-pregnancy), thyroid disease, epilepsy, hypertension, inflammatory arthritis and IBD BEFORE conception, with the relevant specialist","See <a href='thyroid-pregnancy.html'>thyroid disease in pregnancy</a> and <a href='epilepsy.html'>epilepsy</a>. Several drugs (ACE inhibitors, methotrexate, sodium valproate, isotretinoin) require a planned switch"],
         ["<b>The consultation itself</b>","Invite both partners. Then offer each a private appointment as a matter of routine","Two people in the room are often at different stages, and some information — a previous pregnancy or termination, an STI, a doubt about the relationship, coercion, or sexual difficulty — will only ever be said alone. Make the single appointment normal rather than exceptional"]
       ]},
       {b:"cards", items:[
         {tone:"green", h:"💬 Name the emotional weight", html:"Infertility carries grief, shame, blame and isolation, and it strains relationships — say so rather than leaving it in the room unspoken. Signpost <b>Fertility Network UK</b>, and offer counselling: it is a NICE recommendation, not a soft extra."},
         {tone:"amber", h:"⚠ Beware the unequal narrative", html:"The investigation set can imply that the problem is hers, because her tests outnumber his. Say explicitly at the outset that this is a couple's assessment and that male factor accounts for around half — it prevents blame settling on one person while the workup proceeds."},
         {tone:"blue", h:"📋 What to have ready for the referral", html:"Duration of trying · both ages · cycle history · previous pregnancies for each · relevant surgical and infection history · smoking, alcohol and BMI for both · semen analysis (with repeat if done) · day-21 progesterone · chlamydia and rubella status · any known condition and its drugs. An incomplete referral is the usual reason a first clinic appointment achieves nothing."},
         {tone:"green", h:"✓ Say what the odds actually are", html:"Give real figures rather than optimism or gloom: roughly 84% conceive within a year and 92% within two; and for those needing treatment, HFEA publishes clinic-level success rates by age. <b>Accurate numbers are more supportive than encouragement.</b>"}
       ]}
     ]},

    {id:"treatment", nav:"Treatment", title:"What happens in secondary care — and what a GP needs to be able to explain",
     sub:"A GP does not initiate any of this, but is asked about all of it.",
     blocks:[
       {b:"table", head:["Treatment","What it is and who it is for","What the GP needs to know"], rows:[
         ["<b>Letrozole — ovulation induction in PCOS</b>","An aromatase inhibitor, now preferred first-line for ovulation induction in PCOS by many UK fertility clinics. Specialist-initiated in most centres","Higher live birth rate and lower multiple-pregnancy rate than clomifene (Legro et al, NEJM 2014). <b>Off-label for this indication in the UK</b> — it is licensed as a breast cancer treatment, which alarms patients who read the leaflet, so say it first"],
         ["<b>Clomifene citrate</b>","The traditional ovulation-induction agent; still widely used — typically clomifene 50 mg OD on days 2–6 of the cycle (BNF; NICE NG257 no longer covers ovulation induction in PCOS — a separate NICE PCOS guideline is in development)","Requires ovarian and cycle monitoring — it is not a drug to initiate or repeat in primary care. Risks: multiple pregnancy, and ovarian hyperstimulation"],
         ["<b>Antioxidant supplements for male factor</b>","Vitamin E 400 IU, vitamin C 1 g, coenzyme Q10 200 mg, selenium 200 µg and zinc 25 mg have modest evidence for improving semen parameters","<b>Modest and not a substitute for andrology assessment</b> — but it is the question men actually ask, and having a specific answer is better than a shrug. Stopping smoking, reducing alcohol and avoiding scrotal heat matter more"],
         ["<b>Metformin in PCOS</b>","Metformin 500 mg TDS, or 1500 mg OD modified-release, where there is insulin resistance (BMI over 30 with irregular periods and raised fasting insulin)","<b>As a sole ovulation-induction agent the effect is modest.</b> Its useful property is that <b>it reduces OHSS risk with gonadotrophin stimulation</b> (Cochrane). Often the one drug on this list a GP does continue"],
         ["<b>Gonadotrophin therapy</b>","Injectable stimulation where oral agents fail, and pulsatile GnRH or gonadotrophin therapy in hypogonadotrophic hypogonadism","<b>Entirely specialist. Carries the highest OHSS risk</b> — see the red-flag card below"],
         ["<b>IVF</b>","<b>Indications: tubal factor, unexplained infertility, mild male factor</b>","Cumulative live birth rate per cycle: 32% under 35 · 23% at 35–37 · 15% at 38–39 · 9% at 40–42 · 3% at 43–44. <b>These figures are the honest basis for urgency in an older woman</b> — quoting them is kinder than implying time is unlimited"],
         ["<b>ICSI</b>","<b>A single sperm injected directly into each egg.</b> Indications: severe oligospermia (count under 5 million/ml), poor motility, failed fertilisation on a previous IVF cycle, obstructive azoospermia with surgically retrieved sperm (PESA/TESA), and non-obstructive azoospermia with testicular sperm extraction","The existence of ICSI is why a very low count is not the end of the conversation — a man told his count is \"almost zero\" often assumes it is hopeless"],
         ["<b>Ovarian reserve testing</b>","<b>AMH, and antral follicle count on pelvic ultrasound</b>","AMH under 5 pmol/L indicates poor ovarian reserve and urgency for referral; AMH over 50 pmol/L suggests a PCOS phenotype and OHSS risk with IVF. AMH predicts response to stimulation, not the chance of natural conception — the most misread result in this pathway"],
         ["<b>Pelvic ultrasound</b>","For all women: antral follicle count, fibroids, ovarian cysts and endometrioma","Arrange in primary care where locally permitted; <b>chlamydia NAAT before any uterine instrumentation</b>"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"red", h:"⚠ OHSS — the emergency a GP may see first", html:"Ovarian hyperstimulation syndrome presents after stimulation with abdominal distension and pain, nausea and vomiting, reduced urine output, and breathlessness. Severe OHSS is life-threatening — ascites, pleural effusion, haemoconcentration and VTE. Any woman recently through stimulation who presents unwell needs same-day discussion with her fertility unit, not a routine appointment. Highest risk with gonadotrophins and in the PCOS phenotype."},
         {tone:"amber", h:"🧬 CBAVD and cystic fibrosis", html:"Congenital bilateral absence of the vas deferens is found in over 95% of men with cystic fibrosis, and bilateral absence on examination mandates CF carrier testing for BOTH partners. CBAVD plus a CFTR mutation in the partner means a 25–50% risk of CF in offspring → genetic counselling. This is why the vas is palpated rather than assumed."},
         {tone:"blue", h:"🔬 Other specialist investigations", html:"HyCoSy or HSG for tubal patency (specialist-arranged) · karyotype and FMR1 in premature ovarian insufficiency · karyotype, FSH and testicular biopsy to distinguish obstructive from non-obstructive azoospermia. Sperm DNA integrity (fragmentation) testing is <b>not</b> recommended by NICE NG257."},
         {tone:"green", h:"🩺 Endocrine and urological routes", html:"Hyperprolactinaemia (prolactin over 1000 mIU/L on two fasting morning samples → MRI pituitary) · premature ovarian insufficiency (karyotype, FMR1, HRT initiation) · hypogonadotrophic hypogonadism. Varicocele detected on clinical examination WITH reduced semen parameters in a man trying to conceive → NICE NG257 (2026) advises considering radiological (embolisation) or surgical treatment, taking female fertility factors into account (this reverses CG156). A varicocele with normal semen parameters is not an indication; see <a href='varicocele.html'>varicocele</a>."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral and funding",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"Refer WITHOUT waiting for results", html:"Woman aged 36 or over · azoospermia or severe oligozoospermia · known cause of infertility (previous cancer treatment, bilateral tubal disease, premature ovarian insufficiency) · amenorrhoea with a suspected endocrine cause. <b>Delay in these groups costs options that do not come back.</b>"},
         {tone:"blue", h:"Refer with the baseline set complete", html:"<b>After 1 year of trying, with both partners' investigations available.</b> Include everything listed in \"What to have ready\" — the first clinic appointment is otherwise spent requesting what primary care could have provided."},
         {tone:"amber", h:"⚠ Funding — check before you promise", html:"NHS funding for IVF is decided by the local ICB and varies substantially: the number of cycles, the woman's age limits, BMI thresholds, smoking status, whether either partner has an existing child (including from a previous relationship), and a required period of trying or of self-funded IUI. NICE NG257 recommends 3 full cycles under 40 and 1 full cycle at 40–41 (before the 42nd birthday) if there has been no previous IVF, no evidence of low ovarian reserve, and the implications have been discussed, but local policy frequently offers less. Check the current local criteria before the conversation — an expectation set wrongly here is remembered for years."},
         {tone:"blue", h:"Urology / andrology", html:"Azoospermia or severe oligozoospermia · suspected obstruction · varicocele with abnormal parameters · absent vas deferens (check CF carrier status) · retrograde ejaculation · testicular mass (see NG12 below)."},
         {tone:"purple", h:"2WW · NICE NG12 — the cancers found during a fertility workup", html:"Infertility has no suspected-cancer criterion of its own, and none is invented here — but two NG12 routes run directly through this assessment and both are found on examination or first-line tests. A non-painful enlarging testicular mass or swelling → urgent direct-access ultrasound for suspected testicular cancer. Post-coital bleeding, or a cervix that looks or feels abnormal on examination → urgent suspected gynaecological cancer referral, regardless of a recent normal smear. Genital examination is part of this workup and must not be skipped because the presenting request is a fertility referral."},
         {tone:"green", h:"Counselling and support", html:"Offer counselling — NICE NG257 recommends it before, during and after investigation and treatment, independent of the medical pathway. <b>Fertility Network UK</b>, and local NHS or clinic-based fertility counselling."},
         {tone:"cream", h:"GP management", html:"Primary care owns: the timing decision, the parallel investigation of both partners, semen-analysis technique and its repeat, preconception care and folic acid, optimising chronic disease and switching teratogenic drugs, weight and smoking, the emotional support, and a referral complete enough to be useful. Related pages: <a href='pcos.html'>PCOS</a> · <a href='hyperprolactinaemia.html'>hyperprolactinaemia</a> · <a href='erectile-dysfunction.html'>erectile dysfunction</a> · <a href='testosterone-deficiency.html'>testosterone deficiency</a>."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A couple attend together: she is <b>37</b>, he is 39. They have been trying for <b>14 months</b>. Her cycles are regular at 32 days. She has had <b>chlamydia treated at 22</b>. He mentions in passing that he has been \"doing a proper gym programme\" for a year and takes \"a supplement stack\" a friend recommended. Her BMI is <b>32</b>, she smokes 10 a day, and she asks directly: <b>\"Can you refer us for IVF today?\"</b> She adds that her sister got three free rounds."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Recognises that at 37 with 14 months of trying, investigation and referral should not be delayed; arranges BOTH a semen analysis and a day-21 progesterone at this visit — and knows that in a 32-day cycle the correct day is 25, not 21; asks directly and non-judgementally about the \"supplement stack\", identifying probable anabolic steroid or testosterone use as a reversible cause of azoospermia, and explains that testosterone acts as a contraceptive; <b>notes the previous chlamydia as a tubal-factor risk</b> and screens both; addresses smoking and BMI as both fertility factors and likely funding criteria — framed as practical information, not judgement; <b>starts folic acid 5 mg given the BMI</b>; <b>gives the every-2–3-days advice rather than ovulation tracking</b>; <b>does not promise IVF funding</b>, explaining that ICB criteria vary and that her sister's entitlement may differ, while committing to check; says explicitly that this is a couple's assessment and male factor accounts for about half, so blame does not settle on her; <b>offers each of them a separate appointment</b>; and acknowledges the emotional weight and signposts counselling and Fertility Network UK."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG257 — Fertility problems: assessment and treatment (31 March 2026; replaced CG156)</b><br><a href="https://www.nice.org.uk/guidance/ng257" rel="noopener">nice.org.uk/guidance/ng257</a><span class="rd"> — the 1-year threshold and the early-investigation exceptions, the 84% and 92% conception figures, intercourse every 2–3 days rather than timed regimens, the primary-care investigation set, semen-analysis repeat timing, the recommendation against post-coital and antisperm antibody testing, the counselling recommendation, the 3-cycle / 40–41 IVF access recommendations, the advice against sperm DNA integrity testing, and considering treatment of a clinical varicocele with reduced semen parameters</span></li>'+
         '<li><b>NICE NG257 \u2014 Fertility problems: assessment and treatment</b><br><a href="https://www.nice.org.uk/guidance/ng257" rel="noopener">nice.org.uk/guidance/ng257</a><span class="rd"> — the primary-care workup, mid-luteal progesterone timing in non-28-day cycles, and referral criteria</span></li>'+
         '<li>WHO laboratory manual for the examination and processing of human semen<span class="rd"> — the lower reference limits quoted, and the collection and transport conditions</span></li>'+
         '<li>NICE NG23 — Menopause, and NICE guidance on premature ovarian insufficiency<span class="rd"> — the ovarian-reserve context for AMH and FSH interpretation</span></li>'+

         '<li><b>Fertility Network UK</b><br><a href="https://fertilitynetworkuk.org" rel="noopener">fertilitynetworkuk.org</a><span class="rd"> — the patient support organisation signposted throughout</span></li>'+
         '<li>FGM mandatory reporting duty (Serious Crime Act 2015) · local safeguarding procedures<span class="rd"> — the statutory duties referenced in the safeguarding card</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Infertility — NICE NG257 (2026, replaced CG156), the WHO semen analysis manual, NG12 and HFEA. Investigate after 1 year — but earlier at 36 or over, or with any predictive history, because age is the one variable that does not come back. Investigate BOTH partners in parallel from the first appointment: male factor contributes in about half. Get the semen analysis technique right and repeat an abnormal result at 3 months. Never prescribe testosterone to a man trying to conceive. Time the mid-luteal progesterone 7 days before the expected period, not on day 21. Start folic acid, address smoking and weight, and check the local ICB funding criteria before setting any expectation. Verify all doses against the BNF before prescribing."
