<script>
MG.render({
  icon:"🌸",
  title:"Bacterial Vaginosis",
  eyebrow:"Protocol · assess and manage in one place",
  stemTitle:"Bacterial vaginosis: a flora imbalance, not an infection caught from a partner. Treat the symptoms, plan for the return",
  stemSub:"One page for bacterial vaginosis in general practice. The lactobacilli that keep the vagina acidic are displaced by a mixed anaerobic flora, the pH rises and a thin, fishy-smelling discharge follows. Make the diagnosis from the discharge, the odour and a pH strip, make sure it is not trichomonas, cervicitis or something that needs a cancer pathway, treat symptomatic women with metronidazole, adjust for pregnancy, breastfeeding and upcoming procedures, and prepare the patient for a condition that returns in more than half of women within a year. BASHH 2012 · UKTIS · NICE NG12 (updated April 2026).",
  guideline:"BASHH bacterial vaginosis 2012 · NICE NG12 (updated April 2026) · UKTIS metronidazole · Bradshaw, J Infect Dis 2006",
  meta:[
    {t:"BASHH 2012 · bacterial vaginosis"},
    {t:"UKTIS · metronidazole in pregnancy"},
    {t:"BNF · SPC · metronidazole, clindamycin"},
    {t:"NG12 (April 2026) · discharge or bleeding aged 55+", tone:"tw"}
  ],
  lead:"<div class='mg-layers'><a href='#recognise'><b>Recognise</b><small>discharge, odour, pH</small></a><a href='#differential'><b>Rule out</b><small>TV, cervicitis, cancer</small></a><a href='#treat'><b>Treat</b><small>metronidazole</small></a><a href='#recurrent'><b>Keeps coming back?</b><small>suppression plan</small></a></div>",
  quickSub:"The six points that change what you do in the room. Each one traces to a named primary source under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"blue", h:"Diagnose from three bedside clues", html:"A <b>thin, grey-white, even-textured discharge</b>, a <b>fishy smell</b> that is often worse after sex or a period, and a <b>vaginal pH above 4.5</b> on a narrow-range strip. Itch and soreness point away from BV. BASHH accepts either the Amsel criteria (three of four) or a Gram-stained smear graded by the Hay–Ison method, so a swab for microscopy is for the uncertain or recurrent case, not the classic one.", src:"BASHH bacterial vaginosis 2012"},
    {tone:"cream", h:"Metronidazole by mouth is the workhorse", html:"<b>Metronidazole 400 mg twice daily for 5–7 days</b> by mouth, or a single 2 g dose where adherence matters more than a small loss of efficacy. Vaginal options work as well: <b>metronidazole 0.75% gel, one applicator at night for 5 nights</b>, or <b>clindamycin 2% cream, one applicator at night for 7 nights</b>. Only treat women who have symptoms, or who are about to have a procedure.", src:"BASHH bacterial vaginosis 2012 · BNF"},
    {tone:"amber", h:"Pregnant and symptomatic: treat, but not with 2 g", html:"Treat in the usual way with the <b>5–7 day oral course or a vaginal preparation</b>; the single high dose is not used in pregnancy. BV is linked with late miscarriage and preterm birth, but antibiotics have not been shown to reduce preterm birth in women without other risk factors, so there is no case for screening women who have no symptoms.", src:"BASHH bacterial vaginosis 2012 · UKTIS · Cochrane (Brocklehurst 2013)"},
    {tone:"green", h:"Not an STI: partners are not routinely treated", html:"BV is associated with sexual activity but is not classed as sexually transmitted, and <b>routine partner treatment is not recommended</b> in the UK guideline. An Australian trial published in 2025 found that treating the regular male partner cut recurrence at 12 weeks from 63% to 35%, so the question is now reasonable to discuss with sexual health for a woman with repeated episodes.", src:"BASHH bacterial vaginosis 2012 · Vodstrcil, NEJM 2025"},
    {tone:"amber", h:"Expect it to come back", html:"In a cohort treated with 7 days of metronidazole, <b>58% had a recurrence within 12 months</b>. Tell the patient this at the first visit. For frequent recurrences, confirm the diagnosis on a swab, then consider <b>suppressive metronidazole 0.75% gel twice weekly</b> for about four months.", src:"Bradshaw, J Infect Dis 2006 · BASHH bacterial vaginosis 2012"},
    {tone:"purple", h:"Aged 55 or over with new discharge: think endometrium", html:"NICE NG12: consider an urgent direct access ultrasound scan to assess for endometrial cancer in people aged 55 and over with unexplained symptoms of vaginal discharge who are presenting with these symptoms for the first time, or have thrombocytosis, or report haematuria. Post-menopausal bleeding at 55 or over that cannot be attributed to HRT is a suspected cancer pathway referral.", src:"NICE NG12 (updated April 2026)"}
  ],
  pathwaySub:"The consultation in five moves. The first step is where women come to harm, because a cancer or a pelvic infection can hide behind a discharge.",
  pathway:[
    {title:"Screen for what a discharge can hide", html:"Pelvic pain, fever or deep dyspareunia (pelvic infection) · bleeding between periods or after sex, or an abnormal-looking cervix (cervical cancer) · new discharge or any bleeding after the menopause at 55 or over (endometrial cancer) · a mass in the vagina · pregnancy with pain or bleeding · a retained tampon or other object · a child or young person where abuse is possible. Any of these moves the patient off this page.", alert:true},
    {title:"Confirm the pattern", html:"Take a short history (odour, itch, soreness, timing with sex and periods, new partner, douching, contraception) and look. A thin, homogeneous discharge coating the vaginal walls with a <b>pH above 4.5</b> and no inflammation is BV until proved otherwise. Blood and semen also raise the pH, so interpret it with the history."},
    {title:"Decide who needs a swab", html:"Classic features and no STI risk: treat without a swab. Take a <b>high vaginal swab for Gram stain</b> when the picture is atypical, when treatment has failed, when episodes keep recurring, or in pregnancy. If there is any sexual risk, offer <b>chlamydia and gonorrhoea NAAT</b>, and a <b>trichomonas NAAT</b> because TV also raises the pH."},
    {title:"Treat the symptoms", html:"<b>Metronidazole 400 mg twice daily for 5–7 days</b> (or 2 g once), or metronidazole gel or clindamycin cream vaginally if tablets are not tolerated or not wanted. No alcohol during oral metronidazole and for 48 hours after. Warn that clindamycin cream weakens latex condoms and diaphragms."},
    {title:"Plan for the next episode", html:"Explain that recurrence is common and not a sign of infidelity or poor hygiene. Remove avoidable triggers (douching, perfumed washes), review the contraceptive method if a copper coil is in place and episodes are frequent, and agree what happens next time: repeat treatment, then a swab and a suppression plan."}
  ],
  sections:[
    {id:"recognise", nav:"Recognise", title:"Recognising BV and confirming it", sub:"BV is the commonest cause of abnormal discharge in women of reproductive age. Most cases are recognisable at the bedside; the swab is for the cases that are not.",
     blocks:[
       {b:"table", head:["Clue","What you find","How much weight to give it"], rows:[
         ["<b>Discharge</b>","Thin, grey or white, uniform, coating the vaginal walls rather than clumped","Supportive; the pattern differs clearly from the curdy discharge of thrush"],
         ["<b>Odour</b>","Fishy, often noticed after unprotected sex or around a period, when alkaline fluid releases amines","One of the Amsel criteria; many women present with this alone"],
         ["<b>Vaginal pH</b>","<b>Above 4.5</b> on a narrow-range strip applied to the lateral vaginal wall","Highly sensitive for BV; a pH of 4.5 or below makes BV unlikely. Trichomonas also raises it"],
         ["<b>Clue cells</b>","Vaginal epithelial cells studded with bacteria on wet-mount microscopy","Specialist or clinic microscopy; the fourth Amsel criterion"],
         ["<b>Gram stain</b>","Graded by the Hay–Ison method: grade 3 (few or no lactobacilli, mixed anaerobic morphotypes) is BV","The laboratory standard in the UK; ask for it on a high vaginal swab when the diagnosis is in doubt"],
         ["<b>What BV does not cause</b>","Marked itch, soreness, vulval redness or swelling","If these dominate, look for candida, trichomonas or a dermatosis instead"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Amsel: three of four is enough", html:"Thin homogeneous discharge · pH above 4.5 · fishy smell (spontaneously or after adding potassium hydroxide) · clue cells on microscopy. BASHH accepts three of these four, or a Hay–Ison grade 3 smear, as the diagnosis.", src:"BASHH bacterial vaginosis 2012"},
         {tone:"blue", h:"Associations worth asking about", html:"BV is more common with a new sexual partner, vaginal douching, smoking and use of a copper intrauterine device. In a prospective cohort, copper coil users had about a 1.3-fold higher risk of BV that persisted throughout use.", src:"BASHH bacterial vaginosis 2012 · Peebles, Clin Infect Dis 2021"}
       ]},
       {b:"why", html:"The vagina is normally acidic because lactobacilli produce lactic acid. In BV that population is replaced by a dense mixed flora of anaerobes and <i>Gardnerella</i>, the pH rises and amines are released, which is what the patient smells. It is not an inflammatory infection, which is why itch, redness and pus cells are absent and why an inflamed vulva should make you think of something else."}
     ]},

    {id:"differential", nav:"Rule out", title:"What else produces a discharge", sub:"Four other causes account for most abnormal discharge in general practice. Two of them are sexually transmitted and need partner management; BV does not.",
     blocks:[
       {b:"table", head:["Cause","Pointers","pH","Next step"], rows:[
         ["<b>Bacterial vaginosis</b>","Thin, grey, fishy; no itch; no inflammation","Above 4.5","Treat if symptomatic"],
         ["<b>Vulvovaginal candidiasis</b>","Itch, soreness, superficial dyspareunia; thick white or curdy discharge; red, sometimes fissured vulva","4.5 or below","Antifungal treatment; swab if recurrent"],
         ["<b>Trichomonas vaginalis</b>","Frothy yellow-green discharge, soreness, dysuria; often mild or absent symptoms","Above 4.5","TV NAAT; an STI, so partner treatment and a full screen"],
         ["<b>Chlamydia or gonorrhoea cervicitis</b>","Mucopurulent discharge, bleeding after sex or between periods, a friable cervix; pelvic pain means pelvic infection","Usually normal","NAAT; if pelvic tenderness, treat as pelvic inflammatory disease"],
         ["<b>Retained foreign body</b>","Very offensive discharge; forgotten tampon or condom","Variable","Remove; safety-net for systemic illness"],
         ["<b>Atrophic vaginitis</b>","Post-menopausal, dryness, dyspareunia, thin pale mucosa","Raised","Vaginal oestrogen, but first exclude the NG12 criteria in women aged 55 and over"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Why a pH strip is worth keeping in the room", html:"A pH of 4.5 or below almost excludes BV and trichomonas and points to candida or a physiological discharge. A raised pH with a fishy odour and no itch is BV until a swab says otherwise. It costs seconds and avoids treating the wrong condition.", src:"BASHH bacterial vaginosis 2012"},
         {tone:"amber", h:"If there is any sexual risk, test for STIs as well", html:"BV and an STI can coexist, and a raised pH does not tell BV from trichomonas. Offer chlamydia and gonorrhoea NAAT, a TV NAAT, and HIV and syphilis testing to women with a new partner, more than one partner, or a partner with symptoms.", src:"BASHH bacterial vaginosis 2012 · BASHH Trichomonas vaginalis 2021"}
       ]}
     ]},

    {id:"redflags", nav:"Red flags", title:"Red flags — when a discharge is not just BV", sub:"Most women with BV are well. These features move the consultation to a different pathway, some the same day.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Pelvic pain, fever or cervical motion tenderness", html:"Lower abdominal pain, deep dyspareunia, fever, or adnexal or cervical motion tenderness on bimanual examination suggest pelvic inflammatory disease, which needs same-day empirical antibiotics and STI testing. See the <a href='pelvic-inflammatory-disease.html'>PID protocol</a>.", src:"BASHH PID 2019"},
         {tone:"red", h:"Positive pregnancy test with pain or bleeding", html:"Refer immediately to an early pregnancy assessment service (or out-of-hours gynaecology) anyone with a positive pregnancy test and pain with abdominal, pelvic or cervical motion tenderness.", src:"NICE NG126 (2019, updated 2023)"},
         {tone:"red", h:"Retained object with systemic illness", html:"Fever, rash, vomiting, diarrhoea or hypotension in someone with a retained tampon or other vaginal object may be toxic shock: remove the object and send the patient for same-day emergency assessment."},
         {tone:"purple", h:"New discharge aged 55 or over <span class='tw'>NG12</span>", html:"Consider an urgent direct access ultrasound scan to assess for endometrial cancer in people aged 55 and over with unexplained symptoms of vaginal discharge who are presenting with these symptoms for the first time, or have thrombocytosis, or report haematuria.", src:"NICE NG12 (updated April 2026)"},
         {tone:"purple", h:"Post-menopausal bleeding aged 55 or over <span class='tw'>2WW</span>", html:"Refer using a suspected cancer pathway referral for endometrial cancer if aged 55 and over with unexplained post-menopausal bleeding that cannot be attributed to hormone replacement therapy (HRT); under 55, consider one. A bloodstained discharge after the menopause deserves the same question.", src:"NICE NG12 (updated April 2026)"},
         {tone:"purple", h:"Abnormal cervix or vaginal mass <span class='tw'>2WW</span>", html:"Consider a suspected cancer pathway referral for cervical cancer if, on examination, the appearance of the cervix is consistent with cervical cancer, and for vaginal cancer if there is an unexplained palpable mass in or at the entrance to the vagina. Always look at the cervix when discharge comes with bleeding after sex or between periods.", src:"NICE NG12 (updated April 2026)"},
         {tone:"amber", h:"A child or young person", html:"Discharge in a pre-pubertal girl, or any concern about sexual exploitation or abuse, is a safeguarding matter. A child under 13 cannot consent to sexual activity in law. Follow local safeguarding procedures and discuss with the named or designated safeguarding lead.", src:"Working Together to Safeguard Children 2026 · Sexual Offences Act 2003"}
       ]},
       {b:"warn", html:"Do not label a new discharge as BV in a woman aged 55 or over without first asking about bleeding and considering the NG12 ultrasound criterion. After the menopause the vagina loses its lactobacilli and a raised pH is expected, so pH testing does not separate BV from atrophy or malignancy."}
     ]},

    {id:"treat", nav:"Treat", title:"Treatment — who to treat and with what", sub:"Treat symptomatic women and those about to have an upper genital tract procedure. Doses below are those given in the BASHH guideline; check each against the BNF before prescribing.",
     blocks:[
       {b:"ladder", steps:[
         {step:"First choice", title:"Oral metronidazole", when:"symptomatic, not pregnant", fromLabel:"most women",
          html:"<b>Metronidazole 400 mg twice daily for 5–7 days.</b> Cheap, well tolerated apart from a metallic taste and nausea. A <b>single 2 g dose</b> is an alternative when a course is unlikely to be completed; it is not used in pregnancy. Advise no alcohol during the course and for 48 hours after (BNF and SPC)."},
         {step:"Vaginal", title:"Metronidazole gel or clindamycin cream", when:"oral not tolerated or not wanted", fromLabel:"if tablets are unsuitable",
          html:"<b>Metronidazole 0.75% vaginal gel, one 5 g applicator at bedtime for 5 nights</b>, or <b>clindamycin 2% vaginal cream, one 5 g applicator at bedtime for 7 nights</b>. Clinical cure rates are similar to oral treatment. Clindamycin cream is oil-based: the SPC advises against relying on latex condoms or diaphragms during treatment and for 72 hours after."},
         {step:"Alternatives", title:"Tinidazole or oral clindamycin", when:"specialist or second-line", fromLabel:"if first-line options fail or are not possible",
          html:"BASHH lists <b>tinidazole 2 g as a single dose</b> and <b>clindamycin 300 mg twice daily for 7 days</b> as alternatives. Oral clindamycin carries a recognised risk of <i>Clostridioides difficile</i> colitis (SPC), so it is rarely the right choice in primary care."}
       ]},
       {b:"table", head:["Situation","Treat?","Note"], rows:[
         ["<b>Symptomatic, not pregnant</b>","<b>Yes</b>","Any first-line regimen; choose with the patient"],
         ["<b>Asymptomatic, found incidentally on a swab</b>","<b>Usually no</b>","Treatment is for symptoms; the exception is a planned upper genital tract procedure"],
         ["<b>Before surgical termination, IUD insertion, hysterectomy or other upper genital tract procedure</b>","<b>Yes, even without symptoms</b>","BV before these procedures is associated with post-procedure endometritis and pelvic infection"],
         ["<b>Pregnant and symptomatic</b>","<b>Yes</b>","5–7 day oral course or vaginal treatment; not the 2 g dose. See <a href='#special'>Special groups</a>"],
         ["<b>Pregnant and asymptomatic</b>","<b>No routine screening or treatment</b>","Consider specialist advice where there are other risk factors for preterm birth"],
         ["<b>Partner of a woman with BV</b>","<b>Not routinely</b>","See <a href='#recurrent'>Recurrence</a> for the 2025 partner-treatment trial"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"cream", h:"Interactions worth checking", html:"Metronidazole enhances the effect of warfarin and can raise lithium levels; the SPC also warns about disulfiram (psychotic reactions) and busulfan. Check the INR if a course is given to someone on warfarin.", src:"Metronidazole SPC · BNF"},
         {tone:"green", h:"No test of cure if symptoms settle", html:"A repeat swab is not needed when the symptoms resolve. Re-test only if symptoms persist or come back, or in pregnancy if the obstetric team asks for it.", src:"BASHH bacterial vaginosis 2012"}
       ]},
       {b:"why", html:"The choice between oral and vaginal routes is a matter of preference: both clear symptoms in most women, and neither prevents recurrence. The 2 g single dose trades a little efficacy for adherence. The alcohol advice comes from the product information; the evidence for a true disulfiram-like reaction is weak, but the SPC and BNF still carry it, so give it."}
     ]},

    {id:"special", nav:"Special groups", title:"Pregnancy, breastfeeding, procedures and other groups", sub:"The groups in which the plan genuinely changes.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"🤰 Pregnancy", html:"BV in pregnancy is associated with late miscarriage, preterm rupture of membranes and preterm birth. Symptomatic women are treated with <b>metronidazole 400 mg twice daily for 5–7 days</b> or a vaginal preparation; the 2 g dose is avoided. A Cochrane review found that antibiotics clear BV in pregnancy but did not reduce birth before 37 weeks overall. Women with a previous preterm birth or late miscarriage should have their BV discussed with the maternity team.", src:"BASHH bacterial vaginosis 2012 · Cochrane (Brocklehurst 2013)"},
         {tone:"green", h:"💊 Is metronidazole safe in pregnancy?", html:"The UK Teratology Information Service reports that the human data, taken together, do not indicate an increased risk of congenital malformation after metronidazole in pregnancy. Use it at any gestation when treatment is indicated.", src:"UKTIS metronidazole monograph"},
         {tone:"amber", h:"🍼 Breastfeeding", html:"Metronidazole passes into breast milk and may alter its taste. The manufacturer advises avoiding high doses, so use the <b>5–7 day 400 mg course</b> or a vaginal preparation rather than the single 2 g dose.", src:"BASHH bacterial vaginosis 2012 · metronidazole SPC"},
         {tone:"blue", h:"🩺 Before a procedure", html:"Ask about symptoms before a surgical termination, intrauterine device insertion or gynaecological surgery. If BV is found, treat it before the procedure, even without symptoms, to reduce the risk of post-procedure pelvic infection.", src:"BASHH bacterial vaginosis 2012"},
         {tone:"blue", h:"🔗 Copper coil users with frequent recurrence", html:"The copper intrauterine device is associated with a modest increase in BV. It is a reason to review contraception with a woman whose BV keeps returning, not a reason to remove a device from someone who is happy with it.", src:"Peebles, Clin Infect Dis 2021 · FSRH intrauterine contraception 2023"},
         {tone:"blue", h:"🧬 Women living with HIV", html:"BV is associated with an increased risk of acquiring HIV and of transmitting it. Treat symptomatic BV in the same way, and make sure women with BV and sexual risk are offered an HIV test.", src:"BASHH bacterial vaginosis 2012 · BHIVA/BASHH/BIA HIV testing 2020"},
         {tone:"cream", h:"👩‍❤️‍👩 Women who have sex with women", html:"BV is common in women who have female partners and is often shared. There is no trial showing that treating a female partner prevents recurrence, so assess and treat a symptomatic partner in her own right.", src:"BASHH bacterial vaginosis 2012"},
         {tone:"amber", h:"🧒 Under 16", html:"A young person can be treated confidentially if competent (Fraser and Gillick), but assess for coercion, exploitation and age gap at every sexual health consultation, and share information under safeguarding procedures where there is risk of harm.", src:"Working Together to Safeguard Children 2026"}
       ]}
     ]},

    {id:"recurrent", nav:"Recurrence", title:"When BV keeps coming back", sub:"Recurrence is the rule rather than the exception. A plan agreed at the first visit saves repeated consultations and unnecessary anxiety.",
     blocks:[
       {b:"timeline", items:[
         {n:"1", when:"First recurrence", title:"Treat again and look for triggers", html:"Repeat a first-line regimen (switching route is reasonable). Ask about douching, perfumed washes, a new partner, smoking and the contraceptive method. Offer an STI screen if there is any sexual risk."},
         {n:"2", when:"Frequent recurrences", title:"Confirm the diagnosis", html:"Before committing to months of treatment, take a <b>high vaginal swab for Gram stain</b> while symptomatic and a <b>trichomonas NAAT</b>. Make sure the symptoms really are BV and not candida, a dermatosis or a physiological discharge. Many services treat three or more episodes a year as recurrent, although no single threshold is set in guidance."},
         {n:"3", when:"Confirmed recurrent BV", title:"Suppressive treatment", html:"Treat the current episode, then consider <b>metronidazole 0.75% vaginal gel twice weekly for about 16 weeks</b>, which reduced recurrence while it was used in the original trial. BASHH also describes a short course of oral metronidazole timed around menstruation, with limited evidence. Recurrence after stopping is common; agree when to review."},
         {n:"4", when:"Still recurring", title:"Sexual health clinic", html:"Refer for microscopy, specialist regimens and a discussion of partner treatment in the light of the 2025 trial."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Treating the male partner: new evidence", html:"In the StepUp trial, women with a regular male partner were randomised to standard treatment alone or with their partner taking oral metronidazole and applying clindamycin cream to the penile skin for 7 days. Recurrence within 12 weeks was <b>35% with partner treatment versus 63% without</b>, and the trial stopped early. UK guidance predates this and does not yet recommend it, so discuss it with sexual health rather than prescribing for the partner yourself.", src:"Vodstrcil, NEJM 2025 · BASHH bacterial vaginosis 2012"},
         {tone:"blue", h:"Lactic acid gel and probiotics", html:"In the UK VITA trial of recurrent BV, symptoms had resolved at 2 weeks in <b>70% of women given 7 days of oral metronidazole versus 47% given lactic acid gel</b>. Lactic acid gel is less effective for treating an episode but some women prefer it. The evidence for oral or vaginal probiotics is not strong enough to recommend them.", src:"Armstrong, VITA trial, NIHR Health Technol Assess 2022 · BASHH bacterial vaginosis 2012"}
       ]},
       {b:"why", html:"Recurrence is thought to reflect a biofilm of <i>Gardnerella</i> and other anaerobes that antibiotics suppress but do not remove, together with re-exposure from a sexual partner. That explains both why suppression works only while it is used and why partner treatment has now shown an effect in a trial."}
     ]},

    {id:"advice", nav:"Advice", title:"Self-care and what to tell the patient", sub:"Practical advice that reduces triggers and sets expectations.",
     blocks:[
       {b:"table", head:["Advice","Why"], rows:[
         ["<b>Do not douche or wash inside the vagina</b>","Douching is associated with BV and removes the protective lactobacilli"],
         ["<b>Wash the vulva with water or a plain emollient</b>","Perfumed soaps, bubble bath, antiseptics and vaginal deodorants irritate and disturb the flora"],
         ["<b>Avoid alcohol during oral metronidazole and for 48 hours after</b>","Product information warns of a disulfiram-like reaction"],
         ["<b>Condoms and diaphragms are unreliable with clindamycin cream</b>","The oil base weakens latex during use and for 72 hours after"],
         ["<b>Finish the course even if the smell goes quickly</b>","Symptoms settle within days, but stopping early makes early relapse more likely"],
         ["<b>Come back if it returns</b>","Recurrence is common and treatable; a swab and a longer plan are available"],
         ["<b>Stopping smoking</b>","Smoking is associated with BV, and stopping has wider benefits"]
       ]},
       {b:"say", html:"This is bacterial vaginosis. The normal, healthy bacteria in the vagina have been outnumbered by other bacteria that live there too, and that causes the smell and the discharge. It isn't something you've caught, and it doesn't mean anyone has been unfaithful. A short course of tablets or a gel will clear it. It does come back for a lot of women, so if it does, come and see us and we'll make a longer plan."}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — who, when and how urgently", sub:"Most women with BV are managed entirely in general practice. These are the exceptions.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same day", html:"Suspected pelvic inflammatory disease with systemic illness, or where a surgical cause cannot be excluded → gynaecology. Positive pregnancy test with pain and pelvic or cervical motion tenderness → early pregnancy assessment service. Suspected toxic shock → emergency department.", src:"BASHH PID 2019 · NICE NG126 (2019, updated 2023)"},
         {tone:"purple", h:"Suspected cancer pathway <span class='tw'>2WW</span> · NICE NG12", html:"Refer using a suspected cancer pathway referral for endometrial cancer if aged 55 and over with unexplained post-menopausal bleeding that cannot be attributed to HRT (under 55: consider one). Consider a suspected cancer pathway referral for cervical cancer if the appearance of the cervix is consistent with cervical cancer, and for vaginal cancer if there is an unexplained palpable mass in or at the entrance to the vagina. Consider an urgent direct access ultrasound scan for endometrial cancer if aged 55 and over with unexplained vaginal discharge presenting for the first time, or with thrombocytosis, or with haematuria.", src:"NICE NG12 (updated April 2026)"},
         {tone:"amber", h:"Sexual health clinic", html:"Recurrent BV despite suppression · diagnostic doubt after a swab · a positive or suspected STI needing partner notification · a request to consider partner treatment.", src:"BASHH bacterial vaginosis 2012"},
         {tone:"amber", h:"Maternity team", html:"Symptomatic BV in a woman with a previous preterm birth or second-trimester loss, or BV with other preterm-birth risk factors.", src:"BASHH bacterial vaginosis 2012"},
         {tone:"amber", h:"Safeguarding lead", html:"Any concern about abuse or exploitation in a child or young person; any sexual activity in a child under 13.", src:"Working Together to Safeguard Children 2026"},
         {tone:"green", h:"Manage in general practice", html:"First and occasional episodes, pregnancy without extra risk factors, breastfeeding, and treatment before a planned procedure.", src:"BASHH bacterial vaginosis 2012"}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card; the Casebook holds the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 29-year-old woman has had a watery, smelly discharge for two weeks, worse after sex. It is her third episode this year. She is worried her partner has been unfaithful and wants him tested. She has a copper coil and is hoping to try for a baby next year.", src:"BASHH bacterial vaginosis 2012"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Asks about itch, pain, bleeding and new partners to exclude an STI or pelvic infection · uses a pH strip or explains the diagnosis clearly · explains that BV is <b>not an STI</b> and does not imply infidelity, while offering an STI screen if she wants one · agrees a regimen and gives the alcohol advice · addresses recurrence honestly (more than half within a year) · raises the copper coil as a possible factor without insisting on removal · mentions that BV should be treated if she becomes pregnant and has symptoms · safety-nets for pain, fever and bleeding.", src:"BASHH bacterial vaginosis 2012 · Bradshaw, J Infect Dis 2006"}

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Every figure on this page traces to one of these primary sources.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>BASHH — UK national guideline for the management of bacterial vaginosis (2012)<br><a href="https://www.bashh.org/resources/21/bacterial_vaginosis_2012/" rel="noopener">bashh.org — bacterial vaginosis 2012</a><span class="rd"> — Amsel and Hay–Ison diagnosis, who to treat, first-line and alternative regimens, pregnancy and breastfeeding, procedures, suppressive treatment, partner management and test of cure. Still the current BASHH BV guideline in September 2026.</span></li>'+
         '<li>NICE NG12 — Suspected cancer: recognition and referral (2015, last updated 15 April 2026)<br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — direct access ultrasound for new vaginal discharge at 55 and over, post-menopausal bleeding not attributable to HRT (endometrial recommendations amended April 2026), cervical appearance and vaginal mass</span></li>'+
         '<li>NICE NG126 — Ectopic pregnancy and miscarriage: diagnosis and initial management (2019, updated 2023)<br><a href="https://www.nice.org.uk/guidance/ng126" rel="noopener">nice.org.uk/guidance/ng126</a><span class="rd"> — immediate referral for a positive pregnancy test with pain and tenderness</span></li>'+
         '<li>BASHH — UK national guideline for the management of pelvic inflammatory disease (2018, 2019 interim update)<br><a href="https://www.bashh.org/resources/10/pelvic_inflammatory_disease/" rel="noopener">bashh.org — pelvic inflammatory disease</a><span class="rd"> — features that point to pelvic infection</span></li>'+
         '<li>BASHH — UK national guideline on Trichomonas vaginalis (2021)<span class="rd"> — TV as a cause of raised pH and the need for NAAT</span></li>'+
         '<li>BHIVA/BASHH/BIA — Adult HIV testing guidelines (2020)<span class="rd"> — offering HIV testing where there is sexual risk</span></li>'+
         '<li>UK Teratology Information Service — Use of metronidazole in pregnancy<br><a href="https://uktis.org/monographs/use-of-metronidazole-in-pregnancy/" rel="noopener">uktis.org</a><span class="rd"> — no increased risk of congenital malformation overall</span></li>'+
         '<li>BNF and SPCs — metronidazole tablets, metronidazole 0.75% vaginal gel, clindamycin 2% vaginal cream<br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a> · <a href="https://www.medicines.org.uk/emc/product/1080/smpc" rel="noopener">clindamycin cream SPC</a><span class="rd"> — doses, alcohol advice, interactions, breastfeeding, and latex condoms and diaphragms for 72 hours after clindamycin cream</span></li>'+
         '<li>FSRH — Intrauterine contraception (March 2023, amended)<span class="rd"> — contraceptive review for copper IUD users</span></li>'+
         '<li>Working Together to Safeguard Children (DfE, 2026)<span class="rd"> — safeguarding duties for children and young people</span></li>'+
         '<li>Bradshaw CS et al. High recurrence rates of bacterial vaginosis over the course of 12 months after oral metronidazole therapy. J Infect Dis 2006;193:1478–86<span class="rd"> — 58% recurrence by 12 months</span></li>'+
         '<li>Vodstrcil LA et al. Male-partner treatment to prevent recurrence of bacterial vaginosis. N Engl J Med 2025<span class="rd"> — recurrence 35% versus 63% at 12 weeks</span></li>'+
         '<li>Armstrong E et al. Lactic acid gel versus metronidazole for recurrent bacterial vaginosis (VITA). NIHR Health Technol Assess 2022<span class="rd"> — symptom resolution 70% versus 47% at 2 weeks</span></li>'+
         '<li>Brocklehurst P et al. Antibiotics for treating bacterial vaginosis in pregnancy. Cochrane Database Syst Rev 2013<span class="rd"> — no overall reduction in preterm birth before 37 weeks</span></li>'+
         '<li>Peebles K et al. Elevated risk of bacterial vaginosis among users of the copper intrauterine device. Clin Infect Dis 2021<span class="rd"> — about a 1.3-fold higher risk</span></li>'+
