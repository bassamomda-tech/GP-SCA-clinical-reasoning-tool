  quickSub:"If you read nothing else on this page, read these six cards. Every number traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"\u26a0 Dipstick before you label it", html:"<b>Visible haematuria is not explained by stress or urgency incontinence</b> — investigate it separately and do not let a presumed UTI or incontinence diagnosis delay assessment. NG12: aged 45 and over (\u226545) with unexplained visible haematuria without UTI \u2014 or visible haematuria that persists or recurs after successful treatment of a UTI \u2014 <b>bladder and renal suspected cancer pathway referral</b>. Aged 60 and over (\u226560) with non-visible haematuria plus dysuria or a raised white cell count \u2192 bladder suspected cancer pathway referral. Under 45, visible haematuria still needs explanation and urological/renal assessment, but is not automatically a suspected cancer pathway referral. Examine the abdomen and dipstick every patient before calling it stress or urge incontinence.", src:"NICE NG12 (updated April 2026)"},
    {tone:"red", h:"Cauda equina hides in a bladder story", html:"New neurological symptoms (leg weakness, saddle anaesthesia, bilateral leg symptoms) plus new bladder or bowel dysfunction \u2192 999 / emergency assessment. Missing it causes permanent paralysis. <b>Acute urinary retention</b> (unable to pass urine, suprapubic pain, distended bladder) \u2192 same-day assessment. <b>Chronic incomplete emptying</b> \u2192 prompt assessment, PVR and referral depending on findings. Longstanding faecal urgency or incontinence does not by itself need a same-day MRI \u2014 document the neurological history and acuity."},
    {tone:"amber", h:"The history does the classifying", html:"<b>Stress</b> = leak on cough, sneeze, laugh, exercise or lifting, no preceding urge. <b>Urgency</b> = a sudden compelling urge that the leak follows. <b>Mixed</b> = both \u2014 treat the most bothersome component first. <b>Overflow</b> = constant dribble with incomplete emptying (never give antimuscarinics). History usually allows an initial classification as stress, urgency or mixed incontinence; use examination, a <b>bladder diary (minimum 3 days)</b> and further assessment where the type is uncertain.", src:"NG123"},
    {tone:"blue", h:"Look for reversible or contributing factors", html:"Identify and address reversible or contributing factors before labelling symptoms as primary urinary incontinence \u2014 work <b>DIAPPERS</b> (a checklist, not an evidence-based percentage estimate): <b>D</b>elirium, <b>I</b>nfection, <b>A</b>trophic vaginitis, <b>P</b>harmacological, <b>P</b>sychological, <b>E</b>ndocrine/excess urine output, <b>R</b>estricted mobility, <b>S</b>tool impaction. A symptomatic UTI will not respond to pelvic-floor exercises, and treating incontinence with an antimuscarinic when the patient has a UTI is an avoidable error \u2014 but do not treat asymptomatic bacteriuria in non-pregnant women."},
    {tone:"green", h:"Conservative therapy IS the treatment", html:"Stress or mixed: supervised PFMT, at least 8 contractions 3 times daily, for at least 3 months, starting with an assessment of her ability to contract and relax the pelvic floor \u2014 supervised assessment and training are preferred where available, particularly when technique, adherence or ability to contract is uncertain. <b>Urgency or mixed: bladder training for at least 6 weeks</b>, gradually lengthening the interval between voids. BMI 30 or more: offer or refer for weight-management support \u2014 even modest weight loss can improve incontinence, but do not delay PFMT while waiting for weight loss."},
    {tone:"amber", h:"Mind the anticholinergic burden", html:"<b>Avoid oxybutynin in frail or older women</b> \u2014 falls and confusion; long-term cognitive effects of bladder antimuscarinics remain uncertain, so minimise cumulative anticholinergic burden; NICE NG123 says not to offer immediate-release oxybutynin to older women at higher risk of sudden deterioration, and the MHRA (July 2026) advises keeping anticholinergic load in older people as low and short as possible. Offer an <b>antimuscarinic chosen by local formulary</b>, comorbidity, anticholinergic burden, interactions, tolerability and patient preference; consider <b>mirabegron</b> (or vibegron) when antimuscarinics are unsuitable, ineffective or poorly tolerated (check BP before and during \u2014 contraindicated in severe uncontrolled hypertension, systolic 180 mmHg or more and/or diastolic 110 mmHg or more; dose adjustments per the current SPC/local formulary). <b>Antimuscarinics are contraindicated in overflow or retention.</b>"}

    {title:"Dipstick, examine, screen the red flags", html:"<b>Visible haematuria aged 45 and over \u2192 NG12 suspected cancer pathway referral.</b> New neurological symptoms with new bladder or bowel dysfunction \u2192 emergency (cauda equina). Acute retention \u2192 same-day. Palpable bladder or constant dribble \u2192 post-void residual, interpreted in clinical context. Pelvic mass \u2192 gynaecology suspected cancer pathway referral.", alert:true},
    {title:"Define the type", html:"Stress vs urgency vs mixed vs overflow vs functional, from the history plus a <b>3-day bladder diary</b>. Quantify symptoms and impact with the <b>ICIQ-UI-SF</b>, interpreted alongside patient-reported bother and functional impact, and repeat it to assess response."},
    {title:"Clear the reversibles", html:"DIAPPERS: symptomatic UTI, vaginal atrophy, diuretics and the <b>ACE-inhibitor cough</b> (switch to an ARB), opioids and antipsychotics, uncontrolled diabetes, constipation, mobility. Fix these before escalating."},
    {title:"Type-led conservative therapy, properly", html:"Supervised <b>PFMT for at least 3 months</b> for stress; <b>bladder training for at least 6 weeks</b> for urgency; weight-management support if BMI 30 or more, a trial of caffeine reduction, fluid intake modified only where excessive or insufficient, treat cough and constipation. <b>Topical vaginal oestrogen</b> if atrophic."},
    {title:"Then drugs, review, and refer the refractory", html:"OAB: antimuscarinic by local formulary, then mirabegron or vibegron if unsuitable, ineffective or poorly tolerated, <b>reviewed at 4 weeks</b>. Stress: no effective first-line drug \u2014 duloxetine not routinely second-line; only if she prefers drug treatment or surgery is declined or unsuitable. <b>Inadequate improvement after an adequate trial \u2192 escalate or refer</b> urogynaecology / continence service."}

         ["<b>Pelvic or abdominal mass</b>","Ovarian or other pelvic malignancy","<span class='tw'>Suspected cancer</span> <b>NICE NG12 (updated April 2026):</b> ascites and/or a pelvic or abdominal mass not obviously uterine fibroids \u2192 <b>gynaecology suspected cancer pathway referral</b>"],
         ["<b>Persistent or frequent (particularly more than 12 times a month) increased urinary urgency or frequency with abdominal distension/bloating, early satiety or loss of appetite, or pelvic or abdominal pain \u2014 especially aged 50 and over</b>","Ovarian cancer","<b>NICE NG12 (updated April 2026):</b> aged 40 and over with persistent symptoms suggesting ovarian cancer \u2192 measure CA125 in primary care; CA125 thresholds for urgent direct-access ultrasound: 35 IU/mL or more at 40\u201349, 31 or more at 50\u201359, 24 or more at 60\u201369, 25 or more at 70\u201379, 31 or more at 80 and over. Aged 39 and under, do not use CA125 alone \u2014 consider urgent direct-access ultrasound. Do not perform CA125 for isolated urgency with a clear stress/urgency diagnosis and no other concerning features"],
         ["<b>Post-menopausal bleeding</b>","Endometrial cancer","<span class='tw'>Suspected cancer</span> <b>NICE NG12 (updated April 2026): aged 55 and over with unexplained post-menopausal bleeding that cannot be attributed to HRT \u2192 suspected cancer pathway referral</b>; under 55, consider one. Easily buried in a continence consultation \u2014 ask the question"],
         ["<b>New neurology with bladder or bowel change</b>","Cauda equina, cord compression, MS","<b>999 / same-day emergency MRI</b> if leg weakness, saddle anaesthesia, bilateral leg symptoms, severe perineal pain \u2014 new faecal incontinence alongside new urinary symptoms is concerning and needs emergency assessment if acute; longstanding faecal urgency or incontinence does not by itself need same-day MRI. Document the neurological history and acuity"],
         ["<b>Retention with overflow</b>","Chronic or acute retention","<b>Acute retention</b> (unable to pass urine, suprapubic pain, distended bladder) \u2192 <b>same-day assessment</b>; untreated retention causes <b>acute kidney injury</b>. <b>Chronic incomplete emptying</b> (constant dribbling, palpable bladder after voiding) \u2192 prompt assessment, post-void residual and referral depending on findings. <b>Do not give antimuscarinics</b>"],

       {b:"why", html:"<b>Bladder cancer</b> can present with painless haematuria, with or without urgency \u2014 missing it is a serious clinical and SCA failure. <b>Cauda equina syndrome</b> can present subacutely with incontinence, saddle anaesthesia and bilateral leg weakness. <b>Overflow incontinence</b> from retention can cause acute kidney injury. All three are found by an abdominal examination and a dipstick that take a minute."}

    {id:"confirm", nav:"Confirm the type", title:"Define the type \u2014 it dictates the whole plan", sub:"Treatment differs fundamentally by subtype; the wrong first-line treatment simply fails.",
     blocks:[
       {b:"table", head:["Type","Symptom pattern","Mechanism / note"], rows:[
         ["<b>Stress UI (SUI)</b>","Leakage on coughing, sneezing, laughing, exercise or lifting. <b>No preceding urge sensation</b>, typically small volumes","Urethral sphincter and pelvic-floor weakness (childbirth, age, prolapse). <b>The commonest type in younger women</b>"],
         ["<b>Urgency UI (UUI) / OAB</b>","A <b>sudden compelling urge to void followed by leakage</b> \u2014 often cannot reach the toilet in time; frequency, nocturia","Detrusor overactivity. <b>Key discriminator: the urgency precedes the leak.</b> Exclude UTI, caffeine and diabetes"],
         ["<b>Mixed UI</b>","Symptoms of both","<b>Identify which is predominant \u2014 that guides the first treatment.</b> Common in older women"],
         ["<b>Overflow UI</b>","Constant dribbling, incomplete emptying, straining to void","Consider after previous pelvic surgery, in neurological disease, or with severe prolapse. <b>Refer \u2014 and never give antimuscarinics</b>"],
         ["<b>Functional UI</b>","Unable to reach the toilet for mobility or cognitive reasons rather than bladder pathology","Assess mobility, dexterity, cognition, communication and access to toileting. Use a validated cognitive instrument only when cognitive impairment is clinically suspected and the result will affect management; prompted or timed voiding and carer support"]
       ]},
       {b:"dl", rows:[
         ["<b>Key questions</b>","Onset, triggers, whether urgency precedes leakage, voided volumes, bowel symptoms, neurological symptoms, prolapse symptoms, pregnancy/postnatal status; visible haematuria, post-menopausal bleeding, pelvic pain, mass, recurrent UTI and weight loss; frequency, nocturia, <b>pad use per day</b>, quality-of-life impact, duration, <b>obstetric history and parity</b>, menopausal status, medications (diuretics, ACE-inhibitor cough), fluid intake and caffeine intake, and how much it bothers her"],
         ["<b>ICIQ-SF score (ICI-Q-SF)</b>","The validated <b>3-question</b> ICIQ-UI-SF (frequency + volume + impact). Use it to quantify symptoms and impact, and repeat it to assess response. Interpret the score alongside patient-reported bother and functional impact \u2014 numerical bands are not NICE severity thresholds"],
         ["<b>3-day bladder diary</b>","Minimum 3 days, covering variation in usual activities such as working and leisure days. Request it at the first consultation: times voided, volumes, leakage episodes, urgency severity and fluid intake. <b>The most valuable diagnostic tool in primary care</b> \u2014 it exposes nocturnal polyuria (which needs desmopressin, not an antimuscarinic), excessive or inadequate fluid intake and the caffeine load. Interpret voided volume and frequency in relation to reported fluid intake, diuretics, comorbidity and clinical context \u2014 the diary informs the assessment rather than providing rigid normal/abnormal cut-offs. Avoid unnecessary fluid restriction. Essential before specialist referral"],
         ["<b>How far the history gets you</b>","History usually allows an initial classification as stress, urgency or mixed incontinence; use examination, bladder diary and further assessment where the type is uncertain, and treat mixed incontinence according to the predominant symptom (NG123). PFMT is first-line for stress; bladder training plus, if needed, an antimuscarinic is first-line for urgency \u2014 using the wrong one fails the patient and wastes the appointment"]
       ]}
     ]},

    {id:"reversibles", nav:"Reversibles", title:"DIAPPERS \u2014 exclude the reversible causes first", sub:"Identify and address reversible or contributing factors before labelling symptoms as primary urinary incontinence.",
     blocks:[
       {b:"table", head:["","Cause","What to do"], rows:[
         ["<b>D</b>","Delirium","Acute confusion means she cannot recognise or respond to the urge \u2014 address the underlying cause"],
         ["<b>I</b>","Infection","UTI causes transient urgency and frequency. <b>Always dipstick</b> as part of the assessment \u2014 a dipstick alone does not diagnose UTI. With urinary symptoms and both leucocytes and nitrites positive: send an MSU and prescribe antibiotics pending culture; with symptoms but either negative: send an MSU and consider antibiotics pending culture. <b>Do not treat asymptomatic bacteriuria in non-pregnant women</b> because the dipstick or culture is positive \u2014 particularly in older women and care-home residents"],
         ["<b>A</b>","Atrophic vaginitis","Post-menopausal oestrogen deficiency \u2192 urgency, frequency, dysuria. Pale, thin, dry mucosa on examination. <b>Offer vaginal oestrogen</b> (minimal systemic absorption) \u2014 under-recognised because women rarely volunteer vaginal symptoms"],
         ["<b>P</b>","Pharmacological","<b>Diuretics</b> (urgency), <b>ACE inhibitors</b> (cough \u2192 repeated Valsalva \u2192 stress leak; <b>switch to an ARB</b>), antipsychotics and opioids (retention \u2192 overflow), sedatives, \u03b1-blockers, calcium-channel blockers. <b>Review the medication list every time</b>"],
         ["<b>P</b>","Psychological","Anxiety, depression, severe mental illness \u2014 consider when a functional aetiology dominates the history"],
         ["<b>E</b>","Endocrine / excess urine output","Diabetes mellitus (polyuria, recurrent UTI), diabetes insipidus (high volumes), heart failure, hypercalcaemia. <b>Check HbA1c in new presentations</b>"],
         ["<b>R</b>","Restricted mobility","Cannot reach the toilet in time \u2192 functional incontinence. Physiotherapy, walking aids, a commode near the bed"],
         ["<b>S</b>","Stool impaction","Faecal loading causes detrusor instability and urgency. History of constipation, PR examination. <b>Treat the constipation first</b>"]
       ]},
       {b:"why", html:"NG123 is explicit that reversible causes come first. UTI is the commonest and will not respond to pelvic-floor exercises; atrophic vaginitis is only found on examination; ACE-inhibitor cough drives genuine stress leakage and resolves on switching to an ARB. These are the classic examination traps and the classic real-life ones."}
     ]},

    {id:"exam", nav:"Examination", title:"Targeted examination \u2014 what changes the plan", sub:"Purposeful, not comprehensive. A chaperone is always required for pelvic examination.",
     blocks:[
       {b:"table", head:["Examination","Looking for","Threshold / action"], rows:[
         ["Abdominal","Distended bladder (palpable, percussion dullness), pelvic masses","<b>Palpable bladder \u2192 residual and urgent referral</b>; mass \u2192 gynaecology suspected cancer pathway referral"],
         ["<b>BMI</b>","Obesity \u2014 <b>BMI &gt;30</b> is an independent risk factor for stress UI","<b>BMI 30 kg/m\u00b2 or more \u2192 offer or refer for weight-management support</b>; even modest weight loss can improve incontinence. Do not delay PFMT while waiting for weight loss"],
         ["Vaginal / perineal","Atrophy (pale, thin, dry mucosa); <b>pelvic organ prolapse</b> \u2014 ask her to cough or strain and look for cystocele, rectocele or vault prolapse; exclude fistula (constant leakage)","Refer visible or symptomatic prolapse, particularly when it reaches or extends beyond the vaginal introitus, or when there are voiding symptoms, recurrent UTI, pain, ulceration or diagnostic uncertainty (POP-Q documentation is done in specialist care)"],
         ["<b>Cough stress test</b>","Immediate leakage at the urethral meatus on coughing with a full bladder, standing if possible","Immediate leak supports stress UI; delayed leakage suggests urgency UI"],
         ["Neurological screen","<b>Perianal sensation (S2\u2013S4)</b>, anal tone on PR if indicated, lower-limb reflexes","Absent ankle jerks \u2192 peripheral neuropathy \u2192 overflow risk. Upper motor neurone signs \u2192 neurology. Screens for cord compression, MS and diabetic autonomic neuropathy"],
         ["Pelvic-floor assessment","Contraction strength on the <b>modified Oxford scale (0\u20135)</b> if trained \u2014 0 = no contraction, 5 = strong contraction against resistance","Guides PFMT intensity; if she cannot contract, specialist PFMT with biofeedback or electrical stimulation"],
         ["<b>Post-void residual</b>","Bladder scan after voiding, or ultrasound if no scanner","Measure where voiding dysfunction, recurrent UTI, neurological disease, previous pelvic surgery/radiotherapy, significant prolapse or suspected retention is present. Interpret the result in clinical context and repeat if necessary. Refer if there is persistent significant residual, voiding dysfunction, recurrent symptomatic UTI, renal impairment or diagnostic uncertainty, and withhold antimuscarinics. NICE sets no universal PVR cut-off for women \u2014 a 150 mL threshold used in some referral pathways is a local operational threshold only"]
       ]}
     ]},

    {id:"workup", nav:"Work-up", title:"Investigations \u2014 and the ones not to order", sub:"Most incontinence is managed in primary care without extensive investigation. Investigate only where it changes management.",
     blocks:[
       {b:"table", head:["Test","When","Why"], rows:[
         ["<b>Urine dipstick (urinalysis)</b>","<b>Urinalysis in every patient \u2014 mandatory</b>","Interpret with symptoms \u2014 send an MSU when UTI symptoms are present, results are equivocal, infection is recurrent or complicated, or treatment has failed; <b>blood \u2192 haematuria pathway regardless of other findings</b>; glucose \u2192 diabetes screen; protein \u2192 renal disease"],

         ["<b>3-day bladder diary</b>","All \u2014 request at the first visit","Diagnosis, behavioural-therapy targets and objective monitoring"],
         ["HbA1c","Polyuria, polydipsia, recurrent infections, or diabetes risk factors","Uncontrolled diabetes causes an osmotic diuresis that mimics OAB"],
         ["U&amp;E / renal function","Recurrent UTI, suspected retention, hypertension, or before an antimuscarinic in an older woman","Renal impairment alters drug clearance"],
         ["Post-void residual (bladder scan)","Voiding dysfunction, recurrent UTI, neurological disease, previous pelvic surgery/radiotherapy, significant prolapse or suspected retention","Interpret in clinical context and repeat if necessary; <b>persistent significant residual, voiding dysfunction, recurrent symptomatic UTI, renal impairment or diagnostic uncertainty \u2192 refer urology or urogynaecology</b>. No universal NICE cut-off; any 150 mL threshold is local"],
         ["Urodynamics (cystometry, uroflowmetry)","<span class='src'>Specialist only</span> Diagnosis unclear after history and examination, failed primary-care treatment, before surgery, or suspected voiding dysfunction","<b>Not routine in primary care</b> \u2014 it adds cost and delay without changing initial management"],
         ["<b>Do NOT routinely order</b>","Cystoscopy, urodynamics, renal ultrasound","Specialist investigations; uncomplicated stress or urgency UI does not need them to be managed well"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"purple", h:"NG12 in this presentation", html:"The cancer link in female incontinence is <b>haematuria</b>, plus the pelvic mass, ovarian-symptom (CA125) and post-menopausal bleeding routes. Visible haematuria aged \u226545 without UTI (or persisting/recurring after UTI treatment) \u2192 bladder and renal suspected cancer pathway referral. Non-visible haematuria aged \u226560 with dysuria or a raised WCC \u2192 bladder suspected cancer pathway referral. Recurrent or persistent unexplained UTI aged \u226560 \u2192 consider non-urgent bladder-cancer referral. Persistent or frequent (particularly more than 12 times a month) urgency or frequency with bloating, early satiety, loss of appetite or pelvic/abdominal pain aged \u226540 \u2192 CA125 against the age-specific threshold; aged \u226439, consider urgent direct-access ultrasound rather than CA125 alone. No CA125 for isolated urgency with a clear diagnosis and no other concerning features. Unexplained post-menopausal bleeding not attributable to HRT aged \u226555 \u2192 suspected cancer pathway.", src:"NICE NG12 (updated April 2026)"},
         {tone:"cream", h:"Where the sources differ \u2014 read this once", html:"Older guidance said <b>haematuria at any age \u2192 2WW</b> and quoted <b>2WW for visible or non-visible haematuria in women aged 60 and over</b>. <b>NG12 is the rule</b> and its thresholds are the ones above. The pathway\u2019s lower threshold is kept here as a safety-first stance rather than a referral criterion: <b>visible haematuria at any age always needs explanation</b> \u2014 under 45 that means urology or nephrology assessment, not the suspected cancer pathway, and not watchful waiting."}
       ]}
     ]},

    {id:"conservative", nav:"Conservative", title:"Type-led conservative therapy \u2014 always first-line", sub:"Lifestyle and behavioural therapy are core treatment, not an afterthought. Treat mixed incontinence according to the predominant symptom.",
     blocks:[
       {b:"table", head:["Intervention","For","Detail and target"], rows:[
         ["<b>Supervised PFMT</b>","Stress / mixed","Begin with an assessment of her ability to contract and relax the pelvic floor. <b>At least 8 contractions 3 times daily for at least 3 months</b>, tailored to ability \u2014 first-line. Refer to a continence nurse or physiotherapist: <b>supervised assessment and training are preferred where available</b>, particularly when technique, adherence or ability to contract is uncertain. Consider <b>electrical stimulation or biofeedback if she cannot actively contract</b>; NICE does not recommend routine perineometry or electromyography as biofeedback. Teach <b>the Knack</b> \u2014 contract the pelvic floor before coughing or sneezing. The <b>Squeezy</b> NHS app aids adherence"],
         ["<b>Bladder training</b>","Urgency / OAB","<b>Minimum 6 weeks.</b> For urgency or mixed incontinence. Scheduled voiding, gradually lengthening the interval between voids, with urge-suppression techniques (distraction, perineal pressure). Support it with a written retraining programme"],
         ["<b>Weight loss</b>","BMI \u226530","Offer or refer for weight-management support. Even modest weight loss can improve urinary incontinence, particularly stress incontinence (PRIDE; NICE NG210). Do not delay PFMT or other appropriate treatment while waiting for weight loss"],
         ["<b>Caffeine reduction</b>","Urgency","Ask about total caffeine intake and offer a trial of caffeine reduction; reduce excessive caffeine (switching to decaffeinated) and quantify intake from the diary. NICE sets no fixed daily target"],
         ["Fluid management","All","Ask about total fluid intake and modify it where intake is excessive or insufficient. <b>Avoid over-restricting fluids, particularly in older or frail women.</b> Tailor evening intake to nocturia and individual circumstances"],
         ["Smoking cessation","All, especially stress UI","Chronic cough worsens stress leakage, and smoking is a bladder-cancer risk factor. NHS Stop Smoking Service, NRT or varenicline"],
         ["Cough and constipation","All","Treat chronic cough (including <b>ACE-inhibitor cough \u2014 switch to an ARB</b>) and constipation: fibre, hydration, a regular toilet routine, lactulose or macrogol if needed. Straining worsens pelvic-floor dysfunction and faecal loading directly causes detrusor instability"],
         ["Vaginal pessary","Prolapse-associated stress UI","A ring, incontinence or shelf pessary supports the bladder neck \u2014 useful where prolapse coexists or surgery is declined or unsuitable. Fitted by a continence nurse specialist, gynaecology, or a GP with extended training"],
         ["Containment products","Interim or refractory","Pads, pants and sheath systems (for example Tena, Kylie, Conveen ranges, prescribable on FP10) with skin care. NICE NG123 recommends these as an interim measure and an adjunct \u2014 never a substitute for treatment \u2014 but they preserve dignity while treatment works, or long-term when other options are exhausted. Refer to the continence service for product assessment"],
         ["Psychological support","All","Incontinence has real effects on mood, sexual function and social isolation. Screen with <b>PHQ-9 / GAD-7</b>; CBT or mindfulness for OAB-related anxiety; signpost <b>Bladder &amp; Bowel UK</b>"]
       ]},
       {b:"why", html:"<b>PFMT:</b> Cochrane 2018 (Dumoulin) found PFMT far more effective than no treatment for cure of stress UI (RR 8.38), and 3 months is the minimum needed to see benefit \u2014 supervised programmes outperform unsupervised advice (RR 0.87 for cure or improvement). <b>PRIDE (NEJM 2009):</b> an intensive weight-loss programme reduced incontinence episodes compared with controls. <b>Caffeine:</b> caffeine reduction reduced urgency episodes (Bryant 2002). <b>The Knack</b> reduces stress leakage with a deep cough by about 73% (Miller 1998). Lifestyle change is not \u201ctry this instead of treatment\u201d \u2014 it is the treatment."}
     ]},

    {id:"ladder", nav:"Drugs", title:"The drug ladder \u2014 OAB, atrophy, and the honest truth about stress UI", sub:"Offer lifestyle and behavioural therapy alongside every drug. Doses are for orientation \u2014 verify against the current SPC, BNF and the Greater Manchester (GMMMG) formulary.",
     blocks:[
       {b:"warn", html:"<b>No effective first-line drug exists for stress urinary incontinence</b> \u2014 conservative therapy and then surgery are the mainstays. <b>Antimuscarinics are contraindicated in overflow or retention</b>, and long-term cognitive effects of bladder antimuscarinics remain uncertain. Minimise cumulative anticholinergic burden, particularly in frail or cognitively impaired women, and use the lowest effective dose for the shortest necessary duration."},
       {b:"ladder", steps:[
         {step:"OAB 1st", title:"Antimuscarinic", when:"urgency UI after 6 weeks of bladder training",
          splits:[
            {cond:"Choice", drug:"Antimuscarinic by local formulary (lowest acquisition cost)", note:"Offer after bladder training if symptoms remain troublesome, selecting according to local formulary, comorbidity, anticholinergic burden, interactions, tolerability and patient preference; if ineffective or poorly tolerated, try another. Options include solifenacin, tolterodine, darifenacin and trospium \u2014 their cognitive and pharmacokinetic considerations differ, but none is proven cognitively safer for long-term use. <b>Review at 4 weeks</b>"},
            {cond:"Alternatives", drug:"Dose per current SPC / local formulary", note:"Similar efficacy. Counsel dry mouth, constipation, blurred vision, urinary retention"},
            {cond:"Avoid", drug:"Oxybutynin \u2014 avoid in frail or older women", note:"High CNS penetration \u2192 confusion, cognitive impairment, falls; NICE NG123: do not offer immediate-release oxybutynin to older women who may be at higher risk of a sudden deterioration in their physical or mental health. If used at all: immediate release 2.5\u20135 mg TDS"}
          ]},
         {step:"OAB 2nd", title:"Mirabegron", when:"antimuscarinic unsuitable, not tolerated or ineffective", fromLabel:"frail, cognitive concern, or high anticholinergic load",
          splits:[
            {cond:"When", drug:"Mirabegron (beta-3 agonist)", note:"Consider when antimuscarinics are unsuitable, ineffective or poorly tolerated, particularly where anticholinergic burden is a major concern. Dose and any reduction in renal or hepatic impairment or with interacting medicines per the current SPC/local formulary"},
            {cond:"Caution", drug:"Check BP before treatment and monitor regularly", note:"<b>Contraindicated in severe uncontrolled hypertension (systolic 180 mmHg or more and/or diastolic 110 mmHg or more)</b>"},
            {cond:"Also", drug:"Vibegron", note:"A beta-3 agonist option where appropriate (NICE TA999)"}
          ]},
         {step:"OAB 3rd", title:"Combination \u2014 mirabegron plus an antimuscarinic", when:"monotherapy inadequate", fromLabel:"specialist-initiated",
          html:"Specialist-initiated. Increased risk of urinary retention \u2014 check the post-void residual."},
         {step:"Atrophy", title:"Topical vaginal oestrogen", when:"post-menopausal with vaginal atrophy", fromLabel:"treat alongside, at any rung",
          html:"Estradiol 10 microgram pessary (Vagifem / Vagirux) daily for 2 weeks then twice weekly, or estriol cream (Ovestin) 0.5 mg daily for 2\u20133 weeks then twice weekly. Verify against the SPC/local formulary. Offer it for genitourinary symptoms of menopause, including in women using systemic HRT; it may be continued for as long as needed, with regular review \u2014 systemic absorption is minimal and <b>no progestogen is needed with low-dose vaginal oestrogen</b>. Review unscheduled vaginal bleeding promptly. Consider non-hormonal moisturisers or lubricants where preferred or where oestrogen is contraindicated, and involve menopause/breast oncology specialists in women with breast cancer, especially those on aromatase inhibitors. <b>Systemic HRT is prescribed for menopausal symptoms, not as a treatment for urinary incontinence</b> \u2014 NG23 evidence identifies incontinence as a possible adverse outcome (combined HRT if she has an intact uterus)."},
         {step:"Stress UI", title:"Duloxetine \u2014 not routinely second-line", when:"prefers drug treatment, or surgery declined or unsuitable", fromLabel:"NOT first-line",
          html:"Do not offer routinely as second-line treatment; it may be offered where she prefers pharmacological treatment or is unsuitable for surgery. Verify current dosing against the SPC/local formulary. Counsel about nausea, dizziness, dry mouth, constipation, insomnia, hypertension and discontinuation symptoms; assess contraindications and interactions; and taper when stopping."},
         {step:"3rd-line", title:"Specialist procedures", when:"refractory OAB or stress UI", fromLabel:"after an adequate trial of two drug classes",
          html:"<b>Intravesical botulinum toxin A (onabotulinumtoxinA, initially 100 units for idiopathic OAB)</b> after local MDT review \u2014 she must understand possible UTI, voiding dysfunction, <b>possible temporary or ongoing catheterisation</b>, uncertain duration of benefit and the need for specialist follow-up (within 12 weeks after the first treatment; 200 units may be considered in selected situations). <b>Sacral neuromodulation</b> or <b>percutaneous tibial nerve stimulation (PTNS)</b>. For stress UI: colposuspension, autologous or mid-urethral sling (TVT/TOT), or bulking agents. If a retropubic mid-urethral mesh sling is considered, explain that it is a permanent implant and complete removal may not be possible; follow current NICE NG123 mesh recommendations and local urogynaecology governance. Top-down retropubic and single-incision short mesh sling procedures should not be used outside clinical-trial arrangements."}
       ]},
       {b:"why", html:"<b>Antimuscarinics:</b> a modest effect that has to be weighed against anticholinergic harm. The <b>MHRA public assessment report (July 2026)</b> found the evidence not sufficient to confirm that bladder anticholinergics directly cause dementia, but could not rule out a small increased risk, and advises the lowest dose for the shortest time in older people; beta-3 agonists avoid the anticholinergic load. <b>Botulinum toxin A</b> is a specialist option for drug-refractory urgency UI after MDT review, with uncertain duration of benefit."}
     ]},

    {id:"groups", nav:"Special groups", title:"Populations that change the plan", sub:"Same diagnosis, different first move.",
     blocks:[
       {b:"table", head:["Group","What changes"], rows:[
         ["<b>Pregnancy and postnatal</b>","<b>Antenatal and postnatal PFMT both prevents and treats</b> \u2014 first-line; avoid drugs. Most postnatal stress UI improves \u2014 review at 3 months and refer if it persists"],
         ["<b>Post-menopausal</b>","<b>Vaginal atrophy is a common and treatable driver</b> \u2192 topical oestrogen. <b>Systemic HRT is for menopausal symptoms, not a treatment for incontinence</b> (incontinence is a possible adverse outcome). Ask about post-menopausal bleeding (NICE NG12 (updated April 2026): unexplained and not attributable to HRT, aged 55 and over \u2192 suspected cancer pathway)"],
         ["<b>Frail or older women</b>","<b>Minimise cumulative anticholinergic burden</b> (falls, confusion; long-term cognitive effects uncertain) \u2014 consider mirabegron or vibegron where antimuscarinics are unsuitable, ineffective or poorly tolerated, or anticholinergic burden is a major concern. Treat constipation and mobility, consider timed toileting and containment, and check renal function before an antimuscarinic"],
         ["<b>Cognitive impairment</b>","Prompted or timed voiding with carer support; <b>antimuscarinics may worsen cognition</b> \u2014 review cognition clinically (a validated instrument only if impairment is suspected and the result will affect management) and stop the drug if cognition declines"],
         ["<b>Neurological disease (MS, stroke, spinal)</b>","Assume complex \u2014 <b>higher retention risk, so check the residual before any antimuscarinic</b>; specialist or neuro-urology input"],
         ["<b>Obesity</b>","<b>Weight loss is a genuine treatment</b> \u2014 BMI 30 or more: offer or refer for weight-management support; even modest weight loss can improve stress UI. Do not delay PFMT while waiting for weight loss"],
         ["<b>Previous pelvic surgery or radiotherapy</b>","Higher risk of fistula, voiding dysfunction and overflow \u2192 residual measurement and urogynaecology referral rather than empirical drugs"]
       ]}
     ]},

    {id:"monitor", nav:"Review", title:"The review rhythm \u2014 and what each review is for", sub:"Structured follow-up is what makes conservative therapy work; most failures are technique and adherence, not the wrong diagnosis.",
     blocks:[
       {b:"table", head:["When","What to check","Action"], rows:[
         ["<b>4\u20136 weeks</b>","Bladder diary completed? PFMT adherence <b>and technique</b>; drug tolerability; <b>repeat ICIQ-SF and document the change from baseline</b>; MSU result","Correct technique (many bear down instead of lifting); reinforce lifestyle; adjust or switch the drug"],
         ["<b>OAB drug at 4 weeks</b>","Face-to-face or telephone review. Effect versus side effects: dry mouth, constipation, blurred vision, retention symptoms, and <b>cognition in older women (validated instrument only if concerned)</b>","If response is suboptimal or adverse effects occur, change the dose or treatment and review again after a further 4 weeks; <b>stop if cognitive decline is suspected</b>"],
         ["<b>Mirabegron</b>","<b>BP before starting and regularly during treatment</b>; retention symptoms if combined with an antimuscarinic","Stop if BP is uncontrolled (contraindicated in severe uncontrolled hypertension: systolic 180 mmHg or more and/or diastolic 110 mmHg or more); check residual if retention is suspected"],
         ["<b>3 months</b>","Full response assessment, repeat ICIQ-SF","Inadequate improvement in stress UI \u2192 physiotherapist-supervised PFMT or urogynaecology. Inadequate improvement in urgency UI on bladder training \u2192 add an antimuscarinic (then a beta-3 agonist if unsuitable). Repeat the bladder diary only when it will change management"],
         ["Topical oestrogen","Response at 3 months","May be continued for as long as needed, with regular review of continuing need; review unscheduled vaginal bleeding promptly"],
         ["Anticholinergic burden","Every review in older women","Reduce cumulative load; consider a beta-3 agonist where burden is a major concern"],
         ["<b>Long-term OAB medicine</b>","<b>Annually, or 6-monthly if aged over 75</b>","Review cognitive effects and anticholinergic burden, constipation and dry mouth, BP for mirabegron, retention symptoms and PVR where clinically indicated, falls and frailty, ongoing benefit, and whether continued drug treatment remains aligned with her goals"],
         ["<b>6\u201312 months</b>","Sustained benefit","Consider stepping down if much improved; reassess if symptoms recur. Warn that symptoms can return after the menopause, with weight gain, or with a new medicine"],
         ["Records / QOF","Incontinence is <b>not currently a QOF indicator</b>","Document diagnosis, <b>type, ICIQ-UI-SF score (not as a NICE severity band), treatment offered and review date</b>; review opportunistically at diabetes, hypertension and menopause reviews"]
       ]},
       {b:"cards", items:[
         {tone:"amber", h:"Not improving? Check these before calling it refractory", html:"<b>1 \u00b7 Right type treated?</b> Did the treatment match the dominant type. <b>2 \u00b7 Adherence and technique</b> \u2014 PFMT done correctly and supervised; bladder training sustained for 6 weeks. <b>3 \u00b7 Reversibles</b> \u2014 UTI, atrophy, constipation, diuretics, glucose all addressed. <b>4 \u00b7 Drug trial</b> \u2014 an adequate trial and a switch tried. <b>5 \u00b7 Overflow?</b> Incomplete emptying or dribbling \u2192 check the residual; antimuscarinics make it worse. <b>6 \u00b7 Then refer</b> \u2014 urogynaecology or the continence service."}
       ]},
       {b:"tiles", v:"safety", items:[
         {t:"\ud83d\udd34 999", html:"\u201cNew weakness in both legs, numbness around the saddle area, or severe perineal pain, with new bladder or bowel problems \u2014 that is a 999 problem, not one to wait on.\u201d"},
         {t:"\u26a0\ufe0f Same-day", html:"\u201cIf you cannot pass urine and have suprapubic pain, or you see fresh blood in the urine and are not already being investigated \u2014 contact us the same day.\u201d"},
         {t:"\ud83e\ude78 Any blood", html:"\u201cBlood in the urine \u2014 always tell us. It needs investigating even if it settles, and even if you have had it before.\u201d"},
         {t:"\ud83d\udca7 Overflow", html:"\u201cConstant dribbling with a feeling that you never empty \u2014 let us know; the bladder may not be emptying properly.\u201d"},
         {t:"\ud83e\uddda Infections and pain", html:"\u201cRepeated infections, new pelvic pain, or any bleeding after the menopause \u2014 get assessed rather than treated over the phone.\u201d"},
         {t:"\ud83e\udde0 Bladder-tablet effects", html:"\u201cConfusion, constipation or a very dry mouth on the bladder tablet \u2014 tell us and we will switch it.\u201d"},
         {t:"\ud83d\udcc5 No better at 3 months", html:"\u201cIf the exercises or bladder training have not helped after three proper months, come back \u2014 that is the point at which we change the plan.\u201d"}
       ]},
       {b:"say", html:"Incontinence is common and very treatable \u2014 and the right approach depends on which type you have, which is why the diary matters. The exercises or bladder training help most women, but they take a few months to work, so stick with them; if we don\u2019t get you there, the continence specialists have effective options."}
     ]},

    {id:"refer", nav:"Refer", title:"Refer \u2014 who goes where, and what secondary care offers", sub:"Most female incontinence is managed entirely in primary care. Knowing when not to refer matters as much as knowing when to.",
     blocks:[
       {b:"cards", items:[
         {tone:"purple", h:"Suspected cancer \u00b7 NICE NG12 (updated April 2026)", html:"<b>Bladder and renal:</b> unexplained visible haematuria aged 45 and over without UTI, or persisting or recurring after successful UTI treatment; non-visible haematuria aged 60 and over with dysuria or a raised white cell count. <b>Ovarian:</b> ascites or a pelvic or abdominal mass not obviously fibroids \u2192 suspected cancer pathway; persistent or frequent symptoms (particularly more than 12 times a month, including increased urinary urgency or frequency with bloating, early satiety, loss of appetite or pelvic/abdominal pain; especially aged 50 and over) aged 40 and over \u2192 CA125, with urgent direct-access ultrasound if 35 IU/mL or more at 40\u201349, 31 or more at 50\u201359, 24 or more at 60\u201369, 25 or more at 70\u201379, or 31 or more at 80 and over; aged 39 and under, do not use CA125 alone \u2014 consider urgent direct-access ultrasound. No CA125 for isolated urgency with a clear diagnosis. <b>Endometrial:</b> unexplained post-menopausal bleeding that cannot be attributed to HRT aged 55 and over \u2192 suspected cancer pathway; under 55, consider.", src:"NICE NG12 (updated April 2026)"}
       ]},
       {b:"table", head:["Route","Trigger"], rows:[
         ["<span class='mg-pill mg-pill-red'>999 / same-day</span>","<b>Acute urinary retention</b> (unable to void, suprapubic pain, distended bladder). New neurological symptoms with incontinence \u2014 suspected cauda equina. Suspected sepsis from a urinary source"],
         ["<span class='tw'>Suspected cancer: urology</span>","<b>NICE NG12:</b> unexplained <b>visible haematuria aged 45 and over</b> without UTI, or visible haematuria persisting or recurring after successful UTI treatment; non-visible haematuria aged 60 and over with dysuria or a raised white cell count. Suspected bladder or urethral malignancy"],
         ["<span class='tw'>Suspected cancer: gynaecology</span>","<b>NICE NG12 (updated April 2026):</b> a <b>pelvic or abdominal mass</b> not obviously fibroids (with or without ascites); <b>unexplained post-menopausal bleeding aged 55 and over that cannot be attributed to HRT</b>; ovarian symptoms aged 40 and over with CA125 at or above the age threshold \u2192 <b>urgent direct-access ultrasound</b>"],
         ["Non-urgent cancer referral","NG12: recurrent or persistent unexplained UTI aged 60 and over \u2192 consider non-urgent direct referral for bladder cancer. Also consider urology for \u22653 UTIs in 12 months with no clear cause"],
         ["Urogynaecology (stress UI)","<b>Refractory after at least 3 months of supervised PFMT</b> \u2192 surgical options. Diagnostic complexity needing urodynamics. <b>Visible or symptomatic prolapse</b>, particularly at or beyond the vaginal introitus, or with voiding symptoms, recurrent UTI, pain, ulceration or diagnostic uncertainty. Considering surgery. Previous continence surgery, or pelvic cancer surgery or radiotherapy"],
         ["Specialist continence service (OAB)","Refractory after bladder training plus an adequate trial of \u22652 drugs. Also for supervised PFMT before drug treatment, and for containment product assessment"],
         ["Urology (non-cancer)","Recurrent UTI with no clear cause; <b>suspected vesico-vaginal fistula</b> (constant wetness, no urge); <b>persistent significant residual or voiding difficulty</b> (interpreted in clinical context; no universal NICE PVR cut-off); palpable bladder after voiding; persistent bladder or urethral pain"],
         ["Complex / neurological","Suspected neurological disease or neurogenic bladder, suspected fistula, previous failed continence surgery, associated faecal incontinence, significant residual \u2192 specialist assessment, with <b>urodynamics</b> where indicated"],
         ["<b>Keep in primary care</b>","Uncomplicated stress UI with a normal examination; urgency UI with no haematuria or mass; mixed UI \u2014 treat the dominant component; <b>mild symptoms with little bother</b> \u2014 conservative therapy first"]
       ]},
       {b:"table", head:["Secondary-care option","For","Note"], rows:[
         ["Urodynamics","Diagnostic uncertainty or pre-surgery","Confirms the type before invasive treatment"],
         ["Colposuspension / autologous sling","Stress UI","Non-mesh surgical options"],
         ["Retropubic mid-urethral mesh sling","Stress UI","A permanent implant and complete removal may not be possible \u2014 follow current NICE NG123 mesh recommendations and local urogynaecology governance. Top-down retropubic and single-incision short mesh slings not outside clinical-trial arrangements"],
         ["Bulking agents","Stress UI","Less effective but less invasive; day-case"],
         ["Botulinum toxin A (detrusor)","Refractory OAB","After local MDT review; initially onabotulinumtoxinA 100 units. Counsel UTI, voiding dysfunction, possible temporary or ongoing catheterisation, uncertain duration of benefit; specialist follow-up within 12 weeks of the first treatment"],
         ["Sacral neuromodulation / PTNS","Refractory OAB","For drug-refractory urgency UI"]
       ]},
       {b:"say", html:"You\u2019ve given the exercises and the tablets a fair go \u2014 the continence specialists can offer the next options, from bladder Botox injections to supportive surgery, and they\u2019ll do detailed bladder-pressure tests first to pick the right one for you."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only \u2014 the Casebook keeps the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 58-year-old woman, three years post-menopausal, asks for \u201csomething for my waterworks\u201d. She leaks when she coughs but also rushes to the toilet, has had two courses of antibiotics for cystitis this year, takes ramipril and has a troublesome dry cough, and mentions in passing that she saw blood in the urine once last month. She has stopped going to her exercise class."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Separates <b>stress from urgency and names the dominant component</b>; asks about pad use and impact rather than only frequency; acts on the single episode of visible haematuria \u2014 NG12 urology suspected cancer pathway referral aged 45 and over, and does not let the UTI history explain it away; identifies the <b>ACE-inhibitor cough</b> and offers an ARB switch; examines with a chaperone for <b>atrophy and prolapse</b> and offers <b>topical oestrogen</b>; sets up <b>supervised PFMT for 3 months plus a bladder diary and ICIQ-SF</b> rather than reaching for an antimuscarinic; and safety-nets blood in the urine explicitly. <a href='../../cases/urinary-incontinence.html'>Open the full casebook chapter \u2192</a>"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>NICE NG123 \u2014 Urinary incontinence and pelvic organ prolapse in women: management (2019, updated 2023)<br><a href="https://www.nice.org.uk/guidance/ng123" rel="noopener">nice.org.uk/guidance/ng123</a><span class="rd"> \u2014 type classification, the bladder diary, supervised PFMT for at least 3 months, bladder training for at least 6 weeks, PVR in voiding dysfunction or recurrent UTI (no universal cut-off), dipstick and MSU rules, the OAB drug sequence (lowest-cost antimuscarinic first, beta-3 agonist if unsuitable), 4-week and annual (6-monthly over 75) reviews, duloxetine not routinely second-line, prolapse at or below the introitus, botulinum toxin A and mesh recommendations, and referral thresholds; advises against routine urodynamics in primary care</span></li>'+
         '<li><b>NICE NG12 \u2014 Suspected cancer: recognition and referral (updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> \u2014 bladder and renal cancer: visible haematuria aged 45 and over without UTI, or persisting/recurring after UTI treatment \u2192 suspected cancer pathway referral; non-visible haematuria aged 60 and over with dysuria or raised WCC \u2192 referral; recurrent or persistent unexplained UTI aged 60 and over \u2192 consider non-urgent referral. Ovarian (amended April 2026): ascites or a pelvic/abdominal mass \u2192 suspected cancer pathway; persistent symptoms aged 40 and over \u2192 CA125 with age-specific thresholds (35/31/24/25/31 IU/mL by decade from 40\u201349 to 80+) for urgent direct-access ultrasound, and CA125 not used alone at 39 and under. Endometrial (amended April 2026): unexplained post-menopausal bleeding that cannot be attributed to HRT \u2192 refer aged 55 and over, consider under 55</span></li>'+
         '<li><b>NICE NG23 \u2014 Menopause: identification and management (2015, updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng23" rel="noopener">nice.org.uk/guidance/ng23</a><span class="rd"> \u2014 vaginal oestrogen for genitourinary symptoms of menopause, continued as long as needed with regular review and without added progestogen; systemic HRT for menopausal symptoms (urinary incontinence a possible adverse outcome)</span></li>'+
         '<li><b>MHRA \u2014 Bladder anticholinergics: review of risk of dementia, public assessment report (27 July 2026)</b><br><a href="https://www.gov.uk/government/publications/bladder-anticholinergics-review-of-risk-of-dementia" rel="noopener">gov.uk \u2014 bladder anticholinergics and dementia</a><span class="rd"> \u2014 evidence not sufficient to confirm a direct causal link, a small increased risk not ruled out; limit anticholinergic medicines in older people to the lowest dose for the shortest time</span></li>'+
         '<li>Cochrane 2018 \u2014 Dumoulin et al., pelvic floor muscle training for urinary incontinence in women<span class="rd"> \u2014 PFMT versus no treatment for cure of stress UI (RR 8.38); supervised versus unsupervised programmes (RR 0.87 for cure or improvement)</span></li>'+
         '<li><b>PRIDE trial \u2014 NEJM 2009</b><span class="rd"> \u2014 weight loss reduced incontinence episodes; the size of effect depends on the population, degree of weight loss and outcome used</span></li>'+
         '<li><b>NICE NG210 \u2014 Pelvic floor dysfunction: prevention and non-surgical management</b><br><a href="https://www.nice.org.uk/guidance/ng210" rel="noopener">nice.org.uk/guidance/ng210</a><span class="rd"> \u2014 weight loss can help pelvic-floor dysfunction; women should not be asked to lose weight before other appropriate treatment is offered</span></li>'+
         '<li><b>Bryant 2002 (caffeine reduction); Miller, Ashton-Miller and DeLancey, J Am Geriatr Soc 1998 (the Knack)</b><span class="rd"> \u2014 caffeine reduction reduced urgency episodes; a pre-cough pelvic-floor contraction reduced stress leakage by about 73%</span></li>'+
         '<li>NICE NG123 \u2014 urinary incontinence and pelvic organ prolapse in women<span class="rd"> \u2014 retropubic mid-urethral mesh sling as a permanent implant with possibly incomplete removal; top-down retropubic and single-incision short slings only within clinical trials; primary-care operationalisation and Squeezy app support</span></li>'+
         '<li><b>MHRA Drug Safety Update \u2014 Mirabegron (Betmiga): risk of severe hypertension</b><br><a href="https://www.gov.uk/drug-safety-update/mirabegron-betmiga-risk-of-severe-hypertension-and-associated-cerebrovascular-and-cardiac-events" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> \u2014 contraindicated in severe uncontrolled hypertension (systolic 180 mmHg or more and/or diastolic 110 mmHg or more); measure BP before treatment and monitor regularly</span></li>'+
         '<li><b>NICE TA999 \u2014 Vibegron for treating symptoms of overactive bladder</b><br><a href="https://www.nice.org.uk/guidance/ta999" rel="noopener">nice.org.uk/guidance/ta999</a><span class="rd"> \u2014 vibegron as an OAB option where appropriate</span></li>'+

  foot:"Female urinary incontinence \u2014 NICE NG123 (2019, updated 2023), NICE NG12 (updated April 2026), NICE NG23, MHRA bladder anticholinergics review (July 2026), MHRA mirabegron advice, NICE NG210, NICE TA999, Cochrane 2018 (Dumoulin) and the PRIDE trial. No universal PVR cut-off; a dipstick alone does not diagnose UTI. Assessment and management are merged on this page; there is no separate female incontinence pathway to cross-check. A chaperone is required for pelvic examination. Verify all doses against the current BNF before prescribing."
