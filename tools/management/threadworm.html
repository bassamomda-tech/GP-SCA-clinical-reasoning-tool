MG.render({
  icon:"🪱",
  title:"Threadworm — the complete guide",
  eyebrow:"Protocol · children and adults · enterobiasis",
  stemTitle:"Threadworm is a clinical diagnosis — treat the affected person and appropriate household contacts together, repeat at 2 weeks, and pair every dose with practical hygiene",
  stemSub:"Nocturnal perianal itch is typical and the diagnosis is usually clinical. <b>Mebendazole 100 mg as a single dose</b> for affected people and appropriate household contacts aged 6 months and over, <b>repeated once after 2 weeks</b> in line with the Greater Manchester pathway. Under 2 years it is off-label and needs an individual risk–benefit decision. Infants under 6 months: hygiene alone for 6 weeks. In pregnancy start with hygiene and seek individual medicines advice if symptoms are severe or persistent; check current advice for breastfeeding. Mebendazole is widely available over the counter — prescribing and NHS funding follow local policy.",
  guideline:"Greater Manchester antimicrobial guidelines (v16, 2024) · UK eosinophilia and parasitic infection guideline (BIA, 2024) · BNF",
  reviewed:"25 September 2026",
  nextReview:"25 September 2027",
  meta:[
    {t:"Treat appropriate household contacts together", tone:"ok"},
    {t:"Repeat dose at 2 weeks", tone:"ok"},
    {t:"v2.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#diagnose"><b>Diagnose</b><small>Clinical</small></a><a href="#treat"><b>Treat</b><small>Who · dose</small></a><a href="#hygiene"><b>Hygiene</b><small>2 or 6 weeks</small></a><a href="#recur"><b>Recurring?</b><small>Re-check</small></a><a href="#refer"><b>Refer</b><small>Rarely</small></a></div>',
  quickSub:"The five that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"blue", h:"A clinical diagnosis", html:"Perianal (and in girls vulval) itch, worse at night, sometimes with visible thread-like worms. If uncertain, an <b>early-morning adhesive-tape test</b> before washing or opening the bowels can help; stool testing is usually not useful. Look for excoriation, dermatitis or secondary infection."},
    {tone:"green", h:"Mebendazole 100 mg, then repeat at 2 weeks", html:"A single <span class='rx'>mebendazole 100 mg</span> dose for affected people and appropriate household contacts aged 6 months and over, <b>repeated once after 2 weeks</b> for those who took the first dose — mebendazole does not reliably kill eggs."},
    {tone:"amber", h:"Age and pregnancy: check before every dose", html:"<b>Under 2 years:</b> off-label — individual risk–benefit decision. <b>Under 6 months:</b> hygiene alone for 6 weeks. <b>Pregnancy:</b> hygiene first for 6 weeks; if severe or persistent, discuss treatment with a pharmacist, GP, midwife or medicines-information service. <b>Breastfeeding:</b> check current product information and specialist advice rather than withholding automatically."},
    {tone:"blue", h:"Household treatment reduces reinfection", html:"Treating only one person increases the risk of ongoing transmission. Offer treatment to household contacts at the same time where appropriate, including those without symptoms — checking age, pregnancy, breastfeeding and suitability for each."},
    {tone:"green", h:"No school or nursery exclusion", html:"Children do not usually need to stay off school or nursery once treatment and hygiene have started, and school or nursery contacts do not need routine treatment. It is common, harmless and does not mean poor hygiene."}
  ],
  pathwaySub:"Five steps. The tablet only works alongside the hygiene.",
  pathway:[
    {title:"Recognise it", html:"Nocturnal perianal or vulval itch ± visible worms. Tape test only if uncertain. Examine the perianal area if symptoms are persistent or atypical."},
    {title:"Decide who to treat", html:"The affected person and appropriate household contacts at the same time, checking age, pregnancy, breastfeeding and comorbidity for each."},
    {title:"Mebendazole 100 mg, repeated at 2 weeks", html:"Aged 6 months and over; off-label under 2 years. Hygiene alone for 6 weeks under 6 months and, initially, in pregnancy."},
    {title:"Practical hygiene", html:"At least 2 weeks alongside treatment; 6 weeks where medication is not used."},
    {title:"Recurring or not settling? Reconsider", html:"Reinfection is common, but persistent itch may be something else.", alert:true}
  ],
  sections:[

    {id:"diagnose", nav:"Diagnose", title:"Step 1 — recognise it",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>Typical</b>","Perianal itch, worse at night; vulval itch in girls; sometimes thread-like white worms in stool or around the anus"],
         ["<b>Who</b>","Very common in children; spreads easily within households through hand-to-mouth transfer of eggs"],
         ["<b>Diagnosis</b>","Clinical. If uncertain: early-morning perianal adhesive-tape test before washing or defaecation. Stool testing is usually not useful"],
         ["<b>Examine</b>","The perianal area if symptoms are persistent or atypical — excoriation, fissuring, dermatitis, secondary infection"],
         ["<b>Persistent vulval symptoms</b>","Threadworm can cause vulvovaginitis, but examine for other causes too: irritant dermatitis, candidiasis, lichen sclerosus, eczema, foreign body — and safeguarding concerns where clinically indicated"]
       ]},
       {b:"why", html:"Eggs survive on hands, under nails and on bedding and surfaces, so reinfection is common. That is why treatment is paired with hygiene and offered to the household at once — but a diagnosis of threadworm should not delay examining for another cause when symptoms do not fit."}
     ]},

    {id:"treat", nav:"Treat", title:"Step 2 — who to treat, and with what",
     blocks:[
       {b:"table", head:["Group","Treatment","Notes"], rows:[
         ["<b>Adults and children aged 2 years and over</b>","<span class='rx'>Mebendazole 100 mg</span> single dose (one chewable tablet or 5 mL suspension); repeat once after 2 weeks","Offer to appropriate household contacts at the same time, including those without symptoms"],
         ["<b>Children aged 6 months to 2 years</b>","<span class='rx'>Mebendazole 100 mg</span> single dose; repeat after 2 weeks","<b>Off-label</b> — individual risk–benefit assessment and appropriate advice"],
         ["<b>Infants under 6 months</b>","Hygiene measures alone for 6 weeks","Seek advice if symptoms are troublesome"],
         ["<b>Pregnancy</b>","Rigorous hygiene for 6 weeks first","If severe, persistent or disturbing sleep, discuss treatment with a pharmacist, GP, midwife or specialist medicines-information service — not an absolute contraindication"],
         ["<b>Breastfeeding</b>","Check the current product information and specialist medicines advice","Do not withhold treatment automatically"],
         ["<b>Contacts for whom treatment is unsuitable</b>","Hygiene measures","E.g. significant comorbidity, or people not actually sharing the household"]
       ]},
       {b:"warn", html:"Mebendazole is often bought over the counter. Prescribing and NHS funding follow local policy."}
     ]},

    {id:"hygiene", nav:"Hygiene", title:"Step 3 — practical hygiene",
     sub:"At least 2 weeks alongside treatment; 6 weeks where medication is not used.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"🧼 Hands and nails", html:"Wash hands and scrub under the nails after the toilet or nappy changes and before eating. Keep nails short."},
         {tone:"green", h:"🚿 Morning wash", html:"Shower or wash around the anus each morning to remove eggs laid overnight."},
         {tone:"green", h:"🚫 Hand to mouth", html:"Discourage nail-biting, thumb-sucking and scratching. Close-fitting underwear or nightwear at night can help children."},
         {tone:"green", h:"🛏️ Laundry and surfaces", html:"Wash nightwear, towels and bed linen on the day of treatment; avoid shaking bedding; damp-dust frequently touched surfaces. There is no need to hot-wash everything daily."}
       ]}
     ]},

    {id:"recur", nav:"Recurring?", title:"Recurring or not settling? Re-check before re-treating",
     sub:"Recurrence commonly reflects reinfection, incomplete household treatment or difficulty with hygiene — but persistent symptoms should prompt reconsideration of the diagnosis.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"1 · Dose and repeat", html:"Was the right dose taken, and was the 2-week repeat given?"},
         {tone:"amber", h:"2 · The household", html:"Were all appropriate household contacts treated at the same time? Any whose age or pregnancy made treatment unsuitable?"},
         {tone:"amber", h:"3 · Hygiene", html:"Were the hygiene measures practical and actually followed?"},
         {tone:"blue", h:"4 · Did it ever improve?", html:"If not, reconsider: eczema, irritant or perianal dermatitis, haemorrhoids, scabies, vulvovaginal disease."},
         {tone:"red", h:"5 · Secondary infection", html:"Spreading erythema, increasing pain, pus or crusting, fever, significant skin breakdown, urinary symptoms or marked vulval inflammation → review promptly. No empirical antibiotics without clinical evidence of bacterial infection."},
         {tone:"green", h:"6 · Then re-treat", html:"Re-treat the household together and reinforce hygiene, once the diagnosis is secure."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"When to refer or seek advice",
     blocks:[
       {b:"cards", items:[
         {tone:"blue", h:"Seek advice or refer", html:"Persistent symptoms despite correctly given household treatment and hygiene · uncertain diagnosis · recurrent significant vulvovaginitis · secondary infection · a very young infant where treatment is difficult to decide · pregnancy with severe symptoms or treatment being considered · unusual systemic features or eosinophilia needing wider parasitic evaluation."},
         {tone:"amber", h:"Safeguarding", html:"Where clinically indicated by the history or examination, follow the local safeguarding pathway."},
         {tone:"cream", h:"GP management", html:"Most uncomplicated threadworm needs pharmacist or GP advice, not referral. Related pages: <a href='../algorithms/anal-itchiness.html'>anal itch pathway</a> · <a href='scabies.html'>scabies</a>."}
       ]},
       {b:"say", html:"This is very common, harmless and easy to treat — it doesn't mean anyone is unclean. Everyone in the house who can take the tablet should take it on the same day, with a second dose two weeks later. For the next couple of weeks, wash hands and scrub under nails, keep nails short, wash around the bottom each morning, and wash nightwear, towels and bedding. Your child can keep going to school. If the itching doesn't settle, or the skin looks sore, red or weepy, come back."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A mother brings her <b>5-year-old</b> with two weeks of night-time bottom itching; she saw small white worms. The household includes her <b>14-month-old</b> and her partner, and <b>she is 20 weeks pregnant</b>. She asks whether the children must stay off school and nursery."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Makes the clinical diagnosis; treats the 5-year-old and partner with mebendazole and a 2-week repeat; explains the toddler's treatment is off-label and makes a risk–benefit decision; advises hygiene first in pregnancy and how to get medicines advice if symptoms persist; gives practical hygiene advice; confirms no exclusion is needed; and safety-nets for persistence and secondary infection."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>Greater Manchester Medicines Management Group — Greater Manchester Antimicrobial Guidelines, version 16 (October 2024)</b><br><a href="https://gmmmg.nhs.uk" rel="noopener">gmmmg.nhs.uk</a><span class="rd"> — the local pathway: mebendazole 100 mg over 6 months, off-label under 2, hygiene alone under 6 months and in pregnancy, household treatment</span></li>'+
         '<li><b>UK guidelines for the investigation and management of eosinophilia in returning travellers and migrants (British Infection Association et al., 2024)</b><span class="rd"> — mebendazole 100 mg repeated at 2 weeks, with hygiene</span></li>'+
         '<li><b>BNF / BNFC and product information</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — licensing, pregnancy and breastfeeding</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Threadworm. A clinical diagnosis; tape test only if uncertain. Mebendazole 100 mg orally as a single dose for affected people and appropriate household contacts aged 6 months and over, repeated once after 2 weeks per the Greater Manchester pathway. Under 2 years off-label — individual risk–benefit assessment. Under 6 months: hygiene alone for 6 weeks. Pregnancy: hygiene first; seek individual medicines advice if severe or persistent. Breastfeeding: check current advice. Hygiene for at least 2 weeks alongside treatment, 6 weeks where medication is not used. No routine school or nursery exclusion. Persistent symptoms: reconsider the diagnosis. Sources: Greater Manchester antimicrobial guidelines (v16, 2024), UK eosinophilia and parasitic infection guideline (BIA, 2024), BNF."
});
</script>
