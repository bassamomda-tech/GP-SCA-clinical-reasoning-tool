<script>
MG.render({
  icon:"🫃",
  title:"Irritable bowel syndrome — the complete guide",
  eyebrow:"Protocol · NICE CG61 · subtype decides the drug",
  stemTitle:"IBS is a positive diagnosis, not a label of exclusion — and the subtype matters because the same diagnosis needs opposite treatments: a laxative for one patient and an antidiarrhoeal for the next",
  stemSub:"One page for the whole condition. Make a positive diagnosis using symptom criteria, examination, absence of red flags, the recommended baseline blood tests (FBC, CRP or ESR/plasma viscosity and coeliac serology) and <b>selective faecal calprotectin</b> where IBD is a realistic differential. Then <b>subtype it</b>, because IBS-C and IBS-D need different drugs, and review fibre according to stool pattern and bloating. Treat the dominant symptom, <b>discourage lactulose</b> where bloating is prominent because its fermentation can worsen the very bloating patients complain of, add a <b>low-dose neuromodulator for persistent pain</b>, and keep the NG12 safety net live because IBS is a long-term relapsing condition in which new alarm features still mean investigation.",
  guideline:"NICE CG61 (2008, updated 2017) · NICE DG11 (now HTG320) · NICE NG12 (updated April 2026) · NICE HTG690 (2023, formerly DG56) · BSG IBS guideline 2021",
  reviewed:"14 September 2026",
  nextReview:"14 March 2027",
  meta:[
    {t:"NICE CG61 — irritable bowel syndrome in adults"},
    {t:"FBC, CRP/ESR + coeliac serology in everyone · calprotectin if IBD possible", tone:"tw"},
    {t:"Discourage lactulose — it can worsen bloating", tone:"tw"},
    {t:"v2.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#diagnose"><b>Diagnose</b><small>Positive · subtype</small></a><a href="#lifestyle"><b>Diet</b><small>Fibre by stool pattern</small></a><a href="#drugs"><b>Drugs</b><small>Dominant symptom</small></a><a href="#review"><b>Review</b><small>Relapsing condition</small></a><a href="#refer"><b>Refer</b><small>NG12 · refractory</small></a></div>',
  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"blue", h:"Baseline tests in everyone — calprotectin selectively", html:"<b>Perform FBC, CRP or ESR/plasma viscosity and coeliac serology in patients meeting IBS criteria (NICE CG61).</b> <b>Add faecal calprotectin when IBD is a clinical possibility</b>, particularly with diarrhoea or inflammatory features, provided cancer is not suspected and the local pathway supports its use (NICE DG11). <b>CA-125</b> in a woman aged 50 or over whose IBS-type symptoms began in the last 12 months, or with persistent NG12 ovarian symptoms at 40 or over (NICE NG12, updated April 2026) — CA-125 is not an IBS test. A positive coeliac screen or raised faecal calprotectin means that IBS should not be treated as the sole diagnosis until the abnormal result has been assessed; a raised calprotectin does not automatically prove IBD, and a normal result does not exclude every organic gastrointestinal disorder."},
    {tone:"blue", h:"Diagnose positively, then subtype", html:"Consider IBS when abdominal pain or discomfort has been present for at least 6 months and is related to defecation or associated with altered stool frequency or stool form, together with at least 2 of: altered stool passage (straining, urgency, incomplete evacuation), bloating/distension, symptoms worsened by eating, or passage of mucus (NICE CG61) — and no red flags. Do not require both bloating and mucus. Then classify: IBS-C (constipation), IBS-D (diarrhoea) or IBS-M (mixed) — because that choice directs the drug. Subtyping is not academic tidiness; it is the difference between a laxative and loperamide."},
    {tone:"amber", h:"Review fibre — the type matters", html:"<b>Review fibre intake in everyone.</b> <b>Discourage insoluble fibre such as bran</b> where it worsens symptoms. If fibre supplementation is appropriate, <b>introduce soluble fibre such as ispaghula gradually</b>, starting at a low dose, according to stool pattern and bloating (NICE CG61; BSG 2021). <b>Generic \"eat more fibre\" advice often makes symptoms worse</b>, which is why so many arrive saying diet advice did not help. Regular meals, adequate fluid, and reduce caffeine, alcohol, fizzy drinks, fatty or processed foods and sweeteners such as sorbitol."},
    {tone:"red", h:"⛔ Discourage lactulose in IBS", html:"<b>Avoid or discourage lactulose where bloating is prominent</b> — its fermentation can worsen bloating (NICE CG61). <b>For IBS-C, consider a macrogol preparation or another suitable laxative</b>, titrated to achieve a soft, formed stool, and review whether abdominal pain and bloating improve or worsen — and if a patient reports that a laxative made them much more bloated, lactulose is usually the reason. For pain: mebeverine 135 mg TDS (GM formulary first choice), hyoscine butylbromide 10 mg TDS (up to 20 mg QDS), or peppermint oil 1–2 capsules TDS. For diarrhoea: loperamide 2 mg titrated to response — it improves stool frequency and urgency but does not reliably treat abdominal pain or bloating."},
    {tone:"blue", h:"Low-dose neuromodulators for persistent pain", html:"Low-dose amitriptyline 5–10 mg at night, titrated to no more than 30 mg (CG61) — off-label, as a gut neuromodulator that dampens visceral hypersensitivity — with counselling on drowsiness and anticholinergic effects. Review after 4 weeks, then every 6–12 months if continued; explain it is used at a low dose for visceral pain modulation, not as treatment for depression. <b>An SSRI only if the TCA has been ineffective (CG61).</b> <b>Refractory IBS-C: linaclotide 290 micrograms OD</b> only after constipation for at least 12 months and failure of optimal or maximum tolerated laxatives from different classes; review after 3 months. Refractory IBS-D: review for bile acid diarrhoea, microscopic colitis, coeliac disease, IBD, medication effects and infection; specialist options."},
    {tone:"purple", h:"🟣 NICE NG12 (updated April 2026) — the safety net stays live for life", html:"Colorectal: offer FIT for a change in bowel habit or iron-deficiency anaemia at any age, an abdominal mass, rectal bleeding with unexplained abdominal pain or weight loss under 50, unexplained weight loss with abdominal pain at 40+, unexplained rectal bleeding, abdominal pain or weight loss at 50+, or anaemia without iron deficiency at 60+ → FIT, with a colorectal suspected cancer pathway referral at ≥10 µg Hb/g (NICE NG12, updated April 2026; NICE HTG690 (2023, formerly DG56)); a rectal mass → suspected cancer pathway referral without waiting for FIT. Use FIT where recommended, but do not delay suspected-cancer referral for a palpable rectal mass, a strongly suspicious presentation or inability to obtain FIT. Ovarian (NICE CG61 and NG12, updated April 2026): in a woman aged 50 or over with new IBS-type symptoms in the last 12 months, assess for ovarian cancer rather than assuming IBS, and apply the current NG12 ovarian pathway; at 40 or over, persistent or frequent (particularly more than 12 times a month) bloating, early satiety or loss of appetite, pelvic or abdominal pain, or urinary urgency or frequency → CA-125, with urgent direct-access ultrasound at or above the age-specific threshold (≥35 IU/mL at 40–49, ≥31 at 50–59, ≥24 at 60–69, ≥25 at 70–79, ≥31 at 80 and over); aged 39 or under, do not rely on CA-125 alone — consider urgent direct-access ultrasound for persistent symptoms. CA-125 is not an IBS test and should not be used to diagnose endometriosis or functional bowel disease. An established IBS label does not retire the red flags — it conceals them, because both patient and clinician attribute new symptoms to the known diagnosis. Restated in <a href='#refer'>Refer</a>."}
  ],
  pathwaySub:"Five steps, and the second is the one that makes dietary advice work rather than backfire.",
  pathway:[
    {title:"Confirm IBS positively and exclude the mimics", html:"Symptom criteria, examination, no red flags, baseline bloods (FBC, CRP or ESR/plasma viscosity, coeliac serology), and faecal calprotectin selectively where IBD is a realistic differential.", alert:true},
    {title:"Subtype it — IBS-C, IBS-D or IBS-M", html:"This directs everything that follows, including whether fibre goes up or down."},
    {title:"Diet and lifestyle first", html:"Regular meals, trigger reduction, fibre reviewed (discourage bran; soluble fibre introduced gradually if increasing), activity and stress — with a structured low-FODMAP diet if symptoms persist, ideally dietitian-led, with time-limited elimination then structured reintroduction."},
    {title:"Treat the dominant symptom", html:"Antispasmodic, laxative such as a macrogol (discourage lactulose) or loperamide; then a low-dose neuromodulator for persistent pain."},
    {title:"Review as a long-term relapsing condition", html:"Re-screen red flags, re-match treatment to the current dominant symptom, and stop what is not working."}
  ],
  sections:[

    {id:"diagnose", nav:"Diagnose", title:"Step 1 — confirming IBS and its subtype",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>Diagnosis</b>","Consider IBS when abdominal pain or discomfort has been present for at least 6 months and is related to defecation or associated with altered stool frequency or stool form, together with at least 2 of: altered stool passage (straining, urgency or incomplete evacuation), bloating/distension, symptoms worsened by eating, or passage of mucus (NICE CG61). Do not require both bloating and mucus"],
         ["<b>Exclude organic disease</b>","In everyone meeting IBS criteria: FBC, CRP or ESR/plasma viscosity and coeliac serology (NICE CG61). Faecal calprotectin when IBD is a clinical possibility, particularly with diarrhoea or inflammatory features, provided cancer is not suspected and the local pathway supports its use (NICE DG11). CA-125 in a woman aged 50 or over with IBS-type symptoms that began in the last 12 months, or with persistent ovarian symptoms at 40 or over — interpreted against the age-specific thresholds (NICE NG12, updated April 2026)"],
         ["<b>Abnormal results</b>","A positive coeliac screen or raised faecal calprotectin means that IBS should not be treated as the sole diagnosis until the abnormal result has been assessed. Coeliac disease and IBS-like symptoms can coexist; calprotectin can be raised in IBD, infection, NSAID use, colorectal neoplasia and other inflammatory conditions. A positive coeliac screen requires the coeliac diagnostic pathway while the patient remains on a gluten-containing diet"],
         ["<b>Subtype</b>","IBS-C (constipation), IBS-D (diarrhoea), IBS-M (mixed) — this directs drug choice"],
         ["<b>Red flags</b>","<b>See the safety-net — these must be absent to diagnose IBS confidently</b>"]
       ]},
       {b:"why", html:"Make a positive diagnosis using symptom criteria, examination, absence of red flags, recommended baseline blood tests and selective faecal calprotectin where IBD is a realistic differential — this preserves the positive-diagnosis message without over-investigating low-risk patients. Subtyping matters because the same diagnosis needs different treatments: a laxative versus an antidiarrhoeal, with fibre advice tailored to stool pattern and bloating."}
     ]},

    {id:"lifestyle", nav:"Diet", title:"Step 2 — diet, lifestyle and the gut–brain link",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"🍽️ Regular meals", html:"<b>A regular eating pattern; do not skip or rush meals; adequate fluid.</b>"},
         {tone:"blue", h:"☕ Limit triggers", html:"Reduce caffeine, alcohol, fizzy drinks, fatty and processed foods, and sweeteners such as sorbitol."},
         {tone:"amber", h:"🌾 Fibre — review the type", html:"Review fibre intake in everyone. Discourage insoluble fibre such as bran where it worsens symptoms. If fibre supplementation is appropriate, introduce soluble fibre such as ispaghula gradually — start at a low dose and increase slowly to minimise bloating — according to stool pattern and bloating (NICE CG61; BSG 2021)."},
         {tone:"blue", h:"🦠 Probiotics", html:"If the patient wishes to try a probiotic, use one product for at least 4 weeks and up to 12 weeks, then continue only if there is clear benefit (NICE CG61; BSG 2021). Do not recommend a specific strain as universally superior."},
         {tone:"green", h:"🏃 Activity and stress", html:"<b>Physical activity; address stress, which is a strong symptom driver.</b>"},
         {tone:"blue", h:"🥗 Low-FODMAP", html:"If symptoms persist — a structured low-FODMAP diet, ideally dietitian-led rather than unsupervised exclusion. The elimination phase should be time-limited, followed by structured reintroduction and personalisation. Long-term unrestricted exclusion risks nutritional inadequacy and is not the intended treatment — it is not a permanent diet."}
       ]}
     ]},

    {id:"drugs", nav:"Drugs", title:"Step 3 — treat the dominant symptom",
     blocks:[
       {b:"table", head:["Step","When","Treatment"], rows:[
         ["<b>First-line, by symptom</b>","<b>Antispasmodic / laxative / loperamide</b>","Pain or spasm: an antispasmodic — mebeverine 135 mg TDS, hyoscine butylbromide 10 mg TDS (up to 20 mg QDS), or peppermint oil 1–2 capsules TDS (enteric-coated; take according to product instructions). Mebeverine is the GM formulary first choice. Constipation: a macrogol preparation or another suitable laxative, titrated to a soft, formed stool — discourage lactulose where bloating is prominent. Diarrhoea: loperamide 2 mg titrated to response — improves stool frequency and urgency but does not reliably treat pain or bloating"],
         ["<b>Step 2 — low-dose amitriptyline</b>","<b>Persistent pain despite first-line</b>","A low-dose tricyclic (off-label) as a gut neuromodulator — amitriptyline 5–10 mg at night, titrated, usually to no more than 30 mg in primary care (CG61; the BSG describes 30–50 mg in some patients — only with specialist advice); counsel on drowsiness and anticholinergic effects. Check: QT prolongation/cardiac disease, anticholinergic burden, glaucoma, urinary retention, constipation, seizure risk, suicidality and mood, interaction with other serotonergic or sedating drugs; caution in older adults. Review after 4 weeks and thereafter every 6–12 months if continued; explain it is a low dose for visceral pain modulation, not treatment for depression"],
         ["<b>Step 3 — SSRI or specialist agents</b>","<b>If the TCA is ineffective</b>","Consider an SSRI (CG61 third line, only after a TCA has failed). For refractory IBS-C, linaclotide 290 micrograms OD only after constipation for at least 12 months and failure of optimal or maximum tolerated laxatives from different classes; review after 3 months. For persistent or refractory IBS-D, review for bile acid diarrhoea (consider bile acid malabsorption testing, especially with atypical features or previous cholecystectomy), microscopic colitis, coeliac disease, IBD, medication effects and infection where clinically appropriate; then specialist options"]
       ]},
       {b:"warn", html:"<b>Cautions.</b> Hyoscine: anticholinergic adverse effects — caution in glaucoma, urinary retention and prostatic symptoms. Peppermint oil can worsen reflux/heartburn. Review antispasmodics for benefit rather than continuing them indefinitely. Avoid loperamide in suspected inflammatory or infectious diarrhoea, significant abdominal distension or possible obstruction."},
       {b:"why", html:"There is no single \"IBS drug\" — you treat the dominant symptom, and add a low-dose neuromodulator (TCA or SSRI) for persistent pain because it dampens visceral hypersensitivity. Lactulose is discouraged because its fermentation can worsen the very bloating IBS patients complain of — which is a common and easily fixed iatrogenic contribution."}
     ]},

    {id:"review", nav:"Review", title:"Step 4 — monitoring and follow-up",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["<b>Symptom response</b>","<b>Each review</b>","<b>Adjust diet and drug by subtype; stop ineffective drugs</b>"],
         ["<b>Red flags</b>","<b>Ongoing</b>","<b>Any new alarm feature → apply the current NG12 pathway (FIT where recommended) or refer</b>"],
         ["<b>TCA or SSRI for pain</b>","<b>4 weeks after starting, then every 6–12 months if continued (CG61)</b>","<b>Benefit, adverse effects and safety checks; stop if no benefit</b>"],
         ["<b>FODMAP and probiotic trials</b>","<b>Probiotic after at least 4 and up to 12 weeks (CG61; BSG); low-FODMAP after the 4–6 week restriction phase</b>","<b>Continue only if there is clear benefit; involve a dietitian; follow elimination with structured reintroduction</b>"],
         ["<b>Mood and stress</b>","<b>As needed</b>","<b>Treat comorbid anxiety or depression; consider gut-directed psychological therapy early where preferred or indicated</b>"]
       ]},
       {b:"dl", rows:[
         ["<b>After diet plus first-line drug</b>","<b>Reassess symptoms, adherence and triggers; adjust by subtype</b>"],
         ["<b>If persistent</b>","Escalate the non-drug measures: dietitian-led low-FODMAP, add a neuromodulator, consider psychological therapy"],
         ["<b>Periodically</b>","Confirm the diagnosis still fits, re-screen the red flags, and manage it as a long-term relapsing condition"]
       ]}
     ]},

    {id:"notresponding", nav:"Not responding?", title:"Not responding? Re-think before escalating",
     sub:"Persistent symptoms warrant revisiting the diagnosis and the drivers.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"1 · Red flags and mimics", html:"Re-screen; confirm baseline bloods and coeliac serology were done, and calprotectin where IBD is possible. In persistent IBS-D consider bile acid diarrhoea, microscopic colitis, coeliac disease, IBD, medication effects and infection."},
         {tone:"blue", h:"2 · Subtype", html:"<b>Has treatment been matched to the CURRENT dominant symptom?</b> Subtypes shift over time."},
         {tone:"blue", h:"3 · Diet", html:"<b>Structured low-FODMAP via a dietitian — not unsupervised exclusion</b>, which risks nutritional inadequacy and rarely works."},
         {tone:"green", h:"4 · Psychological", html:"Stress, anxiety or prior trauma — CBT or gut-directed therapy for persistent or refractory IBS. Consider it earlier when the patient prefers it or with psychological comorbidity, health anxiety, central sensitisation, marked functional impairment, or repeated consultation or medication failure."},
         {tone:"amber", h:"5 · Drug trial", html:"An adequate trial of an antispasmodic with or without a neuromodulator before declaring failure."}
       ]}
     ]},

    {id:"safety", nav:"Safety-net", title:"Safety-netting",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Alarm features", html:"\"Bleeding from the back passage, unintentional weight loss, anaemia or feeling increasingly tired and pale, a tummy or back-passage lump, symptoms that wake you at night, or a new change in your usual pattern — come back; we'll investigate.\""},
         {tone:"amber", h:"🟠 Nocturnal or progressive", html:"\"Symptoms that wake you at night, or that steadily worsen, need re-checking.\""},
         {tone:"amber", h:"🟠 Persistent bloating (women)", html:"\"If bloating, feeling full quickly, pelvic pain or needing to pass urine more often becomes persistent — most days — come back for a blood test (CA-125) and possibly a scan.\" NG12 (updated April 2026) ovarian criteria are in <a href='#refer'>Refer</a>."},
         {tone:"amber", h:"🩸 Anaemia", html:"\"If you feel increasingly tired or look pale, we'll check your blood count.\""},
         {tone:"green", h:"🧠 It's real", html:"\"IBS is a genuine condition, not 'in your head' — but stress can flare it, so we treat both.\""}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"When to refer",
     blocks:[
       {b:"cards", items:[
         {tone:"purple", h:"Suspected cancer · NICE NG12 (updated April 2026)", html:"Colorectal — a change in bowel habit or iron-deficiency anaemia at any age, an abdominal mass, rectal bleeding with unexplained abdominal pain or weight loss under 50, unexplained weight loss with abdominal pain at 40+, unexplained rectal bleeding, abdominal pain or weight loss at 50+, or anaemia without iron deficiency at 60+ → FIT, with a colorectal suspected cancer pathway referral at ≥10 µg Hb/g (NICE NG12, updated April 2026; NICE HTG690 (2023, formerly DG56)); a rectal mass → suspected cancer pathway referral without waiting for FIT. Use FIT where recommended, but do not delay suspected-cancer referral for a palpable rectal mass, a strongly suspicious presentation or inability to obtain FIT.<br>Ovarian (NICE CG61 and NG12, updated April 2026): in a woman aged 50 or over with new IBS-type symptoms in the last 12 months, assess for ovarian cancer rather than assuming IBS, and apply the current NG12 ovarian pathway; at 40 or over, persistent or frequent (particularly more than 12 times a month) bloating, early satiety or loss of appetite, pelvic or abdominal pain, or urinary urgency or frequency → CA-125, with urgent direct-access ultrasound at or above the age-specific threshold (≥35 IU/mL at 40–49, ≥31 at 50–59, ≥24 at 60–69, ≥25 at 70–79, ≥31 at 80 and over); aged 39 or under, do not rely on CA-125 alone — consider urgent direct-access ultrasound for persistent symptoms. CA-125 is not an IBS test and should not be used to diagnose endometriosis or functional bowel disease."},
         {tone:"amber", h:"Refractory", html:"Symptoms unresponsive to optimal diet, drugs and psychological therapy. CG61 offers psychological interventions (CBT, hypnotherapy, psychological therapy) when drug treatment has not helped after 12 months. Consider gut-directed psychological therapy earlier when the patient prefers it or when psychological comorbidity, central sensitisation or marked functional impairment is present; it should not be reserved exclusively for the 12-month point (BSG 2021)."},
         {tone:"blue", h:"Diagnostic doubt", html:"Atypical features, raised calprotectin (IBD) or positive coeliac serology → gastroenterology. A raised faecal calprotectin should be interpreted according to the local laboratory pathway; avoid applying a single national cut-off without local validation. Borderline results may require repeat testing after review of NSAIDs, infection and other causes. A positive coeliac screen requires a coeliac diagnostic pathway while the patient remains on a gluten-containing diet; do not label it as IBS alone. Refractory IBS-D: consider bile acid diarrhoea and microscopic colitis."},
         {tone:"blue", h:"Severe impact", html:"<b>Major psychological comorbidity or quality-of-life impact.</b>"},
         {tone:"cream", h:"GP management", html:"The positive diagnosis and the two mimics, subtyping, diet and fibre by subtype, symptom-targeted drugs, neuromodulators and the long-term review all belong here. Related pages: <a href='coeliac-disease.html'>coeliac disease</a> · <a href='crohns-disease.html'>Crohn's disease</a> · <a href='ulcerative-colitis.html'>ulcerative colitis</a> · <a href='constipation-adult.html'>constipation</a> · <a href='../algorithms/chronic-diarrhoea.html'>chronic diarrhoea pathway</a>."}
       ]},
       {b:"say", html:"Your symptoms and tests currently support IBS, and we have not found evidence of inflammation, coeliac disease or another immediate cause. IBS can change over time, so please return if you develop bleeding, unintentional weight loss, anaemia, a lump, persistent nocturnal symptoms, or a new change in your usual pattern. IBS is real and manageable — we'll work on diet and the dominant symptom, and if needed a dietitian and a gut-calming medication. One thing worth knowing: fibre advice depends on which type you have, so please don't just add bran. And tell me if any of the warning signs I mentioned appear, even years from now."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 34-year-old woman has 2 years of <b>cramping lower abdominal pain, bloating and loose stools</b> 3–4 times most mornings, easing after opening her bowels. She was told she had IBS by a previous GP; <b>the record shows no coeliac serology or calprotectin</b>. She was advised to \"increase fibre\" and added <b>bran, since which she is much more bloated</b>. She has tried <b>lactulose</b> for the days she feels constipated, which made it worse. No weight loss, no bleeding, normal FBC last year."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Arranges the tests that were never done — FBC, CRP or ESR and coeliac serology, plus faecal calprotectin because IBD is a realistic differential with her loose stools — before accepting the inherited IBS label, and can say why; identifies the fibre advice as the wrong kind for IBS-D: insoluble bran should be REDUCED, not added, which explains her worsening bloating; stops the lactulose, naming fermentation as the reason it worsens bloating; subtypes her as IBS-D and treats accordingly with loperamide titrated to response plus an antispasmodic for the cramp, rather than a generic prescription; considers low-dose amitriptyline only for persistent pain after first-line; <b>offers dietitian-led low-FODMAP rather than unsupervised exclusion</b> if symptoms persist; <b>validates the diagnosis as real while naming stress as a flare driver</b>; and gives the NG12 safety-net explicitly, including that it still applies years into an established diagnosis."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>NICE CG61 (2008, updated 2017) — Irritable bowel syndrome in adults: diagnosis and management<br><a href="https://www.nice.org.uk/guidance/cg61" rel="noopener">nice.org.uk/guidance/cg61</a><span class="rd"> — the positive diagnostic criteria, the exclusion tests including coeliac serology and CA-125, the dietary advice with soluble fibre for constipation and reduced insoluble fibre for diarrhoea and bloating, the antispasmodic/laxative/loperamide first line with the recommendation to discourage lactulose, baseline FBC, ESR/plasma viscosity, CRP and coeliac antibody testing, 4-week then 6–12-monthly review of TCAs/SSRIs, and low-dose tricyclics then SSRIs as second and third line for pain</span></li>'+
         '<li>NICE DG11 (2013) — Faecal calprotectin diagnostic tests for inflammatory diseases of the bowel<br><a href="https://www.nice.org.uk/guidance/dg11" rel="noopener">nice.org.uk/guidance/dg11</a><span class="rd"> — calprotectin to help distinguish IBS from inflammatory bowel disease in adults with recent-onset lower-GI symptoms when specialist assessment is being considered, cancer is not suspected and local quality-assured testing and pathways exist (now HTG320)</span></li>'+
         '<li>NICE CG61 (updated April 2017) — Irritable bowel syndrome in adults<span class="rd"> — consider linaclotide 290 micrograms once daily for IBS-C when optimal or maximum tolerated doses of laxatives from different classes have not helped and constipation has lasted at least 12 months; review at 3 months</span></li>'+
         '<li><b>NICE CG61 (2008, updated 2017) \u2014 Irritable bowel syndrome in adults</b><br><a href="https://www.nice.org.uk/guidance/cg61" rel="noopener">nice.org.uk/guidance/cg61</a><span class="rd"> — subtyping into IBS-C, IBS-D and IBS-M, the probiotic trial period, the structured dietitian-led low-FODMAP approach, and the review structure for a relapsing condition</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (2015, updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — the colorectal routes applied to alarm features arising in a patient with an established IBS diagnosis, including FIT at \u226510 \u00b5g Hb/g; and the ovarian recommendations amended in April 2026 (1.5.6\u20131.5.9 and 1.5.11) \u2014 CA-125 testing in women aged 50 or over with new IBS-type symptoms, and age-specific CA-125 thresholds from age 40 for urgent direct-access ultrasound</span></li>'+
         '<li><b>NICE HTG690 (2023, formerly DG56) \u2014 Quantitative faecal immunochemical testing to guide colorectal cancer pathway referral in primary care</b><br><a href="https://www.nice.org.uk/guidance/htg690" rel="noopener">nice.org.uk/guidance/htg690</a><span class="rd"> \u2014 FIT with a threshold of 10 micrograms haemoglobin per gram of faeces to guide colorectal cancer pathway referral</span></li>'+
         '<li><b>British Society of Gastroenterology — Guidelines on the management of irritable bowel syndrome (Gut, 2021; doi:10.1136/gutjnl-2021-324598)</b><span class="rd"> — soluble fibre started low and increased gradually, probiotics for up to 12 weeks, bile acid malabsorption testing in selected IBS-D, TCA titration, gut-directed psychological therapies</span></li>'+
         '<li><b>GMMMG Formulary — Gastro-intestinal system</b><br><a href="https://www.greatermanchesterformulary.nhs.uk" rel="noopener">greatermanchesterformulary.nhs.uk</a><span class="rd"> — mebeverine first choice; hyoscine butylbromide and peppermint oil as alternatives</span></li>'+
         '<li><b>BNF (current edition)</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — mebeverine, hyoscine butylbromide, peppermint oil, loperamide and amitriptyline dosing, and the off-label status of low-dose tricyclics in IBS</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Irritable bowel syndrome in adults — NICE CG61 (updated 2017), NICE HTG320 (formerly DG11), NICE NG12 (updated April 2026) and NICE HTG690 (2023, formerly DG56). A positive clinical diagnosis using symptom criteria, examination, absence of red flags, baseline bloods (FBC, CRP or ESR/plasma viscosity, coeliac serology) and selective faecal calprotectin where IBD is a realistic differential. Subtype it, because IBS-C and IBS-D need different drugs. Review fibre in everyone: discourage insoluble fibre (bran) where it worsens symptoms, and introduce soluble fibre (ispaghula) gradually if increasing. Discourage lactulose where bloating is prominent; a macrogol is a practical alternative. Treat the dominant symptom, add low-dose amitriptyline for persistent pain, and use a dietitian-led low-FODMAP diet rather than unsupervised exclusion. The NG12 safety net stays live for life — an established IBS label conceals new alarm features rather than retiring them. Verify all doses against the current BNF before prescribing."
