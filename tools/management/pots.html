MG.render({ snapshot:"summaries/pots.html",
icon:"\u{1F493}",
  title:"Postural tachycardia syndrome (PoTS)",
  eyebrow:"Protocol · assess and manage in one place",
  stemTitle:"PoTS: exclude the cardiac and other causes first, confirm it with a 10-minute stand test, then build the non-drug plan",
  stemSub:"One page for postural tachycardia syndrome in primary care. Separate the red-flag palpitations and blackouts that need a different pathway. Confirm the diagnosis with a lying-and-standing test you can do in the surgery. Exclude dehydration, anaemia, thyroid disease and medicines. Start fluids, salt where safe, compression and graded recumbent exercise. Leave drug treatment to the specialist, and support the person with the associated conditions (hypermobility, long COVID, ME/CFS) that often come with it.",
  guideline:"Heart Rhythm Society expert consensus (2015) · PoTS UK GP guide (2026) · NHS PoTS information · NICE NG188 long COVID (2020, updated 2024) · ESC syncope guidelines (2018) · ivabradine, midodrine and fludrocortisone SPCs",
  reviewed:"15 October 2026",
  nextReview:"15 April 2027",
  meta:[
    {t:"HRS 2015 consensus · diagnostic criteria"},
    {t:"PoTS UK GP guide · primary care steps"},
    {t:"NICE NG188 · postural symptoms in long COVID"},
    {t:"No NICE guideline covers PoTS itself", tone:"tw"},
    {t:"v1.0 · reviewed Oct 2026", tone:"ok"}
  ],
  lead:"<div class='mg-layers'><a href='#redflags'><b>Not PoTS?</b><small>exertional and cardiac red flags</small></a><a href='#confirm'><b>Stand test</b><small>+30 bpm, +40 at 12–19</small></a><a href='#manage'><b>Non-drug plan</b><small>fluid · salt · compression · exercise</small></a><a href='#drugs'><b>Medicines</b><small>specialist-initiated</small></a></div>",
  quickSub:"The six points that change what you do today. Each one is traced to a named source under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"Blackout on exertion, chest pain or an abnormal ECG is not PoTS until proved otherwise", html:"PoTS is a diagnosis made after the dangerous causes are excluded. <b>Syncope during exercise or lying down</b>, palpitations with chest pain or breathlessness, a <b>family history of sudden cardiac death</b> under 40, known structural heart disease or an <b>abnormal ECG</b> need cardiology assessment on the transient loss of consciousness or palpitation pathway, not a PoTS plan. Ongoing chest pain, collapse that does not recover or a sustained fast irregular or broad-complex rhythm → <b>999</b>."},
    {tone:"cream", h:"Diagnosis: heart rate up 30 bpm or more within 10 minutes of standing", html:"A sustained rise of <b>30 bpm or more</b> (<b>40 bpm or more aged 12–19</b>) within <b>10 minutes</b> of standing or head-up tilt, with orthostatic symptoms, and <b>no orthostatic hypotension</b> (systolic fall of 20 mmHg or more, or diastolic of 10 mmHg or more). Symptoms are usually present for at least 3 months. You can do the <b>active stand test</b> in the surgery: rest lying for 5 minutes, then record BP and heart rate at 1, 3, 5 and 10 minutes standing still."},
    {tone:"amber", h:"Exclude the look-alikes before labelling it", html:"Dehydration, blood loss and <b>anaemia</b>, <b>hyperthyroidism</b>, medicines (vasodilators, diuretics, SNRIs, tricyclics, stimulants, alpha-blockers), prolonged bed rest or deconditioning, Addison's disease, and rarely phaeochromocytoma. A <b>12-lead ECG</b> and FBC, U&amp;E, TFT, glucose or HbA1c and ferritin are the usual baseline; add a 9 am cortisol, Holter or other tests only when the history points there."},
    {tone:"cream", h:"Non-drug measures are the treatment for most people", html:"<b>Fluids</b> about 2–3 litres a day, <b>extra salt</b> only if there is no contraindication (hypertension, heart failure, CKD, pregnancy with raised BP), <b>waist-high compression</b>, counter-manoeuvres, smaller meals, avoiding heat and alcohol, and a <b>graded exercise programme that starts recumbent</b> (rowing machine, recumbent bike, swimming). Explain that improvement takes months."},
    {tone:"amber", h:"Medicines are specialist-initiated and mostly unlicensed for PoTS", html:"Ivabradine, low-dose propranolol, midodrine and fludrocortisone are used by specialists when non-drug measures are not enough. None is licensed for PoTS. Do not start them in primary care; continue them under a shared-care or specialist plan, with the monitoring that plan sets (BP lying and standing, potassium on fludrocortisone, supine hypertension on midodrine)."},
    {tone:"blue", h:"Look for the company it keeps", html:"PoTS often travels with <b>joint hypermobility</b> (hypermobile Ehlers–Danlos syndrome or hypermobility spectrum disorder), <b>long COVID</b> and other post-viral illness, <b>ME/CFS</b>, migraine and gastrointestinal symptoms. NICE NG188 asks for a lying-and-standing BP and heart rate in people with long COVID who have postural symptoms. Many people have been told it is anxiety for years; validating the diagnosis is part of treatment."}
  ],
  pathwaySub:"The consultation in five moves. Step one is where the harm happens if it is skipped.",
  pathway:[
    {title:"Screen for red flags", html:"Ask about blackouts during exertion or lying down, chest pain, breathlessness, palpitations that start and stop suddenly, and family history of sudden death. Do a 12-lead ECG. Any of these → the cardiac or blackout pathway, not a PoTS label."},
    {title:"Do the active stand test", html:"Lie for 5 minutes, then stand still for 10 minutes. Record BP and heart rate supine and at 1, 3, 5 and 10 minutes. Note symptoms and any acrocyanosis. Do it in the morning if possible, and avoid caffeine and a big meal beforehand."},
    {title:"Exclude other causes", html:"FBC, U&amp;E, TFT, glucose or HbA1c and ferritin, a medicine review, and a check for dehydration, deconditioning and eating disorders. Add tests only when the history points there."},
    {title:"Start the non-drug plan", html:"Fluids, salt where safe, compression, counter-manoeuvres, trigger avoidance and a graded recumbent exercise programme. Give written information and a review date."},
    {title:"Refer and share care", html:"Refer to cardiology or the local syncope, autonomic or falls service if the diagnosis is uncertain, symptoms stay disabling after a fair trial of non-drug measures, or medicines are being considered. Children and young people go to paediatrics."}
  ],
  sections:[
    {id:"redflags", nav:"Red flags", title:"Red flags: when it is not PoTS, or not only PoTS", sub:"PoTS itself is not dangerous, but the symptoms overlap with arrhythmia, structural heart disease and serious medical illness.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Collapse now", html:"Chest pain, collapse that does not recover quickly, a sustained broad-complex or very fast irregular rhythm, signs of shock or a suspected bleed → <b>999</b>.", src:"ESC syncope guidelines (2018)"},
         {tone:"red", h:"🔴 Exertional or supine blackout", html:"<b>Syncope during exercise</b>, blackout while lying down, palpitations immediately before a blackout, or blackout with chest pain or breathlessness suggest an arrhythmic or structural cause. Arrange <b>urgent cardiology assessment</b> through the transient loss of consciousness pathway (see <a href='../algorithms/tloc.html'>TLoC</a>), and advise not to drive until assessed.", src:"ESC syncope guidelines (2018) · NICE CG109"},
         {tone:"red", h:"🔴 Abnormal ECG or family history", html:"Pre-excitation, long or short QT, Brugada pattern, heart block, left ventricular hypertrophy or pathological Q waves; or a <b>family history of sudden cardiac death under 40</b> or inherited cardiac disease → <b>urgent cardiology</b> referral before any PoTS label.", src:"ESC syncope guidelines (2018)"},
         {tone:"amber", h:"🟠 Other causes of a fast heart rate", html:"Fever or sepsis, dehydration from vomiting or diarrhoea, gastrointestinal bleeding, pulmonary embolism, thyrotoxicosis and severe anaemia all cause postural tachycardia. Treat the cause; same-day assessment if the patient is acutely unwell.", src:"HRS expert consensus (2015)"},
         {tone:"amber", h:"🟠 Weight loss and food restriction", html:"Marked weight loss, restrictive eating or purging can cause orthostatic tachycardia and is easily mislabelled as PoTS in teenagers and young women. Screen for an eating disorder (see the <a href='eating-disorders.html'>eating disorders protocol</a>).", src:"HRS expert consensus (2015)"},
         {tone:"amber", h:"🟠 Mood, risk and function", html:"Long-standing disabling symptoms, lost education or work and years of being disbelieved are common. Ask about low mood and suicidal thoughts and act on the answer.", src:"PoTS UK GP guide (2026)"}
       ]},
       {b:"why", html:"Postural tachycardia is a sign, not a diagnosis. A young person with palpitations and dizziness on standing usually has a benign cause, but the same story fits an inherited arrhythmia, and the ECG and exertional history are what separate them. Doing those two things first means the PoTS label is never applied to someone who needed a cardiologist."}
     ]},

    {id:"confirm", nav:"Diagnose", title:"Diagnose: symptoms, the stand test and the criteria", sub:"The diagnosis is clinical, confirmed by heart rate and BP on standing. A tilt-table test is a specialist investigation.",
     blocks:[
       {b:"kv", rows:[
         ["Typical symptoms","Light-headedness, palpitations, tremulousness, breathlessness, chest discomfort, blurred vision, fatigue and 'brain fog' on standing, eased by lying down. Worse with heat, after meals, after exertion, on waking and around periods."],
         ["Who","Most often women aged 15–50; frequently starts after a viral illness, surgery, pregnancy or a period of immobility."],
         ["Criteria (HRS 2015)","Sustained heart rate rise of <b>30 bpm or more</b> within 10 minutes of standing or head-up tilt (<b>40 bpm or more aged 12–19</b>), with symptoms of orthostatic intolerance, and <b>no orthostatic hypotension</b>. Symptoms are usually present for at least 3 months, and other causes have been excluded."],
         ["Orthostatic hypotension","A sustained fall of <b>20 mmHg or more systolic or 10 mmHg or more diastolic</b> within 3 minutes of standing. If present, this is orthostatic hypotension, not PoTS: look for medicines, volume depletion and autonomic failure (see <a href='../algorithms/hypotension.html'>hypotension</a>)."]
       ]},
       {b:"table", head:["Active stand test step","What to do","Notes"], rows:[
         ["<b>Before</b>","Morning if possible. No caffeine, nicotine or a large meal for 2 hours. Usual medicines unless the referrer advises otherwise.","Record which medicines were taken, as beta-blockers and others blunt the rise."],
         ["<b>Lying</b>","Lie flat for 5 minutes; record BP and heart rate.","A resting tachycardia lying down suggests another cause (for example inappropriate sinus tachycardia, thyroid disease)."],
         ["<b>Standing</b>","Stand still, leaning lightly against a wall if needed, without moving the legs. Record BP and heart rate at 1, 3, 5 and 10 minutes.","Stop and lie the patient down if they become presyncopal. Note symptoms, colour change in the legs and the maximum heart rate."],
         ["<b>Interpret</b>","Rise of 30 bpm or more (40 or more aged 12–19) without orthostatic hypotension, with typical symptoms.","A negative test does not exclude PoTS if suspicion is high: repeat on a symptomatic day or refer for tilt testing."]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"🧪 Baseline tests", html:"<b>12-lead ECG</b> · FBC and ferritin · U&amp;E · TFT · glucose or HbA1c. Consider a 9 am cortisol if Addison's disease is possible (see the <a href='addisons-disease.html'>Addison's disease protocol</a>), coeliac serology if there are GI symptoms or iron deficiency, and an ambulatory ECG if palpitations are paroxysmal.", src:"PoTS UK GP guide (2026) · HRS expert consensus (2015)"},
         {tone:"blue", h:"💊 Medicines review", html:"Medicines that cause or worsen postural tachycardia: vasodilators and antihypertensives, diuretics, alpha-blockers, SNRIs and tricyclics, stimulants (including ADHD medicines), and high caffeine or energy drinks. Review before testing where it is safe to do so.", src:"HRS expert consensus (2015)"},
         {tone:"cream", h:"🦴 Ask about the associations", html:"Joint hypermobility (Beighton score, history of dislocations and easy bruising), long COVID or another post-viral start, ME/CFS, migraine, irritable bowel symptoms, heavy periods and mast-cell-type symptoms (flushing, urticaria). They change the support the person needs.", src:"PoTS UK GP guide (2026) · NHS PoTS information"},
         {tone:"cream", h:"🧒 Children and young people", html:"The threshold is <b>40 bpm or more</b> aged 12–19, and healthy teenagers can have a large heart rate rise on standing, so over-diagnosis is a risk. Refer children and young people with suspected PoTS to paediatrics rather than labelling them in primary care.", src:"HRS expert consensus (2015)"}
       ]}
     ]},

    {id:"manage", nav:"Manage", title:"Management: the non-drug plan first", sub:"There are no large randomised trials. Most of the benefit comes from volume expansion, compression and reconditioning, sustained over months.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1", tone:"cream", title:"Explain and validate", when:"at diagnosis", fromLabel:"then",
          html:"Name the condition, explain the mechanism (blood pools in the legs and abdomen on standing, and the heart speeds up to compensate) and that it is not dangerous but can be disabling. Give written information (NHS and PoTS UK). Agree goals around function: school, work, sleep and activity."},
         {step:"2", tone:"cream", title:"Fluids, salt and trigger avoidance", when:"everyone", fromLabel:"add",
          html:"Fluids about <b>2–3 litres a day</b> unless restricted for another reason; a 500 mL drink before getting up helps morning symptoms. <b>Extra salt</b> (PoTS UK suggests about 6 g extra a day for adults) <b>only where there is no contraindication</b>: hypertension, heart failure, CKD or kidney stones, or pregnancy with raised BP. Smaller, lower-carbohydrate meals; avoid alcohol, hot baths and prolonged standing; raise the head of the bed if mornings are worst."},
         {step:"3", tone:"cream", title:"Compression and counter-manoeuvres", when:"symptoms on standing", fromLabel:"and",
          html:"<b>Waist-high compression</b> (tights or abdominal binder) works better than knee-length stockings. Teach physical counter-manoeuvres: crossing the legs, clenching buttocks and thighs, squatting, and sitting or lying down at the first warning."},
         {step:"4", tone:"green", title:"Graded exercise, starting recumbent", when:"over 3 months or more", fromLabel:"if still disabling",
          html:"Start with <b>recumbent or seated exercise</b> (rowing machine, recumbent bike, swimming) and build duration slowly before adding upright exercise. Expect a temporary worsening in the first weeks. Physiotherapy input helps, especially with hypermobility. In ME/CFS or long COVID with post-exertional symptom exacerbation, follow the energy-management approach in NICE NG206 and NG188 instead of fixed increments."},
         {step:"5", tone:"amber", title:"Specialist review for medicines", when:"disabling despite a fair trial", fromLabel:"",
          html:"Refer to cardiology or the local syncope, autonomic or falls service if symptoms remain disabling after a fair trial of these measures, the diagnosis is uncertain, or there are complex associated conditions. Medicines are added to the non-drug plan, not used instead of it."}
       ]},
       {b:"warn", html:"<b>Do not stop the non-drug plan when medicines start.</b> Avoid prolonged bed rest, which worsens deconditioning. Intravenous fluids are for emergencies (for example vomiting with dehydration), not for routine maintenance in primary care."},
       {b:"say", html:"When you stand up, gravity pulls blood down into your legs and tummy. Your heart speeds up to keep blood going to your brain, and that's the racing and dizziness you feel. It isn't damaging your heart. The things that help most are more fluid, more salt if it's safe for you, tight-fitting support tights and slowly building up exercise, starting lying or sitting down. It usually takes a few months to feel the difference, so we'll keep reviewing it together."}
     ]},

    {id:"drugs", nav:"Medicines", title:"Prescribing: what specialists use, and what primary care monitors", sub:"All are unlicensed for PoTS (midodrine and fludrocortisone are licensed for orthostatic hypotension or adrenal insufficiency). Start only on specialist advice.",
     blocks:[
       {b:"table", head:["Medicine","Usual adult dose (specialist-initiated)","What to watch"], rows:[
         ["<b>Ivabradine</b>","<span class=mg-dose>Usual adult dose used in PoTS: 2.5–5 mg twice daily, specialist-initiated (SPC for licensed indications; check the SPC, BNF and local formulary; <a href='https://www.medicines.org.uk/emc/search?q=ivabradine' target=_blank rel=noopener>SPC: ivabradine</a>)</span>","Slows the sinus rate without lowering BP. Bradycardia, visual phosphenes. <b>Contraindicated in pregnancy and breastfeeding</b>: effective contraception is needed. Many interactions (strong CYP3A4 inhibitors such as clarithromycin)."],
         ["<b>Propranolol</b> (low dose)","<span class=mg-dose>Usual adult dose used in PoTS: 10 mg up to three times daily, specialist-advised (check the SPC, BNF and local formulary; <a href='https://www.medicines.org.uk/emc/search?q=propranolol' target=_blank rel=noopener>SPC: propranolol</a>)</span>","Higher doses often worsen fatigue. Avoid in asthma. Dangerous in overdose: consider risk in people with low mood."],
         ["<b>Midodrine</b>","<span class=mg-dose>Usual adult dose: 2.5 mg three times daily, titrated by the specialist up to 10 mg three times daily, last dose at least 4 hours before bed (SPC; check the SPC, BNF and local formulary; <a href='https://www.medicines.org.uk/emc/search?q=midodrine' target=_blank rel=noopener>SPC: midodrine</a>)</span>","A vasoconstrictor. <b>Supine hypertension</b>: do not lie flat for 4 hours after a dose; check lying and standing BP. Avoid in severe heart disease, urinary retention, phaeochromocytoma and thyrotoxicosis. Scalp tingling and goosebumps are common."],
         ["<b>Fludrocortisone</b>","<span class=mg-dose>Usual adult dose used in PoTS: 50–200 micrograms once daily, specialist-advised (check the SPC, BNF and local formulary; <a href='https://www.medicines.org.uk/emc/search?q=fludrocortisone' target=_blank rel=noopener>SPC: fludrocortisone</a>)</span>","Expands plasma volume. Check <b>potassium</b> and BP after starting and periodically; hypokalaemia, oedema, headache and hypertension. Steroid card advice follows the SPC."]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"🟠 Medicines to review or avoid", html:"Vasodilators, diuretics, alpha-blockers, SNRIs and tricyclics can worsen symptoms. Review them with the prescriber of each, rather than stopping abruptly.", src:"HRS expert consensus (2015)"},
         {tone:"blue", h:"🧾 Shared care", html:"Primary care often continues specialist-started medicines. Agree in writing who monitors, what (BP lying and standing, heart rate, potassium) and when, as for any amber medicine in the local formulary.", src:"Local formulary arrangements"},
         {tone:"cream", h:"🧠 Psychological support", html:"CBT for living with a long-term condition can help mood, sleep and pacing. It is offered as support, not because the symptoms are psychological.", src:"PoTS UK GP guide (2026)"},
         {tone:"cream", h:"🩸 Iron", html:"Treat iron deficiency, which is common in young women with PoTS and heavy periods and can worsen symptoms (see the <a href='iron-deficiency-anaemia.html'>iron deficiency anaemia protocol</a>).", src:"PoTS UK GP guide (2026)"}
       ]}
     ]},

    {id:"special", nav:"Special groups", title:"Special groups", sub:"Groups where the default plan changes.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"🤰 Pregnancy", html:"Symptoms can improve or worsen. <b>Ivabradine is contraindicated</b>; review all PoTS medicines before conception or as soon as pregnancy is known, with the specialist. Extra salt is not advised if BP is raised or pre-eclampsia is a risk. Tell the maternity team about the diagnosis.", src:"Ivabradine SPC · PoTS UK GP guide (2026)"},
         {tone:"amber", h:"🧒 Children and young people", html:"Use the 40 bpm threshold aged 12–19 and refer to paediatrics. Support school attendance with a school health plan (water bottle, salty snacks, permission to sit and to leave class, adjusted PE). Children's doses are per the BNFC and specialist.", src:"HRS expert consensus (2015)"},
         {tone:"blue", h:"🦠 Long COVID", html:"NICE NG188 recommends measuring lying and standing BP and heart rate (an active stand test) in people with ongoing symptoms after COVID-19 who have postural symptoms such as dizziness on standing, and referring according to the findings.", src:"NICE NG188 (2020, updated 2024)"},
         {tone:"blue", h:"🦴 Hypermobility", html:"Physiotherapy for joint stability helps exercise tolerance. Compression garments and pacing matter more. Ask about bladder, bowel and pelvic symptoms.", src:"PoTS UK GP guide (2026)"},
         {tone:"cream", h:"🚗 Driving and work", html:"Most people with PoTS without blackouts can drive. Anyone with unexplained syncope must follow DVLA guidance and stop driving until assessed. Fit notes and workplace adjustments (seated work, flexible hours) help many people stay in work.", src:"DVLA assessing fitness to drive"},
         {tone:"cream", h:"🧓 Older people", html:"New postural symptoms in older adults are much more likely to be orthostatic hypotension, medicines or autonomic failure than PoTS. Use the <a href='../algorithms/falls.html'>falls</a> and <a href='../algorithms/hypotension.html'>hypotension</a> pathways.", src:"ESC syncope guidelines (2018)"}
       ]}
     ]},

    {id:"monitor", nav:"Follow-up", title:"Monitoring and follow-up", sub:"A chronic, fluctuating condition. Review function, not just heart rate.",
     blocks:[
       {b:"table", head:["When","What to check","Action"], rows:[
         ["<b>4–6 weeks after diagnosis</b>","Uptake of fluids, salt, compression and exercise; symptoms and function","Adjust the plan; refer if disabling despite a fair trial."],
         ["<b>On fludrocortisone</b>","Potassium and BP (lying and standing) after starting and after dose changes, then periodically","Per the specialist or shared-care plan."],
         ["<b>On midodrine</b>","Lying and standing BP, urinary symptoms","Supine hypertension → contact the specialist."],
         ["<b>Every review</b>","Mood, sleep, school or work, new red-flag symptoms (exertional syncope, chest pain)","New red flags → urgent cardiology on the TLoC pathway."]
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer: who, where and how fast", sub:"Most PoTS is diagnosed and managed in primary care with specialist support for medicines.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999", html:"Chest pain, collapse that does not recover, sustained fast irregular or broad-complex rhythm, signs of shock.", src:"ESC syncope guidelines (2018)"},
         {tone:"red", h:"Urgent cardiology (TLoC pathway)", html:"Syncope during exercise or lying down, blackout with palpitations or chest pain, abnormal ECG, family history of sudden cardiac death under 40 or inherited cardiac disease.", src:"NICE CG109 · ESC syncope guidelines (2018)"},
         {tone:"amber", h:"Cardiology, syncope, autonomic or falls service", html:"Diagnosis uncertain (negative stand test with high suspicion, for tilt testing), symptoms disabling after a fair trial of non-drug measures, medicines being considered, or complex associated conditions. Use the local route; some areas have a dedicated PoTS clinic.", src:"PoTS UK GP guide (2026)"},
         {tone:"amber", h:"Paediatrics", html:"Children and young people with suspected PoTS.", src:"HRS expert consensus (2015)"},
         {tone:"green", h:"Stays in primary care", html:"Confirmed PoTS without red flags, improving on non-drug measures, with continued review and shared care of specialist-started medicines.", src:"PoTS UK GP guide (2026)"}
       ]}
     ]},

    {id:"safety", nav:"Safety-net", title:"Patient information and safety-netting", sub:"Say it, give it in writing, document it.",
     blocks:[
       {b:"say", html:"Call 999 if you have chest pain, collapse and don't come round quickly, or your heart races and won't settle with feeling very unwell. If you black out while exercising or lying down, or your blackouts change, contact us the same day and don't drive until you've been checked. Keep up the fluids, salt if we've agreed it's safe, support tights and slowly building exercise; it takes months, not weeks."},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"📄 Information", html:"NHS: postural tachycardia syndrome. PoTS UK: information for patients, schools and employers.", src:"NHS PoTS information · PoTS UK"},
         {tone:"green", h:"🗓️ Practical tips", html:"Get up slowly in stages; drink before getting out of bed; carry water and salty snacks; sit down when queuing; cool showers rather than hot baths; plan activities for the better part of the day.", src:"NHS PoTS information"}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 22-year-old student, eight months after COVID-19, has dizziness and a pounding heart on standing, fatigue and brain fog, and has been told it is anxiety. She mentions she fainted once at the gym last month. The practice nurse recorded a lying heart rate of 72 and a standing rate of 110 at 5 minutes, with no fall in BP.", src:"HRS expert consensus (2015) · NICE NG188"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Picks up the <b>exertional syncope</b> and arranges an ECG and urgent cardiology assessment before settling on PoTS; advises on driving. Explains the stand-test result and the criteria. Excludes anaemia, thyroid disease and medicines. Starts fluids, salt if safe, compression and recumbent exercise. Explains medicines are specialist-led. Validates her experience and safety-nets.", src:"ESC syncope guidelines (2018) · PoTS UK GP guide (2026)"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Every recommendation on this page traces to a named source. There is no NICE guideline on PoTS itself.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
