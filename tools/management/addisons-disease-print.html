  quickSub:"If you read nothing else on this page, read these six cards. Every figure traces to the source cited under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Adrenal crisis: hydrocortisone 100 mg IM/IV before ANY test", html:"Hypotension or collapse, vomiting, abdominal pain, fever, confusion — especially during illness or after missed steroid doses. Give hydrocortisone 100 mg IM or IV immediately and do not wait for cortisol results (NG243: never delay steroids for tests). Anyone — the patient, a relative or a carer — can give the IM injection. Then <b>1 L 0.9% saline IV over 30 minutes</b> (in hospital), treat hypoglycaemia, and <b>999 — rapid transport, ideally within 30 minutes</b>. Death is from hypovolaemic shock and hyperkalaemia, and the crisis is reversible with timely steroid."},
    {tone:"amber", h:"Up to 50% of Addison's is first diagnosed AT the crisis", html:"Keep a low threshold in unexplained shock — the new presentation can BE the crisis. The biochemical signature is hyponatraemia + hyperkalaemia ± hypoglycaemia (and mild hypercalcaemia) — <b>treat empirically while confirming</b>. Take a random cortisol (and ideally ACTH) before the steroid <b>only if it does not delay treatment</b>."},
    {tone:"blue", h:"The chronic picture is mislabelled for over a year", html:"Profound fatigue, weakness, anorexia, weight loss, nausea, postural dizziness — frequently mislabelled as depression, CFS, anorexia or IBS for months to years; the mean delay to diagnosis exceeds a year. The two most discriminating features of primary disease: <b>salt craving</b> (mineralocorticoid deficiency) and <b>hyperpigmentation</b> of palmar creases, buccal mucosa, scars and pressure areas. Low Na⁺ with high K⁺ on routine bloods is the classic trigger to think of it."},
    {tone:"green", h:"Confirm: 9am cortisol → short Synacthen → ACTH localises", html:"8–9am cortisol (NICE NG243, modern immunoassays): &lt;150 nmol/L → start management and refer to endocrinology; 150–300 → uncertain, consider repeating and seek endocrinology advice if it stays there; &gt;300 → very unlikely. Confirmation is by short Synacthen test (250 µg tetracosactide, cortisol at 0 and 30 min; failure to rise above ~&gt;430–550 nmol/L, lab-dependent, confirms). Then high ACTH + low cortisol = primary (Addison's); low or inappropriately normal ACTH = secondary — where <b>steroid withdrawal is the commonest cause</b>."},
    {tone:"purple", h:"The sick-day rules are the highest-yield intervention", html:"Rule 1 — oral: DOUBLE the glucocorticoid for fever, intercurrent illness or significant infection until recovered. Rule 2 — parenteral: vomiting, diarrhoea, or can't keep tablets down → IM hydrocortisone from the emergency kit + urgent help. Surgery, major dental work and colonoscopy prep need peri-procedure parenteral cover. Every patient carries the <b>NHS Steroid Emergency Card (2020) + MedicAlert</b> and an <b>in-date IM hydrocortisone kit</b> — and the family is trained to use it. <b>Adrenal crisis is largely preventable through education.</b>"},

         {tone:"red", h:"🔴 Shock + known or possible adrenal insufficiency", html:"Hypotension or postural drop, collapse, vomiting, abdominal pain, fever, confusion → 999 + immediate IM/IV hydrocortisone 100 mg. Often precipitated by illness or steroid withdrawal. Or milder symptoms in someone with known or high-risk adrenal insufficiency — the commoner primary-care presentation."},
         {tone:"red", h:"🔴 Hyponatraemia + hyperkalaemia", html:"Low Na⁺ with raised K⁺ ± hypoglycaemia and mild hypercalcaemia is the classic biochemical signature — treat empirically while confirming."},
         {tone:"red", h:"🔴 Intercurrent illness / missed steroids", html:"Any patient on long-term steroids who is vomiting, septic or has stopped their steroid → crisis risk. Give parenteral hydrocortisone."},
         {tone:"red", h:"🔴 Waterhouse–Friderichsen", html:"Adrenal haemorrhage in meningococcal or severe sepsis → purpura + shock → 999."},
         {tone:"red", h:"🔴 Hypoglycaemia", html:"Especially in children and in secondary adrenal insufficiency → treat with IV glucose + hydrocortisone."},
         {tone:"amber", h:"🟠 The new presentation can BE the crisis", html:"Up to 50% of Addison's is diagnosed at first crisis — keep a low threshold in unexplained shock."}
       ]},

    {id:"history", nav:"History", title:"The insidious picture and its mimics", sub:"Chronic primary adrenal insufficiency is notoriously non-specific — the mean delay to diagnosis exceeds a year.",
     blocks:[

         ["<b>Postural symptoms</b>","Dizziness or lightheadedness on standing → postural hypotension from aldosterone deficiency and volume depletion","Points to the mineralocorticoid axis"],
         ["<b>Hyperpigmentation</b>","Primary (Addison's) only: ACTH-driven pigmentation of palmar creases, buccal mucosa, scars and pressure areas. Absent in secondary (pituitary) causes","The other most-discriminating feature — <b>its absence does not exclude the disease</b>"],
         ["<b>Autoimmune clues</b>","Personal or family history of type 1 diabetes, autoimmune thyroid disease, vitiligo, pernicious anaemia, coeliac","Autoimmune polyglandular (Schmidt) syndrome — recognising the cluster shortens the diagnostic journey"],
         ["<b>Steroid history</b>","Abrupt withdrawal of long-term oral, inhaled or topical steroids → secondary (tertiary) adrenal insufficiency. Ask explicitly about steroid use","<b>Steroid withdrawal is the commonest cause of secondary insufficiency</b>"],
         ["<b>Other causes</b>","TB (the commonest cause worldwide), adrenal metastases or bilateral haemorrhage, adrenalectomy, drugs (ketoconazole, etomidate), HIV, infiltrative disease","Directs the cause work-up when antibodies are negative"]

     ]},

         ["<b>Pigmentation</b>","Palmar creases, buccal and gingival mucosa, recent scars, knuckles, pressure points","Primary disease only — elevated ACTH and POMC-derived peptides localise the lesion to the adrenal, not the pituitary"],

         ["<b>Hydration / volume</b>","<b>Dry mucous membranes, reduced skin turgor, tachycardia</b>","Volume depletion"],
         ["<b>Weight / muscle</b>","<b>Weight loss, muscle wasting, general debility</b>","Chronicity"],
         ["<b>Thyroid / other endocrine</b>","<b>Goitre or signs of hypo- or hyperthyroidism</b>","Polyglandular syndrome"]

     blocks:[
       {b:"table", head:["Test","Detail","Interpretation"], rows:[

         ["<b>Short Synacthen test — confirmatory</b>","<b>250 µg tetracosactide; cortisol at 0 and 30 minutes</b>","Failure to rise above the threshold (~&gt;430–550 nmol/L, lab-dependent) confirms adrenal insufficiency — the definitive primary-care-accessible confirmatory test"],
         ["<b>Plasma ACTH</b>","Paired with cortisol","High ACTH + low cortisol = primary (Addison's) · low or inappropriately normal ACTH = secondary (pituitary/hypothalamic)"],
         ["<b>U&amp;E / glucose</b>","At presentation","Hyponatraemia, hyperkalaemia, hypoglycaemia, mild hypercalcaemia, raised urea"],
         ["<b>Adrenal autoantibodies</b>","<b>21-hydroxylase antibodies</b>","<b>Positive in autoimmune Addison's — the commonest UK cause</b>"],
         ["<b>Renin / aldosterone</b>","Primary disease","<b>High renin with low aldosterone confirms mineralocorticoid deficiency</b>"],
         ["<b>Cause work-up</b>","Antibody-negative → adrenal CT (TB, haemorrhage, metastases, infiltration) + TB screen · secondary → pituitary MRI + full pituitary axis","<b>Antibody-negative disease mandates imaging</b>"]

       {b:"cards", items:[
         {tone:"purple", h:"NG12 criteria that surface in this work-up <span class='tw'>2WW</span>", html:"Addison's disease itself has no NICE NG12 suspected-cancer criterion, and this page does not invent one. But the cause work-up can surface cancer, and two NG12 routes matter here:<br>• Bilateral adrenal metastases found on CT as the cause of adrenal failure → refer via the appropriate suspected-cancer pathway for the primary — most often lung: NG12 gives chest X-ray (urgent, within 2 weeks) for the smokers over 40 with unexplained weight loss, appetite loss or fatigue that this presentation mimics, and a 2WW chest referral for CXR findings suggestive of lung cancer.<br>• The presenting complaint — unexplained weight loss with appetite loss in an adult — is itself an NG12 trigger symptom: if the adrenal work-up is negative, return to it (weight loss with abdominal pain aged 60+ → urgent direct-access CT for pancreatic cancer; consider CXR per above). <b>Do not let a normal Synacthen close the weight-loss question.</b>", src:"NICE NG12 (updated May 2025) · house rule"}

    {id:"ladder", nav:"Replace", title:"Replacement therapy — named drugs and doses", sub:"Lifelong, physiological, titrated clinically. Verify doses in the BNF; initiation is specialist-led.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Glucocorticoid", title:"Hydrocortisone 15–25 mg/day in 2–3 divided doses", when:"all patients, lifelong", fromLabel:"first-line",
          html:"Largest dose on waking to mimic the circadian rhythm (e.g. 10/5/5 mg) — the morning-loaded regimen reduces fatigue. Prednisolone once daily is an alternative. Titrate to wellbeing — never to a random cortisol."},
         {step:"Mineralocorticoid", title:"Fludrocortisone 50–200 µg once daily", when:"PRIMARY disease only", fromLabel:"not needed in secondary",
          html:"Titrate to BP, postural drop, electrolytes and plasma renin. Not needed in secondary (pituitary) insufficiency because the renin–angiotensin–aldosterone axis is preserved."},
         {step:"Selected", title:"DHEA", when:"specialist-led only", fromLabel:"impaired wellbeing despite optimal replacement",
          html:"<span class='rx'>DHEA 25\u201350 mg once daily in the morning</span> may be considered in some women with impaired wellbeing or libido despite adequate gluco- and mineralocorticoid replacement — specialist initiation, not routine."}
       ]},
       {b:"warn", html:"Never stop glucocorticoid abruptly — sudden cessation precipitates crisis. Under-replacement risks crisis; over-replacement causes Cushingoid harm — weight gain, hypertension, dysglycaemia and osteoporosis. Dose adequacy is judged clinically and biochemically, never by a single random cortisol."},
       {b:"why", html:"<b>Replacement aims to reproduce physiological cortisol secretion</b> — the adrenal output the body can no longer make. Mineralocorticoid replacement is the piece the non-specialist forgets: <b>it is required in primary disease only</b>, and its titration target is renin, postural BP and electrolytes rather than symptoms alone."}
     ]},

    {id:"sickday", nav:"Sick-day rules", title:"Sick-day rules and crisis prevention — the critical education", sub:"The most examinable, life-saving element of the whole condition. Rehearse it at every contact.",
     blocks:[
       {b:"kv", rows:[
         ["Sick-day rule 1 — oral","DOUBLE the oral glucocorticoid dose during fever, intercurrent illness or significant infection, until recovered"],
         ["Sick-day rule 2 — parenteral","Vomiting, diarrhoea, or unable to take or keep down tablets → IM hydrocortisone from the emergency injection kit + seek urgent medical help"],
         ["Procedures","Surgery, major dental work, colonoscopy prep → peri-procedure parenteral steroid cover per protocol — coordinate it, including for dental work"],
         ["Steroid Emergency Card","Issue the NHS Steroid Emergency Card (the 2020 initiative that standardised peri-operative and sick-day management) + a MedicAlert bracelet; ensure it is documented on the records and prescriptions"],
         ["Emergency kit","Provide an IM hydrocortisone injection kit; train the patient AND family or carers to use it; replace before expiry"],
         ["Never stop abruptly","Sudden cessation precipitates crisis — reinforce adherence at every review"]
       ]},
       {b:"say", html:"Your body can’t make its own steroid hormone any more, so the tablets do that job every day — and when you’re ill, your body would normally make more, so you double the dose. If you’re vomiting and can’t keep the tablets down, that’s what the injection is for: anyone can give it, then call for help straight away. Carry your steroid card everywhere, and never stop the tablets suddenly."},
       {b:"why", html:"Adrenal crisis is largely preventable through patient education, and patients who reliably apply the sick-day rules and carry emergency steroid have far fewer life-threatening episodes. The SCA examiner expects explicit, structured safety-netting delivered in plain language: double the oral dose for fever, switch to IM if vomiting, call for help. Empowering family members to inject provides the critical safety margin during severe illness."}
     ]},

    {id:"lifestyle", nav:"Living with it", title:"Self-management and living with adrenal insufficiency", sub:"Self-management is the cornerstone of preventing crisis.",
     blocks:[
       {b:"table", head:["Topic","Advice","Why"], rows:[
         ["<b>Adherence</b>","Lifelong, non-negotiable medication. Use reminders or dosette boxes; never run out — order in advance and carry spares when travelling","A missed supply is a crisis risk, not an inconvenience"],
         ["<b>Identification</b>","Carry the Steroid Emergency Card and wear a MedicAlert bracelet at all times","Makes the crisis treatable by strangers"],
         ["<b>Travel</b>","Extra medication and the IM hydrocortisone kit in hand luggage with a doctor's letter; know how to access care abroad","Hold luggage gets lost; crises don't wait"],
         ["<b>Vaccination &amp; infection</b>","Keep immunisations up to date; treat infections promptly and apply the sick-day rules early","Infection is the commonest precipitant"],
         ["<b>Family training</b>","Teach family and carers to recognise crisis and administer the emergency IM hydrocortisone","The patient who needs the injection most may be too unwell to give it"],
         ["<b>Support</b>","<b>Signpost the Addison's Disease Self-Help Group (ADSHG)</b>","Peer support and patient resources"]
       ]}
     ]},

    {id:"monitor", nav:"Monitor", title:"Follow-up and monitoring", sub:"Balance the harms of under- and over-replacement, and screen for the autoimmune cluster.",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["<b>Wellbeing, energy, weight, BP (lying AND standing), pigmentation</b>","<b>Each review</b>","<b>Adjust glucocorticoid; assess over- vs under-replacement</b>"],
         ["<b>U&amp;E ± plasma renin</b>","<b>Periodically</b>","Titrate fludrocortisone to normalise BP, postural drop and electrolytes (primary disease)"],
         ["<b>Sick-day knowledge, kit and card</b>","<b>Each review — re-educate at every contact</b>","Replace expired hydrocortisone; confirm the card is carried and the record flagged"],
         ["<b>Over-replacement screen</b>","Each review","Weight gain, hypertension, dysglycaemia, osteoporosis — minimise the glucocorticoid dose accordingly"],
         ["<b>Associated autoimmune disease</b>","<b>Periodically in autoimmune Addison's</b>","Screen for thyroid disease, B12 deficiency, coeliac and type 1 diabetes"],
         ["<b>Annual specialist review</b>","<b>Yearly</b>","Coordinate endocrinology follow-up; bone health assessment as indicated"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"📞 999 + IM hydrocortisone", html:"Vomiting, collapse, severe weakness, or any acute illness with shock — give the injection first (anyone can), then 999. Treat first, confirm later."},
         {tone:"amber", h:"🟠 Same-day / urgent", html:"Any acute illness or vomiting in a patient who cannot apply the sick-day rules · a patient found to have stopped their steroid · an expired or missing emergency kit in someone currently unwell."},
         {tone:"blue", h:"🩺 Routine review", html:"Annual replacement review · repeat prescriptions with no gaps · immunisations · new symptoms of the autoimmune cluster (thyroid, B12, coeliac, T1DM)."}
       ]},
       {b:"why", html:"Long-term monitoring balances the harms of under- and over-replacement and detects the additional autoimmune conditions that cluster with autoimmune Addison's. Repeated reinforcement of the sick-day rules at every encounter is the highest-yield safety intervention in the chronic care of this disease."}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — who, when, how urgently", sub:"Diagnosis and initiation are specialist-led; the GP delivers lifelong shared care.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999 / acute medicine", html:"Suspected adrenal crisis — admit after the first-dose parenteral hydrocortisone and IV fluids. Never delay the steroid for the ambulance."},
         {tone:"amber", h:"Urgent endocrinology", html:"New biochemical or clinical suspicion — low 9am cortisol, abnormal Synacthen, suggestive electrolytes — for confirmation, cause work-up and treatment initiation. <b>All confirmed or suspected disease is referred:</b> replacement, sick-day rules, the steroid emergency card and home IM hydrocortisone are initiated under endocrinology."},
         {tone:"blue", h:"Pituitary / neurosurgery", html:"Secondary insufficiency with a pituitary lesion on MRI → joint endocrine and neurosurgical care."},
         {tone:"amber", h:"Oncology <span class='tw'>2WW</span>", html:"Bilateral adrenal metastases identified on imaging as the cause (e.g. from lung cancer) → manage the primary malignancy via the appropriate suspected-cancer pathway — see the NG12 card under <a href='#workup'>Work-up</a>."},
         {tone:"green", h:"GP manages (shared care)", html:"Repeat prescriptions with no gaps · sick-day reinforcement at every contact · immunisations · monitoring between specialist reviews · coordinating the annual endocrinology review · flagging the record · peri-procedure steroid cover coordination."}
       ]},
       {b:"why", html:"Although diagnosis and stabilisation are specialist-led, primary care is central to safe long-term care: uninterrupted steroid supply, reinforcing the sick-day rules, and recognising decompensation early. Bilateral adrenal metastases are an important non-autoimmune cause and the route into the relevant cancer pathway."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only — the Casebook keeps the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 38-year-old woman attends with eighteen months of exhaustion, half a stone of weight loss and dizziness on standing, previously coded as low mood and tiredness-all-the-time. Bloods last week: Na⁺ 128, K⁺ 5.4. She mentions she has started salting everything she eats. Her sister has coeliac disease."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Connects <b>low Na⁺ + high K⁺</b> with the story rather than repeating the bloods; elicits <b>salt craving</b> and looks for <b>palmar-crease and buccal pigmentation</b> and a <b>postural drop</b>; asks explicitly about <b>steroid use</b>; arranges <b>9am cortisol, U&amp;E, glucose and ACTH</b> with <b>urgent endocrinology referral</b> rather than waiting; safety-nets in plain language — if you start vomiting or feel dramatically worse, that is an emergency: call 999 and say you may have an adrenal problem; and picks up the family autoimmune history. <a href='../../cases/addisons-disease.html'>Open the full casebook chapter →</a>"}
     ]}]},
