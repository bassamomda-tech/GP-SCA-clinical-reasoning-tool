  stemSub:"One page for antithrombotic prescribing. Pick the right CLASS by mechanism — arterial plaque needs an antiplatelet, stasis needs an anticoagulant, and a short list of conditions still needs warfarin. Then dose the DOAC properly using <b>creatinine clearance (Cockcroft-Gault), not the lab eGFR</b>, apply the indication-specific SPC criteria, set review and stop dates for DAPT and VTE, know the interactions and the <b>product-specific</b> missed-dose rules, switch per the SPC, respond to bleeding by severity under the local reversal protocol, and run the at-least-annual review that catches the silent dosing errors.",

    {t:"NICE NG196 (AF) · NG158 (VTE) · NG128 (stroke/TIA)"},

  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Dose by creatinine clearance, not eGFR", html:"The licences use creatinine clearance (Cockcroft-Gault). The lab reports eGFR, and the two diverge most in small elderly women — where CrCl runs far below eGFR. <b>So \"the standard dose\" overdoses exactly the patients who bleed.</b> <b>Calculate CrCl at initiation and at every review</b>, because weight and creatinine both drift."},
    {tone:"blue", h:"AF: apixaban 5 mg BD is the usual default", html:"<b>AF doses — never transfer these criteria to VTE treatment (Step 3).</b> Reduce to 2.5 mg BD only if TWO of: age ≥80 · weight ≤60 kg · creatinine ≥133 µmol/L. Rivaroxaban 20 mg OD with food (15 mg if CrCl 15–49) — 15 mg and 20 mg tablets must be taken with food. Edoxaban 60 mg OD (30 mg if CrCl 15–50, ≤60 kg, or with ciclosporin, dronedarone, erythromycin or ketoconazole). Dabigatran 150 mg BD (110 mg if ≥80 or on verapamil; contraindicated below CrCl 30). Dose each DOAC according to its indication-specific SPC."},
    {tone:"amber", h:"Under-dosing is an error too", html:"Giving apixaban 2.5 mg BD \"to be safe\" without meeting the AF criteria (two of the three) is under-anticoagulation, and it causes strokes. <b>Audit in both directions</b> — the reflex to reduce feels cautious and is not. Re-apply the rules at review rather than setting them once."},
    {tone:"red", h:"⛔ Never unilaterally stop specialist-mandated DAPT", html:"Stopping mandated dual antiplatelet therapy early risks stent thrombosis, which is often fatal — and leaving forgotten DAPT running for years causes bleeding. <b>Every DAPT patient needs a visible stop date on the repeat screen.</b> Many low-bleeding-risk procedures (some dental, skin and cataract work) can proceed without interruption — confirm with the proceduralist and current local protocol."},
    {tone:"amber", h:"The missed-dose rule is product-specific", html:"Apixaban (BD): take the missed dose immediately, then continue as before. Dabigatran (BD): the missed dose may be taken up to 6 hours before the next is due — omit it if less time remains. Rivaroxaban and edoxaban (OD): take immediately, then resume the normal schedule next day — rivaroxaban in the initial 15 mg BD VTE phase has different instructions. Use the current product-specific PIL/SPC; do not double doses unless the product-specific VTE regimen explicitly instructs this. The widely-quoted \"take it if under 6 hours late\" is the DABIGATRAN rule and does not apply to the others."},
    {tone:"purple", h:"🟣 Investigate unexplained bleeding — do not blame the drug", html:"Do not attribute unexplained anaemia, haematuria or rectal bleeding to the antithrombotic. Investigate the source and apply the relevant NG12 referral criteria independently of anticoagulation — bleeding on a DOAC does not by itself meet an NG12 criterion. Restated in <a href='#refer'>Refer</a>."}
  ],
  pathwaySub:"Seven steps, and most prescribing harm lives in steps two and three.",
  pathway:[
    {title:"Pick the class by mechanism", html:"Arterial plaque thrombus (ACS, stents, stroke/TIA, PAD) → antiplatelet. Stasis thrombus (AF, DVT/PE) → anticoagulant. Mechanical valve, moderate-to-severe mitral stenosis, triple-positive antiphospholipid syndrome → warfarin or specialist advice. CrCl below the licensed range or dialysis → anticoagulation/renal specialist advice, not automatic warfarin."},
    {title:"Calculate CrCl and apply the indication-specific SPC criteria", html:"<b>Cockcroft-Gault, not eGFR — and apply the criteria in both directions.</b> Never transfer the AF dose-reduction criteria to VTE treatment.", alert:true},
    {title:"Set the duration at the moment you prescribe", html:"VTE duration individualised (provoked VTE often 3 months) with the review date booked now; DAPT per the discharge summary or specialist plan with a visible stop date. <b>Duration drift is the commonest error on this page.</b>"},
    {title:"Check interactions and counsel on the day-to-day rules", html:"Enzyme inducers including St John's Wort, azoles, NSAIDs and OTC ibuprofen, PPI cover, the product-specific missed-dose rule, and the alert card."},
    {title:"Respond to bleeding by severity", html:"Nuisance bleeding is not a reason to stop. Major bleeding is hospital management under the local major-haemorrhage/reversal protocol. <b>And investigate the source before blaming the drug.</b>"},
    {title:"Switch per the SPC — no universal rule", html:"Warfarin → DOAC once the INR falls to the product-specific threshold in the SPC. DOAC → warfarin with overlap and INR monitoring as the SPC directs. DOAC → DOAC usually at the next scheduled dose. Check each product's SPC or ask the anticoagulation service."},
    {title:"Review at least annually — recalculate, re-justify, de-prescribe", html:"More often if CrCl is under 60, frail or over 75, intercurrent illness, fluctuating renal function or new interacting medicines. Weight and creatinine → recalculate CrCl and re-apply the SPC criteria; FBC and LFTs; is the indication still valid and the duration still current?"}
  ],

         ["<b>AF, DVT/PE</b>","<b>Fibrin-rich STASIS thrombus</b>","<b>Anticoagulant</b> — a DOAC first-line, warfarin for the exceptions"],
         ["Mechanical valve · moderate-to-severe mitral stenosis · triple-positive antiphospholipid syndrome","<b>Conditions where a DOAC is generally unsuitable</b>","<b>Warfarin</b> or specialist advice (or LMWH in pregnancy or cancer, per specialist advice). Bioprosthetic valves and TAVI are not restricted in the same way — check the specialist plan"],
         ["CrCl below the licensed range · dialysis","<b>DOAC use is indication- and product-dependent</b>","<b>Anticoagulation/renal specialist advice</b> — do not automatically substitute warfarin without considering the indication and local protocol"]

       {b:"dl", rows:[
         ["<b>The AF threshold — the decision itself lives on the AF page</b>","Offer anticoagulation at CHA₂DS₂-VASc ≥2. In men with a score of 1, consider anticoagulation after discussing benefits and risks. Female sex alone does not justify anticoagulation. Aspirin has NO role in AF stroke prevention. The scoring table, ORBIT and the modifiable bleeding risks, and the annual re-score rule are all on the <a href='atrial-fibrillation.html'>atrial fibrillation protocol</a> — one home for the AF decision, so the two pages cannot drift apart"],
         ["<b>Bleeding risk</b>","Use ORBIT (preferred by NG196) to estimate bleeding risk — it includes age, anaemia or low haemoglobin, bleeding history, renal impairment and antiplatelet treatment. Independently address modifiable risks including uncontrolled blood pressure, alcohol excess, NSAIDs, avoidable antiplatelets, anaemia and falls risk. A high ORBIT score is not a contraindication to anticoagulation — it guides risk reduction and shared decision-making"]
       ]}

    {id:"dose", nav:"Dose", title:"Step 2 — choose and dose the DOAC: indication-specific SPC criteria",
     sub:"This is the AF licence table. Dose each DOAC according to its indication-specific SPC. Never transfer the AF dose-reduction criteria to VTE treatment.",
     blocks:[
       {b:"table", head:["DOAC","Standard AF dose","Reduce to","When — AF licence criteria (check the current SPC)"], rows:[
         ["<b>Apixaban</b> (usual first choice)","<b>5 mg BD</b>","<b>2.5 mg BD</b>","<b>≥2 of: age ≥80 · weight ≤60 kg · creatinine ≥133 µmol/L</b> (separately, in AF, CrCl 15–29 per the SPC — not an extra criterion to carry across to other indications)"],
         ["<b>Rivaroxaban</b>","<b>20 mg OD with food</b>","<b>15 mg OD with food</b>","<b>CrCl 15–49</b> (AF; acute DVT/PE treatment and extended VTE prevention have separate schedules — Step 3)"],
         ["<b>Edoxaban</b>","<b>60 mg OD</b>","<b>30 mg OD</b>","Any of: CrCl 15–50 · ≤60 kg · P-gp inhibitors ciclosporin, dronedarone, erythromycin or ketoconazole (criteria are indication-specific — check the SPC)"],
         ["<b>Dabigatran</b>","<b>150 mg BD</b>","<b>110 mg BD</b>","<b>Age ≥80 · verapamil</b> (consider also at 75–80, CrCl 30–50, or high bleeding risk). <b>Contraindicated below CrCl 30 in the UK SPC</b> — particularly dependent on renal clearance"]
       ]},
       {b:"dl", rows:[
         ["<b>Calculating CrCl</b>","Cockcroft-Gault using actual body weight unless local guidance specifies adjusted weight in obesity. Do not calculate CrCl in acute kidney injury as though it were stable renal function"],
         ["<b>Choosing between them</b>","Apixaban has the best GI-bleed profile but is twice daily. Rivaroxaban and edoxaban are once daily — better for adherence and dosette boxes. Dabigatran is the only one with dyspepsia as a common side effect and is fully renally cleared. <b>Once-daily beats \"best on paper\" if adherence is shaky</b>"],
         ["<b>Under-dosing is an error too</b>","Giving apixaban 2.5 mg BD \"to be safe\" without meeting the AF criteria is under-anticoagulation, and that means strokes. Audit in both directions"],
         ["<b>Warfarin is still right for</b>","Mechanical valves (INR 2.5–3.5 depending on the valve) · moderate-to-severe mitral stenosis · triple-positive antiphospholipid syndrome. CrCl below the licensed range or dialysis requires anticoagulation/renal specialist advice — do not automatically substitute warfarin without considering the indication and local protocol"],
         ["<b>Extremes of body weight</b>","Check current ISTH guidance (international), the relevant SPC and local anticoagulation/haematology advice. Evidence is indication-specific; avoid extrapolating VTE guidance directly to AF. Use an accurate weight, and seek specialist advice where weight is substantially outside the trial populations"]
       ]},
       {b:"why", html:"DOACs beat warfarin on intracranial haemorrhage, interactions and monitoring burden — which is why they are first-line. But their safety was established at the licensed dose criteria, so the indication-specific SPC criteria ARE the treatment, not a footnote to it. And they are re-checked rather than set once, because renal function and weight both drift — the dose that was correct at 74 may be an overdose at 81."}
     ]},

       {b:"dl", rows:[
         ["<b>Renal and weight restrictions</b>","Check CrCl (Cockcroft-Gault) and weight against the VTE section of each SPC before loading. The AF apixaban age/weight/creatinine rule must not be transferred to VTE treatment — VTE treatment is 10 mg BD for 7 days then 5 mg BD; 2.5 mg BD is only for extended prevention. Rivaroxaban 15 mg and 20 mg tablets are taken with food"]

       {b:"table", head:["VTE type","Duration","Notes"], rows:[
         ["<b>Provoked</b> — surgery, immobility, COC, and the factor has now gone","<b>Usually 3 months, then review — stopping is not automatic</b>","Duration depends on whether the provoking factor has resolved, recurrence risk, bleeding risk, site and severity of VTE, ongoing hormonal exposure and patient preference. Book the review date at initiation — drift is the commonest error on this page"],

         ["<b>Unprovoked</b>","<b>≥3 months, then discuss indefinite treatment</b>","<b>Recurrence is roughly 10% per year off treatment.</b> Check bleeding risk. Unprovoked VTE also prompts the cancer thought — history, examination and bloods, not a blind CT"],
         ["<b>Active cancer</b>","<b>A DOAC or LMWH, chosen in consultation with the cancer/VTE team</b>","Consider LMWH where there is high gastrointestinal or genitourinary bleeding risk, major drug interaction with anticancer treatment, impaired absorption or other contraindication to a DOAC; also weigh tumour site, mucosal involvement, renal function and patient preference. Continue while the cancer is active; review every 3–6 months"],

    {id:"antiplatelet", nav:"Antiplatelets", title:"Step 4 — antiplatelet regimens: who, what, how long",
     blocks:[
       {b:"table", head:["Indication","Regimen","Second agent stops at"], rows:[
         ["<b>ACS — medically managed or PCI</b>","<b>Aspirin 75 mg OD lifelong + ticagrelor 90 mg BD</b> (or prasugrel/clopidogrel post-PCI)","Commonly 12 months — may be shortened or prolonged by bleeding and ischaemic risk, stent, PCI vs medical management and the cardiology plan. Follow the discharge summary; never extend or shorten unilaterally"],
         ["<b>Elective PCI, no ACS</b>","<b>Aspirin + clopidogrel 75 mg</b>","<b>Commonly 6 months</b> — varies with bleeding and ischaemic risk; per the specialist plan"],
         ["<b>Stroke / TIA, long-term</b>","<b>Clopidogrel 75 mg OD alone</b>","— (aspirin plus MR dipyridamole only if clopidogrel is not tolerated)"],
         ["<b>High-risk TIA or minor stroke</b> (specialist-initiated)","<b>Aspirin + clopidogrel, 300 mg loading doses</b>","<b>DAPT for 21 days → clopidogrel alone</b> — selected minor ischaemic stroke or high-risk TIA after specialist assessment; not for AF-related stroke prevention, haemorrhagic stroke, all TIA presentations or long-term secondary prevention"],
         ["<b>PAD</b>","<b>Clopidogrel 75 mg OD</b>","—"],
         ["<b>Primary prevention</b>","NO antiplatelet — aspirin has no primary-prevention role, including in diabetes","—"]
       ]},
       {b:"dl", rows:[
         ["<b>Gastroprotection</b>","Assess GI-risk factors and prescribe gastroprotection where indicated, particularly with DAPT, anticoagulant plus antiplatelet therapy, prior ulcer/bleed, NSAID/steroid use or other significant risk. Not every patient on a single antiplatelet needs a PPI, and age ≥65 alone is not enough without other GI-risk factors. Choose the PPI by indication and interaction: lansoprazole or pantoprazole are commonly preferred with clopidogrel — avoid omeprazole and esomeprazole with clopidogrel (CYP2C19) unless specialist advice supports their use"],
         ["<b>Triple therapy (AF plus a new stent)</b>","Triple therapy is specialist-directed and should be as short as clinically appropriate. Follow the cardiology discharge plan and confirm the stop date if it is not explicit"]
       ]},
       {b:"info", html:"Use the discharge summary or specialist plan for the exact DAPT regimen and stop date. Do not extrapolate one DAPT duration to all ACS, PCI or cerebrovascular presentations."},
       {b:"warn", html:"Stopping mandated DAPT early risks stent thrombosis, which is often fatal. Continuing forgotten DAPT for years risks bleeding. <b>Every DAPT patient needs a visible stop date on the repeat screen</b> — this is a prescribing-systems problem as much as a clinical one."}
     ]},

    {id:"rules", nav:"Day to day", title:"Step 5 — interactions, missed doses and the practical rules",
     blocks:[
       {b:"table", head:["Interaction","Effect","Action"], rows:[
         ["<b>Carbamazepine, phenytoin, phenobarbital, rifampicin, St John's Wort</b>","<b>Strong inducers of P-gp and CYP3A4 → DOAC levels FALL → clots</b>","Avoid, or seek specialist/anticoagulation pharmacist advice — options include changing the inducer or an alternative anticoagulant. St John's Wort is bought over the counter and must be asked about"],
         ["<b>Azole antifungals, HIV protease inhibitors, ciclosporin</b>","<b>Inhibit → DOAC levels RISE → bleeds</b>","<b>The effect differs between apixaban, rivaroxaban, edoxaban and dabigatran</b> — check the individual SPC or ask the anticoagulation pharmacist rather than applying a blanket rule"],
         ["<b>NSAIDs including OTC ibuprofen, SSRIs and SNRIs, steroids</b>","<b>Additive bleeding — platelet effect plus GI injury</b>","Increase bleeding risk but are not always absolute contraindications. Avoid NSAIDs where possible; if necessary, use the lowest dose for the shortest duration with appropriate risk assessment and gastroprotection. Counsel specifically about over-the-counter purchases"],
         ["<b>Amiodarone, verapamil, dronedarone</b>","<b>Moderate level rise</b>","<b>Dabigatran 110 mg with verapamil; edoxaban 30 mg with dronedarone</b>"],
         ["<b>A second antithrombotic</b>","<b>Multiplied bleeding risk</b>","<b>Only ever specialist-directed and time-limited</b>"]
       ]},
       {b:"table", head:["Situation","What to advise"], rows:[
         ["<b>Missed DOAC dose — product-specific, NOT one rule</b>","Apixaban (BD): take the missed dose immediately, then continue BD as before. Dabigatran (BD): the missed dose may be taken up to 6 hours before the next dose is due — omit it if less than 6 hours remain. Rivaroxaban and edoxaban (OD): take immediately and continue the normal OD schedule the next day — rivaroxaban in the initial 15 mg BD VTE phase has different instructions. Use the current product-specific PIL/SPC for missed or vomited doses. Do not double doses unless the product-specific VTE regimen explicitly instructs this — the widely-quoted \"take it if under 6 hours late\" is the dabigatran rule and does not apply to the others"],
         ["<b>Multiple missed doses</b>","Seek anticoagulation/pharmacy advice rather than automatically restarting or bridging, with an adherence and thrombotic-risk assessment. Recurrent misses → dosette box, a once-daily agent, or an adherence conversation. Because DOAC anticoagulant effect declines relatively quickly after missed doses, adherence is important"],
         ["<b>Vomiting the dose</b>","<b>No generic approach — use the current product-specific PIL/SPC.</b> If unclear, or with repeated vomiting, seek anticoagulation/pharmacy advice rather than guessing"],
         ["<b>Alert card</b>","Everyone on an anticoagulant carries one — for dentists, A&amp;E and pharmacists"]
       ]}
     ]},

    {id:"bleeding", nav:"Bleeding", title:"Step 6 — bleeding on antithrombotics: a graded response",
     blocks:[
       {b:"table", head:["Severity","Picture","Action"], rows:[
         ["<b>Nuisance</b>","Bruising, brief gum or nose bleeds","Reassure and do NOT stop. Fix the modifiables — blood pressure, alcohol, NSAIDs"],
         ["<b>Clinically relevant non-major</b>","Bleeding needing medical attention but not transfusion","Hold briefly, treat the source, review the dose against CrCl and the indication"],
         ["<b>Major</b>","Haemodynamic compromise, a critical-site bleed, a fall in haemoglobin needing transfusion","<b>Hospital management under the local major-haemorrhage/anticoagulant-reversal protocol.</b> Specific reversal may include idarucizumab for dabigatran, andexanet alfa where commissioned and indicated for apixaban/rivaroxaban, or PCC according to local specialist advice. Warfarin reversal generally requires PCC plus vitamin K — vitamin K alone is not immediate. Reversal is not required for every major bleed: it depends on timing of last dose, renal function, site and severity, and clinical and laboratory assessment"],
         ["<b>Head injury or neurological change on an anticoagulant</b>","Intracranial haemorrhage, which may be delayed after a head injury","<b>Urgent clinical assessment per the current NICE head-injury pathway.</b> Immediate emergency transfer (999) for neurological symptoms, loss of consciousness, significant mechanism, deterioration or clinical concern"]
       ]},
       {b:"warn", html:"Do not attribute unexplained anaemia, haematuria or rectal bleeding to the antithrombotic. Investigate the source and apply the relevant NG12 referral criteria independently of anticoagulation — see <a href='#refer'>Refer</a>. Do not stop anticoagulation solely to investigate stable bleeding without considering thrombotic risk."}
     ]},

    {id:"review", nav:"Review &amp; surgery", title:"Step 7 — the annual review and the peri-procedural rules",
     blocks:[
       {b:"table", head:["Annual review item","Why"], rows:[
         ["<b>Weight and creatinine → recalculate CrCl</b>","The dose that was right at 74 may be an overdose at 81 — re-apply the SPC criteria at least annually"],
         ["<b>Monitor more often than annually</b>","CrCl under 60 · frail or over 75 · intercurrent illness · fluctuating renal function · new interacting medicines. In renal impairment SPS suggests roughly CrCl ÷ 10 = months between checks (expert practice, not a universal rule)"],
         ["<b>FBC and LFTs</b>","<b>Anaemia means occult bleeding until explained</b>"],
         ["<b>Indication still valid, and duration check</b>","<b>VTE or DAPT past its documented stop or review date? De-prescribe per the plan</b>"],
         ["<b>Adherence and missed-dose pattern</b>","<b>Consider a once-daily agent or a dosette box</b>"],
         ["<b>Bleeding history, ORBIT and modifiable bleeding risks</b>","<b>Uncontrolled blood pressure, alcohol excess, NSAIDs, avoidable antiplatelets, anaemia, and a falls plan</b>"]
       ]},
       {b:"table", head:["Procedure situation","Rule"], rows:[
         ["<b>Apixaban, rivaroxaban, edoxaban</b>","Use the current UKCPA/BSH/local peri-operative anticoagulation protocol. Do not apply a single 24/48-hour rule — interruption depends on the DOAC, dose, CrCl, procedural bleeding risk, anaesthetic technique and timing. Neuraxial and spinal procedures require longer, specialist-defined interruption intervals"],
         ["<b>Dabigatran</b>","<b>Requires particular attention to CrCl — intervals vary substantially with renal function.</b> The stop interval depends on the individual agent, the CrCl and the bleeding risk of the procedure — follow the local or BSH peri-operative protocol and the surgical team's threshold rather than one remembered number"],
         ["<b>Antiplatelets</b>","<b>5–7 days where interruption is genuinely required</b>"],
         ["<b>Bridging for DOACs</b>","<b>Usually unnecessary — fast on, fast off. Very high thrombotic risk → specialist advice on peri-operative anticoagulation</b>"],
         ["<b>Dental work, skin surgery, cataract surgery</b>","Many low-bleeding-risk procedures can proceed without interruption or with timing adjustments and local haemostasis. Confirm with the proceduralist and current local protocol — not every dental, skin or cataract procedure is identical"],
         ["<b>Recent stent or ACS needing surgery</b>","<b>Cardiology discussion BEFORE anything is stopped</b>"]
       ]}
     ]},

    {id:"check", nav:"Before you change", title:"Before you start, stop or switch — the 5-point check",
     sub:"Wrong dose for the kidneys, drifted durations and unilateral stops of specialist drugs cause most antithrombotic harm.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"1 · Class", html:"Arterial → antiplatelet. AF or VTE → anticoagulant. Mechanical valve, moderate-to-severe mitral stenosis or triple-positive antiphospholipid syndrome → warfarin or specialist advice. Right aisle?"},
         {tone:"red", h:"2 · Dose", html:"<b>CrCl calculated, not eGFR?</b> <b>Indication-specific SPC criteria applied — in BOTH directions, AF criteria not transferred to VTE?</b>"},
         {tone:"amber", h:"3 · Duration", html:"<b>Is there a visible stop or review date for DAPT and VTE?</b> Has a specialist-set duration been respected?"},
         {tone:"amber", h:"4 · Interactions", html:"Inducers including St John's Wort, azoles, NSAIDs, a second antithrombotic — and is PPI cover indicated?"},
         {tone:"blue", h:"5 · Switching — per the SPC", html:"No universal switching rule. Warfarin → DOAC: start once the INR reaches the product-specific threshold in the SPC. DOAC → warfarin: overlap with INR monitoring as the SPC directs. DOAC → DOAC: usually at the next scheduled dose. If unsure, ask the anticoagulation service."},
         {tone:"green", h:"Complex?", html:"<b>Anticoagulation service, haematology or cardiology</b> — switching in valve disease, extremes of weight, or on a recent stent is not a solo decision."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Who to call",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Emergency", html:"Major or critical-site bleeding → hospital management under the local major-haemorrhage/anticoagulant-reversal protocol. Any head injury while anticoagulated requires urgent clinical assessment according to the current NICE head-injury pathway; immediate emergency transfer (999) for neurological symptoms, loss of consciousness, significant mechanism, deterioration or clinical concern — intracranial bleeding can be delayed."},
         {tone:"purple", h:"Suspected cancer · NICE NG12 (updated April 2026) — unexplained bleeding or anaemia", html:"<b>Do not attribute unexplained anaemia, haematuria or rectal bleeding to the antithrombotic — investigate the source and apply the NG12 criteria independently of anticoagulation.</b> Visible haematuria aged 45 and over → urgent suspected bladder or renal cancer referral. Confirmed iron-deficiency anaemia (needs appropriate GI investigation), rectal bleeding aged 50 and over, or unexplained weight loss with abdominal pain aged 40 and over → FIT (refer at ≥10 µg Hb/g) and the colorectal pathway."},
         {tone:"amber", h:"Cardiology", html:"Any change to mandated DAPT · triple-therapy planning · a recent stent needing surgery."},
         {tone:"amber", h:"Haematology", html:"Antiphospholipid syndrome · recurrent VTE on treatment · extremes of weight · CrCl below the licensed range or dialysis (with renal) · suspected heparin or DOAC failure."},
         {tone:"blue", h:"Anticoagulation service", html:"<b>Warfarin management, bridging plans and complex switches.</b>"},
         {tone:"cream", h:"GP management", html:"Class selection, CrCl-based dosing by the indication-specific SPC, VTE review and stop dates, antiplatelet durations and gastroprotection, interactions and missed-dose counselling, graded bleeding response, and the annual review all belong here. Related pages: <a href='atrial-fibrillation.html'>atrial fibrillation</a> · <a href='dvt.html'>DVT</a> · <a href='pulmonary-embolism.html'>pulmonary embolism</a> · <a href='stable-angina.html'>stable angina</a> · <a href='mi-secondary-prevention.html'>post-MI secondary prevention</a> · <a href='tia-stroke.html'>stroke and TIA</a>."}
       ]},
       {b:"say", html:"This tablet is protecting you from a stroke, and the trade-off is that you will bleed more easily. So we match the dose to your kidneys every year, we avoid ibuprofen-type painkillers, and if you ever see blood where it should not be, we look for the cause properly rather than just blaming the tablet."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"An <b>81-year-old woman weighing 54 kg</b> attends for her annual review. She has AF and takes <b>apixaban 5 mg BD</b>, started three years ago. Her <b>creatinine is 138 µmol/L</b> and the lab <b>eGFR reads 46</b>. She has recently started buying <b>ibuprofen gel and tablets</b> for knee pain, mentions <b>bruising \"more than I used to\"</b>, and her <b>haemoglobin has fallen from 126 to 104</b> since last year."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Recognises that, for AF, she meets the apixaban dose-reduction criteria on age and weight alone, and the serum creatinine is also above the threshold — so 5 mg BD is an overdose and should be 2.5 mg BD after confirming CrCl and indication-specific dosing; <b>calculates CrCl rather than reading the eGFR of 46</b>, and can explain why the two diverge in a small elderly woman; treats the falling haemoglobin as occult bleeding needing investigation, not as a side effect to accept — and applies the NG12 criteria independently of the anticoagulant rather than blaming the DOAC; <b>stops the oral NSAID and addresses the OTC purchase specifically</b>, offering topical or alternative analgesia; <b>does not stop the apixaban</b> for nuisance bruising, but does fix the modifiables; <b>uses ORBIT for bleeding risk and separately addresses blood pressure, alcohol and falls risk as modifiable bleeding risks</b>; and <b>documents the recalculated dose with the reasoning</b>, since this is precisely the silent error the annual review exists to catch."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG196 — Atrial fibrillation: diagnosis and management</b><br><a href="https://www.nice.org.uk/guidance/ng196/chapter/Recommendations" rel="noopener">nice.org.uk/guidance/ng196/chapter/Recommendations</a><span class="rd"> — DOAC first-line, anticoagulation offered at CHA₂DS₂-VASc ≥2 and considered in men scoring 1 (female sex alone does not justify it), ORBIT as the preferred bleeding-risk tool to guide risk reduction and shared decision-making rather than exclusion, and no role for aspirin in AF stroke prevention</span></li>'+
         '<li><b>NICE NG158 — Venous thromboembolic diseases</b><br><a href="https://www.nice.org.uk/guidance/ng158/chapter/Recommendations" rel="noopener">nice.org.uk/guidance/ng158/chapter/Recommendations</a><span class="rd"> — the apixaban and rivaroxaban loading schedules, the parenteral lead-in required for edoxaban and dabigatran, extended prevention dosing, and individualised provoked versus unprovoked duration decisions</span></li>'+
         '<li><b>NICE NG128 — Stroke and TIA in over 16s</b><br><a href="https://www.nice.org.uk/guidance/ng128/chapter/Recommendations" rel="noopener">nice.org.uk/guidance/ng128/chapter/Recommendations</a><span class="rd"> — clopidogrel 75 mg as long-term secondary prevention, the aspirin plus MR dipyridamole alternative, and the 21-day DAPT course after high-risk TIA or minor stroke</span></li>'+
         '<li>UKCPA / British Society for Haematology — peri-operative management of anticoagulation<span class="rd"> — DOAC interruption set by drug, dose, CrCl, procedural bleeding risk and anaesthetic technique (no single 24/48-hour rule), particular attention to CrCl for dabigatran, bridging usually unnecessary, and low-bleeding-risk procedures that may proceed without interruption</span></li>'+
         '<li><b>BNF and the individual Summaries of Product Characteristics</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — cross-check of doses, contraindications and interactions</span></li>'+
         '<li><b>Summaries of Product Characteristics — electronic medicines compendium</b><br><a href="https://www.medicines.org.uk/emc/search?q=apixaban" rel="noopener">apixaban</a> · <a href="https://www.medicines.org.uk/emc/search?q=rivaroxaban" rel="noopener">rivaroxaban</a> · <a href="https://www.medicines.org.uk/emc/search?q=edoxaban" rel="noopener">edoxaban</a> · <a href="https://www.medicines.org.uk/emc/search?q=dabigatran" rel="noopener">dabigatran</a> · <a href="https://www.medicines.org.uk/emc/search?q=clopidogrel" rel="noopener">clopidogrel</a> · <a href="https://www.medicines.org.uk/emc/search?q=ticagrelor" rel="noopener">ticagrelor</a> · <a href="https://www.medicines.org.uk/emc/search?q=prasugrel" rel="noopener">prasugrel</a> · <a href="https://www.medicines.org.uk/emc/search?q=idarucizumab" rel="noopener">idarucizumab</a> · <a href="https://www.medicines.org.uk/emc/search?q=andexanet" rel="noopener">andexanet alfa</a><span class="rd"> — the indication-specific DOAC dose criteria (dosing by Cockcroft-Gault CrCl rather than eGFR), the PRODUCT-SPECIFIC missed and vomited dose instructions, contraindications and interactions; check the current product information before prescribing</span></li>'+
         '<li><b>ISTH guidance on DOACs at extremes of body weight (international)</b><span class="rd"> — international, indication-specific guidance at extremes of body weight; check alongside the SPC and local haematology advice, and avoid extrapolating VTE guidance to AF</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — the haematuria, iron-deficiency anaemia and colorectal criteria, applied independently of anticoagulation when a patient on an antithrombotic bleeds</span></li>'+
         '<li><b>MHRA Drug Safety Updates</b><br><a href="https://www.gov.uk/drug-safety-update/direct-acting-oral-anticoagulants-doacs-reminder-of-bleeding-risk-including-availability-of-reversal-agents" rel="noopener">DOACs: bleeding risk and reversal agents</a> · <a href="https://www.gov.uk/drug-safety-update/prescribing-medicines-in-renal-impairment-using-the-appropriate-estimate-of-renal-function-to-avoid-the-risk-of-adverse-drug-reactions" rel="noopener">renal function: use Cockcroft-Gault CrCl</a><span class="rd"> — calculating CrCl because eGFR can overestimate renal function in older and low-weight adults; clopidogrel with omeprazole or esomeprazole via CYP2C19; DOAC interactions with enzyme inducers including St John\u2019s Wort; reversal agents and bleeding risk</span></li>'+
         '<li><b>SPS — DOACs (direct oral anticoagulants) monitoring</b><br><a href="https://www.sps.nhs.uk/monitorings/doacs-direct-oral-anticoagulants-monitoring/" rel="noopener">sps.nhs.uk</a><span class="rd"> — CrCl-based monitoring, more frequent checks in renal impairment (approximately CrCl ÷ 10 months, expert practice)</span></li>'+
         '<li><b>Greater Manchester Medicines Management Group — DOAC review protocol for non-valvular AF (2024)</b><br><a href="https://gmmmg.nhs.uk/" rel="noopener">gmmmg.nhs.uk</a><span class="rd"> — structured DOAC review of renal function, weight, blood count, indication and dose</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Antithrombotic prescribing in adults — NICE NG196 (AF), NG158 (VTE), NG128 (stroke/TIA) and BSH guidance. Choose the antithrombotic according to the indication. For DOACs, calculate Cockcroft-Gault CrCl rather than using eGFR and apply the indication-specific SPC criteria. Do not reduce doses without meeting the relevant criteria. Set a stop/review date for VTE and DAPT. Check interactions, adherence and missed-dose instructions. Investigate unexplained bleeding rather than attributing it to the drug. Manage major bleeding under the local reversal protocol. Review renal function, weight, blood count, liver function, indication and duration at least annually, and more often when clinically indicated. Never unilaterally stop specialist-mandated DAPT. Doses are licence-based; verify against the current BNF and your local formulary before prescribing."
});
