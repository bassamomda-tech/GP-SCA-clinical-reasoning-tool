<script>
MG.render({
  icon:"\u{1F54A}️",
  title:"Noisy respiratory secretions (“death rattle”) in the last days of life",
  eyebrow:"Protocol · last days of life · symptom control",
  stemTitle:"Noisy respiratory secretions — find the cause, explain, reposition, then consider an antimuscarinic trial if the person is distressed, and review it",
  stemSub:"A practical protocol for noisy upper-airway secretions in a person in the last days of life. The noise is usually more distressing to those at the bedside than to the dying person, so explanation is treatment. Non-drug measures come first; an antimuscarinic is a <b>trial</b> for the dying person's distress, monitored at least every 12 hours and stopped if it is not helping. These drugs dry new secretions but do not clear pooled ones, so if medication is appropriate an early trial is pragmatic practice — not evidence that early treatment improves outcomes. The evidence that any drug beats placebo is weak. Judge treatment primarily by the dying person's comfort. Doses and syringe-pump practice follow the current Greater Manchester Palliative Care Pain and Symptom Control Guidelines.",
  guideline:"NICE NG31 (2015) · NICE QS144 (2017) · Cochrane CD005177 (2008) · GMMMG Palliative Care Pain and Symptom Control Guidelines (Apr 2025) · Scottish Palliative Care Guidelines (external reference)",
  meta:[
    {t:"NICE NG31 (2015) · Care of dying adults in the last days of life"},
    {t:"NICE QS144 (2017) · quality standard"},
    {t:"Cochrane CD005177 (Wee &amp; Hillier 2008)"},
    {t:"GMMMG Palliative Care Guidelines (Apr 2025; review Apr 2028) — local dose authority"},

    {t:"Doses: current GMMMG guidelines / PCF8; verify with BNF", tone:"tw"}
  ],
  lead:'<div class="mg-layers"><a href="#assess"><b>Assess</b><small>Cause and differentials</small></a><a href="#family"><b>Explain</b><small>The family conversation</small></a><a href="#nondrug"><b>Non-drug</b><small>Position, fluids, mouth</small></a><a href="#drugs"><b>Antimuscarinic trial</b><small>Choose, give, review at 12 h</small></a></div>',
  glance:[
    {lbl:"First", val:"Assess + explain", sub:"cause, and the family's worry"},
    {lbl:"Non-drug", val:"Reposition", sub:"lateral / semi-prone; review hydration daily"},
    {lbl:"Drug trial", val:"Antimuscarinic", sub:"if the dying person is distressed — NG31 does not rank the four"},
    {lbl:"Review", val:"≥12-hourly", sub:"preferably 4-hourly (NG31)"},
    {lbl:"Stop/switch", val:"No benefit at 12 h", sub:"drugs may take up to 12 h to work"},
    {lbl:"Avoid", val:"Routine deep suction", sub:"gentle oral suction only if tolerated"}
  ],
  quickSub:"If you read nothing else, read these cards. Each is traced to its source under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"blue", h:"It usually does not distress the dying person", html:"The rattle comes from secretions pooling in the throat and upper airway of someone too weak or drowsy to cough or swallow them. NICE NG31 asks you to assess the likely cause and <b>reassure the family</b> that, although the noise can be distressing, it is <b>unlikely to cause the person discomfort</b>."},
    {tone:"amber", h:"Assess the cause before reaching for a drug", html:"NG31 starts with <b>assessing possible causes</b>. Not every wet chest in the dying is pooled saliva: consider <b>pulmonary oedema</b> (including fluid overload from clinically assisted hydration), <b>chest infection</b> and <b>aspiration</b>. The treatment and the conversation differ."},
    {tone:"green", h:"Non-drug measures first", html:"Reposition (side-lying or semi-prone to let secretions drain), mouth care, and review any clinically assisted hydration daily. <b>Avoid routine deep pharyngeal or tracheal suction</b> — it may be distressing and may provoke gagging or further secretions. Gentle oral/oropharyngeal suction may be considered for visible secretions in the mouth or upper airway, if tolerated and consistent with local nursing practice; stop if it causes distress."},
    {tone:"cream", h:"An antimuscarinic is a trial, not a fixture", html:"If the dying person appears distressed by the secretions, NG31 supports considering a trial of one of <b>atropine, glycopyrronium, hyoscine butylbromide or hyoscine hydrobromide</b>. Monitor <b>at least every 12 hours, preferably every 4 hours</b>; consider changing or stopping if there is no benefit after <b>12 hours</b>. If the person appears comfortable but relatives remain distressed, prioritise explanation, reassurance and support."},
    {tone:"red", h:"Watch for central side effects", html:"NG31: monitor for <b>delirium, agitation or excessive sedation</b> with <b>atropine or hyoscine hydrobromide</b> (both cross the blood–brain barrier). <b>Glycopyrronium and hyoscine butylbromide</b> have less central nervous system penetration and may be preferred when delirium or sedation is a concern, subject to the local formulary — but delirium and agitation can still occur, and all antimuscarinics can cause dry mouth, urinary retention, tachycardia and other adverse effects."},
    {tone:"blue", h:"Be honest about the evidence", html:"The Cochrane review (Wee &amp; Hillier 2008) found <b>no evidence that any intervention, drug or non-drug, is superior to placebo</b>. Set realistic expectations: judge treatment primarily by the dying person's comfort, distress and adverse effects, and also assess whether the family understands the cause, expected course and plan. Do not aim to abolish the sound simply because it is audible."}
  ],
  pathwaySub:"The whole approach in six moves. The alert step is where harm happens: a drug started without assessment, or never reviewed.",
  pathway:[
    {title:"Recognise and assess", html:"Confirm the person is thought to be in the last days of life — noisy breathing alone is not proof of imminent death, so reassess whether they are dying, stabilising or recovering (see <a href=\"../management/care-of-the-dying.html\">Care of the dying adult</a>). Listen, look and ask: is this upper-airway pooling, or pulmonary oedema, infection or aspiration? Assess the person directly for distress where possible, using collateral information from those who know them. Review fluids and current medicines."},
    {title:"Explain to the family", html:"Name it, explain the cause, say it is unlikely to be uncomfortable for the person, and say what you will do. Acknowledge that it is hard to listen to. This is the single most effective intervention for the people in the room."},
    {title:"Non-drug measures", html:"Reposition laterally or semi-prone, with the head and upper body positioned for comfort and secretion drainage (avoid forcing a head-down position); mouth care and small sips for comfort where safe and wanted; avoid routine deep suction — gentle oral/oropharyngeal suction may be considered for visible secretions if tolerated; review clinically assisted hydration daily and consider reducing or stopping it if there is fluid overload, worsening oedema, secretions attributable to hydration, or the person no longer wants it."},
    {title:"Consider an antimuscarinic trial if the person is distressed", html:"If the dying person appears distressed by the secretions, consider a trial of one antimuscarinic (PRN SC per the GMMMG guidelines, from the anticipatory medicines in the home) after explanation and non-drug measures. If the person appears comfortable but relatives remain distressed, prioritise explanation, reassurance and support; a trial may be considered through shared decision-making, explaining that it may not reduce the sound and has potential adverse effects. An early trial is pragmatic practice — these drugs reduce <b>new</b> secretion but do not clear what has already pooled — not evidence that early treatment improves outcomes.", alert:true},
    {title:"Review at 4–12 hours", html:"NG31: monitor at least 12-hourly, preferably 4-hourly, for comfort and distress, agitation or delirium, sedation, dry mouth, urinary retention, constipation, tachycardia, and the number and effect of PRN doses. If recurring after PRN doses, the chosen drug is often continued by CSCI (syringe pump). If no benefit after 12 hours, consider switching or stopping. If the person is unconscious and comfortable, do not escalate merely to eliminate the sound."},
    {title:"Support and escalate", html:"Keep explaining; document the plan; hand over to district nurses and out-of-hours; seek specialist palliative care advice for refractory secretions or diagnostic uncertainty. Use this alongside the local care of the dying adult and anticipatory-prescribing pathway."}
  ],
  sections:[

    {id:"assess", nav:"Recognise", title:"What it is and how to assess it", sub:"Noisy breathing from secretions in the oropharynx and upper airways in someone who can no longer clear them. Typically seen in the last hours to days of life, though timing varies.",
     blocks:[
       {b:"kv", rows:[
         ["What it is","Noisy, rattling or gurgling breathing, from turbulent airflow over secretions pooling in the oropharynx or upper airways, in a person too weak or drowsy to cough or swallow them. Often called “death rattle” — a term many families find frightening, so avoid it at the bedside."],
         ["How common","Reported in roughly <b>23–92%</b> of dying people in the studies summarised by the Cochrane review — the wide range reflects different definitions and settings."],
         ["What it signals","It typically appears when death is close (hours to a few days), but this is not deterministic: noisy breathing alone is not proof of imminent death, and diagnostic uncertainty or possible reversible illness warrants reassessing whether the person is dying, stabilising or recovering. When the person is dying, it is a sign of dying rather than a separate problem to be “fixed”."],
         ["Who it distresses","Usually <b>more distressing to family and staff than to the patient</b>, who is often drowsy or unconscious but may remain partly conscious — assess for distress directly where possible and use collateral information from those who know them. Explanation and reassurance are central to management."],
         ["What NG31 asks first","Assess for the possible causes, and talk to the dying person (if possible) and those important to them about the cause and what can be done."]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Assess the cause", html:"NG31 asks you to assess the possible causes of noisy respiratory secretions before managing them, and to consider non-pharmacological measures to reduce distress.", src:"NICE NG31 (2015)"}
       ]},
       {b:"dl", rows:[
         ["Bedside questions","Is the person conscious or distressed? Is the noise from the throat (gurgling, varies with position) or the chest (crackles, frothy sputum, breathlessness)? Any fever or purulent sputum? Any recent choking, vomiting or feeding? What fluids are running, and how much?"],
         ["Look for","Visible pooled saliva in the mouth; dependent oedema, raised JVP or fine crackles (fluid overload/heart failure); fever or new focal signs (infection); a history of dysphagia or vomiting (aspiration)."],
         ["Medicines review","Clinically assisted hydration (SC or IV), feeds, and any recent changes. Anticipatory medicines in the home — is an antimuscarinic prescribed with indication, dose, route, maximum PRN frequency and clear administration responsibility?"]
       ]},
       {b:"why", html:"The same sound can come from saliva pooled in the pharynx, bronchial secretions, pulmonary oedema or aspirated material. An antimuscarinic only reduces new salivary and bronchial secretion; it does nothing for oedema fluid or pus, and it will not help secretions that have already collected. Assessing first stops you giving a drug that cannot work and missing a cause that can be eased (for example by reviewing clinically assisted hydration)."}
     ]},

    {id:"diff", nav:"Differentials", title:"Differentials and when it is not “just secretions”", sub:"The response depends on the person's goals of care. In the last days of life most causes are managed for comfort, not reversed.",
     blocks:[
       {b:"table", head:["Cause","Clues","Comfort-focused response"], rows:[
         ["<b>Pooled oropharyngeal secretions</b> (typical “death rattle”)","Often drowsy or unconscious, but may be partly conscious; gurgling that changes with position; no fever, no breathlessness","Explain, reposition, mouth care; consider an antimuscarinic trial if the person appears distressed"],
         ["<b>Pulmonary oedema / fluid overload</b>","Breathlessness, orthopnoea, known heart failure, raised JVP, peripheral oedema, fine crackles, frothy sputum; running SC/IV fluids","Consider reducing clinically assisted hydration and a diuretic where consistent with goals and specialist advice. Antimuscarinics will not treat the underlying problem"],
         ["<b>Chest infection</b>","Fever, purulent sputum, new focal signs; person may be more aware and distressed","Antibiotics are not automatic: consider them when infection is likely, symptoms are significant, treatment is consistent with the person's wishes, and there is a reasonable prospect of comfort benefit. Treat symptoms (fever, breathlessness) either way"],
         ["<b>Aspiration</b>","Recent vomiting, choking on fluids or feeds, dysphagia (e.g. MND, stroke, head and neck cancer)","Stop the food, drink or feed causing choking if this aligns with the care plan; position for comfort; mouth care; seek palliative advice. Do not automatically use antibiotics or hospital transfer"],
         ["<b>Tumour-related</b> (bronchorrhoea, airway tumour, haemoptysis)","Known lung or head and neck cancer; copious watery sputum or blood","Specialist palliative care advice; plan for a catastrophic bleed if relevant"]
       ]},
       {b:"warn", html:"<b>Not certain the person is dying?</b> Noisy breathing alone is not proof of imminent death. If they may be stabilising or recovering, or the cause may be reversible and treatment matches their wishes, reassess rather than defaulting to end-of-life symptom control. NG31 asks for regular reassessment of whether the person is dying, stabilising or recovering, and QS144 statement 1 sets this as a quality standard. See <a href=\"../management/care-of-the-dying.html\">Care of the dying adult</a>."},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"Wet chest on clinically assisted hydration", html:"Assess hydration status daily and discuss the risks and benefits of hydration options with the person and those important to them. Consider reducing or stopping clinically assisted hydration if there is evidence of fluid overload, worsening oedema, increasing respiratory secretions attributable to hydration, or if the person no longer wants it — an individualised decision discussed with the person, where possible, and those important to them.", src:"NICE QS144 (2017) statement 4"},
         {tone:"red", h:"Sudden distress, not a gradual rattle", html:"Acute breathlessness, stridor, choking, or massive haemoptysis is a different emergency. Use the anticipatory plan for crisis medication and call for urgent palliative or out-of-hours support. 999 only if it matches the person's wishes and escalation plan."}
       ]}
     ]},

    {id:"family", nav:"Explain", title:"Explaining to the family", sub:"The most important intervention. NG31 frames it as a conversation about cause, likely comfort and what will be done.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"What NG31 asks you to cover", html:"Assess the likely causes, establish whether the noise is having an impact on the dying person or those important to them, and reassure them that, although the noise can be distressing, it is <b>unlikely to cause discomfort</b>.", src:"NICE NG31 (2015)"},
         {tone:"amber", h:"Set expectations about medicines", html:"The medicine dries up new secretions but cannot remove what has already collected, may take hours to help, does not always work, and can cause side effects such as dry mouth, restlessness or urinary retention. Its effect will be reviewed and it will be stopped if it is not helping.", src:"NICE NG31 (2015) · Scottish Palliative Care Guidelines PIL (2024)"}
       ]},
       {b:"dl", rows:[
         ["Checking understanding","Ask what they have noticed and what they are worried about. Families often fear the person is drowning or choking, or is thirsty. Name the fear and answer it directly."],
         ["Avoid the phrase “death rattle”","Use “noisy breathing” or “secretions at the back of the throat”. Be honest that it usually means death is close, if they ask or seem ready to hear it."],
         ["If the person appears comfortable","Focus on explanation, repositioning, mouth care and family support. A medication trial may be considered after shared discussion if the family's distress remains significant, explaining that it may not abolish the sound and may cause harm. Do not let the family believe a drug is needed because the person is suffocating."]
       ]},
       {b:"say", html:"“The noise you can hear is caused by a little saliva and fluid collecting at the back of the throat. Your mum is now too sleepy to swallow or cough it away, which is a normal part of the body slowing down. I know it's hard to listen to, but from everything we understand it doesn't seem to trouble the person themselves — she isn't choking or struggling. We'll turn her onto her side, which often helps, keep her mouth moist, and if she seems uncomfortable we can give a medicine that dries up new secretions. It doesn't always stop the sound completely and it can have side effects, so the nurses will check how she's doing and stop it if it isn't helping.”"},
       {b:"why", html:"Family members may remember the sounds of a death for a long time, and what they were told about them. Because the evidence for drugs is weak, a clear and compassionate explanation is the part of this protocol most likely to make a real difference to those in the room."}
     ]},

    {id:"nondrug", nav:"Non-drug", title:"Non-drug measures", sub:"NG31 asks you to consider non-pharmacological measures for noisy secretions to reduce distress. These are low-risk and should always be tried.",
     blocks:[
       {b:"tiles", v:"life", items:[
         {t:"\u{1F6CF}️ Reposition", html:"Turn onto the side or semi-prone, with the head and upper body positioned for comfort and secretion drainage — avoid forcing a head-down position. Positioning should be comfort-led and consistent with the care plan. Often the quickest improvement. Reposition regularly for pressure care anyway."},
         {t:"\u{1F4A7} Review fluids", html:"Review clinically assisted hydration (SC or IV) daily. Consider reducing or stopping it if there is fluid overload, worsening oedema, increasing secretions attributable to hydration, or if the person no longer wants it — individualised and discussed with the person, where possible, and those important to them. Stopping is not automatically indicated for noisy secretions. Distinguish clinically assisted hydration from oral sips for comfort and from clinically assisted nutrition or enteral feeding: mouth care and small sips, where safe and wanted, remain appropriate even when clinically assisted hydration is stopped."},
         {t:"\u{1F444} Mouth care", html:"Keep the mouth clean and moist (sponge, gel, lip balm). Antimuscarinics dry the mouth, so mouth care becomes more important once one is started."},
         {t:"\u{1F6AB} Avoid routine deep suction", html:"Avoid routine deep pharyngeal or tracheal suction: it may be distressing and may provoke gagging or further secretions. Gentle oral/oropharyngeal suction may be considered for visible secretions in the mouth or upper airway, if tolerated and consistent with local nursing practice. Stop if it causes distress; suction is never automatic."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"Consider non-pharmacological measures", html:"NG31 recommends considering non-pharmacological measures to manage noisy respiratory secretions to reduce distress in the dying person.", src:"NICE NG31 (2015)"},
         {tone:"amber", h:"Hydration: assess daily, discuss openly", html:"Hydration status assessed daily, with a discussion of risks and benefits of hydration options. Clinically assisted hydration may help thirst in some people but can worsen secretions and oedema in others — consider reducing or stopping it if secretions attributable to hydration increase, there is fluid overload, or the person no longer wants it.", src:"NICE QS144 (2017) statement 4"}
       ]},
       {b:"why", html:"Repositioning uses gravity to move pooled secretions away from the larynx and changes the airflow that makes the noise. Deep suction is invasive and stimulates further secretion; in a person who is dying, the balance of harm and benefit is poor. Avoiding fluid overload matters because oedema fluid in the lungs produces a similar noise that no antimuscarinic will treat."}
     ]},

    {id:"drugs", nav:"Antimuscarinic trial", title:"Antimuscarinic trial — which drug and how to use it", sub:"NG31 names four antimuscarinics and does not rank them. Choice follows the GMMMG palliative-care guidelines/local formulary and the person's situation; doses per the current GMMMG guidelines (PCF8 supporting).",
     blocks:[
       {b:"ladder", steps:[
         {step:"1", title:"Decide whether a drug trial is warranted", when:"dying person appears distressed",
          html:"NG31: consider a trial of medicine if the secretions are causing distress to the dying person. If the person appears comfortable, focus on explanation, repositioning, mouth care and family support. A medication trial may be considered after shared discussion if relatives' distress remains significant — NICE notes there is no evidence that this improves patient or family outcomes — explaining that it may not abolish the sound, may cause harm, and is not needed because the person is suffocating."},
         {step:"2", title:"Choose one antimuscarinic", when:"per local formulary",
          fromLabel:"tailor to the person",
          html:"NG31 does not rank the four. <b>Glycopyrronium</b> or <b>hyoscine butylbromide</b> have less central nervous system penetration and may be preferred when delirium or sedation is a concern, subject to the local formulary; <b>hyoscine hydrobromide</b> and <b>atropine</b> cross the blood–brain barrier (more sedation, delirium and agitation). All can cause dry mouth, urinary retention, tachycardia and other adverse effects. <b>Local prescribing rule (not a NICE requirement): do not combine two antimuscarinics.</b>"},
         {step:"3", title:"If appropriate, give early, PRN subcutaneously", when:"when secretions first cause distress",
          fromLabel:"dries new, not pooled, secretions",
          html:"Use the anticipatory supply already in the home. If medication is appropriate, consider an early trial when secretions are first causing distress, because the drug reduces new secretion but cannot clear what has already pooled — pragmatic practice rather than evidence that early treatment improves outcomes. Dose, repeat interval and 24-hour maximum per the current GMMMG guidelines (see drug table below)."},
         {step:"4", title:"Continue by syringe pump if recurring", when:"repeated PRN doses",
          fromLabel:"escalate delivery, not the number of drugs",
          html:"If secretions recur after PRN doses and the drug is helping, the same antimuscarinic is usually given by continuous subcutaneous infusion (CSCI), with PRN doses still available. Check compatibility with other syringe-pump drugs using the GMMMG guidelines. The prescribing clinician writes the CSCI dose and PRN maximum; the district nurse sets up and reviews the syringe pump."},
         {step:"5", title:"Review at 4–12 hours; stop or switch if no benefit", when:"NG31 monitoring rule",
          fromLabel:"a trial must be reviewed",
          html:"Monitor for benefit <b>at least every 12 hours, preferably every 4 hours</b>. Medicines may take up to 12 hours to become effective, so consider <b>changing or stopping</b> if secretions continue to cause distress after 12 hours. Monitor comfort, observable and respiratory distress, agitation or delirium, sedation, dry mouth, urinary retention, constipation, tachycardia, and the number and effect of PRN doses. If the person is unconscious and comfortable, do not escalate merely to eliminate the sound.", warn:true, tone:"red"}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"The four named antimuscarinics", html:"When choosing, NG31 lists <b>atropine, glycopyrronium bromide, hyoscine butylbromide and hyoscine hydrobromide</b>, and does not rank them.", src:"NICE NG31 (2015)"},
         {tone:"red", h:"Central side effects", html:"Monitor regularly for side effects, particularly <b>delirium, agitation or excessive sedation</b> when using <b>atropine or hyoscine hydrobromide</b>.", src:"NICE NG31 (2015)"},
         {tone:"blue", h:"Monitoring frequency", html:"Monitor for improvement preferably every 4 hours, but at least every 12 hours. Consider changing or stopping if secretions continue and are still causing distress after 12 hours.", src:"NICE NG31 (2015)"},
         {tone:"amber", h:"Anticipatory prescribing", html:"Prescribe anticipatory medicines with individualised indications, dosage and route for adults likely to need symptom control in the last days of life — include an antimuscarinic where the person is likely to need one, with indication, dose, route, maximum PRN frequency, clear instructions, named prescriber/administration responsibility and a review plan.", src:"NICE QS144 (2017) statement 3"}
       ]}
     ]},

    {id:"drugtable", nav:"Drug choice", title:"Drug choice and cautions", sub:"Pharmacology the GP needs. Doses are deliberately not reproduced here: use the current GMMMG Palliative Care Pain and Symptom Control Guidelines (PCF8 supporting) and verify against the BNF.",
     blocks:[
       {b:"table", head:["Drug","Crosses the blood–brain barrier?","Practical points","Dose"], rows:[
         ["<b>Glycopyrronium bromide</b>","No (quaternary)","Sedation and delirium less likely, but not excluded. SC PRN and by CSCI","<b>200 micrograms SC</b> PRN (GMMMG local example). Repeat interval, 24-hour maximum and CSCI dose: per the current GMMMG guidelines"],
         ["<b>Hyoscine butylbromide</b>","No (quaternary)","Sedation less likely, but not excluded. Also used for colic and bowel obstruction. SC PRN and by CSCI. Different drug from hyoscine hydrobromide — check the salt on every chart","Per the current GMMMG guidelines"],
         ["<b>Hyoscine hydrobromide</b>","Yes","Sedating; can cause <b>delirium, agitation</b> (paradoxical excitation) — NG31 caution. Also available as a transdermal patch (off-label for secretions)","Per the current GMMMG guidelines. Patch: external reference only (Scottish Palliative Care Guidelines leaflet, not the local dose authority) describes a 1.5 mg patch behind the ear changed every 72 hours — check the local formulary before use"],
         ["<b>Atropine</b>","Yes","Can cause delirium, agitation, sedation and tachycardia — NG31 caution. Sometimes used sublingually (eye-drop preparation) off-label","Per the current GMMMG guidelines"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"Hyoscine hydrobromide patch", html:"A patch prevents new secretions forming but has <b>no effect on secretions already formed</b>. Its use for secretions is outside the licence, which is common and accepted practice in palliative care. Scottish guidance is an external reference — check the GMMMG guidelines and local formulary before use.", src:"Scottish Palliative Care Guidelines hyoscine hydrobromide PIL (2024)"},
         {tone:"cream", h:"Glycopyrronium PRN", html:"The Greater Manchester palliative-care guidelines give a local example of glycopyrronium <b>200 micrograms SC</b> as needed for respiratory secretions. UK end-of-life dose schedules and syringe-pump maxima differ, so follow the current GMMMG version for the repeat interval, 24-hour maximum, CSCI range and compatibility, rather than mixing external dose schedules.", src:"GMMMG Palliative Care Pain and Symptom Control Guidelines for Adults (modified Apr 2025, review Apr 2028)"},
         {tone:"red", h:"Common antimuscarinic adverse effects", html:"Dry mouth (step up mouth care), urinary retention (check for a palpable bladder if the person becomes restless), constipation, tachycardia. Central effects (confusion, agitation, sedation) mainly with atropine and hyoscine hydrobromide, but possible with any antimuscarinic.", src:"NICE NG31 (2015) · BNF"},
         {tone:"blue", h:"Butylbromide vs hydrobromide mix-ups", html:"The two hyoscine salts have very different doses and central effects. Write the salt in full on every prescription and anticipatory chart, and check it when administering."}
       ]},
       {b:"why", html:"Glycopyrronium and hyoscine butylbromide are quaternary ammonium compounds, which cross the blood–brain barrier poorly, so sedation and delirium are less likely — though not guaranteed to be absent. Atropine and hyoscine hydrobromide are tertiary amines that do cross it, which is why NG31 singles them out for monitoring of delirium, agitation and sedation. In a person who is already drowsy, extra sedation may be acceptable; in a person with terminal agitation, adding a centrally acting antimuscarinic can make things worse."}
     ]},

    {id:"evidence", nav:"Evidence", title:"How good is the evidence?", sub:"Weak. Know it, so you can be honest with families and colleagues.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Cochrane review", html:"Wee &amp; Hillier, <i>Interventions for noisy breathing in patients near to death</i>, Cochrane CD005177 (2008). Four studies met the inclusion criteria. There was <b>no evidence that any intervention, pharmacological or non-pharmacological, was superior to placebo</b>. One large study comparing atropine, hyoscine hydrobromide and hyoscine butylbromide found no difference between them.", src:"Cochrane CD005177 (Wee & Hillier 2008)"},
         {tone:"blue", h:"NICE NG31 research recommendation", html:"NG31 lists as a research priority whether antisecretory antimuscarinic drugs used alongside nursing interventions (such as repositioning and oropharyngeal suction) are better than nursing interventions alone at reducing noisy secretions.", src:"NICE NG31 (2015) research recommendations"}
       ]},
       {b:"why", html:"NICE NG31 still supports a <b>monitored trial</b> of an antimuscarinic for distress in the dying person, because the symptom is common and the drugs are well understood. NICE notes that antimuscarinics are sometimes given to reduce relatives' distress, despite no evidence that this improves patient or family outcomes. The weak evidence is the reason NG31 builds in review at 12 hours and the option to stop. It also explains why no single drug is recommended over another."}
     ]},

    {id:"monitor", nav:"Review", title:"Monitoring and review", sub:"The NG31 monitoring rule, plus what to check on each visit.",
     blocks:[
       {b:"table", head:["When","What to check","Action"], rows:[
         ["<b>Every 4 hours</b> (preferred) — <b>at least every 12 hours</b>","The person's comfort and observable distress, respiratory distress, agitation or delirium, sedation, dry mouth, urinary retention, constipation, tachycardia, and the number and effect of PRN doses","Continue if helping; reposition; mouth care. If the person is unconscious and comfortable, do not escalate merely to eliminate the sound. NG31 monitoring rule"],
         ["<b>12 hours</b> after starting","Is there any benefit?","If secretions continue to cause distress after 12 hours, consider changing or stopping the drug (NG31)"],
         ["After repeated PRN doses","How many doses in 24 hours, and did each help?","If recurring and helping, consider continuing by CSCI with PRN still available"],
         ["<b>Daily</b>","Hydration status and fluid plan; is the person still dying, or stabilising?","Discuss hydration options (QS144 statement 4); reassess the diagnosis of dying (QS144 statement 1)"],
         ["Every visit (family contact, separate from the clinical review)","Family understanding and coping","Repeat the explanation; offer support; check they know who to call"]
       ]},
       {b:"timeline", items:[
         {n:"1", when:"First rattle", title:"Assess, explain, reposition", html:"Assess cause, explain to family, reposition, mouth care, review fluids. Consider a PRN antimuscarinic early if the secretions appear to distress the person."},
         {n:"2", when:"Within 4 hours", title:"First review", html:"Has the noise eased? Any side effects? Repeat PRN if needed (per the GMMMG guidelines)."},
         {n:"3", when:"By 12 hours", title:"Decide", html:"Benefit → continue (CSCI if recurring). No benefit and still distressing → consider switching or stopping. Keep the non-drug measures going."},
         {n:"4", when:"Ongoing", title:"Comfort focus", html:"Judge treatment primarily by the person's comfort, distress and adverse effects; also check the family understands the cause, expected course and plan. Do not aim to abolish the sound."}
       ]}
     ]},

    {id:"community", nav:"At home", title:"Community practicalities for the GP", sub:"Most of this is prevention: the right drug in the house before the rattle starts.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"Anticipatory medicines in the home", html:"Where the person is likely to need one, prescribe an antimuscarinic with the other anticipatory medicines — individualised, with indication, dose, route, maximum PRN frequency, clear instructions, named prescriber/administration responsibility and a plan for review — and make sure it has been dispensed and is in the home. Complete the community authorisation chart.", src:"NICE QS144 (2017) statement 3"},
         {tone:"cream", h:"Individualised care plan", html:"Record the plan (including the approach to secretions and hydration) in an individualised care plan, discussed with the person and those important to them, and share it with district nurses and out-of-hours.", src:"NICE QS144 (2017) statement 2"}
       ]},
       {b:"dl", rows:[
         ["Prepare the family","Tell the family in advance that noisy breathing may happen near the end and what it means, so it is not a shock at 3 a.m. Tell them who to call (district nurse, out-of-hours, hospice advice line)."],
         ["Syringe pump","If a CSCI is started, the prescribing clinician writes the dose from the current GMMMG guidelines and the district nurse sets it up and reviews it; check the combination and compatibility with other syringe-pump drugs per the GMMMG guidelines, and that PRN doses remain prescribed."]
       ]},
       {b:"p", html:"This protocol sits within the local care of the dying adult and anticipatory-prescribing pathway. For the wider framework — recognising dying, the five Priorities for Care, rationalising medicines, anticipatory prescribing for all five common symptoms and what to do after death — see <a href=\"../management/care-of-the-dying.html\">Care of the dying adult</a>."}
     ]},

    {id:"refer", nav:"Refer", title:"When to seek specialist advice", sub:"Specialist palliative care advice lines (hospice or community team) are available 24/7 in most areas.",
     blocks:[
       {b:"table", head:["Situation","Who","What to share"], rows:[
         ["Secretions not responding to repositioning plus an antimuscarinic trial","Specialist palliative care (advice line or visit)","Drug, doses and timings given; effect at each review; fluids running; family concerns"],
         ["Diagnostic uncertainty (secretions vs oedema vs infection vs aspiration)","Specialist palliative care; consider GP or out-of-hours visit","Examination findings, fluid balance, cardiac history, goals of care"],
         ["Agitation or delirium after an antimuscarinic","Specialist palliative care; see palliative delirium guidance","Which drug, when started, bladder check"],
         ["Tumour-related secretions, bronchorrhoea or risk of major bleed","Specialist palliative care","Diagnosis, site, current plan"],
         ["Family very distressed or in conflict about the plan","Specialist palliative care; hospice family support","What has been explained, and their main concern"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Advice from experienced colleagues", html:"Seek advice from colleagues with experience of palliative care when the diagnosis of dying is uncertain or symptoms are not controlled.", src:"NICE NG31 (2015)"}
       ]},
       {b:"dl", rows:[
         ["Bereavement","Distressed families need ongoing explanation during the dying phase and bereavement support afterwards; this is part of management, not an add-on."]
       ]}
     ]},

    {id:"safety", nav:"Safety-net", title:"Safety-netting for the family", sub:"What to tell those at the bedside before you leave.",
     blocks:[
       {b:"say", html:"“The noisy breathing may come and go, and it may get louder when she's on her back — turning her onto her side often helps. The nurses will review the medicine within the next few hours and at least twice a day. If she seems to be struggling to breathe, looks distressed or in pain, is restless or agitated, or if you are worried at any time, day or night, please use the district nurse, hospice or out-of-hours number on the care plan. If there is severe distress, choking, major bleeding or another emergency, follow the agreed escalation plan. Call 999 only if this is consistent with her wishes and the documented goals of care.”"},
       {b:"dl", rows:[
         ["Call for help if","The person looks distressed or breathless; new agitation or restlessness (consider urinary retention or the drug itself); choking, vomiting or bleeding; the family cannot cope."],
         ["Expected changes","Noisy breathing that settles with repositioning; pauses in breathing; cool hands and feet; sleeping most of the time. Explain these in advance."]
       ]}
     ]},

    {id:"pitfalls", nav:"Pitfalls", title:"Common pitfalls", sub:"Where care most often goes wrong.",
     blocks:[
       {b:"dl", rows:[
         ["Starting a drug without assessing the cause","Pulmonary oedema from SC/IV fluids or heart failure will not respond to an antimuscarinic. Assess first (NG31)."],
         ["Waiting too long","Antimuscarinics reduce new secretion only. Started late, when secretions have pooled, they may help less — a pragmatic rationale; evidence that early treatment improves outcomes is weak."],
         ["Never reviewing the trial","NG31: review at least every 12 hours, and consider changing or stopping if no benefit after 12 hours."],
         ["Ignoring central side effects","Delirium, agitation or sedation with atropine or hyoscine hydrobromide may be mistaken for terminal agitation and lead to more sedation."],
         ["Mixing up the hyoscine salts","Butylbromide and hydrobromide have different doses and effects. Write the salt in full."],
         ["Two antimuscarinics at once","Local prescribing rule rather than a NICE requirement: adds side effects without evidence of added benefit. Switch rather than add."],
         ["Routine deep suction","May be distressing and may provoke gagging or further secretions. Gentle oral/oropharyngeal suction may be considered for visible secretions if tolerated; stop if it causes distress."],
         ["Treating the noise, not the person","The dying person's comfort is the primary outcome; family understanding and support are additional outcomes. Promising silence sets everyone up to fail."],
         ["Forgetting fluids","Clinically assisted hydration running unchanged while secretions increase. Review daily (QS144 statement 4)."],
         ["Treating the rattle as proof of dying","Noisy breathing is common in the last days of life but does not prove death is imminent. Diagnostic uncertainty or possible reversible illness warrants reassessment of whether the person is dying, stabilising or recovering."]
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"Telephone or home-visit consultation: the daughter of an 84-year-old woman with metastatic breast cancer, expected to die at home within days, calls at the end of the day. “She's making a horrible gurgling noise — is she drowning? Should we call an ambulance?” An SC fluid infusion was started two days ago by a visiting team."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Explores what the daughter has noticed and fears; assesses for distress, breathlessness, fever and fluid overload; explains the cause and that it is unlikely to be distressing to her mother; gives positioning advice; reviews the SC fluids; checks anticipatory medicines are in the house and arranges a district nurse to give an antimuscarinic if her mother appears distressed; explains review within hours and stopping if unhelpful; safety-nets with the care-plan numbers and the agreed escalation plan, with 999 only if consistent with her mother's wishes and documented goals of care; offers support. <a href='../management/care-of-the-dying.html'>Care of the dying adult →</a>"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every recommendation on this page is traceable to a named source. Recommendation numbers are not quoted where they could not be checked.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG31 — Care of dying adults in the last days of life (December 2015)</b><br><a href="https://www.nice.org.uk/guidance/ng31/chapter/Recommendations" rel="noopener">nice.org.uk/guidance/ng31/chapter/Recommendations</a><span class="rd"> — assess causes of noisy respiratory secretions; consider medication if the secretions cause distress to the dying person (no evidence that treating for the distress of relatives improves outcomes); review hydration daily and reduce or stop it if there are signs of harm; talk to the person and family; non-pharmacological measures; trial of atropine, glycopyrronium, hyoscine butylbromide or hyoscine hydrobromide; monitor preferably 4-hourly, at least 12-hourly; consider changing or stopping after 12 hours; monitor for delirium, agitation or excessive sedation with atropine or hyoscine hydrobromide; research recommendation on antimuscarinics plus nursing care</span></li>'+
         '<li><b>NICE QS144 — Care of dying adults in the last days of life (March 2017)</b><br><a href="https://www.nice.org.uk/guidance/qs144" rel="noopener">nice.org.uk/guidance/qs144</a><span class="rd"> — statement 1 assessing signs and symptoms; statement 2 individualised care plan; statement 3 individualised anticipatory prescribing based on likely symptom needs; statement 4 hydration assessed daily</span></li>'+
         '<li><b>Cochrane CD005177 — Wee B, Hillier R. Interventions for noisy breathing in patients near to death (2008)</b><br><a href="https://www.cochranelibrary.com/cdsr/doi/10.1002/14651858.CD005177.pub2/abstract" rel="noopener">cochranelibrary.com CD005177.pub2</a><span class="rd"> — no evidence that any intervention is superior to placebo; prevalence 23–92%</span></li>'+
         '<li><b>Scottish Palliative Care Guidelines (Right Decision Service) — external reference only, not the local dose authority</b> — Care in the last days of life, and hyoscine hydrobromide (Scopoderm) patient leaflet (2024)<br><a href="https://www.rightdecisions.scot.nhs.uk/scottish-palliative-care-guidelines/" rel="noopener">rightdecisions.scot.nhs.uk/scottish-palliative-care-guidelines</a><span class="rd"> — glycopyrronium 200 micrograms SC PRN; hyoscine butylbromide and glycopyrronium do not cross the blood–brain barrier; repositioning may help and suction may exacerbate secretions; hyoscine hydrobromide 1.5 mg patch every 72 hours, off-label for secretions, prevents new secretions but does not affect those already formed</span></li>'+
         '<li><b>GMMMG — Palliative Care Pain and Symptom Control Guidelines for Adults (modified Apr 2025, review Apr 2028)</b><br><a href="https://gmmmg.nhs.uk/palliative-care-pain-symptom-control-guidelines-for-adults/" rel="noopener">gmmmg.nhs.uk — clinical guidance and pathways</a><span class="rd"> — local dose authority (with PCF8): PRN and CSCI doses, repeat interval, 24-hour maximum and syringe-pump compatibility; glycopyrronium 200 micrograms SC PRN example</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — dose verification and adverse effects of antimuscarinics</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Noisy respiratory secretions in the last days of life — NICE NG31 (2015), NICE QS144 (2017), Cochrane CD005177 (2008) with doses from the GMMMG Palliative Care Pain and Symptom Control Guidelines (Apr 2025; PCF8 supporting); the Scottish Palliative Care Guidelines are an external reference only. Verify against the current BNF before prescribing. Consider an antimuscarinic trial primarily for the dying person's distress, and judge it by their comfort. For the wider framework see Care of the dying adult."
});
