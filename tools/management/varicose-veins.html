<script>
MG.render({
  icon:"🦵",
  title:"Varicose veins — the complete guide",
  eyebrow:"Protocol · NICE CG168 · referral is driven by symptoms and complications, not appearance",
  stemTitle:"Most varicose veins are a quality-of-life problem — troublesome symptoms or a complication meet the referral criteria, and what makes compression dangerous is the arterial supply nobody checked",
  stemSub:"One page for the whole condition. Troublesome symptoms affecting quality of life meet the NICE CG168 referral criteria on their own, even without skin change; so do skin changes, ulceration, bleeding and superficial vein thrombosis with suspected venous incompetence. Deliver the conservative measures properly, <b>confirm adequate arterial supply before fitting any compression</b>, treat venous eczema, and give the patient the bleeding-varicosity first aid, because that is the one emergency this condition produces.",
  guideline:"NICE CG168 (2013) · NICE CG147 (2012) · local Bolton/Greater Manchester leg-ulcer and compression protocol · BNF",
  reviewed:"14 September 2026",
  nextReview:"14 March 2027",
  meta:[
    {t:"NICE CG168 — varicose veins in the legs"},
    {t:"Check arterial supply BEFORE compression", tone:"tw"},
    {t:"No oral drug cures varicose veins", tone:"tw"},
    {t:"v2.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#assess"><b>Assess</b><small>Complications</small></a><a href="#conservative"><b>Conservative</b><small>Compression caution</small></a><a href="#skin"><b>Skin</b><small>Eczema · phlebitis</small></a><a href="#monitor"><b>Review</b><small>Symptoms · skin</small></a><a href="#refer"><b>Refer</b><small>CG168 thresholds</small></a></div>',
  quickSub:"The six that matter. Key sources are listed under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Check the arterial supply before fitting compression", html:"Before compression, assess arterial supply using pedal pulses and ABPI where appropriate. In diabetes, CKD, older age or suspected arterial calcification, consider toe pressures/toe–brachial pressure index or vascular assessment, because ABPI may be falsely elevated and palpable pulses do not exclude significant PAD. Use the local leg-ulcer/compression protocol for pressure thresholds and reduced compression. Compression applied to a limb with coexisting arterial disease can cause ischaemia. This is the one way a well-intentioned prescription for varicose veins harms a leg."},
    {tone:"amber", h:"Symptoms and complications trigger referral, not appearance", html:"Refer to a vascular service for: symptomatic primary or recurrent varicose veins affecting quality of life · skin changes of chronic venous insufficiency (pigmentation, eczema, lipodermatosclerosis) · superficial vein thrombosis with suspected venous incompetence · a venous leg ulcer not healed within 2 weeks · a healed venous leg ulcer · bleeding from a varicose vein. Troublesome pain, aching, swelling, heaviness or itching alone meets the criteria. Cosmetic varicosities without symptoms or complications are generally not a routine NHS vascular-referral indication, subject to local commissioning — the honest answer to a purely cosmetic request. The vascular service uses duplex ultrasound to confirm the diagnosis, assess truncal reflux and plan treatment (NICE CG168)."},
    {tone:"red", h:"🩸 Bleeding varicosity — the first aid patients must know", html:"Lie down immediately and raise the leg above heart level. Apply firm, continuous direct pressure with a clean dressing for at least 10 minutes without repeatedly checking. If bleeding continues, is heavy, the patient feels faint, or they take an anticoagulant, call 999. Do not stand or walk to seek help. After any bleeding episode, arrange immediate vascular referral, even if the bleeding has stopped. <b>Say this to anyone with prominent varicosities</b> — a bleeding varicose vein can lose a surprising volume, and the instinct to stand up and walk to the bathroom makes it worse."},
    {tone:"blue", h:"There is no oral drug that cures varicose veins", html:"Management is conservative measures plus intervention where referral criteria are met. <b>Drugs have a role only in the complications</b> — emollients and a short course of topical corticosteroid for active venous eczema, and analgesia or an NSAID for limited superficial thrombophlebitis once its extent has been assessed; anticoagulation decisions follow the local VTE pathway."},
    {tone:"green", h:"The conservative measures worth naming specifically", html:"Regular walking and calf-muscle activity where safe, avoiding prolonged immobility · leg elevation for symptom relief · weight-management support where appropriate, without implying weight is the sole cause — and never delay a vascular referral while waiting for weight loss · compression hosiery for symptom relief only where interventional treatment is unsuitable or declined (CG168 advises against routinely offering it otherwise) — it does not correct venous reflux or replace assessment for intervention when referral criteria are met · in pregnancy, compression hosiery can be considered for symptom relief of leg swelling (CG168) · emollients for skin care. <b>And explain the natural history</b>, separating cosmetic from medical expectations."},
    {tone:"amber", h:"Exclude the two things that are not varicose veins", html:"DVT — acute unilateral swelling needs urgent assessment, not a stocking: use the two-level Wells score and the local DVT pathway, and do not apply compression until it has been followed (urgent ultrasound and anticoagulation decisions may be needed). Consider cellulitis, a ruptured Baker's cyst, acute heart failure, lymphoedema, dependent oedema and superficial thrombophlebitis. <b>And arterial disease — check the pulses before compression.</b> A venous leg ulcer that has not healed within about 2 weeks is a referral in its own right."}
  ],
  pathwaySub:"Five steps, and the referral decision rests entirely on step one.",
  pathway:[
    {title:"Assess symptoms and hunt for complications", html:"Aching, heaviness, itching, swelling, cramps — then look for skin changes, ulceration, bleeding and thrombophlebitis. Troublesome symptoms alone can meet the referral criteria. <b>Exclude DVT and arterial disease.</b>", alert:true},
    {title:"Deliver the conservative measures", html:"Activity, elevation, weight support, skin care — and compression only where intervention is unsuitable or declined, after arterial assessment."},
    {title:"Treat the skin complications", html:"Emollients with a short topical corticosteroid course for active venous eczema; for superficial vein thrombosis, assess extent and location — urgent duplex/vascular assessment if extensive, near a deep-vein junction or with DVT symptoms."},
    {title:"Review symptoms and skin integrity", html:"Significant quality-of-life impact or any new complication moves this to referral."},
    {title:"Refer on the CG168 criteria", html:"Symptomatic veins, skin changes, superficial vein thrombosis with suspected incompetence, a leg ulcer, or bleeding."}
  ],
  sections:[

    {id:"assess", nav:"Assess", title:"Step 1 — assess the symptoms, and find the complications",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>Symptoms</b>","Aching, heaviness, itching, swelling, cramps — troublesome symptoms affecting quality of life are a referral criterion in their own right. Cosmetic concern is legitimate to discuss, but alone it is generally not a routine NHS referral indication, subject to local commissioning"],
         ["<b>Complications — these are what change the plan</b>","Skin changes (pigmentation, eczema, lipodermatosclerosis) · ulceration · superficial thrombophlebitis · bleeding"],
         ["<b>Examine</b>","Distribution of the varicosities, skin integrity, and assess for chronic venous insufficiency"],
         ["<b>Exclude</b>","DVT — acute unilateral swelling: two-level Wells score and the local DVT pathway. Arterial disease — pulses and ABPI BEFORE any compression; toe pressures or vascular assessment in diabetes, CKD, older age or suspected calcification"],
         ["<b>Differentials of a swollen leg</b>","Cellulitis · ruptured Baker's cyst · acute heart failure · lymphoedema · dependent oedema · superficial thrombophlebitis"]
       ]},
       {b:"why", html:"Most varicose veins are a quality-of-life issue: troublesome symptoms, or a complication — skin changes, ulceration, bleeding or superficial vein thrombosis with suspected incompetence — meet the referral criteria. And checking arterial supply before compression avoids harming a limb with coexisting arterial disease, which is the single avoidable harm this condition offers."}
     ]},

    {id:"conservative", nav:"Conservative", title:"Step 2 — conservative measures, alongside referral when criteria are met",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"⚖️ Weight", html:"<b>Offer weight-management support where appropriate</b>, as a supportive measure and without implying that weight is the sole cause. Do not delay vascular referral for severe symptomatic veins while waiting for weight loss."},
         {tone:"green", h:"🏃 Exercise", html:"Encourage regular walking and calf-muscle activity where safe; avoid prolonged immobility, standing or sitting."},
         {tone:"green", h:"🦵 Elevation", html:"<b>Elevate the legs when resting to reduce swelling and aching.</b>"},
         {tone:"red", h:"🧦 Compression hosiery — arterial check first", html:"NICE CG168: do not routinely offer compression hosiery to treat varicose veins unless interventional treatment is unsuitable or declined; it may then help symptoms, but it does not correct venous reflux or replace assessment for intervention when referral criteria are met. For an active venous leg ulcer, compression is a core treatment after arterial assessment, through the local leg-ulcer pathway. In pregnancy, compression hosiery can be considered for symptom relief of leg swelling. <b>Check the arterial supply first — pulses and ABPI where appropriate; toe pressures or vascular assessment in diabetes or CKD. Borderline results: follow the local compression protocol for reduced compression or seek vascular advice.</b>"},
         {tone:"blue", h:"🧴 Skin care", html:"Emollients for venous eczema; treat dryness and itch to prevent skin breakdown — which is how ulcers begin."},
         {tone:"blue", h:"💬 Reassurance and expectations", html:"Explain the natural history, and address cosmetic versus medical expectations openly rather than leaving the patient to discover the funding position at referral."}
       ]}
     ]},

    {id:"skin", nav:"Skin", title:"Step 3 — managing the skin complications",
     blocks:[
       {b:"table", head:["Problem","Management"], rows:[
         ["<b>Venous eczema</b>","Usually treated in primary care while referral is arranged: a clear emollient and steroid application plan, with a topical corticosteroid of appropriate potency and duration for the severity and local formulary. Treat the underlying venous hypertension (referral; compression only after arterial assessment). Assess for cellulitis if warmth, spreading erythema, pain or systemic illness increase. Avoid topical antibiotics unless specifically indicated"],
         ["<b>No specific drug for the veins themselves</b>","There is no oral drug that cures varicose veins — management is conservative measures plus intervention"],
         ["<b>Superficial thrombophlebitis</b>","Assess the extent and anatomical location: proximity to the saphenofemoral or saphenopopliteal junction, length and progression, great or small saphenous involvement, DVT symptoms, and previous VTE, cancer, pregnancy or thrombophilia. Arrange urgent duplex/vascular assessment if it is extensive, rapidly extending, close to a deep-vein junction, associated with significant risk factors, or accompanied by symptoms suggestive of DVT. Anticoagulation follows the current local VTE pathway. Analgesia or an NSAID alone is suitable only for limited, low-risk cases"],
         ["<b>Venous leg ulcer</b>","Active ulcer: local leg-ulcer/wound service plus vascular assessment. Treat infection only when clinical infection is present. Ischaemic, atypical, painful or rapidly deteriorating ulcer: urgent vascular/secondary-care assessment. Healed venous ulcer: vascular referral — intervention may help prevent recurrence"]
       ]},
       {b:"warn", html:"Before fitting compression, assess arterial supply — pedal pulses and ABPI where appropriate; in diabetes, CKD, older age or suspected calcification consider toe pressures/toe–brachial pressure index or vascular assessment, because ABPI may be falsely elevated. <b>Compression in arterial disease can cause ischaemia</b>, and the patients most likely to be offered a stocking for aching legs are exactly those old enough to have unrecognised PAD. See <a href='peripheral-arterial-disease.html'>peripheral arterial disease</a>."}
     ]},

    {id:"monitor", nav:"Review", title:"Step 4 — monitoring symptoms and skin",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["<b>Symptoms and quality of life</b>","<b>Each review</b>","<b>Significant impact → refer for intervention</b>"],
         ["<b>Skin integrity</b>","<b>Each review</b>","<b>Chronic venous skin changes or eczema → routine vascular referral, treating the eczema meanwhile. Infection, rapidly progressive ulceration, severe pain, critical ischaemia or systemic illness → urgent assessment. An ulcer → the local leg-ulcer pathway plus vascular assessment</b>"],
         ["<b>Compression tolerance</b>","<b>If compression is in use</b>","<b>Adjust per the local compression protocol; re-confirm the arterial supply remains adequate</b>"],
         ["<b>New complications</b>","<b>Any time</b>","Bleeding, ulceration or thrombophlebitis → act per the safety-net and referral criteria"]
       ]},
       {b:"dl", rows:[
         ["<b>At presentation</b>","Assess symptoms and complications, give conservative advice, and decide whether referral criteria are already met"],
         ["<b>As needed</b>","<b>Reassess if symptoms worsen or skin changes develop</b>"],
         ["<b>If ulcer or bleeding</b>","<b>Escalate to the appropriate urgent pathway</b>"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 Bleeding varicosity", html:"\"If a vein bleeds: lie down straight away and raise the leg above the level of your heart. Press firmly and continuously on it with a clean dressing for at least 10 minutes without lifting to check. Do not stand or walk to get help. If it keeps bleeding, is heavy, you feel faint, or you take a blood thinner, call 999. Even if it stops, contact us so we can refer you to the vein specialists straight away.\""},
         {tone:"amber", h:"🩹 Ulcer", html:"\"A break in the skin or a non-healing sore around the ankle — contact us. Venous ulcers need proper treatment.\""},
         {tone:"red", h:"🦵 DVT", html:"\"Sudden painful swelling of one calf — seek urgent assessment to rule out a clot.\""},
         {tone:"amber", h:"🧦 Compression care", html:"\"If the stockings or bandages cause increasing pain, numbness, a pale, blue or cold foot, worsening ulceration or marked swelling after they are put on, take them off and get reviewed.\""}
       ]}
     ]},

    {id:"troubleshoot", nav:"Worsening?", title:"Worsening? Check the referral criteria",
     sub:"NICE CG168 referral is driven by symptoms and complications, not appearance alone.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"1 · Skin changes", html:"<b>Pigmentation, eczema or lipodermatosclerosis → routine vascular referral.</b> Urgent assessment if there is infection, rapidly progressive ulceration, severe pain, critical ischaemia or systemic illness."},
         {tone:"red", h:"2 · Ulcer", html:"Broken skin below the knee not healed within 2 weeks → local leg-ulcer/wound service plus vascular referral. Ischaemic, atypical, painful or rapidly deteriorating ulcer → urgent vascular assessment. Healed venous ulcer → vascular referral to prevent recurrence."},
         {tone:"red", h:"3 · Bleeding", html:"<b>Has bled from a varicosity → immediate vascular referral, even if the bleeding has stopped.</b> A vein thought at risk of bleeding → seek local vascular advice; this is not a separate national criterion."},
         {tone:"amber", h:"4 · Thrombophlebitis", html:"<b>Superficial vein thrombosis → assess extent and location.</b> Urgent duplex/vascular assessment if extensive, rapidly extending, near a deep-vein junction, with significant risk factors or DVT symptoms; vascular referral with suspected venous incompetence."},
         {tone:"blue", h:"5 · Symptoms", html:"Troublesome pain, aching, swelling, heaviness or itching affecting quality of life → vascular referral, even without skin change. Do not delay for weight loss."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"When to refer to vascular — the CG168 thresholds",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Bleeding", html:"Bleeding from a varicose vein: NICE CG168 says refer people with bleeding varicose veins to a vascular service <b>immediately</b>. Refer once bleeding is controlled, even if it has stopped; also for uncontrolled or recurrent bleeding, or significant bleeding with anticoagulation or haemodynamic symptoms. <b>999 if bleeding continues despite elevation and at least 10 minutes of continuous pressure, is heavy, or the patient feels faint.</b>"},
         {tone:"red", h:"Urgent assessment", html:"Suspected DVT (Wells score and local DVT pathway) · extensive or proximal superficial vein thrombosis · acute limb ischaemia · infected ulcer with systemic illness · rapidly progressive or severely painful ulcer · ischaemic symptoms associated with compression."},
         {tone:"red", h:"Venous leg ulcer", html:"A venous leg ulcer — broken skin below the knee not healed within 2 weeks — or a healed venous ulcer (routine vascular referral). Active ulcers also go to the local Bolton/Greater Manchester leg-ulcer/wound service."},
         {tone:"amber", h:"Skin changes", html:"Lower-limb skin changes thought to be due to chronic venous insufficiency: pigmentation, eczema, lipodermatosclerosis."},
         {tone:"amber", h:"Superficial thrombophlebitis", html:"<b>Superficial vein thrombosis with suspected venous incompetence.</b>"},
         {tone:"blue", h:"Symptomatic veins", html:"Symptomatic primary or recurrent varicose veins affecting quality of life — symptoms alone meet the criterion. The vascular service confirms the diagnosis, assesses truncal reflux and plans treatment with duplex ultrasound. Cosmetic varicosities without symptoms or complications are generally not a routine NHS referral, subject to local commissioning."},
         {tone:"cream", h:"GP management", html:"Assessment, the conservative measures, compression after an arterial check, venous eczema, superficial thrombophlebitis, the safety-net and the referral decision all belong here. Related pages: <a href='peripheral-arterial-disease.html'>peripheral arterial disease</a> · <a href='dvt.html'>DVT</a> · <a href='eczema.html'>eczema</a> · <a href='cellulitis.html'>cellulitis</a>."}
       ]},
       {b:"say", html:"Varicose veins are common and often just need simple measures — staying active, elevating your legs, and weight control. If they are really troubling you, or if the skin changes or a vein bleeds, I will refer you to the vein specialists for treatment. One thing worth knowing in advance: if a vein ever bleeds, lie down straight away, get the leg up above your heart, and press hard and continuously for at least 10 minutes without checking. If it keeps bleeding or you feel faint, call 999 — and let us know even if it stops, because you'll need to see the vein specialists promptly."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 62-year-old woman who works as a hairdresser attends with <b>aching, heavy legs</b> by the end of the day and prominent varicosities on both calves. She has <b>brown discoloration above the right ankle</b> and some <b>dry, itchy, scaly skin</b> there. She is a smoker with <b>type 2 diabetes</b>. She asks for <b>\"the stockings\"</b> and whether the veins can be \"taken out on the NHS\"."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Identifies the pigmentation and venous eczema as skin changes of chronic venous insufficiency — which is itself a CG168 referral criterion, so this is not a cosmetic consultation; does NOT simply issue compression hosiery: checks pedal pulses and arranges ABPI given diabetes and smoking, and can explain that compression on an arterially compromised limb causes ischaemia — while also knowing <b>the ABPI may read falsely high in diabetes</b>, so considering toe pressures or vascular assessment; treats the venous eczema with emollients and a short topical corticosteroid course rather than leaving skin to break down into an ulcer; <b>excludes DVT</b>; <b>answers the funding question honestly</b> — referral is driven by symptoms and complications, and she meets the criteria on the skin changes; <b>gives the bleeding-varicosity first aid explicitly</b>; addresses <b>smoking, weight and prolonged standing</b> with practical adjustments for her job; and <b>safety-nets the non-healing ankle sore</b>."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Key sources for this page. Some advice is clinical practice or local protocol rather than NICE recommendation, as marked.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE CG168 — Varicose veins: diagnosis and management (2013)</b><br><a href="https://www.nice.org.uk/guidance/cg168" rel="noopener">nice.org.uk/guidance/cg168</a><span class="rd"> — the five referral criteria (symptomatic primary or recurrent varicose veins, skin changes due to chronic venous insufficiency, superficial vein thrombosis with suspected incompetence, a leg ulcer or a healed venous ulcer, and bleeding varicose veins — veins at risk of bleeding are a matter for local vascular advice), duplex ultrasound in the vascular service to confirm the diagnosis and plan treatment, the position of compression hosiery where intervention is unsuitable, and compression hosiery for symptom relief in pregnancy</span></li>'+
         '<li><b>NICE CG168 \u2014 Varicose veins: diagnosis and management (2013)</b><br><a href="https://www.nice.org.uk/guidance/cg168" rel="noopener">nice.org.uk/guidance/cg168</a><span class="rd"> — immediate vascular referral for bleeding varicose veins; compression hosiery not offered to treat varicose veins unless interventional treatment is unsuitable. The arterial check before compression, venous eczema care and superficial thrombophlebitis management on this page are clinical practice, not CG168 recommendations</span></li>'+
         '<li><b>NICE CG147 — Peripheral arterial disease: diagnosis and management (2012)</b><br><a href="https://www.nice.org.uk/guidance/cg147" rel="noopener">nice.org.uk/guidance/cg147</a><span class="rd"> — ABPI assessment, referenced here because compression is contraindicated in significant arterial disease and the ABPI is falsely elevated in diabetes and CKD (toe pressures or vascular assessment then)</span></li>'+
         '<li><b>Local Bolton/Greater Manchester leg-ulcer and compression protocol</b><span class="rd"> — ABPI and toe-pressure thresholds, reduced compression and leg-ulcer/wound service referral; NICE CG168 does not give detailed thresholds for every compression scenario</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — emollients and topical corticosteroid potency for venous eczema; NSAID use in superficial thrombophlebitis</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Varicose veins — NICE CG168 (2013). Referral is driven by symptoms and complications, not appearance: skin changes of chronic venous insufficiency, a leg ulcer or healed venous ulcer, bleeding from a varicose vein, superficial vein thrombosis with suspected incompetence, or troublesome symptoms affecting quality of life on their own. Confirm adequate arterial supply before fitting compression (pulses and ABPI; toe pressures or vascular assessment in diabetes or CKD) — compression on an arterially compromised limb can cause ischaemia. No oral drug cures varicose veins; treat venous eczema with emollients and a short topical steroid course. Every patient with prominent varicosities should know the bleeding first aid: lie down, elevate the leg above the heart, press firmly and continuously for at least 10 minutes, call 999 if bleeding continues, is heavy or they feel faint, and seek immediate vascular referral after any bleed."
});
</script>
