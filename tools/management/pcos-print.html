<script>
MG.render({
  icon:"🌸",
  title:"PCOS (now PMOS)",
  eyebrow:"Protocol · diagnose, screen and treat by goal",
  stemTitle:"A lifelong endocrine and metabolic condition, not a gynaecology label",
  stemSub:"The condition previously known as polycystic ovary syndrome (PCOS) is now increasingly referred to internationally as polyendocrine metabolic ovarian syndrome (PMOS), partly because the ovaries often hold no cysts at all. UK records, coding, patient information and existing guidance may still use PCOS: use PMOS (formerly PCOS) at first mention and keep PCOS in searches and coding until local systems are updated. Confirm the diagnosis and exclude the mimics, notice the androgen level that should trigger urgent investigation, screen glucose, blood pressure, lipids, mood and sleep, protect the endometrium when bleeds are rare, then treat whatever matters most to her now: cycles, hair and skin, weight, or fertility. The UK has no published PCOS guideline yet; this page uses the 2023 international guideline alongside RCOG Green-top 33, NICE NG257 (fertility), NICE NG246 (obesity) and NICE PH38 (diabetes prevention), UKMEC 2025 and MHRA advice. Drug doses, contraindications, renal/hepatic adjustments, pregnancy advice and licensed indications must be checked against the current local formulary and product information before prescribing.",
  guideline:"International evidence-based PCOS guideline 2023 (international) · RCOG Green-top 33 (2014) · NICE NG257 (2026) · NICE PH38 (2012, updated 2017) · NICE NG246 (2025) · UKMEC 2025 · Society for Endocrinology 2025",
  meta:[
    {t:"International PCOS guideline 2023 (international)"},
    {t:"RCOG Green-top 33 (2014) · NICE NG257 (2026)"},
    {t:"NICE PH38 (2017) · NG246 (2025) · TA875 (2023) · TA1026 (2024)"},
    {t:"UKMEC 2025 · MHRA DSU 2013 and 2025 · FSRH 2025"},
    {t:"GMMMG tirzepatide commissioning statement (local)"},
    {t:"NG12: postmenopausal bleeding at 55 or over", tone:"tw"}
  ],
  lead:"<div class='mg-layers'><a href='#diagnose'><b>Diagnose</b><small>two of three, mimics excluded</small></a><a href='#metabolic'><b>Screen</b><small>glucose, BP, lipids, mood</small></a><a href='#cycles'><b>Protect</b><small>endometrial plan if bleeds are rare</small></a><a href='#refer'><b>Refer</b><small>tumour, fertility, endometrium</small></a></div>",
  quickSub:"The six things that change what you do today. Each traces to a source under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"Rapid virilisation or markedly raised testosterone: urgent endocrine assessment", html:"Deepening voice, clitoromegaly, temporal balding, rapid increase in muscle bulk, or hirsutism that has developed over months rather than years, or a markedly elevated testosterone (particularly above approximately 5 nmol/L using a reliable assay), should prompt urgent endocrine assessment for an androgen-secreting ovarian or adrenal disorder (Society for Endocrinology 2025). The threshold is a trigger for investigation, not a tumour diagnosis. Do not assume PCOS or start treatment that could obscure the picture before assessment."},
    {tone:"amber", h:"Long gaps between bleeds need a plan for the womb lining", html:"Unopposed oestrogen in anovulatory cycles raises the risk of endometrial hyperplasia and cancer. If she has prolonged oligomenorrhoea or amenorrhoea and is not using a combined hormonal contraceptive or LNG-IUS, provide regular progestogen exposure or another suitable endometrial-protection strategy; a withdrawal bleed is commonly induced at least every 3 to 4 months, according to the local gynaecology pathway. The international guideline puts the premenopausal endometrial cancer risk at two to six times normal, while the absolute risk stays low, and routine endometrial ultrasound screening is not recommended."},
    {tone:"blue", h:"The diagnosis is two out of three, after the mimics are excluded", html:"Irregular cycles, clinical or biochemical hyperandrogenism, and polycystic ovarian morphology on ultrasound (or a raised AMH in adults). If both irregular cycles and hyperandrogenism are present, no scan or AMH is needed. Exclude pregnancy and check TSH; add prolactin where indicated, 17-hydroxyprogesterone where non-classic CAH is possible, and FSH with oestradiol if premature ovarian insufficiency or hypothalamic amenorrhoea is suggested (international guideline 2023)."},
    {tone:"blue", h:"Screen the metabolic risk whatever her weight", html:"Assess glycaemic status at diagnosis and every 1 to 3 years (offer a 75 g 2-hour OGTT regardless of BMI where feasible; HbA1c or fasting glucose are less sensitive alternatives in PCOS), check blood pressure every year, and take a lipid profile at diagnosis. An HbA1c of 42 to 47 mmol/mol puts her in the NICE PH38 high-risk group with a yearly test."},
    {tone:"green", h:"Where weight is excess, modest loss may help", html:"Where excess weight is present, modest weight loss may improve metabolic health, ovulation and menstrual regularity. Preventing further weight gain is also a valid goal. Agree an individualised, non-stigmatising plan rather than a fixed percentage target. No specific diet has been shown to beat another, so choose one she can sustain. Screen for disordered eating before prescribing weight loss, and do not dismiss an eating disorder because of her weight."},
    {tone:"cream", h:"Treat the goal she names, and time the review", html:"Cycles and hirsutism: the combined pill is a first-line pharmacological option when medically suitable and acceptable to her (international guideline), within UKMEC 2025. Facial hair: add cosmetic measures or eflornithine, reviewing at 4 months. Assess hair response at about 6 months; if still troublesome, consider an anti-androgen, with effective contraception. Wanting a baby: folic acid, stop the pill and refer early; letrozole is first-line ovulation induction in the international guideline but is off-label in the UK and started by fertility specialists, not in routine primary care."}
  ],
  pathwaySub:"Five moves, in the order that keeps her safe.",
  pathway:[
    {title:"Screen for the dangerous look-alikes", html:"Ask how fast the symptoms appeared. <b>Rapid virilisation, a markedly raised testosterone (above about 5 nmol/L on a reliable assay), or cushingoid features</b> need urgent assessment for an androgen-secreting tumour, Cushing’s syndrome or non-classic CAH before PCOS is assumed. <b>Postmenopausal bleeding</b> in a woman with a PCOS history is an NG12 question, not a PCOS one."},
    {title:"Confirm the diagnosis and exclude mimics", html:"Use the <b>two-of-three</b> criteria with the 2023 cycle definitions. Pregnancy test if pregnancy is possible. If cycling, early-morning early-follicular sampling is preferable, but do not delay testing in amenorrhoea or suspected significant androgen excess: <b>total testosterone</b> (ideally by mass spectrometry) with calculated free testosterone or free androgen index, <b>TSH</b>, and <b>prolactin, 17-OHP or FSH with oestradiol where clinically indicated</b>. If biochemical androgen assessment is essential, combined hormonal contraception should generally be stopped for at least 3 months, with alternative contraception; do not stop effective contraception solely for a result if the clinical diagnosis is already clear. Do not use ultrasound or AMH within 8 years of menarche."},
    {title:"Map the long-term risks", html:"<b>Weight, waist, blood pressure</b>, glucose status (75 g OGTT preferred), <b>lipids</b>, <b>mood, anxiety, eating and body image</b>, and <b>sleep apnoea symptoms</b>. Ask how many bleeds she has had in the last year and when the last one was, because this tells you whether the endometrium needs protecting."},
    {title:"Agree the goal and treat it", html:"Lifestyle support for everyone. Then by goal: <b>combined pill</b> for cycles and androgen features when medically suitable and acceptable; <b>cyclical progestogen or LNG-IUS</b> if the pill is unsuitable; <b>cosmetic measures or eflornithine</b> for facial hair; <b>metformin</b> for metabolic risk; <b>weight-management medicines</b> by obesity criteria (NICE TA875 and TA1026) and the current GMMMG commissioning position; <b>fertility referral</b> if trying to conceive."},
    {title:"Review every year", html:"At least yearly: weight, BP, bleed frequency and endometrial protection, mood, anxiety, eating and body image, sleep symptoms, medicines and adverse effects, contraception and pregnancy intentions; lipids according to the result and cardiovascular risk. Glucose every 1 to 3 years according to risk, preferably by OGTT. Plan pregnancy with an OGTT beforehand. Refer when a mimic is suspected, the endometrium is a concern, fertility treatment is needed, or first-line treatment fails."}
  ],
  sections:[
    {id:"redflags", nav:"Red flags", title:"Red flags — when it is not PCOS, or not only PCOS", sub:"Most women with PCOS have had features since adolescence that evolve slowly. Speed, severity and age at onset are the clues that something else is going on.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Virilisation or very high testosterone", html:"Clitoromegaly, a deepening voice, male-pattern balding, breast atrophy or increased muscle bulk, or hirsutism of recent and rapid onset. A markedly elevated total testosterone, particularly above approximately <b>5 nmol/L</b> using a reliable assay, or any elevation with rapid virilisation, should prompt urgent investigation for an androgen-secreting ovarian or adrenal disorder; it is an investigation trigger, not a tumour diagnosis. Interpret against the local laboratory method, contraception, age and menopausal status. DHEAS may suggest an adrenal source but is not specific, and a normal testosterone does not exclude clinically important hyperandrogenism. Refer urgently to endocrinology and do not start a combined pill first, because it will mask the picture.", src:"Society for Endocrinology androgen excess guideline, Clin Endocrinol 2025"},
         {tone:"amber", h:"New androgen excess after the menopause", html:"Hirsutism or scalp hair loss that starts after the menopause is not a presentation of PCOS. Check testosterone and refer to endocrinology, as ovarian hyperthecosis and androgen-secreting tumours are the main concerns.", src:"Society for Endocrinology androgen excess guideline, Clin Endocrinol 2025"},
         {tone:"amber", h:"Cushingoid features", html:"Proximal weakness, easy bruising, wide purple striae, a plethoric round face, or new hypertension with hyperglycaemia. Cushing’s syndrome causes irregular cycles and hirsutism and must be excluded where clinically suggested before labelling PCOS.", src:"International PCOS guideline 2023 (international)"},
         {tone:"amber", h:"Prolonged amenorrhoea with no endometrial protection", html:"No bleed for more than 3 to 4 months, or irregular or intermenstrual bleeding on a background of long gaps. Provide regular progestogen exposure or another endometrial-protection strategy. Routine ultrasound screening of the endometrium is not recommended solely because of PCOS/PMOS or infrequent periods. Investigate persistent intermenstrual, post-coital, prolonged or otherwise abnormal bleeding, or concerning clinical findings, and refer according to the local gynaecology pathway.", src:"International PCOS guideline 2023 (international) · RCOG Green-top Guideline 33 (2014)"},
         {tone:"purple", h:"Postmenopausal bleeding at 55 or over <span class='tw'>Suspected cancer</span>", html:"Postmenopausal bleeding means unexplained vaginal bleeding more than 12 months after menstruation has stopped. A history of PCOS may raise concern but does not change the NG12 age threshold. NICE NG12 (updated April 2026): refer using a suspected cancer pathway referral for endometrial cancer if she is aged 55 or over with postmenopausal bleeding that cannot be attributed to HRT. Under 55, consider a suspected cancer pathway referral for unexplained postmenopausal bleeding not attributable to HRT.", src:"NICE NG12 (updated April 2026)"},
         {tone:"amber", h:"Low mood with thoughts of self-harm", html:"Depression and anxiety are much more common in PCOS at every age. Ask directly about suicidal thoughts and self-harm when mood is low, and about body-image distress and eating disorders, and follow your usual crisis pathway if risk is present.", src:"International PCOS guideline 2023 (international)"}
       ]},
       {b:"why", html:"<b>Why timing matters:</b> PCOS usually declares itself around menarche with irregular cycles, acne and slowly progressive hair growth. Androgen-secreting tumours tend to cause a much steeper rise in testosterone and genuine virilisation within months. A combined pill lowers testosterone and can hide both conditions, so test before treating when the story is atypical."}
     ]},

    {id:"diagnose", nav:"Diagnosis", title:"Making the diagnosis", sub:"The 2023 international guideline keeps the Rotterdam two-of-three structure, adds AMH as an alternative to ultrasound in adults, and tightens the definitions for adolescents.",
     blocks:[
       {b:"table", head:["Feature","What counts","Notes"], rows:[
         ["<b>Ovulatory dysfunction</b>","Up to 1 year after menarche: irregular cycles are normal. 1 to under 3 years after menarche: cycles under 21 or over 45 days. From 3 years after menarche to the perimenopause: cycles under 21 or over 35 days, or fewer than 8 cycles a year. Any single cycle over 90 days from 1 year after menarche. Primary amenorrhoea by age 15, or more than 3 years after breast development began","Regular cycles do not exclude anovulation. If hyperandrogenism is present, a mid-luteal progesterone can confirm ovulatory dysfunction"],
         ["<b>Clinical hyperandrogenism</b>","Hirsutism on the modified Ferriman–Gallwey score (a score of 4 to 6 or more, depending on ethnicity), acne, or female-pattern hair loss","Self-treatment with shaving, waxing or laser lowers the visible score, so ask what she does already"],
         ["<b>Biochemical hyperandrogenism</b>","Total and free testosterone first (free testosterone calculated, or a free androgen index). Androstenedione and DHEAS if the first tests are normal","Liquid chromatography–mass spectrometry is preferred for total testosterone. If biochemical assessment is essential, stop combined hormonal contraception for at least 3 months with alternative contraception; do not stop it solely for a result if the clinical diagnosis is clear. A normal testosterone does not exclude hyperandrogenism"],
         ["<b>Polycystic ovarian morphology</b>","Transvaginal ultrasound with 20 or more follicles in at least one ovary, or ovarian volume of 10 mL or more; or a raised AMH in adults","Not needed if cycles are irregular and hyperandrogenism is present. Neither ultrasound nor AMH should be used within 8 years of menarche"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Adolescents need both features", html:"Use the adolescent criteria where she is <b>within 8 years of menarche, irrespective of chronological age</b> (a 19-year-old who is 2 years post-menarche is assessed as an adolescent). Diagnosis requires <b>both</b> persistent ovulatory dysfunction (by the age-specific cycle definitions) and clinical or biochemical hyperandrogenism. Ultrasound and AMH are not recommended in this group. If she has features but does not yet meet criteria, she is at <b>increased risk</b>: treat the symptoms, and reassess at or before full reproductive maturity, approximately 8 years after menarche, if clinically indicated.", src:"International PCOS guideline 2023 (international)"},
         {tone:"blue", h:"Why the name changed", html:"In May 2026 a global consensus published in the Lancet proposed the name <b>polyendocrine metabolic ovarian syndrome (PMOS)</b>, now increasingly used internationally, reflecting its hormonal, metabolic, skin and mental-health effects. Diagnostic criteria are unchanged, and clinical recommendations still come from the 2023 international guideline. UK records, coding and patient information may still say PCOS: write PMOS (formerly PCOS) at first mention and keep PCOS in searches and coding until local systems are updated.", src:"Lancet 2026 (PMOS nomenclature consensus)"}
       ]},
       {b:"why", html:"<b>Ask about the whole timeline:</b> age at menarche, cycle pattern since, when hair growth started and how quickly it has changed, weight trajectory, medicines (including anabolic steroids and valproate), family history of diabetes and PCOS, and contraceptive use. A clear adolescent onset with slow progression is the pattern that makes PCOS likely."}
     ]},

    {id:"exclude", nav:"Mimics", title:"Tests that exclude the mimics", sub:"Several conditions produce irregular cycles or androgen excess. The international guideline expects them to be excluded before PCOS is confirmed. Pregnancy test, testosterone with a free androgen measure and TSH are baseline; the others are requested only when clinically indicated.",
     blocks:[
       {b:"table", head:["Test","Looks for","If abnormal"], rows:[
         ["<b>TSH</b>","Thyroid disease causing cycle disturbance","Treat the thyroid problem and reassess cycles"],
         ["<b>Prolactin (where indicated)</b>","Hyperprolactinaemia (medicines, pituitary adenoma)","Repeat to confirm, review medicines, and follow the hyperprolactinaemia pathway"],
         ["<b>17-hydroxyprogesterone (where indicated)</b>","Non-classic congenital adrenal hyperplasia, where this is possible","Refer to endocrinology; timing in the early follicular phase matters"],
         ["<b>FSH and oestradiol (where indicated)</b>","Premature ovarian insufficiency (high FSH) or hypothalamic amenorrhoea (low FSH and oestradiol)","Relevant when periods have stopped; low weight, intense exercise or restrictive eating point to a hypothalamic cause"],
         ["<b>Total testosterone</b>","Severity of androgen excess","Markedly raised (above about 5 nmol/L on a reliable assay), or any rise with rapid virilisation: urgent endocrine assessment for an androgen-secreting disorder. Interpret against the local laboratory range"],
         ["<b>Calculated free testosterone or free androgen index</b>","Biochemical hyperandrogenism","Use with total testosterone; recommended by the international guideline"],
         ["<b>DHEAS and androstenedione (where indicated)</b>","Androgen excess when testosterone is not raised but clinical suspicion remains","DHEAS may suggest an adrenal source but is not specific; consider ovarian hyperthecosis in severe postmenopausal androgen excess"],
         ["<b>Pregnancy test</b>","Pregnancy as the cause of amenorrhoea","First, whenever pregnancy is possible"],
         ["<b>Further tests if features suggest them</b>","Cushing’s syndrome, acromegaly, androgen-secreting tumours","Specialist-led; screening for Cushing’s is not routine without suggestive features"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"cream", h:"Practical timing of bloods", html:"If cycles are present, early-morning early-follicular sampling (days 2 to 5) is preferable, but in amenorrhoea or suspected significant androgen excess, do not delay testing solely to obtain a particular cycle day; test after a negative pregnancy test. If biochemical androgen assessment is essential, stop combined hormonal contraception for at least 3 months, with alternative contraception. Do not stop effective contraception solely to obtain a result if the clinical diagnosis is already clear.", src:"Society for Endocrinology androgen excess guideline, Clin Endocrinol 2025"},
         {tone:"blue", h:"What the tests will not tell you", html:"LH-to-FSH ratio is not a diagnostic criterion. AMH is an adult alternative to ultrasound, not a stand-alone test, and has no role in adolescents. A pelvic ultrasound report of polycystic ovaries in a woman with regular cycles and no androgen features does not make the diagnosis.", src:"International PCOS guideline 2023 (international)"}
       ]}
     ]},

    {id:"metabolic", nav:"Metabolic screen", title:"Metabolic and cardiovascular screening", sub:"Insulin resistance is common at every weight. Screen everyone, and do it again at intervals.",
     blocks:[
       {b:"table", head:["What","When","Threshold or action"], rows:[
         ["<b>Glycaemic status</b>","At diagnosis, then every 1 to 3 years depending on risk factors; before pregnancy or fertility treatment","Offer a 75 g 2-hour OGTT regardless of BMI where feasible. If not feasible, use HbA1c and/or fasting plasma glucose, explaining these are less sensitive in PCOS. HbA1c may be unreliable in haemoglobinopathies, anaemia, altered red-cell turnover, pregnancy or recent blood loss. A planned pregnancy or fertility treatment should trigger an OGTT if not recently done. RCOG Green-top 33 (older UK guidance) advised an OGTT for women who are overweight, or of normal weight with additional risk factors (age over 40, previous gestational diabetes, family history of type 2 diabetes)"],
         ["<b>HbA1c result</b>","If used","42 to 47 mmol/mol: high risk of type 2 diabetes; offer an intensive lifestyle programme and repeat at least yearly (NICE PH38). 48 mmol/mol or above is in the diagnostic range for diabetes; in an asymptomatic patient, repeat or confirm through the appropriate diagnostic pathway before recording the diagnosis, and manage under the relevant NICE diabetes guideline"],
         ["<b>Blood pressure</b>","Every year, and when planning pregnancy or fertility treatment","Manage hypertension on the usual thresholds; it also affects UKMEC category for the combined pill"],
         ["<b>Lipids</b>","At diagnosis, whatever her age or weight","Repeat according to the result and overall cardiovascular risk"],
         ["<b>Weight and waist</b>","At each review, measured with consent and without stigma","Use lower BMI thresholds for South Asian, Chinese, other Asian, Middle Eastern, Black African or African-Caribbean backgrounds (NICE NG246)"],
         ["<b>Sleep apnoea symptoms</b>","At diagnosis and review","Ask about snoring, witnessed apnoeas, unrefreshing sleep and daytime somnolence. Use a locally accepted validated screening tool and refer for sleep assessment where clinically indicated"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"cream", h:"Metformin for metabolic features", html:"Consider metformin in adults with PCOS/PMOS, particularly where BMI is 25 or more and there are metabolic features, impaired glucose tolerance or increased diabetes risk, alongside lifestyle support. Its role is metabolic; weight reduction is generally modest. It is off-label when prescribed specifically for PCOS in the UK. Check renal function (caution or avoid according to renal function and in acute illness), start low and titrate to limit gastrointestinal effects, and consider vitamin B12 monitoring during long-term treatment; <b>dose per local formulary and BNF</b>. Review in pregnancy; it is not routinely recommended solely to prevent pregnancy complications, and is not a substitute for fertility referral or ovulation induction. Inositol has limited evidence of benefit.", src:"International PCOS guideline 2023 (international) · BNF metformin"},
         {tone:"blue", h:"The pregnancy glucose check", html:"Offer a 75 g OGTT when she is planning pregnancy. If it was not done, offer one before 20 weeks; in addition, offer every pregnant woman with PCOS an OGTT at 24 to 28 weeks. Mention this in the referral letter or antenatal booking so it is not missed. Diabetes before pregnancy and gestational diabetes follow their own separate pathways.", src:"International PCOS guideline 2023 (international)"}
       ]},
       {b:"why", html:"<b>Why screen slim women too:</b> the international guideline’s meta-analyses show higher rates of impaired glucose tolerance, type 2 diabetes and gestational diabetes in PCOS independent of BMI. A normal weight lowers the risk but does not remove it."}
     ]},

    {id:"cycles", nav:"Cycles", title:"Cycles and endometrial protection", sub:"Infrequent bleeds are not harmless. If she is not using a combined hormonal contraceptive or LNG-IUS, provide regular progestogen exposure or another endometrial-protection strategy, individualised to age, bleeding pattern, contraception and circumstances.",
     blocks:[
       {b:"ladder", steps:[
         {step:"First choice", title:"Combined oral contraceptive pill", when:"cycle control plus contraception", fromLabel:"if UKMEC allows",
          html:"The international guideline makes the combined pill a first-line pharmacological option for irregular cycles and hyperandrogenic symptoms (hirsutism and acne) when medically suitable and acceptable to her. No particular brand is preferred; lower ethinylestradiol doses (20 to 30 micrograms) are favoured. UKMEC 2025: BMI 30 to 34.9 kg/m² is generally UKMEC 2 and BMI 35 or more is UKMEC 3 (risks generally outweigh benefits, but not an absolute contraindication). Consider BMI alongside age, smoking, hypertension, migraine with aura, diabetes, dyslipidaemia, personal or family VTE history and other cardiovascular risk factors; individualise, and consider a progestogen-only or intrauterine option."},
         {step:"Alternative", title:"Levonorgestrel intrauterine system", when:"combined pill unsuitable or not wanted", fromLabel:"continuous protection",
          html:"Gives reliable, continuous endometrial protection and contraception without oestrogen. Useful where UKMEC rules out oestrogen, for example a high BMI or hypertension."},
         {step:"Alternative", title:"Cyclical oral progestogen", when:"not needing contraception", fromLabel:"induced withdrawal bleed",
          html:"A withdrawal bleed is commonly induced with a progestogen at least every 3 to 4 months, according to the local gynaecology pathway (RCOG Green-top 33). Medroxyprogesterone acetate is the usual choice; <b>dose and duration per BNF and SPC</b>. This does not provide contraception."},
         {step:"Option", title:"Progestogen-only pill", when:"contraception without oestrogen", fromLabel:"limited evidence in PCOS",
          html:"The international guideline notes that progestogen-only contraception may be considered for endometrial protection, based on general-population evidence. POP bleeding patterns can be unpredictable and evidence specifically in PCOS is limited. DMPA may cause amenorrhoea but brings weight-change and bone-health considerations. None of these is equivalent to the combined pill for hirsutism or acne."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"Endometrial investigation is symptom-led, not routine", html:"Routine ultrasound screening of the endometrium is not recommended solely because a patient has PCOS/PMOS or infrequent periods. Investigate persistent intermenstrual, post-coital, prolonged or otherwise abnormal bleeding, prolonged amenorrhoea with other concerning features, failed response to endometrial protection, or concerning clinical findings, taking age and other endometrial cancer risk factors into account. Endometrial thickness thresholds should not be used in isolation; refer according to the local gynaecology pathway.", src:"International PCOS guideline 2023 (international)"},
         {tone:"green", h:"What to tell her about cancer risk", html:"Her endometrial cancer risk before the menopause is two to six times that of other women, but the absolute risk remains low and routine screening is not recommended. Endometrial protection when bleeds are infrequent, weight management where relevant, and prompt reporting of abnormal bleeding are what protect her. There is no clear link with breast or ovarian cancer, so no extra surveillance is needed.", src:"International PCOS guideline 2023 (international) · RCOG Green-top Guideline 33 (2014)"}
       ]},
       {b:"warn", html:"<b>Co-cyprindiol (cyproterone acetate with ethinylestradiol 35 micrograms)</b> carries a higher VTE risk than levonorgestrel pills. MHRA Drug Safety Update (June 2013): it is for moderate to severe androgen-related acne and/or hirsutism in women of reproductive age, for acne only after topical treatment or oral antibiotics have failed, and it should be stopped 3 to 4 cycles after the condition has resolved. It is not to be used solely for contraception, is not first-line for uncomplicated acne or hirsutism, and should be used only after other appropriate treatments have failed or are unsuitable. Reassess regularly, stop after the recommended period once the indication has resolved, and never combine it with another hormonal contraceptive."}
     ]},

    {id:"androgen", nav:"Hair and skin", title:"Hirsutism, acne and hair loss", sub:"These are often the reason she came. Treatment is slow, so agree on a review point at the start.",
     blocks:[
       {b:"ladder", steps:[
         {step:"All", title:"Cosmetic and mechanical measures", when:"any time, alongside drugs", fromLabel:"first and ongoing",
          html:"Shaving, waxing, threading, bleaching, and laser or intense pulsed light (less effective on fair, grey or red hair; laser is rarely NHS-funded). Shaving does not make hair coarser or faster-growing. The international guideline supports laser and light therapy for facial hirsutism."},
         {step:"Face", title:"Eflornithine 11.5% cream", when:"facial hirsutism", fromLabel:"topical adjunct",
          html:"Licensed for facial hirsutism in women. Apply twice daily at least 8 hours apart. Improvement may appear within 8 weeks; stop if there is no benefit after 4 months. Hair returns to baseline about 8 weeks after stopping (Vaniqa SPC). Supply of the branded cream has been intermittent, so check local availability."},
         {step:"First drug", title:"Combined oral contraceptive pill", when:"hirsutism or acne", fromLabel:"within UKMEC",
          html:"Allow at least 6 months before judging the effect on hair growth. Acne often responds sooner and can be treated in parallel using the usual acne pathway."},
         {step:"Second line", title:"Anti-androgen", when:"still troublesome at about 6 months", fromLabel:"local formulary and competence",
          html:"Assess response after approximately 6 months of combined hormonal contraception and/or cosmetic treatment. If hirsutism remains troublesome, consider an anti-androgen, specialist advice, or dermatology or endocrinology referral, depending on severity and local arrangements; prescribing follows the local formulary and clinician competence and need not always be specialist-led. Effective contraception is essential because anti-androgens can feminise a male fetus. Spironolactone: pregnancy must be avoided; check renal function and potassium where clinically indicated; warn about menstrual irregularity and breast tenderness; document that use for PCOS is off-label. <b>Dose per local formulary and BNF</b>."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Female-pattern hair loss", html:"Thinning over the crown with a preserved frontal hairline can be an androgen feature of PCOS. Ferritin and thyroid function may be checked as tests for the differential diagnosis (they are not core PCOS tests), and scarring (which changes the pathway) is looked for. Manage it alongside the other androgen features; see the female pattern hair loss page for the treatment pathway.", src:"International PCOS guideline 2023 (international)"},
         {tone:"cream", h:"Measure before you treat", html:"Record a modified Ferriman–Gallwey score or take photographs at baseline. Ask how much time she spends on hair removal and how it affects her. Improvement is gradual and is easier to see against a documented baseline at the 6-month review.", src:"International PCOS guideline 2023 (international)"}
       ]}
     ]},

    {id:"weight", nav:"Weight", title:"Weight, lifestyle and weight-management medicines", sub:"Lifestyle support is for everyone with PCOS, at every weight. The language matters as much as the advice.",
     blocks:[
       {b:"tiles", v:"life", items:[
         {t:"Target", html:"Where excess weight is present, modest weight loss may improve metabolic health, ovulation and menstrual regularity. Preventing further weight gain is also a valid goal. Agree an individualised, non-stigmatising plan rather than a fixed percentage target."},
         {t:"Diet", html:"No single diet works better in PCOS. Help her pick a sustainable, reduced-energy pattern and refer to a structured programme where available."},
         {t:"Activity", html:"Adults: at least 150 to 300 minutes of moderate or 75 to 150 minutes of vigorous activity a week, with muscle-strengthening on 2 days, and less sitting."},
         {t:"Eating", html:"Screen for binge eating and other eating disorders before prescribing weight loss. An eating disorder can exist at any weight, and weight-focused interventions can worsen eating-disorder symptoms."},
         {t:"Smoking and alcohol", html:"Stopping smoking cuts cardiovascular risk and raises combined-pill eligibility; keep alcohol within low-risk limits."},
         {t:"Language", html:"Ask permission to discuss weight, avoid blame, and focus on health rather than a number on the scales."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"cream", h:"Weight-management medicines", html:"Assess and offer them within the technology appraisal criteria, not by diagnosis. <b>Semaglutide (TA875)</b>: BMI of 35 or more with at least one weight-related comorbidity, or 30 to 34.9 meeting specialist-service referral criteria, used for up to 2 years within a specialist weight-management service. <b>Tirzepatide (TA1026)</b>: BMI of 35 or more with at least one weight-related comorbidity, alongside a reduced-calorie diet and increased physical activity. Lower BMI thresholds (usually by 2.5 kg/m²) apply for specified ethnic groups. PCOS alone is not an indication. In Bolton, follow the current GMMMG commissioning position, which may be more restrictive and phased than the NICE criteria.", src:"NICE TA875 (2023) · NICE TA1026 (2024) · NICE NG246 (2025)"},
         {tone:"amber", h:"Contraception on GLP-1 medicines", html:"Do not use tirzepatide or semaglutide in pregnancy; address contraception before prescribing, because weight loss can restore ovulation unexpectedly. Stop tirzepatide at least 1 month, and semaglutide generally 2 months, before a planned pregnancy (check the product SmPC). The oral contraceptive precaution applies specifically to tirzepatide: FSRH advises a non-oral method, or adding a barrier method, for 4 weeks after starting and for 4 weeks after every dose increase. This is not routinely required solely because of semaglutide, liraglutide, dulaglutide or exenatide, although vomiting or severe diarrhoea can reduce oral contraceptive absorption.", src:"MHRA Drug Safety Update (June 2025) · FSRH statement on GLP-1 agonists and oral contraception (February 2025)"}
       ]},
       {b:"why", html:"<b>Why weight loss helps so broadly:</b> insulin resistance and high insulin levels drive ovarian androgen production and lower sex hormone-binding globulin, so free testosterone rises. Reducing insulin resistance, whether through weight loss, activity or metformin, eases the androgen features and can restore ovulation."}
     ]},

    {id:"fertility", nav:"Fertility", title:"Fertility and pregnancy", sub:"Most women with PCOS can conceive, many with help. Do not delay referral once she is trying.",
     blocks:[
       {b:"cards", items:[
         {tone:"green", h:"Before she tries", html:"Folic acid, stopping smoking, a pre-pregnancy OGTT, blood pressure check, and review of teratogenic medicines (stop anti-androgens, and GLP-1 or tirzepatide medicines, before trying). If her BMI is 30 or more, explain that losing weight may restore ovulation and improves the response to treatment and pregnancy outcomes.", src:"NICE NG257 (2026) · International PCOS guideline 2023 (international)"},
         {tone:"cream", h:"When to refer", html:"NICE NG257: offer an earlier referral for specialist consultation if she is 36 or over, or if there is a known clinical cause of infertility. Anovulation associated with PCOS is a recognised cause of infertility, so do not necessarily wait 12 months; refer earlier where there are other fertility factors.", src:"NICE NG257 (2026)"},
         {tone:"blue", h:"Ovulation induction (specialist)", html:"The international guideline makes <b>letrozole</b> the first-line drug for ovulation induction in anovulatory PCOS with no other fertility factor; <b>clomifene</b>, with or without metformin, is an alternative, and gonadotrophins or laparoscopic ovarian surgery are second line. Letrozole is off-label for this use in the UK. NG257 (March 2026) removed its PCOS-specific ovulation-induction recommendations pending the PMOS guideline in development (GID-NG10436), so these are specialist decisions. Pregnancy must be excluded before use, and semen analysis and tubal factors remain relevant. Do not start letrozole in routine primary care unless this is specifically supported by the local fertility pathway and prescriber competence.", src:"International PCOS guideline 2023 (international) · NICE NG257 (2026)"},
         {tone:"amber", h:"Pregnancy is higher risk", html:"Gestational diabetes, hypertensive disorders and preterm birth are more common. Flag PCOS at antenatal booking so glucose testing is arranged, and check blood pressure closely.", src:"International PCOS guideline 2023 (international)"}
       ]}
     ]},

    {id:"review", nav:"Review", title:"Mental health, sleep and the yearly review", sub:"PCOS is lifelong. The review is where most long-term harm is prevented.",
     blocks:[
       {b:"timeline", items:[
         {n:"1", when:"Diagnosis", title:"Explain and baseline", html:"Explain the diagnosis and the new PMOS name. Record weight, BP, glucose status, lipids and hirsutism score. Screen mood, anxiety, eating and sleep. Agree her goal and the endometrial plan."},
         {n:"2", when:"3 to 6 months", title:"Early check", html:"Tolerance of the pill or metformin, BP on the combined pill, withdrawal bleeds happening, and eflornithine response at 4 months."},
         {n:"3", when:"6 months", title:"Hair review", html:"Compare against the baseline score or photos. If response is inadequate, consider an anti-androgen with contraception, or referral."},
         {n:"4", when:"Every year", title:"Annual review", html:"Weight and weight-related comorbidity, BP, cycle pattern and endometrial protection, mood, anxiety, eating and body image, sleep symptoms, medicines and adverse effects, contraception and pregnancy intentions; lipids according to the result and cardiovascular risk. Glucose every 1 to 3 years according to risk (preferably OGTT where feasible), or yearly if HbA1c is 42 to 47 mmol/mol."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Mood, anxiety and body image", html:"Screen everyone for depression and anxiety at diagnosis and when concerns arise, by direct clinical enquiry rather than relying on a single tool. Ask about body image, eating disorders, self-harm risk and quality of life, and remember that weight-focused interventions can worsen eating-disorder symptoms. Offer evidence-based psychological therapy on usual general-population pathways.", src:"International PCOS guideline 2023 (international)"},
         {tone:"blue", h:"The UK guideline is coming", html:"A UK PMOS guideline, GID-NG10436, is in development. Its draft was out for consultation from July to 11 August 2026, and publication is expected on 9 December 2026. Draft NICE guidance must not be treated as current NICE guidance and must not be used as the sole basis for clinical decisions: none of the draft recommendations is used on this page. Terminology, coding and patient materials may change at different times, so this page will be revised when the final guideline is published.", src:"GID-NG10436, in development (expected December 2026)"}
       ]},
       {b:"say", html:"PCOS, which is now being called PMOS, is a hormone condition that affects periods, skin and hair, weight, and your future risk of diabetes. It is very common and very manageable. Today we’ll check the things that could be hiding behind your symptoms, make sure the lining of your womb is protected, and pick the treatment for what bothers you most. Then we’ll see you once a year to keep an eye on your sugar, blood pressure and mood."}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — who, where and how fast", sub:"Most PCOS stays in primary care. These are the exceptions.",
     blocks:[
       {b:"cards", items:[
         {tone:"purple", h:"Suspected endometrial cancer <span class='tw'>Suspected cancer</span>", html:"Postmenopausal bleeding is unexplained vaginal bleeding more than 12 months after menstruation has stopped. NICE NG12 (updated April 2026): refer using a suspected cancer pathway referral for endometrial cancer in women aged 55 and over with postmenopausal bleeding that cannot be attributed to HRT. Consider the same referral under 55 for unexplained postmenopausal bleeding not attributable to HRT.", src:"NICE NG12 (updated April 2026)"},
         {tone:"red", h:"Rapid virilisation, markedly raised testosterone or postmenopausal androgen excess", html:"Urgent endocrinology assessment for a suspected androgen-secreting ovarian or adrenal disorder (testosterone above about 5 nmol/L is an investigation trigger, not a diagnosis); include the testosterone result and how fast the features developed.", src:"Society for Endocrinology androgen excess guideline, Clin Endocrinol 2025"},
         {tone:"amber", h:"Endometrial concern before the menopause", html:"Severe or persistent intermenstrual, post-coital, prolonged or otherwise abnormal bleeding, failed response to endometrial protection, prolonged amenorrhoea with concerning features, or concerning findings on a scan done for a clinical indication: refer according to the local gynaecology pathway.", src:"International PCOS guideline 2023 (international)"},
         {tone:"cream", h:"Trying to conceive", html:"Fertility services at presentation if she is anovulatory, aged 36 or over, or has other known fertility factors.", src:"NICE NG257 (2026)"},
         {tone:"cream", h:"Diagnostic doubt or suspected mimic", html:"Raised 17-OHP, suspected Cushing’s, significant hyperprolactinaemia, or an unclear picture in an adolescent: endocrinology (paediatric endocrinology for under-16s).", src:"International PCOS guideline 2023 (international)"},
         {tone:"cream", h:"Treatment not working", html:"Hirsutism not controlled after 6 months of the pill plus cosmetic measures, or the pill unsuitable: endocrinology or dermatology advice on anti-androgens. Severe obesity meeting criteria: specialist weight-management service, according to the current GMMMG commissioning position.", src:"International PCOS guideline 2023 (international) · NICE NG246 (2025)"}
       ]},
       {b:"warn", html:"Premenopausal irregular bleeding in PCOS does not meet an NG12 criterion on its own; manage it by protecting the endometrium and refer to gynaecology if abnormal bleeding persists or there are concerning findings. If examination finds ascites and/or a pelvic or abdominal mass (not obviously uterine fibroids), refer using the NG12 suspected cancer pathway for ovarian cancer."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card; the Casebook holds the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 27-year-old woman has had 4 periods in the past year, facial hair she threads every week, and acne. Her BMI is 33 and her mother has type 2 diabetes. She has read online that PCOS means she cannot have children, and she wants something for the hair. She is not trying to conceive for another year or two.", src:"International PCOS guideline 2023 (international)"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Explores her ideas and the fertility worry; asks about <b>speed of onset and virilisation</b>; plans testosterone, <b>TSH, prolactin, 17-OHP</b> and pregnancy test; addresses <b>endometrial protection</b> for infrequent bleeds; checks <b>UKMEC</b> (BMI 33 alone is category 2) and still assesses BP, migraine, smoking, thrombosis history and other cardiovascular risks before the pill; arranges <b>glucose (OGTT preferred), lipids and BP</b>; offers weight support without blame; asks about mood and eating; sets a <b>6-month hair review</b>; explains fertility is usually achievable, with early referral when she is ready.", src:"UKMEC 2025 (FSRH/CoSRH) · RCOG Green-top Guideline 33 (2014)"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Every figure on this page traces to one of these primary sources.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>International evidence-based guideline for the assessment and management of polycystic ovary syndrome (2023) — Monash University with ESHRE, ASRM and partner societies (international: GID-NG10436, the UK PMOS guideline, is still in development). Teede HJ et al., J Clin Endocrinol Metab 2023;108:2447–69<br><a href="https://academic.oup.com/jcem/article/108/10/2447/7242360" rel="noopener">academic.oup.com — JCEM 2023 recommendations</a><span class="rd"> — diagnostic criteria and cycle definitions, adolescent criteria, AMH, exclusion tests, metabolic, BP and lipid screening, OGTT in pregnancy, sleep apnoea, mental health, endometrial cancer risk with no routine endometrial screening, modest weight loss and preventing weight gain, activity targets, combined pill, metformin at BMI 25 or more, anti-androgens after 6 months, letrozole first line</span></li>'+
         '<li>Polyendocrine metabolic ovarian syndrome, the new name for polycystic ovary syndrome: a multistep global consensus process. Lancet, May 2026<br><a href="https://www.thelancet.com/journals/lancet/article/PIIS0140-6736(26)00717-8/fulltext" rel="noopener">thelancet.com</a><span class="rd"> — the PMOS name change and its rationale (terminology only; clinical recommendations remain those of the 2023 guideline)</span></li>'+
         '<li>GID-NG10436 (in development at nice.org.uk) — Polyendocrine metabolic ovarian syndrome (PMOS): draft consultation July to August 2026, publication expected December 2026 (not yet published)<br><a href="https://www.nice.org.uk/guidance/indevelopment/gid-ng10436" rel="noopener">nice.org.uk/guidance/indevelopment/gid-ng10436</a><span class="rd"> — status only; draft NICE guidance is not current NICE guidance and no draft recommendation is used on this page</span></li>'+
         '<li>RCOG Green-top Guideline No. 33 — Long-term consequences of polycystic ovary syndrome (2014)<br><a href="https://www.rcog.org.uk/guidance/browse-all-guidance/green-top-guidelines/long-term-consequences-of-polycystic-ovary-syndrome-green-top-guideline-no-33/" rel="noopener">rcog.org.uk — GTG 33</a><span class="rd"> — older (2014) UK consensus, used as a supporting historical source: withdrawal bleed at least every 3 to 4 months, OGTT for higher-risk women, no extra breast or ovarian surveillance; its endometrial-thickness statement is not used as a biopsy threshold</span></li>'+
         '<li>NICE NG257 — Fertility problems: assessment and treatment (March 2026; replaced CG156)<br><a href="https://www.nice.org.uk/guidance/ng257" rel="noopener">nice.org.uk/guidance/ng257</a><span class="rd"> — earlier referral at 36 or over or with a known cause; weight loss advice at BMI 30 or more; PCOS ovulation-induction recommendations removed pending the PMOS guideline</span></li>'+
         '<li>NICE PH38 — Type 2 diabetes: prevention in people at high risk (2012, updated 2017)<br><a href="https://www.nice.org.uk/guidance/ph38" rel="noopener">nice.org.uk/guidance/ph38</a><span class="rd"> — HbA1c 42 to 47 mmol/mol high-risk range, yearly retest, intensive lifestyle programme</span></li>'+
         '<li>NICE NG246 — Overweight and obesity management (January 2025, updated January 2026)<br><a href="https://www.nice.org.uk/guidance/ng246" rel="noopener">nice.org.uk/guidance/ng246</a><span class="rd"> — non-stigmatising assessment, ethnicity-adjusted BMI thresholds, specialist services</span></li>'+
         '<li>NICE TA875 — Semaglutide for managing overweight and obesity (2023) and NICE TA1026 — Tirzepatide for managing overweight and obesity (2024, updated 2025)<br><a href="https://www.nice.org.uk/guidance/ta875" rel="noopener">nice.org.uk/guidance/ta875</a> · <a href="https://www.nice.org.uk/guidance/ta1026" rel="noopener">nice.org.uk/guidance/ta1026</a><span class="rd"> — eligibility criteria</span></li>'+
         '<li>NICE NG12 — Suspected cancer: recognition and referral (updated April 2026)<br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — endometrial cancer: postmenopausal bleeding at 55 or over not attributable to HRT</span></li>'+
         '<li>Society for Endocrinology clinical practice guideline for the evaluation of androgen excess in women. Elhassan YS et al., Clin Endocrinol 2025<br><a href="https://onlinelibrary.wiley.com/doi/full/10.1111/cen.15265" rel="noopener">onlinelibrary.wiley.com — Clin Endocrinol 2025</a><span class="rd"> — markedly raised testosterone and rapid virilisation as triggers for urgent investigation (not diagnostic thresholds), assay and test timing</span></li>'+
         '<li>UKMEC 2025 — UK Medical Eligibility Criteria for Contraceptive Use (CoSRH, formerly FSRH, December 2025)<br><a href="https://www.cosrh.org/Common/Uploaded%20files/documents/UKMEC_2025_Summary_Tables.pdf" rel="noopener">cosrh.org — UKMEC 2025 summary tables</a><span class="rd"> — combined pill: BMI 30 to 34.9 UKMEC 2, BMI 35 or more UKMEC 3; hypertension and multiple risk factors</span></li>'+
         '<li>MHRA Drug Safety Update — co-cyprindiol (June 2013) and GLP-1 and dual GIP/GLP-1 medicines: contraception and pregnancy (June 2025)<br><a href="https://www.gov.uk/drug-safety-update/cyproterone-acetate-with-ethinylestradiol-co-cyprindiol-balance-of-benefits-and-risks-remains-positive" rel="noopener">gov.uk — co-cyprindiol DSU</a> · <a href="https://www.gov.uk/drug-safety-update" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> — VTE risk and restricted use of co-cyprindiol; GLP-1 medicines in pregnancy</span></li>'+
         '<li>FSRH (CoSRH) statement — Glucagon-like peptide-1 (GLP-1) agonists and oral contraception (February 2025)<br><a href="https://www.cosrh.org/" rel="noopener">cosrh.org</a><span class="rd"> — tirzepatide: non-oral or added barrier method for 4 weeks after starting and after each dose increase</span></li>'+
         '<li>GMMMG — Interim commissioning statement for tirzepatide in adult weight management (modified September 2025)<br><a href="https://gmmmg.nhs.uk/" rel="noopener">gmmmg.nhs.uk</a><span class="rd"> — local, phased access to tirzepatide in Greater Manchester</span></li>'+
         '<li>BNF and SPCs — metformin, medroxyprogesterone acetate, spironolactone; Vaniqa 11.5% cream SPC<br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a> · <a href="https://www.medicines.org.uk/emc/product/6398/smpc" rel="noopener">medicines.org.uk — Vaniqa SPC</a><span class="rd"> — doses, off-label status, eflornithine twice daily and 4-month stopping rule</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Polycystic ovary syndrome (PMOS) in primary care. Sources: International evidence-based PCOS guideline 2023 (international), RCOG Green-top 33 (2014), NICE NG257 (2026), NICE PH38 (2012, updated 2017), NICE NG246 (2025), NICE TA875 (2023) and TA1026 (2024), NICE NG12 (updated April 2026), UKMEC 2025, Society for Endocrinology 2025 and MHRA Drug Safety Updates. The UK PMOS guideline (GID-NG10436) is in development and not yet published. Drug doses, contraindications, renal/hepatic adjustments, pregnancy advice and licensed indications must be checked against the current local formulary and product information before prescribing. Not a substitute for clinical judgement."
