<script>
MG.render({ snapshot:"summaries/recurrent-miscarriage.html",
icon:"\u{1F331}",
  title:"Recurrent miscarriage",
  eyebrow:"Protocol · assess, refer and support",
  stemTitle:"Recurrent miscarriage: refer after three losses (or two if a cause is suspected), test for antiphospholipid syndrome, and make the next pregnancy's early care easy to reach",
  stemSub:"One page for recurrent miscarriage in primary care, following RCOG Green-top Guideline 17 (2023) and NICE NG126. Rule out the acute emergencies first: ectopic pregnancy, heavy bleeding and sepsis. Then recognise recurrent miscarriage, start or arrange the evidence-based investigations (antiphospholipid antibodies, thyroid function and antibodies, pelvic ultrasound, karyotype of pregnancy tissue), and refer to a recurrent miscarriage clinic. In the next pregnancy, make early pregnancy unit access easy and know when vaginal micronised progesterone is offered. Psychological support runs through all of it.",
  guideline:"RCOG Green-top Guideline 17: Recurrent miscarriage (2023) · NICE NG126 Ectopic pregnancy and miscarriage (2019, updated 2023) · NICE NG201 antenatal care (2021) · utrogestan (micronised progesterone) and aspirin SPCs",
  reviewed:"15 October 2026",
  nextReview:"15 April 2027",
  meta:[
    {t:"RCOG GTG 17 (2023) · definition and investigations"},
    {t:"NICE NG126 (2019, updated 2023) · progesterone"},
    {t:"Inherited thrombophilia testing not routine", tone:"tw"},
    {t:"v1.0 · reviewed Oct 2026", tone:"ok"}
  ],
  lead:"<div class='mg-layers'><a href='#redflags'><b>Today first</b><small>ectopic · bleeding · sepsis</small></a><a href='#confirm'><b>Define and test</b><small>3 losses · APS · TFT · scan</small></a><a href='#manage'><b>Next pregnancy</b><small>EPU · progesterone · aspirin</small></a><a href='#support'><b>Support</b><small>grief, anxiety, partners</small></a></div>",
  quickSub:"The six points that change what you do today. Each one is traced to a named source under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"First: is she bleeding, in pain or unwell today?", html:"Pain with a positive pregnancy test, shoulder-tip pain or collapse → suspected <b>ectopic pregnancy</b>: <b>999</b> if unstable, otherwise <b>same-day</b> early pregnancy unit or emergency gynaecology. <b>Heavy bleeding</b> with dizziness or tachycardia, or fever, offensive discharge and pelvic pain after a miscarriage (possible <b>sepsis</b>) → <b>999</b> or same-day admission."},
    {tone:"cream", h:"Definition: three or more losses, or two if a cause is suspected", html:"RCOG GTG 17 (2023) defines recurrent miscarriage as <b>three or more first-trimester miscarriages</b>, which need not be consecutive or with the same partner. A full assessment can be considered <b>after two</b> if there is a suspicion of a pathological cause, and <b>any second-trimester loss</b> warrants assessment. It affects about 1% of couples."},
    {tone:"amber", h:"Investigations that are recommended", html:"<b>Antiphospholipid antibodies</b> (lupus anticoagulant and anticardiolipin antibodies, repeated after 12 weeks if positive) before the next pregnancy; <b>thyroid function and TPO antibodies</b>; <b>pelvic ultrasound</b> (ideally 3D) for uterine anomalies; <b>cytogenetic analysis of pregnancy tissue</b> from the third and later miscarriages and any second-trimester loss, with <b>parental karyotyping</b> only if an unbalanced structural abnormality is found or no tissue is available."},
    {tone:"amber", h:"Investigations that are not routine", html:"<b>Inherited thrombophilia</b> testing is not routine (factor V Leiden, prothrombin gene mutation and protein S only after second-trimester loss, ideally in research). Do not offer immunological tests (for example natural killer cells), routine infection screening or sperm DNA fragmentation outside research."},
    {tone:"cream", h:"Progesterone when she bleeds in the next pregnancy", html:"NICE NG126 (2021 update): offer <b>vaginal micronised progesterone 400 mg twice daily</b> to women with <b>vaginal bleeding in early pregnancy and a previous miscarriage</b>, once an intrauterine pregnancy is confirmed on scan, continued to <b>16 completed weeks</b>. Off-label. It is not routinely offered without bleeding."},
    {tone:"green", h:"Referral, early care and support improve the experience", html:"Refer to a <b>recurrent miscarriage clinic</b>. In the next pregnancy, ensure <b>early pregnancy unit</b> access and early reassurance scans per the clinic plan. Unexplained recurrent miscarriage still carries a good chance of a live birth next time. Offer <b>psychological support</b> and screen for anxiety, depression and post-traumatic stress in both partners."}
  ],
  pathwaySub:"The consultation in five moves. The acute check comes before the history of losses.",
  pathway:[
    {title:"Exclude the acute emergency", html:"Pain, bleeding, collapse, fever: ectopic pregnancy, haemorrhage, retained tissue or sepsis → 999 or same-day EPU or gynaecology."},
    {title:"Take the reproductive history", html:"Number and gestation of losses, scan findings, any tissue karyotype, second-trimester losses, other pregnancies, partner, medical history (thyroid, autoimmune disease, thrombosis), BMI, smoking, alcohol and caffeine."},
    {title:"Start or arrange the tests", html:"Antiphospholipid antibodies, TFT and TPO antibodies, pelvic ultrasound, as the local clinic prefers. Request tissue cytogenetics with the next miscarriage."},
    {title:"Refer", html:"Recurrent miscarriage clinic after three losses, or after two if a cause is suspected, or after any second-trimester loss. Include results already done."},
    {title:"Plan the next pregnancy and support", html:"Folic acid, lifestyle, EPU contact details, progesterone if bleeding, any specialist plan (aspirin and heparin for antiphospholipid syndrome). Offer counselling and signpost support organisations."}
  ],
  sections:[
    {id:"redflags", nav:"Red flags", title:"Red flags: early pregnancy emergencies", sub:"Women with recurrent miscarriage still have ectopic pregnancies, haemorrhages and infections.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Suspected ectopic pregnancy", html:"Positive pregnancy test with abdominal or pelvic pain, shoulder-tip pain, dizziness or collapse → <b>999</b> if haemodynamically unstable; otherwise <b>same-day</b> early pregnancy unit or emergency gynaecology assessment. Previous miscarriages do not lower ectopic risk.", src:"NICE NG126 (2019, updated 2023)"},
         {tone:"red", h:"🔴 Heavy bleeding", html:"Soaking pads hourly, clots, dizziness, tachycardia or hypotension → <b>999</b>. Products in the cervical os can cause cervical shock.", src:"NICE NG126 (2019, updated 2023)"},
         {tone:"red", h:"🔴 Infection after miscarriage", html:"Fever, offensive discharge, pelvic pain or tenderness after a miscarriage or its management → <b>same-day</b> gynaecology assessment; <b>999</b> if sepsis features.", src:"NICE NG126 (2019, updated 2023)"},
         {tone:"amber", h:"🟠 Mental health", html:"Grief, anxiety, depression and post-traumatic stress are common after repeated loss, in women and partners. Ask about suicidal thoughts and act on the answer the same day.", src:"RCOG GTG 17 (2023)"}
       ]},
       {b:"why", html:"A woman with several miscarriages may assume today's pain is 'another one' and wait at home. Ectopic pregnancy and sepsis kill, and they are not prevented by a history of intrauterine losses. Clearing the acute question first keeps the long-term conversation safe."}
     ]},

    {id:"confirm", nav:"Assess", title:"Define and investigate", sub:"RCOG GTG 17 (2023) investigations; local clinics vary in which they start in primary care.",
     blocks:[
       {b:"table", head:["Test","Who","Notes"], rows:[
         ["<b>Antiphospholipid antibodies</b> (lupus anticoagulant, anticardiolipin IgG and IgM; anti-β2-glycoprotein I per local lab)","All with recurrent miscarriage, before the next pregnancy","Positive → repeat after 12 weeks; persistent positivity with recurrent loss = antiphospholipid syndrome."],
         ["<b>Thyroid function and TPO antibodies</b>","All with recurrent miscarriage","Abnormal thyroid function → treat and plan with the specialist (see <a href='thyroid-pregnancy.html'>thyroid in pregnancy</a>)."],
         ["<b>Pelvic ultrasound</b> (ideally 3D)","All with recurrent miscarriage","Congenital uterine anomalies such as a septate uterus; management is a specialist decision."],
         ["<b>Cytogenetics of pregnancy tissue</b>","Third and later miscarriages; any second-trimester loss","Request at the time of the miscarriage (tissue must be sent fresh, not in formalin)."],
         ["<b>Parental karyotype</b>","Only if tissue shows an unbalanced structural abnormality, or no tissue is available","Arranged by the clinic with genetics."],
         ["<b>Inherited thrombophilia</b>","Not routinely","Factor V Leiden, prothrombin gene mutation and protein S only after second-trimester loss, ideally in research."]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"🟠 Not recommended outside research", html:"Natural killer cell or other immunological testing, routine infection screening, sperm DNA fragmentation testing, and inherited thrombophilia testing after first-trimester losses. Explain this kindly: couples are often offered such tests privately.", src:"RCOG GTG 17 (2023)"},
         {tone:"blue", h:"🗒️ History that matters", html:"Gestation at each loss and whether a heartbeat was seen; any tissue karyotype; second-trimester loss or cervical weakness; thrombosis, lupus or autoimmune disease; diabetes and thyroid disease; BMI; smoking, alcohol, caffeine; maternal age (risk rises steeply after 40).", src:"RCOG GTG 17 (2023)"}
       ]}
     ]},

    {id:"manage", nav:"Next pregnancy", title:"Management: before and during the next pregnancy", sub:"Treatments are specialist-planned; primary care makes them happen and keeps early care accessible.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1", tone:"cream", title:"Before conception", when:"everyone", fromLabel:"then",
          html:"<b>Folic acid</b> 400 micrograms daily (5 mg if higher risk, such as diabetes or a previous neural tube defect; BMI alone does not need 5 mg, NICE NG247) from before conception to 12 weeks. Aim for a <b>BMI of 19–25</b>; stop smoking (see <a href='smoking-cessation.html'>smoking cessation</a>); avoid alcohol; keep caffeine below 200 mg a day. Optimise thyroid, diabetes and other conditions."},
         {step:"2", tone:"amber", title:"Antiphospholipid syndrome", when:"specialist plan", fromLabel:"and",
          html:"Women with antiphospholipid syndrome and recurrent miscarriage are offered <b>low-dose aspirin plus prophylactic-dose heparin</b> in pregnancy, started and supervised by the specialist team. <span class=mg-dose>Usual adult dose: aspirin 75 mg once daily, from a positive pregnancy test as the specialist plan sets (SPC; check the SPC, BNF and local formulary; <a href='https://www.medicines.org.uk/emc/search?q=aspirin+75' target=_blank rel=noopener>SPC: aspirin</a>)</span>."},
         {step:"3", tone:"cream", title:"Early pregnancy care", when:"positive test", fromLabel:"if bleeding",
          html:"Give the <b>early pregnancy unit</b> contact details and the self-referral route if local. Supportive care and early scans per the clinic plan. Book early with maternity services."},
         {step:"4", tone:"green", title:"Bleeding in early pregnancy", when:"intrauterine pregnancy confirmed", fromLabel:"",
          html:"Offer <b>vaginal micronised progesterone</b> to women with bleeding and a previous miscarriage once an intrauterine pregnancy is confirmed on scan. <span class=mg-dose>Usual adult dose: 400 mg vaginally twice daily, continued to 16 completed weeks if a fetal heartbeat is confirmed (NICE NG126; off-label; check the SPC, BNF and local formulary; <a href='https://www.medicines.org.uk/emc/search?q=utrogestan' target=_blank rel=noopener>SPC: micronised progesterone</a>)</span>. Usually started by the EPU."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"🟠 Not routinely offered", html:"Progesterone without bleeding in unexplained recurrent miscarriage; heparin or aspirin without antiphospholipid syndrome; steroids, intravenous immunoglobulin or other immunotherapy; levothyroxine for women with normal thyroid function who are TPO-antibody positive.", src:"RCOG GTG 17 (2023) · NICE NG126 (2019, updated 2023)"},
         {tone:"green", h:"✅ Prognosis", html:"With no cause found, most women go on to have a live birth in a future pregnancy. The chance falls with more previous losses and with maternal age.", src:"RCOG GTG 17 (2023)"}
       ]},
       {b:"say", html:"I'm so sorry this has happened again. Most of the time we don't find a cause, and that is actually reassuring: most women in your position go on to have a baby. I'd like to do some blood tests and a scan and refer you to a specialist clinic that looks after couples who have had several losses. Next time you're pregnant, you'll be able to go straight to the early pregnancy unit, and if you bleed there's a treatment that can help."}
     ]},

    {id:"support", nav:"Support", title:"Psychological support", sub:"Part of treatment, not an extra.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"cream", h:"🧠 Screen and support", html:"Ask about anxiety, low mood, sleep and post-traumatic symptoms at each contact, in both partners. Offer talking therapies (self-referral) and specialist bereavement counselling where available. Anxiety often peaks in the next pregnancy.", src:"RCOG GTG 17 (2023)"},
         {tone:"green", h:"🤝 Organisations", html:"The Miscarriage Association; Tommy's (including its national centre for miscarriage research clinics). Record the losses sensitively in the notes so they are not asked about repeatedly.", src:"RCOG GTG 17 (2023)"}
       ]}
     ]},

    {id:"special", nav:"Special groups", title:"Special groups", sub:"Groups where the default plan changes.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"⏳ Second-trimester loss", html:"Any loss after 12 weeks warrants specialist assessment (including cervical weakness, uterine anomaly and selected thrombophilia tests), even after a single event.", src:"RCOG GTG 17 (2023)"},
         {tone:"amber", h:"🧑‍🤝‍🧑 Age 40 and over", html:"Aneuploidy is the dominant cause; discuss prognosis honestly and link with fertility services where time matters (see <a href='infertility.html'>infertility</a>).", src:"RCOG GTG 17 (2023)"},
         {tone:"blue", h:"💉 Previous thrombosis or lupus", html:"These women need specialist planning before pregnancy (anticoagulation, rheumatology and obstetric medicine).", src:"RCOG GTG 17 (2023)"},
         {tone:"cream", h:"⚖️ Obesity", html:"BMI 30 or above increases miscarriage risk; offer weight management support before conception (see <a href='obesity.html'>obesity</a>); 400 micrograms folic acid is enough unless another risk factor is present.", src:"RCOG GTG 17 (2023) · NICE NG247 (2025)"}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer: who, where and how fast", sub:"Acute problems go to the EPU; the pattern of losses goes to the recurrent miscarriage clinic.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999", html:"Collapse or haemodynamic instability with a positive test; heavy bleeding with shock; sepsis.", src:"NICE NG126 (2019, updated 2023)"},
         {tone:"red", h:"Same-day early pregnancy unit or emergency gynaecology", html:"Pain with a positive test (possible ectopic); bleeding with pain; fever after a miscarriage.", src:"NICE NG126 (2019, updated 2023)"},
         {tone:"amber", h:"Recurrent miscarriage clinic", html:"Three or more first-trimester losses; two if a pathological cause is suspected; any second-trimester loss. Send results already available.", src:"RCOG GTG 17 (2023)"},
         {tone:"amber", h:"Obstetric medicine or haematology", html:"Antiphospholipid syndrome, previous thrombosis or lupus, before the next pregnancy.", src:"RCOG GTG 17 (2023)"},
         {tone:"green", h:"Primary care", html:"Tests the clinic asks you to start, preconception advice, mental health support, and easy EPU access in the next pregnancy.", src:"RCOG GTG 17 (2023)"}
       ]}
     ]},

    {id:"safety", nav:"Safety-net", title:"Patient information and safety-netting", sub:"Say it, give it in writing, document it.",
     blocks:[
       {b:"say", html:"Call 999 if you're pregnant and collapse, feel faint with pain, or are bleeding so heavily you soak a pad every hour. If you have pain or bleeding in early pregnancy, contact the early pregnancy unit or us the same day. After a miscarriage, a fever, smelly discharge or worsening tummy pain needs to be seen the same day. If you are struggling with how you feel, please tell us."},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"📄 Information", html:"NHS: recurrent miscarriage. RCOG patient information: recurrent miscarriage. The Miscarriage Association. Tommy's.", src:"RCOG GTG 17 (2023)"},
         {tone:"green", h:"🗓️ Next pregnancy checklist", html:"Folic acid; EPU number saved; any specialist plan (aspirin and heparin); know that progesterone is offered if bleeding occurs; book early with maternity.", src:"NICE NG126 (2019, updated 2023)"}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 34-year-old woman calls after her third miscarriage at 8 weeks. She has read online about 'NK cell tests' and progesterone, and asks for both. She mentions she has had some left-sided pain since the miscarriage was diagnosed yesterday.", src:"RCOG GTG 17 (2023)"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Acknowledges the loss. Explores the <b>pain</b> and arranges same-day EPU review (miscarriage confirmed on scan? ectopic or retained tissue?). Explains <b>recurrent miscarriage</b>, the recommended tests (APS, thyroid, scan, tissue karyotype) and referral. Explains why NK cell testing is not recommended and when <b>progesterone</b> is offered (bleeding in a future pregnancy). Offers psychological support.", src:"RCOG GTG 17 (2023) · NICE NG126 (2019, updated 2023)"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Every recommendation on this page traces to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>RCOG — Recurrent miscarriage, Green-top Guideline No. 17 (Regan L et al., BJOG, June 2023)</b><br><a href="https://www.rcog.org.uk/guidance/browse-all-guidance/green-top-guidelines/recurrent-miscarriage-green-top-guideline-no-17/" rel="noopener">rcog.org.uk — GTG 17</a><span class="rd"> — definition (three or more first-trimester losses; assessment after two if pathological cause suspected), antiphospholipid testing, thyroid tests, 3D ultrasound, tissue cytogenetics, parental karyotype, inherited thrombophilia not routine, aspirin and heparin in APS, lifestyle, supportive care</span></li>'+
         '<li><b>NICE NG126 — Ectopic pregnancy and miscarriage: diagnosis and initial management (2019, updated 2023)</b><br><a href="https://www.nice.org.uk/guidance/ng126" rel="noopener">nice.org.uk/guidance/ng126</a><span class="rd"> — vaginal micronised progesterone 400 mg twice daily to 16 weeks for bleeding with a previous miscarriage (2021 update), ectopic pregnancy recognition, early pregnancy services</span></li>'+
         '<li><b>NICE NG201 — Antenatal care (2021)</b><br><a href="https://www.nice.org.uk/guidance/ng201" rel="noopener">nice.org.uk/guidance/ng201</a><span class="rd"> — folic acid, lifestyle in pregnancy</span></li>'+
         '<li><b>SPCs — micronised progesterone (Utrogestan), aspirin</b><br><a href="https://www.medicines.org.uk/emc" rel="noopener">medicines.org.uk/emc</a><span class="rd"> — formulations; progesterone use for threatened miscarriage is off-label</span></li>'+
         '<li><b>The Miscarriage Association</b> and <b>Tommy&#39;s</b><br><a href="https://www.miscarriageassociation.org.uk/" rel="noopener">miscarriageassociation.org.uk</a> · <a href="https://www.tommys.org/" rel="noopener">tommys.org</a><span class="rd"> — patient support</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Recurrent miscarriage in primary care — RCOG Green-top Guideline 17 (2023), NICE NG126 (2019, updated 2023), NICE NG201 and the progesterone and aspirin SPCs. Investigations and treatments are specialist-planned; local clinics vary in which tests primary care starts. Not a substitute for clinical judgement."
});
