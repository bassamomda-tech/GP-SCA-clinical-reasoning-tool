MG.render({
  icon:"💫",

  stemTitle:"Vasovagal is a diagnosis of exclusion — and the two red flags that make it unlikely are collapse during exertion and collapse while lying flat",
  stemSub:"One page for the condition: vasovagal syncope is a diagnosis of exclusion, so this page carries the exclusion work as well as the management. Take the witness account, because it is more diagnostically powerful than the patient's own recall; use position, prodrome, duration and recovery to separate syncope from seizure; do the ECG and the lying-and-standing BP promptly, without letting them delay an urgent referral; give the current DVLA advice for the event, licence group and suspected cause; then treat by mechanism — counter-manoeuvres and appropriate fluid advice for vasovagal, medication review first for orthostatic, and urgent cardiovascular assessment (within 24 hours, same-day emergency if unstable) for anything exertional, supine or arrhythmic.",
  guideline:"NICE CG109 (2010) · ESC Syncope 2018 (international) · DVLA Assessing fitness to drive (2025 TLoC revision) · NICE NG12 (updated April 2026)",
  reviewed:"10 September 2026",
  nextReview:"10 March 2027",
  meta:[
    {t:"NICE CG109 — transient loss of consciousness"},
    {t:"NICE CG109 (TLoC) · ESC Syncope Guidelines (2018, international)"},
    {t:"DVLA — Assessing fitness to drive"},
    {t:"BNF · Bramox SPC · POST trial (2006)"},
    {t:"No NG12 cancer criterion applies", tone:"tw"},
    {t:"v1.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#severe"><b>Exclude cardiac</b><small>Exertional · supine</small></a><a href="#confirm"><b>Syncope or fit?</b><small>Witness · prodrome</small></a><a href="#workup"><b>Before referral</b><small>ECG · lying/standing BP</small></a><a href="#ladder"><b>Treat</b><small>By mechanism</small></a><a href="#monitor"><b>DVLA</b><small>Current DVLA rules</small></a></div>',
  quickSub:"If you read nothing else on this page, read these six cards. Every number traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Exertional or supine syncope: cardiac red flag until assessed", html:"Syncope occurring during exertion is a high-risk feature: refer for <b>urgent cardiovascular assessment, normally within 24 hours</b> (NICE CG109), and advise the patient to avoid exertion and driving until assessed. Use <b>same-day emergency referral</b> if the patient is unstable, has chest pain, severe breathlessness, sustained arrhythmia or another acute high-risk feature. Syncope while supine is unusual for uncomplicated vasovagal syncope and should be treated as a cardiac red flag until assessed. Think <b>HOCM, aortic stenosis, arrhythmia</b>."},
    {tone:"red", h:"No prodrome means cardiac exclusion first", html:"A progressive autonomic prodrome supports reflex syncope; its absence points towards an arrhythmic cause. <b>NICE CG109: consider specialist cardiovascular assessment within 24 hours for anyone over 65 with TLoC without prodromal symptoms</b>; in younger adults an absent prodrome still points towards an arrhythmic cause and needs cardiac exclusion. Palpitations or chest pain beforehand make it high-risk. Any QT abnormality, Brugada pattern, significant conduction abnormality, ventricular arrhythmia, pre-excitation or ischaemic ST/T-wave abnormality should prompt urgent specialist review. Document the QTc and interpret it with the ECG machine, clinical context and local cardiology criteria; QTc ≥500 ms is particularly concerning."},
    {tone:"amber", h:"Brief jerks can occur in a faint", html:"Brief seizure-like movements may occur during uncomplicated faints (NICE CG109) — do not read them as tonic-clonic activity. A progressive autonomic prodrome, pallor and rapid reorientation support reflex syncope. Prolonged confusion, sustained tonic-clonic activity, head turning or a clearly bitten tongue increase the likelihood of epilepsy. <b>No single feature is diagnostic; refer when uncertainty remains.</b>"},
    {tone:"blue", h:"Do the ECG and standing BP — without delaying urgent referral", html:"Perform a 12-lead ECG and lying/standing BP promptly when this will not delay urgent transfer. <b>Do not delay emergency or urgent cardiac referral</b> in an exertional, supine, unstable or clearly arrhythmic presentation. Measure BP lying or seated, then repeat after standing for at least 1 minute, continuing for up to 3 minutes where clinically appropriate; a fall in systolic BP of at least 20 mmHg or diastolic BP of at least 10 mmHg supports postural hypotension. Both tests take minutes and change which specialty you refer to."},
    {tone:"purple", h:"DVLA advice: follow the current guidance", html:"Give the patient the current DVLA advice appropriate to the event, licence group and suspected cause, checking the <a href='https://www.gov.uk/government/publications/assessing-fitness-to-drive-a-guide-for-medical-professionals' rel='noopener'>current DVLA guidance</a> rather than relying on a summary. Document the advice, including the date from which any restriction applies. If a seizure is suspected, advise the patient to stop driving immediately and follow the DVLA epilepsy/TLoC rules; do not wait for specialist confirmation before giving safety advice — and <b>do not document \u201cepilepsy\u201d before specialist confirmation</b>, which has its own medico-legal consequences."},
    {tone:"green", h:"Counter-manoeuvres and lifestyle come first", html:"At the first prodrome — sit or crouch, cross the legs, tense the leg muscles: this can abort the episode. <b>Do not try to push through and stay standing.</b> Encourage adequate fluid intake and, where appropriate, increased salt intake after checking for heart failure, CKD, hypertension and other contraindications; <b>avoid fixed fluid or salt prescriptions in unselected patients</b>. Fludrocortisone and midodrine are specialist-led options, not routine escalation."}
  ],
  pathwaySub:"The whole consultation in five moves. The first question is the position they collapsed in.",
  pathway:[
    {title:"Screen the high-risk features", html:"Exertional or supine syncope · no prodrome (over 65: NICE CG109 24-hour cardiovascular assessment) · palpitations or chest pain first · structural heart disease · abnormal ECG (any QT abnormality, Brugada pattern, conduction abnormality) · heart failure · murmur · new unexplained breathlessness · family history of sudden cardiac death under 40 or inherited cardiac disease. Urgent cardiovascular assessment within 24 hours; same-day emergency if unstable.", alert:true},
    {title:"Separate syncope from seizure", html:"<b>Get the witness account.</b> Position, prodrome and its length (with autonomic features — pallor, sweating, nausea, piloerection), colour, duration of LOC, movements, tongue biting, incontinence, and speed of recovery. No single feature is diagnostic; refer when uncertainty remains."},
    {title:"Do the two tests that change the referral", html:"<b>12-lead ECG and lying-and-standing BP</b>, done promptly without delaying urgent referral; blood tests only where the history or examination indicates. Echo if there is a murmur — outflow obstruction (aortic stenosis, HOCM) is the structural cause not to miss; ambulatory ECG chosen by episode frequency where an arrhythmic cause is suspected. Consider myocardial ischaemia in exertional syncope with chest pain."},
    {title:"Treat by mechanism", html:"Vasovagal → counter-manoeuvres, fluid loading, trigger diary. Orthostatic → medication review FIRST, then compression stockings; fludrocortisone or midodrine only with specialist advice. Cardiac → cardiology."},
    {title:"DVLA, safety-net and review", html:"Give and document the driving advice; review at 4–6 weeks; escalate if episodes recur despite lifestyle measures."}
  ],
  sections:[

    {id:"severe", nav:"Exclude cardiac", title:"Red flags and ESC risk stratification",
     sub:"Cardiac syncope is the one that kills. Everything else can wait for the outcome of excluding it.",
     blocks:[
       {b:"table", head:["Feature","Meaning","Action"], rows:[
         ["<b>Syncope during exertion</b>","<b>HOCM, aortic stenosis, arrhythmia</b>","<b>Urgent cardiovascular assessment, normally within 24 hours (NICE CG109).</b> Advise against exertion and driving until assessed. <b>Same-day emergency referral</b> if unstable, ongoing chest pain, severe breathlessness, suspected ACS or PE, sustained arrhythmia, abnormal neurological recovery or significant injury. NICE also recommends urgent exercise testing within 7 days in appropriate patients once aortic stenosis or HOCM have been considered. Do not reassure as \u201cprobably vasovagal\u201d"],
         ["<b>Syncope while supine</b>","<b>Unusual for uncomplicated vasovagal syncope — a cardiac red flag until assessed</b>","<b>Urgent cardiovascular assessment</b>, particularly if there is no prodrome, palpitations, chest pain or an abnormal ECG"],
         ["Any QT abnormality, Brugada pattern, significant conduction abnormality, ventricular arrhythmia, pre-excitation or ischaemic ST/T-wave abnormality, with syncope","<b>Channelopathy or arrhythmia with risk of sudden death</b>","Urgent specialist review; same-day emergency if unstable or the QT abnormality is marked (QTc ≥500 ms is particularly concerning). Document the QTc and interpret it with the ECG machine, clinical context and local cardiology criteria. Review QT-prolonging medicines urgently rather than stopping all automatically, correct electrolyte abnormalities, and seek cardiology/acute-medical advice; advise no driving"],
         ["<b>Palpitations or chest pain preceding the blackout</b>","Arrhythmia — SVT, VT, AF with rapid ventricular response, heart block — or ACS-related arrhythmia or PE","<b>High-risk presentation; urgent cardiology</b>. Absence of palpitations does not exclude a cardiac cause"],
         ["<b>Family history of sudden cardiac death under 40</b>","<b>Inherited channelopathy or cardiomyopathy</b>","<b>High-risk; cardiology with a family history documented</b>"],
         ["<b>Complete heart block or Mobitz II on ECG</b>","Risk of asystole; bradycardia and bradyarrhythmia on the ECG or monitor","<b>Immediate emergency transfer and cardiology assessment. Do not manage in primary care</b>"],
         ["<b>Thunderclap headache with LOC</b>","<b>Subarachnoid haemorrhage</b> — not true syncope but presents as sudden LOC","Emergency CT head without contrast; LP if CT is negative and suspicion remains"]
       ]},
       {b:"table", head:["ESC risk category","Features","Action"], rows:[
         ["<b>Low risk</b>","Typical history — posture, a provoking factor such as prolonged standing, pain or a medical procedure, and a progressive prodrome — with full recovery, normal ECG, no cardiac history, no family history of SCD and no features suggesting an alternative diagnosis. Age modifies risk but does not establish or exclude vasovagal syncope","<b>Primary care management; lifestyle advice; no urgent referral</b>"],
         ["<b>Intermediate risk</b>","Over 45 with a first unexplained syncope; no clear trigger; no prodrome; cardiac history; abnormal but not life-threatening ECG","<b>Ambulatory ECG chosen by episode frequency; cardiology within 2 weeks; echo if a murmur is present</b>"],
         ["<b>High risk</b>","Exertional syncope; supine syncope; significant structural heart disease; abnormal ECG (LBBB, complete block, QTc over 500 ms); family history of SCD under 40","Urgent cardiovascular assessment within 24 hours (NICE CG109); same-day emergency referral if unstable or there is an acute high-risk feature"]
       ]},
       {b:"dl", rows:[
         ["<b>NG12 stated honestly</b>","Transient loss of consciousness has no NICE NG12 suspected-cancer criterion, and none should be invented for one. The time-critical routes here are cardiac and neurological. The adjacency worth remembering is the same as for epilepsy: where the episode sits alongside progressive, sub-acute loss of central neurological function, NICE NG12 (updated April 2026) advises considering an urgent direct access MRI brain (within 2 weeks) for adults with progressive, sub-acute loss of central neurological function, not a syncope work-up"]
       ]}
     ]},

    {id:"confirm", nav:"Syncope or fit?", title:"The history — witness account first",
     sub:"The witness saw what the patient could not. It is the most diagnostically powerful information available.",
     blocks:[
       {b:"dl", rows:[
         ["<b>Open question first</b>","\u201cCan you talk me through what happened from the very beginning — what were you doing just before?\u201d The story frequently gives the diagnosis; a closed question first loses it. Record the sequence, posture, trigger, prodrome, colour, movements, duration and recovery, from both the patient and any witness"],
         ["<b>Position at collapse</b>","<b>Standing, sitting or lying?</b> <b>Supine or exertional syncope is a cardiac red flag until assessed; supine syncope is unusual for uncomplicated vasovagal syncope. After prolonged standing or on rising suggests orthostatic or vasovagal. <b>Autonomic failure — diabetic neuropathy, Parkinson's disease, multiple system atrophy — causes a fixed orthostatic drop that does not respond to fluid loading alone</b></b>"],
         ["<b>Prodrome</b>","Sweating, nausea, greyout, tunnel vision suggests vasovagal or orthostatic. A progressive autonomic prodrome and pallor support reflex syncope. No prodrome in someone over 65: consider specialist cardiovascular assessment within 24 hours (NICE CG109); an absent prodrome at any age needs cardiac exclusion"],
         ["<b>Duration</b>","True syncope is usually brief, with rapid complete recovery. Witness estimates of duration are often inaccurate, and no single timing threshold reliably distinguishes syncope from seizure. Prolonged unconsciousness or confusion raises the probability of epilepsy, hypoglycaemia or intracranial or structural brain pathology. Very brief LOC with no prodrome in an older patient suggests heart block or asystole"],
         ["<b>Movements, tongue and continence</b>","Prolonged confusion, sustained tonic-clonic activity, head turning or a clearly bitten tongue increase the likelihood of epilepsy. Brief seizure-like movements may occur during uncomplicated faints (NICE CG109), and urinary incontinence can occur in either. No single feature is diagnostic; refer when uncertainty remains"],
         ["<b>Recovery</b>","Syncope: rapid reorientation, tired but aware. Post-ictal: prolonged confusion about where they are"],
         ["<b>Trigger</b>","Situational syncope — cough, micturition (typically nocturnal), defecation, post-prandial — is a recognised benign reflex mechanism driven by the Valsalva manoeuvre reducing venous return. Vasovagal follows emotional distress, pain, venepuncture or prolonged standing"],
         ["<b>Previous episodes and medication</b>","A lifelong history of faints with vasovagal features is strongly reassuring; a first blackout in a middle-aged or older adult needs full cardiac exclusion. Ask specifically about childhood faints — Brugada and LQTS may first present then. Review new or changed medication in the last 2 weeks, dehydration and recent illness"],
         ["<b>Diagnosing an uncomplicated faint</b>","Requires a typical history — NICE’s 3 Ps: <b>posture</b> (such as prolonged standing), <b>provoking factors</b> (such as pain or a medical procedure) and a progressive <b>prodrome</b> — with full recovery, a satisfactory ECG and no features suggesting a cardiac, neurological or metabolic alternative. Age modifies risk but does not establish or exclude vasovagal syncope"],
         ["<b>Psychogenic non-epileptic seizures</b>","Consider where events are prolonged, atypical, resistant to treatment, or occur without injury — <b>a specialist diagnosis, not one to make or to exclude in primary care</b>"]
       ]},
       {b:"say", html:"I can see you collapsed in the supermarket yesterday and that your heart tracing in A&amp;E was reported as normal. Before I ask anything specific, I would like to hear what happened in your own words. And if your wife saw it, I would like to hear her account too — that is often the most useful information, because you were unconscious for part of it."}
     ]},

    {id:"workup", nav:"Before referral", title:"Examination, investigations, and what the letter needs",
     blocks:[
       {b:"table", head:["Investigation","Detail"], rows:[
         ["<b>12-lead ECG — mandatory</b>","Do it promptly, but do not let it delay an emergency or urgent referral. Look for: any QT abnormality (document the QTc and interpret it with the ECG machine, clinical context and local cardiology criteria; ≥500 ms is particularly concerning), ventricular arrhythmia, ischaemic ST/T-wave change, LBBB, complete heart block or Mobitz II, delta wave (WPW — pre-excitation), Brugada pattern, epsilon wave (ARVC), and evidence of prior infarct or LVH"],
         ["<b>Lying-and-standing BP</b>","Measure BP lying or seated, then repeat after standing for at least 1 minute; continue measurements for up to 3 minutes where clinically appropriate. A fall in systolic BP of at least 20 mmHg or diastolic BP of at least 10 mmHg supports postural hypotension. Interpret alongside symptoms and the baseline position"],
         ["<b>Bloods</b>","Only where indicated by the history or examination — for example, capillary glucose if hypoglycaemia is possible, FBC if anaemia or bleeding is suspected, U&amp;E if dehydration or electrolyte disturbance is suspected, troponin for possible acute coronary syndrome, and oxygen saturation if hypoxia is suspected. TFTs, HbA1c, LFTs and AUDIT-C may be appropriate in selected patients but are not mandatory for every blackout"],
         ["<b>Echocardiogram</b>","<b>If a murmur is present, or structural heart disease is suspected.</b> A heart murmur with TLoC is a NICE CG109 reason to refer for specialist cardiovascular assessment within 24 hours"],
         ["<b>Ambulatory monitoring</b>","Arrange ambulatory ECG where an arrhythmic cause is suspected or the cause remains unexplained. Choose according to the frequency of episodes and cardiology advice: Holter for very frequent events, external event recorder for events every 1–2 weeks, implantable loop recorder for infrequent events. A 24–48-hour Holter is often unhelpful after a single, infrequent blackout"],
         ["<b>Tilt-table test</b>","Specialist — request consideration in the referral letter for recurrent unexplained syncope with normal ECG and ambulatory monitoring. Do not use tilt testing as the first-line investigation for suspected arrhythmic syncope"],
         ["<b>Carotid sinus massage — specialist only</b>","Do not perform carotid sinus massage in routine primary care. It may be arranged by a specialist in a monitored environment with ECG and resuscitation facilities for selected patients aged 60 years or over"]
       ]},
       {b:"table", head:["Referral","Urgency and pre-referral work"], rows:[
         ["<b>Exertional syncope, or suspected structural heart disease (HOCM, AS)</b>","<b>Urgent cardiovascular assessment, normally within 24 hours (NICE CG109)</b>; same-day emergency referral if unstable, chest pain, severe breathlessness, sustained arrhythmia or another acute high-risk feature. ECG promptly where it will not delay transfer; advise against exertion and driving until assessed; document the advice. Do not reassure as vasovagal"],
         ["<b>QT abnormality or Brugada pattern with syncope</b>","<b>Urgent specialist review; same-day emergency if unstable or marked.</b> Review QT-prolonging medicines urgently, correct electrolyte abnormalities and seek cardiology/acute-medical advice; document the QTc; advise no driving. <b>Do not start any new QT-prolonging medication</b>"],
         ["<b>Unexplained first syncope, over 45, no cardiac history</b>","<b>Cardiology within 2 weeks.</b> ECG, ambulatory ECG chosen by episode frequency, clinically directed bloods; driving advice per the current DVLA guidance; full medication review; DVLA advice documented. <b>Do not reassure as vasovagal without investigation</b>"],
         ["<b>Suspected epileptic seizure</b>","<b>Neurology within 2 weeks.</b> Document the witness account precisely, advise no driving immediately, check glucose. Do not start an antiepileptic drug, and do not document \u201cepilepsy\u201d before specialist confirmation"],
         ["<b>Recurrent unexplained syncope with normal ECG and ambulatory monitoring</b>","<b>Cardiology within 4 weeks.</b> Review previous results, arrange ambulatory monitoring matched to episode frequency if not done, document frequency and quality-of-life impact, request tilt-table consideration. <b>Do not initiate beta-blockers before specialist review</b>"],
         ["<b>Suspected carotid sinus hypersensitivity</b>","<b>Routine cardiology.</b> Document the trigger (head turning or a tight collar in an older man), review and stop alpha-blockers. <b>Do not perform carotid sinus massage in routine primary care; a specialist may arrange it in a monitored setting for selected patients aged 60 or over</b>"]
       ]},
       {b:"why", html:"The two tests that change the referral destination are the ones most often skipped. An ECG identifies the channelopathies and conduction disease that make this presentation lethal, and the lying-and-standing BP identifies the commonest reversible cause in older patients — drug-induced orthostatic hypotension. A referral letter without both is insufficient for the specialist to triage correctly, and in practice it delays the appointment for the patient who needs it soonest. In an exertional, supine, unstable or clearly arrhythmic presentation, do not delay emergency or urgent referral to complete them."}
     ]},

    {id:"ladder", nav:"Treat", title:"Management by mechanism",
     sub:"Lifestyle measures are first-line for vasovagal and orthostatic syncope, and the evidence for them is stronger than for any drug.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"🏋️ Physical counter-manoeuvres — the most effective single measure", html:"At the very first warning (sweating, nausea, tunnel vision): immediately sit or crouch, cross the legs, and tense the leg muscles firmly. Can abort the episode when used at prodrome onset. <b>Do NOT try to push through and remain standing — that accelerates it.</b> Demonstrate the manoeuvre in the consultation."},
         {tone:"blue", h:"💧 Fluid intake", html:"<b>Encourage adequate fluid intake and, where appropriate, increased salt intake</b> after checking for heart failure, chronic kidney disease, cirrhosis, uncontrolled hypertension and significant autonomic failure with supine hypertension. Adequate intravascular volume blunts the reflex. <b>Avoid fixed fluid or salt prescriptions in unselected patients.</b> A drink before a known trigger — long meetings, hot weather, blood tests — may help."},
         {tone:"amber", h:"🧦 Compression stockings", html:"Class 2, on before standing in the morning, worn all day, off at night. Reduces the orthostatic drop in orthostatic hypotension, and is available on NHS prescription for confirmed orthostatic hypotension."},
         {tone:"green", h:"🚶 Tilt training", html:"Wall-standing 30–40 minutes, 3 times a week, built up from 5–10 minutes daily and increasing by 5 minutes a week. Most useful in motivated patients. Always with a support person initially; stop and use counter-manoeuvres if a prodrome develops."},
         {tone:"cream", h:"🧂 Dietary salt — orthostatic only", html:"ESC 2018 (international) suggests increased fluid and salt intake for confirmed orthostatic hypotension, where appropriate. Check first for heart failure, CKD, cirrhosis, uncontrolled hypertension and autonomic failure with supine hypertension; avoid fixed fluid or salt prescriptions in unselected patients; review BP at 4 weeks."},
         {tone:"cream", h:"🚫 Trigger work", html:"<b>Episode diary — date, time, what happened before.</b> Where fear of recurrence is disabling, CBT or NHS Talking Therapies helps more than further investigation. Avoid prolonged standing in queues (move the feet rhythmically); recognise situational triggers — coughing, micturition, defecation and swallowing, eat regular small meals, keep alcohol within 14 units a week and avoid it in hot weather, and rise slowly — sit on the edge of the bed for 30 seconds before standing."}
       ]},
       {b:"ladder", steps:[
         {step:"Step 1", title:"Lifestyle first, and rationalise the medication", when:"all syncope types",
          html:"<b>Fluid loading, counter-manoeuvres, compression stockings for orthostatic, tilt training, and a full review of drugs causing orthostatic change — antihypertensives, <b>alpha-blockers (tamsulosin, doxazosin)</b>, diuretics (<b>furosemide, a thiazide</b>), nitrates, antidepressants (<b>sertraline, paroxetine</b>), antipsychotics, opioids, benzodiazepines and insulin.</b> A drug added or changed in the previous 2 weeks is the single most likely reversible cause in an older patient. Review at 4–6 weeks; if episodes recur despite lifestyle measures, seek specialist advice before any pharmacotherapy."},
         {step:"Step 2", title:"Fludrocortisone — orthostatic, specialist-led", when:"lifestyle insufficient",
          fromLabel:"confirmed orthostatic hypotension",
          html:"<b>Consider fludrocortisone only with specialist advice or within a locally agreed protocol</b> (dosing per BNF). A mineralocorticoid expanding plasma volume. <b>Avoid in heart failure or uncontrolled hypertension; caution in supine hypertension, renal disease and endocrine disease.</b> <b>Monitor supine and standing BP, electrolytes, fluid status and weight (oedema).</b>"},
         {step:"Step 3", title:"Midodrine — refractory orthostatic", when:"fludrocortisone inadequate",
          fromLabel:"specialist-led only",
          html:"<b>Consider midodrine only with specialist advice or within a locally agreed protocol</b> (dosing per BNF and SPC); an alpha-1 agonist raising peripheral resistance. Monitor supine and standing BP, electrolytes and fluid status. Cautions include supine hypertension, heart failure, renal disease, urinary retention, ischaemic heart disease, peripheral vascular disease, bradycardia or tachyarrhythmia, and endocrine disease. Take the last daily dose at least 4 hours before bedtime (SPC) — supine hypertension overnight is the critical safety risk. Avoid in coronary artery disease, urinary retention and hyperthyroidism. <b>Monitor supine BP lying flat at every visit.</b>"},
         {step:"Step 4", title:"Refractory vasovagal — specialist only", when:"recurrent despite everything",
          fromLabel:"not a primary care decision",
          html:"<b>Beta-blockers, SSRIs and pacing are specialist decisions</b> — and warn about behavioural activation if an SSRI is started. Where syncope is due to AF with rapid ventricular response, anticoagulation follows CHA₂DS₂-VASc under NICE NG196 with ORBIT bleeding assessment — a DOAC (apixaban, rivaroxaban, edoxaban) or warfarin, at the age-specific dose. The POST trial (Sheldon R et al., Circulation 2006) found no overall benefit from metoprolol; a subgroup analysis suggested benefit in vasovagal patients aged &gt;42; the evidence is weak in younger patients. <b>Do not initiate a beta-blocker before specialist review.</b>"}
       ]},
       {b:"say", html:"I completely understand why your first thought is that something is wrong with your brain — that is a natural worry after losing consciousness. But the evidence tells us that for most blackouts with the pattern you describe, the cause is in the heart's rhythm or the blood pressure, not the brain itself, and a brain scan would not answer the question we are asking. What I would like to do today is a heart tracing here, check your blood pressure lying and standing, and, if needed, arrange heart rhythm monitoring suited to how often this happens — that will answer it much faster than a scan."}
     ]},

    {id:"monitor", nav:"DVLA", title:"Driving, follow-up and safety-netting",
     blocks:[
       {b:"table", head:["Domain","Detail"], rows:[
         ["<b>DVLA — unexplained syncope</b>","Give the current DVLA advice appropriate to the event, licence group and suspected cause — check the <a href='https://www.gov.uk/government/publications/assessing-fitness-to-drive-a-guide-for-medical-professionals' rel='noopener'>current DVLA guidance</a> for the specific category rather than relying on this summary. Periods depend on whether the event was a confirmed uncomplicated faint, whether a cause was identified and treated, recurrence, Group 1 or Group 2 licence, whether a seizure remains possible, and whether the episode occurred while driving. As a guide only: single unexplained syncope: Group 1 (car, motorcycle) 6 months off driving, or 4 weeks if a cause is identified and treated; Group 2 (HGV, PCV) 12 months. Multiple unexplained episodes carry longer periods (Group 2: 5 years, reduced from 10 in the September 2025 revision). A typical vasovagal faint with a reliable prodrome while standing: Group 1 need not stop or notify; Group 2 must notify after any TLoC. The patient notifies the DVLA themselves, and if they continue driving against advice <b>GMC confidentiality guidance on patients' fitness to drive permits informing the DVLA directly</b>"],
         ["<b>DVLA — suspected seizure</b>","If a seizure is suspected, advise the patient to stop driving immediately and follow the DVLA epilepsy/TLoC rules for the specific current category — do not wait for specialist confirmation before giving safety advice. <b>Do not document \u201cepilepsy\u201d before specialist confirmation</b>"],
         ["<b>DVLA — explained and treated</b>","<b>Cardiac causes may need definitive treatment — ablation for a re-entrant arrhythmia, a pacemaker for conduction disease, or an ICD where sudden-death risk is high. <b>Where a cause is identified and treated (for example a drug-induced orthostatic drop that resolves), driving may resume per DVLA criteria for that cause — document the advice given either way, including the date from which any restriction applies</b>"],
         ["<b>4–6 week review</b>","Episode frequency and diary, response to counter-manoeuvres and fluid loading, medication review outcome, repeat lying-and-standing BP, investigation results, and driving status"],
         ["<b>Occupational</b>","Do not allow return to hazardous occupations — heights, machinery, professional driving — pending investigation. Occupational health referral where relevant; a fit note may be needed while investigation is pending"],
         ["<b>Safety-net</b>","Return urgently for: another blackout, blackout during exertion or while lying down, palpitations or chest pain, or any blackout causing injury. Involve the partner, family or carers in the plan — and consider safeguarding where repeated unexplained collapse in a vulnerable adult raises concern about neglect"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 999 / same-day emergency", html:"Unstable · ongoing chest pain · severe breathlessness · sustained arrhythmia · complete heart block · marked QT abnormality or Brugada pattern with syncope · major injury · incomplete recovery · thunderclap headache or other acute neurological emergency. A stable patient with an exertional or supine blackout needs urgent cardiovascular assessment within 24 hours."},
         {tone:"amber", h:"🟠 The recurrence rule", html:"\u201cIf it happens again — especially if there is no warning, or it happens while you are sitting or lying down — come back the same day rather than waiting.\u201d"},
         {tone:"blue", h:"🚗 Say the driving rule out loud", html:"Give the current DVLA advice for the event, licence group and suspected cause, state the date from which any restriction applies, confirm whether the patient must notify the DVLA, and document all three."},
         {tone:"green", h:"🤝 Never \u201ccome back if it happens again\u201d alone", html:"<b>That is not a management plan.</b> Offer something concrete today — the ECG, the standing BP, the monitor, a timeline."}
       ]},
       {b:"why", html:"The commonest failure in this presentation is diagnosing vasovagal syncope without actively excluding a cardiac cause — and the second is reassuring the patient without a concrete monitoring plan. Both are avoidable in a single consultation: the ECG and the lying-and-standing BP take minutes, and they either support the benign diagnosis or redirect the referral."}
     ]},

    {id:"refer", nav:"Refer", title:"Referral summary",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same-day emergency", html:"Haemodynamic instability · ongoing chest pain · severe breathlessness · sustained arrhythmia · complete heart block or Mobitz II · marked QT abnormality or Brugada pattern with syncope · major injury · incomplete recovery · thunderclap headache or other acute neurological emergency."},
         {tone:"amber", h:"Urgent cardiovascular assessment — within 24 hours", html:"NICE CG109: exertional TLoC · supine syncope · abnormal ECG · heart failure · murmur · new unexplained breathlessness · family history of sudden cardiac death under 40 or inherited cardiac disease · age over 65 with TLoC without prodrome."},
         {tone:"amber", h:"Cardiology — 2 weeks", html:"<b>First unexplained syncope over 45 with no cardiac history</b> — with ECG done, ambulatory ECG chosen by episode frequency, and clinically directed bloods."},
         {tone:"blue", h:"Neurology — 2 weeks", html:"<b>Suspected epileptic seizure</b> — witness account documented, glucose checked, no AED started, driving stopped. See the <a href='epilepsy.html'>epilepsy protocol</a>."},
         {tone:"blue", h:"Cardiology — 4 weeks or routine", html:"Recurrent unexplained syncope with normal ECG and ambulatory monitoring (request tilt-table consideration) · suspected carotid sinus hypersensitivity."},
         {tone:"cream", h:"Primary care", html:"<b>Likely uncomplicated vasovagal syncope</b> — typical posture, provoking factor or prodrome, full recovery, satisfactory ECG, consistent history and no feature suggesting cardiac, neurological or metabolic disease (age modifies risk but does not establish or exclude it): counter-pressure manoeuvres, trigger avoidance, appropriate fluid advice, medication review, driving advice and safety-netting. <b>Suspected orthostatic hypotension</b> — assess timing in relation to standing, measure lying/seated and standing BP, review diuretics, antihypertensives, alpha-blockers, nitrates, psychotropics and opioids, and treat dehydration and reversible causes; refer if symptoms persist despite correction or the diagnosis is uncertain."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 58-year-old teacher attends the morning after collapsing in a supermarket. He felt \u201cstrange and sweaty\u201d for a few seconds beforehand; his wife saw him slump, unconscious about 2 minutes with no jerking, then recover rapidly. A&amp;E reported the ECG as normal and discharged him. He takes ramipril 5 mg, amlodipine 5 mg and atorvastatin 40 mg, and asks whether he needs a brain scan."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Opens with a genuine open question and references the A&amp;E information already on file rather than re-asking it; <b>takes the wife's witness account</b>; <b>establishes position, prodrome length, duration and recovery</b>; recognises that the brief prodrome and rapid recovery favour vasovagal BUT that age 58, male sex and no postural trigger mean cardiac must be excluded first; does the ECG and lying-and-standing BP in the surgery — the antihypertensives make orthostatic hypotension a live differential; names and addresses the brain-scan expectation rather than dismissing it, and offers something concrete instead; <b>gives and documents the DVLA advice</b>; and — the step candidates miss — does not diagnose vasovagal without stating the cardiac exclusion plan out loud."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>NICE CG109 — Transient loss of consciousness (\u2018blackouts\u2019) in over 16s<br><a href="https://www.nice.org.uk/guidance/cg109" rel="noopener">nice.org.uk/guidance/cg109</a><span class="rd"> — the initial assessment set including 12-lead ECG and lying/standing BP, the high-risk features requiring specialist cardiovascular assessment within 24 hours, and the referral timelines</span></li>'+
         '<li><b>NICE CG109 \u2014 Transient loss of consciousness (‘blackouts’) in over 16s</b><br><a href="https://www.nice.org.uk/guidance/cg109" rel="noopener">nice.org.uk/guidance/cg109</a><span class="rd"> — primary-care assessment, recognising an uncomplicated faint, situational syncope and orthostatic hypotension, and features suggesting epileptic seizure; 24-hour cardiovascular referral for ECG abnormality, heart failure, exertional TLoC, family history of sudden cardiac death under 40, new breathlessness or a murmur, and consideration of it over 65 without prodrome. CG109 does not set out drug treatment; the management section draws on ESC 2018 (international), the BNF and SPCs</span></li>'+
         '<li><b>ESC Guidelines for the diagnosis and management of syncope (2018)</b> <b>international</b>. Brignole M et al. Eur Heart J 2018<span class="rd"> — the low / intermediate / high risk stratification used on this page, physical counter-pressure manoeuvres, fluid and salt advice for orthostatic hypotension</span></li>'+
         '<li><b>DVLA — Assessing fitness to drive: a guide for medical professionals</b><br><a href="https://www.gov.uk/guidance/assessing-fitness-to-drive-a-guide-for-medical-professionals" rel="noopener">gov.uk — assessing fitness to drive</a><span class="rd"> — September 2025 TLoC revision: no restriction for a typical Group 1 vasovagal faint with reliable prodrome; single unexplained syncope Group 1 six months (4 weeks if cause treated), Group 2 twelve months; multiple unexplained Group 2 five years; stop driving immediately if a seizure is suspected and follow the rules for the specific current category; periods change, so check the current guidance</span></li>'+
         '<li><b>POST trial (Prevention of Syncope Trial)</b>. Sheldon R et al. Circulation 2006<span class="rd"> — no overall benefit from metoprolol; post hoc benefit suggested only in patients over 42</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — fludrocortisone, midodrine and metoprolol dosing and cautions; Bramox (midodrine) SPC, medicines.org.uk: 2.5 mg three times daily, titrated weekly to 10 mg three times daily, last dose at least 4 hours before bedtime</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Vasovagal syncope and orthostatic hypotension — NICE CG109, ESC Syncope Guidelines (2018), DVLA Assessing fitness to drive and the BNF. Never diagnose vasovagal syncope without excluding a cardiac cause: exertional or supine syncope is a cardiac red flag needing urgent cardiovascular assessment, and the ECG and lying-and-standing BP are done promptly without delaying urgent referral. Suspected seizure is covered by the <a href=\"epilepsy.html\">epilepsy protocol</a>; the undifferentiated blackout \u2014 working out which cause this is \u2014 belongs to the <a href=\"../algorithms/tloc.html\">transient loss of consciousness pathway</a>, which stays live and should be the first stop when the diagnosis is not yet clear. Verify all doses against the current BNF before prescribing."
