<script>
MG.render({
  icon:"💪",
  title:"Tennis Elbow",
  eyebrow:"Protocol · assess and manage in one place",
  stemTitle:"Tennis elbow — time and load fix it; a steroid injection trades next month for next year",
  stemSub:"Lateral elbow tendinopathy is a clinical diagnosis with a good outlook: about nine in ten people are better within a year, whatever is done. The GP’s job is to confirm it is tendon pain and not the neck, a nerve or the joint, to set up forearm-extensor loading and sensible activity changes, to offer topical NSAIDs for short-term relief, and to explain why corticosteroid injection is advised against: it helps at 6 weeks but leads to more recurrence at a year. Sources: BESS patient care pathway (Singh 2023), NICE HTG201 and HTG299, and the Coombes and Smidt trials.",
  guideline:"BESS patient care pathway: tennis elbow (Singh et al., Shoulder Elbow 2023) · NICE HTG201 (2009) · NICE HTG299 (2013)",
  meta:[
    {t:"BESS pathway · Singh 2023"},
    {t:"NICE HTG201 · HTG299"},
    {t:"Coombes JAMA 2013 · Lancet 2010"},
    {t:"MHRA DSU · NSAIDs 2013/2015"},
    {t:"NG12 · sarcoma lump or bone pain", tone:"tw"}
  ],
  lead:"<div class='mg-layers'><a href='#examine'><b>Confirm</b><small>Tender epicondyle, painful grip</small></a><a href='#course'><b>Counsel</b><small>89% better within a year</small></a><a href='#treat'><b>Load</b><small>Exercise first</small></a><a href='#injections'><b>Injections</b><small>Why not steroid</small></a></div>",
  quickSub:"Six cards for the whole consultation. Each figure is traced under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"green", h:"The outlook is good, and saying so is part of the treatment", html:"In a meta-analysis cited by the BESS pathway, <b>89% of people had improved or recovered within the first year</b> without any specific treatment. In a Dutch primary-care trial, a wait-and-see approach had an <b>83% success rate at 52 weeks</b>. Explain that tennis elbow is self-limiting but slow, and that the aim is to keep using the arm while it settles.", src:"Ikonen et al., Clin Orthop Relat Res 2022 (cited in BESS 2023); Smidt et al., Lancet 2002"},
    {tone:"green", h:"Exercise-based physiotherapy is the first-line treatment", html:"BESS makes its strongest recommendation for physiotherapy, based on progressive loading of the wrist and finger extensors with stretching. Pair it with changes to the provoking activity, such as grip size, tool weight, lifting palm-up and keyboard set-up, rather than complete rest. In Smidt’s trial, physiotherapy had a <b>91% success rate at 52 weeks</b>.", src:"BESS pathway, Singh et al. 2023; Smidt et al., Lancet 2002"},
    {tone:"amber", h:"Corticosteroid injection: better at 6 weeks, worse at a year", html:"A single steroid injection gives the fastest early relief: 92% success at 6 weeks in Smidt’s trial, compared with 47% for physiotherapy. The benefit then reverses. In Coombes’ placebo-controlled trial, steroid led to lower recovery at 1 year (<b>83% vs 96%</b>) and <b>more recurrence (54% vs 12%)</b>. The Coombes Lancet 2010 review found steroid less effective than no intervention in the intermediate and long term. BESS advises against it.", src:"Coombes et al., JAMA 2013; Coombes et al., Lancet 2010; Smidt et al., Lancet 2002; BESS 2023"},
    {tone:"blue", h:"Topical NSAID for short-term pain", html:"A Cochrane review found that topical NSAIDs may improve pain for up to about 4 weeks. The evidence for oral NSAIDs is conflicting, and they carry GI risk. BESS reaches a similar conclusion on low-quality evidence. Doses per BNF.", src:"Pattanittum et al., Cochrane 2013 (CD003686); BESS 2023"},
    {tone:"blue", h:"Shockwave and blood injections are not routine options", html:"NICE: the evidence on efficacy of <b>shockwave therapy</b> for refractory tennis elbow is inconsistent, so it is used only with special arrangements for governance, consent and audit or research. A Cochrane review found little or no benefit over placebo. <b>Autologous blood injection</b> (including platelet-rich preparations) also needs special arrangements (NICE HTG299), and BESS advises against autologous blood injection.", src:"NICE HTG201 (IPG313, Aug 2009); NICE HTG299 (IPG438, Jan 2013); Buchbinder, Cochrane 2005"},
    {tone:"purple", h:"A growing lump or unexplained bone pain is a sarcoma question", html:"NG12 applies to an adult with an <b>unexplained lump that is increasing in size</b> (consider an urgent direct access ultrasound within 2 weeks). It also applies to a child or young person with <b>unexplained bone swelling or pain</b> (consider a very urgent direct access X-ray within 48 hours). Tennis elbow is uncommon in children, so bone pain around a teenager’s elbow needs a different line of thought.", src:"NICE NG12 rec 1.11.4 and bone sarcoma recommendations (updated April 2026)"}
  ],
  pathwaySub:"Five moves, from confirming the diagnosis to deciding when to escalate.",
  pathway:[
    {title:"Screen for what it is not", html:"Pain at rest or at night, a hot swollen joint, loss of elbow movement, locking, neck pain with arm paraesthesia or weakness, systemic upset, trauma, a growing lump, or an adolescent with bone pain. Any of these moves the diagnosis away from simple tendinopathy.", alert:true},
    {title:"Confirm clinically", html:"Tenderness just distal and anterior to the lateral epicondyle, with pain on gripping, resisted wrist extension and resisted middle-finger extension. The elbow has a full range of movement. Imaging is not needed to confirm it (BESS); plain X-ray only if the diagnosis is uncertain."},
    {title:"Counsel on the natural history", html:"Most people are better within a year. The goal is to keep the arm working without constantly re-provoking it. Agree a plan for the specific trigger at work, in sport or at home."},
    {title:"Start loading and modify the activity", html:"A progressive home programme for the wrist extensors (isometric, then slow eccentric or heavy slow resistance), with physiotherapy for anyone who needs support. A counterforce strap may be tried, with honest expectations. Topical NSAID for short-term pain."},
    {title:"Hold the line on injection; escalate if refractory", html:"Explain the evidence on steroid injection clearly and document the discussion. If disabling symptoms persist despite a sustained exercise programme over several months, refer to MSK or an upper-limb service. Specialist options and, rarely, surgery are considered there."}
  ],
  sections:[
    {id:"redflags", nav:"Red flags", title:"Red flags — when it is not tennis elbow", sub:"Check these before settling on tendinopathy, and again at every review where the pain is not following the expected course.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Hot, swollen elbow or systemic upset", html:"An effusion, warmth, fever or a severe loss of movement points to septic arthritis, crystal arthritis or olecranon bursitis, not tendinopathy. Assess the same day. Aspiration or admission follows local pathways."},
         {tone:"amber", h:"🟠 Neck pain, arm paraesthesia or weakness", html:"C6/C7 cervical radiculopathy can refer pain to the lateral elbow. Examine the neck, and check myotomes, dermatomes and reflexes. Weakness of finger or thumb extension with no sensory loss suggests posterior interosseous nerve palsy, which needs specialist assessment."},
         {tone:"amber", h:"🟠 Mechanical joint symptoms", html:"Locking, catching, clicking with instability, or loss of extension suggests a loose body, osteoarthritis, capitellar osteochondritis dissecans in adolescent throwers or gymnasts, or posterolateral rotatory instability after a dislocation. Get a plain X-ray and consider orthopaedic referral.", src:"BESS 2023 — X-ray if diagnosis uncertain"},
         {tone:"amber", h:"🟠 Inflammatory arthritis", html:"Morning stiffness lasting more than an hour, other swollen joints, psoriasis, uveitis or inflammatory back pain suggests enthesitis or synovitis as part of a systemic disease. Enthesitis without an apparent mechanical cause that is persistent or in several places → rheumatology for spondyloarthritis assessment.", src:"NICE NG65 (2017) rec 1.1.10"},
         {tone:"purple", h:"NG12 — sarcoma", html:"<b>Adults:</b> consider an urgent direct access ultrasound scan (within 2 weeks) for soft tissue sarcoma in an adult with an <b>unexplained lump that is increasing in size</b>. <b>Children and young people:</b> consider a very urgent direct access X-ray (within 48 hours) for bone sarcoma in a child or young person with <b>unexplained bone swelling or pain</b>.", src:"NICE NG12 rec 1.11.4 and bone sarcoma recommendations (updated April 2026)"}
       ]},
       {b:"why", html:"Tennis elbow causes pain that is provoked by use and eases with rest. It does not cause an effusion, restricted movement or neurological signs. When the story includes those features, the lateral elbow is usually where the symptom is felt rather than where the problem lies. Night pain, rest pain and a steadily growing lump deserve the same caution as anywhere else in the musculoskeletal system."}
     ]},

    {id:"examine", nav:"Diagnose", title:"Making the diagnosis — history and examination", sub:"A clinical diagnosis. Imaging adds little unless something does not fit.",
     blocks:[
       {b:"dl", rows:[
         ["<b>Who gets it</b>","Adults of working age, with a peak at 45–54 years. In a Finnish population study the prevalence of definite lateral epicondylitis was 1.3% and was similar in men and women (Shiri, Am J Epidemiol 2006). It is linked to repeated or forceful gripping and wrist extension at work or leisure"],
         ["<b>Story</b>","Gradual onset of pain over the outside of the elbow, sometimes spreading down the back of the forearm. Worse when gripping, lifting a kettle or cup palm-down, shaking hands, turning a key or using a mouse. Usually the dominant arm. Ask about the job, hobbies, recent change in load, previous injections and neck symptoms"],
         ["<b>Examine</b>","Point tenderness just distal and anterior to the lateral epicondyle, over the common extensor origin. Pain on <b>resisted wrist extension</b> with the elbow straight, and on <b>resisted middle-finger extension</b>. Grip is often painful and weaker; pain-free grip strength is a useful measure to repeat. Full elbow range of movement. Also examine the neck and do a brief neurological screen"],
         ["<b>Imaging</b>","Not needed to confirm lateral elbow tendinopathy. Plain X-ray if the diagnosis is uncertain, to exclude fracture, arthritis or loose bodies. Ultrasound or MRI is a specialist decision (BESS 2023)"]
       ]},
       {b:"table", head:["Differential","What points to it"], rows:[
         ["<b>Radial tunnel syndrome</b>","Tenderness about 4–5 cm distal to the epicondyle over the supinator, rather than at the tendon origin; pain on resisted supination"],
         ["<b>Posterior interosseous nerve palsy</b>","Weak finger and thumb extension with no sensory loss"],
         ["<b>Cervical radiculopathy (C6/C7)</b>","Neck pain, dermatomal paraesthesia, reflex change; pain reproduced by neck movement"],
         ["<b>Elbow osteoarthritis or loose body</b>","Loss of extension, crepitus, locking; X-ray changes"],
         ["<b>Posterolateral rotatory instability</b>","History of dislocation or repeated steroid injections; clicking and apprehension when pushing up from a chair"],
         ["<b>Capitellar osteochondritis dissecans</b>","Adolescent thrower or gymnast; lateral pain with loss of extension"],
         ["<b>Inflammatory arthritis or enthesitis</b>","Effusion, other joints involved, prolonged morning stiffness, psoriasis or IBD"]
       ]}
     ]},

    {id:"course", nav:"Natural history", title:"What to tell the patient about the outlook", sub:"The single most useful thing the GP can give is an accurate prognosis.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"Most people recover within a year", html:"In trials, about 89% of people given no active treatment reported global improvement within the first year. People with long-standing symptoms still tend to improve, so duration alone does not mean a poor outcome.", src:"Ikonen et al., Clin Orthop Relat Res 2022 (cited in BESS 2023)"},
         {tone:"blue", h:"What the three-arm trial showed", html:"Smidt compared injection, physiotherapy and wait-and-see in Dutch general practice. At 6 weeks the success rates were 92%, 47% and 32%. At 52 weeks they were 69%, 91% and 83%. Physiotherapy was significantly better than injection in the long term.", src:"Smidt et al., Lancet 2002"},
         {tone:"amber", h:"Features linked with recurrence", html:"Symptoms for more than 12 months, acute pain at onset, previous corticosteroid injection and poor adherence to the management plan have been associated with a higher risk of recurrence in studies summarised by BESS. These are worth knowing when someone asks for a second or third injection.", src:"BESS 2023"},
         {tone:"cream", h:"Setting expectations in plain words", html:"“This is a strain where the forearm muscles attach at the elbow. It almost always settles, but it can take months. The fastest way through is to keep using the arm in a way it can cope with, and build strength so it copes with more.”", src:"BESS 2023 · Ikonen 2022"}
       ]}
     ]},

    {id:"treat", nav:"Treatment", title:"First-line treatment — loading, activity changes and bracing", sub:"Exercise-based care is the backbone. Everything else supports it.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1", title:"Calm the provocation", when:"from day 1", html:"Identify the trigger task and change how it is done rather than stopping all use. Options include lifting with the palm up, a larger or padded tool grip, lighter tools, breaks in repetitive work, and adjusting mouse and keyboard position. Complete rest and splinting for long periods tend to leave the tendon less able to cope."},
         {step:"2", title:"Isometric and pain-free strengthening", when:"weeks 1–4", fromLabel:"early", html:"Wrist extension against resistance held for 30–45 seconds, repeated several times a day, within tolerable pain. Gentle wrist-extensor stretching with the elbow straight. Grip work with a soft ball."},
         {step:"3", title:"Progressive loading", when:"weeks 4–12", fromLabel:"core phase", html:"Slow eccentric wrist extension with a light dumbbell (lowering over 3–4 seconds) or heavy slow resistance, increasing the weight as symptoms allow. Add forearm rotation and grip strength work. Mild discomfort that settles by the next day is acceptable. A physiotherapist can supervise progression."},
         {step:"4", title:"Return to full load", when:"3 months onwards", fromLabel:"return", html:"Build back to full work or sport. Check technique (for example racquet grip size and backhand technique) and keep a maintenance strength routine."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"Physiotherapy — BESS’s strongest recommendation", html:"BESS supports exercise-based physiotherapy, including stretching and eccentric loading of the extensor tendons, as the main treatment.", src:"BESS pathway, Singh et al. 2023"},
         {tone:"cream", h:"Counterforce strap or wrist brace", html:"BESS says an orthosis may be offered, but patients should know it may not help. There is low-quality evidence that it improves pain-free grip strength, and longer-term effects were not assessed. It is cheap and harmless to try during provoking tasks.", src:"BESS pathway, Singh et al. 2023"}
       ]}
     ]},

    {id:"analgesia", nav:"Pain relief", title:"Pain relief — topical first, oral with care", sub:"Analgesia makes the exercise possible. It does not change the natural history.",
     blocks:[
       {b:"table", head:["Option","Evidence and place","Safety points"], rows:[
         ["<b>Topical NSAID</b>","May improve pain for up to about 4 weeks (Cochrane, Pattanittum 2013; BESS 2023, low-quality evidence). Reasonable first choice","Occasional mild, transient skin rash. Dose per BNF"],
         ["<b>Paracetamol</b>","Simple analgesia; no trial evidence specific to tennis elbow","Dose per BNF"],
         ["<b>Oral NSAID</b>","Evidence of benefit conflicting (Cochrane 2013); short course only if topical is not enough","GI, renal and cardiovascular cautions. Diclofenac contraindicated in ischaemic heart disease, peripheral arterial disease, cerebrovascular disease and heart failure (MHRA, June 2013). Ibuprofen at 2,400 mg a day or more carries a similar cardiovascular risk, which is not seen at up to 1,200 mg a day (MHRA, June 2015). Dose per BNF"]
       ]},
       {b:"cards", items:[
         {tone:"amber", h:"Before an oral NSAID", html:"Check age, GI history, renal function, blood pressure, cardiovascular disease, anticoagulants and antiplatelets. Use the lowest effective dose for the shortest time, and consider gastroprotection according to the BNF.", src:"MHRA DSU Jun 2013 and Jun 2015 · BNF"}
       ]}
     ]},

    {id:"injections", nav:"Injections", title:"Injections and procedures — what the evidence says", sub:"Most requests for an injection can be met with a clear explanation of the trade-off.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"Corticosteroid injection", html:"<b>Short term:</b> the largest early pain relief of any option. <b>Long term:</b> worse. In the Coombes JAMA 2013 trial of 165 people, steroid injection compared with placebo gave lower complete recovery or much improvement at 1 year (83% vs 96%) and more recurrence (54% vs 12%). The Coombes Lancet 2010 review found steroid less effective than no intervention in the intermediate and long term. <b>BESS advises against it.</b> If a patient still chooses it after informed discussion, record the conversation, including the recurrence risk.", src:"Coombes et al., JAMA 2013; Coombes et al., Lancet 2010; BESS 2023"},
         {tone:"blue", h:"Extracorporeal shockwave therapy (refractory disease)", html:"NICE found no major safety concerns, but the evidence on efficacy is inconsistent. It is used only with special arrangements for clinical governance, consent and audit or research, with clear written information for patients. A Cochrane review of 9 placebo-controlled trials (1,006 participants) found little or no benefit for pain and function.", src:"NICE HTG201 (IPG313, Aug 2009); Buchbinder, Cochrane 2005"},
         {tone:"blue", h:"Autologous blood and platelet-rich plasma", html:"NICE: no major safety concerns, but efficacy evidence is inadequate, so these are used only with special arrangements. Patients should understand the uncertainty, especially about long-term efficacy, and know about alternatives. BESS says autologous blood injection should not be used, and further research comparing PRP with placebo is needed.", src:"NICE HTG299 (IPG438, Jan 2013); BESS 2023"},
         {tone:"cream", h:"Surgery", html:"Reserved for a small number of people with persistent, disabling symptoms after a long period of well-done non-operative care, and decided in secondary care after the diagnosis has been reconfirmed.", src:"BESS pathway, Singh et al. 2023"}
       ]},
       {b:"why", html:"The steroid paradox is the key teaching point. Injection reliably makes the elbow feel better within weeks, which is why patients ask for it and why it was used for so long. Placebo-controlled follow-up to a year shows fewer people recovered and many more relapsed. A GP who explains that clearly, offers a strong alternative plan, and records the patient’s choice is practising safely."}
     ]},

    {id:"followup", nav:"Follow-up", title:"Follow-up and safety-netting", sub:"Measure progress against function, not just pain scores.",
     blocks:[
       {b:"timeline", items:[
         {n:"1", when:"Day 0", title:"Diagnose and plan", html:"Red flags screened; diagnosis explained; the provoking task identified; exercise sheet or physiotherapy referral; topical NSAID if needed; injection discussed if raised."},
         {n:"2", when:"About 6 weeks", title:"Check adherence", html:"Is the exercise being done and progressed? Has the trigger task been modified? Pain may not have changed much yet. Reinforce the timescale."},
         {n:"3", when:"About 3 months", title:"Review function", html:"Most people are on an improving path by now. If there is no progress, re-examine for another diagnosis (neck, nerve, joint), check the programme, and consider supervised physiotherapy if not already in place."},
         {n:"4", when:"Beyond about 6 months", title:"Escalate if disabling", html:"Persistent, disabling symptoms despite a sustained programme → MSK or upper-limb service for review, imaging and specialist options."}
       ]},
       {b:"say", html:"Come back sooner if the elbow becomes hot or swollen, you can’t straighten it, you have pain at night that stops you sleeping, you get numbness or weakness in the hand, or you notice a lump that keeps growing."}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — who, how fast and where", sub:"Nearly everyone is managed in primary care. These are the exceptions.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same day", html:"Hot, swollen elbow with fever or a sudden loss of movement (suspected septic or crystal arthritis). Acute trauma with deformity or suspected fracture.", src:"BESS 2023 (differential diagnosis) · clinical practice"},
         {tone:"purple", h:"Suspected cancer pathway — NICE NG12", html:"<b>Adults, soft tissue — 1.11.4</b>: consider an urgent direct access ultrasound scan (to be performed within 2 weeks) to assess for soft tissue sarcoma in adults with an unexplained lump that is increasing in size. <b>1.11.5</b>: consider a suspected cancer pathway referral for adults if the ultrasound findings are suggestive of soft tissue sarcoma, or if the findings are uncertain and clinical concern persists. <b>Adults, bone</b>: consider a suspected cancer pathway referral if an X-ray suggests the possibility of bone sarcoma. <b>Children and young people</b>: consider a very urgent direct access X-ray (to be performed within 48 hours) to assess for bone sarcoma with unexplained bone swelling or pain, and a very urgent referral (appointment within 48 hours) if the X-ray suggests bone sarcoma; for an unexplained lump that is increasing in size, consider a very urgent direct access ultrasound scan (within 48 hours), with very urgent referral if it is suggestive or uncertain and concern persists.", src:"NICE NG12 recs 1.11.4 and 1.11.5, and bone and childhood sarcoma recommendations (updated April 2026)"},
         {tone:"amber", h:"Urgent specialist", html:"Progressive motor weakness (for example a finger-drop from posterior interosseous nerve palsy) or cervical radiculopathy with a significant motor deficit — refer to the appropriate spinal or upper-limb service."},
         {tone:"amber", h:"Rheumatology", html:"Enthesitis with no mechanical cause that is persistent, in several places, or occurs alongside back pain without a mechanical cause, uveitis, psoriasis, IBD, a GI or GU infection, or a family history of spondyloarthritis or psoriasis.", src:"NICE NG65 (2017) rec 1.1.10"},
         {tone:"cream", h:"Physiotherapy", html:"Anyone who needs help to build a loading programme, and anyone whose symptoms are affecting work.", src:"BESS pathway, Singh et al. 2023"},
         {tone:"blue", h:"MSK service or upper-limb surgeon — refractory", html:"Disabling symptoms after several months of well-done exercise-based care; diagnostic doubt; mechanical symptoms or an abnormal X-ray. Shockwave and blood injections, if offered, fall under NICE special arrangements.", src:"NICE HTG201 · HTG299 · BESS 2023"}
       ]},
       {b:"say", html:"This is tennis elbow — the tendon where your forearm muscles attach at the elbow has been overloaded. The good news is that nearly everyone gets better within a year. The best treatment is strengthening exercises and changing how you do the task that sets it off. A steroid injection would probably make it feel better within weeks, but people who have one are more likely to still have pain, or have it come back, a year later. So I’d recommend we start with the exercises."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only — the Casebook keeps the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 46-year-old self-employed plasterer has had 10 weeks of right lateral elbow pain. He cannot afford time off, and he wants a steroid injection today because it worked for his colleague. He has tried ibuprofen tablets, which upset his stomach.", src:"Coombes JAMA 2013 · BESS 2023"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Confirms the diagnosis and screens the <b>neck and nerves</b>. Explores the <b>work impact</b> and the specific provoking task. Explains the <b>natural history</b> (about 89% better within a year) and the <b>steroid trade-off</b> in numbers he can use (54% vs 12% recurrence at a year). Offers a practical plan: tool and grip changes, a home loading programme, <b>topical rather than oral NSAID</b> given his stomach, and a strap. Respects his choice if he still wants an injection after a balanced discussion, and documents it. Arranges review and safety-nets.", src:"BESS 2023 · Coombes JAMA 2013 · Pattanittum Cochrane 2013"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Primary sources for every recommendation and figure on this page.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>Singh HP et al. — BESS patient care pathway: tennis elbow.</b> Shoulder Elbow 2023 (British Elbow and Shoulder Society, GRADE-based)<br><a href="https://journals.sagepub.com/doi/abs/10.1177/17585732231170793" rel="noopener">doi.org/10.1177/17585732231170793</a><span class="rd"> — clinical diagnosis, X-ray only if uncertain; exercise-based physiotherapy first-line; advises against corticosteroid injection; autologous blood injection not to be used; orthosis may be offered; topical NSAID short-term benefit; recurrence risk factors</span></li>'+
         '<li><b>NICE HTG201 — Extracorporeal shockwave therapy for refractory tennis elbow</b> (published as IPG313, August 2009)<br><a href="https://www.nice.org.uk/guidance/htg201" rel="noopener">nice.org.uk/guidance/htg201</a><span class="rd"> — no major safety concerns; efficacy inconsistent; special arrangements</span></li>'+
         '<li><b>NICE HTG299 — Autologous blood injection for tendinopathy</b> (published as IPG438, January 2013)<br><a href="https://www.nice.org.uk/guidance/htg299" rel="noopener">nice.org.uk/guidance/htg299</a><span class="rd"> — efficacy inadequate; special arrangements; inform patients about uncertainty and alternatives</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral</b> (2015, updated April 2026)<br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — recs 1.11.4 and 1.11.5 (adult soft tissue sarcoma); very urgent X-ray within 48 hours for children and young people with unexplained bone swelling or pain; suspected cancer pathway referral for an adult X-ray suggesting bone sarcoma</span></li>'+
         '<li><b>NICE NG65 — Spondyloarthritis in over 16s: diagnosis and management</b> (2017)<br><a href="https://www.nice.org.uk/guidance/ng65" rel="noopener">nice.org.uk/guidance/ng65</a><span class="rd"> — rec 1.1.10, enthesitis referral criteria</span></li>'+
         '<li><b>MHRA Drug Safety Update — Diclofenac: new contraindications and warnings (June 2013)</b>; <b>High-dose ibuprofen (≥2400 mg/day): small increase in cardiovascular risk (June 2015)</b><br><a href="https://www.gov.uk/drug-safety-update/high-dose-ibuprofen-2400mg-day-small-increase-in-cardiovascular-risk" rel="noopener">gov.uk/drug-safety-update</a></li>'+
