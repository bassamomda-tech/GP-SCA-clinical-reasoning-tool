MG.render({
  icon:"🔴",
  title:"Genital herpes",
  eyebrow:"Protocol · assess and manage in one place",
  stemTitle:"Genital herpes: swab the ulcer, treat within 5 days, then match the plan to the recurrences",
  stemSub:"One page for anogenital herpes in primary care. Take an HSV PCR swab from the lesion and screen for syphilis, start oral aciclovir without waiting for the result, relieve pain and protect the bladder, then choose episodic or suppressive treatment by how often it returns. Pregnancy changes the plan from 32 weeks, a first episode in the third trimester changes the mode of delivery, and a genital ulcer that is not an STI may be a cancer pathway.",
  guideline:"BASHH anogenital herpes 2024 · BASHH/RCOG HSV in pregnancy 2024 · NICE NG12 (2025)",
  meta:[
    {t:"BASHH 2024 · anogenital herpes"},
    {t:"BASHH/RCOG 2024 · HSV in pregnancy"},

    {t:"2WW · NG12 vulval, penile, anal", tone:"tw"}
  ],
  lead:"<div class='mg-layers'><a href='#confirm'><b>Confirm</b><small>HSV PCR swab + STI screen</small></a><a href='#first'><b>Treat</b><small>aciclovir within 5 days</small></a><a href='#recur'><b>Recurrences</b><small>episodic or suppressive</small></a><a href='#pregnancy'><b>Pregnancy</b><small>suppress from 32 weeks</small></a></div>",
  quickSub:"The six points that change what you do today. Each one is traced to a named primary source under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"Cannot pass urine, stiff neck or pregnant at 28 weeks or more? Act today", html:"A severe first episode can cause <b>urinary retention</b> (pain plus sacral nerve involvement) or <b>aseptic meningitis</b> (headache, photophobia, neck stiffness): both need same-day hospital assessment. A <b>first episode from 28 weeks of pregnancy</b> needs same-day obstetric contact, because the baby may be born before maternal antibodies cross the placenta."},
    {tone:"cream", h:"Start aciclovir on clinical grounds — do not wait for the swab", html:"For a first episode seen within 5 days of onset, or while new lesions are still appearing, give <b>aciclovir 400 mg three times daily for 5 days</b> (BASHH 2024). Valaciclovir 500 mg twice daily or famciclovir 250 mg three times daily for 5 days are alternatives. Review at day 5 and extend if new lesions are still forming."},
    {tone:"blue", h:"A genital ulcer is syphilis until proved otherwise", html:"Swab the base of the lesion for <b>HSV PCR (with typing)</b> and, for every anogenital ulcer, send <b>syphilis serology</b> and offer a full STI screen with an <b>HIV test</b>. A painless, indurated ulcer, or a PCR-negative ulcer, needs sexual health input for syphilis PCR and other causes."},
    {tone:"cream", h:"Fewer than 6 a year: episodic. 6 or more: consider suppression", html:"Short patient-started courses are first-line for recurrences: <b>aciclovir 800 mg three times daily for 2 days</b>, valaciclovir 500 mg twice daily for 3 days or famciclovir 1 g twice daily for 1 day. Suppression was trialled in people with <b>at least 6 recurrences a year</b>: aciclovir 400 mg twice daily, stopped after <b>no more than 12 months</b> to reassess."},
    {tone:"amber", h:"Pregnancy: suppression from 32 weeks, not 36", html:"The 2024 BASHH/RCOG update advises <b>aciclovir 400 mg three times daily from 32 weeks</b> for anyone with a history of genital herpes, and continuous treatment to delivery after a third-trimester first episode. A first episode within <b>6 weeks of expected delivery</b> points towards caesarean birth."},
    {tone:"purple", h:"An ulcer that is not an infection may be cancer", html:"NICE NG12: consider a suspected cancer pathway referral for <b>vulval cancer</b> with an unexplained vulval lump, ulceration or bleeding; for <b>penile cancer</b> with a penile mass or ulcerated lesion once an STI has been excluded, or a persistent lesion after STI treatment; and for <b>anal cancer</b> with an unexplained anal mass or ulceration."}
  ],
  pathwaySub:"The consultation in five moves. Step one is where harm happens if it is skipped.",
  pathway:[
    {title:"Screen for the emergencies", html:"Retention or difficulty voiding, headache with neck stiffness or photophobia, sacral numbness or constipation, systemic illness or inability to take fluids, widespread or atypical lesions in someone immunosuppressed, and pregnancy at 28 weeks or beyond. Any of these moves the patient out of routine care today."},
    {title:"Swab it and screen widely", html:"<b>HSV PCR swab</b> from the base of a fresh or de-roofed lesion, asking for the virus type. <b>Syphilis serology</b> for every ulcer. Offer chlamydia and gonorrhoea NAAT and <b>HIV testing</b> (BHIVA/BASHH/BIA 2020). Routine HSV serology is not a diagnostic test for a lesion."},
    {title:"Treat on the day", html:"First episode within 5 days or with new lesions forming: <b>aciclovir 400 mg three times daily for 5 days</b>. Add saline bathing, simple analgesia, 5% lidocaine ointment, and advice to pass urine in a warm bath. Review at 5 days."},
    {title:"Match the plan to the recurrences", html:"Explain the virus type and what it means for the future. Infrequent recurrences: a <b>short patient-held course</b> started at the first tingle. Frequent or distressing recurrences (about 6 or more a year): <b>daily suppression</b>, reviewed after a maximum of 12 months."},
    {title:"Counsel, link and hand on", html:"Transmission, condoms, disclosure, the role of suppression in reducing transmission, and telling the maternity team in any future pregnancy. Refer to sexual health for a complete screen and partner discussion, and to obstetrics urgently in pregnancy."}
  ],
  sections:[
    {id:"confirm", nav:"Confirm", title:"Is it herpes? Swab, type and look for what else it could be", sub:"The clinical picture is often convincing, but the swab result shapes the counselling and the future plan.",
     blocks:[
       {b:"table", head:["Feature","First episode","Recurrence"], rows:[
         ["<b>Lesions</b>","Multiple painful blisters that break into shallow ulcers, often on both sides, and may keep appearing for several days","Fewer lesions, often on one side and at the same site each time"],
         ["<b>Systemic upset</b>","Fever, malaise and myalgia are common; tender inguinal nodes","Usually absent; a tingling or burning prodrome at the site"],
         ["<b>Urinary and nerve symptoms</b>","External dysuria, occasional retention; sacral radiculopathy is possible","Uncommon"],
         ["<b>Duration untreated</b>","Can last two to three weeks","Usually settles within a week"],
         ["<b>First episode is not always a new infection</b>","A first symptomatic episode may be a first presentation of an infection acquired months or years earlier","Typing plus, in pregnancy, type-specific serology separates a new (primary) infection from a first recognised recurrence"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"🧪 The swab that matters", html:"Take a <b>viral PCR swab</b> from the base of the lesion, de-roofing an intact blister if needed, and ask for <b>typing (HSV-1 or HSV-2)</b>. PCR is more sensitive than older culture methods. A negative swab from an old, crusted lesion does not exclude herpes — re-swab a fresh lesion at the next recurrence.", src:"BASHH anogenital herpes 2024"},
         {tone:"blue", h:"🩸 Test for the rest", html:"Every anogenital ulcer needs <b>syphilis serology</b>, and the patient should be offered chlamydia and gonorrhoea NAAT and an <b>HIV test</b>. An STI diagnosis is an indication for HIV testing in its own right.", src:"BASHH STI testing 2023 · BHIVA/BASHH/BIA 2020"},
         {tone:"amber", h:"🔍 When it is not herpes", html:"<b>Primary syphilis</b> (usually a single painless, indurated chancre), traumatic ulcers, fixed drug eruption, Behçet’s disease, lichen sclerosus or lichen planus erosions, and — in the right setting — lymphogranuloma venereum or chancroid. A persistent or non-healing ulcer needs a specialist opinion and, if unexplained, the NG12 cancer criteria.", src:"BASHH anogenital herpes 2024 · NICE NG12"},
         {tone:"cream", h:"🧬 Why the type matters", html:"<b>HSV-1</b> genital infection recurs much less often than <b>HSV-2</b>, so the type result is the basis for counselling about the future and for deciding whether a patient-held episodic supply is likely to be needed. Serology is reserved for specific situations, mainly pregnancy, and is interpreted by specialists.", src:"BASHH anogenital herpes 2024"}
       ]},
       {b:"why", html:"Treating before the result is correct because antiviral benefit depends on starting early, but the swab still matters: a confirmed diagnosis is what the patient will carry into every future relationship and pregnancy, and a negative swab with an atypical ulcer is the cue to look harder for syphilis or a non-infective cause."}
     ]},

    {id:"redflags", nav:"Red flags", title:"Red flags and situations that cannot wait", sub:"Most episodes are managed at home. These are the ones that are not.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Urinary retention", html:"Severe periurethral pain and urine touching raw vulval skin can stop voiding altogether; sacral nerve involvement adds a neurological cause. Try voiding in a warm bath with topical anaesthetic first. If the bladder is palpable or the patient still cannot pass urine, arrange <b>same-day catheterisation</b>; BASHH advises considering the <b>suprapubic route</b>, which avoids passing a catheter through inflamed tissue.", src:"BASHH anogenital herpes 2024"},
         {tone:"red", h:"🔴 Meningism or neurological signs", html:"Headache, photophobia and neck stiffness during a first episode suggest <b>HSV aseptic meningitis</b>; saddle numbness, constipation or retention suggest a sacral radiculomyelopathy. Confusion or reduced consciousness raises encephalitis. All need <b>same-day hospital assessment</b> for intravenous treatment.", src:"BASHH anogenital herpes 2024"},
         {tone:"red", h:"🔴 First episode at 28 weeks or later", html:"A first episode in the <b>third trimester</b> carries the highest risk of neonatal herpes, because the baby may be born before protective maternal antibodies are made. Start aciclovir and make <b>same-day contact with the obstetric team</b> to plan continuous treatment and mode of delivery.", src:"BASHH/RCOG HSV in pregnancy 2024"},
         {tone:"red", h:"🔴 Unable to cope at home", html:"Unable to take oral fluids or tablets, severe systemic illness, or widespread or disseminated lesions (especially in pregnancy or with immunosuppression) — admit for supportive care and intravenous antiviral treatment.", src:"BASHH anogenital herpes 2024"},
         {tone:"amber", h:"🟠 Immunosuppression", html:"People with advanced HIV or other immunosuppression can have extensive, persistent or atypical ulcers, and aciclovir resistance is almost confined to this group. New lesions appearing despite treatment need a <b>repeat swab with resistance testing</b> and specialist management.", src:"BASHH anogenital herpes 2024"},
         {tone:"amber", h:"🟠 Under 16, or a possible exploitation picture", html:"Assess competence and consent, the age and relationship of the partner, and any indicator of coercion or exploitation. Sexual activity under 13 is always a child protection matter; for 13 to 15 year olds, follow the multi-agency information-sharing and referral duties.", src:"Working Together to Safeguard Children 2026"},
         {tone:"purple", h:"Anogenital ulcer — NG12 suspected cancer <span class='tw'>2WW</span>", html:"Consider a suspected cancer pathway referral (for an appointment within 2 weeks) for <b>vulval cancer</b> in people with an unexplained vulval lump, ulceration or bleeding; for <b>penile cancer</b> with a penile mass or ulcerated lesion when an STI has been excluded as the cause, or a persistent penile lesion after treatment for an STI has been completed, or unexplained or persistent symptoms affecting the foreskin or glans; and for <b>anal cancer</b> with an unexplained anal mass or unexplained anal ulceration.", src:"NICE NG12 (updated April 2026)"}
       ]},
       {b:"why", html:"The high-harm outcomes of genital herpes are few but predictable: a bladder that will not empty, a nervous system involved, a baby exposed during a new maternal infection, and a patient whose immune system cannot contain the virus. A persistent ulcer that is never swabbed, or that stays PCR-negative, is also how anogenital cancers get missed."}
     ]},

    {id:"first", nav:"First episode", title:"Treating the first episode", sub:"Oral antivirals shorten the episode and reduce viral shedding. They do not change how often the infection comes back.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Step 1", tone:"cream", title:"Oral antiviral", when:"within 5 days of onset, or while new lesions are forming, or if systemic symptoms persist", fromLabel:"start on clinical grounds",
          html:"<b>Aciclovir 400 mg three times daily for 5 days</b> is the BASHH 2024 preferred choice. Alternatives: aciclovir 200 mg five times daily, <b>valaciclovir 500 mg twice daily</b> or <b>famciclovir 250 mg three times daily</b>, each for 5 days. Head-to-head trials show no advantage of one drug over another. Adjust aciclovir and valaciclovir in renal impairment per the BNF."},
         {step:"Step 2", tone:"cream", title:"Symptom relief", when:"everyone", fromLabel:"same visit",
          html:"Bathing in <b>salt water</b>, simple analgesia, <b>petroleum jelly</b> as a barrier, and <b>5% lidocaine ointment</b> before passing urine (sensitisation can occur). Advise <b>passing urine in a warm bath</b> if it stings. Loose clothing. Topical antivirals add little and are not recommended."},
         {step:"Step 3", tone:"amber", title:"Day-5 review", when:"new lesions still appearing", fromLabel:"extend if needed",
          html:"Trials show no clear benefit from routinely treating for longer than 5 days, but it is sensible to <b>continue treatment if new lesions are still forming</b> at day 5, or if there are complications. Persistent new lesions beyond this point need a repeat swab and specialist advice."},
         {step:"Step 4", tone:"red", title:"Admit", when:"retention, meningism, unable to swallow, disseminated disease", fromLabel:"same day",
          html:"Hospital care for intravenous aciclovir, catheterisation (suprapubic considered) and supportive treatment."}
       ]},
       {b:"warn", html:"Antivirals do not clear latent virus from the sensory ganglia. Say so plainly, so the patient does not interpret a later recurrence as treatment failure or as a new infection from a current partner."},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"✅ Good practice while it heals", html:"Avoid sex, including oral sex, from the first symptoms until lesions have fully healed. Wash hands after touching lesions. Most first episodes settle within 2–3 weeks, faster with early treatment.", src:"BASHH anogenital herpes 2024"},
         {tone:"blue", h:"💊 Drug notes", html:"Aciclovir and valaciclovir are renally cleared: check eGFR in older or unwell patients and reduce the dose per the BNF. Encourage fluids. Famciclovir is an alternative where adherence to multiple daily doses is a problem.", src:"BNF · aciclovir and valaciclovir SPC"}
       ]}
     ]},

    {id:"recur", nav:"Recurrences", title:"Recurrences: episodic, suppressive or nothing", sub:"Recurrences are usually milder and shorter than the first episode, and they tend to become less frequent over time. The patient’s preference counts as much as the count.",
     blocks:[
       {b:"table", head:["Option","Regimen (BASHH 2024)","Best for"], rows:[
         ["<b>Supportive care only</b>","Saline bathing and petroleum jelly","Mild, infrequent recurrences the patient is happy to ride out"],
         ["<b>Episodic short course</b> — first line","<b>Aciclovir 800 mg three times daily for 2 days</b>, or <b>valaciclovir 500 mg twice daily for 3 days</b>, or <b>famciclovir 1 g twice daily for 1 day</b>","Infrequent recurrences with a recognisable prodrome. Give a supply to hold at home and start it at the first prodromal tingle"],
         ["<b>Episodic 5-day course</b>","Aciclovir 400 mg three times daily or valaciclovir 500 mg twice daily, each for 5 days","Where a short course is not suitable"],
         ["<b>Daily suppression</b>","<b>Aciclovir 400 mg twice daily</b> (three times daily if breakthrough). Alternatives: valaciclovir 500 mg once daily, famciclovir 250 mg twice daily (doses per BNF)","About <b>6 or more recurrences a year</b>, or fewer that cause significant distress, or to reduce transmission to a partner"]
       ]},
       {b:"timeline", items:[
         {n:"1", when:"Start", title:"Agree the goal", html:"Fewer outbreaks, less anxiety, or protecting a partner. Record the recurrence frequency before starting so the review has a baseline."},
         {n:"2", when:"Maximum 12 months", title:"Stop and reassess", html:"BASHH advises stopping suppression after <b>no more than a year</b>. Recurrences often cluster just after stopping, so judge the new pattern over <b>at least two recurrences</b> before deciding."},
         {n:"3", when:"Restart if needed", title:"Resume if still troublesome", html:"If the frequency is still unacceptable, restart. If breakthrough occurs on aciclovir 400 mg twice daily, increase to three times daily or change drug before assuming resistance."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"📉 What suppression does", html:"Daily antivirals reduce the number of recurrences and cut <b>asymptomatic viral shedding by about 80–90%</b> in trials. Twice-daily aciclovir and once-daily valaciclovir both reduce shedding.", src:"BASHH anogenital herpes 2024"},
         {tone:"blue", h:"🤝 Suppression and partners", html:"In a randomised trial of couples where only one partner had HSV-2, <b>valaciclovir 500 mg once daily</b> in the source partner reduced transmission by about half.", src:"Corey et al., NEJM 2004"},
         {tone:"cream", h:"🩺 Practical prescribing", html:"Put the episodic supply on repeat so it is at home before the next prodrome. For suppression, book the 12-month stop point at the time of prescribing rather than leaving an open-ended repeat.", src:"BASHH anogenital herpes 2024"},
         {tone:"amber", h:"🟠 When a recurrence does not behave", html:"Lesions persisting beyond two weeks, new lesions despite adequate dosing, or unusual sites: re-swab (with resistance testing if immunosuppressed), recheck HIV status and syphilis serology, and refer.", src:"BASHH anogenital herpes 2024"}
       ]}
     ]},

    {id:"pregnancy", nav:"Pregnancy", title:"Pregnancy: timing is everything", sub:"The risk to the baby depends on whether the mother has antibodies at the time of birth. That is why a new infection late in pregnancy is dangerous and a long-standing one rarely is.",
     blocks:[
       {b:"table", head:["Situation","What to do (BASHH/RCOG 2024)","Birth"], rows:[
         ["<b>First episode before 28 weeks</b>","Treat with <b>aciclovir 400 mg three times daily</b> (usually 5 days); inform the obstetric team. Then <b>daily aciclovir 400 mg three times daily from 32 weeks</b> until delivery","Vaginal birth is usually anticipated"],
         ["<b>First episode at 28 weeks or later</b>","Same-day obstetric contact. Start <b>aciclovir 400 mg three times daily and continue until delivery</b>. Type-specific serology helps show whether this is a new infection or a first recognised recurrence","<b>Caesarean birth is recommended</b>, particularly if symptoms began <b>within 6 weeks of the expected delivery</b>"],
         ["<b>Known recurrent genital herpes</b>","Reassure: the risk to the baby is low. Consider <b>daily aciclovir 400 mg three times daily from 32 weeks</b> to reduce lesions at term","Vaginal birth is appropriate even with a recurrence at the onset of labour; discuss options"],
         ["<b>Partner has herpes, patient does not</b>","Advise avoiding sex (including oral sex) during partner outbreaks, and consistent condom use, particularly in the third trimester","—"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"🤰 Why 32 weeks now", html:"The 2024 update moved suppression earlier than the previous 36 weeks, so that babies born early — who may not yet have received enough maternal antibody — are also covered. If your records or a patient’s birth plan still say 36 weeks, check with the maternity team. Where the risk of preterm birth is high, the BASHH/RCOG algorithm allows suppression to start earlier (from 22 weeks); that is an obstetric decision.", src:"BASHH/RCOG HSV in pregnancy 2024"},
         {tone:"green", h:"✅ Aciclovir is safe in pregnancy", html:"Large exposure datasets show <b>no increased risk of congenital malformation</b> with aciclovir or valaciclovir at any stage of pregnancy. Exposure is not a reason for additional fetal monitoring.", src:"UKTIS aciclovir/valaciclovir monograph"},
         {tone:"blue", h:"👶 After the birth", html:"Neonatal herpes can present in the first weeks with skin, eye or mouth lesions, poor feeding, lethargy, fever or seizures. Parents with a recent or active infection should seek <b>urgent help for any concern</b>, and anyone with a cold sore should avoid kissing the baby.", src:"BASHH/RCOG HSV in pregnancy 2024"},
         {tone:"green", h:"🍼 Breastfeeding", html:"Aciclovir and valaciclovir can be used while breastfeeding. Breastfeeding is fine unless there is a herpetic lesion on the breast.", src:"SPS breastfeeding advice · aciclovir SPC"}
       ]},
       {b:"why", html:"Neonatal herpes is rare but carries serious mortality and long-term neurological harm. Most cases follow a new maternal infection close to birth, when the mother is shedding virus and has not yet passed antibodies to the baby. That is why the key primary-care questions in pregnancy are simply: is this the first time, and how many weeks is she?"}
     ]},

    {id:"special", nav:"Special groups", title:"Special situations", sub:"Groups in whom the default plan changes.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"🩸 HIV and other immunosuppression", html:"Episodes can be longer and more severe, and suppression is used more readily. Higher doses and longer courses are specialist decisions; resistance should be suspected when lesions keep appearing despite treatment. Ensure an up-to-date HIV test in anyone with genital herpes whose status is unknown.", src:"BASHH anogenital herpes 2024 · BHIVA/BASHH/BIA 2020"},
         {tone:"amber", h:"🧒 Children and young people", html:"Genital herpes in a pre-pubertal child needs a safeguarding assessment, although autoinoculation from oral herpes is possible. In young people, respect confidentiality, assess competence, and follow local child protection procedures where there is concern.", src:"Working Together to Safeguard Children 2026"},
         {tone:"blue", h:"🧾 Renal impairment and older people", html:"Aciclovir and valaciclovir accumulate in renal impairment, with a risk of neurotoxicity (confusion, hallucinations). Check eGFR and adjust per the BNF.", src:"BNF · aciclovir SPC"},
         {tone:"cream", h:"🌈 Men who have sex with men", html:"Anal and perianal herpes can present as proctitis with pain, discharge and tenesmus. Offer rectal STI testing, including lymphogranuloma venereum where indicated, and HIV testing.", src:"BASHH STI testing 2023"}
       ]}
     ]},

    {id:"counsel", nav:"Counselling", title:"Counselling: the conversation matters as much as the tablets", sub:"The diagnosis often causes more distress than the lesions. Clear facts reduce both.",
     blocks:[
       {b:"dl", rows:[
         ["<b>It is common</b>","Many adults carry HSV-1 or HSV-2 and most never know it. A diagnosis says nothing about fidelity: a first episode can be a first presentation of infection acquired long ago."],
         ["<b>It usually gets easier</b>","Recurrences are milder than the first episode and tend to become less frequent over time, especially with HSV-1."],
         ["<b>Transmission</b>","The virus can pass on without visible lesions (asymptomatic shedding). Avoid sex during prodrome and lesions; condoms reduce but do not remove the risk; daily suppression lowers it further."],
         ["<b>Oral sex</b>","Genital HSV-1 is often acquired through oral sex from someone with a cold sore. Avoid oral sex when either partner has a cold sore or a genital lesion."],
         ["<b>Telling partners</b>","Disclosure is a personal decision, but many people find it easier with practical facts in hand. Sexual health clinics can help plan the conversation."],
         ["<b>Pregnancy</b>","Tell the midwife or doctor about the diagnosis in any future pregnancy, or if a partner has herpes, so that suppression from 32 weeks can be planned."],
         ["<b>Support</b>","The Herpes Viruses Association provides patient information and a helpline."]
       ]},
       {b:"say", html:"This is genital herpes, the same family of virus that causes cold sores. The first episode is almost always the worst. The tablets will help this settle faster. The virus stays in the body, and it may come back, but usually more mildly. If it does, you can keep a short course at home and start it at the first tingle, and if it comes back often we can use a daily tablet. It doesn’t tell you when or from whom you caught it."},
       {b:"why", html:"Misunderstanding drives the psychological burden: patients commonly assume a first episode means recent infidelity, or that they can never have a sexual relationship or a safe pregnancy. Addressing latency, shedding and the effect of suppression directly is what BASHH describes as central to management."}
     ]},

    {id:"refer", nav:"Refer", title:"Refer: who, where and how fast", sub:"Sexual health services are the natural partner for every first episode. The urgency depends on the red flags.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same day — hospital", html:"Urinary retention · meningism, encephalitic features or sacral radiculopathy · unable to take fluids or tablets · disseminated disease · severe disease in an immunosuppressed patient.", src:"BASHH anogenital herpes 2024"},
         {tone:"red", h:"Same day — obstetrics", html:"First episode from 28 weeks of pregnancy, or any first episode close to term, to plan continuous aciclovir and the mode of birth. Neonate with any possible herpes features → same-day paediatrics.", src:"BASHH/RCOG HSV in pregnancy 2024"},
         {tone:"purple", h:"Urgent suspected cancer <span class='tw'>2WW</span> · NICE NG12", html:"Consider a suspected cancer pathway referral (for an appointment within 2 weeks) for <b>vulval cancer</b> in people with an unexplained vulval lump, ulceration or bleeding; for <b>penile cancer</b> with a penile mass or ulcerated lesion when an STI has been excluded as the cause, or a persistent penile lesion after treatment for an STI has been completed, or unexplained or persistent symptoms affecting the foreskin or glans; and for <b>anal cancer</b> with an unexplained anal mass or unexplained anal ulceration.", src:"NICE NG12 (updated April 2026)"},
         {tone:"amber", h:"Soon — sexual health", html:"Every first episode, for confirmation, a full STI and HIV screen, partner discussion and counselling. Also: diagnostic doubt, a PCR-negative ulcer, recurrences not controlled by suppression, suspected resistance, or HIV co-infection.", src:"BASHH anogenital herpes 2024"},
         {tone:"amber", h:"Routine — maternity booking", html:"Anyone with known genital herpes, or whose partner has it, who is pregnant: flag at booking so that 32-week suppression and the birth plan are in place.", src:"BASHH/RCOG HSV in pregnancy 2024"},
         {tone:"green", h:"Stays in primary care", html:"Uncomplicated first episodes with sexual health follow-up, episodic short courses, and suppression with a 12-month review.", src:"BASHH anogenital herpes 2024"}
       ]},
       {b:"say", html:"I’ve taken a swab to confirm this and started treatment today. I’d also like you to have a full sexual health check, including an HIV test, which is routine for anyone with a genital ulcer. If you can’t pass urine, get a bad headache or stiff neck, or feel very unwell, you need to be seen the same day."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card. The Casebook holds the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
