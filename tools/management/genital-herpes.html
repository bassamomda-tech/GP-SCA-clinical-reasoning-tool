<script>
MG.render({
  icon:"🔴",
  title:"Genital herpes",
  eyebrow:"Protocol · assess and manage in one place",
  stemTitle:"Genital herpes: swab the ulcer, treat within 5 days, then match the plan to the recurrences",
  stemSub:"One page for anogenital herpes in primary care. Take an HSV PCR swab from the lesion and screen for syphilis, start oral aciclovir without waiting for the result, relieve pain and protect the bladder, then choose episodic or suppressive treatment by how often it returns. Pregnancy changes the plan from 32 weeks, a first episode from 28 weeks needs same-day obstetric contact and an obstetric-led birth plan, and a genital ulcer that is not an STI may be a cancer pathway.",
  guideline:"BASHH anogenital herpes 2024 · BASHH/RCOG HSV in pregnancy 2024 · NICE NG12 (updated April 2026)",
  meta:[
    {t:"BASHH 2024 · anogenital herpes"},
    {t:"BASHH/RCOG 2024 · HSV in pregnancy"},
    {t:"BHIVA/BASHH/BIA 2020 · HIV testing"},
    {t:"Suspected cancer · NG12 vulval, penile, anal", tone:"tw"}
  ],
  lead:"<div class='mg-layers'><a href='#confirm'><b>Confirm</b><small>HSV PCR swab + STI screen</small></a><a href='#first'><b>Treat</b><small>aciclovir 5–10 days, review day 5</small></a><a href='#recur'><b>Recurrences</b><small>episodic or suppressive</small></a><a href='#pregnancy'><b>Pregnancy</b><small>suppress from 32 weeks</small></a></div>",
  quickSub:"The six points that change what you do today. Each one is traced to a named primary source under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"Cannot pass urine, stiff neck, or a first episode at 28 weeks or later? Act today", html:"A severe first episode can cause <b>urinary retention</b> (pain plus sacral nerve involvement) or <b>aseptic meningitis</b> (headache, photophobia, neck stiffness): both need same-day hospital assessment; IV aciclovir and further investigations may be required. <b>First episode of genital herpes at 28 weeks or later: contact the obstetric team the same day</b> (known recurrent herpes at 28 weeks is not necessarily an emergency), because the baby may be born before maternal antibodies cross the placenta."},
    {tone:"cream", h:"Start aciclovir on clinical grounds — do not wait for the swab", html:"For a first episode seen within 5 days of onset, or while new lesions are still appearing, start <b>aciclovir 400 mg three times daily as soon as possible, usually for 5 days (5–10 days)</b> (BASHH 2024). Valaciclovir 500 mg twice daily or famciclovir 250 mg three times daily are alternatives. <b>Review clinically at day 5; extend treatment to 10 days if new lesions are still forming, systemic symptoms persist or healing is incomplete.</b> A patient presenting late with fully crusted, healing lesions may gain less benefit."},
    {tone:"blue", h:"Actively exclude syphilis in every anogenital ulcer", html:"Swab the base of the lesion for <b>HSV PCR (with typing)</b> and, for every anogenital ulcer, send <b>syphilis serology</b> and offer an <b>HIV test</b>; offer chlamydia and gonorrhoea NAAT according to sexual history and exposure sites. Syphilis must be actively excluded even when the lesion appears herpetic. <b>A single painless, indurated ulcer, or an ulcer with negative HSV PCR, requires urgent sexual-health review</b> — lesion PCR for syphilis where available does not replace serology."},
    {tone:"cream", h:"Episodic or suppressive — led by burden and preference, not count alone", html:"Short patient-started courses are first-line for recurrences: <b>aciclovir 800 mg three times daily for 2 days</b>, valaciclovir 500 mg twice daily for 3 days or famciclovir 1 g twice daily for 1 day. Consider suppression (aciclovir 400 mg twice daily) after <b>approximately six or more recurrences a year</b>, but also offer it with fewer if episodes are particularly painful, distressing, prolonged, disruptive or if reducing transmission risk is an important goal. <b>Review at least annually</b>; a trial off treatment is reasonable if the patient agrees, but not mandatory."},
    {tone:"amber", h:"Pregnancy: suppression from 32 weeks, not 36", html:"For a history of recurrent genital herpes, <b>offer/discuss suppressive aciclovir 400 mg three times daily from 32 weeks until delivery</b> (BASHH/RCOG 2024), integrated with the maternity team’s plan; continue treatment to delivery after a first episode from 28 weeks. <b>Mode of birth is an obstetric decision</b>: caesarean is particularly considered or recommended when a first episode occurs within <b>6 weeks of expected delivery</b>, or lesions/prodrome are present at labour."},
    {tone:"purple", h:"An ulcer that is not an infection may be cancer", html:"NICE NG12: consider a suspected cancer pathway referral for <b>vulval cancer</b> with an unexplained vulval lump, ulceration or bleeding; for <b>penile cancer</b> with a penile mass or ulcerated lesion once an STI has been excluded, or a persistent lesion after STI treatment; and for <b>anal cancer</b> with an unexplained anal mass or ulceration. Do not delay urgent referral of a clinically suspicious lesion because HSV PCR is negative or syphilis testing is pending."}
  ],
  pathwaySub:"The consultation in five moves. Step one is where harm happens if it is skipped.",
  pathway:[
    {title:"Screen for the emergencies", html:"Retention or difficulty voiding, headache with neck stiffness or photophobia, sacral numbness or constipation, systemic illness or inability to take fluids, widespread or atypical lesions in someone immunosuppressed, and a first episode in pregnancy at 28 weeks or beyond. Any of these moves the patient out of routine care today."},
    {title:"Swab it and screen widely", html:"<b>HSV PCR swab</b> from the base of a fresh or de-roofed lesion, asking for the virus type. <b>Syphilis serology</b> for every ulcer and <b>HIV testing</b> (BHIVA/BASHH/BIA 2020). Offer chlamydia and gonorrhoea NAAT according to sexual history and exposure sites. Routine HSV serology is not a diagnostic test for a lesion. A negative PCR from an old or poorly sampled lesion does not exclude herpes."},
    {title:"Treat on the day", html:"First episode within 5 days, with new lesions forming or with significant systemic symptoms: <b>aciclovir 400 mg three times daily, usually for 5 days (5–10 days)</b>. Add saline bathing, simple analgesia, 5% lidocaine ointment, and advice to pass urine in a warm bath. Review at day 5 and extend to 10 days if new lesions, systemic symptoms or incomplete healing."},
    {title:"Match the plan to the recurrences", html:"Explain the virus type and what it means for the future. Infrequent recurrences: a <b>short patient-held course</b> started at the first tingle. Frequent (about 6 or more a year), painful, prolonged or distressing recurrences, or to reduce transmission: <b>daily suppression</b>, reviewed at least annually."},
    {title:"Counsel, link and hand on", html:"Transmission, condoms, disclosure, the role of suppression in reducing transmission, and telling the maternity team in any future pregnancy. Offer or arrange sexual-health review for every suspected first episode for a complete screen and partner discussion (local Bolton sexual-health referral route), and contact obstetrics urgently for a first episode in pregnancy."}
  ],
  sections:[
    {id:"confirm", nav:"Confirm", title:"Is it herpes? Swab, type and look for what else it could be", sub:"The clinical picture is often convincing, but the swab result shapes the counselling and the future plan.",
     blocks:[
       {b:"table", head:["Feature","First episode","Recurrence"], rows:[
         ["<b>Lesions</b>","Multiple painful blisters that break into shallow ulcers, often on both sides, and may keep appearing for several days","Fewer lesions, often on one side and at the same site each time"],
         ["<b>Systemic upset</b>","Fever, malaise and myalgia are common; tender inguinal nodes","Usually absent; a tingling or burning prodrome at the site"],
         ["<b>Urinary and nerve symptoms</b>","External dysuria, occasional retention; sacral radiculopathy is possible","Uncommon"],
         ["<b>Duration untreated</b>","Can last two to three weeks","Usually settles within a week"],
         ["<b>First episode is not always a new infection</b>","A first symptomatic episode may be a first presentation of an infection acquired months or years earlier","Typing plus, in pregnancy, type-specific serology separates a new (primary) infection from a first recognised recurrence"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"🧪 The swab that matters", html:"Use a <b>viral PCR swab</b> from the base of a fresh ulcer or newly unroofed vesicle; avoid sampling only the surface crust. Request <b>HSV-1/HSV-2 typing</b>. PCR is more sensitive than older culture methods. <b>A negative PCR from an old, partially healed or inadequately sampled lesion does not exclude herpes</b> — if clinical suspicion remains, reassess and swab a fresh lesion at recurrence.", src:"BASHH anogenital herpes 2024"},
         {tone:"blue", h:"🩸 Test for the rest", html:"For every anogenital ulcer, send <b>syphilis serology</b> and offer an <b>HIV test</b> — an STI diagnosis or presentation is an indication for HIV testing in its own right. Offer NAAT for chlamydia and gonorrhoea according to sexual history and exposure sites, including urethral, vaginal/cervical, rectal or pharyngeal testing where indicated. For men who have sex with men or patients with rectal symptoms, include rectal NAAT, LGV testing where clinically indicated, HIV testing and syphilis serology. Refer to sexual health for a complete STI assessment.", src:"BASHH STI testing 2023 · BHIVA/BASHH/BIA 2020"},
         {tone:"amber", h:"🔍 When it is not herpes", html:"<b>Primary syphilis</b> (usually a single painless, indurated chancre), traumatic ulcers, fixed drug eruption, Behçet’s disease, lichen sclerosus or lichen planus erosions, and — in the right setting — lymphogranuloma venereum or chancroid. A persistent or non-healing ulcer needs a specialist opinion and, if unexplained, the NG12 cancer criteria.", src:"BASHH anogenital herpes 2024 · NICE NG12"},
         {tone:"cream", h:"🧬 Why the type matters", html:"<b>HSV-1</b> genital infection recurs much less often than <b>HSV-2</b>, so the type result is the basis for counselling about the future and for deciding whether a patient-held episodic supply is likely to be needed. Do not use routine HSV serology to diagnose an individual lesion: type-specific serology is reserved for specialist-directed situations, particularly pregnancy or discordant couples.", src:"BASHH anogenital herpes 2024"}
       ]},
       {b:"why", html:"Treating before the result is correct because antiviral benefit depends on starting early, but the swab still matters: a confirmed diagnosis is what the patient will carry into every future relationship and pregnancy, and a negative swab with an atypical ulcer is the cue to look harder for syphilis or a non-infective cause."}
     ]},

    {id:"redflags", nav:"Red flags", title:"Red flags and situations that cannot wait", sub:"Most episodes are managed at home. These are the ones that are not.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Urinary retention", html:"Severe periurethral pain and urine touching raw vulval skin can stop voiding altogether; sacral nerve involvement adds a neurological cause. Try voiding in a warm bath with topical anaesthetic first. If the bladder is palpable or the patient still cannot pass urine, arrange <b>same-day assessment and bladder decompression</b> (assess bladder volume where available). Do not allow prolonged repeated attempts at urethral catheterisation through severe ulceration. A <b>suprapubic catheter</b> may be preferable where urethral catheterisation is very painful or technically difficult; this is a specialist decision requiring urology, sexual-health or gynaecology support.", src:"BASHH anogenital herpes 2024"},
         {tone:"red", h:"🔴 Meningism or neurological signs", html:"Headache, photophobia and neck stiffness during a first episode suggest <b>HSV aseptic meningitis</b>; saddle numbness, constipation or retention suggest a sacral radiculomyelopathy. Confusion or reduced consciousness raises encephalitis. All need <b>same-day hospital assessment</b>; IV aciclovir, neurological assessment and imaging or CSF investigation may be required.", src:"BASHH anogenital herpes 2024"},
         {tone:"red", h:"🔴 First episode at 28 weeks or later", html:"A first episode in the <b>third trimester</b> carries the highest risk of neonatal herpes, because the baby may be born before protective maternal antibodies are made. Start aciclovir and make <b>same-day contact with the obstetric/maternity team</b>; continue aciclovir until delivery and ask the obstetric team to determine the mode of birth (not automatically caesarean).", src:"BASHH/RCOG HSV in pregnancy 2024"},
         {tone:"red", h:"🔴 Unable to cope at home", html:"Unable to take oral fluids or tablets, severe systemic illness, or widespread or disseminated lesions (especially in pregnancy or with immunosuppression) — admit for supportive care and intravenous antiviral treatment.", src:"BASHH anogenital herpes 2024"},
         {tone:"amber", h:"🟠 Immunosuppression", html:"People with advanced HIV or other immunosuppression can have extensive, persistent or atypical ulcers, and aciclovir resistance is almost confined to this group. Extensive or atypical ulcers may be caused by HSV, syphilis, CMV, aphthous disease or malignancy. Consider aciclovir resistance when lesions progress despite adequate treatment: <b>repeat swab with resistance testing</b>, repeat HIV testing if clinically indicated, and urgent sexual-health/infectious-diseases referral. Higher doses or prolonged courses are given under specialist supervision.", src:"BASHH anogenital herpes 2024"},
         {tone:"amber", h:"🟠 Under 16, or a possible exploitation picture", html:"Assess competence and consent, the age and relationship of the partner, and any indicator of coercion or exploitation. Follow local safeguarding procedures and involve specialist paediatric/sexual-health services where there is concern.", src:"Working Together to Safeguard Children 2026"},
         {tone:"purple", h:"Anogenital ulcer — NG12 suspected cancer pathway referral", html:"Consider a suspected cancer pathway referral (for an appointment within 2 weeks) for <b>vulval cancer</b> in people with an unexplained vulval lump, ulceration or bleeding; for <b>penile cancer</b> with a penile mass or ulcerated lesion when an STI has been excluded as the cause, or a persistent penile lesion after treatment for an STI has been completed, or unexplained or persistent symptoms affecting the foreskin or glans; and for <b>anal cancer</b> with an unexplained anal mass or unexplained anal ulceration. <b>Do not delay urgent referral of a clinically suspicious lesion merely because an HSV PCR is negative or syphilis testing is pending.</b> A typical, resolving herpetic ulcer does not need automatic cancer-pathway referral, but a persistent, non-healing, indurated or atypical lesion needs specialist assessment even when initial STI tests are negative.", src:"NICE NG12 (updated April 2026)"}
       ]},
       {b:"why", html:"The high-harm outcomes of genital herpes are few but predictable: a bladder that will not empty, a nervous system involved, a baby exposed during a new maternal infection, and a patient whose immune system cannot contain the virus. A persistent ulcer that is never swabbed, or that stays PCR-negative, is also how anogenital cancers get missed."}
     ]},

    {id:"first", nav:"First episode", title:"Treating the first episode", sub:"Oral antivirals shorten the episode and reduce viral shedding. They do not change how often the infection comes back.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Step 1", tone:"cream", title:"Oral antiviral", when:"within 5 days of onset, or while new lesions are still appearing, or while systemic symptoms remain clinically significant", fromLabel:"start on clinical grounds",
          html:"<b>Aciclovir 400 mg three times daily, usually for 5 days (5–10 days with review)</b> is the BASHH 2024 preferred choice. Alternatives: aciclovir 200 mg five times daily, <b>valaciclovir 500 mg twice daily</b> or <b>famciclovir 250 mg three times daily</b>, for the same 5–10-day course. A patient presenting late with fully crusted, healing lesions may gain less benefit. Head-to-head trials show no advantage of one drug over another. Adjust aciclovir and valaciclovir in renal impairment according to the current product information/local formulary."},
         {step:"Step 2", tone:"cream", title:"Symptom relief", when:"everyone", fromLabel:"same visit",
          html:"Bathing in <b>salt water</b>, simple analgesia, <b>petroleum jelly</b> as a barrier, and <b>5% lidocaine ointment</b> before passing urine — apply a small amount externally and avoid excessive or repeated application (sensitisation can occur); avoid benzocaine-containing preparations (higher sensitisation risk). Ensure the patient can still pass urine and maintain hydration. Advise <b>passing urine in a warm bath</b> if it stings. Loose clothing. Topical antivirals add little and are not recommended."},
         {step:"Step 3", tone:"amber", title:"Day-5 review", when:"new lesions, systemic symptoms or incomplete healing", fromLabel:"extend to 10 days if needed",
          html:"BASHH 2024 allows 5–10 days. Review clinically at day 5 and <b>extend treatment to 10 days if new lesions are still forming, systemic symptoms persist, healing is incomplete</b> or there are complications. In pregnancy, do not stop automatically at day 5 — use the pregnancy guideline and clinical response. Persistent new lesions beyond this point need a repeat swab and specialist advice."},
         {step:"Step 4", tone:"red", title:"Admit", when:"retention, meningism, unable to swallow, disseminated disease", fromLabel:"same day",
          html:"Same-day hospital assessment; IV aciclovir, bladder decompression (suprapubic catheter a specialist decision) and supportive treatment may be required."}
       ]},
       {b:"warn", html:"Antivirals do not clear latent virus from the sensory ganglia. Say so plainly, so the patient does not interpret a later recurrence as treatment failure or as a new infection from a current partner."},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"✅ Good practice while it heals", html:"Avoid sex, including oral sex, from the first symptoms until lesions have fully healed. Wash hands after touching lesions. Most first episodes settle within 2–3 weeks, faster with early treatment.", src:"BASHH anogenital herpes 2024"},
         {tone:"blue", h:"💊 Drug notes", html:"Aciclovir and valaciclovir are renally cleared: <b>check eGFR before prolonged, suppressive or high-dose treatment, and in older, frail or acutely unwell patients</b>, and adjust per the current product information/local formulary. Encourage adequate hydration. Warn about neurotoxicity — confusion, hallucinations, tremor, dysarthria, drowsiness and seizures. Routine creatinine monitoring is not required in every otherwise well patient on standard suppression, but is appropriate where renal risk is present. Famciclovir is an alternative where adherence to multiple daily doses is a problem.", src:"BNF · aciclovir and valaciclovir SPC"}
       ]}
     ]},

    {id:"recur", nav:"Recurrences", title:"Recurrences: episodic, suppressive or nothing", sub:"Recurrences are usually milder and shorter than the first episode, and they tend to become less frequent over time. The patient’s preference counts as much as the count.",
     blocks:[
       {b:"table", head:["Option","Regimen (BASHH 2024)","Best for"], rows:[
         ["<b>Supportive care only</b>","Saline bathing and petroleum jelly","Mild, infrequent recurrences the patient is happy to ride out"],
         ["<b>Episodic short course</b> — first line","<b>Aciclovir 800 mg three times daily for 2 days</b>, or <b>valaciclovir 500 mg twice daily for 3 days</b>, or <b>famciclovir 1 g twice daily for 1 day</b>","Infrequent recurrences with a recognisable prodrome. Give a supply to hold at home and start it at the first prodromal tingle"],
         ["<b>Episodic 5-day course</b>","Aciclovir 400 mg three times daily or valaciclovir 500 mg twice daily, each for 5 days","Where a short course is not suitable"],
         ["<b>Daily suppression</b>","<b>Aciclovir 400 mg twice daily</b> (three times daily if breakthrough). Alternatives: valaciclovir 500 mg once daily, famciclovir 250 mg twice daily (doses per BNF)","About <b>6 or more recurrences a year</b>, or fewer that are painful, prolonged, psychologically distressing, affecting relationships or sexual activity, causing complications, or where reducing transmission to a partner is a goal"]
       ]},
       {b:"timeline", items:[
         {n:"1", when:"Start", title:"Agree the goal", html:"Fewer outbreaks, less anxiety, or protecting a partner. Record the recurrence frequency before starting so the review has a baseline."},
         {n:"2", when:"At least annually", title:"Review and, if agreed, pause", html:"Review suppressive treatment <b>at least annually</b>. If the patient agrees, stop or pause treatment to reassess the natural recurrence pattern — not mandatory. Recurrences often cluster just after stopping, so assess <b>at least two subsequent recurrences</b> before deciding whether to restart."},
         {n:"3", when:"Restart if needed", title:"Resume if still troublesome", html:"If the frequency is still unacceptable, restart. If lesions persist or recur despite suppressive treatment, first check adherence, renal dosing and the diagnosis, repeat PCR, and assess for HIV/immunosuppression; in immunocompetent patients increasing aciclovir to three times daily or changing drug is reasonable — resistance is uncommon. In immunosuppressed patients, request resistance testing and refer urgently to sexual health/infectious diseases."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"📉 What suppression does", html:"Daily antivirals reduce the number of recurrences and cut <b>asymptomatic viral shedding by about 80–90%</b> in trials. Twice-daily aciclovir and once-daily valaciclovir both reduce shedding.", src:"BASHH anogenital herpes 2024"},
         {tone:"blue", h:"🤝 Suppression and partners", html:"In a randomised trial of couples where only one partner had HSV-2, <b>valaciclovir 500 mg once daily</b> in the source partner (immunocompetent heterosexual couples, symptomatic genital HSV-2) reduced transmission by about half. Evidence is strongest for HSV-2-discordant couples; for genital HSV-1, recurrences and shedding are less frequent and evidence is less extensive. Reduction is not elimination — suppression does not replace condoms, disclosure discussions or avoiding sex during lesions or prodrome.", src:"Corey et al., NEJM 2004"},
         {tone:"cream", h:"🩺 Practical prescribing", html:"Put the episodic supply on repeat so it is at home before the next prodrome. For suppression, book an annual review at the time of prescribing rather than leaving an open-ended repeat.", src:"BASHH anogenital herpes 2024"},
         {tone:"amber", h:"🟠 When a recurrence does not behave", html:"Lesions persisting beyond two weeks, new lesions despite adequate dosing, or unusual sites: check adherence and renal dosing, re-swab (with resistance testing if immunosuppressed), recheck HIV status and syphilis serology, and refer to sexual health/specialist services.", src:"BASHH anogenital herpes 2024"}
       ]}
     ]},

    {id:"pregnancy", nav:"Pregnancy", title:"Pregnancy: timing is everything", sub:"The risk to the baby depends on whether the mother has antibodies at the time of birth. That is why a new infection late in pregnancy is dangerous and a long-standing one rarely is.",
     blocks:[
       {b:"table", head:["Situation","What to do (BASHH/RCOG 2024)","Birth"], rows:[
         ["<b>First episode before 28 weeks</b>","Start <b>aciclovir 400 mg three times daily</b> promptly; inform the maternity/obstetric team; treat according to clinical response and the pregnancy guideline (do not stop automatically at day 5 if lesions are still developing). Then <b>daily aciclovir 400 mg three times daily from 32 weeks</b> until delivery","Vaginal birth is usually anticipated"],
         ["<b>First episode at 28 weeks or later</b>","Same-day obstetric contact. Start <b>aciclovir 400 mg three times daily and continue until delivery</b>. Type-specific serology helps show whether this is a new infection or a first recognised recurrence","<b>Mode of birth is determined by the obstetric team.</b> Caesarean is particularly considered or recommended when the first episode occurs <b>within 6 weeks of the expected delivery date</b>, or lesions/prodromal symptoms are present at labour, per the local obstetric pathway"],
         ["<b>First episode within about 6 weeks of expected delivery</b>","Obstetric-led discussion; continue aciclovir until delivery","Caesarean is generally recommended or strongly considered (BASHH/RCOG)"],
         ["<b>Known recurrent genital herpes</b>","Reassure: the risk to the baby is low. Offer/discuss <b>suppressive aciclovir 400 mg three times daily from 32 weeks until delivery</b>, in line with BASHH/RCOG and the local maternity pathway; consider earlier initiation where preterm-birth risk is high, under obstetric advice","Recurrent herpes alone does not usually require caesarean birth; vaginal birth is usually appropriate. If lesions or prodromal symptoms are present at labour, discuss delivery urgently with the obstetric team"],
         ["<b>Lesions or prodrome at labour</b>","Immediate obstetric assessment","Local delivery pathway — caesarean is not automatic in every recurrence"],
         ["<b>Partner has herpes, patient does not</b>","Avoid sex, including oral sex, during the partner’s lesions or prodrome; discuss condoms and maternity advice, particularly in the third trimester","—"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"🤰 Why 32 weeks now", html:"The 2024 update moved suppression earlier than the previous 36 weeks, so that babies born early — who may not yet have received enough maternal antibody — are also covered. If your records or a patient’s birth plan still say 36 weeks, check with the maternity team. Where the risk of preterm birth is high, the BASHH/RCOG algorithm allows suppression to start earlier (from 22 weeks); that is an obstetric decision.", src:"BASHH/RCOG HSV in pregnancy 2024"},
         {tone:"blue", h:"📋 Maternity record", html:"Make sure the maternity record clearly states the <b>HSV type</b> if known, whether infection was a <b>first episode or recurrent</b>, the <b>date of the last episode</b>, the <b>suppressive treatment plan</b> and the <b>delivery plan</b>. Use the local maternity/obstetric contact route.", src:"BASHH/RCOG HSV in pregnancy 2024"},
         {tone:"green", h:"✅ Aciclovir is safe in pregnancy", html:"Large exposure datasets show <b>no increased risk of congenital malformation</b> with aciclovir or valaciclovir at any stage of pregnancy. Exposure is not a reason for additional fetal monitoring.", src:"UKTIS aciclovir/valaciclovir monograph"},
         {tone:"blue", h:"👶 After the birth", html:"Neonatal herpes can present in the first weeks with skin, eye or mouth lesions, poor feeding, lethargy, fever or seizures. Parents with a recent or active infection should seek <b>urgent help for any concern</b>, and anyone with a cold sore should avoid kissing the baby.", src:"BASHH/RCOG HSV in pregnancy 2024"},
         {tone:"green", h:"🍼 Breastfeeding", html:"Aciclovir and valaciclovir can be used while breastfeeding. Breastfeeding is fine unless there is a herpetic lesion on the breast.", src:"SPS breastfeeding advice · aciclovir SPC"}
       ]},
       {b:"why", html:"Neonatal herpes is rare but carries serious mortality and long-term neurological harm. Most cases follow a new maternal infection close to birth, when the mother is shedding virus and has not yet passed antibodies to the baby. That is why the key primary-care questions in pregnancy are simply: is this the first time, and how many weeks is she?"}
     ]},

    {id:"special", nav:"Special groups", title:"Special situations", sub:"Groups in whom the default plan changes.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"🩸 HIV and other immunosuppression", html:"Episodes can be longer and more severe, and suppression is used more readily. Higher doses and longer courses are specialist decisions; resistance should be suspected when lesions keep appearing despite treatment. Ensure an up-to-date HIV test in anyone with genital herpes whose status is unknown, and repeat it if clinically indicated. Extensive or atypical ulcers may be HSV, syphilis, CMV, aphthous disease or malignancy.", src:"BASHH anogenital herpes 2024 · BHIVA/BASHH/BIA 2020"},
         {tone:"amber", h:"🧒 Children and young people", html:"Genital HSV in a prepubertal child requires urgent paediatric assessment and a safeguarding review. Do not make assumptions about the source of infection — transmission can occur through sexual abuse, perinatal transmission, autoinoculation from oral herpes or, in some circumstances, non-sexual contact. Follow local safeguarding procedures and involve specialist paediatric/sexual-health services. In young people, respect confidentiality, assess competence, and follow local child protection procedures where there is concern.", src:"Working Together to Safeguard Children 2026"},
         {tone:"blue", h:"🧾 Renal impairment and older people", html:"Aciclovir and valaciclovir accumulate in renal impairment, with a risk of neurotoxicity (confusion, hallucinations, tremor, dysarthria, drowsiness, seizures). Check eGFR before prolonged, suppressive or high-dose treatment and in older, frail or acutely unwell patients; adjust per the current product information/local formulary and encourage hydration.", src:"BNF · aciclovir SPC"},
         {tone:"cream", h:"🌈 Men who have sex with men", html:"Anal and perianal herpes can present as proctitis with pain, discharge and tenesmus. Offer rectal chlamydia/gonorrhoea NAAT, LGV testing where clinically indicated, HIV testing and syphilis serology, and follow local guidance for anal/perianal herpes and proctitis.", src:"BASHH STI testing 2023"}
       ]}
     ]},

    {id:"counsel", nav:"Counselling", title:"Counselling: the conversation matters as much as the tablets", sub:"The diagnosis often causes more distress than the lesions. Clear facts reduce both.",
     blocks:[
       {b:"dl", rows:[
         ["<b>It is common</b>","Many adults carry HSV-1 or HSV-2 and most never know it. A diagnosis says nothing about fidelity: a first episode can be a first presentation of infection acquired long ago."],
         ["<b>It usually gets easier</b>","Recurrences are milder than the first episode and tend to become less frequent over time, especially with HSV-1."],
         ["<b>Transmission</b>","The virus can pass on without visible lesions (asymptomatic shedding). Avoid sex during prodrome and lesions; condoms reduce but do not remove the risk; daily suppression lowers it further (evidence strongest for HSV-2), but does not replace condoms or avoiding sex during lesions or prodrome."],
         ["<b>Oral sex</b>","Genital HSV-1 is often acquired through oral sex from someone with a cold sore. Avoid oral sex when either partner has a cold sore or a genital lesion."],
         ["<b>Telling partners</b>","Disclosure is a personal decision, but many people find it easier with practical facts in hand. Sexual health clinics can help plan the conversation."],
         ["<b>Pregnancy</b>","Tell the midwife or doctor about the diagnosis in any future pregnancy, or if a partner has herpes, so that suppression from 32 weeks and the birth plan can be discussed with the maternity team."],
         ["<b>Support</b>","The Herpes Viruses Association provides patient information and a helpline."]
       ]},
       {b:"say", html:"This is genital herpes, the same family of virus that causes cold sores. The first episode is almost always the worst. The tablets will help this settle faster. The virus stays in the body, and it may come back, but usually more mildly. If it does, you can keep a short course at home and start it at the first tingle, and if it comes back often we can use a daily tablet. It doesn’t tell you when or from whom you caught it."},
       {b:"why", html:"Misunderstanding drives the psychological burden: patients commonly assume a first episode means recent infidelity, or that they can never have a sexual relationship or a safe pregnancy. Addressing latency, shedding and the effect of suppression directly is what BASHH describes as central to management."}
     ]},

    {id:"refer", nav:"Refer", title:"Refer: who, where and how fast", sub:"Sexual health services are the natural partner for every first episode. The urgency depends on the red flags.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same day — hospital", html:"Urinary retention · meningism, encephalitic features or sacral radiculopathy · unable to take fluids or tablets · disseminated disease · severe disease in an immunosuppressed patient.", src:"BASHH anogenital herpes 2024"},
         {tone:"red", h:"Same day — obstetrics", html:"First episode from 28 weeks of pregnancy, or any first episode close to term, to plan continuous aciclovir; the obstetric team determines the mode of birth. Lesions or prodrome at labour → immediate obstetric assessment. Neonate with any possible herpes features → same-day paediatrics.", src:"BASHH/RCOG HSV in pregnancy 2024"},
         {tone:"purple", h:"Suspected cancer pathway referral · NICE NG12", html:"Consider a suspected cancer pathway referral (for an appointment within 2 weeks) for <b>vulval cancer</b> in people with an unexplained vulval lump, ulceration or bleeding; for <b>penile cancer</b> with a penile mass or ulcerated lesion when an STI has been excluded as the cause, or a persistent penile lesion after treatment for an STI has been completed, or unexplained or persistent symptoms affecting the foreskin or glans; and for <b>anal cancer</b> with an unexplained anal mass or unexplained anal ulceration. Do not delay urgent referral because HSV PCR is negative or syphilis testing is pending.", src:"NICE NG12 (updated April 2026)"},
         {tone:"amber", h:"Soon — sexual health", html:"Offer or arrange sexual-health review for every suspected first episode (local Bolton sexual-health referral route) — for confirmation, a full STI and HIV screen, partner discussion and counselling, particularly in pregnancy, atypical disease or complications. Urgent review for a single painless indurated ulcer. Also: diagnostic doubt, a PCR-negative ulcer, a persistent non-healing or atypical lesion, recurrences not controlled by suppression, suspected resistance, or HIV co-infection.", src:"BASHH anogenital herpes 2024"},
         {tone:"amber", h:"Routine — maternity booking", html:"Anyone with known genital herpes, or whose partner has it, who is pregnant: flag at booking so that 32-week suppression and the birth plan are in place.", src:"BASHH/RCOG HSV in pregnancy 2024"},
         {tone:"green", h:"Stays in primary care", html:"Primary care may initiate treatment immediately and continue uncomplicated episodic or suppressive treatment (reviewed at least annually) when an agreed local pathway with sexual health exists.", src:"BASHH anogenital herpes 2024"}
       ]},
       {b:"say", html:"I’ve taken a swab to confirm this and started treatment today. I’d also like you to have a full sexual health check, including an HIV test, which is routine for anyone with a genital ulcer. If you can’t pass urine, get a bad headache or stiff neck, or feel very unwell, you need to be seen the same day."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card. The Casebook holds the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 24-year-old woman with three days of painful vulval sores, stinging on passing urine and flu-like symptoms. She has been with her partner for two years and is convinced he has been unfaithful. She mentions she is 30 weeks pregnant.", src:"BASHH/RCOG HSV in pregnancy 2024"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Asks about <b>voiding and headache</b>; examines and swabs for <b>HSV PCR with typing</b>; offers <b>syphilis and HIV testing</b>; starts <b>aciclovir 400 mg three times daily</b> today; recognises that a first episode at 30 weeks needs <b>same-day obstetric contact</b>, continuous aciclovir and an obstetric-led decision on mode of birth; explains that a first episode <b>does not prove recent infection</b>; and safety-nets retention and meningism.", src:"BASHH anogenital herpes 2024"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Every recommendation on this page traces to a named primary source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>BASHH — UK national guideline for the management of anogenital herpes (2024)</b>. Patel R et al. Int J STD AIDS 2024<br><a href="https://www.bashh.org/resources/23/updated_guideline_anogenital_herpes_2024/" rel="noopener">bashh.org — anogenital herpes 2024</a><span class="rd"> — diagnosis by PCR with typing, first-episode regimens, supportive care and catheterisation, 5–10-day first-episode course, short-course episodic treatment, suppression by recurrence burden and preference, at-least-annual review, shedding reduction</span></li>'+
         '<li><b>BASHH/RCOG — National UK guideline for the management of HSV in pregnancy and the neonate (2024 update)</b>. Clarke E et al. Int J STD AIDS 2024<br><a href="https://www.bashh.org/resources/24/updated_guideline_herpes_in_pregnancy_2024/" rel="noopener">bashh.org — herpes in pregnancy 2024</a><span class="rd"> — suppression from 32 weeks, first episodes from 28 weeks, obstetric-led mode of birth (caesarean considered within 6 weeks of delivery or with lesions at labour), neonatal risk</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — vulval, penile and anal cancer referral criteria</span></li>'+
         '<li><b>BASHH — Summary guidance on testing for sexually transmitted infections (2023)</b><br><a href="https://www.bashh.org/_userfiles/pages/files/resources/bashh_summary_guidance_on_stis_testing_2023.pdf" rel="noopener">bashh.org — STI testing 2023</a><span class="rd"> — which tests to offer alongside an ulcer diagnosis</span></li>'+
         '<li><b>BHIVA/BASHH/BIA — Adult HIV testing guidelines (2020)</b><br><a href="https://bhiva.org/clinical-guideline/hiv-testing-guidelines/" rel="noopener">bhiva.org — HIV testing 2020</a><span class="rd"> — HIV testing for anyone diagnosed with an STI</span></li>'+
         '<li><b>Corey L et al. Once-daily valacyclovir to reduce the risk of transmission of genital herpes. NEJM 2004;350:11–20</b><span class="rd"> — about 50% reduction in transmission with suppression in immunocompetent heterosexual HSV-2-discordant couples</span></li>'+
         '<li><b>UKTIS — Use of aciclovir/valaciclovir in pregnancy</b><br><a href="https://uktis.org/monographs/use-of-aciclovir-in-pregnancy/" rel="noopener">uktis.org</a><span class="rd"> — no increased malformation risk</span></li>'+
         '<li><b>NHS Specialist Pharmacy Service — Treating herpes virus infections during breastfeeding</b><br><a href="https://sps.nhs.uk/articles/treating-herpes-virus-infections-during-breastfeeding/" rel="noopener">sps.nhs.uk</a><span class="rd"> — aciclovir and valaciclovir in breastfeeding</span></li>'+
         '<li><b>BNF and SPCs — aciclovir, valaciclovir, famciclovir</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — renal dose adjustment (use the current renal-dose table), neurotoxicity and alternative doses</span></li>'+
         '<li><b>Local pathways (Bolton / Greater Manchester)</b><span class="rd"> — sexual-health referral route, maternity/obstetric contact route, HIV testing and safeguarding pathways, anal/perianal herpes and proctitis</span></li>'+
         '<li><b>HM Government — Working Together to Safeguard Children (2026)</b><br><a href="https://www.gov.uk/government/publications/working-together-to-safeguard-children--2" rel="noopener">gov.uk</a><span class="rd"> — safeguarding framework for children and young people; follow local safeguarding procedures</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Anogenital herpes in primary care — BASHH anogenital herpes guideline 2024, BASHH/RCOG HSV in pregnancy 2024, NICE NG12 (updated April 2026), BHIVA/BASHH/BIA HIV testing 2020, UKTIS and the BNF. Check every dose against the current BNF and local sexual health pathways. Not a substitute for clinical judgement."
