  stemTitle:"Malnutrition is screened for with a five-minute tool that most practices own and few use, and the two things that kill are not the undernutrition itself — they are refeeding syndrome and missed thiamine deficiency (Wernicke encephalopathy)",
  stemSub:"One page for the whole condition. Score MUST properly (including how to get a height from someone who cannot stand), act on the score — <b>2 or more means high risk — a documented nutritional care plan started promptly, with dietitian referral according to the local pathway</b> — then work the food-first step-up before reaching for a prescription, because ONS have ACBS criteria and a review date. Along the way: why albumin is not a standalone nutritional marker, the food-insecurity question worth asking verbatim, depression as the commonest treatable cause of weight loss in older people, and the individualised, capacity-aware conversation about tube feeding in severe dementia.",
  guideline:"NICE CG32 · NG97 · NG69 · BAPEN MUST · RCPsych MEED CR233 (2022) · ACBS · NG12 (updated April 2026) · GOV.UK alcohol care in acute hospitals",

    {t:"NICE CG32 — nutrition support in adults"},

  ],
  lead:'<div class="mg-layers"><a href="#safety"><b>Red flags</b><small>Refeeding · Wernicke</small></a><a href="#must"><b>MUST</b><small>Score and act</small></a><a href="#causes"><b>Causes</b><small>Intake · losses · social</small></a><a href="#treat"><b>Step up</b><small>Food first, then ONS</small></a><a href="#practical"><b>Practical</b><small>What actually works</small></a></div>',
  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Thiamine before or alongside glucose — but never delay emergency glucose", html:"In a patient at risk of thiamine deficiency, give thiamine before or as soon as possible alongside carbohydrate/glucose where clinically feasible. <b>Do not delay emergency treatment of severe hypoglycaemia.</b> Glucose increases the metabolic demand for thiamine in someone already depleted and can precipitate Wernicke encephalopathy. The triad is confusion, ataxia and ophthalmoplegia, but not all three need be present: suspect Wernicke in any malnourished patient who becomes confused. If Wernicke encephalopathy is suspected, give urgent parenteral thiamine according to the local hospital/alcohol-care protocol — typically IV thiamine 300–500 mg three times daily for 3–5 days with daily review, further parenteral treatment if symptoms persist, then oral treatment. <b>Oral thiamine is not adequate initial treatment.</b> Highest risk: alcohol dependence, prolonged vomiting, post-bariatric surgery, cancer."},
    {tone:"red", h:"⚠ Refeeding syndrome — the risk is created by the treatment", html:"High risk = <b>one or more of</b>: BMI under 16 kg/m²; unintentional weight loss over 15% in 3–6 months; little or no intake for more than 10 days; low potassium, phosphate or magnesium before feeding. <b>Or two or more of</b>: BMI under 18.5 kg/m²; unintentional weight loss over 10% in 3–6 months; little or no intake for more than 5 days; a history of alcohol dependence or drugs associated with refeeding risk (insulin, chemotherapy, antacids, diuretics). Check sodium, potassium, urea, creatinine, magnesium and phosphate BEFORE starting nutrition support. Start at a maximum of 10 kcal/kg/day, increasing gradually to full requirements by about day 4–7; use 5 kcal/kg/day in extreme cases (BMI under 14 or negligible intake for over 15 days), with continuous cardiac monitoring where appropriate. Give thiamine and B vitamins before and during feeding. Feeding need not be delayed until mild pre-feeding abnormalities are normalised — give electrolyte supplementation from the outset unless pre-feeding levels are high. <b>Monitor potassium, phosphate and magnesium daily initially</b>, then three times weekly until stable, then weekly according to clinical risk, plus fluid balance, glucose and signs of oedema or cardiac/respiratory deterioration. Severe abnormalities need same-day senior/specialist assessment."},
    {tone:"blue", h:"MUST score 2 or more = high risk — care plan and dietitian per local pathway", html:"Three steps: BMI (over 20 = 0, 18.5–20 = 1, under 18.5 = 2) + unplanned weight loss over 3–6 months (under 5% = 0, 5–10% = 1, over 10% = 2) + acute disease effect (2 if acutely ill AND no intake for over 5 days). 0 = low risk, rescreen weekly in hospital and follow local policy for care-home frequency; in general practice, screen at registration and whenever there is clinical concern, and consider opportunistic screening during annual reviews, frailty reviews, vaccination clinics and care-home visits. 1 = medium, document and observe. 2 or more = high risk — start or arrange a documented nutritional care plan promptly (nutritional support, cause assessment, monitoring) and refer to a registered dietitian according to the local community/care-home pathway; in this practice a dietitian referral should normally be made for MUST 2 or more. If the patient cannot stand or be weighed, use the BAPEN MUST alternative-measurement guidance (ulna length or other validated surrogates); if height or weight cannot be measured reliably, document the limitation and use weight history, mid-upper-arm circumference, clinical assessment and intake rather than a falsely precise BMI — \"unable to weigh\" is not a reason to skip screening."},
    {tone:"amber", h:"Albumin is not a standalone nutritional marker", html:"Albumin is a negative acute-phase reactant: it falls in infection, surgery, trauma, malignancy and CKD because the liver switches to making CRP and fibrinogen instead. So severe established malnutrition can show a normal albumin, and a well-nourished septic patient can show a low one. A low albumin commonly reflects inflammation, fluid status, liver disease, renal protein loss or other illness, and it can coexist with malnutrition. Interpret it with the clinical assessment, weight trajectory, intake, CRP and functional status — <b>do not use albumin to diagnose or exclude malnutrition.</b> Routine prealbumin testing is not necessary in primary care and is also affected by inflammation."},
    {tone:"green", h:"Food first — and fortification beats prescribing", html:"<b>Before any supplement: fortify what the patient already eats.</b> Full-fat milk instead of skimmed; butter on vegetables and potatoes; cheese into soups and mash; cream into porridge; milk powder into milky foods — 2 tablespoons adds about 4 g of protein without adding volume. Small frequent meals every 2–3 hours, the largest when appetite is best (often mid-morning, not evening), and the most nutritious part of the meal eaten first before fatigue or early satiety sets in. <b>Do not delay ONS for an arbitrary period</b> where there is significant malnutrition, rapid deterioration, inadequate intake or high clinical risk."},
    {tone:"purple", h:"🟣 NICE NG12 — unexplained weight loss is a cancer route", html:"Unexplained weight loss aged 60 and over is an NG12 trigger in its own right, and malnutrition may be its first presentation. Use the age- and symptom-specific criteria: aged 60 and over with unexplained weight loss over 5% within 6 months → assess for additional symptoms, signs or findings, then offer urgent investigation, a suspected cancer pathway referral or a non-specific symptoms pathway referral (rec 1.13.2, amended April 2026); aged 40 and over with unexplained weight loss and abdominal pain → offer FIT to guide colorectal referral; aged 55 and over with weight loss plus dyspepsia, reflux or upper abdominal pain → suspected upper GI cancer pathway referral; aged 60 and over with weight loss plus diarrhoea, back pain, abdominal pain, nausea, vomiting, constipation or new-onset diabetes → consider urgent direct-access CT (or ultrasound if CT is unavailable) for pancreatic cancer; aged 40 and over with unexplained weight loss and respiratory symptoms → chest X-ray criteria depend on the number of symptoms and smoking history, not simply weight loss plus any respiratory symptom. NG12 does not mean every patient under 60 with isolated unexplained weight loss automatically needs a suspected cancer pathway referral — but clinical judgement and safety-netting remain essential. Restated in <a href='#refer'>Refer</a>."}
  ],
  pathwaySub:"Five steps. The screening step is the one that is skipped, and the refeeding step is the one that causes harm.",
  pathway:[
    {title:"Score MUST — and do it on the patients who never get screened", html:"Measure weight, height and BMI where possible, calculate percentage unintentional weight loss, assess recent and anticipated intake, and document the score and action plan. Screen at registration and whenever there is clinical concern — any adult with unintentional weight loss, BMI under 20, poor appetite, a chronic disease carrying nutritional risk, or any condition impairing food intake. Where the patient cannot be weighed or stand, use the BAPEN alternative measurements (ulna length or other validated surrogates) and document the limitation rather than generating a falsely precise BMI."},
    {title:"Identify immediate danger and refeeding risk BEFORE feeding", html:"Assess observations and hydration, confusion/delirium, dysphagia and aspiration risk, and ECG where eating-disorder or electrolyte-related cardiac risk exists. Refeeding risk: one of BMI under 16, weight loss over 15%, minimal intake over 10 days, or low phosphate, potassium or magnesium — or two or more of BMI under 18.5, weight loss over 10%, minimal intake over 5 days, or alcohol dependence or relevant drugs. Check potassium, phosphate, magnesium, calcium, glucose and renal function first, give thiamine before and during feeding, start at up to 10 kcal/kg/day (5 kcal/kg/day in extreme risk) — and never delay emergency glucose for severe hypoglycaemia.", alert:true},
    {title:"Find the cause across all three axes", html:"Reduced intake (depression, dysphagia, dentition, drugs, food access) · increased losses or demands (malabsorption, cancer, COPD, sepsis) · social and psychological (isolation, bereavement, anxiety, food insecurity and ability to shop/cook, alcohol, eating disorder, cognitive impairment and capacity). Also nausea, vomiting, constipation, early satiety, dry mouth and medicines affecting appetite, taste, swallowing or bowel function. Depression is the commonest treatable cause in older people and is routinely missed — PHQ-9 at every assessment."},
    {title:"Step up: food first, then ONS, then enteral", html:"Treat the underlying disease and reversible symptoms · fortification and snacks where safe — without delaying ONS where malnutrition is significant or deteriorating · ONS where clinically indicated and ACBS criteria are met, with a documented indication, goals and review date · dietetics according to MUST and the local pathway · SALT for dysphagia · social prescribing, social care or benefits support where relevant · enteral feeding only when oral intake is unsafe or inadequate, the gut is functional and there is a realistic goal of benefit · parenteral nutrition only under a specialist nutrition team."},
    {title:"Monitor, and stop when the job is done", html:"Weight and intake weekly then monthly, MUST rescored each time, potassium, phosphate and magnesium daily initially if high refeeding risk (then three times weekly until stable, then weekly), and function. Record symptoms, adherence and tolerance, ONS quantity and actual consumption, treatment goals, review date and stopping plan. Review ONS within about 4–6 weeks (sooner if high risk) and stop them when adequate nutrition is maintained from normal food."}
  ],
  sections:[

    {id:"safety", nav:"Red flags", title:"Red flags — including the two the treatment creates",
     blocks:[
       {b:"table", head:["Feature","Meaning","Action"], rows:[
         ["Confusion in a malnourished patient — with or without ataxia and ophthalmoplegia","<b>Wernicke encephalopathy.</b> Thiamine deficiency impairs pyruvate dehydrogenase; the classic triad is frequently incomplete","Same-day hospital assessment for urgent parenteral thiamine according to the local hospital/alcohol-care protocol (typically IV thiamine 300–500 mg three times daily for 3–5 days, with daily review) — oral thiamine is not adequate initial treatment. <b>Give thiamine before or alongside glucose where feasible, but never delay emergency treatment of severe hypoglycaemia</b>"],
         ["One or more of: BMI under 16 · weight loss over 15% in 3–6 months · negligible intake for over 10 days · low phosphate, potassium or magnesium. <b>Or two or more of:</b> BMI under 18.5 · weight loss over 10% in 3–6 months · little or no intake for over 5 days · alcohol dependence or insulin, chemotherapy, antacids or diuretics","<b>High refeeding-syndrome risk.</b> Refeeding drives an insulin surge, intracellular shift of phosphate, potassium and magnesium, and can cause arrhythmia, cardiac failure and death","Check sodium, potassium, urea, creatinine, magnesium and phosphate BEFORE feeding; start at a maximum of 10 kcal/kg/day (5 kcal/kg/day in extreme cases); thiamine and B vitamins before and during feeding; monitor potassium, phosphate and magnesium daily initially, then three times weekly until stable, then weekly. <b>Severe hypophosphataemia or severe derangement → same-day senior/specialist assessment</b>"],
         ["Malnutrition with severe dehydration or haemodynamic instability, acute confusion or delirium, significant arrhythmia or ECG abnormality, or feeding that cannot be safely managed in the community","<b>Medically unstable malnutrition</b>","<b>Same-day hospital assessment.</b> A MUST score of 2 or more alone does not require same-day hospital assessment — it needs prompt nutritional intervention and dietitian referral, with hospital assessment according to the clinical state"],
         ["<b>Unexplained weight loss over 5% within 6 months with no identified cause</b>","<b>Undiagnosed malignancy until excluded</b>","<b>NG12 pathway — see <a href='#refer'>Refer</a>.</b> Aged 60 and over it is a criterion in its own right; under 60, isolated weight loss does not automatically mean a suspected cancer referral — use clinical judgement and safety-netting"],
         ["Suspected eating disorder with warning markers such as BMI under 13, heart rate under 40, BP under 80/50, QTc over 450 ms, potassium under 3.0 mmol/L, or syncope","High-risk markers originally set out in MARSIPAN (now superseded by RCPsych MEED CR233, 2022, which grades risk with a traffic-light framework). These are warning markers, not a complete or universal admission algorithm: use MEED CR233 as a structured risk-assessment framework — one red or two or more amber parameters should prompt urgent specialist medical assessment, and it does not replace clinical judgement. No single BMI or weight threshold should determine admission (NICE NG69); consider the overall medical state, rate of weight loss, ECG, electrolytes, hydration, purging, diabetes, engagement and support, and consider admission where physical health cannot be safely managed in the community","Weigh, measure BMI, ECG for QTc, check electrolytes and glucose, and refer to the adult eating disorder service — or liaison psychiatry if acutely medically unwell"],
         ["<b>Uraemic malnutrition with confusion</b>","<b>Advanced renal failure</b>","<b>Same-day assessment</b>"],
         ["Unexplained malnutrition in a child, or in an adult with capacity concerns","<b>Safeguarding</b>","Safeguarding referral immediately — MASH or local authority adult social care. Document the clinical findings and the explanation given without challenging the carer narrative, and record the discrepancy"]
       ]},
       {b:"warn", html:"The two iatrogenic dangers on this page both come from treating enthusiastically. Feeding a severely depleted patient too fast causes refeeding syndrome; giving glucose to a thiamine-depleted patient causes Wernicke encephalopathy. Both are prevented by the same two habits: check phosphate, potassium and magnesium before you start, and give thiamine before or alongside feeding — without ever delaying emergency glucose for severe hypoglycaemia."}
     ]},

    {id:"must", nav:"MUST", title:"MUST — scoring it, and scoring the patients who cannot stand",
     sub:"Validated, free, about five minutes, developed by BAPEN and built on the same criteria (BMI, unintentional weight loss) as NICE CG32 (2006) — and the commonest reason malnutrition is missed is that nobody scored it.",
     blocks:[
       {b:"table", head:["Step","Scoring"], rows:[
         ["<b>Step 1 — BMI</b>","<b>Over 20 = 0 points · 18.5–20 = 1 point · under 18.5 = 2 points</b>"],
         ["<b>Step 2 — unplanned weight loss over the last 3–6 months</b>","<b>Under 5% = 0 points · 5–10% = 1 point · over 10% = 2 points</b>"],
         ["<b>Step 3 — acute disease effect</b>","2 points if the patient is acutely ill AND there has been no nutritional intake for more than 5 days"],
         ["<b>Total 0 — low risk</b>","<b>Rescreen weekly in hospital; follow local policy for care-home frequency.</b> In general practice, screen at registration and whenever there is clinical concern; consider opportunistic screening during annual reviews, frailty reviews, vaccination clinics and care-home visits"],
         ["<b>Total 1 — medium risk</b>","<b>Document and observe; dietary advice and fortification; rescreen</b>"],
         ["<b>Total 2 or more — high risk</b>","<b>Start or arrange a documented nutritional care plan promptly</b> — nutritional support, cause assessment and monitoring. Refer to a registered dietitian according to the local community/care-home pathway; in this practice, a dietitian referral should normally be made for MUST 2 or more"]
       ]},
       {b:"dl", rows:[
         ["<b>Who to screen</b>","At GP registration and whenever there is clinical concern (care-home residents on admission and when clinically indicated) — particularly any adult with unintentional weight loss, BMI under 20, poor appetite, a chronic disease carrying nutritional risk (cancer, COPD, CKD, heart failure, IBD, neurological disease), or any condition that might impair food intake. Care home residents, the housebound and the recently discharged are the groups most often missed"],
         ["<b>If the patient cannot be weighed or cannot stand</b>","Use the BAPEN MUST alternative-measurement guidance, including ulna length or other validated surrogate methods. If height or weight cannot be measured reliably, document the limitation and use available weight history, mid-upper-arm circumference, clinical assessment and dietary intake rather than generating a falsely precise BMI. In fluid overload, oedema, CKD or ascites, measured weight may substantially misrepresent nutritional status. <b>\"Unable to weigh\" is not a reason to leave the screen undone</b> — the tools exist precisely for this group"],
         ["<b>Where to get it</b>","<b>Free at bapen.org.uk.</b> Every practice should be able to score MUST"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"🔬 Types worth distinguishing", html:"<b>Protein-energy malnutrition</b> — the common UK picture is mixed PEM with sarcopenia. <b>Disease-related malnutrition</b> — reduced intake plus increased demand from chronic illness. <b>Malnutrition–inflammation–cachexia syndrome</b> — inflammation-driven weight loss in malignancy, heart failure or CKD, which is metabolically distinct from simple undernutrition and does not fully reverse with feeding alone."},
         {tone:"amber", h:"⚠ Micronutrients travel with it", html:"Vitamin D (very common — housebound, care home, covered or darker skin), iron, B12, folate, zinc (poor wound healing, immune dysfunction, taste disturbance), selenium, magnesium, calcium. <b>And thiamine, which is the one that is an emergency</b> — see the red flags."}
       ]}
     ]},

    {id:"causes", nav:"Causes", title:"Why is this person not eating enough?",
     sub:"Three axes. The social one is the one a blood test will never show.",
     blocks:[
       {b:"table", head:["Axis","Causes","What to do about it"], rows:[
         ["<b>Reduced intake — anorexia</b>","Depression — the commonest treatable cause of reduced appetite and weight loss in older people, and frequently undetected · anxiety · dementia · hypothyroidism · chronic pain · malignancy (cytokine-driven) · drugs (opioids, metformin, digoxin, SSRIs)","<b>PHQ-9 at every malnutrition assessment.</b> TFTs if symptoms or signs suggest thyroid disease. <b>Medication review — see the deprescribing card below</b>"],
         ["<b>Reduced intake — dysphagia</b>","Stroke · Parkinson's · MND · oesophageal pathology · head and neck cancer · dental problems","<b>SALT referral with videofluoroscopy and a modified-texture diet</b>"],
         ["<b>Reduced intake — oral and dental</b>","Ill-fitting dentures · oral candidiasis (present in roughly 30% of care home residents) · mucositis · xerostomia from anticholinergics and SSRIs","Ask at every review: \"Do you have any problems with your mouth, teeth or gums that make it difficult to eat?\" Community dental referral; inspect the mouth and dentures, and <b>treat confirmed oral candidiasis according to the current local antimicrobial guideline and product information</b>, checking drug interactions (including warfarin) and hepatic/renal considerations; saliva substitutes"],
         ["<b>Reduced intake — access to food</b>","Poverty and food insecurity · physical disability (cannot open packaging, cannot cook) · social isolation · bereavement","<b>Ask the question directly (below) and refer to social prescribing.</b> Occupational therapy where the limitation is physical"],
         ["<b>Increased losses — malabsorption</b>","Coeliac disease · Crohn's · chronic pancreatitis with steatorrhoea · short bowel · bile acid malabsorption","<b>Anti-tTG IgA with total IgA · faecal elastase only where pancreatic exocrine insufficiency is clinically suspected</b> · gastroenterology referral"],
         ["<b>Increased demand</b>","Cancer · sepsis · burns · major surgery · severe COPD (the work of breathing can consume many times normal calories) · heart failure · CKD · HIV","Treat the underlying disease — it is the most effective nutritional intervention"],
         ["<b>Social and psychological</b>","<b>Loneliness and isolation — eating alone reduces intake substantially</b> · food insecurity · eating disorders including ARFID · alcohol dependence, which supplies calories while depleting thiamine, folate, zinc and magnesium · poor care home mealtime experience","<b>Community lunch clubs, meal delivery, befriending.</b> <b>Alcohol: thiamine replacement is not optional</b> — see <a href='alcohol-problem-drinking.html'>alcohol</a>"]
       ]},
       {b:"say", html:"I want to ask you something I ask everyone, and please do not take it as a judgement. In the last twelve months, have you been worried whether your food would run out before you had money to buy more? … Thank you for telling me. That is more common than people think, and there is practical help — I can put you in touch with our social prescriber today, who can sort a food bank referral if you need one now, check you are getting every benefit you are entitled to, and look at meal delivery. I am also going to do some blood tests, because going without adequate food does measurable things to the body that we can put right."},
       {b:"why", html:"That question is worth asking verbatim because it is validated, brief, and it is the one thing on this page a blood test cannot substitute for. Food insecurity is associated with undernutrition and micronutrient deficiency, and — paradoxically — with obesity and poor metabolic health, because calorie-dense food is cheaper than nutritious food. A positive answer should trigger three things at once: social prescribing referral (community navigator, food bank, benefits check), a benefits entitlement assessment, and practical support such as meal delivery or Healthy Start vouchers. <b>The GP is often the first professional to identify it.</b>"}
     ]},

    {id:"investigate", nav:"Investigate", title:"Examination and investigations",
     blocks:[
       {b:"table", head:["Tier","Tests","Interpretation"], rows:[
         ["<b>Anthropometry</b>","Weight and height for BMI; ulna length or demi-span if unable to stand; mid-upper arm circumference","The measurement, not the impression — record it so the next review has a comparator"],
         ["<b>Routine or commonly appropriate bloods</b>","FBC · U&amp;Es/eGFR · LFTs where clinically indicated · CRP if inflammation or chronic disease is suspected · glucose or HbA1c if clinically indicated — alongside a medication review and assessment of intake","A proportionate starting point, not a universal panel"],
         ["<b>Refeeding-risk tests</b>","Potassium · phosphate · magnesium · calcium · glucose · renal function","Required before feeding when refeeding risk is clinically significant — not necessarily for every patient with mild weight loss"],
         ["<b>Albumin (if measured)</b>","<b>Albumin is a negative acute-phase reactant with a 20-day half-life</b>","<b>Albumin is not a standalone measure of nutritional status.</b> A low albumin commonly reflects inflammation, fluid status, liver disease, renal protein loss or other illness; it can coexist with malnutrition. Interpret it with the clinical assessment, weight trajectory, intake, CRP and functional status. Do not use albumin to diagnose or exclude malnutrition. Routine prealbumin testing is not necessary in primary care and is also affected by inflammation"],
         ["<b>Second-line, cause-directed</b>","B12 and folate if macrocytosis, neurological symptoms, restrictive diet, malabsorption, alcohol dependence or relevant medication · TFTs if symptoms or signs suggest thyroid disease · ferritin if iron deficiency is suspected · 25-OH vitamin D where risk factors are present · anti-tTG IgA with total IgA (coeliac) if malabsorption, chronic diarrhoea, iron deficiency or unexplained weight loss · faecal elastase only where pancreatic exocrine insufficiency is clinically suspected · PSA only where clinically indicated, not simply because a man is over 50 with weight loss · chest X-ray (lung cancer, TB) per NG12 criteria · serum protein electrophoresis/free light chains only where there are myeloma features, not as a routine weight-loss panel · zinc and selenium if specifically suspected · thiamine status in alcohol-related malnutrition","Directed by the history, not ordered as a panel"],
         ["<b>Functional assessment</b>","Hand grip strength · walking speed · ability to perform activities of daily living","These often improve before weight does, which makes them a useful early marker of a working plan. Record grip strength and walking speed only where staff are trained and the result will influence management"]
       ]}
     ]},

    {id:"treat", nav:"Step up", title:"Nutritional support — the four-step ladder",
     blocks:[
       {b:"table", head:["Step","What it is","Detail"], rows:[
         ["<b>Step 1 — dietary advice and food fortification</b>","<b>For MUST 1–2 with a functioning gut. Food first.</b> Increase the energy and protein density of the existing diet rather than the volume","Fortify: butter, cream, cheese, milk powder, olive oil into ordinary cooking. Frequent small meals, 6–8 times a day. High-protein snacks between meals. Full-fat dairy. Written advice, dietitian input for a personalised plan, and address the barriers (dental review, medication review, depression screening and treatment). <b>Reassess weight and MUST within 4–8 weeks — but do not delay ONS for an arbitrary period where there is significant malnutrition, rapid deterioration, inadequate intake or high clinical risk</b>"],
         ["<b>Step 2 — oral nutritional supplements (ONS)</b>","<b>Prescribed when fortification alone is insufficient</b>","Prescribe ONS only where the patient has a clinically appropriate malnutrition-related indication and the product meets the relevant ACBS criteria (these are product- and condition-specific) — check local ACBS and formulary requirements before prescribing. Document the indication, goals, expected duration, quantity, dietary advice and review date, and refer to a dietitian according to clinical complexity and local pathway. Typically 1–3 per day <b>as a supplement, not a meal replacement</b>. Review within about 4–6 weeks, or sooner if high risk, poor tolerance or rapid deterioration: adherence, intake from food, weight trend, function, symptoms and ongoing indication — then continue, modify or stop according to goals and response. Stop when adequate nutrition is being maintained from normal food, if the patient declines, or on an appropriate end-of-life decision"],
         ["<b>Step 3 — enteral (tube) feeding</b>","<b>When oral intake is unsafe or inadequate, the gut is functional and there is a realistic goal of benefit</b>","NG tube for short-term use (under 4–6 weeks) — post-stroke dysphagia, acute illness, post-surgical. Gastrostomy (PEG/RIG) for long-term neurological dysphagia — MND, stroke, Parkinson's — managed in the community by a nutrition nurse and dietitian. Jejunostomy post-gastrectomy or in delayed gastric emptying. Formulas and rates are dietitian-prescribed"],
         ["<b>Step 4 — parenteral nutrition</b>","<b>Only when the gut is non-functional or inaccessible</b>","Short bowel, high-output fistula, prolonged ileus, severe mucositis, multi-organ failure. <b>Specialist nutrition team only.</b> Risks: line infection, PN cholestasis with long-term use, metabolic complications"]
       ]},
       {b:"cards", items:[
         {tone:"amber", h:"⚠ ONS prescribing is a recognised quality problem", html:"ONS are for disease-related malnutrition, not for preference or convenience, and the primary-care bill is substantial. Before prescribing: score MUST, confirm the product meets the relevant ACBS criteria and the local formulary, document the indication, goals, quantity and expected duration, involve a dietitian according to clinical complexity and local pathway, and diarise the review. Prescribing ONS as snacks for a well-nourished patient is the pattern to avoid."},
         {tone:"red", h:"⛔ Tube feeding in severe dementia", html:"NICE NG97 advises not to routinely use enteral feeding in people with severe dementia unless there is a potentially reversible comorbidity. The evidence shows no improvement in survival, no prevention of aspiration pneumonia — it may increase it, because tube feeding does not protect against aspiration of oropharyngeal secretions — no reduction in pressure ulcers, and no gain in comfort or quality of life. Families often request it believing that \"not feeding\" is causing the death, when the dementia is causing the loss of appetite and swallow. Treat reversible contributors such as oral pain, constipation, infection, dysphagia or medication effects, and hold a multidisciplinary, capacity-aware, best-interests discussion, focusing on assisted oral or comfort feeding where tube feeding is unlikely to achieve meaningful benefit."},
         {tone:"green", h:"✓ Treat the disease — it is a nutritional intervention", html:"In cancer cachexia, assess reversible contributors, treat symptoms and discuss goals of care with oncology or palliative care; nutritional support should aim primarily to maintain comfort, function and quality of life, not to reverse advanced cachexia. In every disease-related malnutrition, treating the underlying disease matters. Symptom control counts too: nausea, pain and constipation all reduce intake, and all are treatable."},
         {tone:"blue", h:"📋 What to hand over", html:"Written fortification advice, the MUST score, the dietitian referral, the review date, and — where relevant — the social prescribing referral made on the same day. Verbal dietary advice without paper does not survive the walk home."}
       ]}
     ]},

    {id:"specific", nav:"By disease", title:"Disease-specific nutritional management",
     blocks:[
       {b:"table", head:["Condition","Management","Notes"], rows:[
         ["<b>Cancer cachexia</b>","<b>Assess reversible contributors, treat symptoms, address constipation, nausea and pain, and discuss goals of care with oncology or palliative care.</b> Nutritional support should aim primarily to maintain comfort, function and quality of life; it should not be framed as reversing advanced cachexia. Appetite-stimulating drugs are specialist/palliative decisions, not routine GP prescriptions","Involuntary weight loss over 5% with systemic inflammation and muscle wasting, driven by IL-6, TNF-α and IL-1 — so it cannot be fully reversed by feeding alone. Say that to families, kindly, early"],
         ["<b>COPD</b>","Assess weight loss, muscle mass, functional status and breathlessness-related eating difficulty. Consider dietitian referral, pulmonary rehabilitation and appropriately energy-dense ONS where indicated. A low BMI is prognostically relevant in COPD but is not a universal treatment target for every patient","Up to about 30% of severe COPD is malnourished: increased work of breathing, early satiety from hyperinflation compressing the stomach, systemic inflammation, depression. Avoid prescribing a restrictive low-carbohydrate diet routinely; dietary composition should be individualised, particularly in patients with chronic hypercapnia"],
         ["<b>Dementia</b>","Upright positioning, SALT-assessed modified texture, finger foods for apraxic patients, preferred foods, a warm and social mealtime. <b>Do not routinely use enteral feeding in severe dementia unless there is a potentially reversible comorbidity (NG97)</b>","Treat reversible contributors such as oral pain, constipation, infection, dysphagia or medication effects. Any feeding decision is individualised, multidisciplinary, capacity-aware and made in the person's best interests. See <a href='dementia.html'>dementia</a>"],
         ["<b>CKD</b>","<b>Individualise nutritional advice with a renal dietitian.</b> Balance protein-energy requirements against CKD stage, dialysis, potassium/phosphate status, frailty and sarcopenia. Do not apply a universal low-protein or 0.8 g/kg/day target without considering the clinical context","Phosphate and potassium advice follows blood results and renal dietitian assessment. See <a href='ckd.html'>CKD</a>"],
         ["<b>Eating disorders</b>","RCPsych MEED CR233 (2022) as a structured risk-assessment framework and NICE NG69 — no single BMI or weight threshold determines admission; adult eating disorder service; liaison psychiatry if medically unwell; CAMHS in young people","Weigh in consistent clothing, ECG for QTc, electrolytes and glucose"],
         ["<b>Alcohol-related malnutrition</b>","Thiamine before or alongside any glucose where feasible, never delaying emergency glucose; oral thiamine 100 mg TDS for prophylaxis, but urgent parenteral thiamine per local protocol if Wernicke is suspected; replace folate, zinc and magnesium; if refeeding, electrolytes daily initially, then three times weekly until stable","Alcohol supplies calories while depleting the very vitamins needed to metabolise them. See <a href='alcohol-problem-drinking.html'>alcohol</a>"],
         ["<b>Palliative / end-stage disease</b>","Goals-of-care discussion. Comfort feeding, preferred foods and a pleasant mealtime rather than nutritional targets","<b>Stopping ONS can be the right decision</b>. Corticosteroids for appetite are a specialist/palliative decision in selected patients — see <a href='palliative-corticosteroids.html'>palliative corticosteroids</a>"]
       ]}
     ]},

    {id:"practical", nav:"Practical", title:"What actually increases intake",
     sub:"The interventions patients notice, and the ones that need no prescription.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"🧈 Fortification, specifically", html:"Full-fat milk instead of skimmed · butter on vegetables, potatoes and toast · cheese into soups, sauces and mash · cream into porridge and soups · milk powder into milky foods (about 4 g protein per 2 tablespoons). High-protein snacks: full-fat yoghurt, nuts, cheese, boiled eggs, hummus."},
         {tone:"blue", h:"⏰ Frequency and timing", html:"Small meals every 2–3 hours are better tolerated than three large ones where there is anorexia, early satiety or dysphagia. Largest meal when appetite is best — often mid-morning rather than evening in older people. Protein-rich breakfast. Medication before rather than during meals, and limit drinks with meals — they take up stomach space."},
         {tone:"green", h:"🍽️ Company changes the amount eaten", html:"Eating alone reduces intake substantially compared with eating with others. Age UK lunch clubs, Royal Voluntary Service meal delivery, council-funded luncheon clubs, faith-community lunches. In care homes: protected mealtimes with adequate staffing for assisted feeding. At home: family meals, and involving the patient in preparation."},
         {tone:"amber", h:"💊 Depression with poor appetite or weight loss", html:"If a depressive disorder is diagnosed, select an antidepressant using standard depression guidance and shared decision-making. Mirtazapine may be considered when depression coexists with insomnia, poor appetite or weight loss, but <b>appetite stimulation is not in itself an indication</b>. Start cautiously in older or frail patients because of sedation, falls, cognitive effects and hyponatraemia risk."},
         {tone:"blue", h:"🦷 Mouth, teeth and dentures", html:"Check denture fit, look for candidiasis, assess for dry mouth and review anticholinergics, and refer for dental pain or caries. <b>One direct question at every review finds most of it.</b>"},
         {tone:"amber", h:"🗑️ Deprescribe what suppresses appetite", html:"Opioids (nausea, constipation, anorexia) · metformin (nausea, metallic taste) · digoxin · SSRIs · NSAIDs · anticholinergics (dry mouth, dysphagia). Use STOPPFrail or the Beers criteria — every drug removed may improve appetite, swallowing and GI function."},
         {tone:"green", h:"🏋️ Resistance exercise preserves the muscle you are feeding", html:"Chair-based resistance work 2–3 times a week prevents sarcopenia, preserves muscle during refeeding and improves appetite. Protein 20–30 g within 2 hours of exercise maximises muscle protein synthesis. Physiotherapy for sarcopenia, gait problems or fear of falling — restoring mobility restores independence in cooking and eating."},
         {tone:"blue", h:"🤝 Social prescribing, concretely", html:"Food bank via the Trussell Trust (referral required) · community fridges · Healthy Start vouchers for qualifying pregnant women and children under 4 · Meals on Wheels and the Royal Voluntary Service · Age UK · local authority adult social care. MUST 2 or more plus food insecurity means a dietitian referral according to the local pathway AND a social prescribing referral."}
       ]}
     ]},

    {id:"monitor", nav:"Follow up", title:"Monitoring, stopping, and care home governance",
     blocks:[
       {b:"table", head:["What","When"], rows:[
         ["<b>Weight</b>","<b>Weekly initially in high-risk or active treatment, then monthly</b>"],
         ["<b>MUST</b>","Rescored at every follow-up — it is the comparator that shows whether the plan works"],
         ["<b>Electrolytes (phosphate, potassium, magnesium)</b>","<b>High refeeding risk: baseline sodium, potassium, urea, creatinine, magnesium and phosphate; then potassium, phosphate and magnesium daily initially, three times weekly until stable, then weekly according to clinical risk</b> — more often if clinically unstable. Also monitor fluid balance, glucose and signs of oedema or cardiac/respiratory deterioration"],
         ["<b>Albumin, CRP and other bloods</b>","Not routinely. Monitor weight trend, dietary intake, ONS adherence, symptoms, hydration, function and the underlying disease; repeat CRP, albumin or other blood tests only when clinically indicated or when required to monitor a specific condition or nutrition-support complication"],
         ["<b>Functional markers</b>","<b>Grip strength, walking speed, ADLs — often improve before weight does</b>. Record grip strength and walking speed only where staff are trained and the result will influence management"],
         ["<b>Dietitian review</b>","<b>4–6 weeks after starting ONS or specific support</b>"],
         ["<b>ONS review and stopping</b>","Within about 4–6 weeks, or sooner if high risk, poor tolerance or rapid deterioration: assess adherence, intake from food, weight trend, function, symptoms and ongoing indication, then continue, modify or stop according to goals and response. Stop when adequate nutrition is being maintained from normal food, when acute illness has resolved with adequate intake, on patient preference, or on an appropriate end-of-life decision. Do not continue ONS indefinitely without a documented indication and review. No BMI threshold is a mandatory stopping rule — decide on weight trajectory, intake, function, disease, prognosis and patient goals"],
         ["<b>Record at each review</b>","Weight and intake · symptoms and function · adherence and tolerance · MUST or other screening result · ONS quantity and actual consumption · treatment goals · review date · stopping plan"],
         ["<b>Care home patients</b>","MUST on admission and when clinically indicated, at a frequency set by local policy, with the score in the notes, medication review for appetite-suppressing drugs, dental referral where indicated, and depression screening (Cornell Scale in dementia). Check at care home visits that nutritional monitoring is documented"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 Same day", html:"Suspected Wernicke encephalopathy (confusion in a malnourished patient) · severe electrolyte abnormalities, including severe hypophosphataemia · severe dehydration or haemodynamic instability · significant arrhythmia or ECG abnormality · acute confusion or delirium · feeding that cannot be safely managed in the community · MEED red or multiple amber findings. <b>A MUST score of 2 or more alone does not require same-day hospital assessment.</b>"},
         {tone:"amber", h:"🟠 Within 2 weeks", html:"MUST 2 or more — prompt nutritional care plan and dietitian referral according to the local pathway · unexplained weight loss with cancer not yet excluded · suspected coeliac disease with weight loss."},
         {tone:"blue", h:"💊 Refeeding advice to the patient", html:"\"We are going to build your intake up gradually rather than quickly, and we will check your blood salts closely at first — daily if your risk is high. Feeding too fast after a long period of eating little is genuinely risky, which is why we do it this way.\""},
         {tone:"green", h:"✓ What improvement looks like", html:"\"Strength and energy often come back before the weight does — being able to get up from a chair more easily, or walk further, is real progress even if the scales have not moved yet.\""}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Hospital — same day", html:"Suspected Wernicke encephalopathy (confusion, with or without ophthalmoplegia and ataxia) → urgent parenteral thiamine per local protocol · severe electrolyte abnormalities · severe dehydration or haemodynamic instability · significant arrhythmia or ECG abnormality · acute confusion or delirium · feeding that cannot be safely managed in the community · uraemic malnutrition with confusion · MEED red or multiple amber findings. A MUST score of 2 or more alone is not a same-day hospital trigger."},
         {tone:"purple", h:"Suspected cancer routes · NICE NG12", html:"Unexplained weight loss with no identified cause, and any red-flag symptom occurring with malnutrition (dysphagia, haemoptysis, haematuria, change in bowel habit, breast lump). Apply the age- and symptom-specific NG12 criteria: aged 60 and over with unexplained weight loss over 5% within 6 months → assess for additional symptoms, signs or findings, then offer urgent investigation, a suspected cancer pathway referral or a non-specific symptoms pathway referral (rec 1.13.2, amended April 2026); aged 40 and over with unexplained weight loss and abdominal pain → offer FIT to guide colorectal referral; aged 55 and over with weight loss plus dyspepsia, reflux or upper abdominal pain → suspected upper GI cancer pathway referral; aged 60 and over with weight loss plus diarrhoea, back pain, abdominal pain, nausea, vomiting, constipation or new-onset diabetes → consider urgent direct-access CT (or ultrasound if CT is unavailable) for pancreatic cancer; aged 40 and over with unexplained weight loss and respiratory symptoms → chest X-ray criteria depend on the number of symptoms and smoking history, not simply weight loss plus any respiratory symptom. NG12 does not mean every patient under 60 with isolated unexplained weight loss automatically needs a suspected cancer pathway referral — but clinical judgement and safety-netting remain essential."},
         {tone:"blue", h:"Dietitian — MUST 2 or more (local pathway)", html:"MUST 2 or more indicates high risk: start a documented nutritional care plan promptly and refer to a registered dietitian according to the local community/care-home pathway — in this practice, normally for every MUST 2 or more. Follow the local Greater Manchester nutrition and ONS prescribing pathway where available. Community dietitian by GP referral; care homes via community dietitian outreach plus SALT for dysphagia."},
         {tone:"green", h:"Social prescribing / community navigator", html:"Food insecurity — food bank referral and benefits check. Social isolation — community meals, befriending, day centres. Occupational therapy where cooking or eating is physically limited. Carer support."},
         {tone:"amber", h:"SALT", html:"<b>Dysphagia — videofluoroscopy and a modified-texture diet.</b> Do not start a texture-modified diet without assessment."},
         {tone:"amber", h:"Gastroenterology", html:"<b>Coeliac disease, IBD, chronic pancreatitis, suspected malabsorption.</b>"},
         {tone:"amber", h:"Eating disorder service / psychiatry", html:"Adult eating disorder service; liaison psychiatry if acutely medically unwell; CAMHS for young people. <b>RCPsych MEED CR233 (2022, replacing MARSIPAN) provides the medical risk framework; NICE NG69 — no single BMI or weight threshold determines admission.</b>"},
         {tone:"cream", h:"GP management", html:"Most of this is primary care: scoring MUST, assessing refeeding risk before feeding, finding the cause across all three axes, the food-first step-up, ONS where clinically indicated and ACBS criteria are met, with a review date, treating diagnosed depression using standard guidance, deprescribing what suppresses appetite, and the social prescribing referral. Related pages: <a href='iron-deficiency-anaemia.html'>iron deficiency</a> · <a href='../algorithms/vitamin-b12-deficiency.html'>B12 deficiency</a> · <a href='../algorithms/vitamin-d-deficiency.html'>vitamin D</a> · <a href='alcohol-problem-drinking.html'>alcohol</a> · <a href='dementia.html'>dementia</a> · <a href='ckd.html'>CKD</a>."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"An 81-year-old widower is brought by his daughter, who says he \"isn't eating\". He has lost <b>7 kg over 4 months</b>; BMI is <b>17.8</b>. He lives alone since his wife died 8 months ago, has <b>ill-fitting dentures</b>, takes <b>codeine for back pain</b>, and says food \"doesn't taste of anything and it's not worth cooking for one\". He denies low mood but admits he no longer goes out. Bloods are not yet done. The daughter asks whether he should be <b>started on build-up drinks</b>."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Scores MUST explicitly and states it (BMI 2 + weight loss 2 = 4, high risk); assesses refeeding risk BEFORE any feeding plan and checks phosphate, potassium and magnesium; screens for depression with PHQ-9 and recognises bereavement, isolation and \"not worth cooking for one\" as the likely dominant cause rather than accepting the denial of low mood; <b>examines the mouth and arranges dental review for the dentures</b>; <b>reviews the codeine as a contributor to anorexia and constipation</b>; <b>asks the food-insecurity question</b>; starts with food fortification and practical written advice rather than immediately prescribing ONS, and explains the ACBS criteria and dietitian route when the daughter asks; <b>starts a documented nutritional care plan and refers to a dietitian per the local pathway because MUST is 2 or more</b>, and to social prescribing for lunch clubs and befriending at the same time; <b>if depression is diagnosed, chooses an antidepressant using standard depression guidance and shared decision-making</b> — mirtazapine may be considered where insomnia and poor appetite coexist, started cautiously because of sedation, falls and hyponatraemia risk; excludes malignancy — unexplained weight loss over 5% needs an NG12 route; and <b>arranges weight and MUST review with a defined interval</b>."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>NICE CG32 — Nutrition support for adults: oral nutrition support, enteral tube feeding and parenteral nutrition<br><a href="https://www.nice.org.uk/guidance/cg32/chapter/Recommendations" rel="noopener">nice.org.uk/guidance/cg32/chapter/Recommendations</a><span class="rd"> — the indications for each step of the support ladder, the full refeeding-risk criteria (one major or two or more moderate), starting rates and daily-then-three-times-weekly monitoring, ONS review, screening at registration and on clinical concern, and low albumin as a poor marker of malnutrition</span></li>'+
         '<li><b>BAPEN — Malnutrition Universal Screening Tool (MUST)</b><br><a href="https://www.bapen.org.uk" rel="noopener">bapen.org.uk</a><span class="rd"> — the three-step scoring, the 0/1/≥2 action thresholds, and the ulna-length and demi-span tables for estimating height where the patient cannot stand</span></li>'+
         '<li><b>NICE NG97 — Dementia: assessment, management and support</b><br><a href="https://www.nice.org.uk/guidance/ng97" rel="noopener">nice.org.uk/guidance/ng97</a><span class="rd"> — do not routinely use enteral feeding in severe dementia unless there is a potentially reversible comorbidity; NICE resource: Enteral (tube) feeding for people living with severe dementia</span></li>'+
         '<li><b>Royal College of Psychiatrists CR233 — Medical emergencies in eating disorders (MEED): guidance on recognition and management (May 2022)</b><br><a href="https://www.rcpsych.ac.uk/improving-care/campaigning-for-better-mental-health-policy/college-reports/2022-college-reports/cr233" rel="noopener">rcpsych.ac.uk — CR233</a><span class="rd"> — replaced MARSIPAN (CR189) and Junior MARSIPAN; the traffic-light risk framework (one red or two or more amber parameters prompt urgent specialist medical assessment); it does not replace clinical judgement</span></li>'+
         '<li><b>NICE NG69 — Eating disorders: recognition and treatment</b><br><a href="https://www.nice.org.uk/guidance/ng69/chapter/Recommendations" rel="noopener">nice.org.uk/guidance/ng69</a><span class="rd"> — a single BMI or weight threshold should not determine admission</span></li>'+
         '<li><b>Alcohol care in acute hospitals — guidance (GOV.UK)</b><br><a href="https://www.gov.uk/guidance/clinical-guidelines-for-alcohol-treatment/16-alcohol-care-in-acute-hospitals" rel="noopener">gov.uk — alcohol care in acute hospitals</a><span class="rd"> — parenteral thiamine for suspected Wernicke encephalopathy and electrolyte monitoring daily initially, then three times weekly until stable</span></li>'+
         '<li>ACBS (Advisory Committee on Borderline Substances) criteria, as listed in the BNF borderline substances appendix<span class="rd"> — when oral nutritional supplements qualify for NHS prescription; criteria are product- and condition-specific, and local ACBS and formulary requirements must be checked before prescribing</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — the age- and symptom-specific unexplained-weight-loss routes: the 60-and-over non-specific route (rec 1.13.2), FIT for colorectal referral, upper GI, direct-access CT for pancreatic cancer, and chest X-ray criteria for lung cancer</span></li>'+
         '<li>Finucane TE et al — tube feeding in advanced dementia (systematic review, 1999; subsequent updates)<span class="rd"> — the evidence base underlying the NG97 recommendation</span></li>'+
         '<li><b>BNF and local formulary</b><span class="rd"> — thiamine dosing; verify all doses against the current BNF and local formulary before prescribing</span></li>'+
         '<li><b>Greater Manchester nutrition and ONS prescribing pathway (GMMMG)</b><span class="rd"> — local dietitian referral route, ONS formulary and ACBS requirements; use the current local version where available</span></li>'+
         '<li><b>Social resources (not clinical sources): Trussell Trust · Age UK · Healthy Start</b><br><a href="https://www.trusselltrust.org/get-help" rel="noopener">trusselltrust.org/get-help</a><span class="rd"> — the practical community resources referenced in the social prescribing card</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Malnutrition — NICE CG32, BAPEN MUST, NICE NG97, NICE NG69, RCPsych MEED (2022), ACBS criteria and NICE NG12 (updated April 2026). Score MUST on anyone with unintentional weight loss, BMI under 20 or poor appetite, and use ulna length or demi-span where the patient cannot be weighed. A score of 2 or more means high risk: a documented nutritional care plan and dietitian referral according to the local pathway. Use the full NICE refeeding-risk criteria, check electrolytes before feeding, monitor high-risk patients daily initially, and give thiamine before or alongside feeding without ever delaying emergency glucose. Food first and fortification before ONS; ONS need a clinical indication, the relevant ACBS criteria, dietitian input according to complexity and a review date within about 4–6 weeks. Albumin is not a standalone nutritional marker. Verify all doses against the BNF before prescribing."
});
