  quickSub:"The six that change outcomes. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Rapid, ascending or motor means admit today", html:"Symptoms developing over days to weeks, ascending numbness or weakness, loss of reflexes, bulbar or respiratory involvement → Guillain-Barré syndrome: same-day medical admission. A sensory level on the trunk, bilateral leg weakness, sphincter disturbance or upgoing plantars → spinal cord compression, not a peripheral neuropathy: emergency imaging. Asymmetrical or stepwise multi-nerve involvement (mononeuritis multiplex) → vasculitis: urgent referral."},
    {tone:"blue", h:"The length-dependent pattern is what makes it a polyneuropathy", html:"Symmetrical, distal, starting in the toes and feet and progressing proximally over months to years, with the longest nerves affected first — glove-and-stocking, feet before hands. Loss of vibration and joint position sense earliest, then pinprick and temperature; reduced or absent ankle reflexes. Any departure from this pattern — asymmetry, hands before feet, patchy sensory loss, prominent weakness, rapid onset — means a different diagnosis and a different urgency."},
    {tone:"amber", h:"Find the reversible causes first — most are found on one blood round", html:"Diabetes and impaired glucose tolerance · B12 deficiency · alcohol excess · hypothyroidism · drugs · a paraprotein · renal failure · coeliac disease. Diabetes accounts for roughly half of cases in the UK and alcohol for a substantial further share. A cause is found in most patients with a basic screen, and about a quarter remain idiopathic even after specialist assessment — which is a legitimate endpoint, not a failure."},
    {tone:"green", h:"Foot protection is the intervention that prevents amputation", html:"Numb feet do not hurt when injured, so ulceration is silent — and the neuropathic ulcer, not the numbness, is what costs the limb. Daily self-inspection (with a mirror if needed), well-fitting footwear, checking inside shoes before putting them on, never walking barefoot, no hot water bottles or radiator warming, and professional nail care. <b>In diabetes, annual foot review with risk stratification per NG19.</b> <b>This is the single highest-value thing on this page.</b>"},
    {tone:"blue", h:"CG173: switch, do not stack", html:"Offer a choice of amitriptyline, duloxetine, gabapentin or pregabalin as initial treatment. If it does not work or is not tolerated, SWITCH to one of the others — try each of the remaining three in turn rather than combining them. Tramadol only for acute rescue, never as long-term treatment; capsaicin cream for localised pain when oral options are unsuitable. Do not start other opioids, and note that gabapentinoids are Class C controlled drugs with real misuse and respiratory-depression risk."},
    {tone:"purple", h:"🟣 NG12 — the myeloma route runs straight through this", html:"Aged 60 or over with persistent bone pain, particularly back pain, or an unexplained fracture → very urgent FBC, calcium and plasma viscosity or ESR for myeloma; if the results suggest myeloma, very urgent serum and urine protein electrophoresis with Bence-Jones protein within 48 hours. Paraproteinaemic neuropathy is a recognised presentation of myeloma, MGUS, amyloidosis and Waldenström's — which is why serum protein electrophoresis belongs in the first-line screen of an unexplained neuropathy, not the second. Restated in <a href='#refer'>Refer</a>."}

    {id:"safety", nav:"Red flags", title:"Red flags — what is not a chronic polyneuropathy",
     blocks:[
       {b:"table", head:["Feature","Meaning","Action"], rows:[
         ["Onset over days to a few weeks, ascending numbness or weakness, reduced or absent reflexes","<b>Guillain-Barré syndrome</b> — progression can be rapid and respiratory failure is the cause of death","Same-day medical admission. Do not arrange outpatient nerve conduction studies. Ask about breathlessness, single-breath count, swallowing and a recent diarrhoeal or respiratory illness"],
         ["Bulbar symptoms, breathlessness, or difficulty swallowing with a neuropathy","<b>Impending respiratory or bulbar failure</b>","<b>999 / emergency admission</b>"],
         ["A sensory LEVEL on the trunk, bilateral leg weakness, bladder or bowel disturbance, upgoing plantars, brisk reflexes","Spinal cord compression or myelopathy — a central lesion, not a peripheral neuropathy","Emergency: urgent MRI spine and same-day referral. See <a href='tia-stroke.html'>the stroke protocol</a> for central mimics, and note that brisk reflexes point AWAY from peripheral neuropathy"],
         ["Asymmetrical, stepwise involvement of individual named nerves; systemic features; rash; weight loss; raised inflammatory markers","Mononeuritis multiplex — vasculitis, connective tissue disease, sarcoidosis","Urgent neurology and rheumatology referral; ANCA, ANA, ENA, complement, CRP, urine dip for blood and protein"],
         ["Aged 60 or over with persistent bone or back pain, or an unexplained fracture, alongside a neuropathy","<b>Myeloma</b>","NG12: very urgent FBC, calcium and plasma viscosity or ESR; if suggestive, very urgent serum and urine protein electrophoresis with Bence-Jones protein within 48 hours"],
         ["Rapidly progressive neuropathy with weight loss, a smoking history, or a known cancer","<b>Paraneoplastic neuropathy, or direct infiltration</b>","Urgent neurology referral; chest X-ray; investigate per the relevant NG12 route rather than labelling it idiopathic"],
         ["Painless foot ulcer, deformity, warm swollen foot, or a foot that has changed shape","Neuropathic ulceration, or Charcot neuroarthropathy — a limb-threatening emergency that is frequently mistaken for infection or gout","Same-day referral to the multidisciplinary diabetic foot service (NG19). Offloading is urgent; a delayed Charcot diagnosis deforms the foot permanently"],
         ["<b>Sensory ataxia, Romberg positive, marked proprioceptive loss</b>","Large-fibre or dorsal column pathology — B12 deficiency (subacute combined degeneration), copper deficiency, or a sensory ganglionopathy","Check B12 urgently and treat; falls risk is high. Do not wait for a level below the lab threshold if the clinical picture fits — treat and investigate"],
         ["<b>Young patient, high arches, hammer toes, positive family history</b>","<b>Hereditary neuropathy (Charcot-Marie-Tooth)</b>","<b>Neurology referral for genetic confirmation and genetic counselling</b>"]
       ]},
       {b:"warn", html:"<b>The single most useful discriminator is the time course.</b> Months to years, symmetrical, sensory, feet first = chronic polyneuropathy, investigate as an outpatient. Days to weeks, or any weakness, or any asymmetry = a different disease with a different urgency, and the outpatient nerve-conduction route is the wrong destination. The second most useful is the reflexes: brisk reflexes with upgoing plantars mean the lesion is central, and a patient sent for peripheral nerve studies with a cord lesion loses weeks."}
     ]},

    {id:"pattern", nav:"Pattern", title:"Characterising the neuropathy — the questions that narrow it",
     blocks:[
       {b:"table", head:["Axis","Options","What it tells you"], rows:[
         ["<b>Distribution</b>","Symmetrical and length-dependent (glove-and-stocking) · asymmetrical or multifocal · single nerve · patchy and non-anatomical","Length-dependent symmetry = metabolic, toxic, nutritional or idiopathic polyneuropathy. Asymmetry = vasculitis, compression, infiltration or radiculopathy"],
         ["<b>Fibre type</b>","Small fibre: burning, shooting, allodynia, temperature change, autonomic symptoms. Large fibre: numbness, tingling, loss of vibration and position sense, imbalance and sensory ataxia","Small-fibre neuropathy can have a NORMAL examination and normal nerve conduction studies — a normal NCS does not mean there is no neuropathy. Large-fibre loss drives falls"],
         ["<b>Sensory or also motor</b>","<b>Pure sensory · sensorimotor · predominantly motor</b>","Prominent motor involvement raises GBS, CIDP, lead toxicity, porphyria and hereditary neuropathy — and raises the urgency"],
         ["<b>Time course</b>","<b>Days to weeks · months · years</b>","The key urgency discriminator. Acute = admit; subacute = urgent referral; chronic = outpatient screen"],
         ["<b>Autonomic features</b>","Postural dizziness, early satiety and gastroparesis, erectile dysfunction, sweating change, bladder disturbance","Suggests diabetic, amyloid or hereditary autonomic involvement; postural hypotension is a major falls risk and is treatable"],
         ["<b>Examination essentials</b>","Vibration (128 Hz tuning fork) and joint position sense · pinprick and temperature · light touch with a 10 g monofilament · ankle and knee reflexes · plantars · power and wasting · gait and Romberg · foot inspection · pulses · postural blood pressure","The 10 g monofilament tests PROTECTIVE sensation and predicts ulcer risk — it is a foot-protection test rather than a diagnostic one, and both matter"]
       ]}
     ]},

    {id:"causes", nav:"Causes", title:"Causes — and the first-line screen that finds them",
     blocks:[
       {b:"table", head:["Cause","How it presents","Investigation and action"], rows:[
         ["<b>Diabetes and impaired glucose tolerance — about half of UK cases</b>","Classic distal symmetrical sensory neuropathy; may be painful. Can be present at diagnosis of type 2 diabetes, and occurs with prediabetes too","HbA1c; if normal and suspicion persists, consider an OGTT since impaired glucose tolerance alone causes neuropathy. Optimise glycaemic control — it slows progression, particularly in type 1. See <a href='type-2-diabetes.html'>type 2 diabetes</a>"],
         ["<b>Vitamin B12 deficiency</b>","Large-fibre loss, sensory ataxia, Romberg positive; may have macrocytosis, glossitis, cognitive change; subacute combined degeneration if severe","B12 and folate. Treat promptly — neurological damage becomes irreversible with delay, so treat on the clinical picture rather than waiting for a borderline level to fall further. Check for pernicious anaemia, metformin and PPI use, gastric surgery, vegan diet. See <a href='../algorithms/vitamin-b12-deficiency.html'>B12 deficiency</a>"],
         ["<b>Alcohol excess</b>","Painful small-fibre neuropathy, often with calf tenderness; frequently compounded by thiamine and other B-vitamin deficiency","AUDIT-C, LFTs, MCV. Abstinence plus thiamine and vitamin B compound strong; the neuropathy improves but slowly. See <a href='alcohol-problem-drinking.html'>alcohol</a>"],
         ["<b>Drugs</b>","<b>Onset relating to a new or cumulative drug exposure</b>","Review for: metronidazole, nitrofurantoin (long-term prophylaxis), isoniazid, amiodarone, phenytoin, chemotherapy (platinums, taxanes, vincristine), linezolid, dapsone, thalidomide, high-dose pyridoxine (vitamin B6 — toxic in excess), statins rarely. Long-term nitrofurantoin prophylaxis is an easily-missed and reversible cause"],
         ["<b>Paraprotein — myeloma, MGUS, amyloidosis, Waldenström's</b>","Progressive neuropathy, sometimes with bone pain, weight loss, renal impairment or carpal tunnel syndrome","Serum protein electrophoresis and immunoglobulins belong in the FIRST-line screen, not the second. See the NG12 route above and in <a href='#refer'>Refer</a>"],
         ["<b>Hypothyroidism</b>","Slowly progressive; may include carpal tunnel syndrome and delayed reflex relaxation","<b>TFTs; treat. See <a href='hypothyroidism.html'>hypothyroidism</a></b>"],
         ["<b>Chronic kidney disease</b>","<b>Uraemic neuropathy at advanced stages</b>","<b>U&amp;Es and eGFR</b>"],
         ["<b>Coeliac disease</b>","<b>Neuropathy can be the presenting feature, with or without gut symptoms</b>","<b>Coeliac serology on a gluten-containing diet. See <a href='coeliac-disease.html'>coeliac disease</a></b>"],
         ["<b>Infection and inflammation</b>","HIV, hepatitis B and C, Lyme disease, leprosy; sarcoidosis; Sjögren's, SLE, rheumatoid, vasculitis","Test where there is risk or systemic features — not as a blanket screen"],
         ["<b>Hereditary</b>","<b>Childhood or young-adult onset, pes cavus, hammer toes, family history</b>","<b>Neurology referral for genetic testing and counselling</b>"],
         ["<b>Idiopathic — around a quarter, even after specialist workup</b>","Chronic, slowly progressive, sensory-predominant, often in older patients","A legitimate diagnosis once the screen is negative. Say so explicitly: repeated re-investigation of a stable idiopathic neuropathy is not benign — it sustains anxiety and finds incidental abnormalities"]
       ]},
       {b:"dl", rows:[
         ["<b>First-line screen — send these together</b>","HbA1c (or fasting glucose) · vitamin B12 and folate · FBC · U&amp;Es and eGFR · LFTs · TFTs · ESR or plasma viscosity · serum protein electrophoresis and immunoglobulins · coeliac serology. Plus a structured alcohol history and a full drug review"],
         ["<b>Second-line, guided by the picture</b>","OGTT (impaired glucose tolerance) · ANA, ENA, ANCA, complement, rheumatoid factor · HIV, hepatitis B and C serology · Lyme serology where exposure fits · chest X-ray · ACE (sarcoid) · copper and caeruloplasmin · urinary Bence-Jones protein · CRP"],
         ["<b>Nerve conduction studies</b>","<b>Arranged by neurology rather than from primary care in most areas.</b> <b>Normal studies do NOT exclude small-fibre neuropathy</b> — they test large fibres only, which is a common source of false reassurance"]
       ]}
     ]},

    {id:"feet", nav:"Feet", title:"Foot protection — the highest-value part of this consultation",
     sub:"A numb foot does not report injury. The ulcer, not the numbness, is what costs the limb.",
     blocks:[
       {b:"table", head:["Element","What to do"], rows:[
         ["<b>Assess protective sensation</b>","10 g monofilament at the standard sites, plus vibration with a 128 Hz fork. Loss of protective sensation = high ulcer risk, whatever the pain score"],
         ["<b>Inspect and examine</b>","Look between the toes and at the heels · callus, fissures, deformity, clawing, prominent metatarsal heads · nail condition · skin temperature and colour · pedal pulses, and consider ABPI if absent · footwear, inside and out"],
         ["<b>The self-care advice that prevents ulcers</b>","Check feet daily, using a mirror or a family member for the soles · never walk barefoot, indoors or out · check inside shoes for stones, ridges and foreign objects before putting them on · well-fitting shoes with a deep toe box, bought late in the day · test bath water with the elbow or a thermometer, never the foot · NO hot water bottles, radiators or foot spas · moisturise but not between the toes · never cut corns or calluses or use corn plasters — see a podiatrist · report ANY new break in the skin, blister, colour change or swelling the same day"],
         ["<b>Risk-stratify and refer</b>","NG19: low risk → annual review; moderate or high risk (loss of sensation, previous ulcer, deformity, peripheral arterial disease, callus, end-stage renal disease) → podiatry and the foot-protection service, with review every 3–6 months or more often"],
         ["<b>Act same-day on an active problem</b>","Any new ulcer, spreading infection, discolouration, or a warm swollen foot → same-day referral to the multidisciplinary diabetic foot service. A warm swollen foot in a neuropathic patient is Charcot neuroarthropathy until proven otherwise, not gout or cellulitis"],
         ["<b>Falls and safety</b>","Large-fibre sensory loss impairs balance: assess falls risk, review sedating drugs (including any neuropathic agent), check postural blood pressure, and consider physiotherapy, home hazard assessment and a FRAX score"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"red", h:"⛔ Never do these on a numb foot", html:"No hot water bottles, electric blankets, radiators or foot spas — painless burns are a classic and devastating injury. No corn plasters, no self-cutting of corns or calluses, and never walking barefoot. These specific prohibitions matter more than general advice to \"look after your feet\"."},
         {tone:"green", h:"✓ What to say", html:"\"Because your feet cannot feel properly, an injury will not hurt — so you have to LOOK instead of relying on pain. Check them every day, including the soles with a mirror, and feel inside your shoes before you put them on. If you find any break in the skin, ring us that day, not the following week.\""}
       ]}
     ]},

    {id:"drugs", nav:"Drugs", title:"Treating neuropathic pain — the CG173 ladder",
     sub:"Not everyone needs a drug. Numbness without pain does not, and the drugs all sedate.",
     blocks:[
       {b:"table", head:["Step","Drug and dose","Notes"], rows:[
         ["<b>First-line — a choice of four</b>","Amitriptyline 10 mg nocte, titrating to 25–75 mg · duloxetine 30 mg OD for 2 weeks then 60 mg · gabapentin 300 mg OD titrating to 300–900 mg TDS (lower and slower in the elderly or renal impairment) · pregabalin 25–75 mg BD titrating to 150–300 mg BD","CG173 offers these as a choice — there is no required order. Pick on comorbidity: duloxetine if depression or diabetes, amitriptyline if sleep is the problem, a gabapentinoid if the first two are contraindicated"],
         ["<b>If it fails or is not tolerated — SWITCH</b>","<b>Try one of the other three; then the third; then the fourth</b>","Do NOT stack them. Sequential monotherapy is what CG173 recommends, and combination therapy is a specialist decision"],
         ["<b>Titration and trial length</b>","Titrate every 1–2 weeks to effect or to the maximum tolerated dose, and give an adequate trial at that dose before judging","Most \"failures\" are under-titrated: 10 mg of amitriptyline abandoned at two weeks is not a failed trial. Aim for a 30–50% pain reduction and a functional gain, not abolition"],
         ["<b>Localised pain, or oral drugs unsuitable</b>","Capsaicin 0.075% cream QDS; high-strength 8% patch is specialist-initiated","Warn about burning on first application or it is abandoned. Useful in the frail elderly where systemic drugs are hazardous"],
         ["<b>Acute rescue only</b>","<b>Tramadol, short course</b>","CG173: tramadol only for acute rescue therapy, NOT long term. Do not start morphine, oxycodone or other strong opioids for neuropathic pain in primary care"],
         ["<b>Stopping and switching safely</b>","Taper rather than stopping abruptly: amitriptyline, duloxetine (discontinuation syndrome — taper over at least 4 weeks) and gabapentinoids all have withdrawal effects","Gabapentin and pregabalin are Class C controlled drugs: assess misuse risk, and note the MHRA warning on additive respiratory depression with opioids"],
         ["<b>Non-drug measures, offered rather than mentioned</b>","Exercise and physiotherapy · TENS (may help here, unlike in chronic primary pain) · footwear and orthoses · sleep · psychological support and pain self-management","Where pain has become chronic and disabling, see <a href='chronic-pain.html'>chronic pain</a> and <a href='neuropathic-pain.html'>neuropathic pain</a> — but treat the neuropathy's cause first"],
         ["<b>Cautions worth remembering</b>","Amitriptyline: anticholinergic burden, falls and confusion in the frail, QTc. Duloxetine: avoid if eGFR under 30; BP rise. Pregabalin and gabapentin: sedation, weight gain, oedema, dose reduction in renal impairment. All: driving impairment","Warn about driving and record it — sedating neuropathic agents impair driving, particularly on initiation and dose change"]
       ]},
       {b:"why", html:"<b>Two things about this ladder are routinely got wrong.</b> First, the four first-line drugs are a CHOICE and not a sequence — so there is no need to fail amitriptyline before trying duloxetine, and the right first drug is the one whose side-effect profile suits the patient's comorbidities. Second, CG173 says switch rather than combine, yet stacked prescriptions accumulate: a patient arrives on amitriptyline, gabapentin and tramadol together, each under-dosed, each sedating, none properly assessed. Unpicking that — titrating one agent properly and withdrawing the others — usually improves both the pain and the patient's alertness, and it is the commonest useful intervention at review."}
     ]},

    {id:"monitor", nav:"Follow up", title:"Review and safety-netting",
     blocks:[
       {b:"table", head:["When","What to check"], rows:[
         ["<b>2 weeks after starting or changing a drug</b>","Tolerance, sedation, falls, and whether titration is proceeding. Potassium and renal function are not needed, but check BP on duloxetine"],
         ["<b>4–6 weeks</b>","Efficacy at an adequate dose — aim for 30–50% pain reduction and a stated functional gain (sleep, walking distance, standing at work). If inadequate at maximum tolerated dose, SWITCH rather than add"],
         ["<b>3 months</b>","Review the cause: has the reversible factor been addressed — B12 replaced, alcohol reduced, glycaemia improved, culprit drug stopped? Recheck B12 response and HbA1c. Confirm the foot-care advice is being followed and podiatry is in place"],
         ["<b>Annually</b>","Foot examination and risk stratification (NG19) · progression or change in pattern, which should prompt re-investigation · falls and fracture risk · drug review with a deprescribing attempt where pain has improved · driving advice"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 Same day", html:"\"Contact us the same day if any weakness develops, if the numbness starts climbing up your legs, if you become unsteady quickly, or if you find any break in the skin, blister or colour change on your feet.\""},
         {tone:"amber", h:"🟠 A warm swollen foot is urgent", html:"\"If a foot becomes warm, red and swollen — even without pain, and even if it looks like gout — that needs assessing the same day.\" Charcot neuroarthropathy is missed exactly this way."},
         {tone:"blue", h:"💊 Give the drug a fair trial", html:"\"This is started low and built up slowly, so the first couple of weeks will not tell us much. We will judge it at about six weeks at the right dose — and if it does not suit you, we swap to a different one rather than adding another.\""},
         {tone:"green", h:"✓ Honest about the goal", html:"\"We are aiming to take the edge off and get your sleep and walking back — not to abolish it completely. And where we find a cause we can treat, the numbness may stabilise rather than reverse, which is still worth achieving.\""}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Emergency — same day", html:"Suspected Guillain-Barré (rapid or ascending course, weakness, areflexia, bulbar or respiratory features) · suspected spinal cord compression (sensory level, sphincter disturbance, upgoing plantars) · active foot ulcer with spreading infection or systemic upset · suspected Charcot neuroarthropathy."},
         {tone:"purple", h:"2WW · NICE NG12", html:"Myeloma: aged 60 or over with persistent bone pain, particularly back pain, or an unexplained fracture → very urgent FBC, calcium and plasma viscosity or ESR; if suggestive, very urgent serum and urine protein electrophoresis with Bence-Jones protein within 48 hours. Paraproteinaemic neuropathy is a recognised presentation of myeloma, MGUS, amyloidosis and Waldenström's, which is why serum protein electrophoresis sits in the first-line screen. Where a paraneoplastic neuropathy is suspected, investigate the underlying primary along its own NG12 route (for example chest X-ray for lung cancer) rather than labelling the neuropathy idiopathic."},
         {tone:"amber", h:"Urgent neurology", html:"Subacute progression over weeks · prominent or progressive motor involvement · asymmetrical or multifocal pattern (mononeuritis multiplex) · suspected CIDP · suspected vasculitic neuropathy · rapidly progressive neuropathy with weight loss."},
         {tone:"blue", h:"Routine neurology", html:"Diagnostic uncertainty after a negative first-line screen · need for nerve conduction studies · suspected hereditary neuropathy for genetic testing and counselling · suspected small-fibre neuropathy needing specialist assessment."},
         {tone:"green", h:"Podiatry and the foot-protection service", html:"Any loss of protective sensation, callus, deformity, previous ulcer or peripheral arterial disease — per NG19 risk stratification. The referral that prevents amputations, and the one most often not made in non-diabetic neuropathy."},
         {tone:"blue", h:"Haematology, rheumatology, diabetes", html:"Paraprotein identified → haematology. Suspected connective tissue disease or vasculitis → rheumatology. Painful diabetic neuropathy with poor control or foot risk → diabetes team."},
         {tone:"cream", h:"GP management", html:"Primary care owns: the pattern and time-course triage, the first-line screen that finds the reversible causes, B12 and alcohol and drug causes acted upon, the foot protection that prevents ulceration, the CG173 drug ladder with proper titration and switching rather than stacking, and the honest naming of idiopathic neuropathy once the screen is clear. Related pages: <a href='neuropathic-pain.html'>neuropathic pain</a> · <a href='../algorithms/vitamin-b12-deficiency.html'>B12 deficiency</a> · <a href='type-2-diabetes.html'>type 2 diabetes</a> · <a href='alcohol-problem-drinking.html'>alcohol</a> · <a href='chronic-pain.html'>chronic pain</a>."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 64-year-old man describes <b>18 months of numbness and burning in both feet</b>, now reaching mid-calf, worse at night and disturbing his sleep. He has type 2 diabetes on <b>metformin for 9 years</b>, drinks <b>about 40 units a week</b>, and has been on <b>long-term nitrofurantoin prophylaxis</b> for recurrent UTIs. He has recently developed <b>lower back pain</b> he attributes to gardening. On examination he cannot feel the 10 g monofilament at three sites, has absent ankle reflexes, and there is a <b>thick callus under the right first metatarsal head</b> that he has been shaving himself with a razor blade. He asks for \"something stronger\" for the burning."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Confirms the length-dependent chronic pattern and checks for red flags — no weakness, no sensory level, reflexes absent rather than brisk; identifies THREE contributing causes rather than stopping at diabetes — alcohol at 40 units, and long-term nitrofurantoin as a recognised reversible cause, which is the finding most candidates miss; sends the full first-line screen including B12 (relevant on long-term metformin) and serum protein electrophoresis; takes the back pain seriously at 64 and applies the NG12 myeloma route — FBC, calcium, plasma viscosity or ESR; recognises the callus and self-shaving as a high-risk foot needing same-day-ish podiatry, and gives the specific prohibitions (no self-cutting, no barefoot walking, no hot water bottles, check inside shoes); risk-stratifies per NG19 rather than deferring to the annual diabetic review; offers duloxetine or amitriptyline with proper titration, explains the 4–6 week judgement point, and states that if it fails he will SWITCH rather than add; <b>declines to escalate to an opioid</b>; <b>addresses the alcohol constructively and offers thiamine</b>; reviews the nitrofurantoin with the recurrent-UTI plan rather than simply stopping it; and <b>gives driving advice for the sedating drug</b>."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>NICE CG173 — Neuropathic pain in adults: pharmacological management in non-specialist settings<br><a href="https://www.nice.org.uk/guidance/cg173" rel="noopener">nice.org.uk/guidance/cg173</a><span class="rd"> — amitriptyline, duloxetine, gabapentin and pregabalin offered as a CHOICE; switching rather than combining; tramadol for acute rescue only; capsaicin for localised pain; and the recommendation against starting other opioids</span></li>'+
         '<li><b>NICE NG19 — Diabetic foot problems: prevention and management</b><br><a href="https://www.nice.org.uk/guidance/ng19" rel="noopener">nice.org.uk/guidance/ng19</a><span class="rd"> — annual foot assessment and risk stratification, the foot-protection service, the same-day referral criteria, and Charcot neuroarthropathy</span></li>'+
         '<li>NICE CG173 (neuropathic pain) · NG239 (vitamin B12 deficiency) · NG19 (diabetic foot)<br><a href="https://www.nice.org.uk/guidance/cg173" rel="noopener">nice.org.uk/guidance/cg173</a><span class="rd"> — the primary-care investigation set, the drug causes of neuropathy, and the urgency of treating B12 deficiency before neurological damage becomes irreversible</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (May 2025)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — myeloma at 60 and over with persistent bone pain or unexplained fracture: very urgent FBC, calcium and plasma viscosity or ESR, then very urgent protein electrophoresis and Bence-Jones protein within 48 hours</span></li>'+
         '<li><b>NICE NG28 / NG17 — Type 2 and type 1 diabetes in adults</b><span class="rd"> — glycaemic management and its effect on neuropathy progression</span></li>'+
         '<li><b>BNF · MHRA Drug Safety Update</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — all doses quoted; gabapentin and pregabalin as Class C controlled drugs (April 2019) and the additive respiratory-depression warning with opioids; duloxetine discontinuation and renal limits; amitriptyline anticholinergic and QTc cautions; long-term nitrofurantoin peripheral neuropathy warning</span></li>'+
         '<li><b>Guillain-Barré Syndrome Support Group · Charcot-Marie-Tooth UK</b><span class="rd"> — patient support for the acute and hereditary causes referenced</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Sensory neuropathy — NICE CG173, NG19, NG28, NICE and NG12. Time course and symmetry decide the urgency: months to years and symmetrical is an outpatient screen; days to weeks, any weakness, any asymmetry, or brisk reflexes is a different and more urgent disease. Screen for the reversible causes in one round — glucose, B12, thyroid, renal, LFTs, ESR, coeliac and a paraprotein — and take a proper alcohol and drug history. Protect the feet: that is what prevents amputation. For pain, CG173 offers four first-line drugs as a choice — titrate one properly and switch rather than stack. Verify all doses against the BNF before prescribing."
});
