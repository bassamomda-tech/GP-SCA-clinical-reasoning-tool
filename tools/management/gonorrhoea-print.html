<script>
MG.render({
  icon:"🦠",
  title:"Gonorrhoea",
  eyebrow:"Protocol · culture first, one injection, then trace",
  stemTitle:"Gonorrhoea — take a culture before treatment whenever possible, give ceftriaxone 1 g, and treat resistance as a live threat",
  stemSub:"Suspected or confirmed gonorrhoea requires urgent sexual-health involvement. Take NAAT and culture from all relevant sites before antibiotics where possible, but do not delay treatment or admission in PID, pregnancy, ocular infection, disseminated infection or severe symptomatic disease. Ceftriaxone 1 g IM is the current empirical first-line treatment for uncomplicated anogenital and pharyngeal infection. Sexual health should coordinate susceptibility testing, partner notification and test of cure. Ceftriaxone-resistant cases in England more than doubled between 2024 and 2025 (provisional UKHSA surveillance, to be updated from the latest report at each review). Built on the BASHH 2025 gonorrhoea guideline, UKHSA surveillance and the Green Book gonorrhoea chapter.",
  guideline:"BASHH Neisseria gonorrhoeae 2025 · UKHSA STI data 2025 and ceftriaxone-resistance reports 2026 · Green Book gonorrhoea chapter (June 2025) · MHRA DSU January 2024",
  meta:[
    {t:"BASHH gonorrhoea 2025"},
    {t:"UKHSA resistance surveillance 2026"},
    {t:"Green Book: gonorrhoea (4CMenB) 2025"},
    {t:"MHRA fluoroquinolones Jan 2024"},
    {t:"BASHH PID 2019 · epididymo-orchitis 2020"},
    {t:"No NG12 criterion applies", tone:"tw"}
  ],
  quickSub:"Six cards that carry the whole consultation. Every figure traces to a source listed under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"Some presentations cannot wait", html:"A <b>hot swollen joint, pustular rash or tenosynovitis</b> with fever in a sexually active person may be disseminated gonococcal infection — same-day hospital assessment. <b>Hyperacute purulent conjunctivitis</b> in an adult or a newborn can destroy the cornea within days — same-day ophthalmology. Pelvic pain with tenderness is PID — treat today."},
    {tone:"blue", h:"Culture before treatment", html:"A positive NAAT tells you it is there; only a <b>culture</b> tells you what will kill it. BASHH 2025 advises culture swabs from the relevant sites taken <b>at the same time as the NAAT</b> in anyone clinically suspected, and confirming infection before treating where possible — but do not delay treatment or admission when there is significant clinical suspicion or a complication. A positive NAAT should be urgently communicated to or managed with sexual health, because culture, susceptibility testing, partner notification and test-of-cure planning are required."},
    {tone:"green", h:"One first-line drug", html:"<b>Ceftriaxone 1 g intramuscularly as a single dose</b> is the sole first-line empirical treatment in BASHH 2025 — no routine azithromycin alongside. Ciprofloxacin is <b>no longer first line</b>, even when the isolate is susceptible: BASHH 2025 allows <b>ciprofloxacin 500 mg orally once</b> only when susceptibility is known before treatment and the sexual-health clinician considers it appropriate, in line with the MHRA January 2024 fluoroquinolone restriction."},
    {tone:"amber", h:"Resistance is rising in England", html:"UKHSA recorded <b>29 ceftriaxone-resistant cases in 2025</b>, more than double the 13 in 2024, and <b>88 in total since the first case in 2015</b> (to 31 August 2026), 25 of them extensively drug-resistant. These surveillance figures are provisional and must be updated from the latest UKHSA report at each review. Many are linked to travel to or from the Asia-Pacific region, but resistance can occur without a travel history. Ask about travel and partners abroad."},
    {tone:"blue", h:"Test of cure: not for everyone now", html:"For anogenital infection treated with ceftriaxone 1 g when the strain is known to be susceptible, a routine test of cure is <b>no longer needed</b>. It is still required for <b>pharyngeal infection, unknown susceptibility, any other treatment, pregnancy, and persistent symptoms</b> — by NAAT at least 2 weeks after treatment."},
    {tone:"green", h:"There is now a vaccine", html:"Since <b>1 August 2025</b>, sexual health services offer <b>two doses of 4CMenB</b> to GBMSM at high risk of gonorrhoea. Observational data suggest approximately <b>30–40% protection</b> — an estimate, not individual-level vaccine efficacy. It is not a general gonorrhoea vaccine. Signpost eligible patients — the GP does not give it for this indication."}
  ],
  pathwaySub:"Five moves. The red step is where sight, joints and fertility are lost.",
  pathway:[
    {title:"Suspect it", html:"Urethral discharge and dysuria in men; vaginal discharge, dysuria, intermenstrual bleeding or pelvic pain in women — though many women have no symptoms. Rectal and pharyngeal infection are usually silent. Ask about partners, sites of sex, and travel."},
    {title:"Screen for the dangerous presentations", html:"Septic arthritis, tenosynovitis, pustular rash or fever → disseminated infection, same-day hospital assessment. Purulent conjunctivitis → same-day eye assessment. Pelvic tenderness → PID. Acute scrotal pain → exclude torsion. Newborn with sticky eyes → same day.", alert:true},
    {title:"Sample every site at risk", html:"Dual chlamydia–gonorrhoea NAAT: vulvovaginal swab or first-void urine, plus a pharyngeal NAAT in all confirmed urogenital gonorrhoea and all contacts; other extragenital sites according to sexual history, sites exposed and symptoms. Offer HIV and syphilis serology. Where you suspect gonorrhoea clinically, arrange culture at the same time — in practice, via sexual health."},
    {title:"Send for treatment", html:"A positive gonorrhoea NAAT → urgently communicated to or managed with sexual health for culture, ceftriaxone 1 g IM, partner notification and a decision on test of cure. If referral would cause delay, a trained GP may take appropriate cultures and give ceftriaxone under the local sexual-health/microbiology protocol. Do not give an oral antibiotic 'to cover it' while waiting."},
    {title:"Close the loop", html:"No oral, vaginal or anal sex until 7 days after the patient and all relevant partners have finished treatment and symptoms have resolved; condoms are not a substitute. Confirm the clinic attendance. Offer the 4CMenB vaccine route to eligible patients, and condoms and regular testing to all."}
  ],
  sections:[

    {id:"redflags", nav:"Red flags", title:"Red flags and complications", sub:"Uncomplicated gonorrhoea is a sexual health referral. These presentations are emergencies or near-emergencies in their own right.",
     blocks:[
       {b:"warn", html:"Never dismiss a hot joint or a purulent red eye in a young, sexually active adult without taking a sexual history. Disseminated and ocular gonorrhoea are rare but move fast, and the treatment is parenteral."},
       {b:"cards", items:[
         {tone:"red", h:"Disseminated gonococcal infection", html:"Fever with migratory arthralgia, tenosynovitis of the wrist or hand, scattered pustular or haemorrhagic skin lesions, or a septic joint. Mucosal sites are often symptom-free. Suspected disseminated gonococcal infection requires <b>same-day hospital assessment</b>, blood cultures, cultures from symptomatic joints or skin lesions, mucosal NAAT/culture and intravenous or parenteral treatment under specialist/infectious-disease guidance. Manage a hot swollen joint as <b>septic arthritis</b> while awaiting results — a sexual-health diagnosis does not replace standard septic-joint management. BASHH 2025 updated its recommendations on diagnosing disseminated infection.", src:"BASHH gonorrhoea 2025"},
         {tone:"red", h:"Gonococcal conjunctivitis", html:"Hyperacute, copious purulent discharge with lid swelling. It can progress to <b>blinding keratoconjunctivitis</b>, so prompt diagnosis matters. Suspected gonococcal conjunctivitis needs <b>same-day ophthalmology</b>, conjunctival sampling for culture and NAAT where available, <b>systemic ceftriaxone under specialist direction</b>, copious saline irrigation if appropriate, and topical treatment according to ophthalmology advice. Topical treatment alone is not adequate.", src:"BASHH gonorrhoea 2025"},
         {tone:"red", h:"Ophthalmia neonatorum", html:"Purulent conjunctivitis in a newborn may be gonococcal or chlamydial. Gonococcal disease threatens the cornea within days. Arrange <b>same-day</b> paediatric/ophthalmic assessment and systemic treatment for the infant. Notify the maternity/paediatric and sexual-health teams, and assess and treat the mother and relevant partner(s) after appropriate sampling.", src:"College of Optometrists CMG — ophthalmia neonatorum · BASHH gonorrhoea 2025"},
         {tone:"red", h:"Pelvic inflammatory disease", html:"Lower abdominal pain with cervical motion or adnexal tenderness. Consider ectopic pregnancy in anyone with pelvic pain who could be pregnant; perform a pregnancy test and, if positive, refer immediately (same day) to the early pregnancy assessment service or out-of-hours gynaecology, or to A&amp;E if haemodynamically unstable (NICE NG126). Treat empirically the same day: <b>ceftriaxone 1 g IM once, plus doxycycline 100 mg twice daily and metronidazole 400 mg twice daily for 14 days</b>. BASHH advises against omitting ceftriaxone, and gonococcal PID particularly needs it. Oral treatment is not sufficient with systemic illness or sepsis, tubo-ovarian abscess, pregnancy, inability to tolerate oral medication, severe pain or diagnostic uncertainty, or failure to improve within 48–72 hours. See the <a href=\"https://www.bashh.org/_userfiles/pages/files/resources/pidupdate2019.pdf\" rel=\"noopener\">BASHH PID update</a>.", src:"BASHH PID guideline 2018 with 2019 update"},
         {tone:"red", h:"Acute scrotal pain", html:"Sudden severe unilateral testicular pain, a high-riding testis, abnormal lie, nausea/vomiting or diagnostic uncertainty requires <b>immediate emergency/urological assessment</b>. Do not delay referral for STI testing. Subacute unilateral pain with urethral discharge suggests sexually acquired epididymo-orchitis: first-void urine NAAT, ceftriaxone plus doxycycline per the BASHH regimen and local sexual-health pathway, and partner notification.", src:"BASHH epididymo-orchitis guideline 2020"},
         {tone:"amber", h:"Pregnancy", html:"Gonorrhoea in pregnancy is treated with <b>intramuscular ceftriaxone monotherapy</b>, directly observed where possible — but this should not delay urgent treatment. Quinolones, tetracyclines and gentamicin are avoided. A test of cure is required. Discuss with the maternity team and assess the risk of neonatal infection at delivery.", src:"BASHH gonorrhoea 2025"}
       ]}
     ]},

    {id:"resistance", nav:"Resistance", title:"Why resistance drives every decision", sub:"Gonorrhoea has become resistant to each antibiotic class used against it in turn. Cephalosporins are the last class still used as empirical monotherapy.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"The England numbers", html:"<b>29 ceftriaxone-resistant cases were reported in 2025</b> against 13 in 2024. Since the first case in 2015, the total reported in England had reached <b>88</b> by 31 August 2026, of which <b>25 were extensively drug-resistant</b> — resistant to both first- and second-line options. A further 21 cases had been reported in 2026 by that date. These figures are provisional and must be updated from the latest UKHSA report at each review.", src:"UKHSA — STI quarterly report, England, provisional data, September 2026"},
         {tone:"amber", h:"Where it comes from", html:"Most ceftriaxone-resistant cases are linked to <b>travel to or from the Asia-Pacific region</b>, where resistance is common, or to sexual contact with someone who has travelled. Resistance can also occur without a travel history, so travel must not be the sole trigger for suspicion or testing. Take a travel and partner history in every case.", src:"UKHSA ceftriaxone-resistant gonorrhoea reports 2025–2026"},
         {tone:"blue", h:"What the GP can do about it", html:"Get the culture taken before treatment wherever possible, without delaying urgent therapy. Do not treat on a NAAT alone with an oral antibiotic. Make sure the patient actually reaches sexual health, and that partners are treated. Those steps are what let resistant strains be found and contained.", src:"BASHH gonorrhoea 2025"},
         {tone:"blue", h:"The national picture", html:"There were <b>63,943 gonorrhoea diagnoses</b> in England in 2025 — 19.1% of new STI diagnoses — down from 71,802 in 2024. Rates remain disproportionately high in GBMSM, people aged 15 to 24 and some Black and Mixed ethnic groups.", src:"UKHSA — STIs and chlamydia screening in England: 2025 report (June 2026)"}
       ]},
       {b:"why", label:"Why a falling case count does not mean the problem is shrinking", html:"Total diagnoses fell between 2024 and 2025, but resistant cases more than doubled. A small number of treatment-resistant infections can seed onward transmission through sexual networks, and a strain resistant to ceftriaxone is usually resistant to most alternatives too. Surveillance depends on cultures being taken, which is why culture before treatment matters wherever it is possible without delaying urgent therapy."}
     ]},

    {id:"diagnose", nav:"Samples", title:"Which sample, which test", sub:"NAAT finds it. Culture characterises it. You usually need both.",
     blocks:[
       {b:"table", head:["Site","NAAT sample","Culture"], rows:[
         ["Vagina / cervix","Vulvovaginal swab — self- or clinician-taken","Endocervical swab in sexual health"],
         ["Penile urethra","First-void urine","Urethral swab; microscopy in sexual health for men with discharge"],
         ["Rectum","Rectal swab — guided by sexual exposure, symptoms and BASHH guidance, or routinely in groups for whom it is recommended","Rectal swab"],
         ["Pharynx","Pharyngeal swab — all confirmed urogenital gonorrhoea and all contacts (BASHH); otherwise by sexual history","Pharyngeal swab"],
         ["Eye / joint / blood","—","Conjunctival swab; joint aspirate and blood cultures in suspected dissemination"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"When to test the throat", html:"Take a <b>pharyngeal NAAT in all patients with confirmed urogenital gonorrhoea and all sexual contacts of gonorrhoea</b> (BASHH 2025). Otherwise, take extragenital samples according to the sexual history, sites exposed and symptoms — this is not a requirement for every STI screen. Pharyngeal infection is usually silent, harder to eradicate and a reservoir for resistance.", src:"BASHH gonorrhoea 2025"},
         {tone:"blue", h:"Culture timing", html:"Culture swabs should be taken <b>at the same time as the NAAT</b> from anyone suspected clinically, and before any antibiotic. A NAAT-positive person without culture should have culture taken before treatment where possible, without delaying urgent therapy. Transport culture specimens promptly — delayed plating reduces sensitivity.", src:"BASHH gonorrhoea 2025"},
         {tone:"blue", h:"Full screen", html:"Test for chlamydia on the same dual NAAT, and offer HIV and syphilis serology. Offer hepatitis B testing and vaccination where indicated, hepatitis C testing according to risk, and HIV PrEP assessment where appropriate.", src:"BASHH gonorrhoea 2025 — associated infections"},
         {tone:"amber", h:"Chlamydia co-infection", html:"Co-infection is common. Dual therapy is no longer given routinely. Treat confirmed chlamydia according to the current BASHH chlamydia guideline: <b>doxycycline</b> is first line for non-pregnant adults, but alternative treatment is required in pregnancy and may be needed in selected breastfeeding patients. Do not delay chlamydia treatment while test-of-cure arrangements for gonorrhoea are made.", src:"BASHH gonorrhoea 2025 · BASHH chlamydia 2026"}
       ]}
     ]},

    {id:"treat", nav:"Treatment", title:"Treatment", sub:"Sexual health services usually give it. You need to know what it is, so you can explain it and avoid undermining it.",
     blocks:[
       {b:"ladder", steps:[
         {step:"First line", when:"empirical or susceptibility unknown", tone:"green", title:"Ceftriaxone 1 g IM, single dose", html:"The only first-line empirical regimen in BASHH 2025, for anogenital and pharyngeal infection. The earlier practice of adding azithromycin has been dropped. Third-generation cephalosporins have limited cross-reactivity with penicillin allergy, but seek specialist advice where there has been anaphylaxis or severe immediate hypersensitivity to a beta-lactam. Do not assume every penicillin-allergy label can be ignored."},
         {step:"Known ciprofloxacin-susceptible", when:"sensitivities available", fromLabel:"if culture or genotype shows susceptibility", tone:"cream", title:"Ciprofloxacin 500 mg orally, single dose — not first line", html:"Effective when phenotypic or genotypic testing <b>before treatment</b> shows susceptibility, but BASHH 2025 no longer recommends it first line because of the MHRA restriction: it may be used only when susceptibility is known before treatment and the sexual-health clinician considers it appropriate, for example when ceftriaxone is unsuitable. Respect the MHRA fluoroquinolone restrictions and avoid it in pregnancy and after a previous serious quinolone reaction."},
         {step:"Ceftriaxone not possible", when:"allergy, failure or resistance", fromLabel:"specialist decision", tone:"amber", title:"Specialist alternative guided by sensitivities", html:"Alternatives are chosen by the sexual health service from the culture result. Spectinomycin is no longer available in the UK. Suspected treatment failure or a resistant isolate is managed with UKHSA and the reference laboratory."},
         {step:"Always", when:"every case", fromLabel:"alongside any regimen", tone:"cream", title:"Partners, abstinence and the right follow-up", html:"Partner notification at diagnosis. No oral, vaginal or anal sex until 7 days after the patient and all relevant partners have completed treatment and symptoms have resolved; condoms are not a substitute. Test of cure where indicated."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"Fluoroquinolone restrictions", html:"Since <b>January 2024</b>, systemic fluoroquinolones should only be used when other recommended antibiotics have failed, will not work because of resistance, or are unsafe. Warn about tendon, musculoskeletal and neuropsychiatric reactions, and take care over 60, with corticosteroids, renal impairment and after transplant.", src:"MHRA Drug Safety Update, January 2024 · BASHH gonorrhoea 2025"},
         {tone:"amber", h:"Treating in the practice", html:"Refer confirmed or suspected gonorrhoea urgently to sexual health wherever possible. If this would cause delay, a trained GP may take appropriate cultures and administer ceftriaxone under the local sexual-health/microbiology protocol, with a clear plan for partner notification and test of cure. Do not give an oral antibiotic 'to cover it' while waiting — it may fail and select resistance.", src:"BASHH gonorrhoea 2025"}
       ]}
     ]},

    {id:"testofcure", nav:"Test of cure", title:"Test of cure — who still needs one", sub:"This changed in 2025. The old rule of a test of cure for everyone no longer applies.",
     blocks:[
       {b:"table", head:["Situation","Test of cure?"], rows:[
         ["Anogenital infection, ceftriaxone 1 g given, isolate known to be susceptible","<b>Not routinely needed</b> — no treatment failures have been reported with ceftriaxone for ceftriaxone-susceptible genital infection"],
         ["Pharyngeal infection","<b>Yes</b>"],
         ["Susceptibility not known","<b>Yes</b>"],
         ["Treated with anything other than ceftriaxone","<b>Yes</b>"],
         ["Pregnant","<b>Yes</b>"],
         ["Persistent symptoms or signs","<b>Yes</b> — culture (preferred when symptomatic) taken before re-treatment"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Timing", html:"A NAAT test of cure should be done <b>at least 2 weeks after treatment</b>. Earlier NAATs may detect residual nucleic acid from killed organisms and give a false 'failure'. Culture is preferred when symptomatic and should be taken before re-treatment where possible.", src:"BASHH gonorrhoea 2025"},
         {tone:"blue", h:"A positive test of cure", html:"A positive NAAT at 2 weeks does not automatically prove treatment failure. If symptoms or signs persist at test of cure, take culture before re-treatment. If an asymptomatic NAAT is positive, consider residual nucleic acid or reinfection; sexual health should repeat testing (consider repeat NAAT about 1 week later) and obtain culture where possible, and report a suspected failure to UKHSA.", src:"BASHH gonorrhoea 2025 · UKHSA"}
       ]},
       {b:"say", html:"“The injection is very effective. Because this infection is becoming resistant to antibiotics, the clinic will grow the bug to check which drugs work, and depending on the result they may ask you back for a repeat swab in a couple of weeks.”"}
     ]},

    {id:"partners", nav:"Partners", title:"Partner notification and abstinence", sub:"Gonorrhoea is concentrated in sexual networks. Partner notification is how the network is treated.",
     blocks:[
       {b:"timeline", items:[
         {n:"1", when:"At diagnosis", title:"Start the conversation", html:"Explain why partners matter and that sexual health health advisers can contact them anonymously. Partner notification should be pursued for everyone with gonorrhoea. The look-back periods below are sexual-health partner-notification guidance; complex cases need trained health advisers."},
         {n:"2", when:"Symptomatic penile urethral infection", title:"Look back 2 weeks", html:"Notify all partners since, and in the <b>2 weeks before</b>, symptom onset — or the last partner if that was longer ago."},
         {n:"3", when:"Any other site, or no symptoms", title:"Look back 3 months", html:"Notify all partners in the <b>preceding 3 months</b>."},
         {n:"4", when:"Contacts", title:"Assess and test", html:"All contacts should be assessed and tested at every exposed site, including the pharynx. Sexual-health clinicians will decide whether epidemiological treatment is needed, according to symptoms, timing of exposure, test results and risk of loss to follow-up; it is not automatic for every contact."},
         {n:"5", when:"Abstinence", title:"Seven days after everyone is treated", html:"No oral, vaginal or anal sex until <b>7 days after</b> the patient and all relevant partner(s) have completed treatment, and symptoms have resolved. Condoms are not a substitute for this abstinence period."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"cream", h:"Travel and overseas partners", html:"Ask specifically about sex abroad or with partners who have travelled, particularly to the Asia-Pacific region. Tell the clinic — it changes their threshold for test of cure and for alerting UKHSA.", src:"UKHSA ceftriaxone-resistant gonorrhoea reports 2025–2026"},
         {tone:"cream", h:"If the patient will not tell a partner", html:"Offer provider notification through the sexual health service. If fear of a partner is the reason, treat that as a domestic abuse or safeguarding disclosure.", src:"BASHH gonorrhoea 2025 · BASHH partner notification statement 2012"}
       ]}
     ]},

    {id:"prevention", nav:"Prevention", title:"Prevention: the 4CMenB programme, doxyPEP and condoms", sub:"For the first time there is a vaccine route for gonorrhoea. It is delivered by sexual health services, but GPs are asked about it.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"Who is offered 4CMenB", html:"From <b>1 August 2025</b> in England: gay, bisexual and other men who have sex with men at high risk — a <b>bacterial STI in the previous 12 months</b> and/or <b>five or more partners in the previous 3 months</b>. Clinicians may use discretion for others at similar risk, such as sex workers having condomless sex. The targeted programme is delivered through specialist sexual-health services; check eligibility and local delivery arrangements against the current Green Book chapter.", src:"Green Book — gonorrhoea chapter (UKHSA, June 2025)"},
         {tone:"green", h:"How it is given", html:"<b>Two doses</b> of 4CMenB (Bexsero), the second at least <b>4 weeks</b> after the first, with no maximum interval. Offered opportunistically in specialist sexual health services, ideally at the visit where an STI is managed.", src:"Green Book — gonorrhoea chapter (UKHSA, June 2025)"},
         {tone:"blue", h:"How well it works", html:"Observational studies in people vaccinated against meningococcal B disease suggest about <b>30–40% protection</b> against gonorrhoea — an approximate estimate from observational data, not individual-level vaccine efficacy. It is not a general gonorrhoea vaccine and does not replace condoms, testing or partner notification. JCVI advised the targeted programme in November 2023.", src:"Green Book — gonorrhoea chapter (June 2025) · JCVI advice November 2023"},
         {tone:"blue", h:"DoxyPEP", html:"BASHH recommends doxycycline post-exposure prophylaxis — <b>200 mg within 72 hours</b>, ideally within 24, of condomless sex — for GBMSM and trans women at elevated risk, to prevent <b>syphilis</b>. Protection against gonorrhoea is limited, and it is not a gonorrhoea treatment. Take 200 mg as soon as possible, ideally within 24 hours and within 72 hours; <b>do not exceed 200 mg in 24 hours</b>. Discuss photosensitivity, gastrointestinal effects and oesophageal irritation; consider pregnancy, interactions and antimicrobial-resistance concerns. DoxyPEP does not remove the need for regular STI screening, HIV prevention and vaccination. See the <a href=\"https://doi.org/10.1177/09564624251352053\" rel=\"noopener\">BASHH doxyPEP guideline</a>.", src:"BASHH doxyPEP guideline 2025"},
         {tone:"green", h:"Condoms and regular testing", html:"Condoms for anal and vaginal sex reduce transmission. Anyone with ongoing risk should test regularly, including throat and rectal sites where relevant, and be offered HIV PrEP where appropriate.", src:"BASHH gonorrhoea 2025 — health promotion"},
         {tone:"blue", h:"Early signs of impact", html:"UKHSA now reports gonorrhoea diagnoses separately for GBMSM to track the effect of doxyPEP and 4CMenB, both introduced in summer 2025. UKHSA surveillance showed a fall in reported diagnoses in GBMSM in 2025; the contribution of doxyPEP, 4CMenB, behavioural change and surveillance effects remains uncertain.", src:"UKHSA — STIs and chlamydia screening in England: 2025 report"}
       ]}
     ]},

    {id:"young", nav:"Under-16s", title:"Young people and safeguarding", sub:"Gonorrhoea in a child or young person always prompts the safeguarding question.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"Under 13", html:"A child under 13 cannot consent to sexual activity in law. Gonorrhoea at this age requires a safeguarding referral to children's social care and involvement of the practice safeguarding lead, following local safeguarding procedures. Arrange urgent specialist sexual-health/paediatric assessment, and do not delay medical treatment while safeguarding arrangements are made. Consider sexual abuse, exploitation, trafficking and household transmission.", src:"Working Together to Safeguard Children 2026 (DfE)"},
         {tone:"amber", h:"13 to 15", html:"Assess competence to consent to STI testing and treatment (Gillick), provide confidential care where legally and clinically appropriate, and undertake a structured safeguarding assessment. Explore age and relationship of partner(s), coercion, exploitation, violence and substance use. Seek specialist safeguarding advice where concerns arise, and share information with safeguarding services when there is risk of significant harm. Fraser criteria apply to contraceptive advice and treatment, not to STI care generally.", src:"Working Together to Safeguard Children 2026 · Gillick (House of Lords 1985)"}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer", sub:"Every confirmed gonorrhoea is urgently communicated to or managed with sexual health. The question is how fast, and whether something else needs to happen first.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Admit or same day", html:"Suspected <b>disseminated gonococcal infection</b> (septic arthritis, tenosynovitis, pustular rash, fever); <b>purulent conjunctivitis</b> in an adult or newborn; <b>PID</b> with systemic illness, pregnancy or possible abscess; <b>acute scrotal pain</b> with torsion not excluded; suspected <b>ectopic pregnancy</b>.", src:"BASHH gonorrhoea 2025 · BASHH PID 2019 · BASHH epididymo-orchitis 2020 · College of Optometrists CMG"},
         {tone:"red", h:"Safeguarding, same day", html:"Any child under 13 with gonorrhoea, or a young person at risk of sexual exploitation.", src:"Working Together to Safeguard Children 2026 (DfE)"},
         {tone:"amber", h:"Sexual health — within days", html:"<b>Every positive gonorrhoea NAAT</b>, and every patient with urethral discharge or a clinical picture of gonorrhoea: culture, ceftriaxone, partner notification and a test-of-cure decision. Flag recent travel or overseas partners.", src:"BASHH gonorrhoea 2025"},
         {tone:"amber", h:"Suspected treatment failure", html:"Persistent symptoms or a positive test of cure after ceftriaxone: back to sexual health for culture. The service reports suspected ceftriaxone failure to UKHSA.", src:"BASHH gonorrhoea 2025 · UKHSA"},
         {tone:"cream", h:"Pregnancy", html:"Share the diagnosis and treatment with the maternity team, and make sure the test of cure is recorded before delivery.", src:"BASHH gonorrhoea 2025"}
       ]},
       {b:"p", html:"No NG12 suspected-cancer criterion maps to this presentation. Gonorrhoea is not a notifiable disease for clinicians in England; laboratory reporting and resistance surveillance are handled through UKHSA."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 28-year-old man has had three days of urethral discharge and dysuria after a holiday in South-East Asia. He asks for 'a course of antibiotics today' because he is seeing his girlfriend at the weekend and does not want to go to a clinic.", src:"Practice scenario based on BASHH gonorrhoea 2025"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Takes a <b>sexual and travel history</b> including sites of sex; checks for <b>testicular pain, joint or skin symptoms</b>; explains why an oral antibiotic today is the wrong answer — <b>culture first</b>, then <b>ceftriaxone 1 g IM</b>, because of <b>rising resistance linked to Asia-Pacific travel</b>; arranges <b>same-week sexual health</b>, sending a first-void urine NAAT if that helps; advises <b>no sex until 7 days after both are treated</b>; handles telling his girlfriend with honesty and offers <b>provider notification</b>; offers <b>HIV and syphilis testing</b>; and explains a likely <b>test of cure</b> because susceptibility is unknown.", src:"BASHH gonorrhoea 2025 · UKHSA resistance reports 2026"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Every recommendation on this page traces to one of these primary sources. Links to the latest BASHH, UKHSA and Green Book guidance, and local sexual-health guidance, should be checked at every review.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>BASHH — UK national guideline for the management of infection with <i>Neisseria gonorrhoeae</i>, 2025</b> (Fifer et al., International Journal of STD and AIDS, 2025)<br><a href="https://doi.org/10.1177/09564624251345195" rel="noopener">doi.org/10.1177/09564624251345195</a><span class="rd"> — ceftriaxone 1 g IM as sole first-line empirical treatment; ciprofloxacin 500 mg single dose no longer first line but may be used for known-susceptible infection where clinically appropriate; culture taken with the NAAT; pharyngeal testing for all cases and contacts; routine test of cure no longer needed for susceptible anogenital infection treated with ceftriaxone, but still needed for pharyngeal infection, unknown susceptibility, other regimens, pregnancy and persistent symptoms; NAAT test of cure at least 2 weeks after treatment; partner-notification look-back of 2 weeks (symptomatic urethral) or 3 months; abstinence until 7 days after completion of treatment; pregnancy, conjunctivitis and disseminated infection</span></li>'+
         '<li><b>UKHSA — Sexually transmitted infections quarterly report, England: provisional data, September 2026</b><br><a href="https://www.gov.uk/government/publications/sti-quarterly-surveillance-reports-provisional-data/sexually-transmitted-infections-quarterly-report-england-provisional-data-september-2026" rel="noopener">gov.uk — STI quarterly report, September 2026</a><span class="rd"> — 88 ceftriaxone-resistant cases since 2015, to 31 August 2026 (25 XDR); 21 in 2026 to date; 29 in 2025 against 13 in 2024; association with Asia-Pacific travel</span></li>'+
         '<li><b>UKHSA — Sexually transmitted infections and screening for chlamydia in England: 2025 report (June 2026)</b><br><a href="https://www.gov.uk/government/statistics/sexually-transmitted-infections-stis-annual-data-tables/sexually-transmitted-infections-and-screening-for-chlamydia-in-england-2025-report" rel="noopener">gov.uk — STI annual data 2025</a><span class="rd"> — 63,943 gonorrhoea diagnoses in 2025 (19.1% of new STI diagnoses); 71,802 in 2024; GBMSM-stratified reporting after doxyPEP and 4CMenB</span></li>'+
         '<li><b>UKHSA — Immunisation against infectious disease (Green Book): gonorrhoea chapter (June 2025)</b><br><a href="https://assets.publishing.service.gov.uk/media/684ff21577c424182b0c4e66/Green_book_chapter_gonorrhoea_16June2025.pdf" rel="noopener">gov.uk — Green Book gonorrhoea chapter (16 June 2025)</a><span class="rd"> — 4CMenB programme from 1 August 2025; eligibility of GBMSM with a bacterial STI in 12 months and/or 5 or more partners in 3 months; clinical discretion for others at similar risk; two doses at least 4 weeks apart; 30–40% protection. Follows JCVI advice of November 2023</span></li>'+
         '<li><b>MHRA Drug Safety Update — Fluoroquinolone antibiotics: must now only be prescribed when other commonly recommended antibiotics are inappropriate (January 2024)</b><br><a href="https://www.gov.uk/drug-safety-update/fluoroquinolone-antibiotics-must-now-only-be-prescribed-when-other-commonly-recommended-antibiotics-are-inappropriate" rel="noopener">gov.uk — Drug Safety Update</a><span class="rd"> — restriction applying to ciprofloxacin</span></li>'+
         '<li><b>BASHH — UK national guideline for the use of doxycycline post-exposure prophylaxis (2025)</b><br><a href="https://doi.org/10.1177/09564624251352053" rel="noopener">doi.org/10.1177/09564624251352053</a><span class="rd"> — doxyPEP for syphilis prevention in GBMSM and trans women at elevated risk</span></li>'+
         '<li><b>BASHH — UK national guideline for the management of pelvic inflammatory disease (2018, 2019 update)</b><br><a href="https://www.bashh.org/_userfiles/pages/files/resources/pidupdate2019.pdf" rel="noopener">bashh.org — PID 2019 update</a><span class="rd"> — ceftriaxone 1 g IM plus doxycycline and metronidazole for 14 days</span></li>'+
         '<li><b>BASHH — UK national guideline for the management of epididymo-orchitis (2020)</b><br><a href="https://www.bashh.org/_userfiles/pages/files/resources/eo2020.pdf" rel="noopener">bashh.org — epididymo-orchitis 2020</a><span class="rd"> — ceftriaxone plus doxycycline for sexually acquired epididymo-orchitis</span></li>'+
         '<li><b>BASHH — UK national guideline for the management of <i>Chlamydia trachomatis</i>, 2026</b><br><a href="https://www.bashh.org/_userfiles/pages/files/bashh_chlamydia_guideline_july_2026.pdf" rel="noopener">bashh.org — chlamydia guideline (July 2026)</a><span class="rd"> — treatment of chlamydia co-infection with doxycycline</span></li>'+
         '<li><b>BASHH — Statement on partner notification for sexually transmissible infections (2012)</b><span class="rd"> — provider and patient referral</span></li>'+
         '<li><b>College of Optometrists — Clinical Management Guideline: ophthalmia neonatorum</b><br><a href="https://www.college-optometrists.org/clinical-guidance/clinical-management-guidelines/ophthalmianeonatorum" rel="noopener">college-optometrists.org — ophthalmia neonatorum</a></li>'+
         '<li><b>Department for Education — Working Together to Safeguard Children (2026)</b><br><a href="https://www.gov.uk/government/publications/working-together-to-safeguard-children--2" rel="noopener">gov.uk — Working Together</a><span class="rd"> — statutory safeguarding guidance, replacing the 2023 edition</span></li>'+
         '<li><b>Gillick v West Norfolk and Wisbech AHA (House of Lords, 1985)</b><span class="rd"> — competence to consent; Fraser criteria relate to contraceptive advice only</span></li>'+
         '<li><b>BNF — ceftriaxone, ciprofloxacin</b><br><a href="https://bnf.nice.org.uk/drugs/ceftriaxone/" rel="noopener">bnf.nice.org.uk — ceftriaxone</a><span class="rd"> — cautions and administration</span></li>'+
         '</ul></div>'}
     ]}
  ],
