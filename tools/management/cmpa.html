MG.render({
  icon:"\u{1F37C}",
  title:"Cow's milk protein allergy \u2014 the complete guide",

  stemTitle:"CMPA — classify from the history, prove it with elimination AND reintroduction, and never leave a child milk-free without review",
  stemSub:"One page for the whole condition: exclude anaphylaxis, FPIES and faltering growth; separate IgE from non-IgE using timing within the full allergy-focused history; diagnose non-IgE by a 2–6-week elimination and planned reintroduction rather than by tests; prescribe eHF first and AAF for the right reasons; protect nutrition and growth with dietetic input wherever possible; and plan reintroduction — a home milk ladder only for suitable non-IgE disease.",
  guideline:"NICE CG116 · BSACI (2014) · iMAP / MAP (primary-care resource) · Resuscitation Council UK",
  reviewed:"9 September 2026",
  nextReview:"9 March 2027",
  meta:[
    {t:"iMAP / BSACI \u2014 Cow's milk allergy in children"},
    {t:"iMAP / MAP milk allergy in primary care"},
    {t:"BSACI \u00b7 EAACI"},
    {t:"BNF for Children for all doses"},
    {t:"No home milk ladder for IgE, mixed or FPIES", tone:"tw"},
    {t:"v2.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#severe"><b>Exclude first</b><small>Anaphylaxis \u00b7 FPIES \u00b7 growth</small></a><a href="#confirm"><b>Classify</b><small>IgE \u00b7 non-IgE \u00b7 mixed</small></a><a href="#workup"><b>Prove it</b><small>Eliminate then reintroduce</small></a><a href="#ladder"><b>Feed</b><small>eHF \u00b7 AAF \u00b7 milk ladder</small></a><a href="#refer"><b>Refer</b><small>Allergy \u00b7 dietitian</small></a></div>',
  quickSub:"If you read nothing else on this page, read these six cards. Sources are listed under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"\u26a0 Two shock presentations, not one", html:"<b>Anaphylaxis</b> — airway swelling, wheeze or stridor, hypotension or collapse after milk → IM adrenaline immediately per current Resuscitation Council UK guidance (100–150 micrograms &lt;6 months, 150 micrograms 6 months–6 years), call 999, repeat after 5 minutes if no improvement and a second dose is available; do not delay transfer for antihistamines or steroids. And <b>FPIES</b> — <b>repetitive, profuse vomiting typically 1–4 hours after milk</b> with pallor, lethargy, hypotonia, diarrhoea or possible hypotension → <b>emergency assessment</b>. FPIES is non-IgE, routine allergy tests do not diagnose it, and it is often misdiagnosed as sepsis or gastroenteritis."},
    {tone:"amber", h:"Timing helps classify — read it with the whole history", html:"Immediate urticaria, angioedema, wheeze, vomiting or collapse <b>within minutes to 2 hours</b> suggests IgE-mediated allergy. Delayed gastrointestinal, cutaneous or systemic symptoms developing <b>over several hours or longer</b> suggest non-IgE-mediated disease. Both patterns may occur in the same child — <b>manage mixed disease as IgE, the higher risk</b>. Timing should be interpreted with the full clinical history rather than used as an absolute cut-off."},
    {tone:"blue", h:"Non-IgE is diagnosed by a trial, not a test", html:"Routine IgE tests are <b>not useful for diagnosing isolated non-IgE-mediated disease</b> — consider specialist advice if there are mixed or atypical features. Use a complete cow's-milk-protein elimination for 2–6 weeks followed by planned reintroduction: improvement during elimination alone does not confirm CMPA, because infant symptoms often fluctuate; <b>recurrence on reintroduction provides the confirmation</b>. <b>IgG \u201cfood intolerance\u201d tests have no evidence base</b> and are recommended against by NICE CG116, BSACI and EAACI."},
    {tone:"green", h:"eHF first, AAF for a reason", html:"For formula-fed infants with suspected mild-to-moderate non-IgE CMPA, use an extensively hydrolysed formula (eHF) as the initial trial, per local formulary and ACBS requirements. Consider an amino-acid formula (AAF — no intact protein) with paediatric/dietetic advice for severe reactions, FPIES, significant faltering growth, multiple food allergy, severe eczema with suspected food allergy, or failure/intolerance of an adequate eHF trial. If eHF is refused for taste, give transition advice first rather than escalating. <b>Not soya under 6 months</b>, and <b>\u201clactose-free\u201d formula does not treat CMPA</b>."},
    {tone:"amber", h:"Commonly suspected, frequently over-diagnosed", html:"Cow's milk allergy is commonly suspected but frequently overdiagnosed because reflux, colic, eczema and abnormal stools are common in infants. Diagnosis requires a compatible history and, for non-IgE disease, improvement on elimination followed by recurrence on reintroduction — which is exactly why the reintroduction limb is not optional. <b>Eczema alone does not diagnose CMPA.</b>"},
    {tone:"green", h:"Get them back on milk", html:"Most children with CMPA eventually develop tolerance; the time course depends on the phenotype. For suitable children with mild-to-moderate non-IgE CMPA, controlled symptoms and satisfactory growth, planned reintroduction may begin when clinically appropriate, <b>often around 9–12 months</b>, using the local milk-ladder protocol. <b>No home milk ladder for IgE-mediated allergy, FPIES or suspected mixed disease</b> unless the allergy service advises it. <b>Do not leave a child on a milk-free diet by inertia.</b>"}
  ],
  pathwaySub:"The whole consultation in five moves. The red step is where infants come to harm.",
  pathway:[
    {title:"Exclude the emergencies", html:"Anaphylaxis; repetitive vomiting with pallor, lethargy, hypotonia or circulatory compromise after food (possible FPIES); severe dehydration; inability to feed or persistent vomiting; respiratory distress; suspected severe malnutrition or clinically unwell faltering growth; haematemesis, melaena or significant ongoing rectal bleeding; acute abdomen or suspected intussusception; infected eczema with systemic upset.", alert:true},
    {title:"Classify by timing", html:"Take an allergy-focused history: immediate (minutes to 2 hours), delayed (hours or longer), or both — timing read with the whole history. Record the food and amount, raw/baked/fermented exposure, reproducibility, feeding method and formula, maternal diet, previous reactions and exclusions, atopy and family history; a symptom diary can help. Name the subtype: proctocolitis, FPIES, mixed."},
    {title:"Prove it", html:"IgE-mediated: targeted skin prick and/or specific IgE through a competent clinician or allergy service — no broad panels. Non-IgE: eliminate 2–6 weeks, then <b>reintroduce to confirm</b>. No IgG tests, no patch tests, no routine bloods."},
    {title:"Feed and protect growth", html:"Breastfed: continue breastfeeding; time-limited maternal exclusion with dietetic support and adequate maternal calcium and vitamin D per UK guidance. Formula-fed: eHF first; AAF for defined indications. Dietetic input wherever possible; vitamin D per UK advice for age and feeding method, without duplicating what the formula provides."},
    {title:"Review and reintroduce", html:"Phone at 2 weeks, face to face at 6 weeks with centiles, 3-monthly in the first year, planned reintroduction when appropriate (home ladder only for suitable non-IgE disease), tolerance review every 6–12 months."}
  ],
  sections:[

    {id:"severe", nav:"Exclude first", title:"Exclude the life-threatening and the growth emergency",
     sub:"Milk allergy has two shock presentations with different clocks, and faltering growth that needs careful interpretation.",
     blocks:[
       {b:"warn", html:"Anaphylaxis to cow's milk is rare but can be fatal, and IgE-mediated CMPA can escalate on later exposures. Acute facial or lip swelling, wheeze, stridor, hypotension or collapse after milk → give IM adrenaline immediately according to current paediatric resuscitation guidance (100–150 micrograms if &lt;6 months, 150 micrograms if 6 months–6 years; Resuscitation Council UK), call 999, and repeat after 5 minutes if there is no improvement and a second dose is available. Do not delay emergency transfer for antihistamines or steroids. <b>Delayed recognition is what kills.</b>"},
       {b:"dl", rows:[
         ["<b>FPIES — the mimic of sepsis</b>","Consider FPIES when <b>repetitive, profuse vomiting occurs typically 1–4 hours after ingestion</b>, with pallor, lethargy, hypotonia, diarrhoea or possible hypotension and without the usual immediate skin or respiratory features. Food Protein-Induced Enterocolitis Syndrome is <b>non-IgE but can produce a shock-like state</b>: acute severe FPIES requires <b>emergency assessment and resuscitation</b>. Routine skin-prick or specific-IgE testing does not diagnose FPIES, although IgE testing may be relevant in selected children, particularly before reintroduction. Tolerance varies by food, phenotype and child. <b>No unsupervised home milk ladder</b> — reintroduction is planned by paediatric allergy/gastroenterology and may need a medically supervised oral food challenge"],
         ["<b>Faltering growth</b>","Plot weight, length and head circumference on the UK-WHO charts and interpret with birth weight and gestation, previous trajectory, feeding history, development, hydration, parental heights and associated symptoms. <b>Discuss or refer</b> persistent downward crossing of centile spaces, poor weight velocity, feeding difficulty, recurrent vomiting/diarrhoea or suspected malabsorption (faltering growth with GI symptoms is a NICE reason to consider specialist referral). <b>Same-day paediatric assessment</b> if faltering growth is accompanied by dehydration, lethargy, respiratory distress, persistent vomiting, inability to feed, acute illness or other concerning signs"],
         ["Inability to feed or persistent vomiting","→ <b>same-day paediatric assessment</b>"],
         ["Acute abdomen","Suspected intussusception or acute abdomen → <b>emergency assessment</b>"],
         ["Respiratory distress","Wheeze, stridor or increased work of breathing after a feed → <b>999</b>"],
         ["Haematemesis, melaena or significant rectal bleeding","Blood or coffee-ground vomit, black tarry stools, significant ongoing rectal bleeding → <b>same-day paediatrics</b> (severe CMPA enteropathy, erosive disease)"],
         ["Dehydration","Sunken fontanelle, reduced urine output, dry mucous membranes, lethargy \u2192 <b>same-day assessment</b>"],
         ["Infected eczema","Widespread infected eczema with fever and systemic upset \u2192 <b>same-day</b> (eczema herpeticum, sepsis)"],
         ["<b>Persistent blood-streaked stools</b>","Visible blood in stools for &gt;2 weeks despite a milk-free diet \u2192 urgent (2-week) paediatric gastroenterology for IBD, polyps or intussusception. It is a referral, not a wait"],
         ["<b>Systemic red flags</b>","Unexplained pallor, bruising, petechiae, hepatosplenomegaly, lymphadenopathy or an abdominal mass are not a milk problem — follow the separate paediatric pathway (NICE NG12)"]
       ]},
       {b:"why", html:"Two of these are missed for the same reason: the timing does not fit the expected pattern. <b>FPIES arrives typically 1–4 hours after the feed</b>, so the milk is not suspected and the child is treated as septic; <b>faltering growth arrives over weeks</b>, so it is not treated as an emergency at all. Plot the weight before you discuss formula."}
     ]},

    {id:"confirm", nav:"Classify", title:"IgE, non-IgE, or mixed \u2014 and which subtype",
     sub:"Timing helps separate the mechanisms — interpret it with the full history rather than as an absolute cut-off — and the mechanism decides what follows.",
     blocks:[
       {b:"table", head:["Type","Timing and features","Management"], rows:[
         ["<b>IgE-mediated</b>","<b>Immediate, usually within minutes to 2 hours</b> — urticaria, angioedema, acute vomiting, wheeze or stridor, anaphylaxis","Targeted skin prick and/or specific IgE through a competent service; strict avoidance; individualised emergency plan; assess adrenaline auto-injector need; allergy referral. <b>Anaphylaxis risk</b>"],
         ["<b>Non-IgE-mediated</b>","<b>Delayed — over several hours or longer; timing is variable</b> — eczema exacerbation, proctocolitis (blood-streaked stools in a well infant), reflux-type symptoms with other suggestive features, diarrhoea, constipation or vomiting, poor growth with GI symptoms","Clinical diagnosis by 2–6-week elimination, dietetic advice and planned reintroduction; <b>routine IgE testing not useful</b> unless mixed or atypical features. Lower risk, primary-care managed"],
         ["<b>Mixed</b>","Immediate and delayed together \u2014 e.g. urticaria within the hour plus eczema worsening over days","<b>Manage as IgE-mediated</b> — the higher risk; allergy referral. Tests may be positive"],
         ["Proctocolitis (CMPI / FPIAP \u2014 food protein-induced allergic proctitis)","Blood-streaked mucousy stools in an <b>otherwise well</b> infant aged &lt;6 months with <b>normal growth</b>; commonest in breastfed babies","The commonest non-IgE presentation. Usually benign and self-limiting. Maternal exclusion trial is sufficient; <b>do not over-investigate (no colonoscopy)</b>"],
         ["<b>FPIES</b>","Repetitive, profuse vomiting typically 1–4 hours post-exposure, pallor, lethargy, hypotonia, diarrhoea, shock-like state; <b>usually without immediate urticaria or wheeze</b>","Rare. Routine allergy tests do not diagnose it (atypical FPIES with IgE sensitisation can occur). Urgent paediatric/allergy referral and an emergency plan; strict avoidance until specialist-planned reintroduction, which may be a medically supervised challenge — <b>no unsupervised reintroduction</b>. <b>Medical emergency when it reacts</b>"]
       ]},
       {b:"dl", rows:[
         ["Timing of symptoms","Immediate urticaria, angioedema, wheeze, vomiting or collapse <b>within minutes to 2 hours → suggests IgE</b> (mast-cell degranulation). Delayed gastrointestinal, cutaneous or systemic symptoms <b>over several hours or longer → suggests non-IgE</b> (heterogeneous, incompletely defined mechanisms). Both may occur in the same child. Interpret timing with the full clinical history, not as an absolute cut-off"],
         ["<b>Allergy-focused history</b>","Exact food and amount · raw, baked or fermented milk · timing · reproducibility · symptoms by organ system · feeding method, formula type and volume · maternal diet if breastfed · response to previous elimination/reintroduction · eczema, asthma, rhinitis · family atopy · growth and development · previous emergency reactions · foods already avoided"],
         ["Feeding history","<b>Breastfed:</b> CMPA can occur via cow's milk protein in the maternal diet. <b>Formula-fed:</b> standard formula contains cow's milk protein. <b>Weaning:</b> symptoms may start with yoghurt, cheese or cow's milk. <b>Onset is typically &lt;6 months</b>"],
         ["<b>Symptom diary</b>","Parent-completed for <b>1\u20132 weeks</b>: every feed and food, symptom type, timing, severity 0\u201310. Helps establish the temporal relationship — more reliable than recall"],
         ["Gastrointestinal","Vomiting, diarrhoea, blood or mucus in stools, <b>constipation (paradoxically)</b>, colic (inconsolable crying more than 3 hours a day), reflux symptoms (back arching, possetting)"],
         ["Skin","Atopic eczema (flexures and face), urticaria (wheals within 2 hours), angioedema. <b>Eczema alone does NOT diagnose CMPA.</b> Treat eczema adequately with emollients and appropriate topical anti-inflammatory treatment first; consider a time-limited elimination and reintroduction only if moderate-to-severe and poorly controlled despite treatment, or with a convincing food-related history"],
         ["Respiratory","Wheeze, chronic cough, nasal congestion. Rarely the sole manifestation \u2014 consider asthma and viral infection first"],
         ["Family history","<b>First-degree atopy increases CMPA risk</b> \u2014 ask specifically about parental and sibling eczema, asthma, allergic rhinitis and food allergy"],
         ["Response to avoidance","Improvement during elimination alone does not confirm CMPA — infant symptoms often fluctuate spontaneously; <b>recurrence on planned reintroduction provides the confirmation</b>. <b>No improvement after a complete, adequately timed (2–6-week) trial → reconsider the diagnosis</b>"]
       ]},
       {b:"warn", html:"Cow's milk allergy is commonly suspected but frequently overdiagnosed: colic, reflux, eczema and abnormal stools are common in infants regardless of diet, and <b>misclassification means the wrong treatment</b> \u2014 an unnecessary milk-free diet on one side, an unrecognised anaphylaxis risk on the other."}
     ]},

    {id:"workup", nav:"Prove it", title:"Examination, and the tests to order and refuse",
     sub:"One measurement matters more than any test: the weight on a centile chart.",
     blocks:[
       {b:"table", head:["Examine","What to record","Why"], rows:[
         ["<b>Growth</b>","<b>Weight, length and head circumference plotted on centile charts</b> (UK-WHO), documented in the <b>PCHR (red book)</b>","Interpret with birth weight, gestation, previous trajectory, parental heights, feeding, development and wellbeing; persistent downward crossing of centile spaces or poor weight velocity → discuss or refer. Plot at every review"],
         ["Skin","Eczema extent (% body surface area), distribution, and signs of infection (weeping, crusting, pustules); urticaria; angioedema","Severity guides both allergy suspicion and eczema treatment. Optimise eczema treatment before attributing it to food — flares are common and may be unrelated to diet"],
         ["Abdomen","Masses, tenderness, bowel sounds (hyperactive in acute FPIES)","<b>Generally unremarkable in CMPA</b> \u2014 an abnormal abdomen means look elsewhere"],
         ["General wellbeing","Alertness, lethargy, pallor, irritability; hydration (mucous membranes, fontanelle, urine output); respiratory effort","Systemic involvement changes the urgency"],
         ["<b>Nappy contents</b>","Inspect if brought, or request a photograph. Frank blood (red streaks), melaena (black tarry), mucous (thick clear or white)","<b>Parent-reported \u201cblood\u201d is often something else</b> \u2014 food dyes, urates in the nappy, or an anal fissure from constipation"],
         ["Development","Age-appropriate milestones (social smile 6 weeks, sitting 6 months, walking 12\u201318 months)","<b>Malnutrition causes developmental delay</b> \u2014 record it in the PCHR"]
       ]},
       {b:"table", head:["Test","When","Notes"], rows:[
         ["<b>Skin prick test (SPT)</b>","Suspected IgE-mediated allergy — selected, performed and interpreted by a suitably competent clinician or allergy service, with facilities to manage anaphylaxis","Targeted to the suspected food — do not order broad food panels. Interpret alongside the clinical history: <b>sensitisation does not prove clinical allergy</b>; significance depends on age, wheal size, pre-test probability and history"],
         ["<b>Specific IgE blood test</b>","Suspected IgE-mediated allergy — alternative or addition to SPT","No universal diagnostic cut-off: a positive result indicates sensitisation, not clinical reactivity — significance depends on age, assay, IgE level and history. <b>Do not order if there are no immediate symptoms</b>"],
         ["<b>Non-IgE — no routine allergy testing</b>","Not routinely","<b>Routine IgE tests are not useful for diagnosing isolated non-IgE-mediated disease</b> — a negative result does not exclude it. Consider specialist advice if there are mixed or atypical features, or if IgE-mediated allergy is possible before reintroduction"],
         ["<b>Elimination trial</b>","Both types","Suspected mild-to-moderate non-IgE: complete cow's-milk-protein elimination (formula, and the maternal diet if breastfeeding) for <b>2–6 weeks</b> with dietetic advice, then planned reintroduction (NICE CG116). Suspected IgE: strict avoidance pending allergy assessment"],
         ["<b>Reintroduction challenge</b>","After elimination <b>if</b> symptoms improved","<b>Supervised</b> for IgE-mediated or mixed disease, FPIES, previous anaphylaxis or severe reactions. <b>Mild-to-moderate non-IgE: planned home reintroduction under GP/dietetic guidance.</b> <b>Recurrence on reintroduction confirms CMPA</b>"],
         ["Bloods","Rarely needed","FBC if anaemia suspected (chronic blood loss in proctocolitis); albumin in severe malnutrition or malabsorption. <b>Not routine \u2014 over-investigation causes anxiety</b>"]
       ]},
       {b:"warn", html:"<b>Do NOT order: IgG \u201cfood intolerance\u201d tests</b> \u2014 IgG antibodies to food proteins are a <b>normal physiological response</b>, not pathology; NICE CG116, BSACI and EAACI all recommend against them, and they are sold widely with no evidence base. <b>Patch testing has no role.</b> <b>Endoscopy or colonoscopy only</b> for red flags \u2014 persistent GI bleeding despite a milk-free diet, weight loss, or suspected IBD."},
       {b:"why", html:"Elimination and reintroduction is the gold standard for non-IgE CMPA because no blood test exists. Both limbs are needed: symptoms improve on elimination <em>and</em> recur on reintroduction. If symptoms do not improve after a complete and adequately timed trial: confirm all milk protein was excluded, check formula preparation and adherence, and reconsider reflux, infection, constipation, anal fissure, other food allergy, inflammatory bowel disease and non-allergic causes. Avoid indefinite escalation from eHF to AAF without review — <b>it is probably not CMPA</b>, and the diet should stop rather than continue “just in case”."}
     ]},

    {id:"ladder", nav:"Feeding", title:"Milk avoidance \u2014 the formula ladder and what not to use",
     sub:"Eliminate the protein without starving the child. Every step here has a nutrition consequence.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Breastfed", title:"Maternal cow's-milk-protein exclusion", when:"first-line \u2014 keep breastfeeding",
          html:"Continue breastfeeding wherever possible. If non-IgE CMPA is suspected in an exclusively breastfed infant, consider a <b>time-limited maternal cow's-milk-protein exclusion</b> (milk, cheese, yoghurt, butter, cream, ice cream, milk chocolate) with dietetic support. Ensure adequate maternal calcium and vitamin D intake or supplementation according to current UK dietary guidance, assessed against her own diet. Symptom response varies — judge the trial over weeks, not days — and <b>reintroduce maternal dairy after the diagnostic trial unless CMPA is confirmed</b>."},
         {step:"Step 1", title:"Extensively hydrolysed formula (eHF)", when:"formula-fed, non-IgE",
          fromLabel:"first-line formula",
          html:"Proteins hydrolysed into small peptides. The initial trial for formula-fed infants with suspected mild-to-moderate non-IgE CMPA — choose the product from the <b>local formulary</b>, prescribed in accordance with ACBS requirements. <b>Trial 2–6 weeks, then planned reintroduction.</b> <b>Bitter taste — infants may refuse it at first</b>: give practical advice about transition and acceptance rather than escalating automatically. Formula choice also depends on age, nutritional needs, local availability and phenotype."},
         {step:"Step 2", title:"Amino-acid formula (AAF)", when:"defined indications, with paediatric/dietetic advice",
          fromLabel:"not first-line",
          html:"Elemental, no intact protein, from the local formulary. Consider with paediatric/dietetic advice for severe reactions, FPIES, significant faltering growth, multiple food allergy, severe eczema with suspected food allergy, eosinophilic oesophagitis, or failure/intolerance of an adequate eHF trial. Taste refusal of eHF alone does not automatically justify AAF. <b>Do not use it first-line, and review rather than escalate indefinitely.</b>"},
         {step:"Step 3", title:"Soya formula \u2014 conditional only", when:"age &gt;6 months, eHF and AAF refused",
          fromLabel:"rarely",
          html:"Soya formula is not usually first-line in young infants with suspected CMPA and <b>should not be used under 6 months without specialist/dietetic advice</b>. Some children with CMPA also react to soya. If used after 6 months (after dietitian input, or for cultural or religious reasons), ensure nutritional adequacy and monitor tolerance and growth."},
         {step:"Alternative", title:"Plant milks", when:"cooking, or as a drink from age 1",
          fromLabel:"never as a sole milk under 1",
          html:"<b>Do not use plant drinks as the main milk source before 12 months</b> — oat, coconut and almond drinks are not nutritionally equivalent to formula (small amounts in cooking only). <b>Do not use rice drinks as a main drink under 5 years</b> (inorganic arsenic). After 12 months, an unsweetened, calcium-fortified alternative may be used only if the child's overall nutritional intake is adequate and appropriate dietetic advice has been given; children under 2 with ongoing CMPA may still need a prescribed hypoallergenic formula depending on diet and growth. Do not use goat's or sheep's milk as a treatment for CMPA."}
       ]},
       {b:"dl", rows:[
         ["<b>Vitamin D and calcium</b>","Follow current UK vitamin D advice for age and feeding method. Breastfed infants generally require vitamin D supplementation (400 IU / 10 micrograms daily); formula-fed infants may not need extra if receiving at least 500 mL of formula daily — check the vitamin D content of the eHF/AAF and avoid unnecessary duplication. <b>Assess calcium from total intake</b> (formula, fortified alternatives, green vegetables, tahini) with dietetic advice rather than automatically prescribing a fixed supplement"],
         ["Weaning","<b>Start solids at 6 months as usual.</b> Avoid cow's milk, cheese, yoghurt, butter, cream and milk powder; watch for <b>hidden milk in bread, biscuits, cakes and ready meals</b>. Safe: meat, fish, fruit, vegetables, rice, pasta, lentils, eggs if tolerated"],
         ["<b>Label reading</b>","<b>UK law requires allergens in bold.</b> Avoid <b>milk, casein, whey, lactose, butter, cream, ghee, curds</b>. The <b>British Dietetic Association \u201cCMPA Support\u201d app</b> scans barcodes and flags allergens"],
         ["<b>Adrenaline auto-injector</b>","For confirmed or strongly suspected IgE-mediated milk allergy, <b>assess the need for adrenaline auto-injectors</b> according to the clinical history and local allergy guidance. If prescribed, provide two devices where recommended locally, train parents and carers, give a written emergency plan and ensure nursery/school training. Device strength is selected by the child's current weight and the product information. An auto-injector does not replace emergency transfer: use it immediately for anaphylaxis, <b>call 999</b>, and <b>repeat after 5 minutes</b> if no improvement and a second device is available (Resuscitation Council UK)"],
         ["Safe formula preparation","Same as standard formula: boil water, cool to <b>70\u00b0C</b>, add powder, shake. Use within 2 hours, discard unused after 24 hours. <b>Never microwave</b> (hot spots)"]
       ]},
       {b:"warn", html:"<b>\u201cLactose-free\u201d formula does not treat CMPA</b> \u2014 lactose intolerance is rare in infants and is a different problem entirely. <b>Do not use other mammalian milks (goat, sheep) as a CMPA treatment</b> \u2014 they cross-react. And <b>do not step up to AAF without trying eHF</b> unless an AAF indication applies (severe reactions, FPIES, significant faltering growth, multiple food allergy, severe eczema with suspected food allergy) or a specialist has directed it."}
     ]},

    {id:"lifestyle", nav:"Family support", title:"Parental education \u2014 where most of the benefit actually comes from",
     sub:"Reassurance is therapeutic here, and accidental exposure is the commonest failure mode.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"\ud83c\udff7\ufe0f Hidden milk", html:"Bread (milk powder), biscuits, cakes, chocolate, ready meals, processed meats (casein binders), crisps (milk flavouring). <b>Always check the label even if the product \u201clooks\u201d milk-free</b> — accidental exposure is common, and label-reading education reduces the risk."},
         {tone:"green", h:"\ud83e\udd8b Nutrition reassurance", html:"eHF and AAF provide complete nutrition \u2014 the same calories, protein and calcium as standard formula. Check vitamin D against UK advice for age and feeding method, without duplicating what the formula provides. The parental worry about \u201cmissing out on nutrients\u201d is unfounded, and growth monitoring is what confirms it."},
         {tone:"blue", h:"\ud83e\udd34 Breastfeeding support", html:"A time-limited maternal cow's-milk-protein exclusion, with adequate maternal calcium and vitamin D, reintroduced after the trial unless CMPA is confirmed. Dietetic support is strongly prioritised; peer support helps (\u201cDairy Free for Baby UK\u201d and similar groups)."},
         {tone:"cream", h:"\ud83c\udfe0 Social situations", html:"Inform <b>nursery, childminders and family members</b>; provide safe snacks for parties; teach the child from about age 2 to say <b>\u201cI can't have milk\u201d</b>. Consider a <b>medical alert bracelet</b> in severe IgE disease."},
         {tone:"cream", h:"\ud83e\uddf4 Eczema care runs in parallel", html:"Treat eczema adequately with <b>emollients and appropriate topical anti-inflammatory treatment</b> before assessing whether food allergy is contributing — eczema flares are common and may be unrelated to diet, and milk elimination does not replace topical treatment. Consider a time-limited elimination and reintroduction only if the eczema is moderate-to-severe, poorly controlled despite appropriate treatment, or accompanied by a convincing food-related history."},
         {tone:"green", h:"\ud83d\udcc8 Prognosis \u2014 say it early", html:"Most children with CMPA eventually develop tolerance, but the time course depends on whether disease is IgE-mediated, the severity of reactions, milk-specific IgE level, coexisting asthma, eczema and other food allergies — review individual progress rather than quoting a fixed percentage. Tolerance is reviewed every 6–12 months through planned reintroduction or supervised challenge. <b>CMPA is not lifelong</b> \u2014 saying so relieves a great deal of anxiety."},
         {tone:"green", h:"\ud83c\udf5b Weaning safely", html:"Start solids at 6 months as usual and introduce the high-allergen foods (egg, peanut, wheat, fish) unless an allergist advises otherwise \u2014 avoiding allergens does not prevent allergy. Offer milk-free versions (soya yoghurt from 6 months, oat milk on cereal)."}
       ]},
       {b:"why", html:"<b>Parental anxiety is a large part of the disease burden</b> \u2014 label reading, social restriction and fear of reactions. Clear education changes outcomes: the formula is nutritionally complete, most children outgrow it, and most reactions are mild."}
     ]},

    {id:"monitor", nav:"Follow-up", title:"Growth, response, and getting back onto milk",
     sub:"A fixed review schedule, because the commonest long-term error is drift.",
     blocks:[
       {b:"table", head:["When","What","Action"], rows:[
         ["<b>2 weeks</b>","Phone review after starting eHF or AAF","Early improvement may be seen, but judge the trial over 2–6 weeks. Check formula acceptance (taste), preparation and adherence; avoid escalating to AAF without a clear indication"],
         ["<b>6 weeks</b>","Face to face","<b>Weight, length and head circumference plotted.</b> If symptoms have not clearly improved after a complete trial, reassess the diagnosis; if improved, plan reintroduction to confirm. Review the maternal diet if breastfeeding; discuss weaning"],
         ["<b>3-monthly through the first year</b>","Growth monitoring","Growth velocity; dietitian if there are concerns; vitamin D compliance; adjust prescription volumes as the infant grows"],
         ["<b>When clinically appropriate (often 9–12 months)</b>","<b>Planned reintroduction — local milk-ladder protocol (iMAP)</b>","Home ladder only if suspected or confirmed mild-to-moderate non-IgE CMPA, symptoms controlled, growth satisfactory, no immediate reaction, FPIES not suspected, and parents understand the stopping and emergency plan: baked milk (muffin, biscuit) → yoghurt → cheese → fresh milk, one step every 1–2 weeks; timing and setting individualised. <b>Supervised reintroduction</b> for IgE-mediated or mixed disease, FPIES, previous anaphylaxis, severe reactions, significant faltering growth or multiple food allergy"],
         ["<b>Every 6–12 months</b>","Tolerance review","Review tolerance and the possibility of reintroduction every 6–12 months, with shorter intervals for mild non-IgE disease. IgE-mediated disease or FPIES: <b>specialist-led review</b>, including any repeat testing to time a challenge"]
       ]},
       {b:"why", html:"<b>The milk ladder works because heat denatures milk protein</b> \u2014 baked milk is least allergenic, then fermented (yoghurt), then fresh, and staged exposure is used to reintroduce milk safely in suitable children. The reason to plan it on time: many children have outgrown CMPA but stay milk-free through inertia. The ladder is a practical pathway used alongside the child's phenotype and local specialist guidance, at home or supervised in hospital depending on severity."},
       {b:"cards", items:[
         
       ]},
       {b:"cards", items:[
         {tone:"red", h:"\ud83d\udd34 Anaphylaxis", html:"\u201cSwelling of the lips, face or tongue, difficulty breathing, wheeze, floppiness or collapse after milk \u2014 <b>call 999</b> and use the adrenaline pen if you have one.\u201d"},
         {tone:"red", h:"\ud83e\udd2e Vomiting hours later", html:"“If there is repeated heavy vomiting <b>1 to 4 hours</b> after milk with floppiness or paleness — <b>999</b>. That is a different reaction and it can cause shock.\u201d"},
         {tone:"amber", h:"\ud83d\udcc9 Growth", html:"\u201cIf your baby isn't feeding or gaining weight well, contact us promptly \u2014 we will weigh and plot them.\u201d"},
         {tone:"amber", h:"\ud83e\ude78 Blood in the nappy", html:"\u201cBlood or persistent mucus in the nappy, or ongoing distress \u2014 let us know. If it carries on beyond 2 weeks on a milk-free diet we need to look further.\u201d"},
         {tone:"blue", h:"\ud83d\udeab Wrong milk", html:"\u201cDon't switch to soya, goat or \u2018lactose-free\u2019 milk to treat this \u2014 use only the formula we prescribe.\u201d"},
         {tone:"green", h:"\ud83e\ude9c Six weeks with no change", html:"\u201cIf there is no improvement after 6 weeks off milk, come back \u2014 that usually means milk isn't the problem and we should stop the diet.\u201d"}
       ]},
       {b:"say", html:"There are two things going on. First, we take cow's milk protein out completely \u2014 from your diet if you are breastfeeding, or with a special formula \u2014 and give it a proper few weeks. Second, and this is the part people skip: we put milk back to check it really was the cause. If symptoms come back, we know. If nothing changes off milk, then milk was not the problem and we stop the diet rather than carry on. Most children grow out of this, and when the time is right — often around 9 to 12 months — we will plan how to reintroduce milk safely."}
     ]},

    {id:"loop", nav:"Not responding?", title:"Not improving? Re-check before escalating", sub:"Confirm the elimination is complete and the diagnosis correct.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"1 \u00b7 Complete exclusion?", html:"Hidden cow\u2019s milk protein in the maternal diet, the formula or weaning foods — and check formula preparation and adherence."},
         {tone:"blue", h:"2 \u00b7 Right formula", html:"eHF taken adequately (transition advice for taste first)? AAF only for defined indications — avoid indefinite escalation from eHF to AAF without review."},
         {tone:"amber", h:"3 \u00b7 Long enough?", html:"Non-IgE CMPA needs <b>2\u20136 weeks</b>, not 2\u20136 days, before the trial is judged."},
         {tone:"blue", h:"4 \u00b7 Other diagnosis", html:"Reflux, infection, constipation, anal fissure, another food allergy, inflammatory bowel disease or a non-allergic cause — <b>no improvement on a complete, adequately timed elimination means it is probably not CMPA</b>."},
         {tone:"blue", h:"5 \u00b7 Growth", html:"Faltering growth → <b>paediatric and dietitian input</b>; consider AAF with their advice."},
         {tone:"blue", h:"6 \u00b7 Refer", html:"Severe or IgE-mediated disease, multiple allergies, or genuine doubt \u2192 specialist allergy."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer \u2014 who goes where",
     sub:"IgE-mediated, mixed and FPIES need a specialist; provide dietetic input wherever possible.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999 / same-day", html:"<b>Anaphylaxis. Suspected acute FPIES with systemic features</b> (repetitive vomiting with pallor, lethargy or a shock-like state). Dehydration. Respiratory distress. <b>Acute severe faltering growth or a clinically unwell child.</b> Significant gastrointestinal bleeding. Suspected acute abdomen."},
         {tone:"amber", h:"Allergy referral", html:"<b>Any suspected IgE-mediated CMPA</b> — immediate urticaria, angioedema or wheeze → targeted testing, emergency plan and assessment of adrenaline auto-injector need. Also <b>mixed IgE/non-IgE</b> disease, previous systemic reaction, multiple food allergies, severe eczema with suspected food allergy, <b>FPIES</b>, and any need for supervised challenge or reintroduction."},
         {tone:"amber", h:"Paediatrics / dietitian", html:"<b>Faltering growth with gastrointestinal symptoms</b>; <b>persistent symptoms despite a correctly performed single-allergen elimination</b> (reassess the diagnosis); a maternal exclusion diet that is difficult to maintain; multiple exclusions; nutritional concern; diagnostic uncertainty; persistent parental anxiety despite reassurance."},
         {tone:"blue", h:"Paediatric dietitian — wherever possible", html:"Provide dietetic input wherever possible, and strongly prioritise it for formula changes, breastfeeding maternal exclusion, multiple food exclusion, faltering growth, severe disease, prolonged avoidance or complicated weaning. <b>At minimum, every family gets written advice on</b> hidden milk ingredients, suitable substitutes, label reading, the duration of the trial, planned reintroduction, calcium and vitamin D requirements, and how to get help if symptoms worsen. Elimination without expert guidance risks rickets and protein-energy malnutrition."},
         {tone:"amber", h:"Urgent paediatric gastroenterology", html:"<b>Visible blood in stools for &gt;2 weeks despite a milk-free diet</b> \u2014 to exclude IBD, polyps or intussusception."},
         {tone:"purple", h:"Systemic red flags", html:"Unexplained systemic red flags are not part of the CMPA pathway — use the separate paediatric pathway (NICE NG12)."},
         {tone:"cream", h:"Keep in primary care", html:"Non-IgE CMPA with mild symptoms, normal growth, a straightforward elimination diet and a clear response. The GP prescribes eHF, monitors growth, guides <b>planned home reintroduction when appropriate (often around 9–12 months)</b>, and reviews tolerance every 6–12 months. Escalate for multiple allergies, faltering growth, diagnostic uncertainty or high parental anxiety."}
       ]},
       {b:"say", html:"Most babies outgrow milk allergy. For now we remove cow's milk protein \u2014 from your diet if you are breastfeeding, or with a special formula \u2014 and a dietitian helps keep the nutrition right. Later, when it is safe and appropriate, we carefully plan how to reintroduce milk."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 4-month-old, exclusively breastfed, with 6 weeks of \u201creflux\u201d, eczema and <b>streaks of blood in the nappy</b>, thriving on the 50th centile. Mother has already cut out dairy on advice from a forum and wants to know if the baby \u201chas a milk allergy for life\u201d."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Establishes <b>timing relative to feeds</b> rather than accepting \u201creflux\u201d; recognises <b>proctocolitis in a well, thriving infant</b> as benign non-IgE disease; <b>plots the weight</b> and checks the PCHR; screens for anaphylaxis and FPIES history; supports continued breastfeeding with a <b>time-limited maternal exclusion, adequate maternal calcium and vitamin D, and dietetic support</b>; <b>commits to a reintroduction challenge to confirm</b> rather than an open-ended diet; refuses IgG testing if asked; explains that most children develop tolerance; and — the step candidates most often miss — plans reintroduction (often around 9–12 months) and a 6–12-monthly tolerance review rather than leaving the diet to drift. Casebook chapter: <a href=\"../../cases/cmpa-reflux.html\">CMPA and reflux</a>."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Named sources. Formula, ACBS and local formulary details must be checked locally.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE CG116 \u2014 Food allergy in under 19s: assessment and diagnosis (2011)</b><br><a href="https://www.nice.org.uk/guidance/cg116" rel="noopener">nice.org.uk/guidance/cg116</a><span class="rd"> \u2014 recommendations 1.1 (allergy-focused history), 1.2 (diagnosis: targeted SPT/specific IgE for suspected IgE allergy, 2\u20136-week elimination then reintroduction for suspected non-IgE allergy with dietetic advice, no serum-specific IgG testing) and 1.4 (referral criteria)</span></li>'+
         '<li><b>BSACI \u2014 Guideline for the diagnosis and management of cow\u2019s milk allergy (Luyt et al., Clin Exp Allergy 2014)</b><br><a href="https://doi.org/10.1111/cea.12302" rel="noopener">doi:10.1111/cea.12302</a><span class="rd"> \u2014 formula choice (eHF first-line, AAF for defined indications), soya formula not recommended under 6 months, FPIES specialist management, dietetic assessment, home or hospital reintroduction by severity, reassessment every 6\u201312 months. An important source but now relatively old \u2014 check for updates</span></li>'+
         '<li><b>iMAP / MAP \u2014 The Milk Allergy in Primary Care (MAP) Guideline 2019 (Fox, Lovis et al.)</b><br><a href="https://gpifn.org.uk/imap/" rel="noopener">gpifn.org.uk/imap</a><span class="rd"> \u2014 a practical primary-care resource, not a national NICE guideline: staged reintroduction (baked \u2192 fermented \u2192 fresh, one step every 1\u20132 weeks, often from around 9\u201312 months in suitable non-IgE disease), primary-care diagnostic algorithm, parent information</span></li>'+
         '<li><b>BSACI and EAACI</b><br><a href="https://www.bsaci.org" rel="noopener">bsaci.org</a><span class="rd"> \u2014 risk-based adrenaline auto-injector prescribing, skin prick and specific IgE interpretation (sensitisation is not clinical allergy), and the recommendation AGAINST IgG \u201cfood intolerance\u201d testing</span></li>'+
         '<li><b>BNF for Children</b><br><a href="https://bnfc.nice.org.uk" rel="noopener">bnfc.nice.org.uk</a><span class="rd"> \u2014 IM adrenaline doses by age (100\u2013150 micrograms under 6 months, 150 micrograms 6 months\u20136 years, per Resuscitation Council UK 2021), EpiPen Jr and EpiPen weight bands, vitamin D 400 IU</span></li>'+
         '<li><b>ACBS \u2014 Advisory Committee on Borderline Substances</b><span class="rd"> \u2014 eHF and AAF prescribable on FP10 for the indication \u201cproven cow\u2019s milk allergy\u201d; check ACBS and the local formulary before prescribing</span></li>'+
         '<li><b>Resuscitation Council UK \u2014 Emergency treatment of anaphylaxis (current guidance)</b><br><a href="https://www.resus.org.uk" rel="noopener">resus.org.uk</a><span class="rd"> \u2014 IM adrenaline, 999, repeat after 5 minutes if no improvement</span></li>'+
         '<li><b>NICE NG75 \u2014 Faltering growth: recognition and management</b><br><a href="https://www.nice.org.uk/guidance/ng75" rel="noopener">nice.org.uk/guidance/ng75</a><span class="rd"> \u2014 interpreting centile crossing and weight velocity; when to refer</span></li>'+
         '<li><b>UK vitamin D advice for infants and children (NHS / SACN)</b><span class="rd"> \u2014 supplementation by age and feeding method; formula-fed infants on 500 mL or more daily</span></li>'+
         '<li><b>NICE NG12 \u2014 Suspected cancer: recognition and referral (updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> \u2014 not part of the CMPA pathway; unexplained systemic red flags follow the separate paediatric pathway</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Cow's milk protein allergy \u2014 NICE CG116, BSACI (2014), iMAP/MAP (primary-care resource), Resuscitation Council UK and NICE NG75. Non-IgE CMPA: 2\u20136-week elimination then planned reintroduction; home milk ladder only for suitable non-IgE disease; tolerance review every 6\u201312 months. Diagnosis and management are merged on this page; there is no separate cow's milk allergy pathway to cross-check. Verify all doses against the current BNF for Children before prescribing."
});
