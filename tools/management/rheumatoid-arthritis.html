  stemSub:"One page for primary care. The GP does not diagnose the subtype or start DMARDs: the job is to recognise persistent synovitis and get it to rheumatology within days (the early months are a therapeutic window), then run the shared-care monitoring, spot drug toxicity and infection, manage flares with the team, and look after the cardiovascular, bone, vaccine and pregnancy risks that RA and its treatment carry.",

  glance:[
    {lbl:"Refer if", val:"Persistent synovitis", sub:"small joints hands/feet or >1 joint"},

  ],
  quickSub:"If you read nothing else, read these cards. Every card names the source it comes from; the evidence panel at the bottom lists them in full.",
  quick:[
    {tone:"amber", h:"⚠ Suspected persistent synovitis → refer urgently, before results", html:"Refer any adult with <b>suspected persistent synovitis of undetermined cause</b>. Refer <b>urgently</b> — <b>even with a normal acute-phase response, negative anti-CCP or negative rheumatoid factor</b> — if the <b>small joints of the hands or feet</b> are affected, <b>more than one joint</b> is affected, or there has been a <b>delay of 3 months or longer</b> since symptoms began. Refer urgently, ideally within <b>3 working days</b> (QS33), when more than one joint or the small joints of the hands or feet are affected; QS33 also specifies specialist assessment within <b>3 weeks</b> of referral. Do not wait for RF, anti-CCP, CRP, ESR or radiographs. <span class='tw'>URGENT</span>"},
    {tone:"red", h:"Methotrexate is ONCE WEEKLY", html:"Inadvertent daily dosing of once-weekly methotrexate has caused fatal toxicity (sepsis, renal failure, aplastic anaemia). The MHRA (Drug Safety Update, Sept 2020) asks prescribers to <b>record the day of the week</b> on the prescription, check the patient understands, and use the <b>patient card</b> supplied with oral packs. Prescribe one tablet strength wherever possible, usually 2.5 mg tablets; avoid combining strengths or using 10 mg tablets unless there is a clear specialist-approved reason."},
    {tone:"amber", h:"Toxicity symptoms on a DMARD = urgent assessment", html:"<b>Fever with systemic illness, mouth ulcers, unexplained bruising or bleeding, severe sore throat</b>, or other symptoms suggesting marrow suppression require urgent clinical assessment and blood tests according to the local shared-care protocol. <b>New or worsening cough, dyspnoea, fever or hypoxia</b> → prompt assessment (infection, methotrexate pneumonitis, RA-ILD, PE, heart failure). Withhold the next methotrexate dose while seeking advice if toxicity or significant infection is suspected."},
    {tone:"blue", h:"Shared care is risk-stratified now", html:"The <b>BSR 2025 csDMARD guideline</b> replaced BSR/BHPR 2017 and moved to <b>risk-stratified monitoring</b>: closer blood tests while starting, then <b>FBC, renal function, ALT/AST and albumin every 3 months</b> in maintenance for people without risk factors, with frequency adjusted to individual toxicity risk. Follow the local rheumatology shared-care protocol for the exact drug, risk category, action thresholds and monitoring responsibility. Hydroxychloroquine does not usually require routine DMARD blood monitoring, but it requires appropriate baseline and ongoing retinal screening."},
    {tone:"blue", h:"Vaccines: use the current Green Book", html:"Use the current UKHSA Green Book and annual NHS immunisation guidance for pneumococcal, influenza, COVID-19 and shingles (non-live Shingrix) eligibility and schedule. Inactivated and non-live vaccines are generally safe, although response may be reduced; ideally complete indicated vaccines before significant immunosuppression where this does not delay treatment. Check the exact drug and dose against the Green Book before any <b>live</b> vaccine (UKHSA Green Book ch.6)."},
    {tone:"green", h:"Treat the whole patient", html:"RA raises cardiovascular risk (QRISK3 includes RA — no separate multiplier; assess clinically where QRISK3 is inappropriate), and RA plus glucocorticoids raise fracture risk (FRAX has an RA input; follow NOGG thresholds). Smoking cessation, BP, lipids, bone protection and mood are part of RA care, and the <b>annual review</b> covers them."}
  ],
  pathwaySub:"The primary-care journey in six moves. The red step is where the time-critical harm happens.",
  pathway:[
    {title:"Recognise inflammatory joint pain", html:"Objective joint <b>swelling</b> (soft, boggy synovitis), <b>morning stiffness lasting more than 30 minutes</b> that eases with use, involvement of MCP, PIP, wrist or MTP joints, more than one swollen joint, functional impairment or systemic symptoms such as fatigue. The presentation does not need to be symmetrical and RA can occur at any adult age. Positive squeeze test across the MCP or MTP row. Different from OA: stiffness is prolonged and swelling is soft, not bony."},
    {title:"Refer urgently — do not wait for tests", html:"Refer any adult with suspected persistent synovitis of undetermined cause. Small joints of hands/feet, more than one joint, or ≥3 months since onset → <b>urgent rheumatology referral, ideally within 3 working days</b>. Send bloods in parallel, but a normal CRP or a negative RF/anti-CCP must not delay or downgrade the referral.", alert:true},
    {title:"Bridge the wait sensibly", html:"Analgesia and, if needed, an NSAID with gastroprotection at the lowest effective dose. Do not delay referral while arranging treatment. <b>If symptoms are severe or function is substantially impaired, discuss corticosteroid treatment with rheumatology</b> or the local advice service, exclude infection where relevant, and document any steroid given (dose and date) in the referral."},
    {title:"Specialist starts a csDMARD + bridging steroid", html:"First-line conventional DMARD <b>monotherapy</b> (oral methotrexate, leflunomide or sulfasalazine; hydroxychloroquine for mild or palindromic disease), with <b>short-term bridging glucocorticoids</b>. Treat to target: <b>CRP and disease activity (DAS28) monthly</b> until remission or low disease activity."},
    {title:"Shared care: monitor, prescribe, act on results", html:"Transfer to primary care only after specialist initiation and stabilisation, with an agreed <b>written shared-care protocol</b> and explicit acceptance by the GP (BSR 2025 risk-stratified schedule). Act on abnormal results using the local action thresholds; toxicity symptoms need urgent assessment; hold DMARDs in significant infection per the protocol."},
    {title:"Long-term: flares, comorbidity, annual review", html:"Flares → rheumatology advice line (advice within 1 working day, QS33). Annual review: disease activity, function, comorbidity (CVD, osteoporosis, depression), complications (lung, eyes, cervical spine, vasculitis), vaccines, and pregnancy plans."}
  ],
  sections:[

    {id:"recognise", nav:"Recognise", title:"Recognising rheumatoid arthritis", sub:"The GP diagnosis is “suspected persistent synovitis”. That is enough to refer; the specialist confirms RA.",
     blocks:[
       {b:"dl", rows:[
         ["Typical picture","<b>Persistent polyarthritis, often (but not necessarily) symmetrical,</b> of the small joints — MCPs, PIPs, wrists and MTPs — with <b>soft swelling</b>, <b>early-morning stiffness</b> that eases with activity, and fatigue. Difficulty with fine tasks, jar lids, buttons, walking on the forefoot (“walking on pebbles”)"],
         ["Examination","Look for <b>synovitis</b>: warm, soft, boggy swelling and tenderness over joint lines. <b>Squeeze test</b>: pain on lateral compression across the MCPs or MTPs is a useful bedside sign of small-joint synovitis. Record swollen and tender joints separately — this is what the rheumatologist needs — plus duration and pattern, morning stiffness, functional impairment, skin psoriasis, nail changes, uveitis or bowel symptoms, respiratory symptoms, smoking and alcohol, pregnancy or conception plans, and fever or features suggesting infection"],
         ["Onset patterns","Usually insidious over weeks; can be acute polyarthritis; can be <b>palindromic</b> (episodic attacks lasting days, fully resolving) — still refer; occasionally a large-joint or older-onset presentation mimicking polymyalgia rheumatica"],
         ["Extra-articular clues","Rheumatoid nodules, dry eyes/mouth (secondary Sjögren’s), scleritis/episcleritis, interstitial lung disease (breathlessness, dry crackles), anaemia, weight loss, vasculitic rash or nail-fold infarcts"],
         ["Risk context","Smoking (the strongest modifiable risk factor and associated with anti-CCP-positive disease), family history of RA or autoimmunity, female sex, middle age — but RA occurs at any adult age"]
       ]},
       {b:"table", head:["Feature","Inflammatory (RA)","Mechanical / OA"], rows:[
         ["Morning stiffness","Prolonged, typically well over 30 minutes","Brief, usually under 30 minutes"],
         ["Swelling","Soft, boggy synovial swelling","Bony (Heberden’s / Bouchard’s nodes)"],
         ["Joints","MCPs, PIPs, wrists, MTPs; spares DIPs","DIPs, PIPs, thumb base (CMC), knees, hips"],
         ["Effect of activity","Improves with use","Worse with use, better with rest"],
         ["Systemic","Fatigue, raised CRP/ESR (not always)","None"]
       ]},
       {b:"why", html:"NICE NG100 frames the primary-care decision around <b>persistent synovitis</b>, not a laboratory diagnosis. Blood tests have limited sensitivity early on: seronegative RA exists and the CRP can be normal. A recognised harm is the reassuring normal blood test that delays referral beyond the treatment window: a normal CRP, negative RF, negative anti-CCP or normal radiograph does not exclude RA."}
     ]},

    {id:"differential", nav:"Differentials and red flags", title:"Differentials and same-day red flags", sub:"Not every swollen joint is RA, and a flare label can hide something dangerous.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Hot, swollen single joint = septic arthritis until proven otherwise", html:"Especially in someone already on DMARDs or steroids, or with a prosthetic joint. A hot, swollen monoarthritis should be treated as septic arthritis until excluded: arrange <b>same-day</b> hospital assessment and aspiration where appropriate. <b>If the patient is septic or unstable, take blood cultures if this does not delay treatment and start antibiotics according to the emergency pathway.</b> Suspected or proven septic arthritis in RA, particularly with a prosthetic joint, needs urgent combined medical and surgical management. Do not call a new monoarthritis an “RA flare” without excluding sepsis and crystal arthritis.", src:"NICE NG100 (2018, updated 2020) · BSR/BHPR, BOA, RCGP and BSAC hot swollen joint guideline 2006 (Coakley, Rheumatology)"},
         {tone:"red", h:"Febrile or septic on immunosuppression", html:"Fever, rigors, hypotension or new confusion on methotrexate, leflunomide, biologics or JAK inhibitors → <b>same-day hospital assessment</b>; check FBC for neutropenia. Hold the DMARD and inform rheumatology.", src:"BSR 2025 csDMARD guideline"},
         {tone:"red", h:"New cough or breathlessness on methotrexate", html:"New or worsening cough, dyspnoea, fever or hypoxia in a patient taking methotrexate or other immunomodulation requires prompt clinical assessment — differentials include infection, <b>methotrexate pneumonitis</b>, RA-associated interstitial lung disease, pulmonary embolism, heart failure and other drug toxicity. Withhold methotrexate while discussing with rheumatology if drug pneumonitis or significant infection is possible. Hypoxia, rapid deterioration or significant respiratory distress requires hospital assessment.", src:"BSR 2025 csDMARD guideline"},
         {tone:"amber", h:"Neck pain with neurological symptoms in established RA", html:"Atlanto-axial instability can cause cord compression: in established RA, new neck pain with paraesthesia, limb weakness, gait disturbance, unsteadiness, reduced power, extensor plantars, sphincter symptoms or other myelopathic signs → <b>urgent MRI and specialist surgical assessment</b> (NICE NG100). Cervical spine complications are on the NG100 annual review list.", src:"NICE NG100 (2018, updated 2020) — annual review"},
         {tone:"amber", h:"Red eye in RA", html:"Painful red eye with reduced vision may be <b>scleritis</b> → same-day ophthalmology. Gritty dry eyes are more often secondary Sjögren’s. Eye disease is part of the NG100 annual review.", src:"NICE NG100 (2018, updated 2020) — annual review"},
         {tone:"blue", h:"Differentials to hold in mind", html:"Viral polyarthritis (parvovirus B19, hepatitis B/C — often self-limiting within weeks), psoriatic arthritis, reactive arthritis, gout/CPPD, SLE and other connective tissue disease, polymyalgia rheumatica, hand OA, hypothyroidism. If synovitis persists, the differential is for the rheumatologist — refer anyway.", src:"NICE NG100 (2018, updated 2020) — refer suspected persistent synovitis of undetermined cause; differential list is clinical practice"}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral — the time-critical step", sub:"NICE NG100 and QS33: refer on clinical suspicion, not on blood results.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"Urgent rheumatology referral", html:"Refer any adult with <b>suspected persistent synovitis of undetermined cause</b>. Refer urgently, ideally within 3 working days, when <b>more than one joint</b> or the <b>small joints of the hands or feet</b> are affected, or when presentation is delayed by <b>at least 3 months</b>. A monoarthritis of uncertain cause still needs appropriate assessment, but does not automatically meet the QS33 3-day standard. Refer urgently <b>even if</b> the acute-phase response is normal and RF or anti-CCP is negative.", src:"NICE NG100 (2018, updated 2020) — referral for specialist treatment"},
         {tone:"blue", h:"The service standard: 3 working days", html:"Adults with suspected persistent synovitis affecting more than one joint, or the small joints of the hands and feet, are <b>referred to rheumatology within 3 working days</b> of presenting in primary care. QS33 also specifies <b>specialist assessment within 3 weeks of referral</b>, and csDMARD monotherapy <b>within 6 weeks of referral</b>. Local referral pathways may use different operational arrangements, but the referral should be clearly marked as suspected inflammatory synovitis.", src:"NICE QS33 (2013, updated 2020) statements 1 and 2"},
         {tone:"blue", h:"Send bloods — but don’t wait for them", html:"NICE: <b>rheumatoid factor</b> in adults with synovitis on examination; <b>anti-CCP</b> if RF is negative (anti-CCP is also prognostic). Send available baseline bloods in parallel, according to clinical context and local pathway — a practical panel is FBC, CRP and/or ESR, U&amp;E/eGFR and LFT; urate if crystal arthritis is possible; TSH, viral serology or other tests only when clinically indicated. <b>They must not delay the rheumatology referral.</b> A normal CRP, negative RF, negative anti-CCP or normal radiograph does not exclude RA.", src:"NICE NG100 (2018, updated 2020) — RF and anti-CCP testing; baseline and extra bloods are clinical practice"},
         {tone:"blue", h:"X-ray hands and feet", html:"NG100 recommends <b>X-rays of the hands and feet</b> in suspected persistent synovitis to establish whether erosions are present — early films are often normal. Baseline radiographic damage and anti-CCP both predict progression. Request plain X-rays of the hands and feet where this is locally available, but do not wait for the report before referring. A normal early radiograph does not exclude RA or other inflammatory arthritis.", src:"NICE NG100 (2018, updated 2020) — investigations"},
         {tone:"cream", h:"What to put in the referral", html:"Which joints are swollen (not just painful), duration, morning stiffness, function, any steroid already given (dose and date), extra-articular features, smoking status, relevant comorbidity (liver disease, alcohol, CKD, lung disease, pregnancy plans — all affect DMARD choice), and results available so far.", src:"Clinical practice, supporting NICE NG100 (2018, updated 2020) and QS33 (2013, updated 2020) referral"}
       ]},
       {b:"warn", html:"<b>Do not delay referral while arranging treatment.</b> Before rheumatology assessment, consider analgesia or an NSAID if suitable. If symptoms are severe or function is substantially impaired, discuss corticosteroid treatment with rheumatology or the local advice service; exclude infection where clinically relevant. Document any steroid given, including dose and date, in the referral. (Steroids may reduce visible synovitis — a clinical-practice concern, not a NICE prohibition.)"},
       {b:"say", html:"I think the swelling in your hands is coming from inflammation in the joints, and the most useful thing I can do is get you seen by the joint specialists quickly — treating this kind of arthritis early really does change how it behaves. I’ll send some blood tests today, but even if they come back normal that doesn’t rule it out, so I’m referring you now rather than waiting."}
     ]},

    {id:"dmards", nav:"DMARD ladder", title:"What rheumatology starts — the treat-to-target ladder", sub:"DMARDs are specialist-initiated. The GP needs to know what each drug is, why it was chosen, and what can go wrong.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1st", title:"csDMARD monotherapy", when:"newly diagnosed active RA — as soon as possible",
          html:"NG100: offer <b>first-line conventional DMARD monotherapy</b> with <b>oral methotrexate, leflunomide or sulfasalazine</b>, escalating the dose as tolerated. <b>Consider hydroxychloroquine</b> as an alternative for <b>mild or palindromic disease</b>. Methotrexate is used most often in practice; it is taken <b>once weekly</b> with folic acid (dose and day per BNF and the shared-care protocol)."},
         {step:"Bridge", title:"Short-term bridging glucocorticoid", when:"when starting a new csDMARD",
          fromLabel:"NG100",
          html:"NG100: consider <b>short-term bridging treatment with glucocorticoids</b> when starting a new csDMARD, because DMARDs take weeks to work. Route and dose are specialist decisions (oral taper, IM depot or intra-articular). Continue long-term glucocorticoids only after discussing long-term complications and when all other options have been offered."},
         {step:"Target", title:"Treat to target", when:"monthly until target",
          fromLabel:"NG100",
          html:"Target is <b>remission (for example DAS28 &lt;2.6)</b>, or <b>low disease activity (for example DAS28 &lt;3.2)</b> if remission cannot be achieved. Measure <b>CRP and disease activity monthly</b> in specialist care until the target is reached, adjusting treatment each time."},
         {step:"2nd", title:"Add or combine csDMARDs", when:"target not met despite dose escalation",
          fromLabel:"step-up",
          html:"NG100: offer an additional csDMARD (oral methotrexate, leflunomide, sulfasalazine or hydroxychloroquine) in combination in a step-up strategy when the target has not been reached despite dose escalation."},
         {step:"3rd", title:"Biologic or targeted synthetic DMARDs", when:"per NICE TA375, TA715 and drug-specific appraisals",
          fromLabel:"specialist-only",
          html:"TNF inhibitors, abatacept, tocilizumab/sarilumab, rituximab and JAK inhibitors, initiated and monitored through the rheumatology pathway (usually hospital-supplied) under the relevant technology appraisals (for example NICE TA375, 2016 and NICE TA715, 2021). The GP needs to <b>record them on the practice system</b> (hospital-only drugs are often invisible to other prescribers), and treat infection, vaccination and surgery as immunosuppressed care."}
       ]},
       {b:"table", head:["Drug","What the GP must know","Key toxicity / interaction"], rows:[
         ["<b>Methotrexate</b>","Once weekly, oral or subcutaneous (check which), with folic acid on a different day per the shared-care protocol; alcohol within national limits (discuss with the team)","Marrow suppression, hepatotoxicity, pneumonitis, mouth ulcers. <b>Avoid trimethoprim and co-trimoxazole</b> (additive antifolate → marrow suppression, BNF). NSAIDs and reduced renal function raise levels"],
         ["<b>Leflunomide</b>","Once daily; very long half-life. Check <b>blood pressure and weight</b> as well as bloods","Hepatotoxicity, hypertension, diarrhoea, weight loss, marrow suppression. Needs a <b>cholestyramine washout</b> before a planned pregnancy or after serious toxicity"],
         ["<b>Sulfasalazine</b>","Dose titrated up over weeks; orange urine/tears expected","Neutropenia and hepatotoxicity mostly in the first months; rash; reversible oligospermia"],
         ["<b>Hydroxychloroquine</b>","Does not usually require routine DMARD blood monitoring, but requires appropriate baseline and ongoing <b>retinal screening</b>; monitor clinically for visual symptoms","Retinal toxicity with long-term use; rarely QT prolongation"],
         ["<b>Glucocorticoids</b>","Short courses to bridge or treat flares","Bone loss, diabetes, hypertension, infection, adrenal suppression; plan bone protection and a steroid card where relevant"]
       ]},
       {b:"cards", items:[
         {tone:"amber", h:"JAK inhibitors: MHRA restrictions (April 2023)", html:"For RA, the relevant JAK inhibitors include <b>tofacitinib, baricitinib, upadacitinib and filgotinib</b> (abrocitinib, also covered by the MHRA measures, is not an RA treatment). Because of increased risks of major cardiovascular events, malignancy, VTE, serious infection and mortality, use in people <b>aged 65 or over</b>, <b>current or past long-term smokers</b>, or those with <b>cardiovascular or malignancy risk factors</b> only when there are <b>no suitable alternatives</b>; use caution in people with VTE risk factors. These medicines should be initiated and monitored through the rheumatology pathway. The GP role is to record the drug clearly in the GP record even if the hospital supplies it, and flag new CV/VTE/cancer symptoms and infections to the team.", src:"MHRA Drug Safety Update April 2023 (JAK inhibitors)"}
       ]},
       {b:"why", html:"Treat-to-target works because the first months are the window in which uncontrolled synovitis produces irreversible erosions. The rheumatology team escalates every month the target is missed; the GP’s contribution is getting the patient there early and keeping them safely on treatment for years afterwards."}
     ]},

    {id:"monitor", nav:"Shared care", title:"Shared-care monitoring — BSR 2025", sub:"The BSR 2025 csDMARD guideline (published November 2025) replaced BSR/BHPR 2017 and introduced risk-stratified monitoring. Use the current BSR risk-stratified schedule, but follow the local rheumatology shared-care protocol for the exact drug, patient risk category, action thresholds and monitoring responsibility. The table is a summary, not a universal schedule for every csDMARD.",
     blocks:[
       {b:"table", head:["Phase","Tests","Frequency (BSR 2025)"], rows:[
         ["Baseline (specialist)","Weight, BP, FBC, renal function, ALT/AST, albumin; screen for hepatitis B/C, HIV and TB risk as appropriate; chest X-ray/lung assessment before methotrexate if indicated","Before starting any csDMARD"],
         ["Initiation / dose change","FBC, electrolytes and renal function (creatinine/eGFR), ALT and/or AST, albumin","Without risk factors: at <b>week 2</b>, then <b>monthly for the first 3–6 months</b> — usually done or directed by rheumatology until the dose is stable"],
         ["Maintenance — no risk factors","FBC, renal function, ALT/AST, albumin","<b>Every 3 months</b>, with possible extension after individualised review"],
         ["Maintenance — risk factors for toxicity","Same panel","<b>More frequent</b>, tailored to the level of risk; reassess toxicity risk <b>at least annually</b> and whenever there is renal deterioration, increasing age or frailty, obesity or diabetes, high alcohol intake, liver disease, a new interacting medicine, combination therapy (especially methotrexate plus leflunomide) or a dose increase"],
         ["Leflunomide extra","Blood pressure and weight","At each monitoring visit per protocol"],
         ["Hydroxychloroquine","No routine blood tests (unless on another DMARD)","<b>Baseline ophthalmic assessment within the first year</b> where appropriate; <b>annual retinopathy screening</b> after 5 years for standard-risk patients, or earlier (after 1 year) if at higher risk — per current RCOphth guidance and local screening arrangements"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"Act on results — per protocol thresholds", html:"Interpret FBC, renal function and LFTs using the current action thresholds in the local shared-care protocol. A new significant fall in white cells, neutrophils or platelets, a rising ALT/AST, falling albumin, a significant rise in creatinine, or a rising MCV beyond those thresholds → <b>withhold the DMARD and discuss with rheumatology</b> promptly. Not every small isolated abnormality requires same-day withholding; <b>trends</b> matter as much as a single value.", src:"BSR 2025 csDMARD guideline"},
         {tone:"amber", h:"Don’t prescribe what you can’t monitor", html:"Only prescribe and monitor DMARDs under a current written shared-care agreement. Before issuing a repeat: check that required monitoring is current; check for infection and toxicity symptoms; check new medicines for interactions; ensure pregnancy and contraception issues are documented where relevant; use current BSR and local action thresholds. If the patient has missed monitoring, contact them before issuing. Record all hospital-supplied biologics and JAK inhibitors in the GP medication record so that interactions are caught.", src:"BSR 2025 csDMARD guideline (shared care agreements)"},
         {tone:"amber", h:"Intercurrent infection and surgery", html:"Significant infection → usually <b>withhold csDMARDs until recovered</b> and restart per the team’s advice. Around surgery, follow the shared-care and surgical team plan — do not stop or restart blindly.", src:"BSR 2025 csDMARD guideline"},
         {tone:"blue", h:"Hydroxychloroquine eyes", html:"Baseline ophthalmic assessment within the first year where appropriate; annual retinopathy monitoring after 5 years for standard-risk patients, or earlier annual monitoring for higher-risk patients — dose above the recommended weight-based threshold, eGFR below 60 ml/min/1.73 m², tamoxifen use, or pre-existing macular disease. Use current RCOphth guidance and local screening arrangements, and continue to ask about visual symptoms at review.", src:"BSR 2025 csDMARD guideline · RCOphth 2020 HCQ screening"}
       ]},
       {b:"warn", html:"<b>Common interaction traps:</b> trimethoprim or co-trimoxazole with methotrexate (serious marrow suppression); new NSAIDs or a drop in eGFR raising methotrexate levels; alcohol excess with methotrexate or leflunomide. Check the BNF interactions for any new drug on a patient taking a DMARD."}
     ]},

    {id:"mtx", nav:"Methotrexate safety", title:"Methotrexate — once-weekly safety", sub:"The single most important prescribing safety issue on this page.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Weekly, never daily", html:"Inadvertent daily dosing of once-weekly methotrexate has caused serious and fatal toxicity (sepsis, renal failure, aplastic anaemia). Before prescribing, <b>confirm the patient knows the dose is weekly</b>; <b>record the day of the week</b> on the prescription; confirm they have received the <b>methotrexate patient card</b>; express the weekly dose clearly; make the drug and weekly administration day visible in the medication record; check whether it is oral or subcutaneous; tablets are supplied in blister packs.", src:"MHRA Drug Safety Update Sept 2020"},
         {tone:"amber", h:"One strength wherever possible", html:"Prescribe one tablet strength wherever possible, usually 2.5 mg tablets, so the number of tablets is unambiguous. Avoid combining tablet strengths or using 10 mg tablets unless there is a clear specialist-approved reason, because this increases the risk of dosing errors; flag the weekly day prominently on repeat templates and in care-home MAR charts.", src:"BNF (methotrexate) · NPSA 2006 oral methotrexate alert"},
         {tone:"blue", h:"Folic acid", html:"Given on a different day from methotrexate to reduce GI and mucosal side effects and liver enzyme rises. Dose and day per the shared-care protocol and BNF.", src:"BSR 2025 csDMARD guideline · BNF"},
         {tone:"blue", h:"Signs of toxicity", html:"Distinguish possible infection, suspected cytopenia, significant mucositis, respiratory toxicity and serious systemic illness. Fever with systemic illness, mouth ulcers, unexplained bruising or bleeding, severe sore throat, severe diarrhoea or vomiting, or new cough or breathlessness → urgent clinical assessment and blood tests according to the local shared-care protocol; withhold the next methotrexate dose while seeking advice from rheumatology if toxicity or significant infection is suspected. Suspected overdose → hospital (folinic acid rescue is a hospital decision).", src:"MHRA Drug Safety Update Sept 2020 · BSR 2025 csDMARD guideline"}
       ]}
     ]},

    {id:"flare", nav:"Flares", title:"Flares and symptom control", sub:"A flare is a signal that disease control is not good enough, and a prompt to rule out mimics first.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1", title:"Is it a flare?", when:"first",
          html:"Several joints with increased swelling, stiffness and pain, often with fatigue and a rising CRP. <b>A single hot joint is not a flare until sepsis and crystals are excluded.</b> Consider infection, drug toxicity and missed doses."},
         {step:"2", title:"Contact rheumatology", when:"same day or next working day",
          fromLabel:"QS33",
          html:"QS33 statement 4: adults with RA and flares or possible treatment side effects should <b>receive advice within 1 working day</b> of contacting rheumatology. Most units have an advice line or patient-initiated review."},
         {step:"3", title:"Short-term glucocorticoid", when:"as agreed with the team",
          fromLabel:"NG100",
          html:"NG100: offer <b>short-term glucocorticoids for managing flares</b> in recent-onset or established disease to rapidly decrease inflammation (oral, IM or intra-articular; route and dose per team and BNF). Recurrent flares mean the DMARD strategy needs reviewing, not repeated steroid courses."},
         {step:"4", title:"Symptom control alongside", when:"throughout",
          fromLabel:"NG100",
          html:"NG100: consider oral <b>NSAIDs</b> for symptom control at the <b>lowest effective dose for the shortest time</b>, with a <b>PPI</b>, after assessing GI, renal and cardiovascular risk. Check renal function and blood pressure where clinically relevant; avoid or use extreme caution in CKD, heart failure, uncontrolled hypertension, previous ulcer/GI bleeding and high cardiovascular risk; consider interactions with anticoagulants, antiplatelets, ACE inhibitors/ARBs and diuretics. Analgesia (e.g. paracetamol) as adjunct. These relieve symptoms but do not replace DMARD optimisation."}
       ]},
       {b:"cards", items:[
         {tone:"green", h:"Multidisciplinary support", html:"Access to <b>physiotherapy</b> (exercise, fitness, joint function), <b>occupational therapy</b> (hand function, aids, splints), <b>podiatry</b> (foot problems) and psychological support; a named contact in the specialist team.", src:"NICE NG100 (2018, updated 2020) — multidisciplinary team"},
         {tone:"green", h:"Self-management and education", html:"Offer education about the condition, treatment and flare plans; QS33 statement 3 expects opportunities for self-management education throughout the disease.", src:"NICE QS33 (2013, updated 2020) statement 3 · NICE NG100 (2018, updated 2020)"}
       ]}
     ]},

    {id:"comorbid", nav:"Comorbidity", title:"Comorbidity — heart, bones, lungs, mood", sub:"RA shortens life mostly through cardiovascular disease, infection and lung disease. These are primary-care jobs.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"Cardiovascular risk", html:"RA is an independent CVD risk factor. <b>QRISK3</b> includes RA as a variable, so no extra multiplier is applied. QRISK3 is intended for its applicable age range and population; where it is inappropriate, risk assessment remains clinical. Manage lipids per current NICE NG238; address active inflammation, smoking, hypertension, glucocorticoid exposure, lipids, weight and activity. NICE IND108 indicator: CVD risk assessment with an RA-adjusted tool in the preceding 15 months (ages 30–84).", src:"NICE NG238 (2023) · NICE IND108 indicator (updated 2020)"},
         {tone:"amber", h:"Osteoporosis", html:"RA and glucocorticoids both raise fracture risk; <b>FRAX</b> has a rheumatoid arthritis input. Assess fracture risk before or soon after starting a prolonged glucocorticoid course. Use <b>FRAX with the rheumatoid arthritis input</b> where applicable and follow <b>NOGG treatment thresholds</b>, considering age, previous fragility fracture, glucocorticoid dose and duration, falls risk, BMI, smoking and alcohol, and DXA where indicated. In patients at sufficiently high risk, start bone-protective treatment promptly rather than waiting for DXA; the decision is individual, not automatic from age and dose alone. Calcium/vitamin D as appropriate.", src:"NOGG 2024 (current full guideline)"},
         {tone:"amber", h:"Lung disease", html:"RA-associated interstitial lung disease and bronchiectasis occur; lung disease is on the NG100 annual review list. New persistent breathlessness or dry cough → examine, CXR, and discuss with rheumatology (also consider methotrexate pneumonitis, infection, pulmonary embolism and heart failure).", src:"NICE NG100 (2018, updated 2020) — annual review"},
         {tone:"blue", h:"Depression and fatigue", html:"Depression is common in RA and is part of the NG100 annual review; screen and treat. Fatigue often reflects active disease, anaemia or poor sleep — check disease control first.", src:"NICE NG100 (2018, updated 2020) — annual review"},
         {tone:"green", h:"Smoking", html:"Smoking is associated with more severe, anti-CCP-positive disease and adds to CVD risk. Stopping is one of the few changes the patient controls that helps both.", src:"Clinical practice · NICE NG238 (2023) — smoking cessation"}
       ]}
     ]},

    {id:"vaccines", nav:"Vaccines and infection", title:"Vaccines and infection on immunosuppression", sub:"Check the current Green Book chapter before giving any live vaccine.",
     blocks:[
       {b:"cards", items:[
         {tone:"blue", h:"Shingrix — check current eligibility", html:"Use the current Green Book chapter 28a and NHS programme guidance for shingles eligibility and schedule; severely immunosuppressed adults may be eligible for the <b>non-live Shingrix</b> 2-dose course. Decide on eligibility by clinical assessment, discussing with the treating specialist where needed. Ideally vaccinate before starting significant immunosuppression.", src:"UKHSA Green Book ch.28a (current version)"},
         {tone:"amber", h:"Live vaccines", html:"Live vaccines (e.g. MMR, yellow fever, oral typhoid, live zoster) are contraindicated in significant immunosuppression. The Green Book states that long-term stable low-dose steroids, alone or with low-dose non-biological oral immune modulators such as <b>low-dose methotrexate (the chapter uses 25 mg/week as its reference dose)</b>, may not constitute a contraindication — but the exact drug and dose must be checked. Do not assume all biologics or JAK inhibitors have identical rules: distinguish drug, dose, timing and degree of immunosuppression. Live vaccines such as yellow fever may require specialist or travel-health advice. Check with the specialist before any live vaccine.", src:"UKHSA Green Book ch.6 (contraindications and special considerations)"},
         {tone:"blue", h:"Inactivated vaccines", html:"<b>Influenza</b>, <b>pneumococcal</b> and <b>COVID-19</b> vaccination per the current UKHSA Green Book and annual NHS immunisation guidance for immunosuppressed people — check the current chapters for the vaccine and schedule rather than relying on programme dates. Inactivated and non-live vaccines are generally safe, although immune response may be reduced. Ideally complete indicated vaccines before significant immunosuppression where this does not delay treatment.", src:"UKHSA Green Book ch.19 · ch.25 · ch.14a (current versions)"},
         {tone:"amber", h:"Infection vigilance", html:"Low threshold to see and examine immunosuppressed patients with fever. Significant infection → usually withhold csDMARDs/biologics until recovered (per team advice). Consider neutropenic sepsis if on DMARDs with fever and systemic illness — urgent assessment and FBC per the local protocol.", src:"BSR 2025 csDMARD guideline"}
       ]}
     ]},

    {id:"pregnancy", nav:"Pregnancy", title:"Pregnancy, contraception and breastfeeding", sub:"Plan pregnancies with rheumatology. The BSR 2022 guideline changed some long-held rules.",
     blocks:[
       {b:"table", head:["Drug","Before conception (women)","Fathers"], rows:[
         ["<b>Methotrexate</b> (≤25 mg/week)","<b>Stop at least 1 month before conception</b>. Folic acid 5 mg daily is used around conception according to specialist advice. Not compatible with pregnancy. <b>Unplanned exposure requires prompt contact with rheumatology and obstetric/maternity services</b> — this table is not a substitute for urgent specialist advice","Current BSR guidance does not require routine discontinuation of low-dose methotrexate solely because a male partner is planning conception; confirm individual advice with rheumatology, particularly where there are other fertility or reproductive concerns"],
         ["<b>Leflunomide</b>","Not compatible with pregnancy; stop with a <b>cholestyramine washout</b> before conception. An unplanned pregnancy or conception while taking leflunomide requires immediate cessation, urgent rheumatology/obstetric advice and drug-level assessment with washout according to the specialist protocol","Current BSR guidance does not require routine discontinuation solely for paternal conception plans; confirm individual advice with rheumatology"],
         ["<b>Sulfasalazine</b>","Compatible throughout pregnancy (folic acid 5 mg daily periconception and in the first trimester) and breastfeeding","Can cause reversible oligospermia — important when discussing fertility"],
         ["<b>Hydroxychloroquine</b>","Compatible throughout pregnancy and breastfeeding","Compatible"],
         ["<b>Prednisolone</b>","Compatible (lowest effective dose)","Compatible"]
       ]},
       {b:"cards", items:[
         {tone:"amber", h:"Correction to older teaching", html:"The traditional rule “stop methotrexate 3 months before conception in both partners” has been replaced in UK rheumatology practice by <b>1 month for women</b>, and current BSR guidance does not require routine discontinuation of low-dose methotrexate for men planning conception — confirm individual advice with rheumatology. Local leaflets may still quote 3 months — follow the rheumatology team’s plan.", src:"BSR 2022 pregnancy and breastfeeding guideline (Rheumatology 2023)"},
         {tone:"blue", h:"Contraception and planning", html:"Women of childbearing potential on methotrexate or leflunomide need effective contraception and a pre-conception discussion with rheumatology. Disease is best controlled before pregnancy; switching to pregnancy-compatible drugs is planned in advance.", src:"BSR 2022 pregnancy and breastfeeding guideline (Rheumatology 2023)"}
       ]}
     ]},

    {id:"review", nav:"Follow-up", title:"Follow-up, annual review and safety-netting", sub:"The annual review is coordinated by rheumatology (QS33 statement 5); much of it lands in primary care.",
     blocks:[
       {b:"table", head:["What","When","Who / action"], rows:[
         ["Disease activity (CRP, DAS28)","<b>Monthly</b> until target, then per specialist plan","Rheumatology; ask about flares at every GP contact"],
         ["DMARD bloods","Per BSR 2025 schedule (3-monthly in low-risk maintenance)","GP under a written shared-care agreement; act on abnormal results using the local action thresholds"],
         ["Annual review","<b>Every year</b>","Disease activity and damage; function (e.g. HAQ); comorbidities (hypertension, IHD, osteoporosis, depression); complications (vasculitis, cervical spine, lung, eyes); MDT cross-referral; need for surgery; impact on life and work"],
         ["CVD risk","At least annually","QRISK3; statin per NG238; BP, lipids, smoking"],
         ["Bone health","At steroid courses and annual review","FRAX with RA input; NOGG 2024 treatment thresholds"],
         ["Vaccines","Per the current Green Book and annual NHS programme","Practice immunisation team"],
         ["Hydroxychloroquine eyes","Baseline within the first year; annually after 5 years (or earlier if high risk)","Ophthalmology/optometry screening service"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 Same day", html:"“If you get a fever or feel unwell, a severe sore throat, mouth ulcers, unexplained bruising or bleeding, or a new cough or breathlessness while on this treatment, don’t take your next dose and contact us the same day.”", src:"BSR 2025 csDMARD guideline"},
         {tone:"amber", h:"💊 Weekly means weekly", html:"“Methotrexate is taken once a week, on the same day each week — taking it every day is dangerous. Show your card to any doctor, nurse or pharmacist.”", src:"MHRA Drug Safety Update Sept 2020"},
         {tone:"blue", h:"🦠 Infections and vaccines", html:"“This treatment lowers your resistance to infection. Tell us early if you’re unwell, and check with us before any travel or ‘live’ vaccine.”", src:"UKHSA Green Book ch.6 (contraindications and special considerations)"},
         {tone:"green", h:"🔁 Flares", html:"“If your joints flare, ring the rheumatology advice line — they should get back to you within a working day.”", src:"NICE QS33 (2013, updated 2020) statement 4"}
       ]},
       {b:"say", html:"Your arthritis treatment works well, but it needs regular blood tests to keep it safe — that’s the part we look after here. If you ever get a sore throat with a temperature, mouth ulcers, bruising, or a new cough or breathlessness, hold your next methotrexate dose and ring us the same day. And if you’re thinking about a pregnancy, tell us early so we can plan the medicines with your specialist."}
     ]},

    {id:"pitfalls", nav:"Pitfalls", title:"Common pitfalls", sub:"Where primary care most often goes wrong with RA.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"Waiting for a positive RF", html:"A negative RF, negative anti-CCP or normal CRP does not exclude RA. Refer on persistent synovitis.", src:"NICE NG100 (2018, updated 2020) — referral"},
         {tone:"red", h:"Trimethoprim for a UTI on methotrexate", html:"Additive antifolate effect can cause severe marrow suppression. Choose an alternative antibiotic and check interactions.", src:"BNF (methotrexate interactions)"},
         {tone:"amber", h:"Steroids before the specialist sees them", html:"NG100 places glucocorticoids as short-term bridging when a csDMARD is started, or for flares — not as a substitute for referral. Do not delay referral. If symptoms are severe, discuss corticosteroids with rheumatology rather than withholding treatment; steroids may reduce visible synovitis, so document any dose and date in the referral.", src:"NICE NG100 (2018, updated 2020) — bridging and flare glucocorticoids; pre-referral advice is clinical practice"},
         {tone:"amber", h:"Calling a hot single joint a flare", html:"Septic arthritis is more dangerous in immunosuppressed RA patients. Same-day assessment and aspiration where appropriate — but if septic or unstable, do not delay antibiotics.", src:"BSR/BHPR, BOA, RCGP and BSAC hot swollen joint guideline 2006 (Coakley, Rheumatology)"},
         {tone:"amber", h:"Quoting 3 months off methotrexate for both partners", html:"BSR 2022: stop 1 month before conception in women; routine discontinuation is not required for men on low-dose methotrexate, but confirm individual advice with rheumatology.", src:"BSR 2022 pregnancy and breastfeeding guideline (Rheumatology 2023)"},
         {tone:"blue", h:"Forgetting the hospital-only drugs", html:"Biologics and JAK inhibitors missing from the GP record mean missed interactions, live-vaccine errors and unrecognised infection risk.", src:"BSR 2025 csDMARD guideline (shared care agreements)"}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card — the classic scenario and what the examiner is looking for.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 42-year-old teacher with 8 weeks of painful, stiff hands, worst for about an hour each morning, now struggling to write on the board. Swollen MCPs on both hands, positive squeeze test. She smokes, is hoping to try for a baby next year, and asks for “strong anti-inflammatories so I can get through term”. Her previous RF was negative.", src:"NICE NG100 (2018, updated 2020) · NICE QS33 (2013, updated 2020) — scenario basis"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Recognises inflammatory arthritis and persistent synovitis; <b>refers urgently despite the negative RF</b> and explains why early treatment matters; offers symptom relief safely (NSAID lowest dose with PPI after risk check) and discusses steroids with rheumatology if symptoms are severe rather than delaying referral; sends bloods and X-rays in parallel; raises smoking cessation; addresses the pregnancy plan honestly (some first-line DMARDs need planning around conception) and signposts rheumatology pre-conception advice; safety-nets for a hot single joint; explores the impact on work.", src:"NICE NG100 (2018, updated 2020) · NICE QS33 (2013, updated 2020) · BSR 2022 pregnancy guideline"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Every recommendation on this page traces to a named source below.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG100 — Rheumatoid arthritis in adults: management (July 2018, last updated October 2020)</b><br><a href="https://www.nice.org.uk/guidance/ng100" rel="noopener">nice.org.uk/guidance/ng100</a><span class="rd"> — referral of suspected persistent synovitis, investigations (RF, anti-CCP, X-rays), csDMARD monotherapy first line, hydroxychloroquine for mild/palindromic disease, bridging and flare glucocorticoids, treat-to-target (remission e.g. DAS28 &lt;2.6; low disease activity e.g. DAS28 &lt;3.2), NSAIDs, MDT, annual review, urgent MRI and surgical opinion for suspected cervical myelopathy, urgent combined medical and surgical management of septic arthritis. Advice on steroids before rheumatology assessment is clinical practice, not a NICE prohibition</span></li>'+
         '<li><b>NICE QS33 — Rheumatoid arthritis in over 16s (2013, updated January 2020)</b><br><a href="https://www.nice.org.uk/guidance/qs33" rel="noopener">nice.org.uk/guidance/qs33</a><span class="rd"> — referral within 3 working days for suspected persistent synovitis of more than one joint or the small joints of the hands or feet; specialist assessment within 3 weeks of referral; csDMARD within 6 weeks of referral with monthly monitoring; education; advice within 1 working day for flares/side effects; annual review</span></li>'+
         '<li><b>BSR 2025 — Guideline for the prescription and monitoring of conventional synthetic DMARDs</b> (Rheumatology 2025, doi:10.1093/rheumatology/keaf522; replaces BSR/BHPR 2017)<br><a href="https://academic.oup.com/rheumatology/article/65/2/keaf522/8322743" rel="noopener">academic.oup.com/rheumatology (keaf522)</a><span class="rd"> — risk-stratified monitoring; week 2 then monthly for 3–6 months at initiation; maintenance 3-monthly bloods without risk factors, annual toxicity-risk review, hydroxychloroquine eye screening; csDMARD care as a collaborative responsibility. The exact monitoring schedule and action thresholds come from the local shared-care protocol</span></li>'+
         '<li><b>Greater Manchester Medicines Management Group — current rheumatology shared-care guidelines</b><br><a href="https://gmmmg.nhs.uk" rel="noopener">gmmmg.nhs.uk</a><span class="rd"> — the local shared-care protocol for methotrexate and other csDMARDs; check the current version, as older protocols in search results (e.g. oral methotrexate 2017) are not necessarily current</span></li>'+
         '<li><b>BSR 2022 — Guideline on prescribing drugs in pregnancy and breastfeeding: immunomodulatory anti-rheumatic drugs and corticosteroids</b> (Rheumatology 2023;62(4):e48)<br><a href="https://academic.oup.com/rheumatology/article/62/4/e48/6783012" rel="noopener">academic.oup.com/rheumatology (e48)</a><span class="rd"> — methotrexate stop 1 month pre-conception, no routine discontinuation required for paternal exposure to low-dose methotrexate or leflunomide (individual advice via rheumatology), leflunomide washout and drug levels after unplanned exposure, SSZ/HCQ compatible</span></li>'+
         '<li><b>MHRA Drug Safety Update (April 2023) — Janus kinase (JAK) inhibitors: new measures to reduce risks of major cardiovascular events, malignancy, VTE, serious infections and increased mortality</b><br><a href="https://www.gov.uk/drug-safety-update/janus-kinase-jak-inhibitors-new-measures-to-reduce-risks-of-major-cardiovascular-events-malignancy-venous-thromboembolism-serious-infections-and-increased-mortality" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> — use only if no suitable alternatives in ≥65s, smokers, CV/malignancy risk</span></li>'+
         '<li><b>MHRA Drug Safety Update (September 2020) — methotrexate once-weekly for autoimmune diseases: new measures to reduce risk of fatal overdose due to inadvertent daily instead of weekly dosing</b><br><a href="https://www.gov.uk/drug-safety-update/methotrexate-once-weekly-for-autoimmune-diseases-new-measures-to-reduce-risk-of-fatal-overdose-due-to-inadvertent-daily-instead-of-weekly-dosing" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> — record day of week, patient card, blister packs</span></li>'+
         '<li><b>UKHSA Green Book — Immunisation against infectious disease</b> ch.28a (shingles), ch.6 (contraindications/immunosuppression), ch.19, ch.25, ch.14a<br><a href="https://www.gov.uk/government/collections/immunisation-against-infectious-disease-the-green-book" rel="noopener">gov.uk — the Green Book</a><span class="rd"> — current eligibility and schedules for shingles (Shingrix), pneumococcal, influenza and COVID-19 vaccination; live vaccines by drug, dose and degree of immunosuppression (stable low-dose steroid with low-dose methotrexate may not be a contraindication); inactivated vaccines. Check the current chapters rather than relying on programme dates</span></li>'+
         '<li><b>RCOphth 2020 — Hydroxychloroquine and chloroquine retinopathy: recommendations on monitoring</b><br><a href="https://www.rcophth.ac.uk/wp-content/uploads/2020/12/Hydroxychloroquine-and-Chloroquine-Retinopathy-Monitoring-Guideline.pdf" rel="noopener">rcophth.ac.uk</a><span class="rd"> — baseline assessment within the first year; annual screening after 5 years, or after 1 year with risk factors (&gt;5 mg/kg/day, eGFR &lt;60, tamoxifen, pre-existing macular disease); use the current RCOphth guidance and local screening arrangements</span></li>'+
         '<li><b>NPSA 2006 patient safety alert — oral methotrexate</b> (via BNF)<span class="rd"> — prescribe one tablet strength wherever possible (usually 2.5 mg)</span></li>'+
         '<li><b>NICE NG238 — Cardiovascular disease: risk assessment and reduction, including lipid modification (2023)</b> and NICE IND108 indicator (RA: cardiovascular risk assessment)<br><a href="https://www.nice.org.uk/guidance/ng238" rel="noopener">nice.org.uk/guidance/ng238</a><span class="rd"> — QRISK3 (includes RA), statin thresholds, annual CVD risk assessment in RA</span></li>'+
         '<li><b>NOGG 2024 — UK clinical guideline for the prevention and treatment of osteoporosis</b><br><a href="https://www.nogg.org.uk/full-guideline" rel="noopener">nogg.org.uk/full-guideline</a><span class="rd"> — fracture-risk assessment with FRAX (RA input) and NOGG treatment thresholds for glucocorticoid-treated patients; prompt bone protection in those at sufficiently high risk, individualised by age, dose, duration and previous fracture</span></li>'+
         '<li><b>BSR/BHPR, BOA, RCGP and BSAC 2006 — Guidelines for management of the hot swollen joint in adults</b> (Coakley et al., Rheumatology 2006;45(8):1039)<span class="rd"> — septic arthritis until proven otherwise; aspirate before antibiotics in a stable patient, but do not delay antibiotics if septic or unstable</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — all doses; methotrexate interactions (trimethoprim, co-trimoxazole, NSAIDs)</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Rheumatoid arthritis in adults — NICE NG100 (2018, updated 2020), NICE QS33 (2013, updated 2020), BSR 2025 csDMARD prescribing and monitoring guideline, BSR 2022 pregnancy guideline, MHRA Drug Safety Update Sept 2020, UKHSA Green Book (ch.6, ch.25, ch.28a), NICE NG238 (2023), NOGG 2024, RCOphth 2020. DMARDs are specialist-initiated; follow your local shared-care protocol for exact monitoring intervals and action thresholds, and verify all doses against the current BNF."
});
