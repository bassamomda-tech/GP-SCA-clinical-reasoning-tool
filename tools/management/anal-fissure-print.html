<title>Anal fissure — Protocol · Reasoning GP</title>
<meta name="description" content="Anal fissure in primary care: breaking the hard-stool, pain and sphincter-spasm cycle with stool softening, a topical sphincter relaxant (Rectogesic 0.4%, licensed for pain, or unlicensed diltiazem 2%) when symptoms persist despite conservative treatment or the fissure is chronic, GTN headache as the usual reason it fails, and atypical or lateral fissures as a prompt to think Crohn's." />

<script>
MG.render({
  icon:"🩸",
  title:"Anal fissure — the complete guide",
  eyebrow:"Protocol · adults · a cycle to break, not just a tear to heal",
  stemTitle:"A fissure is kept open by hard stool, pain and sphincter spasm — so individualised stool softening is the foundation the topical treatments depend on",
  stemSub:"One page for adults. Recognise severe pain on defecation with bright-red bleeding, usually posterior midline. Most acute fissures improve with stool softening and symptom relief; symptoms that persist despite appropriate conservative treatment, or a chronic or recurrent fissure, should prompt consideration of a topical sphincter relaxant and/or referral. <b>Rectogesic (GTN 0.4%)</b> is licensed for pain in chronic fissure; the SPC studies did not show a statistically significant healing benefit versus placebo, and headache is very common. <b>Diltiazem 2%</b> is an unlicensed alternative. A lateral, multiple, painless, indurated, large or non-healing fissure means reconsidering the diagnosis. <b>This pathway is for adults</b> — in children, constipation management comes first, and persistent, recurrent, severe, atypical or bleeding fissures need paediatric assessment.",
  guideline:"MHRA SPC (Rectogesic) · Greater Manchester formulary · NICE NG12 · ACPGBI/BSG FIT guideline (2022) · SPS (diltiazem)",
  reviewed:"25 September 2026",
  nextReview:"25 September 2027",
  meta:[
    {t:"Adults only — no Rectogesic under 18", tone:"tw"},
    {t:"Atypical fissure → reconsider the diagnosis", tone:"tw"},
    {t:"v2.1 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#confirm"><b>Confirm</b><small>Atypical → think again</small></a><a href="#nondrug"><b>Soften</b><small>Individualised</small></a><a href="#drug"><b>Topical</b><small>GTN · diltiazem</small></a><a href="#monitor"><b>Review</b><small>6–8 weeks</small></a><a href="#refer"><b>Refer</b><small>Colorectal</small></a></div>',
  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"blue", h:"Typical features, and acute versus chronic", html:"Severe pain on or after defecation with bright-red bleeding, usually (not always) posterior midline, often after hard stool. <b>Acute:</b> under 6 weeks. <b>Chronic:</b> 6 weeks or more, often with a sentinel pile, hypertrophied anal papilla, exposed sphincter fibres or indurated edges. A practical distinction only — reaching 6 weeks does not by itself mean topical GTN is needed."},
    {tone:"green", h:"Soft, easily passed stools", html:"Appropriate fluids (individualised — no fixed volume in heart failure, CKD, frailty, fluid restriction or diarrhoeal illness), gradual fibre only where suitable, no straining — and use or add an <b>osmotic laxative</b> when stools remain hard, constipation is significant or fibre is poorly tolerated; titrate to avoid diarrhoea. Fibre may worsen pain or bloating and can be inappropriate with faecal loading or obstructive symptoms. Stool regulation may need to continue after healing because recurrence is common."},
    {tone:"amber", h:"Persistent or chronic: consider a sphincter relaxant", html:"<b>Rectogesic 0.4%</b> (GM first choice, prescribe by brand) intra-anally every 12 hours, for up to 8 weeks — licensed for pain associated with chronic fissure after conservative treatment has failed; it may facilitate healing by reducing sphincter tone, but the SPC studies showed no statistically significant healing benefit versus placebo. Or <b>diltiazem 2%</b> (unlicensed, via the local formulary/specials process; not automatically equivalent to GTN) twice daily for about 6–8 weeks. It may also be considered earlier in adults with persistent pain despite initial care."},
    {tone:"red", h:"⚠ GTN: headache and contraindications", html:"Headache is very common (around 57% in SPC trials) and can be severe — warn before prescribing; stop and consider diltiazem or referral if it is not tolerated. <b>Do not use with PDE-5 inhibitors</b> (sildenafil, tadalafil, vardenafil) or other nitrates. Contraindicated in pregnancy. Avoid when breastfeeding unless specialist advice supports its use — topical diltiazem may be considered as an unlicensed alternative."},
    {tone:"amber", h:"Atypical → reconsider the diagnosis", html:"Lateral, multiple, painless, indurated, unusually large, non-healing or recurrent → not diagnostic of Crohn's or malignancy, but assess for Crohn's, HIV or immunosuppression, TB, syphilis, inflammatory or haematological disease, anal cancer or trauma — examine and refer rather than repeating topical ointment without reassessment."},
    {tone:"blue", h:"Persistent → colorectal assessment", html:"Not healed despite stool regulation and topical therapy → colorectal surgery, where treatment selection is specialist-led and depends on continence symptoms, previous obstetric sphincter injury, age, baseline sphincter function, fissure characteristics, Crohn's disease, previous surgery and prior treatment response."}
  ],
  pathwaySub:"Five steps.",
  pathway:[
    {title:"Confirm, and look for atypical or red-flag features", html:"Typical posterior midline fissure; atypical features, abscess, fistula or colorectal symptoms change the pathway.", alert:true},
    {title:"Individualised stool softening", html:"Fluids, fibre where appropriate, an osmotic laxative if stools stay hard; a short (1–2 week) course of topical anaesthetic for severe pain."},
    {title:"Persistent or chronic: topical relaxant", html:"If conservative treatment fails: Rectogesic (licensed for pain, not proven healing) or unlicensed diltiazem, with headache, SPC contraindications and cautions checked."},
    {title:"Review at 6–8 weeks", html:"Healing, tolerability, stool consistency, atypical features."},
    {title:"Refer the persistent and the atypical", html:"Colorectal assessment; investigate another cause where indicated."}
  ],
  sections:[

    {id:"confirm", nav:"Confirm", title:"Step 1 — confirm, and consider atypical causes",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>Typical</b>","Severe pain on or after defecation with bright-red blood on the paper; usually posterior midline; linked to hard stool"],
         ["<b>Acute versus chronic</b>","Acute under 6 weeks; chronic 6 weeks or more — sentinel pile, hypertrophied papilla, exposed internal sphincter fibres, indurated edges, recurrent or persistent symptoms. A practical distinction: most recent fissures are managed conservatively first"],
         ["<b>Atypical</b>","Lateral, multiple, painless, indurated, unusually large, non-healing or recurrent → consider Crohn's, HIV or immunosuppression, TB, syphilis, inflammatory or autoimmune disease, haematological disease, anal or colorectal malignancy, trauma or iatrogenic injury. A lateral fissure is not diagnostic of Crohn's disease or malignancy, but should trigger assessment; do not simply repeat topical ointment without reassessment"],
         ["<b>Examine</b>","Examine the abdomen and anorectum where this will alter management; inspect gently where possible. A digital rectal examination is often too painful at first and need not be forced — but if examination is incomplete, arrange review or specialist assessment rather than assuming the fissure is uncomplicated. DRE may be appropriate later if another anorectal diagnosis needs considering"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"red", h:"⚠ Beyond a simple fissure", html:"Perianal abscess or fistula, systemic illness or immunosuppression → urgent assessment. Diarrhoea, abdominal pain or perianal Crohn's features → gastroenterology."},
         {tone:"purple", h:"Colorectal cancer features <span class='tw'>Suspected cancer</span>", html:"A fissure does not exclude colorectal pathology. Offer <b>FIT</b> in line with the <b>NICE NG12</b> criteria — an abdominal mass, change in bowel habit or iron-deficiency anaemia; age 40 and over with unexplained weight loss and abdominal pain; under 50 with rectal bleeding plus abdominal pain or weight loss; 50 and over with rectal bleeding, abdominal pain or weight loss; 60 and over with anaemia even without iron deficiency — and refer on the suspected colorectal cancer pathway if FIT is ≥10 µg Hb/g. FIT is a triage tool, not the sole arbiter: <b>do not delay referral because of a negative or unavailable FIT</b> when there is a rectal or abdominal mass, unexplained anal mass or ulceration, persistent strong clinical concern or progressive symptoms. See <a href='haemorrhoids.html'>haemorrhoids</a>."}
       ]}
     ]},

    {id:"nondrug", nav:"Soften", title:"Step 2 — individualised stool softening",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"🌾 Soft, easily passed stools", html:"Aim for soft, easily passed stools. Increase dietary fibre gradually if appropriate, but use or add an <b>osmotic laxative</b> when stools remain hard, constipation is significant or fibre is poorly tolerated; titrate to avoid diarrhoea. Encourage appropriate fluids, but do not prescribe a fixed volume — individualise for heart failure, CKD, frailty, fluid restriction or diarrhoeal illness. Fibre is not always required: it may worsen pain or bloating and is inappropriate in some patients with faecal loading or obstructive symptoms."},
         {tone:"blue", h:"💊 Match treatment to the bowel problem", html:"Hard stool: macrogol or another osmotic laxative · faecal loading or impaction: assess and treat appropriately · slow-transit constipation: consider adding a stimulant if required · diarrhoea: avoid excessive laxative dosing and reconsider inflammatory or infective disease · opioid-related constipation: address opioid use and follow the relevant pathway."},
         {tone:"amber", h:"🚽 Don't strain", html:"Avoid straining and prolonged sitting on the toilet; respond to the urge."},
         {tone:"green", h:"🛁 Warm baths", html:"Warm sitz baths may provide symptomatic relief — not a proven healing treatment."},
         {tone:"blue", h:"🧴 Short topical anaesthetic", html:"Lidocaine before defecation for severe pain — symptomatic treatment only. Use for a short course, generally no more than 1–2 weeks, and reassess if pain persists. Prolonged topical anaesthetic use can delay reconsideration of the diagnosis and may cause local irritation or sensitisation."},
         {tone:"green", h:"🔁 Keep going after healing", html:"Stool regulation may need to continue after healing because recurrence is common."}
       ]}
     ]},

    {id:"drug", nav:"Topical", title:"Step 3 — topical sphincter relaxants",
     blocks:[
       {b:"table", head:["Treatment","How","Notes"], rows:[
         ["<b>Rectogesic (GTN 0.4%) rectal ointment</b> — GM first choice, prescribe by brand","Every 12 hours using the 2.5 cm dosing line; apply the measured amount gently inside the anal canal using a finger covering, not merely to the external skin; maximum 8 weeks in adults (current SPC)","Licensed for pain associated with chronic anal fissure, after conservative treatment has failed; the SPC reports modest pain benefit and no statistically significant healing effect versus placebo — it may facilitate healing by reducing internal sphincter tone. Stop if bleeding associated with haemorrhoids increases; persistent anal pain warrants reconsidering the diagnosis. Continue stool softening and reassess. Not for under-18s"],
         ["<b>Diltiazem 2%</b> cream or ointment","Twice daily for about 6–8 weeks","<b>Unlicensed</b> — prescribe only under the local unlicensed/specials process per the GM formulary, and tell the patient the indication is unlicensed. Check product concentration, formulation and application instructions carefully. Used where GTN is not tolerated or unsuitable, but not automatically equivalent to GTN in every patient. Topical diltiazem is generally regarded as compatible with breastfeeding by specialist medicines advice (SPS). Local irritation, pruritus or dermatitis can occur"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"red", h:"⚠ GTN — SPC contraindications", html:"Hypersensitivity · concomitant PDE-5 inhibitor (sildenafil, tadalafil, vardenafil) · other organic nitrates or nitric oxide donors · hypotension, postural hypotension or uncorrected hypovolaemia · increased intracranial pressure · migraine or recurrent headache · aortic or mitral stenosis · hypertrophic obstructive cardiomyopathy · constrictive pericarditis or tamponade · marked anaemia · closed-angle glaucoma · pregnancy. Breastfeeding: avoid unless specialist advice supports its use."},
         {tone:"amber", h:"⚠ GTN — cautions and warnings", html:"Use caution or seek specialist advice in severe hepatic or renal disease and significant cardiovascular disease. Headache is very common (around 57% in SPC trials) and may be severe. Dizziness and postural hypotension — take care driving. Additive hypotension with antihypertensives, diuretics, beta-blockers, ACE inhibitors, calcium-channel blockers, tricyclics, alcohol and sedatives."}
       ]}
     ]},

    {id:"monitor", nav:"Review", title:"Step 4 — review at 6–8 weeks",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["<b>Pain and healing</b>","6–8 weeks","Healing, or persisting symptoms?"],
         ["<b>GTN tolerability</b>","On GTN","Headache or other intolerance → stop; diltiazem or referral"],
         ["<b>Stool consistency</b>","Ongoing","Keep soft — essential to healing and recurrence prevention"],
         ["<b>Atypical features</b>","If not healing","Reconsider the diagnosis and refer"]
       ]}
     ]},

    {id:"nothealing", nav:"Not healing?", title:"Not healing? Re-check before referral",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"1 · Stool soft?", html:"Genuinely soft stools, with an osmotic laxative if needed?"},
         {tone:"amber", h:"2 · Adequate course?", html:"Topical treatment used as directed for its course?"},
         {tone:"red", h:"3 · Tolerated?", html:"GTN stopped early because of headache → diltiazem."},
         {tone:"amber", h:"4 · Atypical?", html:"Lateral, multiple, painless, indurated or large → reconsider the cause."},
         {tone:"blue", h:"5 · Refer", html:"Persistent fissure → colorectal assessment."}
       ]}
     ]},

    {id:"safety", nav:"Safety-net", title:"Safety-netting",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Atypical bleeding or bowel change", html:"\"Blood mixed in with your stool, a change in bowel habit, weight loss or tiredness — come back so we can look further.\""},
         {tone:"red", h:"🔴 Swelling, fever or discharge", html:"\"A painful swelling, fever or discharge near the back passage needs to be seen urgently.\""},
         {tone:"amber", h:"🤕 GTN headache", html:"\"The GTN ointment often causes headaches — if it does, tell us and we'll switch you.\""},
         {tone:"green", h:"🌾 Soft stool", html:"\"Keeping stools soft is the key — keep it up even once it heals.\""}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"When to refer",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"Colorectal surgery", html:"Practical referral guidance (local/secondary-care pathway, not a national absolute): refer for colorectal assessment if pain persists after approximately 6–8 weeks of appropriate conservative and topical treatment, or earlier if symptoms are severe, recurrent or atypical. Consider referral for a fissure that remains visibly unhealed after approximately 12–16 weeks, even if symptoms have settled. Treatment selection is specialist-led — botulinum toxin, lateral internal sphincterotomy, fissurectomy or advancement flap — and depends on continence symptoms, previous obstetric sphincter injury, age, baseline sphincter function, fissure characteristics, Crohn's disease, previous surgery and prior treatment response. Sphincterotomy is highly effective but carries an important risk of flatus or faecal incontinence, particularly in higher-risk patients — a shared decision."},
         {tone:"red", h:"Refer earlier", html:"Recurrent fissure · suspected Crohn's disease · immunosuppression · atypical site or appearance · significant continence risk · older adults with an unusual or non-healing lesion · diagnostic uncertainty · abscess, fistula or systemic illness."},
         {tone:"amber", h:"Atypical fissure", html:"Consider Crohn's, infection, inflammatory disease, immunosuppression or malignancy → appropriate referral. See <a href='crohns-disease.html'>Crohn's disease</a>."},
         {tone:"amber", h:"Children", html:"This is an adult pathway. In children, constipation management (with analgesia) is usually the initial treatment, but persistent, recurrent, severe, atypical or bleeding fissures require paediatric assessment (paediatrics or paediatric surgery). Do not apply adult GTN or surgical thresholds automatically, and do not use Rectogesic routinely under 18. See <a href='constipation-child.html'>constipation in children</a>."},
         {tone:"cream", h:"GP management", html:"Diagnosis and the atypical check, individualised stool softening, short topical anaesthetic, the topical relaxant with its counselling, and the review belong here. Related pages: <a href='haemorrhoids.html'>haemorrhoids</a> · <a href='constipation-adult.html'>constipation</a> · <a href='crohns-disease.html'>Crohn's disease</a> · <a href='ibs.html'>IBS</a>."}
       ]},
       {b:"say", html:"This is a small tear, kept open by hard stools and muscle spasm — so the key is keeping your stools soft. If it doesn't settle, an ointment that relaxes the muscle can ease the pain; it often causes headaches, so tell me if it does and we'll switch."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 29-year-old woman has 3 months of severe pain on opening her bowels with bright-red blood on the paper. She was prescribed <b>Rectogesic</b> six weeks ago, used it for <b>five days and stopped because of severe headaches</b>, and assumed it had not worked. She is <b>still constipated</b> and takes no laxative. Gentle inspection shows a <b>posterior midline fissure with a skin tag</b>."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Recognises a chronic fissure; identifies headache, not inefficacy, as why the course stopped; checks contraindications and pregnancy plans; explains that Rectogesic is licensed for pain relief, not proven healing; offers diltiazem 2%, explaining it is unlicensed; treats the constipation with an osmotic laxative rather than fibre alone; examines gently without forcing a DRE; confirms the typical site; asks about colorectal red flags; safety-nets and reviews at 6–8 weeks, with colorectal referral if it persists."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>MHRA SPC — Rectogesic 4 mg/g rectal ointment (PL 21727/0112)</b><br><a href="https://products.mhra.gov.uk" rel="noopener">products.mhra.gov.uk</a><span class="rd"> — indication (pain in chronic fissure after conservative treatment fails), healing not statistically different from placebo, dosing and intra-anal application, 8-week maximum, headache in ~57%, contraindications separated from cautions, interactions, stop if haemorrhoidal bleeding increases, pregnancy and breastfeeding, under-18s</span></li>'+
         '<li><b>Greater Manchester Medicines Management Group formulary — gastro-intestinal system</b><br><a href="https://www.greatermanchesterformulary.nhs.uk" rel="noopener">greatermanchesterformulary.nhs.uk</a><span class="rd"> — Rectogesic first choice by brand; diltiazem 2% unlicensed (check the current version date)</span></li>'+
         '<li><b>NHS Specialist Pharmacy Service (SPS) — diltiazem</b><br><a href="https://www.sps.nhs.uk" rel="noopener">sps.nhs.uk</a><span class="rd"> — topical diltiazem and breastfeeding</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (May 2025)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — FIT age and symptom criteria and colorectal referral; rectal and anal mass or ulceration</span></li>'+
         '<li><b>ACPGBI/BSG — Faecal immunochemical testing in patients with signs or symptoms of suspected colorectal cancer</b> (Gut, July 2022)<br><a href="https://doi.org/10.1136/gutjnl-2022-327985" rel="noopener">doi.org/10.1136/gutjnl-2022-327985</a><span class="rd"> — FIT is a triage tool and must not be the sole arbiter of referral</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — laxative classes and topical anaesthetic preparations</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Anal fissure in adults. Individualised stool softening — an osmotic laxative if fibre alone is not enough — is the foundation. If symptoms persist despite conservative treatment, or the fissure is chronic or recurrent: consider Rectogesic 0.4% (licensed for pain; no statistically significant healing benefit versus placebo; headache very common; not with PDE-5 inhibitors; not in pregnancy or under 18) or unlicensed diltiazem 2%. Atypical fissures and colorectal red flags change the pathway (NICE NG12). Persistent fissure → colorectal assessment, where the procedure is chosen individually. Sources: MHRA SPC, Greater Manchester formulary, SPS, NICE NG12, ACPGBI/BSG FIT guideline, BNF."
});
</script>
