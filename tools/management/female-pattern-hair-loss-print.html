MG.render({
  icon:"\u{1F487}",
  title:"Female Pattern Hair Loss",
  eyebrow:"Protocol · assess and counsel in one place",
  stemTitle:"Female pattern hair loss — is it really the pattern, is anything feeding it, and is there androgen excess behind it?",
  stemSub:"Female pattern hair loss is a gradual thinning over the crown and central parting, with the frontal hairline usually kept. It is common, benign and often very upsetting. The GP adds value in three ways: telling it apart from telogen effluvium, alopecia areata and the scarring alopecias; checking iron and thyroid when the history suggests a contributor; and noticing the woman whose thinning comes with acne, hirsutism, irregular periods or — rarely, and urgently — virilisation. Topical minoxidil is the main licensed pharmacological treatment and is generally bought over the counter once a compatible diagnosis is established; antiandrogens and oral minoxidil are off-label and specialist-led.",
  guideline:"PCDS Hair Loss Pathway 2024 · BAD leaflet (female pattern) Oct 2024 · Society for Endocrinology androgen excess 2025 · Drug Tariff Part XVIIIA",
  meta:[
    {t:"PCDS Hair Loss Pathway (Nov 2024)"},
    {t:"BAD leaflets 2024 to 2025 · BAD alopecia areata 2025"},
    {t:"Society for Endocrinology 2025 · BSG IDA 2021"},
    {t:"International PCOS guideline 2023 (international)"},
    {t:"NG12: only if a pelvic or abdominal mass is found", tone:"tw"}
  ],
  lead:"<div class='mg-layers'><a href='#pattern'><b>Is it the pattern?</b><small>Parting, not patches</small></a><a href='#redflags'><b>Red flags</b><small>Scarring, virilisation</small></a><a href='#tests'><b>Tests</b><small>Selective: ferritin, TFTs, androgens if indicated</small></a><a href='#treat'><b>Treat</b><small>Minoxidil, OTC</small></a></div>",
  quickSub:"Six cards to hold in your head. Sources are listed under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"blue", h:"The shape: a widening parting", html:"Diffuse thinning over the crown and central scalp, so the central parting gets wider. The frontal hairline is usually kept (the Ludwig pattern). Sometimes the widening reaches the front in a ‘Christmas tree’ shape. The scalp itself looks normal. Severity can be graded on the Ludwig (3-point) or Sinclair (5-point) scale.", src:"PCDS male and female pattern alopecia"},
    {tone:"amber", h:"Scarring changes everything", html:"Redness or scale around follicles, shiny skin with no follicle openings, a receding frontal band with eyebrow loss, or a painful or itchy scalp suggests <b>scarring alopecia</b>. Refer for <b>expedited dermatology assessment</b> via the local pathway (not a suspected-cancer referral), because the loss cannot be reversed once follicles scar. Do not delay for blood tests or a treatment trial.", src:"PCDS Hair Loss Pathway 2024"},
    {tone:"blue", h:"Check what could be adding to it", html:"Typical pattern loss with a normal scalp and no systemic features often needs no blood tests. For diffuse shedding, fatigue, dietary risk or heavy periods, check <b>FBC and ferritin, ± thyroid function</b> (PCDS). Ferritin is the most useful single marker of iron deficiency, but it can read falsely normal during inflammation, when transferrin saturation helps. Treat confirmed iron deficiency or thyroid disease according to the relevant guideline, explaining that correcting an abnormality may reduce shedding but may not reverse established female pattern hair loss. Telogen effluvium can sit on top of pattern loss.", src:"PCDS alopecia overview · BSG IDA guideline 2021"},
    {tone:"amber", h:"Rapid virilisation is a tumour until proven otherwise", html:"New and fast-progressing hair loss with a deepening voice, clitoromegaly, increased muscle bulk or rapidly worsening hirsutism points to an <b>androgen-secreting tumour</b>. This requires <b>urgent endocrine and/or gynaecological assessment</b> according to the local pathway. If total testosterone is markedly raised, for example <b>above approximately 5 nmol/L</b>, discuss urgently with endocrinology and confirm with an appropriate assay (preferably LC-MS/MS), interpreting it alongside SHBG, free testosterone/FAI, DHEAS and the clinical picture (<a href='https://onlinelibrary.wiley.com/doi/full/10.1111/cen.15265' rel='noopener'>Society for Endocrinology 2025</a>). The threshold supports, and does not replace, clinical judgement.", src:"Society for Endocrinology androgen excess guideline 2025"},
    {tone:"cream", h:"Topical minoxidil, usually over the counter", html:"Topical minoxidil is the main licensed pharmacological treatment for female pattern hair loss in the UK and is generally obtained over the counter. Use it only after a compatible diagnosis has been established. Regaine for Women 2% solution: 1 ml twice daily. Regaine for Women 5% foam: 1 g once daily. Both are licensed for women aged 18 to 65. Allow 6 to 12 months, and expect some shedding at first. Any gain lasts only while she uses it. Prescribing position (review at each update): nationally, the solution is in Drug Tariff Part XVIIIA and cannot be prescribed on an FP10; locally, Greater Manchester lists the foam as do-not-prescribe (a local commissioning decision, not a national rule).", src:"Regaine for Women SPC (emc 102, 5082) · Drug Tariff Part XVIIIA · GMMMG Sept 2022 (local)"},
    {tone:"green", h:"The distress is real, so name it", html:"Hair loss in women is often more distressing than its clinical severity suggests. Acknowledge that, ask about mood, and point her to camouflage, styling and wig options and to patient support. Explain that treatment slows and stabilises the loss rather than restoring the hair she had at 20.", src:"BAD leaflet (female pattern) Oct 2024"}
  ],
  pathwaySub:"Five moves. The red step is the one that most often gets missed.",
  pathway:[
    {title:"Take the story that separates the causes", html:"Is it gradual thinning over years, or sudden handfuls in the shower? Ask about any trigger 2 to 6 months earlier (childbirth, fever, surgery, crash dieting, a new drug, severe stress), periods and fertility, acne and body hair, a family history of thinning, hair-styling practices (tight braids, weaves, extensions, relaxers, heat), pregnancy or recent childbirth, diet, weight loss and eating-disorder risk, medications, and the psychological and social effect on her life."},
    {title:"Examine the scalp, the face and the body", html:"Look at the parting from above, the frontal hairline, eyebrows and eyelashes, and the scalp surface (follicular openings, perifollicular redness or scale, scarring, broken hairs, discrete patches, signs of traction). Look for signs of androgen excess: acne, hirsutism and acanthosis nigricans. <b>Check for virilisation: a deepening voice, clitoromegaly, increased muscle bulk, male-pattern balding at the temples.</b> If any of these are present, examine the abdomen and pelvis for a mass. Virilisation and scarring are the two findings that change the destination.", alert:true},
    {title:"Test for the things that add to it", html:"Test selectively. Typical pattern loss with no systemic or androgenic features: often no blood tests. Diffuse shedding or systemic features: FBC, ferritin and TSH, adding tests according to the history (PCDS). Add a total testosterone and SHBG, with a calculated free androgen index, <b>only if</b> there are signs of hyperandrogenism, irregular periods or virilisation; consider DHEAS and androstenedione through the relevant pathway. Combined hormonal contraception makes androgen results hard to interpret, but she should not stop it without specialist discussion and alternative contraception."},
    {title:"Treat the contributors, then the hair", html:"Treat confirmed iron deficiency or thyroid disease according to the relevant guideline (investigating the cause of iron deficiency), explaining that this may reduce shedding but may not reverse established pattern loss, and review drugs and styling. Then, once a compatible diagnosis is established and red flags are excluded, offer topical minoxidil, generally bought over the counter, and explain the licensed regimen, the early shed and the 6-to-12-month timescale. Where PCOS is present, manage it in its own right."},
    {title:"Know who needs a specialist", html:"Rapid or late-onset virilisation, marked biochemical androgen excess or rapidly progressive androgenic features require urgent endocrine and/or gynaecological assessment according to the local pathway. Suspected active scarring alopecia: expedited dermatology assessment; do not delay for a treatment trial. Routine dermatology: diagnostic doubt, progression despite a proper minoxidil trial, significant psychological impact, or when antiandrogens or oral minoxidil are being considered, because these are off-label and specialist-led."}
  ],
  sections:[
    {id:"pattern", nav:"Recognise it", title:"Recognising female pattern hair loss", sub:"A clinical diagnosis based on the shape and pace of the thinning and a normal scalp surface.",
     blocks:[
       {b:"kv", rows:[
         ["What is happening","A mix of genetic and hormonal factors makes affected follicles produce hairs that are progressively finer, shorter and paler. In the end some follicles stop producing visible hair. Most women with it have normal androgen levels."],
         ["The shape","Diffuse thinning over the crown and central scalp with a widening central parting. The frontal hairline is usually kept (Ludwig pattern), though the thinning can widen towards the front (‘Christmas tree’ pattern). Some women show a male-type pattern with temple recession, which should prompt a look for androgen excess."],
         ["The pace","Gradual, over months to years. Heavy shedding over weeks suggests telogen effluvium, either alone or on top of pattern loss."],
         ["Grading","Ludwig (3-point) or Sinclair (5-point) scale. Standard photographs of the parting from above let you track change over time."],
         ["Associations","PCOS is the most common endocrine association considered when female pattern hair loss occurs with irregular cycles, acne or hirsutism, but most women with female pattern hair loss do not have biochemical hyperandrogenism. The PCOS guideline counts scalp pattern loss as a sign of hyperandrogenism."]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"A clinical diagnosis, not a blood-test one", html:"Female pattern hair loss is usually diagnosed clinically. Do not routinely request a full androgen panel when the pattern is typical and there are no clinical features of hyperandrogenism. Test androgens when the history or examination points to hyperandrogenism: irregular periods, acne, hirsutism, infertility, or a male-type pattern.", src:"PCDS male and female pattern alopecia"},
         {tone:"blue", h:"Telogen effluvium can hide it", html:"Acute telogen effluvium commonly begins approximately 2 to 4 months after a trigger such as childbirth, fever, surgery, dieting or a new drug. Shedding often improves over several months once the cause has resolved, but visible density may take longer to recover. Persistent shedding beyond 6 to 9 months should prompt reassessment for ongoing triggers, iron deficiency, thyroid disease, medication effects or coexisting pattern hair loss.", src:"PCDS Hair Loss Pathway 2024 · BAD telogen effluvium leaflet Oct 2025"}
       ]},
       {b:"why", html:"A woman who presents with ‘my hair is falling out’ may have pattern loss, telogen effluvium, both, or a scarring process. The history of <b>thinning</b> (gradual, over years) versus <b>shedding</b> (handfuls, over weeks), plus a close look at the scalp surface, sorts most of them. Blood tests find the things that feed the loss, and they are not how the pattern is diagnosed."}
     ]},

    {id:"redflags", nav:"Red flags", title:"Red flags and mimics", sub:"Two findings need prompt specialist assessment: scarring (expedited dermatology) and virilisation (urgent endocrine and/or gynaecology). The rest are differentials to name correctly.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"Suspected active scarring alopecia — expedited dermatology", html:"Loss of follicle openings, shiny skin, redness or scale around follicles, pustules, or a burning, painful or itchy scalp. In a postmenopausal woman, a receding frontal band with eyebrow loss suggests frontal fibrosing alopecia. Others include lichen planopilaris and discoid lupus. <b>Expedited dermatology referral</b> using the local referral pathway (see the <a href='https://www.pcds.org.uk/files/general/Hair-Loss-Pathway-web.pdf' rel='noopener'>PCDS Hair Loss Pathway</a>), specifying the signs of inflammation or scarring, because scarred follicles do not recover. Do not delay referral while waiting for blood tests or a therapeutic trial. If the diagnosis is uncertain, dermatology may arrange trichoscopy and scalp biopsy; biopsy should not be delayed where active scarring is suspected.", src:"PCDS Hair Loss Pathway 2024"},
         {tone:"amber", h:"Virilisation — urgent endocrine and/or gynaecology", html:"Rapid onset, or onset late in life, with a deepening voice, clitoromegaly, increased muscle bulk, male-pattern balding or quickly worsening hirsutism. The Society for Endocrinology links this picture to androgen-secreting ovarian or adrenal tumours, and says a tumour becomes a bigger concern after the menopause. This needs urgent endocrine and/or gynaecological assessment according to the local pathway. If total testosterone is markedly raised, for example <b>above approximately 5 nmol/L</b>, discuss urgently with endocrinology and confirm using an appropriate assay (preferably LC-MS/MS), interpreting it alongside SHBG, free testosterone/FAI, DHEAS and the clinical picture. DHEAS is particularly helpful where an adrenal source is suspected; markedly elevated DHEAS, rapid virilisation or a postmenopausal presentation should lower the threshold for urgent specialist assessment. Examine the abdomen and pelvis: a mass there changes the route (see the NG12 card below).", src:"Society for Endocrinology androgen excess guideline 2025"},
         {tone:"blue", h:"Alopecia areata", html:"Well-defined patches, sometimes diffuse. Exclamation-mark hairs, eyebrow or eyelash involvement, and nail pitting. Assess and manage it using the BAD living guideline, not this page. It is usually non-scarring, and a patch alone does not generally need urgent referral; referral urgency depends on rapid progression, extensive involvement, eyebrow or eyelash loss, nail disease, psychological impact and diagnostic uncertainty. Document severity, photographs, quality of life and psychological distress. Specialist pathways now include assessment for JAK inhibitor eligibility.", src:"BAD alopecia areata living guideline 2025"},
         {tone:"blue", h:"Traction alopecia", html:"Thinning along the frontal and temporal margins, or wherever hair is pulled by tight braids, weaves, extensions or ponytails. Early traction loss recovers if the tension stops, but long-standing traction can scar. Ask about styling in every woman with marginal thinning."},
         {tone:"blue", h:"Tinea capitis", html:"Scale, broken hairs, black dots, pustules or a kerion. It is commoner in children but does occur in adults. Take scrapings and plucked hairs for mycology. It needs oral antifungal treatment; do not rely on topical treatment alone. In an adult with suspected tinea capitis, particularly if immunosuppressed or in contact with children, take samples and discuss treatment with dermatology or microbiology. Kerion, pain, pustules or scarring risk warrants urgent specialist advice.", src:"BAD tinea capitis guideline 2014"},
         {tone:"purple", h:"NG12 — only if examination finds a mass", html:"Hair loss and virilisation are not NG12 criteria in themselves, so the usual route is urgent endocrinology and/or gynaecology according to the local pathway. But if physical examination finds <b>ascites and/or a pelvic or abdominal mass (which is not obviously uterine fibroids)</b>, NG12 recommendation 1.5.1 applies: refer to a gynaecological cancer service using a suspected cancer pathway referral. Restated in <a href='#refer'>Refer</a>.", src:"NICE NG12 (updated April 2026) rec 1.5.1"}
       ]},
       {b:"warn", html:"<b>Do not start minoxidil and wait</b> in a woman with scarring features or virilisation. The Regaine SPCs themselves exclude loss that is sudden, patchy, of unknown cause, or linked to childbirth, as well as use on an inflamed scalp."}
     ]},

    {id:"tests", nav:"Tests", title:"Investigations — what, when and why", sub:"Test for the things that add to the loss or change the diagnosis. Pattern loss itself has no blood test.",
     blocks:[
       {b:"table", head:["Test","When","What it tells you"], rows:[
         ["<b>Often no blood tests</b>","Typical female pattern loss, normal scalp, no systemic or androgenic features","The diagnosis is clinical. Test only when the history or examination suggests a contributor or another diagnosis."],
         ["<b>FBC and ferritin</b>","Diffuse shedding, telogen effluvium, fatigue, dietary risk or heavy menstrual bleeding (PCDS)","Iron deficiency, with or without anaemia, causes diffuse shedding. Ferritin is the single most useful marker, but inflammation can push it into the normal range falsely. Add transferrin saturation if you suspect this. If iron deficiency is confirmed, investigate the cause (BSG 2021), which in a premenopausal woman usually means reviewing menstrual loss and diet, and considering coeliac serology. Do not prescribe iron solely to achieve an arbitrary ferritin target for hair growth."],
         ["<b>Thyroid function</b>","Symptoms or signs of thyroid disease, or diffuse shedding (PCDS); TSH ± further tests according to the result","Both under- and overactive thyroid disease affect hair growth."],
         ["<b>U&amp;E, LFT, zinc, vitamin D, B12/folate, coeliac serology</b>","Consider only where the clinical history, examination or initial results suggest a nutritional, systemic, renal, hepatic or malabsorptive cause","Not a routine panel for typical pattern loss."],
         ["<b>Total testosterone and SHBG, with free androgen index</b>","Only if there are signs of hyperandrogenism, irregular periods or virilisation","The international PCOS guideline (2023) makes total and free testosterone (or the FAI) the first-line tests for biochemical hyperandrogenism. If these are normal and suspicion stays high, androstenedione and DHEAS can be considered; DHEAS is particularly helpful where an adrenal source is suspected. Interpret every hormone result against the laboratory reference range, assay method and menopausal status."],
         ["<b>Markedly raised testosterone (for example above approximately 5 nmol/L)</b>","Interpret with assay method, reference range, menopausal status, timing, SHBG, FAI and any virilisation","Discuss urgently with endocrinology; confirm using an appropriate assay (preferably LC-MS/MS), with ovarian or adrenal imaging as appropriate (<a href='https://onlinelibrary.wiley.com/doi/full/10.1111/cen.15265' rel='noopener'>Society for Endocrinology 2025</a>). Not an automatic same-day referral rule for every result."]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"The combined pill spoils the androgen result", html:"Combined hormonal contraception increases SHBG and suppresses ovarian androgen production, making biochemical androgen assessment difficult. Stopping it is not always necessary, may worsen symptoms and removes contraception. If biochemical testing is essential, discuss with endocrinology or gynaecology whether a three-month withdrawal is appropriate, ensuring alternative contraception. Do not delay urgent investigation when virilisation or a tumour is suspected.", src:"International PCOS guideline 2023 (international)"},
         {tone:"blue", h:"Ferritin: treat confirmed deficiency, not a hair target", html:"The BSG guideline makes ferritin the key marker and says a good haemoglobin response to iron supports true iron deficiency. There is no established UK ferritin target for hair growth, and evidence that iron replacement improves isolated female pattern hair loss is limited. <b>Treat confirmed iron deficiency according to standard haematology practice and investigate its cause. Do not prescribe iron solely to achieve an arbitrary ferritin target for hair growth.</b>", src:"BSG IDA guideline 2021 (Snook, Gut)"}
       ]}
     ]},

    {id:"treat", nav:"Treatment", title:"Treatment — the stepwise approach", sub:"Deal with what adds to the loss, then use minoxidil. Anything beyond that is off-label and specialist-led.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Step 1", title:"Correct what adds to it", when:"everyone", fromLabel:"first", html:"Treat confirmed iron deficiency and investigate why it was low (not to an arbitrary ferritin target for hair). Treat confirmed thyroid disease. Review drugs that can cause shedding. Advise easing styling tension and harsh chemical treatments. If she has PCOS, manage it in its own right."},
         {step:"Step 2", title:"Topical minoxidil", when:"first-line once a compatible diagnosis is established", fromLabel:"over the counter", html:"<b>Regaine for Women 2% solution: 1 ml twice daily</b> to the affected scalp (maximum 2 ml a day), or <b>Regaine for Women 5% foam: 1 g (half a capful) once daily</b> (maximum 1 g a day). Both are licensed for women aged 18 to 65 (<a href='https://www.medicines.org.uk/emc/product/102/smpc' rel='noopener'>2% SPC</a> · <a href='https://www.medicines.org.uk/emc/product/5082/smpc' rel='noopener'>5% foam SPC</a>). The PCDS suggests the 5% formulation once daily for women, although some use it twice daily. Apply to a dry scalp, wipe off any that runs onto the forehead or cheeks, and wash hands afterwards. <b>Do not start it</b> when the diagnosis is uncertain, the loss is sudden or patchy, the scalp is inflamed, scarring is suspected, the loss is associated with recent childbirth, the cause is unknown, or there is untreated severe telogen effluvium."},
         {step:"Step 3", title:"PCOS with hyperandrogenism", when:"acne, hirsutism, irregular periods", fromLabel:"international PCOS guideline", html:"The combined pill is first-line drug treatment for the features of hyperandrogenism, alongside cosmetic measures. The PCOS guideline gives antiandrogens a limited role, when other treatment has failed or is unsuitable, and suggests they could be tried with the pill given the psychological impact of hair loss."},
         {step:"Step 4", title:"Specialist options", when:"progressing despite a 6 to 12 month minoxidil trial", fromLabel:"dermatology", html:"<b>Spironolactone</b> (the commonly used off-label antiandrogen in women) and <b>low-dose oral minoxidil</b> are off-label for this use and should be initiated by, or in consultation with, dermatology. <b>Do not initiate cyproterone acetate, flutamide, bicalutamide, finasteride or dutasteride in routine primary care</b> for female pattern hair loss: these require specialist assessment, pregnancy risk management where relevant, and drug-specific monitoring (cyproterone acetate: meningioma and thromboembolic considerations, and co-cyprindiol is not simply a hair-loss treatment; flutamide: potentially serious hepatotoxicity; bicalutamide: specialist-only with liver monitoring; finasteride and dutasteride: usually selected postmenopausal women). Any benefit is slow and is judged over many months."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"cream", h:"Setting expectations for minoxidil", html:"The foam SPC says it may take 12 to 24 weeks of once-daily use before any regrowth, and to stop if there is no improvement at 24 weeks. The 2% solution SPC says to stop if there is no improvement after a year. Response varies and is not guaranteed; benefit is most likely in those who start early while shedding is still active. It slows loss and thickens existing hair rather than reversing the pattern.", src:"Regaine for Women SPC (emc 102, 5082) · PCDS"},
         {tone:"amber", h:"Minoxidil side effects and cautions", html:"Scalp irritation, and unwanted facial hair where it spreads (the PCDS puts hypertrichosis at about 14%). Temporary extra shedding early on. Stop treatment and seek medical advice if there is significant tachycardia, hypotension, chest pain, marked dizziness, rapid weight gain or peripheral oedema. Do not use it in pregnancy or breastfeeding.", src:"Regaine for Women SPC (emc 5082) · PCDS"},
         {tone:"amber", h:"Spironolactone — what she needs to know", html:"Spironolactone is an off-label specialist treatment for female pattern hair loss. Discuss pregnancy intentions and advise avoidance during pregnancy, because of potential effects on a male fetus; stop and seek specialist advice if pregnancy occurs. Contraception should be discussed according to pregnancy risk and her circumstances, and is particularly relevant if spironolactone is combined with another antiandrogen. Check baseline renal function and potassium according to the specialist protocol. Hyperkalaemia risk rises with renal impairment, heart failure, ACE inhibitors, ARBs, potassium-sparing diuretics, trimethoprim and potassium supplements. Monitor blood pressure and ask about postural dizziness. Adverse effects include menstrual irregularity, breast tenderness, dizziness and fatigue. Prescribing follows the current SPC and local specialist protocol; the BAD leaflet is for patients.", src:"BAD spironolactone leaflet Aug 2025 · spironolactone SPC · BNF"},
         {tone:"blue", h:"Finasteride is not licensed for female pattern loss", html:"Finasteride is not licensed for female pattern hair loss, and the 1 mg SPC contraindicates it in women. Specialist off-label use may be considered in selected postmenopausal women. Women who are pregnant or may become pregnant must not handle crushed or broken tablets.", src:"Finasteride 1 mg (Propecia) SPC"}
       ]},
       {b:"warn", html:"<b>NHS supply:</b> minoxidil solution, cream, lotion and ointment are in <b>Drug Tariff Part XVIIIA</b> and cannot be prescribed on an FP10. Locally, GMMMG (Sept 2022) added minoxidil foam to the Greater Manchester do-not-prescribe list; this is local commissioning information, not a national rule, so check the current <a href='https://gmmmg.nhs.uk/' rel='noopener'>GMMMG formulary</a> at each update. She will usually buy it from a pharmacy, so say so early to avoid disappointment."}
     ]},

    {id:"oral-minoxidil", nav:"Oral minoxidil", title:"Low-dose oral minoxidil — answering her question", sub:"Widely discussed online and increasingly used by dermatologists, but off-label for hair loss.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"Off-label: initiate with specialist expertise", html:"Minoxidil tablets are licensed in the UK only for severe hypertension; use for hair loss is off-label. The BAD leaflet (October 2024) says recent research suggests low-dose oral minoxidil may be at least as effective as topical minoxidil, and well tolerated, in certain situations. Low-dose oral minoxidil should generally be initiated by, or in consultation with, dermatology or another clinician experienced in its use, and not routinely in primary care without that expertise and a local protocol. It requires patient-specific assessment of blood pressure, pulse, cardiovascular disease, renal disease, oedema risk, drug interactions and pregnancy status.", src:"BAD leaflet (female pattern) Oct 2024 · minoxidil tablets SPC"},
         {tone:"blue", h:"What the safety data show", html:"In a multicentre series of 1,404 patients (two-thirds women), hypertrichosis was the most common effect (15.1%). Lightheadedness, fluid retention and tachycardia were less common. 1.7% stopped because of adverse effects. The data are observational and come from Spain.", src:"International: Vañó-Galván et al., J Am Acad Dermatol 2021"},
         {tone:"cream", h:"If she is already taking it", html:"Record it. Check her blood pressure and pulse, and ask about swelling, palpitations and dizziness. Make sure the prescriber knows if she is pregnant or planning a pregnancy, or has heart disease. Leave dose changes to the prescriber.", src:"Minoxidil tablets SPC"}
       ]}
     ]},

    {id:"support", nav:"Support", title:"Living with it — camouflage and wellbeing", sub:"For many women this matters more than the prescription.",
     blocks:[
       {b:"tiles", v:"life", items:[
         {t:"Styling", html:"Change the parting, use volumising cuts and gentle products, and avoid tight styles and heat damage."},
         {t:"Camouflage", html:"Hair-thickening fibres, tinted scalp powders, toppers and wigs. Wigs are available on NHS prescription only in defined circumstances, with charges depending on local arrangements."},
         {t:"Mood", html:"Ask directly about low mood, anxiety and social withdrawal. Offer talking therapy where there is significant psychological impact."},
         {t:"Photographs", html:"Take standard photographs of the parting from above. Improvement is slow, and photographs help her see stabilisation that the mirror hides."}
       ]},
       {b:"say", html:"“This is female-pattern thinning. It’s common, it isn’t dangerous, and I can see how much it’s affecting you. If anything in your history suggests it, I’d like to check your iron and thyroid, because those can make it worse. The main treatment is minoxidil, which you buy from the chemist. It takes six months to a year to show, can cause a bit of extra shedding at first, and only keeps working while you use it.”"}
     ]},

    {id:"followup", nav:"Follow-up", title:"Follow-up", sub:"A slow condition needs a planned review, not an open-ended one.",
     blocks:[
       {b:"timeline", items:[
         {n:"1", when:"Week 0", title:"Baseline", html:"Take photographs, order any blood tests the history indicates, and agree the plan (minoxidil, correcting what adds to the loss, managing PCOS if present)."},
         {n:"2", when:"2 to 6 weeks", title:"Results and early shedding", html:"Act on the ferritin and thyroid results. Reassure her that the early shed from minoxidil is expected."},
         {n:"3", when:"About 6 months", title:"First judgement", html:"Compare the photographs. The foam SPC advises stopping if there is no improvement at 24 weeks. With the 2% solution she may continue up to a year."},
         {n:"4", when:"12 months", title:"Continue or escalate", html:"If it is stable or better, continue indefinitely. If it is still progressing, check she has been using it properly, repeat ferritin if needed, and refer to dermatology to discuss specialist options."},
         {n:"5", when:"Any time", title:"New features", html:"Scalp symptoms, patches, eyebrow loss or signs of virilisation mean going back to <a href='#redflags'>red flags</a>."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer", sub:"Who needs a specialist, and how quickly. Use the local Greater Manchester dermatology, endocrinology and gynaecology referral pathways for each route.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"Urgent endocrine and/or gynaecology", html:"Rapid or late-onset virilisation, marked biochemical androgen excess (for example total testosterone above approximately 5 nmol/L, confirmed on an appropriate assay) or rapidly progressive androgenic features, according to the local pathway. These raise the possibility of an androgen-secreting ovarian or adrenal tumour. <b>Same-day or urgent medical assessment</b> for severe virilisation with systemic features, rapidly progressive virilisation, or a suspected adrenal or ovarian tumour with a palpable mass or acute symptoms.", src:"Society for Endocrinology androgen excess guideline 2025"},
         {tone:"amber", h:"Expedited dermatology (local pathway)", html:"Suspected active scarring alopecia, including frontal fibrosing alopecia or lichen planopilaris; kerion or severe tinea capitis; rapidly progressive unexplained alopecia; diagnostic uncertainty where delay risks permanent loss. Refer according to the local pathway, specifying the signs of inflammation or scarring; this is not a suspected-cancer (2-week-wait) referral. The damage is permanent, and early treatment aims to halt it.", src:"PCDS Hair Loss Pathway 2024"},
         {tone:"blue", h:"Routine dermatology", html:"The diagnosis is uncertain, or the loss is still progressing despite 6 to 12 months of minoxidil used properly, or antiandrogens or oral minoxidil are being considered, or there is significant psychological or functional impact. Refer extensive or treatment-resistant alopecia areata according to the BAD living guideline.", src:"PCDS Hair Loss Pathway 2024 · BAD alopecia areata living guideline 2025"},
         {tone:"blue", h:"Gynaecology or endocrinology for PCOS", html:"If PCOS needs specialist input (for example fertility, or difficult hyperandrogenism), refer according to local pathways. Primary care can often manage it using the international PCOS guideline.", src:"International PCOS guideline 2023 (international)"},
         {tone:"purple", h:"Suspected cancer · NICE NG12 1.5.1 — pelvic or abdominal mass", html:"Make a referral to a gynaecological cancer service using a suspected cancer pathway referral if physical examination identifies <b>ascites and/or a pelvic or abdominal mass (which is not obviously uterine fibroids)</b>. Hair loss alone meets no NG12 criterion; without a mass, the tumour concern in virilisation goes through urgent endocrinology and/or gynaecology according to the local pathway.", src:"NICE NG12 (updated April 2026) rec 1.5.1"}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card. The Casebook holds the full case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 31-year-old woman says her parting has been getting wider over 2 years. She is tearful and has stopped going out. Her periods come every 6 to 10 weeks, she has acne on her jaw, and she takes the combined pill. On examination there is a widened central parting, the frontal hairline is intact, and the scalp is normal.", src:"PCDS Hair Loss Pathway 2024 · International PCOS guideline 2023 (international)"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Separates thinning from shedding and examines the scalp. <b>Acknowledges the distress and screens mood.</b> Links the periods and acne to possible PCOS. Explains that the combined pill makes androgen tests hard to read, and does not advise stopping it without specialist discussion and alternative contraception. Orders FBC, ferritin and thyroid function selectively, as the history indicates. Checks for virilisation. Explains OTC minoxidil (dose, early shed, 6 to 12 months, lifelong use). Plans photographs and a review.", src:"PCDS · BSG IDA guideline 2021 · Regaine for Women SPC"},
       {tone:"cream", h:"Common pitfall", html:"Ordering a full hormone panel on everyone while missing the scalp examination, or promising NHS-prescribed minoxidil.", src:"PCDS male and female pattern alopecia · Drug Tariff Part XVIIIA"},
       {tone:"cream", h:"One-line close", html:"“Let’s check what might be making it worse, start the lotion, and look at the photos together in six months. And if you’re feeling low about it, I want to know.”"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Sources for this page. Several statements rest on consensus guidance, patient information leaflets or local policy rather than primary research. Interpret all hormone results against the laboratory reference range and assay method.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>Primary Care Dermatology Society — Hair Loss: Primary Care Treatment Pathway (November 2024)<br><a href="https://www.pcds.org.uk/files/general/Hair-Loss-Pathway-web.pdf" rel="noopener">pcds.org.uk — Hair Loss Pathway</a><span class="rd"> — scarring versus non-scarring loss, expedited dermatology referral for suspected active scarring, telogen effluvium typically starting months after a trigger, with reassessment if shedding persists beyond 6 to 9 months</span></li>'+
         '<li>Primary Care Dermatology Society — Male pattern alopecia and female pattern alopecia, clinical guidance (web page, accessed Sep 2026)<br><a href="https://www.pcds.org.uk/clinical-guidance/alopecia-male-and-female-pattern-alopecia" rel="noopener">pcds.org.uk</a><span class="rd"> — Ludwig and Christmas-tree patterns, Ludwig and Sinclair scales, usually normal androgens, PCOS as the commonest endocrine association, 5% minoxidil once daily for women, hypertrichosis about 14%</span></li>'+
         '<li>Primary Care Dermatology Society — Alopecia: an overview (web page, accessed Sep 2026)<br><a href="https://www.pcds.org.uk/clinical-guidance/alopecia-an-overview" rel="noopener">pcds.org.uk</a><span class="rd"> — FBC, ferritin and TFT for diffuse loss; U&amp;E, LFT, zinc and vitamin D listed for women, depending on the history</span></li>'+
         '<li>British Association of Dermatologists — Patient information leaflet: Hair loss, female pattern (androgenetic alopecia) (October 2024)<br><a href="https://www.skinhealthinfo.org.uk/wp-content/uploads/2018/11/Hair-loss-female-pattern-PIL-Oct-24.pdf" rel="noopener">skinhealthinfo.org.uk</a><span class="rd"> — genetic and hormonal cause, miniaturisation, unlicensed antiandrogens, the statement on low-dose oral minoxidil</span></li>'+
         '<li>British Association of Dermatologists — Patient information leaflet: Spironolactone (updated August 2025)<br><a href="https://www.bad.org.uk/pils/spironolactone" rel="noopener">bad.org.uk</a><span class="rd"> — off-licence use; avoid in pregnancy and stop if pregnant (risk to a male fetus); side effects; patient-facing, so prescribing follows the SPC and local specialist protocol</span></li>'+
         '<li>British Association of Dermatologists — Patient information leaflet: Telogen effluvium (October 2025)<br><a href="https://www.bad.org.uk/patient-information-leaflets" rel="noopener">bad.org.uk</a></li>'+
         '<li>Harries MJ et al. — British Association of Dermatologists living guideline for managing people with alopecia areata 2025. Br J Dermatol 2026;194(2):e56–e73<br><a href="https://doi.org/10.1093/bjd/ljaf452" rel="noopener">doi.org/10.1093/bjd/ljaf452</a></li>'+
         '<li>Fuller LC et al. — British Association of Dermatologists’ guidelines for the management of tinea capitis 2014. Br J Dermatol 2014;171(3):454–463<br><a href="https://onlinelibrary.wiley.com/doi/10.1111/bjd.13196" rel="noopener">doi:10.1111/bjd.13196</a></li>'+
         '<li>Elhassan et al. — Society for Endocrinology Clinical Practice Guideline for the Evaluation of Androgen Excess in Women. Clin Endocrinol 2025 (doi:10.1111/cen.15265)<br><a href="https://onlinelibrary.wiley.com/doi/full/10.1111/cen.15265" rel="noopener">onlinelibrary.wiley.com</a><span class="rd"> — rapid or late-onset virilisation suggests an ovarian or adrenal tumour, a bigger concern after the menopause; testosterone above 5 nmol/L warrants further investigation (LC-MS/MS, imaging); urgent versus routine pathways</span></li>'+
         '<li>Teede HJ et al. — Recommendations from the 2023 International Evidence-based Guideline for the Assessment and Management of Polycystic Ovary Syndrome (international). J Clin Endocrinol Metab 2023;108(10):2447<br><a href="https://academic.oup.com/jcem/article/108/10/2447/7242360" rel="noopener">academic.oup.com/jcem</a><span class="rd"> — total and free testosterone first-line; androstenedione and DHEAS second-line; stop the combined pill for 3 months if androgen assessment is essential; Ludwig scale; combined pill first-line; limited role for antiandrogens</span></li>'+
         '<li>Snook J et al. — British Society of Gastroenterology guidelines for the management of iron deficiency anaemia in adults. Gut 2021;70:2030–2051<br><a href="https://pubmed.ncbi.nlm.nih.gov/34497146/" rel="noopener">PubMed 34497146</a><span class="rd"> — ferritin is the single most useful marker; transferrin saturation if a falsely normal ferritin is suspected</span></li>'+
         '<li>Regaine for Women Regular Strength 2% — SPC (emc 102); Regaine for Women Once a Day Scalp Foam 5% — SPC (emc 5082)<br><a href="https://www.medicines.org.uk/emc/product/102/smpc" rel="noopener">medicines.org.uk/emc/product/102</a> · <a href="https://www.medicines.org.uk/emc/product/5082/smpc" rel="noopener">medicines.org.uk/emc/product/5082</a><span class="rd"> — doses, ages 18 to 65, 12 to 24 weeks, stop if no improvement at 24 weeks (foam) or after 1 year (2%), exclusions, not for use in pregnancy</span></li>'+
         '<li>Finasteride 1 mg tablets (Propecia) — SPC (emc 2194)<br><a href="https://www.medicines.org.uk/emc/product/2194/smpc" rel="noopener">medicines.org.uk/emc/product/2194</a><span class="rd"> — contraindicated in women; handling of broken tablets</span></li>'+
         '<li>Minoxidil tablets — SPC (emc 13821)<br><a href="https://www.medicines.org.uk/emc/product/13821/smpc" rel="noopener">medicines.org.uk/emc/product/13821</a><span class="rd"> — licensed for severe hypertension only</span></li>'+
         '<li>Vañó-Galván S et al. — Safety of low-dose oral minoxidil for hair loss: a multicenter study of 1404 patients. J Am Acad Dermatol 2021;84(6):1644–1651 (international)<br><a href="https://pubmed.ncbi.nlm.nih.gov/33639244/" rel="noopener">PubMed 33639244</a></li>'+
         '<li>NHS Drug Tariff, Part XVIIIA (current edition, Sep 2026)<br><a href="https://www.nhsbsa.nhs.uk/pharmacies-gp-practices-and-appliance-contractors/drug-tariff" rel="noopener">nhsbsa.nhs.uk/drug-tariff</a><span class="rd"> — minoxidil cream, lotion, ointment and solution not prescribable</span></li>'+
         '<li>Greater Manchester Medicines Management Group — Recommendations from the September 2022 meeting<br><a href="https://gmmmg.nhs.uk/wp-content/uploads/2022/11/GMMMG-recommendations-from-September-2022-for-ICB-approval-fnl.pdf" rel="noopener">gmmmg.nhs.uk</a><span class="rd"> — minoxidil foam added to do-not-prescribe (local commissioning decision)</span></li>'+
         '<li>Greater Manchester Medicines Management Group — current formulary and do-not-prescribe list (check at each update)<br><a href="https://gmmmg.nhs.uk/" rel="noopener">gmmmg.nhs.uk</a></li>'+
         '<li>NICE NG12 — Suspected cancer: recognition and referral (updated April 2026)<br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — no criterion for hair loss itself; rec 1.5.1 (ascites or pelvic or abdominal mass) applies if a mass is found</span></li>'+
         '<li>BNF — minoxidil, spironolactone<br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Female pattern hair loss in primary care. Sources: PCDS Hair Loss Pathway (2024) and PCDS clinical guidance; BAD patient leaflets (2024 to 2025) and the BAD alopecia areata living guideline (2025); Society for Endocrinology androgen excess guideline (2025); BSG iron deficiency anaemia guideline (2021); International PCOS guideline (2023, international); minoxidil and finasteride SPCs; NHS Drug Tariff Part XVIIIA; GMMMG (2022). Check doses in the current BNF and SPC. This page does not replace clinical judgement."
