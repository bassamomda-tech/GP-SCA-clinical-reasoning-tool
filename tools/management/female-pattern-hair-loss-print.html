MG.render({
  icon:"\u{1F487}",
  title:"Female Pattern Hair Loss",
  eyebrow:"Protocol · assess and counsel in one place",
  stemTitle:"Female pattern hair loss — is it really the pattern, is anything feeding it, and is there androgen excess behind it?",
  stemSub:"Female pattern hair loss is a gradual thinning over the crown and central parting, with the frontal hairline usually kept. It is common, benign and often very upsetting. The GP adds value in three ways: telling it apart from telogen effluvium, alopecia areata and the scarring alopecias; checking iron and thyroid; and noticing the woman whose thinning comes with acne, hirsutism, irregular periods or — rarely, and urgently — virilisation. Treatment is minoxidil, bought over the counter, with antiandrogens reserved for specialists.",
  guideline:"PCDS Hair Loss Pathway 2024 · BAD leaflet (female pattern) Oct 2024 · Society for Endocrinology androgen excess 2025 · Drug Tariff Part XVIIIA",
  meta:[
    {t:"PCDS Hair Loss Pathway (Nov 2024)"},
    {t:"BAD leaflets 2024 to 2025 · BAD alopecia areata 2025"},
    {t:"Society for Endocrinology 2025 · BSG IDA 2021"},
    {t:"International PCOS guideline 2023 (international)"},
    {t:"NG12: only if a pelvic or abdominal mass is found", tone:"tw"}
  ],
  lead:"<div class='mg-layers'><a href='#pattern'><b>Is it the pattern?</b><small>Parting, not patches</small></a><a href='#redflags'><b>Red flags</b><small>Scarring, virilisation</small></a><a href='#tests'><b>Tests</b><small>Ferritin, TFTs, and androgens if needed</small></a><a href='#treat'><b>Treat</b><small>Minoxidil, OTC</small></a></div>",
  quickSub:"Six cards to hold in your head. Every figure links to a source under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"blue", h:"The shape: a widening parting", html:"Diffuse thinning over the crown and central scalp, so the central parting gets wider. The frontal hairline is usually kept (the Ludwig pattern). Sometimes the widening reaches the front in a ‘Christmas tree’ shape. The scalp itself looks normal. Severity can be graded on the Ludwig (3-point) or Sinclair (5-point) scale.", src:"PCDS male and female pattern alopecia"},
    {tone:"amber", h:"Scarring changes everything", html:"Redness or scale around follicles, shiny skin with no follicle openings, a receding frontal band with eyebrow loss, or a painful or itchy scalp suggests <b>scarring alopecia</b>. Refer urgently, because the loss cannot be reversed once follicles scar.", src:"PCDS Hair Loss Pathway 2024"},
    {tone:"blue", h:"Check what could be adding to it", html:"For diffuse loss, the PCDS asks for <b>FBC, ferritin and thyroid function</b>. Ferritin is the most useful single marker of iron deficiency, but it can read falsely normal during inflammation, when transferrin saturation helps. Correct what you find. Telogen effluvium can sit on top of pattern loss.", src:"PCDS alopecia overview · BSG IDA guideline 2021"},
    {tone:"amber", h:"Rapid virilisation is a tumour until proven otherwise", html:"New and fast-progressing hair loss with a deepening voice, clitoromegaly, increased muscle bulk or rapidly worsening hirsutism points to an <b>androgen-secreting tumour</b>. The Society for Endocrinology says a serum testosterone <b>above 5 nmol/L</b> warrants further investigation. Refer urgently to endocrinology.", src:"Society for Endocrinology androgen excess guideline 2025"},
    {tone:"cream", h:"Minoxidil is the treatment, from the pharmacy", html:"Regaine for Women 2% solution: 1 ml twice daily. Regaine for Women 5% foam: 1 g once daily. Both are licensed for women aged 18 to 65. Allow 6 to 12 months, and expect some shedding at first. Any gain lasts only while she uses it. The NHS does not prescribe it: the solution is in Drug Tariff Part XVIIIA and Greater Manchester lists the foam as do-not-prescribe.", src:"Regaine for Women SPC (emc 102, 5082) · GMMMG Sept 2022"},
    {tone:"green", h:"The distress is real, so name it", html:"Hair loss in women is often more distressing than its clinical severity suggests. Acknowledge that, ask about mood, and point her to camouflage, styling and wig options and to patient support. Explain that treatment slows and stabilises the loss rather than restoring the hair she had at 20.", src:"BAD leaflet (female pattern) Oct 2024"}
  ],
  pathwaySub:"Five moves. The red step is the one that most often gets missed.",
  pathway:[
    {title:"Take the story that separates the causes", html:"Is it gradual thinning over years, or sudden handfuls in the shower? Ask about any trigger 2 to 6 months earlier (childbirth, fever, surgery, crash dieting, a new drug, severe stress), periods and fertility, acne and body hair, a family history of thinning, hair-styling practices (tight braids, extensions, relaxers), diet, and the effect on her mood and life."},
    {title:"Examine the scalp, the face and the body", html:"Look at the parting from above, the frontal hairline, eyebrows and eyelashes, and the scalp surface (redness, scale, scarring, broken hairs, patches). Look for signs of androgen excess: acne, hirsutism and acanthosis nigricans. <b>Check for virilisation: a deepening voice, clitoromegaly, increased muscle bulk, male-pattern balding at the temples.</b> If any of these are present, examine the abdomen and pelvis for a mass. Virilisation and scarring are the two findings that change the destination.", alert:true},
    {title:"Test for the things that add to it", html:"FBC, ferritin and thyroid function for diffuse or pattern loss (PCDS). Add a testosterone and SHBG, with a free androgen index, <b>only if</b> there are signs of hyperandrogenism, irregular periods or virilisation. Combined hormonal contraception makes androgen results hard to interpret."},
    {title:"Treat the contributors, then the hair", html:"Correct iron deficiency and investigate its cause, treat thyroid disease, and review drugs and styling. Then offer topical minoxidil, bought over the counter, and explain the licensed regimen, the early shed and the 6-to-12-month timescale. Where PCOS is present, manage it in its own right."},
    {title:"Know who needs a specialist", html:"Urgent endocrinology: virilisation or very high testosterone. Urgent dermatology: scarring alopecia. Routine dermatology: diagnostic doubt, progression despite a proper minoxidil trial, or when antiandrogens or oral minoxidil are being considered, because these are unlicensed and specialist-led."}
  ],
  sections:[
    {id:"pattern", nav:"Recognise it", title:"Recognising female pattern hair loss", sub:"A clinical diagnosis based on the shape and pace of the thinning and a normal scalp surface.",
     blocks:[
       {b:"kv", rows:[
         ["What is happening","A mix of genetic and hormonal factors makes affected follicles produce hairs that are progressively finer, shorter and paler. In the end some follicles stop producing visible hair. Most women with it have normal androgen levels."],
         ["The shape","Diffuse thinning over the crown and central scalp with a widening central parting. The frontal hairline is usually kept (Ludwig pattern), though the thinning can widen towards the front (‘Christmas tree’ pattern). Some women show a male-type pattern with temple recession, which should prompt a look for androgen excess."],
         ["The pace","Gradual, over months to years. Heavy shedding over weeks suggests telogen effluvium, either alone or on top of pattern loss."],
         ["Grading","Ludwig (3-point) or Sinclair (5-point) scale. Standard photographs of the parting from above let you track change over time."],
         ["Associations","Most women with it have no endocrine disorder. When there is one, the most common is PCOS. The PCOS guideline counts scalp pattern loss as a sign of hyperandrogenism."]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Most women do not need androgen tests", html:"The PCDS notes that female pattern hair loss is usually not linked to raised androgens. Test androgens when the history or examination points to hyperandrogenism: irregular periods, acne, hirsutism, infertility, or a male-type pattern.", src:"PCDS male and female pattern alopecia"},
         {tone:"blue", h:"Telogen effluvium can hide it", html:"Acute telogen effluvium starts 2 to 6 months after a trigger such as childbirth, fever, surgery, dieting or a new drug, and usually settles 6 to 9 months after the trigger. If the hair does not recover, suspect underlying pattern loss or iron deficiency.", src:"PCDS Hair Loss Pathway 2024 · BAD telogen effluvium leaflet Oct 2025"}
       ]},
       {b:"why", html:"A woman who presents with ‘my hair is falling out’ may have pattern loss, telogen effluvium, both, or a scarring process. The history of <b>thinning</b> (gradual, over years) versus <b>shedding</b> (handfuls, over weeks), plus a close look at the scalp surface, sorts most of them. Blood tests find the things that feed the loss, and they are not how the pattern is diagnosed."}
     ]},

    {id:"redflags", nav:"Red flags", title:"Red flags and mimics", sub:"Two findings need urgent referral: scarring and virilisation. The rest are differentials to name correctly.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"Scarring (cicatricial) alopecia — urgent dermatology", html:"Loss of follicle openings, shiny skin, redness or scale around follicles, pustules, or a burning, painful or itchy scalp. In a postmenopausal woman, a receding frontal band with eyebrow loss suggests frontal fibrosing alopecia. Others include lichen planopilaris and discoid lupus. <b>Refer urgently</b>, because scarred follicles do not recover.", src:"PCDS Hair Loss Pathway 2024"},
         {tone:"amber", h:"Virilisation — urgent endocrinology", html:"Rapid onset, or onset late in life, with a deepening voice, clitoromegaly, increased muscle bulk, male-pattern balding or quickly worsening hirsutism. The Society for Endocrinology links this picture to androgen-secreting ovarian or adrenal tumours, and says a tumour becomes a bigger concern after the menopause. A testosterone <b>above 5 nmol/L</b> needs further investigation. Examine the abdomen and pelvis: a mass there changes the route (see the NG12 card below).", src:"Society for Endocrinology androgen excess guideline 2025"},
         {tone:"blue", h:"Alopecia areata", html:"Well-defined patches, sometimes diffuse. Exclamation-mark hairs, eyebrow or eyelash involvement, and nail pitting. Assess and manage it using the BAD living guideline, not this page.", src:"BAD alopecia areata living guideline 2025"},
         {tone:"blue", h:"Traction alopecia", html:"Thinning along the frontal and temporal margins, or wherever hair is pulled by tight braids, weaves, extensions or ponytails. Early traction loss recovers if the tension stops, but long-standing traction can scar. Ask about styling in every woman with marginal thinning."},
         {tone:"blue", h:"Tinea capitis", html:"Scale, broken hairs, black dots, pustules or a kerion. It is commoner in children but does occur in adults. Take scrapings and plucked hairs for mycology. It needs oral antifungal treatment.", src:"BAD tinea capitis guideline 2014"},
         {tone:"purple", h:"NG12 — only if examination finds a mass", html:"Hair loss and virilisation are not NG12 criteria in themselves, so the usual route is urgent endocrinology. But if physical examination finds <b>ascites and/or a pelvic or abdominal mass (which is not obviously uterine fibroids)</b>, NG12 recommendation 1.5.1 applies: refer to a gynaecological cancer service using a suspected cancer pathway referral. Restated in <a href='#refer'>Refer</a>.", src:"NICE NG12 (2015, last updated April 2026) rec 1.5.1"}
       ]},
       {b:"warn", html:"<b>Do not start minoxidil and wait</b> in a woman with scarring features or virilisation. The Regaine SPCs themselves exclude loss that is sudden, patchy, of unknown cause, or linked to childbirth, as well as use on an inflamed scalp."}
     ]},

    {id:"tests", nav:"Tests", title:"Investigations — what, when and why", sub:"Test for the things that add to the loss or change the diagnosis. Pattern loss itself has no blood test.",
     blocks:[
       {b:"table", head:["Test","When","What it tells you"], rows:[
         ["<b>FBC and ferritin</b>","Diffuse or pattern loss (PCDS)","Iron deficiency, with or without anaemia, causes diffuse shedding. Ferritin is the single most useful marker, but inflammation can push it into the normal range falsely. Add transferrin saturation if you suspect this. If iron deficiency is confirmed, investigate the cause (BSG 2021), which in a premenopausal woman usually means reviewing menstrual loss and diet, and considering coeliac serology."],
         ["<b>Thyroid function</b>","Diffuse or pattern loss (PCDS)","Both under- and overactive thyroid disease affect hair growth."],
         ["<b>U&amp;E, LFT, zinc, vitamin D</b>","The PCDS lists these for women with diffuse, pattern or unexplained loss. Whether each is needed depends on the history","A screen for systemic and nutritional contributors. Order them selectively rather than as a routine panel."],
         ["<b>Total testosterone and SHBG, with free androgen index</b>","Only if there are signs of hyperandrogenism, irregular periods or virilisation","The international PCOS guideline (2023) makes total and free testosterone (or the FAI) the first-line tests for biochemical hyperandrogenism. If these are normal and suspicion stays high, androstenedione and DHEAS can be considered."],
         ["<b>Any testosterone above 5 nmol/L</b>","—","Needs further investigation (repeat by LC-MS/MS, with ovarian or adrenal imaging as appropriate) through endocrinology (Society for Endocrinology 2025)."]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"The combined pill spoils the androgen result", html:"The combined pill raises SHBG and suppresses ovarian androgen production, so the result is hard to read. If androgen assessment really matters, the PCOS guideline says to stop the pill for at least 3 months, using other contraception in the meantime. Discuss this before stopping it, and do not delay urgent investigation for suspected virilisation.", src:"International PCOS guideline 2023 (international)"},
         {tone:"blue", h:"Ferritin: treat the deficiency and find its cause", html:"The BSG guideline makes ferritin the key marker and says a good haemoglobin response to iron supports true iron deficiency. No UK guideline sets a special ferritin target for hair growth, so treat to replete stores and investigate the cause as you would in any other patient.", src:"BSG IDA guideline 2021 (Snook, Gut)"}
       ]}
     ]},

    {id:"treat", nav:"Treatment", title:"Treatment — the stepwise approach", sub:"Deal with what adds to the loss, then use minoxidil. Anything beyond that is specialist and unlicensed.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Step 1", title:"Correct what adds to it", when:"everyone", fromLabel:"first", html:"Replete iron and investigate why it was low. Treat thyroid disease. Review drugs that can cause shedding. Advise easing styling tension and harsh chemical treatments. If she has PCOS, manage it in its own right."},
         {step:"Step 2", title:"Topical minoxidil", when:"first-line for the pattern loss itself", fromLabel:"over the counter", html:"<b>Regaine for Women 2% solution: 1 ml twice daily</b> to the affected scalp (maximum 2 ml a day), or <b>Regaine for Women 5% foam: 1 g (half a capful) once daily</b> (maximum 1 g a day). Both are licensed for women aged 18 to 65. The PCDS suggests the 5% formulation once daily for women, although some use it twice daily. Apply to a dry scalp, wipe off any that runs onto the forehead or cheeks, and wash hands afterwards."},
         {step:"Step 3", title:"PCOS with hyperandrogenism", when:"acne, hirsutism, irregular periods", fromLabel:"international PCOS guideline", html:"The combined pill is first-line drug treatment for the features of hyperandrogenism, alongside cosmetic measures. The PCOS guideline gives antiandrogens a limited role, when other treatment has failed or is unsuitable, and suggests they could be tried with the pill given the psychological impact of hair loss."},
         {step:"Step 4", title:"Specialist options", when:"progressing despite a 6 to 12 month minoxidil trial", fromLabel:"dermatology", html:"<b>Oral antiandrogens</b> (spironolactone, and less often cyproterone acetate, flutamide or bicalutamide) and <b>low-dose oral minoxidil</b> are all unlicensed for this use. Start them only on specialist advice. Any benefit is slow and is judged over many months."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"cream", h:"Setting expectations for minoxidil", html:"The foam SPC says it may take 12 to 24 weeks of once-daily use before any regrowth, and to stop if there is no improvement at 24 weeks. The 2% solution SPC says to stop if there is no improvement after a year. The PCDS estimates about 40% of users benefit, mainly those who start early while shedding is still active. It slows loss and thickens existing hair rather than reversing the pattern.", src:"Regaine for Women SPC (emc 102, 5082) · PCDS"},
         {tone:"amber", h:"Minoxidil side effects and cautions", html:"Scalp irritation, and unwanted facial hair where it spreads (the PCDS puts hypertrichosis at about 14%). Temporary extra shedding early on. Stop and seek advice if she gets chest pain, a fast heartbeat, dizziness, sudden weight gain or swollen hands or feet. Do not use it in pregnancy or breastfeeding.", src:"Regaine for Women SPC (emc 5082) · PCDS"},
         {tone:"amber", h:"Spironolactone — what she needs to know", html:"The BAD leaflet (August 2025) lists spironolactone as off-licence for female pattern hair loss. It says contraception is not required, but she must stop it if she becomes pregnant, because it may affect the development of a male baby’s sex organs; discuss pregnancy plans with the specialist. Potassium can rise, particularly with kidney or heart disease or other potassium-raising drugs, so blood monitoring follows the specialist plan and the BNF. It can cause dizziness on standing, breast tenderness and irregular bleeding.", src:"BAD spironolactone leaflet Aug 2025 · BNF"},
         {tone:"blue", h:"Finasteride is not a GP option in women", html:"The finasteride 1 mg SPC contraindicates it in women. Specialists sometimes use 5-alpha-reductase inhibitors off-label, usually after the menopause. A woman who could become pregnant must not handle broken tablets.", src:"Finasteride 1 mg (Propecia) SPC"}
       ]},
       {b:"warn", html:"<b>NHS supply:</b> minoxidil solution, cream, lotion and ointment are in <b>Drug Tariff Part XVIIIA</b> and cannot be prescribed on an FP10. GMMMG (Sept 2022) added minoxidil foam to the Greater Manchester do-not-prescribe list. She will buy it from a pharmacy, so say so early to avoid disappointment."}
     ]},

    {id:"oral-minoxidil", nav:"Oral minoxidil", title:"Low-dose oral minoxidil — answering her question", sub:"Widely discussed online and used by dermatologists, but unlicensed for hair loss.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"Unlicensed, and specialist-led", html:"Minoxidil tablets are licensed in the UK only for severe hypertension. The BAD leaflet (October 2024) says recent research suggests low-dose oral minoxidil may be at least as effective as topical minoxidil, and well tolerated, in certain situations. It is a specialist decision, not a GP start.", src:"BAD leaflet (female pattern) Oct 2024 · minoxidil tablets SPC"},
         {tone:"blue", h:"What the safety data show", html:"In a multicentre series of 1,404 patients (two-thirds women), hypertrichosis was the most common effect (15.1%). Lightheadedness, fluid retention and tachycardia were less common. 1.7% stopped because of adverse effects. The data are observational and come from Spain.", src:"International: Vañó-Galván et al., J Am Acad Dermatol 2021"},
         {tone:"cream", h:"If she is already taking it", html:"Record it. Check her blood pressure and pulse, and ask about swelling, palpitations and dizziness. Make sure the prescriber knows if she is pregnant or planning a pregnancy, or has heart disease. Leave dose changes to the prescriber.", src:"Minoxidil tablets SPC"}
       ]}
     ]},

    {id:"support", nav:"Support", title:"Living with it — camouflage and wellbeing", sub:"For many women this matters more than the prescription.",
     blocks:[
       {b:"tiles", v:"life", items:[
         {t:"Styling", html:"Change the parting, use volumising cuts and gentle products, and avoid tight styles and heat damage."},
         {t:"Camouflage", html:"Hair-thickening fibres, tinted scalp powders, toppers and wigs. Wigs are available on NHS prescription only in defined circumstances, with charges depending on local arrangements."},
         {t:"Mood", html:"Ask directly about low mood, anxiety and social withdrawal. Offer talking therapy where there is significant psychological impact."},
         {t:"Photographs", html:"Take standard photographs of the parting from above. Improvement is slow, and photographs help her see stabilisation that the mirror hides."}
       ]},
       {b:"say", html:"“This is female-pattern thinning. It’s common, it isn’t dangerous, and I can see how much it’s affecting you. First I’d like to check your iron and thyroid, because those can make it worse. The main treatment is minoxidil, which you buy from the chemist. It takes six months to a year to show, can cause a bit of extra shedding at first, and only keeps working while you use it.”"}
     ]},

    {id:"followup", nav:"Follow-up", title:"Follow-up", sub:"A slow condition needs a planned review, not an open-ended one.",
     blocks:[
       {b:"timeline", items:[
         {n:"1", when:"Week 0", title:"Baseline", html:"Take photographs, order the blood tests, and agree the plan (minoxidil, correcting what adds to the loss, managing PCOS if present)."},
         {n:"2", when:"2 to 6 weeks", title:"Results and early shedding", html:"Act on the ferritin and thyroid results. Reassure her that the early shed from minoxidil is expected."},
         {n:"3", when:"About 6 months", title:"First judgement", html:"Compare the photographs. The foam SPC advises stopping if there is no improvement at 24 weeks. With the 2% solution she may continue up to a year."},
         {n:"4", when:"12 months", title:"Continue or escalate", html:"If it is stable or better, continue indefinitely. If it is still progressing, check she has been using it properly, repeat ferritin if needed, and refer to dermatology to discuss specialist options."},
         {n:"5", when:"Any time", title:"New features", html:"Scalp symptoms, patches, eyebrow loss or signs of virilisation mean going back to <a href='#redflags'>red flags</a>."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer", sub:"Who needs a specialist, and how quickly.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"Urgent endocrinology", html:"Signs of virilisation, rapid onset of hyperandrogenism, or a testosterone above 5 nmol/L. These raise the possibility of an androgen-secreting ovarian or adrenal tumour.", src:"Society for Endocrinology androgen excess guideline 2025"},
         {tone:"amber", h:"Urgent dermatology", html:"Suspected scarring alopecia, including frontal fibrosing alopecia or lichen planopilaris. The damage is permanent, and early treatment aims to halt it.", src:"PCDS Hair Loss Pathway 2024"},
         {tone:"blue", h:"Routine dermatology", html:"The diagnosis is uncertain, or the loss is still progressing despite 6 to 12 months of minoxidil used properly, or antiandrogens or oral minoxidil are being considered. Refer extensive or resistant alopecia areata according to the BAD living guideline.", src:"PCDS Hair Loss Pathway 2024 · BAD alopecia areata living guideline 2025"},
         {tone:"blue", h:"Gynaecology or endocrinology for PCOS", html:"If PCOS needs specialist input (for example fertility, or difficult hyperandrogenism), refer according to local pathways. Primary care can often manage it using the international PCOS guideline.", src:"International PCOS guideline 2023 (international)"},
         {tone:"purple", h:"2WW · NICE NG12 1.5.1 — pelvic or abdominal mass", html:"Make a referral to a gynaecological cancer service using a suspected cancer pathway referral if physical examination identifies <b>ascites and/or a pelvic or abdominal mass (which is not obviously uterine fibroids)</b>. Hair loss alone meets no NG12 criterion; without a mass, the tumour concern in virilisation goes through urgent endocrinology.", src:"NICE NG12 (2015, last updated April 2026) rec 1.5.1"}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card. The Casebook holds the full case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 31-year-old woman says her parting has been getting wider over 2 years. She is tearful and has stopped going out. Her periods come every 6 to 10 weeks, she has acne on her jaw, and she takes the combined pill. On examination there is a widened central parting, the frontal hairline is intact, and the scalp is normal.", src:"PCDS Hair Loss Pathway 2024 · International PCOS guideline 2023 (international)"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Separates thinning from shedding and examines the scalp. <b>Acknowledges the distress and screens mood.</b> Links the periods and acne to possible PCOS. Explains that the combined pill makes androgen tests hard to read. Orders ferritin, FBC and thyroid function. Checks for virilisation. Explains OTC minoxidil (dose, early shed, 6 to 12 months, lifelong use). Plans photographs and a review.", src:"PCDS · BSG IDA guideline 2021 · Regaine for Women SPC"},
       {tone:"cream", h:"Common pitfall", html:"Ordering a full hormone panel on everyone while missing the scalp examination, or promising NHS-prescribed minoxidil.", src:"PCDS male and female pattern alopecia · Drug Tariff Part XVIIIA"},
       {tone:"cream", h:"One-line close", html:"“Let’s check what might be making it worse, start the lotion, and look at the photos together in six months. And if you’re feeling low about it, I want to know.”"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Every figure on this page traces to one of these primary sources.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>Primary Care Dermatology Society — Hair Loss: Primary Care Treatment Pathway (November 2024)<br><a href="https://www.pcds.org.uk/files/general/Hair-Loss-Pathway-web.pdf" rel="noopener">pcds.org.uk — Hair Loss Pathway</a><span class="rd"> — scarring versus non-scarring loss, urgent referral for scarring, telogen effluvium 2 to 6 months after a trigger and settling at 6 to 9 months</span></li>'+
         '<li>Primary Care Dermatology Society — Male pattern alopecia and female pattern alopecia, clinical guidance (web page, accessed Sep 2026)<br><a href="https://www.pcds.org.uk/clinical-guidance/alopecia-male-and-female-pattern-alopecia" rel="noopener">pcds.org.uk</a><span class="rd"> — Ludwig and Christmas-tree patterns, Ludwig and Sinclair scales, usually normal androgens, PCOS as the commonest endocrine association, 5% minoxidil once daily for women, about 40% benefit, hypertrichosis about 14%</span></li>'+
         '<li>Primary Care Dermatology Society — Alopecia: an overview (web page, accessed Sep 2026)<br><a href="https://www.pcds.org.uk/clinical-guidance/alopecia-an-overview" rel="noopener">pcds.org.uk</a><span class="rd"> — FBC, ferritin and TFT for diffuse loss; U&amp;E, LFT, zinc and vitamin D listed for women, depending on the history</span></li>'+
         '<li>British Association of Dermatologists — Patient information leaflet: Hair loss, female pattern (androgenetic alopecia) (October 2024)<br><a href="https://www.bad.org.uk/pils/hair-loss-female-pattern-androgenetic-alopecia" rel="noopener">bad.org.uk</a><span class="rd"> — genetic and hormonal cause, miniaturisation, unlicensed antiandrogens, the statement on low-dose oral minoxidil</span></li>'+

         '<li>Fuller LC et al. — British Association of Dermatologists’ guidelines for the management of tinea capitis 2014. Br J Dermatol 2014;171(3):454–463<br><a href="https://onlinelibrary.wiley.com/doi/10.1111/bjd.13196" rel="noopener">doi:10.1111/bjd.13196</a></li>'+
