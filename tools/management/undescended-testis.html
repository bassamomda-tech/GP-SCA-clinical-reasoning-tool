<script>
MG.render({
  icon:"🚹",
  title:"Undescended testis — the complete guide",
  eyebrow:"Protocol · infants, boys and men · assess &amp; refer in one place",
  stemTitle:"The mobility test decides the diagnosis, and the NIPE timetable decides the referral — so orchidopexy can happen in the first year of life",
  stemSub:"One page for the whole condition. Screen first for the urgent presentations: bilateral undescended testes at the newborn check, any undescended testis with hypospadias or atypical genitalia (possible DSD, including CAH), and acute groin or abdominal pain (torsion). Separate a retractile testis from a true undescended one — that single distinction prevents unnecessary surgery. Refer a testis still undescended at the 6–8-week check, or found later, so orchidopexy is done ideally at 6–12 months and by 18 months at the latest. Do not request an ultrasound first. Retractile testes need yearly review because some ascend, and a history of undescended testis means lifelong testicular awareness.",
  guideline:"EAU/ESPU paediatric urology (2026) · EAU sexual and reproductive health (2026) · GIRFT/BAUS torsion pathway · NHS NIPE programme · NICE NG12",
  reviewed:"25 September 2026",
  nextReview:"25 September 2027",
  meta:[
    {t:"Bilateral at the newborn check → senior paediatric review within 24h", tone:"tw"},
    {t:"No ultrasound before referral", tone:"tw"},
    {t:"v2.1 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:"<div class='mg-layers'><a href='#severe'><b>Urgent</b><small>DSD/CAH · torsion</small></a><a href='#diagnose'><b>Distinguish</b><small>Retractile vs true</small></a><a href='#exam'><b>Examine</b><small>Warm, relaxed</small></a><a href='#refer'><b>Refer</b><small>NIPE timetable</small></a><a href='#monitor'><b>Follow-up</b><small>Lifelong awareness</small></a></div>",
  quickSub:"If you read nothing else on this page, read these six cards. Every figure traces to the source cited under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Bilateral, or with atypical genitalia — think DSD", html:"<b>Bilateral undescended testes at the newborn check → senior paediatric review within 24 hours</b> (NIPE). Any undescended testis with hypospadias, micropenis or atypical genitalia → urgent same-day paediatrics: possible disorder of sex development. Include bilateral non-palpable gonads with hypospadias, bifid scrotum, micropenis or scrotal hyperpigmentation. Urgent endocrine, genetic and biochemical assessment is needed because salt-wasting congenital adrenal hyperplasia — one possible cause — is an emergency; the tests are coordinated by the paediatric endocrine or DSD team, not ordered in primary care first."},
    {tone:"red", h:"⚠ Acute pain where the testis lies", html:"Sudden groin or lower abdominal pain, swelling or tenderness in a boy or man with an undescended testis is possible torsion → immediate transfer to an emergency department or a paediatric surgical or urological centre able to explore, by ambulance where needed — do not delay for ultrasound. A normal scrotal examination does not reassure when the testis is undescended. Examine the testes in any child with acute abdominal pain."},
    {tone:"amber", h:"The mobility test is the diagnosis", html:"With warm hands, in a warm room, with a relaxed child: can the testis be brought into the dependent scrotum without tension, and does it remain there at least temporarily? Yes → retractile: no surgery, yearly review. If it cannot be brought down, is under tension, retracts immediately despite relaxation, or cannot be kept in the scrotum → possibly undescended or ascending: refer. <b>If unsure, refer</b> — a high retractile testis can be hard to tell from an ascending one."},
    {tone:"blue", h:"Refer on the NIPE timetable", html:"A unilateral undescended testis at the newborn check is re-examined at the 6–8-week check. <b>Still undescended at 6–8 weeks, or found at any later age → refer to paediatric surgery or urology</b>, per the local NIPE pathway, so orchidopexy is done ideally at 6–12 months and by 18 months at the latest. Spontaneous descent after about 6 months (corrected age in preterm infants) is uncommon."},
    {tone:"green", h:"No ultrasound before referral", html:"Imaging does not reliably locate a non-palpable testis and does not change the need for surgical assessment — EAU/ESPU advise against it. Specialist assessment of a non-palpable testis may include examination under anaesthesia and laparoscopy, with treatment in the same episode where appropriate. Refer directly; an ultrasound request can delay treatment and falsely reassure."},
    {tone:"amber", h:"Ascent, and lifelong awareness", html:"A testis that was scrotal can ascend with growth, and retractile testes are reviewed yearly because some do — refer when found. A history of undescended testis raises the risk of testicular cancer and subfertility; orchidopexy reduces but does not remove the cancer risk. After puberty, advise being familiar with the normal size and feel of both testes and seeking prompt assessment for a new persistent lump, enlargement or change. There is no routine ultrasound or cancer screening for men without symptoms."}
  ],
  pathwaySub:"The whole consultation in five moves. The first contains genuine emergencies.",
  pathway:[
    {title:"Screen for the urgent presentations", html:"Bilateral at the newborn check → senior paediatric review within 24 hours. Atypical genitalia → same-day paediatrics. Acute pain → emergency surgical assessment. Testicular or inguinal mass in a man → urgent urology.", alert:true},
    {title:"Distinguish the type", html:"True undescended, retractile, ascending, ectopic, or absent — the mobility test decides most of it."},
    {title:"Examine properly, investigate selectively", html:"Warm room, relaxed child; palpability; genitalia; hernia; the other testis. No imaging before referral."},
    {title:"Refer on time", html:"From the 6–8-week check, or when found later, for orchidopexy ideally at 6–12 months."},
    {title:"Follow up for life", html:"Yearly review of retractile testes until puberty; testicular awareness and fertility advice later."}
  ],
  sections:[
    {id:"severe", nav:"Urgent", title:"Urgent presentations", sub:"Most undescended testes are not emergencies — these are.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Bilateral undescended testes at the newborn check", html:"Senior paediatric review within 24 hours (NIPE) — to exclude a disorder of sex development, including congenital adrenal hyperplasia."},
         {tone:"red", h:"🔴 Undescended testis with atypical genitalia", html:"Hypospadias, micropenis, bifid scrotum or ambiguous genitalia, unilateral or bilateral → urgent same-day paediatrics for DSD assessment. Endocrine and genetic tests, including karyotype, are arranged by the specialist team."},
         {tone:"red", h:"🔴 Acute pain at the testis site", html:"Sudden groin or abdominal pain, swelling or tenderness where an undescended testis lies → possible torsion: immediate transfer to an emergency department or a paediatric surgical or urological centre able to explore, by ambulance where needed — do not delay for ultrasound. A normal scrotal examination does not reassure when the testis is undescended (GIRFT pathway)."},
         {tone:"amber", h:"🟠 Bilateral non-palpable testes found later", html:"Urgent paediatric referral — anorchia, DSD or hormonal causes need specialist assessment."},
         {tone:"amber", h:"🟠 Mass in a man with a history", html:"A suspicious inguinal mass in a man with a known or previous undescended testis → urgent specialist urology assessment. It is not itself an NG12 criterion — apply NG12 when its testicular criteria are met; do not mistake a palpable ectopic or undescended testis for a malignant mass. See the NG12 card under <a href='#workup'>Work-up</a>."}
       ]}
     ]},

    {id:"diagnose", nav:"Distinguish", title:"Confirm the diagnosis and the type",
     blocks:[
       {b:"table", head:["Type","Features","Action"], rows:[
         ["<b>True undescended testis</b>","Cannot be brought to the bottom of the scrotum, or springs straight back","Refer — orchidopexy ideally at 6–12 months"],
         ["<b>Retractile testis</b>","Can be brought into the dependent scrotum without tension and remains there at least temporarily; pulled up by an active cremasteric reflex","No immediate surgery; review yearly until puberty because some ascend — refer if it no longer reaches or stays in the scrotum"],
         ["<b>Ascending (acquired) testis</b>","Previously documented in the scrotum; now higher, usually noticed in mid-childhood","Treat as undescended — refer when found"],
         ["<b>Ectopic testis</b>","Outside the normal path of descent — e.g. perineal, femoral or at the base of the penis","Refer for surgery"],
         ["<b>Absent or vanishing testis</b>","Not found; may be atrophic from antenatal torsion","Specialist assessment — laparoscopy decides; prosthesis can be discussed later"],
         ["<b>Screening</b>","Examined at the newborn check and the 6–8-week NIPE infant check","Unilateral at birth → re-examine at 6–8 weeks; still undescended → refer"]
       ]}
     ]},

    {id:"exam", nav:"Examine", title:"Targeted examination",
     sub:"Warm room, warm hands, a relaxed child — supine, then squatting or cross-legged. An active cremasteric reflex in young children can make a normal testis look undescended.",
     blocks:[
       {b:"table", head:["What","How or finding","Significance"], rows:[
         ["<b>Scrotum</b>","An empty or underdeveloped hemiscrotum","Supports a true undescended testis"],
         ["<b>Groin</b>","Sweep from the internal ring downwards","Palpable or non-palpable — the surgical approach differs"],
         ["<b>Mobility test</b>","Bring the testis to the bottom of the scrotum without tension; does it stay after release?","Stays → retractile. Doesn't reach or springs back → refer"],
         ["<b>Genitalia</b>","Hypospadias, micropenis, bifid scrotum","Possible DSD → urgent paediatrics"],
         ["<b>Hernia</b>","Cough impulse or reducible groin swelling","Often coexists; managed with the orchidopexy"],
         ["<b>Other testis</b>","Size and position","Apparent enlargement may suggest an absent or atrophic testis but does not remove the need for specialist assessment"],
         ["<b>Older boys and men</b>","Pubertal stage; examine standing for a scrotal or groin mass","Delayed puberty with bilateral disease → endocrine assessment; a mass → urgent urology"]
       ]}
     ]},

    {id:"workup", nav:"Work-up", title:"Investigations — selective, and never a reason to delay",
     blocks:[
       {b:"table", head:["Test","When","Note"], rows:[
         ["<b>Ultrasound or MRI</b>","Not before referral for an undescended testis","Does not reliably locate a non-palpable testis or change the need for surgical assessment (EAU/ESPU)"],
         ["<b>Examination under anaesthesia · laparoscopy</b>","Non-palpable testis","Specialist assessment, often combined with treatment"],
         ["<b>Endocrine and genetic tests</b>","Bilateral non-palpable testes, or suspected DSD","Coordinated urgently by the paediatric endocrine or DSD team — e.g. electrolytes, glucose, 17-hydroxyprogesterone, sex-chromosome analysis and gonadal hormones; not a primary-care panel"],
         ["<b>Urgent direct-access ultrasound</b>","Unexplained or persistent testicular symptoms in a man (NICE NG12)","Per the local pathway. Tumour markers are specialist investigations — do not order them in primary care before referral"]
       ]},
       {b:"cards", items:[
         {tone:"purple", h:"NG12 — testicular cancer <span class='tw'>2WW</span>", html:"<b>NICE NG12:</b> consider a suspected cancer pathway referral for testicular cancer in men with a non-painful enlargement or change in shape or texture of the testis, and consider a direct-access ultrasound for unexplained or persistent testicular symptoms. A history of undescended testis — treated or not — raises the lifetime risk, so apply these criteria without hesitation.", src:"NICE NG12 (May 2025)"}
       ]}
     ]},

    {id:"treat", nav:"Treat", title:"Treatment — specialist-led",
     blocks:[
       {b:"ladder", steps:[
         {step:"GP-managed", title:"Retractile testis — watchful waiting", when:"reaches and stays, at least temporarily", fromLabel:"no surgery",
          html:"Reassure; review yearly until puberty, documenting the position; refer if it ascends or no longer stays down."},
         {step:"Palpable", title:"Orchidopexy", when:"true undescended, palpable", fromLabel:"ideally 6–12 months",
          html:"Usually open inguinal or scrotal orchidopexy as a day case; an associated hernia is dealt with at the same operation."},
         {step:"Non-palpable", title:"Laparoscopy ± orchidopexy", when:"not felt", fromLabel:"specialist",
          html:"Laparoscopy locates the testis; a one- or two-stage orchidopexy follows if it is viable."},
         {step:"Not recommended", title:"Hormonal treatment", when:"", fromLabel:"",
          html:"Surgery is the standard treatment for unilateral undescended or ectopic testes; do not offer hormonal treatment in primary care to induce descent. Specialist endocrine treatment may be considered in selected bilateral cases, mainly for fertility preservation (EAU)."},
         {step:"After puberty", title:"Orchidopexy or orchidectomy", when:"untreated in an adolescent or man", fromLabel:"shared decision",
          html:"A specialist shared decision (EAU). Orchidectomy is generally favoured after puberty for an intra-abdominal testis with a normal contralateral testis, and considered for a palpable one; orchidopexy is favoured where fertility or endocrine function matters — bilateral disease, contralateral dysfunction or a solitary functioning testis."}
       ]},
       {b:"say", html:"His testis isn't sitting in the scrotum yet. Some settle on their own in the first few months, but if it's still up at his check, I'll refer him so a small operation can be done in his first year, ideally between six months and one. That timing gives the testis its best chance, and later on we'll talk about checking himself regularly as he gets older."}
     ]},

    {id:"refer", nav:"Refer", title:"Referral criteria and timing",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Within 24 hours — senior paediatrics", html:"Bilateral undescended testes at the newborn check (NIPE)."},
         {tone:"red", h:"Same day", html:"Undescended testis with atypical genitalia (paediatrics) · acute pain at the testis site (emergency surgery)."},
         {tone:"amber", h:"Urgent paediatrics", html:"Bilateral non-palpable testes found at a later check."},
         {tone:"blue", h:"Paediatric surgery or urology", html:"Unilateral undescended testis still present at the 6–8-week check, or found at any later age; an ascending testis when found. Refer per the local NIPE pathway so surgery happens ideally at 6–12 months and by 18 months at the latest. Refer to paediatric (rather than adult) surgeons for infants, bilateral or non-palpable testes, and recurrence."},
         {tone:"purple", h:"Suspected testicular cancer <span class='tw'>2WW</span>", html:"Non-painful enlargement or change in shape or texture of the testis → suspected cancer pathway (NICE NG12).", src:"NICE NG12"},
         {tone:"blue", h:"Adult urology", html:"Untreated undescended testis in an adolescent or man, for counselling on orchidopexy or orchidectomy; fertility concerns."},
         {tone:"green", h:"GP review", html:"Retractile testis: yearly until puberty, documenting whether it can be brought down and stays."}
       ]}
     ]},

    {id:"lifestyle", nav:"Counselling", title:"Counselling and long-term support",
     blocks:[
       {b:"table", head:["Topic","What to do"], rows:[
         ["<b>Parents</b>","Explain retractile versus true undescended, and why surgery for a true undescended testis is timed for the first year"],
         ["<b>Testicular awareness</b>","From puberty, teach regular self-examination and to report any new lump or change promptly — this continues after orchidopexy"],
         ["<b>Fertility</b>","Subfertility risk is higher, particularly after bilateral disease; offer assessment when concerns arise"],
         ["<b>Adolescents</b>","Body image and prosthesis questions; psychological support if needed"],
         ["<b>After surgery</b>","Follow the surgical team's instructions on analgesia, activity and follow-up; check the testis position at routine reviews"],
         ["<b>Hormones</b>","Bilateral disease or anorchia: paediatric endocrinology for puberty monitoring"]
       ]}
     ]},

    {id:"monitor", nav:"Follow-up", title:"Follow-up and long-term awareness",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["<b>Retractile testis</b>","Yearly until puberty","Can it be brought down, and does it stay? Refer if it ascends"],
         ["<b>After orchidopexy</b>","Per the surgical team","Testis still in the scrotum at later reviews? Re-ascent or atrophy → re-refer"],
         ["<b>Puberty</b>","At expected onset","Bilateral disease, anorchia, very small or atrophic testes, or absent pubertal progression → paediatric endocrine assessment via the local delayed-puberty pathway"],
         ["<b>Adulthood</b>","Ongoing","Testicular self-awareness; NG12 for new non-painful enlargement or change in shape or texture; no routine surveillance imaging"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"📞 Emergency", html:"Acute severe groin, scrotal or abdominal pain in a boy or man with an undescended or recently operated testis → emergency surgical assessment."},
         {tone:"amber", h:"🟠 Same day", html:"Post-operative fever, wound infection or scrotal haematoma."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A mother brings her 7-month-old son. Both testes were documented at the newborn and 6-week checks, but she now cannot feel the left one at bath time. She has read about cancer and wants \u201ca scan today\u201d. The right testis is scrotal; the left sits high in the groin, can be brought halfway down, and springs straight back on release."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Examines with warm hands in a warm room and performs the mobility test, concluding this is not retractile but a true undescended — likely ascending — testis; explains why a scan will not help and must not delay referral; refers to paediatric surgery now; checks for hypospadias and hernia; answers the cancer question honestly without precise-sounding numbers, and explains orchidopexy timing and later self-examination; safety-nets acute groin pain as possible torsion."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>EAU/ESPU — Guidelines on paediatric urology (2026)</b><span class="rd"> — treatment from about 6 months, completed by 12 months and by 18 months at the latest; no localisation imaging; hormonal treatment only in selected bilateral cases; yearly review of retractile testes</span></li>'+
         '<li><b>British Association of Urological Surgeons (BAUS)</b><span class="rd"> — adult management and counselling</span></li>'+
         '<li><b>NHS Newborn and Infant Physical Examination (NIPE) screening programme</b><span class="rd"> — bilateral undescended testes at the newborn check: senior paediatric review within 24 hours; re-examination and referral at the 6–8-week check</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (May 2025)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — testicular cancer referral and direct-access ultrasound</span></li>'+
         '<li><b>EAU — Guidelines on sexual and reproductive health (2026)</b><span class="rd"> — adult orchidectomy versus orchidopexy; self-examination in men with a history of cryptorchidism</span></li>'+'<li><b>GIRFT / BAUS — Children and young people: testicular torsion pathway (2026)</b><span class="rd"> — immediate referral to a centre able to explore; no delay for ultrasound</span></li>'+'<li><b>Pettersson A et al., NEJM 2007</b><span class="rd"> — lower testicular cancer risk with orchidopexy before puberty</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Undescended testis in primary care. Bilateral undescended testes at the newborn check: senior paediatric review within 24 hours (NIPE). Any undescended testis with atypical genitalia: same-day paediatrics (possible DSD or CAH). Acute pain at the testis site: emergency surgical assessment for torsion. The mobility test separates retractile from true undescended testes. Still undescended at the 6–8-week check, or found later: refer to paediatric surgery or urology for orchidopexy ideally at 6–12 months, by 18 months at the latest. No imaging before referral. Retractile testes: yearly review. Lifelong testicular awareness; NICE NG12 for testicular change. Sources: EAU/ESPU, BAUS, NHS NIPE programme, NICE NG12."
});
</script>
