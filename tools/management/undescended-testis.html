<script>
MG.render({
  icon:"🚹",
  title:"Undescended testis — the complete guide",
  eyebrow:"Protocol · infants, boys and men · assess &amp; refer in one place",
  stemTitle:"The mobility test decides the diagnosis, and the NIPE timetable decides the referral — so orchidopexy can happen in the first year of life",
  stemSub:"One page for the whole condition. Screen first for the urgent presentations: bilateral impalpable testes, a unilateral impalpable testis, or a palpable undescended testis with hypospadias at the newborn check; any atypical genitalia (possible DSD, including CAH); and acute groin, abdominal, scrotal or testicular pain (torsion). Separate a retractile testis from a true undescended one — that single distinction prevents unnecessary surgery. Re-examine a palpable undescended testis at the 6–8-week NIPE check and at 4–5 months if necessary; refer promptly if it remains undescended or becomes impalpable, or is found later, aiming for specialist review by 6 months (corrected age in preterm infants) and treatment completed by 12 months where possible and by 18 months at the latest. Do not request ultrasound or MRI to locate the testis before referral. Retractile testes need yearly review because some ascend, and a history of undescended testis means lifelong testicular awareness.",
  guideline:"EAU/ESPU paediatric urology (2026) · EAU sexual and reproductive health (2026) · GIRFT/BAUS torsion pathway · NHS NIPE programme · NICE NG12",
  reviewed:"25 September 2026",
  nextReview:"25 September 2027",
  meta:[
    {t:"Impalpable testis, or undescended with hypospadias, at the newborn check → senior paediatric review within 24h", tone:"tw"},
    {t:"No localisation imaging before referral", tone:"tw"},
    {t:"v2.1 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:"<div class='mg-layers'><a href='#severe'><b>Urgent</b><small>DSD/CAH · torsion</small></a><a href='#diagnose'><b>Distinguish</b><small>Retractile vs true</small></a><a href='#exam'><b>Examine</b><small>Warm, relaxed</small></a><a href='#refer'><b>Refer</b><small>NIPE timetable</small></a><a href='#monitor'><b>Follow-up</b><small>Lifelong awareness</small></a></div>",
  quickSub:"If you read nothing else on this page, read these six cards. Key sources, with links, are listed under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Impalpable, or with hypospadias or atypical genitalia — think DSD", html:"<b>Urgent NIPE findings at the newborn examination: refer for senior paediatric review within 24 hours if there are bilateral impalpable testes, a unilateral impalpable testis with or without hypospadias, or a unilateral palpable undescended testis with hypospadias</b> (NIPE). The exact action follows the NIPE screen-positive and local neonatal pathway. Any atypical or ambiguous genitalia requires urgent paediatric/DSD assessment. Bilateral impalpable testes, particularly with hypospadias, micropenis, bifid/ambiguous genitalia or scrotal hyperpigmentation, require urgent paediatric endocrine/DSD assessment — scrotal hyperpigmentation may indicate salt-wasting congenital adrenal hyperplasia, a medical emergency. Do not delay referral while arranging a primary-care endocrine panel; the tests are coordinated by the paediatric endocrine or DSD team."},
    {tone:"red", h:"⚠ Acute pain where the testis lies", html:"Acute groin, abdominal, scrotal or testicular pain, or acute swelling or tenderness where the testis is thought to lie, in a boy or man with an undescended testis is possible torsion → immediate transfer to an emergency department or a paediatric surgical or urological centre able to explore the testis, by ambulance where needed. Do not arrange primary-care ultrasound or allow ultrasound to delay surgical assessment. A normal scrotal examination does not exclude torsion of an undescended testis. <b>Examine the testes in every boy presenting with acute abdominal pain.</b>"},
    {tone:"amber", h:"The mobility test is the diagnosis", html:"With warm hands, in a warm room, with a relaxed child: can the testis be brought into the dependent scrotum without tension, and does it remain there at least temporarily? Yes → retractile: no surgery, yearly review. If it cannot be brought down, is under tension, retracts immediately despite relaxation, cannot be kept in the scrotum, or was previously documented in the scrotum but is now persistently higher → possibly undescended or ascending: refer. <b>If unsure, refer</b> — a high retractile testis can be hard to tell from an ascending one."},
    {tone:"blue", h:"Refer on the NIPE timetable", html:"A unilateral palpable testis that is not scrotal at the newborn examination is re-examined at the 6–8-week NIPE examination and again by the GP at 4–5 months if necessary. <b>Refer promptly to paediatric surgery or urology if it remains undescended or becomes impalpable, or if found at any later age</b>, aiming for specialist review by 6 months and orchidopexy during infancy; follow the local Bolton/Greater Manchester paediatric surgical/urology pathway. If a testis remains undescended at approximately 6 months corrected age, spontaneous descent is unlikely — treatment should be completed by 12 months where possible and by 18 months at the latest."},
    {tone:"green", h:"No localisation imaging before referral", html:"Do not request ultrasound or MRI to locate an undescended testis before paediatric surgical/urological referral. Imaging rarely identifies an intra-abdominal or absent testis reliably and does not replace specialist assessment (EAU/ESPU); it may be used selectively by specialists, including in particular DSD scenarios. Specialist assessment of a non-palpable testis may include examination under anaesthesia and laparoscopy, with treatment in the same episode where appropriate. Refer directly; an ultrasound request can delay treatment and falsely reassure. An adult with a testicular mass or persistent unexplained testicular symptoms is different — see NICE NG12 under <a href='#workup'>Work-up</a>."},
    {tone:"amber", h:"Ascent, and lifelong awareness", html:"A testis that was scrotal can ascend with growth, and retractile testes are reviewed yearly because some do — refer when found. A history of undescended testis raises the risk of testicular cancer and subfertility; orchidopexy improves access for examination and reduces but does not remove the cancer risk (EAU/ESPU; Pettersson 2007). After puberty, advise testicular awareness and prompt assessment of a new persistent lump, enlargement, change in shape or texture, persistent discomfort, or an apparently absent or re-ascending testis. There is no routine ultrasound surveillance programme for an asymptomatic testis after orchidopexy."}
  ],
  pathwaySub:"The whole consultation in five moves. The first contains genuine emergencies.",
  pathway:[
    {title:"Screen for the urgent presentations", html:"Bilateral impalpable, unilateral impalpable, or undescended with hypospadias at the newborn check → senior paediatric review within 24 hours. Atypical genitalia → urgent paediatric/DSD assessment. Acute groin, abdominal, scrotal or testicular pain → immediate emergency surgical assessment. New non-painful enlargement or change in a testis in a man → consider NG12 suspected cancer pathway.", alert:true},
    {title:"Distinguish the type", html:"True undescended, retractile, ascending, ectopic, or absent — the mobility test decides most of it."},
    {title:"Examine properly, investigate selectively", html:"Warm room, relaxed child; palpability; genitalia; hernia; the other testis. No localisation imaging before referral."},
    {title:"Refer on time", html:"Re-examine at 6–8 weeks and 4–5 months; refer if still undescended or impalpable, or when found later — specialist review by 6 months, treatment by 12 months where possible and 18 months at the latest."},
    {title:"Follow up for life", html:"Yearly review of retractile testes until puberty; testicular awareness and fertility advice later."}
  ],
  sections:[
    {id:"severe", nav:"Urgent", title:"Urgent presentations", sub:"Most undescended testes are not emergencies — these are.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Impalpable testis, or undescended with hypospadias, at the newborn check", html:"Senior paediatric review within 24 hours (NIPE) for bilateral impalpable testes, a unilateral impalpable testis with or without hypospadias, or a unilateral palpable undescended testis with hypospadias — to exclude a disorder of sex development, including congenital adrenal hyperplasia. Follow the NIPE screen-positive and local neonatal pathway."},
         {tone:"red", h:"🔴 Undescended testis with atypical genitalia", html:"Hypospadias, micropenis, bifid scrotum, scrotal hyperpigmentation or ambiguous genitalia, unilateral or bilateral → urgent same-day paediatric/DSD assessment. Scrotal hyperpigmentation with bilateral impalpable testes may indicate salt-wasting CAH — a medical emergency. Endocrine and genetic tests, including karyotype, are arranged by the specialist team; do not delay referral while arranging a primary-care endocrine panel."},
         {tone:"red", h:"🔴 Acute pain at the testis site", html:"Acute groin, abdominal, scrotal or testicular pain, swelling or tenderness where an undescended testis lies → possible torsion: immediate transfer to an emergency department or a paediatric surgical or urological centre able to explore the testis, by ambulance where needed. Do not arrange primary-care ultrasound or allow ultrasound to delay surgical assessment; specialists may occasionally use it as an adjunct where it will not cause significant delay. A normal scrotal examination does not exclude torsion of an undescended testis (GIRFT pathway). Examine the testes in every boy presenting with acute abdominal pain."},
         {tone:"amber", h:"🟠 Bilateral non-palpable testes found later", html:"Urgent paediatric referral — anorchia, DSD or hormonal causes need specialist assessment."},
         {tone:"amber", h:"🟠 Testicular change in a man with a history", html:"A new non-painful enlargement or change in the shape or texture of a testis warrants consideration of a suspected cancer pathway referral (NICE NG12). Unexplained or persistent testicular symptoms warrant consideration of urgent direct-access ultrasound. A palpable undescended or ectopic testis is not itself a testicular cancer diagnosis; refer to adult urology where assessment or treatment is required. See the NG12 card under <a href='#workup'>Work-up</a>."}
       ]}
     ]},

    {id:"diagnose", nav:"Distinguish", title:"Confirm the diagnosis and the type",
     blocks:[
       {b:"table", head:["Type","Features","Action"], rows:[
         ["<b>True undescended testis</b>","Cannot be brought to the bottom of the scrotum, or springs straight back","Refer — specialist review by 6 months; treatment completed by 12 months where possible, 18 months at the latest"],
         ["<b>Retractile testis</b>","Can be brought into the dependent scrotum without tension and remains there at least temporarily; pulled up by an active cremasteric reflex","No immediate surgery; review yearly until puberty because some ascend — refer if the diagnosis is uncertain, or it no longer reaches or stays in the scrotum"],
         ["<b>Ascending (acquired) testis</b>","Previously documented in the scrotum; now higher, usually noticed in mid-childhood","Treat as undescended — refer when found"],
         ["<b>Ectopic testis</b>","Outside the normal path of descent — e.g. perineal, femoral or at the base of the penis","Refer for surgery"],
         ["<b>Absent or vanishing testis</b>","Not found; may be atrophic from antenatal torsion","Specialist assessment — laparoscopy decides; prosthesis can be discussed later"],
         ["<b>Screening</b>","Examined at the newborn check and the 6–8-week NIPE infant check, with GP review at 4–5 months if still not scrotal","Impalpable, or undescended with hypospadias, at birth → senior paediatric review within 24 hours. Unilateral palpable at birth → re-examine at 6–8 weeks and 4–5 months; still undescended or impalpable → refer (specialist review by 6 months)"]
       ]}
     ]},

    {id:"exam", nav:"Examine", title:"Targeted examination",
     sub:"Warm room, warm hands, a relaxed child — supine, then squatting or cross-legged. An active cremasteric reflex in young children can make a normal testis look undescended.",
     blocks:[
       {b:"table", head:["What","How or finding","Significance"], rows:[
         ["<b>Scrotum</b>","An empty or underdeveloped hemiscrotum","Supports a true undescended testis"],
         ["<b>Groin</b>","Sweep from the internal ring downwards; if necessary check ectopic sites, including the perineum","Palpable or non-palpable — the surgical approach differs"],
         ["<b>Mobility test</b>","Bring the testis to the bottom of the scrotum without tension; does it stay after release?","Stays → retractile. Doesn't reach, is under tension, springs back, or was previously scrotal but is now higher → refer"],
         ["<b>Genitalia</b>","Hypospadias, micropenis, bifid scrotum, scrotal hyperpigmentation","Possible DSD → urgent paediatrics"],
         ["<b>Record</b>","Whether each testis is palpable, its position and approximate size; any previous inguinal or scrotal surgery","Baseline for yearly review and referral"],
         ["<b>Hernia</b>","Cough impulse or reducible groin swelling","Often coexists; managed with the orchidopexy"],
         ["<b>Other testis</b>","Size and position","Apparent enlargement may suggest an absent or atrophic testis but does not remove the need for specialist assessment"],
         ["<b>Older boys and men</b>","Pubertal stage; examine standing for a scrotal or groin mass","Delayed puberty with bilateral disease → endocrine assessment; new non-painful enlargement or change in shape or texture → consider NG12 suspected cancer pathway"]
       ]}
     ]},

    {id:"workup", nav:"Work-up", title:"Investigations — selective, and never a reason to delay",
     blocks:[
       {b:"table", head:["Test","When","Note"], rows:[
         ["<b>Ultrasound or MRI</b>","Not to locate an undescended testis before referral","Rarely identifies an intra-abdominal or absent testis reliably and does not replace specialist assessment (EAU/ESPU); may be used selectively by specialists, including in particular DSD scenarios"],
         ["<b>Examination under anaesthesia · laparoscopy</b>","Non-palpable testis","Specialist assessment, often combined with treatment"],
         ["<b>Endocrine and genetic tests</b>","Bilateral non-palpable testes, or suspected DSD","Coordinated urgently by the paediatric endocrine or DSD team — e.g. electrolytes, glucose, 17-hydroxyprogesterone, sex-chromosome analysis and gonadal hormones (examples only); not a primary-care panel — do not delay referral to arrange one"],
         ["<b>Urgent direct-access ultrasound</b>","Unexplained or persistent testicular symptoms in a man (NICE NG12)","Per the local pathway. Tumour markers are specialist investigations — do not order them in primary care before referral"]
       ]},
       {b:"cards", items:[
         {tone:"purple", h:"NG12 — testicular cancer <span class='tw'>Suspected cancer</span>", html:"<b>NICE NG12:</b> consider a suspected cancer pathway referral for testicular cancer in men with a non-painful enlargement or change in shape or texture of the testis, and consider a direct-access ultrasound for unexplained or persistent testicular symptoms. A history of undescended testis — treated or not — raises the lifetime risk, so apply these criteria without hesitation. A palpable undescended or ectopic testis is not itself a testicular cancer diagnosis; refer to adult urology where assessment or treatment is required.", src:"NICE NG12"}
       ]}
     ]},

    {id:"treat", nav:"Treat", title:"Treatment — specialist-led",
     blocks:[
       {b:"ladder", steps:[
         {step:"Usually managed in primary care", title:"Clearly retractile testis — watchful waiting", when:"reaches and stays, at least temporarily", fromLabel:"no surgery",
          html:"Reassure; review yearly until puberty, documenting the position. Refer if the diagnosis is uncertain, the testis is high, it cannot be maintained in the scrotum, it becomes progressively higher, or it was previously documented in the scrotum but is no longer scrotal."},
         {step:"Palpable", title:"Orchidopexy", when:"true undescended, palpable", fromLabel:"from ~6 months; by 12–18 months",
          html:"Usually open inguinal or scrotal orchidopexy as a day case; an associated hernia is dealt with at the same operation."},
         {step:"Non-palpable", title:"Laparoscopy ± orchidopexy", when:"not felt", fromLabel:"specialist",
          html:"Specialist examination under anaesthesia and/or laparoscopy; treatment depends on the findings — a one- or two-stage orchidopexy if the testis is viable."},
         {step:"Not recommended", title:"Hormonal treatment", when:"", fromLabel:"",
          html:"Surgery is the standard treatment for unilateral undescended or ectopic testes; do not offer hormonal treatment in primary care to induce descent. Specialist endocrine treatment may be considered in selected bilateral cases, mainly for fertility preservation (EAU)."},
         {step:"After puberty", title:"Orchidopexy or orchidectomy", when:"untreated in an adolescent or man", fromLabel:"shared decision",
          html:"Refer an adolescent or adult with an untreated undescended testis to adult urology for individualised counselling on orchidopexy, orchidectomy, malignancy risk, fertility, endocrine function and prosthesis — this is not a primary-care treatment decision, and orchidectomy is not an automatic rule (EAU). Orchidectomy is generally favoured after puberty for an intra-abdominal testis with a normal contralateral testis, and considered for a palpable one; orchidopexy is favoured where fertility or endocrine function matters — bilateral disease, contralateral dysfunction or a solitary functioning testis."}
       ]},
       {b:"say", html:"His testis isn't sitting in the scrotum yet. Some settle on their own in the first few months, so we'll check again at his 6–8-week and 4–5-month checks; if it's still up, I'll refer him so a small operation can be done in his first year, ideally between six months and one. That timing gives the testis its best chance, and later on we'll talk about checking himself regularly as he gets older."}
     ]},

    {id:"refer", nav:"Refer", title:"Referral criteria and timing",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Within 24 hours — senior paediatrics", html:"Bilateral impalpable testes, a unilateral impalpable testis with or without hypospadias, or a unilateral palpable undescended testis with hypospadias at the newborn check (NIPE)."},
         {tone:"red", h:"Same day", html:"Undescended testis with atypical genitalia (urgent paediatric/DSD assessment) · acute pain at the testis site (immediate emergency surgical transfer)."},
         {tone:"amber", h:"Urgent paediatrics", html:"Bilateral non-palpable testes found at a later check."},
         {tone:"blue", h:"Paediatric surgery or urology", html:"Unilateral palpable testis still undescended after re-examination at the 6–8-week check and, if necessary, at 4–5 months; one that becomes impalpable; or one found at any later age; an ascending testis when found. Refer promptly per the local Bolton/Greater Manchester pathway, aiming for specialist review by 6 months (corrected age in preterm infants) and treatment completed by 12 months where possible and by 18 months at the latest. Refer to paediatric (rather than adult) surgeons for infants, bilateral or non-palpable testes, and recurrence."},
         {tone:"purple", h:"Suspected testicular cancer <span class='tw'>Suspected cancer</span>", html:"Non-painful enlargement or change in shape or texture of the testis → suspected cancer pathway (NICE NG12).", src:"NICE NG12"},
         {tone:"blue", h:"Adult urology", html:"Untreated undescended testis in an adolescent or man, for individualised counselling on orchidopexy, orchidectomy, malignancy risk, fertility, endocrine function and prosthesis; fertility concerns. Not a primary-care treatment decision."},
         {tone:"green", h:"GP review", html:"Clearly retractile testis: yearly until puberty, documenting whether it can be brought down and stays. Refer if uncertain."}
       ]}
     ]},

    {id:"lifestyle", nav:"Counselling", title:"Counselling and long-term support",
     blocks:[
       {b:"table", head:["Topic","What to do"], rows:[
         ["<b>Parents</b>","Explain retractile versus true undescended, and why surgery for a true undescended testis is timed for the first year"],
         ["<b>Testicular awareness</b>","From puberty, advise testicular awareness (self-examination is one way) and prompt review of a new persistent lump, enlargement, change in shape or texture, persistent discomfort, or an apparently absent or re-ascending testis — this continues after orchidopexy, which improves access for examination but does not remove the risk"],
         ["<b>Fertility</b>","Subfertility risk is higher, particularly after bilateral disease; offer assessment when concerns arise"],
         ["<b>Adolescents</b>","Body image and prosthesis questions; psychological support if needed"],
         ["<b>After surgery</b>","Follow the surgical team's instructions on analgesia, activity and follow-up; check the testis position at routine reviews"],
         ["<b>Hormones</b>","Bilateral disease or anorchia: paediatric endocrinology for puberty monitoring"]
       ]}
     ]},

    {id:"monitor", nav:"Follow-up", title:"Follow-up and long-term awareness",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["<b>Retractile testis</b>","Yearly until puberty","Can it be brought down, and does it stay? Refer if it ascends"],
         ["<b>After orchidopexy</b>","Per the surgical team","Testis still in the scrotum at later reviews? Re-ascent or atrophy → re-refer"],
         ["<b>Puberty</b>","At expected onset","Bilateral disease, anorchia, very small or atrophic testes, or absent pubertal progression → paediatric endocrine assessment via the local delayed-puberty pathway"],
         ["<b>Adulthood</b>","Ongoing","Testicular awareness; NG12 for new non-painful enlargement or change in shape or texture; no routine ultrasound surveillance programme for an asymptomatic testis after orchidopexy"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"📞 Emergency", html:"Acute severe groin, scrotal or abdominal pain in a boy or man with an undescended or recently operated testis → emergency surgical assessment."},
         {tone:"amber", h:"🟠 Same day", html:"Post-operative fever, wound infection or scrotal haematoma."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A mother brings her 7-month-old son. Both testes were documented at the newborn and 6-week checks, but she now cannot feel the left one at bath time. She has read about cancer and wants \u201ca scan today\u201d. The right testis is scrotal; the left sits high in the groin, can be brought halfway down, and springs straight back on release."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Examines with warm hands in a warm room and performs the mobility test, concluding this is not retractile but a true undescended — likely ascending — testis; explains why a scan will not help and must not delay referral; refers to paediatric surgery now; checks for hypospadias and hernia; answers the cancer question honestly without precise-sounding numbers, and explains orchidopexy timing and later testicular awareness; safety-nets acute groin pain as possible torsion."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Key sources for this page, with links and the relevant sections.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>EAU/ESPU — Guidelines on paediatric urology (2026 edition, 14 February 2026)</b><br><a href="https://uroweb.org/guidelines/paediatric-urology" rel="noopener">uroweb.org/guidelines/paediatric-urology</a><span class="rd"> — undescended testes section: treatment from about 6 months, completed by 12 months and by 18 months at the latest; ultrasound lacks sensitivity and specificity, so no localisation imaging; hormonal treatment only in selected bilateral cases; yearly review of retractile testes; orchidopexy reduces but does not remove the cancer risk</span></li>'+
         '<li><b>British Association of Urological Surgeons (BAUS)</b><br><a href="https://www.baus.org.uk/" rel="noopener">baus.org.uk</a><span class="rd"> — adult management and counselling</span></li>'+
         '<li><b>NHS Newborn and Infant Physical Examination (NIPE) screening programme — programme handbook and screen-positive pathway for undescended testes; NIPE screening standards</b><br><a href="https://www.gov.uk/government/publications/newborn-and-infant-physical-examination-programme-handbook" rel="noopener">gov.uk — NIPE programme handbook</a><span class="rd"> — bilateral impalpable testes, a unilateral impalpable testis with or without hypospadias, or a unilateral palpable undescended testis with hypospadias at the newborn check: senior paediatric review within 24 hours; palpable but not scrotal: re-examination at the 6–8-week check, GP review at 4–5 months, referral if still undescended with specialist review by 6 months (accessed September 2026)</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (current version, accessed September 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — recommendations organised by symptom (testicular): suspected cancer pathway referral and direct-access ultrasound</span></li>'+
         '<li><b>EAU — Guidelines on sexual and reproductive health (2026)</b><span class="rd"> — adult orchidectomy versus orchidopexy; self-examination in men with a history of cryptorchidism</span></li>'+'<li><b>GIRFT / BAUS — Children and young people: testicular torsion pathway (19 May 2026)</b><br><a href="https://www.gettingitrightfirsttime.co.uk/" rel="noopener">gettingitrightfirsttime.co.uk</a><span class="rd"> — immediate referral to a centre able to explore; ultrasound must not delay treatment (occasional adjunct only where it causes no significant delay)</span></li>'+'<li><b>Pettersson A, Richiardi L, Nordenskjöld A, Kaijser M, Akre O. Age at surgery for undescended testis and risk of testicular cancer. N Engl J Med 2007;356:1835–41</b><span class="rd"> — lower testicular cancer risk with orchidopexy before puberty; the risk is reduced, not eliminated</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Undescended testis in primary care. Bilateral impalpable testes, a unilateral impalpable testis, or a palpable undescended testis with hypospadias at the newborn check: senior paediatric review within 24 hours (NIPE). Any atypical genitalia: urgent paediatric/DSD assessment (possible DSD or CAH). Acute pain at the testis site: emergency surgical assessment for torsion. The mobility test separates retractile from true undescended testes. Palpable but not scrotal: re-examine at 6–8 weeks and 4–5 months; still undescended, impalpable or found later: refer to paediatric surgery or urology for specialist review by 6 months (corrected age) and treatment completed by 12 months where possible, 18 months at the latest. No localisation imaging before referral. Retractile testes: yearly review. Lifelong testicular awareness; NICE NG12 for testicular change. Sources: EAU/ESPU, BAUS, NHS NIPE programme, NICE NG12."
});
