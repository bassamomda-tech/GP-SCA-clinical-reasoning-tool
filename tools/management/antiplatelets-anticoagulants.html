  quick:[
    {tone:"red", h:"⚠ Dose by creatinine clearance, not eGFR", html:"The licences use creatinine clearance (Cockcroft-Gault). The lab reports eGFR, and the two diverge most in small elderly women — where CrCl runs far below eGFR. <b>So \"the standard dose\" overdoses exactly the patients who bleed.</b> <b>Calculate CrCl at initiation and at every review</b>, because weight and creatinine both drift."},
    {tone:"blue", h:"Apixaban 5 mg BD is the usual default", html:"Reduce to 2.5 mg BD only if TWO of: age ≥80 · weight ≤60 kg · creatinine ≥133 µmol/L. Rivaroxaban 20 mg OD with food (15 mg if CrCl 15–49). Edoxaban 60 mg OD (30 mg if CrCl 15–50, ≤60 kg, or with ciclosporin, dronedarone, erythromycin or ketoconazole). Dabigatran 150 mg BD (110 mg if ≥80 or on verapamil)."},

    {tone:"red", h:"⛔ Never unilaterally stop specialist-mandated DAPT", html:"Stopping mandated dual antiplatelet therapy early risks stent thrombosis, which is often fatal — and leaving forgotten DAPT running for years causes bleeding. <b>Every DAPT patient needs a visible stop date on the repeat screen.</b> Most dental work, skin surgery and cataract surgery needs no interruption at all."},
    {tone:"amber", h:"The missed-dose rule is product-specific", html:"Apixaban (BD): take the missed dose immediately, then continue as before. Dabigatran (BD): the missed dose may be taken up to 6 hours before the next is due — omit it if less time remains. Rivaroxaban and edoxaban (OD): take immediately, then resume the normal schedule next day. Never double up. The widely-quoted \"take it if under 6 hours late\" is the DABIGATRAN rule and does not apply to the others."},

       {b:"dl", rows:[
         ["<b>Choosing between them</b>","Apixaban has the best GI-bleed profile but is twice daily. Rivaroxaban and edoxaban are once daily — better for adherence and dosette boxes. Dabigatran is the only one with dyspepsia as a common side effect and is fully renally cleared. <b>Once-daily beats \"best on paper\" if adherence is shaky</b>"],
         ["<b>Under-dosing is an error too</b>","Giving apixaban 2.5 mg BD \"to be safe\" without meeting two criteria is under-anticoagulation, and that means strokes. Audit in both directions"],

         ["<b>Gastroprotection</b>","A PPI alongside DAPT, or alongside a single antiplatelet where there is any of: prior ulcer or bleed, age ≥65 with risk factors, or concurrent SSRI, steroid, NSAID or anticoagulant. With clopidogrel use lansoprazole or pantoprazole — omeprazole and esomeprazole blunt it via CYP2C19"],

       {b:"table", head:["Situation","What to advise"], rows:[
         ["<b>Missed DOAC dose — product-specific, NOT one rule</b>","Apixaban (BD): take the missed dose immediately, then continue BD as before. Dabigatran (BD): the missed dose may be taken up to 6 hours before the next dose is due — omit it if less than 6 hours remain. Rivaroxaban and edoxaban (OD): take immediately and continue the normal OD schedule the next day. NEVER double up. Check the individual SPC — the widely-quoted \"take it if under 6 hours late\" is the dabigatran rule and does not apply to the others"],

     blocks:[

    {id:"check", nav:"Before you change", title:"Before you start, stop or switch — the 5-point check",
     sub:"Wrong dose for the kidneys, drifted durations and unilateral stops of specialist drugs cause most antithrombotic harm.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"1 · Class", html:"Arterial → antiplatelet. AF or VTE → anticoagulant. Valve or antiphospholipid syndrome → warfarin. Right aisle?"},
         {tone:"red", h:"2 · Dose", html:"<b>CrCl calculated, not eGFR?</b> <b>The four reduction rules applied — in BOTH directions?</b>"},
         {tone:"amber", h:"3 · Duration", html:"<b>Is there a visible stop date for DAPT or provoked VTE?</b> Has a specialist-set duration been respected?"},
         {tone:"amber", h:"4 · Interactions", html:"Inducers including St John's Wort, azoles, NSAIDs, a second antithrombotic — and is PPI cover indicated?"},
         {tone:"blue", h:"5 · Switching — no gaps, no overlaps", html:"Warfarin → DOAC: start when INR is below 2–2.5. DOAC → warfarin: overlap until INR ≥2, or cover with LMWH. DOAC → DOAC: start at the next scheduled dose."},
         {tone:"green", h:"Complex?", html:"<b>Anticoagulation service, haematology or cardiology</b> — switching in valve disease, extremes of weight, or on a recent stent is not a solo decision."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Who to call",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Emergency — 999", html:"Major bleeding, or any neurological change on an anticoagulant → admit immediately. Reversal agents exist and speed matters. Head injury on an anticoagulant goes to A&amp;E however well the patient feels — intracranial bleeding can be delayed."},
         {tone:"purple", h:"2WW · NICE NG12 — unexplained bleeding or anaemia", html:"<b>Investigate as cancer before blaming the drug.</b> Visible haematuria aged 45 and over → urgent suspected bladder or renal cancer referral. Iron-deficiency anaemia or rectal bleeding aged 50 and over → FIT (refer at ≥10 µg Hb/g) and the colorectal pathway. Unexplained weight loss with abdominal pain aged 40 and over → urgent direct-access imaging."},
         {tone:"amber", h:"Cardiology", html:"Any change to mandated DAPT · triple-therapy planning · a recent stent needing surgery."},
         {tone:"amber", h:"Haematology", html:"Antiphospholipid syndrome · recurrent VTE on treatment · extremes of weight · CrCl under 15 · suspected heparin or DOAC failure."},
         {tone:"blue", h:"Anticoagulation service", html:"<b>Warfarin management, bridging plans and complex switches.</b>"},
         {tone:"cream", h:"GP management", html:"Class selection, CrCl-based dosing and the four rules, VTE stop dates, antiplatelet durations and gastroprotection, interactions and missed-dose counselling, graded bleeding response, and the annual review all belong here. Related pages: <a href='atrial-fibrillation.html'>atrial fibrillation</a> · <a href='dvt.html'>DVT</a> · <a href='pulmonary-embolism.html'>pulmonary embolism</a> · <a href='stable-angina.html'>stable angina</a> · <a href='mi-secondary-prevention.html'>post-MI secondary prevention</a> · <a href='tia-stroke.html'>stroke and TIA</a>."}
       ]},
       {b:"say", html:"This tablet is protecting you from a stroke, and the trade-off is that you will bleed more easily. So we match the dose to your kidneys every year, we avoid ibuprofen-type painkillers, and if you ever see blood where it should not be, we look for the cause properly rather than just blaming the tablet."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"An <b>81-year-old woman weighing 54 kg</b> attends for her annual review. She has AF and takes <b>apixaban 5 mg BD</b>, started three years ago. Her <b>creatinine is 138 µmol/L</b> and the lab <b>eGFR reads 46</b>. She has recently started buying <b>ibuprofen gel and tablets</b> for knee pain, mentions <b>bruising \"more than I used to\"</b>, and her <b>haemoglobin has fallen from 126 to 104</b> since last year."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Recognises she now meets TWO reduction criteria — age ≥80 and weight ≤60 kg, with creatinine ≥133 as a third — so 5 mg BD is an overdose and should be 2.5 mg BD; <b>calculates CrCl rather than reading the eGFR of 46</b>, and can explain why the two diverge in a small elderly woman; treats the falling haemoglobin as occult bleeding needing investigation, not as a side effect to accept — and knows iron-deficiency anaemia on a DOAC is an NG12 route; <b>stops the oral NSAID and addresses the OTC purchase specifically</b>, offering topical or alternative analgesia; <b>does not stop the apixaban</b> for nuisance bruising, but does fix the modifiables; <b>checks blood pressure, alcohol and falls risk as ORBIT modifiables</b>; and <b>documents the recalculated dose with the reasoning</b>, since this is precisely the silent error the annual review exists to catch."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",

         '<li><b>NICE NG196 — Atrial fibrillation: diagnosis and management</b><br><a href="https://www.nice.org.uk/guidance/ng196" rel="noopener">nice.org.uk/guidance/ng196</a><span class="rd"> — DOAC first-line, the CHA₂DS₂-VASc ≥2 threshold with the same score of 2 in women as in men, ORBIT as the preferred bleeding-risk tool used to fix modifiables, and no role for aspirin in AF stroke prevention</span></li>'+
         '<li><b>NICE NG158 — Venous thromboembolic diseases</b><br><a href="https://www.nice.org.uk/guidance/ng158" rel="noopener">nice.org.uk/guidance/ng158</a><span class="rd"> — the apixaban and rivaroxaban loading schedules, the LMWH lead-in required for edoxaban and dabigatran, extended prophylaxis dosing, and the provoked versus unprovoked duration rules</span></li>'+
         '<li><b>NICE NG128 — Stroke and TIA in over 16s</b><br><a href="https://www.nice.org.uk/guidance/ng128" rel="noopener">nice.org.uk/guidance/ng128</a><span class="rd"> — clopidogrel 75 mg as long-term secondary prevention, the aspirin plus MR dipyridamole alternative, and the 21-day DAPT course after high-risk TIA or minor stroke</span></li>'+
         '<li>British Society for Haematology — peri-operative management of anticoagulation<span class="rd"> — the 24/48-hour DOAC stop intervals, the longer interval for dabigatran, the no-bridging rule, and the procedures that need no interruption</span></li>'+
         '<li><b>BNF and the individual Summaries of Product Characteristics</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — the four DOAC dose-reduction rules with their exact licence criteria, dosing by creatinine clearance (Cockcroft-Gault) rather than eGFR, and the PRODUCT-SPECIFIC missed-dose rules</span></li>'+
         '<li><b>ISTH guidance on DOACs at extremes of body weight</b><span class="rd"> — apixaban or rivaroxaban preferred above 120 kg or BMI 40, where DOAC evidence thins</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (May 2025)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — the haematuria, iron-deficiency anaemia and weight-loss routes applied when a patient on an antithrombotic bleeds</span></li>'+
         '<li><b>MHRA Drug Safety Updates</b><span class="rd"> — clopidogrel with omeprazole or esomeprazole via CYP2C19; DOAC interactions with enzyme inducers including St John\u2019s Wort; the named reversal agents</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Antithrombotic prescribing in adults — NICE NG196 (AF), NG158 (VTE), NG128 (stroke/TIA) and BSH guidance. Pick the class by mechanism, then dose by creatinine clearance (Cockcroft-Gault), never the lab eGFR. Apply the four DOAC reduction rules in BOTH directions — under-dosing causes strokes. Book the stop date for provoked VTE and DAPT at the moment you prescribe. The missed-dose rule is product-specific: the \"6 hours\" rule is dabigatran's alone. Never unilaterally stop specialist-mandated DAPT. Blood where it should not be means investigate first and decide about the drug second. Doses are licence-based; verify against the current BNF and your local formulary before prescribing."
});
