<script>
MG.render({
  icon:"💊",
  title:"Benzodiazepines and z-drugs — prescribing and deprescribing",
  eyebrow:"Protocol · NICE NG215 · TA77 · CG113 · MHRA · Greater Manchester guidance",
  stemTitle:"Tolerance can develop within days to weeks in some patients, after which the patient is largely taking the drug to stave off withdrawal — so setting the expectation of a short course at the very FIRST prescription is what prevents decades of dependence",
  stemSub:"One page for the whole drug class. Reserve these for severe, disabling symptoms for the shortest possible duration: aim for a few days and normally no longer than 2 weeks for insomnia, and no more than 2–4 weeks in total including any taper (MHRA; product information), as an acute script, with the stop plan agreed BEFORE the first prescription. Then the larger job — <b>proactively review every long-term user</b>, prioritising those aged 65 and over and those with falls, cognitive impairment, sedation, respiratory disease or opioid/gabapentinoid co-prescribing. Reduce the current drug directly or switch to diazepam selectively, agree a <b>slow, stepwise, patient-led reduction</b> (often about 5–10% of the current dose every 2–4 weeks), go slower near the end, and <b>delay, shrink or, if needed, step back to the previous tolerated dose</b> when withdrawal is troublesome. Never stop abruptly after prolonged use — that risks seizures and delirium.",
  guideline:"NICE NG215 · NICE TA77 · NICE CG113 · MHRA Drug Safety Updates · GMMMG benzodiazepine and Z-drug resource pack · Canadian BZRA deprescribing guideline (supporting)",
  reviewed:"14 September 2026",
  nextReview:"14 March 2027",
  meta:[
    {t:"NICE NG215 · TA77 · CG113 · MHRA"},
    {t:"Shortest course — normally ≤2 weeks for insomnia, ≤2–4 weeks in total; stop plan first", tone:"tw"},
    {t:"Never stop abruptly — seizure risk", tone:"tw"},
    {t:"v2.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#before"><b>Before</b><small>Stop plan first</small></a><a href="#prescribe"><b>If you must</b><small>Shortest course</small></a><a href="#review"><b>Review</b><small>Find long-term users</small></a><a href="#taper"><b>Taper</b><small>Slow, patient-led</small></a><a href="#refer"><b>Refer</b><small>Complex</small></a></div>',
  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Never stop abruptly after prolonged use", html:"Abrupt withdrawal can cause seizures, delirium and severe rebound anxiety or insomnia. Taper over weeks to months, scaled to how long they have been taking it. This applies equally to someone else's abrupt stop — a hospital discharge or care-home transfer that drops the drug is the same hazard."},
    {tone:"amber", h:"Shortest possible course, and agree the stop plan BEFORE prescribing", html:"Only for severe, disabling symptoms, at the lowest effective dose. National maximum (MHRA): treatment should not normally exceed 2–4 weeks in total, including any tapering; NICE TA77 — zaleplon up to 2 weeks, zolpidem and zopiclone up to 4 weeks including tapering; follow the individual product information and local formulary. <b>Practice standard: an ACUTE script for no more than 2 weeks, preferably under 1 week for a hypnotic</b> — never an automatic repeat. Explain the dependence and withdrawal risk and agree how and when it will stop before the first prescription. <b>Do not issue a repeat or further prescription without a documented clinical review</b> — face to face where clinically indicated; telephone or video may suit some patients."},
    {tone:"red", h:"⛔ Avoid with opioids, gabapentinoids and alcohol", html:"Avoid co-prescribing with opioids, gabapentinoids (pregabalin or gabapentin), sedating antihistamines or other CNS depressants whenever possible, and advise avoiding alcohol — additive sedation and respiratory depression. MHRA: co-prescribe a benzodiazepine/Z-drug and an opioid only if there is no alternative — document the rationale, use the lowest effective doses for the shortest duration, review all sedatives and monitor for sedation and respiratory depression. Higher risk: older age and frailty, COPD, sleep-disordered breathing or other respiratory disease, renal or hepatic impairment, high opioid dose, alcohol or illicit sedative use, other sedating medicines. Gabapentinoids alone can cause severe respiratory depression. <b>Where the combination is inherited, review it as a priority.</b> And query any hospital-initiated script that arrives without a course duration or review plan — do not continue it by default."},
    {tone:"blue", h:"Who to review: every long-term user", html:"Proactively review all long-term users. Prioritise people aged 65 and over, and those with falls, fractures, cognitive impairment, daytime sedation, respiratory disease, polypharmacy, opioid/gabapentinoid co-prescribing or dependence-related problems. (The Canadian BZRA deprescribing guideline recommends offering tapering to adults 65 and over regardless of duration and to 18–64s beyond 4 weeks — supporting evidence, not a NICE threshold.) <b>Expected gains: better alertness and cognition, and fewer falls.</b> Shared decision-making with a patient decision aid; dose reduction rather than complete cessation may be the realistic first goal. If they do not agree, do not stop abruptly or pressurise them — document the decision and safety plan and keep reviewing."},
    {tone:"green", h:"The taper: slow, stepwise, patient-led", html:"First consider reducing the current drug directly; switch to diazepam selectively (short half-life or high-potency drug, interdose withdrawal, or strengths that do not allow small enough steps). A reasonable starting point is about 5–10% of the current dose every 2–4 weeks; some tolerate up to about 25% every 2 weeks, but that is not a standard or target (NICE NG215). Use smaller reductions and longer intervals as the dose falls. If withdrawal is troublesome, delay the next reduction or make it smaller; if severe or persistent, return to the previous tolerated dose and restart more slowly once stable."},
    {tone:"amber", h:"No 'trial of the others', and no substitute dependence", html:"If a patient does not respond to one z-hypnotic, do NOT try the others — only switch for an agent-specific adverse effect. And do not substitute promethazine or a sedating antidepressant for chronic insomnia: neither is licensed for it, and swapping one dependence for another is not deprescribing."}
  ],
  pathwaySub:"Seven steps. The first two prevent dependence; the rest undo it.",
  pathway:[
    {title:"Confirm the indication is genuinely short-term and severe", html:"Optimise non-drug treatment first, treat the comorbidity, and agree the stop plan before prescribing.", alert:true},
    {title:"If you must prescribe: lowest dose, shortest course, acute script", html:"Named agent and dose, normally no more than 2 weeks for insomnia, no automatic repeat, no further prescription without a documented clinical review."},
    {title:"Search for and review every long-term user", html:"Decide: deprescribe (most), treat the underlying cause first, or a different problem entirely."},
    {title:"Taper the current drug, or switch to diazepam selectively", html:"Direct tapering is acceptable; consider diazepam for short half-life or high-potency drugs or interdose withdrawal. Equivalences are approximate; caution in hepatic impairment and frailty."},
    {title:"Taper slowly, patient-led", html:"<b>Often about 5–10% of the current dose every 2–4 weeks; smaller steps near the end; delay, shrink or step back to the previous tolerated dose on a setback.</b>"},
    {title:"Manage the safety issues throughout", html:"Withdrawal, driving, falls and cognition in the elderly, and the dangerous combinations."},
    {title:"Refer the complex and high-risk", html:"Talking Therapies, substance-misuse service, CMHT, or specialist taper support; specialist advice before withdrawal in epilepsy, pregnancy, high-dose or polysubstance use, and other excluded groups."}
  ],
  sections:[

    {id:"before", nav:"Before", title:"Step 1 — before you prescribe at all",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>The only indications</b>","Benzodiazepine — short-term, severe, disabling anxiety causing unacceptable distress. Z-hypnotic — short-term, severe, disabling insomnia. <b>NOT for mild or chronic symptoms, or for distress alone</b>. Not a treatment for chronic anxiety or GAD, and not routine treatment for panic disorder (NICE CG113)"],
         ["<b>Exclude first</b>","Intoxication or withdrawal states · delirium · mania, psychosis or severe depression · obstructive sleep apnoea or another sleep disorder · respiratory compromise · substance misuse · pregnancy or breastfeeding considerations"],
         ["<b>Optimise non-drug treatment first</b>","Insomnia → sleep hygiene plus CBT-I (see <a href='insomnia.html'>insomnia</a>). Anxiety → low-intensity psychological interventions or Talking Therapies first-line. Continue these alongside any prescription"],
         ["<b>Treat the comorbidity</b>","Pain, respiratory or cardiac disease, depression, panic, substance misuse — treating these often resolves the sleep or anxiety symptom. Review culprit medicines"],
         ["<b>Agree the stop plan UPFRONT</b>","Before prescribing, discuss expected benefit; dependence, tolerance and withdrawal; sedation, falls, cognition and driving; interactions with alcohol, opioids, gabapentinoids and other sedatives; and pregnancy and breastfeeding implications. Agree and document the indication, drug and dose, duration, stop date, review arrangements and what will happen if it is ineffective. <b>Document that further scripts will not usually be given</b>"],
         ["<b>Don't reissue blind</b>","Do NOT issue a repeat or further prescription without a documented clinical review. Use face-to-face review where clinically indicated — intoxication or over-sedation, falls or confusion, respiratory depression, misuse, diversion or multiple prescribers, dose escalation, or complex withdrawal; telephone or video may be appropriate for others"]
       ]},
       {b:"warn", html:"<b>Benzodiazepines and z-hypnotics are dependence-forming.</b> Long-term use gives limited benefit but well-documented harms: tolerance, dependence, falls and fractures, cognitive impairment and dementia association, daytime sedation and road-traffic accidents — all magnified in older people."},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"😴 Non-drug first", html:"CBT, CBT-I, sleep hygiene and self-help are first-line for insomnia and anxiety — the goal is to avoid or limit these drugs."},
         {tone:"blue", h:"📉 Gradual withdrawal", html:"For long-term users, agree a slow patient-led taper (reduce the current drug directly, or switch to diazepam selectively) with support."},
         {tone:"blue", h:"🧠 Treat the driver", html:"Address the underlying anxiety, depression, pain or substance use rather than perpetuating the prescription."},
         {tone:"amber", h:"⏱️ Why the first script matters most", html:"Tolerance to the hypnotic and anxiolytic effect can develop within days to weeks in some patients, after which the patient may largely be taking the drug to stave off withdrawal. MHRA: dependence and withdrawal can occur even with short-term use at therapeutic doses."}
       ]}
     ]},

    {id:"prescribe", nav:"If you must", title:"Step 2 — short course, lowest dose, named agent",
     blocks:[
       {b:"info", html:"If a drug is genuinely needed for a severe, short-lived crisis: lowest effective dose, shortest possible duration — preferably a few days and normally no more than 2 weeks for insomnia, within the 2–4-week total including taper — as an ACUTE script. <b>The doses below are examples only</b> and must be checked against current product information, contraindications, age, frailty, hepatic and renal function, respiratory status, other sedatives, interactions and the local formulary before prescribing."},
       {b:"table", head:["Indication","Agent","Dose","Note"], rows:[
         ["<b>Insomnia</b>","<b>Zopiclone</b>","<b>3.75–7.5 mg at night (3.75 mg if elderly)</b>","Z-hypnotic; up to 12 hours of driving impairment"],
         ["<b>Insomnia</b>","<b>Zolpidem (Stilnoct®)</b>","<b>5–10 mg at night (5 mg if elderly)</b>","Second-line z-hypnotic"],

         ["<b>Anxiety (crisis)</b>","<b>Diazepam (Valium®)</b>","<b>2 mg (up to 5 mg) for a few days</b>","Long-acting benzodiazepine. Not a treatment for chronic anxiety or GAD"],
         ["<b>Anxiety (short)</b>","<b>Lorazepam (Ativan®)</b>","<b>0.5–1 mg</b>","Not a preferred routine treatment — short half-life and potency may increase withdrawal difficulty"]
       ]},
       {b:"table", head:["Rule","Detail"], rows:[
         ["<b>No \"trial of the others\"</b>","If a patient does not respond to one z-hypnotic, do NOT try the others. Only switch z-hypnotic for an agent-specific adverse effect"],
         ["<b>Avoid combinations</b>","Avoid co-prescribing with opioids, gabapentinoids, sedating antihistamines or other CNS depressants whenever possible, and advise avoiding alcohol. If a benzodiazepine/Z-drug and opioid combination is clinically unavoidable (MHRA): document the rationale, lowest effective doses for the shortest duration, review all sedatives, monitor for sedation and respiratory depression"],
         ["<b>Check discharge scripts</b>","Do not continue a hospital-initiated benzodiazepine or z-hypnotic without confirming the indication, duration and review plan; don't continue by default"]
       ]},
       {b:"why", html:"The evidence base supports only short courses: tolerance to the hypnotic and anxiolytic effect can develop within days to weeks in some patients, after which the patient may largely be taking the drug to stave off withdrawal. Setting the expectation of a short course at the very first prescription is what prevents decades of dependence."}
     ]},

    {id:"review", nav:"Review", title:"Step 3 — proactively identify and assess established use",
     blocks:[
       {b:"info", html:"Search for and proactively review every patient on a long-term benzodiazepine or z-hypnotic, prioritising people aged 65 and over and those with falls, fractures, cognitive impairment, daytime sedation, respiratory disease, polypharmacy, opioid/gabapentinoid co-prescribing or dependence-related problems. Document the original indication and current benefit; dose, duration and adherence; alcohol, opioid, gabapentinoid and illicit drug use; sedation, cognition, falls and driving; respiratory disease and sleep apnoea; pregnancy or breastfeeding; previous withdrawal attempts; mental health stability; and the patient's goals and readiness. First decide whether to <b>deprescribe</b> (most) or to <b>continue and treat the cause</b> (a minority)."},
       {b:"cards", items:[
         {tone:"blue", h:"✓ Recommend deprescribing", html:"Discuss reduction where benefit has ceased or is unclear, the original condition has resolved (e.g. insomnia now managed), harms outweigh benefits, dependence has developed, the patient wishes to reduce, or the patient is older, frail or has falls, confusion or sedation. Supporting Canadian guidance offers tapering to anyone 65 and over regardless of duration and 18–64s beyond 4 weeks — not a NICE threshold, and no one is forcibly tapered. <b>Expected gains: better alertness, cognition, and fewer falls.</b>"},
         {tone:"amber", h:"⚠ Treat the cause, don't just stop", html:"Unmanaged anxiety, depression or panic, or a physical or mental condition driving the insomnia — optimise that first (e.g. an SSRI plus psychological therapy for an anxiety disorder)."},
         {tone:"blue", h:"🔍 A different problem", html:"Restless legs, OSA or another sleep disorder masquerading as insomnia → manage that, not a hypnotic. See <a href='restless-legs.html'>restless legs</a> and <a href='osa.html'>OSA</a>."},
         {tone:"green", h:"↔ Out of scope — seek specialist advice before withdrawal", html:"Epilepsy or seizure disorders (do not reduce without appropriate professional advice) · alcohol withdrawal · previous benzodiazepine withdrawal seizures · very high-dose treatment · illicit or multiple-source use · concurrent opioid, alcohol or polysubstance dependence · severe psychiatric illness, mania, psychosis or severe depression · severe personality disorder where risk is high · palliative or end-of-life care · catatonia · procedural sedation · spasticity needing specialist treatment · pregnancy needing rapid review · a benzodiazepine genuinely effective for a specific anxiety disorder."}
       ]},
       {b:"warn", html:"Use a patient decision aid (\"Should I stop my benzodiazepine or z-drug?\"). Engagement, not coercion: if the patient does not agree to reduction, do not abruptly stop or pressurise them; explain the risks and potential benefits, document the decision and safety plan, continue regular review and revisit deprescribing when clinically appropriate — about 3–6 months may be reasonable for higher-risk patients (local practice, not a NICE interval). If continuation is not in the patient's best interests and agreement cannot be reached, do not prescribe simply because it is requested; explain and document the reasons and offer a second opinion where appropriate (NICE NG215)."}
     ]},

    {id:"taper", nav:"Taper", title:"Steps 4–5 — convert, then reduce slowly with the patient",
     blocks:[
       {b:"info", html:"<b>Tapering is the core skill.</b> First consider whether the current benzodiazepine or Z-drug can be reduced directly — simpler, and avoids accumulation, conversion error, exposure to another benzodiazepine and patient confusion. <b>Consider a gradual switch to diazepam</b> particularly for short half-life or high-potency medicines, troublesome interdose withdrawal, or when available formulations do not permit small enough reductions (NICE NG215). Conversion is approximate and individualised. In significant hepatic impairment avoid or seek specialist advice before switching to diazepam (accumulation of active metabolites) — consider an alternative such as oxazepam where appropriate. Use lower doses and more caution in older or frail patients."},
       {b:"table", head:["Drug","≈ Diazepam 5 mg equivalent"], rows:[
         ["<b>Diazepam</b>","<b>5 mg</b>"],
         ["<b>Temazepam</b>","<b>10 mg</b>"],
         ["<b>Lorazepam</b>","<b>0.5 mg</b>"],
         ["<b>Nitrazepam</b>","<b>5 mg</b>"],
         ["<b>Zopiclone</b>","<b>7.5 mg</b>"],
         ["<b>Zolpidem</b>","<b>10 mg</b>"]
       ]},
       {b:"warn", html:"<b>Approximate equivalences only (NHS SPS) — not dose conversions or prescribing instructions.</b> Individual response varies with potency, half-life, indication and patient. Z-drugs are not interchangeable with benzodiazepines milligram for milligram. Do not use to justify escalation or to match illicitly reported doses."},
       {b:"table", head:["Step","What","Detail"], rows:[
         ["<b>Agree the schedule with the patient</b>","<b>The patient controls the pace</b>","A slow, stepwise reduction proportionate to the current dose (NICE NG215): a reasonable starting point is about 5–10% of the current dose every 2–4 weeks. Some patients tolerate up to about 25% every 2 weeks (Canadian example schedule), but this is not a standard or target — go slower for very long-term or high-dose use, previous failed withdrawal, lorazepam or other short half-life drugs, significant anxiety, panic or trauma-related symptoms, previous withdrawal seizures, alcohol or drug dependence, or severe comorbidity"],
         ["<b>Go slower near the end</b>","<b>Approaching low doses</b>","Use smaller reductions and/or longer intervals as the dose becomes lower; consider planned drug-free days, and liquid or smaller-strength formulations for final small steps if tablet strengths do not allow small enough cuts"],
         ["<b>Monitor every 1–2 weeks</b>","<b>Throughout</b>","Monitor at an interval appropriate to risk — often every 1–2 weeks during active reductions (telephone, video or face to face). Warn that withdrawal — insomnia, anxiety, irritability, sweating, GI upset — is often mild and short-lived, but can be prolonged, lasting many months or longer in some people, particularly after long-term or high-dose use"],
         ["<b>If symptoms worsen, slow down</b>","<b>On a setback</b>","Assess whether symptoms are withdrawal, relapse or a new illness. Delay the next reduction or make it smaller; if symptoms are severe or persistent, return temporarily to the previous tolerated dose and restart more slowly once stable (NICE NG215). Do not use another dependence-forming medicine to treat withdrawal symptoms. Keep the non-drug insomnia and anxiety strategies going (CBT-I, behavioural)"]
       ]},
       {b:"warn", html:"Never stop abruptly after prolonged use — abrupt withdrawal can cause seizures, delirium and severe rebound anxiety or insomnia. <b>Taper over weeks to months, scaled to how long they have been on it.</b>"}
     ]},

    {id:"safety", nav:"Safety", title:"Step 6 — withdrawal, driving and co-prescribing",
     blocks:[
       {b:"table", head:["Issue","Detail","Action"], rows:[
         ["<b>Withdrawal symptoms</b>","Insomnia, anxiety, irritability, sweating, GI symptoms; rarely seizures if stopped abruptly","<b>Explain (often mild, but can be prolonged); slow taper; delay or shrink the next step, or return to the previous tolerated dose if severe</b>"],
         ["<b>Driving</b>","<b>These impair driving and are covered by drug-driving law</b>","Advise not to drive if drowsy, slowed, dizzy, poorly coordinated, cognitively impaired or otherwise unfit, with particular caution when starting, changing the dose or combining sedatives. Diazepam, lorazepam, oxazepam, temazepam and clonazepam are specified drugs under drug-driving law: a statutory medical defence may apply if lawfully prescribed, taken as directed and not impaired — there is no defence to driving while impaired. Advise checking current DVLA guidance and carrying evidence of the prescription; document the advice"],
         ["<b>Falls and cognition (elderly)</b>","<b>Increased falls, fractures, confusion, and a dementia association</b>","<b>A strong reason to deprescribe in older patients</b>"],
         ["<b>Dangerous combinations</b>","<b>Opioids, gabapentinoids, alcohol, sedating antihistamines</b>","<b>Avoid whenever possible; if unavoidable, lowest doses, shortest duration, close monitoring (MHRA); review as a priority</b>"],
         ["<b>Sedating alternatives misused</b>","<b>Promethazine, sedating antidepressants</b>","Not licensed for chronic insomnia — don't substitute one dependence for another"],
         ["<b>Pregnancy, planned pregnancy and breastfeeding</b>","<b>Individual risk–benefit discussion</b>","Avoid initiating where possible — NICE: not generally offered in pregnancy and the postnatal period except short-term for severe anxiety or agitation. Do not stop established treatment abruptly because pregnancy is identified; seek obstetric or perinatal psychiatric advice where needed and taper gradually unless there is an urgent clinical indication"]
       ]},
       {b:"why", html:"The goal is not just \"off the drug\" but better function: most patients report improved alertness and mood and fewer falls once tapered, often with no worsening of the original sleep or anxiety problem — which is the key message to share when engaging them."}
     ]},

    {id:"stalling", nav:"Taper stalling?", title:"Taper stalling? Re-run the checklist",
     sub:"Most failed tapers are too fast, or an untreated underlying problem — not a need to stay on the drug forever.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"1 · Pace", html:"Reduce the step size (12.5% or less) and lengthen the interval; let the patient set the pace."},
         {tone:"amber", h:"2 · Underlying", html:"Untreated anxiety, depression, pain or restless legs driving the symptoms? Treat it."},
         {tone:"blue", h:"3 · Non-drug", html:"<b>CBT-I, behavioural sleep strategies and relaxation in place?</b>"},
         {tone:"blue", h:"4 · Form", html:"Tablet strengths limiting the cut? Switch to diazepam or lorazepam liquid for fine steps."},
         {tone:"green", h:"5 · Support", html:"Single prescriber, regular review, decision aid, realistic expectations?"}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Step 7 — when to involve specialists",
     blocks:[
       {b:"cards", items:[
         {tone:"blue", h:"Talking Therapies / psychology", html:"CBT-I for chronic insomnia; psychological therapy for the underlying anxiety disorder — self-referral accepted in most areas."},
         {tone:"amber", h:"Substance-misuse service", html:"High-dose use, illicit or multiple-source supply, polydrug dependence, or diversion → specialist drug service for a structured withdrawal. See <a href='opioid-dependence.html'>opioid dependence</a>."},
         {tone:"amber", h:"Mental health (CMHT)", html:"Severe or refractory anxiety or depression, or where the benzodiazepine is masking a significant psychiatric illness."},
         {tone:"blue", h:"Specialist taper", html:"Failed community tapers, very long-term high-dose use, or significant withdrawal complications."},
         {tone:"red", h:"Seek advice before withdrawal", html:"Epilepsy or seizure disorders, alcohol withdrawal, previous withdrawal seizures, very high doses, illicit or multiple-source use, polysubstance dependence, severe psychiatric illness or high-risk personality disorder, palliative care, catatonia, procedural sedation, spasticity, or pregnancy needing rapid review → the relevant specialist service, using local Greater Manchester referral routes."},
         {tone:"cream", h:"GP management", html:"The decision not to prescribe, the short course with its stop plan, finding and reviewing long-term users, selective diazepam conversion, the taper and the safety issues all belong here. Check individual product information and the Greater Manchester formulary before prescribing. Related pages: <a href='insomnia.html'>insomnia</a> · <a href='anxiety.html'>anxiety</a> · <a href='opioid-prescribing.html'>opioids in non-cancer pain</a> · <a href='chronic-pain.html'>chronic pain</a> · <a href='osa.html'>OSA</a>."}
       ]},
       {b:"say", html:"These work for a short time but the body can get used to them within a couple of weeks, after which they may mostly just hold off withdrawal. We'll come off slowly, at a pace you control — most people sleep about the same but feel sharper, steadier on their feet and better in themselves once the dose is down."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 78-year-old woman has taken <b>nitrazepam 5 mg at night for about 20 years</b>, originally after a bereavement. She also takes <b>codeine</b> for back pain and <b>amitriptyline</b> for sleep. She has had <b>two falls</b> in the past year, one with a wrist fracture, and her daughter mentions she seems \"vague in the mornings\". She is adamant she \"can't sleep without them\" and has refused to change before. She drives locally."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Prioritises review because of her age, the two falls with a fracture and morning vagueness (Canadian guidance supports offering a taper at 65 and over regardless of duration); identifies the nitrazepam plus codeine plus amitriptyline combination as additive sedation and a falls driver, and prioritises unpicking it; engages rather than coerces — uses a decision aid, and accepts that a refusal after full discussion means documenting the decision and safety plan and continuing regular review, not a forced taper or an abrupt stop; frames the benefit as better alertness, steadier on the feet and fewer falls, since \"you'll sleep the same\" is the honest and persuasive message; tapers nitrazepam directly or considers switching to diazepam (approximately 5 mg; cautious in older age) and plans slow reductions of about 5–10% every 2–4 weeks, slower near the end, with liquid or smaller steps if strengths do not allow; <b>knows to delay or shrink the next step, or return to the previous tolerated dose, if withdrawal is troublesome</b>; <b>never stops abruptly</b>, naming the seizure and delirium risk; <b>gives the driving advice and documents it</b>; and addresses the back pain and the amitriptyline rather than only the benzodiazepine."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>NICE TA77 — Guidance on the use of zaleplon, zolpidem and zopiclone for the short-term management of insomnia<br><a href="https://www.nice.org.uk/guidance/ta77" rel="noopener">nice.org.uk/guidance/ta77</a><span class="rd"> — short-term use only; maximum durations (zaleplon 2 weeks; zolpidem and zopiclone up to 4 weeks including tapering); and the recommendation NOT to switch between z-hypnotics for non-response (only for an agent-specific adverse effect)</span></li>'+
         '<li><b>NICE TA77 (Z-drugs for insomnia) · NICE CG113 (generalised anxiety disorder)</b><br><a href="https://www.nice.org.uk/guidance/cg113" rel="noopener">nice.org.uk/guidance/cg113</a><span class="rd"> — do not offer a benzodiazepine for GAD except as a short-term measure during a crisis; low-intensity and high-intensity psychological interventions first-line; benzodiazepines not for routine treatment of panic disorder. The 2–4-week total limit including taper is MHRA advice; the 2-week acute-script target is this page’s local practice standard</span></li>'+
         '<li><b>Canadian benzodiazepine receptor agonist (BZRA) deprescribing guideline — Pottie K et al., Can Fam Physician 2018 (supporting evidence only; not NICE)</b><span class="rd"> — offer tapering at 65 and over regardless of duration and 18–64 beyond 4 weeks; 25% every 2 weeks as an example schedule only, not a UK standard</span></li>'+
         '<li>NICE NG215 — Medicines associated with dependence or withdrawal symptoms<br><a href="https://www.nice.org.uk/guidance/ng215" rel="noopener">nice.org.uk/guidance/ng215</a><span class="rd"> — prescribing reviews (telephone, video or face to face), shared decision-making, slow stepwise reduction proportionate to the current dose with smaller steps at lower doses, reverting to the previous dose if necessary, considering a switch to a longer half-life benzodiazepine, and not prescribing simply on request</span></li>'+
         '<li><b>NICE NG215 patient decision aid — Should I stop my benzodiazepine or z-drug?</b><span class="rd"> — prolonged withdrawal in some people; epilepsy needs professional advice before reducing</span></li>'+
         '<li><b>NHS Specialist Pharmacy Service — Oral benzodiazepines and choosing equivalent doses</b><br><a href="https://www.sps.nhs.uk" rel="noopener">sps.nhs.uk</a><span class="rd"> — approximate equivalences</span></li>'+
         '<li><b>GMMMG — Benzodiazepine and Z-drug Prescribing Resource Pack (2021; check for the current version)</b><br><a href="https://gmmmg.nhs.uk" rel="noopener">gmmmg.nhs.uk</a><span class="rd"> — local prescribing and deprescribing guidance</span></li>'+
         '<li><b>MHRA Drug Safety Updates — addiction to benzodiazepines and codeine; benzodiazepines and opioids: risk of potentially fatal respiratory depression; gabapentin: risk of severe respiratory depression; gabapentinoid product information</b><br><a href="https://www.gov.uk/drug-safety-update" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> — 2–4-week maximum including taper, co-prescribing only if no alternative, dependence even with short-term use</span></li>'+
         '<li><b>Current product information (SPCs)</b><br><a href="https://www.medicines.org.uk/emc" rel="noopener">medicines.org.uk/emc</a><span class="rd"> — doses, licensed durations, contraindications and cautions</span></li>'+
         '<li><b>Road Traffic Act 1988 (drug-driving provisions)</b><span class="rd"> — the specified-drug offence, the statutory medical defence when lawfully prescribed, taken as directed and unimpaired, and the separate offence of driving while impaired. See GOV.UK: Drug driving — guidance for healthcare professionals; Drugs and driving: the law</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Benzodiazepines and z-drugs — NICE NG215, NICE TA77, NICE CG113, MHRA Drug Safety Updates and Greater Manchester guidance, with the Canadian BZRA deprescribing guideline as supporting evidence. Tolerance can develop within days to weeks in some patients, so the expectation of a short course must be set at the first prescription: lowest effective dose, shortest possible course (normally no more than 2 weeks for insomnia; 2–4 weeks in total including taper), acute script, stop plan agreed beforehand, and no further prescription without a documented clinical review. Avoid co-prescribing with opioids, gabapentinoids and other sedatives whenever possible, and advise avoiding alcohol. Proactively review long-term users, prioritising older people and those with falls, cognitive impairment, sedation or risky co-prescribing. Reduce the current drug directly or switch to diazepam selectively, agree a slow, patient-led taper (often about 5–10% every 2–4 weeks), and delay, shrink or step back to the previous tolerated dose on a setback. Never stop abruptly after prolonged use — seizures and delirium. Check individual product information and the local formulary before prescribing."
