<script>
MG.render({
  icon:"🕊️",
  title:"Corticosteroids in palliative care",
  eyebrow:"Protocol · prescribe, monitor and stop in one place",
  stemTitle:"Dexamethasone in palliative care: a named indication, a dose from a named source, given by 2pm, with a review date, glucose checks and a Steroid Emergency Card",
  stemSub:"Dexamethasone is used for many things in advanced illness: emergencies such as spinal cord compression, raised intracranial pressure and SVC obstruction, and symptom relief such as appetite, nausea, bowel obstruction and pain from nerve compression or a stretched liver capsule. It works fast and the harms build just as fast. Decide what you are treating and how you'll know it has worked. Give the dose in the morning, or split it with the second dose by 2pm. Check glucose later in the day (late morning to early evening). Stop a trial that isn't helping, reduce one that is to the lowest effective dose, and give a Steroid Emergency Card to anyone eligible (oral dexamethasone about 500 micrograms daily or more for 4 weeks or longer).",
  guideline:"NICE NG234 (2023) · NICE NG243 (2024) · National Patient Safety Alert NatPSA/2020/005/NHSPS · MHRA Drug Safety Update (September 2007) · NOGG (2021, updated 2024) · JBDS 08 (2023) · Society for Endocrinology/SPS exogenous steroids guidance (2020) · Scottish Palliative Care Guidelines (2025) · Greater Manchester Palliative Care Pain and Symptom Control Guidelines (April 2025) · EANO-ESMO (2020)",
  meta:[
    {t:"NICE NG234 spinal metastases and MSCC (2023)"},
    {t:"NICE NG243 adrenal insufficiency (2024) · NatPSA 2020 Steroid Emergency Card"},
    {t:"Specialist/local palliative guidance: Scottish 2025 · Greater Manchester (GMMMG) 2025 · BNF"},
    {t:"Card criterion: dexamethasone ~500 micrograms/day for 4 weeks+ (Society for Endocrinology/SPS)"},
    {t:"MHRA DSU Sep 2007 · NOGG 2024 · JBDS 08 (2023)"},
    {t:"No NG12 criterion applies", tone:"tw"}
  ],
  lead:"<div class='mg-layers'><a href='#redflags'><b>Red flags</b><small>MSCC, ICP, SVCO, crisis</small></a><a href='#indications'><b>Dose by indication</b><small>Named source for each</small></a><a href='#start'><b>Start safely</b><small>By 2pm, glucose, card</small></a><a href='#taper'><b>Review and reduce</b><small>Stop what isn't working</small></a><a href='#refer'><b>Refer</b><small>Who and when</small></a></div>",
  quickSub:"The six points that change what you do. Each traces to a source listed under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"Suspected cord compression: 16 mg now", html:"For suspected MSCC with neurological symptoms or signs, give <b>dexamethasone 16 mg orally</b> (or the parenteral equivalent) as soon as possible, contact the MSCC coordinator immediately, arrange whole-spine MRI within 24 hours, and immobilise without delay (including during transfer) if neurological signs suggest spinal instability. Continue 16 mg daily until surgery or radiotherapy, then reduce gradually to stop (NICE NG234). <b>Without neurological symptoms or signs, do not give it routinely</b> — consider it only for severe pain or haematological malignancy, with the MSCC/haematology team."},
    {tone:"amber", h:"Trial, then review", html:"Each course should have a named target and a review date. For symptom-directed trials, review within about 3 to 7 days; if there is no benefit, stop. Do not stop an emergency regimen solely because benefit is not immediately obvious — discuss with the specialist team. If it helps, reduce to the lowest dose that keeps the benefit; an example taper (Scottish guideline) is halving every 3 to 5 days down to 2 mg daily, then reducing more slowly — individualise it."},
    {tone:"cream", h:"By 2pm", html:"Give a single dose in the morning, or split it with the second dose <b>no later than 2pm</b>, to reduce insomnia and agitation (Scottish Palliative Care Guidelines 2025)."},
    {tone:"blue", h:"Check glucose later in the day", html:"After a morning dose, check capillary glucose in the <b>late morning, afternoon or early evening</b> rather than relying on fasting glucose, and more often in diabetes during initiation and dose changes. Use local diabetes guidance for action thresholds: <b>repeated readings above about 12 mmol/L</b>, symptomatic hyperglycaemia, ketones, dehydration or deterioration should prompt treatment review (JBDS 08)."},
    {tone:"amber", h:"Steroid Emergency Card", html:"Offer an NHS Steroid Emergency Card to adults at risk of adrenal insufficiency, including those taking oral dexamethasone <b>approximately 500 micrograms daily or more for 4 weeks or longer</b>, subject to the current NatPSA/Society for Endocrinology criteria. Do not calculate card eligibility solely from anti-inflammatory potency equivalence. The card identifies risk; it does not prove adrenal insufficiency is present. Teach sick-day rules (NICE NG243)."},
    {tone:"blue", h:"Equivalence and route", html:"In anti-inflammatory effect, dexamethasone 750 micrograms ≈ prednisolone 5 mg (BNF). That is not adrenal-suppression equivalence: NICE NG243 gives dexamethasone about <b>0.5 mg/day</b> as the adult physiological equivalent. For SC use, follow the local palliative formulary and check the injection concentration — Greater Manchester guidance uses about 4 mg oral ≈ <b>3.3 mg SC</b> for the relevant formulation. Prescribe in mg and document the concentration and volume."}
  ],
  pathwaySub:"Five steps for every course. The red step decides whether this is an emergency.",
  pathway:[
    {title:"Is this an oncological emergency?", html:"New back pain with neurological symptoms (MSCC), headache with vomiting or new focal signs (raised ICP), swelling of the face and arms with breathlessness (SVCO). Assess airway and breathing first: stridor, airway compromise, severe breathlessness, neurological deterioration or haemodynamic instability → 999/emergency management. MSCC with neurological signs: dexamethasone 16 mg, MSCC coordinator immediately, whole-spine MRI within 24 hours, immobilise if instability is suspected. Suspected adrenal crisis: hydrocortisone 100 mg IM/IV and 999. Otherwise contact acute oncology the same day, if that fits the patient's goals.", alert:true},
    {title:"Name the target and the dose", html:"What symptom are you treating, which dose does the source give, and how will you and the patient know it has worked? Record the indication, target symptom, intended benefit, dose and route, review date, planned duration, who will review, the taper/stop plan and the out-of-hours plan."},
    {title:"Start with the safety bundle", html:"Morning dosing (last dose by 2pm), gastroprotection only when gastrointestinal risk is present, a baseline glucose where appropriate and checks late morning to early evening, an oral thrush check, a warning about insomnia, agitation, mood change and psychosis, a Steroid Emergency Card if eligible, written sick-day advice where relevant, and a written review date."},
    {title:"Review within 3 to 7 days (symptom-directed trials)", html:"Emergency regimens: review through the specialist pathway. No benefit: stop, unless stopping risks recurrence of a serious symptom (only a low-risk short course may stop without tapering — see <a href='#taper'>Review and reduce</a>). Benefit: reduce to the lowest effective dose. Re-weigh benefit against harm at every review."},
    {title:"Plan the end", html:"Don't stop prolonged or repeated courses abruptly without assessing risk; follow NICE NG243 for withdrawal, monitor for adrenal insufficiency and symptom relapse, and give sick-day rules, and a decision in advance about what happens to the steroid in the last days of life."}
  ],
  sections:[

    {id:"redflags", nav:"Red flags", title:"Red flags: when steroids are part of an emergency, or the cause of one", sub:"Some presentations need a steroid today. Others are complications of steroids already prescribed.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Suspected metastatic spinal cord compression", html:"Back or neck pain in someone with cancer, with any neurological symptoms (limb weakness, sensory change, bladder or bowel dysfunction). Offer <b>dexamethasone 16 mg orally</b> as soon as possible, arrange immediate discussion with the MSCC coordinator and whole-spine MRI within 24 hours. If neurological signs suggest spinal instability, immobilise without delay, including during transfer. If imaging then rules out MSCC, stop the dexamethasone. <b>Without neurological symptoms or signs, do not routinely give dexamethasone</b> for spinal metastases or suspected MSCC — consider it for severe pain or haematological malignancy, in discussion with the MSCC/haematology team. If there is no known cancer and lymphoma is possible, steroids can interfere with tissue diagnosis: don't delay treating a clear neurological emergency, but contact acute oncology/haematology immediately. See <a href='mscc.html'>MSCC</a>.", src:"NICE NG234 (2023)"},
         {tone:"red", h:"Raised intracranial pressure", html:"Headache worse in the morning or on lying down, vomiting, drowsiness, new focal signs or seizures in someone with brain tumour or metastases. Specialist palliative guidance (Scottish guideline, not a NICE regimen) gives <b>dexamethasone 8 to 16 mg immediately</b>, then 4 to 8 mg twice daily (second dose by 2pm), with gastroprotection. Arrange immediate same-day oncology/neurosurgical assessment for reduced consciousness, new focal neurology, seizures, papilloedema, persistent vomiting, rapidly worsening headache or concern about herniation. Use steroids only for symptomatic oedema or raised ICP — not prophylactically for asymptomatic brain metastases — at the lowest effective dose, with specialist involvement.", src:"Scottish Palliative Care Guidelines 2025: Raised intracranial pressure · EANO-ESMO 2020"},
         {tone:"red", h:"Superior vena cava obstruction", html:"Swelling of the face, neck and arms, distended chest veins, breathlessness or stridor. Assess airway, breathing, oxygenation and neurological state first: <b>stridor, airway compromise, severe breathlessness, neurological deterioration, syncope or haemodynamic instability need immediate emergency/acute oncology management</b>. Specialist palliative guidance (Scottish guideline) gives <b>dexamethasone 16 mg immediately</b>, then 8 mg twice daily (second dose by 2pm), with gastroprotection. Dexamethasone must not delay definitive assessment, imaging, stenting, radiotherapy or other specialist treatment. See <a href='svco.html'>SVCO</a>.", src:"Scottish Palliative Care Guidelines 2025: Superior vena cava obstruction"},
         {tone:"red", h:"Adrenal crisis", html:"Vomiting, collapse, hypotension, confusion or severe abdominal pain in someone on long-term steroids who has missed doses or has an intercurrent illness. Give <b>hydrocortisone 100 mg IM or IV immediately</b> — do not delay for tests — call 999 for emergency transfer, begin 0.9% sodium chloride resuscitation if clinically suitable, and continue emergency hydrocortisone per NICE/local acute-care guidance. In a palliative patient this sits within the goals of care, but don't dilute the emergency treatment.", src:"NICE NG243 (2024)"},
         {tone:"amber", h:"Very high glucose or new thirst and polyuria", html:"Steroid-induced hyperglycaemia can progress to a hyperosmolar state, especially in someone with diabetes who is also dehydrated. Check capillary glucose and ketones; in type 1 diabetes never omit basal insulin without specialist advice. Seek same-day advice if the patient is unwell, and adjust treatment in line with the goals of care.", src:"JBDS 08 (2023) · Scottish Palliative Care Guidelines 2025: Dexamethasone"},
         {tone:"amber", h:"New psychiatric symptoms", html:"Insomnia, agitation, euphoria, low mood, suicidal thoughts or psychosis, often within days of starting. Warn patients and carers in advance. Take particular care if there is a personal or family history of severe mood disorder. Reduce or stop the steroid where possible. See <a href='palliative-anxiety-depression.html'>palliative anxiety and depression</a>.", src:"MHRA Drug Safety Update, September 2007"},
         {tone:"amber", h:"Masked infection or perforation", html:"Steroids blunt fever, pain and peritonism. A patient on dexamethasone may have serious sepsis or a perforated viscus with few signs. Fever may be absent and inflammatory markers may be normal; candidiasis and opportunistic infections can occur. Keep a low threshold for assessment if they are unexpectedly unwell."}
       ]},
       {b:"why", html:"Dexamethasone reduces the oedema around a tumour, which is why it helps quickly in cord compression, raised intracranial pressure, SVC obstruction and bowel obstruction. It buys time for definitive treatment. It doesn't replace that treatment. A delay in MRI or oncology discussion while the steroid 'seems to be working' can cost the patient the ability to walk."}
     ]},

    {id:"indications", nav:"Dose by indication", title:"Dose by indication, and where each dose comes from", sub:"Only the MSCC doses are NICE guideline-supported (NG234). The others are specialist/local palliative guidance (Scottish Palliative Care Guidelines 2025; Greater Manchester Palliative Care Guidelines 2025). Where none gives a figure, seek specialist palliative-care advice. Don't use a generic range.",
     blocks:[
       {b:"table", head:["Indication","Dexamethasone dose","Source"], rows:[
         ["<b>MSCC with neurological symptoms or signs</b>","16 mg orally (or parenteral equivalent) as soon as possible, then 16 mg daily while awaiting surgery or radiotherapy; reduce gradually after it starts, and stop. Stop if MSCC is ruled out.","NICE NG234 (2023) — guideline-supported"],
         ["<b>Spinal metastases or suspected MSCC without neurological signs</b>","Not routine. Consider only for severe pain, or for haematological malignancy (16 mg immediately, then discuss ongoing treatment with the haematology MDT).","NICE NG234 (2023) — guideline-supported"],
         ["<b>Raised intracranial pressure</b>","8 to 16 mg immediately, then 4 to 8 mg twice daily (second dose by 2pm). Stop promptly if no benefit; reduce gradually in responders.","Specialist/local palliative guidance: Scottish Palliative Care Guidelines 2025"],
         ["<b>SVC obstruction</b>","16 mg immediately, then 8 mg twice daily from the next day (second dose by 2pm). Must not delay definitive treatment. Stop promptly if no benefit; reduce gradually in responders.","Specialist/local palliative guidance: Scottish Palliative Care Guidelines 2025"],
         ["<b>Malignant bowel obstruction</b>","6 to 16 mg parenterally as a time-limited trial, often 4 to 7 days, may reverse partial obstruction. Stop if there is no clinically meaningful improvement. Not a substitute for assessing complete versus partial obstruction, vomiting, perforation or sepsis.","Specialist/local palliative guidance: Scottish Palliative Care Guidelines 2025"],
         ["<b>Anorexia</b>","2 to 4 mg in the morning, reviewed after 1 week. The effect on appetite commonly fades after several weeks, so use it for a defined period; the goal is quality of life rather than weight gain.","Specialist/local palliative guidance: Greater Manchester Palliative Care Guidelines 2025 (2 to 4 mg); Scottish Palliative Care Guidelines 2025 (4 mg)"],
         ["<b>Refractory nausea; adjuvant for nerve compression or liver capsule pain</b>","Listed as indications. Dose per current local palliative guidance or specialist palliative-care advice.","Specialist/local palliative guidance: Scottish Palliative Care Guidelines 2025 · Greater Manchester Palliative Care Guidelines 2025"]
       ]},
       {b:"cards", items:[
         {tone:"blue", h:"How strong is dexamethasone?", html:"In anti-inflammatory effect, dexamethasone 750 micrograms is roughly equal to prednisolone 5 mg or hydrocortisone 20 mg. So 4 mg dexamethasone is about 27 mg prednisolone, and 16 mg is over 100 mg prednisolone. It has little mineralocorticoid effect, so it causes less fluid retention than the same anti-inflammatory dose of prednisolone. This is anti-inflammatory equivalence only: for adrenal-suppression risk, NICE NG243 gives dexamethasone about 0.5 mg/day as the adult physiological equivalent, so don't use 750 micrograms to decide Steroid Emergency Card eligibility.", src:"BNF: glucocorticoid therapy, equivalent anti-inflammatory doses"},
         {tone:"blue", h:"Subcutaneous dexamethasone", html:"If the patient can't swallow, dexamethasone can be given SC once or twice daily. Follow the local palliative-care formulary and check the injection concentration. Greater Manchester guidance uses about <b>4 mg oral ≈ 3.3 mg SC</b> for the relevant formulation — a local convention, not a universal pharmacokinetic conversion; don't apply it to a different concentration without checking the product and local guidance. Prescribe the dose in mg and document the concentration and volume.", src:"Greater Manchester Palliative Care Guidelines 2025 · Scottish Palliative Care Guidelines 2025: Dexamethasone"},
         {tone:"cream", h:"Is there a better option?", html:"Appetite, fatigue and nausea often have other treatments with fewer long-term harms. Consider the prognosis: a steroid for appetite makes more sense for a few weeks of better quality of life than for several months, when harms build up. See <a href='palliative-nausea-vomiting.html'>palliative nausea</a> and <a href='palliative-pain.html'>palliative pain</a>.", src:"Scottish Palliative Care Guidelines 2025: Anorexia/cachexia"}
       ]}
     ]},

    {id:"start", nav:"Start safely", title:"Starting safely: the bundle for every course", sub:"Set up these six things at the start, when it's easiest.",
     blocks:[
       {b:"kv", rows:[
         ["Timing","Single morning dose, or two doses with the second <b>no later than 2pm</b>. Dexamethasone lasts long enough for once-daily dosing."],
         ["Gastroprotection","Consider gastroprotection (usually a PPI) with high-dose dexamethasone, particularly with aspirin, NSAIDs, anticoagulants, previous ulcer or GI bleeding, significant dyspepsia or other GI risk factors. It is not automatically required for every short low-dose course. Review whether aspirin, NSAIDs or anticoagulation remain appropriate."],
         ["Glucose","Baseline glucose where appropriate, then capillary glucose in the late morning, afternoon or early evening after a morning dose; check more often in diabetes during initiation and dose changes."],
         ["Mouth","Look for oral candida at every review. Treat it promptly, as it spoils eating and taste."],
         ["Infection and immunity","Fever may be absent. Prolonged high-dose steroids, particularly with chemotherapy or radiotherapy, may warrant specialist consideration of Pneumocystis jirovecii (PJP) prophylaxis — ask oncology, haematology or specialist palliative care; not a blanket GP prescription. Consider varicella/zoster exposure, live vaccines, current systemic anticancer therapy, and immune checkpoint inhibitors (discuss steroid use with oncology)."],
         ["Steroid Emergency Card","If eligible: oral dexamethasone about 500 micrograms daily or more for 4 weeks or longer, per current NatPSA/Society for Endocrinology criteria. The card identifies risk; it does not prove adrenal insufficiency. Explain sick-day rules."],
         ["Documentation","The indication, target symptom, intended benefit, dose and route, planned review date and duration, who will review, the taper/stop plan and the out-of-hours plan, in the notes and on the prescription or care plan so out-of-hours clinicians can see it."]
       ]},
       {b:"cards", items:[
         {tone:"cream", h:"Morning dosing", html:"Doses should not be taken after 2pm, to reduce sleep disturbance. If a higher dose is needed in divided doses, give the second one by 2pm.", src:"Scottish Palliative Care Guidelines 2025: Dexamethasone"},
         {tone:"cream", h:"Gastroprotection for the patient at risk", html:"Consider gastroprotection with high-dose courses (for example for raised ICP and SVCO) and with GI risk factors: aspirin, NSAIDs, anticoagulants, previous ulcer or GI bleed, or significant dyspepsia. It is not automatically required for every short low-dose course.", src:"Scottish Palliative Care Guidelines 2025: Dexamethasone; Raised ICP; SVCO"},
         {tone:"amber", h:"Warn about mood and sleep", html:"Tell patients and carers that steroids can cause sleeplessness, agitation, low or high mood and, rarely, psychosis, usually within days or weeks of starting or after dose changes. Ask them to report it.", src:"MHRA Drug Safety Update, September 2007"}
       ]},
       {b:"say", html:"This steroid can reduce swelling around the tumour and often helps quickly. But it has side effects, so we'll use it as a trial: take it in the morning, we'll check your sugar later in the day, and we'll review in a few days. If it isn't helping we'll stop it. If it is, we'll bring the dose down to the lowest amount that still works. If you're given a steroid card, please carry it, and don't stop the steroid suddenly without talking to us."}
     ]},

    {id:"glucose", nav:"Glucose", title:"Steroid-induced hyperglycaemia", sub:"Common, predictable, and easy to miss if you check fasting glucose only.",
     blocks:[
       {b:"cards", items:[
         {tone:"blue", h:"When to check", html:"Once-daily morning dexamethasone raises glucose from late morning, peaking in the <b>afternoon or early evening</b>. Check capillary glucose in the late morning, afternoon or early evening (before lunch or the evening meal), not fasting — a fasting check can be normal. In diabetes, check more often during initiation and dose changes.", src:"JBDS 08 (2023) · Scottish Palliative Care Guidelines 2025: Dexamethasone"},
         {tone:"blue", h:"What level prompts action", html:"Use local diabetes guidance for action thresholds. Increase monitoring if glucose exceeds 12 mmol/L; <b>repeated readings above about 12 mmol/L</b>, symptomatic hyperglycaemia, ketones, dehydration or clinical deterioration should prompt treatment review. A single reading around 8 mmol/L is not by itself a treatment threshold in a palliative patient.", src:"JBDS 08 (2023) · local diabetes guidance"},
         {tone:"cream", h:"Targets at the end of life", html:"The end-of-life diabetes guidance relaxes targets (a range around 6 to 15 mmol/L is commonly used, but targets must be individualised), aims to avoid both hypoglycaemia and symptomatic hyperglycaemia, and keeps monitoring and injections to the minimum. A morning sulfonylurea or morning insulin fits the steroid pattern. Doses per the guidance and BNF.", src:"Diabetes UK / TREND End of Life Guidance for Diabetes Care (2021, updated 2024), as referenced by the Scottish Palliative Care Guidelines 2025"},
         {tone:"cream", h:"In hospital or hospice", html:"The JBDS guideline gives detailed algorithms for monitoring and treating steroid-induced hyperglycaemia in inpatients, including when to start gliclazide or insulin and how to reduce them as the steroid is weaned.", src:"JBDS 08: Management of hyperglycaemia and steroid (glucocorticoid) therapy (revised January 2023)"},
         {tone:"amber", h:"As the steroid comes down", html:"Glucose falls as the steroid dose falls. Reduce any glucose-lowering treatment at the same time to avoid hypoglycaemia, especially when eating is poor.", src:"JBDS 08 (2023)"},
         {tone:"red", h:"Type 1 diabetes", html:"Never omit basal insulin without specialist advice. Check ketones if glucose is raised or the patient is unwell.", src:"JBDS 08 (2023)"}
       ]},
       {b:"why", html:"Glucocorticoids raise glucose mainly after meals and for several hours after the dose. A morning dose therefore produces a peak in the afternoon and evening and a near-normal fasting glucose by the next morning. That's why a fasting test misses it, and why treatment that acts in the daytime (a morning sulfonylurea or morning intermediate-acting insulin) fits the pattern. See <a href='diabetes-unwell-insulin.html'>diabetes when unwell</a>."}
     ]},

    {id:"taper", nav:"Review and reduce", title:"Review, reduce and stop", sub:"Decide at the start how long the trial will be, and hold to it.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1", title:"Review the benefit within about 3 to 7 days", when:"decision point", tone:"cream",
          html:"For symptom-directed trials, review benefit within about 3 to 7 days (Greater Manchester guidance: within 7 days) unless the specialist indication requires a different schedule. If there's no clear benefit, stop. <b>Do not stop an emergency regimen solely because benefit is not immediately obvious</b> — MSCC, cerebral oedema or raised ICP, SVCO, nerve or airway compression, malignant bowel obstruction, or symptoms assessable only after definitive treatment: discuss with acute oncology, neurosurgery, haematology or palliative care."},
         {step:"2", title:"No benefit, short course: stop", when:"under 3 weeks", tone:"green", fromLabel:"not working",
          html:"A short, single course lasting <b>less than 3 weeks</b> may often be stopped without tapering if the daily dose is low (the Scottish guideline uses <b>no more than 6 mg daily</b>), there have been no recent or repeated courses, relapse is unlikely and there are no other risk factors for adrenal suppression. This is a local palliative rule, not a NICE rule, and not applicable to everyone — seek specialist advice if uncertain. Take care with: repeated courses · prolonged steroid use within the past year · high doses · evening dosing · concomitant inhaled, topical, intra-articular or other systemic steroids · CYP3A4 inhibitors · symptoms of adrenal insufficiency · severe relapse risk."},
         {step:"3", title:"Benefit: reduce to the lowest effective dose", when:"working", tone:"cream", fromLabel:"helpful",
          html:"Tapering must be individualised to dose, duration, response, relapse risk, prognosis and goals of care. <b>Example only, not suitable for every patient:</b> reduce fairly quickly at first, <b>for example by 50% every 3 to 5 days down to 2 mg daily</b>, then more slowly as the physiological range approaches, <b>for example 500 micrograms every 5 to 7 days</b> (Scottish guideline). If symptoms recur, return to the last effective dose and seek specialist advice. If prognosis is very short and the steroid is for symptom control, a prolonged endocrine-style taper may not be needed."},
         {step:"4", title:"Long courses", when:"3 weeks or more, repeated or high dose", tone:"amber", fromLabel:"prolonged",
          html:"The adrenal axis may be suppressed. NICE NG243: after more than 4 weeks, reduce to a physiological dose and then taper; after more than 12 weeks, taper more slowly. Reduce the therapeutic dose relatively promptly if clinically safe, then more slowly near the physiological range; consider converting to prednisolone to taper below the physiological dexamethasone dose (about 0.5 mg/day); do not test adrenal function while still on a physiological dose or above. Monitor for adrenal insufficiency, and involve endocrinology or palliative care if symptoms develop or tapering is difficult."}
       ]},
       {b:"cards", items:[
         {tone:"cream", h:"After MSCC treatment", html:"After surgery or once radiotherapy starts, reduce the 16 mg dose gradually until stopped. If dexamethasone was given before imaging and MSCC was ruled out, stop it without tapering.", src:"NICE NG234 (2023)"},
         {tone:"amber", h:"Don't stop suddenly by accident", html:"Admission, vomiting, or loss of the oral route can all cause an unplanned stop. Put the steroid on the care plan and the anticipatory prescription so out-of-hours teams know it matters.", src:"NatPSA/2020/005/NHSPS · NICE NG243 (2024)"}
       ]}
     ]},

    {id:"adrenal", nav:"Emergency card", title:"Adrenal suppression, the Steroid Emergency Card and sick-day rules", sub:"Many palliative dexamethasone regimens are potent and/or prolonged enough to create a risk of adrenal suppression, particularly at 4 weeks or more, at high doses or with repeated courses. Assess risk rather than assuming suppression in every patient.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"Who gets a card", html:"Adults at risk of adrenal insufficiency, including those taking glucocorticoids equivalent to <b>prednisolone 5 mg or more daily for 4 weeks or more</b> by any route — for oral dexamethasone, <b>approximately 500 micrograms daily or more for 4 weeks or longer</b>, subject to the current NatPSA/Society for Endocrinology criteria. Do not calculate eligibility solely from anti-inflammatory potency (750 micrograms). The card identifies risk; it does not prove adrenal insufficiency is present. It tells emergency clinicians to give hydrocortisone promptly; organisations must ensure eligible patients receive it.", src:"National Patient Safety Alert NatPSA/2020/005/NHSPS (August 2020) · Society for Endocrinology/SPS (2020) · NICE NG243 (2024)"},
         {tone:"amber", h:"Sick-day rules and emergency plan", html:"People at risk of adrenal insufficiency, and their carers, should be told about sick-day rules and what to do in a crisis, and offered a steroid card. If vomiting or diarrhoea prevents oral absorption, they need parenteral hydrocortisone.", src:"NICE NG243 (2024)"},
         {tone:"red", h:"Suspected adrenal crisis", html:"Give <b>hydrocortisone 100 mg IM or IV immediately</b> — do not delay for tests — and call 999 for emergency transfer to hospital. Start 0.9% sodium chloride (usually 1 litre over 30 minutes in adults, unless contraindicated) if clinically suitable, then continue hydrocortisone, usually 200 mg over 24 hours or 50 mg IM or IV 4 times a day, monitoring blood pressure, heart rate, electrolytes and glucose. In a palliative patient this is a goals-of-care decision, but don't dilute the emergency treatment.", src:"NICE NG243 (2024)"},
         {tone:"blue", h:"Bone health if the prognosis is long", html:"For someone likely to be on the equivalent of prednisolone 7.5 mg a day or more (over 1 mg dexamethasone) for 3 months or more, NOGG advises starting bone protection at the same time as the steroid in higher-risk people. In most palliative care this is not relevant, but it may be for longer-term brain tumour or myeloma patients. See <a href='osteoporosis.html'>osteoporosis</a>.", src:"NOGG (2021, updated 2024)"}
       ]},
       {b:"why", html:"Exogenous glucocorticoid switches off the body's own cortisol production. On the steroid, the patient is covered. Stop it suddenly, or add a stress such as infection, vomiting or surgery, and they may have too little cortisol. The national alert followed deaths from adrenal crisis in people whose steroid dependence wasn't recognised. The card exists so that the paramedic or emergency doctor recognises the risk quickly."}
     ]},

    {id:"sideeffects", nav:"Side effects", title:"Side effects to look for at every review", sub:"Most side effects depend on dose and duration. The lowest dose for the shortest time is the best prevention.",
     blocks:[
       {b:"table", head:["Problem","What to look for","What to do"], rows:[
         ["Hyperglycaemia","Thirst, polyuria, tiredness; repeated glucose above about 12 mmol/L after the dose, ketones or dehydration","Review treatment per local diabetes and end-of-life guidance; reduce the steroid if possible"],
         ["Insomnia and mood change","Poor sleep, agitation, euphoria, low mood, psychosis","Move all doses before 2pm; reduce the dose; seek advice if severe"],
         ["Oral candida","White plaques, sore mouth, altered taste","Treat promptly; check at every review"],
         ["Proximal myopathy","Difficulty standing from a chair or climbing stairs","Reduce to the lowest effective dose; it is a common reason for falls"],
         ["Dyspepsia and GI bleeding","Indigestion, melaena, especially with NSAIDs or anticoagulants","Gastroprotection in those at risk; review whether aspirin, NSAIDs or anticoagulation remain appropriate"],
         ["Infection","Fever may be absent; inflammatory markers may be normal; candidiasis or opportunistic infection; unexpected deterioration","Low threshold to assess. Prolonged high-dose steroids (especially with chemotherapy or radiotherapy): ask oncology, haematology or specialist palliative care about PJP prophylaxis"],
         ["Fluid retention and weight gain","Oedema, moon face","Explain; review dose"],
         ["Skin","Thinning, bruising, poor wound healing","Explain; protect pressure areas"]
       ]},
       {b:"cards", items:[
         {tone:"amber", h:"Psychiatric reactions", html:"All systemic steroids can cause affective, psychotic and behavioural reactions, sleep disturbance and cognitive changes. They can also occur during or soon after dose reduction.", src:"MHRA Drug Safety Update, September 2007"},
         {tone:"blue", h:"Interactions", html:"Dexamethasone is a CYP3A4 inducer and is itself affected by CYP3A4 inducers and inhibitors. Key interactions: phenytoin, carbamazepine and phenobarbital (which matter with brain tumours), rifampicin, some antifungals and antiretrovirals, anticoagulants, diabetes medicines, NSAIDs, and immunotherapy and other systemic anticancer treatments. Check the current product information (SPC), BNF and local formulary for each new drug.", src:"BNF and SPC: dexamethasone interactions"},
         {tone:"amber", h:"Immunity, vaccines and anticancer therapy", html:"Consider varicella/zoster exposure and check before any live vaccine. Check for current systemic anticancer therapy; with immune checkpoint inhibitors, corticosteroids may affect treatment plans — discuss with oncology.", src:"Specialist oncology / palliative advice"}
       ]}
     ]},

    {id:"lastdays", nav:"Last days", title:"Steroids in the last days of life", sub:"Decide in advance, with the patient and family if possible.",
     blocks:[
       {b:"cards", items:[
         {tone:"cream", h:"Stop or continue?", html:"In the last days of life, review whether dexamethasone is still providing meaningful symptom benefit. If it is not helping (for example a recent low-dose appetite trial), it may be stopped. If it is controlling headache, vomiting, seizures, cerebral oedema, nerve compression or another distressing symptom, continue it by the most appropriate route, usually SC, unless the patient's goals of care support stopping active treatment. In people with adrenal insufficiency, continue glucocorticoids unless active treatment is withdrawn after shared decision-making.", src:"NICE NG243 (2024)"},
         {tone:"cream", h:"Giving it SC", html:"Dexamethasone lasts long enough to be given as a once- or twice-daily SC injection, converting per the local palliative formulary (Greater Manchester guidance: about 4 mg oral ≈ 3.3 mg SC for the relevant formulation — check the injection concentration).", src:"Scottish Palliative Care Guidelines 2025: Dexamethasone"},
         {tone:"cream", h:"Review every medicine", html:"In the last days, review medicines, stop those that aren't helping, and plan individualised anticipatory medicines for the symptoms likely to occur.", src:"NICE NG31 (2015)"}
       ]},
       {b:"warn", html:"If you stop dexamethasone in someone with a brain tumour, plan for the return of headache, vomiting or seizures. Put anticipatory medicines for seizures (for example midazolam) in place and tell the family what might happen. Whenever a steroid is stopped, anticipate recurrence of the treated symptom and document the reason, the plan agreed with the patient and family where possible, alternative symptom-control medicines, seizure management if relevant, and who to contact if symptoms recur."}
     ]},

    {id:"refer", nav:"Refer", title:"Refer: who, how quickly, and for what", sub:"The steroid is often started in primary care. The definitive treatment usually isn't.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Immediately: MSCC coordinator or acute oncology", html:"Suspected spinal cord compression: contact the MSCC coordinator immediately; dexamethasone 16 mg if there are neurological symptoms or signs (not routinely without them), whole-spine MRI within 24 hours, immobilisation if spinal instability is suspected, and a plan for surgery or radiotherapy. No known cancer and lymphoma possible: contact acute oncology/haematology immediately.", src:"NICE NG234 (2023)"},
         {tone:"red", h:"Same day: acute oncology / neurosurgery", html:"Raised ICP with reduced consciousness, new focal neurology, seizures, papilloedema, persistent vomiting, rapidly worsening headache or concern about herniation: immediate same-day oncology/neurosurgical assessment. SVCO with stridor, airway compromise, severe breathlessness, neurological deterioration or haemodynamic instability: 999/emergency management. Otherwise suspected SVCO or raised ICP: same-day acute oncology, where active treatment fits the patient's goals.", src:"Scottish Palliative Care Guidelines 2025: SVCO; Raised ICP"},
         {tone:"red", h:"Emergency: suspected adrenal crisis", html:"Hydrocortisone 100 mg IM or IV immediately, 999 transfer, 0.9% sodium chloride and continued hydrocortisone per NICE NG243/local acute-care guidance — within the goals of care, without diluting the emergency treatment.", src:"NICE NG243 (2024)"},
         {tone:"cream", h:"Specialist palliative care", html:"Uncertain indication, a dose for an indication without a guideline figure, PJP prophylaxis questions, difficulty weaning, steroid-related complications, psychiatric side effects, or decisions about steroids in the last days.", src:"Scottish Palliative Care Guidelines 2025: Dexamethasone"},
         {tone:"cream", h:"Endocrinology", html:"Symptoms of adrenal insufficiency during or after withdrawal, or difficult tapering of a prolonged course.", src:"NICE NG243 (2024)"},
         {tone:"cream", h:"Diabetes team", html:"Hyperglycaemia that is not controlled by simple measures, or a patient on insulin whose steroid dose is changing.", src:"Diabetes UK / TREND End of Life Guidance for Diabetes Care (2021, updated 2024) · JBDS 08 (2023)"},
         {tone:"blue", h:"NG12: no criterion applies", html:"Steroid use is not a suspected-cancer criterion in NICE NG12 (updated April 2026). The emergencies above have their own pathways (NG234 for MSCC; acute oncology for SVCO and raised ICP).", src:"NICE NG12 (updated April 2026)"}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice case. The <a href='../../cases/palliative-care.html'>palliative care casebook</a> has the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Scenario", html:"A 71-year-old woman with metastatic lung cancer and type 2 diabetes was started on dexamethasone 8 mg daily by the oncology team 5 weeks ago 'for appetite and energy'. She now cannot get out of a chair easily, is sleeping badly, has a sore mouth, and her daughter reports glucose readings of 18 in the evening. Her daughter asks whether she should just stop the tablets.", src:"Practice scenario, built on the Scottish Palliative Care Guidelines 2025, NatPSA 2020 and NICE NG243"},
       {tone:"cream", h:"What the examiner is looking for", html:"Checks what the steroid was for and whether it is still helping. Recognises <b>proximal myopathy, insomnia, oral candida and steroid hyperglycaemia</b>. Explains why she <b>must not stop suddenly</b> after 5 weeks, and gives a Steroid Emergency Card and sick-day rules. Plans an individualised <b>taper</b> (for example halving to 2 mg, then slower, per NICE NG243 principles) and moves the dose to the morning. Treats thrush. Arranges same-day review of the evening glucose of 18: hydration and symptoms, ketones if relevant, diabetes treatment, the indication for dexamethasone, whether it can be reduced or stopped, and her goals of care; uses individualised end-of-life targets. Asks about the benefit of the steroid, discusses goals of care, and liaises with oncology or palliative care.", src:"Scottish Palliative Care Guidelines 2025 · NatPSA/2020/005/NHSPS · NICE NG243"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Primary sources only. NICE NG234 doses are guideline-supported; other doses are specialist/local palliative guidance (Scottish 2025; Greater Manchester 2025). Where none gives a figure, the page says to seek specialist palliative-care advice.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG234 — Spinal metastases and metastatic spinal cord compression (2023)</b><br><a href="https://www.nice.org.uk/guidance/ng234" rel="noopener">nice.org.uk/guidance/ng234</a><span class="rd"> — dexamethasone 16 mg orally (or parenteral equivalent) as soon as possible, then 16 mg daily while awaiting surgery or radiotherapy; reduce gradually after treatment starts; stop if MSCC is ruled out; not routine without neurological signs except severe pain or haematological malignancy; MSCC coordinator, immobilisation and whole-spine MRI within 24 hours</span></li>'+
         '<li><b>NICE NG243 — Adrenal insufficiency: identification and management (2024)</b><br><a href="https://www.nice.org.uk/guidance/ng243" rel="noopener">nice.org.uk/guidance/ng243</a><span class="rd"> — steroid cards and sick-day information for people on exogenous glucocorticoids at risk; parenteral hydrocortisone if oral absorption fails; hydrocortisone 100 mg IM or IV, 999 transfer and 0.9% sodium chloride for adrenal crisis; physiological dexamethasone about 0.5 mg/day; taper after more than 4 weeks, slower after more than 12 weeks; prednisolone for tapering below the physiological dose; continue glucocorticoids in adrenal insufficiency at the end of life unless active treatment is withdrawn</span></li>'+
         '<li><b>National Patient Safety Alert NatPSA/2020/005/NHSPS — Steroid Emergency Card to support early recognition and treatment of adrenal crisis in adults (August 2020)</b><br><a href="https://www.england.nhs.uk/publication/national-patient-safety-alert-steroid-emergency-card-to-support-early-recognition-and-treatment-of-adrenal-crisis-in-adults/" rel="noopener">england.nhs.uk</a><span class="rd"> — card for prednisolone 5 mg daily or equivalent for 4 weeks or more, by any route</span></li>'+
         '<li><b>Society for Endocrinology / British Association of Dermatologists / SPS — Exogenous steroids treatment in adults with adrenal insufficiency and adrenal crisis (May 2020)</b><span class="rd"> — card-risk table: oral dexamethasone 500 micrograms daily or more for 4 weeks or longer</span></li>'+
         '<li><b>Greater Manchester Medicines Management Group — Palliative Care Pain and Symptom Control Guidelines for Adults (April 2025, review April 2028)</b><br><a href="https://gmmmg.nhs.uk" rel="noopener">gmmmg.nhs.uk</a><span class="rd"> — local palliative dose table; review within 7 days and reduce to the lowest effective dose; appetite 2 to 4 mg daily reviewed after 1 week; 4 mg oral about equal to 3.3 mg SC for the relevant formulation</span></li>'+
         '<li><b>EANO-ESMO Clinical Practice Guidelines — Neurological and vascular complications of primary and secondary brain tumours (Annals of Oncology, 2020)</b><span class="rd"> — no prophylactic steroids for asymptomatic brain metastases or oedema; lowest effective dose for symptomatic patients</span></li>'+
         '<li><b>Scottish Palliative Care Guidelines (Healthcare Improvement Scotland, 2025)</b>: Dexamethasone medicines information; Raised intracranial pressure; Superior vena cava obstruction; Bowel obstruction; Anorexia/cachexia<br><a href="https://rightdecisions.scot.nhs.uk/scottish-palliative-care-guidelines/" rel="noopener">rightdecisions.scot.nhs.uk</a><span class="rd"> — a UK national guideline. No doses after 2pm; late-afternoon glucose checks; gastroprotection if also on aspirin or NSAIDs or after a GI bleed; 4 mg oral about equal to 3.3 mg SC; abrupt stop allowed if under 3 weeks at 6 mg or less; example taper of 50% every 3 to 5 days to 2 mg, then 500 micrograms every 5 to 7 days; raised ICP 8 to 16 mg then 4 to 8 mg twice daily; SVCO 16 mg then 8 mg twice daily; bowel obstruction 6 to 16 mg parenterally for 4 to 7 days; anorexia 4 mg in the morning, effect fading after 3 to 4 weeks</span></li>'+
         '<li><b>MHRA Drug Safety Update, September 2007</b> — Systemic corticosteroids: psychiatric side effects<br><a href="https://www.gov.uk/drug-safety-update" rel="noopener">gov.uk/drug-safety-update</a></li>'+
         '<li><b>Joint British Diabetes Societies for Inpatient Care, JBDS 08 — Management of hyperglycaemia and steroid (glucocorticoid) therapy (revised January 2023)</b><br><a href="https://abcd.care/resource/current/jbds-08-management-hyperglycaemia-and-steroid-glucocorticoid-therapy" rel="noopener">abcd.care</a><span class="rd"> — once-daily checks before lunch or the evening meal; more monitoring above 12 mmol/L; treatment algorithm when repeatedly above 12 mmol/L</span></li>'+
         '<li><b>Diabetes UK / TREND — End of Life Guidance for Diabetes Care (4th edition 2021, updated 2024)</b><br><a href="https://www.diabetes.org.uk" rel="noopener">diabetes.org.uk</a><span class="rd"> — relaxed targets, minimal monitoring, steroid-induced hyperglycaemia at the end of life</span></li>'+
         '<li><b>NOGG — UK clinical guideline for the prevention and treatment of osteoporosis (2021, updated 2024)</b><br><a href="https://www.nogg.org.uk" rel="noopener">nogg.org.uk</a><span class="rd"> — start bone protection with glucocorticoids in high-risk people expected to take 7.5 mg prednisolone or equivalent daily for 3 months or more</span></li>'+
         '<li><b>NICE NG31 — Care of dying adults in the last days of life (2015)</b><br><a href="https://www.nice.org.uk/guidance/ng31" rel="noopener">nice.org.uk/guidance/ng31</a></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — equivalent anti-inflammatory doses (dexamethasone 750 micrograms about equal to prednisolone 5 mg — not for card eligibility); dexamethasone interactions; doses for indications that no guideline quantifies</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — no criterion applies to this topic</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Corticosteroids in palliative care: NICE NG234 (2023), NG243 (2024) and NG31 (2015), National Patient Safety Alert NatPSA/2020/005/NHSPS, MHRA Drug Safety Update (September 2007), JBDS 08 (2023), the Diabetes UK / TREND end-of-life diabetes guidance, NOGG, the Society for Endocrinology/SPS steroid card guidance (2020), EANO-ESMO (2020), the Scottish Palliative Care Guidelines (2025) and the Greater Manchester Palliative Care Guidelines (2025). Check all doses against the current BNF and local palliative care guidance before prescribing."
