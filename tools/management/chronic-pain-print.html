  lead:'<div class="mg-layers"><a href="#safety"><b>Red flags</b><small>Re-screen every time</small></a><a href="#classify"><b>Classify</b><small>Primary · secondary · both</small></a><a href="#assess"><b>Assess</b><small>Function · mood · meds</small></a><a href="#explain"><b>Explain</b><small>The therapeutic act</small></a><a href="#first-line"><b>First-line</b><small>Exercise · ACT/CBT</small></a></div>',
  quickSub:"If you read nothing else on this page, read these six cards. Every number traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Chronic primary pain is a diagnosis, not a diagnostic failure", html:"Pain persisting or recurring beyond 3 months, with significant emotional distress or functional disability, that is not better accounted for by another condition. <b>Naming it is the first treatment.</b> “Your scan is normal, so there is nothing wrong” is the single most harmful sentence in this consultation — it is factually wrong (the mechanism is nociplastic, in the nervous system rather than the tissue), it invalidates the patient, and it guarantees the management plan will not be heard."},
    {tone:"red", h:"The NG193 do-not-start list", html:"For chronic PRIMARY pain, do not start: opioids, gabapentinoids (pregabalin, gabapentin), paracetamol, NSAIDs, benzodiazepines, antiepileptics, ketamine, corticosteroid injections, or local anaesthetic. If a person is already taking one and it is helping with acceptable harms, it can continue as a shared decision; if it is not, agree a taper. These recommendations apply to chronic <b>primary</b> pain — <b>chronic secondary pain is treated under its own condition guideline</b>."},
    {tone:"amber", h:"The one drug class NICE says consider — and it is not an analgesic", html:"Consider an antidepressant for people aged 18 and over: amitriptyline, citalopram, duloxetine, fluoxetine, paroxetine or sertraline — after a full discussion of benefits and harms, and <b>explicitly even in the absence of a diagnosis of depression</b>. All except duloxetine for some indications are off-label for this purpose, and that must be said and documented. <b>Duloxetine 30 mg OD for 2 weeks then 60 mg OD</b> is the usual choice where depression or a neuropathic component coexists; <b>amitriptyline 10 mg nocte</b> where sleep is the dominant problem."},
    {tone:"blue", h:"Exercise and ACT/CBT are the treatment, not the consolation prize", html:"Offer a supervised group exercise programme — any modality, graded, patient-chosen; and consider ACT or pain-focused CBT. These have a better evidence base in chronic primary pain than any analgesic. Acupuncture or dry needling may also be considered within NG193's resource limits. <b>Do not offer TENS, ultrasound, interferential therapy or biofeedback.</b> The outcome measured is function and quality of life — not the pain score."},
    {tone:"green", h:"OIH is why escalating the opioid fails", html:"Opioid-induced hyperalgesia: long-term opioids down-regulate descending inhibition and up-regulate NMDA excitability, so pain sensitivity rises as the dose rises. This is the honest explanation for “it isn't working like it used to” — and it converts a refusal into a therapeutic insight. Taper by 10% of the current dose every 2–4 weeks, never abruptly, with psychological support alongside, warning that pain typically worsens for the first 2–4 weeks before improving."},
    {tone:"purple", h:"NG12 — the cancers that hide inside chronic back pain", html:"Aged 60 and over with persistent bone pain, particularly back pain, or an unexplained fracture → very urgent FBC, calcium and plasma viscosity or ESR for myeloma; if suggestive, very urgent serum and urine protein electrophoresis with Bence-Jones protein within 48 hours. Aged 60 and over with weight loss plus back pain → urgent direct-access CT within 2 weeks for pancreatic cancer. Unexplained bone swelling or pain → very urgent direct-access X-ray within 48 hours for bone sarcoma. Restated in <a href='#refer'>Refer</a>."}
  ],
  pathwaySub:"The whole consultation in five moves. The first is a safety screen, the second is a classification, and the third is the one most often skipped.",
  pathway:[
    {title:"Re-screen the red flags — every consultation", html:"Cauda equina (saddle anaesthesia, bilateral leg weakness, bladder or bowel dysfunction) · metastatic cord compression · spinal infection · new or changed pain in a known cancer patient · night pain with weight loss over 50 · suicidal ideation. An established chronic pain label does not exclude new pathology — it conceals it.", alert:true},
    {title:"Classify: primary, secondary, or both", html:"Chronic primary pain (nociplastic — fibromyalgia, chronic widespread pain, CRPS, chronic primary headache, chronic primary visceral or musculoskeletal pain) versus chronic secondary pain with an identifiable driver (osteoarthritis, inflammatory arthritis, endometriosis, neuropathic, cancer). They coexist, and the NG193 prohibitions apply only to the primary component."},
    {title:"Assess the person, not only the pain", html:"Function and what has been lost · catastrophising · fear-avoidance · sleep · PHQ-9 and GAD-7 with a direct suicide question · social and occupational context · a full medication and previous-treatment review. <b>No routine imaging and no routine bloods.</b>"},
    {title:"Explain first, then treat", html:"Validate the pain as real, explain the oversensitive-alarm mechanism in plain language, then offer supervised exercise, ACT or pain-focused CBT, sleep work and social prescribing — with an antidepressant considered from the NG193 list."},
    {title:"Deprescribe, then review on function", html:"Taper opioids and gabapentinoids at 10% every 2–4 weeks with support · review at 4 weeks, 12 weeks and 3–6 months · annual review documenting functional benefit for every analgesic still prescribed."}
  ],
  sections:[

    {id:"safety", nav:"Red flags", title:"Red flags — what an established pain label conceals",
     sub:"Chronic pain patients get new diseases. Re-screen at every consultation and document that you did.",
     blocks:[
       {b:"table", head:["Feature","Meaning","Action"], rows:[
         ["Saddle anaesthesia, bilateral leg weakness or numbness, bladder or bowel dysfunction, loss of anal tone","<b>Cauda equina syndrome</b> — can develop insidiously on a background of familiar back pain; saddle anaesthesia is the most specific feature","999 or emergency same-day referral for immediate MRI and neurosurgical assessment. Never a routine scan and never “review next week”"],
         ["New or rapidly progressive neurological deficit, band-like pain, difficulty walking, in a person with known cancer","<b>Metastatic spinal cord compression</b> — an oncological emergency","Same-day discussion with the acute oncology or MSCC coordinator; urgent whole-spine MRI within 24 hours; dexamethasone per local protocol"],
         ["<b>New or changed pain in a patient with known cancer</b>","<b>Bone metastases, cord compression or malignant nerve infiltration</b>","<b>Image before adjusting analgesia — do not simply escalate the opioid</b>"],
         ["Night pain waking from sleep with unexplained weight loss, aged over 50","<b>Vertebral metastases, myeloma or primary bone tumour.</b> Night pain that wakes from sleep is not mechanical","Urgent MRI spine; FBC, calcium, ESR or plasma viscosity, ALP, LDH, protein electrophoresis; NG12 pathway"],
         ["Fever, systemic upset or a focal neurological deficit with back pain; injecting drug use or immunosuppression","<b>Spinal epidural abscess or discitis</b> — mimics a chronic pain flare","Urgent MRI spine, FBC and CRP, blood cultures; emergency admission if septic"],
         ["<b>Suicidal ideation, hopelessness about recovery, or opioid stockpiling</b>","Chronic pain roughly doubles suicide risk; hopelessness plus depression is the highest-risk combination","PHQ-9 including item 9 and a direct question; same-day crisis assessment if there is active ideation with a plan; restrict to monthly or weekly prescription quantities and discuss safe storage"],
         ["Inflammatory pattern — morning stiffness over 45 minutes, night waking in the second half of the night, improvement with exercise, raised CRP or ESR","Axial spondyloarthritis (ankylosing spondylitis), polymyalgia rheumatica or inflammatory arthritis mislabelled as chronic primary pain","Inflammatory markers and rheumatology referral rather than a pain pathway"]
       ]},
       {b:"warn", html:"The failure mode of this consultation is the opposite of over-investigation: everything new gets attributed to the chronic pain. The 58-year-old with 4 years of back pain who now wakes at 3 am and has lost 6 kg is not having a flare. Equally, <b>the patient with a genuinely stable pattern does not need another MRI</b> — incidental disc dehydration and facet arthropathy are near-universal, they reinforce the structural illness belief, and they drive requests for surgery that will not help. <b>Re-screen clinically at every visit; image only for red flags.</b>"},
       {b:"dl", rows:[
         ["<b>NG12 — the criteria that apply here</b>","Myeloma: aged 60 and over with persistent bone pain, particularly back pain, or an unexplained fracture → very urgent FBC, calcium and plasma viscosity or ESR; if the results suggest myeloma, very urgent serum and urine protein electrophoresis with Bence-Jones protein within 48 hours. Pancreatic cancer: aged 60 and over with weight loss and back pain → urgent direct-access CT within 2 weeks (urgent ultrasound if CT is not available). Bone sarcoma: unexplained bone swelling or pain → very urgent direct-access X-ray within 48 hours. Restated in <a href='#refer'>Refer</a>"]
       ]}
     ]},

    {id:"classify", nav:"Classify", title:"Chronic primary pain, chronic secondary pain — and both at once",
     sub:"This classification is what decides whether the NG193 prohibitions apply.",
     blocks:[
       {b:"table", head:["Category","Recognising it","What it means for treatment"], rows:[
         ["<b>Chronic primary pain</b>","Pain for 3 months or more with significant emotional distress or functional disability, not better accounted for by another diagnosis. Includes fibromyalgia, chronic widespread pain, complex regional pain syndrome, chronic primary headache and orofacial pain, chronic primary visceral pain and chronic primary musculoskeletal pain (including much non-specific low back pain)","The NG193 pathway: exercise, ACT or CBT, acupuncture within limits, and the named antidepressants considered. The do-not-start list applies in full"],
         ["<b>Chronic secondary pain</b>","Pain with an identifiable underlying condition — osteoarthritis, rheumatoid or psoriatic arthritis, endometriosis, neuropathic pain (including sciatica and lumbar radiculopathy), spinal stenosis, cancer, post-surgical pain, chronic pain after cancer treatment","<b>Treat the underlying condition under its own guideline</b> — CG173 for neuropathic pain, NG59 for sciatica and low back pain, NG226 for osteoarthritis, CG150 for headache, the WHO ladder and specialist services for cancer pain. <b>The NG193 prohibitions do not transfer</b> — a patient with sciatica is not denied analgesia because chronic primary pain guidance says not to start it"],
         ["<b>Both together — the usual situation</b>","Osteoarthritic knees plus widespread nociplastic amplification; a resolved disc prolapse plus 4 years of central sensitisation","Manage each component on its own terms and say so explicitly — the commonest error is treating the whole picture as either one or the other"],
         ["<b>Nociplastic features (central sensitisation)</b>","Allodynia (pain from light touch or clothing) · hyperalgesia · widespread and unpredictable pain · fatigue · cognitive fog · sleep disturbance · hypersensitivity to sound, light and smells","Allodynia is the most useful single history finding: it says tissue-directed treatment (NSAIDs, injections, surgery, opioids) will fail and the nervous system is the target"],
         ["<b>Neuropathic features</b>","Burning, shooting, electric-shock pain in a neuroanatomical distribution, with numbness or dysaesthesia; DN4 or S-LANSS supportive","CG173 ladder — amitriptyline, duloxetine, gabapentin or pregabalin, switching rather than stacking. See the <a href='neuropathic-pain.html'>neuropathic pain protocol</a>"],
         ["<b>Mimics to exclude before settling on primary pain</b>","<b>Hypothyroidism</b> (widespread pain, fatigue, cognitive slowing) · <b>polymyalgia rheumatica</b> · <b>inflammatory arthritis and axial SpA</b> · <b>myeloma and metastatic disease</b> · <b>vitamin D deficiency</b> · <b>statin myalgia and other drug causes</b> · <b>untreated depression</b> · <b>obstructive sleep apnoea</b>","<b>A short targeted screen, not a broad fishing expedition</b> — see <a href='#assess'>Assess</a>"]
       ]},
       {b:"why", html:"<b>The reason this classification carries so much weight is that NG193's most quoted recommendations — do not start opioids, gabapentinoids, paracetamol or NSAIDs — are recommendations about chronic <b>primary</b> pain, and they are routinely misapplied in both directions.</b> Applied too widely, they strip appropriate analgesia from someone with inflammatory arthritis or cancer pain; applied too narrowly, they leave a patient with fibromyalgia on an escalating opioid that is making the pain worse. Fibromyalgia is the paradigm chronic primary pain condition: widespread pain, fatigue, unrefreshing sleep and cognitive difficulty, diagnosed clinically on the pattern rather than by tender-point counting, with normal inflammatory markers. It does not need a rheumatology referral to be managed — it needs this pathway."}
     ]},

    {id:"assess", nav:"Assess", title:"Assessment — the whole person, and a functional baseline",
     sub:"A history that captures only site and severity has a pharmaceutical frame, not a chronic pain frame.",
     blocks:[
       {b:"table", head:["Element","What to ask or do","Why it changes management"], rows:[
         ["<b>Open question about life, not pain</b>","“Tell me what the pain has done to your life — what can you no longer do, and what does a typical day look like now compared with before?”","Reveals deconditioning, withdrawal, isolation and identity loss simultaneously — all treatment targets, none of which emerge from “where does it hurt and how bad is it?”"],
         ["<b>Function — the primary outcome</b>","What activities have been given up? Walking distance, stairs, driving, cooking, work, social contact. Record something countable so the next review has a comparator","NG193 measures success by function and quality of life, not pain intensity. A patient who goes from 50 m to 2 km while the score stays at 6/10 has improved meaningfully"],
         ["<b>Catastrophising and fear-avoidance</b>","<b>“When the pain is at its worst, what goes through your mind?”</b> Listen for rumination, magnification and helplessness — the Pain Catastrophising Scale formalises it","Catastrophising predicts disability more strongly than pain intensity does, and it is the specific target of ACT and pain-focused CBT. <b>Fear-avoidance → deconditioning → lower pain threshold → more pain</b>"],
         ["<b>Mood, sleep and suicide risk</b>","PHQ-9 and GAD-7, with a direct question about self-harm — not left to item 9 alone. Sleep pattern and what is disturbing it","Depression or anxiety in roughly half of chronic pain patients, bidirectionally linked. PHQ-9 ≥10 supports starting an antidepressant; ≥15 with suicidal ideation means same-day crisis assessment and shorter prescription quantities; GAD-7 ≥10 means the anxiety needs treating alongside the pain. Poor sleep reduces descending inhibition, which amplifies pain. <b>Chronic pain roughly doubles suicide risk</b>"],
         ["<b>Medication and treatment history</b>","Every analgesic, its dose, duration and what function it actually buys. Opioid dose in oral morphine equivalent. Gabapentinoid dose. OTC and codeine-containing purchases. Alcohol (AUDIT-C) and other substances","Long duration with escalating dose and no functional gain is the signature of opioid-induced hyperalgesia — a deprescribing indication, not an escalation one. <b>Analgesic overuse also drives medication-overuse headache</b>"],
         ["<b>Social, occupational and financial context</b>","Work, sick notes, benefits, ongoing litigation, caring roles, relationships, isolation","Work absence worsens prognosis and return to modified duties is a treatment goal. The Equality Act 2010 makes workplace adjustment a legal entitlement where pain substantially limits daily activities; PIP, ESA and Access to Work are practical levers, and social prescribing addresses isolation"],
         ["<b>Examination</b>","Focused neurological examination of the limbs (power, reflexes, dermatomal sensation, plantars, straight-leg raise — positive below 45 degrees with radiation below the knee suggests radiculopathy), range of movement, gait, and observed function from waiting room to chair. Note pain behaviour — grimacing, guarding, disproportionate movement limitation. Widespread tenderness supports a nociplastic picture","Excludes myelopathy and progressive deficit and gives a rehabilitation baseline. Waddell signs (the non-organic signs) and functional inconsistency indicate psychosocial overlay, not malingering — they change the pathway towards psychologically informed rehabilitation, and should never be recorded as evidence of feigning"],
         ["<b>Investigations — targeted, never routine</b>","<b>PHQ-9 and GAD-7 at every review.</b> FBC, CRP or ESR only if an inflammatory, infective or malignant cause is suspected; TFTs where there is widespread pain with fatigue — treat hypothyroidism with levothyroxine and reassess the pain once it is normalised; rheumatoid factor, anti-CCP, ANA or HLA-B27 only where an inflammatory cause is genuinely suspected; vitamin D, calcium and bone profile where indicated; HbA1c and B12 if neuropathic features; eGFR and LFTs for analgesic safety; creatine kinase if statin myalgia is possible. <b>No routine imaging in chronic primary pain</b>","Normal inflammatory markers with widespread pain support chronic primary pain. Repeat imaging without red flags reinforces the structural illness model, generates incidental findings and increases anxiety without changing management — a scan ordered for reassurance does not reassure"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"🛡️ Domestic abuse and adverse childhood experiences", html:"Chronic widespread and chronic pelvic pain are strongly associated with domestic abuse and with adverse childhood experiences. Ask — HARK (Humiliation, Afraid, Rape, Kick) is a usable primary-care screen — and act on the answer: IDVA referral, MARAC if high-risk, children's social care if there are children in the household; consider parenting capacity where a parent is severely functionally impaired. <b>A trauma-informed approach changes how the whole plan is delivered.</b>"},
         {tone:"amber", h:"💊 Opioid safety in the household", html:"Review safe storage and the risk of diversion or accidental ingestion where there are children or other vulnerable people at home. Shorter prescription intervals where there is any mood instability, previous overdose or stockpiling. Document the indication and functional benefit at every prescription."},
         {tone:"blue", h:"🧒 Children and carers", html:"Parental chronic pain affects children — reduced engagement, financial hardship, and modelling of pain behaviour. Consider a young carer's assessment where a child is providing care, and a carer's assessment for the partner. Family education about chronic pain is underused and effective."},
         {tone:"amber", h:"🚗 Driving", html:"Opioids, gabapentinoids, benzodiazepines and sedating antidepressants impair driving, particularly when started or changed. Advise not to drive if impaired; there is a statutory medical defence where the drug is taken as prescribed and driving is not impaired. Record the advice."}
       ]}
     ]},

    {id:"explain", nav:"Explain", title:"The explanation is the intervention",
     sub:"A patient who understands why the pain persists despite a normal scan is a patient who can accept that exercise outperforms morphine.",
     blocks:[
       {b:"dl", rows:[
         ["<b>1 · Validate, before anything else</b>","Say that the pain is real, and separate “not visible on a scan” from “not real”. Being told a scan is normal and one should be fine is the most invalidating experience in chronic pain medicine, and it is why patients arrive defensive. Acknowledge the years without effective treatment without defending or criticising previous clinicians"],
         ["<b>2 · Explain the mechanism in plain language</b>","Pain neurophysiology education (PNE) — a structured explanation of central sensitisation — changes the structural illness model and reduces catastrophising, and combined with exercise it outperforms exercise alone. The smoke-alarm metaphor is the standard one and is worth delivering properly rather than in passing"],
         ["<b>3 · Offer something specific and achievable today</b>","Not “try to keep active” but one named activity, at a stated frequency, small enough to succeed — a 10-minute walk three times a day, a hydrotherapy or aquatic class, tai chi, yoga, a stationary bike. Success rebuilds self-efficacy, and self-efficacy is what reduces catastrophising"],
         ["<b>4 · Be accurate about prognosis</b>","<b>Chronic primary pain is rarely eliminated but is very manageable.</b> The goal is a full and meaningful life with pain present but not defining it — stated as a realistic aim rather than false optimism or a counsel of despair"]
       ]},
       {b:"say", html:"Think of your pain system like a smoke alarm. After your disc problem the alarm had a real fire to respond to — that was useful, it protected you. But when pain goes on for a long time the alarm can become oversensitive, and it starts going off when there is nothing dangerous happening — it reacts to ordinary signals as though they were threats. So a normal MRI does not mean nothing is wrong; it means the problem is in the alarm system's sensitivity rather than in the structure it is protecting. Your pain is completely real. The important part is that an oversensitive alarm can be turned back down — but the things that turn it down are not the same as the things that fix a torn tissue, and stronger painkillers are not one of them."},
       {b:"say", html:"I want to be honest about the tramadol rather than just say no. You have been on it two years and it is not giving you good relief — and there is a specific reason for that. Long-term opioids can make the nervous system more sensitive to pain over time rather than less; it is called opioid-induced hyperalgesia. So the tramadol has quietly become part of what is keeping the pain going, and morphine would do the same thing: some help for a few weeks, then tolerance, then more pain. What I would like to do instead is reduce it very slowly — about a tenth at a time, every two to four weeks — alongside the exercise and the psychological therapy. Most people who get through that end up with the same pain or less, and considerably more life."},
       {b:"warn", html:"<b>Two errors bracket this consultation and both lose the patient.</b> Colluding — escalating the opioid because the distress is real and the appointment is nearly over — buys ten minutes and costs years. Refusing flatly, or implying the pain is psychological, ruptures the relationship and sends the patient elsewhere to start again. The only route through is a genuine alternative offered with conviction: the evidence, the mechanism, a named referral and a specific first step."}
     ]},

    {id:"first-line", nav:"First-line", title:"What NICE actually recommends — the non-drug treatments",
     sub:"These are not what you offer when you have refused the medication. They are the treatment.",
     blocks:[
       {b:"table", head:["Intervention","What to offer","Detail that matters"], rows:[
         ["<b>Supervised exercise — the single strongest intervention</b>","Offer a supervised group exercise programme, taking the person's preferences, ability and comorbidities into account","Any modality works — walking, aquatic, cycling, yoga, tai chi, strength work. Graded progression and consistency are what matter, and supervision beats self-directed exercise at the start. Mechanism worth naming to the patient: endogenous opioid release, restored descending inhibition, reduced neuroinflammation, better sleep and mood"],
         ["<b>Psychological therapy — ACT or CBT</b>","Consider acceptance and commitment therapy or CBT specifically for pain, delivered by a healthcare professional with appropriate training","Refer to the NHS Talking Therapies long-term-conditions or pain pathway and specify pain-focused ACT or CBT — not generic counselling, and not framed as a referral for depression when the problem is pain. ACT targets the relationship with the thought (“I notice the thought that I will never get better”) rather than its content, and is the better fit for patients who have already tried standard CBT"],
         ["<b>Pain neurophysiology education</b>","Deliver it yourself in the consultation, and ask physiotherapy to continue it alongside exercise","<b>PNE plus exercise outperforms exercise alone.</b> Patient resources: <a href='https://livewellwithpain.co.uk' rel='noopener'>livewellwithpain.co.uk</a>, the Pain Toolkit, and <i>Explain Pain</i> (Butler and Moseley)"],
         ["<b>Acupuncture</b>","Consider a course of acupuncture or dry needling for chronic primary pain, within NG193's resource conditions","NICE's condition is that it is delivered in a community setting and by a band 7 or equivalent or lower healthcare professional, with a maximum of 5 hours of their time, or by another practitioner at similar cost. Availability varies widely by area — check what is commissioned locally before offering it"],
         ["<b>Sleep</b>","<b>Treat the sleep disorder as a pain intervention, not a comfort measure</b>","CBT-I first (Sleepio and equivalents where commissioned), then the sleep hygiene basics — consistent wake time, stimulus control, screens out of the bedroom. Low-dose amitriptyline 10 mg nocte is a reasonable short-term bridge where sleep is the dominant problem — review it rather than letting it run indefinitely"],
         ["<b>Social prescribing and peer support</b>","Referral to a social prescribing link worker for community activity chosen around the person's values; pain support groups","<b>Isolation amplifies pain</b> — social exclusion and physical pain share neural pathways. Activities chosen around what the person cares about, not generic advice to get out of the house"],
         ["<b>Work and self-management</b>","Support a graded return to work or modified duties; discuss Equality Act adjustments; fit note used to enable work, not only to withdraw from it","<b>Self-management plans should include a flare plan agreed in advance</b> — what to do for 3–5 bad days that does not involve a dose increase or an emergency appointment"],
         ["<b>What NICE says not to offer</b>","Do not offer TENS, ultrasound or interferential therapy for chronic primary pain; do not offer biofeedback. <b>Manual therapy alone is not the referral to make</b>","Passive physiotherapy — massage and manipulation on their own — does not address central sensitisation and reinforces the structural model. If the patient says physiotherapy made things worse before, this is usually why, and saying so restores their confidence in trying again"]
       ]},
       {b:"why", html:"Exercise and psychological therapy are recommended first not because the medication was refused but because they have the better evidence base in this condition — and the patient can be told exactly that. The mechanism matters to the explanation: exercise acts directly on the sensitised system through several pathways at once, which no tablet does, and ACT works on the disability and distress that pain intensity alone does not explain. Presented as an afterthought at the end of a consultation about tablets, both fail. Presented as the treatment, with a named referral and a specific first step, both work."}
     ]},

    {id:"drugs", nav:"Prescribe", title:"Prescribing — a short list of what to consider, and a longer list of what not to start",
     blocks:[
       {b:"table", head:["Situation","What to use","Notes"], rows:[
         ["<b>Chronic primary pain, any adult 18+</b>","Consider an antidepressant: amitriptyline, citalopram, duloxetine, fluoxetine, paroxetine or sertraline","<b>NG193 supports this even where there is no depression</b>, after discussing benefits and harms and the <b>off-label status</b> of most of these for pain. Review benefit at 4–8 weeks and stop if there is none"],
         ["<b>Depression or anxiety coexisting, or a neuropathic component</b>","<b>Duloxetine 30 mg OD with food for 2 weeks, then 60 mg OD</b>","SNRI; licensed for diabetic neuropathic pain, and the usual first choice where both problems are present. Nausea early (start at 30 mg), insomnia, sweating, dry mouth, modest BP rise; avoid if eGFR &lt;30; discontinuation syndrome — taper over at least 4 weeks. PHQ-9 at 4 and 12 weeks"],
         ["<b>Sleep is the dominant problem, or fibromyalgia</b>","<b>Amitriptyline 10 mg nocte</b>, titrated cautiously — 10–25 mg carries the fibromyalgia evidence, and 75 mg is the practical ceiling for pain","Analgesic and sedative at doses far below antidepressant doses. Anticholinergic burden, morning grogginess, weight gain, QTc prolongation — ECG before doses above 75 mg or where there is cardiac risk; avoid with an MAOI taken within 14 days, in urinary retention, and in acute angle-closure glaucoma; use with great caution or avoid in the frail elderly because of falls and confusion. Review annually and try withdrawal"],
         ["<b>Confirmed neuropathic pain</b>","CG173 ladder: amitriptyline, duloxetine, gabapentin or pregabalin — switch rather than stack","<b>Gabapentinoids are appropriate here and only here</b> — diabetic neuropathy, post-herpetic neuralgia, chemotherapy-induced neuropathy, central neuropathic pain. See the <a href='neuropathic-pain.html'>neuropathic pain protocol</a>"],
         ["<b>Localised pain</b>","Topical NSAID — diclofenac gel, 2–4 g rubbed into the affected area three to four times daily; low-strength capsaicin 0.025–0.075% cream as an alternative","Negligible systemic absorption compared with oral NSAIDs — usable where systemic NSAIDs are avoided. Capsaicin burns on first application; warn the patient or they will stop. High-strength capsaicin 8% patch is specialist-initiated for peripheral neuropathic pain"],
         ["<b>Chronic secondary pain</b>","<b>Treat under the relevant condition guideline</b>","Osteoarthritis, inflammatory arthritis, endometriosis, cancer pain and neuropathic pain each have their own analgesic logic. Where an NSAID is used long-term: lowest effective dose, PPI cover, and review of cardiovascular and renal risk. Reduce paracetamol to a maximum of 3 g daily in significant renal or hepatic impairment, and avoid NSAIDs altogether below eGFR 30"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"⛔ Do not start — opioids", html:"Codeine, tramadol, morphine, oxycodone and the rest have no evidence of long-term benefit in chronic primary pain and cause harm: hyperalgesia, tolerance, dependence, constipation, falls, cognitive impairment, hypogonadism and overdose. <b>If already prescribed, the conversation is about tapering.</b>"},
         {tone:"red", h:"⛔ Do not start — gabapentinoids", html:"Pregabalin and gabapentin have no evidence in chronic primary pain and carry real harms — sedation, falls, cognitive impairment, dependence and misuse. <b>Class C controlled drugs since April 2019.</b> Combined with opioids they cause additive respiratory depression (MHRA) — a combination to unpick, not to build on."},
         {tone:"amber", h:"⛔ Do not start — paracetamol and NSAIDs", html:"NG193 found insufficient evidence of benefit for either in chronic primary pain, and long-term NSAIDs carry GI, cardiovascular and renal risk. This surprises people: paracetamol is not dangerous, it simply does not work for this — so it should not be a standing repeat prescription that nobody reviews."},
         {tone:"amber", h:"⛔ Do not start — benzodiazepines, antiepileptics, ketamine, injections", html:"Also on the NG193 list: benzodiazepines, antiepileptic drugs (other than gabapentinoids for neuropathic pain), ketamine, corticosteroid injections and local anaesthetic — intravenous or topical — for chronic primary pain."},
         {tone:"green", h:"✓ Already taking one and it helps", html:"If a drug on the list is providing genuine benefit with acceptable harms, it can be continued as a shared decision — documented, dose-stable, and reviewed at least annually. The recommendations are about starting, not about a blanket withdrawal of everything already prescribed."},
         {tone:"blue", h:"📋 Document the reasoning", html:"Record: NG193 framework applied; exercise and psychological therapy offered; off-label status discussed for an antidepressant; functional benefit assessment for any analgesic continued; taper plan where one is agreed; and that red flags were re-screened."}
       ]}
     ]},

    {id:"taper", nav:"Deprescribe", title:"Deprescribing — the most impactful thing you will do",
     sub:"Slow, supported, negotiated, and never a punishment.",
     blocks:[
       {b:"table", head:["Step","Detail"], rows:[
         ["<b>Set it up properly</b>","Explain opioid-induced hyperalgesia first — the taper is unsellable without it. Frame it as a treatment with an expected benefit, not the withdrawal of something the patient has earned. Get explicit agreement and document the shared decision; a taper the patient has not agreed to fails"],
         ["<b>Rate</b>","<b>Reduce by about 10% of the current dose every 2–4 weeks.</b> Slower — down to 5%, or monthly — where the dose is high, the duration long, or there is significant anxiety or dependence. <b>Never stop abruptly</b> (withdrawal: anxiety, sweating, agitation, diarrhoea, muscle aches, insomnia)"],
         ["<b>Support alongside</b>","Psychological support during the taper is not optional — a taper without it has a high failure rate. Book the reviews in advance rather than waiting for the patient to request them"],
         ["<b>Warn about the dip</b>","Pain usually worsens for the first 2–4 weeks of each significant reduction and then settles — it is the sensitised system readjusting, not a relapse. Saying this in advance is the single most effective way to prevent the taper being abandoned — unwarned, the patient reasonably concludes the decision was wrong"],
         ["<b>If the taper stalls</b>","Hold at the current dose rather than reversing; a pause is not a failure. Buprenorphine patch can be used as a transitional agent where there is significant dependence — more stable levels, partial agonist. Involve the pain clinic or specialist drug service — under a shared care arrangement — where there is dependence, complex polypharmacy or high-dose opioid"],
         ["<b>Gabapentinoids</b>","Taper rather than stop — withdrawal is real (anxiety, insomnia, sweating, tachycardia, seizures at high dose). Similar pace; slower where the dose is high or there is a history of misuse"],
         ["<b>Benzodiazepines and z-drugs</b>","Follow NG215 — gradual, negotiated withdrawal; abrupt cessation risks seizures. See the <a href='benzodiazepines-z-drugs.html'>benzodiazepine and z-drug protocol</a>"],
         ["<b>Watch for the substitutions</b>","<b>Alcohol, OTC codeine and pregabalin bought online.</b> AUDIT-C during the taper, and ask directly rather than assuming"]
       ]},
       {b:"why", html:"Deprescribing looks like the part of the plan that takes something away, and it is in fact the part with the largest effect. Tapering allows the descending inhibitory pathways to recover, and most patients who complete a taper report the same or better pain control at a lower dose or none at all — with less constipation, less sedation, fewer falls and a returned sense of clarity. The evidence for that has to be offered to the patient explicitly, because on the face of it the proposal sounds absurd: less painkiller, less pain. The corollary is that a taper imposed without explanation, agreement and support is not good medicine — it is the same error as escalation, from the other direction."}
     ]},

    {id:"monitor", nav:"Follow up", title:"Review, monitoring and safety-netting",
     blocks:[
       {b:"table", head:["When","What to check"], rows:[
         ["<b>4 weeks</b>","Has the exercise actually started — which activity, how often, what got in the way? First taper step tolerated? Antidepressant started and tolerated? Psychological therapy referral confirmed? PHQ-9 repeated. Any new red flag"],
         ["<b>8–12 weeks</b>","Function against the baseline you recorded — distance, activities resumed — before any discussion of the pain score. Therapy engagement and whether catastrophising is shifting. Next taper step. Antidepressant at target dose and benefit assessed. Sleep"],
         ["<b>3–6 months</b>","Major review: function, return to valued activities, opioid substantially reduced or stopped, mood in remission, exercise established as a habit. If the response is inadequate: revisit the diagnosis, then consider pain clinic or a pain management programme"],
         ["<b>Annually, and at every medication review</b>","<b>Function compared with 3, 6 and 12 months ago · PHQ-9 and suicide risk · documented functional benefit for every analgesic still prescribed · eGFR and LFTs where relevant · falls risk on opioids, gabapentinoids or amitriptyline · weight and blood pressure · pain NRS against the earlier score, read after the functional review rather than before it · <b>consider opioid-induced pituitary suppression where there is fatigue, low mood or sexual dysfunction on long-term opioids — check testosterone or oestradiol</b> · exercise engagement · red flags re-screened</b>"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 999 — same day", html:"Saddle numbness, bilateral leg weakness, or new bladder or bowel dysfunction — call 999, do not wait for an appointment. Give this verbally to every patient with chronic back pain, every time."},
         {tone:"amber", h:"🟠 Contact us the same day", html:"New or rapidly progressive weakness · fever with back pain · new night pain with weight loss · a pain that has genuinely changed in character or site."},
         {tone:"blue", h:"💊 The taper dip", html:"“Pain will probably feel worse for two to four weeks after each reduction, then settle. That is expected and it is not a sign we chose wrongly — but tell me if it is severe and we will slow down.”"},
         {tone:"red", h:"🔴 Crisis", html:"“If the pain and the hopelessness ever reach the point where you feel you cannot go on, contact us the same day, call Samaritans on 116 123, or go to A&amp;E. There is always a next step — we are not out of options.”"}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Emergency — same day", html:"Suspected cauda equina syndrome or metastatic spinal cord compression; spinal infection with sepsis; active suicidal ideation with a plan."},
         {tone:"purple", h:"2WW · NICE NG12", html:"Myeloma: aged 60 and over with persistent bone pain, particularly back pain, or an unexplained fracture → very urgent FBC, calcium and plasma viscosity or ESR; if suggestive, very urgent serum and urine protein electrophoresis with Bence-Jones protein within 48 hours. Pancreatic cancer: aged 60 and over with weight loss and back pain → urgent direct-access CT within 2 weeks. Bone sarcoma: unexplained bone swelling or pain → very urgent direct-access X-ray within 48 hours."},
         {tone:"blue", h:"Physiotherapy", html:"For a supervised graded exercise programme with pain neurophysiology education — state this explicitly. <b>Not passive treatment alone.</b>"},
         {tone:"blue", h:"NHS Talking Therapies — pain pathway", html:"<b>Pain-focused ACT or CBT, self-referral possible.</b> Include the diagnosis, duration, PHQ-9 and GAD-7 scores and previous treatments. <b>Do not label it as a depression referral if the problem is the pain.</b>"},
         {tone:"amber", h:"Pain clinic", html:"Refractory pain after exercise, psychological therapy and medication optimisation; complex or high-dose opioid tapering; consideration of specialist interventions. <b>Do not refer expecting medication escalation</b> — pain services offer MDT assessment and follow NG193 too."},
         {tone:"amber", h:"Pain management programme", html:"Severe refractory chronic primary pain with high disability and high catastrophising. Multidisciplinary group programme — the strongest evidence in severe chronic primary pain, and not a first-line referral."},
         {tone:"green", h:"Rheumatology / specialty", html:"Raised inflammatory markers, synovitis or an inflammatory pattern; diagnostic uncertainty. <b>Fibromyalgia itself does not require rheumatology to be managed.</b>"},
         {tone:"cream", h:"GP management", html:"Most chronic primary pain is managed here: explanation, supervised exercise, psychological therapy, sleep, social prescribing, an antidepressant considered, deprescribing, and review on function. Regional and site-specific pain is covered by its own pathway, not here — those presentations need a diagnosis before a pain framework applies. Related pages: <a href='neuropathic-pain.html'>neuropathic pain</a> · <a href='opioid-prescribing.html'>opioids in non-cancer pain</a> · <a href='osteoarthritis.html'>osteoarthritis</a> · <a href='me-cfs.html'>ME/CFS</a> · <a href='sciatica.html'>sciatica pathway</a> · <a href='../algorithms/chronic-back-pain.html'>chronic back pain</a> · <a href='../algorithms/shoulder-pain.html'>shoulder pain</a> · <a href='../../cases/chronic-pain.html'>the casebook chapter</a>."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 58-year-old retired teacher asks for “something stronger — maybe morphine” for 4 years of low back pain. A disc prolapse resolved radiologically; a recent MRI showed disc dehydration only. She rates the pain 7–8/10, has been on <b>tramadol 100 mg BD and duloxetine 60 mg OD for 2 years</b> with incomplete relief, has stopped walking, gardening and her book club, sleeps poorly, and has a <b>PHQ-9 of 12</b> with a passive death wish. She says previous doctors told her the scan was normal and she should be fine, and she opens with “I don't want to be told it's all in my head.”"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"<b>Validates the pain as real BEFORE explaining anything</b>, and separates “not on the scan” from “not real”; <b>re-screens cauda equina and the malignancy red flags</b>; <b>completes PHQ-9 and asks directly about suicidal thoughts</b>; identifies <b>catastrophising and fear-avoidance</b>; <b>explains opioid-induced hyperalgesia as the reason escalation fails</b> rather than refusing flatly; offers supervised exercise and pain-focused ACT as the treatment, with a named first step, and explains why the previous passive physiotherapy is not what is being proposed; agrees a tramadol taper at 10% every 2–4 weeks with the 2–4 week dip warned about; addresses the duloxetine already in place rather than adding a drug; <b>does not order another MRI and says why</b>; gives the <b>cauda equina safety-net verbally</b>; and frames the goal as a meaningful life alongside pain rather than a pain-free one."}
     ]}]},

         '<li><b>NICE CG173 — Neuropathic pain in adults: pharmacological management</b><br><a href="https://www.nice.org.uk/guidance/cg173" rel="noopener">nice.org.uk/guidance/cg173</a><span class="rd"> — the four first-line agents for confirmed neuropathic pain, and switching rather than stacking</span></li>'+
         '<li>NICE NG215 — Medicines associated with dependence or withdrawal symptoms (2022)<br><a href="https://www.nice.org.uk/guidance/ng215" rel="noopener">nice.org.uk/guidance/ng215</a><span class="rd"> — the taper principles, shared decision-making and withdrawal management for opioids, gabapentinoids and benzodiazepines</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (May 2025)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — myeloma bloods at 60 and over with persistent bone or back pain, pancreatic CT at 60 and over with weight loss and back pain, and the 48-hour X-ray for suspected bone sarcoma</span></li>'+

         '<li><b>Equality Act 2010</b><span class="rd"> — workplace adjustment entitlement where chronic pain substantially limits day-to-day activities</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Chronic primary pain — NICE NG193 (2021), NICE NG193, CG173, NG215 and NG12. Chronic primary pain is a diagnosis, not a diagnostic failure: name it, explain it, and treat it with supervised exercise and pain-focused psychological therapy. Do not start opioids, gabapentinoids, paracetamol, NSAIDs, benzodiazepines, antiepileptics, ketamine, corticosteroid injections or local anaesthetic for it — and taper what is already there at 10% every 2–4 weeks, with support. Chronic secondary pain is managed under its own condition guideline. Verify all doses against the BNF before prescribing."
