<script>
MG.render({
  icon:"🪱",
  title:"Threadworm — the complete guide",
  eyebrow:"Protocol · children and adults · enterobiasis",
  stemTitle:"Threadworm is a clinical diagnosis — treat the affected person and eligible household members together, repeat at 2 weeks, and pair every dose with practical hygiene",
  stemSub:"Nocturnal perianal itch is typical and the diagnosis is usually clinical. <b>Mebendazole 100 mg as a single dose</b> for affected people and eligible household members (those sharing living or sleeping accommodation) aged 6 months and over, <b>repeated once after 2 weeks</b> in line with the Greater Manchester pathway. Under 2 years it is off-label and needs an individual risk–benefit decision. Infants under 6 months: hygiene alone for 6 weeks. In pregnancy start with hygiene and seek individual medicines advice if symptoms are severe or persistent; in breastfeeding, treatment is generally compatible when clinically appropriate. <b>Mebendazole is usually purchased over the counter.</b> In Greater Manchester, NHS prescribing is generally not supported for uncomplicated threadworm because it is considered suitable for self-care; follow the current local commissioning policy and document any exception.",
  guideline:"Greater Manchester antimicrobial guidelines (v16, 2024) · GMMMG formulary · NHS mebendazole medicines advice · BNF and mebendazole product information · UK eosinophilia guideline (BIA, 2024) for broader parasitic assessment",
  reviewed:"25 September 2026",
  nextReview:"25 September 2027",
  meta:[
    {t:"Treat eligible household members together", tone:"ok"},
{t:"Usually self-care / OTC", tone:"ok"},
    {t:"Repeat dose at 2 weeks", tone:"ok"},
    {t:"v2.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#diagnose"><b>Diagnose</b><small>Clinical</small></a><a href="#treat"><b>Treat</b><small>Who · dose</small></a><a href="#hygiene"><b>Hygiene</b><small>2 or 6 weeks</small></a><a href="#recur"><b>Recurring?</b><small>Re-check</small></a><a href="#refer"><b>Refer</b><small>Rarely</small></a></div>',
  quickSub:"The five that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"blue", h:"A clinical diagnosis", html:"Perianal (and in girls vulval) itch, worse at night, sometimes with small, white, thread-like worms around the anus, perineum or in stool (eggs are not usually visible to the naked eye). Only if the diagnosis is uncertain, an <b>early-morning adhesive-tape test</b> before washing or opening the bowels can help; stool microscopy is generally not useful for uncomplicated threadworm. Look for excoriation, dermatitis or secondary infection."},
    {tone:"green", h:"Mebendazole 100 mg, then repeat at 2 weeks", html:"A single <span class='rx'>mebendazole 100 mg</span> dose for affected people and eligible household members aged 6 months and over, <b>repeated once after 2 weeks</b> for each person who took the first dose and remains eligible for treatment — mebendazole does not reliably kill eggs. Usually purchased over the counter; NHS prescribing only according to local exceptions."},
    {tone:"amber", h:"Age and pregnancy: check before every dose", html:"<b>Under 2 years:</b> off-label — individual risk–benefit decision; not automatic, as hygiene and treating eligible household contacts may be sufficient in mild cases. <b>Under 6 months:</b> avoid mebendazole; hygiene alone for 6 weeks, including frequent perianal washing or wet wiping during the day. <b>Pregnancy:</b> hygiene first for 6 weeks; treatment is usually unnecessary unless symptoms are severe, persistent or significantly affecting sleep — then seek individual advice from the GP, pharmacist, midwife or medicines-in-pregnancy service. <b>Breastfeeding:</b> mebendazole can generally be used when clinically appropriate — only very small amounts enter breast milk; breastfeeding does not usually need to be interrupted."},
    {tone:"blue", h:"Household treatment reduces reinfection", html:"Treating only one person increases the risk of ongoing transmission. Treat all household members who share living or sleeping accommodation and who can safely take treatment at the same time, including those without symptoms — assessing age, pregnancy, breastfeeding, comorbidity and contraindications for each. Do not routinely treat school, nursery or workplace contacts, or visitors who do not share accommodation."},
    {tone:"green", h:"No school or nursery exclusion", html:"No routine exclusion from school, nursery or childcare is required once treatment and hygiene measures have started. Routine treatment of school or nursery contacts is not recommended — treatment is household-based, not community-wide. Threadworm is common and does not indicate neglect or poor hygiene."}
  ],
  pathwaySub:"Five steps. The tablet only works alongside the hygiene.",
  pathway:[
    {title:"Recognise it", html:"Nocturnal perianal or vulval itch ± visible worms: clinical diagnosis. Tape test only if uncertain. Examine persistent, atypical, painful or vulval symptoms. Do not routinely request stool testing."},
    {title:"Decide who to treat", html:"The affected person and eligible household members (sharing living or sleeping accommodation) at the same time, checking age, pregnancy, breastfeeding and comorbidity for each. Not school or nursery contacts."},
    {title:"Mebendazole 100 mg, repeated at 2 weeks", html:"Aged 6 months and over; repeat once after 2 weeks. Under 2 years: off-label, individual risk–benefit decision. Under 6 months: hygiene alone for 6 weeks. Pregnancy: hygiene first; seek individual advice if symptoms are severe or persistent."},
    {title:"Practical hygiene", html:"At least 2 weeks alongside treatment; 6 weeks where medication is not used."},
    {title:"Recurring or not settling? Reconsider", html:"Reinfection is common, but persistent itch may be something else — re-examine rather than repeatedly supplying mebendazole.", alert:true}
  ],
  sections:[

    {id:"diagnose", nav:"Diagnose", title:"Step 1 — recognise it",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>Typical</b>","Perianal itch, worse at night; vulval itch in girls; sometimes small, white, thread-like worms around the anus, perineum or in stool; eggs are not usually visible to the naked eye"],
         ["<b>Who</b>","Very common in children; spreads easily within households through hand-to-mouth transfer of eggs"],
         ["<b>Diagnosis</b>","Clinical. Only if uncertain: early-morning perianal adhesive-tape test before washing or defaecation. If the first test is negative but suspicion remains high, testing on several consecutive mornings may improve yield (an option for diagnostic uncertainty, not routine). Stool microscopy is generally not useful for uncomplicated threadworm"],
         ["<b>Examine</b>","The perianal area if symptoms are persistent or atypical — excoriation, fissuring, dermatitis, secondary infection"],
         ["<b>Persistent vulval symptoms</b>","In girls with persistent vulval symptoms, assess for threadworm but also consider irritant dermatitis, eczema, candidiasis, lichen sclerosus, foreign body, urinary infection and other causes. Follow safeguarding procedures only where the history or examination raises a specific concern"]
       ]},
       {b:"why", html:"Eggs survive on hands, under nails and on bedding and surfaces, so reinfection is common. That is why treatment is paired with hygiene and offered to the household at once — but a diagnosis of threadworm should not delay examining for another cause when symptoms do not fit."}
     ]},

    {id:"treat", nav:"Treat", title:"Step 2 — who to treat, and with what",
     blocks:[
       {b:"table", head:["Group","Treatment","Notes"], rows:[
         ["<b>Adults and children aged 2 years and over</b>","<span class='rx'>Mebendazole 100 mg</span> single dose (one chewable tablet or 5 mL suspension); repeat once after 2 weeks for each person who took the first dose and remains eligible","Treat eligible household members (sharing living or sleeping accommodation) at the same time, including those without symptoms"],
         ["<b>Children aged 6 months to 2 years</b>","<span class='rx'>Mebendazole 100 mg</span> single dose; repeat after 2 weeks","<b>Off-label</b> — individual risk–benefit assessment; give advice to the parent/carer and document where prescribed. Not automatic: hygiene and treatment of eligible household contacts may be sufficient in mild cases"],
         ["<b>Infants under 6 months</b>","Avoid mebendazole; hygiene measures alone for 6 weeks according to the local pathway, including frequent perianal washing or wet wiping during the day","Threadworm is uncommon at this age — confirm that the symptoms are genuinely consistent with threadworm; seek paediatric or medicines advice if symptoms are significant, persistent or atypical"],
         ["<b>Pregnancy</b>","Rigorous hygiene measures for 6 weeks first, particularly in the first 12 weeks","Threadworm is not dangerous to the pregnancy, and treatment is usually unnecessary unless symptoms are severe, persistent or significantly affecting sleep. If treatment is being considered, obtain individual advice from the GP, pharmacist, midwife or medicines-in-pregnancy service — not an absolute contraindication. Treat eligible household contacts at the same time to reduce reinfection"],
         ["<b>Breastfeeding</b>","<span class='rx'>Mebendazole 100 mg</span> can generally be used when clinically appropriate","Only very small amounts enter breast milk and oral absorption by the infant is expected to be minimal. Check the current product information if there are additional concerns; breastfeeding does not usually need to be interrupted"],
         ["<b>Contacts for whom treatment is unsuitable</b>","Hygiene measures","E.g. significant comorbidity. Visitors and people not sharing living or sleeping accommodation do not need treatment. Do not automatically re-dose someone not treated initially because of pregnancy, age or a contraindication without reassessing suitability"]
       ]},
       {b:"warn", html:"<b>Clinical treatment recommendation:</b> mebendazole 100 mg, repeat after 2 weeks. <b>Prescribing recommendation:</b> usually OTC/self-care. Mebendazole is usually purchased over the counter. In Greater Manchester, NHS prescribing is generally not supported for uncomplicated threadworm because it is considered suitable for self-care (formulary: threadworm — do not routinely prescribe; mebendazole 100 mg chewable tablets are a formulary item where prescribing is appropriate). Follow the current local commissioning policy and document any exception."}
     ]},

    {id:"hygiene", nav:"Hygiene", title:"Step 3 — practical hygiene",
     sub:"At least 2 weeks alongside treatment; 6 weeks where medication is not used.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"🧼 Hands and nails", html:"Wash hands and scrub under the nails after the toilet or nappy changes and before eating. Keep nails short."},
         {tone:"green", h:"🚿 Morning wash", html:"Shower or wash around the anus each morning to remove eggs laid overnight."},
         {tone:"green", h:"🚫 Hand to mouth", html:"Discourage nail-biting, thumb-sucking and scratching. Close-fitting underwear or nightwear at night can help children."},
         {tone:"green", h:"🛏️ Laundry and surfaces", html:"Wash nightwear, underwear, towels and bed linen on the day treatment starts and regularly during the hygiene period. Avoid shaking bedding; damp-dust and vacuum frequently touched surfaces. <b>There is no need to hot-wash all household laundry daily</b> — excessive cleaning adds anxiety without improving adherence."}
       ]}
     ]},

    {id:"recur", nav:"Recurring?", title:"Recurring or not settling? Re-check before re-treating",
     sub:"Recurrence commonly reflects reinfection, incomplete household treatment or difficulty with hygiene — but persistent symptoms should prompt reconsideration of the diagnosis.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"1 · Dose and repeat", html:"Was treatment taken correctly, and was the second dose taken after 2 weeks?"},
         {tone:"amber", h:"2 · The household", html:"Were all eligible household members treated simultaneously? Any whose age or pregnancy made treatment unsuitable?"},
         {tone:"amber", h:"3 · Hygiene", html:"Were the hygiene measures practical and actually followed?"},
         {tone:"blue", h:"4 · Did it ever improve?", html:"If not, reconsider an alternative diagnosis: eczema, irritant or perianal dermatitis, <b>perianal streptococcal dermatitis</b> (particularly children with marked erythema, pain, fissuring or blood-streaked stool), psoriasis, haemorrhoids, scabies, vulvovaginal disease, inflammatory bowel disease (persistent perianal disease, pain, fissuring or discharge), sexual-health causes in appropriate adolescents/adults, diabetes or immunosuppression (recurrent candidal vulvovaginitis), foreign body (persistent vulvovaginal discharge)."},
         {tone:"red", h:"5 · Secondary infection", html:"Spreading erythema, increasing pain, pus or crusting, fever, significant skin breakdown, urinary symptoms or marked vulval inflammation → review promptly. No empirical antibiotics without clinical evidence of bacterial infection."},
         {tone:"green", h:"6 · Only then consider re-treating", html:"If reinfection is likely and the diagnosis remains secure, a further simultaneous household treatment course may be considered according to local advice, with reinforced hygiene. Avoid repeated empirical courses when symptoms never improved or the diagnosis is uncertain. If symptoms persist despite correctly administered household treatment and hygiene, examine and reconsider the diagnosis rather than repeatedly supplying mebendazole."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"When to refer or seek advice",
     blocks:[
       {b:"cards", items:[
         {tone:"blue", h:"Seek advice or refer", html:"Persistent symptoms despite correctly given household treatment and hygiene · uncertain diagnosis · recurrent significant vulvovaginitis · secondary infection · a very young infant where treatment is difficult to decide · pregnancy with severe symptoms or treatment being considered · marked erythema, pain, fissuring, discharge or fever · significant or persistent eosinophilia, abdominal symptoms, weight loss, pulmonary symptoms or a relevant travel/migration history — broader assessment, often with infectious-disease or tropical-medicine advice. Mild isolated eosinophilia is not typical of uncomplicated threadworm."},
         {tone:"amber", h:"Safeguarding", html:"Threadworm is common and does not indicate neglect or poor hygiene. Follow local safeguarding procedures only when other history or examination findings raise a specific concern."},
         {tone:"cream", h:"GP management", html:"Most uncomplicated threadworm needs pharmacist or GP advice, not referral. Related pages: <a href='../algorithms/anal-itchiness.html'>anal itch pathway</a> · <a href='scabies.html'>scabies</a>."}
       ]},
       {b:"say", html:"This is very common, harmless and easy to treat — it doesn't mean anyone is unclean. Everyone in the house who can take the tablet should take it on the same day, with a second dose two weeks later. For the next couple of weeks, wash hands and scrub under nails, keep nails short, wash around the bottom each morning, and wash underwear, nightwear, towels and bedding on the first day and regularly after that — there's no need to hot-wash everything every day. Your child can keep going to school. If the itching doesn't settle, or the skin looks sore, red or weepy, come back."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A mother brings her <b>5-year-old</b> with two weeks of night-time bottom itching; she saw small white worms. The household includes her <b>14-month-old</b> and her partner, and <b>she is 20 weeks pregnant</b>. She asks whether the children must stay off school and nursery."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Makes the clinical diagnosis; treats the 5-year-old and partner with mebendazole and a 2-week repeat; explains the toddler's treatment is off-label and makes a risk–benefit decision; advises hygiene first in pregnancy and how to get medicines advice if symptoms persist; gives practical hygiene advice; confirms no exclusion is needed; and safety-nets for persistence and secondary infection."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>Greater Manchester Medicines Management Group — Greater Manchester Antimicrobial Guidelines, version 16 (October 2024)</b><br><a href="https://gmmmg.nhs.uk" rel="noopener">gmmmg.nhs.uk</a><span class="rd"> — the local pathway: mebendazole 100 mg over 6 months, off-label under 2, hygiene alone under 6 months and in pregnancy, household treatment</span></li>'+
         '<li><b>Greater Manchester Medicines Management Group — GMMMG Formulary: Infections</b><br><a href="https://www.greatermanchesterformulary.nhs.uk" rel="noopener">greatermanchesterformulary.nhs.uk</a><span class="rd"> — threadworm: do not routinely prescribe (self-care); mebendazole 100 mg chewable tablets a formulary item where prescribing is appropriate</span></li>'+
         '<li><b>NHS — Mebendazole: pregnancy, breastfeeding and fertility</b><br><a href="https://www.nhs.uk/medicines/mebendazole/" rel="noopener">nhs.uk/medicines/mebendazole</a><span class="rd"> — hygiene first in pregnancy, particularly the first 12 weeks; tiny amounts in breast milk</span></li>'+
         '<li><b>BNF / BNFC and current mebendazole product information (SmPC)</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a> · <a href="https://www.medicines.org.uk/emc" rel="noopener">medicines.org.uk/emc</a><span class="rd"> — formulation, licensing, pregnancy and breastfeeding</span></li>'+
         '<li><b>UK guidelines for the investigation and management of eosinophilia in returning travellers and migrants (British Infection Association et al., 2024)</b><br><a href="https://doi.org/10.1016/j.jinf.2024.106328" rel="noopener">doi:10.1016/j.jinf.2024.106328</a><span class="rd"> — broader parasitic and eosinophilia assessment where relevant; not the primary authority for routine threadworm management</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Threadworm. A clinical diagnosis; tape test only if uncertain. Mebendazole 100 mg orally as a single dose for affected people and eligible household members (sharing living or sleeping accommodation) aged 6 months and over, repeated once after 2 weeks per the Greater Manchester pathway. Usually purchased over the counter; NHS prescribing generally not supported in Greater Manchester — follow local commissioning policy and document any exception. Under 2 years off-label — individual risk–benefit assessment. Under 6 months: hygiene alone for 6 weeks. Pregnancy: hygiene first; seek individual medicines advice if severe or persistent. Breastfeeding: generally compatible when clinically appropriate. Hygiene for at least 2 weeks alongside treatment, 6 weeks where medication is not used. No routine school or nursery exclusion. Persistent symptoms: reconsider the diagnosis. Sources: Greater Manchester antimicrobial guidelines (v16, 2024), GMMMG formulary, NHS mebendazole advice, BNF and mebendazole product information, UK eosinophilia guideline (BIA, 2024) for broader parasitic assessment."
});
</script>
