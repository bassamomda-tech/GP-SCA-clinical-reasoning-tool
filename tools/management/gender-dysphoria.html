<title>Gender dysphoria — Protocol · Reasoning GP</title>
<meta name="description" content="Gender dysphoria and gender incongruence in primary care: refer directly to a Gender Identity Clinic on request without gatekeeping, support mental health and suicide risk through waits measured in years, respond to self-sourced hormones with harm reduction and GMC-supported bridging prescribing, monitor haematocrit and bone and cardiovascular health, and screen by anatomy rather than recorded gender." />

<script>
MG.render({
  icon:"⚧",
  title:"Gender dysphoria — the complete guide",
  eyebrow:"Protocol · GMC guidance · refer, support, keep safe — do not gatekeep",
  stemTitle:"The GP's role is to refer directly, support mental health through a wait measured in years, and keep the person safe — not to assess whether they are really trans",
  stemSub:"One page for the whole of primary care's part: affirming care and correct name and pronouns; a direct Gender Identity Clinic referral on request, with no mental-health pre-assessment and no demand for proof; proactive assessment of a markedly raised suicide and self-harm risk that is driven by minority stress rather than by being trans; a harm-reduction response to self-sourced hormones, including GMC-supported bridging prescribing and monitoring; screening tailored to anatomy rather than recorded gender; and continuity through waits that now routinely exceed five years.",
  guideline:"GMC ethical guidance · RCGP position · NHS England gender dysphoria services · Equality Act 2010",
  reviewed:"11 September 2026",
  nextReview:"11 March 2027",
  meta:[
    {t:"GMC — trans healthcare and bridging prescriptions"},
    {t:"RCGP position statement — the role of the GP in transgender care"},
    {t:"Equality Act 2010 — gender reassignment is a protected characteristic"},
    {t:"Anatomy-based screening, not recorded gender", tone:"ok"},
    {t:"v1.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#safety"><b>Risk first</b><small>Suicide · self-harm</small></a><a href="#refer-early"><b>Refer</b><small>Direct · no gatekeeping</small></a><a href="#bridging"><b>Bridging</b><small>Harm reduction</small></a><a href="#monitor"><b>Monitor</b><small>Bloods · BP · bone</small></a><a href="#screening"><b>Screening</b><small>By anatomy</small></a></div>',
  quickSub:"If you read nothing else on this page, read these six cards. Every position traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Refer directly, on request — gatekeeping is the error", html:"A GP can and should refer an adult to a Gender Identity Clinic on request. You do not need a mental-health assessment first, a psychiatric opinion, a diagnosis, or any evidence that the person is “really” trans — requiring any of these delays care and is not supported by GMC guidance. <b>You do not need to be a gender specialist to make the referral</b>, and declining to refer because you feel inexpert is itself a barrier. Refusing or delaying referral on the basis of personal belief is not a lawful exercise of conscientious objection under the Equality Act."},
    {tone:"red", h:"The risk is high, and it is not caused by being trans", html:"Trans and gender-diverse people have markedly higher rates of depression, anxiety, self-harm and suicide. These are driven by minority stress — discrimination, rejection, harassment, misgendering, lack of support — not by gender incongruence itself, which is not a mental illness. Ask directly and compassionately about mood, self-harm and suicidal thoughts at the first appointment and at every review; do not wait for the person to raise it, and do not treat the disclosure as a reason to pause the referral."},
    {tone:"amber", h:"Self-sourced hormones: engage, do not refuse", html:"Refusing to be involved does not stop the person taking hormones — it removes the monitoring and drives concealment. GMC guidance supports a GP considering a bridging prescription to reduce harm where a person is already self-medicating or at risk, ideally after seeking specialist advice. Whatever is decided about prescribing, offer baseline and monitoring bloods and blood pressure anyway — monitoring is not a reward for obtaining hormones through approved channels."},
    {tone:"blue", h:"Screen by anatomy, not by recorded gender", html:"A trans man with a cervix needs cervical screening; a trans woman who has had breast development needs breast screening awareness; anyone with a prostate retains prostate risk. National screening programmes invite by the gender recorded on the GP system, so changing the recorded gender silently removes the person from some invitation lists and adds them to others. Whenever the recorded gender is changed, review every screening programme and arrange the missing ones manually — this is the commonest avoidable clinical harm in trans healthcare."},
    {tone:"green", h:"The wait is the clinical problem", html:"Gender Identity Clinic waits are now routinely several years from referral to first appointment. The referral is therefore not the end of the GP's involvement — it is the start of a long period in which the GP is the only clinician the person sees. <b>Plan for it explicitly:</b> named clinician for continuity, scheduled reviews rather than waiting to be asked, mental-health treatment, monitoring, screening, and signposting to peer and third-sector support."},
    {tone:"purple", h:"Children and young people", html:"Under-18s go to the specialist children and young people's gender service, not an adult GIC. Do not initiate puberty blockers or gender-affirming hormones in primary care. Puberty blockers are now restricted to clinical trial settings following the 2024 restrictions and the Cass Review. <b>Do continue the same affirming, supportive care</b> — correct name and pronouns, mental-health support, safeguarding assessment, family support — while the specialist pathway proceeds."}
  ],
  pathwaySub:"The whole consultation. The first move sets the tone for everything that follows.",
  pathway:[
    {title:"Open by affirming, and commit to the referral", html:"Ask the person's name and pronouns and update the record. Say early that you will make the referral and that nothing needs to be proved. Most trans patients arrive braced for rejection — the trust built in the first minute is what makes the rest of the consultation possible."},
    {title:"Assess mental health and risk — proactively", html:"Mood, anxiety, self-harm, suicidal ideation with a direct question, support network, experience of discrimination or abuse — a proper mental state assessment, not a passing enquiry. Treat what you find; a mental-health need is a reason to add support, never a reason to delay the gender referral.", alert:true},
    {title:"Ask about hormones, without judgement", html:"“Are you taking anything you have sourced yourself?” — asked so that an honest answer is safe. If yes: harm reduction, baseline bloods, blood pressure, specialist advice, and consider a bridging prescription."},
    {title:"Refer — and say what you are doing", html:"Direct GIC referral for adults; the specialist children and young people's service for under-18s. Tell the person the referral is made, be honest about the length of the wait, and give them a copy of the letter if they want it."},
    {title:"Plan the wait", html:"Named GP, scheduled reviews, mental-health treatment, monitoring bloods if on hormones, anatomy-based screening, peer support, and a safety-net. “I will keep seeing you throughout” is the clinically active part of this plan."}
  ],
  sections:[

    {id:"safety", nav:"Risk", title:"Risk and safeguarding — the part that is easy to leave unasked",
     sub:"The referral is the reason for the appointment. The risk assessment is the reason the appointment matters.",
     blocks:[
       {b:"table", head:["Risk","Why it matters here","Action"], rows:[
         ["<b>Active suicidal ideation, a plan, or recent self-harm</b>","Rates of suicidal ideation and attempt in trans people are several times those of the general population, and highest in those who are unsupported, rejected by family, or waiting without contact","Same-day crisis team or urgent mental-health assessment; safety plan made with the person; named contacts and crisis numbers; short prescription quantities; arrange follow-up rather than leaving it open"],
         ["<b>Depression and anxiety</b>","Very common and frequently untreated, because the person expects any symptom to be attributed to their gender","Treat on the same basis as for any other patient — PHQ-9 and GAD-7, SSRI and/or NHS Talking Therapies. Do not make treatment conditional on anything gender-related"],
         ["<b>Rejection, harassment or abuse — family, partner, workplace</b>","Minority stress is the main driver of poor mental health in this group; family rejection is the single strongest predictor of suicide attempt in young trans people","Ask about it directly. Domestic abuse referral routes apply as for any patient; the Equality Act protects against workplace discrimination and supports adjustments"],
         ["<b>Unmonitored self-sourced hormones</b>","Unknown product, unknown dose, no baseline, no monitoring — and the person will usually not volunteer it unless asked in a way that makes honesty safe","See <a href='#bridging'>Bridging</a>. Harm reduction and monitoring regardless of the prescribing decision"],
         ["Under-18, or a young person presenting with a parent who is hostile to their identity","Safeguarding, family conflict, and a risk of the young person disengaging from healthcare altogether","<b>Specialist children and young people's gender service; assess safeguarding and Gillick competence; <b>for those 16 and over presume capacity and assess it only if there is reason to doubt it</b>; see the young person alone for part of the consultation; support the family without conceding the young person's safety</b>"],
         ["<b>Conversion practices, in any form</b>","Attempts to change or suppress gender identity are unethical, harmful, and associated with increased suicidality; they are opposed by the GMC, the RCGP and every UK medical royal college","Never provide, endorse or refer for them. If a family requests one, say clearly that it is harmful and not available"]
       ]},
       {b:"warn", html:"A mental-health problem is a reason to provide mental-health treatment. It is not a reason to withhold or postpone the gender referral, and presenting it as one is the most common form of gatekeeping. <b>The two run in parallel: refer today, treat the depression today.</b> Similarly, a person who is self-medicating has not disqualified themselves from care — they have told you something important, usually at some cost, and the response determines whether they tell you anything again."}
     ]},

    {id:"refer-early", nav:"Refer", title:"The referral — direct, on request, without conditions",
     blocks:[
       {b:"dl", rows:[
         ["<b>Who can refer</b>","Any GP. A referral to an adult Gender Identity Clinic does not require a psychiatric assessment, a second opinion, a formal diagnosis or evidence of “living in role”. <b>Most GICs accept direct GP referrals and several accept self-referral</b> — check the local service, but do not use uncertainty about the route as a reason to defer"],
         ["<b>What the letter should contain</b>","The person's name and pronouns, that they are requesting assessment for gender dysphoria or incongruence, a brief history in their own terms, any current mental-health issues and what you are doing about them, any self-sourced hormone use, current medication, and your contact details for shared care. <b>It does not need to argue a case</b> — and offer the person a copy"],
         ["<b>What not to do</b>","Do not require a mental-health assessment first. Do not ask the person to prove their identity or provide a history of childhood evidence. Do not delay pending a “trial period”. Do not decline because you lack expertise — the referral is the mechanism for obtaining that expertise. Do not refuse on personal or religious grounds: gender reassignment is a protected characteristic and refusal on that basis is discrimination, not conscientious objection"],
         ["<b>Children and young people</b>","Refer to the specialist national children and young people's gender service. Do not initiate puberty blockers or hormones; puberty blockers are restricted to clinical trial settings following the 2024 restrictions and the Cass Review. Affirming care, mental-health support, safeguarding and family support are still the GP's job"],
         ["<b>Honesty about the wait</b>","Say plainly that the wait is years, not months, and that you know that is unacceptable. False optimism about timescales is experienced as another dismissal — and the honest version is what makes the offer of continuing support credible"]
       ]},
       {b:"say", html:"Before we go any further — I'm going to refer you to the gender clinic today, and you don't have to convince me of anything or prove anything to me. That's not my role and it's not what the referral needs. What I would like to do, if you're happy, is use the rest of our time to make sure you're supported while you wait, because I have to be honest with you that the wait is likely to be a few years. That's not acceptable, and it means the person looking after you in the meantime is me. So can we talk about how you're doing in yourself, and about anything you might already be taking?"}
     ]},

    {id:"bridging", nav:"Bridging", title:"Self-sourced hormones and bridging prescriptions",
     sub:"The decision is not whether the person takes hormones. It is whether anyone is monitoring them.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"What the GMC actually says", html:"GMC guidance is explicit that a GP may prescribe a bridging prescription where a patient is already self-medicating with hormones obtained without medical supervision, or is at risk of self-harm or suicide, while they await specialist assessment. The expectation is that the GP seeks the advice of a gender specialist, prescribes the lowest acceptable dose in the circumstances, and monitors. It is a harm-reduction measure, not the initiation of gender-affirming treatment, and that distinction is what makes it within a GP's competence."},
         {tone:"amber", h:"The three conditions in practice", html:"(1) The person is already self-medicating, or the risk of them doing so is real and imminent. (2) You have sought or attempted to seek specialist advice — document the attempt if no reply comes. (3) You monitor. Bridging is a shared decision recorded as such, with the rationale, the specialist advice sought, and the monitoring plan all written down."},
         {tone:"blue", h:"If you decide not to bridge", html:"That can be a reasonable decision — but it does not end your involvement. Still take a history of what is being taken, still do baseline and monitoring bloods, still check blood pressure, still give harm-reduction advice, and still document it. <b>Declining to prescribe is not a reason to decline to monitor</b>, and a person left entirely unmonitored because they are using an unapproved supply is worse off for having told you."},
         {tone:"green", h:"Shared care once the GIC is involved", html:"When the specialist service initiates treatment it will propose a shared-care agreement covering monitoring and repeat prescribing. Declining shared care wholesale — while it may be within the letter of a GP's rights — leaves the patient without a prescriber and is strongly discouraged by the RCGP. If you have genuine concerns about a specific element, raise them with the service rather than refusing the whole arrangement."},
         {tone:"red", h:"Harm reduction to give regardless", html:"Never inject into a vein; use clean needles and the local needle exchange; never share equipment. <b>Do not double a dose to make up a missed one.</b> Bring the actual product or a photograph of the packaging to the next appointment — dose and preparation are frequently not what the person believes them to be. Hepatitis B vaccination and BBV screening where injecting equipment may have been shared."},
         {tone:"blue", h:"Fertility — say it before treatment starts", html:"<b>Both testosterone and oestrogen can permanently impair fertility.</b> Fertility preservation must be discussed and offered before hormone treatment begins, including before a bridging prescription, and documented. This conversation is frequently omitted and cannot be had retrospectively."}
       ]}
     ]},

    {id:"monitor", nav:"Monitoring", title:"Monitoring on hormone therapy",
     sub:"The same monitoring applies whether the hormones were prescribed by a clinic, bridged by you, or bought online.",
     blocks:[
       {b:"table", head:["What","When","Why it matters"], rows:[
         ["<b>Baseline before or at the point of starting</b>","<b>FBC (including haematocrit), U&amp;E, LFTs, lipids, HbA1c or glucose, and the relevant sex hormone level (<b>testosterone</b>, or <b>oestradiol</b> where on oestrogen); blood pressure, weight, smoking status</b>","Establishes the comparator. Without a baseline, a later abnormal haematocrit cannot be interpreted"],
         ["<b>Testosterone — haematocrit</b>","At baseline, then approximately 3-monthly for the first year and 6–12-monthly thereafter","Secondary polycythaemia is the most important and most frequently missed complication of testosterone therapy. A rising haematocrit needs specialist advice and may require dose reduction or venesection — and smoking compounds it, which makes cessation support part of the monitoring"],
         ["<b>Oestrogen — VTE risk</b>","Assess at initiation and whenever circumstances change (surgery, immobility, pregnancy in a partner is irrelevant — the risk is the patient's own)","Oestrogen raises VTE risk, and the risk is higher with ethinylestradiol and with oral preparations than with transdermal. Smoking cessation matters more here than almost anywhere else in the review"],
         ["<b>Blood pressure, lipids and cardiovascular risk</b>","<b>At baseline and at least annually</b>","Standard cardiovascular risk calculators are not validated in trans people and are sensitive to which gender is entered. Calculate using both, discuss the range honestly, and treat modifiable risk factors on their merits rather than relying on a single score"],
         ["<b>Bone health</b>","Consider DXA where there has been gonadectomy with any period off hormone therapy, prolonged interruption of treatment, or other osteoporosis risk factors","<b>Sex steroid deficiency after gonadectomy causes rapid bone loss.</b> A person who stops hormones after gonadectomy — for cost, supply or any other reason — is at real risk, so ask about continuity of supply rather than assuming it"],
         ["<b>Hormone levels — testosterone or oestradiol</b>","Per the shared-care protocol; timing relative to the dose matters and varies by preparation","Interpret against the target range for the affirmed gender, not the range attached to the recorded sex on the lab report — laboratory reference ranges and flagging are a recurring source of misinterpretation"],
         ["<b>Mental health</b>","<b>Every review</b>","Hormone therapy often improves dysphoria substantially; it does not treat depression, and improvement in one is regularly mistaken for resolution of the other"]
       ]}
     ]},

    {id:"screening", nav:"Screening", title:"Anatomy-based screening and general health",
     sub:"The single most common avoidable harm in trans healthcare is a screening invitation that was never sent.",
     blocks:[
       {b:"table", head:["Programme","Who needs it","The system problem"], rows:[
         ["<b>Cervical screening</b>","Anyone with a cervix, including trans men and non-binary people registered as male","<b>Registered as male: no invitations are ever sent.</b> <b>The GP practice must recall and arrange these manually.</b> The examination is often dysphoric and painful, particularly on testosterone which causes atrophic change — offer a smaller speculum, topical oestrogen beforehand, extra time, self-sampling where available, and the option to stop at any point"],
         ["<b>Breast screening</b>","Trans men who have not had chest surgery, and those who have had reduction rather than complete removal; trans women aged 50–71 who have been on oestrogen for several years should be made aware and can self-refer","Registered as male: no invitation. Registered as female after mastectomy: invitations still arrive — both directions cause harm, and both need an explicit note in the record"],
         ["<b>Abdominal aortic aneurysm screening</b>","Trans women and anyone registered as female who was assigned male at birth is not invited, although the risk relates to being assigned male","Can be requested directly by the practice; simply not offered by default"],
         ["<b>Prostate</b>","Anyone with a prostate, including trans women — the prostate is not removed in genital reconstruction surgery","PSA reference ranges are lowered by oestrogen and antiandrogens, so a “normal” PSA can be falsely reassuring. Discuss with urology rather than interpreting the number at face value"],
         ["<b>Bowel screening</b>","<b>Everyone in the age range</b>","Invited on the recorded gender but sent to everyone, so this one usually works"]
       ]},
       {b:"cards", items:[
         {tone:"blue", h:"📋 When the recorded gender changes", html:"Changing the gender marker generates a new NHS number and a new record. The old record does not automatically follow, and screening recalls, chronic-disease registers and QOF recalls can all be lost. Whenever this happens, actively review every screening programme, every chronic-disease register and every recall — and record the anatomy present, with the person's consent, so future clinicians can screen correctly."},
         {tone:"green", h:"🏥 Everything else is just general practice", html:"Contraception is still needed where there is a uterus and sperm exposure — testosterone is not a contraceptive and does not reliably prevent pregnancy even when periods stop. Sexual health and BBV screening as for anyone. Vaccination as normal. Smoking cessation carries extra weight alongside oestrogen and testosterone."},
         {tone:"amber", h:"⚠ Do not attribute everything to the hormones", html:"Chest pain, headache, abdominal pain and low mood in a trans patient are investigated exactly as they would be in anyone else. “Trans broken arm syndrome” — attributing unrelated symptoms to gender identity or hormone therapy — is a recognised and consequential diagnostic failure."},
         {tone:"purple", h:"🗂 Records and the law", html:"A person can change their name and gender on the GP record without a Gender Recognition Certificate and without any medical evidence. Disclosing someone's trans status without consent may be a criminal offence under the Gender Recognition Act where a GRC is held, and is a confidentiality breach regardless. <b>Be careful with referral letters, results and reception conversations.</b>"}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 24-year-old trans man (he/him), assigned female at birth, attends asking for a referral to a gender clinic and opens with “I'm guessing you'll want me to jump through hoops first?” He has socially transitioned and has years of persistent distress. As trust builds he discloses <b>low mood and episodes of self-harm</b> with no current support, and — hesitantly — that he has <b>started buying testosterone online</b> because the wait is years. He is <b>registered as female and overdue cervical screening</b>, which he finds distressing."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Asks and uses correct name and pronouns, and commits to the referral in the first minute without requiring proof or a mental-health pre-assessment; proactively and compassionately asks about mood, self-harm and suicidal thoughts, and treats them <b>in parallel with — not instead of — the referral</b>; asks about self-sourced hormones in a way that makes honesty safe and responds with harm reduction, specialist advice, consideration of a bridging prescription and monitoring bloods rather than refusal; <b>raises fertility preservation before any prescribing</b>; arranges cervical screening on anatomy despite the recorded gender, with sensitivity about how distressing it is; is <b>honest that the wait is years</b>; signposts peer support; and <b>offers explicit continuity</b> — “I'll keep seeing you throughout.” Fails on: misgendering, gatekeeping, pathologising, refusing all involvement with the hormones, or missing the screening."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every position on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>GMC — Trans healthcare: ethical guidance for doctors</b><br><a href="https://www.gmc-uk.org/ethical-guidance/ethical-hub/trans-healthcare" rel="noopener">gmc-uk.org — trans healthcare</a><span class="rd"> — that GPs may refer directly without specialist assessment, the bridging-prescription position (already self-medicating or at risk, specialist advice sought, lowest acceptable dose, monitoring), shared care, and the prohibition on discriminatory refusal</span></li>'+
         '<li>RCGP — position statement on the role of the GP in caring for gender-questioning and transgender patients<span class="rd"> — the expectation of non-discriminatory care, the limits of GP competence, and the strong discouragement of blanket refusal of shared care</span></li>'+
         '<li>NHS England — gender dysphoria service specifications (adults; children and young people)<span class="rd"> — referral routes, the specialist children and young people\u2019s pathway, and published waiting times</span></li>'+
         '<li>Cass Review — Independent review of gender identity services for children and young people (2024)<span class="rd"> — the basis for the current restriction of puberty blockers to clinical trial settings and the holistic multidisciplinary model for under-18s</span></li>'+
         '<li><b>Equality Act 2010</b><span class="rd"> — gender reassignment as a protected characteristic; refusal to refer on personal or religious grounds is discrimination, and workplace adjustments are an entitlement</span></li>'+
         '<li><b>Gender Recognition Act 2004</b><span class="rd"> — the criminal offence of disclosing the trans status of a person holding a Gender Recognition Certificate without consent</span></li>'+
         '<li>NHS screening programme guidance — screening for trans and non-binary people<span class="rd"> — the anatomy-based screening rules and the recorded-gender invitation failures for cervical, breast and AAA screening</span></li>'+
         '<li>Primary care hormone monitoring standards (shared-care protocols; endocrine society guidance)<span class="rd"> — haematocrit monitoring on testosterone, VTE risk on oestrogen, bone health after gonadectomy, and the limits of cardiovascular risk calculators</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Gender dysphoria — GMC ethical guidance on trans healthcare, RCGP position statement, NHS England gender dysphoria service specifications, the Cass Review (2024), and the Equality Act 2010. Refer directly on request without gatekeeping; assess and treat mental health and suicide risk proactively; respond to self-sourced hormones with harm reduction, specialist advice, consideration of a bridging prescription and monitoring; screen by anatomy rather than recorded gender; and provide continuity through waits measured in years. Under-18s go to the specialist children and young people's service; do not initiate hormones or blockers in primary care. Verify all doses and shared-care arrangements against the BNF and the local protocol before prescribing."
});
</script>
