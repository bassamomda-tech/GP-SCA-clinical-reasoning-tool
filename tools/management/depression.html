MG.render({
  icon:"🧠",
  title:"Depression — the complete guide",
  eyebrow:"Protocol · diagnose, treat and stop properly",
  stemTitle:"Risk and bipolar before anything, then treat the whole cause — not just the serotonin",
  stemSub:"One page for the whole condition. Ask about suicide directly and document it; screen for past mania every time; use PHQ-9 alongside clinical judgement to support the NG222 less-severe / more-severe fork; consider organic mimics by history and risk; prescribe the non-drug options with the same specificity as a drug; match the antidepressant to the patient in front of you; run the 2–4–6-week response clock; fix each side effect instead of abandoning ship; continue 6 months to 2 years after remission; and come off hyperbolically, not in a fortnight. NICE NG222 · CG192 · RCPsych.",
  guideline:"NICE NG222 (2022, updated December 2025) · NICE CG192 (2014, updated 2020) · RCPsych stopping antidepressants guidance · NICE NG12 (updated April 2026)",
  reviewed:"9 September 2026",
  nextReview:"9 March 2027",
  meta:[
    {t:"NICE NG222 (2022, updated December 2025)"},
    {t:"Cipriani 2018 · Noetel 2024 · Davies & Read 2019"},
    {t:"NG12 stated honestly", tone:"tw"},
    {t:"v2.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:"<div class='mg-layers'><a href='#severe'><b>Risk first</b><small>Suicide · psychosis · bipolar</small></a><a href='#confirm'><b>Score it</b><small>PHQ-9 &lt;16 vs ≥16</small></a><a href='#choose'><b>Choose</b><small>By the patient, not the drug</small></a><a href='#duration'><b>Stop well</b><small>Hyperbolic taper</small></a></div>",
  quickSub:"If you read nothing else on this page, read these six cards. Every figure traces to the source cited under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Ask about suicide directly — and document what you asked", html:"Thoughts of death → plan → intent → means → protective factors. Asking does not plant the idea (Dazzi 2014 — no evidence that asking about suicidal thoughts increases them; the myth causes under-assessment). Active intent, a feasible plan, a recent attempt, inability to stay safe, severe intoxication, psychosis or no protective support → urgent same-day mental-health assessment via the local crisis pathway; 999/A&amp;E for immediate danger. Record the safety plan, means restriction and follow-up; involve family with consent (unless safeguarding requires otherwise). Psychotic depression, stupor or severe self-neglect is urgent psychiatry today."},
    {tone:"amber", h:"Screen for past mania before every antidepressant", html:"“Have you ever had a period of 4 or more days of feeling unusually high or wired, needing little sleep, spending or acting out of character?” An SSRI alone in unrecognised bipolar disorder can precipitate mania, a mixed state or rapid cycling — refer rather than switch. A screening tool such as the MDQ is an adjunct only — a positive screen needs clinical assessment, and a negative one does not exclude bipolar II. Bipolar II is the one that hides as recurrent unipolar depression."},
    {tone:"blue", h:"PHQ-9 supports the fork — it is not the diagnosis", html:"PHQ-9 quantifies and monitors symptoms; combined with clinical assessment, function, duration, comorbidity and risk, scores &lt;16 versus ≥16 support NG222's less-severe / more-severe discussion — they neither establish nor exclude depression. Bands: 0–4 none · 5–9 mild · 10–14 moderate · 15–19 moderately severe · 20–27 severe. In less severe depression, antidepressant monotherapy is not routinely first-line — offered if preferred, if psychological options are unsuitable or unavailable, or if they have not helped. In more severe depression an antidepressant PLUS psychological therapy beats either alone."},
    {tone:"green", h:"Consider the mimics — by history and risk", html:"Investigate physical causes according to history, examination, age, medication and atypical features — e.g. TSH, FBC/ferritin, B12/folate, HbA1c, renal function, LFTs where indicated; baseline sodium if at higher risk of hyponatraemia; ECG before citalopram or escitalopram with cardiac or QT risk. Alcohol is the commonest modifiable driver. Review medicines with a temporal link — but do not stop important medicines without a risk–benefit assessment."},
    {tone:"blue", h:"The response clock: judge at 4 weeks, not at day 5", html:"2–4 weeks for the first effect, 4–8 weeks for the full effect. Some response at 4 weeks → optimise the dose and judge fully at 6–8 weeks. No meaningful response at 4 weeks → check adherence, dose, alcohol, diagnosis and therapy access before switching. Book the review before they leave: 1 week if aged 18–25 inclusive or at increased suicide risk, otherwise about 2 weeks — then every 2–4 weeks for the first 3 months by risk. Many stop early, often because nobody warned them."},
    {tone:"cream", h:"Continue 6 months after remission — then stop hyperbolically", html:"Continue at the dose that worked for at least 6 months after remission; ≥2 years if recurrent, severe or residual symptoms. Recurrence risk rises with each episode. Stopping: slow, staged, PROPORTIONATE reductions agreed with the patient, smaller as the dose falls (hyperbolic tapering is one example — e.g. about 10% of the current dose — not a mandatory regimen); liquids at the bottom end; no alternate-day dosing for short half-life drugs. Not “one every other day for a fortnight”."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step comes before the prescription pad, every time.",
  pathway:[
    {title:"Risk, psychosis and bipolar — before anything else", html:"Ask directly about suicidal thoughts, plan, intent and means, and document it. Active intent or plan, psychotic features, stupor or severe self-neglect → same-day mental health assessment (999 if immediate danger). Any history of mania or hypomania → refer; do not start an antidepressant alone.", alert:true},
    {title:"Confirm the diagnosis and score the severity", html:"ICD-11 core symptoms for at least 2 weeks — persistent low mood, anhedonia, or both — plus the additional symptoms. Use PHQ-9 and GAD-7 as baseline measures (not the diagnosis), record the functional impact, and use the less severe versus more severe fork with clinical judgement. Adjustment disorder and normal grief are different animals with different management."},
    {title:"Exclude the mimics and take the baseline", html:"Tests by history and risk (not a universal panel). AUDIT-C for alcohol. Review every drug that lowers mood. ECG before citalopram or escitalopram in the older or cardiac patient."},
    {title:"Treat — the menu for less severe, drug plus therapy for more severe", html:"Less severe: a shared choice of guided self-help, group exercise, CBT or behavioural activation, counselling, IPT or social prescribing; antidepressant where preferred or others are unsuitable. More severe: an antidepressant plus high-intensity therapy, chosen by the patient in front of you. Prescribe the non-drug options with the same specificity as a drug."},
    {title:"Review on the clock, then continue and stop properly", html:"Review at 1 week if aged 18–25 or at increased risk, otherwise 2 weeks; then every 2–4 weeks for 3 months. Assess early response at 4 weeks, optimise, reassess at 6–8 weeks if partial, switch after checks, and consider referral after two adequate trials by severity and risk. Continue at least 6 months after remission and taper in proportionate steps."}
  ],
  sections:[
    {id:"severe", nav:"Risk & red flags", title:"Risk, psychosis, bipolar — the assessment that comes before the prescription", sub:"Everything else on this page can wait a week. These cannot.",
     blocks:[
       {b:"warn", html:"Ask every patient presenting with low mood directly about suicidal ideation. Asking does not increase risk — it reduces it. Document what you asked, what they said, the risk and protective factors you identified, and the decision you made: that record is a clinical and medicolegal necessity."},
       {b:"cards", cols:2, items:[
         {tone:"red", h:"999 / same-day crisis team", html:"Active intent, a feasible plan, recent attempt, inability to stay safe, severe intoxication, psychosis or no protective support → urgent same-day assessment via the local crisis pathway; 999/A&amp;E for immediate danger or a recent overdose (toxicity — especially tricyclics). Recent self-harm → urgent assessment matched to risk (not automatically an ambulance). Contact family with consent; reduce access to means; limit prescription quantities."},
         {tone:"red", h:"Psychotic depression", html:"Mood-congruent delusions (worthlessness, guilt, nihilism, poverty) or auditory hallucinations — especially commands to self-harm — carry the highest suicide risk of all. Urgent psychiatric assessment today. Specialist-led — commonly an antidepressant with an antipsychotic and/or ECT; not antidepressant monotherapy in primary care."},
         {tone:"amber", h:"Bipolar signal", html:"Elevated mood, racing thoughts, reduced need for sleep, grandiosity or reckless behaviour — preceding, following or alternating with the low mood. Prescribing an SSRI alone in unrecognised bipolar disorder can precipitate mania or rapid cycling. Ask directly (a tool such as the MDQ is an adjunct, not diagnostic), and seek psychiatric advice rather than repeatedly switching antidepressants; if mania or hypomania develops, consider stopping antidepressant monotherapy (NICE CG185)."},
         {tone:"amber", h:"Severe functional impairment", html:"Unable to eat, drink, maintain hygiene or care for children → urgent mental health assessment; consider voluntary or, if there is risk to self or others, involuntary admission under the MHA 1983. Document the functional assessment at every contact, and make a safeguarding referral where severe parental depression is impairing childcare."},
         {tone:"amber", h:"Perinatal — a different clock", html:"Low mood within 12 months of birth: postnatal depression, which affects 10–15% of UK mothers and is the most under-diagnosed condition in perinatal care. EPDS is a screen — a high score, suicidal ideation, psychotic symptoms, severe impairment or infant-safety concerns prompt urgent assessment per the local perinatal pathway. Postpartum psychosis (usually early, but can be later: confusion, hallucinations, agitation, rapidly shifting mood) → same-day psychiatric assessment, usually via a mother-and-baby service. Distinguish <b>baby blues (day 3–5, self-limiting)</b> from <b>PND (persisting beyond 2 weeks)</b> from <b>postpartum psychosis (early, severe, rapid onset)</b>. Assess baby safety in every case."},
         {tone:"cream", h:"What high risk actually changes today", html:"A crisis plan made today, not at the next appointment: crisis numbers saved in the patient's phone while you are together, weekly or fortnightly prescription quantities instead of a month, means reduced, a named person informed with consent, a review interval measured in days, and no tricyclic (lofepramine excepted) because of overdose toxicity."}
       ]},
       {b:"kv", rows:[
         ["Structured risk assessment — at every contact","Passive versus active ideation · plan · intent · means · previous attempts · alcohol and substance use · social support · protective factors (children, beliefs, future plans). Use the <b>C-SSRS</b> or an equivalent structured tool. “Low risk” is not a tick-box — record what was asked and what the patient said. Risk is dynamic: re-assess it every time"],
         ["Risk factors for completed suicide","Male sex, older age, social isolation, alcohol or substance use, a previous attempt, access to lethal means, chronic pain, terminal illness, recent bereavement or relationship breakdown"],
         ["Adverse childhood experiences","Adverse childhood experiences increase the risk of depression dose-dependently. Identifying them changes the treatment (trauma-focused CBT, EMDR) and explains why standard SSRI-plus-CBT can disappoint in complex trauma"],
         ["Domestic abuse and coercive control","Ask, with a validated tool (DASH). Intimate partner violence and coercive control are among the strongest environmental drivers of depression in women — and no antidepressant outruns an unsafe home"]
       ]},
       {b:"why", html:"Direct questioning about suicide does not increase suicidal ideation — the evidence, including the <strong>Cochrane</strong>-indexed systematic review by <strong>Dazzi et al. 2014</strong>, is consistent. The belief that asking “plants the idea” is one of the most damaging misconceptions in practice, because it produces under-assessment. Asking inside a therapeutic relationship relieves distress, opens the conversation, and is itself the first step of risk reduction."}
     ]},

    {id:"confirm", nav:"Confirm & score", title:"Confirm it is depression, then score it", sub:"The diagnosis is clinical; the score is what makes the plan, tracks the response and proves the reasoning.",
     blocks:[
       {b:"kv", rows:[
         ["ICD-11 depressive episode","At least 2 weeks of: persistent low mood most of the day nearly every day, and/or markedly diminished interest or pleasure (anhedonia) — plus additional symptoms from: weight or appetite change, sleep disturbance (insomnia or hypersomnia), psychomotor agitation or retardation, fatigue, worthlessness or excessive guilt, poor concentration, recurrent thoughts of death or suicidal ideation. Mild = 2 core + 2 additional · moderate = 2 core + 3–4 · severe = 2 core + 5 or more"],
         ["PHQ-2 as the gateway","Two questions over the past 2 weeks — little interest or pleasure in doing things, and feeling down, depressed or hopeless — each scored 0–3. A PHQ-2 score ≥3 means go on to the PHQ-9. Never diagnose depression from a screening questionnaire alone. The efficient screen inside a long-term-condition or multimorbidity review"],
         ["PHQ-9 scoring","9 items scored 0–3 (not at all · several days · more than half the days · nearly every day), total 0–27. Severity: 0–4 none or minimal · 5–9 mild · 10–14 moderate · 15–19 moderately severe · 20–27 severe. The last item scores functional impairment — the question that actually decides management. Record the total and the date at every consultation to monitor change — the diagnosis remains clinical"],
         ["The NG222 fork","PHQ-9 with clinical assessment and functional impact supports the less severe (&lt;16) / more severe (≥16) discussion — a shared decision, not dictated by the score"],
         ["What counts as response","A ≥50% PHQ-9 reduction is a useful response marker; PHQ-9 &lt;5 is a common research remission marker — but remission should also reflect clinical recovery and function, and a score alone does not decide continuation or stopping"],
         ["GAD-7 alongside, every time","Score anxiety concurrently — comorbid anxiety is common, and GAD-7 ≥10 suggests moderate-to-severe anxiety. Treat the depression first (SSRIs are first-line for both), but if severe anxiety is clearly the primary driver, treat it as the primary diagnosis — see the <a href='anxiety.html'>anxiety protocol</a>. Document both scores"],
         ["Adjustment disorder versus depression (DSM-5)","Adjustment disorder with depressed mood is a proportionate reaction to an identifiable stressor that resolves as the stressor resolves; it is managed with psychological support and structured watchful waiting. The stressor does not decide the diagnosis — the symptom severity, duration and impairment do. A full depressive episode needs treating whether or not something obvious precipitated it"]
       ]},
       {b:"why", html:"The PHQ-9 earns its place not in the initial labelling — which you could do clinically — but in <strong>serial measurement</strong>. NG222 asks for a validated outcome tool at every contact rather than clinical impression alone, and a documented score at each escalation point is the clearest possible record of why you did what you did, and when."}
     ]},

    {id:"differential", nav:"Mimics", title:"Exclude the organic causes — several are reversible", sub:"Missing these means years of partial response on an antidepressant while the real cause runs on.",
     blocks:[
       {b:"table", head:["Cause","What it looks like","What to do"], rows:[
         ["<b>Hypothyroidism</b>","<b>The most important and most commonly missed organic cause.</b> Low mood with fatigue, weight gain, cold intolerance, constipation, bradycardia, dry skin","TSH if symptoms suggest thyroid disease or the diagnosis is uncertain. Subclinical (raised TSH, normal free T4): treat if TSH &gt;10 mU/L, or if symptomatic with TSH 4–10 mU/L. Overt hypothyroidism: levothyroxine — treat the thyroid, not the depression; mood resolves in most patients on adequate replacement (see the <a href='hypothyroidism.html'>hypothyroidism protocol</a>)"],
         ["<b>Anaemia and deficiency</b>","Fatigue, low mood, poor concentration and cognitive slowing that mimics depression closely","FBC, ferritin, B12 and folate. Iron deficiency can precede anaemia — ferritin &lt;30 µg/L is iron deficiency (ferrous sulphate 200 mg once daily, BSG 2021). B12 deficiency from malabsorption without neurological features: IM hydroxocobalamin 1 mg three times a week for 2 weeks, then every 2–3 months; with neurological features, 1 mg on alternate days until no further improvement (BNF); oral cyanocobalamin 50–150 micrograms OD for dietary deficiency alone"],
         ["<b>Diabetes and hyperglycaemia</b>","Low mood, cognitive dulling, fatigue","Type 2 diabetes roughly doubles the risk of depression, and hyperglycaemia itself lowers mood. HbA1c according to diabetes risk. The relationship is bidirectional — each worsens the other, and glycaemic control improves mood"],
         ["<b>Alcohol and substances</b>","The commonest modifiable cause of persistent depression in primary care","AUDIT-C, then units per week and the pattern of use (CAGE questions if useful). Alcohol is a CNS depressant and works through several routes at once — neurochemistry, sleep, social consequences, nutrition and thiamine depletion. Regular cannabis use is causally associated with depression and anxiety (Mendelian randomisation), and benzodiazepine or opioid dependence also lowers mood"],
         ["<b>Drug-induced low mood</b>","Temporal link to starting or changing a drug","Possible contributors where timing fits — beta-blockers, corticosteroids, hormonal contraception (particularly with prior depression), isotretinoin, finasteride, varenicline and others. Consider the underlying condition, indication, timing and alternatives; <b>do not stop clinically important medicines (e.g. statins, cardiovascular drugs) without a risk–benefit assessment</b>"],
         ["<b>Chronic physical illness</b>","Comorbid depression, not “understandable sadness”","Depression is common in chronic pain, heart failure, COPD, cancer, Parkinson's, MS, stroke, CKD and inflammatory arthritis. Treat it with the same rigour as primary depression"],
         ["<b>Grief and bereavement</b>","Sadness, tearfulness, preoccupation with the deceased, poor appetite and sleep","Normal grief does not routinely need an antidepressant — watchful waiting, Cruse Bereavement Support, the Good Grief Trust. Prolonged grief disorder (ICD-11): persistent disabling grief beyond 6–12 months with failure to return to functioning → specialist psychological therapy. Depression can co-exist with grief — treat it if PHQ-9 ≥10 persists with functional impairment"],
         ["<b>The rest of the list</b>","Easy to miss in a 10-minute appointment","Obstructive sleep apnoea (see <a href='osa.html'>OSA</a>) · perimenopause, where the HRT conversation may matter more than the SSRI (see <a href='menopause.html'>menopause</a>) · vitamin D deficiency · undiagnosed ADHD, PTSD or autism · dementia presenting as apathy in the older patient"]
       ]},
       {b:"why", html:"Hormonal contraception was associated with a higher risk of a first depression diagnosis in a large Danish cohort (<strong>Skovlund et al. 2016</strong>) — an association, so review the method when mood change clearly tracks a contraceptive change. And heavy drinkers who cut down often improve dramatically within weeks with no antidepressant at all, whereas treating depression with an SSRI while the drinking continues works poorly and raises impulsivity and suicide risk."}
     ]},

    {id:"workup", nav:"Work-up", title:"Tests by indication, the subtype question, and the NG12 slot", sub:"Tests chosen by history, examination and risk — plus two questions that change the treatment.",
     blocks:[
       {b:"cards", items:[
         {tone:"blue", h:"Baseline bloods and tests", html:"<b>By history, examination and risk — not a mandatory panel:</b> TSH, FBC/ferritin, B12/folate, HbA1c, U&amp;E/eGFR, LFTs where indicated · baseline sodium if at higher risk (older, diuretics, low weight, prior hyponatraemia, renal disease) · ECG before citalopram or escitalopram with cardiac disease, electrolyte disturbance or other QT-prolonging drugs."},
         {tone:"blue", h:"Social history is a clinical investigation here", html:"Housing · employment and money worries · relationship quality · caring responsibilities · adverse childhood experiences · recent losses and transitions · loneliness (“How often do you feel lonely?”) · domestic abuse screen. These decide whether the answer is a tablet, a link worker, or both."},
         {tone:"blue", h:"Ask the subtype question", html:"Seasonal — recurrent winter onset with spring remission → light therapy plus an SSRI. Atypical — mood reactivity, hypersomnia, hyperphagia, leaden paralysis, rejection sensitivity → an SSRI is reasonable. Melancholic — profound anhedonia, worse in the morning, early-morning wakening → antidepressant plus structured therapy. Psychotic — see the red-flag section."},
         {tone:"purple", h:"NG12 slot — stated honestly", html:"Depression has <b>no NICE NG12 criterion of its own, and this page does not invent one</b>. But two NG12 routes are commonly hiding inside a “low mood and tiredness” consultation and must not be lost to the psychiatric label: <b>unexplained weight loss</b> and <b>unexplained iron-deficiency anaemia</b>. The precise thresholds are restated in <a href='#refer'>Refer</a>.", src:"NICE NG12 (updated April 2026) · house rule"},
         {tone:"cream", h:"What NOT to do", html:"Do not order a broad “depression screen” of every available test, and do not delay treatment while waiting for normal results in an obviously depressed patient. Test by indication. Equally, do not attribute weight loss, fatigue or anaemia to the depression without investigating it."}
       ]},
       {b:"warn", html:"<b>Hyponatraemia monitoring is risk-based.</b> SSRIs and SNRIs can cause SIADH; risk rises with older age, diuretics, low body weight, previous hyponatraemia, renal disease and other comorbidity. Check a baseline sodium in those at higher risk and repeat after starting or a dose increase when indicated (commonly within 1–2 weeks). Sodium &lt;130 mmol/L warrants prompt clinical review; severe or symptomatic hyponatraemia is an emergency."}
     ]},

    {id:"whototreat", nav:"Who to treat", title:"The NG222 fork — the menu for less severe, combination for more severe", sub:"NG222 replaced rigid stepped care with a shared decision between co-equal options. In less severe depression, antidepressant monotherapy is not routinely first-line.",
     blocks:[
       {b:"p", html:"For <strong>less severe</strong> depression (PHQ-9 under 16) NG222 lists the options least-intrusive first; <strong>antidepressant monotherapy is not routinely first-line</strong> — offered if the patient prefers it, if other options are unsuitable or unavailable, or if they have not worked. Choose together from:"},
       {b:"cards", items:[
         {tone:"green", h:"📚 Guided self-help", html:"CBT-based workbook or digital programme with practitioner support — first on NG222's list. NHS Talking Therapies takes <b>self-referrals</b> — give the actual number or link in the consultation. Step 2 offers psychoeducation, guided self-help and digital CBT (Beating the Blues, SilverCloud)."},
         {tone:"green", h:"🏃 Structured group exercise", html:"A treatment in NG222, not lifestyle advice: a structured group programme with a defined activity, frequency, start date and review point, matched to ability and preference — see <a href='#lifestyle'>the non-drug section</a> for the prescription-grade detail."},
         {tone:"green", h:"💬 Therapies", html:"Group or individual CBT, behavioural activation, interpersonal therapy, counselling, short-term psychodynamic therapy, and mindfulness — MBCT specifically for relapse prevention. Step 3 in Talking Therapies means CBT of <b>16–20 sessions</b>."},
         {tone:"green", h:"🔗 Social prescribing", html:"Debt, housing, loneliness, work, carer load — when the life problem is the driver, treat the life problem. Refer via the local link-worker service (access varies)."},
         {tone:"green", h:"😴 Sleep and alcohol first", html:"Address sleep (CBT-I principles; digital options where locally available) and the drinking before judging any mood response — otherwise you are titrating a drug against a moving target."},
         {tone:"cream", h:"👀 Active monitoring", html:"A genuine option for subthreshold symptoms — a structured review booked in 2–4 weeks, not “come back if it gets worse”."}
       ]},
       {b:"kv", rows:[
         ["More severe depression (PHQ-9 ≥16)","An antidepressant PLUS high-intensity psychological therapy (CBT or IPT) beats either alone. An antidepressant alone or therapy alone remain legitimate choices where that is the patient's preference — but say out loud what is being given up"],
         ["Antidepressant monotherapy is not routinely first-line in less severe depression","Offer it where the person prefers medication, psychological treatment is unsuitable or unavailable, or an appropriate non-drug intervention has not helped — a shared choice"],
         ["The referral itself is a treatment step","Refer to NHS Talking Therapies with a PHQ-9 of 5–15 and mild-to-moderate impairment; check the local access route and waiting time, and chase the referral at the next review — an unstarted therapy referral is the commonest hidden reason a plan “failed”"]
       ]},
       {b:"why", html:"NG222 (2022, updated December 2025) shifted the model deliberately: pharmacological, psychological and social interventions are presented as <strong>co-equal options with patient preference at the centre</strong> rather than a rigid ladder; the recommendation against routine antidepressants for mild depression stayed; and exercise and social prescribing entered the treatment pathway explicitly for the first time."}
     ]},

    {id:"lifestyle", nav:"Non-drug", title:"Prescribe the non-drug options with the same specificity as a drug", sub:"Modality, frequency, duration, referral route — “try to get out a bit more” is not a prescription.",
     blocks:[
       {b:"cards", items:[
         {tone:"green", h:"🏃 Structured physical activity", html:"A structured programme — defined activity, frequency, start date and review point — via the exercise referral scheme or a group programme, matched to ability and preference. Walking or jogging, yoga, strength training and mixed aerobic exercise are all effective (Noetel et al. 2024). Mechanism: raised BDNF and hippocampal neurogenesis, endorphins, reduced HPA-axis reactivity, better sleep, social contact."},
         {tone:"green", h:"😴 Sleep and CBT-I", html:"Sleep disturbance is both a symptom and a driver. CBT-I has stronger evidence than any hypnotic: fixed wake time, dark cool bedroom, no screens for an hour before bed, no daytime naps, bed for sleep and sex only, caffeine before noon. Refer to digital CBT-I where locally available, or Talking Therapies. See the <a href='insomnia.html'>insomnia protocol</a>."},
         {tone:"green", h:"🍺 Alcohol reduction", html:"Bring it inside the recommended limits — under 14 units a week (&lt;14 units) spread over 3 or more days. AUDIT-C at every depression review, then a brief motivational intervention (FRAMES: Feedback, Responsibility, Advice, Menu, Empathy, Self-efficacy). Refer to the community alcohol team if AUDIT is over 15 or there is dependence. In heavy-drinking men this is often the single most effective intervention available."},
         {tone:"green", h:"📋 Behavioural activation", html:"Identify activities that used to give pleasure or achievement and schedule them systematically, starting small — it breaks the inactivity-worsening-mood cycle and works as well as CBT in mild-to-moderate illness. Deliverable by a non-specialist, self-directed with a workbook, or formally in Talking Therapies. Particularly effective where anhedonia and lost motivation are the barrier."},
         {tone:"green", h:"🤝 Social connection", html:"Loneliness is a risk factor for depression and poorer treatment response. Prescribe it: community activities, volunteering, walking groups, faith communities, befriending, Men in Sheds. Ask the ONS question — “How often do you feel lonely?” — and refer if the answer is always or often."},
         {tone:"green", h:"🧘 Mindfulness and MBCT", html:"MBCT is a relapse-prevention option in NICE NG222 (2022, updated December 2025) for people at higher risk of relapse, with its trial evidence in patients with 3 or more previous episodes — an 8-week group programme. Apps are an introduction, not the programme."},
         {tone:"green", h:"🥗 Diet and correcting deficiency", html:"<b>A Mediterranean-pattern diet — <b>olive oil, fish, vegetables, legumes and wholegrains</b> — is associated with lower depression risk. Correct B12, folate, zinc and vitamin D deficiency — all are associated with poorer antidepressant response. Advise against skipping meals — hypoglycaemia worsens low mood and irritability.</b>"},
         {tone:"green", h:"💡 Light therapy for seasonal depression", html:"10,000 lux for 30 minutes each morning immediately after waking — first-line for seasonal affective disorder, (Lam 2006). Use a validated SAD light box, not a household lamp. Start in October before the usual onset and continue to April. Not for evening use — it can cause agitation, headache and insomnia."}
       ]}
     ]},

    {id:"choose", nav:"Choose the drug", title:"Match the antidepressant to the person — the table that does the work", sub:"Choose by previous response, preference, adverse effects, interactions, comorbidity, overdose toxicity, pregnancy and withdrawal profile — no single default for everyone. Verify every dose against the SPC/BNF.",
     blocks:[
       {b:"table", head:["The patient","Best pick","Why, and the dose"], rows:[
         ["<b>Many adults</b>","<b>Sertraline 50 → 200 mg</b>","A reasonable first-line SSRI — well tolerated, often preferred in cardiac disease and pregnancy, low QT risk. Start 50 mg OD (mornings, to reduce insomnia) with food; titrate to 100 mg at 4 weeks if the response is insufficient, then 150 and 200 mg; maximum 200 mg a day. Cipriani 2018 does not mean it must be chosen for everyone"],
         ["Poor sleep and poor appetite, with weight loss","<b>Mirtazapine 15 → 45 mg nocte</b>","Sedation and appetite gain become the treatment; it also spares sexual function and has a good discontinuation profile. The paradox: MORE sedating at 15 mg than at 30–45 mg, because noradrenergic activation higher up offsets the antihistamine effect. <b>Avoid where obesity is already a problem</b>"],
         ["Comorbid anxiety dominant","Sertraline, or escitalopram 10 mg OD → 20 mg","Start at half dose for the first week — early agitation is what makes anxious patients quit. Sertraline is also first-line across the anxiety disorders, panic, social anxiety, OCD and PTSD. Propranolol is not routinely added (asthma, bradycardia, hypotension, overdose risk). Benzodiazepines: if ever, exceptional, time-limited and carefully risk-assessed"],
         ["Post-MI or cardiac disease","<b>Sertraline</b>","The evidence-based choice post-MI. Avoid citalopram and escitalopram where there is QT risk; avoid tricyclics"],
         ["On an NSAID or aspirin","Any SSRI — <b>and consider adding a PPI</b>","SSRIs impair platelet serotonin; the NG222 PPI recommendation is specifically for the SSRI-plus-NSAID combination"],
         ["On a DOAC or warfarin","Prefer a lower-bleeding-risk option (<b>mirtazapine</b>), or an SSRI with counselling","Discuss the added bleeding risk — but there is no rule that every SSRI plus anticoagulant needs a PPI. Decide case by case (add gastroprotection if there is also an NSAID, dyspepsia, ulcer history or other GI risk) and monitor the INR more closely on warfarin"],
         ["Elderly","Sertraline; <b>baseline sodium, recheck after starting (commonly within 1–2 weeks)</b>","Hyponatraemia risk, worse with diuretics; falls counselling; citalopram maximum 20 mg at 65 and over; escitalopram generally 10 mg in older adults (SPC)"],
         ["<b>Aged 18–25, or ANY increased suicide risk at any age</b>","Choose as for any other adult — usually sertraline","<b>Review at 1 week.</b> NG222's one-week review applies to people <b>aged 18 to 25 inclusive</b> (not “under 25” or “&lt;25”) and to anyone at increased risk of suicide, then regularly. NG222 does not name fluoxetine as preferred for this age group — that is the under-18 (CAMHS) rule. Then review at least every 2–4 weeks for the first 3 months"],
         ["Sexual dysfunction already an issue","Mirtazapine (or vortioxetine or agomelatine later)","Sexual dysfunction is common with SSRIs and SNRIs — ask proactively, because patients often do not volunteer it"],
         ["Coexisting chronic or neuropathic pain","<b>Duloxetine 30 mg OD for 2 weeks, then 60 mg OD</b>","One drug, two jobs — and simpler than an SSRI plus pregabalin or amitriptyline. Licensed for depression, diabetic neuropathic pain, fibromyalgia and stress incontinence. <b>Monitor BP; check renal and hepatic contraindications. Taper slowly.</b> Amitriptyline 10–25 mg nocte is an adjunct for sleep and pain — it is NOT an antidepressant dose"],
         ["Insomnia-predominant, older, anxious","Mirtazapine 15 mg nocte","Its receptor profile (H1 sedation and appetite, alpha-2 blockade raising noradrenaline and serotonin, 5-HT2 and 5-HT3 blockade reducing anxiety and nausea) suits the phenotype that does badly on an activating SSRI"],
         ["Pregnancy or breastfeeding","<b>Sertraline</b> (most data in both; low placental transfer and low milk levels). Fluoxetine is a well-evidenced alternative in pregnancy but not a first choice to start when breastfeeding (long-acting active metabolite gives higher infant levels \u2014 SPS)","Do not stop an effective drug abruptly because of a pregnancy, and do not switch a woman who is stable on an antidepressant solely because she is breastfeeding \u2014 monitor the infant. Paroxetine has specific considerations — decide with perinatal psychiatry/obstetric advice rather than switching an effective drug solely because of pregnancy (UKTIS, CG192). SNRIs carry a self-limiting neonatal adaptation syndrome — tremor, jitteriness, feeding difficulty. Untreated severe depression carries greater risk to mother and baby than treated depression. Joint decision with the perinatal team (NICE CG192)"],
         ["Stopped before because of withdrawal","Fluoxetine 20 mg (long half-life, effectively self-tapering)","Or plan the slow taper from day one and use a liquid preparation"]
       ]},
       {b:"warn", html:"<b>Counsel at initiation — the four sentences that prevent abandonment:</b> (1) “It takes 2 to 4 weeks to start working, and 4 to 8 for the full effect — don't judge it at day 5.” (2) “The first week can bring nausea or feeling wired; you may feel slightly worse before you feel better, and that fades.” (3) “It's not addictive, but we stop it slowly, together.” (4) “If your mood dips further or you have thoughts of harming yourself, contact us straight away — don't wait for the review.” Book the review before they leave: 1 week if aged 18–25 or at increased suicide risk, otherwise 2 weeks; then every 2–4 weeks for 3 months. Give an interim contact number."}
     ]},

    {id:"clock", nav:"Response clock", title:"The response clock — optimise, switch, then combine", sub:"Serial switching without the checks below is just serial under-treatment.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1", title:"Judge at 4 weeks — 6–8 if partial", when:"the clock", fromLabel:"start here",
          html:"Repeat the PHQ-9 for early response. Partial response → optimise and reassess at 6–8 weeks (or by severity). No meaningful response → first check adherence, dose, alcohol/substances, diagnosis and therapy access before switching."},
         {step:"2", title:"Optimise the dose", when:"partial response", fromLabel:"before any switch",
          html:"Sertraline 50 → 100 → 150 → 200 mg · escitalopram 10 → 20 mg · mirtazapine 15 → 30 → 45 mg. Meaningful gains often appear one step up — <b>go to the maximum tolerated dose before declaring failure</b>."},
         {step:"3", title:"Switch — with the right mechanics", when:"no or insufficient response at an adequate dose", fromLabel:"4 weeks at an adequate dose",
          html:"Mechanics vary by drug, dose and duration — check a switching resource (SPS or Maudsley) for the specific pair rather than applying one rule. Broadly: <b>SSRI → SSRI</b> at low dose is often a direct swap, but taper first from higher doses or if withdrawal-prone (sertraline → escitalopram, or the reverse, gives a different receptor profile). <b>SSRI → mirtazapine:</b> usually a cross-taper. <b>SSRI → venlafaxine MR 75 → 375 mg</b> (commonly 150 mg; more noradrenergic higher up, and better for severe depression): withdraw or cross-taper cautiously and <b>monitor BP</b>. <b>Fluoxetine → anything:</b> the long half-life self-tapers, so start the new drug low and go slowly. <b>Anything → MAOI:</b> specialist only, with a washout. <b>Never two serotonergics at full dose together.</b>"},
         {step:"4", title:"Two adequate trials failed", when:"treatment-resistant depression", fromLabel:"the referral threshold",
          html:"TRD means failure of two agents at an adequate dose and duration → refer or seek advice. Specialist options: augmentation with lithium (most evidence), aripiprazole, or quetiapine 50–150 mg nocte (licensed add-on as quetiapine XL; NICE NG222 lists antipsychotic augmentation), T3 thyroid augmentation, vortioxetine, combination therapy, ECT, or esketamine. Meanwhile: is therapy actually on board? has the alcohol really been addressed? has the diagnosis been revisited — bipolar II, ADHD, PTSD, undisclosed trauma, personality-level difficulties?"}
       ]},
       {b:"kv", rows:[
         ["What an adequate trial actually is","The right drug at a therapeutic dose, genuinely taken, for at least 4 weeks — below that you cannot assess response at all. Check the pharmacy record and have the honest conversation before you conclude a drug has failed"],
         ["Chase the therapy referral","Drug plus therapy beats drug alone in moderate-to-severe depression — so “no response” with an unstarted Talking Therapies referral is not a drug failure"]
       ]}
     ]},

    {id:"side", nav:"Side effects", title:"Fix the side effect, keep the treatment alive", sub:"Most “failed” antidepressants were abandoned in week one for something manageable.",
     blocks:[
       {b:"table", head:["Side effect","Typical culprit","Fix"], rows:[
         ["Nausea and GI upset in week 1","Any SSRI or SNRI","Take it with food; usually gone by week 2 — pre-warned patients tolerate it"],
         ["Early agitation or feeling wired (activation)","SSRIs, fluoxetine especially","Half-dose start, morning dosing, propranolol only after weighing asthma, bradycardia, hypotension and overdose risk — and review the risk. Remember the 1-week review duty at 18–25 or at any increased suicide risk"],
         ["Sexual dysfunction that persists","All SSRIs and SNRIs","ASK at review — it is common — reduced libido, delayed orgasm, anorgasmia, erectile dysfunction — and patients often do not volunteer it. Dose-reduce, switch to mirtazapine, vortioxetine, agomelatine or bupropion (off-label in the UK), or treat it (sildenafil in men). The silent quit-driver"],
         ["Weight gain","Mirtazapine much more than SSRIs","<b>Name it upfront; diet and activity support; switch if unacceptable</b>"],
         ["Sedation","Mirtazapine, trazodone","Night dosing; often the desired effect — or increase mirtazapine, which is less sedating higher up"],
         ["<b>Hyponatraemia</b> (confusion, cramps, falls)","All serotonergics; worst in the elderly on diuretics","Risk-based monitoring (baseline and after starting in higher-risk patients). Below 130 mmol/L → prompt clinical review; severe or symptomatic → emergency. Mirtazapine is least implicated"],
         ["Bleeding and bruising","SSRIs, especially with an NSAID or anticoagulant","Consider a PPI where an NSAID or another GI risk factor is involved; otherwise weigh a switch of class (mirtazapine) — individualised, not automatic"],
         ["Sweating","Venlafaxine, sertraline","Dose timing; usually tolerable once explained"],
         ["<b>QT concerns</b>","Citalopram and escitalopram","Respect the caps: citalopram 40 mg, halved to 20 mg at 65 and over; escitalopram 20 mg (generally 10 mg in older adults). Particular caution with QT prolongation, cardiac disease, electrolyte disturbance and interacting drugs — ECG and current SPC; consider sertraline instead"],
         ["Raised BP","Venlafaxine, duloxetine","Check BP at each titration step and at review — the noradrenergic effect is dose-related"]
       ]},
       {b:"warn", html:"<b>Serotonin syndrome</b> — agitation with sweating, tremor or clonus and fever, after a dose rise or a new serotonergic drug (tramadol, St John's Wort, MAOIs, linezolid, MDMA; triptans are not an automatic contraindication — counsel): stop the drugs and arrange same-day assessment; with fever and rigidity, 999. And a new “high” on antidepressant monotherapy is a bipolar diagnosis, not a good response — stop and refer."}
     ]},

    {id:"duration", nav:"Continue & stop", title:"Continuation, relapse prevention — and stopping properly", sub:"Stopping at “feeling better” is the commonest cause of relapse in primary care. Stopping too fast is the commonest cause of a bad experience.",
     blocks:[
       {b:"table", head:["Phase","How long","Notes"], rows:[
         ["<b>First episode</b>","<b>At least 6 months (≥6 months) after remission</b>, at the dose that worked","Remission is a clinical judgement of recovery and function, supported by the PHQ-9. Say it at the first prescription: “once you start to feel better, the tablet carries on for at least another 6 months” — and write the plan in the record"],
         ["<b>Recurrent, severe, or residual symptoms</b>","<b>Longer — often 2 years or more</b>, individualised","Consider longer treatment for recurrent depression, residual symptoms, severe episodes, psychosocial risk or prior relapse on stopping; review relapse-prevention medication at least every 6 months (NG222). Add relapse-prevention psychology: <b>MBCT has the best evidence</b>"],
         ["Relapse signature","Write it down with the patient","Their personal early-warning signs and the action plan that goes with them"],
         ["<b>Stopping — the NG222 and RCPsych rules</b>","Staged, PROPORTIONATE reductions agreed with the patient — smaller as the dose falls (hyperbolic tapering, e.g. about 10% of the current dose, is one example, not a mandated regimen), using liquid preparations at low doses. <b>No alternate-day dosing for most short half-life drugs</b> (fluoxetine excepted). <b>Next step only when the last one is comfortable</b>","NOT “take one every other day for a fortnight”. Use liquid preparations or split tablets at the bottom end, and give a written tapering plan. Paroxetine and venlafaxine are the withdrawal-heavy ones; fluoxetine largely self-tapers. Review at 4 and 8 weeks of the taper, and keep a crisis plan in place during it"],
         ["<b>Withdrawal versus relapse</b>","The distinction that decides the next move","Withdrawal: usually within days of a cut (it can persist weeks or months), physical — dizziness, “electric shocks”, nausea, imbalance, insomnia, hyperarousal (the FINISH pattern) — and it settles when the dose is restored. Relapse: usually later (sometimes sooner), and the old mood symptoms return. Severe withdrawal → restart the previous effective dose and taper more slowly. Relapse during a taper → restart the previous effective dose immediately"],
         ["The decision to stop is a consultation","Not a request granted at the desk","Confirm stable remission (at least 6 months, or ≥24 months if recurrent), then make it a structured shared decision with a written plan"]
       ]},
       {b:"why", html:"Two numbers explain most of the trouble here. Many patients stop within the first months — before a fair trial — often expecting an antibiotic-style course. And withdrawal was long underestimated (<strong>Davies and Read 2019</strong>). Warning people in advance, and tapering hyperbolically, is what turns both figures around."},
       {b:"say", html:"You're feeling well BECAUSE of the tablet, not despite it — like a cast on a healing bone, it stays on a while after the pain has stopped. When we do stop, we'll go down in small steps at your pace; some people notice dizziness or electric-shock feelings if we go too fast, and that just means we slow down — it isn't the depression coming back."}
     ]},

    {id:"special", nav:"Special groups", title:"Special groups — where the rules change", sub:"Five groups where the standard plan needs adjusting rather than repeating.",
     blocks:[
       {b:"kv", rows:[
         ["Pregnancy and breastfeeding","Sertraline has the best data in both. Fluoxetine is the other well-evidenced choice in pregnancy, but not a first choice to start when breastfeeding \u2014 its long-acting active metabolite gives higher infant levels (SPS); a woman already stable on it need not switch, with infant monitoring. Paroxetine has specific considerations — decide with perinatal advice. Do not stop an effective antidepressant abruptly for a pregnancy — untreated severe depression is the bigger risk. Moderate or worse illness, or any risk, goes to the perinatal mental-health team (NICE CG192), and existing treatment deserves a preconception conversation"],
         ["Postnatal","Postnatal depression affects 10–15% of UK mothers. Use the EPDS at the 6-week postnatal check and again at 3–4 months; a high score prompts assessment (a screen, not a referral threshold); suicidal ideation, psychosis, severe impairment or infant-safety concerns → urgent assessment via the local perinatal pathway. Confusion, hallucinations or rapidly shifting mood at any point postpartum → same-day psychiatric assessment (mother-and-baby service). See the <a href='postnatal-depression.html'>postnatal depression protocol</a>"],
         ["Aged 18–25","Choose the drug as for any adult, but review at 1 week and stay close for the first fortnight — activation can increase risk before the mood lifts (the MHRA's 2004 warning, strongest under 30). NG222 does not prefer fluoxetine in this group"],
         ["Under 18s (&lt;18)","CAMHS pathway — fluoxetine is the only first-line antidepressant, and always alongside psychological therapy. Do not initiate in primary care"],
         ["Older adults","Sertraline, with a baseline sodium rechecked after starting (commonly within 1–2 weeks); citalopram capped at 20 mg from 65; falls counselling; watch the anticholinergic burden and the interaction list. Consider dementia and physical illness in the differential rather than assuming primary depression"],
         ["Long-term antidepressant users","An annual structured medication review (NG222): weight (mirtazapine, quetiapine), BP and pulse (venlafaxine, duloxetine), sodium (annual U&amp;E at ≥65 or on a diuretic), sexual function asked about directly, adherence, and whether the indication still stands. Consider a DEXA in patients on an SSRI for 5 years or more who are post-menopausal or male and ≥70"]
       ]}
     ]},

    {id:"monitor", nav:"Monitor", title:"The review schedule — and what to check at each one", sub:"Fixed intervals, a repeated score, and a re-asked risk question.",
     blocks:[
       {b:"table", head:["When","What to check","Action"], rows:[
         ["<b>1 week</b> (aged 18–25, or any increased suicide risk)","<b>Tolerability, activation, suicidal ideation, adherence</b>","<b>A duty, not a courtesy. Then review regularly</b>"],
         ["<b>2 weeks</b> (everyone else, after starting)","Nausea, headache, insomnia, agitation, sexual dysfunction; suicidal ideation; early discontinuation; PHQ-9 as the comparator","Side effects intolerable → adjust the dose or switch. Remind them: 2–4 weeks for the first effect, 4–8 for the full effect"],
         ["<b>4–6 weeks</b>","PHQ-9 early response (≥50% reduction is a useful marker)","Partial → optimise and reassess at 6–8 weeks. No meaningful response → check adherence, dose, alcohol, diagnosis and therapy access, then switch. Therapy not started → chase the referral or find the barrier. Re-check alcohol, housing and money"],
         ["<b>Every 2–4 weeks to 3 months</b>","Symptoms, risk, adherence, side effects","The first 3 months is when treatment is abandoned — this is the interval that prevents it"],
         ["<b>3 months</b>","<b>In remission (clinical recovery, supported by PHQ-9)?</b>","Yes → agree the continuation plan (at least 6 months from remission, longer if recurrent). No → dose adequate? adherence confirmed? alcohol? therapy started? Consider psychiatry if a second trial is failing. Record functional recovery, not just the score"],
         ["<b>Annually, long-term</b>","<b>Weight, BP and pulse, sodium, sexual function, bone health, indication</b>","<b>A structured NG222 medication review — deprescribing is part of it</b>"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"red", h:"🔴 Crisis — say it, write it, repeat it", html:"“If you feel unsafe: <b>999 or A&amp;E now; NHS 111 option 2; Samaritans 116 123</b> — any hour. Save these in your phone now, while we're together.”"},
         {tone:"red", h:"⚠️ The first fortnight", html:"“If you feel more agitated, or have new thoughts of harming yourself in the first weeks — <b>contact us the same day</b>. It's a known effect and we act on it.”"},
         {tone:"amber", h:"💊 Never stop dead", html:"“If you run out or stop suddenly you may feel dizzy, sick, or have electric-shock sensations — <b>always come to us to plan it</b>.”"},
         {tone:"cream", h:"🌡️ Mixing", html:"“Check with a pharmacist before adding anything new — <b>including St John's Wort and strong painkillers</b>.”"}
       ]},
       {b:"warn", html:"<b>Same-day GP contact, not routine:</b> significantly increased agitation, new suicidal thoughts or severe insomnia in the first 2 weeks of an SSRI (<b>activation syndrome</b>); symptoms of hyponatraemia — confusion, nausea, headache — in an older patient recently started; a request for an emergency supply after running out; and <b>any new manic symptoms on antidepressant monotherapy</b>."}
     ]},

    {id:"loop", nav:"Not responding?", title:"Not responding? Run this before the next switch", sub:"Six checks. Most “treatment-resistant” depression fails one of them.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"1 · Adequate trial?", html:"<b>Right dose, actually taken, for a genuine 4 weeks?</b> Pharmacy record plus an honest conversation."},
         {tone:"amber", h:"2 · Alcohol and substances", html:"<b>AUDIT-C again — the commonest hidden reason nothing works.</b>"},
         {tone:"amber", h:"3 · Diagnosis drift", html:"Bipolar II (re-screen), ADHD, PTSD or trauma, perimenopause, hypothyroidism, OSA, anaemia."},
         {tone:"amber", h:"4 · Life drivers", html:"Abuse, debt, housing, carer load — no tablet outruns an unaddressed cause."},
         {tone:"amber", h:"5 · Therapy actually on board?", html:"Drug plus therapy beats drug alone in moderate-to-severe depression — has the referral happened, and did they get in?"},
         {tone:"amber", h:"6 · Physical illness", html:"New or undertreated pain, inflammation, or malignancy in the older patient with somatic features."}
       ]},
       {b:"why", html:"<b>All six checked → switch with the right mechanics, or refer.</b> Two adequate trials failed is the threshold for specialist input, not the moment to try a third agent alone."}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — who, and how fast", sub:"Two of these are today; one is the cancer pathway hiding behind “low mood and tiredness”.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999 / crisis team, same day", html:"Active suicidal ideation with plan and intent. Any overdose → 999/A&amp;E (toxicity). A recent attempt → urgent assessment matched to risk, 999 if immediate danger. Postpartum psychosis → same-day psychiatric assessment, usually via a mother-and-baby service (999 if immediate danger). Psychotic depression, especially with command hallucinations. Severe self-neglect — not eating, drinking or self-caring. A parent expressing thoughts of harming their children."},
         {tone:"amber", h:"Same-day mental health assessment", html:"High suicide risk without immediate intent — passive ideation with a formed plan, a previous attempt, alcohol use, isolation. Phone the crisis team; many areas run a 24-hour line (NHS 111 option 2). Document the decision and the risk rationale."},
         {tone:"blue", h:"Urgent psychiatry — 1 to 2 weeks", html:"More severe depression not responding after optimisation and the checks above (urgency by severity, risk, impairment and local pathway) · suspected bipolar disorder (clinical suspicion; a positive MDQ needs clinical assessment) · psychotic features · severe recurrent depression · treatment-resistant depression after two adequate trials · depression with significant substance misuse needing dual-diagnosis management."},
         {tone:"blue", h:"NHS Talking Therapies and primary-care therapies", html:"Mild-to-moderate depression (PHQ-9 5–15): self-referral or GP referral. Step 2 — psychoeducation, guided self-help, digital CBT. Step 3 — CBT of 16–20 sessions, behavioural activation, counselling. Also available locally: problem-solving therapy for socially precipitated depression, counselling in bereavement and adjustment, and MBCT for relapse prevention after 3 or more episodes."},
         {tone:"blue", h:"Perinatal, CAMHS and the complex", html:"Moderate or worse illness in pregnancy or postnatally, or any risk → perinatal mental-health team (low threshold; also preconception planning on existing treatment). Under-18s → CAMHS, fluoxetine only and with therapy. Comorbid eating disorder, substance dependence or emerging personality-level difficulties → specialist services."},
         {tone:"purple", h:"NG12 — stated honestly <span class='tw'>Suspected cancer</span>", html:"Depression has no NICE NG12 criterion of its own, and this page does not invent one. But two routes sit inside the commonest depression consultation and must not be lost to the label:<br>• <b>Unexplained weight loss:</b> in a patient aged 60 and over with weight loss plus any of diarrhoea, back pain, abdominal pain, nausea, vomiting, constipation or new-onset diabetes → <b>urgent direct-access CT within 2 weeks for pancreatic cancer</b>; and unexplained weight loss with other features in older patients earns urgent investigation rather than an antidepressant and a follow-up.<br>• <b>Unexplained iron-deficiency anaemia</b> found on testing → investigate according to the relevant NICE NG12 site-specific criteria and the local lower-GI cancer pathway; FIT is not a substitute for clinical assessment in iron-deficiency anaemia. Do not delay cancer investigation by attributing symptoms to depression.<br>• Fatigue, weight loss and low mood in an older patient are a work-up, not a diagnosis.", src:"NICE NG12 (updated April 2026) · house rule"},
         {tone:"cream", h:"Social prescribing — and what primary care keeps", html:"Refer directly to your PCN link worker for loneliness, debt, housing, work and carer load. We keep: risk assessment at every contact, the score, the mimic screen, drug choice and titration, side-effect management, the continuation clock, the taper, and the annual review. Psychiatry owns augmentation, ECT, esketamine and the bipolar diagnosis."}
       ]},
       {b:"say", html:"We've had two fair rounds of treatment and you're still fighting hard for not enough reward — that tells me you need the options only the specialist team can add, not that you've failed at this. We keep going here alongside them, and the crisis numbers stay in your phone meanwhile."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 23-year-old man attends having felt “flat and pointless” for 3 months. He is sleeping badly, has stopped football, is drinking 6 to 8 cans most evenings, and his PHQ-9 is 17 with a GAD-7 of 12. He asks for “something to sort it out quickly”. His mother had bipolar disorder. He has no plan, but has thought life is not worth living."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Asks about suicidal thoughts, plan, intent and means directly, and documents it — and does not stop at “no plan”. <b>Screens for past mania before prescribing</b>, given the family history, and knows an SSRI alone could precipitate mania. Scores <b>PHQ-9 and GAD-7</b> and places him in the <b>more severe</b> group, so offers <b>an antidepressant plus high-intensity therapy</b> rather than either alone. <b>Names the alcohol as a cause and not just a consequence</b>, with AUDIT-C and a brief intervention, and explains that mood rarely lifts while drinking at that level. Chooses <b>sertraline 50 mg</b> with the <b>1-week review because he is aged 18–25</b>, counsels on the 2–4-week delay, early activation and the same-day contact rule, and does not offer fluoxetine on the mistaken “under-25” rule. Chooses tests by indication rather than a universal panel. Gives the crisis numbers and saves them in his phone. <br><br><a href='../../cases/depression.html'>Open the full casebook chapter →</a>"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG222 — Depression in adults: treatment and management (2022, updated December 2025)</b><br><a href="https://www.nice.org.uk/guidance/ng222" rel="noopener">nice.org.uk/guidance/ng222</a><span class="rd"> — the less severe / more severe fork, the least-intrusive-first option list with medication last in less severe depression, combination treatment in more severe depression, exercise and social prescribing as treatments, the review intervals including the one-week review at 18–25 and at increased suicide risk, the continuation periods, and proportionate stepwise withdrawal</span></li>'+
         '<li><b>NICE CG192 — Antenatal and postnatal mental health (2014, updated 2020)</b><span class="rd"> — perinatal referral thresholds, drug choice in pregnancy and breastfeeding, and postpartum psychosis as an emergency</span></li>'+
         '<li><b>NICE CG185 — Bipolar disorder: assessment and management</b><br><a href="https://www.nice.org.uk/guidance/cg185" rel="noopener">nice.org.uk/guidance/cg185</a><span class="rd"> — consider stopping antidepressant monotherapy if mania or hypomania develops; seek psychiatric advice rather than repeatedly switching</span></li>'+
         '<li><b>NICE NG222 (further-line treatment)</b><span class="rd"> — augmentation with a second-generation antipsychotic (e.g. aripiprazole, olanzapine, quetiapine, risperidone) or lithium</span></li>'+
         '<li><b>Cipriani et al., Lancet 2018</b><span class="rd"> — network meta-analysis of 522 trials and 116,000 patients; supports sertraline as a reasonable first-line choice on efficacy, tolerability and cost — not a universal default</span></li>'+
         '<li><b>Noetel et al., BMJ 2024</b><span class="rd"> — 218 RCTs and 14,170 participants; walking or jogging, yoga, strength training and mixed aerobic exercise as effective treatments</span></li>'+
         '<li><b>Davies &amp; Read 2019, and RCPsych tapering guidance</b><span class="rd"> — withdrawal reported by around 56% of users and severe in about 46%; hyperbolic tapering (e.g. roughly 10% of the current dose) as one example of proportionate reduction, not a mandated NICE regimen, and the FINISH pattern</span></li>'+
         '<li>Kroenke et al. 2001 (PHQ-9), Dazzi et al. 2014 (asking about suicide), Skovlund et al. 2016 (hormonal contraception and mood), Lam et al. 2006 (light therapy), Psaltopoulou et al. 2013 (Mediterranean diet)<span class="rd"> — the named figures used in the scoring, risk, mimic and non-drug sections</span></li>'+
         '<li><b>MHRA safety guidance and the BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — the 2004 warning on early suicidal thoughts and self-harm, the citalopram and escitalopram QT caps, and every dose on this page: verify before prescribing</span></li>'+
         '<li>NICE NG12 — Suspected cancer: recognition and referral (updated April 2026)<br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — the unexplained-weight-loss and iron-deficiency-anaemia routes that hide inside a low-mood consultation</span></li>'+
         '</ul></div>'}
