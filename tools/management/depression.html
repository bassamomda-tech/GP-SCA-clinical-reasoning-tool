MG.render({
  icon:"🧠",
  title:"Depression — the complete guide",
  eyebrow:"Protocol · diagnose, treat and stop properly",
  stemTitle:"Risk and bipolar before anything, then treat the whole cause — not just the serotonin",
  stemSub:"One page for the whole condition. Ask about suicide directly and document it; screen for past mania every time; score PHQ-9 and use the NG222 less-severe / more-severe fork; exclude the organic mimics before reaching for a prescription; prescribe the non-drug options with the same specificity as a drug; match the antidepressant to the patient in front of you; run the 2–4–6-week response clock; fix each side effect instead of abandoning ship; continue 6 months to 2 years after remission; and come off hyperbolically, not in a fortnight. NICE NG222 · CG192 · RCPsych.",

  nextReview:"9 March 2027",
  meta:[
    {t:"NICE NG222 (2022)"},
    {t:"Cipriani 2018 · Noetel 2024 · Davies & Read 2019"},

    {t:"v2.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:"<div class='mg-layers'><a href='#severe'><b>Risk first</b><small>Suicide · psychosis · bipolar</small></a><a href='#confirm'><b>Score it</b><small>PHQ-9 &lt;16 vs ≥16</small></a><a href='#choose'><b>Choose</b><small>By the patient, not the drug</small></a><a href='#duration'><b>Stop well</b><small>Hyperbolic taper</small></a></div>",
  quickSub:"If you read nothing else on this page, read these six cards. Every figure traces to the source cited under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Ask about suicide directly — and document what you asked", html:"Thoughts of death → plan → intent → means → protective factors. Asking does not plant the idea (Dazzi 2014 — no evidence that asking about suicidal thoughts increases them; the myth causes under-assessment). Plan plus intent = high risk → same-day crisis-team assessment, or 999 if in immediate danger; do not leave the patient alone; reduce access to means; involve family where consented. Psychotic depression, stupor or severe self-neglect is urgent psychiatry today."},
    {tone:"amber", h:"Screen for past mania before every antidepressant", html:"“Have you ever had a period of 4 or more days of feeling unusually high or wired, needing little sleep, spending or acting out of character?” An SSRI alone in unrecognised bipolar disorder can precipitate mania, a mixed state or rapid cycling — refer rather than switch. Screen formally with the MDQ: 13 items, ≥7 symptoms in the same period plus functional impairment = positive (73% sensitivity for bipolar I). Bipolar II is the one that hides as recurrent unipolar depression."},
    {tone:"blue", h:"PHQ-9 sets the fork — and less severe means the menu, not the pill", html:"PHQ-9 with functional impact: less severe (&lt;16) versus more severe (≥16) is NG222's treatment fork. Bands: 0–4 none · 5–9 mild · 10–14 moderate · 15–19 moderately severe · 20–27 severe. In less severe depression an antidepressant is at the BOTTOM of the option list — guided self-help, group exercise, group CBT or behavioural activation come first. In more severe depression an antidepressant PLUS psychological therapy beats either alone."},
    {tone:"green", h:"Exclude the mimics before you prescribe", html:"TSH, FBC with ferritin, B12 and folate, HbA1c, U&amp;E (a baseline sodium before an SSRI), LFTs — and an ECG before citalopram or escitalopram if aged 60 and over or cardiac history. <b>Hypothyroidism is the most commonly missed organic cause</b>, and alcohol is the commonest modifiable one — depression rarely lifts while someone is drinking heavily. Review the drug list too: beta-blockers, statins, corticosteroids, hormonal contraception, isotretinoin, finasteride, varenicline."},
    {tone:"purple", h:"The response clock: judge at 4 weeks, not at day 5", html:"2–4 weeks for the first effect, 4–8 weeks for the full effect. Some response at 4 weeks → optimise the dose and judge fully at 6–8 weeks. No response at 4 weeks on an adequate dose → move. Book the review before they leave: 1 week if aged 18–25 inclusive or at increased suicide risk, otherwise 2 weeks — then every 2–4 weeks for the first 3 months. Around <b>40–50% of patients stop within the first 3 months</b>, usually because nobody warned them."},
    {tone:"teal", h:"Continue 6 months after remission — then stop hyperbolically", html:"Continue at the dose that worked for at least 6 months after remission; ≥2 years if recurrent, severe or residual symptoms. Recurrence risk is <b>50% after one episode, 70% after two, 90% after three</b>. Stopping: slow, stepwise, PROPORTIONATE reductions — the RCPsych hyperbolic approach reduces by about 10% of the CURRENT dose every 2–4 weeks, with smaller absolute steps as the dose falls; liquids or split tablets at the bottom end. Not “one every other day for a fortnight”."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step comes before the prescription pad, every time.",
  pathway:[
    {title:"Risk, psychosis and bipolar — before anything else", html:"Ask directly about suicidal thoughts, plan, intent and means, and document it. Plan plus intent, psychotic features, stupor or severe self-neglect → same-day mental health assessment or 999. Any history of mania or hypomania → refer; do not start an antidepressant alone.", alert:true},
    {title:"Confirm the diagnosis and score the severity", html:"ICD-11 core symptoms for at least 2 weeks — persistent low mood, anhedonia, or both — plus the additional symptoms. Score PHQ-9 and GAD-7, record the functional impact, and use the less severe versus more severe fork. Adjustment disorder and normal grief are different animals with different management."},
    {title:"Exclude the mimics and take the baseline", html:"TSH, FBC with ferritin, B12 and folate, HbA1c, U&amp;E with a baseline sodium, LFTs. AUDIT-C for alcohol. Review every drug that lowers mood. ECG before citalopram or escitalopram in the older or cardiac patient."},
    {title:"Treat — the menu for less severe, drug plus therapy for more severe", html:"Less severe: guided self-help, structured group exercise, group CBT or behavioural activation first, with an antidepressant last on the list. More severe: an antidepressant plus high-intensity therapy, chosen by the patient in front of you. Prescribe the non-drug options with the same specificity as a drug."},
    {title:"Review on the clock, then continue and stop properly", html:"Review at 1 week if aged 18–25 or at increased risk, otherwise 2 weeks; then every 2–4 weeks for 3 months. Judge response at 4 weeks with a repeat PHQ-9, optimise, switch, then refer after two adequate trials. Continue 6 months after remission and taper hyperbolically."}
  ],
  sections:[
    {id:"severe", nav:"Risk & red flags", title:"Risk, psychosis, bipolar — the assessment that comes before the prescription", sub:"Everything else on this page can wait a week. These cannot.",
     blocks:[
       {b:"warn", html:"Ask every patient presenting with low mood directly about suicidal ideation. Asking does not increase risk — it reduces it. Document what you asked, what they said, the risk and protective factors you identified, and the decision you made: that record is a clinical and medicolegal necessity."},
       {b:"cards", cols:2, items:[
         {tone:"red", h:"999 / same-day crisis team", html:"Active suicidal ideation with a plan and intent → same-day crisis-team assessment, or 999 if in immediate danger. Do not leave the patient alone; contact a family member or carer with consent; remove or reduce access to means (medication stockpiles, firearms). Any recent suicide attempt or overdose → 999 or immediate A&amp;E. Self-harm within the last 24–48 hours → same-day mental health crisis assessment."},
         {tone:"red", h:"Psychotic depression", html:"Mood-congruent delusions (worthlessness, guilt, nihilism, poverty) or auditory hallucinations — especially commands to self-harm — carry the highest suicide risk of all. Urgent psychiatric assessment today. It does NOT respond to an antidepressant alone: it needs an antipsychotic plus an antidepressant, or ECT, under specialist care."},
         {tone:"amber", h:"Bipolar signal", html:"Elevated mood, racing thoughts, reduced need for sleep, grandiosity or reckless behaviour — preceding, following or alternating with the low mood. Prescribing an SSRI alone in unrecognised bipolar disorder can precipitate mania or rapid cycling. Screen with the MDQ or ask directly, and refer to psychiatry rather than starting an antidepressant without mood-stabiliser cover."},
         {tone:"amber", h:"Severe functional impairment", html:"Unable to eat, drink, maintain hygiene or care for children → urgent mental health assessment; consider voluntary or, if there is risk to self or others, involuntary admission under the MHA 1983. Document the functional assessment at every contact, and make a safeguarding referral where severe parental depression is impairing childcare."},
         {tone:"amber", h:"Perinatal — a different clock", html:"Low mood within 12 months of birth: postnatal depression, which affects 10–15% of UK mothers and is the most under-diagnosed condition in perinatal care. EPDS ≥13 signifies significant symptoms — refer urgently. Postpartum psychosis (first 2 weeks: confusion, hallucinations, agitation, rapidly shifting mood) → 999 and a mother-and-baby unit. Distinguish <b>baby blues (day 3–5, self-limiting)</b> from <b>PND (persisting beyond 2 weeks)</b> from <b>postpartum psychosis (early, severe, rapid onset)</b>. Assess baby safety in every case."},
         {tone:"cream", h:"What high risk actually changes today", html:"A crisis plan made today, not at the next appointment: crisis numbers saved in the patient's phone while you are together, weekly or fortnightly prescription quantities instead of a month, means reduced, a named person informed with consent, and a review interval measured in days."}
       ]},
       {b:"kv", rows:[
         ["Structured risk assessment — at every contact","Passive versus active ideation · plan · intent · means · previous attempts · alcohol and substance use · social support · protective factors (children, beliefs, future plans). Use the <b>C-SSRS</b> or an equivalent structured tool. “Low risk” is not a tick-box — record what was asked and what the patient said. Risk is dynamic: re-assess it every time"],
         ["Risk factors for completed suicide","Male sex, older age, social isolation, alcohol or substance use, a previous attempt, access to lethal means, chronic pain, terminal illness, recent bereavement or relationship breakdown"],
         ["Adverse childhood experiences","Patients with ≥4 ACEs have around a 4.5-fold increased risk of depression, dose-dependently. Identifying them changes the treatment (trauma-focused CBT, EMDR) and explains why standard SSRI-plus-CBT can disappoint in complex trauma"],
         ["Domestic abuse and coercive control","Ask, with a validated tool (DASH). Intimate partner violence and coercive control are among the strongest environmental drivers of depression in women — and no antidepressant outruns an unsafe home"]
       ]},
       {b:"why", html:"Direct questioning about suicide does not increase suicidal ideation — the evidence, including the <strong>Cochrane</strong>-indexed systematic review by <strong>Dazzi et al. 2014</strong>, is consistent. The belief that asking “plants the idea” is one of the most damaging misconceptions in practice, because it produces under-assessment. Asking inside a therapeutic relationship relieves distress, opens the conversation, and is itself the first step of risk reduction."}
     ]},

    {id:"confirm", nav:"Confirm & score", title:"Confirm it is depression, then score it", sub:"The diagnosis is clinical; the score is what makes the plan, tracks the response and proves the reasoning.",
     blocks:[
       {b:"kv", rows:[
         ["ICD-11 depressive episode","At least 2 weeks of: persistent low mood most of the day nearly every day, and/or markedly diminished interest or pleasure (anhedonia) — plus additional symptoms from: weight or appetite change, sleep disturbance (insomnia or hypersomnia), psychomotor agitation or retardation, fatigue, worthlessness or excessive guilt, poor concentration, recurrent thoughts of death or suicidal ideation. Mild = 2 core + 2 additional · moderate = 2 core + 3–4 · severe = 2 core + 5 or more"],
         ["PHQ-2 as the gateway","Two questions over the past 2 weeks — little interest or pleasure in doing things, and feeling down, depressed or hopeless — each scored 0–3. A PHQ-2 score ≥3 means go on to the PHQ-9 (sensitivity 83%, specificity 90%). The efficient screen inside a long-term-condition or multimorbidity review"],
         ["PHQ-9 scoring","9 items scored 0–3 (not at all · several days · more than half the days · nearly every day), total 0–27. Severity: 0–4 none or minimal · 5–9 mild · 10–14 moderate · 15–19 moderately severe · 20–27 severe. The last item scores functional impairment — the question that actually decides management. Record the total and the date at every consultation: it is the primary outcome measure"],
         ["The NG222 fork","PHQ-9 with functional impact splits care into less severe (&lt;16) and more severe (≥16) — the single decision that determines whether an antidepressant is at the bottom or the top of the option list"],
         ["What counts as response","Responder = a reduction of at least 50% in the PHQ-9 score; a 5-point drop is a clinically meaningful change; remission = PHQ-9 &lt;5, and a score under 10 at 8–12 weeks is the practical remission marker used for the continuation clock"],
         ["GAD-7 alongside, every time","Score anxiety concurrently — 50% of depressed patients have a comorbid anxiety disorder, and GAD-7 ≥10 is moderate-to-severe anxiety. Treat the depression first (SSRIs are first-line for both), but if severe anxiety is clearly the primary driver, treat it as the primary diagnosis — see the <a href='anxiety.html'>anxiety protocol</a>. Document both scores"],
         ["Adjustment disorder versus depression (DSM-5)","Adjustment disorder with depressed mood is a proportionate reaction to an identifiable stressor that resolves as the stressor resolves; it is managed with psychological support and structured watchful waiting. The stressor does not decide the diagnosis — the symptom severity, duration and impairment do. A full depressive episode needs treating whether or not something obvious precipitated it"]
       ]},
       {b:"why", html:"The PHQ-9 earns its place not in the initial labelling — which you could do clinically — but in <strong>serial measurement</strong>. NG222 asks for a validated outcome tool at every contact rather than clinical impression alone, and a documented score at each escalation point is the clearest possible record of why you did what you did, and when."}
     ]},

    {id:"differential", nav:"Mimics", title:"Exclude the organic causes — several are reversible", sub:"Missing these means years of partial response on an antidepressant while the real cause runs on.",
     blocks:[
       {b:"table", head:["Cause","What it looks like","What to do"], rows:[
         ["<b>Hypothyroidism</b>","<b>The most important and most commonly missed organic cause.</b> Low mood with fatigue, weight gain, cold intolerance, constipation, bradycardia, dry skin","TSH alone is sufficient to screen. Subclinical (raised TSH, normal free T4): treat if TSH &gt;10 mU/L, or if symptomatic with TSH 4–10 mU/L. Overt hypothyroidism: levothyroxine — treat the thyroid, not the depression; mood resolves in most patients on adequate replacement (see the <a href='hypothyroidism.html'>hypothyroidism protocol</a>)"],
         ["<b>Anaemia and deficiency</b>","Fatigue, low mood, poor concentration and cognitive slowing that mimics depression closely","FBC, ferritin, B12 and folate. Iron deficiency can precede anaemia — ferritin &lt;30 µg/L is iron deficiency (ferrous sulphate 200 mg TDS). B12 deficiency: IM hydroxocobalamin loading (6 doses over 2 weeks) if neurological features or malabsorption; oral cyanocobalamin 50–150 micrograms OD for dietary deficiency alone"],
         ["<b>Diabetes and hyperglycaemia</b>","Low mood, cognitive dulling, fatigue","Type 2 diabetes roughly doubles the risk of depression, and hyperglycaemia itself lowers mood. HbA1c is mandatory in unexplained low mood. The relationship is bidirectional — each worsens the other, and glycaemic control improves mood"],
         ["<b>Alcohol and substances</b>","The commonest modifiable cause of persistent depression in primary care","AUDIT-C, then units per week and the pattern of use (CAGE questions if useful). Alcohol is a CNS depressant and works through several routes at once — neurochemistry, sleep, social consequences, nutrition and thiamine depletion. Regular cannabis use is causally associated with depression and anxiety (Mendelian randomisation), and benzodiazepine or opioid dependence also lowers mood"],
         ["<b>Drug-induced low mood</b>","Temporal link to starting or changing a drug","Beta-blockers (atenolol especially; less lipophilic agents such as bisoprolol may be better tolerated) · statins (low mood in 5–10% — switch statin or consider a statin holiday) · corticosteroids (acute high dose euphoric, chronic use depressive) · hormonal contraception, particularly in women with prior depressive episodes · isotretinoin · finasteride · varenicline · propranolol. A medication review is mandatory, not optional"],
         ["<b>Chronic physical illness</b>","Comorbid depression, not “understandable sadness”","Prevalence of low mood: chronic pain 50%, heart failure 20–40%, COPD 20–50%, cancer 20–30%, Parkinson's disease 40%, multiple sclerosis 50%, post-stroke 30–40%, chronic kidney disease 20–40%, rheumatoid arthritis 20%. Treat it to target with the same rigour as primary depression"],
         ["<b>Grief and bereavement</b>","Sadness, tearfulness, preoccupation with the deceased, poor appetite and sleep","Normal grief does not routinely need an antidepressant — watchful waiting, Cruse Bereavement Support, the Good Grief Trust. Prolonged grief disorder (ICD-11): persistent disabling grief beyond 6–12 months with failure to return to functioning → specialist psychological therapy. Depression can co-exist with grief — treat it if PHQ-9 ≥10 persists with functional impairment"],
         ["<b>The rest of the list</b>","Easy to miss in a 10-minute appointment","Obstructive sleep apnoea (see <a href='osa.html'>OSA</a>) · perimenopause, where the HRT conversation may matter more than the SSRI (see <a href='menopause.html'>menopause</a>) · vitamin D deficiency · undiagnosed ADHD, PTSD or autism · dementia presenting as apathy in the older patient"]
       ]},
       {b:"why", html:"Two figures worth carrying: <strong>hormonal contraception</strong> was associated with a <strong>20–40% increased risk of a first antidepressant prescription or depression diagnosis</strong> in a Danish cohort of around a million women (<strong>Skovlund et al. 2016</strong>), highest with progestogen-only methods — so review the method when the mood change tracks a contraceptive change. And heavy drinkers who cut down often improve dramatically within weeks with no antidepressant at all, whereas treating depression with an SSRI while the drinking continues works poorly and raises impulsivity and suicide risk."}
     ]},

    {id:"workup", nav:"Work-up", title:"The baseline panel, the subtype question, and the NG12 slot", sub:"A short, defined panel — plus two questions that change the treatment.",
     blocks:[
       {b:"cards", items:[
         {tone:"plain", h:"Baseline bloods and tests", html:"TSH (TFTs) · FBC with ferritin, B12 and folate · HbA1c · U&amp;E and eGFR (a baseline sodium is essential before an SSRI, especially over 65 or on a diuretic) · LFTs (alcohol, and hepatic impairment changes drug handling) · ECG before citalopram or escitalopram if aged 60 and over (≥60), or with cardiac history or other QT-prolonging drugs."},
         {tone:"plain", h:"Social history is a clinical investigation here", html:"Housing · employment and money worries · relationship quality · caring responsibilities · adverse childhood experiences · recent losses and transitions · loneliness (“How often do you feel lonely?”) · domestic abuse screen. These decide whether the answer is a tablet, a link worker, or both."},
         {tone:"plain", h:"Ask the subtype question", html:"Seasonal — recurrent winter onset with spring remission → light therapy plus an SSRI. Atypical — mood reactivity, hypersomnia, hyperphagia, leaden paralysis, rejection sensitivity → an SSRI is reasonable. Melancholic — profound anhedonia, worse in the morning, early-morning wakening → antidepressant plus structured therapy. Psychotic — see the red-flag section."},
         {tone:"purple", h:"NG12 slot — stated honestly", html:"Depression has <b>no NICE NG12 criterion of its own, and this page does not invent one</b>. But two NG12 routes are commonly hiding inside a “low mood and tiredness” consultation and must not be lost to the psychiatric label: <b>unexplained weight loss</b> and <b>unexplained iron-deficiency anaemia</b>. The precise thresholds are restated in <a href='#refer'>Refer</a>.", src:"NICE NG12 (May 2025) · house rule"},
         {tone:"cream", h:"What NOT to do", html:"Do not order a broad “depression screen” of every available test, and do not delay treatment while waiting for normal results in an obviously depressed patient. The panel above is the panel. Equally, do not attribute weight loss, fatigue or anaemia to the depression without investigating it."}
       ]},
       {b:"warn", html:"<b>A baseline sodium before an SSRI is a safety measure, not a formality.</b> SSRIs and SNRIs cause SIADH and hyponatraemia in roughly <b>1–5%</b> of patients; the risks stack with age over 65, female sex, low BMI, diuretics, pre-existing hyponatraemia and renal impairment, and severe hyponatraemia (sodium &lt;125 mmol/L) causes confusion, seizures, coma and death. Recheck the sodium at 2–4 weeks in anyone at risk, and stop and recheck if it falls below 130 mmol/L (&lt;130)."}
     ]},

    {id:"whototreat", nav:"Who to treat", title:"The NG222 fork — the menu for less severe, combination for more severe", sub:"NG222 replaced rigid stepped care with a shared decision between co-equal options. In less severe depression, medication is deliberately last.",
     blocks:[
       {b:"p", html:"For <strong>less severe</strong> depression (PHQ-9 under 16) NG222 lists the options least-intrusive first, and <strong>an antidepressant sits at the bottom of that list</strong> — offered if the patient prefers it, or if the others have not worked. Choose together from:"},
       {b:"cards", items:[
         {tone:"green", h:"📚 Guided self-help", html:"CBT-based workbook or digital programme with practitioner support — first on NG222's list. NHS Talking Therapies takes <b>self-referrals</b> — give the actual number or link in the consultation, because self-referral rates roughly double when you do. Step 2 offers psychoeducation, guided self-help and digital CBT (Beating the Blues, SilverCloud)."},
         {tone:"green", h:"🏃 Structured group exercise", html:"A treatment in NG222, not lifestyle advice: around 3 sessions a week, or 150 minutes a week of moderate activity (or 75 minutes vigorous). Effect sizes rival medication in mild illness — see <a href='#lifestyle'>the non-drug section</a> for the prescription-grade detail."},
         {tone:"green", h:"💬 Therapies", html:"Group or individual CBT, behavioural activation, interpersonal therapy, counselling, short-term psychodynamic therapy, and mindfulness — MBCT specifically for relapse prevention. Step 3 in Talking Therapies means CBT of <b>16–20 sessions</b>."},
         {tone:"green", h:"🔗 Social prescribing", html:"Debt, housing, loneliness, work, carer load — when the life problem is the driver, treat the life problem. Every English PCN has had link workers since 2020; refer directly."},
         {tone:"green", h:"😴 Sleep and alcohol first", html:"Fix the sleep (CBT-I principles, Sleepio) and the drinking before judging any mood response — otherwise you are titrating a drug against a moving target."},
         {tone:"cream", h:"👀 Active monitoring", html:"A genuine option for subthreshold symptoms — a structured review booked in 2–4 weeks, not “come back if it gets worse”."}
       ]},
       {b:"kv", rows:[
         ["More severe depression (PHQ-9 ≥16)","An antidepressant PLUS high-intensity psychological therapy (CBT or IPT) beats either alone. An antidepressant alone or therapy alone remain legitimate choices where that is the patient's preference — but say out loud what is being given up"],
         ["Antidepressants are not for mild depression as first-line monotherapy","They are indicated in moderate-to-severe depression, and in mild depression that has not responded to watchful waiting and psychological intervention"],
         ["The referral itself is a treatment step","Refer to NHS Talking Therapies with a PHQ-9 of 5–15 and mild-to-moderate impairment; check the local access route and waiting time, and chase the referral at the next review — an unstarted therapy referral is the commonest hidden reason a plan “failed”"]
       ]},
       {b:"why", html:"NG222 (2022) shifted the model deliberately: pharmacological, psychological and social interventions are presented as <strong>co-equal options with patient preference at the centre</strong> rather than a rigid ladder; the recommendation against routine antidepressants for mild depression stayed; and exercise and social prescribing entered the treatment pathway explicitly for the first time."}
     ]},

    {id:"lifestyle", nav:"Non-drug", title:"Prescribe the non-drug options with the same specificity as a drug", sub:"Modality, frequency, duration, referral route — “try to get out a bit more” is not a prescription.",
     blocks:[
       {b:"cards", items:[
         {tone:"green", h:"🏃 Structured physical activity", html:"150 minutes a week of moderate aerobic activity, or 75 minutes vigorous, or a combination — referred into the NHS exercise referral scheme or a structured group programme. Meta-analysis puts the NNT at around 4 for meaningful improvement (Noetel et al. 2024 — 218 RCTs, 14,170 participants; walking or jogging, yoga, strength training and mixed aerobic exercise all effective). Mechanism: raised BDNF and hippocampal neurogenesis, endorphins, reduced HPA-axis reactivity, better sleep, social contact."},
         {tone:"green", h:"😴 Sleep and CBT-I", html:"Sleep disturbance is both a symptom and a driver. CBT-I has stronger evidence than any hypnotic: fixed wake time, dark cool bedroom, no screens for an hour before bed, no daytime naps, bed for sleep and sex only, caffeine before noon. Refer to <b>Sleepio</b> (digital CBT-I, free on the NHS in England) or Talking Therapies. See the <a href='insomnia.html'>insomnia protocol</a>."},
         {tone:"green", h:"🍺 Alcohol reduction", html:"Bring it inside the recommended limits — under 14 units a week (&lt;14 units) spread over 3 or more days. AUDIT-C at every depression review, then a brief motivational intervention (FRAMES: Feedback, Responsibility, Advice, Menu, Empathy, Self-efficacy). Refer to the community alcohol team if AUDIT is over 15 or there is dependence. In heavy-drinking men this is often the single most effective intervention available."},
         {tone:"green", h:"📋 Behavioural activation", html:"Identify activities that used to give pleasure or achievement and schedule them systematically, starting small — it breaks the inactivity-worsening-mood cycle and works as well as CBT in mild-to-moderate illness. Deliverable by a non-specialist, self-directed with a workbook, or formally in Talking Therapies. Particularly effective where anhedonia and lost motivation are the barrier."},
         {tone:"green", h:"🤝 Social connection", html:"Loneliness is an independent risk factor for depression (odds ratio around 2.5) and predicts poor antidepressant response. Prescribe it: community activities, volunteering, walking groups, faith communities, befriending, Men in Sheds. Ask the ONS question — “How often do you feel lonely?” — and refer if the answer is always or often."},
         {tone:"green", h:"🧘 Mindfulness and MBCT", html:"MBCT is NICE-recommended specifically for relapse prevention in patients with 3 or more previous episodes — an 8-week group programme, with an NNT of about 4 at 12 months and evidence at least as good as antidepressant continuation. Apps are an introduction, not the programme."},
         {tone:"green", h:"🥗 Diet and correcting deficiency", html:"<b>A Mediterranean-pattern diet — <b>olive oil, fish, vegetables, legumes and wholegrains</b> — is associated with around a 33% lower risk of depression (Psaltopoulou 2013). Omega-3 (EPA-rich, 1–2 g EPA a day) has a modest adjunctive effect. Correct B12, folate, zinc and vitamin D deficiency — all are associated with poorer antidepressant response. Advise against skipping meals — hypoglycaemia worsens low mood and irritability.</b>"},
         {tone:"green", h:"💡 Light therapy for seasonal depression", html:"10,000 lux for 30 minutes each morning immediately after waking — first-line for seasonal affective disorder, with efficacy comparable to fluoxetine (Lam 2006). Use a validated SAD light box, not a household lamp. Start in October before the usual onset and continue to April. Not for evening use — it can cause agitation, headache and insomnia."}
       ]}
     ]},

    {id:"choose", nav:"Choose the drug", title:"Match the antidepressant to the person — the table that does the work", sub:"On average the first-line agents are roughly equal. The choice is made by the patient's comorbidities, symptoms and priorities. Verify every dose in the BNF.",
     blocks:[
       {b:"table", head:["The patient","Best pick","Why, and the dose"], rows:[
         ["<b>Default adult</b>","<b>Sertraline 50 → 200 mg</b>","Best tolerated, cardiac-safe, cheap, and the lowest QT risk of the SSRIs. Start 50 mg OD (mornings, to reduce insomnia) with food; titrate to 100 mg at 4 weeks if the response is insufficient, then 150 and 200 mg; maximum 200 mg a day. Ranked top for efficacy and cost-effectiveness in <b>Cipriani 2018 (522 trials, 116,000 patients)</b>"],
         ["Poor sleep and poor appetite, with weight loss","<b>Mirtazapine 15 → 45 mg nocte</b>","Sedation and appetite gain become the treatment; it also spares sexual function and has a good discontinuation profile. The paradox: MORE sedating at 15 mg than at 30–45 mg, because noradrenergic activation higher up offsets the antihistamine effect. <b>Avoid where obesity is already a problem</b>"],
         ["Comorbid anxiety dominant","Sertraline, or escitalopram 10 mg OD → 20 mg","Start at half dose for the first week — early agitation is what makes anxious patients quit. Sertraline is also first-line across the anxiety disorders, panic, social anxiety, OCD and PTSD. <b>Short-term propranolol 10–40 mg PRN</b> can cover somatic symptoms while the SSRI takes effect; avoid benzodiazepines — a maximum 7–10-day course, only in severe cases, with explicit consent to the time limit"],
         ["Post-MI or cardiac disease","<b>Sertraline</b>","The evidence-based choice post-MI. Avoid citalopram and escitalopram where there is QT risk; avoid tricyclics"],
         ["On an NSAID or aspirin","Any SSRI — <b>and consider adding a PPI</b>","SSRIs impair platelet serotonin; the NG222 PPI recommendation is specifically for the SSRI-plus-NSAID combination"],
         ["On a DOAC or warfarin","Prefer a lower-bleeding-risk option (<b>mirtazapine</b>), or an SSRI with counselling","Discuss the added bleeding risk — but there is no rule that every SSRI plus anticoagulant needs a PPI. Decide case by case (add gastroprotection if there is also an NSAID, dyspepsia, ulcer history or other GI risk) and monitor the INR more closely on warfarin"],
         ["Elderly","Sertraline; <b>check sodium at 2–4 weeks</b>","Hyponatraemia risk, worse with diuretics; falls counselling; citalopram maximum 20 mg at 65 and over"],
         ["<b>Aged 18–25, or ANY increased suicide risk at any age</b>","Choose as for any other adult — usually sertraline","<b>Review at 1 week.</b> NG222's one-week review applies to people <b>aged 18 to 25 inclusive</b> (not “under 25” or “&lt;25”) and to anyone at increased risk of suicide, then regularly. NG222 does not name fluoxetine as preferred for this age group — that is the under-18 (CAMHS) rule. Then review at least every 2–4 weeks for the first 3 months"],
         ["Sexual dysfunction already an issue","Mirtazapine (or vortioxetine or agomelatine later)","SSRIs and SNRIs cause sexual dysfunction in 30–40% of patients on direct questioning, and higher in some series — ask, because fewer than 20% volunteer it"],
         ["Coexisting chronic or neuropathic pain","<b>Duloxetine 30 mg OD for 2 weeks, then 60 mg OD</b>","One drug, two jobs — and simpler than an SSRI plus pregabalin or amitriptyline. Licensed for depression, diabetic neuropathic pain, fibromyalgia and stress incontinence. <b>Monitor BP. Taper slowly: a significant discontinuation syndrome.</b> Amitriptyline 10–25 mg nocte is an adjunct for sleep and pain — it is NOT an antidepressant dose"],
         ["Insomnia-predominant, older, anxious","Mirtazapine 15 mg nocte","Its receptor profile (H1 sedation and appetite, alpha-2 blockade raising noradrenaline and serotonin, 5-HT2 and 5-HT3 blockade reducing anxiety and nausea) suits the phenotype that does badly on an activating SSRI"],
         ["Pregnancy or breastfeeding","<b>Sertraline</b> (most data, lowest placental transfer), or fluoxetine","Do not stop an effective drug abruptly because of a pregnancy. Avoid paroxetine in the first trimester (a small but documented cardiac malformation signal). SNRIs carry a self-limiting neonatal adaptation syndrome — tremor, jitteriness, feeding difficulty. Untreated severe depression carries greater risk to mother and baby than treated depression. Joint decision with the perinatal team (NICE CG192)"],
         ["Stopped before because of withdrawal","Fluoxetine 20 mg (long half-life, effectively self-tapering)","Or plan the slow taper from day one and use a liquid preparation"]
       ]},
       {b:"warn", html:"<b>Counsel at initiation — the four sentences that prevent abandonment:</b> (1) “It takes 2 to 4 weeks to start working, and 4 to 8 for the full effect — don't judge it at day 5.” (2) “The first week can bring nausea or feeling wired; you may feel slightly worse before you feel better, and that fades.” (3) “It's not addictive, but we stop it slowly, together.” (4) “If your mood dips further or you have thoughts of harming yourself, contact us straight away — don't wait for the review.” Book the review before they leave: 1 week if aged 18–25 or at increased suicide risk, otherwise 2 weeks; then every 2–4 weeks for 3 months. Give an interim contact number."}
     ]},

    {id:"clock", nav:"Response clock", title:"The response clock — optimise, switch, then combine", sub:"Serial switching without the checks below is just serial under-treatment.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1", title:"Judge at 4 weeks — 6–8 if partial", when:"the clock", fromLabel:"start here",
          html:"Repeat the PHQ-9. Some response at 4 weeks → hold course and optimise the dose, judging fully at 6–8 weeks. Zero response at 4 weeks on an adequate dose → do not nurse it along, move. First check adherence (half of all “non-response”), alcohol, and the missed drivers from the mimic list."},
         {step:"2", title:"Optimise the dose", when:"partial response", fromLabel:"before any switch",
          html:"Sertraline 50 → 100 → 150 → 200 mg · escitalopram 10 → 20 mg · mirtazapine 15 → 30 → 45 mg. Meaningful gains often appear one step up — <b>go to the maximum tolerated dose before declaring failure</b>."},
         {step:"3", title:"Switch — with the right mechanics", when:"no or insufficient response at an adequate dose", fromLabel:"4 weeks at an adequate dose",
          html:"Mechanics vary by drug, dose and duration — check a switching resource (SPS or Maudsley) for the specific pair rather than applying one rule. Broadly: <b>SSRI → SSRI</b> at low dose is often a direct swap, but taper first from higher doses or if withdrawal-prone (sertraline → escitalopram, or the reverse, gives a different receptor profile). <b>SSRI → mirtazapine:</b> usually a cross-taper. <b>SSRI → venlafaxine MR 75 → 375 mg</b> (commonly 150 mg; more noradrenergic higher up, and better for severe depression): withdraw or cross-taper cautiously and <b>monitor BP</b>. <b>Fluoxetine → anything:</b> the long half-life self-tapers, so start the new drug low and go slowly. <b>Anything → MAOI:</b> specialist only, with a washout. <b>Never two serotonergics at full dose together.</b>"},
         {step:"4", title:"Two adequate trials failed", when:"treatment-resistant depression", fromLabel:"the referral threshold",
          html:"TRD means failure of two agents at an adequate dose and duration → refer or seek advice. Specialist options: augmentation with lithium (most evidence), aripiprazole, or quetiapine 50–150 mg nocte (licensed add-on as quetiapine XL; NICE NG222 lists antipsychotic augmentation), T3 thyroid augmentation, vortioxetine, combination therapy, ECT, or esketamine. Meanwhile: is therapy actually on board? has the alcohol really been addressed? has the diagnosis been revisited — bipolar II, ADHD, PTSD, undisclosed trauma, personality-level difficulties?"}
       ]},
       {b:"kv", rows:[
         ["What an adequate trial actually is","The right drug at a therapeutic dose, genuinely taken, for at least 4 weeks — below that you cannot assess response at all. Check the pharmacy record and have the honest conversation before you conclude a drug has failed"],
         ["Chase the therapy referral","Drug plus therapy beats drug alone in moderate-to-severe depression — so “no response” with an unstarted Talking Therapies referral is not a drug failure"]
       ]}
     ]},

    {id:"side", nav:"Side effects", title:"Fix the side effect, keep the treatment alive", sub:"Most “failed” antidepressants were abandoned in week one for something manageable.",
     blocks:[
       {b:"table", head:["Side effect","Typical culprit","Fix"], rows:[
         ["Nausea and GI upset in week 1","Any SSRI or SNRI","Take it with food; usually gone by week 2 — pre-warned patients tolerate it"],
         ["Early agitation or feeling wired (activation)","SSRIs, fluoxetine especially","Half-dose start, morning dosing, short-term propranolol if needed — and review the risk. Remember the 1-week review duty at 18–25 or at any increased suicide risk"],
         ["Sexual dysfunction that persists","All SSRIs and SNRIs","ASK at review — 30–40% are affected — reduced libido, delayed orgasm, anorgasmia, erectile dysfunction — and fewer than 20% raise it. Dose-reduce, switch to mirtazapine, vortioxetine, agomelatine or bupropion (off-label in the UK), or treat it (sildenafil in men). The silent quit-driver"],
         ["Weight gain","Mirtazapine much more than SSRIs","<b>Name it upfront; diet and activity support; switch if unacceptable</b>"],
         ["Sedation","Mirtazapine, trazodone","Night dosing; often the desired effect — or increase mirtazapine, which is less sedating higher up"],
         ["<b>Hyponatraemia</b> (confusion, cramps, falls)","All serotonergics; worst in the elderly on diuretics","SIADH in roughly 1–5%. Check sodium at 2–4 weeks in anyone at risk; below 130 mmol/L stop and recheck; below 125 mmol/L is dangerous — confusion, seizures, coma. Mirtazapine is least implicated"],
         ["Bleeding and bruising","SSRIs, especially with an NSAID or anticoagulant","Consider a PPI where an NSAID or another GI risk factor is involved; otherwise weigh a switch of class (mirtazapine) — individualised, not automatic"],
         ["Sweating","Venlafaxine, sertraline","Dose timing; usually tolerable once explained"],
         ["<b>QT concerns</b>","Citalopram and escitalopram","Respect the caps: citalopram 40 mg, halved to 20 mg at 65 and over (&gt;65); escitalopram 20 mg. ECG if there is cardiac history or another QT-prolonging drug, and avoid both if QTc is &gt;450 ms in men or &gt;460 ms in women — use sertraline instead"],
         ["Raised BP","Venlafaxine, duloxetine","Check BP at each titration step and at review — the noradrenergic effect is dose-related"]
       ]},
       {b:"warn", html:"<b>Serotonin syndrome</b> — agitation with sweating, tremor or clonus and fever, after a dose rise or a new serotonergic drug (tramadol, triptans, St John's Wort, linezolid, MDMA): stop the drugs and arrange same-day assessment; with fever and rigidity, 999. And a new “high” on antidepressant monotherapy is a bipolar diagnosis, not a good response — stop and refer."}
     ]},

    {id:"duration", nav:"Continue & stop", title:"Continuation, relapse prevention — and stopping properly", sub:"Stopping at “feeling better” is the commonest cause of relapse in primary care. Stopping too fast is the commonest cause of a bad experience.",
     blocks:[
       {b:"table", head:["Phase","How long","Notes"], rows:[
         ["<b>First episode</b>","<b>At least 6 months (≥6 months) after remission</b>, at the dose that worked","Remission means a PHQ-9 under 10 sustained for at least 2 months. Say it at the first prescription: “once you start to feel better, the tablet carries on for at least another 6 months” — and write the plan in the record"],
         ["<b>Recurrent, severe, or residual symptoms</b>","<b>At least 2 years</b>, often longer; consider indefinite maintenance after a third episode","Recurrence risk: 50% after a first episode, 70% after a second, 90% after a third — each episode lowers the threshold for the next. Add relapse-prevention psychology: <b>MBCT has the best evidence</b>"],
         ["Relapse signature","Write it down with the patient","Their personal early-warning signs and the action plan that goes with them"],
         ["<b>Stopping — the NG222 and RCPsych rules</b>","Slow, stepwise, PROPORTIONATE reductions over weeks to months: about 10% of the CURRENT dose every 2–4 weeks (hyperbolic tapering), with smaller absolute steps as the dose falls — e.g. sertraline 100 → 50 → 25 → 12.5 mg → alternate days → stop. <b>Next step only when the last one is comfortable</b>","NOT “take one every other day for a fortnight”. Use liquid preparations or split tablets at the bottom end, and give a written tapering plan. Paroxetine and venlafaxine are the withdrawal-heavy ones; fluoxetine largely self-tapers. Review at 4 and 8 weeks of the taper, and keep a crisis plan in place during it"],
         ["<b>Withdrawal versus relapse</b>","The distinction that decides the next move","Withdrawal: within days of a cut, physical — dizziness, “electric shocks”, nausea, imbalance, insomnia, hyperarousal (the FINISH pattern) — and it settles when the dose is restored. Relapse: weeks later, and the old mood symptoms return. Withdrawal → go back a step and slow down. Relapse during a taper → restart the previous effective dose immediately"],
         ["The decision to stop is a consultation","Not a request granted at the desk","Confirm stable remission (at least 6 months, or ≥24 months if recurrent), then make it a structured shared decision with a written plan"]
       ]},
       {b:"why", html:"Two numbers explain most of the trouble here. <b>Around 40–50% of patients stop within the first 3 months</b> — before any fair therapeutic trial — usually because they expected a course of antibiotics rather than a treatment with a delay and a tail. And withdrawal was badly underestimated until <strong>Davies and Read (2019)</strong> found symptoms reported by around <b>56% of antidepressant users, with about 46% describing them as severe</b>. Warning people in advance, and tapering hyperbolically, is what turns both figures around."},
       {b:"say", html:"You're feeling well BECAUSE of the tablet, not despite it — like a cast on a healing bone, it stays on a while after the pain has stopped. When we do stop, we'll go down in small steps at your pace; some people notice dizziness or electric-shock feelings if we go too fast, and that just means we slow down — it isn't the depression coming back."}
     ]},

    {id:"special", nav:"Special groups", title:"Special groups — where the rules change", sub:"Five groups where the standard plan needs adjusting rather than repeating.",
     blocks:[
       {b:"kv", rows:[
         ["Pregnancy and breastfeeding","Sertraline has the best data in both; fluoxetine is the other well-evidenced choice. Avoid paroxetine in the first trimester. Do not stop an effective antidepressant abruptly for a pregnancy — untreated severe depression is the bigger risk. Moderate or worse illness, or any risk, goes to the perinatal mental-health team (NICE CG192), and existing treatment deserves a preconception conversation"],
         ["Postnatal","Postnatal depression affects 10–15% of UK mothers. Use the EPDS at the 6-week postnatal check and again at 3–4 months; a score ≥13 means significant symptoms — refer urgently. Any escalation in the first 2 weeks after birth, or confusion, hallucinations or rapidly shifting mood → 999 and a mother-and-baby unit. See the <a href='postnatal-depression.html'>postnatal depression protocol</a>"],
         ["Aged 18–25","Choose the drug as for any adult, but review at 1 week and stay close for the first fortnight — activation can increase risk before the mood lifts (the MHRA's 2004 warning, strongest under 30). NG222 does not prefer fluoxetine in this group"],
         ["Under 18s (&lt;18)","CAMHS pathway — fluoxetine is the only first-line antidepressant, and always alongside psychological therapy. Do not initiate in primary care"],
         ["Older adults","Sertraline, with a baseline and 2–4-week sodium; citalopram capped at 20 mg from 65; falls counselling; watch the anticholinergic burden and the interaction list. Consider dementia and physical illness in the differential rather than assuming primary depression"],
         ["Long-term antidepressant users","An annual structured medication review (NG222): weight (mirtazapine, quetiapine), BP and pulse (venlafaxine, duloxetine), sodium (annual U&amp;E at ≥65 or on a diuretic), sexual function asked about directly, adherence, and whether the indication still stands. Consider a DEXA in patients on an SSRI for 5 years or more who are post-menopausal or male and ≥70"]
       ]}
     ]},

    {id:"monitor", nav:"Monitor", title:"The review schedule — and what to check at each one", sub:"Fixed intervals, a repeated score, and a re-asked risk question.",
     blocks:[
       {b:"table", head:["When","What to check","Action"], rows:[
         ["<b>1 week</b> (aged 18–25, or any increased suicide risk)","<b>Tolerability, activation, suicidal ideation, adherence</b>","<b>A duty, not a courtesy. Then review regularly</b>"],
         ["<b>2 weeks</b> (everyone else, after starting)","Nausea, headache, insomnia, agitation, sexual dysfunction; suicidal ideation; early discontinuation; PHQ-9 as the comparator","Side effects intolerable → adjust the dose or switch. Remind them: 2–4 weeks for the first effect, 4–8 for the full effect"],
         ["<b>4–6 weeks</b>","PHQ-9 response: a reduction of ≥50% is a response, under 5 is remission","Partial → increase the dose. No response at an adequate dose for 4 weeks → switch. Therapy not started → chase the referral or find the barrier. Re-check alcohol, housing and money"],
         ["<b>Every 2–4 weeks to 3 months</b>","Symptoms, risk, adherence, side effects","The first 3 months is when treatment is abandoned — this is the interval that prevents it"],
         ["<b>3 months</b>","<b>In remission (PHQ-9 under 10)?</b>","Yes → agree the continuation plan (at least 6 months from remission, longer if recurrent). No → dose adequate? adherence confirmed? alcohol? therapy started? Consider psychiatry if a second trial is failing. Record functional recovery, not just the score"],
         ["<b>Annually, long-term</b>","<b>Weight, BP and pulse, sodium, sexual function, bone health, indication</b>","<b>A structured NG222 medication review — deprescribing is part of it</b>"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"red", h:"🔴 Crisis — say it, write it, repeat it", html:"“If you feel unsafe: <b>999 or A&amp;E now; NHS 111 option 2; Samaritans 116 123</b> — any hour. Save these in your phone now, while we're together.”"},
         {tone:"red", h:"⚠️ The first fortnight", html:"“If you feel more agitated, or have new thoughts of harming yourself in the first weeks — <b>contact us the same day</b>. It's a known effect and we act on it.”"},
         {tone:"amber", h:"💊 Never stop dead", html:"“If you run out or stop suddenly you may feel dizzy, sick, or have electric-shock sensations — <b>always come to us to plan it</b>.”"},
         {tone:"cream", h:"🌡️ Mixing", html:"“Check with a pharmacist before adding anything new — <b>including St John's Wort and strong painkillers</b>.”"}
       ]},
       {b:"warn", html:"<b>Same-day GP contact, not routine:</b> significantly increased agitation, new suicidal thoughts or severe insomnia in the first 2 weeks of an SSRI (<b>activation syndrome</b>); symptoms of hyponatraemia — confusion, nausea, headache — in an older patient recently started; a request for an emergency supply after running out; and <b>any new manic symptoms on antidepressant monotherapy</b>."}
     ]},

    {id:"loop", nav:"Not responding?", title:"Not responding? Run this before the next switch", sub:"Six checks. Most “treatment-resistant” depression fails one of them.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"1 · Adequate trial?", html:"<b>Right dose, actually taken, for a genuine 4 weeks?</b> Pharmacy record plus an honest conversation."},
         {tone:"amber", h:"2 · Alcohol and substances", html:"<b>AUDIT-C again — the commonest hidden reason nothing works.</b>"},
         {tone:"amber", h:"3 · Diagnosis drift", html:"Bipolar II (re-screen), ADHD, PTSD or trauma, perimenopause, hypothyroidism, OSA, anaemia."},
         {tone:"amber", h:"4 · Life drivers", html:"Abuse, debt, housing, carer load — no tablet outruns an unaddressed cause."},
         {tone:"amber", h:"5 · Therapy actually on board?", html:"Drug plus therapy beats drug alone in moderate-to-severe depression — has the referral happened, and did they get in?"},
         {tone:"amber", h:"6 · Physical illness", html:"New or undertreated pain, inflammation, or malignancy in the older patient with somatic features."}
       ]},
       {b:"why", html:"<b>All six checked → switch with the right mechanics, or refer.</b> Two adequate trials failed is the threshold for specialist input, not the moment to try a third agent alone."}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — who, and how fast", sub:"Two of these are today; one is the cancer pathway hiding behind “low mood and tiredness”.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999 / crisis team, same day", html:"Active suicidal ideation with plan and intent. A recent attempt or any overdose → 999. Postpartum psychosis → 999 and a mother-and-baby unit. Psychotic depression, especially with command hallucinations. Severe self-neglect — not eating, drinking or self-caring. A parent expressing thoughts of harming their children."},
         {tone:"amber", h:"Same-day mental health assessment", html:"High suicide risk without immediate intent — passive ideation with a formed plan, a previous attempt, alcohol use, isolation. Phone the crisis team; many areas run a 24-hour line (NHS 111 option 2). Document the decision and the risk rationale."},
         {tone:"blue", h:"Urgent psychiatry — 1 to 2 weeks", html:"Moderate-to-severe depression not responding to a first-line SSRI at 4–6 weeks · suspected bipolar disorder (positive MDQ) · psychotic features · severe recurrent depression · treatment-resistant depression after two adequate trials · depression with significant substance misuse needing dual-diagnosis management."},
         {tone:"blue", h:"NHS Talking Therapies and primary-care therapies", html:"Mild-to-moderate depression (PHQ-9 5–15): self-referral or GP referral. Step 2 — psychoeducation, guided self-help, digital CBT. Step 3 — CBT of 16–20 sessions, behavioural activation, counselling. Also available locally: problem-solving therapy for socially precipitated depression, counselling in bereavement and adjustment, and MBCT for relapse prevention after 3 or more episodes."},
         {tone:"blue", h:"Perinatal, CAMHS and the complex", html:"Moderate or worse illness in pregnancy or postnatally, or any risk → perinatal mental-health team (low threshold; also preconception planning on existing treatment). Under-18s → CAMHS, fluoxetine only and with therapy. Comorbid eating disorder, substance dependence or emerging personality-level difficulties → specialist services."},
         {tone:"purple", h:"NG12 — stated honestly <span class='tw'>2WW</span>", html:"Depression has no NICE NG12 criterion of its own, and this page does not invent one. But two routes sit inside the commonest depression consultation and must not be lost to the label:<br>• <b>Unexplained weight loss:</b> in a patient aged 60 and over with weight loss plus any of diarrhoea, back pain, abdominal pain, nausea, vomiting, constipation or new-onset diabetes → <b>urgent direct-access CT within 2 weeks for pancreatic cancer</b>; and unexplained weight loss with other features in older patients earns urgent investigation rather than an antidepressant and a follow-up.<br>• <b>Unexplained iron-deficiency anaemia</b> found on the depression panel — in men of any age, or in post-menopausal women → urgent direct-access FIT and colorectal investigation; FIT ≥10 µg Hb/g stool warrants urgent lower GI referral.<br>• Fatigue, weight loss and low mood in an older patient are a work-up, not a diagnosis.", src:"NICE NG12 (updated May 2025) · house rule"},
         {tone:"cream", h:"Social prescribing — and what primary care keeps", html:"Refer directly to your PCN link worker for loneliness, debt, housing, work and carer load. We keep: risk assessment at every contact, the score, the mimic screen, drug choice and titration, side-effect management, the continuation clock, the taper, and the annual review. Psychiatry owns augmentation, ECT, esketamine and the bipolar diagnosis."}
       ]},
       {b:"say", html:"We've had two fair rounds of treatment and you're still fighting hard for not enough reward — that tells me you need the options only the specialist team can add, not that you've failed at this. We keep going here alongside them, and the crisis numbers stay in your phone meanwhile."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 23-year-old man attends having felt “flat and pointless” for 3 months. He is sleeping badly, has stopped football, is drinking 6 to 8 cans most evenings, and his PHQ-9 is 17 with a GAD-7 of 12. He asks for “something to sort it out quickly”. His mother had bipolar disorder. He has no plan, but has thought life is not worth living."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Asks about suicidal thoughts, plan, intent and means directly, and documents it — and does not stop at “no plan”. <b>Screens for past mania before prescribing</b>, given the family history, and knows an SSRI alone could precipitate mania. Scores <b>PHQ-9 and GAD-7</b> and places him in the <b>more severe</b> group, so offers <b>an antidepressant plus high-intensity therapy</b> rather than either alone. <b>Names the alcohol as a cause and not just a consequence</b>, with AUDIT-C and a brief intervention, and explains that mood rarely lifts while drinking at that level. Chooses <b>sertraline 50 mg</b> with the <b>1-week review because he is aged 18–25</b>, counsels on the 2–4-week delay, early activation and the same-day contact rule, and does not offer fluoxetine on the mistaken “under-25” rule. Takes the baseline panel including <b>TSH and a sodium</b>. Gives the crisis numbers and saves them in his phone. <br><br><a href='../../cases/depression.html'>Open the full casebook chapter →</a>"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG222 — Depression in adults: treatment and management (2022)</b><br><a href="https://www.nice.org.uk/guidance/ng222" rel="noopener">nice.org.uk/guidance/ng222</a><span class="rd"> — the less severe / more severe fork, the least-intrusive-first option list with medication last in less severe depression, combination treatment in more severe depression, exercise and social prescribing as treatments, the review intervals including the one-week review at 18–25 and at increased suicide risk, the continuation periods, and proportionate stepwise withdrawal</span></li>'+
         '<li><b>NICE CG192 — Antenatal and postnatal mental health</b><span class="rd"> — perinatal referral thresholds, drug choice in pregnancy and breastfeeding, and postpartum psychosis as an emergency</span></li>'+
         '<li><b>NICE NG222 (further-line treatment)</b><span class="rd"> — augmentation with a second-generation antipsychotic (e.g. aripiprazole, olanzapine, quetiapine, risperidone) or lithium</span></li>'+
         '<li><b>Cipriani et al., Lancet 2018</b><span class="rd"> — network meta-analysis of 522 trials and 116,000 patients; the basis for sertraline as the usual first choice on efficacy, tolerability and cost</span></li>'+
         '<li><b>Noetel et al., BMJ 2024</b><span class="rd"> — 218 RCTs and 14,170 participants; walking or jogging, yoga, strength training and mixed aerobic exercise as effective treatments, with an NNT around 4</span></li>'+
         '<li><b>Davies &amp; Read 2019, and RCPsych tapering guidance</b><span class="rd"> — withdrawal reported by around 56% of users and severe in about 46%; the hyperbolic taper of roughly 10% of the current dose every 2–4 weeks, and the FINISH pattern</span></li>'+
         '<li>Kroenke et al. 2001 (PHQ-9), Dazzi et al. 2014 (asking about suicide), Skovlund et al. 2016 (hormonal contraception and mood), Lam et al. 2006 (light therapy), Psaltopoulou et al. 2013 (Mediterranean diet)<span class="rd"> — the named figures used in the scoring, risk, mimic and non-drug sections</span></li>'+
         '<li><b>MHRA safety guidance and the BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — the 2004 warning on early suicidal thoughts and self-harm, the citalopram and escitalopram QT caps, and every dose on this page: verify before prescribing</span></li>'+
         '<li>NICE NG12 — Suspected cancer: recognition and referral (updated May 2025)<br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — the unexplained-weight-loss and iron-deficiency-anaemia routes that hide inside a low-mood consultation</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Depression in adults — NICE NG222, with CG192 for the perinatal pathway, RCPsych guidance for tapering, and NICE NG12 (May 2025) for the urgent-cancer routes that hide behind fatigue and low mood. Diagnosis and management are on this one page; the low-mood presentation pathway remains an algorithm for the undifferentiated presentation. Under-18s: CAMHS pathways. Verify every dose against the current BNF before prescribing."
