  lead:"<div class='mg-layers'><a href='#severe'><b>Not a wart?</b><small>The five dangerous mimics</small></a><a href='#workup'><b>Screen</b><small>Full STI screen + syphilis serology</small></a><a href='#ladder'><b>Treat</b><small>Topical vs ablative by morphology</small></a><a href='#refer'><b>Refer</b><small>GUM as the default; 2WW routes</small></a></div>",
  quickSub:"If you read nothing else on this page, read these six cards. Every figure traces to the source cited under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ A child with anogenital warts = safeguarding BEFORE treatment", html:"Anogenital warts in any child → consider sexual abuse and refer to the paediatric safeguarding team — at the SAME visit as identifying the lesions, before any treatment is started. <b>Vertical (perinatal) transmission can present up to about age 3</b>, and autoinoculation from plantar warts occurs — but warts in a child beyond infancy, or without a clear vertical-transmission history, are a potential marker of sexual abuse until a full safeguarding assessment excludes it."},
    {tone:"amber", h:"Not every wart is a wart — five mimics to hold in mind", html:"<b>Bowenoid papulosis</b> (pigmented, multifocal, young adult — HPV 16-driven VIN3/PIN3), <b>Buschke–Löwenstein tumour</b> (giant condyloma — rapidly growing, treatment-resistant), <b>anal SCC</b> (anal warts + rectal bleeding + change in bowel habit), <b>condylomata lata of secondary syphilis</b> (flat, moist, grey-white, coalescing — check TPHA + RPR at every new presentation), and <b>VIN/PIN/AIN</b> (ulcerated, indurated, &gt;40 or immunocompromised). <b>Do NOT treat any of these as simple warts.</b>"},
    {tone:"blue", h:"Warts are a marker of exposure — screen for everything else", html:"Approximately 25–35% of patients with anogenital warts have a co-existing STI. Offer <b>every new presentation</b> a full screen — HIV (BASHH: offer to all), syphilis serology (TPHA + RPR), gonorrhoea and chlamydia — ideally at GUM, where multi-site sampling (especially for MSM), internal examination and partner notification live. Treating the visible warts does not reduce cancer risk — the cervical screening programme does."},
    {tone:"green", h:"Choose treatment by morphology — and teach the imiquimod conversation", html:"Soft, non-keratinised, multiple → patient-applied podophyllotoxin 0.15% cream / 0.5% solution (BD × 3 days then 4 days rest, up to 4–6 cycles). Keratinised, larger or recurrent → imiquimod 5% three nights a week, washed off after 6–10 hours, up to 16 weeks. Few, hard, keratinised → cryotherapy. Tell every imiquimod patient: the redness, swelling and skin breakdown ARE the treatment working — stopping early because of them is the commonest reason it fails."},
    {tone:"purple", h:"Pregnancy changes everything topical", html:"Podophyllotoxin is contraindicated in pregnancy (teratogenic) and imiquimod has insufficient safety data. Cryotherapy and trichloroacetic acid (TCA) are the safe options. <b>Warts proliferate in pregnancy</b> (immune modulation + vascularity) and can become very extensive by the third trimester — <b>manage proactively from the second trimester</b>; large introital warts occasionally obstruct delivery and need obstetric planning."},
    {tone:"teal", h:"Recurrence is reactivation, not re-infection — say so proactively", html:"30–50% recur within 6 months of clearance — almost always reactivation of latent HPV in the basal epithelium, NOT re-infection from a partner. Saying this at the clearance visit prevents real relationship harm. 90% achieve immune-mediated viral clearance within 2 years; smoking significantly increases recurrence (it suppresses local cell-mediated immunity). No test-of-cure is needed."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step is where the harm hides — do not skip it.",
  pathway:[
    {title:"Exclude the lesions that are NOT simple warts", html:"Pigmented, ulcerated, indurated, fixed, bleeding or rapidly growing → biopsy (specialist) — bowenoid papulosis, VIN/PIN/AIN, Buschke–Löwenstein or SCC. Anal warts + rectal bleeding + change in bowel habit → 2WW colorectal. Any child → safeguarding referral before treatment. Flat moist grey-white papules → think condylomata lata: syphilis serology.", alert:true},
    {title:"Assess — history, sites, and the whole anogenital area", html:"Sexual history, partners, condom use, HIV status, immunosuppression, pregnancy, cervical screening status; itch, pain, bleeding, discharge. Examine all sites in good lighting — penis incl. urethral meatus, vulva/introitus, perianal skin. Document number, site, morphology, size, colour. Never biopsy warts in primary care."},
    {title:"Screen — the same exposure that gave HPV may have given more", html:"Offer a full STI screen to every new presentation: HIV, TPHA + RPR, gonorrhoea/chlamydia NAAT. GUM is the preferred route (multi-site sampling, internal examination, partner notification). Check cervical screening is up to date; pregnancy test if applicable."},
    {title:"Treat by morphology — or refer for ablation", html:"Soft/multiple → podophyllotoxin. Keratinised/larger → imiquimod 5% (teach the inflammation-is-the-mechanism point). Few/hard → cryotherapy. Pregnancy → TCA or cryotherapy only. No treatment eradicates HPV — expect recurrence and say so."},
    {title:"Vaccinate, notify, follow up", html:"Offer Gardasil 9 to unvaccinated eligible patients (routine to 25; MSM to 45 via GUM) — it does not treat existing warts but protects against types not yet acquired. Partner notification via GUM. Review at 4–6 weeks: no response after 2 podophyllotoxin cycles → switch or refer."}
  ],
  sections:[
    {id:"types", nav:"Classify", title:"Classification — which HPV lesion is this?", sub:"The fundamental distinction: HPV 6/11 cause visible warts and essentially never cancer; HPV 16/18 cause cancer and are usually invisible.",
     blocks:[
       {b:"table", head:["Lesion","Cause / look","Action"], rows:[
         ["<b>Condylomata acuminata (common anogenital warts)</b>","HPV 6 &amp; 11 (low-risk — no malignant potential). Flesh-coloured, grey or pink soft pedunculated or sessile papules, cauliflower/papillomatous; single or multiple. Sites: vulva, introitus, perianal, penile shaft/glans/prepuce, perineum, inguinal","Clinical diagnosis — no biopsy, swab or HPV typing for a typical presentation"],
         ["<b>Flat (subclinical) condylomata</b>","Flat acetowhite lesions visible only with 3% acetic acid (not specific — candida and irritation also whiten); diagnosed at colposcopy/anoscopy","<b>Not routinely treated unless symptomatic or associated with dysplasia</b>"],
         ["<b>Intraepithelial neoplasia (VIN / PIN / AIN, incl. bowenoid papulosis)</b>","HPV 16/18 (high-risk). Flat, often pigmented or red-brown, multifocal papules — histologically grade 1–3","<b>2WW + biopsy. Do NOT treat with topical wart therapies</b>"],
         ["<b>Cervical HPV disease</b>","Managed via the NHS Cervical Screening Programme; not visible at GP examination","<b>Ensure screening is up to date — visible warts confirm HPV exposure</b>"],
         ["<b>Recurrent respiratory papillomatosis</b>","Rare — laryngeal papillomas from perinatal HPV 6/11; hoarse voice in young children and adults","<b>ENT referral</b>"]
       ]},
       {b:"why", html:"Visible warts are almost always low-risk HPV 6/11 and carry negligible malignant-transformation risk; high-risk HPV 16/18 causes invisible infection of the transformation zone that can progress to dysplasia and cancer over years. A patient with visible warts has an infection unlikely to cause cancer; a patient with an abnormal smear may have no visible lesions at all. Treating visible warts therefore does not reduce cervical or anogenital cancer risk — the screening programme is the cancer-prevention tool."}
     ]},

    {id:"severe", nav:"Red flags", title:"Red flags — malignancy, mimics, children and immunosuppression", sub:"Most anogenital warts are benign. These presentations are not — and each demands a different route.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Child with anogenital warts", html:"Particularly perianal or intracrural, in a pre-pubertal child → consider sexual abuse: refer to the paediatric safeguarding team the SAME day, before any treatment. Vertical transmission can present up to ~age 3, and autoinoculation from plantar warts occurs — but warts in a child aged 3+ or without a clear vertical history are a potential abuse marker until a full safeguarding assessment excludes it."},
         {tone:"red", h:"🔴 Buschke–Löwenstein tumour", html:"Large, rapidly growing, cauliflower-like mass failing standard treatment → giant condyloma acuminatum: locally destructive, penetrates deep tissue, low-grade malignant transformation risk. 2WW urology/colorectal; CT/MRI for extent; surgical excision required."},
         {tone:"red", h:"🔴 Anal SCC", html:"Anal warts + rectal bleeding + change in bowel habit (especially age &gt;45) → 2WW colorectal. HPV 16/18-associated, rising incidence in MSM. <b>Rectal bleeding with anal lesions is not always haemorrhoids.</b> High-risk groups need anal cytology and high-resolution anoscopy via GUM."},
         {tone:"red", h:"🔴 Bowenoid papulosis / VIN / PIN / AIN", html:"Pigmented, multifocal, flat papules in a young adult (&lt;35) — HPV 16-driven VIN3/PIN3 — or ulceration + induration + bleeding at &gt;40 or immunocompromised → 2WW dermatology or gynaecology + mandatory biopsy. The most commonly misdiagnosed high-grade dysplasia — it looks like ordinary warts."},
         {tone:"amber", h:"🟠 Condylomata lata — the syphilis mimic", html:"Broad-based, flat, moist, grey-white coalescing papules at mucosal junctions (perianal, vulval) = secondary syphilis, teeming with Treponema pallidum and highly infectious. TPHA + RPR at every new wart presentation. Missing it leaves systemic syphilis untreated and contacts unnotified."},
         {tone:"amber", h:"🟠 Immunosuppressed / suspected immunodeficiency", html:"New extensive or rapidly progressing warts on immunosuppressants (transplant, anti-TNF, high-dose steroids) → HPV replication uncontrolled without T-cell immunity: urgent HIV test, FBC (lymphopenia), consider reducing immunosuppression where possible, GUM/dermatology management. Florid, recurrent, treatment-resistant disease: lower the biopsy threshold."},
         {tone:"amber", h:"🟠 Pregnancy", html:"Warts proliferate in pregnancy; avoid podophyllotoxin (teratogenic) and imiquimod — use TCA or cryotherapy; refer early; obstetric planning if extensive near delivery."}
       ]},
       {b:"why", html:"Bowenoid papulosis deserves specific emphasis because it is the commonest high-grade dysplastic condition misdiagnosed as common warts — young sexually active adults, multiple flat pigmented papules on the glans, prepuce or vulva, HPV 16, and despite a benign look it is VIN3/PIN3 histologically. The safeguarding rule is the most important medicolegal point on this page: the referral is made at the visit where the lesions are found, and treatment does not proceed before the assessment."}
     ]},

    {id:"history", nav:"History &amp; exam", title:"Targeted history and examination", sub:"A clinical diagnosis — the value of the assessment is the sites you check and the mimics you exclude.",
     blocks:[
       {b:"table", head:["What","Detail","Why"], rows:[
         ["<b>Sexual history</b>","Partners, condom use (HPV transmits skin-to-skin despite condoms), HIV status — offer testing to all","Sets the screening and notification plan"],
         ["<b>Symptoms and course</b>","Itch, pain, bleeding, discharge; duration and change; previous treatment and response","<b>Bleeding, induration or rapid change → the red-flag table</b>"],
         ["<b>Context</b>","Immunosuppression, pregnancy status, cervical screening status, partner notification (current partner → GUM)","Each changes the route or the treatment"],
         ["<b>Examination</b>","All anogenital sites in good lighting: penile shaft, glans, prepuce AND urethral meatus; vulva and vaginal introitus (speculum for intravaginal); perianal skin with the buttocks gently separated. Document number, site, morphology (pedunculated/sessile/flat), size, colour","Intraurethral warts occur in ~5–8% of men with penile warts (meatal warts, haematuria, discharge or dysuria → specialist urethroscopy). No proctoscopy in primary care unless trained — ask about intra-anal symptoms (bleeding, discharge → GUM for internal examination)"],
         ["<b>Never biopsy in primary care</b>","Biopsy is specialist-arranged, for: atypical appearance (pigmented, ulcerated, indurated, fixed), failure of 2 standard treatment cycles, age &gt;40, immunocompromised, or a child","The biopsy list is the not-a-simple-wart list"]
       ]}
     ]},

    {id:"workup", nav:"Work-up", title:"Investigations — no test for the warts, several for the patient", sub:"Typical condylomata need no swab, biopsy or HPV typing. The tests are for what travels with them.",
     blocks:[
       {b:"table", head:["Test","Who","Why"], rows:[
         ["<b>HIV test</b>","<b>Offered to ALL patients with new anogenital warts (BASHH)</b>","Extensive or rapidly growing warts can indicate undiagnosed HIV immunosuppression"],
         ["<b>Syphilis serology — TPHA + RPR</b>","<b>Every new wart presentation, regardless of appearance</b>","Condylomata lata mimic warts; secondary syphilis is systemic and highly infectious"],
         ["<b>Gonorrhoea / chlamydia NAAT</b>","All new presentations — GUM preferred for multi-site sampling (especially MSM)","<b>~25–35% have a co-existing STI</b>"],
         ["<b>Cervical screening status</b>","All women","HPV primary screening is standard; new warts do not change the interval but confirm exposure — ensure registered and up to date (25–49 every 3 years, 50–64 every 5)"],
         ["<b>Pregnancy test</b>","If applicable","Changes the entire topical plan"],
         ["<b>Specialist investigations</b>","Biopsy (atypical/refractory — dermatology/GUM) · anoscopy (symptomatic intra-anal — GUM/colorectal) · colposcopy (abnormal smear + warts) · CT/MRI (suspected Buschke–Löwenstein)","Arranged by the receiving specialty"]
       ]},
       {b:"cards", items:[
         {tone:"purple", h:"NG12 criteria that surface here <span class='tw'>2WW</span>", html:"Anogenital warts themselves have no NICE NG12 criterion — the cancer risk lives in the mimics and the co-located cancers:<br>• An unexplained anal mass or unexplained anal ulceration → 2-week-wait suspected anal cancer referral — the route for the wart-like lesion that is indurated, ulcerated or rapidly growing, for suspected Buschke–Löwenstein, and for anal warts with rectal bleeding and change in bowel habit.<br>• An unexplained vulval lump, ulceration or bleeding → 2WW vulval cancer pathway — the route for suspected VIN or vulval SCC.<br>• A penile mass or ulcerated lesion where an STI has been excluded as the cause, or a persistent penile lesion after STI treatment → 2WW penile cancer pathway — the route for suspected PIN/penile SCC including bowenoid papulosis with atypia.<br>• Rectal bleeding at 50+ (or with other colorectal features per FIT triage) → the colorectal pathway — do not attribute rectal bleeding to perianal warts without assessment.", src:"NICE NG12 (updated May 2025) · house rule"}
       ]}
     ]},

    {id:"ladder", nav:"Treat", title:"The treatment ladder — named agents, regimens and who applies them", sub:"Choose by morphology, site, pregnancy and patient preference. Verify against the BNF; several options are GUM-delivered.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Patient-applied", title:"Podophyllotoxin 0.15% cream / 0.5% solution (Warticon®, Condyline®)", when:"soft, non-keratinised external warts — first-line", fromLabel:"home treatment",
          html:"Apply BD for 3 consecutive days then 4 days rest = 1 cycle; up to 4–6 cycles. Anti-mitotic (prevents cell division). Contraindicated: pregnancy, intra-anal, intra-urethral, cervical and oral lesions. Do not apply to actively inflamed, eroded or bleeding skin — wait for the reaction to settle between cycles (avoids systemic absorption, which is teratogenic at high levels, and excess tissue damage)."},
         {step:"Patient-applied", title:"Imiquimod 5% cream (Aldara®)", when:"keratinised, larger or recurrent warts", fromLabel:"if podophyllotoxin unsuitable or failed",
          html:"Three nights per week (e.g. Mon/Wed/Fri) at bedtime, washed off after 6–10 hours, up to 16 weeks. Immune modulator (TLR7 agonist — stimulates local innate immunity); slower onset (4–8 weeks). The critical counselling: local erythema, swelling and erosion ARE the therapeutic mechanism — severity correlates with efficacy; stopping because of them is the commonest cause of failure. If severe, apply less or less often. Set an alarm to wash it off — left on too long it causes severe local damage."},
         {step:"Clinician-applied", title:"Cryotherapy (liquid nitrogen)", when:"small, hard, keratinised warts — or pregnancy", fromLabel:"trained clinician",
          html:"10–20 second freeze × 2 cycles per session, repeated 2–3 weekly. Safe in pregnancy. Side effects: blistering, pain, hypopigmentation. GP with training, GUM nurse or dermatology."},
         {step:"Clinician-applied", title:"Trichloroacetic acid (TCA) 80–90%", when:"soft warts on mucous membranes — the safest topical in pregnancy", fromLabel:"GUM-applied",
          html:"Applied to individual warts and allowed to dry (frosting); weekly, up to 6 sessions. Avoid spreading — it causes a chemical burn."},
         {step:"Refractory", title:"Specialist options", when:"persistent, extensive or obstructive", fromLabel:"GUM / dermatology / surgery",
          html:"Sinecatechins 10% ointment (Veregen® — green tea catechins, TDS up to 16 weeks, MHRA-licensed, modest evidence) · imiquimod 3.75% (Zyclara®) · intralesional interferon · cidofovir cream (immunocompromised, off-label) · surgical excision, electrosurgery/diathermy, CO₂ laser, LLETZ — under GA where needed for large, refractory or obstructive disease."}
       ]},
       {b:"warn", html:"No treatment eradicates HPV — every modality clears the visible warts only, and recurrence is common. <b>Podophyllotoxin and imiquimod are contraindicated in pregnancy</b> (teratogenicity; insufficient safety data respectively) — <b>TCA and cryotherapy are the pregnancy options</b>. Avoid over-the-counter skin-wart products on genital skin. If no improvement after 2 full podophyllotoxin cycles → switch modality or refer."},
       {b:"say", html:"These are genital warts — caused by an extremely common virus, and harmless in themselves. The cream clears the visible warts but the virus can sit quietly in the skin, so they sometimes come back — that's the virus waking up, not a new infection. If I give you imiquimod: the redness and soreness where you put it means it's working; wash it off after six to ten hours. And we'll check for other infections at the sexual-health clinic, because the same contact that passed this on can pass on things we can actually cure."}
     ]},

    {id:"prevention", nav:"Prevent", title:"Vaccination, partners and prevention", sub:"The prevention conversation outlasts the treatment — and includes a proven cancer-prevention step for high-risk groups.",
     blocks:[
       {b:"table", head:["Topic","Detail","Effect"], rows:[
         ["<b>HPV vaccination — Gardasil 9</b>","9-valent: HPV 6, 11, 16, 18, 31, 33, 45, 52, 58. NHS: routine to age 25 (school programme from Year 8); MSM to age 45 via GUM. BASHH recommends offering it to unvaccinated adults presenting with new warts","Does not treat existing warts (the HPV is already present) but protects against types not yet acquired — best before sexual debut, still beneficial after"],
         ["<b>Condoms</b>","Reduce HPV transmission by ~60–70% — partial, because HPV transmits skin-to-skin beyond the covered area","Still strongly advised, during and after treatment, and for the other STIs"],
         ["<b>Partner notification</b>","Current and recent partners informed and offered GUM assessment and vaccination — partners often carry subclinical HPV with no visible lesions","GUM partner-notification officers; SXT app for anonymous notification; the decision to disclose is the patient's — support it"],
         ["<b>Smoking cessation</b>","Smoking suppresses local cell-mediated immunity: a major risk factor for recurrence and for progression of HPV dysplasia. NHS Stop Smoking referral","<b>“Stopping smoking directly reduces the chance the warts come back”</b> — a genuinely motivating frame"],
         ["<b>Immune optimisation</b>","Sleep 7–9 hours (T-cell function is impaired with &lt;6 h sleep), moderate exercise, alcohol moderation, adequate zinc / vitamin D / vitamin A","Supports the immune clearance that ultimately resolves the infection"],
         ["<b>Cervical screening</b>","Ensure up to date — 25–49 every 3 years, 50–64 every 5; HPV primary screening standard","The actual cancer-prevention tool"],
         ["<b>Anal-cancer surveillance (MSM / HIV+)</b>","Anal SCC incidence in HIV-positive MSM ≈ 100 per 100,000 vs 2 per 100,000 general population. GUM referral for anal cytology and high-resolution anoscopy (HRA) in high-risk groups","ANCHOR trial (2021): treating anal HSIL in HIV-positive patients cuts anal-cancer risk by ~57% — surveillance is proven cancer prevention"],
         ["<b>Support</b>","Terrence Higgins Trust (tht.org.uk); Herpes Viruses Association HPV resources; GUM counselling","Where the psychosexual work continues"]
       ]}
     ]},

    {id:"psycho", nav:"The conversation", title:"The psychosexual conversation — three minutes that change everything", sub:"The diagnosis routinely causes more harm through shame and false inference than through the lesions. Address it explicitly.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"cream", h:"💬 What to actually say", html:"HPV is the most common STI — about 80% of sexually active people acquire it at some point, and lifetime wart prevalence is ~10%. It transmits by skin-to-skin contact even with condoms. It can lie dormant for months to years, so warts appearing now does NOT mean recent acquisition, a new partner, or infidelity. The types that cause visible warts do not cause cancer. It is treatable. Three minutes on this, said specifically rather than generically, measurably reduces anxiety and improves treatment adherence."},
         {tone:"cream", h:"🔁 The recurrence talk — give it BEFORE recurrence", html:"After clearance, 30–50% recur within 6 months — almost always reactivation of latent HPV in the basal epithelium (triggered by illness, stress, poor sleep, alcohol), not re-infection from a partner. Patients who aren't told this assume their partner is re-infecting them, with real relationship damage. After 12 months recurrence-free the reactivation risk falls substantially; most viral clearance occurs within 2 years. Screen mood (PHQ-9) where distress is apparent; GUM psychosexual counselling where relationships or sexual function are affected."}
       ]}
     ]},

    {id:"monitor", nav:"Follow-up", title:"Follow-up and safety-netting", sub:"One review during treatment, one conversation at clearance, and a short list of return-immediately triggers.",
     blocks:[
       {b:"table", head:["When","What","Action"], rows:[
         ["<b>4–6 weeks into patient-applied treatment</b>","<b>Clearing? Local reaction manageable? Technique correct?</b>","No improvement after 2 full podophyllotoxin cycles → switch to imiquimod or refer for cryotherapy. Document the response"],
         ["<b>On clearance</b>","The recurrence conversation (above); confirm the STI screen was done and actioned, vaccination offered, partner notification addressed","No test-of-cure required. Recurrence → re-treat (same or alternative topical)"],
         ["<b>Multiple / excessive recurrences</b>","<b>Rethink, don't just re-treat</b>","HIV test if not done; immunosuppression screen; biopsy atypical lesions; refer if persistent"],
         ["<b>Within 2 weeks</b>","<b>Severe imiquimod reaction (severe ulceration, systemic symptoms)</b>","Stop, review, consider dose reduction. New wart sites during treatment → extend the treated area or refer"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔙 Return immediately", html:"A rapidly enlarging mass not responding to treatment → 2WW · anal bleeding + change in bowel habit with perianal lesions → 2WW · warts appearing in a child → same-day safeguarding referral."},
         {tone:"blue", h:"🩺 Routine", html:"Cervical screening registration confirmed · PHQ-9 follow-up where distress was apparent · smoking-cessation progress."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — who, when, how urgently", sub:"GUM is the default for every new case; the 2WW routes are for the mimics.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Safeguarding — same day", html:"Any child with anogenital warts → paediatric safeguarding referral BEFORE treatment, at the identifying visit."},
         {tone:"purple", h:"Urgent suspected cancer <span class='tw'>2WW</span> · NICE NG12", html:"<b>Unexplained anal mass or anal ulceration → 2WW anal cancer</b> (incl. suspected Buschke–Löwenstein and anal warts + rectal bleeding + change in bowel habit) · <b>unexplained vulval lump, ulceration or bleeding → 2WW vulval pathway</b> (suspected VIN/SCC) · penile mass or ulcerated lesion with STI excluded, or persisting after STI treatment → 2WW penile pathway (suspected PIN, atypical bowenoid papulosis) · atypical wart-like lesion — pigmented, indurated, ulcerated — failing standard treatment → 2WW dermatology/gynaecology/colorectal with mandatory biopsy.", src:"NICE NG12 (updated May 2025)"},
         {tone:"amber", h:"GUM / sexual health — all new cases ideally", html:"Full STI screen with multi-site sampling (MSM especially), internal examination for intra-anal or intraurethral warts, the full treatment range (cryotherapy, TCA, podophyllotoxin), partner notification, HIV and syphilis testing, vaccination of eligible MSM. GP management of simple external warts is reasonable when confident, with screening arranged and follow-up clear — <b>GUM remains the standard of care for the initial assessment.</b>"},
         {tone:"blue", h:"Dermatology / GUM (routine)", html:"Extensive warts needing specialist treatment (cryotherapy, TCA, laser, excision) · treatment-resistant after 2 GP cycles · immunocompromised patients · pregnancy with extensive warts or near delivery."},
         {tone:"blue", h:"Gynaecology / colposcopy / obstetrics", html:"Warts + abnormal cervical smear · histologically confirmed VIN2/3 · vaginal warts needing specialist treatment · delivery planning where introital warts are extensive (caesarean occasionally required for birth-canal obstruction)."},
         {tone:"plain", h:"Urology / ENT", html:"Intraurethral warts (urethroscopy ± laser) · suspected Buschke–Löwenstein (with colorectal) · recurrent respiratory papillomatosis → ENT."},
         {tone:"green", h:"GP manages", html:"Simple external warts with confident diagnosis: podophyllotoxin or imiquimod with correct-technique counselling, the 4–6-week review, STI screening arranged, vaccination check, smoking cessation, the recurrence and psychosexual conversations."}
       ]}
