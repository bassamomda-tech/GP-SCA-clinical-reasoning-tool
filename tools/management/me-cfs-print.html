<script>
MG.render({
  icon:"🔋",
  title:"ME/CFS — the complete guide",
  eyebrow:"Protocol · NICE NG206 · a positive diagnosis, and a prohibition",
  stemTitle:"NG206 reframed this condition twice over: the diagnosis is POSITIVE — suspected at 6 weeks and made on criteria at 3 months — rather than after years of exclusion — and fixed graded exercise therapy is not merely unhelpful but capable of harm",
  stemSub:"One page for the whole condition. <b>Post-exertional malaise is the central feature</b> — a delayed, disproportionate worsening after activity. ME/CFS is suspected after 6 weeks of the four key symptoms and diagnosed at 3 months when there is no better explanation, with direct referral to the specialist ME/CFS team — not withheld indefinitely. Management is <b>patient-led energy management within the energy envelope</b>, symptom control, and a personalised care and support plan. Do NOT prescribe fixed or incremental graded exercise therapy, do not advise pushing through, and do not offer any therapy as a cure — including CBT, which may be offered as supportive therapy for coping, distress, mood or sleep but is not a cure.",
  guideline:"NICE NG206 (2021)",
  reviewed:"14 September 2026",
  nextReview:"14 March 2027",
  meta:[
    {t:"NICE NG206 — ME/CFS diagnosis and management"},
    {t:"Do NOT offer fixed or incremental GET"},
    {t:"Suspect at 6 weeks · diagnose and refer at 3 months"},
    {t:"v2.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#diagnose"><b>Diagnose</b><small>PEM · 6 weeks · 3 months</small></a><a href="#energy"><b>Energy</b><small>Pacing, not GET</small></a><a href="#symptoms"><b>Symptoms</b><small>Targeted</small></a><a href="#follow"><b>Support</b><small>Care plan</small></a><a href="#refer"><b>Refer</b><small>Specialist · severe</small></a></div>',
  quickSub:"The six that matter. Sources are listed under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⛔ Do NOT offer fixed or incremental graded exercise therapy", html:"NG206 is explicit: do not offer any programme based on the premise that ME/CFS is caused by deconditioning, and do not advise \"push through\". <b>This can cause harm.</b> CBT may be offered as supportive therapy for coping, distress, mood or sleep — but it should not be presented as a cure, as treatment for an assumed psychological cause, or as a replacement for energy management and physical symptom care, because offering it as one is the failure that has done most damage to trust in this condition."},
    {tone:"blue", h:"Post-exertional malaise is the central feature", html:"Four key symptoms: debilitating fatigue or fatiguability, post-exertional malaise, unrefreshing sleep or sleep disturbance, and cognitive difficulty (\"brain fog\"), with significant functional impairment. Post-exertional malaise is a delayed and disproportionate worsening of symptoms after activity that was previously tolerated — physical, cognitive, emotional or social — often beginning hours or 1–2 days later and lasting days or longer. Orthostatic intolerance is commonly associated but is not one of the four required symptoms. <b>The delay is what patients describe and clinicians miss</b>: they feel able at the time and are wiped out the next day."},
    {tone:"amber", h:"Suspect at 6 weeks, diagnose and refer at 3 months", html:"Suspect ME/CFS in an adult with all four characteristic symptoms for at least 6 weeks, significant reduction in function and no better alternative explanation; continue assessment, give interim symptom-management advice and review sooner if symptoms change or worsen. At 3 months, if the four symptoms persist and are not explained by another condition, make the diagnosis and refer directly to the local ME/CFS specialist team for confirmation, severity assessment and a personalised care and support plan. NG206 made this a POSITIVE diagnosis on criteria, not a label of last resort after years — delaying it denies people the care plan and adjustments they need."},
    {tone:"blue", h:"Baseline investigations — targeted, and repeated when things change", html:"Urinalysis (protein, blood, glucose), FBC, U&amp;Es, LFTs, TFTs, ESR or plasma viscosity, CRP, calcium and phosphate, HbA1c, ferritin, coeliac serology and CK — plus others by clinical judgement and the history (for example vitamin D, B12 and folate, infection serology, 9am cortisol, autoimmune testing, sleep assessment, ECG or further cardiac assessment). These look for anaemia, thyroid disease, coeliac disease, diabetes, and inflammatory and infective causes; they are not a diagnostic test for ME/CFS and do not exclude every alternative. Assess mood and mental health — a comorbid mental-health condition does not exclude ME/CFS. Do not repeat broad investigations indefinitely when the picture is stable, but repeat or extend them if new symptoms, progressive deterioration, examination abnormalities or a change in pattern occurs."},
    {tone:"green", h:"Energy management means staying inside the envelope", html:"Energy management aims to help the person remain within their current energy limits, minimise post-exertional malaise and avoid boom-and-bust cycles. It is not a fixed exercise programme. If the patient wishes to progress activity, this should be overseen by a physiotherapist or occupational therapist within an ME/CFS specialist team, with flexible adjustment up or down according to symptoms — because generic rehabilitation advice tends towards exactly the graded increases NG206 warns against."},
    {tone:"amber", h:"Red flags — reassess for another or coexisting diagnosis", html:"New unexplained weight loss, persistent fever, night sweats, lymphadenopathy, focal neurological signs, progressive weakness, objective inflammatory findings, persistent abnormal blood results or a substantially changing pattern → reassess for an alternative or coexisting diagnosis. In severe or very severe disease — housebound or bedbound — assess nutrition, hydration, pressure areas, falls, sensory hypersensitivity, communication and safeguarding; rapid deterioration, unsafe intake, severe dehydration, new focal neurological signs or acute confusion need urgent assessment."}
  ],
  pathwaySub:"Five steps, and the second is where most harm has historically been done.",
  pathway:[
    {title:"Suspect at 6 weeks and assess", html:"All four key symptoms — fatigue, post-exertional malaise, unrefreshing sleep and cognitive difficulty — for at least 6 weeks, with significant functional impairment. <b>Baseline investigations guided by the history and examination</b>; interim symptom-management advice and review."},
    {title:"Diagnose at 3 months and refer", html:"Symptoms persisting for 3 months with no better alternative explanation — make the diagnosis and refer directly to the local ME/CFS specialist team for confirmation, severity assessment and a care and support plan.", alert:true},
    {title:"Support energy management — never fixed GET", html:"Flexible energy management within current limits, avoiding boom and bust; any activity progression only if the patient wishes, overseen within the ME/CFS specialist team. <b>No incremental exercise programmes, no \"push through\".</b>"},
    {title:"Treat the symptoms on their own merits", html:"Pain, sleep, orthostatic intolerance (cautiously), mood. ME/CFS is a physical illness and should not be attributed to psychological distress alone; treat coexisting depression or anxiety on their own merits without implying that they explain away the ME/CFS."},
    {title:"Build the care plan and refer", html:"Personalised care and support plan, regular review, specialist ME/CFS service, and proactive support in severe disease."}
  ],
  sections:[

    {id:"diagnose", nav:"Diagnose", title:"Step 1 — diagnosing on NG206 criteria and excluding mimics",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>Suspect — from 6 weeks</b>","In an adult with all four for at least 6 weeks: debilitating fatigue or fatiguability PLUS post-exertional malaise PLUS unrefreshing sleep or sleep disturbance PLUS cognitive difficulties (\"brain fog\"), with significant reduction in occupational, educational, social or personal functioning and no better alternative explanation. Give interim symptom-management advice and arrange review"],
         ["<b>Post-exertional malaise</b>","A delayed and disproportionate worsening of symptoms after activity that was previously tolerated. It may follow physical, cognitive, emotional or social activity, often begins hours or 1–2 days later, and may persist for days or longer — the person may appear relatively well during the activity and deteriorate later"],
         ["<b>Associated, not required</b>","Orthostatic intolerance is commonly associated but is not one of the four diagnostic symptoms"],
         ["<b>Diagnose and refer — at 3 months</b>","If the four symptoms persist for 3 months and are not explained by another condition, complete or review the clinical assessment, make the diagnosis and refer directly to the local ME/CFS specialist team for confirmation, severity assessment and a personalised care and support plan (NG206)"],
         ["<b>Investigate</b>","Urinalysis (protein, blood, glucose), FBC, U&amp;Es, LFTs, TFTs, ESR or plasma viscosity, CRP, calcium and phosphate, HbA1c, ferritin, coeliac serology and CK — plus others by clinical judgement and the history (for example vitamin D, B12 and folate, infection serology, 9am cortisol, autoimmune testing, sleep assessment, ECG or further cardiac assessment). These look for anaemia, thyroid disease, coeliac disease, diabetes, and inflammatory and infective causes; they are not a diagnostic test for ME/CFS and do not exclude every alternative. Do not repeat broad investigations indefinitely when the picture is stable, but repeat or extend them if new symptoms, progressive deterioration, examination abnormalities or a change in pattern occurs"],
         ["<b>Assess</b>","Severity, functional impact, and comorbidity. Assess mood and mental health, recognising that a comorbid mental-health condition does not exclude ME/CFS and that post-exertional malaise remains diagnostically important. Consider orthostatic intolerance, sleep-disordered breathing where indicated, migraine, fibromyalgia, IBS and autonomic dysfunction as comorbidities rather than alternative explanations that must be excluded"]
       ]},
       {b:"why", html:"NG206 reframed ME/CFS: post-exertional malaise is central, and the diagnosis is positive — suspected at 6 weeks and made on criteria at 3 months when there is no better explanation, with referral to a specialist ME/CFS team. Crucially, it warns against fixed graded exercise programmes and against any therapy presented as curative. Both halves matter equally: diagnosing late withholds support, and treating with incremental exercise causes harm."}
     ]},

    {id:"energy", nav:"Energy", title:"Step 2 — energy management and support",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"🔋 Pacing", html:"Energy management aims to help the person remain within their current energy limits, minimise post-exertional malaise and avoid boom-and-bust cycles. It is not a fixed exercise programme: no fixed incremental increases and no advice to push through. If the patient wishes to progress activity, a physiotherapist or occupational therapist within an ME/CFS specialist team should oversee it, adjusting up or down according to symptoms."},
         {tone:"blue", h:"🛌 Sleep", html:"<b>Sleep hygiene; manage unrefreshing and disrupted sleep.</b> Avoid over-sleeping advice that does not help."},
         {tone:"amber", h:"🧠 Support, not cure", html:"<b>CBT may be offered as supportive therapy for coping, distress, mood or sleep — NOT as a cure.</b> Do not present it as treatment for an assumed psychological cause, or as a replacement for energy management and physical symptom care, or the offer itself damages trust."},
         {tone:"green", h:"🍽️ Nutrition and comorbidity", html:"Maintain nutrition and hydration; manage orthostatic intolerance cautiously; treat pain, mood, sleep, migraine and IBS-type symptoms as comorbidities."}
       ]},
       {b:"warn", html:"Do NOT offer fixed or incremental graded exercise therapy (GET), or any programme based on the premise that ME/CFS is caused by deconditioning, and do not advise \"push through\" — this can cause harm (NG206)."}
     ]},

    {id:"symptoms", nav:"Symptoms", title:"Step 3 — targeted symptom control",
     blocks:[
       {b:"table", head:["Symptom","Approach"], rows:[
         ["<b>Pain</b>","Analgesia according to cause; neuropathic agents if there are neuropathic features"],
         ["<b>Sleep</b>","<b>Address insomnia with cautious, time-limited approaches</b>"],
         ["<b>Orthostatic intolerance</b>","Assess posture-related dizziness, palpitations, presyncope, visual disturbance and symptom relief on lying down. <b>Review medications and consider hydration or salt advice only after checking cardiovascular and renal comorbidity</b> — not appropriate for everyone (for example hypertension, heart failure, CKD, fluid restriction, significant autonomic or renal disease). Specialist advice is required before prescribing medication for orthostatic intolerance; refer to secondary care if symptoms are severe, worsening, associated with syncope or diagnostically uncertain"],
         ["<b>Mood</b>","ME/CFS is a physical illness and should not be attributed to psychological distress alone. Depression and anxiety may coexist, need assessment and should be treated on their own merits without implying that they explain away the ME/CFS"],
         ["<b>Medicines</b>","Start low and go slow where medication is required — medication sensitivity is commonly reported. Review sedating medicines and polypharmacy, and do not attribute medication adverse effects to ME/CFS"]
       ]}
     ]},

    {id:"follow", nav:"Support", title:"Step 4 — ongoing support under NG206",
     blocks:[
       {b:"dl", rows:[
         ["<b>Regular review — personalised care</b>","Review at agreed intervals and coordinate a personalised care and support plan (NG206). Manage symptoms individually — sleep, pain, comorbid mood. <b>Do NOT offer graded exercise therapy as a cure</b>"],
         ["<b>Energy management</b>","Support flexible energy management within the individual's current limits to avoid post-exertional malaise — not a fixed activity prescription. <b>Any activity progression only if the patient wishes, overseen by a physiotherapist or OT within the ME/CFS specialist team</b>"],
         ["<b>Worsening or severe</b>","Refer directly to the specialist ME/CFS team at 3 months for confirmation and care planning, and for complex or severe disease. For severe or very severe ME/CFS, assess nutrition, hydration, weight, pressure areas, mobility, falls, venous thromboembolism risk from immobility, continence, medication administration, communication needs, sensory hypersensitivity, safeguarding and carer support; arrange proactive home-based care rather than expecting the person to attend routine appointments"]
       ]},
       {b:"say", html:"There's no quick fix, and I'm not going to pretend otherwise. The foundation is careful pacing within your energy limits — and specifically not a programme of gradually increasing exercise, because for this condition that can make people worse rather than better. We'll build a plan around your worst symptoms, review it regularly, and get you in to the specialist service."}
     ]},

    {id:"safety", nav:"Red flags", title:"Red flags — reassess for an alternative or coexisting diagnosis",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Alarm features", html:"New unexplained weight loss, persistent fever, night sweats, lymphadenopathy, focal neurological signs, progressive weakness, objective inflammatory findings, persistent abnormal blood results or a substantially changing clinical pattern → reassess for an alternative or coexisting diagnosis. Also consider new severe headache, visual loss, chest pain or syncope, marked breathlessness, recurrent infection, symptoms of malignancy, inflammatory rheumatological symptoms and sleep-disordered breathing. These do not exclude ME/CFS — a person may have ME/CFS and a second condition."},
         {tone:"red", h:"🔴 Severe or housebound", html:"Rapid deterioration, unsafe intake, severe dehydration, new focal neurological signs or acute confusion → urgent assessment for an alternative or additional condition, with safeguarding-aware specialist review."},
         {tone:"amber", h:"💬 Safety-net", html:"\"If you lose weight unintentionally, develop fevers or lumps, or get new neurological symptoms, tell us — those need checking for another cause, alongside your ME/CFS.\""},
         {tone:"green", h:"✓ What we are aiming for", html:"\"Stability within your limits, fewer crashes, and a plan that flexes with how you are — rather than a target you have to hit.\""}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral and severe disease",
     blocks:[
       {b:"cards", items:[
         {tone:"blue", h:"Specialist ME/CFS service", html:"At 3 months, refer directly to the local ME/CFS specialist team to confirm the diagnosis, assess severity and develop a personalised care and support plan, with multidisciplinary energy-management support."},
         {tone:"red", h:"Severe or very severe disease", html:"Housebound or bedbound — proactive home-based care and home visits rather than routine appointments, with coordinated multidisciplinary input. Assess nutrition, hydration, weight, pressure areas, VTE risk from immobility, mobility and falls, continence, medication management, communication needs, sensory hypersensitivity, safeguarding and carer support."},
         {tone:"amber", h:"Investigate", html:"Atypical features, new red flags or a changing pattern → reassess, and repeat or extend investigations for an alternative or coexisting diagnosis. Severe, worsening or syncopal orthostatic symptoms, or diagnostic uncertainty → secondary care."},
         {tone:"blue", h:"Mental health", html:"<b>If there is significant comorbid depression or anxiety.</b> See <a href='depression.html'>depression</a> and <a href='anxiety.html'>anxiety</a>."},
         {tone:"cream", h:"GP management", html:"Suspicion at 6 weeks, the positive diagnosis at 3 months with specialist referral, targeted investigations, energy management, symptom control, the personalised care and support plan and regular review all belong here. Related pages: <a href='chronic-pain.html'>chronic pain</a> · <a href='insomnia.html'>insomnia</a> · <a href='depression.html'>depression</a> · <a href='malnutrition.html'>malnutrition</a> · <a href='../algorithms/fatigue.html'>fatigue pathway</a>."}
       ]},
       {b:"say", html:"This is ME/CFS. The key feature is that even small amounts of activity can leave you much worse for a day or more — so management is about pacing and staying within your energy limits, not pushing through or a fixed exercise plan, which can make things worse. We'll rule out other causes, support your symptoms, and refer you to a specialist service."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 29-year-old teacher has had 7 months of disabling fatigue since a viral illness. She describes being able to manage a short walk, then being <b>bedbound for the following two days</b>. Sleep is unrefreshing and she cannot concentrate enough to mark work. Bloods 5 months ago were normal. A previous clinician told her to \"build up her exercise gradually\" and she is <b>worse since trying</b>. She is <b>tearful</b> and asks whether it is \"all in her head\". She has <b>lost no weight</b> and has no lumps or fevers."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Identifies the two-day delayed crash as post-exertional malaise — the central NG206 feature — and says so explicitly, which is itself validating; makes a POSITIVE diagnosis rather than deferring: seven months of characteristic symptoms, significant functional impairment, an appropriate clinical assessment and no better alternative explanation supports the diagnosis — normal blood tests alone do not confirm ME/CFS — and NG206 expects diagnosis and specialist referral at 3 months; explicitly names that the graded-exercise advice she was given is no longer recommended and can cause harm, and that her deterioration is a recognised consequence rather than her fault; answers \"is it all in my head?\" directly — ME/CFS is a physical illness and not explained by psychological distress alone, while still assessing and addressing her low mood on its own merits; <b>checks the baseline investigations were complete</b>, repeating or extending them only if the picture has changed; <b>explains pacing and the energy envelope</b>, and refers to OT or physio experienced specifically in ME/CFS; <b>refers to the specialist ME/CFS service</b>; offers CBT only for coping and distress, with the explicit caveat that it is not a cure; and <b>safety-nets the red flags that would prompt reassessment for another or coexisting diagnosis.</b>"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Statements on this page are referenced to NICE NG206.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>NICE NG206 — Myalgic encephalomyelitis (or encephalopathy) / chronic fatigue syndrome: diagnosis and management (2021)<br><a href="https://www.nice.org.uk/guidance/ng206" rel="noopener">nice.org.uk/guidance/ng206</a><span class="rd"> — post-exertional malaise as a core diagnostic feature, suspicion after 6 weeks of the four symptoms, diagnosis and direct referral to a specialist ME/CFS team at 3 months, the recommendation against any programme based on fixed or incremental increases in physical activity or on a deconditioning model, CBT offered to support coping rather than as a cure, energy management within the energy envelope (not an exercise programme; any personalised physical activity programme only if the person wishes, overseen within an ME/CFS specialist team), orthostatic-intolerance medication overseen by a clinician with relevant expertise, the personalised care and support plan, and the specific provisions for severe and very severe disease</span></li>'+
         '<li><b>NICE NG206 \u2014 investigations to exclude alternative diagnoses</b><span class="rd"> — the blood-test screen quoted (urinalysis, FBC, U&amp;Es, LFTs, TFTs, ESR or plasma viscosity, CRP, calcium and phosphate, HbA1c, ferritin, coeliac serology, CK; vitamin D, B12, folate, serology and 9am cortisol by clinical judgement) and the conditions it is intended to exclude</span></li>'+
         '<li><b>NICE NG206 — ME/CFS</b><br><a href="https://www.nice.org.uk/guidance/ng206" rel="noopener">nice.org.uk/guidance/ng206</a><span class="rd"> — features prompting reassessment for an alternative or coexisting diagnosis (unintentional weight loss, lymphadenopathy, fever or night sweats, focal neurology), and repeating investigations when the clinical picture changes</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"ME/CFS in primary care — NICE NG206. Post-exertional malaise is the central feature, and the diagnosis is POSITIVE: suspected after 6 weeks of the four key symptoms and made on criteria at 3 months when there is no better explanation, with direct referral to the specialist ME/CFS team — not withheld for years. Management is flexible energy management within the person's current limits (not a fixed activity prescription), targeted symptom control, and a personalised care and support plan. Do NOT offer fixed or incremental graded exercise therapy, any programme premised on deconditioning, or advice to push through — this can cause harm. CBT may support coping, distress, mood or sleep but is not a cure, and must be offered as such. Weight loss, lymphadenopathy, persistent fever, focal neurology or a changing pattern mean reassessing for an alternative or coexisting diagnosis. Give fluid or salt advice for orthostatic intolerance only after checking cardiovascular and renal comorbidity. Verify against current NICE NG206."
});
</script>
