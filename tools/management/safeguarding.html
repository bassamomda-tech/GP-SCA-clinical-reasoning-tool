<script>
MG.render({ snapshot:"summaries/safeguarding.html",
  icon:"\u{1F6E1}️",
  title:"Safeguarding in primary care — children, adults and domestic abuse",
  eyebrow:"Protocol · recognise, respond, refer, record",
  stemTitle:"Safeguarding in primary care — think the unthinkable, act on reasonable concern, and share information to protect",
  stemSub:"One page for the whole safeguarding task in general practice: when to suspect child maltreatment (NICE CG89 and NG76) and what to do under Working Together to Safeguard Children 2023; adults at risk under the Care Act 2014; domestic abuse, coercive control, DASH and MARAC; the FGM mandatory reporting duty; Prevent; modern slavery and the National Referral Mechanism; Gillick competence and the Fraser guidelines; information sharing, documentation and who to contact. It does not replace your local safeguarding partnership procedures, which set the exact referral routes and forms.",
  guideline:"Working Together to Safeguard Children (2023) · NICE CG89 (2009, updated 2017) · NICE NG76 (2017) · Care Act 2014 · Domestic Abuse Act 2021 · NICE PH50 (2014) · FGM Act 2003 (mandatory reporting from 2015) · Prevent duty guidance (2023) · Modern Slavery Act 2015",
  reviewed:"15 October 2026",
  nextReview:"15 April 2027",
  meta:[
    {t:"Working Together to Safeguard Children (2023)"},

  lead:'<div class="mg-layers"><a href="#severe"><b>Act now</b><small>Immediate danger · same day</small></a><a href="#children"><b>Children</b><small>Suspect vs consider</small></a><a href="#adults"><b>Adults</b><small>Care Act s42</small></a><a href="#domestic"><b>Domestic abuse</b><small>DASH · MARAC · IRIS</small></a><a href="#share"><b>Share &amp; record</b><small>Consent · documentation</small></a></div>',
  quickSub:"If you read nothing else, read these six cards. Your local safeguarding partnership procedures set the exact referral routes.",
  quick:[
    {tone:"red", h:"⚠ Immediate danger → 999", html:"A child or adult in immediate danger, a serious assault, or a perpetrator present and threatening → <b>999</b> (police). Do not delay to seek consent or to discuss first. A patient who cannot speak can dial 999 and press <b>55</b> on a mobile (Silent Solution)."},
    {tone:"red", h:"Suspect child maltreatment → children’s social care today", html:"NICE CG89: if you <b>suspect</b> maltreatment (a serious level of concern), <b>refer to children’s social care</b> (the local ‘front door’ or MASH) the same day, following local procedures. If you only <b>consider</b> it (one possible explanation), look for other features, discuss with a colleague or the practice safeguarding lead, gather collateral information and arrange follow-up. <b>Any bruise in a baby who is not independently mobile</b> → suspect and refer under the local bruising protocol."},
    {tone:"amber", h:"Adults at risk — Care Act 2014", html:"An adult with care and support needs, who is experiencing or at risk of abuse or neglect, and cannot protect themselves because of those needs → raise a concern with <b>adult social care</b>, which decides on a section 42 enquiry. Make it personal: ask what the person wants, and assess capacity for the specific decision. Share without consent when others are at risk, a serious crime is involved, or the person lacks capacity or is being coerced."},
    {tone:"amber", h:"Domestic abuse — ask, alone, and act", html:"Ask about domestic abuse privately, never with a partner, family member or child present, and use a professional interpreter. Coercive and controlling behaviour is a crime. Complete a <b>DASH risk checklist</b> (with the IRIS advocate-educator or IDVA where available): <b>14 or more ‘yes’ answers, professional judgement or escalation → MARAC</b>. Children who see, hear or experience the effects of the abuse are victims in their own right — consider children’s safeguarding."},
    {tone:"blue", h:"FGM — the mandatory reporting duty", html:"If a girl <b>under 18</b> tells you she has had FGM, or you <b>see physical signs</b> of it, you must personally <b>report to the police on 101</b> — as soon as possible, by the close of the next working day as best practice and within 1 month at the latest — and also follow safeguarding procedures. Suspected or ‘at risk’ cases, and women aged 18 or over, are not covered by the duty but need safeguarding action (including for daughters). Record FGM in the FGM Enhanced Dataset."},
    {tone:"green", h:"Record, share, and never investigate alone", html:"Record facts, the person’s own words, who was present, what you saw (a body map), your concern and what you did, with the date and time. Information sharing to protect a child or an adult at risk is lawful: the duty to share can be as important as the duty to protect confidentiality. The GP’s role is to recognise, respond and refer — investigation is for social care and police."}
  ],
  pathwaySub:"The safeguarding task in five moves. The red step is the one that most often goes wrong — the referral that is delayed while we wait to be sure.",
  pathway:[
    {title:"Recognise", html:"Alerting features in the history, presentation, examination or behaviour; patterns over time (frequent attendance, ‘Was not brought’, injuries inconsistent with the explanation, disclosure). Think about every child in the household, and about the adult behind the child."},
    {title:"Respond to the person", html:"Listen, do not lead, and do not promise secrecy. Ensure immediate safety. Treat any injury or medical need. Speak to a child or young person alone where appropriate. Use a professional interpreter."},
    {title:"Discuss and decide", html:"Practice safeguarding lead, named GP for safeguarding or the ICB safeguarding team — but do not let discussion delay a referral when you suspect harm. Decide: suspect (refer) or consider (gather information, review)."},
    {title:"Refer the same day", html:"Children’s social care or MASH; adult social care; police (999 for immediate danger; 101 for FGM in under-18s); MARAC through the IDVA or DASH; Prevent; NRM through a first responder. Follow up a phone referral in writing within the local timescale, and check that it was received.", alert:true},
    {title:"Record and review", html:"Contemporaneous notes with facts and quotes; safeguarding codes and alerts on the right records; contribute to child protection conferences and strategy meetings; review at the next contact."}
  ],
  sections:[

    {id:"severe", nav:"Act now", title:"Act now — the situations that cannot wait",
     sub:"Time frames use the site’s fixed labels. Local procedures may set shorter ones.",
     blocks:[
       {b:"table", head:["Situation","Action","Time frame"], rows:[
         ["Child or adult in immediate danger; perpetrator present and threatening; serious assault","Police — 999. Keep the person safe; do not confront the alleged perpetrator","999"],
         ["Suspected maltreatment of a child (NICE CG89 ‘suspect’), including any bruise in a non-mobile baby, a disclosure, or an injury inconsistent with the explanation","Refer to children’s social care / MASH by phone, follow up in writing; arrange paediatric assessment through the local child protection medical pathway if injured","Same-day"],
         ["Child sexual abuse disclosed or suspected; child under 13 who is sexually active","Children’s social care and police per local procedures; do not examine intimately in primary care — the child protection medical is specialist (sexual assault referral centre)","Same-day"],
         ["Known FGM in a girl under 18 (disclosed by her, or physical signs seen)","Personal report to police on 101 (mandatory duty) and children’s social care referral; if recently cut or at imminent risk of being taken abroad → 999","Same-day (by close of next working day at the latest as best practice)"],
         ["Adult at risk with serious harm or ongoing abuse","Adult social care safeguarding concern; police if a crime","Same-day"],
         ["Domestic abuse assessed as high risk (DASH ≥14, professional judgement or escalation)","MARAC referral via the IDVA/local process; safety plan; check children","Same-day"],
         ["Allegation against a person who works with children","Local Authority Designated Officer (LADO)","Within 1 working day"],
         ["Concern about radicalisation with no immediate threat","Practice/ICB Prevent lead; local Prevent referral","Urgent"]
       ]},
       {b:"warn", html:"<b>Do not delay a referral to gather proof, to speak to the parent first when that could place the child at risk, or because a colleague or another agency is ‘probably dealing with it’.</b> Working Together 2023: anyone with a concern about a child’s welfare should refer to children’s social care, and should press for reconsideration if they still have concerns after the response."}
     ]},

    {id:"children", nav:"Children", title:"Children — when to suspect maltreatment, and what to do",
     sub:"NICE CG89 (when to suspect child maltreatment) and NICE NG76 (child abuse and neglect). Working Together to Safeguard Children 2023 sets the statutory framework in England.",
     blocks:[
       {b:"dl", rows:[
         ["<b>‘Suspect’</b>","A serious level of concern about the possibility of maltreatment, not proof. <b>Refer to children’s social care</b> following local procedures"],
         ["<b>‘Consider’</b>","Maltreatment is one possible explanation. Listen and observe, seek an explanation, gather collateral information (health visitor, school nurse, other records), discuss with a more experienced colleague or the safeguarding lead, and ensure review. If the concern grows to ‘suspect’, refer"],
         ["<b>‘Exclude’</b>","A suitable explanation has been found. Record it"]
       ]},
       {b:"table", head:["Alerting feature (NICE CG89, selected)","Level"], rows:[
         ["<b>Bruising in a child who is not independently mobile</b>; bruising in the shape of a hand, ligature, stick or teeth marks; bruises on the ears, neck, cheeks, eyes, or soft parts; multiple bruises in clusters","Suspect"],
         ["Fractures with an absent or unsuitable explanation; multiple fractures of different ages; fractures in a non-mobile child","Suspect"],
         ["Burns or scalds in an unusual site or pattern (for example glove-and-stocking immersion, cigarette burns), or with an unsuitable explanation","Suspect"],
         ["Anogenital symptoms or signs, or a sexually transmitted infection, without a medical explanation; pregnancy in a child under 13","Suspect"],
         ["Persistent failure to meet basic needs (food, hygiene, clothing, supervision, access to health care) — neglect; faltering growth without a medical cause","Consider → suspect if persistent"],
         ["Repeated <b>‘Was not brought’</b> to appointments or immunisations, delay in seeking help, or an explanation that changes","Consider"],
         ["Behaviour change: withdrawal, sexualised behaviour, self-harm, running away, unexplained money or phones, older ‘boyfriends’ — exploitation (CSE, criminal exploitation, county lines)","Consider → suspect"],
         ["Reported symptoms or signs not explained by any illness, or repeated presentations driven by a parent — perplexing presentations or fabricated or induced illness","Consider; discuss with the named or designated doctor"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"Think family — the ‘toxic trio’ and beyond", html:"Parental substance misuse, domestic abuse and parental mental illness, together with learning disability, young parents, previous children removed, and a new partner in the household, increase risk. Ask about children in the household whenever an adult discloses these. Unborn babies count: refer pre-birth where there are concerns."},
         {tone:"blue", h:"What happens after referral", html:"Children’s social care decides within one working day what response is needed: no further action, early help, a child in need assessment (section 17, Children Act 1989), or a strategy discussion and section 47 enquiry where there is reasonable cause to suspect significant harm. GPs are expected to share information promptly and contribute to strategy discussions and child protection conferences."},
         {tone:"cream", h:"Early help", html:"Not every concern needs a statutory referral. Families with emerging needs can be offered early help through the local authority, health visitor or school with their consent. Escalate if concerns grow."},
         {tone:"red", h:"Disclosure — how to respond", html:"Listen, keep calm, do not ask leading questions, do not promise to keep it secret, explain what will happen next, and record the child’s words verbatim with the time and who was present. Do not confront the alleged abuser."}
       ]}
     ]},

    {id:"adults", nav:"Adults", title:"Adults at risk — the Care Act 2014",
     sub:"Section 42 applies to an adult who has needs for care and support (whether or not they are being met), is experiencing or at risk of abuse or neglect, and as a result of those needs cannot protect themselves.",
     blocks:[
       {b:"table", head:["Type of abuse (Care and support statutory guidance)","Examples to ask about"], rows:[
         ["Physical; sexual; psychological or emotional","Unexplained injuries, fear of a carer, restraint, threats, humiliation"],
         ["Domestic abuse; modern slavery","Coercive control by a partner or family member; someone else holds documents, wages or controls movement"],
         ["Financial or material","Missing money, changes to wills, unpaid bills, a ‘friend’ with sudden control of finances or a power of attorney being misused"],
         ["Neglect and acts of omission; self-neglect","Missed medication, pressure ulcers, malnutrition, hoarding, refusing essential care"],
         ["Discriminatory; organisational","Harassment due to a protected characteristic; poor care practice in a care home or service"]
       ]},
       {b:"dl", rows:[
         ["<b>Six principles</b>","Empowerment, prevention, proportionality, protection, partnership and accountability. <b>Making Safeguarding Personal</b>: ask what outcome the person wants"],
         ["<b>Consent and capacity</b>","An adult with capacity can decline a safeguarding referral about themselves. Share information without consent when other adults or children are at risk, when a serious crime has been or may be committed, when the person lacks capacity for the decision (act in their best interests under the Mental Capacity Act 2005), or when they are subject to coercion or undue influence. Record your reasoning"],
         ["<b>Raising a concern</b>","Contact adult social care (local safeguarding adults procedures); call the police for a crime. The local authority decides whether a section 42 enquiry is needed. Ask for feedback"],
         ["<b>Care homes and services</b>","Concerns about a provider also go to the CQC and the commissioning ICB. Allegations against staff follow the provider’s and local authority’s procedures"]
       ]}
     ]},

    {id:"domestic", nav:"Domestic abuse", title:"Domestic abuse, coercive control, DASH, MARAC and IRIS",
     sub:"Domestic Abuse Act 2021: abusive behaviour between people aged 16 or over who are personally connected — physical or sexual abuse, violent or threatening behaviour, controlling or coercive behaviour, economic abuse, or psychological or emotional abuse. NICE PH50 and QS116.",
     blocks:[
       {b:"table", head:["Step","What to do"], rows:[
         ["<b>Ask</b>","Ask directly and privately when there are indicators: depression, anxiety, self-harm, substance misuse, unexplained injuries, repeated attendances, a partner who always attends or answers for the patient, gynaecological symptoms, pregnancy (abuse often starts or escalates in pregnancy). Never ask with a partner, family member or child over 2 present; use a professional interpreter"],
         ["<b>Coercive control</b>","A pattern of controlling the person’s money, phone, movements, friends, appearance or access to health care, often without physical violence — a criminal offence (Serious Crime Act 2015, section 76). Ask: ‘Does your partner ever stop you doing things, check your phone, or control money?’"],
         ["<b>Assess risk</b>","Use the SafeLives <b>DASH risk identification checklist</b> (24 questions). <b>14 or more ‘yes’ answers = high risk → MARAC</b>; also refer on professional judgement or escalation (for example 3 or more police call-outs in 12 months). Red flags: strangulation or choking, threats to kill, pregnancy, separation, stalking, escalating frequency, access to weapons"],
         ["<b>Refer</b>","High risk: MARAC (multi-agency risk assessment conference) through the IDVA (independent domestic violence adviser) or local process — consent is sought, but a high-risk referral can proceed without it. Any risk: the <b>IRIS</b> advocate-educator if your practice is in an IRIS area, local domestic abuse services, and the National Domestic Abuse Helpline (0808 2000 247, free, 24 hours). Men’s Advice Line 0808 801 0327. The Domestic Violence Disclosure Scheme (‘Clare’s Law’) lets a person ask police about a partner’s history"],
         ["<b>Safety plan</b>","Safe contact method and times; code words; a bag with documents and medicines; Silent Solution (999 then 55). Do not send letters or texts that could alert the perpetrator; mark the record so that online access and correspondence do not disclose the abuse"],
         ["<b>Children</b>","Children who see, hear or experience the effects of domestic abuse are victims in their own right. Consider a children’s social care referral, particularly when the risk is high or a child is harmed"],
         ["<b>Perpetrators</b>","If a patient discloses abusing a partner, prioritise the safety of the victim and any children; signpost to a respect-accredited perpetrator programme; share information when there is risk of serious harm"]
       ]},
       {b:"say", html:"I ask everyone in your situation about this because it is so common. Is anyone at home hurting you, frightening you, or controlling what you do? You don’t have to tell me anything you don’t want to, but if you do, I will listen, and we can make a plan together that keeps you and the children as safe as possible."}
     ]},

    {id:"fgm", nav:"FGM", title:"Female genital mutilation — the mandatory reporting duty and the FGM datasets",
     sub:"FGM is illegal in the UK and is child abuse. The mandatory reporting duty (section 5B, Female Genital Mutilation Act 2003, inserted by the Serious Crime Act 2015) applies to regulated health and social care professionals and teachers in England and Wales.",
     blocks:[
       {b:"table", head:["Situation","Duty","Action"], rows:[
         ["Girl <b>under 18</b> discloses that she has had FGM, or you <b>observe physical signs</b> during an examination done for another reason","<b>Mandatory — personal duty</b>","Report to the police on <b>101</b> yourself (it cannot be delegated) as soon as possible — best practice by the close of the next working day, and within 1 month at the latest. Record the police reference. Also refer to children’s social care and inform the safeguarding lead. 999 if recently cut or at imminent risk"],
         ["Parent or another person tells you a girl under 18 has had FGM; a girl is <b>at risk</b> of FGM","Not covered by the mandatory duty","Safeguarding referral to children’s social care / MASH; consider the FGM Protection Order route through police or social care"],
         ["Woman aged 18 or over with FGM","Not covered","Clinical care (deinfibulation, perinatal, psychological support through specialist FGM services); assess risk to her daughters and any girls in the family; adult safeguarding if she has care and support needs or is at risk"]
       ]},
       {b:"dl", rows:[
         ["<b>Record it</b>","Record FGM, its type if known (WHO types 1–4), and family history in the record. GP practices must submit the <b>FGM Enhanced Dataset</b> when FGM is identified, and the national <b>FGM Information Sharing (FGM-IS)</b> system flags girls with a family history so that clinicians can see the risk"],
         ["<b>Do not examine to look for FGM</b>","Do not perform a genital examination solely to identify FGM. Refer to specialist services if clinical assessment is needed"],
         ["<b>Talking about it</b>","Use the person’s own terms (cutting, sunna, tahur), a professional interpreter (never a family member), and the Home Office ‘Statement opposing FGM’ (the ‘health passport’) for families travelling"]
       ]}
     ]},

    {id:"prevent", nav:"Prevent & slavery", title:"Prevent, modern slavery and the National Referral Mechanism",
     blocks:[
       {b:"table", head:["Area","What the GP does"], rows:[
         ["<b>Prevent</b> (Counter-Terrorism and Security Act 2015; Prevent duty guidance 2023)","Prevent is safeguarding people who are susceptible to radicalisation, not reporting beliefs. Concerning signs include expressing support for violence, being groomed online, isolation and sudden change in behaviour, alongside vulnerabilities such as mental illness or autism. Discuss with the practice or ICB Prevent lead and refer through the local Prevent referral route (police or local authority); cases may go to a multi-agency Channel panel, which is voluntary. Immediate threat → 999. Complete mandatory Prevent training"],
         ["<b>Modern slavery and trafficking</b> (Modern Slavery Act 2015)","Indicators: someone else speaks for the patient or holds their documents; injuries or untreated conditions; fear, inconsistent addresses, many people at one address; no access to wages; working long hours in car washes, nail bars, agriculture, construction or domestic work. See the person alone with a professional interpreter. Adults: with consent, a <b>first responder organisation</b> (police, local authority, some charities — not the NHS) refers to the <b>National Referral Mechanism (NRM)</b>; if they decline, police can be told anonymously (‘Duty to Notify’ for public authorities that are first responders). Children: always refer to children’s social care — consent is not needed for the NRM. Modern Slavery and Exploitation Helpline: 08000 121 700. Immediate danger → 999"]
       ]}
     ]},

    {id:"consent", nav:"Gillick & Fraser", title:"Young people — Gillick competence, the Fraser guidelines and confidentiality",
     blocks:[
       {b:"dl", rows:[
         ["<b>Gillick competence</b>","A young person under 16 can consent to treatment if they have sufficient maturity and understanding of the proposed treatment, including its risks and alternatives. Assess for each decision. Young people aged 16–17 are presumed to have capacity (Mental Capacity Act 2005)"],
         ["<b>Fraser guidelines</b> (contraception and sexual health under 16)","Prescribe or advise without parental knowledge if: the young person understands the advice; cannot be persuaded to tell their parents or allow you to; is likely to begin or continue having sex with or without contraception; their physical or mental health is likely to suffer without it; and it is in their best interests"],
         ["<b>Sexual activity and age</b>","<b>Under 13</b>: cannot consent in law (Sexual Offences Act 2003) — always discuss with the safeguarding lead and refer to children’s social care. <b>13–15</b>: assess for exploitation and abuse (age gap, power imbalance, gifts, alcohol or drugs, secrecy, coercion) — use a tool such as Spotting the Signs. <b>16–17</b>: still children for safeguarding purposes; assess for exploitation"],
         ["<b>Confidentiality</b>","Young people are entitled to confidentiality, but it is not absolute: share when there is a risk of serious harm to them or others. Explain this at the start, and tell them what you will share and with whom, unless doing so would increase the risk"]
       ]}
     ]},

    {id:"share", nav:"Share & record", title:"Information sharing and documentation",
     sub:"HM Government ‘Information sharing: advice for practitioners providing safeguarding services’ (updated 2024); GMC confidentiality guidance; Caldicott principle 7: the duty to share information can be as important as the duty to protect patient confidentiality.",
     blocks:[
       {b:"table", head:["Principle","Practice"], rows:[
         ["<b>Data protection is not a barrier</b>","UK GDPR and the Data Protection Act 2018 allow sharing to safeguard a child or an adult at risk, including without consent where seeking consent would place them at risk, cause delay, or the person lacks capacity. Share what is necessary, proportionate, relevant, accurate, timely and secure, and record what you shared, with whom, why, and on what basis"],
         ["<b>Seek consent when it is safe to</b>","Be open about what you are doing, unless that would increase the risk of harm. If consent is refused, you may still share when the public interest or the risk of serious harm justifies it"],
         ["<b>Document contemporaneously</b>","Date, time, who was present and their relationship; the person’s own words in quotation marks; observations, including a body map with the size, shape and colour of injuries (photographs only according to local policy and with consent); the explanation given; your concern and your reasoning (suspect, consider or exclude); who you discussed it with; what you did, with referral details and the reference number; and the follow-up plan"],
         ["<b>Code and flag</b>","Use safeguarding codes and alerts (for example child protection plan, looked-after child, MARAC, domestic abuse) on the records of the child and relevant family members according to local guidance. Protect third-party information and consider whether online record access could put the patient at risk"],
         ["<b>Reports and conferences</b>","Respond to requests for child protection conference reports promptly, stick to facts and your professional opinion, and say what the family’s health needs are. Attend or send a report"]
       ]},
       {b:"why", html:"Serious case reviews and child safeguarding practice reviews repeatedly find the same failures: information held by one agency that was never shared, a ‘Was not brought’ pattern not acted on, a disclosure recorded but not referred, and the adult’s problems seen without the child behind them. Primary care holds the whole-family record — the GP is often the only professional who can join it up."}
     ]},

    {id:"refer", nav:"Who to contact", title:"Who to contact",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Police — 999 / 101", html:"999 for immediate danger or a crime in progress. 101 for the FGM mandatory report and non-urgent crime. Anti-terrorist hotline 0800 789 321."},
         {tone:"red", h:"Children’s social care / MASH", html:"Same-day referral when you suspect harm; out of hours, the emergency duty team. Follow up in writing; if the response does not address your concern, escalate through the local escalation (resolving professional differences) procedure."},
         {tone:"amber", h:"Adult social care", html:"Safeguarding adults concerns; emergency duty team out of hours."},
         {tone:"amber", h:"MARAC, IDVA and IRIS", html:"High-risk domestic abuse through the local MARAC process; IRIS advocate-educator for practices in IRIS areas; National Domestic Abuse Helpline 0808 2000 247."},
         {tone:"blue", h:"Advice", html:"Practice safeguarding lead; the ICB named GP and designated doctor and nurse for safeguarding children and adults; LADO for allegations against people working with children; Prevent lead; Modern Slavery Helpline 08000 121 700."},
         {tone:"cream", h:"The practice’s responsibilities", html:"A named safeguarding lead; training at the level required by the intercollegiate documents (level 3 for GPs); a system for ‘Was not brought’ children; regular safeguarding meetings with health visitors and school nurses; and coded registers."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 29-year-old woman attends with her 6-month-old son for a ‘rash’. You notice two small bruises on the baby’s cheek. She says he ‘must have bumped himself in the cot’. Her partner, waiting outside, has phoned twice during the consultation. She has a history of depression and has missed his last immunisation appointment."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Recognises that <b>any bruise in a non-mobile baby</b> means suspected maltreatment; examines fully and sensitively; explains honestly that it must be checked and referred, without accusing; <b>refers the same day</b> to children’s social care and the local child protection medical pathway; considers domestic abuse and asks privately; thinks about other children in the household; documents the explanation verbatim and a body map; informs the safeguarding lead; does not let the partner’s pressure or the mother’s distress delay the referral; offers support to the mother."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Statutory guidance and NICE guidance used on this page. Local safeguarding partnership procedures set the referral routes and forms and take precedence for process.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>HM Government — Working Together to Safeguard Children (December 2023, updated 2024)</b><br><a href="https://www.gov.uk/government/publications/working-together-to-safeguard-children--2" rel="noopener">gov.uk — Working Together 2023</a><span class="rd"> — statutory framework; referral to children’s social care; decision within one working day; section 17 and section 47; information sharing; escalation</span></li>'+
         '<li><b>NICE CG89 — Child maltreatment: when to suspect maltreatment in under 18s (2009, updated 2017)</b><br><a href="https://www.nice.org.uk/guidance/cg89" rel="noopener">nice.org.uk/guidance/cg89</a><span class="rd"> — ‘suspect’, ‘consider’ and ‘exclude’; alerting features including bruising in a child who is not independently mobile</span></li>'+

         '<li><b>Domestic Abuse Act 2021 and Domestic Abuse statutory guidance (2022, updated)</b><span class="rd"> — definition; children as victims in their own right</span>; <b>Serious Crime Act 2015, section 76</b> — controlling or coercive behaviour</li>'+

  foot:"Safeguarding in primary care — Working Together to Safeguard Children (2023), NICE CG89 and NG76, Care Act 2014, Domestic Abuse Act 2021, NICE PH50, the FGM mandatory reporting duty (FGM Act 2003, s5B), Prevent duty guidance, Modern Slavery Act 2015 and the information-sharing advice for safeguarding practitioners. Recognise, respond, refer and record: suspect → refer the same day; immediate danger → 999. Follow your local safeguarding partnership procedures for referral routes."
