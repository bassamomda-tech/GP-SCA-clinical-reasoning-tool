<meta name="description" content="Bedwetting in children and young people under 19 (NICE CG111): treat constipation, assess daytime bladder symptoms and address those that are significant or predominant, a blame-free approach with rewards for behaviours not dry nights, the enuresis alarm for long-term cure, and desmopressin with its fluid rules for rapid cover." />

<script>
MG.render({
  icon:"🛏️",
  title:"Nocturnal enuresis — the complete guide",
  eyebrow:"Protocol · NICE CG111 · under 19s · treat the constipation first",
  stemTitle:"Constipation is the commonest reversible driver and is treated first; significant or predominant daytime bladder symptoms are addressed or referred — but mild daytime symptoms do not automatically delay alarm or tablet",
  stemSub:"One page for the whole condition, for children and young people under 19. Bedwetting is common and developmentally normal in younger children, so the approach is reassurance plus treating the reversible contributors — above all constipation — and assessing daytime bladder symptoms, addressing or referring them when significant or predominant. Then choose by goal, not severity: the <b>enuresis alarm has the best long-term cure rate</b> and needs weeks of commitment, while <b>desmopressin gives rapid short-term cover</b> for sleepovers and camps, with fluid rules that must be followed to avoid hyponatraemia. Throughout: <b>no blame, and reward agreed behaviours rather than dry nights</b> — a child cannot choose to be dry.",
  guideline:"NICE CG111 (2010) · BNFC",
  reviewed:"14 September 2026",
  nextReview:"14 March 2027",
  meta:[
    {t:"NICE CG111 — bedwetting in under 19s"},
    {t:"Treat constipation; assess daytime symptoms", tone:"tw"},
    {t:"Desmopressin: no drinks (sips only) 1 h before to 8 h after", tone:"tw"},
    {t:"v2.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#assess"><b>Assess</b><small>Constipation · daytime</small></a><a href="#conservative"><b>Non-drug</b><small>No blame</small></a><a href="#treat"><b>Alarm or drug</b><small>By goal</small></a><a href="#monitor"><b>Review</b><small>4 weeks</small></a><a href="#refer"><b>Refer</b><small>Daytime · refractory</small></a></div>',
  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"blue", h:"Treat constipation; assess daytime symptoms", html:"Assess and treat constipation. Assess daytime urinary symptoms and address or refer them when they are significant or predominant. <b>Do not automatically delay all treatment for nocturnal enuresis if mild daytime symptoms are present</b>, and do not exclude alarm treatment solely because daytime symptoms are also present. Look for frequency (more than 7 voids/day), infrequent voiding (fewer than 4/day), urgency, daytime wetting, dysuria, straining, poor stream, recurrent UTIs, and toilet avoidance or abnormal toileting. <b>Monosymptomatic</b> = bedwetting without daytime lower urinary tract symptoms; <b>non-monosymptomatic</b> = with daytime urinary symptoms, needing daytime bladder assessment."},
    {tone:"green", h:"No blame — and reward behaviours, not dry nights", html:"<b>Reassure the child and family, and never punish.</b> Reward systems should target agreed behaviours — drinking adequately during the day, using the toilet regularly, voiding before bed, helping with changing clothes or bedding as a pre-agreed routine (never as a punishment), participating in the treatment plan — NOT dry nights, because a child cannot choose to be dry and rewarding the outcome punishes them for something outside their control."},
    {tone:"blue", h:"Alarm for a lasting fix; desmopressin for rapid cover", html:"Enuresis alarm is first-line for long-term cure in a motivated child and family — younger children (under 7) are not excluded on age alone — with the best cure rate, but it needs commitment over weeks. Review at 4 weeks and continue until at least 2 uninterrupted dry weeks; if not completely dry after 3 months, continue only if still improving and the family remain motivated. Desmopressin (start at 200 micrograms at night, per product information and local formulary; consider a dose increase if incomplete response after 1–2 weeks) where rapid or short-term control is needed (sleepovers, camps) or an alarm is unsuitable — offered over age 7, considered at ages 5 to 7 only after individual assessment."},
    {tone:"red", h:"⚠ Desmopressin and fluid — hyponatraemia risk", html:"<b>No drinks, or only small sips if necessary, from 1 hour before taking desmopressin until 8 hours afterwards.</b> OMIT desmopressin during vomiting or diarrhoea, or whenever the child cannot reliably comply with the fluid restriction. Headache, nausea or vomiting, confusion, unusual drowsiness or seizures need urgent assessment for possible hyponatraemia. Say this to the family in those terms — it is the one safety rule on the page that has a serious consequence."},
    {tone:"amber", h:"Secondary enuresis is a different question", html:"Primary (never dry) versus secondary (relapse after 6 months or more dry). A previously dry child who starts wetting again needs thought about UTI, diabetes, constipation, stressors (bullying, family change, school difficulties), emotional wellbeing and safeguarding — do not assume psychological stress is the cause without excluding physical contributors. Urinalysis is appropriate for recent secondary onset; check glucose/HbA1c (and ketones if unwell) if there is thirst, polyuria, weight loss or abrupt onset."},
    {tone:"green", h:"Set the expectation honestly", html:"Explain that bedwetting is common and many children improve with age. It is not the child's fault, but persistent bedwetting can be distressing and effective treatments are available. <b>Keep a baseline diary of wet and dry nights, fluids and bowels</b> — it makes the response to treatment objective rather than a matter of recall, and it often reveals the constipation."}
  ],
  pathwaySub:"Five steps, and the first — treating constipation — resolves some cases by itself.",
  pathway:[
    {title:"Assess the pattern and treat the basics", html:"Primary or secondary; monosymptomatic or not; daytime symptoms; constipation; urinalysis only if indicated (not routine in typical primary monosymptomatic enuresis); glucose if indicated; psychosocial context. <b>Treat constipation; address significant or predominant daytime symptoms — mild daytime symptoms need not delay enuresis treatment.</b>", alert:true},
    {title:"Conservative measures and reassurance", html:"No punishment, adequate fluids by day without excessive restriction, no caffeine, toileting routine, realistic expectations, a diary."},
    {title:"Choose by goal — alarm or desmopressin", html:"Alarm for long-term cure; desmopressin for rapid or short-term cover, with the fluid rules."},
    {title:"Review at 4 weeks", html:"Alarm: signs of response → continue to at least 2 uninterrupted dry weeks; review continuation at 3 months. Desmopressin: assess at 4 weeks and continue for 3 months if there are signs of response, with a 1-week withdrawal every 3 months."},
    {title:"Refer daytime symptoms, red flags and refractory cases", html:"<b>Local paediatric continence/enuresis service; alarm plus desmopressin or desmopressin alone; anticholinergic only after specialist assessment.</b>"}
  ],
  sections:[

    {id:"assess", nav:"Assess", title:"Step 1 — assess the pattern, and treat the basics first",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>Pattern</b>","Primary (never dry) versus secondary (relapse after 6 months or more dry — consider constipation, UTI, diabetes, stressful events, bullying, family change, school difficulties, emotional wellbeing and safeguarding; do not assume stress without excluding physical contributors)"],
         ["<b>Monosymptomatic?</b>","Monosymptomatic: bedwetting without daytime lower urinary tract symptoms. Non-monosymptomatic: bedwetting with daytime urinary symptoms — needs daytime bladder assessment"],
         ["<b>Daytime symptoms</b>","Frequency (more than 7 voids/day), infrequent voiding (fewer than 4/day), urgency, daytime wetting, dysuria, straining, poor stream, recurrent UTIs, toilet avoidance or abnormal toileting. Address or refer when significant or predominant (consider treating these before the bedwetting where they predominate); do not automatically delay enuresis treatment for mild daytime symptoms"],
         ["<b>Treat first</b>","Constipation — may be occult and is not excluded by reported daily stool frequency. Ask about stool frequency and consistency, painful defecation, large stools, withholding, soiling, abdominal pain or distension, and toilet avoidance. Treat fully per the NICE constipation pathway; continue maintenance long enough to establish regular soft stools and reassess wetting after bowel function improves"],
         ["<b>Screen</b>","No routine urine test in typical longstanding primary monosymptomatic enuresis with no other concerning features. Urinalysis when onset is recent or secondary, daytime symptoms or dysuria are present, there is a history of UTI, the child appears unwell, or diabetes is suspected. Glucose/HbA1c (ketones if unwell) for polydipsia, polyuria, weight loss, fatigue, recurrent candidiasis or infection, abrupt secondary enuresis, or vomiting, abdominal pain or illness. Safeguarding and psychosocial context"]
       ]},
       {b:"why", html:"Bedwetting is common and developmentally normal in younger children, so the approach is reassurance plus treating the reversible contributors — above all constipation — and addressing daytime bladder symptoms when significant or predominant. A blame-free stance protects the child's self-esteem and improves outcomes."}
     ]},

    {id:"conservative", nav:"Non-drug", title:"Step 2 — conservative measures and reassurance, first-line",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"🚫 No punishment", html:"<b>Reassure child and family; never punish.</b> <b>Reward systems for agreed behaviours — not for dry nights</b>, which the child cannot control. Helping with bedding can be part of a pre-agreed routine but must never become a punishment."},
         {tone:"blue", h:"💧 Fluids by day", html:"<b>Encourage adequate fluids during the day, regular toileting and avoidance of caffeinated drinks. Avoid large drinks immediately before bed, but do not impose excessive daytime or general fluid restriction.</b> The strict fluid restriction applies only to desmopressin."},
         {tone:"green", h:"🚽 Toileting routine", html:"Regular daytime voiding and a void before bed; easy night access to the toilet."},
         {tone:"amber", h:"💩 Treat constipation", html:"<b>Identify and treat constipation fully before escalating enuresis treatment — a common, reversible driver, and may be occult despite daily stools.</b> See <a href='constipation-child.html'>constipation in children</a>."},
         {tone:"green", h:"🎯 Realistic goals", html:"<b>Many children improve with age, but persistent bedwetting can be distressing and effective treatments are available; set expectations.</b>"},
         {tone:"blue", h:"📓 Diary", html:"<b>Baseline diary of wet and dry nights, fluids and bowels.</b>"}
       ]}
     ]},

    {id:"treat", nav:"Alarm or drug", title:"Step 3 — alarm or desmopressin, chosen by goal",
     blocks:[
       {b:"table", head:["Step","What","When"], rows:[
         ["<b>Step 1 — enuresis alarm</b>","Best long-term cure rate; needs commitment over weeks. Use with positive reinforcement. Review at 4 weeks; continue if early response (smaller wet patches, fewer wet nights or episodes, alarm sounding later or less often, child beginning to wake to it) until at least 2 uninterrupted dry weeks. If not completely dry after 3 months, continue only if still improving and the child and family remain motivated. Restart promptly if relapse","First-line for long-term cure — motivated child and family; do not exclude younger children (under 7) on age alone"],
         ["<b>Step 2 — desmopressin</b>","Start at 200 micrograms at night, per current product information and local paediatric formulary. If incomplete response after 1–2 weeks, consider increasing the dose per product information. If partial or no response, may be taken 1–2 hours before bedtime, only if the child can comply with fluid restriction starting 1 hour before the dose. No drinks (small sips only if necessary) from 1 hour before to 8 hours after the dose","Offered over age 7 (considered at ages 5 to 7 only after individual assessment) needing rapid or short-term control (sleepovers, camps), or where an alarm is inappropriate or has been declined or ineffective"],
         ["<b>Step 3 — combination or specialist</b>","Consider alarm plus desmopressin, or desmopressin alone, according to acceptability and response. Consider an anticholinergic only with desmopressin, only where there are daytime symptoms, and only after specialist assessment for bladder dysfunction and prescribing expertise. Do not use anticholinergic monotherapy for monosymptomatic nocturnal enuresis","<b>Refractory — inadequate response to either alone</b>"]
       ]},
       {b:"warn", html:"Desmopressin and fluid: no drinks, or only small sips if necessary, from 1 hour before taking desmopressin until 8 hours afterwards, to prevent dilutional hyponatraemia and water intoxication. Omit desmopressin during vomiting or diarrhoea, or whenever the child cannot reliably comply. Headache, nausea or vomiting, confusion, unusual drowsiness or seizures → urgent assessment for hyponatraemia."}
     ]},

    {id:"monitor", nav:"Review", title:"Steps 4–5 — response, adherence and review",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["<b>Dry-night diary</b>","<b>Throughout</b>","<b>Track response objectively</b>"],
         ["<b>Alarm progress</b>","<b>4 weeks</b>","<b>Signs of response → continue to at least 2 uninterrupted dry weeks; none → reassess</b>"],
         ["<b>Alarm continuation</b>","<b>3 months</b>","<b>Not completely dry → continue only if still improving and the family remain motivated</b>"],
         ["<b>Desmopressin response</b>","<b>4 weeks, then 3 months</b>","<b>Incomplete response at 1–2 weeks → consider dose increase; signs of response at 4 weeks → continue for 3 months; longer term, withdraw for 1 week every 3 months; partial responders may keep improving for up to 6 months; no response → consider stopping</b>"],
         ["<b>Constipation and daytime symptoms</b>","<b>Ongoing</b>","<b>Ensure constipation stays treated and significant daytime symptoms are addressed</b>"]
       ]},
       {b:"dl", rows:[
         ["<b>After conservative measures</b>","Reassess: confirm constipation is treated and significant daytime symptoms addressed; review the diary; choose alarm versus desmopressin"],
         ["<b>4 weeks</b>","Treatment review: assess the alarm or desmopressin response; adjust, or combine alarm plus desmopressin"],
         ["<b>Every 3 months</b>","Withdrawal trial: when desmopressin is used longer term, withdraw it for 1 week every 3 months to assess whether sustained dryness has developed; repeated courses may be used if wetting recurs. Partial responders may continue improving for up to 6 months, so stopping at 3 months is not always necessary"]
       ]}
     ]},

    {id:"notdry", nav:"Not dry?", title:"Not dry? Re-check before escalating",
     sub:"Revisit the basics and adherence before stepping up.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"1 · Constipation", html:"<b>Still constipated? Treat fully — a frequent missed cause.</b>"},
         {tone:"blue", h:"2 · Daytime symptoms", html:"<b>Significant or persistent daytime wetting or urgency → bladder dysfunction; address or refer.</b>"},
         {tone:"green", h:"3 · Adherence", html:"<b>Alarm used consistently? Desmopressin taken with the fluid rules?</b>"},
         {tone:"amber", h:"4 · Secondary cause", html:"<b>New onset → urinalysis; reconsider UTI, diabetes, constipation, stressors, safeguarding.</b>"},
         {tone:"blue", h:"5 · Refer", html:"<b>Refractory, or severe/persistent daytime symptoms → local paediatric continence/enuresis service.</b>"}
       ]}
     ]},

    {id:"safety", nav:"Safety-net", title:"Safety-netting",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"🟠 Secondary enuresis", html:"\"If a previously dry child starts wetting again, with thirst, weight loss, or pain passing urine — see us; we'll check for diabetes and infection.\""},
         {tone:"red", h:"💧 Desmopressin fluids", html:"\"No drinks, or only small sips, from 1 hour before the dose until 8 hours after, and skip it if your child is vomiting, has diarrhoea or can't stick to the fluid limits — to protect against low sodium. If your child gets a headache, feels sick or vomits, is confused, unusually drowsy or has a fit, seek urgent help.\""},
         {tone:"amber", h:"💩 Constipation", html:"\"Keep on top of constipation — it's often the hidden reason for bedwetting.\""},
         {tone:"green", h:"🫶 Reassure", html:"\"It's common and not your child's fault — never punish; many children improve with age, and effective treatments are available.\""}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"When to refer",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"Daytime symptoms", html:"<b>Refer or discuss with the local paediatric continence/enuresis service when daytime wetting or urgency is severe or persistent, there are recurrent UTIs, abnormal stream or neurological/structural concerns, or constipation is refractory.</b>"},
         {tone:"blue", h:"Refractory", html:"Bedwetting not responding to appropriate courses of alarm and/or desmopressin, or significant comorbidity → local paediatric continence/enuresis service."},
         {tone:"amber", h:"Secondary causes", html:"Suspected diabetes, recurrent UTI, or a neurological or structural cause. See <a href='uti-children.html'>UTI in children</a>."},
         {tone:"red", h:"Safeguarding", html:"Psychosocial concerns or a safeguarding context — follow local pathways."},
         {tone:"cream", h:"GP management", html:"Assessment, treating constipation, conservative measures, the alarm or desmopressin decision, the fluid rules, and the review schedule all belong here. Related pages: <a href='constipation-child.html'>constipation in children</a> · <a href='uti-children.html'>UTI in children</a> · <a href='type-1-diabetes.html'>type 1 diabetes</a>."}
       ]},
       {b:"say", html:"Bedwetting is common and many children improve with age. It's not your child's fault, but it can be distressing and effective treatments are available — the most important things are no blame, sorting out any constipation, and then either an alarm for a lasting fix or a tablet for quick cover like sleepovers."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"An 8-year-old boy wets the bed most nights and has never been reliably dry. His mother is exhausted and mentions she has started <b>making him rinse his own sheets \"so he learns\"</b>, and has tried a <b>sticker chart for dry nights</b> without success. On questioning he <b>opens his bowels twice a week with hard stools</b> and <b>sometimes damp pants during the day</b>. There is a <b>school residential trip in 3 weeks</b> that he is dreading."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Identifies the constipation and the daytime dampness as the drivers, treats the constipation fully and assesses the daytime bladder symptoms — the highest-value action, and the reason the sticker chart failed; addresses the sheet-rinsing gently as punishment and explains the no-blame principle without shaming the mother; corrects the reward system — rewards for agreed behaviours, not dry nights, because he cannot choose to be dry; recognises the daytime dampness as possible bladder dysfunction — it prompts assessment of daytime bladder symptoms and urinalysis, and persistent or significant daytime symptoms lead to referral or discussion with a paediatric continence service; matches treatment to the goal — desmopressin 200 micrograms gives rapid cover for the residential in 3 weeks, while the alarm is the long-term answer afterwards; gives the desmopressin fluid rules explicitly, including omitting the dose if vomiting; <b>starts a diary</b>; and <b>dipsticks the urine (indicated here because of the daytime symptoms) and considers glucose</b>."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE CG111 — Bedwetting in under 19s</b><br><a href="https://www.nice.org.uk/guidance/cg111/chapter/Recommendations" rel="noopener">nice.org.uk/guidance/cg111/chapter/Recommendations</a><span class="rd"> — treating constipation, assessing daytime symptoms and treating them first where they predominate (alarm not excluded solely because daytime symptoms are present), the blame-free approach with rewards for agreed behaviours rather than dry nights, the enuresis alarm as first-line for long-term cure (younger children not excluded on age alone), desmopressin for rapid or short-term control (offered over 7, considered at 5 to 7; response assessed at 4 weeks), the fluid restriction from 1 hour before to 8 hours after the dose, the 3-month alarm continuation criterion, desmopressin dose increase and earlier dosing, the 1-week withdrawal every 3 months, and alarm plus desmopressin for refractory cases with anticholinergics only after specialist assessment</span></li>'+
         '<li><b>NICE CG111 \u2014 Bedwetting in under 19s</b><br><a href="https://www.nice.org.uk/guidance/cg111/resources" rel="noopener">nice.org.uk/guidance/cg111/resources</a><span class="rd"> — the primary versus secondary distinction with the 6-month dry threshold, no routine urinalysis in typical monosymptomatic bedwetting and its indications, and the review intervals (baseline assessment tool)</span></li>'+
         '<li><b>BNF for Children, product information (SPC) and local paediatric formulary</b><br><a href="https://bnfc.nice.org.uk" rel="noopener">bnfc.nice.org.uk</a><span class="rd"> — desmopressin dosing and dose increase, the hyponatraemia warning, and the instruction to omit the dose if fluid restriction cannot be observed or during vomiting or diarrhoea</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Nocturnal enuresis in children — NICE CG111 and the BNF for Children. For children and young people under 19. Treat constipation fully; assess daytime bladder symptoms and address or refer them when significant or predominant, without automatically delaying enuresis treatment. Urinalysis only when indicated, not routinely. Encourage adequate daytime fluids without excessive restriction. Never punish, and reward agreed behaviours rather than dry nights — a child cannot choose to be dry. The enuresis alarm is first-line for long-term cure in a motivated child, reviewed at 4 weeks, continued until at least 2 uninterrupted dry weeks, and continued beyond 3 months only if still improving. Desmopressin (starting at 200 micrograms at night, increased if incomplete response after 1–2 weeks) gives rapid or short-term cover, with no drinks (sips only) from 1 hour before to 8 hours after the dose — omit it if the child cannot comply or has vomiting or diarrhoea — and a 1-week withdrawal every 3 months. Anticholinergics only with desmopressin after specialist assessment. Secondary enuresis prompts thought of UTI, diabetes, stressors and safeguarding. Verify all doses against the BNF for Children, current product information and the local paediatric formulary before prescribing."
});
</script>
