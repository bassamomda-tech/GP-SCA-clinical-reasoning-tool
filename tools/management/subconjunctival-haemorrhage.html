MG.render({
  icon:"👁️",
  title:"Subconjunctival haemorrhage — the complete guide",
  eyebrow:"Protocol · diagnose &amp; manage in one place",
  stemTitle:"Almost always benign — so the whole clinical task is the 90 seconds that prove it: measure the acuity, see the posterior border, swing the torch",
  stemSub:"One page for the whole condition: exclude the rare sinister causes (ruptured globe, traumatic asphyxia, meningococcal septicaemia, bleeding diathesis, carotid-cavernous fistula), reassure properly with the colour-change warning that prevents a second anxious attendance, take the diagnostic opportunity the haemorrhage offers by checking the blood pressure, and never stop anticoagulation for it. Recurrent bleeds earn a work-up; an unexplained mechanism in a child or an older person earns a safeguarding thought.",
  guideline:"RCOphth Red Eye Guidelines 2019 · NICE NG136 · GMC GMP",
  reviewed:"9 September 2026",
  nextReview:"9 March 2027",
  meta:[
    {t:"RCOphth Red Eye Guidelines (2019)"},
    {t:"NICE NG136 — hypertension in adults"},
    {t:"NICE CG89 — child maltreatment"},
    {t:"GMC Good Medical Practice — documentation"},
    {t:"No NG12 cancer criterion applies", tone:"tw"},
    {t:"v1.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#severe"><b>Exclude first</b><small>Globe · asphyxia · sepsis</small></a><a href="#confirm"><b>Causes</b><small>Spontaneous · trauma · systemic</small></a><a href="#workup"><b>Examine</b><small>VA · border · RAPD</small></a><a href="#ladder"><b>Treat</b><small>Reassure · treat the cause</small></a><a href="#refer"><b>Refer</b><small>999 · ophthalmology</small></a></div>',
  quickSub:"If you read nothing else on this page, read these six cards. Every number traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Measure the visual acuity — every time", html:"In simple subconjunctival haemorrhage the visual acuity is completely normal. Any reduction in acuity with a red eye is NOT a simple SCH and needs urgent ophthalmology. Missing a reduced acuity in an apparently simple SCH is the commonest medicolegal error in GP ophthalmic assessment — and measuring it takes 30 seconds with a near-vision card or Snellen chart."},
    {tone:"red", h:"You must be able to see the posterior border", html:"A benign SCH does not extend behind the equator of the globe, so its posterior limit is visible. If the whole conjunctiva is haemorrhagic with no visible posterior border, treat as a possible occult ruptured globe: do NOT apply pressure or an eye pad — rigid eye shield, nil by mouth, 999."},
    {tone:"amber", h:"Bilateral without direct eye trauma is a head injury", html:"Bilateral SCH after trauma with no direct ocular injury, or after head or neck compression, means traumatic asphyxia (Perthes sign) or a base of skull fracture — pressure transmitted from inside the head. <b>999, urgent CT head.</b>"},
    {tone:"blue", h:"The swinging torch test takes 30 seconds", html:"A relative afferent pupillary defect is the single most important finding separating serious posterior segment injury from a benign surface bleed. Swing a bright torch between the eyes in a dim room: if the pupils paradoxically dilate as you move to the affected eye, that is an RAPD — retinal detachment, vitreous haemorrhage, traumatic optic neuropathy or posterior globe rupture. 999."},
    {tone:"purple", h:"Never stop anticoagulation for an SCH", html:"An SCH is a minor, self-limiting, cosmetically unpleasant but clinically inconsequential bleed. Check the INR if on warfarin and adjust only if supratherapeutic; confirm adherence and renal function on a DOAC; document it as a minor bleeding event — and continue anticoagulation. Only intracranial, massive GI or life-threatening haemorrhage prompts interruption."},
    {tone:"green", h:"Check the blood pressure — it is a free diagnostic opportunity", html:"Hypertension is a well-established risk factor: chronic hypertension causes hyaline degeneration of small vessel walls, making conjunctival capillaries fragile enough to rupture on minor triggers. Any first SCH without a clear cause → check BP at the same consultation. The SCH resolves regardless, but the diagnosis should not be wasted."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step is the 90 seconds that make the reassurance safe.",
  pathway:[
    {title:"Exclude the sinister causes", html:"Reduced acuity, RAPD, no visible posterior border, bilateral without direct eye trauma, fever with non-blanching petechiae, proptosis with pulsatile tinnitus, or easy bruising and gum bleeding.", alert:true},
    {title:"Identify the cause", html:"Spontaneous (commonest), Valsalva, traumatic, iatrogenic, or secondary to systemic disease — with the drug list: warfarin, DOACs, antiplatelets, aspirin plus NSAID, and blood-thinning supplements."},
    {title:"Examine properly and document it", html:"Visual acuity, pupil reactions and RAPD, anterior chamber, extent of haemorrhage and posterior border — plus <b>lid eversion in any contact lens wearer</b>. Differentiate from uveitis, angle-closure, conjunctivitis and episcleritis."},
    {title:"Reassure, and treat the contributors", html:"No specific treatment; cold compress in the first 24 hours; lubricants if gritty. Warn about the colour change and spreading. Then BP, anticoagulation review, constipation, cough, contact lens fit, dry eye."},
    {title:"Safety-net and follow up", html:"<b>Should clear in 2–3 weeks; review at 3–4 weeks if not.</b> <b>Recurrent (more than 2 episodes) → FBC, clotting, LFTs, HbA1c and BP.</b> Return immediately for any vision change or pain."}
  ],
  sections:[

    {id:"severe", nav:"Exclude first", title:"Red flags — the rare cases where an SCH signals serious pathology",
     sub:"The haemorrhage itself is almost always benign. The clinical task is identifying the exceptions.",
     blocks:[
       {b:"table", head:["Presentation","Suggests","Action"], rows:[
         ["SCH + significant blunt eye trauma + decreased visual acuity + afferent pupillary defect","<b>Ruptured globe or posterior segment injury — a possible globe injury</b>","Do NOT apply pressure. Eye shield (not a pad). 999 ophthalmology emergency. CT orbits if ruptured globe is suspected. Nil by mouth for surgical repair"],
         ["SCH extending posterior to the equator — 360 degrees, very posterior, unable to see the border","<b>Possible occult ruptured globe</b>","<b>999 ophthalmology. Do not attempt examination of the eye</b>"],
         ["Bilateral SCH post-trauma with no direct eye injury, or after head or neck compression","Traumatic asphyxia (Perthes sign) or base of skull fracture — bilateral haemorrhage without direct ocular trauma means intracranial pressure transmission. Look also for CSF rhinorrhoea or otorrhoea, periorbital or mastoid bruising","<b>999. Urgent CT head</b>"],
         ["<b>SCH + fever + photophobia + neck stiffness + non-blanching petechiae</b>","Meningococcal septicaemia — petechial haemorrhages including the conjunctiva","<b>999. IV or IM benzylpenicillin 1.2 g immediately. Time-critical</b>"],
         ["<b>Recurrent bilateral or very large SCH + easy bruising + gum bleeding</b>","Bleeding diathesis — platelet disorder (ITP, anticoagulant toxicity), coagulation defect (haemophilia, liver failure), or leukaemia","<b>FBC + coagulation screen + LFTs urgently. Haematology</b>"],
         ["Proptosis + periorbital oedema + pulsatile tinnitus + chemosis + arterialised veins","<b>Carotid-cavernous sinus fistula (post-traumatic or spontaneous)</b>","<b>999 neurosurgery. Urgent MRA or CTA head</b>"]
       ]},
       {b:"why", html:"A subconjunctival haemorrhage is bleeding into the potential space between the conjunctiva and the underlying sclera, from rupture of a small conjunctival vessel. The blood is bright red initially, may spread and darken over days, and resolves completely within 2–4 weeks without treatment. The critical task for GPs is not managing the SCH but identifying the rare cases where it signals serious pathology. The most important distinguishing feature: in simple SCH, visual acuity is completely normal — any reduction in acuity with a red eye is not a simple SCH and requires urgent ophthalmology assessment. And the posterior limit of a benign SCH should be visible, because the blood does not extend beyond the equator of the globe — if you cannot see the posterior border, a ruptured globe or posterior injury must be excluded."},
       {b:"dl", rows:[
         ["<b>NG12 stated honestly</b>","Subconjunctival haemorrhage has no NICE NG12 suspected-cancer criterion, and none should be invented for one. The time-critical routes here are ophthalmic and neurological — 999 for a suspected ruptured globe, bilateral haemorrhage after trauma, an RAPD, meningococcal septicaemia or a carotid-cavernous fistula. The one malignancy worth holding in mind is haematological rather than solid: recurrent or very large bleeds with easy bruising and gum bleeding need an urgent FBC and coagulation screen, because leukaemia presents this way — and in a child, unexplained petechiae, hepatosplenomegaly or generalised lymphadenopathy is an NG12 route in its own right: a very urgent FBC within 48 hours"]
       ]}
     ]},

    {id:"confirm", nav:"Causes", title:"Causes — spontaneous, traumatic, Valsalva and systemic",
     blocks:[
       {b:"dl", rows:[
         ["<b>Spontaneous — most common</b>","Usually no identifiable cause. Risk factors: hypertension (check BP at every SCH presentation), anticoagulants (warfarin, DOACs — check INR or dose), antiplatelet agents (aspirin, clopidogrel), aspirin plus NSAID combination, and blood-thinning supplements (fish oil, ginkgo, garlic). Age — the elderly have fragile conjunctival vessels. Rarely a vigorous Valsalva: coughing, straining at stool, heavy lifting, sneezing, vomiting, childbirth"],
         ["<b>Traumatic</b>","Direct ocular trauma — assess carefully for globe injury or ruptured globe. Contact lens trauma (microtrauma from the lens edge — check the fitting). Foreign body (retained FB under the upper eyelid). Iatrogenic: post-cataract surgery, post-intravitreal injection, post-eyelid surgery"],
         ["<b>Valsalva manoeuvre</b>","Forceful coughing (pertussis, asthma exacerbation), vomiting (hyperemesis, bulimia), straining (constipation, heavy lifting, labour), vigorous exercise. The manoeuvre transiently raises intrathoracic pressure → raised venous pressure → rupture of conjunctival capillaries. Bilateral SCH from Valsalva is possible but requires exclusion of intracranial pathology"],
         ["<b>Secondary to systemic disease</b>","Anticoagulation (warfarin with a supratherapeutic INR; a DOAC at standard dose can also cause it). Bleeding diathesis (ITP, haemophilia, liver disease). Hypertension — a well-established association, so check BP. Diabetes (fragile microvasculature). Leptospirosis and viral haemorrhagic fevers (travel history). Allergic conjunctivitis (with associated conjunctival hyperaemia)"]
       ]},
       {b:"why", html:"<b>The hypertension–SCH association deserves special attention.</b> The mechanism: chronic hypertension causes hyaline degeneration of small vessel walls (arteriosclerosis), making conjunctival capillaries more fragile and prone to spontaneous rupture even with minor physiological triggers — rising from sleep, morning coughing. The practical approach: any patient with a first SCH and no clear cause should have their BP checked. If it is elevated, this is an opportunity to diagnose and treat hypertension; if hypertension is already known and treated, check adherence and control. This does not mean the SCH itself requires urgent hypertension treatment — it will resolve regardless — but it is a diagnostic opportunity not to be wasted."}
     ]},

    {id:"workup", nav:"Examine", title:"Examination, differentials and when to investigate",
     blocks:[
       {b:"table", head:["Assessment","Detail"], rows:[
         ["<b>Visual acuity — mandatory</b>","Snellen chart, or ask the patient to read text: any reduction means this is not a simple SCH"],
         ["<b>Pupil reactions</b>","An afferent pupillary defect (APD, or RAPD — relative afferent pupillary defect) means posterior segment or optic nerve injury"],
         ["<b>Anterior chamber</b>","Assess depth and clarity — a flat chamber suggests ruptured globe; hyphaema (layered blood in the anterior chamber) suggests blunt trauma"],
         ["<b>Intraocular pressure</b>","<b>Not needed in primary care</b>"],
         ["<b>Extent of haemorrhage</b>","<b>Can the posterior border be seen? If not visible → 999</b>"],
         ["<b>History</b>","Onset (sudden is typical), pain (SCH is painless — a painful red eye means uveitis, glaucoma or keratitis), vision change (none in SCH), trauma, contact lens use, anticoagulants, previous episodes, and systemic conditions (hypertension, diabetes, liver disease, haematological)"]
       ]},
       {b:"table", head:["Differentiating from other causes of red eye","Features"], rows:[
         ["<b>Subconjunctival haemorrhage</b>","Bright red flat haemorrhage, clearly demarcated, white sclera visible at the periphery, no pain, normal vision"],
         ["<b>Anterior uveitis</b>","Ciliary injection (a ring around the cornea, not diffuse), photophobia, small irregular pupil"],
         ["<b>Acute angle-closure glaucoma</b>","Rock-hard globe, mid-dilated fixed pupil, halos around lights, severe pain, nausea"],
         ["<b>Bacterial conjunctivitis</b>","<b>Diffuse conjunctival injection, mucopurulent discharge, no haemorrhage</b>"],
         ["<b>Episcleritis</b>","Sectoral redness, movable redness (moves with the conjunctiva when pressing the eyelid), mild ache"]
       ]},
       {b:"table", head:["Investigations","When"], rows:[
         ["<b>None needed</b>","First simple SCH in a young-to-middle-aged adult with an identifiable trigger (coughing, sneezing, straining) or no trigger, plus normal BP, no anticoagulants, normal vision and a fully visible anterior border: reassurance and self-limiting. Check BP if not recorded recently"],
         ["<b>First SCH without identifiable cause, over 60</b>","BP + FBC (platelet count) + coagulation screen (INR if on warfarin — check the level)"],
         ["<b>Recurrent SCH (&gt;2 episodes in 6 months without explanation)</b>","<b>FBC + clotting + LFTs + HbA1c</b>"],
         ["<b>On an anticoagulant</b>","<b>Check INR (warfarin), or confirm DOAC adherence and renal function</b>"],
         ["<b>Travel history + fever + SCH</b>","Blood film (malaria) + leptospirosis serology + viral haemorrhagic fever screen if from an endemic area — via the local health protection team"]
       ]},
       {b:"why", html:"The afferent pupillary defect is the single most important examination finding distinguishing serious posterior segment pathology from a benign superficial haemorrhage. The swinging flashlight test: in a dim room, swing a bright pen torch from one eye to the other. Normally both pupils constrict when light is directed at them. With an RAPD, when the torch swings from the normal eye to the affected eye the pupils paradoxically dilate rather than constrict — the optic nerve input from that eye is weaker, and the brain compares the two signals. An RAPD with a red eye or SCH after trauma indicates retinal detachment, vitreous haemorrhage, traumatic optic neuropathy or posterior globe rupture — all requiring emergency ophthalmology assessment. The test takes approximately 30 seconds and should be performed for every patient presenting with a red eye."}
     ]},

    {id:"ladder", nav:"Treat", title:"Management — reassurance, and treating the precipitant",
     sub:"No specific treatment is required. The value of the consultation is accurate reassurance plus the contributors you find.",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>Self-limiting management</b>","No specific treatment required. Cold compress in the first 24 hours may reduce spreading. Artificial tear lubricant drops (hypromellose 0.3% or carbomer gel) if the eye feels gritty or uncomfortable — 2–4 times daily. Avoid rubbing the eye, which worsens spreading. Avoid aspirin and NSAIDs for the first 48 hours if not essential. Continue regular anticoagulation. No restrictions on activities, including driving — vision is unaffected"],
         ["<b>Hypertension</b>","<b>Treat per NICE NG136.</b> Under NG136 step 1, a calcium-channel blocker such as amlodipine is first-line for people aged 55 or over, and for people of Black African or African-Caribbean family origin of any age; an ACE inhibitor or ARB is first-line for those under 55 who are not of Black African or African-Caribbean family origin"],
         ["<b>Constipation (straining)</b>","<b>Lactulose 15 mL BD or a macrogol, plus dietary fibre and fluid intake</b>"],
         ["<b>Chronic cough causing recurrent Valsalva</b>","<b>Investigate and treat the cause</b>"],
         ["<b>Supratherapeutic anticoagulation</b>","<b>Dose adjustment</b>"],
         ["<b>Contact lens fit, and dry eye</b>","Optician review for lens fit. For dry eye with fragile surface vessels, long-term lubricant drops"],
         ["<b>Recurrent SCH</b>","Investigate with FBC, clotting, LFTs, HbA1c and BP. If all normal, review medications (anticoagulants, antiplatelets, fish oil in combination) and treat any Valsalva cause. Platelet abnormality → haematology. Liver disease → hepatology. Address cardiovascular risk factors comprehensively"],
         ["<b>Post-intravitreal injection SCH</b>","Iatrogenic SCH after intravitreal injection (anti-VEGF agents — ranibizumab, bevacizumab, aflibercept) is extremely common, occurring in up to 40% of injections, always at the injection site, resolving within 2 weeks and requiring no treatment. Reassure that this is normal and expected, and does not affect the efficacy of treatment"]
       ]},
       {b:"why", html:"The management of anticoagulation in a patient with SCH is an important prescribing decision — stopping anticoagulation for an SCH exposes the patient to the very thromboembolic risks it was prescribed to prevent (stroke, DVT or PE, valve thrombosis). An SCH is a minor, self-limiting, cosmetically unpleasant but clinically inconsequential event that does not warrant suspension of anticoagulation. The correct approach: check the INR if on warfarin, or assess DOAC adherence; if the INR is supratherapeutic, adjust the dose; document the SCH as a minor bleeding event in the anticoagulation record; and continue anticoagulation. The only bleeding events that should prompt consideration of interruption are intracranial haemorrhage, massive GI bleeding, and life-threatening haemorrhage from any site — an SCH does not meet these criteria."},
       {b:"why", html:"The post-intravitreal injection SCH is worth specific inclusion because anti-VEGF therapy for wet AMD, diabetic macular oedema and retinal vein occlusion is now extremely common — the UK administers approximately 1 million intravitreal injections per year. After each injection a small SCH at the injection site is expected and normal, because the needle punctures the conjunctiva. Patients treated monthly or bimonthly may contact their GP about the red eye, and GPs must know to reassure rather than alarm — but any SCH in a different location from the injection site, or with reduced vision or pain, should be referred back to the ophthalmology team. What to say: <em>\u201cThis red patch near where you had your injection is completely normal — it is just a tiny bruise on the surface of the eye from the needle. It will disappear in 1–2 weeks and does not affect how well your eye injection is working.\u201d</em>"}
     ]},

    {id:"medicolegal", nav:"Medicolegal", title:"Four medicolegal traps",
     sub:"Each of these is preventable in under a minute, and each is a recognised source of avoidable harm.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"👁️ Always measure visual acuity", html:"Missing a reduction in visual acuity in a \u201csimple SCH\u201d is the most common medicolegal error in GP ophthalmic assessment. A patient with traumatic SCH plus ruptured globe or vitreous haemorrhage whose vision is incorrectly assessed as normal will have a delayed diagnosis of a sight-threatening injury. VA measurement takes 30 seconds with a near-vision card or Snellen chart. Document the result in every red eye consultation."},
         {tone:"amber", h:"📐 Document the posterior border", html:"A simple SCH has a clearly visible posterior border — the blood does not extend behind the equator of the globe. If the entire conjunctiva is haemorrhagic with no visible posterior limit, treat as a potential ruptured globe: do not apply an eye pad (pressure), apply a rigid eye shield, 999."},
         {tone:"blue", h:"🔍 Evert the lid in contact lens wearers", html:"An SCH in a contact lens wearer — particularly daily disposable or extended wear — can be caused by a retained lens fragment under the upper eyelid. <b>The upper eyelid must be everted to exclude a retained foreign body.</b> Failure to do so, with a fragment that then scratches the cornea repeatedly, causes a persistent corneal abrasion — <b>preventable with a 30-second examination</b>."},
         {tone:"red", h:"🛡️ Unexplained mechanism = safeguarding", html:"An SCH in a child or an elderly person following unexplained trauma must prompt consideration of non-accidental injury or elder abuse. Document the mechanism carefully — is it consistent with the injury? Safeguarding assessment if there is inconsistency. NICE safeguarding guidance applies."}
       ]},
       {b:"why", html:"Non-accidental injury should be considered when a child presents with an SCH without a clearly consistent mechanism — retinal haemorrhages, not visible to the GP without ophthalmoscopy, are a classical feature of abusive head trauma (“shaken baby syndrome”), and conjunctival haemorrhages can co-exist. Any child presenting with an SCH where the mechanism is unclear or inconsistent, there are other unexplained bruises or injuries, the parent's account is inconsistent, or the child's behaviour is abnormal should trigger a safeguarding assessment. Document the exact mechanism as described by the parent or guardian, and refer to paediatrics for full assessment if NAI is suspected. The documentation standard: <em>\u201cMechanism of injury as described by parent: [exact statement]. Injury consistent/inconsistent with mechanism. Safeguarding concern: [yes/no and reasoning]. Action taken: [specify].\u201d</em>"},
       {b:"why", html:"A documented visual acuity measurement is medicolegally essential for every red eye consultation in primary care — GMC Good Medical Practice standards require clinical assessments to be thorough and appropriate to the presenting condition, and in a red eye, VA measurement is a basic and mandatory component. A GP who documents \u201cvision normal\u201d without measuring VA, and whose patient subsequently has a missed retinal detachment or posterior segment injury, is in a far weaker position than one who can demonstrate that VA was formally measured and recorded. The documentation standard: <em>\u201cVA: Right 6/6 (or \u2018reads news print at 30 cm\u2019). Left 6/6. Posterior border of haemorrhage visible. Pupils equal and reactive. No RAPD. Diagnosis: simple SCH. Management and safety-net provided.\u201d</em>"}
     ]},

    {id:"lifestyle", nav:"Prevention", title:"Preventing recurrence and wider eye health",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"🩺 Blood pressure control", html:"Hypertension damages conjunctival vessels through the same hyaline arteriosclerosis mechanism that causes retinal haemorrhages and stroke — so an SCH is an opportunity to motivate BP treatment. <em>\u201cThis red eye is a reminder that your blood pressure needs to be controlled — high blood pressure makes your small blood vessels more fragile.\u201d</em> Reduce salt to &lt;6 g/day, aerobic exercise 150 minutes a week, DASH diet, alcohol &lt;14 units/week, and weight loss — each 1 kg lost reduces systolic BP by approximately 1 mmHg."},
         {tone:"amber", h:"💊 Anticoagulation awareness", html:"Patients on anticoagulants should know that minor bleeds — SCH, easy bruising, minor nosebleeds — are expected side effects and do not require emergency action. They should make contact for black or tarry stools, vomiting blood, severe headache, weakness or slurred speech (stroke), heavy menstrual bleeding, or a prolonged nosebleed (&gt;20 minutes)."},
         {tone:"blue", h:"💪 Avoiding Valsalva triggers", html:"Constipation: fibre 25–35 g a day, 8 glasses of water daily, a macrogol if needed. Chronic cough: investigate and treat. Heavy weightlifting: breathe out during exertion — exhaling on the exertion phase reduces Valsalva-related venous pressure. Singers and wind instrument musicians should be aware of repeated Valsalva stress on conjunctival vessels."},
         {tone:"cream", h:"👓 Contact lens hygiene", html:"Replace lenses as prescribed — do not extend daily disposables to 2 or more days. Remove lenses before sleep. Clean the lens case daily with fresh solution, never tap water, and discard solution after each use. Annual optician contact lens check for corneal health. Any persistent redness with lens wear: remove the lenses and be seen."},
         {tone:"plain", h:"💧 Dry eye and conjunctival fragility", html:"Chronic dry eye causes conjunctival surface fragility — desiccated epithelium tears more easily, predisposing to SCH. Symptoms: grittiness, burning, foreign body sensation, paradoxical excessive tearing, worse in air-conditioned environments. Preservative-free lubricants (hypromellose PF, sodium hyaluronate) 4–6 times daily, omega-3 supplements, and a humidifier; optician or ophthalmology referral for severe dry eye (punctal plugs, topical ciclosporin). See the <a href='dry-eye-disease.html'>dry eye protocol</a>."},
         {tone:"amber", h:"💻 Screen time", html:"Prolonged screen use reduces blink rate by approximately 60% — from 15–20 blinks a minute to 5–7 — causing surface dryness and conjunctival stress. The 20-20-20 rule: every 20 minutes, look at something 20 feet away for 20 seconds. Keep the screen at or below eye level, take regular breaks, and use lubricants if symptomatic."},
         {tone:"red", h:"🚭 Smoking and eye health", html:"Smoking is the strongest modifiable risk factor for age-related macular degeneration — a fourfold increased risk in current smokers — and also increases conjunctival vascular fragility, dry eye, cataract risk and uveitis risk. Every eye consultation is an opportunity to ask about smoking and offer NHS Stop Smoking referral."},
         {tone:"green", h:"🤰 Post-delivery reassurance", html:"SCH during childbirth from pushing (Valsalva) is extremely common, occurring in approximately 5% of deliveries. Reassure proactively: <em>\u201cYou may notice a red area in the whites of your eyes after delivery — this is very common after the pushing during labour and will disappear completely in 2–3 weeks.\u201d</em> This prevents unnecessary post-natal GP attendances for reassurance about a normal finding."}
       ]},
       {b:"why", html:"The obstetric Valsalva SCH is worth specific mention because of its high frequency and the maternal anxiety it causes if not proactively addressed — studies report SCH in approximately 4–8% of vaginal deliveries, with a higher rate after prolonged second-stage labour. Ideally it is mentioned in antenatal education so mothers are not alarmed when they look in the mirror. GPs seeing post-natal women for the 6-week check should ask about eye symptoms and reassure about SCH if present — the condition is benign and self-limiting, but a new mother who notices \u201ca lot of blood in her eye\u201d without prior warning may experience significant anxiety and seek emergency care unnecessarily."}
     ]},

    {id:"monitor", nav:"Follow-up", title:"Follow-up and safety-netting",
     blocks:[
       {b:"table", head:["Group","Follow-up"], rows:[
         ["<b>First uncomplicated SCH</b>","No specific follow-up required. Review in 3–4 weeks if not resolved, to confirm normal resolution. Safety-net: return immediately if vision changes, pain develops, or the haemorrhage recurs"],
         ["<b>Recurrent SCH (≥2 episodes)</b>","Review at 4–6 weeks after investigation results. Treat the identified cause. If no cause is found: annual eye health review (BP, medications, FBC). Ophthalmology referral if concerned about structural conjunctival disease"],
         ["<b>Anticoagulated patient</b>","Document in the anticoagulation record as a minor bleeding event. Continue anticoagulation. If on warfarin, check the INR. Review the anticoagulation risk–benefit if there are multiple minor bleeds. Haematology input if the decision is complex"],
         ["<b>Child with SCH</b>","Document mechanism and consistency. Safeguarding assessment if there is any doubt. Paediatric referral if NAI is a concern, or if the child has multiple haemorrhages"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 Return or refer same day", html:"Any vision change with SCH → ophthalmology emergency · posterior border not visible → 999 · RAPD on the swinging torch test → 999 · bilateral SCH post-trauma → 999."},
         {tone:"amber", h:"🟠 Within 48 hours", html:"SCH in a contact lens wearer → confirm foreign body excluded by lid eversion · SCH in an anticoagulated patient → check INR (warfarin) or review the DOAC dose."},
         {tone:"blue", h:"🎨 Warn about the colour change", html:"Tell the patient in advance that the haemorrhage may look larger or darker over days 2–5 before it begins to resolve — this single sentence prevents a second anxious attendance."},
         {tone:"green", h:"📅 Expected course", html:"Should clear within about 2 weeks (fully by 2–3 weeks); review if it does not, spreads, or vision becomes affected."}
       ]},
       {b:"say", html:"This is a burst blood vessel on the surface of the eye — like a bruise on the skin. It looks far worse than it is. It will change colour from red to orange to yellow and disappear completely over the next two to three weeks, with no treatment at all. It does not affect your vision and it will not damage your eye. One thing to expect: over the next few days it may look bigger or darker before it starts to fade — that is normal, not a sign it is getting worse. I have checked your vision and examined the eye, and everything is as it should be. The one thing I do want to do is check your blood pressure, because that can make these little vessels more fragile. And do come straight back if your vision changes or the eye becomes painful."}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999", html:"Reduced visual acuity with SCH after trauma · RAPD present · posterior border of the SCH not visible · bilateral SCH without direct ocular trauma · ruptured globe features (flat anterior chamber, abnormal pupil)."},
         {tone:"amber", h:"Ophthalmology — urgent (24–48 hours)", html:"Traumatic SCH with normal vision in a contact lens wearer (foreign body exclusion) · SCH with chemosis and proptosis (an orbital process)."},
         {tone:"blue", h:"Ophthalmology — routine", html:"Recurrent SCH (&gt;2 episodes without identified cause) after a normal primary care work-up · an anticoagulated patient with multiple SCH episodes, to confirm no conjunctival pathology."},
         {tone:"blue", h:"Haematology", html:"Recurrent SCH with a low platelet count or coagulation abnormality · suspected bleeding diathesis."},
         {tone:"cream", h:"GP management", html:"Single uncomplicated SCH: reassurance, lubricant drops for comfort, self-limiting over 2–3 weeks, and a BP check. Second episode: investigate and treat the underlying cause — hypertension, anticoagulation review, constipation causing straining."}
       ]},
       {b:"why", html:"The GP has a valuable reassurance opportunity at every SCH consultation — the haemorrhage looks alarming to patients (bright red, spreading, covering the white of the eye) and causes significant anxiety. Effective reassurance: <em>\u201cA subconjunctival haemorrhage is like a bruise on the skin — it looks worse than it is. It is caused by a tiny blood vessel on the surface of the eye breaking. It will gradually change colour from red to orange to yellow, and completely disappear over the next 2–3 weeks without any treatment. It does not affect your vision and will not damage your eye.\u201d</em> Managing expectations matters: tell the patient in advance that the haemorrhage may look larger or darker over days 2–5 before it begins to resolve. Cold compresses in the first 24 hours reduce spreading, and artificial tear lubricants provide symptomatic relief if the eye is dry and uncomfortable — no eye drops, tablets or other specific treatment is needed."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 68-year-old on apixaban for atrial fibrillation attends alarmed by a bright red patch covering the outer half of the white of his right eye, noticed on waking. There was no trauma. He has stopped his apixaban since yesterday \u201cin case it made it worse\u201d, and his BP today is 168/96."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"<b>Measures and documents the visual acuity rather than asking about it</b>; <b>confirms the posterior border is visible</b> and does the <b>swinging torch test</b>; restarts the apixaban and explains that an SCH is a minor bleeding event that never justifies stopping anticoagulation — naming the stroke risk he has taken on; <b>documents it as a minor bleed and checks adherence and renal function</b>; takes the hypertension seriously as the likely contributor and as a diagnostic opportunity in its own right; reassures with the <b>colour-change warning</b>; and \u2014 the step candidates miss \u2014 gives the explicit anticoagulation safety rules (which bleeds do warrant urgent contact) rather than leaving him to guess next time."}
     ]}]},

  foot:"Subconjunctival haemorrhage — RCOphth Red Eye Guidelines (2019), NICE NG136, NICE safeguarding children guidance, GMC Good Medical Practice documentation standards and the BNF. Measure and document the visual acuity in every red eye consultation, and never stop anticoagulation for a subconjunctival haemorrhage. The reasoning pathway remains at the <a href=\"../algorithms/subconjunctival-haemorrhage.html\">subconjunctival haemorrhage pathway</a>; the wider undifferentiated presentation is covered by the <a href=\"../algorithms/red-eye.html\">red eye pathway</a>. Verify all doses against the current BNF before prescribing."
