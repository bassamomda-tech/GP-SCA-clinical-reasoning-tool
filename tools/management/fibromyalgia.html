<script>
MG.render({ snapshot:"summaries/fibromyalgia.html",
  icon:"🌀",
  title:"Fibromyalgia",
  eyebrow:"Protocol · assess and manage in one place",
  stemTitle:"Make a positive diagnosis, exclude what matters with limited tests, then build the plan around activity and psychological support rather than analgesics",
  stemSub:"One page for fibromyalgia in primary care. NICE classes it as a form of chronic primary pain (NICE NG193, 2021). Make a positive diagnosis from the history and examination, using the ACR criteria as context rather than a gate. Use a limited set of tests to exclude conditions that matter, and look for red flags. Then offer what works: a supervised group exercise programme, CBT or ACT for pain, a single course of acupuncture, and, for adults, consider one of six antidepressants. Do not start opioids, gabapentinoids, NSAIDs, paracetamol or benzodiazepines for chronic primary pain. Address sleep, mood and work, and review the person's existing medicines with them.",
  guideline:"NICE NG193 (2021) · EULAR revised recommendations for fibromyalgia (2016) · ACR fibromyalgia criteria (2010, revised 2016) · NICE NG59 low back pain (2016, updated 2020) · NICE NG222 depression (2022) · SPCs",
  reviewed:"15 October 2026",
  nextReview:"15 April 2027",
  meta:[
    {t:"NICE NG193 · chronic primary pain"},
    {t:"EULAR 2016 · fibromyalgia (international)"},
    {t:"ACR 2016 criteria · context for diagnosis (international)"},
    {t:"No NG12 cancer criterion applies; red flags point to other diagnoses", tone:"tw"},
    {t:"v1.0 · reviewed Oct 2026", tone:"ok"}
  ],
  lead:"<div class='mg-layers'><a href='#redflags'><b>Red flags</b><small>it may not be fibromyalgia</small></a><a href='#diagnose'><b>Diagnose</b><small>positive diagnosis, limited tests</small></a><a href='#manage'><b>Manage</b><small>exercise, CBT or ACT, acupuncture</small></a><a href='#drugs'><b>Drugs</b><small>what to offer, what not to start</small></a></div>",
  quickSub:"Six cards for the consultation. Each one traces to a named source under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"Red flags mean think again", html:"Weight loss, fever or night sweats, <b>joint swelling</b> or prolonged early-morning stiffness, <b>raised inflammatory markers</b>, <b>new widespread pain over 50</b> (consider polymyalgia rheumatica or giant cell arteritis, which needs same-day action if there is jaw claudication or visual disturbance), focal neurological signs, or a history of cancer. These point to another diagnosis, which can coexist with fibromyalgia."},
    {tone:"amber", h:"A positive diagnosis, not a diagnosis of exclusion", html:"Widespread pain for <b>3 months or more</b>, with fatigue, unrefreshing sleep and cognitive symptoms ('fibro fog'), often with tenderness, headache, irritable bowel symptoms and low mood. The <b>ACR 2016 criteria</b> (widespread pain index and symptom severity score) help structure the assessment; NICE does not require a specific criteria set. Naming the condition early reduces repeated tests and referrals."},
    {tone:"blue", h:"Limited tests, then stop", html:"A typical baseline is <b>FBC, ESR or CRP, U&amp;E, LFTs, bone profile, TSH and HbA1c</b>, with vitamin D, creatine kinase or coeliac serology where features suggest them. Do not routinely request ANA or rheumatoid factor without clinical features of connective tissue disease or inflammatory arthritis; low-titre positive results are common and lead to unnecessary referrals."},
    {tone:"cream", h:"What works: activity and psychological support", html:"Offer a <b>supervised group exercise programme</b> (taking account of preferences and abilities), and encourage the person to stay active long term. Consider <b>CBT or acceptance and commitment therapy (ACT)</b> for pain. Consider a <b>single course of acupuncture</b> within a traditional Chinese or Western system, if it is delivered within the NICE limits."},
    {tone:"cream", h:"Antidepressants: the only drugs NICE recommends", html:"For people aged <b>18 and over</b>, consider <b>amitriptyline, citalopram, duloxetine, fluoxetine, paroxetine or sertraline</b> after a full discussion, even without depression. This use is mostly off-label. For 16 and 17-year-olds, get specialist advice first. Review benefit and harms, and stop if there is no meaningful benefit."},
    {tone:"red", h:"Do not start these for chronic primary pain", html:"NICE NG193 advises <b>not initiating</b> opioids, gabapentinoids (gabapentin, pregabalin) or other antiepileptics, <b>NSAIDs</b>, <b>paracetamol</b>, <b>benzodiazepines</b>, antipsychotics, corticosteroid or local anaesthetic trigger-point injections, ketamine, or cannabis-based products. If the person already takes them, review together, explain the risks, and reduce gradually where harm outweighs benefit."}
  ],
  pathwaySub:"Five moves. Step one is where another diagnosis is missed.",
  pathway:[
    {title:"Screen for red flags and other causes", html:"Weight loss, fever, night sweats, inflammatory joint symptoms, raised inflammatory markers, new onset over 50, neurological signs (emergency referral for suspected cauda equina), cancer history. Check medicines that cause muscle pain (for example statins) and alcohol.", alert:true},
    {title:"Take a full history and examine", html:"Pain distribution and duration, fatigue, sleep, cognition, mood, function, work and relationships, previous treatments, and what the person understands and expects. Examine joints, muscles and the neurological system; tender points are not required."},
    {title:"Limited tests, then name it", html:"Baseline bloods to exclude common mimics. Give a clear explanation of fibromyalgia as a real condition of pain processing, with written information."},
    {title:"Agree a plan", html:"Exercise programme, CBT or ACT, acupuncture if wanted, sleep and mood support, and consider an antidepressant for adults. Review existing analgesics and plan any reductions."},
    {title:"Review and support", html:"Review benefit and side effects of any antidepressant, progress with activity, mood and work. Refer to pain management, rheumatology or mental health services when needed."}
  ],
  sections:[
    {id:"redflags", nav:"Red flags", title:"Red flags: when it may be something else", sub:"Fibromyalgia is common, and so are conditions that look like it. Some need urgent action.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Same day: suspected giant cell arteritis", html:"New headache, scalp tenderness, jaw claudication or visual disturbance in someone over 50 with aching: same-day assessment through the local GCA pathway; visual symptoms need same-day ophthalmology or GCA service review.", src:"BSR GCA guideline (2020)"},
         {tone:"amber", h:"🟠 Inflammatory or systemic disease", html:"Joint swelling, early-morning stiffness over an hour, rash, mouth ulcers, Raynaud's phenomenon, raised ESR or CRP, or proximal weakness: consider inflammatory arthritis, connective tissue disease, polymyalgia rheumatica or myositis, and refer to rheumatology as indicated.", src:"EULAR fibromyalgia recommendations (2016)"},
         {tone:"amber", h:"🟠 Weight loss, fever, night sweats, bone pain", html:"Investigate for infection, malignancy (including myeloma) or endocrine disease, and use a suspected cancer pathway referral where NICE NG12 criteria are met.", src:"NICE NG12 (updated April 2026)"},
         {tone:"amber", h:"🟠 Neurological signs", html:"Focal weakness, sensory level, sphincter disturbance or progressive symptoms need neurological assessment. Suspected cauda equina or spinal cord compression needs an immediate emergency referral (999 or the emergency department, per the local pathway).", src:"NICE NG193 (2021)"},
         {tone:"red", h:"🔴 Suicidal thoughts", html:"Chronic pain increases the risk of suicide. Ask directly; thoughts with a plan or intent need a same-day crisis assessment (NICE NG225).", src:"NICE NG225 (2022)"}
       ]},
       {b:"why", html:"Labelling someone with fibromyalgia can stop clinicians looking for new problems. Each new or changed symptom deserves its own assessment, and the label should be reconsidered if the picture does not fit."}
     ]},

    {id:"diagnose", nav:"Diagnose", title:"Diagnosis and assessment", sub:"NICE NG193 covers chronic primary pain in people aged 16 and over. Fibromyalgia can coexist with other conditions.",
     blocks:[
       {b:"kv", rows:[
         ["Chronic primary pain","Pain in one or more regions that persists or recurs for more than 3 months, is associated with significant emotional distress or functional disability, and is not better accounted for by another diagnosis. Fibromyalgia (chronic widespread pain) is one form."],
         ["ACR 2016 criteria (context)","Widespread pain index (0–19 areas) and symptom severity score (0–12): WPI 7 or more with SSS 5 or more, or WPI 4 to 6 with SSS 9 or more; generalised pain in at least 4 of 5 regions; symptoms for at least 3 months. A fibromyalgia diagnosis is valid whatever other diagnoses the person has."],
         ["Common features","Fatigue, unrefreshing sleep, cognitive difficulties, headache, irritable bowel symptoms, bladder symptoms, sensitivity to noise, light or temperature, anxiety and depression"],
         ["Assess","Pain and its effect on life, sleep, mood (PHQ-9, GAD-7), activity, work, relationships, previous treatments and their effect, and the person's beliefs and goals"]
       ]},
       {b:"table", head:["Test","Why"], rows:[
         ["<b>FBC, ESR or CRP</b>","Anaemia, inflammation, infection, malignancy"],
         ["<b>U&amp;E, LFTs, bone profile</b>","Renal and liver disease, hypercalcaemia, osteomalacia"],
         ["<b>TSH, HbA1c</b>","Hypothyroidism, diabetes"],
         ["<b>Selective:</b> vitamin D, creatine kinase, coeliac serology, ferritin","Osteomalacia; myopathy (including statins); coeliac disease; iron deficiency"],
         ["<b>Not routine:</b> ANA, rheumatoid factor, imaging","Only with clinical features of connective tissue disease, inflammatory arthritis or structural problems"]
       ]},
       {b:"say", html:"Fibromyalgia is a real condition. The nerves and brain become more sensitive, so ordinary signals are felt as pain, and sleep and energy are affected too. It does not damage your joints or muscles, and the tests we have done do not show anything else causing it. That is why the treatments that help most are about gradually building activity, sleep and coping skills, rather than stronger painkillers."}
     ]},

    {id:"manage", nav:"Manage", title:"Non-drug management", sub:"These are the treatments with the best evidence for chronic primary pain.",
     blocks:[
       {b:"cards", items:[
         {tone:"green", h:"🏃 Exercise", html:"<b>Offer</b> a supervised group exercise programme, taking into account the person's needs, preferences and abilities. Encourage them to stay physically active for the longer-term benefits. Start low and build gradually; a temporary rise in pain is expected and not harmful.", src:"NICE NG193 (2021) · EULAR (2016)"},
         {tone:"green", h:"🧠 Psychological therapy", html:"<b>Consider</b> acceptance and commitment therapy (ACT) or cognitive behavioural therapy (CBT) for pain. NHS Talking Therapies and pain management programmes provide these.", src:"NICE NG193 (2021)"},
         {tone:"cream", h:"📍 Acupuncture", html:"<b>Consider</b> a single course of acupuncture or dry needling, within a traditional Chinese or Western acupuncture system, delivered in a community setting by a band 7 (or lower) healthcare professional with appropriate training, with no more than 5 hours of healthcare professional time.", src:"NICE NG193 (2021)"},
         {tone:"amber", h:"🚫 What NICE advises not to offer", html:"Biofeedback, TENS, ultrasound and interferential therapy for chronic primary pain. Evidence for other approaches (for example manual therapy) is limited.", src:"NICE NG193 (2021)"},
         {tone:"cream", h:"😴 Sleep", html:"Sleep hygiene and regular routines; CBT for insomnia where available (NICE recommends CBT-I for insomnia). Treat sleep apnoea and restless legs if present.", src:"EULAR (2016)"},
         {tone:"blue", h:"💼 Work and daily life", html:"Discuss work early: a fit note with adjustments, phased return, occupational health and Access to Work. Pacing helps with fatigue. Signpost to patient organisations and self-management resources.", src:"NICE NG193 (2021)"}
       ]}
     ]},

    {id:"drugs", nav:"Medicines", title:"Medicines: what to consider and what not to start", sub:"NICE NG193 recommends antidepressants only, and advises against starting the other common analgesics.",
     blocks:[
       {b:"table", head:["Drug","Usual adult dose","Notes"], rows:[
         ["<b>Amitriptyline</b>","<span class=mg-dose>Usual adult dose: 10 mg at night, increased gradually if needed, usually to no more than 50 mg at night (NICE NG193/SPC; check the SPC, BNF and local formulary; <a href='https://www.medicines.org.uk/emc/search?q=amitriptyline' target=_blank rel=noopener>SPC: amitriptyline</a>).</span>","Off-label. Helps sleep. Sedation, dry mouth, constipation, weight gain; caution in heart disease, glaucoma, urinary retention and older people. <b>Toxic in overdose</b>: prescribe small quantities if there is any suicide risk."],
         ["<b>Duloxetine</b>","<span class=mg-dose>Usual adult dose: 30 mg once daily, increased to 60 mg once daily if needed (NICE NG193/SPC; check the SPC, BNF and local formulary; <a href='https://www.medicines.org.uk/emc/search?q=duloxetine' target=_blank rel=noopener>SPC: duloxetine</a>).</span>","Off-label for chronic primary pain. Nausea early on; raised blood pressure; withdrawal symptoms if stopped suddenly."],
         ["<b>SSRIs: citalopram, fluoxetine, paroxetine, sertraline</b>","<span class=mg-dose>Usual adult doses as for depression, for example sertraline 50 mg once daily (NICE NG193/SPC; check the SPC, BNF and local formulary; <a href='https://www.medicines.org.uk/emc/search?q=sertraline' target=_blank rel=noopener>SPC: sertraline</a>).</span>","Off-label for pain. Useful with coexisting depression or anxiety. Citalopram: QT prolongation (check interactions). Paroxetine: more withdrawal effects."]
       ]},
       {b:"warn", html:"<b>Do not start</b> for chronic primary pain: opioids; gabapentin, pregabalin or other antiepileptics; NSAIDs; paracetamol; benzodiazepines; antipsychotics; corticosteroid or local anaesthetic trigger-point injections; ketamine; cannabis-based products (NICE NG193). Gabapentinoids and opioids carry risks of dependence, sedation and overdose with little evidence of benefit here."},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"🔄 Already on these drugs", html:"Review with shared decision-making: explain the lack of evidence and the risks, agree goals, and reduce gradually where harm outweighs benefit. Do not stop opioids, gabapentinoids or benzodiazepines abruptly. Discuss withdrawal symptoms when stopping antidepressants.", src:"NICE NG193 (2021) · NICE NG215 safe prescribing and withdrawal (2022)"},
         {tone:"cream", h:"🧑 16 and 17-year-olds", html:"Seek specialist advice before starting an antidepressant. Children and younger adolescents with widespread pain should be assessed by paediatric rheumatology or pain services; doses per the BNFC.", src:"NICE NG193 (2021)"}
       ]}
     ]},

    {id:"special", nav:"Special groups", title:"Special groups", sub:"Where the plan changes.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"🤰 Pregnancy and breastfeeding", html:"Non-drug approaches first. If an antidepressant is needed, discuss risks and benefits and use the lowest effective dose; sertraline is often preferred. Seek perinatal advice where needed.", src:"NICE CG192 (2014, updated 2020)"},
         {tone:"amber", h:"👵 Older people", html:"New widespread pain after 50 needs exclusion of polymyalgia rheumatica, myeloma, hypothyroidism, osteomalacia and statin myopathy. Avoid amitriptyline where anticholinergic burden or falls risk is high.", src:"EULAR (2016)"},
         {tone:"blue", h:"🔁 Coexisting conditions", html:"Fibromyalgia often coexists with rheumatoid arthritis, lupus, osteoarthritis, hypermobility, ME/CFS (NICE NG206), irritable bowel syndrome and depression. Treat each in its own right.", src:"NICE NG193 (2021) · NICE NG206 (2021)"}
       ]}
     ]},

    {id:"refer", nav:"Refer and follow-up", title:"Referral, follow-up and safety-netting", sub:"Most people are managed in primary care with community services.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999 or same day", html:"Suspected cauda equina or spinal cord compression: immediate emergency referral (999 or the emergency department). Same day: suspected giant cell arteritis with jaw claudication or visual symptoms; suicidal thoughts with plan or intent.", src:"BSR GCA guideline (2020) · NICE NG225 (2022)"},
         {tone:"amber", h:"Rheumatology", html:"Diagnostic doubt with inflammatory features or abnormal tests; suspected connective tissue disease or inflammatory arthritis.", src:"EULAR (2016)"},
         {tone:"amber", h:"Pain management service", html:"Severe impact on function despite primary care management; complex medicines (for example high-dose opioids to reduce); need for a multidisciplinary pain management programme.", src:"NICE NG193 (2021)"},
         {tone:"amber", h:"Mental health", html:"Moderate or severe depression or anxiety, trauma, or eating difficulties: NHS Talking Therapies or community mental health services.", src:"NICE NG222 (2022)"},
         {tone:"green", h:"Stays in primary care", html:"Diagnosis, explanation, exercise and psychological therapy referrals, antidepressant review, sleep and work support, and regular review.", src:"NICE NG193 (2021)"}
       ]},
       {b:"table", head:["When","What"], rows:[
         ["2 to 4 weeks after starting an antidepressant","Side effects, adherence, early benefit; dose adjustment"],
         ["Around 8 to 12 weeks","Is there meaningful benefit in pain, sleep, function or mood? If not, stop and consider another option"],
         ["Every review","Activity, mood, work, new symptoms (reassess for other causes)"]
       ]},
       {b:"say", html:"If you develop new symptoms such as weight loss, fevers, night sweats, swollen joints, a new headache with jaw pain or sight problems, or new weakness or numbness, come back so we can check them properly, and for sight problems contact us the same day. If you ever feel you might harm yourself, call 999 or go to the emergency department; for less urgent support, call NHS 111 and choose the mental health option, or contact us."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card. The Casebook holds the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 44-year-old woman with two years of widespread pain, exhaustion and poor sleep has normal blood tests. She has read about pregabalin and asks for it, and wonders whether she should give up work.", src:"NICE NG193 (2021)"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Screens for <b>red flags</b> and mood, including suicidal thoughts. Makes a <b>positive diagnosis</b> and explains it. Explains why <b>gabapentinoids are not recommended</b> for chronic primary pain. Offers <b>exercise</b> and <b>CBT or ACT</b>, and considers an <b>antidepressant</b> (for example amitriptyline at night for sleep). Discusses <b>work adjustments</b> and a fit note. Arranges review and safety-nets.", src:"NICE NG193 (2021)"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Every recommendation on this page traces to a named primary source.",
     blocks:[
       {b:"html", html:"<div class='card'><h3>Evidence panel</h3><ul class='evlist'>"+
         "<li><b>NICE NG193 — Chronic pain (primary and secondary) in over 16s: assessment of all chronic pain and management of chronic primary pain (April 2021)</b><br><a href='https://www.nice.org.uk/guidance/ng193' rel='noopener'>nice.org.uk/guidance/ng193</a><span class='rd'> — definition, exercise programmes, CBT or ACT, acupuncture limits, the six antidepressants for 18 and over, drugs not to initiate, reviewing existing medicines, TENS and other modalities not to offer</span></li>"+
         "<li><b>Macfarlane GJ et al. EULAR revised recommendations for the management of fibromyalgia. Ann Rheum Dis 2017;76:318–28</b> (international)<br><a href='https://ard.bmj.com/content/76/2/318' rel='noopener'>ard.bmj.com — EULAR 2016</a><span class='rd'> — prompt diagnosis, education, exercise first, graded approach, red flags</span></li>"+
         "<li><b>Wolfe F et al. 2016 revisions to the 2010/2011 fibromyalgia diagnostic criteria. Semin Arthritis Rheum 2016;46:319–29</b> (international)<br><a href='https://doi.org/10.1016/j.semarthrit.2016.08.012' rel='noopener'>doi.org — ACR 2016 criteria</a><span class='rd'> — widespread pain index, symptom severity score</span></li>"+
         "<li><b>NICE NG215 — Medicines associated with dependence or withdrawal symptoms (2022)</b><br><a href='https://www.nice.org.uk/guidance/ng215' rel='noopener'>nice.org.uk/guidance/ng215</a><span class='rd'> — reducing opioids, gabapentinoids and benzodiazepines</span></li>"+
         "<li><b>NICE NG222 (depression, 2022), NICE NG225 (self-harm, 2022), NICE NG206 (ME/CFS, 2021), NICE NG12 (suspected cancer, updated April 2026), BSR giant cell arteritis guideline (2020)</b><br><a href='https://www.nice.org.uk/guidance/ng222' rel='noopener'>nice.org.uk/guidance/ng222</a> · <a href='https://www.nice.org.uk/guidance/ng225' rel='noopener'>ng225</a> · <a href='https://www.nice.org.uk/guidance/ng206' rel='noopener'>ng206</a> · <a href='https://www.nice.org.uk/guidance/ng12' rel='noopener'>ng12</a><span class='rd'> — mood, risk, overlap and red flags</span></li>"+
         "<li><b>SPCs — amitriptyline, duloxetine, sertraline, citalopram, fluoxetine, paroxetine</b><br><a href='https://www.medicines.org.uk/emc' rel='noopener'>medicines.org.uk/emc</a><span class='rd'> — doses, cautions, interactions</span></li>"+
         "</ul></div>"}
     ]}
  ],
  foot:"Fibromyalgia in primary care — NICE NG193 (2021), EULAR revised recommendations (2016) and the ACR 2016 criteria. Antidepressant use for chronic primary pain is mostly off-label: discuss this with the person. Not a substitute for clinical judgement."
});
</script>
