<meta name="description" content="PTSD under NICE NG116: structured risk and diagnostic assessment, trauma-focused CBT first-line with EMDR by timing and preference, active monitoring only for subthreshold or mild symptoms within a month of trauma, an SSRI or venlafaxine where drug treatment is preferred, and no benzodiazepines to prevent PTSD or as routine treatment." />

<script>
MG.render({
  icon:"🧠",
  title:"PTSD — the complete guide",
  eyebrow:"Protocol · NICE NG116 · therapy first, medication second",
  stemTitle:"Trauma-focused psychological therapy is the first-line treatment and medication is a selective, individualised option — which inverts the usual primary-care reflex, and means the referral matters more than the prescription",
  stemSub:"One page for the whole condition. <b>Assess risk first, every time</b> — suicide, self-harm, risk to others, and safeguarding. Then <b>individual trauma-focused CBT is first-line</b>, with EMDR considered 1–3 months after non-combat-related trauma if preferred and offered more than 3 months after it; an SSRI or venlafaxine is considered if the person prefers drug treatment, does not wish to engage with, or cannot access or engage with, trauma-focused therapy. Active monitoring is for subthreshold or mild symptoms within a month of the trauma only. And do not prescribe benzodiazepines to prevent PTSD or as routine treatment for core PTSD symptoms.",
  guideline:"NICE NG116 (2018) · NICE NG222 (2022, updated December 2025 — antidepressant monitoring, not PTSD-specific) · MHRA SSRI and SNRI safety advice",
  reviewed:"14 September 2026",
  nextReview:"14 March 2027",
  meta:[
    {t:"NICE NG116 — post-traumatic stress disorder"},
    {t:"Trauma-focused therapy is FIRST-line, not the drug", tone:"tw"},
    {t:"No benzodiazepines to prevent PTSD or as routine treatment", tone:"tw"},
    {t:"Active monitoring: subthreshold or mild symptoms within 1 month only", tone:"tw"},
    {t:"v2.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#risk"><b>Risk first</b><small>Every time</small></a><a href="#therapy"><b>Therapy</b><small>TF-CBT · EMDR</small></a><a href="#drug"><b>Medication</b><small>Selective · individualised</small></a><a href="#monitor"><b>Review</b><small>Risk-based</small></a><a href="#refer"><b>Refer</b><small>Complex · crisis</small></a></div>',
  quickSub:"The five that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Assess risk first, at every contact", html:"Suicidal thoughts, intent, plan and access to means · self-harm · risk to others · domestic abuse and ongoing threat · child or adult safeguarding · access to weapons where relevant · ability to care for dependants · protective factors and support — before anything else. <b>High risk → same-day mental-health assessment or crisis response.</b> Active monitoring → follow-up within 1 month. Starting an antidepressant → earlier review according to suicide risk, age and activation risk. Alcohol and drug self-medication is common and compounds the risk."},
    {tone:"blue", h:"Trauma-focused psychological therapy is first-line", html:"<b>Refer for an individual, validated trauma-focused CBT intervention for clinically important symptoms or PTSD — this is the treatment, not an adjunct to medication.</b> EMDR may be considered between 1 and 3 months after non-combat-related trauma if preferred, and is recommended as an option more than 3 months after non-combat-related trauma; check local service expertise for combat-related trauma. <b>Refer for it, and confirm it is accessed</b> — whether the referral was accepted, attended, trauma-focused and completed. For subthreshold or mild symptoms within 1 month of trauma, consider active monitoring with a planned follow-up within 1 month."},
    {tone:"red", h:"⛔ No benzodiazepines to prevent PTSD or as routine treatment", html:"<b>Do not prescribe benzodiazepines to prevent PTSD or as routine treatment for core PTSD symptoms.</b> They are generally inappropriate because of limited benefit, dependence, tolerance, sedation, cognitive effects and possible interference with trauma recovery. If a patient is already taking one, do not stop abruptly; assess dependence, alcohol use and withdrawal risk and agree a gradual, supported taper. Reducing alcohol and drug self-medication is part of the treatment, not a separate issue — and prescribing a benzodiazepine substitutes one form of it for another. See <a href='benzodiazepines-z-drugs.html'>benzodiazepines and z-drugs</a>."},
    {tone:"amber", h:"Medication: an SSRI or venlafaxine, selectively", html:"Consider an SSRI or venlafaxine if the person prefers drug treatment, does not wish to engage with trauma-focused therapy, or cannot access or engage with therapy. Drug treatment should not be offered as first-line in preference to trauma-focused therapy; combined treatment may be considered individually, particularly in persistent or complex illness, but is not automatically required. <b>Counsel on delayed onset and arrange a risk-based early review.</b> Do not stop an antidepressant abruptly. Persistent severe nightmares despite trauma-focused treatment need specialist advice; do not initiate prazosin routinely in primary care."},
    {tone:"green", h:"Stabilise the context — it is not optional extra", html:"Housing, finances, safety and social support; sleep support and grounding techniques while awaiting therapy; treat comorbid depression, substance misuse and pain. <b>Take housing and safety into account</b> — practical instability does not make trauma-focused therapy impossible, but treatment may need adaptation and safeguarding alongside it."}
  ],
  pathwaySub:"Five steps, and the first one is repeated at every contact.",
  pathway:[
    {title:"Assess — risk, diagnosis and context", html:"Confirm the trauma history, duration, PTSD symptom clusters and functional impairment. Assess suicide/self-harm, risk to others, psychosis, mania, ongoing threat, safeguarding, substance use, physical injury and social stability. <b>Every contact. Escalate urgently if risk rises.</b>", alert:true},
    {title:"Decide by timing and severity", html:"Within 1 month, subthreshold/mild → active monitoring with follow-up within 1 month, no psychologically focused debriefing, escalate if symptoms persist or worsen. Within 1 month with clinically important symptoms or acute stress disorder → individual trauma-focused CBT. More than 1 month → individual trauma-focused CBT; consider or offer EMDR according to timing, trauma type and preference."},
    {title:"Stabilise the context and the comorbidity", html:"Housing, safety, finances; sleep and grounding; depression, substance misuse and pain. If PTSD and depression coexist, usually prioritise trauma-focused PTSD treatment, unless depression is severe, risk is significant, or it prevents engagement."},
    {title:"Add medication where it has a role", html:"SSRI or venlafaxine if drug treatment is preferred, therapy is declined, or therapy cannot be accessed or engaged with — not as automatic first-line treatment, and not a routine benzodiazepine."},
    {title:"Review risk, response and engagement", html:"Risk-based early review after starting or changing an antidepressant (often within 1–2 weeks where risk is increased), then regularly; confirm therapy was accessed and completed."}
  ],
  sections:[

    {id:"risk", nav:"Risk first", title:"Step 1 — risk assessment, before anything else",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["<b>Risk</b>","<b>Every contact; same day if high risk</b>","<b>Suicidal thoughts, intent, plan and means · self-harm · risk to others · domestic abuse and ongoing threat · safeguarding · weapons · dependants · protective factors. Escalate urgently if risk rises</b>"],
         ["<b>Review interval</b>","<b>Active monitoring: within 1 month. New or changed antidepressant: risk-based, often 1–2 weeks</b>","<b>Earlier if suicidality, under 25, marked anxiety or agitation, activation concern, or a benzodiazepine taper</b>"],
         ["<b>Symptoms and function</b>","<b>Each review</b>","<b>Track response to therapy or drug; adjust</b>"],
         ["<b>Therapy access</b>","<b>Ongoing</b>","<b>Ensure the trauma-focused therapy referral was made AND engaged with</b>"],
         ["<b>Comorbidity</b>","<b>Each review</b>","<b>Treat depression, substance misuse and pain; usually prioritise PTSD treatment when depression coexists</b>"]
       ]},
       {b:"dl", rows:[
         ["<b>Diagnostic assessment</b>","Ask specifically about re-experiencing, avoidance, hyperarousal, negative changes in mood and thinking, dissociation, emotional dysregulation, functional impairment, and duration since the trauma"],
         ["<b>Differentials and comorbidity</b>","Major depression · bipolar disorder or current mania · psychosis · panic disorder and generalised anxiety · OCD · dissociation · traumatic brain injury · chronic pain · sleep disorder · alcohol or drug misuse · prescribed sedative dependence · physical injury or neurological disease. <b>Screen for bipolar disorder and psychosis before prescribing an antidepressant</b>"],
         ["<b>PTSD with depression</b>","If PTSD and depression coexist, usually prioritise trauma-focused PTSD treatment, as depression may improve with it. Prioritise treatment of depression or urgent specialist assessment where depression is severe, there is significant suicide risk, psychosis, mania, or the person cannot engage with PTSD treatment"],
         ["<b>Document</b>","Trauma type and date · whether the threat is ongoing · symptom clusters and functional impact · duration and diagnostic impression · suicide/self-harm/violence risk · safeguarding concerns · alcohol and drug use · bipolar/psychosis screen · physical injury and pain · treatment preference · referral destination · agreed safety plan · review date and crisis contact"]
       ]},
       {b:"why", html:"PTSD is treated primarily with trauma-focused psychological therapy; medication is considered for those who prefer drug treatment or who decline, or cannot access or engage with, therapy. Benzodiazepines are not used to prevent PTSD or as routine treatment — limited benefit and dependence risk. <b>Risk assessment comes first at every contact</b>, because PTSD can carry significant suicide risk and the presentation is often accompanied by alcohol or drug use that raises it further."}
     ]},

    {id:"therapy", nav:"Therapy", title:"Step 2 — trauma-focused psychological therapy, first-line",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"👀 Active monitoring", html:"For subthreshold or mild symptoms within 1 month of trauma: explain expected trauma responses, give grounding and sleep advice, address immediate safety and practical needs, arrange follow-up within 1 month, give clear deterioration advice, and escalate to trauma-focused CBT if symptoms persist, worsen or become functionally impairing. <b>Do not use active monitoring alone where symptoms are severe, clinically impairing, associated with significant risk, or meet criteria for PTSD/acute stress disorder requiring treatment.</b>"},
         {tone:"red", h:"🚫 No debriefing", html:"Do not offer psychologically focused debriefing for the prevention or treatment of PTSD."},
         {tone:"blue", h:"🧠 TF-CBT", html:"<b>Individual trauma-focused CBT — offered for acute stress disorder or clinically important PTSD symptoms within 1 month of trauma, and for PTSD more than 1 month after trauma.</b> NICE-supported approaches: cognitive processing therapy, cognitive therapy for PTSD, narrative exposure therapy, prolonged exposure therapy. Usually 8–12 sessions, delivered by trained and supervised practitioners."},
         {tone:"blue", h:"👁️ EMDR", html:"Eye-movement desensitisation and reprocessing — consider 1–3 months after non-combat-related trauma if the person prefers it; offer more than 3 months after non-combat-related trauma. Check local service expertise for combat-related trauma."},
         {tone:"blue", h:"✅ What a good referral looks like", html:"Individual where appropriate · based on a validated manual · delivered by a trained, supervised practitioner · trauma-focused rather than generic supportive counselling · adapted for complex PTSD, dissociation, disability, language or cultural needs. People with complex PTSD may need extra time to build trust, longer or additional sessions, and attention to safety and stability."},
         {tone:"green", h:"🔗 Practical support", html:"Address housing, finances, safety and social support — stabilise the context."},
         {tone:"amber", h:"🚫 Substances", html:"Reduce alcohol and drug self-medication; treat substance misuse alongside. Do not advise abrupt cessation of heavy alcohol or benzodiazepine use without assessing withdrawal risk; coordinate with the local alcohol or addiction service where dependence is suspected. Do not exclude people from PTSD treatment solely because of comorbid drug or alcohol misuse."},
         {tone:"green", h:"😴 Sleep and grounding", html:"<b>Sleep support and grounding techniques while awaiting therapy.</b>"}
       ]}
     ]},

    {id:"drug", nav:"Medication", title:"Step 3 — when drugs have a role",
     blocks:[
       {b:"table", head:["Step","What","When"], rows:[
         ["<b>Step 1 — SSRI or venlafaxine</b>","<b>NICE: venlafaxine or an SSRI. Sertraline and paroxetine are licensed for PTSD in the UK; venlafaxine is off-label for PTSD. Check the local formulary</b>","Consider if the person prefers drug treatment, does not wish to engage with trauma-focused therapy, or cannot access or engage with therapy — not as first-line in preference to therapy. Choice depends on previous response, comorbid depression or anxiety, substance misuse, bipolar disorder, pregnancy or breastfeeding, interaction and adverse-effect risks, and patient preference. Counsel on delayed onset; risk-based early review"],
         ["<b>Step 2 — optimise or switch</b>","Check adherence and dose; switch agent; ensure trauma-focused therapy has been offered and accessed","<b>Inadequate response after an adequate trial</b>"],
         ["<b>Persistent nightmares or sleep disturbance</b>","Persistent severe nightmares or sleep disturbance despite trauma-focused treatment require specialist advice. Do not initiate prazosin routinely in primary care for PTSD — it is not an NG116 recommendation, is off-label, evidence is mixed, and it can cause postural hypotension, dizziness and syncope","<b>Residual symptoms — specialist-led</b>"]
       ]},
       {b:"warn", html:"Do not prescribe benzodiazepines to prevent PTSD or as routine treatment for core PTSD symptoms — limited benefit, dependence, tolerance, sedation, cognitive effects and possible interference with trauma recovery. Monitor for akathisia, increased anxiety or agitation, suicidal ideation, hypomania/mania, sexual dysfunction, sleep disturbance and withdrawal if doses are missed. Do not stop an antidepressant abruptly unless there is a serious adverse reaction requiring urgent cessation."},
       {b:"dl", rows:[
         ["<b>Already on a benzodiazepine</b>","Establish dose, duration and actual use · assess dependence and withdrawal history · ask about alcohol, opioids and other sedatives · avoid abrupt cessation · agree a gradual taper · consider specialist addiction or mental-health advice where dependence is established · provide a clear review plan. If the patient is alcohol-dependent, manage alcohol reduction through an alcohol-withdrawal pathway"],
         ["<b>Stopping an antidepressant</b>","Taper gradually according to the drug, dose, duration and withdrawal history. If significant withdrawal occurs, seek advice and consider restarting the previous dose before a slower taper. Distinguish withdrawal from relapse and from emerging suicidality or activation"]
       ]}
     ]},

    {id:"monitor", nav:"Review", title:"Steps 4–5 — review schedule",
     blocks:[
       {b:"dl", rows:[
         ["<b>High risk</b>","Same-day mental-health assessment or crisis response"],
         ["<b>Active monitoring</b>","Follow-up within 1 month (NICE NG116)"],
         ["<b>Starting or changing an antidepressant</b>","Arrange an early review based on suicide risk, age, activation risk, comorbidity and patient preference — often within 1–2 weeks where risk is increased (antidepressant-monitoring guidance, not a PTSD-specific NICE interval). Safety review: risk, tolerability, engagement"],
         ["<b>Every few weeks</b>","Review suicide/self-harm and safeguarding risk, agitation or activation, adherence and adverse effects, alcohol and drug use, therapy referral and attendance, PTSD symptoms and function, depression, bipolar symptoms and psychosis, physical health and sleep; optimise or switch; coordinate with therapy"],
         ["<b>Ongoing</b>","<b>Continue effective treatment; relapse prevention; manage comorbidity</b>"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 Immediate danger", html:"Call 999 or attend A&amp;E if there is imminent risk of suicide, serious self-harm, harm to others, psychosis, severe intoxication/withdrawal, or inability to maintain immediate safety."},
         {tone:"amber", h:"🟠 Urgent, not immediate danger", html:"Contact the local Greater Manchester NHS urgent mental-health/crisis service or the NHS 111 mental-health option. Samaritans (116 123) may provide emotional support but is not a substitute for emergency or crisis assessment."},
         {tone:"amber", h:"🍷 Self-medication", html:"\"Using alcohol or drugs to cope tends to make PTSD worse — tell us and we'll help.\""},
         {tone:"amber", h:"⚠️ Early worsening", html:"\"If starting an antidepressant makes you feel more agitated or low in the first weeks, contact us promptly.\""},
         {tone:"green", h:"🫂 Recovery", html:"\"PTSD is treatable — trauma-focused therapy helps most people; it's worth waiting for and engaging with.\""}
       ]}
     ]},

    {id:"notimproving", nav:"Not improving?", title:"Not improving? Check before escalating",
     sub:"Confirm therapy access and an adequate drug trial; reassess diagnosis and comorbidity — without attributing non-response to the patient.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"1 · Therapy", html:"Confirm whether the referral was accepted, whether the patient attended, whether the intervention was trauma-focused, and whether treatment was completed. Explore barriers without attributing non-response to the patient."},
         {tone:"amber", h:"2 · Adherence and dose", html:"<b>An adequate antidepressant trial at an adequate dose?</b>"},
         {tone:"amber", h:"3 · Comorbidity", html:"<b>Inaccurate diagnosis, ongoing trauma or threat, inadequate therapy type or dose, dissociation, severe comorbidity, substance misuse, poor therapeutic fit, or neurocognitive or physical comorbidity?</b>"},
         {tone:"red", h:"4 · Safety", html:"<b>Re-screen risk — escalate if rising.</b>"},
         {tone:"blue", h:"5 · Refer", html:"<b>Complex or refractory PTSD → specialist mental-health service.</b>"}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"When to refer",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Urgent / crisis", html:"Imminent suicide or self-harm risk · psychosis, mania or severe dissociation · risk to others · inability to maintain safety · severe substance withdrawal or intoxication · serious safeguarding concern → urgent mental-health assessment."},
         {tone:"amber", h:"Specialist mental-health or trauma referral", html:"Consider where there is complex PTSD, dissociation, repeated or prolonged trauma, severe comorbidity, significant risk, poor engagement or inability to engage with primary-care treatment, diagnostic uncertainty, or failure to respond to an adequate trauma-focused intervention. Complex PTSD does not automatically need a separate specialist service if an appropriately trained service can provide adapted therapy. Use the local Greater Manchester trauma pathway (e.g. the Greater Manchester Resilience Hub) and the local safeguarding contact."},
         {tone:"amber", h:"Treatment-resistant", html:"<b>Not responding to therapy plus adequate drug treatment.</b>"},
         {tone:"blue", h:"Access to therapy", html:"<b>Refer for individual trauma-focused CBT, or EMDR according to timing, trauma type and preference.</b>"},
         {tone:"cream", h:"GP management", html:"Risk assessment, the therapy referral and chasing its uptake, active monitoring, the SSRI or venlafaxine decision, stabilising the context, and treating comorbidity all belong here. Related pages: <a href='depression.html'>depression</a> · <a href='anxiety.html'>anxiety</a> · <a href='benzodiazepines-z-drugs.html'>benzodiazepines and z-drugs</a> · <a href='alcohol-problem-drinking.html'>alcohol</a> · <a href='insomnia.html'>insomnia</a>."}
       ]},
       {b:"say", html:"PTSD is a recognised and treatable response to trauma. The most effective treatment is a specific talking therapy that processes the trauma — I'll refer you for that. Medication can help too, and we'll make sure you have support and know where to turn if things feel unsafe."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 41-year-old former paramedic presents 14 months after attending a fatal incident. He has <b>nightmares, flashbacks and hypervigilance</b>, avoids driving past the location, and is <b>drinking most evenings to get to sleep</b>. He was referred for therapy 8 months ago, <b>attended one appointment and did not go back</b>. A previous GP started <b>diazepam 2 mg at night</b>, still on repeat. He is off work, his relationship is strained, and he says he \"doesn't see the point some days\"."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Assesses suicide risk directly in response to \"doesn't see the point some days\" — the first and non-negotiable action; plans a gradual, supported diazepam taper — establishing dose, duration and actual use, dependence and withdrawal history, and alcohol, opioid and other sedative use, avoiding abrupt cessation, and agreeing a clear review plan — naming that benzodiazepines are generally inappropriate as routine treatment for PTSD; identifies that the therapy was referred but never engaged with, and treats that as an important problem rather than a reason to escalate medication; <b>explores WHY he disengaged</b> rather than simply re-referring into the same gap; addresses the alcohol as self-medication that both worsens PTSD and raises risk, without advising abrupt cessation before assessing withdrawal risk; screens for bipolar disorder and psychosis, then considers an SSRI (sertraline) as part of an individualised plan given his preference and the depressive features, counselling on delayed onset and early-weeks agitation; <b>arranges review at 1–2 weeks because of the risk and the new drug</b>; <b>addresses work, relationship and practical support</b> as part of treatment; and <b>gives the crisis safety-net with specific numbers.</b>"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG116 — Post-traumatic stress disorder</b><br><a href="https://www.nice.org.uk/guidance/ng116" rel="noopener">nice.org.uk/guidance/ng116</a><span class="rd"> — active monitoring for subthreshold symptoms within 1 month of trauma with follow-up within 1 month (1.6.4); individual trauma-focused CBT and EMDR by timing and trauma type, including the named CBT approaches and 8–12 sessions (1.6.15–1.6.19); symptom-specific CBT (1.6.23); not offering drug treatments, including benzodiazepines, to prevent PTSD (1.6.24); considering venlafaxine or an SSRI for adults with a preference for drug treatment, not first-line in preference to trauma-focused therapy (1.6.25); no psychologically focused debriefing; treating PTSD before coexisting depression unless depression is severe or there is risk; not excluding people because of drug or alcohol misuse; and the needs of people with complex PTSD. Prazosin is not an NG116 recommendation</span></li>'+
         '<li><b>NICE NG116 \u2014 Post-traumatic stress disorder</b><br><a href="https://www.nice.org.uk/guidance/ng116" rel="noopener">nice.org.uk/guidance/ng116</a><span class="rd"> — the additional needs of people with complex PTSD and referral to specialist services. (The 1–2 week early review comes from NICE NG222 for starting an antidepressant; sertraline and paroxetine as the licensed options come from the BNF.)</span></li>'+
         '<li><b>NICE NG222 (2022, updated December 2025) and MHRA guidance on SSRIs and SNRIs</b><br><a href="https://www.nice.org.uk/guidance/ng222" rel="noopener">nice.org.uk/guidance/ng222</a><span class="rd"> — risk-based early antidepressant review and monitoring for suicidality and activation, and tapering rather than stopping antidepressants abruptly. This is general antidepressant-monitoring guidance, not a PTSD-specific review schedule</span></li>'+
         '<li><b>Local Greater Manchester pathways</b><span class="rd"> — the local NHS urgent mental-health/crisis service, the Greater Manchester trauma pathway (e.g. the Greater Manchester Resilience Hub), safeguarding contacts and the local formulary; check current local referral criteria</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — sertraline, paroxetine and venlafaxine dosing; sertraline and paroxetine as licensed for PTSD, venlafaxine as an off-label NICE-recommended option, and the unlicensed status of prazosin for PTSD-related nightmares</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"PTSD — NICE NG116 (2018). Assess risk first at every contact: suicide, self-harm, risk to others, safeguarding. Individual trauma-focused CBT is first-line, with EMDR by timing, trauma type and preference — the referral matters more than the prescription, and confirming the therapy was accessed and completed is part of the follow-up. Active monitoring, with follow-up within 1 month, is for subthreshold or mild symptoms within a month of trauma only. Consider an SSRI or venlafaxine if drug treatment is preferred or therapy cannot be accessed or engaged with; screen for bipolar disorder and psychosis first, review early according to risk, and do not stop abruptly. Do not prescribe benzodiazepines to prevent PTSD or as routine treatment; taper any existing benzodiazepine gradually. Verify all doses against the current BNF before prescribing."
});
</script>
