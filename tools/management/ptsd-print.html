  foot:"PTSD — NICE NG116 and NICE. Assess risk first at every contact: suicide, self-harm, risk to others, safeguarding. Trauma-focused psychological therapy (TF-CBT or EMDR) is first-line — the referral matters more than the prescription, and confirming the therapy was actually accessed is part of the follow-up. Active monitoring is right for mild symptoms within a month of trauma. An SSRI or SNRI (sertraline, paroxetine, venlafaxine) is for those who prefer medication, decline or cannot engage in therapy, or as an adjunct; monitor for suicidality early, especially under 25, and never stop abruptly. Do NOT use benzodiazepines for core PTSD. Verify all doses against the current BNF before prescribing."
