<title>Premenstrual Syndrome — Protocol · Reasoning GP</title>
<meta name="description" content="Premenstrual syndrome and PMDD in primary care on one page: confirm the luteal pattern with a two-cycle prospective diary, separate PMS and PMDD from premenstrual exacerbation of a mood or anxiety disorder, assess suicide risk without risk scores, then choose by symptoms and preference between SSRIs (continuous or luteal), a drospirenone-containing pill, CBT and supportive measures, with transdermal estradiol (off-label, specialist-supported) and GnRH treatment kept for specialist input, following RCOG Green-top Guideline 48 (2016; BJOG 2017)." />

MG.render({
  icon:"🌸",
  title:"Premenstrual Syndrome",
  eyebrow:"Protocol · the timing is the diagnosis",
  stemTitle:"PMS and PMDD — confirm the pattern, check the risk, then treat by symptoms and preference",
  stemSub:"A premenstrual disorder is defined by when symptoms happen rather than what they are: they build in the luteal phase and ease within a few days of bleeding, usually leaving a symptom-free or substantially symptom-free interval. A prospective diary over at least two cycles substantially strengthens the diagnosis and exposes the commonest differential — a depressive or anxiety disorder present through the cycle with premenstrual exacerbation. Ask directly about suicidal ideation, intent, plans, access to means, previous attempts or self-harm, protective factors and ability to remain safe; document the clinical formulation and agreed plan, without relying on a numerical risk score. Treatment choice is symptom- and preference-led — SSRIs, a drospirenone-containing pill and CBT — with transdermal estradiol, GnRH analogues and surgery needing specialist input. RCOG Green-top Guideline No. 48 (2016) · NICE NG225 (2022) · NICE NG222 (2022, updated December 2025) · UKMEC 2025 · BNF.",
  guideline:"RCOG Green-top Guideline No. 48, Management of Premenstrual Syndrome (December 2016; BJOG 2017) · NICE NG225 Self-harm (2022) · NICE NG222 Depression in adults (2022, updated December 2025) · FSRH/CoSRH UKMEC 2025 · BNF",
  meta:[
    {t:"RCOG Green-top No. 48 · 2016 (BJOG 2017)"},
    {t:"NICE NG225 · 2022 · risk without scores"},
    {t:"NICE NG222 · 2022 · antidepressant review"},
    {t:"UKMEC 2025 · combined pill eligibility"},
    {t:"Red-flag symptoms assessed on their own merits"}
  ],
  lead:"<div class='mg-layers'><a href='#diagnose'><b>Diagnose</b><small>Two-cycle prospective diary</small></a><a href='#risk'><b>Risk</b><small>Ask about suicidal thoughts</small></a><a href='#steps'><b>Treat in steps</b><small>RCOG GTG 48</small></a><a href='#hormonal'><b>Hormonal options</b><small>COC · specialist estradiol, GnRH</small></a><a href='#refer'><b>Refer</b><small>When and where</small></a></div>",
  quickSub:"The six points that change what you do in the room. Each traces to a source listed under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"blue", h:"A prospective diary over two cycles underpins the diagnosis", html:"Ask the patient to complete a prospective daily symptom diary for <b>at least two cycles</b> before making a definitive diagnosis, unless urgent treatment is required because of significant risk or impairment; continue the diary during treatment to assess response. RCOG Green-top 48 recommends a validated daily chart such as the <b>Daily Record of Severity of Problems (DRSP)</b>. The pattern to look for: symptoms in the luteal phase, relief within a few days of bleeding starting, and a symptom-free or substantially symptom-free interval. The diary substantially strengthens the diagnosis but does not replace clinical assessment; retrospective recall is unreliable.", src:"RCOG Green-top Guideline No. 48 (2016)"},
    {tone:"red", h:"Ask directly about suicidal thoughts", html:"Severe premenstrual mood symptoms can bring hopelessness and suicidal thinking that lifts after the period but returns every cycle. Ask directly about suicidal ideation, intent, plans, access to means, previous attempts or self-harm, protective factors and ability to remain safe; document the clinical formulation and agreed plan, and agree a collaborative safety plan for the worst days. NICE NG225 says <b>do not use risk-assessment tools or scales to predict suicide or repeat self-harm</b>, and do not label people low, medium or high risk — base the response on the person’s needs.", src:"NICE NG225 (2022)"},
    {tone:"amber", h:"Symptoms all month? Think premenstrual exacerbation", html:"Symptoms that persist throughout the cycle suggest an underlying mood, anxiety or other disorder with premenstrual exacerbation rather than a pure premenstrual disorder. Treat both the underlying disorder and the premenstrual worsening where appropriate. Before an antidepressant, ask about previous episodes of elevated or irritable mood, reduced need for sleep, increased energy, grandiosity, pressured speech, impulsive spending or other out-of-character behaviour; if bipolar disorder is suspected, seek mental-health advice before antidepressant monotherapy.", src:"RCOG Green-top Guideline No. 48 (2016) · NICE NG222 (2022, updated December 2025)"},
    {tone:"cream", h:"First-line: an SSRI, a drospirenone pill or CBT", html:"First-line choices include <b>an SSRI (continuous or luteal-phase), a drospirenone-containing combined oral contraceptive if eligible under UKMEC, and CBT</b>, alone or alongside medication; vitamin B6 may be considered for mild symptoms after discussing the limited evidence. Exercise, sleep, regular meals and less caffeine and alcohol are reasonable supportive measures but less robustly evidenced. Choice depends on symptoms, contraceptive needs and preference — not every patient must try lifestyle measures first, and severe PMDD or marked impairment may justify starting an SSRI or hormonal treatment promptly while the diary continues. SSRIs often work within the first cycle in PMS — much faster than in depression.", src:"RCOG Green-top Guideline No. 48 (2016)"},
    {tone:"amber", h:"Starting an SSRI in someone aged 18 to 25", html:"NICE NG222: for people aged 18 to 25, or anyone at increased risk of suicide, <b>review 1 week after starting</b> an antidepressant or increasing the dose, and no later than 4 weeks after starting. There is a recognised risk of early activation, suicidal thoughts and self-harm in a small number of younger people and those at increased suicide risk; provide clear safety-netting and early review. If an SSRI is taken continuously, withdraw it gradually (RCOG).", src:"NICE NG222 (2022, updated December 2025) · MHRA SSRIs and SNRIs use and safety · RCOG Green-top 48"},
    {tone:"green", h:"Hormonal suppression works — and GnRH belongs to specialists", html:"Suppressing ovulation removes the cyclical trigger. A <b>drospirenone-containing combined pill</b>, taken continuously or with shortened breaks, is a sensible first hormonal option where UKMEC allows. <b>Transdermal estradiol</b> is an off-label, specialist-supported option for severe, treatment-resistant symptoms, needing reliable contraception and endometrial protection. <b>GnRH analogues with add-back HRT</b> and, rarely, surgery are specialist treatments. An LNG-IUS is not a treatment for PMS/PMDD on its own.", src:"RCOG Green-top Guideline No. 48 (2016) · UKMEC 2025"}
  ],
  pathwaySub:"Five moves. The second one is where harm is prevented.",
  pathway:[
    {title:"Listen for the timing", html:"When in the cycle do symptoms start, when do they stop, and what is she like in the week after her period? Which symptoms matter most (irritability, low mood, anxiety, feeling out of control; bloating, breast pain, headaches)? How much do they affect work, relationships and parenting?"},
    {title:"Ask about risk today", html:"Suicidal thoughts, intent and plans, access to means, previous self-harm or suicide attempts, alcohol or drug use, ability to remain safe during the luteal phase, safety of children and dependants, and past elevated mood suggesting bipolar disorder. Use a collaborative safety plan where indicated; do not use a numerical score or low/medium/high label (NICE NG225). Current intent, a plan, recent serious self-harm, inability to remain safe, psychosis or risk to a child → urgent same-day mental-health assessment via the local crisis pathway, using clinical judgement.", alert:true},
    {title:"Prove the pattern", html:"A <b>prospective daily diary for at least two cycles</b> (DRSP). A symptom-free or substantially symptom-free interval supports a premenstrual disorder, but the diagnosis rests on the overall prospective pattern, clinically significant impairment and exclusion of other explanations; symptoms through the cycle suggest premenstrual exacerbation of a mood, anxiety or other disorder. Do not request reproductive hormone levels; bloods only for specific questions (for example thyroid or anaemia symptoms)."},
    {title:"Treat in steps", html:"Explanation, supportive measures and CBT where available for everyone. First-line choice by symptoms, contraception needs and preference: an SSRI (continuous or luteal), a drospirenone-containing pill if UKMEC allows, CBT, or vitamin B6 for mild symptoms — start promptly if severe or risk is significant, while the diary continues. Second line: optimise the SSRI, combine an SSRI with an eligible COC, or spironolactone for selected physical symptoms; transdermal estradiol with endometrial protection usually with specialist advice. Review after two or three cycles, keeping the diary going."},
    {title:"Know when to hand on", html:"Severe symptoms despite appropriate SSRI/COC/CBT treatment, consideration of transdermal estradiol, a GnRH analogue or surgery, or progestogen intolerance or complex contraceptive issues → gynaecology or a specialist premenstrual disorder service. Suspected bipolar disorder, persistent all-month mood disorder or diagnostic uncertainty → mental-health services. Suicidal intent → mental-health crisis pathway."}
  ],
  sections:[
    {id:"diagnose", nav:"Diagnose", title:"Making the diagnosis", sub:"There is no blood test for PMS or PMDD. The diagnosis rests on the pattern over time.",
     blocks:[
       {b:"table", head:["Feature","What to look for","Why it matters"], rows:[
         ["<b>Timing</b>","Symptoms in the luteal phase (the 1–2 weeks before bleeding), easing within a few days of menstruation","The defining feature — the type of symptom is less important"],
         ["<b>Symptom-free interval</b>","A symptom-free or substantially symptom-free interval after the period","Supports a premenstrual disorder, but is not an absolute requirement — the diagnosis rests on the overall prospective pattern, impairment and exclusion of other explanations"],
         ["<b>Impact</b>","Effect on work, study, relationships and parenting","Distress and impairment distinguish a disorder from normal cyclical change"],
         ["<b>Prospective diary</b>","Daily ratings over <b>at least two consecutive cycles</b> (DRSP recommended by RCOG), preferably before treatment unless risk or impairment requires urgent treatment","Retrospective recall is unreliable; the diary strengthens the diagnosis without replacing clinical assessment, and becomes the baseline for judging treatment"],
         ["<b>PMS</b>","A clinical diagnosis based on cyclical symptoms with functional impairment","Most patients sit here"],
         ["<b>PMDD</b>","The severe, predominantly affective end of the spectrum. DSM-5-TR (American Psychiatric Association, international) requires at least five symptoms, including at least one core affective symptom — marked mood lability, irritability/anger, depressed mood or anxiety — together with clinically significant impairment; prospective ratings over at least two cycles are required to confirm the cyclical pattern","Not diagnosed merely because symptoms are severe or because there is suicidal ideation"],
         ["<b>Premenstrual exacerbation</b>","An existing depressive, anxiety or other disorder present through the cycle that worsens premenstrually","Treat the underlying disorder as well as the premenstrual worsening"],
         ["<b>After hysterectomy with ovaries conserved</b>","Cyclical symptoms continue without periods to time them (RCOG: ‘ovarian cycle syndrome’)","Diary symptoms by date; a GnRH analogue diagnostic trial is a specialist option, not a routine primary-care test. RCOG does not recommend hysterectomy with ovarian conservation, or endometrial ablation, as a treatment for PMS"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"🔍 Differentials and overlaps", html:"Persistent depressive or anxiety disorder and bipolar disorder (the key differentials); trauma-related symptoms; substance misuse; pregnancy; medication or contraceptive-related mood symptoms, including progestogen side effects from hormonal contraception or HRT; thyroid disease and anaemia; migraine or epilepsy with menstrual exacerbation; sleep disorder; perimenopause — mood symptoms can occur with cycle changes and vasomotor symptoms, and in otherwise healthy people aged 45 or over diagnosis is clinical without routine laboratory testing (NICE NG23).", src:"RCOG Green-top Guideline No. 48 (2016) · NICE NG23 Menopause (2015, updated April 2026)"},
         {tone:"blue", h:"🧪 Tests", html:"None are diagnostic. Do not request reproductive hormone levels to diagnose PMS or PMDD. Request FBC, ferritin, TSH or other tests only when the clinical history suggests anaemia, thyroid disease or another relevant differential.", src:"RCOG Green-top Guideline No. 48 (2016)"}
       ]},
       {b:"why", html:"<b>Why insist on the diary?</b> Many women with a depressive disorder notice worsening before their period and understandably attribute everything to hormones. Treating that as PMS — for example with the pill alone — leaves the underlying illness under-treated. The diary answers the question objectively in two months and becomes the yardstick for every later treatment decision."}
     ]},

    {id:"risk", nav:"Risk", title:"Risk, safety and the mood-disorder mimics", sub:"A cyclical illness can still be dangerous. The remitting pattern does not reduce the risk on the worst days.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Suicidal thoughts with intent or plans", html:"Current intent, a plan, recent serious self-harm, inability to remain safe, psychosis or risk to a child → urgent same-day mental-health assessment via the local crisis pathway, using clinical judgement. Agree who she will contact and how to keep safe until then. Follow NICE NG225: a needs-based assessment and collaborative safety plan, not a risk score; after actual self-harm, a psychosocial assessment and safety plan.", src:"NICE NG225 (2022)"},
         {tone:"amber", h:"🟠 Luteal-phase suicidal thoughts without current intent", html:"Luteal-phase suicidal ideation remains clinically important even if it resolves after menstruation. It requires a documented safety plan for the luteal phase (warning signs, coping strategies, people and services to contact), close follow-up, involvement of family if she agrees, and treatment of the underlying premenstrual disorder and any coexisting psychiatric illness.", src:"NICE NG225 (2022)"},
         {tone:"amber", h:"🟠 Possible bipolar disorder", html:"Ask about previous episodes of elevated or irritable mood, reduced need for sleep, increased energy, grandiosity, pressured speech, impulsive spending or other out-of-character behaviour. Assess the nature, duration, impairment and context rather than referring for any ‘past high’. If bipolar disorder is suspected, seek mental-health advice before antidepressant monotherapy, which can destabilise mood. Formal screening questionnaires are not required and a positive result is not diagnostic.", src:"NICE NG222 (2022, updated December 2025)"},
         {tone:"amber", h:"🟠 Children and safeguarding", html:"Severe irritability or loss of control can affect how children are cared for. Ask kindly and directly, offer support, and follow local safeguarding procedures if a child is at risk.", src:"NICE NG225 (2022) — assessment of needs and social circumstances"}
       ]},
       {b:"say", html:"I’m really glad you told me about those thoughts. Even though they go away after your period, they matter, and I want us to have a plan for the difficult days as well as treatment that makes them less likely to come back. Can we talk about what those days are like and who you could contact?"}
     ]},

    {id:"steps", nav:"Treatment steps", title:"Treatment — the RCOG steps", sub:"RCOG Green-top 48 groups treatments into first-line, second-line and specialist options. Choose by symptoms, contraceptive needs and preference — not every patient must try lifestyle measures before medication.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Everyone", title:"Explanation, lifestyle and self-care", when:"from the first consultation", fromLabel:"start here",
          html:"Explain the diagnosis and validate how disabling it can be. Regular aerobic exercise (non-randomised evidence of benefit), sleep, stress reduction, regular meals with a low glycaemic index, and less caffeine and alcohol. These are reasonable supportive measures rather than strongly evidence-based treatments. Also assess and treat comorbid depression, anxiety, trauma, substance misuse or bipolar disorder. Severe PMDD or marked functional impairment may justify starting an SSRI or hormonal treatment promptly while the diary continues."},
         {step:"First line", title:"CBT", when:"alone or alongside drugs", fromLabel:"psychological",
          html:"Cognitive behavioural therapy is a first-line RCOG option. RCOG recommends CBT routinely as an option in severe PMS. One small older randomised comparison (supporting, not definitive, evidence) found fluoxetine worked faster but CBT maintained its effect better after treatment stopped. Access via NHS Talking Therapies or local women’s health psychology."},
         {step:"First line", title:"Low-dose SSRI — continuous or luteal only", when:"predominantly psychological symptoms", fromLabel:"pharmacological",
          html:"RCOG: SSRIs are a first-line pharmacological option; <b>either luteal-phase or continuous dosing</b> can be used. For luteal-phase treatment, start after ovulation or approximately 14 days before the expected onset of menstruation, continuing until menstruation begins or for the clinician-agreed luteal interval, adapted to cycle regularity and symptom timing. Luteal dosing suits women with a clear pattern and regular cycles; continuous dosing suits irregular cycles or some all-month symptoms. Use for PMS is off-label in the UK — <b>dose per BNF</b>, starting low. Withdraw gradually after continuous use — particularly with paroxetine, venlafaxine and other medicines associated with withdrawal symptoms."},
         {step:"First line", title:"Combined oral contraceptive", when:"also wanting contraception", fromLabel:"ovulation suppression",
          html:"RCOG: a <b>drospirenone-containing COC</b> may be considered as a first-line pharmacological intervention; the evidence is strongest for ethinylestradiol/drospirenone preparations, not all new-generation pills, and emerging evidence supports continuous rather than cyclical use. PMDD is not necessarily a licensed indication for every preparation. Assess blood pressure, BMI, smoking, VTE history, migraine phenotype, cardiovascular risk, liver disease and breast-cancer history, and check eligibility against the current UKMEC 2025 tables (for example, current migraine with aura at any age is UKMEC 4). Continuous or extended regimens remove the hormone-free interval in which symptoms can recur."},
         {step:"First line", title:"Vitamin B6", when:"mild symptoms, patient preference", fromLabel:"supplement",
          html:"May be considered for mild symptoms after discussing the limited evidence; not equivalent in efficacy to SSRIs or drospirenone-containing COCs. Avoid high-dose or prolonged supplementation because pyridoxine-associated peripheral neuropathy can occur. Check the total dose from all supplements and follow current product information and local formulary advice."},
         {step:"Second line", title:"Optimise the SSRI, combine, or specialist-supported estradiol", when:"first line not enough", fromLabel:"escalate",
          html:"Optimise or change the SSRI regimen (continuous or luteal); combine an SSRI with an eligible COC where clinically appropriate; consider spironolactone for selected physical symptoms, considering renal function, potassium and contraceptive requirements. <b>Transdermal estradiol</b> may be considered for severe, treatment-resistant PMS/PMDD, usually with gynaecology or menopause-specialist input — off-label, not contraceptive, and needing endometrial protection (see Hormonal options)."},
         {step:"Specialist", title:"GnRH analogue with add-back HRT", when:"severe, refractory PMS or PMDD", fromLabel:"gynaecology",
          html:"Complete ovarian suppression. RCOG: add-back HRT (continuous combined or tibolone) if used beyond 6 months, with bone-density monitoring. Also used, by specialists, for up to 3 months as a diagnostic trial when the diary is inconclusive, and as a test before any surgery. Watch for hypo-oestrogenic adverse effects. GnRH analogues are not a routine primary-care treatment and should not be used simply to ‘prove’ PMDD without specialist involvement."},
         {step:"Specialist", title:"Surgery", when:"rarely, after a GnRH trial", fromLabel:"last resort",
          html:"Hysterectomy with bilateral salpingo-oophorectomy only for a small number of women with severe symptoms after failure or intolerance of medical treatment, a successful GnRH analogue trial, demonstration that HRT is tolerated, and counselling about irreversible infertility and surgical menopause. Removing the uterus as well as the ovaries allows oestrogen-only HRT afterwards, avoiding progestogen-induced symptoms (RCOG). Hysterectomy with ovarian conservation and endometrial ablation are not recommended for PMS."}
       ]},
       {b:"why", html:"<b>Why SSRIs work so quickly here.</b> In depression an SSRI takes weeks; in premenstrual disorders improvement is often seen within the first treated cycle, which is what makes luteal-only dosing possible. It also means a woman who has had no benefit after two or three well-taken cycles should have the plan reviewed rather than simply continue."}
     ]},

    {id:"hormonal", nav:"Hormonal options", title:"Hormonal options — suppress ovulation, protect the endometrium", sub:"The aim is to switch off the cycle that drives the symptoms, while avoiding progestogen side effects that mimic PMS. Transdermal estradiol is off-label and usually specialist-supported.",
     blocks:[
       {b:"table", head:["Option","How it is used","Points to check"], rows:[
         ["<b>Combined oral contraceptive</b>","Evidence strongest for ethinylestradiol/drospirenone preparations (RCOG); continuous or extended use","UKMEC 2025 eligibility: blood pressure, BMI, smoking, VTE history, migraine phenotype (migraine with aura UKMEC 4), cardiovascular risk, liver disease, breast-cancer history. Licensed in the UK for contraception; PMDD is not necessarily a licensed indication for every preparation"],
         ["<b>Transdermal estradiol</b>","May be considered for severe, treatment-resistant PMS/PMDD, usually with gynaecology or menopause-specialist input. Use the lowest effective oestradiol dose and follow specialist/local guidance; the evidence base is limited","Off-label for PMS. Counsel that ovulation may not be reliably suppressed, contraception is still required, a uterus requires endometrial protection, progestogen may itself worsen PMS-like symptoms, long-term safety data for this indication are limited, and unscheduled bleeding requires assessment"],
         ["<b>Endometrial protection with estradiol</b>","When systemic oestradiol is used, women with a uterus require adequate progestogen opposition — follow specialist/local guidance for the regimen. An LNG-IUS may be used for this purpose, but it is not a treatment for PMS/PMDD in its own right","RCOG: use the lowest progestogen dose possible. An LNG-IUS provides predominantly local endometrial progestogen exposure, but PMS-like symptoms and bleeding may still occur"],
         ["<b>GnRH analogue</b>","Specialist initiation","Add-back HRT (continuous combined or tibolone) beyond 6 months; RCOG advises monitoring bone density when an analogue is used for more than 6 months"],
         ["<b>Hysterectomy with bilateral salpingo-oophorectomy</b>","Specialist, after a successful GnRH trial","Oestrogen-only HRT afterwards (no progestogen needed once the uterus is removed); irreversible — counsel on fertility and surgical menopause"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"⚠️ Progestogen intolerance", html:"Some women have PMS-like symptoms with any systemic progestogen. When estradiol is used, the RCOG approach is the lowest effective progestogen dose, or predominantly local delivery with an LNG-IUS (PMS-like symptoms may still occur). Consider this too when an existing contraceptive or HRT seems to be the trigger.", src:"RCOG Green-top Guideline No. 48 (2016)"},
         {tone:"blue", h:"ℹ️ Contraception and pregnancy plans", html:"Before prescribing, document pregnancy intention, contraception requirement, migraine phenotype, VTE and cardiovascular risk, smoking and blood pressure, and current medicines and interactions. SSRIs, transdermal estradiol and GnRH analogues are not reliable contraception. The COC gives both symptom control and contraception if UKMEC allows; an LNG-IUS may provide contraception and endometrial protection but is not a treatment for PMS/PMDD alone.", src:"FSRH/CoSRH UKMEC 2025 · RCOG Green-top Guideline No. 48 (2016)"}
       ]}
     ]},

    {id:"ssri", nav:"SSRI practicalities", title:"Prescribing an SSRI for PMS or PMDD", sub:"The same safety rules as for depression apply, with a few PMS-specific points.",
     blocks:[
       {b:"cards", items:[
         {tone:"cream", h:"💊 Choice and dosing", html:"Choose an SSRI the patient can tolerate; start at a low dose and titrate — <b>dose per BNF</b> (use for PMS is off-label in the UK). Decide between luteal-phase dosing (from after ovulation or approximately 14 days before expected menstruation, until bleeding starts or for the agreed luteal interval) and continuous dosing according to cycle regularity and whether symptoms extend into the follicular phase.", src:"RCOG Green-top Guideline No. 48 (2016) · BNF"},
         {tone:"amber", h:"⚠️ Early review in young adults", html:"Assess mental state before treatment. Aged 18 to 25, or at increased suicide risk: review 1 week after starting or increasing the dose, then as clinically required and no later than 4 weeks after starting (NICE NG222, written for depression but appropriate here). There is a recognised risk of early activation, suicidal thoughts and self-harm in a small number of younger people and those at increased suicide risk — warn about initial agitation or anxiety and how to seek help.", src:"NICE NG222 (2022, updated December 2025) · MHRA SSRIs and SNRIs use and safety"},
         {tone:"amber", h:"⚠️ Side effects that matter here", html:"Sexual dysfunction, nausea and sleep disturbance are common reasons for stopping. Continuous use should be tapered rather than stopped abruptly (RCOG), particularly with paroxetine, venlafaxine and other medicines associated with withdrawal symptoms. Check for interactions and bleeding risk with anticoagulants or NSAIDs in the BNF.", src:"RCOG Green-top Guideline No. 48 (2016) · BNF"},
         {tone:"blue", h:"🤰 Planning pregnancy", html:"Discuss plans before starting. If pregnancy is planned, review the need for continuing treatment and the choice of SSRI with the patient.", src:"BNF · NICE NG222 (2022, updated December 2025)"}
       ]}
     ]},

    {id:"follow", nav:"Review", title:"Review and follow-up", sub:"The diary that made the diagnosis is also the tool that judges the treatment.",
     blocks:[
       {b:"timeline", items:[
         {n:"1", when:"Now", title:"Diagnosis and safety", html:"Explain, validate, assess risk and agree a safety plan if needed. Start the prospective diary. Document the diagnosis, treatment choice, pregnancy plans and safety plan. Supportive measures and a CBT referral can start straight away, and treatment can start before the diary is complete if symptoms are severe or risk is significant."},
         {n:"2", when:"After two cycles", title:"Confirm and choose", html:"Review the diary together. Confirmed premenstrual disorder → choose a first-line option. All-month symptoms → treat the underlying mood or anxiety disorder and the premenstrual exacerbation."},
         {n:"3", when:"1 week (if 18–25 or at risk)", title:"Early SSRI check", html:"NICE NG222 early review after starting or increasing an antidepressant."},
         {n:"4", when:"After 1–2, then 2–3 treated cycles", title:"Judge the response", html:"After 1–2 cycles assess symptom and functional response, adverse effects and adherence; after 2–3 cycles decide whether to continue, alter treatment or refer. Compare the diary with the baseline and include occupational and social function, relationships and parenting, sleep, suicidality and self-harm, treatment adverse effects, and contraception and pregnancy plans. Partial response → adjust dose or regimen, or combine an SSRI with a COC. No response → second-line options or specialist advice."},
         {n:"5", when:"Ongoing", title:"Maintain and reassess", html:"Review at least annually thereafter, or sooner if treatment changes, pregnancy is planned, symptoms worsen or risk changes, and whenever life stage changes: postpartum, perimenopause."}
       ]},
       {b:"say", html:"The diary is going to do a lot of work for us. First it will tell us whether this is definitely linked to your cycle; then it will tell us whether the treatment is working. If the first thing we try doesn’t help enough, there are several more steps — you won’t be left with just putting up with it."}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — who, when, where", sub:"Most premenstrual disorders are diagnosed and treated in primary care.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same day — mental-health crisis", html:"Current suicidal intent, a plan, recent serious self-harm, inability to remain safe, psychosis or risk to a child → urgent same-day mental-health assessment through the local crisis pathway.", src:"NICE NG225 (2022)"},
         {tone:"amber", h:"Mental-health services", html:"Suspected bipolar disorder · a persistent all-month mood disorder · risk that remains significant despite a safety plan · psychosis, severe self-neglect or recurrent self-harm · diagnostic uncertainty.", src:"NICE NG222 (2022, updated December 2025)"},
         {tone:"amber", h:"Gynaecology or specialist premenstrual disorder service", html:"Symptoms remain severe despite appropriate SSRI/COC/CBT treatment · transdermal estradiol or GnRH analogue treatment is being considered · surgery is being considered · progestogen intolerance or complex contraceptive issues prevent treatment.", src:"RCOG Green-top Guideline No. 48 (2016)"},
         {tone:"cream", h:"Manage in primary care", html:"Diary-confirmed PMS or PMDD responding to supportive measures, CBT, an SSRI or a combined pill.", src:"RCOG Green-top Guideline No. 48 (2016)"},
         {tone:"blue", h:"Unrelated red-flag symptoms", html:"PMS/PMDD is not itself a suspected-cancer presentation. Investigate unrelated red-flag symptoms — such as persistent intermenstrual/postcoital bleeding, persistent unexplained pelvic pain, a pelvic mass or unexplained weight loss — under the relevant pathway."}
       ]},
       {b:"say", html:"What you’re describing — feeling like a different person in the fortnight before your period and yourself again afterwards — is a recognised condition with effective treatments. Let’s confirm the pattern with a diary, make sure you’re safe on the hardest days, and start treatment. If the first steps don’t help enough, we can involve a specialist."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card; the Casebook holds the full premenstrual disorder case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 23-year-old student says that for ten days before each period she is ‘a different person’: furious, tearful, unable to revise, and twice she has thought everyone would be better off without her. She is fine the week after. She has migraine with aura and asks for ‘the pill that helps PMS’ a friend mentioned."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Establishes the <b>luteal pattern and symptom-free interval</b>; asks directly about the <b>suicidal thoughts</b>, intent, plans and means, and agrees a <b>safety plan</b> without scoring risk; asks about <b>bipolar features</b>; starts a <b>two-cycle diary</b>; explains that a <b>combined hormonal contraceptive should not be used with migraine with aura</b> because of the unacceptable stroke risk (UKMEC 4), considering a non-oestrogen contraceptive and an SSRI or specialist advice instead; offers <b>CBT</b> and a low-dose <b>SSRI</b> (continuous or luteal) with a <b>1-week review</b> because she is under 25; safety-nets clearly."}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"The sources below underpin this page. RCOG Green-top No. 48 dates from 2016/2017 and some recommendations rest on limited or older evidence.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>RCOG Green-top Guideline No. 48 — Management of Premenstrual Syndrome</b> (published December 2016; Green LJ, O’Brien PMS, Panay N, Craig M. BJOG 2017;124:e73–e105)<br><a href="https://doi.org/10.1111/1471-0528.14260" rel="noopener">doi.org/10.1111/1471-0528.14260</a> · <a href="https://www.rcog.org.uk/guidance/browse-all-guidance/green-top-guidelines/premenstrual-syndrome-management-green-top-guideline-no-48/" rel="noopener">rcog.org.uk</a><span class="rd"> — prospective daily symptom rating over two cycles (DRSP); exercise, CBT, vitamin B6, new-generation COC (cyclical or continuous) and low-dose SSRIs (continuous or luteal) as first-line options; drospirenone-containing pills usually more effective; taper continuous SSRIs; transdermal estradiol with progestogen opposition for severe PMS (limited evidence, off-label); the LNG-IUS is not a treatment for PMS alone and is used for endometrial protection, lowest progestogen dose; GnRH analogues with add-back HRT beyond 6 months and bone-density monitoring; surgery after a GnRH trial; hysterectomy with ovarian conservation and endometrial ablation not recommended; oestrogen-only HRT after hysterectomy with BSO</span></li>'+
         '<li><b>NICE NG225 — Self-harm: assessment, management and preventing recurrence</b> (September 2022)<br><a href="https://www.nice.org.uk/guidance/ng225" rel="noopener">nice.org.uk/guidance/ng225 — recommendations</a><span class="rd"> — do not use risk-assessment tools and scales to predict suicide or repeat self-harm; do not stratify into low, medium or high risk; needs-based assessment and safety planning</span></li>'+
         '<li><b>NICE NG222 — Depression in adults: treatment and management</b> (June 2022, updated December 2025)<br><a href="https://www.nice.org.uk/guidance/ng222" rel="noopener">nice.org.uk/guidance/ng222 — recommendations</a><span class="rd"> — mental-state assessment before treatment; review 1 week after starting or increasing an antidepressant in people aged 18 to 25 or at increased suicide risk, and no later than 4 weeks after starting (written for depression)</span></li>'+
         '<li><b>MHRA — Selective serotonin reuptake inhibitors (SSRIs) and serotonin and noradrenaline reuptake inhibitors (SNRIs): use and safety</b><br><a href="https://www.gov.uk/government/publications/ssris-and-snris-use-and-safety" rel="noopener">gov.uk</a><span class="rd"> — a recognised risk of early activation, suicidal thoughts and self-harm in a small number of younger people</span></li>'+
         '<li><b>FSRH (now CoSRH) — UK Medical Eligibility Criteria for Contraceptive Use (UKMEC 2025)</b><br><a href="https://www.cosrh.org/Common/Uploaded%20files/documents/UKMEC_2025.pdf" rel="noopener">UKMEC 2025 (PDF, includes summary tables)</a><span class="rd"> — combined hormonal contraception eligibility, including current migraine with aura at any age as UKMEC 4; date-check at each annual review</span></li>'+
         '<li><b>NICE NG23 — Menopause: identification and management</b> (2015, updated April 2026)<br><a href="https://www.nice.org.uk/guidance/ng23/chapter/Recommendations" rel="noopener">nice.org.uk/guidance/ng23 — recommendations</a><span class="rd"> — perimenopause as a differential; clinical diagnosis without routine laboratory testing in otherwise healthy people aged 45 or over</span></li>'+
         '<li><b>BNF</b> — SSRIs, combined hormonal contraceptives, estradiol, pyridoxine<br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — doses, interactions and licensed/off-label status, pyridoxine neuropathy with high doses; not evidence for the protocol as a whole</span></li>'+
         '<li><b>International — American Psychiatric Association, DSM-5-TR</b> (2022)<span class="rd"> — PMDD criteria (five or more luteal symptoms including a core mood symptom, confirmed by prospective ratings over two cycles); used only because no UK diagnostic criteria exist</span></li>'+
         '<li><b>Hunter MS, et al. Fluoxetine versus CBT for premenstrual dysphoric disorder.</b> J Psychosom Obstet Gynaecol 2002;23:193–9<span class="rd"> — a small, older individual study: faster response with fluoxetine and better maintenance with CBT; supporting, not definitive, evidence</span></li>'+

         '</ul></div>'}
     ]}
  ],
  foot:"Premenstrual syndrome and premenstrual dysphoric disorder in primary care — RCOG Green-top Guideline No. 48 (2016; BJOG 2017), NICE NG225 (2022), NICE NG222 (2022, updated December 2025), UKMEC 2025 and the BNF. SSRIs and estradiol are off-label for PMS; transdermal estradiol is usually specialist-supported and needs contraception and endometrial protection; check the BNF for doses. Not a substitute for clinical judgement."
});
