<script>
MG.render({
  icon:"🌸",
  title:"Premenstrual Syndrome",
  eyebrow:"Protocol · the timing is the diagnosis",
  stemTitle:"PMS and PMDD — prove the pattern, check the risk, then treat in steps",
  stemSub:"A premenstrual disorder is defined by when symptoms happen rather than what they are: they build in the luteal phase and clear within a few days of bleeding, leaving a genuinely well week. A prospective diary over two cycles proves that pattern and exposes the commonest mimic — a depressive or anxiety disorder that is present all month and simply worse before a period. Severe premenstrual mood symptoms can include suicidal thoughts, so risk is part of every assessment. Treatment then follows the RCOG steps from lifestyle and CBT to SSRIs and ovulation suppression, with GnRH analogues and surgery kept for specialists. RCOG Green-top Guideline No. 48 (2016) · NICE NG225 (2022) · NICE NG222 (2022) · UKMEC 2025 · BNF.",
  guideline:"RCOG Green-top Guideline No. 48, Management of Premenstrual Syndrome (December 2016; BJOG 2017) · NICE NG225 Self-harm (2022) · NICE NG222 Depression in adults (2022) · FSRH/CoSRH UKMEC 2025 · BNF",
  meta:[
    {t:"RCOG Green-top No. 48 · 2016"},
    {t:"NICE NG225 · 2022 · risk without scores"},
    {t:"NICE NG222 · 2022 · antidepressant review"},
    {t:"UKMEC 2025 · combined pill eligibility"},
    {t:"No NG12 criterion applies"}
  ],
  lead:"<div class='mg-layers'><a href='#diagnose'><b>Diagnose</b><small>Two-cycle prospective diary</small></a><a href='#risk'><b>Risk</b><small>Ask about suicidal thoughts</small></a><a href='#steps'><b>Treat in steps</b><small>RCOG GTG 48</small></a><a href='#hormonal'><b>Hormonal options</b><small>COC, estradiol, GnRH</small></a><a href='#refer'><b>Refer</b><small>When and where</small></a></div>",
  quickSub:"The six points that change what you do in the room. Each traces to a source listed under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"blue", h:"A prospective diary over two cycles makes the diagnosis", html:"Ask the woman to rate her symptoms <b>every day for two consecutive cycles</b>, starting now rather than recalling past months. RCOG Green-top 48 recommends a validated daily chart such as the <b>Daily Record of Severity of Problems (DRSP)</b>. The pattern to look for: symptoms in the luteal phase, relief within a few days of bleeding starting, and a symptom-free week. Retrospective recall over-diagnoses PMS.", src:"RCOG Green-top Guideline No. 48 (2016)"},
    {tone:"red", h:"Ask directly about suicidal thoughts", html:"Severe premenstrual mood symptoms can bring hopelessness and suicidal thinking that lifts after the period but returns every cycle. Ask directly, explore intent and plans, and agree a safety plan for the worst days. NICE NG225 says <b>do not use risk-assessment tools or scales to predict suicide or repeat self-harm</b>, and do not label people low, medium or high risk — base the response on the person’s needs.", src:"NICE NG225 (2022)"},
    {tone:"amber", h:"Symptoms all month? That is not PMS", html:"If the diary shows low mood or anxiety through the follicular phase too, the likely diagnosis is a depressive or anxiety disorder with premenstrual worsening, which is treated as that disorder. Screen for past highs (hypomania or mania) before starting an antidepressant — bipolar disorder can present as ‘premenstrual’ mood swings.", src:"RCOG Green-top Guideline No. 48 (2016) · NICE NG222 (2022)"},
    {tone:"cream", h:"First-line: lifestyle, CBT, a pill or a low-dose SSRI", html:"RCOG Green-top 48 places <b>exercise, CBT, vitamin B6, a new-generation combined oral contraceptive (cyclical or continuous) and a low-dose SSRI (continuous or luteal-phase only)</b> among the first-line options. Choice depends on symptoms, contraceptive needs and preference. SSRIs often work within the first cycle in PMS — much faster than in depression.", src:"RCOG Green-top Guideline No. 48 (2016)"},
    {tone:"amber", h:"Starting an SSRI in someone aged 18 to 25", html:"NICE NG222: for people aged 18 to 25, or anyone at increased risk of suicide, <b>review 1 week after starting</b> an antidepressant or increasing the dose, because suicidal thoughts can increase early in treatment. The MHRA’s review found the risk of suicidal behaviour with SSRIs is raised in people up to 25. If an SSRI is taken continuously, withdraw it gradually (RCOG).", src:"NICE NG222 (2022) · MHRA SSRIs and SNRIs use and safety · RCOG Green-top 48"},
    {tone:"green", h:"Hormonal suppression works — and GnRH belongs to specialists", html:"Suppressing ovulation removes the cyclical trigger. A <b>drospirenone-containing combined pill</b>, taken continuously or with shortened breaks, is a sensible first hormonal option where UKMEC allows. <b>Transdermal estradiol with progestogen protection</b> is second-line. <b>GnRH analogues with add-back HRT</b> and, rarely, surgery are specialist treatments.", src:"RCOG Green-top Guideline No. 48 (2016) · UKMEC 2025"}
  ],
  pathwaySub:"Five moves. The second one is where harm is prevented.",
  pathway:[
    {title:"Listen for the timing", html:"When in the cycle do symptoms start, when do they stop, and what is she like in the week after her period? Which symptoms matter most (irritability, low mood, anxiety, feeling out of control; bloating, breast pain, headaches)? How much do they affect work, relationships and parenting?"},
    {title:"Ask about risk today", html:"Suicidal thoughts on the worst days, self-harm, safety of children, and past highs suggesting bipolar disorder. Respond to what you find without scoring it (NICE NG225). Urgent mental-health input for current intent or plans.", alert:true},
    {title:"Prove the pattern", html:"A <b>prospective daily diary for two cycles</b> (DRSP). A symptom-free follicular week confirms a premenstrual disorder; symptoms all month point to a primary mood or anxiety disorder. Bloods only for specific questions (for example thyroid or anaemia symptoms)."},
    {title:"Treat in steps", html:"Lifestyle, exercise and CBT for everyone. Then a low-dose SSRI (continuous or luteal) and/or a combined pill for ovulation suppression. Second line: higher-dose SSRI, or transdermal estradiol with progestogen. Review after two or three cycles, keeping the diary going."},
    {title:"Know when to hand on", html:"Failure of first-line and second-line options, severe PMDD, diagnostic uncertainty, or consideration of GnRH analogues → gynaecology or a specialist premenstrual disorder service. Suicidal intent → mental-health crisis pathway."}
  ],
  sections:[
    {id:"diagnose", nav:"Diagnose", title:"Making the diagnosis", sub:"There is no blood test for PMS or PMDD. The diagnosis rests on the pattern over time.",
     blocks:[
       {b:"table", head:["Feature","What to look for","Why it matters"], rows:[
         ["<b>Timing</b>","Symptoms in the luteal phase (the 1–2 weeks before bleeding), easing within a few days of menstruation","The defining feature — the type of symptom is less important"],
         ["<b>Symptom-free week</b>","A clear week after the period with few or no symptoms","Separates a premenstrual disorder from a continuous mood disorder"],
         ["<b>Impact</b>","Effect on work, study, relationships and parenting","Distress and impairment distinguish a disorder from normal cyclical change"],
         ["<b>Prospective diary</b>","Daily ratings over <b>two consecutive cycles</b> (DRSP recommended by RCOG)","Retrospective recall is unreliable; the diary also becomes the baseline for judging treatment"],
         ["<b>PMDD</b>","The severe, mood-predominant end of the spectrum. The American Psychiatric Association DSM-5-TR (international) requires at least five luteal symptoms, including at least one of marked mood lability, irritability, depressed mood or anxiety, confirmed by prospective ratings over at least two cycles","Recognises how disabling it can be; guides urgency and escalation"],
         ["<b>After hysterectomy with ovaries conserved</b>","Cyclical symptoms continue without periods to time them (RCOG: ‘ovarian cycle syndrome’)","Diary symptoms by date; RCOG does not recommend hysterectomy with ovarian conservation, or endometrial ablation, as a treatment for PMS"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"🔍 Differentials and overlaps", html:"Depression, anxiety and bipolar disorder (the key mimics); perimenopause (irregular cycles, vasomotor symptoms — see NICE NG23); thyroid disease; anaemia with fatigue; migraine or epilepsy with menstrual exacerbation; progestogen side effects from hormonal contraception or HRT, which can reproduce PMS-like symptoms.", src:"RCOG Green-top Guideline No. 48 (2016) · NICE NG23 Menopause (2015, updated 2024)"},
         {tone:"blue", h:"🧪 Tests", html:"None are diagnostic. Check TSH, full blood count or ferritin only if the history suggests thyroid disease or anaemia. Hormone levels do not diagnose PMS and add nothing.", src:"RCOG Green-top Guideline No. 48 (2016)"}
       ]},
       {b:"why", html:"<b>Why insist on the diary?</b> Many women with a depressive disorder notice worsening before their period and understandably attribute everything to hormones. Treating that as PMS — for example with the pill alone — leaves the underlying illness under-treated. The diary answers the question objectively in two months and becomes the yardstick for every later treatment decision."}
     ]},

    {id:"risk", nav:"Risk", title:"Risk, safety and the mood-disorder mimics", sub:"A cyclical illness can still be dangerous. The remitting pattern does not reduce the risk on the worst days.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Suicidal thoughts with intent or plans", html:"Current intent, plans or recent self-harm → urgent same-day mental-health assessment via the local crisis pathway. Agree who she will contact and how to keep safe until then. Follow NICE NG225: a needs-based assessment and safety plan, not a risk score.", src:"NICE NG225 (2022)"},
         {tone:"amber", h:"🟠 Luteal-phase suicidal thoughts without current intent", html:"Take them seriously even though they lift after the period. Build a safety plan for the luteal phase (warning signs, coping strategies, people and services to contact), involve family if she agrees, review soon, and start effective treatment.", src:"NICE NG225 (2022)"},
         {tone:"amber", h:"🟠 Possible bipolar disorder", html:"Ask about past periods of elevated mood, reduced need for sleep, or racing thoughts. If present, involve mental-health services before starting an antidepressant, which can destabilise mood.", src:"NICE NG222 (2022)"},
         {tone:"amber", h:"🟠 Children and safeguarding", html:"Severe irritability or loss of control can affect how children are cared for. Ask kindly and directly, offer support, and follow local safeguarding procedures if a child is at risk.", src:"NICE NG225 (2022) — assessment of needs and social circumstances"}
       ]},
       {b:"say", html:"I’m really glad you told me about those thoughts. Even though they go away after your period, they matter, and I want us to have a plan for the difficult days as well as treatment that makes them less likely to come back. Can we talk about what those days are like and who you could contact?"}
     ]},

    {id:"steps", nav:"Treatment steps", title:"Treatment — the RCOG steps", sub:"RCOG Green-top 48 groups treatments into first-line, second-line and specialist options. Choose within a step by symptoms, contraceptive needs and preference.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Everyone", title:"Explanation, lifestyle and self-care", when:"from the first consultation", fromLabel:"start here",
          html:"Explain the diagnosis and validate how disabling it can be. Regular aerobic exercise (non-randomised evidence of benefit), sleep, stress reduction, regular meals with a low glycaemic index, and less caffeine and alcohol. RCOG: these measures are sensible general-health advice and are worth trying before starting treatment, though not tested in depth."},
         {step:"First line", title:"CBT", when:"alone or alongside drugs", fromLabel:"psychological",
          html:"Cognitive behavioural therapy is a first-line RCOG option. In a randomised comparison, fluoxetine worked faster but CBT maintained its effect better after treatment stopped. Access via NHS Talking Therapies or local women’s health psychology."},
         {step:"First line", title:"Low-dose SSRI — continuous or luteal only", when:"predominantly psychological symptoms", fromLabel:"pharmacological",
          html:"RCOG: SSRIs are a first-line pharmacological option; <b>either luteal-phase dosing (day 15 to 28) or continuous dosing</b> can be used. Luteal dosing suits women with a clear pattern and regular cycles; continuous dosing suits irregular cycles or some all-month symptoms. Use for PMS is off-label in the UK — <b>dose per BNF</b>, starting low. Withdraw gradually after continuous use."},
         {step:"First line", title:"Combined oral contraceptive", when:"also wanting contraception", fromLabel:"ovulation suppression",
          html:"A new-generation COC taken cyclically or continuously. RCOG: pills with an anti-androgenic progestogen such as <b>drospirenone</b> are usually more effective for PMS and PMDD. Check eligibility against UKMEC 2025 (for example, migraine with aura is UKMEC 4). Continuous or extended regimens remove the hormone-free interval in which symptoms can recur."},
         {step:"First line", title:"Vitamin B6", when:"mild symptoms, patient preference", fromLabel:"supplement",
          html:"Listed by RCOG among first-line options, with limited evidence. Advise against high doses long term because of the risk of peripheral neuropathy — dose per BNF."},
         {step:"Second line", title:"Higher-dose SSRI or transdermal estradiol", when:"first line not enough", fromLabel:"escalate",
          html:"Increase the SSRI (continuous or luteal), or use <b>transdermal estradiol to suppress ovulation</b> — see Hormonal options. Many women can be managed at this step in primary care with specialist advice."},
         {step:"Specialist", title:"GnRH analogue with add-back HRT", when:"severe, refractory PMS or PMDD", fromLabel:"gynaecology",
          html:"Complete ovarian suppression. RCOG: add-back HRT (continuous combined or tibolone) if used beyond 6 months, with bone-density monitoring. Also used as a test before any surgery."},
         {step:"Specialist", title:"Surgery", when:"rarely, after a GnRH trial", fromLabel:"last resort",
          html:"Hysterectomy with bilateral salpingo-oophorectomy for a small number of women with severe symptoms who responded to a GnRH analogue and tolerated add-back HRT. Removing the uterus as well as the ovaries allows oestrogen-only HRT afterwards, avoiding progestogen-induced symptoms (RCOG). Hysterectomy with ovarian conservation and endometrial ablation are not recommended for PMS."}
       ]},
       {b:"why", html:"<b>Why SSRIs work so quickly here.</b> In depression an SSRI takes weeks; in premenstrual disorders improvement is often seen within the first treated cycle, which is what makes luteal-only dosing possible. It also means a woman who has had no benefit after two or three well-taken cycles should have the plan reviewed rather than simply continue."}
     ]},

    {id:"hormonal", nav:"Hormonal options", title:"Hormonal options — suppress ovulation, protect the endometrium", sub:"The aim is to switch off the cycle that drives the symptoms, while avoiding progestogen side effects that mimic PMS.",
     blocks:[
       {b:"table", head:["Option","How it is used","Points to check"], rows:[
         ["<b>Combined oral contraceptive</b>","Drospirenone-containing preparations usually more effective (RCOG); continuous or extended use","UKMEC 2025 eligibility: VTE risk, migraine with aura (UKMEC 4), BMI, smoking over 35, blood pressure. Licensed in the UK for contraception, not PMS"],
         ["<b>Transdermal estradiol</b>","RCOG: a randomised study found <b>100-microgram patches twice weekly</b> as effective as 200 micrograms and better tolerated; estradiol gel is an alternative","Specialist-guided in many areas; off-label for PMS. Not a contraceptive — contraception is still needed"],
         ["<b>Progestogen protection with estradiol</b>","Women with a uterus need progestogen: <b>cyclical progestogen for 10–12 days</b> each cycle, or an LNG-IUS","RCOG: use the lowest progestogen dose possible; the LNG-IUS minimises systemic progestogen and PMS-like side effects"],
         ["<b>GnRH analogue</b>","Specialist initiation","Add-back HRT (continuous combined or tibolone) beyond 6 months; RCOG advises monitoring bone density when an analogue is used for more than 6 months"],
         ["<b>Hysterectomy with bilateral salpingo-oophorectomy</b>","Specialist, after a successful GnRH trial","Oestrogen-only HRT afterwards (no progestogen needed once the uterus is removed); irreversible — counsel on fertility and surgical menopause"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"⚠️ Progestogen intolerance", html:"Some women have PMS-like symptoms with any systemic progestogen. When estradiol is used, the RCOG approach is the lowest effective progestogen dose, or local delivery with an LNG-IUS. Consider this too when an existing contraceptive or HRT seems to be the trigger.", src:"RCOG Green-top Guideline No. 48 (2016)"},
         {tone:"blue", h:"ℹ️ Contraception and pregnancy plans", html:"Ask about pregnancy plans before choosing. SSRIs and transdermal estradiol are not contraceptives, and GnRH analogues do not reliably prevent pregnancy. The COC gives both symptom control and contraception if UKMEC allows.", src:"FSRH/CoSRH UKMEC 2025 · RCOG Green-top Guideline No. 48 (2016)"}
       ]}
     ]},

    {id:"ssri", nav:"SSRI practicalities", title:"Prescribing an SSRI for PMS or PMDD", sub:"The same safety rules as for depression apply, with a few PMS-specific points.",
     blocks:[
       {b:"cards", items:[
         {tone:"cream", h:"💊 Choice and dosing", html:"Choose an SSRI the patient can tolerate; start at a low dose and titrate — <b>dose per BNF</b> (use for PMS is off-label in the UK). Decide between luteal-phase dosing (from about day 15 to the start of bleeding) and continuous dosing according to cycle regularity and whether symptoms extend into the follicular phase.", src:"RCOG Green-top Guideline No. 48 (2016) · BNF"},
         {tone:"amber", h:"⚠️ Early review in young adults", html:"Aged 18 to 25, or at increased suicide risk: review 1 week after starting or increasing the dose (NICE NG222). Warn about initial agitation or anxiety and how to seek help.", src:"NICE NG222 (2022) · MHRA SSRIs and SNRIs use and safety"},
         {tone:"amber", h:"⚠️ Side effects that matter here", html:"Sexual dysfunction, nausea and sleep disturbance are common reasons for stopping. Continuous use should be tapered rather than stopped abruptly (RCOG). Check for interactions and bleeding risk with anticoagulants or NSAIDs in the BNF.", src:"RCOG Green-top Guideline No. 48 (2016) · BNF"},
         {tone:"blue", h:"🤰 Planning pregnancy", html:"Discuss plans before starting. If pregnancy is planned, review the need for continuing treatment and the choice of SSRI with the patient.", src:"BNF · NICE NG222 (2022)"}
       ]}
     ]},

    {id:"follow", nav:"Review", title:"Review and follow-up", sub:"The diary that made the diagnosis is also the tool that judges the treatment.",
     blocks:[
       {b:"timeline", items:[
         {n:"1", when:"Now", title:"Diagnosis and safety", html:"Explain, validate, assess risk and agree a safety plan if needed. Start the prospective diary. Lifestyle measures and a CBT referral can start straight away."},
         {n:"2", when:"After two cycles", title:"Confirm and choose", html:"Review the diary together. Confirmed premenstrual disorder → choose a first-line option. All-month symptoms → treat the underlying mood or anxiety disorder."},
         {n:"3", when:"1 week (if 18–25 or at risk)", title:"Early SSRI check", html:"NICE NG222 early review after starting or increasing an antidepressant."},
         {n:"4", when:"After two or three treated cycles", title:"Judge the response", html:"Compare the diary with the baseline. Partial response → adjust dose or regimen, or combine an SSRI with a COC. No response → second-line options or specialist advice."},
         {n:"5", when:"Ongoing", title:"Maintain and reassess", html:"Review at least yearly, and whenever life stage changes: pregnancy plans, postpartum, perimenopause."}
       ]},
       {b:"say", html:"The diary is going to do a lot of work for us. First it will tell us whether this is definitely linked to your cycle; then it will tell us whether the treatment is working. If the first thing we try doesn’t help enough, there are several more steps — you won’t be left with just putting up with it."}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — who, when, where", sub:"Most premenstrual disorders are diagnosed and treated in primary care.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same day — mental-health crisis", html:"Suicidal intent or plans, recent self-harm, or inability to keep safe → urgent mental-health or crisis-team assessment.", src:"NICE NG225 (2022)"},
         {tone:"amber", h:"Mental-health services", html:"Suspected bipolar disorder, a significant all-month mood disorder, or diagnostic uncertainty after the diary.", src:"NICE NG222 (2022)"},
         {tone:"amber", h:"Gynaecology or specialist premenstrual disorder service", html:"Severe PMS or PMDD not controlled by first-line and second-line options, when a GnRH analogue is being considered, or when surgery is being discussed.", src:"RCOG Green-top Guideline No. 48 (2016)"},
         {tone:"cream", h:"Manage in primary care", html:"Diary-confirmed PMS or PMDD responding to lifestyle, CBT, an SSRI or a combined pill; many can also start transdermal estradiol with progestogen protection with specialist advice.", src:"RCOG Green-top Guideline No. 48 (2016)"},
         {tone:"blue", h:"No NG12 criterion applies", html:"Premenstrual symptoms do not map to a suspected-cancer criterion. New intermenstrual or postcoital bleeding is a separate assessment.", src:"NICE NG12 (updated April 2026)"}
       ]},
       {b:"say", html:"What you’re describing — feeling like a different person in the fortnight before your period and yourself again afterwards — is a recognised condition with effective treatments. Let’s confirm the pattern with a diary, make sure you’re safe on the hardest days, and start treatment. If the first steps don’t help enough, we can involve a specialist."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card; the Casebook holds the full premenstrual disorder case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 23-year-old student says that for ten days before each period she is ‘a different person’: furious, tearful, unable to revise, and twice she has thought everyone would be better off without her. She is fine the week after. She has migraine with aura and asks for ‘the pill that helps PMS’ a friend mentioned."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Establishes the <b>luteal pattern and symptom-free week</b>; asks directly about the <b>suicidal thoughts</b> and agrees a <b>safety plan</b> without scoring risk; screens for <b>bipolar features</b>; starts a <b>two-cycle diary</b>; explains why a <b>combined pill is not safe with migraine with aura</b> (UKMEC 4); offers <b>CBT</b> and a low-dose <b>SSRI</b> (continuous or luteal) with a <b>1-week review</b> because she is under 25; safety-nets clearly."}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Every recommendation above traces to one of these primary sources.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>RCOG Green-top Guideline No. 48 — Management of Premenstrual Syndrome</b> (published December 2016; Green LJ, O’Brien PMS, Panay N, Craig M. BJOG 2017;124:e73–e105)<br><a href="https://www.rcog.org.uk/guidance/browse-all-guidance/green-top-guidelines/premenstrual-syndrome-management-green-top-guideline-no-48/" rel="noopener">rcog.org.uk</a><span class="rd"> — prospective daily symptom rating over two cycles (DRSP); exercise, CBT, vitamin B6, new-generation COC (cyclical or continuous) and low-dose SSRIs (continuous or luteal) as first-line options; drospirenone-containing pills usually more effective; taper continuous SSRIs; transdermal estradiol 100 micrograms twice weekly as effective as 200 micrograms; progestogen for 10–12 days or LNG-IUS, lowest progestogen dose; GnRH analogues with add-back HRT beyond 6 months and bone-density monitoring; surgery after a GnRH trial; hysterectomy with ovarian conservation and endometrial ablation not recommended; oestrogen-only HRT after hysterectomy with BSO</span></li>'+
         '<li><b>NICE NG225 — Self-harm: assessment, management and preventing recurrence</b> (September 2022)<br><a href="https://www.nice.org.uk/guidance/ng225" rel="noopener">nice.org.uk/guidance/ng225</a><span class="rd"> — do not use risk-assessment tools and scales to predict suicide or repeat self-harm; do not stratify into low, medium or high risk; needs-based assessment and safety planning</span></li>'+
         '<li><b>NICE NG222 — Depression in adults: treatment and management</b> (June 2022, updated)<br><a href="https://www.nice.org.uk/guidance/ng222" rel="noopener">nice.org.uk/guidance/ng222</a><span class="rd"> — review 1 week after starting or increasing an antidepressant in people aged 18 to 25 or at increased suicide risk</span></li>'+
         '<li><b>MHRA — Selective serotonin reuptake inhibitors (SSRIs) and serotonin and noradrenaline reuptake inhibitors (SNRIs): use and safety</b><br><a href="https://www.gov.uk/government/publications/ssris-and-snris-use-and-safety" rel="noopener">gov.uk</a><span class="rd"> — increased risk of suicidal behaviour with SSRIs and SNRIs in people up to 25 years</span></li>'+
         '<li><b>FSRH (now CoSRH) — UK Medical Eligibility Criteria for Contraceptive Use (UKMEC 2025)</b><br><a href="https://www.cosrh.org" rel="noopener">cosrh.org</a><span class="rd"> — combined hormonal contraception eligibility, including migraine with aura as UKMEC 4</span></li>'+
         '<li><b>NICE NG23 — Menopause: identification and management</b> (2015, updated 2024)<span class="rd"> — perimenopause as a differential</span></li>'+
         '<li><b>BNF</b> — SSRIs, combined hormonal contraceptives, estradiol, pyridoxine<br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — doses, interactions, pyridoxine neuropathy with high doses</span></li>'+
         '<li><b>International — American Psychiatric Association, DSM-5-TR</b> (2022)<span class="rd"> — PMDD criteria (five or more luteal symptoms including a core mood symptom, confirmed by prospective ratings over two cycles); used only because no UK diagnostic criteria exist</span></li>'+
         '<li><b>Hunter MS, et al. Fluoxetine versus CBT for premenstrual dysphoric disorder.</b> J Psychosom Obstet Gynaecol 2002;23:193–9<span class="rd"> — faster response with fluoxetine; better maintenance with CBT</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral</b> (updated April 2026)<span class="rd"> — no criterion applies</span></li>'+
         '</ul></div>'}
