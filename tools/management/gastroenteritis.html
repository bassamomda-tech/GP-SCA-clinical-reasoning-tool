<script>
MG.render({
  icon:"🦠",
  title:"Gastroenteritis — the complete guide",
  eyebrow:"Protocol · adults and children aged 5+ · UKHSA",
  stemTitle:"Most gastroenteritis is self-limiting, so the clinical work is assessing dehydration, spotting the surgical or metabolic mimic, and knowing when antibiotics and antimotility drugs are inappropriate or need specialist advice",
  stemSub:"<b>This guide is for adults and children aged 5 years and over in primary care.</b> For children under 5, use NICE CG84 and current paediatric guidance for dehydration assessment, ORS and admission thresholds — see the <a href='#children'>children</a> box. Infants, frail adults, pregnant patients, immunocompromised patients and people with significant comorbidity need a lower threshold for assessment. Dehydration drives urgency; fluids little and often, with continued feeding, are the mainstay. In suspected STEC (including E. coli O157), avoid antimotility drugs and do not start antibiotics without specialist or public-health advice. Send stool when the result will change management or public-health action, and follow UKHSA and local Health Protection Team guidance on exclusion and notification.",
  guideline:"UKHSA · NICE NG199 (C. difficile) · NICE CG84 (under-5s) · Greater Manchester formulary · BNF",
  reviewed:"25 September 2026",
  nextReview:"25 September 2027",
  meta:[
    {t:"Suspected STEC: no antimotility drugs; antibiotics only on advice", tone:"tw"},
    {t:"Exclusion: at least 48h after the last episode", tone:"tw"},
    {t:"v2.1 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#safety"><b>Severity</b><small>Dehydration · mimics</small></a><a href="#assess"><b>Assess</b><small>Organism clues</small></a><a href="#treat"><b>Treat</b><small>Fluids first</small></a><a href="#stool"><b>Stool</b><small>If it changes things</small></a><a href="#publichealth"><b>Public health</b><small>Exclude · notify</small></a><a href="#children"><b>Children</b><small>CG84</small></a></div>',
  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Assess dehydration and the ability to keep fluids down", html:"Consider same-day assessment or admission for shock or severe dehydration, persistent vomiting preventing oral rehydration, acute kidney injury or significant electrolyte disturbance, sepsis, suspected HUS, severe abdominal pain, peritonism or obstruction, DKA, or unsafe home circumstances. Frailty, older age, pregnancy and comorbidity lower the threshold. Individual signs — reduced urine output, tachycardia, skin turgor — prompt assessment rather than automatic admission."},
    {tone:"red", h:"⛔ Suspected STEC — including E. coli O157", html:"Particularly bloody diarrhoea with severe abdominal pain: <b>avoid antimotility drugs and do not start antibiotics without specialist or public-health advice</b> — discuss with microbiology, infectious diseases or the Health Protection Team. The potential effect of antibiotics on toxin release and HUS risk depends on the organism, timing and treatment, so management should be specialist-guided. Send stool or a rectal swab labelled as suspected STEC. Bloody diarrhoea is not synonymous with STEC — consider Campylobacter, Shigella, Salmonella, inflammatory bowel disease and ischaemic colitis — and assess for dehydration and sepsis."},
    {tone:"red", h:"⚠ Possible HUS features → urgent hospital assessment", html:"In suspected or confirmed STEC, urgent assessment is required for reduced urine output, pallor, marked lethargy, bruising or bleeding, oedema, worsening abdominal pain, vomiting, confusion or other deterioration — possible HUS features, not a diagnostic checklist. Check FBC/platelets, renal function and haemolysis markers according to the local pathway; discuss suspected HUS urgently with paediatric/renal services and notify the Health Protection Team on clinical suspicion, regardless of microbiology results. Up to 15% of paediatric STEC cases may progress to HUS (UKHSA). An adult with bloody diarrhoea and normal urine output still needs explicit follow-up."},
    {tone:"green", h:"Fluids and feeding are the treatment", html:"Fluids little and often. Ordinary fluids for mild symptoms without dehydration; oral rehydration solution where diarrhoea or vomiting is substantial, dehydration risk is increased, or with frailty, older age, pregnancy or comorbidity; supervised oral or IV rehydration if oral intake fails. Diluted squash is not a substitute for ORS in significant dehydration. Continue breastfeeding, normal formula feeds and a normal diet as tolerated — no starvation or clear-fluid-only diets."},
    {tone:"amber", h:"Antibiotics are not routine", html:"Do not routinely prescribe antibiotics for acute gastroenteritis. If the patient is septic, has extraintestinal infection, is severely immunocompromised, has suspected cholera/enteric fever, or has a confirmed organism for which treatment is indicated, discuss with microbiology, infectious diseases or the Health Protection Team and follow local (Greater Manchester) antimicrobial guidance."},
    {tone:"amber", h:"📋 Notification and exclusion", html:"Notify the local Health Protection Team/proper officer promptly when a notifiable infection, suspected food poisoning, outbreak or cluster, or other public-health risk is suspected; laboratory notification and local HPT instructions may determine further testing, contact tracing and clearance. Exclude from work, school, nursery and social-care settings until <b>at least 48 hours</b> after the last episode of diarrhoea or vomiting; longer exclusion or microbiological clearance may be required for particular organisms and occupations — follow current UKHSA and HPT advice."}
  ],
  pathwaySub:"Five steps; the first is a severity decision.",
  pathway:[
    {title:"Assess severity and exclude the mimic", html:"Observations and mental state, hydration and ability to retain fluids, urine output, sepsis, pregnancy, frailty and comorbidity, home support; surgical and metabolic mimics including DKA.", alert:true},
    {title:"History, exposures and organism clues", html:"Blood, fever, travel, recent antibiotics, healthcare exposure, suspect food, contacts, occupation."},
    {title:"Fluids first; prescribe sparingly", html:"Rehydration and feeding; selected symptom relief in adults; no routine antibiotics — only on microbiology, infectious diseases or HPT advice when indicated."},
    {title:"Send stool when it changes management", html:"Blood, systemic illness, outbreak, immunocompromise, C. difficile risk, persistence, relevant travel, high-risk occupations."},
    {title:"Public health", html:"Exclusion, Health Protection Team notification, hygiene, organism-specific swimming advice."}
  ],
  sections:[

    {id:"safety", nav:"Severity", title:"Step 1 — severity and the mimics",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Same-day assessment or admission", html:"Shock or severe dehydration · persistent vomiting preventing oral rehydration · acute kidney injury or significant electrolyte disturbance · sepsis · suspected HUS · severe or localised abdominal pain, peritonism or obstruction · DKA · severe or rapidly worsening C. difficile infection · unsafe home circumstances. Persistent vomiting needs same-day assessment if the patient cannot maintain fluids or has concerning features — not every episode automatically requires admission; IV fluids may be needed depending on dehydration, renal function and response to supervised oral rehydration."},
         {tone:"amber", h:"🟠 Assess, don't reflexively admit", html:"Assess pulse, blood pressure, respiratory rate, temperature and mental state; mucous membranes, capillary refill and peripheral perfusion; urine output; ability to drink and retain fluids; postural symptoms where relevant; capillary glucose where relevant; renal function and electrolytes if dehydration is more than mild, vomiting is persistent, or the patient is older, frail or comorbid; and social circumstances and ability to manage oral rehydration at home, including frailty and pregnancy. Mildly reduced urine output can often be managed with supervised oral rehydration if the patient can drink. Tachycardia may reflect fever, pain or anxiety; skin turgor and sunken eyes are less reliable in older adults."},
         {tone:"red", h:"🔴 Acute abdomen and metabolic mimics — same-day emergency assessment", html:"Bilious vomiting · marked abdominal distension · severe localised pain · guarding or rebound tenderness · pain out of proportion · suspected obstruction · GI bleeding with haemodynamic compromise · testicular torsion or ectopic pregnancy where relevant. Also consider appendicitis, pancreatitis, mesenteric ischaemia, adrenal crisis and sepsis from another source. <b>Do not attribute severe localised abdominal pain to gastroenteritis merely because diarrhoea is present.</b> <b>In a person with diabetes, check capillary glucose and blood ketones where indicated and follow the local sick-day/DKA pathway</b> — do not wait for the diarrhoea to settle."}
       ]}
     ]},

    {id:"assess", nav:"Assess", title:"Step 2 — history and organism clues",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>History</b>","Onset, frequency, blood or mucus, vomiting, fever, abdominal pain; sick contacts, recent travel, suspect food, recent antibiotics or healthcare exposure, PPI use, occupation (food handler, healthcare or care worker); pregnancy, frailty, age, comorbidity and diabetes"],
         ["<b>Bloody diarrhoea</b>","Consider STEC, Campylobacter, Shigella, Salmonella, C. difficile, inflammatory bowel disease and ischaemic colitis"],
         ["<b>Profuse watery diarrhoea</b>","Viral infection, toxin-mediated illness, or travel-related infection"],
         ["<b>Recent antibiotics or hospital exposure</b>","Consider C. difficile"],
         ["<b>Travel</b>","Bacterial, viral or parasitic causes, according to destination and duration"],
         ["<b>Severe localised pain or peritonism</b>","Reconsider gastroenteritis — assess for a surgical cause"]
       ]}
     ]},

    {id:"treat", nav:"Treat", title:"Step 3 — fluids first; prescribe sparingly",
     blocks:[
       {b:"table", head:["Step","When","Treatment"], rows:[
         ["<b>Rehydration and feeding</b>","Everyone","Fluids little and often. Ordinary fluids for mild symptoms with no dehydration; oral rehydration solution where diarrhoea or vomiting is substantial, dehydration risk is increased, or with frailty, older age, pregnancy or comorbidity; supervised oral or IV rehydration if oral intake fails. Diluted squash is not a substitute for ORS in significant dehydration; in children use age-appropriate ORS and local paediatric guidance. Continue breastfeeding, normal formula feeds and a normal diet as tolerated — do not starve or restrict to clear fluids"],
         ["<b>Loperamide</b> — adults only","Short term, for uncomplicated, non-bloody, afebrile watery diarrhoea","Not routinely necessary and generally self-care in Greater Manchester. Check the dose against the current product SPC. <b>Avoid</b> with blood in the stool, high fever, suspected STEC, C. difficile or dysentery, inflammatory colitis or a UC flare, abdominal distension or ileus, suspected toxic megacolon — and in children unless specifically supported by a paediatric specialist or the product indication. Check for opioid misuse or excessive dosing: high-dose misuse can cause serious cardiac arrhythmias"],
         ["<b>Antiemetic</b> — selected adults","Distressing vomiting, no red flags","Consider an antiemetic only in selected adults after assessment for dehydration, abdominal pathology and other causes of vomiting; evidence in uncomplicated gastroenteritis is limited. Cyclizine (anticholinergic effects) or prochlorperazine (extrapyramidal effects), per the current product SPC: both can cause sedation that impairs assessment and increases falls risk, and may contribute to QT prolongation — particular caution in older or frail adults, pregnancy and cardiac disease. Do not let symptomatic treatment delay referral; persistent or atypical vomiting is an indication for assessment, not repeated antiemetic prescribing. In children, do not extrapolate adult advice — use local paediatric guidance"],
         ["<b>Antibiotics</b>","Not routine","Do not routinely prescribe for acute gastroenteritis. If the patient is septic, has extraintestinal infection, is severely immunocompromised, has suspected cholera or enteric fever, or has a confirmed organism for which treatment is indicated, discuss with microbiology, infectious diseases or the Health Protection Team and follow local (Greater Manchester) antimicrobial guidance — the choice depends on organism, resistance, travel, severity, age, pregnancy and immune status"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"C. difficile", html:"Test only if there is compatible diarrhoea: send diarrhoeal stool (not formed stool unless there is a specific specialist reason), and do not repeat the test as a test of cure. A positive result without compatible diarrhoea may reflect colonisation rather than active infection. Review recent antibiotics, hospital or healthcare exposure and PPI use. Stop or change non-essential precipitating antibiotics where possible; review the PPI indication and other medicines, but do not stop clinically necessary laxatives automatically. Assess severity. <b>No loperamide.</b> Treat confirmed or strongly suspected infection per NICE NG199 and local microbiology guidance; seek urgent specialist advice if severe or rapidly worsening."},
         {tone:"blue", h:"Self-care prescribing", html:"Uncomplicated diarrhoea is generally a self-care condition under the Greater Manchester OTC policy; loperamide remains on the formulary for appropriate use."}
       ]}
     ]},

    {id:"stool", nav:"Stool", title:"Step 4 — send stool when it changes management",
     blocks:[
       {b:"table", head:["Send stool if","Test"], rows:[
         ["<b>Blood, mucus or pus; systemic illness or high fever</b>","Culture, with microbiology advice"],
         ["<b>Suspected STEC, or bloody diarrhoea in a young child</b>","Stool or rectal swab labelled as suspected STEC"],
         ["<b>Suspected food poisoning, outbreak or cluster</b>","Culture; Health Protection Team guides further testing"],
         ["<b>Recent antibiotics, healthcare exposure, or suspected C. difficile</b>","C. difficile testing"],
         ["<b>Immunocompromised</b>","Culture, with a low threshold for wider testing on microbiology advice"],
         ["<b>Not improved after approximately 7 days, persisting beyond 10–14 days, recurrent, or the result will alter treatment, referral, public-health action or occupational clearance</b>","Culture; parasite testing guided by travel, exposure and clinical context"],
         ["<b>Recent travel to a relevant destination</b>","Culture; ova, cysts and parasites only if the destination, duration, persistence, exposure or immunocompromise make Giardia, Entamoeba or another parasite plausible — not broad parasite testing for every traveller"],
         ["<b>Food handler, healthcare or care worker</b>","Per the Health Protection Team — testing and clearance requirements depend on the setting and organism"]
       ]}
     ]},

    {id:"publichealth", nav:"Public health", title:"Step 5 — exclusion, notification and advice",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"🚫 Exclusion", html:"Stay away from work, school, nursery or social-care settings until <b>at least 48 hours</b> after the last episode of diarrhoea or vomiting. Food handlers, healthcare and care staff, young children and specified infections may need longer exclusion or microbiological clearance — check current UKHSA and local Health Protection Team guidance. Do not prepare food for others while symptomatic and during the exclusion period. Exclusion from swimming is separate from exclusion from work or school."},
         {tone:"amber", h:"📋 Notification", html:"Notify the local Health Protection Team/proper officer promptly when a notifiable infection, suspected food poisoning, outbreak or cluster, or other public-health risk is suspected, using the current UKHSA notification list and local arrangements. Laboratory notification and local HPT instructions may determine further testing, contact tracing and clearance requirements. Suspected HUS is notified on clinical suspicion, regardless of microbiology results. Not every case of presumed viral gastroenteritis is individually notifiable."},
         {tone:"green", h:"🧼 Hygiene", html:"Handwashing with soap and water; don't prepare food for others while symptomatic and during the exclusion period; don't share towels; clean toilets and surfaces."},
         {tone:"blue", h:"🏊 Swimming", html:"Swimming exclusion is organism-specific and separate from work or school exclusion. Avoid swimming until at least 48 hours after symptoms stop; for Cryptosporidium, UKHSA advice commonly requires avoiding swimming for 2 weeks after the diarrhoea has stopped. Check current UKHSA guidance for other organisms."}
       ]}
     ]},

    {id:"children", nav:"Children", title:"Children — use NICE CG84 for under-5s",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"Assessment", html:"Use <a href='https://www.nice.org.uk/guidance/cg84' rel='noopener'>NICE CG84</a> for under-5s — dehydration assessment, traffic-light features, ORS, feeding, admission thresholds, antibiotic indications and exclusion from childcare — and the local paediatric referral pathway. Consider hypoglycaemia, electrolyte disturbance and sepsis where clinically indicated. Lower the threshold for assessment in infants, under-5s, children with comorbidity or poor social support."},
         {tone:"green", h:"Treatment", html:"Continue breastfeeding and formula feeds; use age-appropriate oral rehydration solution. <b>No loperamide in children.</b> Antiemetics only per paediatric guidance."},
         {tone:"red", h:"Bloody diarrhoea in young children", html:"Needs prompt assessment; send stool for STEC testing, and discuss urgently if there are HUS features."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer and safety-net",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Hospital", html:"Shock or severe dehydration, inability to maintain oral fluids after assessment, AKI or significant electrolyte disturbance, sepsis, suspected HUS, severe or localised abdominal pain, peritonism or obstruction, DKA, severe or rapidly worsening C. difficile infection, or unsafe home circumstances."},
         {tone:"blue", h:"Health Protection Team", html:"<b>Suspected food poisoning, outbreaks or clusters, notifiable infections, suspected HUS (on clinical suspicion), or high-risk occupations needing exclusion or clearance advice.</b>"},
         {tone:"amber", h:"Investigate further", html:"Diarrhoea lasting more than 10–14 days, or chronic and relapsing → reconsider IBD, coeliac disease and malabsorption. See <a href='../algorithms/chronic-diarrhoea.html'>chronic diarrhoea pathway</a>."},
         {tone:"cream", h:"GP management", html:"Severity assessment, rehydration, selective symptom relief, stool testing decisions, the public-health duties and the safety-net belong here. Related pages: <a href='ibs.html'>IBS</a> · <a href='coeliac-disease.html'>coeliac disease</a> · <a href='crohns-disease.html'>Crohn's disease</a> · <a href='ulcerative-colitis.html'>ulcerative colitis</a> · <a href='dka.html'>DKA</a>."}
       ]},
       {b:"say", html:"This looks like a tummy bug, which usually clears in a few days. The most important thing is fluids, little and often, and eating normally when you can. Antibiotics don't usually help, and anti-diarrhoea tablets can be harmful with some bugs, so I'm not giving them. Please stay off work or school until at least 48 hours after the last episode. Come back urgently if you can't keep fluids down, pass much less urine, feel very drowsy or faint, notice bruising or blood in your stool, or the pain gets much worse."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 24-year-old <b>chef</b> attends with 2 days of profuse diarrhoea, now with <b>visible blood</b>, cramping abdominal pain and a temperature of 38.2°C. He ate at a barbecue 3 days ago and <b>two friends are also unwell</b>. He is passing urine normally and tolerating fluids. He asks for \"something to stop it\" and an antibiotic, and needs to be back at work tomorrow."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Declines loperamide and explains why — bloody diarrhoea with fever raises possible STEC, where antimotility drugs increase HUS risk; does not start an antibiotic without microbiology or public-health advice, pending stool culture, and remembers that Campylobacter, Shigella and Salmonella also cause bloody diarrhoea; sends stool because of blood, systemic upset and a possible cluster; recognises he is a food handler, so the Health Protection Team guides his exclusion and clearance, and notifies suspected food poisoning; assesses hydration properly; warns about HUS features; addresses the work pressure honestly; safety-nets."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>UKHSA — Notifiable diseases and causative organisms; managing gastrointestinal infections and exclusion</b><br><a href="https://www.gov.uk/guidance/notifiable-diseases-and-causative-organisms-how-to-report" rel="noopener">gov.uk — notifiable diseases</a><span class="rd"> — notification via the Health Protection Team/proper officer</span></li>'+
         '<li><b>UKHSA — Health protection in children and young people settings, including education</b><br><a href="https://www.gov.uk/government/publications/health-protection-in-schools-and-other-childcare-facilities" rel="noopener">gov.uk — exclusion guidance</a><span class="rd"> — 48-hour exclusion, organism- and setting-specific exclusion, Cryptosporidium swimming advice</span></li>'+
         '<li><b>UKHSA — Shiga toxin-producing Escherichia coli (STEC): public health management</b><br><a href="https://www.gov.uk/government/publications/shiga-toxin-producing-escherichia-coli-public-health-management" rel="noopener">gov.uk — STEC guidance</a><span class="rd"> — avoid antimotility agents; antibiotics only on specialist advice; stool or rectal swab labelled suspected STEC; HUS recognition, urgent specialist discussion and notification on clinical suspicion; up to 15% of paediatric cases progress to HUS</span></li>'+
         '<li><b>NICE NG199 — Clostridioides difficile infection: antimicrobial prescribing</b><br><a href="https://www.nice.org.uk/guidance/ng199" rel="noopener">nice.org.uk/guidance/ng199</a><span class="rd"> — core reference for precipitants, severity and treatment; testing per local microbiology guidance</span></li>'+
         '<li><b>NICE CG84 — Diarrhoea and vomiting caused by gastroenteritis in under 5s</b><br><a href="https://www.nice.org.uk/guidance/cg84" rel="noopener">nice.org.uk/guidance/cg84</a><span class="rd"> — dehydration assessment, traffic-light features, ORS, feeding, admission thresholds, antibiotic indications and exclusion from childcare in under-5s</span></li>'+
         '<li><b>Greater Manchester Medicines Management Group — formulary (gastro-intestinal system), OTC policy and antimicrobial guidelines</b><br><a href="https://gmmmg.nhs.uk" rel="noopener">gmmmg.nhs.uk</a><span class="rd"> — self-care position; loperamide; local antimicrobial prescribing</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — antiemetic and loperamide cautions and contraindications</span></li>'+
         '<li><b>Product SPCs — loperamide, cyclizine and prochlorperazine</b> (electronic medicines compendium)<br><a href="https://www.medicines.org.uk/emc" rel="noopener">medicines.org.uk/emc</a><span class="rd"> — product-specific doses, cautions and contraindications</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Acute gastroenteritis in adults and children aged 5 and over; NICE CG84 for under-5s. Assess dehydration and the ability to maintain fluids; admit for shock, severe dehydration, persistent vomiting despite assessment, renal or electrolyte derangement, sepsis, suspected HUS or unsafe home circumstances. Exclude surgical and metabolic mimics, including DKA. Fluids and feeding are the mainstay; no routine antibiotics — discuss with microbiology, infectious diseases or the Health Protection Team when treatment may be indicated. Suspected STEC: no antimotility drugs, antibiotics only on specialist advice. C. difficile per NICE NG199. Send stool when it changes management. At least 48 hours' exclusion; notify the local Health Protection Team when indicated. Sources: UKHSA, NICE NG199, NICE CG84, Greater Manchester formulary, BNF. Verify doses against the current BNF and local microbiology guidance."
});
</script>
