  foot:"Acute gastroenteritis in primary care \u2014 NICE CG84 (under-5s, 2009) and UKHSA guidance. Dehydration is the main cause of harm and drives admission; oral rehydration little and often, with continued feeding, is the mainstay. Antibiotics are usually not indicated. In suspected E. coli O157, avoid BOTH antibiotics and antimotility drugs — they increase the risk of haemolytic uraemic syndrome — and avoid loperamide in bloody diarrhoea, C. difficile and all children. Send stool only when it changes management. Exclusion is 48 hours after the last episode, stricter for food handlers and care staff, and suspected food poisoning is notifiable to UKHSA. Verify all doses against the current BNF and local microbiology guidance."
