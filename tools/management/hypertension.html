  quickSub:"If you read nothing else, read these five cards. Every number traces to the recommendation cited in the Evidence panel.",
  quick:[
    {tone:"red", h:"⚠ Same-day referral", html:"Clinic systolic <b>≥180</b> or diastolic <b>≥120 mmHg</b> <em>plus</em> retinal haemorrhage or papilloedema, new confusion, chest pain, signs of heart failure or AKI → same-day specialist assessment. <b>Untreated, one-year mortality in malignant hypertension was historically &gt;90%</b> — do not start chronic-pathway thinking in someone who needs same-day specialist input. Suspected phaeochromocytoma or pregnancy ≥20 weeks with BP ≥140/90 → same-day too. <span class=\"src\">1.5.2–1.5.3</span>"},
    {tone:"amber", h:"Confirm first", html:"Never diagnose on one clinic reading. Clinic 140/90–179/119 → <b>ABPM</b> (HBPM if ABPM unsuitable). Diagnosis = clinic <b>≥140/90</b> <em>and</em> daytime average <b>≥135/85</b>. <span class=\"src\">1.2.3, 1.2.8</span>"},
    {tone:"blue", h:"Who to treat", html:"<b>Stage 2 (≥160/100):</b> offer drugs, any age. <b>Stage 1, under 80:</b> discuss drugs if target-organ damage, CVD, renal disease, diabetes or QRISK <b>≥10%</b>. Aged 80+ with stage 1: consider if clinic BP &gt;150/90. Where QRISK3 is &lt;10%, still discuss treatment \u2014 particularly <b>under 60</b> (age &lt;60), where a 10-year score understates lifetime risk. <span class=\"src\">1.4.9–1.4.13</span>"},
    {tone:"plain", h:"First drug", html:"Aged <b>&lt;55</b> or <b>type 2 diabetes</b> → <b>ACE inhibitor (or ARB)</b>. Aged <b>≥55 without T2DM</b>, or <b>Black African / African–Caribbean family origin</b> at any age without T2DM → <b>CCB</b>. Then A+C, then A+C+D. <span class=\"src\">1.4.32–1.4.45</span>"},
    {tone:"green", h:"Target", html:"Clinic <b>&lt;140/90</b> under 80; <b>&lt;150/90</b> aged 80+. Home/ambulatory equivalents <b>&lt;135/85</b> and <b>&lt;145/85</b>. CKD with ACR ≥70 mg/mmol → <b>&lt;130/80</b>. <span class=\"src\">1.4.15–1.4.22 · NG203 1.6.2</span>"}
  ],
  pathwaySub:"From the cuff to the prescription in five moves. The red step is where patients come to harm — do not skip it.",
  pathway:[
    {title:"Measure properly", html:"Both arms once; if &gt;15 mmHg difference, repeat — if it persists use the <b>higher arm</b> thereafter. Clinic ≥140/90 → second reading; if very different, a third — <b>record the lower of the last two</b>. Clinic &lt;140/90 → recheck at least every 5 years."},
    {title:"Confirm", html:"Clinic <b>140/90–179/119</b> → ABPM (≥2 readings/hour in waking hours, average ≥14). ABPM unsuitable or declined → HBPM (twice daily, 2 readings each, 4–7 days, discard day 1)."},
    {title:"Stage", html:"Clinic 140/90–159/99 with daytime ≥135/85 = <b>stage 1</b>. Clinic ≥160/100 (daytime ≥150/95) = <b>stage 2</b>. Clinic ≥180 systolic or ≥120 diastolic = <b>severe</b>."},
    {title:"Screen for danger", html:"Severe BP with papilloedema/retinal haemorrhage, new confusion, chest pain, heart failure or AKI → <b>same-day specialist</b>. No red flags but target-organ damage → treat at once without waiting for ABPM and review within 7 days.", alert:true},
    {title:"Treat to target", html:"Work-up (ACR + dipstick, bloods, ECG, fundi, QRISK) → decide drugs → climb A→C→D → set <b>this</b> patient's target → 4-weekly titration → annual review."}
  ],
  sections:[
    {id:"diagnose", nav:"Diagnosis", title:"Confirming the diagnosis",
     sub:"A hypertension label is for life and starts a prescribing cascade — earn it with out-of-office confirmation. NICE is unambiguous: <b>clinic ≥140/90 AND ABPM daytime average ≥135/85 mmHg (clinic threshold ≥140/90 mmHg) mmHg</b>. The single exception is severe BP with target-organ damage, where you treat immediately.",
     blocks:[{b:"html", html:"<div class='card blue'><h3>Before you trust the numbers — device and technique</h3><p>A validated, maintained upper-arm monitor with the <b>correct cuff size</b>, in a quiet room. Poor technique makes a diagnosis that lasts a lifetime.</p><ul><li>No caffeine, smoking or exercise for 30 minutes; empty the bladder; sit quietly for 5 minutes</li><li>Back supported, feet flat and uncrossed, arm supported at heart level</li><li><b>Irregular pulse?</b> Automated devices may be unreliable in AF — palpate the pulse and measure manually, with an ECG where appropriate</li></ul></div>"}, {b:"html", html:"<div class=\"two\">\n    <div class=\"card teal\"><h3>Clinic measurement</h3><ul>\n      <li><b>Both arms</b> when considering the diagnosis; difference &gt;15 mmHg → repeat, and if it persists use the higher-reading arm from then on <span class=\"src\">1.2.1</span></li>\n      <li>If the first reading is ≥140/90, take a <b>second</b>; if substantially different, a <b>third</b> — record the <b>lower</b> of the last two <span class=\"src\">1.2.2</span></li>\n      <li>Postural symptoms, type 2 diabetes or aged 80+ → measure <b>lying and standing</b>; a drop of ≥20 systolic or ≥10 diastolic is significant <span class=\"src\">1.2.9–1.2.12</span></li>\n      <li>Normal (&lt;140/90) → recheck at least <b>every 5 years</b>, sooner if BP is close to 140/90</li>\n    </ul></div>\n    <div class=\"card teal\"><h3>Out-of-office confirmation</h3><ul>\n      <li><b>ABPM</b> for clinic BP 140/90–179/119: ≥2 readings per hour during waking hours, diagnose on the average of ≥14 measurements <span class=\"src\">1.2.3, 1.2.6</span></li>\n      <li><b>HBPM</b> if ABPM is unsuitable or declined: two consecutive seated readings 1 min apart, twice daily, ≥4 days (ideally 7) — <b>discard day 1</b> and average the rest <span class=\"src\">1.2.7</span></li>\n      <li>White-coat effect ≈25% of clinic hypertension — confirmation prevents a lifetime of unnecessary tablets</li>\n      <li>Start the work-up <b>while</b> awaiting confirmation <span class=\"src\">1.2.5</span></li>\n    </ul></div>\n  </div>\n  <div class=\"card\"><h3>Staging — once confirmed</h3>\n    <table>\n      <thead><tr><th>Stage</th><th>Clinic BP</th><th>ABPM daytime / HBPM average</th><th>Consequence</th></tr></thead>\n      <tbody>\n        <tr><td><b>Stage 1</b></td><td>140/90–159/99</td><td>≥135/85</td><td>Treat under 80 if TOD, CVD, renal disease, diabetes or QRISK ≥10%</td></tr>\n        <tr><td><b>Stage 2</b></td><td>≥160/100 but &lt;180/120</td><td>≥150/95</td><td>Offer drug treatment at any age</td></tr>\n        <tr><td><b>Severe (stage 3)</b></td><td>≥180 systolic or ≥120 diastolic</td><td>Not used — act on the clinic BP</td><td>Severe-BP branch below: same-day features, or treat now + review ≤7 days</td></tr>\n      </tbody>\n    </table>\n  </div>"}]},
    {id:"exam", nav:"Examination", title:"Targeted examination",
     sub:"Not screening — six findings that change the plan: a secondary-cause trigger, target-organ damage, or orthostasis (which changes the drug and the target).",
     blocks:[{b:"html", html:"<div class=\"grid\">\n    <div class=\"card\"><h3>BP both arms</h3><p>Difference &gt;15 mmHg suggests peripheral vascular disease or coarctation. Use the higher arm thereafter. A difference plus tearing chest/interscapular pain → dissection, 999.</p></div>\n    <div class=\"card\"><h3>Lying → standing BP</h3><p>If 80+, frail, type 2 diabetes or postural symptoms. Drop ≥20 systolic or ≥10 mmHg diastolic → treat to the <b>standing</b> BP and go gently.</p></div>\n    <div class=\"card\"><h3>Fundi</h3><p>Hypertensive retinopathy; <b>papilloedema or retinal haemorrhage = same-day</b> (accelerated hypertension).</p></div>\n    <div class=\"card\"><h3>Cardiac</h3><p>Displaced apex, S4, murmurs — LVH or aortic disease. Radio-femoral delay in a young patient → coarctation.</p></div>\n    <div class=\"card\"><h3>Renal bruits</h3><p>Especially if young, resistant, or eGFR falls after starting an ACEi/ARB → renal artery stenosis.</p></div>\n    <div class=\"card\"><h3>BMI + waist</h3><p>Quantifies the modifiable target and flags OSA and Cushingoid features (central obesity, striae, proximal weakness).</p></div>\n  </div>"}]},
    {id:"severe", nav:"Severe BP", title:"Severe hypertension — systolic ≥180 or diastolic ≥120 mmHg",
     sub:"The branch where delay causes harm. Two questions: are there same-day features, and is there target-organ damage?",
     blocks:[{b:"html", html:"<div class=\"two\">\n    <div class=\"card red\"><h3>Refer same day if…</h3><p>Severe BP <b>with any of</b> <span class=\"src\">1.5.2–1.5.3</span>:</p><ul>\n      <li>Retinal haemorrhage or <b>papilloedema</b> (accelerated hypertension)</li>\n      <li>New confusion or focal neurology</li>\n      <li>Chest pain, or signs of heart failure</li>\n      <li>Acute kidney injury (rising creatinine, oliguria)</li>\n      <li><b>Suspected phaeochromocytoma</b> — labile or postural BP, headache, palpitations, pallor, sweating, abdominal pain</li>\n      <li><b>Pregnancy ≥20 weeks with BP ≥140/90</b> → same-day obstetric assessment (?pre-eclampsia) <span class=\"src\">NG133</span></li>\n      <li>Tearing chest or interscapular pain with arm-to-arm BP difference (possible aortic dissection) — <b>999</b></li>\n    </ul></div>\n    <div class=\"card amber\"><h3>No red flags — same-week pathway</h3><ul>\n      <li>Assess for <b>target-organ damage as soon as possible</b> <span class=\"src\">1.5.1</span></li>\n      <li><b>Damage present</b> → start drug treatment immediately, without waiting for ABPM/HBPM</li>\n      <li><b>No damage</b> → repeat clinic measurement <b>within 7 days</b></li>\n      <li>Not a 999 call and not a routine recall — this is the \"urgent bloods, ACR, ECG, review this week\" lane</li>\n    </ul></div>\n  </div>"}]},
    {id:"workup", nav:"Work-up", title:"Work-up — every newly diagnosed patient",
     sub:"Start while awaiting ABPM: target-organ damage and QRISK decide whether stage 1 gets treated <span class=\"src\">1.2.5</span>.",
     blocks:[{b:"html", html:"<div class=\"grid\">\n    <div class=\"card teal\"><h3>Urine</h3><p>Albumin:creatinine ratio + reagent-strip <b>haematuria</b>. ACR does double duty — it drives the CKD target and flags renal disease as a treatment indication <span class=\"src\">1.3.1–1.3.2</span>.</p></div>\n    <div class=\"card teal\"><h3>Bloods</h3><p>HbA1c, electrolytes (K⁺ matters for step 4 and for Conn's), creatinine, eGFR, total and HDL cholesterol <span class=\"src\">1.3.3</span>.</p></div>\n    <div class=\"card teal\"><h3>Eyes &amp; heart</h3><p>Examine fundi; arrange a <b>12-lead ECG</b> — LVH, prior MI or AF all count as target-organ damage <span class=\"src\">1.3.3</span>.</p></div>\n    <div class=\"card amber\"><h3>Risk score</h3><p>Formal CVD risk (QRISK3) <b>after</b> the TOD investigations, using clinic BP. QRISK ≥10% is itself a reason to treat stage 1 under 80 <span class=\"src\">1.2.5, 1.4.10</span>.</p></div>\n    <div class=\"card cream\"><h3>Consider, selectively</h3><ul>\n      <li><b>Aldosterone:renin ratio</b> if age &lt;40, hypokalaemia, or resistant hypertension</li>\n      <li><b>TFTs</b> if thyroid symptoms; <b>renal ultrasound</b> if U&amp;Es or urinalysis are abnormal</li>\n      <li>Echo if murmur, LVH on ECG or suspected coarctation</li>\n    </ul></div>\n    <div class=\"card purple\"><h3>Haematuria found on dipstick <span class=\"tw\">2WW</span></h3><p>Do not file it under \"hypertension work-up\". <b>NICE NG12:</b> aged <b>≥45</b> with unexplained <b>visible</b> haematuria (or visible haematuria recurring after a treated UTI) → <b>urgent suspected cancer referral for bladder/renal cancer (48 hours, seen within 2 weeks)</b>. Aged <b>≥60</b> with unexplained <b>non-visible</b> haematuria plus dysuria <em>or</em> a raised white-cell count → USC referral. Aged ≥60 with recurrent/persistent unexplained UTI → <b>consider</b> USC referral.</p></div>\n  </div>"}]},
    {id:"treat", nav:"Who to treat", title:"Who gets drug treatment?",
     sub:"Stage 2 is easy. Stage 1 is a shared decision driven by absolute risk — a discussion, not an announcement <span class=\"src\">1.4.11</span>.",
     blocks:[{b:"html", html:"<div class=\"card\"><table>\n    <thead><tr><th>Person</th><th>Action</th><th>Source</th></tr></thead>\n    <tbody>\n      <tr><td>Stage 2, any age</td><td><b>Offer</b> drug treatment (account for frailty and multimorbidity)</td><td><span class=\"src\">1.4.12–1.4.13</span></td></tr>\n      <tr><td>Stage 1, under 80, with TOD / established CVD / renal disease / diabetes / QRISK ≥10%</td><td><b>Offer</b> drug treatment</td><td><span class=\"src\">1.4.9–1.4.10</span></td></tr>\n      <tr><td>Stage 1, under 60, QRISK &lt;10%</td><td><b>Consider</b> — QRISK under-estimates lifetime risk at younger ages; lifestyle-only trial for 3 months is legitimate, then repeat BP + QRISK</td><td><span class=\"src\">1.4.11</span></td></tr>\n      <tr><td>Aged 80+ with stage 1</td><td><b>Consider</b> if clinic BP &gt;150/90</td><td><span class=\"src\">1.4.13</span></td></tr>\n      <tr><td>Under 40 with confirmed hypertension</td><td><b>Consider specialist referral</b> for secondary causes and detailed benefit–risk assessment</td><td><span class=\"src\">1.4.14</span></td></tr>\n    </tbody>\n    <caption>Every \"offer\" bends to clinical judgement in frailty, multimorbidity or limited life expectancy.</caption>\n  </table></div>"}]},
    {id:"lifestyle", nav:"Lifestyle", title:"Lifestyle — a treatment, not a preamble",
     sub:"Offer to every patient at every stage, before, alongside and after drugs <span class=\"src\">1.4.1–1.4.8</span>. Each measure has a mechanism, a measurable target and a quantified effect. Agree <b>one</b> specific change today rather than reciting seven.",
     blocks:[{b:"html", html:"<div class=\"card\"><table>\n    <thead><tr><th>Measure</th><th>Target</th><th>Typical BP effect</th><th>Practical note</th></tr></thead>\n    <tbody>\n      <tr><td>🧂 Salt</td><td>&lt;6 g/day</td><td>↓4–5 mmHg systolic</td><td>Mostly processed food. Potassium-chloride salt substitutes are <b>unsuitable</b> in older people, diabetes, CKD, heart failure or on ACEi/ARB/spironolactone <span class=\"src\">1.4.6</span></td></tr>\n      <tr><td>🥗 DASH- or Mediterranean-style diet</td><td>5+ portions veg/fruit daily</td><td>↓8–14 mmHg systolic</td><td>Vegetables, fruit, wholegrains, low-fat dairy; less red meat and sugar</td></tr>\n      <tr><td>🏃 Activity</td><td>150 min/week moderate</td><td>↓4–9 mmHg systolic</td><td>Start where the patient is — 10-minute walks count <span class=\"src\">1.4.2</span></td></tr>\n      <tr><td>⚖️ Weight</td><td>Towards BMI &lt;25 — aim, not a threshold; 5–10% loss is meaningful</td><td>≈1 mmHg per kg lost</td><td>Frame it: \"losing 5 kg works like one BP tablet\"</td></tr>\n      <tr><td>🍺 Alcohol</td><td>≤14 units/week, spread, with alcohol-free days</td><td>↓2–4 mmHg systolic</td><td>Chronic intake \u2191 cortisol/RAAS and binges spike BP; reduce where intake is excessive \u2014 brief intervention (AUDIT-C) <span class=\"src\">1.4.3</span></td></tr>\n      <tr><td>🚭 Smoking</td><td>Cessation</td><td>No direct BP fall</td><td>The single biggest modifiable CV risk — refer to stop-smoking support ± NRT/varenicline <span class=\"src\">1.4.7</span></td></tr>\n      <tr><td>☕ Caffeine</td><td>Avoid excess (&gt;4 strong coffees/day)</td><td>Transient pressor effect</td><td>Ask before repeating a \"high\" clinic reading <span class=\"src\">1.4.5</span></td></tr>\n      <tr><td>😴 Sleep</td><td>Screen for OSA (STOP-BANG)</td><td>Treatable contributor</td><td>Snoring + daytime somnolence + resistant BP → sleep study</td></tr>\n    </tbody>\n    <caption>Effect sizes are typical trial averages used for shared decision-making, not guarantees. Lifestyle continues after drugs start — it reduces the number of tablets ultimately needed.</caption>\n  </table>\n  <div class=\"say\"><b>Say it like this</b>\"Lifestyle changes can lower your blood pressure as much as a tablet would. Let's pick just one to start with — which feels most doable for you?\"</div>\n  </div>"}]},
    {id:"ladder", nav:"Drug ladder", title:"The A → C → D drug ladder",
     sub:"A = ACE inhibitor/ARB, C = calcium-channel blocker, D = thiazide-like diuretic. Before every step-up: confirm <b>adherence</b>, re-check home readings, optimise tolerated doses — never add a drug to compensate for one that isn't being taken <span class=\"src\">1.4.40, 1.4.44</span>. Step up roughly every 4 weeks until at target.",
     blocks:[{b:"html", html:"<div class='card red'><h3>Pregnant, postpartum or planning pregnancy? Stop here</h3><p>The <b>A</b> and <b>D</b> rungs of this ladder do not apply, and new hypertension or suspected pre-eclampsia needs <b>same-day maternity assessment</b> rather than a ladder step. See <b>Special groups</b> for which drugs to use, switching before conception and aspirin prophylaxis <span class='src'>NG133</span>.</p></div><div class='card red'><h3>Known HFrEF (LVEF ≤40%)? Don't use this ladder alone</h3><p>In heart failure with reduced ejection fraction these classes are <b>prognostic therapy titrated to target dose</b>, not antihypertensives titrated to a number. Follow the heart-failure pathway: optimise an <b>ACE inhibitor, ARNI or ARB</b>, an evidence-based <b>beta-blocker</b>, an <b>MRA</b> and an <b>SGLT2 inhibitor</b> to the maximum tolerated regimen, with a loop diuretic for congestion.</p><ul><li><b>Avoid verapamil, diltiazem and short-acting dihydropyridines.</b> Amlodipine is not contraindicated, but it is not a substitute for prognostic therapy — if more BP treatment is needed, seek heart-failure advice</li><li><b>A low BP alone does not justify stopping</b> disease-modifying treatment — decide on symptoms, congestion, renal function, K⁺ and specialist advice</li><li>U&amp;E before starting, 1–2 weeks after starting and after each increase, then every 3–6 months</li></ul></div>"}, 
       {b:"ladder", steps:[
         {step:"Step 1", when:"first drug", title:"Who gets A, who gets C",
          html:"<table><thead><tr><th>Patient</th><th>Offer</th><th>Source</th></tr></thead><tbody><tr><td>Type 2 diabetes, any age or family origin (ethnicity)</td><td><b>A</b> — ACE inhibitor or ARB (renoprotective regardless of age or ethnicity; ARB preferred in Black African / African–Caribbean patients)</td><td><span class='src'>1.4.32, 1.4.36</span></td></tr><tr><td>Aged &lt;55 without T2DM</td><td><b>A</b> — ACE inhibitor or ARB</td><td><span class='src'>1.4.33</span></td></tr><tr><td>Aged ≥55 without T2DM</td><td><b>C</b> — CCB</td><td><span class='src'>1.4.35</span></td></tr><tr><td>Black African / African–Caribbean family origin, any age, without T2DM</td><td><b>C</b> — CCB</td><td><span class='src'>1.4.35</span></td></tr><tr><td>CKD with ACR ≥3 mg/mmol</td><td><b>A</b> to maximum tolerated dose (plus SGLT2 inhibitor where indicated)</td><td><span class='src'>NG203 1.6.4</span></td></tr></tbody></table><ul><li>Usual primary-care agents: <span class='rx'>ramipril 1.25–10 mg OD</span> for A, <span class='rx'>amlodipine 5–10 mg OD</span> for C — start low and titrate to the maximum tolerated dose</li><li>ACE inhibitor not tolerated (e.g. cough) → <b>ARB</b>; never combine an ACE inhibitor with an ARB <span class='src'>1.4.33–1.4.34</span></li><li>CCB not tolerated (oedema) or heart failure present → thiazide-like diuretic <span class='src'>1.4.37–1.4.38</span></li></ul>"},
         {step:"Step 2", when:"add a second drug", title:"Combine by starting class", fromLabel:"above target — confirm adherence, then add",
          html:"<ul><li>On <b>A</b> → add a <b>CCB</b> or a thiazide-like diuretic <span class='src'>1.4.41</span></li><li>On <b>C</b> → add an <b>ACE inhibitor/ARB</b> or a thiazide-like diuretic; if the patient has T2DM or is of Black African / African–Caribbean origin, prefer an <b>ARB</b> over an ACE inhibitor <span class='src'>1.4.42–1.4.43</span></li><li>Two classes at moderate dose beat doubling one; A + C has the strongest outcome evidence (ACCOMPLISH). Consider a <b>fixed-dose combination tablet</b> to support adherence</li></ul>"},
         {step:"Step 3", when:"triple therapy", title:"A + C + D", fromLabel:"still above target on two drugs",
          html:"Uncontrolled on step 2 with adherence confirmed and doses optimal → <b>ACE inhibitor/ARB + CCB + thiazide-like diuretic</b> at optimal tolerated doses <span class='src'>1.4.45</span>. Choose a thiazide-like agent — <span class='rx'>indapamide 2.5 mg OD</span> (or <span class='rx'>indapamide MR 1.5 mg OD</span>) — over a conventional thiazide when starting or changing; a patient stable on bendroflumethiazide can continue it <span class='src'>1.4.39</span>. If a diuretic is already prescribed for another reason, that counts as D — do not double up."},
         {step:"Step 4", when:"resistant hypertension", title:"Confirm it, then K⁺ decides", tone:"amber", fromLabel:"uncontrolled on optimal A + C + D",
          html:"Uncontrolled on optimal tolerated A + C + D = <b>resistant hypertension</b> <span class='src'>1.4.46</span>. First re-confirm with ABPM/HBPM, check for postural hypotension, and discuss adherence <span class='src'>1.4.47</span>. Then add a fourth drug with specialist advice <span class='src'>1.4.48</span>:<ul><li><b>K⁺ ≤4.5 mmol/l</b> → consider low-dose <span class='rx'>spironolactone 25 mg OD</span>; extra caution if eGFR is reduced (hyperkalaemia). Check Na⁺, K⁺ and renal function <b>within 1 month</b> and repeat as needed <span class='src'>1.4.49–1.4.50</span></li><li><b>K⁺ &gt;4.5 mmol/l</b> → consider an <b>alpha-blocker or beta-blocker</b> <span class='src'>1.4.51</span></li><li>Still uncontrolled on optimal doses of four drugs → <b>specialist advice / referral</b> <span class='src'>1.4.52</span></li></ul>"}
       ]},
       {b:"html", html:"<div class='card cream'><h3>Which agent within each class — and what to watch</h3><table><thead><tr><th>Class</th><th>Commonly used in UK general practice</th><th>Watch</th></tr></thead><tbody><tr><td>A — ACE inhibitor</td><td><span class='rx'>Ramipril</span> first-line; perindopril erbumine or lisinopril are alternatives — all to the maximum tolerated dose</td><td>U&amp;E before and 1–2 weeks after each change; cough; angioedema</td></tr><tr><td>A — ARB</td><td>Candesartan, losartan or irbesartan (switch here for ACEi cough)</td><td>Same renal/K⁺ monitoring as ACE inhibitors</td></tr><tr><td>C — CCB</td><td><span class='rx'>Amlodipine</span> first-line; lercanidipine or felodipine if ankle oedema is troublesome</td><td>Oedema, flushing, gum hyperplasia</td></tr><tr><td>D — thiazide-like</td><td><span class='rx'>Indapamide</span>, MR preferred; bendroflumethiazide if already stable on it</td><td>Na⁺/K⁺ at 2 weeks; gout; hyponatraemia</td></tr><tr><td>Step 4</td><td>Low-dose <span class='rx'>spironolactone</span>, or an alpha-blocker (doxazosin) / beta-blocker (bisoprolol) by K⁺</td><td>Spironolactone: K⁺ at 1 month. Doxazosin: ask about PDE5 inhibitors. Beta-blocker if separately indicated (AF, IHD, heart failure)</td></tr></tbody><caption>NG136 specifies classes, not products; these are the usual primary-care choices. Doses are stated once, in the ladder steps above — confirm against the BNF and your local formulary before prescribing.</caption></table><p><b>Why this order?</b> The age/family-origin split reflects renin physiology: younger, non-Black patients tend to have high-renin hypertension responsive to RAAS blockade (A); older and Black African / African–Caribbean patients more often have low-renin, volume-dependent hypertension better controlled by a CCB or diuretic. Beta-blockers are not first-line for uncomplicated hypertension — they re-enter at step 4 or when separately indicated.</p></div>"}
     ]},
    {id:"targets", nav:"Targets", title:"Targets, secondary causes and side effects",
     sub:"The commonest error in hypertension care is applying the wrong row: age, diabetes type and ACR all change the number. The CKD rows come from NG203, not NG136.",
     blocks:[{b:"html", html:"<div class=\"card\"><h3>Clinic BP targets</h3>\n    <table>\n      <thead><tr><th>Person</th><th>Clinic target</th><th>ABPM / HBPM</th><th>Source</th></tr></thead>\n      <tbody>\n        <tr><td>Aged &lt;80 (including type 2 diabetes without CKD)</td><td>&lt;140/90</td><td>&lt;135/85</td><td><span class=\"src\">1.4.15–1.4.16, 1.4.22</span></td></tr>\n        <tr><td>Aged 80+</td><td>&lt;150/90</td><td>&lt;145/85</td><td><span class=\"src\">1.4.17, 1.4.22</span></td></tr>\n        <tr><td>CKD with ACR &lt;70 mg/mmol</td><td>&lt;140/90</td><td>&lt;135/85</td><td><span class=\"src\">NG203 1.6.1</span></td></tr>\n        <tr><td>CKD with <b>ACR ≥70 mg/mmol</b></td><td><b>&lt;130/80</b></td><td>—</td><td><span class=\"src\">NG203 1.6.2</span></td></tr>\n        <tr><td>Postural drop, frailty or multimorbidity</td><td>Aim for the target on the <b>standing</b> BP; use clinical judgement over a strict number</td><td>—</td><td><span class=\"src\">1.4.20–1.4.21</span></td></tr>\n      </tbody>\n    </table>\n  </div>\n  <div class=\"two\">\n    <div class=\"card teal\"><h3>ABPM / HBPM treatment targets</h3><p>Average during usual waking hours: <b>&lt;135/85</b> under 80, <b>&lt;145/85</b> aged 80+. Non-clinic readings run ~5 mmHg below clinic — never apply the clinic number to a home diary <span class=\"src\">1.4.22</span>.</p></div>\n    <div class=\"card amber\"><h3>Masked &amp; white-coat hypertension</h3><ul>\n      <li><b>Masked</b> — normal clinic, high ABPM/HBPM: same risk as sustained hypertension. Suspect in high-risk patients with unexplained target-organ damage <span class=\"src\">1.4.18</span></li>\n      <li><b>White-coat effect</b> or clinic/home disagreement → add ABPM/HBPM to clinic monitoring and treat the out-of-office number <span class=\"src\">1.4.15, 1.4.18</span></li>\n    </ul></div>\n  </div>\n  <div class=\"card\"><h3>Secondary hypertension — screen before you refer</h3>\n    <p>Suspect if age &lt;40, abrupt onset, truly resistant, or characteristic features. Where appropriate arrange the first-line test in primary care so the referral is informative — but never delay a same-day referral to do a test.</p>\n    <table>\n      <thead><tr><th>Clue</th><th>Think</th><th>First-line test</th></tr></thead>\n      <tbody>\n        <tr><td>Low K⁺, resistant hypertension</td><td>Primary aldosteronism (Conn's)</td><td>Aldosterone:renin ratio → endocrinology</td></tr>\n        <tr><td>Creatinine ↑&gt;30% on an ACEi, renal bruit, flash pulmonary oedema</td><td>Renal artery stenosis</td><td>Renal Doppler / MRA</td></tr>\n        <tr><td>Paroxysmal headache, sweating, palpitations, pallor</td><td>Phaeochromocytoma</td><td>Plasma metanephrines → endocrinology (same-day if crisis)</td></tr>\n        <tr><td>Snoring, daytime somnolence, resistant BP</td><td>Obstructive sleep apnoea</td><td>STOP-BANG → sleep study</td></tr>\n        <tr><td>Central obesity, striae, proximal weakness</td><td>Cushing's syndrome</td><td>Overnight dexamethasone suppression</td></tr>\n        <tr><td>Young, radio-femoral delay, arm-to-arm difference</td><td>Coarctation of the aorta</td><td>Echo / CT aorta</td></tr>\n        <tr><td>Abnormal U&amp;E, haematuria/proteinuria</td><td>Renal parenchymal disease</td><td>Renal ultrasound + ACR (and the NG12 haematuria rules above)</td></tr>\n      </tbody>\n    </table>\n  </div>\n  <div class=\"card amber\"><h3>Before you call it resistant — the six-step check</h3><ol>\n      <li><b>Adherence</b> — open, non-judgemental enquiry; prescription/refill record; consider once-daily or combination tablets</li>\n      <li><b>Measurement</b> — cuff size, supported arm, both arms; confirm with ABPM to exclude white-coat</li>\n      <li><b>BP-raising drugs</b> — NSAIDs, oral steroids, COCP, venlafaxine, decongestants, liquorice, stimulants, excess alcohol</li>\n      <li><b>Lifestyle drift</b> — salt creep, weight gain, alcohol, activity; re-set one measurable target</li>\n      <li><b>Secondary cause</b> — the table above</li>\n      <li><b>Doses</b> — is every existing drug at maximum tolerated dose before a fourth is added?</li>\n    </ol><p>All excluded and adherent → return to the ladder and step up.</p></div>\n  <div class=\"card\"><h3>Side effects — fix the symptom, keep the class working</h3>\n    <table>\n      <thead><tr><th>Side effect</th><th>Drug</th><th>What to do</th></tr></thead>\n      <tbody>\n        <tr><td>Dry cough (~10–15%)</td><td>ACE inhibitor</td><td>Warn at initiation; switch to an ARB — don't let the patient simply stop</td></tr>\n        <tr><td>Angioedema</td><td>ACE inhibitor</td><td><b>Stop permanently</b>; 999 if airway involved; ARB only with specialist advice</td></tr>\n        <tr><td>Ankle oedema</td><td>Amlodipine</td><td>Switch to lercanidipine or felodipine; adding an ACEi reduces it. Diuretics don't fix it</td></tr>\n        <tr><td>Gout flare</td><td>Thiazide-like diuretic</td><td>Treat the flare; consider swapping D; losartan is mildly uricosuric</td></tr>\n        <tr><td>Hyponatraemia (Na⁺ &lt;130)</td><td>Thiazide-like diuretic</td><td>Stop urgently; use another class</td></tr>\n        <tr><td>Hypokalaemia (K⁺ &lt;3.5)</td><td>Thiazide-like diuretic</td><td>Replace or switch class; recheck</td></tr>\n        <tr><td>Gynaecomastia</td><td>Spironolactone</td><td>Switch to eplerenone (specialist input) or move to the K⁺ &gt;4.5 arm</td></tr>\n        <tr><td>Erectile dysfunction</td><td>Thiazides, beta-blockers</td><td>A silent cause of non-adherence — ACEi/ARB/CCB are more neutral; PDE5 inhibitors are safe but not with doxazosin</td></tr>\n        <tr><td>Postural dizziness</td><td>Any</td><td>Standing BP; relax the target in frailty; review the whole drug list</td></tr>\n      </tbody>\n    </table>\n  </div>"}]},
    {id:"special", nav:"Special groups", title:"Special groups",
     blocks:[{b:"html", html:"<div class=\"two\">\n    <div class=\"card blue\"><h3>Pregnancy, breastfeeding &amp; pre-conception</h3><p><b>ACE inhibitors, ARBs and thiazide-like diuretics are not for use in pregnancy or when planning pregnancy</b> (MHRA) — switch <em>before</em> conception, not at the positive test <span class=\"src\">1.4.29</span>. Usual alternatives are <b>labetalol, nifedipine MR or methyldopa</b>; aspirin 75–150 mg from 12 weeks where pre-eclampsia risk factors are present. Pre-conception counselling reviews the whole drug list, not just antihypertensives. Manage established hypertension in pregnancy on the <a href=\"hypertension-pregnancy.html\">hypertension in pregnancy protocol</a> (NG133) — a distinct workflow, deliberately kept as its own topic.</p></div>\n    <div class=\"card\"><h3>Under 40</h3><p>Consider specialist evaluation for <b>secondary causes</b> and a more detailed long-term benefit–risk assessment; QRISK under-estimates lifetime risk at this age. Also consider specialist investigation at any age when features suggest a secondary cause <span class=\"src\">1.2.13, 1.4.14</span>.</p></div>\n    <div class=\"card\"><h3>Black African / African–Caribbean family origin</h3><p>Step 1 is a <b>CCB</b> (without T2DM, any age); if a second drug is needed, prefer an <b>ARB over an ACE inhibitor</b> <span class=\"src\">1.4.35, 1.4.43</span>. With type 2 diabetes, start ACEi/ARB like everyone else — ARB first-line <span class=\"src\">1.4.32, 1.4.36</span>.</p></div>\n    <div class=\"card\"><h3>CKD</h3><p>ACEi/ARB to maximum tolerated dose if ACR ≥3 mg/mmol, plus an SGLT2 inhibitor where indicated. Target &lt;130/80 once ACR ≥70. A stable creatinine rise of up to 30% (or eGFR fall up to 25%) after starting is acceptable — above that, stop and reassess <span class=\"src\">NG203 1.6.4–1.6.5</span>.</p></div>\n    <div class=\"card amber\"><h3>Frailty &amp; multimorbidity</h3><p>Every \"offer\" bends to clinical judgement — over-treatment causes falls and fractures. Treat to the <b>standing</b> BP, deprescribe or relax the target when there are postural symptoms or falls, and ask what the patient wants from treatment <span class=\"src\">1.4.9–1.4.13, 1.4.20</span>.</p></div>\n    <div class=\"card\"><h3>Treat the whole risk</h3><p>If QRISK3 ≥10%, offer <b>atorvastatin 20 mg</b> for primary prevention; 80 mg for established cardiovascular disease (NG238). <b>No aspirin for primary prevention.</b> Treating BP without lipids is half a job.</p></div>\n  </div>"}]},
    {id:"monitor", nav:"Monitoring", title:"Monitoring, review schedule &amp; safety-netting",
     sub:"Most harm from a new antihypertensive happens in the first 1–4 weeks. The blood test is not a formality — it is how you catch harm before the patient feels it.",
     blocks:[{b:"html", html:"<div class=\"card teal\"><h3>Bloods after each change — the \"1-2-1\" rule</h3>\n    <table>\n      <thead><tr><th>Drug</th><th>Test</th><th>When</th><th>Action threshold</th></tr></thead>\n      <tbody>\n        <tr><td>ACE inhibitor / ARB</td><td>U&amp;E, K⁺, eGFR</td><td><b>1</b>–2 weeks after each change</td><td><b>K⁺ 5.5–5.9</b> → stop other K⁺-raising drugs, check volume and NSAIDs, repeat promptly; don't reflexively stop a valuable ACEi/ARB</td></tr>\n      <tr><td>ACE inhibitor / ARB</td><td>U&amp;E, K⁺, eGFR</td><td>Same sample</td><td><b>K⁺ ≥6.0</b> → stop RAAS inhibition and seek urgent advice</td></tr>\n      <tr><td>ACE inhibitor / ARB</td><td>U&amp;E, K⁺, eGFR</td><td>Same sample</td><td><b>Creatinine ↑&gt;30% or eGFR ↓&gt;25%</b> → seek another cause (volume, NSAIDs, renal artery stenosis); reduce or stop only if none found. In CKD a stable rise <b>≤30%</b> is expected — recheck rather than stop</td></tr>\n        <tr><td>Thiazide-like diuretic</td><td>Na⁺, K⁺, eGFR</td><td>Within <b>2</b> weeks (and at 4–6 weeks)</td><td>K⁺ &lt;3.5 → replace or switch; Na⁺ &lt;130 → stop urgently</td></tr>\n        <tr><td>Spironolactone (step 4)</td><td>Na⁺, K⁺, renal function</td><td>Within <b>1</b> month, then as needed <span class=\"src\">1.4.49–1.4.50</span></td><td>K⁺ 5.5–5.9 → reduce dose, stop other potassium-raising drugs, recheck within a week; K⁺ ≥6.0 → stop spironolactone and seek urgent advice</td></tr>\n        <tr><td>Everyone on treatment</td><td>BP + pulse, U&amp;E, ACR, HbA1c, QRISK, adherence, lifestyle</td><td><b>Annual</b> structured review <span class=\"src\">1.4.24</span></td><td>Above target → check adherence, then titrate or step up</td></tr>\n      </tbody>\n      <caption>NG136 mandates monitoring for step-4 diuretics and spironolactone; the 1–2-week U&amp;E after ACEi/ARB changes is standard UK practice and NICE advice.</caption>\n    </table>\n  </div>\n  <div class=\"grid\">\n    <div class=\"card\"><h3>2–4 weeks after any change</h3><p>Response and tolerability: BP, side effects, U&amp;E per the 1-2-1 rule. Titrate the dose or step up if not at target <em>and</em> adherence is good.</p></div>\n    <div class=\"card\"><h3>Every 4 weeks while titrating</h3><p>Each visit in the same order: adherence → home/clinic BP → lifestyle → then escalate. Use an HBPM diary between visits, with a clear instruction on what to do if target is not reached <span class=\"src\">1.4.19</span>.</p></div>\n    <div class=\"card\"><h3>3 months — lifestyle-only stage 1</h3><p>Repeat BP, reassess QRISK, reinforce the one agreed change. Still above target or a new indication appears → start the ladder.</p></div>\n    <div class=\"card\"><h3>Annually — everyone</h3><p>BP + pulse · U&amp;E, eGFR, ACR · HbA1c · QRISK · medication and adherence review · complication screen · lifestyle and psychosocial check-in <span class=\"src\">1.4.24</span>.</p></div>\n  </div>\n  <div class=\"card red\"><h3>Safety-netting — say these out loud, document them</h3>\n    <div class=\"say\"><b>999 — all patients</b>\"Sudden severe headache unlike any before, weakness or numbness on one side, sudden vision change, chest pain, or confusion — call 999 immediately. Don't drive yourself; don't wait to ring us.\"</div>\n    <div class=\"say\"><b>Starting any antihypertensive</b>\"You may feel dizzy when you stand up, especially in the first week — move slowly. If you feel faint, ring us; but don't stop the tablet without speaking to us first.\"</div>\n    <div class=\"say\"><b>On an ACE inhibitor</b>\"A dry tickly cough isn't dangerous — don't stop it, ring us and we'll switch you. Swelling of the lips, tongue or throat is different: that's 999.\"</div>\n    <div class=\"say\"><b>Sick-day rules — diuretic or spironolactone</b>\"If you get a vomiting-and-diarrhoea illness, pause these tablets for 48 hours and let us know — they can affect your kidneys when you're dehydrated.\"</div>\n    <p style=\"margin-top:10px\">Naming the exact symptom and the exact action (\"call 999\", not \"seek help\") produces faster escalation and is what protects you in the record.</p>\n  </div>"}]},
    {id:"loop", nav:"Not responding?", title:"Not responding? Work through this before adding the next drug", sub:"\"Apparent\" resistance is usually adherence, measurement or white-coat effect — not true pharmacological failure. Exclude each before escalating.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"1 · Adherence", html:"Open, non-judgemental enquiry. Check the pharmacy refill and prescription record. Consider once-daily or <b>combination tablets</b> — the single most effective adherence intervention in hypertension."},
         {tone:"amber", h:"2 · Measurement", html:"Correct cuff size, supported arm, both arms. Confirm with <b>ABPM or HBPM</b> to exclude white-coat effect before treating a number you do not trust."},
         {tone:"amber", h:"3 · BP-raising drugs", html:"NSAIDs, oral steroids, combined oral contraceptive, venlafaxine, decongestants, liquorice, recreational stimulants, alcohol. Stopping one is often worth a rung."},
         {tone:"amber", h:"4 · Lifestyle drift", html:"Salt creep, weight gain, alcohol, reduced activity. Re-set <b>one</b> measurable target rather than restating all of them."},
         {tone:"blue", h:"5 · Secondary cause", html:"Young, abrupt onset, or truly resistant? Screen for primary hyperaldosteronism (Conn's), renal disease, phaeochromocytoma and OSA — see <b>Refer</b>."},
         {tone:"amber", h:"6 · Optimise doses", html:"Is every existing drug at its <b>maximum tolerated dose</b> before a new one is added? Adding a fourth drug to three sub-maximal ones is not step 4."}
       ]},
       {b:"cards", items:[
         {tone:"green", h:"All excluded and adherent?", html:"Return to the ladder and step up to the next rung — that is now a genuine escalation rather than a workaround for an unfixed problem."}
       ]}
     ]},
    {id:"refer", nav:"Refer", title:"Refer — when to step beyond primary care",
     sub:"Manage everything above in primary care first. Refer when you hit a ceiling or a red flag — and keep treating in the interim unless told otherwise.",
     blocks:[{b:"html", html:"<div class=\"two\">\n    <div class=\"card red\"><h3>Same-day / emergency</h3><ul>\n      <li>Accelerated hypertension — papilloedema or retinal haemorrhage <span class=\"src\">1.5.2</span></li>\n      <li>Severe BP (≥180/120) with new chest pain, heart failure, neurology/confusion or AKI <span class=\"src\">1.5.3</span></li>\n      <li>Suspected phaeochromocytoma crisis</li>\n      <li>Pregnancy ≥20 weeks with BP ≥140/90 → same-day obstetric assessment</li>\n      <li>Suspected aortic dissection → 999</li>\n    </ul></div>\n    <div class=\"card purple\"><h3>Urgent suspected cancer <span class=\"tw\">2WW</span> · NICE NG12</h3><ul>\n      <li><b>Visible haematuria, aged ≥45</b>, unexplained — or recurring after successful treatment of a UTI → <b>USC referral for bladder/renal cancer</b> (referral within 48 hours, seen within 2 weeks)</li>\n      <li><b>Non-visible haematuria, aged ≥60</b>, unexplained, <b>with dysuria or a raised white-cell count</b> → USC referral</li>\n      <li>Aged ≥60 with recurrent or persistent unexplained UTI → <b>consider</b> USC referral</li>\n      <li>Hypertension itself is not an NG12 criterion — the referral is driven by the haematuria found in the work-up</li>\n    </ul></div>\n    <div class=\"card amber\"><h3>Resistant hypertension</h3><p>Above target on optimal tolerated A + C + D <b>plus</b> a fourth agent, once adherence, measurement and white-coat effect are excluded → specialist hypertension clinic <span class=\"src\">1.4.52</span>.</p></div>\n    <div class=\"card\"><h3>Suspected secondary cause</h3><p>Hypokalaemia with hypertension (Conn's); abdominal bruit or rapid eGFR fall (renal artery stenosis); paroxysmal sweating/palpitations (phaeochromocytoma); resistant OSA; radio-femoral delay (coarctation). Send the first-line test result with the referral.</p></div>\n    <div class=\"card\"><h3>Young patient</h3><p>Age &lt;40 with confirmed hypertension — secondary screen and specialist assessment for long-term benefit–risk <span class=\"src\">1.4.14</span>.</p></div>\n    <div class=\"card\"><h3>Specialist input needed</h3><p>Intolerance to multiple classes; eGFR &lt;30 needing RAAS drugs; pregnancy or complex pre-conception planning; hypertension with significant end-organ disease.</p></div>\n  </div>\n  <div class=\"say\"><b>Say it like this</b>\"I've taken your treatment as far as we safely can here, so I'm referring you to a specialist who can run some extra tests and fine-tune things. We'll keep your current tablets going while you wait.\"</div>"}]},
    {id:"sca", nav:"SCA", title:"SCA consultation practice",
     sub:"A practice aid mapped to the published RCGP domain descriptors — not an official mark scheme. Hypertension cases usually test shared decision-making around a borderline diagnosis or an unwilling patient. The full teaching case, patient-actor brief and drug-choice drills live in the <a href=\"../../cases/hypertension.html\">Casebook chapter</a>.",
     blocks:[{b:"html", html:"<div class=\"card\">\n    <span class=\"dt\">Data gathering &amp; assessment</span><span class=\"dt\">Clinical management</span><span class=\"dt\">Relating to others</span>\n    <h4>Classic scenario: 52-year-old, clinic BP 148/92, feels fine, \"I don't want tablets\"</h4>\n    <div class=\"say\"><b>Data gathering — pick up the hidden risk</b>\"Before we decide anything — any chest pain, breathlessness, headaches or changes in your vision? … Does anyone in your family have heart problems or stroke, and at what age?\"</div>\n    <div class=\"say\"><b>Management — make the diagnosis rigorous, not reflexive</b>\"One high reading doesn't make the diagnosis. I'd like you to wear a small monitor for 24 hours — it reads automatically while you get on with your day. If the average is high, we call it hypertension; if it's normal, we've saved you a lifetime of tablets you never needed.\"</div>\n    <div class=\"say\"><b>Relating to others — share the decision, keep the door open</b>\"If it is high, a tablet isn't the only option — it's a conversation about your overall risk, and it's your decision. What I'd ask is that we look at the numbers together. Either way, the salt, the walking and the weight are worth doing — shall we pick one?\"</div>\n    <h4>Examiner-style checkpoints</h4>\n    <ul>\n      <li>Confirmed the diagnosis with ABPM/HBPM rather than treating one clinic reading?</li>\n      <li>Quantified risk in absolute terms (QRISK) and looked for target-organ damage?</li>\n      <li>Explored ideas, concerns and expectations <em>before</em> recommending drugs?</li>\n      <li>Offered lifestyle as genuine treatment, with one concrete agreed action?</li>\n      <li>Safety-netted: when to re-measure, and which symptoms mean earlier review or 999?</li>\n    </ul>\n  </div>"}]},
    {id:"evidence-legacy", nav:false, title:"Evidence", blocks:[{b:"html", html:"<div class=\"card\"><ul class=\"evlist\">\n    <li><b>NICE NG136 — Hypertension in adults: diagnosis and management</b> (2019; amended 2022, 2023)<br><a href=\"https://www.nice.org.uk/guidance/ng136/chapter/recommendations\">nice.org.uk/guidance/ng136</a><span class=\"rd\"> — measurement and diagnosis 1.2.1–1.2.13; severe BP 1.5.1–1.5.3; investigations 1.3.1–1.3.3; lifestyle 1.4.1–1.4.8; thresholds 1.4.9–1.4.14; targets 1.4.15–1.4.24; drug steps 1.4.32–1.4.52; pregnancy 1.4.29</span></li>\n    <li><b>NICE NG203 — Chronic kidney disease</b> (2021)<br><a href=\"https://www.nice.org.uk/guidance/ng203/chapter/recommendations\">nice.org.uk/guidance/ng203</a><span class=\"rd\"> — BP targets by ACR band 1.6.1–1.6.2; ACEi/ARB in proteinuric CKD 1.6.4–1.6.5</span></li>\n    <li><b>NICE NG12 — Suspected cancer: recognition and referral</b> (May 2025)<br><a href=\"https://www.nice.org.uk/guidance/ng12\">nice.org.uk/guidance/ng12</a><span class=\"rd\"> — bladder and renal cancer: visible haematuria ≥45; non-visible haematuria ≥60 with dysuria or raised WCC</span></li>\n    <li><b>NICE NG133 — Hypertension in pregnancy</b> (2019, am. 2023) and <b>NG238 — CVD risk and lipid modification</b> (2023)<span class=\"rd\"> — pregnancy drug choice and statin thresholds</span></li>\n    <li><b>MHRA Drug Safety Update</b> — ACE inhibitors and ARBs: not for use in pregnancy<br><a href=\"https://www.gov.uk/drug-safety-update\">gov.uk/drug-safety-update</a></li>\n    <li><b>BNF</b><br><a href=\"https://bnf.nice.org.uk\">bnf.nice.org.uk</a><span class=\"rd\"> — the usual adult doses are given in the ladder above; verify every dose here before prescribing</span></li>\n  </ul></div>"}]}
  ],
  foot:"Hypertension in adults \u2014 NICE NG136 (2019, amended 2023), NG203 (CKD) and NG133 (pregnancy). Diagnosis and management are merged on this page; there is no separate hypertension pathway to cross-check. Verify all doses against the current BNF before prescribing."
});
