<script>
MG.render({
  icon:"🕊️",
  title:"Palliative breathlessness",
  eyebrow:"Protocol · assess and manage in one place",
  stemTitle:"Breathlessness in advanced illness: treat what can be reversed, start with the fan, consider a monitored opioid trial, and avoid routine oxygen without hypoxaemia or clear benefit",
  stemSub:"Breathlessness in advanced cancer, COPD, heart failure or interstitial lung disease usually has more than one cause, and fear makes it worse. Treat the reversible causes that fit the patient's goals. Teach the fan, positioning and breathing control. Consider a low-dose opioid trial for refractory distressing breathlessness, with renal and sedation precautions and a clear review plan. Use benzodiazepines mainly for panic or anxiety, or for refractory distress in the last days of life. Do not routinely prescribe oxygen for breathlessness without symptomatic hypoxaemia or demonstrated benefit. Plan anticipatory medicines individually, and involve specialist palliative care when symptoms are refractory, renal function is impaired, or opioid/benzodiazepine combinations are needed. Chronic refractory breathlessness and the last days of life are handled separately: last-days recommendations are not applied automatically to every patient with advanced disease.",
  guideline:"NICE NG31 (2015) · NICE NG115 (2018, updated 2019) · NICE NG106 (2018, updated 2025) · BTS home oxygen (2015) · BTS emergency oxygen (2017) · Scottish Palliative Care Guidelines: Breathlessness (2025) · NHS Greater Manchester Palliative Care Guidelines (2025)",
  meta:[
    {t:"NICE NG31 last days of life (2015) · QS144 (2017)"},
    {t:"NICE NG115 COPD · NG106 heart failure"},
    {t:"BTS home oxygen 2015 · MHRA DSU March 2020"},
    {t:"Scottish Palliative Care Guidelines 2025 · Cochrane"},
    {t:"GMMMG palliative care guidelines · local formulary for doses"},
    {t:"NG12 only if no established diagnosis", tone:"tw"}
  ],
  lead:"<div class='mg-layers'><a href='#redflags'><b>Red flags</b><small>Sudden, stridor, SVCO</small></a><a href='#reversible'><b>Reversible</b><small>Treat if goals allow</small></a><a href='#nondrug'><b>Fan first</b><small>Breathing and positioning</small></a><a href='#opioid'><b>Opioid trial</b><small>Monitored, individual</small></a><a href='#refer'><b>Refer</b><small>Who and when</small></a></div>",
  quickSub:"The six points that change what you do. Each one traces to a source under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"Sudden or new breathlessness is a new problem", html:"Acute breathlessness, stridor, pleuritic pain, haemoptysis, or swelling of the face and arms needs assessment for <b>PE, airway obstruction, SVCO, a large effusion, pneumothorax or pulmonary oedema</b>. Whether you admit depends on the patient's goals, but the decision should be deliberate, not a default."},
    {tone:"blue", h:"Treat what can be reversed", html:"Look for and treat reversible causes (for example pulmonary oedema or pleural effusion) when that fits the patient's wishes and how unwell they are, matching investigation intensity to prognosis and goals. NICE NG31 makes this the first step even in the last days of life."},
    {tone:"green", h:"The fan works, and it's cheap", html:"A <b>handheld fan directed at the face</b> reduced breathlessness in a randomised crossover trial (Galbraith, JPSM 2010). Combine it with positioning, pursed-lip breathing, pacing and anxiety management (Scottish Palliative Care Guidelines 2025)."},
    {tone:"cream", h:"Consider a monitored low-dose opioid trial", html:"After reversible causes and non-drug measures have been addressed, <b>consider a monitored low-dose opioid trial for distressing refractory breathlessness</b> — not a routine default. Continue only if there is clear symptomatic benefit that outweighs adverse effects. Use the local palliative-care formulary for drug, starting dose, interval and renal adjustment. Use the lowest effective dose and reassess frequently; some guidance suggests limited extra benefit above about 30 mg oral morphine/24 h in opioid-naive patients, but this is not an absolute ceiling (Scottish Palliative Care Guidelines 2025). Co-prescribe a laxative."},
    {tone:"amber", h:"Benzodiazepines: panic, or last-days distress", html:"Cochrane found <b>no evidence that benzodiazepines relieve breathlessness</b> itself (Simon 2016), so do not use them routinely for chronic breathlessness. Consider them for prominent panic or anxiety, or when distressing breathlessness persists in the last days of life despite non-drug measures and/or an opioid (NICE NG31). The MHRA (DSU March 2020) warns that benzodiazepines with opioids can cause fatal respiratory depression: use the lowest effective doses, document the indication, discuss the risk and monitor — but do not withhold appropriate end-of-life symptom control."},
    {tone:"blue", h:"No routine oxygen for breathlessness alone", html:"Do not prescribe oxygen routinely for breathlessness alone. Consider it where there is <b>symptomatic hypoxaemia</b> (NICE NG31) or clear benefit during an individualised trial; assess long-term or ambulatory oxygen through the respiratory/home-oxygen pathway. In patients who are not hypoxaemic, oxygen was no better than room air (Abernethy, Lancet 2010)."}
  ],
  pathwaySub:"Five steps, repeated at each review. The red step decides whether this is a new emergency.",
  pathway:[
    {title:"Is this new, sudden or dangerous?", html:"Stridor, SVCO features, suspected PE, tension pneumothorax, rapidly enlarging effusion, acute pulmonary oedema, sepsis. Decide the setting according to the patient's goals and any advance care plan.", alert:true},
    {title:"Find what is reversible", html:"Effusion, infection, bronchospasm, heart failure, anaemia, PE, arrhythmia, and ascites splinting the diaphragm. Also medication burden (sedatives), retained secretions, constipation or abdominal distension, and anxiety as an amplifier. Match investigation intensity to prognosis and the patient's goals. Check SpO₂ when assessing a new or worsening symptom, but not routinely in a comfortable person in the last days of life."},
    {title:"Non-drug measures for everyone", html:"Handheld fan, sitting upright and leaning forward, pursed-lip breathing, pacing, and a written plan for breathless episodes, before any drug treatment. Teach carers the same techniques."},
    {title:"Consider a monitored opioid trial; benzodiazepine for panic or last-days distress", html:"For distressing refractory breathlessness, a monitored low-dose opioid trial (local palliative formulary for dose), with a laxative; check cognition, sedation, respiratory rate and renal function. Lorazepam SL for panic attacks. Review within a few days and stop or reduce if there is no meaningful benefit."},
    {title:"Plan ahead", html:"Individualised anticipatory medicines for likely symptoms (not automatically an opioid and midazolam for everyone) before the patient can no longer swallow. Consider a syringe pump if repeated doses are needed. Advance care planning about hospital admission."}
  ],
  sections:[

    {id:"redflags", nav:"Red flags", title:"Red flags: when breathlessness is a new emergency", sub:"A patient receiving palliative care can still have an acute, treatable event. Recognise it, then decide with the patient what treatment fits.",
     blocks:[
       {b:"warn", html:"<b>Scope:</b> this pathway covers breathlessness in advanced illness and keeps separate principles for chronic refractory breathlessness and the last days of life. NICE NG31 applies to adults in the last 2 to 3 days of life; its recommendations (oxygen, opioid and benzodiazepine use, anticipatory medicines, whether to investigate PE, infection, pulmonary oedema or an effusion) should not be applied automatically to every patient with advanced COPD, cancer, heart failure or ILD."},
       {b:"cards", items:[
         {tone:"red", h:"Stridor, or swelling of the face, neck and arms", html:"<b>Central airway obstruction</b> or <b>superior vena cava obstruction</b>. Arrange same-day oncology or acute oncology assessment if the patient's goals support it. Steroids, stenting or radiotherapy may give real relief. See <a href='svco.html'>SVCO</a>.", src:"NICE NG31 (2015): identify and treat reversible causes"},
         {tone:"red", h:"Sudden breathlessness with pleuritic pain, haemoptysis or a swollen leg", html:"Possible <b>PE</b>, which is common in cancer. Whether to investigate and anticoagulate depends on prognosis, bleeding risk and the patient's wishes. It is a clinical decision to discuss, not an automatic one. See <a href='pulmonary-embolism.html'>pulmonary embolism</a>.", src:"NICE NG31 (2015): identify and treat reversible causes"},
         {tone:"red", h:"Acute pulmonary oedema or fast AF", html:"This can often be reversed with diuretics or rate control even in advanced disease. NG31 gives pulmonary oedema as an example of a reversible cause to treat.", src:"NICE NG31 (2015)"},
         {tone:"amber", h:"A large or re-accumulating pleural effusion", html:"Drainage can give rapid relief. For recurrent malignant effusions, a respiratory team can consider pleurodesis or an indwelling pleural catheter.", src:"NICE NG31 (2015): pleural effusion as a reversible cause"},
         {tone:"amber", h:"Drowsy, pinpoint pupils or slow breathing on opioids plus a benzodiazepine", html:"Possible <b>opioid toxicity or combined respiratory depression</b>. Review doses, renal function and co-prescribed sedatives. Benzodiazepines and opioids can both cause life-threatening respiratory depression, so monitor closely.", src:"MHRA Drug Safety Update, March 2020"},
         {tone:"amber", h:"Severe COPD, type 2 respiratory failure or NIV", html:"Patients with severe COPD or known hypercapnia are particularly vulnerable to <b>opioid accumulation, benzodiazepine-related respiratory depression and worsening hypercapnia from excessive oxygen</b>. Use local respiratory/palliative advice where there is known hypercapnia, severe COPD, NIV use or unexplained drowsiness.", src:"BTS emergency oxygen guideline (2017) · MHRA Drug Safety Update, March 2020"},
         {tone:"purple", h:"NG12: breathlessness with no diagnosis yet", html:"NG12 applies only when there is <b>no established diagnosis</b> (for example palliative care for frailty or dementia) — the chest X-ray criteria are under <a href='#refer'>Refer</a>. In a patient with known advanced disease, use the relevant oncology, respiratory or palliative pathway; new symptoms are not ignored, but investigate only if it is consistent with the patient's goals.", src:"NICE NG12 (updated April 2026)"}
       ]},
       {b:"why", html:"Breathlessness in advanced illness is usually chronic and multifactorial, which makes it easy to treat every change as 'the disease progressing'. But a new cause can appear on top of the existing one. PE, effusion, SVCO and pulmonary oedema are all common in advanced cancer and heart failure, and all can be treated. NG31 asks clinicians to look for reversible causes before turning to symptom control alone, even in the last days of life. Whether to act is a shared decision based on the patient's goals, but that decision should be made on purpose."}
     ]},

    {id:"reversible", nav:"Reversible causes", title:"Reversible causes: treat if it fits the patient's goals", sub:"Consider each of these at the first assessment and again whenever breathlessness gets worse.",
     blocks:[
       {b:"table", head:["Cause","Clue","Possible action (if appropriate)"], rows:[
         ["Pleural effusion","Stony dullness, reduced breath sounds, known malignancy","Therapeutic aspiration. Pleurodesis or an indwelling catheter for recurrence (respiratory team)"],
         ["Infection","Fever, purulent sputum, new crackles","Antibiotics, if they fit the goals of care. Sometimes the kinder choice is symptom control alone"],
         ["Bronchospasm (COPD, asthma)","Wheeze, known airways disease","Optimise inhalers, with a short course of oral steroid if needed for bronchospasm. See <a href='copd.html'>COPD</a>"],
         ["Heart failure","Orthopnoea, oedema, raised JVP","Optimise diuretics and heart failure treatment. See <a href='heart-failure.html'>heart failure</a>"],
         ["Anaemia","Pallor, fatigue, low Hb","Transfusion if symptomatic and the benefit is likely to outweigh the burden"],
         ["PE","Sudden onset, pleuritic pain, risk factors","Anticoagulation, weighing prognosis and bleeding risk"],
         ["SVCO or lymphangitis","Facial swelling, distended chest veins, progressive breathlessness with a clear chest X-ray","Acute oncology. Steroids and stenting or radiotherapy. See <a href='svco.html'>SVCO</a>"],
         ["Ascites","Tense abdomen splinting the diaphragm","Paracentesis"],
         ["Medication burden","Sedatives, recent dose increases, drowsiness","Review and reduce sedating medicines where possible"],
         ["Retained secretions or mucus plugging","Weak cough, rattly or wet breathing","Positioning, chest clearance techniques, treat infection if it fits the goals"],
         ["Constipation or abdominal distension","Bloating, reduced bowel action, opioid use","Treat the constipation. See <a href='palliative-constipation.html'>palliative constipation</a>"],
         ["Anxiety or panic","Episodes triggered by fear","An amplifier rather than necessarily the sole cause: non-drug measures and a written plan"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Check SpO₂ when it will change management", html:"When assessing a new or worsening symptom, SpO₂ (including on exertion) helps judge whether oxygen may have a role and sets a baseline. In a comfortable person in the last days of life, do not continue routine pulse oximetry if it will not change management: treat distress, not the number.", src:"NICE NG31 (2015) · BTS home oxygen guideline (2015) · BTS emergency oxygen guideline (2017)"},
         {tone:"amber", h:"Steroids for selected causes only", html:"Use corticosteroids for selected causes such as airway obstruction, SVCO, lymphangitis, inflammatory oedema or bronchospasm, not as a routine treatment for undifferentiated breathlessness."},
         {tone:"cream", h:"Name the goals first", html:"Ask what matters most to the patient: staying at home, avoiding hospital, time with family. Then match investigations to that. Some patients want every reversible cause pursued, others want comfort only.", src:"NICE NG31 (2015)"}
       ]}
     ]},

    {id:"nondrug", nav:"Fan first", title:"Non-drug measures: the foundation for every patient", sub:"These work at rest, before activity, and in the last days of life. Teach them to the patient and carers.",
     blocks:[
       {b:"tiles", v:"life", items:[
         {t:"🌬️ Handheld fan", html:"Cool air directed at the face (around the nose and mouth) for a few minutes during an episode. In a randomised crossover trial it reduced breathlessness compared with a fan directed at the legs."},
         {t:"🪑 Positioning", html:"Sit upright or lean forward with the forearms resting on a table or knees. In bed, prop the patient up. Open a window or cool the room."},
         {t:"🫁 Breathing control", html:"Pursed-lip breathing (breathe out slowly through pursed lips) and relaxed breathing from the diaphragm. Practise when calm so the techniques are available during an episode."},
         {t:"🚶 Pacing and energy", html:"Break tasks up, sit to wash and dress, and plan activity around the times of day the patient is at their best. Use equipment and OT assessment."},
         {t:"🧠 Anxiety and panic", html:"Breathlessness causes fear and fear worsens breathlessness. A calm explanation, a written plan for episodes and a practised routine reduce the panic that makes it worse."}
       ]},
       {b:"cards", items:[
         {tone:"green", h:"The evidence for the fan", html:"Galbraith et al. randomised 50 breathless patients with advanced disease to use a handheld fan on the face or the legs for 5 minutes, then swapped them over. Breathlessness fell significantly only when the fan was directed at the face.", src:"Galbraith et al., J Pain Symptom Manage 2010"},
         {tone:"green", h:"Recommended in the Scottish guideline", html:"The Scottish guideline recommends pursed-lip breathing, a handheld fan, opening a window, positioning, and strategies for anxiety and fatigue. In the last days of life, it recommends trying a table or handheld fan and a more upright position.", src:"Scottish Palliative Care Guidelines 2025"},
         {tone:"cream", h:"Non-drug measures in the last days", html:"NG31 advises considering non-pharmacological management of breathlessness in the dying person, alongside treating reversible causes and before or together with drugs.", src:"NICE NG31 (2015)"}
       ]},
       {b:"why", html:"Airflow across the face, which is supplied by the trigeminal nerve, seems to change how the brain perceives breathlessness. That may explain why a fan helps even when oxygen levels don't change, and why patients who aren't hypoxaemic can feel oxygen helps: it may be the flow of gas rather than the oxygen. That's why the fan comes first and oxygen is kept for hypoxaemia."}
     ]},

    {id:"opioid", nav:"Morphine", title:"Low-dose opioid for the sensation of breathlessness", sub:"An individual monitored trial, not a routine default. Use the current local palliative-care formulary (NHS Greater Manchester Palliative Care Guidelines) and product information for opioid selection, starting dose, interval, conversion and renal adjustment; the dose figures on this page are not a substitute and are not NICE dose recommendations. Exertion timing and the 30 mg/24 h figure come from the Scottish Palliative Care Guidelines (2025).",
     blocks:[
       {b:"ladder", steps:[
         {step:"1", title:"Opioid-naive, frail, or non-malignant disease", when:"start here", tone:"cream",
          html:"After reversible causes and non-drug measures, for distressing refractory breathlessness: <b>oral immediate-release morphine at a low dose</b> (commonly 2.5 mg in local palliative guidance; interval and titration per the local formulary), as a therapeutic trial. Assess cognition, sedation, respiratory rate and renal function. Review within a few days; continue only if there is clear benefit that outweighs adverse effects, and stop or reduce if there is no meaningful benefit. Involve specialist palliative care earlier in renal impairment, opioid intolerance, frailty or diagnostic uncertainty. Taken <b>15 to 30 minutes before expected exertion</b>, an opioid can reduce breathlessness on activity (Scottish Palliative Care Guidelines 2025)."},
         {step:"2", title:"Benefit, with regular need", when:"trial works", tone:"cream", fromLabel:"helpful and tolerated",
          html:"Titrate carefully, using the lowest effective dose and reassessing frequently. If needs are regular, a local palliative-care approach is to consider converting to a low-dose modified-release preparation, following local opioid-conversion guidance. Some palliative-care guidance suggests limited additional benefit above approximately 30 mg oral morphine per 24 hours for breathlessness in opioid-naive patients, but <b>this is not an absolute ceiling</b>; seek specialist advice before escalating beyond low doses."},
         {step:"3", title:"Already on an opioid for pain", when:"background opioid", tone:"amber", fromLabel:"on regular opioid",
          html:"Consider whether the existing breakthrough dose is appropriate for breathlessness, taking account of the total 24-hour opioid dose, recent dose changes, renal function, sedation and the likely cause of breathlessness. Seek specialist advice if the dose is high, escalating or unclear, and watch for unrecognised opioid toxicity. See <a href='palliative-pain.html'>palliative pain</a>."},
         {step:"4", title:"Renal impairment or not tolerated", when:"caution", tone:"amber", fromLabel:"side effects or low eGFR",
          html:"Morphine metabolites accumulate in renal impairment. Avoid routine morphine escalation in significant renal impairment; consider an alternative opioid with specialist advice. Monitor for sedation, myoclonus, hallucinations, confusion and respiratory depression. Seek specialist advice particularly with eGFR &lt;30 ml/min/1.73 m² or rapidly changing renal function. Dose per local palliative formulary."}
       ]},
       {b:"cards", items:[
         {tone:"cream", h:"Always co-prescribe", html:"A regular laxative (a stimulant, with a softener if needed) goes on the same prescription as a regular opioid. Also consider an antiemetic as needed for the first week. See <a href='palliative-constipation.html'>palliative constipation</a>.", src:"NICE CG140 (2012, updated 2016) · Scottish Palliative Care Guidelines 2025"},
         {tone:"cream", h:"COPD and heart failure too", html:"NICE NG115 supports using opioids, when appropriate, to relieve breathlessness in end-stage COPD that has not responded to other medical treatment. Starting low and titrating carefully is described as safe in cancer, COPD and heart failure, but take extra care in severe COPD or known hypercapnia.", src:"NICE NG115 (2018, updated 2019) · Scottish Palliative Care Guidelines 2025"},
         {tone:"blue", h:"How strong is the evidence?", html:"The Cochrane review found <b>low-quality evidence of a small benefit</b> from oral or parenteral opioids for breathlessness. An earlier crossover trial of 20 mg MR morphine daily in refractory breathlessness (mostly COPD) showed modest improvement. The BEAMS trial of 8 or 16 mg/day MR morphine in COPD found no significant fall in worst breathlessness at 1 week. Treat it as an individual trial, not a routine default: continue only if clear benefit outweighs adverse effects, stop if it doesn't.", src:"Barnes et al., Cochrane 2016 · Abernethy et al., BMJ 2003 · Ekström et al., JAMA 2022"},
         {tone:"amber", h:"Safety counselling", html:"Explain drowsiness and constipation. Tell the patient to follow the agreed dose closely. Tell carers the signs of sedation and respiratory depression (unusual sleepiness, confusion, slow or shallow breathing) and to seek help if they see them.", src:"MHRA Drug Safety Update, March 2020"}
       ]},
       {b:"why", html:"Low-dose opioids seem to reduce the brain's perception of breathlessness and the ventilatory response to it. At the low starting doses above, careful titration has not been associated with clinically significant respiratory depression in the populations studied. Most of the harm comes from starting too high, escalating without review, or adding sedatives without monitoring. Frail patients, those with renal impairment and those with severe COPD or type 2 respiratory failure are more vulnerable."}
     ]},

    {id:"anxiolytic", nav:"Benzodiazepines", title:"Benzodiazepines: for the panic, not the breathlessness", sub:"Do not routinely use benzodiazepines to treat chronic breathlessness itself. Consider them for prominent panic or anxiety, or when distressing breathlessness persists in the last days of life despite non-drug measures and/or opioid treatment.",
     blocks:[
       {b:"kv", rows:[
         ["Lorazepam SL","<b>500 micrograms sublingually, 4- to 6-hourly as needed</b>, for breathlessness with panic."],
         ["Midazolam SC","<b>2 mg SC, 4- to 6-hourly as needed</b> if the oral or SL route is unsuitable."],
         ["Dose status","Local palliative-care doses (Scottish Palliative Care Guidelines 2025) for specialist/last-days-of-life prescribing; verify against the current local guideline and product information."],
         ["Persistent background anxiety","Consider psychological support and treatment for the anxiety itself (see <a href='palliative-anxiety-depression.html'>palliative anxiety and depression</a>) rather than increasing regular benzodiazepines."]
       ]},
       {b:"cards", items:[
         {tone:"amber", h:"No evidence they relieve breathlessness itself", html:"The Cochrane review found no evidence that benzodiazepines relieve breathlessness in advanced cancer or COPD. Do not use them routinely for chronic breathlessness; consider them when panic or anxiety is prominent, or for distressing breathlessness persisting in the last days of life despite non-drug measures and/or an opioid.", src:"Simon et al., Cochrane 2016"},
         {tone:"amber", h:"Benzodiazepine plus opioid", html:"Both drugs can cause life-threatening respiratory depression; the MHRA advises co-prescribing only if there is no alternative, with close monitoring. In the last days of life a combination may be clinically appropriate for refractory breathlessness or panic: use the lowest effective doses, document the indication and goals, discuss the risk with the patient and carers where possible, and monitor for sedation and respiratory depression. Seek specialist palliative-care advice when the combination is required or escalating. Do not withhold appropriate end-of-life symptom control.", src:"MHRA Drug Safety Update, March 2020"},
         {tone:"cream", h:"NG31 and NG115 allow either or both", html:"In the last days of life NG31 advises considering an opioid, a benzodiazepine, or a combination for breathlessness. NG115 lists benzodiazepines, tricyclics, major tranquillisers and oxygen among options, when appropriate, in end-stage COPD.", src:"NICE NG31 (2015) · NICE NG115 (2018, updated 2019)"}
       ]}
     ]},

    {id:"oxygen", nav:"Oxygen", title:"Oxygen: not routinely for breathlessness alone", sub:"Patients and families often expect oxygen. Do not prescribe it routinely for breathlessness alone; consider it for symptomatic hypoxaemia or clear benefit during an individualised trial.",
     blocks:[
       {b:"cards", items:[
         {tone:"blue", h:"Don't start it routinely", html:"Do not routinely start oxygen to manage breathlessness in the dying person. Offer it only to people known or clinically suspected to have symptomatic hypoxaemia.", src:"NICE NG31 (2015)"},
         {tone:"blue", h:"No palliative oxygen for non-hypoxaemic patients", html:"Do not give palliative oxygen to patients with cancer or end-stage cardiorespiratory disease who are not hypoxaemic, or whose hypoxaemia is mild and above long-term oxygen thresholds.", src:"BTS guideline for home oxygen use in adults (2015)"},
         {tone:"blue", h:"Heart failure", html:"Do not offer long-term home oxygen therapy for advanced heart failure (it may still be indicated for comorbid COPD).", src:"NICE NG106 (2018, updated 2025)"},
         {tone:"green", h:"Room air works as well", html:"In a double-blind RCT in patients with refractory breathlessness who were not significantly hypoxaemic, oxygen by nasal cannula gave no more relief than medical air.", src:"Abernethy et al., Lancet 2010"},
         {tone:"amber", h:"If oxygen is given", html:"Treat it as a trial with a clear goal. Explain the fire risk with smoking and open flames, and the burden of tubing and a dry nose. Stop it if there is no benefit. Home oxygen needs a Home Oxygen Order Form and assessment."},
         {tone:"cream", h:"When oxygen may be relevant", html:"Exertional desaturation, documented hypoxaemia, selected COPD patients meeting long-term oxygen criteria, or a patient who reports clear symptomatic benefit during a monitored trial. BTS guidance generally restricts palliative oxygen to patients with consistent SpO₂ below about 90% or those who report significant benefit. Assess long-term or ambulatory oxygen through the respiratory/home-oxygen pathway. In severe COPD or known hypercapnia, avoid excessive oxygen.", src:"BTS emergency oxygen guideline (2017) · BTS home oxygen guideline (2015)"}
       ]},
       {b:"say", html:"Oxygen on its own isn't usually the answer when your oxygen level at rest is reasonable, as yours is today. That's why the fan and the breathing techniques are likely to help you more. The air moving across your face is what eases the feeling. We can check whether your level drops when you move about, and look again if things change."}
     ]},

    {id:"lastdays", nav:"Last days", title:"The last days of life and anticipatory prescribing", sub:"Plan before swallowing becomes difficult, so a breathless crisis at night can be managed at home.",
     blocks:[
       {b:"cards", items:[
         {tone:"cream", h:"Individualised anticipatory medicines", html:"Assess which medicines the person is likely to need for symptoms in the last days, including breathlessness and anxiety. Prescribe them individually for likely symptoms, rather than automatically issuing an opioid and midazolam to every patient, taking account of patient preference, current medicines, renal function and route. Record the indication, dose, route, maximum frequency and who will administer or review them. Midazolam is appropriate where anxiety, agitation or refractory distress is foreseeable, not as routine sedation. Discuss them with the patient, the people important to them and the team, and ensure carers and out-of-hours services know the plan.", src:"NICE NG31 (2015) · NICE QS144 (2017)"},
         {tone:"cream", h:"Subcutaneous doses in the last days", html:"Local palliative-care doses from the Scottish guideline — verify against your local guideline and product information. <b>Midazolam 2 to 5 mg SC, up to hourly if required</b>, as an anxiolytic sedative. An opioid can be given SC for pain or breathlessness, up to hourly if required. The Scottish guideline suggests seeking urgent advice if 3 or more doses within 4 hours bring little or no benefit, and advice or review if more than 6 doses are needed in 24 hours; these are local triggers, not national standards. The SC opioid dose depends on current oral use, per local opioid-conversion guidance.", src:"Scottish Palliative Care Guidelines 2025"},
         {tone:"cream", h:"Syringe pump", html:"Repeated breakthrough doses should prompt review of symptom control, diagnosis, renal function, opioid conversion and whether a continuous subcutaneous infusion is appropriate (the Scottish guideline uses 3 or more in 24 hours as a local trigger). Use local palliative-care guidance for dose calculations. If needs are regular or oral medicines can no longer be taken, consider a continuous SC infusion of the opioid, with or without midazolam. Doses per local palliative guidance and product information. See <a href='care-of-the-dying.html'>care of the dying</a>."},
         {tone:"green", h:"Keep the fan and positioning going", html:"Non-drug measures still help at the end of life: a table or handheld fan, sitting upright, and a calm presence. Show family members what they can do.", src:"Scottish Palliative Care Guidelines 2025"}
       ]},
       {b:"warn", html:"In the last days, the aim of midazolam is relief of distress, not sedation for its own sake. Titrate it to comfort, review it at every visit, and record the rationale. If distress is escalating and hard to control, seek specialist palliative advice the same day. If an opioid and a benzodiazepine are needed together, use the lowest effective doses, document the indication and goals, and monitor for sedation and respiratory depression."}
     ]},

    {id:"review", nav:"Review", title:"Review and safety-netting", sub:"Breathlessness changes, so the plan needs reviewing.",
     blocks:[
       {b:"timeline", items:[
         {n:"1", when:"First visit", title:"Assess and start", html:"Look for reversible causes, check SpO₂, and teach the fan and breathing control. Consider a monitored opioid trial if appropriate, with a laxative. Agree goals and ceilings of treatment."},
         {n:"2", when:"2 to 3 days", title:"Review the trial", html:"Has breathlessness improved? What are the side effects? Check sedation, cognition, respiratory rate and renal function. Continue only if clear benefit outweighs adverse effects; stop or reduce if there is no meaningful benefit."},
         {n:"3", when:"Each deterioration", title:"Re-look for reversible causes", html:"A new effusion, infection, PE or pulmonary oedema, weighed against the patient's goals."},
         {n:"4", when:"Before the last days", title:"Anticipatory medicines in the house", html:"Individualised anticipatory medicines for likely symptoms prescribed (indication, dose, route, maximum frequency, who administers), carers know the plan, and the out-of-hours team has the care plan."}
       ]},
       {b:"cards", items:[
         {tone:"red", h:"Tell carers: call urgently if", html:"Sudden severe breathlessness, new chest pain or coughing up blood, noisy or high-pitched breathing (stridor), a swollen face or arms, or unusual drowsiness with slow breathing after a medicine dose.", src:"NICE NG31 (2015) · MHRA Drug Safety Update, March 2020"},
         {tone:"amber", h:"Call within a day if", html:"Breathlessness is steadily getting worse despite the plan, a new fever or cough, or side effects from the morphine (sickness, constipation, confusion)."}
       ]},
       {b:"say", html:"When you get a breathless attack: sit forward, use the fan on your face, breathe out slowly through pursed lips, and, if we've agreed it, take the morphine dose on your plan. If it isn't settling after that, or if it comes on suddenly with chest pain or you start coughing blood, ring straight away. Don't wait."}
     ]},

    {id:"refer", nav:"Refer", title:"Refer: who, how quickly, and for what", sub:"Most breathlessness in advanced illness is managed in primary care with the community palliative team. These are the exceptions.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same day: acute oncology or emergency", html:"Stridor, SVCO, suspected tension pneumothorax, massive haemoptysis, or acute pulmonary oedema, where hospital treatment fits the patient's goals.", src:"NICE NG31 (2015)"},
         {tone:"amber", h:"Urgent: respiratory or oncology procedures", html:"Pleural aspiration, pleurodesis or an indwelling catheter for effusion. Stenting or radiotherapy for airway or SVC obstruction."},
         {tone:"cream", h:"Specialist palliative care", html:"Breathlessness that persists despite the fan, an opioid trial and anxiolytics. Opioid intolerance, renal impairment (especially eGFR &lt;30 or rapidly changing), frailty or diagnostic uncertainty. When opioid/benzodiazepine combinations are needed. Known hypercapnia, severe COPD or NIV use. A complex syringe pump. Distress in the last days that is hard to control. People with end-stage COPD should have access to the full range of palliative care services, including hospice admission.", src:"NICE NG115 (2018, updated 2019)"},
         {tone:"cream", h:"Breathlessness services, rehabilitation, and heart failure or COPD teams", html:"Where available, breathlessness support services, pulmonary rehabilitation (for COPD, if the patient is able) and heart failure specialist teams can add a lot. Discuss worsening heart failure symptoms despite optimal treatment with the specialist MDT and consider palliative needs.", src:"NICE NG106 (2018, updated 2025) · NICE NG115 (2018, updated 2019)"},
         {tone:"purple", h:"Lung cancer: urgent chest X-ray first <span class='tw'>Suspected cancer</span> · NICE NG12 (updated April 2026)", html:"Only for a patient <b>without an established diagnosis</b>: offer an <b>urgent, direct-access chest X-ray</b> to people <b>aged 40 and over</b> with <b>2 or more unexplained symptoms</b> from cough, fatigue, shortness of breath, chest pain, weight loss and appetite loss, or <b>1 or more if they have ever smoked</b> (or, for mesothelioma, have been exposed to asbestos). Refer on a suspected cancer pathway if the chest X-ray suggests lung cancer, or for <b>unexplained haemoptysis at 40 or over</b>. In known advanced disease, use the oncology, respiratory or palliative pathway instead.", src:"NICE NG12 (updated April 2026)"}
       ]},
       {b:"say", html:"Being breathless is frightening, and the fear itself makes it worse. So we'll tackle both: the fan and the breathing techniques for the attacks, a trial of a small dose of morphine to see if it takes the edge off the feeling, and something for the panic if you need it. We'll also check for anything we can actually fix, like fluid on the lung."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice case. The <a href='../../cases/palliative-care.html'>palliative care casebook</a> has the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Scenario", html:"A 78-year-old woman with end-stage COPD (FEV₁ 28%) and two admissions this winter. She has been breathless at rest for a month, SpO₂ 93% on air, and is terrified at night. Her son asks for 'home oxygen like the hospital gave her' and says she 'wants to stay home now'.", src:"Practice scenario, built on NICE NG115 and the BTS home oxygen guideline (2015)"},
       {tone:"cream", h:"What the examiner is looking for", html:"Explores what the son means by oxygen and what 'stay home' means for her. Checks for a reversible cause (infection, heart failure, effusion). Explains kindly that SpO₂ 93% on air does not support routine long-term home oxygen, without saying oxygen can never help, and considers whether exertional desaturation has been assessed. Offers the <b>fan and breathing techniques</b>. Offers a <b>monitored trial of low-dose oral morphine</b>, mindful of COPD and hypercapnia risk, with a laxative and a review in 2 to 3 days. Keeps lorazepam for panic and mentions the MHRA opioid–benzodiazepine warning. Starts <b>advance care planning</b> and individualised anticipatory medicines. Offers referral to specialist palliative care.", src:"NICE NG115 · NICE NG31 · MHRA Drug Safety Update, March 2020"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Doses are from the named guideline and are not NICE dose recommendations. Verify prescribing against the local NHS Greater Manchester palliative care guideline, current product information and specialist palliative-care advice.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG31 — Care of dying adults in the last days of life (2015)</b><br><a href="https://www.nice.org.uk/guidance/ng31" rel="noopener">nice.org.uk/guidance/ng31</a><span class="rd"> — identify and treat reversible causes (pulmonary oedema, pleural effusion); consider non-pharmacological management; consider an opioid, a benzodiazepine or both; do not routinely start oxygen, offer it only for known or suspected symptomatic hypoxaemia; individualised anticipatory prescribing</span></li>'+
         '<li><b>NICE QS144 — Care of dying adults in the last days of life (2017)</b>, quality statement 3: anticipatory prescribing<br><a href="https://www.nice.org.uk/guidance/qs144" rel="noopener">nice.org.uk/guidance/qs144</a></li>'+
         '<li><b>NICE NG115 — COPD in over 16s: diagnosis and management (2018, updated 2019)</b><br><a href="https://www.nice.org.uk/guidance/ng115" rel="noopener">nice.org.uk/guidance/ng115</a><span class="rd"> — opioids, when appropriate, for breathlessness in end-stage COPD that has not responded to other treatment; benzodiazepines, tricyclics, major tranquillisers and oxygen when appropriate; access to multidisciplinary palliative care including hospice</span></li>'+
         '<li><b>NICE NG106 — Chronic heart failure in adults (2018, updated September 2025)</b><br><a href="https://www.nice.org.uk/guidance/ng106" rel="noopener">nice.org.uk/guidance/ng106</a><span class="rd"> — do not offer long-term home oxygen for advanced heart failure; specialist MDT discussion and palliative needs assessment when symptoms worsen</span></li>'+
         '<li><b>NICE CG140 — Palliative care for adults: strong opioids for pain relief (2012, updated 2016)</b><br><a href="https://www.nice.org.uk/guidance/cg140" rel="noopener">nice.org.uk/guidance/cg140</a><span class="rd"> — a regular laxative with every strong opioid</span></li>'+
         '<li><b>British Thoracic Society guidelines for home oxygen use in adults (Hardinge et al., Thorax 2015)</b><br><a href="https://www.brit-thoracic.org.uk" rel="noopener">brit-thoracic.org.uk</a><span class="rd"> — no palliative oxygen for patients who are not hypoxaemic or only mildly hypoxaemic, above long-term oxygen thresholds</span></li>'+
         '<li><b>Scottish Palliative Care Guidelines — Breathlessness (Healthcare Improvement Scotland, 2025 update)</b> and <b>Care in the last days of life</b><br><a href="https://rightdecisions.scot.nhs.uk/scottish-palliative-care-guidelines/symptom-management/breathlessness/" rel="noopener">rightdecisions.scot.nhs.uk</a><span class="rd"> — a UK national guideline. Opioids taken 15 to 30 minutes before expected exertion; limited additional benefit above about 30 mg oral morphine/24 h in opioid-naive patients (not an absolute ceiling); 3 or more breakthrough doses in 24 hours should prompt review; lorazepam 500 micrograms SL and midazolam 2 mg SC 4- to 6-hourly as needed; midazolam 2 to 5 mg SC and SC opioid up to hourly in the last days, with advice if 3 or more doses in 4 hours bring little benefit or more than 6 are needed in 24 hours; fan, pursed-lip breathing, positioning</span></li>'+
         '<li><b>MHRA Drug Safety Update, March 2020</b> — Benzodiazepines and opioids: reminder of risk of potentially fatal respiratory depression<br><a href="https://www.gov.uk/drug-safety-update" rel="noopener">gov.uk/drug-safety-update</a></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — urgent direct-access chest X-ray for lung cancer and mesothelioma; suspected cancer pathway referral for haemoptysis at 40 or over. Applies only where there is no established diagnosis</span></li>'+
         '<li><b>Barnes H et al. Opioids for the palliation of refractory breathlessness in adults with advanced disease and terminal illness. Cochrane Database Syst Rev 2016;(3):CD011008</b><span class="rd"> — low-quality evidence of a small benefit</span></li>'+
         '<li><b>Simon ST et al. Benzodiazepines for the relief of breathlessness in advanced malignant and non-malignant diseases in adults. Cochrane Database Syst Rev 2016;(10):CD007354</b><span class="rd"> — no evidence of a beneficial effect</span></li>'+
         '<li><b>Galbraith S et al. Does the use of a handheld fan improve chronic dyspnea? J Pain Symptom Manage 2010;39:831–8</b><span class="rd"> — fan to the face beats fan to the legs</span></li>'+
         '<li><b>Abernethy AP et al. Sustained release morphine for refractory dyspnoea. BMJ 2003;327:523–8</b> · <b>Abernethy AP et al. Effect of palliative oxygen versus room air in relief of breathlessness in patients with refractory dyspnoea. Lancet 2010;376:784–93</b> · <b>Ekström M et al. Effect of regular, low-dose, extended-release morphine on chronic breathlessness in COPD: the BEAMS randomized clinical trial. JAMA 2022;328:2022–32</b></li>'+
         '<li><b>Greater Manchester Medicines Management Group — Palliative Care Pain and Symptom Control Guidelines for Adults (April 2025, review April 2028)</b><br><a href="https://gmmmg.nhs.uk" rel="noopener">gmmmg.nhs.uk</a><span class="rd"> — local palliative formulary for opioid and benzodiazepine selection, starting doses, conversions and renal adjustment</span></li>'+
         '<li><b>BTS guideline for oxygen use in adults in healthcare and emergency settings (O’Driscoll et al., Thorax 2017)</b><br><a href="https://www.brit-thoracic.org.uk" rel="noopener">brit-thoracic.org.uk</a><span class="rd"> — palliative oxygen generally for consistent SpO₂ below about 90% or reported benefit; avoid routine oximetry in a comfortable dying person; hypercapnia risk</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — oral morphine starting dose and interval for breathlessness, opioid conversions, syringe pump doses, renal dosing</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Palliative breathlessness: NICE NG31 and QS144 (last days of life), NG115 (COPD), NG106 (heart failure), CG140 (strong opioids) and NG12 (only where there is no established diagnosis), with the BTS home oxygen guideline (2015), MHRA Drug Safety Update (March 2020) and the Scottish Palliative Care Guidelines (2025). Last-days-of-life recommendations (NG31) are not applied automatically to chronic refractory breathlessness. Check all doses against the NHS Greater Manchester palliative care guidelines, current product information and the BNF before prescribing."
});
