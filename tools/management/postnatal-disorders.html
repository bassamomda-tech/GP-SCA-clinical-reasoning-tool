MG.render({
  icon:"👶",
  title:"Postnatal disorders — the complete guide",
  eyebrow:"Protocol · NICE NG194 · CG192 · NG255 · NG133 · the unwell postnatal woman can deteriorate faster than she looks",
  stemTitle:"At every postnatal contact, consider potentially serious infection, haemorrhage, thromboembolism, hypertensive disease and acute mental illness, as well as common physical and feeding problems",
  stemSub:"One page for the whole postnatal period. The safety half first: sepsis (including Group A streptococcal infection, which may present with little visible tissue change), VTE, haemorrhage, hypertensive disease and acute mental illness can all present as a woman who is simply “not quite right”, and fever alone neither rules sepsis in nor out. Then the assessment that finds what is missed: EPDS or PHQ-9 within a clinical assessment with <b>question 10 asked out loud</b>, baby blues separated from postnatal depression, postpartum thyroiditis considered when features suggest it, and the physical recovery nobody asks about — perineum, pelvic floor, continence, anaemia, diastasis. <b>If starting an SSRI during breastfeeding, sertraline or paroxetine are commonly preferred; do not switch a woman who is stable on another antidepressant solely because she is breastfeeding.</b>",
  guideline:"NICE NG194 (2021) · NICE CG192 (2014, updated 2020) · NICE NG255 (2025) · NICE NG133 (2019, updated 2023) · RCOG GTG 64 and 37b · BSH · Greater Manchester antimicrobial guidelines · MBRRACE-UK",
  reviewed:"13 September 2026",
  nextReview:"13 March 2027",
  meta:[
    {t:"NICE CG192 — antenatal &amp; postnatal mental health"},
    {t:"NICE NG194 — postnatal care"},
    {t:"NICE NG255 — sepsis risk window 6 weeks after birth", tone:"tw"},
    {t:"Invasive GAS — notify the local UKHSA HPT", tone:"tw"},
    {t:"v1.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#safety"><b>Red flags</b><small>Sepsis · VTE · PPH · BP · psychosis</small></a><a href="#mental"><b>Mental health</b><small>EPDS · Q10 · SSRI</small></a><a href="#physical"><b>Physical</b><small>Perineum · floor · anaemia</small></a><a href="#feeding"><b>Feeding</b><small>Mastitis · latch</small></a><a href="#check"><b>6–8-week review</b><small>Mother and baby</small></a></div>',
  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Suspected sepsis — do not rely on fever alone", html:"A woman who has given birth within the previous 6 weeks (or had a termination, miscarriage or ectopic pregnancy) and appears systemically unwell, deteriorates rapidly, or has suspected infection requires urgent face-to-face assessment. Assess temperature, pulse, respiratory rate, blood pressure, oxygen saturation, mental state, perfusion, pain, bleeding, lochia, wounds, breasts, urine and possible source, and risk-stratify using clinical assessment and an appropriate early warning system (NICE NG255). If high-risk criteria are present, arrange emergency transfer, pre-alert the receiving service and follow the current local maternity/acute sepsis antimicrobial protocol — do not delay transfer to give a complex IV regimen in general practice. Group A streptococcal infection may present with relatively little visible tissue change; severe pain out of proportion to the findings should raise concern for necrotising infection. Notify the local UKHSA Health Protection Team according to current notification arrangements when invasive GAS is suspected or confirmed."},
    {tone:"red", h:"⚠ Postpartum psychosis is a psychiatric emergency", html:"New psychotic symptoms, confusion, grandiosity, labile mood or severe agitation — usually within 2 weeks of delivery, but possible later in the first postnatal year. Arrange immediate specialist perinatal mental-health assessment, ideally within 4 hours (NICE CG192). Command hallucinations about harming the baby or herself are a genuine risk: assess the safety of BOTH mother and infant immediately. 999 if there is immediate danger; if inpatient care is needed, admission to a Mother and Baby Unit should normally be offered where clinically appropriate. If she refuses and lacks capacity or poses a risk → urgent Mental Health Act assessment. Risk factors: bipolar disorder, previous PP, family history of PP."},
    {tone:"amber", h:"VTE — a leading cause of direct maternal death", html:"VTE has been a leading cause of direct maternal death in recent MBRRACE-UK reports; risk is substantially increased in pregnancy and is particularly high postpartum. Suspected DVT or PE requires same-day urgent assessment — 999 for suspected PE with significant breathlessness, chest pain, hypoxia, collapse or haemodynamic instability. <b>Do not use a normal D-dimer or a Wells score alone to exclude VTE postnatally</b>; arrange objective imaging and specialist assessment via the local acute VTE pathway. Check whether thromboprophylaxis was risk-assessed at delivery. LMWH is compatible with breastfeeding (RCOG GTG 37b)."},
    {tone:"blue", h:"EPDS — and ask question 10 out loud", html:"Use the EPDS, PHQ-9 or another validated tool as part of a clinical assessment, not as a diagnostic test. A high score, deterioration, functional impairment, suicidal ideation, psychotic symptoms or concern from the woman or family should prompt timely clinical assessment — a score of 10 or 13 does not automatically determine referral or treatment. Question 10 asks about self-harm — never score it silently from a form. Ask it, and ask directly about thoughts of harming the baby, intent, plan, preparation and access to means, ability to care safely for the baby, and psychosis, mania, severe agitation or loss of reality testing. Postnatal depression affects roughly 10–15% of mothers; baby blues is transient tearfulness at days 3–5 that resolves within 2 weeks and needs reassurance, not treatment."},
    {tone:"green", h:"SSRIs when breastfeeding — sertraline or paroxetine commonly preferred", html:"If starting an SSRI during breastfeeding, sertraline or paroxetine are commonly preferred because of lower milk transfer and shorter half-lives (SPS). Do not switch a woman who is stable and responding well to another antidepressant solely because she is breastfeeding. Fluoxetine may be used in selected circumstances but has a longer half-life and requires infant monitoring, particularly in neonates or preterm infants. Monitor the infant for sedation, irritability, poor feeding, sleep disturbance, diarrhoea and inadequate weight gain. Never let \"I'm breastfeeding\" become a reason to leave depression untreated — that is the commonest harm in this consultation."},
    {tone:"purple", h:"🟣 Safeguarding and the statutory duties", html:"Ask routinely about domestic abuse — it starts or escalates in pregnancy and the postnatal period — and about the baby's wellbeing and feeding. Assess immediate safety, intent, capacity, supervision, domestic abuse, coercive control, the infant's wellbeing and the availability of safe support. Make safeguarding referrals in accordance with local children's safeguarding procedures where there is actual or likely significant harm, inability to care safely, domestic abuse affecting the child, or other safeguarding concern, and document the rationale. Intrusive harm thoughts without intent do not automatically require a children's social care referral. <b>Notify the local UKHSA Health Protection Team when invasive GAS is suspected or confirmed, and follow UKHSA advice on infection control and close contacts.</b> Record both the enquiry and the answer."}
  ],
  pathwaySub:"Five steps. The first is a safety screen that runs at every postnatal contact.",
  pathway:[
    {title:"Ask about the red flags at every contact", html:"“How are you physically and emotionally?” · fever, shivering, offensive discharge, worsening pain or wound symptoms · bleeding and clots · breathlessness, chest pain, unilateral leg pain or swelling · severe headache, visual symptoms or epigastric pain · breast pain, redness or feeding problems · bladder and bowel function · perineal or caesarean wound · mood, anxiety, intrusive thoughts, suicidal thoughts and psychosis · domestic abuse and the baby's wellbeing.", alert:true},
    {title:"Classify what you are dealing with", html:"Physical (perineum, continence, anaemia, hypertension, thyroid, breast) · psychological (baby blues, PND, anxiety, birth-trauma PTSD, psychosis) · infant feeding (latch, tongue tie, supply, mastitis). Most women have something from more than one column."},
    {title:"Screen mood properly", html:"Whooley questions, then EPDS or PHQ-9 within a clinical assessment, with question 10 asked aloud, and direct questions about thoughts of harming the baby. Consider TSH and free T4 when symptoms suggest thyroid disease — do not delay mental-health assessment or treatment while awaiting TFTs."},
    {title:"Treat, with breastfeeding in the decision not as a veto", html:"SSRI for PND (sertraline or paroxetine commonly preferred if starting); conservative care for inflammatory mastitis, antibiotics per the local guideline if bacterial, with feeding continued; oral iron for confirmed iron-deficiency anaemia; paracetamol and ibuprofen with saline washing for the perineum; pelvic floor physiotherapy for continence."},
    {title:"Safety-net the whole family and review", html:"Emergency and same-day safety-net advice given verbally. Review mood and recovery, confirm the baby is thriving, and complete the 6–8-week GP review including contraception."}
  ],
  sections:[

    {id:"safety", nav:"Red flags", title:"Red flags — the postnatal emergencies",
     sub:"A postnatal woman who is “not quite right” is an emergency assessment, not a telephone reassurance.",
     blocks:[
       {b:"table", head:["Presentation","Diagnosis","Action"], rows:[
         ["Systemically unwell, rapid deterioration or suspected infection (fever, shivering, offensive lochia, uterine tenderness, wound or breast infection, urinary symptoms) — within 6 weeks of birth, termination, miscarriage or ectopic pregnancy. Fever alone does not rule sepsis in or out","Possible maternal sepsis. Group A Streptococcus may present with relatively little visible tissue change; severe pain out of proportion to examination findings suggests necrotising infection","Urgent face-to-face structured assessment: temperature, pulse, respiratory rate, BP, oxygen saturation, mental state, perfusion and possible source; risk-stratify with clinical assessment and an appropriate early warning system (NICE NG255). <b>High-risk criteria → emergency transfer with pre-alert</b>; IV broad-spectrum antibiotics within 1 hour in acute care per the current local maternity/acute sepsis antimicrobial protocol — do not delay transfer to give them in general practice. Notify the local UKHSA Health Protection Team when invasive GAS is suspected or confirmed"],
         ["Calf pain, unilateral leg swelling, breathlessness, chest pain, tachycardia — postnatally","VTE — a leading cause of direct maternal death in recent MBRRACE-UK reports; risk is particularly high postpartum","<b>999 for suspected PE with significant breathlessness, chest pain, hypoxia, collapse or haemodynamic instability; otherwise same-day urgent assessment.</b> Do not use a normal D-dimer or a Wells score alone to exclude VTE postnatally; arrange objective imaging and specialist assessment. If clinical suspicion is high, treatment-dose LMWH may be started in secondary care or according to the local acute VTE pathway, after assessment of bleeding risk; LMWH is compatible with breastfeeding. <b>Check whether thromboprophylaxis was risk-assessed at delivery</b>"],
         ["Severe, persistent or atypical headache, especially with hypertension, visual disturbance, neurological symptoms, seizure, altered consciousness or papilloedema — postnatally (do not restrict concern to exactly 6 weeks)","<b>Postpartum pre-eclampsia/eclampsia, cerebral venous sinus thrombosis, intracranial haemorrhage, meningitis or post-dural-puncture headache</b>","<b>Same-day emergency assessment; 999 for seizure, altered consciousness or suspected eclampsia.</b> Imaging and magnesium sulphate are specialist-hospital decisions. BP ≥160/110 mmHg, severe headache, visual symptoms, epigastric/right-upper-quadrant pain, dyspnoea, confusion, seizure or abnormal blood tests → same-day maternity/acute assessment (NICE NG133)"],
         ["New psychotic symptoms, confusion, grandiosity, labile mood, severe agitation — typically within 2 weeks","Postpartum psychosis — usually within 2 weeks, but possible later in the first postnatal year","Immediate specialist perinatal mental-health assessment, ideally within 4 hours; 999 if there is immediate danger or inability to maintain safety. If inpatient care is needed, a Mother and Baby Unit should normally be offered where clinically appropriate. Assess the safety of mother AND baby immediately — command hallucinations about infanticide or suicide are a real risk. Urgent Mental Health Act assessment if she refuses and lacks capacity or poses a risk"],
         ["Sudden heavy bleeding, increasing bleeding after it had settled, large clots, syncope, dizziness, tachycardia, hypotension, severe abdominal pain, fever or offensive lochia","Secondary PPH — retained products, endometritis, subinvolution, trauma or coagulopathy","Urgent assessment. <b>If haemodynamically unstable or actively haemorrhaging: 999, IV access if trained, and the local major-haemorrhage pathway.</b> If stable but bleeding is abnormal or persistent: same-day obstetric/gynaecology assessment. Uterotonics are not part of this GP pathway, and ultrasound must not delay resuscitation or specialist assessment"],
         ["Breast pain, redness or swelling, with or without fever or flu-like symptoms, in a breastfeeding woman","<b>Mastitis — most lactational mastitis is initially inflammatory rather than bacterial; a fluctuant or persistent mass suggests abscess</b>","Assess feeding, latch, nipple damage, breast drainage and systemic illness. Inflammatory mastitis: analgesia, rest, hydration, cold packs and continued breastfeeding or gentle milk removal. Suspected bacterial mastitis, severe or systemic symptoms, or no improvement after 24–48 hours: antibiotic per the current local (Greater Manchester) antimicrobial guideline, and review. <b>Suspected abscess → urgent breast assessment and ultrasound</b>"],
         ["Thoughts of harming the baby where intent or reality testing is uncertain, or a mother unable to care safely for her infant","<b>Possible risk to the child</b>","Same-day perinatal mental health assessment. Assess immediate safety, intent, capacity, supervision, domestic abuse and safe support; make a safeguarding referral under local children's safeguarding procedures where there is actual or likely significant harm or inability to care safely, and document the rationale. Intrusive thoughts without intent do not automatically require a social care referral"]
       ]},
       {b:"warn", html:"The single most important judgement on this page is the threshold for same-day assessment. Early sepsis, including GAS infection, may present with little visible change and a woman who says she feels wrong, and fever may be absent — deterioration can be rapid. The same applies in reverse to postpartum psychosis: a mother describing intrusive thoughts about her baby is often terrified to say so, and the window to ask is the consultation you are in."},
       {b:"dl", rows:[
         ["<b>999 / emergency assessment</b>","Suspected PE with significant breathlessness, chest pain, hypoxia, collapse or haemodynamic instability · severe or ongoing haemorrhage, collapse or shock · suspected sepsis with high-risk features or rapid deterioration · seizure, altered consciousness or suspected eclampsia · postpartum psychosis, severe agitation, confusion or immediate risk to mother or baby · severe hypertension, especially BP ≥160/110 mmHg, with symptoms or abnormal findings"],
         ["<b>Same-day clinical assessment</b>","Persistent fever or feeling systemically unwell · worsening uterine, abdominal, perineal or wound pain · offensive discharge or increasing bleeding · suspected DVT · severe headache or visual symptoms · breast inflammation not improving with self-care · urinary retention · active suicidal ideation without immediate emergency features · concerning intrusive thoughts where intent or reality testing is uncertain"]
       ]}
     ]},

    {id:"mental", nav:"Mental health", title:"Postnatal mental health",
     sub:"Separating the transient from the serious, and prescribing without stopping breastfeeding.",
     blocks:[
       {b:"table", head:["Condition","Recognising it","Management"], rows:[
         ["<b>Baby blues</b>","Transient tearfulness and mood lability at days 3–5, resolving spontaneously within 2 weeks. Not a disorder","Reassurance, practical support and sleep where possible — no treatment. Say explicitly that it is expected and self-limiting, and arrange a check rather than discharging the concern"],
         ["<b>Postnatal depression — roughly 10–15% of mothers</b>","Low mood beyond 2 weeks, going past baby blues; anhedonia, guilt, poor bonding, sleep disturbance beyond the baby's demands. EPDS or PHQ-9 supports, but does not replace, clinical assessment — no single score is diagnostic","Mild: NHS Talking Therapies, guided self-help, practical and peer support. Moderate to severe: SSRI plus psychological therapy — sertraline or paroxetine commonly preferred if starting while breastfeeding; consider previous response. Review at 2 weeks, then 4–6 weeks"],
         ["<b>EPDS question 10 — self-harm</b>","<b>Ask it out loud; never score it silently off a form.</b> Ask separately about thoughts of harming the baby","Any active ideation with intent or plan → same-day crisis or perinatal mental health assessment. Intrusive thoughts without intent are common and frightening — name them and explain the difference"],
         ["<b>Perinatal OCD — the distinction that changes the response</b>","Intrusive thoughts of harming the baby that are EGO-DYSTONIC: the mother is horrified by them, resists them, and is terrified to disclose them. Often with checking, washing or avoidance of the baby","This is anxiety, not psychosis, and it is treatable — SSRI (sertraline) plus CBT with exposure and response prevention; intrusive, unwanted thoughts can occur in postpartum anxiety/OCD and do not by themselves indicate intent to harm. Assess whether the thoughts are unwanted, resisted and associated with avoidance or checking. However, any uncertainty about reality testing, intent, judgement, command hallucinations, severe agitation, confusion or inability to care safely for the infant requires urgent specialist assessment — postpartum psychosis may present with rapidly changing mood, confusion, disorganisation, delusions, hallucinations or impaired judgement, and the woman may not reliably describe her thoughts. Do not reassure solely because she says the thoughts are intrusive"],
         ["<b>Already on lithium or an antipsychotic</b>","A woman established on treatment for bipolar disorder or a previous psychosis","Never stop lithium or switch abruptly without specialist input — abrupt discontinuation markedly raises relapse risk at the highest-risk time. Perinatal psychiatry advice for any complex regimen; optimise rather than change, and check lithium monitoring is in place"],
         ["<b>Anxiety disorders and birth-trauma PTSD</b>","Generalised anxiety, panic, health anxiety about the baby, or PTSD from a traumatic birth — intrusive memories, avoidance of maternity settings, hypervigilance","<b>Psychological therapy; trauma-focused CBT or EMDR for PTSD.</b> A birth debrief with the maternity team is often what the woman actually wants"],
         ["<b>Postpartum psychosis</b>","<b>See the red flags — a psychiatric emergency</b>","<b>Immediate specialist perinatal assessment, ideally within 4 hours; Mother and Baby Unit normally offered if admission is needed.</b> <b>Never manage at home alone</b>"],
         ["<b>Postpartum thyroiditis masquerading as PND</b>","Hyperthyroid phase then hypothyroid: fatigue, weight gain, cold intolerance and low mood with a raised TSH — frequently mistaken for depression","Consider TSH and free T4 when symptoms suggest thyroid disease — marked fatigue, weight change, heat or cold intolerance, palpitations, tremor, goitre, persistent symptoms despite appropriate treatment, or relevant thyroid history. Do not delay mental-health assessment or treatment while awaiting TFTs. Ongoing thyroid follow-up per the <a href='hypothyroidism.html'>thyroid pathway</a>"],
         ["<b>Previous severe mental illness or bipolar disorder</b>","<b>The highest-risk group for postpartum psychosis</b>","Pre-birth planning with perinatal mental health, and a low threshold for specialist involvement postnatally. Do not wait for symptoms"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"💊 SSRI choice while breastfeeding", html:"If starting an SSRI during breastfeeding, sertraline or paroxetine are commonly preferred (lower milk transfer, shorter half-lives). Do not switch a woman who is stable and responding well to another antidepressant solely because she is breastfeeding. Fluoxetine may be used in selected circumstances but has a longer half-life and needs infant monitoring, particularly in neonates or preterm infants. Monitor the infant for sedation, irritability, poor feeding, sleep disturbance, diarrhoea and inadequate weight gain. Review at 2 weeks; duration of treatment is individualised per NICE depression guidance (NG222: usually at least 6 months after remission)."},
         {tone:"amber", h:"⚠ The commonest harm is under-treatment", html:"\"I don't want to take anything because I'm breastfeeding\" ends more consultations than it should. Untreated maternal depression has measurable effects on infant development and on the mother's safety — effective options generally compatible with breastfeeding exist, and saying so plainly is the intervention."},
         {tone:"blue", h:"📋 Referral thresholds", html:"Perinatal mental health service: moderate to severe PND, any history of severe mental illness, bipolar disorder, previous postpartum psychosis, or poor response to first-line treatment. <b>Crisis or MBU: psychosis, active suicidality, or risk to the infant.</b>"},
         {tone:"green", h:"🤝 What actually helps alongside", html:"Health visitor support, sleep protection where any is possible, partner and peer support, local groups, and breastfeeding support. <b>Treat the anaemia and the pain</b> — exhaustion and unrelieved perineal pain look a great deal like depression."}
       ]}
     ]},

    {id:"physical", nav:"Physical", title:"Physical recovery — the part nobody asks about",
     blocks:[
       {b:"table", head:["Problem","Management"], rows:[
         ["<b>Perineal pain, wound breakdown, infection or haematoma</b>","Paracetamol plus ibuprofen, saline washing, and inspection — do not manage perineal pain without looking. Refer wound breakdown or suspected infection to the maternity or perineal clinic"],
         ["<b>Postnatal anaemia</b>","Check FBC promptly after significant PPH (blood loss over 500 mL), uncorrected antenatal anaemia, or symptoms such as fatigue, dizziness, palpitations or breathlessness. Consider ferritin if iron deficiency is uncertain, there is inflammation, haemoglobinopathy, persistent anaemia or poor response — it is not needed in every woman. <b>Stable, asymptomatic or mildly symptomatic Hb below 100 g/L: oral elemental iron 40–80 mg daily</b>; repeat Hb after 2–3 weeks and continue for at least 3 months after correction, per the BSH/local pathway. Consider IV iron or specialist review for intolerance, poor response, severe symptoms or need for rapid correction. <b>Active bleeding, haemodynamic compromise or severe symptomatic anaemia → urgent obstetric assessment, not oral iron.</b> Fatigue, palpitations and breathlessness are frequently attributed to new motherhood when the haemoglobin explains them"],
         ["<b>Urinary symptoms — stress incontinence, urgency, retention</b>","Pelvic floor physiotherapy referral, which is effective and under-used. Retention needs same-day assessment. See <a href='female-urinary-incontinence.html'>female urinary incontinence</a>"],
         ["<b>Diastasis recti</b>","Separation of the rectus abdominis — abdominal bulge, back pain, core weakness. Physiotherapy-led core rehabilitation, not abdominal crunches"],
         ["<b>Postnatal hypertension</b>","Confirm the BP and assess symptoms of pre-eclampsia. BP ≥160/110 mmHg, severe headache, visual symptoms, epigastric/right-upper-quadrant pain, dyspnoea, confusion, seizure or abnormal blood tests → same-day maternity/acute assessment. For women with gestational hypertension or pre-eclampsia not already on treatment, consider starting antihypertensive treatment at BP ≥150/100 mmHg (NICE NG133 and local maternity advice); target below 140/90 mmHg. Enalapril, with renal function and potassium monitoring; nifedipine (or amlodipine if previously effective) for women of Black African or Caribbean family origin; nifedipine/amlodipine plus enalapril if monotherapy is inadequate. Symptoms at any stage should prompt assessment; routine postnatal BP follow-up depends on the woman's circumstances"],
         ["<b>Thyroid dysfunction</b>","Postpartum thyroiditis or a Hashimoto's flare — consider TSH and free T4 when symptoms suggest thyroid disease (marked fatigue, weight change, heat or cold intolerance, palpitations, tremor, goitre, relevant thyroid history). Follow-up after postpartum thyroiditis per the <a href='hypothyroidism.html'>thyroid pathway</a>"],
         ["<b>Constipation, haemorrhoids and pelvic girdle pain</b>","Laxatives (breastfeeding-compatible), topical treatment, physiotherapy. Small problems that dominate the day and are rarely volunteered"],
         ["<b>Contraception</b>","<b>Address it at the 6–8-week review at the latest — sooner if asked.</b> See <a href='contraception.html'>contraception</a>, including the postpartum and breastfeeding rules"]
       ]}
     ]},

    {id:"feeding", nav:"Feeding", title:"Infant feeding difficulties",
     blocks:[
       {b:"table", head:["Problem","What to do"], rows:[
         ["<b>Mastitis and blocked duct</b>","Assess feeding, latch, nipple damage, breast drainage and systemic illness. Uncomplicated inflammatory mastitis: analgesia, rest, hydration, cold packs/comfort measures and continued breastfeeding or gentle milk removal; avoid excessive breast massage or over-pumping. If bacterial mastitis is suspected, symptoms are severe or systemic, or there is no improvement after 24–48 hours: prescribe per the current local antimicrobial guideline (flucloxacillin is compatible with breastfeeding; give infant monitoring advice where appropriate) and review; breastfeeding can usually continue. Refer if redness or swelling persists beyond 24 hours despite self-management (NICE NG194). <b>Suspected abscess → urgent breast assessment and ultrasound</b>; drainage is usually image-guided aspiration or another specialist procedure, not automatically open surgery, with aspirate sent for culture. A breast lump or inflammatory change that does not resolve needs breast assessment to exclude malignancy or other pathology"],
         ["<b>Nipple pain</b>","Assess the latch first — it is the commonest cause. Then consider candida, dermatitis or Raynaud's of the nipple"],
         ["<b>Poor latch, low supply, tongue tie</b>","Breastfeeding support and infant feeding team. Assess feeding, positioning, attachment, milk transfer, infant weight and nappies. Refer for specialist tongue-tie assessment only where ankyloglossia is clinically significant and breastfeeding remains impaired despite skilled support"],
         ["<b>Persistent projectile non-bilious vomiting at around 3–6 weeks</b>","Possible pyloric stenosis — urgent paediatric assessment, not a reflux diagnosis; a palpable “olive” is not required. <b>Bilious vomiting is an emergency</b>"],
         ["<b>Reflux with arching, regurgitation and poor weight gain</b>","Assess weight and feeding; see <a href='../algorithms/vomiting-children.html'>vomiting in children</a> and <a href='cmpa.html'>CMPA</a> where symptoms suggest cow's milk protein allergy"],
         ["<b>Neonatal jaundice</b>","See <a href='../algorithms/neonatal-jaundice.html'>the neonatal jaundice pathway</a> and NICE CG98 — jaundice under 24 hours old needs urgent assessment; prolonged jaundice (more than 14 days in term infants, more than 21 days in preterm infants) needs assessment for conjugated hyperbilirubinaemia, including asking about pale stools and dark urine"]
       ]}
     ]},

    {id:"check", nav:"6–8-week review", title:"The 6–8-week GP postnatal review — and the review after it",
     blocks:[
       {b:"table", head:["Component","Detail"], rows:[
         ["<b>Mother — open questioning and mental health</b>","Open questions about physical and emotional recovery; mood and anxiety (Whooley, then EPDS or PHQ-9 within clinical assessment, with question 10 asked aloud), bonding, fatigue, sleep and nutrition, birth experience and any trauma, domestic abuse and safeguarding"],
         ["<b>Mother — physical</b>","Pain and fatigue · vaginal bleeding and discharge · perineal or caesarean wound healing · urinary and bowel function · pelvic floor symptoms · breast and feeding problems · sexual function · BP where clinically indicated or where there was hypertensive disease · FBC where there was PPH, antenatal anaemia or symptoms · TFTs if clinically indicated"],
         ["<b>Mother — planning</b>","Contraception and future pregnancy plans, cervical screening status, ongoing conditions such as gestational diabetes or hypertension, medication review and breastfeeding, immunisations, and referral and follow-up plans for any ongoing problem"],
         ["<b>Baby</b>","Feeding, weight and growth, the NIPE newborn examination findings, immunisation schedule, and any parental concern. Maternal and infant checks may be provided by different appropriately trained clinicians according to local arrangements"],
         ["<b>Safety-net</b>","<b>The emergency and same-day criteria for psychosis, sepsis, haemorrhage, VTE and hypertension, given verbally.</b> Follow-up interval for anything unresolved — the check is not a discharge"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 999 — say these out loud", html:"\"Call 999 if you feel very unwell or are getting rapidly worse, with or without a temperature; sudden heavy bleeding, large clots, or feeling faint or dizzy; sudden breathlessness or chest pain; a fit or severe headache with changes in vision; or sudden confusion, racing thoughts, or feeling unable to keep yourself or the baby safe.\""},
         {tone:"amber", h:"🟠 Contact us the same day", html:"Feeling \"not right\" or a persistent temperature · a wound or tummy becoming more painful, red or discharging · smelly discharge or bleeding increasing again · a painful swollen calf · a severe headache or visual change · a red, painful breast not improving with self-care · unable to pass urine · low mood getting worse, thoughts of suicide, or frightening thoughts about the baby."},
         {tone:"green", h:"✓ Normalise asking", html:"\"A lot of women have thoughts that frighten them in the first weeks, and telling me about them is the right thing to do — it does not mean anyone will take your baby away.\" Said early, this is what makes disclosure possible."},
         {tone:"blue", h:"📅 Review, not discharge", html:"Any unresolved mood, continence, pain or feeding problem gets a named interval and a named person. The 6-week check is a waypoint."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999 / emergency", html:"Suspected sepsis with high-risk features or rapid deterioration · suspected PE with significant breathlessness, chest pain, hypoxia, collapse or instability · seizure, altered consciousness or suspected eclampsia · severe or ongoing haemorrhage, collapse or shock · severe hypertension (BP ≥160/110 mmHg) with symptoms or abnormal findings · postpartum psychosis, severe agitation, confusion or immediate risk to mother or baby."},
         {tone:"amber", h:"Same-day perinatal mental health / crisis", html:"Postpartum psychosis (assessment ideally within 4 hours), active suicidal ideation, thoughts of harming the baby where intent or reality testing is uncertain, or rapid deterioration in mood. If admission is needed, a Mother and Baby Unit should normally be offered where clinically appropriate. Use the local perinatal mental-health crisis pathway (NHS 111, mental health option, out of hours)."},
         {tone:"purple", h:"🟣 Safeguarding — a statutory duty", html:"Assess immediate safety, intent, capacity, supervision, domestic abuse, coercive control, the infant's wellbeing and safe support. Refer under the local Bolton/Greater Manchester children's safeguarding procedures where there is actual or likely significant harm, inability to care safely, domestic abuse affecting the child, a non-thriving infant or other safeguarding concern — document the rationale. <b>Notify the local UKHSA Health Protection Team (<a href='https://www.gov.uk/health-protection-team' rel='noopener'>find your local HPT</a>) when invasive GAS is suspected or confirmed, and follow UKHSA infection-control and close-contact advice.</b>"},
         {tone:"blue", h:"Perinatal mental health service", html:"Moderate to severe PND, any history of severe mental illness or bipolar disorder, previous postpartum psychosis, or inadequate response to first-line treatment."},
         {tone:"blue", h:"Maternity / obstetrics", html:"Via the local maternity triage/obstetric referral route: perineal wound breakdown, abnormal or persistent bleeding in a stable woman (same day), suspected retained products, endometritis, or a birth debrief."},
         {tone:"green", h:"Physiotherapy and support services", html:"Pelvic floor physiotherapy for continence, core rehabilitation for diastasis, infant feeding team, health visitor, and local peer support groups."},
         {tone:"cream", h:"GP management", html:"The structured assessment, the mood assessment and SSRI, inflammatory mastitis, anaemia, perineal care, targeted thyroid testing, hypertension follow-up, contraception and the 6–8-week review are all primary care. Antibiotic choice per the <a href='https://gmmmg.nhs.uk' rel='noopener'>Greater Manchester antimicrobial guidelines</a>. Related pages: <a href='postnatal-depression.html'>postnatal depression</a> · <a href='contraception.html'>contraception</a> · <a href='female-urinary-incontinence.html'>female urinary incontinence</a> · <a href='cmpa.html'>CMPA</a>."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 31-year-old woman attends <b>5 weeks</b> after a forceps delivery, brought forward by the health visitor with an <b>EPDS of 16</b>. She is exhausted, tearful, says she \"can't feel anything\" for the baby, and is <b>breastfeeding</b>. She mentions intrusive thoughts about dropping the baby, which frighten her. She has a <b>painful perineum</b>, is leaking urine, and her <b>haemoglobin after a 900 mL PPH was never rechecked</b>. She asks whether she has to stop breastfeeding to take tablets."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Asks EPDS question 10 aloud and asks separately about thoughts of harming the baby — then distinguishes intrusive thoughts without intent from psychosis and command hallucinations, and says so in a way that reduces her fear rather than increasing it; <b>screens for the physical emergencies</b> (sepsis, VTE, PPH); prescribes sertraline (or paroxetine), states explicitly that she can continue breastfeeding, and gives infant monitoring advice; <b>rechecks the FBC after the 900 mL PPH and treats any iron-deficiency anaemia</b>, recognising exhaustion as possibly partly haematological; <b>examines the perineum rather than prescribing blindly</b>; <b>refers for pelvic floor physiotherapy</b>; <b>considers TFTs if features suggest thyroid disease</b>; does not rely on the EPDS of 16 alone; <b>enquires about domestic abuse and the baby's wellbeing</b>; <b>refers to perinatal mental health given the severity</b>; offers a <b>birth debrief</b> after a forceps delivery; and <b>gives the 999 safety-net verbally.</b>"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Key recommendations are linked to named sources. Verify every medication dose against the BNF, SmPC and local formulary before prescribing.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>NICE CG192 — Antenatal and postnatal mental health: clinical management and service guidance (2014, updated 2020)<br><a href="https://www.nice.org.uk/guidance/cg192" rel="noopener">nice.org.uk/guidance/cg192</a><span class="rd"> — EPDS or PHQ-9 as part of a full assessment (no single diagnostic threshold), antidepressant choice considering previous response and the risks of switching, the benefit–risk discussion when prescribing in breastfeeding, immediate assessment of suspected postpartum psychosis, and the perinatal mental health referral thresholds</span></li>'+
         '<li><b>NICE NG194 — Postnatal care (2021)</b><br><a href="https://www.nice.org.uk/guidance/ng194" rel="noopener">nice.org.uk/guidance/ng194</a><span class="rd"> — the current core postnatal-care guideline (replacing CG37): assessment at every contact for infection, pain, bleeding/discharge, bladder and bowel function, breast symptoms, VTE, anaemia and pre-eclampsia symptoms; the 6–8-week GP review; infant feeding support; referral if breast redness or swelling persists beyond 24 hours; continued breastfeeding in mastitis</span></li>'+
         '<li><b>MBRRACE-UK — Saving Lives, Improving Mothers\u2019 Care (2025 report, 2021\u201323 data)</b><br><a href="https://www.npeu.ox.ac.uk/mbrrace-uk/reports" rel="noopener">npeu.ox.ac.uk/mbrrace-uk/reports</a><span class="rd"> — VTE as a leading cause of direct maternal death during or up to 6 weeks after pregnancy in this reporting period, the sepsis and haemorrhage findings, and the recurring theme of delayed recognition in women who initially appear mildly unwell</span></li>'+
         '<li>NICE NG255 — Suspected sepsis in pregnant or recently pregnant people: recognition, diagnosis and early management (November 2025)<br><a href="https://www.nice.org.uk/guidance/ng255" rel="noopener">nice.org.uk/guidance/ng255</a><span class="rd"> — face-to-face structured assessment; risk stratification with clinical assessment and an appropriate early warning system (NEWS2 is not recommended for pregnant or recently pregnant people); people who have given birth within the previous 6 weeks as a high-risk group; emergency transfer for high-risk criteria; IV broad-spectrum antibiotics within 1 hour in acute care per local antimicrobial guidance</span></li>'+
         '<li><b>RCOG Green-top Guideline No. 64 — Identification and management of maternal sepsis during and following pregnancy (BJOG, 2024)</b><br><a href="https://www.rcog.org.uk/guidance/browse-all-guidance/green-top-guidelines/identification-and-management-of-maternal-sepsis-during-and-following-pregnancy-green-top-guideline-no-64/" rel="noopener">doi.org/10.1111/1471-0528.18009</a><span class="rd"> — GAS infection may present with little visible tissue change; pain out of proportion to findings suggests necrotising infection</span></li>'+
         '<li><b>RCOG Green-top Guideline No. 37b — Thrombosis and embolism during pregnancy and the puerperium: acute management (2015)</b><br><a href="https://www.rcog.org.uk" rel="noopener">rcog.org.uk</a><span class="rd"> — objective imaging for suspected VTE; LMWH and warfarin are not contraindicated in breastfeeding</span></li>'+
         '<li><b>UKHSA — Group A streptococcal infections: guidance and data</b> and the <b>Health Protection (Notification) Regulations 2010</b><br><a href="https://www.gov.uk/government/collections/group-a-streptococcus" rel="noopener">gov.uk</a><span class="rd"> — notify the local Health Protection Team according to current arrangements when invasive GAS is suspected or confirmed; infection-control and close-contact advice</span></li>'+
         '<li><b>Greater Manchester Antimicrobial Guidelines</b><br><a href="https://gmmmg.nhs.uk" rel="noopener">gmmmg.nhs.uk</a><span class="rd"> — most lactational mastitis is not infectious: analgesia, rest, fluids and effective milk removal first; antibiotic choice, dose and duration when clinically indicated</span></li>'+
         '<li><b>NICE CG98 — Jaundice in newborn babies under 28 days</b><br><a href="https://www.nice.org.uk/guidance/cg98" rel="noopener">nice.org.uk/guidance/cg98</a><span class="rd"> — prolonged jaundice and assessment for conjugated hyperbilirubinaemia</span></li>'+
         '<li><b>NICE NG133 \u2014 Hypertension in pregnancy: diagnosis and management (2019, updated 2023)</b><br><a href="https://www.nice.org.uk/guidance/ng133" rel="noopener">nice.org.uk/guidance/ng133</a><span class="rd"> — start treatment at 150/100 mmHg in women with gestational hypertension or pre-eclampsia not already on treatment; target below 140/90 mmHg; enalapril with renal function and potassium monitoring; nifedipine or amlodipine for women of Black African or Caribbean family origin; combination if monotherapy is inadequate; urgent assessment for severe hypertension (generally 160/110 mmHg or above)</span></li>'+
         '<li><b>BSH \u2014 UK guidelines on the management of iron deficiency in pregnancy (Pavord et al., Br J Haematol 2020)</b><br><a href="https://doi.org/10.1111/bjh.16221" rel="noopener">doi.org/10.1111/bjh.16221</a><span class="rd"> — check Hb within 48 hours after delivery with blood loss over 500 mL, uncorrected antenatal anaemia or symptoms; stable postpartum Hb below 100 g/L: oral elemental iron 40–80 mg daily for at least 3 months, with repeat Hb after 2–3 weeks</span></li>'+
         '<li><b>BNF and Specialist Pharmacy Service / UK Drugs in Lactation Advisory Service (UKDILAS)</b><br><a href="https://www.sps.nhs.uk" rel="noopener">sps.nhs.uk</a><span class="rd"> — Using SSRI antidepressants during breastfeeding (sertraline and paroxetine generally preferred; infant monitoring), flucloxacillin in breastfeeding, and the breastfeeding compatibility of enalapril, nifedipine and LMWH</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Postnatal disorders — NICE CG192 (2014, updated 2020), NICE NG194 (2021), NICE NG255 (2025), NICE NG133 (2019, updated 2023), BSH 2020 and MBRRACE-UK (2025). At every postnatal contact, consider potentially serious infection, haemorrhage, thromboembolism, hypertensive disease and acute mental illness — all can present as a woman who is simply “not quite right”, and fever alone does not rule sepsis in or out (6-week risk window, NICE NG255). Use EPDS or PHQ-9 within a clinical assessment, ask question 10 out loud, and ask directly about thoughts of harming the baby. If starting an SSRI while breastfeeding, sertraline or paroxetine are commonly preferred, with infant monitoring. Test thyroid function and anaemia when clinically indicated. Verify all doses against the BNF, SmPC and local formulary before prescribing."
});
