MG.render({

  stemTitle:"Four things kill in the puerperium — sepsis, VTE, haemorrhage and postpartum psychosis — and all four can present as a woman who is simply “not quite right” with a low-grade temperature and a tired baby",
  stemSub:"One page for the whole postnatal period. The safety half first, because Group A streptococcal sepsis can look mild for 12–24 hours and then kill within hours, and VTE remains the leading cause of direct maternal death in the UK. Then the assessment that finds what is missed: EPDS with <b>question 10 asked out loud</b>, baby blues separated from postnatal depression, postpartum thyroiditis that mimics PND, and the physical recovery nobody asks about — perineum, pelvic floor, continence, anaemia, diastasis. <b>Sertraline is the breastfeeding-safe SSRI; fluoxetine is not.</b>",
  guideline:"NICE CG192 · NG194 · NG255 · MBRRACE-UK",
  reviewed:"13 September 2026",
  nextReview:"13 March 2027",
  meta:[
    {t:"NICE CG192 — antenatal &amp; postnatal mental health"},

  lead:'<div class="mg-layers"><a href="#safety"><b>The four killers</b><small>Sepsis · VTE · PPH · PP</small></a><a href="#mental"><b>Mental health</b><small>EPDS · Q10 · SSRI</small></a><a href="#physical"><b>Physical</b><small>Perineum · floor · anaemia</small></a><a href="#feeding"><b>Feeding</b><small>Mastitis · latch</small></a><a href="#check"><b>6-week check</b><small>Mother and baby</small></a></div>',
  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Puerperal sepsis — Group A Strep can look mild then kill in hours", html:"Fever above 38°C, offensive lochia, uterine tenderness, tachycardia or systemic illness within 10 days of delivery → 999 and Sepsis Six within 1 hour. Group A Streptococcus is the most feared organism: the first 12–24 hours can be deceptively mild — low-grade temperature, malaise, \"not quite right\" — before explosive deterioration to septic shock, with mortality around 20–30% even when treated well. Use the maternity (obstetric) early warning score, not NEWS2 — NICE NG255 does not recommend NEWS2 for pregnant or recently pregnant people. GAS is notifiable once confirmed. Have a very low threshold for same-day assessment."},
    {tone:"red", h:"⚠ Postpartum psychosis is a same-day emergency", html:"New psychotic symptoms, confusion, grandiosity, labile mood or severe agitation — typically within 2 weeks of delivery, with a first peak at 48–72 hours and a second at 2–4 weeks. 1–2 per 1,000 deliveries. Command hallucinations about harming the baby or herself are a genuine risk: assess the safety of BOTH mother and infant immediately. 999 or crisis team the same day, and admission ideally to a Mother and Baby Unit so the bond is preserved. If she refuses and lacks capacity or poses a risk → urgent Mental Health Act assessment. Risk factors: bipolar disorder, previous PP, family history of PP."},
    {tone:"amber", h:"VTE is the leading cause of direct maternal death", html:"Calf pain, leg swelling, dyspnoea or tachycardia within 6 weeks of delivery → 999 if PE is suspected. <b>Pregnancy and the puerperium carry a 4–5× increased VTE risk.</b> Check whether thromboprophylaxis was actually risk-assessed at delivery — a missed assessment is a common and correctable failure. Treatment-dose LMWH, which is breastfeeding-compatible."},
    {tone:"blue", h:"EPDS — and ask question 10 out loud", html:"The Edinburgh Postnatal Depression Scale is the validated 10-item tool: ≥10 suggests possible depression and warrants reassessment, ≥13 is probable postnatal depression. Question 10 asks about self-harm — never score it silently from a form. Ask it, and ask separately about thoughts of harming the baby. Postnatal depression affects roughly 10–15% of mothers; baby blues is transient tearfulness at days 3–5 that resolves within 2 weeks and needs reassurance, not treatment."},
    {tone:"green", h:"Sertraline is the breastfeeding-safe SSRI — fluoxetine is not", html:"Sertraline has the lowest milk transfer and is the first-line SSRI in a breastfeeding mother; paroxetine and fluvoxamine are also low. Avoid fluoxetine first-line — its long half-life and the active metabolite norfluoxetine give the highest milk transfer of any SSRI. Never let \"I'm breastfeeding\" become a reason to leave depression untreated — that is the commonest harm in this consultation."},
    {tone:"purple", h:"🟣 Safeguarding and the statutory duties", html:"Ask routinely about domestic abuse — it starts or escalates in pregnancy and the postnatal period — and about the baby's wellbeing and feeding. Thoughts of harming the infant, or a mother unable to care for her baby, trigger an immediate safeguarding referral alongside the psychiatric one. <b>Group A streptococcal puerperal sepsis is a notifiable infection.</b> Record both the enquiry and the answer."}
  ],
  pathwaySub:"Five steps. The first is a safety screen that runs at every postnatal contact.",
  pathway:[
    {title:"Screen for the four emergencies", html:"Sepsis (fever, offensive lochia, uterine tenderness, tachycardia) · VTE (calf pain, dyspnoea) · secondary PPH (more than a pad an hour) · postpartum psychosis (confusion, mania, thoughts of harm). Plus eclampsia and CVST — severe headache with hypertension, visual disturbance or seizures up to 6 weeks.", alert:true},
    {title:"Classify what you are dealing with", html:"Physical (perineum, continence, anaemia, hypertension, thyroid, breast) · psychological (baby blues, PND, anxiety, birth-trauma PTSD, psychosis) · infant feeding (latch, tongue tie, supply, mastitis). Most women have something from more than one column."},
    {title:"Screen mood properly", html:"Whooley questions or EPDS, with question 10 asked aloud, and a separate direct question about thoughts of harming the baby. Check TSH before concluding it is depression — postpartum thyroiditis mimics it exactly."},
    {title:"Treat, with breastfeeding in the decision not as a veto", html:"Sertraline for PND; flucloxacillin for mastitis with feeding continued; ferrous sulphate for anaemia; paracetamol and ibuprofen with saline washing for the perineum; pelvic floor physiotherapy for continence."},
    {title:"Safety-net the whole family and review", html:"999 advice for psychosis, sepsis, PPH and VTE given verbally. Review mood and recovery, confirm the baby is thriving, and complete the 6-week check including contraception."}
  ],
  sections:[

    {id:"safety", nav:"The four killers", title:"Red flags — the puerperal emergencies",
     sub:"A postnatal woman who is “not quite right” is an emergency assessment, not a telephone reassurance.",
     blocks:[
       {b:"table", head:["Presentation","Diagnosis","Action"], rows:[
         ["Fever above 38°C, offensive lochia, uterine tenderness, tachycardia, systemic illness — within 10 days of delivery","Puerperal sepsis. Group A Streptococcus is the most rapidly fatal cause, spreading along fascial planes; the first 12–24 hours can be deceptively mild","999. Sepsis Six within 1 hour — blood cultures, IV antibiotics, IV fluids, lactate, oxygen, urine output. IV benzylpenicillin plus metronidazole plus gentamicin per local protocol. <b>Use the maternity early warning score, not NEWS2 (NICE NG255). Notify if GAS is confirmed</b>"],
         ["Calf pain, leg swelling, dyspnoea, tachycardia — within 6 weeks of delivery","VTE — the leading cause of direct maternal death in the UK; 4–5× increased risk in pregnancy and the puerperium","<b>999 if PE is suspected.</b> Wells score, D-dimer and CTPA in secondary care; <b>treatment-dose LMWH, which is breastfeeding-compatible.</b> <b>Check whether thromboprophylaxis was risk-assessed at delivery</b>"],
         ["Sudden severe headache, photophobia, BP above 140/90, visual disturbance or seizures — within 6 weeks","<b>Eclampsia, or cerebral venous sinus thrombosis</b>","<b>999. Magnesium sulphate for eclampsia; urgent CT or MRI head for CVST.</b> Postnatal hypertension: treat if BP is above 150/100 with labetalol or nifedipine — it can develop up to 6 weeks postpartum with no antenatal history"],
         ["New psychotic symptoms, confusion, grandiosity, labile mood, severe agitation — typically within 2 weeks","Postpartum psychosis — 1–2 per 1,000 deliveries. Bimodal onset: 48–72 hours, then 2–4 weeks","999 or crisis team the same day; admission ideally to a Mother and Baby Unit. Assess the safety of mother AND baby immediately — command hallucinations about infanticide or suicide are a real risk. Urgent Mental Health Act assessment if she refuses and lacks capacity or poses a risk"],
         ["Profuse vaginal bleeding at any postnatal contact — more than a pad an hour, or frank haemorrhage","Secondary PPH — retained products of conception, endometritis or coagulopathy","999. IV access; ergometrine 0.5 mg IM and Syntocinon IV per local protocol; urgent pelvic ultrasound for retained products"],
         ["Breast pain, fever, flu-like symptoms and localised erythema in a breastfeeding woman","<b>Infective mastitis; a fluctuant area means breast abscess</b>","Flucloxacillin 500 mg QDS for 10–14 days, and CONTINUE breastfeeding — it reduces engorgement and is safe. <b>Fluctuance → urgent surgical drainage with ultrasound confirmation</b>"],
         ["Any thought of harming the baby, or a mother unable to care for her infant","<b>Immediate risk to the child</b>","Same-day perinatal mental health assessment AND a safeguarding referral — both, not one or the other"]
       ]},
       {b:"warn", html:"The single most important judgement on this page is the threshold for same-day assessment. GAS sepsis in the first 12–24 hours presents as a low-grade temperature and a woman who says she feels wrong — the deterioration that follows is measured in hours, not days. The same applies in reverse to postpartum psychosis: a mother describing intrusive thoughts about her baby is often terrified to say so, and the window to ask is the consultation you are in."}
     ]},

    {id:"mental", nav:"Mental health", title:"Postnatal mental health",
     sub:"Separating the transient from the serious, and prescribing without stopping breastfeeding.",
     blocks:[
       {b:"table", head:["Condition","Recognising it","Management"], rows:[
         ["<b>Baby blues</b>","Transient tearfulness and mood lability at days 3–5, resolving spontaneously within 2 weeks. Not a disorder","Reassurance, practical support and sleep where possible — no treatment. Say explicitly that it is expected and self-limiting, and arrange a check rather than discharging the concern"],
         ["<b>Postnatal depression — roughly 10–15% of mothers</b>","Low mood beyond 2 weeks, going past baby blues; anhedonia, guilt, poor bonding, sleep disturbance beyond the baby's demands. EPDS ≥13 is probable PND; ≥10 warrants reassessment","Mild: NHS Talking Therapies, guided self-help, practical and peer support. Moderate to severe: SSRI plus psychological therapy — sertraline first-line. Review at 2 weeks, then 4–6 weeks"],
         ["<b>EPDS question 10 — self-harm</b>","<b>Ask it out loud; never score it silently off a form.</b> Ask separately about thoughts of harming the baby","Any active ideation with intent or plan → same-day crisis or perinatal mental health assessment. Intrusive thoughts without intent are common and frightening — name them and explain the difference"],
         ["<b>Perinatal OCD — the distinction that changes the response</b>","Intrusive thoughts of harming the baby that are EGO-DYSTONIC: the mother is horrified by them, resists them, and is terrified to disclose them. Often with checking, washing or avoidance of the baby","This is anxiety, not psychosis, and it is treatable — SSRI (sertraline) plus CBT with exposure and response prevention; reassure explicitly that these thoughts do not mean she will act. Contrast with postpartum psychosis, where ideation is ego-SYNTONIC, delusionally justified and an emergency. Getting this distinction wrong in either direction causes harm: one mother is needlessly frightened and separated from her baby, the other is sent home"],
         ["<b>Already on lithium or an antipsychotic</b>","A woman established on treatment for bipolar disorder or a previous psychosis","Never stop lithium or switch abruptly without specialist input — abrupt discontinuation markedly raises relapse risk at the highest-risk time. Perinatal psychiatry advice for any complex regimen; optimise rather than change, and check lithium monitoring is in place"],
         ["<b>Anxiety disorders and birth-trauma PTSD</b>","Generalised anxiety, panic, health anxiety about the baby, or PTSD from a traumatic birth — intrusive memories, avoidance of maternity settings, hypervigilance","<b>Psychological therapy; trauma-focused CBT or EMDR for PTSD.</b> A birth debrief with the maternity team is often what the woman actually wants"],
         ["<b>Postpartum psychosis</b>","<b>See the red flags — a same-day emergency</b>","<b>Crisis team and Mother and Baby Unit.</b> <b>Never manage at home alone</b>"],
         ["<b>Postpartum thyroiditis masquerading as PND</b>","Hyperthyroid phase then hypothyroid: fatigue, weight gain, cold intolerance and low mood with a raised TSH — frequently mistaken for depression","Check TFTs before settling on a mood diagnosis. Levothyroxine where indicated. Permanent hypothyroidism follows in roughly 25–30%, so check TSH annually for 5 years"],
         ["<b>Previous severe mental illness or bipolar disorder</b>","<b>The highest-risk group for postpartum psychosis</b>","Pre-birth planning with perinatal mental health, and a low threshold for specialist involvement postnatally. Do not wait for symptoms"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"💊 SSRI choice while breastfeeding", html:"Sertraline — lowest milk transfer, first-line. Paroxetine and fluvoxamine also low. Avoid fluoxetine first-line: its long half-life and the active metabolite norfluoxetine give the highest milk transfer of any SSRI. Start low, review at 2 weeks, and continue for at least 6 months after recovery."},
         {tone:"amber", h:"⚠ The commonest harm is under-treatment", html:"\"I don't want to take anything because I'm breastfeeding\" ends more consultations than it should. Untreated maternal depression has measurable effects on infant development and on the mother's safety — an effective, breastfeeding-compatible drug exists, and saying so plainly is the intervention."},
         {tone:"blue", h:"📋 Referral thresholds", html:"Perinatal mental health service: moderate to severe PND, any history of severe mental illness, bipolar disorder, previous postpartum psychosis, or poor response to first-line treatment. <b>Crisis or MBU: psychosis, active suicidality, or risk to the infant.</b>"},
         {tone:"green", h:"🤝 What actually helps alongside", html:"Health visitor support, sleep protection where any is possible, partner and peer support, local groups, and breastfeeding support. <b>Treat the anaemia and the pain</b> — exhaustion and unrelieved perineal pain look a great deal like depression."}
       ]}
     ]},

    {id:"physical", nav:"Physical", title:"Physical recovery — the part nobody asks about",
     blocks:[
       {b:"table", head:["Problem","Management"], rows:[
         ["<b>Perineal pain, wound breakdown, infection or haematoma</b>","Paracetamol plus ibuprofen, saline washing, and inspection — do not manage perineal pain without looking. Refer wound breakdown or suspected infection to the maternity or perineal clinic"],
         ["<b>Postnatal anaemia</b>","<b>Ferrous sulphate 200 mg BD</b> (or an alternating-day regimen for tolerability), after FBC and ferritin. Fatigue, palpitations and breathlessness are frequently attributed to new motherhood when the haemoglobin explains them"],
         ["<b>Urinary symptoms — stress incontinence, urgency, retention</b>","Pelvic floor physiotherapy referral, which is effective and under-used. Retention needs same-day assessment. See <a href='female-urinary-incontinence.html'>female urinary incontinence</a>"],
         ["<b>Diastasis recti</b>","Separation of the rectus abdominis — abdominal bulge, back pain, core weakness. Physiotherapy-led core rehabilitation, not abdominal crunches"],
         ["<b>Postnatal hypertension</b>","Can develop up to 6 weeks postpartum with no antenatal history. Treat if above 150/100 — labetalol or nifedipine, both breastfeeding-compatible. Arrange a BP check even in women who were normotensive antenatally"],
         ["<b>Thyroid dysfunction</b>","Postpartum thyroiditis or a Hashimoto's flare — check TFTs in any woman with fatigue, mood change or palpitations. <b>Annual TSH for 5 years after postpartum thyroiditis</b>"],
         ["<b>Constipation, haemorrhoids and pelvic girdle pain</b>","Laxatives (breastfeeding-compatible), topical treatment, physiotherapy. Small problems that dominate the day and are rarely volunteered"],
         ["<b>Contraception</b>","<b>Address it at the 6-week check at the latest — sooner if asked.</b> See <a href='contraception.html'>contraception</a>, including the postpartum and breastfeeding rules"]
       ]}
     ]},

    {id:"feeding", nav:"Feeding", title:"Infant feeding difficulties",
     blocks:[
       {b:"table", head:["Problem","What to do"], rows:[
         ["<b>Mastitis and blocked duct</b>","Continue feeding; effective milk removal; analgesia. Infective mastitis → flucloxacillin 500 mg QDS for 10–14 days. <b>Fluctuance → urgent surgical drainage</b>"],
         ["<b>Nipple pain</b>","Assess the latch first — it is the commonest cause. Then consider candida, dermatitis or Raynaud's of the nipple"],
         ["<b>Poor latch, low supply, tongue tie</b>","Breastfeeding support and infant feeding team; assess for ankyloglossia and refer for division where it is restricting feeding"],
         ["<b>Projectile non-bilious vomiting at 3–6 weeks with a palpable “olive”</b>","Pyloric stenosis — urgent paediatric surgical referral, not a reflux diagnosis"],
         ["<b>Reflux with arching, regurgitation and poor weight gain</b>","Assess weight and feeding; see <a href='../algorithms/vomiting-children.html'>vomiting in children</a> and <a href='cmpa.html'>CMPA</a> where symptoms suggest cow's milk protein allergy"],
         ["<b>Neonatal jaundice</b>","See <a href='../algorithms/neonatal-jaundice.html'>the neonatal jaundice pathway</a> — jaundice under 24 hours old, or prolonged beyond 14 days, needs investigation"]
       ]}
     ]},

    {id:"check", nav:"6-week check", title:"The 6-week postnatal check — and the review after it",
     blocks:[
       {b:"table", head:["Component","Detail"], rows:[
         ["<b>Mother — mental health</b>","Mood screen (Whooley or EPDS with question 10 asked aloud), bonding, sleep, birth experience and any trauma, domestic abuse enquiry"],
         ["<b>Mother — physical</b>","Blood pressure, perineal or caesarean wound, bleeding pattern, continence and pelvic floor, breast, weight, FBC if there was PPH or symptoms, TFTs if indicated"],
         ["<b>Mother — planning</b>","Contraception, cervical screening status, pre-existing conditions and medication review, immunisations, and the plan for any ongoing problem"],
         ["<b>Baby</b>","Feeding, weight and growth, the NIPE newborn examination findings, immunisation schedule, and any parental concern"],
         ["<b>Safety-net</b>","<b>The 999 criteria for psychosis, sepsis, PPH and VTE, given verbally.</b> Follow-up interval for anything unresolved — the check is not a discharge"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 999 — say these out loud", html:"\"Call 999 for a fever with offensive-smelling discharge and feeling very unwell; bleeding heavier than a pad an hour; a swollen painful calf or breathlessness; or sudden confusion, racing thoughts, or any thought of harming yourself or the baby.\""},
         {tone:"amber", h:"🟠 Contact us the same day", html:"Feeling \"not right\" with any temperature · a wound becoming more painful, red or discharging · a severe headache with visual change · unable to pass urine · low mood that is getting worse rather than better."},
         {tone:"green", h:"✓ Normalise asking", html:"\"A lot of women have thoughts that frighten them in the first weeks, and telling me about them is the right thing to do — it does not mean anyone will take your baby away.\" Said early, this is what makes disclosure possible."},
         {tone:"blue", h:"📅 Review, not discharge", html:"Any unresolved mood, continence, pain or feeding problem gets a named interval and a named person. The 6-week check is a waypoint."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999 / emergency", html:"Puerperal sepsis · suspected PE · eclampsia or CVST · secondary PPH · postpartum psychosis · active suicidality or risk to the infant."},
         {tone:"amber", h:"Same-day perinatal mental health / crisis", html:"Postpartum psychosis, active suicidal ideation, thoughts of harming the baby, or rapid deterioration in mood. Mother and Baby Unit admission preserves the bond and is the preferred route."},
         {tone:"purple", h:"🟣 Safeguarding — a statutory duty", html:"Any thought of harming the infant, a mother unable to care for her baby, suspected domestic abuse with children in the household, or a non-thriving infant → children's social care referral alongside the clinical one. <b>Group A streptococcal puerperal sepsis is notifiable.</b>"},
         {tone:"blue", h:"Perinatal mental health service", html:"Moderate to severe PND, any history of severe mental illness or bipolar disorder, previous postpartum psychosis, or inadequate response to first-line treatment."},
         {tone:"blue", h:"Maternity / obstetrics", html:"Perineal wound breakdown, suspected retained products, secondary PPH not requiring 999, or a birth debrief."},
         {tone:"green", h:"Physiotherapy and support services", html:"Pelvic floor physiotherapy for continence, core rehabilitation for diastasis, infant feeding team, health visitor, and local peer support groups."},
         {tone:"cream", h:"GP management", html:"The screening, the mood assessment and SSRI, mastitis, anaemia, perineal care, thyroid, hypertension, contraception and the 6-week check are all primary care. Related pages: <a href='postnatal-depression.html'>postnatal depression</a> · <a href='contraception.html'>contraception</a> · <a href='female-urinary-incontinence.html'>female urinary incontinence</a> · <a href='cmpa.html'>CMPA</a>."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 31-year-old woman attends <b>5 weeks</b> after a forceps delivery, brought forward by the health visitor with an <b>EPDS of 16</b>. She is exhausted, tearful, says she \"can't feel anything\" for the baby, and is <b>breastfeeding</b>. She mentions intrusive thoughts about dropping the baby, which frighten her. She has a <b>painful perineum</b>, is leaking urine, and her <b>haemoglobin after a 900 mL PPH was never rechecked</b>. She asks whether she has to stop breastfeeding to take tablets."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Asks EPDS question 10 aloud and asks separately about thoughts of harming the baby — then distinguishes intrusive thoughts without intent from psychosis and command hallucinations, and says so in a way that reduces her fear rather than increasing it; <b>screens for the physical emergencies</b> (sepsis, VTE, PPH); prescribes sertraline and states explicitly that she can continue breastfeeding, naming fluoxetine as the one to avoid; <b>rechecks the FBC and ferritin and treats the anaemia</b>, recognising exhaustion as partly haematological; <b>examines the perineum rather than prescribing blindly</b>; <b>refers for pelvic floor physiotherapy</b>; <b>checks TFTs for postpartum thyroiditis</b>; <b>enquires about domestic abuse and the baby's wellbeing</b>; <b>refers to perinatal mental health given the severity</b>; offers a <b>birth debrief</b> after a forceps delivery; and <b>gives the 999 safety-net verbally.</b>"}
     ]}]},

  foot:"Postnatal disorders — NICE CG192, NG194, MBRRACE-UK and NICE. Four things kill in the puerperium: sepsis, VTE, haemorrhage and postpartum psychosis — and all four can present as a woman who is simply “not quite right”. Group A streptococcal sepsis can look mild for 12–24 hours then deteriorate within hours; VTE remains the leading cause of direct maternal death. Ask EPDS question 10 out loud, and ask separately about thoughts of harming the baby. Sertraline is the breastfeeding-safe SSRI; avoid fluoxetine first-line. Check TFTs before settling on a mood diagnosis. Verify all doses against the BNF before prescribing."
