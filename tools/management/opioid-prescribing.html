    {id:"before", nav:"Which pain?", title:"Step 1 — which pain is this? Half the battle is won here",

         ["<b>Opioids will NOT help</b>","Fibromyalgia, chronic primary pain (NG193 says do NOT start), chronic low back pain (NG59: do not offer opioids), headache and migraine (they CAUSE medication-overuse headache), chronic abdominal and pelvic pain — saying no here, with the why, is the kindest prescription"],

     ]},

    {id:"taper", nav:"Taper", title:"Step 6 — deprescribing: 10% steps, months not weeks, patient owns the pace",
     blocks:[
       {b:"info", html:"Taper when: there is no functional benefit · above 90 mg OME · more than 3 months' use without re-justification · hyperalgesia · on benzodiazepines or gabapentinoids · the condition has resolved (post-operative, post-fracture — the commonest forgotten taper) · misuse. The message that works: most people feel BETTER, not worse, as the dose falls — clearer-headed, less constipated, and the pain usually does not worsen, because hyperalgesia often means it improves."},
       {b:"table", head:["Step","Action","Detail"], rows:[
         ["<b>6a — invite, don't ambush</b>","<b>Frame it as a health upgrade, not a punishment</b>","Not ready → information (Live Well with Pain), revisit in 3–6 months — forced tapers fail and fracture trust. Exception: safety-critical combinations warrant a firmer timeline"],
         ["<b>6b — count the real dose</b>","<b>Total OME across everything, and ask what they ACTUALLY take</b>","<b>Stockpiles and \"saving the top-ups\" are normal.</b> Taper the MR or patch first; keep IR visible and countable (switch liquid to tablets)"],
         ["<b>6c — 10% of the ORIGINAL dose every 2–4 weeks</b>","<b>One opioid at a time, most potent first</b>","<b>Hold at any step for life events; never go back up more than one step.</b> Withdrawal — sweats, yawning, cramps, restless legs, anxiety, diarrhoea — peaks day 2–5 and settles within a week of each cut. Pre-warn: withdrawal is NOT the pain returning"],

     ]},

     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Overdose signs", html:"\"Extreme drowsiness you cannot be woken from, slow or gurgling breathing, blue lips — whoever is with you calls 999 and says 'opioid overdose'. Keep the take-home naloxone where your family can find it if you have been given one.\""},
         {tone:"red", h:"🍷 Never mix", html:"\"No alcohol, no sleeping tablets, no 'nerve' tablets from anyone else on top of these — the combination stops breathing.\""},
         {tone:"amber", h:"🚗 Driving", html:"\"No driving when we start or change the dose, or on any day you feel drowsy — the law treats impaired driving on these like drink-driving.\""},
         {tone:"amber", h:"👶 Storage", html:"\"Locked away from children and visitors — one MR tablet can kill a child. Return leftovers to the pharmacy, never the bin.\""},
         {tone:"green", h:"⏸️ Never stop dead", html:"\"Running out or stopping suddenly makes you genuinely ill — reductions are planned together, in small steps.\""}

         {tone:"amber", h:"Drug and alcohol service", html:"Addiction features, diversion, illicit top-ups — alongside primary care, not instead of it. Opioid substitution therapy conversations belong to them. See <a href='opioid-dependence.html'>opioid dependence</a>."},
         {tone:"blue", h:"Reassess the cause", html:"The joint that needs replacing, the radiculopathy that needs imaging, red flags — a definitive fix beats any taper plan."},
         {tone:"red", h:"Perinatal", html:"Pregnant on regular opioids → a joint obstetric and specialist plan. NOT abrupt cessation, which risks fetal withdrawal; the neonatal team must be aware."},
         {tone:"blue", h:"Palliative exception", html:"This whole page is NON-cancer pain — cancer pain follows its own ladder without these ceilings. See <a href='palliative-pain.html'>palliative pain</a>."},
         {tone:"cream", h:"GP management", html:"The decision not to start, the trial with its off-ramp, opioid choice within the ceiling, harm management, the taper and the safety rules all belong here. Related pages: <a href='chronic-pain.html'>chronic primary pain</a> · <a href='neuropathic-pain.html'>neuropathic pain</a> · <a href='sciatica.html'>sciatica</a> · <a href='benzodiazepines-z-drugs.html'>benzodiazepines and z-drugs</a> · <a href='opioid-dependence.html'>opioid dependence</a>."}
       ]},
       {b:"say", html:"We will treat this as a proper four-week experiment with goals we have written down together. If it works, we use the lowest dose that keeps you moving. If it does not — and for a lot of long-term pain it does not — the kindest thing I can do is bring you off it slowly, because most people feel better in themselves at the end of that, not worse."}
     ]},

     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 54-year-old woman has taken <b>morphine MR 60 mg BD</b> for 6 years for chronic low back pain, plus <b>zopiclone</b> and <b>pregabalin 300 mg BD</b>. She requests an increase: the pain is \"worse than ever\" and now \"aches all over\". She has stopped walking to the shops, has gained weight, is <b>constipated despite lactulose</b>, and mentions <b>fatigue and no libido</b>. She has run out early twice this year."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Does NOT increase the dose, and can explain why: widespread tenderness with escalating dose and worsening pain is opioid-induced hyperalgesia — the dose is the cause; <b>recognises 60 mg BD is 120 mg OME — above the 90 mg/day threshold at which Opioids Aware (2026) advises specialist input</b>; identifies the zopiclone-plus-pregabalin-plus-opioid combination as the overdose risk and makes deprescribing it priority one (MHRA); <b>knows opioids are not offered for chronic low back pain (NICE NG59) and not started for chronic primary pain (NG193)</b>, so there was never a good indication; switches lactulose to a stimulant plus osmotic, since opioid constipation does not respond to bulking; <b>checks testosterone for opioid-induced endocrine effects</b> and names it as another reason to taper; <b>addresses the early running-out without accusation</b> but names the pattern and counts the real dose; invites rather than ambushes the taper — 10% every 2–4 weeks, months not weeks — and <b>pre-warns that withdrawal is not the pain returning</b>; offers <b>pain self-management alongside</b>; and considers <b>take-home naloxone</b> given the dose and combination."}
     ]}]},

  foot:"Opioids for persistent NON-cancer pain in adults — Opioids Aware (FPM), NICE NG193, NG59, NG215 and MHRA 2020. Know the pains opioids will not help before you start: fibromyalgia and chronic primary pain, chronic low back pain, headache and chronic abdominal or pelvic pain. Run a time-limited trial with the exit named at the start, and use the 20 mg off-ramp. Aim for ≤50 mg/day OME; seek specialist advice before exceeding 90 mg/day (Opioids Aware 2026). Never co-prescribe with benzodiazepines or gabapentinoids. Co-prescribe a stimulant laxative from day one. For established users the answer is rarely a higher dose — taper at 10% every 2–4 weeks over months, and never stop abruptly. Cancer pain follows its own pathway. Verify doses and equivalences against the current BNF before prescribing."
