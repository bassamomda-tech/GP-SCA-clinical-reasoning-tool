<script>
MG.render({
  icon:"🧠",
  title:"Head injury and concussion",
  eyebrow:"Protocol · neurology · triage, observe and return to activity",
  stemTitle:"Head injury: decide who needs the emergency department, then manage concussion with rest, a graduated return and no sport for 21 days",
  stemSub:"One page for the head injury seen in the surgery, on the phone or a day later. NICE NG232 (May 2023) lists the features that mean referral to an emergency department, where CT decisions are made. Anticoagulant or antiplatelet treatment (except aspirin alone), older age, loss of consciousness, amnesia and vomiting are the factors most often missed in primary care. Most people have concussion without structural injury: they need clear advice, someone to stay with them for the first 24 hours, a graduated return to education, work and exercise, and no return to competitive sport for at least 21 days under the UK grassroots concussion guidelines.",
  guideline:"NICE NG232 (2023) · UK Concussion Guidelines for Non-Elite (Grassroots) Sport (2023, updated 2024) · DVLA Assessing fitness to drive · NICE CG150 headaches (2012, updated 2021)",
  reviewed:"15 October 2026",
  nextReview:"April 2027",
  meta:[
    {t:"NICE NG232 · head injury (2023)"},
    {t:"Anticoagulant or antiplatelet → ED", tone:"tw"},
    {t:"UK grassroots concussion guidelines (2023, updated 2024)"},
    {t:"Reviewed October 2026 · next review April 2027"}
  ],
  lead:"<div class='mg-layers'><a href='#redflags'><b>Send to ED</b><small>NG232 risk factors</small></a><a href='#assess'><b>Assess</b><small>GCS, amnesia, mechanism</small></a><a href='#concussion'><b>Concussion</b><small>rest, then graduated return</small></a><a href='#pcs'><b>Persisting symptoms</b><small>after 4 weeks</small></a></div>",
  quickSub:"Six points that change what you do today. Each one is traced to a named source under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"Send to the emergency department if any NG232 risk factor", html:"GPs and other community services should refer to an emergency department (by ambulance if needed) after a head injury with <b>any</b> of: <b>GCS under 15</b> on initial assessment; <b>any loss of consciousness</b>; <b>any focal neurological deficit</b>; any suspicion of <b>skull fracture</b> or penetrating injury; <b>amnesia</b> for events before or after the injury; <b>persistent headache</b> since the injury; <b>any vomiting</b> since the injury; any <b>seizure</b> since the injury; previous cranial neurosurgery; a <b>high-energy mechanism</b>; a bleeding or clotting disorder or current <b>anticoagulant or antiplatelet treatment</b> (except aspirin alone); current <b>drug or alcohol intoxication</b>; <b>safeguarding concerns</b>, including suspected non-accidental injury; irritability or altered behaviour, especially in children under 5; or continuing concern by the professional."},
    {tone:"red", h:"Anticoagulants and age: lower the threshold", html:"People taking an anticoagulant (warfarin, a DOAC, heparin) or an antiplatelet other than aspirin alone should be <b>referred to the emergency department after any head injury</b>; NG232 advises considering a CT head scan within 8 hours even without other indications. <b>Age 65 or over</b> with loss of consciousness or amnesia is a CT indication. Older people may have few symptoms early."},
    {tone:"red", h:"999 now", html:"Call <b>999</b> for reduced or falling consciousness, a seizure, new focal weakness, unequal pupils, clear fluid from the nose or ears with a head injury, a penetrating injury, a suspected neck injury, or repeated vomiting with a worsening headache."},
    {tone:"cream", h:"Concussion: rest briefly, then a graduated return", html:"Rest and sleep as needed for the first <b>24–48 hours</b>, with a responsible adult present for the first 24 hours. Then return gradually to daily activities, education and work, as symptoms allow. Avoid screens and alcohol early on if they worsen symptoms. Most people recover within 2–4 weeks."},
    {tone:"amber", h:"Sport: if in doubt, sit them out — no competition before day 21", html:"Anyone with suspected concussion must stop playing and not return to sport that day. Under the UK grassroots guidelines, call <b>NHS 111 within 24 hours</b>, follow a graduated return, and do <b>not return to competitive sport before 21 days</b> from the injury, and only when symptom-free. Symptoms lasting more than <b>28 days</b> → medical review."},
    {tone:"blue", h:"Driving and work", html:"Advise not to drive until fully recovered: no headache, dizziness, visual disturbance or slowed thinking. Uncomplicated concussion does not usually need DVLA notification, but traumatic brain injury with an intracranial bleed, surgery, a post-traumatic seizure or lasting impairment does; check the current <b>DVLA guidance</b>. Group 2 drivers have stricter rules."}
  ],
  pathwaySub:"Five moves. The first decides whether this is a primary care problem at all.",
  pathway:[
    {title:"Screen for ED and 999 features", alert:true, html:"GCS, loss of consciousness, amnesia, vomiting, headache, seizure, focal signs, skull fracture signs, mechanism, anticoagulants or antiplatelets, bleeding disorders, previous brain surgery, age, intoxication, safeguarding."},
    {title:"Ask about the person and setting", html:"Who is at home for the next 24 hours? Alcohol or drugs? Can they understand advice? Any concern about non-accidental injury or domestic abuse?"},
    {title:"Examine", html:"GCS, pupils, limb power and coordination, cervical spine, scalp and skull, signs of basal skull fracture (panda eyes, Battle's sign, CSF leak, haemotympanum)."},
    {title:"Concussion advice", alert:true, html:"Written head injury advice; 24-hour supervision; rest 24–48 hours then graduated return; no sport for at least 21 days; no driving until recovered; warning signs that mean 999."},
    {title:"Follow up persisting symptoms", html:"Review if symptoms persist beyond about 4 weeks or worsen: headache, dizziness, mood, sleep, cognition. Return to work or school plan; specialist referral if not improving."}
  ],
  sections:[
    {id:"redflags", nav:"Red flags", title:"Red flags: emergency department and 999", sub:"NICE NG232 asks GPs and other community services to refer to an emergency department when any listed risk factor is present.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 999", html:"GCS falling or under 15 and not improving, seizure, focal neurological deficit, unequal or unreactive pupils, penetrating injury, suspected cervical spine injury, signs of basal skull fracture, or deteriorating with repeated vomiting and severe headache. → <b>999</b>.", src:"NICE NG232 (2023)"},
         {tone:"red", h:"🔴 Emergency department (NG232 community list)", html:"Refer if <b>any</b> of: GCS under 15 on initial assessment; any loss of consciousness; any focal neurological deficit; any suspicion of skull fracture or penetrating injury; amnesia for events before or after the injury; <b>persistent headache since the injury</b>; <b>any vomiting episodes since the injury</b> (use clinical judgement in young children); any seizure since the injury; previous cranial neurosurgery; high-energy mechanism (for example a fall from more than 1 metre or 5 stairs, a road traffic collision with ejection or a pedestrian struck); history of bleeding or clotting disorders, or current anticoagulant or antiplatelet treatment except aspirin alone; current drug or alcohol intoxication; safeguarding concerns, including suspected non-accidental injury; irritability or altered behaviour, especially in children under 5; continuing concern by the professional. → <b>emergency department</b>, by ambulance if needed.", src:"NICE NG232 (2023)"},
         {tone:"amber", h:"🟠 Social factors to weigh", html:"No responsible adult to supervise at home or difficulty accessing help: these lower the threshold for sending someone to the emergency department, even without other risk factors.", src:"NICE NG232 (2023)"},
         {tone:"amber", h:"🟠 Delayed presentation", html:"A person seen days after the injury with a worsening headache, increasing drowsiness, confusion, new weakness or vomiting may have a chronic subdural haematoma, particularly if older, on anticoagulants or drinking heavily. → <b>emergency department the same day</b>.", src:"NICE NG232 (2023)"}
       ]},
       {b:"why", html:"Older people and those on anticoagulants can bleed slowly, with a lucid interval and few early signs. That is why NG232 sends them to the emergency department even after an apparently minor injury, and why 'he seems fine now' is not reassuring in a patient taking a DOAC."}
     ]},

    {id:"assess", nav:"Assess", title:"Assessment and CT criteria (for context)", sub:"CT decisions are made in hospital. Knowing the criteria helps GPs explain referrals and spot missed injuries.",
     blocks:[
       {b:"table", head:["Adults (16 and over)","CT within 1 hour","CT within 8 hours"], rows:[
         ["<b>Criteria</b>","GCS under 13 on initial assessment in ED; GCS under 15 at 2 hours; suspected open or depressed skull fracture; signs of basal skull fracture; post-traumatic seizure; focal neurological deficit; more than one episode of vomiting","Loss of consciousness or amnesia since the injury with any of: age 65 or over, bleeding or clotting disorder, dangerous mechanism, more than 30 minutes of retrograde amnesia. Consider CT within 8 hours for people on anticoagulants or antiplatelets (except aspirin alone) without other indications"]
       ]},
       {b:"table", head:["Children (under 16)","CT within 1 hour (examples)"], rows:[
         ["<b>Criteria</b>","Suspected non-accidental injury; post-traumatic seizure without epilepsy; GCS under 14 on initial assessment (under 15 in babies under 1); GCS under 15 at 2 hours; suspected open, depressed or basal skull fracture or tense fontanelle; focal deficit; in babies under 1, a bruise, swelling or laceration over 5 cm on the head"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"🩺 Examination in primary care", html:"Record GCS (or AVPU), pupils, focal signs, cervical spine tenderness, scalp wounds and skull fracture signs. Use the paediatric GCS for young children.", src:"NICE NG232 (2023)"},
         {tone:"amber", h:"🛡️ Safeguarding", html:"Consider non-accidental injury in any child, particularly in non-mobile babies, inconsistent histories or delayed presentation, and in adults where domestic abuse or elder abuse is possible. Follow local safeguarding procedures.", src:"NICE NG232 (2023) · NICE NG76 (2017)"}
       ]}
     ]},

    {id:"concussion", nav:"Concussion", title:"Managing concussion", sub:"Concussion is a brain injury even without loss of consciousness or a scan abnormality. Recognise, Remove, Recover, Return.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Day 0–2", tone:"cream", title:"Relative rest", when:"first 24–48 hours", fromLabel:"then",
          html:"Rest and sleep as needed. A responsible adult present for the first 24 hours. Avoid alcohol and recreational drugs. Paracetamol for headache. Limit screen time if it worsens symptoms. Call NHS 111 within 24 hours after a suspected sports concussion if not already assessed."},
         {step:"Days 2–14", tone:"cream", title:"Graduated return to daily life", when:"as symptoms allow", fromLabel:"then",
          html:"Gradually increase daily activities, light exercise such as walking, and return to education and work, with adjustments (shorter days, breaks). A mild, short-lived increase in symptoms is acceptable; if symptoms worsen markedly, step back. Return to education and work comes before return to sport."},
         {step:"From about day 14", tone:"amber", title:"Graduated return to sport", when:"symptom-free with daily activity", fromLabel:"then",
          html:"Light aerobic exercise, then sport-specific training without contact, then full contact training if symptom-free. Each stage at least 24 hours."},
         {step:"Day 21 or later", tone:"green", title:"Return to competition", when:"symptom-free", fromLabel:"",
          html:"No return to competitive sport before <b>21 days</b> after the injury, and only when fully symptom-free at rest and with exercise. Symptoms persisting beyond <b>28 days</b> → medical assessment."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"cream", h:"💊 Headache", html:"Paracetamol is preferred. NSAIDs are often avoided in the first 24–48 hours because of bleeding concerns. Avoid opioids. Warn about medication overuse headache if analgesics are used on 15 or more days a month. <span class=mg-dose>Usual adult dose: paracetamol 1 g up to four times daily, maximum 4 g in 24 hours (NICE/SPC; check the SPC, BNF and local formulary; <a href=https://www.medicines.org.uk/emc/search?q=paracetamol target=_blank rel=noopener>SPC: paracetamol</a>).</span>", src:"NICE CG150 (2012, updated 2021) · paracetamol SPC"},
         {tone:"blue", h:"🏃 Who the sports guidance covers", html:"The UK Concussion Guidelines for Non-Elite (Grassroots) Sport (April 2023, updated November 2024) apply to anyone playing sport outside elite settings, adults and children. Under-18s may need a more cautious return. The message is: if in doubt, sit them out.", src:"UK Concussion Guidelines for Non-Elite (Grassroots) Sport"}
       ]},
       {b:"say", html:"You've had a concussion, which is a temporary disturbance of how the brain works. Most people are back to normal within two to four weeks. Rest for a day or two, then build up your normal activities step by step. Go back to school or work before sport, and no competitive sport for at least three weeks. Don't drive until you feel completely back to normal."}
     ]},

    {id:"pcs", nav:"Persisting symptoms", title:"Persisting post-concussion symptoms", sub:"A minority have symptoms for weeks or months.",
     blocks:[
       {b:"kv", rows:[
         ["Symptoms","Headache, dizziness, fatigue, poor concentration and memory, sleep disturbance, irritability, low mood, anxiety, sensitivity to light and noise."],
         ["Assessment","Re-examine; check for red flags of structural injury (worsening headache, drowsiness, focal signs), medication overuse, mood disorder, sleep problems and vestibular dysfunction (for example benign paroxysmal positional vertigo after trauma)."],
         ["Management","Explanation and reassurance, a structured graduated return, sleep hygiene, treat headache and mood, vestibular rehabilitation if dizziness, adjustments at work or school."],
         ["Refer","Symptoms beyond about 4 weeks that are not improving or are disabling: local concussion, brain injury or neurology services; earlier if worsening or red flags."]
       ]}
     ]},

    {id:"special", nav:"Special groups", title:"Special groups", sub:"Where the default plan changes.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"👵 Older people", html:"Falls are the commonest cause of head injury. Lower threshold for the emergency department; consider chronic subdural haematoma in the weeks after a fall, and review falls risk and medicines.", src:"NICE NG232 (2023) · NICE NG249 falls (2025)"},
         {tone:"amber", h:"💊 Anticoagulants and antiplatelets", html:"Refer to the emergency department after any head injury. Do not stop anticoagulation in primary care without specialist advice.", src:"NICE NG232 (2023)"},
         {tone:"amber", h:"🧒 Children", html:"Under 5: irritability or altered behaviour is a referral criterion. Babies: scalp swelling over 5 cm or a tense fontanelle are concerning. Always consider safeguarding.", src:"NICE NG232 (2023)"},
         {tone:"blue", h:"🍺 Intoxication", html:"Alcohol can mask a falling GCS. Do not attribute confusion to alcohol alone after a head injury.", src:"NICE NG232 (2023)"}
       ]}
     ]},

    {id:"driving", nav:"Driving", title:"Driving and work", sub:"Check the current DVLA Assessing fitness to drive guidance.",
     blocks:[
       {b:"table", head:["Situation","Advice"], rows:[
         ["<b>Concussion or minor head injury</b>","Do not drive until fully recovered; DVLA notification not usually needed."],
         ["<b>Traumatic brain injury with intracranial haemorrhage, surgery, or lasting impairment</b>","Must notify DVLA; licensing depends on the injury and recovery. Group 2 has stricter standards."],
         ["<b>Post-traumatic seizure</b>","Must notify DVLA; follow the seizure rules."],
         ["<b>Work</b>","Graduated return with adjustments; fit note if needed. Safety-critical work only when fully recovered."]
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral", sub:"Who, where and how fast.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999", html:"Falling GCS, seizure, focal deficit, penetrating injury, suspected cervical spine injury, basal skull fracture signs.", src:"NICE NG232 (2023)"},
         {tone:"red", h:"Emergency department", html:"Any NG232 risk factor, including loss of consciousness, amnesia, vomiting, persistent headache, anticoagulant or antiplatelet treatment, and suspected non-accidental injury.", src:"NICE NG232 (2023)"},
         {tone:"amber", h:"Concussion, brain injury or neurology service", html:"Post-concussion symptoms beyond about 4 weeks that are not improving.", src:"UK Concussion Guidelines for Non-Elite (Grassroots) Sport"},
         {tone:"green", h:"Primary care", html:"Concussion without NG232 risk factors, with written advice and supervision.", src:"NICE NG232 (2023)"}
       ]}
     ]},

    {id:"patient", nav:"Safety-net", title:"Patient information and safety-netting", sub:"Give NG232-style written head injury advice to the patient and to the person staying with them.",
     blocks:[
       {b:"say", html:"Call 999 if you become very drowsy or hard to wake, confused, have a fit, have weakness in an arm or leg, problems with speech or vision, clear fluid from your nose or ears, or keep vomiting. Go to A&amp;E the same day if your headache gets steadily worse. Someone should stay with you for the first 24 hours. If symptoms are still there after four weeks, come back and see us."},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"📄 Information", html:"NHS website: head injury and concussion; Headway (brain injury charity); UK grassroots concussion guidelines (sportandrecreation.org.uk).", src:"NHS website · Headway"},
         {tone:"green", h:"✅ Before they leave", html:"Written advice given; responsible adult identified; no driving; return-to-sport timeline explained; red flags understood.", src:"NICE NG232 (2023)"}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Scenario", html:"A 72-year-old on apixaban for atrial fibrillation hit his head on a cupboard yesterday. No loss of consciousness, no vomiting, mild headache. He asks for painkillers and does not want to go to hospital.", src:"NICE NG232 (2023)"},
       {tone:"cream", h:"What a good consultation does", html:"Recognises <b>anticoagulant treatment</b> as an NG232 reason for <b>emergency department referral</b> and a CT within 8 hours to be considered, even with no other symptoms. Explains delayed bleeding risk clearly, assesses capacity if he declines, and safety-nets. Does not stop apixaban unilaterally.", src:"NICE NG232 (2023)"}
     ]}]},

     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG232 — Head injury: assessment and early management (May 2023)</b><br><a href="https://www.nice.org.uk/guidance/ng232" rel="noopener">nice.org.uk/guidance/ng232</a><span class="rd"> — community referral criteria; CT within 1 hour and 8 hours for adults and children; anticoagulant and antiplatelet (except aspirin monotherapy) treatment; discharge advice; replaces CG176</span></li>'+
         '<li><b>DCMS / Sport and Recreation Alliance — UK Concussion Guidelines for Non-Elite (Grassroots) Sport (April 2023, updated November 2024)</b><br><a href="https://sportandrecreation.org.uk/policy/research-publications/concussion-guidelines" rel="noopener">sportandrecreation.org.uk — concussion guidelines</a><span class="rd"> — if in doubt, sit them out; NHS 111 within 24 hours; rest 24–48 hours; graduated return; no competitive sport before 21 days; seek review if symptoms beyond 28 days</span></li>'+
         '<li><b>DVLA — Assessing fitness to drive: a guide for medical professionals (current online edition)</b><br><a href="https://www.gov.uk/guidance/assessing-fitness-to-drive-a-guide-for-medical-professionals" rel="noopener">gov.uk — assessing fitness to drive</a><span class="rd"> — head injury, intracranial haemorrhage and seizures</span></li>'+
         '<li><b>NICE CG150 — Headaches in over 12s (2012, updated 2021)</b><br><a href="https://www.nice.org.uk/guidance/cg150" rel="noopener">nice.org.uk/guidance/cg150</a><span class="rd"> — medication overuse headache</span></li>'+
         '<li><b>NICE NG76 — Child abuse and neglect (2017)</b><br><a href="https://www.nice.org.uk/guidance/ng76" rel="noopener">nice.org.uk/guidance/ng76</a><span class="rd"> — recognising non-accidental injury</span></li>'+
         '<li><b>NICE NG249 — Falls: assessment and prevention in older people (2025)</b><br><a href="https://www.nice.org.uk/guidance/ng249" rel="noopener">nice.org.uk/guidance/ng249</a><span class="rd"> — falls assessment</span></li>'+
         '<li><b>Paracetamol SPC</b><br><a href="https://www.medicines.org.uk/emc/search?q=paracetamol" rel="noopener">medicines.org.uk — paracetamol</a><span class="rd"> — dose</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Head injury and concussion — NICE NG232 (2023), UK Concussion Guidelines for Non-Elite (Grassroots) Sport (2023, updated 2024) and DVLA guidance. CT decisions are made in hospital. Check doses in the current SPC, BNF and local formulary. Not a substitute for clinical judgement."
});
