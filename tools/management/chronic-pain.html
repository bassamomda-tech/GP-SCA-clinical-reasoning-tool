MG.render({

  title:"Chronic primary pain — the complete guide",

  stemTitle:"Chronic primary pain is a diagnosis in its own right, not the residue of a failed search for a cause — and the treatments NICE recommends for it are not analgesics",
  stemSub:"One page for the condition: separate chronic primary pain from chronic secondary pain (and recognise that most patients have both), re-screen the red flags that hide inside an established pain history, assess the whole person including function, beliefs, distress and mood, then offer what NICE recommends — supervised group exercise and ACT or pain-focused CBT, with compassionate explanation and attention to sleep. Then the two hardest parts of the consultation: the NG193 do-not-start list, and an individualised, negotiated reduction of the opioid or gabapentinoid the patient came in hoping to increase. Local pathways supersede this educational summary.",
  guideline:"NICE NG193 (2021) · NICE CG173 (2013, updated 2020) · NICE NG215 (2022) · NICE NG226 (2022) · NICE NG12 (updated April 2026) · NICE NG234 (spinal metastases and MSCC) · NICE NG59 (low back pain and sciatica) · MHRA Drug Safety Updates",
  reviewed:"11 September 2026",

  meta:[
    {t:"NICE NG193 — chronic pain (primary and secondary) in over 16s"},

  ],
  lead:'<div class="mg-layers"><a href="#safety"><b>Red flags</b><small>Re-screen every time</small></a><a href="#classify"><b>Classify</b><small>Primary · secondary · both</small></a><a href="#assess"><b>Assess</b><small>Function · mood · meds</small></a><a href="#explain"><b>Explain</b><small>The therapeutic act</small></a><a href="#first-line"><b>First-line</b><small>Exercise · ACT/CBT</small></a></div>',
  quickSub:"If you read nothing else on this page, read these six cards. Sources are listed under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Chronic primary pain is a diagnosis, not a diagnostic failure", html:"Pain persisting or recurring for more than 3 months where there is no clear underlying condition, or where the pain or its impact is out of proportion to observable injury or disease, particularly when associated with significant distress or disability. <b>Naming it is the first treatment.</b> “Your scan is normal, so there is nothing wrong” is one of the most harmful sentences in this consultation — it is misleading (chronic primary pain is a clinical diagnosis based on the overall presentation and its impact; it may involve nociceptive, neuropathic and nociplastic mechanisms, often in combination, and does not mean the pain is psychological or unreal), it invalidates the patient, and it guarantees the management plan will not be heard."},
    {tone:"red", h:"The NG193 do-not-start list", html:"For chronic PRIMARY pain, do not initiate: antiepileptic drugs including gabapentinoids (except gabapentinoids within a clinical trial for CRPS) · antipsychotics · benzodiazepines · corticosteroid trigger-point injections · ketamine · local anaesthetics, topical or intravenous (except within a clinical trial for CRPS) · local anaesthetic/corticosteroid trigger-point injections · NSAIDs · opioids · paracetamol. If a person is already taking one, review the indication, benefits, harms and withdrawal risks through shared decision-making; continue only where there is a documented rationale and acceptable benefit–harm balance, or agree a supported reduction plan. These recommendations apply to chronic <b>primary</b> pain — <b>chronic secondary pain is treated under its own condition guideline</b>."},
    {tone:"amber", h:"The one drug class NG193 says consider — and it is not an analgesic", html:"Consider an antidepressant for people aged 18 and over: amitriptyline, citalopram, duloxetine, fluoxetine, paroxetine or sertraline — after a full discussion of benefits and harms, and <b>explicitly even in the absence of a diagnosis of depression</b>. These antidepressants are off-label when used specifically for chronic primary pain — say so and document it. There is no NICE default choice: decide by informed discussion, comorbidity, adverse effects, interactions and patient preference. Check the current SPC, local formulary and prescribing guidance for dose, contraindications and monitoring, and review benefit at about 4–6 weeks."},
    {tone:"blue", h:"Exercise and ACT/CBT are the treatment, not the consolation prize", html:"Offer a supervised group exercise programme — any modality, graded, patient-chosen; and consider ACT or pain-focused CBT. They aim to improve function, quality of life, distress, sleep and participation; pain reduction may occur but is not the only or necessarily the primary outcome. One course of acupuncture or dry needling may also be considered, only within NG193's restrictions (community setting, band 7 or equivalent/lower-cost professional, no more than 5 hours of healthcare-professional time); repeat courses are not recommended. <b>Do not offer TENS, ultrasound, interferential therapy or biofeedback.</b> The outcome measured is function and quality of life — not the pain score."},
    {tone:"green", h:"Why escalating the opioid rarely helps", html:"Explain that long-term opioids may provide limited sustained benefit and can cause tolerance, dependence, sedation, constipation, falls, endocrine effects and respiratory depression. In some people, opioid-induced hyperalgesia may contribute to increasing pain sensitivity — but do not assume it is the sole explanation for non-response: consider tolerance, disease progression or a new diagnosis, withdrawal between doses, mood, sleep and psychosocial factors, adverse effects, opioid use disorder and an inaccurate original diagnosis. Agree a gradual, individualised reduction plan (NICE NG215), never abrupt, with support; withdrawal symptoms, anxiety, sleep disturbance and temporary worsening of pain may occur — pause or slow the taper if symptoms are intolerable."},
    {tone:"purple", h:"NG12 — the cancers that hide inside chronic back pain", html:"Aged 60 and over with persistent bone pain, particularly back pain, or an unexplained fracture → FBC, calcium, ESR or plasma viscosity, serum protein electrophoresis and serum free light chains, all together for myeloma (urine Bence-Jones if free light chain testing is not available); suspected cancer pathway referral if the results suggest myeloma. Aged 60 and over with weight loss plus back pain → urgent direct-access CT within 2 weeks for pancreatic cancer (or ultrasound if CT is unavailable). Unexplained bone swelling or pain in a child or young person (under 25) → very urgent direct-access X-ray within 48 hours for bone sarcoma — this route does not apply to adults; in adults, an X-ray suggesting bone sarcoma → suspected cancer pathway referral. Restated in <a href='#refer'>Refer</a>."}
  ],
  pathwaySub:"The whole consultation in five moves. The first is a safety screen, the second is a classification, and the third is the one most often skipped.",
  pathway:[
    {title:"Re-screen the red flags — every consultation", html:"Cauda equina (saddle anaesthesia, bilateral leg weakness, bladder or bowel dysfunction) · metastatic cord compression · spinal infection · new or changed spinal pain in a person with current or previous cancer · new, progressive or unexplained night pain with weight loss, systemic symptoms, neurological symptoms or focal spinal tenderness · fever, trauma or immunosuppression · suicidal ideation. At every flare, ask what has changed. An established chronic pain label does not exclude new pathology — it conceals it.", alert:true},
    {title:"Classify: primary, secondary, or both", html:"Chronic primary pain (a clinical diagnosis — fibromyalgia, chronic widespread pain, CRPS, chronic primary headache, chronic primary visceral or musculoskeletal pain) versus chronic secondary pain with an identifiable driver (osteoarthritis, inflammatory arthritis, endometriosis, neuropathic, cancer). They coexist, and the NG193 prohibitions apply only to the primary component. If the diagnosis is uncertain, assess further; revisit the classification when the presentation changes."},
    {title:"Assess the person, not only the pain", html:"Function and what has been lost, with at least one measurable functional outcome · beliefs, catastrophising and fear-avoidance · sleep · mood and suicide risk assessed clinically, with PHQ-9/GAD-7 as aids rather than decision rules · social and occupational context · a full medication and previous-treatment review. <b>No routine imaging and no routine bloods.</b>"},
    {title:"Explain first, then treat", html:"Validate the pain as real, give a compassionate explanation in plain language, then offer supervised exercise, ACT or pain-focused CBT, sleep work and social prescribing — with an antidepressant considered from the NG193 list."},
    {title:"Deprescribe, then review on function", html:"Agree an individualised, NG215-based reduction plan for opioids and gabapentinoids, with support · suggested local review framework (about 4 weeks, 12 weeks and 3–6 months), individualised to risk · annual review documenting functional benefit for every analgesic still prescribed."}
  ],
  sections:[

    {id:"safety", nav:"Red flags", title:"Red flags — what an established pain label conceals",
     sub:"Chronic pain patients get new diseases. Re-screen at every consultation and document that you did.",
     blocks:[
       {b:"table", head:["Feature","Meaning","Action"], rows:[
         ["Saddle anaesthesia, bilateral leg weakness or numbness, bladder or bowel dysfunction, loss of anal tone","<b>Cauda equina syndrome</b> — can develop insidiously on a background of familiar back pain; saddle anaesthesia is the most specific feature","999 or emergency same-day referral for immediate MRI and neurosurgical assessment. Never a routine scan and never “review next week”"],
         ["New limb weakness, sensory loss or paraesthesia, difficulty walking, radicular or band-like pain with neurological symptoms, or bladder or bowel dysfunction, in a person with current or previous cancer","<b>Suspected metastatic spinal cord compression</b> — an oncological emergency","Immediately contact the MSCC coordinator; MRI as soon as possible and always within 24 hours; offer dexamethasone 16 mg orally (or equivalent parenteral dose) as soon as possible when neurological symptoms or signs are present, coordinated with the MSCC pathway (NICE NG234)"],
         ["<b>New or changed spinal pain in a person with current or previous cancer, without neurological symptoms or signs</b>","<b>Possible spinal metastases or malignant nerve infiltration</b>","<b>Urgent clinical assessment and discussion with the local MSCC/oncology pathway — do not simply escalate analgesia.</b> Seek advice through the MSCC coordinator within 24 hours; MRI within 1 week; do not automatically treat as MSCC; immobilisation depends on pain with movement and suspected instability; dexamethasone is not routine without neurological signs, although it may be considered for severe pain or haematological malignancy (NICE NG234)"],
         ["New, progressive or unexplained night pain — particularly with weight loss, systemic symptoms, cancer history, neurological symptoms or focal spinal tenderness","<b>Malignancy (vertebral metastases, myeloma, primary bone tumour), infection, fracture or another secondary cause.</b> Mechanical pain can also disturb sleep — night pain is a red flag only in context","Reassess; FBC, calcium, ESR or plasma viscosity, ALP, LDH and protein electrophoresis as indicated; imaging and its urgency follow the clinical picture and the relevant NG12 or spinal/MSCC pathway — not MRI on night pain and age alone"],
         ["Fever, systemic upset or a focal neurological deficit with back pain; injecting drug use or immunosuppression","<b>Spinal epidural abscess or discitis</b> — mimics a chronic pain flare","Urgent MRI spine, FBC and CRP, blood cultures; emergency admission if septic"],
         ["<b>Suicidal ideation, hopelessness about recovery, or opioid stockpiling</b>","Possible increased suicide risk — assess clinically","Ask directly about suicidal thoughts, intent, plans, access to means, previous attempts, protective factors and immediate safety — do not use a PHQ-9 score alone; document the risk assessment and escalate according to clinical risk and the local urgent mental-health pathway; restrict to monthly or weekly prescription quantities and discuss safe storage"],
         ["Inflammatory pattern — morning stiffness over 45 minutes, night waking in the second half of the night, improvement with exercise, raised CRP or ESR","Axial spondyloarthritis (ankylosing spondylitis), polymyalgia rheumatica or inflammatory arthritis mislabelled as chronic primary pain","Inflammatory markers and rheumatology referral rather than a pain pathway"]
       ]},
       {b:"warn", html:"The failure mode of this consultation is the opposite of over-investigation: everything new gets attributed to the chronic pain. The 58-year-old with 4 years of back pain who now wakes at 3 am and has lost 6 kg is not having a flare. Equally, <b>the patient with a genuinely stable pattern does not need another MRI</b> — incidental disc dehydration and facet arthropathy are near-universal, they reinforce the structural illness belief, and they drive requests for surgery that will not help. <b>Re-screen clinically at every visit; image only for red flags.</b>"},
       {b:"dl", rows:[
         ["<b>NG12 — the criteria that apply here</b>","Myeloma: aged 60 and over with persistent bone pain, particularly back pain, or an unexplained fracture → FBC, calcium, ESR or plasma viscosity, serum protein electrophoresis and serum free light chains, all together (urine Bence-Jones if free light chain testing is not available); suspected cancer pathway referral if the results suggest myeloma. Pancreatic cancer: aged 60 and over with weight loss and back pain → urgent direct-access CT within 2 weeks (urgent ultrasound if CT is not available). Bone sarcoma: unexplained bone swelling or pain in a young person (under 25) → very urgent direct-access X-ray within 48 hours; in adults, an X-ray suggesting bone sarcoma → suspected cancer pathway referral. Restated in <a href='#refer'>Refer</a>"]
       ]}
     ]},

    {id:"classify", nav:"Classify", title:"Chronic primary pain, chronic secondary pain — and both at once",
     sub:"This classification is what decides whether the NG193 prohibitions apply.",
     blocks:[
       {b:"table", head:["Category","Recognising it","What it means for treatment"], rows:[
         ["<b>Chronic primary pain</b>","Pain persisting or recurring for more than 3 months where there is no clear underlying condition, or where the pain or its impact is out of proportion to observable injury or disease, particularly with significant distress or disability — a clinical diagnosis based on the overall presentation. Includes fibromyalgia, chronic widespread pain, complex regional pain syndrome, chronic primary headache and orofacial pain, chronic primary visceral pain and chronic primary musculoskeletal pain (including much non-specific low back pain)","The NG193 pathway: exercise, ACT or CBT, acupuncture within limits, and the named antidepressants considered. The do-not-start list applies in full"],
         ["<b>Chronic secondary pain</b>","Pain with an identifiable underlying condition — osteoarthritis, rheumatoid or psoriatic arthritis, endometriosis, neuropathic pain (including sciatica and lumbar radiculopathy), spinal stenosis, cancer, post-surgical pain, chronic pain after cancer treatment","<b>Treat the underlying condition under its own guideline</b> — CG173 for neuropathic pain, NG59 for sciatica and low back pain, NG226 for osteoarthritis, CG150 for headache, the WHO ladder and specialist services for cancer pain. <b>The NG193 prohibitions do not transfer</b> — a patient with sciatica is not denied analgesia because chronic primary pain guidance says not to start it"],
         ["<b>Both together — the usual situation</b>","Osteoarthritic knees plus widespread nociplastic amplification; a resolved disc prolapse plus 4 years of central sensitisation","Manage each component on its own terms and say so explicitly — the commonest error is treating the whole picture as either one or the other"],
         ["<b>Nociplastic features (central sensitisation)</b>","Allodynia (pain from light touch or clothing) · hyperalgesia · widespread and unpredictable pain · fatigue · cognitive fog · sleep disturbance · hypersensitivity to sound, light and smells","Allodynia may support altered sensory processing, but it does not by itself prove that tissue-directed treatments, injections or surgery will fail. Chronic primary pain may involve nociceptive, neuropathic and nociplastic mechanisms, often in combination"],
         ["<b>Neuropathic features</b>","Burning, shooting, electric-shock pain in a neuroanatomical distribution, with numbness or dysaesthesia; DN4 or S-LANSS supportive","Confirmed neuropathic pain other than sciatica or trigeminal neuralgia: CG173 — offer a choice of amitriptyline, duloxetine, gabapentin or pregabalin, switching if ineffective or not tolerated. Sciatica: follow the NG59 sciatica recommendations — do not offer gabapentinoids. Trigeminal neuralgia: its own pathway, generally carbamazepine with early specialist input. Chronic primary pain: do not initiate gabapentinoids. See the <a href='neuropathic-pain.html'>neuropathic pain protocol</a>"],
         ["<b>Mimics to exclude before settling on primary pain</b>","<b>Hypothyroidism</b> (widespread pain, fatigue, cognitive slowing) · <b>polymyalgia rheumatica</b> · <b>inflammatory arthritis and axial SpA</b> · <b>myeloma and metastatic disease</b> · <b>vitamin D deficiency</b> · <b>statin myalgia and other drug causes</b> · <b>untreated depression</b> · <b>obstructive sleep apnoea</b>","<b>A short targeted screen, not a broad fishing expedition</b> — see <a href='#assess'>Assess</a>"]
       ]},
       {b:"why", html:"<b>The reason this classification carries so much weight is that NG193's most quoted recommendations — do not start opioids, gabapentinoids, paracetamol or NSAIDs — are recommendations about chronic <b>primary</b> pain, and they are routinely misapplied in both directions.</b> Applied too widely, they strip appropriate analgesia from someone with inflammatory arthritis or cancer pain; applied too narrowly, they leave a patient with fibromyalgia on an escalating opioid that is adding harm without lasting benefit. Fibromyalgia is the paradigm chronic primary pain condition: widespread pain, fatigue, unrefreshing sleep and cognitive difficulty, diagnosed clinically on the pattern rather than by tender-point counting, with normal inflammatory markers. It does not need a rheumatology referral to be managed — it needs this pathway."}
     ]},

    {id:"assess", nav:"Assess", title:"Assessment — the whole person, and a functional baseline",
     sub:"A history that captures only site and severity has a pharmaceutical frame, not a chronic pain frame.",
     blocks:[
       {b:"table", head:["Element","What to ask or do","Why it changes management"], rows:[
         ["<b>Open question about life, not pain</b>","“Tell me what the pain has done to your life — what can you no longer do, and what does a typical day look like now compared with before?”","Reveals deconditioning, withdrawal, isolation and identity loss simultaneously — all treatment targets, none of which emerge from “where does it hurt and how bad is it?”"],
         ["<b>Function — the primary outcome</b>","What activities have been given up? Walking distance, stairs, driving, cooking, work, social contact. Record something countable so the next review has a comparator","NG193 measures success by function and quality of life, not pain intensity. A patient who goes from 50 m to 2 km while the score stays at 6/10 has improved meaningfully"],
         ["<b>Catastrophising and fear-avoidance</b>","<b>“When the pain is at its worst, what goes through your mind?”</b> Listen for rumination, magnification and helplessness — the Pain Catastrophising Scale formalises it","Catastrophising and fear-avoidance are targets of ACT and pain-focused CBT, and fear-avoidance can lead to deconditioning and loss of function"],
         ["<b>Mood, sleep and suicide risk</b>","Use PHQ-9 and/or GAD-7 where clinically useful to assess symptoms and monitor change. Ask directly about suicidal thoughts, intent, plans, access to means, previous attempts, protective factors and immediate safety. Sleep pattern and what is disturbing it","Depression and anxiety commonly coexist with chronic pain. Do not use score thresholds alone to determine treatment or suicide risk — escalate according to clinical risk and the local urgent mental-health pathway. Passive thoughts of death need a documented risk assessment, not automatic crisis referral on a PHQ-9 score. Ask about sleep and address reversible contributors"],
         ["<b>Medication and treatment history</b>","Every analgesic, its dose, duration and what function it actually buys. Opioid dose in oral morphine equivalent. Gabapentinoid dose. OTC and codeine-containing purchases. Alcohol and other substances (AUDIT-C where indicated)","Long duration with escalating dose and no functional gain may reflect tolerance, withdrawal between doses, opioid-induced hyperalgesia, disease progression, mood or sleep factors, adverse effects or opioid use disorder — a reason to review and consider reduction, not escalation. Physical dependence is expected with prolonged opioid use and is not synonymous with opioid use disorder. <b>Analgesic overuse also drives medication-overuse headache</b>"],
         ["<b>Social, occupational and financial context</b>","Work, sick notes, benefits, ongoing litigation, caring roles, relationships, isolation","Work absence worsens prognosis and return to modified duties is a treatment goal. The Equality Act 2010 makes workplace adjustment a legal entitlement where pain substantially limits daily activities; PIP, ESA and Access to Work are practical levers, and social prescribing addresses isolation"],
         ["<b>Examination</b>","Focused neurological examination of the limbs (power, reflexes, dermatomal sensation, plantars, straight-leg raise — record whether it reproduces the typical radicular pain, particularly below the knee, and interpret it alongside power, reflexes, sensation and functional findings), range of movement, gait, and observed function from waiting room to chair. Note pain behaviour — grimacing, guarding, disproportionate movement limitation. Widespread tenderness supports a nociplastic picture","Excludes myelopathy and progressive deficit and gives a rehabilitation baseline. Do not use pain behaviour or Waddell signs to label symptoms as non-organic or feigned. Assess observed function, beliefs, fear avoidance, distress, disability and social context in a non-judgemental manner"],
         ["<b>Investigations — targeted, never routine</b>","PHQ-9 and/or GAD-7 where clinically useful. FBC, CRP or ESR only if an inflammatory, infective or malignant cause is suspected; TFTs where there is widespread pain with fatigue — treat hypothyroidism with levothyroxine and reassess the pain once it is normalised; rheumatoid factor, anti-CCP, ANA or HLA-B27 only where an inflammatory cause is genuinely suspected; vitamin D, calcium and bone profile where indicated; HbA1c and B12 if neuropathic features; eGFR and LFTs for analgesic safety; creatine kinase if statin myalgia is possible. <b>No routine imaging in chronic primary pain</b>","Normal inflammatory markers with widespread pain support chronic primary pain. Repeat imaging without red flags reinforces the structural illness model, generates incidental findings and increases anxiety without changing management — a scan ordered for reassurance does not reassure"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"🛡️ Domestic abuse and adverse childhood experiences", html:"Consider assessment of mood, substance use, domestic abuse, trauma, safeguarding and social circumstances according to the presentation, risk indicators and local safeguarding arrangements. Ask about domestic abuse only when it is safe to do so and document the response appropriately — HARK (Humiliation, Afraid, Rape, Kick) may help where indicated. Act according to the actual risk assessment and local safeguarding policy — for example IDVA referral, MARAC where the risk assessment indicates high risk, or children's social care where children are at risk; consider parenting capacity where a parent is severely functionally impaired. <b>A trauma-informed approach changes how the whole plan is delivered.</b>"},
         {tone:"amber", h:"💊 Opioid safety in the household", html:"Review safe storage and the risk of diversion or accidental ingestion where there are children or other vulnerable people at home. Shorter prescription intervals where there is any mood instability, previous overdose or stockpiling. Document the indication and functional benefit at every prescription."},
         {tone:"blue", h:"🧒 Children and carers", html:"Parental chronic pain affects children — reduced engagement, financial hardship, and modelling of pain behaviour. Consider a young carer's assessment where a child is providing care, and a carer's assessment for the partner. Family education about chronic pain is underused and effective."},
         {tone:"amber", h:"🚗 Driving", html:"Advise patients not to drive or operate machinery if pain, fatigue, sedation, dizziness, visual disturbance or impaired concentration affects performance, particularly after starting or changing opioids, gabapentinoids, tricyclics or other sedating medicines. Do not rely on the statutory medical defence — a prescribed medicine does not make driving lawful if the driver is impaired. Check current DVLA guidance where relevant, and record the advice."}
       ]}
     ]},

    {id:"explain", nav:"Explain", title:"The explanation is the intervention",
     sub:"A patient who understands why the pain persists despite a normal scan is more likely to engage with exercise and psychological therapy.",
     blocks:[
       {b:"dl", rows:[
         ["<b>1 · Validate, before anything else</b>","Say that the pain is real, and separate “not visible on a scan” from “not real”. Being told a scan is normal and one should be fine is a deeply invalidating experience, and it is why patients arrive defensive. Acknowledge the years without effective treatment without defending or criticising previous clinicians"],
         ["<b>2 · Explain the mechanism in plain language</b>","Pain neurophysiology education (PNE) can be used as part of compassionate explanation and rehabilitation. The smoke-alarm metaphor is one option — not a mandatory or universally evidenced treatment"],
         ["<b>3 · Offer something specific and achievable today</b>","Not “try to keep active” but one named activity, at a stated frequency, small enough to succeed — a 10-minute walk three times a day, a hydrotherapy or aquatic class, tai chi, yoga, a stationary bike. Success rebuilds confidence"],
         ["<b>4 · Be accurate about prognosis</b>","<b>Chronic primary pain is rarely eliminated but is very manageable.</b> The goal is a full and meaningful life with pain present but not defining it — stated as a realistic aim rather than false optimism or a counsel of despair"]
       ]},
       {b:"say", html:"Think of your pain system like a smoke alarm. After your disc problem the alarm had a real fire to respond to — that was useful, it protected you. But when pain goes on for a long time the alarm can become oversensitive, and it starts going off when there is nothing dangerous happening — it reacts to ordinary signals as though they were threats. So a normal MRI does not mean nothing is wrong; it means the problem is in the alarm system's sensitivity rather than in the structure it is protecting. Your pain is completely real. The important part is that an oversensitive alarm can be turned back down — but the things that turn it down are not the same as the things that fix a torn tissue, and stronger painkillers are not one of them."},
       {b:"say", html:"I want to be honest about the tramadol rather than just say no. You have been on it two years and it is not giving you good relief. Long-term opioids often give limited lasting benefit — the body gets used to them — and they can cause drowsiness, constipation and falls; in some people they can even make the nervous system more sensitive to pain. Morphine is likely to follow the same pattern: some help for a few weeks, then the body adjusting to it. What I would like to do instead is agree a slow, gradual reduction with you, at a pace we adjust together — and we can pause or slow down if it gets hard — alongside the exercise and the psychological therapy."},
       {b:"warn", html:"<b>Two errors bracket this consultation and both lose the patient.</b> Colluding — escalating the opioid because the distress is real and the appointment is nearly over — buys ten minutes and costs years. Refusing flatly, or implying the pain is psychological, ruptures the relationship and sends the patient elsewhere to start again. The only route through is a genuine alternative offered with conviction: the evidence, the mechanism, a named referral and a specific first step."}
     ]},

    {id:"first-line", nav:"First-line", title:"What NG193 actually recommends — the non-drug treatments",
     sub:"These are not what you offer when you have refused the medication. They are the treatment.",
     blocks:[
       {b:"table", head:["Intervention","What to offer","Detail that matters"], rows:[
         ["<b>Supervised group exercise</b>","Offer a supervised group exercise programme tailored to the person's preferences, needs and abilities","Any modality works — walking, aquatic, cycling, yoga, tai chi, strength work. Graded progression and consistency are what matter. The aim is better function, quality of life, distress, sleep and participation; pain reduction may occur but is not the only or necessarily the primary outcome"],
         ["<b>Psychological therapy — ACT or CBT</b>","Consider acceptance and commitment therapy or CBT specifically for pain, delivered by a healthcare professional with appropriate training","Refer to the NHS Talking Therapies long-term-conditions or pain pathway and specify pain-focused ACT or CBT — not generic counselling, and not framed as a referral for depression when the problem is pain. ACT targets the relationship with the thought (“I notice the thought that I will never get better”) rather than its content, and is the better fit for patients who have already tried standard CBT"],
         ["<b>Pain neurophysiology education</b>","Deliver it yourself in the consultation, and ask physiotherapy to continue it alongside exercise","Part of compassionate explanation and rehabilitation — not a mandatory or universally evidenced treatment. Patient resources: <a href='https://livewellwithpain.co.uk' rel='noopener'>livewellwithpain.co.uk</a>, the Pain Toolkit, and <i>Explain Pain</i> (Butler and Moseley)"],
         ["<b>Acupuncture</b>","Consider one course of acupuncture or dry needling for chronic primary pain, only within NG193's restrictions","Only if delivered in a community setting, by an appropriately trained band 7 or equivalent or lower-cost healthcare professional, with no more than 5 hours of healthcare-professional time, or at equivalent or lower cost. NICE found insufficient evidence to recommend repeat courses. Availability varies widely by area — check what is commissioned locally before offering it"],
         ["<b>Sleep</b>","Ask about sleep and address reversible contributors, including pain-related fear, mood disorder, sleep apnoea, restless legs, medicines, alcohol and irregular sleep patterns","Consider referral for CBT-I where clinically indicated and commissioned; sleep hygiene basics — consistent wake time, stimulus control, screens out of the bedroom. Do not start amitriptyline solely as a sleep treatment without considering anticholinergic, cardiac, overdose and falls risks"],
         ["<b>Social prescribing and peer support</b>","Referral to a social prescribing link worker for community activity chosen around the person's values; pain support groups","Social participation is an outcome in its own right. Activities chosen around what the person cares about, not generic advice to get out of the house"],
         ["<b>Work and self-management</b>","Support a graded return to work or modified duties; discuss Equality Act adjustments; fit note used to enable work, not only to withdraw from it","<b>Self-management plans should include a flare plan agreed in advance</b> — what to do for 3–5 bad days that does not involve a dose increase or an emergency appointment"],
         ["<b>What NG193 says not to offer</b>","Do not offer TENS, ultrasound or interferential therapy for chronic primary pain; do not offer biofeedback. <b>Manual therapy alone is not the referral to make</b>","Passive physiotherapy — massage and manipulation on their own — does not address central sensitisation and reinforces the structural model. If the patient says physiotherapy made things worse before, this is usually why, and saying so restores their confidence in trying again"]
       ]},
       {b:"why", html:"Exercise and psychological therapy are recommended first not because the medication was refused but because NICE recommends them for chronic primary pain, while the do-not-start medicines lack evidence of benefit and carry harms — and the patient can be told exactly that. They aim to improve function, quality of life and distress, which pain intensity alone does not capture. Presented as an afterthought at the end of a consultation about tablets, both fail. Presented as the treatment, with a named referral and a specific first step, both work."}
     ]},

    {id:"drugs", nav:"Prescribe", title:"Prescribing — a short list of what to consider, and a longer list of what not to start",
     blocks:[
       {b:"table", head:["Situation","What to use","Notes"], rows:[
         ["<b>Chronic primary pain, any adult 18+</b>","Consider an antidepressant: amitriptyline, citalopram, duloxetine, fluoxetine, paroxetine or sertraline","<b>NG193 supports this even where there is no depression</b>, after discussing benefits and harms and the <b>off-label status</b> of all of these when used specifically for chronic primary pain (duloxetine's licensed pain indication is not chronic primary pain). Choose by informed discussion, comorbidity, adverse effects, interactions and preference — no default choice. Review benefit at about 4–6 weeks and stop if there is none. Cautions include serotonin syndrome, bipolar disorder, cardiac disease, overdose risk, pregnancy, renal or hepatic impairment, and older or frail patients. Check the current SPC, local formulary and prescribing guidance for dose, contraindications and monitoring"],
         ["<b>Depression or anxiety coexisting, or a neuropathic component</b>","Duloxetine is one option — not NICE's default choice","SNRI; licensed for diabetic peripheral neuropathic pain, not chronic primary pain. Adverse effects include nausea, insomnia, sweating, dry mouth and a rise in blood pressure; discontinuation symptoms — taper on stopping. Dose, renal thresholds and monitoring per the current SPC and Greater Manchester formulary"],
         ["<b>Amitriptyline</b>","Start at the lowest possible dose and titrate cautiously; review at about 4–6 weeks","Not a routine hypnotic — do not start it solely for sleep. Anticholinergic burden, morning grogginess, weight gain, cardiac and overdose risk; dose ceiling and any ECG requirement per the current SPC and local prescribing policy; avoid with an MAOI taken within 14 days, in urinary retention, and in acute angle-closure glaucoma; use with great caution or avoid in the frail elderly because of falls and confusion. Review annually and try withdrawal"],
         ["<b>Confirmed neuropathic pain other than sciatica or trigeminal neuralgia</b>","NICE CG173: offer a choice of amitriptyline, duloxetine, gabapentin or pregabalin — switch if ineffective or not tolerated","Gabapentinoids are an option here (for example diabetic neuropathy, post-herpetic neuralgia, chemotherapy-induced or central neuropathic pain) — not for chronic primary pain, sciatica or non-specific low back pain. Consider the indication, renal function, misuse risk, sedation, driving and respiratory-depression risk. Sciatica: follow the NG59 recommendations. Trigeminal neuralgia: carbamazepine and early specialist input. See the <a href='neuropathic-pain.html'>neuropathic pain protocol</a>"],
         ["<b>Localised chronic secondary pain</b> (for example knee or hand osteoarthritis)","Topical NSAID — diclofenac gel, 2–4 g rubbed into the affected area three to four times daily (NG226 for knee osteoarthritis); low-strength capsaicin 0.025–0.075% cream as an alternative","<b>Not for chronic primary pain</b> — NG193 lists NSAIDs and topical local anaesthetics among the drugs not to start. Negligible systemic absorption compared with oral NSAIDs — usable where systemic NSAIDs are avoided. Capsaicin burns on first application; warn the patient or they will stop. High-strength capsaicin 8% patch is specialist-initiated for peripheral neuropathic pain"],
         ["<b>Chronic secondary pain</b>","<b>Treat under the relevant condition guideline</b>","Osteoarthritis, inflammatory arthritis, endometriosis, cancer pain and neuropathic pain each have their own analgesic logic. Where an NSAID is used long-term: lowest effective dose, PPI cover, and review of cardiovascular and renal risk. In renal or hepatic impairment, frailty, liver disease or alcohol excess, choose and dose paracetamol and NSAIDs according to the patient, indication and duration, using the current SPC, local formulary and renal/hepatic dosing guidance"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"⛔ Do not start — opioids", html:"Codeine, tramadol, morphine, oxycodone and the rest have no evidence of long-term benefit in chronic primary pain and cause harm: tolerance, dependence, sedation, constipation, falls, cognitive impairment, endocrine effects such as hypogonadism, respiratory depression and overdose — and, in some people, hyperalgesia. <b>If already prescribed, review benefit, harms and withdrawal risks and agree a plan.</b>"},
         {tone:"red", h:"⛔ Do not start — gabapentinoids", html:"Pregabalin and gabapentin have no evidence in chronic primary pain and carry real harms — sedation, falls, cognitive impairment, dependence and misuse. <b>Class C, Schedule 3 controlled drugs since April 2019.</b> Risk of severe respiratory depression, particularly in older people, renal impairment, respiratory disease and when combined with opioids or other CNS depressants (MHRA) — a combination to unpick, not to build on."},
         {tone:"amber", h:"⛔ Do not start — paracetamol and NSAIDs", html:"NG193 found insufficient evidence of benefit for either in chronic primary pain, and long-term NSAIDs carry GI, cardiovascular and renal risk. This surprises people: paracetamol is not dangerous, it simply does not work for this — so it should not be a standing repeat prescription that nobody reviews."},
         {tone:"amber", h:"⛔ Do not start — benzodiazepines, antiepileptics, antipsychotics, ketamine, injections", html:"Also on the NG193 list for chronic primary pain: antiepileptic drugs including gabapentinoids (except gabapentinoids within a clinical trial for CRPS), antipsychotics, benzodiazepines, ketamine, corticosteroid trigger-point injections, local anaesthetic/corticosteroid trigger-point injections, and local anaesthetics, topical or intravenous (except within a clinical trial for CRPS). Gabapentinoids remain an option for confirmed neuropathic pain other than sciatica under CG173."},
         {tone:"green", h:"✓ Already taking one and it helps", html:"If a person is already taking one of these medicines, review the indication, benefits, harms and withdrawal risks through shared decision-making. Continue only where there is a documented rationale and acceptable benefit–harm balance — dose-stable and regularly reviewed — or agree a supported reduction plan. Continuation is not automatic. The recommendations are about starting, not about a blanket withdrawal of everything already prescribed."},
         {tone:"blue", h:"📋 Document the reasoning", html:"Record: NG193 framework applied; exercise and psychological therapy offered; off-label status discussed for an antidepressant; functional benefit assessment for any analgesic continued; reduction plan where one is agreed; and that red flags were re-screened. At each medication review document the indication, dose and duration, functional benefit, adverse effects, dependence/misuse risk, driving and falls risk, patient preference, and the continuation, reduction or stopping plan."}
       ]}
     ]},

    {id:"taper", nav:"Deprescribe", title:"Deprescribing — individualised and negotiated",
     sub:"Slow, supported, negotiated, and never a punishment.",
     blocks:[
       {b:"table", head:["Step","Detail"], rows:[
         ["<b>Set it up properly</b>","Explain first the limited sustained benefit and the harms of long-term use — with opioid-induced hyperalgesia as one possible contributor, not the sole explanation. Frame it as a treatment with an expected benefit, not the withdrawal of something the patient has earned. Get explicit agreement and document the shared decision; a taper the patient has not agreed to fails"],
         ["<b>Rate</b>","<b>Agree a gradual, individualised reduction plan (NICE NG215).</b> For opioids, reductions should usually be proportionate to the current dose, with progressively smaller decrements at lower doses. Adjust the interval and size of each reduction according to withdrawal symptoms, clinical risk, patient preference and the duration and dose of treatment. <b>Never stop abruptly</b> except in exceptional circumstances (withdrawal: anxiety, sweating, agitation, diarrhoea, muscle aches, insomnia)"],
         ["<b>Support alongside</b>","Psychological support during the taper is not optional — a taper without it has a high failure rate. Book the reviews in advance rather than waiting for the patient to request them"],
         ["<b>Warn about withdrawal</b>","Withdrawal symptoms, anxiety, sleep disturbance and temporary worsening of pain may occur. If symptoms are intolerable, pause or slow the taper and review the plan. Saying this in advance helps prevent the plan being abandoned"],
         ["<b>If the taper stalls</b>","Hold at the current dose rather than reversing; a pause is not a failure. Do not routinely rotate to buprenorphine to facilitate tapering. Seek specialist pain, addiction or palliative-care advice where there is high-dose opioid use, suspected opioid use disorder, complex dependence, repeated failed tapering, complex polypharmacy or significant safety risk. Physical dependence is expected with prolonged opioid use; it is not synonymous with addiction"],
         ["<b>Gabapentinoids</b>","Taper rather than stop — withdrawal is real (anxiety, insomnia, sweating, tachycardia, seizures at high dose). Use a fixed dose reduction at each step, adjusted to withdrawal symptoms, clinical risk and patient preference; slower where the dose is high or there is a history of misuse"],
         ["<b>Benzodiazepines and z-drugs</b>","Follow NG215 — gradual, negotiated withdrawal; abrupt cessation risks seizures. See the <a href='benzodiazepines-z-drugs.html'>benzodiazepine and z-drug protocol</a>"],
         ["<b>Watch for the substitutions</b>","<b>Alcohol, OTC codeine and pregabalin bought online.</b> Ask directly about alcohol and other substances during the taper, using AUDIT-C where indicated"]
       ]},
       {b:"why", html:"Deprescribing looks like the part of the plan that takes something away, and it can be one of the most important. Reducing a medicine that gives little sustained benefit can lessen adverse effects such as constipation, sedation and falls. That rationale has to be offered to the patient explicitly, because on the face of it the proposal sounds counter-intuitive. The corollary is that a taper imposed without explanation, agreement and support is not good medicine — it is the same error as escalation, from the other direction."}
     ]},

    {id:"monitor", nav:"Follow up", title:"Review, monitoring and safety-netting", sub:"Suggested local review framework — not a NICE requirement. Individualise according to risk, treatment changes, dose, withdrawal symptoms, mental-health risk and clinical complexity.",
     blocks:[
       {b:"table", head:["When","What to check"], rows:[
         ["<b>4 weeks</b>","Has the exercise actually started — which activity, how often, what got in the way? First reduction step tolerated? Antidepressant started and tolerated? Psychological therapy referral confirmed? Mood reviewed (PHQ-9 if useful). Any new red flag"],
         ["<b>8–12 weeks</b>","Function against the baseline you recorded — distance, activities resumed — before any discussion of the pain score. Therapy engagement and whether catastrophising is shifting. Next taper step. Antidepressant at target dose and benefit assessed. Sleep"],
         ["<b>3–6 months</b>","Major review: function, return to valued activities, opioid plan reviewed, mood reviewed, exercise established as a habit. If the response is inadequate: revisit the diagnosis, then consider pain clinic or a pain management programme"],
         ["<b>Annually, and at every medication review</b>","<b>Function compared with 3, 6 and 12 months ago · mood and suicide risk assessed clinically (PHQ-9 as an aid) · documented indication, dose, functional benefit, adverse effects, dependence/misuse risk, driving risk, patient preference and continuation, reduction or stopping plan for every analgesic still prescribed · eGFR and LFTs where relevant · falls risk on opioids, gabapentinoids or amitriptyline · weight and blood pressure · pain NRS against the earlier score, read after the functional review rather than before it · <b>consider opioid-induced pituitary suppression where there is fatigue, low mood or sexual dysfunction on long-term opioids — check testosterone or oestradiol</b> · exercise engagement · red flags re-screened</b>"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 999 — same day", html:"Saddle numbness, bilateral leg weakness, or new bladder or bowel dysfunction — call 999, do not wait for an appointment. Give this verbally to every patient with chronic back pain, every time."},
         {tone:"amber", h:"🟠 Contact us the same day", html:"New or rapidly progressive weakness · fever with back pain · new or progressive night pain with weight loss or systemic symptoms · new or changed spinal pain with a cancer history · a pain that has genuinely changed in character or site."},
         {tone:"blue", h:"💊 During a reduction", html:"“You may notice withdrawal symptoms, anxiety, poor sleep or a temporary increase in pain after a reduction. If it becomes hard to tolerate, tell us — we can pause or slow down and review the plan.”"},
         {tone:"red", h:"🔴 Crisis", html:"“If the pain and the hopelessness ever reach the point where you feel you cannot go on, contact us the same day, call Samaritans on 116 123, or go to A&amp;E. There is always a next step — we are not out of options.”"}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Emergency — same day", html:"Suspected cauda equina syndrome; suspected metastatic spinal cord compression — contact the MSCC coordinator immediately; spinal infection with sepsis; high suicide risk on clinical assessment, via the local urgent mental-health pathway."},
         {tone:"purple", h:"Suspected cancer · NICE NG12 (updated April 2026)", html:"Myeloma: aged 60 and over with persistent bone pain, particularly back pain, or an unexplained fracture → FBC, calcium, ESR or plasma viscosity, serum protein electrophoresis and serum free light chains, all together (urine Bence-Jones if free light chain testing is not available); suspected cancer pathway referral if the results suggest myeloma. Pancreatic cancer: aged 60 and over with weight loss and back pain → urgent direct-access CT within 2 weeks (or ultrasound if CT is unavailable). Bone sarcoma: unexplained bone swelling or pain in a child or young person (under 25) → very urgent direct-access X-ray within 48 hours; in adults, an X-ray suggesting bone sarcoma → suspected cancer pathway referral."},
         {tone:"blue", h:"Physiotherapy", html:"For a supervised graded exercise programme with pain neurophysiology education — state this explicitly. <b>Not passive treatment alone.</b>"},
         {tone:"blue", h:"NHS Talking Therapies — pain pathway", html:"<b>Pain-focused ACT or CBT, self-referral possible.</b> Include the diagnosis, duration, PHQ-9 and GAD-7 scores and previous treatments. <b>Do not label it as a depression referral if the problem is the pain.</b>"},
         {tone:"amber", h:"Pain clinic", html:"Referral need not wait until exercise, psychological therapy and medication optimisation have all failed. Consider early specialist advice for severe functional limitation, high-dose or complex opioid use, suspected opioid use disorder, repeated unsuccessful withdrawal, major psychiatric comorbidity, diagnostic uncertainty, significant neurological deficit, or failure to engage with or benefit from an appropriate rehabilitation plan; and for consideration of specialist interventions. <b>Do not refer expecting medication escalation</b> — pain services offer MDT assessment and follow NG193 too."},
         {tone:"amber", h:"Pain management programme", html:"Severe refractory chronic primary pain with high disability and high catastrophising. Multidisciplinary group programme. Severe, complex or high-risk patients may appropriately need early multidisciplinary assessment."},
         {tone:"green", h:"Rheumatology / specialty", html:"Raised inflammatory markers, synovitis or an inflammatory pattern; diagnostic uncertainty. <b>Fibromyalgia itself does not require rheumatology to be managed.</b>"},
         {tone:"cream", h:"GP management", html:"Most chronic primary pain is managed here: explanation, supervised exercise, psychological therapy, sleep, social prescribing, an antidepressant considered, deprescribing, and review on function. Use the local Bolton/Greater Manchester MSCC, pain, addiction and urgent mental-health pathways; local pathways supersede this summary. Regional and site-specific pain is covered by its own pathway, not here — those presentations need a diagnosis before a pain framework applies. Related pages: <a href='neuropathic-pain.html'>neuropathic pain</a> · <a href='opioid-prescribing.html'>opioids in non-cancer pain</a> · <a href='osteoarthritis.html'>osteoarthritis</a> · <a href='me-cfs.html'>ME/CFS</a> · <a href='sciatica.html'>sciatica pathway</a> · <a href='../algorithms/chronic-back-pain.html'>chronic back pain</a> · <a href='../algorithms/shoulder-pain.html'>shoulder pain</a> · <a href='../../cases/chronic-pain.html'>the casebook chapter</a>."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 58-year-old retired teacher asks for “something stronger — maybe morphine” for 4 years of low back pain. A disc prolapse resolved radiologically; a recent MRI showed disc dehydration only. She rates the pain 7–8/10, has been on <b>tramadol 100 mg BD and duloxetine 60 mg OD for 2 years</b> with incomplete relief, has stopped walking, gardening and her book club, sleeps poorly, and has a <b>PHQ-9 of 12</b> with a passive death wish. She says previous doctors told her the scan was normal and she should be fine, and she opens with “I don't want to be told it's all in my head.”"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"<b>Validates the pain as real BEFORE explaining anything</b>, and separates “not on the scan” from “not real”; <b>re-screens cauda equina and the malignancy red flags</b>; <b>asks directly about suicidal thoughts, intent, plans and means and documents a risk assessment</b> (PHQ-9 as an aid, not a decision rule); identifies <b>catastrophising and fear-avoidance</b>; <b>explains the limited sustained benefit and harms of long-term opioids, including possible hyperalgesia</b> rather than refusing flatly; offers supervised exercise and pain-focused ACT as the treatment, with a named first step, and explains why the previous passive physiotherapy is not what is being proposed; agrees an individualised, gradual tramadol reduction plan that can be paused or slowed, with withdrawal symptoms warned about; addresses the duloxetine already in place rather than adding a drug; <b>does not order another MRI and says why</b>; gives the <b>cauda equina safety-net verbally</b>; and frames the goal as a meaningful life alongside pain rather than a pain-free one."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Major recommendations are linked to the specific NICE recommendation numbers where available.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>NICE NG193 — Chronic pain (primary and secondary) in over 16s: assessment of all chronic pain and management of chronic primary pain (2021)<br><a href="https://www.nice.org.uk/guidance/ng193" rel="noopener">nice.org.uk/guidance/ng193</a><span class="rd"> — the primary/secondary framework and assessment (recommendations 1.1); supervised group exercise (1.2.1–1.2.2); ACT and CBT (1.2.3); one course of acupuncture/dry needling within stated resource limits (1.2.5); the named antidepressants considered even without depression (1.2.7); the do-not-initiate list (1.2.10); review of existing medicines (1.2.11–1.2.12)</span></li>'+
         '<li><b>NICE NG193 \u2014 Chronic pain (primary and secondary) in over 16s</b><br><a href="https://www.nice.org.uk/guidance/ng193" rel="noopener">nice.org.uk/guidance/ng193</a><span class="rd"> — primary-care assessment and the biopsychosocial review structure; the review intervals on this page are a suggested local framework, not an NG193 requirement</span></li>'+
         '<li><b>NICE CG173 — Neuropathic pain in adults: pharmacological management (2013, updated 2020)</b><br><a href="https://www.nice.org.uk/guidance/cg173" rel="noopener">nice.org.uk/guidance/cg173</a><span class="rd"> — a choice of four agents for neuropathic pain other than trigeminal neuralgia, switching if ineffective or not tolerated; referral at any stage for severe or complex pain</span></li>'+
         '<li>NICE NG215 — Medicines associated with dependence or withdrawal symptoms (2022)<br><a href="https://www.nice.org.uk/guidance/ng215" rel="noopener">nice.org.uk/guidance/ng215</a><span class="rd"> — no abrupt cessation; slow, stepwise, individualised reduction — proportionate and progressively smaller decrements for opioids, fixed decrements for gabapentinoids; pause or slow if withdrawal is difficult; shared decision-making</span></li>'+
         '<li><b>NICE NG226 — Osteoarthritis in over 16s: diagnosis and management (2022)</b><br><a href="https://www.nice.org.uk/guidance/ng226" rel="noopener">nice.org.uk/guidance/ng226</a><span class="rd"> — topical NSAIDs for knee osteoarthritis, the example of localised chronic secondary pain used on this page</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — myeloma bloods at 60 and over with persistent bone or back pain, pancreatic CT at 60 and over with weight loss and back pain, the 48-hour X-ray for suspected bone sarcoma in children and young people, and suspected cancer pathway referral for adults whose X-ray suggests bone sarcoma</span></li>'+
         '<li><b>NICE NG234 — Spinal metastases and metastatic spinal cord compression</b><br><a href="https://www.nice.org.uk/guidance/ng234" rel="noopener">nice.org.uk/guidance/ng234</a><span class="rd"> — MRI within 24 hours and dexamethasone 16 mg for suspected MSCC with neurological symptoms or signs; MSCC coordinator advice within 24 hours and MRI within 1 week for suspected spinal metastases without MSCC features</span></li>'+
         '<li><b>NICE NG59 — Low back pain and sciatica in over 16s</b><br><a href="https://www.nice.org.uk/guidance/ng59" rel="noopener">nice.org.uk/guidance/ng59</a><span class="rd"> — sciatica managed under its own recommendations; gabapentinoids not offered for sciatica</span></li>'+
         '<li><b>MHRA Drug Safety Updates</b><br><a href="https://www.gov.uk/drug-safety-update/pregabalin-lyrica-gabapentin-neurontin-and-risk-of-abuse-and-dependence-new-scheduling-requirements-from-1-april" rel="noopener">gov.uk — gabapentinoids: abuse, dependence and rescheduling</a> · <a href="https://www.gov.uk/drug-safety-update/pregabalin-lyrica-reports-of-severe-respiratory-depression" rel="noopener">gov.uk — pregabalin: severe respiratory depression</a> · <a href="https://www.gov.uk/drug-safety-update/benzodiazepines-and-opioids-reminder-of-risk-of-potentially-fatal-respiratory-depression" rel="noopener">gov.uk — opioids with CNS depressants: respiratory depression</a><span class="rd"> — gabapentin and pregabalin reclassified as Class C controlled drugs (April 2019); additive respiratory depression when gabapentinoids are combined with opioids; opioid dependence and long-term-use warnings (2020)</span></li>'+
         '<li><b>Faculty of Pain Medicine — Opioids Aware</b><br><a href="https://fpm.ac.uk/opioids-aware" rel="noopener">fpm.ac.uk/opioids-aware</a><span class="rd"> — oral morphine equivalence, the harms of long-term opioid use in non-cancer pain, and an individualised, shared-decision approach to opioid optimisation; its taper examples are not universal rules</span></li>'+
         '<li><b>Faculty of Pain Medicine — Guidance for members on driving and pain</b> (8 February 2018)<br><a href="https://fpm.ac.uk/" rel="noopener">fpm.ac.uk</a><span class="rd"> — driving with pain and sedating medicines</span></li>'+
         '<li><b>Live Well with Pain · Pain Toolkit · <i>Explain Pain</i> (Butler and Moseley)</b><br><a href="https://livewellwithpain.co.uk" rel="noopener">livewellwithpain.co.uk</a><span class="rd"> — the patient-facing pain neurophysiology education resources referenced on this page</span></li>'+
         '<li><b>Equality Act 2010</b><span class="rd"> — workplace adjustment entitlement where chronic pain substantially limits day-to-day activities</span></li>'+
         '</ul></div>'},
       {b:"why", html:"This is an educational summary; local pathways supersede it. Verify all medicine doses and monitoring requirements against the current SPCs and the Greater Manchester formulary, and add local Bolton/Greater Manchester referral contacts for MSCC, pain, addiction and urgent mental-health services before standalone clinical use."}
     ]}
  ],
  foot:"Chronic primary pain — NICE NG193 (2021), CG173 (updated 2020), NG215 (2022), NG226 (2022) and NG12 (updated April 2026). Chronic primary pain is a diagnosis, not a diagnostic failure: name it, explain it, and treat it with supervised exercise and pain-focused psychological therapy. Do not initiate opioids, gabapentinoids or other antiepileptics, paracetamol, NSAIDs, benzodiazepines, antipsychotics, ketamine, corticosteroid or local anaesthetic/corticosteroid trigger-point injections or local anaesthetics for it (CRPS trial exceptions apply) — and review what is already there, agreeing an individualised, NG215-based reduction plan with support where appropriate. Suspected MSCC: contact the MSCC coordinator immediately (NICE NG234). Chronic secondary pain is managed under its own condition guideline. Verify all doses against the current SPC, BNF and Greater Manchester formulary before prescribing. Local pathways supersede this summary."
});
