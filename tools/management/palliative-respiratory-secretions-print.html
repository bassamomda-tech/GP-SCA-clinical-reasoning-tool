MG.render({
  icon:"\u{1F54A}️",

  stemTitle:"Noisy respiratory secretions — find the cause, explain, reposition, then trial an antimuscarinic early and review it",
  stemSub:"A practical protocol for noisy upper-airway secretions in a person in the last days of life. The noise is usually more distressing to those at the bedside than to the dying person, so explanation is treatment. Non-drug measures come first; an antimuscarinic is a <b>trial</b>, monitored at least every 12 hours and stopped if it is not helping. These drugs dry new secretions but do not clear pooled ones, so start early. The evidence that any drug beats placebo is weak.",

  meta:[
    {t:"NICE NG31 (2015) · Care of dying adults in the last days of life"},
    {t:"NICE QS144 (2017) · quality standard"},
    {t:"Cochrane CD005177 (Wee &amp; Hillier 2008)"},

  ],
  lead:'<div class="mg-layers"><a href="#assess"><b>Assess</b><small>Cause and differentials</small></a><a href="#family"><b>Explain</b><small>The family conversation</small></a><a href="#nondrug"><b>Non-drug</b><small>Position, fluids, mouth</small></a><a href="#drugs"><b>Antimuscarinic trial</b><small>Choose, give, review at 12 h</small></a></div>',
  glance:[
    {lbl:"First", val:"Assess + explain", sub:"cause, and the family's worry"},
    {lbl:"Non-drug", val:"Reposition", sub:"lateral / semi-prone; review fluids"},
    {lbl:"Drug trial", val:"Antimuscarinic", sub:"atropine, glycopyrronium, hyoscine butyl- or hydrobromide"},
    {lbl:"Review", val:"≥12-hourly", sub:"preferably 4-hourly (NG31)"},

  ],
  quickSub:"If you read nothing else, read these cards. Each is traced to its source under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"blue", h:"It usually does not distress the dying person", html:"The rattle comes from secretions pooling in the throat and upper airway of someone too weak or drowsy to cough or swallow them. NICE NG31 asks you to assess the likely cause and <b>reassure the family</b> that, although the noise can be distressing, it is <b>unlikely to cause the person discomfort</b>."},
    {tone:"amber", h:"Assess the cause before reaching for a drug", html:"NG31 starts with <b>assessing possible causes</b>. Not every wet chest in the dying is pooled saliva: consider <b>pulmonary oedema</b> (including fluid overload from clinically assisted hydration), <b>chest infection</b> and <b>aspiration</b>. The treatment and the conversation differ."},
    {tone:"green", h:"Non-drug measures first", html:"Reposition (side-lying or semi-prone to let secretions drain), mouth care, and review any clinically assisted hydration. <b>Deep suction is rarely helpful</b> and can distress the patient; gentle oral suction only for secretions pooled in the mouth."},
    {tone:"plain", h:"An antimuscarinic is a trial, not a fixture", html:"If the secretions are distressing, NG31 supports a trial of <b>atropine, glycopyrronium, hyoscine butylbromide or hyoscine hydrobromide</b>. Monitor <b>at least every 12 hours, preferably every 4 hours</b>; consider changing or stopping if there is no benefit after <b>12 hours</b>."},
    {tone:"red", h:"Watch for central side effects", html:"NG31: monitor for <b>delirium, agitation or excessive sedation</b> with <b>atropine or hyoscine hydrobromide</b> (both cross the blood–brain barrier). <b>Glycopyrronium and hyoscine butylbromide</b> are quaternary and do not cross it to a significant extent — less sedation and confusion."},
    {tone:"blue", h:"Be honest about the evidence", html:"The Cochrane review (Wee &amp; Hillier 2008) found <b>no evidence that any intervention, drug or non-drug, is superior to placebo</b>. Set realistic expectations: success is judged by comfort and a family that understands, not by silence."}
  ],
  pathwaySub:"The whole approach in six moves. The alert step is where harm happens: a drug started without assessment, or never reviewed.",
  pathway:[
    {title:"Recognise and assess", html:"Confirm the person is thought to be in the last days of life (see <a href=\"../management/care-of-the-dying.html\">Care of the dying adult</a>). Listen, look and ask: is this upper-airway pooling, or pulmonary oedema, infection or aspiration? Review fluids and current medicines."},
    {title:"Explain to the family", html:"Name it, explain the cause, say it is unlikely to be uncomfortable for the person, and say what you will do. Acknowledge that it is hard to listen to. This is the single most effective intervention for the people in the room."},
    {title:"Non-drug measures", html:"Reposition (lateral or semi-prone, head slightly lowered if tolerated); mouth care; gentle oral suction only for visible pooled secretions; review and, if appropriate, reduce clinically assisted hydration."},
    {title:"Trial an antimuscarinic — early", html:"If the secretions are distressing (to the person, or distress persists despite explanation), give a PRN SC dose of the locally chosen antimuscarinic, from the anticipatory medicines already in the home. Start early: these drugs reduce <b>new</b> secretion but do not clear what has already pooled.", alert:true},
    {title:"Review at 4–12 hours", html:"NG31: monitor at least 12-hourly, preferably 4-hourly, for benefit and for side effects. If recurring after PRN doses, the chosen drug is often continued by CSCI (syringe pump). If no benefit after 12 hours, consider switching or stopping."},
    {title:"Support and escalate", html:"Keep explaining; document the plan; hand over to district nurses and out-of-hours; seek specialist palliative care advice for refractory secretions or diagnostic uncertainty."}
  ],
  sections:[

    {id:"assess", nav:"Recognise", title:"What it is and how to assess it", sub:"Noisy breathing from secretions in the oropharynx and upper airways in someone who can no longer clear them. Common in the last hours to days of life.",
     blocks:[
       {b:"kv", rows:[
         ["What it is","Noisy, rattling or gurgling breathing, from turbulent airflow over secretions pooling in the oropharynx or upper airways, in a person too weak or drowsy to cough or swallow them. Often called “death rattle” — a term many families find frightening, so avoid it at the bedside."],
         ["How common","Reported in roughly <b>23–92%</b> of dying people in the studies summarised by the Cochrane review — the wide range reflects different definitions and settings."],
         ["What it signals","It usually appears when death is close (hours to a few days). It is a sign of dying, not usually a separate problem to be “fixed”."],
         ["Who it distresses","Usually <b>more distressing to family and staff than to the (typically unconscious) patient</b>. Explanation and reassurance are central to management."],
         ["What NG31 asks first","Assess for the possible causes, and talk to the dying person (if possible) and those important to them about the cause and what can be done."]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Assess the cause", html:"NG31 asks you to assess the possible causes of noisy respiratory secretions before managing them, and to consider non-pharmacological measures to reduce distress.", src:"NICE NG31 (2015)"}
       ]},
       {b:"dl", rows:[
         ["Bedside questions","Is the person conscious or distressed? Is the noise from the throat (gurgling, varies with position) or the chest (crackles, frothy sputum, breathlessness)? Any fever or purulent sputum? Any recent choking, vomiting or feeding? What fluids are running, and how much?"],
         ["Look for","Visible pooled saliva in the mouth; dependent oedema, raised JVP or fine crackles (fluid overload/heart failure); fever or new focal signs (infection); a history of dysphagia or vomiting (aspiration)."],
         ["Medicines review","Clinically assisted hydration (SC or IV), feeds, and any recent changes. Anticipatory medicines in the home — is an antimuscarinic prescribed with indication, dose and route?"]
       ]},
       {b:"why", html:"The same sound can come from saliva pooled in the pharynx, bronchial secretions, pulmonary oedema or aspirated material. An antimuscarinic only reduces new salivary and bronchial secretion; it does nothing for oedema fluid or pus, and it will not help secretions that have already collected. Assessing first stops you giving a drug that cannot work and missing a cause that can be eased (for example by stopping fluids)."}
     ]},

    {id:"diff", nav:"Differentials", title:"Differentials and when it is not “just secretions”", sub:"The response depends on the person's goals of care. In the last days of life most causes are managed for comfort, not reversed.",
     blocks:[
       {b:"table", head:["Cause","Clues","Comfort-focused response"], rows:[
         ["<b>Pooled oropharyngeal secretions</b> (typical “death rattle”)","Unconscious or very drowsy; gurgling that changes with position; no fever, no breathlessness","Explain, reposition, mouth care; antimuscarinic trial if distressing"],
         ["<b>Pulmonary oedema / fluid overload</b>","Known heart failure, raised JVP, peripheral oedema, fine crackles, frothy sputum; running SC/IV fluids","Review and reduce or stop clinically assisted hydration; consider diuretic and seek advice. Antimuscarinics will not help oedema fluid"],
         ["<b>Chest infection</b>","Fever, purulent sputum, new focal signs; person may be more aware and distressed","Decide with the person/family whether antibiotics fit their goals; treat symptoms (fever, breathlessness) either way"],
         ["<b>Aspiration</b>","Recent vomiting, choking on fluids or feeds, dysphagia (e.g. MND, stroke, head and neck cancer)","Stop oral intake that causes choking; position upright or side-lying; mouth care; seek advice"],
         ["<b>Tumour-related</b> (bronchorrhoea, airway tumour, haemoptysis)","Known lung or head and neck cancer; copious watery sputum or blood","Specialist palliative care advice; plan for a catastrophic bleed if relevant"]
       ]},
       {b:"warn", html:"<b>Not certain the person is dying?</b> If they may be stabilising or recovering, or the cause may be reversible and treatment matches their wishes, reassess rather than defaulting to end-of-life symptom control. NG31 asks for regular reassessment of whether the person is dying, stabilising or recovering, and QS144 statement 1 sets this as a quality standard. See <a href=\"../management/care-of-the-dying.html\">Care of the dying adult</a>."},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"Wet chest on clinically assisted hydration", html:"Assess hydration status daily and discuss the risks and benefits of hydration options with the person and those important to them. Signs of fluid overload (oedema, rising secretions) are a reason to review and reduce the fluids.", src:"NICE QS144 (2017) statement 4"},
         {tone:"red", h:"Sudden distress, not a gradual rattle", html:"Acute breathlessness, stridor, choking, or massive haemoptysis is a different emergency. Use the anticipatory plan for crisis medication and call for urgent palliative or out-of-hours support. 999 only if it matches the person's wishes and escalation plan."}
       ]}
     ]},

    {id:"family", nav:"Explain", title:"Explaining to the family", sub:"The most important intervention. NG31 frames it as a conversation about cause, likely comfort and what will be done.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"What NG31 asks you to cover", html:"Assess the likely causes, establish whether the noise is having an impact on the dying person or those important to them, and reassure them that, although the noise can be distressing, it is <b>unlikely to cause discomfort</b>.", src:"NICE NG31 (2015)"},
         {tone:"amber", h:"Set expectations about medicines", html:"The medicine dries up new secretions but cannot remove what has already collected, may take hours to help, and does not always work. Its effect will be reviewed and it will be stopped if it is not helping.", src:"NICE NG31 (2015) · Scottish Palliative Care Guidelines PIL (2024)"}
       ]},
       {b:"dl", rows:[
         ["Checking understanding","Ask what they have noticed and what they are worried about. Families often fear the person is drowning or choking, or is thirsty. Name the fear and answer it directly."],
         ["Avoid the phrase “death rattle”","Use “noisy breathing” or “secretions at the back of the throat”. Be honest that it usually means death is close, if they ask or seem ready to hear it."]
       ]},
       {b:"say", html:"“The noise you can hear is caused by a little saliva and fluid collecting at the back of the throat. Your mum is now too sleepy to swallow or cough it away, which is a normal part of the body slowing down. I know it's hard to listen to, but from everything we understand it doesn't seem to trouble the person themselves — she isn't choking or struggling. We'll turn her onto her side, which often helps, keep her mouth moist, and we can give a medicine that dries up new secretions. It works best if started early and it doesn't always stop the sound completely, so the nurses will check how she's doing and stop it if it isn't helping.”"},
       {b:"why", html:"Family members may remember the sounds of a death for a long time, and what they were told about them. Because the evidence for drugs is weak, a clear and compassionate explanation is the part of this protocol most likely to make a real difference to those in the room."}
     ]},

    {id:"nondrug", nav:"Non-drug", title:"Non-drug measures", sub:"NG31 asks you to consider non-pharmacological measures for noisy secretions to reduce distress. These are low-risk and should always be tried.",
     blocks:[
       {b:"tiles", v:"life", items:[
         {t:"\u{1F6CF}️ Reposition", html:"Turn onto the side or semi-prone, head slightly down if tolerated, to let secretions drain from the pharynx. Often the quickest improvement. Reposition regularly for pressure care anyway."},
         {t:"\u{1F4A7} Review fluids", html:"Review clinically assisted hydration (SC or IV) daily. If secretions are increasing, reduce or stop fluids that may be adding to them or causing oedema — a shared decision with the family."},
         {t:"\u{1F444} Mouth care", html:"Keep the mouth clean and moist (sponge, gel, lip balm). Antimuscarinics dry the mouth, so mouth care becomes more important once one is started."},
         {t:"\u{1F6AB} Avoid deep suction", html:"Deep pharyngeal or tracheal suction is rarely helpful, can provoke gagging and more secretions, and distresses the person and family. Gentle oral suction only for visible secretions pooled in the mouth."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"Consider non-pharmacological measures", html:"NG31 recommends considering non-pharmacological measures to manage noisy respiratory secretions to reduce distress in the dying person.", src:"NICE NG31 (2015)"},
         {tone:"amber", h:"Hydration: assess daily, discuss openly", html:"Hydration status assessed daily, with a discussion of risks and benefits of hydration options. Clinically assisted hydration may help thirst in some people but can worsen secretions and oedema in others — review it if secretions increase.", src:"NICE QS144 (2017) statement 4"}
       ]},
       {b:"why", html:"Repositioning uses gravity to move pooled secretions away from the larynx and changes the airflow that makes the noise. Deep suction is invasive and stimulates further secretion; in a person who is dying, the balance of harm and benefit is poor. Avoiding fluid overload matters because oedema fluid in the lungs produces a similar noise that no antimuscarinic will treat."}
     ]},

    {id:"drugs", nav:"Antimuscarinic trial", title:"Antimuscarinic trial — which drug and how to use it", sub:"NG31 names four antimuscarinics and does not rank them. Choice follows local end-of-life formulary and the person's situation; doses per local guidance or BNF.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1", title:"Decide whether a drug trial is warranted", when:"secretions causing distress",
          html:"NG31: consider a trial of medicine if the secretions are causing distress to the dying person. In practice, a trial is also commonly used when the family remains distressed despite explanation and non-drug measures — discuss this openly, and be clear that the drug is for comfort."},
         {step:"2", title:"Choose one antimuscarinic", when:"per local formulary",
          fromLabel:"tailor to the person",
          html:"<b>Glycopyrronium</b> or <b>hyoscine butylbromide</b> (do not cross the blood–brain barrier significantly: less sedation and confusion), or <b>hyoscine hydrobromide</b> or <b>atropine</b> (cross it: more sedation, delirium and agitation). Many UK local formularies list glycopyrronium or hyoscine butylbromide first. <b>Do not combine two antimuscarinics.</b>"},
         {step:"3", title:"Give early, PRN subcutaneously", when:"at the first rattle",
          fromLabel:"dries new, not pooled, secretions",
          html:"Use the anticipatory supply already in the home. Start at the first sign rather than waiting: the drug reduces new secretion but cannot clear what has already pooled. Doses per local end-of-life formulary or BNF (see drug table below)."},
         {step:"4", title:"Continue by syringe pump if recurring", when:"repeated PRN doses",
          fromLabel:"escalate delivery, not the number of drugs",
          html:"If secretions recur after PRN doses and the drug is helping, the same antimuscarinic is usually given by continuous subcutaneous infusion (CSCI), with PRN doses still available. Check compatibility with other syringe-pump drugs (local guidance)."},
         {step:"5", title:"Review at 4–12 hours; stop or switch if no benefit", when:"NG31 monitoring rule",
          fromLabel:"a trial must be reviewed",
          html:"Monitor for benefit <b>at least every 12 hours, preferably every 4 hours</b>. Medicines may take up to 12 hours to become effective, so consider <b>changing or stopping</b> if secretions continue to cause distress after 12 hours. Monitor for side effects throughout.", warn:true, tone:"red"}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"plain", h:"The four named antimuscarinics", html:"When choosing, NG31 lists <b>atropine, glycopyrronium bromide, hyoscine butylbromide and hyoscine hydrobromide</b>, and does not rank them.", src:"NICE NG31 (2015)"},
         {tone:"red", h:"Central side effects", html:"Monitor regularly for side effects, particularly <b>delirium, agitation or excessive sedation</b> when using <b>atropine or hyoscine hydrobromide</b>.", src:"NICE NG31 (2015)"},
         {tone:"blue", h:"Monitoring frequency", html:"Monitor for improvement preferably every 4 hours, but at least every 12 hours. Consider changing or stopping if secretions continue and are still causing distress after 12 hours.", src:"NICE NG31 (2015)"},
         {tone:"amber", h:"Anticipatory prescribing", html:"Prescribe anticipatory medicines with individualised indications, dosage and route for adults likely to need symptom control in the last days of life — an antimuscarinic for secretions is usually one of these.", src:"NICE QS144 (2017) statement 3"}
       ]}
     ]},

    {id:"drugtable", nav:"Drug choice", title:"Drug choice and cautions", sub:"Pharmacology the GP needs. Doses are deliberately not reproduced here except where a named guideline was checked: use your local end-of-life formulary or the BNF.",
     blocks:[
       {b:"table", head:["Drug","Crosses the blood–brain barrier?","Practical points","Dose"], rows:[
         ["<b>Glycopyrronium bromide</b>","No (quaternary)","Little sedation or delirium. Often first-line in local formularies. SC PRN and by CSCI","<b>200 micrograms SC</b> PRN (Scottish Palliative Care Guidelines). Repeat interval, 24-hour maximum and CSCI dose differ between UK guidelines: per local formulary/BNF"],
         ["<b>Hyoscine butylbromide</b>","No (quaternary)","Little sedation. Also used for colic and bowel obstruction. SC PRN and by CSCI. Different drug from hyoscine hydrobromide — check the salt on every chart","Per local formulary/BNF"],
         ["<b>Hyoscine hydrobromide</b>","Yes","Sedating; can cause <b>delirium, agitation</b> (paradoxical excitation) — NG31 caution. Also available as a transdermal patch (off-label for secretions)","Per local formulary/BNF. Patch: Scottish Palliative Care Guidelines leaflet describes a <b>1.5 mg patch</b> behind the ear changed every <b>72 hours</b>"],
         ["<b>Atropine</b>","Yes","Can cause delirium, agitation, sedation and tachycardia — NG31 caution. Sometimes used sublingually (eye-drop preparation) off-label","Per local formulary/BNF"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"Hyoscine hydrobromide patch", html:"A patch prevents new secretions forming but has <b>no effect on secretions already formed</b>. Its use for secretions is outside the licence, which is common and accepted practice in palliative care.", src:"Scottish Palliative Care Guidelines hyoscine hydrobromide PIL (2024)"},
         {tone:"plain", h:"Glycopyrronium PRN", html:"The Scottish Palliative Care Guidelines give glycopyrronium <b>200 micrograms SC</b> as needed for respiratory secretions. UK guidelines differ on how often it can be repeated and on the 24-hour maximum, so follow your local end-of-life formulary or the BNF for the interval, maximum and CSCI range.", src:"Scottish Palliative Care Guidelines — Care in the last days of life (Right Decisions, accessed 2026)"},
         {tone:"red", h:"Common antimuscarinic adverse effects", html:"Dry mouth (step up mouth care), urinary retention (check for a palpable bladder if the person becomes restless), constipation, tachycardia. Central effects (confusion, agitation, sedation) mainly with atropine and hyoscine hydrobromide.", src:"NICE NG31 (2015) · BNF"},
         {tone:"blue", h:"Butylbromide vs hydrobromide mix-ups", html:"The two hyoscine salts have very different doses and central effects. Write the salt in full on every prescription and anticipatory chart, and check it when administering."}
       ]},
       {b:"why", html:"Glycopyrronium and hyoscine butylbromide are quaternary ammonium compounds, which cross the blood–brain barrier poorly, so they cause less sedation and delirium. Atropine and hyoscine hydrobromide are tertiary amines that do cross it, which is why NG31 singles them out for monitoring of delirium, agitation and sedation. In a person who is already drowsy, extra sedation may be acceptable; in a person with terminal agitation, adding a centrally acting antimuscarinic can make things worse."}
     ]},

    {id:"evidence", nav:"Evidence", title:"How good is the evidence?", sub:"Weak. Know it, so you can be honest with families and colleagues.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Cochrane review", html:"Wee &amp; Hillier, <i>Interventions for noisy breathing in patients near to death</i>, Cochrane CD005177 (2008). Four studies met the inclusion criteria. There was <b>no evidence that any intervention, pharmacological or non-pharmacological, was superior to placebo</b>. One large study comparing atropine, hyoscine hydrobromide and hyoscine butylbromide found no difference between them.", src:"Cochrane CD005177 (Wee & Hillier 2008)"},
         {tone:"blue", h:"NICE research recommendation", html:"NG31 lists as a research priority whether antisecretory antimuscarinic drugs used alongside nursing interventions (such as repositioning and oropharyngeal suction) are better than nursing interventions alone at reducing noisy secretions.", src:"NICE NG31 (2015) research recommendations"}
       ]},
       {b:"why", html:"NICE still supports a <b>monitored trial</b> of an antimuscarinic because the symptom is common, the families' distress is real and the drugs are well understood. The weak evidence is the reason NG31 builds in review at 12 hours and the option to stop. It also explains why no single drug is recommended over another."}
     ]},

    {id:"monitor", nav:"Review", title:"Monitoring and review", sub:"The NG31 monitoring rule, plus what to check on each visit.",
     blocks:[
       {b:"table", head:["When","What to check","Action"], rows:[
         ["<b>Every 4 hours</b> (preferred) — <b>at least every 12 hours</b>","Noise, the person's comfort, family distress, side effects (sedation, agitation, delirium, dry mouth, urinary retention)","Continue if helping; reposition; mouth care. NG31 monitoring rule"],
         ["<b>12 hours</b> after starting","Is there any benefit?","If secretions continue to cause distress after 12 hours, consider changing or stopping the drug (NG31)"],
         ["After repeated PRN doses","How many doses in 24 hours, and did each help?","If recurring and helping, consider continuing by CSCI with PRN still available"],
         ["<b>Daily</b>","Hydration status and fluid plan; is the person still dying, or stabilising?","Discuss hydration options (QS144 statement 4); reassess the diagnosis of dying (QS144 statement 1)"],
         ["Every visit","Family understanding and coping","Repeat the explanation; offer support; check they know who to call"]
       ]},
       {b:"timeline", items:[
         {n:"1", when:"First rattle", title:"Assess, explain, reposition", html:"Assess cause, explain to family, reposition, mouth care, review fluids. Give a PRN antimuscarinic early if the secretions are distressing."},
         {n:"2", when:"Within 4 hours", title:"First review", html:"Has the noise eased? Any side effects? Repeat PRN if needed (per local formulary)."},
         {n:"3", when:"By 12 hours", title:"Decide", html:"Benefit → continue (CSCI if recurring). No benefit and still distressing → consider switching or stopping. Keep the non-drug measures going."},
         {n:"4", when:"Ongoing", title:"Comfort focus", html:"Judge success by the person's comfort and the family's understanding, not by abolishing the sound."}
       ]}
     ]},

    {id:"community", nav:"At home", title:"Community practicalities for the GP", sub:"Most of this is prevention: the right drug in the house before the rattle starts.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"Anticipatory medicines in the home", html:"Prescribe an antimuscarinic alongside the other anticipatory medicines, with written indications, dosage and route, and make sure it has been dispensed and is in the home. Complete the community authorisation chart.", src:"NICE QS144 (2017) statement 3"},
         {tone:"plain", h:"Individualised care plan", html:"Record the plan (including the approach to secretions and hydration) in an individualised care plan, discussed with the person and those important to them, and share it with district nurses and out-of-hours.", src:"NICE QS144 (2017) statement 2"}
       ]},
       {b:"dl", rows:[
         ["Prepare the family","Tell the family in advance that noisy breathing may happen near the end and what it means, so it is not a shock at 3 a.m. Tell them who to call (district nurse, out-of-hours, hospice advice line)."],
         ["Syringe pump","If a CSCI is started, the district nurse sets it up and reviews it; check the combination and compatibility with other syringe-pump drugs per local guidance, and that PRN doses remain prescribed."]
       ]},
       {b:"p", html:"For the wider framework — recognising dying, the five Priorities for Care, rationalising medicines, anticipatory prescribing for all five common symptoms and what to do after death — see <a href=\"../management/care-of-the-dying.html\">Care of the dying adult</a>."}
     ]},

    {id:"safety", nav:"Safety-net", title:"Safety-netting for the family", sub:"What to tell those at the bedside before you leave.",
     blocks:[
       {b:"say", html:"“The noisy breathing may come and go, and it may get louder when she's on her back — turning her onto her side often helps. The nurses will review the medicine within the next few hours and at least twice a day. If she seems to be struggling to breathe, looks distressed or in pain, is restless or agitated, or if you are worried at any time, day or night, call the district nurse or the out-of-hours number on the sheet. You don't need to call 999 — we have a plan in place for her.”"},
       {b:"dl", rows:[
         ["Call for help if","The person looks distressed or breathless; new agitation or restlessness (consider urinary retention or the drug itself); choking, vomiting or bleeding; the family cannot cope."],
         ["Expected changes","Noisy breathing that settles with repositioning; pauses in breathing; cool hands and feet; sleeping most of the time. Explain these in advance."]
       ]}
     ]},

    {id:"pitfalls", nav:"Pitfalls", title:"Common pitfalls", sub:"Where care most often goes wrong.",
     blocks:[
       {b:"dl", rows:[
         ["Starting a drug without assessing the cause","Pulmonary oedema from SC/IV fluids or heart failure will not respond to an antimuscarinic. Assess first (NG31)."],
         ["Waiting too long","Antimuscarinics reduce new secretion only. Started late, when secretions have pooled, they help less."],
         ["Never reviewing the trial","NG31: review at least every 12 hours, and consider changing or stopping if no benefit after 12 hours."],
         ["Ignoring central side effects","Delirium, agitation or sedation with atropine or hyoscine hydrobromide may be mistaken for terminal agitation and lead to more sedation."],
         ["Mixing up the hyoscine salts","Butylbromide and hydrobromide have different doses and effects. Write the salt in full."],
         ["Two antimuscarinics at once","Adds side effects without evidence of added benefit. Switch rather than add."],
         ["Routine deep suction","Rarely helpful and distressing. Gentle oral suction only for visible pooled secretions."],
         ["Treating the noise, not the people","The family's understanding is the main outcome. Promising silence sets everyone up to fail."],
         ["Forgetting fluids","Clinically assisted hydration running unchanged while secretions increase. Review daily (QS144 statement 4)."]
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"plain", h:"Classic scenario", html:"Telephone or home-visit consultation: the daughter of an 84-year-old woman with metastatic breast cancer, expected to die at home within days, calls at the end of the day. “She's making a horrible gurgling noise — is she drowning? Should we call an ambulance?” An SC fluid infusion was started two days ago by a visiting team."},
       {tone:"plain", h:"Examiner-style checkpoints", html:"Explores what the daughter has noticed and fears; assesses for distress, breathlessness, fever and fluid overload; explains the cause and that it is unlikely to be distressing to her mother; gives positioning advice; reviews the SC fluids; checks anticipatory medicines are in the house and arranges a district nurse to give an antimuscarinic if appropriate; explains review within hours and stopping if unhelpful; safety-nets with out-of-hours numbers and avoids an unwanted 999 call; offers support. <a href='../management/care-of-the-dying.html'>Care of the dying adult →</a>"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every recommendation on this page is traceable to a named source. Recommendation numbers are not quoted where they could not be checked.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG31 — Care of dying adults in the last days of life (December 2015)</b><br><a href="https://www.nice.org.uk/guidance/ng31" rel="noopener">nice.org.uk/guidance/ng31</a><span class="rd"> — assess causes of noisy respiratory secretions; talk to the person and family; non-pharmacological measures; trial of atropine, glycopyrronium, hyoscine butylbromide or hyoscine hydrobromide; monitor preferably 4-hourly, at least 12-hourly; consider changing or stopping after 12 hours; monitor for delirium, agitation or excessive sedation with atropine or hyoscine hydrobromide; research recommendation on antimuscarinics plus nursing care</span></li>'+
         '<li><b>NICE QS144 — Care of dying adults in the last days of life (March 2017)</b><br><a href="https://www.nice.org.uk/guidance/qs144" rel="noopener">nice.org.uk/guidance/qs144</a><span class="rd"> — statement 1 assessing signs and symptoms; statement 2 individualised care plan; statement 3 anticipatory prescribing; statement 4 hydration assessed daily</span></li>'+
         '<li><b>Cochrane CD005177 — Wee B, Hillier R. Interventions for noisy breathing in patients near to death (2008)</b><br><a href="https://www.cochranelibrary.com/cdsr/doi/10.1002/14651858.CD005177.pub2/abstract" rel="noopener">cochranelibrary.com CD005177.pub2</a><span class="rd"> — no evidence that any intervention is superior to placebo; prevalence 23–92%</span></li>'+
         '<li><b>Scottish Palliative Care Guidelines (Right Decision Service)</b> — Care in the last days of life, and hyoscine hydrobromide (Scopoderm) patient leaflet (2024)<br><a href="https://www.rightdecisions.scot.nhs.uk/scottish-palliative-care-guidelines/" rel="noopener">rightdecisions.scot.nhs.uk/scottish-palliative-care-guidelines</a><span class="rd"> — glycopyrronium 200 micrograms SC PRN; hyoscine butylbromide and glycopyrronium do not cross the blood–brain barrier; repositioning may help and suction may exacerbate secretions; hyoscine hydrobromide 1.5 mg patch every 72 hours, off-label for secretions, prevents new secretions but does not affect those already formed</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — all doses not stated above, and adverse effects of antimuscarinics</span></li>'+
         '</ul></div>'}
     ]}
  ],
