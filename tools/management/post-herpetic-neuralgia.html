  quick:[
    {tone:"blue", h:"The definition, and the feature that gives it away", html:"Neuropathic pain persisting or recurring 90 days or more after the onset of the shingles rash, in the affected dermatome. Burning, aching or stabbing pain with allodynia — pain on light touch or from clothing — most often thoracic or ophthalmic, and most often elderly. Risk factors: older age, severe acute pain or rash, and ophthalmic zoster."},
    {tone:"amber", h:"Switch agents — do not stack them", html:"Choose ONE CG173 agent: amitriptyline 10–75 mg nocte, duloxetine 60 mg OD, gabapentin titrated to 300–1200 mg TDS, or pregabalin 75–300 mg BD. Start low, titrate, and SWITCH rather than adding a second agent if it is ineffective or not tolerated. Review at 4–6 weeks. Combining classes comes later and under review."},

  foot:"Post-herpetic neuralgia — NICE CG173, NICE, NG193 and the UKHSA Green Book. Dermatomal neuropathic pain persisting 90 days or more after the shingles rash, with allodynia as its signature. Treat with ONE CG173 agent — amitriptyline, duloxetine, gabapentin or pregabalin — switching rather than stacking, reviewed at 4–6 weeks. Topical lidocaine 5% plaster or capsaicin cream for localised pain, and particularly where oral agents cost falls and sedation in the elderly. Explain honestly that PHN usually improves over months and the goal is reduction, not abolition. Early antivirals within 72 hours and zoster vaccination are what prevent the next episode. Verify all doses against the current BNF before prescribing."
