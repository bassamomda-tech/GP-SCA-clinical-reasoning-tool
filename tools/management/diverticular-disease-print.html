MG.render({
  icon:"\u{1FAC3}",
  title:"Diverticular disease and diverticulitis \u2014 the complete guide",
  eyebrow:"Protocol \u00b7 diagnose &amp; manage in one place",
  stemTitle:"Diverticular disease \u2014 place the patient on the spectrum, resist the reflex antibiotic, and never let the cancer hide behind the diagnosis",
  stemSub:"One page for the whole condition: separate diverticulosis from diverticular disease from acute diverticulitis, exclude perforation, abscess, fistula and haemorrhage, grade severity for home versus hospital, apply the NG147 no-antibiotic rule for the well patient with uncomplicated disease, safety-net every patient and review at 48\u201372 hours when clinically indicated, and arrange post-recovery colorectal assessment where indicated \u2014 because a colorectal cancer can present exactly like diverticulitis.",
  guideline:"NICE NG147 (2019) \u00b7 NICE NG12 (updated April 2026) \u00b7 NICE HTG690 (FIT; formerly DG56) \u00b7 ESCP (2020) \u00b7 GM antimicrobial guidelines",
  reviewed:"9 September 2026",
  nextReview:"9 March 2027",
  meta:[
    {t:"NICE NG147 \u2014 Diverticular disease (2019)"},
    {t:"NICE NG12 \u2014 colorectal suspected cancer routes", tone:"tw"},
    {t:"ESCP 2020 · BSG · GM antimicrobial guidelines"},
    {t:"AVOD (BJS 2012) \u00b7 DIABOLO (2017) \u00b7 HPFS (JAMA 2008)"},
    {t:"BNF for all doses"},
    {t:"v2.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#severe"><b>Exclude first</b><small>Perforation \u00b7 abscess \u00b7 fistula \u00b7 bleed</small></a><a href="#confirm"><b>Grade it</b><small>Uncomplicated vs complicated</small></a><a href="#ladder"><b>Treat</b><small>NG147 \u00b7 antibiotics only if needed</small></a><a href="#monitor"><b>Follow up</b><small>Safety-net \u00b7 selective colonoscopy</small></a><a href="#refer"><b>Refer</b><small>999 \u00b7 surgical \u00b7 suspected cancer</small></a></div>',
  quickSub:"If you read nothing else on this page, read these six cards. Every number traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"\u26a0 Generalised peritonism is a 999 call", html:"Localised left iliac fossa tenderness is uncomplicated disease. Generalised guarding, rigidity or peritonism suggests perforation or advanced complicated diverticulitis \u2014 do not attempt to assign a Hinchey stage clinically; 999 now for immediate emergency surgical assessment. Mortality for faecal peritonitis is <b>40\u201350%</b>."},
    {tone:"amber", h:"Three different states, one word", html:"<b>Diverticulosis</b> \u2014 diverticula present, asymptomatic, no treatment. <b>Diverticular disease</b> \u2014 symptomatic without inflammation. <b>Acute diverticulitis</b> \u2014 inflamed, needs a severity assessment. <b>Management hinges entirely on which one you are in.</b>"},
    {tone:"blue", h:"NG147: most uncomplicated diverticulitis needs NO antibiotic", html:"Systemically well and not immunocompromised, no abscess or peritonism (the trial evidence is in CT-confirmed disease) \u2192 <b>analgesia and observation, no antibiotic</b>. The <b>AVOD trial (623 patients)</b> found complication rates of <b>1.9% vs 2.0%</b>. Yet surveys show <b>80\u201390% of clinicians still prescribe</b> \u2014 this is the single biggest practice gap on the page."},
    {tone:"green", h:"When antibiotics ARE indicated", html:"Systemically unwell, immunosuppressed, or significant comorbidity \u2014 provided same-day hospital assessment for complicated disease is not needed (fever and WBC support the decision but are not mandatory thresholds) \u2192 <b>co-amoxiclav 500/125 mg TDS for 5 days</b> (NICE NG147); penicillin allergy \u2192 <b>cefalexin (with caution) or trimethoprim, plus metronidazole 400 mg TDS</b>, for 5 days; ciprofloxacin plus metronidazole only in specified circumstances and on specialist advice. Check renal function, allergy phenotype, pregnancy status, local resistance guidance (GM antimicrobial guidelines) and drug interactions; cefalexin may be unsuitable after immediate or severe beta-lactam allergy."},
    {tone:"purple", h:"Suspected cancer \u00b7 NG12 \u2014 the cancer that mimics this", html:"Colorectal cancer is found in about 1.6% of patients after CT-confirmed acute diverticulitis \u2014 0.7% after uncomplicated but about 11% after complicated disease (Sharma et al, Ann Surg 2014). Do not perform colonoscopy during the acute episode. After recovery, consider <b>interval colonoscopy or CT colonography</b> if disease was complicated, symptoms persist, CT findings were suspicious or equivocal, there are colorectal alarm features, or there has been no recent adequate colorectal evaluation; routine endoscopy after a single, clearly CT-confirmed uncomplicated episode with complete recovery is not always required (follow the local colorectal pathway). Use the NG12 colorectal routes in parallel \u2014 <b>diverticular disease does not protect against bowel cancer</b>."},
    {tone:"amber", h:"Safety-net everyone; review when indicated", html:"NG147 asks that anyone managed at home is told to re-present, and is reassessed, if symptoms persist or worsen. Give explicit safety-netting to all patients managed in the community. Arrange a planned review within <b>48\u201372 hours</b> when clinically indicated \u2014 particularly if the diagnosis is uncertain, the patient is older or frail, has comorbidity or immunosuppression, borderline systemic features, moderate symptoms, poor social support, is managed without imaging or is on antibiotics. This is local good practice (GM antimicrobial guidance), not a universal NICE requirement. Reassess urgently if symptoms persist or worsen."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step is where patients come to harm.",
  pathway:[
    {title:"Exclude the complicated", html:"Perforation or peritonitis, abscess, obstruction, colovesical fistula, major diverticular haemorrhage, sepsis. Localised tenderness or generalised? NEWS2, FBC, CRP, U&amp;E, pregnancy test in women.", alert:true},
    {title:"Place the patient on the spectrum", html:"Diverticulosis, diverticular disease, or acute diverticulitis \u2014 then grade the diverticulitis as uncomplicated or complicated by clinical features (peritonism, mass, sepsis, fistula, obstruction, uncontrolled pain), observations, supporting bloods, imaging and social circumstances.", },
    {title:"Confirm and exclude the mimic", html:"CT abdomen and pelvis is the preferred investigation when the diagnosis is uncertain, inflammatory markers are raised, symptoms are severe or complications are suspected; NG147 asks for contrast CT within 24 hours of hospital admission with suspected complicated diverticulitis and raised inflammatory markers. It is not required routinely for every systemically well patient managed in primary care. <b>No colonoscopy in the acute phase</b> \u2014 discomfort and perforation risk. Plan later colorectal assessment only where indicated."},
    {title:"Treat by severity", html:"Well and uncomplicated \u2192 analgesia, fluids and a light diet as tolerated, no antibiotic. Systemically unwell, immunosuppressed or significant comorbidity \u2192 co-amoxiclav. Complicated \u2192 admit. Paracetamol first-line; avoid NSAIDs where possible; opioids only if unavoidable, at the lowest dose for the shortest time."},
    {title:"Review, prevent, exclude cancer", html:"Safety-net everyone; planned review at 48\u201372 hours when clinically indicated; reassess if recovery does not follow the expected course; colonoscopy or CT colonography after recovery where indicated; then increase fibre gradually, appropriate fluids, activity, weight and smoking. Complicated disease, persistent symptoms or recurrent episodes affecting quality of life \u2192 individualised colorectal surgical discussion."}
  ],
  sections:[

    {id:"severe", nav:"Exclude first", title:"Complicated disease \u2014 what must not be managed at home",
     sub:"Six presentations take this out of primary care. The first three are the ones that kill.",
     blocks:[
       {b:"warn", html:"Generalised guarding, rigidity or peritonism \u2014 not localised left iliac fossa tenderness \u2014 suggests perforation or advanced complicated diverticulitis and needs 999 immediately for emergency surgical assessment. Do not attempt to assign a Hinchey stage clinically. Emergency surgical management is required; the operative approach is determined by the colorectal surgical team. Mortality is 25\u201340%, and 40\u201350% for generalised faecal peritonitis."},
       {b:"dl", rows:[
         ["<b>Perforation / peritonitis</b>","Generalised guarding, rigidity, absent bowel sounds, haemodynamic instability \u2014 suggests perforation or advanced complicated disease (do not stage clinically) \u2192 <b>999</b>. IV access, resuscitate, nil by mouth, IV antibiotics; CT to stage"],
         ["<b>Diverticular abscess</b>","Swinging fever, persistent severe pain, a palpable tender left iliac fossa mass, <b>failure to resolve after 72 hours</b> \u2192 <b>same-day hospital assessment</b>. CT with contrast and IV antibiotics; for abscesses over approximately 3 cm, consider image-guided drainage where technically feasible and clinically appropriate (a specialist decision); antibiotics continue for up to 14 days in CT-confirmed abscess (NG147)"],
         ["<b>Major diverticular haemorrhage</b>","Massive <b>painless</b> fresh lower GI bleeding \u2192 <b>999</b> if major or haemodynamically significant. Emergency hospital assessment, IV access, blood tests and group-and-save/cross-match according to the local major-haemorrhage pathway; CT angiography, endoscopic treatment or embolisation are determined by the hospital team"],
         ["<b>Colovesical fistula</b>","<b>Pneumaturia, faecaluria, recurrent UTIs with mixed organisms</b> \u2014 diverticular disease is the <b>commonest cause of colovesical fistula</b> \u2192 <b>urgent colorectal surgery</b>. CT cystogram or cystoscopy, then elective laparoscopic sigmoidectomy. A colovaginal fistula presents with faeculent vaginal discharge"],
         ["Obstruction","Distension, vomiting, absolute constipation \u2192 <b>admit</b>"],
         ["<b>Sepsis</b>","<b>NEWS2 \u22655</b>, haemodynamic instability \u2192 <b>999 / same-day surgical</b>"],
         ["<b>The cancer, in the same consultation</b>","A first diverticulitis episode <b>aged &lt;40</b>, a family history of colorectal cancer, iron-deficiency anaemia or rectal bleeding \u2014 <b>colorectal cancer (CRC) can mimic or complicate diverticular disease</b> and the CT appearance of a perforated cancer can be identical to perforated diverticulitis \u2192 <b>NG12 colorectal pathway</b> plus post-recovery colorectal assessment"]
       ]},
       {b:"table", head:["Hinchey stage","What it is","Management"], rows:[
         ["<b>I</b>","Pericolic abscess or phlegmon, confined to the mesentery adjacent to the perforated segment","IV antibiotics; likely conservative. <b>Modified Ia</b> = mild pericolic inflammation without abscess \u2014 the stage suitable for community management"],
         ["<b>II</b>","Pelvic or distant abscess","IV antibiotics; consider image-guided drainage where technically feasible and clinically appropriate (specialist decision)"],
         ["<b>III</b>","Generalised <b>purulent</b> peritonitis \u2014 a ruptured abscess, not bowel contents","Emergency surgical management; the operative approach is determined by the colorectal surgical team"],
         ["<b>IV</b>","Generalised <b>faecal</b> peritonitis \u2014 free perforation with bowel contents in the peritoneal cavity","Emergency surgical management; <b>mortality 40\u201350%</b>"]
       ]},
       {b:"why", html:"The Hinchey classification determines surgical management and prognosis, but it is primarily a radiological and operative classification, so its practical value in primary care is a single discriminator: a patient with localised left iliac fossa tenderness and no peritonism may be suitable for management at home; generalised peritonism suggests perforation or advanced complicated disease and needs 999 — do not attempt to assign a stage clinically. Right-sided diverticula bleed more readily than left-sided ones \u2014 thinner walls and higher arterial pressure \u2014 which is why a right-sided presentation can both mimic appendicitis and bleed heavily."}
     ]},

    {id:"confirm", nav:"Grade it", title:"The spectrum, then the severity grading that decides home versus hospital",
     sub:"Two decisions: which of the three states is this, and if it is diverticulitis, is it uncomplicated?",
     blocks:[
       {b:"dl", rows:[
         ["Diverticulosis","Diverticula present, <b>asymptomatic</b> \u2014 no treatment, lifestyle advice only"],
         ["Diverticular disease","<b>Symptomatic</b> (intermittent lower abdominal pain, altered bowel habit) <b>without inflammation</b>"],
         ["Acute diverticulitis","<b>Inflamed</b> \u2014 constant left iliac fossa pain, fever, raised inflammatory markers, \u00b1 altered bowel habit or PR bleeding, <b>usually in an adult aged &gt;50</b> \u2192 grade the severity"],
         ["<b>Chronic diverticular pain</b>","Chronic low-grade left iliac fossa pain <b>without</b> fever or raised CRP, with diarrhoea and bloating \u2014 <b>painful diverticular disease / post-diverticulitis IBS-like syndrome</b>. High-fibre diet, hydration, avoid constipation, <b>mebeverine or another antispasmodic</b>. <b>This is not an acute episode and needs no antibiotic</b>"]
       ]},
       {b:"table", head:["","Uncomplicated \u2014 community management possible","Complicated \u2014 hospital required"], rows:[
         ["Pain and signs","Left iliac fossa pain with <b>localised</b> tenderness","<b>Generalised peritonism</b>, abdominal rigidity or guarding, abdominal mass or perirectal fullness, pneumaturia or faecaluria, colicky pain with absolute constipation, vomiting or distension, or uncontrolled pain"],
         ["Systemic state","Systemically well","<b>Features of sepsis</b>"],
         ["Bloods","CRP, FBC and renal function support severity assessment","<b>No isolated CRP or WBC threshold substitutes for clinical assessment</b>; any local thresholds are local, not NICE criteria"],
         ["Imaging","No abscess or perforation","<b>Abscess (Hinchey Ib\u2013II)</b> or <b>pneumoperitoneum (Hinchey III\u2013IV)</b>"],
         ["The patient","Tolerating oral intake (if immunosuppressed: antibiotics and early review), not pregnant, adequate social support, reliable to return if deteriorating","Unable to tolerate oral medication, <b>immunocompromised and frail or with significant comorbidity</b> (low threshold \u2014 signs may be masked), <b>pregnant</b>, or <b>not socially supported</b>"],
         ["Progress","Improving","<b>Persisting or worsening symptoms on outpatient management</b>"]
       ]},
       {b:"dl", rows:[
         ["Site of pain","<b>Left iliac fossa in about 95%</b> (sigmoid). Right iliac fossa in right-sided or ascending disease \u2014 less common, and <b>may mimic appendicitis</b>"],
         ["History that changes the plan","Onset (acute hours versus insidious days); constipation with pain beforehand is typical; <b>diarrhoea suggests colitis or complicated disease</b>; purulent or bloody PR discharge suggests complication; urinary or vaginal symptoms suggest fistula; previous episodes; low-fibre diet; <b>NSAID use</b>; immunosuppression"],
         ["Examination","Temperature; <b>localised versus generalised</b> tenderness; guarding and rigidity; bowel sounds \u2014 normal, hyperactive (obstruction) or absent (perforation); a palpable left iliac fossa mass (abscess or phlegmon); rectal examination for blood on the glove and anterior rectal tenderness from a pelvic collection"],
         ["<b>Diverticular haemorrhage</b>","A separate presentation: <b>painless massive fresh rectal bleeding</b>. <b>80% is self-limiting.</b> CT angiography detects active bleeding at <b>0.5 mL/min or more</b>; then colonoscopic haemostasis (clips, adrenaline injection), <b>superselective mesenteric arterial embolisation</b>, or surgery if bleeding fails to stop or recurs"]
       ]},
       {b:"why", html:"The severity grading is the whole decision. Generalised peritonism, sepsis, obstruction, fistula, uncontrolled pain or a palpable mass moves a patient out of the community pathway to same-day hospital assessment \u2014 CRP, FBC, renal function and observations support, but do not replace, clinical assessment \u2014 and so can three non-biochemical facts that are easy to skip: immunocompromise (a low threshold, especially with frailty or comorbidity, because signs are masked \u2014 if managed at home, offer antibiotics), pregnancy, and living alone without anyone to notice deterioration. Grading is not just about how inflamed the colon is; it is about whether this patient can be safely observed at home."}
     ]},

    {id:"workup", nav:"Work-up", title:"CT confirms it and excludes the complications; colonoscopy comes later",
     sub:"One imaging decision, and one absolute prohibition.",
     blocks:[
       {b:"table", head:["Test","Role","Notes"], rows:[
         ["<b>CT abdomen and pelvis with IV contrast</b>","Preferred investigation when the diagnosis is uncertain, inflammatory markers are raised, symptoms are severe or complications are suspected; NG147 recommends contrast CT within 24 hours of hospital admission with suspected complicated diverticulitis and raised inflammatory markers","Not required routinely for every systemically well patient managed in primary care with suspected uncomplicated disease. Confirms the diagnosis, stages complications, and finds the alternative diagnosis. Use local access and imaging pathways"],
         ["FBC, CRP, U&amp;E","Severity markers","Support severity assessment alongside observations and examination — not a stand-alone threshold test; NG147 recommends FBC, U&amp;E and CRP when suspected complicated diverticulitis is referred to hospital"],
         ["Erect CXR and AXR","If perforation is suspected","<b>Free gas under the diaphragm</b>"],
         ["Urine dipstick and MSU","Exclude UTI","Pyuria is common in diverticulitis from adjacent inflammation without a true UTI \u2014 do not let it relabel the diagnosis. <b>Mixed organisms on culture suggests a colovesical fistula</b>"],
         ["Pregnancy test","All women of reproductive age","Changes both imaging and disposition"],
         ["<b>Colonoscopy</b>","<b>Never routinely in the acute phase; after recovery only where indicated</b>","<b>Discomfort and perforation risk in acutely inflamed bowel.</b> Later colorectal assessment for complicated disease, persistent symptoms, alarm features, equivocal or suspicious imaging, or no recent adequate colorectal evaluation; not always required after a single, clearly CT-confirmed uncomplicated episode with complete recovery. CT colonography may be an alternative where colonoscopy is unsuitable \u2014 the choice belongs to the colorectal service"]
       ]},
       {b:"why", html:"CT is not routine for every well patient managed in the community, but imaging matters because <b>clinical diagnosis alone misclassifies roughly 35\u201340% of cases</b> \u2014 the alternatives include colorectal cancer in the same age group, appendicitis, ovarian pathology and ischaemic colitis. Where a systemically well patient is managed without imaging, safety-net explicitly and reassess if symptoms persist or worsen."}
     ]},

    {id:"ladder", nav:"Treatment", title:"Treat by severity \u2014 and unlearn the reflex antibiotic",
     sub:"The evidence changed a decade ago; prescribing habits largely did not.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1", title:"Uncomplicated and systemically well \u2014 no antibiotic", when:"NG147 first-line",
          html:"<b>Analgesia and observation, with no antibiotic.</b> <b>Paracetamol 1 g QDS</b> first-line; fluids and a light diet according to symptoms, then a gradual return to a normal balanced diet; rest. <b>Explicit safety-netting for all; planned review at 48\u201372 hours when clinically indicated.</b>"},
         {step:"2", title:"Systemic features, immunocompromise or comorbidity \u2014 antibiotics", when:"systemically unwell, immunosuppressed or comorbid",
          fromLabel:"systemically unwell",
          html:"<b>Co-amoxiclav 500/125 mg TDS for 5 days</b> (NICE NG147). Penicillin allergy \u2192 <b>cefalexin (with caution) or trimethoprim, plus metronidazole 400 mg TDS</b>, for 5 days; ciprofloxacin plus metronidazole only in specified circumstances and on specialist advice. Check renal function, allergy phenotype, pregnancy status, local resistance guidance (GM antimicrobial guidelines) and drug interactions; cefalexin may be unsuitable after immediate or severe beta-lactam allergy. A longer course only on clinical review; complicated disease is managed in hospital."},
         {step:"3", title:"Persisting or worsening \u2014 reassess urgently", when:"failure to respond",
          fromLabel:"no better",
          html:"<b>Re-examine; repeat inflammatory markers and arrange imaging (CT if not already done) when clinically indicated.</b> Failure to improve carries a real risk of abscess or perforation \u2014 <b>this is not the moment to extend the antibiotic course by phone</b>."},
         {step:"4", title:"Complicated disease \u2014 hospital", when:"admitted",
          fromLabel:"complicated",
          html:"<b>IV co-amoxiclav 1.2 g TDS</b>, or <b>piperacillin\u2013tazobactam (Tazocin) 4.5 g TDS</b> (or meropenem) if severe. IV fluids, nil by mouth then clear fluids, <b>image-guided drainage considered for abscesses over approximately 3 cm where feasible</b>, antibiotics for up to 14 days in CT-confirmed abscess (NG147), NG drainage if obstructed, daily surgical review. Where emergency surgery is needed, the operative approach is determined by the colorectal surgical team."},
         {step:"5", title:"Elective surgery \u2014 after recovery", when:"recurrent or complicated",
          fromLabel:"prevention of recurrence",
          html:"Consider colorectal surgical referral after complicated disease, fistula, stricture, persistent symptoms, or recurrent episodes that significantly affect quality of life. The decision is individualised and not based on a fixed number of attacks; age under 50 is not by itself an indication after a first uncomplicated episode. Surgery is a shared decision after discussing recurrence risk, operative morbidity and the possibility that chronic symptoms persist. NG147 sets no fixed episode count: discuss the risks and benefits of elective resection with a colorectal surgeon for recurrent episodes or continuing symptoms after complicated disease (stricture, fistula). <b>Colorectal cancer exclusion colonoscopy comes first.</b>"}
       ]},
       {b:"warn", html:"<b>Use paracetamol first-line; avoid NSAIDs where possible</b>, particularly with previous diverticular complications, gastrointestinal bleeding, renal disease or significant cardiovascular risk. NSAIDs \u2014 <b>ibuprofen, naproxen, diclofenac, aspirin above cardioprotective dose</b> \u2014 increase acute diverticulitis risk roughly <b>2\u20133-fold</b> and increase diverticular haemorrhage \u2014 they impair prostaglandin-mediated mucosal defence, reduce colonic blood flow and impair platelet function. If opioid analgesia is unavoidable, use the lowest effective dose for the shortest period, prescribe constipation prophylaxis and reassess \u2014 opioids constipate, raise intraluminal pressure, and <b>mask deterioration</b>. If an NSAID is genuinely required, use the minimum effective dose with a PPI and tell the patient the risk. Low-dose aspirin prescribed for secondary cardiovascular prevention should not be stopped routinely; consider it separately from other NSAIDs and antiplatelet agents."},
       {b:"dl", rows:[
         ["Why co-amoxiclav","Acute diverticulitis is a <b>micro-perforation of a diverticulum</b> causing <b>polymicrobial</b> pericolic infection with enteric Gram-negatives (<b>E. coli, Klebsiella pneumoniae</b>) and anaerobes (<b>Bacteroides fragilis</b>). Co-amoxiclav 625 mg TDS covers both as a single agent \u2014 note that <b>ciprofloxacin resistance in E. coli is rising</b>"],
         ["<b>Hartmann's procedure</b>","Emergency sigmoid resection with end colostomy and rectal stump closure \u2014 one of several emergency options (resection with primary anastomosis with or without diversion, selected laparoscopic lavage in purulent peritonitis, damage-control approaches), chosen by the colorectal team according to contamination, haemodynamic status, comorbidity and expertise. <b>Stoma reversal is possible in 50\u201370% at 3\u20136 months.</b> Laparoscopic lavage with or without primary anastomosis is emerging for selected Hinchey III patients \u2014 it avoids a permanent stoma but carries a higher anastomotic leak risk"],
         ["Elective versus emergency surgery","Recurrence after resection is reduced but not eliminated, and rates vary with definition, follow-up and patient selection. Counsel on <b>anastomotic leak</b>, stoma, bowel dysfunction, wound infection, <b>urinary and sexual dysfunction</b> from pelvic dissection near the autonomic nerves, and persistent abdominal pain"],
         ["<b>Rifaximin</b>","400 mg BD for 7 days each month \u2014 limited evidence for recurrence prevention and not routinely used"],
         ["<b>Mesalazine</b>","1.6\u20133 g/day is used in some centres for painful diverticular disease, on a mucosal-inflammation hypothesis. <b>Cochrane: insufficient evidence; not routine practice.</b> Reserve for proven chronic diverticular inflammation on biopsy or colonoscopy in a patient who is not a surgical candidate"]
       ]},
       {b:"why", html:"The no-antibiotic recommendation rests on level 1 evidence. The <b>AVOD trial (Chabok et al., BJS 2012)</b> randomised <b>623 patients</b> with CT-confirmed uncomplicated diverticulitis to antibiotics or observation and found <b>no difference in complications (1.9% versus 2.0%)</b>, time to recovery, or recurrence at one year; <b>DIABOLO (Netherlands, 2017)</b> agreed, and a <b>2018 Cochrane review</b> found no evidence of benefit for symptom relief, complications or length of stay. NG147 (2019) therefore says consider no antibiotic treatment for uncomplicated acute diverticulitis \u2014 while reserving antibiotics for systemic features, immunocompromise, and hospital management. Surveys nonetheless show 80\u201390% of clinicians still prescribe for every presentation."}
     ]},

    {id:"lifestyle", nav:"Prevention", title:"Fibre, fluid, activity, weight \u2014 and the myth to actively dispel",
     sub:"This is treatment between episodes, and one piece of historical advice needs unsaying.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"\ud83c\udf3e Fibre \u2014 a general goal of 25\u201330 g a day", html:"Fibre \u226525\u201330 g/day is associated with roughly 40% lower incidence of diverticular disease and about 30% lower risk of complications. Wholegrain bread and pasta (3\u20134 g per slice or serving), porridge and bran cereals (4\u20138 g), <b>lentils and legumes (8 g per 80 g cooked)</b>, broccoli and Brussels sprouts (3\u20134 g), apples with skin (3 g), pears (5 g). <b>Increase gradually over 2\u20134 weeks</b> to avoid bloating and wind \u2014 and only once recovered from an acute episode. Individualise for bloating, IBS-like symptoms and tolerance; do not increase fibre during suspected impaction or obstruction; ensure fluid intake is appropriate."},
         {tone:"green", h:"\ud83d\udca7 Fluid \u2014 appropriate for the individual", html:"Fibre absorbs water; inadequate fluid with high fibre causes constipation and defeats the purpose. Increase the two together. Avoid a blanket 1.5\u20132 L target in heart failure, advanced kidney disease or fluid restriction."},
         {tone:"amber", h:"\ud83e\udd5c Nuts, seeds and popcorn are safe \u2014 say so", html:"The historical advice to avoid them rested on theoretical concern with no evidence. The <b>Health Professionals Follow-Up Study (Strate et al., JAMA 2008)</b> found nut and seed consumption was <b>not</b> associated with increased diverticulitis risk and was in fact <b>inversely</b> associated. <b>No routine long-term dietary restriction is required.</b> During an acute episode, use fluids and a light diet according to symptoms, then return gradually to a normal balanced diet; increase fibre after recovery unless contraindicated or poorly tolerated."},
         {tone:"blue", h:"\ud83c\udfc3 Activity", html:"Physically active people have <b>roughly 20\u201325% lower incidence</b> of symptomatic diverticular disease \u2014 activity promotes colonic motility, reduces constipation and reduces intra-abdominal fat. Target <b>150 minutes of moderate aerobic activity a week</b> (about 30 minutes five times a week). <b>A sedentary lifestyle is an independent risk factor.</b>"},
         {tone:"blue", h:"\u2696 Weight", html:"<b>Obesity (BMI &gt;30)</b> increases incidence, severity, complication rate and recurrence; <b>visceral adiposity</b> specifically raises pericolic inflammation risk. Offer a weight-management programme (<b>NG246</b> pathway at BMI \u226530)."},
         {tone:"green", h:"\ud83d\udeab Smoking", html:"Stop \u2014 smoking is associated with <b>complicated</b> disease."},
         {tone:"green", h:"\ud83d\udebd Treat the constipation", html:"Constipation raises intraluminal pressure and drives progression. Fibre, fluid and exercise first; then treat constipation according to stool consistency, transit and cause \u2014 bulk-forming (ispaghula husk / Fybogel, 3.5 g per sachet) if stools are not impacted and fluid intake is adequate, osmotic (macrogol), or a softener (docusate). <b>Do not use bulk-forming agents in impaction, obstruction or established opioid-induced constipation.</b> Stimulant laxatives (bisacodyl, senna) may be required as ongoing treatment where clinically appropriate; review response and adverse effects rather than applying blanket duration limits. <b>Toilet posture: a raised footstool reduces straining.</b>"},
         {tone:"blue", h:"\ud83d\udcd8 Written information", html:"Every patient diagnosed with acute diverticulitis should get written information: the warning signs needing emergency assessment, the dietary advice, <b>whether later colonoscopy or CT colonography is needed</b>, and what this means for long-term bowel care. <b>Guts UK</b> (gutscharity.org.uk) has comprehensive patient material."}
       ]},
       {b:"why", html:"The fibre recommendation is among the best-evidenced dietary interventions in gastroenterology. The <b>Painter and Burkitt hypothesis (1971)</b> proposed that a low-fibre Western diet raises colonic intraluminal pressure \u2014 small, hard, high-pressure stools \u2014 and produces diverticula at the weak points where arteries penetrate the colonic wall; the <b>UK Women's Cohort Study</b> and multiple prospective cohorts have since confirmed the association. Psyllium husk is an excellent soluble-fibre supplement where dietary fibre is inadequate."}
     ]},

    {id:"monitor", nav:"Follow-up", title:"Safety-netting, the recovery course, and selective post-recovery colorectal assessment",
     sub:"Safety-net everyone; plan review and colorectal assessment according to the individual.",
     blocks:[
       {b:"table", head:["When","What","Action"], rows:[
         ["<b>48\u201372 hours</b>","<b>Planned review when clinically indicated</b> (older or frail, uncertain diagnosis, borderline systemic features, comorbidity, immunosuppression, poor social support, managed without imaging, or on antibiotics) \u2014 local good practice, not a universal NICE requirement; telephone for low-risk, face-to-face if borderline","Temperature normalising? Pain improving rather than worsening? Tolerating fluids and diet? <b>Any \u2018no\u2019 lowers the threshold for hospital referral</b>"],
         ["If recovery stalls","Symptoms persist, recur or do not follow the expected course","Arrange further assessment. Repeat inflammatory markers or imaging only when clinically indicated \u2014 persistent pain, fever, systemic illness, suspected abscess, obstruction or alternative diagnosis"],
         ["<b>After recovery</b>","<b>Colonoscopy or CT colonography where indicated</b>","Indicated after complicated disease (abscess or perforation), persistent symptoms, rectal bleeding, iron-deficiency anaemia, ongoing change in bowel habit, suspicious or equivocal CT, no recent adequate colorectal investigation, or diagnostic uncertainty; not always required after a single, clearly CT-confirmed uncomplicated episode with complete recovery \u2014 follow the local colorectal pathway. Where indicated, code the episode with a specific <b>SNOMED</b> code, and run a <b>recall system</b> to confirm the colonoscopy happened"],
         ["Beyond 4\u20136 weeks","Persisting symptoms after recovery","Requires colorectal assessment (colonoscopy or CT colonography) to exclude cancer"],
         ["Recurrent episodes","Recurrence","<b>Individualised colorectal surgical discussion</b> if recurrent episodes significantly affect quality of life, or after complicated disease — not based on a fixed number of attacks"],
         ["After the colonoscopy","Act on the result","<b>Normal</b> (diverticula, no polyps) \u2192 reassure, fibre advice; no routine colonoscopic surveillance if there are no other risk factors (national bowel screening continues). <b>Adenomatous polyps</b> \u2192 polypectomy and a surveillance schedule by adenoma grade. <b>Cancer</b> \u2192 urgent MDT and staging"]
       ]},
       {b:"dl", rows:[
         ["<b>The expected recovery trajectory</b>","Symptoms should begin to improve over the first few days; recovery varies with age, frailty, comorbidity, inflammatory burden, immunosuppression, abscess or phlegmon, diagnostic accuracy and analgesic response. Failure to improve, recurrent fever, worsening pain, vomiting or inability to tolerate fluids requires reassessment"],
         ["<b>Recurrence risk</b>","Recurrence is common; reported rates vary with definition, follow-up and patient selection. Risk factors: immunosuppression, obesity, physical inactivity, a high-fat low-fibre diet, NSAIDs, younger age"],
         ["Urgent, not interval, colonoscopy","Change in bowel habit persisting after recovery, rectal bleeding, unexplained anaemia, or age &lt;40 \u2014 escalate via the NG12 route rather than waiting for routine follow-up"],
         ["Ongoing low-grade pain afterwards","May be persistent pericolic inflammation, chronic diverticular disease, a post-diverticulitis IBS-like syndrome \u2014 <b>or an underlying cancer</b>"]
       ]},
       {b:"cards", items:[
         
       ]},
       {b:"cards", items:[
         {tone:"red", h:"\ud83d\udd34 Peritonitis or perforation", html:"\u201cSevere tummy pain that spreads across the whole abdomen, a rigid tummy, high fever, or collapse \u2014 call <b>999</b>. Don't wait for your appointment.\u201d"},
         {tone:"red", h:"\ud83e\ude78 Heavy bleeding", html:"\u201cA large amount of fresh blood from the back passage \u2014 <b>999</b>.\u201d"},
         {tone:"amber", h:"\ud83d\udfe0 Not improving", html:"\u201cIf the pain worsens, the fever returns or rises, you start vomiting, or you cannot keep fluids down \u2014 contact us the <b>same day</b>.\u201d"},
         {tone:"amber", h:"\ud83d\udeb0 Fistula clues", html:"\u201cPassing air or stool in your urine, or repeated urine infections \u2014 tell us; it needs a specific check.\u201d"},
         {tone:"blue", h:"\ud83d\udd2c The follow-up test", html:"\u201cIf we arrange a camera test or scan of the bowel after you have recovered, it is important \u2014 please don't skip it.\u201d"},
         {tone:"green", h:"\ud83e\udd5c Eat the nuts", html:"\u201cYou can eat nuts, seeds and popcorn safely \u2014 the old advice to avoid them was wrong.\u201d"}
       ]},
       {b:"say", html:"The inflamed pouch in your bowel should settle over the next few days. I am not giving you an antibiotic, and that is deliberate \u2014 good trials show it does not speed recovery or prevent complications when you are otherwise well. What matters more is paracetamol for the pain, fluids and light food for a day or two, and getting back in touch straight away if things are not improving or get worse — I may also arrange to see you again in two or three days. Once you are better we will decide whether you need a camera test or scan of your bowel, because another condition can occasionally look like this and I want to be certain where needed."}
     ]},

    {id:"loop", nav:"Not responding?", title:"Recurrent or not settling? Reassess", sub:"Distinguish uncomplicated recurrence from complications or an alternative diagnosis.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"1 \u00b7 Complication?", html:"Persisting fever, severe pain, peritonism <b>or a new mass</b> \u2192 abscess, perforation or fistula \u2014 <b>not a failed antibiotic course</b>."},
         {tone:"amber", h:"2 \u00b7 Cancer excluded?", html:"Change in habit, bleeding, weight loss, anaemia or a mass \u2192 <b>NG12 route plus colonoscopy</b>. Remember that about <b>11% of complicated 'diverticulitis' turns out to be malignant</b> (1.6% overall; Sharma, Ann Surg 2014)."},
         {tone:"blue", h:"3 \u00b7 Is it even inflammation?", html:"Chronic pain <b>without fever or a raised CRP</b> is painful diverticular disease \u2014 antispasmodics, <b>not antibiotics</b>."},
         {tone:"blue", h:"4 \u00b7 Fibre and fluid", html:"Genuinely optimised: fibre increased gradually towards <b>25\u201330 g a day</b> as tolerated, fluid appropriate to the individual, and constipation treated according to its cause."},
         {tone:"amber", h:"5 \u00b7 Harmful drugs", html:"Still on the repeat? <b>Review NSAIDs and opioids</b> — avoid NSAIDs where possible; opioids only if unavoidable, at the lowest dose for the shortest time."},
         {tone:"blue", h:"6 \u00b7 Refer", html:"Complicated disease, fistula, stricture, persistent symptoms, or recurrent episodes significantly affecting quality of life \u2192 <b>individualised colorectal surgical discussion</b> \u2014 not a fixed episode count."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer \u2014 who goes where, and the NG12 routes",
     sub:"Emergencies same day; the cancer routes run in parallel with everything else.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999", html:"<b>Generalised peritonism</b> (perforation), <b>haemodynamic instability or collapse</b>, <b>massive rectal haemorrhage</b>, complete bowel obstruction."},
         {tone:"red", h:"Same-day surgical assessment", html:"<b>Suspected abscess</b>, <b>persisting or worsening symptoms on outpatient management</b>, <b>features of sepsis or uncontrolled pain</b>, obstruction, unable to tolerate oral medication, a developing palpable left iliac fossa mass, <b>immunocompromise with frailty or significant comorbidity</b> (low threshold \u2014 signs may be masked; otherwise antibiotics and early review at home), <b>pregnancy</b>."},
         {tone:"amber", h:"Urgent colorectal surgery", html:"<b>Colovesical or colovaginal fistula</b>; refractory or recurrent diverticular haemorrhage."},
         {tone:"amber", h:"Elective colorectal surgery", html:"Complicated disease, fistula, stricture, persistent symptoms, or recurrent episodes that significantly affect quality of life \u2014 an individualised, shared decision, not based on a fixed number of attacks; age under 50 is not by itself an indication after a first uncomplicated episode."},
         {tone:"purple", h:"Suspected cancer \u00b7 NG12 \u2014 suspected colorectal cancer", html:"Refer on the <b>suspected colorectal cancer pathway (2 weeks)</b> for a <b>FIT result of \u226510 \u00b5g Hb/g</b>; consider referral without FIT for a <b>rectal mass</b>. An <b>abdominal mass</b>, <b>change in bowel habit</b>, <b>iron-deficiency anaemia</b>, <b>rectal bleeding</b>, or <b>weight loss with abdominal pain at 40 and over</b> \u2192 offer FIT first (NICE HTG690, formerly DG56); a low FIT (below 10) or one not returned does not exclude referral and must not delay it where clinical concern persists. <b>NICE NG12 (updated April 2026).</b>"},
         {tone:"purple", h:"Suspected cancer \u00b7 why it matters here", html:"Diverticular disease and colorectal cancer share the same peak age (65\u201380), the same segment (sigmoid colon) and the same symptoms \u2014 change in bowel habit, rectal bleeding, left iliac fossa pain. Colorectal cancer is found in about 1.6% after CT-confirmed acute diverticulitis, rising to about 11% after complicated disease (Sharma et al, Ann Surg 2014). Diverticular disease does <b>not</b> protect against cancer, and a cancer can arise within a diverticular segment \u2014 so a diverticular label is never a reason not to investigate a new symptom."},
         {tone:"cream", h:"Keep in primary care", html:"Confirmed uncomplicated diverticulitis in a well patient: analgesia and observation per NG147, safety-netting with a <b>48\u201372 hour review when indicated</b>, <b>post-recovery colorectal assessment where indicated</b>, fibre and lifestyle, constipation management, and avoiding NSAIDs where possible."}
       ]},
       {b:"say", html:"This is an inflamed pocket in the wall of your lower bowel. Most people settle with simple painkillers and fluids, and please get back in touch if you are not improving — I may book a check in two or three days. Two things I want to be clear about: come straight in \u2014 or call 999 \u2014 if the pain spreads across your whole tummy or you feel very unwell; and once you are better we will decide whether you need a camera test or scan, because bowel cancer can occasionally look similar and I would rather rule it out properly where needed."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 58-year-old man with two days of constant left iliac fossa pain, a temperature of 37.9\u00b0C and localised tenderness without guarding. He had a similar episode 14 months ago, treated with antibiotics elsewhere, and expects the same again. He takes regular naproxen for knee pain. He mentions, almost in passing, that his stools have been looser for about three months."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Grades severity explicitly (systemic state, tenderness pattern, observations, supporting bloods) rather than diagnosing by site alone; explains why no antibiotic is being given and manages the expectation rather than capitulating; <b>reviews and stops the naproxen where possible</b>; safety-nets and arranges a <b>48\u201372 hour review</b> as indicated; and \u2014 the step candidates most often miss \u2014 does not let the diverticular label absorb the three-month change in bowel habit: this is a second episode, so discusses whether a colorectal surgical opinion is wanted (an individualised decision, not a fixed episode rule), <em>and</em> arranges an NG12 colorectal assessment (FIT-first) for the persisting change in bowel habit, with post-recovery colorectal assessment planned rather than promised vaguely. <a href='../../cases/diverticulosis.html'>Open the full casebook chapter →</a>"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>NICE NG147 \u2014 Diverticular disease: diagnosis and management (2019)<br><a href="https://www.nice.org.uk/guidance/ng147" rel="noopener">nice.org.uk/guidance/ng147</a><span class="rd"> \u2014 the no-antibiotic recommendation for the systemically well patient, co-amoxiclav 500/125 mg TDS for 5 days when antibiotics are needed, alternatives (cefalexin or trimethoprim with metronidazole; ciprofloxacin with metronidazole only in specified circumstances), contrast CT within 24 hours of admission with suspected complicated diverticulitis, FBC, U&amp;E and CRP when complicated disease is referred, antibiotics for up to 14 days in CT-confirmed abscess, no colonoscopy during the acute episode, reassessment if symptoms persist or worsen, no dietary restrictions, and surgical discussion for recurrent or complicated disease</span></li>'+
         '<li><b>NICE NG12 \u2014 Suspected cancer: recognition and referral (updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> \u2014 colorectal suspected cancer pathway referral at FIT \u226510 \u00b5g Hb/g, rectal mass, and the FIT-first route for abdominal mass, change in bowel habit, iron-deficiency anaemia and rectal bleeding (with NICE HTG690)</span></li>'+
         '<li><b>Sharma PV et al. Routine colonic evaluation after radiologically confirmed acute diverticulitis \u2014 Annals of Surgery 2014</b><span class="rd"> \u2014 malignancy 1.6% overall, 0.7% after uncomplicated and 10.8% after complicated diverticulitis</span></li>'+
         '<li><b>AVOD trial \u2014 Chabok et al., British Journal of Surgery 2012</b><span class="rd"> \u2014 623 patients with CT-confirmed uncomplicated acute diverticulitis randomised to antibiotics or observation: complications 1.9% vs 2.0%, with no difference in recovery time or 1-year recurrence</span></li>'+
         '<li><b>DIABOLO trial (Netherlands, 2017) and Cochrane review (2018)</b><span class="rd"> \u2014 no evidence of benefit from antibiotics in uncomplicated acute diverticulitis for symptom relief, complications, or length of stay</span></li>'+
         '<li><b>HPFS \u2014 Strate et al., JAMA 2008</b><span class="rd"> \u2014 nut, seed and popcorn consumption not associated with increased diverticulitis risk, and inversely associated with acute diverticulitis; the basis for abandoning the historical food restrictions</span></li>'+
         '<li><b>Painter and Burkitt (1971) and the UK Women\u2019s Cohort Study</b><span class="rd"> \u2014 the low-fibre / intraluminal-pressure hypothesis, and the cohort evidence that fibre \u226525\u201330 g/day is associated with ~40% lower incidence of diverticular disease</span></li>'+
         '<li><b>BSG \u2014 diverticular disease guidance</b><br><a href="https://www.bsg.org.uk" rel="noopener">bsg.org.uk</a><span class="rd"> \u2014 background on Hinchey staging</span></li>'+
         '<li><b>European Society of Coloproctology \u2014 guidelines for the management of diverticular disease of the colon (Colorectal Disease, 2020)</b><span class="rd"> \u2014 routine endoscopy after symptom-free recovery from a single CT-confirmed uncomplicated episode is controversial and potentially unnecessary; colonic examination after complicated disease or persistent symptoms; elective resection decided by recurrence, complications and quality-of-life impact rather than a fixed episode threshold</span></li>'+
         '<li><b>Greater Manchester Antimicrobial Guidelines (GMMMG, October 2024)</b><span class="rd"> \u2014 local antibiotic choices and referral thresholds; review at about 72 hours as local good practice</span></li>'+
         '<li><b>NICE HTG690 \u2014 Quantitative FIT to guide colorectal cancer pathway referral in primary care</b><span class="rd"> \u2014 FIT implementation alongside NG12; a low FIT does not exclude referral when clinical concern persists</span></li>'+
         '<li><b>Guts UK</b><br><a href="https://gutscharity.org.uk" rel="noopener">gutscharity.org.uk</a><span class="rd"> \u2014 patient information on diverticular disease</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> \u2014 all doses: co-amoxiclav, ciprofloxacin, metronidazole, piperacillin\u2013tazobactam, paracetamol, ispaghula husk, macrogol, mebeverine, rifaximin, mesalazine</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Diverticular disease and acute diverticulitis \u2014 NICE NG147, NICE NG12 (updated April 2026), BSG guidance, and the AVOD, DIABOLO and HPFS evidence. Diagnosis and management are merged on this page; there is no separate diverticulitis pathway to cross-check. Severity is a clinical judgement, not a CRP or WBC cut-off; safety-net everyone and review when indicated; colonoscopy or CT colonography after recovery only where indicated; surgery is an individualised decision, not a fixed episode count. Verify all doses against the current BNF before prescribing."
});
