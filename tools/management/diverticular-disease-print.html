  quickSub:"If you read nothing else on this page, read these six cards. Every number traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"\u26a0 Generalised peritonism is a 999 call", html:"Localised left iliac fossa tenderness is uncomplicated disease. Generalised guarding and rigidity means the patient has progressed to Hinchey III or IV \u2014 999 now. Mortality for faecal peritonitis is <b>40\u201350%</b>."},
    {tone:"amber", h:"Three different states, one word", html:"<b>Diverticulosis</b> \u2014 diverticula present, asymptomatic, no treatment. <b>Diverticular disease</b> \u2014 symptomatic without inflammation. <b>Acute diverticulitis</b> \u2014 inflamed, needs a severity assessment. <b>Management hinges entirely on which one you are in.</b>"},
    {tone:"blue", h:"NG147: most uncomplicated diverticulitis needs NO antibiotic", html:"Systemically well, CT-confirmed, no abscess or peritonism \u2192 <b>analgesia and observation, no antibiotic</b>. The <b>AVOD trial (623 patients)</b> found complication rates of <b>1.9% vs 2.0%</b>. Yet surveys show <b>80\u201390% of clinicians still prescribe</b> \u2014 this is the single biggest practice gap on the page."},
    {tone:"green", h:"When antibiotics ARE indicated", html:"Systemic features (<b>fever &gt;38.5\u00b0C, WBC &gt;15 \u00d7 10\u2079/L</b>), immunocompromise, or significant comorbidity \u2192 <b>co-amoxiclav 625 mg TDS for 5\u20137 days</b>; penicillin allergy \u2192 <b>ciprofloxacin 500 mg BD + metronidazole 400 mg TDS</b>."},
    {tone:"purple", h:"2WW \u00b7 NG12 \u2014 the cancer that mimics this", html:"Roughly 5\u201310% of patients managed as CT-confirmed uncomplicated diverticulitis are later found to have colorectal cancer. Arrange <b>interval colonoscopy at 6\u20138 weeks</b> after recovery, and use the NG12 colorectal routes in parallel \u2014 <b>diverticular disease does not protect against bowel cancer</b>."},
    {tone:"plain", h:"48\u201372 hour review is a safety standard", html:"NG147 makes review at <b>48\u201372 hours</b> part of managing anyone sent home \u2014 <b>not optional, and medico-legally load-bearing</b>. Not improving at 72 hours \u2192 reassess and admit."}

  pathway:[
    {title:"Exclude the complicated", html:"Perforation or peritonitis, abscess, obstruction, colovesical fistula, major diverticular haemorrhage, sepsis. Localised tenderness or generalised? NEWS2, FBC, CRP, U&amp;E, pregnancy test in women.", alert:true},
    {title:"Place the patient on the spectrum", html:"Diverticulosis, diverticular disease, or acute diverticulitis \u2014 then grade the diverticulitis as uncomplicated or complicated by temperature, WBC, CRP, imaging and social circumstances.", },
    {title:"Confirm and exclude the mimic", html:"CT abdomen and pelvis with IV contrast is the NG147 standard for suspected acute diverticulitis. <b>No colonoscopy in the acute phase</b> \u2014 perforation risk. Book the interval colonoscopy at the time of presentation so it is not forgotten."},
    {title:"Treat by severity", html:"Well and uncomplicated \u2192 analgesia, clear fluids, no antibiotic. Systemic features or immunocompromise \u2192 co-amoxiclav. Complicated \u2192 admit. Paracetamol first-line; avoid NSAIDs and opioids."},
    {title:"Review, prevent, exclude cancer", html:"Review at 48\u201372 hours; confirm recovery at 2 weeks; colonoscopy at 6\u20138 weeks; then 30 g fibre a day, fluids, activity, weight and smoking. Second episode \u2192 discuss elective colectomy."}

  sections:[

    {id:"severe", nav:"Exclude first", title:"Complicated disease \u2014 what must not be managed at home",
     sub:"Six presentations take this out of primary care. The first three are the ones that kill.",
     blocks:[
       {b:"warn", html:"Generalised peritonism \u2014 not localised left iliac fossa tenderness \u2014 means Hinchey III or IV and needs 999 immediately. Emergency management is a <b>Hartmann's procedure</b> (sigmoid resection, end colostomy, rectal stump closure) or peritoneal lavage. Mortality is 25\u201340%, and 40\u201350% for generalised faecal peritonitis."},
       {b:"dl", rows:[
         ["<b>Perforation / peritonitis</b>","Generalised guarding, rigidity, absent bowel sounds, haemodynamic instability \u2014 <b>Hinchey III\u2013IV</b> \u2192 <b>999</b>. IV access, resuscitate, nil by mouth, IV antibiotics; CT to stage"],
         ["<b>Diverticular abscess</b>","Swinging fever, persistent severe pain, a palpable tender left iliac fossa mass, <b>failure to resolve after 72 hours</b> \u2014 <b>Hinchey II, pericolic abscess \u22653 cm</b> \u2192 <b>same-day hospital</b>. CT with contrast, then <b>IR-guided percutaneous drainage</b> for abscesses over 3 cm plus IV antibiotics"],
         ["<b>Major diverticular haemorrhage</b>","Massive <b>painless</b> fresh lower GI bleeding \u2014 <b>the commonest cause of major lower GI bleed in the UK</b> \u2192 <b>999</b>. IV access, cross-match 4 units, CT angiography, then colonoscopic haemostasis or radiological embolisation"],
         ["<b>Colovesical fistula</b>","<b>Pneumaturia, faecaluria, recurrent UTIs with mixed organisms</b> \u2014 diverticular disease is the <b>commonest cause of colovesical fistula</b> \u2192 <b>urgent colorectal surgery</b>. CT cystogram or cystoscopy, then elective laparoscopic sigmoidectomy. A colovaginal fistula presents with faeculent vaginal discharge"],
         ["Obstruction","Distension, vomiting, absolute constipation \u2192 <b>admit</b>"],
         ["<b>Sepsis</b>","<b>NEWS2 \u22655</b>, haemodynamic instability \u2192 <b>999 / same-day surgical</b>"],
         ["<b>The cancer, in the same consultation</b>","A first diverticulitis episode <b>aged &lt;40</b>, a family history of colorectal cancer, iron-deficiency anaemia or rectal bleeding \u2014 <b>colorectal cancer (CRC) can mimic or complicate diverticular disease</b> and the CT appearance of a perforated cancer can be identical to perforated diverticulitis \u2192 <b>NG12 colorectal pathway</b> plus interval colonoscopy"]
       ]},
       {b:"table", head:["Hinchey stage","What it is","Management"], rows:[
         ["<b>I</b>","Pericolic abscess or phlegmon, confined to the mesentery adjacent to the perforated segment","IV antibiotics; likely conservative. <b>Modified Ia</b> = mild pericolic inflammation without abscess \u2014 the stage suitable for community management"],
         ["<b>II</b>","Pelvic or distant abscess","<b>IR drainage</b> plus IV antibiotics"],
         ["<b>III</b>","Generalised <b>purulent</b> peritonitis \u2014 a ruptured abscess, not bowel contents","Emergency laparotomy and <b>Hartmann's procedure</b>"],
         ["<b>IV</b>","Generalised <b>faecal</b> peritonitis \u2014 free perforation with bowel contents in the peritoneal cavity","Emergency Hartmann's; <b>mortality 40\u201350%</b>"]
       ]},
       {b:"why", html:"The Hinchey classification determines surgical management and prognosis, but its practical value in primary care is a single discriminator: a patient with localised left iliac fossa tenderness and no peritonism is likely Hinchey I and may be suitable for management at home; a patient with generalised peritonism has progressed to Hinchey III or IV and needs 999. Right-sided diverticula bleed more readily than left-sided ones \u2014 thinner walls and higher arterial pressure \u2014 which is why a right-sided presentation can both mimic appendicitis and bleed heavily."}
     ]},

    {id:"confirm", nav:"Grade it", title:"The spectrum, then the severity grading that decides home versus hospital",
     sub:"Two decisions: which of the three states is this, and if it is diverticulitis, is it uncomplicated?",
     blocks:[
       {b:"dl", rows:[
         ["Diverticulosis","Diverticula present, <b>asymptomatic</b> \u2014 no treatment, lifestyle advice only"],
         ["Diverticular disease","<b>Symptomatic</b> (intermittent lower abdominal pain, altered bowel habit) <b>without inflammation</b>"],
         ["Acute diverticulitis","<b>Inflamed</b> \u2014 constant left iliac fossa pain, fever, raised inflammatory markers, \u00b1 altered bowel habit or PR bleeding, <b>usually in an adult aged &gt;50</b> \u2192 grade the severity"],
         ["<b>Chronic diverticular pain</b>","Chronic low-grade left iliac fossa pain <b>without</b> fever or raised CRP, with diarrhoea and bloating \u2014 <b>painful diverticular disease / post-diverticulitis IBS-like syndrome</b>. High-fibre diet, hydration, avoid constipation, <b>mebeverine or another antispasmodic</b>. <b>This is not an acute episode and needs no antibiotic</b>"]
       ]},
       {b:"table", head:["","Uncomplicated \u2014 community management possible","Complicated \u2014 hospital required"], rows:[
         ["Pain and signs","Left iliac fossa pain with <b>localised</b> tenderness","<b>Generalised peritonism</b>"],
         ["Temperature","<b>Fever &lt;38.5\u00b0C</b>","<b>Fever &gt;38.5\u00b0C</b>"],
         ["Bloods","<b>WBC &lt;15 \u00d7 10\u2079/L and CRP &lt;150 mg/L</b>","<b>WBC &gt;15 or CRP &gt;150</b>"],
         ["Imaging","No abscess or perforation","<b>Abscess \u22653 cm (Hinchey Ib\u2013II)</b> or <b>pneumoperitoneum (Hinchey III\u2013IV)</b>"],
         ["The patient","Tolerating oral intake, <b>not immunocompromised</b>, not pregnant, adequate social support, reliable to return if deteriorating","Unable to tolerate oral medication, <b>immunocompromised</b>, <b>pregnant</b>, or <b>not socially supported</b>"],
         ["Progress","Improving","<b>Failure of outpatient treatment at 72 hours</b>"]
       ]},
       {b:"dl", rows:[
         ["Site of pain","<b>Left iliac fossa in about 95%</b> (sigmoid). Right iliac fossa in right-sided or ascending disease \u2014 less common, and <b>may mimic appendicitis</b>"],
         ["History that changes the plan","Onset (acute hours versus insidious days); constipation with pain beforehand is typical; <b>diarrhoea suggests colitis or complicated disease</b>; purulent or bloody PR discharge suggests complication; urinary or vaginal symptoms suggest fistula; previous episodes; low-fibre diet; <b>NSAID use</b>; immunosuppression"],
         ["Examination","Temperature; <b>localised versus generalised</b> tenderness; guarding and rigidity; bowel sounds \u2014 normal, hyperactive (obstruction) or absent (perforation); a palpable left iliac fossa mass (abscess or phlegmon); rectal examination for blood on the glove and anterior rectal tenderness from a pelvic collection"],
         ["<b>Diverticular haemorrhage</b>","A separate presentation: <b>painless massive fresh rectal bleeding</b>. <b>80% is self-limiting.</b> CT angiography detects active bleeding at <b>0.5 mL/min or more</b>; then colonoscopic haemostasis (clips, adrenaline injection), <b>superselective mesenteric arterial embolisation</b>, or surgery if bleeding fails to stop or recurs"]
       ]},
       {b:"why", html:"The severity grading is the whole decision. Fever &gt;38.5\u00b0C, a WBC &gt;15 or a CRP &gt;150 moves a patient out of the community pathway \u2014 and so do three non-biochemical facts that are easy to skip: immunocompromise, pregnancy, and living alone without anyone to notice deterioration. Grading is not just about how inflamed the colon is; it is about whether this patient can be safely observed at home."}
     ]},

    {id:"workup", nav:"Work-up", title:"CT confirms it and excludes the complications; colonoscopy comes later",
     sub:"One imaging decision, and one absolute prohibition.",
     blocks:[
       {b:"table", head:["Test","Role","Notes"], rows:[
         ["<b>CT abdomen and pelvis with IV contrast</b>","The gold standard, and the NG147 standard for all adults in whom acute diverticulitis is suspected","<b>Sensitivity ~97\u201398%, specificity ~97\u201399%</b>. Confirms the diagnosis, stages complications, and finds the alternative diagnosis. Use direct-access community CT where available; if unavailable and the diagnosis is clinically certain, consider same-day hospital assessment for imaging"],
         ["FBC, CRP, U&amp;E","Severity markers","WBC and CRP drive the home-versus-hospital decision and track recovery"],
         ["Erect CXR and AXR","If perforation is suspected","<b>Free gas under the diaphragm</b>"],
         ["Urine dipstick and MSU","Exclude UTI","Pyuria is common in diverticulitis from adjacent inflammation without a true UTI \u2014 do not let it relabel the diagnosis. <b>Mixed organisms on culture suggests a colovesical fistula</b>"],
         ["Pregnancy test","All women of reproductive age","Changes both imaging and disposition"],
         ["<b>Colonoscopy</b>","<b>At 6\u20138 weeks after recovery \u2014 never in the acute phase</b>","<b>Perforation risk in acutely inflamed bowel.</b> CT colonography is the alternative if colonoscopy is declined or unavailable"]
       ]},
       {b:"why", html:"The NG147 recommendation to CT all suspected cases <b>has not been fully implemented in UK primary care</b>, and the reason it matters is that <b>clinical diagnosis alone misclassifies roughly 35\u201340% of cases</b> \u2014 the alternatives include colorectal cancer in the same age group, appendicitis, ovarian pathology and ischaemic colitis. Treating empirically without imaging risks missing a complication, missing the real diagnosis, and prescribing an antibiotic that NG147 says is unnecessary."}
     ]},

    {id:"ladder", nav:"Treatment", title:"Treat by severity \u2014 and unlearn the reflex antibiotic",
     sub:"The evidence changed a decade ago; prescribing habits largely did not.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1", title:"Uncomplicated and systemically well \u2014 no antibiotic", when:"NG147 first-line",
          html:"<b>Analgesia and observation, with no antibiotic.</b> <b>Paracetamol 1 g QDS</b> first-line; <b>clear fluids for 24\u201348 hours</b>, then light diet as tolerated; rest. <b>Review at 48\u201372 hours \u2014 mandatory.</b>"},
         {step:"2", title:"Systemic features, immunocompromise or comorbidity \u2014 antibiotics", when:"fever &gt;38.5\u00b0C, WBC &gt;15",
          fromLabel:"systemically unwell",
          html:"<b>Co-amoxiclav 625 mg TDS for 5\u20137 days.</b> Penicillin allergy \u2192 <b>ciprofloxacin 500 mg BD plus metronidazole 400 mg TDS</b>. Duration is <b>5\u20137 days for uncomplicated, 10\u201314 days for complicated</b> disease."},
         {step:"3", title:"Not improving at 48\u201372 hours \u2014 reassess and admit", when:"failure to respond",
          fromLabel:"no better",
          html:"<b>Re-examine, check the CRP trend, and obtain a CT if not already done.</b> Failure to improve carries a real risk of abscess or perforation \u2014 <b>this is not the moment to extend the antibiotic course by phone</b>."},
         {step:"4", title:"Complicated disease \u2014 hospital", when:"admitted",
          fromLabel:"complicated",
          html:"<b>IV co-amoxiclav 1.2 g TDS</b>, or <b>piperacillin\u2013tazobactam (Tazocin) 4.5 g TDS</b> (or meropenem) if severe. IV fluids, nil by mouth then clear fluids, <b>CT-guided percutaneous drainage for abscesses \u22653 cm</b>, NG drainage if obstructed, daily surgical review. Sigmoid colectomy threshold: failure to improve at 48\u201372 hours with worsening peritonism, or Hinchey III/IV."},
         {step:"5", title:"Elective surgery \u2014 after recovery", when:"recurrent or complicated",
          fromLabel:"prevention of recurrence",
          html:"<b>Elective laparoscopic sigmoid colectomy</b> for <b>\u22652 documented episodes</b>, a young patient after a severe or complicated first episode, fistula, or persistent symptoms affecting quality of life. NG147 recommends offering elective colectomy after a second episode \u2014 discuss risks and benefits. <b>Colorectal cancer exclusion colonoscopy comes first.</b>"}
       ]},
       {b:"warn", html:"<b>Avoid NSAIDs and opioids.</b> NSAIDs \u2014 <b>ibuprofen, naproxen, diclofenac, aspirin above cardioprotective dose</b> \u2014 increase acute diverticulitis risk roughly <b>2\u20133-fold</b> and increase diverticular haemorrhage \u2014 they impair prostaglandin-mediated mucosal defence, reduce colonic blood flow and impair platelet function. Opioids constipate, raise intraluminal pressure, and <b>mask deterioration</b>. If an NSAID is genuinely required, use the minimum effective dose with a PPI and tell the patient the risk; low-dose cardioprotective aspirin (75\u2013100 mg) is generally continued, with the diverticular risk explained."},
       {b:"dl", rows:[
         ["Why co-amoxiclav","Acute diverticulitis is a <b>micro-perforation of a diverticulum</b> causing <b>polymicrobial</b> pericolic infection with enteric Gram-negatives (<b>E. coli, Klebsiella pneumoniae</b>) and anaerobes (<b>Bacteroides fragilis</b>). Co-amoxiclav 625 mg TDS covers both as a single agent \u2014 note that <b>ciprofloxacin resistance in E. coli is rising</b>"],
         ["<b>Hartmann's procedure</b>","Emergency sigmoid resection with end colostomy and rectal stump closure \u2014 the standard for Hinchey III/IV. <b>Stoma reversal is possible in 50\u201370% at 3\u20136 months.</b> Laparoscopic lavage with or without primary anastomosis is emerging for selected Hinchey III patients \u2014 it avoids a permanent stoma but carries a higher anastomotic leak risk"],
         ["Elective versus emergency surgery","Stoma rate is about 5\u201310% in elective surgery versus about 95% in an emergency Hartmann's \u2014 which is the argument for planned surgery in recurrent disease. Recurrence after sigmoid resection is <b>2\u20135%, against about 25% without surgery</b>. Counsel on <b>anastomotic leak (2\u20135%)</b>, wound infection, and <b>bladder and sexual dysfunction</b> from pelvic dissection near the autonomic nerves"],
         ["<b>Rifaximin</b>","400 mg BD for 7 days each month \u2014 limited evidence for recurrence prevention and not routinely recommended by NICE"],
         ["<b>Mesalazine</b>","1.6\u20133 g/day is used in some centres for painful diverticular disease, on a mucosal-inflammation hypothesis. <b>Cochrane: insufficient evidence; not NICE-recommended.</b> Reserve for proven chronic diverticular inflammation on biopsy or colonoscopy in a patient who is not a surgical candidate"]
       ]},
       {b:"why", html:"The no-antibiotic recommendation rests on level 1 evidence. The <b>AVOD trial (Chabok et al., BJS 2012)</b> randomised <b>623 patients</b> with CT-confirmed uncomplicated diverticulitis to antibiotics or observation and found <b>no difference in complications (1.9% versus 2.0%)</b>, time to recovery, or recurrence at one year; <b>DIABOLO (Netherlands, 2017)</b> agreed, and a <b>2018 Cochrane review</b> found no evidence of benefit for symptom relief, complications or length of stay. NG147 (2019) therefore says consider no antibiotic treatment for uncomplicated acute diverticulitis \u2014 while reserving antibiotics for systemic features, immunocompromise, and hospital management. Surveys nonetheless show 80\u201390% of clinicians still prescribe for every presentation."}
     ]},

    {id:"lifestyle", nav:"Prevention", title:"Fibre, fluid, activity, weight \u2014 and the myth to actively dispel",
     sub:"This is treatment between episodes, and one piece of historical advice needs unsaying.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"\ud83c\udf3e \u226530 g fibre a day", html:"Fibre \u226525\u201330 g/day is associated with roughly 40% lower incidence of diverticular disease and about 30% lower risk of complications. Wholegrain bread and pasta (3\u20134 g per slice or serving), porridge and bran cereals (4\u20138 g), <b>lentils and legumes (8 g per 80 g cooked)</b>, broccoli and Brussels sprouts (3\u20134 g), apples with skin (3 g), pears (5 g). <b>Increase gradually over 2\u20134 weeks</b> to avoid bloating and wind \u2014 and only once recovered from an acute episode."},
         {tone:"green", h:"\ud83d\udca7 Fluid \u2014 1.5\u20132 L a day", html:"Fibre absorbs water; inadequate fluid with high fibre causes constipation and defeats the purpose. Increase the two together."},
         {tone:"amber", h:"\ud83e\udd5c Nuts, seeds and popcorn are safe \u2014 say so", html:"The historical advice to avoid them rested on theoretical concern with no evidence. The <b>Health Professionals Follow-Up Study (Strate et al., JAMA 2008)</b> found nut and seed consumption was <b>not</b> associated with increased diverticulitis risk and was in fact <b>inversely</b> associated. <b>NG147: no dietary restrictions.</b> Actively advise <b>against</b> a restrictive low-residue diet \u2014 it worsens constipation and the disease."},
         {tone:"blue", h:"\ud83c\udfc3 Activity", html:"Physically active people have <b>roughly 20\u201325% lower incidence</b> of symptomatic diverticular disease \u2014 activity promotes colonic motility, reduces constipation and reduces intra-abdominal fat. Target <b>150 minutes of moderate aerobic activity a week</b> (about 30 minutes five times a week). <b>A sedentary lifestyle is an independent risk factor.</b>"},
         {tone:"blue", h:"\u2696 Weight", html:"<b>Obesity (BMI &gt;30)</b> increases incidence, severity, complication rate and recurrence; <b>visceral adiposity</b> specifically raises pericolic inflammation risk. Offer a weight-management programme (<b>NG189</b> pathway at BMI \u226530)."},
         {tone:"plain", h:"\ud83d\udeab Smoking", html:"Stop \u2014 smoking is associated with <b>complicated</b> disease."},
         {tone:"plain", h:"\ud83d\udebd Treat the constipation", html:"Constipation raises intraluminal pressure and drives progression. Fibre, fluid and exercise first; then bulk-forming laxative first-line (ispaghula husk / Fybogel, 3.5 g per sachet), osmotic (macrogol), or a softener (docusate). <b>Avoid long-term stimulants (bisacodyl, senna)</b> \u2014 they do not address the mechanism. <b>Toilet posture: a raised footstool reduces straining.</b>"},
         {tone:"purple", h:"\ud83d\udcd8 Written information", html:"Every patient diagnosed with acute diverticulitis should get written information: the warning signs needing emergency assessment, the dietary advice, <b>the need for colonoscopy at 6\u20138 weeks</b>, and what this means for long-term bowel care. <b>Guts UK</b> (gutscharity.org.uk) has comprehensive patient material."}
       ]},
       {b:"why", html:"The fibre recommendation is among the best-evidenced dietary interventions in gastroenterology. The <b>Painter and Burkitt hypothesis (1971)</b> proposed that a low-fibre Western diet raises colonic intraluminal pressure \u2014 small, hard, high-pressure stools \u2014 and produces diverticula at the weak points where arteries penetrate the colonic wall; the <b>UK Women's Cohort Study</b> and multiple prospective cohorts have since confirmed the association. Psyllium husk is an excellent soluble-fibre supplement where dietary fibre is inadequate."}
     ]},

    {id:"monitor", nav:"Follow-up", title:"The 48\u201372 hour review, the recovery trajectory, and the colonoscopy that must not be forgotten",
     sub:"Two safety standards live in this section, and both are commonly skipped.",
     blocks:[
       {b:"table", head:["When","What","Action"], rows:[
         ["<b>48\u201372 hours</b>","<b>Mandatory review</b> \u2014 telephone for low-risk, face-to-face if borderline","Temperature normalising? Pain improving rather than worsening? Tolerating fluids and diet? CRP trending down? <b>Any \u2018no\u2019 lowers the threshold for hospital referral</b>"],
         ["2 weeks","Confirm full clinical recovery","CRP should have normalised by 2 weeks; if it is still raised, repeat the CT \u2014 persistent abscess or an alternative diagnosis"],
         ["<b>6\u20138 weeks</b>","<b>Interval colonoscopy to exclude colorectal cancer</b>","Arrange the referral <b>at the time of the acute presentation</b> so it is not forgotten, code the episode with a specific <b>SNOMED</b> code, and run a <b>recall system</b> to confirm the colonoscopy happened"],
         ["Beyond 4\u20136 weeks","Persisting symptoms after recovery","Requires colonoscopy referral to exclude cancer even if the 6\u20138 week scope is already planned"],
         ["Any second episode","Recurrence","<b>Colorectal surgery referral to discuss elective sigmoid colectomy</b>"],
         ["After the colonoscopy","Act on the result","<b>Normal</b> (diverticula, no polyps) \u2192 reassure, fibre advice, routine 5-yearly surveillance if no other risk factors. <b>Adenomatous polyps</b> \u2192 polypectomy and a surveillance schedule by adenoma grade. <b>Cancer</b> \u2192 urgent MDT and staging"]
       ]},
       {b:"dl", rows:[
         ["<b>The expected recovery trajectory</b>","Pain and tenderness improve within <b>48\u201372 hours</b>; fever settles within <b>48 hours</b>; normal diet resumes by <b>5\u20137 days</b>; the patient is well by <b>10\u201314 days</b>. Departure from this is the signal to reassess"],
         ["<b>Recurrence risk</b>","About 20\u201325% recur within 5 years after a first episode; about 50\u201360% within 5 years after a second. Risk factors: immunosuppression, obesity, physical inactivity, a high-fat low-fibre diet, NSAIDs, younger age"],
         ["Urgent, not interval, colonoscopy","Change in bowel habit persisting after recovery, rectal bleeding, unexplained anaemia, or age &lt;40 \u2014 escalate rather than waiting for the 6\u20138 week slot"],
         ["Ongoing low-grade pain afterwards","May be persistent pericolic inflammation, chronic diverticular disease, a post-diverticulitis IBS-like syndrome \u2014 <b>or an underlying cancer</b>"]
       ]},
       {b:"cards", items:[
         
       ]},
       {b:"cards", items:[
         {tone:"red", h:"\ud83d\udd34 Peritonitis or perforation", html:"\u201cSevere tummy pain that spreads across the whole abdomen, a rigid tummy, high fever, or collapse \u2014 call <b>999</b>. Don't wait for your appointment.\u201d"},
         {tone:"red", h:"\ud83e\ude78 Heavy bleeding", html:"\u201cA large amount of fresh blood from the back passage \u2014 <b>999</b>.\u201d"},
         {tone:"amber", h:"\ud83d\udfe0 Not improving", html:"\u201cIf the pain worsens, the fever returns or rises, you start vomiting, or you cannot keep fluids down \u2014 contact us the <b>same day</b>.\u201d"},
         {tone:"amber", h:"\ud83d\udeb0 Fistula clues", html:"\u201cPassing air or stool in your urine, or repeated urine infections \u2014 tell us; it needs a specific check.\u201d"},
         {tone:"blue", h:"\ud83d\udd2c The follow-up test", html:"\u201cYou will need a camera test of the bowel about 6\u20138 weeks after you have recovered. It is important \u2014 please don't skip it.\u201d"},
         {tone:"green", h:"\ud83e\udd5c Eat the nuts", html:"\u201cYou can eat nuts, seeds and popcorn safely \u2014 the old advice to avoid them was wrong.\u201d"}
       ]},
       {b:"say", html:"The inflamed pouch in your bowel should settle over the next few days. I am not giving you an antibiotic, and that is deliberate \u2014 good trials show it does not speed recovery or prevent complications when you are otherwise well. What matters more is paracetamol for the pain, clear fluids for a day or two, and my seeing you again in two or three days. I will also arrange a camera test of your bowel for six to eight weeks after you are better, because there is one other condition that can look exactly like this on a scan and I want to be certain."}
     ]},

    {id:"loop", nav:"Not responding?", title:"Recurrent or not settling? Reassess", sub:"Distinguish uncomplicated recurrence from complications or an alternative diagnosis.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"1 \u00b7 Complication?", html:"Persisting fever, severe pain, peritonism <b>or a new mass</b> \u2192 abscess, perforation or fistula \u2014 <b>not a failed antibiotic course</b>."},
         {tone:"amber", h:"2 \u00b7 Cancer excluded?", html:"Change in habit, bleeding, weight loss, anaemia or a mass \u2192 <b>NG12 route plus colonoscopy</b>. Remember <b>5\u201310% of CT-confirmed 'diverticulitis' turns out to be malignant</b>."},
         {tone:"blue", h:"3 \u00b7 Is it even inflammation?", html:"Chronic pain <b>without fever or a raised CRP</b> is painful diverticular disease \u2014 antispasmodics, <b>not antibiotics</b>."},
         {tone:"blue", h:"4 \u00b7 Fibre and fluid", html:"Genuinely optimised: <b>\u226530 g fibre a day</b> in practice and <b>1.5\u20132 L of fluid</b>, with a bulk-forming laxative if needed."},
         {tone:"amber", h:"5 \u00b7 Harmful drugs", html:"Still on the repeat? <b>Stop NSAIDs and opioids</b>."},
         {tone:"blue", h:"6 \u00b7 Refer", html:"<b>\u22652 episodes</b>, or complicated disease \u2192 colorectal surgery to discuss <b>elective laparoscopic sigmoid colectomy</b>."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer \u2014 who goes where, and the NG12 routes",
     sub:"Emergencies same day; the cancer routes run in parallel with everything else.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999", html:"<b>Generalised peritonism</b> (perforation), <b>haemodynamic instability or collapse</b>, <b>massive rectal haemorrhage</b>, complete bowel obstruction."},
         {tone:"red", h:"Same-day surgical assessment", html:"<b>Suspected abscess</b> (pericolic mass over 3 cm on CT), <b>failed outpatient treatment at 72 hours</b>, <b>fever &gt;38.5\u00b0C with WBC &gt;15</b>, unable to tolerate oral medication, a developing palpable left iliac fossa mass, <b>any immunocompromised patient</b>, <b>pregnancy</b>."},
         {tone:"amber", h:"Urgent colorectal surgery", html:"<b>Colovesical or colovaginal fistula</b>; refractory or recurrent diverticular haemorrhage."},
         {tone:"amber", h:"Elective colorectal surgery", html:"<b>\u22652 episodes of acute diverticulitis</b>, a young patient (<b>&lt;50</b>) after a first severe episode, complicated disease, stricture, or persistent symptoms affecting quality of life."},
         {tone:"purple", h:"2WW \u00b7 NG12 \u2014 suspected colorectal cancer", html:"Refer on the <b>suspected colorectal cancer pathway (2 weeks)</b> for: an <b>abdominal mass consistent with bowel cancer</b>, a <b>rectal mass</b>, <b>unexplained rectal bleeding at 50 and over</b>, <b>unexplained weight loss with abdominal pain at 40 and over</b>, or <b>iron-deficiency anaemia or a change in bowel habit at 60 and over</b>. Use <b>direct-access FIT (\u226510 \u00b5g Hb/g)</b> to guide referral where NG12 specifies it. <b>NICE NG12 (May 2025).</b>"},
         {tone:"purple", h:"2WW \u00b7 why it matters here", html:"Diverticular disease and colorectal cancer share the same peak age (65\u201380), the same segment (sigmoid colon) and the same symptoms \u2014 change in bowel habit, rectal bleeding, left iliac fossa pain. Roughly 5\u201310% of patients managed as CT-confirmed uncomplicated diverticulitis are later found to have colorectal cancer. Diverticular disease does <b>not</b> protect against cancer, and a cancer can arise within a diverticular segment \u2014 so a diverticular label is never a reason not to investigate a new symptom."},
         {tone:"cream", h:"Keep in primary care", html:"Confirmed uncomplicated diverticulitis in a well patient: analgesia and observation per NG147, the <b>48\u201372 hour review</b>, the <b>6\u20138 week colonoscopy referral</b>, fibre and lifestyle, constipation management, and stopping the NSAIDs."}
       ]},
       {b:"say", html:"This is an inflamed pocket in the wall of your lower bowel. Most people settle with simple painkillers and fluids, and I will see you again in two or three days to check you are on the mend. Two things I want to be clear about: come straight in \u2014 or call 999 \u2014 if the pain spreads across your whole tummy or you feel very unwell; and I am arranging a camera test in six to eight weeks, because bowel cancer can look very similar and I would rather rule it out properly."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 58-year-old man with two days of constant left iliac fossa pain, a temperature of 37.9\u00b0C and localised tenderness without guarding. He had a similar episode 14 months ago, treated with antibiotics elsewhere, and expects the same again. He takes regular naproxen for knee pain. He mentions, almost in passing, that his stools have been looser for about three months."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Grades severity explicitly (temperature, tenderness pattern, bloods) rather than diagnosing by site alone; explains why no antibiotic is being given and manages the expectation rather than capitulating; <b>stops the naproxen</b>; arranges the <b>48\u201372 hour review</b>; and \u2014 the step candidates most often miss \u2014 does not let the diverticular label absorb the three-month change in bowel habit: this is a second episode requiring surgical discussion <em>and</em> an NG12 colorectal assessment, with the interval colonoscopy booked at presentation rather than promised vaguely. <a href='../../cases/diverticulosis.html'>Open the full casebook chapter →</a>"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>NICE NG147 \u2014 Diverticular disease: diagnosis and management (2019)<br><a href="https://www.nice.org.uk/guidance/ng147" rel="noopener">nice.org.uk/guidance/ng147</a><span class="rd"> \u2014 the no-antibiotic recommendation for uncomplicated acute diverticulitis, CT for all suspected cases, the 48\u201372 hour review, no dietary restrictions, and elective colectomy after a second episode</span></li>'+
         '<li><b>NICE NG12 \u2014 Suspected cancer: recognition and referral (May 2025)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> \u2014 colorectal 2-week-wait criteria (abdominal or rectal mass; rectal bleeding at 50+; weight loss with abdominal pain at 40+; iron-deficiency anaemia or change in bowel habit at 60+) and direct-access FIT at \u226510 \u00b5g Hb/g</span></li>'+
         '<li><b>AVOD trial \u2014 Chabok et al., British Journal of Surgery 2012</b><span class="rd"> \u2014 623 patients with CT-confirmed uncomplicated acute diverticulitis randomised to antibiotics or observation: complications 1.9% vs 2.0%, with no difference in recovery time or 1-year recurrence</span></li>'+
         '<li><b>DIABOLO trial (Netherlands, 2017) and Cochrane review (2018)</b><span class="rd"> \u2014 no evidence of benefit from antibiotics in uncomplicated acute diverticulitis for symptom relief, complications, or length of stay</span></li>'+
         '<li><b>HPFS \u2014 Strate et al., JAMA 2008</b><span class="rd"> \u2014 nut, seed and popcorn consumption not associated with increased diverticulitis risk, and inversely associated with acute diverticulitis; the basis for abandoning the historical food restrictions</span></li>'+
         '<li><b>Painter and Burkitt (1971) and the UK Women\u2019s Cohort Study</b><span class="rd"> \u2014 the low-fibre / intraluminal-pressure hypothesis, and the cohort evidence that fibre \u226525\u201330 g/day is associated with ~40% lower incidence of diverticular disease</span></li>'+
         '<li><b>BSG \u2014 diverticular disease guidance</b><br><a href="https://www.bsg.org.uk" rel="noopener">bsg.org.uk</a><span class="rd"> \u2014 Hinchey staging and surgical thresholds; interval colonoscopy after an acute episode</span></li>'+
         '<li><b>Guts UK</b><br><a href="https://gutscharity.org.uk" rel="noopener">gutscharity.org.uk</a><span class="rd"> \u2014 patient information on diverticular disease</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> \u2014 all doses: co-amoxiclav, ciprofloxacin, metronidazole, piperacillin\u2013tazobactam, paracetamol, ispaghula husk, macrogol, mebeverine, rifaximin, mesalazine</span></li>'+
         '</ul></div>'}
