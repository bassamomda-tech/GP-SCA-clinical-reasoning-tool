  foot:"Familial hypercholesterolaemia — NICE CG71, NG238 and NICE. Never risk-score FH with QRISK: it is monogenic, lifelong and very high risk, and is treated on the diagnosis. Suspect it at TC above 7.5 or LDL above 4.9 with premature family CHD or tendon xanthomata, and search your records for TC above 9. Refer all suspected cases for specialist confirmation and genetic testing — and make sure cascade testing of first- and second-degree relatives actually happens, because diagnosing one person is diagnosing a family. Treat to a ≥50% reduction in LDL-C. Stop statins around pregnancy and plan contraception. Verify doses against the current BNF before prescribing."
