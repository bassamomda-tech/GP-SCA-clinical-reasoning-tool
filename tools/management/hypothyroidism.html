  stemSub:"One page for the whole condition. Read the TFT pattern correctly (primary, pituitary, sick euthyroid), examine the neck and the reflexes, order the baseline that actually changes management, make the subclinical treat/trial/monitor decision by the numbers, choose the starting dose by age and cardiac status, aim for a TSH within the reference range, send pregnancy and preconception to a separate specialist/local pathway, fix absorption before raising doses, and leave T3 to specialists.",

  ],
  lead:'<div class="mg-layers"><a href="#confirm"><b>Read the TFTs</b><small>Primary \u00b7 pituitary \u00b7 sick euthyroid</small></a><a href="#examine"><b>Examine</b><small>Neck \u00b7 heart \u00b7 reflexes</small></a><a href="#subclinical"><b>Subclinical</b><small>Treat \u00b7 trial \u00b7 monitor</small></a><a href="#ladder"><b>Levothyroxine</b><small>Dose \u00b7 titrate \u00b7 pregnancy</small></a><a href="#refer"><b>Refer</b><small>Endocrine \u00b7 suspected cancer</small></a></div>',
  quickSub:"If you read nothing else on this page, read these six cards. Every number traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"\u26a0 Check the pattern before you treat", html:"Low or inappropriately normal TSH with a low FT4 is secondary (pituitary) hypothyroidism \u2014 not a titrate-on-TSH problem. If adrenal insufficiency is clinically suspected, assess urgently. In a clinically stable patient, obtain a <b>9am cortisol before starting levothyroxine</b> and discuss with endocrinology \u2014 giving levothyroxine before steroid replacement can <b>precipitate an adrenal crisis</b>. If adrenal crisis is suspected (hypotension, vomiting, severe hyponatraemia, hypoglycaemia, hyperkalaemia or altered consciousness), give <b>emergency hydrocortisone immediately and admit</b> \u2014 do not delay treatment for cortisol results. Titrating this patient to a \u201cnormal TSH\u201d chronically under-replaces them."},
    {tone:"red", h:"Never diagnose subclinical disease on one result", html:"<b>Repeat TSH and FT4 at 3 months</b> \u2014 about <b>half of mild elevations normalise spontaneously</b>. Treating on a single reading commits the patient to lifelong therapy for what may have been a blip. Exclude non-thyroidal illness (TSH commonly overshoots during recovery), recent thyroiditis, amiodarone or lithium, and <b>biotin assay interference</b> (withhold biotin before repeat testing according to local laboratory advice; a longer interval may be needed with high-dose treatment or renal impairment)."},
    {tone:"amber", h:"The subclinical decision in one line", html:"<b>TSH 10 or higher on two tests 3 months apart \u2192 consider treating (NICE NG145).</b> TSH 4\u201310 with symptoms and under 65 \u2192 a time-limited 6-month trial, stopped if symptoms persist once TSH is normal. <b>TSH 4\u201310 and asymptomatic, or aged 65 and over \u2192 usually monitor</b>, but individualise (TSH trajectory, anti-TPO, goitre, previous surgery or radioiodine, symptoms, frailty, cardiovascular status, patient preference)."},
    {tone:"blue", h:"Starting dose is set by age and heart", html:"Under 65 with no cardiac disease: full replacement 1.6 micrograms/kg/day rounded to 25 micrograms (<b>100 \u00b5g</b> at 60 kg, <b>125 \u00b5g</b> at 80 kg, <b>150 \u00b5g</b> at 100 kg). <b>Aged 65 or over, cardiovascular disease, severe longstanding hypothyroidism or possible adrenal insufficiency: start low (25\u201350 micrograms/day)</b> and titrate cautiously \u2014 thyroxine raises myocardial oxygen demand, and going fast in IHD precipitates angina, MI or arrhythmia."},
    {tone:"cream", h:"Recheck from about 6 weeks", html:"In primary hypothyroidism, <b>recheck TSH from approximately 6 weeks after initiation or a dose change</b>; 6\u20138 weeks is usually practical. Monitor about every 3 months until stable, then annually; check FT4 too when clinically indicated. Exceptions: pregnancy, suspected central hypothyroidism, severe or prolonged untreated disease, suspected adrenal insufficiency and significant deterioration. <b>Aim to keep TSH within the laboratory reference range</b> \u2014 do not routinely increase levothyroxine solely to achieve a lower-half TSH, and avoid suppression."},
    {tone:"green", h:"Pregnancy is the highest-stakes titration", html:"Pregnancy or preconception needs a <b>separate, prompt specialist/local pathway</b> (NICE NG145: refer). Already on levothyroxine: contact the practice promptly after a positive test \u2014 a dose increase of about <b>25\u201330%</b> is commonly needed immediately (for example, two extra doses a week), pending urgent TFTs and shared obstetric/endocrine care. Newly detected subclinical disease: treatment thresholds are lower and depend on TSH, FT4, TPO-antibody status and trimester-specific ranges \u2014 not automatic treatment."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step is where patients come to harm.",
  pathway:[
    {title:"Read the pattern, not just the TSH", html:"Raised TSH with low FT4 = overt \u2192 treat. Raised TSH with normal FT4 = subclinical \u2192 repeat in about 3 months, unless pregnancy, TSH \u226510 with concerning features, or an urgent clinical context. Low, normal or only slightly raised TSH with low FT4 = consider central hypothyroidism or non-thyroidal illness \u2192 assess cortisol/adrenal status and refer, never titrate on TSH. Abnormal TFTs during severe illness: interpret cautiously and repeat when recovered if appropriate.", alert:true},
    {title:"Exclude what it isn't", html:"Pregnancy or trying to conceive (separate prompt specialist/local pathway), age &lt;16, suspected adrenal insufficiency, amiodarone or lithium, and any thyroid lump or compressive neck symptom. An unexplained thyroid lump \u2192 consider an NG12 suspected cancer pathway referral regardless of the TSH; compressive symptoms without a lump are not an NG12 criterion \u2192 urgent ENT or endocrine referral (local pathway), checking NG12\u2019s dysphagia and hoarseness routes."},
    {title:"Confirm and stratify", html:"Repeat TSH + FT4 at 3 months, check <b>anti-TPO once</b>. Then stratify subclinical disease by TSH level, age and symptoms."},
    {title:"Treat, trial or monitor", html:"Overt \u2192 treat. TSH \u226510 on two occasions 3 months apart \u2192 consider treating. TSH above range but &lt;10, under 65 with symptoms \u2192 6-month trial. Otherwise usually monitor at a defined interval, individualised; anti-TPO, goitre and previous surgery or radioiodine favour closer monitoring. Fix absorption from day one."},
    {title:"Titrate and hold the rhythm", html:"TSH from about 6 weeks after each change \u2192 about every 3 months until stable \u2192 annually; aim within the reference range. Stop a trial that hasn't worked. Watch for over-replacement \u2014 AF and fractures."}
  ],
  sections:[

    {id:"confirm", nav:"Read the TFTs", title:"Confirm it is primary \u2014 the patterns that change the plan", sub:"The whole management logic hinges on which pattern you are looking at. Two of these five need a different pathway entirely.",
     blocks:[
       {b:"table", head:["Pattern","TSH","FT4","Meaning \u2192 action"], rows:[
         ["<b>Overt primary</b>","\u2191 (usually &gt;10)","\u2193","<b>Treat with levothyroxine regardless of symptoms</b> \u2014 this pathway"],
         ["<b>Subclinical</b>","\u2191 (4\u201310, or &gt;10)","<b>Normal</b>","<b>Repeat at 3 months</b> + anti-TPO antibodies \u2192 the treat/trial/monitor decision below"],
         ["<b>Secondary (pituitary)</b>","<b>Low, normal or only slightly raised</b>","\u2193","<b>NOT a levothyroxine-titrate-on-TSH problem</b>, and not reducible to a single biochemical pattern, especially in acute illness. If stable, <b>9am cortisol</b> and discuss with endocrinology; if adrenal crisis is suspected, emergency hydrocortisone and admission without waiting for results \u2014 treating thyroid before steroid replacement can precipitate <b>adrenal crisis</b> \u2192 endocrinology. \u00b1 headache, visual symptoms, other pituitary hormone loss"],
         ["<b>Sick euthyroid</b>","Low/normal","Low/normal","Avoid routine thyroid testing during acute non-thyroidal illness unless thyroid dysfunction is part of the clinical differential. If results are abnormal and the patient is stable, repeat after recovery, usually after <b>at least 6 weeks</b>, unless earlier specialist assessment is required"],
         ["<b>Poor adherence pattern</b>","\u2191","Normal/\u2191","Taking it only before the blood test \u2014 FT4 responds in days, TSH takes weeks. Explore gently"]
       ]},
       {b:"dl", rows:[
         ["Cause","<b>Autoimmune (Hashimoto's \u2014 anti-TPO positive)</b> is most UK cases; post-thyroidectomy or radioiodine; drugs \u2014 <b>amiodarone, lithium</b> (6-monthly TFTs on both), and the immunotherapy group: <b>checkpoint inhibitors, interferon and tyrosine kinase inhibitors</b>; post-partum thyroiditis (often transient \u2014 confirm the need for lifelong treatment later); subacute thyroiditis"],
         ["Baseline","TSH; FT4 where TSH is abnormal or central disease is suspected; <b>anti-TPO once</b> in selected subclinical disease; pregnancy status or intention; medication and supplement review. Other tests selectively (see Work-up). <b>No routine FT3, and no repeat antibody testing</b>"],
         ["<b>Post-thyroid-cancer</b>","The oncology team may want TSH deliberately <b>suppressed (&lt;0.1)</b> \u2014 <b>check the letter before \u201ccorrecting\u201d it</b>"],
         ["<b>Transient causes of a raised TSH</b>","Recovery from any non-thyroidal illness (sick-euthyroid rebound), recent treatment of hyperthyroidism, recent thyroiditis (post-partum, subacute), post-viral states, drugs raising TSH, <b>high-dose biotin supplements and assay artefact</b>, and normal <b>diurnal variation</b> (TSH is higher at night and early morning) \u2014 mild fluctuation around the upper reference limit is common and often not pathological"]
       ]},
       {b:"why", html:"NICE NG145 requires a repeat TSH with FT4 after <b>3 months</b> before acting on a mildly raised TSH, because roughly <b>half normalise spontaneously</b>. Central hypothyroidism is the classic trap: the TSH is misleadingly low or normal, so treating \u201cto a normal TSH\u201d chronically under-replaces the patient. And the whole subclinical logic depends on the FT4 being normal \u2014 if it is low, the patient has overt disease and the \u201cconsider/monitor\u201d reasoning no longer applies."}
     ]},

    {id:"severe", nav:"Exclude first", title:"Before you label it \u201csubclinical\u201d \u2014 exclude the things it isn\u2019t", sub:"Each of these needs a different, more urgent, or fundamentally different approach that a TSH-led algorithm is not designed for.",
     blocks:[
       {b:"cards", items:[
         {tone:"purple", h:"Suspected cancer \u00b7 NICE NG12 \u2014 thyroid cancer", html:"An unexplained thyroid lump \u2192 consider a suspected cancer pathway referral (2 weeks) for thyroid cancer \u2014 independent of the TSH, which is usually normal in thyroid malignancy (<a href='https://www.nice.org.uk/guidance/ng12' rel='noopener'>NICE NG12</a>). A rapidly enlarging or fixed goitre, hoarseness, dysphagia or a neck node is clinically concerning, but these do not all independently meet the same NG12 criterion \u2014 decide on the examination and the local head-and-neck pathway; in an adult aged <b>45 or over</b>, persistent unexplained hoarseness or an unexplained neck lump is itself an NG12 head-and-neck criterion. Do not let a normal or mildly abnormal TFT reassure you out of examining the neck."},
         {tone:"red", h:"Overt hypothyroidism", html:"Raised TSH with a <b>low</b> FT4 \u2014 this is overt disease, not subclinical \u2192 <b>treat with levothyroxine regardless of symptoms</b>."},
         {tone:"red", h:"Suspected adrenal insufficiency", html:"Hypotension, hyponatraemia, fatigue, pigmentation, postural dizziness \u2192 assess urgently. If stable, <b>9am cortisol before any thyroxine</b> and discuss with endocrinology: levothyroxine can <b>precipitate adrenal crisis</b> if Addison's coexists. If adrenal crisis is suspected (hypotension, vomiting, severe hyponatraemia, hypoglycaemia, hyperkalaemia, altered consciousness) \u2192 <b>emergency hydrocortisone and admission</b>; do not wait for cortisol."},
         {tone:"red", h:"Myxoedema coma (rare)", html:"Doses missed for weeks, then drowsiness, confusion, hypothermia \u2192 <b>emergency admission</b>. Hospital treatment is <b>IV T3 or T4 plus IV hydrocortisone</b> with supportive care, usually in <b>ITU</b> \u2014 the hydrocortisone matters because coexisting adrenal insufficiency cannot be excluded in the moment."},
         {tone:"red", h:"Cardiac decompensation in severe hypothyroidism", html:"A new pericardial effusion, heart failure, bradyarrhythmia or a prolonged QTc \u2192 same-day cardiology, and 999 if haemodynamically compromised. Muffled heart sounds in a bradycardic patient warrant an <b>urgent ECG and echocardiogram</b> \u2014 severe hypothyroidism causes sinus bradycardia, low-voltage complexes and QTc prolongation."},
         {tone:"amber", h:"Pregnant or trying to conceive", html:"<b>This pathway does not apply</b> \u2192 prompt specialist/local pathway advice (NICE NG145: refer); thresholds depend on TSH, FT4, TPO-antibody status and trimester-specific ranges. Untreated disease risks miscarriage and fetal neurodevelopment \u2014 subclinical disease with positive antibodies is associated with a <b>2\u20133\u00d7 miscarriage risk</b>."},
         {tone:"amber", h:"Central (secondary) hypothyroidism", html:"Low, normal or only slightly raised TSH with a <b>low free T4</b>, \u00b1 headache, visual symptoms or other pituitary hormone loss \u2192 <b>refer endocrinology; do not titrate on TSH</b>."},
         {tone:"amber", h:"Very high TSH, or systemically unwell", html:"TSH well above 10 with marked symptoms, or intercurrent illness \u2192 <b>treat as overt and assess clinically</b>; don't just \u201cwatch and repeat\u201d."},
         {tone:"amber", h:"Amiodarone, lithium or immunotherapy", html:"Drug-induced thyroid dysfunction can <b>evolve quickly</b> and causes both hypo- and hyperthyroidism \u2192 monitor with the initiating team, don't simply observe. <b>6-monthly TFTs</b>, and for 12 months after stopping amiodarone."},
         {tone:"amber", h:"Child or young person aged &lt;16", html:"Different thresholds and causes \u2192 <b>paediatric or endocrine referral</b> rather than this adult pathway. <b>Congenital hypothyroidism</b> is picked up on the <b>newborn bloodspot</b>; a child with growth failure or delayed puberty needs urgent paediatric endocrinology \u2014 do not delay, the neurodevelopmental harm is irreversible."}
       ]}
     ]},

    {id:"examine", nav:"Examine", title:"Targeted examination \u2014 what changes management", sub:"Examination does three jobs here: it confirms severity, it finds the neck that needs a suspected cancer referral, and it sets how cautiously you start.",
     blocks:[
       {b:"table", head:["Look at","What to find","Why it changes the plan"], rows:[
         ["<b>Thyroid gland</b>","Size, consistency, nodules, tenderness, bruit","<b>Hard, irregular or fixed \u2192 suspected cancer pathway referral.</b> Diffusely firm, non-tender and symmetrical \u2192 Hashimoto's. Tender \u2192 subacute thyroiditis. <b>Tracheal deviation or a large/retrosternal goitre \u2192 urgent clinical assessment and appropriate imaging</b> (usually ultrasound for the cervical thyroid; cross-sectional imaging if retrosternal extension or compression is suspected). Cervical lymphadenopathy with a thyroid mass has a high positive predictive value for malignancy"],
         ["<b>Cardiovascular</b>","Rate and rhythm (bradycardia, AF), BP (hypertension is common), heart sounds, peripheral oedema","<b>Muffled sounds suggest a pericardial effusion.</b> ECG if bradycardic, if an effusion or arrhythmia is suspected, or with cardiac symptoms or clinically significant cardiac disease \u2014 not a universal prerequisite to starting levothyroxine"],
         ["<b>Neurological</b>","<b>Delayed relaxation of the ankle reflexes</b> (a classic sign, but not pathognomonic and neither sensitive nor specific enough to diagnose alone), cerebellar ataxia in severe disease, carpal tunnel signs (<b>Tinel's and Phalen's</b>)","Hypothyroid myopathy and entrapment neuropathy are reversible with replacement \u2014 and their presence marks more than a mild biochemical abnormality. Assess cognition in overt disease"],
         ["<b>Skin and hair</b>","Dry, cool, pale or yellowish skin (carotenaemia); coarse brittle hair; <b>loss of the outer third of the eyebrow (Hertoghe's sign)</b>; non-pitting oedema of the face and limbs","These are the features of established overt disease \u2014 they argue against \u201cwatch and repeat\u201d"]
       ]},
       {b:"why", html:"<b>Examination gives you a severity anchor.</b> A patient with myxoedematous facies, bradycardia and delayed reflexes needs a <b>more cautious initiation at a lower starting dose</b> than an incidentally found subclinical case with a normal examination \u2014 the same TSH means different things in those two people. And the neck examination is the part a TSH-led approach forgets: <b>thyroid cancer usually has a normal TSH</b>, so a normal blood test must never talk you out of palpating the gland."}
     ]},

    {id:"workup", nav:"Work-up", title:"Investigations \u2014 the baseline that changes management, and the tests to stop ordering",
     sub:"Order what alters the plan. Repeating antibodies and chasing T3 are the two commonest wasted tests in thyroid care.",
     blocks:[
       {b:"table", head:["Test","When","What it does for you"], rows:[
         ["<b>TSH + free T4</b>","Always \u2014 and repeat at 3 months before acting on a mild elevation","Establishes the pattern. FT4 where TSH is abnormal or central disease is suspected. Avoid routine testing during acute illness unless thyroid dysfunction is in the differential"],
         ["<b>Anti-TPO antibodies</b>","<b>Once</b>, in selected patients with subclinical hypothyroidism","Confirms autoimmune cause and predicts progression from subclinical to overt \u2014 it sets the monitoring interval. <b>Do not repeat</b>"],
         ["Thyroglobulin antibodies","Only if anti-TPO negative and Hashimoto's still suspected","Less sensitive; <b>not routine</b>"],
         ["<b>9am cortisol \u00b1 short Synacthen (ACTH stimulation) test</b>","If features suggest coexisting adrenal insufficiency \u2014 hypotension, hyponatraemia, <b>hyperpigmentation</b>, unwell","<b>In a stable patient, check BEFORE starting levothyroxine</b> and discuss with endocrinology \u2014 thyroxine increases cortisol metabolism and can precipitate an Addisonian crisis. Not a substitute for emergency hydrocortisone and admission if crisis is suspected"],
         ["<b>Pregnancy test</b>","Any woman of reproductive age with new hypothyroidism","Pregnancy changes the TSH reference range and the treatment threshold \u2014 confirm before dosing"],
         ["Lipids","As part of cardiovascular risk assessment; reassess once euthyroid where this will alter management","Assess and manage cardiovascular risk according to the usual lipid and prevention pathway. Treat hypothyroidism, then reassess lipids once euthyroid where this will alter management. <b>Do not delay indicated statin therapy solely because hypothyroidism is present</b>"],
         ["FBC, ferritin, B12 and folate","Selectively \u2014 persistent fatigue or relevant clinical suspicion","Autoimmune thyroid disease clusters with <b>pernicious anaemia</b>; iron deficiency both impairs levothyroxine absorption and reduces peripheral T4\u2192T3 conversion"],
         ["U&amp;E, LFTs, CK","U&amp;E and LFTs where clinically indicated; CK if myalgia or weakness is prominent","Raised CK is common with myopathy; transaminases may rise \u2014 a useful baseline if a statin may follow. <b>Routine LDH is not required</b>"],
         ["ECG","Bradycardia, arrhythmia, suspected effusion, cardiac symptoms or clinically significant cardiac disease \u2014 not a universal prerequisite","Sinus bradycardia, low-voltage complexes, <b>prolonged QTc</b>"],
         ["<b>Thyroid ultrasound</b>","<b>Only</b> for a palpable nodule, goitre, abnormal neck examination or suspected structural disease \u2014 not solely because of abnormal TFTs","Not required in every hypothyroid patient and not a diagnostic test for hypothyroidism \u2014 it has no role in diagnosing hypothyroidism"],
         ["<b>Interference check</b>","Discordant or implausible results","Ask about biotin and supplements when results are discordant with the clinical picture. <b>Withhold biotin before repeat testing according to local laboratory advice</b>; a longer interval may be needed with high-dose treatment or renal impairment. Consider other assay-interference causes when results are implausible"]
       ]},
       {b:"warn", html:"<b>Do NOT order:</b> routine free T3, routine thyroglobulin, repeat antibodies once positive, a nuclear scan, or an ultrasound for a normal-feeling neck. <b>Secondary hypothyroidism is rare (about 1 in 80,000)</b> but changes everything: TSH cannot be used for titration, and the coexisting deficiencies (<b>growth hormone, ACTH, FSH and LH</b>) have to be identified \u2014 which is why the pituitary picture goes to endocrinology with an <b>MRI pituitary</b>, not into a titration schedule."}
     ]},

    {id:"subclinical", nav:"Subclinical", title:"Subclinical hypothyroidism \u2014 progression risk, then the treat / trial / monitor decision", sub:"Raised TSH (<b>\u22654</b>) with a normal free T4, confirmed on a repeat at 3 months. Three inputs decide management: TSH level, age, and symptoms \u2014 modified by antibody status.",
     blocks:[
       {b:"dl", rows:[
         ["Background progression rate","<b>2\u20136% per year</b> progress to overt hypothyroidism"],
         ["Higher risk of progression","<b>Female, older, and anti-TPO antibody positive</b> \u2014 antibody positivity roughly <b>doubles</b> the annual progression rate (about <b>4%/year</b>) and is why NICE NG145 (2019) advises annual rather than 2\u20133-yearly monitoring"],
         ["Other features of thyroid disease","<b>Previous radioactive iodine, thyroid surgery, or a goitre</b> \u2014 all indicate ongoing thyroid pathology and favour treating or closer monitoring"],
         ["Higher TSH = higher risk","The higher the confirmed TSH, and especially <b>\u226510</b>, the greater the chance of both progression and cardiovascular harm"],
         ["Symptoms \u2014 interpret cautiously","Tiredness, low mood and weight change are common and non-specific. <b>In older adults symptoms correlate poorly with mild TSH elevation</b> \u2014 see the evidence caveats below"]
       ]},
       {b:"table", head:["Confirmed picture","Action","Detail"], rows:[
         ["<b>TSH 10 mU/L or higher</b> (\u00d72, 3 months apart)","<b>Consider levothyroxine</b>","NICE NG145: consider treatment \u2014 may improve symptoms and long-term cardiovascular risk; TSH &gt;10 carries higher CHD risk. Start exactly as in overt disease. <b>Be more hesitant over 65</b> \u2014 over-suppression risks AF and osteoporosis"],
         ["<b>TSH &lt;10, aged &lt;65, symptomatic</b>","<b>6-month trial of levothyroxine</b>","A time-limited <b>diagnostic test of symptom benefit</b>, not a commitment to lifelong treatment \u2014 <b>say so up front</b>. <b>Stop if symptoms persist once TSH is normal</b>: the elevation was probably not the cause"],
         ["<b>TSH &lt;10, aged \u226565, or asymptomatic</b>","<b>Usually monitor \u2014 individualise</b>","About half normalise untreated. Recheck TSH + FT4 <b>annually if features of thyroid disease</b> (antibody positive, prior surgery or RAI, goitre), otherwise <b>every 2\u20133 years</b>. <b>Aged \u226580 (80+), a mildly raised TSH is often normal ageing</b>. Consider the degree and trajectory of TSH, anti-TPO, goitre, previous surgery or radioiodine, symptoms, frailty, cardiovascular status and patient preference"],
         ["<b>Anti-TPO positive, or prior RAI or surgery</b>","<b>Closer monitoring; consider in the treatment decision</b>","Anti-TPO positivity increases the likelihood of underlying thyroid disease and progression. It supports closer monitoring and may favour a treatment trial in an appropriate symptomatic patient, but is not by itself an automatic indication for levothyroxine when TSH is below 10"],
         ["<b>Pregnant or preconception</b>","<b>Prompt specialist/local pathway advice</b>","Treatment thresholds are lower than in non-pregnant adults and depend on TSH, FT4, TPO-antibody status and trimester-specific ranges \u2014 not automatic treatment"]
       ]},
       {b:"cards", items:[
         {tone:"cream", h:"If not treating, monitoring is an active plan \u2014 not \u201cdoing nothing\u201d", html:"Set the interval by progression risk (<b>annually</b> if antibody positive or other features of thyroid disease, otherwise <b>2\u20133-yearly</b>). <b>Re-test sooner if symptoms are new or worsening</b> \u2014 don't wait for the scheduled interval. Counsel on the <b>2\u20136%/year</b> progression rate and that most people remain stable or normalise. Name the symptoms that should prompt an earlier check (fatigue, cold intolerance, weight gain, constipation, low mood). <b>Flag pregnancy plans \u2014 the monitoring approach no longer applies.</b> Address cardiovascular risk (BP, lipids once euthyroid, smoking, activity) on its own merits. And <b>resist over-attributing vague symptoms to a mildly raised TSH.</b>"}
       ]},
       {b:"warn", html:"<b>Be honest about the evidence.</b> Randomised trials \u2014 <b>TRUST (NEJM 2017;376:2534)</b> and the <b>JAMA 2018;320:1349</b> meta-analysis \u2014 showed <b>no significant improvement in symptoms or quality of life</b> from treating subclinical hypothyroidism, particularly in older adults. A <b>JAMA 2010;304:1365</b> meta-analysis found <b>no overall increase in CHD or mortality \u2014 except where TSH &gt;10</b>, where CHD events and mortality are increased; and treatment has not been shown to change cardiovascular risk. In the over-65s, symptom prevalence is <b>no different</b> between euthyroid and subclinical groups (BJGP 20X708065). This is exactly why NG145 uses cautious \u201cconsider\u201d language \u2014 and why over-treatment, which risks <b>AF and osteoporosis</b>, is a real harm rather than a theoretical one."}
     ]},

    {id:"absorption", nav:"Absorption", title:"Get the tablet into the blood \u2014 fix this before raising doses", sub:"A rising TSH on a stable dose is far more often absorption or adherence than true progression.",
     blocks:[
       {b:"cards", items:[
         {tone:"blue", h:"\u23f0 Timing", html:"Empty stomach, water only: <b>30\u201360 minutes before breakfast</b>, or at bedtime <b>3 hours after the evening meal</b> (equally valid and often easier). Same routine every day. <b>At least 30 minutes before caffeine and other drugs.</b> Morning fasting administration improves TSH control by about 20% compared with taking it with food (Surks/Bolk-era RCT evidence), and bedtime dosing 2 or more hours after eating is an evidence-based alternative \u2014 consistency matters more than which of the two you choose."},
         {tone:"amber", h:"\ud83d\udc8a The blockers", html:"<b>Strong practical advice:</b> iron and calcium supplements, antacids, bile-acid sequestrants (such as cholestyramine), sucralfate and orlistat \u2014 separate by about 4 hours or rethink. <b>Individualised advice:</b> PPIs, coffee, soy and high-fibre diets have variable effects \u2014 keep intake consistent. Not every patient on a PPI needs a dose increase; recheck thyroid function after clinically significant medication changes."},
         {tone:"blue", h:"\ud83e\uddfe Brand consistency", html:"Universal brand prescribing is not necessary. If a patient reports persistent symptoms on switching products, or control is erratic, consider consistently prescribing a specific product known to be well tolerated (MHRA); if symptoms or poor control persist, consider an oral solution \u2014 also for genuine malabsorption or tube feeding."},
         {tone:"amber", h:"\ud83d\udd0e Needing ever-higher doses?", html:"Needing <b>&gt;2 micrograms/kg/day</b> \u2192 think <b>coeliac disease</b> (serology), <b>H. pylori</b> or atrophic gastritis, or adherence \u2014 not simply \u201cmore\u201d."},
         {tone:"blue", h:"\ud83d\udc89 Oestrogen effect", html:"Starting HRT or a COCP raises binding globulin \u2192 dose requirement can rise \u2192 <b>recheck TSH 8 weeks after</b>."},
         {tone:"blue", h:"\ud83d\udcc9 Weight change", html:"Large weight loss (including bariatric surgery and GLP-1 agonists) \u2192 the dose may need <b>cutting</b>; weight gain \u2192 rising."},
         {tone:"green", h:"\ud83c\udf19 Wellbeing measures", html:"For fatigue, address sleep, activity, mood and <b>iron and B12 status</b> \u2014 these often explain symptoms better than a mildly raised TSH, especially during a subclinical trial."}
       ]}
     ]},

    {id:"lifestyle", nav:"Beyond the tablet", title:"Beyond the tablet \u2014 nutrition, the associated conditions, and mood",
     sub:"Small print that changes outcomes: two of these are the reason a dose keeps climbing, and one is the reason a euthyroid patient still feels unwell.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Iodine \u2014 enough, not more", html:"<b>UK reference intake is 140 micrograms a day</b>; dairy, fish and eggs are the practical sources. Avoid iodine loading \u2014 kelp and seaweed supplements can worsen autoimmune thyroid disease, and patients often take them believing the opposite. Iodine deficiency is not a common explanation for hypothyroidism in UK adults; pregnancy-specific iodine advice should follow local guidance."},
         {tone:"blue", h:"Selenium \u2014 do not routinely prescribe", html:"There is insufficient evidence to recommend routine selenium supplementation for Hashimoto's thyroiditis. <b>Do not routinely prescribe selenium for autoimmune thyroid disease. Avoid unregulated iodine/kelp or high-dose selenium supplements</b> \u2014 excessive intake can cause toxicity."},
         
         {tone:"amber", h:"Coeliac disease \u2014 the reason the dose keeps climbing", html:"Coeliac disease co-occurs in 3\u20135% of Hashimoto's patients against about 1% of the general population, and undiagnosed coeliac causes levothyroxine malabsorption. <b>Screen with anti-tTG IgA plus total IgA</b> if the hypothyroidism is resistant or there are GI symptoms \u2014 a gluten-free diet markedly improves absorption once treated."},
         {tone:"green", h:"Mood and \u201cbrain fog\u201d", html:"Depression and anxiety are 2\u20133\u00d7 more prevalent in hypothyroidism \u2014 assess and treat them on their own merits rather than waiting for the thyroid to fix them. Brain fog persists despite euthyroidism in some patients: <b>validate the symptom</b>, ensure sleep is addressed, and refer to psychology or <b>NHS Talking Therapies</b> where it is persistent."},
         {tone:"cream", h:"Correct the iron, not just the dose", html:"Iron deficiency does two things here: it <b>impairs levothyroxine absorption</b> and it <b>reduces peripheral T4\u2192T3 conversion</b>. Correct it \u2014 dietary advice or replacement \u2014 and keep <b>ferrous sulphate 4 hours away from the levothyroxine</b>."}
       ]}
     ]},

    {id:"ladder", nav:"Levothyroxine", title:"Levothyroxine \u2014 start right, titrate on the 6\u20138 week rhythm", sub:"Once you have decided to replace, the pharmacology is identical in overt and subclinical disease.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Start", title:"By age and heart", when:"day one",
          html:"<b>Under 65 with no cardiac disease:</b> full replacement <b>1.6 micrograms/kg/day</b>, rounded to the nearest 25 micrograms (60 kg \u2192 <b>100 \u00b5g</b>; <b>70 kg \u2192 112 \u00b5g</b>; 80 kg \u2192 <b>125 \u00b5g</b>; 100 kg \u2192 <b>150 \u00b5g</b>). <b>Aged 65 or over, cardiovascular disease, severe longstanding hypothyroidism or possible adrenal insufficiency: start low, 25\u201350 micrograms/day</b>, titrated cautiously (for example <b>25 micrograms every 4 weeks</b>) \u2014 thyroxine raises myocardial oxygen demand, so going fast in IHD precipitates angina, MI or arrhythmia. Take it <b>30\u201360 minutes before food</b> from day one; wrong dosing causes more harm than a few days' delay in starting."},
         {step:"Titrate", title:"25\u201350 microgram steps on TSH", when:"recheck from about 6 weeks after each change",
          fromLabel:"6\u20138 weeks is usually practical",
          html:"Aim to maintain TSH <b>within the laboratory reference range</b>. Do not routinely increase levothyroxine solely to achieve a lower-half TSH; if symptoms persist despite a TSH within range, assess adherence, absorption, comorbidity and alternative diagnoses rather than escalating automatically. There is no benefit in aiming for suppression \u2014 keep the TSH &ge;0.5 to protect bone. Increase in <b>25 microgram</b> steps, rechecking from about <b>6 weeks</b> (25\u201350 micrograms where the patient is young and markedly hypothyroid). After very prolonged or severe hypothyroidism TSH may take substantially longer to normalise \u2014 avoid repeated large dose increases; <b>most patients stabilise between 75 and 150 micrograms a day</b>. Alternate-day dosing works for in-between doses (e.g. 100 and 125 on alternate days). Monitor about <b>every 3 months until stable</b>, then <b>annual TSH</b> (NICE NG145); check FT4 too when clinically indicated."},
         {step:"Trial review", title:"The 6-month subclinical trial \u2014 review honestly", when:"TSH in range at ~6 months",
          fromLabel:"the step most often skipped",
          html:"Reassess symptoms with the TSH in range. <b>Not improved \u2192 stop levothyroxine</b> and return to monitoring: the elevation was not the cause. Continuing a trial that has not worked is the commonest drift into unnecessary lifelong therapy."},
         {step:"Pregnancy", title:"The rules to know cold", when:"planning or pregnant",
          fromLabel:"separate specialist/local pathway",
          html:"Pregnancy or preconception requires prompt specialist/local pathway advice (NICE NG145: refer). <b>Established hypothyroidism:</b> advise contacting the practice promptly after a positive pregnancy test \u2014 a dose increase of approximately <b>25\u201330%</b> is commonly required immediately, pending urgent thyroid-function testing and shared obstetric/endocrine management (two extra doses a week is one example, not a universal instruction). <b>Requirements rise by about 30\u201350% in the first trimester</b> \u2014 higher thyroid-binding globulin, hCG-driven stimulation and a larger volume of distribution \u2014 and failure to increase the dose promptly is associated with adverse fetal neurodevelopmental outcomes. Check <b>TSH and FT4 approximately every 4 weeks during the first half of pregnancy</b> and after dose changes, then according to the obstetric/endocrine plan. Use laboratory-specific trimester ranges where available; otherwise follow the local obstetric/endocrine protocol rather than fixed universal targets. Refer for joint obstetric\u2013endocrine care; untreated or under-treated disease risks <b>miscarriage and pre-eclampsia</b>. Post-delivery: women with established hypothyroidism generally return to the pre-pregnancy dose and have thyroid tests reviewed. Women with autoimmune thyroid disease or postpartum symptoms need assessment for post-partum thyroiditis, which can present as postnatal depression; routine TSH testing is not needed in the absence of symptoms or risk factors. <b>Newly detected subclinical disease:</b> thresholds are lower than outside pregnancy and depend on TSH, FT4, TPO-antibody status and trimester-specific ranges \u2014 follow specialist advice."}
       ]},
       {b:"table", head:["Problem","Looks like","Fix"], rows:[
         ["<b>Over-replacement</b>","Suppressed TSH; palpitations, tremor, heat intolerance, insomnia, weight loss \u2014 <b>or entirely silent</b>","<b>Reduce by 25 micrograms</b>, recheck 6\u20138 weeks. Silent suppression still causes <b>AF (roughly 3\u00d7 risk) and osteoporotic fracture</b>, and iatrogenic thyrotoxicosis is additionally associated with a <b>possible increase in dementia risk</b> \u2014 especially in older and post-menopausal patients. <b>The annual TSH exists to catch this.</b> A TSH below 0.1 is the highest-risk zone; do not suppress below 0.5 unless there is a stated oncological reason"],
         ["Under-replacement","TSH climbing on a stable dose","Adherence \u2192 administration timing \u2192 iron/calcium/antacid use \u2192 new PPI, oestrogen or interacting medication \u2192 weight change \u2192 malabsorption or coeliac disease where indicated \u2192 laboratory assay interference \u2192 <b>then</b> increase"],
         ["<b>Angina on titration</b>","Chest pain as the dose rises (IHD)","<b>Drop back a step</b>, slow to <b>12.5\u201325 microgram</b> increments, treat the angina \u2014 cardiology if unstable"],
         ["Persistent symptoms, normal TSH","\u201cStill tired on thyroxine\u201d","Work the loop below \u2014 usually <b>not</b> the thyroid"],
         ["Hair loss early on","Transient shedding in the first months","Reassure \u2014 it settles as levels stabilise"]
       ]},
       {b:"warn", html:"Liothyronine (T3) and desiccated thyroid extract are not initiated routinely in primary care (NG145). In Greater Manchester, liothyronine is a high-cost specialist decision and thyroid extract/combination products are not routinely supported (GMMMG formulary); the BTA/Society for Endocrinology consensus (2023) allows carefully selected specialist-supervised trials in exceptional circumstances. Combination T4/T3 has no consistent trial benefit and carries real cardiac and bone harms \u2014 don't initiate it in primary care, and don't unilaterally stop an endocrinologist's established regimen either."}
     ]},

    {id:"monitor", nav:"Monitoring", title:"The monitoring rhythm and safety-netting", sub:"Recheck from about 6 weeks after a change, about every 3 months until stable, then annually.",
     blocks:[
       {b:"table", head:["Situation","TSH check","Note"], rows:[
         ["After initiation or any dose change","<b>From about 6 weeks</b> (6\u20138 weeks is usually practical)","Earlier testing may be needed in pregnancy, suspected central hypothyroidism, severe or prolonged untreated disease, suspected adrenal insufficiency or significant deterioration"],
         ["Until stable","About <b>every 3 months</b>","Then annually (NICE NG145)"],
         ["Stable long-term","<b>Annually</b>","Plus a symptom review and an <b>over-replacement check</b>"],
         ["Pregnancy","<b>TSH and FT4 about every 4 weeks in the first half</b> and after dose changes, then per the obstetric/endocrine plan","Laboratory-specific trimester ranges, or the local obstetric/endocrine protocol"],
         ["On amiodarone or lithium","<b>6-monthly</b>, and for <b>12 months after stopping amiodarone</b>","Both cause hypo- <em>and</em> hyperthyroidism"],
         ["Untreated subclinical","<b>Annually if anti-TPO positive</b>; <b>2\u20133-yearly if negative</b>","Escalate to treatment if TSH &gt;10, or symptoms with a rising TSH"],
         ["Persistent symptoms with a normal TSH","Investigate elsewhere","Anaemia, ferritin, B12 and folate, coeliac, menopause, depression, sleep apnoea \u2014 <b>don't keep escalating thyroxine for non-thyroidal symptoms</b>"],
         ["<b>Bone density (DEXA)</b>","If the <b>TSH has been suppressed below 0.1 for &gt;12 months</b>, in post-menopausal women, or where fracture risk is significant","<b>Aim to keep TSH &ge;0.5 to minimise bone loss</b>"],
         ["Lipids","Reassess once euthyroid where this will alter management","Manage cardiovascular risk by the usual lipid pathway \u2014 do not delay indicated statin therapy solely because hypothyroidism is present"],
         ["Post-partum","Assess women with autoimmune thyroid disease or postpartum symptoms","Post-partum thyroiditis can look like postnatal depression; routine testing is not needed without symptoms or risk factors"],
         ["<b>Register and recall</b>","At diagnosis, then <b>annual medication review</b>","<b>Add to the hypothyroid disease register and flag for QOF recall</b> \u2014 this is a lifelong condition and no patient should be lost to follow-up"]
       ]},
       {b:"cards", items:[
         {tone:"amber", h:"\ud83d\udd01 Still tired with a normal TSH? Work this before touching the dose", html:"Once the TSH is in range on levothyroxine, the thyroid <em>is</em> replaced \u2014 persistent symptoms almost always have another cause. <b>1 In range?</b> Aim within the reference range \u2014 do not routinely escalate solely to achieve a lower-half TSH. <b>2 Adherence and absorption</b> \u2014 daily? empty stomach? new PPI, iron or calcium? <b>Coeliac serology if doses keep climbing.</b> <b>3 The mimics</b> \u2014 ferritin (aim &gt;30\u201350), B12 and folate, HbA1c, coeliac, depression or anxiety, OSA (snoring plus somnolence), menopause. <b>4 Another autoimmune condition</b> \u2014 Hashimoto's clusters with coeliac, pernicious anaemia, <b>Addison's</b> (pigmentation, postural dizziness, low sodium \u2192 9am cortisol) and type 1 diabetes. <b>5 Expectations</b> \u2014 symptoms lag biochemistry by weeks to months, and weight rarely falls much with correction alone. All excluded, TSH optimal, still unwell \u2192 endocrine opinion (the T3 question is theirs)."}
       ]},
       {b:"cards", items:[
         {tone:"red", h:"\ud83d\udd34 Myxoedema \u2014 emergency", html:"\u201cIf doses have been missed for weeks and someone becomes very drowsy, confused and cold, that is an emergency.\u201d"},
         {tone:"red", h:"\u2764\ufe0f Chest pain", html:"\u201cNew chest tightness after a dose increase \u2014 stop climbing and call us.\u201d"},
         {tone:"amber", h:"\ud83d\udc93 Too much thyroxine", html:"\u201cPalpitations, shakiness, sweating or unexplained weight loss \u2014 tell us; the dose may be too high.\u201d"},
         {tone:"amber", h:"\ud83e\udd30 Pregnancy", html:"\u201cThe moment you are pregnant or planning \u2014 tell us. The dose goes up straight away and we test more often.\u201d"},
         {tone:"blue", h:"\ud83d\udcde Bring the test forward if\u2026", html:"New or worsening hypothyroid symptoms, or a <b>new goitre or neck change</b> \u2014 don't wait for the routine interval. <b>Switch pathway</b> if FT4 falls below range (now overt \u2192 treat), pregnancy or conception (prompt specialist/local pathway), or new compressive neck symptoms (\u2192 urgent ENT or endocrine referral, local pathway; a new thyroid lump \u2192 consider a suspected cancer pathway referral)."},
         {tone:"green", h:"\ud83d\udcdd Document the plan", html:"Record the decision (treat / 6-month trial / monitor), the agreed interval, and the symptoms that should prompt earlier review. <b>That is what good safety-netting looks like</b> \u2014 and what the SCA rewards."}
       ]},
       {b:"say", html:"The tablet replaces exactly what your thyroid should make \u2014 same time every day on an empty stomach, away from iron or calcium. It takes about six weeks for the blood test to catch up with any change, so we usually check from then \u2014 and once we have found your dose it is usually steady for years."}
     ]},

    {id:"refer", nav:"Refer", title:"Refer \u2014 endocrinology and the suspected cancer pathway", sub:"The referral list is deliberately short: this is a primary-care condition in almost all cases.",
     blocks:[
       {b:"cards", items:[
         {tone:"purple", h:"Suspected cancer \u00b7 NG12 \u2014 thyroid or head-and-neck", html:"An unexplained thyroid lump \u2192 consider a suspected cancer pathway referral for thyroid cancer, independent of the TSH. A fixed or rapidly enlarging goitre, hoarseness, dysphagia or a neck node is clinically concerning, but these do not all independently meet the same NG12 criterion \u2014 decide on the examination and the local head-and-neck pathway; persistent unexplained <b>hoarseness or an unexplained neck lump in an adult aged 45 or over</b> is an NG12 head-and-neck criterion in its own right (<a href='https://www.nice.org.uk/guidance/ng12' rel='noopener'>NICE NG12</a>). A firm, fixed goitre must never be attributed to Hashimoto's without imaging."},
         {tone:"red", h:"Same day", html:"Suspected <b>myxoedema coma</b>; suspected <b>adrenal crisis</b>; acute compressive neck symptoms."},
         {tone:"amber", h:"Endocrinology \u2014 the pituitary picture", html:"Low, normal or only slightly raised TSH with a low FT4 \u2192 if stable, 9am cortisol and discuss with endocrinology (emergency hydrocortisone and admission if crisis is suspected) \u2014 never just titrate. Headache, visual field defect or galactorrhoea alongside it makes it <b>urgent, with an MRI pituitary</b>. Also diagnostic uncertainty, or atypical or unstable biochemistry."},
         {tone:"amber", h:"Urgent endocrine (2 weeks) \u2014 resistant disease", html:"TSH persistently elevated despite more than 200 micrograms of levothyroxine a day \u2014 resistant hypothyroidism, once adherence, absorption and coeliac disease have been addressed. Confirmed <b>secondary hypothyroidism</b> belongs here too, as does <b>congenital hypothyroidism (paediatric referral the same week)</b>."},
         {tone:"amber", h:"Pregnancy and preconception", html:"Pregnant or trying to conceive \u2192 <b>prompt specialist/local pathway advice</b> and joint obstetric\u2013endocrine care; already on levothyroxine \u2192 increase the dose promptly after a positive test pending urgent TFTs. Also fertility problems with subclinical hypothyroidism."},
         {tone:"blue", h:"Cardiac ceiling", html:"Ischaemic heart disease making titration impossible without angina."},
         {tone:"blue", h:"Persistent symptoms", html:"TSH optimal and the loop exhausted \u2192 for assessment, <b>including the T3 conversation \u2014 which is theirs to have</b>."},
         {tone:"blue", h:"Structural, young, or drug-induced", html:"Goitre, nodule or compressive symptoms; <b>age &lt;16</b> \u2192 paediatric or endocrine; drug-induced disease where the drug must continue (<b>amiodarone, lithium</b>) \u2192 joint management with the initiating specialist."},
         {tone:"cream", h:"Primary care manages", html:"Confirming the diagnosis, the treat/trial/monitor decision, levothyroxine initiation and titration, and the monitoring schedule \u2014 for the great majority of patients. Prescribe per the <a href='https://www.greatermanchesterformulary.nhs.uk' rel='noopener'>Greater Manchester formulary</a> (endocrine system) and refer via the local Greater Manchester endocrinology pathway."}
       ]},
       {b:"say", html:"Your blood tests are where they should be, but you are clearly not feeling right \u2014 so I want the hormone specialists to look deeper. We will keep the levothyroxine exactly as it is meanwhile."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only \u2014 the Casebook keeps the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 71-year-old woman, tired for a year, TSH 6.8 with a normal free T4 on a screening test done six weeks after a chest infection. She has read about thyroid problems online and would like \u201cto start the tablets and see if I feel better\u201d."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Recognises this is not yet a diagnosis \u2014 <b>repeat at 3 months</b> and note the recent illness as a transient cause; checks anti-TPO; explains honestly that <b>trials show no symptom benefit in this group</b> and that over-treatment risks AF and osteoporosis, without dismissing her fatigue; investigates the mimics (ferritin, B12, mood, sleep); sets a monitoring interval and safety-nets which symptoms bring the test forward; examines the neck. <a href='../../cases/hypothyroidism.html'>Open the full casebook chapter \u2192</a>"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG145 \u2014 Thyroid disease: assessment and management (2019)</b><br><a href="https://www.nice.org.uk/guidance/ng145" rel="noopener">nice.org.uk/guidance/ng145</a><span class="rd"> \u2014 repeat TSH at 3 months before acting, the subclinical treat/trial/monitor thresholds, monitoring intervals (annual if features of thyroid disease, otherwise 2\u20133-yearly), levothyroxine starting doses, TSH every 3 months until stable then yearly, TSH within the reference range (no evidence for routine lower-half targeting), referral in pregnancy or when planning pregnancy, T3 not initiated routinely in primary care</span></li>'+
         '<li><b>Specialist Pharmacy Service \u2014 Levothyroxine monitoring</b><br><a href="https://www.sps.nhs.uk/monitorings/levothyroxine-monitoring/" rel="noopener">sps.nhs.uk</a><span class="rd"> \u2014 recheck from about 6 weeks after initiation or dose change</span></li>'+
         '<li><b>MHRA Drug Safety Update \u2014 Levothyroxine: new prescribing advice for patients who experience symptoms on switching between different levothyroxine products</b><br><a href="https://www.gov.uk/drug-safety-update/levothyroxine-new-prescribing-advice-for-patients-who-experience-symptoms-on-switching-between-different-levothyroxine-products" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> \u2014 consistent product or oral solution when symptoms persist on switching</span></li>'+
         '<li><b>BTA/Society for Endocrinology \u2014 Use of liothyronine (T3) in hypothyroidism: joint consensus statement</b> (Clinical Endocrinology, 2023)<br><a href="https://doi.org/10.1111/cen.14935" rel="noopener">doi.org/10.1111/cen.14935</a><span class="rd"> \u2014 carefully selected specialist-supervised trials only</span></li>'+
         '<li><b>Greater Manchester Medicines Management Group formulary \u2014 endocrine system</b><br><a href="https://www.greatermanchesterformulary.nhs.uk" rel="noopener">greatermanchesterformulary.nhs.uk</a><span class="rd"> \u2014 liothyronine specialist/high-cost decision; thyroid extract and combination products not routinely supported</span></li>'+
         '<li><b>NICE NG12 \u2014 Suspected cancer: recognition and referral (updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> \u2014 unexplained thyroid lump \u2192 consider a suspected cancer pathway referral for thyroid cancer; hoarseness and neck lump criteria in adults aged 45 and over</span></li>'+
         '<li><b>British Thyroid Association; NICE NG145 \u2014 thyroid disease</b><span class="rd"> \u2014 primary-care operationalisation, absorption and interaction advice, pregnancy dose adjustment</span></li>'+
         '<li><b>TRUST \u2014 Stott et al., NEJM 2017;376:2534</b><span class="rd"> \u2014 levothyroxine in older adults with subclinical hypothyroidism gave no symptom or quality-of-life benefit</span></li>'+
         '<li><b>Feller et al., JAMA 2018;320:1349</b><span class="rd"> \u2014 meta-analysis: no significant symptom or quality-of-life improvement with treatment</span></li>'+
         '<li><b>Rodondi et al., JAMA 2010;304:1365</b><span class="rd"> \u2014 no overall CHD or mortality increase in subclinical hypothyroidism except where TSH &gt;10</span></li>'+
         '<li>NEJM 2017;376:2556; BJGP 2016;66:538 and BJGP 20X708065 (doi:10.3399/bjgp20X708065); Clinical Endocrinology 2016;84:799<span class="rd"> \u2014 2\u20136%/year progression to overt disease, and symptom prevalence no different between euthyroid and subclinical groups in older adults</span></li>'+
         '<li><b>Surks et al. and the levothyroxine-timing RCTs</b><span class="rd"> \u2014 morning fasting administration improves TSH control by about 20% compared with taking the tablet with food; bedtime dosing 2 or more hours after eating is an evidence-based alternative</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> \u2014 levothyroxine doses, administration timing, and interactions (iron, calcium, antacids, PPIs, cholestyramine, orlistat); check product-specific prescribing information (SmPC)</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Primary and subclinical hypothyroidism in adults \u2014 NICE NG145 with BTA guidance and the NG12 thyroid-lump interface. Diagnosis and management are merged on this page; there is no separate subclinical-hypothyroidism pathway to cross-check. Not applicable to pregnant women or those trying to conceive, who need prompt specialist/local pathway advice. Verify all doses against the current BNF before prescribing."
});
