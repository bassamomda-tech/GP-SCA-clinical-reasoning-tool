MG.render({
  icon:"🍼",
  title:"Reflux in infants — the complete guide",
  eyebrow:"Protocol · NICE NG1 · a thriving baby who possets needs no drug",
  stemTitle:"The pivotal distinction is GOR versus GORD — regurgitation in an otherwise well, thriving baby needs explanation, feeding review and reassurance, not acid suppression",
  stemSub:"One page for the whole condition. Physiological reflux is very common and resolves in about 90% of infants by 1 year; it needs feeding review and reassurance, and reassurance is the treatment rather than a consolation. <b>Consider acid suppression only for overt regurgitation plus unexplained feeding difficulty, marked distress or faltering growth</b>, after feeding assessment and management — <b>as a 4-week trial that is STOPPED if there is no clear benefit</b>. Two things not to do: <b>never combine a thickener with an alginate</b>, and <b>never treat simple posseting in a thriving baby with a PPI</b>. And know the red flags — above all green or yellow-green vomit, and progressively forceful vomiting under 2 months — that separate benign reflux from obstruction, pyloric stenosis or raised intracranial pressure.",
  guideline:"NICE NG1 (2015, updated October 2019) · NICE QS112 · NICE CG116 (food allergy)",
  reviewed:"14 September 2026",
  nextReview:"14 March 2027",
  meta:[
    {t:"NICE NG1 (2015, updated 2019) — GORD in children and young people"},
    {t:"Green vomit, or worsening forceful vomiting under 2 months → same day", tone:"tw"},
    {t:"Do NOT combine thickener and alginate", tone:"tw"},
    {t:"v2.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#distinguish"><b>GOR vs GORD</b><small>The pivotal split</small></a><a href="#feeding"><b>Feeding</b><small>Reassure first</small></a><a href="#drug"><b>Acid suppression</b><small>GORD only</small></a><a href="#monitor"><b>Review</b><small>Growth · 4 weeks</small></a><a href="#refer"><b>Refer</b><small>Red flags</small></a></div>',
  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ The red flags that mean this is not reflux", html:"<b>Unexplained green or yellow-green vomit</b> → same-day emergency assessment; discuss urgently with paediatrics/surgery for the imaging pathway (NICE: same-day upper-GI contrast study) — do not manage as reflux. <b>Progressively worsening or forceful vomiting under 2 months</b> → same-day paediatric assessment for possible pyloric stenosis. <b>Haematemesis</b> → urgent assessment, distinguishing swallowed blood from GI bleeding. Also: abdominal distension or tenderness · lethargy or systemic illness · dehydration or markedly reduced wet nappies · fever in a young infant · bulging fontanelle or abnormal neurological signs · recurrent apnoea, cyanosis or suspected aspiration · dysphagia · persistent faltering growth · regurgitation persisting beyond 1 year. New regurgitation after 8 weeks with faltering growth, frequent regurgitation or marked distress → consider UTI. Assess every infant clinically — hydration, general condition, abdomen, neurological signs, feeding history and growth trajectory."},
    {tone:"blue", h:"GOR versus GORD is the whole decision", html:"Physiological GOR is common regurgitation in an otherwise well infant, usually with normal feeding and growth — it resolves in about 90% by 1 year. GORD should be considered when regurgitation is associated with marked, persistent distress, feeding difficulty or refusal, faltering growth, or a complication. A thriving infant can still have clinically important feeding-related distress; conversely, a single symptom (crying, feeding difficulty or faltering growth) without overt regurgitation should not automatically be attributed to reflux."},
    {tone:"green", h:"Reassurance IS the treatment in physiological reflux", html:"Explaining that GOR is normal and self-limiting in a thriving baby is the most important intervention — not a preamble to one. Review feeding technique and volume and avoid overfeeding; upright holding after feeds while the baby is awake and supervised; and for every sleep, place the baby flat on their back in a clear cot — no sleep-positioning devices, prone or side positioning, cot elevation or wedges."},
    {tone:"amber", h:"Feeding measures, in order — and never two at once", html:"Formula-fed: review the feeding history; reduce individual feed volumes only if excessive for weight; offer smaller, more frequent feeds while maintaining an appropriate total daily milk intake; if unsuccessful, trial thickened formula; if that fails, stop it and trial an alginate for 1–2 weeks — never thickener and alginate together. Breastfed: a breastfeeding assessment first, then a 1–2-week alginate trial if frequent regurgitation with marked distress persists. Continue alginate only with clear benefit, trying to stop periodically."},
    {tone:"red", h:"⛔ Do not offer acid suppression for simple posseting", html:"Do not prescribe acid suppression for isolated posseting or regurgitation in an otherwise well infant, or simply because the baby cries. Consider a 4-week PPI or H2RA trial only when there is overt regurgitation plus unexplained feeding difficulty, marked distress or faltering growth, after feeding assessment and management — dosed by weight per the BNF for Children and product information, reviewed at 4 weeks and STOPPED if there is no clear benefit. Do not offer metoclopramide, domperidone or erythromycin unless benefits outweigh risks, other interventions have been tried and there is specialist paediatric agreement."},
    {tone:"amber", h:"Consider cow's milk protein allergy — the features overlap", html:"Consider CMPA when reflux-like symptoms occur with eczema, urticaria, blood or mucus in stools, diarrhoea, constipation, persistent vomiting, abdominal symptoms, food refusal, faltering growth or a strong atopic history — not from isolated mild posseting in a thriving infant. Use an allergy-focused history, a time-limited elimination trial (normally 2–6 weeks) with nutritional adequacy, then planned reintroduction to confirm, with dietetic advice where possible (NICE CG116). <b>A failed acid-suppression trial is a prompt to revisit this</b>, not to escalate the dose. See <a href='cmpa.html'>CMPA</a>."}
  ],
  pathwaySub:"Five steps, and the first determines whether any treatment is needed at all.",
  pathway:[
    {title:"Separate normal reflux from reflux disease", html:"GOR in a well, thriving baby versus GORD with regurgitation plus marked distress, feeding difficulty or refusal, or faltering growth. A single symptom without overt regurgitation is not automatically reflux. <b>Screen the red flags, and consider CMPA.</b>", alert:true},
    {title:"Reassurance and feeding measures", html:"Feeding review; reduce feed volumes only if excessive for weight; smaller, more frequent feeds with an appropriate total intake; then thickened formula; if unsuccessful, stop it and trial alginate for 1–2 weeks (breastfed: breastfeeding assessment, then alginate). Upright after feeds while awake; on the back for every sleep."},
    {title:"Acid suppression only where NICE criteria are met", html:"<b>Overt regurgitation plus unexplained feeding difficulty, marked distress or faltering growth: a 4-week PPI or H2RA trial dosed by weight; stop if no clear benefit.</b>"},
    {title:"Monitor growth and response", html:"Faltering growth or feed refusal escalates; a red flag investigates urgently."},
    {title:"Reassess or refer if it does not settle", html:"Reconsider CMPA and other causes; if symptoms persist or recur after stopping acid suppression, reconsider the diagnosis and refer to paediatrics."}
  ],
  sections:[

    {id:"distinguish", nav:"GOR vs GORD", title:"Step 1 — separate normal reflux from reflux disease",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>GOR (physiological)</b>","Common regurgitation in an otherwise well infant, usually with normal feeding and growth — resolves in about 90% by 1 year"],
         ["<b>GORD</b>","Consider when regurgitation is associated with marked, persistent distress, feeding difficulty or refusal, faltering growth, or a complication. Do not routinely investigate or treat GORD in an infant with only one of these and no visible regurgitation (NICE NG1)"],
         ["<b>Assess</b>","Age and onset; effortless regurgitation versus forceful vomiting; colour and blood; feeding volume, frequency and technique; wet nappies and hydration; distress and feed refusal; weight and growth trajectory; eczema, urticaria, blood or mucus in stool, diarrhoea or constipation; abdominal and neurological symptoms. Examine hydration, general condition, abdomen and neurological signs"],
         ["<b>Red flags</b>","Unexplained green or yellow-green vomit (same-day emergency assessment; NICE: same-day upper-GI contrast study) · progressively worsening or forceful vomiting under 2 months (same-day paediatric assessment for pyloric stenosis) · haematemesis (urgent assessment; distinguish swallowed blood) · abdominal distension or tenderness · lethargy, systemic illness, dehydration or markedly reduced wet nappies · fever in a young infant · bulging fontanelle or abnormal neurological signs · recurrent apnoea, cyanosis or suspected aspiration · dysphagia · persistent faltering growth · persisting beyond 1 year. New onset after 8 weeks with faltering growth, frequent regurgitation or marked distress → consider UTI. Late onset after 6 months is an atypical feature that prompts reconsideration, not an emergency in itself"],
         ["<b>Consider CMPA</b>","With eczema, urticaria, blood or mucus in stools, diarrhoea, constipation, persistent vomiting, food refusal, faltering growth or strong atopy: allergy-focused history, time-limited elimination (normally 2–6 weeks), then planned reintroduction to confirm (NICE CG116). Not from isolated mild posseting in a thriving infant — CMPA is commonly overdiagnosed. Formula-fed: usually an extensively hydrolysed formula; amino-acid formula generally reserved for severe or refractory cases under specialist or dietetic advice. Breastfed: maternal cow's-milk exclusion should not be advised casually or indefinitely — include calcium and vitamin D advice and planned reintroduction, with dietetic advice"]
       ]},
       {b:"why", html:"The pivotal distinction is GOR versus GORD: physiological reflux in a well, thriving baby needs explanation, feeding review and reassurance, not medication — but a thriving baby can still have clinically important feeding-related distress that needs assessment. Acid suppression is reserved for genuine reflux DISEASE, and the red-flag list separates benign reflux from sinister vomiting — obstruction, pyloric stenosis, raised intracranial pressure."}
     ]},

    {id:"feeding", nav:"Feeding", title:"Step 2 — reassurance and feeding measures, first-line",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"🫶 Reassurance", html:"Explain that GOR is normal and self-limiting in a thriving baby — the most important \"treatment\"."},
         {tone:"blue", h:"🍼 Feed review", html:"<b>Review feeding history, teat flow, technique and duration of feeds. Calculate the approximate intake in mL/kg/day and compare it with age, weight, growth and local feeding guidance — do not label a feed volume excessive without knowing the weight.</b>"},
         {tone:"blue", h:"📉 Smaller, frequent feeds", html:"In formula-fed infants, adjust feed volume and frequency according to weight, age and total daily intake. Reduce individual feed volumes only when excessive for weight, while maintaining an appropriate total daily milk intake."},
         {tone:"amber", h:"🧴 Thickener or alginate", html:"Use either thickened formula or an alginate (e.g. Gaviscon Infant), not both concurrently. If thickened formula is unsuccessful, stop it before starting a 1–2-week alginate trial (NICE QS112). Continue alginate only if there is clear benefit, attempting to stop periodically. Check the specific product instructions and contraindications, including sodium load and use in renal or cardiac disease — alginates differ in sodium, calcium, magnesium and formulation."},
         {tone:"red", h:"⬆️ Positioning", html:"Upright holding after feeds may be used while the infant is awake and supervised. For every sleep, place the infant flat on their back in a clear cot; do not use sleep-positioning devices, prone or side positioning, cot elevation, wedges or sleep products marketed for reflux."},
         {tone:"green", h:"🤱 Breastfed", html:"<b>Breastfeeding assessment by someone appropriately trained first; if frequent regurgitation with marked distress persists, consider a 1–2-week alginate trial, continuing only if clearly beneficial.</b>"}
       ]}
     ]},

    {id:"drug", nav:"Acid suppression", title:"Step 3 — acid suppression, only where warranted",
     blocks:[
       {b:"table", head:["Step","What","When"], rows:[
         ["<b>Step 1 — optimise feeding and alginate</b>","Do not prescribe acid suppression for isolated posseting or regurgitation in an otherwise well infant. Assess and optimise feeding measures (including the thickener or alginate trial) first","<b>First</b>"],
         ["<b>Step 2 — trial a PPI or H2RA</b>","A 4-week trial of a PPI (e.g. omeprazole) or an H2-receptor antagonist, dosed by weight per the BNF for Children and product information (formulations and licensing vary by age and weight). Check the symptom is plausibly acid-mediated; document the indication, intended duration and review date; avoid indefinite repeat prescriptions; review for infection and GI adverse effects. Review at 4 weeks and STOP if there is no clear benefit rather than escalating","Infants who cannot report symptoms with overt regurgitation plus unexplained feeding difficulty, marked distress, or faltering growth"],
         ["<b>Step 3 — reassess or refer</b>","Reconsider the diagnosis (CMPA, other), and consider specialist referral (possible endoscopy) if symptoms do not resolve or recur after stopping","<b>Trial ineffective, or symptoms recur</b>"]
       ]},
       {b:"warn", html:"Do NOT offer acid suppression for simple posseting in a thriving baby. Do NOT add a thickener and an alginate together. Do not offer metoclopramide, domperidone or erythromycin unless the potential benefits outweigh the risks, other interventions have been tried, and there is specialist paediatric agreement. Risks: domperidone — QT prolongation, arrhythmia and interactions; metoclopramide — extrapyramidal and neurological effects, and it is contraindicated in infants; erythromycin — interactions, QT risk and tachyphylaxis."}
     ]},

         ["<b>Response to measures</b>","<b>After the feeding trial</b>","<b>Stepwise escalation only if needed</b>"],
         ["<b>Acid-suppression trial</b>","<b>After 4 weeks</b>","<b>Stop if no clear benefit — no indefinite repeats; if symptoms persist or recur after stopping, reconsider the diagnosis and refer</b>"],

       {b:"dl", rows:[
         ["<b>After feeding advice</b>","Reassess — most physiological GOR settles with reassurance and feeding measures"],
         ["<b>4 weeks (if on a drug trial)</b>","Trial review: assess response to acid suppression; stop if ineffective; reconsider the diagnosis"],
         ["<b>Ongoing</b>","<b>Reassure that GOR resolves in about 90% by 1 year; review growth; refer if regurgitation persists beyond 1 year</b>"]
       ]}
     ]},

    {id:"notsettling", nav:"Not settling?", title:"Not settling? Re-check before escalating",
     sub:"Reconsider the diagnosis before continuing or adding medication.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"1 · Red flags", html:"Green vomit, haematemesis, forceful vomiting under 2 months, distension, systemic illness → same-day assessment."},
         {tone:"amber", h:"2 · CMPA?", html:"<b>Allergic or GI features → allergy-focused history, a time-limited cow's-milk-protein elimination trial (normally 2–6 weeks), then planned reintroduction; dietetic advice where possible.</b>"},
         {tone:"blue", h:"3 · Feeding", html:"<b>Overfeeding or technique still contributing?</b>"},
         {tone:"amber", h:"4 · Drug trial", html:"<b>On acid suppression without clear benefit → STOP and rethink; symptoms recurring after stopping → reconsider the diagnosis and refer.</b>"},
         {tone:"blue", h:"5 · Refer", html:"<b>Faltering growth, or confirmed or refractory GORD → paediatrics.</b>"}
       ]}
     ]},

    {id:"safety", nav:"Safety-net", title:"Safety-netting",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Sinister vomiting", html:"\"Green or yellow-green vomit, blood in the vomit, or forceful vomiting that is getting worse — seek urgent same-day assessment.\""},
         {tone:"amber", h:"📉 Not feeding or growing", html:"\"Refusing feeds, not gaining weight, or fewer wet nappies — contact us promptly.\""},
         {tone:"red", h:"🧠 Unwell baby", html:"\"Fever, drowsiness, a bulging soft spot, a swollen tummy, pauses in breathing or turning blue, or a baby who seems very unwell — urgent help.\""},
         {tone:"green", h:"🫶 Reassurance", html:"\"In a happy, growing baby, posseting is normal and almost always settles by their first birthday.\""}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"When to refer",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Urgent — same day", html:"Unexplained green or yellow-green vomit → same-day emergency assessment, discussed urgently with paediatrics/surgery (NICE: same-day upper-GI contrast study). Progressively worsening or forceful vomiting under 2 months → same-day paediatric assessment for pyloric stenosis. Haematemesis, abdominal distension with vomiting, systemic illness, dehydration, bulging fontanelle or abnormal neurology, recurrent apnoea, cyanosis or suspected aspiration → same-day assessment."},
         {tone:"amber", h:"Faltering growth", html:"<b>Reflux with faltering growth, or persistent feeding refusal or aversion → paediatrics.</b> See <a href='faltered-growth.html'>faltering growth</a>."},
         {tone:"blue", h:"Refractory GORD", html:"<b>Symptoms refractory despite optimised feeding measures and an appropriate medication trial, or endoscopy, pH-impedance testing or specialist treatment being considered.</b>"},
         {tone:"blue", h:"Diagnostic doubt", html:"<b>Persisting beyond 1 year, late onset, atypical features or diagnostic uncertainty. New regurgitation after 8 weeks with faltering growth, frequent regurgitation or marked distress → consider UTI.</b>"},
         {tone:"cream", h:"GP management", html:"The GOR/GORD distinction, red-flag screening, reassurance and feeding measures, the alginate or thickener trial, the time-limited acid-suppression trial, and growth monitoring all belong here. Related pages: <a href='cmpa.html'>CMPA</a> · <a href='faltered-growth.html'>faltering growth</a> · <a href='constipation-child.html'>constipation in children</a> · <a href='ppi-prescribing.html'>PPI prescribing</a>."}
       ]},
       {b:"say", html:"In a thriving, happy baby, bringing up milk is common and usually settles by around a year — so we focus on feeding tweaks and reassurance rather than medicines. I'll just go through some warning signs that would mean we need to look further."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 9-week-old formula-fed baby is brought by exhausted parents. He <b>possets after most feeds</b>, sometimes a large amount, and cries during feeds. He is <b>gaining weight along the 50th centile</b> and is content between feeds. They are taking <b>180 mL every 4 hours</b> and have been <b>using both Gaviscon Infant and a thickener</b> bought online. A relative has suggested \"he needs the reflux medicine\". He has <b>mild eczema</b> and his mother has hay fever."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Confirms whether the regurgitation is effortless or forceful and whether it is truly vomit; assesses hydration, abdomen, general condition and growth trajectory; calculates intake in mL/kg/day before labelling feeds excessive — 180 mL 4-hourly cannot be judged without the weight; reviews teat flow, feeding technique, feed duration and possible overfeeding; stops the concurrent thickener and alginate; explains that the baby is thriving, but that crying during feeds means this is not simply normal posseting without further assessment; follows the NICE feeding sequence; considers CMPA if symptoms persist or there are additional allergic or GI features, using elimination followed by reintroduction; avoids acid suppression unless the picture meets the NICE criteria; gives red-flag safety-netting in the parents' own terms — green vomit, blood, worsening forceful vomiting, fewer wet nappies — and arranges a weight and feeding review."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>NICE NG1 — Gastro-oesophageal reflux disease in children and young people<br><a href="https://www.nice.org.uk/guidance/ng1" rel="noopener">nice.org.uk/guidance/ng1</a><span class="rd"> — the GOR versus GORD distinction, reassurance for physiological reflux, the stepwise feeding measures (smaller more frequent feeds, then thickened feeds or an alginate but not both), the red flags for sinister vomiting (same-day upper-GI contrast study for unexplained bile-stained vomiting; same-day specialist assessment for progressively forceful vomiting under 2 months), the 4-week acid-suppression trial where there is unexplained feeding difficulty, distress or faltering growth, and the advice against metoclopramide, domperidone or erythromycin without specialist paediatric agreement</span></li>'+
         '<li><b>NICE NG1 \u2014 Gastro-oesophageal reflux disease in children and young people</b><br><a href="https://www.nice.org.uk/guidance/ng1" rel="noopener">nice.org.uk/guidance/ng1</a><span class="rd"> — resolution in about 90% by 1 year, the overlap with cow\u2019s milk protein allergy, and the review and referral thresholds</span></li>'+
         '<li><b>NICE QS112 — Gastro-oesophageal reflux in children and young people, quality statement 4: alginate therapy</b><br><a href="https://www.nice.org.uk/guidance/qs112" rel="noopener">nice.org.uk/guidance/qs112</a><span class="rd"> — 1–2-week alginate trial; stop thickened formula first</span></li>'+
         '<li><b>NICE CG116 — Food allergy in under 19s: assessment and diagnosis</b><br><a href="https://www.nice.org.uk/guidance/cg116" rel="noopener">nice.org.uk/guidance/cg116</a><span class="rd"> — allergy-focused history, elimination and reintroduction for suspected CMPA</span></li>'+
         '<li><b>Lullaby Trust / NHS safer sleep guidance</b><span class="rd"> — always place infants supine to sleep, and do not use sleep-positioning devices</span></li>'+
         '<li><b>BNF for Children</b><br><a href="https://bnfc.nice.org.uk" rel="noopener">bnfc.nice.org.uk</a><span class="rd"> — weight-based omeprazole and H2RA dosing in infants, alginate preparations and their sodium content, domperidone QT and interaction risks, and the metoclopramide contraindication in infants</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Reflux in infants — NICE NG1 and the BNF for Children. The pivotal distinction is GOR versus GORD: effortless posseting in a thriving, content baby is physiological and resolves in about 90% by 1 year — it needs feeding review and reassurance, not medication. Screen the red flags first: green or yellow-green vomit, progressively forceful vomiting under 2 months, haematemesis, distension, persistence beyond a year, systemic illness, dehydration, apnoea or a bulging fontanelle. Feeding measures in order, and never a thickener and an alginate together. Acid suppression only for overt regurgitation plus unexplained feeding difficulty, marked distress or faltering growth, as a 4-week weight-based trial that is stopped if it does not help. Always sleep the baby on their back. Consider CMPA where allergic or GI features overlap, using elimination then reintroduction. Verify all doses against the BNF for Children before prescribing."
});
