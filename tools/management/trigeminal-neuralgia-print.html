  quick:[
    {tone:"blue", h:"Carbamazepine is first-line — this condition is the CG173 exception", html:"Trigeminal neuralgia is the one neuropathic-pain condition CG173 treats differently: carbamazepine first-line, not the usual amitriptyline, duloxetine, gabapentin or pregabalin ladder. Start carbamazepine 100 mg once or twice daily and titrate to the lowest effective dose, aiming to reduce during remissions."},
    {tone:"red", h:"⚠ Any rash means stop carbamazepine immediately", html:"Stop at once for any rash — Stevens-Johnson syndrome and toxic epidermal necrolysis are the risk. Consider HLA-B*1502 testing before starting in people of Han Chinese or Thai ancestry. And warn every patient: sore throat, mouth ulcers, fever or bruising means stop and seek same-day review with an urgent FBC — that is bone-marrow suppression."},

  foot:"Trigeminal neuralgia — NICE and CG173. This is the one neuropathic pain treated differently: carbamazepine 100 mg once or twice daily first-line, titrated to the lowest effective dose and reduced during remissions, rather than the usual CG173 four agents. Red flags — sensory deficit, hearing loss, age under 40, bilateral pain, cranial-nerve signs or previous optic neuritis — prompt MRI to exclude MS or a posterior-fossa lesion. Stop carbamazepine immediately for any rash, and warn about sore throat, mouth ulcers, fever and bruising. It is a potent enzyme inducer: check contraceptive cover. Ask directly about suicidal ideation in severe disease. Verify all doses against the current BNF before prescribing."
