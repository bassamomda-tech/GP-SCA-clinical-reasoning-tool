<script>
MG.render({
  icon:"👁️",
  title:"Chalazion (meibomian cyst) — the complete guide",
  eyebrow:"Protocol · adults and children · eyelid lump",
  stemTitle:"A chalazion is usually a sterile blocked meibomian gland — conservative care first, no routine antibiotics, and specialist review for the same-site recurrence",
  stemSub:"<b>Primary-care management of a chalazion.</b> Treat an uncomplicated lesion with warm compresses, gentle massage and — where there is underlying blepharitis or MGD — lid hygiene. <b>Do not prescribe antibiotics routinely.</b> Improvement may take several weeks. Refer if it is not clearly improving after about 4 weeks of regular conservative care, or is large, symptomatic, vision-affecting, recurrent or atypical; children need a lower threshold. A same-site recurrence, lash loss, ulceration or lid-margin distortion needs specialist assessment with consideration of biopsy. <b>Orbital signs, acute visual loss or corneal involvement need emergency eye assessment.</b>",
  guideline:"College of Optometrists CMG — chalazion · NICE NG12 · Greater Manchester EUR policy · MHRA SPCs",
  reviewed:"25 September 2026",
  nextReview:"25 September 2027",
  meta:[
    {t:"Orbital signs = emergency", tone:"tw"},
    {t:"Same-site recurrence = consider biopsy", tone:"tw"},
    {t:"v2.1 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#assess"><b>Assess</b><small>Chalazion, stye or cellulitis</small></a><a href="#manage"><b>Manage</b><small>Conservative first</small></a><a href="#children"><b>Children</b><small>Lower threshold</small></a><a href="#lesion"><b>Atypical lumps</b><small>Consider biopsy</small></a><a href="#refer"><b>Refer</b><small>When and where</small></a></div>',
  quickSub:"The five that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Orbital cellulitis — emergency", html:"Painful or restricted eye movements · proptosis · diplopia · reduced vision or impaired colour vision · systemic toxicity · severe headache or vomiting → <b>emergency hospital or eye-casualty assessment</b>."},
    {tone:"amber", h:"Preseptal cellulitis — same day", html:"Eyelid erythema and swelling with normal eye movements, no proptosis and normal vision → <b>same-day clinical assessment</b> and treatment per the local pathway, especially in children, the systemically unwell, or if uncertain."},
    {tone:"green", h:"Conservative care, then review at about 4 weeks", html:"A warm (not hot) compress for 5–10 minutes, then gentle massage towards the lid margin, 2–4 times a day. Improvement can take several weeks. Small, asymptomatic lesions can be observed for longer."},
    {tone:"amber", h:"No routine antibiotics", html:"An uncomplicated chalazion is sterile. Antibiotics only for a hordeolum with secondary infection, conjunctivitis, preseptal cellulitis or another clinically supported bacterial indication — never repeated courses for a recurrent 'chalazion' without reassessing."},
    {tone:"amber", h:"Same-site recurrence → specialist review", html:"Unilateral recurrence in the same place, lash loss, ulceration, bleeding, induration, lid-margin distortion or diffuse thickening → specialist assessment with consideration of biopsy. Sebaceous carcinoma can masquerade as a chalazion or chronic unilateral blepharoconjunctivitis."}
  ],
  pathwaySub:"Five steps.",
  pathway:[
    {title:"Exclude orbital and preseptal cellulitis", html:"Orbital signs → emergency; preseptal cellulitis → same-day assessment.", alert:true},
    {title:"Assess the lump", html:"Site, duration, lid eversion where feasible, acuity if vision is affected, atypical features, associated blepharitis or rosacea."},
    {title:"Conservative care", html:"Warm compress and massage; lid hygiene where there is underlying lid disease; no routine antibiotics."},
    {title:"Review at about 4 weeks", html:"Not clearly improving, large, symptomatic or vision-affecting → eye-care referral. Lower threshold in children."},
    {title:"Refer the recurrent or atypical", html:"Specialist assessment with consideration of biopsy; suspected cancer pathway where malignancy is suspected."}
  ],
  sections:[

    {id:"assess", nav:"Assess", title:"Step 1 — chalazion, hordeolum or cellulitis?",
     blocks:[
       {b:"table", head:["Picture","Features","Action"], rows:[
         ["<b>Chalazion</b>","Firm, slowly enlarging lump in the body of the lid — a sterile lipogranuloma from a blocked meibomian gland. It may be tender or inflamed at first, so the distinction from a hordeolum is not always absolute","Conservative care"],
         ["<b>Hordeolum (stye)</b>","An acute, tender inflammatory or infective lesion, external at the lash line or internal within the lid","Most settle with warm compresses; antibiotics only for associated infection, conjunctivitis or cellulitis"],
         ["<b>Preseptal cellulitis</b>","Eyelid erythema and swelling; normal eye movements; no proptosis; vision normal","Same-day clinical assessment and treatment per local pathway"],
         ["<b>Orbital cellulitis</b>","Painful or restricted eye movements, proptosis, diplopia, reduced or impaired colour vision, systemic toxicity","Emergency hospital or eye-casualty assessment"],
         ["<b>Atypical lid lump</b>","Lash loss, ulceration, bleeding, induration, lid-margin distortion, diffuse unilateral thickening, same-site recurrence","See Atypical lumps"]
       ]},
       {b:"table", head:["Examine","Detail"], rows:[
         ["<b>The lump</b>","Exact site and duration · lid eversion if feasible and appropriate · lash loss, ulceration, bleeding, induration and lid-margin distortion"],
         ["<b>The eye</b>","Visual acuity if vision may be affected · conjunctival or corneal involvement · contact-lens use"],
         ["<b>If cellulitis is possible</b>","Eye movements, proptosis, colour vision, temperature and systemic state"],
         ["<b>History</b>","Previous chalazia, blepharitis, meibomian gland dysfunction, rosacea"]
       ]},
       {b:"why", html:"A persistent unilateral lesion should not be relabelled as a benign chalazion again and again without reconsidering the diagnosis."}
     ]},

    {id:"manage", nav:"Manage", title:"Step 2 — conservative care first",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"🔥 Warm compress and massage", html:"Wash hands. A warm (not scalding) compress on the closed lid for about 5–10 minutes, then gentle massage towards the lid margin, 2–4 times a day. Wash hands after."},
         {tone:"amber", h:"🚫 Don't squeeze", html:"Do not squeeze, puncture or lance the lump. Avoid eye make-up and contact lenses while it is inflamed."},
         {tone:"green", h:"🧽 Lid hygiene where there is lid disease", html:"Daily lid-margin cleaning matters most with blepharitis, meibomian gland dysfunction, ocular rosacea, or recurrent or multiple chalazia. It is not mandatory intensive treatment for an isolated first episode. See <a href='blepharitis.html'>blepharitis</a>."},
         {tone:"green", h:"⏳ Expect weeks, not days", html:"Many resolve over weeks; small, asymptomatic lesions can be left alone. Review at about 4 weeks if it is not clearly improving."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"💊 Recurrent multiple chalazia with MGD or ocular rosacea", html:"Optimise lid care and treat the underlying condition. A time-limited course of oral doxycycline may be considered by an appropriately qualified prescriber or eye-care clinician, locally guided — it is not routine treatment for an isolated chalazion. <b>Cautions:</b> avoid routinely in pregnancy and in children under 12 · photosensitivity · oesophagitis — take with plenty of water and stay upright · GI upset · headache or visual symptoms may be intracranial hypertension — caution with isotretinoin · separate from iron, calcium, magnesium and antacids. Check the SPC for the formulation."},
         {tone:"blue", h:"💉 Procedures are specialist-only", html:"Incision and curettage, or intralesional steroid injection for selected smaller or softer lesions, are eye-care procedures. Steroid injection risks include skin depigmentation, raised intraocular pressure and inadvertent ocular injury."}
       ]}
     ]},

    {id:"children", nav:"Children", title:"Children — a lower threshold",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"Refer sooner", html:"Large, recurrent, prolonged or visually significant chalazia in children need a lower threshold for optometry or ophthalmology referral, because of induced astigmatism and the risk of amblyopia."},
         {tone:"amber", h:"Be cautious", html:"Avoid routine doxycycline in children. Do not assume a persistent lid lump in a child is a simple chalazion if it is atypical or accompanied by systemic illness. Children with lid swelling are more likely to have preseptal or orbital cellulitis — assess the same day."}
       ]}
     ]},

    {id:"lesion", nav:"Atypical lumps", title:"Recurrent or atypical lumps — consider biopsy",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"Refer for specialist assessment and consideration of biopsy", html:"A lesion recurring in the same place, particularly if unilateral · lash loss (madarosis) · ulceration or bleeding · induration · lid-margin distortion · diffuse unilateral lid thickening · persistent unilateral blepharoconjunctivitis · atypical colour or rapid growth · failure to respond as expected. Not every recurrence is cancer — but none should be treated repeatedly as benign without specialist review."},
         {tone:"purple", h:"Suspected skin cancer of the lid <span class='tw'>2WW</span>", html:"<b>NICE NG12:</b> a lesion suggesting squamous cell carcinoma or melanoma → suspected cancer pathway referral. A lesion suggesting basal cell carcinoma is usually routine, but consider a suspected cancer pathway referral when delay could matter because of its site or size — the eyelid is such a site. Suspected malignancy follows the local suspected-cancer or eyelid-lesion pathway, not a routine benign-lesion referral."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Step 5 — review and referral",
     blocks:[
       {b:"table", head:["When","Situation","Action"], rows:[
         ["<b>Emergency</b>","Orbital signs — painful or restricted eye movements, proptosis, diplopia, visual impairment, systemic toxicity","Hospital or eye casualty"],
         ["<b>Same day</b>","Suspected preseptal cellulitis · acute visual loss · associated red-eye or corneal signs","Local urgent pathway"],
         ["<b>Prompt</b>","Affects visual acuity · corneal distortion or astigmatism from a large lesion · significant discomfort · children with large or prolonged lesions","Optometry or ophthalmology"],
         ["<b>After about 4 weeks</b>","Not clearly improving despite regular conservative care; large, symptomatic or recurrent","Community or independent-prescribing optometrist, a minor-eyelid-lesion service, or ophthalmology/oculoplastics, per local commissioning — the Greater Manchester EUR policy governs routine removal"],
         ["<b>By features</b>","Same-site recurrence or atypical lesion","Specialist assessment with consideration of biopsy; NG12 where skin cancer is suspected"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"Safety-net", html:"\"If the eyelid becomes hot, red and swollen and it's spreading, you feel unwell, it hurts to move your eye, or your vision changes — get seen the same day.\""},
         {tone:"cream", h:"GP management", html:"Distinguishing chalazion, hordeolum and cellulitis, conservative care and timely referral belong here. Related pages: <a href='blepharitis.html'>blepharitis</a> · <a href='rosacea.html'>rosacea</a> · <a href='cellulitis.html'>cellulitis</a>."}
       ]},
       {b:"say", html:"This is a chalazion — a blocked oil gland in the eyelid. It isn't an infection, so antibiotics won't help. Warm compresses and a gentle massage a few times a day may help the gland drain; it can take several weeks. Please don't squeeze it. If it isn't clearly better in about a month, or it bothers your vision, we can refer you. Get seen the same day if the eyelid becomes hot, swollen and painful, you feel unwell, it hurts to move your eye, or your vision changes."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 67-year-old has had a lump on the same upper eyelid drained twice. It has come back, and she has lost some lashes over it. She asks for another referral to 'have it popped' and some antibiotic cream."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Recognises same-site recurrence and lash loss as atypical; explains honestly, without alarming, why malignancy must be excluded; refers for specialist assessment with consideration of biopsy and applies NG12 urgency; declines antibiotics with a clear reason; checks for cellulitis; safety-nets."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>College of Optometrists — Clinical Management Guideline: chalazion (meibomian cyst)</b><span class="rd"> — conservative care, referral for persistent and atypical lesions</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — skin cancer referral criteria</span></li>'+
         '<li><b>Greater Manchester EUR policy statement — eyelid lesions</b><span class="rd"> — commissioning criteria for removal</span></li>'+
         '<li><b>MHRA SPC — doxycycline 100 mg capsules</b><span class="rd"> — cautions and interactions</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Chalazion in primary care. Orbital signs — painful or restricted eye movements, proptosis, diplopia, visual impairment — need emergency assessment; suspected preseptal cellulitis needs same-day assessment. Warm compress and gentle massage; lid hygiene where there is underlying lid disease; no routine antibiotics. Review at about 4 weeks; refer if not clearly improving, large, symptomatic, vision-affecting or recurrent, with a lower threshold in children. Same-site recurrent or atypical lesions: specialist assessment with consideration of biopsy; NICE NG12 where skin cancer is suspected. Sources: College of Optometrists CMG, NICE NG12, Greater Manchester EUR policy, MHRA SPC."
});
