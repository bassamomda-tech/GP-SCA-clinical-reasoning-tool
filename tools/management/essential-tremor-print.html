MG.render({

  stemSub:"One page for the whole condition: screen the toxic and metabolic emergencies, separate an action tremor from a rest tremor and look for parkinsonian, cerebellar, dystonic and functional features, check thyroid function and the tremorgenic drug list, explain where it is mild, and treat with propranolol or primidone \u2014 started low and titrated cautiously \u2014 when function is impaired, referring when the diagnosis is uncertain or the tremor stays disabling.",
  guideline:"NICE NG127 (2019) \u00b7 NICE NG71 (2017) \u00b7 NICE HTG474 (formerly IPG617, 2018) \u00b7 NICE HTG122 (DBS) \u00b7 MHRA valproate and topiramate safety updates \u00b7 DVLA \u00b7 BNF and product SPCs",
  reviewed:"9 September 2026",
  nextReview:"9 March 2027",
  meta:[
    {t:"NICE NG127 \u2014 suspected neurological conditions"},
    {t:"NICE NG71 \u2014 Parkinson's disease"},
    {t:"NICE HTG474 (formerly IPG617, 2018) \u2014 focused ultrasound thalamotomy"},
    {t:"BNF and product SPCs for all doses"},
    {t:"MHRA \u2014 valproate and topiramate safety"},

    {t:"v2.0 \u00b7 reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#severe"><b>Exclude first</b><small>Toxic \u00b7 withdrawal \u00b7 stroke \u00b7 thyroid</small></a><a href="#confirm"><b>Rest or action?</b><small>ET \u00b7 parkinsonism \u00b7 cerebellar \u00b7 dystonic</small></a><a href="#workup"><b>Work-up</b><small>TFTs \u00b7 drugs \u00b7 MRI?</small></a><a href="#ladder"><b>Treat</b><small>Propranolol \u00b7 primidone</small></a><a href="#refer"><b>Refer</b><small>Neurology \u00b7 DBS \u00b7 FUS</small></a></div>',
  quickSub:"If you read nothing else on this page, read these six cards. Every number traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"\u26a0 Tremor with red-flag features needs urgent assessment", html:"Tremor with delirium, fever, marked autonomic disturbance, rigidity, clonus, seizure, acute focal deficit or severe headache requires urgent assessment. Use the appropriate alcohol-withdrawal, sepsis, toxicology, stroke or endocrine pathway: suspected serotonin syndrome or NMS \u2014 stop the causative drug and arrange hospital treatment; severe alcohol withdrawal \u2014 urgent admission; sudden focal deficit or severe headache \u2014 acute stroke/haemorrhage pathway."},
    {tone:"amber", h:"The first question that sorts it", html:"Rest-predominant, asymmetric tremor \u2014 especially with bradykinesia or rigidity \u2014 suggests parkinsonism and warrants prompt specialist assessment, untreated (NICE NG71). Bilateral postural or kinetic tremor without convincing parkinsonism or cerebellar signs \u2192 suspected essential tremor (NICE NG127). Marked asymmetry, rest tremor, dystonia, gait disorder, ataxia or rapid progression \u2192 atypical tremor: refer."},
    {tone:"blue", h:"Re-emergent tremor: supportive, not diagnostic", html:"Document whether tremor appears immediately on posture or re-emerges after a latency; this may support, but does not establish, parkinsonism. Latency is variable and examination technique matters, so <b>record what you see</b> rather than relying on it as a standalone discriminator."},
    {tone:"green", h:"Always look for the reversible causes", html:"<b>Check thyroid function in suspected essential tremor or where thyroid disease is clinically possible</b> \u2014 urgently if thyrotoxicosis or thyroid storm is suspected \u2014 and do a <b>medication and substance review</b>: salbutamol and other \u03b2\u2082-agonists, lithium, valproate, SSRIs, amiodarone, theophylline, thyroid medication excess, caffeine. Removing the cause is the treatment."},
    {tone:"cream", h:"Treat by impact, not by appearance", html:"Many patients need <b>explanation alone</b> \u2014 do not treat amplitude alone. When function or quality of life is affected: <b>propranolol</b> if no contraindication, started low (for example 10\u201340 mg once or twice daily depending on age, comorbidity and formulation) and titrated to response \u2014 common maintenance doses are about 80\u2013160 mg/day; or <b>primidone</b>, started at 25\u201350 mg at night and increased slowly, if propranolol is contraindicated, ineffective or not tolerated. Check doses against the BNF and product SPC."},
    {tone:"amber", h:"Don't let alcohol become the treatment", html:"Some people report transient improvement with alcohol \u2014 which is why some self-medicate. <b>Do not recommend alcohol as treatment or as a diagnostic test.</b> Ask directly and without judgement, assess for self-medication and alcohol-use disorder (AUDIT-C at review), and offer treatment instead."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step is the one that must never be skipped.",
  pathway:[
    {title:"Screen the emergencies", html:"Tremor with delirium, fever, marked autonomic disturbance, rigidity, clonus, seizure, acute focal deficit or severe headache \u2014 severe alcohol withdrawal, serotonin syndrome, NMS, thyroid storm or an acute structural cause: use the syndrome-specific pathway. Consider Wilson's disease in young-onset or atypical tremor with hepatic, psychiatric or other neurological features.", alert:true},
    {title:"Characterise the tremor", html:"<b>When does it happen \u2014 at rest, on posture, or on action?</b> Then distribution and symmetry, family history, drugs, alcohol use, thyroid status and caffeine. Examine for <b>bradykinesia with decrement, rigidity, gait, cerebellar signs and dystonic posturing</b>."},
    {title:"Exclude the reversible", html:"<b>Thyroid function, medication and substance review</b>, and glucose or other bloods according to the presentation. Wilson's investigations only when clinically indicated, with specialist advice \u2014 not for age alone. DaTscan only via neurology/movement-disorder services when clinical differentiation remains uncertain."},
    {title:"Treat the cause", html:"Essential tremor and disabling \u2192 propranolol or primidone. Suspected Parkinson's \u2192 <b>neurology untreated</b>. Drug-induced or physiological \u2192 remove the driver. Thyrotoxic \u2192 beta-blocker for symptoms if no contraindication, plus investigate and treat the thyroid."},
    {title:"Review and safety-net", html:"Review benefit and adverse effects after each dose change; <b>reassess the diagnosis if features evolve</b> \u2014 emerging bradykinesia suggests parkinsonism. Current DVLA guidance advised and documented."}
  ],
  sections:[

    {id:"severe", nav:"Exclude first", title:"Toxic, metabolic and structural emergencies",
     sub:"New tremor is usually not dangerous. Act urgently when it comes with delirium, fever, autonomic disturbance, rigidity, clonus, seizure, focal signs or severe headache \u2014 using the syndrome-specific pathway.",
     blocks:[
       {b:"table", head:["Presentation","Diagnosis","Action"], rows:[
         ["Tremor + confusion, seizures or autonomic instability <b>after stopping or reducing alcohol</b>","<b>Severe alcohol withdrawal or delirium tremens</b> \u2014 <b>seizure risk is high</b>","<b>Urgent admission</b> via the alcohol-withdrawal pathway, with hospital benzodiazepine treatment and parenteral thiamine (Pabrinex). Life-threatening untreated"],
         ["Tremor + agitation + <b>hyperreflexia and clonus</b> after a serotonergic drug change","<b>Serotonin syndrome.</b> Clonus \u2014 spontaneous rhythmic ankle or patellar clonus \u2014 is what distinguishes it from NMS","<b>Stop the causative serotonergic drug(s) and arrange same-day hospital assessment \u2014 999 if severe</b> (hyperthermia, rigidity, reduced consciousness). Treatment is hospital-based"],
         ["Tremor + <b>lead-pipe rigidity</b> + hyperthermia + autonomic instability on an antipsychotic","<b>Neuroleptic malignant syndrome.</b> Lead-pipe rigidity, bradykinesia and a <b>markedly raised CK</b>; onset over days to weeks","<b>Stop the causative antipsychotic or dopamine blocker; emergency hospital assessment (999).</b> Treatment is hospital-based"],
         ["Tremor with sudden focal neurological symptoms, sudden severe headache or altered consciousness","<b>Stroke, haemorrhage or other acute structural cause</b> \u2014 haemorrhage, tumour, abscess","<b>999 \u2014 acute stroke/haemorrhage pathway with urgent imaging</b>"],
         ["Tremor + tachycardia + heat intolerance + weight loss + palpitations","<b>Thyrotoxicosis or thyroid storm</b>","<b>TSH and free T4 urgently.</b> A beta-blocker for symptomatic relief where appropriate, after checking contraindications; investigate and treat the thyrotoxicosis. <b>Suspected thyroid storm (fever, confusion, arrhythmia, marked tachycardia) requires emergency hospital management</b>"],
         ["<b>Young-onset or atypical movement disorder</b> + hepatic disease, psychiatric or cognitive change, dystonia, parkinsonism or other unexplained neurological signs","<b>Possible Wilson's disease</b> \u2014 a treatable copper metabolism disorder","Seek specialist advice on caeruloplasmin, copper studies and ophthalmology (Kayser-Fleischer rings); <b>a normal caeruloplasmin does not exclude it</b>. Refer suspected cases urgently to neurology/hepatology \u2014 specialist treatment is effective if started early"]
       ]},
       {b:"why", html:"Serotonin syndrome versus NMS is the highest-value differential in this whole area. Both cause hyperthermia, altered consciousness and movement abnormality, but the drugs and the signs differ. <b>Serotonin syndrome</b> \u2014 excess serotonergic activity (SSRIs with MAOIs, tramadol, fentanyl, triptans, lithium, linezolid, MDMA); <b>hyperreflexia plus clonus</b>, agitation, myoclonus, tremor; onset in <b>hours</b>. <b>NMS</b> \u2014 dopamine blockade (antipsychotics, metoclopramide); <b>lead-pipe rigidity</b>, bradykinesia, high CK, autonomic instability; onset over <b>days to weeks</b>. <b>The bedside tests:</b> brisk <b>dorsiflexion</b> of the foot, held \u2014 sustained clonus favours serotonin syndrome; flex and extend the wrist passively \u2014 uniform resistance throughout the range favours NMS. Neither test replaces hospital assessment. Wilson's disease is easily missed in young people with tremor plus hepatic, psychiatric or other neurological features, and it is treatable if caught early."},
       {b:"dl", rows:[
         ["<b>NG12 stated honestly</b>","Essential tremor has no NICE NG12 suspected-cancer criterion, and none should be invented for it. The relevant urgent route here is structural: tremor with sudden focal neurological symptoms, a sudden severe headache or altered consciousness follows the acute stroke/haemorrhage pathway with urgent imaging \u2014 an acute-event pathway, not a suspected cancer pathway referral. If instead the picture is a progressive, sub-acute loss of central neurological function suggesting a brain tumour, that is the NG12 route: a direct-access MRI (or CT if MRI is contraindicated) within 2 weeks for suspected brain or central nervous system cancer"]
       ]}
     ]},

    {id:"confirm", nav:"Rest or action?", title:"Classify the tremor \u2014 the setting localises the cause",
     sub:"Essential tremor, Parkinson's and cerebellar tremor are separated at the bedside, not by scan.",
     blocks:[
       {b:"dl", rows:[
         ["<b>Essential tremor</b> \u2014 the commonest adult tremor","<b>Bilateral postural and kinetic</b> tremor \u2014 present on sustained posture or movement, <b>absent at rest</b>. Hands most often; also <b>head (titubation \u2014 yes-yes or no-no)</b> and voice. <b>Family history is common.</b> Some people report transient improvement with alcohol \u2014 not a diagnostic test. <b>No other neurological signs.</b> Worse with anxiety, caffeine, fatigue, hypoglycaemia. Responds to propranolol or primidone. <b>Suspected essential tremor</b> is a working primary-care diagnosis: bilateral postural/kinetic tremor with no convincing parkinsonism or cerebellar signs. Tremor without other neurological signs is an <b>isolated tremor syndrome</b>; marked asymmetry, rest tremor, dystonia, gait disorder, ataxia, rapid progression or other neurological signs make it <b>atypical</b> \u2014 refer. Avoid calling it benign: it may be progressive and functionally disabling, although it is usually not life-threatening"],
         ["<b>Parkinson's disease tremor</b>","<b>Rest tremor</b> \u2014 present when the limb is fully supported, absent during intentional movement. <b>\u201cPill-rolling\u201d</b> thumb against index and middle finger. <b>Unilateral onset</b> becoming bilateral. With cogwheel rigidity, bradykinesia, postural instability, micrographia, masked facies (hypomimia), shuffling gait, and non-motor symptoms such as anosmia, which are supportive but not diagnostic. <b>Rest tremor is suggestive but not diagnostic</b> \u2014 parkinsonism requires bradykinesia plus rigidity, rest tremor or postural instability, and other causes of rest tremor exist. Tremor may <b>re-emerge on posture after a latency</b>, which supports but does not establish parkinsonism. Responds to levodopa"],
         ["<b>Cerebellar (intention) tremor</b>","<b>Increases as the limb approaches the target</b>, worst at the end of movement. With dysdiadochokinesia, ataxic gait, dysarthria, nystagmus and past-pointing on finger-nose testing. Causes: MS, posterior circulation stroke, chronic alcohol, cerebellar tumour, spinocerebellar ataxia. Large amplitude, ipsilateral to the lesion. <b>Sudden-onset</b> ataxia or focal symptoms \u2192 acute stroke assessment; <b>progressive or chronic</b> cerebellar syndromes \u2192 expedited outpatient neurology"],
         ["<b>Physiological tremor</b>","Fine, fast hand tremor \u2014 <b>normal</b>. Exaggerated by anxiety, caffeine, salbutamol and other \u03b2\u2082-agonists, hypoglycaemia, hyperthyroidism, alcohol withdrawal and fever. <b>Resolves when the cause is removed</b>"],
         ["<b>Drug-induced</b>","<b>Sodium valproate</b> (postural) \u00b7 <b>lithium</b> (coarse, postural \u2014 toxic above 1.5 mmol/L) \u00b7 <b>SSRIs</b> \u00b7 <b>salbutamol</b> \u00b7 <b>amiodarone</b> \u00b7 <b>theophylline</b> \u00b7 <b>metoclopramide</b> (dystonic). Also consider Wilson's, phaeochromocytoma, hepatic encephalopathy and hypoglycaemia"],
         ["<b>Functional tremor</b> (functional movement disorder, FMD)","<b>Variable frequency</b> that changes during examination, <b>entrains</b> to a rhythm the examiner taps, <b>distractible</b> (improves during a simultaneous cognitive task), positive <b>Hoover's sign</b>. Onset during stress or injury; normal MRI. <b>Not imagined \u2014 a real disorder of motor control</b>. Neurology plus specialist physiotherapy and CBT; improves significantly with a correct diagnosis and a proper explanation"],
         ["<b>Dystonic tremor</b>","Tremor in a body part affected by dystonia \u2014 for example <b>head tremor with cervical dystonia</b> \u2014 often irregular and position-dependent, with dystonic posturing. NICE NG127: neurological assessment for suspected dystonia, and consider movement-disorder clinic referral for troublesome head tremor"],
         ["<b>Task-specific and orthostatic tremor</b>","<b>Task-specific</b> tremor occurs only during one activity, such as primary writing tremor. <b>Orthostatic tremor</b> causes shaking or unsteadiness predominantly on standing, relieved by sitting or walking. Both need neurology assessment"],
         ["<b>Medication-induced parkinsonism and tardive syndromes</b>","Antipsychotics, metoclopramide and other dopamine blockers can cause parkinsonism or tardive movement disorders. Review the drug and seek specialist advice"]
       ]},
       {b:"table", head:["Feature","Essential tremor","Parkinson's","Cerebellar"], rows:[
         ["<b>When present</b>","Postural and kinetic","<b>Rest-predominant</b>, often stops on movement \u2014 suggestive, not diagnostic","Intention \u2014 worsens near target"],
         ["Character","Medium-fast, usually bilateral","Slower, pill-rolling, often asymmetric or unilateral onset","Large amplitude, ipsilateral"],
         ["Other neurology","<b>None</b> \u2014 otherwise normal examination","Cogwheel rigidity, bradykinesia, masked facies, micrographia, shuffling gait","Ataxia, dysdiadochokinesia, nystagmus, dysarthria"],
         ["<b>Alcohol</b>","Some report transient improvement \u2014 not a diagnostic test","Usually no improvement","May worsen"],
         ["<b>Posture-hold latency</b>","Usually appears <b>immediately</b> on extension","May <b>re-emerge after a latency</b> \u2014 supportive, not diagnostic","\u2014"],
         ["Response to treatment","Propranolol or primidone (first-line options)","Levodopa \u2014 <b>tremor less responsive than rigidity and bradykinesia</b>","Treat the cause; clonazepam gives modest benefit"]
       ]},
       {b:"why", html:"<b>Ask about alcohol explicitly \u2014 but not as a test.</b> Some people report transient improvement with alcohol, but the response is not diagnostic: <b>do not recommend alcohol as treatment or as a diagnostic test</b>. The question matters because <b>some patients self-medicate</b>, so assess for self-medication and alcohol-use disorder. Ask it plainly and without judgement \u2014 <em>\u201cSome people with this kind of tremor find alcohol makes it better \u2014 is that true for you?\u201d</em> \u2014 because a yes opens the conversation about risk."}
     ]},

    {id:"workup", nav:"Work-up", title:"Examination and investigations",
     sub:"A structured examination, then tests chosen according to the presentation.",
     blocks:[
       {b:"dl", rows:[
         ["<b>The four-step tremor examination</b>","<b>1</b> Observe <b>at rest</b> \u2014 hands on lap, eyes open (rest tremor suggests parkinsonism). <b>2</b> <b>Arms outstretched</b> \u2014 postural tremor; record whether it appears immediately or re-emerges after a latency. <b>3</b> <b>Finger-nose test</b> \u2014 kinetic and intention components; cerebellar tremor worsens approaching the target, with past-pointing. <b>4</b> Record <b>distribution and symmetry</b> \u2014 hands, head, voice, legs \u2014 and amplitude. Frequency estimates are not needed in routine GP practice"],
         ["<b>Bedside tests worth doing</b>","<b>Spiral drawing</b> \u2014 ask for <b>Archimedean spirals</b>: essential tremor produces large tremulous spirals, while Parkinson's shows <b>micrographia</b> rather than a tremulous spiral. <b>Writing sample</b> for micrographia. <b>Cogwheel rigidity</b> \u2014 passively flex and extend the wrist in a circular motion for the ratchet sensation. <b>Dysdiadochokinesia</b> \u2014 rapid alternating pronation and supination. <b>Heel-shin</b> test for cerebellar ataxia"],
         ["<b>Also record</b>","<b>Bradykinesia with decrement</b>, rigidity and gait; cerebellar signs; <b>dystonic posturing</b>; <b>distractibility and entrainment</b> where functional tremor is suspected; cranial signs, speech and swallowing where relevant; and whether shaking occurs predominantly on standing (orthostatic tremor)"]
       ]},
       {b:"table", head:["Investigation","When","Why"], rows:[
         ["<b>TSH</b>, with free T4 if abnormal or clinically indicated","Suspected essential tremor, or where thyroid disease is clinically possible \u2014 <b>urgently</b> if thyrotoxicosis or thyroid storm is suspected","Hyperthyroidism is a reversible cause not to miss"],
         ["FBC, U&amp;E/eGFR, LFTs","If systemic, metabolic, alcohol-related or medication-related causes are plausible","Metabolic, liver and alcohol-related causes"],
         ["Capillary glucose","If symptomatic, diabetic, or hypoglycaemia is possible","Hypoglycaemia"],
         ["<b>Lithium level</b> \u2014 urgently if toxicity is possible, with renal function and electrolytes; <b>valproate level</b> only when clinically indicated","If taking either","<b>Lithium above 1.5 mmol/L is toxicity</b> \u2014 tremor is an early sign. A drug level does not replace clinical assessment"],
         ["<b>Caeruloplasmin, serum copper, 24-hour urine copper</b>","Only when clinically indicated \u2014 young-onset or atypical tremor with hepatic, psychiatric or other neurological features \u2014 preferably with specialist advice; <b>not solely because the patient is under 40</b>","<b>Wilson's disease</b> \u2014 a normal caeruloplasmin does not exclude it"],
         ["<b>MRI brain</b>","Not routine in typical essential tremor; via neurology for rapidly progressive, atypical or unexplained tremor. <b>Sudden focal neurological symptoms, severe sudden headache, altered consciousness or rapidly progressive focal signs \u2192 urgent imaging through the appropriate acute pathway</b>","<b>Do not routinely image typical essential tremor</b>"],
         ["DaTscan (DaTSCAN)","<b><sup>123</sup>I-FP-CIT SPECT only through neurology/movement-disorder services</b>, when clinical differentiation remains uncertain (NICE NG71)","Not a routine GP investigation and does not diagnose Parkinson's disease. May help distinguish parkinsonian syndromes from essential tremor when expert clinical assessment is equivocal, but <b>does not distinguish Parkinson's disease from atypical parkinsonism</b>"]
       ]},
       {b:"warn", html:"<b>Wilson's disease \u2014 specialist investigation:</b> consider it in young-onset or atypical movement disorder, especially with hepatic, psychiatric or other neurological features. Caeruloplasmin, copper studies and slit-lamp examination for Kayser-Fleischer rings are best arranged with specialist advice: results are assay-dependent, and caeruloplasmin can be normal in Wilson's disease and is altered by inflammation, pregnancy and oestrogen. <b>A normal caeruloplasmin does not exclude Wilson's disease</b> \u2014 refer suspected cases urgently to neurology/hepatology."}
     ]},

    {id:"ladder", nav:"Treatment", title:"Treat by impact \u2014 the essential tremor ladder",
     sub:"Quantify the effect on writing, eating, drinking, work and social confidence. That, not the amplitude, decides whether to prescribe.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Every patient", title:"Explanation and trigger reduction", when:"including mild tremor",
          html:"Explain: usually not life-threatening, though it may be progressive and functionally disabling \u2014 for many patients the explanation is enough. <b>Confirm that treatment is wanted and justified</b>: assess writing, eating, drinking, work, social function and distress, and do not treat amplitude alone. Reduce caffeine and stimulants, address anxiety, sleep deprivation and hypoglycaemia, assess for alcohol self-medication, and <b>review and rationalise tremorgenic medication</b> (\u03b2\u2082-agonists, lithium, valproate, SSRIs, thyroid medication excess)."},
         {step:"First-line", title:"Propranolol \u2014 start low, titrate cautiously", when:"tremor impairs function",
          fromLabel:"non-drug measures insufficient",
          html:"If no contraindication, <b>start low \u2014 for example 10\u201340 mg once or twice daily depending on age, comorbidity and formulation</b> \u2014 and titrate to response and tolerability. Common maintenance doses are approximately <b>80\u2013160 mg/day</b>; higher doses require careful justification and monitoring. Use the current product information when choosing immediate-release or modified-release products. <b>Before prescribing, document:</b> asthma or bronchospasm; resting heart rate and blood pressure; heart block or significant bradyarrhythmia; decompensated heart failure; peripheral vascular disease or Raynaud's; diabetes (beta-blockers may mask hypoglycaemia); and concomitant verapamil, diltiazem or other rate-limiting drugs."},
         {step:"Second-line", title:"Primidone \u2014 slow titration", when:"propranolol failed or unsuitable",
          fromLabel:"propranolol contraindicated, ineffective or not tolerated",
          html:"<b>Start 25\u201350 mg at night and increase slowly</b>, usually no more frequently than weekly or fortnightly, according to response and adverse effects; confirm the current formulation and dose in the BNF and product SPC. <b>Use the lowest effective dose.</b> Warn about <b>sedation, dizziness, ataxia, nausea and cognitive effects</b> \u2014 particular caution in older adults and those at risk of falls; give driving advice during initiation and titration; consider renal and hepatic function and drug interactions; seek specialist advice in pregnancy or when pregnancy is planned. If poorly tolerated or ineffective despite a reasonable trial, reconsider the diagnosis and refer."},
         {step:"Specialist", title:"Combination or off-label alternatives", when:"partial response \u2014 with specialist advice",
          fromLabel:"single agent inadequate",
          html:"<b>Combination treatment should normally be considered with neurology/movement-disorder advice</b>, particularly in older adults \u2014 it may increase dizziness, sedation, falls and driving impairment. Off-label alternatives such as <b>atenolol</b>, <b>topiramate</b> or <b>gabapentin</b> are specialist advice only, not part of the routine GP ladder. <b>Topiramate is subject to the MHRA Pregnancy Prevention Programme</b> for women and girls who could become pregnant."},
         {step:"Refractory", title:"DBS or focused ultrasound (specialist)", when:"disabling despite optimised therapy",
          fromLabel:"disabling despite a reasonable trial, or not tolerated",
          html:"<b>Deep brain stimulation</b> of the thalamic VIM nucleus (NICE HTG122, formerly IPG188) is a specialist option for severe, disabling, medication-refractory tremor; reversible and adjustable. NICE describes complications including haemorrhage, infection, hardware failure, speech disturbance and gait effects \u2014 centre-specific risks are quoted during specialist consent. Unilateral MRI-guided focused ultrasound thalamotomy (NICE HTG474 (formerly IPG617, 2018)) \u2014 non-invasive, no incision; HTG474 found no major safety concerns but limited efficacy evidence, so it is used only with special arrangements for clinical governance, consent and audit or research. It treats one side only (bilateral treatment risks dysarthria and gait ataxia)."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"\ud83c\udfad Performance anxiety tremor", html:"<b>Propranolol 40 mg as a single dose, 30\u201360 minutes before</b> the performance, presentation or exam. Very effective for fine-motor performance tremor; <b>not addictive and no regular use needed</b>. Check the dose and contraindications in the BNF; avoid in asthma, and <b>not for driving-related activity</b> \u2014 it may affect reaction time. Well evidenced in musicians, surgeons, public speakers and examinees, and an appropriate off-label decision for a GP to make."},
         {tone:"amber", h:"\ud83d\udc8a Drug-induced tremor \u2014 fix the cause", html:"<b>Valproate:</b> do not stop abruptly \u2014 review with the relevant specialist (see the MHRA warning below). <b>SSRIs:</b> reduce or switch, or consider a beta-blocker if there is no contraindication. <b>Lithium:</b> check the level \u2014 the maintenance range is <b>0.6\u20131.0 mmol/L</b> and a fine postural tremor can occur within the therapeutic range, but <b>&gt;1.5 mmol/L is toxicity</b>, with coarse tremor, ataxia, confusion and seizures as toxicity worsens \u2014 check the level urgently with renal function and electrolytes. <b>Metoclopramide:</b> stop immediately (dystonic reaction)."},
         {tone:"amber", h:"\ud83e\udde0 Suspected Parkinson's \u2014 hands off the levodopa", html:"NICE NG71: refer urgently to a specialist in movement disorders BEFORE starting any dopaminergic treatment. Separating Parkinson's from MSA and PSP is a specialist assessment, and empirical levodopa first is poor practice. The only exception: a very long wait with significantly disabling symptoms, and then only in consultation with the neurology team. Full management is on the <a href='parkinsons.html'>Parkinson's protocol</a>."},
         {tone:"green", h:"\ud83e\udd8b Thyrotoxic tremor", html:"<b>A beta-blocker for symptomatic relief where appropriate, after checking contraindications, while you investigate and treat the thyrotoxicosis</b> (carbimazole or propylthiouracil) \u2014 the tremor resolves as it is controlled. Suspected thyroid storm requires emergency hospital management. See the <a href='hyperthyroidism.html'>hyperthyroidism protocol</a>."}
       ]},
       {b:"warn", html:"Treat by impact, not by appearance \u2014 only medicate when the tremor impairs function or causes significant distress. Beta-blocker cautions matter here: asthma, bradyarrhythmia and decompensated heart failure."},
       {b:"warn", html:"<b>MHRA reproductive-safety warnings.</b> <b>Valproate</b> (a common cause of tremor): do not stop abruptly \u2014 review with the relevant specialist; for women and girls of childbearing potential the Pregnancy Prevention Programme applies, and precautionary contraception advice also applies to men who may father children. <b>Topiramate</b> is contraindicated in pregnancy and in women of childbearing potential unless the conditions of its Pregnancy Prevention Programme are fulfilled \u2014 for tremor it is specialist advice only."}
     ]},

    {id:"lifestyle", nav:"Daily life", title:"Living with the tremor \u2014 what actually helps",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"\ud83c\udf74 Adaptive equipment", html:"Weighted cutlery may reduce the impact on eating. Weighted mugs and cups, non-slip mats under plates, an <b>electric toothbrush</b> (removes the fine-motor requirement), button hooks and zip pulls, voice-controlled devices where tremor affects typing. <b>Refer to occupational therapy</b> for a full assessment of activities of daily living."},
         {tone:"amber", h:"\u2615 Caffeine elimination", html:"Caffeine <b>exaggerates physiological tremor</b> \u2014 it blocks adenosine receptors and raises sympathetic activity. Cutting down often produces a perceptible improvement, and a trial of caffeine elimination can be both diagnostic and therapeutic."},
         {tone:"blue", h:"\ud83e\uddd8 Stress management", html:"Anxiety and sympathetic arousal <b>markedly</b> worsen every kind of tremor. Mindfulness-based stress reduction, <b>CBT (especially for performance anxiety)</b>, relaxation breathing, and <b>NHS Talking Therapies</b> where an anxiety disorder is present. Propranolol helps the symptom; the psychological work addresses the driver."},
         {tone:"amber", h:"\ud83c\udf7a Alcohol \u2014 name the dilemma", html:"Counsel on the <b>self-medication pattern and dependence risk</b>, and offer the effective alternatives. Say it sympathetically: <em>\u201cI understand it's the only thing that helps reliably \u2014 let's find a medical treatment that works as well without the risks.\u201d</em> <b>Use AUDIT-C at review, and follow local alcohol pathways for further assessment and referral.</b>"},
         {tone:"cream", h:"\ud83d\ude34 Sleep", html:"<b>Fatigue and sleep deprivation can worsen tremor.</b> Encourage adequate, regular sleep with standard sleep hygiene \u2014 consistent times, cool dark room, no screens before bed. Assess and treat sleep disorders such as obstructive sleep apnoea on their own merits."},
         {tone:"cream", h:"\ud83d\ude97 Driving and the DVLA", html:"Advise patients to check current DVLA guidance. <b>Parkinson's disease should be reported to the DVLA and the insurer.</b> Essential tremor does not usually require notification unless it affects safe vehicle control or vision. The relevant issues are safe control of the vehicle, functional impairment, visual impairment, sleepiness and the licence group; give driving advice during primidone initiation and titration. <b>Document the advice given</b> and the patient's acknowledgement at each relevant consultation."}
       ]}
     ]},

    {id:"monitor", nav:"Monitoring", title:"Response, tolerability, and the diagnosis itself",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["<b>Response and titration</b>","<b>After starting and each dose change</b>","Tremor improved? Side effects \u2014 bradycardia, bronchospasm, sedation? Continue titrating to the lowest effective dose"],
         ["On a stable dose","Periodically","Function, tolerability, adherence \u2014 avoid escalating indefinitely without reassessing the diagnosis"],
         ["<b>Annual review</b>","Yearly","Is the tremor still significantly affecting quality of life? If disabling despite a reasonable trial, or treatment is poorly tolerated, refer to neurology/movement-disorder services"],
         ["Propranolol tolerability","Each review","Pulse and BP, bronchospasm, fatigue, sleep disturbance and cold extremities \u2014 after initiation and each dose change"],
         ["Primidone tolerability","Early and ongoing","Sedation, dizziness, ataxia, nausea, cognitive effects and falls risk \u2014 slow the titration; driving advice"],
         ["<b>Re-examine the diagnosis</b>","If the pattern changes","New rest tremor or emerging bradykinesia \u2192 reconsider Parkinson's and refer"],
         ["<b>Lithium, if prescribed</b>","<b>Any worsening of tremor</b>","<b>Check the level that day \u2014 not at the next routine date.</b> The usual precipitants are dehydration (vomiting, diarrhoea, hot weather), a new <b>NSAID</b> or ACE inhibitor (both reduce renal lithium clearance), a sodium-restricted diet, and diuretics"],
         ["After DBS or focused ultrasound","Shared care, annual","GP manages general health; neurology manages settings and medication. <b>Check DBS battery status</b>; report new neurological symptoms urgently"]
       ]},
       {b:"cards", items:[
         {tone:"amber", h:"\ud83d\udd01 Tremor not controlled? Work this before calling it refractory", html:"<b>1 Is it essential tremor?</b> Bilateral action tremor, no other neurology, often a family history \u2014 and <b>no emerging bradykinesia</b>. <b>2 Reversible cause excluded?</b> TFTs done, and the tremorgenic drug list genuinely reviewed \u2014 \u03b2\u2082-agonists, lithium, valproate, SSRIs, amiodarone, theophylline. <b>3 Caffeine actually reduced?</b> A genuine trial of caffeine elimination, not a vague cut-back. <b>4 Reasonable drug trial?</b> Propranolol and primidone each titrated cautiously to the lowest effective, tolerated dose \u2014 do not escalate indefinitely without reassessing the diagnosis. <b>5 Combination?</b> Only with neurology/movement-disorder advice. <b>6 Still disabling or not tolerated</b> \u2192 neurology/movement-disorder referral, including consideration of <b>botulinum toxin, DBS or focused ultrasound thalamotomy</b>."}
       ]},
       {b:"cards", items:[
         {tone:"red", h:"\ud83d\udd34 999", html:"\u201cIf the shaking comes with confusion, fever, stiffness or heavy sweating \u2014 or a sudden severe headache or weakness on one side \u2014 that is an emergency.\u201d"},
         {tone:"amber", h:"\ud83d\udfe0 Same week", html:"\u201cIf the tremor gets much worse after starting a new medicine, come back for a drug review.\u201d On lithium: <b>a level the same day</b>."},
         {tone:"blue", h:"\ud83d\udfe1 Changing pattern", html:"\u201cIf the shaking starts happening when your hands are resting, or you notice yourself slowing down or stiffening up, come back \u2014 that changes the diagnosis.\u201d"},
         {tone:"green", h:"\ud83d\udcac Reassurance", html:"\u201cThis does not look like Parkinson's, and it is not usually dangerous \u2014 but if it starts getting in the way, there is treatment, and come back if it changes.\u201d"}
       ]},
       {b:"say", html:"What you have is essential tremor \u2014 a shake that shows up when you use your hands, rather than when they are resting. That pattern, with no other signs, points away from Parkinson's. It is common, it often runs in families, and it is not usually dangerous, although it can slowly get worse. Plenty of people simply want to know what it is and leave it there. If it is getting in the way of writing, eating or work, a tablet such as propranolol, started at a low dose, helps many people, and there is a second option if that one does not suit. One thing worth saying openly: some people find alcohol steadies it briefly, which is why some end up using it that way \u2014 it isn't a treatment, and I would much rather treat it properly."}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999 / same-day", html:"Tremor with <b>delirium, fever, severe autonomic instability, clonus, marked rigidity, seizure or a suspected toxic syndrome</b> (serotonin syndrome, NMS) \u00b7 <b>sudden focal neurological deficit, sudden severe headache, reduced consciousness or suspected stroke/haemorrhage</b> \u00b7 <b>suspected thyroid storm</b> \u00b7 <b>severe alcohol withdrawal</b> with confusion, seizures or autonomic instability."},
         {tone:"amber", h:"Neurology / movement disorders \u2014 prompt referral (NICE NG127, NG71)", html:"<b>Suspected parkinsonian tremor \u2014 refer quickly and untreated, BEFORE starting medication</b> \u00b7 <b>asymmetric tremor</b> \u00b7 tremor with <b>bradykinesia, rigidity, balance or gait disorder</b> \u00b7 <b>cerebellar signs or rapidly progressive tremor</b> (sudden onset \u2192 acute stroke pathway) \u00b7 <b>dystonic or functional tremor</b> where diagnosis or treatment is uncertain \u00b7 <b>young-onset or atypical tremor with hepatic, psychiatric or other neurological features suggesting Wilson's disease</b> (urgently, with hepatology) \u00b7 <b>troublesome head or voice tremor</b>."},
         {tone:"blue", h:"Neurology (routine)", html:"Disabling tremor not responding to, or not tolerating, first-line treatment \u2014 NICE does not require a fixed period at maximum dose \u00b7 diagnosis uncertain \u00b7 consideration of <b>botulinum toxin, DBS or focused ultrasound thalamotomy</b> \u00b7 Parkinson's annual review under shared care. Use the local route \u2014 direct neurology, movement-disorder clinic or Advice and Guidance \u2014 as set by local referral pathways."},
         {tone:"green", h:"Endocrinology / GP investigation", html:"Hyperthyroid tremor \u2014 TSH and free T4, then treat the thyrotoxicosis (carbimazole or propylthiouracil) and the tremor resolves. <b>Drug-induced \u2014 stop or reduce the causative agent.</b>"},
         {tone:"cream", h:"Occupational therapy and physiotherapy", html:"OT for activities-of-daily-living adaptations and weighted equipment. For cerebellar tremor, <b>weighting strategies (wrist weights) and proprioceptive techniques</b>."},
         {tone:"purple", h:"NG12 \u2014 stated honestly", html:"<b>There is no suspected cancer pathway referral route for essential tremor.</b> Tremor with sudden focal neurological symptoms, a sudden severe headache or altered consciousness follows the <b>acute stroke/haemorrhage pathway with urgent imaging</b>. Where the presentation is instead a <b>progressive focal neurological deficit</b> suggesting a brain tumour, the NG12 route applies: direct-access MRI (or CT if MRI is contraindicated) within 2 weeks for suspected brain or CNS cancer."},
         {tone:"cream", h:"Keep in primary care", html:"<b>Stable, symmetrical postural/kinetic tremor without other neurological signs</b> \u2014 explanation, lifestyle measures, and propranolol or primidone. <b>Physiological or medication-related tremor</b> where the cause can be addressed (caffeine, anxiety, salbutamol, drug adjustment)."}
       ]},
       {b:"why", html:"<b>Why NG71 insists on referral before medication:</b> starting levodopa in someone who actually has MSA or PSP gives false reassurance of a Parkinson's diagnosis, delays the correct one, and exposes them to a drug that will not help much; and it risks missing an atypical presentation of a tumour, vascular disease or drug-induced parkinsonism needing entirely different management. The specialist assessment covers onset symmetry, early falls, eye movements for PSP, the pull test for postural instability and cerebellar signs for MSA \u2014 with FP-CIT SPECT (<b>DaTscan</b>) only where clinical differentiation remains uncertain."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 58-year-old accountant whose hands shake when he holds a cup or signs a document, steady on his lap. His father had the same. He mentions, almost as an aside, that a glass of wine settles it completely \u2014 and that he has started having one before client meetings."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"<b>Establishes rest versus action</b> rather than accepting \u201ctremor\u201d; asks about family history and alcohol use; examines for bradykinesia, rigidity, cerebellar and dystonic signs and notes whether tremor re-emerges after a latency; <b>checks thyroid function and reviews the drug list</b>; explains clearly that <b>this does not look like Parkinson's</b>; treats by <b>functional impact</b> rather than reflexively prescribing; and \u2014 the step candidates miss \u2014 picks up the alcohol self-medication without judgement, screens with AUDIT-C, and offers treatment \u2014 propranolol started low \u2014 as the alternative."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG127 · Suspected neurological conditions: recognition and referral (2019) · HTG474 (formerly IPG617) · DVLA</b><br><a href="https://www.nice.org.uk/guidance/ng127" rel="noopener">nice.org.uk/guidance/ng127</a><span class="rd"> \u2014 section 1.15, tremor in adults: refer suspected parkinsonian or asymmetric tremor, or tremor with stiffness, slowness, balance or gait problems, before treatment; suspected essential tremor; medication review, thyroid function and alcohol assessment; neurology referral if disabling despite first-line treatment; movement-disorder referral for troublesome head tremor</span></li>'+
         '<li><b>NICE NG71 \u2014 Parkinson\u2019s disease in adults (2017)</b><br><a href="https://www.nice.org.uk/guidance/ng71" rel="noopener">nice.org.uk/guidance/ng71</a><span class="rd"> \u2014 refer suspected Parkinson\u2019s quickly and untreated to a specialist in Parkinson\u2019s disease; do not initiate dopaminergic treatment in primary care; FP-CIT SPECT only when clinical differentiation is uncertain</span></li>'+
         '<li>NICE HTG474 (formerly IPG617, 2018) \u2014 Unilateral MRI-guided focused ultrasound thalamotomy for treatment-resistant essential tremor<br><a href="https://www.nice.org.uk/guidance/htg474" rel="noopener">nice.org.uk/guidance/htg474</a><span class="rd"> \u2014 special arrangements for clinical governance, consent and audit or research; no major safety concerns, limited efficacy evidence; treats one side only</span></li>'+
         '<li><b>NICE HTG122 (formerly IPG188) \u2014 Deep brain stimulation for tremor and dystonia</b><span class="rd"> \u2014 patient selection; complications including haemorrhage, infection, hardware failure, speech disturbance and gait effects</span></li>'+
         '<li><b>Wilson\u2019s disease diagnostic criteria (EASL, international)</b><span class="rd"> \u2014 specialist diagnostic criteria; caeruloplasmin can be normal in Wilson\u2019s disease and is altered by inflammation, pregnancy and oestrogen</span></li>'+
         '<li><b>DVLA \u2014 Assessing fitness to drive (2022)</b><br><a href="https://www.gov.uk/guidance/assessing-fitness-to-drive-a-guide-for-medical-professionals" rel="noopener">gov.uk \u2014 assessing fitness to drive</a><span class="rd"> \u2014 current neurological guidance: Parkinson\u2019s disease reported to the DVLA; essential tremor usually only if it affects safe vehicle control or vision; check the current guidance</span></li>'+
         '<li><b>MHRA Drug Safety Updates \u2014 valproate (including use in men) and topiramate Pregnancy Prevention Programme (2024)</b><br><a href="https://www.gov.uk/drug-safety-update" rel="noopener">gov.uk \u2014 Drug Safety Update</a><span class="rd"> \u2014 valproate: do not stop abruptly, Pregnancy Prevention Programme, precautionary contraception advice for men; topiramate: contraindicated in pregnancy and in women of childbearing potential unless the Pregnancy Prevention Programme is fulfilled</span></li>'+
         '<li><b>NICE NG12 \u2014 Suspected cancer: recognition and referral (updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> \u2014 no criterion applies to essential tremor; the adjacent route is direct-access MRI within 2 weeks for progressive, sub-acute loss of central neurological function suggesting brain or CNS cancer</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> \u2014 doses, contraindications and interactions, checked with the current product SPCs (propranolol, primidone, topiramate, valproate)</span></li>'+
         '<li><b>Local practice protocol</b><span class="rd"> \u2014 check current NICE guidance, the BNF, MHRA safety updates, DVLA guidance and Greater Manchester referral pathways before use, and confirm the local Bolton referral route (neurology, movement-disorder clinic or Advice and Guidance); review dates apply only where these sources were re-checked on that date</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Essential tremor \u2014 NICE NG71, NICE HTG474 (formerly IPG617, 2018) and DVLA guidance. The undifferentiated tremor presentation is covered by the <a href=\"../algorithms/tremors.html\">tremors assessment pathway</a>, which remains the place to start when the diagnosis is not yet clear. Verify all doses, contraindications and interactions against the current BNF and product SPC before prescribing. Local practice protocol: check current NICE guidance, MHRA safety updates, DVLA guidance and Greater Manchester referral pathways before use."
});
