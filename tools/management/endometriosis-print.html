<script>
MG.render({
  icon:"🌸",
  title:"Endometriosis",
  eyebrow:"Protocol · women's health · suspect, treat and refer in parallel",
  stemTitle:"Endometriosis: suspect it from the symptoms, do not exclude it on a normal examination or scan, and treat and refer in parallel",
  stemSub:"One page for the woman, girl, trans man or non-binary person with painful periods, pelvic pain or deep dyspareunia. Diagnosis in the UK still takes about 8 years on average. NICE NG73 (2017, updated November 2024) asks primary care to recognise the pattern of symptoms, offer a transvaginal ultrasound even if the examination is normal, start analgesia and hormonal treatment while investigations and referral proceed, and refer to gynaecology when initial treatment does not work, is not tolerated or symptoms affect daily life. Suspected deep endometriosis involving bowel, bladder or ureter goes to a specialist endometriosis centre.",
  guideline:"NICE NG73 (2017, updated 2024) · NICE QS172 (2018) · NICE TA1057 (2025) · RCOG patient information · Medicines SPCs",
  reviewed:"15 October 2026",
  nextReview:"April 2027",
  meta:[
    {t:"NICE NG73 · updated November 2024"},
    {t:"Normal scan does not exclude", tone:"tw"},
    {t:"NICE QS172 quality standard"},
    {t:"Reviewed October 2026 · next review April 2027"}
  ],
  lead:"<div class='mg-layers'><a href='#redflags'><b>Red flags</b><small>other diagnoses first</small></a><a href='#diagnose'><b>Suspect</b><small>symptom pattern, TVUS</small></a><a href='#treat'><b>Treat</b><small>analgesia, hormones</small></a><a href='#refer'><b>Refer</b><small>gynae or specialist centre</small></a></div>",
  quickSub:"Six points that change what you do today. Each one is traced to a named source under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"blue", h:"Suspect it from the pattern", html:"Suspect endometriosis with one or more of: <b>chronic pelvic pain</b>; <b>period-related pain</b> (dysmenorrhoea) affecting daily activities and quality of life; <b>deep pain during or after sex</b>; <b>period-related or cyclical gastrointestinal symptoms</b>, particularly painful bowel movements; <b>period-related or cyclical urinary symptoms</b>, particularly blood in the urine or pain passing urine; or <b>infertility</b> with any of these (NICE NG73)."},
    {tone:"red", h:"A normal examination or scan does not exclude it", html:"Offer an abdominal and pelvic examination where appropriate, and <b>offer a transvaginal ultrasound</b> to everyone with suspected endometriosis, <b>even if the examination is normal</b> (transabdominal if transvaginal is declined or unsuitable). Do not exclude endometriosis because the examination or scan is normal: if symptoms persist, refer or re-evaluate. Do not use <b>CA-125</b> or pelvic MRI to diagnose it in primary care."},
    {tone:"cream", h:"Analgesia first, in parallel with investigation", html:"Offer a short trial (for example 3 months) of <b>paracetamol or an NSAID</b>, alone or together, for endometriosis-related pain. If analgesia does not help, consider other options or refer. Treatment, investigation and referral run <b>at the same time</b>, not one after another."},
    {tone:"cream", h:"Hormonal treatment: combined pill or a progestogen", html:"<b>Offer</b> hormonal treatment with the <b>combined oral contraceptive pill</b> or a <b>progestogen</b> to people with suspected, confirmed or recurrent endometriosis, explaining that it can reduce pain and has no permanent negative effect on fertility. Choose by preference, contraindications, contraceptive needs and side effects."},
    {tone:"amber", h:"Refer when treatment fails or life is affected", html:"Refer to <b>gynaecology</b> if initial treatment is not effective, not tolerated or contraindicated, or symptoms are severe, persistent or recurrent, or affect daily life. Refer to a <b>specialist endometriosis service</b> if an endometrioma, deep endometriosis (including the <b>bowel, bladder or ureter</b>) or endometriosis outside the pelvis is suspected or confirmed. Refer young people aged 17 and under to a paediatric and adolescent gynaecology service or a specialist endometriosis service."},
    {tone:"green", h:"Fertility and hormones", html:"Hormonal treatment does <b>not improve fertility</b> and is not used for people trying to conceive. People with endometriosis who want to conceive and have not done so, or who have a known endometrioma, should be discussed with gynaecology or fertility services early. Be honest that pain and fertility goals can pull treatment in different directions."}
  ],
  pathwaySub:"Five moves. The second is where diagnosis is delayed.",
  pathway:[
    {title:"Exclude red flags and other causes", alert:true, html:"Pregnancy test; suspected cancer features (postmenopausal bleeding, pelvic mass, ascites, persistent bloating with raised CA-125 in over-50s) follow the suspected cancer pathway; acute pelvic pain with fever or collapse → same day."},
    {title:"Recognise the pattern", alert:true, html:"Ask about pain and its relation to periods, sex, bowels and bladder, effect on school or work, and fertility. Use a symptom diary. Examine where appropriate and with consent."},
    {title:"Offer an ultrasound", html:"Transvaginal ultrasound for everyone with suspected endometriosis, even with a normal examination; transabdominal if declined or unsuitable. A normal scan does not exclude it."},
    {title:"Treat now", html:"Paracetamol and or an NSAID; hormonal treatment with the combined pill or a progestogen. Discuss contraception, fertility plans and preferences."},
    {title:"Refer and follow up", html:"Gynaecology if treatment fails, is not tolerated, is contraindicated, or symptoms are severe or affect life; specialist endometriosis centre for suspected endometrioma or deep disease. Review the response to treatment."}
  ],
  sections:[
    {id:"redflags", nav:"Red flags", title:"Red flags: other diagnoses first", sub:"Endometriosis is common but is a diagnosis made after more urgent causes of pelvic pain are considered.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Possible ectopic pregnancy", html:"Positive pregnancy test with pain or bleeding, or shoulder-tip pain or collapse → <b>same-day</b> early pregnancy assessment or emergency department; <b>999</b> if haemodynamically unstable.", src:"NICE NG126 (2019, updated 2023)"},
         {tone:"red", h:"🔴 Acute severe pelvic pain", html:"Sudden severe pain with vomiting (ovarian torsion, ruptured endometrioma) or fever with peritonism (pelvic infection, abscess) → <b>same-day</b> gynaecology or surgical assessment.", src:"NICE CKS Endometriosis"},
         {tone:"amber", h:"🟠 Features of ovarian cancer", html:"Persistent abdominal distension or bloating, early satiety, pelvic or abdominal pain, urinary urgency, especially over 50: measure CA-125 and arrange ultrasound per NICE NG12; ascites or a pelvic or abdominal mass not obviously fibroids → <b>suspected cancer pathway referral</b>. A complex ovarian cyst on scan also needs gynaecology review.", src:"NICE NG12 (2015, updated 2026)"},
         {tone:"amber", h:"🟠 Rectal bleeding, haematuria or weight loss", html:"Cyclical rectal bleeding or haematuria can be endometriosis, but non-cyclical bleeding, change in bowel habit, iron deficiency or weight loss need assessment for bowel or urological cancer per NICE NG12.", src:"NICE NG12 (2015, updated 2026)"}
       ]},
       {b:"why", html:"Endometriosis is usually a slowly progressive, benign condition, so the urgent decisions in the consultation are about other diagnoses. Its own harm comes from delay: years of untreated pain, missed school and work, and progression of deep disease. The second question, after excluding emergencies, is whether you are about to be the next clinician to dismiss period pain as normal."}
     ]},

    {id:"diagnose", nav:"Diagnose", title:"Suspecting and investigating", sub:"Diagnosis is clinical first, supported by ultrasound, and confirmed at laparoscopy or by specialist imaging when needed.",
     blocks:[
       {b:"table", head:["Symptom","Ask about","Note"], rows:[
         ["<b>Dysmenorrhoea</b>","Pain that stops daily activities, needs time off school or work, or is not helped by usual analgesia","Period pain that affects quality of life is not 'normal'."],
         ["<b>Chronic pelvic pain</b>","Pain for 6 months or more, cyclical or not","Can co-exist with IBS, bladder pain syndrome and adenomyosis."],
         ["<b>Deep dyspareunia</b>","Pain deep in the pelvis during or after sex","Ask sensitively; affects relationships."],
         ["<b>Bowel symptoms</b>","Painful bowel movements (dyschezia), cyclical bloating, cyclical rectal bleeding","Suggests rectovaginal or bowel disease."],
         ["<b>Urinary symptoms</b>","Painful urination, cyclical haematuria","Suggests bladder or ureteric disease; ureteric disease can silently damage the kidney."],
         ["<b>Infertility</b>","With any of the above","Discuss early with fertility or gynaecology services."]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"⚕️ Examination", html:"Offer abdominal and, if appropriate and with consent, pelvic examination: look for tenderness, nodules in the posterior vaginal fornix, a fixed retroverted uterus or adnexal masses. If a pelvic examination is not appropriate or declined, offer an abdominal examination to exclude masses.", src:"NICE NG73 (2017, updated 2024)"},
         {tone:"blue", h:"🖥️ Ultrasound", html:"Offer a <b>transvaginal ultrasound</b> to everyone with suspected endometriosis, even if the examination is normal, to look for endometriomas and deep endometriosis involving bowel, bladder or ureter, and to exclude other pathology. Consider transabdominal ultrasound if transvaginal is declined or unsuitable.", src:"NICE NG73 (2024 update)"},
         {tone:"amber", h:"🚫 Not for diagnosis", html:"Do not use <b>CA-125</b> to diagnose endometriosis; it can be raised by endometriosis and by other conditions. Pelvic MRI is a specialist test, used to plan surgery for suspected deep disease.", src:"NICE NG73 (2017, updated 2024)"},
         {tone:"cream", h:"📓 Symptom diary", html:"A pain and bleeding diary over a few cycles helps show cyclical patterns and the response to treatment.", src:"NICE NG73 (2017, updated 2024)"}
       ]}
     ]},

    {id:"treat", nav:"Treat", title:"Management in primary care", sub:"Start treatment at the first consultation. It does not need a confirmed diagnosis.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1", tone:"cream", title:"Analgesia", when:"suspected or confirmed", fromLabel:"short trial",
          html:"Offer a short trial (for example 3 months) of paracetamol, an NSAID, or both. <span class=mg-dose>Usual adult dose: naproxen 500 mg initially, then 250 mg every 6–8 hours as needed for dysmenorrhoea (NICE/SPC; check the SPC, BNF and local formulary; <a href=https://www.medicines.org.uk/emc/search?q=naproxen target=_blank rel=noopener>SPC: naproxen</a>).</span> <span class=mg-dose>Usual adult dose: mefenamic acid 500 mg three times daily (NICE/SPC; check the SPC, BNF and local formulary; <a href=https://www.medicines.org.uk/emc/search?q=mefenamic+acid target=_blank rel=noopener>SPC: mefenamic acid</a>).</span> Check for NSAID contraindications."},
         {step:"2", tone:"cream", title:"Hormonal treatment", when:"alongside analgesia", fromLabel:"offer",
          html:"Offer the <b>combined oral contraceptive pill</b> (can be taken continuously or tricycled to reduce bleeds, which is off-label) or a <b>progestogen</b>: oral desogestrel or medroxyprogesterone, the etonogestrel implant, the medroxyprogesterone injection or the 52 mg levonorgestrel intrauterine system. <span class=mg-dose>Usual adult dose: desogestrel 75 micrograms once daily continuously (NICE/SPC; check the SPC, BNF and local formulary; <a href=https://www.medicines.org.uk/emc/search?q=desogestrel target=_blank rel=noopener>SPC: desogestrel</a>).</span> Check UKMEC for each method."},
         {step:"3", tone:"amber", title:"Refer and specialist options", when:"not effective, not tolerated or contraindicated", fromLabel:"refer",
          html:"Gynaecology can offer GnRH agonists with hormonal add-back therapy, dienogest, relugolix combination therapy (NICE TA1057, 2025, for those who have had previous medical or surgical treatment), and laparoscopic diagnosis with excision or ablation. Surgery for endometriomas and deep endometriosis is planned with fertility in mind."},
         {step:"4", tone:"green", title:"Ongoing support", when:"all", fromLabel:"long term",
          html:"Review the response to treatment, mood and impact on work or school. Pain management, pelvic physiotherapy, psychological support and patient groups (such as Endometriosis UK) can help. Recurrence after surgery is common."}
       ]},
       {b:"warn", html:"<b>Before hormonal treatment</b>, check UKMEC: the combined pill is contraindicated with migraine with aura, a history of VTE, smoking aged 35 or over, and other risks. Discuss bleeding patterns with progestogens, and bone density with long-term medroxyprogesterone injection."},
       {b:"say", html:"Endometriosis is when tissue similar to the lining of the womb grows elsewhere in the pelvis and causes pain. A normal scan doesn't rule it out. We can start treatment today to control the pain, and I'll refer you if it doesn't help enough. The hormone treatments don't harm your future fertility, but they do work as contraception while you take them."}
     ]},

    {id:"special", nav:"Special groups", title:"Special groups", sub:"Where the default plan changes.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"🧒 Adolescents", html:"Endometriosis can start in the teenage years. Refer young people aged 17 and under with suspected or confirmed endometriosis to a paediatric and adolescent gynaecology service or a specialist endometriosis service. Ultrasound may be transabdominal. Treat with analgesia and hormones as for adults.", src:"NICE NG73 (2017, updated 2024)"},
         {tone:"amber", h:"👶 Trying to conceive", html:"Hormonal treatment does not improve fertility and is not used in people trying to conceive. Refer early to gynaecology or fertility services; surgery and assisted conception decisions are specialist.", src:"NICE NG73 (2017, updated 2024) · NICE NG257 (2026)"},
         {tone:"blue", h:"🌙 Perimenopause and after", html:"Symptoms often improve after the menopause. HRT can reactivate endometriosis; specialists may recommend continuous combined HRT even after hysterectomy.", src:"NICE NG73 (2017, updated 2024)"},
         {tone:"blue", h:"🏳️‍⚧️ Trans and non-binary people", html:"Endometriosis can affect anyone with a uterus, including trans men on testosterone. Ask, examine with sensitivity, and refer as for others.", src:"NICE NG73 (2017, updated 2024)"}
       ]}
     ]},

    {id:"followup", nav:"Follow-up", title:"Monitoring and follow-up", sub:"Treatment response decides the next step.",
     blocks:[
       {b:"kv", rows:[
         ["After starting treatment","Review after about 3 months: pain, bleeding, side effects, impact on daily life."],
         ["Known endometrioma","Gynaecology may advise ongoing ultrasound surveillance."],
         ["After surgery","Symptoms can recur; consider long-term hormonal treatment to reduce recurrence, as advised by gynaecology."],
         ["Mental health","Chronic pain is linked to low mood and anxiety; ask and offer support."]
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral", sub:"NICE NG73 (2024) strengthened referral from 'consider' to 'refer' in several situations.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same day", html:"Possible ectopic pregnancy, acute severe pelvic pain suggesting torsion or rupture, pelvic sepsis.", src:"NICE NG126 · NICE CKS Endometriosis"},
         {tone:"amber", h:"Suspected cancer pathway referral", html:"Features of ovarian cancer per NICE NG12 (pelvic mass, ascites, raised CA-125 with suspicious ultrasound).", src:"NICE NG12 (2015, updated 2026)"},
         {tone:"amber", h:"Specialist endometriosis centre", html:"Suspected or confirmed endometrioma, deep endometriosis (including bowel, bladder or ureter), or endometriosis outside the pelvic cavity.", src:"NICE NG73 (2017, updated 2024)"},
         {tone:"amber", h:"Gynaecology", html:"Initial treatment not effective, not tolerated or contraindicated; severe, persistent or recurrent symptoms; symptoms affecting daily life; pelvic signs of endometriosis; fertility concerns.", src:"NICE NG73 (2017, updated 2024)"},
         {tone:"amber", h:"Paediatric and adolescent gynaecology", html:"Refer young people aged 17 and under (or to a specialist endometriosis service).", src:"NICE NG73 (2017, updated 2024)"}
       ]}
     ]},

    {id:"patient", nav:"Safety-net", title:"Patient information and safety-netting", sub:"Being believed matters.",
     blocks:[
       {b:"say", html:"If you get sudden severe pain in your tummy or pelvis, especially with vomiting, fainting or a fever, or you could be pregnant and have pain or bleeding, get help the same day through us or NHS 111, or call 999 if you collapse. Otherwise, keep a diary of your pain and periods and we'll review how the treatment is working in about three months."},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"📄 Information", html:"Endometriosis UK; NHS website: endometriosis; NICE information for the public; RCOG patient information on laparoscopy.", src:"Endometriosis UK · NHS website · RCOG"},
         {tone:"green", h:"✅ Work and school", html:"Offer fit notes where needed, and letters supporting reasonable adjustments at work or school.", src:"NICE QS172 (2018)"}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Scenario", html:"A 24-year-old has missed work each month for years with period pain and now has pain opening her bowels during periods. A previous pelvic ultrasound was 'normal'. She says she has been told it is just bad periods.", src:"NICE NG73 (2017, updated 2024)"},
       {tone:"cream", h:"What a good consultation does", html:"Validates her symptoms and recognises the pattern. Explains that a normal scan does not exclude endometriosis and that cyclical painful bowel movements may mean <b>deep disease</b>. Starts analgesia and hormonal treatment, checks UKMEC and fertility plans, and refers to <b>gynaecology</b> or a specialist centre.", src:"NICE NG73 (2017, updated 2024)"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Every recommendation on this page traces to a named primary source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG73 — Endometriosis: diagnosis and management (September 2017, updated November 2024)</b><br><a href="https://www.nice.org.uk/guidance/ng73" rel="noopener">nice.org.uk/guidance/ng73</a><span class="rd"> — symptoms to suspect; transvaginal ultrasound even if examination normal; normal examination or scan does not exclude; no CA-125 or MRI for diagnosis; analgesia trial; combined pill or progestogen; referral to gynaecology and specialist endometriosis services; adolescents; fertility</span></li>'+
         '<li><b>NICE QS172 — Endometriosis quality standard (2018)</b><br><a href="https://www.nice.org.uk/guidance/qs172" rel="noopener">nice.org.uk/guidance/qs172</a><span class="rd"> — referral and diagnosis standards</span></li>'+
         '<li><b>NICE TA1057 — Relugolix–estradiol–norethisterone for treating symptoms of endometriosis (April 2025)</b><br><a href="https://www.nice.org.uk/guidance/ta1057" rel="noopener">nice.org.uk/guidance/ta1057</a><span class="rd"> — option after previous medical or surgical treatment; specialist-initiated</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (2015, updated 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — ovarian, colorectal and urological cancer features</span></li>'+
         '<li><b>NICE NG126 — Ectopic pregnancy and miscarriage (2019, updated 2023)</b><br><a href="https://www.nice.org.uk/guidance/ng126" rel="noopener">nice.org.uk/guidance/ng126</a><span class="rd"> — pain or bleeding with a positive pregnancy test</span></li>'+
         '<li><b>NICE CKS — Endometriosis</b><br><a href="https://cks.nice.org.uk/topics/endometriosis/" rel="noopener">cks.nice.org.uk/topics/endometriosis</a><span class="rd"> — primary care practicalities</span></li>'+
         '<li><b>CoSRH — UK Medical Eligibility Criteria for Contraceptive Use (UKMEC 2025)</b><br><a href="https://www.cosrh.org/Common/Uploaded%20files/documents/UKMEC_2025.pdf" rel="noopener">cosrh.org — UKMEC 2025</a><span class="rd"> — contraindications to hormonal methods</span></li>'+
         '<li><b>SPCs — naproxen, mefenamic acid, desogestrel, medroxyprogesterone</b><br><a href="https://www.medicines.org.uk/emc" rel="noopener">medicines.org.uk/emc</a><span class="rd"> — doses and licensing</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Endometriosis in primary care — NICE NG73 (2017, updated November 2024), NICE QS172, NICE TA1057 and medicines SPCs. Check doses in the current SPC, BNF and local formulary, and contraceptive eligibility in UKMEC. Not a substitute for clinical judgement."
});
</script>
