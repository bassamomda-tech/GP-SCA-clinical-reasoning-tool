<script>
MG.render({
  icon:"🧠",
  title:"Dementia — the complete guide",
  eyebrow:"Protocol · NICE NG97 · subtype drives safe prescribing",
  stemTitle:"The largest gains in dementia care come not from the cognitive enhancer but from support, planning, and treating the things that make cognition worse — pain, sensory loss and anticholinergic burden",
  stemSub:"One page for the whole condition. Establish the <b>subtype</b>, because it changes drug choice and makes some drugs dangerous; deliver the non-drug care that is the actual foundation; use cognitive enhancers where indicated, but not routinely in predominantly vascular dementia unless comorbid Alzheimer's disease, Parkinson's disease dementia or dementia with Lewy bodies is suspected; meet <b>BPSD with a structured assessment</b> for physical, psychological, environmental and communication-related causes before reaching for an antipsychotic that carries excess stroke and death; and remember that an acute or fluctuating change over hours to days should prompt <b>assessment for delirium</b>, including delirium superimposed on dementia, rather than being assumed to be the dementia getting worse.",
  guideline:"NICE NG97 (2018) · NICE CG103 · NICE NG71 · MHRA · DVLA (GOV.UK) · local GMMMG dementia prescribing resources",
  reviewed:"14 September 2026",
  nextReview:"14 March 2027",
  meta:[
    {t:"NICE NG97 — dementia: assessment, management and support"},
    {t:"Antipsychotics in Lewy body dementia: severe sensitivity", tone:"tw"},
    {t:"Acute or fluctuating change → assess for delirium", tone:"tw"},
    {t:"v2.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#foundation"><b>Subtype</b><small>Drives prescribing</small></a><a href="#support"><b>Support</b><small>The real treatment</small></a><a href="#cognitive"><b>Cognitive</b><small>AChEI · memantine</small></a><a href="#bpsd"><b>BPSD</b><small>Structured assessment first</small></a><a href="#decline"><b>Decline?</b><small>Delirium first</small></a></div>',
  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⛔ Avoid antipsychotics in dementia with Lewy bodies", html:"Severe neuroleptic sensitivity — reactions can be catastrophic and irreversible. This is why establishing the subtype is a prescribing-safety task, not an academic one. Cholinesterase inhibitors, by contrast, help in Lewy body dementia and Parkinson's disease dementia as well as Alzheimer's."},
    {tone:"red", h:"⚠ An acute change should prompt assessment for delirium", html:"An acute or fluctuating change in confusion, alertness or behaviour over hours to days should prompt assessment for delirium, including delirium superimposed on dementia — established dementia does not explain a rapid change, so do not assume it is \"the dementia getting worse\". Assess for infection (especially urine and chest), constipation, urinary retention, dehydration, pain, hypoxia and medication effects. Use the 4AT when indicators are present; it is an assessment aid and does not replace clinical diagnosis using collateral history and examination."},
    {tone:"amber", h:"BPSD — structured assessment before medication", html:"BPSD should prompt a structured assessment for physical, psychological, environmental and communication-related causes before medication is considered: pain or other physical symptoms, delirium, infection, constipation or urinary retention, medication effects, sensory or environmental problems, depression or anxiety, unmet social or emotional needs, and the neuropsychiatric manifestations of dementia itself. <b>Unrecognised pain is a leading cause of agitation.</b> Antipsychotics carry a real excess of stroke and death in dementia — last resort, lowest dose, shortest time, reassessed at least every six weeks and stopped if there is no clear ongoing benefit. <b>Do not offer valproate</b> for agitation or aggression unless indicated for another condition."},
    {tone:"blue", h:"Cognitive enhancers — and where they do not belong", html:"Donepezil, galantamine or rivastigmine for mild-to-moderate Alzheimer's; donepezil or rivastigmine for mild-to-moderate dementia with Lewy bodies (consider in severe disease); AChE inhibitors in Parkinson's disease dementia. Memantine for moderate Alzheimer's where an AChE inhibitor is not tolerated or contraindicated, or severe Alzheimer's (may be added in moderate, offer as add-on in severe disease). Not routinely in predominantly vascular dementia unless comorbid Alzheimer's, Parkinson's disease dementia or Lewy body dementia is suspected; not in frontotemporal dementia. Initiate under local memory-service/shared-care arrangements; doses per local GMMMG guidance and current SPCs. <b>Do not stop an AChE inhibitor solely because dementia has become severe.</b>"},
    {tone:"green", h:"Review cumulative anticholinergic burden", html:"Review cumulative anticholinergic burden at medication reviews (no single burden tool is preferred). Where possible, reduce or replace medicines with significant anticholinergic effects — for example oxybutynin and other bladder antimuscarinics, tricyclic antidepressants, sedating antihistamines, some antipsychotics, procyclidine and some gastrointestinal antispasmodics — balancing this against symptom control and withdrawal risks; not every anticholinergic should simply be stopped. Alongside: treat pain, correct hearing and vision, and address sleep, nutrition, hydration and continence."},
    {tone:"purple", h:"🟣 DVLA — the licence holder must notify", html:"At diagnosis, explain that the patient must notify the DVLA and their motor insurer, and document the advice; advise them not to drive if unsafe. If they lack capacity to understand this, or refuse despite a significant public-safety concern, follow current DVLA/GMC guidance on clinician notification. A diagnosis does not automatically mean stopping driving permanently — fitness depends on severity, insight, function and DVLA assessment. Address capacity, Lasting Power of Attorney and advance care planning early, while the person can still participate."}
  ],
  pathwaySub:"Six steps, and the first one determines which drugs are safe.",
  pathway:[
    {title:"Establish subtype, severity and the whole person", html:"Alzheimer's, vascular, mixed, Lewy body or frontotemporal — plus collateral history, cognitive and functional assessment, examination, blood and urine tests for reversible causes, medication review (including anticholinergic burden), assessment for delirium, depression, sensory impairment and sleep problems, structural imaging unless dementia is well established and the subtype clear, and specialist diagnosis where dementia remains suspected or the subtype is uncertain.", alert:true},
    {title:"Put the non-drug foundation in place", html:"Cognitive stimulation, post-diagnostic support, carer assessment, advance care planning, sensory aids and the practicalities."},
    {title:"Consider a cognitive enhancer where indicated", html:"AChE inhibitor and/or memantine by subtype and severity, initiated under local memory-service/shared-care arrangements — not routinely in predominantly vascular dementia, and not in frontotemporal dementia."},
    {title:"Manage BPSD after a structured assessment", html:"Look for physical, psychological, environmental and communication-related causes; non-drug measures first, every time; antipsychotics last resort, reviewed at least every six weeks; no valproate for agitation."},
    {title:"Monitor cognition, function, drugs and the carer", html:"Function, falls, nutrition, mood, behaviour, medicines, safeguarding and carer strain at every review — cognitive scores are not the sole measure of progression."},
    {title:"On any decline, exclude reversible causes first", html:"Delirium, pain, anticholinergics, mood and sensory impairment — before accepting progression."}
  ],
  sections:[

    {id:"foundation", nav:"Subtype", title:"Step 1 — subtype, severity and the whole person",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>Subtype</b>","Alzheimer's, vascular, mixed, dementia with Lewy bodies, frontotemporal — this changes drug choice and cautions. Do not diagnose vascular dementia solely from the burden of vascular lesions on imaging"],
         ["<b>Diagnostic assessment</b>","Collateral history from someone who knows the person · cognitive and functional assessment · physical examination · blood and urine tests for reversible causes · medication review including anticholinergic burden · assessment for delirium, depression, sensory impairment and sleep problems · structural brain imaging unless dementia is well established and the subtype is clear · specialist dementia assessment once reversible causes have been investigated and dementia remains suspected"],
         ["<b>Severity and function</b>","Cognition, activities of daily living, behavioural and psychological symptoms (BPSD), and risk"],
         ["<b>Capacity and planning</b>","Mental capacity is decision-specific and time-specific · a Lasting Power of Attorney must generally be made while the person has capacity and registered before use · an advance statement records non-binding preferences · an advance decision to refuse treatment is legally binding if valid and applicable · ReSPECT/DNACPR is treatment-escalation and resuscitation planning, not an LPA · DVLA and insurer advice. Do not assume a family member or carer can make decisions solely because the person has dementia — establish whether there is a registered health and welfare LPA or valid advance decision"],
         ["<b>Reversible contributors</b>","Sensory impairment, pain, depression, delirium, polypharmacy — particularly anticholinergics"]
       ]},
       {b:"why", html:"Subtype drives safe prescribing: cholinesterase inhibitors help Alzheimer's and Lewy body dementia, but antipsychotics are dangerous in Lewy body disease. Beyond drugs, dementia care is mostly support, planning, and treating the things that make cognition worse — pain, sensory loss and anticholinergic load — which is where the largest quality-of-life gains lie."}
     ]},

    {id:"support", nav:"Support", title:"Step 2 — support, stimulation and carers: the foundation of care",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"🧩 Cognitive stimulation", html:"Group cognitive stimulation therapy for mild-to-moderate dementia; structured activity."},
         {tone:"green", h:"👥 Post-diagnostic support", html:"Named coordinator, written care plan, local services, dementia adviser."},
         {tone:"green", h:"🫂 Carer support", html:"Carer needs assessment, education and respite — carer wellbeing protects the patient."},
         {tone:"green", h:"📋 Advance care planning", html:"Capacity, LPA (made while the person has capacity, registered before use), advance statement, advance decision to refuse treatment, and ReSPECT/DNACPR discussions while the person can still participate."},
         {tone:"green", h:"👓 Optimise the basics", html:"Hearing and vision aids, treat pain, sleep, nutrition, hydration, continence."},
         {tone:"purple", h:"🚗 Practicalities", html:"<b>Advise DVLA and insurer notification, safeguarding, finances and financial vulnerability, home safety.</b>"}
       ]}
     ]},

    {id:"cognitive", nav:"Cognitive", title:"Step 3 — cognitive enhancers (initiated under local memory-service/shared-care arrangements)",
     blocks:[
       {b:"table", head:["Step","Drug","When"], rows:[
         ["<b>Step 1 — AChE inhibitor</b>","<b>Donepezil, galantamine or rivastigmine</b> — initiation, titration, renal/hepatic restrictions, formulations, monitoring, stopping criteria and interactions per local GMMMG dementia prescribing guidance and current SPCs","Mild-to-moderate Alzheimer's (any of the three); mild-to-moderate dementia with Lewy bodies (donepezil or rivastigmine; consider in severe disease); Parkinson's disease dementia. <b>Before and during treatment assess pulse, syncope, falls, conduction disease and interacting medicines; consider an ECG where there is bradycardia, unexplained syncope, conduction disease, significant cardiac history or medicines affecting cardiac conduction.</b> Do not stop solely because dementia has become severe — continue on clinical benefit, adverse effects, preference and the agreed plan"],
         ["<b>Step 2 — memantine</b>","<b>NMDA antagonist</b>","Moderate Alzheimer's where an AChE inhibitor is not tolerated or contraindicated, or severe Alzheimer's; may be added to an AChE inhibitor in moderate disease and should be offered as an add-on in severe disease. Dementia with Lewy bodies where an AChE inhibitor is not tolerated or contraindicated"],
         ["<b>Vascular dementia</b>","<b>Cognitive enhancers not routinely recommended in predominantly vascular dementia</b> unless comorbid Alzheimer's disease, Parkinson's disease dementia or dementia with Lewy bodies is suspected","Continue appropriate evidence-based management of hypertension, diabetes, lipids, atrial fibrillation and smoking, individualised to frailty, life expectancy, treatment burden and goals of care — primarily to prevent further vascular events and disability"],
         ["<b>Frontotemporal dementia</b>","<b>No AChE inhibitor or memantine</b>","Specialist management"],
         ["<b>Initiation and continuation</b>","<b>Clinician with appropriate expertise</b>","Initiation follows local memory-service/shared-care arrangements by a clinician with appropriate knowledge and skills (a specialist, or a GP/advanced practitioner with specialist expertise). Primary care may issue the first prescription and continue treatment once the diagnosis, treatment plan and monitoring arrangements are established"]
       ]},
       {b:"warn", html:"Avoid antipsychotics in dementia with Lewy bodies — severe sensitivity. Review cumulative anticholinergic burden and, where possible, reduce or replace medicines with significant anticholinergic effects, balancing symptom control and withdrawal risks. Antipsychotics for BPSD raise stroke and death risk — last resort only."}
     ]},

    {id:"bpsd", nav:"BPSD", title:"Step 4 — distress and behaviour: non-drug first",
     blocks:[
       {b:"table", head:["Step","Action"], rows:[
         ["<b>Step 1 — always non-pharmacological first</b>","Structured assessment for physical, psychological, environmental and communication-related causes: pain or other physical symptoms, delirium, infection, constipation or urinary retention, medication effects, sensory or environmental problems, hunger, boredom, depression or anxiety, unmet social or emotional needs, and the neuropsychiatric manifestations of dementia itself"],
         ["<b>Antipsychotic</b>","Only if the person is at risk of harming themselves or others, or has agitation, hallucinations or delusions causing severe distress, AFTER non-drug measures have failed or are inappropriate. Discuss benefits and harms with the person and family/carers (NICE decision aid: in about 1,000 people treated for 6–12 weeks, roughly 12 additional strokes and 11 additional deaths). Lowest effective dose, shortest possible duration. Avoid in dementia with Lewy bodies"],
         ["<b>Depression or anxiety</b>","Treat comorbid mood disorder; consider an antidepressant where appropriate"],
         ["<b>Valproate</b>","<b>Do not offer valproate to manage agitation or aggression in dementia unless it is indicated for another condition</b>"],
         ["<b>Review</b>","<b>Reassess at least every six weeks and stop if there is no clear ongoing benefit; consider a planned withdrawal when clinically appropriate</b>"]
       ]},
       {b:"why", html:"BPSD should prompt a structured assessment for physical, psychological, environmental and communication-related causes before medication is considered, so the first \"treatment\" is a careful search for the cause. Distinguish delirium (an acute or fluctuating change over hours to days), BPSD (persistent or recurrent symptoms in the context of dementia), depression or anxiety, psychosis associated with dementia, and medication-induced or withdrawal states. A three-day change in established dementia should trigger same-day clinical assessment when clinically concerning, not simply an antipsychotic review. Antipsychotics carry a real excess of stroke and death in dementia, which is why they are a last resort, lowest-dose, time-limited measure."}
     ]},

    {id:"monitor", nav:"Review", title:"Step 5 — monitoring and the review schedule",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["<b>Cognition and function</b>","<b>At reviews</b>","<b>Cognitive scores are not the sole measure of progression or treatment benefit: assess activities of daily living, mobility and falls, continence, nutrition and weight, swallowing, pain, mood and sleep, hallucinations and behaviour; reassess goals and support</b>"],
         ["<b>AChE inhibitor tolerability</b>","<b>After starting and at titration</b>","<b>Bradycardia, syncope and falls, GI effects, weight loss and anorexia, sleep disturbance or vivid dreams, urinary symptoms, drug interactions and adherence; continue on clinical benefit, not stopped solely because of severity</b>"],
         ["<b>BPSD and antipsychotic review</b>","<b>At least every six weeks</b>","<b>Stop if no clear ongoing benefit; consider planned withdrawal; monitor for harm</b>"],
         ["<b>Carer strain</b>","<b>Each review</b>","<b>Reassess carer support and respite needs</b>"]
       ]},
       {b:"dl", rows:[
         ["<b>After diagnosis</b>","Establish the care plan: coordinator, support services, cognitive enhancer if indicated, carer assessment, advance planning"],
         ["<b>Regular reviews</b>","Holistic review — cognition, function, BPSD, medication adherence and adverse effects, comorbidity, carer strain, safeguarding, driving, financial vulnerability, advance care planning, and vascular risk-factor management where appropriate"],
         ["<b>With decline</b>","Anticipatory care: reassess goals, advance and end-of-life care, place-of-care decisions"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 Delirium", html:"\"A sudden change in confusion, alertness or behaviour over hours to days — contact us. It may mean a treatable illness such as an infection or a medicine side effect, and needs assessing.\""},
         {tone:"amber", h:"🛡️ Safeguarding", html:"\"Concerns about safety, neglect, finances or driving — raise them with us; we can help.\""},
         {tone:"amber", h:"💊 Antipsychotic risks", html:"\"If an antipsychotic is used it is short-term and reviewed — tell us about drowsiness, falls or stiffness.\""},
         {tone:"green", h:"🫂 Carer", html:"\"If you are struggling as a carer, tell us early — support and respite are available.\""}
       ]}
     ]},

    {id:"decline", nav:"Decline?", title:"Decline or new distress? Exclude reversible causes",
     sub:"An acute or fluctuating change should prompt assessment for delirium — do not assume it is just the dementia getting worse.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"1 · Delirium", html:"Acute or fluctuating change → assess for delirium (4AT as an aid, with collateral history): infection (especially urine and chest), constipation, urinary retention, dehydration, pain, hypoxia and any new drug. Same-day clinical review if systemically unwell or unsafe."},
         {tone:"amber", h:"2 · Pain", html:"<b>Unrecognised pain is a leading cause of agitation — assess and treat.</b>"},
         {tone:"amber", h:"3 · Anticholinergics", html:"<b>Review cumulative anticholinergic burden; reduce or replace where possible, balancing symptom control and withdrawal risks.</b>"},
         {tone:"blue", h:"4 · Mood and sensory", html:"<b>Treat depression; optimise hearing and vision.</b>"},
         {tone:"green", h:"5 · Specialist", html:"Severe or refractory BPSD, or diagnostic doubt → old-age psychiatry or the memory service."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"When to refer",
     blocks:[
       {b:"cards", items:[
         {tone:"blue", h:"Memory assessment service", html:"<b>For specialist diagnosis once reversible causes have been investigated and dementia remains suspected, subtyping where uncertain, and cognitive-enhancer initiation under local arrangements.</b>"},
         {tone:"amber", h:"Old-age psychiatry — severe BPSD", html:"<b>Distress or risk refractory to non-drug measures.</b>"},
         {tone:"amber", h:"Neurology / specialist", html:"<b>Rapid decline, young-onset dementia, or atypical features.</b>"},
         {tone:"green", h:"Social care and safeguarding", html:"<b>Carer breakdown, safeguarding concerns, or place-of-care decisions.</b>"},
         {tone:"cream", h:"GP management", html:"Recognising reversible contributors, the non-drug foundation, continuing cognitive enhancers, BPSD assessment, anticholinergic deprescribing, carer support, advance care planning and the delirium screen all belong here. Related pages: <a href='parkinsons.html'>Parkinson's disease</a> · <a href='depression.html'>depression</a> · <a href='malnutrition.html'>malnutrition</a> · <a href='tia-stroke.html'>stroke and TIA</a> · <a href='care-of-the-dying.html'>care of the dying</a>."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"The daughter of an 82-year-old man with <b>dementia with Lewy bodies</b> phones. Over the <b>past three days</b> he has become more confused, is <b>seeing people in the room at night</b>, and was <b>agitated and aggressive</b> with carers this morning. He is on <b>donepezil</b> and was recently started on <b>oxybutynin</b> for urinary urgency. She asks whether he can have \"something to calm him down\"."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"<b>Treats a three-day change as delirium until assessed</b>: obtains collateral history and assesses for infection, constipation, urinary retention, dehydration, pain and hypoxia rather than accepting progression; identifies the recently started oxybutynin as a plausible anticholinergic contributor and reviews it, stopping or substituting where clinically appropriate after considering the urinary symptoms and alternatives, along with all recent medicines; <b>recognises that visual hallucinations may be a core feature of Lewy body dementia, but that a new or rapidly worsening change still requires assessment for delirium, medication effects and physical illness</b>, without assuming the hallucinations are simply baseline; does not prescribe an antipsychotic before assessing the cause, avoiding haloperidol and other dopamine-blocking drugs; declines the request for an antipsychotic, explaining the severe neuroleptic sensitivity in Lewy body disease — this is the single most important safety point in the case — as well as the general stroke and death excess; <b>searches for the cause behind the agitation</b>, particularly pain, physical illness and the carers' approach; assesses the daughter's strain and offers a carer's assessment and respite; arranges <b>same-day review or admission if systemically unwell or unsafe</b>; and involves <b>old-age psychiatry</b> if distress persists after reversible causes are excluded."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>NICE NG97 — Dementia: assessment, management and support for people living with dementia and their carers<br><a href="https://www.nice.org.uk/guidance/ng97" rel="noopener">nice.org.uk/guidance/ng97</a><span class="rd"> — subtype-specific prescribing, cholinesterase inhibitors and memantine by severity, group cognitive stimulation therapy, structured assessment and the non-pharmacological-first approach to distress and behaviour, antipsychotics as a last resort reassessed at least every six weeks, no valproate for agitation or aggression, initiation by a clinician with appropriate expertise, not stopping AChE inhibitors solely because of severity, telling people to notify the DVLA and their insurer, and carer needs assessment</span></li>'+
         '<li><b>NICE NG97 \u2014 Dementia: assessment, management and support</b><br><a href="https://www.nice.org.uk/guidance/ng97" rel="noopener">nice.org.uk/guidance/ng97</a><span class="rd"> — the reversible contributors, the delirium screen on acute change, anticholinergic burden, monitoring of AChE inhibitor tolerability, and the referral thresholds</span></li>'+
         '<li>MHRA Drug Safety Update — antipsychotics in elderly people with dementia<span class="rd"> — the increased risk of stroke and death that makes antipsychotics a last-resort, time-limited measure</span></li>'+
         '<li><b>NICE NG97 patient decision aid — antipsychotic medicines for people with dementia</b><span class="rd"> — absolute-risk illustration: about 12 additional strokes and 11 additional deaths per 1,000 people treated for 6–12 weeks</span></li>'+
         '<li><b>NICE CG103 — Delirium: prevention, diagnosis and management</b><br><a href="https://www.nice.org.uk/guidance/cg103" rel="noopener">nice.org.uk/guidance/cg103</a><span class="rd"> — indicators of delirium and the 4AT as an assessment aid</span></li>'+
         '<li><b>NICE NG71 — Parkinson’s disease in adults</b><br><a href="https://www.nice.org.uk/guidance/ng71" rel="noopener">nice.org.uk/guidance/ng71</a><span class="rd"> — dopamine-blocking drugs and Parkinson’s disease dementia</span></li>'+
         '<li><b>GMMMG — Polypharmacy Review and Treatment Optimisation Resource Pack, and local dementia prescribing resources</b><span class="rd"> — donepezil, galantamine, rivastigmine and memantine prescribing and shared care</span></li>'+
         '<li><b>DVLA — Assessing fitness to drive</b><br><a href="https://www.gov.uk/government/publications/assessing-fitness-to-drive-a-guide-for-medical-professionals" rel="noopener">gov.uk — assessing fitness to drive</a><span class="rd"> — the licence holder’s legal duty to notify the DVLA; the clinician’s role to advise and document, and to notify the DVLA if the person cannot understand or will not notify and there is a significant safety concern</span></li>'+
         '<li><b>Mental Capacity Act 2005</b><span class="rd"> — decision- and time-specific capacity assessment, Lasting Power of Attorney, advance statements, advance decisions to refuse treatment and best interests, while the person can still participate</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Dementia — NICE NG97 (2018). Establish the subtype, because it decides which drugs are safe: avoid antipsychotics in dementia with Lewy bodies, and do not use cognitive enhancers routinely in predominantly vascular dementia unless comorbid Alzheimer's, Parkinson's disease dementia or Lewy body dementia is suspected. The largest quality-of-life gains come from support, planning, and treating what makes cognition worse — pain, sensory impairment and anticholinergic burden. BPSD needs a structured assessment for physical, psychological, environmental and communication-related causes: non-drug measures first, every time; antipsychotics reviewed at least every six weeks; no valproate for agitation. An acute or fluctuating change over hours to days should prompt assessment for delirium. Advise the patient to notify the DVLA and their insurer. Verify all doses against local GMMMG guidance, the current BNF and SPCs before prescribing."
});
