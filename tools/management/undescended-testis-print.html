  stemSub:"One page for the whole condition. Screen for the two emergencies (bilateral impalpable testes with genital anomaly as a possible DSD or salt-losing CAH; acute pain as torsion); separate a retractile testis from a true undescended one, because that single distinction prevents unnecessary surgery; classify by palpability, since non-palpable disease needs laparoscopy not ultrasound; refer by 3–4 months so orchidopexy happens by 12–18 months; and set up the lifelong cancer surveillance that orchidopexy reduces but does not remove. BAUS · ESPU/EAU 2024 · NG12.",

  quickSub:"If you read nothing else on this page, read these six cards. Every figure traces to the source cited under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Bilateral impalpable testes + genital anomaly = a DSD until proven otherwise", html:"Bilateral non-palpable testes with hypospadias or ambiguous genitalia in a neonate → same-day paediatrics. This must be treated as a disorder of sex development until proven otherwise — including congenital adrenal hyperplasia in a 46XX infant, which carries a life-threatening salt-wasting crisis risk. EAU/ESPU: all bilateral impalpable testes with a genital anomaly need urgent endocrine and genetic assessment, including urgent sex chromosome analysis. Bilateral disease occurs in 10% of cases."},
    {tone:"amber", h:"The mobility test is the whole diagnosis", html:"Can the testis be guided to mid-scrotum without tension, and does it REMAIN there after release? Yes → retractile: no surgery, annual review. No — it springs back or cannot reach the scrotum → true undescended testis: refer. <b>This distinction prevents unnecessary surgery</b>, and it is made with warm hands in a warm room with a relaxed child (supine, then cross-legged), because the cremasteric reflex is hypersensitive in young children."},
    {tone:"blue", h:"Refer by 3 months so the operation happens by 12–18 months", html:"Up to 80% of testes undescended at birth descend spontaneously in the first 3 months, so the referral point is the 3-month check — spontaneous descent after 6 months is rare. Refer by age 3–4 months for orchidopexy at 12–18 months (ESPU/EAU 2024, BAUS 2023). Earlier surgery correlates with better germ-cell preservation, and late orchidopexy after 13 years still carries elevated cancer risk (Pettersson, NEJM 2007)."},
    {tone:"green", h:"Do NOT request an ultrasound and wait", html:"BAUS and ESPU state explicitly that ultrasound should not be used to confirm or exclude an intra-abdominal testis — sensitivity is only 45% (Tasian 2011). Diagnostic laparoscopy is the gold standard for non-palpable disease. Requesting an ultrasound in primary care for a non-palpable testis can falsely reassure and delay surgical exploration. Refer directly; do not delay referral for imaging."},
    {tone:"purple", h:"Ascending testis — the one GPs are responsible for finding", html:"A previously scrotal testis can ascend with growth, typically between ages 4 and 10, and carries the same long-term risks as a true undescended testis — refer when identified. Annual review of a retractile testis is mandatory because 30–40% ascend during childhood (La Scala et al.). Failure to identify an ascending testis at child health reviews is a recognised clinical governance issue."},
    {tone:"teal", h:"Cancer surveillance is lifelong, even after successful surgery", html:"Undescended testes carry a 3–5× elevated risk of testicular cancer, and intra-abdominal testes the highest at 8–10× normal. Orchidopexy reduces but does not eliminate the risk — it remains about 2× normal, and the contralateral normally-descended testis is also slightly elevated in unilateral disease. Teach monthly testicular self-examination from puberty; testicular cancer is the commonest cancer in UK men aged 15–35. Any hard, irregular, painless scrotal or inguinal mass → 2WW urology, regardless of whether orchidopexy was performed."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step contains a genuine neonatal emergency.",
  pathway:[
    {title:"Screen for emergencies and can't-miss associations", html:"Bilateral non-palpable testes + hypospadias in a neonate → same-day paediatrics (DSD; urgent sex chromosome analysis). Bilateral non-palpable testes at any age → urgent paediatrics (anorchia, DSD, CAH in a 46XX infant). Sudden pain in the inguinal canal or abdomen where the testis lies → 999 (torsion of an undescended testis — higher risk than a scrotal testis). Unilateral undescended testis + hypospadias → urgent paediatrics for DSD work-up. Firm inguinal mass in an older boy or adult with a history → 2WW urology. Man over 18 (&gt;18y) with known untreated disease and new symptoms → 2WW urology.", alert:true},
    {title:"Confirm the diagnosis and differentiate the type", html:"True undescended testis (cannot be manipulated into the scrotum) needs surgery by 12–18 months. Retractile testis (can be milked into the scrotum, returns spontaneously when relaxed, cremasteric hyperactivity) needs watchful waiting and annual review. Ascending testis (previously scrotal, ascends age 4–10) is treated as undescended. Ectopic testis (femoral pouch, perineal, base of penis) needs surgery. Atrophic or anorchic (vanishing testis from intrauterine torsion) → prosthesis and hormonal monitoring. Checked at the newborn physical examination (NIPE) and the 6–8-week check; refer if still undescended at 3 months."},
    {title:"Classify by position and palpability", html:"Palpable (80%) — inguinal canal, superficial inguinal pouch or high scrotal: open orchidopexy, success rate over 95%. Non-palpable (20%) — intra-abdominal (50%), intracanalicular (30%), atrophic or absent (20%): requires laparoscopy for diagnosis and treatment. Intra-abdominal carries the highest malignancy risk. Bilateral (10%) needs karyotype and endocrine assessment."},
    {title:"Examine properly, investigate selectively", html:"Warm room, warm hands, relaxed child. Inspect for hemiscrotal hypoplasia; milk down from the internal ring; do the mobility test; check the contralateral testis for compensatory hypertrophy (length over 20 mm suggests an absent or atrophic testis); look for hypospadias, micropenis or bifid scrotum; check for a hernia (patent processus vaginalis in over 90%); Tanner-stage older boys. Investigations are selective — do not request an ultrasound and wait. Tumour markers (AFP, βhCG, LDH) before referral in an adult or adolescent with suspected malignancy."},
    {title:"Refer on time, then run the surveillance", html:"Refer by 3–4 months for orchidopexy at 12–18 months; refer an ascending testis when identified. Retractile: annual GP review until puberty, documenting position each time. Post-orchidopexy: 6-week review, pubertal check, then lifelong self-examination advice."}
  ],
  sections:[
    {id:"severe", nav:"Emergencies", title:"Screen for emergencies and can't-miss associations", sub:"Most undescended testes are not emergencies, but certain presentations require urgent action — particularly in neonates, and when associated with DSD or torsion.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Bilateral undescended testes in a neonate", html:"Non-palpable bilaterally + hypospadias → same-day paediatrics. Disorder of sex development (DSD) — sex chromosome analysis urgent."},
         {tone:"red", h:"🔴 Bilateral non-palpable testes", html:"Both testes absent → urgent paediatrics. Anorchia, DSD, or congenital adrenal hyperplasia in a 46XX infant — life-threatening salt-wasting crisis risk."},
         {tone:"red", h:"🔴 Acute pain at the undescended-testis site", html:"Sudden pain in the inguinal canal or abdomen where the testis lies → 999 emergency. Torsion of an undescended testis — higher risk than a scrotal testis."},
         {tone:"amber", h:"🟠 Unilateral undescended testis + hypospadias", html:"A combined defect in a neonate → urgent paediatrics. DSD work-up required."},
         {tone:"purple", h:"🟣 Mass in the inguinal canal <span class='tw'>2WW</span>", html:"Palpable firm mass in an older boy or adult with a history of undescended testis → 2WW urology. Testicular malignancy — 3–5× higher risk in undescended testes.", src:"NICE NG12"},
         {tone:"purple", h:"🟣 Late presentation in an adult <span class='tw'>2WW</span>", html:"Man over 18 (&gt;18y) with known untreated undescended testis + new symptoms → 2WW urology. Malignancy risk elevated; orchidectomy is often recommended.", src:"NICE NG12"}
       ]},
       {b:"why", html:"Bilateral non-palpable undescended testes with genital ambiguity in a neonate must be treated as a DSD until proven otherwise — this includes the possibility of congenital adrenal hyperplasia in a 46XX female, which carries life-threatening salt-wasting crisis risk. The EAU/ESPU guidelines state that all bilateral impalpable testes with a genital anomaly require urgent endocrine and genetic assessment. Undescended testes carry a 3–5× elevated risk of testicular cancer — men with late-treated or untreated disease must have lifelong cancer surveillance."}
     ]},

    {id:"diagnose", nav:"Distinguish", title:"Confirm the diagnosis and differentiate the types", sub:"Distinguishing a true undescended testis from a retractile one is the key decision — it determines whether intervention is needed at all.",
     blocks:[
       {b:"table", head:["Type","Features","Action"], rows:[
         ["<b>True undescended testis (cryptorchidism)</b>","Cannot be manipulated into the scrotum by examination; remains in an ectopic position","<b>Requires surgical treatment by age 12–18 months</b>"],
         ["<b>Retractile testis</b>","Can be milked into the scrotum manually; returns spontaneously when relaxed; cremasteric hyperactivity","<b>Watchful waiting — most resolve by puberty. Review annually</b>"],
         ["<b>Ascending testis</b>","<b>A previously scrotal testis ascends with growth; seen age 4–10 years</b>","Requires treatment as per undescended testis. Distinguish from retractile on examination"],
         ["<b>Ectopic testis</b>","The testis has deviated from the normal path of descent — femoral pouch, perineal, base of penis. Usually palpable","<b>Surgical treatment required</b>"],
         ["<b>Atrophic / anorchic</b>","Absent testis on ultrasound or at surgery. Vanishing testis (intrauterine torsion)","<b>Prosthesis and hormonal monitoring offered</b>"],
         ["<b>NHS newborn screening</b>","Checked at the newborn physical examination (NIPE) and the 6–8-week check","Refer if still undescended at 3 months (allows time for spontaneous descent)"]
       ]},
       {b:"why", html:"The retractile versus true undescended testis distinction prevents unnecessary surgery. Up to 80% of undescended testes present at birth descend spontaneously in the first 3 months — most are retractile. Spontaneous descent after 6 months is rare; therefore intervention is recommended by 12–18 months (BAUS/ESPU 2024). Ascending testes are increasingly recognised — previously in the scrotum at NIPE but ascending during childhood — and carry the same long-term risks as a true undescended testis. Annual review of retractile testes is mandatory as 30–40% ascend during childhood (La Scala et al.)."}
     ]},

    {id:"classify", nav:"Classify", title:"Classification by position and palpability", sub:"Position determines the surgical approach and the prognosis for fertility and cancer risk.",
     blocks:[
       {b:"table", head:["Category","Detail","Implication"], rows:[
         ["<b>Palpable (80%)</b>","Can be felt in the inguinal canal or superficial inguinal pouch. Positions: high scrotal, inguinal, superficial inguinal pouch","<b>Orchidopexy success rate over 95%</b>"],
         ["<b>Non-palpable (20%)</b>","Cannot be felt on examination. May be intra-abdominal (50%), intracanalicular (30%), or atrophic/absent (20%)","<b>Requires laparoscopy for diagnosis and treatment</b>"],
         ["<b>Intra-abdominal</b>","<b>Above the internal inguinal ring</b>","Highest malignancy risk. Staged or primary orchidopexy, laparoscopic approach"],
         ["<b>Inguinal canal</b>","<b>Between the internal and external rings — the most common position</b>","<b>Open orchidopexy is the standard treatment</b>"],
         ["<b>Superficial inguinal pouch (Denis Browne pouch)</b>","Below the external ring, lateral to the scrotum — often mistaken for scrotal","<b>Orchidopexy straightforward</b>"],
         ["<b>Bilateral (10%)</b>","<b>Higher association with DSD and hormonal deficiency</b>","<b>Requires karyotype + endocrine assessment</b>"]
       ]},
       {b:"why", html:"Classification guides surgical planning: non-palpable disease requires diagnostic laparoscopy rather than open inguinal exploration, as intra-abdominal testes need a different surgical approach. Malignancy risk correlates with position — intra-abdominal testes have the highest cancer risk (8–10× normal). Knowing the position also informs the prognosis for fertility: the higher the position, the greater the germ-cell damage and the lower the eventual sperm count (Lee &amp; Coughlin, 2001). Early orchidopexy (before 12–18 months) significantly improves fertility outcomes and reduces cancer risk."}
     ]},

    {id:"exam", nav:"Examination", title:"Targeted examination", sub:"Examine in a warm room, with warm hands, with the child relaxed (ideally supine then cross-legged). The cremasteric reflex is hypersensitive in young children — warmth reduces false elevation.",
     blocks:[
       {b:"table", head:["What","How / finding","Significance"], rows:[
         ["<b>Scrotum inspection</b>","<b>Poorly developed or hypoplastic hemiscrotum on the affected side</b>","Confirms an undescended testis. Bilateral hypoplasia → bilateral disease or DSD"],
         ["<b>Inguinal canal palpation</b>","<b>Milk from the internal ring downwards; feel for a soft ovoid structure</b>","Palpable testis → can it be brought towards the scrotum? True undescended versus retractile"],
         ["<b>Mobility test</b>","Can the testis be guided to mid-scrotum without tension? Yes → retractile (no surgery). No → true undescended testis (refer). Does it remain after release? A retractile testis will spring back","<b>The single most important manoeuvre on this page</b>"],
         ["<b>Contralateral testis</b>","Compensatory hypertrophy (length over 20 mm) measured with an orchidometer","<b>Suggests an absent or atrophic contralateral testis</b>"],
         ["<b>Genital anomalies</b>","<b>Hypospadias, micropenis, bifid scrotum</b>","<b>DSD work-up. Document carefully</b>"],
         ["<b>Inguinal hernia</b>","<b>Cough impulse, reducible swelling</b>","An associated patent processus vaginalis is present in over 90% — it will be repaired at the same operation"],
         ["<b>Pubertal staging</b>","<b>Tanner staging in older boys</b>","Bilateral disease with delayed puberty → hypogonadism (Klinefelter's, Kallmann's)"],
         ["<b>Adult presentation</b>","<b>Examine standing. A hard or irregular mass in the inguinal region</b>","<b>Malignancy until proven otherwise → 2WW</b>"]
       ]},
       {b:"why", html:"The examination is the most important diagnostic tool — imaging rarely adds to a careful clinical examination for palpable testes. The mobility test is key: a testis that can be placed in the scrotum and REMAINS there after release is retractile; one that springs back or cannot reach the scrotum is a true undescended testis. Contralateral compensatory hypertrophy is a reliable surrogate for an absent or atrophic testis (Eaton et al., sensitivity 71%, specificity 95%) — reducing the need for imaging to confirm absence. In older men, any firm irregular inguinal mass with a history of undescended testis is malignancy until proven otherwise."}
     ]},

    {id:"workup", nav:"Work-up", title:"Investigations — selective, and never a reason to delay", sub:"Most undescended testes are diagnosed clinically. Over-investigation delays referral.",
     blocks:[
       {b:"table", head:["Test","When","Note"], rows:[
         ["<b>Scrotal ultrasound — selective</b>","Useful to confirm the position of a palpable testis and rule out concurrent pathology","NOT reliable for intra-abdominal testes (sensitivity 45%). Do not delay referral for an ultrasound"],
         ["<b>MRI scrotum/abdomen — specialist</b>","For non-palpable disease — better than ultrasound for abdominal location","<b>Requested by urology or paediatric surgery, not primary care</b>"],
         ["<b>Karyotype + hormones — bilateral cases</b>","LH, FSH, testosterone, inhibin B, AMH (age-specific reference ranges), plus karyotype","<b>Ordered by paediatric endocrinology or urology</b>"],
         ["<b>hCG stimulation test</b>","A rise in testosterone confirms functional testicular tissue. For bilateral non-palpable disease","<b>Specialist investigation</b>"],
         ["<b>Tumour markers — adult/teen</b>","AFP, βhCG, LDH if an adult or adolescent has suspected malignancy in the undescended-testis position","<b>Order before referral</b>"],
         ["<b>NOT needed routinely</b>","CT/MRI is not indicated in primary care. Bone age and gonadotrophins only if delayed puberty or DSD is suspected","<b>Do not request an ultrasound and wait — refer directly</b>"]
       ]},
       {b:"cards", items:[
         {tone:"purple", h:"NG12 — testicular cancer, and the lifelong duty <span class='tw'>2WW</span>", html:"This page has a direct NICE NG12 criterion, and it is the reason surveillance never stops:<br>• A non-painful enlargement or change in shape or texture of the testis → suspected testicular cancer pathway referral, with direct-access ultrasound where the local pathway specifies it.<br>• Any hard, irregular, painless scrotal or inguinal mass in a man with a history of undescended testis → 2WW urology, regardless of whether orchidopexy was performed — the risk is reduced by surgery, not removed.<br>• A firm inguinal mass in an older boy or adult with a history of undescended testis, or a man over 18 with known untreated disease and new symptoms → 2WW urology.<br>Undescended testis carries a 3–5× elevated cancer risk overall (8–10× if intra-abdominal), and testicular cancer is the commonest cancer in UK men aged 15–35.", src:"NICE NG12 (updated May 2025) · house rule"}
       ]},
       {b:"why", html:"BAUS and ESPU guidelines explicitly state that ultrasound should not be used to confirm or exclude an intra-abdominal undescended testis — its sensitivity is only 45% for this location (Tasian et al., 2011). Diagnostic laparoscopy is the gold standard for non-palpable disease. Requesting an ultrasound in primary care can falsely reassure and delay appropriate surgical exploration. For bilateral disease in neonates, AMH (anti-Müllerian hormone) is the most sensitive marker for the presence of testicular tissue and guides DSD work-up — but this is ordered by the specialist, not primary care. The GP's role is to refer promptly and appropriately."}
     ]},

    {id:"treat", nav:"Treat", title:"Treatment pathways", sub:"The primary-care role is watchful waiting for a retractile testis and prompt referral for a true undescended one. Definitive treatment is surgical.",
     blocks:[
       {b:"ladder", steps:[
         {step:"GP-managed", title:"Retractile testis — watchful waiting", when:"testis remains in the scrotum after release", fromLabel:"no surgery",
          html:"Annual examination until puberty. Reassure parents. Most resolve spontaneously. Refer if it ascends."},
         {step:"Palpable", title:"True undescended testis — orchidopexy at 12–18 months", when:"cannot be placed in the scrotum", fromLabel:"refer by 3–4 months",
          html:"Open inguinal orchidopexy, with concurrent hernia repair (a patent processus vaginalis is present in over 90%). Day-case surgery."},
         {step:"Non-palpable", title:"Laparoscopy ± orchidopexy", when:"testis not felt", fromLabel:"staged if needed",
          html:"Diagnostic laparoscopy → orchidopexy if viable. Staged Fowler-Stephens procedure if high intra-abdominal. Prosthesis if absent."},
         {step:"Not recommended", title:"Hormonal treatment — hCG or GnRH analogues", when:"", fromLabel:"",
          html:"NOT recommended as primary treatment (ESPU/BAUS 2024). Descent rates below 20%, inferior to surgery. May be used in specific DSD contexts by a specialist only."},
         {step:"Adult", title:"Orchidopexy versus orchidectomy", when:"untreated disease in adulthood", fromLabel:"shared decision",
          html:"Decision shared with the patient: orchidopexy allows surveillance, orchidectomy removes cancer risk. Both options are valid — a specialist decision after ultrasound or MRI."}
       ]},
       {b:"kv", rows:[
         ["Post-operative care","Wound care, analgesia (paracetamol + ibuprofen). Return to school in 1–2 weeks. Avoid contact sports for 4 weeks. GP review at 6 weeks"]
       ]},
       {b:"why", html:"Orchidopexy before 12–18 months is the current evidence-based recommendation (ESPU/EAU 2024, BAUS 2023). Earlier surgery correlates with better germ-cell preservation — histological studies show progressive germ-cell loss with increasing age. Hormonal therapy (hCG/GnRH) is no longer recommended as primary treatment because of poor efficacy (under 20% descent) and potential adverse effects on germ cells (apoptosis observed in animal models). For adult men with untreated disease, the decision between orchidopexy (allowing continued surveillance) and orchidectomy (eliminating cancer risk) is complex and must be individualised — BAUS recommends referral for specialist counselling."},
       {b:"say", html:"At the moment his testis isn't sitting where it should. We'll check again shortly, because many settle on their own in the first three months — but if it hasn't by then, I'll refer him so the small operation can be done before his first birthday or soon after. That timing protects fertility and makes future checks easier."}
     ]},

    {id:"refer", nav:"Refer", title:"Referral criteria and timing", sub:"Timing is the whole point — the referral clock starts at the 3-month check, not at symptoms.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same-day paediatrics", html:"Bilateral undescended testes + hypospadias in a neonate (possible DSD/CAH). Acute pain in the undescended-testis position (torsion)."},
         {tone:"red", h:"Urgent paediatrics (within days)", html:"Bilateral non-palpable testes at any age · bilateral disease with ambiguous genitalia · suspected DSD."},
         {tone:"amber", h:"Routine paediatric surgery / urology", html:"Undescended testis confirmed at the 3-month GP check (allowing the spontaneous-descent window). Refer by age 3–4 months for operation by 12–18 months. Ascending testis — refer when identified."},
         {tone:"purple", h:"2WW urology (adult/teen) <span class='tw'>NG12</span>", html:"Adult with untreated undescended testis + a new mass or symptoms · raised AFP or βhCG · any solid inguinal mass with a history of undescended testis.", src:"NICE NG12"},
         {tone:"blue", h:"Routine urology (adult)", html:"Adult with known undescended testis requesting orchidopexy or orchidectomy counselling · fertility concerns."},
         {tone:"green", h:"Annual review (GP)", html:"Retractile testis: review annually until puberty. Document testicular position at each appointment. Refer if it ascends or cannot be placed in the scrotum."}
       ]},
       {b:"why", html:"Timing of referral is critical — orchidopexy before 12–18 months significantly improves fertility outcomes and may reduce cancer risk (Pettersson et al., NEJM 2007, showed late orchidopexy after 13 years still carries elevated cancer risk). The NHS Newborn Physical Examination Programme mandates documentation at NIPE and the 6-week check. GPs are responsible for identifying ascending testes at routine child health reviews — failure to refer delays treatment beyond the optimal window."}
     ]},

    {id:"lifestyle", nav:"Counselling", title:"Education, counselling and long-term support", sub:"Parental anxiety is high, and the surveillance conversation has to land — it lasts a lifetime.",
     blocks:[
       {b:"table", head:["Topic","What to do","Why"], rows:[
         ["<b>Parental education</b>","Explain the difference between a retractile and a true undescended testis. Reassure about retractile. Explain why surgery is needed for a true undescended testis by 18 months","Prevents unnecessary worry and inappropriate pressure to refer all retractile cases"],
         ["<b>Cancer surveillance (lifelong)</b>","Men with a history of undescended testis have an elevated lifetime cancer risk. Teach monthly testicular self-examination at puberty. Report any new lumps promptly — do not wait","<b>Even after successful orchidopexy the risk remains about 2× normal</b>"],
         ["<b>Fertility counselling</b>","Bilateral disease: inform about potential subfertility risk. Semen analysis in adulthood if fertility is a concern; early referral to fertility services if abnormal","<b>Early discussion enables informed family planning</b>"],
         ["<b>Psychological support</b>","Adolescent boys: address body-image concerns about an underdeveloped scrotum or a testicular prosthesis. Refer CAMHS if there is significant distress","The psychological impact of genital surgery and altered appearance in adolescence is well documented"],
         ["<b>Sports and activity</b>","After orchidopexy: avoid contact sports and cycling for 4 weeks; no restrictions thereafter. A protective cup for contact sport is encouraged","Practical and reassuring"],
         ["<b>School / nursery notification</b>","Brief absence post-surgery (1–2 weeks). Provide a fit note for parents or carers, and a letter stating the no-PE period","Avoids repeat appointments"],
         ["<b>Follow-up instructions</b>","Retractile testis: bring the child annually until age 12–13. Any change in position → book a GP appointment. Confirm the testis is in the scrotum at each annual check","The mechanism that catches ascent"],
         ["<b>Hormone health</b>","Bilateral disease or anorchia: refer paediatric endocrinology for puberty monitoring. Testosterone replacement may be needed. Klinefelter's — fertility counselling","Prevents missed hypogonadism"]
       ]}
     ]},

    {id:"monitor", nav:"Monitor", title:"Follow-up, monitoring and long-term surveillance", sub:"The GP's responsibility continues even when the surgery happened decades ago.",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["<b>Retractile testis — GP review</b>","<b>Annually until puberty</b>","Document: can the testis be placed in the scrotum, and does it remain? Refer if ascending or the position is uncertain"],
         ["<b>Post-orchidopexy</b>","<b>6 weeks</b>","Wound healed? Testis palpable in the scrotum? Recurrent ascent → re-refer urology. Reassure: the re-ascent rate is under 5%"],
         ["<b>Post-orchidopexy — puberty</b>","<b>At pubertal onset</b>","Confirm testicular growth. Refer endocrinology if there is no pubertal development by 14 years (bilateral disease)"],
         ["<b>Adult surveillance (lifelong)</b>","<b>Ongoing</b>","Advise annual — ideally monthly — testicular self-examination; 2WW referral for any new lump. Continue even if orchidopexy was performed in childhood"],
         ["<b>Fertility review (adult)</b>","<b>Age 20–25</b>","Offer semen analysis for men with a history of bilateral disease, or if a fertility concern is raised. Refer andrology if abnormal"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"📞 999", html:"Acute severe inguinal or abdominal pain after surgery, or in a known undescended testis → torsion. Any post-operative wound dehiscence or bleeding."},
         {tone:"amber", h:"🟠 Same-day GP", html:"Post-operative fever, wound infection, scrotal haematoma. Inability to find the testis at the 6-week check."},
         {tone:"purple", h:"🟣 Malignancy safety net <span class='tw'>2WW</span>", html:"Any hard, irregular, painless scrotal or inguinal mass → 2WW urology, regardless of the history of undescended testis and whether orchidopexy was performed.", src:"NICE NG12"}
       ]},
       {b:"why", html:"Long-term surveillance is the GP's ongoing responsibility even if surgery was performed in childhood. NICE NG12 and BAUS guidelines note that orchidopexy reduces but does not eliminate cancer risk — the contralateral normally-descended testis also has slightly elevated risk in men with unilateral disease. The NIPE programme requires GP awareness of follow-up; failure to identify an ascending testis at child health reviews is a recognised clinical governance issue. Informing young men of their elevated cancer risk and teaching testicular self-examination empowers early detection — testicular cancer is the most common cancer in men aged 15–35 in the UK."}
     ]},

       {tone:"cream", h:"Classic scenario", html:"A mother brings her 7-month-old son. At the newborn check both testes were documented as present, but she now cannot feel the left one when bathing him. She has read online about cancer risk and wants \u201ca scan today\u201d. On examination the right testis is scrotal; the left is palpable in the superficial inguinal pouch and can be brought halfway down, but springs straight back on release."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Examines with <b>warm hands in a warm room</b> and performs the <b>mobility test</b>, correctly concluding this is <b>not retractile</b> (it does not remain after release) but a <b>true undescended — likely ascending — testis</b>; explains why an <b>ultrasound is not the answer and must not delay referral</b> (45% sensitivity, laparoscopy is the gold standard for non-palpable); <b>refers to paediatric surgery now</b>, targeting orchidopexy by 12–18 months; checks for <b>hypospadias and hernia</b>; addresses the mother's cancer concern honestly with the <b>3–5× risk and the lifelong self-examination duty</b>; and safety-nets <b>acute groin pain as torsion</b>."}
