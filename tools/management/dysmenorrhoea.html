MG.render({
  icon:"🩸",
  title:"Dysmenorrhoea — the complete guide",

  stemTitle:"Period pain with a typical primary pattern and a good response to a correctly timed NSAID supports primary dysmenorrhoea; pain that began years later, or is getting worse, or does not respond, is a diagnosis you have not made yet",
  stemSub:"This page is the whole of dysmenorrhoea — the differential reasoning and the management: the history that separates primary from secondary, the treatment ladder with actual doses and how long to review each step, what to examine and when to image, and the point that matters more than any of it — <b>a normal examination, ultrasound or MRI does not exclude endometriosis</b>, and a normal scan should not stop treatment or referral when symptoms persist, recur or affect daily life.",
  guideline:"NICE NG73 (2017, updated 2024) · NICE NG88 · NICE NG12 (updated April 2026) · FSRH CHC guideline · UKMEC",
  reviewed:"12 September 2026",
  nextReview:"12 March 2027",
  meta:[
    {t:"NICE NG73 — endometriosis: diagnosis and management"},
    {t:"NICE NG88 — heavy menstrual bleeding"},
    {t:"FSRH CHC guideline · current UKMEC"},
    {t:"Normal USS does NOT exclude endometriosis", tone:"tw"},
    {t:"v1.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#safety"><b>Red flags</b><small>Torsion · PID · NG12</small></a><a href="#classify"><b>Primary or secondary</b><small>The whole question</small></a><a href="#assess"><b>Assess</b><small>Examine · image</small></a><a href="#treat"><b>Treat</b><small>NSAID → hormonal</small></a><a href="#refer"><b>Refer</b><small>NG73 thresholds</small></a></div>',
  quickSub:"The six that change outcomes. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"blue", h:"Primary dysmenorrhoea has a recognisable shape", html:"Usually starts within the first few years after menarche, once cycles become ovulatory · begins with or just before the bleed and lasts 8–72 hours · cramping suprapubic pain, often with backache, thigh ache, nausea, diarrhoea or headache · no pain at other times in the cycle · normal examination. It is caused by prostaglandin-driven myometrial contraction and uterine ischaemia — which is why an NSAID is often particularly useful, although paracetamol or an NSAID, alone or combined, are both reasonable first-line options (NG73). A typical primary pattern with good response to a correctly timed NSAID supports primary dysmenorrhoea; poor response, treatment failure or a changing pattern should prompt reassessment for secondary causes."},
    {tone:"amber", h:"Secondary dysmenorrhoea — the features that change the plan", html:"Onset years after menarche · pain starting days BEFORE the bleed or persisting after it · deep dyspareunia · dyschezia or cyclical bowel or bladder symptoms · heavy or irregular bleeding · subfertility · pain no longer responding to what used to work. Any of these means look for endometriosis, adenomyosis, fibroids, PID, an ovarian cyst or a device problem — a new or escalating pattern is never dismissed as \"just periods\"."},
    {tone:"red", h:"⛔ A normal ultrasound does not exclude endometriosis", html:"A normal examination, ultrasound or MRI does not exclude endometriosis. A normal scan should not stop treatment or referral when symptoms persist, recur or affect daily life. Ultrasound is useful for endometriomas, deep endometriosis and alternative pathology, but a normal result does not exclude superficial or other endometriosis. Laparoscopy may be considered when symptoms persist despite empirical treatment, treatment is unsuitable, or a definitive diagnosis or operative treatment is needed; discuss its benefits and risks — not every patient requires diagnostic laparoscopy."},
    {tone:"blue", h:"The treatment ladder, with real doses", html:"First: paracetamol or an NSAID, taking account of comorbidities and patient preference. An NSAID is often particularly useful: start at or just before the onset of pain and take regularly for 2–3 days — mefenamic acid 500 mg TDS, naproxen 500 mg then 250 mg every 6–8 hours, or ibuprofen 400 mg TDS; check maximum daily dose, cautions and current product information. <b>Tailor the review interval to the intervention: analgesia over about 2–3 cycles; an LNG-IUS needs at least 6 cycles.</b> Then a combined hormonal contraceptive after UKMEC review — continuous or extended regimens are established options — or a progestogen."},
    {tone:"green", h:"Continuous or extended CHC — an established option", html:"FSRH supports tailored CHC regimens: 21 active days then a 4-day hormone-free interval; tricycling for 9 weeks then a 4- or 7-day interval; flexible extended use until 3–4 days of breakthrough bleeding, then a 4-day break; or continuous use. For flexible extended use, take active hormones for at least 21 consecutive days before a 4-day hormone-free interval is considered. Breakthrough bleeding is common initially. Removing the withdrawal bleed may reduce associated symptoms, but not all pelvic pain is caused by the hormone-free interval, particularly in established endometriosis. Alternatives: <b>LNG-IUS</b>, <b>desogestrel</b>, or <b>depot medroxyprogesterone</b>."},
    {tone:"purple", h:"🟣 NICE NG12 (updated April 2026) — the routes that run through pelvic pain", html:"Ovarian cancer: aged 40 or over with persistent or frequent (particularly more than 12 times a month) abdominal distension or bloating, early satiety or loss of appetite, pelvic or abdominal pain, or increased urinary urgency or frequency → measure CA-125; urgent direct-access ultrasound if it is at or above the age-specific threshold (≥35 IU/mL at 40–49, ≥31 at 50–59, ≥24 at 60–69, ≥25 at 70–79, ≥31 at 80 and over). Aged 39 or under — the usual dysmenorrhoea age group — do not rely on CA-125 alone (endometriosis raises it too); consider urgent direct-access ultrasound for persistent symptoms. Ascites or a pelvic or abdominal mass not obviously fibroids → urgent suspected ovarian cancer referral. Ultrasound suggesting ovarian cancer → suspected cancer pathway referral; if CA-125 is below the threshold or ultrasound is normal, investigate other causes and safety-net — the threshold is an age-based pathway threshold, not a diagnostic rule-out value. Cervical cancer: an appearance of the cervix consistent with cervical cancer on examination → consider a suspected cancer pathway referral, regardless of a recent normal smear. Endometrial cancer: unexplained post-menopausal bleeding aged 55 or over, not attributable to HRT → suspected cancer pathway referral; under 55 → consider referral. Restated in <a href='#refer'>Refer</a>."}
  ],
  pathwaySub:"Five steps. Almost all the diagnostic value is in the first two.",
  pathway:[
    {title:"Exclude the acute cause", html:"Sudden severe unilateral pain with vomiting → torsion. Pain with fever, discharge or cervical excitation → PID. Perform a pregnancy test whenever pregnancy is possible in a patient with pelvic pain, regardless of contraceptive use.", alert:true},
    {title:"Decide: primary or secondary?", html:"Age at onset relative to menarche · timing within the cycle · pain outside menstruation · impact on education, work and daily life · fertility priorities · deep dyspareunia · dyschezia and cyclical bowel or bladder symptoms · bleeding pattern · subfertility · whether previously effective treatment has stopped working."},
    {title:"Examine — and say why you are offering it", html:"Offer abdominal and, where appropriate and acceptable to the patient, pelvic/internal examination. Explain the purpose, obtain consent and offer a chaperone. If internal examination is declined or unsuitable, perform an abdominal examination and do not delay treatment or referral. Do not make pelvic examination a prerequisite for treatment. Look for fixed or tender uterus, nodularity, adnexal masses and an abnormal cervix."},
    {title:"Treat empirically while investigating", html:"NSAID regularly for the first 2–3 days of the bleed; then a continuous or tricycled CHC, or an LNG-IUS or progestogen-only option. <b>Tailor the review interval to the intervention. If endometriosis is suspected, offer transvaginal ultrasound even if examination is normal, and arrange imaging, treatment and referral in parallel. Do not withhold treatment pending a diagnosis.</b>"},
    {title:"Refer on the NG73 thresholds, not on the scan", html:"Refer to gynaecology where symptoms affect daily activities, are persistent or recurrent, initial treatment is ineffective, not tolerated or contraindicated, pelvic signs are present, fertility is a priority, or imaging is normal but clinical suspicion remains — regardless of imaging."}
  ],
  sections:[

    {id:"safety", nav:"Red flags", title:"Red flags — the acute causes and the cancer routes",
     blocks:[
       {b:"table", head:["Feature","Meaning","Action"], rows:[
         ["<b>Sudden severe unilateral pelvic pain with nausea and vomiting</b>","<b>Ovarian torsion</b> — an emergency; delay may compromise ovarian viability","Urgent same-day gynaecological assessment. Do not delay for an outpatient ultrasound pathway"],
         ["<b>Any possibility of pregnancy with pelvic pain</b>","<b>Ectopic pregnancy</b>","Perform a pregnancy test whenever pregnancy is possible in a patient with pelvic pain, regardless of contraceptive use. Positive test with pain, syncope or bleeding → urgent early-pregnancy assessment; haemodynamic instability → emergency care"],
         ["Fever, purulent or offensive discharge, deep dyspareunia, cervical excitation, raised inflammatory markers","<b>Pelvic inflammatory disease</b> — treat on clinical suspicion; delay causes tubal damage and infertility","Empirical antibiotics per the current local PID pathway and STI screening without waiting for results. Same-day hospital assessment for severe illness, suspected tubo-ovarian abscess, pregnancy, a surgical emergency not excluded, inability to tolerate oral treatment or diagnostic uncertainty. See <a href='pelvic-inflammatory-disease.html'>PID</a>"],
         ["Persistent abdominal distension or bloating, early satiety, pelvic pain or urinary urgency — aged 40 or over, particularly occurring more than 12 times a month","<b>Ovarian cancer.</b> The symptoms are non-specific and routinely attributed to IBS or the menopause","NICE NG12 (updated April 2026): measure CA-125 and compare with the age-specific threshold (≥35 IU/mL at 40–49, ≥31 at 50–59, ≥24 at 60–69, ≥25 at 70–79, ≥31 at 80+) → urgent direct-access ultrasound if at or above it. Aged 39 or under: do not use CA-125 in isolation — consider urgent direct-access ultrasound. Ascites or a pelvic mass → urgent suspected cancer referral directly. Ultrasound suggesting ovarian cancer → suspected cancer referral; CA-125 below threshold or normal ultrasound → investigate other causes and safety-net (the threshold is not a rule-out value)"],
         ["<b>Cervix that looks or feels abnormal on examination</b>","<b>Cervical cancer</b>","Consider a suspected cancer pathway referral (NICE NG12, updated April 2026) — and do NOT be reassured by a recent normal smear, which screens rather than diagnoses"],
         ["<b>Post-coital, intermenstrual or post-menopausal bleeding with pain</b>","<b>Cervical or endometrial pathology</b>","Examine the cervix. Unexplained post-menopausal bleeding aged 55 or over, not attributable to HRT → suspected endometrial cancer pathway referral; under 55 → consider referral (NICE NG12, updated April 2026)"],
         ["Severe dysmenorrhoea from the very first period, with obstructed flow, a pelvic mass or primary amenorrhoea","Obstructive Müllerian anomaly — imperforate hymen, transverse vaginal septum, obstructed hemivagina","Urgent paediatric or adolescent gynaecology referral. Pain beginning with the first periods, particularly if severe, progressively worsening, associated with obstructed flow or accompanied by primary amenorrhoea, warrants assessment for an obstructive Müllerian anomaly or endometriosis. Do not assume that all early-onset pain is secondary"],
         ["New pain in a woman with an IUD, particularly within weeks of insertion","<b>Malposition, partial expulsion, perforation or PID</b>","<b>Examine for threads and arrange ultrasound; screen for infection</b>"]
       ]},
       {b:"warn", html:"<b>The failure in this presentation is almost never over-investigation.</b> It is a woman told for years that severe period pain is normal, given paracetamol, never examined, never offered a continuous hormonal regimen, and discharged on a normal scan. Two habits close most of the gap: ask how much school, work or life the pain costs, and treat a normal scan as uninformative rather than reassuring."}
     ]},

    {id:"classify", nav:"Primary or secondary", title:"Primary or secondary — the distinction that drives everything",
     blocks:[
       {b:"table", head:["","Primary dysmenorrhoea","Secondary dysmenorrhoea"], rows:[
         ["<b>Onset</b>","<b>Usually within the first few years after menarche, once cycles become ovulatory</b>","<b>Years after menarche, often in the 20s–40s</b>"],
         ["<b>Timing</b>","<b>Begins with or hours before the bleed; lasts 8–72 hours</b>","Often starts days BEFORE the bleed and may persist after it, or be present acyclically"],
         ["<b>Trajectory</b>","<b>Stable or improves with age and after childbirth</b>","Progressive — and \"my usual treatment has stopped working\" is a red flag in itself"],
         ["<b>Associated features</b>","Nausea, diarrhoea, backache, thigh ache, headache — the prostaglandin syndrome","Deep dyspareunia · dyschezia · cyclical bowel or bladder symptoms · heavy or irregular bleeding · subfertility"],
         ["<b>Examination</b>","<b>Normal</b>","May show a fixed or retroverted tender uterus, uterosacral nodularity, adnexal mass or enlarged uterus — but is frequently NORMAL, which excludes nothing"],
         ["<b>Causes</b>","Excess endometrial prostaglandin (PGF2α) → myometrial contraction, uterine ischaemia and pain","Endometriosis · adenomyosis · fibroids · PID and chronic pelvic infection · ovarian cysts · IUD malposition · cervical stenosis · Müllerian anomaly"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"🔍 Endometriosis — the symptom set to ask for by name", html:"Chronic pelvic pain · period pain affecting daily activities · deep dyspareunia · period-related or cyclical bowel symptoms, especially painful defecation · period-related or cyclical urinary symptoms, including haematuria · infertility with any of these. <b>NG73 says suspect endometriosis on this symptom set alone</b> — imaging is for planning, not for permission. Cyclical dyschezia, dysuria or haematuria are important symptoms that should raise suspicion of endometriosis, particularly deep disease, but are not diagnostic; deep dyspareunia is strongly suggestive but not specific. Offer transvaginal ultrasound to all with suspected endometriosis, even if examination is normal — it is not a gatekeeper test for gynaecology."},
         {tone:"blue", h:"🔍 Adenomyosis — the one that gets missed after endometriosis", html:"Heavy, painful periods with a diffusely enlarged, boggy, tender uterus, typically in a woman in her late 30s or 40s who has had children. <b>Often coexists with endometriosis.</b> Transvaginal ultrasound or MRI can suggest it; <b>NICE NG88 recommends considering the LNG-IUS first line for heavy menstrual bleeding with suspected or diagnosed adenomyosis</b>."},
         {tone:"blue", h:"🔍 Fibroids", html:"Heavy bleeding more than pain, with bulk symptoms — pressure, frequency, a palpable mass. Acute severe pain suggests red degeneration (classically in pregnancy) or torsion of a pedunculated fibroid. Ultrasound is genuinely informative here, unlike in superficial endometriosis."},
         {tone:"green", h:"👧 Adolescents", html:"Primary dysmenorrhoea is very common and treatable: NSAID plus, if needed, a CHC — and a CHC may be given for pain regardless of sexual activity. Discuss the acceptability of examination sensitively with the young person and, where appropriate, their parent or carer; do not make pelvic examination a prerequisite for treatment. Pain beginning with the first periods, particularly if severe, worsening, with obstructed flow or primary amenorrhoea, warrants assessment for an obstructive anomaly or endometriosis — but do not assume all early-onset pain is secondary. Keep endometriosis in the differential when pain is severe, causes school absence, is associated with bowel or bladder symptoms, or fails to respond to NSAIDs and hormonal treatment."}
       ]}
     ]},

    {id:"assess", nav:"Assess", title:"Assessment, examination and investigation",
     blocks:[
       {b:"table", head:["Element","What to do","Why"], rows:[
         ["<b>Impact, asked explicitly</b>","\"How many days a month does this cost you — school, work, sport, plans?\" Consider a pain and bleeding diary over 2–3 cycles","The impact question is what escalates treatment and justifies referral, and it is the one most often not asked. A diary also distinguishes cyclical from acyclical pain, which is the crux of the classification"],
         ["<b>Bleeding pattern</b>","Cycle length and regularity, duration, flooding, clots, intermenstrual, post-coital or post-menopausal bleeding","Heavy bleeding with pain points to adenomyosis, fibroids or endometriosis; see <a href='menorrhagia.html'>heavy menstrual bleeding</a>"],
         ["<b>Sexual and fertility history</b>","Deep versus superficial dyspareunia, STI risk, contraception in use, plans for pregnancy","<b>Deep dyspareunia is strongly suggestive of endometriosis but not specific</b>; fertility plans change which treatment is acceptable, since most effective options are contraceptive. If trying to conceive or planning conception soon, discuss early gynaecology/fertility referral rather than waiting for a prolonged course of hormonal treatment"],
         ["<b>Bowel and bladder</b>","Cyclical painful defecation, cyclical urinary symptoms, cyclical haematuria","Cyclical dyschezia, dysuria or haematuria are important symptoms that should raise suspicion of endometriosis, particularly deep disease, but are not diagnostic — they also occur with IBS, urinary tract disease, pelvic floor dysfunction and other pelvic pathology"],
         ["<b>Examination</b>","Offer abdominal and, where appropriate and acceptable to the patient, pelvic/internal examination. Explain the purpose, obtain consent and offer a chaperone. If internal examination is declined or unsuitable, perform an abdominal examination and do not delay treatment or referral","Looking for a fixed tender uterus, uterosacral or pouch-of-Douglas nodularity, adnexal mass, enlarged boggy uterus, and an abnormal cervix. <b>A normal examination excludes nothing</b>"],
         ["<b>Investigations — targeted</b>","Pregnancy test whenever pregnancy is possible · STI screen including chlamydia and gonorrhoea NAAT if PID is possible or risk factors exist · FBC and ferritin if bleeding is heavy · urinalysis if urinary symptoms or haematuria · CRP and FBC if systemic illness or PID is suspected · CA-125 where the NG12 ovarian criteria are met","<b>No routine bloods or hormonal tests in a classical primary picture.</b> Do not use CA-125 to diagnose endometriosis, and do not request routine MRI from primary care as the primary investigation for suspected endometriosis (NG73)"],
         ["<b>Imaging</b>","Offer transvaginal ultrasound to all patients with suspected endometriosis, even if examination is normal. If transvaginal ultrasound is declined or unsuitable, consider transabdominal pelvic ultrasound. Arrange imaging, treatment and referral in parallel where appropriate","Identifies endometrioma, deep endometriosis and alternative pelvic pathology (fibroids, adenomyosis, ovarian pathology) and guides referral — it is not a gatekeeper test for access to gynaecology, and a normal result does not exclude superficial or other endometriosis. Say that to the patient when you order it, not when the result arrives"]
       ]},
       {b:"say", html:"I am arranging a scan, and I want to be clear about what it can and cannot tell us, because this is where a lot of women get let down. A scan is good at showing cysts, fibroids and changes in the muscle of the womb. It can also show endometriosis cysts and deeper endometriosis, but a normal result does not rule out endometriosis, particularly the superficial kind. So if the scan comes back normal, that will not mean nothing is wrong and it will not mean we stop. It means we treat on your symptoms and, if they continue, come back or affect your daily life, I refer you — because your symptoms are the evidence here, not the picture."}
     ]},

    {id:"treat", nav:"Treat", title:"Treatment — the ladder, with doses and trial lengths",
     sub:"Allow sufficient time to assess treatment, but tailor the review interval to the intervention and the symptoms. Treat while investigating, never after.",
     blocks:[
       {b:"table", head:["Step","Treatment","Notes"], rows:[
         ["<b>1 · Paracetamol or an NSAID — an NSAID is often particularly useful</b>","Offer paracetamol or an NSAID, alone or combined, taking account of comorbidities and patient preference. NSAID options: mefenamic acid 500 mg TDS · naproxen 500 mg initially then 250 mg every 6–8 hours · ibuprofen 400 mg TDS. Start at the onset of pain or 1–2 days before the expected bleed, and take REGULARLY for 2–3 days rather than as required. Check each regimen, including the naproxen regimen and maximum daily dose, against current UK dosing and product information","<b>Targets the prostaglandin mechanism.</b> Take with food. Before prescribing check: maximum daily dose · renal impairment · peptic ulcer or gastrointestinal bleeding · anticoagulant or antiplatelet treatment · NSAID-exacerbated respiratory disease · pregnancy, especially after 20 weeks and in the third trimester · interactions with ACE inhibitors/ARBs and diuretics. Consider a PPI where there is GI risk. A typical primary pattern with good response supports primary dysmenorrhoea; poor response, treatment failure or a changing pattern should prompt reassessment for secondary causes"],
         ["<b>2 · Hormonal — combined, continuous or extended</b>","Combined hormonal contraceptive: continuous or extended regimens are established options. For flexible extended use, take active hormones for at least 21 consecutive days before a 4-day hormone-free interval is considered; breakthrough bleeding is common initially. Choose a suitable CHC according to UKMEC, individual VTE/arterial risk, patient preference and local formulary — a levonorgestrel-containing preparation is often a reasonable first-line choice where CHC is appropriate, but no single formulation suits everyone","Removing the hormone-free interval may reduce withdrawal bleeding and associated symptoms, but not all pelvic pain is caused by it, particularly in established endometriosis. FSRH supports tailored regimens. Use the current UKMEC, and document before prescribing: blood pressure · BMI · migraine with or without aura · smoking/vaping and age · previous or current VTE · thrombophilia · hypertension · diabetes and vascular disease · breastfeeding/postpartum status · breast cancer history · liver disease · interacting enzyme-inducing drugs · family history where relevant. Migraine with aura is UKMEC 4 for CHC; migraine without aura is generally UKMEC 2 for initiation but may be UKMEC 3 if it develops after starting CHC"],
         ["<b>3 · Hormonal alternatives</b>","LNG-IUS (52 mg) — offer where bleeding is heavy, adenomyosis is suspected, contraception is desired or a long-acting progestogen is preferred · desogestrel 75 µg OD continuously · depot medroxyprogesterone 150 mg IM every 13 weeks · progestogen-only pill or implant","LNG-IUS: explain that irregular bleeding is common initially, may last 3–6 months or longer than 6 months, and that pain and bleeding benefit may take at least 6 cycles to assess. <b>Depot medroxyprogesterone: it is a contraceptive and may suppress menstruation; it may delay return to fertility after stopping; consider individual bone-health risk, especially in adolescents and people with other osteoporosis risk factors.</b> It is not automatically contraindicated in every adolescent but requires informed discussion; routine DXA is not required for every young person using it"],
         ["<b>4 · Where contraception is not wanted</b>","Norethisterone 5 mg TDS from day 5 to day 26 is an off-label cycle-control regimen, is NOT contraceptive, and is not a routine first-line treatment for dysmenorrhoea; or NSAID optimisation alone","Check contraindications and current product information. For suspected endometriosis, NG73 recommends offering a progestogen or CHC, chosen according to symptoms, contraindications, fertility priorities and local formulary"],
         ["<b>5 · Adjuncts worth offering</b>","Local heat — a hot water bottle or heat patch · TENS · exercise · adequate sleep","Offer heat, exercise and TENS as adjuncts according to patient preference. They should complement, not replace, assessment for secondary dysmenorrhoea where red flags are present. Smoking cessation; address dietary and vitamin claims honestly — the evidence for magnesium, vitamin B1 and fish oil is weak"],
         ["<b>6 · What NOT to do</b>","Do not use opioids as routine treatment for dysmenorrhoea; if severe acute pelvic pain requires opioid analgesia, first exclude pregnancy-related, surgical and infective emergencies and use the shortest possible course within the relevant acute pathway · do not use GnRH analogues in primary care · do not dismiss pain because a scan is normal · do not delay treatment awaiting a diagnosis","Routine opioids do not treat prostaglandin-mediated pain and risk dependence in a young population"]
       ]},
       {b:"why", html:"Two things about this ladder are worth stating to the patient directly. First, an NSAID is often particularly useful here — the pain is prostaglandin-driven, and an NSAID blocks prostaglandin synthesis; paracetamol, alone or with an NSAID, remains a reasonable first-line option. That is why \"I've tried painkillers\" usually means paracetamol and is not the same as having tried treatment. Second, the standard cyclical pill schedule was designed to produce a monthly bleed for reasons of acceptability, not physiology — and removing that bleed may reduce associated symptoms, although not all pelvic pain is caused by the hormone-free interval, particularly in established endometriosis. Continuous or extended regimens are an established option to discuss after UKMEC review."}
     ]},

    {id:"monitor", nav:"Follow up", title:"Review and safety-netting",
     blocks:[
       {b:"table", head:["When","What to check"], rows:[
         ["<b>After an analgesic trial of about 2–3 cycles; earlier for hormonal treatment if adverse effects or treatment failure</b>","Pain days per month against baseline · days of school, work or activity lost · whether the NSAID was taken regularly and early rather than as required · tolerance and side effects · bleeding pattern on a continuous regimen"],
         ["<b>After an LNG-IUS — at least 6 cycles to assess benefit</b>","Irregular bleeding is common initially and may last 3–6 months or longer than 6 months — say so in advance. Check threads and symptoms; do not remove early for irregular bleeding alone if the pain is improving"],
         ["<b>At any review where treatment has failed</b>","Re-take the history for secondary features, examine if not already done, and refer on the NG73 clinical thresholds — do not order a repeat scan instead of referring"],
         ["<b>Annually where treatment is working</b>","Contraceptive review and UKMEC recheck · blood pressure and BMI on a CHC · bone health considerations on long-term depot · fertility plans, which change the whole plan"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 Same day", html:"\"If you get sudden severe one-sided pain with vomiting, or any pain with a positive pregnancy test, or pain with a fever and offensive discharge — contact us the same day or go to A&amp;E.\""},
         {tone:"amber", h:"🟠 Come back sooner", html:"Pain that changes character, becomes constant rather than cyclical, or stops responding to what was working · new bleeding between periods or after sex · new bowel or bladder symptoms · pain affecting school, work or daily life."},
         {tone:"blue", h:"💊 Take the NSAID differently", html:"\"Start it the day before you expect the bleed, or the moment the pain begins — not once it is severe — and take it regularly for two or three days rather than waiting to see if you need it. Timing changes how well it works.\""},
         {tone:"green", h:"✓ The reassurance that is actually true", html:"\"Severe period pain is common but it is not something you have to put up with, and there is more than one thing to try. If the first option does not work, that is information, not failure — come back.\""}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Emergency — same day", html:"Suspected ovarian torsion · positive pregnancy test with pain (ectopic) · PID with systemic sepsis or a suspected tubo-ovarian abscess · suspected obstructive Müllerian anomaly with acute retention of menstrual flow."},
         {tone:"purple", h:"Suspected cancer · NICE NG12 (updated April 2026)", html:"Ovarian cancer: aged 40 or over with persistent or frequent (particularly more than 12 times a month) abdominal distension or bloating, early satiety or loss of appetite, pelvic or abdominal pain, or increased urinary urgency or frequency → measure CA-125; urgent direct-access ultrasound if it is at or above the age-specific threshold (≥35 IU/mL at 40–49, ≥31 at 50–59, ≥24 at 60–69, ≥25 at 70–79, ≥31 at 80 and over). Aged 39 or under — the usual dysmenorrhoea age group — do not rely on CA-125 alone (endometriosis raises it too); consider urgent direct-access ultrasound for persistent symptoms. Ascites or a pelvic or abdominal mass not obviously fibroids → urgent suspected ovarian cancer referral. Ultrasound suggesting ovarian cancer → suspected cancer pathway referral; if CA-125 is below the threshold or ultrasound is normal, investigate other causes and safety-net — the threshold is an age-based pathway threshold, not a diagnostic rule-out value.<br>Cervical cancer: an appearance of the cervix consistent with cervical cancer on examination → consider a suspected cancer pathway referral, regardless of a recent normal smear.<br>Endometrial cancer: unexplained post-menopausal bleeding aged 55 or over, not attributable to HRT → suspected cancer pathway referral; under 55 → consider referral."},
         {tone:"amber", h:"Gynaecology — on the clinical picture, not the scan", html:"NG73: refer where symptoms have a detrimental impact on activities of daily living; where symptoms are persistent or recurrent; where initial treatment is ineffective, not tolerated or contraindicated; or where pelvic signs are present but deep disease is not suspected. Also refer where fertility is a priority, or imaging is normal but clinical suspicion continues. <b>Refer regardless of normal imaging.</b>"},
         {tone:"blue", h:"Specialist endometriosis centre", html:"Suspected or confirmed endometrioma · deep endometriosis involving bowel, bladder or ureter · extra-pelvic endometriosis · severe adolescent disease where specialist endometriosis expertise is needed — NG73 directs these to a centre with the relevant multidisciplinary expertise rather than to general gynaecology. For young people aged 17 or under, NG73 recommends paediatric and adolescent gynaecology or a specialist endometriosis service."},
         {tone:"blue", h:"Adolescent gynaecology", html:"Severe dysmenorrhoea from the first period · suspected obstructive anomaly · primary amenorrhoea with cyclical pain · failure of NSAID plus hormonal treatment in a young person · suspected endometriosis aged 17 or under."},
         {tone:"green", h:"Fertility, and pain services", html:"Subfertility with suspected endometriosis → fertility referral in parallel, not after (see <a href='infertility.html'>infertility</a>). If actively trying to conceive or planning conception soon, do not delay referral until after a prolonged course of hormonal treatment — discuss early gynaecology/fertility referral. NG73: hormonal treatment alone or with surgery should not be offered to someone trying to conceive, as it does not improve spontaneous pregnancy rates. Temporary suppression for someone planning pregnancy later is a shared decision and should not delay referral if symptoms are severe, persistent or suggest deep disease. Where pain has become chronic and central features have developed, see <a href='chronic-pain.html'>chronic pain</a> — but not as a substitute for making the gynaecological diagnosis."},
         {tone:"cream", h:"GP management", html:"Most dysmenorrhoea is managed entirely here: the classification, the impact question, the NSAID taken properly, a continuous or extended hormonal regimen after UKMEC review, the LNG-IUS, and a referral made on symptoms rather than on imaging. Related pages: <a href='menorrhagia.html'>heavy menstrual bleeding</a> · <a href='pcos.html'>PCOS</a> · <a href='contraception.html'>contraception</a> · <a href='pelvic-inflammatory-disease.html'>PID</a> · <a href='../algorithms/irregular-periods.html'>irregular periods</a>."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 27-year-old woman says her periods have become \"unbearable\" over the last three years, having been manageable in her teens. The pain now <b>starts four days before the bleed</b> and she takes <b>two days off work most months</b>. She has <b>deep pain during sex</b> and describes <b>painful bowel movements around her period</b>, which a previous clinician attributed to IBS. She takes paracetamol and \"the odd ibuprofen when it gets bad\". A pelvic ultrasound last year was normal and she was told nothing was wrong. She and her partner are considering trying for a baby next year."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Identifies this as SECONDARY dysmenorrhoea from onset, timing and trajectory; recognises deep dyspareunia and cyclical dyschezia as important symptoms that raise suspicion of endometriosis, particularly deep disease (though not diagnostic), and names it rather than accepting the IBS label; states explicitly that a normal ultrasound does NOT exclude endometriosis and explains why, repairing the previous consultation without criticising the clinician; <b>asks the impact question and quantifies it</b> (two days a month off work); corrects the NSAID technique — regularly and started early, not \"the odd ibuprofen when it gets bad\"; <b>offers examination with a chaperone</b>; discusses a continuous or tricycled CHC and the LNG-IUS, while recognising that fertility plans next year affect acceptability and making any temporary suppression a shared decision that does not delay referral; refers to gynaecology on the NG73 clinical thresholds (symptoms affecting daily activities) rather than ordering another scan, and considers parallel fertility input; <b>screens the NG12 ovarian symptom set</b>; <b>does not use an opioid as routine treatment</b>; and <b>acknowledges the years of not being believed</b>, which is what she has actually come in with."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG73 (2017, updated 2024) — Endometriosis: diagnosis and management</b><br><a href="https://www.nice.org.uk/guidance/ng73" rel="noopener">nice.org.uk/guidance/ng73</a><span class="rd"> — the symptom set on which to suspect endometriosis, the instruction not to exclude it on a normal examination or ultrasound and to consider laparoscopy even if ultrasound or MRI is normal, transvaginal ultrasound for all with suspected endometriosis, no CA-125 or primary MRI for diagnosis, paracetamol or an NSAID as a short first-line trial, a progestogen or CHC, the referral thresholds, referral to a specialist centre for endometrioma, deep or extra-pelvic disease, paediatric and adolescent services at 17 or under, and fertility-service input for subfertility</span></li>'+
         '<li><b>Supplementary only: RCOG Green-top 41 (2012, older) · ESHRE endometriosis guideline (international, 2022)</b><span class="rd"> — background on the primary/secondary distinction; NICE NG73, NG88 and NG12, the FSRH CHC guideline and the current UKMEC are the operational UK sources</span></li>'+
         '<li><b>FSRH (College of Sexual and Reproductive Healthcare) — Combined Hormonal Contraception guideline, and current UKMEC (December 2025)</b><br><a href="https://www.fsrh.org" rel="noopener">fsrh.org</a><span class="rd"> — tailored regimens (21/4, tricycling with a 4- or 7-day interval, flexible extended use with at least 21 active days before a 4-day break, continuous use), and the UKMEC eligibility criteria checked before prescribing, including migraine with aura (UKMEC 4)</span></li>'+
         '<li><b>NICE NG88 (2018, updated July 2026) — Heavy menstrual bleeding</b><br><a href="https://www.nice.org.uk/guidance/ng88" rel="noopener">nice.org.uk/guidance/ng88</a><span class="rd"> — considering the LNG-IUS first line for heavy menstrual bleeding with no identified pathology, small non-cavity-distorting fibroids or suspected/diagnosed adenomyosis; warning that bleeding changes may last longer than 6 months and that at least 6 cycles may be needed to assess benefit</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (2015, updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — the ovarian symptom set with age-specific CA-125 thresholds from age 40 and urgent direct-access ultrasound, and no reliance on CA-125 alone at 39 or under (ovarian recommendations 1.5.6\u20131.5.9 and 1.5.11 amended April 2026); direct referral for ascites or a pelvic mass; the cervix consistent with cancer; and unexplained post-menopausal bleeding at 55 and over not attributable to HRT (endometrial recommendations amended April 2026)</span></li>'+
         '<li><b>BNF and current product information (SPC)</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — all doses quoted and maximum daily doses, NSAID cautions and contraindications, norethisterone for cycle control and its non-contraceptive status, and depot medroxyprogesterone bone-density considerations</span></li>'+
         '<li><b>Endometriosis UK</b><br><a href="https://www.endometriosis-uk.org" rel="noopener">endometriosis-uk.org</a><span class="rd"> — patient support</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Dysmenorrhoea — NICE NG73, NICE NG88, FSRH CHC guideline, UKMEC and NICE NG12 (updated April 2026). Primary or secondary is the whole question: onset relative to menarche, timing within the cycle, trajectory, dyspareunia and cyclical bowel or bladder symptoms. Paracetamol or an NSAID first — an NSAID started early and taken regularly is often particularly useful because the pain is prostaglandin-driven. Then a CHC (continuous or extended regimens are options after UKMEC review), a progestogen or an LNG-IUS, with review intervals tailored to each intervention. Offer transvaginal ultrasound to all with suspected endometriosis; a normal examination, ultrasound or MRI does NOT exclude it — refer on symptoms, not on imaging. No routine opioids. Verify all doses against the BNF and product information before prescribing."
});
