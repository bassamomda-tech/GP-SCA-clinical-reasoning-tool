<script>
MG.render({
  icon:"🧴",
  title:"Rosacea — phenotype-led assessment and ongoing primary-care management",
  eyebrow:"Protocol · adults · chronic relapsing facial dermatosis",
  stemTitle:"Rosacea is managed by its dominant features — gentle skincare and sun protection for everyone, then the treatment that matches what you see, with the eyes checked at every review",
  stemSub:"A chronic, relapsing condition managed according to its <b>dominant phenotype</b>. Advise gentle skincare, moisturising, trigger modification and daily sun protection for everyone. For papulopustular disease use azelaic acid or metronidazole according to the Greater Manchester formulary and patient preference, with ivermectin where these are ineffective, unsuitable or poorly tolerated; consider a <b>time-limited</b> oral tetracycline for more severe disease, with antibiotic stewardship. Reserve brimonidine for severe persistent erythema after other formulary options have failed (Greater Manchester restriction), warning about rebound and cardiovascular effects. <b>Ask about the eyes at every review — eye pain, photophobia or visual change needs urgent ophthalmology.</b> Refer persistent or resistant disease, significant ocular disease, rhinophyma, diagnostic uncertainty or substantial psychological impact.",
  guideline:"BAD rosacea guideline (2021) · PCDS · MHRA Drug Safety Updates (brimonidine) · Greater Manchester formulary · SPCs",
  reviewed:"25 September 2026",
  nextReview:"25 September 2027",
  meta:[
    {t:"Treat the dominant feature", tone:"ok"},
    {t:"GM formulary: azelaic acid or metronidazole first · ivermectin and brimonidine restricted"},
    {t:"Eye pain or visual change → urgent ophthalmology"},
    {t:"v2.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#assess"><b>Assess</b><small>Phenotype · differential</small></a><a href="#everyone"><b>Everyone</b><small>Skin · sun · triggers</small></a><a href="#treat"><b>Treat</b><small>By feature</small></a><a href="#eyes"><b>Eyes</b><small>Every review</small></a><a href="#refer"><b>Refer</b><small>By feature</small></a></div>',
  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"blue", h:"Document the dominant phenotype", html:"Persistent centrofacial erythema · transient flushing · telangiectasia · papules and pustules · phymatous change · ocular features · burning, stinging, dryness or oedema. <b>Features coexist</b> — they are not mutually exclusive subtypes. No comedones helps distinguish it from acne."},
    {tone:"green", h:"Everyone: skin, sun and triggers", html:"Gentle non-soap cleanser, fragrance-free moisturiser, daily broad-spectrum sun protection, and identifying personal triggers (heat, sun, alcohol, spicy food, hot drinks, stress). Green-tinted camouflage can help persistent redness."},
    {tone:"blue", h:"Papules and pustules: formulary-led topicals", html:"Use <b>azelaic acid or metronidazole</b> according to the Greater Manchester formulary and patient preference. Consider <b>ivermectin</b> (formulary-restricted) where these are ineffective, unsuitable or poorly tolerated; it may suit suspected Demodex-associated lesions. BAD rates all three as first-line. Review after about 8–12 weeks; if effective, ongoing or intermittent maintenance may be considered per the product information, local formulary and recurrence pattern — indefinite daily use is not automatic."},
    {tone:"amber", h:"Oral antibiotics: time-limited, with stewardship", html:"For more severe disease or an inadequate topical response: a time-limited oral tetracycline. <b>Doxycycline 40 mg modified-release is licensed</b> for papulopustular rosacea; doxycycline 100 mg and lymecycline are off-label, per local formulary. Review at about 6–12 weeks and avoid unnecessarily prolonged courses. <b>Avoid in pregnancy unless specialist advice indicates otherwise; when pregnancy is planned or possible, discuss safer alternatives first. Doxycycline is generally avoided under 12</b> (specialist use in selected serious infections). Avoid minocycline unless there is no suitable alternative, and avoid unnecessary continuation."},
    {tone:"amber", h:"Brimonidine: persistent erythema only, with care", html:"Greater Manchester: restricted to <b>severe persistent erythema</b> after other formulary options have failed, immediately before laser referral. Not for papules, pustules or telangiectasia. Apply a thin layer once daily to intact skin using the amount in the SPC, never above the maximum daily amount. Caution in bradycardia, hypotension, cardiovascular or cerebrovascular disease and with antihypertensives or other vasoactive medicines. Discuss and warn about <b>rebound or exacerbation (up to 16%)</b>, burning and contact dermatitis. Do not apply to irritated, broken or recently lasered skin — systemic effects (bradycardia, hypotension, dizziness) are possible."},
    {tone:"red", h:"⚠ The eyes — ask every time", html:"Gritty or dry eyes, blepharitis, recurrent styes, photophobia, pain, blurred or reduced vision, pain on eye movement, sticky discharge; ask about contact-lens use (a painful red eye, photophobia or reduced vision in a lens wearer may be microbial keratitis — urgent, and not necessarily rosacea). <b>Eye pain, photophobia, reduced vision, pain on eye movement or suspected keratitis → same-day ophthalmology.</b>"}
  ],
  pathwaySub:"Five steps. Match the treatment to what you see.",
  pathway:[
    {title:"Document the phenotype and check the differential", html:"Coexisting features; acne, seborrhoeic dermatitis, periorificial dermatitis, contact dermatitis, lupus, dermatomyositis, photodermatosis, steroid-induced rosacea."},
    {title:"Skincare, sun protection and triggers for everyone", html:"Plus the psychological impact."},
    {title:"Treat by dominant feature", html:"Azelaic acid or metronidazole (then ivermectin) for papulopustular disease; time-limited oral tetracycline if more severe; brimonidine only for severe persistent erythema after other options (GM restriction); off-label propranolol only for selected troublesome flushing after cardiovascular and respiratory screening."},
    {title:"Ask about the eyes at every review", html:"Lid hygiene, warm compresses, preservative-free lubricants; same-day ophthalmology for eye pain, photophobia, reduced vision, pain on eye movement or suspected keratitis; routine referral if troublesome despite treatment.", alert:true},
    {title:"Review and refer by feature", html:"Topicals at 8–12 weeks; oral antibiotics at 6–12 weeks. Refer resistant disease, telangiectasia or erythema for laser/IPL, rhinophyma, ocular disease, doubt or distress."}
  ],
  sections:[

    {id:"assess", nav:"Assess", title:"Step 1 — phenotype and differential",
     blocks:[
       {b:"table", head:["Feature","Notes"], rows:[
         ["<b>Persistent centrofacial erythema</b>","Fixed redness — brimonidine (restricted locally), laser/IPL"],
         ["<b>Transient flushing</b>","Trigger management first; off-label propranolol in selected troublesome cases"],
         ["<b>Telangiectasia</b>","Does not respond to ivermectin, metronidazole, doxycycline or brimonidine — laser/IPL"],
         ["<b>Papules and pustules</b>","Topical azelaic acid or metronidazole, then ivermectin (GM formulary); oral tetracycline if more severe"],
         ["<b>Phymatous change</b>","Not reversed by topicals or antibiotics — specialist laser or surgical debulking"],
         ["<b>Ocular features</b>","Carries corneal risk — not simply another subtype (see Step 4)"],
         ["<b>Burning, stinging, dryness, oedema</b>","Gentle skincare; choose less irritant topicals"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"🔎 Differential diagnosis", html:"Acne vulgaris · seborrhoeic dermatitis · periorificial dermatitis · contact dermatitis · lupus · dermatomyositis · photodermatosis · steroid-induced rosacea. <b>Diagnostic uncertainty or an atypical distribution → dermatology advice.</b>"},
         {tone:"blue", h:"🧠 Psychological impact", html:"Ask about distress, avoidance, low mood, anxiety, work and social impact, and body-image concerns. Consider psychological support or skin camouflage; BAD recommends psychological support where rosacea is associated with anxiety or depression. Rosacea is not merely cosmetic: document psychological distress as part of the severity assessment."}
       ]}
     ]},

    {id:"everyone", nav:"Everyone", title:"Step 2 — for everyone",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"☀️ Sun protection", html:"Daily broad-spectrum sunscreen — UV is a major trigger."},
         {tone:"green", h:"🧼 Gentle skincare", html:"Non-soap cleanser and fragrance-free moisturiser; avoid astringents, abrasives and irritant products."},
         {tone:"green", h:"🌶️ Triggers", html:"Heat, sun, alcohol, spicy food, hot drinks, stress and temperature change — a diary helps identify personal triggers rather than imposing blanket dietary restrictions."},
         {tone:"amber", h:"🚫 Facial steroids", html:"<b>Avoid topical corticosteroids on the face</b> unless there is a clear separate indication and a defined treatment plan — they can induce or worsen steroid rosacea. If a potent steroid has been used regularly, assess for steroid-induced disease and avoid abrupt unsupervised withdrawal of prolonged potent use; seek dermatology advice if needed."}
       ]}
     ]},

    {id:"treat", nav:"Treat", title:"Step 3 — treat by the dominant feature",
     blocks:[
       {b:"table", head:["Feature","Treatment","Notes"], rows:[
         ["<b>Papules and pustules — first-line</b>","<b>Azelaic acid 15% gel</b> twice daily or <b>metronidazole 0.75% cream or gel</b> twice daily, according to the Greater Manchester formulary and patient preference. <b>Ivermectin 10 mg/g cream</b> once daily (usually about 3 months) where these are ineffective, unsuitable or poorly tolerated — formulary-restricted","Warn about initial irritation, especially azelaic acid. Review response after about 8–12 weeks. If effective, ongoing or intermittent maintenance may be considered according to the product information, local formulary and recurrence pattern; indefinite daily use is not automatically required. Pregnancy: azelaic acid is generally the preferred low-risk topical; metronidazole may be considered per the SPC and clinical need; ivermectin has insufficient pregnancy safety data. Avoid topical antibiotic monotherapy as a general strategy"],
         ["<b>Papules and pustules — more severe or inadequate topical response</b>","<b>Doxycycline 40 mg modified-release</b> once daily (licensed for papulopustular rosacea), or off-label <b>doxycycline 100 mg</b> once daily or <b>lymecycline 408 mg</b> once daily according to the local formulary, as a time-limited initial course of about 3 months","Review at about 6–12 weeks, reassess benefit by 2–3 months, avoid unnecessarily prolonged courses and stop once controlled where possible. Consider maintenance treatment if relapse follows withdrawal. Add or continue a topical only if helpful and tolerated. Avoid tetracyclines in pregnancy unless specialist advice indicates otherwise, and do not prescribe when pregnancy is planned or possible without discussing safer alternatives. Doxycycline is generally avoided under 12, although specialist use may be appropriate in selected serious infections. Photosensitivity and oesophagitis: take doxycycline with plenty of water, sitting or standing, not immediately before lying down, and per the specific product instructions; avoid in severe oesophageal disease where appropriate. Iron, calcium, magnesium, zinc and antacids reduce absorption by chelation — separate the doses. Review concurrent retinoids where relevant. Avoid minocycline unless no suitable alternative"],
         ["<b>Persistent erythema</b>","<b>Brimonidine 3 mg/g (0.33%) gel</b>: apply a thin layer once daily to intact skin, using the amount specified in the SPC (starting with a small amount, as the SPC and MHRA advise); do not exceed the maximum daily amount. Greater Manchester: restricted to severe persistent erythema after other formulary options have failed, immediately before referral for laser","Discuss rebound or exacerbation before starting. Not for papules, pustules or telangiectasia. Transient benefit. Caution in bradycardia, hypotension or orthostatic hypotension, cardiovascular or cerebrovascular disease, and with antihypertensives or other vasoactive medicines. Rebound or exacerbation in up to 16% (MHRA). Burning, contact dermatitis. Not on irritated, broken or recently lasered skin — bradycardia, hypotension, orthostatic hypotension and dizziness reported (MHRA). Stop if redness or burning worsens"],
         ["<b>Troublesome transient flushing</b>","Trigger management first. <b>Propranolol</b> is an off-label option for troublesome flushing and should not be used routinely — selected patients only, preferably via a local or specialist pathway; consider specialist advice, particularly if symptoms are severe or persistent","Screen first for asthma, COPD or significant bronchospasm, bradycardia, hypotension, heart block, decompensated heart failure and interacting rate-limiting medicines. Does not treat fixed erythema or telangiectasia"],
         ["<b>Telangiectasia or persistent erythema not controlled</b>","Laser or IPL","Specialist, by an appropriately qualified practitioner; availability and commissioning vary locally; telangiectasia and erythema may recur"],
         ["<b>Rhinophyma</b>","Laser or surgical debulking","Specialist; not reversed by topicals or antibiotics"]
       ]}
     ]},

    {id:"eyes", nav:"Eyes", title:"Step 4 — ocular rosacea",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"👁️ Ask at every review", html:"Gritty or dry eyes · blepharitis and recurrent styes · photophobia · eye pain · blurred or reduced vision · pain on eye movement · sticky discharge · contact-lens use — context, not a rosacea red flag by itself: a painful red eye, photophobia or reduced vision in a contact-lens wearer may be microbial keratitis and needs urgent assessment."},
         {tone:"green", h:"🧽 Treat", html:"Regular lid hygiene, warm compresses and ocular lubricants — preservative-free if used frequently. <b>Do not treat persistent ocular symptoms with facial rosacea therapy alone.</b> Manage mild symptoms first with lid hygiene, warm compresses and preservative-free lubricants. Oral doxycycline or another tetracycline may help ocular disease where it coexists with skin disease, but persistent, moderate-to-severe or corneal disease needs ophthalmology input; topical ophthalmic antibiotics, anti-inflammatory or other ocular treatments are prescribed according to ophthalmology advice."},
         {tone:"red", h:"🚨 Same-day or urgent ophthalmology", html:"Eye pain · photophobia · reduced or blurred vision · pain on eye movement · suspected keratitis or corneal involvement. These do not wait for treatment failure."},
         {tone:"blue", h:"📅 Routine ophthalmology", html:"Symptoms that remain troublesome despite appropriate lid hygiene, warm compresses and frequent preservative-free lubricants — particularly persistent discomfort or sticky discharge."}
       ]}
     ]},

    {id:"troubleshoot", nav:"Not responding?", title:"Not responding? Re-check before escalating",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"1 · Right target?", html:"Is the treatment matched to the dominant feature? Telangiectasia and rhinophyma do not respond to topicals or antibiotics."},
         {tone:"amber", h:"2 · Facial steroid?", html:"Any topical steroid use — assess for steroid-induced disease."},
         {tone:"amber", h:"3 · Adequate trial?", html:"Topicals 8–12 weeks; oral tetracycline an adequate course."},
         {tone:"blue", h:"4 · Right diagnosis?", html:"Recheck the differential — periorificial dermatitis, seborrhoeic dermatitis, lupus, contact dermatitis."},
         {tone:"green", h:"5 · Then refer", html:"Resistant disease, laser/IPL, rhinophyma, ocular disease or distress → specialist."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"When to refer",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Ophthalmology — same day or urgent", html:"Eye pain, photophobia, reduced vision, pain on eye movement, suspected keratitis."},
         {tone:"blue", h:"Ophthalmology — routine", html:"Symptoms that remain troublesome despite appropriate lid hygiene, warm compresses and preservative-free lubricants — particularly persistent discomfort or sticky discharge."},
         {tone:"blue", h:"Dermatology", html:"Resistant papulopustular disease · laser/IPL for persistent erythema or telangiectasia (commissioning varies locally) · severe or persistent flushing (specialist advice on off-label propranolol) · severe disease in someone pregnant or trying to conceive · diagnostic uncertainty or atypical distribution · substantial psychological impact."},
         {tone:"blue", h:"Rhinophyma", html:"Dermatology or plastic surgery for laser or surgical debulking."},
         {tone:"cream", h:"GP management", html:"Phenotype-led treatment, skincare and sun advice, time-limited antibiotics and the eye check at every review belong here. Related pages: <a href='acne.html'>acne</a> · <a href='blepharitis.html'>blepharitis</a> · <a href='seborrhoeic-dermatitis.html'>seborrhoeic dermatitis</a>."}
       ]},
       {b:"say", html:"Rosacea is long-term and tends to come and go, but it can be kept well controlled. Daily sunscreen, gentle skincare and working out your triggers matter as much as the creams. We'll match the treatment to what's bothering you most — spots, redness or flushing — and review it after a couple of months. Please don't use steroid creams on your face for this. If your eyes become painful, sensitive to light or your vision blurs, get them checked the same day."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 42-year-old woman has a <b>red face with papules and pustules</b> over the cheeks and nose, worse with wine and hot drinks. She has been using her partner's <b>hydrocortisone cream</b>. Her eyes feel gritty. She is <b>trying to conceive</b> and asks for tablets because the creams \"take too long\"."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Documents the phenotype and differential; addresses the facial steroid; offers a first-line topical (azelaic acid is generally the preferred low-risk option when trying to conceive) and explains the 8–12-week timescale; explains why a tetracycline is not suitable when trying to conceive and that specialist input is sought if severe; checks the eyes, advises lid hygiene and safety-nets for eye pain or visual change; discusses triggers, sunscreen and the emotional impact; and arranges review."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>British Association of Dermatologists — guidelines for the management of people with rosacea 2021</b><br><a href="https://doi.org/10.1111/bjd.20485" rel="noopener">doi.org/10.1111/bjd.20485</a><span class="rd"> — phenotype-led management, first-line topicals, oral tetracyclines (reassess at 2–3 months), off-label propranolol for flushing, ocular care, laser/IPL and debulking, psychological support</span></li>'+
         '<li><b>Primary Care Dermatology Society — Rosacea</b><br><a href="https://www.pcds.org.uk/clinical-guidance/rosacea" rel="noopener">pcds.org.uk/clinical-guidance/rosacea</a><span class="rd"> — primary-care treatment pathway; ivermectin 10 mg/g once daily for about 3 months</span></li>'+
         '<li><b>MHRA Drug Safety Update — Brimonidine gel (Mirvaso): risk of exacerbation of rosacea</b><span class="rd"> — exacerbation or rebound in up to 16%; start with a small amount</span></li>'+
         '<li><b>MHRA Drug Safety Update — Brimonidine gel (Mirvaso): risk of systemic cardiovascular effects; not to be applied to damaged skin</b><br><a href="https://www.gov.uk/drug-safety-update/brimonidine-gel-mirvaso-risk-of-systemic-cardiovascular-effects-not-to-be-applied-to-damaged-skin" rel="noopener">gov.uk/drug-safety-update/brimonidine-gel-mirvaso-risk-of-systemic-cardiovascular-effects-not-to-be-applied-to-damaged-skin</a><span class="rd"> — bradycardia, hypotension and dizziness; avoid irritated or damaged skin, including after laser</span></li>'+
         '<li><b>GMMMG Greater Manchester Formulary — Skin</b><br><a href="https://www.greatermanchesterformulary.nhs.uk" rel="noopener">greatermanchesterformulary.nhs.uk</a><span class="rd"> — azelaic acid and metronidazole first-line; ivermectin restricted to after established topicals; brimonidine restricted to severe persistent erythema after other options, before laser referral</span></li>'+
         '<li><b>SPCs</b> — ivermectin 10 mg/g cream, metronidazole 0.75%, azelaic acid 15% gel, doxycycline 40 mg modified-release, doxycycline 100 mg, lymecycline 408 mg, brimonidine 3 mg/g gel<br><a href="https://www.medicines.org.uk/emc" rel="noopener">medicines.org.uk/emc</a></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — doses, pregnancy, interactions and cautions</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Rosacea. A chronic, relapsing condition managed by the dominant phenotype. Gentle skincare, moisturising, trigger modification and daily sun protection for everyone. Papulopustular: azelaic acid or metronidazole first-line per the Greater Manchester formulary, then ivermectin; a time-limited oral tetracycline (doxycycline 40 mg MR licensed; others off-label; about 3 months, reviewed at 6–12 weeks) for more severe disease, avoided in pregnancy unless specialist advice. Brimonidine only for severe persistent erythema after other options (GM restriction) — rebound in up to 16% and cardiovascular effects (MHRA). Avoid routine facial steroids. Ask about the eyes at every review: eye pain, photophobia or visual change needs urgent ophthalmology. Refer resistant disease, telangiectasia for laser/IPL, rhinophyma, significant ocular disease, diagnostic uncertainty or substantial psychological impact. Sources: BAD rosacea guideline (2021), PCDS, MHRA, Greater Manchester formulary, SPCs."
});
