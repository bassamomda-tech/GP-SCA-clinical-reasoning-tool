<script>
MG.render({
  icon:"⚡",
  title:"Post-herpetic neuralgia — the complete guide",
  eyebrow:"Protocol · NICE CG173 · prevention is part of the treatment",
  stemTitle:"The honest thing to tell the patient is that this usually eases over months — and the honest thing to remember is that zoster vaccination substantially reduces, but does not abolish, the risk of the next episode",
  stemSub:"One page for the whole condition. Recognise dermatomal pain persisting or recurring at least 3 months after the onset of shingles, often with allodynia; use <b>one CG173 systemic medicine at a time, switching rather than routinely adding a second</b> (a short planned overlap with tapering may be appropriate); consider <b>capsaicin cream, or a lidocaine 5% plaster within NHS England and GMMMG restrictions, where the pain is localised</b> and oral treatment is ineffective or unsuitable; support sleep, mood and function; and keep <b>acute shingles, established PHN and vaccination</b> separate: vaccination reduces the risk of future shingles and PHN, while antivirals treat acute shingles in those meeting local criteria and do not reliably prevent PHN. Local GMMMG policy takes precedence for prescribing status and referral arrangements.",
  guideline:"NICE CG173 (2013, updated 2020) · NICE NG193 (2021) · UKHSA Green Book chapter 28a · lidocaine plaster and capsaicin cream SPCs · NHS England · GMMMG formulary and guidance",
  reviewed:"14 September 2026",
  nextReview:"14 March 2027",
  meta:[
    {t:"NICE CG173 — neuropathic pain in adults"},
    {t:"One systemic agent at a time — switch, with planned overlap if needed", tone:"tw"},
    {t:"Lidocaine plaster: licensed for PHN, not CG173 first-line, NHSE/GMMMG restricted", tone:"tw"},
    {t:"v2.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#recognise"><b>Recognise</b><small>≥3 months · dermatomal</small></a><a href="#treat"><b>Ladder</b><small>One at a time</small></a><a href="#support"><b>Support</b><small>Mood · prevention</small></a><a href="#follow"><b>Titrate</b><small>Early, then 4–8 weeks</small></a><a href="#refer"><b>Refer</b><small>Criteria · urgent</small></a></div>',
  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"blue", h:"The definition, and the feature that gives it away", html:"PHN is pain that persists or recurs in the affected dermatome for at least 3 months after the onset of herpes zoster (a clinical convention, not a CG173 definition). It is usually burning, aching or stabbing, and may include allodynia or hyperalgesia — characteristic features, but not diagnostic by themselves; the diagnosis needs a compatible history and examination. New motor weakness, progressive sensory loss, bilateral or non-dermatomal symptoms, systemic features, or pain unexplained by the prior rash should prompt reconsideration of the diagnosis. Risk factors: older age, severe acute pain or rash, and ophthalmic zoster."},
    {tone:"amber", h:"One systemic agent at a time — switch rather than routinely add", html:"Offer ONE of the CG173 agents — amitriptyline, duloxetine, gabapentin or pregabalin. Illustrative adult ranges (BNF/SPC, not CG173 doses): amitriptyline 10–75 mg nocte, duloxetine 60 mg OD, gabapentin titrated to 300–1200 mg TDS, pregabalin 75–300 mg BD. <b>Doses are illustrative adult ranges only. Start lower and titrate more slowly in older, frail or multimorbid patients. Check the current SPC and local formulary before prescribing. Gabapentin and pregabalin require renal-dose adjustment.</b> If ineffective or not tolerated, switch to another option rather than routinely adding a second systemic agent; a planned short overlap with tapering of the first medicine may be appropriate. Review early during titration, and assess efficacy after an adequate trial (commonly 4–8 weeks). Deliberate combination therapy needs specialist advice."},
    {tone:"green", h:"Topical options for localised pain", html:"Consider capsaicin 0.075% cream for localised PHN when the patient wishes to avoid, or cannot tolerate, oral treatment; it commonly causes initial burning, needs regular application, is not suitable for broken skin, and should be reassessed after 8 weeks (CG173; the 8% patch only after specialist assessment). For localised PHN, consider a lidocaine 5% medicated plaster when oral treatment has been tried and is ineffective or unsuitable, particularly where systemic adverse effects are problematic. This is licensed for PHN but is not a NICE CG173 first-line recommendation. Follow NHS England and local GMMMG formulary restrictions. It generally has low systemic absorption, but local administration-site reactions are common and efficacy is not universal."},
    {tone:"amber", h:"⚠ Balance efficacy against falls in older patients", html:"Amitriptyline brings anticholinergic burden and falls risk; gabapentinoids bring sedation and are controlled drugs (Class C) — prescribe carefully. Gabapentinoids also carry dizziness, falls, misuse/dependence and respiratory-depression risks, particularly with opioids or other CNS depressants. In an older person with falls, sedation or cognitive adverse effects, a modest benefit from local treatment may be preferable to escalation of a systemic medicine that increases harm."},
    {tone:"green", h:"Prevention is part of the management story", html:"Check current UKHSA eligibility for Shingrix. Previous shingles is not, by itself, a reason to withhold vaccination. Vaccination reduces the risk of future shingles and PHN but does not treat established PHN. If shingles recurs, advise same-day clinical advice — antivirals reduce the duration and severity of acute shingles in people meeting local criteria, but a Cochrane review (2014) found oral aciclovir did not reduce PHN, so do not present them as preventing or treating PHN. Say this to the patient in front of you: it is the one part of the conversation that changes what happens next time, and it is easily omitted once the pain is established."},
    {tone:"blue", h:"Set the expectation honestly: reduce, not abolish", html:"Explain that PHN often improves over months, and set the goal as reducing pain rather than abolishing it. That framing is what prevents a cycle of escalating doses against an unachievable target — and it happens to be true, which makes it the most useful reassurance available."}
  ],
  pathwaySub:"Five steps, and the topical option is the one most often forgotten.",
  pathway:[
    {title:"Recognise it and assess the impact", html:"Dermatomal pain persisting or recurring 3 months or more after the onset of shingles, often with allodynia. Assess pain severity and distress, sleep, mood, appetite and function, falls risk and cognition, current medicines (including opioids and CNS depressants), and renal function before gabapentin or pregabalin."},
    {title:"Start one CG173 agent and titrate", html:"Amitriptyline, duloxetine, gabapentin or pregabalin — start low; switch rather than routinely adding a second systemic agent, tapering the first (a planned overlap may help). Review early during titration and assess efficacy at around 4–8 weeks.", alert:true},
    {title:"Consider a topical option for localised pain", html:"Capsaicin 0.075% cream, or a lidocaine 5% plaster where oral treatment has been tried and is ineffective or unsuitable (NHS England and GMMMG restrictions) — especially where systemic adverse effects are a concern."},
    {title:"Support function, mood and sleep", html:"Treat coexisting depression and insomnia; pacing, clothing protection for allodynia, and realistic reassurance."},
    {title:"Make prevention explicit, and refer against clear criteria", html:"Check UKHSA Shingrix eligibility; same-day review for any future shingles, with antivirals per local acute-zoster criteria; refer using the specialist and urgent criteria below."}
  ],
  sections:[

    {id:"recognise", nav:"Recognise", title:"Step 1 — recognition and risk",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>Definition</b>","Pain that persists or recurs in the affected dermatome for at least 3 months after the onset of herpes zoster (conventional clinical definition, not CG173 wording)"],
         ["<b>Features</b>","Burning, aching, shooting or stabbing pain; allodynia (pain from clothing or light touch) or hyperalgesia; altered sensation, numbness, itch or hypersensitivity; sleep disturbance and reduced activity. Allodynia is characteristic but not diagnostic by itself. Often elderly; thoracic and ophthalmic distributions are commonest"],
         ["<b>Risk factors</b>","<b>Older age, severe acute pain or rash, ophthalmic zoster</b>"],
         ["<b>Impact</b>","Sleep, mood, appetite and function — assess and address, rather than treating the pain in isolation"],
         ["<b>Assess before prescribing</b>","Pain severity and pain-related distress; falls risk and cognition; current medicines, including opioids and CNS depressants; renal function before gabapentin or pregabalin; the skin and neurological distribution"],
         ["<b>Reconsider the diagnosis</b>","Pain that is bilateral, non-dermatomal or progressive, new motor weakness, progressive or spreading sensory loss, systemic symptoms, or pain unexplained by the prior rash"]
       ]},
       {b:"why", html:"PHN is the commonest complication of shingles and is treated as neuropathic pain under CG173. Keep three things separate: acute herpes-zoster management (antivirals for those meeting local criteria, which do not reliably prevent PHN), established PHN treatment (this page), and vaccination, which reduces the risk of future shingles and PHN but does not treat established PHN."}
     ]},

    {id:"treat", nav:"Ladder", title:"Step 2 — the neuropathic-pain ladder",
     blocks:[
       {b:"table", head:["Step","Treatment","Detail"], rows:[
         ["<b>First-line — one CG173 oral agent</b>","Illustrative adult ranges (BNF/SPC — CG173 names the medicines but not these doses): amitriptyline 10–75 mg nocte (often 5–10 mg nocte to start in frail older adults) · duloxetine 60 mg OD (30 mg OD initially if tolerability is a concern) · gabapentin titrated to 300–1200 mg TDS · pregabalin 75–300 mg BD — gabapentin and pregabalin dosed according to renal function","Use one systemic neuropathic-pain medicine at a time as the default in primary care, chosen for age and frailty, falls and cognitive risk, renal and hepatic function, cardiac disease, mood and sleep, concurrent serotonergic or CNS-depressant medicines, and misuse risk. If it is ineffective or not tolerated, switch to another option rather than routinely adding a second systemic agent. During a switch, a planned short period of overlap may be appropriate, with tapering of the first medicine, particularly where abrupt withdrawal or loss of pain control is a concern. Review early during titration; assess efficacy after an adequate trial at a tolerated dose (commonly 4–8 weeks). A maximum dose need not be reached before switching if harms are evident"],
         ["<b>Topical — capsaicin cream</b>","Capsaicin 0.075% cream (CG173: consider for localised pain if the person wishes to avoid or cannot tolerate oral treatment). Apply a pea-sized amount 3–4 times daily, at least 4 hours apart, only to intact, healed skin. Wash hands immediately after application; avoid eyes, mucous membranes, broken or irritated skin, and hot baths or showers immediately before or after application. Warn about transient burning and skin irritation; inhaled vapour may irritate the airways and exacerbate asthma. Reassess after 8 weeks before continuing","The 8% capsaicin patch should not be started without specialist assessment (CG173)"],
         ["<b>Topical — lidocaine 5% plaster</b>","Licensed for PHN in adults; not a NICE CG173 recommendation; NHS England advises it should not routinely be prescribed unless criteria are met, and the GMMMG formulary restricts it to PHN after treatment in line with CG173 or where oral treatment is unsuitable — no unsupported off-label use. Apply to healed, intact, dry skin; maximum three plasters at once; up to 12 hours, then at least 12 hours plaster-free; may be cut to fit the painful area. Reassess after 2–4 weeks and stop if there is no meaningful benefit","Monitor for local reactions (burning, dermatitis, erythema, pruritus, rash, irritation); systemic toxicity is unlikely when used correctly. Use caution in severe hepatic, renal or cardiac impairment"],
         ["<b>Combination or escalation</b>","Deliberate combination therapy, high-dose therapy, tramadol or a capsaicin 8% patch only with specialist advice; refer using the criteria under Referral","Interventional options and multidisciplinary support sit in secondary care"]
       ]},
       {b:"table", head:["Medicine","Practical cautions (older or frail patients especially)"], rows:[
         ["<b>Amitriptyline</b>","Consider 5–10 mg at night to start in frail older adults. Review anticholinergic effects, sedation, postural hypotension, cognition and confusion, constipation, urinary retention, glaucoma and cardiac disease"],
         ["<b>Duloxetine</b>","30 mg once daily may be considered initially if tolerability is a concern; avoid or seek specialist advice in severe renal impairment. Consider interactions with serotonergic medicines and the risk of hypertension, hyponatraemia and hepatic injury"],
         ["<b>Gabapentin / pregabalin</b>","Dose according to renal function; assess sedation, dizziness, gait disturbance, falls, misuse/dependence and respiratory-depression risk. Class C, Schedule 3 controlled drugs: evaluate misuse risk and prescribe the minimum effective quantity. Be particularly cautious in people aged over 65 years and those with respiratory disease, renal impairment or concurrent CNS depressants (MHRA)"],
         ["<b>All systemic agents</b>","Avoid combining with opioids, alcohol, benzodiazepines or other CNS depressants where possible; warn that sedation and dizziness may impair driving"]
       ]},
       {b:"warn", html:"<b>Doses are illustrative adult ranges only.</b> Start lower and titrate more slowly in older, frail or multimorbid patients. Check the current SPC and local formulary before prescribing. Gabapentin and pregabalin require renal-dose adjustment. In elderly patients, balance efficacy against falls, sedation and anticholinergic load — a topical option may be preferable where these harms dominate. <b>Gabapentinoids are controlled drugs; prescribe carefully</b>, and see <a href='chronic-pain.html'>chronic pain</a> for the dependence and misuse considerations."},
       {b:"cards", cols:2, items:[
         {tone:"red", h:"⛔ Not for routine primary-care initiation", html:"Capsaicin 8% patch; long-term tramadol; strong opioids; neuropathic-pain medicines outside NICE CG173 — seek specialist advice."},
         {tone:"cream", h:"Local policy", html:"Local GMMMG policy takes precedence for prescribing status and referral arrangements. Greater Manchester guidance is more sequential and advises careful use of gabapentinoids after consideration of first-line options."}
       ]}
     ]},

    {id:"support", nav:"Support", title:"Step 3 — function, mood and prevention",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"💉 Zoster vaccine", html:"Check current UKHSA eligibility: Shingrix has replaced Zostavax; the routine programme is moving to vaccination at age 60, previously eligible people remain eligible until their 80th birthday, and from September 2025 severely immunosuppressed adults aged 18 and over are eligible with no upper age limit. Previous shingles is not, by itself, a reason to withhold vaccination. Vaccination reduces the risk of future shingles and PHN but does not treat established PHN."},
         {tone:"green", h:"⏱️ Future acute shingles", html:"If shingles recurs, seek same-day clinical advice, particularly if the rash is within 72 hours of onset, involves the eye or ear, is extensive or severe, or the patient is immunocompromised. Treat according to local acute-zoster criteria (Greater Manchester antimicrobial guidelines, e.g. aged over 50 presenting within 72 hours, ophthalmic zoster, Ramsay Hunt syndrome, eczema or other higher-risk situations), with renal-dose adjustment of oral antivirals. Antivirals reduce the duration and severity of acute shingles; a Cochrane review (2014) found oral aciclovir did not reduce PHN, so do not present them as a reliable treatment for, or prevention of, PHN."},
         {tone:"blue", h:"🧠 Mood and sleep", html:"Assess mood, sleep, activity, social participation and self-care, and treat coexisting depression, anxiety and insomnia. Offer psychologically informed self-management and consider referral for CBT/ACT where there is significant psychological distress or functional disability, recognising that the NG193 CBT/ACT recommendation is specifically for chronic primary pain (PHN is usually chronic secondary pain)."},
         {tone:"green", h:"🤝 Function", html:"Pacing and gradual return to valued activities, loose or soft clothing and protection from light touch, sleep advice, and the honest message that the pain often becomes less troublesome over time."}
       ]}
     ]},

    {id:"follow", nav:"Titrate", title:"Step 4 — titration and review",
     blocks:[
       {b:"dl", rows:[
         ["<b>Early (titration)</b>","Review early during titration — usually within 1–2 weeks in an older or high-risk patient — for tolerability and adverse effects, and titrate to an effective, tolerated dose"],
         ["<b>Around 4–8 weeks</b>","Assess efficacy after an adequate trial at a tolerated dose (timing depends on the medicine). Continue only if there is meaningful benefit in pain, sleep or function; switch if ineffective or not tolerated. Do not continue an ineffective treatment simply because the maximum dose has not been reached if harms are already evident"],
         ["<b>Ongoing</b>","Regular reviews of pain, function, sleep, psychological wellbeing, adverse effects and continued need. Consider capsaicin 0.075% cream (reassess at 8 weeks) or a lidocaine 5% plaster within NHS England/GMMMG restrictions (reassess at 2–4 weeks) for localised pain. Explain that PHN often becomes less troublesome over time, and set realistic goals — reduce, not abolish"],
         ["<b>Specialist advice</b>","Severe pain, inadequate benefit or intolerance after appropriate sequential trials, or need for combination, high-dose therapy, tramadol or a capsaicin 8% patch → specialist pain service (see Referral)"]
       ]},
       {b:"say", html:"These nerve-pain tablets take a few weeks to reach the right dose, and the good news is that the pain usually eases over the following months. We will fine-tune the dose and try alternatives if needed — and for a patch of pain like yours, a cream or plaster applied to the area may help with less risk of the drowsiness tablets sometimes cause."},
       {b:"cards", items:[
         {tone:"amber", h:"🟠 New deficit", html:"New motor weakness, spreading sensory loss, or atypical pain → reconsider the diagnosis and refer."},
         {tone:"red", h:"🔴 Ophthalmic or disseminated", html:"Eye symptoms or suspected herpes zoster ophthalmicus; ear involvement, facial weakness or suspected Ramsay Hunt syndrome; disseminated or extensive zoster; or an immunocompromised patient with active or complicated zoster → urgent same-day review."},
         {tone:"blue", h:"💬 Safety-net", html:"\"If you develop new weakness, numbness that spreads, problems with your bladder or bowels, the pain changes character, or you feel generally unwell, contact us. If a new shingles rash appears — especially near your eye or ear — seek advice the same day.\""},
         {tone:"green", h:"⏳ Expectations", html:"\"This is nerve pain following shingles. It can be difficult to remove completely, but it often becomes less troublesome over time. The aim is to reduce the pain and improve sleep and function, rather than necessarily eliminate it.\""}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"Pain clinic / specialist advice", html:"Refer when <b>pain remains severe or significantly limits sleep, function or participation</b>; there is inadequate benefit or intolerance after appropriate sequential trials; treatment requires combination therapy, high-dose therapy, tramadol or a capsaicin 8% patch; there are substantial medicine-related harms; or the diagnosis is uncertain — for interventional options and multidisciplinary support."},
         {tone:"red", h:"Urgent / same-day", html:"<b>Eye symptoms or suspected herpes zoster ophthalmicus</b> (ophthalmology); ear involvement, facial weakness or suspected Ramsay Hunt syndrome; disseminated or extensive zoster; immunocompromised patient with active or complicated zoster; new motor deficit, progressive sensory deficit, sphincter symptoms or another atypical neurological feature."},
         {tone:"blue", h:"Mental health", html:"<b>Significant depression, a significant psychosocial or mental-health component, or major functional impact.</b> See <a href='depression.html'>depression</a>."},
         {tone:"amber", h:"Reconsider the diagnosis", html:"New motor weakness, spreading sensory loss, bilateral or non-dermatomal symptoms, systemic features, or pain unexplained by the prior rash — this may not be PHN."},
         {tone:"cream", h:"GP management", html:"Recognition, one CG173 agent at a time with switching, topical options within formulary restrictions, mood and sleep, function, and the prevention conversation all belong here. Related pages: <a href='neuropathic-pain.html'>neuropathic pain</a> · <a href='shingles.html'>shingles</a> · <a href='trigeminal-neuralgia.html'>trigeminal neuralgia</a> · <a href='chronic-pain.html'>chronic pain</a> · <a href='depression.html'>depression</a>."}
       ]},
       {b:"say", html:"This is post-shingles nerve pain. It can be stubborn but usually eases over months. We treat it with nerve-pain medicines — tablets, and sometimes patches or creams for a localised area, which may cause less drowsiness. If you are eligible, the shingles vaccine reduces the chance of shingles, and of this pain, in future."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"An 81-year-old woman has <b>burning pain across the right lower ribs</b> four months after shingles. She <b>cannot bear her clothing touching the area</b> and is sleeping in a chair. She was started on <b>amitriptyline 25 mg</b> which made her \"woozy and dry-mouthed\", so she stopped it, and a colleague then <b>added gabapentin without stopping the amitriptyline</b>. She has had <b>two falls</b> in the last month and takes bendroflumethiazide and alendronic acid."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"<b>Recognises allodynia — pain from clothing — as the signature feature</b>, and that this is established PHN at four months; identifies that a second systemic agent was added rather than switching (CG173 advises switching, with tapering and a planned overlap only where needed), and unpicks it rather than adding a third; links the two falls to the anticholinergic and sedative burden in an 81-year-old on a thiazide with known osteoporosis, checks renal function, and treats the falls as drug-related rather than incidental; considers a topical option for localised pain — capsaicin cream, or a lidocaine 5% plaster within NHS England/GMMMG restrictions as oral treatment has not been tolerated; stops or reduces the offending oral agent with a plan rather than abruptly for the gabapentinoid; <b>addresses sleep and mood</b> given she is sleeping in a chair; sets the honest expectation that PHN usually eases over months and the aim is reduction not abolition; and checks current UKHSA zoster vaccine eligibility (the routine programme ends at the 80th birthday unless severely immunosuppressed) and advises same-day review for any future shingles."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE CG173 \u2014 Neuropathic pain in adults: pharmacological management in non-specialist settings</b><br><a href="https://www.nice.org.uk/guidance/cg173" rel="noopener">nice.org.uk/guidance/cg173</a><span class="rd"> — amitriptyline, duloxetine, gabapentin or pregabalin as initial treatment, switching if ineffective or not tolerated, considering overlap during the switch and tapering the withdrawn drug; early and regular review; CG173 does not specify the dose ranges quoted; capsaicin cream for localised pain in people who wish to avoid or cannot tolerate oral treatment; capsaicin 8% patch not started without specialist assessment. CG173 makes no recommendation on lidocaine plasters. (The 90-day definition and the risk factors are the conventional clinical definitions, not CG173 wording.)</span></li>'+
         '<li><b>SPC — lidocaine 5% medicated plaster (Versatis)</b> and <b>NHS England — Items which should not be routinely prescribed in primary care</b> (2017, updated 2019)<br><a href="https://www.england.nhs.uk/publication/items-which-should-not-routinely-be-prescribed-in-primary-care-policy-guidance/" rel="noopener">england.nhs.uk — items which should not be routinely prescribed in primary care</a><span class="rd"> — licensed only for PHN; should not routinely be prescribed unless criteria are met (PHN where other treatment has been tried or is inappropriate); reassess at 2–4 weeks; maximum three plasters for up to 12 hours in 24</span></li>'+
         '<li><b>SPC — capsaicin 0.075% cream (Axsain)</b><br><a href="https://products.mhra.gov.uk/" rel="noopener">MHRA products — SPC</a><span class="rd"> — pea-sized amount 3–4 times daily, no more often than every 4 hours, on unbroken healed skin; reassess after 8 weeks</span></li>'+
         '<li><b>GMMMG — Greater Manchester formulary, neuropathic pain guideline and antimicrobial guidelines</b><br><a href="https://www.greatermanchesterformulary.nhs.uk/" rel="noopener">greatermanchesterformulary.nhs.uk</a> · <a href="https://gmmmg.nhs.uk/" rel="noopener">gmmmg.nhs.uk</a><span class="rd"> — formulary status of lidocaine plasters, sequential neuropathic-pain pathway, and local acute-zoster antiviral criteria; local policy takes precedence</span></li>'+
         '<li><b>Chen N et al. Antiviral treatment for preventing postherpetic neuralgia. Cochrane Database Syst Rev 2014;CD006866</b><br><a href="https://doi.org/10.1002/14651858.CD006866.pub3" rel="noopener">doi.org/10.1002/14651858.CD006866.pub3</a><span class="rd"> — high-quality evidence that oral aciclovir does not significantly reduce PHN incidence; insufficient evidence for other antivirals</span></li>'+
         '<li><b>NICE NG193 — Chronic pain (primary and secondary) in over 16s</b><br><a href="https://www.nice.org.uk/guidance/ng193" rel="noopener">nice.org.uk/guidance/ng193</a><span class="rd"> — general assessment and person-centred care principles; its CBT/ACT recommendation is specifically for chronic primary pain, whereas PHN is generally chronic secondary pain</span></li>'+
         '<li><b>UKHSA Green Book, chapter 28a — shingles (herpes zoster) immunisation</b><br><a href="https://www.gov.uk/government/publications/shingles-herpes-zoster-the-green-book-chapter-28a" rel="noopener">gov.uk — Green Book chapter 28a</a><span class="rd"> — Shingrix programme and current eligibility (phasing to age 60; previously eligible until the 80th birthday; severely immunosuppressed adults aged 18+ from September 2025), and the evidence that vaccination reduces both shingles and PHN</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — the illustrative dose ranges quoted (verify against the current SPC and local formulary), the anticholinergic burden of amitriptyline, and the Class C, Schedule 3 controlled-drug status of gabapentin and pregabalin</span></li>'+
         '<li><b>MHRA Drug Safety Update — Pregabalin (Lyrica): reports of severe respiratory depression</b><br><a href="https://www.gov.uk/drug-safety-update/pregabalin-lyrica-reports-of-severe-respiratory-depression" rel="noopener">gov.uk — Drug Safety Update</a><span class="rd"> — caution in people aged over 65, with respiratory disease, renal impairment or concurrent CNS depressants</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Post-herpetic neuralgia — NICE CG173 (2013, updated 2020), NICE NG193 (2021), the UKHSA Green Book chapter 28a and the lidocaine plaster SPC. Dermatomal pain persisting or recurring at least 3 months after the onset of shingles, often with allodynia. Treat with ONE CG173 agent at a time — amitriptyline, duloxetine, gabapentin or pregabalin — switching rather than routinely adding a second (planned overlap with tapering where needed), with early review during titration and an efficacy review after an adequate trial. Capsaicin 0.075% cream, or a lidocaine 5% plaster within NHS England and GMMMG restrictions (licensed for PHN, not a CG173 first-line recommendation), for localised pain where oral treatment is ineffective or unsuitable. Explain honestly that PHN often becomes less troublesome over time and the goal is reduction, not abolition. Zoster vaccination reduces the risk of future shingles and PHN but does not treat established PHN; antivirals treat acute shingles in those meeting local criteria but do not reliably prevent PHN (Cochrane 2014). Doses are illustrative adult ranges — verify against the current SPC, BNF and local formulary before prescribing; local GMMMG policy takes precedence."
