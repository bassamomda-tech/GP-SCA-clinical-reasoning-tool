  stemTitle:"The acute decision belongs to the hyperacute pathway; everything that determines whether this patient has another stroke — and whether they get their life back — belongs to general practice",
  stemSub:"For the diagnostic route and the same-day rules, use the <a href='../algorithms/tloc.html'>transient loss of consciousness pathway</a>. This page is the other half: the four secondary-prevention decisions that actually reduce recurrence (antithrombotic, statin, blood pressure, and the AF and carotid questions), and then the part no clinic follows up on — rehabilitation goals, post-stroke depression and emotionalism, fatigue, spasticity, cognition and capacity, the carer, driving, and return to work. <b>Scope:</b> use NICE NG128 for recognition, acute stroke management and urgent TIA assessment. Use the National Clinical Guideline for Stroke, NICE TA210, NG196, NG238 and local stroke pathways for long-term secondary prevention and rehabilitation.",
  guideline:"NICE NG128 (2019) · NICE TA210 (2010) · NICE NG236 (2023) · National Clinical Guideline for Stroke (2023) · NICE NG196 (2021) · NICE NG238 (2023) · NICE NG12 (updated April 2026) · DVLA",

  lead:'<div class="mg-layers"><a href="#safety"><b>Red flags</b><small>Recurrence &amp; the mimics</small></a><a href="#antithrombotic"><b>Antithrombotic</b><small>Clopidogrel or DOAC</small></a><a href="#risk"><b>Risk factors</b><small>Statin · BP · glucose</small></a><a href="#life"><b>Life after stroke</b><small>Mood · fatigue · tone</small></a><a href="#driving"><b>Driving &amp; work</b><small>DVLA rules</small></a></div>',
  quickSub:"The six that change outcomes. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ A new deficit is a new emergency — every time", html:"Any new focal neurological deficit in a patient with previous stroke or TIA is treated as a new stroke: FAST positive → 999, not a GP appointment. The thrombolysis and thrombectomy windows do not care that the patient has had one before, and the commonest reason a recurrent stroke is missed is that the deficit is attributed to the old one. <b>Ask what is NEW or WORSE compared with their established baseline</b> — which is why that baseline belongs in the record."},
    {tone:"blue", h:"Clopidogrel 75 mg is the long-term default", html:"After the initial period: clopidogrel 75 mg OD as long-term secondary prevention for ischaemic stroke or TIA. If clopidogrel is unsuitable or not tolerated: aspirin 75 mg OD plus modified-release dipyridamole 200 mg BD, or aspirin alone if dipyridamole is also unsuitable. Do not continue dual antiplatelet therapy beyond the specialist-initiated short course (usually 21 days) — the bleeding risk accrues and the benefit does not."},
    {tone:"amber", h:"If there is AF, the antiplatelet stops unless there is a separate indication", html:"Atrial fibrillation with stroke or TIA means an anticoagulant, not an antiplatelet — a DOAC (apixaban, rivaroxaban, edoxaban or dabigatran) unless contraindicated, warfarin for mechanical heart valves and moderate-to-severe rheumatic mitral stenosis; in antiphospholipid syndrome (particularly high-risk or arterial APS) DOACs are generally unsuitable — use specialist advice. Dose DOACs by the product criteria and Cockcroft–Gault creatinine clearance, not eGFR. Do not combine a therapeutic anticoagulant with an antiplatelet solely for prevention of AF-related stroke: stop the antiplatelet unless there is a separate current indication (recent ACS, coronary stenting or another specialist-directed indication) with a documented duration. Check for paroxysmal AF if the rhythm was never captured."},
    {tone:"blue", h:"High-intensity statin, and a systolic target below 130", html:"Atorvastatin 80 mg ON for ischaemic stroke or TIA unless contraindicated or investigation confirms no evidence of atherosclerosis (a lower dose if there are interactions, a high risk of adverse effects, or the patient prefers it). Document the stroke mechanism and use the locally agreed target: for ischaemic stroke or TIA with atherosclerosis the National Clinical Guideline for Stroke recommends LDL below 1.8 mmol/L or non-HDL below 2.5 mmol/L; NICE NG238 gives LDL 2.0 mmol/L or less, or non-HDL 2.6 mmol/L or less. Follow the local Greater Manchester lipid pathway where it differs operationally; optimise, then add ezetimibe if not achieved. <b>After the acute phase, treat BP gradually towards clinic systolic below 130 mmHg (home below 125) if tolerated</b> — individualise for frailty, orthostatic hypotension, falls, renal function and patient preference; specialist advice for severe bilateral carotid stenosis (where 140–150 mmHg applies), acute stroke or complex haemodynamic disease (National Clinical Guideline for Stroke 2023). In haemorrhagic stroke, BP control is the main lever; do not prescribe a statin solely to prevent recurrent ICH, but base it on overall cardiovascular risk — check which type before prescribing."},
    {tone:"green", h:"Post-stroke depression is the most missed diagnosis here", html:"Roughly a third of stroke survivors develop depression, most within the first year. Screen and assess at every review, adapting the assessment for aphasia or cognitive impairment (a visual or carer-informed tool rather than a standard questionnaire). Offer psychological and social interventions; consider an antidepressant when clinically indicated, with particular care in people taking antithrombotics. <b>Distinguish it from emotionalism</b> (sudden crying or laughing without matching mood) — explain the condition, and consider specialist advice or an SSRI if persistent, severe or disabling, balancing benefit against bleeding, hyponatraemia, falls and interaction risks."},
    {tone:"purple", h:"🚗 DVLA — a statutory duty, not advice", html:"Car or motorcycle: must not drive for 1 month after a stroke or TIA; DVLA need not be notified if there is full clinical recovery at 1 month and no residual deficit affecting driving. After multiple TIAs, the 1-month exclusion applies after each episode; notify DVLA where the current guidance requires. Bus, coach or lorry (Group 2): must stop and notify DVLA; relicensing is generally considered after 1 year, but may be extended where functional impairment persists (for example, a modified Rankin Scale score of 2 or more at 2 months). <b>Delivery driving does not automatically mean Group 2</b> — check the vehicle category and licence held. Residual visual field loss, neglect, cognitive impairment or significant limb weakness requires notification regardless of the time elapsed. Record that you gave this."}
  ],
  pathwaySub:"After the clinic letter arrives, five things decide the next ten years.",
  pathway:[
    {title:"Establish the type, the cause, and the baseline", html:"Ischaemic or haemorrhagic? Cardioembolic, large-vessel, small-vessel or cryptogenic? What did the carotid imaging and the rhythm monitoring show? Then record the functional baseline — mRS or a plain description of what they can do — because every future \"is this new?\" question is answered against it."},
    {title:"Get the antithrombotic right", html:"Clopidogrel 75 mg for ischaemic stroke or TIA without AF · a DOAC (antiplatelet stopped) if AF · after intracerebral haemorrhage, nothing started or restarted automatically — a specialist risk-based decision. Confirm the specialist-initiated DAPT course (usually 21 days) has an end date and that it ended.", alert:true},
    {title:"Treat the four risk factors properly", html:"High-intensity statin to the locally agreed target (LDL below 1.8 or non-HDL below 2.5 mmol/L for atherosclerotic stroke per the National Clinical Guideline for Stroke; LDL ≤2.0 or non-HDL ≤2.6 mmol/L per NICE NG238) · clinic systolic below 130 if tolerated, individualised · HbA1c and diabetes management · smoking cessation, alcohol, weight and activity. Do not leave the BP \"running a bit high because of the stroke\" — that reasoning belongs to the acute phase only."},
    {title:"Manage life after stroke — the part nobody else follows up", html:"Rehabilitation goals and re-referral · mood and emotionalism · fatigue · spasticity and contracture · pain and shoulder · continence · swallowing and nutrition · cognition and capacity · communication · the carer. Stroke rehabilitation should be needs-led and not time-limited: people should be able to access review and re-referral when new stroke-related goals or needs arise, including after discharge from rehabilitation services."},
    {title:"Review, and say the safety-net out loud", html:"Structured review at 6 weeks and 6 months, then at least annually (adjust the frequency to individual need), with medication, BP, mood, function and carer strain each covered. FAST advice repeated at every review, and the DVLA position documented."}
  ],
  sections:[

    {id:"safety", nav:"Red flags", title:"Red flags — recurrence, bleeding, and the deficit that is actually something else",
     sub:"The established diagnosis is the camouflage. Screen against the recorded baseline, not against \"normal\".",
     blocks:[
       {b:"table", head:["Feature","Meaning","Action"], rows:[
         ["Any NEW focal deficit — face, arm, speech, vision — or a sudden worsening beyond the known baseline","<b>Recurrent stroke.</b> Highest risk is in the first days to weeks after a TIA, but recurrence is lifelong","<b>FAST positive → 999 immediately.</b> Thrombolysis and thrombectomy windows apply regardless of previous events. <b>Never book a routine appointment for a new deficit</b>"],
         ["<b>Crescendo TIAs — two or more in a week, or increasing frequency</b>","Unstable large-vessel or cardioembolic source; very high early stroke risk","<b>Same-day urgent stroke-specialist assessment, not the next TIA clinic slot.</b> Admission where symptoms are ongoing, recurrent in the department, associated with high-risk vascular disease, significant carotid stenosis, AF or bleeding risk, or where urgent specialist assessment cannot be ensured"],
         ["Sudden severe headache, vomiting, reducing consciousness, or a deficit in a patient on an anticoagulant","<b>Intracerebral haemorrhage</b> — and anticoagulation makes it both more likely and more rapidly fatal","999. Do not give aspirin. Bring the anticoagulant name, dose and last dose time"],
         ["<b>Transient monocular visual loss — \"a curtain coming down\"</b>","<b>Amaurosis fugax — a retinal TIA, most often carotid</b>","<b>Same-day TIA pathway, exactly as for a hemispheric TIA.</b> It is frequently dismissed as \"just my eye\""],
         ["New visible haematuria, rectal bleeding, iron-deficiency anaemia or unexplained weight loss in a patient on an antithrombotic","The anticoagulant is an explanation for bleeding — it is not a reason to skip the cancer pathway. Anticoagulants unmask tumours as often as they cause bleeding","<b>Investigate per NG12 on its own merits</b> — see <a href='#refer'>Refer</a>. Attributing bleeding to the drug is a recognised cause of delayed cancer diagnosis"],
         ["Fever, new murmur, splinter haemorrhages, or stroke in a young patient or IV drug user","<b>Infective endocarditis with septic emboli</b>","Urgent admission, blood cultures before antibiotics where feasible, echocardiography and specialist management. Do not initiate or alter anticoagulation solely for septic embolism; decisions about existing anticoagulation need multidisciplinary specialist advice"],
         ["Stroke under 55, recurrent events despite treatment, or a family history of early stroke","Patent foramen ovale, dissection, thrombophilia, antiphospholipid syndrome, vasculitis, Fabry disease, CADASIL","Young-stroke specialist referral; in antiphospholipid syndrome DOACs are generally unsuitable — anticoagulation choice needs specialist advice"],
         ["Progressive deficit over days to weeks, or one that fluctuates and does not fit a vascular territory","Not a stroke: subdural haematoma, tumour, demyelination, functional neurological disorder, seizure with Todd's paresis, hypoglycaemia","Re-image and reconsider the diagnosis rather than escalating secondary prevention"]
       ]},
       {b:"warn", html:"<b>Two mirror-image errors.</b> <b>Attributing a new deficit to the old stroke</b> — the single commonest way a recurrence is missed, and the reason a documented functional baseline is a safety intervention rather than paperwork. <b>And attributing everything to the stroke in the other direction:</b> the patient with previous stroke who becomes confused has a UTI, a subdural, hyponatraemia or delirium until proven otherwise. <b>\"It's their stroke\" is not a diagnosis.</b>"}
     ]},

    {id:"recognise", nav:"Recognise", title:"Recognising TIA — and the mimics that are not",
     sub:"Absorbed from the former TIA pathway. Transient focal neurology, now fully resolved.",
     blocks:[
       {b:"table", head:["Element","Detail","Why it matters"], rows:[
         ["<b>The presentation</b>","Transient FOCAL neurology — unilateral weakness, speech disturbance, or amaurosis fugax — now fully resolved. Confirm the time course, and confirm the symptoms were focal","A TIA is a diagnosis made on history alone, since by definition the examination is normal by the time you see them"],
         ["<b>Posterior-circulation symptoms</b>","<b>Diplopia, dysarthria, limb or gait ataxia, weakness or sensory symptoms, with or without vertigo.</b> Isolated vertigo alone is not automatically a TIA — look for these associated focal features","<b>Routinely under-recognised as vascular</b> — vertigo and double vision get attributed to the ear or the eye, and a posterior-circulation TIA carries the same urgency as an anterior one"],
         ["<b>The important mimics</b>","<b>Syncope without focal neurological symptoms is unlikely to be a TIA.</b> Migraine aura (spreads and marches over minutes, typically with positive visual phenomena) and focal seizure are important mimics, but the diagnosis may remain uncertain; sudden focal symptoms, especially negative symptoms such as weakness, aphasia or monocular visual loss, require urgent specialist assessment","<b>Getting this wrong in either direction is costly</b> — a missed TIA loses the 24-hour window, and a mislabelled faint or aura starts lifelong antiplatelet therapy unnecessarily"],
         ["<b>Still deficit, or high risk → it is not a TIA</b>","Any persisting or fluctuating deficit (FAST positive) is a STROKE — 999. Recurrent or crescendo transient focal symptoms (2 or more episodes in 7 days) → same-day urgent stroke-specialist assessment, with admission if symptoms are ongoing or other high-risk features are present. An event while on an anticoagulant or with a bleeding disorder → urgent specialist advice","<b>Anticoagulation demands exclusion of haemorrhage before anything else</b>"],
         ["<b>Examination</b>","Blood pressure, pulse for AF, carotid auscultation, cardiac examination","AF found here changes the drug entirely — see <a href='#antithrombotic'>Antithrombotic</a>"],
         ["<b>Immediate action</b>","Offer aspirin 300 mg immediately for suspected TIA unless contraindicated. If the patient is already anticoagulated, has a bleeding disorder, or there is concern about intracranial haemorrhage or another diagnosis, seek urgent specialist advice rather than automatically adding aspirin. Refer all suspected TIA for urgent specialist assessment, to be seen within 24 hours — do not use ABCD2 to decide urgency — and advise not to drive","<b>The 24-hour specialist rule is the single most important step</b>"],
         ["<b>Specialist-led investigation</b>","Diffusion-weighted MRI (preferred) to confirm the territory · carotid Doppler, urgent if the patient is an anterior-circulation candidate for endarterectomy · ECG and prolonged monitoring for paroxysmal AF · FBC, glucose/HbA1c, lipids, U&amp;E, clotting · echocardiography if cardioembolic","<b>Do not arrange these yourself instead of referring</b> — they are part of the 24-hour pathway, not a substitute for it"]
       ]}
     ]},
    {id:"antithrombotic", nav:"Antithrombotic", title:"Antiplatelet or anticoagulant — the decision with the largest effect",
     blocks:[
       {b:"table", head:["Situation","Drug","Notes"], rows:[
         ["<b>Ischaemic stroke or TIA, no AF — long term</b>","<b>Clopidogrel 75 mg OD</b>","<b>The long-term default.</b> Check for interactions reducing activation (omeprazole — use lansoprazole or pantoprazole if a PPI is needed). Genuine non-response exists but is not routinely tested for in primary care"],
         ["<b>Clopidogrel unsuitable or not tolerated</b>","<b>Aspirin 75 mg OD + MR dipyridamole 200 mg BD</b>; aspirin 75 mg alone if dipyridamole is also unsuitable","Dipyridamole headache is common early, usually settles, and is worth warning about or the patient stops it"],
         ["<b>Short-term after minor stroke or high-risk TIA</b>","Confirm the specialist-prescribed DAPT indication and stop date. For most eligible minor ischaemic strokes or high-risk TIAs, aspirin plus clopidogrel is used for 21 days, followed by antiplatelet monotherapy. Longer courses continue only where explicitly documented by the stroke specialist — for example, selected intracranial stenosis pathways. Not every minor stroke or TIA receives DAPT: bleeding risk, imaging, diagnostic certainty and timing matter","<b>Your job is to confirm it STOPPED.</b> A DAPT course left running on repeat prescription is a preventable major-bleed source — check the end date the day the letter arrives"],
         ["<b>Atrial fibrillation (any pattern, including paroxysmal)</b>","DOAC — apixaban 5 mg BD (2.5 mg BD if two of: age 80+, weight ≤60 kg, creatinine ≥133 µmol/L), or rivaroxaban, edoxaban, dabigatran. Dose according to the product criteria and creatinine clearance — <b>do not substitute eGFR for Cockcroft–Gault CrCl</b>. <b>Stop the antiplatelet unless there is a separate current indication</b>","<b>Anticoagulation beats antiplatelet decisively in AF-related stroke.</b> Review age, weight, renal function (CrCl), interacting medicines and indication at least annually and after acute illness or major weight change — particularly in older stroke survivors and people with low muscle mass. <b>CHA₂DS₂-VASc is already ≥2 — the decision is made</b>"],
         ["AF with a mechanical heart valve or moderate-to-severe rheumatic mitral stenosis; antiphospholipid syndrome","<b>Warfarin</b> with INR 2–3 (higher range for some valves) for mechanical valves and moderate-to-severe rheumatic mitral stenosis. In antiphospholipid syndrome, particularly high-risk or arterial APS, use specialist advice","Not every valve is a warfarin indication — many people with bioprosthetic valves or other valve disease may be eligible for a DOAC. DOACs are generally unsuitable in antiphospholipid syndrome — this matters in young stroke"],
         ["<b>Intracerebral haemorrhage</b>","<b>After spontaneous ICH, antithrombotic treatment should not be started or restarted automatically.</b> Decisions require specialist assessment of recurrent ICH risk, thromboembolic risk, haemorrhage location and cause, MRI markers such as cerebral amyloid angiopathy or microbleeds, and the strength of the original indication","<b>BP control is the dominant intervention.</b> Do not prescribe a statin solely to prevent recurrent ICH; assess the indication by overall cardiovascular risk and underlying atherosclerotic disease, and do not stop an established statin automatically without reviewing the individual risk–benefit balance"],
         ["<b>Symptomatic carotid stenosis</b>","Symptomatic 50–99% stenosis: urgent vascular referral for consideration of endarterectomy or stenting, alongside medical therapy","<b>Carotid endarterectomy should be undertaken as soon as possible, ideally within 7 days of symptom onset where clinically appropriate and feasible</b> — a delayed carotid referral is a lost opportunity, not a minor administrative slip"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"⛔ Do not add an antiplatelet to an anticoagulant solely for AF-related stroke prevention", html:"<b>The commonest dangerous prescribing error after stroke.</b> When an anticoagulant starts for AF, <b>stop the antiplatelet unless there is a separate current indication</b> — such as recent acute coronary syndrome, coronary stenting or another specialist-directed indication — with a documented duration. Review whether antiplatelet therapy is still needed after coronary intervention; document who initiated combination therapy and when it should stop; and do not stop either drug without checking the indication and the specialist plan."},
         {tone:"amber", h:"⚠ The DAPT course that never ended", html:"<b>Check the discharge letter for the stop date and diarise it.</b> A 21-day course silently becoming a 5-year repeat is common, invisible on a medication list, and doubles major bleeding."},
         {tone:"blue", h:"💊 PPI and GI protection", html:"Consider gastroprotection according to individual GI-bleeding risk, including previous ulcer or GI bleed, age, concomitant anticoagulant, antiplatelet, NSAID, steroid or SSRI use, and dyspepsia — a PPI is not automatic for everyone over 65. <b>Avoid omeprazole and esomeprazole with clopidogrel where possible</b> — use an appropriate alternative such as pantoprazole or lansoprazole."},
         {tone:"green", h:"✓ Adherence is the whole game", html:"<b>Ask how many doses were missed this month, without judgement.</b> Once-daily where possible, dosette boxes, and address the belief — common and unspoken — that the tablets can stop once recovery feels complete."}
       ]}
     ]},

    {id:"risk", nav:"Risk factors", title:"The four risk factors — and the target for each",
     blocks:[
       {b:"table", head:["Factor","Target and drug","Notes"], rows:[
         ["<b>Lipids</b>","Atorvastatin 80 mg ON after ischaemic stroke or TIA unless contraindicated or investigation confirms no evidence of atherosclerosis (lower dose if interactions, high risk of adverse effects or patient preference). Document the stroke mechanism and use the locally agreed target: for ischaemic stroke or TIA with evidence of atherosclerosis, the National Clinical Guideline for Stroke recommends LDL below 1.8 mmol/L or equivalent non-HDL below 2.5 mmol/L; NICE NG238 gives a secondary-prevention target of LDL 2.0 mmol/L or less, or non-HDL 2.6 mmol/L or less. Follow the local Greater Manchester lipid pathway where it differs operationally. If not achieved: check adherence, increase the dose if a lower dose was used, then add <b>ezetimibe 10 mg OD</b>; consider inclisiran or a PCSK9 inhibitor per local criteria","Lipids and LFTs at 3 months. Statin intolerance is usually dose-related — try a lower dose or an alternative statin before abandoning it; true myopathy with a raised CK is uncommon. <b>After intracerebral haemorrhage, do not prescribe a statin solely to prevent recurrent ICH</b> — base it on overall cardiovascular risk and the underlying cause, and do not stop an established statin automatically"],
         ["<b>Blood pressure</b>","After the acute phase, treat gradually towards <b>clinic systolic below 130 mmHg</b> (home below 125) if tolerated, confirming with home or ambulatory monitoring where appropriate. Individualise for frailty, orthostatic hypotension, falls, renal function, limited life expectancy and patient preference. Do not apply the target during the acute stroke phase without specialist instruction. 140–150 mmHg applies to severe bilateral carotid stenosis, not routinely to unilateral carotid disease — use specialist advice for severe bilateral carotid stenosis or complex haemodynamic disease (National Clinical Guideline for Stroke 2023). ACE inhibitor or ARB, calcium-channel blocker, thiazide-like diuretic per <a href='hypertension.html'>the hypertension protocol</a>","The single largest population-level lever on recurrence, and the most commonly under-treated after discharge. Caution in severe bilateral carotid stenosis, and titrate gradually in the first weeks"],
         ["<b>Glucose</b>","<b>HbA1c per the diabetes pathway; screen if not known diabetic</b>","Post-stroke hyperglycaemia is common and frequently undiagnosed. An SGLT2 inhibitor or GLP-1 agonist where there is established cardiovascular disease"],
         ["<b>Smoking, alcohol, weight, activity</b>","<b>Smoking cessation is the highest-yield single conversation.</b> Alcohol within limits; weight and activity per the rehabilitation plan","<b>Varenicline or NRT plus behavioural support.</b> Physical activity should come from the rehabilitation goals rather than generic advice — \"walk more\" is not actionable with a hemiparesis"],
         ["<b>Rhythm — if AF was never captured</b>","<b>Consider prolonged ambulatory monitoring in cryptogenic stroke</b>","Paroxysmal AF is a common occult cause, and finding it changes the drug entirely — worth pursuing rather than settling for \"cryptogenic\""]
       ]},
       {b:"why", html:"Secondary prevention after stroke fails in primary care for an unglamorous reason: each element drifts a little. The BP is left at 145 because it was \"allowed to run high\" acutely and nobody revisited it; the statin was reduced for aches and never re-challenged; the DAPT course never ended; the clopidogrel was never stopped when the DOAC began. None of these is a dramatic error and all of them are recurrences waiting to happen. The structured annual review exists precisely because this is drift, not ignorance — and it is why each target above is stated as a number rather than a direction."}
     ]},

    {id:"life", nav:"Life after stroke", title:"Life after stroke — the half that is genuinely general practice",
     sub:"The hospital manages the infarct. Nobody but you manages the next thirty years.",
     blocks:[
       {b:"table", head:["Problem","What to do","Detail that matters"], rows:[
         ["<b>Depression — in roughly a third, mostly in the first year</b>","Screen and assess at every review, adapting the assessment for aphasia or cognitive impairment. Offer psychological and social interventions; consider antidepressant treatment (for example sertraline or citalopram) when clinically indicated, with particular care in people taking antithrombotics","<b>Standard questionnaires fail in aphasia</b> — use a visual analogue or carer-informed tool rather than recording \"unable to assess\". Review at 4–6 weeks"],
         ["<b>Emotionalism — sudden crying or laughing that does not match the mood</b>","Distinguish emotionalism from depression. Name and explain it to the patient and family; consider specialist advice or an SSRI if symptoms are persistent, severe or disabling, balancing potential benefit against bleeding, hyponatraemia, falls and drug-interaction risks","Distinct from depression and profoundly distressing because it is misread by everyone as sadness or instability. Explaining the mechanism is itself therapeutic"],
         ["<b>Fatigue — very common, persistent, and unrelated to effort</b>","Use a standardised fatigue assessment early in rehabilitation and at the 6-month review (NICE NG236). Assess depression, sleep-disordered breathing, anaemia, thyroid disease, medication effects and physical deconditioning, then use pacing, energy conservation and graded activity","Patients are routinely told it is laziness or depression when it is neither. Validation plus a pacing plan is the intervention; there is no routinely recommended pharmacological treatment for post-stroke fatigue"],
         ["<b>Spasticity and contracture</b>","Physiotherapy and positioning first; consider baclofen or tizanidine; refer for botulinum toxin where focal spasticity limits function or care","Untreated spasticity becomes fixed contracture, which is irreversible — this is a time-limited window. Baclofen sedates and weakens; titrate slowly"],
         ["<b>Shoulder pain and central post-stroke pain</b>","Positioning, support and physiotherapy for the hemiplegic shoulder. Central post-stroke pain: amitriptyline, or gabapentin or pregabalin per CG173","Hemiplegic shoulder pain is largely preventable with correct handling — teach the family not to pull on the affected arm. Central pain is neuropathic and does not respond to simple analgesia"],
         ["<b>Cognition and capacity</b>","Assess cognition — vascular cognitive impairment is common and often unrecognised. Capacity is decision-specific","Address advance care planning, LPA and driving while capacity is intact. See <a href='dementia.html'>the dementia protocol</a> for vascular cognitive impairment"],
         ["<b>Communication — aphasia and dysarthria</b>","Speech and language therapy referral, and re-referral when a new goal appears","Aphasia is not a loss of intelligence — say so to the family, and address the patient directly rather than the carer. Allow time; use writing, pictures or gesture"],
         ["<b>Swallowing, nutrition and continence</b>","Any coughing or wet voice with food → SLT swallow assessment. Weight monitoring. Continence assessment rather than pads by default","<b>Aspiration pneumonia is a leading cause of death after stroke.</b> Incontinence is frequently treatable and is a major driver of institutionalisation and carer breakdown"],
         ["<b>Seizures</b>","Post-stroke epilepsy: treat per <a href='epilepsy.html'>the epilepsy protocol</a>; lamotrigine or levetiracetam are usually preferred","<b>A single early seizure is not automatically epilepsy.</b> Driving rules change again — check them against the seizure, not the stroke"],
         ["<b>The carer</b>","Carer's assessment, carer's allowance, respite, and a direct question about how THEY are coping","Carer strain predicts placement more strongly than the patient's deficit does. Register them as a carer in the record — it is the step that unlocks the rest"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"🔁 Rehabilitation is needs-led, not time-limited", html:"Stroke rehabilitation should be needs-led and not time-limited (NICE NG236; National Clinical Guideline for Stroke): people should be able to access review and re-referral when new stroke-related goals or needs arise, including after discharge from rehabilitation services. <b>\"Discharged from physio\" does not mean recovery has finished</b> — a patient wanting to return to driving, work or a specific activity two years on is a legitimate re-referral."},
         {tone:"blue", h:"🎯 Goals must be the patient's", html:"Ask what they want to be able to do — hold a grandchild, get to the shop, return to work — and build the referral around that. Goal-directed rehabilitation outperforms generic exercise, and it is what maintains engagement."},
         {tone:"amber", h:"⚠ Falls and bone health", html:"Falls risk is high — hemiparesis, visual field loss, neglect, sedating drugs. Assess fracture risk (FRAX) and treat osteoporosis: hip fracture after stroke carries a grim prognosis. Review anything sedating."},
         {tone:"green", h:"🤝 Where to send people", html:"Stroke Association (helpline and local groups), Different Strokes for younger survivors, Aphasia support groups, and the local stroke rehabilitation or ESD team. Peer contact with someone further along is consistently rated the most useful thing offered."}
       ]}
     ]},

    {id:"driving", nav:"Driving &amp; work", title:"Driving, work and entitlements",
     blocks:[
       {b:"cards", items:[
         {tone:"purple", h:"🚗 DVLA — Group 1 (car, motorcycle)", html:"<b>Must not drive for 1 month.</b> DVLA need not be notified if there is satisfactory clinical recovery at 1 month and no residual deficit affecting driving. Notification IS required for residual visual field defect, neglect, cognitive impairment, or significant limb weakness or coordination problems. A single TIA usually does not require DVLA notification. <b>After multiple TIAs, the 1-month exclusion applies after each episode</b>; notify DVLA where required by the current guidance."},
         {tone:"purple", h:"🚛 DVLA — Group 2 (bus, coach, lorry)", html:"<b>Must stop driving and notify DVLA after stroke or TIA.</b> Relicensing is generally considered after 1 year, but current DVLA criteria may extend this where functional impairment persists — for example, a modified Rankin Scale score of 2 or more at 2 months. <b>Delivery driving does not automatically mean Group 2</b>: a car or small van is Group 1, a larger goods vehicle is Group 2 — clarify the vehicle category and licence held, and apply the relevant standard. This is often the most consequential single piece of information for a working driver — raise it early rather than at the 6-month review."},
         {tone:"blue", h:"💼 Return to work", html:"Phased return, workplace assessment and adjustments; occupational health where available; Access to Work for equipment and support. <b>The Equality Act 2010 makes reasonable adjustment a legal entitlement.</b> Fatigue and cognitive load — not weakness — are the usual reasons a return fails."},
         {tone:"green", h:"💷 Money and entitlements", html:"PIP, Attendance Allowance for the over-65s, Carer's Allowance, Council Tax reduction, Blue Badge, and free prescriptions where applicable. Signpost early — claims take months, and financial strain is a direct contributor to carer breakdown."}
       ]}
     ]},

    {id:"monitor", nav:"Follow up", title:"Review and monitoring",
     blocks:[
       {b:"table", head:["When","What to check"], rows:[
         ["<b>On receiving the discharge letter</b>","Stroke type · cause · antithrombotic and whether a DAPT course has an END DATE · statin dose · BP plan · carotid and rhythm results · rehabilitation and ESD arrangements · the functional baseline recorded in your own notes"],
         ["<b>6 weeks</b>","Medication actually taken and tolerated · DAPT stopped if due · BP · mood screen · fatigue · rehabilitation engagement · carer coping · driving discussed"],
         ["<b>6 months</b>","BP to target · lipids (locally agreed LDL or non-HDL target achieved) · HbA1c · mood · function against the baseline · new rehabilitation goals · return-to-work position · spasticity and contracture risk"],
         ["<b>At least annually thereafter (more often if needed)</b>","Full review: antithrombotic still correct (and still single-agent unless specified) · DOAC dose against weight, age, interacting medicines and Cockcroft–Gault creatinine clearance (not eGFR) · U&amp;Es and LFTs · BP · lipids · mood and cognition · falls and fracture risk · continence · carer's assessment · FAST advice repeated · DVLA position documented"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 999 — repeat it every review", html:"\"If the face droops, an arm or leg goes weak, or speech goes — any NEW weakness — call 999 immediately. Do not wait, do not ring us first, and do not assume it is the old stroke.\""},
         {tone:"amber", h:"🟠 Contact us the same day", html:"Two or more transient episodes in a week · new or worsening headache on an anticoagulant · any bleeding that will not stop · new confusion · a fall with a head injury while anticoagulated."},
         {tone:"blue", h:"💊 Never stop these yourself", html:"\"The antiplatelet or anticoagulant and the statin are what stop the next stroke. If something about them is troubling you, come and tell me — but do not just stop them.\""},
         {tone:"green", h:"🔁 Recovery has no closing date", html:"\"If you find something new you want to be able to do — even years from now — come back and we will re-refer you. Being discharged from physiotherapy does not mean you have finished improving.\""}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Emergency — 999", html:"Any new focal deficit (FAST positive) · suspected intracerebral haemorrhage · crescendo TIA with ongoing symptoms or high-risk features · suspected endocarditis with neurological signs. <b>Previous stroke does not downgrade any of these.</b>"},
         {tone:"amber", h:"Urgent — same day or within days", html:"Recurrent or crescendo transient focal symptoms → same-day stroke-specialist assessment · symptomatic 50–99% carotid stenosis (endarterectomy ideally within 7 days) · suspected post-stroke seizure · rapidly worsening spasticity threatening contracture · suspected aspiration."},
         {tone:"purple", h:"Suspected cancer · NICE NG12 — bleeding on an antithrombotic still needs the cancer pathway", html:"<b>Do not attribute bleeding to the anticoagulant and stop there.</b> Visible haematuria aged 45 and over → urgent suspected bladder or renal cancer referral. Rectal bleeding, iron-deficiency anaemia, a change in bowel habit, or unexplained weight loss with abdominal pain → FIT, and a suspected cancer pathway referral for colorectal cancer if FIT is ≥10 µg Hb/g (NICE NG12; NICE HTG690, formerly DG56); a rectal or abdominal mass → suspected cancer pathway referral directly. Anticoagulants unmask underlying tumours at least as often as they cause benign bleeding, and \"it's the DOAC\" is a recognised cause of delayed diagnosis."},
         {tone:"blue", h:"Stroke rehabilitation / ESD team", html:"Needs-led, not time-limited: review and re-referral when new stroke-related goals or needs arise, including after discharge (NG236). Physiotherapy, occupational therapy, speech and language therapy — name the goal in the referral."},
         {tone:"blue", h:"Neurology / young stroke service", html:"Stroke under 55, recurrent events despite optimal treatment, unexplained or cryptogenic stroke, suspected dissection, PFO, vasculitis or thrombophilia, or suspected antiphospholipid syndrome."},
         {tone:"amber", h:"Cardiology", html:"AF newly identified or suspected paroxysmal AF needing prolonged monitoring; PFO closure consideration; anticoagulation decisions in complex bleeding risk."},
         {tone:"green", h:"Psychology / Talking Therapies", html:"Post-stroke depression or anxiety not responding to an SSRI, adjustment difficulty, or emotionalism with significant distress. Specify the stroke and any communication needs in the referral."},
         {tone:"cream", h:"GP management", html:"Everything above belongs here: the antithrombotic, the statin, the BP, the glucose, mood, fatigue, spasticity, continence, cognition, the carer, driving and work, and the annual review that stops all of it drifting. Related pages: <a href='../algorithms/tloc.html'>transient loss of consciousness pathway</a> · <a href='hypertension.html'>hypertension</a> · <a href='atrial-fibrillation.html'>atrial fibrillation</a> · <a href='epilepsy.html'>epilepsy</a> · <a href='dementia.html'>dementia</a> · <a href='chronic-pain.html'>chronic pain</a>."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 71-year-old man attends 7 weeks after a left MCA ischaemic stroke with residual right arm weakness and mild expressive aphasia. He is on <b>aspirin 75 mg AND clopidogrel 75 mg</b> (the discharge letter specified 21 days of dual therapy), <b>atorvastatin 20 mg</b>, and his <b>BP today is 148/88</b>. His wife mentions he cries several times a day \"for no reason\", is exhausted by lunchtime, and has stopped going out. He asks when he can drive again — and whether he can get back to his part-time delivery-driving job."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"<b>Stops the aspirin</b> — the DAPT course ended four weeks ago, and spotting this is the single highest-value action in the case; <b>addresses the BP against the systolic-below-130 secondary-prevention target</b> rather than accepting it; <b>increases the atorvastatin towards 80 mg and checks the locally agreed LDL or non-HDL target</b>; <b>recognises the crying as EMOTIONALISM rather than assuming depression</b>, names it to both of them, and still screens for depression — adapting the tool for aphasia rather than recording \"unable to assess\"; <b>validates the fatigue</b> and offers pacing rather than attributing it to low mood; addresses the social withdrawal and re-refers to rehabilitation with his own goal; gives the Group 1 rule (1 month, no notification if fully recovered — but notification IS needed here because of the residual weakness and aphasia) and, for his delivery job, <b>clarifies the vehicle category and licence held</b> — delivery driving is not automatically Group 2, but if it is: stop, notify DVLA, relicensing generally considered after 1 year; either way the residual arm weakness and aphasia need DVLA notification and functional assessment; <b>offers the wife a carer's assessment</b> and addresses her directly as well as him; <b>speaks to the patient, not over him, despite the aphasia</b>; and <b>repeats the FAST safety-net for a new deficit</b>."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>NICE NG128 — Stroke and transient ischaemic attack in over 16s: diagnosis and initial management<br><a href="https://www.nice.org.uk/guidance/ng128" rel="noopener">nice.org.uk/guidance/ng128</a><span class="rd"> — recognition, acute stroke management and urgent TIA assessment: aspirin 300 mg for suspected TIA unless contraindicated, urgent specialist assessment, and urgent assessment and referral for carotid intervention. Not the main long-term secondary-prevention source</span></li>'+
         '<li><b>NICE TA210 — Clopidogrel and modified-release dipyridamole for the prevention of occlusive vascular events (2010)</b><br><a href="https://www.nice.org.uk/guidance/ta210" rel="noopener">nice.org.uk/guidance/ta210</a><span class="rd"> — clopidogrel as long-term secondary prevention after ischaemic stroke, and MR dipyridamole plus aspirin when clopidogrel is contraindicated or not tolerated</span></li>'+
         '<li><b>NICE NG236 — Stroke rehabilitation in adults (2023), superseding CG162</b><br><a href="https://www.nice.org.uk/guidance/ng236" rel="noopener">nice.org.uk/guidance/ng236</a><span class="rd"> — goal-setting, rehabilitation intensity, needs-based rehabilitation with regular goal review, and standardised fatigue assessment early in rehabilitation and at the 6-month review</span></li>'+
         '<li>NICE NG236 and the National Clinical Guideline for Stroke (2023)<span class="rd"> — post-stroke depression and emotionalism, fatigue, spasticity and contracture, shoulder pain, continence and swallowing</span></li>'+
         '<li><b>NICE NG196 — Atrial fibrillation: diagnosis and management</b><br><a href="https://www.nice.org.uk/guidance/ng196" rel="noopener">nice.org.uk/guidance/ng196</a><span class="rd"> — DOAC first-line, apixaban dose-reduction criteria, the remaining warfarin indications, and not combining an antiplatelet with an anticoagulant without a specific indication</span></li>'+
         '<li>NICE NG238 — Cardiovascular disease: risk assessment and lipid modification<span class="rd"> — atorvastatin 80 mg for secondary prevention (lower dose in defined circumstances), the LDL ≤2.0 mmol/L or non-HDL ≤2.6 mmol/L secondary-prevention target, and ezetimibe escalation</span></li>'+
         '<li><b>Intercollegiate Stroke Working Party — National Clinical Guideline for Stroke for the UK and Ireland (2023)</b><br><a href="https://www.strokeguideline.org/chapter/long-term-management-and-secondary-prevention/" rel="noopener">strokeguideline.org</a><span class="rd"> — clinic systolic below 130 mmHg (home below 125) after stroke or TIA, and 140–150 mmHg in severe bilateral carotid stenosis; 21 days of clopidogrel plus aspirin then monotherapy; LDL below 1.8 mmol/L or non-HDL below 2.5 mmol/L in atherosclerotic stroke; specialist antithrombotic and lipid decisions after ICH; carotid endarterectomy within 7 days; urgent assessment of all suspected TIA without ABCD2; rehabilitation access not irrevocably closed</span></li>'+
         '<li><b>NICE NG136 — Hypertension in adults</b><span class="rd"> — the antihypertensive treatment sequence</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — visible haematuria at 45 and over, FIT-guided colorectal referral at ≥10 µg Hb/g (with NICE HTG690), and the rule that bleeding on an antithrombotic is investigated on its own merits</span></li>'+
         '<li><b>DVLA — Assessing fitness to drive: a guide for medical professionals</b><br><a href="https://www.gov.uk/guidance/assessing-fitness-to-drive-a-guide-for-medical-professionals" rel="noopener">gov.uk — assessing fitness to drive</a><span class="rd"> — the Group 1 one-month rule and notification triggers, the 1-month exclusion applied after each of multiple TIAs, and the Group 2 relicensing standard (generally after 1 year, extended where functional impairment persists)</span></li>'+
         '<li><b>MHRA Drug Safety Update — clopidogrel and proton pump inhibitors (April 2010); DOACs in antiphospholipid syndrome (June 2019)</b><span class="rd"> — reduced clopidogrel activation with omeprazole and esomeprazole; DOACs generally unsuitable in antiphospholipid syndrome (specialist advice)</span></li>'+
         '<li><b>Stroke Association · Different Strokes · Equality Act 2010</b><br><a href="https://www.stroke.org.uk" rel="noopener">stroke.org.uk</a><span class="rd"> — patient and carer support, and the reasonable-adjustment entitlement on return to work</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Stroke &amp; TIA — secondary prevention and life after stroke. National Clinical Guideline for Stroke (2023), NICE NG236, NG196, NG238, NG136 and NG12, with NICE NG128 for acute management and the DVLA fitness-to-drive standards. For diagnosis and the same-day rules use the TIA &amp; stroke pathway. Clopidogrel 75 mg long-term unless there is AF, in which case a DOAC replaces it — no antiplatelet alongside unless there is a separate current indication with a documented duration. Confirm every specialist DAPT course (usually 21 days) has ended. Clinic systolic below 130 if tolerated, atorvastatin 80 mg to the locally agreed LDL or non-HDL target. Then treat the mood, the fatigue, the tone, the carer and the driving — that is the half only general practice does. Verify all doses against the BNF before prescribing."
});
