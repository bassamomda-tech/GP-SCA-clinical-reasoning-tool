MG.render({
  icon:"🩸",
  title:"Haemorrhoids — the complete guide",
  eyebrow:"Protocol · adults · examine and assess cancer risk before you reassure",
  stemTitle:"Never attribute rectal bleeding to haemorrhoids unexamined — visible piles do not exclude colorectal disease, so examination and the NG12 criteria come before reassurance",
  stemSub:"One page for adults. Examine — perianal, digital rectal where tolerated, and abdominal — and apply the NICE NG12 and HTG690 criteria before reassuring. Treatment is conservative: individualised stool softening is the foundation, topical preparations are short-course symptom relief, and persistent symptomatic grade I–III haemorrhoids can be referred for outpatient intervention. A tense, tender perianal lump with acute severe pain suggests a thrombosed external haemorrhoid — arrange early assessment, and exclude abscess and strangulated prolapse.",
  guideline:"NICE NG12 · NICE HTG690 (FIT) · Greater Manchester formulary · BNF",
  reviewed:"25 September 2026",
  nextReview:"25 September 2027",
  meta:[
    {t:"Never attribute rectal bleeding to piles unexamined", tone:"tw"},
    {t:"FIT must not delay referral for a mass", tone:"tw"},
    {t:"v2.1 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#confirm"><b>Examine</b><small>And assess risk</small></a><a href="#nondrug"><b>Soften</b><small>Individualised</small></a><a href="#ladder"><b>Ladder</b><small>Topical → specialist</small></a><a href="#urgent"><b>Urgent</b><small>Same day</small></a><a href="#refer"><b>Refer</b><small>NG12 · colorectal</small></a></div>',
  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Never attribute rectal bleeding to haemorrhoids unexamined", html:"Visible haemorrhoids do not exclude proximal colorectal disease — a patient can have both. Examine, ask about change in bowel habit, weight loss, anaemia, blood mixed with stool or darker blood, a mass, persistent or recurrent bleeding and family history, and apply NG12 before reassuring. A previous diagnosis of piles is not a current one."},
    {tone:"purple", h:"NICE NG12 and HTG690 — FIT <span class='tw'>2WW</span>", html:"Offer quantitative FIT to adults with a change in bowel habit, iron-deficiency anaemia, an abdominal mass, rectal bleeding at 50 or over, rectal bleeding with abdominal pain or weight loss under 50, unexplained weight loss with abdominal pain at 40 or over, or anaemia at 60 or over. <b>FIT ≥10 µg Hb/g → suspected colorectal cancer pathway.</b> Do not delay referral for FIT with a rectal or anal mass, unexplained anal ulceration or strong clinical concern."},
    {tone:"green", h:"Soft, formed stools are the foundation", html:"Fibre and fluids where appropriate; add a bulk-forming or osmotic laxative according to stool consistency, tolerance and comorbidity — fibre alone is not always enough, and can worsen bloating. No straining or prolonged toilet sitting. Procedures fail if constipation continues."},
    {tone:"amber", h:"Topicals: short-course symptom relief", html:"Chosen for the symptom — itch, pain, inflammation or irritation. They do not treat the haemorrhoid. Prolonged corticosteroid use causes skin atrophy, irritation and sensitisation; no repeated courses without reassessing the diagnosis. Uncomplicated haemorrhoids are generally self-care under the Greater Manchester OTC policy."},
    {tone:"blue", h:"Procedures are specialist-led", html:"Persistent symptomatic grade I–III despite conservative treatment → outpatient intervention, commonly rubber-band ligation or sclerotherapy, after examination and grading. Grade IV, large prolapsing or refractory → colorectal assessment for operative or other specialist treatment."},
    {tone:"red", h:"⚠ Thrombosed external haemorrhoid", html:"Acute severe pain with a tense, tender perianal lump. Arrange early clinical assessment; surgical excision may be considered — particularly within about 72 hours — if pain is severe and local expertise is available. Exclude perianal abscess and strangulated prolapse."}
  ],
  pathwaySub:"Five steps; the first protects the patient.",
  pathway:[
    {title:"Examine and assess colorectal cancer risk", html:"Perianal, rectal and abdominal examination; NG12 and FIT criteria before reassurance.", alert:true},
    {title:"Individualised stool softening", html:"Fibre and fluids, a bulk-forming or osmotic laxative as needed, no straining."},
    {title:"Short-course topical relief", html:"Chosen for the symptom; limited duration."},
    {title:"Refer for specialist intervention if not settling", html:"Outpatient procedures for grade I–III; colorectal assessment for grade IV or refractory."},
    {title:"Monitor bleeding, anaemia and recurrence", html:"Persistent bleeding despite treatment means reassessment, not more cream."}
  ],
  sections:[

    {id:"confirm", nav:"Examine", title:"Step 1 — examine, and consider what else bleeds",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>Minimum examination</b>","Inspect the perianal area for external haemorrhoids, thrombosis, fissure, prolapse, abscess, fistula or mass · digital rectal examination if tolerable, for a rectal mass or blood · abdominal examination · weight loss and systemic features · anoscopy or specialist examination if the diagnosis is uncertain"],
         ["<b>Deferred examination</b>","A rectal examination can be deferred if acutely painful — but arrange planned reassessment; do not reassure without examining"],
         ["<b>Typical presentation</b>","Internal haemorrhoids commonly bleed painlessly — bright red, on the paper or coating the stool — and may prolapse or cause mucus and itch. Pain suggests thrombosis, strangulation, fissure, abscess or another diagnosis"],
         ["<b>Grade</b>","I (no prolapse) · II (prolapses, reduces spontaneously) · III (needs manual reduction) · IV (irreducible)"],
         ["<b>Concerning features</b>","Change in bowel habit · unexplained weight loss · iron-deficiency anaemia · abdominal, rectal or anal mass · blood mixed with stool or darker blood · persistent or recurrent bleeding · family history. Age matters only in combination with specific symptoms, per NG12"],
         ["<b>Medicines and context</b>","Anticoagulants and antiplatelets in significant bleeding — do not stop without a clear indication and specialist advice. Pregnancy, frailty and immunosuppression"]
       ]}
     ]},

    {id:"urgent", nav:"Urgent", title:"Urgent or same-day assessment",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"Same day", html:"Heavy or ongoing bleeding · syncope or haemodynamic symptoms · severe pain with fever or systemic illness · suspected perianal abscess · irreducible, painful prolapse · urinary retention · rapidly progressive swelling."},
         {tone:"red", h:"Painful perianal lump", html:"Thrombosed external haemorrhoid, perianal abscess or strangulated prolapse — early assessment decides which."}
       ]}
     ]},

    {id:"nondrug", nav:"Soften", title:"Step 2 — individualised stool softening",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"🌾 Soft, formed stools", html:"Dietary fibre and fluids where appropriate. Add a bulk-forming laxative (ispaghula is the Greater Manchester first choice) or an osmotic laxative such as macrogol, according to stool consistency, tolerance and comorbidity. Bulk fibre can worsen bloating or obstructive symptoms and may not be enough if stools are already hard."},
         {tone:"amber", h:"🚽 Habits", html:"Don't strain or sit long on the toilet; respond to the urge promptly."},
         {tone:"green", h:"🧼 Hygiene and comfort", html:"Gentle cleaning, pat dry; warm baths can soothe."},
         {tone:"green", h:"⚖️ Weight and activity", html:"Healthy weight and activity; treat chronic constipation or chronic cough, which raise intra-abdominal pressure."},
         {tone:"blue", h:"🤰 Pregnancy", html:"Focus on fibre, fluids and preventing constipation, with short-term local relief where appropriate; check the product information before prescribing corticosteroid or anaesthetic preparations."}
       ]}
     ]},

    {id:"ladder", nav:"Ladder", title:"Step 3 — symptom relief, then specialist intervention",
     blocks:[
       {b:"table", head:["Step","What","When"], rows:[
         ["<b>Topical preparations</b>","Soothing or barrier creams; short courses of topical local anaesthetic or corticosteroid, chosen for the symptom","Symptom relief only — limit the duration; no repeated courses without reassessing the diagnosis; self-care in Greater Manchester for uncomplicated haemorrhoids"],
         ["<b>Outpatient intervention</b>","Commonly rubber-band ligation or sclerotherapy — specialist procedures after examination, grading and exclusion of other causes of bleeding","Persistent symptomatic grade I–III despite conservative treatment"],
         ["<b>Specialist or operative treatment</b>","Chosen by the colorectal team by grade, circumferential extent, external component, prolapse, previous procedures, continence risk, patient preference and local expertise","Grade IV, large prolapsing or refractory"],
         ["<b>Thrombosed external haemorrhoid</b>","Early clinical assessment; analgesia and conservative care, or excision in selected severe cases — particularly within about 72 hours — where expertise allows","Acute severe pain with a tense, tender lump"]
       ]}
     ]},

    {id:"monitor", nav:"Monitor", title:"Steps 4–5 — response, bleeding and review",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["<b>Symptoms and bleeding</b>","Each review","Persistent bleeding despite treatment → re-examine and reassess, rather than more topical treatment"],
         ["<b>Concerning features</b>","Ongoing","New change in bowel habit, weight loss or anaemia → apply NG12"],
         ["<b>Anaemia</b>","If bleeding is significant","FBC, and iron studies if indicated"],
         ["<b>Constipation</b>","Ongoing","Keep stools soft — this prevents recurrence"]
       ]}
     ]},

    {id:"notsettling", nav:"Not settling?", title:"Not settling? Re-check before referral",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"1 · Colorectal disease considered?", html:"Examination done, NG12 and FIT criteria reviewed — is the bleeding truly haemorrhoidal?"},
         {tone:"green", h:"2 · Stool soft?", html:"Has the straining actually stopped? Is an osmotic laxative needed?"},
         {tone:"blue", h:"3 · Grade", html:"Prolapse and higher grades may need a procedure rather than more cream."},
         {tone:"amber", h:"4 · Topical overuse", html:"Prolonged steroid or anaesthetic creams?"},
         {tone:"blue", h:"5 · Refer", html:"Persistent grade I–III → outpatient intervention; grade IV or refractory → colorectal assessment."}
       ]}
     ]},

    {id:"safety", nav:"Safety-net", title:"Safety-netting",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Bleeding that needs checking", html:"\"Blood mixed in with your stool or darker blood, a change in bowel habit, weight loss, tiredness or pallor, or bleeding that keeps going despite treatment — come back so we can look further.\""},
         {tone:"red", h:"🩸 Urgent", html:"\"Heavy bleeding, feeling faint, a painful swelling with fever, a lump that won't go back, or difficulty passing urine — seek urgent help.\""},
         {tone:"amber", h:"😣 Sudden severe pain", html:"\"Sudden severe pain with a tense lump may be a clotted pile — contact us early, because treatment options are best in the first few days.\""},
         {tone:"green", h:"🌾 Keep stools soft", html:"\"Fibre, fluids and not straining are the key to stopping them coming back.\""}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"When to refer",
     blocks:[
       {b:"cards", items:[
         {tone:"purple", h:"2WW · NICE NG12 and HTG690", html:"FIT ≥10 µg Hb/g in an adult meeting the FIT criteria → suspected colorectal cancer pathway. A rectal or anal mass, or unexplained anal ulceration → consider a suspected cancer pathway referral without waiting for FIT. A negative FIT does not override strong clinical concern or persisting symptoms."},
         {tone:"blue", h:"Outpatient intervention", html:"Persistent symptomatic grade I–III despite conservative treatment."},
         {tone:"amber", h:"Colorectal surgery", html:"Grade IV, large prolapsing or refractory haemorrhoids."},
         {tone:"red", h:"Same day", html:"Heavy or ongoing bleeding, haemodynamic symptoms, suspected abscess, irreducible painful prolapse, urinary retention, or a thrombosed external haemorrhoid with severe pain."},
         {tone:"cream", h:"GP management", html:"Examination and colorectal risk assessment, stool softening, short-course topicals, grading and the referral decision belong here. Related pages: <a href='anal-fissure.html'>anal fissure</a> · <a href='constipation-adult.html'>constipation</a> · <a href='ibs.html'>IBS</a> · <a href='iron-deficiency-anaemia.html'>iron deficiency anaemia</a> · <a href='../algorithms/rectal-bleeding.html'>rectal bleeding pathway</a>."}
       ]},
       {b:"say", html:"This looks like haemorrhoids. Typical piles are often painless, and the mainstay is keeping stools soft so you don't strain, plus a short course of soothing cream if needed. The creams ease symptoms but don't explain every cause of bleeding — so if the bleeding changes, keeps going, or your bowel habit changes, come back so we can look further."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 63-year-old man reports 3 months of <b>rectal bleeding</b> he is sure is \"my piles again\" — he had banding 8 years ago. On questioning, the blood is <b>sometimes mixed into the stool and darker</b>, his bowels are <b>looser than usual</b>, and he has <b>lost about 5 kg</b>. He asks for \"the cream that worked last time\" and does not want an examination."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Does not accept the patient's own attribution; recognises change in bowel habit, rectal bleeding at 50 or over, and weight loss; offers FIT and examination, and refers on the suspected cancer pathway if FIT is ≥10 µg Hb/g — or without waiting if a mass is found; negotiates the examination rather than abandoning it, explaining that previous piles exclude nothing; checks FBC; asks about anticoagulants; still addresses stool softening; safety-nets heavy bleeding and faintness."}
     ]}]},

     blocks:[

         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (May 2025)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — rectal or anal mass and unexplained anal ulceration; FIT criteria</span></li>'+
         '<li><b>NICE HTG690 (formerly DG30 and DG56) — Quantitative faecal immunochemical testing to guide colorectal cancer pathway referral</b><br><a href="https://www.nice.org.uk/guidance/htg690" rel="noopener">nice.org.uk/guidance/htg690</a><span class="rd"> — FIT groups and the ≥10 µg Hb/g threshold</span></li>'+

  foot:"Haemorrhoids in adults — NICE NG12 and HTG690. Examine (perianal, rectal, abdominal) and assess colorectal cancer risk before reassuring; visible piles do not exclude colorectal disease. Offer FIT per the NG12/HTG690 criteria and refer at ≥10 µg Hb/g; do not delay referral for a rectal or anal mass, unexplained anal ulceration or strong concern. Individualised stool softening is the foundation; topicals are short-course symptom relief. Procedures are specialist-led. Thrombosed external haemorrhoid: early assessment; excision may be considered, particularly within about 72 hours. Sources: NICE NG12, NICE HTG690, Greater Manchester formulary, BNF. Verify doses against the current BNF."
