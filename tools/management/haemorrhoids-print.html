<meta name="description" content="Haemorrhoids in adults: examine and assess colorectal cancer risk before reassuring, FIT per NICE NG12 and HTG690 without delaying referral for a rectal or anal mass or anal ulceration, individualised stool softening, short-course topicals, specialist-led procedures, urgent features, and early assessment of a thrombosed external haemorrhoid, with abscess and strangulation excluded." />

<script>
MG.render({
  icon:"🩸",
  title:"Haemorrhoids — the complete guide",
  eyebrow:"Protocol · adults · examine and assess cancer risk before you reassure",
  stemTitle:"Never attribute rectal bleeding to haemorrhoids unexamined — visible piles do not exclude colorectal disease, so examination and the NG12 criteria come before reassurance",
  stemSub:"One page for adults. Examine — perianal, digital rectal where tolerated, and abdominal — and apply the NICE NG12 and HTG690 criteria before reassuring. Treatment is conservative: individualised stool softening is the foundation, topical preparations are short-course symptom relief, and persistent symptoms despite appropriate conservative treatment may justify referral for intervention — grade alone does not determine referral. A tense, tender perianal lump with acute severe pain suggests a thrombosed external haemorrhoid — arrange early assessment, and exclude abscess and strangulated prolapse. NICE NG12 and HTG690 address cancer detection and FIT triage, not comprehensive haemorrhoid treatment.",
  guideline:"NICE NG12 · NICE HTG690 (FIT) · Greater Manchester formulary · BNF",
  reviewed:"25 September 2026",
  nextReview:"25 September 2027",
  meta:[
    {t:"Never attribute rectal bleeding to piles unexamined", tone:"tw"},
    {t:"Rectal or anal mass: refer without waiting for FIT", tone:"tw"},
    {t:"v2.1 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#confirm"><b>Examine</b><small>And assess risk</small></a><a href="#nondrug"><b>Soften</b><small>Individualised</small></a><a href="#ladder"><b>Ladder</b><small>Topical → specialist</small></a><a href="#urgent"><b>Urgent</b><small>Same day</small></a><a href="#refer"><b>Refer</b><small>NG12 · colorectal</small></a></div>',
  quickSub:"The six that matter. Cancer-triage figures trace to the sources under <a href=\"#provenance\">Evidence</a>; procedural and timing statements are expert consensus.",
  quick:[
    {tone:"red", h:"⚠ Never attribute rectal bleeding to haemorrhoids unexamined", html:"Visible haemorrhoids do not exclude proximal colorectal disease — a patient can have both. Examine, ask about change in bowel habit, weight loss, anaemia, blood mixed with stool or darker blood, a mass, persistent or recurrent bleeding and family history, and apply NG12 before reassuring. A previous diagnosis of piles is not a current one."},
    {tone:"purple", h:"NICE NG12 and HTG690 — FIT <span class='tw'>Suspected cancer</span>", html:"Offer quantitative FIT to adults with a change in bowel habit, iron-deficiency anaemia, an abdominal mass, unexplained weight loss with abdominal pain at 40 or over, rectal bleeding with abdominal pain or weight loss under 50, rectal bleeding, abdominal pain or weight loss at 50 or over, or anaemia at 60 or over (even if not iron-deficiency anaemia). <b>FIT ≥10 µg Hb/g → suspected colorectal cancer pathway.</b> Rectal mass, unexplained anal mass or unexplained anal ulceration: refer through the appropriate suspected cancer pathway — do not wait for FIT. Abdominal mass: offer FIT where appropriate, but do not delay urgent referral or investigation if clinical concern is high."},
    {tone:"green", h:"Soft, formed stools are the foundation", html:"Fibre and fluids where appropriate; add a bulk-forming or osmotic laxative according to stool consistency, tolerance and comorbidity — fibre alone is not always enough, and can worsen bloating; macrogol may be more useful when stools are hard or constipation is established. No straining or prolonged toilet sitting. Procedures fail if constipation continues."},
    {tone:"amber", h:"Topicals: short-course symptom relief", html:"Chosen for the dominant symptom — itch, pain, inflammation or irritation — and not interchangeable: products may contain corticosteroid, local anaesthetic, astringent/barrier or antiseptic ingredients. Follow the specific product information for duration, age, pregnancy, breastfeeding and contraindications. They do not treat the haemorrhoid. Prolonged corticosteroid use causes skin atrophy, irritation and sensitisation; no repeated courses without reassessing the diagnosis. Uncomplicated haemorrhoids are generally self-care under the Greater Manchester OTC policy."},
    {tone:"blue", h:"Procedures are specialist-led", html:"Persistent symptoms despite appropriate conservative treatment may justify referral for outpatient intervention. Rubber-band ligation is commonly used for internal grade I–II and selected grade III haemorrhoids, depending on anatomy, symptoms, local expertise and patient preference. Grade III and IV disease, substantial external components, circumferential prolapse, recurrence or failed previous procedures may need colorectal assessment. Grade alone should not determine referral."},
    {tone:"red", h:"⚠ Thrombosed external haemorrhoid", html:"Acute severe pain with a tense, tender perianal lump suggests a thrombosed external haemorrhoid, but perianal abscess and strangulated prolapse must be excluded. Arrange early clinical assessment. Selected patients with severe pain and an early presentation may be considered for surgical excision by an appropriately experienced clinician; otherwise use analgesia, stool-softening treatment and conservative care with safety-netting."}
  ],
  pathwaySub:"Five steps; the first protects the patient.",
  pathway:[
    {title:"Examine and assess colorectal cancer risk", html:"Document the bleeding pattern and risk features; perianal, rectal (if tolerated) and abdominal examination; exclude urgent pathology; apply the exact NG12 and FIT criteria before reassurance.", alert:true},
    {title:"Individualised stool softening", html:"Fibre and fluids, a bulk-forming or osmotic laxative as needed, no straining."},
    {title:"Short-course topical relief", html:"Chosen for the symptom; limited duration."},
    {title:"Refer for specialist intervention if not settling", html:"Persistent symptoms despite conservative treatment → outpatient intervention or colorectal assessment, guided by symptoms, prolapse, external component and patient factors — not grade alone."},
    {title:"Monitor bleeding, anaemia and recurrence", html:"Persistent bleeding despite treatment means re-examination, FBC/ferritin where indicated, review of FIT and the referral pathway — not more cream."}
  ],
  sections:[

    {id:"confirm", nav:"Examine", title:"Step 1 — examine, and consider what else bleeds",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>Minimum examination</b>","Inspect the perianal area for external haemorrhoids, thrombosis, fissure, prolapse, abscess, fistula or mass · digital rectal examination if tolerable, for a rectal mass or blood · abdominal examination · weight loss and systemic features · also look for rectal prolapse, perianal Crohn's disease and proctitis, including sexually transmitted infection where relevant · follow consent and chaperone requirements · anoscopy/proctoscopy is not essential in every GP consultation and depends on training, equipment and local pathway · a normal digital rectal examination does not exclude proximal colorectal pathology"],
         ["<b>Deferred examination</b>","A digital rectal examination may be inappropriate during severe acute pain. Inability to examine because of pain should trigger treatment of the acute problem and planned reassessment — not reassurance"],
         ["<b>History to document</b>","Amount, duration and pattern of bleeding · bright red versus dark or mixed blood · on the paper, coating the stool, dripping or mixed in · bowel-habit change · weight loss · abdominal or rectal pain · mucus or tenesmus · family history · anticoagulants/antiplatelets · provisional diagnosis and grade if haemorrhoids are identified"],
         ["<b>Typical presentation</b>","Internal haemorrhoids commonly bleed painlessly — bright red, on the paper or coating the stool — and may prolapse or cause mucus and itch. Pain suggests thrombosis, strangulation, fissure, abscess or another diagnosis"],
         ["<b>Grade</b>","I (no prolapse) · II (prolapses, reduces spontaneously) · III (needs manual reduction) · IV (irreducible)"],
         ["<b>Concerning features</b>","Change in bowel habit · unexplained weight loss · iron-deficiency anaemia · abdominal, rectal or anal mass · blood mixed with stool or darker blood · persistent or recurrent bleeding · family history. Age matters only in combination with specific symptoms, per NG12"],
         ["<b>Medicines and context</b>","Anticoagulants and antiplatelets in significant bleeding — do not stop without a clear indication and specialist advice. Do not attribute bleeding to anticoagulation alone: examine and investigate according to the same colorectal-risk principles. For heavy or haemodynamically significant bleeding, arrange urgent hospital assessment with a complete medication history, including the last anticoagulant dose and renal function. Pregnancy, frailty and immunosuppression"],
         ["<b>Iron-deficiency anaemia</b>","Not adequately explained by uncomplicated haemorrhoids until other causes have been considered. Arrange appropriate gastrointestinal investigation according to the local pathway, irrespective of whether haemorrhoids are visible. FIT may help prioritise but does not replace iron-deficiency assessment or delay referral when clinically indicated"]
       ]}
     ]},

    {id:"urgent", nav:"Urgent", title:"Urgent or same-day assessment",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"Emergency department / 999", html:"Haemodynamic instability · syncope or presyncope with ongoing bleeding · major or rapidly increasing rectal bleeding · suspected significant acute gastrointestinal haemorrhage · severe anaemia with symptoms · severe abdominal pain or peritonism."},
         {tone:"red", h:"Same-day surgical / urgent assessment", html:"Suspected perianal abscess · painful irreducible prolapse · urinary retention associated with prolapse · rapidly progressive perianal swelling · severe pain with diagnostic uncertainty · fever or systemic illness."},
         {tone:"amber", h:"Painful perianal lump", html:"Thrombosed external haemorrhoid, perianal abscess or strangulated prolapse — early assessment decides which. A thrombosed external haemorrhoid without the features above is usually an early outpatient or urgent primary-care assessment, not emergency admission; same-day assessment if there is diagnostic uncertainty, fever, suspected abscess, rapidly progressive swelling, urinary retention, severe uncontrolled pain, immunosuppression or significant frailty."}
       ]}
     ]},

    {id:"lumps", nav:"Painful lump", title:"Telling painful perianal conditions apart",
     blocks:[
       {b:"table", head:["Condition","Distinguishing features"], rows:[
         ["<b>Thrombosed external haemorrhoid</b>","Sudden severe localised pain · tender bluish or purple perianal lump · usually no fever or systemic illness"],
         ["<b>Perianal abscess</b>","Progressive throbbing pain · erythema, warmth or induration · fever or systemic upset may occur · fluctuance may be absent · urgent surgical assessment required"],
         ["<b>Strangulated prolapsed internal haemorrhoid</b>","Irreducible prolapse · severe pain · congested, dusky or necrotic tissue · possible urinary retention"],
         ["<b>Anal fissure</b>","Severe sharp or tearing pain during and after defecation · visible fissure, often posterior midline · bleeding usually small-volume and bright red"]
       ]}
     ]},

    {id:"nondrug", nav:"Soften", title:"Step 2 — individualised stool softening",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"🌾 Soft, formed stools", html:"Dietary fibre and fluids where appropriate. Add a bulk-forming laxative (ispaghula is the Greater Manchester first choice) or an osmotic laxative such as macrogol, according to stool consistency, tolerance and comorbidity. Bulk fibre can worsen bloating or obstructive symptoms and may not be enough if stools are already hard. Avoid increasing fibre rapidly with marked bloating, severe pain, suspected obstruction or significant faecal loading. Ispaghula requires adequate fluid intake. Macrogol may be more useful when stools are hard or constipation is established. Consider a stimulant laxative only where clinically appropriate and according to the constipation pathway. Review treatment if symptoms do not improve."},
         {tone:"red", h:"⚠ Laxative cautions", html:"Bowel obstruction or ileus · severe abdominal pain or vomiting · inability to swallow · fluid restriction · frailty · faecal impaction · pregnancy · significant renal or cardiac disease where fluid advice needs individualisation."},
         {tone:"amber", h:"🚽 Habits", html:"Don't strain or sit long on the toilet; respond to the urge promptly."},
         {tone:"green", h:"🧼 Hygiene and comfort", html:"Gentle cleaning, pat dry; warm baths can soothe."},
         {tone:"green", h:"⚖️ Weight and activity", html:"Healthy weight and activity; treat chronic constipation or chronic cough, which raise intra-abdominal pressure."},
         {tone:"blue", h:"🤰 Pregnancy", html:"Focus on fibre, fluids and preventing constipation, with short-term local relief where appropriate; check the product information before prescribing corticosteroid or anaesthetic preparations."}
       ]}
     ]},

    {id:"ladder", nav:"Ladder", title:"Step 3 — symptom relief, then specialist intervention",
     blocks:[
       {b:"table", head:["Step","What","When"], rows:[
         ["<b>Topical preparations</b>","Soothing or barrier creams; short courses of topical local anaesthetic or corticosteroid, selected according to the dominant symptom; follow the specific product information for duration, age, pregnancy, breastfeeding and contraindications. Corticosteroids: avoid prolonged or repeated use, application to ulcerated or infected skin unless specifically advised, and use when the diagnosis is uncertain; warn about skin atrophy, irritation and sensitisation. Local anaesthetics: avoid prolonged use; risk of sensitisation","Symptom relief only — limit the duration; no repeated courses without reassessing the diagnosis; self-care in Greater Manchester for uncomplicated haemorrhoids"],
         ["<b>Outpatient intervention</b>","Rubber-band ligation is commonly used for internal grade I–II and selected grade III haemorrhoids, depending on anatomy, symptoms, local expertise and patient preference — specialist procedures after examination, grading and exclusion of other causes of bleeding","Persistent symptoms despite appropriate conservative treatment. Decide on bleeding severity and persistence, prolapse, pain, external component, continence, previous banding or surgery, comorbidity and anticoagulation, and patient preference — not grade alone"],
         ["<b>Specialist or operative treatment</b>","Chosen by the colorectal team by grade, circumferential extent, external component, prolapse, previous procedures, continence risk, patient preference and local expertise","Grade III and IV disease, substantial external components, circumferential prolapse, recurrence or failed previous procedures"],
         ["<b>Thrombosed external haemorrhoid</b>","Early clinical assessment, excluding perianal abscess and strangulated prolapse. Selected patients with severe pain and an early presentation may be considered for surgical excision by an appropriately experienced clinician; otherwise analgesia, stool-softening treatment and conservative care with safety-netting","Acute severe pain with a tense, tender lump"]
       ]}
     ]},

    {id:"monitor", nav:"Monitor", title:"Steps 4–5 — response, bleeding and review",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["<b>Symptoms and bleeding</b>","Each review","Persistent bleeding despite treatment → repeat examination; reconsider fissure, inflammatory bowel disease, proctitis, neoplasia and medication-related bleeding; review the FIT result and referral pathway; consider colorectal or lower-GI assessment — rather than more topical treatment"],
         ["<b>Concerning features</b>","Ongoing","New change in bowel habit, weight loss or anaemia → apply NG12"],
         ["<b>Anaemia</b>","Rectal bleeding or suspected haemorrhoids","FBC; ferritin; transferrin saturation or other iron studies where ferritin may be misleading; renal function and inflammatory markers where clinically indicated. Iron-deficiency anaemia → investigate according to the local GI pathway; do not attribute it to haemorrhoids"],
         ["<b>Constipation</b>","Ongoing","Keep stools soft — this prevents recurrence"]
       ]}
     ]},

    {id:"notsettling", nav:"Not settling?", title:"Not settling? Re-check before referral",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"1 · Colorectal disease considered?", html:"Examination done, NG12 and FIT criteria reviewed — is the bleeding truly haemorrhoidal?"},
         {tone:"green", h:"2 · Stool soft?", html:"Has the straining actually stopped? Is an osmotic laxative needed?"},
         {tone:"blue", h:"3 · Grade and symptoms", html:"Prolapse, external component and persistent bleeding may need a procedure rather than more cream — grade alone does not decide."},
         {tone:"amber", h:"4 · Topical overuse", html:"Prolonged steroid or anaesthetic creams?"},
         {tone:"blue", h:"5 · Refer", html:"Persistent symptoms despite conservative treatment → outpatient intervention; grade III–IV, substantial external component, circumferential prolapse, recurrence or failed procedures → colorectal assessment."}
       ]}
     ]},

    {id:"safety", nav:"Safety-net", title:"Safety-netting",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Bleeding that needs checking", html:"\"Blood mixed in with your stool or darker blood, a change in bowel habit, weight loss, tiredness or pallor, or bleeding that keeps going despite treatment — come back so we can look further.\""},
         {tone:"red", h:"🩸 Urgent", html:"\"Heavy bleeding, feeling faint, a painful swelling with fever, a lump that won't go back, or difficulty passing urine — seek urgent help.\""},
         {tone:"amber", h:"😣 Sudden severe pain", html:"\"Sudden severe pain with a tense lump may be a clotted pile — contact us early so we can assess it and check it is not an abscess.\""},
         {tone:"green", h:"🌾 Keep stools soft", html:"\"Fibre, fluids and not straining are the key to stopping them coming back.\""}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"When to refer",
     blocks:[
       {b:"cards", items:[
         {tone:"purple", h:"Suspected cancer · NICE NG12 and HTG690", html:"FIT ≥10 µg Hb/g in an adult meeting the FIT criteria → suspected colorectal cancer pathway. The pathway applies to quantitative FIT using an approved analyser — not qualitative faecal occult blood testing or a screening-test result transposed into the symptomatic pathway. Rectal mass, unexplained anal mass or unexplained anal ulceration → refer through the appropriate suspected cancer pathway; do not wait for FIT. Abdominal mass → offer FIT where appropriate, but do not delay urgent referral or investigation if concern is high. FIT &lt;10 µg Hb/g, no sample or negative result: safety-net actively. A negative FIT does not exclude colorectal cancer or other significant bowel disease — persistent or recurrent unexplained bleeding, ongoing change in bowel habit, iron-deficiency anaemia, a mass or strong clinical concern needs further assessment through the appropriate pathway."},
         {tone:"blue", h:"Outpatient intervention", html:"Persistent symptoms despite appropriate conservative treatment — banding commonly for internal grade I–II and selected grade III, decided on symptoms, anatomy, local expertise and patient preference."},
         {tone:"amber", h:"Colorectal surgery", html:"Grade III and IV disease, substantial external components, circumferential prolapse, recurrence or failed previous procedures."},
         {tone:"red", h:"Emergency or same day", html:"Emergency department/999: haemodynamic instability, syncope or presyncope with ongoing bleeding, major or rapidly increasing bleeding, severe symptomatic anaemia, severe abdominal pain or peritonism. Same-day surgical assessment: suspected abscess, painful irreducible prolapse, urinary retention, rapidly progressive swelling, severe pain with diagnostic uncertainty, fever or systemic illness. A thrombosed external haemorrhoid without these features is usually an early outpatient or urgent primary-care assessment."},
         {tone:"cream", h:"GP management", html:"Examination and colorectal risk assessment, stool softening, short-course topicals, grading and the referral decision belong here. Refer via the local Bolton/Greater Manchester suspected lower-GI cancer and colorectal outpatient pathways. Related pages: <a href='anal-fissure.html'>anal fissure</a> · <a href='constipation-adult.html'>constipation</a> · <a href='ibs.html'>IBS</a> · <a href='iron-deficiency-anaemia.html'>iron deficiency anaemia</a> · <a href='../algorithms/rectal-bleeding.html'>rectal bleeding pathway</a>."}
       ]},
       {b:"say", html:"This looks like haemorrhoids. Typical piles are often painless, and the mainstay is keeping stools soft so you don't strain, plus a short course of soothing cream if needed. The creams ease symptoms but don't explain every cause of bleeding — so if the bleeding changes, keeps going, or your bowel habit changes, come back so we can look further."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 63-year-old man reports 3 months of <b>rectal bleeding</b> he is sure is \"my piles again\" — he had banding 8 years ago. On questioning, the blood is <b>sometimes mixed into the stool and darker</b>, his bowels are <b>looser than usual</b>, and he has <b>lost about 5 kg</b>. He asks for \"the cream that worked last time\" and does not want an examination."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Does not accept the patient's own attribution; recognises change in bowel habit, rectal bleeding at 50 or over, and weight loss; offers FIT and examination, and refers on the suspected cancer pathway if FIT is ≥10 µg Hb/g — or without waiting if a mass is found; negotiates the examination rather than abandoning it, explaining that previous piles exclude nothing; checks FBC; asks about anticoagulants; still addresses stool softening; safety-nets heavy bleeding and faintness."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Cancer-triage figures trace to NICE NG12 and HTG690, which address cancer detection and FIT triage, not comprehensive haemorrhoid treatment. Procedural and timing statements are expert consensus pending a colorectal source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (May 2025)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — rectal or anal mass and unexplained anal ulceration; FIT criteria</span></li>'+
         '<li><b>NICE HTG690 (formerly DG30 and DG56) — Quantitative faecal immunochemical testing to guide colorectal cancer pathway referral</b><br><a href="https://www.nice.org.uk/guidance/htg690" rel="noopener">nice.org.uk/guidance/htg690</a><span class="rd"> — FIT groups and the ≥10 µg Hb/g threshold</span></li>'+
         '<li><b>Greater Manchester Medicines Management Group formulary — gastro-intestinal system; OTC policy</b><br><a href="https://www.greatermanchesterformulary.nhs.uk" rel="noopener">greatermanchesterformulary.nhs.uk — gastro-intestinal system</a><span class="rd"> — ispaghula first choice; self-care for uncomplicated haemorrhoids</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — haemorrhoid preparations and laxatives; check the specific product information (SmPC) for each topical corticosteroid, local anaesthetic and laxative</span></li>'+
         '<li><b>Association of Coloproctology of Great Britain and Ireland (ACPGBI) or local colorectal pathway</b><span class="rd"> — procedural haemorrhoid management; to be confirmed against the current local colorectal pathway</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Haemorrhoids in adults — NICE NG12 and HTG690. Examine (perianal, rectal, abdominal) and assess colorectal cancer risk before reassuring; visible piles do not exclude colorectal disease. Offer quantitative FIT per the NG12/HTG690 criteria and refer at ≥10 µg Hb/g; do not wait for FIT with a rectal mass, unexplained anal mass or anal ulceration, and do not delay urgent referral for an abdominal mass when concern is high. A negative FIT does not exclude significant disease. Individualised stool softening is the foundation; topicals are short-course, product-specific symptom relief. Procedures are specialist-led and not decided by grade alone. Thrombosed external haemorrhoid: early assessment, excluding abscess and strangulation; excision may be considered in selected early, severe cases by an experienced clinician. Sources: NICE NG12, NICE HTG690, Greater Manchester formulary, BNF. Verify doses against the current BNF."
});
</script>
