<script>
MG.render({
  icon:"💧",
  title:"Dry eye disease — the complete guide",
  eyebrow:"Protocol · adults · chronic ocular-surface disease",
  stemTitle:"Dry-eye symptoms are common and usually chronic — but symptoms suggest dry eye, they do not confirm it",
  stemSub:"<b>Assessment and management of dry eye disease in adults in primary care.</b> Dry-eye symptoms suggest but do not confirm dry-eye disease. First check visual acuity and ask about pain, photophobia, reduced vision, marked unilateral redness, trauma, recent surgery and contact-lens use. <b>Same-day assessment is required for significant pain, photophobia, reduced or deteriorating vision, corneal opacity/infiltrate/ulcer/epithelial defect, suspected keratitis, chemical injury or a painful red eye in a contact-lens wearer.</b> Corneal staining alone is not necessarily an emergency. For uncomplicated symptoms, advise regular lubricants, preservative-free preparations when frequent or long-term use is needed, night gel/ointment if appropriate, lid hygiene for blepharitis/meibomian gland dysfunction (MGD) and avoidance of airflow/smoke. In Greater Manchester, uncomplicated dry eye is generally managed with self-care and OTC lubricants. Review persistent or moderate disease and refer for ocular-surface assessment. <b>Do not prescribe oral antibiotics for dry eye alone.</b>",
  guideline:"College of Optometrists CMGs (dry eye, ocular rosacea) · TFOS DEWS II · BSR Sjögren guideline (2024) · NICE TA369 (ciclosporin only) · RCOphth serum eye drops (2017) · GMMMG eye formulary",
  reviewed:"25 September 2026",
  nextReview:"25 September 2027",
  meta:[
    {t:"Painful red eye = not simple dry eye", tone:"tw"},
    {t:"No routine antibiotics for dry eye alone", tone:"tw"},
    {t:"Staining alone ≠ emergency", tone:"tw"},
    {t:"GM: self-care / OTC lubricants", tone:"tw"},
    {t:"v2.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#assess"><b>Assess</b><small>Signs, not just symptoms</small></a><a href="#treat"><b>Treat</b><small>Lubricant-first</small></a><a href="#lids"><b>Lids</b><small>Blepharitis · MGD</small></a><a href="#sjogren"><b>Sjögren\'s</b><small>When to think of it</small></a><a href="#refer"><b>Refer</b><small>When and where</small></a></div>',
  quickSub:"The five that matter. Numbers in square brackets refer to the numbered sources under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Same-day eye assessment", html:"Moderate or severe new pain · photophobia · reduced or deteriorating vision · corneal opacity, infiltrate, ulcer, thinning or epithelial defect · suspected microbial, herpetic or acanthamoeba keratitis · significant unilateral ciliary injection · hypopyon · <b>painful red eye in a contact-lens wearer</b> · chemical injury (irrigate first) · significant trauma · recent ocular surgery or trauma with new/worsening pain, photophobia, reduced vision, discharge, corneal abnormality or increasing redness · proptosis or painful/restricted eye movements. <b>Corneal staining alone is not necessarily an emergency.</b> [1][3][10]"},
    {tone:"amber", h:"Symptoms suggest — they do not confirm", html:"Grittiness, burning and blur that clears with blinking are suggestive. Persistent, moderate or atypical symptoms need assessment of visual acuity, the ocular surface, cornea and eyelids by an optometrist or ophthalmologist."},
    {tone:"green", h:"Lubricants first, used regularly", html:"Ocular lubricant drops by day. <b>Preservative-free</b> when drops are required frequently, long-term, with contact lenses, or where preservative sensitivity or ocular-surface toxicity is suspected — a practical trigger is more than approximately 4–6 applications daily, but prescribe according to symptoms, product formulation and local formulary. Gel or ointment at bedtime for symptoms on waking. In Greater Manchester, uncomplicated dry eye is generally self-care with OTC lubricants. [1][7]"},
    {tone:"amber", h:"No routine oral antibiotics", html:"Do not prescribe systemic antibiotics for dry eye alone. For persistent moderate–severe MGD or ocular rosacea despite adequate lid care, refer for optometry/ophthalmology assessment — any systemic tetracycline is a specialist- or optometrist-led decision. [4][9]"},
    {tone:"blue", h:"Think Sjögren's — without over-calling it", html:"Consider it with persistent troublesome dry eyes <b>and</b> dry mouth, dental caries, oral candida, parotid swelling, fatigue, inflammatory arthralgia or autoimmune disease. Arthralgia is not required; dry eyes and dry mouth alone are common. Do not routinely test in isolated, mild dry-eye symptoms; use the local pathway. [5]"}
  ],
  pathwaySub:"Five steps. The first is to make sure this is not a painful red eye.",
  pathway:[
    {title:"Triage the red eye", html:"Significant pain, photophobia, reduced vision, corneal opacity/infiltrate/ulcer/epithelial defect, suspected keratitis, chemical injury or a contact-lens wearer with a painful red eye → same-day eye assessment. Staining alone is not an emergency.", alert:true},
    {title:"Assess and look for contributors", html:"Visual acuity, lids, cornea, contact-lens and medication history, systemic clues."},
    {title:"Lubricants, stepped", html:"Self-care/OTC drops by day, preservative-free if frequent or long-term; gel or ointment at night; lipid-containing drops may help evaporative disease — response guides continuation."},
    {title:"Treat lids and environment", html:"Lid hygiene for blepharitis/MGD; regular breaks and blinking, airflow, smoke; review drying medicines without stopping essential treatment."},
    {title:"Review, re-assess or refer", html:"Review at 4–6 weeks if persistent, treated or uncertain; community optometry first, hospital for corneal or severe disease; urgent cases via the local GM/Bolton urgent eye-care pathway."}
  ],
  sections:[

    {id:"assess", nav:"Assess", title:"Step 1 — assess: signs, not just symptoms",
     blocks:[
       {b:"warn", html:"<b>Scope:</b> this protocol applies to adults only. Do not extrapolate the doxycycline, systemic treatment or referral advice to children. Pregnancy, breastfeeding, contact-lens complications, postoperative disease and significant corneal disease require specific advice or specialist assessment."},
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>Suggestive symptoms</b>","Grittiness, burning, foreign-body sensation, fluctuating blur relieved by blinking; worse with screens, air-conditioning and wind; usually bilateral"],
         ["<b>Examine in primary care</b>","Visual acuity · conjunctival injection · corneal clarity or opacity · pupils where indicated · eyelids and lid margins · contact-lens history · pain, photophobia and visual disturbance · medication and systemic review"],
         ["<b>Formal dry-eye assessment</b>","Fluorescein staining, tear break-up time, conjunctival hyperaemia and eyelid/MGD status — usually by an optometrist or ophthalmologist"],
         ["<b>Contributors</b>","Screen use (reduced blinking) · contact lenses · low humidity and air-conditioning · ageing · blepharitis/MGD · rosacea · seborrhoeic dermatitis"],
         ["<b>Medicines to review</b>","Antihistamines · anticholinergics · tricyclic and other antidepressants · beta-blockers · isotretinoin · some diuretics · preservatives in eye drops. HRT is a possible contributor only. Review potentially drying medicines, but do not stop essential treatment solely because of dry-eye symptoms — beta-blockers and HRT should not routinely be changed; consider alternatives only where clinically appropriate"],
         ["<b>Other diagnoses</b>","Blepharitis · allergic or infective conjunctivitis · marginal keratitis · anterior uveitis · corneal abrasion or ulcer · herpes simplex keratitis · episcleritis or scleritis · glaucoma · nasolacrimal disease · medication-related ocular toxicity · thyroid eye disease · incomplete lid closure · neuropathic ocular pain (severe symptoms with few signs)"]
       ]},
       {b:"warn", html:"<b>Contact lenses:</b> remove contact lenses immediately, do not replace them, and arrange same-day assessment if there is pain, redness, photophobia, discharge or reduced vision; advise the patient to bring the lens, case and cleaning solution if keratitis is suspected. <b>Chemical injury:</b> immediate copious irrigation while arranging urgent ophthalmic assessment — referral must not delay irrigation. <b>Persistent unilateral redness</b>, especially with pain, photophobia, discharge, reduced vision or ciliary injection, should not be managed repeatedly as dry eye without ocular examination. [1][10]"},
       {b:"why", html:"A contact-lens wearer with a painful red eye should never be treated as uncomplicated dry eye. A red eye with pain on eye movement, proptosis, diplopia or systemic illness points to orbital or preseptal disease."}
     ]},

    {id:"treat", nav:"Treat", title:"Step 2 — lubricants, stepped",
     blocks:[
       {b:"table", head:["Step","What","Notes"], rows:[
         ["<b>1 · Daytime drops</b>","Hypromellose or carbomer drops, used regularly — usually OTC self-care in Greater Manchester","Use <b>preservative-free</b> preparations when drops are required frequently, long-term, with contact lenses, or where preservative sensitivity or ocular-surface toxicity is suspected. A practical trigger is more than approximately 4–6 applications daily, but prescribe according to symptoms, product formulation and local formulary. Occasional use of a preserved preparation is not automatically inappropriate, and preservative-free is not necessarily better for every patient — formulation, comfort, dosing burden and affordability matter [1][7]"],
         ["<b>2 · Evaporative / MGD pattern</b>","Lipid-containing lubricant","May be useful where evaporative disease or MGD predominates, per the local formulary; treatment response should guide continuation"],
         ["<b>3 · Night-time</b>","Carbomer gel or paraffin-based ointment at bedtime","Ointment blurs vision for several hours — use at bedtime; no driving or hazardous activity until vision is clear. Avoid ointment while contact lenses are being worn. Gel if ointment is poorly tolerated"],
         ["<b>4 · Specialist therapies</b>","Ciclosporin, punctal occlusion, autologous serum","Optometry or ophthalmology only — see Specialist"]
       ]},
       {b:"warn", html:"Frequent preserved (benzalkonium-containing) drops can themselves aggravate ocular-surface disease — another reason to use preservative-free drops for high-frequency or long-term use."},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"Greater Manchester prescribing", html:"Uncomplicated dry eye is generally managed with self-care and OTC lubricants. Consider NHS prescribing only where local policy permits — for example in severe disease, significant disability, inability to self-fund treatment, or where a specific preservative-free formulation is clinically necessary. Check the current GM commissioning statement and formulary. Inclusion in the formulary does not mean routine GP prescribing is supported.", src:"GMMMG eye formulary [7]"},
         {tone:"green", h:"Choosing and using lubricants", html:"Choose a lubricant according to symptom pattern, patient preference, tolerability, viscosity, frequency of use and local formulary — there is no validated subtype-to-product algorithm. Allow time between different topical preparations · ointment generally at bedtime because it blurs vision · avoid ointment while contact lenses are worn · check individual product instructions for contact-lens use and re-insertion time · teach correct drop technique, avoiding contact between the bottle tip and the eye.", src:"College of Optometrists CMG [1]"}
       ]}
     ]},

    {id:"lids", nav:"Lids", title:"Step 3 — treat the lids and the environment",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"🔥 Lid hygiene for blepharitis/MGD", html:"Use a gentle, comfortably warm (not hot) compress for 5–10 minutes — take particular care in older people or those with reduced sensation — then lid-margin cleansing, once or twice daily, continued long-term [1]. Avoid aggressive squeezing or massage; vigorous lid massage or gland expression is not routinely recommended in primary care. Proprietary lid-warming devices may be considered, but evidence and cost-effectiveness vary. Do not recommend tea-tree oil products without qualification — they can irritate the ocular surface and need careful use, particularly for Demodex. If significant MGD, recurrent chalazia, Demodex or ocular rosacea is suspected, consider optometry/ophthalmology assessment. See <a href='blepharitis.html'>blepharitis</a>."},
         {tone:"amber", h:"💊 Oral antibiotics — not for dry eye alone", html:"Do not prescribe systemic antibiotics for dry eye alone. For persistent moderate–severe MGD or ocular rosacea despite adequate lid care, refer for optometry/ophthalmology assessment. If a systemic tetracycline is recommended, the prescriber should confirm the indication, dose, duration, interactions and product information — doses vary by indication (modified-release doxycycline 40 mg once daily is licensed for papulopustular rosacea; 100 mg once daily is used off-label in some ocular-rosacea/MGD pathways), and duration is usually limited and reviewed. <b>Cautions:</b> tetracyclines are contraindicated in pregnancy · avoid doxycycline in children under 12 years · counsel about photosensitivity and oesophageal irritation · separate from iron, calcium, magnesium and aluminium-containing preparations · review anticoagulants and other relevant interactions · reassess benefit and avoid indefinite repeat courses without review.", src:"CoO ocular rosacea CMG [4] · PCDS / BAD rosacea [9] · BNF/SPC [11]"},
         {tone:"cream", h:"🩺 Blepharitis — which type?", html:"Distinguish anterior blepharitis, posterior blepharitis/MGD, ocular rosacea and Demodex-associated disease. Most blepharitis is managed with regular lid hygiene and treatment of associated skin disease. Topical or systemic antibiotics should not be used routinely; consider specialist advice for persistent, severe or corneal-involving disease. Topical steroid or antibiotic–steroid combinations are not part of this GP pathway."},
         {tone:"green", h:"💻 Screens and blinking", html:"Take regular breaks during prolonged visual tasks and consciously blink more often; screen slightly below eye level. The 20-20-20 rule is an optional patient tip only, not a clinical recommendation."},
         {tone:"green", h:"💨 Environment", html:"Avoid direct fan, heater and air-conditioning airflow; wraparound glasses outdoors in wind; avoid smoke and irritants. A humidifier may help in a dry room but is not essential. Maintain normal hydration. Drinking excessive amounts of water does not treat ordinary dry-eye disease."},
         {tone:"blue", h:"👓 Contact lenses", html:"Reduce wear time and use lubricants compatible with the lens — check product instructions for re-insertion time. If there is pain, redness, photophobia, discharge or reduced vision: remove the lenses immediately, do not replace them, and arrange same-day assessment; bring the lens, case and solution if keratitis is suspected."}
       ]}
     ]},

    {id:"sjogren", nav:"Sjögren's", title:"Sjögren's and systemic causes",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"When to think of it", html:"Persistent troublesome dry eyes and dry mouth · difficulty swallowing dry food · recurrent dental caries or oral candida · needing drops very frequently · parotid or salivary-gland swelling · inflammatory arthralgia, fatigue or systemic features · associated autoimmune disease. Arthralgia is not required."},
         {tone:"blue", h:"What to do", html:"There is no single primary-care screening test. Do not routinely test for Sjögren disease in isolated, mild dry-eye symptoms, and do not request ANA without clinical indicators of connective-tissue disease. If there is persistent troublesome sicca, dry mouth with dental consequences, recurrent parotid swelling, inflammatory joint/systemic symptoms or associated autoimmune disease, assess clinically and consider (clinically directed, not a mandatory screen) FBC, renal profile, LFTs, inflammatory markers, immunoglobulins and ANA/ENA according to the local pathway. If suspicion remains high, a negative ANA does not exclude Sjögren disease and ENA/anti-Ro should still be considered. If suspicion persists, refer via the local sicca or rheumatology pathway; dental, ophthalmology or oral-medicine input may also be needed.", src:"BSR Sjögren guideline 2024 [5]"},
         {tone:"cream", h:"Other causes of sicca", html:"Anticholinergic and antihistamine medicines · antidepressants · diabetes · thyroid disease · dehydration · mouth breathing · previous head and neck radiotherapy · hepatitis C or HIV where clinically relevant · graft-versus-host disease · IgG4-related disease and other systemic conditions where indicated. Avoid over-investigation in patients with dry eyes alone."}
       ]},
       {b:"why", html:"Sjögren disease can combine aqueous deficiency, MGD and ocular-surface inflammation, which is why coordinated ophthalmic and systemic assessment matters (BSR 2024) [5]."}
     ]},

    {id:"specialist", nav:"Specialist", title:"Specialist therapies — not primary-care steps",
     blocks:[
       {b:"cards", cols:3, items:[
         {tone:"blue", h:"Topical ciclosporin", html:"Refer to the local specialist eye service for consideration of ciclosporin where there is severe keratitis with objective ocular-surface disease despite adequate tear-substitute treatment. NICE recommends it within its marketing authorisation for severe keratitis in adults with dry-eye disease that has not improved despite tear substitutes — the indication is not simply severe symptoms. It is not a routine GP treatment for symptomatic dry eye. Initiation and monitoring follow the local specialist eye pathway; response is commonly assessed at around 6 months, with local services reviewing at 3–6 months. Preparations and concentrations are not interchangeable — check product-specific information and the GM formulary.", src:"NICE TA369 [6] · GMMMG formulary [7]"},
         {tone:"blue", h:"Punctal occlusion", html:"Considered by optometry or ophthalmology, generally only after ocular-surface inflammation has been assessed and controlled, significant blepharitis/MGD has been treated, and infection and inflammatory causes have been excluded — plugs can worsen symptoms by retaining inflammatory tear products."},
         {tone:"blue", h:"Autologous serum", html:"Highly specialist — unlicensed &ldquo;specials&rdquo; reserved for severe, refractory ocular-surface disease through commissioned services, under specialist governance with objective outcome monitoring.", src:"RCOphth serum eye drops guideline 2017 [8]"}
       ]},
       {b:"warn", html:"For any specialist therapy, NICE indication, local commissioning and prescriber competence are separate questions — check each, and the specific product, before accepting prescribing responsibility."}
     ]},

    {id:"troubleshoot", nav:"Not settling?", title:"Not settling? Re-check before escalating",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"1 · Red flags", html:"Significant pain, photophobia, reduced vision, corneal opacity/infiltrate/ulcer/epithelial defect or suspected keratitis → same-day pathway. Persistent or extensive staining alone → prompt optometry/ophthalmology, not emergency, assessment."},
         {tone:"amber", h:"2 · Drops and technique", html:"Used regularly? Frequent preserved drops? Lubricant suited to symptom pattern, tolerability and frequency (lipid-containing may help evaporative disease)? Correct technique, bottle tip not touching the eye?"},
         {tone:"amber", h:"3 · Lids", html:"Is lid hygiene actually being done, daily?"},
         {tone:"blue", h:"4 · Contributors", html:"Medicines, contact lenses, screens and environment reviewed?"},
         {tone:"blue", h:"5 · Right diagnosis?", html:"Systemic features (Sjögren's)? Severe symptoms with few signs (neuropathic pain)? Persistent unilateral redness — episcleritis/scleritis, uveitis, herpetic or corneal disease, glaucoma or medication toxicity? Do not manage it repeatedly as dry eye without ocular examination."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Step 5 — review and referral",
     blocks:[
       {b:"table", head:["When","Situation","Action"], rows:[
         ["<b>Same day</b>","Moderate/severe new pain · photophobia · reduced or deteriorating vision · corneal ulcer, opacity, thinning, infiltrate or epithelial defect · significant unilateral ciliary injection · hypopyon · contact-lens wearer with a painful red eye · suspected microbial, herpetic or acanthamoeba keratitis or significant inflammation · corneal melt or impending perforation · chemical injury or significant trauma · proptosis or painful/restricted eye movements · recent ocular surgery or trauma with new/worsening pain, photophobia, reduced vision, discharge, corneal abnormality or increasing redness (acute postoperative deterioration). Corneal staining alone is not necessarily an emergency [1][3][10]","Use the local Greater Manchester/Bolton urgent eye-care pathway. If the patient has a sight-threatening red eye and no accessible urgent optometry pathway, contact ophthalmology or direct the patient to eye casualty/ED. After surgery, contact the operating service where appropriate. Chemical injury: immediate copious irrigation — referral must not delay irrigation"],
         ["<b>Prompt</b>","Persistent or extensive staining · recurrent epithelial defects · filamentary keratitis · marked symptoms disproportionate to signs · persistent unilateral redness · moderate/severe disease requiring slit-lamp assessment","Prompt optometry or ophthalmology assessment, per local pathway"],
         ["<b>Routine</b>","Persistent symptoms after about 4–6 weeks of appropriate management · disease needing escalation beyond lubricants and lid care · neuropathic ocular pain · visual fluctuation affecting function","Community optometry or a dry-eye service first where available; hospital ophthalmology for corneal or severe disease"],
         ["<b>Systemic</b>","Suspected Sjögren's or other autoimmune disease","Local sicca or rheumatology pathway after clinical assessment"],
         ["<b>Review at 4–6 weeks</b>","Persistent or moderate symptoms, treatment prescribed, or diagnosis uncertain","Check acuity and red flags, adherence and drop technique, preservative exposure, lid care, contact lenses, medicines and systemic symptoms. Mild disease improving with self-care can be safety-netted [1][3]"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"Safety-net", html:"\"If your eye becomes painful, sensitive to light, or your vision drops or does not clear with blinking — or if you wear contact lenses and your eye becomes painful — get it checked the same day.\""},
         {tone:"cream", h:"GP management", html:"Triage, contributors, self-care advice and lid care belong here; lubricants are generally OTC under Greater Manchester policy [7]. Urgent cases use the local GM/Bolton urgent eye-care pathway [10]. Related pages: <a href='blepharitis.html'>blepharitis</a> · <a href='allergic-conjunctivitis.html'>allergic conjunctivitis</a> · <a href='rosacea.html'>rosacea</a> · <a href='uveitis.html'>uveitis</a>."}
       ]},
       {b:"say", html:"Dry eye is common and usually manageable, but occasionally it can damage the cornea. Pain, light sensitivity or reduced vision are not typical symptoms of simple dry eye. It tends to be long-term — something we manage rather than cure, and lubricant drops can usually be bought from a pharmacy. Use the drops regularly, even on good days, and warm compresses for the eyelids help too. Screen breaks and avoiding air blowing at your face make a difference. If your eye becomes painful, sensitive to light, or your vision drops, get seen the same day."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 58-year-old woman has gritty, burning eyes for months, worse at her computer. She uses preserved drops ten times a day, has a dry mouth, and asks for antibiotics a friend was given."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Checks red flags and visual acuity; recognises frequent preserved drops as a problem and advises preservative-free drops, explaining Greater Manchester OTC self-care policy; adds night gel and lid care; explains why antibiotics are not for dry eye alone; asks about Sjögren's features and uses the local pathway; arranges optometry assessment and gives a clear safety-net."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Numbered sources — bracketed numbers on the page refer to this list.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>[1] College of Optometrists — Clinical Management Guideline: dry eye (keratoconjunctivitis sicca)</b><span class="rd"> — lifestyle measures, lubricants, preservative-free use, lid treatment, review and escalation by severity</span></li>'+
         '<li><b>[2] TFOS DEWS II (2017) — diagnostic and management reports</b><span class="rd"> — definition, classification and stepped management</span></li>'+
         '<li><b>[3] UK consensus on the assessment and management of dry eye disease</b><span class="rd"> — assessment elements, review and referral urgency</span></li>'+
         '<li><b>[4] College of Optometrists — Clinical Management Guideline: ocular rosacea</b><span class="rd"> — tetracyclines for selected patients</span></li>'+
         '<li><b>[5] British Society for Rheumatology — guideline on management of adult and juvenile onset Sjögren disease (Rheumatology, 2024)</b><br><a href="https://doi.org/10.1093/rheumatology/keae152" rel="noopener">doi:10.1093/rheumatology/keae152</a><span class="rd"> — ocular and systemic assessment; ANA only with clinical indicators; ENA/anti-Ro if suspicion remains</span></li>'+
         '<li><b>[6] NICE TA369 — Ciclosporin for treating dry eye disease that has not improved despite treatment with artificial tears</b><br><a href="https://www.nice.org.uk/guidance/ta369" rel="noopener">nice.org.uk/guidance/ta369</a><span class="rd"> — specialist ciclosporin only</span></li>'+
         '<li><b>[7] Greater Manchester Medicines Management Group formulary — eye</b><br><a href="https://www.greatermanchesterformulary.nhs.uk" rel="noopener">greatermanchesterformulary.nhs.uk</a><span class="rd"> — lubricant options (OTC/self-care), non-routine prescribing position, preservative-free and lipid products, ciclosporin product information</span></li>'+
         '<li><b>[8] Royal College of Ophthalmologists — Serum eye drops for the treatment of severe ocular surface disease: guideline (2017)</b><span class="rd"> — unlicensed specials, specialist governance, outcome monitoring</span></li>'+
         '<li><b>[9] PCDS — Rosacea clinical guidance; British Association of Dermatologists guidelines for the management of people with rosacea (2021)</b><br><a href="https://doi.org/10.1111/bjd.20485" rel="noopener">doi:10.1111/bjd.20485</a><span class="rd"> — oral doxycycline for more severe rosacea</span></li>'+
         '<li><b>[10] Local Bolton / Greater Manchester urgent eye-care pathway</b><span class="rd"> — same-day and prompt referral routes</span></li>'+
         '<li><b>[11] BNF and product information (SPC) — doxycycline</b><span class="rd"> — dose by indication, contraindications, cautions and interactions</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Dry eye disease in primary care. Symptoms suggest but do not confirm dry eye — persistent or moderate disease needs ocular-surface assessment. Significant pain, photophobia, reduced vision, corneal opacity/infiltrate/ulcer/epithelial defect, suspected keratitis, chemical injury or a painful red eye in a contact-lens wearer: same-day eye assessment; staining alone is not necessarily an emergency. Lubricants first, usually OTC self-care in Greater Manchester; preservative-free when frequent or long-term use is needed (practical trigger about 4–6 applications daily); gel or ointment at night; lid care for blepharitis/MGD. No routine oral antibiotics for dry eye alone. Sources: College of Optometrists CMGs (dry eye, ocular rosacea), TFOS DEWS II, UK dry-eye consensus, BSR Sjögren guideline (2024), NICE TA369 (ciclosporin), RCOphth serum eye drops (2017), PCDS/BAD rosacea, Greater Manchester formulary, local urgent eye-care pathway. Adults only."
});
