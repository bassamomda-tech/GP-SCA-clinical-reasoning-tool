MG.render({

  stemSub:"One page for the whole condition. Case-find rather than screen, recognise the high-risk groups in whom treatment may not need to wait for a DXA, interpret FRAX using the NOGG bands in the right order, screen the secondary causes, start alendronate with the counselling ritual that decides whether it works, fix each side effect instead of abandoning bone protection, respect the denosumab never-just-stop rule, and run falls work alongside throughout.",

  ],
  lead:'<div class="mg-layers"><a href="#found"><b>Case-find</b><small>Who to assess</small></a><a href="#stratify"><b>FRAX \u2192 NOGG</b><small>In that order</small></a><a href="#ladder"><b>Treat</b><small>The ritual matters</small></a><a href="#refer"><b>Refer</b><small>Specialist-led</small></a></div>',
  quickSub:"If you read nothing else on this page, read these six cards. Every number traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"\u26a0 Every fragility fracture is a treatment opportunity", html:"A low-trauma fracture in an adult aged 50 or over is a major osteoporosis-risk marker and a strong predictor of the next fracture, and should trigger fracture-liaison assessment. Consider other causes where the fracture site, history, imaging or blood results are atypical \u2014 for example malignancy, myeloma, metabolic bone disease or high-energy trauma. Refer all adults aged 50 or over with a suspected fragility fracture (distal radius, humerus, vertebral, pelvic, hip) to the <b>local fracture liaison service where available</b>; if there is no FLS, primary care ensures fracture-risk assessment and secondary prevention."},
    {tone:"red", h:"High risk: treatment need not always wait for a DXA", html:"A <b>fragility fracture in an older adult</b>, <b>any vertebral fracture</b> (often incidental on imaging \u2014 <b>act on it, don't file it</b>) or <b>prolonged high-dose glucocorticoids</b> (prednisolone \u22657.5 mg/day for \u22653 months) <b>may justify treatment without waiting for DXA</b> when the clinical risk is clearly high or DXA is impractical. Use FRAX/NOGG, fracture site, age, recentness of fracture, risk factors, renal function, pregnancy potential and patient preference to select treatment."},
    {tone:"amber", h:"Many vertebral fractures are silent", html:"Height loss &gt;4 cm, or new thoracic kyphosis \u2192 lateral spine X-ray or VFA. Sudden severe back pain with height loss is a vertebral fragility fracture \u2014 image it. A vertebral fracture markedly raises future risk and <b>warrants treatment, often without waiting for DXA</b>."},
    {tone:"blue", h:"FRAX first, then DXA selectively", html:"<b>Calculate FRAX WITHOUT BMD first</b>, then interpret it using the <b>NOGG bands</b> (NOGG thresholds are FRAX-based \u2014 don't plot QFracture onto them): <b>low</b> \u2192 lifestyle, reassess in 5 years; <b>intermediate</b> \u2192 DXA and recalculate; <b>high</b> \u2192 treat (DXA useful as a baseline and to guide drug choice, but must not delay treatment); <b>very high</b> \u2192 refer to an osteoporosis specialist for consideration of anabolic or bone-forming treatment. <b>T-score \u2264\u22122.5 = osteoporosis.</b>"},
    {tone:"cream", h:"The ritual is the treatment", html:"<b>Alendronate 70 mg once weekly, exactly as the product instructions say:</b> after an overnight fast, whole tablet with a <b>full glass of plain water</b>, stay <b>upright</b> and delay food, drinks and other medicines for <b>at least 30 minutes</b> (the specified interval). Take calcium and vitamin D later in the day if required. <b>Done wrong it risks oesophagitis and poor absorption.</b> Say it, write it, and check it at review."},
    {tone:"green", h:"Never just stop denosumab", html:"Missed or stopped doses cause rapid bone loss and rebound vertebral fractures within 7\u201318 months. Stopping requires a specialist-guided bisphosphonate follow-on. <b>Flag it on the record like an anticoagulant</b>; it is given every 6 months \u2014 arrange the next dose in advance and avoid delays beyond the scheduled interval."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step is where patients come to harm.",
  pathway:[
    {title:"Case-find \u2014 there is no population screening", html:"<b>All women \u226565 and men \u226575.</b> Younger with a risk factor: previous fragility fracture, oral glucocorticoids, parental hip fracture, smoking, alcohol \u22653 units/day, low BMI, RA, premature menopause &lt;45, recurrent falls. Also anyone starting or taking prolonged systemic glucocorticoids, or with a secondary cause."},
    {title:"Spot the fracture you must not miss", html:"Sudden back pain, height loss or kyphosis \u2192 vertebral fragility fracture. Hip fracture is the highest-mortality fragility fracture. Hip or recent fragility fracture \u2192 fracture liaison pathway. Atypical fracture, persistent bone pain, anaemia, hypercalcaemia or renal dysfunction \u2192 secondary-cause and myeloma assessment (NG12 tests if aged \u226560 with persistent bone pain or an unexplained fracture). Suspected atypical femoral fracture \u2192 bilateral femur imaging and specialist review.", alert:true},
    {title:"Quantify \u2014 FRAX, then NOGG", html:"FRAX without BMD, interpreted using the NOGG intervention thresholds (FRAX-based \u2014 QFracture outputs are not directly interchangeable with them). <b>From age 30, go straight to DXA</b> (no risk tool needed first) after a hip or vertebral fragility fracture, a major osteoporotic fragility fracture in the last 2 years, or 2 or more fragility fractures; <b>under 30 \u2192 specialist advice</b> (NICE NG259). NICE NG259: FRAX or QFracture from age 40; QFracture for ages 30\u201339 (FRAX is not validated below 40); use the same tool consistently through the assessment. DXA if intermediate, or if BMD will guide treatment choice or monitoring."},
    {title:"Screen secondary causes, then treat", html:"Pre-treatment checks: renal function, calcium, vitamin D, dental review. Correct deficiency <em>first</em>. Then oral alendronate/risedronate or IV zoledronate according to risk and suitability; calcium/vitamin D according to intake and deficiency; denosumab only with a documented 6-monthly pathway and exit plan; very high risk \u2192 specialist for anabolic/bone-forming treatment."},
    {title:"Review, and run falls work alongside", html:"Adherence and administration technique at 3\u20136 months, then annually (falls, height, back pain, calcium/vitamin D, renal function). <b>Review bisphosphonate duration at about 5 years (oral) or 3 years (IV zoledronate).</b> Never stop denosumab without planned follow-on treatment. Falls assessment is co-treatment, not a garnish."}
  ],
  sections:[

    {id:"severe", nav:"Red flags", title:"The fracture you must not miss", sub:"A fragility fracture is a fracture from a fall at standing height or less, in an adult aged 50 or over.",
     blocks:[
       {b:"warn", html:"A low-trauma fracture in an adult aged 50 or over is a major osteoporosis-risk marker and should trigger fracture-liaison assessment. Consider other causes where the fracture site, clinical history, imaging or laboratory findings are atypical \u2014 for example malignancy, myeloma, metabolic bone disease or high-energy trauma."},
       {b:"cards", items:[
         {tone:"red", h:"Sudden back pain, height loss or kyphosis", html:"<b>Vertebral fragility fracture \u2014 often unrecognised.</b> Image the spine (X-ray or VFA) and assess. A vertebral fracture markedly raises future risk and <b>may justify treatment without waiting for DXA</b>. &gt;4 cm height loss or new thoracic kyphosis \u2192 lateral spine imaging. DXA is still useful for baseline assessment, monitoring, treatment choice, identifying severe osteoporosis and detecting further vertebral fractures."},
         {tone:"red", h:"Hip fracture", html:"<b>The highest-mortality fragility fracture.</b> After a hip fracture, <b>IV zoledronate is an important option</b> (HORIZON) \u2014 the decision is made through the orthogeriatric/FLS pathway and depends on renal function, calcium/vitamin D status and timing after surgery. Ensure bone protection is addressed."},
         {tone:"amber", h:"Glucocorticoids \u2014 prednisolone \u22657.5 mg/day for \u22653 months", html:"Assess fracture risk promptly when starting or continuing systemic glucocorticoids expected to last \u22653 months, including cumulative or repeated courses, age and prior fracture. Consider bisphosphonate treatment without waiting for DXA where fracture risk is high or delay would be unsafe. Individualise in younger adults, premenopausal women, pregnancy, renal impairment and those with reproductive potential. Calcium/vitamin D advice is not a substitute for fracture-risk assessment. Seek specialist advice for pregnancy-associated osteoporosis or complex glucocorticoid-induced osteoporosis."},
         {tone:"amber", h:"Fractures at unusual sites, or vertebral pain &gt;6 weeks", html:"Or worsening or persistent focal bone pain, a pathological-appearing fracture, systemic symptoms, anaemia, hypercalcaemia, renal dysfunction or weight loss \u2192 <b>investigate for a secondary cause</b>, including myeloma, malignancy and metabolic bone disease."},
         {tone:"purple", h:"Myeloma tests first \u00b7 NICE NG12", html:"Aged \u226560 with persistent bone pain, particularly back pain, or an unexplained fracture \u2192 offer <b>FBC, calcium, ESR or plasma viscosity, serum protein electrophoresis and serum free light chains</b>, all together (urine Bence Jones protein if free light chain testing is not available), and use a <b>suspected cancer pathway referral if the results suggest myeloma</b> (NICE NG12, updated April 2026). Myeloma can present as osteoporosis or a low-trauma vertebral fracture. Investigate for myeloma when there is persistent bone or back pain, an unexplained fracture, a vertebral fracture with atypical features, anaemia, raised ESR, renal impairment, hypercalcaemia, weight loss or other clinical concern \u2014 not routinely in every osteoporosis presentation."},
         {tone:"blue", h:"New dysphagia on a bisphosphonate", html:"Stop the drug and investigate \u2014 dysphagia at any age is an NG12 suspected cancer pathway referral trigger, not simply a reason to switch. Food sticking or pain on swallowing needs assessment, not a different tablet."}
       ]},
       {b:"why", html:"Many patients presenting with a hip fracture have had an earlier, often vertebral, fragility fracture that was not acted on, and a previous fracture raises the risk of the next, so the case-finding priority is to recognise the index fragility fracture and start assessment and treatment \u2014 the fracture liaison model exists precisely to close this secondary-prevention gap. The NG12 myeloma pathway exists to catch the malignancy hiding behind an unexplained fracture: treating \u201cprimary\u201d osteoporosis when the real driver is myeloma, hyperparathyroidism or osteomalacia means treating the wrong target."}
     ]},

    {id:"found", nav:"Case-find", title:"Case-finding \u2014 who to assess, and who to treat without a scan", sub:"There is no population screening. Fracture-risk assessment is targeted and opportunistic.",
     blocks:[
       {b:"dl", rows:[
         ["<b>By age</b>","<b>All women aged \u226565 and all men aged \u226575</b> \u2014 consider assessing everyone in these groups (NICE NG259, 2026). At any age from 50, or after the menopause, a previous fragility fracture or current or frequent systemic glucocorticoid use is a reason to assess, not just to consider it. Do not routinely assess under 50 unless major risk factors are present. Use FRAX or QFracture within their validated age ranges, and consider DXA when results are near the intervention threshold"],
         ["<b>Younger, with a risk factor</b>","<b>Previous fragility fracture</b>; current or frequent systemic glucocorticoids (for example prednisolone \u22655 mg/day or equivalent for more than 3 months, or intermittent higher doses \u2014 NICE NG259); parental hip fracture; current smoking; <b>alcohol \u22653 units/day</b> (and \u226514 units/week); <b>low BMI (&lt;18.5)</b>; rheumatoid arthritis or secondary osteoporosis; <b>premature menopause &lt;45 years</b>; recurrent falls; IBD or coeliac disease; type 1 diabetes; CKD; antiandrogens or aromatase inhibitors; antiepileptics; long-term SSRIs or PPIs"],
         ["<b>Straight to DXA; under 30 to a specialist</b>","From <b>age 30</b>, offer <b>DXA with or without first using a risk tool</b> to people with a <b>previous hip or vertebral fragility fracture</b>, a <b>major osteoporotic fragility fracture in the last 2 years</b>, or <b>2 or more fragility fractures</b>; DXA alone does not determine treatment. Ages <b>30\u201339</b>: use QFracture (FRAX is not validated below 40). <b>Under 30</b>, or suspected rare forms of osteoporosis or rare bone disease: <b>seek specialist advice</b> (NICE NG259). Then re-enter the BMD or T-score into FRAX"],
         ["<b>When treatment need not wait for DXA</b>","A <b>fragility fracture in an older adult</b>, <b>any vertebral fracture</b> (often found incidentally on imaging \u2014 act on it, don't file it) or <b>prolonged high-dose glucocorticoids</b> (prednisolone \u22657.5 mg/day for \u22653 months) may justify treatment without waiting for DXA when clinical risk is clearly high or DXA is impractical. Individualise using FRAX/NOGG, fracture site, age, recentness of fracture, risk factors, renal function, pregnancy potential and patient preference"],
         ["<b>What counts as a fragility fracture</b>","A fracture from standing height or less: <b>wrist</b> (the classic early warning \u2014 refer adults aged 50+ with a suspected fragility fracture to the local fracture liaison service where available; if none, primary care ensures assessment and secondary prevention), <b>hip, vertebral, humerus, pelvis</b>"],
         ["<b>Don't forget men</b>","Osteoporosis is <b>under-diagnosed in men</b>; a man with any fragility fracture warrants assessment <em>and</em> a secondary-cause screen. <b>Hypogonadism is an important secondary cause in men</b>"]
       ]},
       {b:"why", html:"Population screening for osteoporosis is not cost-effective, so the strategy is opportunistic case-finding around age and clinical risk factors."}
     ]},

    {id:"stratify", nav:"FRAX \u2192 NOGG", title:"Quantify the risk \u2014 FRAX, then NOGG, then DXA", sub:"In that order. The tool output tells you whether to reassure, scan, or treat.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1st", title:"FRAX without BMD", when:"the 10-year fracture probability",
          html:"<b>FRAX (ages 40\u201390)</b> \u2014 gives the 10-year probability of a major osteoporotic and of a hip fracture, and is the tool the NOGG intervention thresholds are based on. <b>QFracture (ages 30\u201384)</b> is an alternative NICE risk tool where appropriate, but its probability is not directly interchangeable with NOGG\u2019s FRAX thresholds \u2014 use the same tool consistently through the assessment. <b>In type 2 diabetes, tick the RA box</b> to offset FRAX's underestimate. Which score to act on: NICE TA464 uses the 10-year probability of osteoporotic fragility fracture; NOGG applies its FRAX-based thresholds to the FRAX major osteoporotic and hip fracture probabilities. Calculate without a T-score initially; scan if the result lands in the intermediate zone, or where BMD will guide treatment choice or monitoring."},
         {step:"2nd", title:"Act by NOGG band", when:"NOGG 2024",
          fromLabel:"the fork",
          html:"<b>Green / low</b> \u2192 lifestyle alone; reassess in 5 years or if circumstances change. <b>Amber / intermediate</b> \u2192 <b>arrange DXA</b>, re-enter the T-score into FRAX, and review NOGG again. <b>Red / high</b> \u2192 <b>treat</b> \u2014 NOGG recommends DXA where it will guide drug choice and provide a baseline, but treatment should not be delayed if risk is clear or DXA is impractical. <b>Deep red / very high</b> \u2192 <b>refer to an osteoporosis specialist for consideration of anabolic or bone-forming treatment</b>."},
         {step:"3rd", title:"DXA interpretation", when:"lowest of hip / spine",
          fromLabel:"T-scores",
          html:"<b>T-score \u2264\u22122.5 = osteoporosis</b> \u00b7 <b>\u22121 to \u22122.5 = osteopenia</b> (treat only if FRAX says so) \u00b7 <b>\u2265\u22121 = normal</b>. Re-enter the BMD into FRAX to refine the decision. A Z-score \u2264\u22122 in a young patient \u2192 hunt secondary causes hard and refer."}
       ]},
       {b:"dl", rows:[
         ["<b>Secondary-cause screen \u2014 before or with treatment</b>","FBC, ESR or CRP, U&amp;E and creatinine, LFTs, bone profile (calcium, phosphate, ALP), TFTs, vitamin D, coeliac serology. <b>Myeloma screen</b> (protein electrophoresis + free light chains) when there is persistent bone or back pain, an unexplained fracture, a vertebral fracture with atypical features, anaemia, raised ESR, renal impairment, hypercalcaemia or weight loss \u2014 follow NICE NG12 when the criteria are met. <b>Testosterone, LH and FSH in men.</b> PTH if calcium is abnormal; 24-hour urinary cortisol if cushingoid. Consider a spine X-ray for silent vertebral fractures"],
         ["<b>Who to screen</b>","Any man; any pre- or early-menopausal woman; fractures at unusual sites; vertebral fractures painful &gt;6 weeks"],
         ["Why it matters","Treating coeliac-driven or myeloma-driven bone loss with alendronate alone misses the disease \u2014 and correcting vitamin D <em>before</em> zoledronate or denosumab prevents symptomatic hypocalcaemia"]
       ]},
       {b:"why", html:"Fracture risk is driven by far more than bone density \u2014 age, prior fracture, steroids and parental hip fracture each add independent risk \u2014 which is why a validated tool rather than DXA alone is the starting point. FRAX is favoured in the NOGG route because its output links straight to the NOGG intervention thresholds. The NOGG colour-coded graph turns a percentage risk into an action: green = reassure, amber = measure bone density to refine, red = treat. Use DXA selectively: it is particularly useful when risk is near a treatment threshold, when treatment choice depends on severity, in younger patients, and as a baseline for monitoring in selected high-risk patients. Do not delay treatment in a clearly high-risk patient while waiting for DXA."},
       {b:"warn", html:"Use the current final NICE fracture-risk guidance and your local implementation pathway \u2014 check the live NICE page for the status of NICE NG259 (July 2026; replaced CG146). NICE NG259 accepts FRAX (40\u201390) or QFracture (30\u201384), using QFracture for ages 30\u201339; NOGG 2024 intervention thresholds are FRAX-based, so <b>do not map QFracture outputs onto NOGG</b>. Use the same tool consistently through the assessment. SIGN 142 differs again (it prefers QFracture) \u2014 pick one framework and don't switch mid-assessment."}
     ]},

    {id:"lifestyle", nav:"Foundations", title:"Falls work and calcium/vitamin D \u2014 co-treatment, not garnish", sub:"Most fractures need both a fragile bone and a fall. Bone protection works only alongside fall reduction.",
     blocks:[
       {b:"cards", items:[
         {tone:"green", h:"\ud83d\udeb6 Falls assessment", html:"Gait and balance (timed up-and-go), medication review (sedatives, antihypertensives, anticholinergics, long-term steroids, drugs causing a postural drop), vision, footwear, home hazards, and a <b>postural BP</b> \u2192 offer a structured <b>strength-and-balance programme</b> to those at risk; benefit depends on programme adherence and baseline risk."},
         {tone:"green", h:"\ud83d\udcaa Exercise", html:"<b>Weight-bearing plus resistance plus balance training</b> (tai chi counts). Walking alone is not enough, and swimming and cycling do not load bone."},
         {tone:"blue", h:"\ud83e\udd5b Calcium", html:"Aim <b>700\u20131200 mg/day \u2014 diet first</b> (one pint of milk is about 700 mg). Supplement only the dietary gap; combined calcium and vitamin D (Accrete D3, Adcal-D3) if intake is poor. <b>Take calcium later in the day, separate from the bisphosphonate as its product instructions specify.</b>"},
         {tone:"blue", h:"\u2600\ufe0f Vitamin D", html:"<b>Assess vitamin D risk and replace deficiency according to local guidance</b> (deficient <b>&lt;25 nmol/L</b>); advise dietary calcium and supplement only the shortfall. <b>Ensure calcium and vitamin D sufficiency before zoledronate or denosumab.</b> Be cautious in hypercalcaemia, renal impairment, nephrolithiasis, sarcoidosis or other granulomatous disease, and severe CKD-mineral bone disorder."},
         {tone:"amber", h:"\ud83d\udead Smoking and alcohol", html:"Both are independent risks and directly weaken bone \u2014 cessation support; <b>alcohol &lt;3 units/day and \u226414 units/week</b>."},
         {tone:"amber", h:"\u2696\ufe0f Weight", html:"<b>BMI &lt;18.5 is a major risk</b> \u2014 address the cause: eating disorder, malabsorption, or frailty."}
       ]},
       {b:"why", html:"Antiresorptive drugs reduce relative fracture risk, but the absolute number of fractures prevented depends just as much on whether the person falls. A combined approach \u2014 strengthen the bone, reduce the fall \u2014 is why structured falls assessment is part of every osteoporosis plan, not an optional extra."}
     ]},

    {id:"ladder", nav:"Treat", title:"The treatment ladder \u2014 and the ritual that decides if it works", sub:"Pre-treatment checks first: renal function, calcium, vitamin D, and a dental review. Correct deficiency before any potent antiresorptive.",
     blocks:[
       {b:"warn", html:"<b>Before starting:</b> check <b>renal function, calcium and vitamin D</b> and correct deficiency; <b>assess dental risk and arrange a dental check</b> (osteonecrosis-of-jaw risk). Ensure dietary calcium of about <b>700 mg/day</b> \u2014 supplement only the dietary shortfall, and <b>take it later in the day, not with the bisphosphonate</b>."},
       {b:"ladder", steps:[
         {step:"1st", title:"Alendronate 70 mg once weekly", when:"first-line for almost everyone",
          html:"<b>The ritual \u2014 say it, write it, check it:</b> follow the product instructions exactly \u00b7 same morning each week after an overnight fast \u00b7 whole tablet with a <b>full glass of plain water</b> \u00b7 stay <b>upright</b> \u00b7 no food, drinks or other medicines (including calcium) for <b>at least 30 minutes</b> or the specified interval \u00b7 calcium and vitamin D later in the day if required. <b>Done wrong it risks oesophagitis and poor absorption.</b> Alternative: <b>risedronate 35 mg weekly</b> (gentler on the oesophagus)."},
         {step:"2nd", title:"IV zoledronate 5 mg once yearly", when:"oral not tolerated, contraindicated, or adherence unrealistic",
          fromLabel:"oesophageal disease \u00b7 cannot sit upright \u00b7 GI intolerance",
          html:"Given via a day unit. <b>An acute-phase (flu-like) reaction is common after the first infusion</b> \u2014 counsel, pre-warn and give paracetamol; usually milder in subsequent years. <b>Before each infusion:</b> check renal function (<b>eGFR \u226535</b>) and corrected calcium, ensure adequate hydration, avoid in acute kidney injury, assess dental risk, and correct calcium/vitamin D deficiency. An important option after hip fracture (HORIZON), decided through the orthogeriatric/FLS pathway according to renal function, calcium/vitamin D status and timing after surgery."},
         {step:"3rd", title:"Denosumab 60 mg SC every 6 months", when:"bisphosphonates unsuitable \u2014 not chosen solely because eGFR is low",
          fromLabel:"the one with the trap",
          html:"<b>Do not select denosumab solely because eGFR is below 35.</b> In advanced CKD seek specialist renal/metabolic bone advice before treatment: correct calcium and vitamin D deficiency, assess CKD-mineral bone disorder and arrange post-dose calcium monitoring; creatinine clearance &lt;30 mL/min is managed in secondary care under local shared-care guidance. <b>THE RULE: never stop or delay denosumab without a plan.</b> Given every 6 months \u2014 avoid delays beyond the scheduled interval and arrange the next dose in advance; if discontinuation or a significant delay is anticipated, get specialist advice about bisphosphonate follow-on treatment. Missed or stopped doses cause rapid bone loss and rebound vertebral fractures within 7\u201318 months. Stopping requires a <b>specialist-guided bisphosphonate follow-on</b>. <b>Flag it on the record like an anticoagulant.</b> Check calcium (hypocalcaemia risk, especially in CKD) and confirm vitamin D replete <b>before each dose</b>."},
         {step:"4th", title:"Specialist referral for the very-high-risk", when:"specialist \u00b7 T \u2264\u22123.5, multiple vertebral fractures, or fracture ON treatment",
          fromLabel:"build then lock",
          html:"Refer very-high-risk patients to an osteoporosis specialist for consideration of anabolic or bone-forming treatment. Choice of <b>romosozumab</b>, <b>teriparatide</b> or another agent depends on fracture pattern, sex and menopausal status, cardiovascular history, renal function, previous treatment, licensing, NICE technology appraisal criteria and local commissioning. <b>Romosozumab is contraindicated after MI or stroke</b>; teriparatide has specific licensed/NICE criteria and is specialist initiated. All require <b>planned antiresorptive treatment afterwards</b>. Building-then-locking beats locking alone in the very-high-risk (ARCH, VERO) \u2014 hence early referral rather than after three failed oral years. <b>HRT is the option of choice in early menopause, or <b>&lt;60</b> with symptoms</b>; raloxifene is niche."}
       ]},
       {b:"table", head:["Problem","Looks like","Fix \u2014 keep bone protection alive"], rows:[
         ["Reflux or oesophagitis","Heartburn or dysphagia on alendronate","<b>Check the ritual first \u2014 usually the cause</b> \u2192 switch to risedronate \u2192 IV zoledronate. <b>New dysphagia = stop and investigate (suspected cancer pathway referral for dysphagia, NG12), not just switch</b>"],
         ["<b>ONJ fear (media-driven)</b>","Patient refuses treatment","ONJ is rare on oral bisphosphonates. A dental check-up and good hygiene are sensible before starting; invasive dental work ideally before IV agents. <b>Explain absolute benefit and harm using the patient\u2019s own baseline fracture risk and the relevant medicine\u2019s evidence</b>, rather than universal numbers"],
         ["<b>Atypical femoral fracture</b>","New thigh or groin ache on long-term treatment","<b>X-ray BOTH femurs</b>; if confirmed \u2192 stop, orthopaedics and endocrine. <b>Risk rises after 5 years \u2014 this is WHY the holiday review exists.</b> Absolute risk is tiny against the fractures prevented"],
         ["Flu-like reaction","Within 48 hours of the first zoledronate","Pre-warn and give paracetamol; settles, and is much milder in subsequent years"],
         ["Hypocalcaemia","Cramps or tingling after denosumab or zoledronate","Prevented by checking calcium and loading vitamin D FIRST \u2014 the pre-dose check is not optional"],
         ["<b>\u201cIt's not doing anything\u201d</b>","No felt benefit \u2192 quiet non-adherence (<b>common in the first year</b>)","<b>Name the silence upfront:</b> \u201cyou won't feel it working \u2014 the win is the fracture that never happens.\u201d Ask at every review; switch to an IV or 6-monthly agent if realistic adherence is the issue. <b>Poor adherence is the commonest cause of apparent treatment failure</b>"]
       ]},
       {b:"why", html:"Oral bisphosphonates are first-line because they reduce vertebral, non-vertebral and hip fractures cheaply and safely for most people; the upfront checks minimise the rare harms (hypocalcaemia, osteonecrosis of the jaw, atypical femoral fracture). Correcting vitamin D and calcium before a potent antiresorptive is essential to avoid precipitating symptomatic hypocalcaemia."}
     ]},

    {id:"monitor", nav:"Review", title:"The review rhythm \u2014 and the individualised 5-year treatment review", sub:"Structured review keeps patients on therapy long enough to benefit, and catches the rare serious adverse events early.",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["Adherence, ritual and side effects","<b>3\u20136 months</b> after starting, then annually","<b>Early discontinuation is common \u2014 this review IS the treatment.</b> Check administration technique. Address GI upset, the commonest reason oral bisphosphonates are abandoned"],
         ["Calcium, vitamin D, renal function","Annually, <b>and before every IV or SC dose</b>","Replace, re-dose, re-gate (<b>zoledronate needs eGFR \u226535</b>)"],
         ["Height and back pain","Annually","<b>New &gt;2 cm loss, or thoracic pain \u2192 spine imaging.</b> A new vertebral fracture is treatment failure \u2192 escalate"],
         ["<b>The 5-year review</b> (3 years for zoledronate)","At 5 years of oral bisphosphonate","Review oral bisphosphonate treatment after <b>about 5 years</b> and IV zoledronate after <b>about 3 years</b>. Reassess current fracture risk, new fractures, age, hip/vertebral T-score, glucocorticoid exposure, falls, adherence, renal function and patient preference, then <b>continue, pause or switch</b>. High-risk features \u2014 previous hip or vertebral fracture, fracture on treatment, ongoing glucocorticoids, very low BMD or older age \u2014 favour continuation. These are NOGG considerations, not an automatic rule"],
         ["During a holiday","Reassess fracture risk during the pause \u2014 NOGG suggests <b>18 months to 3 years</b>, with timing individualised","Bisphosphonates linger in bone, so protection persists. <b>New fracture or a significant BMD fall \u2192 restart.</b> <b>Do not use an unplanned treatment holiday with denosumab</b> (rebound): if it is stopped, delayed or no longer appropriate, arrange a planned antiresorptive transition through the responsible specialist/local pathway"],
         ["Repeat DXA on treatment","<b>Not routinely</b> \u2014 only when the result is likely to change management","For example at a treatment review, after a treatment pause, when adherence or treatment response is uncertain, or after a new fracture. Avoid repeating DXA sooner than clinically useful \u2014 small changes may reflect measurement variability"]
       ]},
       {b:"cards", items:[
         
       ]},
       {b:"cards", items:[
         {tone:"red", h:"\ud83d\udd34 Sudden severe back pain or height loss", html:"\u201cSudden severe back pain, or losing height \u2014 that can be a spine fracture; contact us.\u201d Any new low-trauma fracture \u2192 fracture liaison service."},
         {tone:"amber", h:"\ud83e\uddb5 Thigh ache", html:"\u201cA new dull ache in the thigh or groin that won't settle \u2014 tell us; we X-ray it. Don't just push through.\u201d Rare atypical femoral fracture."},
         {tone:"amber", h:"\ud83c\udf7d\ufe0f Swallowing", html:"\u201cFood sticking or pain on swallowing on the weekly tablet \u2014 stop it and come in.\u201d"},
         {tone:"amber", h:"\ud83e\uddb7 Dental", html:"\u201cKeep up dental check-ups and tell your dentist you're on a bone medicine \u2014 the jaw problem people read about is extremely rare, and preventable.\u201d Jaw pain or a non-healing socket \u2192 review."},
         {tone:"green", h:"\ud83d\udc89 Denosumab diary", html:"\u201cYour injection is due every 6 months \u2014 we\u2019ll book the next one in advance, because a late dose loses the protection quickly. If a dose is ever going to be missed or stopped, ring us first so we can plan the next treatment.\u201d"}
       ]},
       {b:"say", html:"This tablet is like a pension payment \u2014 you'll never feel it working, but it lowers your chance of breaking a hip or spine bone \u2014 how much depends on your own risk, which I can go through with you \u2014 and the weekly ritual with the water and staying upright is genuinely what makes it work and keeps it safe. We'll look at it all again properly at about five years \u2014 depending on your risk then, some people can take a planned pause."},
       {b:"why", html:"The <b>drug holiday</b> concept reflects the long skeletal retention of bisphosphonates, which continue to protect for a period after stopping in lower-risk patients, reducing cumulative exposure to rare harms. Denosumab is the opposite \u2014 its effect reverses quickly, so stopping it without a follow-on agent is dangerous, a point examiners frequently test."}
     ]},

    {id:"loop", nav:"Not responding?", title:"Fracture ON treatment? Check before calling it failure", sub:"",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"1 · Actually taken?", html:"Weekly, with the full ritual? Pharmacy refill history? (Many quietly stop within the first year.)"},
         {tone:"blue", h:"2 · Absorbed?", html:"Taken with breakfast/coffee/calcium = poor absorption. Coeliac screen done?"},
         {tone:"amber", h:"3 · Vitamin D + calcium replete?", html:"Treating osteomalacia with a bisphosphonate helps nobody — recheck 25-OH-D."},
         {tone:"blue", h:"4 · Secondary cause missed?", html:"Myeloma (re-screen if new vertebral #), hyperparathyroidism, hypogonadism, cortisol, new steroid courses."},
         {tone:"amber", h:"5 · The fall side?", html:"Falls programme actually attended? New sedatives? Vision checked?"},
         {tone:"blue", h:"6 · True failure", html:"\u22652 fragility #s on verified treatment, or fracture + falling BMD → specialist assessment for anabolic or bone-forming treatment."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer \u2014 who needs the metabolic bone clinic", sub:"Most osteoporosis is managed entirely in primary care; referral is for diagnostic complexity, treatment failure, or parenteral and anabolic agents.",
     blocks:[
       {b:"cards", items:[
         {tone:"purple", h:"Suspected myeloma \u2014 tests first", html:"NICE NG12 (updated April 2026): aged \u226560 with persistent bone pain, particularly back pain, or an unexplained fracture \u2192 FBC, calcium, ESR or plasma viscosity, serum protein electrophoresis and serum free light chains together; <b>suspected cancer pathway referral if the results suggest myeloma</b>."},
         {tone:"amber", h:"Very high risk \u2014 specialist anabolic treatment assessment", html:"<b>T-score \u2264\u22123.5</b>, multiple vertebral fractures, or a <b>fracture on treatment</b> \u2192 specialist assessment for anabolic or bone-forming treatment (choice depends on fracture pattern, menopausal status, cardiovascular history, renal function, licensing and local commissioning). Also deep-red FRAX risk, severe or recurrent vertebral fractures despite treatment, and intolerance of multiple agents."},
         {tone:"blue", h:"Young or unexplained", html:"<b>Osteoporosis <b>&lt;50</b>, Z-score \u2264\u22122, or a man without an obvious cause</b> \u2192 secondary-cause work-up with endocrinology. Also pre- or early-menopausal women, and complex secondary osteoporosis."},
         {tone:"amber", h:"Denosumab exits", html:"Any planned stop or switch of denosumab \u2192 specialist-guided bisphosphonate follow-on. Never a primary-care unilateral stop."},
         {tone:"blue", h:"Complex", html:"<b>eGFR &lt;30\u201335</b> (renal bone disease versus osteoporosis \u2014 get renal/metabolic bone advice before bisphosphonates or denosumab; creatinine clearance &lt;30 mL/min is managed in secondary care), <b>atypical femoral fracture</b>, <b>osteonecrosis of the jaw</b>, pregnancy-associated osteoporosis, complex glucocorticoid-induced osteoporosis."},
         {tone:"cream", h:"Fracture liaison service", html:"Every suspected fragility fracture in an adult aged 50 or over (distal radius, humerus, vertebral, pelvic, hip) should flow through the local FLS pathway where available \u2014 if your area has one, use it; <b>if not, YOU are the FLS</b>. Refer anyone presenting with a fragility fracture for systematic assessment and secondary prevention."}
       ]},
       {b:"say", html:"Your bones have broken despite treatment we've verified you're taking properly \u2014 that puts you in the group that does better with the bone-building injections first, and that's a specialist decision, so I'm referring you. Everything else \u2014 the calcium, vitamin D and balance work \u2014 carries on exactly as now."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only \u2014 the Casebook keeps the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 68-year-old woman who fell in the garden and fractured her distal radius six weeks ago, discharged from fracture clinic with no bone assessment. She takes prednisolone 10 mg daily for polymyalgia, started four months ago. She has read online that \u201cthese bone tablets rot your jaw\u201d."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Recognises the <b>wrist fracture as the index fragility fracture</b> and the missed FLS opportunity; recognises steroids \u22657.5 mg for \u22653 months as high risk and considers bone protection without waiting for a DXA; runs FRAX onto NOGG and screens secondary causes; explains that ONJ is rare, set against her own fracture risk, rather than dismissing the concern; teaches the <b>alendronate ritual explicitly</b>; and arranges falls assessment alongside. <a href='../../cases/osteoporosis.html'>Open the full casebook chapter \u2192</a>"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>NOGG 2024 \u2014 UK clinical guideline for the prevention and treatment of osteoporosis<br><a href="https://www.nogg.org.uk" rel="noopener">nogg.org.uk</a><span class="rd"> \u2014 the FRAX \u2192 NOGG intervention thresholds and the low / intermediate / high / very-high bands, when treatment need not wait for DXA, and the individualised 5-year and 3-year review decisions (high-risk features favour continuation; reassess during a pause)</span></li>'+
         '<li>NICE NG259 \u2014 Osteoporosis: risk assessment (July 2026; updates and replaces CG146)<br><a href="https://www.nice.org.uk/guidance/ng259" rel="noopener">nice.org.uk/guidance/ng259</a><span class="rd"> \u2014 who to assess, FRAX or QFracture within their validated age ranges, identifying vertebral fragility fractures, treatment criteria and repeat assessment for people not having treatment, and use of the 10-year major-osteoporotic-fracture risk. Drug treatment, monitoring and treatment pauses will follow in a later NG259 update; until then NICE TA464 and NOGG remain the treatment sources. NG259 replaces the CG146 under-40 DXA rule: DXA (with or without a risk tool) from age 30 after a hip or vertebral fragility fracture, a major osteoporotic fragility fracture in the last 2 years or 2 or more fragility fractures; QFracture for ages 30\u201339; specialist advice under 30 or for rare forms of osteoporosis; glucocorticoid trigger of prednisolone \u22655 mg/day or equivalent for more than 3 months, or intermittent higher doses. Check the live NICE page for the current status of NG259</span></li>'+
'<li><b>Greater Manchester Medicines Management Group \u2014 Shared Care Guideline for Denosumab in Osteoporosis</b><br><a href="https://gmmmg.nhs.uk" rel="noopener">gmmmg.nhs.uk</a><span class="rd"> \u2014 creatinine clearance &lt;30 mL/min managed in secondary care; calcium monitoring</span></li>'+
         '<li><b>NICE TA161, TA204, TA464 and TA791</b><span class="rd"> \u2014 TA161 (secondary prevention), TA204 (denosumab), TA464 (bisphosphonates for fragility fracture prevention), TA791 (romosozumab)</span></li>'+
         '<li><b>NICE NG12 \u2014 Suspected cancer: recognition and referral (updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> \u2014 myeloma: aged 60 and over with persistent bone pain or unexplained fracture \u2192 FBC, calcium, ESR or plasma viscosity, serum protein electrophoresis and serum free light chains together (urine Bence Jones if free light chains unavailable); suspected cancer pathway referral if the results suggest myeloma</span></li>'+
         '<li><b>FRAX and QFracture</b><br><a href="https://frax.shef.ac.uk/FRAX/" rel="noopener">FRAX</a> \u00b7 <a href="https://qfracture.org" rel="noopener">qfracture.org</a><span class="rd"> \u2014 the two validated risk tools; FRAX ages 40\u201390, QFracture 30\u201384. NOGG intervention thresholds are FRAX-based; QFracture outputs are not directly interchangeable with them</span></li>'+
         '<li><b>HORIZON; ARCH; VERO</b><span class="rd"> \u2014 IV zoledronate after hip fracture (reduced re-fracture and mortality in the trial population); romosozumab and teriparatide outperforming antiresorptive-alone in very-high-risk patients (the building-then-locking rationale)</span></li>'+
         '<li><b>NICE NG259 (2026) \u2014 fracture risk assessment; SIGN 142</b><span class="rd"> \u2014 primary-care operationalisation. Note the three UK guidelines differ; use one consistently</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> \u2014 all doses: alendronate, risedronate, zoledronate, denosumab, colecalciferol, calcium preparations</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Osteoporosis and fragility-fracture prevention in adults \u2014 NOGG 2024, NICE NG259 (July 2026; replaced CG146), TA161, TA204, TA464 and TA791. Assessment and management are merged on this page; there is no separate osteoporosis pathway to cross-check. The UK guidelines (NICE NG259, NOGG 2024, SIGN 142) differ \u2014 this page follows NICE NG259 with NOGG 2024 and you should use one consistently. Verify thresholds against the live tools and all doses against the current BNF."
