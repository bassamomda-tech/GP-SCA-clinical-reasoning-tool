  stemTitle:"Male LUTS and benign prostate enlargement — voiding or storage, then the right tablet",
  stemSub:"Male LUTS are common and often multifactorial — bladder outlet obstruction/benign prostate enlargement, detrusor overactivity, nocturnal polyuria, infection, neurological disease, medication, diabetes, sleep apnoea or a mixture; LUTS and benign prostate enlargement are not synonymous. Primary care should distinguish voiding, storage and post-micturition symptoms; identify nocturnal polyuria; exclude infection, retention, neurological disease and malignancy; and match treatment to the dominant problem: an alpha-blocker for voiding symptoms, a 5-alpha reductase inhibitor when the gland is large, an antimuscarinic, or mirabegron or vibegron, for storage symptoms, and timing of fluids or specific treatment for night-time urine production. NICE CG97 (2010, updated 2015) · NICE NG12 (updated April 2026) · NICE TA290 (2013) · NICE TA999 (vibegron) · MHRA Drug Safety Updates (October 2015, May 2026) · BNF.",
  guideline:"NICE CG97 Lower urinary tract symptoms in men (May 2010, updated June 2015) · NICE NG12 (updated April 2026) · NICE TA290 (2013) · NICE TA999 (vibegron) · Noqdirna SPC · Greater Manchester formulary · NICE HTG545 and HTG578 · MHRA Drug Safety Update (October 2015; May 2026) · BNF",
  meta:[
    {t:"NICE CG97 · 2010, updated 2015"},
    {t:"Suspected cancer · NICE NG12 prostate and bladder", tone:"tw"},
    {t:"NICE TA290 · mirabegron 2013"},

  ],
  lead:"<div class='mg-layers'><a href='#flags'><b>Red flags</b><small>Retention, haematuria, NG12</small></a><a href='#assess'><b>Assess</b><small>Chart, score, DRE, PSA</small></a><a href='#drugs'><b>Drugs</b><small>By symptom and size</small></a><a href='#monitor'><b>Review</b><small>CG97 intervals</small></a><a href='#refer'><b>Refer</b><small>Urology</small></a></div>",
  quickSub:"The six points that change what you do. Each traces to a source listed under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"Acute retention is a same-day problem", html:"Inability to pass urine with a painful, palpable bladder needs <b>same-day catheterisation</b>. NICE CG97 advises <b>offering an alpha-blocker before the catheter is removed</b> to improve the chance of a successful trial without catheter. Use the local urgent urology/ambulatory pathway; send to the emergency department if catheterisation cannot be promptly provided, or with sepsis, severe pain, renal impairment, haematuria, trauma or neurological concern. Chronic retention with a palpable bladder, residual over 1 litre, hydronephrosis or renal impairment needs urgent assessment of renal function and the upper tract with urology involvement.", src:"NICE CG97 (2010, updated 2015)"},
    {tone:"purple", h:"NG12: when LUTS become a cancer question", html:"NICE NG12: consider a PSA test and DRE in men (and trans women and non-binary people with male reproductive organs) with <b>any LUTS</b> such as nocturia, frequency, hesitancy, urgency or retention, or with erectile dysfunction or visible haematuria. Refer on a suspected cancer pathway if the <b>prostate feels malignant</b> on DRE, and consider it if the <b>PSA is above the age threshold</b>: 40–49 years &gt;2.5, 50–59 &gt;3.5, 60–69 &gt;4.5, 70–79 &gt;6.5 micrograms/litre (clinical judgement under 40 and from 80), taking account of patient preference and comorbidity. These thresholds are for possible prostate cancer symptoms; PSA testing in asymptomatic men follows the Prostate Cancer Risk Management Programme.", src:"NICE NG12 (updated April 2026)"},
    {tone:"blue", h:"Sort the symptoms before choosing the drug", html:"<b>Voiding</b>: hesitancy, weak or intermittent stream, straining, incomplete emptying, terminal dribble. <b>Storage</b>: frequency, urgency, urge incontinence, nocturia. <b>Post-micturition</b>: dribbling after leaving the toilet. A 3-day frequency-volume chart and a validated score (such as the IPSS) are the baseline — CG97 asks for both.", src:"NICE CG97 (2010, updated 2015)"},
    {tone:"cream", h:"Voiding symptoms: alpha-blocker first", html:"CG97: offer an alpha-blocker (alfuzosin, doxazosin, tamsulosin or terazosin) to men with <b>moderate to severe</b> LUTS. BNF: <b>tamsulosin 400 micrograms once daily</b>. It works within days to weeks. Warn about dizziness, postural hypotension and falls; review antihypertensives and PDE5 inhibitors; follow the individual SPC for administration and titration (not all at bedtime). Warn about <b>floppy iris syndrome</b> (mainly tamsulosin, also reported with others) — tell the eye surgeon about current or previous alpha-blocker use. Review at <b>4–6 weeks</b>, then every 6–12 months.", src:"NICE CG97 · BNF tamsulosin · tamsulosin SPC"},
    {tone:"amber", h:"5-ARIs halve the PSA — and carry MHRA warnings", html:"CG97: offer a 5-alpha reductase inhibitor if the prostate is estimated at <b>more than 30 g or the PSA is above 1.4 ng/ml</b> and the man is at high risk of progression; consider combining with an alpha-blocker for bothersome moderate to severe LUTS. Benefit is slow — generally at least 3–6 months. 5-ARIs reduce PSA by about 50% — <b>roughly double the measured value</b> after 6 months (a useful rule, not exact); record the on-treatment PSA as a new baseline and assess any confirmed rise from the nadir. MHRA (April 2024; May 2026): finasteride is associated with depression, suicidal ideation and sexual dysfunction (possibly persistent); for dutasteride the psychiatric warning is a precaution with more limited data. Advise contacting the prescriber urgently if depression or suicidal thoughts develop and reporting any sexual dysfunction; give the patient card where supplied.", src:"NICE CG97 · finasteride SPC · MHRA Drug Safety Update (May 2026)"},
    {tone:"green", h:"Not everything needs a tablet", html:"Explain, reassure and use simple measures when symptoms are mild or not bothersome: fluid timing, less caffeine and alcohol, supervised bladder training for storage symptoms, and urethral milking for post-micturition dribble. CG97: <b>do not offer homeopathy, phytotherapy or acupuncture</b> for LUTS.", src:"NICE CG97 (2010, updated 2015)"}
  ],
  pathwaySub:"Five steps. The first protects against the things you must not miss.",
  pathway:[
    {title:"Screen for the dangerous causes", html:"Acute or chronic retention (palpable bladder, overflow, new enuresis, raised creatinine) · visible haematuria · a hard or irregular prostate · raised age-specific PSA · recurrent UTI or bladder stones · acute bacterial prostatitis (fever, perineal pain, tender prostate) · neurological symptoms (cauda equina via the local suspected cauda equina pathway, cord compression, MS, Parkinson’s disease) · diabetes, heart failure, sleep apnoea, oedema and medicines that worsen symptoms. Any of these changes the destination.", alert:true},
    {title:"Assess per CG97", html:"History (voiding, storage, post-micturition; medicines), abdominal, genital and <b>digital rectal examination</b>, urine dipstick, a <b>3-day frequency-volume chart</b>, a baseline <b>IPSS</b>, counselling and an offer of <b>PSA</b> where appropriate, creatinine/eGFR where retention or renal impairment is suspected, and post-void residual where poor emptying is suspected if available locally."},
    {title:"Conservative measures", html:"For every man: explanation, fluid and caffeine advice, medication review. Storage symptoms: supervised bladder training. Post-micturition dribble: urethral milking. Containment products while other treatment takes effect."},
    {title:"Drugs matched to the dominant symptom", html:"Voiding → alpha-blocker. Large prostate or PSA above 1.4 with progression risk → add or use a 5-ARI. Storage → antimuscarinic after conservative measures, or mirabegron or vibegron if antimuscarinics are unsuitable, ineffective or not tolerated (TA290, TA999). Nocturnal polyuria → treat the cause and fluid timing, then consider a timed late-afternoon loop diuretic, or desmopressin only after careful contraindication screening and SPC sodium monitoring."},
    {title:"Review and refer", html:"Review at the CG97 intervals. Refer to urology for failed medical treatment, complications (retention, recurrent UTI, renal impairment, stones), suspected cancer, or when surgery is being considered."}
  ],
  sections:[
    {id:"flags", nav:"Red flags", title:"Red flags — retention, haematuria and cancer", sub:"Deal with these before treating symptoms.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Acute urinary retention", html:"Sudden inability to pass urine, especially with painful bladder distension → same-day urgent assessment and catheterisation via the local urgent urology/ambulatory pathway (primary care if equipped); emergency department if catheterisation cannot be promptly provided, or with sepsis, severe pain, renal impairment, haematuria, trauma or neurological concern. Look for precipitants: antimuscarinic or opioid drugs, decongestants, constipation, infection, alcohol, post-operative state. Offer an alpha-blocker before catheter removal (CG97).", src:"NICE CG97 (2010, updated 2015)"},
         {tone:"red", h:"🔴 Chronic retention — kidneys at risk", html:"Chronic retention with a palpable/percussible bladder, residual volume over 1 litre, hydronephrosis, renal impairment, recurrent infection or overflow/nocturnal incontinence requires urgent assessment of renal function and the upper urinary tract (creatinine and imaging), with urology involvement. Catheterisation is required when renal impairment or hydronephrosis is attributable to retention; consider intermittent before indwelling catheterisation. Monitor for post-obstructive diuresis after drainage, with admission according to residual volume, renal function, electrolytes and clinical status — nocturnal enuresis alone does not automatically mean admission.", src:"NICE CG97 (2010, updated 2015)"},
         {tone:"red", h:"🔴 Neurological cause", html:"New urinary hesitancy, retention or incontinence with back pain, saddle sensory loss, bilateral sciatica, new sexual dysfunction, reduced anal tone, bowel dysfunction or rapidly progressive leg weakness is cauda equina syndrome until proven otherwise → emergency assessment via the local suspected cauda equina pathway.", src:"GIRFT national suspected cauda equina pathway (February 2023)"},
         {tone:"purple", h:"🟣 NG12 — prostate cancer", html:"Refer men using a suspected cancer pathway referral for prostate cancer if the <b>prostate feels malignant</b> on digital rectal examination. A malignant-feeling prostate is referred regardless of PSA. In men with possible prostate cancer symptoms (LUTS, erectile dysfunction or visible haematuria), consider referral if the <b>PSA is above the threshold for age</b> (40–49 &gt;2.5; 50–59 &gt;3.5; 60–69 &gt;4.5; 70–79 &gt;6.5 micrograms/litre; clinical judgement under 40 and from 80), taking account of preference and comorbidity — not automatic. Asymptomatic PSA testing follows the Prostate Cancer Risk Management Programme, where different conventions apply. NG12 applies the same criteria to trans women and non-binary people with male reproductive organs.", src:"NICE NG12 (updated April 2026)"},
         {tone:"purple", h:"🟣 NG12 — bladder cancer", html:"Refer using a suspected cancer pathway referral for bladder cancer if aged <b>45 and over</b> with unexplained <b>visible haematuria without urinary tract infection</b>, or visible haematuria that <b>persists or recurs after successful treatment of UTI</b>; or aged <b>60 and over</b> with unexplained non-visible haematuria and either dysuria or a raised white cell count.", src:"NICE NG12 (updated April 2026)"},
         {tone:"red", h:"🔴 Acute bacterial prostatitis", html:"Fever, rigors, systemic illness, pelvic/perineal pain, dysuria, a tender prostate or acute urinary retention should prompt assessment for acute bacterial prostatitis. Avoid vigorous prostatic massage. Send urine for culture and treat according to local antimicrobial guidance; refer/admit if septic, unable to void or clinically deteriorating. Catheterisation and instrumentation may worsen it, and PSA should not be interpreted during acute infection. Consider chronic prostatitis/pelvic pain in longer-standing symptoms.", src:"Local antimicrobial guidance · NICE CG97"}
       ]},
       {b:"why", html:"<b>Why check retention before an antimuscarinic?</b> Antimuscarinics reduce detrusor contraction. In a man who is already emptying poorly, they can tip him into acute retention. Measure post-void residual where retention, incomplete emptying, recurrent UTI or renal impairment is suspected, or before an antimuscarinic where poor emptying is a concern, if available locally — routine bladder scanning is not mandatory in every man. Significant residual/retention is a reason for caution and specialist advice. Do not delay urgent referral when retention is clinically obvious."}
     ]},

    {id:"assess", nav:"Assess", title:"Assessment — what CG97 asks for at the first visit", sub:"Primary-care assessment answers three questions: what kind of symptoms, how bothersome, and is anything dangerous going on.",
     blocks:[
       {b:"table", head:["Element","Detail","Why"], rows:[
         ["<b>History</b>","Voiding, storage and post-micturition symptoms; onset; bother; fluid, caffeine and alcohol intake; medicines (diuretics, antimuscarinics, opioids, antihistamines, decongestants); diabetes, heart failure, sleep apnoea, oedema; infection or prostatitis symptoms; neurological symptoms; sexual function","Symptom type directs the treatment; medicines are a common, reversible cause"],
         ["<b>Frequency-volume chart</b>","Time and volume of each void, fluid intake where possible, bedtime and waking time, and episodes of urgency or incontinence, day and night, for <b>at least 3 days</b> — particularly with storage symptoms or nocturia","Separates nocturnal polyuria (excess proportion of 24-hour urine produced at night) from nocturnal frequency (waking often with small volumes) and sleep fragmentation; NICE QS45 statement"],
         ["<b>Symptom score</b>","A validated score such as the <b>IPSS</b> for men considering treatment","Baseline for judging response. IPSS bands: 0–7 mild, 8–19 moderate, 20–35 severe"],
         ["<b>Examination</b>","Abdomen (palpable bladder), external genitalia (phimosis, meatal stenosis), <b>digital rectal examination</b> (size, consistency, nodules)","A hard or irregular prostate is an NG12 referral"],
         ["<b>Urine dipstick</b>","Blood, glucose, protein, leucocytes and nitrites","Infection, haematuria, diabetes"],
         ["<b>PSA</b>","Offer information, advice and time to decide; test if LUTS suggest outlet obstruction and a 5-ARI is being considered, if the prostate feels abnormal, or if the man is concerned about cancer","Guides 5-ARI use (&gt;1.4 ng/ml) and NG12 thresholds"],
         ["<b>Creatinine and eGFR</b>","Where retention or renal impairment is suspected — palpable bladder, nocturnal enuresis, recurrent UTI or renal stones","Chronic retention"],
         ["<b>Post-void residual</b>","Where retention, incomplete emptying, recurrent UTI or renal impairment is suspected, or before an antimuscarinic if poor emptying is a concern — if equipment and competency are available locally","Do not delay urgent referral when retention is clinically obvious"],
         ["<b>Not routinely</b>","Flow-rate measurement, cystoscopy or imaging in primary care","Specialist tests if referred"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"🧪 Before the PSA test", html:"Exclude and treat urinary infection before PSA testing. Defer PSA after a proven UTI and after recent urological instrumentation or biopsy according to current UKHSA/Prostate Cancer Risk Management Programme advice and the local laboratory protocol. Ask about recent ejaculation and vigorous exercise because these may transiently affect PSA. Do not interpret PSA during acute prostatitis.", src:"<a href='https://www.gov.uk/government/publications/prostate-specific-antigen-testing-explanation-and-implementation'>UKHSA Prostate cancer risk management programme — information for GPs</a>"},
         {tone:"blue", h:"🔁 PSA on a 5-ARI", html:"After 6 months or more on a 5-ARI, the PSA falls by about half. <b>Roughly double the measured value</b> before comparing it with normal ranges or NG12 thresholds — a useful rule, not exact. Record the on-treatment PSA as a new baseline; a confirmed rise from the nadir requires assessment.", src:"Finasteride SPC · NICE NG12 (updated April 2026)"}
       ]}
     ]},

    {id:"conservative", nav:"Conservative", title:"Conservative management", sub:"Worth doing for every man, and enough on its own when symptoms are mild or not bothersome.",
     blocks:[
       {b:"tiles", v:"life", items:[
         {t:"💧 Fluids", html:"Adequate but not excessive intake, spread through the day; less in the 2 hours before bed if nocturia is the problem. Use the frequency-volume chart to target advice."},
         {t:"☕ Irritants", html:"Reduce caffeine, fizzy drinks and alcohol — all increase frequency and urgency."},
         {t:"🚽 Bladder training", html:"CG97: offer supervised bladder training, advice on fluid intake and lifestyle for storage symptoms."},
         {t:"🔁 Urethral milking", html:"CG97: for post-micturition dribble, teach urethral milking (massaging the urethra forward from behind the scrotum after voiding)."},
         {t:"🦵 Dependent oedema", html:"For nocturia, leg elevation in the afternoon or evening, compression where appropriate, and management of dependent oedema."},
         {t:"💊 Medicine review", html:"Time diuretics away from bedtime; review antimuscarinics, opioids, sedating antihistamines and decongestants that impair voiding."},
         {t:"🩲 Containment", html:"CG97: offer pads or collecting devices for leakage while other treatment takes effect, and temporary or long-term catheterisation where needed."}
       ]},
       {b:"warn", html:"<b>What not to offer.</b> CG97: do not offer homeopathy, phytotherapy (for example saw palmetto) or acupuncture for LUTS. The 2015 update also advises against a phosphodiesterase-5 inhibitor solely to treat LUTS outside a trial — a NICE-specific position (tadalafil is licensed for LUTS/BPH elsewhere and used in other guidelines). Never combine a PDE5 inhibitor with nitrates; use caution with alpha-blockers, particularly non-uroselective agents, because of hypotension."},
       {b:"say", html:"Men’s urinary symptoms often have more than one cause — commonly the prostate slowly growing and the bladder getting a bit more irritable, sometimes making more urine at night. The good news is that simple changes — when you drink, cutting down on tea, coffee and beer, and a couple of bladder techniques — help a lot, and if they aren’t enough there are tablets that work well."}
     ]},

    {id:"drugs", nav:"Drugs", title:"Drug treatment — matched to symptom type and prostate size", sub:"Doses are BNF adult doses for orientation — check the current BNF.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Voiding", title:"Alpha-blocker", when:"moderate to severe LUTS", fromLabel:"CG97 first-line drug",
          html:"Alfuzosin, doxazosin, <span class='rx'>tamsulosin 400 micrograms once daily</span> (BNF) or terazosin — other doses per BNF. Onset within days to weeks. Follow the individual SPC for administration and titration — tamsulosin usually after breakfast or the first meal of the day; doxazosin and terazosin are more associated with first-dose effects and postural hypotension; do not advise all alpha-blockers at bedtime. Warn about dizziness, postural hypotension and falls; retrograde ejaculation. Caution in frailty and falls, baseline orthostatic hypotension, concurrent antihypertensives, PDE5 inhibitor use and planned cataract surgery. <b>Intraoperative floppy iris syndrome</b>: principally tamsulosin, also reported with other alpha-blockers — the patient should tell the ophthalmologist about current or previous alpha-blocker use (tamsulosin SPC). Review at 4–6 weeks, then every 6–12 months (CG97)."},
         {step:"Large gland", title:"5-alpha reductase inhibitor", when:"prostate &gt;30 g or PSA &gt;1.4 ng/ml, high progression risk", fromLabel:"CG97",
          html:"<span class='rx'>Finasteride 5 mg once daily</span> or <span class='rx'>dutasteride 500 micrograms once daily</span> (BNF). Shrinks the gland and reduces the risk of retention and surgery, but symptomatic benefit is slow — generally at least 3–6 months. Adverse effects: reduced libido, erectile dysfunction, ejaculatory disorders, gynaecomastia; MHRA: depression and suicidal ideation with finasteride (psychiatric warning added for dutasteride as a precaution) — contact the prescriber urgently if these develop, and report sexual dysfunction. Record the on-treatment PSA as a new baseline; review at 3–6 months, then every 6–12 months (CG97). Consider <b>combination with an alpha-blocker</b> for bothersome moderate to severe LUTS with an enlarged prostate. Finasteride: women who are or may become pregnant should not handle crushed or broken tablets (and should avoid handling intact film-coated tablets where possible), and a condom is advised if a partner is pregnant or may become pregnant (BNF)."},
         {step:"Storage", title:"Antimuscarinic", when:"overactive bladder symptoms", fromLabel:"CG97",
          html:"CG97: offer an antimuscarinic for overactive bladder symptoms, and consider adding one to an alpha-blocker if storage symptoms persist. BNF examples: <span class='rx'>solifenacin 5 mg once daily</span> (up to 10 mg), <span class='rx'>tolterodine 2 mg twice daily</span>. Review total anticholinergic burden; avoid oxybutynin in frail older people where possible (GM formulary: should not be prescribed in frail older people); consider cognition, constipation, glaucoma, impaired gastric emptying and falls. <b>Significant residual or poor emptying</b> is a reason for caution and specialist advice. Review every 4–6 weeks until stable, then every 6–12 months (CG97)."},
         {step:"Storage alt", title:"Mirabegron or vibegron", when:"antimuscarinic contraindicated, ineffective or not tolerated", fromLabel:"NICE TA290 · TA999",
          html:"<span class='rx'>Mirabegron 50 mg once daily</span> (BNF) — TA290 recommends it only where antimuscarinics are contraindicated, clinically ineffective or cause unacceptable side effects. MHRA (October 2015): contraindicated in severe uncontrolled hypertension (systolic 180 mmHg or more and/or diastolic 110 mmHg or more); measure BP before starting and regularly during treatment. <span class='rx'>Vibegron 75 mg once daily</span> — NICE TA999 recommends it as an option for OAB when antimuscarinics are unsuitable, ineffective or poorly tolerated; choose between mirabegron and vibegron by NICE guidance, local formulary (GM lists both as alternatives) and cost; check the current SPC."},
         {step:"Nocturia", title:"Nocturnal polyuria", when:"night-time urine production is the problem", fromLabel:"CG97",
          html:"Confirm nocturnal polyuria using a frequency–volume chart (distinguish nocturnal frequency with small volumes and sleep fragmentation) and exclude diabetes, heart failure/fluid overload, sleep apnoea, renal disease, hypercalcaemia, oedema and medication causes. CG97: consider a <b>late-afternoon loop diuretic</b> only after reviewing timing, renal function, blood pressure, electrolytes and the indication. Consider <b>desmopressin</b> only after other causes are excluded and other treatments have not helped: check baseline sodium and renal function; use the appropriate licensed low-dose formulation where suitable and follow the current SPC for age-specific sodium monitoring and fluid restriction (CG97 sodium at 3 days). Noqdirna (men): 50 micrograms sublingually once nightly, 1 hour before bedtime; no dose increase at 65 or over; at 65 or over check sodium before treatment, 4–8 days after starting and again at 1 month; <b>stop if sodium is below 135 mmol/L</b>; restrict fluid from 1 hour before until 8 hours after a dose; contraindicated with creatinine clearance below 50 mL/min, cardiac insufficiency/fluid overload needing diuretics, habitual or psychogenic polydipsia, SIADH or previous hyponatraemia. Avoid or seek specialist advice in older/frail patients and with medicines that increase hyponatraemia risk (SSRIs, TCAs, diuretics, carbamazepine, NSAIDs)."}
       ]},
       {b:"table", head:["Drug class","Key safety point","Source"], rows:[
         ["<b>Alpha-blockers</b>","Dizziness, postural hypotension and falls (first-dose effects mainly doxazosin, terazosin); administration per individual SPC; floppy iris syndrome at cataract surgery","BNF · tamsulosin SPC"],
         ["<b>Finasteride and dutasteride</b>","Finasteride: depression, suicidal ideation and sexual dysfunction, which may persist; dutasteride: psychiatric warning as a precaution (more limited data); reduced libido, erectile and ejaculatory dysfunction, gynaecomastia; PSA roughly halved — record new baseline; handling precautions in pregnancy","MHRA Drug Safety Update (April 2024; May 2026) · BNF · SPC"],
         ["<b>Antimuscarinics</b>","Retention in men with poor emptying; cognitive effects and total anticholinergic burden in older people (avoid oxybutynin in the frail); glaucoma, falls; dry mouth, constipation","BNF · GM formulary"],
         ["<b>Mirabegron</b>","Blood pressure — contraindicated in severe uncontrolled hypertension","MHRA Drug Safety Update (October 2015)"],
         ["<b>Vibegron</b>","Check the current SPC and local formulary","NICE TA999 · SPC"],
         ["<b>Desmopressin</b>","Hyponatraemia — baseline sodium; CG97 sodium at 3 days; low-dose SPC at 65 or over: before, 4–8 days and 1 month; stop if below 135 mmol/L; fluid restriction around doses","NICE CG97 · Noqdirna SPC"]
       ]}
     ]},

    {id:"monitor", nav:"Review", title:"Review intervals and what to check", sub:"CG97 sets out when to review each class of drug.",
     blocks:[
       {b:"timeline", items:[
         {n:"1", when:"4–6 weeks", title:"Alpha-blocker or antimuscarinic started", html:"Symptoms (repeat the IPSS), side effects, postural symptoms. Antimuscarinics: review every 4–6 weeks until symptoms are stable (CG97)."},
         {n:"2", when:"3–6 months", title:"5-ARI started", html:"Symptom response (benefit generally takes at least 3–6 months); sexual and mood side effects (MHRA); record the on-treatment PSA as a new baseline."},
         {n:"3", when:"Every 6–12 months", title:"Stable on treatment", html:"IPSS, adherence, side effects, whether treatment is still needed; PSA per plan, roughly doubled on a 5-ARI with any confirmed rise from the nadir assessed; renal function if concern about retention; sodium per SPC on desmopressin."},
         {n:"4", when:"Any time", title:"Worsening or new features", html:"Retention, haematuria, recurrent UTI, rising PSA or an abnormal DRE → re-assess and refer as below."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"🔁 Not improving? Check these first", html:"Is the dominant symptom voiding or storage, and is the drug matched to it? Has the drug had long enough (days for an alpha-blocker, months for a 5-ARI)? Is he taking it? Is there a large residual, nocturnal polyuria or a medicine making things worse? Any red flag since last review?", src:"NICE CG97 (2010, updated 2015)"},
         {tone:"cream", h:"🩺 Combination therapy", html:"Alpha-blocker plus 5-ARI for bothersome moderate to severe LUTS with an enlarged prostate; alpha-blocker plus antimuscarinic for persisting storage symptoms (CG97). Combining adds side effects, so review both drugs at each visit.", src:"NICE CG97 (2010, updated 2015)"}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — who, when, how urgently", sub:"CG97 sets out when men with LUTS should see a specialist; NG12 sets out when to use the suspected cancer pathway.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same day", html:"Acute urinary retention · urosepsis or septic/unable-to-void acute prostatitis · chronic retention with renal impairment or hydronephrosis · suspected cauda equina syndrome (local suspected cauda equina pathway) · significant acute kidney injury.", src:"NICE CG97 (2010, updated 2015)"},
         {tone:"purple", h:"Suspected cancer pathway referral (appointment within 2 weeks) · NICE NG12 — prostate", html:"<b>Prostate feels malignant on digital rectal examination → refer.</b> PSA above the age threshold (40–49 &gt;2.5; 50–59 &gt;3.5; 60–69 &gt;4.5; 70–79 &gt;6.5 micrograms/litre) in someone with possible symptoms → consider referral, taking account of preference and comorbidity. Clinical judgement under 40 and from 80. Asymptomatic PSA testing follows the Prostate Cancer Risk Management Programme.", src:"NICE NG12 (updated April 2026)"},
         {tone:"purple", h:"Suspected cancer pathway referral · NICE NG12 — bladder", html:"<b>Aged 45 and over</b> with unexplained visible haematuria without urinary tract infection, or visible haematuria that persists or recurs after successful treatment of UTI; <b>aged 60 and over</b> with unexplained non-visible haematuria and either dysuria or a raised white cell count.", src:"NICE NG12 (updated April 2026)"},
         {tone:"amber", h:"Specialist assessment (CG97)", html:"LUTS complicated by <b>recurrent or persistent UTI</b>, <b>retention</b>, <b>renal impairment</b> thought to be due to lower urinary tract dysfunction, or suspected urological cancer; <b>stress urinary incontinence</b>; bothersome LUTS when conservative and drug treatment have failed or are not wanted.", src:"NICE CG97 (2010, updated 2015)"},
         {tone:"cream", h:"Surgical and minimally invasive options (secondary care)", html:"TURP and laser procedures such as HoLEP are the established surgical options. <b>Rezum</b> steam therapy (<a href='https://www.nice.org.uk/guidance/htg545'>NICE HTG545</a>, formerly MTG49) and the <b>UroLift</b> prostatic urethral lift (<a href='https://www.nice.org.uk/guidance/htg578'>NICE HTG578</a>, formerly MTG58) are specialist options for selected men. Discuss the evidence, uncertainty, retreatment risk, contraindications and effects on sexual and urinary function with the urology team.", src:"NICE HTG545 (2020) · NICE HTG578 (2021)"},
         {tone:"green", h:"Manage in primary care", html:"Uncomplicated LUTS responding to conservative measures and drug treatment, with review at the CG97 intervals.", src:"NICE CG97 (2010, updated 2015)"}
       ]},
       {b:"say", html:"From what you’ve told me and the examination, this looks like the common, non-cancerous enlargement of the prostate, together with a bladder that has become a bit sensitive. I’d like a few days of a bladder diary and a urine test, and we can talk about the PSA blood test. There are good tablets if simple measures aren’t enough — and if you ever can’t pass water at all, or see blood in your urine, get in touch the same day."}
     ]},

    {id:"safety", nav:"Safety-net", title:"Safety-netting", sub:"What every man with LUTS should be told.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"🚑 Can’t pass urine", html:"“If you suddenly can’t pass urine, especially if your lower tummy is painful and swollen, you need to be seen and have a catheter the same day — contact us or NHS 111 straight away, and go to A&amp;E if you cannot be seen quickly or have a fever, severe pain or blood in your urine.”", src:"NICE CG97 (2010, updated 2015)"},
         {tone:"amber", h:"🩸 Blood in the urine", html:"“If you see blood in your urine, let us know promptly so we can arrange tests — even if it stops.”", src:"NICE NG12 (updated April 2026)"},
         {tone:"amber", h:"🧠 Mood or sexual changes on finasteride or dutasteride", html:"“If your mood drops or you have thoughts of harming yourself, contact us urgently for medical advice. Please also tell us about any sexual problems so we can review the tablet.”", src:"MHRA Drug Safety Update (May 2026)"},
         {tone:"green", h:"😵 Dizziness on an alpha-blocker", html:"“The first doses can make you light-headed when you stand — take it as the label says (tamsulosin is usually taken after breakfast), get up slowly and tell us if you feel faint or fall. Tell the eye surgeon you take it, or have taken it, if you ever need cataract surgery.”", src:"BNF tamsulosin · tamsulosin SPC"},
         {tone:"red", h:"🌡️ Fever or pain between the legs", html:"“If you get a fever, shivers, pain between your legs or in your lower back, or burning when you pass urine, contact us the same day.”", src:"Local antimicrobial guidance"}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card; the Casebook holds full teaching cases.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 68-year-old man gets up four times a night and has a weak stream. His wife made him come. He takes amlodipine and is due cataract surgery next month. He asks for ‘the tablet that shrinks the prostate’ his friend takes, and doesn’t want ‘that finger test’."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Separates <b>voiding from storage and nocturnal polyuria</b> and asks for a <b>3-day frequency-volume chart</b>; explains why a <b>DRE</b> matters and negotiates it; offers <b>informed PSA</b> with the NG12 threshold for his age (&gt;4.5); flags <b>floppy iris syndrome</b> to the eye team if starting an alpha-blocker; explains a 5-ARI takes months, <b>halves PSA</b> and carries <b>MHRA mood and sexual warnings</b>; safety-nets for <b>retention and haematuria</b>."}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Every recommendation above traces to one of these primary sources.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE CG97 — Lower urinary tract symptoms in men: management</b> (May 2010, updated June 2015)<br><a href="https://www.nice.org.uk/guidance/cg97" rel="noopener">nice.org.uk/guidance/cg97</a><span class="rd"> — initial assessment (history, abdominal, genital and DRE examination, dipstick, 3-day frequency-volume chart, validated score such as IPSS, PSA counselling, creatinine only if renal impairment suspected, no routine flow rate); bladder training, urethral milking, containment; no homeopathy, phytotherapy or acupuncture; alpha-blocker for moderate to severe LUTS; 5-ARI for prostate &gt;30 g or PSA &gt;1.4 ng/ml with high progression risk; combination therapy; antimuscarinics for OAB; loop diuretic and desmopressin for nocturnal polyuria with sodium at 3 days; alpha-blocker before catheter removal in acute retention; review intervals (alpha-blocker 4–6 weeks, 5-ARI 3–6 months, antimuscarinic every 4–6 weeks until stable, then 6–12 months); specialist referral criteria; 2015 update on PDE5 inhibitors</span></li>'+
         '<li><b>NICE QS45 — Lower urinary tract symptoms in men</b> (2013)<span class="rd"> — frequency-volume chart at initial assessment</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral</b> (2015, updated April 2026)<br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — consider PSA and DRE with LUTS, erectile dysfunction or visible haematuria; refer if the prostate feels malignant; consider referral if PSA is above the table 2 age threshold (40–49 &gt;2.5, 50–59 &gt;3.5, 60–69 &gt;4.5, 70–79 &gt;6.5 micrograms/litre); bladder cancer referral at 45 and over with visible haematuria and at 60 and over with non-visible haematuria plus dysuria or raised white cell count</span></li>'+
         '<li><b>NICE TA290 — Mirabegron for treating symptoms of overactive bladder</b> (June 2013)<br><a href="https://www.nice.org.uk/guidance/ta290" rel="noopener">nice.org.uk/guidance/ta290</a></li>'+
         '<li><b>NICE TA999 — Vibegron for treating symptoms of overactive bladder syndrome</b><br><a href="https://www.nice.org.uk/guidance/ta999" rel="noopener">nice.org.uk/guidance/ta999</a><span class="rd"> — vibegron 75 mg once daily when antimuscarinics are unsuitable, ineffective or poorly tolerated</span></li>'+
         '<li><b>NICE HTG545 (formerly MTG49) — Rezum</b> (2020) and <b>HTG578 (formerly MTG58) — UroLift</b> (2021) for LUTS of benign prostatic hyperplasia<br><a href="https://www.nice.org.uk/guidance/htg545" rel="noopener">nice.org.uk/guidance/htg545</a> · <a href="https://www.nice.org.uk/guidance/htg578" rel="noopener">nice.org.uk/guidance/htg578</a></li>'+
         '<li><b>MHRA Drug Safety Update — Finasteride and dutasteride: updated safety warnings for psychiatric side effects and sexual dysfunction</b> (May 2026), following <b>Finasteride: reminder of the risk of psychiatric and sexual side effects</b> (April 2024)<br><a href="https://www.gov.uk/drug-safety-update" rel="noopener">gov.uk/drug-safety-update</a></li>'+
         '<li><b>MHRA Drug Safety Update — Mirabegron: risk of severe hypertension</b> (October 2015)<br><a href="https://www.gov.uk/drug-safety-update" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> — contraindicated if BP 180/110 mmHg or more; monitor BP</span></li>'+
         '<li><b>Noqdirna (desmopressin) 50 microgram oral lyophilisate — current SPC</b><br><a href="https://www.medicines.org.uk/emc" rel="noopener">medicines.org.uk/emc</a><span class="rd"> — dose, contraindications, age-specific sodium monitoring and fluid restriction</span></li>'+
         '<li><b>Greater Manchester formulary — obstetrics, gynaecology and urinary-tract disorders</b><br><a href="https://www.greatermanchesterformulary.nhs.uk/" rel="noopener">greatermanchesterformulary.nhs.uk</a><span class="rd"> — antimuscarinic choice (no oxybutynin in frail older people), mirabegron and vibegron as alternatives; use with the local urology and suspected cauda equina pathways</span></li>'+
         '<li><b>BNF</b> — tamsulosin, alfuzosin, doxazosin, finasteride, dutasteride, solifenacin, tolterodine, mirabegron, desmopressin<br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a></li>'+
         '<li><b>SPCs</b> — tamsulosin (intraoperative floppy iris syndrome); finasteride (PSA reduced by about 50%, double after 6 months)</li>'+
         '<li><b>UKHSA — Prostate cancer risk management programme: advising men about the PSA test (information for GPs)</b><br><a href="https://www.gov.uk/government/publications/prostate-specific-antigen-testing-explanation-and-implementation" rel="noopener">gov.uk</a><span class="rd"> — conditions that raise PSA and when to delay the test</span></li>'+
         '<li><b>Barry MJ, et al. The American Urological Association symptom index for benign prostatic hyperplasia.</b> J Urol 1992;148:1549–57<span class="rd"> — the basis of the IPSS and its mild, moderate and severe bands</span></li>'+
         '<li><b>GIRFT — National suspected cauda equina syndrome pathway</b> (February 2023)</li>'+
         '<li><b>BAUS</b> — patient information on TURP, HoLEP and other prostate procedures<br><a href="https://www.baus.org.uk/patients/information_leaflets/" rel="noopener">baus.org.uk</a></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Benign prostate enlargement and male LUTS in primary care — NICE CG97 (2010, updated 2015), NICE NG12 (updated April 2026), NICE TA290 (2013), NICE TA999 (vibegron), NICE HTG545 and HTG578, MHRA Drug Safety Updates (October 2015; April 2024; May 2026) and the BNF. Check the current BNF for doses. Not a substitute for clinical judgement."
