<script>
MG.render({
  icon:"\u{1F377}",

  stemSub:"Primary-care management of alcohol misuse: screen with AUDIT-C / AUDIT, deliver brief interventions, assess dependence and withdrawal risk, decide whether assisted withdrawal can safely happen in the community, protect the brain with thiamine, prevent relapse with medication plus psychosocial support, and look for the liver disease nobody has diagnosed yet.",
  guideline:"NICE CG115 (2011) · NICE CG100 (2010) · NICE PH24 (2010) · NICE QS11 · NICE NG50 (2016) · NICE TA325 (2014) · UK CMOs 2016 · DVLA AFTD",
  meta:[
    {t:"NICE CG115 · harmful drinking &amp; dependence (2011)"},
    {t:"NICE CG100 · withdrawal, Wernicke’s, physical complications (2010)"},
    {t:"NICE PH24 · prevention / brief intervention (2010)"},
    {t:"NICE NG50 · cirrhosis (2016) · NICE TA325 nalmefene (2014)"},
    {t:"UK CMOs low-risk drinking guidelines 2016 · DVLA AFTD", tone:"tw"},
    {t:"Doses: BNF — verify before prescribing"}
  ],
  lead:'<div class="mg-layers"><a href="#screen"><b>Screen</b><small>AUDIT-C → AUDIT</small></a><a href="#dependence"><b>Assess dependence</b><small>SADQ + withdrawal risk</small></a><a href="#withdrawal"><b>Assisted withdrawal</b><small>Community or inpatient?</small></a><a href="#relapse"><b>Relapse prevention</b><small>Acamprosate · naltrexone · disulfiram</small></a></div>',
  glance:[
    {lbl:"Screen", val:"AUDIT-C → AUDIT", sub:"AUDIT-C ≥5 = positive"},
    {lbl:"Low risk", val:"≤14 units/wk", sub:"spread over 3+ days (CMOs 2016)"},
    {lbl:"Harmful / hazardous", val:"Brief intervention", sub:"structured advice + follow-up"},
    {lbl:"Dependent", val:"Don’t stop abruptly", sub:"withdrawal / seizure risk"},
    {lbl:"Withdrawal", val:"Benzodiazepine + thiamine", sub:"community or inpatient by risk"},
    {lbl:"Red flags", val:"DTs · seizures · Wernicke’s", sub:"= emergency"}
  ],
  quickSub:"If you read nothing else on this page, read these cards. Each is traceable to the guideline named on it.",
  quick:[
    {tone:"red", h:"⚠ A dependent drinker must not be told to “just stop”", html:"Abrupt cessation in alcohol dependence can precipitate <b>withdrawal seizures</b> (usually within about 48 h) and <b>delirium tremens</b> (typically 48–72 h). Plan <b>assisted withdrawal</b> instead. Anyone in acute withdrawal who has, or is at high risk of, seizures or DTs needs <b>hospital admission</b> for medically assisted withdrawal (NICE CG100)."},
    {tone:"red", h:"⚠ Wernicke’s is a preventable emergency", html:"Confusion, ataxia, ophthalmoplegia/nystagmus — often <b>incomplete</b>, so a low threshold for suspicion. Suspected Wernicke’s → <b>parenteral thiamine</b> (hospital), continued for at least 5 days unless excluded, then oral (NICE CG100). Oral thiamine alone is not adequate treatment."},
    {tone:"amber", h:"Screen with a validated tool, not a guess", html:"<b>AUDIT-C</b> (3 questions) first; a score of <b>5 or more</b> is positive → complete the full <b>AUDIT</b>. UK AUDIT bands: <b>0–7</b> lower risk · <b>8–15</b> increasing risk · <b>16–19</b> higher risk · <b>20+</b> possible dependence (OHID AUDIT; NICE QS11 statement 1)."},
    {tone:"blue", h:"Who can be withdrawn in the community", html:"NICE CG115: drinking <b>&gt;15 units/day</b> and/or <b>AUDIT ≥20</b> → consider community-based assisted withdrawal, or specialist assessment if there are safety concerns. Use a <b>fixed-dose</b> regimen in the community. Consider inpatient/residential if <b>&gt;30 units/day</b>, <b>SADQ &gt;30</b>, previous <b>withdrawal seizures or DTs</b>, epilepsy, concurrent benzodiazepine withdrawal, or significant comorbidity."},
    {tone:"green", h:"Relapse prevention = drug + psychosocial, together", html:"After successful withdrawal in moderate/severe dependence: <b>acamprosate</b> or <b>oral naltrexone</b> with a psychological intervention; <b>disulfiram</b> if those are unsuitable or preferred and a goal of abstinence (NICE CG115). Review at least monthly for the first 6 months."},
    {tone:"purple", h:"Look for the liver disease", html:"Men drinking <b>&gt;50 units/week</b> or women <b>&gt;35 units/week</b> for several months → offer <b>transient elastography</b> (FibroScan) to diagnose cirrhosis (NICE NG50). Normal LFTs do not exclude cirrhosis."}
  ],
  pathwaySub:"The whole consultation in six moves. The red step is the one where patients come to harm.",
  pathway:[
    {title:"Ask and screen", html:"Ask everyone about alcohol opportunistically (new registration, hypertension, depression, anxiety, injury, abnormal LFTs, raised MCV, gastritis, AF, sleep problems, pregnancy planning). <b>AUDIT-C</b>; if ≥5, full <b>AUDIT</b>. Quantify in <b>units</b>: pattern, bingeing, morning drinking."},
    {title:"Screen for danger", html:"Current or recent withdrawal with confusion, hallucinations, fits, or autonomic instability; features of Wernicke’s; GI bleed, jaundice, ascites or encephalopathy; suicidal ideation; a child or vulnerable adult at risk → act the same day (999 / admit / safeguarding).", alert:true},
    {title:"Classify", html:"Increasing/higher-risk (hazardous) → harmful → dependent. For dependence, measure severity with the <b>SADQ</b> (or LDQ) and take a <b>withdrawal history</b>: previous seizures, DTs, detoxes, morning shakes, relief drinking."},
    {title:"Intervene at the right level", html:"Hazardous/harmful: <b>structured brief advice</b>, then extended brief intervention if needed. Mild dependence/harmful: psychological intervention ± medication. Moderate/severe dependence: <b>assisted withdrawal</b> (community or inpatient by risk) via the local specialist alcohol service."},
    {title:"Protect the body", html:"<b>Thiamine</b> for those at risk (CG100); FBC, LFTs/GGT, U&amp;E, INR if liver disease suspected; <b>transient elastography</b> if above NG50 thresholds; treat comorbid depression/anxiety once drinking is addressed; consider DVLA and safeguarding duties."},
    {title:"Prevent relapse and follow up", html:"Acamprosate / naltrexone / disulfiram with psychosocial support; mutual aid (AA, SMART Recovery); review at least monthly for 6 months; relapse is expected, not failure — re-engage."}
  ],
  sections:[

    {id:"screen", nav:"Screen", title:"Screening, units and risk categories", sub:"You cannot intervene on drinking you have not measured. Use a validated questionnaire (NICE QS11 statement 1) rather than “do you drink much?”",
     blocks:[
       {b:"table", head:["Tool / measure","What it tells you","Action"], rows:[
         ["<b>AUDIT-C</b> (3 questions, max 12)","Consumption screen: <b>0–4</b> lower risk; <b>5–12</b> positive","Score <b>≥5</b> → complete the remaining 7 AUDIT questions"],
         ["<b>AUDIT</b> (10 questions, max 40) — <b>0–7</b>","Lower risk","Reinforce; give low-risk guidance"],
         ["AUDIT <b>8–15</b>","Increasing risk (hazardous)","<b>Structured brief advice</b> (NICE PH24)"],
         ["AUDIT <b>16–19</b>","Higher risk (harmful)","Brief advice + <b>extended brief intervention</b>; follow-up; consider referral"],
         ["AUDIT <b>20+</b>","Possible dependence","Assess dependence (SADQ) and withdrawal risk; refer to specialist alcohol services / consider assisted withdrawal (NICE CG115)"],
         ["<b>SADQ</b>","Severity of dependence: <b>≤15</b> mild · <b>16–30</b> moderate · <b>&gt;30</b> severe","Guides setting of withdrawal and intensity of treatment (NICE CG115)"]
       ]},
       {b:"dl", rows:[
         ["Unit","<b>1 UK unit = 10 mL (8 g) of pure alcohol</b>. Units = volume (mL) × ABV% ÷ 1000. A 750 mL bottle of 13% wine ≈ 9.75 units; a pint of 5% lager ≈ 2.8 units"],
         ["Low-risk guideline (UK CMOs 2016)","Men and women: <b>not more than 14 units a week on a regular basis</b>; if drinking that much, <b>spread over 3 or more days</b>; several drink-free days each week; no single “safe” level — risk rises with amount"],
         ["Hazardous (increasing risk)","A pattern that increases the risk of harm, but no harm yet"],
         ["Harmful","Drinking that is already causing physical or mental harm (NICE CG115 uses “harmful drinking” / “high-risk drinking”)"],
         ["Dependence","Craving/compulsion, impaired control, tolerance, withdrawal, relief drinking, salience of drinking over other activities, persistence despite harm"],
         ["Young people","NICE CG115 covers 10–17-year-olds: a validated tool such as AUDIT can be used in 16–17-year-olds; for 10–15-year-olds, assess and consider referral to CAMHS/young people’s services; think safeguarding"]
       ]},
       {b:"why", html:"AUDIT-C picks up consumption quickly in a 10-minute appointment; the full AUDIT adds harm and dependence questions and is the bridge to deciding who needs brief advice and who needs specialist assessment. The same AUDIT score in a patient who shakes in the morning and drinks for relief is a different conversation — always ask about withdrawal."}
     ]},

    {id:"red", nav:"Red flags", title:"Red flags — same-day, 999 or admit", sub:"The emergencies of alcohol are withdrawal, Wernicke’s, liver decompensation, GI bleeding and suicide.",
     blocks:[
       {b:"warn", html:"<b>Never advise abrupt cessation in a dependent drinker.</b> Stopping suddenly can precipitate seizures and delirium tremens. If the patient has already stopped and is shaking, sweating, hallucinating or confused, this is <b>acute withdrawal</b> — assess risk now."},
       {b:"cards", items:[
         {tone:"red", h:"🔴 Delirium tremens", html:"Coarse tremor, agitation, confusion, hallucinations and autonomic instability, typically ~48–72 h after stopping → <b>999 / admit</b>. In hospital, <b>oral lorazepam</b> is first-line; parenteral lorazepam, haloperidol or olanzapine if symptoms persist or oral is declined.", src:"NICE CG100"},
         {tone:"red", h:"🔴 Withdrawal seizures", html:"Usually within ~48 h of stopping. Treat with a quick-acting benzodiazepine (e.g. lorazepam) in hospital; NICE advises <b>not</b> to use phenytoin for alcohol withdrawal seizures. A previous withdrawal seizure = high risk next time.", src:"NICE CG100"},
         {tone:"red", h:"🔴 Acute withdrawal + high risk", html:"Anyone in acute withdrawal who has, or is at high risk of, seizures or DTs → <b>offer admission</b> for medically assisted withdrawal. Lower threshold for young people, frail/older people, cognitive impairment, learning disability, multiple comorbidities or no social support.", src:"NICE CG100"},
         {tone:"red", h:"🔴 Wernicke’s encephalopathy", html:"Any of confusion, ataxia, ophthalmoplegia/nystagmus, unexplained hypothermia/hypotension or reduced consciousness in a heavy drinker → same-day admission for <b>parenteral thiamine</b> (at least 5 days unless excluded, then oral). Untreated, it progresses to Korsakoff’s.", src:"NICE CG100"},
         {tone:"red", h:"🔴 Decompensated liver disease", html:"Jaundice, ascites, encephalopathy, haematemesis/melaena → same-day admission. Suspected acute alcohol-related hepatitis (jaundice in a heavy drinker) needs hospital assessment.", src:"Clinical consensus; NICE CG100 (alcohol-related hepatitis is assessed and treated in secondary care)"},
         {tone:"amber", h:"🟠 Suicide / self-harm risk", html:"Alcohol dependence carries high rates of depression and suicide. Ask directly; intoxication increases impulsivity. Same-day crisis/mental health referral if active intent or plan.", src:"NICE CG115"}
       ]},
       {b:"why", html:"Withdrawal severity is best predicted by history: previous seizures or DTs, previous complicated detoxes, very heavy daily drinking and morning relief drinking. Wernicke’s is under-diagnosed because the classic triad is present in only a minority — in a malnourished heavy drinker with confusion, treat first and investigate second."}
     ]},

    {id:"dependence", nav:"Assess", title:"Assessing dependence, harm and context", sub:"A structured assessment decides the setting and intensity of treatment (NICE CG115).",
     blocks:[
       {b:"kv", rows:[
         ["Drinking history","Units per day/week, pattern, time of first drink, binges, morning drinking, relief drinking, longest period of abstinence, previous treatment and detoxes"],
         ["Dependence severity","<b>SADQ</b> (or LDQ): mild ≤15, moderate 16–30, severe &gt;30. Ask about tremor, sweats, nausea, anxiety on waking"],
         ["Withdrawal risk","Previous <b>withdrawal seizures</b> or <b>DTs</b>, epilepsy, concurrent benzodiazepine use, age, physical frailty, cognitive impairment"],
         ["Physical harm","GI (gastritis, pancreatitis, liver), hypertension, AF, cardiomyopathy, neuropathy, falls, injuries, sexual dysfunction, cancer risk (mouth, throat, oesophagus, breast, liver, bowel)"],
         ["Mental health","Depression, anxiety, suicidal ideation, psychosis, cognitive impairment; other substances including benzodiazepines, opioids and nicotine"],
         ["Social","Housing, employment, relationships, finances, driving, domestic abuse, criminal justice"],
         ["Safeguarding","Children in the household, pregnancy, caring responsibilities, vulnerable adults — think about children <b>whenever</b> a parent or carer drinks harmfully"],
         ["Motivation","Readiness to change; the patient’s own goals (abstinence vs moderation); what they have tried"]
       ]},
       {b:"table", head:["Investigation","Why","Notes"], rows:[
         ["FBC","Raised <b>MCV</b>, thrombocytopenia (hypersplenism, marrow toxicity)","Macrocytosis is a useful motivational marker"],
         ["LFTs incl. <b>GGT</b>, albumin","Hepatocellular injury, synthetic function","<b>Normal LFTs do not exclude cirrhosis</b>"],
         ["INR / clotting","Synthetic liver function","If liver disease suspected"],
         ["U&amp;E, glucose, lipids","Baseline before relapse-prevention drugs (NICE CG115); cardiovascular risk","Hyponatraemia, hypokalaemia and hypomagnesaemia in heavy drinkers"],
         ["B12 / folate","Nutritional deficiency; macrocytosis","Poor diet common"],
         ["Transient elastography","Diagnose cirrhosis in those above NG50 thresholds","See liver section"],
         ["BBV screen (HBV, HCV, HIV)","If injecting or other risk factors","Offer hepatitis B vaccination where at risk"]
       ]},
       {b:"why", html:"NICE CG115 asks for a comprehensive assessment in specialist services for adults scoring <b>more than 15</b> on the AUDIT. In primary care the practical question is narrower: is this person dependent, how severe is it, and is it safe to withdraw them outside hospital?"}
     ]},

    {id:"brief", nav:"Brief intervention", title:"Brief intervention and psychosocial treatment", sub:"Psychosocial intervention is the evidence-based core of alcohol treatment; medication supports it.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1", title:"Structured brief advice", when:"AUDIT 8–15 (increasing risk)", html:"5–10 minutes: personalised feedback on their AUDIT score and units, the health risks, the benefits of cutting down, practical strategies (drink-free days, smaller glasses, lower-strength drinks), and a written leaflet or app. The <b>FRAMES</b> structure (Feedback, Responsibility, Advice, Menu, Empathy, Self-efficacy) is a useful frame. Offer follow-up."},
         {step:"2", title:"Extended brief intervention", when:"not responding, or higher risk", fromLabel:"escalate", html:"20–30 minutes, motivational-interviewing based, often over several sessions; NICE PH24 recommends extended brief intervention where structured brief advice has not helped or more is needed."},
         {step:"3", title:"Psychological intervention", when:"harmful drinking or mild dependence", fromLabel:"structured treatment", html:"Cognitive behavioural therapy, behavioural therapy or social network and environment-based therapy (NICE CG115). Behavioural couples therapy where there is a regular partner willing to take part."},
         {step:"4", title:"Specialist alcohol service", when:"moderate or severe dependence, complex needs", fromLabel:"refer", html:"Assisted withdrawal, relapse-prevention medication and intensive psychosocial support. For severe dependence with complex needs, residential rehabilitation may be considered (NICE CG115)."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Agree the goal", html:"<b>Abstinence</b> is the appropriate goal for moderate/severe dependence and for harmful drinking with significant comorbidity (e.g. liver disease, depression). A <b>moderation</b> goal may be reasonable for harmful drinking or mild dependence without significant comorbidity if that is the patient’s preference.", src:"NICE CG115"},
         {tone:"green", h:"Mutual aid and self-help", html:"Give information on and support to access community support networks and self-help groups — Alcoholics Anonymous, SMART Recovery — and family support such as Al-Anon.", src:"NICE QS11"},
         {tone:"plain", h:"Families and carers", html:"Offer carers and family members an assessment of their own needs and information on support groups; think about children in the household.", src:"NICE CG115"},
         {tone:"plain", h:"Comorbid depression / anxiety", html:"Treat the drinking first: depressive and anxiety symptoms often improve within 3–4 weeks of abstinence. If they persist, assess and treat per the relevant guideline. Do not use antidepressants to treat the alcohol misuse itself.", src:"NICE CG115"}
       ]},
       {b:"why", html:"Brief interventions work best for hazardous and harmful drinkers who are not dependent. For dependence, brief advice alone is not enough, and advising a dependent drinker to cut down abruptly without a plan can be unsafe."}
     ]},

    {id:"withdrawal", nav:"Withdrawal", title:"Assisted withdrawal — community or inpatient?", sub:"The single most important safety decision in primary-care alcohol management (NICE CG115, NICE CG100).",
     blocks:[
       {b:"cards", items:[
         {tone:"blue", h:"Who needs assisted withdrawal", html:"People who typically drink <b>over 15 units a day</b> and/or score <b>20 or more on the AUDIT</b> → consider assessment for, and delivery of, a <b>community-based assisted withdrawal</b>, or assessment and management in specialist alcohol services if there are safety concerns.", src:"NICE CG115"},
         {tone:"red", h:"Consider inpatient / residential withdrawal if…", html:"History of <b>epilepsy</b>, or <b>withdrawal-related seizures or DTs</b> during previous assisted withdrawal; need for <b>concurrent withdrawal from benzodiazepines</b>; regularly drinking <b>15–20 units/day</b> with significant psychiatric or physical comorbidity, significant learning disability or cognitive impairment.", src:"NICE CG115"},
         {tone:"red", h:"Severe dependence", html:"Drinking <b>over 30 units/day</b> or <b>SADQ over 30</b> → normally consider inpatient assisted withdrawal. Community-based withdrawal may be appropriate if there are no complex needs or significant comorbidity — a specialist alcohol-service decision, not a GP one.", src:"NICE CG115; UK clinical guidelines for alcohol treatment (OHID)"},
         {tone:"amber", h:"Lower threshold for inpatient", html:"Consider a lower threshold for inpatient or residential withdrawal in vulnerable groups, for example homeless and older people (NICE CG115). For acute withdrawal, CG100 adds frailty, cognitive impairment, multiple comorbidities, lack of social support, learning difficulties and age 16–17.", src:"NICE CG115; NICE CG100"},
         {tone:"green", h:"Community regimen", html:"Use a <b>fixed-dose</b> medication regimen in the community (symptom-triggered regimens are for settings with 24-hour monitoring). Build in frequent contact, particularly in the first days, and a named supporter at home.", src:"NICE CG115"},
         {tone:"plain", h:"Which drug", html:"Offer a <b>benzodiazepine</b> (e.g. chlordiazepoxide or diazepam) or carbamazepine for acute withdrawal. Clomethiazole is an inpatient alternative only, because of the risk of fatal respiratory depression when combined with alcohol.", src:"NICE CG100"}
       ]},
       {b:"dl", rows:[
         ["Chlordiazepoxide principles","Long-acting benzodiazepine; <b>reducing fixed-dose regimen</b> (usually four times a day) tapering to zero over about a week, dose set by severity of dependence — <b>dose per BNF and the local specialist protocol</b>. In liver impairment use lower doses or a shorter-acting agent per specialist advice"],
         ["Limit the supply","Dispense small quantities (daily or instalment dispensing where possible) — benzodiazepines plus alcohol risk respiratory depression; do not issue open-ended benzodiazepines"],
         ["Monitoring","Daily contact in the early days (face-to-face or phone, per local service); check tremor, sweating, pulse, BP, orientation; agree what to do if symptoms escalate"],
         ["Thiamine","Oral thiamine before and during planned assisted withdrawal (NICE CG100)"],
         ["Timing","Plan withdrawal as part of a treatment package: relapse-prevention medication and psychosocial support arranged to start straight afterwards"],
         ["CIWA-Ar","A symptom-rating scale used in hospital settings to monitor withdrawal and guide symptom-triggered dosing (NICE CG100); not needed for fixed-dose community regimens"]
       ]},
       {b:"warn", html:"<b>Do not start a community detox</b> in someone with previous withdrawal seizures or DTs, epilepsy, concurrent benzodiazepine dependence, or who has no one at home and cannot attend daily. A patient who carries on drinking on top of chlordiazepoxide is at risk of respiratory depression — stop the regimen and reassess."}
     ]},

    {id:"thiamine", nav:"Thiamine", title:"Thiamine and Wernicke’s encephalopathy", sub:"Wernicke’s is preventable; Korsakoff’s largely is not reversible (NICE CG100).",
     blocks:[
       {b:"table", head:["Situation","Thiamine","Source"], rows:[
         ["Harmful or dependent drinker who is <b>malnourished or at risk of malnourishment</b>","<b>Prophylactic oral thiamine</b>","NICE CG100"],
         ["<b>Decompensated liver disease</b>","Prophylactic oral thiamine","NICE CG100"],
         ["<b>Acute withdrawal</b>","Prophylactic oral thiamine","NICE CG100"],
         ["<b>Before and during planned assisted withdrawal</b>","Prophylactic oral thiamine","NICE CG100"],
         ["Malnourished / decompensated liver disease attending ED or admitted with acute illness or injury","<b>Prophylactic parenteral thiamine</b>, then oral","NICE CG100"],
         ["<b>Suspected Wernicke’s</b>","<b>Parenteral thiamine</b> (hospital) at the upper end of the BNF range, for a minimum of 5 days unless Wernicke’s is excluded, then oral","NICE CG100"]
       ]},
       {b:"dl", rows:[
         ["Oral dose","NICE CG100 advises doses toward the <b>upper end of the BNF range</b>; commonly 100 mg three times a day in practice — <b>check the BNF</b>. Vitamin B compound strong is not a substitute for thiamine"],
         ["Why parenteral","Oral absorption is poor in heavy drinkers; established or suspected Wernicke’s needs high-dose IV thiamine in hospital"],
         ["Glucose","Give thiamine before or with glucose/carbohydrate loads in the malnourished — glucose can precipitate Wernicke’s in thiamine deficiency"]
       ]},
       {b:"why", html:"The classic triad of confusion, ataxia and ophthalmoplegia is present in only a minority, so the working rule is to treat anyone at risk who has any unexplained neurological or cognitive change. NICE CG100 gives no fixed dose (only “toward the upper end of the BNF range”) — follow the BNF and local protocol for exact doses."}
     ]},

    {id:"relapse", nav:"Relapse prevention", title:"Relapse-prevention drugs the GP must know", sub:"Usually initiated by specialist services; often continued in primary care under shared care. Always with a psychosocial intervention (NICE CG115).",
     blocks:[
       {b:"cards", items:[
         {tone:"green", h:"Acamprosate", html:"After successful withdrawal in moderate/severe dependence, with a psychological intervention. Start <b>as soon as possible</b> after withdrawal. Usually for <b>up to 6 months</b>, longer if benefiting and the patient wants to continue. Adult dose (BNF, 18–65 years): <b>666 mg three times a day</b> if ≥60 kg (lower dose if &lt;60 kg). Avoid in severe renal impairment — check U&amp;E.", src:"NICE CG115"},
         {tone:"green", h:"Oral naltrexone", html:"Alternative to acamprosate; start after assisted withdrawal. Adult dose (BNF): <b>25 mg on day 1, then 50 mg once daily</b> if tolerated. <b>Blocks opioids</b> — do not use in people taking opioids (precipitates withdrawal, and opioid analgesia will not work); stop it if the patient feels unwell. Up to 6 months or longer if benefiting.", src:"NICE CG115"},
         {tone:"amber", h:"Disulfiram", html:"Consider (with a psychological intervention) if the goal is abstinence and acamprosate and naltrexone are unsuitable, or the patient prefers it and understands the risks. Start <b>at least 24 hours after the last drink</b>. Warn about the reaction with alcohol, including hidden alcohol (mouthwash, some foods, perfumes), and about rare hepatotoxicity. Ideally with a family member or carer supervising.", src:"NICE CG115"},
         {tone:"amber", h:"Disulfiram monitoring", html:"Supervision <b>at least every 2 weeks for the first 2 months</b>, then <b>monthly for the next 4 months</b>, then medical monitoring at least every 6 months. Advise the patient to seek help urgently if they develop features of hepatitis (jaundice, malaise, nausea).", src:"NICE CG115"},
         {tone:"blue", h:"Nalmefene", html:"An option for <b>reducing consumption</b> (not abstinence) in alcohol dependence with a high drinking-risk level (<b>&gt;60 g/day men, &gt;40 g/day women</b>) without physical withdrawal symptoms and not needing immediate detoxification. Only with continuous psychosocial support, and only started if still at high drinking-risk level <b>2 weeks</b> after initial assessment. Taken as needed on drinking days. Also an opioid antagonist.", src:"NICE TA325"},
         {tone:"plain", h:"Before starting any of them", html:"Comprehensive medical assessment with baseline <b>U&amp;E and LFTs including GGT</b>; note contraindications (renal/hepatic impairment, opioid use, cardiac disease for disulfiram, pregnancy).", src:"NICE CG115"},
         {tone:"plain", h:"Review", html:"See the patient regularly — <b>at least monthly for the first 6 months</b> on acamprosate or naltrexone, then at reduced but regular intervals. Blood tests are not needed routinely, but can be used to monitor liver recovery and as a motivational aid.", src:"NICE CG115"},
         {tone:"red", h:"What not to prescribe", html:"Do not use antidepressants (including SSRIs) to treat alcohol misuse alone; do not use benzodiazepines beyond the withdrawal period, or gamma-hydroxybutyrate, for relapse prevention.", src:"NICE CG115"}
       ]},
       {b:"why", html:"Acamprosate and naltrexone reduce the chance of return to drinking but only alongside psychosocial support. The practical GP risks are prescribing naltrexone to someone on codeine or tramadol, forgetting renal function with acamprosate, and continuing disulfiram without the supervision and warnings it requires."}
     ]},

    {id:"liver", nav:"Liver", title:"Alcohol-related liver disease — find it before it decompensates", sub:"Most alcohol-related cirrhosis is diagnosed at first decompensation. Look earlier (NICE NG50).",
     blocks:[
       {b:"table", head:["Who","Test","Why"], rows:[
         ["Men drinking <b>&gt;50 units/week</b> for several months","<b>Transient elastography</b> (FibroScan)","Diagnose cirrhosis (NICE NG50)"],
         ["Women drinking <b>&gt;35 units/week</b> for several months","<b>Transient elastography</b>","Diagnose cirrhosis (NICE NG50)"],
         ["People diagnosed with alcohol-related liver disease","Transient elastography","Diagnose cirrhosis (NICE NG50)"],
         ["Diagnosed cirrhosis","Ultrasound ± AFP every 6 months for HCC surveillance; upper GI endoscopy for varices; MELD score to assess risk of complications","NICE NG50 — usually secondary care led"]
       ]},
       {b:"dl", rows:[
         ["Do not rely on LFTs","Normal LFTs do not exclude advanced fibrosis or cirrhosis — hence elastography at the NG50 drinking thresholds rather than waiting for abnormal bloods"],
         ["ELF / FIB-4","The ELF test and FIB-4 are used in NICE NG49 for non-alcoholic fatty liver disease; some local pathways also use them in alcohol-related liver disease, but NICE NG50 names transient elastography for people drinking above its thresholds — follow the local pathway"],
         ["Abstinence","The single most important intervention in alcohol-related liver disease — fibrosis can regress, and survival improves"],
         ["Vaccination","Offer hepatitis B vaccination where risk factors exist; annual influenza and pneumococcal vaccination in chronic liver disease (UKHSA Green Book)"],
         ["Nutrition","Malnutrition is common: dietary advice, thiamine as above"]
       ]}
     ]},

    {id:"special", nav:"Special groups", title:"Pregnancy, young people, older adults, DVLA and safeguarding", sub:"The groups and duties that change what you do.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Pregnancy and planning pregnancy", html:"If pregnant or planning pregnancy, <b>the safest approach is not to drink alcohol at all</b> to keep risks to the baby to a minimum. Give this advice at every opportunity. A dependent pregnant woman needs urgent specialist input (obstetric + alcohol services) for inpatient withdrawal — do not advise abrupt cessation.", src:"UK CMOs 2016 low-risk drinking guidelines; NICE QS204 statement 1"},
         {tone:"amber", h:"Children and young people", html:"CG115 covers 10–17-year-olds. Consider referral to CAMHS or young people’s substance-misuse services; always think about safeguarding, sexual exploitation and parental drinking. Under-16s in acute withdrawal → offer hospital admission.", src:"NICE CG115; NICE CG100"},
         {tone:"plain", h:"Older adults", html:"Lower tolerance, falls, drug interactions (sedatives, anticoagulants), confusion misattributed to dementia; lower threshold for inpatient withdrawal.", src:"NICE CG115"},
         {tone:"purple", h:"DVLA — persistent alcohol misuse", html:"Patient must not drive and must notify DVLA. Licence refused or revoked until a minimum of <b>6 months</b> (Group 1) or <b>1 year</b> (Group 2) of controlled drinking or abstinence, with normalised blood parameters if relevant. Tell the patient, and document it.", src:"DVLA Assessing fitness to drive (Nov 2025) — alcohol misuse"},
         {tone:"purple", h:"DVLA — alcohol dependence without high-risk features", html:"Must not drive; notify DVLA. Licence refused or revoked until a minimum of <b>1 year</b> of abstinence (Group 1) or <b>3 years</b> of abstinence (Group 2). Dependence is stricter than misuse — do not quote the misuse periods.", src:"DVLA Assessing fitness to drive (Nov 2025) — alcohol dependence"},
         {tone:"purple", h:"DVLA — dependence with high-risk features", html:"High-risk features: <b>alcohol withdrawal seizures</b> or <b>medically assisted withdrawal needed</b>. Must not drive; notify DVLA. Group 1: <b>1 year</b> of abstinence before licensing can be considered, and abstinence must continue for <b>3 years</b> for ongoing licensing. Group 2: <b>3 years</b> of abstinence before licensing, continuing for <b>5 years</b>. Usually time-limited licences with medical and blood monitoring. Check the current AFTD before quoting.", src:"DVLA Assessing fitness to drive (AFTD) — alcohol chapter"},
         {tone:"purple", h:"DVLA — if they keep driving", html:"If the patient cannot or will not notify DVLA and continues to drive, follow GMC guidance on confidentiality: try to persuade, warn that you will disclose, then inform the DVLA medical adviser and tell the patient you have done so.", src:"GMC confidentiality: patients' fitness to drive and reporting concerns to the DVLA"},
         {tone:"red", h:"Safeguarding", html:"Ask about children in the household and caring roles. Harmful parental drinking is a safeguarding concern — discuss with the practice safeguarding lead and refer to children’s social care where there is risk of harm. Consider domestic abuse in both directions.", src:"NICE CG115"}
       ]}
     ]},

    {id:"monitor", nav:"Follow-up", title:"Follow-up and monitoring", sub:"Relapse is common and not failure. Structured follow-up keeps people in treatment.",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["Brief intervention review","A few weeks after advice","Repeat AUDIT or drink diary; escalate to extended brief intervention or referral if not changing"],
         ["During community withdrawal","Daily in the first days (per local service)","Symptoms, adherence, any drinking on top, confusion, fits → stop and admit if unsafe"],
         ["Acamprosate / naltrexone","At least monthly for 6 months, then less often","Adherence, drinking, side effects; continue beyond 6 months if helping (NICE CG115)"],
         ["Disulfiram","Every 2 weeks × 2 months, monthly × 4 months, then at least 6-monthly","Supervision, hepatitis symptoms (NICE CG115)"],
         ["Bloods","Not routinely; consider LFTs/GGT/MCV","Monitor liver recovery; motivational aid (NICE CG115)"],
         ["Liver","If above NG50 thresholds","Transient elastography; HCC and varices surveillance if cirrhosis"],
         ["Mood","3–4 weeks into abstinence","Reassess persistent depression/anxiety; suicide risk"],
         ["Relapse","Any time","Non-judgemental re-engagement; revisit goals; re-refer to specialist service"]
       ]},
       {b:"timeline", items:[
         {n:"1", when:"After withdrawal", title:"Maintain abstinence", html:"Start relapse-prevention medication promptly with psychosocial support; continue oral thiamine in those at risk."},
         {n:"2", when:"Ongoing", title:"Monitor and support", html:"Review drinking, mood and engagement with structured support/mutual aid; treat coexisting conditions; liver monitoring."},
         {n:"3", when:"Relapse", title:"Re-engage, don’t discharge", html:"Relapse is common — reassess goals (abstinence vs controlled drinking) and re-refer to specialist services if needed."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral — urgency, where, what to send", sub:"Most dependent drinkers are best managed jointly with the local specialist alcohol service.",
     blocks:[
       {b:"table", head:["Urgency","Where","Who / what to send"], rows:[
         ["<b>999 / same day</b>","ED / acute medicine","DTs, withdrawal seizures, suspected Wernicke’s, acute withdrawal at high risk, decompensated liver disease, GI bleed, acute alcohol-related hepatitis"],
         ["<b>Same day</b>","Crisis / mental health team","Active suicidal intent or plan; psychosis"],
         ["<b>Same day</b>","Safeguarding lead / children’s social care","Child or vulnerable adult at risk of harm"],
         ["<b>Urgent</b>","Specialist alcohol service + maternity","Pregnant woman who is dependent"],
         ["Routine (soon)","Community specialist alcohol service","Dependence (AUDIT ≥20 / &gt;15 units a day), assisted withdrawal, relapse prevention, complex needs. Send: units, AUDIT, SADQ, withdrawal history (seizures/DTs), meds incl. opioids and benzodiazepines, bloods, comorbidities, safeguarding"],
         ["Routine","Hepatology / gastroenterology","Cirrhosis on elastography, abnormal synthetic function, suspected advanced ALD"],
         ["Routine","CAMHS / young people’s services","Under-18s with alcohol misuse"]
       ]},
       {b:"say", html:"Let’s look at your drinking together — no judgement. From what you’ve told me, your body has become used to alcohol, so stopping suddenly could make you really unwell, even cause fits. I’d like to plan a safe, supported way to come off it, with medication and vitamins, and our local alcohol team to help you stay well afterwards."}
     ]},

    {id:"safety", nav:"Safety-net", title:"Safety-netting", sub:"Patient wording that makes the risks concrete.",
     blocks:[
       {b:"say", html:"Please don’t suddenly stop drinking on your own — we’ll plan it together. If you do stop, or during the detox, call 999 if you have a fit, become confused, see or hear things that aren’t there, or can’t stop shaking and sweating. Call 999 as well if you vomit blood, pass black sticky stools, or your skin or eyes turn yellow. If you drink while taking the detox tablets, stop the tablets and ring us or the alcohol team that day. And if you ever feel you might harm yourself, call 999 or go to A&amp;E."},
       {b:"cards", cols:2, items:[
         {tone:"red", h:"🔴 Call 999", html:"Fits, confusion, hallucinations, unsteadiness with double vision, vomiting blood, black stools, yellow skin, thoughts of suicide with a plan.", src:"NICE CG100"},
         {tone:"amber", h:"🟠 Same-day contact", html:"Drinking on top of detox medication, worsening shakes or anxiety, not eating, running out of medication.", src:"NICE CG115"},
         {tone:"green", h:"🟢 If you slip", html:"“A slip is common and not a failure — come back and we’ll pick it up again.”", src:"NICE CG115"},
         {tone:"blue", h:"🚗 Driving", html:"“You must not drive and need to tell the DVLA — I’ll note that I’ve told you today.”", src:"DVLA AFTD"}
       ]}
     ]},

    {id:"pitfalls", nav:"Pitfalls", title:"Common pitfalls", sub:"Where alcohol consultations go wrong.",
     blocks:[
       {b:"tiles", v:"safety", items:[
         {t:"Telling a dependent drinker to stop today", html:"Risks seizures and DTs — plan assisted withdrawal."},
         {t:"Community detox for the wrong person", html:"Previous seizures/DTs, epilepsy, benzodiazepine co-dependence, &gt;30 units/day or no support at home."},
         {t:"Forgetting thiamine", html:"Before and during withdrawal and in anyone malnourished; parenteral if Wernicke’s suspected."},
         {t:"Naltrexone with opioids", html:"Precipitates withdrawal and blocks analgesia — check for codeine, tramadol, methadone, buprenorphine."},
         {t:"Relying on normal LFTs", html:"They do not exclude cirrhosis; use elastography at NG50 thresholds."},
         {t:"Treating low mood with an SSRI first", html:"Address alcohol first; reassess mood after 3–4 weeks of abstinence."},
         {t:"Open-ended benzodiazepines", html:"Fixed-dose, time-limited, small supplies only."},
         {t:"Missing the children", html:"Always ask who else is at home."},
         {t:"Not discussing driving", html:"DVLA duties apply to misuse and dependence — document the advice."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only — the Casebook keeps the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"plain", h:"Classic scenario", html:"A 48-year-old delivery driver attends with raised GGT and MCV from an insurance medical. He drinks a bottle of wine and several beers daily, has morning shakes relieved by a drink, had “a funny turn” when he last tried to stop, and has two children at home. He wants to “just stop this weekend” and asks you not to mention anything to the DVLA.", src:"NICE CG115; DVLA AFTD"},
       {tone:"plain", h:"Examiner-style checkpoints", html:"Uses AUDIT and quantifies units; recognises dependence and possible previous withdrawal seizure; <b>advises against abrupt cessation</b> and explains why; plans specialist assisted withdrawal (likely not community, given possible seizure) with thiamine; explores motivation non-judgementally; addresses driving honestly (must not drive, must notify DVLA — Group 1 or Group 2 rules depending on the vehicle he drives for work); asks about the children and mood; arranges liver assessment; safety-nets clearly. <a href='../../cases/alcohol.html'>Open the alcohol casebook chapter →</a>", src:"NICE CG115; NICE CG100; DVLA AFTD"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every recommendation on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE CG115 — Alcohol-use disorders: diagnosis, assessment and management of harmful drinking (high-risk drinking) and alcohol dependence (2011)</b><br><a href="https://www.nice.org.uk/guidance/cg115" rel="noopener">nice.org.uk/guidance/cg115</a><span class="rd"> — assessment, AUDIT/SADQ thresholds, community vs inpatient withdrawal, psychological interventions, acamprosate, naltrexone and disulfiram with monitoring. 2019 surveillance: not scheduled for update</span></li>'+
         '<li><b>NICE CG100 — Alcohol-use disorders: diagnosis and management of physical complications (2010)</b><br><a href="https://www.nice.org.uk/guidance/cg100" rel="noopener">nice.org.uk/guidance/cg100</a><span class="rd"> — acute withdrawal, admission criteria, DTs and seizures, thiamine and Wernicke’s encephalopathy</span></li>'+
         '<li><b>NICE PH24 — Alcohol-use disorders: prevention (2010)</b><br><a href="https://www.nice.org.uk/guidance/ph24" rel="noopener">nice.org.uk/guidance/ph24</a><span class="rd"> — screening, structured brief advice and extended brief interventions</span></li>'+
         '<li><b>NICE QS11 — Alcohol-use disorders: diagnosis and management</b><br><a href="https://www.nice.org.uk/guidance/qs11" rel="noopener">nice.org.uk/guidance/qs11</a><span class="rd"> — validated questionnaires, mutual-aid support, triage, relapse prevention</span></li>'+
         '<li><b>NICE NG50 — Cirrhosis in over 16s: assessment and management (2016)</b><br><a href="https://www.nice.org.uk/guidance/ng50" rel="noopener">nice.org.uk/guidance/ng50</a><span class="rd"> — transient elastography thresholds (&gt;50 units/week men, &gt;35 units/week women), surveillance</span></li>'+
         '<li><b>NICE TA325 — Nalmefene for reducing alcohol consumption in people with alcohol dependence (2014)</b><br><a href="https://www.nice.org.uk/guidance/ta325" rel="noopener">nice.org.uk/guidance/ta325</a></li>'+
         '<li><b>NICE QS204 — Fetal alcohol spectrum disorder</b><span class="rd"> — statement 1, advice on avoiding alcohol in pregnancy</span></li>'+
         '<li><b>UK Chief Medical Officers’ low-risk drinking guidelines (2016)</b><span class="rd"> — 14 units/week, spread over 3+ days; no alcohol in pregnancy</span></li>'+
         '<li><b>OHID — AUDIT and AUDIT-C (UK versions)</b><span class="rd"> — scoring bands</span></li>'+
         '<li><b>DVLA — Assessing fitness to drive: a guide for medical professionals</b> (drug or alcohol misuse or dependence chapter)<span class="rd"> — licensing periods and high-risk features</span></li>'+
         '<li><b>GMC — Confidentiality: patients’ fitness to drive and reporting concerns to the DVLA</b></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — all doses: chlordiazepoxide, thiamine, acamprosate, naltrexone, disulfiram, nalmefene</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Harmful drinking and alcohol dependence in primary care — NICE CG115, CG100, PH24, QS11, NG50, TA325, UK CMOs 2016 and DVLA AFTD. Dependent drinkers need planned assisted withdrawal, not abrupt cessation; DTs, withdrawal seizures and Wernicke’s are emergencies. Doses are given only as stated in the BNF or the named guideline — verify against the current BNF and local alcohol-service protocols before prescribing."
