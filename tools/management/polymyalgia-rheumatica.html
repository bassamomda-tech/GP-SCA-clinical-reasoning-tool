<script>
MG.render({
  icon:"🦴",
  title:"Polymyalgia rheumatica",
  eyebrow:"Protocol · assess and manage in one place",
  stemTitle:"Polymyalgia rheumatica — screen the mimics before the first tablet, review the response at 1–3 weeks, then taper slowly",
  stemSub:"For the over-50 with new bilateral shoulder and hip girdle aching, early-morning stiffness and a raised ESR or CRP. Take the pre-steroid blood panel (adding the NG12 myeloma tests when the NG12 criteria are met or suspicion is high), start prednisolone 15 mg, treat a poor response as a diagnostic alarm rather than a dosing problem, protect bone from day one, taper over one to two years, and keep asking about giant cell arteritis. Sources: BSR/BHPR PMR guideline 2009 · NICE NG12 (updated April 2026) · NOGG 2024 · NICE NG243 · EULAR/ACR 2015 and 2012 (international).",
  guideline:"BSR/BHPR PMR guideline (Dasgupta et al. 2009) · BSR GCA guideline 2020 · NICE NG12 (updated April 2026) · NOGG 2024 · NICE NG243 (2024)",
  meta:[
    {t:"BSR/BHPR PMR guideline · Dasgupta 2009"},
    {t:"NICE NG12 · myeloma 1.10.4–1.10.5", tone:"tw"},
    {t:"NOGG 2024 · NICE NG243 (2024)"},
    {t:"MHRA methotrexate (Sep 2020) · Green Book ch 6"},
    {t:"EULAR/ACR 2015 and 2012 (international)"}
  ],
  lead:"<div class='mg-layers'><a href='#recognise'><b>Is it PMR?</b><small>Core features and exclusions</small></a><a href='#bloods'><b>Bloods first</b><small>Before the first tablet</small></a><a href='#start'><b>Start and judge</b><small>15 mg, review at 1–3 weeks</small></a><a href='#refer'><b>Refer</b><small>Atypical, GCA, relapsing</small></a></div>",
  quickSub:"The six points that prevent the common PMR mistakes. Each figure is traced to the source named under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"Ask about GCA in every patient, at every visit", html:"New headache, scalp tenderness, jaw or tongue claudication, visual loss, amaurosis fugax or diplopia, a temporal artery abnormality, limb claudication, or constitutional symptoms disproportionate to the PMR picture means possible <b>giant cell arteritis</b>: take bloods if this does not delay treatment, give high-dose prednisolone immediately per the local GCA pathway (Greater Manchester: <b>prednisolone 60 mg immediately</b>; BSR 2020: 40–60 mg, 60 mg if sight is already lost) and arrange same-day specialist assessment; any visual symptom → same-day ophthalmology or emergency specialist assessment. Do not wait for ultrasound, biopsy or routine results. The 15 mg PMR dose does not protect against GCA-related visual loss. See the <a href='giant-cell-arteritis.html'>GCA page</a>.", src:"BSR GCA guideline 2020 · BSR/BHPR PMR guideline 2009"},
    {tone:"purple", h:"Aged 60 or over with persistent bone pain — offer the NG12 myeloma tests", html:"NICE NG12 (updated April 2026): in people aged 60 and over with <b>persistent bone pain, particularly back pain, or unexplained fracture</b>, offer FBC, calcium, ESR or plasma viscosity, serum protein electrophoresis and serum free light chains (urine Bence Jones protein if serum free light chains are not available). If the results suggest myeloma, refer using a suspected cancer pathway referral. The trigger is the bone-pain or fracture presentation, not suspected PMR alone; keep a lower threshold where suspicion is high, and do not use a normal result in isolation to exclude myeloma.", src:"NICE NG12 (updated April 2026) recs 1.10.4–1.10.5"},
    {tone:"amber", h:"Bloods before the first tablet", html:"A steroid will flatten the ESR and CRP and can mask the mimics. Usually: <b>FBC, ESR and/or CRP, U&amp;E and eGFR, LFT, bone profile including calcium, glucose or HbA1c, CK, TSH, rheumatoid factor and urine dipstick</b>. Depending on context: anti-CCP, ANA, serum protein electrophoresis, serum free light chains (urine Bence Jones protein if unavailable), chest X-ray, and cancer-directed or infection investigations.", src:"BSR/BHPR PMR guideline 2009"},
    {tone:"blue", h:"15 mg, then review the response at 1–3 weeks", html:"Start <b>prednisolone 15 mg once daily</b>, preferably in the morning. A substantial improvement within 1–3 weeks <b>supports but does not confirm</b> the diagnosis (BSR describes about 70% patient-reported improvement within 1 week — a clinical expectation, not a validated threshold); inflammatory markers usually normalise by about 4 weeks. An incomplete or absent response should prompt reassessment for GCA, infection, malignancy, rheumatoid arthritis, myositis and other mimics, not a higher dose.", src:"BSR/BHPR PMR guideline 2009 · RCP/BSR concise guidance 2010"},
    {tone:"cream", h:"Slow taper over one to two years", html:"BSR template: <b>15 mg for 3 weeks → 12.5 mg for 3 weeks → 10 mg for 4–6 weeks → then reduce by 1 mg every 4–8 weeks</b>. Individualise to symptoms, function, inflammatory markers, adverse effects and preference. Most people need treatment for 1–2 years, though longer is not uncommon. Clinical relapse → back to the previous dose that controlled symptoms.", src:"BSR/BHPR PMR guideline 2009"},
    {tone:"green", h:"Bone protection starts with the steroid", html:"Assess fracture risk at baseline. Start bone-protective treatment immediately, without waiting for DXA, after a previous fragility fracture, in women aged 70 or over, or in postmenopausal women and men aged 50 or over expected to take prednisolone 7.5 mg or more daily for at least 3 months — and wherever FRAX exceeds the intervention threshold. Issue an NHS Steroid Emergency Card if eligible (5 mg or more daily for 4 weeks or longer).", src:"NOGG 2024 · NatPSA/2020/005"}
  ],
  pathwaySub:"Five moves. The first one is the step most often skipped.",
  pathway:[
    {title:"Check for GCA and the dangerous mimics first", html:"Headache, scalp tenderness, jaw or tongue claudication, visual symptoms, limb claudication or disproportionate constitutional symptoms → treat as GCA today (Greater Manchester pathway: prednisolone 60 mg immediately). Weight loss, night pain, neurological signs, peripheral synovitis or a very high or normal ESR/CRP → think again before labelling PMR. Fever with a very high CRP, septic symptoms, suspected endocarditis or an acutely swollen joint → assess for infection before steroid wherever clinically safe.", alert:true},
    {title:"Confirm the clinical picture", html:"Age over 50, symptoms for more than 2 weeks, bilateral shoulder and/or pelvic girdle aching, morning stiffness lasting more than 45 minutes, and a raised acute phase response. Examine shoulder and hip movement, small and large joints for synovitis, muscle power (true weakness versus pain-limited movement), the temporal arteries, the nervous system, and the spine for focal bony tenderness. Classification criteria do not replace clinical assessment."},
    {title:"Take the pre-steroid bloods", html:"The core panel (FBC, ESR and/or CRP, U&amp;E, LFT, bone profile, glucose or HbA1c, CK, TSH, rheumatoid factor, urine dipstick), plus the full NG12 myeloma panel where the patient is 60 or over with persistent bone pain, particularly back pain, or unexplained fracture — or a lower threshold where suspicion is high. Chest X-ray (not part of the BSR core panel) if systemic symptoms or other red flags suggest it."},
    {title:"Start 15 mg and review at 1–3 weeks", html:"A substantial improvement supports, but does not confirm, PMR. Start NOGG-based bone protection where indicated, calcium and vitamin D where indicated, and a Steroid Emergency Card if eligible. Poor response → reassess the diagnosis and discuss with rheumatology rather than escalating the dose."},
    {title:"Taper slowly, watch for relapse and harm", html:"Follow the BSR taper as a framework, reviewing at weeks 1–3 and about 6, then months 3, 6, 9 and 12, and after any significant relapse or dose change. Clinical relapse → back to the last effective dose. Frequent relapse, steroid dependence or toxicity → rheumatology for methotrexate or other options."}
  ],
  sections:[
    {id:"recognise", nav:"Is it PMR?", title:"Is it PMR? — the core picture and what should make you doubt it", sub:"PMR is a clinical diagnosis. The BSR approach is to confirm the core features, actively exclude the alternatives, and treat the steroid response as supportive, not diagnostic.",
     blocks:[
       {b:"table", head:["Core feature","Detail","Comment"], rows:[
         ["<b>Age</b>","Over 50","The older the patient, the more likely PMR — but also malignancy. Onset under 60 is an atypical feature"],
         ["<b>Duration</b>","More than 2 weeks","Symptoms lasting longer than 2 months at diagnosis count as a chronic, atypical onset"],
         ["<b>Distribution</b>","Bilateral shoulder and/or pelvic girdle aching","Shoulder involvement is usual; its absence is atypical"],
         ["<b>Stiffness</b>","Morning stiffness lasting more than 45 minutes","Inflammatory stiffness is central; pain without stiffness points elsewhere"],
         ["<b>Acute phase response</b>","Raised ESR and/or CRP","A normal or an extremely high acute phase response is atypical and needs a reason"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"Exclusions to work through", html:"Active infection; cancer; other inflammatory rheumatic disease (rheumatoid arthritis, other connective tissue disease, calcium pyrophosphate disease, spondyloarthritis); drug-induced myalgia (statins); endocrine causes (hypothyroidism); neurological disease (such as Parkinson's); and other causes of shoulder or hip pain. Each carries a different treatment.", src:"BSR/BHPR PMR guideline 2009"},
         {tone:"blue", h:"Classification criteria — not diagnostic criteria", html:"The EULAR/ACR 2012 provisional criteria apply only to people aged 50 or over with bilateral shoulder aching and an abnormal ESR or CRP. Score: morning stiffness over 45 minutes 2; hip pain or limited movement 1; absent RF and/or anti-CCP 2; no other joint pain 1 — 4 or more classifies as PMR (5 or more with ultrasound). Sensitivity 68%, specificity 78%: classification criteria, not diagnostic criteria. Apply them only to people aged 50 or over with bilateral shoulder aching, an abnormal ESR and/or CRP and no alternative explanation; ultrasound can increase specificity but is not mandatory, and a score must never overrule a clinically important alternative diagnosis.", src:"Dasgupta B et al. 2012 provisional classification criteria for PMR: EULAR/ACR collaborative initiative. Ann Rheum Dis 2012;71:484–492"}
       ]},
       {b:"why", html:"Many conditions produce aching shoulders and a raised ESR in an older person, and several of them — myeloma, other cancers, infection, late-onset rheumatoid arthritis — will partly improve on prednisolone. That is why the BSR asks for the exclusions to be worked through and the bloods taken before the first tablet, and why a half-hearted response is more likely to mean a different diagnosis than an inadequate dose."}
     ]},

    {id:"redflags", nav:"Red flags", title:"Red flags — GCA, cancer and the atypical picture", sub:"The features that change the destination. The NG12 criterion is stated here and repeated with the same threshold under Refer.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Features of giant cell arteritis", html:"New headache, scalp tenderness, jaw or tongue claudication, visual loss, amaurosis fugax or diplopia, a temporal artery abnormality, limb claudication, or constitutional symptoms disproportionate to the PMR picture → take bloods if this does not delay treatment, give high-dose prednisolone immediately per the local GCA pathway (Greater Manchester: 60 mg immediately; BSR 2020: 40–60 mg, 60 mg if sight is already lost) and arrange same-day specialist assessment. Visual symptoms → same-day ophthalmology or emergency specialist assessment. Do not wait for ultrasound, biopsy or routine results; document the time of the steroid dose and the referral.", src:"BSR GCA guideline 2020 · Greater Manchester GCA pathway · EULAR imaging in LVV 2023"},
         {tone:"purple", h:"NICE NG12 — myeloma", html:"People aged 60 and over with persistent bone pain, particularly back pain, or unexplained fracture: offer FBC, calcium, ESR or plasma viscosity, serum protein electrophoresis and serum free light chains (urine Bence Jones protein if serum free light chain testing is not available). If the results suggest myeloma, refer using a suspected cancer pathway referral. Consider urgent assessment for severe hypercalcaemia, acute kidney injury, spinal cord compression or progressive neurological symptoms.", src:"NICE NG12 (updated April 2026) recs 1.10.4–1.10.5"},
         {tone:"amber", h:"Atypical features — look for another diagnosis", html:"Age under 60; chronic onset (over 2 months); no shoulder involvement; no inflammatory stiffness; prominent systemic features, weight loss, night pain or neurological signs; features of another rheumatic disease; a normal or extremely high acute phase response; persistent fever; focal bone pain or unexplained fracture; poor response to 15 mg, inability to taper below about 10 mg, repeated relapses or treatment beyond about 2 years.", src:"BSR/BHPR PMR guideline 2009"},
         {tone:"amber", h:"Weakness rather than pain", html:"True proximal weakness, a raised CK or a rash points towards myositis or another muscle disease, not PMR.", src:"BSR/BHPR PMR guideline 2009"},
         {tone:"amber", h:"Swollen small joints", html:"Peripheral synovitis, especially with a positive RF or anti-CCP, suggests late-onset rheumatoid arthritis, which needs disease-modifying treatment rather than a PMR taper.", src:"BSR/BHPR PMR guideline 2009 · EULAR/ACR 2012 (international)"},
         {tone:"amber", h:"Fever and a very high CRP", html:"Fever with a very high CRP, septic symptoms, suspected endocarditis or an acutely swollen joint: assess for infection (including endocarditis and septic arthritis) before glucocorticoid wherever clinically safe, and large-vessel GCA when systemic symptoms dominate.", src:"BSR/BHPR PMR guideline 2009 · BSR GCA guideline 2020"}
       ]},
       {b:"warn", html:"<b>A dramatic response does not exclude cancer.</b> Paraneoplastic and myeloma-related pain can partly improve on steroid. Make sure the pre-steroid results, including electrophoresis and free light chains where taken, have been reviewed before you rely on the response. Do not use a normal electrophoresis or free light chain result in isolation to exclude myeloma when clinical suspicion remains."}
     ]},

    {id:"bloods", nav:"Bloods", title:"Before the first tablet — the pre-steroid panel", sub:"Once the steroid starts, the ESR and CRP fall and the chance to see the mimics is lost. Rows marked 'depending on context' are guided by the presentation; the rest are usually appropriate before treatment.",
     blocks:[
       {b:"table", head:["Test","What it is looking for"], rows:[
         ["<b>FBC</b>","Anaemia of inflammation; cytopenias suggesting marrow disease"],
         ["<b>ESR or plasma viscosity, and/or CRP</b>","The acute phase response that supports the diagnosis and becomes the baseline for monitoring"],
         ["<b>U&amp;E and LFT</b>","Renal impairment (myeloma); raised ALP (also seen in GCA and PMR)"],
         ["<b>Bone profile</b>","Hypercalcaemia (myeloma, malignancy); baseline before bone-protective treatment"],
         ["<b>Depending on context: serum protein electrophoresis, plus serum free light chains</b>","Paraprotein or light-chain disease. Risk- and presentation-based: the full NG12 myeloma panel is for those aged 60 or over with persistent bone pain, particularly back pain, or unexplained fracture (not for suspected PMR alone), with a lower threshold where clinical suspicion is high; urine Bence Jones protein if serum free light chains are not available"],
         ["<b>TSH</b>","Hypothyroid myopathy"],
         ["<b>CK</b>","Myositis or statin myopathy"],
         ["<b>Rheumatoid factor</b> (ANA and anti-CCP may be considered)","Late-onset rheumatoid arthritis and connective tissue disease"],
         ["<b>Urine dipstick</b>","Blood or protein suggesting vasculitis, renal disease or infection"],
         ["<b>Glucose or HbA1c</b>","Baseline before a long glucocorticoid course"],
         ["<b>Depending on context</b>","Anti-CCP and ANA; chest X-ray; PSA or other cancer-directed investigations; blood cultures or infection investigations if febrile or systemically unwell"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Chest X-ray", html:"Worth adding where there are systemic symptoms, smoking history, weight loss or other features suggesting an alternative diagnosis. It is not part of the BSR core panel.", src:"BSR/BHPR PMR guideline 2009 · clinical practice"},
         {tone:"cream", h:"If the story is typical and the bloods are clear", html:"A patient with typical core features, no atypical features and a clear screen can be started on prednisolone in primary care. Document that the exclusions were considered.", src:"BSR/BHPR PMR guideline 2009"}
       ]}
     ]},

    {id:"start", nav:"Start", title:"Starting treatment — 15 mg and the early response review", sub:"The early response supports the diagnosis but is not a diagnostic test.",
     blocks:[
       {b:"cards", items:[
         {tone:"cream", h:"Prednisolone 15 mg once daily", html:"The BSR standard starting dose, taken in the morning after the pre-steroid bloods. Assess the response at 1–3 weeks. The international EULAR/ACR 2015 recommendations use the lowest effective dose in a range of 12.5–25 mg prednisone-equivalent daily — 15 mg sits within it.", src:"BSR/BHPR PMR guideline 2009 · EULAR/ACR 2015 (international)"},
         {tone:"green", h:"What a good response looks like", html:"A substantial improvement within 1–3 weeks (BSR: about 70% patient-reported improvement within 1 week — a clinical expectation, not a validated diagnostic threshold), and ESR or CRP usually back to normal by about 4 weeks. Supportive, not diagnostic: malignancy, inflammatory arthritis and infection can also improve transiently on steroid.", src:"BSR/BHPR PMR guideline 2009 · RCP/BSR concise guidance 2010"},
         {tone:"amber", h:"A poor response is a diagnostic alarm", html:"Less than the expected improvement should prompt review of the diagnosis — GCA or large-vessel vasculitis, late-onset rheumatoid arthritis, infection, malignancy or myeloma, myositis, endocrine disease, statin-associated muscle symptoms, mechanical shoulder or hip pathology — and discussion with rheumatology, rather than simply increasing the dose.", src:"BSR/BHPR PMR guideline 2009"},
         {tone:"cream", h:"Intramuscular methylprednisolone — an alternative", html:"In milder disease, IM methylprednisolone 120 mg every 3–4 weeks, reducing by 20 mg every 2–3 months, may be used and can lower the cumulative steroid dose. Usually agreed with rheumatology.", src:"BSR/BHPR PMR guideline 2009 · EULAR/ACR 2015 (international)"},
         {tone:"blue", h:"NSAIDs", html:"NSAIDs are not a substitute for glucocorticoid in PMR. At most, short-term use for other pain, weighed against their GI, renal and cardiovascular risks in older people.", src:"EULAR/ACR 2015 (international)"}
       ]},
       {b:"say", html:"If this is polymyalgia, the tablet should make a big difference within the first week or two. That supports the diagnosis, but it isn't proof on its own. If it doesn't, that's important information in itself, and I'd want to look again at what's causing your pain rather than just giving you more."}
     ]},

    {id:"taper", nav:"Taper", title:"The taper — slow, symptom-led, usually 1–2 years", sub:"The BSR schedule is a template. Individualise the reduction to symptoms, function, inflammatory markers, adverse effects and patient preference.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1", when:"3 weeks", tone:"cream", title:"15 mg daily", html:"Review at 1–3 weeks for the response; confirm the pre-steroid results are clear."},
         {step:"2", when:"3 weeks", tone:"cream", fromLabel:"symptoms controlled", title:"12.5 mg daily", html:"Check for returning stiffness and for any GCA symptoms."},
         {step:"3", when:"4–6 weeks", tone:"cream", fromLabel:"still controlled", title:"10 mg daily", html:"The dose at which the long slow phase begins."},
         {step:"4", when:"every 4–8 weeks", tone:"amber", fromLabel:"stable on 10 mg", title:"Reduce by 1 mg at a time", html:"Slower at the lower doses, where relapse is most common. Use daily dosing where possible; alternate-day dosing may occasionally help with small reductions but should not replace an individualised taper. Prednisolone 3–5 mg daily is about physiological replacement: below this, taper more slowly under clinical supervision, and consider an 8–9 am cortisol only if symptoms of adrenal insufficiency arise during withdrawal (NICE NG243)."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"cream", h:"Relapse — back to the dose that worked", html:"Clinical relapse — returning girdle pain and stiffness, often with a rising ESR or CRP, and no GCA features → go back to the previous dose that controlled symptoms, hold it until controlled, then resume a slower taper. If it happens repeatedly or steroid toxicity is significant, involve rheumatology.", src:"BSR/BHPR PMR guideline 2009"},
         {tone:"blue", h:"A rising ESR without symptoms", html:"Never increase prednisolone solely because the ESR has risen without clinical symptoms. Clinical symptoms take precedence: look for another cause (infection, for example) and review sooner.", src:"BSR/BHPR PMR guideline 2009"}
       ]},
       {b:"say", html:"We'll come down in small steps over the next year or two. Please don't change the dose yourself or stop suddenly. If the stiffness comes back as we reduce, let me know — usually we just go back one step and go more slowly."}
     ]},

    {id:"protect", nav:"Protect", title:"Protect bone, adrenals and metabolism throughout the course", sub:"PMR is a low-dose illness but a long one. Cumulative steroid causes most of the harm.",
     blocks:[
       {b:"cards", items:[
         {tone:"green", h:"Bone protection now, DXA later", html:"Assess fracture risk at baseline. Start bone-protective treatment immediately, without waiting for DXA, in anyone with a previous fragility fracture, women aged 70 or over, or postmenopausal women and men aged 50 or over expected to take prednisolone 7.5 mg or more daily for at least 3 months; also treat where FRAX exceeds the intervention threshold. Arrange DXA when appropriate, but do not delay indicated treatment. Usual first-line options are oral alendronate or risedronate or IV zoledronate, with denosumab as an alternative and specialist consideration of anabolic treatment at very high fracture risk. Choice depends on renal function, previous fragility or vertebral fracture, GI contraindications, dental status, ability to follow administration instructions and local formulary or shared-care arrangements. Ensure adequate dietary calcium and vitamin D, with supplements where clinically indicated. See the <a href='https://www.greatermanchesterformulary.nhs.uk' rel='noopener'>Greater Manchester formulary</a>, the local osteoporosis pathway and the <a href='osteoporosis.html'>osteoporosis page</a>.", src:"NOGG 2024 · GMMMG formulary"},
         {tone:"amber", h:"Steroid Emergency Card and sick-day rules", html:"Issue an NHS Steroid Emergency Card — for patients at risk of adrenal crisis, distinct from the older steroid treatment card — to adults taking prednisolone 5 mg or more daily for 4 weeks or longer, or otherwise considered at risk of adrenal suppression. This is required by the national patient safety alert for general practice and community pharmacy, not optional. Explain not to stop treatment abruptly, the need for steroid cover during significant illness or procedures, and what to do if vomiting prevents absorption; give written sick-day and peri-operative advice. Adrenal crisis management follows NICE NG243.", src:"NatPSA/2020/005 (2020) · NICE NG243 (2024)"},
         {tone:"cream", h:"Gastroprotection", html:"Consider gastroprotection only where GI risk justifies it — a PPI where there is additional GI risk — older age, previous ulcer, or concurrent NSAID, antiplatelet or anticoagulant. Dose per BNF.", src:"BNF · clinical practice"},
         {tone:"blue", h:"Blood pressure, glucose, weight, mood, eyes", html:"Record baseline BP, weight and glycaemic risk, and recheck at reviews where clinically indicated. During treatment ask about dyspepsia or GI bleeding, infection, hyperglycaemia, hypertension and oedema, insomnia, depression, mania, psychosis or delirium, cataract or glaucoma symptoms, bruising and skin fragility, proximal weakness or steroid myopathy, and falls and fractures. Steroid-induced hyperglycaemia and hypertension are treated on their own merits.", src:"BSR/BHPR PMR guideline 2009"},
         {tone:"blue", h:"Vaccines", html:"Keep inactivated vaccines (influenza, pneumococcal, COVID-19) up to date. PMR doses are usually below the high-dose steroid thresholds for live vaccines, but check the Green Book chapter 6 thresholds — and any added immunosuppressant — before a live vaccine.", src:"UKHSA Green Book chapter 6"},
         {tone:"green", h:"Activity", html:"Encourage regular activity as stiffness settles, to maintain muscle strength and limit steroid-related weight gain; physiotherapy for persisting stiffness or deconditioning.", src:"EULAR/ACR 2015 (international)"}
       ]}
     ]},

    {id:"relapse", nav:"Relapse", title:"Relapse, steroid dependence and steroid-sparing options", sub:"When the taper keeps failing, the answer is usually specialist input, not a bigger dose for longer.",
     blocks:[
       {b:"cards", items:[
         {tone:"cream", h:"Methotrexate", html:"A rheumatology-led steroid-sparing option, not a standard primary-care treatment — may be considered alongside glucocorticoid for patients at high risk of relapse or prolonged therapy, or with comorbidities that make steroid harm more likely. <b>Once weekly</b> on a specified day; oral doses prescribed as 2.5 mg tablets only, with the total weekly dose in milligrams on the prescription; folic acid. Baseline and ongoing FBC, LFT, albumin and renal monitoring per the local shared-care protocol or current BSR/SPS guidance; caution with renal impairment, liver disease, alcohol excess, infection and interacting drugs. Dose per BNF.", src:"EULAR/ACR 2015 (international) · MHRA Drug Safety Update (September 2020) · SPS methotrexate monitoring · BNF"},
         {tone:"blue", h:"IL-6 blockade — specialist only", html:"In the SAPHYR trial of relapsing PMR, sustained remission at week 52 was 28.3% with sarilumab plus a 14-week taper versus 10.3% with placebo plus a 52-week taper. Sarilumab for PMR is investigational or off-label and specialist-only — not a routine primary-care treatment, and a trial result is not a NICE-recommended pathway. This is distinct from tocilizumab for GCA, which has NICE technology appraisal guidance (TA518).", src:"Spiera et al., N Engl J Med 2023 (SAPHYR)"},
         {tone:"amber", h:"Signs the diagnosis needs revisiting", html:"Inability to get below about 10 mg, repeated relapse, a new pattern of joint swelling, or emerging systemic symptoms → rheumatology review of the diagnosis as well as the treatment.", src:"BSR/BHPR PMR guideline 2009 (referral triggers) · clinical practice"},
         {tone:"red", h:"Relapse with cranial or visual features", html:"This is GCA until proved otherwise — high-dose prednisolone immediately per the local GCA pathway (Greater Manchester: 60 mg) and same-day specialist assessment.", src:"BSR GCA guideline 2020"}
       ]}
     ]},

    {id:"followup", nav:"Follow-up", title:"Follow-up schedule", sub:"The BSR schedule as a suggested framework for the first year, with extra visits after any clinically significant relapse, dose change or adverse effect.",
     blocks:[
       {b:"timeline", items:[
         {n:"0", when:"Week 0", title:"Diagnose and start", html:"Pre-steroid bloods reviewed; prednisolone 15 mg; fracture-risk assessment and NOGG-based bone protection, with calcium and vitamin D where indicated; Steroid Emergency Card if eligible, with written sick-day advice; baseline BP, weight and glycaemic risk; infection risk and vaccination status reviewed; GCA symptoms explained."},
         {n:"1", when:"Weeks 1–3", title:"Response check", html:"A substantial improvement supports, but does not confirm, PMR. Poor response → reassess the diagnosis and discuss with rheumatology."},
         {n:"2", when:"Week 6", title:"Early taper", html:"ESR or CRP should be back to normal by about 4 weeks. Continue the taper if symptoms are controlled."},
         {n:"3", when:"Months 3, 6, 9 and 12", title:"Taper reviews", html:"Symptoms and function, dose and adherence, relapse and GCA symptoms, infection and steroid adverse effects, BP, weight and glycaemic risk where clinically indicated, bone health and falls risk, and ESR or CRP where useful. Repeat FBC, renal function, glucose or HbA1c according to dose, duration, comorbidity and clinical findings — avoid automatic blood testing without a clinical purpose."},
         {n:"4", when:"Year 2 and stopping", title:"Coming off", html:"Most patients stop within 1–2 years, although longer treatment is not uncommon. Review adrenal symptoms at the end of the taper and whether bone-protective treatment should continue."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"At every review", html:"Symptoms and function; dose and adherence; relapse and GCA symptoms; infection and steroid adverse effects; bone health and falls risk; ESR or CRP where useful; and the next step of the taper agreed with the patient.", src:"BSR/BHPR PMR guideline 2009"},
         {tone:"cream", h:"Written plan", html:"Give the patient a written taper schedule with the date of each step, and the symptoms that mean they should call the same day.", src:"BSR/BHPR PMR guideline 2009 · clinical practice"}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — who, where, how fast", sub:"Most typical PMR is managed in primary care. These are the exceptions.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same day — suspected GCA", html:"Headache, scalp tenderness, jaw or tongue claudication, visual symptoms, limb claudication or disproportionate constitutional symptoms → high-dose prednisolone now per the local GCA pathway (Greater Manchester: 60 mg immediately) and same-day specialist assessment via the GCA fast-track pathway; any visual symptom → same-day ophthalmology. Document the time of the steroid dose and the referral.", src:"BSR GCA guideline 2020"},
         {tone:"purple", h:"Myeloma: tests first <span class='tw'>Suspected cancer</span> · NICE NG12 myeloma", html:"People aged 60 and over with persistent bone pain, particularly back pain, or unexplained fracture: offer FBC, calcium, ESR or plasma viscosity, serum protein electrophoresis and serum free light chains (urine Bence Jones protein if serum free light chains are not available). <b>Refer using a suspected cancer pathway referral if the results suggest myeloma.</b>", src:"NICE NG12 (updated April 2026) recs 1.10.4–1.10.5"},
         {tone:"amber", h:"Rheumatology before or soon after starting steroid", html:"Atypical features: age under 60, chronic onset, no shoulder involvement, no inflammatory stiffness, prominent systemic features, weight loss, night pain, neurological signs, features of another rheumatic disease, true proximal weakness, a raised CK or rash, peripheral synovitis, persistent fever, focal bone pain or unexplained fracture, or a normal or extremely high acute phase response.", src:"BSR/BHPR PMR guideline 2009"},
         {tone:"amber", h:"Rheumatology — treatment problems", html:"Incomplete response to 15 mg, relapse or inability to reduce the dose, contraindications to glucocorticoid, or a need for treatment beyond about 2 years.", src:"BSR/BHPR PMR guideline 2009"},
         {tone:"blue", h:"Other routes", html:"Proximal weakness with a raised CK → rheumatology or neurology for myositis work-up. Fever with a very high CRP → same-day assessment for infection.", src:"BSR/BHPR PMR guideline 2009"},
         {tone:"green", h:"Primary care management", html:"Typical PMR with a clear screen and a good response at 1–3 weeks: GP-led taper, bone protection and the review schedule above.", src:"BSR/BHPR PMR guideline 2009"}
       ]},
       {b:"say", html:"Most people with polymyalgia are looked after entirely by their GP. The steroid should help a lot within the first week or two; after that we reduce it slowly and protect your bones. The one thing I need you to act on straight away is a new headache, a sore scalp, pain in your jaw when you chew, or any change in your eyesight — that could be a related condition that affects the eyes, and it needs treatment that day."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card for the exam and for real consultations.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 68-year-old man has had 5 weeks of aching across both shoulders and thighs, can barely get out of bed in the morning for the first hour, and has lost 4 kg. His CRP is 48. He asks for 'the steroid my friend had for the same thing' because he is going on holiday next week.", src:"Scenario built on BSR/BHPR PMR guideline 2009 features"},
       {tone:"cream", h:"What a strong consultation does", html:"Confirms the core features and <b>asks about GCA symptoms</b>; notices that <b>weight loss is an atypical feature</b>; takes the full <b>pre-steroid panel</b> including electrophoresis and <b>serum free light chains</b> (NG12 myeloma, if he has persistent bone or back pain); negotiates starting <b>15 mg</b> once results allow, with a <b>1–3-week response review</b> arranged around the holiday; explains that a poor response would change the diagnosis; starts <b>bone protection</b> and issues a <b>Steroid Emergency Card</b>; and safety-nets GCA symptoms clearly.", src:"BSR/BHPR PMR guideline 2009 · NICE NG12 (updated April 2026) · NOGG 2024"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Every recommendation on this page is traceable to a named primary source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>BSR and BHPR guidelines for the management of polymyalgia rheumatica</b> (Dasgupta et al., Rheumatology 2010;49:186–190; published online 2009)<br><a href="https://academic.oup.com/rheumatology/article/49/1/186/1789113" rel="noopener">academic.oup.com/rheumatology/article/49/1/186/1789113</a><span class="rd"> — core inclusion and exclusion criteria; pre-steroid core investigations; atypical features and referral triggers; prednisolone 15 mg with 70% improvement at 1 week; taper 15 mg ×3 weeks, 12.5 mg ×3 weeks, 10 mg ×4–6 weeks, then 1 mg every 4–8 weeks; IM methylprednisolone 120 mg every 3–4 weeks; follow-up weeks 0, 1–3, 6 and months 3, 6, 9, 12; 1–2 years of treatment</span></li>'+
         '<li><b>Treatment of polymyalgia rheumatica: British Society for Rheumatology guideline scope</b> (Toyoda et al., Rheumatology Advances in Practice 2024;8:rkae002)<br><a href="https://academic.oup.com/rheumap/article/8/1/rkae002/7606885" rel="noopener">academic.oup.com/rheumap/article/8/1/rkae002/7606885</a><span class="rd"> — scope only: an updated BSR PMR guideline is in development and had not been published when this page was checked, so the 2009 guideline remains the UK reference</span></li>'+
         '<li><b>Concise guidance: diagnosis and management of polymyalgia rheumatica</b> (Royal College of Physicians with BSR, Clinical Medicine 2010)<span class="rd"> — markers normal by about 4 weeks; alternate-day reductions</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral</b> (2015, updated April 2026)<br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — recs 1.10.4–1.10.5 (myeloma, amended 2025): tests for people aged 60 and over with persistent bone pain, particularly back pain, or unexplained fracture; suspected cancer pathway referral if results suggest myeloma</span></li>'+
         '<li><b>British Society for Rheumatology guideline on diagnosis and treatment of giant cell arteritis</b> (Mackie et al., Rheumatology 2020;59:e1–e23)<br><a href="https://academic.oup.com/rheumatology/article/59/3/e1/5714024" rel="noopener">academic.oup.com/rheumatology/article/59/3/e1/5714024</a><span class="rd"> — GCA safety net: prednisolone 40–60 mg, 60 mg with established visual loss, same-day referral</span></li>'+
         '<li><b>NOGG 2024 — UK clinical guideline for the prevention and treatment of osteoporosis</b> (National Osteoporosis Guideline Group)<br><a href="https://www.nogg.org.uk/sites/nogg/download/NOGG-Guideline-2024.pdf" rel="noopener">nogg.org.uk</a><span class="rd"> — immediate bone protection without waiting for DXA after a fragility fracture, in women aged 70 or over, and in postmenopausal women and men aged 50 or over on prednisolone 7.5 mg/day or more for 3 months; FRAX intervention thresholds; first-line agents</span></li>'+
         '<li><b>NICE NG243 — Adrenal insufficiency: identification and management</b> (2024)<br><a href="https://www.nice.org.uk/guidance/ng243" rel="noopener">nice.org.uk/guidance/ng243</a><span class="rd"> — sick-day dosing, adrenal crisis and glucocorticoid withdrawal; prednisolone 3–5 mg about physiological; slower supervised taper below this; 8–9 am cortisol only if symptoms arise</span></li>'+
         '<li><b>National Patient Safety Alert NatPSA/2020/005/NHSPS — Steroid Emergency Card</b> (NHS England, August 2020)<br><a href="https://www.england.nhs.uk/publication/national-patient-safety-alert-steroid-emergency-card-to-support-early-recognition-and-treatment-of-adrenal-crisis-in-adults/" rel="noopener">england.nhs.uk</a><span class="rd"> — card for adults on 5 mg or more of prednisolone a day for 4 weeks or longer</span></li>'+
         '<li><b>MHRA Drug Safety Update — Methotrexate once-weekly for autoimmune diseases</b> (September 2020)<br><a href="https://www.gov.uk/drug-safety-update/methotrexate-once-weekly-for-autoimmune-diseases-new-measures-to-reduce-risk-of-fatal-overdose-due-to-inadvertent-daily-instead-of-weekly-dosing" rel="noopener">gov.uk/drug-safety-update — methotrexate once-weekly</a><span class="rd"> — once-weekly dosing, 2.5 mg tablets, total dose in milligrams</span></li>'+
         '<li><b>SPS — Methotrexate monitoring</b> (NHS Specialist Pharmacy Service)<br><a href="https://www.sps.nhs.uk/monitorings/methotrexate-monitoring/" rel="noopener">sps.nhs.uk — methotrexate monitoring</a><span class="rd"> — baseline and ongoing FBC, LFT, albumin and renal monitoring; use with the local shared-care protocol</span></li>'+
         '<li><b>UKHSA Green Book, chapter 6 — Contraindications and special considerations</b><br><a href="https://www.gov.uk/government/publications/contraindications-and-special-considerations-the-green-book-chapter-6" rel="noopener">gov.uk</a><span class="rd"> — corticosteroid thresholds for live vaccines</span></li>'+
         '<li><b>2015 recommendations for the management of polymyalgia rheumatica: a EULAR/ACR collaborative initiative</b> (Dejaco et al., Ann Rheum Dis 2015;74:1799–1807) — international<span class="rd"> — initial dose 12.5–25 mg prednisone-equivalent; IM methylprednisolone as an alternative; early methotrexate for those at high risk of relapse or steroid harm; no NSAIDs as a substitute; exercise</span></li>'+
         '<li><b>2012 provisional classification criteria for polymyalgia rheumatica: a EULAR/ACR collaborative initiative</b> (Dasgupta B et al., Ann Rheum Dis 2012;71:484–492) — international<br><a href="https://doi.org/10.1136/annrheumdis-2011-200329" rel="noopener">doi.org/10.1136/annrheumdis-2011-200329</a><span class="rd"> — classification (not diagnostic) criteria: entry criteria and scoring; sensitivity 68%, specificity 78%</span></li>'+
         '<li><b>Sarilumab for relapse of polymyalgia rheumatica during glucocorticoid taper (SAPHYR)</b> (Spiera et al., N Engl J Med 2023;389:1263–1272)<span class="rd"> — sustained remission at week 52: 28.3% vs 10.3%; sarilumab for PMR is investigational or off-label and specialist-only</span></li>'+
         '<li><b>NICE TA518 — Tocilizumab for treating giant cell arteritis</b> (2018)<br><a href="https://www.nice.org.uk/guidance/ta518" rel="noopener">nice.org.uk/guidance/ta518</a><span class="rd"> — IL-6 blockade in GCA, distinct from PMR</span></li>'+
         '<li><b>NICE NG35 — Myeloma: diagnosis and management</b><br><a href="https://www.nice.org.uk/guidance/ng35" rel="noopener">nice.org.uk/guidance/ng35</a><span class="rd"> — do not use a normal electrophoresis or free light chain result in isolation to exclude myeloma</span></li>'+
         '<li><b>EULAR recommendations for the use of imaging in large vessel vasculitis in clinical practice: 2023 update</b> (Ann Rheum Dis 2024)<br><a href="https://doi.org/10.1136/ard-2023-224543" rel="noopener">doi.org/10.1136/ard-2023-224543</a><span class="rd"> — imaging must not delay treatment of suspected GCA</span></li>'+
         '<li><b>Greater Manchester Medicines Management Group — GCA/headache pathway and formulary</b><br><a href="https://gmmmg.nhs.uk" rel="noopener">gmmmg.nhs.uk</a> · <a href="https://www.greatermanchesterformulary.nhs.uk" rel="noopener">greatermanchesterformulary.nhs.uk</a><span class="rd"> — prednisolone 60 mg immediately for suspected GCA with same-day specialist advice; local osteoporosis and formulary choices</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — prednisolone, methylprednisolone, PPIs, bisphosphonates, calcium and vitamin D, methotrexate and folic acid</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Polymyalgia rheumatica in adults — BSR/BHPR PMR guideline 2009 (the updated BSR guideline is in development; scope published 2024), RCP/BSR concise guidance 2010, BSR GCA guideline 2020, NICE NG12 (updated April 2026), NICE NG243 (2024), NOGG 2024, NatPSA/2020/005, MHRA Drug Safety Update (September 2020) and UKHSA Green Book chapter 6; EULAR/ACR 2015 and 2012 as international sources. Check every dose against the current BNF before prescribing; this page does not replace clinical judgement or your local pathway."
