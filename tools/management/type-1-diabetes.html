     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 34-year-old man with type 1 diabetes for 12 years attends frustrated: <b>HbA1c 71 mmol/mol</b> despite \"doing everything\". He is on Lantus 24 units at night and NovoRapid 8 units with each meal — fixed doses, no carb-counting. His <b>waking readings run 11–14</b>, and he has <b>frequent readings of 3.2–3.6 in the late afternoon</b>. He injects into the same area of his abdomen \"because it doesn't hurt there\", and asks whether he should <b>increase his mealtime insulin</b>."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Does NOT increase the bolus — recognises the high waking readings mean the BASAL is wrong, and that fixing it comes first; identifies the fixed-dose regimen as the underlying problem and refers for DAFNE-style carb-counting education, which is the actual treatment here; calculates an insulin-to-carb ratio and a correction factor using the 100 rule rather than leaving him on fixed doses; <b>examines the injection sites and finds lipohypertrophy</b> — asking about rotation, and recognising that erratic absorption from one overused site explains both the highs and the lows; <b>treats the afternoon hypos as a cause of rebound highs</b>, not as a separate problem; <b>offers CGM, which NG17 recommends for everyone with type 1</b>, and can say so; <b>checks DVLA status given recurrent hypos below 4</b>; and <b>screens for the autoimmune associations and for diabetes distress</b>."}

  foot:"Type 1 diabetes in adults — NICE NG17, TA151 (pumps), TA943 (hybrid closed loop), NICE and the DVLA standards. Do not assume type 2 in an overweight adult: around half of type 1 presents over 30, and treating LADA with oral agents alone risks DKA. Basal–bolus for every adult, never pre-mixed, prescribed by brand and strength. Start at about 0.5 units/kg/day split 50:50, with a 1:10 carbohydrate ratio and the 100 rule for corrections. Fix the fasting number with basal before touching meal doses. Offer CGM to everyone. Never stop basal insulin, even when not eating. 5 to drive. Verify doses against the current BNF before prescribing."
