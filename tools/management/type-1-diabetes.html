  lead:'<div class="mg-layers"><a href="#confirm"><b>Confirm</b><small>Is it really T1?</small></a><a href="#insulins"><b>The insulins</b><small>Name · action · role</small></a><a href="#start"><b>Start</b><small>Specialist-led conventions</small></a><a href="#titrate"><b>Titrate</b><small>Pattern first</small></a><a href="#emergencies"><b>Emergencies</b><small>DKA · hypo · DVLA</small></a></div>',
  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Do not assume type 2 in an overweight adult", html:"Type 1 diabetes can present at any age, including adulthood; age, BMI and ethnicity must not be used alone to exclude it, and misdiagnosing T1 or LADA as type 2 — then starting only oral agents — risks DKA. If classification is uncertain, measure two diabetes-specific autoantibodies (e.g. GAD and IA-2 or ZnT8) at or near diagnosis; a negative result does not exclude type 1. Do not routinely request C-peptide at diagnosis. If the presentation suggests insulin deficiency, ketosis or DKA, do not delay insulin or emergency assessment while awaiting antibody results; in less acute uncertainty, discuss urgently with the diabetes team. <b>New type 1 presenting in DKA is a same-day admission.</b>"},
    {tone:"red", h:"⛔ Never stop basal insulin", html:"Not even when the patient is not eating or is vomiting — omission is the classic route to DKA. Check blood ketones when unwell or when glucose is above 13 mmol/L (Diabetes UK), and remember euglycaemic DKA: ketones can be ≥3.0 with a near-normal glucose. <b>Prescribe by BRAND, concentration and device in type 1</b>: Toujeo U300, Tresiba U200 and other concentrated insulins are not interchangeable unit-for-unit without following the product-specific conversion guidance."},
    {tone:"blue", h:"Basal–bolus (MDI) as the standard regimen", html:"Basal: NG17 prefers twice-daily detemir, but <b>Levemir is being discontinued in the UK (supply expected to end December 2026 — check the latest DHSC supply notification)</b> — do not start it in new patients. <b>Do not independently switch a patient from detemir to glargine or degludec solely through repeat prescribing</b>: use the latest DHSC notification and ABCD/PCDOS guidance, agree the alternative with the diabetes team (there is no direct equivalent to twice-daily detemir; a 10–20% initial dose reduction may be appropriate), prescribe by brand, concentration and device, and arrange early glucose review. Alternatives: glargine OD (Lantus, Semglee, Toujeo) or degludec OD (Tresiba) for flexible timing or nocturnal hypoglycaemia. Bolus: a rapid analogue — aspart, lispro or glulisine — with each meal. Pre-mixed insulin is not preferred and should only be considered where basal–bolus therapy is not possible, usually with diabetes-team input."},
    {tone:"amber", h:"Starting conventions — specialist-led, not a GP initiation protocol", html:"<b>These are approximate specialist-initiation conventions only, not NICE recommendations.</b> Insulin-naive adults, people presenting with ketosis, those in the honeymoon phase, older/frail adults, people with renal impairment and those receiving steroids require individualised specialist dosing and close follow-up; do not use these figures as a substitute for the local diabetes-team initiation protocol. Total daily dose roughly 0.5 units/kg/day (range 0.3–0.5), split about 50% basal and 50% bolus across meals — so 70 kg gives a TDD of about 35 units: basal ~17 units (halved if detemir BD), bolus ~6 units per main meal. <b>Start the insulin-to-carb ratio at about 1 unit per 10 g.</b> Correction factor by the 100 rule: 100 ÷ TDD = the mmol/L dropped per unit."},
    {tone:"green", h:"Read the whole pattern before changing insulin", html:"Interpret glucose patterns across several days before changing insulin. Assess overnight glucose, pre-bed glucose, meal boluses, exercise, alcohol, injection sites and hypoglycaemia. <b>Adjust basal only when the fasting pattern indicates a basal problem and there is no preceding nocturnal hypoglycaemia</b>; adjust meal ratios when the abnormality is meal-specific. A high fasting glucose can reflect dawn phenomenon, nocturnal hypoglycaemia with counter-regulation, late evening carbohydrate, a missed evening bolus, basal timing, injection sites, illness or steroids, or CGM misinterpretation. And check injection sites: lipohypertrophy causes erratic absorption and is a common hidden cause of poor control."},
    {tone:"purple", h:"🟣 DVLA — the 5 to drive rule", html:"Group 1: notify the DVLA if there is impaired awareness, more than one severe hypoglycaemic episode (requiring assistance from another person) while awake within the preceding 12 months, or a severe episode while driving. \"5 to drive\" — glucose must be at least 5 mmol/L; test before driving and at least every 2 hours during the journey, carry a capillary glucose meter as backup (CGM alarms supplement, but do not replace, active monitoring) and fast-acting carbohydrate. <b>After treating a hypo, do not drive until at least 45 minutes after glucose has returned above 5 mmol/L.</b> <b>Group 2 is stricter: notify after any severe hypoglycaemic episode, including during sleep.</b>"}
  ],
  pathwaySub:"Six steps, and the fourth one is where most control problems are actually solved.",
  pathway:[
    {title:"Confirm it is type 1", html:"Clinical diagnosis — rapid onset, ketosis, any age; do not exclude on age or BMI alone. If in doubt, two diabetes-specific autoantibodies (not routine C-peptide); never delay insulin where ketosis or DKA is suggested. Do the baseline work: HbA1c, U&amp;Es, urine ACR, lipids, TFTs, coeliac serology, BP, weight, and enrol in retinal and foot screening.", alert:true},
    {title:"Refer everyone for structured education", html:"DAFNE or equivalent — carbohydrate counting, insulin adjustment, exercise, alcohol, illness and ketones, hypoglycaemia, driving, psychosocial support and technology use. The backbone of good type 1 control, not an optional extra."},
    {title:"Start basal–bolus with named products", html:"<b>Initiated per the local diabetes-team protocol, prescribed by brand, concentration and device.</b> Starting conventions (about 0.5 units/kg/day, split 50:50) are specialist-supported estimates, not GP rules."},
    {title:"Adjust by pattern", html:"Review several days of glucose data first; adjust basal only for a basal-pattern problem without preceding nocturnal hypoglycaemia, and each meal's ratio against its own post-meal readings — with diabetes-team support."},
    {title:"Offer CGM to all adults and run the annual care processes", html:"NG17 (2022): offer a choice of real-time or intermittently scanned CGM to all adults with type 1 diabetes, with capillary testing as backup. Time in range above 70% is an international consensus target, not an NG17 target."},
    {title:"Drill the emergencies, sick days and driving", html:"DKA, severe hypoglycaemia, never stopping insulin when unwell, and the 5-to-drive rule."}
  ],
  sections:[

    {id:"confirm", nav:"Confirm", title:"Step 1 — confirm it IS type 1: the diagnosis that gets missed",
     blocks:[
       {b:"table", head:["Feature","Type 1","Points away — T2, LADA or MODY"], rows:[
         ["<b>Onset</b>","<b>Rapid: weeks of thirst, polyuria and weight loss</b>","Insidious, obese, metabolic syndrome = type 2"],
         ["<b>Ketosis</b>","<b>Ketones or DKA at presentation</b>","Absent"],
         ["<b>Age</b>","<b>Any age, including adulthood — age, BMI and ethnicity must not be used alone to exclude it</b>","MODY: young, strong family history, non-obese, often mild"],
         ["<b>Response to oral agents</b>","<b>Poor or transient</b>","Good and sustained in type 2"],
         ["<b>Autoimmunity</b>","<b>Personal or family history of autoimmune disease</b>","Absent"]
       ]},
       {b:"warn", html:"<b>Do not assume type 2 in an overweight adult</b> — misdiagnosing type 1 or LADA as type 2 and starting only oral agents risks DKA. If diabetes classification is uncertain, measure two diabetes-specific autoantibodies, for example GAD and IA-2 or ZnT8, at or near diagnosis. Do not routinely request C-peptide at initial diagnosis. If antibodies are negative and the classification remains uncertain, consider non-fasting C-peptide with a paired glucose; C-peptide becomes more discriminating later after diagnosis. A negative antibody result does not exclude type 1 diabetes. If the presentation suggests insulin deficiency, ketosis or DKA, do not delay insulin or emergency assessment while awaiting antibody results; in less acute diagnostic uncertainty, discuss urgently with the diabetes team rather than making a prolonged empirical diagnosis in primary care. <b>New type 1 with DKA → same-day admission.</b>"},
       {b:"dl", rows:[
         ["<b>Baseline at diagnosis</b>","HbA1c, U&amp;Es and eGFR, urine ACR, lipids, TFTs and coeliac serology (autoimmune clustering), blood pressure, weight, and enrolment in retinal and foot screening"],
         ["<b>Structured education</b>","DAFNE or equivalent for everyone, covering carbohydrate counting, insulin adjustment, exercise, alcohol, illness and ketones, hypoglycaemia, driving, psychosocial support and technology use"]
       ]}
     ]},

    {id:"insulins", nav:"The insulins", title:"Step 2 — know the insulins by name, action and role",
     blocks:[
       {b:"table", head:["Class","Named products","Onset / peak / duration","Role"], rows:[
         ["<b>Rapid-acting analogue</b>","Aspart (NovoRapid), lispro (Humalog), glulisine (Apidra); ultra-rapid: Fiasp, Lyumjev","<b>10–20 min / 1–3 h / 3–5 h</b>","<b>Bolus — with meals and for corrections</b>"],
         ["<b>Short-acting (soluble) human</b>","Actrapid, Humulin S","30 min / 2–4 h / 6–8 h","Older bolus — needs 30-minute pre-meal timing; largely superseded"],
         ["<b>Intermediate (NPH / isophane)</b>","Insulatard, Humulin I, Insuman Basal","1–2 h / 4–8 h / 12–16 h","Basal, twice daily — cheaper but more nocturnal hypoglycaemia"],
         ["<b>Long-acting analogue</b>","Detemir (Levemir, usually BD — being discontinued, UK supply expected to end December 2026), glargine U100 (Lantus, Semglee), glargine U300 (Toujeo)","<b>No pronounced peak / about 24 h</b> (detemir shorter)","<b>Basal — first-line, flatter profile</b>"],
         ["<b>Ultra-long analogue</b>","<b>Degludec (Tresiba)</b>","<b>Flat / over 42 h</b>","Basal once daily — very stable, flexible timing, less nocturnal hypoglycaemia"],
         ["<b>Pre-mixed</b>","NovoMix 30, Humalog Mix25/50, Humulin M3","Biphasic","<b>Not preferred in type 1 — only where basal–bolus therapy is not possible, usually with diabetes-team input</b>"]
       ]},
       {b:"why", html:"The physiological aim is to replace background (basal) and mealtime (bolus) insulin separately, so each can be adjusted independently. That flexibility is exactly why multiple daily injection basal–bolus therapy is the regimen of choice for adults with type 1 diabetes under NG17. Do not initiate twice-daily mixed insulin, basal-only or bolus-only regimens as routine new treatment; a twice-daily mixed regimen may be considered only where basal–bolus treatment is not possible, with specialist involvement and an agreed safety plan."}
     ]},

    {id:"start", nav:"Start", title:"Step 3 — starting the regimen: specialist-led initiation",
     blocks:[
       {b:"warn", html:"<b>These are approximate specialist-initiation conventions only.</b> Insulin-naive adults, people presenting with ketosis, those in the honeymoon phase, older/frail adults, people with renal impairment and those receiving steroids require individualised specialist dosing and close follow-up. Do not use the table as a substitute for the local diabetes-team initiation protocol."},
       {b:"table", head:["Element","Choice","Detail"], rows:[
         ["<b>First-line regimen</b>","<b>Basal–bolus (MDI) as the standard regimen for adults with type 1 diabetes</b>","Basal: detemir BD is NG17-preferred, but Levemir is being discontinued (UK supply expected to end December 2026 — check the latest DHSC supply notification), so new starts use an alternative. Existing users are switched by agreement with the diabetes team per ABCD/PCDOS guidance — not solely through repeat prescribing; there is no direct equivalent to twice-daily detemir, a 10–20% initial dose reduction may be appropriate, and CGM/capillary glucose (and ketones where appropriate) guide early review. Alternatives: glargine OD (Lantus, Toujeo), or degludec OD (Tresiba) for flexible timing or nocturnal hypoglycaemia"],
         ["<b>Bolus</b>","<b>Rapid analogue (NovoRapid, Humalog, Apidra) with each meal</b>","Count carbs and inject just before eating; the ultra-rapid products (Fiasp, Lyumjev) can be given at or just after the meal"],
         ["<b>Total daily dose</b>","About 0.5 units/kg/day (range 0.3–0.5) in an insulin-naive, non-DKA patient","Lower if lean, insulin-sensitive or in the honeymoon phase; higher with intercurrent illness or steroids"],
         ["<b>The split</b>","<b>About 50% basal, 50% bolus divided across meals</b>","e.g. 70 kg → TDD ~35 units → basal ~17 units (halved if detemir BD), bolus ~6 units per main meal"],
         ["<b>Insulin-to-carb ratio</b>","<b>Start at about 1 unit per 10 g of carbohydrate</b>","Adjust by post-meal glucose; the ratio often needs to be stronger at breakfast"],
         ["<b>Correction factor (ISF) — the 100 rule</b>","<b>100 ÷ TDD = the mmol/L dropped per unit</b>","<b>e.g. TDD 50 → 1 unit drops glucose by about 2 mmol/L.</b> Correct toward target and <b>beware stacking corrections</b>"],
         ["<b>Pumps and technology</b>","<b>CSII (TA151) and hybrid closed-loop systems (TA943)</b>","<b>For disabling hypoglycaemia, or HbA1c not met on optimised MDI.</b> Specialist-initiated; the GP supports prescriptions and reviews"]
       ]},
       {b:"warn", html:"Never stop basal insulin, even when not eating or unwell — omission is the classic route to DKA. <b>And prescribe by BRAND, concentration and device in type 1</b>: Toujeo U300, Tresiba U200 and other concentrated insulins are not interchangeable unit-for-unit without following the product-specific conversion guidance, and a substitution error is a large overdose."}
     ]},

    {id:"titrate", nav:"Titrate", title:"Step 4 — adjust safely: read the pattern, then change the responsible insulin",
     blocks:[
       {b:"table", head:["Pattern","What to adjust","How"], rows:[
         ["<b>Fasting or waking glucose off target</b>","<b>Basal — only if the pattern shows a basal problem</b>","First exclude nocturnal hypoglycaemia with counter-regulation, dawn phenomenon, late evening carbohydrate, a missed evening bolus, basal timing, injection-site problems, illness or steroids and CGM misinterpretation. If fasting hyperglycaemia coexists with daytime hypoglycaemia, do not automatically increase basal. Adjust basal in small steps with diabetes-team support"],
         ["<b>High after a specific meal</b>","<b>That meal's bolus or insulin-to-carb ratio</b>","Strengthen the ratio (e.g. 1:10 → 1:8) if consistently high at 2–4 hours post-meal"],
         ["<b>Recurrent hypoglycaemia at a particular time</b>","<b>Reduce the responsible insulin</b>","Nocturnal hypoglycaemia → reduce basal or switch to degludec. Post-meal → weaken that meal's ratio"],
         ["<b>Erratic readings or dawn phenomenon</b>","<b>Review basal timing or split</b>","Consider degludec or a pump; check injection technique and lipohypertrophy, and rotate sites"],
         ["<b>Illness or steroids</b>","<b>Increase doses temporarily</b>","<b>More frequent monitoring and ketone checks — and never omit basal.</b> Use the written sick-day algorithm or diabetes-team advice for supplementary insulin"]
       ]},
       {b:"dl", rows:[
         ["<b>The golden rule</b>","Interpret glucose patterns across several days before changing insulin. Assess overnight glucose, pre-bed glucose, meal boluses, exercise, alcohol, injection sites and hypoglycaemia. Adjust basal only when the fasting pattern indicates a basal problem and there is no preceding nocturnal hypoglycaemia; adjust meal ratios when the abnormality is meal-specific"],
         ["<b>Injection technique</b>","Rotate sites, check for lipohypertrophy (which causes erratic absorption), and confirm correct needle length — a common hidden cause of poor control"]
       ]}
     ]},

    {id:"monitor", nav:"Targets", title:"Step 5 — targets, CGM and the annual review",
     blocks:[
       {b:"table", head:["Measure","Target — individualise"], rows:[
         ["<b>HbA1c</b>","<b>≤48 mmol/mol (6.5%) if achievable without problematic hypoglycaemia</b> — individualised; may need to be higher with recurrent severe hypoglycaemia, impaired awareness, frailty, cognitive impairment, comorbidity or inability to self-manage safely; pregnancy has specific targets"],
         ["<b>Waking glucose</b>","<b>5–7 mmol/L</b>"],
         ["<b>Pre-meal glucose</b>","<b>4–7 mmol/L</b>"],
         ["<b>2 hours post-meal</b>","<b>Approximately 5–9 mmol/L</b>, interpreted in the context of the individual regimen and CGM profile"],
         ["<b>Time in range (CGM)</b>","<b>Above 70% in 3.9–10 mmol/L; under 4% of time below 3.9</b> — international consensus clinical targets, not NICE NG17 targets"]
       ]},
       {b:"table", head:["Technology / review","Detail"], rows:[
         ["<b>CGM for all adults</b>","NG17 (2022): offer CGM to all adults with type 1 diabetes, choosing real-time or intermittently scanned CGM according to the person's needs, preferences, clinical characteristics and local commissioning criteria. Provide capillary glucose testing as backup and teach when sensor readings should be confirmed"],
         ["<b>Annual care processes</b>","HbA1c, blood pressure, lipids, serum creatinine/eGFR, urine ACR, foot assessment, retinal screening, smoking status, weight/BMI, thyroid assessment where indicated, psychosocial wellbeing, injection sites, hypoglycaemia awareness, and technology review and data sharing"],
         ["<b>The autoimmune and human bits</b>","TFTs and coeliac serology periodically; mood and eating-disorder screen — insulin omission, sometimes called diabulimia; erectile function; pregnancy planning"],
         ["<b>Cardiovascular and renal protection</b>","Offer atorvastatin 20 mg for primary prevention in adults with type 1 diabetes who are over 40, have had diabetes for more than 10 years, have nephropathy or have other cardiovascular risk factors; consider in adults aged 18–40 according to duration, nephropathy and other risk factors. Do not rely on QRISK3 — it is not validated for type 1 diabetes. Established CVD → secondary prevention, aiming for LDL ≤2.0 or non-HDL ≤2.6 mmol/L (NG238). ACE inhibitor or ARB when indicated by hypertension and/or albuminuria — not simply because the patient has type 1 diabetes. <b>SGLT2 inhibitors are not routine in type 1 diabetes in the UK (euglycaemic DKA risk; dapagliflozin is no longer authorised for type 1), and GLP-1 receptor agonists are not routine glucose-lowering or cardiovascular-prevention treatment — any off-label use requires specialist advice</b>"]
       ]}
     ]},

    {id:"emergencies", nav:"Emergencies", title:"Step 6 — the emergencies, sick days and driving",
     blocks:[
       {b:"table", head:["Emergency","Recognise","Action"], rows:[
         ["<b>Hypoglycaemia</b>","Glucose below 4 mmol/L","15 g of fast-acting carbohydrate — 4–5 glucose tablets or 150 mL of juice — recheck at 15 minutes, repeat if needed, then a longer-acting carbohydrate. <b>Severe: IM glucagon or IV glucose plus 999.</b> <b>Then review the cause and reduce the responsible insulin</b>"],
         ["<b>DKA</b>","Vomiting, abdominal pain, Kussmaul breathing, ketones ≥3.0 — glucose is usually high but CAN be near-normal (euglycaemic DKA)","<b>Ketones ≥3.0 mmol/L or a clinically unwell patient: 999 or same-day admission.</b> DKA is diagnosed by ketonaemia plus metabolic acidosis, not by the ketone value alone — but in primary care treat ketones ≥3 or a clinically unwell patient as an emergency. Never omit insulin; check blood ketones when unwell or when glucose is above 13 mmol/L"],
         ["<b>Impaired awareness of hypoglycaemia</b>","<b>Loss of warning symptoms; recurrent severe hypos</b>","<b>DVLA implications.</b> Relax targets, review insulin, arrange structured education, consider CGM or a pump — specialist input"]
       ]},
       {b:"dl", rows:[
         ["<b>Blood ketone thresholds</b>","Below 0.6 mmol/L: no significant ketonaemia; continue monitoring if unwell · 0.6–1.5: increase monitoring, hydrate and follow the written sick-day plan; seek advice if rising or persistent · 1.5–2.9: urgent same-day diabetes-team/acute assessment, particularly if symptomatic · ≥3.0 or symptoms of DKA: emergency assessment/999. Follow the exact local JBDS thresholds"],
         ["<b>Sick-day rules</b>","Do not stop basal insulin. Check glucose AND blood ketones every 2–4 hours. Keep hydrated, and continue fluids containing carbohydrate if unable to eat. Use the patient's written sick-day algorithm for supplementary insulin and escalation — do not invent correction doses in primary care without diabetes-team guidance. Contact the diabetes team urgently if ketones are rising, vomiting persists, fluids cannot be kept down or glucose remains high despite correction insulin. SGLT2 inhibitors, if used for another indication, need separate sick-day rules — but they should not be used routinely in type 1 diabetes"],
         ["<b>DVLA — Group 1</b>","Notify the DVLA if there is impaired awareness, more than one severe hypoglycaemic episode (requiring assistance from another person) while awake within the preceding 12 months, or a severe episode while driving. \"5 to drive\": glucose at least 5 mmol/L, tested before driving and at least every 2 hours during the journey, with a capillary meter as backup (CGM alarms supplement, but do not replace, active monitoring) and fast carbohydrate carried. After treating a hypo, do not drive until at least 45 minutes after glucose has returned above 5 mmol/L"],
         ["<b>DVLA — Group 2</b>","<b>Stricter requirements: notify after any severe hypoglycaemic episode, including during sleep; specialist assessment</b>"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 DKA", html:"\"Vomiting, tummy pain, deep fast breathing, or blood ketones 3 or above — 999. Ketones 1.5 to 2.9 — contact us or the diabetes team the same day. Never stop your insulin, even when you are not eating.\""},
         {tone:"red", h:"🍬 Severe hypo", html:"\"If you cannot treat it yourself, someone gives glucagon or calls 999. Always carry fast sugar.\""},
         {tone:"amber", h:"🤒 Sick days", html:"\"Unwell? Keep the insulin going, check ketones every few hours, sip fluids, and use your sick-day plan.\""},
         {tone:"purple", h:"🚗 Driving — a DVLA duty", html:"\"5 to drive — test before you set off and every 2 hours. After a hypo, wait at least 45 minutes after your glucose is back above 5 before driving.\" For a car licence, tell the DVLA if you lose your hypo warning signs, have more than one severe hypo needing someone else's help while awake in 12 months, or have a severe hypo while driving (bus or lorry licence: any severe hypo, including in sleep) — that is your legal duty, and I will record that we discussed it."}
       ]}
     ]},

    {id:"troubleshoot", nav:"Control off?", title:"Control off? Work through this",
     sub:"Technique, basal and counting come before anything else.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"1 · What does the pattern show?", html:"Review several days of data, including overnight and pre-bed glucose. Is a high fasting glucose a true basal problem, or follow-on from nocturnal hypoglycaemia, a missed evening bolus or late carbohydrate?"},
         {tone:"amber", h:"2 · Carb-counting", html:"Actually counting, or using fixed doses? Have the I:C ratios been reviewed? Has DAFNE-style education happened?"},
         {tone:"blue", h:"3 · Technique and sites", html:"Lipohypertrophy, poor rotation, wrong needle length, or expired or heat-damaged insulin?"},
         {tone:"blue", h:"4 · Are hypos driving the highs?", html:"Rebound after unrecognised hypos, or over-treating them? CGM shows the pattern."},
         {tone:"green", h:"5 · Life factors", html:"Illness, steroids, alcohol, exercise, menstrual cycle, shift work — or an eating disorder with insulin omission."},
         {tone:"green", h:"6 · Right diagnosis and needs", html:"Coeliac disease, thyroid dysfunction, gastroparesis — or a genuine case for a pump or closed loop → specialist."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Shared care — what stays specialist",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same-day / 999", html:"New type 1 presenting with DKA · blood ketones ≥3.0 or clinically unwell (999); 1.5–2.9 (urgent same-day) · severe hypoglycaemia · pregnancy with vomiting or hyperglycaemia."},
         {tone:"amber", h:"Diabetes specialist team", html:"Pump or closed-loop assessment (TA151, TA943) · impaired hypoglycaemia awareness · recurrent DKA · HbA1c persistently off target despite optimised MDI · insulin initiation and dose titration · Levemir (detemir) transition · uncertain diabetes classification."},
         {tone:"amber", h:"Pre-conception and antenatal", html:"Planning pregnancy or pregnant → pre-conception specialist review and joint clinic; aim for HbA1c below 48; folic acid 5 mg daily before conception and through the first 12 weeks; retinal assessment before and during pregnancy per the diabetes pathway; renal assessment and medication review — stop statins, ACE inhibitors and ARBs before conception; pregnancy-specific glucose and ketone targets; urgent specialist review for vomiting or hyperglycaemia."},
         {tone:"blue", h:"MDT foot / retinal screening", html:"Active foot disease → same-day. Retinopathy per the screening programme."},
         {tone:"green", h:"Psychology", html:"Diabetes distress, eating disorder with insulin omission, needle phobia."},
         {tone:"cream", h:"GP management", html:"Confirming the diagnosis, the baseline and annual care processes, supporting titration with the diabetes team, prescriptions by brand, concentration and device, sick-day and DVLA advice, and the cardiovascular and renal protection all belong here. Related pages: <a href='dka.html'>DKA</a> · <a href='sick-day-rules.html'>sick day rules</a> · <a href='diabetes-unwell-insulin.html'>feeling unwell on insulin</a> · <a href='type-2-diabetes.html'>type 2 diabetes</a> · <a href='coeliac-disease.html'>coeliac disease</a> · <a href='hypothyroidism.html'>hypothyroidism</a>."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 34-year-old man with type 1 diabetes for 12 years attends frustrated: <b>HbA1c 71 mmol/mol</b> despite \"doing everything\". He is on Lantus 24 units at night and NovoRapid 8 units with each meal — fixed doses, no carb-counting. His <b>waking readings run 11–14</b>, and he has <b>frequent readings of 3.2–3.6 in the late afternoon</b>. He injects into the same area of his abdomen \"because it doesn't hurt there\", and asks whether he should <b>increase his mealtime insulin</b>."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Does NOT increase the bolus — reviews the full glucose pattern (overnight, pre-bed, the afternoon lows) before changing any dose, and does not automatically increase basal while daytime hypoglycaemia is occurring; identifies the fixed-dose regimen as the underlying problem and refers for DAFNE-style carb-counting education, which is the actual treatment here; works with the diabetes team on an insulin-to-carb ratio and correction factor rather than leaving him on fixed doses; <b>examines the injection sites and finds lipohypertrophy</b> — asking about rotation, and recognising that erratic absorption from one overused site explains both the highs and the lows; <b>treats the afternoon hypos as a cause of rebound highs</b>, not as a separate problem; <b>offers CGM, which NG17 recommends for all adults with type 1</b>, and can say so; <b>checks hypoglycaemia awareness and DVLA notification duties given recurrent hypos below 4</b>; and <b>screens for the autoimmune associations and for diabetes distress</b>."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG17 — Type 1 diabetes in adults: diagnosis and management</b><br><a href="https://www.nice.org.uk/guidance/ng17" rel="noopener">nice.org.uk/guidance/ng17</a><span class="rd"> — clinical diagnosis not excluded by age or BMI, two diabetes-specific autoantibodies with C-peptide not routinely measured, basal–bolus (MDI) as the regimen of choice with detemir twice daily preferred, twice-daily mixed insulin only where basal–bolus is not possible, the individualised HbA1c ≤48 mmol/mol target, the waking, pre-meal and 2-hour post-meal glucose targets, structured education, and the 2022 recommendation to offer CGM to all adults with type 1 diabetes. Time-in-range targets are international consensus targets, not NG17</span></li>'+
         '<li>NICE TA151 — Continuous subcutaneous insulin infusion · TA943 — Hybrid closed-loop systems<span class="rd"> — the criteria for pump and closed-loop therapy: disabling hypoglycaemia, or HbA1c not achieved on optimised multiple daily injections</span></li>'+
         '<li><b>Starting-dose conventions — clinical practice, not NICE recommendations</b><span class="rd"> — the starting total daily dose of about 0.5 units/kg/day, the 50:50 basal–bolus split, the 1 unit per 10 g starting carbohydrate ratio, the 100 rule for the correction factor and the titration steps are conventional estimates used in structured education; NG17 does not set them, so individualise with the diabetes specialist team</span></li>'+
         '<li><b>ABCD and PCDO Society — Discontinuation of Levemir (insulin detemir): joint guidance (2025, updated 2026)</b>, with DHSC Medicines Supply Notification MSN/2025/036U<br><a href="https://abcd.care/resource/current/discontinuation-levemir-insulin-detemir-joint-guidance-abcd-and-pcdo-society" rel="noopener">abcd.care</a><span class="rd"> — Levemir supply expected to end December 2026; no direct twice-daily analogue alternative; reduce the dose by 10–20% when switching and monitor closely</span></li>'+
         '<li><b>DVLA — Assessing fitness to drive</b><br><a href="https://www.gov.uk/government/publications/assessing-fitness-to-drive-a-guide-for-medical-professionals" rel="noopener">gov.uk — assessing fitness to drive</a><span class="rd"> — Group 1 notification (impaired awareness, more than one severe hypo while awake in 12 months, or a severe hypo while driving), the 5-to-drive rule with 2-hourly testing and a backup meter, the 45-minute wait after glucose returns above 5, and the stricter Group 2 standards (any severe hypo, including in sleep)</span></li>'+
         '<li><b>NICE NG238 — Cardiovascular disease: risk assessment and reduction, including lipid modification (2023)</b><br><a href="https://www.nice.org.uk/guidance/ng238" rel="noopener">nice.org.uk/guidance/ng238</a><span class="rd"> — atorvastatin 20 mg for primary prevention in type 1 diabetes by age, duration, nephropathy and risk factors (not QRISK3), and the LDL ≤2.0 / non-HDL ≤2.6 secondary-prevention targets</span></li>'+
         '<li><b>Joint British Diabetes Societies — DKA and hypoglycaemia guidance</b><span class="rd"> — the 15 g carbohydrate rule with 15-minute recheck, IM glucagon in severe hypoglycaemia, the graded blood-ketone thresholds (0.6, 1.5 and 3.0 mmol/L), DKA as ketonaemia plus acidosis, and euglycaemic DKA</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — the named insulin products with their onset, peak and duration profiles, and the requirement to prescribe by brand and strength</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Type 1 diabetes in adults — NICE NG17, TA151 (pumps), TA943 (hybrid closed loop) and the DVLA standards. Do not assume type 2 in an overweight adult: type 1 can present at any age, and treating LADA with oral agents alone risks DKA. Two autoantibodies if classification is uncertain; C-peptide not routinely at diagnosis. Basal–bolus as the standard regimen, prescribed by brand, concentration and device. Starting doses and ratios are specialist-led conventions, not GP rules. Read the whole glucose pattern before changing insulin. Offer CGM to all adults. Do not use QRISK3 for statin decisions in type 1; SGLT2 inhibitors and GLP-1 receptor agonists are not routine. Never stop basal insulin, even when not eating. 5 to drive. Verify doses against the current BNF before prescribing."
});
