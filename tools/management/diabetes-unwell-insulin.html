MG.render({
  icon:"💉",
  title:"Feeling unwell on insulin — sick-day insulin adjustment",

  stemTitle:"Never stop basal insulin — test glucose AND ketones; ketones 3.0 or more is suspected DKA and goes to hospital",
  stemSub:"For adults with type 1 or insulin-treated type 2 diabetes who are unwell but clinically stable and able to self-manage. Recognise which decompensation this is, test more often than usual, and — only within the person's individualised diabetes-team sick-day plan — add extra insulin: fixed extra units per dose when blood ketones are under 0.6, or a percentage of the total daily dose every 2 hours when blood ketones are above 1.5 but under 3.0 and the patient is clinically well. Blood ketones 3.0 or more is suspected DKA: urgent hospital assessment. Keep carbohydrate and fluids going, taper as the illness settles, and know the concrete triggers for urgent advice and admission. This does not replace the local DKA, HHS, sepsis or hospital admission pathway.",
  guideline:"NICE NG17 / NG28 · JBDS-IP DKA (2023) · MHRA · GMMMG SGLT2 · TREND-UK (consensus)",

  meta:[

  ],
  lead:'<div class="mg-layers"><a href="#severe"><b>Golden rule</b><small>Never stop insulin</small></a><a href="#workup"><b>Test</b><small>Glucose + ketones</small></a><a href="#ladder"><b>Two methods</b><small>A: units · B: % TDD</small></a><a href="#lifestyle"><b>Carbs &amp; fluids</b><small>Then taper</small></a><a href="#refer"><b>Escalate</b><small>Ketones · vomiting</small></a></div>',
  quickSub:"If you read nothing else on this page, read these six cards. Every number traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ DO NOT STOP TAKING YOUR INSULIN", html:"<b>Even when unable to eat.</b> The stress hormones of any acute illness drive glucose and ketone production up, so <b>the body needs more insulin, not less</b>. Stopping insulin — usually because of poor appetite — is the single commonest avoidable cause of DKA, and <b>basal insulin in particular is what prevents ketogenesis</b>."},
    {tone:"amber", h:"The ketone level, not the glucose, defines the risk", html:"Blood ketones: &lt;0.6 normal · 0.6–1.5 repeat within 2 hours · &gt;1.5 to &lt;3.0 high risk of DKA · <b>3.0 or more = suspected DKA, urgent hospital assessment</b>. Urine ketones are not an exact equivalent — they lag, measure acetoacetate rather than β-hydroxybutyrate, and are less reliable on an SGLT2 inhibitor — but <b>urine 2+ or more may be significant</b>, particularly with vomiting, dehydration or altered mental state. <b>&gt;1.5 mmol/L is the practical \"this could become DKA\" alarm.</b>"},
    {tone:"blue", h:"Test more often — including overnight", html:"Type 1: glucose AND ketones every 4–6 hours, including through the night. Type 2 on insulin: glucose at least 4 times a day. If glucose is &gt;11 and/or blood ketones are 0.6 or more (or urine ketones are present) → every 2 hours, including overnight."},
    {tone:"green", h:"Two consensus methods — never for suspected DKA", html:"Only within the person's individualised diabetes-team sick-day plan or a locally adopted protocol. Glucose &gt;11 with blood ketones &lt;0.6 → Method A: fixed extra units added to each usual dose. Blood ketones &gt;1.5 to &lt;3.0, clinically well, able to drink and self-manage → Method B: extra rapid-acting insulin every 2 hours as 10% of the total daily dose, with same-day specialist advice. <b>Ketones 3.0 or more → hospital, not Method B.</b> Both go <b>on top of</b> the usual basal and bolus."},
    {tone:"red", h:"A normal glucose does not reassure on an SGLT2 inhibitor", html:"<b>Euglycaemic DKA</b> — suspect DKA with nausea, vomiting, abdominal pain, anorexia, unusual fatigue, tachypnoea or dyspnoea, even if glucose is normal or only modestly raised. Stop the SGLT2 inhibitor immediately if DKA is suspected and arrange urgent assessment with blood ketones and venous acid–base testing; pause it during dehydrating illness as the <a href='sick-day-rules.html'>sick day rules</a> describe. And always hunt the precipitant (<b>sepsis, MI, missed doses</b>) — <b>ketogenesis continues until it is treated</b>."},
    {tone:"cream", h:"Then step the dose back down", html:"As the illness resolves the insulin requirement falls — reduce the increments incrementally rather than stopping abruptly. Continuing sick-day doses into recovery is a common cause of rebound hypoglycaemia, so keep fast-acting carbohydrate to hand while you taper."}
  ],
  pathwaySub:"The whole task in five moves. The red step is the one that keeps people out of hospital.",
  pathway:[
    {title:"Apply the golden rule and screen for DKA", html:"Never omit basal insulin. Then screen for suspected DKA or HHS: blood ketones 3.0 or more, persistent vomiting or unable to keep fluids down, drowsiness or confusion, Kussmaul breathing, abdominal pain, severe dehydration, suspected sepsis, MI, stroke or other serious illness, or unable to self-manage safely → urgent hospital assessment. A high NEWS2 lowers the threshold but does not diagnose or exclude DKA.", alert:true},
    {title:"Test both, in the same minute", html:"<b>Capillary glucose AND blood ketones.</b> Separate the four directions — DKA, HHS, hypoglycaemia, and euglycaemic DKA on an SGLT2 inhibitor — and find the precipitant."},
    {title:"Choose the dosing method by ketone level", html:"Only within the person's individualised or a locally adopted plan. <b>Method A</b> (blood ketones &lt;0.6) — fixed extra units per dose, recheck glucose every 4 hours. <b>Method B</b> (blood ketones &gt;1.5 to &lt;3.0, clinically well) — 10% of the total daily dose every 2 hours, rechecking both every 2 hours, with same-day specialist advice. Ketones 3.0 or more → hospital."},
    {title:"Keep carbohydrate and fluids going", html:"<b>Small frequent sips of fluid if the patient can drink safely</b>, individualised in heart failure, CKD, dialysis, frailty or prescribed fluid restriction; sugar-free when the glucose is high, sugary when it is low or the patient cannot eat. Insulin without carbohydrate causes hypoglycaemia. Oral fluids do not treat DKA — persistent vomiting or inability to maintain hydration needs urgent assessment."},
    {title:"Taper, restock, debrief", html:"Reduce the increments as the illness settles, keep testing until stable, <b>replace used ketone strips and check expiry dates</b>, document a follow-up or call-back plan, and review the sick-day plan after a severe episode."}
  ],
  sections:[

    {id:"severe", nav:"Golden rule", title:"The golden rule, and the DKA red flags",
     sub:"Glucose, ketones and conscious level separate the four directions this can go.",
     blocks:[
       {b:"warn", html:"DO NOT STOP TAKING YOUR INSULIN — even if you are unable to eat. You need food, insulin and fluids together to avoid dehydration and serious complications."},
       {b:"warn", html:"<b>This guide is not a community treatment protocol for DKA.</b> DKA requires venous blood gas, electrolytes, renal function, fluid assessment and hospital insulin/fluids according to the local JBDS-based protocol (NICE recommends intravenous insulin for adults with DKA, continuing basal insulin alongside where appropriate). Blood ketones ≥3.0 mmol/L, or significant ketonuria with clinical deterioration, should be treated as suspected DKA. Arrange urgent hospital assessment; do not delay transfer to administer repeated subcutaneous insulin. Continue basal insulin if safe and practicable, unless directed otherwise by the receiving diabetes team."},
       {b:"dl", rows:[
         ["<b>Scope</b>","Adults with type 1 or insulin-treated type 2 diabetes who are unwell but clinically stable and able to self-manage. This does not replace the local DKA, HHS, sepsis or hospital admission pathway"],
         ["<b>Not without specialist advice</b>","Pregnancy or suspected pregnancy · children and young people · recent DKA · frailty or cognitive impairment · CKD stage 4–5 or dialysis · heart failure with fluid restriction · recurrent severe hypoglycaemia or impaired awareness · unable to self-manage or without adequate support · complex concentrated insulin regimens · suspected sepsis, myocardial infarction, stroke, pancreatitis or another acute serious illness"],
         ["<b>Immediate triage</b>","Conscious level · respiratory pattern · vomiting and ability to retain fluids · dehydration and urine output · glucose and blood ketones · pregnancy possibility · insulin regimen and missed doses · SGLT2-inhibitor use · pump use · precipitating illness · social support and ability to self-manage"],
         ["<b>Community management — clinically stable only</b>","Never omit basal insulin · glucose and ketones at defined intervals · usual correction doses and any additional insulin only according to the person's individualised plan · carbohydrate-containing fluids if glucose is low or oral intake is poor · sugar-free fluids when glucose is high and carbohydrate is not needed · no insulin stacking · a documented follow-up or call-back plan"]
       ]},
       {b:"dl", rows:[
         ["<b>DKA</b>","Usually type 1. Ketones raised, acidotic, Kussmaul breathing, fruity (pear-drop) breath, abdominal pain, thirst, polyuria, dehydration, nausea and vomiting, drowsiness or confusion"],
         ["<b>HHS</b>","A biochemical and clinical diagnosis: <b>marked hyperglycaemia, hyperosmolality (usually effective serum osmolality &gt;320 mOsm/kg), severe dehydration, absent or mild ketonaemia</b>, and variable neurological disturbance. It is not confined to older people or to illness of a particular number of days. Suspected HHS → urgent hospital assessment, managed on the local JBDS HHS pathway"],
         ["<b>Hypoglycaemia</b>","<b>Not eating but insulin unchanged.</b> Glucose &lt;4 mmol/L with poor intake on continued insulin or a sulfonylurea → fast-acting carbohydrate ± glucagon — and do NOT stop the basal insulin"],
         ["<b>Euglycaemic DKA</b>","On an SGLT2 inhibitor, suspect DKA with nausea, vomiting, abdominal pain, anorexia, unusual fatigue, tachypnoea or dyspnoea, even if glucose is normal or only modestly raised — easily missed. Symptoms suggestive of DKA → urgent blood ketones (preferred to urine) and venous acid–base testing, with hospital assessment if indicated. Stop the SGLT2 inhibitor immediately if DKA is suspected, and do not restart after DKA unless another clear precipitant has been identified and resolved. Interrupt it during major surgery or acute serious or dehydrating illness, and restart only after clinical stabilisation, once eating and drinking normally (see the <a href='sick-day-rules.html'>sick day rules</a>). Routine home ketone strips for everyone with type 2 diabetes on an SGLT2 inhibitor are not necessarily required — follow the local Greater Manchester pathway"],
         ["<b>Find the precipitant</b>","Infection (UTI, chest, skin or foot), missed or insufficient insulin, pump failure, sepsis, MI, stroke, pancreatitis, a new diagnosis, alcohol — <b>ketogenesis continues until the precipitant is treated</b>. Assess for sepsis and acute deterioration using clinical assessment and the locally adopted sepsis pathway; a high NEWS2 should lower the threshold for urgent assessment but does not diagnose or exclude DKA"]
       ]},
       {b:"table", head:["Trigger","Meaning","Action"], rows:[
         ["<b>Blood ketones 3.0 mmol/L or more, or significant ketonuria (2+ or more) with clinical deterioration</b>","<b>Suspected DKA</b>","Urgent hospital assessment / 999. Do not delay transfer to give repeated subcutaneous insulin; continue basal insulin if safe and practicable, unless the receiving diabetes team directs otherwise"],
         ["<b>Blood ketones &gt;1.5 to &lt;3.0 mmol/L</b>","<b>High risk of progression to DKA</b>","<b>Same-day specialist / urgent medical advice (out of hours, 111)</b> — 2-hourly glucose and ketone testing, with extra insulin per the individualised plan, only if the patient is clinically well, able to drink and can self-manage; hospital assessment if ketones are rising or not falling at the recheck, or the patient is unwell"],
         ["<b>Any ketones with vomiting, inability to drink, drowsiness, Kussmaul breathing, severe dehydration or clinical deterioration</b>","Possible DKA","<b>Emergency assessment irrespective of glucose level</b>"],
         ["<b>Suspected sepsis, MI, stroke or other serious illness, or unable to self-manage safely</b>","Home management is not safe","<b>Urgent hospital assessment / 999</b>"],
         ["<b>Vomiting, or unable to keep fluids down</b>","Cannot maintain hydration or carbohydrate","<b>Seek urgent medical advice / admission</b> — a patient who cannot keep fluids down cannot out-drink their losses and needs IV fluids and insulin"],
         ["<b>DKA symptoms</b>","Thirst, polyuria, dehydration, laboured breathing, abdominal pain, nausea and vomiting, drowsiness or confusion, pear-drop breath","<b>Emergency</b>"],
         ["<b>Cannot control glucose or ketones despite extra insulin</b>","Home management is failing","<b>Escalate — do not keep cycling alone</b>"],
         ["<b>Unsure how to adjust the dose</b>","\u2014","Contact the diabetes specialist team or GP for advice rather than guessing"]
       ]},
       {b:"dl", rows:[
         ["<b>Safety-netting — document it</b>","Who the patient should contact in hours; the out-of-hours route; when to call 111; when to call 999; the practice process for reviewing patients with blood ketones &gt;1.5 mmol/L; and arrangements for same-day diabetes-team advice. Use the local Bolton / Greater Manchester diabetes specialist contact pathway and hospital destination, not simply \"contact the diabetes team\""]
       ]}
     ]},

    {id:"workup", nav:"Test", title:"Test — glucose and ketones, more often",
     sub:"Frequent testing, including overnight, is what catches a rising ketone trend before it tips into DKA.",
     blocks:[
       {b:"table", head:["Who","Frequency","Note"], rows:[
         ["<b>Type 1 diabetes</b>","<b>Blood glucose AND ketones every 4–6 hours, including through the night</b>","Both, every time"],
         ["<b>Type 2 on insulin</b>","<b>Blood glucose ≥4 times a day</b>; add ketone testing if glucose is &gt;11 and the patient is unwell","\u2014"],
         ["<b>Step up to 2-hourly if…</b>","Glucose &gt;11 mmol/L and/or blood ketones 0.6 mmol/L or more (or urine ketones present) → glucose and ketones every 2 hours, including overnight","This is the window in which extra insulin can still reverse ketogenesis at home"],
         ["<b>Ketone bands</b>","Blood &lt;0.6 normal · 0.6–1.5 raised, repeat within 2 hours · &gt;1.5 to &lt;3.0 high risk of DKA · 3.0 or more suspected DKA","<b>Check ketones whenever unwell or glucose is above 11 mmol/L</b> — the action for each band is in the table below"],
         ["<b>Prefer blood ketones</b>","\u2014","A blood ketone meter is more reliable and timely than urine sticks for sick-day decisions, and preferred during serious illness. Urine ketones are delayed, measure acetoacetate rather than β-hydroxybutyrate, and are less reliable in SGLT2-inhibitor-associated DKA — not an exact equivalent of blood levels — but urine 2+ or more may be significant, particularly with vomiting, dehydration or altered mental state"],
         ["<b>If admitting</b>","\u2014","Also assess hydration — <b>pulse, postural BP, capillary refill, urine output, NEWS2</b>, since dehydration accelerates deterioration. Hospital will add venous gas and bicarbonate, U&amp;E, FBC, CRP and cultures — do not delay referral to obtain these in the community"]
       ]},
       {b:"table", head:["Blood ketones","Suggested GP action"], rows:[
         ["<b>&lt;0.6 mmol/L</b>","No significant ketonaemia. Continue usual insulin; manage illness and monitor more frequently"],
         ["<b>0.6–1.5 mmol/L</b>","Repeat within 2 hours, maintain fluids/carbohydrate, and obtain same-day diabetes-team advice if persistent or rising"],
         ["<b>&gt;1.5 to &lt;3.0 mmol/L</b>","High risk of progression to DKA. Same-day specialist/urgent medical advice; 2-hourly glucose and ketone testing only if the patient is clinically well, able to drink and can self-manage"],
         ["<b>≥3.0 mmol/L</b>","<b>Suspected DKA: urgent hospital assessment</b>"],
         ["<b>Any ketones with vomiting, inability to drink, drowsiness, Kussmaul breathing, severe dehydration or clinical deterioration</b>","<b>Emergency assessment irrespective of glucose level</b>"]
       ]},
       {b:"why", html:"The 2-hourly cycle for a glucose above 11 with ketones is <b>deliberately intensive</b>, because that is precisely the window in which extra insulin can still switch off ketogenesis at home. Blood ketones ≥3.0 mmol/L, or urine 2+ or more with clinical deterioration, is suspected DKA — urgent hospital assessment; do not delay transfer to give repeated subcutaneous insulin, and continue basal insulin if safe and practicable."}
     ]},

    {id:"ladder", nav:"Two methods", title:"Two ways to add insulin — pick by ketone level",
     sub:"Extra doses are always additional to the usual regimen. Keep the normal basal and bolus running underneath. These consensus-based sick-day algorithms are not DKA treatment and are used only within an individualised plan or if adopted by the local diabetes service.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Glucose &gt;11, blood ketones &lt;0.6 → Method A", html:"<b>Add a fixed number of extra units to each usual insulin dose</b>, scaled by glucose. <b>Test glucose every 4 hours.</b> Blood ketones of 0.6–1.5 are not \"no ketones\": repeat within 2 hours, maintain fluids and carbohydrate, and seek same-day diabetes-team advice if persistent or rising."},
         {tone:"amber", h:"Blood ketones &gt;1.5 to &lt;3.0 → Method B (specialist-approved plan)", html:"Only if clinically well, able to drink and able to self-manage, with same-day specialist advice: extra rapid-acting insulin every 2 hours as 10% of the total daily dose. <b>Blood ketones 3.0 or more is suspected DKA — urgent hospital assessment, not Method B.</b>"},
         {tone:"green", h:"Always — continue the usual insulin and basal", html:"Extra doses are additional. Keep taking the normal basal/bolus or mixed insulin as prescribed — basal insulin is what prevents ketogenesis in the first place."},
         {tone:"blue", h:"If on a pump", html:"Pump users require a separate specialist pump sick-day plan — with no long-acting insulin depot, DKA can develop rapidly after interruption. Check the infusion set, cannula, reservoir, tubing, battery and insulin. If ketones are elevated or glucose is not responding to a correction, give rapid-acting insulin by pen and change the set as advised by the diabetes team. Do not rely on pump delivery if failure is suspected. Suspected DKA requires hospital assessment; if intravenous insulin is started, the pump is generally discontinued under hospital protocol."}
       ]},
       {b:"warn", html:"These dose tables are not a substitute for an individualised diabetes-team sick-day plan. They must not be extrapolated beyond the stated ranges or applied to a different insulin regimen without specialist advice. They are consensus-based sick-day algorithms (TREND-UK, Down 2020), not DKA treatment and not necessarily applicable to every adult insulin regimen — use them only if explicitly adopted by the local diabetes service."},
       {b:"dl", rows:[
         ["<b>Total daily dose (TDD)</b>","All insulin usually taken in 24 hours — basal plus all bolus doses, or all doses of a mixed insulin"],
         ["<b>Type of extra insulin</b>","Method B extra doses are rapid-acting insulin; people on twice-daily mixed insulin need regimen-specific advice from the diabetes team"],
         ["<b>Recent correction doses</b>","Account for any correction dose already given and insulin still active — do not stack doses"],
         ["<b>Pumps</b>","Do not give supplementary doses through the pump if failure is suspected — use a pen, per the specialist pump sick-day plan"],
         ["<b>Specialist advice first</b>","Basal-only or twice-daily mixed regimens, CKD, frailty, and patients eating very little"]
       ]},
       {b:"table", head:["Method A — glucose (mmol/L)","Add to EACH dose","If total daily dose &gt;50 units"], rows:[
         ["<b>11–17</b>","<b>+2 extra units</b>","<b>Double it: +4</b>"],
         ["<b>17–22</b>","<b>+4 extra units</b>","<b>Double it: +8</b>"],
         ["<b>&gt;22</b>","<b>+6 extra units</b>","<b>Double it: +12</b>"]
       ]},
       {b:"dl", rows:[
         ["<b>Method A in practice</b>","Take the prescribed insulin <b>plus</b> these increments. All adjustments are incremental and should be reduced gradually as the illness subsides. <b>Recheck glucose every 4 hours — every 2 hours if ketones appear.</b> Once the initial increased dose has been given, contact the GP or diabetes specialist nurse if still unsure"]
       ]},
       {b:"table", head:["Method B — total daily dose","+10% (blood ketones &gt;1.5 to &lt;3.0, clinically well)"], rows:[
         ["<b>Up to 14 units</b>","<b>1 unit every 2 hours</b>"],
         ["<b>15–24 units</b>","<b>2 units every 2 hours</b>"],
         ["<b>25–34 units</b>","<b>3 units every 2 hours</b>"],
         ["<b>35–44 units</b>","<b>4 units every 2 hours</b>"],
         ["<b>45–54 units</b>","<b>5 units every 2 hours</b>"],
         ["<b>Over 54 units</b>","<b>Contact the specialist team or GP</b>"],
         ["<b>Blood ketones 3.0 or more</b>","<b>Suspected DKA — urgent hospital assessment, not a home dose</b>"]
       ]},
       {b:"warn", html:"Recheck glucose and ketones at the specified interval. Do not continue repeated supplemental doses without specialist advice if ketones are not falling, glucose is falling rapidly, oral intake is poor, or hypoglycaemia occurs — avoid insulin stacking. Blood ketones reaching 3.0 mmol/L or more means urgent hospital assessment. A total daily dose &gt;54 units, or any uncertainty about altering doses, means contacting the specialist team rather than extrapolating the table."},
       {b:"why", html:"<b>Ketones change the dosing logic.</b> Without ketones, a modest fixed top-up per dose corrects the hyperglycaemia; with ketones, you need larger, more frequent rapid-acting doses to switch off ketone production, which is why the percentage-of-total-daily-dose method is used. The fixed-increment table gives patients a simple, consensus-based correction <b>without needing to calculate ratios while feeling unwell</b>, and the doubling rule above 50 units a day accounts for the relative insulin resistance of higher-requirement patients, in whom small fixed increments would be inadequate. Dosing by percentage scales the correction to the patient's own requirement — and the cut-off above 54 units reflects that very high-requirement or brittle patients need specialist input rather than an off-the-shelf table."}
     ]},

    {id:"lifestyle", nav:"Carbs &amp; fluids", title:"Carbohydrate and fluids alongside the insulin — then the taper",
     sub:"Insulin alone is not enough: without carbohydrate the extra doses cause hypos, without fluid the patient dehydrates — but oral fluids never treat DKA.",
     blocks:[
       {b:"table", head:["Situation","Do this"], rows:[
         ["<b>Glucose &lt;11 and no ketones</b>","<b>Take insulin as normal.</b> Take carbohydrate as a meal replacement and <b>small frequent sips of sugar-free liquids if able to drink safely</b>"],
         ["<b>Glucose &gt;11</b>","Continue insulin plus the extra doses; maintain fluids with sugar-free drinks to rehydrate without pushing the glucose higher"],
         ["<b>Unable to eat, or vomiting</b>","Replace meals with sugary fluids or easy carbohydrate — soup, milk, yoghurt, ice cream — to keep calories up. If vomiting persists or fluids cannot be kept down, oral hydration is failing: urgent assessment"],
         ["<b>Glucose running low</b>","Switch to sugary fluids to keep the glucose up — but never omit basal insulin"],
         ["<b>Volume</b>","<b>Encourage small frequent sips of fluid if the patient can drink safely.</b> The amount should be individualised in heart failure, CKD, dialysis, frailty or prescribed fluid restriction"],
         ["<b>Ketones present</b>","<b>Maintain hydration alongside any extra insulin — oral fluids do not treat DKA</b>; persistent vomiting or inability to maintain hydration requires urgent assessment"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"📉 Taper the extra insulin gradually", html:"As the illness resolves, adjust the insulin back to normal — reduce the increments incrementally rather than stopping abruptly."},
         {tone:"amber", h:"⚠️ Watch for hypos", html:"As appetite and wellbeing return, the extra insulin can cause hypoglycaemia — reduce promptly and keep fast-acting carbohydrate to hand."},
         {tone:"blue", h:"🔁 Keep testing until stable", html:"Continue more frequent glucose (and ketone) checks until back to baseline, then resume the usual routine and the prescribed doses."},
         {tone:"cream", h:"🧰 Debrief and restock", html:"If the episode needed big dose changes or nearly led to admission, review with the GP or DSN and refresh the sick-day plan. Replace used ketone strips and check expiry dates so the kit is ready next time."}
       ]},
       {b:"why", html:"The recovery taper matters because the insulin requirement falls as the illness and its stress hormones settle — continuing sick-day doses into recovery is a common cause of rebound hypoglycaemia. Tapering incrementally, while still testing, lands the patient safely back on their usual regimen."}
     ]},

    {id:"monitor", nav:"Preparation", title:"Key safety points and patient preparation",
     sub:"These rules are useless if the patient does not have the kit and the plan before they fall ill.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"💉 Never stop insulin", html:"The single most important message — even when not eating. Basal insulin in particular prevents ketogenesis."},
         {tone:"amber", h:"➕ Extra doses are additional", html:"Always on top of the normal regimen, incremental, and tapered as the illness resolves."},
         {tone:"blue", h:"🩸 Blood ketone meter and strips", html:"Ensure the patient has an in-date meter and strips at home before they are ill."},
         {tone:"blue", h:"🔢 Know the numbers", html:"Blood ketones 0.6–1.5 = repeat within 2 hours; above 1.5 = same-day advice; 3.0 or more = hospital. Glucose above 11 = step up testing and follow the sick-day plan."},
         {tone:"green", h:"📋 Written plan and contacts", html:"An individualised diabetes-team sick-day plan (with the TREND-UK leaflet as a supplement), the local Bolton / Greater Manchester diabetes specialist contact, in-hours, out-of-hours, 111 and 999 routes, and any dose tables the diabetes team has adopted for this person."},
         {tone:"cream", h:"💊 Other medicines on a sick day", html:"Insulin is only one part of the plan. During a significant dehydrating illness, particularly vomiting, diarrhoea, poor fluid intake or hypotension, consider temporarily withholding metformin, SGLT2 inhibitors, NSAIDs, ACE inhibitors/ARBs and diuretics according to the individual's clinical circumstances and local policy — not automatically for every minor illness, and stopping diuretics may be harmful in heart failure. Withhold or review sulfonylureas when oral intake is reduced, because of hypoglycaemia risk. Document which medicines have been stopped, when they should be restarted, and whether renal function/electrolytes need checking; restarting ACE inhibitors/ARBs, diuretics and metformin may need assessment of blood pressure, hydration, creatinine and potassium, and prolonged illness, CKD, heart failure or frailty need clinical review rather than a fixed restart rule. Anyone steroid-dependent follows their individual adrenal-insufficiency sick-day plan (stress dosing) with an emergency hydrocortisone supply, and needs urgent parenteral hydrocortisone and emergency services if oral absorption is compromised. Time-critical medicines are never omitted. The drug-by-drug rules, steroid doses and restart advice are on one page: <a href='sick-day-rules.html'>Sick day rules protocol</a>.", src:"NICE NG28; KDIGO 2024 CKD guideline; NICE NG243 (2024); GMMMG SGLT2 guidance"}
       ]},
       {b:"say", html:"The most important thing I can tell you is that your insulin does not stop, even if you cannot face food — being ill pushes your sugars up, so you usually need more, not less. Test your sugar and your ketones more often than usual, including overnight. If your sugar is high but ketones are clear, follow your sick-day plan for extra units. If ketones are up, that is the one that worries me: recheck within two hours, keep sipping fluids, and ring us or the diabetes team the same day — only take extra two-hourly doses if your plan says so. And if you start vomiting, cannot keep fluids down, become drowsy or breathless, or the ketones reach three or more, that is a hospital job — do not sit at home with it."}
     ]},

    {id:"refer", nav:"Escalate", title:"When to seek urgent advice or admit",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Urgent hospital assessment / 999", html:"Suspected DKA; blood ketones ≥3.0 mmol/L (or urine ketones 2+ or more with clinical deterioration); persistent vomiting or inability to retain fluids; drowsiness/confusion; Kussmaul breathing; severe dehydration; suspected sepsis, MI, stroke or other serious illness; or inability to self-manage safely."},
         {tone:"red", h:"Seek urgent medical advice", html:"Starting to vomit, unable to keep fluids down, or unable to control glucose or ketones."},
         {tone:"amber", h:"Ketones above 1.5 (under 3.0) mmol/L", html:"High risk of progression to DKA → same-day specialist / urgent medical advice (out of hours, 111); 2-hourly glucose and ketone checks, with extra insulin per the individualised plan, only if clinically well, able to drink and able to self-manage; hospital if the ketones rise or do not fall. The practice should have a process for reviewing every patient with ketones above 1.5."},
         {tone:"blue", h:"Unsure how to adjust", html:"Total daily dose &gt;54 units, or any uncertainty about altering doses → contact the specialist team or GP."},
         {tone:"amber", h:"Not improving", html:"Persistent hyperglycaemia or ketones despite extra insulin, or clinical deterioration → escalate."},
         {tone:"amber", h:"High-risk patient — lower the threshold", html:"<b>Specialist advice before using this guide:</b> pregnancy, children and young people, recent DKA, impaired hypoglycaemia awareness or recurrent severe hypos, frailty or cognitive impairment, CKD 4–5 or dialysis, heart failure with fluid restriction, pumps or complex concentrated insulin regimens, or limited support to self-manage."},
         {tone:"blue", h:"Safety-net and follow-up", html:"Give in-hours, out-of-hours, 111 and 999 routes, use the local Bolton / Greater Manchester diabetes specialist contact pathway, and document a call-back or follow-up plan."}
       ]},
       {b:"why", html:"The escalation triggers are deliberately concrete — vomiting, ketones above 1.5–3.0, uncontrolled glucose — because these are the points at which home management is failing and DKA becomes likely. A patient who cannot keep fluids down cannot out-drink their losses and needs IV fluids and insulin."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 24-year-old with type 1 diabetes phones on day one of a flu-like illness. She has eaten almost nothing since yesterday and <b>halved her insulin because she was not eating</b>. Her glucose is 19 and she has not checked ketones — she is not sure the meter has strips."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Corrects the halved dose immediately and explains why illness raises requirements; <b>gets ketones measured before choosing a method</b>; follows her individualised sick-day plan — <b>Method B only for blood ketones above 1.5 but under 3.0 if she is well and can drink, Method A if ketones are normal, hospital if 3.0 or more</b> — with actual numbers rather than \"take a bit more\"; covers <b>carbohydrate and small frequent sips of fluid</b>; gives <b>explicit escalation triggers</b> (vomiting, ketones above 1.5 then 3.0 or more); arranges a <b>2-hourly recheck and a call back</b>; and — the step candidates miss — checks she actually has in-date ketone strips, and plans the taper so she does not hypo on the way back down."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>TREND Diabetes — <em>Type 1 diabetes: What to do when you are ill</em> (2018) and <em>Type 2 diabetes: What to do when you are ill</em> (2020)<br><a href="https://trend-uk.org" rel="noopener">trend-uk.org</a><span class="rd"> — consensus source of both dose-adjustment tables, the testing frequencies and the never-stop-insulin rule; sick-day algorithms, not DKA treatment, and not necessarily applicable to every adult insulin regimen</span></li>'+
         '<li>Down S (2020). How to advise on sick day rules. <em>Diabetes &amp; Primary Care</em> 22: 47–8<br><a href="https://diabetesonthenet.com" rel="noopener">diabetesonthenet.com</a><span class="rd"> — consensus-based fixed-increment (Method A) table, the doubling rule above 50 units/day, and the percentage-of-total-daily-dose (Method B) schedule</span></li>'+
         '<li><b>NICE NG17 — Type 1 diabetes in adults</b><br><a href="https://www.nice.org.uk/guidance/ng17" rel="noopener">nice.org.uk/guidance/ng17</a><span class="rd"> — individualised sick-day protocols with ketone monitoring; intravenous insulin for adults with DKA, continuing basal insulin where appropriate</span></li>'+
         '<li><b>NICE NG28 — Type 2 diabetes in adults</b><br><a href="https://www.nice.org.uk/guidance/ng28" rel="noopener">nice.org.uk/guidance/ng28</a><span class="rd"> — individualised sick-day rules covering medicine changes, insulin adjustment and restarting therapy</span></li>'+
         '<li><b>JBDS-IP — The management of diabetic ketoacidosis in adults (March 2023)</b><br><a href="https://abcd.care/resource/current/jbds-02-management-diabetic-ketoacidosis-adults" rel="noopener">abcd.care</a><span class="rd"> — diagnostic criteria (diabetes; blood ketones ≥3.0 mmol/L or significant ketonuria, generally 2+ or more; venous pH &lt;7.30 and/or bicarbonate &lt;15 mmol/L) and hospital management with IV fluids and fixed-rate insulin infusion</span></li>'+
         '<li><b>KDIGO 2024 Clinical Practice Guideline for the Evaluation and Management of CKD</b> (<em>Kidney International</em> 2024; doi:10.1016/j.kint.2023.10.018) and <b>UK Kidney Association — Treatment of acute hyperkalaemia in adults (December 2023)</b><br><a href="https://ukkidney.org/health-professionals/guidelines" rel="noopener">ukkidney.org/health-professionals/guidelines</a><span class="rd"> — individualised rather than blanket withholding of medicines during dehydrating illness, with a documented restart plan; broad sick-day (SADMANS) rules can cause harm through failure to restart treatment or destabilisation of heart failure/hypertension. Detail on the sick day rules protocol</span></li>'+
         '<li><b>MHRA Drug Safety Update — SGLT2 inhibitors: updated advice on the risk of diabetic ketoacidosis</b><br><a href="https://www.gov.uk/drug-safety-update/sglt2-inhibitors-updated-advice-on-the-risk-of-diabetic-ketoacidosis" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> — test for ketones when DKA symptoms occur even with near-normal glucose; stop if DKA is suspected; do not restart after DKA unless another clear precipitant was identified and resolved; interrupt in major surgery or acute serious illness</span></li>'+
         '<li><b>MHRA Drug Safety Update — SGLT2 inhibitors: monitor ketones in blood during treatment interruption for surgical procedures or acute serious medical illness</b><br><a href="https://www.gov.uk/drug-safety-update/sglt2-inhibitors-monitor-ketones-in-blood-during-treatment-interruption-for-surgical-procedures-or-acute-serious-medical-illness" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> — blood ketones preferred during treatment interruption</span></li>'+
         '<li><b>Greater Manchester Medicines Management Group — Guidelines for safe prescribing of SGLT2 inhibitors in type 2 diabetes (modified March 2026)</b><br><a href="https://gmmmg.nhs.uk" rel="noopener">gmmmg.nhs.uk</a><span class="rd"> — pause during dehydrating illness and restart only once eating and drinking normally and no longer acutely unwell; local ketone-testing pathway</span></li>'+
         '<li><b>NICE NG243 — Adrenal insufficiency: identification and management</b><br><a href="https://www.nice.org.uk/guidance/ng243" rel="noopener">nice.org.uk/guidance/ng243</a><span class="rd"> — steroid sick-day stress dosing and urgent parenteral hydrocortisone</span></li>'+
         '<li><b>Diabetes Technology Network UK — Best practice guide: continuous subcutaneous insulin infusion (CSII) for adult diabetes services (March 2018)</b><span class="rd"> — pump sick-day management, in-date blood ketone testing and pen-based correction when ketones are raised</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Feeling unwell on insulin — NICE NG17 and NG28, JBDS-IP DKA (2023), MHRA, GMMMG SGLT2 guidance, NICE NG243, and the consensus TREND-UK (2018, 2020) and Down S (2020) Diabetes &amp; Primary Care 22: 47–8 sick-day algorithms. Blood ketones above 1.5 mmol/L indicate high DKA risk; 3.0 mmol/L or more is suspected DKA needing urgent hospital assessment. Dose tables apply only within an individualised or locally adopted plan; this is not a DKA treatment protocol. Never stop insulin even if unable to eat. Which drugs to pause during a dehydrating illness is covered by the sick day rules protocol. Always individualise with the diabetes team and current guidance."
});
