<script>
MG.render({
  icon:"💊",
  title:"Opioids in non-cancer pain — the complete guide",
  eyebrow:"Protocol · Opioids Aware (FPM) · NICE NG193 · MHRA 2020",
  stemTitle:"Knowing which pains opioids are unlikely to help is half the work — and for established users the answer is rarely a higher dose: review benefit and harm together and agree an individualised plan",
  stemSub:"One page for opioids in chronic non-cancer pain in adults. NICE NG193 advises against initiating opioids for <b>chronic primary pain</b>; for chronic secondary pain, identify and treat the underlying cause and consider opioids only in carefully selected patients after a documented risk–benefit assessment and failure or inadequacy of appropriate non-opioid options. If a trial is justified, use the lowest appropriate immediate-release dose with <b>written functional goals, a defined duration, a maximum daily dose and early review</b>. Treat about 50 mg/day OME as a prompt for heightened review and seek specialist advice when approaching or exceeding 90 mg/day (Opioids Aware 2026; follow the current GMMMG/FPM pathway) — neither is a safe threshold, a legal limit or an absolute ceiling. Avoid the weak-opioid traps; avoid sedative combinations; anticipate constipation; and offer established users an individualised, proportional taper agreed together. <b>This pathway does not cover acute postoperative pain, trauma, renal colic, sickle-cell pain, cancer pain, palliative care or opioid dependence treatment — use the relevant acute, surgical, cancer or addiction pathway.</b>",
  guideline:"Opioids Aware · FPM · NICE NG193 · NICE NG215 · MHRA Drug Safety Updates · GMMMG high-dose opioid guidance and discharge standards",
  reviewed:"14 September 2026",
  nextReview:"14 March 2027",
  meta:[
    {t:"Opioids Aware (Faculty of Pain Medicine) · NICE NG193"},
    {t:"~50 mg/day OME review prompt · specialist advice approaching 90", tone:"tw"},
    {t:"Avoid with benzodiazepines, Z-drugs, gabapentinoids, alcohol", tone:"tw"},
    {t:"v2.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#before"><b>Which pain?</b><small>Half the battle</small></a><a href="#trial"><b>Trial</b><small>Goals · early review</small></a><a href="#choice"><b>Choice</b><small>OME review thresholds</small></a><a href="#harms"><b>Harms</b><small>Constipation · benzos</small></a><a href="#taper"><b>Taper</b><small>Individualised · proportional</small></a></div>',
  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⛔ Where opioids should not be started", html:"<b>Chronic primary pain</b>, including fibromyalgia (NICE NG193: do not initiate opioids); chronic low back pain (NICE NG59: do not offer opioids); headache and migraine (opioids are generally inappropriate for migraine and can cause medication-overuse headache). For chronic abdominal, pelvic or headache presentations, first establish the diagnosis and use the condition-specific pathway. For <b>chronic secondary pain</b> (for example osteoarthritis, inflammatory arthritis, vertebral fracture, chronic post-surgical pain), identify and treat the underlying cause and consider opioids only in carefully selected patients after a documented risk–benefit assessment. <b>Saying no where opioids are not indicated, with the reason, is often the kindest prescription.</b>"},
    {tone:"red", h:"⚠ Avoid co-prescribing with benzodiazepines, Z-drugs or gabapentinoids", html:"Avoid co-prescribing opioids with benzodiazepines, Z-drugs, gabapentinoids or alcohol wherever possible — respiratory depression risk is increased, and is higher with obstructive sleep apnoea (MHRA). Gabapentin and pregabalin can themselves cause severe respiratory depression, particularly in older people and with respiratory disease or renal impairment. Do not initiate an avoidable combination. If a combination is clinically unavoidable or already established, use the lowest effective doses for the shortest duration, review urgently, give clear respiratory-depression counselling and consider take-home naloxone where appropriate. Review and deprescribe established high-risk combinations — agree which medicine is reduced first and taper cautiously with close review; do not stop either medicine abruptly. Gabapentinoids need their own dependence and withdrawal plan (NICE NG215)."},
    {tone:"blue", h:"The trial, with the exit named at the start", html:"If an opioid trial is clinically justified, use the <b>lowest appropriate immediate-release dose</b>, with a defined duration, written functional goals, a maximum daily dose and early review — \"as directed\" is never acceptable. Dose selection must account for age, frailty, renal/hepatic function, respiratory risk and concurrent CNS depressants; check the product information and local Greater Manchester opioid guidance. In a suitable adult without major risk factors, an observed response to a carefully prescribed immediate-release trial may help show whether opioids give meaningful analgesia and functional benefit; absence of useful benefit should prompt stopping rather than automatic dose escalation. Do not use a fixed 20 mg dose as a universal diagnostic test. <b>Prescribe constipation prevention from the outset when clinically appropriate.</b>"},
    {tone:"amber", h:"OME review thresholds, and the weak-opioid traps", html:"Risk increases with increasing OME. Use approximately <b>50 mg/day OME as a prompt for heightened review</b> and avoid escalation unless there is clear, documented benefit. <b>Seek specialist or pain-service advice when approaching or exceeding 90 mg/day</b> (Opioids Aware 2026; GMMMG high-dose guidance also uses a caution threshold above 50 mg and advises not escalating towards about 120 mg/day, at which harm increases substantially), or earlier where there are major risk factors, high-dose sedatives, misuse, respiratory disease, frailty or poor functional benefit. Use OME as an approximate risk marker, not an exact dose-conversion figure — do not treat any OME value as a safe threshold, a legal primary-care ceiling or an automatic indication for compulsory tapering. Do not escalate towards high doses without senior or specialist advice, and follow the current GMMMG/FPM pathway for referral thresholds. Do not automatically convert to modified-release morphine. Tramadol is not \"safe-lite\": serotonergic with SSRI interaction, lowers the seizure threshold, genuinely dependence-forming with nasty withdrawal. Codeine is a prodrug converted to morphine by CYP2D6: poor metabolisers may receive little analgesia, while ultra-rapid metabolisers may develop unexpectedly high morphine exposure."},
    {tone:"amber", h:"Opioid-induced hyperalgesia — consider it, don’t assume it", html:"Consider opioid-induced hyperalgesia when pain becomes more diffuse, less anatomically consistent or increasingly sensitive as opioid exposure rises (MHRA). It is a diagnosis of clinical assessment and exclusion, not established by dose escalation alone — also consider tolerance, central sensitisation, depression, anxiety or poor sleep, withdrawal between doses, new or progressive disease, medication misuse and the wrong pain diagnosis. Re-examine for new pathology before attributing worsening pain to opioids; if hyperalgesia is likely, the plan is a taper, not an increase. When someone on opioids is still in pain, the answer is rarely a higher dose: check functional benefit, hyperalgesia, whether the pain type is right, the dangerous combinations, the person's mood and sleep, and whether there is new pathology."},
    {tone:"green", h:"The taper: individualised, proportional, agreed together", html:"Agree an individualised, proportional taper (NICE NG215). A reduction of approximately 5–10% of the current dose every 2–4 weeks may be a reasonable starting point for some patients (example only — not a mandatory schedule), but slower or faster reductions may be appropriate. One opioid at a time; reduce the size of decrements as the dose falls; pause or slow if withdrawal is problematic; review regularly; avoid abrupt cessation. Long-standing high-dose reduction can destabilise patients and needs individualising, with MDT support where required (FPM). Pre-warn about withdrawal (sweats, yawning, cramps, restless legs, anxiety, diarrhoea): withdrawal symptoms and recurrence of the underlying pain can overlap — assess timing, autonomic/GI symptoms, function, examination and the response to holding or slowing the taper."}
  ],
  pathwaySub:"Eight steps. The first decides whether the rest apply at all, and the sixth is where most patients actually are.",
  pathway:[
    {title:"Decide which pain this is", html:"Identify the pain mechanism and underlying cause and exclude new pathology and red flags. Chronic primary pain (NG193: do not initiate opioids), chronic secondary pain (treat the cause; opioids only in carefully selected patients), a different ladder (neuropathic), or acute pain (outside this pathway). Review non-pharmacological and non-opioid treatments. <b>Then run the risk screen before starting.</b>", alert:true},
    {title:"Agree goals and the exit before the first prescription", html:"Written functional goals, trial duration, review date, maximum daily dose, adverse-effect monitoring and end-of-treatment plan — review early, no later than 2–4 weeks; no meaningful benefit means taper and stop."},
    {title:"Run the trial: lowest appropriate immediate-release dose", html:"Continue only with objective improvement in function, sleep, activity or quality of life. Do not automatically convert to modified-release; individualise formulation and schedule."},
    {title:"Choose the right opioid and review at OME thresholds", html:"Individualise the opioid and formulation; in renal impairment use a renal-safe strategy with pharmacy or specialist advice. About 50 mg/day OME prompts heightened review; seek specialist advice approaching or exceeding 90 mg/day — neither is a safe threshold or an absolute ceiling."},
    {title:"Manage the harms actively", html:"Constipation from day one, respiratory depression, hyperalgesia, endocrine effects, falls, naloxone eligibility — and distinguish dependence from addiction."},
    {title:"Offer optimisation to established users", html:"<b>Where benefit does not outweigh harm: invite rather than ambush; individualised proportional taper; never stop abruptly.</b>"},
    {title:"Give the patient the safety rules", html:"<b>Overdose signs, avoid sedative combinations, driving, storage, never stop dead.</b>"},
    {title:"Refer the ones who need more than primary care", html:"Pain service when approaching or exceeding 90 mg OME (or earlier with major risk factors), drug service for suspected opioid use disorder, and re-examine for a definitive fix."}
  ],
  sections:[

    {id:"before", nav:"Which pain?", title:"Step 1 — which pain is this? Half the battle is won here",
     blocks:[
       {b:"table", head:["Category","Detail"], rows:[
         ["<b>Do not initiate</b>","Chronic primary pain including fibromyalgia where no adequately explanatory pathology is present (NICE NG193: do not initiate opioids), chronic low back pain (NICE NG59: do not offer opioids), headache and migraine (establish the diagnosis and use the headache pathway; opioids are generally inappropriate for migraine and can cause medication-overuse headache) — saying no here, with the why, is often the kindest prescription. Established users: review through shared decision-making rather than stopping automatically (NG193)"],
         ["<b>Different pathway</b>","Neuropathic pain → the amitriptyline, duloxetine and gabapentinoid ladder. Inflammatory → treat the disease. Chronic abdominal or pelvic pain → first establish the diagnosis and use the relevant condition-specific pathway. Mechanical pain awaiting surgery → a time-limited bridge where the stop date IS the operation date"],
         ["<b>Chronic secondary pain — selected patients only</b>","A definable cause — osteoarthritis, inflammatory arthritis, vertebral fracture, chronic post-surgical pain, cancer-treatment-related pain or other structural or inflammatory disorders. Identify and treat the underlying cause; consider opioids only after a documented risk–benefit assessment and failure or inadequacy of appropriate non-opioid options, with benefit demonstrated and the lowest effective dose. <b>Even here: an adjunct to movement, not instead of it</b>"],
         ["<b>Outside this pathway</b>","Acute postoperative pain, trauma, renal colic, sickle-cell pain, cancer pain, palliative care and opioid dependence treatment — use the relevant acute, surgical, cancer or addiction pathway. Hospital discharge opioids should specify dose, quantity and intended duration and should not be transferred automatically to repeat prescribing (GMMMG discharge communication standards)"],
         ["<b>Risk screen before starting</b>","Past or current substance misuse including alcohol, mental health, benzodiazepines, Z-drugs, gabapentinoids and other CNS depressants, respiratory disease and sleep apnoea, renal/hepatic function, frailty and falls, pregnancy or breastfeeding where relevant, overdose history, driving and occupational risk. Calculate the total actual daily opioid exposure, including PRN doses and codeine, tramadol and combination preparations. Agree written functional goals, trial duration, review date, maximum dose, constipation plan, overdose plan, one responsible prescriber and end-of-treatment plan"]
       ]},
       {b:"warn", html:"MHRA (2020): any opioid can cause dependence and addiction — label and counsel accordingly. Driving: do not drive if sedated, dizzy, cognitively impaired or otherwise affected; avoid driving during initiation and after dose changes until the individual response is clear, and take particular care when adding another CNS depressant or when drinking alcohol. A prescribed opioid is not automatically a driving ban, but impaired driving remains unlawful — the statutory medical defence applies only when the medicine is prescribed, taken according to instructions and the driver is not impaired (FPM driving guidance; GOV.UK drug-driving law guidance). <b>Renal impairment: morphine metabolites may accumulate. Seek advice when eGFR is reduced, particularly in advanced CKD or AKI, and consider a renal-safe opioid strategy with specialist or pharmacy advice. Buprenorphine may be considered in selected patients, but product choice, dose, indication and patch suitability require an experienced prescriber.</b>"}
     ]},

    {id:"trial", nav:"Trial", title:"Steps 2–3 — goals, the trial, and the exit",
     blocks:[
       {b:"table", head:["Step","Action","Detail"], rows:[
         ["<b>2 — agree goals and the exit</b>","<b>Written FUNCTIONAL goals, not a pain score</b>","The exit is named at the start, with a defined duration, a maximum daily dose, adverse-effect monitoring and an end-of-treatment plan: review early, no later than 2–4 weeks; no meaningful benefit means taper and stop. A trial without a pre-agreed endpoint becomes an indefinite prescription"],
         ["<b>3a — start the trial</b>","<b>Lowest appropriate immediate-release dose, for a defined duration</b>","<b>\"As directed\" is never acceptable.</b> Dose selection must account for age, frailty, renal/hepatic function, respiratory disease or obstructive sleep apnoea, concurrent sedatives and opioid-naive status; check the exact dose against current product information and the local Greater Manchester opioid guidance rather than a universal protocol dose. <b>Prescribe constipation prevention from the outset when clinically appropriate</b>"],
         ["<b>3b — judge the response</b>","In a suitable adult without major risk factors, an observed response to a carefully prescribed immediate-release trial may help show whether opioids give meaningful analgesia and functional benefit","<b>Absence of useful benefit should prompt stopping rather than automatic dose escalation.</b> Do not use a fixed 20 mg dose as a universal diagnostic test — not in older or frail patients, renal or hepatic impairment, high sedation risk, respiratory disease or sleep apnoea, episodic pain, or opioid tolerance. A non-response may reflect timing, pain variability, an untreated cause or tolerance; a response does not prove long-term benefit"],
         ["<b>3c — reassess early (no later than 2–4 weeks)</b>","<b>Against the written goals</b>","Functional gain documented → continue at the lowest effective dose. No clinically meaningful improvement in function, sleep or quality of life at a tolerable dose after an adequate trial → taper and stop, as agreed; do not escalate automatically if the initial response is poor"],
         ["<b>3d — if continuing</b>","<b>Do not automatically convert to modified-release morphine</b>","NICE NG215: start low and consider avoiding modified-release preparations when initiating dependence-forming medicines. Avoid initiating modified-release opioids unless there is a clear clinical reason and an established benefit from the trial. If a regular opioid is continued, individualise the formulation and dosing schedule and review against benefit, safety, adherence and misuse risk. Keep any IR top-ups few and capped. Lowest effective dose; intermittent use has the best long-term outcomes. Review monthly until stable"]
       ]}
     ]},

    {id:"choice", nav:"Choice", title:"Step 4 — choosing the opioid, and the OME review thresholds",
     blocks:[
       {b:"table", head:["Opioid","Start","Review threshold","Place"], rows:[
         ["<b>Morphine</b>","<b>Lowest appropriate immediate-release dose per SPC and local guidance; modified-release only if individualised</b>","<b>About 50 mg/day OME prompts heightened review; specialist advice approaching or exceeding 90 mg/day — not an absolute ceiling</b>","<b>Commonly used; avoid routine MR initiation (NICE NG215)</b>"],
         ["<b>Buprenorphine patch (prescribe by brand)</b>","<b>Per the specific product SPC</b>","<b>Per the product SPC</b> — strengths, dosing interval, maximum number of patches, licensed indications and conversion information differ; weekly and twice-weekly patches are not interchangeable; seek specialist advice for high-dose opioid rotation","<b>Selected patients — e.g. renal impairment (with pharmacy or specialist advice), poor swallow, adherence problems</b>"],
         ["<b>Oxycodone, fentanyl, tapentadol</b>","—","<b>Specialist only</b>","<b>Pain-clinic advice first (local Amber rules)</b>"]
       ]},
       {b:"table", head:["Rule","Detail"], rows:[
         ["<b>The weak-opioid traps</b>","Tramadol is not \"safe-lite\": serotonergic (SSRI interaction → serotonin syndrome), lowers the seizure threshold, genuinely dependence-forming with a nasty withdrawal. Codeine is a prodrug converted to morphine by CYP2D6: poor metabolisers may receive little analgesia, while ultra-rapid metabolisers may develop unexpectedly high morphine exposure (phenotype frequencies vary by population). Avoid codeine during breastfeeding because of the risk of infant opioid toxicity — a warning relevant to adults, not only children"],
         ["<b>Switching opioids</b>","OME calculations are approximate, vary between sources and are not a substitute for clinical judgement; transdermal estimates vary by product. Convert to OME, then REDUCE by 25–50% — incomplete cross-tolerance means the \"equivalent\" dose can overdose. Re-titrate from there. Conversion is not an automatic prescribing calculation: switching should be undertaken by a prescriber experienced in opioid conversion, with close follow-up. Do not use OME tables for direct conversion to methadone, in unstable pain, without accounting for PRN use, or without considering renal/hepatic function and frailty"],
         ["<b>Patch mechanics</b>","Patches are not for rapid titration or for acute or unstable pain; fever and external heat (heat pads, hot baths, saunas) increase absorption; strengths and dosing intervals are product-specific — check the SPC. Fentanyl: 72-hour patches with a 12-hour lag both ON and OFF. Buprenorphine: prescribe by brand and follow the product SPC — do not assume weekly and twice-weekly patches are interchangeable; rotate sites"],
         ["<b>Anaesthetics and procedures</b>","On any regular opioid, tell the surgical team — tolerance changes perioperative dosing. Buprenorphine no longer needs stopping pre-operatively"]
       ]}
     ]},

    {id:"harms", nav:"Harms", title:"Step 5 — the side effects that make people quit, or die",
     blocks:[
       {b:"table", head:["Harm","Detail","Action"], rows:[
         ["<b>Constipation</b>","<b>Common, and often persists with continued use</b>","Anticipate constipation and prescribe a regular stimulant laxative (senna or bisacodyl) unless contraindicated. Add an osmotic laxative (macrogol) according to stool consistency and response. Bulk-forming laxatives are often ineffective or problematic if hydration and motility are poor. Assess for obstruction, ileus or impaction if there is severe abdominal pain, vomiting or distension, or if symptoms are severe or refractory, before escalating. Consider a peripherally acting µ-opioid receptor antagonist (PAMORA, e.g. naloxegol or naldemedine) according to NICE, product criteria and the local formulary when conventional laxatives are inadequate"],
         ["<b>Nausea and sedation</b>","First few days to 2 weeks, usually settles","Short-term antiemetic; do not drive if sedated; persistent sedation means the dose is too high"],
         ["<b>Respiratory depression</b>","The killer — risk multiplied by benzodiazepines, Z-drugs, gabapentinoids, alcohol and OSA","Sedation is an early warning sign; in suspected toxicity assess respiratory rate and level of consciousness, call 999 and give naloxone (an emergency medicine). Do not routinely initiate an opioid–benzodiazepine or opioid–gabapentinoid combination. If clinically unavoidable or already established, review dose and total OME, age and frailty, renal function, respiratory disease or OSA, alcohol and other sedatives, overdose history, current sedation and driving risk, and agree which medicine is reduced first in a coordinated plan: lowest effective doses for the shortest duration, urgent review, clear respiratory-depression counselling, gradual deprescribing (not abrupt), and consider take-home naloxone with training (high dose, misuse history, previous overdose, sedative combination)"],
         ["<b>Tolerance and hyperalgesia</b>","<b>Pain more diffuse, less anatomically consistent or increasingly sensitive as opioid exposure rises</b>","Consider opioid-induced hyperalgesia (MHRA) — a diagnosis of clinical assessment and exclusion, not established by dose escalation alone. Re-examine for new pathology; consider tolerance, withdrawal between doses, mood and sleep, and problematic opioid use. If likely, the plan is a taper, not an increase — a carefully supported dose reduction may improve pain in some patients"],
         ["<b>Endocrine</b>","Fatigue, low libido, erectile dysfunction, amenorrhoea on long-term use","Ask about reduced libido, erectile dysfunction, menstrual disturbance, infertility, fatigue, hot flushes and other features of hypogonadism. Investigate suspected hypogonadism or adrenal dysfunction clinically and according to local guidance (not a routine annual screen), and consider endocrine advice — endocrine abnormalities strengthen the case for opioid reduction"],
         ["<b>Sedation, falls and fractures</b>","Long-term opioids increase sedation, falls and fracture risk, particularly in older people and with other CNS depressants; magnitude varies by age, indication, dose and comorbidity","Counts in the annual risk–benefit. A possible immunomodulatory effect has uncertain clinical significance"],
         ["<b>Dependence versus addiction</b>","Physical dependence is expected pharmacology. Addiction is craving, loss of control and use despite harm — risk varies substantially by dose, duration, patient factors, indication and coexisting substance-use disorder","Dependence needs a taper; addiction needs the drug service alongside. Different problems, different help — say so without stigma"]
       ]},
       {b:"dl", rows:[
         ["<b>Naloxone</b>","Review take-home naloxone eligibility at each review: high-dose opioid therapy; concurrent benzodiazepine, gabapentinoid, Z-drug or alcohol use; previous overdose or recent hospital discharge after overdose; respiratory disease or obstructive sleep apnoea; opioid dependence or illicit opioid exposure; loss of tolerance after tapering or interruption. Train the patient, family and carers to use it, and use local supply arrangements"],
         ["<b>Review rhythm</b>","Monthly until stable, then at least 6-monthly while prescribed. At every review assess actual total daily dose and OME, functional benefit, sedation and respiratory risk, constipation, falls, endocrine symptoms, hyperalgesia, early requests or lost medication, other prescribers, driving and storage, and readiness to taper. Opioid code on the record. No early scripts — \"lost\" prescriptions have a pattern"],
         ["<b>Aberrant-use flags</b>","Escalating without review, early requests, multiple prescribers or out-of-hours use, injecting or crushing MR preparations. Name it rather than chasing it with more supply; refer to the drug service"]
       ]}
     ]},

    {id:"taper", nav:"Taper", title:"Step 6 — deprescribing: individualised, proportional, pace agreed together",
     blocks:[
       {b:"info", html:"Offer opioid optimisation to established users where benefit is limited, harms are significant (including hyperalgesia, misuse or a high-risk sedative combination), the condition has resolved (post-operative, post-fracture), the dose is escalating, or the patient wishes to reduce. Review the indication, actual consumption, benefit and harm, dependence, misuse and safety. Do not abruptly reduce solely because an OME threshold has been exceeded. Some patients have sustained functional benefit at a low dose with acceptable harms — NICE NG193 allows a shared plan for safe continuation. Many people feel clearer-headed and less constipated as the dose falls."},
       {b:"table", head:["Step","Action","Detail"], rows:[
         ["<b>6a — invite, don't ambush</b>","<b>Frame it as a health upgrade, not a punishment</b>","Not ready → information (Live Well with Pain), revisit in 3–6 months — forced tapers fail and fracture trust. Where reduction is not currently acceptable or may destabilise the patient, continue temporarily with a documented rationale, prevent further escalation and revisit the plan. Exception: safety-critical combinations warrant a firmer timeline"],
         ["<b>6b — count the real dose</b>","<b>Total OME across everything, and ask what they ACTUALLY take</b>","<b>Stockpiles and \"saving the top-ups\" are normal.</b> Taper the MR or patch first; keep IR visible and countable (switch liquid to tablets)"],
         ["<b>6c — individualised, proportional reductions</b>","<b>One opioid at a time, most potent first</b>","Example only — not a mandatory schedule: approximately 5–10% of the current dose every 2–4 weeks may be a reasonable starting point for some patients; slower or faster reductions may be appropriate (NICE NG215). <b>Pause or slow at any step if withdrawal is problematic or for life events; avoid going back up more than one step.</b> Withdrawal — sweats, yawning, cramps, restless legs, anxiety, diarrhoea — may begin within hours to days, but duration and severity vary considerably with the opioid, formulation, dose, duration of use and concurrent sedatives. Explain that withdrawal can last weeks or months during a prolonged taper (NICE NG215) and that the schedule can be modified. Withdrawal symptoms and recurrence of the underlying pain can overlap: assess timing, associated autonomic/GI symptoms, function, examination and the response to holding or slowing the taper. A flare after a reduction may be withdrawal-related pain, recurrence of the original condition, opioid-induced hyperalgesia or another cause — assess the pattern rather than assuming that worsening pain means the opioid is needed again"],
         ["<b>6d — smaller steps at the bottom</b>","<b>Reduce the size of decrements as the dose falls</b>","Reductions proportionate to the current dose become smaller as the dose falls; the last steps are often the hardest. Long-standing high-dose reduction can destabilise patients — individualise, with MDT support where required (FPM). Liquid morphine or alternate-strength tablets help. Months for most, over a year for long-term high-dose — that pace IS success"],
         ["<b>6e — fill the gap</b>","<b>Pain self-management running alongside</b>","Pacing and activity goals; treat the unmasked mood and sleep problems in their own right; celebrate milestones — a printed dose chart with dates crossed off genuinely motivates"]
       ]},
       {b:"warn", html:"Never stop abruptly after regular use — and never let someone ELSE's abrupt stop happen either (hospital discharge without the opioid, a nursing-home transfer): withdrawal plus lost tolerance is the overdose set-up if they resume their old dose. <b>Any planned restart after a gap must restart LOW.</b>"}
     ]},

    {id:"stillpain", nav:"Still in pain?", title:"Still in pain on opioids? The answer is rarely a higher dose",
     sub:"Run this before any escalation.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"1 · Working at all?", html:"<b>Functional gain documented against the written goals?</b> No → the plan is a taper, not a titration."},
         {tone:"red", h:"2 · Hyperalgesia?", html:"Pain more diffuse, less anatomically consistent or more sensitive as doses rose → consider opioid-induced hyperalgesia, alongside tolerance, central sensitisation and withdrawal between doses. A diagnosis of assessment and exclusion, not dose escalation alone; if likely, taper."},
         {tone:"blue", h:"3 · Right pain type?", html:"Neuropathic features (burning, shooting, allodynia) → the wrong ladder entirely. Fibromyalgia or chronic primary pain → NG193: do not initiate opioids; established users reviewed by shared decision-making."},
         {tone:"red", h:"4 · The combination", html:"Benzodiazepines, gabapentinoids or alcohol on board? That is the overdose risk — review urgently and deprescribe gradually, not abruptly (MHRA)."},
         {tone:"blue", h:"5 · The person", html:"Untreated depression, anxiety, insomnia, unresolved compensation or work issues, medication misuse, or a substance-use disorder needing its own care?"},
         {tone:"amber", h:"6 · New pathology?", html:"Changed pain, red flags, weight loss — re-examine before attributing everything to \"chronic pain\"."}
       ]}
     ]},

    {id:"safety", nav:"Safety-net", title:"Step 7 — what the patient must know",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Overdose signs", html:"\"Extreme drowsiness you cannot be woken from, slow or gurgling breathing, blue lips — whoever is with you calls 999 and says 'opioid overdose'. Keep the take-home naloxone where your family can find it if you have been given one, and make sure they know how to use it.\""},
         {tone:"red", h:"🍷 Avoid mixing", html:"\"Avoid alcohol, sleeping tablets or 'nerve' tablets from anyone else on top of these — the combination can stop your breathing. If we have prescribed more than one of these, we will tell you what to watch for — do not stop any of them suddenly.\""},
         {tone:"amber", h:"🚗 Driving", html:"\"Do not drive if you feel drowsy, dizzy, or unable to concentrate. Avoid driving when you first start or change the dose until you know how it affects you, and take particular care if you add another sedating medicine or drink alcohol. Taking these as prescribed is not a driving ban, but driving while impaired is against the law.\""},
         {tone:"amber", h:"👶 Storage", html:"\"Locked away from children and visitors — one MR tablet can kill a child. Return leftovers to the pharmacy, never the bin.\""},
         {tone:"green", h:"⏸️ Never stop dead", html:"\"Running out or stopping suddenly makes you genuinely ill — reductions are planned together, in small steps.\""}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Step 8 — who needs which specialist",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"Pain service", html:"OME approaching or exceeding the local specialist-advice threshold (about 90 mg/day) or a more potent opioid; complex rotation; refractory pain despite an adequate trial; tapering that is complex or has repeatedly failed; pain-management-programme referral."},
         {tone:"red", h:"Urgent advice", html:"Respiratory depression, recurrent overdose or severe sedation; severe psychiatric risk, suicidality or major psychosocial destabilisation; uncertain diagnosis or suspected new pathology."},
         {tone:"amber", h:"Drug and alcohol service", html:"Suspected opioid use disorder, diversion, illicit top-ups — alongside primary care, not instead of it. Opioid substitution therapy conversations belong to them. See <a href='opioid-dependence.html'>opioid dependence</a>."},
         {tone:"blue", h:"Reassess the cause", html:"The joint that needs replacing, the radiculopathy that needs imaging, red flags — a definitive fix beats any taper plan."},
         {tone:"red", h:"Perinatal", html:"Pregnant on regular opioids → a joint obstetric and specialist plan. NOT abrupt cessation, which risks fetal withdrawal; the neonatal team must be aware. Involve obstetrics and an experienced pain, addiction or prescribing team; assess for opioid dependence or opioid use disorder; plan neonatal observation and withdrawal assessment; distinguish prescribed analgesia from opioid substitution treatment; provide naloxone and safeguarding support where relevant. No standard taper in pregnancy without specialist input."},
         {tone:"blue", h:"Palliative exception", html:"This whole page is NON-cancer pain — cancer pain follows its own ladder without these review thresholds; acute, postoperative and dependence-treatment prescribing also follow their own pathways. See <a href='palliative-pain.html'>palliative pain</a>."},
         {tone:"cream", h:"GP management", html:"The decision not to start, the trial with its exit, opioid choice within the OME review thresholds, harm management, the taper and the safety rules all belong here. Related pages: <a href='chronic-pain.html'>chronic primary pain</a> · <a href='neuropathic-pain.html'>neuropathic pain</a> · <a href='sciatica.html'>sciatica</a> · <a href='benzodiazepines-z-drugs.html'>benzodiazepines and z-drugs</a> · <a href='opioid-dependence.html'>opioid dependence</a>."}
       ]},
       {b:"say", html:"We will treat this as a short, time-limited experiment with goals we have written down together, and I will see you again within a few weeks. If it works, we use the lowest dose that keeps you moving. If it does not — and for a lot of long-term pain it does not — the kindest thing I can do is help you come off it slowly, at a pace we agree together — many people feel better in themselves at the end of that."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 54-year-old woman has taken <b>morphine MR 60 mg BD</b> for 6 years for chronic low back pain, plus <b>zopiclone</b> and <b>pregabalin 300 mg BD</b>. She requests an increase: the pain is \"worse than ever\" and now \"aches all over\". She has stopped walking to the shops, has gained weight, is <b>constipated despite lactulose</b>, and mentions <b>fatigue and no libido</b>. She has run out early twice this year."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Does NOT increase the dose, and can explain why: considers opioid-induced hyperalgesia (widespread tenderness with escalating dose) alongside tolerance, withdrawal between doses, mood, sleep and new pathology, and re-examines before attributing the worsening pain to opioids; <b>recognises 60 mg BD is 120 mg OME — above the 90 mg/day threshold at which Opioids Aware (2026) advises specialist input</b>; identifies the zopiclone-plus-pregabalin-plus-opioid combination as the overdose risk and plans urgent review with gradual, not abrupt, deprescribing (MHRA); <b>knows opioids are not offered for chronic low back pain (NICE NG59) and not started for chronic primary pain (NG193)</b>, so there was never a good indication; adds a regular stimulant laxative (osmotic according to response), assesses for impaction, and considers a PAMORA per the local formulary if conventional laxatives are inadequate; <b>recognises symptoms suggesting opioid-induced hypogonadism and checks relevant endocrine tests</b>, naming it as another reason to review the dose; <b>addresses the early running-out without accusation</b> but names the pattern and counts the real dose; invites rather than ambushes the taper — individualised and proportional, over months — and <b>pre-warns that withdrawal and recurrence of the underlying pain can overlap</b>; offers <b>pain self-management alongside</b>; and considers <b>take-home naloxone with training</b> given the dose and combination."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>Faculty of Pain Medicine — Opioids Aware</b><br><a href="https://fpm.ac.uk/opioids-aware" rel="noopener">fpm.ac.uk/opioids-aware</a><span class="rd"> — oral morphine equivalence and the dose calculator, the OME thresholds (revised 2026: caution above 50 mg/day, specialist advice approaching or above 90 — previously 120) as risk/advice prompts rather than safe thresholds or absolute ceilings, and not legal primary-care limits (confirm the current version and its relationship to the GMMMG pathway before local adoption); OME calculations approximate and source-dependent, the time-limited trial approach, the 25\u201350% reduction on switching for incomplete cross-tolerance, and the tapering principles</span></li>'+
         '<li><b>NICE NG193 — Chronic pain (primary and secondary) in over 16s</b><br><a href="https://www.nice.org.uk/guidance/ng193" rel="noopener">nice.org.uk/guidance/ng193</a><span class="rd"> — do not initiate opioids for chronic primary pain (the recommendation is specific to chronic primary pain); established users reviewed through shared decision-making, with a shared plan for safe continuation where they report benefit at a safe dose with few harms</span></li>'+
         '<li>MHRA Drug Safety Update (September 2020) — opioids: risk of dependence and addiction<br><a href="https://www.gov.uk/drug-safety-update/opioids-risk-of-dependence-and-addiction" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> — the labelling and counselling requirement; consider hyperalgesia in patients on long-term opioids with increased pain sensitivity</span></li>'+
         '<li>MHRA Drug Safety Update (March 2020) — benzodiazepines and opioids: reminder of risk of potentially fatal respiratory depression<br><a href="https://www.gov.uk/drug-safety-update" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> — co-prescribe only where there is no alternative, at low doses, for short duration, with close monitoring</span></li>'+
         '<li>MHRA Drug Safety Updates — gabapentin (Neurontin): risk of severe respiratory depression (October 2017); pregabalin (Lyrica): reports of severe respiratory depression (February 2021)<br><a href="https://www.gov.uk/drug-safety-update" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> — respiratory depression, including without opioids, particularly in older people and with respiratory disease, renal impairment or other CNS depressants</span></li>'+
         '<li><b>MHRA Drug Safety Update (July 2013) — codeine for analgesia: restricted use in children because of reports of morphine toxicity; CYP2D6</b><span class="rd"> — poor and ultra-rapid metaboliser phenotypes (frequencies vary by population), and the contraindication in breastfeeding (relevant to adults) and in children</span></li>'+
         '<li>NICE NG215 — Medicines associated with dependence or withdrawal symptoms<br><a href="https://www.nice.org.uk/guidance/ng215" rel="noopener">nice.org.uk/guidance/ng215 — recommendations</a><span class="rd"> — start at a low dose and consider avoiding modified-release preparations when initiating; shared decision-making; slow, stepwise reductions proportionate to the current dose, with smaller decrements as the dose falls; pause or slow if withdrawal occurs; distinguish withdrawal from recurrence of the original condition; avoid abrupt cessation; explain that withdrawal can take several months or longer; gabapentinoids need their own dependence and withdrawal plan</span></li>'+
         '<li><b>GMMMG — Guidelines on high dose opioid use for chronic pain management</b> (modified March 2025) and <b>Communication standards for opioid prescribing at discharge</b> (2024–2025)<br><a href="https://gmmmg.nhs.uk/" rel="noopener">gmmmg.nhs.uk</a><span class="rd"> — caution above 50 mg/day OME, harm substantially increased at about 120 mg/day, with advice not to escalate to that level; discharge opioids to specify dose, quantity and intended duration, not transferred automatically to repeat prescribing; formulary PAMORAs (naloxegol, naldemedine) for opioid-induced constipation not responding to laxatives</span></li>'+
         '<li><b>Faculty of Pain Medicine — Guidance for members on driving and pain</b> (February 2018) and tapering guidance<br><a href="https://fpm.ac.uk/" rel="noopener">fpm.ac.uk</a><span class="rd"> — prescribed opioids are not automatically a driving ban; impaired driving remains unlawful; individualised reduction of long-standing high-dose opioids with MDT support where required</span></li>'+
         '<li><b>Live Well with Pain · Ten Footsteps</b><br><a href="https://livewellwithpain.co.uk" rel="noopener">livewellwithpain.co.uk</a><span class="rd"> — the pain self-management resources that run alongside a taper</span></li>'+
         '<li><b>BNF and GOV.UK — Drugs and driving: the law</b><br><a href="https://www.gov.uk/drug-driving-law" rel="noopener">gov.uk/drug-driving-law</a><span class="rd"> — opioid doses and equivalences, and the statutory medical defence available only when the drug is taken as prescribed and the driver is unimpaired</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Opioids for persistent NON-cancer pain in adults — Opioids Aware (FPM), NICE NG193, NG59, NG215 and MHRA 2020. Do not initiate opioids for chronic primary pain (NG193), chronic low back pain (NG59) or headache; for chronic secondary pain, treat the cause and consider opioids only in carefully selected patients. Run a time-limited immediate-release trial with written goals, a maximum dose and the exit named at the start; avoid routine modified-release initiation (NG215). Treat about 50 mg/day OME as a review prompt and seek specialist advice approaching or exceeding 90 mg/day (Opioids Aware 2026) — not safe thresholds or absolute ceilings. Avoid co-prescribing with benzodiazepines, Z-drugs or gabapentinoids; if unavoidable, use strict safeguards and consider naloxone. Anticipate constipation. For established users the answer is rarely a higher dose — offer an individualised, proportional taper, and never stop abruptly. Not for acute, postoperative, cancer, palliative or dependence-treatment prescribing. Cancer pain follows its own pathway. Verify doses and equivalences against the current BNF before prescribing."
});
