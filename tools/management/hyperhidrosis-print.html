  stemTitle:"Does it stop during sleep? Ask the sleep question — then work through the options",
  stemSub:"One page for the whole condition. Separate benign primary focal hyperhidrosis (young onset, bilateral, focal, usually quiet during sleep, often familial) from secondary sweating — commonly medicines, menopause, infection or thyroid disease, and rarely lymphoma, TB or phaeochromocytoma; score severity with the HDSS; investigate only on suspicion; and work through the options from aluminium chloride to iontophoresis, oral antimuscarinics, botulinum toxin or topical glycopyrronium cream according to the local pathway — with sympathectomy as a heavily-counselled last resort. IHS · BNF.",

  meta:[
    {t:"BNF — botulinum toxin type A (severe axillary hyperhidrosis)"},

  ],
  lead:"<div class='mg-layers'><a href='#severe'><b>Red flags</b><small>Night sweats · phaeo · serotonin syndrome</small></a><a href='#history'><b>Classify</b><small>Primary vs secondary · HDSS</small></a><a href='#ladder'><b>Treat</b><small>Options by site</small></a><a href='#refer'><b>Refer</b><small>Dermatology · suspected cancer · surgery</small></a></div>",
  quickSub:"If you read nothing else on this page, read these six cards. Sources are listed under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Night sweats with systemic features need assessment", html:"Primary focal hyperhidrosis usually occurs while awake and reduces or stops during sleep. New, persistent or drenching night sweats — particularly with fever, weight loss, lymphadenopathy, splenomegaly or other systemic symptoms — require clinical assessment for secondary causes. Ask it directly — “do you wake up drenched?” Unexplained lymphadenopathy or splenomegaly, particularly with fever, drenching night sweats, pruritus, breathlessness or weight loss, should prompt consideration of a suspected cancer pathway referral (NICE NG12, updated April 2026); FBC and other investigations may be done in parallel but should not delay referral where concern is significant. Night sweats alone are not an NG12 lymphoma criterion."},
    {tone:"amber", h:"Secondary sweating: the pattern is the clue", html:"Generalised, unilateral or nocturnal sweating, onset over 25, or a changed pattern → look for secondary causes guided by the history and examination: medicines, menopause, alcohol, anxiety, obstructive sleep apnoea, hyperthyroidism, diabetes or hypoglycaemia, infection (including TB), and rarely lymphoma or phaeochromocytoma. New-onset sweating in someone with a cancer history is a red flag in itself — and a longstanding 'primary' label must never anchor away a NEW nocturnal pattern."},
    {tone:"blue", h:"The history makes the diagnosis — and the HDSS makes the case", html:"Primary focal: onset &lt;25, bilateral and symmetrical (axillae, palms, soles, craniofacial), improves or stops during sleep, present for at least 6 months; a family history is common, but its absence does not exclude primary disease. Score the HDSS (1–4): ≥3 = barely tolerable or worse — a useful severity and outcome measure, but not a universal NHS funding threshold. Classic primary disease needs <b>NO investigations</b>."},
    {tone:"green", h:"Aluminium chloride first — technique is everything", html:"Aluminium chloride hexahydrate 20% (Driclor®, Anhydrol Forte®) to COMPLETELY dry skin at night, washed off in the morning; start two nights a week and increase gradually, then reduce to maintenance; 4–6-week trial before stepping up. Irritant dermatitis can occur even with correct application: avoid applying straight after shaving or to broken or inflamed skin, keep it away from eyes and mucous membranes, stop temporarily if significant dermatitis develops and consider a short course of a mild topical corticosteroid — then restart less often rather than abandon it. In Greater Manchester it is listed as not routinely supported for prescribing (self-care), so check the current formulary — patients may need to buy it."},
    {tone:"blue", h:"Escalation options — access depends on the local pathway", html:"<b>Iontophoresis is an established option for palms and soles</b>, generally delivered by dermatology or a specialist service; maintenance is usually needed, and local access and FP10 device prescribing vary. Botulinum toxin A is licensed for severe axillary hyperhidrosis and given in specialist care (50 units per axilla per the Botox SPC); NHS eligibility depends on the local provider/ICB pathway, not HDSS alone. Topical glycopyrronium cream (Axhidrox®) is for severe primary axillary disease in adults when lifestyle advice, aluminium-based antiperspirants and oral antimuscarinics have not controlled sweating or are unsuitable (NICE TA1175). Oral antimuscarinics — propantheline is licensed; oral glycopyrronium and oxybutynin are off-label — should be started low and titrated, by a clinician with relevant experience or under a local protocol."},
    {tone:"amber", h:"Sympathectomy: the warning IS the counselling", html:"Endoscopic thoracic sympathectomy (ETS) is an irreversible specialist procedure reserved for severe, refractory palmar or craniofacial disease after non-surgical options have failed or are unacceptable. Compensatory truncal sweating is common and may be severe or more troublesome than the original sweating; the exact risk varies by procedure and patient, and must be discussed in detail by the specialist team. ETS is generally not preferred for isolated axillary disease because less invasive, more targeted treatments are available (NICE IPG487)."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step looks for secondary and serious causes.",
  pathway:[
    {title:"Exclude secondary and serious causes", html:"Unexplained lymphadenopathy or splenomegaly, particularly with fever, drenching night sweats, pruritus, breathlessness or weight loss → consider a suspected cancer pathway referral (NICE NG12, updated April 2026); tests may run in parallel but must not delay referral. Recurrent, stereotyped episodes of headache, palpitations, sweating and hypertension → consider phaeochromocytoma and test per local endocrine guidance. Flushing with persistent diarrhoea or bronchospasm → consider carcinoid syndrome via endocrinology/gastroenterology. Persistent cough, haemoptysis or systemic symptoms → follow NG12 lung-cancer and local respiratory/TB pathways. Sweating with clonus, hyperreflexia, rigidity, agitation, altered mental state or hyperthermia on a serotonergic medicine → serotonin syndrome, 999.", alert:true},
    {title:"Classify — primary focal or secondary", html:"Onset age, distribution (focal bilateral vs generalised vs unilateral), the sleep question, family history, triggers, drug list (SSRIs, SNRIs, opioids, tamoxifen, bupropion, cholinesterase inhibitors — check the temporal relationship and alternatives), new medicines, dose changes or withdrawal, alcohol and recreational drugs, menopause. Unilateral → think neurological (Frey's, Horner's)."},
    {title:"Quantify and examine", html:"HDSS score and quality-of-life impact (work, handshakes, clothing, mood — screen PHQ-9/GAD-7 where indicated). Examine: temperature, pulse, BP, weight, thyroid, lymph nodes and spleen where indicated, skin (intertrigo, erythrasma, fungal infection, bromhidrosis), neurological screen if unilateral. Minor's starch–iodine test may assist specialist mapping but is not routine GP assessment."},
    {title:"Treat up the ladder", html:"Axillary: lifestyle advice and aluminium-based antiperspirant with proper technique → if inadequate or intolerable, oral antimuscarinic, botulinum toxin or topical glycopyrronium cream according to severity, contraindications, preference and the local pathway → refractory disease, specialist review. Palms/soles: aluminium chloride may be tried → refer for iontophoresis → specialist botulinum toxin or systemic antimuscarinic → sympathectomy only as a last resort after full counselling. Treat the cause, not the sweat, in secondary disease."},
    {title:"Review, re-score, and stay alert", html:"4–6 weeks: technique + HDSS re-score. 3 months: oral-agent tolerability. After botulinum toxin: repeat treatment via the specialist service as the effect wanes. Annually: is treatment still needed? And ANY new nocturnal or constitutional symptoms → re-investigate — the old label does not cover new symptoms."}
  ],
  sections:[
    {id:"severe", nav:"Red flags", title:"Red flags — exclude secondary hyperhidrosis and serious pathology first", sub:"Generalised, unilateral, nocturnal or new-onset sweating after 25 needs assessment for secondary causes before the primary label. Act on these according to clinical severity.",
     blocks:[
       {b:"cards", items:[
         {tone:"purple", h:"🟣 Lymphoma / haematological malignancy <span class='tw'>Suspected cancer</span>", html:"Unexplained lymphadenopathy or splenomegaly, particularly with fever, drenching night sweats, pruritus, breathlessness or weight loss (or alcohol-induced lymph-node pain), should prompt consideration of a suspected cancer pathway referral for lymphoma (<a href='https://www.nice.org.uk/guidance/ng12/chapter/Recommendations-organised-by-site-of-cancer' rel='noopener'>NICE NG12, updated April 2026</a>). FBC and other investigations may be performed in parallel but should not delay referral where clinical concern is significant. Night sweats alone are not an NG12 lymphoma criterion, and LDH is not a routine primary-care test.", src:"NICE NG12 (updated April 2026)"},
         {tone:"red", h:"🔴 Serotonin syndrome", html:"Sweating with clonus, hyperreflexia, rigidity, agitation, altered mental state or hyperthermia in someone taking serotonergic medicines is an emergency — arrange immediate hospital assessment. Involve the acute medical/toxicology team regarding cessation of causative medicines; do not advise unsupervised permanent discontinuation of essential psychiatric treatment. Troublesome SSRI/SNRI/opioid-induced sweating short of that → medication review."},
         {tone:"red", h:"🔴 Phaeochromocytoma", html:"Consider phaeochromocytoma when there are recurrent, stereotyped episodes of headache, palpitations, sweating and hypertension, particularly with paroxysmal or resistant hypertension, an adrenal incidentaloma, a relevant genetic syndrome or a family history. The combination is suggestive, not diagnostic — panic attacks, migraine, stimulant use, arrhythmia, thyroid disease and medicines can mimic it. Arrange testing according to local endocrine guidance. Severe hypertension with headache, palpitations, sweating, chest pain, neurological symptoms or collapse → 999 emergency assessment; do not wait for metanephrines if acutely unwell."},
         {tone:"amber", h:"🟠 Carcinoid tumour", html:"Consider carcinoid syndrome only where there is a compatible clinical syndrome, such as recurrent flushing with persistent diarrhoea, bronchospasm or a known neuroendocrine tumour. Flushing is not the same as sweating. Discuss initial biochemical testing with endocrinology/gastroenterology or follow the local neuroendocrine-tumour pathway."},
         {tone:"amber", h:"🟠 Tuberculosis", html:"For persistent cough, haemoptysis or systemic symptoms, follow NICE NG12 lung-cancer and local respiratory/TB pathways: arrange an urgent chest X-ray or suspected-cancer referral according to age and symptom criteria. If TB is clinically suspected (considering epidemiological risk such as country of origin, contacts and HIV, symptoms and examination), discuss with the local TB/respiratory service about chest imaging and microbiological sampling."},
         {tone:"amber", h:"🟠 Severe thyrotoxicosis", html:"Sweating + weight loss + tremor + tachycardia + AF → TFTs; grossly elevated T3/T4 with cardiac instability → same-day acute medical review."}
       ]},
       {b:"why", html:"The pattern — generalised, unilateral, nocturnal, new after 25, or changed — is what separates secondary sweating from the benign focal disease that needs no tests at all. Nocturnal sweating also has common benign explanations (room heat or bedding, menopause, alcohol, anxiety, sleep apnoea, medicines), so assess it in context rather than assuming malignancy."}
     ]},

    {id:"history", nav:"History", title:"History — the primary/secondary discrimination and the HDSS", sub:"The history alone makes the diagnosis in the vast majority. Quantify impact with the Hyperhidrosis Disease Severity Scale.",
     blocks:[
       {b:"table", head:["Ask about","Primary pattern","Secondary pattern / red flag"], rows:[
         ["<b>Age of onset</b>","<b>Typically &lt;25, often adolescence</b>","Onset &gt;25, or a recent CHANGE in pattern; new sweating with a previous cancer history is a red flag in itself"],
         ["<b>Distribution</b>","<b>Focal, bilateral, symmetrical — axillae, palms, soles, craniofacial</b>","Generalised (whole-body); UNILATERAL suggests a neurological cause (Frey's syndrome, Horner's)"],
         ["<b>Timing — the sleep question</b>","<b>Usually reduces or stops during sleep — a useful discriminator, not pathognomonic</b>","“Do you wake up drenched?” — new, persistent or drenching night sweats, particularly with fever, weight loss, lymphadenopathy or splenomegaly, need assessment for secondary causes (also consider room heat, bedding, menopause, alcohol, anxiety, sleep apnoea, medicines); recurrent stereotyped episodes with headache and palpitations raise phaeochromocytoma"],
         ["<b>Family history</b>","A family history is common","Absence does not exclude primary hyperhidrosis. If onset is after 25, disease is generalised, the pattern has recently changed or sweating occurs during sleep, reassess for secondary causes"],
         ["<b>Triggers</b>","Emotional stress, heat, exercise — but also unprovoked","Fever, weight loss, appetite change, thirst/polyuria (diabetes), heat intolerance, palpitations"],
         ["<b>Medications</b>","—","Check the temporal relationship with new medicines, dose changes or withdrawal, alcohol and recreational drugs. SSRIs, SNRIs, opioids, tamoxifen, bupropion, pilocarpine, cholinesterase inhibitors → reduce, switch, or (for SSRI sweating) consider low-dose mirtazapine off-label"],
         ["<b>HDSS score</b>","1 never noticeable · 2 tolerable, sometimes interferes · 3 barely tolerable, frequently interferes · 4 intolerable, always interferes","HDSS ≥3 = significant — supports escalation; NHS botulinum-toxin eligibility depends on the local provider/ICB pathway, not HDSS alone"],
         ["<b>Quality of life</b>","Occupation (handshakes, paperwork, keyboards), social life, relationships, clothing restrictions","Anxiety, depression and social phobia are common — screen with PHQ-9/GAD-7 where indicated"]
       ]},
       {b:"why", html:"<b>Typical diagnosis of primary focal hyperhidrosis:</b> visible, excessive focal sweating (usually axillae, palms, soles or craniofacial) present for at least 6 months with no apparent secondary cause, plus at least two of — bilateral and symmetrical; impairs daily activities; at least weekly episodes; onset before 25; family history; cessation during sleep (Hornberger et al., 2004). The HDSS is a validated 4-point scale used in trials and in some local NHS criteria: record it with the functional impact, but it is not a universal funding threshold. Sweating that persists during sleep should prompt reassessment for secondary causes."}
     ]},

    {id:"classify", nav:"Classify", title:"Classification — which hyperhidrosis is this?", sub:"Classification determines investigation, treatment pathway and referral destination. Primary focal is a diagnosis of exclusion once the red flags are cleared.",
     blocks:[
       {b:"table", head:["Type","Pattern","Management route"], rows:[
         ["<b>Primary axillary</b> — the most common","<b>Bilateral, symmetrical, impairing daily activities</b>","Lifestyle advice and aluminium chloride first; then oral antimuscarinic, botulinum toxin or topical glycopyrronium cream according to severity, contraindications, preference and the local pathway — most referrals are this type"],
         ["<b>Primary palmoplantar</b>","<b>Palms ± soles — handshakes, grip, keyboards, paperwork</b>","Aluminium chloride may be tried; refer for iontophoresis; botulinum toxin to palms or soles is generally off-label, specialist-only and painful, with temporary hand weakness possible"],
         ["<b>Primary craniofacial</b>","<b>Face/scalp, often with blushing and social phobia</b>","Dermatology referral; beta-blockers may help the blushing component. Exclude Frey's syndrome (unilateral gustatory sweating after parotid surgery)"],
         ["<b>Secondary endocrine</b>","Thyrotoxicosis, diabetes (autonomic neuropathy, nocturnal hypoglycaemia), phaeochromocytoma, carcinoid, acromegaly","Investigate and treat the cause — symptomatic treatment without addressing it is inappropriate. Sweating associated with hot flushes should be assessed as a menopausal vasomotor symptom and managed through the menopause pathway; persistent focal sweating outside flush episodes may represent co-existing hyperhidrosis"],
         ["<b>Secondary drug-induced</b>","SSRIs, SNRIs, opioids, tamoxifen, bupropion, cholinesterase inhibitors","Reduce dose, switch agent, or add low-dose mirtazapine (off-label) for SSRI-induced sweating"],
         ["<b>Secondary neurological</b>","Spinal cord injury, stroke, Parkinson's, autonomic neuropathy; <b>compensatory hyperhidrosis post-sympathectomy (bilateral trunk/thighs)</b>","Neurology referral; compensatory disease has limited treatment options — which is the argument against creating it"]
       ]}
     ]},

    {id:"exam", nav:"Examination", title:"Examination — confirmation plus the secondary screen", sub:"For primary disease the examination confirms; where there is any doubt, the secondary screen is mandatory.",
     blocks:[
       {b:"table", head:["What","How / finding","Means"], rows:[
         ["<b>General inspection</b>","Visible sweating at rest; sweat-stained or deliberately dark/loose clothing; anxiety level","Coping behaviours are severity evidence"],
         ["<b>Minor's starch–iodine test</b>","<b>Paint iodine, dry, dust starch — sweat turns blue-black</b>","May assist specialist mapping before botulinum toxin; not routine GP assessment"],
         ["<b>Thyroid</b>","Goitre, bruit, tachycardia, fine tremor, lid lag, exophthalmos; pulse rate and rhythm (AF in new hyperthyroidism)","Thyrotoxicosis screen"],
         ["<b>Lymph nodes and spleen</b>","<b>Cervical, axillary, inguinal chains; spleen where clinically indicated</b>","Unexplained lymphadenopathy or splenomegaly, particularly with night sweats, fever, pruritus, breathlessness or weight loss → consider a suspected cancer pathway referral (lymphoma); very urgent FBC where NG12 leukaemia features are present"],
         ["<b>Temperature, pulse and weight</b>","Fever, tachycardia, documented weight loss","Point towards infection, thyrotoxicosis or systemic disease"],
         ["<b>Blood pressure</b>","Both arms; labile or persistent hypertension in a young patient → phaeochromocytoma concern; postural drop → autonomic neuropathy","Directs the biochemical work-up"],
         ["<b>Axillary skin</b>","Erythrasma (coral-red under Wood's lamp), intertrigo, fungal infection; bromhidrosis (bacterial odour) — distinguish from hyperhidrosis itself","Distinguish hyperhidrosis from intertrigo, candidiasis, tinea, erythrasma and bromhidrosis; confirm erythrasma clinically or with Wood's lamp where available, and treat confirmed infection according to the local antimicrobial or dermatology guideline"],
         ["<b>Neurological screen</b>","If unilateral: Horner's (ptosis, miosis, ipsilateral facial anhidrosis), peripheral neuropathy, cord signs; ask about parotid surgery (Frey's)","Localises the secondary neurological causes"]
       ]}
     ]},

    {id:"workup", nav:"Work-up", title:"Investigations — targeted by suspicion, or none at all", sub:"Classic primary focal disease (young onset, bilateral, focal, quiet during sleep, normal examination) needs NO investigations. For atypical, generalised or nocturnal sweating, start with a medication and substance review and a full examination, then test only for what the clinical picture suggests. There is no role for routine LDH, GGT or 5-HIAA testing in an otherwise well patient.",
     blocks:[
       {b:"table", head:["Test","When","Interpretation"], rows:[
         ["<b>TSH (± free T4)</b>","Symptoms or signs suggesting thyroid disease","<b>TSH &lt;0.1 mU/L with raised free T4 confirms hyperthyroidism</b> → endocrine or antithyroid therapy per local protocol"],
         ["<b>FBC; CRP/ESR</b>","FBC if systemic symptoms, infection or haematological disease is suspected; CRP/ESR only if inflammatory or infectious disease is suspected","Non-specific; may be done in parallel with, but must not delay, a suspected cancer referral where clinical concern is significant"],
         ["<b>Glucose / HbA1c</b>","Only when diabetes, recurrent hypoglycaemia or autonomic neuropathy is clinically plausible","Interpret according to the diagnostic diabetes pathway, confirming an asymptomatic diagnostic result where required. Nocturnal hypoglycaemic sweating is a consideration where diabetes or insulin treatment makes it plausible"],
         ["<b>LFTs</b>","Only if alcohol excess or liver disease is suspected from the history","Not a routine sweating test"],
         ["<b>Plasma metanephrines</b> (or 24 h urine catecholamines)","<b>Recurrent stereotyped episodes of headache, palpitations, sweating and hypertension</b>, especially paroxysmal or resistant hypertension, adrenal incidentaloma, a relevant genetic syndrome or family history","Arrange according to local endocrine guidance; positive → urgent endocrine referral. Some medicines (e.g. tricyclics, labetalol) and caffeine can cause false positives. If acutely unwell, refer as an emergency without waiting for testing"],
         ["<b>Chest X-ray</b>","<b>Respiratory symptoms, TB risk or relevant NG12 cancer symptoms</b> — urgent CXR or suspected cancer referral per NG12 age and symptom criteria; discuss suspected TB with the local TB/respiratory service","Mediastinal widening (lymphoma), upper-lobe infiltrates/cavities (TB), hilar nodes"],
         ["<b>Neuroendocrine (carcinoid) testing</b>","Only with a compatible syndrome — recurrent flushing with persistent diarrhoea, bronchospasm or a known neuroendocrine tumour","Discuss initial biochemical testing with endocrinology/gastroenterology or follow the local neuroendocrine-tumour pathway; not a test for isolated hyperhidrosis"]
       ]},
       {b:"cards", items:[
         {tone:"purple", h:"NG12 criteria that surface here <span class='tw'>Suspected cancer</span>", html:"Primary focal hyperhidrosis has no NICE NG12 criterion, and this page does not invent one — the cancer risk lives entirely in the secondary-sweating work-up:<br>• Unexplained lymphadenopathy or splenomegaly → consider a suspected cancer pathway referral for lymphoma (adults); night sweats, fever, weight loss, pruritus, breathlessness or alcohol-induced node pain inform the decision. Night sweats alone are not an NG12 lymphoma criterion, and investigations must not delay referral.<br>• <b>Pallor, persistent fatigue, unexplained fever, recurrent infection, generalised lymphadenopathy, or unexplained bruising, bleeding or petechiae → very urgent FBC (within 48 hours) for leukaemia</b> — night sweats alone are not an NG12 leukaemia feature.<br>• <b>Aged 40 and over with unexplained cough, weight loss, fatigue, breathlessness, chest pain or appetite loss (2 or more, or 1 or more if ever smoked) → urgent chest X-ray; haemoptysis at 40 and over → suspected cancer pathway referral</b> — the TB/lung-cancer overlap route.<br>A longstanding primary diagnosis never covers NEW nocturnal sweating — re-run this table, not the treatment ladder. See <a href='https://www.nice.org.uk/guidance/ng12/chapter/Recommendations-organised-by-site-of-cancer' rel='noopener'>NG12 by site</a> and <a href='https://www.nice.org.uk/guidance/ng12/chapter/Recommended-actions-organised-by-symptom-and-findings-of-primary-care-investigations' rel='noopener'>NG12 by symptom</a>.", src:"NICE NG12 (updated April 2026) · house rule"}
       ]}
     ]},

    {id:"ladder", nav:"Treat", title:"Treatment options — least invasive first", sub:"Escalate only after an adequate trial. For axillary disease, steps 3 to 5 are alternatives after topical treatment, chosen by severity, contraindications, preference and the local pathway — not a fixed order. All treatments manage eccrine output; none are curative. Verify doses against the BNF and local formulary.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Step 1", title:"Aluminium chloride hexahydrate 20% (Driclor®, Anhydrol Forte®)", when:"first-line — best for axillae", fromLabel:"4–6-week trial",
          html:"Apply to COMPLETELY dry skin at night, wash off in the morning; start two nights a week and increase gradually, then reduce to maintenance. Irritant contact dermatitis can occur even with correct application: avoid applying immediately after shaving or to broken or inflamed skin, avoid eyes and mucous membranes, stop temporarily if significant dermatitis occurs, and consider a short course of a mild topical corticosteroid. Less effective for palms/soles. <b>Check the current <a href='https://www.greatermanchesterformulary.nhs.uk/' rel='noopener'>Greater Manchester formulary</a> and local prescribing policy: aluminium chloride 20% (Driclor®, Anhydrol Forte®) is listed as not routinely supported for prescribing because it is suitable for self-care, so patients may need to buy it unless an agreed exception applies.</b>"},
         {step:"Step 2", title:"Iontophoresis", when:"established option for palms and soles", fromLabel:"usually via dermatology",
          html:"Tap-water iontophoresis (e.g. Hidrex®, Drionic®), generally delivered by dermatology or a specialist service following the device protocol; maintenance treatment is usually required, and it is not suitable for everyone. Local access and FP10 device prescribing vary — check the local formulary. Precautions and contraindications: pregnancy; pacemaker or implanted electrical device; significant metal implants in the treatment pathway; impaired sensation or inability to follow treatment instructions; active skin disease or open wounds in the treatment area. Adding glycopyrronium to the water is specialist-led and may be off-label."},
         {step:"Step 3", title:"Botulinum toxin A — axillary (specialist; local eligibility)", when:"severe, persistent axillary disease despite topical treatment", fromLabel:"via dermatology",
          html:"Consider referral for specialist botulinum toxin for severe, persistent primary axillary hyperhidrosis that has not responded to, or cannot tolerate, appropriate topical treatment. Record the HDSS and functional impact; NHS eligibility depends on the local provider/ICB pathway (see the Greater Manchester formulary and local policy) and is not determined by HDSS alone. OnabotulinumtoxinA 50 units per axilla is the licensed axillary dose (Botox SPC). Use for palms, soles and craniofacial disease is generally off-label, with different practical risks. Counsel about pain and bruising, temporary weakness (particularly with palmar injections), transient compensatory sweating, the limited duration of effect and need for repeat treatment, and rare systemic botulinum-toxin effects."},
         {step:"Step 4", title:"Oral antimuscarinics — propantheline (licensed), oral glycopyrronium or oxybutynin (off-label)", when:"cautiously, by an experienced clinician or local protocol", fromLabel:"start low, titrate",
          html:"Propantheline is the licensed systemic treatment for primary hyperhidrosis in the UK, subject to current availability and the SPC. Oral glycopyrronium and oxybutynin are off-label and not a standard first-line GP prescription; there is no universal regimen — start low and titrate to effect. Adverse effects: dry mouth, blurred vision, constipation, urinary retention, tachycardia and heat intolerance. Contraindications include untreated angle-closure glaucoma, urinary retention, gastric or intestinal obstruction and myasthenia gravis. Take care in older or frail patients (cognitive effects and cumulative anticholinergic burden); the Greater Manchester formulary advises that oxybutynin should not be prescribed in frail older people. Reduced sweating impairs thermoregulation, increasing the risk of heat exhaustion or heatstroke, especially in older people and during heatwaves (SPS)."},
         {step:"Step 5", title:"Topical glycopyrronium bromide cream (Axhidrox®)", when:"severe primary axillary disease in adults only", fromLabel:"NICE TA1175",
          html:"Glycopyrronium bromide cream (2.2 mg per pump actuation; <a href='https://products.mhra.gov.uk/' rel='noopener'>MHRA SPC, PL 47848/0056</a>) may be used for severe primary axillary hyperhidrosis in adults when lifestyle advice, topical aluminium-based antiperspirants and oral antimuscarinics have not controlled sweating, or are contraindicated or not tolerated (<a href='https://www.nice.org.uk/guidance/ta1175' rel='noopener'>NICE TA1175</a>). Botulinum toxin was the comparator and may be used in secondary care; the local pathway determines which option is offered. It is not indicated for palms, soles or generalised hyperhidrosis."},
         {step:"Step 6", title:"Endoscopic thoracic sympathectomy (ETS)", when:"refractory palmar/craniofacial disease only — last resort", fromLabel:"vascular/thoracic surgery",
          html:"ETS is an irreversible specialist procedure reserved for severe, refractory palmar or craniofacial disease after non-surgical options have failed or are unacceptable (<a href='https://www.nice.org.uk/guidance/ipg487' rel='noopener'>NICE IPG487</a>). Compensatory truncal sweating is common and may be severe or more troublesome than the original sweating; the exact risk varies by procedure and patient, and must be discussed in detail by the specialist team. ETS is generally not preferred for isolated axillary disease because less invasive, more targeted treatments are available. Document every prior treatment in the referral."}
       ]},
       {b:"warn", html:"<b>Counsel every oral-anticholinergic patient on heat intolerance</b> — reduced sweating impairs thermoregulation, increasing the risk of heat exhaustion or heatstroke: caution in older people, in hot climates and during heatwaves, and review cumulative anticholinergic burden. <b>Treat the cause, not the sweat, in secondary disease.</b>"},
       {b:"say", html:"This is a recognised medical condition, not a hygiene problem — and it's treatable. The strong antiperspirant, which you may need to buy from the pharmacy, goes on bone-dry skin at bedtime and washes off in the morning; some stinging is common and manageable, so don't just stop. If that's not enough there are more options — a water-bath treatment for hands and feet, Botox injections for the armpits through a specialist if you meet the local criteria, tablets, and a prescription cream for the armpits — and we'll work through them together."}
     ]},

    {id:"lifestyle", nav:"Self-care", title:"Lifestyle, self-management and psychological support", sub:"Many patients have struggled for years before asking — acknowledge the impact explicitly.",
     blocks:[
       {b:"table", head:["Measure","Detail","Why"], rows:[
         ["<b>Antiperspirant vs deodorant education</b>","Antiperspirants (aluminium salts) reduce sweating; deodorants only mask odour — a high-strength aluminium chloride product (e.g. Driclor 20%) is usually needed, and in Greater Manchester it is generally bought as self-care","The commonest correctable misunderstanding"],
         ["<b>Shaving and application</b>","Avoid applying aluminium chloride immediately after shaving, because of irritation","Reduces the irritation that makes patients stop"],
         ["<b>Clothing</b>","Natural fibres (cotton, bamboo, merino), moisture-wicking layers for exercise, dark or patterned fabrics, dress shields","Conceals staining and reduces the social-anxiety loop"],
         ["<b>Dietary triggers</b>","Spicy food (capsaicin), hot drinks, alcohol, caffeine; gustatory sweating is worsened by spicy, sour and salty food","Reduce where personally implicated"],
         ["<b>Stress management and CBT</b>","Emotional sweating amplifies primary disease via sympathetic activation; CBT can help with the anxiety and avoidance that often accompany it; NHS Talking Therapies self-referral","<b>Anxiety and social avoidance are common</b>"],
         ["<b>Occupational adjustments</b>","HDSS ≥3 impacts employment — the Equality Act 2010 may apply where daily activities are substantially affected; occupational health referral where appropriate","Real-world severity deserves real-world adjustments"],
         ["<b>Skin hygiene</b>","Gentle cleansing; manage intertrigo or bromhidrosis if present, treating confirmed infection per local guidance; dry fully before aluminium chloride","Prevents the infective complications"],
         ["<b>Peer support</b>","International Hyperhidrosis Society (SweatHelp.org) — validated information and a treatment finder","<b>Normalising the condition reduces shame and improves adherence</b>"]
       ]},
       {b:"why", html:"Hyperhidrosis can have a substantial effect on quality of life, and many people delay consulting because of embarrassment or not knowing treatment exists. Saying 'this is a recognised, treatable condition' is itself an intervention."}
     ]},

    {id:"monitor", nav:"Monitor", title:"Follow-up, monitoring and safety-netting", sub:"Re-score the HDSS at every step — it documents response and supports referral under local criteria.",
     blocks:[
       {b:"table", head:["When","What","Action"], rows:[
         ["<b>4–6 weeks</b>","Aluminium chloride response and technique (dry skin? night application?); HDSS re-score","Partial response → fix technique/frequency before escalating; intolerance → manage dermatitis and reduce frequency, then consider second-line options per the local pathway (topical glycopyrronium cream is for severe axillary disease after aluminium-based antiperspirants and oral antimuscarinics — NICE TA1175)"],
         ["<b>3 months</b>","Oral anticholinergic efficacy and tolerability; dose titration; iontophoresis adherence and technique","Re-check the secondary screen if the picture is evolving"],
         ["<b>6 months</b>","Post-botulinum: as the effect wanes, repeat treatment through the specialist service under local criteria; ongoing HDSS scoring","Progressively shortening effect → consider neutralising-antibody formation"],
         ["<b>Annually</b>","Still needed? Review whether treatment can be reduced or stopped","Also re-screen the drug list for new induced causes, and revisit ambiguous histories"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"📞 999", html:"Suspected phaeochromocytoma crisis — severe hypertension with headache, palpitations, sweating, chest pain, neurological symptoms or collapse; do not wait for metanephrines. Serotonin syndrome — serotonergic medicine + sweating with clonus, hyperreflexia, rigidity, agitation, altered mental state or hyperthermia."},
         {tone:"amber", h:"🟠 Urgent GP review", html:"NEW nocturnal sweating in a patient labelled primary · distribution becoming generalised or unilateral · new constitutional symptoms (weight loss, fever, pruritus, lumps, breathlessness) · new episodes of palpitations and headache · at any point → re-run the secondary work-up — the old diagnosis must not anchor away the new disease."},
         {tone:"blue", h:"🩺 On re-presentation after successful treatment", html:"Consider: aluminium-chloride tolerance (rare), a secondary cause emerging de novo, or adherence — re-evaluate before restarting the ladder."},
         {tone:"cream", h:"💬 Safety-net scripts", html:"“Drenching night sweats with weight loss, fevers or lumps — come back, we'll investigate.” · “The tablets reduce sweating all over — take care in hot weather and heatwaves, and stop and tell us if you have trouble passing urine, blurred vision, confusion or severe constipation.” · “If the antiperspirant stings, use it less often with a moisturiser — don't just stop.” · “If the sweating is affecting your mood or social life, tell us — there are more options.”"}
       ]}
     ]},

    {id:"loop", nav:"Not responding?", title:"Not controlled? Re-check before escalating", sub:"Confirm the type and an adequate trial before referral.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"1 \u00b7 Secondary cause", html:"Generalised/night sweats or systemic features \u2192 investigate (thyroid, infection, malignancy)."},
         {tone:"blue", h:"2 \u00b7 Technique", html:"Antiperspirant applied correctly (dry skin, at night)?"},
         {tone:"blue", h:"3 \u00b7 Step up", html:"Oral antimuscarinic, botulinum toxin or (axillary, after oral antimuscarinics) topical glycopyrronium cream considered per the local pathway?"},
         {tone:"blue", h:"4 \u00b7 Tolerability", html:"Side effects limiting oral therapy?"},
         {tone:"blue", h:"5 \u00b7 Refer", html:"Refractory focal disease \u2192 iontophoresis / botulinum toxin / dermatology."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — who, when, how urgently", sub:"Most primary hyperhidrosis is managed entirely in primary care. These are the exits.",
     blocks:[
       {b:"cards", items:[
         {tone:"purple", h:"Suspected cancer pathway referral · NICE NG12", html:"Unexplained lymphadenopathy or splenomegaly in an adult (particularly with night sweats, fever, breathlessness, pruritus or weight loss) → consider a suspected cancer pathway referral for lymphoma. FBC and other investigations may be done in parallel but must not delay referral where clinical concern is significant; night sweats alone are not an NG12 lymphoma criterion.", src:"NICE NG12 (updated April 2026)"},
         {tone:"red", h:"Endocrine (urgent)", html:"Positive phaeochromocytoma biochemistry (emergency if acutely unwell) · suspected carcinoid syndrome (or the local neuroendocrine-tumour pathway) · uncontrolled thyrotoxicosis · acromegaly."},
         {tone:"amber", h:"Dermatology", html:"Severe, persistent primary axillary hyperhidrosis not responding to, or intolerant of, appropriate topical treatment → specialist botulinum toxin; record the HDSS and functional impact — eligibility depends on the local provider/ICB pathway, not HDSS alone. Palmoplantar disease → iontophoresis ± specialist botulinum toxin or systemic antimuscarinic. Refractory disease after second-line options → specialist review. Skin complications."},
         {tone:"blue", h:"Menopause clinic / gynaecology", html:"Sweating with hot flushes is a menopausal vasomotor symptom → manage through the menopause pathway (HRT discussion); persistent focal sweating outside flush episodes may represent co-existing hyperhidrosis; where HRT is contraindicated (e.g. breast cancer): CBT, venlafaxine (off-label, RCT evidence), clonidine or gabapentin. See the <a href='hrt-prescribing.html'>HRT protocol</a>."},
         {tone:"blue", h:"Neurology", html:"Unilateral hyperhidrosis (Horner's, cord pathology) · compensatory post-sympathectomy sweating · unexplained autonomic neuropathy."},
         {tone:"amber", h:"Vascular / thoracic surgery — last resort", html:"ETS only for severe, refractory palmar or craniofacial disease after non-surgical options have failed or are unacceptable, with counselling documented that compensatory truncal sweating is common and may be severe. ETS is generally not preferred for isolated axillary disease (NICE IPG487)."},
         {tone:"blue", h:"Psychology / NHS Talking Therapies", html:"HDSS ≥3 with anxiety, depression or social phobia as driver or consequence — CBT has evidence for hyperhidrosis-related anxiety; self-referral available in most areas."},
         {tone:"green", h:"GP manages", html:"The primary-care steps: aluminium chloride with technique coaching (self-care purchase in Greater Manchester), referral for iontophoresis, cautious oral antimuscarinics under a local protocol, drug-cause switches, the HDSS and functional-impact record that supports referral under local criteria, and the annual review."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only — the Casebook keeps the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 19-year-old apprentice electrician attends with his mother, mortified: since school he has had soaking palms and axillae — he avoids handshakes, wears only black, and is about to fail a wiring assessment because tools slip. His father 'was the same'. He sleeps dry. He asks whether 'that operation' would fix it, having read about sympathectomy online."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Asks the <b>sleep question</b> and confirms the primary pattern (onset &lt;25, bilateral focal, family history) so <b>no investigations</b>; scores the <b>HDSS (4)</b> and acknowledges the psychosocial impact explicitly; teaches <b>aluminium chloride technique</b> (bone-dry skin, at night, irritation management) and plans <b>referral for iontophoresis for the palms</b>; counsels honestly that <b>sympathectomy is irreversible and compensatory sweating is common and may be severe</b>, and reframes it as a last resort; flags the <b>specialist botulinum route</b> (local eligibility criteria) if the axillae stay severe after the trial; addresses the exam pressure (occupational adjustments) and offers <b>Talking Therapies</b>; safety-nets <b>new night sweats or systemic symptoms</b>."}
     ]}]},

       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+

         '<li><b>NICE TA1175 \u2014 Glycopyrronium bromide cream for treating severe primary axillary hyperhidrosis (July 2026)</b><br><a href="https://www.nice.org.uk/guidance/ta1175" rel="noopener">nice.org.uk/guidance/ta1175</a><span class="rd"> \u2014 topical glycopyrronium for severe primary axillary hyperhidrosis in adults when lifestyle advice, topical aluminium-based antiperspirants and oral antimuscarinics have not controlled sweating, or are contraindicated or not tolerated</span></li>'+
         '<li><b>Botox (onabotulinumtoxinA) \u2014 Summary of Product Characteristics</b><br><a href="https://www.medicines.org.uk/emc/search?q=botox" rel="noopener">medicines.org.uk/emc</a><span class="rd"> \u2014 50 units per axilla, intradermal, for severe persistent primary axillary hyperhidrosis</span></li>'+
         '<li><b>Hornberger J et al., J Am Acad Dermatol 2004</b><span class="rd"> \u2014 the primary-hyperhidrosis diagnostic criteria (focal, bilateral, \u22656 months, onset &lt;25, family history, nocturnal absence)</span></li>'+
         '<li>International Hyperhidrosis Society consensus (international) \u00b7 British Dermatology Nursing Group guidelines<br><a href="https://www.sweathelp.org" rel="noopener">sweathelp.org</a><span class="rd"> \u2014 HDSS, iontophoresis protocols, patient resources</span></li>'+

         '<li><b>MHRA \u2014 Axhidrox 2.2 mg/pump actuation cream, Summary of Product Characteristics (PL 47848/0056)</b><br><a href="https://products.mhra.gov.uk/" rel="noopener">products.mhra.gov.uk</a><span class="rd"> \u2014 severe primary axillary hyperhidrosis in adults</span></li>'+
         '<li><b>NICE IPG487 \u2014 Endoscopic thoracic sympathectomy for primary hyperhidrosis of the upper limb</b><br><a href="https://www.nice.org.uk/guidance/ipg487" rel="noopener">nice.org.uk/guidance/ipg487</a><span class="rd"> \u2014 specialist option after other treatments; compensatory sweating risk</span></li>'+

         '<li><b>NHS Specialist Pharmacy Service \u2014 Heatwaves and medicines</b><br><a href="https://www.sps.nhs.uk/" rel="noopener">sps.nhs.uk</a><span class="rd"> \u2014 anticholinergics impair thermoregulation and increase heat-illness risk</span></li>'+
         '</ul></div>'}
     ]}
  ],
