  stemSub:"One page for the whole condition. The acute attack comes first, because <b>under-recognition is the mechanism of death</b>: silent chest, cyanosis, poor respiratory effort, exhaustion or drowsiness with SpO₂ below 92% is a 999 call, and a spacer delivers salbutamol as effectively as a nebuliser in most attacks. Then the stepwise preventer ladder — but always recheck inhaler technique, adherence, spacer use and smoke exposure BEFORE stepping up, because those are the commonest reasons for apparent poor control. Every child needs a <b>written action plan</b>, a <b>smoke-free home</b>, and a <b>review after every attack</b>.",

  quick:[
    {tone:"red", h:"⚠ Life-threatening attack — 999", html:"Silent chest, cyanosis, poor respiratory effort, exhaustion, agitation or drowsiness, SpO₂ below 92% → 999, with back-to-back salbutamol via spacer or nebuliser and a steroid while awaiting transfer. <b>A silent chest means less air moving, not less asthma</b> — it is the most dangerous sign and the easiest to misread as improvement."},
    {tone:"red", h:"⚠ Acute severe — urgent treatment and admit", html:"Too breathless to talk or feed, respiratory rate or heart rate high for age, SpO₂ below 92% → urgent treatment plus admission. Refer same-day for an incomplete response to bronchodilator, or any life-threatening feature. Age-specific rate thresholds matter — an adult's \"normal\" tachypnoea is not a child's."},

       {tone:"cream", h:"Classic scenario", html:"A 6-year-old girl attends with her father after <b>three courses of prednisolone in 8 months</b> and a recent A&amp;E attendance. She is on a <b>low-dose ICS twice daily and salbutamol</b>, and the record shows <b>11 salbutamol inhalers issued this year</b>. She <b>wakes coughing two or three nights a week</b> and stops running at playtime. She takes her inhalers <b>without a spacer</b> \"because she's old enough now\", and her father <b>smokes in the kitchen with the window open</b>. He asks for \"a stronger preventer\"."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Does NOT simply step up the ICS — checks technique, adherence, spacer use and smoke exposure first, which is exactly what NG245 requires and what this case is built around; reinstates the spacer and demonstrates it, correcting the \"old enough now\" belief; reads 11 relievers a year and three steroid courses as markers of poor control and high risk, not as reassurance that the reliever works; addresses the smoking directly — kitchen with the window open is still smoke exposure — and offers the father cessation support; <b>reviews night waking and exercise limitation as control measures</b>; considers an LTRA or paediatric MART per the NG245 age bands only after technique and adherence are addressed; issues or updates a written action plan and ensures the school holds a reliever and spacer; <b>checks the influenza vaccine and plots growth</b>; and <b>arranges the post-exacerbation review she never had.</b>"}

  foot:"Asthma in children — NICE/BTS/SIGN NG245 (2024), BTS/SIGN acute asthma guidance and the BNF for Children. Acute asthma kills children when severity is under-recognised: silent chest, cyanosis, poor respiratory effort, exhaustion or drowsiness with SpO₂ below 92% is a 999 call, and a spacer delivers salbutamol as effectively as a nebuliser in most attacks. Always recheck inhaler technique, adherence, spacer use and smoke exposure before stepping up, and step down when control is sustained. Every child needs a written action plan, a spacer, a smoke-free home and annual influenza vaccination. Review after every attack — within 48 hours and again at 1–2 weeks. Verify drugs, doses and age bands against current NG245 and the BNF for Children."
