  stemSub:"One page for the whole condition. Isolated raised unconjugated bilirubin with entirely normal liver enzymes and no haemolysis — that pattern, in an otherwise well person, is Gilbert's. Confirm it once, exclude what it is not, then <b>reassure: benign, lifelong, no treatment, no monitoring</b>. Two things to tell the patient: jaundice appearing with fasting, illness or stress is harmless and self-resolving, and the reduced glucuronidation matters for a few drugs — notably irinotecan — so it is worth mentioning at prescribing.",

    {tone:"blue", h:"The pattern: isolated unconjugated bilirubin, normal everything else", html:"Common (around 5%) inherited reduced UGT1A1 enzyme activity → mild unconjugated hyperbilirubinaemia. Isolated raised bilirubin, predominantly unconjugated, with NORMAL ALT, ALP, GGT and albumin, and no anaemia or haemolysis. <b>Genetic testing is rarely needed</b> — this is pattern recognition plus exclusion."},

    {tone:"amber", h:"⚠ Drug handling — flag it at prescribing", html:"Reduced glucuronidation can affect certain drugs — notably increased toxicity with irinotecan, and relevant for some others such as atazanavir. Tell the patient to mention Gilbert's if they are ever prescribed chemotherapy, and record it prominently so it is visible at prescribing."},

       {tone:"cream", h:"Examiner-style checkpoints", html:"Recognises the pattern — isolated unconjugated hyperbilirubinaemia with normal enzymes and no haemolysis — and names Gilbert's confidently rather than hedging, since a confident diagnosis is the therapeutic act here; requests split bilirubin plus reticulocytes and film to complete the one-off confirmation rather than either over-investigating or skipping the exclusions; <b>explicitly excludes haemolysis and cholestasis</b>, and can say what would change the picture; <b>declines the scan and hepatology referral with a reason</b>, explaining that no monitoring is needed; addresses the fatigue separately rather than attributing it to Gilbert's, which does not cause symptoms; <b>explains the fasting and stress triggers and the family pattern</b>; <b>warns that future blood tests will show it and that this is expected</b>, to prevent repeat work-ups; and <b>records the drug-handling caution, mentioning irinotecan.</b>"}

  foot:"Gilbert's syndrome. A benign diagnosis of reassurance: isolated raised unconjugated bilirubin with normal ALT, ALP, GGT and albumin, and no anaemia or haemolysis, in an otherwise well person. Confirm once with split bilirubin, LFTs and FBC with reticulocytes and film — then stop testing. No treatment, no monitoring, no special diet, no specialist follow-up. Jaundice with fasting, illness, dehydration, stress or exercise is harmless and self-resolving. Reduced glucuronidation increases irinotecan toxicity — record it so it is visible at prescribing. Never attribute conjugated hyperbilirubinaemia, deranged enzymes, haemolysis or a systemically unwell patient to Gilbert's."
