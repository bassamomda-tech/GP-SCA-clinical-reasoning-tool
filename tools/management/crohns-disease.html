  icon:"🟣",

  stemTitle:"Consider complications and infection before any steroid — and never let &ldquo;it's a flare&rdquo; be the whole diagnosis",
  stemSub:"This page supports primary-care triage, monitoring and shared care. It does not replace the patient's gastroenterology flare plan, the local IBD pathway, product information or urgent hospital assessment. Crohn's is <b>transmural</b>, so complications — abscess, fistula, stricture, perforation — are common, and every one of them is made worse by the steroid that an unwary clinician reaches for first. Consider abscess, perforation, obstruction and sepsis before any steroid; for new or worsening diarrhoea, send stool (including <i>C. difficile</i>) per the local laboratory pathway; use the <b>Harvey-Bradshaw Index</b> only as an adjunct to clinical assessment; know the <b>Montreal phenotype</b>, because location and behaviour — not symptom severity — decide whether the answer is a drug, a dilatation or an operation; use corticosteroids to induce remission and never to maintain it; and offer <b>smoking cessation support</b> at every opportunity, because in Crohn's (unlike UC) smoking is associated with more active disease, relapse, postoperative recurrence and surgery. NICE NG129 · CG118 · NG12 · BSG IBD 2025 · BSG IBD surveillance 2025 · ECCO 2024 · GMMMG IBD pathway.",
  guideline:"NICE NG129 (2019) · NICE CG118 (2011) · NICE QS81 · BSG IBD in adults (2025) · BSG colorectal surveillance in IBD (2025) · ECCO Crohn's medical and surgical therapeutics (2024) · GMMMG IBD high-cost-drug pathway · NICE NG12 (updated April 2026)",
  reviewed:"9 September 2026",
  nextReview:"9 March 2027",

  ],
  lead:"<div class='mg-layers'><a href='#severe'><b>Complication first</b><small>Complications before steroids</small></a><a href='#infection'><b>Exclude infection</b><small>Stool tests for new diarrhoea</small></a><a href='#confirm'><b>Phenotype decides</b><small>Montreal L + B</small></a><a href='#ladder'><b>Induce, then spare</b><small>Steroids never maintain</small></a></div>",
  quickSub:"If you read nothing else on this page, read these six cards. Sources are cited under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Consider an abscess before you prescribe prednisolone", html:"Roughly 15&ndash;20% of patients who look like a Crohn's flare have an underlying abscess or septic complication — higher in ileocolonic and post-surgical disease, and intra-abdominal abscess complicates up to <b>25%</b> of Crohn's over a lifetime. Steroids suppress the response to undrained sepsis, let the collection enlarge and can precipitate perforation. The flags: a localised mass (classically <b>right iliac fossa</b> in ileocolonic disease), fever, a markedly raised CRP, or failure to respond to standard flare treatment. <b>Do not start corticosteroids if an abscess, perforation, obstruction or uncontrolled sepsis is clinically suspected</b> — arrange urgent specialist assessment and appropriate imaging, usually contrast-enhanced CT in the acute setting. Routine CT is not required before treating every uncomplicated flare. Perforation, complete obstruction, massive haemorrhage or intra-abdominal sepsis with haemodynamic compromise → 999."},
    {tone:"amber", h:"Consider infection before you immunosuppress", html:"For new or worsening diarrhoea, send stool testing per the local laboratory pathway, including <i>C. difficile</i> testing and microbiology for enteric infection where clinically indicated. Consider recent antibiotics, hospital exposure, travel, outbreaks and immunosuppression. Don't treat presumed inflammatory relapse with corticosteroids until important infection has been considered — but don't delay emergency treatment in an unstable patient. <b>Do not assume that a flare equals active Crohn's</b> — infective colitis frequently masquerades as relapse and changes the entire management. Then separate inflammation from the functional overlap: interpret faecal calprotectin per the local laboratory pathway and context — <b>a low result makes active colonic inflammation less likely but does not exclude isolated small-bowel disease or complications</b>, and a raised result is not specific (infection, NSAIDs, neoplasia). IBS-like functional symptoms are common in Crohn's, and in them steroids buy side effects and no benefit."},
    {tone:"blue", h:"The Montreal phenotype decides the treatment, not the symptom score", html:"<b>Location:</b> L1 ileal (the commonest), L2 colonic, L3 ileocolonic (about <b>50%</b>), L4 upper GI; <b>&ldquo;p&rdquo;</b> is added for perianal disease (e.g. L3B3p). <b>Behaviour:</b> B1 inflammatory, B2 stricturing, B3 penetrating — and <b>behaviour escalates in roughly 20% of patients per decade</b>. B1 responds to drugs; B2 fibrostenotic disease does not respond to steroids or biologics at all and needs balloon dilatation or resection; B3 penetrating disease needs joint gastroenterology, radiology and surgical assessment — surgery is not automatic. L4 disease adds a proton pump inhibitor to systemic treatment. Prescribing prednisolone for an obstructing fibrotic stricture is a common and futile error."},
    {tone:"cream", h:"Induce with a steroid; maintain with something else", html:"If corticosteroids are prescribed, use the patient's gastroenterology/IBD flare plan or locally agreed protocol, document the intended duration and taper, and arrange early review — failure to improve within a few days prompts specialist reassessment, not dose escalation. Specialist-directed <b>budesonide</b> may be considered for mild-to-moderate ileocaecal disease when systemic corticosteroids are unsuitable, declined or not tolerated; it is less effective, and not for severe disease, obstruction, abscess or penetrating disease. Maintenance (thiopurine, methotrexate in selected patients, biologics and advanced therapies) is initiated and changed by the IBD team, and every systemic steroid course should trigger a review of it. <b>Oral 5-ASA is not effective maintenance in Crohn's</b> — unlike UC — so avoid routine use and stop it if the diagnosis has been revised, and <b>never use steroids to maintain remission</b>."},
    {tone:"green", h:"Offer smoking cessation support at every opportunity", html:"Smoking is associated with more active Crohn's disease, relapse, postoperative recurrence and surgery. In Crohn's, smoking is harmful — the opposite of the UC paradox. Refer to the NHS Stop Smoking Service at <em>every</em> consultation; combination NRT or varenicline is most effective. After resection, stopping smoking is a key part of preventing recurrence."},
    {tone:"amber", h:"Examine the perianal area, and do not let a flare explain weight loss", html:"Perianal Crohn's affects about 25&ndash;35% of patients (up to 50% over a lifetime) and is missed when nobody looks. A tender fluctuant perianal mass is an abscess needing urgent colorectal surgical assessment and drainage — antibiotics are not definitive treatment. Separately: long-standing Crohn's plus thiopurine and anti-TNF carries roughly 4&ndash;5× the lymphoma risk, colonic Crohn's carries the same colorectal-cancer risk as UC, and small-bowel disease raises small-bowel adenocarcinoma risk. New weight loss, new anaemia or a changed symptom pattern is an investigation, not a flare — the NG12 thresholds are in <a href='#refer'>Refer</a>."}
  ],
  pathwaySub:"The whole consultation in five moves. Step 1 is tinted red because this is the point at which the wrong prescription causes harm.",
  pathway:[
    {title:"Complication before diagnosis", html:"Before anything else, ask whether this is an <b>abscess, perforation, obstruction or sepsis</b> rather than a flare — mass and fever, peritonism, colicky pain with vomiting and distension, abnormal observations (NEWS2 helps recognise acute illness but is not a Crohn's treatment threshold). Also check medication and adherence, NSAIDs and opioids, recent antibiotics, admission, travel and infection exposure, and pregnancy possibility. <b>If a complication is suspected: no steroid — urgent specialist assessment and appropriate imaging (usually contrast CT acutely).</b>", alert:true},
    {title:"Exclude infection, then quantify", html:"<b>Stool tests per the local laboratory pathway (including <i>C. difficile</i>) for new or worsening diarrhoea</b>, <b>FBC, CRP, ESR, albumin, U&amp;E, LFTs, ferritin and iron studies, B12/folate where relevant, vitamin D</b>, and <b>faecal calprotectin</b> if stable and inflammatory-versus-functional is the question. Do not delay emergency referral for test results."},
    {title:"Grade it and place it", html:"<b>Harvey-Bradshaw Index</b> as an adjunct only (never alone to decide admission or steroids), <b>Montreal L + B (± p)</b> for phenotype, and weight trend, BMI, intake and nutritional risk. Ring the named <b>IBD nurse</b> — they hold the rescue protocol."},
    {title:"Induce, and fix the nutrition", html:"A steroid per the patient's IBD flare plan (budesonide only for selected mild–moderate ileocaecal disease), or <b>exclusive enteral nutrition</b> — first-line induction in children; in adults only in selected circumstances (BSG 2025). Replace B12, iron and vitamin D per results and local protocol; assess fracture risk with prolonged or repeated steroids."},
    {title:"Make maintenance real", html:"Steroid-sparing therapy with the IBD team, <b>smoking cessation support</b>, drug monitoring per the local shared-care protocol, vaccination before immunosuppression, and surveillance that is actually booked."}
  ],
  sections:[
    {id:"severe", nav:"Emergencies", title:"The complication branch — what must not be treated as a flare", sub:"Required reading before any prescription. Crohn's is transmural: the emergencies are surgical, and most of them are made worse by corticosteroids.",
     blocks:[
       {b:"warn", html:"Do not start corticosteroids if an abscess, perforation, obstruction or uncontrolled sepsis is clinically suspected — arrange urgent specialist assessment and appropriate imaging (usually contrast-enhanced CT in the acute setting). Routine CT is not required before treating every uncomplicated flare. Steroids mask the septic response, allow the collection to enlarge and can precipitate perforation. The same rule applies to a <b>perianal abscess</b>: it needs urgent colorectal surgical assessment and drainage, and <b>antibiotics are not definitive treatment for an abscess</b>."},
       {b:"cards", cols:2, items:[
         {tone:"red", h:"Intra-abdominal abscess or inflammatory mass", html:"Right iliac fossa mass with fever and tenderness in known ileocolonic Crohn's. Not a simple flare. Same-day hospital assessment; contrast-enhanced CT is usually the acute imaging; IR-guided drainage or surgery; IV antibiotics. Do not start prednisolone while an abscess is suspected — it will worsen the infection. Suspect it with fever, a markedly raised CRP, a palpable mass, or non-response to standard treatment."},
         {tone:"red", h:"Perforation / peritonitis", html:"Sudden severe generalised abdominal pain, peritonism with guarding and board-like rigidity, absent bowel sounds, free gas on AXR or CXR. Free perforation of a Crohn's segment is rare but rapidly fatal. <b>→ 999. Emergency laparotomy.</b>"},
         {tone:"red", h:"Mechanical small bowel obstruction", html:"Colicky pain, bilious vomiting, distension, absolute constipation, high-pitched bowel sounds — stricture in fibrostenotic Crohn's. <b>→ 999.</b> Nil by mouth, IV fluids, NG tube, VTE prophylaxis, AXR + CT abdomen, then surgical or endoscopic assessment (<b>endoscopic balloon dilatation versus resection</b>)."},
         {tone:"red", h:"Perianal abscess", html:"Perianal pain and swelling with a tender fluctuant mass, discharge and fever. Fistulising Crohn's. → Urgent same-day colorectal surgical assessment and drainage. Complex fistulising disease is assessed through the IBD MDT with pelvic MRI and/or EUA, according to urgency and local expertise; seton placement is decided by the colorectal surgeon. Antibiotics may be used for sepsis or as a specialist bridge but are not definitive treatment for an abscess."},
         {tone:"red", h:"Haemodynamic instability or haemorrhage", html:"<b>PR bleeding with tachycardia or hypotension → 999</b> (GI haemorrhage). A systemically unwell patient (tachycardia, hypotension, sepsis — NEWS2 supports recognition but is not a Crohn's treatment threshold) → emergency assessment, resuscitation, sepsis management, urgent imaging where indicated, and gastroenterology/surgical review. IV corticosteroids only when specialist assessment supports severe inflammatory Crohn's disease or colitis and uncontrolled infection, perforation and abscess have been addressed."},
         {tone:"red", h:"Fever on a biologic or immunosuppressant", html:"Opportunistic infection and sepsis. Patients on anti-TNF agents cannot mount a normal febrile or inflammatory response, so sepsis assessment is unreliable — check FBC urgently and review the same day."},
         {tone:"red", h:"Reactivation tuberculosis on anti-TNF", html:"Fever, productive cough, weight loss and night sweats in a patient on infliximab or adalimumab. → Same-day chest medicine and the TB team; CXR + sputum AFB; withhold the anti-TNF on urgent IBD and TB team advice; TB treatment per the TB team. This is why IGRA and hepatitis B surface antigen are checked before anti-TNF is started."},
         {tone:"amber", h:"Severe weight loss", html:"<b>Loss of &gt;10% of body weight in 3 months</b> — malnutrition, malabsorption or active disease. <b>→ Same-day gastroenterology.</b> Do not attribute it to the flare until cancer and sepsis have been considered (<a href='#refer'>Refer</a>)."},
         {tone:"amber", h:"Ureteric colic in Crohn's", html:"Crohn's increases <b>oxalate renal stones</b> — sudden severe loin pain warrants <b>AXR and renal ultrasound</b> rather than being folded into the flare."},
         {tone:"amber", h:"Jaundice or cholestatic LFTs", html:"<b>Primary sclerosing cholangitis</b> is predominantly associated with UC but occurs in Crohn's colitis — jaundice or abnormal LFTs prompt hepatology referral, not reassurance."}
       ]}
     ]},
    {id:"infection", nav:"Exclude infection", title:"Not every flare is a flare", sub:"Required. The single commonest way to harm a Crohn's patient in primary care is to immunosuppress an infection.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"New or worsening diarrhoea", html:"Send stool testing per the local laboratory pathway — <b><i>C. difficile</i> testing</b> (laboratories combine toxin EIA, GDH and/or NAAT/PCR) and <b>microbiology for enteric infection</b> where clinically indicated. Consider <b>recent antibiotics, hospital exposure, travel, outbreaks and immunosuppression</b>. Don't use corticosteroids for presumed inflammatory relapse until important infection has been considered — but don't delay emergency treatment in an unstable patient. Distinguish new or worsening diarrhoea, systemic illness or severe flare, and a stable, previously characterised relapse under an agreed IBD plan. <b>Do not assume flare = active Crohn's.</b>"},
         {tone:"amber", h:"Inflammation or function?", html:"Interpret faecal calprotectin using the local laboratory pathway and clinical context. A low result makes active colonic inflammation less likely but <b>does not exclude isolated small-bowel Crohn's disease or complications</b> (abscess, stricture, obstruction). A raised result is not specific for relapse — consider infection, NSAIDs, colorectal neoplasia and other pathology. <b>Never use it to delay referral</b> for a mass, obstruction, severe pain, weight loss, bleeding or systemic illness. IBS-like functional symptoms are common in Crohn's, and over-treating them drives steroid dependency and osteoporosis."}
       ]},
       {b:"say", html:"&ldquo;Your symptoms are back, but before I give you steroids I need to be sure this is your Crohn's and not an infection on top of it — because the treatment for those two things is opposite. That's what the stool sample is for.&rdquo;"}
     ]},
    {id:"confirm", nav:"Grade &amp; phenotype", title:"Grading the flare and knowing the phenotype", sub:"Required. Activity score tells you how hard to treat; the Montreal phenotype tells you what to treat with.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Harvey-Bradshaw Index — the bedside score", html:"<b>Components, each scored 0&ndash;4:</b> general wellbeing (0&ndash;4), abdominal pain (0&ndash;3), <b>number of liquid stools per day</b> (1 point per stool above normal), <b>abdominal mass</b> (0 none, 1 dubious, 2 definite, 3 tender), and <b>complications</b> — arthralgia, uveitis, erythema nodosum, aphthous ulcers, pyoderma gangrenosum, anal fissure, new fistula, abscess — <b>1 point each</b>.<br>Bands: 0&ndash;4 remission · 5&ndash;7 mild active · 8&ndash;16 moderate active · &gt;16 severe active. The HBI is deliberately simpler than the <b>CDAI</b>, which needs a 7-day symptom diary, and can be scored in primary care without laboratory data. <b>Use it, if familiar, only as an adjunct to clinical assessment</b> — it is not a validated emergency triage tool and misses dehydration, sepsis, obstruction, abscess, bleeding, hypoalbuminaemia, anaemia, nutritional compromise, fistulising or stricturing disease, comorbidity and frailty."},
         {tone:"blue", h:"Escalation is a clinical judgement, not a score", html:"<b>Do not use an HBI threshold alone to determine admission or steroid treatment.</b> Base escalation on observations, hydration, abdominal and perianal findings, vomiting or obstructive symptoms, bleeding, inflammatory markers, albumin, nutritional status, comorbidity and the patient's established IBD plan — and contact the IBD team early."}
       ]},
       {b:"dl", rows:[
         ["Montreal location","<b>L1 ileal</b> (most common) · <b>L2 colonic</b> · <b>L3 ileocolonic</b> (about <b>50%</b> of patients) · <b>L4 upper GI</b> (oesophageal, gastroduodenal). Modifier <b>&ldquo;p&rdquo;</b> is added where perianal disease is present, e.g. <b>L3B3p</b>."],
         ["Montreal behaviour","<b>B1 inflammatory</b> (non-penetrating, non-stricturing) · <b>B2 stricturing</b> (fibrostenotic — obstruction risk) · <b>B3 penetrating</b> (fistulae, abscesses). <b>Behaviour escalates in roughly 20% of patients per decade</b>, so the phenotype recorded at diagnosis is not necessarily today's."],
         ["Phenotype → management","B1 = medical therapy. B2 = endoscopic balloon dilatation or surgery. B3 = joint gastroenterology, radiology and surgical assessment (surgery is not automatic). L4 = proton pump inhibitor added to systemic treatment. A stricturing flare presenting with obstructive symptoms needs surgical assessment, not more steroid."],
         ["Perianal classification","<b>Simple low fistula</b> — intersphincteric or transsphincteric below the dentate line; lower incontinence risk with treatment. <b>Complex fistula</b> — high transsphincteric, suprasphincteric, multiple tracts, rectovaginal, or with abscess; aggressive surgery risks faecal incontinence. <b>MRI pelvis is the gold standard for fistula mapping.</b> Simple asymptomatic fistulas may not need immediate medical treatment."],
         ["Crohn's or UC?","<b>Crohn's:</b> skip lesions, right-iliac-fossa predominance, perianal disease, mouth ulcers, weight loss, diarrhoea often without rectal bleeding. <b>UC:</b> continuous colonic disease from the rectum, predominantly rectal bleeding. Colicky pain suggests obstruction; continuous pain suggests inflammation or abscess."],
         ["Current therapy","Establish exactly what maintenance the patient is on — azathioprine, mercaptopurine, methotrexate, or a biologic or advanced therapy (infliximab, adalimumab, vedolizumab, ustekinumab, risankizumab, upadacitinib) — because it changes both the differential and the escalation route."],
         ["Contact the IBD nurse","Most patients have a <b>named IBD nurse specialist</b> who knows the phenotype, the baseline and the rescue protocol. <b>Contact them before GP-led escalation</b> — they can activate rescue protocols and arrange urgent review, and a five-minute call prevents both unnecessary appointments and unnecessary admissions."]
       ]}
     ]},
    {id:"exam", nav:"Examination", title:"Targeted examination", sub:"Optional elsewhere; not here. In Crohn's the examination finds the complication, and the perianal inspection is the part most often skipped.",
     blocks:[
       {b:"table", head:["What","Why it changes the plan"], rows:[
         ["Before calling it a flare","Observations and hydration, abdominal examination, perianal inspection where appropriate, weight and nutritional status, medication and adherence, recent antibiotics, admission, travel and infection exposure, NSAIDs and opioids, pregnancy possibility, and bloods and stool tests as clinically indicated."],
         ["Vital signs","Temperature, HR, BP. Tachycardia with fever means abscess or infection until proven otherwise. Postural hypotension indicates significant dehydration."],
         ["Weight and nutrition","Weight against baseline, BMI, <b>mid-arm circumference</b>, muscle wasting, oedema (hypoalbuminaemia). Assess weight trend, BMI, dietary intake and nutritional risk (MUST is one tool)."],
         ["Abdomen","<b>RIF mass or tenderness</b> — inflamed terminal ileum, abscess, or rarely cancer. Obstruction signs: distension, tinkling bowel sounds, visible peristalsis. Diffuse tenderness suggests colonic disease."],
         ["Perianal — always","Inspect for <b>oedematous fibrotic skin tags</b> (typical of Crohn's), <b>fissures — off-midline suggests Crohn's, midline is idiopathic</b>, external fistula openings with discharge, and a <b>fluctuant tender abscess</b>. Perianal disease can be the presenting feature and a major source of morbidity. Consider rectal inflammation and sexually transmitted infection where clinically relevant; an unexplained anal mass or ulceration needs suspected-cancer pathway consideration."],
         ["Mouth","<b>Aphthous ulcers parallel gut activity</b> and are a quick marker of flare severity; angular cheilitis suggests iron deficiency, glossitis B12 or folate deficiency."],
         ["Extra-intestinal","Peripheral arthropathy (large-joint arthritis) versus axial spondyloarthritis, erythema nodosum (painful red shin nodules), <b>pyoderma gangrenosum</b>, and <b>uveitis — a red painful eye is same-day ophthalmology</b>."]
       ]},
       {b:"warn", html:"<b>A palpable RIF mass in Crohn's must not be assumed to be a flare.</b> It may be an abscess, an inflammatory mass, or — in long-standing disease — a cancer."}
     ]},
    {id:"workup", nav:"Work-up", title:"Investigations — and which imaging to ask for", sub:"Required. What every flare gets, what the drug monitoring adds, and the imaging rule that keeps radiation off a young patient's lifetime dose.",
     blocks:[
       {b:"cards", items:[
         {tone:"blue", h:"Bloods — every flare", html:"<b>FBC · CRP · ESR · albumin · U&amp;E · LFTs · ferritin and iron studies · B12/folate where relevant</b> — inflammatory burden plus nutritional status. <b>B12 specifically where there is terminal ileal disease or resection</b>; <b>iron and ferritin</b> (duodenal involvement); <b>zinc and selenium</b> in severe malabsorption; <b>albumin</b> is both a nutritional and an inflammatory marker."},
         {tone:"blue", h:"Stool — when clinically indicated", html:"<b>New or worsening diarrhoea: <i>C. difficile</i> testing and stool microbiology per the local laboratory pathway.</b> <b>Faecal calprotectin</b> if the patient is stable and the question is inflammatory versus functional — interpret per the local pathway and clinical context; a low result does not exclude small-bowel disease or complications."},
         {tone:"blue", h:"Vitamin D and bone", html:"<b>Vitamin D deficiency is present in up to 70% of Crohn's patients</b> because of malabsorption, and is associated with more severe activity and higher fracture risk. <b>Supplement if below 50 nmol/L.</b> With prolonged or repeated steroid exposure or after a fragility fracture, assess fracture risk and consider DEXA according to fracture risk and local osteoporosis guidance — arranged by the GP or gastroenterology."},
         {tone:"blue", h:"Drug monitoring", html:"Per the <b>local shared-care protocol for the specific drug</b> (thiopurine or methotrexate: FBC, LFTs and renal function where relevant). Biologic drug levels and anti-drug antibodies are arranged and interpreted by gastroenterology (see <a href='#monitor'>Monitoring</a>)."},
         {tone:"blue", h:"Imaging — MRE, not CT, when the question is extent", html:"MR enterography (MRE) is the gold standard for small-bowel Crohn's extent and activity: no ionising radiation (decisive in a patient who will be imaged repeatedly for life), superior characterisation of mural thickening, enhancement and T2 mural signal, better detection of fistulae and perienteric inflammation. Limitations: <b>45&ndash;60 minutes</b>, bowel preparation, and poor out-of-hours availability.<br>CT abdomen and pelvis is still the right test for suspected perforation, suspected abscess, suspected obstruction, or any unstable patient — and <b>where an abscess is suspected (no steroid until assessed)</b>. <b>Do not arrange CT or MRI from primary care for a routine flare</b> — gastroenterology arranges IBD-specific imaging; if you are requesting for stable outpatient assessment of extent, request MRE."},
         {tone:"purple", h:"NG12 slot <span class='tw'>Suspected cancer</span>", html:"Crohn's does not exempt a patient from the cancer pathway — it makes the thresholds harder to see. Colorectal cancer (CRC): a FIT result of ≥10 µg Hb/g → suspected cancer pathway referral; a rectal mass → consider referral without FIT; an abdominal mass, change in bowel habit, iron-deficiency anaemia or rectal bleeding → the FIT-guided pathway (NICE HTG690, formerly DG56), and a low FIT must not delay referral where clinical concern is strong. Unexplained anal mass or anal ulceration → consider a suspected anal cancer referral — directly relevant in perianal disease. Pancreatic: aged 60 and over with weight loss plus diarrhoea, back pain, abdominal pain, nausea, vomiting, constipation or new-onset diabetes → consider urgent direct-access CT (within 2 weeks). Use FIT per NICE NG12 and the local suspected colorectal cancer pathway. In known IBD a positive FIT may reflect inflammation and is not specific for cancer; <b>a negative FIT must not override persistent concerning symptoms, a mass, iron-deficiency anaemia or clinical concern</b>, and FIT does not replace IBD surveillance or specialist assessment. Thresholds restated in <a href='#refer'>Refer</a>.", src:"NICE NG12, updated April 2026"}
       ]}
     ]},
    {id:"nutrition", nav:"Nutrition", title:"Nutrition is treatment in Crohn's, not supportive care", sub:"Required. This is the section that separates Crohn's from UC: malnutrition is common in active disease, and in children feeding can itself induce remission.",
     blocks:[
       {b:"dl", rows:[
         ["Scale of the problem","Malnutrition affects about 65&ndash;75% of hospitalised Crohn's patients and about 20&ndash;30% of outpatients. Causes: reduced oral intake (pain, nausea, fear of eating), malabsorption (small-bowel disease, short bowel after resection), increased metabolic demand (inflammation, sepsis), and drug effects — methotrexate depletes folate; cholestyramine causes fat-soluble vitamin malabsorption."],
         ["Screen it formally","Assess weight trend, BMI, dietary intake and nutritional risk (MUST is one tool). Refer to the IBD dietitian with active disease, weight loss, anaemia, suspected malabsorption, obstruction-related dietary restriction or recurrent nutritional deficiency. Key investigations: <b>B12</b> (terminal ileal disease or resection), <b>iron and ferritin</b> (duodenal involvement), <b>vitamin D</b> (widespread), <b>zinc and selenium</b> (severe malabsorption), <b>albumin</b>."],
         ["Exclusive enteral nutrition (EEN)","Polymeric or semi-elemental formula as the sole source of nutrition for 6&ndash;8 weeks. <b>First-line induction therapy for active Crohn's in children</b> — preferred over prednisolone because steroids cause growth retardation by suppressing IGF-1 and reducing linear bone growth, whereas EEN promotes growth and achieves mucosal healing. <b>In adults, BSG 2025 finds insufficient evidence to recommend routine EEN</b> outside selected circumstances — a specialist and dietitian decision. The practical barrier is real: <b>1500&ndash;2500 kcal/day as formula for 6&ndash;8 weeks</b> requires motivation, dietitian support and family commitment; <b>NG tube feeding</b> is used where the volume cannot be taken orally. Named products: <b>Modulen IBD, Elemental 028, Ensure Plus</b>. Post-EEN, reintroduce normal diet over <b>2&ndash;4 weeks</b>."],
         ["Partial enteral nutrition (PEN)","600&ndash;1000 kcal/day of elemental or polymeric supplement alongside a normal diet — maintains remission and reduces relapse frequency."],
         ["Sip feeds","<b>Fortisip Compact Protein, Ensure Plus, Complan</b> — high-calorie polymeric sips, prescribable on FP10 for IBD with malnutrition under the <b>ACBS</b> list. Encourage <b>200 mL with meals and between meals</b> to hold weight when appetite is poor. <b>Dietitian referral via the IBD MDT</b> for bespoke support."],
         ["Micronutrient replacement","Use oral or intravenous iron, B12 replacement and vitamin D/calcium according to laboratory results, cause and local protocol. <b>B12:</b> terminal ileal disease or resection may impair absorption — choose replacement by cause, serum results and local protocol. <b>Iron:</b> ferritin rises with inflammation, so interpret it in context; <b>IV iron is preferred in several situations</b> — active disease, significant anaemia, or when oral iron is not tolerated or ineffective — otherwise oral iron (e.g. ferrous sulphate once daily or on alternate days). <b>Vitamin D 1000&ndash;2000 IU OD.</b> <b>Folic acid 5 mg</b> — mandatory with methotrexate, and where dietary intake is poor. <b>Calcium/vitamin D advice or supplementation with prolonged steroid courses when indicated.</b>"],
         ["Intravenous nutrition","<b>Total parenteral nutrition (TPN)</b> for severe malnutrition with intestinal failure, short bowel syndrome, or the perioperative setting — specialist gastroenterology or nutrition team only."]
       ]}
     ]},
    {id:"ladder", nav:"Treatment ladder", title:"Induction and maintenance", sub:"Required. Steroids induce; something else maintains. Every rung assumes the complication branch has already been cleared.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Induce", title:"Corticosteroid by disease site", when:"mild–moderate luminal Crohn's",
          html:"<b>No universal regimen:</b> if corticosteroids are prescribed, use the patient's gastroenterology/IBD flare plan or a locally agreed protocol, document the intended duration and taper, and arrange early review — failure to improve within a few days prompts specialist reassessment rather than dose escalation. <b>Do not start steroids if abscess, obstruction, perforation or uncontrolled infection is suspected.</b> Before prescribing: screen for infection and complications; check diabetes risk, blood pressure, mental health and osteoporosis risk; give steroid treatment information and an emergency steroid card where appropriate; never stop prolonged treatment abruptly. Every systemic course should trigger review of maintenance treatment; repeated courses need urgent steroid-sparing review. Check the prednisolone SPC for contraindications, interactions and adverse effects.<br><b>Budesonide</b> (specialist-directed) may be considered for mild-to-moderate disease of the distal ileum, ileocaecal region or right colon when systemic corticosteroids are unsuitable, declined or not tolerated (NICE NG129) — it is <b>less effective than systemic corticosteroids</b> and not for severe disease, obstruction, abscess or suspected penetrating disease. Check the formulation, licensed indication, course and taper in the current product information. Severe disease is managed in hospital.",
          splits:[
            {cond:"Selected mild–moderate ileocaecal", drug:"Budesonide (specialist-directed)", note:"When systemic steroids are unsuitable, declined or not tolerated. Less effective; not for severe, obstructing or penetrating disease. Course and taper per product information and local protocol."},
            {cond:"Moderate or extensive", drug:"Prednisolone per IBD flare plan / local protocol", note:"Intended duration and taper documented; early review. No mucosal-healing benefit — always plan the steroid-sparing step-up."},
            {cond:"Children and young adults", drug:"Exclusive enteral nutrition", note:"First-line induction in paediatric Crohn's (BSPGHAN) — avoids steroid growth retardation. 6–8 weeks, dietitian-led."}
          ]},
         {step:"Bone", title:"Bone and micronutrient protection", when:"with prolonged or repeated steroid courses",
          html:"For prolonged or repeated systemic corticosteroid exposure, assess fracture risk and provide calcium/vitamin D advice or supplementation when indicated. Consider DEXA and bisphosphonate treatment according to fracture risk, age, sex, renal function, pregnancy potential and local osteoporosis guidance — <b>do not automatically prescribe alendronate to every patient receiving steroids</b>. <b>Iron (oral or IV) per results and local protocol</b>; <b>B12 injection with terminal ileal disease or resection</b>; <b>vitamin D 1000&ndash;2000 IU/day</b>."},
         {step:"Maintain", title:"Thiopurine or methotrexate — steroid-sparing", when:"after remission is induced", fromLabel:"never maintain on steroids",
          html:"<b>Azathioprine 2&ndash;2.5 mg/kg/day</b> or <b>mercaptopurine 1&ndash;1.5 mg/kg/day</b> — <b>TPMT testing first</b>; specialist-initiated, then monitored per the local shared-care protocol. <b>Methotrexate</b> is a specialist-initiated option in selected patients, usually when thiopurines are unsuitable or not tolerated — not a routine GP-initiated treatment for Crohn's. Follow the specialist shared-care protocol for dose, folic acid, monitoring, contraception, pregnancy and infection risk.<br><b>Not 5-ASA: oral 5-ASA is NOT effective for Crohn's maintenance</b>, unlike UC — discontinue 5-ASA in any patient whose diagnosis has been revised from UC to Crohn's."},
         {step:"Biologic", title:"Anti-TNF and beyond", when:"moderate–severe or fistulising disease", fromLabel:"inadequate control or steroid dependence",
          html:"<b>Biologics and advanced therapies are initiated and reviewed by the IBD team</b> in line with current NICE technology appraisals, the Greater Manchester IBD high-cost-drug pathway, the product information and commissioning requirements (licensed indication, previous treatment exposure, objective active inflammation, infection screening). <b>Primary care should not independently initiate, switch, intensify or stop them.</b> Options include anti-TNF (infliximab, adalimumab), <b>vedolizumab</b> (gut-selective anti-integrin), <b>ustekinumab</b>, <b>risankizumab</b> and <b>upadacitinib</b> (for appropriately selected patients). Infliximab plus azathioprine outperformed either alone in selected biologic-naïve patients (SONIC); combination therapy is balanced against infection, lymphoma and other risks. Increasingly started early (&ldquo;top-down&rdquo;) in moderate&ndash;severe disease."},
         {step:"Perianal", title:"Fistulising perianal disease", when:"after drainage and IBD MDT assessment",
          html:"Managed through the IBD MDT: drain any abscess before advanced therapy; pelvic MRI and/or EUA according to urgency and local expertise; seton placement where the colorectal surgeon decides; then anti-TNF where indicated (specialist-led). Simple asymptomatic fistulas may not need immediate medical treatment. Fistula closure is achieved in roughly 50&ndash;70% with infliximab plus azathioprine (about <b>60&ndash;70% response</b> for perianal fistulae with infliximab), and anti-TNF shortens fistula healing time. <b>Adalimumab</b> is the alternative, and anti-TNF is maintained long-term for fistula control. Antibiotics may be used for sepsis or as a specialist bridge, but are not definitive treatment. <b>No prednisolone for perianal fistula — no benefit and a sepsis risk.</b> Surgical closure (<b>LIFT procedure, mucosal advancement flap</b>) is for simple low fistulae once inflammation is controlled."},
         {step:"Surgery", title:"When the answer is an operation", when:"stricture, abscess, fistula, refractory disease", danger:true,
          html:"70&ndash;80% of Crohn's patients need surgery within 20 years, and surgery is not curative — unlike in UC. <b>Ileocaecal resection</b> is the commonest elective operation; <b>stricturoplasty (Heineke-Mikulicz)</b> preserves length in multiple short strictures. <b>Post-resection remission is about 80% at 1 year.</b> Recurrence prevention: <b>smoking cessation above all</b>, then specialist-directed prophylaxis such as <b>metronidazole for 3 months</b> post-resection (ECCO 2024), and <b>azathioprine ± infliximab for high-risk patients</b> (smokers, perforating disease, ileocolonic resection)."}
       ]},
       {b:"warn", html:"<b>The prescribing errors that cause harm here.</b> TPMT deficiency (about 0.3% of the population) causes life-threatening myelosuppression with azathioprine — test before prescribing. <b>Avoid regular or high-dose NSAIDs where possible</b>, particularly in active disease or after previous NSAID-related symptoms; if one is clinically necessary, use the lowest effective dose for the shortest time and discuss with the IBD team when disease is active. <b>Avoid opioids where possible</b> — they worsen constipation, obscure obstruction and increase harm. Avoid loperamide and codeine in suspected obstruction or severe colitis. And <b>prednisolone does nothing for a fibrostenotic stricture</b> — it is only effective for inflammatory disease."}
     ]},
    {id:"stricture", nav:"Strictures", title:"Stricturing disease — inflammatory or fibrotic?", sub:"Optional elsewhere; central in Crohn's. The distinction decides between a drug and a procedure.",
     blocks:[
       {b:"dl", rows:[
         ["How B2 presents","<b>Subacute obstruction: postprandial pain, bloating, nausea.</b> Not the same as an inflammatory flare, and not helped by the same treatment."],
         ["Make the distinction","<b>Inflammatory stricture</b> — active inflammation, responds to medical treatment. <b>Fibrostenotic stricture</b> — fibrosis, and <b>does not respond to steroids or biologics at all</b>. MRE separates them: wall enhancement plus T2 signal indicates an inflammatory component; fibrosis is T2 dark with no enhancement."],
         ["Treat accordingly","Inflammatory: specialist-led medical induction. Fibrotic: endoscopic balloon dilatation — for accessible strictures <b>&lt;4 cm (under 4 cm) without fistula or abscess</b> — <b>or surgical resection</b> (Heineke-Mikulicz stricturoplasty, or ileocolonic resection)."],
         ["Diet alongside","<b>Low-residue diet during active flare and in stricturing disease</b> reduces obstruction risk at stricture sites. <b>Avoid</b> raw vegetables with skins, seeds or husks, nuts, seeds, popcorn, high-fibre cereals, dried fruit and tough meat. <b>Allowed:</b> well-cooked soft vegetables, white bread, pasta and rice, eggs, soft fish, tender meat. B2 disease may need low-residue long-term; after resection reintroduce fibre gradually."]
       ]}
     ]},
    {id:"lifestyle", nav:"Lifestyle", title:"Lifestyle — quantified, and one item outranks the rest", sub:"Required. In Crohn's the highest-yield non-drug intervention has a larger effect than most of the drugs.",
     blocks:[
       {b:"tiles", v:"life", items:[
         {t:"🚭 Smoking cessation — the single most modifiable factor", html:"Smoking is associated with more active Crohn's disease, relapse, postoperative recurrence and surgery. Conversely to UC, where smoking is paradoxically protective, in Crohn's smoking is harmful. Offer evidence-based cessation support (NHS Stop Smoking Service) at every opportunity; combination NRT or varenicline is most effective."},
         {t:"🍽️ Low-residue diet when it is indicated", html:"During an active flare or in <b>stricturing (B2) disease</b> — reduces obstruction risk. Not a permanent restriction for everyone: it is targeted, and dietetic input keeps it nutritionally adequate."},
         {t:"🥤 Sip feeds and enteral supplements", html:"<b>Fortisip Compact Protein, Ensure Plus, Complan</b> on FP10 (<b>ACBS</b>) for IBD with malnutrition; <b>200 mL with meals and between meals</b>. Dietitian referral through the IBD MDT."},
         {t:"🧠 Psychological intervention", html:"Depression affects about 25% and anxiety about 30% of Crohn's patients — commonly quoted together as 30&ndash;40% overall. Distress is bidirectional: stress increases intestinal permeability, alters the microbiome and raises mucosal cytokine production. <b>CBT is an effective treatment for depression in IBD</b> and reduces disease-related anxiety and pain catastrophising; <b>NHS Talking Therapies</b> referral. <b>MBSR/mindfulness has RCT evidence for quality of life in IBD.</b> IBD-specific apps: <b>My IBD Coach, Flaredown</b>. <b>Fatigue is a dominant symptom</b> — refer for fatigue management where present."},
         {t:"🚫 NSAIDs and analgesia", html:"Avoid regular or high-dose NSAIDs where possible, especially in active disease or after previous NSAID-related symptoms; if needed, lowest dose for the shortest time, discussed with the IBD team when disease is active. Check OTC products. <b>Avoid opioids where possible</b> — constipation, obscured obstruction and harm. Avoid loperamide and codeine in suspected obstruction or severe colitis."},
         {t:"💉 Vaccination — before immunosuppression", html:"Check vaccination status at diagnosis and <b>before immunosuppression where feasible</b>. Use the <b>current UK Green Book and local programme</b> for pneumococcal, annual influenza, COVID-19, hepatitis B, HPV and recombinant zoster vaccination (non-live; eligibility depends on age and immunosuppression criteria). <b>Live vaccines are generally contraindicated during significant immunosuppression</b> — prednisolone ≥20 mg daily for at least 14 days is one commonly used threshold, and live-vaccine timing depends on the drug and treatment interruption, so discuss it with the IBD team. Schedules change: check the Green Book rather than relying on this page."},
         {t:"✈️ Travel", html:"Carry an adequate medication supply and a prescription letter — particularly for <b>biologics needing refrigeration and needles for customs</b>. Store biologics at 2&ndash;8°C, do not freeze; pens tolerate room temperature for up to 14 days (check the SmPC). Food and water hygiene matters: foodborne gastroenteritis can trigger a flare. Live travel vaccines (yellow fever, oral typhoid, BCG) are generally contraindicated during significant immunosuppression — discuss timing with the IBD team (Green Book); inactivated typhoid, hepatitis A and B and meningococcal are safe. Anti-malarials: doxycycline is safe; avoid mefloquine (may worsen GI symptoms); hydroxychloroquine is acceptable."},
         {t:"🌿 Cannabis — what to say", html:"About <b>30&ndash;40% of patients report having tried cannabis</b> for symptoms. Small trials show symptomatic benefit for pain and appetite but <b>no mucosal healing and no remission induction</b>, and <b>medical cannabis (Sativex, nabilone) is not licensed for IBD in the UK</b>. Counsel honestly: no disease-modifying benefit, <b>cannabinoids inhibit CYP3A4 and may alter drug levels</b>, and there is a risk of cannabis use disorder. It does not replace medical treatment."},
         {t:"🤝 Crohn's and Colitis UK", html:"Helpline <b>0300 222 5700</b> — diet, travel, work rights, stoma support, peer support, online forum, local groups and research trials."}
       ]}
     ]},
    {id:"special", nav:"Special groups", title:"Special groups", sub:"Optional. The groups where Crohn's management genuinely differs — and the prescribing safety duty that must be documented.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"Pregnancy, contraception and methotrexate", html:"Active disease itself is associated with poorer pregnancy outcomes, so plan pregnancy with the IBD team, make medication decisions with them, and <b>do not stop effective maintenance therapy without specialist advice</b>. Most Crohn's medications are compatible with pregnancy — <b>methotrexate is contraindicated</b> (a known teratogen). Follow the current product information and specialist advice for contraception and the pre-conception stopping interval for women and men, rather than a universal rule. Safeguards: a <b>negative pregnancy test before initiation</b> and <b>explicit counselling recorded</b> at shared-care reviews. Arrange <b>early MDT discussion for any pregnant patient</b>."},
         {tone:"blue", h:"Contraceptive choice in Crohn's", html:"Individualise contraception advice, particularly with malabsorption, severe diarrhoea or drug-specific pregnancy restrictions (e.g. methotrexate). Absorption of oral contraceptives may be reduced in severe small-bowel disease or diarrhoea; long-acting reversible contraception (LNG-IUD, implant) avoids that problem."},
         {tone:"cream", h:"Children and young people", html:"<b>EEN, not prednisolone, is first-line induction (BSPGHAN)</b> — steroids cause growth retardation through IGF-1 suppression, while EEN promotes growth and heals mucosa. Watch <b>growth failure</b> as a disease marker in its own right, and keep the dietitian central."},
         {tone:"cream", h:"After resection", html:"Endoscopic recurrence is about 70&ndash;80% at 1 year and clinical recurrence 30&ndash;40% within 2&ndash;3 years without preventive treatment. Risk factors: smoking (a key modifiable factor), perforating disease, multiple previous resections, involved (R1) margins. Colonoscopy at 6&ndash;12 months post-operatively grades recurrence by the Rutgeerts score: i0 no lesions; i1 ≤5 aphthous lesions; i2 &gt;5 aphthous lesions with normal intervening mucosa or lesions confined to the anastomosis; i3 diffuse aphthous ileitis with diffusely inflamed mucosa; i4 diffuse inflammation with large ulcers, nodules or strictures — i2 prompts step-up to a thiopurine or biologic, i3&ndash;i4 make a biologic essential. The GP's job is to reinforce cessation at every contact, ensure prophylaxis is actually prescribed, and make sure that colonoscopy is booked."},
         {tone:"cream", h:"L4 upper GI disease", html:"Oesophageal or gastroduodenal Crohn's adds a <b>proton pump inhibitor</b> to systemic treatment."},
         {tone:"cream", h:"Renal stones", html:"Crohn's raises <b>oxalate renal stone</b> risk — screen for stones as an IBD-related complication rather than treating each episode as unrelated colic."}
       ]}
     ]},
    {id:"monitor", nav:"Monitoring", title:"Monitoring, review rhythm and safety-netting", sub:"Monitoring is governed by the local shared-care protocol, the specific drug, the specialist team, the product information and renal function where relevant. Confirm local shared-care responsibilities and who acts on abnormal results (NICE QS81).",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["Flare response","<b>Early review per the flare plan</b> — a phone review within a few days (e.g. <b>48&ndash;72 hours</b>) catches the wrong diagnosis earlier; sooner if worsening","Clinical state, observations, CRP trend, weight, stool frequency and any stool results. Improving → taper as planned. Not clearly improving within a few days, or worsening → same-day specialist reassessment rather than dose escalation — a patient with an unrecognised abscess will get worse on steroids"],
         ["Face-to-face review","<b>1&ndash;2 weeks</b>","Clinical reassessment, weight, FBC + CRP; begin the taper if improving; ask again about perianal symptoms"],
         ["Mucosal healing","<b>Calprotectin at 6&ndash;8 weeks</b>","Confirms healing rather than symptom relief; discuss step-down with gastroenterology. <b>4&ndash;8 week post-flare review</b> covers nutrition and confirms the surveillance schedule"],
         ["Thiopurine / methotrexate","<b>Per the local shared-care protocol and product information for the specific drug</b> — FBC, LFTs and renal function where relevant","Cytopenia or hepatotoxicity → withhold and take specialist advice. TPMT before the first prescription"],
         ["Anti-TNF","<b>TB screen (IGRA) + hepatitis B surface antigen before initiation</b>; <b>monitoring per the specialist team and any shared-care protocol</b>","Fever on treatment = urgent review. <b>Drug levels and anti-drug antibodies are arranged and interpreted by gastroenterology if response is lost</b>"],
         ["Biologic drug monitoring (TDM)","When response is lost","Arranged and interpreted by gastroenterology. Assays, timing, disease phenotype and local protocols vary, so no universal numerical targets are given here. In general, low drug levels, anti-drug antibodies or adequate levels with ongoing inflammation lead to different specialist decisions (intensify, switch within class, or switch mechanism)"],
         ["Micronutrients","<b>B12 annually</b> with terminal ileal disease; <b>vitamin D annually</b>","Replace as under <a href='#nutrition'>Nutrition</a>; B12 deficiency causes irreversible neurological damage if left"],
         ["Bone","<b>Fracture-risk assessment with prolonged or repeated steroid exposure</b>","Calcium/vitamin D advice or supplementation when indicated; DEXA and bisphosphonate according to fracture risk, age, sex, renal function, pregnancy potential and local osteoporosis guidance — not automatic"],
         ["Steroid taper","Throughout","<b>Do not stop prolonged prednisolone abruptly — taper as documented in the flare plan.</b> Budesonide taper per the product information. <b>Unable to wean → urgent gastroenterology review</b> (steroid dependence)"]
       ]},
       {b:"timeline", items:[
         {n:"1", when:"48–72 hours", title:"Phone review", html:"Trajectory improving? New fever or worsening pain? <i>C. difficile</i> result back?"},
         {n:"2", when:"5–7 days", title:"Response check", html:"Clinical state, CRP, weight, stool frequency. <b>Not improving within a few days → specialist reassessment.</b>"},
         {n:"3", when:"1–2 weeks", title:"Face-to-face", html:"Reassess, start taper, check perianal symptoms."},
         {n:"4", when:"4–8 weeks", title:"Post-flare review", html:"Calprotectin, nutrition, mucosal-healing discussion, surveillance confirmed."},
         {n:"5", when:"Annually", title:"Structured IBD review", html:"Disease control, anaemia and iron status, renal function, monitoring bloods per shared care, medication adherence, immunisation and infection risk, pregnancy and contraception where relevant, mental health and fatigue, bone health, cancer surveillance, smoking, stoma and postoperative status, access to the IBD advice line, and renal-stone history."}
       ]},
       {b:"tiles", v:"safety", items:[
         {t:"🔴 999", html:"&ldquo;Severe tummy pain with vomiting, a swollen abdomen and no wind or stool — that could be a blockage. Go to A&amp;E.&rdquo; Also: peritonism, complete obstruction, haemodynamic compromise, high fever with colitis, severe perianal swelling or an abscess bursting."},
         {t:"🟠 Same-day GP", html:"&ldquo;If the pain gets worse despite the steroids, you develop a fever, you can't keep anything down, or you feel a new lump — contact us the same day.&rdquo; Jaundice too (possible PSC)."},
         {t:"🦠 On immunosuppression", html:"&ldquo;On azathioprine, methotrexate or a biologic, any fever or infection means contacting us — your body can't show infection normally. And check with us before any live vaccine.&rdquo;"},
         {t:"🚭 The cessation script", html:"&ldquo;Stopping smoking genuinely improves Crohn's — smoking is linked to more flares, more recurrence after surgery and more operations. It is one of the most powerful treatments you have, and it's the one I can't prescribe.&rdquo;"}
       ]},
       {b:"say", html:"&ldquo;There are two halves to this. The specialist team leads the medicines that keep the inflammation down — and we don't use steroids for that, because they don't heal the bowel and they cost you bone. My job is the bloods, your weight and vitamin levels, your vaccinations, and getting you seen quickly when something changes. If a flare isn't clearly improving within a few days of starting steroids, that isn't patience we need — it's a phone call.&rdquo;"}
     ]},
    {id:"surveillance", nav:"Surveillance", title:"Cancer surveillance in long-standing Crohn's", sub:"Required. Two different risks, two different programmes, and both are commonly forgotten in the shared-care gap.",
     blocks:[
       {b:"dl", rows:[
         ["Colonic Crohn's","For Crohn's disease involving the colon, ensure the patient is entered into the specialist colorectal surveillance pathway. <b>BSG 2025 recommends an initial risk-assessment colonoscopy around 8 years after symptom onset</b>, with surveillance based on risk factors (and possible review of surveillance in people close to population risk); NICE CG118 states 10 years. Follow the current local IBD surveillance pathway and specialist advice. Patients with PSC need earlier specialist surveillance. <b>Colorectal-cancer risk in Crohn's colitis is equivalent to UC.</b>"],
         ["Small-bowel Crohn's","Long-standing ileal (L1) disease carries an elevated small-bowel adenocarcinoma risk — but there is no established routine MRE surveillance programme. New, persistent or changing symptoms in long-standing small-bowel Crohn's — especially weight loss, anaemia, obstruction or a changed symptom pattern — need urgent specialist assessment and targeted imaging."],
         ["Lymphoma","Long-standing Crohn's plus thiopurine use carries roughly 4&ndash;5× the lymphoma risk. New unexplained lymphadenopathy, fever, night sweats or weight loss on immunosuppression is investigated, not observed (<a href='#refer'>Refer</a>)."],
         ["The GP's job","Ensure the <b>surveillance colonoscopy</b> programme exists and is booked. Surveillance is the item most often lost when a patient moves between hospital and primary care, or is discharged from follow-up."]
       ]}
     ]},
    {id:"loop", nav:"Not responding?", title:"Flare not settling? Escalate appropriately", sub:"Exclude complications and infection before assuming inflammatory relapse.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"1 \u00b7 Complication?", html:"Obstruction, abscess, fistula \u2192 urgent surgical/specialist assessment."},
         {tone:"amber", h:"2 \u00b7 Infection", html:"Exclude superimposed infection (incl. C. difficile)."},
         {tone:"amber", h:"3 \u00b7 Smoking", html:"Still smoking \u2014 re-offer cessation (disease-modifying)."},
         {tone:"blue", h:"4 \u00b7 Adherence", html:"Maintenance immunomodulator actually taken?"},
         {tone:"blue", h:"5 \u00b7 Escalate", html:"True active disease \u2192 specialist for steroid course / biologic / surgery."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — when to step beyond primary care", sub:"Required. Each tier with its explicit trigger, and the NG12 thresholds restated in full.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999 / immediate", html:"Peritonism or suspected perforation · shock or haemodynamic instability · severe gastrointestinal bleeding · complete bowel obstruction · severe sepsis · rapidly progressive abdominal distension and vomiting · perianal abscess with sepsis."},
         {tone:"red", h:"Same-day gastroenterology and colorectal surgery", html:"<b>Suspected intra-abdominal abscess or inflammatory mass — do NOT start prednisolone</b> · <b>suspected perianal abscess</b> (urgent colorectal assessment and drainage) · <b>suspected obstruction</b> · <b>fever on a biologic or immunomodulator</b> · inability to maintain oral hydration · persistent vomiting · severe pain · <b>significant new weight loss</b> · <b>new fistula</b> · <b>painful red eye or visual symptoms (same-day ophthalmology)</b> · jaundice."},
         {tone:"amber", h:"Urgent gastroenterology — within 5 days to a week", html:"Active flare with systemic features (raised CRP, weight loss) · <b>flare not clearly improving within a few days of oral steroids</b> (specialist reassessment, not dose escalation) · steroid-dependent disease (two or more courses a year, or relapse on tapering) · <b>suspected loss of biologic response</b> (drug-level testing arranged by gastroenterology) · <b>perianal fistula</b> (IBD MDT: pelvic MRI and/or EUA)."},
         {tone:"purple", h:"Suspected cancer pathway referral · NICE NG12 (updated April 2026)", html:"Crohn's has no cancer criterion of its own — but it sits on top of four NG12 routes, and the disease is what hides them.<br>· <b>Colorectal:</b> a <b>FIT result of ≥10 µg Hb/g</b> → suspected cancer pathway referral; a <b>rectal mass</b> → consider referral without FIT; an <b>abdominal mass</b>, change in bowel habit, <b>iron-deficiency anaemia</b> or rectal bleeding → the FIT-guided pathway (NICE HTG690, formerly DG56), and a low or unreturned FIT must not delay referral where clinical concern is strong. In known IBD a positive FIT may reflect inflammation and is not specific for cancer; a negative FIT must not override persistent concerning symptoms, a mass, iron-deficiency anaemia or clinical concern, and FIT does not replace IBD surveillance or specialist assessment.<br>· <b>Anal:</b> an unexplained anal mass or unexplained anal ulceration → consider a suspected anal cancer referral. This matters directly in perianal disease, where a chronic fistula or ulcer is easily attributed to Crohn's; <b>EUA also exists to exclude anorectal cancer</b>.<br>· <b>Pancreatic:</b> aged 60 and over with weight loss plus diarrhoea, back pain, abdominal pain, nausea, vomiting, constipation or new-onset diabetes → consider urgent direct-access CT (within 2 weeks); jaundice aged 40 and over → suspected cancer pathway referral.<br>· <b>Haematological:</b> unexplained lymphadenopathy or splenomegaly, or fever, night sweats and weight loss on a thiopurine or anti-TNF → very urgent FBC and haematology assessment for lymphoma (<b>4&ndash;5× risk</b>).", src:"NICE NG12 (updated April 2026)"},
         {tone:"amber", h:"Urgent gastroenterology referral (local pathway) · small bowel", html:"NICE NG12 has no small-bowel criterion, so this is an urgent specialist referral, not a suspected cancer pathway referral.<br>· <b>Small bowel:</b> long-standing small-bowel Crohn's with new, persistent or changing symptoms — especially weight loss, anaemia, obstruction or a changed symptom pattern → urgent referral to gastroenterology (local pathway) for suspected small-bowel adenocarcinoma or lymphoma; the specialist arranges targeted imaging. CEA and CA19-9 are not validated screening tests for this. The rule: a new symptom pattern in long-standing Crohn's is a work-up, not a flare.", src:"House rule (no NG12 criterion)"},
         {tone:"blue", h:"Colorectal surgery", html:"Perianal disease — fistula-in-ano assessment by colorectal surgery combined with gastroenterology (MRI pelvis and <b>EUA with flexible sigmoidoscopy</b> — which also exists to classify the fistula accurately and exclude anorectal cancer; seton placement as decided by the colorectal surgeon, biologics, or combined therapy; consider rectal inflammation and STI where relevant) · <b>stricture causing recurrent obstruction</b> · stricturing or obstructive disease generally."},
         {tone:"cream", h:"Dietitian — earlier than most GPs refer", html:"<b>Every patient with active disease and weight loss.</b> Also refer with anaemia, suspected malabsorption, obstruction-related dietary restriction or recurrent nutritional deficiency. Exclusive enteral nutrition is first-line for inducing remission in paediatric Crohn's; in adults it is used only in selected circumstances (BSG 2025)."},
         {tone:"cream", h:"Routine, and what primary care keeps", html:"<b>Routine gastroenterology</b> for the annual IBD review if not already established, escalation planning, and colonoscopic surveillance. <b>Primary care keeps:</b> smoking cessation, drug monitoring bloods (per the local shared-care protocol), micronutrient replacement and bone health, vaccination, mental-health support, contraception and pregnancy planning, and the flare triage that decides which of the tiers above applies. <b>Signpost Crohn's and Colitis UK (helpline 0300 222 5700)</b> for diet, travel, work rights and stoma support."}
       ]},
       {b:"say", html:"<b>To the patient:</b> &ldquo;I'm arranging an urgent scan rather than more steroids, because the pattern you're describing needs a look before we treat it.&rdquo; <b>In the referral:</b> state the Montreal phenotype, current maintenance therapy and doses, observations, the HBI if used, CRP, calprotectin and weight trend, whether stool culture and <i>C. difficile</i> have been sent, and explicitly whether an abscess has been excluded — that last line is what determines how the patient is triaged."}
     ]},
    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card. The full teaching case lives in the Casebook and is not duplicated here.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 28-year-old with ileocolonic Crohn's, on azathioprine, presents with a week of worsening right-sided abdominal pain, loose stools and feeling &ldquo;shivery&rdquo;. She has had two steroid courses this year and opens with: &ldquo;Can you just do me some prednisolone like last time? I know my own flares.&rdquo; The challenge is that the fever and localised tenderness make an abscess possible — the right answer is the one she has not asked for."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"<b>Data gathering:</b> fever, localised mass, weight, perianal symptoms, adherence, smoking, NSAID use, and the phenotype. <b>Clinical management:</b> stool for <i>C. difficile</i> and culture, bloods and calprotectin, and the explicit decision not to prescribe a steroid until an abscess is excluded, with same-day imaging or gastroenterology contact. <b>Relationship:</b> declining a specific request without losing the alliance — explaining that steroids would make an abscess worse, while acknowledging that she does know her own disease. <b>Holistic:</b> steroid dependence at two courses a year is itself a referral trigger; smoking cessation support; fracture-risk assessment. <b>Safety-netting:</b> early review within a few days with explicit same-day and 999 triggers. <a href='../../cases/crohns.html'>Open the full casebook chapter →</a>"}
     ]}]},
    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Each source traceable to the recommendations it supports.",
     blocks:[
       {b:"cards", items:[
         {tone:"blue", h:"Primary guidance", html:"<b>NICE NG129 — Crohn's disease: management (2019):</b> induction and maintenance, steroid and steroid-sparing strategy, the 5-ASA position, escalation and surgery. <b>NICE CG118 (2011):</b> colonoscopic surveillance intervals and risk stratification in IBD. <b>NICE NG12 — Suspected cancer: recognition and referral (updated April 2026):</b> the colorectal, anal, pancreatic and haematological thresholds restated in <a href='#refer'>Refer</a>. <b>NICE QS81 — Inflammatory bowel disease quality standard:</b> clear shared-care arrangements, referral routes and nominated clinicians responsible for acting on abnormal monitoring results. <b>NICE HTG690:</b> quantitative FIT to guide colorectal referral. NICE CG118 states a 10-year surveillance start; NG129 limits budesonide to selected ileocaecal disease."},
         {tone:"blue", h:"Specialist standards and evidence", html:"<b>BSG guidelines on inflammatory bowel disease in adults (2025, Gut)</b> — stool testing, vaccination, EEN in adults, perianal MDT management and drainage before advanced therapy. <b>BSG guidelines on colorectal surveillance in IBD (2025, Gut)</b> — risk-assessment colonoscopy around 8 years after symptom onset. <b>ECCO Guidelines on Therapeutics in Crohn's Disease: Medical Treatment and Surgical Treatment (2024)</b> — limiting systemic steroid courses, methotrexate position, surgery. <b>GMMMG High Cost Drug Pathways for IBD in adults</b> — local biologic and advanced-therapy pathway, including upadacitinib. <b>Current SPCs</b> for prednisolone and budesonide; <b>SPS corticosteroid monitoring</b>; the <b>UK Green Book</b> for vaccination. <b>ACPGBI</b> for the surgical limbs. <b>SONIC trial (NEJM 2010)</b> — combination infliximab plus azathioprine achieved corticosteroid-free remission in about <b>57%</b> at 26 weeks versus about <b>44%</b> with infliximab alone and about <b>30%</b> with azathioprine alone, in selected biologic-naïve patients — combination therapy must be balanced against infection, lymphoma and other risks. <b>Harvey &amp; Bradshaw</b> for the activity index; the <b>Montreal classification</b> for phenotype; the <b>Rutgeerts score</b> for post-operative recurrence. <b>ESPEN</b> and <b>BSPGHAN</b> for enteral nutrition. <b>NPSA</b> methotrexate safety alert (2006, once-weekly dosing). <b>BNF</b> for all immunosuppressant, corticosteroid and biologic dosing."},
         {tone:"blue", h:"Patient-facing", html:"<b>Crohn's and Colitis UK</b> (crohnsandcolitis.org.uk) — helpline <b>0300 222 5700</b>; diet, travel, work rights, stoma support, local groups and research trials. <b>My IBD Coach</b> and <b>Flaredown</b> for self-monitoring."}
       ]},
       {b:"warn", html:"<b>Scope.</b> This guide supports primary-care triage, monitoring and shared care. It does not replace the patient's gastroenterology flare plan, the local (Bolton/Greater Manchester) IBD pathway, product information or urgent hospital assessment. Biologics, immunomodulators, methotrexate and steroid-sparing treatment are initiated or changed only by the IBD team unless covered by a formal shared-care protocol. Verify any dose in the BNF and current SPC. Follow local IBD pathways and IBD nurse specialist protocols, which frequently define a patient-held rescue plan that supersedes generic advice."}
     ]}
  ],
