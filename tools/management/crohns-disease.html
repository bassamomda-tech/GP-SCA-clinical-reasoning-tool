  stemTitle:"Exclude the abscess before the prednisolone — and never let &ldquo;it's a flare&rdquo; be the whole diagnosis",
  stemSub:"One page for the whole condition. Crohn's is <b>transmural</b>, so complications — abscess, fistula, stricture, perforation — are the rule rather than the exception, and every one of them is made worse by the steroid that an unwary clinician reaches for first. Exclude sepsis and obstruction before inducing; send stool for culture and <i>C. difficile</i> toxin before you immunosuppress; grade with the <b>Harvey-Bradshaw Index</b>; know the <b>Montreal phenotype</b>, because location and behaviour — not symptom severity — decide whether the answer is a drug, a dilatation or an operation; use corticosteroids to induce remission and never to maintain it; and treat <b>smoking cessation as a prescription</b>, because in Crohn's (unlike UC) smoking is unambiguously harmful. NICE NG129 · CG118 / NG151 · BSG IBD standards 2019 · ECCO 2023.",

  lead:"<div class='mg-layers'><a href='#severe'><b>Complication first</b><small>CT before steroids</small></a><a href='#infection'><b>Exclude infection</b><small>Stool + C. difficile</small></a><a href='#confirm'><b>Phenotype decides</b><small>Montreal L + B</small></a><a href='#ladder'><b>Induce, then spare</b><small>Steroids never maintain</small></a></div>",
  quickSub:"If you read nothing else on this page, read these six cards. Every figure traces to the source cited under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Exclude an abscess before you prescribe prednisolone", html:"Roughly 15&ndash;20% of patients who look like a Crohn's flare have an underlying abscess or septic complication — higher in ileocolonic and post-surgical disease, and intra-abdominal abscess complicates up to <b>25%</b> of Crohn's over a lifetime. Steroids suppress the response to undrained sepsis, let the collection enlarge and can precipitate perforation. The flags: a localised mass (classically <b>right iliac fossa</b> in ileocolonic disease), <b>fever above 38.5°C</b>, <b>CRP above 100 mg/L</b>, or failure to respond to standard flare treatment. <b>CT abdomen and pelvis with IV contrast is the test</b> — it shows abscess, fistula, stricture and free perforation at once. Perforation, complete obstruction, massive haemorrhage or intra-abdominal sepsis with haemodynamic compromise → 999."},
    {tone:"amber", h:"Send stool before you immunosuppress", html:"Stool MC&amp;S plus <i>C. difficile</i> toxin PCR is mandatory in every flare, before steroids. Ask about travel, recent antibiotics and hospital contact. <b>Do not assume that a flare equals active Crohn's</b> — infective colitis frequently masquerades as relapse and changes the entire management. Then separate inflammation from the functional overlap: faecal calprotectin above 250 µg/g indicates active mucosal inflammation, while <b>calprotectin below 50 µg/g makes inflammation unlikely</b> — and about <b>30% of Crohn's patients have IBS-like functional symptoms</b>, in whom steroids buy side effects and no benefit."},
    {tone:"blue", h:"The Montreal phenotype decides the treatment, not the symptom score", html:"<b>Location:</b> L1 ileal (the commonest), L2 colonic, L3 ileocolonic (about <b>50%</b>), L4 upper GI; <b>&ldquo;p&rdquo;</b> is added for perianal disease (e.g. L3B3p). <b>Behaviour:</b> B1 inflammatory, B2 stricturing, B3 penetrating — and <b>behaviour escalates in roughly 20% of patients per decade</b>. B1 responds to drugs; B2 fibrostenotic disease does not respond to steroids or biologics at all and needs balloon dilatation or resection; B3 needs anti-TNF plus a thiopurine, and usually surgery. L4 disease adds a proton pump inhibitor to systemic treatment. Prescribing prednisolone for an obstructing fibrotic stricture is a common and futile error."},
    {tone:"plain", h:"Induce with a steroid; maintain with something else", html:"Mild&ndash;moderate luminal disease: prednisolone 40 mg OD for about 4 weeks, then taper by 5 mg a week — or <b>budesonide 9 mg OD</b> for ileal/right-sided disease only, where about <b>90% first-pass metabolism</b> buys fewer systemic effects at the cost of efficacy in extensive disease. Maintenance is azathioprine 2&ndash;2.5 mg/kg/day (or mercaptopurine 1&ndash;1.5 mg/kg/day) after TPMT testing, or methotrexate 25 mg SC weekly with folic acid 5 mg weekly, escalating to a biologic. <b>Oral 5-ASA is not effective maintenance in Crohn's</b> — unlike UC — so stop it if the diagnosis has been revised, and <b>never use steroids to maintain remission</b>."},
    {tone:"green", h:"Smoking cessation is the prescription with the largest effect", html:"Smokers with Crohn's have double the relapse rate, up to three times the need for surgical resection, more fistulising disease, more post-operative recurrence and a poorer response to biologics. In Crohn's, smoking is unambiguously harmful — the opposite of the UC paradox. Refer to the NHS Stop Smoking Service at <em>every</em> consultation; combination NRT or varenicline is most effective. After resection it is the single most impactful thing that prevents recurrence, ahead of any drug."},
    {tone:"purple", h:"Examine the perianal area, and do not let a flare explain weight loss", html:"Perianal Crohn's affects about 25&ndash;35% of patients (up to 50% over a lifetime) and is missed when nobody looks. A tender fluctuant perianal mass is an abscess needing same-day surgery and EUA — not a course of metronidazole. Separately: long-standing Crohn's plus thiopurine and anti-TNF carries roughly 4&ndash;5× the lymphoma risk, colonic Crohn's carries the same colorectal-cancer risk as UC, and small-bowel disease raises small-bowel adenocarcinoma risk. New weight loss, new anaemia or a changed symptom pattern is an investigation, not a flare — the NG12 thresholds are in <a href='#refer'>Refer</a>."}
  ],
  pathwaySub:"The whole consultation in five moves. Step 1 is tinted red because this is the point at which the wrong prescription causes harm.",
  pathway:[
    {title:"Complication before diagnosis", html:"Before anything else, ask whether this is an <b>abscess, perforation, obstruction or sepsis</b> rather than a flare — mass and fever, peritonism, colicky pain with vomiting and distension, NEWS2 ≥5. <b>CT abdomen and pelvis before any steroid.</b>", alert:true},
    {title:"Exclude infection, then quantify", html:"<b>Stool MC&amp;S + <i>C. difficile</i> toxin</b>, <b>FBC, CRP, ESR, albumin, U&amp;E, ferritin, B12, folate, vitamin D</b>, and <b>faecal calprotectin</b> where inflammatory-versus-functional is the question."},
    {title:"Grade it and place it", html:"<b>Harvey-Bradshaw Index</b> for activity, <b>Montreal L + B (± p)</b> for phenotype, weight and <b>MUST score</b> for nutrition. Ring the named <b>IBD nurse</b> — they hold the rescue protocol."},
    {title:"Induce, and fix the nutrition", html:"Prednisolone or budesonide by site, or <b>exclusive enteral nutrition</b> — first-line induction in children and a genuine adult option. Replace B12, iron and vitamin D; bone protection with repeated steroids."},
    {title:"Make maintenance real", html:"Steroid-sparing therapy with the IBD team, <b>smoking cessation as a treatment</b>, drug monitoring that primary care owns, vaccination before immunosuppression, and surveillance that is actually booked."}
  ],
  sections:[
    {id:"severe", nav:"Emergencies", title:"The complication branch — what must not be treated as a flare", sub:"Required reading before any prescription. Crohn's is transmural: the emergencies are surgical, and most of them are made worse by corticosteroids.",
     blocks:[
       {b:"warn", html:"Do NOT give prednisolone to a Crohn's patient with fever and abdominal pain until an abscess has been excluded on CT. Steroids mask the septic response, allow the collection to enlarge and can precipitate perforation. The same rule applies to a <b>perianal abscess</b>: it needs drainage and examination under anaesthesia, and <b>metronidazole alone without specialist input is not adequate treatment</b>."},
       {b:"cards", cols:2, items:[
         {tone:"red", h:"Intra-abdominal abscess or inflammatory mass", html:"Right iliac fossa mass with fever and tenderness in known ileocolonic Crohn's. Not a simple flare. Same-day hospital; CT abdomen + pelvis with contrast; IR-guided drainage or surgery; IV antibiotics. Do NOT give prednisolone without excluding abscess — it will worsen the infection. Suspect it at fever &gt;38.5°C, CRP &gt;100 mg/L, a palpable mass, or non-response to standard treatment."},
         {tone:"red", h:"Perforation / peritonitis", html:"Sudden severe generalised abdominal pain, peritonism with guarding and board-like rigidity, absent bowel sounds, free gas on AXR or CXR. Free perforation of a Crohn's segment is rare but rapidly fatal. <b>→ 999. Emergency laparotomy.</b>"},
         {tone:"red", h:"Mechanical small bowel obstruction", html:"Colicky pain, bilious vomiting, distension, absolute constipation, high-pitched bowel sounds — stricture in fibrostenotic Crohn's. <b>→ 999.</b> Nil by mouth, IV fluids, NG tube, VTE prophylaxis, AXR + CT abdomen, then surgical or endoscopic assessment (<b>endoscopic balloon dilatation versus resection</b>)."},
         {tone:"red", h:"Perianal abscess", html:"Perianal pain and swelling with a tender fluctuant mass, discharge and fever. Fistulising Crohn's. → Same-day colorectal surgery: EUA plus drainage plus loose seton placement, with MRI pelvis for fistula mapping. Antibiotics alone are inadequate and delay creates fistula-in-ano."},
         {tone:"red", h:"Haemodynamic instability or haemorrhage", html:"<b>PR bleeding with tachycardia or hypotension → 999</b> (GI haemorrhage). Sepsis or a toxic patient — NEWS2 ≥5, tachycardia, hypotension → admit, resuscitate, and treat in hospital with IV steroids, IV fluids and VTE prophylaxis, with imaging for complications and surgical review."},
         {tone:"red", h:"Fever on a biologic or immunosuppressant", html:"Opportunistic infection and sepsis. Patients on anti-TNF agents cannot mount a normal febrile or inflammatory response, so sepsis assessment is unreliable — check FBC urgently and review the same day."},
         {tone:"red", h:"Reactivation tuberculosis on anti-TNF", html:"Fever, productive cough, weight loss and night sweats in a patient on infliximab or adalimumab. → Same-day chest medicine and the TB team; CXR + sputum AFB; stop the anti-TNF immediately; standard four-drug TB treatment. This is why IGRA and hepatitis B surface antigen are checked before anti-TNF is started."},
         {tone:"amber", h:"Severe weight loss", html:"<b>Loss of &gt;10% of body weight in 3 months</b> — malnutrition, malabsorption or active disease. <b>→ Same-day gastroenterology.</b> Do not attribute it to the flare until cancer and sepsis have been considered (<a href='#refer'>Refer</a>)."},
         {tone:"amber", h:"Ureteric colic in Crohn's", html:"Crohn's increases <b>oxalate renal stones</b> — sudden severe loin pain warrants <b>AXR and renal ultrasound</b> rather than being folded into the flare."},
         {tone:"amber", h:"Jaundice or cholestatic LFTs", html:"<b>Primary sclerosing cholangitis</b> is predominantly associated with UC but occurs in Crohn's colitis — jaundice or abnormal LFTs prompt hepatology referral, not reassurance."}
       ]}
     ]},
    {id:"infection", nav:"Exclude infection", title:"Not every flare is a flare", sub:"Required. The single commonest way to harm a Crohn's patient in primary care is to immunosuppress an infection.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"Mandatory in every flare", html:"<b><i>C. difficile</i> toxin PCR</b> and <b>stool MC&amp;S</b> — before steroids, in every patient. Ask about <b>travel history, recent antibiotics</b> and hospital contact. <b>Do not assume flare = active Crohn's.</b>"},
         {tone:"amber", h:"Inflammation or function?", html:"<b>Faecal calprotectin &gt;250 µg/g</b> = active mucosal inflammation. <b>&lt;50 µg/g</b> = inflammation unlikely. About <b>30% of Crohn's patients carry IBS-like functional symptoms</b> during and after active disease — calprotectin prevents needless steroid exposure, and over-treating functional symptoms drives steroid dependency and osteoporosis."}
       ]},
       {b:"say", html:"&ldquo;Your symptoms are back, but before I give you steroids I need to be sure this is your Crohn's and not an infection on top of it — because the treatment for those two things is opposite. That's what the stool sample is for.&rdquo;"}
     ]},
    {id:"confirm", nav:"Grade &amp; phenotype", title:"Grading the flare and knowing the phenotype", sub:"Required. Activity score tells you how hard to treat; the Montreal phenotype tells you what to treat with.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"teal", h:"Harvey-Bradshaw Index — the bedside score", html:"<b>Components, each scored 0&ndash;4:</b> general wellbeing (0&ndash;4), abdominal pain (0&ndash;3), <b>number of liquid stools per day</b> (1 point per stool above normal), <b>abdominal mass</b> (0 none, 1 dubious, 2 definite, 3 tender), and <b>complications</b> — arthralgia, uveitis, erythema nodosum, aphthous ulcers, pyoderma gangrenosum, anal fissure, new fistula, abscess — <b>1 point each</b>.<br>Bands: 0&ndash;4 remission · 5&ndash;7 mild active · 8&ndash;16 moderate active · &gt;16 severe active. The HBI is deliberately simpler than the <b>CDAI</b>, which needs a 7-day symptom diary, and can be scored in primary care without laboratory data."},
         {tone:"teal", h:"What each band means for the GP", html:"The legacy GP-facing mapping, which the bands above refine: <b>HBI &lt;5</b> — localised symptoms, normal vitals, tolerating food → GP-led with budesonide or prednisolone. <b>HBI 5&ndash;7</b> — significant symptoms with some systemic upset → oral prednisolone, with <b>gastroenterology advice within 48&ndash;72 hours</b>. <b>HBI &gt;8</b> — high stool frequency, fever, significant pain, unable to eat → <b>same-day hospital admission</b> for IV treatment. <b>Mild GP-managed flare</b> means HBI 5&ndash;7, no fever, no mass and calprotectin &lt;500 µg/g."}
       ]},
       {b:"dl", rows:[
         ["Montreal location","<b>L1 ileal</b> (most common) · <b>L2 colonic</b> · <b>L3 ileocolonic</b> (about <b>50%</b> of patients) · <b>L4 upper GI</b> (oesophageal, gastroduodenal). Modifier <b>&ldquo;p&rdquo;</b> is added where perianal disease is present, e.g. <b>L3B3p</b>."],
         ["Montreal behaviour","<b>B1 inflammatory</b> (non-penetrating, non-stricturing) · <b>B2 stricturing</b> (fibrostenotic — obstruction risk) · <b>B3 penetrating</b> (fistulae, abscesses). <b>Behaviour escalates in roughly 20% of patients per decade</b>, so the phenotype recorded at diagnosis is not necessarily today's."],
         ["Phenotype → management","B1 = medical therapy. B2 = endoscopic balloon dilatation or surgery. B3 = anti-TNF plus azathioprine, and usually surgery. L4 = proton pump inhibitor added to systemic treatment. A stricturing flare presenting with obstructive symptoms needs surgical assessment, not more steroid."],
         ["Perianal classification","<b>Simple low fistula</b> — intersphincteric or transsphincteric below the dentate line; lower incontinence risk with treatment. <b>Complex fistula</b> — high transsphincteric, suprasphincteric, multiple tracts, rectovaginal, or with abscess; aggressive surgery risks faecal incontinence. <b>MRI pelvis is the gold standard for fistula mapping.</b>"],
         ["Crohn's or UC?","<b>Crohn's:</b> skip lesions, right-iliac-fossa predominance, perianal disease, mouth ulcers, weight loss, diarrhoea often without rectal bleeding. <b>UC:</b> continuous colonic disease from the rectum, predominantly rectal bleeding. Colicky pain suggests obstruction; continuous pain suggests inflammation or abscess."],
         ["Current therapy","Establish exactly what maintenance the patient is on — azathioprine, mercaptopurine, methotrexate, or a biologic (infliximab, adalimumab, vedolizumab, ustekinumab, risankizumab) — because it changes both the differential and the escalation route."],
         ["Contact the IBD nurse","Most patients have a <b>named IBD nurse specialist</b> who knows the phenotype, the baseline and the rescue protocol. <b>Contact them before GP-led escalation</b> — they can activate rescue protocols and arrange urgent review, and a five-minute call prevents both unnecessary appointments and unnecessary admissions."]
       ]}
     ]},
    {id:"exam", nav:"Examination", title:"Targeted examination", sub:"Optional elsewhere; not here. In Crohn's the examination finds the complication, and the perianal inspection is the part most often skipped.",
     blocks:[
       {b:"table", head:["What","Why it changes the plan"], rows:[
         ["Vital signs","Temperature, HR, BP. Tachycardia with fever means abscess or infection until proven otherwise. Postural hypotension indicates significant dehydration."],
         ["Weight and nutrition","Weight against baseline, BMI, <b>mid-arm circumference</b>, muscle wasting, oedema (hypoalbuminaemia). <b>MUST score at every contact.</b>"],
         ["Abdomen","<b>RIF mass or tenderness</b> — inflamed terminal ileum, abscess, or rarely cancer. Obstruction signs: distension, tinkling bowel sounds, visible peristalsis. Diffuse tenderness suggests colonic disease."],
         ["Perianal — always","Inspect for <b>oedematous fibrotic skin tags</b> (typical of Crohn's), <b>fissures — off-midline suggests Crohn's, midline is idiopathic</b>, external fistula openings with discharge, and a <b>fluctuant tender abscess</b>. Perianal disease can be the presenting feature and a major source of morbidity."],
         ["Mouth","<b>Aphthous ulcers parallel gut activity</b> and are a quick marker of flare severity; angular cheilitis suggests iron deficiency, glossitis B12 or folate deficiency."],
         ["Extra-intestinal","Peripheral arthropathy (large-joint arthritis) versus axial spondyloarthritis, erythema nodosum (painful red shin nodules), <b>pyoderma gangrenosum</b>, and <b>uveitis — a red painful eye is same-day ophthalmology</b>."]
       ]},
       {b:"warn", html:"<b>A palpable RIF mass in Crohn's must not be assumed to be a flare.</b> It may be an abscess, an inflammatory mass, or — in long-standing disease — a cancer."}
     ]},
    {id:"workup", nav:"Work-up", title:"Investigations — and which imaging to ask for", sub:"Required. What every flare gets, what the drug monitoring adds, and the imaging rule that keeps radiation off a young patient's lifetime dose.",
     blocks:[
       {b:"cards", items:[
         {tone:"plain", h:"Bloods — every flare", html:"<b>FBC · CRP · ESR · albumin · U&amp;E · LFTs · ferritin · B12 · folate</b> — inflammatory burden plus nutritional status. <b>B12 specifically where there is terminal ileal disease or resection</b>; <b>iron and ferritin</b> (duodenal involvement); <b>zinc and selenium</b> in severe malabsorption; <b>albumin</b> is both a nutritional and an inflammatory marker."},
         {tone:"plain", h:"Stool — every flare", html:"<b><i>C. difficile</i> toxin PCR + MC&amp;S.</b> <b>Faecal calprotectin</b> where the question is inflammatory versus functional (&gt;250 µg/g active; &lt;50 µg/g unlikely; &lt;500 µg/g is part of the mild-GP-managed definition)."},
         {tone:"plain", h:"Vitamin D and bone", html:"<b>Vitamin D deficiency is present in up to 70% of Crohn's patients</b> because of malabsorption, and is associated with more severe activity and higher fracture risk. <b>Supplement if below 50 nmol/L.</b> DEXA if cumulative steroid exposure is significant (more than 3 months equivalent) or after a fragility fracture — arranged by the GP or gastroenterology."},
         {tone:"plain", h:"Drug monitoring", html:"On <b>azathioprine or methotrexate: FBC + LFTs</b>. On a biologic: <b>trough drug level plus anti-drug antibody testing</b>, arranged by gastroenterology (see <a href='#monitor'>Monitoring</a>)."},
         {tone:"blue", h:"Imaging — MRE, not CT, when the question is extent", html:"MR enterography (MRE) is the gold standard for small-bowel Crohn's extent and activity: no ionising radiation (decisive in a patient who will be imaged repeatedly for life), superior characterisation of mural thickening, enhancement and T2 mural signal, better detection of fistulae and perienteric inflammation. Limitations: <b>45&ndash;60 minutes</b>, bowel preparation, and poor out-of-hours availability.<br>CT abdomen and pelvis is still the right test for suspected perforation, suspected abscess, suspected obstruction, or any unstable patient — and <b>before prednisolone where abscess is possible</b>. <b>Do not arrange CT or MRI from primary care for a routine flare</b> — gastroenterology arranges IBD-specific imaging; if you are requesting for stable outpatient assessment of extent, request MRE."},
         {tone:"purple", h:"NG12 slot <span class='tw'>2WW</span>", html:"Crohn's does not exempt a patient from the cancer pathway — it makes the thresholds harder to see. An abdominal mass consistent with colorectal cancer (CRC), unexplained rectal bleeding at 50+, unexplained iron-deficiency anaemia, or a change in bowel habit at 60+ → urgent suspected cancer referral. Unexplained anal mass or anal ulceration → suspected anal cancer referral — directly relevant in perianal disease. Unexplained weight loss with abdominal pain at 40+ → urgent direct-access CT within 2 weeks for pancreatic cancer. <b>FIT ≥10 µg Hb/g</b> is the colorectal direct-access threshold in the general population — but in known IBD a positive FIT reflects the inflammation and is not a discriminator, so it must never be used to reassure. Thresholds restated in <a href='#refer'>Refer</a>.", src:"NICE NG12, May 2025"}
       ]}
     ]},
    {id:"nutrition", nav:"Nutrition", title:"Nutrition is treatment in Crohn's, not supportive care", sub:"Required. This is the section that separates Crohn's from UC: malnutrition is near-universal in active disease, and feeding can itself induce remission.",
     blocks:[
       {b:"dl", rows:[
         ["Scale of the problem","Malnutrition affects about 65&ndash;75% of hospitalised Crohn's patients and about 20&ndash;30% of outpatients. Causes: reduced oral intake (pain, nausea, fear of eating), malabsorption (small-bowel disease, short bowel after resection), increased metabolic demand (inflammation, sepsis), and drug effects — methotrexate depletes folate; cholestyramine causes fat-soluble vitamin malabsorption."],
         ["Screen it formally","MUST score (Malnutrition Universal Screening Tool) at every Crohn's contact. Key investigations: <b>B12</b> (terminal ileal disease or resection), <b>iron and ferritin</b> (duodenal involvement), <b>vitamin D</b> (widespread), <b>zinc and selenium</b> (severe malabsorption), <b>albumin</b>."],
         ["Exclusive enteral nutrition (EEN)","Polymeric or semi-elemental formula as the sole source of nutrition for 6&ndash;8 weeks. <b>First-line induction therapy for active Crohn's in children</b> — preferred over prednisolone because steroids cause growth retardation by suppressing IGF-1 and reducing linear bone growth, whereas EEN promotes growth and achieves mucosal healing. In adults EEN induces remission in about 60&ndash;80% of active luminal Crohn's — equivalent to prednisolone, and about <b>80% of paediatric Crohn's</b> responds. <b>ESPEN:</b> consider EEN as an adjunct or alternative to prednisolone in adults, particularly in growth failure, steroid complications or malnutrition. The practical barrier is real: <b>1500&ndash;2500 kcal/day as formula for 6&ndash;8 weeks</b> requires motivation, dietitian support and family commitment; <b>NG tube feeding</b> is used where the volume cannot be taken orally. Named products: <b>Modulen IBD, Elemental 028, Ensure Plus</b>. Post-EEN, reintroduce normal diet over <b>2&ndash;4 weeks</b>."],
         ["Partial enteral nutrition (PEN)","600&ndash;1000 kcal/day of elemental or polymeric supplement alongside a normal diet — maintains remission and reduces relapse frequency."],
         ["Sip feeds","<b>Fortisip Compact Protein, Ensure Plus, Complan</b> — high-calorie polymeric sips, prescribable on FP10 for IBD with malnutrition under the <b>ACBS</b> list. Encourage <b>200 mL with meals and between meals</b> to hold weight when appetite is poor. <b>Dietitian referral via the IBD MDT</b> for bespoke support."],
         ["Micronutrient replacement","<b>Vitamin B12 1 mg IM every 3 months</b> where there is terminal ileal disease or resection — oral B12 is unreliable once the intrinsic-factor pathway is impaired. <b>Ferrous sulphate 200 mg BD</b> for iron deficiency, or <b>IV iron if intolerant or actively inflamed</b> (<b>iron infusion if ferritin &lt;30</b>, as oral iron is poorly tolerated in active disease). <b>Vitamin D 1000&ndash;2000 IU OD.</b> <b>Folic acid 5 mg</b> — mandatory with methotrexate, and where dietary intake is poor. <b>Calcium 1000 mg/day with vitamin D on corticosteroids.</b>"],
         ["Intravenous nutrition","<b>Total parenteral nutrition (TPN)</b> for severe malnutrition with intestinal failure, short bowel syndrome, or the perioperative setting — specialist gastroenterology or nutrition team only."]
       ]}
     ]},
    {id:"ladder", nav:"Treatment ladder", title:"Induction and maintenance", sub:"Required. Steroids induce; something else maintains. Every rung assumes the complication branch has already been cleared.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Induce", title:"Corticosteroid by disease site", when:"mild–moderate luminal Crohn's",
          html:"<b>Prednisolone 40 mg OD for 4 weeks, then taper by 5 mg a week</b> — bone protection if the cumulative course exceeds 3 months. <b>IMPORTANT: exclude abscess before steroids.</b><br><b>Budesonide 9 mg OD</b> for <b>ileal / right-sided (ileocaecal) disease only</b> — about <b>90% first-pass metabolism</b> means fewer systemic effects than prednisolone (less growth retardation, adrenal suppression and osteoporosis), but it is <b>less effective in extensive disease and ineffective in severe disease</b>. Course <b>8 weeks, up to 16 weeks</b>, then taper. Severe disease is admitted for <b>IV hydrocortisone</b>.",
          splits:[
            {cond:"Mild–moderate ileocolonic", drug:"Budesonide 9 mg OD", note:"8 weeks then taper. Topically active; fewer systemic effects. Preferred for mild–moderate ileocaecal disease."},
            {cond:"Moderate–severe or extensive", drug:"Prednisolone 40 mg OD", note:"Taper 5 mg/week after 2 weeks. Add bone protection. No mucosal-healing benefit — always plan the step-up."},
            {cond:"Children and young adults", drug:"Exclusive enteral nutrition", note:"First-line induction in paediatric Crohn's (BSPGHAN) — avoids steroid growth retardation. 6–8 weeks, dietitian-led."}
          ]},
         {step:"Bone", title:"Bone and micronutrient protection", when:"alongside every steroid course",
          html:"Alendronate 70 mg weekly plus calcium and vitamin D for anyone on steroids for more than 3 months. <b>Iron infusion if ferritin &lt;30</b>; <b>B12 injection with terminal ileal disease or resection</b>; <b>vitamin D 1000&ndash;2000 IU/day</b>."},
         {step:"Maintain", title:"Thiopurine or methotrexate — steroid-sparing", when:"after remission is induced", fromLabel:"never maintain on steroids",
          html:"<b>Azathioprine 2&ndash;2.5 mg/kg/day</b> or <b>mercaptopurine 1&ndash;1.5 mg/kg/day</b> — <b>TPMT testing first</b>, then FBC and LFT monitoring. <b>Methotrexate 25 mg SC weekly</b> — more effective than azathioprine in Crohn's on some comparative data, with <b>folic acid 5 mg weekly co-prescribed and contraception mandatory</b>. Also used for fistulating disease. Specialist-initiated, GP-monitored.<br><b>Not 5-ASA: oral 5-ASA is NOT effective for Crohn's maintenance</b>, unlike UC — discontinue 5-ASA in any patient whose diagnosis has been revised from UC to Crohn's."},
         {step:"Biologic", title:"Anti-TNF and beyond", when:"moderate–severe or fistulising disease", fromLabel:"inadequate control or steroid dependence",
          html:"Infliximab (biosimilars CT-P13 / SB2): 5 mg/kg IV at 0, 2 and 6 weeks, then every 8 weeks — combination with azathioprine is superior to either monotherapy (SONIC), because the thiopurine suppresses anti-drug antibody formation and keeps trough levels up. Adalimumab 160 mg SC loading, 80 mg at 2 weeks, then 40 mg every 2 weeks. <b>Vedolizumab</b> — gut-selective anti-integrin, preferred where infection risk, age or TB risk matter. <b>Ustekinumab</b> — anti-IL-12/23, for moderate&ndash;severe refractory disease and effective for skin and joint extra-intestinal manifestations. <b>Risankizumab</b> — anti-IL-23, newer, licensed 2023. Increasingly started early (&ldquo;top-down&rdquo;) in moderate&ndash;severe disease."},
         {step:"Perianal", title:"Fistulising perianal disease", when:"after EUA, seton and MRI mapping",
          html:"Infliximab 5 mg/kg IV at 0/2/6 weeks then 8-weekly after EUA + seton placement + MRI mapping. Fistula closure is achieved in roughly 50&ndash;70% with infliximab plus azathioprine (about <b>60&ndash;70% response</b> for perianal fistulae with infliximab), and anti-TNF shortens fistula healing time. <b>Adalimumab</b> is the alternative, and anti-TNF is maintained long-term for fistula control. <b>Metronidazole 400 mg TDS for 7&ndash;10 days</b> is a bridge only. <b>No prednisolone for perianal fistula — no benefit and a sepsis risk.</b> Surgical closure (<b>LIFT procedure, mucosal advancement flap</b>) is for simple low fistulae once inflammation is controlled."},
         {step:"Surgery", title:"When the answer is an operation", when:"stricture, abscess, fistula, refractory disease", danger:true,
          html:"70&ndash;80% of Crohn's patients need surgery within 20 years, and surgery is not curative — unlike in UC. <b>Ileocaecal resection</b> is the commonest elective operation; <b>stricturoplasty (Heineke-Mikulicz)</b> preserves length in multiple short strictures. <b>Post-resection remission is about 80% at 1 year.</b> Recurrence prevention: <b>smoking cessation above all</b>, then <b>metronidazole 400 mg TDS for 3 months</b> post-resection, and <b>azathioprine ± infliximab for high-risk patients</b> (smokers, perforating disease, ileocolonic resection)."}
       ]},
       {b:"warn", html:"<b>The prescribing errors that cause harm here.</b> TPMT deficiency (about 0.3% of the population) causes life-threatening myelosuppression with azathioprine — test before prescribing. <b>NSAIDs worsen Crohn's activity and trigger flares</b> — use paracetamol and audit every OTC medicine. <b>Strong opioids increase hospitalisation risk and mask obstruction</b> — avoid long-term. Antimotility drugs (loperamide, codeine) are unsafe in a severe colitic flare or suspected obstruction. And <b>prednisolone does nothing for a fibrostenotic stricture</b> — it is only effective for inflammatory disease."}
     ]},
    {id:"stricture", nav:"Strictures", title:"Stricturing disease — inflammatory or fibrotic?", sub:"Optional elsewhere; central in Crohn's. The distinction decides between a drug and a procedure.",
     blocks:[
       {b:"dl", rows:[
         ["How B2 presents","<b>Subacute obstruction: postprandial pain, bloating, nausea.</b> Not the same as an inflammatory flare, and not helped by the same treatment."],
         ["Make the distinction","<b>Inflammatory stricture</b> — active inflammation, responds to medical treatment. <b>Fibrostenotic stricture</b> — fibrosis, and <b>does not respond to steroids or biologics at all</b>. MRE separates them: wall enhancement plus T2 signal indicates an inflammatory component; fibrosis is T2 dark with no enhancement."],
         ["Treat accordingly","Inflammatory: prednisolone plus biologic induction. Fibrotic: endoscopic balloon dilatation — for accessible strictures <b>&lt;4 cm (under 4 cm) without fistula or abscess</b> — <b>or surgical resection</b> (Heineke-Mikulicz stricturoplasty, or ileocolonic resection)."],
         ["Diet alongside","<b>Low-residue diet during active flare and in stricturing disease</b> reduces obstruction risk at stricture sites. <b>Avoid</b> raw vegetables with skins, seeds or husks, nuts, seeds, popcorn, high-fibre cereals, dried fruit and tough meat. <b>Allowed:</b> well-cooked soft vegetables, white bread, pasta and rice, eggs, soft fish, tender meat. B2 disease may need low-residue long-term; after resection reintroduce fibre gradually."]
       ]}
     ]},
    {id:"lifestyle", nav:"Lifestyle", title:"Lifestyle — quantified, and one item outranks the rest", sub:"Required. In Crohn's the highest-yield non-drug intervention has a larger effect than most of the drugs.",
     blocks:[
       {b:"tiles", v:"life", items:[
         {t:"🚭 Smoking cessation — the single most modifiable factor", html:"Smokers with Crohn's have double the relapse rate, up to three times the need for surgical resection, higher post-surgical recurrence, more fistulising disease, and a reduced response to biological therapy. Conversely to UC, where smoking is paradoxically protective, in Crohn's smoking is unambiguously harmful. NHS Stop Smoking Service referral at every Crohn's consultation; combination NRT or varenicline is most effective."},
         {t:"🍽️ Low-residue diet when it is indicated", html:"During an active flare or in <b>stricturing (B2) disease</b> — reduces obstruction risk. Not a permanent restriction for everyone: it is targeted, and dietetic input keeps it nutritionally adequate."},
         {t:"🥤 Sip feeds and enteral supplements", html:"<b>Fortisip Compact Protein, Ensure Plus, Complan</b> on FP10 (<b>ACBS</b>) for IBD with malnutrition; <b>200 mL with meals and between meals</b>. Dietitian referral through the IBD MDT."},
         {t:"🧠 Psychological intervention", html:"Depression affects about 25% and anxiety about 30% of Crohn's patients — commonly quoted together as 30&ndash;40% overall. Distress is bidirectional: stress increases intestinal permeability, alters the microbiome and raises mucosal cytokine production. <b>CBT is NICE-recommended for depression in IBD</b> and reduces disease-related anxiety and pain catastrophising; <b>NHS Talking Therapies</b> referral. <b>MBSR/mindfulness has RCT evidence for quality of life in IBD.</b> IBD-specific apps: <b>My IBD Coach, Flaredown</b>. <b>Fatigue is a dominant symptom</b> — refer for fatigue management where present."},
         {t:"🚫 NSAIDs and analgesia", html:"NSAIDs worsen disease activity and trigger flares — paracetamol instead, and check every OTC product. <b>Strong opioids increase hospitalisation risk and mask obstruction.</b> Loperamide and codeine are unsafe in a severe colitic flare or suspected obstruction."},
         {t:"💉 Vaccination — before immunosuppression", html:"Check the full history at diagnosis and <b>catch up all outstanding vaccines before starting immunosuppressants</b>. <b>Avoid live vaccines</b> — MMR, yellow fever, BCG, live nasal influenza — on thiopurines, methotrexate or biologics. Safe: inactivated influenza (annual), pneumococcal (PCV20 / PPV23), Shingrix (non-live, and actively recommended on immunosuppression because shingles risk is raised), <b>hepatitis B screen</b>, and the autumn <b>COVID-19 booster</b>."},
         {t:"✈️ Travel", html:"Carry an adequate medication supply and a prescription letter — particularly for <b>biologics needing refrigeration and needles for customs</b>. Store biologics at 2&ndash;8°C, do not freeze; pens tolerate room temperature for up to 14 days (check the SmPC). Food and water hygiene matters: foodborne gastroenteritis can trigger a flare. Live travel vaccines are contraindicated on immunosuppression — no yellow fever, oral typhoid or BCG; inactivated typhoid, hepatitis A and B and meningococcal are safe. Anti-malarials: doxycycline is safe; avoid mefloquine (may worsen GI symptoms); hydroxychloroquine is acceptable."},
         {t:"🌿 Cannabis — what to say", html:"About <b>30&ndash;40% of patients report having tried cannabis</b> for symptoms. Small trials show symptomatic benefit for pain and appetite but <b>no mucosal healing and no remission induction</b>, and <b>medical cannabis (Sativex, nabilone) is not licensed for IBD in the UK</b>. Counsel honestly: no disease-modifying benefit, <b>cannabinoids inhibit CYP3A4 and may alter drug levels</b>, and there is a risk of cannabis use disorder. It does not replace medical treatment."},
         {t:"🤝 Crohn's and Colitis UK", html:"Helpline <b>0300 222 5700</b> — diet, travel, work rights, stoma support, peer support, online forum, local groups and research trials."}
       ]}
     ]},
    {id:"special", nav:"Special groups", title:"Special groups", sub:"Optional. The groups where Crohn's management genuinely differs — and the prescribing safety duty that must be documented.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"Pregnancy, contraception and methotrexate", html:"Most Crohn's medications are compatible with pregnancy — methotrexate is absolutely contraindicated. It is a known teratogen (neural tube defects, craniofacial and cardiac abnormalities) and embryotoxic. Stop methotrexate at least 3 months — some guidance advises 3&ndash;6 months — before conception, for men as well as women (it impairs spermatogenesis). The documented safeguards at every prescription review: <b>two forms of effective contraception</b> (e.g. COCP plus condom, or an IUS), a <b>negative pregnancy test before initiation</b>, and <b>explicit counselling recorded</b> that pregnancy is prohibited on MTX and for 3 months after stopping — an <b>NPSA patient-safety alert requirement</b> in shared care. Arrange <b>early MDT discussion for any pregnant patient</b>."},
         {tone:"blue", h:"Contraceptive choice in Crohn's", html:"The combined oral contraceptive may modestly increase Crohn's risk (meta-analysis RR about 1.5), possibly through oestrogen-mediated intestinal permeability, and absorption of low-dose pills may be reduced in severe small-bowel disease or diarrhoea. Long-acting reversible contraception (IUS, implant) avoids the absorption problem and carries no such association — usually the better choice, and it satisfies the methotrexate requirement."},
         {tone:"cream", h:"Children and young people", html:"<b>EEN, not prednisolone, is first-line induction (BSPGHAN)</b> — steroids cause growth retardation through IGF-1 suppression, while EEN promotes growth and heals mucosa. Watch <b>growth failure</b> as a disease marker in its own right, and keep the dietitian central."},
         {tone:"cream", h:"After resection", html:"Endoscopic recurrence is about 70&ndash;80% at 1 year and clinical recurrence 30&ndash;40% within 2&ndash;3 years without preventive treatment. Risk factors: smoking (doubles recurrence and is the single most impactful modifiable factor), perforating disease, multiple previous resections, involved (R1) margins. Colonoscopy at 6&ndash;12 months post-operatively grades recurrence by the Rutgeerts score: i0 no lesions; i1 ≤5 aphthous lesions; i2 &gt;5 aphthous lesions with normal intervening mucosa or lesions confined to the anastomosis; i3 diffuse aphthous ileitis with diffusely inflamed mucosa; i4 diffuse inflammation with large ulcers, nodules or strictures — i2 prompts step-up to a thiopurine or biologic, i3&ndash;i4 make a biologic essential. The GP's job is to reinforce cessation at every contact, ensure prophylaxis is actually prescribed, and make sure that colonoscopy is booked."},
         {tone:"cream", h:"L4 upper GI disease", html:"Oesophageal or gastroduodenal Crohn's adds a <b>proton pump inhibitor</b> to systemic treatment."},
         {tone:"cream", h:"Renal stones", html:"Crohn's raises <b>oxalate renal stone</b> risk — screen for stones as an IBD-related complication rather than treating each episode as unrelated colic."}
       ]}
     ]},
    {id:"monitor", nav:"Monitoring", title:"Monitoring, review rhythm and safety-netting", sub:"Required. Primary care owns most of this. Every row has an action threshold, not just a test.",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["Flare response","<b>Review 5&ndash;7 days after starting prednisolone</b> (a phone review at <b>48&ndash;72 hours</b> catches the wrong diagnosis earlier)","HBI score, CRP trend, weight, stool frequency, and the <i>C. difficile</i> result. Improving → taper as planned. Not improving or worsening → same-day gastroenterology — a patient with an unrecognised abscess will get worse on steroids"],
         ["Face-to-face review","<b>1&ndash;2 weeks</b>","HBI reassessment, weight, FBC + CRP; begin the taper if improving; ask again about perianal symptoms"],
         ["Mucosal healing","<b>Calprotectin at 6&ndash;8 weeks</b>","Confirms healing rather than symptom relief; discuss step-down with gastroenterology. <b>4&ndash;8 week post-flare review</b> covers nutrition and confirms the surveillance schedule"],
         ["Thiopurine / methotrexate","<b>FBC + LFTs 4-weekly for 3 months, then 3-monthly indefinitely</b>","Cytopenia or hepatotoxicity → withhold and take specialist advice. TPMT before the first prescription"],
         ["Anti-TNF","<b>TB screen (IGRA) + hepatitis B surface antigen before initiation</b>; <b>infliximab: FBC + LFTs 3-monthly</b>","Fever on treatment = urgent review. <b>Trough levels and anti-drug antibodies at infusion if response is lost</b>"],
         ["Biologic drug monitoring (TDM)","When response is lost","Target troughs: infliximab &gt;3 µg/mL at week 14 (before the 5th infusion) predicts sustained remission at 1 year; adalimumab &gt;5&ndash;8 µg/mL. The decision matrix: <b>low level + low/no antibodies → dose intensify</b> (shorten interval or raise dose); <b>low level + high antibodies → switch anti-TNF</b>; <b>adequate level + low antibodies → switch mechanism</b> (vedolizumab, ustekinumab) because the failure is pharmacodynamic, not pharmacokinetic"],
         ["Micronutrients","<b>B12 annually</b> with terminal ileal disease; <b>vitamin D annually</b>","Replace as under <a href='#nutrition'>Nutrition</a>; B12 deficiency causes irreversible neurological damage if left"],
         ["Bone","<b>DEXA at 2&ndash;3 years if steroid-exposed</b>, or after more than 3 months' cumulative exposure","Alendronate 70 mg weekly plus calcium and vitamin D"],
         ["Steroid taper","Throughout","<b>Do not stop prednisolone abruptly — wean by 5 mg a week.</b> Budesonide can be stopped more quickly because it acts topically. <b>Unable to wean → urgent gastroenterology review</b> (steroid dependence)"]
       ]},
       {b:"timeline", items:[
         {n:"1", when:"48–72 hours", title:"Phone review", html:"Trajectory improving? New fever or worsening pain? <i>C. difficile</i> result back?"},
         {n:"2", when:"5–7 days", title:"Response check", html:"HBI, CRP, weight, stool frequency. <b>Refer if not improving.</b>"},
         {n:"3", when:"1–2 weeks", title:"Face-to-face", html:"Reassess, start taper, check perianal symptoms."},
         {n:"4", when:"4–8 weeks", title:"Post-flare review", html:"Calprotectin, nutrition, mucosal-healing discussion, surveillance confirmed."},
         {n:"5", when:"Annually", title:"Structured IBD review", html:"Disease control, monitoring bloods, vaccination, bone health, osteoporosis DEXA, oxalate renal-stone screen, colorectal-cancer surveillance, smoking, adherence, mental health."}
       ]},
       {b:"tiles", v:"safety", items:[
         {t:"🔴 999", html:"&ldquo;Severe tummy pain with vomiting, a swollen abdomen and no wind or stool — that could be a blockage. Go to A&amp;E.&rdquo; Also: peritonism, complete obstruction, haemodynamic compromise, high fever with colitis, severe perianal swelling or an abscess bursting."},
         {t:"🟠 Same-day GP", html:"&ldquo;If the pain gets worse despite the steroids, you develop a fever, you can't keep anything down, or you feel a new lump — contact us the same day.&rdquo; Jaundice too (possible PSC)."},
         {t:"🦠 On immunosuppression", html:"&ldquo;On azathioprine, methotrexate or a biologic, any fever or infection means contacting us — your body can't show infection normally. And no live vaccines.&rdquo;"},
         {t:"🚭 The cessation script", html:"&ldquo;Stopping smoking genuinely improves Crohn's — it roughly halves your chance of a relapse and cuts your chance of needing an operation. It is one of the most powerful treatments you have, and it's the one I can't prescribe.&rdquo;"}
       ]},
       {b:"say", html:"&ldquo;There are two halves to this. The specialist team leads the medicines that keep the inflammation down — and we don't use steroids for that, because they don't heal the bowel and they cost you bone. My job is the bloods, your weight and vitamin levels, your vaccinations, and getting you seen quickly when something changes. If a flare doesn't settle within a week of starting steroids, that isn't patience we need — it's a phone call.&rdquo;"}
     ]},
    {id:"surveillance", nav:"Surveillance", title:"Cancer surveillance in long-standing Crohn's", sub:"Required. Two different risks, two different programmes, and both are commonly forgotten in the shared-care gap.",
     blocks:[
       {b:"dl", rows:[
         ["Colonic Crohn's","Extensive Crohn's colitis (L2 / L3) of more than 8 years' duration follows the same colorectal-cancer surveillance schedule as UC (NICE CG118 / NG151): colonoscopy every 1&ndash;3 years depending on risk stratification — some risk groups extend to 1&ndash;5-yearly per the same guidance. <b>Colorectal-cancer risk in Crohn's colitis is equivalent to UC.</b>"],
         ["Small-bowel Crohn's","Long-standing ileal (L1) disease carries an elevated small-bowel adenocarcinoma risk — MRE surveillance in long-standing ileal disease, and a low threshold for imaging when the symptom pattern changes."],
         ["Lymphoma","Long-standing Crohn's plus thiopurine use carries roughly 4&ndash;5× the lymphoma risk. New unexplained lymphadenopathy, fever, night sweats or weight loss on immunosuppression is investigated, not observed (<a href='#refer'>Refer</a>)."],
         ["The GP's job","Ensure the <b>surveillance colonoscopy</b> programme exists and is booked. Surveillance is the item most often lost when a patient moves between hospital and primary care, or is discharged from follow-up."]
       ]}
     ]},
    {id:"loop", nav:"Not responding?", title:"Flare not settling? Escalate appropriately", sub:"Exclude complications and infection before assuming inflammatory relapse.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"1 \u00b7 Complication?", html:"Obstruction, abscess, fistula \u2192 urgent surgical/specialist assessment."},
         {tone:"amber", h:"2 \u00b7 Infection", html:"Exclude superimposed infection (incl. C. difficile)."},
         {tone:"amber", h:"3 \u00b7 Smoking", html:"Still smoking \u2014 re-offer cessation (disease-modifying)."},
         {tone:"blue", h:"4 \u00b7 Adherence", html:"Maintenance immunomodulator actually taken?"},
         {tone:"blue", h:"5 \u00b7 Escalate", html:"True active disease \u2192 specialist for steroid course / biologic / surgery."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — when to step beyond primary care", sub:"Required. Each tier with its explicit trigger, and the NG12 thresholds restated in full.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999 / immediate", html:"Perforation · complete bowel obstruction · massive haemorrhage · intra-abdominal sepsis with haemodynamic compromise · perianal abscess with sepsis."},
         {tone:"red", h:"Same-day gastroenterology and colorectal surgery", html:"<b>Suspected intra-abdominal abscess — do NOT start prednisolone</b> · <b>perianal abscess</b> (drainage + EUA) · <b>mechanical obstruction from stricture</b> · <b>severe flare (HBI &gt;8), dehydration</b> · <b>immunosuppressed patient with fever</b> · <b>weight loss &gt;10% in 3 months</b> · <b>uveitis (same-day ophthalmology)</b>."},
         {tone:"amber", h:"Urgent gastroenterology — within 5 days to a week", html:"Active flare with systemic features (HBI &gt;8, CRP &gt;50, weight loss) · HBI &gt;8 with fever and CRP &gt;100 — abscess-exclusion CT before steroids · <b>moderate flare not responding to 3&ndash;5 days of oral steroids</b> · steroid-dependent disease (two or more courses a year, or relapse on tapering) · <b>suspected loss of biologic response</b> (drug level + anti-drug antibody testing) · <b>new fistula</b> · <b>perianal fistula</b> (MRI pelvis + anti-TNF planning)."},
         {tone:"purple", h:"Urgent suspected cancer <span class='tw'>2WW</span> · NICE NG12 (May 2025)", html:"Crohn's has no cancer criterion of its own — but it sits on top of four NG12 routes, and the disease is what hides them.<br>· <b>Colorectal:</b> an <b>abdominal mass consistent with colorectal cancer</b>, <b>unexplained rectal bleeding at 50 and over</b>, <b>unexplained iron-deficiency anaemia</b>, or an unexplained change in bowel habit at 60 and over → urgent suspected cancer referral. Direct-access <b>FIT at ≥10 µg Hb/g</b> is the threshold in the general population — but in known IBD a positive FIT reflects inflammation and is not a discriminator, so it can never be used to reassure.<br>· <b>Anal:</b> an unexplained anal mass or unexplained anal ulceration → suspected anal cancer referral. This matters directly in perianal disease, where a chronic fistula or ulcer is easily attributed to Crohn's; <b>EUA also exists to exclude anorectal cancer</b>.<br>· <b>Pancreatic:</b> unexplained weight loss with abdominal pain at 40 and over → urgent direct-access CT within 2 weeks.<br>· <b>Haematological:</b> unexplained lymphadenopathy or splenomegaly, or fever, night sweats and weight loss on a thiopurine or anti-TNF → very urgent FBC and haematology assessment for lymphoma (<b>4&ndash;5× risk</b>).<br>· <b>Small bowel:</b> known Crohn's with new weight loss, a changed symptom pattern, age over 50, anaemia, or raised CEA / CA19-9 → 2WW gastroenterology or oncology for small-bowel adenocarcinoma or lymphoma, with <b>CT staging, MR enterography and PET-CT</b>. The rule: a new symptom pattern in long-standing Crohn's is a work-up, not a flare.", src:"NICE NG12, May 2025 · house rule"},
         {tone:"plain", h:"Colorectal surgery", html:"Perianal disease — fistula-in-ano assessment by colorectal surgery combined with gastroenterology (MRI pelvis and <b>EUA with flexible sigmoidoscopy</b> — which also exists to classify the fistula accurately and exclude anorectal cancer; seton placement, biologics, or combined therapy) · <b>stricture causing recurrent obstruction</b> · stricturing or obstructive disease generally."},
         {tone:"plain", h:"Dietitian — earlier than most GPs refer", html:"<b>Every patient with active disease and weight loss.</b> Exclusive enteral nutrition is first-line for inducing remission in paediatric Crohn's and a valid option in adults — that referral is not optional supportive care, it is the treatment."},
         {tone:"plain", h:"Routine, and what primary care keeps", html:"<b>Routine gastroenterology</b> for the annual IBD review if not already established, escalation planning, and colonoscopic surveillance. <b>Primary care keeps:</b> smoking cessation, drug monitoring bloods, micronutrient replacement and bone health, vaccination, mental-health support, contraception and pregnancy planning, and the flare triage that decides which of the tiers above applies. <b>Signpost Crohn's and Colitis UK (helpline 0300 222 5700)</b> for diet, travel, work rights and stoma support."}
       ]},
       {b:"say", html:"<b>To the patient:</b> &ldquo;I'm arranging an urgent scan rather than more steroids, because the pattern you're describing needs a look before we treat it.&rdquo; <b>In the referral:</b> state the Montreal phenotype, current maintenance therapy and doses, the HBI, CRP, calprotectin and weight trend, whether stool culture and <i>C. difficile</i> have been sent, and explicitly whether an abscess has been excluded — that last line is what determines how the patient is triaged."}
     ]},
    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card. The full teaching case lives in the Casebook and is not duplicated here.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 28-year-old with ileocolonic Crohn's, on azathioprine, presents with a week of worsening right-sided abdominal pain, loose stools and feeling &ldquo;shivery&rdquo;. She has had two steroid courses this year and opens with: &ldquo;Can you just do me some prednisolone like last time? I know my own flares.&rdquo; The challenge is that the fever and localised tenderness make an abscess possible — the right answer is the one she has not asked for."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"<b>Data gathering:</b> fever, localised mass, weight, perianal symptoms, adherence, smoking, NSAID use, and the phenotype. <b>Clinical management:</b> stool for <i>C. difficile</i> and culture, bloods and calprotectin, and the explicit decision not to prescribe a steroid until an abscess is excluded, with same-day imaging or gastroenterology contact. <b>Relationship:</b> declining a specific request without losing the alliance — explaining that steroids would make an abscess worse, while acknowledging that she does know her own disease. <b>Holistic:</b> steroid dependence at two courses a year is itself a referral trigger; smoking cessation as treatment; bone protection. <b>Safety-netting:</b> the 48&ndash;72-hour and 5&ndash;7-day reviews with explicit same-day and 999 triggers. <a href='../../cases/crohns.html'>Open the full casebook chapter →</a>"}
     ]}]},
    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Each source traceable to the recommendations it supports.",
     blocks:[
       {b:"cards", items:[
         {tone:"plain", h:"Primary guidance", html:"<b>NICE NG129 — Crohn's disease: management (2019):</b> induction and maintenance, steroid and steroid-sparing strategy, the 5-ASA position, escalation and surgery. <b>NICE CG118 / NG151:</b> colonoscopic surveillance intervals and risk stratification. <b>NICE NG12 — Suspected cancer: recognition and referral (May 2025):</b> the colorectal, anal, pancreatic and haematological thresholds restated in <a href='#refer'>Refer</a>. <b>NICE NG129 — Crohn's disease (2019)</b> for the primary-care shared-care framing."},
         {tone:"plain", h:"Specialist standards and evidence", html:"<b>BSG IBD Standards / BSG guidelines on IBD in adults (2019)</b> — IBD nurse access, MDT composition, monitoring schedules. <b>ECCO Crohn's consensus guidelines (2023)</b> — severity, phenotype and escalation. <b>ACPGBI</b> for the surgical limbs. <b>SONIC trial (NEJM 2010)</b> — combination infliximab plus azathioprine achieved corticosteroid-free remission in about <b>57%</b> at 26 weeks versus about <b>44%</b> with infliximab alone and about <b>30%</b> with azathioprine alone, establishing combination therapy as standard unless contraindicated (TPMT deficiency, thiopurine intolerance, lymphoma history). <b>Harvey &amp; Bradshaw</b> for the activity index; the <b>Montreal classification</b> for phenotype; the <b>Rutgeerts score</b> for post-operative recurrence. <b>ESPEN</b> and <b>BSPGHAN</b> for enteral nutrition. <b>NPSA</b> methotrexate safety alert. <b>BNF</b> for all immunosuppressant, corticosteroid and biologic dosing."},
         {tone:"plain", h:"Patient-facing", html:"<b>Crohn's and Colitis UK</b> (crohnsandcolitis.org.uk) — helpline <b>0300 222 5700</b>; diet, travel, work rights, stoma support, local groups and research trials. <b>My IBD Coach</b> and <b>Flaredown</b> for self-monitoring."}
       ]},
       {b:"warn", html:"<b>Educational use only.</b> Doses are the named primary-care choices — verify every one in the BNF before prescribing. Follow local IBD pathways and IBD nurse specialist protocols, which frequently define a patient-held rescue plan that supersedes generic advice."}
     ]}
  ],
