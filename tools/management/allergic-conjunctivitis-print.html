<meta name="description" content="Allergic conjunctivitis in primary care: prominent itch, usually bilateral; minimum eye assessment; trigger reduction and cool compresses; sodium cromoglicate or olopatadine per the Greater Manchester formulary; oral antihistamines for coexisting rhinitis; no ocular steroids in primary care; referral of VKC and AKC." />

<script>
MG.render({
  icon:"👁️",
  title:"Allergic conjunctivitis — the complete guide",
  eyebrow:"Protocol · adults and children · itchy red eyes",
  stemTitle:"Prominent itching, usually in both eyes, with watery or stringy discharge — exclude corneal and intraocular disease, then reduce triggers and use topical anti-allergy drops",
  stemSub:"<b>Primary-care management of allergic conjunctivitis.</b> Most seasonal and perennial allergic conjunctivitis is benign and does not threaten vision. Severe, chronic or corneal-involving allergic keratoconjunctivitis can threaten vision. Allergic conjunctivitis is a diagnosis of exclusion: record visual acuity in each eye, pupils, cornea, pattern of redness, pain and photophobia, and contact-lens use before calling it allergy. Treat with trigger reduction and cool compresses, then a topical mast-cell stabiliser or antihistamine per the Greater Manchester formulary. Add an oral antihistamine when rhinitis coexists — not as automatic escalation for eye symptoms alone. <b>Do not start ocular corticosteroids for an undifferentiated red eye in primary care.</b>",
  guideline:"BSACI rhinitis guideline (2017) · BSACI/RCPath allergy testing in primary care (2025) · College of Optometrists CMG · Greater Manchester formulary (eye, respiratory) · ocular SPCs (sodium cromoglicate, Opatanol, Otrivine-Antistin) · SPS pregnancy guidance",
  reviewed:"25 September 2026",
  nextReview:"25 September 2027",
  meta:[
    {t:"No ocular steroids for an undifferentiated red eye", tone:"tw"},
    {t:"Cromoglicate first choice (GM formulary)", tone:"ok"},
    {t:"v2.1 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#assess"><b>Assess</b><small>Is it allergic?</small></a><a href="#drops"><b>Drops</b><small>Choosing safely</small></a><a href="#oral"><b>Oral</b><small>With rhinitis</small></a><a href="#severe"><b>VKC · AKC</b><small>Refer</small></a><a href="#refer"><b>Refer</b><small>When and where</small></a></div>',
  quickSub:"The five that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Same-day eye assessment", html:"Any reduction or change in vision · moderate or severe pain or photophobia · corneal opacity, infiltrate, ulcer or significant fluorescein staining · ciliary flush · fixed, irregular or abnormal pupil · marked unilateral redness · suspected herpetic keratitis · recent ocular surgery or trauma · suspected scleritis, uveitis, acute angle-closure glaucoma or orbital/periorbital cellulitis · a contact-lens wearer with <b>pain, photophobia, visual change, corneal staining or significant unilateral redness</b> (possible microbial keratitis) — stop lens wear and bring the lenses, case and solution. Contact-lens wear alone does not mandate same-day referral, but it does mandate lens removal, careful corneal assessment and a low threshold for same-day assessment if examination is limited or symptoms are atypical."},
    {tone:"green", h:"Itch, usually both eyes", html:"Prominent itching with watery or stringy discharge, chemosis and lid swelling, often with hay fever or atopy. Itch is not diagnostic on its own — blepharitis, dry eye and contact-lens problems itch too. Marked unilateral disease → reconsider the diagnosis. Allergic conjunctivitis is a diagnosis of exclusion: photophobia, visual reduction, ciliary injection, corneal opacity or significant pain should prompt reconsideration."},
    {tone:"green", h:"Topical drops, chosen safely", html:"<b>Sodium cromoglicate 2%</b> (Greater Manchester first choice) or <b>olopatadine</b> (alternative), selected for age, pregnancy, contact lenses and preservatives. Olopatadine is licensed for seasonal allergic conjunctivitis and its SPC advises avoidance in pregnancy and breastfeeding; cromoglicate is preferred if treatment is needed in pregnancy. Both contain benzalkonium chloride — consider preservative-free products with frequent use, dry eye or corneal disease."},
    {tone:"red", h:"⚠ No ocular steroids for an undifferentiated red eye", html:"Do not initiate ocular corticosteroids for an undifferentiated red eye in primary care. If severe allergic keratoconjunctivitis is suspected, corticosteroids should be prescribed only within an ophthalmology-led or locally agreed specialist pathway, with appropriate corneal assessment and intraocular-pressure monitoring. They can mask or worsen HSV, fungal, bacterial or acanthamoeba keratitis, raise intraocular pressure, cause cataract and delay healing."},
    {tone:"amber", h:"VKC and AKC can threaten sight", html:"Vernal keratoconjunctivitis (children and young people) and atopic keratoconjunctivitis (with chronic atopic dermatitis) → ophthalmology, especially with photophobia or corneal involvement. Photophobia in a child with presumed allergic conjunctivitis is not a routine feature to manage solely in primary care."}
  ],
  pathwaySub:"Six steps.",
  pathway:[
    {title:"Confirm the picture and check red flags", html:"Visual acuity in each eye, pupils, corneal clarity, laterality and pattern of redness, pain and photophobia, discharge, contact-lens history; fluorescein if pain, foreign-body sensation, trauma, contact-lens use or corneal disease is possible. If equipment or expertise is insufficient to exclude corneal or intraocular disease, arrange optometry/ophthalmology assessment rather than treating empirically as allergy.", alert:true},
    {title:"Self-care", html:"Practical trigger reduction, cool compresses, preservative-free lubricants if helpful, no rubbing, lenses out during active symptoms; pharmacy self-care for mild seasonal symptoms."},
    {title:"Topical therapy", html:"Cromoglicate or a topical antihistamine per the GM formulary and the patient's circumstances. For predictable seasonal symptoms, start regular treatment before or at the beginning of the allergen season."},
    {title:"Treat coexisting rhinitis", html:"Oral antihistamine or intranasal treatment when nasal symptoms are present; assess for asthma."},
    {title:"Persistent, severe or atypical", html:"Reconsider the diagnosis and refer; VKC, AKC, corneal involvement or steroid consideration → ophthalmology."},
    {title:"Allergy referral only when it changes management", html:"Troublesome symptoms despite optimised treatment with a relevant, confirmed allergen. Do not request total IgE or broad allergy panels routinely."}
  ],
  sections:[

    {id:"assess", nav:"Assess", title:"Step 1 — is it allergic?",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>Minimum assessment</b>","Document, where feasible: visual acuity in each eye separately · pupils, including an abnormal pupil or relative afferent pupillary defect · laterality and distribution of conjunctival injection · corneal clarity · pain and photophobia · discharge · contact-lens use · eyelid and periocular findings · anterior chamber appearance if possible · fluorescein staining if there is pain, foreign-body sensation, photophobia, contact-lens use, trauma or possible corneal disease. Fluorescein is not required for every mild, typical bilateral allergic presentation, but a normal-appearing cornea on casual inspection does not exclude keratitis"],
         ["<b>If examination is limited</b>","If the examination equipment or expertise is insufficient to exclude corneal or intraocular disease, arrange optometry/ophthalmology assessment rather than treating empirically as allergy"],
         ["<b>Typical features</b>","Prominent itch, usually both eyes; redness; watery or stringy discharge; lid swelling and chemosis; often with allergic rhinitis"],
         ["<b>Pattern</b>","Seasonal (pollen) or perennial (house-dust mite, animal dander)"],
         ["<b>Atopy</b>","Personal or family history of asthma, eczema or allergic rhinitis"],
         ["<b>Differentials</b>","Viral conjunctivitis · blepharitis · dry eye · toxic or medicamentosa conjunctivitis · giant papillary conjunctivitis (contact lenses) · keratitis · anterior uveitis · herpes simplex · acute angle closure. Allergic conjunctivitis is a diagnosis of exclusion — photophobia, visual reduction, ciliary injection, corneal opacity or significant pain should prompt reconsideration"]
       ]}
     ]},

    {id:"selfcare", nav:"Self-care", title:"Step 2 — self-care",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"🌼 Reduce triggers where practical", html:"Keep windows shut when pollen is high; shower and change after being outdoors; wraparound sunglasses. Target house-dust-mite measures where practical — evidence for individual avoidance measures is limited, so they should not replace effective treatment."},
         {tone:"green", h:"❄️ Comfort", html:"Cool compresses; preservative-free lubricant drops to dilute allergen if helpful; do not rub the eyes."},
         {tone:"blue", h:"👓 Contact lenses", html:"During active conjunctivitis, stop contact-lens wear until symptoms have resolved. A contact-lens wearer with pain, photophobia, reduced vision, marked redness or corneal staining requires same-day ophthalmic assessment for possible microbial keratitis — do not use contact lenses while awaiting assessment, and avoid simply prescribing topical antibiotics before assessment if keratitis is possible."},
         {tone:"blue", h:"🏪 Self-care prescribing", html:"Consider pharmacy self-care for uncomplicated mild seasonal symptoms. Follow the Greater Manchester formulary and local OTC and self-care prescribing policy."}
       ]}
     ]},

    {id:"drops", nav:"Drops", title:"Step 3 — topical drops, chosen safely",
     blocks:[
       {b:"table", head:["Drop","Dose","Notes"], rows:[
         ["<b>Sodium cromoglicate 2%</b> (mast-cell stabiliser) — GM first choice","1–2 drops in each affected eye up to four times daily","Licensed for prevention and treatment of acute, seasonal and perennial allergic conjunctivitis. For predictable seasonal symptoms, regular treatment before and throughout the relevant allergen season may improve control; follow the individual product information. Onset may be slower than a topical antihistamine. Contains benzalkonium chloride. Transient stinging or burning"],
         ["<b>Olopatadine 1 mg/mL</b> (dual-action antihistamine) — GM alternative","1 drop in each affected eye twice daily","Licensed for treatment of the ocular signs and symptoms of seasonal allergic conjunctivitis; use in perennial disease would require checking the indication of the specific product and may be off-label. From 3 years for the referenced product; continue for up to 4 months if needed. Contains benzalkonium chloride and phosphate buffer: the SPC warns of irritation, punctate or toxic keratopathy in dry-eye or compromised corneas, and very rarely corneal calcification in significantly damaged corneas"],
         ["<b>Contact lenses and preservatives</b>","Both","During active conjunctivitis, stop contact-lens wear until symptoms have resolved. Both contain benzalkonium chloride: remove soft lenses before instillation and wait at least 15 minutes before reinsertion. Neither preparation particularly \"suits\" contact-lens wearers. Consider preservative-free treatment where frequent or prolonged use is anticipated, particularly with dry eye, ocular-surface disease or several topical preparations"],
         ["<b>Pregnancy and breastfeeding</b>","Differs by product","Prefer non-pharmacological measures and consider sodium cromoglicate if treatment is required: it has reassuring cumulative experience but should be used when clearly indicated, particularly during the first trimester; seek product-specific advice during breastfeeding (excretion into milk is unknown). <b>Avoid olopatadine during pregnancy and breastfeeding</b> (Opatanol SPC: not recommended in pregnancy, should not be used in breastfeeding) unless specialist/product-specific advice supports its use. SPS supports a stepwise approach in pregnancy, with sodium cromoglicate, topical treatments, loratadine and cetirizine as options after individual risk–benefit assessment. Check the exact locally available product"],
         ["<b>Antazoline/xylometazoline</b> — short-term alternative only","Follow the current ocular SPC","Age 12 years and over; no more than 7 consecutive days; avoid prolonged use; avoid in contact-lens wearers, narrow-angle glaucoma and with MAOIs; check cardiovascular, thyroid, diabetes, urinary-retention and QT-risk cautions"],
         ["<b>Lubricant drops</b> — adjunct/self-care","As required","Prefer preservative-free with frequent use, dry eye or ocular-surface disease"],
         ["<b>Oral antihistamine</b> — for coexisting rhinitis, not isolated ocular failure by default","Age-, renal- and pregnancy-appropriate dose","Cetirizine may sedate some patients; counsel about driving"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"⚠ Antazoline/xylometazoline — short-term alternative only", html:"Antazoline 0.5% with xylometazoline 0.05% eye drops may provide rapid, short-term relief in adults and children aged 12 years and over. Use for <b>no longer than 7 consecutive days</b>, in accordance with the current ocular product information (Otrivine-Antistin SPC); avoid prolonged or repeated use because of rebound redness and ocular/systemic sympathomimetic effects. Check the current SPC before recommending — the MHRA Drug Safety Update on nasal xylometazoline/oxymetazoline does not set the ocular duration. Avoid in contact-lens wearers, narrow-angle glaucoma and with MAOIs. Caution in hypertension, cardiovascular disease, hyperthyroidism, diabetes, phaeochromocytoma, urinary retention and long-QT syndrome. Rebound redness, systemic sympathomimetic effects and drowsiness can occur. Not equivalent to cromoglicate or olopatadine as a general first-line option."},
         {tone:"red", h:"⚠ Ocular corticosteroids", html:"Do not initiate for an undifferentiated red eye in primary care. If severe allergic keratoconjunctivitis is suspected, corticosteroids should be prescribed only within an ophthalmology-led or locally agreed specialist pathway, with appropriate corneal assessment and intraocular-pressure monitoring."}
       ]}
     ]},

    {id:"oral", nav:"Oral", title:"Step 4 — treat coexisting rhinitis",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"When rhinitis coexists", html:"Treat associated allergic rhinitis with an oral antihistamine (for adults, <b>cetirizine or loratadine 10 mg once daily</b>) and/or intranasal treatment according to the severity and pattern of nasal symptoms, per the BSACI guideline. Oral antihistamines may improve ocular symptoms, but topical ocular treatment is generally more targeted for prominent eye symptoms. Assess asthma control if there is wheeze, cough, nocturnal symptoms or exercise-related respiratory symptoms."},
         {tone:"amber", h:"Not automatic escalation", html:"Persistent isolated eye symptoms despite appropriate topical treatment → review the diagnosis, adherence and contact-lens use, and consider referral, rather than adding an oral antihistamine by default."},
         {tone:"blue", h:"Cautions", html:"Cetirizine can cause drowsiness in some people — advise on driving and alcohol. Use age-specific dosing in children (BNF for Children); reduce the cetirizine dose where indicated in renal impairment; use caution in older adults and those at risk of sedation or falls; check pregnancy and breastfeeding advice for the product."}
       ]}
     ]},

    {id:"severe", nav:"VKC · AKC", title:"Severe forms — vernal and atopic keratoconjunctivitis",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"Vernal keratoconjunctivitis (VKC)", html:"Usually children or adolescents, often boys; severe recurrent itch, photophobia, thick ropy mucus, large upper-tarsal or limbal papillae, corneal involvement, recurrent seasonal symptoms → ophthalmology. <b>Photophobia in a child with presumed allergic conjunctivitis is not a routine feature to manage solely in primary care</b> — consider VKC or corneal involvement and seek ophthalmology advice."},
         {tone:"amber", h:"Atopic keratoconjunctivitis (AKC)", html:"Chronic or recurrent disease with atopic dermatitis, chronic lid eczema or blepharitis, usually in adolescents or adults; corneal involvement or visual symptoms → ophthalmology. Rubbing in chronic atopic disease is linked to keratoconus."}
       ]},
       {b:"why", html:"Not all chronic allergic conjunctivitis is sight-threatening — VKC and AKC may cause corneal ulceration, scarring and visual loss, and their management is specialist-led."}
     ]},

    {id:"refer", nav:"Refer", title:"Step 5 — review and referral",
     blocks:[
       {b:"table", head:["When","Situation","Action"], rows:[
         ["<b>Same day</b>","Any same-day feature in the quick answer","Local urgent eye pathway, eye casualty or ED"],
         ["<b>Self-care</b>","Mild, typical, self-limiting symptoms","Safety-net; review if not improving or recurrent"],
         ["<b>1–2 weeks</b>","New topical treatment with no clear improvement — sooner if worsening","Reassess: diagnosis, adherence, contact lenses, preservative exposure"],
         ["<b>Ophthalmology</b>","Suspected VKC or AKC · photophobia or corneal involvement · consideration of ocular corticosteroids · persistent or recurrent disease despite appropriate treatment · diagnostic uncertainty · contact-lens-related symptoms where keratitis cannot be confidently excluded","Per local pathway — not routine GP follow-up"],
         ["<b>Allergy</b>","Troublesome rhinitis or conjunctivitis despite optimised treatment · suspected occupational allergy · significant quality-of-life impact · allergen identification would change management","Do not request total IgE or broad inhalant screening panels routinely. Consider targeted serum-specific IgE only when the history suggests a relevant inhalant allergen and the result will alter avoidance advice, referral or specialist treatment. Refer to an appropriate allergy service when symptoms remain troublesome despite optimised treatment and there is a clinically relevant, objectively confirmed allergen; immunotherapy should not be initiated solely on the basis of a positive IgE test, and local commissioning arrangements (GM formulary specialist pathways) differ"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"Safety-net", html:"\"If the eye becomes painful or sensitive to light, your vision changes, the redness becomes marked or one-sided, or you wear contact lenses and develop pain or visual symptoms — get same-day eye assessment.\""},
         {tone:"cream", h:"GP management", html:"Assessment, self-care and safe drop choice belong here. Related pages: <a href='allergic-rhinitis.html'>allergic rhinitis</a> · <a href='dry-eye-disease.html'>dry eye disease</a> · <a href='blepharitis.html'>blepharitis</a> · <a href='uveitis.html'>uveitis</a>."}
       ]},
       {b:"say", html:"This looks like allergy in the eyes. Most eye allergy is not serious and does not threaten your sight. Cool compresses, not rubbing, and anti-allergy drops used regularly — before and throughout the pollen season if it's hay fever — usually settle it, plus a hay-fever tablet if your nose is affected too. Take contact lenses out while it's flared. If your eye becomes painful, sensitive to light, or your vision changes, get it checked the same day."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 12-year-old with asthma and eczema has itchy, sticky eyes every spring, now worse, with light sensitivity. His parent asks for the steroid drops a friend used."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Checks acuity and photophobia; recognises possible VKC; explains why steroid drops are not started in primary care; refers to ophthalmology; offers interim trigger reduction, cool compresses and cromoglicate with age and lens advice; asks about asthma control; safety-nets."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>BSACI guideline for the diagnosis and management of allergic and non-allergic rhinitis (Clin Exp Allergy 2017)</b><br><a href="https://doi.org/10.1111/cea.12953" rel="noopener">doi.org/10.1111/cea.12953</a><span class="rd"> — [Guideline] rhinoconjunctivitis, rhinitis treatment, asthma assessment and immunotherapy. Accessed and last checked 3 October 2026</span></li>'+
         '<li><b>BSACI / Royal College of Pathologists — guidance on laboratory allergy testing in primary care (2025)</b><br><a href="https://www.bsaci.org" rel="noopener">bsaci.org</a><span class="rd"> — [Guideline] allergy is primarily a clinical diagnosis; targeted, history-led testing only when the result will change management; no role for indiscriminate multiple-allergen screening. Accessed and last checked 3 October 2026</span></li>'+
         '<li><b>College of Optometrists — Clinical Management Guideline: allergic conjunctivitis</b><br><a href="https://www.college-optometrists.org/clinical-guidance/clinical-management-guidelines" rel="noopener">college-optometrists.org — clinical management guidelines</a><span class="rd"> — [Guideline] assessment and referral. Accessed and last checked 3 October 2026</span></li>'+
         '<li><b>DermNet — Allergic conjunctivitis</b><br><a href="https://dermnetnz.org/topics/allergic-conjunctivitis" rel="noopener">dermnetnz.org/topics/allergic-conjunctivitis</a><span class="rd"> — [Clinical reference] typical pattern, red-flag features prompting reconsideration, VKC and AKC complications. Accessed and last checked 3 October 2026</span></li>'+
         '<li><b>Specialist Pharmacy Service — Hay fever or allergic rhinitis: treatment during pregnancy</b><br><a href="https://www.sps.nhs.uk" rel="noopener">sps.nhs.uk</a><span class="rd"> — [Medicines guidance] stepwise approach in pregnancy; sodium cromoglicate, topical treatments, loratadine and cetirizine after individual risk–benefit assessment. Accessed and last checked 3 October 2026</span></li>'+
         '<li><b>Greater Manchester Medicines Management Group formulary — eye and respiratory chapters</b><br><a href="https://www.greatermanchesterformulary.nhs.uk" rel="noopener">greatermanchesterformulary.nhs.uk</a><span class="rd"> — [Local formulary] sodium cromoglicate 2% first choice; olopatadine and antazoline/xylometazoline alternatives; olopatadine up to 4 months; specialist allergen immunotherapy pathways. Accessed and last checked 3 October 2026</span></li>'+
         '<li><b>Opatanol 1 mg/mL eye drops SPC (PLGB 00101/1114)</b><br><a href="https://products.mhra.gov.uk" rel="noopener">products.mhra.gov.uk</a><span class="rd"> — [SPC] seasonal indication, age 3 years and over, dose, 4-month maximum, benzalkonium chloride and phosphate buffer, contact lenses (15 minutes), not recommended in pregnancy, not for use in breastfeeding. Accessed and last checked 3 October 2026</span></li>'+
         '<li><b>Sodium cromoglicate 2% w/v eye drops SPC (PL 15872/0010)</b><br><a href="https://products.mhra.gov.uk" rel="noopener">products.mhra.gov.uk</a><span class="rd"> — [SPC] indication, dose, benzalkonium chloride, contact lenses (15 minutes), pregnancy (clear need, caution in first trimester), breastfeeding and adverse effects. Accessed and last checked 3 October 2026</span></li>'+
         '<li><b>Otrivine-Antistin eye drops SPC (antazoline/xylometazoline)</b><br><a href="https://www.thea-pharmaceuticals.co.uk" rel="noopener">thea-pharmaceuticals.co.uk</a><span class="rd"> — [SPC] age 12 years and over, contraindications, cautions, and no more than 7 consecutive days. The MHRA Drug Safety Update on nasal xylometazoline/oxymetazoline decongestants is not evidence for the ocular duration. Accessed and last checked 3 October 2026</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Allergic conjunctivitis in primary care. Prominent itching, usually bilateral, with watery or stringy discharge. Record visual acuity, pupils, cornea, pain and photophobia, and contact-lens use. Pain, photophobia, visual change, corneal signs, marked unilateral redness or a painful red eye in a contact-lens wearer: same-day eye assessment. Trigger reduction and cool compresses; sodium cromoglicate 2% (GM first choice) or olopatadine; antazoline/xylometazoline only short term (12+, no more than 7 consecutive days per the current ocular SPC). Avoid olopatadine in pregnancy and breastfeeding. Oral antihistamine and/or intranasal treatment for coexisting rhinitis. No ocular steroids for an undifferentiated red eye. VKC and AKC: ophthalmology. Sources: BSACI (2017), BSACI/RCPath (2025), College of Optometrists CMG, DermNet, SPS, Greater Manchester formulary, ocular SPCs."
});
