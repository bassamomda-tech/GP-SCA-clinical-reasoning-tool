  stemSub:"<b>Primary-care management of allergic conjunctivitis.</b> Typical allergic conjunctivitis is usually benign, but severe or chronic forms can affect the cornea and threaten vision. Record visual acuity, pupils, cornea, pattern of redness, pain and photophobia, and contact-lens use before calling it allergy. Treat with trigger reduction and cool compresses, then a topical mast-cell stabiliser or antihistamine per the Greater Manchester formulary. Add an oral antihistamine when rhinitis coexists — not as automatic escalation for eye symptoms alone. <b>Do not start ocular corticosteroids for an undifferentiated red eye in primary care.</b>",

  foot:"Allergic conjunctivitis in primary care. Prominent itching, usually bilateral, with watery or stringy discharge. Record visual acuity, pupils, cornea, pain and photophobia, and contact-lens use. Pain, photophobia, visual change, corneal signs, marked unilateral redness or a painful red eye in a contact-lens wearer: same-day eye assessment. Trigger reduction and cool compresses; sodium cromoglicate 2% (GM first choice) or olopatadine; antazoline/xylometazoline only short term (12+, maximum 7 days). Oral antihistamine for coexisting rhinitis. No ocular steroids for an undifferentiated red eye. VKC and AKC: ophthalmology. Sources: BSACI (2017), BSACI/RCPath (2025), College of Optometrists CMG, Greater Manchester formulary, MHRA SPCs."
