<script>
MG.render({
  icon:"🟤",
  title:"Constipation in adults — the complete guide",

  stemTitle:"A new, persistent or unexplained change in bowel habit needs assessment for colorectal cancer and other secondary causes — so the two things that come before any laxative are excluding a constipating drug and screening the red flags",
  stemSub:"<b>Adult constipation: assess before prescribing.</b> Review the <b>medication list</b>, bowel pattern, abdominal symptoms and <b>red flags</b> before starting or escalating laxatives. A new persistent change in bowel habit requires assessment for colorectal cancer and other secondary causes; most cases are benign, but FIT should be offered according to NICE NG12 and HTG690 — and a FIT below 10 µg Hb/g does not exclude referral if clinical concern persists. Use gradual dietary fibre and adequate fluid where clinically appropriate, regular activity, an unhurried toileting routine and a footstool position. For uncomplicated constipation use a product-specific regimen, commonly an osmotic such as macrogol, adding a stimulant if stools are soft but evacuation remains infrequent. <b>Do not start bulk-forming laxatives for established opioid-induced constipation, faecal impaction or suspected bowel obstruction.</b> For opioid-induced constipation optimise an osmotic-plus-stimulant regimen and consider naloxegol or naldemedine if inadequate, after checking renal function, obstruction risk and interactions. Treat impaction first — <b>never oral laxatives if obstruction is suspected</b>. Once controlled, reduce to the lowest effective regimen; some patients need ongoing maintenance.",
  guideline:"BDA 2025 · NICE NG12 · NICE HTG690 (FIT) · NICE TA345 / TA651 / TA211 · GMMMG formulary",
  reviewed:"14 September 2026",
  nextReview:"14 March 2027",
  meta:[
    {t:"British Dietetic Association — dietary management of chronic constipation in adults (2025)"},
    {t:"Don't start bulk-forming in opioid-induced, impaction or obstruction", tone:"tw"},
    {t:"FIT &lt;10 µg Hb/g does not close the case", tone:"tw"},

    {t:"v2.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#confirm"><b>Confirm</b><small>Drugs · red flags</small></a><a href="#lifestyle"><b>Non-drug</b><small>Fibre · position</small></a><a href="#ladder"><b>Ladder</b><small>Bulk → osmotic → stim</small></a><a href="#review"><b>Titrate</b><small>Then lowest effective dose</small></a><a href="#refer"><b>Refer</b><small>NG12 · refractory</small></a></div>',
  quickSub:"The six that matter. Sources are listed under <a href=\"#provenance\">Evidence</a>; check every dose against the product SPC and the GM formulary.",
  quick:[
    {tone:"red", h:"⛔ Don't start a bulk-forming laxative in opioid-induced constipation, impaction or obstruction", html:"<b>Do not start a bulk-forming laxative as treatment for established opioid-induced constipation, faecal impaction or suspected bowel obstruction</b> — it increases stool bulk and may worsen bloating or obstruction. Review dietary fibre individually rather than advising universal avoidance of all fibre. Opioid-induced: an osmotic plus a stimulant, and consider naloxegol or naldemedine if an optimised regimen is inadequate (check obstruction risk, renal function and interactions). Impaction: exclude obstruction first, then the product-specific high-dose macrogol regimen, with or without a stimulant, or rectal treatment where indicated."},
    {tone:"blue", h:"The ladder, with the doses", html:"Step 1 bulk-forming: ispaghula husk, with good fluid intake. Step 2 osmotic for hard stools or inadequate response: often macrogol as the local first choice (typically 1–3 sachets daily), or lactulose 15 mL BD — lactulose may cause bloating and be less suitable in opioid-induced constipation — titrated to a soft formed stool. Step 3 add a stimulant: senna 7.5–15 mg at night or bisacodyl 5–10 mg at night — the right move when stools are soft but evacuation is infrequent. <b>Use the local product-specific regimen</b>: macrogol products are not interchangeable, maintenance doses differ from impaction regimens, and renal function, hydration, swallowing and fluid restriction affect choice and titration."},
    {tone:"amber", h:"Check the drug list before the laxative", html:"Opioids, iron, calcium-channel blockers, antimuscarinics — plus hypothyroidism, hypercalcaemia, diabetes, IBS and mechanical causes. Identifying and switching a constipating medicine treats the cause rather than the symptom, and is quicker than any titration."},
    {tone:"green", h:"Fibre without fluid makes it worse", html:"Increase dietary fibre GRADUALLY and individually to avoid bloating, with adequate fluid alongside — unless the patient has a fluid restriction (heart failure, advanced kidney disease, hyponatraemia or another specialist-directed reason). High fibre without adequate fluid may worsen bloating. Plus practical measures that may help: respond to the urge, an unhurried routine after meals to use the gastrocolic reflex, and knees above hips on a footstool, leaning forward."},
    {tone:"blue", h:"Titrate to effect, then the lowest effective regimen", html:"Once bowel function is stable, reduce laxative dose or frequency to the lowest effective regimen, maintaining the lifestyle measures. Some patients need ongoing maintenance treatment, particularly with chronic constipation or continued opioid therapy — laxatives generally continue while the opioid continues. Do not stop the bowel regimen solely because stools have temporarily improved."},
    {tone:"purple", h:"🟣 NICE NG12 — the colorectal route", html:"<b>Offer quantitative FIT</b> for an unexplained change in bowel habit or iron-deficiency anaemia at any age, an abdominal mass, unexplained weight loss and abdominal pain at 40+, rectal bleeding with abdominal pain or weight loss under 50, rectal bleeding, abdominal pain or weight loss at 50+, or anaemia at 60+ even without iron deficiency — age, duration, associated symptoms and examination set the urgency → suspected cancer pathway referral at ≥10 µg Hb/g. <b>A FIT below 10 µg Hb/g, or failure to return a sample, does not exclude colorectal cancer</b> — do not delay referral if symptoms persist or concern remains high. A rectal or anal mass, unexplained anal ulceration or an abdominal mass → refer without waiting for FIT. Restated in <a href='#refer'>Refer</a>."}
  ],
  pathwaySub:"Five steps, and the first two are what prevent harm.",
  pathway:[
    {title:"Confirm it, and exclude secondary causes and red flags", html:"Take a focused history; review the drug list; check thyroid, calcium and glucose where indicated; examine the abdomen and offer PR where indicated, with consent and chaperone. <b>Red flags require appropriate investigation or referral — do not let symptomatic laxative treatment delay this.</b> Laxatives may still be used when clinically appropriate, provided obstruction is not suspected.", alert:true},
    {title:"Non-drug measures", html:"Gradual fibre with fluid (unless restricted), activity, a toileting routine and the footstool position. Appropriate for uncomplicated constipation, but they should not delay treatment of faecal impaction or established opioid-induced constipation."},
    {title:"Work the laxative ladder", html:"Bulk-forming → osmotic (often macrogol as the local first choice) → add a stimulant, using product-specific doses — with the opioid-induced and impaction variants (exclude obstruction first)."},
    {title:"Titrate to a soft regular stool, then reduce", html:"Review at 2–4 weeks; step up or combine if inadequate; once stable, reduce to the lowest effective regimen — some patients need ongoing maintenance."},
    {title:"Refer the red flags urgently and the refractory routinely", html:"Suspected-cancer pathway (FIT below threshold does not close the case); suspected obstruction same day; specialist referral for refractory disease (prucalopride only in women meeting NICE TA211 and local criteria)."}
  ],
  sections:[

    {id:"confirm", nav:"Confirm", title:"Step 1 — confirm, and exclude secondary causes and red flags",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>Define</b>","Infrequent, hard or difficult stools, incomplete evacuation, straining — chronic if present for more than about 3 months"],
         ["<b>History</b>","Baseline bowel habit and recent change · stool form and frequency · straining and incomplete evacuation · rectal bleeding or melaena · abdominal pain, distension, vomiting and flatus · weight loss and appetite · family history of colorectal cancer or polyposis · previous colorectal disease or surgery · medications and recent changes · opioid dose and duration · mobility, toileting access and cognitive impairment · fluid restriction — particularly in older adults and care-home residents"],
         ["<b>Secondary causes</b>","Drugs (opioids, iron, calcium-channel blockers, antimuscarinics), hypothyroidism, hypercalcaemia, diabetes, IBS, mechanical causes"],
         ["<b>Red flags</b>","A new, persistent or unexplained change in bowel habit, rectal bleeding, weight loss, iron-deficiency anaemia, anaemia at 60+, or an abdominal or rectal mass → investigate: offer FIT for an unexplained change in bowel habit at any age under NICE NG12 (updated April 2026) with NICE HTG690 — age, duration, associated symptoms and examination determine the urgency and pathway — and a suspected cancer pathway referral at FIT ≥10 µg Hb/g. A rectal or anal mass, unexplained anal ulceration or an abdominal mass → refer without waiting for FIT. <b>A FIT below 10 µg Hb/g or an unreturned sample does not exclude colorectal cancer</b>"],
         ["<b>Obstruction / acute abdomen</b>","Severe or escalating colicky pain, progressive distension, persistent (especially faeculent) vomiting, inability to pass flatus or stool, peritonism, high-pitched or absent bowel sounds, inability to tolerate fluids, new constipation after abdominal surgery, or known hernia, malignancy or previous obstruction → <b>do not escalate laxatives; urgent same-day assessment</b>"],
         ["<b>Examine</b>","Abdomen; check hydration. Offer a digital rectal examination where impaction, rectal mass, anorectal pathology or evacuation disorder is suspected, with consent and appropriate chaperoning. Avoid or seek advice regarding rectal examination or rectal treatment in severe thrombocytopenia, neutropenia, recent rectal surgery or significant immunosuppression"]
       ]},
       {b:"why", html:"Most adult constipation is functional, but the two essentials before reaching for laxatives are excluding a reversible cause — above all a constipating drug — and screening for sinister red flags. A new, persistent or unexplained change in bowel habit requires assessment for colorectal cancer and other secondary causes, particularly in older adults. Most cases are not cancer, but red flags should not be attributed to simple constipation without appropriate investigation."}
     ]},

    {id:"lifestyle", nav:"Non-drug", title:"Step 2 — diet, fluids, activity and toileting",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"🌾 Fibre", html:"Increase dietary fibre GRADUALLY and individually (which avoids bloating) — fruit, vegetables, wholegrains."},
         {tone:"amber", h:"💧 Fluids", html:"<b>Encourage adequate fluid intake</b> unless the patient has a fluid restriction — for example heart failure, advanced kidney disease, hyponatraemia or another specialist-directed reason. High fibre without adequate fluid may worsen bloating."},
         {tone:"green", h:"🏃 Activity", html:"<b>Regular physical activity improves gut transit.</b>"},
         {tone:"blue", h:"🚽 Toileting routine", html:"Respond to the urge; an unhurried routine, ideally after meals to use the gastrocolic reflex."},
         {tone:"blue", h:"🦶 Position", html:"Knees above hips on a footstool, leaning forward — may help evacuation, and one patients rarely hear about."},
         {tone:"amber", h:"💊 Review drugs", html:"<b>Identify and, where possible, switch constipating medicines.</b> With opioids, consider whether the opioid remains necessary and whether analgesia can be adjusted."},
         {tone:"red", h:"⏱ Don't let lifestyle delay treatment", html:"Lifestyle measures are appropriate for uncomplicated constipation but should not delay treatment of faecal impaction or established opioid-induced constipation. People starting regular opioids should usually receive a proactive bowel regimen."}
       ]}
     ]},

    {id:"ladder", nav:"Ladder", title:"Step 3 — the laxative ladder",
     blocks:[
       {b:"table", head:["Step","Agent","Detail"], rows:[
         ["<b>Step 1 — bulk-forming</b>","<b>Ispaghula husk</b>","First-line if diet alone is inadequate — ensure adequate fluid intake (unless restricted). Do not start for established opioid-induced constipation, faecal impaction, or suspected bowel obstruction or significant intestinal narrowing — it increases stool bulk and may worsen bloating or obstruction"],
         ["<b>Step 2 — osmotic</b>","<b>Macrogol (often the local first choice; typically 1–3 sachets daily), or lactulose 15 mL BD</b>","For hard stools or an inadequate response to lifestyle measures. Titrate to a soft, formed stool using the product-specific regimen — macrogol sachets are not interchangeable across all products. Lactulose is an alternative where appropriate but may cause bloating and may be less suitable in opioid-induced constipation"],
         ["<b>Step 3 — add a stimulant</b>","<b>Senna 7.5–15 mg at night, or bisacodyl 5–10 mg at night</b>","<b>Add if stools are soft but evacuation is infrequent — slow transit</b>"],
         ["<b>Special — opioid-induced</b>","<b>Osmotic plus stimulant; do not start bulk-forming</b>","Review the opioid regimen; laxatives usually continue while the opioid continues. <b>Consider a peripherally acting opioid antagonist such as naloxegol (NICE TA345) or naldemedine (NICE TA651)</b> when opioid-induced constipation has not responded adequately to an optimised conventional laxative regimen — after assessing the constipation and checking bowel obstruction risk (obstruction or suspected obstruction is a contraindication), renal function and interactions (potent CYP3A4 inhibitors). Start at the product-recommended dose, reducing where indicated by renal impairment, tolerability or interacting medicines; warn about abdominal pain, diarrhoea and opioid-withdrawal symptoms. Follow the product information and local formulary"],
         ["<b>Special — impaction</b>","<b>Exclude obstruction first; then the product-specific high-dose macrogol regimen</b>","<b>With or without a stimulant.</b> Rectal treatment (suppository or enema) if oral disimpaction is unsuitable or ineffective, unless contraindicated — seek advice in severe thrombocytopenia, neutropenia, recent rectal surgery or significant immunosuppression"],
         ["<b>Refractory — specialist</b>","<b>Specialist referral</b>","For chronic constipation refractory to optimised lifestyle measures and adequate laxative trials. Prucalopride may be considered in women meeting NICE TA211 criteria, in line with the product licence and local formulary; use in men or outside local criteria needs specialist advice. Linaclotide is restricted to specific GM formulary criteria"]
       ]},
       {b:"warn", html:"<b>Do not give high-dose oral macrogol if bowel obstruction, ileus or perforation is suspected.</b> Severe or colicky abdominal pain, persistent vomiting, progressive distension and inability to pass flatus require urgent assessment — not escalating laxatives."},
       {b:"warn", html:"Don't start bulk-forming laxatives for established opioid-induced constipation, faecal impaction or suspected obstruction — they can worsen it. Doses shown are typical adult regimens: use the local product-specific regimen and check renal function, hydration, swallowing and fluid restriction, particularly in older adults with heart failure, chronic kidney disease or frailty. Once regular, soft stools are achieved, reduce to the lowest effective regimen; some patients need ongoing maintenance."}
     ]},

    {id:"review", nav:"Titrate", title:"Step 4 — titrate to effect, then the lowest effective regimen",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["<b>Stool frequency and form</b>","<b>Each review</b>","Titrate the laxative to a soft, regular stool; combine classes if needed"],
         ["<b>Response to laxative</b>","<b>2–4 weeks</b>","<b>Inadequate → step up or combine</b>"],
         ["<b>Reduce</b>","<b>Once stable</b>","<b>Reduce dose or frequency to the lowest effective regimen, maintaining the lifestyle measures; some patients need ongoing maintenance (chronic constipation, continued opioids)</b>"],
         ["<b>Red flags</b>","<b>Ongoing</b>","<b>Any new alarm feature → investigate; a below-threshold FIT does not close the case</b>"]
       ]},
       {b:"dl", rows:[
         ["<b>2–4 weeks</b>","<b>Assess the laxative effect; titrate, or add a second class</b>"],
         ["<b>Once controlled</b>","Reduce to the lowest effective regimen while maintaining diet, fluids (unless restricted) and activity. Do not stop the bowel regimen solely because stools have temporarily improved; with opioids, laxatives generally continue while the opioid continues"],
         ["<b>As needed</b>","Recurrent or refractory → review the cause; a persistent change in habit → investigate, even after a FIT below 10 µg Hb/g if concern persists"]
       ]}
     ]},

    {id:"notresponding", nav:"Not responding?", title:"Not responding? Re-check before escalating",
     sub:"Reconsider cause, drugs and impaction before adding more laxatives.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"1 · Impaction", html:"Overflow diarrhoea or a palpable loaded colon → check for obstruction, then treat the impaction FIRST, before any ladder step."},
         {tone:"amber", h:"2 · Drugs", html:"<b>Are constipating medicines still on board?</b>"},
         {tone:"blue", h:"3 · Secondary cause", html:"<b>Recheck thyroid, calcium and glucose; consider IBS-C.</b>"},
         {tone:"blue", h:"4 · Combination", html:"Combine an osmotic plus a stimulant at adequate doses before declaring failure."},
         {tone:"red", h:"5 · Red flags", html:"<b>Any alarm feature → investigate or refer</b> — a negative or below-threshold FIT does not exclude colorectal cancer if concern persists. Suspected obstruction → same-day assessment."}
       ]}
     ]},

    {id:"safety", nav:"Safety-net", title:"Safety-netting",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Alarm features", html:"\"Rectal bleeding, unintentional weight loss, a tummy or back-passage lump, or a new change in your bowels that persists — come back; we'll investigate. A normal stool test does not rule everything out, so come back if symptoms carry on.\""},
         {tone:"red", h:"🔴 Obstruction", html:"\"Severe or worsening tummy pain, a swelling tummy, repeated vomiting, not being able to keep fluids down, or passing no wind or stool — stop the laxatives and seek urgent help the same day.\""},
         {tone:"amber", h:"💩 Overflow", html:"\"Leaking loose stool while constipated can mean a blockage of hard stool — tell us, don't just treat the 'diarrhoea'.\""},
         {tone:"green", h:"💧 Fibre and fluids", html:"\"Increase fibre slowly and drink enough fluid — unless you have been told to limit your fluids.\""}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"When to refer",
     blocks:[
       {b:"cards", items:[
         {tone:"purple", h:"Suspected cancer · NICE NG12", html:"Features needing colorectal assessment — an unexplained change in bowel habit or iron-deficiency anaemia at any age, unexplained weight loss and abdominal pain at 40+, rectal bleeding with abdominal pain or weight loss under 50, rectal bleeding, abdominal pain or weight loss at 50+, or anaemia at 60+ → FIT, with a suspected cancer pathway referral at ≥10 µg Hb/g. A rectal or anal mass, unexplained anal ulceration or an abdominal mass → refer without waiting for FIT. <b>A negative or below-threshold FIT does not exclude colorectal cancer</b>: persistent change in bowel habit, ongoing rectal bleeding, iron-deficiency anaemia, an abdominal/rectal mass or strong clinical concern needs further assessment despite FIT (NICE NG12, HTG690)."},
         {tone:"red", h:"Same day — suspected obstruction", html:"Severe or escalating abdominal pain, progressive distension, persistent vomiting, inability to pass flatus or stool, or peritonism may indicate obstruction or another acute abdominal condition — do not continue escalating laxatives; arrange urgent same-day assessment."},
         {tone:"amber", h:"Refractory", html:"Chronic constipation refractory to optimised lifestyle measures and adequate trials of laxatives — consider specialist referral. Prucalopride may be considered in women meeting NICE TA211 criteria, in accordance with the product licence and local formulary; use in men or outside local criteria requires specialist advice. Linaclotide is restricted to specific GM formulary criteria."},
         {tone:"red", h:"Impaction not resolving", html:"<b>Faecal impaction failing oral and rectal treatment.</b>"},
         {tone:"blue", h:"Secondary cause", html:"Suspected metabolic, neurological or structural cause needing investigation."},
         {tone:"cream", h:"GP management", html:"Confirming the diagnosis, excluding drugs and secondary causes, the non-drug measures, the whole laxative ladder including the opioid and impaction variants, and the titrate-then-lowest-effective-dose plan all belong here. Related pages: <a href='ibs.html'>IBS</a> · <a href='haemorrhoids.html'>haemorrhoids</a> · <a href='anal-fissure.html'>anal fissure</a> · <a href='opioid-prescribing.html'>opioids in non-cancer pain</a> · <a href='palliative-constipation.html'>palliative constipation</a>."}
       ]},
       {b:"say", html:"Let's start with fibre, fluids and activity, and a laxative we adjust to comfortable, regular stools — then bring it down to the lowest dose that keeps you comfortable. Some people do need to stay on a laxative longer term, especially while taking painkillers like morphine. If you ever notice bleeding, weight loss or a lasting change in your bowels, come back so we can check things properly."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 67-year-old woman on <b>modified-release morphine</b> for osteoarthritis and <b>amlodipine</b> reports 3 months of hard, infrequent stools. She has been taking <b>ispaghula husk</b> bought over the counter with little effect and now feels <b>more bloated</b>. In the last fortnight she has had <b>episodes of loose stool leaking between the constipation</b>, which she assumed was a stomach bug. She has lost no weight and has had no bleeding."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Recognises the leaking loose stool as OVERFLOW around impaction, not a stomach bug — <b>assesses for bowel obstruction</b> and checks hydration, renal function and any fluid restriction, then treats the impaction first with a product-specific high-dose macrogol regimen rather than adding another ladder step — or rectal treatment if oral disimpaction is unsuitable or ineffective, unless contraindicated; stops the ispaghula, because it is inappropriate here and may worsen bloating and impaction; prescribes an osmotic plus a stimulant as the correct opioid-induced regimen, and considers naloxegol or naldemedine if that is inadequate, after checking renal function, obstruction risk and interactions; <b>reviews the amlodipine and the opioid itself as contributors</b>, and whether the opioid remains necessary or analgesia can be adjusted; <b>examines the abdomen and documents the findings and whether PR (with consent and chaperone) is performed</b>; <b>distinguishes opioid-induced constipation from a new bowel-habit change at 67 that needs colorectal assessment (FIT)</b>, and does not assume that no weight loss or bleeding excludes colorectal disease; <b>plans to titrate to a soft regular stool then reduce to the lowest effective regimen while the opioid continues</b>; and <b>gives the overflow and obstruction safety-nets in plain words.</b>"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Named sources. Check each medicine against the GM formulary, the specific product SPC and the local bowel-care / opioid-induced constipation pathway.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>British Dietetic Association — dietary management of chronic constipation in adults (2025)</b><span class="rd"> — the definition and chronicity threshold, the secondary causes and constipating drug list, the non-drug measures including toileting position, the place of fibre and ispaghula, and reducing to the lowest effective regimen</span></li>'+
         '<li><b>NICE TA345 (naloxegol) · TA651 (naldemedine) — opioid-induced constipation</b><br><a href="https://www.nice.org.uk/guidance/ta345" rel="noopener">nice.org.uk/guidance/ta345</a> · <a href="https://www.nice.org.uk/guidance/ta651" rel="noopener">nice.org.uk/guidance/ta651</a><span class="rd"> — peripherally acting opioid antagonists for adults whose opioid-induced constipation has not responded adequately to laxatives (dose, renal and CYP3A4 cautions per the product SPC)</span></li>'+
         '<li><b>NICE TA211 — Prucalopride for the treatment of chronic constipation in women</b><br><a href="https://www.nice.org.uk/guidance/ta211" rel="noopener">nice.org.uk/guidance/ta211</a><span class="rd"> — prucalopride for women whose chronic constipation has not responded adequately to laxatives; other use needs specialist advice</span></li>'+
         '<li><b>NICE HTG690 — Quantitative faecal immunochemical testing to guide colorectal cancer pathway referral in primary care (formerly DG56)</b><br><a href="https://www.nice.org.uk/guidance/htg690" rel="noopener">nice.org.uk/guidance/htg690</a><span class="rd"> — FIT for change in bowel habit and iron-deficiency anaemia; referral at ≥10 µg Hb/g; safety-netting and no delay in referral where clinical concern persists despite a low or absent FIT</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — the FIT-guided colorectal routes for a change in bowel habit, iron-deficiency anaemia, rectal bleeding, abdominal pain, weight loss and abdominal or rectal mass, and FIT at \u226510 \u00b5g Hb/g</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — laxative classes and doses (ispaghula, macrogol, lactulose, senna, bisacodyl), the cautions on bulk-forming agents in opioid-induced constipation and impaction, the high-dose macrogol regimen for faecal impaction, and the naloxegol licence</span></li>'+
         '<li><b>GMMMG Formulary — Gastro-intestinal system</b><br><a href="https://www.greatermanchesterformulary.nhs.uk" rel="noopener">greatermanchesterformulary.nhs.uk</a><span class="rd"> — ispaghula, macrogol, lactulose, senna, bisacodyl, naloxegol, naldemedine; prucalopride (TA211, women) and linaclotide restricted</span></li>'+
         '<li><b>Summaries of Product Characteristics — macrogol products, naloxegol, naldemedine, prucalopride</b><br><a href="https://www.medicines.org.uk/emc" rel="noopener">medicines.org.uk/emc</a><span class="rd"> — product-specific maintenance and impaction regimens, renal dosing, interactions and contraindications</span></li>'+
         '<li><b>GMMMG — Palliative care pain and symptom control guidelines for adults (modified April 2025)</b><span class="rd"> — caution with rectal measures in neutropenia or thrombocytopenia</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Constipation in adults — BDA 2025, NICE TA211, TA345, TA651 and NG12 (updated April 2026). Before any laxative, review the drug list (opioids, iron, calcium-channel blockers, antimuscarinics) and screen the red flags: a new, persistent or unexplained change in bowel habit needs assessment for colorectal cancer (FIT per NG12 and HTG690; a FIT below 10 µg Hb/g does not close the case). Increase fibre gradually WITH fluid unless fluid-restricted, and use the footstool position. Ladder: bulk-forming (ispaghula) → osmotic (often macrogol) → add a stimulant (senna or bisacodyl). Do NOT start bulk-forming laxatives in opioid-induced constipation, faecal impaction or suspected obstruction — use an osmotic plus stimulant, considering naloxegol or naldemedine if inadequate, and for impaction exclude obstruction then use a product-specific high-dose macrogol regimen. Titrate to a soft regular stool, then reduce to the lowest effective regimen. Verify all doses against the product SPC, current BNF and GM formulary before prescribing."
});
