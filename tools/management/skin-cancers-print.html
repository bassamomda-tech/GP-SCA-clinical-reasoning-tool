<script>
MG.render({
  icon:"\u{2600}\u{FE0F}",
  title:"Skin cancers — melanoma, SCC and BCC",
  eyebrow:"Protocol · recognise · score · refer on the right pathway · prevent",
  stemTitle:"Skin cancer: score every changing pigmented lesion, send suspected melanoma and SCC on the suspected cancer pathway, refer most BCCs routinely, and never excise a possible melanoma in the surgery",
  stemSub:"One page for suspicious skin lesions in general practice: the NICE NG12 criteria for melanoma, squamous cell carcinoma (SCC) and basal cell carcinoma (BCC), the weighted 7-point checklist, dermoscopy and teledermatology images, who is at high risk, what to do with actinic keratoses, life after a melanoma diagnosis (NG14) and sun-protection advice (NG34).",
  guideline:"NICE NG12 (2015, updated April 2026) · NICE NG14 (2015, updated 2022) · NICE NG34 (2016) · BAD BCC (2021) and cSCC (2020)",
  reviewed:"15 October 2026",
  nextReview:"15 April 2027",
  meta:[
    {t:"NICE NG12 — suspected cancer (updated April 2026)"},
    {t:"NICE NG14 — melanoma (updated 2022)"},
    {t:"NICE NG34 — sunlight exposure (2016)"},
    {t:"BAD — BCC (2021) · cSCC (2020)"},
    {t:"NG12 suspected cancer pathway applies", tone:"tw"},
    {t:"v1.0 · reviewed Oct 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#severe"><b>Red flags</b><small>Melanoma · SCC</small></a><a href="#confirm"><b>7-point checklist</b><small>Score it</small></a><a href="#refer"><b>Which pathway</b><small>Melanoma · SCC · BCC</small></a><a href="#prevent"><b>Prevent</b><small>Sun · high risk</small></a><a href="../algorithms/pigmented-skin-lesions.html"><b>Pigmented lesions algorithm</b><small>Assessment →</small></a></div>',
  quickSub:"If you read nothing else on this page, read these cards. Every number traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Suspected melanoma → suspected cancer pathway", html:"Refer using a <b>suspected cancer pathway referral</b> for a suspicious pigmented lesion scoring <b>3 or more on the weighted 7-point checklist</b>, or where <b>dermoscopy suggests melanoma</b>. <b>Consider</b> it for a pigmented or non-pigmented lesion that suggests <b>nodular melanoma</b>. Strong clinical concern outweighs a low score."},
    {tone:"red", h:"⚠ Suspected SCC → consider suspected cancer pathway", html:"<b>Consider</b> a suspected cancer pathway referral for a skin lesion that raises the suspicion of <b>squamous cell carcinoma</b>: a growing, keratotic or ulcerated nodule, tender or bleeding, especially on sun-exposed skin, lip or ear, or in an organ-transplant recipient."},
    {tone:"amber", h:"BCC — usually routine", html:"<b>Consider routine referral</b> for suspected basal cell carcinoma. Only <b>consider</b> a suspected cancer pathway referral if there is concern that a delay could have an unacceptable impact because of the lesion's <b>site or size</b> (for example near the eye or nose, or large)."},
    {tone:"blue", h:"Never excise a possible melanoma in the surgery", html:"Do not shave, curette or biopsy a lesion that might be melanoma — refer it intact. Only excise a suspected BCC in primary care if you are trained and accredited under the local skin cancer model of care."},
    {tone:"cream", h:"Images help, but don't delay", html:"Many pathways ask for <b>dermoscopic and macroscopic images</b> with the referral (teledermatology). Use the local pathway; if photographs cannot be taken promptly, refer anyway."},
    {tone:"green", h:"Prevent and look again", html:"Sun-protection advice (shade, clothing, SPF 30 or higher with 4- or 5-star UVA protection), teach skin self-examination, and keep a lower threshold in high-risk groups: organ transplant, immunosuppression, previous skin cancer, many or atypical moles, fair skin."}
  ],
  pathwaySub:"The skin-lesion consultation in five moves. The red step is where melanomas are missed.",
  pathway:[
    {title:"History", html:"New or changing lesion? Over how long? Bleeding, itch, ulceration? Previous skin cancer, family history of melanoma, immunosuppression, sunburn and sunbed history, skin type."},
    {title:"Examine and score", html:"Whole-skin look where possible. Weighted 7-point checklist for pigmented lesions; dermoscopy if trained. Palpate regional nodes for melanoma or SCC.", alert:true},
    {title:"Classify", html:"Likely melanoma, SCC, BCC, actinic keratosis or benign (seborrhoeic keratosis, dermatofibroma, haemangioma, benign naevus). If uncertain and changing — refer or review with a dated photo."},
    {title:"Refer on the right pathway", html:"Melanoma → suspected cancer pathway. SCC → consider suspected cancer pathway. BCC → consider routine (suspected cancer pathway only for worrying site or size). Images per local teledermatology pathway."},
    {title:"Prevent and follow up", html:"Sun protection, self-examination, treat actinic keratoses, and support after diagnosis (NG14 follow-up, vitamin D, family history)."}
  ],
  sections:[

    {id:"severe", nav:"Red flags", title:"Red flags — the lesions that cannot wait", sub:"Melanoma and SCC can metastasise; the commonest error is reassurance without scoring or without a dated review.",
     blocks:[
       {b:"warn", html:"<b>Suspicious pigmented lesion with a weighted 7-point checklist score of 3 or more, or dermoscopy suggesting melanoma → suspected cancer pathway referral.</b> Do not excise or biopsy in primary care. Palpable regional nodes or symptoms of metastasis with a skin lesion → suspected cancer pathway and note it in the referral."},
       {b:"cards", items:[
         {tone:"red", h:"Nodular melanoma", html:"Firm, raised, rapidly growing nodule, often symmetrical and sometimes <b>amelanotic</b> (pink or red) — it fails ABCD. Use <b>EFG</b>: Elevated, Firm, Growing for more than a month. Consider suspected cancer pathway referral.", src:"NICE NG12"},
         {tone:"red", h:"Subungual and acral melanoma", html:"New or widening pigmented nail band, pigment spreading to the nail fold (Hutchinson's sign), or a changing pigmented lesion on the sole or palm — more common in people with darker skin.", src:"NG12 · BAD"},
         {tone:"red", h:"Lentigo maligna", html:"Large, flat, irregular, unevenly pigmented facial patch in an older person, slowly enlarging.", src:"BAD"},
         {tone:"amber", h:"High-risk SCC", html:"Rapid growth, tender, more than 2 cm, on the lip or ear, poorly defined, ulcerating, or in an immunosuppressed person or organ-transplant recipient.", src:"NICE NG12 · BAD cSCC 2020"}
       ]}
     ]},

    {id:"confirm", nav:"7-point checklist", title:"Assessing a pigmented lesion — the weighted 7-point checklist", sub:"NICE's primary-care standard. Score 3 or more → suspected cancer pathway referral.",
     blocks:[
       {b:"table", head:["Feature","Points"], rows:[
         ["<b>Major:</b> change in size","2"],
         ["<b>Major:</b> irregular shape","2"],
         ["<b>Major:</b> irregular colour","2"],
         ["<b>Minor:</b> largest diameter 7 mm or more","1"],
         ["<b>Minor:</b> inflammation","1"],
         ["<b>Minor:</b> oozing","1"],
         ["<b>Minor:</b> change in sensation (including itch)","1"]
       ]},
       {b:"cards", items:[
         {tone:"blue", h:"Score it every time", html:"A single major feature plus one minor feature reaches 3. Record the score and the features in the notes and in the referral.", src:"NICE NG12"},
         {tone:"blue", h:"Dermoscopy", html:"If you are trained, dermoscopy improves accuracy: refer if dermoscopy suggests melanoma. Untrained dermoscopy can falsely reassure — rely on the checklist and clinical concern.", src:"NICE NG12"},
         {tone:"cream", h:"Low score, still worried?", html:"Refer if clinical concern remains despite a low score. For a low-suspicion lesion, a dated photograph (with a ruler) and review in 8 weeks is reasonable — with a clear safety-net."}
       ]},
       {b:"why", html:"The weighted 7-point checklist gives more weight to change in size, shape and colour, which carry most of the diagnostic value. NICE adopted a threshold of 3 to balance sensitivity against the number of benign lesions referred. ABCDE (asymmetry, border, colour, diameter, evolution) is a useful teaching tool but is not the NG12 referral standard."}
     ]},

    {id:"workup", nav:"Classify", title:"Recognising SCC, BCC and their mimics", sub:"Most non-pigmented lesions are diagnosed clinically; the pathway follows the diagnosis.",
     blocks:[
       {b:"table", head:["Lesion","Typical features","Pathway"], rows:[
         ["<b>Squamous cell carcinoma</b>","Keratotic or crusted nodule or plaque on sun-exposed skin, growing over weeks to months; may ulcerate, bleed or be tender. Keratoacanthoma (rapid dome with central keratin plug) is managed as SCC","Consider suspected cancer pathway referral"],
         ["<b>Bowen's disease</b> (SCC in situ)","Slow-growing, well-defined red scaly plaque, often on the lower leg","Routine / local pathway; may be treated in primary care if trained"],
         ["<b>Basal cell carcinoma</b>","Pearly or translucent papule with rolled edge and telangiectasia; may ulcerate (rodent ulcer); superficial BCC is a pink scaly plaque on the trunk; slow growing","Consider routine referral; suspected cancer pathway only for worrying site or size"],
         ["<b>Actinic keratosis</b>","Rough, scaly, often easier felt than seen, on chronically sun-damaged skin","Treat in primary care — see the <a href=\"actinic-keratosis.html\">actinic keratosis protocol</a>; refer if features of SCC"],
         ["<b>Seborrhoeic keratosis</b>","Stuck-on, warty, greasy surface with milia-like cysts — benign","Reassure; refer if doubt"],
         ["<b>Benign naevus, dermatofibroma, haemangioma</b>","Stable, symmetrical, uniform colour; dermatofibroma dimples on pinching","Reassure; photograph if any uncertainty"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Examine the rest", html:"Look at the whole skin for other lesions and actinic damage, and palpate regional lymph nodes for suspected melanoma or SCC."},
         {tone:"cream", h:"Children", html:"Melanoma is rare in children. A suspicious or changing lesion in a child or young person → discuss with or refer to paediatric dermatology via the local pathway."}
       ]}
     ]},

    {id:"ladder", nav:"Management", title:"Management — what primary care does and does not do", sub:"The GP's role is recognition, the right referral, prevention and support; treatment of skin cancer is specialist or by accredited GPs.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1", title:"Refer on the right pathway", when:"every suspicious lesion",
          html:"Suspected melanoma → suspected cancer pathway. Suspected SCC → consider suspected cancer pathway. Suspected BCC → consider routine referral (suspected cancer pathway only if site or size makes delay unacceptable). Include history, 7-point score, size, site, immune status and images where the local pathway asks for them."},
         {step:"2", title:"Teledermatology images", when:"as the local pathway requires",
          fromLabel:"support triage, never delay",
          html:"Dermoscopic plus close-up and regional images taken to the local standard (good lighting, scale, consent, secure system) help triage to the right clinic or straight to surgery. Do not hold up a suspected cancer referral because images are not available."},
         {step:"3", title:"BCC in primary care — accredited GPs only", when:"low-risk BCC",
          fromLabel:"local model of care",
          html:"Low-risk BCC (for example below the clavicle, small, well-defined, not recurrent) may be excised by a GP accredited under the local skin cancer service. Superficial BCC may be treated with topical imiquimod or other non-surgical treatment under specialist or accredited GP guidance. <span class=mg-dose>Usual adult dose: imiquimod 5% cream for superficial BCC, applied once daily on 5 days a week for 6 weeks (NICE/SPC; check the SPC, BNF and local formulary; <a href=\"https://www.medicines.org.uk/emc/search?q=imiquimod\" target=_blank rel=noopener>SPC: imiquimod</a>).</span>"},
         {step:"4", title:"After a diagnosis", when:"shared follow-up",
          fromLabel:"support and surveillance",
          html:"Melanoma follow-up follows NICE NG14 and the specialist plan: teach skin and node self-examination, provide written information, check vitamin D status where advised and offer supplementation if low. People with a history of skin cancer have a higher risk of another — check the whole skin opportunistically."}
       ]},
       {b:"warn", html:"<b>Do not excise, shave, curette or biopsy a lesion that could be melanoma in primary care.</b> A partial or shave biopsy prevents accurate staging (Breslow thickness) and can change the treatment. Send all excised skin specimens for histology."}
     ]},

    {id:"special", nav:"High-risk groups", title:"High-risk groups and special situations", sub:"Lower your threshold for referral and examine more often.",
     blocks:[
       {b:"table", head:["Group","Why","What changes"], rows:[
         ["<b>Organ-transplant recipients and other immunosuppressed people</b>","SCC risk many times higher; aggressive tumours","Annual skin check (often in a specialist clinic); low threshold for SCC referral; sun protection; consider specialist review of immunosuppression"],
         ["<b>Previous melanoma or skin cancer</b>","Higher risk of a further primary","Self-examination; whole-skin check at reviews; NG14 follow-up schedule"],
         ["<b>Many (over 100) or atypical moles, or family history of melanoma</b>","Higher melanoma risk","Teach self-examination; photograph; consider dermatology assessment"],
         ["<b>Fair skin, red hair, freckles, history of sunburn or sunbed use, outdoor workers</b>","Higher melanoma, SCC and BCC risk","Prevention advice; earlier review of changing lesions"],
         ["<b>Darker skin</b>","Lower incidence but later diagnosis; acral and subungual melanoma relatively more common","Examine palms, soles and nails"],
         ["<b>Pregnancy</b>","Naevi can darken; melanoma in pregnancy is uncommon but not to be dismissed","Assess and refer as for anyone"]
       ]}
     ]},

    {id:"prevent", nav:"Prevention", title:"Prevention and sun protection — NICE NG34", sub:"Practical advice balanced with the benefits of sunlight and vitamin D.",
     blocks:[
       {b:"cards", items:[
         {tone:"green", h:"Sun protection", html:"Seek shade, especially between 11am and 3pm in the UK summer; cover up with clothing, a wide-brimmed hat and sunglasses; use sunscreen of at least SPF 30 with 4- or 5-star UVA protection, applied generously and reapplied. Never burn; avoid sunbeds.", src:"NICE NG34 · NHS"},
         {tone:"green", h:"Vitamin D", html:"People who cover up or avoid the sun, and those with darker skin, may need vitamin D supplements — follow UK advice on daily supplementation.", src:"NICE NG34"},
         {tone:"green", h:"Self-examination", html:"Check the skin monthly, using a mirror or partner for the back; look for new lesions or change in size, shape or colour; photograph lesions to compare."}
       ]}
     ]},

    {id:"monitor", nav:"Follow-up", title:"Follow-up and safety-netting", sub:"Every reassured lesion leaves with a safety-net; every uncertain one with a dated review.",
     blocks:[
       {b:"table", head:["Situation","When","Action"], rows:[
         ["Low-suspicion pigmented lesion","Review in 8 weeks with a dated photograph","Any change in size, shape or colour → suspected cancer pathway"],
         ["Suspected cancer referral","Check the appointment is made","Make sure the patient has been seen and the result received (practice safety-netting system)"],
         ["Actinic keratoses","After treatment and at reviews","Non-healing, tender or growing lesion → consider SCC"],
         ["After melanoma","Per specialist and NG14 plan","Self-examination, node check, new or changing lesion → re-refer"]
       ]},
       {b:"cards", items:[
         {tone:"amber", h:"🔍 Changing lesion", html:"“If this mark changes in size, shape or colour, bleeds, becomes itchy or crusted, or doesn't heal within a few weeks, contact us — don't wait for the review.”"},
         {tone:"amber", h:"📅 Urgent referral", html:"“I'm referring you urgently so we can find out quickly. This doesn't mean it is cancer, but it needs a specialist look. If you haven't heard within a week, call us.”"},
         {tone:"green", h:"☀️ Sun sense", html:"“Shade, clothing and an SPF 30 sunscreen with high UVA stars, and no sunbeds — it's never too late to reduce your risk.”"}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways — melanoma, SCC and BCC", sub:"Use NG12 wording: suspected cancer pathway referral aims for cancer to be diagnosed or ruled out within 28 days (Faster Diagnosis Standard).",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Suspected cancer pathway — refer", html:"Suspicious pigmented lesion with weighted 7-point checklist score of 3 or more; dermoscopy suggests melanoma.", src:"NICE NG12"},
         {tone:"red", h:"Suspected cancer pathway — consider", html:"Pigmented or non-pigmented lesion suggesting nodular melanoma; skin lesion raising the suspicion of SCC; suspected BCC where delay could have an unacceptable impact because of site or size.", src:"NICE NG12"},
         {tone:"blue", h:"Routine — consider", html:"Suspected BCC (most cases). Many atypical moles or a strong family history for assessment. Uncertain benign lesion after review.", src:"NICE NG12"}
       ]},
       {b:"say", html:"“This looks like it could be a skin cancer called [melanoma / a squamous cell cancer], so I'm referring you on the fast-track pathway to be seen quickly. Most of these referrals turn out not to be cancer, but if it is, finding it early makes treatment simpler and more successful.”"}
     ]},

    {id:"provenance", nav:"Evidence", title:"Evidence and references", sub:"Every recommendation on this page is traceable to these sources.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (2015, updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — skin cancers: melanoma (weighted 7-point checklist, dermoscopy, nodular melanoma), SCC (consider suspected cancer pathway), BCC (consider routine; suspected cancer pathway only for site or size)</span></li>'+
         '<li><b>NICE NG14 — Melanoma: assessment and management (2015, updated 2022)</b><br><a href="https://www.nice.org.uk/guidance/ng14" rel="noopener">nice.org.uk/guidance/ng14</a><span class="rd"> — dermoscopy, follow-up, self-examination, vitamin D</span></li>'+
         '<li><b>NICE NG34 — Sunlight exposure: risks and benefits (2016)</b><br><a href="https://www.nice.org.uk/guidance/ng34" rel="noopener">nice.org.uk/guidance/ng34</a><span class="rd"> — sun-protection messages and vitamin D</span></li>'+
         '<li><b>NICE QS130 — Skin cancer (2016, updated 2024)</b><br><a href="https://www.nice.org.uk/guidance/qs130" rel="noopener">nice.org.uk/guidance/qs130</a><span class="rd"> — diagnosis within 28 days of referral; high-risk SCC</span></li>'+
         '<li><b>British Association of Dermatologists — guidelines for BCC (2021) and cutaneous SCC (2020)</b><br><a href="https://www.bad.org.uk/clinical-standards/clinical-guidelines/" rel="noopener">bad.org.uk — clinical guidelines</a><span class="rd"> — low- and high-risk features, primary-care excision, non-surgical treatment</span></li>'+
         '<li><b>NICE CSG8 — Improving outcomes for people with skin tumours including melanoma (2006, updated 2010)</b><br><a href="https://www.nice.org.uk/guidance/csg8" rel="noopener">nice.org.uk/guidance/csg8</a><span class="rd"> — who may excise skin cancers in primary care</span></li>'+
         '<li><b>Imiquimod 5% cream (Aldara) product information (SPC)</b><br><a href="https://www.medicines.org.uk/emc/search?q=imiquimod" rel="noopener">medicines.org.uk — imiquimod</a><span class="rd"> — superficial BCC regimen</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Skin cancers — NICE NG12 (updated April 2026), NG14 (updated 2022), NG34 (2016) and BAD guidelines. suspected cancer pathway referral aims for cancer to be diagnosed or ruled out within 28 days (Faster Diagnosis Standard). Check any treatment in the current SPC, your local formulary and the local skin cancer model of care."
});
</script>
