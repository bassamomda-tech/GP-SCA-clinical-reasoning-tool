  lead:'<div class="mg-layers"><a href="#safety"><b>Red flags</b><small>NG12 · haemodynamic</small></a><a href="#assess"><b>Assess</b><small>FBC · examine · image</small></a><a href="#treat"><b>Treat</b><small>LNG-IUS first</small></a><a href="#iron"><b>Iron</b><small>Replace properly</small></a><a href="#refer"><b>Refer</b><small>Thresholds</small></a></div>',
  quickSub:"The six that change outcomes. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"blue", h:"NG88's definition is the patient's, and that is deliberate", html:"Excessive menstrual blood loss which interferes with physical, emotional, social and material quality of life. Do not measure or estimate blood loss, and do not require a threshold to be met before treating — the old 80 mL definition was never usable in practice and excluded women who needed help. Ask instead: flooding, clots, changing protection hourly, double protection, night-time changes, days off work or school, planning life around periods."},
    {tone:"red", h:"⚠ Check a full blood count in every woman", html:"NG88: perform an FBC in all women with heavy menstrual bleeding, in parallel with starting treatment. Iron deficiency is extremely common, frequently profound, and routinely under-treated — and fatigue, breathlessness and poor concentration are often attributed to a busy life rather than to a haemoglobin of 92. NG88 advises against routine ferritin testing. Consider ferritin where iron deficiency is suspected despite a normal haemoglobin, where anaemia is present, where symptoms are disproportionate, or where the result will influence iron replacement or further investigation. If ferritin confirms iron deficiency, consider iron replacement even when haemoglobin is normal, based on symptoms, degree of deficiency and the clinical context."},
    {tone:"green", h:"The LNG-IUS is first-line — offer it first, not last", html:"NG88 names the 52 mg levonorgestrel intrauterine system as first-line pharmacological treatment where there is no structural or histological abnormality, fibroids under 3 cm not distorting the cavity, or suspected or diagnosed adenomyosis. It is usually the most effective first-line medical option when suitable, treats pain as well, and is contraceptive. <b>Explain that irregular bleeding is common initially and may last longer than 6 months; NICE advises allowing at least 6 cycles to assess benefit</b> — unwarned, it gets removed at three months and recorded as a failure."},
    {tone:"amber", h:"If she is trying to conceive, the options change completely", html:"The effective hormonal options are incompatible with actively trying to conceive while they are being used (fertility generally returns after stopping), so in a woman trying to conceive use non-hormonal treatment: tranexamic acid from the onset of bleeding (it is antifibrinolytic, not hormonal, and does not affect fertility), with or without mefenamic acid for pain and bleeding. Check doses and cautions against the current SPC and the Greater Manchester formulary. <b>Ask about pregnancy plans before offering anything</b> — it is the question that determines the whole ladder."},
    {tone:"blue", h:"Examination and imaging are targeted, not routine", html:"Offer abdominal and pelvic examination where there are related symptoms, abnormal bleeding patterns, suspected structural disease, or before LNG-IUS fitting, and examine before arranging investigations. In a woman with uncomplicated HMB and no other concerning symptoms, pharmacological treatment can be started without pelvic examination if clinically appropriate. Arrange transvaginal ultrasound where there is a palpable uterus or mass, persistent intermenstrual bleeding, treatment failure, or suspected adenomyosis or fibroids."},
    {tone:"purple", h:"🟣 NG12 — two routes run straight through this presentation", html:"NICE NG12 (updated April 2026). Endometrial cancer: unexplained post-menopausal bleeding aged 55 or over that cannot be attributed to HRT → suspected cancer pathway referral (appointment within 2 weeks); under 55 with unexplained post-menopausal bleeding not attributable to HRT → consider a suspected cancer pathway referral. Confirm the bleeding is truly post-menopausal, manage HRT-related bleeding on the HRT pathway, and do not falsely reassure women under 55. Ovarian cancer: ascites or a pelvic or abdominal mass that is not obviously fibroids → suspected cancer pathway referral. Colorectal cancer: iron-deficiency anaemia — do not attribute it to the periods without thought. Offer quantitative FIT to adults with iron-deficiency anaemia, regardless of age, and refer on the suspected colorectal cancer pathway if FIT is ≥10 µg Hb/g; do not delay referral where concern remains high despite a low or unavailable FIT result. Menstrual loss may explain IDA, but only if proportionate to its severity, persistence, age and other features. Also: an abnormal-looking or abnormal-feeling cervix → urgent suspected cervical cancer (colposcopy) pathway referral irrespective of screening history. Restated in <a href='#refer'>Refer</a>."}
  ],
  pathwaySub:"Five steps, and treatment starts at step three rather than after the investigations.",
  pathway:[
    {title:"Exclude the emergency and the cancer routes", html:"Haemodynamic compromise from acute heavy bleeding → admit. Unexplained post-menopausal bleeding at 55 or over (not attributable to HRT) → suspected cancer pathway referral. Pelvic mass not obviously fibroids, or ascites → gynaecology suspected cancer pathway referral. Abnormal-looking or abnormal-feeling cervix → urgent suspected cervical cancer pathway referral, not a generic HMB route. Iron-deficiency anaemia at any adult age → offer quantitative FIT and use the colorectal pathway if ≥10 µg Hb/g or concern remains high.", alert:true},
    {title:"Take the history that actually classifies it", html:"Impact on life · flooding, clots, double protection, night changes · cycle regularity · intermenstrual or post-coital bleeding · pain · pressure or bulk symptoms · bleeding elsewhere (gums, epistaxis, post-partum or post-surgical) suggesting a coagulopathy · drugs including anticoagulants and copper IUD · pregnancy plans."},
    {title:"Investigate — FBC in everyone, the rest targeted", html:"Examine first where indicated. FBC in all, in parallel with treatment; ferritin only where it will change management. If HMB has been present since menarche and the history suggests a bleeding disorder, discuss testing with haematology. TFTs only if there are thyroid symptoms. Do not test for thyroid disease routinely."},
    {title:"Start treatment now, split by pregnancy plans", html:"Not trying to conceive: LNG-IUS first-line where suitable; if unsuitable or declined, tranexamic acid, an NSAID, CHC or cyclical oral progestogen. Trying to conceive: tranexamic acid, with or without mefenamic acid. <b>Treat in parallel with any investigation, not after it.</b>"},
    {title:"Replace the iron, and review", html:"Once-daily or alternate-day oral iron according to tolerance and local guidance, until haemoglobin has corrected and iron stores are replenished (duration individualised). Review response after an appropriate trial, usually around 3 months for medical therapy, earlier if symptoms are severe or worsening."}
  ],

    {id:"safety", nav:"Red flags", title:"Red flags — the emergency, the cancers and the coagulopathy",
     blocks:[
       {b:"table", head:["Feature","Meaning","Action"], rows:[
         ["Acute torrential bleeding with tachycardia, hypotension, dizziness or collapse","<b>Haemodynamically significant haemorrhage</b>","Emergency admission. Cannulate if able; consider tranexamic acid; arrange urgent gynaecology assessment"],
         ["<b>Unexplained post-menopausal bleeding aged 55 or over that cannot be attributed to HRT</b>","<b>Endometrial cancer until excluded</b>","NICE NG12 (updated April 2026): suspected cancer pathway referral. Under 55 with unexplained PMB not attributable to HRT: consider a suspected cancer pathway referral. Confirm the bleeding is truly post-menopausal and do not falsely reassure women under 55. Bleeding on HRT: manage on the HRT pathway — see <a href='../algorithms/bleeding-on-hrt.html'>bleeding on HRT</a>"],
         ["<b>Ascites, or a pelvic or abdominal mass that is not obviously uterine fibroids</b>","<b>Ovarian cancer until excluded</b>","NICE NG12 (updated April 2026): suspected cancer pathway referral. Persistent bloating, early satiety, pelvic or abdominal pain, or urinary urgency or frequency aged 40 or over → CA125 in primary care and urgent direct-access ultrasound if at or above the age threshold (35 IU/mL at 40–49, 31 at 50–59, 24 at 60–69, 25 at 70–79, 31 at 80 or over); aged 39 or under, do not rely on CA125 alone — consider ultrasound"],
         ["<b>Cervix that looks or feels abnormal on examination</b>","<b>Cervical cancer</b>","Urgent referral through the suspected cervical cancer (colposcopy) pathway, not a generic gynaecology or HMB route — a recent normal cervical screening result does not exclude invasive disease and must not delay referral"],
         ["Iron-deficiency anaemia at any adult age, especially if out of proportion to the bleeding described","Do not attribute IDA to periods reflexively — GI malignancy and coeliac disease both present this way","NICE NG12: offer quantitative FIT to adults with IDA regardless of age; refer on the suspected colorectal cancer pathway if ≥10 µg Hb/g, and do not delay referral where concern remains high despite a low or unavailable result. Check coeliac serology. See <a href='iron-deficiency-anaemia.html'>iron-deficiency anaemia</a>"],
         ["<b>Persistent intermenstrual or post-coital bleeding</b>","<b>Endometrial or cervical pathology, polyp, or infection</b>","Examine the cervix, arrange transvaginal ultrasound, and refer for hysteroscopy where it persists"],
         ["Heavy bleeding since menarche, with easy bruising, epistaxis, bleeding gums, or post-partum or post-dental haemorrhage; or a family history","Inherited bleeding disorder — von Willebrand disease is the commonest and is substantially under-diagnosed in women","Discuss testing with haematology and arrange a locally appropriate coagulation and von Willebrand pathway: von Willebrand factor varies with stress, inflammation, pregnancy and oestrogen, repeat sampling may be needed, a normal initial result does not exclude it, and a routine coagulation screen is not a sensitive test. Tranexamic acid is particularly useful here"],
         ["Risk factors for endometrial pathology: persistent intermenstrual or irregular bleeding, infrequent heavy bleeding with obesity (BMI 30 or over) or PCOS, unopposed oestrogen, tamoxifen, nulliparity, family history of Lynch syndrome, unsuccessful treatment. Age informs judgement but is not a standalone NG88 criterion","Endometrial hyperplasia or carcinoma even without post-menopausal bleeding","Lower the threshold for hysteroscopy, with endometrial sampling at hysteroscopy; do not use blind endometrial biopsy as the routine test. Refer rather than treating empirically for long"],
         ["Rapidly enlarging pelvic mass, or new pain and bulk symptoms with a known fibroid","<b>Degeneration, torsion, or rarely leiomyosarcoma</b>","<b>Urgent gynaecology assessment and imaging</b>"]
       ]},
       {b:"warn", html:"<b>Two errors define this presentation.</b> <b>The first is treating the bleeding and ignoring the iron:</b> a woman can have her periods controlled and be left profoundly iron-deficient for months, because the FBC was taken and never acted on, or the iron deficiency was never acted on. The second is attributing iron-deficiency anaemia to menstruation without asking whether the bleeding actually accounts for it — at any adult age, and especially where the history does not fit, that assumption is a recognised route to a delayed colorectal cancer diagnosis. Both are avoided by treating the FBC as a result requiring action rather than a box completed."}
     ]},

    {id:"assess", nav:"Assess", title:"Assessment, examination and investigation",
     blocks:[
       {b:"table", head:["Element","What to do","Why"], rows:[
         ["<b>Impact — the NG88 definition in practice</b>","\"What does a heavy day look like for you?\" Flooding through clothes or bedding · clots · changing protection hourly · using two products together · getting up at night to change · days off work, school or exercise · avoiding leaving the house","<b>This IS the diagnosis — there is no volume threshold to meet.</b> It also gives the baseline against which treatment is judged at 3 months"],
         ["<b>Bleeding pattern</b>","Regular or irregular · cycle length · duration · intermenstrual, post-coital or post-menopausal bleeding","Regular heavy bleeding suggests fibroids, adenomyosis or a coagulopathy; irregular bleeding suggests anovulation, polyps, hyperplasia or malignancy and changes the urgency"],
         ["<b>Pain, pressure and bulk</b>","Dysmenorrhoea, deep dyspareunia, pelvic pressure, urinary frequency, a palpable mass","Pain with heavy bleeding points to adenomyosis or endometriosis (see <a href='dysmenorrhoea.html'>dysmenorrhoea</a>); bulk symptoms point to fibroids"],
         ["<b>Bleeding-disorder screen</b>","Heavy since menarche? Epistaxis, bleeding gums, easy bruising, post-partum or post-surgical or post-dental bleeding? Family history?","Von Willebrand disease is common and under-diagnosed in women; a positive screen changes both the investigation and the treatment"],
         ["<b>Drugs and devices</b>","Anticoagulants and antiplatelets · copper IUD (increases loss) · missed or erratic hormonal contraception · tamoxifen · herbal preparations","A copper IUD is a common and easily-reversed cause; anticoagulation needs a joint decision rather than simple discontinuation"],
         ["<b>Pregnancy plans</b>","<b>Ask directly, early</b>","It determines the entire treatment ladder, because the most effective options are all contraceptive"],
         ["<b>Examination</b>","Offer abdominal and pelvic examination where there are related symptoms, abnormal bleeding patterns, suspected structural disease or before LNG-IUS fitting, and examine before investigations. In uncomplicated HMB with no other concerning symptoms, pharmacological treatment can be started without pelvic examination if clinically appropriate","Looking for an enlarged or irregular uterus, adnexal mass, and an abnormal cervix. Chaperone and explicit consent"],
         ["<b>Investigations</b>","FBC in ALL, in parallel with treatment. Ferritin is not routine (NG88): consider it where iron deficiency is suspected despite a normal haemoglobin, anaemia is present, symptoms are disproportionate, or the result will influence iron replacement or further investigation. If HMB since menarche and the history suggests a bleeding disorder, discuss coagulation and von Willebrand testing with haematology. TFTs only if thyroid symptoms — NG88 says do not test routinely. Chlamydia screen if at risk. hCG if pregnancy is possible","Do not order routine TFTs, hormone profiles or a \"female hormone panel\" — they do not change management in regular heavy bleeding"],
         ["<b>Imaging and hysteroscopy</b>","Transvaginal ultrasound where: uterus palpable abdominally or a pelvic mass · suspected adenomyosis or fibroids · persistent intermenstrual bleeding · treatment failure · examination is difficult or declined. Hysteroscopy where a submucosal fibroid, polyp or endometrial pathology is suspected","Hysteroscopy, not ultrasound, is the investigation for suspected endometrial polyp or submucosal fibroid; ultrasound does not reliably exclude intracavity lesions. MRI and saline-infusion sonography are not first-line. Consider endometrial sampling at hysteroscopy where bleeding is persistent or irregular, hyperplasia risk factors are present, tamoxifen is used, or treatment has failed. Do not perform blind endometrial biopsy as the routine diagnostic test for HMB"]
       ]}
     ]},

    {id:"treat", nav:"Treat", title:"Treatment — split by whether she wants contraception and whether she wants a baby",
     sub:"Review response after an appropriate trial, usually around 3 months for medical therapy, earlier if symptoms are severe or worsening, with the impact measures from the history as the outcome. Do not delay referral where there are abnormal bleeding patterns, high-risk features or significant anaemia.",
     blocks:[
       {b:"table", head:["Situation","Treatment","Notes"], rows:[
         ["<b>Contraception acceptable — FIRST LINE</b>","<b>LNG-IUS 52 mg</b>","NG88 first-line where there is no identified pathology, fibroids under 3 cm not distorting the cavity, or suspected or diagnosed adenomyosis. Usually the most effective first-line medical option when suitable; treats dysmenorrhoea, and is contraceptive. <b>Explain that irregular bleeding is common initially and may last longer than 6 months; allow at least 6 cycles to assess benefit</b> — otherwise it is removed early and recorded as a failure"],
         ["<b>Contraception acceptable, LNG-IUS declined or unsuitable</b>","Tranexamic acid, an NSAID, a combined hormonal contraceptive (consider continuous or tricycled use rather than cyclical) or cyclical oral progestogen, according to NG88 and individual contraindications","Reduces loss and regulates the cycle; check UKMEC (migraine with aura, BMI, smoking over 35, VTE risk). Continuous use avoids the withdrawal bleed entirely"],
         ["<b>Contraception acceptable, oestrogen contraindicated</b>","Cyclical oral progestogen — norethisterone 5 mg TDS from day 5 to 26 (check the current SPC and formulary) · or tranexamic acid or an NSAID","Norethisterone at this dose and schedule is for cycle control and is NOT contraceptive — say so explicitly. Discuss progestogen-only contraceptive methods (depot medroxyprogesterone, implant) separately for their contraceptive role and likely bleeding pattern; they are not standard HMB treatments"],
         ["<b>TRYING TO CONCEIVE, or hormones declined</b>","Tranexamic acid, started when bleeding begins · with or without mefenamic acid. Exact doses per the current SPC and the Greater Manchester formulary","Tranexamic acid is antifibrinolytic, not hormonal, and does not affect fertility — the key option in this group. Stop if no improvement after 3 cycles. <b>Tranexamic acid cautions:</b> active or previous thromboembolic disease, renal impairment, visual symptoms, combined hormonal contraception and individual VTE risk, and heavy bleeding from an undiagnosed structural or malignant cause. <b>Mefenamic acid cautions:</b> peptic ulcer or GI bleeding, renal impairment, cardiovascular disease, NSAID-sensitive asthma, anticoagulants and other bleeding-risk medicines, and pregnancy"],
         ["<b>Fibroids 3 cm or larger, or distorting the cavity</b>","<b>Refer — but start tranexamic acid, an NSAID or a CHC meanwhile</b>","Options include uterine artery embolisation, myomectomy, hysterectomy, or specialist medical therapy. <b>Do not leave her untreated while waiting</b>"],
         ["<b>Acute heavy bleeding without haemodynamic compromise</b>","Use a locally approved temporary regimen after excluding pregnancy and assessing contraindications, haemodynamic status, thrombotic risk and possible structural or malignant pathology","Not a long-term plan. Severe, persistent or haemodynamically significant bleeding requires same-day gynaecological assessment; seek specialist advice"],
         ["<b>What NOT to do</b>","Do not offer routine TFTs or hormone panels · do not use danazol, etamsylate or oral progestogen in the luteal phase alone (days 15–26) for HMB · do not delay treatment pending investigation","Luteal-phase-only progestogen is specifically not recommended by NG88 and is still prescribed"],
         ["<b>GnRH analogue — secondary care</b>","Leuprorelin 3.75 mg IM monthly, for a maximum of 6 months, with add-back HRT","Used for pre-surgical downregulation of fibroids, not as a primary-care treatment. <b>Add-back HRT prevents the hypo-oestrogenic symptoms and bone loss</b> — the reason the 6-month cap exists. Specialist-initiated; a GP may be asked to continue or monitor it"],
         ["<b>Endometrial ablation</b>","A second-line surgical option for refractory HMB where the cavity is normal or there are small fibroids, and the family is complete","Not for a woman who may want a future pregnancy, and effective contraception is still needed afterwards. Sits between medical treatment and hysterectomy — worth naming, because women often assume hysterectomy is the only surgical option and decline referral on that basis"]
       ]},
       {b:"why", html:"The reason NG88 puts the LNG-IUS first, above the pill, is effect size: it is usually the most effective first-line medical option when suitable, while also treating dysmenorrhoea and providing contraception. Choice still depends on fertility plans, desire for contraception, cavity distortion, adenomyosis or fibroids, migraine and VTE risk, patient preference, and tolerance of irregular bleeding and insertion. The reason it is under-used is largely about the early months — irregular bleeding is common initially and may last longer than six months, and a woman who was not warned reasonably concludes it has made things worse and asks for removal. So the counselling is not a courtesy; it is the difference between a highly effective treatment and a failed one. And the single question that reorganises the whole ladder is \"are you hoping to get pregnant?\" — because the hormonal options cannot be used while actively trying to conceive (fertility generally returns after stopping), and tranexamic acid exists precisely for the woman who is trying."}
     ]},

    {id:"iron", nav:"Iron", title:"Iron deficiency — the part most often left undone",
     blocks:[
       {b:"table", head:["Step","Detail"], rows:[
         ["<b>Test properly</b>","<b>FBC in every woman with HMB (NG88).</b> Ferritin is not routine: consider it where iron deficiency is suspected despite a normal haemoglobin, anaemia is present, symptoms are disproportionate, or the result will influence treatment. If ferritin confirms iron deficiency, consider iron replacement even when haemoglobin is normal, based on symptoms, degree of deficiency and the clinical context"],
         ["<b>Replace effectively</b>","Ferrous sulfate 200 mg (or ferrous fumarate, or ferrous gluconate). Consider once-daily or alternate-day oral iron according to tolerance and local iron-replacement guidance; alternate-day dosing may improve absorption and tolerability (current practice, not an NG88 requirement). Avoid tea, coffee and calcium around the dose. Vitamin C is not needed for every preparation; review whether any PPI is clinically necessary rather than simply avoiding it"],
         ["<b>Continue long enough</b>","<b>Continue until haemoglobin has corrected and iron stores are replenished; individualise the duration.</b> Stopping as soon as the haemoglobin corrects is a common reason for recurrence"],
         ["<b>Manage the side effects rather than abandoning treatment</b>","Constipation, nausea and dark stools are common. Alternate-day dosing, taking it with food, or switching salt usually solves it. \"Iron does not agree with me\" almost always means TDS dosing on an empty stomach"],
         ["<b>Re-check</b>","<b>FBC (and ferritin where used) after an appropriate trial, usually around 3 months, then per response.</b> Failure to respond → check adherence, consider coeliac disease, ongoing loss, or malabsorption"],
         ["<b>When to think beyond menstruation</b>","Any adult with iron-deficiency anaemia · anaemia out of proportion to the severity and persistence of bleeding · GI symptoms · weight loss · family history of bowel cancer","<b>Offer quantitative FIT regardless of age and check coeliac serology; refer on FIT ≥10 µg Hb/g (NICE NG12); do not delay referral where concern remains high despite a low or unavailable FIT</b>"],
         ["<b>When to refer for IV iron</b>","Oral iron not tolerated or ineffective, malabsorption, or the need for rapid correction before surgery","Per local pathway; increasingly available in community and day-unit settings"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"⚠ The FBC that was taken and never actioned", html:"<b>Ordering the FBC is not the intervention — replacing the iron is.</b> Diarise the result, act on the haemoglobin and on the ferritin where checked, and give a review date rather than an open-ended prescription."},
         {tone:"green", h:"✓ What to tell her about iron", html:"\"Take it once a day or every other day, whichever suits you better — every other day may absorb better and upset your stomach less. Don't take it with tea or coffee. Your stools will go dark, which is harmless. And keep going after your blood count is normal until your iron stores are refilled — we will check how long you need.\""}
       ]}
     ]},

    {id:"monitor", nav:"Follow up", title:"Review and safety-netting",
     blocks:[
       {b:"table", head:["When","What to check"], rows:[
         ["<b>After an appropriate trial (usually around 3 months; earlier if severe or worsening)</b>","Impact measures against baseline — flooding, protection changes, days lost — not a volume estimate · tolerance · FBC rechecked (ferritin where used) · adherence to iron · if no better, change treatment, investigate further or refer"],
         ["<b>After an LNG-IUS (allow at least 6 cycles)</b>","Bleeding pattern — irregular bleeding is common initially and may last longer than 6 months; NICE advises allowing at least 6 cycles to assess benefit. Check threads. Do not remove for irregular bleeding alone if loss is improving; reassure and wait"],
         ["<b>At treatment failure</b>","Re-examine, arrange transvaginal ultrasound if not done, consider hysteroscopy with endometrial sampling where bleeding is persistent or irregular, hyperplasia risk factors are present or tamoxifen is used (no blind biopsy), and refer"],
         ["<b>Annually where treatment is working</b>","FBC (ferritin if indicated) · blood pressure and BMI on a CHC · UKMEC recheck · LNG-IUS expiry date for the HMB indication · pregnancy plans · perimenopausal changes and whether the plan still fits"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 Same day", html:"\"If you are soaking through a pad every hour for more than a couple of hours, or you feel faint, breathless or your heart is racing, contact us the same day or go to A&amp;E.\""},
         {tone:"amber", h:"🟠 Come back sooner", html:"Bleeding between periods or after sex · any bleeding after the menopause · bleeding that suddenly becomes much heavier or more painful · new pelvic pressure or a lump."},
         {tone:"blue", h:"💊 The coil settling-in period", html:"\"For the first few months, and sometimes for longer than six, expect irregular bleeding — it is not a sign it is failing. We usually allow at least six cycles to judge how well it works. If it is troublesome, come back and we will review it rather than you putting up with it.\""},
         {tone:"green", h:"✓ This is treatable", html:"\"Heavy periods are not something to endure. We measure success by whether your life changes — fewer days off, no flooding, not planning around it. If the first treatment does not do that, there are others.\""}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Emergency — same day", html:"Haemodynamically significant bleeding · suspected malignancy with acute heavy bleeding · severe symptomatic anaemia requiring transfusion."},
         {tone:"purple", h:"Suspected cancer · NICE NG12 (updated April 2026)", html:"Endometrial cancer: unexplained post-menopausal bleeding aged 55 or over that cannot be attributed to HRT → suspected cancer pathway referral; under 55, consider one (confirm the bleeding is truly post-menopausal, manage HRT-related bleeding on the HRT pathway, and do not falsely reassure under-55s). Ovarian cancer: ascites or a pelvic or abdominal mass not obviously uterine fibroids → suspected cancer pathway referral; persistent symptoms suggesting ovarian cancer aged 40 or over → CA125, and urgent direct-access ultrasound if CA125 is 35 IU/mL or more at 40–49, 31 or more at 50–59, 24 or more at 60–69, 25 or more at 70–79, or 31 or more at 80 or over (aged 39 or under: do not use CA125 alone; consider ultrasound). Cervical cancer: an abnormal-looking or abnormal-feeling cervix → urgent suspected cervical cancer (colposcopy) pathway referral, not a generic gynaecology route, irrespective of screening history. Colorectal cancer: iron-deficiency anaemia in any adult → offer quantitative FIT, and refer on the suspected colorectal cancer pathway if ≥10 µg Hb/g; do not delay referral where concern remains high despite a low or unavailable FIT."},
         {tone:"amber", h:"Gynaecology — urgent or routine", html:"Fibroids 3 cm or larger, or distorting the cavity · suspected adenomyosis needing imaging or specialist management · persistent intermenstrual bleeding · treatment unsuccessful, not tolerated, declined or contraindicated, or severe symptoms, particularly when structural or endometrial pathology is suspected · rapidly enlarging pelvic mass. <b>Keep her on treatment while she waits.</b>"},
         {tone:"blue", h:"Hysteroscopy and endometrial biopsy", html:"Hysteroscopy for suspected submucosal fibroid, endometrial polyp or endometrial pathology. Consider endometrial sampling at hysteroscopy for persistent or irregular bleeding · unsuccessful treatment · hyperplasia risk factors (infrequent heavy bleeding with obesity or PCOS, unopposed oestrogen, tamoxifen, Lynch syndrome). Do not perform blind endometrial biopsy as the routine diagnostic test for HMB."},
         {tone:"blue", h:"Haematology", html:"Suspected inherited bleeding disorder — heavy since menarche with mucocutaneous bleeding or a family history; discuss testing with haematology and follow a locally appropriate coagulation and von Willebrand pathway. Also for IV iron where oral iron fails or is not tolerated."},
         {tone:"green", h:"Contraception and menopause services", html:"Complex contraceptive decisions, difficult LNG-IUS fitting, or perimenopausal bleeding where HRT is also being considered — see <a href='hrt-prescribing.html'>HRT prescribing</a> and <a href='contraception.html'>contraception</a>."},
         {tone:"cream", h:"GP management", html:"Most heavy menstrual bleeding is managed entirely here: the impact history, the FBC acted upon (ferritin where indicated), the LNG-IUS or tranexamic acid depending on pregnancy plans, iron replaced properly and for long enough, and referral only where structure or failure demands it. Related pages: <a href='dysmenorrhoea.html'>dysmenorrhoea</a> · <a href='iron-deficiency-anaemia.html'>iron-deficiency anaemia</a> · <a href='pcos.html'>PCOS</a> · <a href='hrt-prescribing.html'>HRT</a> · <a href='../algorithms/bleeding-on-hrt.html'>bleeding on HRT</a>."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 44-year-old woman describes periods that have become \"a nightmare\" over two years: regular but lasting 8 days, <b>flooding through to her clothes</b>, changing a super tampon and a pad together hourly on the worst two days, and <b>two days off work most months</b>. She is exhausted and breathless climbing stairs. She has <b>a copper IUD fitted five years ago</b>, and mentions in passing that she has always bruised easily and had \"a lot of bleeding\" after a dental extraction. She is not planning any more children. She asks whether she needs \"a hysterectomy like my mother had\"."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Uses the NG88 impact definition rather than asking her to quantify volume; <b>checks FBC, adds ferritin because iron deficiency is suspected, and treats it properly</b> — once-daily or alternate-day dosing, continued until haemoglobin and stores are replenished; <b>identifies the copper IUD as a contributing and reversible cause</b>; picks up the bleeding-disorder history (easy bruising, post-dental haemorrhage) and discusses coagulation and von Willebrand testing with haematology, which is the finding most candidates miss; <b>asks about pregnancy plans before offering treatment</b>; offers the LNG-IUS as first-line — which can replace the copper coil at the same procedure — with explicit counselling that irregular bleeding is common initially and may last beyond 6 months; <b>offers tranexamic acid as an immediate non-hormonal option meanwhile</b>; plans hysteroscopy with endometrial sampling if treatment fails and states the hyperplasia risk factors; screens the NG12 routes — no PMB here, but offers FIT for the IDA rather than attributing it automatically to her periods; <b>addresses the hysterectomy question directly and proportionately</b>, explaining the ladder before surgery; and names the impact on her work and energy as the outcome to be measured at 3 months."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG88 (2018, updated July 2026) — Heavy menstrual bleeding: assessment and management</b><br><a href="https://www.nice.org.uk/guidance/ng88" rel="noopener">nice.org.uk/guidance/ng88</a><span class="rd"> — the quality-of-life definition and the instruction not to measure blood loss, FBC in all women and no routine ferritin, when examination and imaging are needed, hysteroscopy rather than blind endometrial biopsy, the LNG-IUS as first-line, tranexamic and mefenamic acid, the recommendation against routine thyroid testing, and against luteal-phase-only progestogen, danazol and etamsylate</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — the April 2026 amendments: unexplained post-menopausal bleeding not attributable to HRT (refer at 55 and over, consider under 55), and age-specific CA125 thresholds for direct-access ultrasound (CA125 not used alone at 39 and under); plus the pelvic mass or ascites route, the abnormal cervix, and quantitative FIT for iron-deficiency anaemia at any adult age, with referral at ≥10 µg Hb/g</span></li>'+
         '<li><b>NICE NG88 \u2014 Heavy menstrual bleeding: assessment and management</b><br><a href="https://www.nice.org.uk/guidance/ng88" rel="noopener">nice.org.uk/guidance/ng88</a><span class="rd"> — the primary-care assessment, the cyclical norethisterone regimen and its non-contraceptive status</span></li>'+
         '<li><b>FSRH — UKMEC and Combined Hormonal Contraception</b><br><a href="https://www.fsrh.org" rel="noopener">fsrh.org</a><span class="rd"> — eligibility criteria, and continuous or extended CHC regimens</span></li>'+
         '<li>British Society for Haematology and British Society of Gastroenterology — iron deficiency guidance<span class="rd"> — current iron-replacement practice (not an NG88 requirement): once-daily or alternate-day oral iron, individualised duration, and indications for intravenous iron</span></li>'+
         '<li><b>Summaries of Product Characteristics (electronic medicines compendium)</b> and <b>Greater Manchester Medicines Management Group formulary</b><br><a href="https://www.medicines.org.uk/emc" rel="noopener">medicines.org.uk/emc</a> · <a href="https://www.greatermanchesterformulary.nhs.uk" rel="noopener">greatermanchesterformulary.nhs.uk</a><span class="rd"> — exact prescribing for tranexamic acid, mefenamic acid, norethisterone, iron preparations and GnRH analogues</span></li>'+
         '<li><b>Von Willebrand disease in women — BSH and RCOG guidance</b><span class="rd"> — heavy menstrual bleeding since menarche as a presentation of inherited bleeding disorder, and the role of tranexamic acid</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Heavy menstrual bleeding — NICE NG88 (2018, updated July 2026), NICE NG12 (updated April 2026), FSRH UKMEC and BSH iron guidance. The patient defines \"heavy\", not a measuring jug: impact on life is the diagnosis. FBC in every woman, ferritin only where it will change management, and act on the result. LNG-IUS first-line where suitable if contraception is acceptable — with explicit counselling that irregular bleeding is common initially and may last beyond 6 months. Tranexamic acid if she is trying to conceive. Replace iron once daily or on alternate days until haemoglobin and stores are replenished. Unexplained post-menopausal bleeding at 55 or over, not attributable to HRT, is a suspected cancer pathway referral, and iron-deficiency anaemia is not automatically the periods. Verify all doses against the current SPC and the Greater Manchester formulary before prescribing."
