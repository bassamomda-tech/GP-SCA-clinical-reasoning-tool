<script>
MG.render({
  icon:"🍄",
  title:"Pityriasis Versicolor",
  eyebrow:"Protocol · assess and manage in one place",
  stemTitle:"Pityriasis versicolor — clear the yeast fast, then explain why the colour won’t follow for months",
  stemSub:"A harmless overgrowth of the Malassezia yeast that lives on everyone’s skin, producing scaly pale, pink or brown patches over the upper trunk. The clinical work is short: confirm the fine scale, exclude vitiligo and the rarer look-alikes, clear it with a ketoconazole shampoo used as a body wash, keep oral itraconazole for widespread or resistant disease, and — the part that decides whether the patient comes back unhappy — explain that pigment takes months to recover and that the rash tends to return. Sources: PCDS · BAD 2023 · ketoconazole and itraconazole SPCs · MHRA 2013 · BNF.",
  guideline:"PCDS pityriasis versicolor guidance · BAD patient information (June 2023) · itraconazole SPC",
  meta:[
    {t:"PCDS clinical guidance · PCDS patient leaflet Dec 2023"},
    {t:"BAD patient information Jun 2023"},
    {t:"Ketoconazole 2% shampoo and itraconazole SPCs · BNF"},
    {t:"MHRA Drug Safety Update August 2013 · oral ketoconazole"},
    {t:"No NG12 criterion applies"}
  ],
  lead:"<div class='mg-layers'><a href='#flags'><b>Is it PV?</b><small>Scale, trunk, not vitiligo</small></a><a href='#topical'><b>Treat</b><small>Shampoo as body wash</small></a><a href='#oral'><b>Oral</b><small>Itraconazole 200 mg × 7 days</small></a><a href='#recur'><b>Prevent</b><small>2–4-weekly wash</small></a></div>",
  quickSub:"The five points that make this a single consultation. Each figure traces to a source under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"blue", h:"Scale is the clue", html:"Oval, well-defined macules over the chest, back, neck and upper arms that are <b>paler or darker than the surrounding skin</b> and show fine, branny scale when the surface is gently stretched or scraped. Little or no itch. Common in young adults and in warm, humid conditions."},
    {tone:"cream", h:"First-line: ketoconazole shampoo on the skin", html:"Apply <b>ketoconazole 2% shampoo</b> to wet affected skin, lather over the whole affected area (not only the obvious patches), leave for <b>3–5 minutes</b> according to the product SPC, then rinse — <b>once daily for 5 days</b>. Some dermatology guidance (PCDS) uses a longer contact time (about 10 minutes); follow the local protocol consistently. Selenium sulfide shampoo or an imidazole cream for small areas are alternatives."},
    {tone:"amber", h:"Oral only for widespread or resistant disease", html:"PCDS adds <b>itraconazole 200 mg once daily for 7 days</b> for extensive disease or failure of a correctly applied topical course, preferably after confirming the diagnosis with microscopy if there is any doubt. Check the current SPC, liver, renal and cardiac history (heart failure), pregnancy and breastfeeding, and every medicine for CYP3A4 and QT interactions (particularly statins such as simvastatin). <b>Oral terbinafine does not work</b> here, and <b>oral ketoconazole must not be used</b> (MHRA 2013)."},
    {tone:"green", h:"Colour lags by months — that isn’t failure", html:"Once the yeast has gone the scale disappears, but BAD and PCDS both warn that the <b>pale patches take several months</b> to regain their normal colour. Say this before you prescribe."},
    {tone:"cream", h:"It comes back — plan for it", html:"Recurrence is common. Re-treat when scale returns, not because pigment remains abnormal. For frequent, clearly documented recurrences, consider <b>ketoconazole shampoo as a short-contact body wash every 2–4 weeks</b> for about 6 months, or according to local dermatology advice (PCDS). Not needed after a single uncomplicated episode, and not indefinitely without review."}
  ],
  pathwaySub:"Five steps. The blue step is where misdiagnosis happens.",
  pathway:[
    {title:"Look and scrape", html:"Upper trunk distribution, variable colour, and fine scale on gentle scraping. Ask about sun exposure — patches become more obvious when the surrounding skin tans."},
    {title:"Exclude the look-alikes", html:"No scale and complete depigmentation suggests vitiligo; a herald patch and ‘fir-tree’ pattern suggests pityriasis rosea; ill-defined pale facial patches in a child suggest pityriasis alba. Persistent, unusual or treatment-resistant patches need a second look."},
    {title:"Confirm if in doubt", html:"Direct microscopy of skin scrapings (short hyphae and round yeasts) is the most useful test when the diagnosis is uncertain, treatment has failed, or oral treatment is being considered. Wood’s light may provide supportive evidence, but its sensitivity is limited. Neither is needed when the picture is typical."},
    {title:"Treat topically, then orally if needed", html:"Ketoconazole 2% shampoo as a body wash for 5 days. Itraconazole 200 mg daily for 7 days only if extensive or after failure of a correctly applied topical course, preferably after microscopy if there is any doubt, and after checking contraindications and interactions."},
    {title:"Counsel pigment and recurrence", html:"Months for the colour to even out; re-treat only when scale returns; an intermittent antifungal wash for people with frequent relapses; come back if the patches keep spreading or behave unusually."}
  ],
  sections:[
    {id:"flags", nav:"Red flags", title:"Red flags — when the patches are not pityriasis versicolor", sub:"Pityriasis versicolor itself is never dangerous. The risk lies in labelling something else as PV and treating it with shampoo for a year.",
     blocks:[
       {b:"warn", html:"Active pityriasis versicolor usually has fine <b>scale</b>, which may only become evident on stretching or scraping, and favours the <b>upper trunk</b>. Once treated, the scale disappears before the colour normalises, so persistent colour change without scale should not automatically trigger another antifungal course. Patches without scale, patches that are completely white, patches confined to the face, hands or genitals, or patches that fail to respond to a correctly used antifungal should make you reconsider the diagnosis."},
       {b:"cards", items:[
         {tone:"amber", h:"No response to a correctly applied topical course", html:"First check how it was applied and reconsider the diagnosis; obtain microscopy before repeating or escalating treatment. A negative scraping does not completely exclude the diagnosis, particularly after recent antifungal treatment, but should prompt reconsideration rather than indefinite empiric treatment.", src:"PCDS pityriasis versicolor guidance"},
         {tone:"amber", h:"Persistent hypopigmented or scaly patches in a sun-protected distribution in an adult", html:"Persistent, progressive, atypical or treatment-resistant hypopigmented patches warrant dermatology advice, particularly if there is little or no scale, infiltration, poikiloderma, symptoms or an unusual distribution. Rare mimics include hypopigmented mycosis fungoides and sarcoidosis; consider leprosy only with sensory loss, nerve enlargement or relevant travel or residence. Do not biopsy in primary care unless within your competence and the local dermatology pathway."},
         {tone:"amber", h:"Extensive, frequently relapsing disease", html:"Consider factors that favour Malassezia overgrowth: heavy sweating, occlusive clothing, oily skin preparations, and immunosuppression including systemic corticosteroids. Ask about diabetes symptoms where the history suggests it."},
         {tone:"blue", h:"Pale patches with no scale", html:"Pale patches without scale are not typical of active pityriasis versicolor. Consider vitiligo (chalk-white, sharply defined, often around the eyes, mouth, hands and genitals), post-inflammatory hypopigmentation, progressive macular hypomelanosis, pityriasis alba and, rarely, hypopigmented mycosis fungoides or leprosy. Distribution, border, Wood’s light findings and sensation should guide further assessment. Antifungals will not help.", src:"PCDS pityriasis versicolor guidance"},
         {tone:"blue", h:"NG12 — no criterion applies", html:"Pityriasis versicolor does not map to any NICE NG12 (updated April 2026) suspected-cancer criterion. A separate, changing pigmented lesion found during the examination is assessed on its own merits.", src:"NICE NG12 (updated April 2026)"}
       ]},
       {b:"why", html:"Malassezia species are part of normal skin flora. The rash appears when the yeast switches to a hyphal form and multiplies in the stratum corneum. Pale patches arise because yeast metabolites (such as azelaic acid and related compounds) interfere with melanin production and because the scale screens ultraviolet light; dark patches reflect inflammation and thickened scale. That is why clearing the yeast removes the scale quickly but leaves the pigment change for months, and why a scale-free white patch points away from this diagnosis."}
     ]},

    {id:"recognise", nav:"Recognising it", title:"Recognising it — the clinical picture", sub:"Most diagnoses are made in the first ten seconds of looking at the back. The rest of the history confirms rather than establishes it.",
     blocks:[
       {b:"dl", rows:[
         ["<b>Who</b>","Adolescents and young adults most often; uncommon before puberty and in older adults because sebaceous activity is lower; a new diagnosis in an older adult is possible but should prompt reconsideration if the distribution, scale or course is atypical. More frequent in hot, humid climates and after holidays in the sun."],
         ["<b>Where</b>","Upper trunk, neck, shoulders and upper arms; sometimes the face in children and people from hot climates; occasionally the groin or flexures."],
         ["<b>What it looks like</b>","Round or oval macules that merge into larger irregular patches. Colour varies — hence ‘versicolor’: pale (hypopigmented) on tanned or darker skin, pink to fawn or brown (hyperpigmented) on pale skin. Fine scale that becomes obvious when the surface is stretched or lightly scraped (the ‘evoked scale’ sign)."],
         ["<b>Symptoms</b>","Usually none, or mild itch after sweating. The usual reason to present is the cosmetic change, often noticed after sun exposure."],
         ["<b>Contagious?</b>","No. The yeast is present on everyone’s skin; the rash reflects overgrowth, not infection from someone else."],
         ["<b>Course</b>","Tends to recur, particularly in summer, in people who have had it before."]
       ]},
       {b:"say", html:"This is pityriasis versicolor. It’s caused by a yeast that lives on everybody’s skin — in some people, especially in warm weather, it grows a bit too much and changes the skin colour in patches. It isn’t catching, it isn’t a sign of poor hygiene, and it isn’t harmful."}
     ]},

    {id:"confirm", nav:"Confirming it", title:"Confirming it — scrapings and Wood’s light", sub:"Tests are for doubt, not for the typical case.",
     blocks:[
       {b:"cards", items:[
         {tone:"blue", h:"Skin scrapings for microscopy", html:"Scrape scale onto dark paper and send for mycology. Microscopy shows short hyphae with clusters of round yeast cells — the classic ‘spaghetti and meatballs’ appearance. Culture is not routinely useful because Malassezia is a normal commensal. Direct microscopy is more useful than Wood’s light when the diagnosis is uncertain or treatment has failed. A negative result does not completely exclude PV, particularly after recent antifungal treatment, but should prompt reconsideration."},
         {tone:"blue", h:"Wood’s light", html:"Wood’s light may provide supportive evidence (a yellowish fluorescence), but sensitivity is limited and it is not required for typical disease. A negative result does not exclude the diagnosis.", src:"PCDS pityriasis versicolor guidance"},
         {tone:"blue", h:"When to test", html:"Atypical site or appearance; no scale; no response to one correctly applied topical course (check application first); before systemic therapy where feasible, and always if the diagnosis is not certain; or when a patient has had repeated courses without confirmation."}
       ]}
     ]},

    {id:"ddx", nav:"Differentials", title:"Differential diagnosis at a glance", sub:"The discriminating features are scale, completeness of pigment loss, and distribution.",
     blocks:[
       {b:"table", head:["Condition","Scale?","Distinguishing features"], rows:[
         ["<b>Pityriasis versicolor</b>","Fine, branny; may need scraping","Upper trunk; variable colour; young adults; yellow fluorescence under Wood’s light in some"],
         ["<b>Vitiligo</b>","None","Complete, chalk-white depigmentation; sharp edges; periorificial, hands, genitals; bright white under Wood’s light"],
         ["<b>Pityriasis rosea</b>","Collarette of scale","Herald patch first; oval patches along skin lines (‘fir-tree’); self-limiting over weeks"],
         ["<b>Pityriasis alba</b>","Slight","Ill-defined pale patches on the face of children with atopy"],
         ["<b>Seborrhoeic dermatitis</b>","Greasy, yellowish","Scalp, eyebrows, nasolabial folds, central chest; also Malassezia-related"],
         ["<b>Post-inflammatory hypopigmentation</b>","None","Follows eczema, psoriasis or injury in the same site"],
         ["<b>Progressive macular hypomelanosis</b>","None","Symmetrical, ill-defined pale macules on the trunk of young adults, often of darker skin; does not respond to antifungals"],
         ["<b>Tinea corporis</b>","At the active edge","Annular with a raised scaly border and central clearing; itchy"],
         ["<b>Hypopigmented mycosis fungoides</b>","Slight or none","Rare; persistent, sun-protected sites, in children and adults with darker skin; dermatology advice (biopsy via the dermatology pathway)"],
         ["<b>Leprosy</b>","Slight or none","Rare; only with relevant travel or residence, sensory loss in the patches or nerve enlargement"]
       ]}
     ]},

    {id:"topical", nav:"Topical treatment", title:"Topical treatment — first-line for almost everyone", sub:"A shampoo used as a body wash reaches the whole affected area more easily than a cream.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1st", title:"Ketoconazole 2% shampoo as a body wash", when:"most patients", tone:"cream",
          html:"Apply to wet affected skin, lather over the affected area, leave for <b>3–5 minutes</b> according to the product SPC (the primary prescribing reference), then rinse; repeat <b>once daily for 5 days</b>. Some dermatology guidance (PCDS) uses a longer contact time of about 10 minutes; follow the local protocol consistently. The key is applying it broadly to the affected skin, not only to visibly obvious patches, including beyond the visible edge. Available on prescription and, for dandruff, over the counter."},
         {step:"Alt", title:"Selenium sulfide 2.5% shampoo", when:"alternative wash", tone:"cream",
          fromLabel:"if ketoconazole unsuitable",
          html:"Apply to the affected skin with a little water, leave on and rinse off, following the exact contact time and number of applications in the product SPC and patient leaflet for pityriasis versicolor. Can irritate; not suitable for broken or inflamed skin."},
         {step:"Alt", title:"Topical azole cream", when:"small, localised areas", tone:"cream",
          fromLabel:"limited disease",
          html:"Clotrimazole, miconazole, econazole or ketoconazole 2% cream, applied to the patches and a margin around them (duration per BNF). Impractical for large areas of the back. Topical terbinafine may have activity against Malassezia, but oral terbinafine is not effective for pityriasis versicolor — do not extrapolate from topical to oral treatment."}
       ]},
       {b:"say", html:"Use this shampoo like a shower gel on the patches — lather it up all over your chest and back, leave it on for the time on the label (a few minutes), then rinse off. Do that every day for five days. The flaky surface will go within a couple of weeks, but the colour will take a lot longer to come back to normal."},
       {b:"why", html:"Malassezia lives in the upper layer of skin where topical azoles reach high concentrations. Shampoo formulations spread easily over a large, hard-to-reach area such as the back, which is why they outperform creams in practice for anything more than a few patches."}
     ]},

    {id:"oral", nav:"Oral treatment", title:"Oral treatment — when, which, and what to check", sub:"Oral antifungals are reserved for widespread disease or failure of a correctly used topical course, and they carry real interaction and safety issues.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1st oral", title:"Itraconazole 200 mg once daily for 7 days", when:"widespread or resistant disease", tone:"amber",
          html:"The regimen recommended by PCDS and set out in the itraconazole capsule SPC for pityriasis versicolor. Use only for extensive disease or failure of a correctly applied topical course, preferably after confirming the diagnosis with microscopy if there is any doubt. Check the current SPC, renal and hepatic history, cardiac history and all medicines first. Capsules are taken <b>immediately after a meal</b>; absorption is reduced by acid suppression, and capsules and oral solution are absorbed differently, so check the formulation. Warn about nausea, abdominal symptoms, headache, rash and possible liver toxicity: stop and assess if jaundice, dark urine, severe nausea, marked fatigue or pruritus develops. Continue or combine with the topical wash."},
         {step:"Alt oral", title:"Fluconazole", when:"if itraconazole unsuitable", tone:"amber",
          fromLabel:"alternative",
          html:"Fluconazole may be an alternative when itraconazole is unsuitable, but dosing is regimen- and patient-specific and may be off-label. Use the local formulary, antimicrobial guideline and current SPC, with attention to renal function, QT prolongation, liver disease and drug interactions. Consider specialist advice; do not use a remembered regimen."},
         {step:"Avoid", title:"Oral terbinafine and oral ketoconazole", when:"never for PV", tone:"red",
          fromLabel:"do not use",
          html:"<b>Oral terbinafine is ineffective</b> in pityriasis versicolor because it is not concentrated in the stratum corneum in a way that suppresses Malassezia (topical terbinafine may have activity, but do not extrapolate from it to oral treatment). <b>Oral ketoconazole</b> is no longer licensed for fungal infection in the UK after the MHRA concluded in August 2013 that its liver risk outweighs its benefit; topical ketoconazole is unaffected."}
       ]},
       {b:"table", head:["Itraconazole check","Why","Source"], rows:[
         ["<b>Heart failure or ventricular dysfunction</b>","Negative inotropic effect; associated with reports of heart failure — avoid for a non-serious infection","Itraconazole SPC"],
         ["<b>Pregnancy, or could become pregnant</b>","Must not be used in pregnancy for non-life-threatening indications; women of child-bearing potential use contraception during and for a cycle after treatment, per SPC","Itraconazole SPC"],
         ["<b>Interacting medicines</b>","Potent CYP3A4 inhibitor — several substrates are contraindicated (risk of QT prolongation and torsade de pointes); check QT-prolonging medicines and the exact statin (simvastatin is contraindicated — avoid itraconazole unless the interaction is specifically managed), some calcium-channel blockers, anticoagulants and others against the current interaction reference","Itraconazole SPC · BNF interactions"],
         ["<b>Immunosuppressants</b>","Clinically important interactions with ciclosporin, tacrolimus, sirolimus and some biologics — discuss with the relevant specialist or pharmacist","Itraconazole SPC · BNF interactions"],
         ["<b>Breastfeeding</b>","Review individually using product-specific advice; do not start routinely in primary care","Itraconazole SPC"],
         ["<b>Liver disease</b>","Rare serious hepatotoxicity; avoid or seek specialist advice in significant liver disease. Stop and assess if jaundice, dark urine, severe nausea, marked fatigue or pruritus develops","Itraconazole SPC"],
         ["<b>Absorption</b>","Capsules are taken immediately after a meal; absorption is reduced by antacids and acid suppression. Capsules and oral solution have different absorption characteristics — check the formulation","Itraconazole SPC"]
       ]}
     ]},

    {id:"pigment", nav:"Pigment", title:"Pigment — the expectation that needs managing", sub:"Most dissatisfaction with PV treatment is about colour, not yeast.",
     blocks:[
       {b:"cards", items:[
         {tone:"green", h:"Scale clears first", html:"Once the yeast is eradicated the scale disappears, usually within a few weeks. Lack of scale at review is the sign that treatment has worked.", src:"PCDS pityriasis versicolor guidance"},
         {tone:"green", h:"Colour takes months", html:"The pale areas take several months to return to their normal colour, and this does not mean treatment has failed. Colour may take several months to normalise and can remain more noticeable after tanning. Sun protection can reduce the contrast but does not directly restore pigment; tanning is not a treatment.", src:"BAD patient information (June 2023) · PCDS guidance"},
         {tone:"cream", h:"Don’t re-treat pale, scale-free skin", html:"Repeated antifungal courses for residual pigment change alone add cost and irritation without benefit. Re-treat only if scale returns or scrapings are positive.", src:"PCDS pityriasis versicolor guidance"}
       ]},
       {b:"say", html:"The treatment has worked — you can see the flakiness has gone. The paler patches are just your skin catching up with making its pigment again, and that can take several months, and they can stay more noticeable after a tan. Sun protection makes the difference less obvious, though it doesn’t bring the colour back by itself."}
     ]},

    {id:"recur", nav:"Recurrence", title:"Recurrence and prevention", sub:"Recurrence is the rule rather than the exception in people who are prone to it.",
     blocks:[
       {b:"tiles", v:"life", items:[
         {t:"🔁 Re-treat the relapse", html:"Repeat the 5-day ketoconazole wash when scale returns — not merely because pigment remains abnormal."},
         {t:"🗓️ Maintenance wash", html:"For frequent, clearly documented recurrences, consider ketoconazole shampoo as a short-contact body wash <b>every 2–4 weeks for about 6 months</b>, or according to local dermatology advice (PCDS); BAD advises an occasional anti-dandruff shampoo used as a short-contact body wash. Not needed after a single uncomplicated episode, and not to be continued indefinitely without review. Persistent recurrence despite appropriate topical prophylaxis warrants dermatology advice before repeated oral courses."},
         {t:"☀️ Before the season", html:"Some people choose to use a short course before a summer holiday or before the warmer months, when relapse is most likely."},
         {t:"👕 Reduce humidity", html:"Loose, breathable clothing; shower and dry well after sweating; avoid heavy oily skin products on the trunk."}
       ]},
       {b:"why", html:"The yeast cannot be eradicated from the skin permanently — it is a normal inhabitant. Prophylaxis aims to keep numbers below the level at which it switches to the hyphal, rash-causing form. For frequent relapses despite a topical maintenance wash, specialist input can be sought about intermittent oral prophylaxis."}
     ]},

    {id:"groups", nav:"Special groups", title:"Special groups", sub:"Topical treatment is appropriate in almost every group; the oral options narrow quickly.",
     blocks:[
       {b:"cards", items:[
         {tone:"cream", h:"Pregnancy and breastfeeding: prefer topical treatment", html:"Use topical treatment, applied away from the eyes, mucosal surfaces and the breasts if breastfeeding. Avoid oral itraconazole for pityriasis versicolor in pregnancy (non-life-threatening indication). If oral treatment is being considered during breastfeeding, seek specialist or product-specific advice; it should not be initiated routinely in primary care.", src:"Itraconazole SPC"},
         {tone:"cream", h:"Children", html:"Uncommon before puberty. Facial involvement is more likely; take particular care with facial hypopigmented lesions, because pityriasis alba and vitiligo are common alternatives. Check the ketoconazole shampoo SPC for paediatric age restrictions before prescribing; in young children a topical azole cream may be easier and more appropriate than a shampoo applied over a large area. Avoid the eyes."},
         {tone:"amber", h:"Immunosuppression", html:"More extensive and more frequently recurring disease is seen with immunosuppression, including systemic steroids. Treat as usual; consider confirmation with scrapings and a lower threshold for specialist advice. Extensive or recurrent disease may be harder to distinguish from other dermatoses: confirm the diagnosis before systemic treatment, and review interactions with immunosuppressants (particularly ciclosporin, tacrolimus, sirolimus and some biologics) with the relevant specialist or pharmacist."},
         {tone:"amber", h:"Older adults on multiple medicines", html:"Prefer topical treatment; if oral is needed, check every current medicine against the itraconazole interaction list and ask about heart failure. A new diagnosis is not impossible, but reconsider it if the distribution, scale or clinical course is atypical.", src:"Itraconazole SPC · BNF"}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — rarely, and for a reason", sub:"Nearly all pityriasis versicolor is managed in primary care.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"Dermatology advice or referral", html:"Diagnostic uncertainty · no response to a correctly applied topical course · negative microscopy despite persistent atypical lesions · persistent lesions without scale · possible vitiligo needing confirmation · suspected hypopigmented mycosis fungoides, sarcoidosis or leprosy · immunosuppressed patient with extensive, atypical or treatment-resistant disease. Advice and guidance first where available.", src:"PCDS pityriasis versicolor guidance"},
         {tone:"amber", h:"Dermatology — frequent relapse despite prophylaxis", html:"Frequent relapse despite an appropriate maintenance regimen, or a need for repeated systemic antifungal courses — for consideration of intermittent oral prophylaxis or other strategies.", src:"PCDS pityriasis versicolor guidance"},
         {tone:"green", h:"Manage in primary care", html:"Typical upper-trunk disease with fine scale; reasonable response to topical treatment, with or without a maintenance wash; residual pigment change without scale.", src:"PCDS pityriasis versicolor guidance · BAD patient information (June 2023)"},
         {tone:"blue", h:"No suspected cancer pathway applies", html:"No NICE NG12 suspected-cancer criterion maps to pityriasis versicolor, so there is no purple suspected cancer card on this page. A separate suspicious pigmented or changing lesion should still be assessed independently.", src:"NICE NG12 (updated April 2026)"}
       ]},
       {b:"say", html:"This isn’t anything that needs a specialist. The wash clears the yeast; your colour will even out over the next few months; and if it comes back, which it often does, you already know how to treat it. If the patches start behaving differently — spreading despite treatment, losing all their colour, or going numb — come back and we’ll look again."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 24-year-old man back from a month working abroad is upset by pale patches across his chest and back. He treated them with a ketoconazole wash three months ago; the flaking went but the patches are still pale and he is worried it is vitiligo and wants ‘tablets that work’. He takes simvastatin for familial hypercholesterolaemia.", src:"PCDS pityriasis versicolor guidance · BAD patient information (June 2023)"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Examines for scale and explains that its absence means the yeast has gone; distinguishes residual hypopigmentation from vitiligo; explains months-long pigment recovery; declines oral treatment and identifies the itraconazole–simvastatin contraindication; offers a 2–4-weekly maintenance wash; safety-nets for atypical change.", src:"PCDS pityriasis versicolor guidance · itraconazole SPC"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Every figure on this page is traceable to a named primary source.",
     blocks:[
       {b:"html", html:"<div class='card'><h3>Evidence panel</h3><ul class='evlist'>"+
         "<li><b>PCDS — Pityriasis versicolor clinical guidance</b> (Primary Care Dermatology Society; web guidance, accessed September 2026) and <b>PCDS patient information leaflet (December 2023)</b><br><a href='https://www.pcds.org.uk/clinical-guidance/pityriasis-versicolor' rel='noopener'>pcds.org.uk/clinical-guidance/pityriasis-versicolor</a><span class='rd'> — ketoconazole shampoo lathered for 10 minutes daily for 5 days, itraconazole 200 mg daily for 7 days in widespread or resistant cases, pigment takes several months, maintenance wash every 2–4 weeks, Wood’s light fluorescence</span></li>"+
         "<li><b>BAD — Pityriasis versicolor patient information leaflet (updated June 2023)</b><br><a href='https://www.bad.org.uk/pils/pityriasis-versicolor' rel='noopener'>bad.org.uk/pils/pityriasis-versicolor</a><span class='rd'> — not contagious, pale areas take several months to recover and this is not treatment failure, oral treatment for widespread rash or topical failure, occasional anti-dandruff shampoo body wash to reduce recurrence</span></li>"+
         "<li><b>SPC — Nizoral 2% shampoo (ketoconazole)</b> (emc)<br><a href='https://www.medicines.org.uk/emc/product/1510/smpc' rel='noopener'>medicines.org.uk/emc/product/1510/smpc</a><span class='rd'> — licensed for pityriasis versicolor; 3–5 minute contact time (primary prescribing reference); paediatric age restrictions</span></li>"+
         "<li><b>SPC — Sporanox (itraconazole) 100 mg capsules</b><span class='rd'> — pityriasis versicolor 200 mg once daily for 7 days, taken after a meal; heart failure, pregnancy and CYP3A4 contraindications</span></li>"+
