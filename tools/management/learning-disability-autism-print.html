<script>
MG.render({
  icon:"\u{1F91D}",
  title:"Learning disability and autism — health checks, adjustments and avoidable deaths",
  eyebrow:"Protocol · annual health check from age 14 · reasonable adjustments",
  stemTitle:"People with a learning disability and autistic people die younger, often from treatable causes — look for illness behind behaviour, adjust the care, and never let the label explain the symptom",
  stemSub:"One page for general practice: the learning disability register and annual health check from age 14 with a health action plan, reasonable adjustments and the Accessible Information Standard, STOMP and STAMP medicines review, diagnostic overshadowing, the high-risk conditions behind avoidable deaths (epilepsy, constipation, dysphagia and aspiration), mental capacity and best interests, LeDeR death reviews, referral for an autism assessment in adults (NICE CG142), and the Oliver McGowan training requirement. Children with possible autism: use the <a href=\"autism.html\">autism protocol</a>.",
  guideline:"NICE CG142 (2012, updated 2021) · NICE CG128 (2011, updated 2017) · NICE NG11 (2015) · NICE NG54 (2016) · NICE NG217 (2022) · Accessible Information Standard (DCB1605, 2016, updated) · STOMP (2016) · STAMP (2018) · Mental Capacity Act 2005",
  reviewed:"15 October 2026",
  nextReview:"15 April 2027",
  meta:[
    {t:"Annual health check from age 14 (LD register)"},
    {t:"NICE CG142 (2012, updated 2021) · adults with possible autism"},
    {t:"NICE NG11 (2015) · NG54 (2016) · STOMP (2016)"},
    {t:"Diagnostic overshadowing kills — look for the illness", tone:"tw"},
    {t:"v1.0 · reviewed Oct 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#severe"><b>Act now</b><small>Overshadowing · red flags</small></a><a href="#ahc"><b>Health check</b><small>Age 14+ · action plan</small></a><a href="#adjust"><b>Adjustments</b><small>AIS · flag</small></a><a href="#risks"><b>High-risk conditions</b><small>Epilepsy · bowels · swallow</small></a><a href="#autism-adult"><b>Adult autism</b><small>CG142 · AQ-10</small></a></div>',
  quickSub:"If you read nothing else, read these six cards.",
  quick:[
    {tone:"red", h:"⚠ Diagnostic overshadowing", html:"A change in behaviour, distress, self-injury, sleep or eating in a person with a learning disability or an autistic person is <b>pain or illness until proven otherwise</b> — constipation, dental pain, reflux, infection, fracture, aspiration, seizures. Examine. Listen to the people who know the person best: ‘they’re not themselves’ is a clinical sign."},
    {tone:"red", h:"Avoidable deaths — the three to know", html:"LeDeR reviews repeatedly find <b>aspiration pneumonia (dysphagia)</b>, <b>epilepsy</b> and <b>constipation</b> among the avoidable causes of death, along with sepsis and delayed cancer diagnosis. Ask about all three at every review; treat chest infections, seizure change and bowel change as potentially serious."},
    {tone:"amber", h:"Annual health check from age 14", html:"Everyone aged 14 or over on the practice learning disability register should be offered an <b>annual health check</b> with a <b>health action plan</b>. Make the register accurate (including mild learning disability) and use the time for the reasonable adjustments the person needs."},
    {tone:"amber", h:"Reasonable adjustments are a legal duty", html:"Equality Act 2010: anticipate and make reasonable adjustments — longer or first-of-the-day appointments, a quiet space, easy read information, a familiar person present. The <b>Accessible Information Standard</b> requires you to identify, record, flag, share and meet each person’s communication needs. Record them with the <b>Reasonable Adjustment Flag</b>."},
    {tone:"blue", h:"STOMP and STAMP", html:"Psychotropic medicines (antipsychotics, antidepressants, sedatives, antiepileptics used for behaviour) are often prescribed for behaviour that challenges without a mental illness. Review every one at the health check: indication, benefit, adverse effects, and a plan to reduce or stop with the prescriber, the person and their carers (NICE NG11). Never stop abruptly."},
    {tone:"green", h:"Capacity is decision-specific", html:"Presume capacity, support the person to decide, and assess capacity for <b>each</b> decision. A learning disability or autism is <b>never</b> on its own a reason for a DNACPR decision or for withholding treatment. Best-interests decisions involve family, carers or an IMCA."}
  ],
  pathwaySub:"The yearly cycle in five moves. The red step is the one that prevents avoidable deaths.",
  pathway:[
    {title:"Find and register", html:"Keep the learning disability register accurate (search records for codes, special-school history, social care involvement); invite everyone aged 14 or over for an annual health check; record autism diagnoses and communication needs."},
    {title:"Adjust", html:"Ask about and record reasonable adjustments and communication needs (Accessible Information Standard, Reasonable Adjustment Flag); offer easy read invitations, longer appointments and desensitisation visits."},
    {title:"Check the high-risk systems", html:"Epilepsy, bowels, swallowing and chest, weight and nutrition, pain and dental health, sensory (hearing and vision), mental health, cancer screening uptake and immunisations — and every psychotropic medicine (STOMP).", alert:true},
    {title:"Plan", html:"Write and share a health action plan with the person and carers; refer to the community learning disability team, SALT, dietitian, epilepsy service or psychiatry as needed; agree a hospital passport and any best-interests decisions."},
    {title:"Learn", html:"Notify every death of a person with a learning disability and of an autistic adult to LeDeR; act on the review’s recommendations; make sure all staff have completed the Oliver McGowan training."}
  ],
  sections:[

    {id:"severe", nav:"Act now", title:"Act now — illness hiding behind behaviour",
     blocks:[
       {b:"table", head:["Presentation","Think of","Action"], rows:[
         ["New or worse distress, aggression, self-injury, sleep disturbance or refusal to eat","Pain (dental, ear, abdominal, fracture), constipation, reflux, UTI, infection, seizures, medication adverse effects, abuse","Full examination; ask carers what has changed and when; do not attribute to the disability or autism, and do not increase psychotropic medicine before excluding a physical cause"],
         ["Coughing or choking with meals, wet or gurgly voice, recurrent chest infections, weight loss","Dysphagia with aspiration","Treat a chest infection promptly (consider aspiration pneumonia); refer to SALT for a swallowing assessment; same-day assessment if breathless or septic"],
         ["Abdominal distension, vomiting, overflow diarrhoea, reduced bowel opening, behaviour change","Severe constipation, faecal impaction, obstruction, volvulus — deaths are well documented, particularly with clozapine or other anticholinergic medicines","Examine the abdomen; same-day hospital assessment if distended, vomiting or unwell; never dismiss overflow as diarrhoea"],
         ["Seizures more frequent, longer, or a new seizure type; injuries from falls","Epilepsy deterioration — higher risk of SUDEP and status epilepticus","Urgent epilepsy review; check the rescue-medication plan; 999 for a seizure lasting 5 minutes or more or as the plan says"],
         ["Signs of sepsis in a person who cannot describe symptoms","Sepsis — presentations are often atypical","Use NEWS2 and clinical judgement; carers’ concern is an important signal"],
         ["Signs of abuse, neglect or exploitation","Adults with a learning disability and autistic people are at higher risk","Safeguarding referral — see the <a href=\"safeguarding.html\">safeguarding protocol</a>"]
       ]},
       {b:"warn", html:"<b>Diagnostic overshadowing</b> — attributing symptoms to the learning disability or autism rather than to illness — is a recurring finding in LeDeR reviews and in the deaths of Oliver McGowan, Richard Handley and others. A carer’s ‘they’re not right’ deserves the same weight as a symptom described in words."}
     ]},

    {id:"ahc", nav:"Health check", title:"The annual health check and the health action plan",
     sub:"Learning disability annual health check (NHS England enhanced service) for everyone aged 14 or over on the practice register; the GP or a trained nurse can do it, with enough time for adjustments.",
     blocks:[
       {b:"table", head:["Domain","What to check"], rows:[
         ["<b>Before the appointment</b>","Easy read invitation and pre-check questionnaire for the person and carers; the reasonable adjustments needed; who will attend; consent and capacity for blood tests or examinations; desensitisation if needed"],
         ["<b>Physical</b>","Weight and BMI, blood pressure, pulse, urinalysis; heart, chest, abdomen and skin examination; mobility and falls; continence; sexual health and contraception; menstrual health and menopause; thyroid function where indicated (annually in Down syndrome)"],
         ["<b>Epilepsy</b>","Seizure frequency and type, rescue-medication plan, injuries, SUDEP risk discussion, night-time monitoring, antiseizure medicine adverse effects; specialist review if not controlled"],
         ["<b>Bowels, swallowing and nutrition</b>","Bowel pattern (a bowel chart if unclear), straining, overflow; coughing or choking at meals, chest infections, modified-diet plan (IDDSI levels) and whether it is followed; weight trend"],
         ["<b>Sensory, dental and pain</b>","Hearing (wax, hearing loss) and vision (eye test every 2 years, more often in Down syndrome); dental check and oral care; signs of pain the person may not report"],
         ["<b>Mental health and behaviour</b>","Mood, anxiety, psychosis, dementia (earlier onset in Down syndrome — establish a baseline from the 30s); behaviour that challenges and its triggers"],
         ["<b>Medicines</b>","Full medicines review; every psychotropic medicine against STOMP or STAMP; anticholinergic burden; constipating medicines; bone health with long-term antiepileptics"],
         ["<b>Prevention</b>","Immunisations (check eligibility for flu, COVID-19 and pneumococcal under the current Green Book); cancer screening uptake with adjustments or a documented best-interests decision; cardiovascular risk, diabetes and obesity"],
         ["<b>Life and support</b>","Carer’s health and carer’s assessment; safeguarding; employment, housing, social care; transition planning from age 14; hospital passport; advance care planning and ReSPECT where appropriate"]
       ]},
       {b:"dl", rows:[
         ["<b>Health action plan</b>","A short, accessible plan of agreed actions, owners and dates, shared with the person (easy read) and with their consent with carers and the community learning disability team"],
         ["<b>Down syndrome</b>","Annual TFTs; cardiac history; vision and hearing; coeliac disease; sleep apnoea; atlanto-axial instability symptoms (neck pain, gait change, new incontinence → urgent assessment); early-onset dementia"]
       ]}
     ]},

    {id:"adjust", nav:"Adjustments", title:"Reasonable adjustments and accessible information",
     blocks:[
       {b:"table", head:["Requirement","In practice"], rows:[
         ["<b>Equality Act 2010</b>","An anticipatory duty to make reasonable adjustments so disabled people are not disadvantaged — failure to make them can be unlawful discrimination"],
         ["<b>Accessible Information Standard</b> (DCB1605)","Five steps: <b>identify</b> communication and information needs, <b>record</b> them consistently, <b>flag</b> them on the record, <b>share</b> them with other providers with consent, and <b>meet</b> them (easy read, large print, BSL interpreter, communication aids, an advocate)"],
         ["<b>Reasonable Adjustment Flag</b>","A national digital flag on the patient’s record (NHS Spine) so that adjustments travel with the patient to hospitals, 111 and other services — record and share it"],
         ["<b>Common adjustments</b>","First or last appointment of the day, a quiet waiting area or waiting in the car, double appointments, the same clinician, visual schedules, plain language, explaining before touching, sensory considerations (lighting, noise), home visits for blood tests, desensitisation, sedation planning with hospital teams for necessary procedures"],
         ["<b>Hospital passport</b>","A document the person takes to hospital describing communication, likes and dislikes, how they show pain and what reasonable adjustments help"]
       ]}
     ]},

    {id:"risks", nav:"High-risk conditions", title:"Epilepsy, constipation, dysphagia and the other avoidable causes of death",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"Epilepsy", html:"Much more common in people with a learning disability, and more often drug-resistant. Ensure a specialist review, an individual seizure care plan with rescue medication where prescribed (NICE NG217), discussion of SUDEP risk, and night-time safety. Valproate rules apply in people of childbearing potential.", src:"NICE NG217 (2022)"},
         {tone:"red", h:"Constipation", html:"Common, under-recognised and a cause of death. Risk factors: immobility, low fibre or modified diets, low fluid intake, antipsychotics (especially clozapine), anticholinergics, opioids, iron. Ask, chart, examine, treat early and review — follow NICE constipation guidance and local formulary.", src:"NHS England constipation resources; LeDeR"},
         {tone:"red", h:"Dysphagia and aspiration pneumonia", html:"A leading cause of death in LeDeR. Refer to SALT for a swallowing assessment at the first sign; make sure the eating and drinking plan and texture-modified diet are followed by everyone; consider aspiration in any chest infection; review sedating medicines.", src:"LeDeR; IDDSI"},
         {tone:"amber", h:"Other avoidable causes", html:"Sepsis, cancer diagnosed late (screening uptake is lower — offer adjustments), respiratory disease, cardiovascular disease, and the adverse effects of medicines. Obesity and underweight are both common."}
       ]}
     ]},

    {id:"stomp", nav:"STOMP", title:"STOMP and STAMP — psychotropic medicines",
     sub:"STOMP (Stopping Over-Medication of People with a learning disability, autism or both, NHS England 2016) and STAMP (Supporting Treatment and Appropriate Medication in Paediatrics, 2018). NICE NG11 (behaviour that challenges) and NG54 (mental health problems in people with learning disabilities).",
     blocks:[
       {b:"table", head:["Step","What to do"], rows:[
         ["<b>Identify</b>","List every antipsychotic, antidepressant, anxiolytic, hypnotic and mood stabiliser, and antiepileptics used for behaviour; record the indication (a diagnosed mental illness, or behaviour)"],
         ["<b>Review</b>","Is it still needed, is it helping, what are the adverse effects (weight, metabolic, movement disorders, sedation, constipation, falls)? NICE NG11: antipsychotics for behaviour that challenges only alongside psychosocial interventions, at the lowest dose, reviewed after 3–4 weeks and stopped if there is no response at 6 weeks, with regular review"],
         ["<b>Plan</b>","Any reduction is agreed with the prescriber (often psychiatry), the person, their family and carers, with a positive behaviour support plan in place; reduce gradually and monitor; never stop abruptly"],
         ["<b>Monitor</b>","Physical health monitoring for antipsychotics (weight, BP, glucose or HbA1c, lipids, ECG where indicated, prolactin per the shared-care protocol)"]
       ]}
     ]},

    {id:"capacity", nav:"Capacity", title:"Mental capacity, best interests and end-of-life decisions",
     blocks:[
       {b:"dl", rows:[
         ["<b>Five principles</b> (Mental Capacity Act 2005)","Presume capacity; support the person to make their own decision; an unwise decision is not incapacity; best interests if they lack capacity; choose the least restrictive option"],
         ["<b>Assess for each decision</b>","Can they understand, retain, use and weigh the information, and communicate a decision? Use accessible information and the right time and place. Record the assessment"],
         ["<b>Best interests</b>","Consult those close to the person and any attorney or deputy; instruct an IMCA for serious medical treatment if there is no one else to consult"],
         ["<b>DNACPR and ReSPECT</b>","A learning disability, autism or Down syndrome must never in itself be a reason for a DNACPR decision. Decisions are individual and discussed with the person and those close to them"],
         ["<b>LeDeR</b>","Notify every death of a person with a learning disability (aged 4 or over) and of an autistic adult to the LeDeR programme (online). Families can contribute to the review"]
       ]}
     ]},

    {id:"autism-adult", nav:"Adult autism", title:"Referral for an autism assessment in adults (NICE CG142)",
     sub:"Children and young people under 19: NICE CG128 — see the <a href=\"autism.html\">autism protocol</a>.",
     blocks:[
       {b:"table", head:["Step","Detail"], rows:[
         ["<b>Consider assessment</b>","Persistent difficulties in social interaction and communication, and stereotypic (rigid and repetitive) behaviours, resistance to change or restricted interests, plus one or more of: problems obtaining or keeping work or education; difficulty starting or keeping social relationships; previous or current contact with mental health or learning disability services; a history of a neurodevelopmental condition (including learning disabilities and ADHD) or a mental disorder"],
         ["<b>AQ-10</b>","For adults <b>without</b> a moderate or severe learning disability, consider the Autism-Spectrum Quotient (AQ-10). A score above 6 → offer a comprehensive assessment. Adults with a moderate or severe learning disability: discuss with the learning disability service"],
         ["<b>Refer</b>","To the local adult autism diagnostic service (with ADHD screening if relevant). Waits are long: the patient can use NHS Right to Choose in England for some services. Meanwhile, make reasonable adjustments, address mental health and offer support (NAS, local autism hubs)"],
         ["<b>Do not</b>","Use medication for the core features of autism; use exclusion diets, chelation or other unproven treatments"]
       ]}
     ]},

    {id:"training", nav:"Training", title:"The Oliver McGowan Mandatory Training",
     blocks:[
       {b:"p", html:"The Health and Care Act 2022 requires CQC-registered providers, including general practices, to ensure their staff receive training on learning disability and autism appropriate to their role. The <b>Oliver McGowan Mandatory Training on Learning Disability and Autism</b> is the government’s preferred and recommended training (tier 1 for staff needing general awareness; tier 2 for those providing care). It is named after Oliver McGowan, an autistic teenager with a mild learning disability whose death in 2016 followed the administration of an antipsychotic against his and his family’s wishes. Follow the statutory code of practice."}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same day", html:"Suspected aspiration pneumonia with breathlessness or sepsis; abdominal distension or vomiting with constipation; seizure change with injury or prolonged seizures (999 for 5 minutes or more); safeguarding emergencies."},
         {tone:"amber", h:"Community learning disability team", html:"Health facilitation, behaviour support (positive behaviour support), nursing, SALT, physiotherapy, occupational therapy, psychology and psychiatry of learning disability."},
         {tone:"blue", h:"Specialist services", html:"Epilepsy service; SALT for dysphagia; dietitian; adult autism diagnostic service; community dental service; audiology and optometry with adjustments."},
         {tone:"cream", h:"GP management", html:"Accurate register, annual health check from 14 with health action plan, reasonable adjustments and flags, medicines review including STOMP, cancer screening with adjustments, capacity and best interests, LeDeR notification."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A support worker phones about a 38-year-old man with a moderate learning disability and epilepsy who lives in supported housing. He has been ‘more aggressive’ for two weeks, hitting his head and refusing meals. The staff ask whether his risperidone dose can be increased."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Does not increase the antipsychotic over the phone; <b>names diagnostic overshadowing</b> and looks for a physical cause — constipation, dental or ear pain, reflux, infection, seizure change, medicine adverse effects; arranges a face-to-face assessment with reasonable adjustments; asks about bowels, swallowing and chest infections; checks the seizure plan; involves the person and the people who know him best; considers safeguarding; reviews psychotropics under STOMP with the prescriber; safety-nets for distension, vomiting, breathlessness and prolonged seizures."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Sources used on this page.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE CG142 — Autism spectrum disorder in adults: diagnosis and management (2012, updated 2021)</b><br><a href="https://www.nice.org.uk/guidance/cg142" rel="noopener">nice.org.uk/guidance/cg142</a><span class="rd"> — when to consider assessment; AQ-10 above 6 in adults without a moderate or severe learning disability; no medicines for core features</span></li>'+
         '<li><b>NICE CG128 — Autism spectrum disorder in under 19s: recognition, referral and diagnosis (2011, updated 2017)</b><br><a href="https://www.nice.org.uk/guidance/cg128" rel="noopener">nice.org.uk/guidance/cg128</a></li>'+
         '<li><b>NICE NG11 — Challenging behaviour and learning disabilities: prevention and interventions (2015)</b><br><a href="https://www.nice.org.uk/guidance/ng11" rel="noopener">nice.org.uk/guidance/ng11</a><span class="rd"> — assess for physical causes; antipsychotics only alongside psychosocial interventions, reviewed at 3–4 weeks and stopped if no response at 6 weeks; annual health checks</span></li>'+
         '<li><b>NICE NG54 — Mental health problems in people with learning disabilities (2016)</b><br><a href="https://www.nice.org.uk/guidance/ng54" rel="noopener">nice.org.uk/guidance/ng54</a></li>'+
         '<li><b>NICE NG217 — Epilepsies in children, young people and adults (2022)</b><br><a href="https://www.nice.org.uk/guidance/ng217" rel="noopener">nice.org.uk/guidance/ng217</a><span class="rd"> — seizure care plans, rescue medication, SUDEP</span></li>'+
         '<li><b>NHS England — Learning disability annual health checks (enhanced service, age 14 and over) and health action plans</b><br><a href="https://www.england.nhs.uk/learning-disabilities/improving-health/annual-health-checks/" rel="noopener">england.nhs.uk — annual health checks</a></li>'+
         '<li><b>NHS England — Accessible Information Standard (DCB1605, 2016, revised)</b> and the <b>Reasonable Adjustment Flag</b><br><a href="https://www.england.nhs.uk/about/equality/equality-hub/patient-equalities-programme/equality-frameworks-and-information-standards/accessibleinfo/" rel="noopener">england.nhs.uk — Accessible Information Standard</a></li>'+
         '<li><b>Equality Act 2010</b> — the anticipatory duty to make reasonable adjustments</li>'+
         '<li><b>NHS England — STOMP (2016) and STAMP (2018)</b><br><a href="https://www.england.nhs.uk/learning-disabilities/improving-health/stomp/" rel="noopener">england.nhs.uk — STOMP</a></li>'+
         '<li><b>LeDeR — Learning from lives and deaths: people with a learning disability and autistic people (annual reports, King’s College London / NHS England)</b><br><a href="https://leder.nhs.uk" rel="noopener">leder.nhs.uk</a><span class="rd"> — avoidable deaths including aspiration pneumonia, epilepsy, constipation and sepsis; diagnostic overshadowing; notifying deaths</span></li>'+
         '<li><b>Mental Capacity Act 2005 and Code of Practice</b>; <b>NHS England and CQC statements on DNACPR and learning disability (2020)</b></li>'+
         '<li><b>Health and Care Act 2022, section 181; the Oliver McGowan Mandatory Training on Learning Disability and Autism and its code of practice</b><br><a href="https://www.hee.nhs.uk/our-work/learning-disability/current-projects/oliver-mcgowan-mandatory-training-learning-disability-autism" rel="noopener">The Oliver McGowan Mandatory Training</a></li>'+
         '<li><b>International Dysphagia Diet Standardisation Initiative (IDDSI)</b> — texture-modified diets and fluids</li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Learning disability and autism — NICE CG142, CG128, NG11, NG54 and NG217, the NHS England annual health check, the Accessible Information Standard and Reasonable Adjustment Flag, STOMP and STAMP, LeDeR, the Mental Capacity Act 2005 and the Oliver McGowan Mandatory Training. Behaviour change is illness until proven otherwise; ask about epilepsy, bowels and swallowing at every review. Medicines decisions per the specialist letter, SPC, BNF and local shared-care protocols."
});
