<script>
MG.render({
  icon:"⚖️",
  title:"Metabolic syndrome — the complete guide",
  eyebrow:"Protocol · assess &amp; manage in one place",
  stemTitle:"A risk state, not a disease — its only value is prompting you to treat every component at once",
  stemSub:"One page for the whole condition. First reclassify the patients who actually have diabetes, established CVD, familial hypercholesterolaemia or a treatable secondary cause, because each has a higher-priority pathway; define the cluster using ethnicity-specific waist thresholds; build the full risk picture (QRISK3, NAFLD/MASLD with FIB-4, OSA, PCOS, gout, ED); then treat each component to its guideline target on a foundation of individualised weight loss and lifestyle change. Metabolic syndrome is a risk-stratification construct rather than a separate disease: use the criteria to recognise clustering, but do not delay component-specific treatment while trying to establish the label; no NICE treatment pathway depends on formally coding it. IDF/harmonised criteria · NICE NG238 · NG28 · NG136 · NG49 · NG246.",
  guideline:"IDF/harmonised · NICE NG238 / NG28 / NG136 / NG49 / NG246",
  reviewed:"8 September 2026",
  nextReview:"8 March 2027",
  meta:[
    {t:"IDF / NCEP ATP III / harmonised 2009 criteria"},
    {t:"NICE NG238 · NG28 (Feb 2026) · NG136 · NG49 · NG246"},
    {t:"NHS Diabetes Prevention Programme"},
    {t:"Suspected cancer · NG12 criteria that surface here", tone:"tw"},
    {t:"v2.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:"<div class='mg-layers'><a href='#severe'><b>Reclassify</b><small>Diabetes · CVD · FH · secondary</small></a><a href='#define'><b>Define</b><small>The five components</small></a><a href='#ladder'><b>Treat</b><small>Every component to target</small></a><a href='#refer'><b>Refer</b><small>Tier 3/4 · hepatology · sleep</small></a></div>",
  quickSub:"If you read nothing else on this page, read these six cards. Every figure traces to the source cited under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Reclassify before you counsel — four higher-priority pathways", html:"Possible type 2 diabetes: HbA1c ≥48 mmol/mol is in the diabetic range — if asymptomatic, confirm with a second abnormal test; with classic symptoms or unequivocal hyperglycaemia, manage urgently via the diabetes pathway; ketotic, unwell or marked symptomatic hyperglycaemia → ketones and same-day assessment. Established CVD (angina, prior MI/stroke/TIA, claudication) → these are secondary-prevention patients. Suspect familial hypercholesterolaemia with markedly raised cholesterol/LDL cholesterol, tendon xanthomata, premature personal CVD or a strong family history → exclude secondary causes and use the local lipid/FH diagnostic pathway; do not diagnose FH from total cholesterol alone. Secondary contributors (rapid or disproportionate weight gain, Cushingoid features, amenorrhoea/androgen excess, hypothalamic disease, relevant medicines) → review when the history or examination suggests them; do not routinely investigate rare endocrine causes."},
    {tone:"amber", h:"Two numbers that need urgent action, not an annual review", html:"BP ≥180/120 with papilloedema, retinal haemorrhage, confusion, chest pain, heart failure or acute kidney injury → same-day specialist assessment; without these features, assess target-organ damage promptly and review within 7 days. Triglycerides &gt;20 mmol/L (not due to alcohol or poor glycaemic control) → urgent specialist lipid review (pancreatitis risk); 10–20 mmol/L → repeat fasting after 5 days to 2 weeks, look for secondary causes and seek specialist advice if still above 10 (NICE NG238). Both are easy to file as “another component of the cluster” and both are time-critical."},
    {tone:"blue", h:"The definition: central obesity plus two, and ethnicity matters", html:"Central obesity (increased waist — IDF ethnicity-specific: ≥94 cm men / ≥80 cm women in Europids; ≥90 cm men / ≥80 cm women in South Asian and Chinese/Japanese people; other groups use the most appropriate regional threshold) is the cardinal component, plus ≥2 of: triglycerides ≥1.7 mmol/L (or treated) · HDL &lt;1.0 mmol/L men / &lt;1.3 women (or treated) · BP ≥130 systolic and/or ≥85 diastolic (or treated) · fasting glucose ≥5.6 mmol/L or known T2DM. That is the IDF rule; the harmonised 2009 definition uses <b>≥3 of the 5 components</b>. NICE NG246: people from South Asian, Chinese, other Asian, Middle Eastern, Black African and African-Caribbean backgrounds have increased cardiometabolic risk at lower BMI thresholds — use the ethnicity-specific cut-offs. The label is for recognising clustering; do not delay treating components while establishing it."},
    {tone:"green", h:"Weight loss and lifestyle are the foundation", html:"Even modest weight loss can improve cardiometabolic risk factors; agree an individualised goal rather than presenting 5–10% as a universal minimum or guaranteed response. Build it on a Mediterranean-style or calorie-controlled diet (less refined carbohydrate, sugary drinks and ultra-processed food; more fibre, vegetables, oily fish), ≥150 min/week moderate activity (or 75 min vigorous) plus 2 resistance sessions, alcohol ≤14 units/week, smoking cessation — the single biggest CV risk reduction — and referral of suspected OSA through the local sleep pathway for diagnostic testing. Structured programmes with self-monitoring and behavioural support outperform advice alone."},
    {tone:"blue", h:"It never travels alone — screen the cluster", html:"NAFLD/MASLD, OSA, PCOS, gout and erectile dysfunction share the insulin-resistant phenotype — ask about symptoms and investigate when clinically indicated, rather than screening everyone. Steatosis or suspected MASLD → exclude other liver disease where clinically indicated and assess fibrosis using the local sequential pathway, usually FIB-4 followed by ELF (NICE NG49; advanced fibrosis at 10.51 or above) or transient elastography when indicated — normal liver enzymes do not exclude MASLD or advanced fibrosis; snoring with daytime sleepiness → Epworth (a screening tool, not a diagnostic test) and the sleep service; urine ACR + eGFR for kidney involvement; ED is itself a cardiovascular marker."},
    {tone:"cream", h:"No single drug treats the syndrome — treat components to target", html:"Atorvastatin 20 mg for primary prevention if QRISK3 ≥10% (NG238) — QRISK3 is not used in established CVD or FH; 80 mg for secondary prevention unless contraindicated or not tolerated; aim for a &gt;40% non-HDL reduction in primary prevention. BP per NG136: ACEi/ARB first-line with type 2 diabetes. HbA1c 42–47 → NHS Diabetes Prevention Programme. Diabetic → NICE NG28 (updated February 2026) recommends MR metformin plus an SGLT2 inhibitor, introduced sequentially; follow NHS Greater Manchester implementation and formulary advice where it differs or remains under review. Retain both LDL and non-HDL cholesterol in the lipid panel."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step is reclassification — get it wrong and everything downstream is the wrong pathway.",
  pathway:[
    {title:"Exclude established end-organ disease and secondary causes", html:"Possible T2DM (HbA1c ≥48 — confirm with a second test if asymptomatic; symptomatic → diabetes pathway; same-day with ketones if ketotic/unwell) · established CVD → secondary prevention (chest pain or new neuro deficit → acute pathway) · BP ≥180/120 with papilloedema, retinal haemorrhage, confusion, chest pain, heart failure or AKI → same-day specialist assessment; otherwise assess target-organ damage and review within 7 days · suspected FH (markedly raised cholesterol/LDL, tendon xanthomata, premature personal or family CVD) → local lipid/FH pathway, not on total cholesterol alone · secondary contributors only when the history or examination suggests them · unintentional weight loss or other cancer symptoms · triglycerides &gt;20 mmol/L → urgent specialist review (10–20 → repeat fasting and seek advice if still &gt;10; NG238).", alert:true},
    {title:"Define the cluster", html:"Central obesity (ethnicity-specific waist) PLUS ≥2 of raised triglycerides, low HDL, raised BP and raised fasting glucose (IDF) — or ≥3 of 5 (harmonised 2009). Definitions vary (IDF, NCEP ATP III, harmonised) but converge on the same five components. The label matters less than acting on each component and the aggregate risk — do not delay component-specific treatment while trying to establish it."},
    {title:"Build the risk picture and screen the cluster", html:"History: diet, activity, alcohol, smoking, sleep and OSA screen, shift work, family history of premature CVD or diabetes, ethnicity, prior gestational diabetes, medications (antipsychotics, steroids, some antiretrovirals), mental health (depression, binge eating), readiness to change. Calculate QRISK3. Examine and test: weight, height, BMI, ethnicity-adjusted waist; standardised BP with ABPM/HBPM to confirm where clinic BP is 140/90 or more; HbA1c or fasting glucose; lipids (total/HDL/LDL/non-HDL, triglycerides); U&amp;E; LFTs; TFTs if indicated; urate only if indicated (gout, uric-acid stones, CKD or a specific management question); urine ACR where indicated; fibrosis assessment via the local FIB-4/ELF/elastography pathway if MASLD; ECG in confirmed hypertension or if symptomatic — not as a universal test."},
    {title:"Lifestyle first, then treat each component to target", html:"Foundation: individualised weight-loss goal, Mediterranean-style diet, ≥150 min/week + resistance work, alcohol limits, smoking cessation, suspected OSA to the sleep pathway. Then: NHS DPP or NG28 (with the current GMMMG implementation caveat) for glycaemia · statin per NG238 and the local formulary · BP per NG136 · weight pharmacotherapy (orlistat per NICE NG246; semaglutide/liraglutide within NICE TA875/TA664 criteria) · bariatric surgery per NG246."},
    {title:"Individualised review", html:"There is no single NICE-mandated annual metabolic syndrome review — assemble it from the relevant pathways: BP severity and treatment changes, HbA1c by glycaemic status, lipids after treatment changes, renal ACR/eGFR if diabetes, hypertension or CKD, liver fibrosis reassessment per MASLD risk and local pathway, medication safety, frailty, mental health and social circumstances; retinal and foot screening only if diabetic; reinforce lifestyle. Re-check HbA1c in impaired glucose regulation and re-refer to prevention programmes as needed."}
  ],
  sections:[
    {id:"severe", nav:"Reclassify", title:"Exclude established end-organ disease and secondary causes first", sub:"Metabolic syndrome is a clustering of cardiometabolic risk factors. Before lifestyle counselling, exclude the conditions that need urgent action or specific treatment.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Undiagnosed type 2 diabetes", html:"HbA1c ≥48 mmol/mol is in the diabetic range. If the person is asymptomatic, confirm the diagnosis with a second abnormal test. If there are classic symptoms (thirst, polyuria, weight loss) or unequivocal hyperglycaemia, manage urgently according to the diabetes pathway. HbA1c may be unreliable in haemoglobinopathies, recent transfusion, haemolysis or altered red-cell lifespan — use plasma glucose. Ketones and same-day assessment if unwell, ketotic or with marked symptomatic hyperglycaemia. Once type 2 diabetes or established CVD is present, manage through that higher-priority pathway rather than primarily as metabolic syndrome. See the <a href='type-2-diabetes.html'>type 2 diabetes protocol</a>."},
         {tone:"red", h:"🔴 Established cardiovascular disease", html:"Angina, prior MI, stroke or TIA, claudication → these are secondary-prevention patients. Chest pain or a new neurological deficit → the acute pathway."},
         {tone:"red", h:"🔴 Severe hypertension", html:"Clinic BP ≥180/120 with papilloedema, retinal haemorrhage, confusion, chest pain, heart failure or acute kidney injury → same-day specialist assessment. Without these features, assess target-organ damage promptly and review within 7 days."},
         {tone:"amber", h:"🟠 Familial hypercholesterolaemia", html:"Total cholesterol ≥7.5 mmol/L should prompt consideration of FH, but diagnosis requires clinical assessment: LDL cholesterol, tendon xanthomata, premature coronary disease in the patient or family, a validated score (Simon Broome or Dutch Lipid Clinic criteria) and exclusion of secondary causes. Do not diagnose FH from total cholesterol alone — use the local lipid/FH pathway, not the metabolic syndrome label. See the <a href='hypercholesterolaemia.html'>lipids protocol</a>."},
         {tone:"amber", h:"🟠 Secondary obesity / endocrine cause", html:"Review for secondary contributors when the history or examination suggests them — for example rapid or disproportionate weight gain, Cushingoid features, amenorrhoea/androgen excess, hypothalamic disease or relevant medicines (steroids, antipsychotics). Do not routinely investigate rare endocrine causes in every patient with obesity. Hypothyroidism can contribute to weight gain, but severe obesity is not usually explained by hypothyroidism alone."},
         {tone:"amber", h:"🟠 Severe hypertriglyceridaemia", html:"Triglycerides &gt;20 mmol/L (not due to alcohol or poor glycaemic control) → urgent specialist lipid review (pancreatitis risk); 10–20 mmol/L → repeat fasting after 5 days to 2 weeks, look for secondary causes and seek specialist advice if still above 10 (NICE NG238). Secondary causes include uncontrolled diabetes, excess alcohol, hypothyroidism, renal disease/nephrotic syndrome, obesity, pregnancy, and corticosteroids, oestrogens, retinoids, some antipsychotics and other medicines. At 4.5–9.9 mmol/L, risk calculators may underestimate CVD risk — optimise all other risk factors and seek specialist advice where appropriate."},
         {tone:"amber", h:"🟠 Unintentional weight loss or other cancer symptoms", html:"Weight loss that was not intended is a symptom, not a lifestyle success — see the NG12 criteria in the Work-up section."}
       ]},
       {b:"why", html:"Metabolic syndrome is a risk-stratification construct rather than a separate disease — its value is prompting aggressive risk-factor management, and component-specific treatment should not wait for the label. The clinician must first reclassify patients who actually have diabetes, established cardiovascular disease, familial hypercholesterolaemia or a treatable secondary cause, <b>because each carries a distinct, higher-priority pathway.</b>"}
     ]},

    {id:"define", nav:"Define", title:"Define the syndrome — recognise the cluster", sub:"Use a recognised definition. The widely-used harmonised/IDF criteria require central obesity plus risk factors; the key clinical message is the clustering.",
     blocks:[
       {b:"table", head:["Component","Threshold","Note"], rows:[
         ["<b>Central obesity</b>","Increased waist circumference — IDF ethnicity-specific thresholds: Europid ≥94 cm men / ≥80 cm women; South Asian ≥90 cm men / ≥80 cm women; Chinese/Japanese ≥90 cm men / ≥80 cm women; other groups — the most appropriate available regional threshold (uncertain)","<b>The cardinal component (IDF)</b>"],
         ["<b>Raised triglycerides</b>","<b>≥1.7 mmol/L (or on treatment for it)</b>","Fasting sample"],
         ["<b>Low HDL cholesterol</b>","<b>&lt;1.0 mmol/L men / &lt;1.3 mmol/L women (or on treatment)</b>","Interpret with the TC:HDL ratio"],
         ["<b>Raised blood pressure</b>","<b>≥130 systolic and/or ≥85 diastolic (or treated hypertension)</b>","A risk-clustering cut-off — not a diagnosis of hypertension and not a treatment threshold. Suspected hypertension: clinic BP ≥140/90, confirmed by ABPM or HBPM; severe: clinic BP ≥180/120 (NICE NG136)"],
         ["<b>Raised fasting glucose</b>","Fasting glucose ≥5.6 mmol/L, or known type 2 diabetes / impaired glucose regulation","HbA1c 42–47 = the prevention-programme band"],
         ["<b>The diagnosis</b>","Central obesity plus ≥2 of the other components (IDF), or ≥3 of 5 components (harmonised)","<b>Identifies insulin-resistant, high cardiometabolic-risk individuals — IDF/harmonised definitions, not NICE recommendations; formal diagnosis is not essential</b>"]
       ]},
       {b:"kv", rows:[
         ["Associated conditions","NAFLD/MASLD, OSA, PCOS, gout and erectile dysfunction share the insulin-resistant phenotype"],
         ["Reclassify first","Already diabetic? Established CVD? Familial hypercholesterolaemia? Secondary obesity? — each has its own higher-priority pathway"]
       ]},
       {b:"why", html:"Definitions vary (IDF, NCEP ATP III, harmonised 2009) but converge on the same five components. South Asian populations develop insulin resistance at lower waist and BMI thresholds, and NICE NG246 notes increased cardiometabolic risk at lower BMI in people from South Asian, Chinese, other Asian, Middle Eastern, Black African and African-Caribbean backgrounds, so ethnicity-specific cut-offs matter in UK practice. The diagnosis is less important than acting on each component and the aggregate risk."}
     ]},

    {id:"history", nav:"History", title:"History and risk assessment", sub:"Build the full cardiometabolic risk picture and look for associated conditions.",
     blocks:[
       {b:"table", head:["Domain","Ask about","Why"], rows:[
         ["<b>Lifestyle</b>","Diet pattern, physical activity, alcohol, smoking, sleep (screen for OSA — snoring, witnessed apnoea, Epworth as a screening tool; refer suspected OSA via the local sleep pathway for diagnostic testing), shift work","Each is a modifiable component driver"],
         ["<b>Cardiovascular risk</b>","Family history of premature CVD or diabetes, ethnicity, prior gestational diabetes, smoking — calculate QRISK3 in the primary-prevention population only (not in established CVD or FH)","QRISK3 quantifies 10-year cardiovascular risk and frames the conversation around statin therapy and lifestyle intensity"],
         ["<b>Associated conditions</b>","PCOS, non-alcoholic fatty liver disease (NAFLD/MASLD), obstructive sleep apnoea, gout, erectile dysfunction (a cardiovascular marker)","Metabolic syndrome rarely travels alone — ask about symptoms and investigate when clinically indicated; do not screen everyone for PCOS or ED"],
         ["<b>Medications</b>","Antipsychotics, steroids, some antiretrovirals → weight gain and dysglycaemia","May be a modifiable contributor — coordinate with the mental-health team before changing an antipsychotic"],
         ["<b>Mental health</b>","Depression and binge eating affect motivation and outcomes — screen and support","<b>Treating low mood removes a major barrier to weight loss and activity</b>"],
         ["<b>Readiness to change</b>","<b>Assess motivation; use brief interventions and shared goal-setting</b>","Determines which programme will actually be used"]
       ]}
     ]},

    {id:"workup", nav:"Work-up", title:"Examination and investigations", sub:"Targeted examination plus a focused panel quantify each component and screen for complications.",
     blocks:[
       {b:"table", head:["What","Detail","Why"], rows:[
         ["<b>Anthropometry</b>","Weight, height, BMI, waist circumference — record ethnicity-adjusted thresholds","Waist is the cardinal component"],
         ["<b>Blood pressure</b>","Standardised measurement; clinic BP 140/90 to 180/120 → ABPM to confirm hypertension, HBPM if ABPM is unsuitable (NICE NG136)","Avoids treating white-coat readings"],
         ["<b>Bloods</b>","HbA1c or fasting glucose (plasma glucose if HbA1c is unreliable); full lipid profile (total/HDL/LDL/non-HDL, triglycerides); U&amp;E; LFTs; TFTs if indicated; urate only when indicated — gout or suspected gout, uric-acid nephrolithiasis, CKD or medication-related concern, or a specific management question","NICE uses non-HDL reduction for primary prevention and LDL or non-HDL targets in secondary prevention — retain both"],
         ["<b>NAFLD assessment</b>","If steatosis is identified or MASLD is suspected, exclude other liver disease where clinically indicated and assess fibrosis using the local sequential pathway — usually FIB-4 (BSG 2018) followed by ELF (NICE NG49) or transient elastography when indicated. Normal liver enzymes do not exclude MASLD or advanced fibrosis, and routine LFTs are not a fibrosis assessment. ELF is not universally available in primary care","Finds the patients whose prognosis is hepatic, not cardiac"],
         ["<b>Urine ACR</b>","Albumin:creatinine ratio and eGFR where indicated — diabetes, hypertension or CKD","Screens the organ damage the cluster drives"],
         ["<b>QRISK3 + ECG</b>","Cardiovascular risk score (the QRISK tool) in the primary-prevention population; ECG as part of target-organ-damage assessment in confirmed hypertension, or if symptomatic (LVH, prior infarct) — not a universal metabolic syndrome test","Sets statin and BP decisions"]
       ]},
       {b:"cards", items:[
         {tone:"purple", h:"NG12 criteria that surface here <span class='tw'>Suspected cancer</span>", html:"Metabolic syndrome has no NICE NG12 criterion of its own, and this page does not invent one — but two NG12 routes arise directly from this work-up and must not be lost in a risk-factor consultation:<br>• Aged 60 and over with weight loss and any of diarrhoea, back pain, abdominal pain, nausea, vomiting, constipation or new-onset diabetes → urgent direct-access CT (or urgent ultrasound if CT is unavailable) within 2 weeks for suspected pancreatic cancer. New-onset diabetes alone is not the criterion — new diabetes with unexplained weight loss is one qualifying combination, and reclassifying a patient into “new type 2 diabetes” is exactly where this is missed.<br>• Aged 60 and over with unexplained weight loss greater than 5% within 6 months → assess for additional symptoms and signs and offer urgent investigation, a suspected-cancer pathway referral or a non-specific symptoms pathway as appropriate — weight loss in this cluster should never be assumed to be a lifestyle success without asking whether it was intended.<br>Unintentional weight loss in a metabolic-syndrome patient is a symptom, not an outcome.", src:"NICE NG12 (updated April 2026)"}
       ]},
       {b:"why", html:"The investigation set simply measures each syndrome component and screens for the organ damage it drives — kidney (ACR), liver (MASLD with sequential fibrosis assessment), and cardiovascular (QRISK3, and ECG where indicated) — tests such as urate, ECG and PCOS or ED work-up are indication-driven, not universal."}
     ]},

    {id:"ladder", nav:"Treat", title:"Management — lifestyle first, then each component to target", sub:"Intensive lifestyle change is the foundation; layer evidence-based pharmacotherapy for each component by cardiovascular risk.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Foundation", title:"Weight and lifestyle", when:"every patient, at every stage", fromLabel:"the base of everything",
          html:"Agree an individualised weight-loss goal; Mediterranean-style diet; ≥150 min/week moderate activity plus resistance training; reduce sedentary time; alcohol within limits; smoking cessation; structured behavioural support; refer suspected OSA via the local sleep pathway. Even modest weight loss can improve cardiometabolic risk factors — 5–10% is not a universal minimum or guaranteed response."},
         {step:"Glycaemia", title:"Prevent or treat type 2 diabetes", when:"HbA1c 42–47 → NHS DPP", fromLabel:"prevention first",
          html:"Refer high-risk patients (HbA1c 42–47) to the NHS Diabetes Prevention Programme where eligible. If diabetic: NICE NG28 was updated in February 2026 to recommend modified-release metformin plus an SGLT2 inhibitor for most adults requiring glucose-lowering medication, introduced sequentially. <b>At the time of review, NHS Greater Manchester implementation and formulary advice should be followed where it differs or remains under review (GMMMG interim position).</b> SGLT2 inhibitors: check eGFR and licensing thresholds; warn about genital infection, volume depletion and euglycaemic DKA; give sick-day guidance; interrupt peri-operatively and in acute illness; caution with ketogenic diets and prolonged fasting. Then branch by phenotype — ASCVD → add subcutaneous semaglutide up to 1 mg; obesity or early-onset → earlier GLP-1 RA or tirzepatide."},
         {step:"Lipids", title:"Statin by risk", when:"QRISK3 ≥10% (primary prevention)", fromLabel:"NG238",
          html:"Use QRISK3 only in the appropriate primary-prevention population — not to override established CVD, FH, diabetes-specific indications or major risk-underestimation factors. Offer atorvastatin 20 mg for primary prevention at QRISK3 ≥10% (NICE NG238), but do not exclude treatment solely because the score is below 10% if the person prefers treatment or risk is likely to be underestimated. Secondary prevention: atorvastatin 80 mg unless contraindicated or not tolerated. Aim for a &gt;40% non-HDL reduction in primary prevention. Check lipid profile and transaminases 2–3 months after starting or changing treatment, and transaminases at 12 months."},
         {step:"Blood pressure", title:"Treat to target (NG136)", when:"if hypertensive", fromLabel:"if BP raised",
          html:"Treat confirmed hypertension (clinic ≥140/90 confirmed by ABPM/HBPM), not the 130/85 clustering threshold. ACEi or ARB first-line with type 2 diabetes; without diabetes, a CCB is generally first-line at age 55 or over or in people of Black African/African-Caribbean family origin. Do not combine an ACE inhibitor with an ARB. Thresholds and targets by age, diabetes and CKD status. See the <a href='hypertension.html'>hypertension protocol</a>."},
         {step:"Weight Rx", title:"Pharmacotherapy — orlistat or GLP-1", when:"obesity not responding", fromLabel:"within NICE TA875/TA664 criteria",
          html:"Orlistat, or a GLP-1 (semaglutide/liraglutide) within NICE TA875 (semaglutide) or TA664 (liraglutide) criteria and specialist weight services for eligible patients."},
         {step:"Surgery", title:"Bariatric referral", when:"meets NICE NG246 thresholds", fromLabel:"NG246",
          html:"Consider per NICE NG246: BMI ≥40 kg/m², or 35–39.9 kg/m² with a significant weight-related condition; lower thresholds, usually reduced by 2.5 kg/m², for specified ethnic groups; recent-onset type 2 diabetes allows expedited assessment at BMI ≥35 and consideration at BMI 30–34.9, with specialist obesity-service involvement. A fixed period of Tier 3 treatment is not required before referral in all patients."}
       ]},
       {b:"why", html:"No single drug treats “metabolic syndrome”; outcomes improve by managing each component to guideline targets on a foundation of weight loss. SGLT2 inhibitors and GLP-1 agonists are increasingly central because they combine glycaemic control with weight loss and cardiorenal protection."},
       {b:"say", html:"Several risk factors are clustering together — weight around the middle, blood pressure, sugar and cholesterol. The good news is they respond to the same changes. Even a modest amount of weight loss, moving more and stopping smoking can improve them — we'll agree a goal that suits you, and add tablets where needed to bring each number to target."}
     ]},

    {id:"lifestyle", nav:"Lifestyle", title:"Lifestyle and behaviour change", sub:"Sustained behaviour change underpins every component of the syndrome.",
     blocks:[
       {b:"table", head:["Domain","What to advise","Why"], rows:[
         ["<b>🥗 Diet</b>","Mediterranean-style or calorie-controlled; reduce refined carbohydrate, sugary drinks and ultra-processed food; increase fibre, vegetables and oily fish","Improves every component simultaneously"],
         ["<b>🏃 Physical activity</b>","≥150 min/week moderate (or 75 min vigorous) aerobic plus 2 sessions of resistance training; reduce sedentary time","Improves insulin sensitivity independent of weight"],
         ["<b>⚖️ Weight goals</b>","Realistic, individualised goal — even modest loss helps, and 5–10% is not a universal minimum; interpret BMI alongside central adiposity and ethnicity; self-monitoring; multicomponent structured programmes (NHS DPP, commercial referrals; NICE NG246)","Structured programmes with self-monitoring and behavioural support outperform advice alone"],
         ["<b>🍺 Alcohol</b>","<b>Within UK limits (≤14 units/week)</b>","<b>Fewer calories plus better BP and triglycerides</b>"],
         ["<b>🚭 Smoking</b>","<b>Offer cessation</b>","<b>The single biggest CV risk reduction</b>"],
         ["<b>😴 Sleep and OSA</b>","<b>Refer suspected OSA via the local sleep pathway for diagnostic testing (Epworth is a screening tool only); treat confirmed OSA; promote sleep hygiene</b>","<b>Poor sleep worsens insulin resistance and appetite regulation</b>"],
         ["<b>🧠 Behavioural support</b>","Goal-setting, motivational interviewing, address depression and binge eating, peer or group support to sustain change","Treating OSA and low mood removes major barriers to weight loss and activity"]
       ]}
     ]},

    {id:"special", nav:"Special groups", title:"Special populations", sub:"Risk and thresholds are not uniform — some groups need earlier and more aggressive management, others need less.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"South Asian / high-risk ethnicity", html:"Lower waist and BMI thresholds — South Asian, Chinese, other Asian, Middle Eastern, Black African and African-Caribbean backgrounds (NICE NG246); earlier and more intensive intervention; higher diabetes risk at any given weight."},
         {tone:"blue", h:"Women with PCOS", html:"High prevalence of insulin resistance; address weight, check for dysglycaemia, consider metformin; pregnancy planning. Ask about PCOS symptoms rather than investigating everyone."},
         {tone:"amber", h:"Severe mental illness", html:"Antipsychotic-associated metabolic risk — coordinate with the mental-health team before changing an antipsychotic. Ensure the physical-health monitoring required for people with severe mental illness is completed, including weight, BP, glucose/HbA1c and lipids; early intervention."},
         {tone:"cream", h:"Older adults", html:"Individualise targets; balance benefits against frailty, polypharmacy and hypoglycaemia risk."},
         {tone:"blue", h:"Children and adolescents", html:"Rising prevalence — family-based lifestyle approach; refer to paediatric or specialist services."}
       ]},
       {b:"why", html:"Ethnicity, PCOS and severe mental illness all shift the picture toward earlier, more aggressive management, while older and frailer patients need individualised, less intensive targets to avoid harm."}
     ]},

    {id:"monitor", nav:"Monitor", title:"Monitoring and long-term review", sub:"There is no single NICE-mandated annual metabolic syndrome review — assemble review from the relevant component pathways, individualised to the patient.",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["<b>Component review</b>","<b>BP by severity and treatment changes; HbA1c by glycaemic status; lipids after treatment changes, then per the lipid pathway; renal ACR/eGFR if diabetes, hypertension or CKD; smoking, alcohol, weight and physical activity; OSA, mental health and medication review</b>","<b>Recalculate QRISK3 where appropriate; titrate treatments to target; reinforce lifestyle; frequency reflects frailty, mental health and social circumstances</b>"],
         ["<b>Diabetes prevention</b>","<b>Per risk — re-check HbA1c in those with impaired glucose regulation</b>","<b>Re-refer to the prevention programme as needed</b>"],
         ["<b>Liver surveillance</b>","<b>Reassess fibrosis per MASLD risk and the local pathway</b>","<b>Refer advanced fibrosis, cirrhosis, portal-hypertension features or diagnostic uncertainty</b>"],
         ["<b>Medication monitoring</b>","Per agent — statin (lipids and transaminases at 2–3 months, transaminases at 12 months), antihypertensives (U&amp;E), diabetes drugs","<b>Review adherence and side effects</b>"],
         ["<b>Complication screening</b>","Retinal and foot screening belong to diabetes care — only if diabetic; cardiovascular symptom review; mental health","Catches progression early"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"📞 Acute event — 999", html:"Chest pain, breathlessness, or stroke symptoms (FAST) → emergency, call 999."},
         {tone:"amber", h:"🟠 New diabetes symptoms", html:"Thirst, polyuria, weight loss, or recurrent infections → check glucose/HbA1c. New chest pain, neurological deficit or symptomatic hyperglycaemia → the appropriate acute pathway."},
         {tone:"cream", h:"💬 Safety-net script", html:"“Seek urgent help for chest pain or stroke symptoms; tell us about excessive thirst, passing lots of urine, or unexplained weight loss.”"}
       ]},
       {b:"why", html:"Metabolic syndrome is a long-term, modifiable risk state: individualised, component-driven review tracks each component to target, detects progression to diabetes or advanced liver disease early, and maintains the lifestyle gains that drive most of the benefit."}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways", sub:"Most management is in primary care; refer for specialist weight management, complications, or diagnostic uncertainty.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"Tier 3 / specialist weight management", html:"Complex obesity, GLP-1 or pharmacotherapy initiation where required, pre-bariatric assessment."},
         {tone:"amber", h:"Bariatric surgery (Tier 4)", html:"<b>Meets NICE NG246 thresholds</b> — BMI ≥40, or 35–39.9 with a significant weight-related condition; usually 2.5 kg/m² lower for specified ethnic groups; recent-onset T2DM: expedited assessment at BMI ≥35, consider at 30–34.9. Earlier comprehensive specialist assessment is appropriate in some patients rather than a fixed period of Tier 3 treatment."},
         {tone:"blue", h:"Hepatology", html:"Advanced fibrosis (ELF 10.51 or above with NAFLD, NICE NG49), cirrhosis, portal-hypertension features or diagnostic uncertainty. A high or indeterminate FIB-4 (BSG 2018) generally leads to second-line testing (ELF or transient elastography) or the local specialist pathway rather than automatic direct hepatology referral."},
         {tone:"blue", h:"Cardiology / lipid clinic", html:"Possible familial hypercholesterolaemia (via the local lipid/FH pathway), triglycerides &gt;20 mmol/L or persistently &gt;10 mmol/L, statin intolerance, or established CVD needing specialist input."},
         {tone:"blue", h:"Sleep service", html:"<b>Suspected OSA (high Epworth or witnessed apnoea) via the local sleep pathway for diagnostic testing — Epworth is a screening tool, not a diagnosis.</b> See the <a href='osa.html'>OSA protocol</a>."},
         {tone:"blue", h:"Endocrinology", html:"Suspected secondary cause (Cushing's), difficult diabetes, or PCOS needing specialist care."},
         {tone:"green", h:"GP manages", html:"The whole framework: reclassification, component-by-component treatment to target, indication-driven screening for associated conditions, lifestyle and behavioural support, and individualised component-driven review."}
       ]},
       {b:"why", html:"Referral targets the high-yield complications and the patients who need interventions beyond primary care — advanced liver fibrosis, OSA, FH, and obesity severe enough for specialist weight services or surgery. Identifying these changes prognosis more than relabelling the syndrome."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only — the Casebook keeps the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 44-year-old British South Asian man attends for a “well man check”. Waist 98 cm, BMI 28, BP 138/88 on two readings, HbA1c 45 mmol/mol, triglycerides 2.4, HDL 0.9, ALT mildly raised. He works nights, snores heavily, and takes olanzapine for bipolar disorder. He feels well and wants to know if he needs “the diabetes tablet”."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Applies <b>ethnicity-specific waist thresholds</b> rather than reassuring on BMI; recognises the <b>full cluster (central obesity + 3 components)</b> and calculates <b>QRISK3</b>; screens the travelling companions — <b>NAFLD with FIB-4</b> for the raised ALT, <b>OSA with Epworth</b> given nights and snoring, and <b>urine ACR</b>; identifies <b>olanzapine as a metabolic contributor</b> and the SMI physical-health-monitoring duty, coordinating with the mental-health team rather than stopping it unilaterally; refers to the <b>NHS DPP for HbA1c 45</b> rather than starting metformin; negotiates an <b>individualised weight-loss goal</b> with a structured programme; refers suspected OSA via the sleep pathway; and safety-nets <b>chest pain, stroke symptoms and hyperglycaemia</b>."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>IDF (2006) \u00b7 NCEP ATP III \u00b7 Harmonised definition (2009)</b><span class="rd"> \u2014 the five components, the central-obesity-plus-two (IDF) and \u22653-of-5 (harmonised) rules, and the ethnicity-specific waist thresholds (Europid ≥94/≥80 cm; South Asian and Chinese/Japanese ≥90/≥80 cm). These are IDF/harmonised definitions, not NICE recommendations</span></li>'+
         '<li>NICE NG238 \u2014 Cardiovascular disease: risk assessment and lipid modification<br><a href="https://www.nice.org.uk/guidance/ng238" rel="noopener">nice.org.uk/guidance/ng238</a><span class="rd"> \u2014 QRISK3 \u226510% \u2192 atorvastatin 20 mg, 80 mg for secondary prevention, the &gt;40% non-HDL reduction target, monitoring at 2–3 and 12 months, and the triglyceride thresholds (&gt;20, 10–20 and 4.5–9.9 mmol/L)</span></li>'+
         '<li><b>NICE NG28 \u2014 Type 2 diabetes in adults (updated February 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng28" rel="noopener">nice.org.uk/guidance/ng28</a><span class="rd"> — MR metformin + SGLT2i introduced sequentially, then phenotype-based branching</span></li>'+
         '<li><b>NHS Greater Manchester — Review of NICE NG28 updates for type 2 diabetes management (GMMMG interim position, February 2026)</b><span class="rd"> — the updated NG28 recommendations are under local review; continue to follow the current GMMMG formulary position pending governance approval</span></li>'+
         '<li><b>NICE NG136 \u2014 Hypertension in adults</b><span class="rd"> — ABPM for clinic BP 140/90 to 180/120 (HBPM if unsuitable), severe hypertension at 180/120, ACEi/ARB first-line with type 2 diabetes, CCB at 55 or over or Black African/African-Caribbean origin without diabetes, no ACEi with ARB, age- and comorbidity-based thresholds and targets</span></li>'+
         '<li><b>NICE NG49 — Non-alcoholic fatty liver disease (NAFLD): assessment and management (MASLD is the newer terminology)</b><span class="rd"> \u2014 ELF testing for advanced fibrosis (10.51 or above); FIB-4 as a first-line score is from the BSG abnormal liver blood tests guideline (2018); and the hepatology referral trigger</span></li>'+
         '<li><b>NICE NG246 — Overweight and obesity management (2025)</b><span class="rd"> — multicomponent interventions; interpreting BMI alongside central adiposity and ethnicity; bariatric surgery thresholds, including the 2.5 kg/m² lower thresholds in some ethnic groups and recent-onset T2DM</span></li>'+
         '<li><b>NHS Diabetes Prevention Programme</b><span class="rd"> \u2014 the HbA1c 42\u201347 referral band</span></li>'+
         '<li><b>NICE NG12 \u2014 Suspected cancer (updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — aged 60+ with weight loss and any of diarrhoea, back pain, abdominal pain, nausea, vomiting, constipation or new-onset diabetes → urgent direct-access CT for pancreatic cancer; unexplained weight loss &gt;5% in 6 months at 60+ → urgent investigation, suspected-cancer or non-specific symptoms pathway</span></li>'+
         '<li><b>Local formulary and SPC</b><span class="rd"> — current GMMMG formulary and product SPCs for statins, antihypertensives, glucose-lowering and weight-management medicines</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Risk-management framework for the cardiometabolic cluster \u2014 IDF/harmonised criteria with NICE NG238, NG28 (Feb 2026), NG136, NG49 and NG246, the NHS Diabetes Prevention Programme, and NICE NG12 (updated April 2026) for the pancreatic-cancer route. Assessment and management are merged on this page; the former algorithm is retired. Treat each component to its guideline target, follow the NHS Greater Manchester (GMMMG) position on NG28 implementation where it differs, and verify every dose against the current BNF and local formulary."
});
