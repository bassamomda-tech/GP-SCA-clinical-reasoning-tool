MG.render({

  stemTitle:"The vague-symptom cancers — recognised not by any single feature but by the constellation, and confirmed by the humblest test in the building",
  stemSub:"Fatigue, the odd bruise, a second chest infection, a few pounds lost, a night sweat: individually benign, collectively marrow disease. One page for the whole of primary care's part — assembling the constellation rather than explaining each thread away, the NG12 thresholds for a very urgent FBC (with a blood film where indicated), the lymphoma and myeloma screens, what an abnormal count obliges you to do the same day, the emergencies that arrive after diagnosis, and neutropenic sepsis, which is the one that kills within hours.",
  guideline:"NICE NG12 · NG35 (myeloma) · CG151 (neutropenic sepsis) · NG47",

  nextReview:"11 March 2027",
  meta:[
    {t:"NICE NG12 — Suspected cancer: recognition and referral (updated April 2026)"},
    {t:"NICE NG35 — Myeloma: diagnosis and management"},
    {t:"NICE CG151 — Neutropenic sepsis"},
    {t:"Suspected leukaemia: very urgent FBC within 48h", tone:"tw"},
    {t:"v1.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#emergency"><b>Emergencies</b><small>Neutropenic sepsis</small></a><a href="#constellation"><b>Constellation</b><small>Not one symptom</small></a><a href="#ng12"><b>NG12</b><small>The thresholds</small></a><a href="#fbc"><b>Read the FBC</b><small>Film · blasts</small></a><a href="#refer"><b>Refer</b><small>By acuity</small></a></div>',
  quickSub:"If you read nothing else on this page, read these six cards. Every threshold traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Suspected neutropenic sepsis — immediate hospital assessment, do not wait for the count", html:"Suspect neutropenic sepsis in any patient receiving or recently having received systemic anticancer treatment (within 30 days — NICE NG253; follow the local acute-oncology pathway if it uses a wider post-treatment window) who becomes acutely unwell, whether or not they are febrile. Arrange immediate hospital assessment by emergency transfer and pre-alert the emergency/acute oncology service — do not wait for the neutrophil count and do not send them to a routine appointment. Antibiotics should be administered immediately in hospital according to the local neutropenic-sepsis protocol (NICE CG151); do not delay treatment for FBC, cultures or imaging. Do not attempt to manage suspected neutropenic sepsis with oral antibiotics in primary care; selected low-risk patients may later be managed with oral/outpatient antibiotics only after hospital assessment, specialist review and validated risk stratification. Neutropenic sepsis is confirmed in hospital (neutrophils ≤0.5 × 10⁹/L with temperature above 38°C or other signs of clinically significant sepsis). The patient may be afebrile: hypothermia, rigors, confusion, hypotension or simply “not right” all count, and steroids mask fever. <b>Mortality is measurable in hours.</b> Every patient starting chemotherapy should leave your consultation knowing this."},
    {tone:"purple", h:"Suspected cancer · NG12 — suspected leukaemia: a very urgent FBC within 48 hours", html:"Consider a very urgent full blood count, within 48 hours, to assess for leukaemia in adults with any of: pallor, persistent fatigue, fever, recurrent or persistent infection, generalised lymphadenopathy, unexplained bruising, unexplained bleeding, petechiae, or hepatosplenomegaly. In children and young people, refer for immediate specialist assessment if there are unexplained petechiae or hepatosplenomegaly, and offer a very urgent FBC within 48 hours for the other features. Request the very urgent FBC and state the clinical concern. Request a blood film where clinically indicated or according to local laboratory protocol, and ensure abnormal results are actively reviewed and acted upon. A normal FBC does not exclude lymphoma, early myeloma or some marrow disorders."},
    {tone:"purple", h:"Suspected cancer · NG12 — lymphoma and myeloma", html:"Lymphoma: consider a suspected cancer pathway referral for unexplained lymphadenopathy or splenomegaly, taking into account any associated B symptoms — fever, night sweats, shortness of breath, pruritus, weight loss, alcohol-induced lymph node pain. Do not delay referral because the FBC is normal. Myeloma: in people aged 60 and over with persistent bone pain, particularly back pain, or an unexplained fracture, offer FBC, calcium, renal function, ESR or plasma viscosity, serum protein electrophoresis and serum free light chains, all together (urine Bence-Jones if free light chain testing is not available); suspected cancer pathway referral if the results suggest myeloma. Do not use any single negative test to exclude myeloma."},
    {tone:"red", h:"The abnormal FBC obliges you to act the same day", html:"Discuss the result with haematology by telephone the same day — not a suspected cancer pathway referral letter and not a repeat in two weeks — when the blood film suggests acute leukaemia, there are blasts, severe or rapidly worsening cytopenias, suspected acute promyelocytic leukaemia, or the patient is clinically unwell. Follow local laboratory critical-result thresholds for severe thrombocytopenia, neutropenia or leucocytosis. Acute leukaemia can progress from abnormal count to life-threatening in days. A result that arrives in your inbox is not the same as a result that has been acted upon — have an explicit system for reviewing and acting on the very urgent FBC you ordered, and document the clinician responsible for chasing it."},
    {tone:"amber", h:"Persistence and combination, not any single symptom", html:"Almost every individual feature is more often benign than malignant — reactive lymphadenopathy after a virus, fatigue in a busy life, a bruise on an anticoagulant. Persistence, progression and symptom combination increase concern, but do not delay urgent assessment where there are red flags or abnormal results — the NG12 leukaemia criteria do not require six weeks' persistence, and blasts, petechiae, hepatosplenomegaly, significant cytopenias, or concerning nodes with systemic symptoms need action now. <b>Safety-net explicitly and re-examine rather than reassure by default</b>."},
    {tone:"blue", h:"Myeloma is the one that is missed", html:"Median time to diagnosis is among the longest of any cancer, and most patients have seen their GP three or more times first. The reason is that back pain in a 70-year-old is common and myeloma is not. The discipline: in the over-60s, unexplained back pain that is persistent, or that wakes them at night, or that comes with anaemia, renal impairment, hypercalcaemia or recurrent infection, gets the CRAB screen — not another course of analgesia."}
  ],
  pathwaySub:"Five moves. The first is a safety question that takes ten seconds and occasionally saves a life.",
  pathway:[
    {title:"Is this an emergency now?", html:"Acutely unwell (febrile or not) on or within 30 days of systemic anticancer treatment, or within a wider local acute-oncology window → suspect neutropenic sepsis, immediate hospital assessment, antibiotics immediately in hospital. Also: cord compression, symptomatic hypercalcaemia, hyperviscosity, tumour lysis.", alert:true},
    {title:"Assemble the constellation", html:"Ask about all of it, not just the presenting thread — fatigue, pallor, bruising and bleeding, recurrent infection, fever, drenching night sweats, weight loss, bone pain, lumps, itch. <b>Ask how long, and whether it is progressing.</b>"},
    {title:"Examine for marrow failure and infiltration", html:"Pallor, bruising, petechiae and purpura; all node groups including epitrochlear and supraclavicular; liver and spleen; bone and sternal tenderness; temperature."},
    {title:"Order the right bloods, very urgently", html:"FBC (with a blood film where clinically indicated or per local laboratory protocol), plus U&amp;E, calcium, LFTs, LDH and ESR or plasma viscosity. Add protein electrophoresis and serum-free light chains where myeloma is suspected. State the suspicion on the request form and put a plan in place to chase the result."},
    {title:"Refer by acuity, not by habit", html:"Emergency admission for the emergencies · same-day haematology discussion for blasts, a film suggesting acute leukaemia, new, severe or progressive cytopenias, or a grossly abnormal count (local critical-result thresholds) · suspected cancer pathway referral otherwise · for a child, refer per NG12 following the local paediatric pathway (telephone discussion or direct admission)."}
  ],
  sections:[

    {id:"emergency", nav:"Emergencies", title:"The haematological emergencies",
     sub:"Most arrive after the diagnosis is known — which means they arrive to the GP, out of hours, from a patient who has been told to ring if anything changes.",
     blocks:[
       {b:"table", head:["Emergency","Recognising it","Action"], rows:[
         ["<b>Neutropenic sepsis</b>","Suspect in anyone acutely unwell, febrile or not, who is having or has had systemic anticancer treatment within 30 days (or the wider local acute-oncology window). Confirmed in hospital: neutrophils ≤0.5 × 10⁹/L with temperature above 38°C or other signs of clinically significant sepsis (CG151). May present with hypothermia, rigors, confusion, hypotension, or simply feeling dreadful — fever can be absent, especially on steroids","Immediate hospital assessment by the fastest route; pre-alert the emergency/acute oncology service. Antibiotics are administered immediately in hospital according to the local neutropenic-sepsis protocol (NICE CG151; NG253) — do not delay treatment for FBC, cultures or imaging. Do not wait for the neutrophil count or arrange an outpatient FBC. Do not manage suspected neutropenic sepsis with oral antibiotics in primary care; oral/outpatient antibiotics are only for selected low-risk patients after hospital assessment, specialist review and validated risk stratification"],
         ["<b>Metastatic spinal cord compression</b>","Back pain with any new leg weakness, sensory level, saddle anaesthesia, or bladder or bowel dysfunction, in known or suspected myeloma or lymphoma","Contact the MSCC coordinator immediately; urgent whole-spine MRI (within 24 hours, NG234). Immobilise without delay if neurological signs suggest spinal instability; consider immobilisation for severe movement-related pain; follow the local MSCC protocol for transport and positioning. If neurological symptoms/signs suggest MSCC, give dexamethasone 16 mg orally (or equivalent parenteral dose) as soon as possible unless contraindicated. Without neurological signs, seek MSCC/oncology advice before steroids where possible — particularly if lymphoma is suspected, because steroids may impair tissue diagnosis"],
         ["<b>Symptomatic hypercalcaemia</b>","Thirst, polyuria, confusion, drowsiness, constipation, vomiting — common in myeloma and in some lymphomas","If symptomatic hypercalcaemia is suspected, arrange urgent corrected calcium, renal function, phosphate and ECG assessment and hospital management. Do not attempt IV fluids or bisphosphonate treatment in routine primary care unless following an established specialist pathway. Severity depends on the calcium level, rate of rise, symptoms, renal function, hydration and comorbidity — not a single threshold"],
         ["<b>Hyperviscosity</b>","Paraproteinaemia (myeloma, Waldenström's) with neurological symptoms (headache, confusion), visual disturbance or visual loss, or mucosal bleeding","Immediate haematology discussion and emergency admission; plasma exchange is a specialist procedure"],
         ["<b>Leukostasis</b>","Marked leucocytosis with respiratory compromise (breathlessness, hypoxia) or neurological compromise (confusion, visual disturbance)","Immediate haematology discussion and emergency admission; leukapheresis is a specialist procedure"],
         ["<b>Tumour lysis syndrome</b>","Spontaneous in a high-turnover malignancy, or triggered by chemotherapy, steroids, radiotherapy, immunotherapy or targeted treatment — oliguria, arrhythmia, tetany, confusion","<b>Emergency haematology/oncology admission and local tumour-lysis management; urgent U&amp;E/creatinine, potassium, phosphate, corrected calcium, urate, LDH and ECG</b>"],
         ["<b>Profound thrombocytopenia with bleeding</b>","Spontaneous bruising, mucosal or retinal bleeding, severe thrombocytopenia on the count","Same-day haematology advice; avoid NSAIDs and intramuscular injections. Changes to anticoagulation or antiplatelet therapy should be specialist-guided unless there is major bleeding or another immediate indication"]
       ]},
       {b:"warn", html:"The neutropenic sepsis safety-net is a GP responsibility even though the chemotherapy is not. Every patient of yours who starts chemotherapy should know: a thermometer at home, a 24-hour acute oncology number, and the instruction that feeling unwell or feverish means going straight to hospital — not ringing the surgery in the morning, and not waiting to see if it settles. Check that they have the number and that they know it overrides any other advice, including yours. Advise them to check their temperature if unwell, but not to delay seeking help if no thermometer is available. Record in the shared care summary: the cancer diagnosis, treatment regimen and date of last systemic therapy, whether they have a central venous access device, the exact local 24-hour acute oncology number and the route of transfer — following the Greater Manchester acute oncology and MSCC pathways. NICE CG151 recommends written and oral information about neutropenic sepsis, with 24-hour oncology advice, before and throughout anticancer treatment."}
     ]},

    {id:"constellation", nav:"Constellation", title:"The presentation — why these cancers are missed",
     sub:"Nothing here is specific. That is the entire diagnostic problem, and the reason the discipline has to be structural.",
     blocks:[
       {b:"table", head:["Feature","What it reflects","Note"], rows:[
         ["<b>Fatigue, pallor, breathlessness on exertion</b>","<b>Anaemia from marrow failure or infiltration</b>","The most commonly dismissed symptom in medicine — and iron deficiency found on a blood test does not by itself explain a full constellation"],
         ["<b>Unexplained bruising, petechiae, purpura, mucosal or gum bleeding</b>","<b>Thrombocytopenia</b>","Petechiae are the single most alarming sign here, especially in a child. Look in the mouth and on the lower legs"],
         ["<b>Recurrent, persistent or unusually severe infection</b>","<b>Neutropenia or immune paresis</b>","Two chest infections in two months in a previously well adult is a haematological question, not just a respiratory one"],
         ["<b>Drenching night sweats, fever, unintentional weight loss</b>","<b>B symptoms — lymphoma</b>","<b>“Drenching” means changing nightclothes or bedding.</b> Ask that specifically; “I get a bit sweaty” is different"],
         ["<b>Persistent, enlarging or generalised lymphadenopathy</b>","<b>Lymphoma or leukaemia</b>","<b>Supraclavicular, epitrochlear, hard, fixed, enlarging, generalised or persistent lymphadenopathy is concerning</b>, particularly with systemic symptoms — refer according to NG12 and the local rapid-access lymphoma pathway. Supraclavicular or epitrochlear lymphadenopathy is particularly concerning and requires explanation, especially if persistent, enlarging or associated with systemic features. Node size and texture are supportive features, not reliable exclusion criteria; six weeks is not a prerequisite for referral when a node is clinically suspicious or associated with B symptoms, splenomegaly or significant systemic illness"],
         ["<b>Persistent bone pain, especially back; pathological fracture</b>","<b>Myeloma</b>","<b>Pain at rest or at night is the discriminator from mechanical pain.</b> A vertebral fracture with no adequate trauma in an older person is myeloma until excluded"],
         ["<b>Generalised itch without a rash; lymph node pain after alcohol</b>","<b>Classic Hodgkin lymphoma clues</b>","<b>Alcohol-induced node pain is rare but close to specific</b> — worth asking about directly when nodes are present"],
         ["<b>Hepatosplenomegaly, or any organomegaly</b>","<b>Infiltration</b>","<b>A palpable spleen in an adult should be confirmed and explained</b>, particularly if new or associated with cytopenias, lymphadenopathy or constitutional symptoms"]
       ]},
       {b:"why", html:"The error that produces late diagnosis is not ignorance of these features — it is that each one is dealt with in a separate consultation, by a different clinician, and explained away individually. The fatigue is attributed to age, the bruise to a knock, the infections to the season, the weight loss to the fatigue. Each explanation is locally reasonable and the sum is a missed leukaemia. The structural defences are: an open question that invites everything at once (“tell me everything that's been going on, even things that seem unrelated”), a review of the record for the pattern of recent attendances, and treating a third presentation of vague symptoms as a red flag in itself."}
     ]},

    {id:"ng12", nav:"NG12", title:"The NICE NG12 thresholds, in full",
     sub:"These are the numbers to know. They are restated in Refer.",
     blocks:[
       {b:"cards", items:[
         {tone:"purple", h:"🩸 Leukaemia — adults", html:"Consider a very urgent full blood count, within 48 hours, to assess for leukaemia in adults with any of: pallor, persistent fatigue, unexplained fever, unexplained persistent or recurrent infection, generalised lymphadenopathy, unexplained bruising, unexplained bleeding, unexplained petechiae, or hepatosplenomegaly."},
         {tone:"purple", h:"🧒 Leukaemia — children and young people", html:"Refer children and young people for immediate specialist assessment if they have unexplained petechiae or hepatosplenomegaly. Offer a very urgent full blood count within 48 hours in children and young people with any of: pallor, persistent fatigue, unexplained fever, unexplained persistent infection, generalised lymphadenopathy, persistent or unexplained bone pain, unexplained bruising or unexplained bleeding. Leukaemia is the commonest childhood cancer — see also the <a href='../algorithms/limping-children.html'>limping child pathway</a>, where bone pain is the presenting feature."},
         {tone:"purple", h:"🔍 Lymphoma — adults", html:"Consider a suspected cancer pathway referral for unexplained lymphadenopathy (Hodgkin and non-Hodgkin lymphoma) or splenomegaly (non-Hodgkin lymphoma), taking into account associated symptoms — particularly fever, night sweats, shortness of breath, pruritus, weight loss, and alcohol-induced lymph node pain. <b>Both lymphomas share the lymphadenopathy route; splenomegaly is a non-Hodgkin criterion, and alcohol-induced node pain is a Hodgkin feature.</b>"},
         {tone:"purple", h:"🧒 Lymphoma — children and young people", html:"Consider a very urgent referral (for an appointment within 48 hours) for specialist assessment in children and young people with unexplained lymphadenopathy or splenomegaly, taking the same associated symptoms into account."},
         {tone:"purple", h:"🦴 Myeloma — one panel, sent together", html:"In people aged 60 and over with persistent bone pain, particularly back pain, or an unexplained fracture, offer a full blood count, calcium, ESR or plasma viscosity, serum protein electrophoresis and serum free light chains — all at the same time, not in two stages (NG12, updated April 2026), with renal function checked alongside. If serum free light chain testing is not available, use a Bence-Jones protein urine test. Refer using a suspected cancer pathway referral if the results suggest myeloma."},
         {tone:"amber", h:"🩸 And the criterion people forget", html:"A raised plasma viscosity or ESR in an older person with bone pain is not a soft result to be repeated in a month — it is a result to act on now: if electrophoresis and serum free light chains were not sent alongside it, send them today. Equally: a normal result on one component of the myeloma screen — including a normal ESR or normal electrophoresis — does not exclude myeloma when clinical suspicion remains high (NG35). Light-chain-only and oligosecretory disease may be missed by serum electrophoresis alone; serum-free light-chain testing is therefore important. Interpret the full panel and discuss discordant results with haematology. <b>If suspicion is high, refer regardless of the screen.</b>"}
       ]},
       {b:"dl", rows:[
         ["<b>CRAB — the myeloma features to ask about and look for</b>","<b>hyperCalcaemia</b> (thirst, confusion, constipation, polyuria) · <b>Renal impairment</b> (a new or unexplained rise in creatinine) · <b>Anaemia</b> (normocytic, with a raised total protein or globulin gap) · <b>Bone lesions</b> (pain, lytic lesions, pathological or vertebral fracture). Add recurrent infection from immune paresis, which is the feature most often attributed to something else"]
       ]}
     ]},

    {id:"fbc", nav:"Read the FBC", title:"Reading the count, and what obliges same-day action",
     sub:"The FBC is the most powerful test in general practice and the most frequently under-read.",
     blocks:[
       {b:"table", head:["Finding","Interpretation","Action"], rows:[
         ["<b>Blasts on the film, or a film suggesting acute leukaemia or acute promyelocytic leukaemia</b>","<b>Acute leukaemia until proven otherwise</b>","Same-day telephone discussion with haematology. Do not wait, do not repeat, do not send a letter"],
         ["<b>Pancytopenia</b>","Acute leukaemia, myelodysplasia, aplasia, marrow infiltration, B12/folate deficiency, infection, hypersplenism, drugs, autoimmune disease or advanced liver disease","<b>New, severe, progressive or symptomatic pancytopenia requires same-day haematology discussion.</b> Send relevant haematinic and biochemical tests in parallel, but do not delay referral where acute leukaemia or marrow failure is possible. Stable, mild pancytopenia may follow a different local pathway"],
         ["<b>White cell count markedly raised or very low (local critical-result thresholds)</b>","Leukaemia; persistent isolated lymphocytosis may represent CLL or a reactive process — a diagnosis of CLL requires immunophenotyping, not simply a raised lymphocyte count","Same-day discussion if severe or rising, the patient is unwell, or other cytopenias are present. A stable isolated lymphocytosis in a well patient is not usually an emergency: confirm persistence and follow the local haematology/lymphocytosis pathway; urgent referral if there are cytopenias, rapidly rising counts, splenomegaly, bulky nodes, B symptoms or clinical deterioration"],
         ["<b>Severe thrombocytopenia (local critical-result threshold), or thrombocytopenia with bleeding</b>","<b>Severe thrombocytopenia — consider marrow failure or immune thrombocytopenia</b>","<b>Same-day haematology advice.</b> <b>Avoid NSAIDs and intramuscular injections.</b> Changes to anticoagulation or antiplatelet therapy should be specialist-guided unless there is major bleeding or another immediate indication — weigh active bleeding, the indication, thrombosis risk and suspected immune thrombocytopenia"],
         ["Normocytic anaemia with a raised total protein, globulin gap, raised calcium or new renal impairment","<b>Myeloma</b>","<b>Send electrophoresis and serum free light chains now if not already sent with the FBC</b>"],
         ["<b>Isolated, stable, mild abnormality in a well patient with no red flags</b>","<b>Frequently benign</b>","<b>Repeat with a film and a clear interval, and safety-net.</b> Do not let an isolated mild abnormality become a reason to drop the rest of the constellation"],
         ["<b>A normal FBC in the face of strong clinical suspicion</b>","<b>Does not exclude lymphoma, early myeloma or marrow disease</b>","<b>Refer on the clinical picture.</b> Lymphoma frequently presents with an entirely normal count — a normal FBC is the commonest reason a lymphoma referral is wrongly deferred"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"🧪 Request the film, and say why", html:"Check the local laboratory protocol — some laboratories add a film automatically from analyser flags or clinical details, others need a separate request. Request a blood film explicitly when acute leukaemia, marrow failure, unexplained cytopenias or abnormal cells are suspected, and document the clinical concern on the request — “?leukaemia, unexplained bruising and petechiae” gets read by the laboratory and changes what they do with the sample and how fast. NICE NG47 supports integrated diagnostic reporting through specialist integrated haematological malignancy diagnostic services."},
         {tone:"amber", h:"📋 Chase what you ordered", html:"<b>A very urgent FBC is only very urgent if someone looks at the result.</b> Book the follow-up before the patient leaves, tell them when and how they will hear, and make the result your task rather than theirs (document the clinician responsible for chasing it, and use local laboratory critical-result thresholds) — the failure point in almost every delayed-diagnosis case review is the unchased result, not the unordered test."},
         {tone:"green", h:"🔬 The supporting bloods", html:"U&amp;E and creatinine, corrected calcium, LFTs including albumin and total protein, LDH, ESR or plasma viscosity, and coagulation if there is any bleeding. LDH reflects tumour burden in lymphoma; the globulin gap is a cheap pointer to a paraprotein."},
         {tone:"blue", h:"🩻 Imaging", html:"CXR for mediastinal lymphadenopathy where lymphoma is suspected — but a normal CXR excludes nothing and must not delay referral. Imaging for suspected myeloma is specialist-led: whole-body MRI first-line, whole-body low-dose CT if MRI is unsuitable or declined, and a plain skeletal survey only if both are unsuitable or declined (NG35) — do not order a skeletal survey yourself."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral by acuity",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Emergency — now", html:"Suspected neutropenic sepsis (acutely unwell, febrile or not, on or within 30 days of systemic anticancer treatment, or the wider local window) — immediate emergency transfer, antibiotics immediately in hospital, do not await the FBC. Blood film/FBC reported as acute leukaemia — immediate haematology referral. MSCC symptoms — immediate MSCC coordinator contact and urgent whole-spine MRI. Myeloma with suspected spinal cord compression or acute renal failure — immediate referral. Severe symptomatic hypercalcaemia, hyperviscosity, leukostasis, tumour lysis or major thrombocytopenic bleeding — emergency admission."},
         {tone:"red", h:"Same day — telephone haematology", html:"Blasts or a film suggesting acute leukaemia · suspected acute promyelocytic leukaemia · new, severe, progressive or symptomatic pancytopenia · severe or rapidly worsening cytopenias or leucocytosis (local critical-result thresholds) · any grossly abnormal count in an unwell patient. <b>A conversation, not a letter.</b>"},
         {tone:"purple", h:"Suspected cancer · NICE NG12", html:"Leukaemia (adults): very urgent FBC within 48 hours for unexplained pallor, persistent fatigue, fever, recurrent or persistent infection, generalised lymphadenopathy, bruising, bleeding, petechiae or hepatosplenomegaly. Lymphoma: suspected cancer pathway referral for unexplained lymphadenopathy or splenomegaly, considering fever, night sweats, breathlessness, pruritus, weight loss and alcohol-induced node pain; do not delay referral because the FBC is normal. Myeloma (60+): persistent bone pain, particularly back pain, or unexplained fracture → FBC, calcium, renal function, ESR or plasma viscosity, serum protein electrophoresis and serum free light chains, all together (urine Bence-Jones if free light chain testing is not available); suspected cancer pathway referral if the results suggest myeloma. Do not use any single negative test to exclude myeloma."},
         {tone:"amber", h:"Children and young people", html:"Immediate specialist referral for unexplained petechiae or hepatosplenomegaly. Very urgent FBC within 48 hours for unexplained pallor, fatigue, fever, persistent infection, generalised lymphadenopathy, persistent bone pain, bruising or bleeding. Very urgent referral within 48 hours for unexplained lymphadenopathy or splenomegaly. Follow the local paediatric pathway, which may require telephone discussion or direct admission rather than an adult suspected-cancer referral route."},
         {tone:"blue", h:"Routine haematology", html:"Persistent, stable isolated lymphocytosis in a well patient (CLL or reactive — confirm persistence and follow the local lymphocytosis pathway; CLL requires immunophenotyping) · monoclonal gammopathy of undetermined significance found incidentally · stable mild cytopenias with no red flags. MGUS still needs specialist-directed follow-up — the progression rate is roughly 1% per year and it does not discharge itself."},
         {tone:"cream", h:"The GP's continuing role", html:"After diagnosis: recognising the emergencies above, supporting treatment side effects, vaccination advice (avoid live vaccines during and after immunosuppression — take specialist advice), infection risk, psychological support for patient and family, carers' needs, and palliative and end-of-life care where appropriate. Related pages: <a href='../algorithms/lymphadenopathy.html'>lymphadenopathy pathway</a> · <a href='../algorithms/lymphocytosis.html'>lymphocytosis</a> · <a href='anaemia-iron-deficiency.html'>iron deficiency anaemia</a> · <a href='../../cases/haematological-cancers.html'>the casebook chapter</a>."}
       ]},
       {b:"say", html:"I know you were hoping I'd give you something to perk you up, and I wish it were that simple. The problem is that on their own, each of these things — the tiredness, the bruises, the two chest infections, losing a bit of weight — could be nothing much. But together they make me want to check how your bone marrow is working, because that's what makes all your blood cells, and if it isn't working properly it explains all four at once. So I'd like to do a blood test urgently, within the next day or two, and I'll chase the result myself and ring you. Most of the time these tests are reassuring. But the careful thing here is to check quickly rather than wait and see."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 67-year-old man attends with his wife, 6 weeks of feeling “washed out”, breathless on the stairs, with <b>several unexplained bruises</b>, <b>two chest infections in two months</b>, <b>weight loss</b> and <b>drenching night sweats</b>. His wife says he looks pale and pushed him to come. On examination he is pale with scattered bruising and petechiae, a palpable spleen tip and small cervical nodes. He is not febrile today. He opens with “it's just my age, isn't it — can you give me a tonic or some iron?”"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Assembles the four separate complaints into one constellation rather than addressing the fatigue alone; screens for <b>B symptoms, bone pain and lymphadenopathy</b>; <b>examines nodes, spleen, liver and temperature and narrates it</b>; orders a <b>very urgent FBC within 48 hours, naming NG12, with a blood film requested because of the bruising and petechiae</b>, plus calcium, LDH and ESR; states what happens if the count is grossly abnormal — a same-day haematology phone call, not a letter; <b>gives the neutropenic sepsis safety-net explicitly</b> and any patient starting chemotherapy the 24-hour number; <b>validates the wife's observation</b> rather than talking over her; is honest about uncertainty without either catastrophising or promising it is nothing; and <b>takes personal responsibility for chasing the result</b>. Fails on: the tonic or iron and reassurance about ageing, a routine rather than very urgent FBC, no film, or no safety-net."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every threshold on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — the very urgent 48-hour FBC for suspected leukaemia in adults and in children and young people, immediate referral for unexplained petechiae or hepatosplenomegaly in children, the lymphoma referral criteria with B symptoms and alcohol-induced node pain, and the myeloma test panel at 60 and over (FBC, calcium, ESR or plasma viscosity, electrophoresis and serum free light chains together — April 2025 update)</span></li>'+
         '<li><b>NICE NG35 — Myeloma: diagnosis and management</b><br><a href="https://www.nice.org.uk/guidance/ng35" rel="noopener">nice.org.uk/guidance/ng35</a><span class="rd"> — serum-free light chains alongside electrophoresis, no single test (electrophoresis, immunofixation, serum free light chains or urine electrophoresis) used alone to exclude myeloma, whole-body MRI first-line then whole-body low-dose CT, with skeletal survey only if both are unsuitable or declined, and the management of myeloma bone disease</span></li>'+
         '<li>NICE CG151 — Neutropenic sepsis: prevention and management in people with cancer<br><a href="https://www.nice.org.uk/guidance/cg151" rel="noopener">nice.org.uk/guidance/cg151</a><span class="rd"> — the definition of neutropenic sepsis (neutrophils ≤0.5 × 10⁹/L with temperature above 38°C or other signs of clinically significant sepsis), immediate empirical antibiotics for suspected neutropenic sepsis without delaying for the neutrophil count, oral/outpatient treatment only for low-risk patients after hospital assessment and validated risk scoring, and written and oral information with 24-hour oncology advice before and throughout treatment</span></li>'+
         '<li><b>NICE NG253 — Suspected sepsis</b><br><a href="https://www.nice.org.uk/guidance/ng253" rel="noopener">nice.org.uk/guidance/ng253</a><span class="rd"> — suspect neutropenic sepsis in anyone who becomes unwell while having, or within 30 days of, systemic anticancer treatment</span></li>'+
         '<li><b>NICE NG47 — Haematological cancers: improving outcomes</b><span class="rd"> — service organisation, the MDT, integrated diagnostic reporting through specialist integrated haematological malignancy diagnostic services, and the diagnostic pathways referred to here</span></li>'+
         '<li><b>NICE NG234 — Spinal metastases and metastatic spinal cord compression (2023)</b><span class="rd"> — MRI of the whole spine within 24 hours of suspected metastatic spinal cord compression, immobilisation when neurological signs suggest spinal instability (considered for severe movement-related pain), dexamethasone 16 mg for neurological symptoms or signs, and the emergency pathway used for the myeloma and lymphoma complication</span></li>'+
         '<li>National Cancer Diagnosis Audit / Cancer Research UK — routes to diagnosis<span class="rd"> — the repeated-consultation pattern before diagnosis in myeloma, and the proportion of haematological cancers diagnosed as emergencies</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Haematological cancers (leukaemia · lymphoma · myeloma) — NICE NG12 (updated April 2026), NG35, CG151, NG47 and NG234. Assemble the constellation rather than explaining each thread away; offer (children and young people) or consider (adults) a very urgent FBC within 48 hours where NG12 applies, with a blood film where clinically indicated or per local laboratory protocol; escalate blasts, a film suggesting acute leukaemia, severe or progressive cytopenias or a grossly abnormal count by telephone the same day; act on persistence, progression and combination rather than reassuring by default, without delaying urgent assessment for red flags; and suspect neutropenic sepsis in any patient who becomes acutely unwell on or within 30 days of systemic anticancer treatment — immediate hospital assessment and antibiotics immediately in hospital, without waiting for the neutrophil count. Verify all thresholds against NICE NG12 (updated April 2026) and CG151."
