<script>
MG.render({
  icon:"☀️",
  title:"Actinic keratosis — the complete guide",
  eyebrow:"Protocol · PCDS · NICE NG12 · product SPCs · examine the whole field, individualise treatment",
  stemTitle:"The clinical question is never \"is this an AK?\" but \"is any of this an SCC?\" — because a lesion in a field of AKs that raises clinical suspicion of SCC — for example tender, indurated, rapidly growing, ulcerated or bleeding — needs an urgent suspected-cancer referral, not a cream",
  stemSub:"One page for the whole condition. AKs are markers of cumulative UV damage and of <b>field change</b>, so the treatment decision is driven by <b>how many lesions, where they are, and how much they bother the patient</b> — not by the presence of an AK alone, since many can be observed (active surveillance) rather than treated. Examine the whole field and the rest of the skin, know the <b>features that raise suspicion of SCC</b>, choose between <b>cryotherapy, 5-fluorouracil, imiquimod, tirbanibulin and diclofenac gel</b> on lesion count, thickness, site, licensing and patient factors, and warn about the inflammatory reaction in advance, because it is the expected treatment effect and the usual reason a course is abandoned. Transplant and significantly immunosuppressed patients need a low threshold for specialist review. Ingenol mebutate (Picato) has been withdrawn and must not be prescribed.",
  guideline:"PCDS actinic keratosis guidance · NICE NG12 · MHRA SPCs (Efudix, Aldara, Solaraze, Klisyri) · MHRA Drug Safety Update (Picato) · local formulary",
  reviewed:"14 September 2026",
  nextReview:"14 March 2027",
  meta:[
    {t:"MHRA SPCs — Efudix, Aldara, Solaraze, Klisyri"},
    {t:"Primary Care Dermatology Society (PCDS) guidance"},
    {t:"Clinical suspicion of SCC → urgent NG12 referral", tone:"tw"},
    {t:"Transplant/immunosuppressed → low threshold for specialist review"},
    {t:"Ingenol mebutate (Picato) withdrawn — do not prescribe"},
    {t:"v1.1 · reviewed Sep 2026 · next review Mar 2027", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#safety"><b>Is it SCC?</b><small>The real question</small></a><a href="#diagnose"><b>Diagnose</b><small>Field change</small></a><a href="#choose"><b>Choose</b><small>Count · site</small></a><a href="#counsel"><b>Counsel</b><small>The reaction</small></a><a href="#refer"><b>Refer</b><small>NG12 · specialist</small></a></div>',
  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Features that raise suspicion of SCC", html:"Refer urgently through the suspected skin-cancer pathway when clinical examination raises suspicion of invasive SCC. Features that should lower the threshold include a painful or tender lesion, rapid growth, marked hyperkeratosis or induration, a palpable nodule, ulceration, spontaneous bleeding, a cutaneous horn, or failure to respond to appropriate AK treatment. These are red flags, not a rigid checklist — not every painful or bleeding lesion is SCC, and clinical judgement remains required. Do not delay a suspected-cancer referral for an empiric cream. <b>Palpate as well as look — SCC is often easier to feel than to see</b>, and a hyperkeratotic AK on the ear or lip is the classic one to get wrong."},
    {tone:"blue", h:"AK is a marker of field change and of overall skin-cancer risk", html:"Rough, scaly, erythematous macules or papules on chronically sun-exposed skin — scalp, face, ears, forearms, dorsal hands, lower legs — often more easily felt than seen, on a background of solar damage. So examine the whole field and the rest of the skin: patients with AKs have a raised risk of BCC, SCC and melanoma, and finding a second lesion matters more than perfecting the AK diagnosis."},
    {tone:"green", h:"Many AKs can be observed rather than treated", html:"The decision is driven by lesion number, site, symptoms and patient preference — mild, flat, asymptomatic, non-hyperkeratotic AKs can reasonably be observed after informed discussion — an active surveillance decision, not \"doing nothing\" — with emollients, sun protection, self-examination and clear safety-netting. <b>Individual lesions may regress spontaneously.</b> Overtreating asymptomatic field change in a frail patient is a real harm, because the treatments are uncomfortable."},
    {tone:"amber", h:"Choose by lesion count, thickness and site", html:"<b>One or a few discrete typical lesions → liquid-nitrogen cryotherapy.</b> Thin field disease, particularly face/scalp → a topical field treatment chosen by site, licence and patient factors: <span class='rx'>5-fluorouracil 5% cream</span> (Efudix: once or twice daily, usually for 3–4 weeks, maximum 500 cm² at one time), <span class='rx'>imiquimod 5% cream</span> (Aldara: face or scalp in immunocompetent adults, 3 nights a week for 4 weeks, reassess after a 4-week treatment-free interval, one further 4-week course if needed), <span class='rx'>tirbanibulin 1% ointment</span> (Klisyri: once daily for 5 days, face or scalp field up to 25 cm²) or <span class='rx'>diclofenac 3% gel</span> (Solaraze: twice daily for 60–90 days, maximum 8 g daily). 5-FU is generally one of the more effective primary-care field treatments and among the most inflammatory; diclofenac is better tolerated but less effective and needs a long course. Thick, hyperkeratotic or resistant disease → dermatology."},
    {tone:"amber", h:"⚠ Warn about the inflammatory reaction, or the course fails", html:"Redness, crusting, erosion and discomfort during treatment are the EXPECTED effect, not an adverse reaction — and peak inflammation is usually the point at which patients stop. Say this at the point of prescribing, give a timeframe, and offer emollient and simple analgesia. An unwarned patient who abandons 5-FU at day 10 has had a counselling failure, not a treatment failure. Treatment should not be stopped solely because expected inflammation occurs — but severe pain, extensive weeping, spreading erythema, systemic illness or possible infection needs review."},
    {tone:"purple", h:"🟣 NICE NG12 — suspected squamous cell carcinoma", html:"Consider an urgent suspected-cancer referral (for an appointment within 2 weeks) for people with a skin lesion that raises the suspicion of squamous cell carcinoma. Suspected melanoma or a pigmented lesion with a weighted 7-point checklist score of 3 or more, or any suspicion, goes on the same pathway. Basal cell carcinoma is usually a routine dermatology referral, but use the urgent route where delay could cause significant impact. Restated in <a href='#refer'>Refer</a>."}
  ],
  pathwaySub:"Five steps, and the first one is a question about cancer, not about AKs.",
  pathway:[
    {title:"Ask whether any lesion is an SCC", html:"Ask about pain, growth, bleeding, ulceration and duration; inspect and palpate every lesion, not only the one the patient points to. Clinical suspicion of SCC (e.g. tender, indurated, rapidly growing, ulcerated, bleeding, nodular or horned) → urgent suspected-cancer referral. <b>Examine the whole sun-exposed field and the rest of the skin; check regional nodes if SCC is suspected.</b>", alert:true},
    {title:"Confirm AK and assess the field", html:"Number and distribution, thin versus hypertrophic, field change, site (face, scalp, ear, lip, lower leg, hands), symptoms, immunosuppression or transplant status, previous skin cancer, ability to apply treatment, pregnancy/breastfeeding, and current medicines (NSAIDs, brivudine, immunosuppressants)."},
    {title:"Decide whether to treat at all", html:"Observation (active surveillance) is reasonable for mild, flat, asymptomatic AK after shared decision-making. Treat for symptoms or recurrent trauma, hyperkeratosis, multiple lesions/field change, patient concern or significant cumulative risk."},
    {title:"Choose the modality by count, thickness and site", html:"Cryotherapy for a few discrete typical lesions; 5-FU, imiquimod, tirbanibulin or diclofenac for thin field disease within each product's licensed site and regimen; dermatology for thick, extensive or resistant disease — and counsel on the reaction BEFORE the first application."},
    {title:"Review, and give lifelong sun protection and self-examination advice", html:"Review at the agent-specific interval (5-FU after the healing phase; imiquimod after the 4-week treatment-free interval; diclofenac about 30 days after completion; tirbanibulin about 8 weeks after starting) and re-examine the field. A persistent lesion is reassessed, not automatically re-treated."}
  ],
  sections:[

    {id:"safety", nav:"Is it SCC?", title:"Step 1 — the question that comes first",
     sub:"An AK diagnosis is only safe once SCC has been considered and excluded on the day.",
     blocks:[
       {b:"table", head:["Feature","Meaning","Action"], rows:[
         ["<b>Tenderness or pain in a scaly lesion</b>","<b>Lowers the threshold for suspecting SCC</b> — AKs are usually asymptomatic or mildly rough, but not every painful lesion is SCC","<b>Urgent suspected-cancer referral if SCC is clinically suspected</b>"],
         ["<b>Marked hyperkeratosis, induration or a palpable nodular/fleshy component</b>","<b>Suspicious of SCC</b> — palpable depth is the key discriminator","Urgent suspected-cancer referral if SCC is suspected. Gently soften or remove superficial scale where appropriate to assess induration, without traumatising a suspicious lesion. Palpate every field: SCC is often easier to FEEL than to see"],
         ["<b>Rapid growth, ulceration or spontaneous bleeding</b>","<b>Suspicious of SCC</b>","<b>Urgent suspected-cancer referral</b>"],
         ["<b>Cutaneous horn</b>","<b>SCC may lie at the base</b>","Urgent suspected-cancer referral if the base is suspicious; do not repeatedly freeze"],
         ["<b>A lesion that persists after an adequate, correctly applied course</b>","<b>Reassess: wrong diagnosis, poor adherence or application, inadequate treatment, hypertrophic AK, Bowen disease or SCC</b> — failure alone is not diagnostic of SCC","<b>Do not simply repeat topical treatment without reassessment</b>; refer or obtain specialist assessment/biopsy if it remains clinically suspicious"],
         ["<b>Pigmented, irregular or changing lesion</b>","<b>Possible melanoma</b>","Weighted 7-point checklist; score 3 or more, or any suspicion → suspected-melanoma pathway. See <a href='../algorithms/pigmented-skin-lesions.html'>pigmented skin lesions pathway</a>"],
         ["<b>Pearly, rolled-edged or telangiectatic papule</b>","<b>Possible basal cell carcinoma</b>","Usually routine dermatology; use the urgent route where delay could cause significant impact"],
         ["<b>Organ-transplant recipient or significantly immunosuppressed patient</b>","<b>Higher risk, faster progression, and multiple SCCs</b>","<b>Low threshold for specialist review.</b> Any new, changing, growing, painful, thickened, ulcerated or non-healing lesion → urgent referral if SCC is suspected (NICE highlights new or growing lesions in transplant recipients). Extensive, recurrent or diagnostically uncertain AK → discuss with dermatology even without definite SCC features"],
         ["<b>Ear, lip, temple, eyelid or periorbital site</b>","<b>Higher-risk sites for SCC</b>","<b>A lower threshold for referral than for the same lesion on the forearm.</b> Actinic cheilitis or a persistent keratotic lip lesion → low threshold for specialist assessment, especially if focal, indurated, painful, ulcerated or bleeding. Do not routinely use field creams on the vermilion or mucosal lip; check the product SPC before treating near the eyelids, nostrils or ears"]
       ]},
       {b:"warn", html:"The clinical question is never \"is this an AK?\" but \"is any of this an SCC?\" Treating a field of AKs is entirely reasonable — but the lesion within that field that raises clinical suspicion of SCC is the one that needs a referral, and it is easily lost among the others. Do not delay a suspected-cancer referral for an empiric cream, and do not biopsy in primary care if this would delay referral or the local pathway requires direct specialist assessment — follow the local dermatology/skin-cancer pathway."}
     ]},

    {id:"diagnose", nav:"Diagnose", title:"Step 2 — diagnosis, field assessment and risk",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>Appearance</b>","Rough, scaly, erythematous macules or papules — often better felt than seen; may be hyperkeratotic or, on the lip, present as actinic cheilitis"],
         ["<b>Sites</b>","Chronically sun-exposed skin: scalp (especially bald), face, ears, nose, forearms, dorsal hands, lower legs"],
         ["<b>Background</b>","Solar damage — telangiectasia, mottled pigmentation, atrophy. Fitzpatrick skin types I–II, outdoor work or heavy recreational sun exposure, older age, prior skin cancer"],
         ["<b>Field change</b>","Multiple AKs with surrounding erythema, telangiectasia and mottled solar damage indicate field cancerisation. Field treatment may reduce the visible lesion burden and treat subclinical disease, but treatment should be individualised according to lesion thickness, symptoms, risk, treatment burden, comorbidity and patient preference"],
         ["<b>Assess and record</b>","Site, size, morphology, symptoms, duration and palpation findings; number and distribution of lesions and area; thin versus hypertrophic; field change; functional or cosmetic impact; immunosuppression or transplant status; previous skin cancer; whether the patient can apply treatment accurately; pregnancy/breastfeeding; current medicines including NSAIDs, brivudine and immunosuppressants. Assess regional lymph nodes if SCC is suspected"],
         ["<b>Examine the rest of the skin</b>","AKs mark raised overall risk of BCC, SCC and melanoma — a full skin check is part of the consultation"],
         ["<b>Diagnosis is clinical</b>","Dermoscopy or biopsy is not routinely needed for a typical AK; use specialist assessment or histology where the diagnosis is uncertain or the lesion is hypertrophic, treatment-resistant or clinically suspicious"]
       ]},
       {b:"why", html:"AKs matter for two reasons, and the treatment decision follows from which one you are addressing. Individually they are a low-risk dysplastic lesion, and most will not progress — individual lesions may even regress. Collectively they are a marker: of field change in that area, and of the patient's cumulative UV exposure and therefore their lifetime skin-cancer risk. So the job is partly to treat troublesome lesions and partly to identify the patient who now needs lifelong sun protection, self-examination and a low threshold for review."}
     ]},

    {id:"choose", nav:"Choose", title:"Step 3 — deciding whether and how to treat",
     blocks:[
       {b:"info", html:"Treatment is guided by lesion number, thickness, site, symptoms and patient preference — not by the presence of an AK alone. Observation is reasonable for mild, flat, asymptomatic, non-hyperkeratotic AK, for frail or very elderly patients where treatment burden exceeds likely benefit, and for patients who prefer it after informed discussion. It is an active surveillance decision, not \"doing nothing\": emollient for dryness or scale, sun protection, self-examination and clear safety-netting — review if a lesion becomes painful, thickened, enlarges, bleeds, ulcerates or fails to settle. Treat when there are symptoms or recurrent trauma, hyperkeratosis, multiple lesions/field change, patient concern or cosmetic impact, or significant cumulative risk, with a plan agreed with the patient. Avoid treating a large field without defining its boundaries and explaining the likely inflammatory response."},
       {b:"table", head:["Situation","Option","Practical detail"], rows:[
         ["<b>One or a few discrete, clinically typical lesions</b>","<b>Liquid-nitrogen cryotherapy</b>","Freeze duration and number of freeze–thaw cycles adjusted for site, lesion thickness and local protocol. Counsel about pain, blistering and crusting; delayed healing and ulceration risk, particularly on the lower leg; hypo- or hyperpigmentation and occasional scarring. Less effective on thick hyperkeratotic lesions — a thick lesion, cutaneous horn or non-responding lesion needs histology/specialist assessment rather than repeated freezing"],
         ["<b>Few lesions, or where cryotherapy is unsuitable</b>","<b>A topical agent applied to the area</b>","Choose by licensed site and lesion type, tolerability and the patient's ability to apply it correctly"],
         ["<b>Thin field disease — usually the most effective practical option if tolerated and applied correctly</b>","<b><span class='rx'>5-fluorouracil 5% cream</span></b> (Efudix: thin layer once or twice daily, usually for 3–4 weeks according to site, response and the SPC, continued until an appropriate inflammatory response develops; maximum 500 cm² treated at one time; healing may take 1–2 months after stopping)","<b>Generally one of the more effective primary-care field treatments, but comparative efficacy varies by site, regimen, follow-up and adherence; also among the most inflammatory.</b> Expect brisk erythema, crusting and erosion; <b>protect surrounding skin and avoid the eyes and mucous membranes</b>. Contraindicated in pregnancy and breastfeeding, and with brivudine, sorivudine and analogues (allow at least 4 weeks after these drugs). Avoid ulcerated or severely inflamed skin and significant UV exposure. Systemic toxicity is unlikely but more plausible with large areas, damaged skin, occlusion or DPD deficiency. Advise not to smoke or go near naked flames — treated clothing, bedding and dressings may be a fire hazard"],
         ["<b>Thin AK on the face or scalp — immune-mediated alternative</b>","<b><span class='rx'>Imiquimod 5% cream</span></b> (Aldara: maximum one sachet, 3 nights a week for 4 weeks, left on for about 8 hours then washed off; assess clearance after a 4-week treatment-free interval; if lesions persist a further 4-week course may be considered; do not extend a course beyond 4 weeks for missed doses or rest periods)","Licensed for clinically typical, non-hyperkeratotic, non-hypertrophic AK on the face or scalp in immunocompetent adults — not for marked hyperkeratosis, cutaneous horns or routine treatment of hands/forearms, and not evaluated on the eyelids, inside the nostrils or ears, or the lip inside the vermilion border. Avoid broken or recently treated skin. Caution in autoimmune disease, immunosuppressive therapy and organ-transplant patients (possible graft rejection or graft-versus-host disease). Marked local inflammation and ulceration, flu-like symptoms, fatigue and lymphadenopathy can occur — consider interrupting treatment if inflammation is intense or infection develops. Pregnancy: only after careful risk–benefit assessment; breastfeeding: data uncertain. <b>Useful where 5-FU is not tolerated</b>"],
         ["<b>Thin field on the face or scalp — short course needed</b>","<b><span class='rx'>Tirbanibulin 1% ointment</span></b> (Klisyri 10 mg/g: once daily for 5 consecutive days to a field of up to 25 cm² on the face or scalp; one single-use sachet per application; do not occlude; assess response about 8 weeks after starting)","Licensed for non-hyperkeratotic, non-hypertrophic Olsen grade 1 AK of the face or scalp in adults. Not on open or broken skin, inside the nostrils or ears, on the lips or near the eyes. No clinical data support repeated cycles — if lesions recur, reconsider management rather than automatically repeating the course. Erythema, scaling, crusting and swelling are very common, typically peaking around day 8 and resolving within about 2–3 weeks after treatment. Not recommended in pregnancy; breastfeeding needs an individual risk–benefit decision"],
         ["<b>Thin field disease — lower-intensity reaction prioritised</b>","<b><span class='rx'>Diclofenac 3% gel</span></b> (Solaraze: twice daily; about 0.5 g per 5 × 5 cm area; maximum 8 g daily, treating up to 200 cm²; usually <b>60–90 days</b>, with maximal efficacy toward the longer end; improvement may continue for up to 30 days after stopping)","Generally better tolerated but less effective than 5-FU, imiquimod or some procedural treatments — a reasonable option for frail or reaction-averse patients after discussing the lower efficacy, prolonged course and adherence. Avoid wounds, infection, exfoliative dermatitis, airtight occlusion and direct sunlight/solarium. Contraindicated with hypersensitivity to aspirin or other NSAIDs (including NSAID-induced asthma, rhinitis or urticaria) and in the third trimester; avoid in the first and second trimesters unless clearly necessary. Caution with GI ulceration/bleeding, renal, hepatic or cardiac impairment, bleeding disorders, and extensive or prolonged application. Breastfeeding: seek clinical advice; do not apply to the breast or large areas"],
         ["<b>Thick, hyperkeratotic, extensive, recurrent or treatment-resistant disease</b>","<b>Dermatology</b>","<b>Specialist assessment; consider biopsy, curettage, photodynamic therapy or other specialist treatment</b>"],
         ["<b>Actinic cheilitis or suspicious lip lesion</b>","<b>Specialist assessment</b>","Low threshold for referral; field creams are not routinely used on the vermilion or mucosal lip"],
         ["<b>Selected field disease — specialist-supported</b>","<b><span class='rx'>Short-course 5-FU with calcipotriol</span></b> (off-label)","PCDS reports good evidence for SCC reduction in field treatment, with durations varying by site. Use only according to local dermatology protocol with defined prescribing and follow-up arrangements — not a routine standalone GP regimen"],
         ["<b>Ingenol mebutate (Picato)</b>","<b>Do not prescribe</b>","UK licence suspended and product withdrawn because of concerns about increased skin malignancy. Patients previously treated with it should remain vigilant for new lesions in the treatment area"],
         ["<b>All patients, regardless of treatment</b>","<b>Sun protection and skin surveillance</b>","Avoid sunburn and tanning beds; hat and protective clothing; seek shade, particularly around midday; broad-spectrum sunscreen applied properly and reapplied during prolonged exposure; emollients for symptomatic scaling; self-examination taught, with prompt reporting of new, changing, painful, bleeding, ulcerated or non-healing lesions"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"🧴 Sun protection is long-term prevention, not treatment", html:"Sunscreen does not treat established AK — it reduces further UV injury and may reduce new lesions, but does not replace assessment of suspicious or persistent lesions. It applies whether or not the current lesions are treated. Be specific: avoid sunburn and tanning beds; broad-spectrum sunscreen applied generously and reapplied during prolonged exposure, plus hat, protective clothing and shade around midday."},
         {tone:"amber", h:"⚠ Don't overtreat the frail", html:"<b>The field treatments are uncomfortable for weeks.</b> In a frail or very elderly patient with asymptomatic AKs, observation (active surveillance) plus sun protection and safety-netting is often the better plan, or diclofenac after discussing its lower efficacy and prolonged course — and should be framed as a positive decision, not a refusal."},
         {tone:"blue", h:"🖐️ Can they apply it?", html:"Field treatments need accurate self-application to a defined area for weeks. Check dexterity, vision and understanding, or the course will fail regardless of the agent chosen."},
         {tone:"amber", h:"🫆 Immunosuppressed and transplant patients", html:"Higher risk, faster progression and multiple SCCs — a different risk category. Low threshold for specialist review: urgent referral for any new, changing, growing, painful, thickened, ulcerated or non-healing lesion if SCC is suspected; discuss extensive, recurrent or diagnostically uncertain AK with dermatology. Use imiquimod with caution (possible graft rejection or graft-versus-host disease). Rigorous sun protection."}
       ]}
     ]},

    {id:"counsel", nav:"Counsel", title:"Step 4 — the conversation that determines whether treatment works",
     blocks:[
       {b:"warn", html:"Local inflammation — redness, crusting, erosion, discomfort — is the EXPECTED effect of field treatment, not an adverse reaction. <b>Peak inflammation is usually the point at which patients stop.</b> Warn explicitly before the first application, give an expected timeframe, and offer emollient and simple analgesia. Treatment should not be stopped solely because expected inflammation occurs; severe pain, extensive weeping, spreading erythema, systemic illness or possible infection requires review."},
       {b:"say", html:"These rough patches are sun damage, and the cream works by making the damaged skin react and then heal over. I want to be clear about what that looks like, because it puts people off: the area will get red, sore and crusty, and it usually looks its worst about halfway through. That is the treatment working, not a reaction to it. Keep going, use a simple moisturiser around it and paracetamol if it is sore, and it settles over the weeks after you finish. If it becomes very painful or weeps a lot, the redness spreads well beyond the area, you feel unwell, it looks infected, or you are worried, stop and come and see me rather than just abandoning it. And if any one spot turns into a lump, gets more tender, ulcerates, grows quickly or keeps bleeding, I need to see it urgently."},
       {b:"table", head:["What","When","Action"], rows:[
         ["<b>Response to treatment</b>","Treatment-specific: 5-FU after the course and healing phase (often several weeks after stopping); imiquimod after the 4-week treatment-free interval and skin regeneration; diclofenac about 30 days after completion, with clinical judgement; tirbanibulin about 8 weeks after starting","Assess clearance; if inadequate, reassess the diagnosis, adherence and lesion type before changing modality or giving a licensed further course — never re-treat automatically"],
         ["<b>Non-responding lesions</b>","<b>At review</b>","Reassess a lesion that persists after an adequate, correctly applied course — wrong diagnosis, inadequate treatment, hypertrophic AK, Bowen disease or SCC — rather than repeating the course; refer or obtain specialist assessment/biopsy if it remains clinically suspicious"],
         ["<b>The field and the whole skin</b>","<b>At review and opportunistically</b>","New or changing lesions; check the rest of the skin for BCC, SCC and melanoma"],
         ["<b>Sun protection and self-examination</b>","<b>Ongoing, lifelong</b>","Reinforce; it reduces further UV damage and may reduce new lesions, but does not replace review of suspicious or persistent lesions"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 Come back before finishing", html:"\"A patch that becomes lumpy, increasingly tender, ulcerated, rapidly enlarging or keeps bleeding needs checking urgently, whether or not you are using the cream.\""},
         {tone:"amber", h:"🟠 Severe reaction", html:"\"If the treated area becomes very painful or weeps a lot, the redness spreads well beyond the treated patch, you feel unwell, or it looks infected, contact us.\""},
         {tone:"blue", h:"💊 Expected course", html:"\"Worst around the middle, settling in the weeks after you stop. That is the treatment working — don't stop just because it is red and sore.\""},
         {tone:"green", h:"☀️ For life", html:"\"Sunscreen, hat and sleeves from now on — it helps prevent new patches and further sun damage, but it doesn't treat the ones you have. And check your own skin, telling us about anything new, changing, painful, bleeding, ulcerated or not healing.\""}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral",
     blocks:[
       {b:"cards", items:[
         {tone:"purple", h:"Suspected cancer · NICE NG12 — suspected SCC or melanoma", html:"Consider an urgent suspected-cancer referral (appointment within 2 weeks) for a skin lesion raising suspicion of squamous cell carcinoma — features that lower the threshold include a painful or tender lesion, rapid growth, marked hyperkeratosis or induration, a palpable nodule, ulceration, spontaneous bleeding, a cutaneous horn, a suspicious lesion on the ear, lip, temple or eyelid, or failure to respond to appropriate AK treatment; NICE also highlights new or growing lesions in organ-transplant recipients. These are red flags requiring clinical judgement, not an automatic checklist. Do not delay referral for an empiric cream. Suspected melanoma, or a pigmented lesion scoring 3 or more on the weighted 7-point checklist, goes on the suspected-melanoma pathway."},
         {tone:"amber", h:"Dermatology — urgent-ish", html:"Diagnostic uncertainty · extensive, recurrent or hyperkeratotic disease · AK persisting after an adequate course · actinic cheilitis or a persistent keratotic lip lesion · extensive, recurrent or diagnostically uncertain AK in a transplant recipient or significantly immunosuppressed patient (low threshold for specialist review)."},
         {tone:"blue", h:"Dermatology — routine", html:"For photodynamic therapy, curettage, biopsy or specialist field treatment (including short-course 5-FU with calcipotriol under local protocol); suspected basal cell carcinoma (urgent route where delay would cause significant impact)."},
         {tone:"cream", h:"GP management", html:"Clinical diagnosis, the SCC question, field assessment, the decision whether to treat, cryotherapy or a topical field agent with proper counselling, the response review, and lifelong sun protection and self-examination all belong here. Follow the local dermatology/skin-cancer pathway, and confirm formulary status and preferred brands in the local formulary (e.g. <a href='https://www.greatermanchesterformulary.nhs.uk' rel='noopener'>GMMMG formulary — skin</a>). Related pages: <a href='../algorithms/pigmented-skin-lesions.html'>pigmented skin lesions pathway</a> · <a href='eczema.html'>eczema</a> · <a href='psoriasis.html'>psoriasis</a> · <a href='rosacea.html'>rosacea</a> · <a href='seborrhoeic-dermatitis.html'>seborrhoeic dermatitis</a>."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 74-year-old retired roofer attends about \"scaly patches\" on his bald scalp and forearms, present for two years. There are numerous rough erythematous macules across the scalp with background telangiectasia and mottled pigmentation. He mentions that one patch behind his right ear has become sore and is catching on his glasses, and that it <b>bled a little when he knocked it</b>. He wants \"the strongest cream to get rid of them all\" and says he has \"never bothered with sunscreen\"."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Does not treat this as a single AK-management consultation — identifies that the tender, bleeding lesion behind the ear is suspicious of SCC and arranges an urgent suspected-cancer referral, which is the highest-value action and is easily lost among the field; <b>palpates rather than only inspecting</b>, knowing SCC is often easier to feel; <b>recognises the ear as a higher-risk site</b>; <b>examines the whole skin for BCC, SCC and melanoma</b>, since AKs mark raised overall risk; assesses the field properly — count, distribution, hyperkeratosis, symptoms — and chooses a field treatment rather than lesion-by-lesion cryotherapy for extensive scalp disease; counsels explicitly on the inflammatory reaction, its peak and its timeframe before prescribing 5-FU, offering emollient and analgesia, because an unwarned patient abandons the course; checks 5-FU contraindications and interactions (brivudine) and warns about the fire risk of treated clothing and bedding for a smoker; <b>does not promise clearance of everything</b>; gives specific lifelong sun protection advice relevant to an outdoor worker and teaches self-examination; and safety-nets any lesion that becomes tender, lumpy, ulcerated or non-healing."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
                  '<li><b>Primary Care Dermatology Society (PCDS) — Actinic keratosis (syn. solar keratosis)</b><br><a href="https://www.pcds.org.uk/clinical-guidance/actinic-keratosis-syn.-solar-keratosis" rel="noopener">pcds.org.uk/clinical-guidance</a><span class="rd"> — clinical diagnosis, observation of mild asymptomatic AK, treatment guided by lesion number, thickness, site and symptoms, the field-change concept and field-directed treatment, short-course 5-FU with calcipotriol, practical selection between 5-fluorouracil, imiquimod, diclofenac gel and cryotherapy by lesion count and tolerability, actinic cheilitis, and the higher-risk sites and patient groups</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (recommendations organised by site of cancer — skin)</b><br><a href="https://www.nice.org.uk/guidance/ng12/chapter/Recommendations-organised-by-site-of-cancer" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — consider an urgent suspected-cancer referral (for an appointment within 2 weeks) for a skin lesion raising suspicion of squamous cell carcinoma; the suspected-melanoma pathway and the weighted 7-point checklist score of 3 or more; and basal cell carcinoma as a routine referral unless delay would cause significant impact; the NG12 evidence review (appendix J4) highlighting new or growing lesions in organ-transplant recipients</span></li>'+
         '<li><b>Efudix 5% cream (fluorouracil) — SPC, PL 46302/0128</b><br><a href="https://products.mhra.gov.uk" rel="noopener">products.mhra.gov.uk</a><span class="rd"> — once- or twice-daily application, usual initial course 3–4 weeks, maximum 500 cm² at one time, healing over 1–2 months, contraindications (pregnancy, breastfeeding, brivudine/sorivudine), DPD deficiency, UV avoidance and the fire hazard</span></li>'+
         '<li><b>Aldara 5% cream (imiquimod) — SPC, PLGB 46302/0206</b><br><a href="https://products.mhra.gov.uk" rel="noopener">products.mhra.gov.uk</a><span class="rd"> — licensed AK indication (face or scalp, immunocompetent adults), 3 nights a week for 4 weeks with reassessment after a 4-week treatment-free interval, maximum one sachet, sites not evaluated, and cautions including autoimmune disease and transplant patients</span></li>'+
         '<li><b>Solaraze 3% gel (diclofenac sodium) — SPC, PL 16973/0012</b><br><a href="https://products.mhra.gov.uk" rel="noopener">products.mhra.gov.uk</a><span class="rd"> — twice-daily application, 0.5 g per 5 × 5 cm, maximum 8 g daily (200 cm²), 60–90 days, improvement up to 30 days after stopping, NSAID hypersensitivity, pregnancy and other cautions</span></li>'+
         '<li><b>Klisyri 10 mg/g ointment (tirbanibulin) — SPC, PLGB 16973/0043</b><br><a href="https://products.mhra.gov.uk" rel="noopener">products.mhra.gov.uk</a><span class="rd"> — once daily for 5 days to up to 25 cm² of face or scalp, Olsen grade 1 non-hyperkeratotic AK in adults, site exclusions, local reactions peaking around day 8, no data on repeated cycles, assessment at about 8 weeks</span></li>'+
         '<li><b>MHRA Drug Safety Update — Ingenol mebutate gel (Picato): suspension of the licence due to risk of skin malignancy</b><br><a href="https://www.gov.uk/drug-safety-update" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> — licence suspended and product withdrawn; do not prescribe; previously treated patients to stay vigilant for new lesions</span></li>'+
         '<li><b>Greater Manchester Medicines Management Group (GMMMG) formulary — skin</b><br><a href="https://www.greatermanchesterformulary.nhs.uk" rel="noopener">greatermanchesterformulary.nhs.uk</a><span class="rd"> — confirm local formulary status, preferred brands and local dermatology referral arrangements. Regimens vary by product — confirm the specific course against the current SPC before prescribing</span></li>'+
         '<li><b>Document control</b><span class="rd"> — version 1.1; owner: Reasoning GP; reviewed 14 September 2026; planned review 14 March 2027; local pathway: the local dermatology/skin-cancer pathway</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Actinic keratosis — PCDS, NICE NG12, MHRA product SPCs (Efudix, Aldara, Solaraze, Klisyri) and the local formulary. The first question is never \"is this an AK?\" but \"is any of this an SCC?\" — a lesion that raises clinical suspicion of SCC (for example tender, indurated, rapidly growing, ulcerated, bleeding, horned, or persisting despite adequate treatment) goes on the urgent suspected-cancer pathway, and palpation finds it better than inspection. AKs mark field change and raised overall skin-cancer risk, so examine the whole skin. Many can be observed (active surveillance): decide on lesion count, thickness, site, symptoms and preference. Cryotherapy for a few discrete typical lesions; 5-fluorouracil, imiquimod, tirbanibulin or diclofenac gel for thin field disease, each within its licensed site and regimen, chosen on efficacy versus tolerability. Never prescribe ingenol mebutate (Picato). Warn about the inflammatory reaction before the first application — it is the expected effect and the usual reason a course is abandoned. Transplant and significantly immunosuppressed patients need a low threshold for specialist review. Confirm regimens against the SPC and local formulary before prescribing."
});
