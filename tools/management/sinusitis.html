<script>
MG.render({
  icon:"\u{1F443}",
  title:"Sinusitis (Rhinosinusitis)",
  eyebrow:"Protocol · diagnose &amp; manage in one place",
  stemTitle:"Acute sinusitis — time is the treatment; spot the orbit, the brain and the chronic nose",
  stemSub:"One page for acute sinusitis in adults and children, plus recognising chronic rhinosinusitis (CRS) and nasal polyps. Acute sinusitis is usually self-limiting; symptoms usually last 2–3 weeks. Record the duration and course, examine for orbital, intracranial and systemic complications, and avoid antibiotics during the first 10 days in otherwise well patients. The 10-day rule guides prescribing — it does not prove bacterial infection. The skill is in spotting the few who need an antibiotic or a hospital, and in noticing when “sinusitis” is really chronic, persistently unilateral, dental or something else.",
  guideline:"NICE NG79 (2017) · EPOS 2020 (international) · NICE NG12 (updated April 2026) · NICE TA1134 (2026)",
  meta:[
    {t:"NICE NG79 · Sinusitis (acute): antimicrobial prescribing (2017)"},
    {t:"EPOS 2020 (international) · chronic rhinosinusitis &amp; nasal polyps"},
    {t:"NICE NG12 · suspected cancer (updated April 2026)", tone:"tw"},
    {t:"NICE TA1134 · dupilumab CRSwNP (2026)"},
    {t:"Verify doses: BNF / BNFC and local GMMMG antimicrobial formulary"}
  ],
  lead:'<div class="mg-layers"><a href="#diagnose"><b>Diagnosis</b><small>Acute vs chronic, the 10-day rule</small></a><a href="#redflags"><b>Red flags</b><small>Orbit, brain, sepsis → hospital</small></a><a href="#ladder"><b>Treat</b><small>Self-care → steroid → antibiotic</small></a><a href="#chronic"><b>Chronic &amp; polyps</b><small>EPOS 2020</small></a><a href="#refer"><b>Refer</b><small>Hospital · urgent ENT · routine</small></a></div>',
  glance:[
    {lbl:"Usual cause", val:"Viral", sub:"lasts ~2–3 weeks (NG79)"},
    {lbl:"Around 10 days or less", val:"No antibiotic", sub:"self-care, if otherwise well (NG79)"},
    {lbl:"Around 10 days+, not improving", val:"No / back-up antibiotic", sub:"± high-dose nasal steroid 14 days, ≥12 y"},
    {lbl:"Immediate antibiotic", val:"Only if very unwell / high risk", sub:"NG79"},
    {lbl:"Chronic (suspect)", val:"≥12 weeks", sub:"EPOS 2020 · confirm by endoscopy/CT"},
    {lbl:"Red flag", val:"Orbital / intracranial", sub:"= immediate hospital assessment"}
  ],
  quickSub:"If you read nothing else on this page, read these cards. Doses are those printed in NICE NG79; check the current BNF/BNFC and the local Greater Manchester (GMMMG) antimicrobial formulary before prescribing — local first choices may differ (e.g. amoxicillin vs phenoxymethylpenicillin).",
  quick:[
    {tone:"red", h:"⚠ Orbit, brain or sepsis → immediate hospital assessment", html:"<b>Periorbital oedema/cellulitis, a displaced eyeball, double vision, ophthalmoplegia or newly reduced visual acuity</b>; <b>swelling over the frontal bone, severe frontal headache, signs of meningitis or focal neurology</b>; or a <b>severe systemic infection</b>. Arrange immediate hospital transfer (NICE NG79). Use 999 for reduced consciousness, seizures, severe sepsis, rapidly progressive neurological or visual compromise, or when the patient cannot be transferred safely. Do not prescribe and review."},
    {tone:"amber", h:"The 10-day rule", html:"Symptoms <b>for about 10 days or less</b> → <b>no antibiotic</b>, self-care. Symptoms <b>for around 10 days or more with no improvement</b> → <b>no antibiotic or a back-up antibiotic</b>, and consider a <b>high-dose nasal corticosteroid for 14 days</b> (age ≥12, off-label). This is a prescribing framework, not a bacterial diagnostic test: bacterial disease is somewhat more likely after around 10 days, but even bacterial acute sinusitis is usually self-limiting and antibiotics make little difference for most people. (NICE NG79)"},
    {tone:"blue", h:"Immediate antibiotic is the exception", html:"Only if <b>systemically very unwell</b>, <b>symptoms and signs of a more serious illness</b>, or <b>high risk of complications</b> because of pre-existing comorbidity. Adult first choice: <b>phenoxymethylpenicillin 500 mg four times a day for 5 days</b>; if very unwell/high risk: <b>co-amoxiclav 500/125 mg three times a day for 5 days</b>. (NICE NG79)"},
    {tone:"blue", h:"Twelve weeks changes the diagnosis", html:"Symptoms <b>≥12 weeks</b> with nasal blockage or discharge ± facial pain/pressure ± reduced smell → <b>suspect chronic rhinosinusitis</b> (EPOS 2020, international); confirmation generally requires objective evidence of sinonasal inflammation by endoscopy or CT, usually through ENT. Different disease, different treatment: <b>saline rinses + intranasal steroid</b> with technique teaching, not repeated antibiotics."},
    {tone:"amber", h:"Persistent one-sided symptoms need ENT, not repeated treatment", html:"<b>Persistent, recurrent or unexplained unilateral</b> nasal obstruction or discharge — especially with <b>bleeding</b>, <b>crusting</b>, facial swelling, <b>cacosmia</b>, a mass or dental symptoms — requires <b>urgent ENT assessment</b> rather than repeated empiric treatment. Causes include dental infection, unilateral bacterial sinusitis, anatomical obstruction, foreign body (in children), fungal disease, vasculitis, benign polyp and sinonasal malignancy. An acute unilateral episode with a clear viral or dental explanation does not automatically require urgent cancer referral."}
  ],
  pathwaySub:"The consultation in six moves. The red step is where harm happens — do it before you talk about antibiotics.",
  pathway:[
    {title:"Confirm it is rhinosinusitis", html:"Nasal blockage/congestion or discharge (anterior or post-nasal) plus facial pain/pressure and/or reduced smell. Clinical diagnosis — <b>no swabs, no X-ray, no CT</b> in uncomplicated acute disease. Note the duration in days."},
    {title:"Screen for danger", html:"Look at the eyes (swelling, redness, position, movements, acuity), the forehead, the neck and the neurology, and take observations. Any orbital, intracranial or severe systemic feature → <b>immediate hospital assessment</b>; 999 if reduced consciousness, seizure, severe sepsis, rapidly progressive compromise or unsafe to transfer (NICE NG79).", alert:true},
    {title:"Apply the 10-day rule", html:"Around 10 days or less → no antibiotic in an otherwise well patient. Around 10 days or more without improvement → no antibiotic or back-up antibiotic ± high-dose nasal steroid 14 days (≥12 y). Very unwell / features of a more serious illness / high risk → immediate antibiotic (NICE NG79)."},
    {title:"Self-care and expectations", html:"Paracetamol or ibuprofen for pain or fever; lasts about 2–3 weeks; antibiotics make little difference to most people and cause side effects (diarrhoea, nausea) and resistance."},
    {title:"Safety-net", html:"Return if symptoms worsen rapidly or significantly, do not improve after 3 weeks, or any eye/head red flag develops. If a back-up script is given, explain exactly when to use it."},
    {title:"Look beyond the acute episode", html:"Recurrent or ≥12-week symptoms → think CRS ± polyps, allergic rhinitis, asthma, smoking, dental source; persistent or unexplained one-sided, bloody or crusting → urgent ENT; upper molar/dental source → dentist."}
  ],
  sections:[

    {id:"diagnose", nav:"Diagnose", title:"Confirming the diagnosis", sub:"Rhinosinusitis is a clinical diagnosis made from history and a focused examination. Duration drives almost every decision.",
     blocks:[
       {b:"table", head:["Category","Definition / features","What it means for you"], rows:[
         ["<b>Acute sinusitis</b>","Symptoms for <b>&lt;12 weeks</b>: nasal blockage/congestion or discharge, facial pain/pressure, reduced smell; in children often cough (NG79 describes nasal blockage, discharge, dental/facial pain and reduced sense of smell)","Usually follows a viral URTI. Most resolve in about <b>2–3 weeks</b> without antibiotics (NICE NG79)"],
         ["<b>Around 10 days or less</b>","Usually viral; the 10-day threshold is a prescribing framework, not a bacterial diagnostic test","<b>Do not offer antibiotics</b> in an otherwise well patient; self-care (NICE NG79)"],
         ["<b>Around 10 days or more, no improvement</b>","Bacterial disease is somewhat more likely, but the distinction is imperfect and antibiotics still make little difference for most people","Consider no antibiotic or a back-up prescription; consider a high-dose intranasal corticosteroid in adults and children aged 12 years or over (NICE NG79)"],
         ["<b>Chronic rhinosinusitis</b>","Suspect CRS when symptoms persist for <b>at least 12 weeks</b>, with at least two symptoms including nasal obstruction or discharge, with or without facial pain/pressure or reduced smell (EPOS 2020). Confirmation generally requires objective evidence of sinonasal inflammation by endoscopy or CT, usually through ENT assessment. Facial pressure or “sinus headache” alone is frequently migraine or another primary headache disorder","Saline + intranasal steroid; look for polyps; refer if failing — see <a href='#chronic'>Chronic &amp; polyps</a>"],
         ["<b>Recurrent acute</b>","Discrete episodes with complete or near-complete resolution between episodes. Symptoms that never fully resolve are more consistent with CRS or an alternative diagnosis — do not call them “recurrent”","Review allergic rhinitis, smoking, dental disease, anatomy, asthma, medication use and possible immune deficiency, with ENT referral where clinically indicated"]
       ]},
       {b:"dl", rows:[
         ["History","Duration in days; course (improving, static, “double-sickening” after early improvement); unilateral or bilateral; colour of discharge and any blood; smell; dental pain; fever; eye or visual symptoms; headache character; previous episodes; allergy, asthma, aspirin sensitivity, smoking"],
         ["Examination","Temperature, pulse, RR, BP (sepsis screen); facial tenderness; <b>eyes — lids, globe position, movements, acuity</b>; anterior rhinoscopy with an otoscope (polyps, pus, septum, crusting, mass); teeth (upper molar/premolar source); neck stiffness and neurology if headache is severe"],
         ["Investigations","<b>None routinely</b> in acute sinusitis. Plain sinus X-ray has no role. CT sinuses is a specialist investigation (complications, CRS before surgery, suspected tumour). Consider bloods only if systemically unwell or immunocompromised"],
         ["Differentials","Viral URTI/common cold; allergic or non-allergic rhinitis; dental abscess or odontogenic sinusitis; anatomical obstruction; benign polyp; fungal disease; migraine or tension-type headache (“sinus headache” is usually migraine); temporal arteritis in older adults; trigeminal neuralgia; nasal foreign body (child, unilateral foul discharge); sinonasal tumour; granulomatosis with polyangiitis"]
       ]},
       {b:"why", html:"Most people who say “sinus” have a viral cold or a primary headache. The duration question does more work than any sign: NICE NG79 hinges both the antibiotic decision and the nasal-steroid option on whether symptoms have lasted around 10 days, and EPOS 2020 treats symptoms past 12 weeks as suspected chronic disease (confirmed objectively) with a different management plan."}
     ]},

    {id:"redflags", nav:"Red flags", title:"Red flags — immediate hospital vs urgent ENT", sub:"Rare but sight- and life-threatening. Verbalise these before any reassurance. Orbital, intracranial and severe systemic features need immediate hospital assessment; persistent unilateral alarm features need urgent ENT assessment.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"Intraorbital / periorbital complications", html:"<b>Periorbital oedema or cellulitis</b>, a <b>displaced eyeball</b>, <b>double vision</b>, <b>ophthalmoplegia</b>, or <b>newly reduced visual acuity</b> → immediate hospital transfer; 999 if rapidly progressive visual compromise or the patient cannot be transferred safely. Orbital cellulitis can threaten sight within hours; children with ethmoid sinusitis are a classic group.", src:"NICE NG79"},
         {tone:"red", h:"Intracranial complications", html:"<b>Swelling over the frontal bone</b> (Pott’s puffy tumour), <b>symptoms or signs of meningitis</b>, <b>severe frontal headache</b>, or <b>focal neurological signs</b> → immediate hospital transfer (999 if reduced consciousness, seizures, rapidly progressive neurological compromise or unsafe to transfer).", src:"NICE NG79"},
         {tone:"red", h:"Severe systemic infection", html:"Acute sinusitis with signs of a <b>severe systemic infection</b> → immediate hospital transfer; 999 for severe sepsis. Use your local sepsis tools (NEWS2 in adults) to judge severity.", src:"NICE NG79"},
         {tone:"amber", h:"ENT alarm features → urgent ENT (not automatically hospital)", html:"<b>Persistent unilateral obstruction or discharge</b>, <b>unilateral bloodstained discharge or epistaxis</b>, <b>unilateral crusting</b>, <b>cacosmia</b>, <b>unilateral polyp or mass</b>, persistent facial swelling, or unexplained recurrent unilateral disease → <b>urgent ENT assessment</b>. These are not automatically 999 or same-day hospital presentations unless accompanied by orbital, neurological or systemic red flags.", src:"EPOS 2020 (international; Fokkens et al.)"},
         {tone:"red", h:"Invasive fungal rhinosinusitis", html:"In <b>severe immunosuppression, neutropenia, uncontrolled diabetes or ketoacidosis</b>, facial pain/numbness, <b>black eschar</b>, ophthalmoplegia, visual symptoms or rapid progression require <b>emergency hospital assessment</b>. Do not manage with routine oral antibiotics or steroids in primary care."}
       ]},
       {b:"warn", html:"<b>Do not issue a back-up antibiotic to someone with an eye or neurological red flag.</b> Oral antibiotics in primary care do not treat orbital or intracranial complications; these need hospital assessment, IV antibiotics and often imaging and surgery."},
       {b:"why", html:"The paranasal sinuses sit next to the orbit (thin lamina papyracea) and the anterior cranial fossa, and venous drainage is valveless. Spread gives orbital cellulitis/abscess, cavernous sinus thrombosis, meningitis, subdural empyema and brain abscess. The examiner wants to hear you check the eyes and ask about headache and neck stiffness in every “sinus” consultation."}
     ]},

    {id:"atrisk", nav:"Who is at risk", title:"Who needs a lower threshold", sub:"NICE NG79 ties the immediate-antibiotic decision to how unwell the person is and their risk of complications.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Immediate antibiotic triggers", html:"<b>Systemically very unwell</b>; <b>symptoms and signs of a more serious illness or condition</b>; or <b>high risk of complications</b> because of pre-existing comorbidity → offer an immediate antibiotic (or refer if red flags).", src:"NICE NG79"},
         {tone:"blue", h:"High-risk comorbidity — clinical judgement", html:"NG79 does not provide a fixed list of high-risk comorbidities. In patients with significant immunosuppression, uncontrolled diabetes, cystic fibrosis or major cardiorespiratory, renal or hepatic disease, use a <b>lower threshold for face-to-face assessment, immediate antibiotics, investigation or hospital referral</b>. Immunosuppression does not automatically mean antibiotics are required; severe immunosuppression may justify urgent assessment, imaging or admission rather than simply an oral prescription. Document the clinical reasoning."},
         {tone:"blue", h:"Predisposing factors to ask about", html:"Allergic rhinitis, asthma, smoking, dental infection of upper teeth, nasal polyps, previous sinus surgery. These do not change the NG79 antibiotic rule but shape advice and follow-up.", src:"EPOS 2020 (international; Fokkens et al.)"},
         {tone:"blue", h:"Children", html:"The same 10-day framework applies. Nasal corticosteroid option is for <b>age ≥12</b>; doxycycline is contraindicated under 12. Unilateral foul-smelling nasal discharge in a young child should prompt assessment for a nasal foreign body.", src:"NICE NG79"}
       ]}
     ]},

    {id:"ladder", nav:"Treat", title:"Primary-care management of acute sinusitis", sub:"Every step below is from NICE NG79 (2017). Paediatric doses: see the NG79 table / BNFC.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Step 1", title:"Self-care, no antibiotic", when:"symptoms around 10 days or less (and most people beyond)", tone:"green",
          html:"<b>Paracetamol or ibuprofen</b> for pain or fever. Explain the natural history: usually viral, <b>lasts about 2–3 weeks</b>, most get better without antibiotics. Some people find <b>nasal saline</b> or a short course of a <b>topical nasal decongestant</b>, but NG79 found <b>not enough evidence to recommend</b> these. Safety-net clearly."},
         {step:"Step 2", title:"High-dose nasal corticosteroid for 14 days", when:"around 10 days+ and not improving, age ≥12",
          fromLabel:"if symptoms around 10 days or more without improvement",
          html:"<b>Consider</b> a high-dose nasal corticosteroid <b>for 14 days</b> for adults and children aged 12 and over. This is <b>off-label</b> — obtain and document informed consent. It may improve symptoms but is unlikely to affect how long they last, could cause systemic effects (particularly if already taking another corticosteroid), and may be difficult to use correctly. High-dose regimens used in the studies reviewed for NICE NG79 (2017): <b>mometasone 200 micrograms twice a day</b> or <b>fluticasone 110 micrograms twice a day</b>. <b>These are high-dose, short-course regimens for prolonged acute sinusitis and are not the standard allergic-rhinitis dose.</b> Check the product strength, number of sprays and current local formulary. Consider cumulative corticosteroid exposure, particularly in children and patients using inhaled or systemic corticosteroids. NICE notes the benefit is modest and may not be clinically important."},
         {step:"Step 3", title:"No antibiotic, or a back-up antibiotic", when:"around 10 days+ and not improving",
          fromLabel:"shared decision",
          html:"Offer <b>no antibiotic or a back-up antibiotic prescription</b> (patient-led or delayed collection). Explain that a back-up script is to be used only if symptoms <b>do not improve within 7 days</b> or <b>worsen rapidly or significantly</b> at any time, and to seek help if they become very unwell. NG79 found back-up or no antibiotic about as effective as immediate antibiotics for most people."},
         {step:"Step 4", title:"Immediate antibiotic", when:"systemically very unwell / serious illness / high risk", tone:"amber",
          fromLabel:"the minority",
          html:"Adults (≥18 y), NG79 table: <b>first choice phenoxymethylpenicillin 500 mg four times a day for 5 days</b>. Penicillin allergy or intolerance: <b>doxycycline 200 mg on day 1 then 100 mg once a day for 4 days</b> (5 days total; not in pregnancy or under 12), or <b>clarithromycin 500 mg twice a day for 5 days</b>, or in pregnancy <b>erythromycin 250–500 mg four times a day or 500–1000 mg twice a day for 5 days</b>. If <b>systemically very unwell, signs of a more serious illness, or at high risk of complications</b>: <b>co-amoxiclav 500/125 mg three times a day for 5 days</b>."},
         {step:"Step 5", title:"Second choice if worsening", when:"worse after ≥2–3 days on first choice", tone:"red", warn:true,
          fromLabel:"re-assess first — is this a complication?",
          html:"Worsening after 2–3 days of an antibiotic requires <b>clinical reassessment, not automatic escalation</b>. Re-examine for orbital, intracranial or systemic complications, alternative diagnoses, dental infection and adherence. If none, NG79 second choice is <b>co-amoxiclav 500/125 mg three times a day for 5 days</b>. If co-amoxiclav was used first, or there is penicillin allergy, <b>seek local microbiology advice</b>. Any orbital, intracranial or severe systemic feature → hospital."}
       ]},
       {b:"table", head:["Situation","NG79 choice (adult ≥18 y)","Notes"], rows:[
         ["First choice","Phenoxymethylpenicillin 500 mg QDS, 5 days","Narrow spectrum; take on an empty stomach. Check the local GMMMG antimicrobial formulary (local first choice may differ)"],
         ["Penicillin allergy / intolerance","Doxycycline 200 mg day 1, then 100 mg OD for 4 days; <b>or</b> clarithromycin 500 mg BD, 5 days","Check interactions for clarithromycin (statins, DOACs, QT-prolonging drugs) — per BNF"],
         ["Pregnancy + penicillin allergy","Erythromycin 250–500 mg QDS or 500–1000 mg BD, 5 days","Doxycycline contraindicated in pregnancy"],
         ["Very unwell / serious illness / high risk","Co-amoxiclav 500/125 mg TDS, 5 days","Consider whether hospital is more appropriate"],
         ["Worsening on first choice after ≥2–3 days","Co-amoxiclav 500/125 mg TDS, 5 days","Reassess first (complications, alternative diagnosis, dental source, adherence). If co-amoxiclav already used or penicillin-allergic → microbiology advice"],
         ["Children","See NG79 table / BNFC for weight- or age-banded doses","Doxycycline contraindicated under 12"]
       ]},
       {b:"warn", html:"If used, topical decongestants (e.g. xylometazoline) should generally be limited to a few days and no longer than the product licence/local formulary allows (the Greater Manchester formulary describes short-term use, commonly up to 7 days — check the specific product), because prolonged use may cause rhinitis medicamentosa. Check the product licence and BNF for age limits."},
       {b:"why", html:"NG79 found antibiotics make only a small difference to how long symptoms last and that the benefit is outweighed by side effects for most people, with an antimicrobial-resistance cost. The nasal steroid option exists because it gives some symptom benefit for the prolonged group without that cost — but it is off-label, so consent must be recorded."}
     ]},

    {id:"selfcare", nav:"Self-care", title:"Self-care advice supported by NICE NG79", sub:"What to tell the patient, and what to steer them away from.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"Pain and fever", html:"<b>Paracetamol or ibuprofen</b> at the correct dose for age. Check NSAID cautions (asthma with NSAID sensitivity, renal disease, GI bleeding, anticoagulants).", src:"NICE NG79"},
         {tone:"green", h:"Nasal saline and decongestants", html:"Some people may wish to try nasal saline or a nasal decongestant, but there is not enough evidence to recommend these. Decongestants: a few days only, no longer than the product licence/local formulary allows.", src:"NICE NG79"},
         {tone:"green", h:"Natural course", html:"Acute sinusitis is usually viral and lasts about <b>2–3 weeks</b>; most people get better without antibiotics. Setting this expectation reduces re-attendance.", src:"NICE NG79"},
         {tone:"green", h:"Antibiotic stewardship message", html:"Explain that antibiotics make little difference for most people, can cause diarrhoea and nausea, and increase resistance — and that this is about benefit to them, not rationing.", src:"NICE NG79"},
         {tone:"green", h:"Smoking and triggers", html:"Stopping smoking and managing allergic rhinitis may reduce nasal mucosal irritation; offer stop-smoking support."},
         {tone:"blue", h:"Pharmacy First (England)", html:"Community pharmacists can manage uncomplicated acute sinusitis in people aged 12+ under the NHS England Pharmacy First service using NG79-based criteria — check local arrangements.", src:"NHS England Pharmacy First 2024 · NICE NG79"}
       ]}
     ]},

    {id:"chronic", nav:"Chronic &amp; polyps", title:"Chronic rhinosinusitis and nasal polyps", sub:"Recognition in primary care, first-line treatment and when to refer. NG79 covers acute sinusitis only; CRS management here follows EPOS 2020.",
     blocks:[
       {b:"kv", rows:[
         ["Definition","Suspect CRS with <b>≥12 weeks</b> of ≥2 symptoms, one being nasal blockage/obstruction/congestion or nasal discharge (anterior/posterior), ± facial pain/pressure, ± reduction or loss of smell (EPOS 2020). Formal diagnosis generally requires objective evidence of sinonasal inflammation (nasal endoscopy and/or CT), usually through ENT"],
         ["Phenotypes","<b>With nasal polyps (CRSwNP)</b> — loss of smell prominent, often associated with asthma and aspirin/NSAID sensitivity (N-ERD); <b>without polyps (CRSsNP)</b> — facial pressure and discharge more prominent. EPOS 2020 also classifies as localised (often unilateral) vs diffuse, and type 2 vs non-type 2"],
         ["Primary-care examination","Anterior rhinoscopy: polyps are pale, grey, insensate and mobile (unlike the pink, tender inferior turbinate). <b>A unilateral polyp or mass is an alarm finding</b> — do not treat it as routine bilateral CRSwNP; refer for ENT examination and diagnostic assessment"],
         ["Look for","Asthma (ask; check control), allergic rhinitis, NSAID sensitivity, smoking, occupational exposures, dental disease"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"First-line: appropriate medical therapy", html:"Regular <b>daily nasal saline irrigation</b> plus <b>intranasal corticosteroid spray</b>, with <b>education on technique and adherence</b>: consider a saline rinse before the steroid spray, and direct the spray away from the septum. Reassess after approximately <b>6–12 weeks</b> of adequate use. Do not substitute repeated antibiotics for regular topical treatment. Nasal steroid drops or corticosteroid irrigations for polyps are a specialist-directed option, may be off-label and should follow local ENT prescribing arrangements.", src:"EPOS 2020 (international; Fokkens et al.)"},
         {tone:"amber", h:"Refer if uncontrolled", html:"Symptoms persisting despite a proper trial of saline and intranasal steroid with good technique → routine ENT referral for endoscopy, CT and consideration of surgery (endoscopic sinus surgery).", src:"EPOS 2020 (international; Fokkens et al.)"},
         {tone:"red", h:"Refer urgently: alarm features", html:"<b>Persistent unilateral symptoms, bleeding, crusting, cacosmia, a unilateral polyp or mass</b> → urgent ENT. These suggest tumour, vasculitis/granuloma, fungal or other non-CRS pathology. Orbital or neurological features → immediate hospital assessment.", src:"EPOS 2020 (international; Fokkens et al.)"},
         {tone:"blue", h:"Oral steroids and antibiotics", html:"Short courses of systemic corticosteroid for polyps and long-term antibiotics are specialist decisions in EPOS 2020; repeated systemic steroid courses carry cumulative harm (bone, glucose, eyes).", src:"EPOS 2020 (international; Fokkens et al.)"},
         {tone:"blue", h:"Biologics — dupilumab", html:"<b>Dupilumab</b>, as an add-on to intranasal corticosteroids, is recommended as an option for <b>severe CRSwNP in adults</b> when not controlled well enough by systemic corticosteroids or sinus surgery, who have had <b>at least 1 sinus surgery</b>, with <b>SNOT-22 ≥50</b>, and only if the company provides it according to the <b>NHS commercial arrangement</b>. All criteria must be met. Severe CRSwNP means uncontrolled symptoms with objective evidence of disease, generally confirmed by specialist endoscopy. Specialist-led add-on treatment, not a primary-care prescribing option; replaces the terminated appraisal TA648.", src:"NICE TA1134 (2026)"},
         {tone:"blue", h:"What the GP needs to know about dupilumab", html:"Subcutaneous injection prescribed by the specialist service; monitoring remains with the specialist service. Record it on the GP medication list as a hospital-prescribed drug. Avoid live vaccines unless advised by the specialist/product information. Ask about new or worsening ocular symptoms and advise prompt specialist review for conjunctivitis, keratitis or visual symptoms. Be aware of eosinophilia and rare eosinophilic complications in the appropriate clinical context. Injection-site reactions are common. It has no meaningful routine drug–drug interaction burden.", src:"NICE TA1134 · BNF / dupilumab SPC"}
       ]},
       {b:"why", html:"CRS is a chronic inflammatory disease, not a long infection — which is why repeated antibiotic courses do not help and a well-used steroid spray does. Most “failed” steroid sprays fail on technique (aim towards the outer wall of the nostril, head tilted forward, not sniffing hard) and on stopping after a week."}
     ]},

    {id:"groups", nav:"Special groups", title:"Special groups", sub:"Where the default pathway changes.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"cream", h:"Pregnancy", html:"First-choice phenoxymethylpenicillin can be used. If penicillin-allergic, NG79 names <b>erythromycin</b> as the option in pregnancy; <b>doxycycline is contraindicated</b>. Nasal steroid in pregnancy: check UKTIS/BNF.", src:"NICE NG79"},
         {tone:"cream", h:"Children under 12", html:"No nasal-steroid recommendation (NG79 option is age ≥12); no doxycycline. Use NG79/BNFC age-banded doses if an antibiotic is needed. Mild eyelid oedema may occur with viral illness, but a child with <b>painful, erythematous or progressive periorbital swelling, fever, impaired eye movements, proptosis, diplopia or visual symptoms</b> requires same-day hospital assessment. Unilateral foul-smelling nasal discharge in a young child should prompt assessment for a nasal foreign body.", src:"NICE NG79"},
         {tone:"amber", h:"Immunocompromised", html:"Lower threshold for face-to-face assessment, immediate antibiotics, investigation or hospital referral — severe immunosuppression may justify urgent assessment, imaging or admission rather than simply an oral prescription. Document the reasoning. (Clinical point beyond NG79: in severe immunosuppression, neutropenia, uncontrolled diabetes or ketoacidosis, facial pain/numbness, black eschar, ophthalmoplegia, visual symptoms or rapid progression → emergency hospital assessment for invasive fungal rhinosinusitis; do not manage with routine oral antibiotics or steroids.)", src:"NICE NG79"},
         {tone:"amber", h:"Older adults", html:"New one-sided facial pain, headache or nasal symptoms in older people — consider giant-cell (temporal) arteritis (same-day urgent pathway per local GCA guidance), dental source and sinonasal tumour before labelling it sinusitis."},
         {tone:"cream", h:"Asthma and NSAID sensitivity", html:"CRSwNP is associated with asthma and NSAID-exacerbated respiratory disease; avoid ibuprofen if NSAID-sensitive, and review asthma control.", src:"EPOS 2020 (international; Fokkens et al.)"},
         {tone:"amber", h:"Odontogenic sinusitis", html:"Suspect a dental source with <b>unilateral maxillary symptoms</b>, foul smell or taste, upper molar pain, recent dental extraction or implant, purulent discharge, or failure of usual treatment. Arrange <b>dental assessment</b> and ENT review where appropriate. Antibiotic treatment alone will not correct a dental source."}
       ]}
     ]},

    {id:"followup", nav:"Follow-up", title:"Follow-up and review", sub:"Acute sinusitis needs a safety-net, not routine review. CRS needs planned reassessment.",
     blocks:[
       {b:"table", head:["When","Who","What to do"], rows:[
         ["Any time","Acute — red flag develops","Immediate hospital assessment; 999 if unstable (NICE NG79)"],
         ["Worsens rapidly or significantly","Acute, on no/back-up antibiotic","Reassess; use back-up script if agreed; exclude complications"],
         ["After ≥2–3 days on antibiotic, worsening","Acute, on first choice","Clinical reassessment, not automatic escalation: complications, alternative diagnosis, dental source, adherence; then second choice co-amoxiclav or microbiology advice (NICE NG79)"],
         ["Not improved by ~3 weeks","Acute","Review diagnosis: dental source, CRS developing, unilateral pathology, headache disorder"],
         ["~6–12 weeks","CRS on saline + INCS","Check technique and adherence; if not controlled → ENT (EPOS 2020)"],
         ["Ongoing","CRSwNP on dupilumab","Specialist-led review; GP records drug, watches for eye symptoms (NICE TA1134)"]
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral", sub:"Urgency, where, and what to send.",
     blocks:[
       {b:"table", head:["Urgency","Indication","Where / what to send"], rows:[
         ["<b>Immediate hospital assessment</b> (999 if reduced consciousness, seizure, severe sepsis, rapidly progressive neurological or visual compromise, or unsafe to transfer)","Orbital signs, visual compromise, ophthalmoplegia or diplopia, proptosis, severe systemic infection/sepsis, meningism, severe frontal headache with neurological features, frontal swelling, focal neurological signs, reduced consciousness or seizure (NICE NG79)","ED / on-call ENT or ophthalmology (orbital) / medical take; obs, NEWS2, antibiotics given, allergy status"],
         ["<b>Urgent ENT</b>","Persistent unilateral obstruction or discharge, unilateral bloodstained discharge or recurrent epistaxis, unilateral crusting, cacosmia, unilateral polyp or mass, persistent unilateral facial swelling, suspected sinonasal tumour or granulomatous disease (EPOS 2020 alarm features; not automatically same-day hospital)","Urgent ENT per local pathway; duration, side, bleeding, smoking, occupational exposure (wood dust, leather), examination findings"],
         ["<b>Suspected cancer pathway</b>","Head and neck criteria in NICE NG12 (e.g. laryngeal: age ≥45 with persistent unexplained hoarseness or unexplained neck lump; oral ulcer >3 weeks; unexplained thyroid lump)","Suspected-cancer referral per NG12. NG12 has no separate sinonasal criterion — use clinical judgement and local ENT pathways for a suspected sinonasal tumour"],
         ["<b>Routine ENT</b>","CRS not controlled after a properly delivered course of saline irrigation plus intranasal steroid; bilateral nasal polyps; recurrent acute rhinosinusitis; significant smell loss or functional impairment; suspected need for endoscopy, CT or surgical assessment","Treatments tried and for how long, technique checked, asthma/NSAID history, SNOT-22 if available"],
         ["<b>Other</b>","Upper molar/dental source → dentist; allergic rhinitis or asthma poorly controlled → optimise in primary care and consider allergy/respiratory review; suspected giant-cell arteritis in an older adult → same-day urgent pathway per local GCA guidance","—"]
       ]}
     ]},

    {id:"safetynet", nav:"Safety-net", title:"Safety-netting", sub:"Specific, time-bound and in plain words.",
     blocks:[
       {b:"say", html:"“This looks like a sinus infection that’s most likely caused by a virus. These usually last two to three weeks and get better on their own — antibiotics make very little difference for most people and can upset your stomach. Paracetamol or ibuprofen will help the pain. If you’re not getting any better after about ten days, come back and we can talk about a steroid nose spray. Please come back <b>straight away</b> — or go to A&amp;E — if you get <b>swelling or redness around your eye</b>, <b>double vision or your eyesight changes</b>, a <b>very bad headache</b>, <b>swelling on your forehead</b>, a <b>stiff neck</b>, you <b>feel confused</b>, or you feel <b>very unwell</b>.”"},
       {b:"say", html:"Back-up script: “I’ve left a prescription for an antibiotic, but I hope you won’t need it. Only collect it if you’re getting significantly worse, or if you’re no better after 7 days. If you feel very unwell, don’t just start the tablets — get seen.”"}
     ]},

    {id:"pitfalls", nav:"Pitfalls", title:"Common pitfalls", sub:"Where consultations go wrong.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"Antibiotics at day 3", html:"Coloured discharge alone is not a reason for antibiotics. Around 10 days or less → no antibiotic unless very unwell or high risk.", src:"NICE NG79"},
         {tone:"amber", h:"Missing the eye", html:"Not examining eye movements and acuity in someone with facial swelling. Periorbital signs mean hospital, not a back-up script.", src:"NICE NG79"},
         {tone:"amber", h:"Wrong steroid dose", html:"The NG79 high-dose option was studied at <b>mometasone 200 micrograms twice daily</b> or <b>fluticasone 110 micrograms twice daily</b> (off-label), not the standard allergic-rhinitis dose — and for 14 days, with documented consent. Check product strength and number of sprays; consider cumulative corticosteroid exposure.", src:"NICE NG79"},
         {tone:"amber", h:"Treating CRS like a long acute infection", html:"Repeated antibiotic courses for 3-month symptoms instead of saline + intranasal steroid with technique teaching.", src:"EPOS 2020 (international; Fokkens et al.)"},
         {tone:"amber", h:"Ignoring one side", html:"Repeatedly labelling persistent unilateral blockage with bloodstained discharge or crusting as uncomplicated sinusitis. It is an alarm feature — examine and refer for urgent ENT assessment rather than repeated empiric treatment.", src:"EPOS 2020 (international; Fokkens et al.)"},
         {tone:"amber", h:"“Sinus headache”", html:"Recurrent frontal pain without nasal blockage or discharge is rarely sinusitis — consider migraine or tension-type headache."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 34-year-old teacher, 6 days of blocked nose, green discharge and cheek pain after a cold, afebrile, observations normal. She has a school trip next week and says “I always need antibiotics for my sinuses.” Variant: day 14 and not improving; or a child with a swollen red eyelid."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Establishes duration and course; checks eyes, forehead, neck and neurology and says so; explores her previous experience and the school-trip concern; explains the natural history (2–3 weeks) and why antibiotics add little at day 6; offers self-care; sets a clear 10-day review point with the steroid-spray / back-up option; gives specific red-flag safety-netting; asks about recurrence, smoking, allergy and one-sided symptoms. In the day-14 variant: offers high-dose nasal steroid (off-label, consent) and no or back-up antibiotic per NG79. In the eyelid variant: same-day hospital."}
     ]}]},

     ]}
  ],
  foot:"Acute sinusitis and recognition of chronic rhinosinusitis in primary care — NICE NG79 (2017), EPOS 2020 (international), NICE NG12 (updated April 2026) and NICE TA1134 (2026). Antibiotic doses are those printed in NG79 for adults; children’s doses per NG79/BNFC. Orbital, intracranial and severe systemic complications need immediate hospital assessment; persistent unilateral alarm features need urgent ENT assessment. Verify all doses against the current BNF/BNFC and the local GMMMG antimicrobial formulary before prescribing."
