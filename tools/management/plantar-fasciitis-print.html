MG.render({

  stemTitle:"Plantar heel pain is usually plantar fasciopathy — a clinical diagnosis. Educate, modify load, stretch and strengthen, and reconsider anything atypical, neurological, traumatic or systemic",
  stemSub:"For <b>suspected or clinically diagnosed plantar heel pain</b> in primary care. It is usually plantar fasciopathy — often degenerative and load-related rather than primarily inflammatory — diagnosed from medial calcaneal tenderness and pain on the first steps after rest. Start with education, load modification, plantar-fascia and calf stretching, progressive strengthening, supportive footwear and optional low-cost heel cushioning. <b>Most improve, but recovery commonly takes several months and some have persistent or recurrent symptoms.</b> Review adherence and the diagnosis before referral, injection or specialist treatment.",

  nextReview:"25 September 2027",
  meta:[
    {t:"Clinical diagnosis — imaging not routine", tone:"ok"},
    {t:"Injection and ESWT: specialist, selective", tone:"tw"},

  lead:'<div class="mg-layers"><a href="#diagnose"><b>Diagnose</b><small>Examine</small></a><a href="#exclude"><b>Exclude</b><small>Mimics · red flags</small></a><a href="#selfcare"><b>Self-care</b><small>Load + stretch</small></a><a href="#escalate"><b>Escalate</b><small>If persistent</small></a><a href="#refer"><b>Refer</b><small>Image · MSK</small></a></div>',
  quickSub:"The five that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"blue", h:"A clinical diagnosis", html:"Medial calcaneal tubercle tenderness, pain with the <b>first steps after rest</b>, pain reproduced by loading the fascia or by passive toe dorsiflexion, and a normal neurovascular examination. <b>Imaging is not routine.</b> Consider alternatives when pain is atypical, severe, neurological, traumatic or systemic."},
    {tone:"green", h:"First-line: education, load and stretching", html:"Daily plantar-fascia and calf stretching with progressive strengthening and load modification is a reasonable first-line programme. Keep up tolerable activity rather than resting completely, and avoid sudden jumps in running or standing load."},
    {tone:"blue", h:"Cushioning helps comfort — expensive orthoses are not needed first", html:"An inexpensive prefabricated heel cup or insole can help short-term comfort alongside stretching and exercise. Custom orthoses are not needed at first presentation, and no orthosis should be used on its own."},
    {tone:"amber", h:"Injection and shockwave are not first-line", html:"A corticosteroid injection can give short-term relief but risks fascia rupture and fat-pad atrophy — selective, after review, never repeated routinely. <b>Shockwave therapy is a specialist option</b> under NICE HTG200 special arrangements: effectiveness is uncertain."},
    {tone:"red", h:"⚠ Red flags — reconsider the diagnosis", html:"Inability to weight-bear · severe pain after trauma · focal calcaneal squeeze tenderness · marked swelling, warmth or erythema · fever or systemic illness · constant or progressive pain · persistent night or rest pain · known malignancy · unexplained weight loss · ulceration or neurovascular compromise · diabetes with a wound or suspected infection."}
  ],
  pathwaySub:"Five steps. Most people only need the first three.",
  pathway:[
    {title:"Examine properly", html:"Gait and weight-bearing · exact site of tenderness · passive toe dorsiflexion · calf and Achilles flexibility · ankle and subtalar range · foot posture and footwear · neurovascular examination · lumbar and neurological examination where indicated · swelling, warmth or a mass.", alert:true},
    {title:"Exclude the mimics and red flags", html:"Stress fracture, fat-pad syndrome, tendon pathology, nerve entrapment, radiculopathy, enthesitis, infection, gout, tumour."},
    {title:"Educate, modify load, stretch and strengthen", html:"Supportive footwear; optional low-cost heel cushioning; analgesia only if appropriate."},
    {title:"Persistent? Review adherence and the diagnosis", html:"Then physiotherapy or podiatry, a night splint for persistent first-step pain, and only then selective injection or specialist options."},
    {title:"Image or refer when it does not fit", html:"Suspected stress fracture, neurological or vascular findings, inflammatory features, infection or malignancy concern — at any stage."}
  ],
  sections:[

    {id:"diagnose", nav:"Diagnose", title:"Step 1 — diagnose clinically",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>Terminology</b>","Plantar heel pain is usually plantar fasciopathy. Chronic cases are often degenerative and load-related rather than primarily inflammatory; \"plantar fasciitis\" remains the familiar clinical term"],
         ["<b>Typical history</b>","Gradual medial plantar heel pain, worst on the first steps after rest, easing with activity then worsening with prolonged standing"],
         ["<b>Typical findings</b>","Medial calcaneal tubercle tenderness · pain reproduced by fascia loading or passive toe dorsiflexion · generally normal neurovascular examination"],
         ["<b>Examine</b>","Gait and weight-bearing · exact site of tenderness · calf and Achilles flexibility · ankle and subtalar range · foot posture and footwear · neurovascular examination · swelling, warmth or mass · lumbar and neurological examination where indicated, including Tinel's sign at the tarsal tunnel, sensation, reflexes and power"],
         ["<b>Risk factors</b>","Increased or changed loading (running, standing work), higher body weight, tight calf or Achilles, foot posture, unsupportive footwear"]
       ]},
       {b:"why", html:"The diagnosis rests on the history and examination. Tarsal tunnel syndrome and S1 radiculopathy are assessed by examination — Tinel's sign, sensation, reflexes and power — not by symptoms alone."}
     ]},

    {id:"exclude", nav:"Exclude", title:"Step 2 — mimics and red flags",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"🟠 Other local causes", html:"Calcaneal stress fracture · calcaneal fat-pad syndrome · Achilles insertional tendinopathy · posterior tibial or peroneal tendon pathology · gout or other crystal disease."},
         {tone:"amber", h:"🟠 Nerve causes", html:"Tarsal tunnel syndrome · S1 radiculopathy · neuropathic pain · referred lumbar pain. Burning, tingling or numbness → examine the nerves and the back."},
         {tone:"amber", h:"🟠 Inflammatory enthesitis", html:"Bilateral heel pain alone does not diagnose spondyloarthritis. Look for inflammatory back pain, prolonged morning stiffness, alternating buttock pain, psoriasis, uveitis, inflammatory bowel disease or a family history."},

       ]}
     ]},

    {id:"selfcare", nav:"Self-care", title:"Step 3 — self-care and load management",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"🧘 Stretch and strengthen", html:"Daily plantar-fascia and calf/Achilles stretching with progressive calf and foot-intrinsic strengthening — a reasonable first-line programme."},
         {tone:"green", h:"🚶 Modify load, stay active", html:"Keep tolerable activity rather than resting completely. Avoid sudden increases in running or standing load; build back gradually."},
         {tone:"green", h:"👟 Footwear and cushioning", html:"Supportive footwear is preferable; arch support is not needed for everyone. Avoid prolonged barefoot walking on hard surfaces if it aggravates. An inexpensive heel cup or insole can help comfort short term."},
         {tone:"blue", h:"🧊 Symptom relief only", html:"Ice, massage or rolling a frozen bottle can ease pain — symptom relief, not disease-modifying treatment."},
         {tone:"blue", h:"⚖️ Weight", html:"Weight management can be discussed sensitively, but it is not an immediate treatment requirement."}
       ]}
     ]},

    {id:"escalate", nav:"Escalate", title:"Step 4 — analgesia and escalation",
     blocks:[
       {b:"table", head:["Option","When","Safeguards"], rows:[
         ["<b>Paracetamol or a short topical or oral NSAID course</b>","Only if appropriate for the patient's comorbidities and medicines; to support activity and rehabilitation","Follow the local formulary for dose and duration. Reduce the paracetamol maximum for low body weight, frailty, liver disease or high alcohol intake. Before an oral NSAID: renal, cardiovascular and GI risk, anticoagulants, antiplatelets, corticosteroids, NSAID-sensitive asthma. Shortest effective course; never combine NSAIDs; risk-based gastroprotection. Topical NSAIDs may penetrate poorly to deep heel pain"],
         ["<b>Physiotherapy or podiatry</b>","Persistent symptoms, restricted function, or a structured programme needed","Stretching, progressive calf and intrinsic strengthening, graded return to impact, gait and load assessment, taping, footwear and orthosis advice"],
         ["<b>Night splint</b>","Persistent first-step morning pain after an adequate trial of stretching and load modification","If tolerated; review adherence and comfort. Not routine at first presentation"],
         ["<b>Corticosteroid injection</b>","Persistent symptoms despite an appropriate rehabilitation programme, after diagnostic review","Not first-line. Short-term relief only. Avoid repeated injections and intrafascial injection. Discuss fascia rupture, fat-pad atrophy, infection, skin depigmentation and transient hyperglycaemia. Specialist or image-guided if the diagnosis is uncertain or a previous injection failed"],
         ["<b>Extracorporeal shockwave therapy (ESWT)</b>","Refractory plantar heel pain, through an appropriately governed specialist service","<b>Not routine primary-care treatment.</b> NICE HTG200 (2009, unchanged) allows it only with special arrangements for governance, consent and audit: effectiveness is uncertain, and it can cause pain, bruising or local skin damage"]
       ]},
       {b:"warn", html:"A time point alone should not trigger an injection. It does not replace stretching, strengthening and load management."}
     ]},

    {id:"refer", nav:"Refer", title:"Step 5 — imaging and referral",
     blocks:[
       {b:"table", head:["Situation","Action"], rows:[
         ["<b>Suspected stress fracture · significant trauma · inability to weight-bear · persistent focal bony tenderness · atypical or progressive pain · suspected inflammatory, infective or neoplastic disease · diagnostic uncertainty</b>","Plain radiograph, or further imaging. <b>A normal early X-ray does not exclude a stress fracture</b> — MRI is better for stress fracture, marrow or complex soft-tissue disease. Ultrasound can assess the fascia but is not needed to diagnose"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"Urgent — at any stage", html:"Inability to weight-bear · suspected stress fracture · infection, ulceration or malignancy concern · neurovascular compromise."},
         {tone:"blue", h:"Physiotherapy, podiatry or MSK", html:"Persistent symptoms despite a properly delivered self-management programme · significant occupational or sporting limitation · need for orthoses, a night splint or gait assessment · recurrent symptoms · failure to progress. A review at about 6 weeks and again at about 3 months is a practical local schedule, not a guideline requirement."},
         {tone:"blue", h:"Rheumatology", html:"Heel pain with convincing inflammatory features, via the local inflammatory arthritis pathway — not simply because it is bilateral or the patient is young."},
         {tone:"cream", h:"GP management", html:"The examination, the exclusions, self-care, safe analgesia and the review points all belong here. Related pages: <a href='../algorithms/foot-pain.html'>foot pain pathway</a> · <a href='achilles-tendinopathy.html'>Achilles tendinopathy</a> · <a href='ankylosing-spondylitis.html'>axial spondyloarthritis</a>."}
       ]},
       {b:"say", html:"This is plantar heel pain — usually strain of the tough tissue under the heel from how the foot is loaded. Most people get better, but it often takes a few months. What helps most is daily calf and foot stretches, building up strength, supportive shoes, and easing off the activities that flare it rather than stopping altogether. A cheap heel cushion can make it more comfortable. Come back if you can't put weight on it, if it becomes red, hot or swollen, if you get numbness or tingling, or if it hurts at rest or at night."}
     ]},

     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 47-year-old retail worker has <b>right heel pain for eight weeks</b>, worst on her first steps each morning. She has recently started standing for longer shifts. She is tender over the <b>medial calcaneal tubercle</b>; calcaneal squeeze is painless and neurovascular examination is normal. She asks for an X-ray and a steroid injection."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Makes the clinical diagnosis and explains why imaging is not needed now; checks for red flags, nerve causes and inflammatory features; explains load modification, stretching and strengthening, footwear and a low-cost heel cushion; is honest about the slow course; discusses injection — short-term, risks, not first-line — and when it might be considered; checks safety before any NSAID; and sets review and safety-net points."}
     ]}]},

         '<li><b>BNF and local formulary</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — analgesic and NSAID doses, cautions and gastroprotection</span></li>'+

  foot:"Plantar heel pain (plantar fasciitis) in adults. Usually plantar fasciopathy, diagnosed clinically from medial calcaneal tenderness and first-step pain; imaging is not routine. Treat with education, load modification, plantar-fascia and calf stretching, progressive strengthening, supportive footwear and optional low-cost heel cushioning; analgesia only when appropriate. Reconsider atypical, constant, neurological, systemic or traumatic pain, or inability to weight-bear. Review adherence and diagnosis before referral, injection or specialist treatment. ESWT is a specialist option with uncertain efficacy under NICE HTG200 special arrangements. Most improve, though recovery commonly takes several months. Sources: JOSPT/APTA 2023, NICE HTG200, BNF."
