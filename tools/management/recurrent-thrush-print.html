  quickSub:"If you read nothing else on this page, read these six cards. Every number traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Culture before committing to long-term antifungals", html:"Recurrent “thrush” that does not respond may be lichen sclerosus or lichen planus, dermatitis, herpes, or a resistant non-albicans species. A swab for culture with speciation, taken while symptomatic, comes before any maintenance regimen — and 4 or more courses of antifungal in a year without sustained resolution means a full diagnostic review (examine, pH, swab) before the next prescription."},
    {tone:"purple", h:"🟣 NICE NG12 (updated April 2026) — the vulval criterion", html:"<b>Consider a suspected cancer pathway referral (for an appointment within 2 weeks) for vulval cancer in a woman with an unexplained vulval lump, ulceration or bleeding.</b> A raised, ulcerated, warty, pigmented or thickened area that persists despite antifungal treatment is unexplained — refer rather than reissue."},
    {tone:"amber", h:"Lichen sclerosus is the diagnosis most often missed", html:"Thrush: itch, thick white discharge, erythema and satellite lesions on otherwise normal skin, with a normal vaginal pH. Lichen sclerosus: intense (often nocturnal) itch, white crinkled or thickened skin in a figure-of-eight around the vulva and anus, fissuring, loss of architecture and <b>little or no discharge</b>. It needs a potent topical steroid, not an antifungal, and lifelong follow-up — the lifetime vulval SCC risk is under 5% (BAD, 2018)."},
    {tone:"blue", h:"Two bedside tests worth five minutes", html:"Vaginal pH on narrow-range paper: <b>4.5 or below fits candida</b>; above 4.5 points to bacterial vaginosis, trichomoniasis, atrophy or desquamative inflammatory vaginitis. Cotton-swab touch test at the vestibule when burning or pain dominates: provoked pain with normal-looking skin and negative cultures points to vulvodynia."},
    {tone:"blue", h:"Every woman with RVVC needs an HbA1c — and a drug review", html:"Glycosuria feeds candida. HbA1c 48 mmol/mol or above indicates diabetes (NICE NG28); 42–47 is non-diabetic hyperglycaemia (NICE PH38). SGLT2 inhibitors lower glucose by causing glycosuria, and genital fungal infection is a common adverse effect in their SPCs. Also ask about recent broad-spectrum antibiotics, corticosteroids and other immunosuppression, and pregnancy."},
    {tone:"green", h:"Induction then maintenance — and say it suppresses rather than cures", html:"For culture-confirmed <i>C. albicans</i> RVVC (BASHH 2019): induction with fluconazole 150 mg every 72 hours for 3 doses, then maintenance fluconazole 150 mg once weekly for 6 months. In the trial behind it (Sobel et al., NEJM 2004) most women stayed free of symptomatic episodes during maintenance, but relapse was common once it stopped. Agree a stop date and a written relapse plan at the start."}
  ],

  pathway:[
    {title:"Screen for the sinister and the underlying", html:"An unexplained vulval lump, ulcer or bleeding (NG12), white or scarred vulval skin, oral or oesophageal candida, weight loss or night sweats, symptoms of new diabetes, azole non-response, and fever with pelvic pain.", alert:true},

    {title:"Examine, test the pH, swab properly", html:"<b>Look at the vulval skin, not only the discharge</b>; vaginal pH; cotton-swab test if burning dominates; high vaginal swab while symptomatic and ideally a week after the last antifungal; HbA1c; pregnancy test before a systemic azole."},
    {title:"Work through the mimics", html:"BV, trichomoniasis, lichen sclerosus, erosive lichen planus, contact dermatitis, vulvodynia, herpes, atrophy, DIV, eczema or psoriasis, and VIN all get treated as thrush, and none responds to antifungals."},

  sections:[

    {id:"severe", nav:"Exclude first", title:"Red flags — the diagnoses hiding behind recurrent thrush",
     sub:"Four or more episodes a year is a reason to stop and diagnose, not to reissue. Screen for these before another antifungal.",
     blocks:[
       {b:"table", head:["Presentation","Suggests","Action"], rows:[
         ["<b>Unexplained vulval lump, ulceration or bleeding</b>, or a raised, ulcerated, warty, pigmented or thickened area persisting despite antifungal treatment","<b>Vulval intraepithelial neoplasia or vulval cancer</b>","<b>NICE NG12 (updated April 2026): consider a suspected cancer pathway referral</b> to gynaecology. Do not issue a further antifungal instead"],
         ["White, thickened, crinkled or scarred vulval skin with itch and fissuring, little or no discharge","<b>Lichen sclerosus</b> (or lichen planus if eroded) — lifetime vulval SCC risk under 5% in lichen sclerosus (BAD, 2018)","Potent topical steroid, not an antifungal; vulval clinic or dermatology if the diagnosis is uncertain or biopsy is needed. See <a href='vulvar-disorders.html'>vulvar disorders</a>"],
         ["<b>Painful swallowing with oral white plaques</b>","<b>Oesophageal candidiasis — an AIDS-defining illness</b>; also haematological malignancy, high-dose steroids, biologics","<b>Urgent HIV test</b> and specialist referral"],
         ["<b>Unexplained weight loss, night sweats, fatigue</b> with recurrent candida","<b>HIV or haematological disease</b>","HIV test, FBC, and review for haematological disease"],
         ["<b>Polyuria, thirst, weight loss</b>","<b>New diabetes — glycosuria favours candida</b>","HbA1c for every woman with recurrent symptoms; capillary glucose and ketones today if symptomatic"],
         ["<b>Failure to respond to fluconazole</b>","Non-albicans species — <i>C. glabrata</i> is often azole-resistant — or a different diagnosis","Swab for culture with speciation and sensitivities <b>before any further azole</b>"],
         ["<b>Fever, pelvic pain, abnormal bleeding</b>","Pelvic inflammatory disease or another gynaecological cause, not candida","Same-day assessment"]
       ]},
       {b:"dl", rows:[
         ["<b>NICE NG12 (updated April 2026) — the criterion that applies here</b>","Consider a suspected cancer pathway referral (for an appointment within 2 weeks) for vulval cancer in a woman with an unexplained vulval lump, ulceration or bleeding. NG12 does not set a treatment-duration rule: in practice, a vulval abnormality that has not settled with appropriate treatment is unexplained, and so is any raised, ulcerated, warty or thickened area, including a new or changing area on a background of lichen sclerosus. <b>Do not issue a further antifungal course instead of the referral</b> — restated in <a href='#refer'>Refer</a>"]
       ]},
       {b:"why", html:"Recurrent vulvovaginal symptoms are treated empirically for months or years in some women, and the conditions that are missed are the ones that matter: lichen sclerosus and lichen planus (which scar and carry a small cancer risk), vulval intraepithelial neoplasia and vulval cancer, undiagnosed diabetes and HIV. The clinical distinction between thrush and lichen sclerosus is usually visible: candida produces discharge, erythema and satellite lesions on otherwise normal skin; lichen sclerosus produces white atrophic or thickened skin with fissuring and no significant discharge, and does not settle with an antifungal. The British Association of Dermatologists guideline (2018) quotes a lifetime SCC risk under 5% in genital lichen sclerosus, which is why the diagnosis needs making and follow-up is lifelong."}
     ]},

    {id:"confirm", nav:"Confirm", title:"Definition, species and predisposing factors",
     sub:"The definition matters, because it is the threshold for committing someone to six months of antifungal.",
     blocks:[
       {b:"dl", rows:[
         ["<b>RVVC definition (BASHH 2019)</b>","<b>Four or more symptomatic episodes in 12 months</b>, at least two confirmed by microscopy or culture, and at least one of those a positive culture with moderate or heavy growth of <i>Candida</i>. Many women with recurrent “thrush” have never had a positive culture — confirm before committing to maintenance"],
         ["<b>Typical candida</b>","Vulval itch and soreness, superficial dyspareunia, external dysuria, thick white non-offensive discharge; erythema, fissuring and satellite lesions; <b>vaginal pH 4.5 or below</b>"],
         ["<b>Species</b>","<i>C. albicans</i> causes most episodes. Non-albicans species, especially <i>C. glabrata</i>, are more likely in women with type 2 diabetes and in older and postmenopausal women (BASHH 2019), and respond poorly to azoles. Any atypical or treatment-resistant episode → culture with speciation and sensitivities"],
         ["<b>Predisposing factors</b>","Diabetes and poor glycaemic control · SGLT2 inhibitors (glycosuria; genital fungal infection is a common adverse effect in the SPCs) · recent broad-spectrum antibiotics · corticosteroids, other immunosuppression and HIV · pregnancy · irritant products that damage the vulval skin barrier · tight synthetic clothing"],
         ["<b>Severe or complicated episodes</b>","Extensive vulval erythema, oedema, excoriation or fissuring, pregnancy, poorly controlled diabetes, immunosuppression or a non-albicans species make an episode complicated: longer or repeated treatment is usually needed, and the underlying driver deserves as much attention as the organism"],
         ["<b>Pattern clues</b>","Cyclical premenstrual flares · complete resolution between episodes (true recurrence) versus never fully clearing (think again) · after antibiotics · after starting an SGLT2 inhibitor · self-diagnosis only, never confirmed"],
         ["<b>Oral thrush risk factors</b>","Inhaled corticosteroids without mouth rinsing · dentures · dry mouth · smoking · immunosuppression"]
       ]},
       {b:"why", html:"<b>The BASHH definition requires laboratory confirmation for a reason:</b> self-diagnosis of candida is unreliable, and committing someone to six months of weekly fluconazole should wait for culture proof and speciation. Normal vaginal pH is a useful discriminator — candida does not raise it, whereas bacterial vaginosis, trichomoniasis and atrophic vaginitis do. SGLT2 inhibitors (dapagliflozin, empagliflozin, canagliflozin) deserve a specific question because their glucose-lowering mechanism is glycosuria, and genital fungal infection is one of their commonest adverse effects. For the SCA, a strong candidate states the definition, explains why confirmation matters before long-term treatment, and asks what the patient thinks is going on: many women have tried numerous over-the-counter products, and some fear a sexually transmitted cause or cancer. Naming those concerns and explaining the plan to test for them usually earns more trust than a further prescription."}
     ]},

    {id:"assess", nav:"Assess", title:"Assessment and investigations",
     sub:"The investigation that changes management most is a swab taken while symptomatic and sent for culture with speciation.",
     blocks:[
       {b:"table", head:["Element","What to do"], rows:[
         ["<b>History</b>","Number of episodes in the last year and how each was confirmed · itch versus burning versus pain · discharge character and odour · relation to menses, sex and antibiotics · response to each treatment, and whether symptoms ever fully cleared · products used on the vulva · contraception, pregnancy possibility, menopause status · diabetes, SGLT2 inhibitor, steroids, immunosuppression · sexual history and STI risk · partner symptoms such as balanitis"],
         ["<b>Examination</b>","Always examine, ideally while symptomatic. Vulval skin: erythema and satellite lesions (candida); whitening, thickening, loss of labial architecture and fissures (lichen sclerosus); erosions (lichen planus); ulcers, lumps, warty or pigmented areas (neoplasia). Speculum: discharge character, vaginal walls, cervix (normal in candida)"],
         ["<b>Bedside tests</b>","Vaginal pH: 4.5 or below fits candida; above 4.5 suggests BV, trichomoniasis, atrophy or DIV. Cotton-swab touch test of the vestibule if pain or burning dominates"],
         ["<b>Laboratory</b>","High vaginal swab for microscopy and culture <b>with speciation and sensitivities — ask for this explicitly on the form</b>, as many laboratories only speciate on request · HbA1c · STI tests if at risk · HIV test where there are risk factors or features of immunosuppression · pregnancy test before a systemic azole"],
         ["<b>Taking the swab</b>","From the lateral vaginal wall or posterior fornix, ideally while symptomatic and ideally at least a week after the last antifungal, which can otherwise give a false negative. State on the form: recurrent symptoms, request speciation and sensitivities"],
         ["<b>Consider</b>","FBC and ferritin if clinically suggested; vulval biopsy (via the vulval clinic or dermatology) where a dermatosis or neoplasia is possible"]
       ]},
       {b:"why", html:"A swab taken while symptomatic confirms or refutes candida, identifies non-albicans species that will not respond to fluconazole, and guides specialist therapy. Examining the vulval skin itself, rather than only the discharge, is what detects lichen sclerosus, lichen planus and neoplasia. The HbA1c is cheap and occasionally transformative. A pregnancy test is needed because oral fluconazole should be avoided in pregnancy (BNF). Where the patient is between episodes and the examination is normal, arrange to examine and swab her during the next flare, and ask her not to self-treat beforehand so that the swab can be interpreted."}
     ]},

    {id:"workup", nav:"Differential", title:"The mimics — none of these respond to an antifungal",
     sub:"Each of these is regularly treated as thrush for months or years. Recognising them is most of the clinical value on this page.",
     blocks:[
       {b:"table", head:["Diagnosis","Discriminating features","Next step"], rows:[
         ["<b>Bacterial vaginosis</b>","Thin grey-white discharge with a fishy odour, often worse after sex or menses; little itch or inflammation; <b>pH above 4.5</b>","Metronidazole 400 mg twice daily for 5–7 days, or 2 g as a single dose (BNF) — see the <a href='bacterial-vaginosis.html'>BV protocol</a>"],
         ["<b>Trichomoniasis</b>","Frothy yellow-green offensive discharge, vulvitis, pH above 4.5; sexually transmitted","Test, and refer to sexual health for treatment and partner notification — see <a href='trichomoniasis.html'>trichomoniasis</a>"],
         ["<b>Lichen sclerosus</b>","Intense itch, often nocturnal; white, crinkled or thickened skin in a figure-of-eight around the vulva and anus; purpura, fissures, loss of labia minora; little or no discharge; no lasting response to antifungals","Clobetasol propionate 0.05% ointment on a reducing regimen over 3 months (BAD, 2018); lifelong follow-up, biopsy any new lesion"],
         ["<b>Erosive lichen planus</b>","Painful glazed red erosions with a white lacy edge, vaginal involvement and adhesions, often with oral lesions","Vulval clinic — specialist diagnosis and treatment"],
         ["<b>Irritant or allergic contact dermatitis</b>","Itch and burning linked to soaps, wipes, pads, spermicides, latex or topical medicines (including repeated antifungal creams); erythema without satellite lesions; negative culture","Remove the cause; emollient soap substitute; a short course of a mild topical steroid such as hydrocortisone 1% (BNF)"],
         ["<b>Vulvodynia</b>","Burning or rawness rather than itch, provoked by touch, sex or tampons; normal-looking skin; repeatedly negative cultures; <b>positive cotton-swab test</b> at the vestibule","Stop antifungals; topical lidocaine 5% ointment before intercourse and low-dose amitriptyline (off-label; dose per BNF) are options; pelvic floor physiotherapy and psychosexual support; vulval clinic. See <a href='vulvar-disorders.html'>vulvar disorders</a>"],
         ["<b>Genital herpes</b>","Recurrent painful blisters or ulcers in the same area, often with a prodrome","Swab for HSV PCR — see <a href='genital-herpes.html'>genital herpes</a>"],
         ["<b>Atrophic vaginitis</b>","Peri- or postmenopausal dryness, soreness and dyspareunia; pale thin mucosa; pH raised","Vaginal oestrogen — see <a href='menopause.html'>menopause</a>"],
         ["<b>Desquamative inflammatory vaginitis (DIV)</b>","Purulent discharge, marked vaginal inflammation and dyspareunia, pH raised; many white cells and absent lactobacilli on microscopy; cause uncertain","Specialist diagnosis; treatment (usually intravaginal clindamycin or a steroid) is specialist-initiated"],
         ["<b>Eczema, psoriasis, intertrigo</b>","Itchy red plaques in the skin folds and on the mons, with eczema or psoriasis elsewhere (scalp, nails, elbows); candida may colonise secondarily","Treat the dermatosis; emollients"],
         ["<b>VIN or vulval cancer</b>","Persistent raised, pigmented, warty, ulcerated or thickened area, itch or bleeding","NICE NG12 (updated April 2026) route — see <a href='#severe'>red flags</a>"]
       ]},
       {b:"why", html:"Three bedside discriminators do most of the work: the pH (normal in candida; raised in BV, trichomoniasis, atrophy and DIV), the dominant symptom (itch favours candida and the dermatoses; burning or pain with normal skin favours vulvodynia), and the appearance of the skin itself (white and scarred in lichen sclerosus, eroded in lichen planus). A swab that repeatedly grows nothing while symptoms persist is itself diagnostic information: it points away from candida and towards a dermatosis, vulvodynia or an irritant cause. Repeated use of topical antifungals can itself cause irritant dermatitis, so a woman who is worse the more cream she uses may have a contact problem rather than resistant candida. The governing rule for the whole page: 4 or more courses of antifungal without sustained resolution means a vulval examination, pH, swab with speciation — and a cotton-swab test if burning dominates — before prescribing again."}
     ]},

    {id:"ladder", nav:"Treat", title:"Antifungal treatment — acute, induction and maintenance",
     blocks:[
       {b:"table", head:["Situation","Regimen"], rows:[
         ["<b>Acute episode</b>","A single oral azole or an intravaginal imidazole, with a topical imidazole cream for vulval symptoms (BASHH 2019): for example fluconazole 150 mg orally as a single dose, or clotrimazole 500 mg pessary as a single dose, with clotrimazole 1% cream externally. Doses per BNF"],
         ["<b>RVVC — induction</b>","<b>Fluconazole 150 mg every 72 hours for 3 doses</b> (BASHH 2019). <b>Confirm <i>C. albicans</i> on culture first</b>"],
         ["<b>RVVC — maintenance</b>","<b>Fluconazole 150 mg once weekly for 6 months</b> (BASHH 2019, based on Sobel et al., NEJM 2004). Effective contraception is needed throughout. Plan a documented stop date. The BNF advises monitoring liver function with high doses or extended courses"],
         ["<b>Pregnancy</b>","Topical imidazole (for example clotrimazole) for 7 days per episode. <b>Avoid oral fluconazole</b> — the BNF advises avoiding it, following a regulatory review of miscarriage and malformation reports. Check for gestational diabetes where risk factors exist (NICE NG3)"],
         ["<b>Non-albicans or azole-resistant</b>","Do NOT keep prescribing fluconazole. Specialist options (BASHH 2019) include nystatin pessaries 100,000 units nightly for 14 nights, and boric acid 600 mg vaginal pessaries daily for 14 days — unlicensed, intravaginal only, and toxic if swallowed. GUM or gynaecology initiation"]
       ]},
       {b:"warn", html:"<b>Before prescribing fluconazole, check the BNF for interactions:</b> it inhibits the metabolism of several drugs — for example warfarin, some statins, sulfonylureas and QT-prolonging medicines. Hepatic disease and existing QT prolongation need care. <b>Every woman who could become pregnant on weekly maintenance needs effective contraception.</b>"},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"💊 RVVC on an SGLT2 inhibitor", html:"Explain the link and treat the episode. Then a shared decision with the patient (and the diabetes team if needed): continue with antifungal cover, or change the glucose-lowering drug. <b>Do not stop it unilaterally where it is prescribed for heart failure or CKD</b>, where its benefit is substantial.", src:"SGLT2 inhibitor SPCs · BASHH 2019"},
         {tone:"cream", h:"💠 Hormonal pattern", html:"Cyclical premenstrual flares, or onset with a new combined hormonal method: discuss contraceptive alternatives if the pattern is clear and consistent.", src:"BASHH 2019 — predisposing factors"},
         {tone:"green", h:"🌬️ Oral thrush on an inhaled corticosteroid", html:"Check inhaler technique, use a spacer with a metered-dose inhaler, and rinse and spit after each dose. Active infection: nystatin oral suspension 100,000 units four times daily for 7 days (continue for 48 hours after lesions resolve), or fluconazole 50 mg daily for 7–14 days.", src:"BNF — oropharyngeal candidiasis"},
         {tone:"amber", h:"🤰 RVVC in pregnancy", html:"Topical imidazole only, and longer courses may be needed. No oral fluconazole. Check for gestational diabetes where risk factors exist.", src:"BASHH 2019 · BNF · NICE NG3"},
         {tone:"amber", h:"🛡️ Immunosuppressed", html:"Steroids, biologics, chemotherapy or HIV: involve the specialist team, consider non-albicans species early, and treat promptly. Antifungal prophylaxis in profound immunosuppression is a specialist decision.", src:"BASHH 2019"},
         {tone:"cream", h:"🧪 Ibrexafungerp — not licensed in the UK", html:"Ibrexafungerp is a glucan synthase inhibitor approved in the USA (FDA, 2021) for vulvovaginal candidiasis. It is <b>not licensed in the UK</b>, so no dose is given here; any use would be specialist-led and unlicensed — check current availability before mentioning it.", src:"FDA approval 2021 · BNF (not listed)"}
       ]},
       {b:"why", html:"The induction-then-maintenance regimen is the BASHH 2019 recommendation, based on Sobel et al. (NEJM 2004), in which weekly fluconazole kept most women free of symptomatic episodes during the 6-month treatment period, but relapse was common once it stopped. That is why the counselling matters as much as the prescription: maintenance suppresses rather than cures. Fluconazole should be avoided in pregnancy, and a woman on a six-month weekly course needs reliable contraception. Refer azole-refractory or non-albicans RVVC to GUM or gynaecology rather than continuing ineffective fluconazole."}
     ]},

    {id:"lifestyle", nav:"Prevention", title:"Vulval skin care and trigger avoidance",
     sub:"These run alongside maintenance, not after it — irritant damage both mimics candida and makes it more likely to recur.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"🧼 Soap substitute", html:"Wash the vulva with water or a plain emollient — no soap, shower gel, bubble bath, intimate wash or wipes. Pat dry. A bland emollient can also be used as a barrier for soreness; avoid over-washing.", src:"BASHH 2019 — general advice"},
         {tone:"amber", h:"🚫 No douching", html:"Vaginal douching disrupts the normal flora and is not recommended — including commercial products, bicarbonate, vinegar or essential oils.", src:"BASHH 2019 — general advice"},
         {tone:"cream", h:"💊 Antibiotic-triggered episodes", html:"Avoid unnecessary antibiotics. Some women benefit from an antifungal taken with each necessary course — a pragmatic, individual decision.", src:"BASHH 2019 — predisposing factors"},
         {tone:"green", h:"🩸 Glycaemic control", html:"Improve glycaemic control and recheck HbA1c; each RVVC episode is a prompt to review the diabetes plan, including the SGLT2 inhibitor question.", src:"NICE NG28"},
         {tone:"cream", h:"🦠 Probiotics", html:"Oral and vaginal lactobacillus and lactic-acid products are widely sold. Evidence of benefit in RVVC is limited and they are not a substitute for confirmed-diagnosis treatment — reasonable to try if she wishes, but not to rely on.", src:"BASHH 2019"},
         {tone:"green", h:"👕 Clothing, exercise and products", html:"Loose cotton underwear and breathable fabrics; shower and change promptly after swimming or exercise. Avoid perfumed pads and liners, spermicides and flavoured or sugary lubricants; use a plain water-based lubricant, and pause intercourse while the vulva is fissured or raw.", src:"BASHH 2019 — general advice"},
         {tone:"cream", h:"👥 Partners", html:"A partner with symptoms (for example balanitis) should be assessed and treated. Routine treatment of an asymptomatic partner is not usually needed.", src:"BASHH 2019"},
         {tone:"blue", h:"🔎 Pain between flares", html:"Pain that persists between flares with a normal-looking vulva is a cue to reconsider vulvodynia rather than candida — do the cotton-swab test.", src:"BASHH 2019 · BAD vulval guidance"}
       ]}
     ]},

    {id:"monitor", nav:"Follow-up", title:"Follow-up and safety-netting",
     blocks:[
       {b:"table", head:["When","What"], rows:[
         ["<b>Before the next prescription</b>","If an episode has not been confirmed on culture, or the diagnosis has not been reviewed after four or more episodes a year, examine and swab before prescribing again"],
         ["<b>During maintenance</b>","Tolerability, breakthrough episodes, pregnancy risk and interacting medicines; liver function if the course is extended (BNF)"],
         ["<b>At 6 months</b>","A documented continue-or-stop decision with the rationale recorded"],
         ["<b>After stopping maintenance</b>","Relapse is common: agree what to do — repeat swab while symptomatic, restart if confirmed — rather than open-ended repeats. Culture before restarting if there are atypical features; seek specialist advice if she relapses after a second course"],
         ["<b>Lichen sclerosus</b>","Lifelong follow-up; any new lump, ulcer or thickened area → urgent review and the NG12 route"],
         ["<b>Diabetes</b>","HbA1c every 3–6 months until stable, then 6-monthly (NICE NG28); each thrush episode is a glycaemia review trigger"],
         ["<b>No improvement 7–14 days after treatment</b>","Swab for culture with speciation (non-albicans?). New atypical symptoms — burning without discharge, white skin → vulval examination, pH test, and reconsider the diagnosis"],
         ["<b>Documentation</b>","Record the number of confirmed episodes, culture and species results, examination findings (including the vulval skin), HbA1c and the agreed stop date — the next clinician needs these to avoid starting the cycle again"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 Seek help urgently", html:"Painful swallowing with thrush → oesophageal candidiasis or HIV · a vulval lump, sore or bleeding that does not heal → suspected cancer route · fever with pelvic pain → PID, same-day assessment.", src:"NICE NG12 (updated April 2026) · BASHH 2019"},
         {tone:"amber", h:"🟠 Book a review", html:"No improvement 7–14 days after correct treatment, burning or pain without discharge, or skin that looks white or thickened — reconsider: non-albicans candida (culture and speciation), BV (pH), lichen sclerosus (steroid, not antifungal), contact dermatitis (remove the product), vulvodynia (cotton-swab test with normal cultures).", src:"BASHH 2019 · BAD 2018"},
         {tone:"blue", h:"🔁 Before the next prescription", html:"4 or more courses of antifungal without sustained resolution = full diagnostic review. Document that process clearly.", src:"BASHH 2019 — RVVC definition"},
         {tone:"green", h:"💬 Set the expectation", html:"Counsel that maintenance suppresses rather than cures, and that relapse after stopping is common — agree the relapse plan at the start.", src:"Sobel et al., NEJM 2004"}
       ]},
       {b:"say", html:"Before I give you another antifungal, I want to be sure this is thrush — because when it keeps coming back and the treatment only half works, it often turns out to be something else that looks similar. So today I want a swab that also tells us which type of yeast it is, a blood test for diabetes, and a proper look at the skin. If it is ordinary thrush, there is a good regimen: three doses to clear it, then one tablet a week for six months, which keeps most people clear while they are taking it. I'll be honest that it suppresses rather than cures — it often comes back after stopping — so we'll agree now what to do if it does, and talk about the things that reduce the triggers."},
       {b:"why", html:"Safety-netting in RVVC is mostly about preventing drift into years of unexamined empirical treatment. A clear rule helps: no further prescription without examination and culture once a woman meets the recurrence definition. A planned end-point for maintenance, with a written plan for relapse, keeps the regimen purposeful. The urgent return criteria cover the diagnoses that must not be missed: oesophageal candidiasis, vulval neoplasia and pelvic infection. Women who have been told repeatedly that they have thrush are often relieved rather than disappointed when someone looks for another explanation."}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways",
     blocks:[
       {b:"cards", items:[
         {tone:"purple", h:"2WW · NICE NG12 (updated April 2026)", html:"<b>Unexplained vulval lump, ulceration or bleeding → consider a suspected cancer pathway referral (for an appointment within 2 weeks) for vulval cancer</b>, to gynaecology. In practice this includes a raised, ulcerated, warty or thickened area that persists despite treatment, and a new or changing area on a background of lichen sclerosus.", src:"NICE NG12 (updated April 2026)"},
         {tone:"red", h:"Urgent / same day", html:"Suspected oesophageal candidiasis → urgent HIV test and specialist referral. Fever with pelvic pain → same-day assessment.", src:"BASHH 2019"},
         {tone:"amber", h:"Vulval clinic / gynaecology / dermatology", html:"Suspected lichen sclerosus or lichen planus needing confirmation or not responding to treatment · vulvodynia · desquamative inflammatory vaginitis · RVVC not controlled on a maintenance regimen.", src:"BAD 2018 · BASHH 2019"},
         {tone:"blue", h:"Sexual health (GUM)", html:"Non-albicans or azole-resistant candida needing specialist agents · positive STI tests · newly diagnosed HIV · complex or immunosuppressed patients.", src:"BASHH 2019"},
         {tone:"green", h:"Diabetes team", html:"New diabetes (HbA1c 48 mmol/mol or above) or poor control → structured education and glycaemic optimisation · RVVC attributable to an SGLT2 inhibitor where the benefit of continuing needs weighing with the diabetes plan.", src:"NICE NG28 · SGLT2 inhibitor SPCs"},
         {tone:"cream", h:"GP management", html:"Culture-confirmed <i>C. albicans</i> RVVC with no red flags: induction and maintenance regimen, trigger review, and a planned end-point.", src:"BASHH 2019"}
       ]},
       {b:"why", html:"Most culture-confirmed <i>C. albicans</i> RVVC is managed well in primary care. Referral is for the three groups primary care cannot resolve: a suspected cancer or scarring dermatosis (where NG12 and the vulval clinic apply and biopsy may be needed), a non-albicans or resistant organism (where the effective agents are specialist-initiated or unlicensed), and a diagnosis that is not candida at all (vulvodynia, DIV, lichen planus). In the letter, give the number of confirmed episodes, the culture and species results, the examination findings and the HbA1c."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 46-year-old on her fifth course of fluconazole this year for “thrush”. The itch is worse at night, there is no real discharge, and she says the tablets “help a bit for a few days”. She started empagliflozin for type 2 diabetes 18 months ago. On examination the vulval skin is pale and there is a fissure at the posterior fourchette.", src:"BASHH 2019 · BAD 2018"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"<b>Stops and examines rather than reissuing fluconazole</b>; recognises white atrophic skin with posterior fourchette fissuring and no discharge as lichen sclerosus, not thrush; <b>knows antifungals will not help and a potent topical steroid (clobetasol propionate 0.05%) will</b>; takes a <b>swab with speciation and an HbA1c</b> anyway; identifies the SGLT2 inhibitor as a genuine contributor and discusses it with the diabetes team rather than stopping it unilaterally; explores what she fears (infection from a partner, cancer); and — the step candidates miss — arranges lifelong vulval follow-up and explains the small (under 5%) SCC risk with the instruction to return for any new lump, ulcer or thickened area.", src:"BAD 2018 · NICE NG12 (updated April 2026)"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>BASHH — UK national guideline for the management of vulvovaginal candidiasis (2019)</b>. Saxon C et al. Int J STD AIDS 2020;31:1124–1144<br><a href="https://journals.sagepub.com/doi/10.1177/0956462420943034" rel="noopener">journals.sagepub.com</a><span class="rd"> — the RVVC definition (4 or more episodes in 12 months, laboratory confirmation), non-albicans risk factors, acute treatment, fluconazole induction (150 mg every 72 hours × 3) and weekly maintenance for 6 months, pregnancy, and specialist options for non-albicans species</span></li>'+
         '<li>Sobel JD et al. Maintenance fluconazole therapy for recurrent vulvovaginal candidiasis. <em>NEJM</em> 2004;351:876–83<span class="rd"> — the trial behind weekly maintenance: most women free of episodes during treatment, relapse common after stopping</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (2015, updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — consider a suspected cancer pathway referral for vulval cancer in a woman with an unexplained vulval lump, ulceration or bleeding</span></li>'+
         '<li><b>British Association of Dermatologists — guidelines for the management of lichen sclerosus (2018)</b><br><a href="https://www.bad.org.uk/guidelines-and-standards/clinical-guidelines/" rel="noopener">bad.org.uk</a><span class="rd"> — clobetasol propionate 0.05% on a 3-month reducing regimen, lifetime vulval SCC risk under 5%, lifelong follow-up</span></li>'+
         '<li><b>BNF — fluconazole, clotrimazole, nystatin, metronidazole, hydrocortisone, lidocaine, amitriptyline</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — avoid oral fluconazole in pregnancy; interactions; liver monitoring on extended courses; oropharyngeal candidiasis doses</span></li>'+
         '<li><b>NICE NG28 — Type 2 diabetes in adults (2015, updated)</b> and <b>NICE PH38 — Type 2 diabetes: prevention in people at high risk (2012, updated)</b><br><a href="https://www.nice.org.uk/guidance/ng28" rel="noopener">nice.org.uk/guidance/ng28</a><span class="rd"> — HbA1c 48 mmol/mol diagnostic threshold and monitoring interval; 42–47 mmol/mol as high risk</span></li>'+
         '<li><b>NICE NG3 — Diabetes in pregnancy (2015, updated)</b><br><a href="https://www.nice.org.uk/guidance/ng3" rel="noopener">nice.org.uk/guidance/ng3</a><span class="rd"> — risk-factor testing for gestational diabetes</span></li>'+
         '<li><b>SGLT2 inhibitor SPCs (dapagliflozin, empagliflozin, canagliflozin)</b><br><a href="https://www.medicines.org.uk/emc" rel="noopener">medicines.org.uk/emc</a><span class="rd"> — genital fungal infection listed as a common adverse effect</span></li>'+
         '<li><b>FDA approval of ibrexafungerp (2021)</b><span class="rd"> — US approval only; <b>not licensed in the UK</b></span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Recurrent vulvovaginal candidiasis — BASHH UK VVC guideline (2019), Sobel et al. NEJM 2004, NICE NG12 (updated April 2026), BAD lichen sclerosus guideline (2018), NICE NG28 and the BNF. Culture with speciation before committing to long-term antifungals. An unexplained vulval lump, ulcer or bleeding is a suspected cancer referral, not another prescription. Verify all doses against the current BNF before prescribing."
