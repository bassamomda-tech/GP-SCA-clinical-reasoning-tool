<script>
MG.render({
  icon:"🌸",
  title:"Recurrent thrush (RVVC) — the complete guide",
  eyebrow:"Protocol · BASHH 2019 · diagnose and manage in one place",
  stemTitle:"Recurrent vulvovaginal symptoms are not automatically recurrent thrush — examine the vulval skin and culture before committing to long-term antifungals",
  stemSub:"Recurrent VVC means at least four symptomatic episodes in 12 months, with at least two episodes microbiologically confirmed while symptomatic, including at least one positive culture. Examine the vulval skin, assess vaginal pH and obtain culture with speciation when symptoms are recurrent, atypical, persistent or treatment-resistant. Look actively for lichen sclerosus, lichen planus, dermatitis, vulvodynia, herpes, BV, trichomoniasis, atrophy, diabetes, immunosuppression and vulval neoplasia. <b>An unexplained vulval lump, ulceration or bleeding requires urgent referral rather than another antifungal prescription.</b> For confirmed recurrent <i>C. albicans</i> VVC outside pregnancy and breastfeeding, consider BASHH induction with fluconazole 150 mg every 72 hours for three doses, followed by 150 mg weekly for six months. This suppresses recurrence but does not reliably cure the underlying tendency; agree review, a stop date and a relapse plan.",
  guideline:"BASHH UK VVC guideline (2019) · NICE NG12 (updated April 2026) · BAD lichen sclerosus (2018) · IUSTI vaginal discharge (2018, revised 2023) · BNF and local formulary · NICE NG28 · NICE PH38",
  reviewed:"9 September 2026",
  nextReview:"9 March 2027",
  meta:[
    {t:"BASHH UK vulvovaginal candidiasis guideline (2019)"},
    {t:"BAD — lichen sclerosus guideline (2018)"},
    {t:"Sobel et al. NEJM 2004 — weekly fluconazole"},
    {t:"Avoid oral fluconazole in pregnancy, possible pregnancy and breastfeeding"},
    {t:"NICE NG12 (updated April 2026): vulval cancer route", tone:"tw"},
    {t:"v1.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#severe"><b>Exclude first</b><small>Vulval cancer · LS · HIV · diabetes</small></a><a href="#confirm"><b>Confirm</b><small>4+ in 12 months · speciation</small></a><a href="#assess"><b>Assess</b><small>Examine · pH · swab</small></a><a href="#workup"><b>Differential</b><small>The mimics</small></a><a href="#ladder"><b>Treat</b><small>Induction → maintenance</small></a><a href="#refer"><b>Refer</b><small>Suspected cancer · vulval clinic</small></a></div>',
  quickSub:"If you read nothing else on this page, read these six cards. Every number traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Culture before committing to long-term antifungals", html:"Recurrent “thrush” that does not respond may be lichen sclerosus or lichen planus, dermatitis, herpes, or a resistant non-albicans species. For a typical first or occasional episode, diagnose clinically with microscopy/testing according to the local pathway. For recurrent, atypical, persistent or treatment-resistant symptoms, obtain culture with speciation while symptomatic before any maintenance regimen, and request susceptibility testing when clinically indicated. Failure to improve within 7–14 days, early recurrence, persistent symptoms between episodes or repeated partial response should trigger examination and culture/speciation before further treatment."},
    {tone:"purple", h:"🟣 NICE NG12 (updated April 2026) — the vulval criterion", html:"<b>Consider a suspected cancer pathway referral (for an appointment within 2 weeks) for vulval cancer in a woman with an unexplained vulval lump, ulceration or bleeding.</b> A persistent or changing raised, pigmented, warty, thickened or ulcerated lesion requires prompt examination and specialist assessment even if it does not precisely match the NG12 wording. Do not wait for it to fail antifungal treatment — refer a suspicious lesion immediately."},
    {tone:"amber", h:"Lichen sclerosus is an important missed diagnosis", html:"Thrush: itch, thick white discharge, erythema and satellite lesions on otherwise normal skin, with a normal vaginal pH. Lichen sclerosus: intense (often nocturnal) itch, white crinkled or thickened skin in a figure-of-eight around the vulva and anus, fissuring, loss of architecture and <b>little or no discharge</b>. It needs a potent topical steroid, not an antifungal, and long-term follow-up with self-examination education — in primary or specialist care depending on diagnostic certainty, disease control and local arrangements. The lifetime vulval SCC risk is small (approximately under 5%, BAD 2018) and varies with disease control and duration."},
    {tone:"blue", h:"Two bedside tests worth five minutes", html:"Vaginal pH on narrow-range paper: candida usually occurs with a <b>pH below 4.5</b>; a pH above 4.5 makes candidiasis less likely and supports consideration of bacterial vaginosis, trichomoniasis, atrophy or inflammatory vaginitis. pH alone cannot diagnose or exclude candidiasis, and is affected by blood, semen, recent intercourse, vaginal medication and cervical mucus. Cotton-swab touch test at the vestibule when burning or pain dominates: provoked pain with normal-looking skin and negative cultures points to vulvodynia."},
    {tone:"blue", h:"Risk-based HbA1c — and a drug review", html:"Check HbA1c when VVC is recurrent, severe, refractory, associated with symptoms of hyperglycaemia or when diabetes risk has not been recently assessed; check capillary glucose and ketones urgently if acutely unwell or symptomatic. HbA1c 48 mmol/mol or above is the diagnostic threshold in an appropriate clinical context — in an asymptomatic patient confirm per the local diabetes pathway (NICE NG28); 42–47 is non-diabetic hyperglycaemia/high risk, not diabetes (NICE PH38). Genital mycotic infection is a recognised adverse effect of SGLT2 inhibitors. Also ask about recent broad-spectrum antibiotics, corticosteroids and other immunosuppression, and pregnancy."},
    {tone:"green", h:"Induction then maintenance — and say it suppresses rather than cures", html:"For culture-confirmed <i>C. albicans</i> RVVC outside pregnancy, possible pregnancy and breastfeeding (BASHH 2019), after checking interactions, renal/hepatic disease and QT risk: induction with fluconazole 150 mg every 72 hours for 3 doses, then maintenance fluconazole 150 mg once weekly for 6 months. In the trial behind it (Sobel et al., NEJM 2004) most women stayed free of symptomatic episodes during maintenance, but relapse was common once it stopped. Agree a stop date and a written relapse plan at the start."}
  ],
  pathwaySub:"The whole consultation in six moves. The red step is what stops years of misdirected treatment.",
  pathway:[
    {title:"Screen for the sinister and the underlying", html:"An unexplained vulval lump, ulcer or bleeding (NG12), white or scarred vulval skin, oral or oesophageal candida, weight loss or night sweats, symptoms of new diabetes, azole non-response, and fever with pelvic pain.", alert:true},
    {title:"Confirm it really is RVVC", html:"At least 4 symptomatic episodes in 12 months, at least 2 confirmed by microscopy or culture while symptomatic, including at least 1 positive culture (BASHH 2019). Correlate with symptoms and examination — colonisation alone does not establish causation. Request speciation, and susceptibility testing when clinically indicated."},
    {title:"Examine, test the pH, swab properly", html:"<b>Look at the vulval skin, not only the discharge</b>; vaginal pH; cotton-swab test if burning dominates; high vaginal swab while symptomatic and ideally a week after the last antifungal; risk-based HbA1c; pregnancy test before a systemic azole."},
    {title:"Work through the mimics", html:"BV, trichomoniasis, lichen sclerosus, erosive lichen planus, contact dermatitis, vulvodynia, herpes, atrophy, DIV, eczema or psoriasis, and VIN all get treated as thrush, and none responds to antifungals."},
    {title:"Treat and remove the driver", html:"Induction then 6-month maintenance for confirmed <i>C. albicans</i> outside pregnancy and breastfeeding; glycaemic control, a drug review (SGLT2 inhibitor — not stopped unilaterally, antibiotics, steroids), irritant avoidance and emollient skin care alongside."},
    {title:"Review with an end-point", html:"A review after the induction phase before continuing suppression; tolerability, breakthrough episodes, pregnancy risk and interactions during maintenance; a documented continue-or-stop decision at 6 months; an agreed plan for relapse rather than open-ended repeats."}
  ],
  sections:[

    {id:"severe", nav:"Exclude first", title:"Red flags — the diagnoses hiding behind recurrent thrush",
     sub:"Four or more episodes a year is a reason to stop and diagnose, not to reissue. Screen for these before another antifungal.",
     blocks:[
       {b:"table", head:["Presentation","Suggests","Action"], rows:[
         ["<b>Unexplained vulval lump, ulceration or bleeding</b>, or a persistent or changing raised, ulcerated, warty, pigmented or thickened lesion","<b>Vulval intraepithelial neoplasia or vulval cancer</b>","<b>Unexplained lump, ulceration or bleeding: NICE NG12 (updated April 2026) suspected cancer pathway referral</b> to gynaecology. Other persistent suspicious lesions: prompt examination and usually referral to a vulval/gynaecology/dermatology service — do not wait for antifungal failure. Do not issue a further antifungal instead"],
         ["White, thickened, crinkled or scarred vulval skin with itch and fissuring, little or no discharge","<b>Lichen sclerosus</b> (or lichen planus if eroded) — a small lifetime vulval SCC risk in lichen sclerosus (approximately under 5%, BAD 2018)","Potent topical steroid, not an antifungal; long-term follow-up; vulval clinic or dermatology if the diagnosis is uncertain or biopsy is needed. See <a href='vulvar-disorders.html'>vulvar disorders</a>"],
         ["<b>Oral candidiasis with dysphagia or odynophagia</b>","<b>Possible oesophageal candidiasis</b> — consider underlying immunosuppression, including HIV, haematological malignancy, high-dose steroids or biologics, but do not assume HIV; also severe reflux or oesophagitis, medication injury or malignancy","<b>Urgent clinical assessment</b>; HIV test where clinically indicated; specialist referral depending on the clinical condition and local pathway"],
         ["<b>Unexplained weight loss, night sweats, fatigue</b> with recurrent candida","<b>HIV or haematological disease</b>","HIV test, FBC, and review for haematological disease"],
         ["<b>Polyuria, thirst, weight loss</b>","<b>New diabetes — glycosuria favours candida</b>","HbA1c when VVC is recurrent, severe, refractory or with hyperglycaemic symptoms; capillary glucose and ketones urgently if acutely unwell or symptomatic"],
         ["<b>Failure to respond to fluconazole</b>","Non-albicans species — <i>C. glabrata</i> is often azole-resistant — or a different diagnosis","Examine, and swab for culture with speciation <b>before any further azole</b>; request susceptibility testing where available if non-albicans infection or resistance is suspected. Also consider incorrect diagnosis, adherence, irritant dermatitis from repeated treatment, lichen sclerosus or vulvodynia"],
         ["<b>Fever, pelvic pain, abnormal bleeding</b>","Pelvic inflammatory disease or another gynaecological cause, not candida","Same-day assessment"]
       ]},
       {b:"dl", rows:[
         ["<b>NICE NG12 (updated April 2026) — the criterion that applies here</b>","Consider a suspected cancer pathway referral (for an appointment within 2 weeks) for vulval cancer in a woman with an unexplained vulval lump, ulceration or bleeding. NG12 does not set a treatment-duration rule, and failure of antifungal treatment is not a prerequisite. A persistent or changing raised, pigmented, warty, thickened or ulcerated lesion — including a new or changing area on a background of lichen sclerosus — requires prompt examination and specialist assessment even if it does not precisely match the NG12 wording. <b>Do not issue a further antifungal course instead of the referral</b> — restated in <a href='#refer'>Refer</a>"]
       ]},
       {b:"why", html:"Recurrent vulvovaginal symptoms are treated empirically for months or years in some women, and the conditions that are missed are the ones that matter: lichen sclerosus and lichen planus (which scar and carry a small cancer risk), vulval intraepithelial neoplasia and vulval cancer, undiagnosed diabetes and HIV. The clinical distinction between thrush and lichen sclerosus is usually visible: candida produces discharge, erythema and satellite lesions on otherwise normal skin; lichen sclerosus produces white atrophic or thickened skin with fissuring and no significant discharge, and does not settle with an antifungal. The British Association of Dermatologists guideline (2018) quotes a small lifetime SCC risk (approximately under 5%) in genital lichen sclerosus, varying with disease control and duration, which is why the diagnosis needs making and long-term follow-up is needed."}
     ]},

    {id:"confirm", nav:"Confirm", title:"Definition, species and predisposing factors",
     sub:"The definition matters, because it is the threshold for committing someone to six months of antifungal.",
     blocks:[
       {b:"dl", rows:[
         ["<b>RVVC definition (BASHH 2019)</b>","<b>At least four symptomatic episodes in 12 months</b>, with at least two episodes confirmed by microscopy or culture while symptomatic, including at least one positive culture. Correlate the result with symptoms and examination because <i>Candida</i> colonisation alone does not establish causation. BASHH distinguishes women who respond completely between episodes from those with persistent or only partial response — the latter should prompt reconsideration of the diagnosis. Many women with recurrent “thrush” have never had a positive culture — confirm before committing to maintenance"],
         ["<b>Typical candida</b>","Vulval itch and soreness, superficial dyspareunia, external dysuria, thick white non-offensive discharge; erythema, fissuring and satellite lesions; <b>vaginal pH usually below 4.5</b> (supportive, not diagnostic)"],
         ["<b>Species</b>","<i>C. albicans</i> causes most episodes. Non-albicans species, especially <i>C. glabrata</i>, are more likely in women with type 2 diabetes and in older and postmenopausal women (BASHH 2019), and respond poorly to azoles. Isolation of a non-albicans species does not prove that it is causing symptoms: correlate with symptoms, examination and microscopy, and treat persistent symptomatic infection after specialist review rather than treating colonisation automatically. Standard susceptibility results may not reliably predict clinical response in the acidic vaginal environment. Any atypical or treatment-resistant episode → culture with speciation, and susceptibility testing when indicated"],
         ["<b>Predisposing factors</b>","Diabetes and poor glycaemic control · SGLT2 inhibitors (glycosuria; genital fungal infection is a common adverse effect in the SPCs) · recent broad-spectrum antibiotics · corticosteroids, other immunosuppression and HIV · pregnancy · irritant products that damage the vulval skin barrier · tight synthetic clothing"],
         ["<b>Severe or complicated episodes</b>","Extensive vulval erythema, oedema, excoriation or fissuring, pregnancy, poorly controlled diabetes, immunosuppression or a non-albicans species make an episode complicated: longer or repeated treatment is usually needed, and the underlying driver deserves as much attention as the organism"],
         ["<b>Pattern clues</b>","Cyclical premenstrual flares · complete resolution between episodes (true recurrence) versus never fully clearing (think again) · after antibiotics · after starting an SGLT2 inhibitor · self-diagnosis only, never confirmed"],
         ["<b>Oral thrush risk factors</b>","Inhaled corticosteroids without mouth rinsing · dentures · dry mouth · smoking · immunosuppression"]
       ]},
       {b:"why", html:"<b>The BASHH definition requires laboratory confirmation for a reason:</b> self-diagnosis of candida is unreliable, and committing someone to six months of weekly fluconazole should wait for culture proof and speciation. A negative culture while symptomatic should prompt consideration of other diagnoses, although repeated antifungal exposure can also produce false-negative cultures. Normal vaginal pH is a useful discriminator — candida does not raise it, whereas bacterial vaginosis, trichomoniasis and atrophic vaginitis do. SGLT2 inhibitors (dapagliflozin, empagliflozin, canagliflozin) deserve a specific question because their glucose-lowering mechanism is glycosuria, and genital fungal infection is one of their commonest adverse effects. For the SCA, a strong candidate states the definition, explains why confirmation matters before long-term treatment, and asks what the patient thinks is going on: many women have tried numerous over-the-counter products, and some fear a sexually transmitted cause or cancer. Naming those concerns and explaining the plan to test for them usually earns more trust than a further prescription."}
     ]},

    {id:"assess", nav:"Assess", title:"Assessment and investigations",
     sub:"The investigation that changes management most is a swab taken while symptomatic and sent for culture with speciation.",
     blocks:[
       {b:"table", head:["Element","What to do"], rows:[
         ["<b>History</b>","Number of episodes in the last year and how each was confirmed · itch versus burning versus pain · discharge character and odour · relation to menses, sex and antibiotics · response to each treatment, and whether symptoms ever fully cleared · products used on the vulva · contraception, pregnancy possibility, menopause status · diabetes, SGLT2 inhibitor, steroids, immunosuppression · sexual history and STI risk · partner symptoms such as balanitis"],
         ["<b>Examination</b>","Always examine, ideally while symptomatic. Vulval skin: erythema and satellite lesions (candida); whitening, thickening, loss of labial architecture and fissures (lichen sclerosus); erosions (lichen planus); ulcers, lumps, warty or pigmented areas (neoplasia). Speculum: discharge character, vaginal walls, cervix (normal in candida)"],
         ["<b>Bedside tests</b>","Vaginal pH: candida usually occurs with a pH below 4.5; above 4.5 makes candidiasis less likely and supports BV, trichomoniasis, atrophy or inflammatory vaginitis. pH is supportive, not diagnostic, and is affected by blood, semen, recent intercourse, vaginal medication and cervical mucus. Cotton-swab touch test of the vestibule if pain or burning dominates"],
         ["<b>Laboratory</b>","High vaginal swab for microscopy and culture <b>with speciation and sensitivities — ask for this explicitly on the form</b>, as many laboratories only speciate on request; susceptibility testing when clinically indicated (a typical first or occasional episode can be diagnosed clinically with microscopy/testing per the local pathway) · HbA1c when recurrent, severe, refractory or with hyperglycaemic symptoms · STI tests if at risk · offer an HIV test with recurrent or refractory candidiasis, oral or oesophageal candidiasis without an obvious cause, STI risk, weight loss, night sweats or recurrent infections, or a new immunosuppressive diagnosis — recurrent uncomplicated VVC is not itself evidence of HIV · pregnancy test before a systemic azole"],
         ["<b>Taking the swab</b>","From the lateral vaginal wall or posterior fornix, ideally while symptomatic and ideally at least a week after the last antifungal, which can otherwise give a false negative. State on the form: recurrent symptoms, request speciation and sensitivities"],
         ["<b>Consider</b>","FBC and ferritin if clinically suggested; vulval biopsy (via the vulval clinic or dermatology) where a dermatosis or neoplasia is possible"]
       ]},
       {b:"why", html:"A swab taken while symptomatic confirms or refutes candida, identifies non-albicans species that will not respond to fluconazole, and guides specialist therapy. Examining the vulval skin itself, rather than only the discharge, is what detects lichen sclerosus, lichen planus and neoplasia. The HbA1c is cheap and occasionally transformative. A pregnancy test is needed because oral fluconazole should be avoided in pregnancy (BNF). Where the patient is between episodes and the examination is normal, arrange to examine and swab her during the next flare, and ask her not to self-treat beforehand so that the swab can be interpreted."}
     ]},

    {id:"workup", nav:"Differential", title:"The mimics — none of these respond to an antifungal",
     sub:"Each of these is regularly treated as thrush for months or years. Recognising them is most of the clinical value on this page.",
     blocks:[
       {b:"table", head:["Diagnosis","Discriminating features","Next step"], rows:[
         ["<b>Bacterial vaginosis</b>","Thin grey-white discharge with a fishy odour, often worse after sex or menses; little itch or inflammation; <b>pH above 4.5</b>","Metronidazole 400 mg twice daily for 5–7 days, or 2 g as a single dose (BNF) — see the <a href='bacterial-vaginosis.html'>BV protocol</a>"],
         ["<b>Trichomoniasis</b>","Frothy yellow-green offensive discharge, vulvitis, pH above 4.5; sexually transmitted","Test, and refer to sexual health for treatment and partner notification — see <a href='trichomoniasis.html'>trichomoniasis</a>"],
         ["<b>Lichen sclerosus</b>","Intense itch, often nocturnal; white, crinkled or thickened skin in a figure-of-eight around the vulva and anus; purpura, fissures, loss of labia minora; little or no discharge; no lasting response to antifungals","Ultrapotent topical corticosteroid (clobetasol propionate 0.05% ointment) induction per BAD 2018, following the local dermatology/vulval service protocol with a monitoring plan; long-term follow-up and self-examination education; any new persistent lump, ulceration, induration, pigmentation or non-healing area → urgent review and possible biopsy"],
         ["<b>Erosive lichen planus</b>","Painful glazed red erosions with a white lacy edge, vaginal involvement and adhesions, often with oral lesions","Refer to a vulval clinic/dermatology/gynaecology service, particularly where there are erosions, vaginal involvement or scarring"],
         ["<b>Irritant or allergic contact dermatitis</b>","Itch and burning linked to soaps, wipes, pads, spermicides, latex or topical medicines (including repeated antifungal creams); erythema without satellite lesions; negative culture","Remove the cause; emollient soap substitute; a short course of a mild topical steroid such as hydrocortisone 1% (BNF)"],
         ["<b>Vulvodynia</b>","Burning or rawness rather than itch, provoked by touch, sex or tampons; normal-looking skin; repeatedly negative cultures; <b>positive cotton-swab test</b> at the vestibule","Stop unnecessary antifungals, perform a cotton-swab assessment, address irritants, offer supportive explanation and refer to a vulval/pelvic-floor/psychosexual service as appropriate. Pharmacological treatment (e.g. topical lidocaine or low-dose amitriptyline, off-label) should follow the local vulvodynia pathway. See <a href='vulvar-disorders.html'>vulvar disorders</a>"],
         ["<b>Genital herpes</b>","Recurrent painful blisters or ulcers in the same area, often with a prodrome","Swab for HSV PCR — see <a href='genital-herpes.html'>genital herpes</a>"],
         ["<b>Atrophic vaginitis</b>","Peri- or postmenopausal dryness, soreness and dyspareunia; pale thin mucosa; pH raised","Consider genitourinary syndrome of menopause after appropriate assessment, excluding infection and unexplained bleeding; use local menopause guidance and assess contraindications — see <a href='menopause.html'>menopause</a>"],
         ["<b>Desquamative inflammatory vaginitis (DIV)</b>","Purulent discharge, marked vaginal inflammation and dyspareunia, pH raised; many white cells and absent lactobacilli on microscopy; cause uncertain","Specialist diagnosis is usually required; do not initiate repeated empiric antibiotics or steroids based only on the pH. Treatment (usually intravaginal clindamycin or a steroid) is specialist-initiated (IUSTI 2018)"],
         ["<b>Eczema, psoriasis, intertrigo</b>","Itchy red plaques in the skin folds and on the mons, with eczema or psoriasis elsewhere (scalp, nails, elbows); candida may colonise secondarily","Treat the dermatosis; emollients"],
         ["<b>VIN or vulval cancer</b>","Persistent raised, pigmented, warty, ulcerated or thickened area, itch or bleeding","NICE NG12 (updated April 2026) route — see <a href='#severe'>red flags</a>"]
       ]},
       {b:"why", html:"Three bedside discriminators do most of the work: the pH (normal in candida; raised in BV, trichomoniasis, atrophy and DIV), the dominant symptom (itch favours candida and the dermatoses; burning or pain with normal skin favours vulvodynia), and the appearance of the skin itself (white and scarred in lichen sclerosus, eroded in lichen planus). A swab that repeatedly grows nothing while symptoms persist is itself diagnostic information: it points away from candida and towards a dermatosis, vulvodynia or an irritant cause. Repeated use of topical antifungals can itself cause irritant dermatitis, so a woman who is worse the more cream she uses may have a contact problem rather than resistant candida. The governing rule for the whole page: 4 or more courses of antifungal without sustained resolution means a vulval examination, pH, swab with speciation — and a cotton-swab test if burning dominates — before prescribing again."}
     ]},

    {id:"ladder", nav:"Treat", title:"Antifungal treatment — acute, induction and maintenance",
     blocks:[
       {b:"table", head:["Situation","Regimen"], rows:[
         ["<b>Acute episode</b>","A single oral azole or an intravaginal imidazole, with a topical imidazole cream for vulval symptoms (BASHH 2019): for example fluconazole 150 mg orally as a single dose, or clotrimazole 500 mg pessary as a single dose, with clotrimazole 1% cream externally. Avoid oral azoles in pregnancy, possible pregnancy and breastfeeding. Doses per BNF and local formulary"],
         ["<b>RVVC — induction</b>","<b>Fluconazole 150 mg every 72 hours for 3 doses</b> (BASHH 2019). <b>Confirm the diagnosis and <i>C. albicans</i> on culture first</b>; assess pregnancy, breastfeeding, interactions, renal/hepatic disease and QT risk before prescribing. Review after induction before continuing suppression"],
         ["<b>RVVC — maintenance</b>","<b>Fluconazole 150 mg once weekly for 6 months</b> (BASHH 2019, based on Sobel et al., NEJM 2004). This is a suppressive regimen, not eradication — relapse after stopping is common. Discuss pregnancy intentions and the risks of systemic azole treatment. A documented review and stop date are required. Consider baseline and follow-up liver function testing for prolonged or repeated systemic azole treatment, particularly with liver disease, interacting medicines, symptoms suggestive of hepatotoxicity or specialist-directed high-dose therapy; follow the current product information and local formulary. Persistent symptoms despite a negative post-treatment culture → reconsider the diagnosis rather than continue indefinitely"],
         ["<b>Pregnancy, possible pregnancy or breastfeeding</b>","<b>Avoid oral fluconazole</b> (BASHH 2019; BNF, following a regulatory review of miscarriage and malformation reports). Use a topical imidazole regimen (for example clotrimazole), usually for 7 days in pregnancy, per current local/BASHH guidance. <b>Do not use boric acid.</b> Avoid applicator trauma in pregnancy where appropriate. Assess recurrent symptoms for gestational diabetes according to obstetric/local guidance (NICE NG3); review persistent symptoms in pregnancy rather than repeatedly self-treating"],
         ["<b>Non-albicans or azole-resistant</b>","Do NOT keep prescribing fluconazole. Confirm the species is causing symptoms rather than colonising. Specialist options (BASHH 2019) include nystatin pessaries 100,000 units nightly for 14 nights. GUM or gynaecology initiation"],
         ["<b>Boric acid — specialist only</b>","Boric acid 600 mg vaginally for 14 days is an <b>unlicensed specialist option</b> for selected non-albicans or azole-resistant infection, used only after species confirmation and specialist discussion. <b>It must not be used in pregnancy or possible pregnancy, must never be swallowed</b>, must be kept away from children, and requires explicit counselling about toxicity and safe storage with clear written instructions. Avoid where the patient cannot safely administer or store it. Not a routine GP option"]
       ]},
       {b:"warn", html:"<b>Before prescribing fluconazole, check the BNF for interactions:</b> it inhibits the metabolism of several drugs — for example warfarin, some statins, sulfonylureas and QT-prolonging medicines. Reconcile medicines including QT-prolonging drugs and anticoagulants; renal and hepatic disease and existing QT prolongation need care. <b>Discuss pregnancy intentions and the risks of systemic azole treatment; avoid oral fluconazole in pregnancy, when pregnancy is possible but not excluded, and during breastfeeding</b> — use topical treatment instead where appropriate."},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"💊 RVVC on an SGLT2 inhibitor", html:"Treat confirmed episodes and assess whether the infection pattern began or worsened after starting an SGLT2 inhibitor — genital candidiasis is not necessarily caused by the drug alone. <b>Do not stop the drug unilaterally, particularly where it is prescribed for heart failure or CKD.</b> Do not prescribe indefinite antifungal cover without confirming the diagnosis. If recurrent infection remains troublesome, discuss the risk–benefit of continuation with the prescribing specialist (diabetes/renal/cardiology) and patient, in line with the local diabetes pathway.", src:"SGLT2 inhibitor SPCs · BASHH 2019"},
         {tone:"cream", h:"💠 Hormonal pattern", html:"If symptoms show a consistent cyclical pattern or began after a contraceptive change, discuss this as part of shared decision-making — the evidence is limited. Do not change effective contraception solely because of recurrent symptoms without a clear temporal relationship and patient preference.", src:"BASHH 2019 — predisposing factors"},
         {tone:"green", h:"🌬️ Oral thrush on an inhaled corticosteroid", html:"Check inhaler technique, use a spacer with a metered-dose inhaler, and rinse and spit after each dose. Active infection: nystatin oral suspension 100,000 units four times daily for 7 days (continue for 48 hours after lesions resolve), or fluconazole 50 mg daily for 7–14 days.", src:"BNF — oropharyngeal candidiasis"},
         {tone:"amber", h:"🤰 Pregnancy, possible pregnancy or breastfeeding", html:"Avoid oral fluconazole; use a topical imidazole regimen, usually for 7 days in pregnancy, and follow the current local/BASHH guidance. Do not use boric acid. Avoid applicator trauma in pregnancy where appropriate; assess recurrent symptoms for gestational diabetes per obstetric/local guidance; review persistent symptoms rather than repeatedly self-treating.", src:"BASHH 2019 · BNF · NICE NG3"},
         {tone:"amber", h:"🛡️ Immunosuppressed", html:"Steroids, biologics, chemotherapy or HIV: involve the specialist team, consider non-albicans species early, and treat promptly. Antifungal prophylaxis in profound immunosuppression is a specialist decision.", src:"BASHH 2019"}
       ]},
       {b:"why", html:"The induction-then-maintenance regimen is the BASHH 2019 recommendation, based on Sobel et al. (NEJM 2004), in which weekly fluconazole kept most women free of symptomatic episodes during the 6-month treatment period, but relapse was common once it stopped. That is why the counselling matters as much as the prescription: maintenance suppresses rather than cures. Oral fluconazole should be avoided in pregnancy, possible pregnancy and breastfeeding, so discuss pregnancy intentions before a six-month weekly course. Refer azole-refractory or non-albicans RVVC to GUM or gynaecology rather than continuing ineffective fluconazole."}
     ]},

    {id:"lifestyle", nav:"Prevention", title:"Vulval skin care and trigger avoidance",
     sub:"These run alongside maintenance, not after it — irritant damage both mimics candida and makes it more likely to recur.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"🧼 Soap substitute", html:"Wash the vulva with water or a plain emollient — no soap, shower gel, bubble bath, intimate wash or wipes. Pat dry. A bland emollient can also be used as a barrier for soreness; avoid over-washing.", src:"BASHH 2019 — general advice"},
         {tone:"amber", h:"🚫 No douching", html:"Vaginal douching disrupts the normal flora and is not recommended — including commercial products, bicarbonate, vinegar or essential oils.", src:"BASHH 2019 — general advice"},
         {tone:"cream", h:"💊 Antibiotic-triggered episodes", html:"Avoid unnecessary antibiotics. If episodes are reproducibly antibiotic-associated, discuss a documented individual plan after confirming the diagnosis; avoid automatic prophylactic antifungal prescribing (diagnostic uncertainty, unnecessary exposure, interactions, pregnancy risk, resistance, masking of dermatitis).", src:"BASHH 2019 — predisposing factors"},
         {tone:"green", h:"🩸 Glycaemic control", html:"Improve glycaemic control and recheck HbA1c; each RVVC episode is a prompt to review the diabetes plan, including the SGLT2 inhibitor question.", src:"NICE NG28"},
         {tone:"cream", h:"🦠 Probiotics", html:"Oral and vaginal lactobacillus and lactic-acid products are widely sold. Evidence for probiotics, lactic-acid products and other microbiome treatments is insufficient for routine recommendation. They should not replace diagnostic confirmation or antifungal treatment.", src:"BASHH 2019"},
         {tone:"green", h:"👕 Clothing, exercise and products", html:"Loose cotton underwear and breathable fabrics; shower and change promptly after swimming or exercise. Avoid perfumed pads and liners, spermicides and flavoured or sugary lubricants; use a plain water-based lubricant, and pause intercourse while the vulva is fissured or raw.", src:"BASHH 2019 — general advice"},
         {tone:"cream", h:"👥 Partners", html:"A partner with symptoms (for example balanitis) should be assessed and treated. Routine treatment of an asymptomatic partner is not usually needed.", src:"BASHH 2019"},
         {tone:"blue", h:"🔎 Pain between flares", html:"Pain that persists between flares with a normal-looking vulva is a cue to reconsider vulvodynia rather than candida — do the cotton-swab test.", src:"BASHH 2019 · BAD vulval guidance"}
       ]}
     ]},

    {id:"monitor", nav:"Follow-up", title:"Follow-up and safety-netting",
     blocks:[
       {b:"table", head:["When","What"], rows:[
         ["<b>Before the next prescription</b>","If an episode has not been confirmed on culture, or the diagnosis has not been reviewed after four or more episodes a year, examine and swab before prescribing again"],
         ["<b>Before starting maintenance</b>","Document pregnancy status and the contraception/pregnancy-intention discussion; medicine reconciliation including QT-prolonging drugs and anticoagulants; renal and hepatic considerations"],
         ["<b>After the induction phase</b>","Review response before continuing suppression"],
         ["<b>During maintenance</b>","Tolerability, breakthrough episodes, pregnancy risk and interacting medicines; consider baseline and follow-up liver function for prolonged or repeated systemic azole treatment, particularly with liver disease, interacting medicines or symptoms of hepatotoxicity (product information, local formulary). Symptoms recurring during maintenance → examine and culture with speciation and susceptibility rather than escalating empirically. Advise against indefinite self-treatment with over-the-counter antifungals"],
         ["<b>At 6 months</b>","A documented continue-or-stop decision with the rationale recorded"],
         ["<b>After stopping maintenance</b>","Relapse is common: agree what to do — repeat swab while symptomatic, restart if confirmed — rather than open-ended repeats. Culture before restarting if there are atypical features; seek specialist advice if she relapses after a second course"],
         ["<b>Lichen sclerosus</b>","Long-term follow-up and self-examination education, in primary or specialist care depending on diagnostic certainty, disease control and local arrangements; any new persistent lump, ulceration, induration, pigmentation or non-healing area → urgent review and the NG12 route"],
         ["<b>Diabetes</b>","HbA1c every 3–6 months until stable, then 6-monthly (NICE NG28); each thrush episode is a glycaemia review trigger"],
         ["<b>No improvement 7–14 days after treatment</b>","Swab for culture with speciation (non-albicans?). New atypical symptoms — burning without discharge, white skin → vulval examination, pH test, and reconsider the diagnosis"],
         ["<b>Documentation</b>","Record the number of confirmed episodes, culture and species results, examination findings (including the vulval skin), HbA1c and the agreed stop date — the next clinician needs these to avoid starting the cycle again"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 Seek help urgently", html:"Painful or difficult swallowing with oral thrush → urgent clinical assessment · a vulval lump, sore or bleeding that does not heal → suspected cancer route · fever with pelvic pain → PID, same-day assessment.", src:"NICE NG12 (updated April 2026) · BASHH 2019"},
         {tone:"amber", h:"🟠 Book a review", html:"No improvement 7–14 days after correct treatment, burning or pain without discharge, or skin that looks white or thickened — reconsider: non-albicans candida (culture and speciation), BV (pH), lichen sclerosus (steroid, not antifungal), contact dermatitis (remove the product), vulvodynia (cotton-swab test with normal cultures).", src:"BASHH 2019 · BAD 2018"},
         {tone:"blue", h:"🔁 Before the next prescription", html:"4 or more courses of antifungal without sustained resolution = full diagnostic review. Document that process clearly.", src:"BASHH 2019 — RVVC definition"},
         {tone:"green", h:"💬 Set the expectation", html:"Counsel that maintenance suppresses rather than cures, and that relapse after stopping is common — agree the relapse plan at the start.", src:"Sobel et al., NEJM 2004"}
       ]},
       {b:"say", html:"Before I give you another antifungal, I want to be sure this is thrush — because when it keeps coming back and the treatment only half works, it often turns out to be something else that looks similar. So today I want a swab that also tells us which type of yeast it is, a blood test for diabetes, and a proper look at the skin. If it is ordinary thrush, there is a good regimen: three doses to clear it, then one tablet a week for six months, which keeps most people clear while they are taking it. I'll be honest that it suppresses rather than cures — it often comes back after stopping — so we'll agree now what to do if it does, and talk about the things that reduce the triggers."},
       {b:"why", html:"Safety-netting in RVVC is mostly about preventing drift into years of unexamined empirical treatment. A clear rule helps: no further prescription without examination and culture once a woman meets the recurrence definition. A planned end-point for maintenance, with a written plan for relapse, keeps the regimen purposeful. The urgent return criteria cover the diagnoses that must not be missed: oesophageal candidiasis, vulval neoplasia and pelvic infection. Women who have been told repeatedly that they have thrush are often relieved rather than disappointed when someone looks for another explanation."}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways",
     blocks:[
       {b:"cards", items:[
         {tone:"purple", h:"Suspected cancer · NICE NG12 (updated April 2026)", html:"<b>Unexplained vulval lump, ulceration or bleeding → consider a suspected cancer pathway referral (for an appointment within 2 weeks) for vulval cancer</b>, to gynaecology. A persistent or changing raised, pigmented, warty, thickened or ulcerated lesion, including a new or changing area on a background of lichen sclerosus, requires prompt examination and specialist assessment even if it does not precisely match the NG12 wording — without waiting for antifungal failure.", src:"NICE NG12 (updated April 2026)"},
         {tone:"red", h:"Urgent / same day", html:"Oral candidiasis with dysphagia or odynophagia → urgent clinical assessment; consider oesophageal candidiasis and immunosuppression, with an HIV test where clinically indicated and specialist referral depending on the clinical condition and local pathway. Fever with pelvic pain → same-day assessment.", src:"BASHH 2019"},
         {tone:"amber", h:"Vulval clinic / gynaecology / dermatology", html:"Suspected lichen sclerosus needing confirmation or not responding to treatment · erosive lichen planus, particularly with erosions, vaginal involvement or scarring · vulvodynia · desquamative inflammatory vaginitis · RVVC not controlled on a maintenance regimen.", src:"BAD 2018 · BASHH 2019"},
         {tone:"blue", h:"Sexual health (GUM)", html:"Non-albicans or azole-resistant candida needing specialist agents · positive STI tests · newly diagnosed HIV · complex or immunosuppressed patients.", src:"BASHH 2019"},
         {tone:"green", h:"Diabetes team", html:"New diabetes (HbA1c 48 mmol/mol or above) or poor control → structured education and glycaemic optimisation · RVVC attributable to an SGLT2 inhibitor where the benefit of continuing needs weighing with the diabetes plan.", src:"NICE NG28 · SGLT2 inhibitor SPCs"},
         {tone:"cream", h:"GP management", html:"Culture-confirmed <i>C. albicans</i> RVVC with no red flags, outside pregnancy and breastfeeding: induction and maintenance regimen, trigger review, a planned end-point and a relapse plan.", src:"BASHH 2019"}
       ]},
       {b:"why", html:"Most culture-confirmed <i>C. albicans</i> RVVC is managed well in primary care. Referral is for the three groups primary care cannot resolve: a suspected cancer or scarring dermatosis (where NG12 and the vulval clinic apply and biopsy may be needed), a non-albicans or resistant organism (where the effective agents are specialist-initiated or unlicensed), and a diagnosis that is not candida at all (vulvodynia, DIV, lichen planus). In the letter, give the number of confirmed episodes, the culture and species results, the examination findings and the HbA1c."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 46-year-old on her fifth course of fluconazole this year for “thrush”. The itch is worse at night, there is no real discharge, and she says the tablets “help a bit for a few days”. She started empagliflozin for type 2 diabetes 18 months ago. On examination the vulval skin is pale and there is a fissure at the posterior fourchette.", src:"BASHH 2019 · BAD 2018"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"<b>Stops and examines rather than reissuing fluconazole</b>; recognises white atrophic skin with posterior fourchette fissuring and no discharge as lichen sclerosus, not thrush; <b>knows antifungals will not help and a potent topical steroid (clobetasol propionate 0.05%) will</b>; takes a <b>swab with speciation and an HbA1c</b> anyway; identifies the SGLT2 inhibitor as a genuine contributor and discusses it with the diabetes team rather than stopping it unilaterally; explores what she fears (infection from a partner, cancer); and — the step candidates miss — arranges long-term vulval follow-up (primary or specialist care) and explains the small (approximately under 5%) SCC risk with the instruction to return for any new lump, ulcer or thickened area.", src:"BAD 2018 · NICE NG12 (updated April 2026)"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>BASHH — UK national guideline for the management of vulvovaginal candidiasis (2019)</b>. Saxon C et al. Int J STD AIDS 2020;31:1124–1144<br><a href="https://journals.sagepub.com/doi/10.1177/0956462420943034" rel="noopener">journals.sagepub.com</a> · <a href="https://www.bashh.org" rel="noopener">bashh.org</a><span class="rd"> — the RVVC definition (at least 4 episodes in 12 months, at least 2 confirmed while symptomatic including at least 1 positive culture), microscopy for acute VVC and culture for recurrent or atypical disease, avoiding oral therapy in pregnancy and breastfeeding, non-albicans risk factors, acute treatment, fluconazole induction (150 mg every 72 hours × 3) and weekly maintenance for 6 months, pregnancy, and specialist options for non-albicans species</span></li>'+
         '<li>Sobel JD et al. Maintenance fluconazole therapy for recurrent vulvovaginal candidiasis. <em>NEJM</em> 2004;351:876–83<span class="rd"> — the trial behind weekly maintenance: most women free of episodes during treatment, relapse common after stopping</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (2015, updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — consider a suspected cancer pathway referral for vulval cancer in a woman with an unexplained vulval lump, ulceration or bleeding</span></li>'+
         '<li><b>British Association of Dermatologists — guidelines for the management of lichen sclerosus (2018)</b><br><a href="https://www.bad.org.uk/guidelines-and-standards/clinical-guidelines/" rel="noopener">bad.org.uk</a><span class="rd"> — ultrapotent topical corticosteroid induction (clobetasol propionate 0.05%), a small lifetime vulval SCC risk (approximately under 5%, varying with disease control and duration), long-term follow-up</span></li>'+
         '<li><b>IUSTI Europe guideline for vaginal discharge (2018, minor revision 2023)</b><span class="rd"> — aerobic vaginitis and desquamative inflammatory vaginitis: specialist diagnosis and treatment</span></li>'+
         '<li><b>BNF — fluconazole, clotrimazole, nystatin, metronidazole, hydrocortisone, lidocaine, amitriptyline</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — avoid oral fluconazole in pregnancy; interactions; liver monitoring on extended courses; oropharyngeal candidiasis doses. Use alongside the current local formulary (Greater Manchester: <a href="https://gmmmg.nhs.uk" rel="noopener">gmmmg.nhs.uk</a>) and the relevant product information for fluconazole, clotrimazole, nystatin, boric acid, metronidazole and topical corticosteroids</span></li>'+
         '<li><b>NICE NG28 — Type 2 diabetes in adults (2015, updated)</b> and <b>NICE PH38 — Type 2 diabetes: prevention in people at high risk (2012, updated)</b><br><a href="https://www.nice.org.uk/guidance/ng28" rel="noopener">nice.org.uk/guidance/ng28</a><span class="rd"> — HbA1c 48 mmol/mol diagnostic threshold and monitoring interval; 42–47 mmol/mol as high risk</span></li>'+
         '<li><b>NICE NG3 — Diabetes in pregnancy (2015, updated)</b><br><a href="https://www.nice.org.uk/guidance/ng3" rel="noopener">nice.org.uk/guidance/ng3</a><span class="rd"> — risk-factor testing for gestational diabetes</span></li>'+
         '<li><b>SGLT2 inhibitor product information (dapagliflozin, empagliflozin, canagliflozin)</b><br><a href="https://bnf.nice.org.uk/drugs/dapagliflozin/" rel="noopener">dapagliflozin</a> · <a href="https://bnf.nice.org.uk/drugs/empagliflozin/" rel="noopener">empagliflozin</a> · <a href="https://bnf.nice.org.uk/drugs/canagliflozin/" rel="noopener">canagliflozin</a> (BNF; individual SPCs on medicines.org.uk/emc)<span class="rd"> — genital mycotic infection listed as a recognised adverse effect; continuation decisions aligned with the local diabetes pathway</span></li>'+

         '</ul></div>'}
     ]}
  ],
  foot:"Recurrent vulvovaginal candidiasis — BASHH UK VVC guideline (2019), Sobel et al. NEJM 2004, NICE NG12 (updated April 2026), BAD lichen sclerosus guideline (2018), NICE NG28 and the BNF. Recurrent vulvovaginal symptoms are not automatically recurrent thrush: examine the vulval skin and culture with speciation before committing to long-term antifungals. Avoid oral fluconazole in pregnancy, possible pregnancy and breastfeeding; boric acid is specialist-only and never in pregnancy. An unexplained vulval lump, ulcer or bleeding is a suspected cancer referral, not another prescription. Verify all doses against the current BNF before prescribing."
});
