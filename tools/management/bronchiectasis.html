<script>
MG.render({
  icon:"🫁",
  title:"Bronchiectasis — the complete guide",
  eyebrow:"Protocol · BTS · NICE NG117 · daily airway clearance is the cornerstone of stable disease",
  stemTitle:"Daily airway clearance is the cornerstone of stable bronchiectasis management; antibiotics are used promptly for clinically significant exacerbations — and a common primary-care error is treating an exacerbation like an ordinary chest infection",
  stemSub:"One page for established disease under shared care. Bronchiectasis is a self-perpetuating cycle of impaired mucus clearance → infection → inflammation → further airway damage, so <b>daily airway clearance is the single most important ongoing treatment</b> and adherence to it is worth checking at every review. An exacerbation is <b>a sustained worsening from the patient's stable state</b> — usually increased cough, sputum volume or purulence, sputum viscosity, breathlessness, wheeze, haemoptysis, pleurisy or systemic upset; sputum colour alone does not prove bacterial infection. Exacerbations need <b>sputum sent before antibiotics where possible (without delaying treatment if significantly unwell) and a 7–14-day course</b> guided by severity, previous microbiology and response. Then the two findings that need specialist input — <b>Pseudomonas aeruginosa</b> and <b>non-tuberculous mycobacteria</b>.",
  guideline:"BTS guideline for bronchiectasis in adults (2019) · NICE NG117 (2018)",
  reviewed:"14 September 2026",
  nextReview:"14 March 2027",
  meta:[
    {t:"British Thoracic Society — bronchiectasis guideline"},
    {t:"BTS 2019 · NICE NG117 — bronchiectasis"},
    {t:"Exacerbation course 7–14 days, culture-guided", tone:"tw"},
    {t:"Exclude active NTM before long-term macrolide", tone:"tw"},
    {t:"Local: GM Antimicrobial Guidelines · GM azithromycin guidance"},
    {t:"v2.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#confirm"><b>Confirm</b><small>CT · find the cause</small></a><a href="#clearance"><b>Clearance</b><small>The cornerstone</small></a><a href="#exacerbation"><b>Exacerbation</b><small>Sputum first · 7–14 days</small></a><a href="#monitor"><b>Monitor</b><small>Frequency · organism</small></a><a href="#refer"><b>Refer</b><small>Pseudomonas · ≥3/year</small></a></div>',
  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"green", h:"Daily airway clearance is the most important treatment", html:"Refer to a respiratory physiotherapist for assessment and instruction in an individualised airway-clearance technique, such as active cycle of breathing techniques or an oscillating positive expiratory pressure device, continued DAILY when clinically stable. A device is not automatically required — technique, preference, sputum burden and adherence matter more. <b>Adherence is the first thing to check when someone deteriorates</b>, before any escalation of drugs."},
    {tone:"red", h:"⚠ Send sputum before antibiotics where possible", html:"Obtain a sputum sample before the first antibiotic dose whenever possible, but do not delay antibiotics if the patient is significantly unwell. Start empirically using the most recent culture and susceptibility results and local guidance, then review when the new result is available. Prescribe for 7–14 days according to severity of bronchiectasis and of the exacerbation, previous microbiology, exacerbation history and response — 14 days for more severe disease, poor response or Pseudomonas; shorter courses may be sufficient in mild disease."},
    {tone:"amber", h:"Pseudomonas changes the prognosis and the plan", html:"<b>Chronic Pseudomonas infection is associated with worse outcomes</b> — though a positive culture does not by itself establish active infection. New isolation should trigger respiratory specialist review; eradication may be offered, particularly with clinical deterioration, and if clinically stable eradication versus observation is discussed with the specialist. Base treatment on susceptibility and microbiology advice, and apply MHRA fluoroquinolone restrictions with safety counselling."},
    {tone:"red", h:"⛔ Exclude active NTM pulmonary disease before any long-term macrolide", html:"Azithromycin monotherapy in undiagnosed NTM infection drives macrolide resistance and compromises later treatment. Mycobacterial cultures per the local respiratory/microbiology pathway (one negative sample does not universally exclude NTM), plus ECG/QTc, LFTs, interaction review and hearing/balance assessment, before a prophylactic macrolide is started — which is a specialist decision, not a primary-care one. If NTM is identified or suspected, seek specialist advice; do not start macrolide monotherapy."},
    {tone:"blue", h:"Find the cause — some are treatable", html:"Post-infective, immunodeficiency, ABPA, cystic fibrosis, primary ciliary dyskinesia, aspiration, and rheumatoid- or IBD-associated disease. Baseline: chest X-ray, thin-section CT, immunoglobulins (IgG, IgA, IgM), ABPA screen (total IgE and Aspergillus sensitisation), sputum culture and susceptibility, mycobacterial cultures where indicated, and spirometry. Identifying a treatable cause changes management, so \"idiopathic\" should be a conclusion, not a default."},
    {tone:"green", h:"Prevention: vaccines, rehab, and treating the cause", html:"Annual influenza, pneumococcal and COVID-19 vaccination · pulmonary rehabilitation where breathlessness limits activity · smoking cessation and avoiding respiratory irritants · adequate hydration · nutrition maintained. Do not routinely prescribe inhaled or oral corticosteroids or DNase solely for bronchiectasis. Three or more antibiotic-treated exacerbations a year should prompt respiratory referral — optimise non-antibiotic measures first."}
  ],
  pathwaySub:"Five steps. The second is the treatment; the third is where it goes wrong.",
  pathway:[
    {title:"Confirm the diagnosis and find the cause", html:"Chronic productive cough with recurrent infections: chest X-ray, then thin-section CT showing airway dilatation. Then work the cause list structurally and take baseline sputum, spirometry, immunoglobulins and ABPA screen."},
    {title:"Establish daily airway clearance", html:"Respiratory physiotherapy referral, a technique the patient can actually perform, and the expectation that it continues when they feel well.", alert:true},
    {title:"Treat exacerbations properly", html:"Sputum before antibiotics where possible, empirical start from previous cultures and local guidance, change only if resistant and not improving, 7–14 days. <b>Give known patients a self-management or rescue plan.</b>"},
    {title:"Vaccinate, rehabilitate, treat the cause and comorbidities", html:"Influenza, pneumococcal and COVID-19; pulmonary rehab; smoking cessation; nutrition."},
    {title:"Monitor frequency, organism and function", html:"Exacerbations per year, sputum organism and resistance, spirometry trend and clearance adherence — with ≥3 antibiotic-treated exacerbations a year triggering respiratory referral, not automatic prophylaxis."}
  ],
  sections:[

    {id:"confirm", nav:"Confirm", title:"Step 1 — confirm the diagnosis and identify the cause",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>Diagnosis</b>","Chronic productive cough with recurrent infections. Chest X-ray as an initial investigation when bronchiectasis is suspected; confirm with thin-section CT chest showing airway dilatation"],
         ["<b>Find a cause</b>","Structured search for an underlying cause rather than defaulting to idiopathic: post-infective · immunodeficiency · ABPA · aspiration/reflux · rheumatoid- or IBD-associated · cystic fibrosis testing if supportive features (early onset, upper-lobe disease, malabsorption, infertility, family history) · primary ciliary dyskinesia assessment if supportive features (chronic sinusitis, otitis, infertility, childhood respiratory disease)"],
         ["<b>Baseline investigations</b>","FBC, renal and liver function where clinically indicated · serum immunoglobulins (IgG, IgA, IgM) · ABPA assessment (total IgE and Aspergillus sensitisation per the respiratory pathway) · baseline sputum culture and susceptibility, including Pseudomonas aeruginosa · spirometry. Obtain routine bacterial sputum culture in stable disease and during exacerbations where sputum is available. Obtain mycobacterial cultures according to the respiratory pathway and before starting long-term macrolide therapy; do not treat a single NTM isolate as equivalent to active NTM pulmonary disease"],
         ["<b>Define an exacerbation</b>","A sustained worsening from the patient's stable state, usually involving increased cough, sputum volume or purulence, sputum viscosity, breathlessness, wheeze, haemoptysis, pleurisy or systemic upset. Do not suggest that sputum colour alone proves bacterial infection"],
         ["<b>Assess severity</b>","Symptoms, exacerbation frequency, functional status, sputum volume and purulence, breathlessness, and which organisms are present"]
       ]},
       {b:"why", html:"Bronchiectasis is a self-perpetuating cycle: impaired mucus clearance leads to infection, which drives inflammation, which causes further airway damage and worse clearance. That is why daily airway clearance is the cornerstone rather than an adjunct, and why clinically significant exacerbations need culture-guided courses of 7–14 days rather than the five days a simple chest infection gets. Identifying a treatable cause and detecting Pseudomonas both change management materially."}
     ]},

    {id:"clearance", nav:"Clearance", title:"Step 2 — airway clearance and prevention: the non-drug cornerstone",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"🌬️ Airway clearance — daily", html:"<b>Refer to a respiratory physiotherapist for assessment and instruction in an airway-clearance technique, such as active cycle of breathing techniques or an oscillating positive expiratory pressure device.</b> Individualise the technique and continue it when clinically stable. Sessions are commonly around 10–30 minutes, tailored to the patient. Reassess with respiratory physiotherapy within approximately three months of teaching; review technique and adherence if symptoms or exacerbations increase. Use caution with postural drainage in reflux, aspiration risk or severe breathlessness, and review the plan if haemoptysis is ongoing or significant. A device is not automatically required."},
         {tone:"green", h:"💉 Vaccination", html:"<b>Annual influenza, pneumococcal and COVID-19.</b>"},
         {tone:"blue", h:"🏃 Pulmonary rehabilitation", html:"<b>For those whose breathlessness limits activity.</b>"},
         {tone:"amber", h:"🚭 Smoking and irritants", html:"<b>Cessation support; avoid respiratory irritants.</b>"},
         {tone:"blue", h:"💧 Hydration and mucoactives", html:"Adequate hydration; humidification or mucoactive agents on specialist advice."},
         {tone:"green", h:"🍽️ Nutrition and comorbidity", html:"<b>Maintain nutrition; treat the underlying cause and any comorbidities</b> — asthma, COPD, ABPA, reflux/aspiration, immunodeficiency."},
         {tone:"red", h:"⛔ Do not use routinely", html:"<b>Do not routinely use recombinant human DNase in adults with non-CF bronchiectasis.</b> Do not use inhaled corticosteroids solely for bronchiectasis — prescribe only for another indication such as asthma, COPD or ABPA. Do not use oral corticosteroids solely for bronchiectasis."}
       ]}
     ]},

    {id:"exacerbation", nav:"Exacerbation", title:"Step 3 — exacerbations and maintenance antibiotics",
     blocks:[
       {b:"table", head:["Situation","Treatment","Detail"], rows:[
         ["<b>Exacerbation</b>","<b>Culture-guided antibiotics for 7–14 days</b>","Assess severity, oxygenation, sepsis risk and alternative diagnoses such as pneumonia. Obtain sputum before the first dose whenever possible, but do not delay antibiotics if significantly unwell. Start empirically using the most recent culture and the local GM antimicrobial guideline; change only if the organism is resistant and the patient is not improving, using a narrow-spectrum antibiotic where possible. Duration by severity of disease and exacerbation, previous microbiology, exacerbation history and response — 14 days for more severe disease, poor response or Pseudomonas; shorter may suffice in mild disease. Give known patients a self-management or rescue plan"],
         ["<b>Pseudomonas isolated</b>","<b>Discuss with respiratory/microbiology — treatment based on susceptibility</b>","<b>New isolation should trigger respiratory specialist review.</b> Eradication may be offered, particularly with clinical deterioration; if clinically stable, discuss benefits and harms of eradication versus observation with the specialist. Oral ciprofloxacin is a possible first-line eradication regimen, with IV and inhaled options in selected cases — all specialist-directed, with post-treatment sputum to confirm eradication. Check renal function and interactions. Do not use routine empirical amoxicillin. Do not use colonisation and infection interchangeably"],
         ["<b>Frequent exacerbations — 3 or more a year</b>","First optimise airway clearance, vaccination, pulmonary rehabilitation, smoking cessation, comorbidity management and treatment of the underlying cause. Seek respiratory specialist advice regarding prophylaxis — do not routinely offer it, and only start a trial of oral or inhaled prophylaxis on specialist advice. Specialist-directed regimens include azithromycin 250 mg three times weekly as a pragmatic starting dose, with escalation if clinically required and tolerated; other BTS-supported regimens are 500 mg three times weekly or 250 mg daily (generally unlicensed; follow specialist/local protocol)","Initiation by, or on the advice of, a respiratory specialist (GM azithromycin guidance) — not a GP initiation. Lower thresholds may be considered in severe disease, hospitalisations, persistent symptoms between exacerbations or immunosuppression. Discuss resistance, adverse effects, interactions and the need for review"],
         ["<b>Other situations</b>","<b>Severe systemic illness, hypoxia, respiratory failure or suspected sepsis</b> → same-day hospital assessment","<b>Resistant organism or failure of oral treatment</b> → specialist/microbiology advice. <b>No improvement or deterioration</b> → reassess diagnosis, adherence, airway clearance, complications and need for hospital/specialist care"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"red", h:"⚠ Fluoroquinolone safety (MHRA)", html:"Fluoroquinolones should only be prescribed when other commonly recommended antibiotics are inappropriate. Discuss the risk of disabling and potentially long-lasting or irreversible adverse effects, including tendinopathy or tendon rupture, neuropathy, musculoskeletal symptoms and neuropsychiatric effects. Stop treatment and seek advice immediately if serious adverse effects develop. Take particular care in older adults, renal impairment, people on corticosteroids and those with previous quinolone-related adverse effects. Base on susceptibility wherever possible, with specialist or microbiology advice, and check renal function and interactions."},
         {tone:"amber", h:"Before long-term azithromycin", html:"Documented baseline exacerbation rate · stable sputum culture · mycobacterial assessment (avoid macrolide exposure before NTM sampling where clinically appropriate) · ECG and QTc — <b>QTc &gt;450 ms in men or &gt;470 ms in women contraindicates initiation</b> · baseline LFTs · medication-interaction review · hearing and balance assessment · discuss diarrhoea, hearing loss/tinnitus, vestibular symptoms, hepatotoxicity, QT prolongation and antimicrobial resistance. Monitor: repeat ECG at one month; LFTs at one month then six-monthly; review benefit, toxicity and ongoing need at least six-monthly."}
       ]},
       {b:"warn", html:"Do not under-treat a clinically significant exacerbation — use 7–14 days with culture guidance. Chronic Pseudomonas infection worsens prognosis and new isolation warrants specialist review. And exclude active NTM pulmonary disease before starting long-term macrolide monotherapy, because azithromycin monotherapy in undiagnosed NTM drives resistance and compromises the treatment the patient will later need."}
     ]},

    {id:"monitor", nav:"Monitor", title:"Step 4 — monitoring and review",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["<b>Exacerbations and antibiotic courses</b>","<b>Each review</b>","<b>Include hospital admissions and IV courses; 3 or more antibiotic-treated a year → respiratory referral</b>"],
         ["<b>Symptoms and function</b>","<b>Each review</b>","Sputum volume, purulence and haemoptysis · breathlessness and exercise limitation · pulmonary rehabilitation eligibility"],
         ["<b>Risk factors and general health</b>","<b>Each review</b>","Smoking status and irritant exposure · vaccination status · nutritional status and weight · relevant comorbidity and underlying cause · current organism and resistance pattern"],
         ["<b>Sputum culture</b>","<b>With exacerbations and at least annually if able to expectorate</b>","<b>Guides antibiotics; detects Pseudomonas; mycobacterial cultures per the respiratory pathway</b>"],
         ["<b>Spirometry, oxygen saturation and function</b>","<b>At least annually, if available and clinically appropriate</b>","<b>Track decline; reassess management</b>"],
         ["<b>Long-term antibiotics</b>","<b>At least six-monthly</b>","Review benefit and toxicity (ECG, LFTs, hearing/balance) and the respiratory specialist management plan"],
         ["<b>Airway clearance adherence</b>","<b>Each review</b>","Reinforce — it is the key ongoing therapy and the first thing to check when control slips"]
       ]},
       {b:"dl", rows:[
         ["<b>After diagnosis</b>","Establish care: airway clearance and physiotherapy, vaccinations, a self-management plan, and treatment of the underlying cause"],
         ["<b>With exacerbations</b>","<b>Prompt sputum-guided antibiotics for 7–14 days; reassess if rapid deterioration, no improvement, recurrent failure or inability to take oral treatment</b>"],
         ["<b>Annually and ongoing</b>","Structured bronchiectasis review: exacerbation frequency, sputum culture and organism, spirometry, oxygen saturation and function, adherence, comorbidity, the specialist management plan and long-term antibiotic benefit and toxicity. Patients with Pseudomonas, NTM, MRSA, immunodeficiency, ABPA, rheumatoid arthritis, primary ciliary dyskinesia, progressive disease or long-term antibiotics should remain under respiratory-led follow-up"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 Massive haemoptysis", html:"<b>\"Coughing up a large amount of blood — call 999.\"</b> Smaller-volume recurrent haemoptysis also needs clinical assessment, particularly if increasing or with breathlessness."},
         {tone:"amber", h:"🟠 Exacerbation", html:"\"More or discoloured phlegm, more breathless, or feeling unwell — contact us early. You will likely need a phlegm sample and a 7–14-day antibiotic course.\""},
         {tone:"green", h:"🌬️ Clearance", html:"\"Daily breathing and clearance exercises are the most important treatment — keep them up even when you feel well.\""},
         {tone:"green", h:"💉 Vaccines", html:"\"Keep your flu, pneumonia and COVID vaccines up to date — they reduce infections.\""}
       ]}
     ]},

    {id:"troubleshoot", nav:"Frequent flares?", title:"Frequent exacerbations or declining? Check this first",
     sub:"Optimise the basics and identify the organism before escalating.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"1 · Airway clearance", html:"<b>Is daily physiotherapy actually being done?</b> Ask specifically how and how often, not whether."},
         {tone:"amber", h:"2 · Organism", html:"<b>Sputum culture — is Pseudomonas or NTM driving the exacerbations?</b>"},
         {tone:"amber", h:"3 · Course length", html:"Were the exacerbations treated for long enough (7–14 days by severity and response) and culture-guided?"},
         {tone:"blue", h:"4 · Cause", html:"Is the underlying cause — immunodeficiency, ABPA, reflux or aspiration — actually being treated?"},
         {tone:"blue", h:"5 · Refer", html:"3 or more exacerbations a year, Pseudomonas, or functional decline → respiratory specialist."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"When to refer to respiratory",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Emergency", html:"Same-day hospital assessment (999 for massive haemoptysis): severe breathlessness, hypoxia or respiratory failure · suspected sepsis · haemodynamic instability · confusion or inability to maintain oral intake · significant or ongoing haemoptysis · failure of outpatient treatment with clinical deterioration."},
         {tone:"amber", h:"Pseudomonas or NTM", html:"New Pseudomonas isolation (specialist review of eradication versus observation), or NTM isolation or suspected NTM disease → specialist."},
         {tone:"amber", h:"Frequent exacerbations", html:"3 or more antibiotic-treated exacerbations a year, recurrent admissions or need for IV antibiotics, or for consideration of long-term oral/inhaled antibiotics or mucoactive therapy."},
         {tone:"blue", h:"Cause work-up", html:"Suspected immunodeficiency, ABPA, cystic fibrosis or primary ciliary dyskinesia, or diagnostic uncertainty → specialist."},
         {tone:"blue", h:"Declining function", html:"<b>Progressive symptoms or lung-function decline.</b>"},
         {tone:"cream", h:"GP management", html:"Shared care: airway clearance and physiotherapy referral, vaccination, prompt culture-guided exacerbation treatment, pulmonary rehabilitation, nutrition and the structured annual review all belong here. Related pages: <a href='asthma.html'>asthma</a> · <a href='copd.html'>COPD</a> · <a href='chest-infections.html'>chest infections</a> · <a href='../algorithms/chronic-cough.html'>chronic cough pathway</a>."}
       ]},
       {b:"say", html:"The cornerstone of managing bronchiectasis is daily airway-clearance exercises — a physiotherapist will teach you, and they matter most on the days you feel well. When you get a flare-up, we treat it early with an antibiotic course of 7 to 14 days, guided by a phlegm sample — so send one in before you start the tablets if you can, but do not wait if you are very unwell. And keep your vaccinations up to date."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 58-year-old woman with post-infective bronchiectasis attends having had <b>four courses of antibiotics in the past year</b>, each <b>five days of amoxicillin</b> issued by different clinicians, with <b>no sputum samples sent</b>. She reports daily green sputum and increasing breathlessness. She was shown breathing exercises \"years ago\" but <b>stopped doing them once she felt better</b>. She asks whether she should be on \"a permanent antibiotic\"."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Recognises the exacerbations were systematically under-treated — five days rather than 7–14 days by severity and response, and empirical instead of culture-guided; sends sputum for culture including Pseudomonas before the next course, with mycobacterial cultures per the respiratory pathway; identifies lapsed airway clearance as the modifiable cornerstone and re-refers to respiratory physiotherapy rather than treating this as a drug problem; <b>explains why clearance continues when well</b>; recognises ≥3 antibiotic-treated exacerbations a year as the trigger for respiratory referral and refers rather than starting azithromycin in primary care; knows that active NTM must be excluded and ECG/QTc, LFTs, interactions and hearing/balance checked before any long-term macrolide, and can explain the resistance risk; <b>checks vaccination status and offers pulmonary rehabilitation</b>; <b>revisits the underlying cause</b>; and <b>gives the haemoptysis and exacerbation safety-net</b>."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>Hill AT, et al. British Thoracic Society Guideline for bronchiectasis in adults. Thorax. 2019;74(Suppl 1):1–69</b><br><a href="https://doi.org/10.1136/thoraxjnl-2018-212463" rel="noopener">doi:10.1136/thoraxjnl-2018-212463</a><span class="rd"> — structured cause work-up, airway clearance, 14 days as usual standard (always for Pseudomonas; shorter may suffice in mild disease), Pseudomonas eradication versus observation, DNase and corticosteroid negatives, follow-up</span></li>'+
         '<li><b>Smith D, et al. British Thoracic Society guideline for the use of long-term macrolides in adults with respiratory disease. Thorax. 2020</b><br><a href="https://doi.org/10.1136/thoraxjnl-2019-213929" rel="noopener">doi:10.1136/thoraxjnl-2019-213929</a><span class="rd"> — NTM exclusion, QTc thresholds, ECG and LFT monitoring, azithromycin regimens</span></li>'+
         '<li><b>NICE NG117 \u2014 Bronchiectasis (non-cystic fibrosis), acute exacerbation: antimicrobial prescribing</b><br><a href="https://www.nice.org.uk/guidance/ng117" rel="noopener">nice.org.uk/guidance/ng117</a><span class="rd"> — recommendations and antibiotic tables: sputum culture, empirical antibiotic, change only if resistant and not improving, a 7–14-day course, and no routine prophylaxis without specialist advice. The baseline investigations, cause list, vaccination, rehabilitation, review structure and the 3-or-more-exacerbations threshold come from the BTS 2019 guideline</span></li>'+
         '<li><b>MHRA Drug Safety Update (January 2024) — Fluoroquinolone antibiotics: must now only be prescribed when other commonly recommended antibiotics are inappropriate</b><br><a href="https://www.gov.uk/drug-safety-update" rel="noopener">gov.uk/drug-safety-update</a></li>'+
         '<li><b>Greater Manchester Medicines Management Group — GM Antimicrobial Guidelines (current local version)</b><br><a href="https://gmmmg.nhs.uk" rel="noopener">gmmmg.nhs.uk</a><span class="rd"> — local empirical antibiotic choices for prescribing</span></li>'+
         '<li><b>Greater Manchester Medicines Management Group — Guidance on long-term azithromycin use for chronic respiratory diseases in adults</b><br><a href="https://gmmmg.nhs.uk" rel="noopener">gmmmg.nhs.uk</a><span class="rd"> — initiation by, or on the advice of, a respiratory specialist</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — azithromycin and ciprofloxacin preparations, interactions and cautions</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Bronchiectasis in adults — British Thoracic Society guidance (2019) and NICE NG117. Daily airway clearance is the cornerstone and the first thing to check when control slips. Send sputum before starting antibiotics where possible without delaying treatment if significantly unwell, and treat exacerbations for 7–14 days guided by severity, culture and response. New Pseudomonas isolation needs respiratory specialist review; apply MHRA fluoroquinolone restrictions. Exclude active NTM and check ECG/QTc, LFTs, interactions and hearing/balance before any specialist-initiated long-term macrolide. Three or more antibiotic-treated exacerbations a year should prompt respiratory referral. Verify doses against the current BNF before prescribing."
});
</script>
