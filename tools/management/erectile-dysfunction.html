  quickSub:"If you read nothing else on this page, read these six cards. Every figure traces to the source cited under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Nitrates + PDE5 inhibitors = absolute contraindication", html:"GTN, isosorbide — and nicorandil — with any PDE5 inhibitor cause profound, potentially fatal hypotension. Check the repeat list BEFORE prescribing, and say it as a sentence: <b>“never take these tablets with heart 'nitrate' medicines or poppers.”</b> Caution with alpha-blockers (separate the dosing). <b>Assess cardiovascular stability before any ED treatment</b> — recent MI &lt;6 weeks, unstable angina, NYHA 3–4 heart failure or uncontrolled hypertension → cardiology first (Princeton III)."},
    {tone:"amber", h:"ED is a cardiovascular warning sign — often years ahead of the event", html:"The penile arteries (1.5–2 mm) occlude before the coronaries (3–4 mm), so ED often precedes MI by 2–5 years, and men with ED have a 44% higher 10-year risk of major cardiovascular events (Vlachopoulos, JACC 2013). Every ED consultation is a CVD-prevention consultation: <b>QRISK (QRISK3), BP, lipids, HbA1c, smoking</b> — new ED with exertional chest pain is angina until assessed, before any PDE5 inhibitor."},
    {tone:"blue", h:"Half of 'PDE5 failure' is administration error", html:"Sildenafil after a high-fat meal absorbs 1–2 hours late; the tablets need sexual stimulation (they are not aphrodisiacs); and a proper trial is at least 4 attempts at the maximum tolerated dose before declaring failure. Teach it at the first prescription and re-check it before every escalation — <b>overall PDE5i efficacy is 65–75% (NNT ~2–3) when used correctly</b>."},
    {tone:"green", h:"Morning testosterone, twice — and follow the axis", html:"Total testosterone 8–11am, fasting, ×2 (levels are 15–25% higher at 8am and vary up to 30% day to day). &lt;8 nmol/L = deficiency; 8–12 = borderline (SHBG + calculated free testosterone); &gt;12 = normal. If low: LH/FSH high = primary (testicular) failure; low or normal = secondary → prolactin and pituitary MRI (prolactin &gt;700 mIU/L → MRI). <b>25% of men with ED have hypogonadism — most undiagnosed</b>, and treating it also improves PDE5 response."},
    {tone:"purple", h:"NG12: ED is a prostate-cancer case-finding trigger", html:"NICE NG12 lists erectile dysfunction as a trigger to offer PSA and digital rectal examination. If the prostate feels malignant on DRE, or the PSA is above the age-specific threshold → 2-week-wait urology referral. A testicular nodule found on the genital examination → 2WW testicular pathway. The genital and prostate examination is not optional ritual — it is the cancer-screen half of the consultation.", src:"NICE NG12"},
    {tone:"teal", h:"Lifestyle is vascular treatment, not preamble", html:"40 minutes of aerobic exercise 4×/week reduces ED by ~30%; 10% weight loss restores function in ~30% of obese men without drugs; the Mediterranean diet improved IIEF from 13.9 to 17.0 in Esposito's RCT (JAMA 2004); smoking cessation improves ED in ~25% within a year. Collectively these beat any single drug — and they treat the underlying endothelial disease the tablet only bypasses."}

  pathwaySub:"The whole consultation in five moves. The red step is where the emergencies and the cancer case-finding live.",
  pathway:[
    {title:"Screen the red flags — and the drug chart", html:"Priapism &gt;4 hours → 999. New ED + exertional chest pain → assess as angina before any PDE5i. Nitrates or nicorandil on the repeat list → PDE5i contraindicated. Penile deformity (Peyronie's) → urology before PDE5i. Under-40 with low libido, gynaecomastia or visual symptoms → pituitary work-up. Depression with hopelessness → assess suicide risk. And offer PSA + DRE (NG12).", alert:true},
    {title:"Classify — organic, psychogenic or mixed", html:"Gradual onset + absent morning erections + vascular risk factors = organic. Sudden, situational, preserved morning erections = psychogenic. Most is mixed. Score the <b>IIEF-5</b> to document severity and monitor response. Review the drug list — beta-blockers (atenolol worst), thiazides, SSRIs, finasteride, opioids, recreational drugs."},
    {title:"Examine and investigate", html:"BP both arms, BMI and waist, peripheral pulses (absent femorals = Leriche), genitalia (testicular volume, plaques, nodules), DRE if ≥50 or LUTS, neuropathy screen in diabetes. Bloods: HbA1c, lipids, U&amp;E, FBC, morning testosterone ×2 (± LH/FSH, prolactin, SHBG, TSH), PSA where indicated, QRISK3, ECG."},
    {title:"Treat the cause AND the symptom", html:"Sildenafil 50 mg first-line (titrate 25–100 mg) or tadalafil for spontaneity (5 mg daily or 10–20 mg on demand, 36-hour window). Teach the administration rules. Switch culprit drugs. Treat confirmed hypogonadism (specialist-guided). Psychogenic component → psychosexual therapy — combined therapy beats either alone."},
    {title:"Review, monitor, and keep watching the heart", html:"4–6 weeks: re-score the IIEF-5, check technique and side effects. 3 months: QRISK3 actions, repeat borderline testosterone. Annually: the full cardiovascular review. On testosterone: levels, haematocrit, PSA every 3–6 months. Failed 2 PDE5is at max dose → urology."}
  ],
  sections:[
    {id:"severe", nav:"Red flags", title:"Red flags — the emergencies, the contraindication, and the cancer triggers", sub:"ED is a vascular symptom: screen for what needs urgent action before treating.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Priapism", html:"<b>Painful erection &gt;4 hours → 999.</b> Ischaemic priapism risks permanent ED within 24 hours untreated — <b>&gt;6 hours causes irreversible corporal fibrosis in over 50% of cases</b>. Under 4 hours → call urology for advice (aspiration may avoid the emergency)."},
         {tone:"red", h:"🔴 New ED + cardiovascular symptoms", html:"Exertional chest pain, dyspnoea or palpitations with new ED → same-day assessment (ACS, undiagnosed heart failure) — exercise tolerance testing if stable, and no PDE5 inhibitor until angina is assessed."},
         {tone:"red", h:"🔴 Nitrate or nicorandil use", html:"PDE5 inhibitors absolutely contraindicated — severe, potentially fatal hypotension. Assess cardiovascular stability before any ED treatment; caution and separated dosing with alpha-blockers."},
         {tone:"red", h:"🔴 Depression + hopelessness", html:"Depression with sexual dysfunction and hopelessness → immediate mental-health assessment. ED is a recognised precipitant of suicide risk in men. Screen mood (PHQ-9, GAD-7) in every ED consultation."},
         {tone:"amber", h:"🟠 Young man with hypogonadism features", html:"Under 40 (&lt;40y) with fatigue, loss of libido, gynaecomastia or infertility → think pituitary tumour: LH/FSH, testosterone, prolactin panel ± MRI. Headache or visual field defect strengthens the suspicion."},
         {tone:"amber", h:"🟠 Peyronie's disease", html:"Painful erection with a curved or deformed penis → urology referral — do not start a PDE5 inhibitor without assessment. Present in 5–9% of men with ED; PDE5is do not treat the underlying plaque (intralesional collagenase or surgery do)."},
         {tone:"amber", h:"🟠 Haematospermia + perineal pain", html:"<b>Blood in semen with perineal or rectal pain → same-day review</b> — prostatitis, prostate or seminal-vesicle pathology, rarely malignancy."},
         {tone:"amber", h:"🟠 Pelvic or perineal trauma", html:"Recent pelvic fracture, perineal crush injury or radical prostatectomy → same-day/urology (urethral injury, post-surgical neuropathy). Post-nerve-sparing prostatectomy → early PDE5i rehabilitation via urology."},
         {tone:"purple", h:"🟣 Case-find for prostate cancer <span class='tw'>2WW</span>", html:"NICE NG12: erectile dysfunction is a trigger to offer PSA and DRE. Prostate feels malignant on DRE, or PSA above the age-specific threshold → 2WW urology. A testicular nodule on examination → 2WW testicular pathway.", src:"NICE NG12"}
       ]},
       {b:"why", html:"ED is an independent cardiovascular risk marker — a 44% higher 10-year MACE risk (Vlachopoulos et al, JACC 2013), because the 1.5–2 mm penile vasculature occludes before the 3–4 mm coronaries: <b>ED often precedes MI by 2–5 years</b>. That is why the red-flag screen is cardiovascular before it is urological — and why the nitrate check is the single most important line on this page."}
     ]},

    {id:"classify", nav:"Classify", title:"Classify — organic, psychogenic or mixed", sub:"Classification drives management. Most ED is mixed — treat both components.",
     blocks:[
       {b:"table", head:["Pattern","Features","Implication"], rows:[
         ["<b>Organic</b>","Gradual onset · absent nocturnal/morning erections · normal libido · consistent across situations · vascular risk factors (T2DM, hypertension, dyslipidaemia, smoking)","Vascular, neurogenic, endocrine or drug-induced — work up and treat the cause"],
         ["<b>Psychogenic</b>","Sudden onset · normal nocturnal/morning erections · situational (with masturbation but not partner) · young age · anxiety, depression or relationship conflict · identifiable precipitant","Responds well to CBT/psychosexual therapy — combined PDE5i + psychotherapy beats either alone (NNT ~3)"],
         ["<b>Mixed — the most common</b>","Organic cause with psychological overlay — even purely organic ED breeds performance anxiety that perpetuates it","<b>Treat both components</b>"],
         ["<b>Morning erections (a proxy for nocturnal penile tumescence, NPT)</b>","Ask specifically. Present = psychogenic strongly favoured; absent = organic more likely. Not 100% reliable","The single most discriminating history question"],
         ["<b>IIEF-5 score</b>","5 questions, scored 5–25: 5–7 severe · 8–11 moderate · 12–16 mild–moderate · 17–21 mild · ≥22 no ED. Takes under 2 minutes","<b>Document severity at baseline and re-score to monitor response</b>"],
         ["<b>Duration / context</b>","Acute after a specific event = psychogenic · gradual over years = organic · post-radical-prostatectomy = iatrogenic neurogenic","Sets expectations and the treatment route"]

       {b:"why", html:"EAU 2023 estimates 50–80% of ED has an organic component — pure psychogenic ED is less common than once thought, so even young men warrant vascular and hormonal screening. The validated IIEF-5 turns 'a bit better' into a number, which is what makes the 4–6-week review meaningful."}

    {id:"history", nav:"History", title:"Targeted history — cardiovascular, drugs, hormones, psyche", sub:"Use the PLISSIT frame (Permission, Limited Information, Specific Suggestion, Intensive Therapy) — the topic needs permission before it needs questions.",
     blocks:[
       {b:"table", head:["Domain","Ask about","Why"], rows:[

    {id:"exam", nav:"Examination", title:"Examination — cardiovascular, genital and hormonal", sub:"Do not treat without a cardiovascular and genital assessment — it finds the Leriche syndrome, the Peyronie's plaque, the small testes and the malignant prostate.",
     blocks:[
       {b:"table", head:["What","How / finding","Means"], rows:[
         ["<b>Blood pressure</b>","Both arms; consider ABPM (white-coat effect is common). Target &lt;130/80 with CVD risk","Hypertension is a major vascular driver"],
         ["<b>Cardiovascular</b>","Rate, rhythm, femoral and popliteal pulses — absent femorals suggest aortoiliac disease: Leriche syndrome = bilateral buttock claudication + ED + absent femoral pulses","<b>&lt;1% of ED but surgical — absent femoral pulses are pathognomonic</b>"],
         ["<b>BMI / waist</b>","BMI &gt;30 reduces free testosterone (SHBG effects + aromatisation); waist &gt;102 cm = high risk","Metabolic syndrome predicts ED"],
         ["<b>Genitalia</b>","Testicular size and consistency (small, soft = hypogonadism — volume &lt;15 mL on Prader orchidometer; firm nodule = cancer), penile plaques (Peyronie's), phimosis, hypospadias, secondary sexual hair, gynaecomastia","25% of men with ED have hypogonadism — many undiagnosed. A nodule → 2WW"],
         ["<b>DRE</b>","If ≥50, LUTS, or PSA testing planned; before alpha-blockers or finasteride/dutasteride","<b>A malignant-feeling prostate → 2WW urology (NG12)</b>"],
         ["<b>Neuropathy screen</b>","<b>10 g monofilament + 128 Hz tuning fork for vibration sense in diabetes</b>","Neuropathy = a neurogenic component, less PDE5-responsive"]
       ]}
     ]},

    {id:"workup", nav:"Work-up", title:"Investigations — hormonal, metabolic and cardiovascular", sub:"Screen for the treatable causes before the first prescription — and know when not to investigate.",
     blocks:[
       {b:"table", head:["Test","Detail","Interpretation"], rows:[
         ["<b>All patients (mandatory)</b>","<b>Fasting glucose / HbA1c, fasting lipids, U&amp;E/eGFR, FBC</b>","<b>T2DM is present in 25–35% of men with ED — HbA1c finds the undiagnosed</b>"],
         ["<b>Morning testosterone ×2</b>","Total testosterone 8–11am, fasting, on two occasions (levels are 15–25% higher at 8am than 4pm; day-to-day variability up to 30%)","&lt;8 nmol/L = deficiency (treat) · 8–12 = borderline → SHBG and calculated free testosterone · &gt;12 = normal"],
         ["<b>If testosterone low → LH + FSH</b>","High LH/FSH = primary hypogonadism (testicular failure). Low or inappropriately normal = secondary → pituitary MRI","Localises the axis defect"],
         ["<b>Prolactin</b>","Hyperprolactinaemia (stress, antipsychotics, macroprolactinoma) suppresses testosterone. Repeat if elevated — exclude stress artefact. &gt;700 mIU/L → pituitary MRI","The pituitary door"],
         ["<b>TSH</b>","Both hypo- and hyperthyroidism cause ED; hypothyroidism also reduces testosterone synthesis","Check with fatigue or thyroid features"],
         ["<b>PSA</b>","Offer with DRE per NG12 (ED is a case-finding trigger); mandatory before testosterone therapy (contraindicated in active prostate cancer)","<b>Above the age-specific threshold → 2WW</b>"],

         ["<b>When NOT to investigate</b>","Young healthy man with clearly psychogenic ED (sudden, situational, morning erections preserved, identifiable precipitant): keep the cardiovascular baseline, defer the hormonal screen","Investigation follows probability"]
       ]}

    {id:"ladder", nav:"Treat", title:"Treatment — the PDE5 ladder, hormones, and second-line options", sub:"First-line for organic and mixed ED regardless of cause — while correcting the cause in parallel. Verify all doses in the BNF.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1st line", title:"Sildenafil 50 mg on demand", when:"most men — generic, cheap, effective", fromLabel:"start here",
          html:"30–60 minutes before sexual activity; avoid a high-fat meal (delays absorption 1–2 hours) and grapefruit; maximum once daily. Titrate to 100 mg if inadequate, down to 25 mg for side effects; duration 4–6 hours. Requires sexual stimulation. Minimum 4-week trial, at least 4–6 attempts at optimal dose before judging failure. ~8 tablets/month on NHS (SLS); OTC sildenafil is available from pharmacies."},
         {step:"Alternative", title:"Tadalafil — for spontaneity", when:"regular sexual activity, T2DM, post-prostatectomy", fromLabel:"if timing is the problem",
          html:"10 mg on demand (titrate to 20 mg) with a 36-hour window — or 5 mg once daily, which is superior to on-demand dosing in T2DM-related and post-prostatectomy ED (earlier penile rehabilitation). SLS criteria apply (diabetes, MS, prostate cancer, etc.)."},
         {step:"Alternative", title:"Vardenafil 10 mg", when:"sildenafil side effects", fromLabel:"third option",
          html:"25–60 minutes before activity, titrate to 20 mg. Avoid with class IA/III antiarrhythmics (QT-prolongation risk) — check an ECG first."},
         {step:"Endocrine", title:"Testosterone replacement", when:"confirmed hypogonadism (two low morning samples)", fromLabel:"often with endocrine input",
          html:"Testogel® 50 mg sachet daily (transdermal) or Nebido® 1000 mg IM every 10–14 weeks — specialist-guided initiation, contraindicated in active prostate cancer (PSA first). Improves libido AND PDE5 response. Monitor testosterone (target 10–25 nmol/L), PSA, FBC/haematocrit."},
         {step:"2nd line", title:"Alprostadil", when:"PDE5i contraindicated or failed", fromLabel:"urology-initiated",
          html:"Caverject® intracavernosal injection 5–40 mcg (urology-taught) or MUSE® intraurethral pellet 125–1000 mcg — effective in &gt;70% of PDE5 failures."},
         {step:"Device", title:"Vacuum erection device", when:"all drugs fail, or drugs unsuitable", fromLabel:"NHS-prescribable",
          html:"Non-pharmacological, effective in 60–70%; useful in cardiovascular disease, anticoagulation and PDE5 contraindication. Beyond this: penile Doppler, surgical implant discussion — urology."}
       ]},
       {b:"table", head:["Culprit drug","Switch to","Why"], rows:[
         ["<b>Beta-blocker (atenolol)</b>","<b>Nebivolol</b>","<b>Vasodilatory, much lower ED risk (~4× less than atenolol)</b>"],
         ["<b>SSRI</b>","<b>Mirtazapine or bupropion</b>","<b>Lower sexual side-effect profile</b> — discuss with whoever owns the depression care"],
         ["<b>Thiazide</b>","<b>Amlodipine or ACE inhibitor</b>","Equivalent BP control without the ED burden"]
       ]},
       {b:"kv", rows:[
         ["NHS (SLS) prescribing","ED drugs are NHS-prescribable for: diabetes, MS, Parkinson's, polio, prostate cancer, spinal cord injury, renal failure, severe pelvic injury, single-gene neurological disease, radical prostatectomy, and prostate/rectal cancer treatment — otherwise private scripts or OTC sildenafil"],
         ["The counselling set","Requires sexual stimulation · avoid high-fat meals (sildenafil) and grapefruit · not more than once a day · never with nitrates, nicorandil or poppers · 4–6 attempts at maximum tolerated dose before 'failure'"]
       ]},
       {b:"warn", html:"PDE5 inhibitors are absolutely contraindicated with nitrates and nicorandil — profound hypotension. Separate alpha-blocker dosing. Avoid or seek advice in recent MI or stroke, unstable angina, and significant aortic stenosis. 50% of 'PDE5 failures' are administration errors — recheck technique, dose and stimulation before every escalation."},
       {b:"say", html:"These tablets work with arousal, not instead of it — take one thirty to sixty minutes before, not straight after a big meal, and give it a proper chance: at least four tries at the full dose. One vital rule: never combine them with nitrate heart medicines or poppers. And because the same blood-vessel changes that cause this can affect the heart, we're also going to check your blood pressure, sugar and cholesterol properly."}
     ]},

    {id:"lifestyle", nav:"Lifestyle", title:"Lifestyle — vascular treatment in its own right", sub:"Each measure has a mechanism and a quantified effect. Together they outperform any single drug — and they treat the disease, not the symptom.",
     blocks:[
       {b:"table", head:["Measure","Target","Effect"], rows:[
         ["<b>🏃 Aerobic exercise</b>","<b>40 minutes × 4/week</b>","Reduces ED by ~30% (Lamina RCT); improves endothelial function, lowers BMI, raises free testosterone — the most powerful lifestyle intervention. MMAS: activity cuts ED risk 30–40%"],
         ["<b>⚖️ Weight loss</b>","<b>10% body weight; BMI &lt;25</b>","Restores erectile function in ~30% of obese men without medication; reduces aromatisation of testosterone to oestrogen"],
         ["<b>🚭 Smoking</b>","Cessation — NHS Stop Smoking referral","Independent ED risk factor (OR 1.51) via endothelial dysfunction; cessation improves ED in ~25% within 1 year"],
         ["<b>🍺 Alcohol</b>","<b>&lt;14 units/week with alcohol-free days</b>","Chronic excess → hypogonadism, neuropathy, testicular atrophy; acute excess → transient ED in healthy men"],
         ["<b>🥗 Mediterranean diet</b>","Olive oil, fish, legumes, vegetables, nuts","~40% ED risk reduction; Esposito RCT (JAMA 2004): IIEF 13.9 → 17.0 vs 13.6 → 13.4 control (p&lt;0.001)"],
         ["<b>🚴 Cycling</b>","<b>Modify if &gt;3 hours/week</b>","Perineal pressure compresses the pudendal artery (~2× ED risk) — no-nose ergonomic saddle, padded shorts, standing intervals"],
         ["<b>🧠 Psychosexual therapy</b>","CBT + sensate-focus exercises; COSRT-registered therapist","<b>Combined PDE5i + psychotherapy is superior to either alone</b>; involve the partner where possible"],
         ["<b>😴 Sleep / OSA</b>","<b>Screen with STOP-BANG</b>","Testosterone is secreted predominantly in (REM) sleep; OSA affects 15–25% of men with ED, and CPAP normalises testosterone in ~70% of hypogonadal men with OSA"]
       ]}
     ]},

    {id:"loop", nav:"Not responding?", title:"Not responding? Run this loop before escalating", sub:"Most 'PDE5 failure' is technique, dose, or an untreated cause.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"1 · Technique", html:"Adequate dose? Sexual stimulation? At least 4–6 attempts? Empty-stomach timing for sildenafil?"},
         {tone:"amber", h:"2 · Testosterone", html:"<b>Hypogonadism confirmed and treated? It restores PDE5 response.</b>"},
         {tone:"amber", h:"3 · Drugs and lifestyle", html:"Culprit medicines switched? Smoking, alcohol, weight, cycling addressed?"},
         {tone:"amber", h:"4 · Psychological", html:"Performance anxiety or relationship conflict → psychosexual therapy alongside the tablet."},
         {tone:"amber", h:"5 · True failure", html:"Failed 2 different PDE5 inhibitors at maximum dose with compliance confirmed → urology: penile Doppler, alprostadil, vacuum device, implant discussion."}
       ]}
     ]},

    {id:"monitor", nav:"Monitor", title:"Follow-up — response AND cardiovascular surveillance", sub:"Every review has two jobs: is the treatment working, and is the heart being watched.",
     blocks:[
       {b:"table", head:["When","What","Action"], rows:[
         ["<b>4–6 weeks</b>","Re-score IIEF-5; side effects (flushing, headache, visual changes); administration technique; new psychological barriers","Optimise dose or switch"],
         ["<b>3 months</b>","QRISK3 actions if antihypertensive/statin started; repeat borderline testosterone; weight/BMI/waist; HbA1c if diabetic; lifestyle progress","The cause-side review"],
         ["<b>6–12 months</b>","Annual cardiovascular review — BP, lipids, HbA1c, weight, smoking; IIEF-5 re-score","<b>Consider stepping the PDE5i down if lifestyle gains are significant</b>"],
         ["<b>On testosterone</b>","Every 3–6 months: testosterone level (target 10–25 nmol/L), FBC/haematocrit (polycythaemia — &gt;54% needs dose reduction or phlebotomy), PSA, BP","<b>Refer if PSA rises &gt;1.4 ng/mL above baseline in any 12-month period</b>"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"📞 999", html:"Chest pain or breathlessness during sex — stop and call 999 · priapism &gt;4 hours · syncope after PDE5i (nitrate interaction)."},
         {tone:"amber", h:"🟠 Same-day", html:"Sudden vision or hearing loss after a PDE5 inhibitor → stop it permanently (NAION — non-arteritic anterior ischaemic optic neuropathy, ~2.5 per 100,000, rare but serious) · priapism under 4 hours (urology advice)."},
         {tone:"blue", h:"🩺 Routine", html:"Persistent ED despite optimal drugs → formal psychosexual referral (partner involvement improves outcomes; COSRT directory) · annual CV review · testosterone monitoring bloods."}
       ]},
       {b:"why", html:"Annual cardiovascular review in men with ED detects new T2DM, hypertension and dyslipidaemia — ED is a gateway into preventive medicine, and the 44%-higher MACE rate is the reason the follow-up schedule never drops the heart half of the job."}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — who, when, how urgently", sub:"Most ED is primary care. These are the exceptions.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999", html:"Priapism &gt;4 hours · haemodynamic instability · ACS triggered during treatment or sex."},
         {tone:"red", h:"Same-day", html:"Priapism &lt;4 hours (urology advice — aspiration may avoid the emergency) · suspected acute prostatitis with sepsis · acute urinary retention · haematospermia with perineal pain."},
         {tone:"purple", h:"Urgent suspected cancer <span class='tw'>2WW</span> · NICE NG12", html:"ED is itself an NG12 case-finding trigger: offer PSA + DRE. A prostate that feels malignant on DRE, or a PSA above the age-specific reference range → 2-week-wait suspected prostate cancer referral. A testicular nodule or non-transilluminating mass → 2WW testicular cancer pathway.", src:"NICE NG12 (updated May 2025) · house rule"},
         {tone:"amber", h:"Urology (urgent, ~2 weeks)", html:"Peyronie's disease with ED · hypospadias affecting function · post-radical-prostatectomy ED (nerve-sparing → early PDE5i rehabilitation, initiated within weeks — improves long-term recovery by ~50%) · testicular pathology on examination."},
         {tone:"blue", h:"Endocrinology", html:"Secondary hypogonadism (low testosterone + low/normal LH/FSH) · prolactin &gt;700 mIU/L or any pituitary mass on MRI · testosterone deficiency not responding to primary-care management."},
         {tone:"blue", h:"Cardiology", html:"High Princeton III risk before PDE5i: recent MI &lt;6 weeks, unstable angina, NYHA 3–4 heart failure, uncontrolled hypertension → stabilise and risk-stratify (exercise testing) first."},
         {tone:"plain", h:"Psychosexual therapy", html:"Predominantly psychogenic ED · failed PDE5i in a young man · relationship conflict · sexual trauma · performance anxiety · patient prefers a non-drug approach."},
         {tone:"green", h:"GP manages", html:"ED with metabolic risk factors (address the risks + PDE5i) · psychogenic ED with explanation and counselling · medication-induced ED (switch the culprit) · the whole monitoring schedule."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only — the Casebook keeps the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 54-year-old taxi driver books a 'medication review' and, hand on the door, mentions his erections have been failing for a year. He smokes 20/day, has a BMI of 33, and takes atenolol and bendroflumethiazide for blood pressure. He gets tight-chested pushing the wheelchair ramp. He asks simply for 'the blue pill'."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Handles the door-handle disclosure with permission-giving (<b>PLISSIT</b>); elicits exertional chest tightness and defers the PDE5i pending angina assessment (Princeton III); checks the repeat list for <b>nitrates</b>; recognises <b>atenolol and the thiazide as culprits</b> and plans switches; arranges <b>HbA1c, lipids, morning testosterone ×2, QRISK3</b>; <b>offers PSA + DRE (NG12 case-finding)</b>; frames ED as an <b>early cardiovascular warning</b> without catastrophising; commits to <b>smoking cessation and weight referral as treatment</b>, not garnish; and safety-nets <b>priapism and the nitrate rule</b> in plain words. <a href='../../cases/erectile-dysfunction.html'>Open the full casebook chapter →</a>"}
     ]}]},
