MG.render({
  icon:"💊",
  title:"Erectile dysfunction — the complete guide",

  stemTitle:"ED is associated with cardiovascular risk — treat the symptom, and act on the warning",
  stemSub:"One page for the whole condition. ED, particularly new-onset vasculogenic ED, is associated with increased cardiovascular risk — use the consultation to identify modifiable risk factors and cardiovascular symptoms, but do not treat ED as proof of coronary artery disease. Screen the red flags (priapism, nitrates/nicorandil/riociguat, cardiac symptoms), classify organic vs psychogenic with the IIEF-5, investigate proportionately, prescribe PDE5 inhibitors with explicit administration counselling (many 'failures' are administration errors), support lifestyle change, consider PSA and DRE per NG12 after discussion, and refer second-line treatments to specialist services. EAU 2026 · BSSM · Princeton III · NICE NG12 · Drug Tariff · GMMMG formulary.",
  guideline:"EAU Sexual and Reproductive Health (2026 limited update; 2023 ED recommendations) · BSSM · Princeton III (2012, international) · NICE NG12 (updated April 2026) · NHS Drug Tariff · GMMMG formulary",
  reviewed:"8 September 2026",
  nextReview:"8 March 2027",
  meta:[
    {t:"EAU Sexual and Reproductive Health 2026"},
    {t:"BSSM · Princeton III (2012)"},

  ],
  lead:"<div class='mg-layers'><a href='#severe'><b>Red flags</b><small>Priapism · nitrates · cardiac symptoms</small></a><a href='#workup'><b>Work-up</b><small>Proportionate · HbA1c · lipids · CV risk</small></a><a href='#ladder'><b>Treat</b><small>PDE5i properly, then the rest</small></a><a href='#refer'><b>Refer</b><small>Urology · endocrine · suspected cancer routes</small></a></div>",
  quickSub:"If you read nothing else on this page, read these six cards. Sources are listed under <a href='#provenance'>Evidence</a>; check doses and contraindications against the current SPC and local formulary.",
  quick:[
    {tone:"red", h:"⚠ Nitrates + PDE5 inhibitors = absolute contraindication", html:"GTN, isosorbide preparations, recreational nitrites (poppers) and nicorandil with any PDE5 inhibitor can cause profound, potentially fatal hypotension; riociguat is also contraindicated. Check the repeat list BEFORE prescribing, and say it as a sentence: <b>“never take these tablets with heart 'nitrate' medicines or poppers.”</b> No nitrate for at least 24 hours after sildenafil, vardenafil or avanafil, or 48 hours after tadalafil — if chest pain occurs in that interval, call 999 and tell clinicians when the tablet was taken. <b>Alpha-blockers:</b> use cautiously — patient haemodynamically stable on the alpha-blocker, lowest PDE5-inhibitor starting dose, monitor for postural hypotension; dose separation may help but does not eliminate the interaction. <b>Assess exercise tolerance and cardiovascular symptoms</b> — active cardiac symptoms, unstable cardiovascular disease (e.g. recent MI, unstable angina, NYHA 3–4 heart failure, uncontrolled hypertension) or uncertain exercise capacity → cardiovascular assessment first (Princeton III)."},
    {tone:"amber", h:"ED is associated with increased cardiovascular risk", html:"ED, particularly new-onset vasculogenic ED, is associated with increased cardiovascular risk and may precede clinically apparent cardiovascular disease — an association, not a prediction for the individual, and not proof of coronary artery disease. Use the consultation for cardiovascular history and examination, <b>BP, smoking, alcohol, weight and activity, diabetes and lipid assessment</b>, with formal CVD risk assessment (QRISK3) where appropriate. Routine ECG, ABPM, exercise testing or cardiology referral is not required solely because of ED in an otherwise stable, asymptomatic patient. New exertional chest pain, exertional dyspnoea, syncope or unstable symptoms → assess urgently and defer the PDE5 inhibitor."},
    {tone:"blue", h:"Many 'PDE5 failures' are administration errors", html:"High-fat meals can delay sildenafil absorption; the tablets need sexual stimulation (they are not aphrodisiacs). <b>Before declaring treatment failure, check timing, dose, sexual stimulation, food, adherence and the number of attempts</b> — consider several attempts at the maximum tolerated dose. Teach it at the first prescription and re-check it before every escalation."},
    {tone:"green", h:"Morning testosterone — when indicated, and confirm it", html:"Measure total testosterone in the morning, ideally fasting, in men with ED plus reduced libido, fatigue, testicular atrophy, gynaecomastia, infertility or other features suggesting androgen deficiency. Repeat an unexpectedly low result before diagnosing hypogonadism — diagnosis needs compatible symptoms/signs <b>and</b> consistently low morning testosterone. Cut-offs vary between assays and guidelines: use the laboratory range and clinical context (BSSM/EAU thresholds are decision aids, not diagnostic laws). If repeatedly low: LH and FSH, SHBG and calculated free testosterone where indicated, prolactin if secondary hypogonadism, low libido, gynaecomastia or pituitary symptoms. Low or inappropriately normal LH/FSH does not automatically mean pituitary MRI. Treating confirmed hypogonadism may improve libido and PDE5 response; testosterone is not a routine add-on where testosterone is normal."},
    {tone:"purple", h:"NG12: consider PSA and DRE in men with ED", html:"ED is one of the symptoms for which NICE advises considering PSA and DRE. It does not itself mandate suspected-cancer referral, and not every ED presentation is a prostate-cancer case. Discuss the benefits and limitations of PSA before testing, and exclude or manage UTI/prostatitis first; a raised PSA is not diagnostic of cancer. Prostate feels malignant on DRE → prostate suspected cancer pathway referral. PSA above the age-specific threshold (40–49 &gt;2.5 · 50–59 &gt;3.5 · 60–69 &gt;4.5 · 70–79 &gt;6.5 micrograms/L; under 40 or over 79 clinical judgement) → consider suspected cancer referral. A solid intratesticular mass or unexplained testicular enlargement → urgent scrotal ultrasound and the local suspected testicular-cancer pathway.", src:"NICE NG12 recs 1.6.1–1.6.3 (updated April 2026)"},
    {tone:"green", h:"Lifestyle is vascular treatment, not preamble", html:"Encourage smoking cessation, regular moderate-to-vigorous physical activity, weight reduction where appropriate, moderation of alcohol, healthy diet, sleep optimisation and treatment of obstructive sleep apnoea. These interventions improve cardiovascular health and may improve erectile function — they address the underlying vascular risk the tablet only bypasses, but are not guaranteed individual outcomes. Use an individualised, achievable weight-management plan rather than a fixed BMI target."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step is where the emergencies and urgent issues live.",
  pathway:[
    {title:"Screen the red flags — and the drug chart", html:"Painful erection lasting 4 hours or more → emergency urology (999/ED). New ED + chest pain, exertional dyspnoea or syncope → urgent assessment, defer the PDE5i. Nitrates, nicorandil or riociguat on the repeat list, or poppers → PDE5i contraindicated. Penile deformity or significant penile pain, testicular mass or acute testicular pain → assess and refer. Under-40 with low libido, gynaecomastia or visual symptoms → testosterone and endocrine assessment. Severe depression or suicidal thoughts → assess suicide risk. Consider PSA + DRE (NG12) after discussion.", alert:true},
    {title:"Classify — organic, psychogenic or mixed", html:"Gradual onset + absent morning erections + vascular risk factors = organic. Sudden, situational, preserved morning erections = psychogenic. Most is mixed. Establish erection, libido, ejaculation and orgasm, onset and pattern, partner and psychological factors, and the patient's goals. Score the <b>IIEF-5</b> to document severity and monitor response. Review the drug list — nitrates, nicorandil, riociguat, alpha-blockers, antihypertensives, antidepressants, antipsychotics, finasteride/dutasteride, opioids, recreational drugs including poppers."},
    {title:"Examine and investigate", html:"BP, BMI and waist, cardiovascular history and exercise tolerance, peripheral pulses where indicated; focused genital examination when clinically indicated or acceptable to the patient; DRE if prostate assessment is being considered (NG12); neuropathy screen in diabetes. Investigate proportionately: HbA1c/glucose and lipids; morning testosterone if hypogonadal features (repeat if low); further endocrine tests only if results or symptoms indicate; PSA after discussion where indicated; CVD risk assessment where appropriate."},
    {title:"Treat the cause AND the symptom", html:"Address cardiovascular and metabolic risk. Sildenafil 50 mg first-line (adjust 25–100 mg) or tadalafil (10–20 mg on demand, or 5 mg daily in selected men) — choose by sexual frequency, preference, tolerability and cost. Give explicit administration counselling. Review possible culprit drugs with the clinician responsible. Treat confirmed hypogonadism (specialist-guided). Psychogenic or relationship component → psychosexual therapy alongside. Refer complex or refractory cases."},
    {title:"Review, monitor, and keep watching the heart", html:"About 4–8 weeks after starting or changing treatment: re-score the IIEF-5, check efficacy, adherence, technique, side effects and cardiovascular symptoms. Reassess testosterone only where borderline or abnormal. Annually: cardiovascular review. On testosterone: a documented shared-care monitoring plan. Persistent ED despite correctly used PDE5 inhibitors → urology/andrology."}
  ],
  sections:[
    {id:"severe", nav:"Red flags", title:"Red flags — the emergencies, the contraindications, and the prostate and testicular checks", sub:"ED is a vascular symptom: screen for what needs urgent action before treating.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Priapism", html:"<b>A painful erection lasting 4 hours or longer is ischaemic priapism until proven otherwise and requires immediate emergency urological management.</b> Do not advise waiting for it to resolve or managing it in primary care — delayed treatment risks corporal ischaemia, fibrosis and permanent ED. A painful erection approaching 4 hours, recurrent, or associated with intracavernosal treatment → urgent urological advice. Aspiration and intracavernosal phenylephrine are specialist emergency treatments, not GP procedures."},
         {tone:"red", h:"🔴 New ED + cardiovascular symptoms", html:"New exertional chest pain, exertional dyspnoea, syncope, palpitations or unstable symptoms with new ED → urgent assessment (ACS, undiagnosed heart failure) and defer the PDE5 inhibitor. Routine ECG or exercise testing is not required solely because of ED in an otherwise stable, asymptomatic patient."},
         {tone:"red", h:"🔴 Nitrate, nicorandil, poppers or riociguat", html:"PDE5 inhibitors contraindicated — severe, potentially fatal hypotension. No nitrates for at least 24 hours after sildenafil, vardenafil or avanafil, or 48 hours after tadalafil; chest pain in that interval → 999, telling clinicians when the PDE5 inhibitor was taken. Alpha-blockers: haemodynamically stable first, lowest PDE5-inhibitor dose, monitor for postural hypotension — dose separation does not eliminate the interaction."},
         {tone:"red", h:"🔴 Depression + hopelessness", html:"Depression with sexual dysfunction and hopelessness → immediate mental-health assessment. ED is a recognised precipitant of suicide risk in men. Screen mood (PHQ-9, GAD-7) in every ED consultation."},
         {tone:"amber", h:"🟠 Young man with hypogonadism features", html:"Under 40 (&lt;40y) with fatigue, loss of libido, gynaecomastia or infertility → morning testosterone (repeat if low), then LH/FSH and prolactin. Consider pituitary MRI only with marked or persistent hyperprolactinaemia, other pituitary hormone abnormalities, visual-field symptoms, headache, or on specialist advice."},
         {tone:"amber", h:"🟠 Peyronie's disease", html:"Refer men with suspected Peyronie's disease if there is significant curvature, pain, penile shortening, palpable plaque, diagnostic uncertainty or troublesome ED. A PDE5 inhibitor may be used for associated ED unless otherwise contraindicated — it does not correct the plaque or curvature."},
         {tone:"amber", h:"🟠 Haematospermia + perineal pain", html:"<b>Blood in semen with perineal or rectal pain → same-day review</b> — prostatitis, prostate or seminal-vesicle pathology, rarely malignancy."},
         {tone:"amber", h:"🟠 Pelvic or perineal trauma", html:"Recent pelvic fracture, perineal crush injury or radical prostatectomy → same-day/urology (urethral injury, post-surgical neuropathy). Post-nerve-sparing prostatectomy → early PDE5i rehabilitation via urology."},
         {tone:"purple", h:"🟣 Prostate and testicular checks <span class='tw'>Suspected cancer</span>", html:"NICE NG12: ED is one of the symptoms for which to consider PSA and DRE — it does not itself mandate referral. Discuss PSA benefits and limitations first. Prostate feels malignant on DRE → prostate suspected cancer pathway referral; PSA above the age-specific threshold → consider suspected cancer referral. A solid intratesticular mass or unexplained testicular enlargement → urgent scrotal ultrasound and urological assessment via the local suspected testicular-cancer pathway — do not delay imaging.", src:"NICE NG12 recs 1.6.1–1.6.3 (updated April 2026)"}
       ]},
       {b:"why", html:"ED, particularly new-onset vasculogenic ED, is associated with increased cardiovascular risk and may precede clinically apparent cardiovascular disease (meta-analysis: Vlachopoulos et al, Circ Cardiovasc Qual Outcomes 2013) — a population association, not a deterministic prediction for an individual patient. That is why the red-flag screen is cardiovascular before it is urological — and why the nitrate check is the single most important line on this page."}
     ]},

    {id:"classify", nav:"Classify", title:"Classify — organic, psychogenic or mixed", sub:"Classification drives management. Most ED is mixed — treat both components.",
     blocks:[
       {b:"table", head:["Pattern","Features","Implication"], rows:[
         ["<b>Organic</b>","Gradual onset · absent nocturnal/morning erections · normal libido · consistent across situations · vascular risk factors (T2DM, hypertension, dyslipidaemia, smoking)","Vascular, neurogenic, endocrine or drug-induced — work up and treat the cause"],
         ["<b>Psychogenic</b>","Sudden onset · normal nocturnal/morning erections · situational (with masturbation but not partner) · young age · anxiety, depression or relationship conflict · identifiable precipitant","Responds well to CBT/psychosexual therapy — combined PDE5i + psychotherapy may be more effective than either alone"],
         ["<b>Mixed — the most common</b>","Organic cause with psychological overlay — even purely organic ED breeds performance anxiety that perpetuates it","<b>Treat both components</b>"],
         ["<b>Morning erections (a proxy for nocturnal penile tumescence, NPT)</b>","Ask specifically. Present = psychogenic strongly favoured; absent = organic more likely. Not 100% reliable","The single most discriminating history question"],
         ["<b>IIEF-5 score</b>","5 questions, scored 5–25: 5–7 severe · 8–11 moderate · 12–16 mild–moderate · 17–21 mild · ≥22 no ED. Takes under 2 minutes","<b>Document severity at baseline and re-score to monitor response</b>"],
         ["<b>Duration / context</b>","Acute after a specific event = psychogenic · gradual over years = organic · post-radical-prostatectomy = iatrogenic neurogenic","Sets expectations and the treatment route"]
       ]},
       {b:"why", html:"EAU 2023 estimates 50–80% of ED has an organic component — pure psychogenic ED is less common than once thought, so even young men warrant vascular and hormonal screening. The validated IIEF-5 turns 'a bit better' into a number, which is what makes the 4–8-week review meaningful."}
     ]},

    {id:"history", nav:"History", title:"Targeted history — cardiovascular, drugs, hormones, psyche", sub:"Use the PLISSIT frame (Permission, Limited Information, Specific Suggestion, Intensive Therapy) — the topic needs permission before it needs questions.",
     blocks:[
       {b:"table", head:["Domain","Ask about","Why"], rows:[
         ["<b>Cardiovascular risk</b>","BP (check today), lipids, T2DM/HbA1c, smoking, alcohol, family history of premature CVD, obesity, activity level, exercise tolerance, chest pain, exertional dyspnoea or syncope","ED is associated with increased CVD risk"],
         ["<b>Medications</b>","Nitrates, nicorandil, riociguat and alpha-blockers (PDE5 interactions); beta-blockers, thiazide diuretics, SSRIs/TCAs/SNRIs, antipsychotics, finasteride/dutasteride, spironolactone, opioids; recreational — poppers, cocaine, cannabis, anabolic steroids","Review whether the medicine is temporally associated with ED. Finasteride: the MHRA has highlighted reports of sexual dysfunction that may persist after stopping, and of depression/suicidal ideation — discuss as reported risks, not established outcomes for all users (MHRA Drug Safety Update, May 2026)"],
         ["<b>Hormonal symptoms</b>","Loss of libido, fatigue, gynaecomastia, reduced body hair, testicular atrophy, infertility, hot flushes","The hypogonadism screen"],
         ["<b>Neurological</b>","MS, Parkinson's, spinal cord injury, diabetic peripheral neuropathy; pelvic surgery (prostatectomy, rectal surgery, aortoiliac reconstruction)","Neurogenic ED responds less well to PDE5is"],
         ["<b>Psychosocial</b>","Depression (PHQ-9), anxiety (GAD-7), relationship satisfaction and the partner's view, past sexual trauma, pornography use, sexual orientation, work and financial stress","The mixed-aetiology half"],
         ["<b>Lifestyle</b>","Prolonged cycling (perineal compression), smoking, alcohol &gt;14 units/week (acute excess = transient ED; chronic = hypogonadism, neuropathy), obesity (aromatisation of testosterone to oestrogen)","Each is modifiable — see <a href='#lifestyle'>Lifestyle</a>"],
         ["<b>Ejaculation / orgasm</b>","Premature ejaculation often co-exists; absent ejaculation = retrograde (T2DM, alpha-blockers, post-TURP); anorgasmia = neurological or psychogenic","Different problem, different pathway"],
         ["<b>Previous treatment</b>","<b>Which PDE5i, what dose, taken how — with food? adequate stimulation?</b>","<b>Many 'treatment failures' are administration errors</b>"]
       ]}
     ]},

    {id:"exam", nav:"Examination", title:"Examination — cardiovascular, genital and hormonal", sub:"Assess cardiovascular status in everyone. Offer a focused genital examination when clinically indicated or acceptable to the patient, particularly where there is penile deformity, pain, testicular symptoms, infertility, hypogonadal features or diagnostic uncertainty — it is not a prerequisite for every PDE5 prescription in a clear, previously assessed case.",
     blocks:[
       {b:"table", head:["What","How / finding","Means"], rows:[
         ["<b>Blood pressure</b>","Measure today; if raised, confirm hypertension per NICE (ABPM or HBPM). ABPM is not needed routinely before a PDE5 inhibitor","Hypertension is a major vascular driver"],
         ["<b>Cardiovascular</b>","Rate, rhythm, femoral and popliteal pulses — absent femorals suggest aortoiliac disease: Leriche syndrome = bilateral buttock claudication + ED + absent femoral pulses","<b>Rare but important — absent femoral pulses with claudication need vascular assessment</b>"],
         ["<b>BMI / waist</b>","BMI &gt;30 reduces free testosterone (SHBG effects + aromatisation); waist &gt;102 cm = high risk","Metabolic syndrome predicts ED"],
         ["<b>Genitalia</b>","Testicular size and consistency (small, soft = hypogonadism — volume &lt;15 mL on Prader orchidometer; firm intratesticular nodule needs urgent assessment), penile plaques (Peyronie's), phimosis, hypospadias, secondary sexual hair, gynaecomastia","Small testes suggest hypogonadism. A solid intratesticular mass or unexplained testicular enlargement → urgent scrotal ultrasound and the local suspected testicular-cancer pathway — do not delay imaging"],
         ["<b>DRE</b>","Consider with PSA as prostate assessment in men with ED (NG12), after discussion. Not required solely because of age 50 or over, and not a universal prerequisite before alpha-blockers or finasteride/dutasteride","<b>A malignant-feeling prostate → prostate suspected cancer pathway referral (NG12)</b>"],
         ["<b>Neuropathy screen</b>","<b>10 g monofilament + 128 Hz tuning fork for vibration sense in diabetes</b>","Neuropathy = a neurogenic component, less PDE5-responsive"]
       ]}
     ]},

    {id:"workup", nav:"Work-up", title:"Investigations — hormonal, metabolic and cardiovascular", sub:"Investigate proportionately — further endocrine tests only if the initial results or symptoms indicate — and know when not to investigate.",
     blocks:[
       {b:"table", head:["Test","Detail","Interpretation"], rows:[
         ["<b>Most new ED (baseline)</b>","<b>BP and cardiovascular history · HbA1c or glucose according to clinical context · lipid profile as part of CVD risk assessment · weight/BMI and smoking status · medication and recreational-drug review</b>","<b>Finds undiagnosed diabetes and modifiable cardiovascular risk</b>"],
         ["<b>Consider</b>","FBC if anaemia or systemic disease is suspected · U&amp;E if clinically indicated or before relevant medication choices · TSH if thyroid symptoms/signs or unexplained symptoms","Not mandatory for every patient"],
         ["<b>Morning testosterone — if indicated</b>","Total testosterone in the morning, ideally fasting, in men with ED plus reduced libido, fatigue, testicular atrophy, gynaecomastia, infertility or other features of androgen deficiency. Repeat an unexpectedly low result before diagnosing hypogonadism","Use the laboratory range and clinical context — cut-offs vary between assays and guidelines. BSSM/EAU thresholds (around 8 and 12 nmol/L) are decision aids, not diagnostic laws; SHBG and calculated free testosterone where borderline. A low result alone does not diagnose hypogonadism or mandate treatment"],
         ["<b>If testosterone repeatedly low → LH + FSH</b>","High LH/FSH = primary hypogonadism (testicular failure). Low or inappropriately normal = secondary — does not automatically need pituitary MRI; consider MRI with marked or persistent hyperprolactinaemia, other pituitary hormone abnormalities, visual-field symptoms, headache, or on specialist advice","Localises the axis defect"],
         ["<b>Prolactin</b>","If secondary hypogonadism, low libido, gynaecomastia or pituitary symptoms. Hyperprolactinaemia (stress, antipsychotics, macroprolactinoma) suppresses testosterone. Repeat if elevated, exclude stress and review medicines before acting; follow local endocrine laboratory guidance rather than a single universal MRI threshold","The pituitary door"],
         ["<b>TSH</b>","Both hypo- and hyperthyroidism cause ED; hypothyroidism also reduces testosterone synthesis","Check with fatigue or thyroid features"],
         ["<b>PSA</b>","Consider with DRE per NG12 (ED is listed as a reason to consider it), after discussing benefits and limitations; exclude or manage UTI/prostatitis first. Checked before testosterone therapy (contraindicated in active prostate cancer)","<b>Above the NG12 age-specific threshold (40–49 &gt;2.5 · 50–59 &gt;3.5 · 60–69 &gt;4.5 · 70–79 &gt;6.5 micrograms/L; under 40 or over 79 clinical judgement) → consider suspected cancer referral</b>. A raised PSA is not diagnostic of cancer"],
         ["<b>Cardiovascular</b>","Assess exercise tolerance and cardiovascular symptoms; formal CVD risk assessment (QRISK3) where appropriate. Active cardiac symptoms, unstable cardiovascular disease or uncertain exercise capacity → cardiovascular assessment before sexual activity or PDE5 inhibitor treatment. Routine ECG, ABPM or exercise testing is not required solely because of ED in a stable, asymptomatic patient","Princeton III/EAU is a risk-stratification approach, not a requirement for universal cardiology investigation"],
         ["<b>When NOT to investigate</b>","Young healthy man with clearly psychogenic ED (sudden, situational, morning erections preserved, identifiable precipitant): does not automatically need a large endocrine panel — keep cardiovascular risk assessment proportionate","Investigation follows probability"]
       ]}
     ]},

    {id:"ladder", nav:"Treat", title:"Treatment — the PDE5 ladder, hormones, and second-line options", sub:"First-line for organic and mixed ED regardless of cause — while correcting the cause in parallel. Verify all doses against the BNF, current SPC and GM formulary. Second-line treatments are specialist-led.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1st line", title:"Sildenafil 50 mg on demand", when:"most men — generic, cheap, effective", fromLabel:"start here",
          html:"Approximately 1 hour before sexual activity; high-fat meals can delay absorption; grapefruit is a potential interaction; maximum once daily. Adjust to 25–100 mg according to efficacy and adverse effects. Requires sexual stimulation. Before declaring failure, check timing, dose, sexual stimulation, food, adherence and number of attempts — several attempts at the maximum tolerated dose. Generic sildenafil is listed in Drug Tariff Part VIIIA and is the GM formulary first choice (no SLS endorsement; check local quantity guidance); sildenafil 50 mg is also a pharmacy (P) medicine (Viagra Connect, men 18+)."},
         {step:"Alternative", title:"Tadalafil — for spontaneity", when:"GM formulary second choice", fromLabel:"if timing is the problem",
          html:"10 mg on demand, increasing to 20 mg if required, with a 36-hour window — or 5 mg once daily in selected patients. Choose on-demand or daily dosing by sexual frequency, preference, tolerability, cost and clinician experience. Generic tadalafil (and vardenafil) are listed in Drug Tariff Part VIIIA — generically written NHS prescriptions do not need SLS endorsement (since 1 October 2025); branded Cialis® remains SLS-restricted. No nitrate for at least 48 hours after a dose."},
         {step:"Alternative", title:"Vardenafil 10 mg", when:"sildenafil side effects", fromLabel:"third option",
          html:"25–60 minutes before activity, titrate to 20 mg. Avoid in patients with congenital QT prolongation or taking class IA or class III antiarrhythmics. Routine ECG before vardenafil is not required in every patient; seek specialist advice where cardiac risk is uncertain. No nitrate for at least 24 hours after a dose."},
         {step:"Endocrine", title:"Testosterone replacement", when:"confirmed clinical and biochemical hypogonadism", fromLabel:"often with endocrine input",
          html:"Initiate only after confirmed biochemical and clinical hypogonadism with the cause established — not simply for ED with one low result. Discuss fertility, prostate risk, haematocrit, cardiovascular status and adverse effects; specialist-guided initiation; contraindicated in active prostate cancer (PSA first). Preparation and dose per product information and the local shared-care protocol, with a documented monitoring plan. May improve libido and PDE5 response in hypogonadal men; not a routine add-on for PDE5 non-response where testosterone is normal."},
         {step:"2nd line", title:"Alprostadil", when:"PDE5i contraindicated or failed", fromLabel:"urology-initiated",
          html:"Refer to urology/andrology for intracavernosal or intraurethral alprostadil — initiated, taught and titrated by a trained specialist service, not GP-initiated. Alprostadil remains subject to SLS restrictions on NHS prescription."},
         {step:"Device", title:"Vacuum erection device", when:"all drugs fail, or drugs unsuitable", fromLabel:"SLS-restricted on the NHS",
          html:"A reasonable non-drug option, including where PDE5 inhibitors are contraindicated. Vacuum pumps and constriction rings are SLS-restricted appliances on NHS prescription (Drug Tariff). Patients need instruction and appropriate equipment; constriction rings must not stay on longer than the manufacturer's recommended duration; caution in bleeding disorders or anticoagulated patients. Device fitting, penile Doppler assessment and penile prosthesis discussion — urology/andrology."}
       ]},
       {b:"warn", html:"<b>Medication-induced ED:</b> review whether the medicine is temporally associated with ED and whether a clinically appropriate alternative exists. Do not stop beta-blockers, antidepressants or antihypertensives abruptly — discuss changes with the clinician responsible for the underlying condition. Specific alternatives depend on heart failure, ischaemic heart disease, arrhythmia, depression severity, seizure risk, weight, blood pressure and renal function."},
       {b:"kv", rows:[
         ["NHS (SLS) prescribing","In England, generic sildenafil, tadalafil and vardenafil are listed in Drug Tariff Part VIIIA and can be prescribed generically without SLS endorsement. Branded Viagra®, Cialis® and Levitra® remain subject to the historical SLS restrictions for ED; alprostadil and certain other branded ED products remain SLS-restricted; vacuum pumps and constriction rings remain SLS-restricted appliances (Part IXA). SLS qualifying conditions include diabetes, MS, Parkinson's, polio, prostate cancer, spinal cord injury, renal failure, severe pelvic injury, single-gene neurological disease, radical prostatectomy, and prostate/rectal cancer treatment. Do not assume any listed treatment is NHS-prescribable without qualification — follow the current Drug Tariff (Part XVIIIB), the GM formulary (generic sildenafil first choice, generic tadalafil second) and any SLS endorsement requirement; otherwise private scripts or OTC sildenafil"],
         ["The counselling set","Requires sexual stimulation · high-fat meals delay sildenafil · grapefruit is a potential interaction · not more than once a day · never with nitrates, nicorandil or poppers (no nitrate for 24 hours after sildenafil/vardenafil/avanafil, 48 hours after tadalafil) · several correctly timed attempts at the maximum tolerated dose before 'failure'"],
         ["Side effects","Headache · flushing · dyspepsia · nasal congestion · dizziness · visual disturbance (particularly sildenafil). Sudden visual or hearing loss → stop the drug and seek urgent assessment; future use to be decided with specialist input"]
       ]},
       {b:"warn", html:"PDE5 inhibitors are contraindicated with nitrates (including poppers), nicorandil and riociguat — profound hypotension. Alpha-blockers: haemodynamically stable first, lowest PDE5-inhibitor dose, monitor for postural hypotension — dose separation does not eliminate the interaction. Avoid or seek advice in recent MI or stroke, unstable angina, and significant aortic stenosis. Many 'PDE5 failures' are administration errors — recheck technique, dose and stimulation before every escalation."},
       {b:"say", html:"These tablets work with arousal, not instead of it — take one about an hour before, not straight after a big meal, and give it a proper chance: several tries at the right dose. One vital rule: never combine them with nitrate heart medicines or poppers. If you ever get a painful erection that lasts four hours or more, that is an emergency — go to A&amp;E straight away. And because the same blood-vessel changes that cause this can affect the heart, we're also going to check your blood pressure, sugar and cholesterol properly."}
     ]},

    {id:"lifestyle", nav:"Lifestyle", title:"Lifestyle — vascular treatment in its own right", sub:"These interventions improve cardiovascular health and may improve erectile function. Trial figures depend on small studies, populations and outcome definitions — they are not guaranteed individual outcomes.",
     blocks:[
       {b:"table", head:["Measure","Advice","Why"], rows:[
         ["<b>🏃 Physical activity</b>","<b>Regular moderate-to-vigorous activity</b>","Improves endothelial function and cardiovascular health and may improve erectile function"],
         ["<b>⚖️ Weight loss</b>","<b>Individualised, achievable weight-management plan where appropriate</b> — no fixed BMI target is a prerequisite","May improve erectile function; reduces aromatisation of testosterone to oestrogen"],
         ["<b>🚭 Smoking</b>","Cessation — NHS Stop Smoking referral","Independent ED risk factor via endothelial dysfunction; cessation improves cardiovascular health and may improve ED"],
         ["<b>🍺 Alcohol</b>","<b>&lt;14 units/week with alcohol-free days</b>","Chronic excess → hypogonadism, neuropathy, testicular atrophy; acute excess → transient ED in healthy men"],
         ["<b>🥗 Healthy diet</b>","For example a Mediterranean pattern — olive oil, fish, legumes, vegetables, nuts","Part of the intensive lifestyle arm of one RCT in obese men (Esposito, JAMA 2004) that improved erectile function"],
         ["<b>🚴 Cycling</b>","<b>Modify prolonged cycling</b>","Perineal pressure may contribute — no-nose ergonomic saddle, padded shorts, standing intervals"],
         ["<b>🧠 Psychosexual therapy</b>","CBT + sensate-focus exercises; COSRT-registered therapist","<b>Combined PDE5i + psychotherapy is superior to either alone</b>; involve the partner where possible"],
         ["<b>😴 Sleep / OSA</b>","<b>Screen with STOP-BANG</b>","Optimise sleep and treat obstructive sleep apnoea — OSA is associated with ED and low testosterone"]
       ]}
     ]},

    {id:"loop", nav:"Not responding?", title:"Not responding? Run this loop before escalating", sub:"Many 'PDE5 failures' are technique, dose, or an untreated cause.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"1 · Technique", html:"Timing? Adequate dose? Sexual stimulation? Food? Adherence? Several correctly timed attempts at the maximum tolerated dose?"},
         {tone:"amber", h:"2 · Testosterone", html:"<b>Hypogonadism confirmed (symptoms + repeat low morning testosterone) and treated?</b> Testosterone may improve PDE5 response in hypogonadal men — it is not a routine add-on where testosterone is normal."},
         {tone:"amber", h:"3 · Drugs and lifestyle", html:"Possible culprit medicines reviewed with the responsible clinician? Smoking, alcohol, weight, activity, sleep and cycling addressed?"},
         {tone:"amber", h:"4 · Psychological", html:"Performance anxiety or relationship conflict → psychosexual therapy alongside the tablet."},
         {tone:"amber", h:"5 · True failure", html:"Persistent ED despite correctly used PDE5 inhibitors at the maximum tolerated dose → urology/andrology: alprostadil, vacuum device fitting, penile Doppler or prosthesis discussion."}
       ]}
     ]},

    {id:"monitor", nav:"Monitor", title:"Follow-up — response AND cardiovascular surveillance", sub:"Every review has two jobs: is the treatment working, and is the heart being watched.",
     blocks:[
       {b:"table", head:["When","What","Action"], rows:[
         ["<b>About 4–8 weeks</b>","After starting or changing treatment: re-score IIEF-5; efficacy and adherence; side effects (headache, flushing, dyspepsia, nasal congestion, dizziness, visual changes); administration technique; cardiovascular symptoms; new psychological barriers","Optimise dose or switch"],
         ["<b>3 months</b>","CVD risk actions if antihypertensive/statin started; reassess testosterone only where borderline or abnormal; weight/BMI/waist; HbA1c if diabetic; lifestyle progress","The cause-side review"],
         ["<b>6–12 months</b>","Annual cardiovascular review — BP, lipids, HbA1c, weight, smoking; IIEF-5 re-score","<b>Consider stepping the PDE5i down if lifestyle gains are significant</b>"],
         ["<b>On testosterone</b>","Initiated only after confirmed biochemical and clinical hypogonadism, with a documented monitoring plan. Monitor testosterone level, symptoms, haematocrit, prostate risk and BP according to the product information and the local endocrinology/urology shared-care protocol","<b>Haematocrit &gt;0.54 is an important action threshold</b> — review dose, formulation, adherence and secondary causes; withhold or adjust treatment and seek specialist advice (not automatically venesection). PSA action thresholds per the adopted shared-care guideline"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"📞 999", html:"Chest pain or breathlessness during sex — stop and call 999, telling clinicians when a PDE5 inhibitor was taken · painful erection lasting 4 hours or more · syncope or severe hypotension after a PDE5 inhibitor."},
         {tone:"amber", h:"🟠 Same-day", html:"Sudden vision or hearing loss after a PDE5 inhibitor → stop the drug and arrange urgent assessment; future use to be decided with specialist input (NAION — non-arteritic anterior ischaemic optic neuropathy — is rare but serious) · painful erection approaching 4 hours, recurrent, or after intracavernosal treatment → urgent urology advice."},
         {tone:"blue", h:"🩺 Routine", html:"Persistent ED despite optimal drugs → formal psychosexual referral (partner involvement improves outcomes; COSRT directory) · annual CV review · testosterone monitoring bloods."}
       ]},
       {b:"why", html:"Annual cardiovascular review in men with ED detects new T2DM, hypertension and dyslipidaemia — ED is a gateway into preventive medicine, and its association with cardiovascular risk is the reason the follow-up schedule never drops the heart half of the job."}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — who, when, how urgently", sub:"Most ED is primary care. These are the exceptions.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999 / emergency", html:"Painful erection lasting 4 hours or more · acute coronary syndrome or haemodynamic instability · syncope or severe hypotension after a PDE5 inhibitor · acute urinary retention · suspected sepsis."},
         {tone:"red", h:"Same-day", html:"Concerning cardiac symptoms · persistent painful erection approaching 4 hours (urgent urology advice — aspiration and phenylephrine are specialist emergency treatments) · suspected acute prostatitis with systemic illness · severe penile or testicular pain · suspected testicular malignancy (urgent scrotal ultrasound) · haematospermia with perineal pain."},
         {tone:"purple", h:"Suspected cancer pathway referral · NICE NG12", html:"ED is one of the symptoms for which NICE advises considering PSA and DRE. It does not itself mandate suspected-cancer referral. Discuss PSA benefits and limitations; exclude or manage UTI/prostatitis first. A prostate that feels malignant on DRE → prostate suspected cancer pathway referral; PSA above the age-specific threshold (40–49 &gt;2.5 · 50–59 &gt;3.5 · 60–69 &gt;4.5 · 70–79 &gt;6.5 micrograms/L) → consider suspected cancer referral. A solid intratesticular mass or unexplained testicular enlargement → urgent scrotal ultrasound and urological assessment via the local suspected testicular-cancer pathway; do not delay imaging.", src:"NICE NG12 recs 1.6.1–1.6.3 (updated April 2026)"},
         {tone:"amber", h:"Routine urology / andrology", html:"Persistent ED despite correctly used PDE5 inhibitors · suspected Peyronie's disease with significant curvature or pain · post-prostatectomy ED requiring rehabilitation · penile deformity or hypospadias affecting function · complex or recurrent priapism · suspected vascular or neurogenic ED · desire for injection therapy, vacuum device fitting or prosthesis discussion."},
         {tone:"blue", h:"Endocrinology", html:"Confirmed secondary hypogonadism · persistent significant hyperprolactinaemia · suspected pituitary disease · unexplained hypogonadism · fertility concern where testosterone treatment might suppress spermatogenesis."},
         {tone:"blue", h:"Cardiology", html:"Active cardiac symptoms, unstable cardiovascular disease or uncertain exercise capacity (Princeton III, e.g. recent MI, unstable angina, NYHA 3–4 heart failure, uncontrolled hypertension) → cardiovascular assessment before sexual activity or PDE5 inhibitor treatment. Not needed routinely for stable, asymptomatic men."},
         {tone:"cream", h:"Psychosexual therapy", html:"Predominantly psychogenic ED · failed PDE5i in a young man · relationship conflict · sexual trauma · performance anxiety · patient prefers a non-drug approach."},
         {tone:"green", h:"GP manages", html:"ED with metabolic risk factors (address the risks + PDE5i) · psychogenic ED with explanation and counselling · medication-induced ED (review the culprit with the responsible clinician) · the whole monitoring schedule (testosterone therapy via a documented shared-care plan)."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only — the Casebook keeps the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 54-year-old taxi driver books a 'medication review' and, hand on the door, mentions his erections have been failing for a year. He smokes 20/day, has a BMI of 33, and takes atenolol and bendroflumethiazide for blood pressure. He gets tight-chested pushing the wheelchair ramp. He asks simply for 'the blue pill'."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Handles the door-handle disclosure with permission-giving (<b>PLISSIT</b>); elicits exertional chest tightness and defers the PDE5i pending angina assessment (Princeton III); checks the repeat list for <b>nitrates</b>; recognises <b>atenolol and the thiazide as possible contributors</b> and plans a review with whoever manages his BP, without stopping them abruptly; arranges <b>HbA1c, lipids and CVD risk assessment</b>, with morning testosterone only if hypogonadal features; <b>considers and discusses PSA + DRE (NG12), including PSA benefits and limitations</b>; frames ED as an <b>early cardiovascular warning</b> without catastrophising; commits to <b>smoking cessation and weight referral as treatment</b>, not garnish; and safety-nets <b>priapism and the nitrate rule</b> in plain words. <a href='../../cases/erectile-dysfunction.html'>Open the full casebook chapter →</a>"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Named sources. Doses and contraindications: check the current SPC and local formulary — proprietary references are not the dose source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>EAU Guidelines on Sexual and Reproductive Health (2026 limited update; 2023 ED recommendations remain relevant, international)</b><br><a href="https://uroweb.org/guidelines" rel="noopener">uroweb.org/guidelines</a><span class="rd"> \u2014 the 50\u201380% organic-component estimate, classification, work-up and cardiovascular risk-stratification framework</span></li>'+
         '<li><b>BSSM \u2014 British Society for Sexual Medicine: current ED and adult testosterone deficiency guidance (check the version date)</b><br><a href="https://www.bssm.org.uk" rel="noopener">bssm.org.uk</a><span class="rd"> \u2014 UK practice: testosterone decision thresholds, PDE5 trial rules, referral routes</span></li>'+
         '<li><b>Princeton III Consensus (2012, international)</b><span class="rd"> \u2014 cardiovascular risk stratification before PDE5-inhibitor initiation; the high-risk deferral list (a risk-stratification approach, not universal cardiology investigation)</span></li>'+
         '<li><b>Vlachopoulos C et al., Circ Cardiovasc Qual Outcomes 2013</b><span class="rd"> \u2014 meta-analysis of 14 cohort studies: ED associated with increased risk of cardiovascular events — a population association, not an individual prediction</span></li>'+
         '<li><b>Esposito K et al., JAMA 2004</b><span class="rd"> \u2014 lifestyle (weight-loss, diet and exercise) RCT in 110 obese men: IIEF 13.9 \u2192 17.0 vs 13.5 \u2192 13.6; normal function regained in 31% vs 5%</span></li>'+

         '<li><b>NICE NG12 \u2014 Suspected cancer (updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> \u2014 recommendations 1.6.1–1.6.3: consider PSA and DRE in men with ED; malignant DRE → referral; age-specific PSA thresholds; testicular masses</span></li>'+
         '<li><b>NHS Drug Tariff (current, October 2026) \u2014 Part VIIIA (generic sildenafil, tadalafil, vardenafil), Part XVIIIB (Selected List Scheme: branded products, alprostadil) and Part IXA (vacuum pumps and constriction rings, SLS-restricted)</b><br><a href="https://www.nhsbsa.nhs.uk/pharmacies-gp-practices-and-appliance-contractors/drug-tariff" rel="noopener">nhsbsa.nhs.uk \u2014 Drug Tariff</a><span class="rd"> \u2014 NHS prescribing rules and SLS endorsement</span></li>'+
         '<li><b>GMMMG Formulary \u2014 Obstetrics, gynaecology and urinary-tract disorders</b><br><a href="https://www.greatermanchesterformulary.nhs.uk" rel="noopener">greatermanchesterformulary.nhs.uk</a><span class="rd"> \u2014 generic sildenafil first choice, generic tadalafil second; local restrictions for other ED treatments</span></li>'+
         '<li><b>Summaries of Product Characteristics \u2014 sildenafil, tadalafil, vardenafil, testosterone, alprostadil</b><br><a href="https://www.medicines.org.uk/emc" rel="noopener">medicines.org.uk/emc</a><span class="rd"> \u2014 doses, contraindications, interactions and nitrate intervals</span></li>'+
         '<li><b>MHRA Drug Safety Update \u2014 finasteride</b><span class="rd"> \u2014 reported persistent sexual dysfunction and psychiatric adverse reactions</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> \u2014 verify all doses and interactions before prescribing</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Primary-care assessment and management of erectile dysfunction \u2014 EAU 2026 (2023 ED recommendations), BSSM, Princeton III, NICE NG12 (updated April 2026) for considering PSA and DRE, NHS Drug Tariff and GMMMG formulary for prescribing. Second-line treatments are specialist-led. Assessment and management are merged on this page; the former algorithm is retired. Verify every dose and interaction against the current BNF before prescribing."
