MG.render({
  icon:"👁️",
  title:"Age-Related Macular Degeneration",

  stemTitle:"AMD — a working day matters for wet disease; honesty and support matter for the rest",
  stemSub:"The macula service treats AMD; the GP decides how fast someone gets there. New distortion or a fall in central vision in an older adult should be treated as suspected late AMD until specialist assessment, while keeping alternative diagnoses in mind, and NICE NG82 wants it with a macula service within 1 working day. Around that one decision sit the conversations only primary care tends to have: smoking, whether the shop-bought eye vitamins are worth it, hallucinations the patient is too frightened to mention, certification, falls, and whether they can still drive. NICE NG82 (2018) · NICE QS180 (2019) · NICE TA155, TA294, TA672, TA800, TA1022 · GMMMG anti-VEGF commissioning statement · DVLA.",
  guideline:"NICE NG82 (January 2018) · NICE QS180 (2019) · NICE TA155, TA294, TA672, TA800, TA1022 · GMMMG interim commissioning statement for anti-VEGF treatments (October 2025) · AREDS (2001) and AREDS2 (2013) trials · DVLA Assessing fitness to drive (visual disorders)",
  meta:[
    {t:"NICE NG82 · 2018"},

  ],
  lead:"<div class='mg-layers'><a href='#flags'><b>Red flags</b><small>Distortion = 1 working day</small></a><a href='#types'><b>Early or late?</b><small>The NG82 language</small></a><a href='#treat'><b>Anti-VEGF</b><small>A specialist decision</small></a><a href='#living'><b>Living with AMD</b><small>Smoking, vitamins, support</small></a><a href='#refer'><b>Refer</b><small>At the right speed</small></a></div>",
  quickSub:"The six points that change what you do in the room. Each traces to a source listed under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"Suspected wet AMD → macula service within 1 working day", html:"New visual distortion (straight lines bending), a new central blur or grey patch, or a fall in reading vision in someone over about 50 should be treated as suspected <b>late AMD (wet active)</b> until specialist assessment, keeping alternative diagnoses in mind. NICE NG82 asks for an <b>urgent referral to a macula service, normally within 1 working day</b>, whether or not the person reports impaired vision. It does not need to go through an emergency department. Use the local direct route (often via an optometrist with OCT or a rapid-access macular clinic) rather than a routine ophthalmology letter. Do not delay urgent referral to perform acuity, Amsler or other non-essential tests.", src:"NICE NG82 (2018)"},
    {tone:"amber", h:"Treatment should start within 14 days of referral", html:"Once late AMD (wet active) is confirmed and anti-VEGF is appropriate, NG82 says to treat <b>as soon as possible and within 14 days of referral</b> to the macula service, and QS180 makes this a quality statement. Every day lost before referral eats into that window. Chase a referral that has gone quiet.", src:"NICE NG82 (2018) · NICE QS180 statement 3 (2019)"},
    {tone:"blue", h:"Say ‘early’ and ‘late’, not only ‘dry’ and ‘wet’", html:"Clinic letters use NG82’s <b>early</b> and <b>late</b> categories. For GP purposes there are four: <b>early/intermediate AMD</b> without new symptoms; <b>late AMD dry</b> (geographic atrophy); suspected <b>late AMD wet active</b> (the urgent category); and <b>wet inactive or scarred</b> disease, which NG82 says should not be called ‘dry AMD’. Detailed grading needs slit-lamp examination or imaging and is the eye service’s job. A letter that says ‘dry AMD’ does not mean the eye cannot convert.", src:"NICE NG82 (2018)"},
    {tone:"cream", h:"Stopping smoking is the one thing the patient controls", html:"NICE NG82 risk factors include age, family history, smoking, hypertension, BMI of 30 kg/m² or more, a diet low in omega-3/omega-6, vitamins, carotenoids and minerals, a high-fat diet, lack of exercise and AMD in the other eye; smoking is the most clearly modifiable. Offer stop-smoking support at every contact, particularly when one eye is already affected. The link between smoking and supplements matters too: <b>beta-carotene raised lung-cancer risk in smokers</b> in two large trials, so current or previous smokers should avoid beta-carotene-containing formulations unless specifically advised otherwise.", src:"NICE NG82 (2018) · College of Optometrists (AMD risk factors) · ATBC trial, NEJM 1994 · CARET, NEJM 1996"},
    {tone:"green", h:"Ask about hallucinations — and name Charles Bonnet syndrome", html:"People losing central vision can see vivid, silent images — faces, patterns, animals — while knowing they are not real. Many hide it, fearing dementia. NG82 lists the possibility of these hallucinations (<b>Charles Bonnet syndrome</b>) among the topics to discuss with people who have AMD. Naming it is often the most reassuring thing you do in the consultation.", src:"NICE NG82 (2018)"},
    {tone:"purple", h:"Driving: the patient has a legal duty to tell DVLA", html:"A Group 1 (car) driver must be able to read a number plate at <b>20 metres</b>, have acuity of at least <b>6/12 (decimal 0.5) with both eyes open</b>, glasses allowed, and meet the field standard. The driver must not drive and must notify DVLA if they cannot meet the legal acuity or visual-field standards, or if DVLA has requested notification; AMD affecting <b>both eyes</b>, or the only seeing eye, may require notification depending on its effect on acuity and field. Group 2 (bus and lorry) standards are <b>substantially stricter</b> — check the current DVLA requirements and notify where the condition may affect either eye or the required standards. Record the advice given.", src:"DVLA Assessing fitness to drive (visual disorders) · GOV.UK Eye conditions and driving"}
  ],
  pathwaySub:"Five moves, in this order. The first is the one that saves sight.",
  pathway:[
    {title:"Is this new, central and distorted?", html:"Ask about <b>new distortion</b> (door frames, tiles, text bending), a <b>new central smudge or blank</b>, colours looking washed out, and how fast it came on. If available and within competence, record visual acuity in each eye separately with usual correction, and use an Amsler chart if you have one — but do not delay urgent referral to perform these tests. Painless, recent, central change in an older adult should be treated as <b>suspected late AMD (wet active)</b> until specialist assessment, while keeping alternative diagnoses in mind.", alert:true},
    {title:"Refer at the right speed", html:"Suspected late AMD (wet active): <b>macula service within 1 working day</b> (NICE NG82). Sudden profound painless loss, a curtain or field defect, or new flashes with a shower of floaters (consider retinal artery occlusion, retinal detachment or vitreous haemorrhage), or visual symptoms with GCA features: <b>same-day</b> — these are not AMD pathways. Stable, long-standing, slowly progressive central loss already known to the eye service: routine review and support."},
    {title:"Know what the eye clinic will do", html:"OCT confirms or excludes neovascular disease (fluorescein angiography only if OCT cannot). Anti-VEGF treatment is specialist-led: the macula service will determine eligibility and treatment choice using the relevant NICE appraisal, SPC and local commissioning policy (in Greater Manchester, the current GMMMG anti-VEGF commissioning statement)."},
    {title:"Support the person, not just the macula", html:"Smoking cessation. An honest answer about supplements. Ask about hallucinations, falls, low mood, and managing medicines and money. Low-vision services (registration is not required), the eye clinic liaison officer (ECLO) and a <b>certificate of vision impairment (CVI)</b> as soon as the person is eligible (NICE QS180 statement 6)."},
    {title:"Safety-net the other eye and the road", html:"Anyone with AMD in one eye is at risk in the other. Teach them to check each eye separately and to act on new distortion the same way. Give the DVLA advice and document it."}
  ],
  sections:[
    {id:"flags", nav:"Red flags", title:"Red flags — speed of referral decides the outcome", sub:"Wet AMD damages the macula over days to weeks, and the result of anti-VEGF depends on how much vision is left when treatment starts.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 New distortion or central loss — suspected wet active AMD", html:"New metamorphopsia, a central scotoma, micropsia or a noticeable fall in reading vision over days or weeks. <b>Urgent referral to a macula service, normally within 1 working day</b>, even if the person says their vision is fine. NG82 is explicit that this is urgent rather than an emergency: it does not need a same-day A&amp;E attendance, but it must not wait for a routine clinic.", src:"NICE NG82 (2018)"},
         {tone:"red", h:"🔴 Sudden painless profound loss — same day, different pathway", html:"<b>Same-day eye assessment</b> for sudden profound painless visual loss, a curtain or field defect, or new flashes with a shower of floaters — consider retinal artery occlusion, retinal detachment or vitreous haemorrhage. <b>Suspected retinal artery occlusion or transient monocular visual loss:</b> also consider the stroke/TIA pathway and urgent vascular assessment. <b>Suspected retinal vein occlusion:</b> urgent ophthalmology assessment, but not automatically an emergency unless there is severe visual loss, neovascularisation, severe pain or raised intraocular pressure.", src:"College of Optometrists CMGs (sudden loss of vision, retinal detachment)"},
         {tone:"red", h:"🔴 Over 50 with headache, scalp tenderness or jaw claudication", html:"In a person over 50 with new visual symptoms (visual loss, diplopia or amaurosis) plus headache, scalp tenderness, jaw claudication, constitutional symptoms or polymyalgia symptoms, treat as suspected giant cell arteritis. Arrange <b>same-day</b> ophthalmology, rheumatology or acute medical assessment, take inflammatory markers and <b>start corticosteroids immediately</b> according to the local Greater Manchester GCA pathway. Do not delay treatment while awaiting imaging or specialist review — and do not let an AMD label on the record distract you.", src:"BSR guideline on giant cell arteritis (2020) · local GCA pathway"},
         {tone:"amber", h:"🟠 A known AMD patient with a new change", html:"Anyone already under the macula service (including those told their eye is ‘dry’ or ‘inactive’) who notices new distortion or a drop in vision should be re-seen quickly. Contact the macula service directly using the route on the clinic letter — do not wait for the next routine review or submit a routine GP referral.", src:"NICE NG82 (2018)"}
       ]},
       {b:"why", html:"<b>Why 1 working day and not 1 week?</b> Older referral habits often allowed up to a week for ‘fast-track’ macula referrals. NG82 set the benchmark at 1 working day for the referral and 14 days from referral to first treatment. Untreated neovascular lesions leak, bleed and scar; once the fovea is scarred, anti-VEGF can no longer restore it and the eye stops meeting the treatment criteria."}
     ]},

    {id:"history", nav:"Assess", title:"Assessment in primary care", sub:"You will not confirm AMD without imaging, but a focused history and simple tests tell you how fast to act.",
     blocks:[
       {b:"table", head:["Ask or check","What you are looking for","Changes what"], rows:[
         ["<b>Onset and tempo</b>","Days to weeks (neovascular) versus months to years (early or dry disease)","Recent change → 1 working day referral"],
         ["<b>Distortion</b>","Straight edges bending; words dropping out of a line; faces looking wrong","The single most useful symptom for wet disease"],
         ["<b>Each eye separately</b>","The good eye masks the bad one — many notice only when they cover an eye","Test and teach monocular checking"],
         ["<b>Acuity</b>","If available and within competence: acuity in each eye separately with the usual glasses (pinhole if none)","Do not delay urgent referral to test; below 6/12 binocular raises the driving question"],
         ["<b>Amsler chart</b>","Wavy lines, missing areas, a distorted centre","Supports referral; a normal Amsler result does not rule out wet AMD"],
         ["<b>Other causes</b>","Diabetic macular oedema, retinal vascular occlusion, retinal detachment, optic neuropathy, other macular disease, recent cataract surgery, drugs such as hydroxychloroquine, central serous chorioretinopathy in younger adults","Different pathway; still refer promptly if central vision is falling"],
         ["<b>Function and safety</b>","Reading, medicines, money, cooking, falls, driving, living alone, mood","Low-vision, social care and ECLO referral; DVLA advice"],
         ["<b>Hallucinations</b>","Formed images, patterns, people — with insight","Name Charles Bonnet syndrome; not a sign of dementia or psychosis on its own"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"🧪 The Amsler chart — useful, not reassuring", html:"The Amsler grid is cheap and quick and a clearly distorted result supports urgent referral. But the NG82 evidence review found self-monitoring with an Amsler chart has <b>low sensitivity</b> compared with OCT, so a normal grid does not cancel a convincing history. The College of Optometrists describes it as the only widely available standardised home self-monitoring tool — useful, provided patients also act on symptoms.", src:"NICE NG82 evidence review (2018) · College of Optometrists"},
         {tone:"blue", h:"🔬 What confirms it", html:"NG82: offer <b>optical coherence tomography (OCT)</b> to people with suspected late AMD (wet active); offer <b>fundus fluorescein angiography</b> only if OCT does not exclude neovascular disease, and not if examination and OCT already exclude it. Many areas route suspected wet AMD through community optometrists with OCT who can refer directly to the macula service.", src:"NICE NG82 (2018)"}
       ]}
     ]},

    {id:"types", nav:"Classification", title:"Early and late AMD — the NG82 language", sub:"Clinic letters now use this classification. Detailed drusen grading needs slit-lamp examination or imaging and belongs to optometry and ophthalmology; the GP-facing categories below tell you what to do.",
     blocks:[
       {b:"table", head:["Category (GP-facing)","GP action"], rows:[
         ["<b>Early/intermediate AMD without new symptoms</b>","Smoking advice, cardiovascular risk management, routine optometry follow-up; act on new symptoms"],
         ["<b>Late AMD dry / geographic atrophy</b>","Low-vision and rehabilitation support; urgent reassessment if new symptoms — it can still convert to wet"],
         ["<b>Late AMD wet active — suspected</b>","Macula-service referral within 1 working day"],
         ["<b>Wet inactive / scarred disease</b>","Follow the eye-service plan; new distortion or visual decline requires rapid re-access. NG82 says do not call this ‘dry AMD’"]
         
         
         
         
         
         
         
       ]},
       {b:"why", html:"Patients are often told ‘you have the dry type, nothing can be done’ and stop paying attention to new symptoms. The NG82 classification makes clear that early and dry disease can progress to wet active disease, which is treatable. The practical message is the same for everyone with AMD: <b>new distortion means an urgent call, not the next routine appointment</b>."}
     ]},

    {id:"treat", nav:"Anti-VEGF", title:"What happens in the macula service", sub:"Treatment is specialist-led, but GPs are asked about it constantly — and adherence to an injection schedule is a primary-care conversation.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Step 1", title:"Confirm wet active disease", when:"within days of referral", fromLabel:"OCT ± angiography",
          html:"OCT first; fluorescein angiography only if OCT leaves neovascular disease unresolved (NICE NG82). The aim is to start treatment in an eligible eye within 14 days of referral (NG82; QS180 statement 3)."},
         {step:"Step 2", title:"Intravitreal anti-VEGF", when:"as decided by the macula service", fromLabel:"specialist-led",
          html:"Anti-VEGF treatment is specialist-led. Eligibility depends on the individual drug’s NICE technology appraisal — <b>ranibizumab (TA155)</b>, <b>aflibercept (TA294)</b>, <b>brolucizumab (TA672)</b>, <b>faricimab (TA800)</b>, <b>bevacizumab gamma (TA1022)</b> — its marketing authorisation, clinical findings, OCT, visual acuity, structural damage and the local commissioning pathway. <b>Do not apply the eligibility criteria for one anti-VEGF agent automatically to another.</b> The macula service will determine eligibility and treatment choice using the relevant NICE appraisal, SPC and local commissioning policy; TA1022 asks services to use the least expensive suitable option."},
         {step:"Step 3", title:"Outside the usual criteria", when:"acuity worse than 6/96", fromLabel:"specialist judgement",
          html:"NG82 allows anti-VEGF to be considered in eyes with acuity <b>worse than 6/96</b> if it is expected to improve overall visual function — for example when the affected eye is the better-seeing eye."},
         {step:"Not offered", title:"Photodynamic therapy alone", when:"wet active AMD", fromLabel:"do not offer",
          html:"NG82: do not offer photodynamic therapy alone, or as a first-line adjunct to anti-VEGF, for late AMD (wet active); as a second-line adjunct only within a trial."},
         {step:"Ongoing", title:"Monitoring and injections", when:"often for years", fromLabel:"adherence",
          html:"Treatment and monitoring intervals are set by the macula service. Missed visits risk reactivation and permanent loss. Help with transport, carers’ time, anxiety about injections and other appointments that clash."}
       ]},
       {b:"warn", html:"<b>Greater Manchester commissioning note:</b> drug choice is determined by the treating macula service in accordance with NICE technology appraisals, NHS England best-value biological-medicine policy and the current GMMMG interim commissioning statement for anti-VEGF treatments (October 2025) — first line biosimilar ranibizumab or aflibercept 2 mg (the biosimilar where available); second line aflibercept 8 mg (where licensed) or faricimab; third line brolucizumab or bevacizumab gamma (where licensed). <b>GPs should not recommend a specific anti-VEGF agent or imply that a newer agent is automatically clinically superior.</b> The NG82 finding of no clinically significant difference between agents reflects the 2018 evidence base and does not override current local commissioning, newer evidence, updated SPC warnings or specialist judgement."},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"⚠️ After an injection — what needs a same-day call", html:"After an intravitreal injection, severe or increasing eye pain, marked redness, photophobia, worsening vision or increasing floaters (possible endophthalmitis or inflammation) requires same-day contact with the treating eye unit or its emergency number. Do not wait for a routine GP appointment. The treating eye unit remains responsible for post-injection complications and should give the patient an emergency contact route. <b>Brolucizumab</b> has specific safety concerns, including intraocular inflammation, retinal vasculitis and retinal vascular occlusion; maintenance treatment must not be given more frequently than every 8 weeks after the first three doses.", src:"SPC: ranibizumab, aflibercept, faricimab (endophthalmitis warning) · MHRA Drug Safety Update (brolucizumab) · RCOphth emergency eye care (2024)"},
         {tone:"blue", h:"ℹ️ Dry and wet inactive AMD", html:"NICE NG82 recommends no drug treatment for late AMD (dry), and the anti-VEGF appraisals (NICE TA155, TA294, TA672, TA800, TA1022) cover wet active disease only. The work is rehabilitation, low-vision aids and support, plus prompt action if new distortion suggests conversion to wet disease.", src:"NICE NG82 (2018)"}
       ]}
     ]},

    {id:"living", nav:"Living with AMD", title:"Risk factors, supplements and everyday advice", sub:"The consultations after diagnosis are where primary care makes the biggest difference.",
     blocks:[
       {b:"cards", items:[
         {tone:"cream", h:"🚭 Smoking", html:"NICE NG82 risk factors include age, family history, smoking, hypertension, BMI of 30 kg/m² or more, a diet low in omega-3/omega-6, vitamins, carotenoids and minerals, a high-fat diet, lack of exercise and AMD in the other eye; smoking is the most clearly modifiable. Refer to the local stop-smoking service. For someone with one affected eye, the fellow eye is the reason to stop now.", src:"NICE NG82 (2018) · College of Optometrists, Optometry in Practice (modifiable risk factors for AMD)"},
         {tone:"amber", h:"💊 AREDS-type supplements — what the evidence does and does not say", html:"<b>NICE does not recommend routine antioxidant or zinc supplementation for all patients with AMD</b>; NG82 made only a <b>research recommendation</b> on antioxidant and zinc supplements for early AMD at high risk of progression. Some ophthalmology services may recommend an AREDS2-type preparation for selected patients with intermediate AMD or advanced AMD in one eye — a specialist discussion. The AREDS trials studied these selected groups; they do not show that over-the-counter vitamins improve established wet AMD or geographic atrophy. AREDS2 (JAMA 2013) replaced beta-carotene with lutein and zeaxanthin. <b>Do not initiate or prescribe AREDS-type supplements routinely in general practice</b> — the Greater Manchester formulary lists multivitamin/mineral preparations marketed for AMD as not routinely prescribed in primary care. If the patient is considering self-purchase, advise discussion with the eye service. Supplements do not replace referral or anti-VEGF treatment.", src:"NICE NG82 research recommendation (2018) · GMMMG Formulary · AREDS Report No. 8, Arch Ophthalmol 2001 · AREDS2, JAMA 2013"},
         {tone:"red", h:"🚫 No beta-carotene for current or previous smokers", html:"Beta-carotene supplements increased lung-cancer incidence in male smokers (ATBC trial) and in smokers and asbestos-exposed workers (CARET trial). If a patient is choosing a supplement, steer them away from beta-carotene-containing formulations if they are a current or previous smoker, unless specifically advised otherwise.", src:"ATBC Study Group, NEJM 1994 · Omenn et al. (CARET), NEJM 1996"},
         {tone:"green", h:"🥬 Diet and general health", html:"Discuss smoking, blood-pressure control, weight, physical activity and general dietary quality (green leafy vegetables, fruit, oily fish). Avoid implying that diet or supplements are proven treatments for established AMD. Cardiovascular risk-factor management is appropriate for general health, though its direct effect on AMD progression is less certain.", src:"AREDS2, JAMA 2013 (dietary lutein and zeaxanthin)"},
         {tone:"green", h:"💡 Making the most of remaining vision", html:"Bright, directed task lighting; high-contrast labels; large-print or audio formats; magnifiers from the low-vision service; phone and tablet accessibility settings. Remove trip hazards and ask about falls.", src:"NICE QS180 (2019) · NICE NG82 (2018)"},
         {tone:"cream", h:"🧠 Mood and isolation", html:"Losing reading and face recognition is a bereavement for many people. Ask about low mood and loneliness, and involve family, voluntary-sector sight-loss services and social care where the person wants it.", src:"NICE NG82 (2018) — information and support"}
       ]},
       {b:"say", html:"There are two sides to this. The part we can do something about is the ‘wet’ change, which can be treated with injections if it is caught quickly — so if straight lines ever start to bend or a new smudge appears, ring the eye clinic the same day, not at your next appointment. The other side is making daily life easier and protecting the eyes you have: stopping smoking is the biggest single thing, and I’m happy to talk honestly about the eye vitamins."}
     ]},

    {id:"support", nav:"Support and CVI", title:"Information, certification and low-vision services", sub:"NG82 and QS180 treat information and support as part of the treatment, not an afterthought.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"📄 Certificate of vision impairment", html:"QS180 statement 6: adults with serious eye disorders should be given a <b>certificate of vision impairment</b> as soon as they are eligible, including while active treatment is continuing, with information about the support that follows. Certification is completed by a consultant ophthalmologist and leads to registration as sight impaired or severely sight impaired with the local council, which opens access to rehabilitation and some concessions.", src:"NICE QS180 statement 6 (2019)"},
         {tone:"green", h:"🗂️ Topics NG82 asks us to cover", html:"The diagnosis and what it means for daily life; what treatment can and cannot achieve; the possibility of <b>visual hallucinations (Charles Bonnet syndrome)</b>; the benefits and entitlements that come with certification and registration; and signposting to other sources of support. Information should be in an accessible format at the first appointment and whenever asked for.", src:"NICE NG82 (2018)"},
         {tone:"cream", h:"🤝 Eye clinic liaison officer and rehabilitation", html:"The ECLO in the eye clinic links patients to emotional and practical support. Council sensory-impairment and rehabilitation teams provide mobility training, daily-living skills and home assessments. Low-vision clinics provide magnifiers and training in how to use them. <b>Access to low-vision services does not require the patient to be registered as sight impaired</b> — refer when visual impairment is affecting function, independence, reading, mobility or safety.", src:"NICE NG82 (2018) — low vision services"},
         {tone:"blue", h:"👁️ Charles Bonnet syndrome — how to explain it", html:"Formed visual hallucinations in someone with significant sight loss, with preserved insight and no other psychiatric or neurological features. Explain that the brain is filling in missing input. Look for other causes (delirium, dementia, drugs, Parkinson’s disease) if insight is lost or other symptoms appear.", src:"NICE NG82 (2018)"}
       ]}
     ]},

    {id:"driving", nav:"Driving", title:"Driving and the DVLA — a statutory duty", sub:"The legal duty to tell DVLA rests with the driver; the clinician’s job is to advise clearly and record it.",
     blocks:[
       {b:"table", head:["Standard","Group 1 (car, motorcycle)","Group 2 (bus, lorry)"], rows:[
         ["<b>Number plate</b>","Read a standard number plate at <b>20 metres</b>, with glasses or contact lenses if needed","As Group 1, plus the stricter acuity standard"],
         ["<b>Acuity</b>","At least <b>6/12 (decimal 0.5)</b> with both eyes open, or in the only eye","At least 6/7.5 in the better eye and 6/60 in the other (DVLA Group 2 standard)"],
         ["<b>Field</b>","At least 120° horizontally (at least 50° to each side), with specified vertical extent and limits on defects in the central field — check the full current DVLA standard; a simplified threshold is not enough to decide licensing","Stricter field standard with specified horizontal and vertical extents and central-field limits — check the full current DVLA standard"],
         ["<b>When to tell DVLA</b>","Must not drive and must notify if they cannot meet the acuity or field standards, or if DVLA has requested notification; AMD in <b>both eyes</b> (or the only eye) may require notification depending on its effect on acuity and field","Substantially stricter standards — check the DVLA requirements and notify where the condition may affect either eye or the required visual standards"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"purple", h:"⚖️ The driver’s duty", html:"Drivers must meet the eyesight standard at all times. If they may not meet the standard, they must stop driving and check the current DVLA requirements. They must tell DVLA if they cannot meet the acuity or field standard, if DVLA has requested notification, or if a GP, optometrist or eye specialist has told them they may not meet the standard; AMD in both eyes (Group 1) or either eye (Group 2) may require notification depending on its effect on vision. Failing to report a condition that affects driving can lead to a fine of up to £1,000. DVLA may arrange an eyesight test with one of its contracted opticians.", src:"GOV.UK Eye conditions and driving · DVLA Assessing fitness to drive (visual disorders)"},
         {tone:"purple", h:"⚖️ If the patient keeps driving", html:"1. Explain the legal standard. 2. Advise the patient to stop driving if they do not meet it. 3. Encourage self-notification. 4. Explain that you may need to notify DVLA if they refuse or fail to do so and there is a continuing public-safety risk. Record each step. If they still drive, follow the current GMC confidentiality guidance on reporting concerns to DVLA: tell them you intend to disclose, then contact the DVLA medical adviser.", src:"DVLA Assessing fitness to drive · GMC Confidentiality: patients’ fitness to drive (2017)"}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — who, when, how", sub:"Most of the value of primary care in AMD sits in getting this speed right.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same day — not AMD pathways", html:"Sudden profound painless loss, a curtain or field defect, or new flashes with a shower of floaters (retinal artery occlusion, retinal detachment or vitreous haemorrhage) → same-day eye assessment; suspected retinal artery occlusion or transient monocular visual loss → also the stroke/TIA pathway. Visual symptoms with GCA features → same-day assessment and immediate corticosteroids per the local GCA pathway. Suspected retinal vein occlusion → urgent ophthalmology assessment. Severe pain, marked redness, photophobia or worsening vision after an intravitreal injection → the treating eye unit’s emergency line.", src:"College of Optometrists CMGs · BSR GCA guideline (2020) · RCOphth emergency eye care (2024)"},
         {tone:"red", h:"Within 1 working day — suspected wet active AMD", html:"New distortion, new central scotoma or a recent fall in central vision → <b>urgent referral to a macula service, normally within 1 working day</b>, via the local rapid-access or optometrist-with-OCT route. It is urgent, not an A&amp;E emergency.", src:"NICE NG82 (2018)"},
         {tone:"amber", h:"Rapid re-access — known AMD with new symptoms", html:"Contact the macula service directly using the details on the clinic letter; do not wait for the next scheduled visit.", src:"NICE NG82 (2018)"},
         {tone:"cream", h:"Routine — slow change and support needs", html:"Gradual central loss without distortion → optometrist review, with referral per local pathway. Low-vision clinic, ECLO, council rehabilitation team and certification for anyone whose sight loss limits daily life.", src:"NICE NG82 (2018) · NICE QS180 (2019)"},
         {tone:"blue", h:"Local route — complete for your practice", html:"Macula service / approved OCT referral route: ____________ · Macula-service emergency contact: ____________ · Local GCA pathway: ____________ · Same-day eye assessment route: ____________"}
       ]},
       {b:"say", html:"I’d like the eye specialists to see you within a working day, because the type of change you are describing can be treated with injections and the sooner that starts, the more sight it protects. It isn’t an A&amp;E emergency, but it isn’t something to leave either. If it gets suddenly much worse, or you see a curtain or lots of new floaters, contact us or the eye unit straight away."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card; the Casebook holds full teaching cases.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 78-year-old widow says the lines on her crossword ‘went wobbly’ in her right eye four days ago. She was told two years ago she had ‘the dry type, nothing to be done’, so she nearly didn’t come. She still drives to the shops, smokes ten a day, and asks quietly whether seeing ‘children in the garden who aren’t there’ means she is losing her mind."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Recognises new distortion as <b>suspected wet active AMD</b> despite the ‘dry’ label; arranges a <b>macula-service referral within 1 working day</b> and explains why; checks <b>acuity in each eye</b> if available, without delaying referral; names <b>Charles Bonnet syndrome</b> and reassures; gives <b>clear DVLA advice</b> and records it; raises <b>smoking</b> and warns against beta-carotene; safety-nets for sudden loss; offers <b>low-vision support</b>."}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Every recommendation above traces to one of these primary sources.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG82 — Age-related macular degeneration</b> (January 2018)<br><a href="https://www.nice.org.uk/guidance/ng82" rel="noopener">nice.org.uk/guidance/ng82</a><span class="rd"> — classification (early low/medium/high risk; late wet active, wet inactive, dry, indeterminate); urgent referral to a macula service normally within 1 working day for suspected late AMD (wet active), not an emergency referral; OCT, and fluorescein angiography only if OCT does not exclude neovascular disease; anti-VEGF within 14 days of referral; anti-VEGF may be considered below 6/96; no clinically significant difference between anti-VEGF agents (2018 evidence base); photodynamic therapy not offered alone or as first-line adjunct; information topics including Charles Bonnet syndrome and certification; research recommendation on antioxidant and zinc supplements; low sensitivity of Amsler self-monitoring (evidence review); risk factors including hypertension, BMI of 30 kg/m² or more, diet and lack of exercise. Check the NG82 webpage for current update and surveillance information before each scheduled review</span></li>'+
         '<li><b>NICE QS180 — Serious eye disorders</b> (February 2019)<br><a href="https://www.nice.org.uk/guidance/qs180" rel="noopener">nice.org.uk/guidance/qs180</a><span class="rd"> — statement 3: late AMD (wet active) starts treatment within 14 days of referral; statement 6: certificate of vision impairment as soon as eligible</span></li>'+
         '<li><b>NICE TA155 — Ranibizumab and pegaptanib for age-related macular degeneration</b> (2008)<br><a href="https://www.nice.org.uk/guidance/ta155" rel="noopener">nice.org.uk/guidance/ta155</a><span class="rd"> — pegaptanib is no longer a routine current treatment option</span></li>'+
         '<li><b>NICE TA294 — Aflibercept</b> (2013)<br><a href="https://www.nice.org.uk/guidance/ta294" rel="noopener">nice.org.uk/guidance/ta294</a></li>'+
         '<li><b>NICE TA672 — Brolucizumab</b> (2021)<br><a href="https://www.nice.org.uk/guidance/ta672" rel="noopener">nice.org.uk/guidance/ta672</a></li>'+
         '<li><b>NICE TA800 — Faricimab</b> (June 2022)<br><a href="https://www.nice.org.uk/guidance/ta800" rel="noopener">nice.org.uk/guidance/ta800</a></li>'+
         '<li><b>NICE TA1022 — Bevacizumab gamma</b> (December 2024)<br><a href="https://www.nice.org.uk/guidance/ta1022" rel="noopener">nice.org.uk/guidance/ta1022</a><span class="rd"> — eligibility for this agent: best-corrected acuity 6/12 to 6/96, no permanent structural damage to the central fovea, lesion 12 disc areas or less, recent disease progression; use the least expensive suitable option. Criteria are drug-specific and should not be assumed identical across appraisals</span></li>'+
         '<li><b>GMMMG — Interim commissioning statement for anti-VEGF treatments in ophthalmology</b> (modified October 2025)<br><a href="https://gmmmg.nhs.uk" rel="noopener">gmmmg.nhs.uk</a><span class="rd"> — first, second and third-line anti-VEGF choices in Greater Manchester</span></li>'+
         '<li><b>Greater Manchester Formulary</b> — high-cost ophthalmic medicines, best-value biological medicines, and AMD supplements (not routinely prescribed)<br><a href="https://www.greatermanchesterformulary.nhs.uk" rel="noopener">greatermanchesterformulary.nhs.uk</a></li>'+
         '<li><b>MHRA Drug Safety Update — Brolucizumab (Beovu): risk of intraocular inflammation and retinal vascular occlusion</b><br><a href="https://www.gov.uk/drug-safety-update" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> — retinal vasculitis and occlusion; maintenance doses no more often than every 8 weeks</span></li>'+
         '<li><b>Age-Related Eye Disease Study Research Group. AREDS Report No. 8.</b> Arch Ophthalmol 2001;119:1417–36<span class="rd"> — antioxidants plus zinc studied in selected people with intermediate AMD or advanced AMD in one eye; no benefit shown in little or no AMD</span></li>'+
         '<li><b>AREDS2 Research Group. Lutein + zeaxanthin and omega-3 fatty acids for age-related macular degeneration.</b> JAMA 2013;309:2005–15<span class="rd"> — lutein and zeaxanthin as a replacement for beta-carotene</span></li>'+
         '<li><b>ATBC Cancer Prevention Study Group.</b> NEJM 1994;330:1029–35 and <b>Omenn GS, et al. (CARET).</b> NEJM 1996;334:1150–5<span class="rd"> — beta-carotene increased lung-cancer incidence in smokers and asbestos-exposed workers</span></li>'+
         '<li><b>College of Optometrists</b> — Clinical Management Guidelines and Optometry in Practice review of modifiable risk factors for AMD<br><a href="https://www.college-optometrists.org/category-landing-pages/clinical-topics/amd" rel="noopener">college-optometrists.org</a><span class="rd"> — age, family history and smoking as established risk factors; the Amsler chart as the standard home self-monitoring tool despite limited sensitivity; sudden loss of vision and retinal detachment as same-day presentations</span></li>'+
         '<li><b>Royal College of Ophthalmologists — Age-related macular degeneration services: commissioning guidance</b> (2021; evidence base updated 2024)<br><a href="https://www.rcophth.ac.uk" rel="noopener">rcophth.ac.uk</a><span class="rd"> — service standards and referral routes for neovascular AMD</span></li>'+
         '<li><b>Royal College of Ophthalmologists — Emergency eye care in hospital eye units and secondary care</b> (15 May 2024)<br><a href="https://www.rcophth.ac.uk" rel="noopener">rcophth.ac.uk</a><span class="rd"> — communication channels, referral criteria and emergency contact routes, including after intravitreal injection</span></li>'+
         '<li><b>DVLA — Assessing fitness to drive: visual disorders</b>, and <b>GOV.UK — Eye conditions and driving</b><br><a href="https://www.gov.uk/guidance/visual-disorders-assessing-fitness-to-drive" rel="noopener">gov.uk</a><span class="rd"> — Group 1: 20 m number plate, 6/12 binocular, full field standard (horizontal and vertical extents, central defects); notify when the standards cannot be met; Group 2: at least 6/7.5 better eye and 6/60 poorer eye, stricter field; fine up to £1,000</span></li>'+
         '<li><b>DVLA — General information: assessing fitness to drive</b><br><a href="https://www.gov.uk/guidance/general-information-assessing-fitness-to-drive" rel="noopener">gov.uk</a><span class="rd"> — the driver’s legal duty to notify; clinicians advise and may need to notify if the patient cannot or will not</span></li>'+
         '<li><b>GMC — Confidentiality: patients’ fitness to drive and reporting concerns to the DVLA</b> (2017)<br><a href="https://www.gmc-uk.org" rel="noopener">gmc-uk.org</a><span class="rd"> — check the current version</span></li>'+
         '<li><b>BSR guideline on the diagnosis and treatment of giant cell arteritis</b> (Mackie SL, et al., Rheumatology 2020;59:e1–e23)<br><a href="https://doi.org/10.1093/rheumatology/kez672" rel="noopener">doi.org/10.1093/rheumatology/kez672</a><span class="rd"> — same-day assessment and immediate corticosteroids for suspected GCA with visual symptoms; use with the local Greater Manchester GCA pathway</span></li>'+

         '</ul></div>'}
     ]}
  ],
  foot:"Age-related macular degeneration in primary care — NICE NG82 (2018), NICE QS180 (2019), NICE TA155, TA294, TA672, TA800 and TA1022, the AREDS and AREDS2 trials, and DVLA visual standards. Treatment decisions, including anti-VEGF eligibility and drug choice under the GMMMG commissioning statement, belong to the macula service; check local referral routes. AMD is not a suspected-cancer pathway condition. Not a substitute for clinical judgement."
});
