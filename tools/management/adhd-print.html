  stemSub:"One page for the whole condition: confirm symptoms and impairment in two or more important settings, gather parent/carer and education or occupational information without delaying referral, offer ADHD-focused parent training first-line for under-5s as NG87 directs, then hold the shared-care prescribing safely — controlled-drug rules, NICE growth and cardiovascular monitoring, and the atomoxetine suicidality and liver warnings. Diagnosis and initiation are specialist; almost everything else is yours.",
  guideline:"NICE NG87 · DSM-5 · GMMMG shared care · Equality Act 2010",
  reviewed:"10 September 2026",
  nextReview:"10 March 2027",
  meta:[
    {t:"NICE NG87 — ADHD diagnosis and management (2018)"},
    {t:"NICE NG87 · DSM-5 criteria"},
    {t:"Misuse of Drugs Regs — Schedule 2 CD"},
    {t:"Equality Act 2010 — reasonable adjustments"},

    {t:"v1.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#severe"><b>Before referring</b><small>Two or more settings · red flags</small></a><a href="#confirm"><b>Recognise</b><small>DSM-5 · girls · adults</small></a><a href="#workup"><b>Refer well</b><small>Referral content · cardiac risk</small></a><a href="#ladder"><b>Treat</b><small>First steps by age</small></a><a href="#monitor"><b>Shared care</b><small>CD rules · growth</small></a></div>',
  quickSub:"If you read nothing else on this page, read these six cards. Every number traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Two or more important settings, with impairment", html:"ADHD symptoms should be pervasive, occurring in at least two important settings, such as home, education, work, relationships or social situations, and should cause at least moderate functional impairment, with several symptoms present before age 12. For children, obtain information from parents/carers and education wherever possible. For adults, explore childhood history and current impairment across work, relationships, home and social settings. <b>Diagnosis is not made solely from rating scales or observational data</b> — it needs a full clinical, psychosocial, developmental and psychiatric assessment."},
    {tone:"amber", h:"Gather school information — but do not delay referral", html:"Obtain parent/carer and education reports or rating scales where feasible, but do not delay referral solely because a school questionnaire is unavailable. Conners, SNAP-IV, NICHQ Vanderbilt and the Strengths and Difficulties Questionnaire are examples used locally — helpful adjuncts, not NICE-mandated forms. <b>A rating scale cannot establish or exclude ADHD on its own.</b>"},
    {tone:"blue", h:"First-line drugs differ between children and adults", html:"Children and young people: methylphenidate first-line; switch to lisdexamfetamine if a 6-week trial of methylphenidate at an adequate dose is inadequate. Adults with confirmed ADHD and persistent significant impairment despite environmental modifications: NICE recommends lisdexamfetamine <b>or</b> methylphenidate as first-line pharmacological options. Dosing and titration must follow the current product information (SPC), BNF and the local shared-care protocol."},
    {tone:"green", h:"First steps differ by age", html:"<b>Under 5s:</b> ADHD-focused group parent-training programme first-line; seek specialist advice if significant impairment persists. <b>No medication under 5 without a second opinion from a specialist ADHD service.</b> <b>Age 5 and over:</b> offer ADHD-focused information and support, implement environmental and educational modifications, and refer for specialist assessment where impairment persists; medication is offered if persistent significant impairment remains after modifications have been implemented and reviewed. <b>Adults:</b> consider environmental modifications and offer medication when significant impairment persists, with psychological support where appropriate. Encourage regular physical activity, sleep optimisation and structured routines — these do not replace specialist assessment or indicated pharmacological treatment."},
    {tone:"green", h:"ADHD may be under-recognised in girls", html:"ADHD may be under-recognised in girls, particularly where inattentive symptoms predominate and disruptive behaviour is absent: quiet, dreamy, disorganised, underachieving. Anxiety is a common comorbidity that the school may blame instead. <b>Consider masking, compensatory strategies and internalised distress.</b>"},
    {tone:"cream", h:"Schedule 2 rules, and the \u201czombie\u201d fear", html:"Methylphenidate, lisdexamfetamine and dexamfetamine are Schedule 2 controlled drugs. Prescribing must comply with current controlled-drug legislation, including quantity, dose, formulation, prescription validity (generally 28 days; quantity not normally more than 30 days' treatment) and safe storage. Follow the NHS Greater Manchester shared-care protocol and practice controlled-drug policy; do not make dose changes or initiate treatment in primary care without specialist instruction. The \u201czombie effect\u201d parents fear is a dose-dependent effect — the answer is a specialist dose review, not stopping."}
  ],
  pathwaySub:"The whole task in five moves. The first two determine how long the family waits.",
  pathway:[
    {title:"Screen the differential and the red flags", html:"Symptoms in one setting only · absence seizures · hearing or vision impairment · safeguarding or trauma · sleep disorder · learning disability · significant comorbidity. ADHD is a diagnosis of pattern, not of disruptiveness.", alert:true},
    {title:"Confirm the pattern in two or more settings", html:"≥6 of 9 inattentive and/or ≥6 of 9 hyperactive-impulsive symptoms, several present before age 12, lasting ≥6 months, in ≥2 important settings (home, education, work, relationships, social), with at least moderate functional impairment. Consider under-recognised inattentive presentations in girls and adult persistence."},
    {title:"Refer properly", html:"Symptoms and functional impairment, duration and developmental onset, parent/carer information, school or occupational information where available (do not delay referral waiting for a questionnaire), developmental and psychiatric history, sleep, comorbidities, safeguarding concerns, and relevant physical and family history. No routine ECG — cardiology advice before medication only when NICE cardiac red flags are present."},
    {title:"Start the non-pharmacological work now", html:"Parent training (first-line in under-5s), school SENCO involvement and a SEND support plan (which does not need a diagnosis), psychoeducation, sleep hygiene, regular physical activity and external structure. None of this waits for the specialist."},
    {title:"Then hold shared care safely", html:"Controlled-drug prescriptions under a current shared-care agreement, BP and pulse before and after dose changes and every 6 months, NICE age-specific height and weight checks plotted on growth charts, mood and appetite, and review at least annually by a clinician with ADHD expertise, with specialist advice for refractory symptoms."}
  ],
  sections:[

    {id:"severe", nav:"Before referring", title:"Red flags and the differential",
     sub:"ADHD is common, but several conditions mimic it and one of them is a seizure disorder.",
     blocks:[
       {b:"table", head:["Feature","Consider","Action"], rows:[
         ["<b>Symptoms in ONE setting only</b>","Home only: family dynamics, parenting stress, attachment difficulty, undetected learning difficulty. School only: anxiety, learning disability, sensory processing, bullying","Does not meet DSM-5 criteria — investigate the setting-specific cause rather than referring as ADHD"],
         ["<b>Brief staring episodes with unresponsiveness and abrupt return</b>","<b>Absence seizures</b> — frequently misread as inattention","<b>Refer to paediatric neurology; EEG is specialist-arranged</b>"],
         ["<b>Not responding when spoken to; speech or language delay</b>","Hearing impairment — including glue ear (otitis media with effusion, OME); visual impairment","<b>Formal hearing and vision testing before ADHD referral</b>"],
         ["<b>Sudden onset, regression, or behaviour change after a life event</b>","<b>Trauma, abuse, neglect, bereavement, domestic abuse</b>","<b>Safeguarding assessment.</b> ADHD is developmental and longstanding, not sudden"],
         ["<b>Loud snoring, witnessed apnoeas, restless sleep, daytime sleepiness</b>","<b>Obstructive sleep apnoea</b> — causes inattention and hyperactivity in children","<b>ENT referral; treating it may resolve the symptoms</b>"],
         ["Global developmental delay, difficulty across all cognitive domains, or fluctuating attention","<b>Learning disability; autism spectrum disorder</b> — both frequently coexist with ADHD","<b>Developmental paediatrics</b>"],
         ["<b>Very low mood, self-harm, or expressed hopelessness in an adolescent</b>","Depression, anxiety — either as comorbidity or as the primary diagnosis","Assess and treat the dominant condition first (NG87); screen with PHQ-9 in adolescents and adults. Elevated mood or grandiosity suggests mania — a different pathway, and stimulants may precipitate it"]
       ]},
       {b:"why", html:"<b>The two-or-more-settings requirement does much of the diagnostic work.</b> Symptoms should be pervasive across important settings — home, education, work, relationships or social situations — with at least moderate impairment. Where difficulties appear in one setting only, explore the setting-specific cause, including anxiety, learning disability and sensory issues. ADHD often persists into adulthood and runs in families, so a parent recognising themselves in the child's description is a common and clinically meaningful event."},
       {b:"dl", rows:[
         ["<b>Sudden change is not ADHD</b>","Sudden onset, regression or focal neurological symptoms are not typical of ADHD and require assessment through the appropriate paediatric or neurological pathway."]
       ]}
     ]},

    {id:"confirm", nav:"Recognise", title:"DSM-5 criteria, and the presentations that get missed",
     blocks:[
       {b:"dl", rows:[
         ["<b>DSM-5 requirements</b>","≥6 of 9 inattentive symptoms and/or ≥6 of 9 hyperactive-impulsive symptoms (5 in adults aged 17 and over), present for ≥6 months, with several present before age 12, occurring in ≥2 important settings (such as home, education, work, relationships or social situations), causing at least moderate functional impairment, and not better explained by another disorder"],
         ["<b>NICE NG87 — how diagnosis is made</b>","By a specialist, after a full clinical, psychosocial, developmental and psychiatric assessment — not solely from rating scales or observational data. In adults, symptoms should have begun during childhood, persisted throughout life, not be better explained by another psychiatric diagnosis, and be associated with moderate or severe impairment"],
         ["<b>Inattentive domain (9 symptoms)</b>","Fails to give close attention to detail · difficulty sustaining attention · does not seem to listen when spoken to directly · does not follow through on instructions · difficulty organising tasks · avoids tasks requiring sustained mental effort · loses things · easily distracted · forgetful in daily activities"],
         ["<b>Hyperactive-impulsive domain</b>","Fidgeting · leaving seat · running or climbing inappropriately · unable to play quietly · \u201con the go\u201d · talks excessively · blurts out answers · difficulty waiting turn · interrupts or intrudes"],
         ["<b>ADHD-I in girls — the missed presentation</b>","Inattentive presentation predominates in girls: dreamy, quiet in class, organisationally chaotic, academically underachieving despite good verbal ability, forgetting to hand work in. Less disruptive means less visible, so ADHD may be under-recognised in girls — consider compensatory strategies and internalised distress. Anxiety is a very common comorbidity, and schools frequently attribute the difficulties to anxiety or \u201clearning style\u201d instead. Masking is common"],
         ["<b>Adult ADHD</b>","Often presents after a child is diagnosed — \u201cI was exactly like him at school.\u201d Hyperactivity becomes inner restlessness; the impairment shows in work, relationships, finances and driving. <b>ADHD is a disability under the Equality Act 2010 where it substantially affects daily function, so reasonable adjustments apply at work. <b>Adults on stimulants must be advised about DVLA notification duties where the condition or its treatment affects safe driving</b></b>"],
         ["<b>Common comorbidities</b>","Autism spectrum disorder · anxiety · learning disability · oppositional defiant disorder · tic disorders and Tourette's · sleep disorders · in adolescents, substance misuse (a dual diagnosis pathway where significant)"]
       ]},
       {b:"say", html:"Before we go through anything clinical, I want to say one thing. ADHD is a neurodevelopmental condition — it is not caused by parenting, diet, screens or a lack of discipline. If this is what is going on, there is nothing you could have done differently. Nothing. Parents very often tell me they have been punishing a child for things that turned out to be symptoms, and I would rather say that out loud now than leave you carrying it."}
     ]},

    {id:"workup", nav:"Refer well", title:"What the GP does before referral",
     sub:"The quality of the referral determines how long the family waits. This is the highest-value part of the GP role.",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>Parent/carer and education information — where feasible</b>","Obtain parent/carer and education reports or rating scales where feasible, but <b>do not delay referral solely because a school questionnaire is unavailable</b>. <b>Conners, SNAP-IV, NICHQ Vanderbilt or the Strengths and Difficulties Questionnaire</b> are examples used locally — helpful adjuncts, not NICE-mandated forms. A rating scale cannot establish or exclude ADHD on its own. For adults, include occupational information where available"],
         ["<b>Parent-completed scale</b>","The same instruments, completed at home — the two settings are compared, not summed"],
         ["<b>History to include</b>","Symptoms and functional impairment · duration and developmental onset · developmental and birth history (prematurity, perinatal complications) · educational or occupational history and school reports · psychiatric history and comorbidities · relevant physical history · family history including any first-degree relative with ADHD · sleep · screen and diet history · psychosocial context, adverse childhood experiences and any safeguarding concerns · functional impairment in concrete terms"],
         ["<b>Examination</b>","Growth (height, weight, centiles — the pre-treatment baseline), BP and HR (note bradycardia), hearing and vision, goitre, dysmorphic features, neurological examination for tics. Check FBC and ferritin where there is pallor or dietary concern — iron deficiency causes inattention and restlessness"],
         ["<b>Cardiac assessment and ECG — when</b>","Obtain a detailed cardiovascular history and examination, including BP and pulse. <b>Do not request routine ECG.</b> Refer for cardiology advice before medication when NICE cardiac red flags are present — congenital heart disease or previous cardiac surgery · sudden death in a first-degree relative under 40 suggesting cardiac disease (or a known inherited cardiac condition) · exertional breathlessness · exertional or fright/noise-induced syncope · sudden-onset rapid regular palpitations · cardiac chest pain · signs of heart failure or a cardiac murmur · hypertension — or when another medicine or coexisting condition increases cardiac risk"],
         ["<b>Refer to</b>","Children and young people: the locally commissioned specialist ADHD service, such as community paediatrics, CAMHS or a specialist paediatric ADHD team — check the current Greater Manchester referral criteria. Adults: a specialist adult ADHD or mental-health service trained in ADHD diagnosis and treatment. Under-5s: ADHD-focused parent-training programme first-line; seek specialist advice if significant impairment persists. Do not diagnose ADHD or initiate medication in primary care where ADHD is only suspected"],
         ["<b>Start non-pharmacological support now</b>","<b>Do not wait for the appointment.</b> A <b>SEND support plan can be initiated without a diagnosis</b>; SENCO involvement, parent training and school adjustments can all begin immediately"]
       ]},
       {b:"why", html:"<b>A GP-supporting letter strengthens an EHCP application</b>, and academic accommodations such as extra time in exams require documented evidence of diagnosis — so the paperwork the GP generates has direct educational consequences. School adjustments alone can substantially narrow the gap between a child's potential and their performance: preferential seating, shorter task chunks, movement breaks, visual timers, homework adjustments and exam accommodations."}
     ]},

    {id:"ladder", nav:"Treat", title:"NG87 stepped management — non-drug first",
     sub:"Medication is specialist-initiated. Everything above it in the ladder is available to the GP today.",
     blocks:[
       {b:"ladder", steps:[
         {step:"All ages", title:"Psychoeducation and environmental structure", when:"from first suspicion",
          html:"Psychoeducation is a first-line component for all ages. NG87: consider CBT for young people who have benefited from medication but still have significant impairment; offer adults who choose not to take medication, cannot tolerate it or have residual impairment a structured supportive psychological intervention focused on ADHD, which may include CBT. Psychoeducation reduces shame, improves adherence and self-esteem, and makes the family active partners. <b>ADHD UK (adhduk.org) and ADDISS (addiss.co.uk).</b> Explain it to the child too: children who understand their diagnosis self-advocate and self-manage significantly better. External scaffolding compensates for the executive function deficit — visual daily schedule, homework station, task timers, colour-coded timetable, equipment checklist at the door."},
         {step:"Under 5s, and parent support at any age", title:"Parent training programme", when:"NG87 first-line",
          fromLabel:"before any medication",
          html:"NG87: an ADHD-focused group parent-training programme is first-line for under-5s, and parents of older children are offered ADHD-focused support alongside environmental modifications before medication. No medication under 5 without a second specialist opinion. Group-based, evidence-based programmes; referral via the local pathway. Decisions are shared with the family throughout, and omega-3 supplementation has been studied but is not recommended."},
         {step:"All ages", title:"Physical activity, sleep and school adjustments", when:"alongside everything",
          fromLabel:"adjuncts, not substitutes",
          html:"Encourage regular physical activity, sleep optimisation and structured routines as part of general health and ADHD support. These measures do not replace specialist assessment or indicated pharmacological treatment. Avoid decongestants containing pseudoephedrine alongside stimulants. Medication timing, melatonin and sleep treatment follow specialist advice, the current SPC and the local formulary. SENCO, SEND support plan, EHCP where impairment is significant; children's centres and Sure Start for younger families."},
         {step:"Children 5–18", title:"Methylphenidate MR — specialist-initiated", when:"moderate–severe, or non-drug measures inadequate",
          fromLabel:"specialist diagnosis required",
          html:"Methylphenidate is first-line in children and young people; preparation, dosing and titration follow the specialist plan, the current product information, BNF for Children and the local shared-care protocol. Modified-release preparations cover school hours, reduce end-of-dose rebound and are once daily; titrate to the lowest effective dose. If inadequate after a 6-week trial at an adequate dose, switch to lisdexamfetamine. <b>Schedule 2 CD.</b>"},
         {step:"Adults", title:"Lisdexamfetamine or methylphenidate first-line", when:"confirmed adult ADHD, persistent significant impairment",
          fromLabel:"two first-line options",
          html:"For adults with confirmed ADHD and persistent significant impairment despite environmental modifications, NICE recommends lisdexamfetamine or methylphenidate as first-line pharmacological options. Dosing and titration must follow the current product information, BNF and the local shared-care protocol. Lisdexamfetamine (Elvanse) is a pro-drug of dexamfetamine, so lower misuse potential (it must be metabolised, and cannot be injected or snorted), with a long duration covering evening demands. <b>Also second-line in children.</b> If stimulants are not tolerated or are ineffective, atomoxetine; specialist advice for more complex or refractory treatment."},
         {step:"Non-stimulant", title:"Atomoxetine or guanfacine", when:"stimulants ineffective or not tolerated",
          fromLabel:"neither is a controlled drug",
          html:"In children and young people, atomoxetine or guanfacine may be considered after inadequate response or intolerance to stimulant treatment, in accordance with NG87 and specialist advice; in adults, atomoxetine if stimulants are not tolerated or are ineffective. <b>Guanfacine should not be initiated in adults without tertiary ADHD service advice (off-label use).</b> Comorbid anxiety, tics or substance misuse need individualised specialist assessment, slower titration and more frequent monitoring — no option is universally preferred. Seek a second opinion or tertiary referral when symptoms are unresponsive to one or more stimulants and one non-stimulant. Atomoxetine (Strattera) — a noradrenaline reuptake inhibitor; doses per the current SPC, BNF and shared-care protocol. Takes 4–6 weeks for full effect — warn the family explicitly, because stopping early is the commonest reason it \u201cfails\u201d. SPC warning: suicidal thoughts and behaviour — monitor closely, particularly early in treatment and after dose changes, and arrange urgent clinical assessment for suicidal thoughts or behaviour. Dexamfetamine — third-line and specialist-initiated, a Schedule 2 CD with higher misuse potential than lisdexamfetamine, used only where methylphenidate and lisdexamfetamine have both failed or are not tolerated. <b>Guanfacine MR (Intuniv)</b> — an alpha-2 agonist, an option in children and young people on specialist advice; sedation is common initially and usually settles over 2–4 weeks; <b>never stop abruptly (rebound hypertension)</b>."}
       ]},
       {b:"warn", html:"Methylphenidate, lisdexamfetamine and dexamfetamine are Schedule 2 controlled drugs. Prescribing must comply with current controlled-drug legislation, including quantity, dose, formulation, prescription validity and safe-storage requirements — the prescription is generally valid for 28 days and the quantity should not normally exceed 30 days' treatment. Follow the local NHS Greater Manchester shared-care protocol and practice controlled-drug policy, and give safe storage counselling — particularly where there is substance misuse in the household. Do not make dose changes or initiate treatment in primary care without specialist instruction; the GP prescribes on a shared care agreement after specialist titration. Contraindications for the stimulants: MAOI within 14 days, phaeochromocytoma, hyperthyroidism, severe arrhythmia, structural heart disease, severe hypertension."},
       {b:"why", html:"The adult–child first-line difference is the highest-yield prescribing distinction in ADHD and a common exam point: methylphenidate is first-line in children 5–18, while adults are offered lisdexamfetamine or methylphenidate first-line. On comorbidity, <b>NG87's principle is to treat the dominant condition first</b>: stimulants can worsen anxiety, but ADHD itself generates anxiety through repeated failure and disorganisation, so in practice methylphenidate often reduces anxiety by reducing the chaos — and if anxiety does worsen, seek specialist advice — comorbid anxiety needs individualised assessment, slower titration and more frequent monitoring. For tics, NICE NG87 offers the same medication choices as for other people with ADHD, so stimulants are not routinely withheld — the historical association is not well supported — but monitor, and seek specialist advice if tics worsen significantly (guanfacine is a specialist option in children and young people); never stop guanfacine abruptly — taper it."}
     ]},

    {id:"monitor", nav:"Shared care", title:"Monitoring, growth and the annual reassessment",
     blocks:[
       {b:"table", head:["What","Detail"], rows:[
         ["<b>At each clinical review</b>","Benefit and functional impairment · adherence · appetite · sleep · mood, and specifically \u201cis the child still himself?\u201d — a flat affect suggests the dose is too high (specialist dose review), not that the drug should stop · tics · substance misuse, diversion and safe storage · cardiovascular symptoms"],
         ["<b>BP and pulse</b>","Before and after each dose change and every 6 months (all ADHD medications) — not at every routine prescription request unless the local shared-care protocol requires it"],
         ["<b>Height and weight (NICE NG87 intervals)</b>","Height every 6 months in children and young people. Weight every 3 months in children aged 10 and under; at 3 and 6 months after starting treatment in children over 10 and young people, then every 6 months; every 6 months in adults. Plot children's height and weight on growth charts. Appetite suppression is dose-related; watch for growth faltering and for catch-up growth during a break. A dietitian can help where intake is poor"],
         ["<b>Atomoxetine</b>","<b>Monitor for suicidal thoughts and behaviour, particularly early in treatment and after dose changes (SPC warning); urgent clinical assessment if they occur.</b> Warn about liver injury: jaundice, dark urine, abdominal pain, unexplained nausea or malaise, pale stools or pruritus need urgent assessment and stopping atomoxetine while seeking specialist/medical advice, per the current SPC and the GMMMG atomoxetine shared-care protocol. Ask about sexual dysfunction in adolescents and adults. Routine LFTs are not needed unless clinically indicated or required by the local shared-care protocol. Give with food for nausea"],
         ["<b>Guanfacine — during titration</b>","BP and HR at baseline and after each dose increment, with weekly BP during titration. ECG if there are cardiac concerns (QTc prolongation at higher doses). Never stop abruptly"],
         ["<b>Annually</b>","Review at least annually by a clinician with ADHD expertise — a structured reassessment of ongoing need — a planned drug holiday can help judge whether medication is still required, as a joint decision with specialist, child and family. NICE NG87 makes no general recommendation for weekend or holiday drug holidays (it suggests a planned break over school holidays only when growth is significantly affected): continuous treatment supports social and emotional learning, not just academic performance"],
         ["<b>Prescribing practicalities</b>","Controlled-drug legal requirements (prescription generally valid for 28 days; quantity not normally more than 30 days' treatment), practice controlled-drug policy, named prescribing pharmacy in many trusts, safe storage. Prescribe only when a current shared-care agreement exists, specialist titration is complete, the medication and dose are clearly specified, responsibility for monitoring is defined and the specialist remains available for advice"],
         ["<b>Transition to adult services</b>","Plan early — the transition from paediatrics or CAMHS to adult ADHD services is a recognised point of disengagement and prescription lapse"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 Urgently seek specialist/medical advice", html:"Syncope, exertional chest pain, palpitations or marked breathlessness · new suicidal thoughts or behaviour · jaundice, dark urine or other suspected hepatic injury on atomoxetine · new seizures · severe weight loss or growth faltering · suspected misuse or diversion."},
         {tone:"amber", h:"🟠 Review the dose", html:"Flat affect or \u201cnot himself\u201d — specialist dose review, do not simply stop · weight loss or slowing growth · marked end-of-dose rebound irritability · new or worsening tics."},
         {tone:"blue", h:"⏳ Atomoxetine needs 4–6 weeks", html:"Say so at initiation and repeat at every review until the full effect is established — stopping early is the commonest reason it appears not to work."},
         {tone:"green", h:"📘 Support", html:"<b>ADHD UK (adhduk.org), ADDISS (addiss.co.uk)</b>, and school SENCO. For adults, reasonable adjustments at work under the Equality Act."}
       ]},
       {b:"say", html:"Two things about the medication. It is started by the specialist, but I will be the one prescribing it month to month, and there are rules about that — it is a controlled drug, so there are legal limits on how much I can prescribe at a time, usually about a month. And the worry you mentioned about him becoming \u201ca zombie\u201d: that flat, switched-off look is a sign the dose is too high, not a sign the medicine is wrong. If you ever see it, tell me — we look at the dose with the specialist. Meanwhile, plenty helps that is not tablets: a proper routine with visual reminders, regular physical activity and good sleep, and getting the school's support plan in place, which we can start now without waiting for the appointment."}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"Specialist ADHD service — children", html:"Children and young people with suspected ADHD and impairment in two or more settings: the locally commissioned specialist ADHD service, such as community paediatrics, CAMHS or a specialist paediatric ADHD team (check the current Greater Manchester referral criteria). Attach school information where available, but do not delay referral for it. Under-5s: ADHD-focused parent-training programme first-line; seek specialist advice if significant impairment persists."},
         {tone:"blue", h:"Adult ADHD / mental-health service", html:"Adults with suspected ADHD (a specialist trained in ADHD diagnosis and treatment), including those presenting after a child's diagnosis. Shared care agreement needed before the GP prescribes."},
         {tone:"red", h:"Urgent / same-day", html:"Suicidal ideation on atomoxetine · cardiac symptoms on a stimulant · safeguarding concern."},
         {tone:"blue", h:"Other specialists", html:"Paediatric neurology for suspected absence seizures · ENT for suspected OSA · audiology and ophthalmology before ADHD referral where hearing or vision is in doubt · developmental paediatrics for suspected autism or learning disability."},
         {tone:"cream", h:"GP management", html:"The history across two or more settings, with parent/carer and school information where feasible · pre-referral examination, growth baseline, cardiovascular history and cardiology advice where NICE red flags are present · parent training, SENCO and SEND referral · psychoeducation, sleep and physical activity advice · shared-care prescribing with BP and pulse and NICE age-specific growth monitoring · annual review by an ADHD-experienced clinician."}
       ]},
       {b:"why", html:"Two avoidable GP failings in this pathway are administrative rather than clinical: referrals that omit impairment across settings and the parent/carer and school information that is available, and letting non-pharmacological support wait for the specialist appointment. Both are within primary care's control — but <b>never hold a referral back solely because a school questionnaire has not come back</b>."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A mother attends with her 9-year-old son, referred by the school SENCO — bright but unable to sustain attention, fidgeting, calling out, losing equipment, unable to finish homework. The teacher has completed a Conners 3 with elevated scores in both domains. A paternal uncle has ADHD. She says <em>\u201cI thought he was just naughty; I kept punishing him for things that weren't his fault\u201d</em>, and is worried medication will make him \u201clike a zombie\u201d."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Addresses the maternal guilt explicitly and early — ADHD is not caused by parenting; confirms symptoms and impairment in two or more settings rather than accepting the school's account; includes the teacher Conners as supporting information, knowing no rating scale establishes or excludes ADHD; explains the NG87 stepped approach so she hears that, at 9, ADHD-focused support and environmental modifications come before medication; answers the \u201czombie\u201d fear accurately — a dose-dependent effect, for specialist dose review rather than stopping; <b>starts SENCO and SEND support now rather than waiting</b>; and — the step candidates miss — explores whether a parent recognises themselves, given that ADHD runs in families and many adults are diagnosed after their child."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>NICE NG87 — Attention deficit hyperactivity disorder: diagnosis and management (2018)<br><a href="https://www.nice.org.uk/guidance/ng87" rel="noopener">nice.org.uk/guidance/ng87</a><span class="rd"> — ADHD-focused group parent training first-line for under-5s and no medication under 5 without a second specialist opinion; methylphenidate first-line in children 5–18 and lisdexamfetamine or methylphenidate first-line in adults; the 6-week optimised-dose switch rule; treat the dominant condition first in comorbidity; the position on tics and on drug holidays</span></li>'+
         '<li><b>NICE NG87 \u2014 Attention deficit hyperactivity disorder: diagnosis and management</b><br><a href="https://www.nice.org.uk/guidance/ng87" rel="noopener">nice.org.uk/guidance/ng87</a><span class="rd"> — two or more important settings, full specialist assessment, rating scales as adjuncts only, guanfacine not for adults without tertiary advice, cardiac red flags, and age-specific monitoring intervals</span></li>'+
         '<li><b>NICE NG87 — full guideline and resources</b><br><a href="https://www.nice.org.uk/guidance/ng87/resources" rel="noopener">nice.org.uk/guidance/ng87/resources</a><span class="rd"> — adult diagnostic criteria and supporting evidence</span></li>'+
         '<li><b>NHS Greater Manchester (GMMMG) shared-care protocol for atomoxetine in children and adolescents (modified February 2026)</b><br><a href="https://gmmmg.nhs.uk" rel="noopener">gmmmg.nhs.uk</a><span class="rd"> — monitoring and liver-injury advice under shared care</span></li>'+
         '<li><b>NHS Greater Manchester (GMMMG) adult ADHD shared-care protocol — current version</b><br><a href="https://gmmmg.nhs.uk" rel="noopener">gmmmg.nhs.uk</a><span class="rd"> — confirm the current version on the GMMMG website rather than relying on the older 2019 protocol</span></li>'+
         '<li><b>DSM-5</b><span class="rd"> — the diagnostic criteria: ≥6 of 9 symptoms in either domain (5 in those aged 17 and over), ≥6 months, onset of several symptoms before age 12, in ≥2 settings, with functional impairment</span></li>'+
         '<li><b>Conners, SNAP-IV, NICHQ Vanderbilt and Strengths and Difficulties Questionnaire</b><span class="rd"> — examples used locally; helpful adjuncts, not NICE-mandated forms or diagnostic tests</span></li>'+
         '<li><b>Misuse of Drugs Regulations — Schedule 2 controlled drugs</b><span class="rd"> — prescriptions generally valid for 28 days, quantity not normally more than 30 days of treatment, safe storage requirements for methylphenidate, lisdexamfetamine and dexamfetamine</span></li>'+
         '<li><b>Equality Act 2010</b><span class="rd"> — ADHD as a disability where it substantially affects day-to-day activities, and the duty to make reasonable adjustments at work and in education</span></li>'+
         '<li><b>ADHD UK and ADDISS</b><br><a href="https://adhduk.org" rel="noopener">adhduk.org</a> · <a href="https://www.addiss.co.uk" rel="noopener">addiss.co.uk</a><span class="rd"> — patient and family psychoeducation resources</span></li>'+
         '<li><b>BNF and BNF for Children</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — methylphenidate (Concerta XL, Ritalin XL), lisdexamfetamine (Elvanse), dexamfetamine, atomoxetine (Strattera) and guanfacine MR (Intuniv) dosing, contraindications and monitoring; check doses against the current SPC (medicines.org.uk/emc) and local formulary</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"ADHD — NICE NG87 (2018), DSM-5, the Misuse of Drugs Regulations for Schedule 2 controlled drugs, and the Equality Act 2010. Diagnosis and medication initiation are specialist tasks; gather parent/carer and education information where feasible without delaying referral, and begin non-pharmacological support without waiting for the appointment. Verify all doses against the current BNF or BNF for Children before prescribing, and prescribe only under a current NHS Greater Manchester shared care agreement."
