  stemSub:"For <b>suspected or clinically diagnosed GTPS</b> in primary care. GTPS is lateral peritrochanteric hip pain, most commonly from gluteus medius/minimus tendinopathy, with or without bursopathy or partial tendon tearing. Confirm it with a focused hip, lumbar and neurological examination, and exclude intra-articular hip disease, fracture, systemic disease and referred spinal pain. <b>First-line care is education, reducing compressive load and progressive gluteal strengthening.</b> Analgesia supports rehabilitation; a corticosteroid injection gives short-term relief only and is selective; shockwave therapy is a specialist option under NICE special arrangements.",

  quickSub:"The five that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"blue", h:"A clinical syndrome, not a single pathology", html:"Lateral hip pain, worse lying on the affected side, on stairs and on single-leg loading, with <b>focal peritrochanteric tenderness and pain or weakness on resisted abduction</b>, and no dominant alternative diagnosis. Tenderness alone is not enough. Bilateral symptoms happen and do not by themselves suggest systemic disease."},
    {tone:"amber", h:"Think joint and spine, not just tendon", html:"Groin-dominant pain, painful or restricted internal rotation, catching or locking, or a positive impingement test → assess for intra-articular hip pathology. Back pain, dermatomal symptoms, a neurological deficit or pain reproduced by spinal movement → a spinal contribution. <b>Either can coexist with GTPS.</b>"},
    {tone:"green", h:"Education and progressive loading work best", html:"Reduce compressive load (no leg-crossing, no hanging on one hip, pillow between the knees), keep active, and progressively strengthen the hip abductors and extensors. This is the <b>preferred first-line treatment and the best longer-term strategy for most people</b>."},
    {tone:"amber", h:"Injection is an adjunct, not a cure", html:"A peritrochanteric corticosteroid injection can give short-term relief to enable rehabilitation, but recurrence is common. Consider it only after the diagnosis is secure and a structured programme has been tried — or earlier if pain is preventing rehabilitation. <b>A time point alone should not trigger an injection.</b>"},
    {tone:"red", h:"⚠ Red flags — not GTPS until proved otherwise", html:"Inability to weight-bear, severe pain after trauma, fracture risk (osteoporosis, long-term steroids), fever or a hot swollen area, unexplained weight loss, persistent night or rest pain, a history of cancer, a mass, or rapidly progressive symptoms."}

         ["<b>History</b>","Lateral hip pain, worse lying on that side, on stairs, hills, single-leg stance and prolonged walking or standing"],

    {id:"rehab", nav:"Rehab", title:"Step 3 — education and progressive loading",

         {tone:"green", h:"🏋️ The loading programme", html:"Isometric or low-irritability abductor loading first where needed → progressive strengthening of the hip abductors and extensors → functional single-leg loading → correction of movement and load patterns → graded return to walking, stairs, running or sport."},
         {tone:"blue", h:"⏳ An adequate trial", html:"Allow around 12 weeks of an adherent programme before judging it to have failed, reviewing sooner if pain is severe or function is significantly restricted. Weight loss, if overweight, reduces load."}

         {tone:"blue", h:"Physiotherapy or MSK", html:"Persistent symptoms affecting activity · difficulty implementing or progressing the loading · significant abductor weakness or movement-control problems · a structured return to sport or work."},
         {tone:"cream", h:"GP management", html:"The examination, the exclusions, the education and loading plan, analgesia and selective injection all belong here. Related pages: <a href='osteoarthritis.html'>osteoarthritis</a> · <a href='../algorithms/hip-pain.html'>hip pain pathway</a> · <a href='sciatica.html'>sciatica</a>."}
       ]},
       {b:"say", html:"This is pain from the tendons on the outside of the hip, usually from how the hip is loaded. It normally gets better with a strengthening programme and simple changes — not lying on that side, not crossing your legs, and not standing hanging on one hip. It can take a few months. An injection can help in the short term if the pain is stopping you doing the exercises, but the exercises are what do the lasting work. Come back if you can't put weight on the leg, if it's painful at rest or at night, or if you feel unwell."}

  foot:"Greater trochanteric pain syndrome (adults). A clinical syndrome of lateral hip pain, usually gluteal tendinopathy. Confirm it with a focused hip, lumbar and neurological examination and exclude intra-articular hip disease, fracture, systemic disease and referred spinal pain. First-line management is education, avoiding compressive loads and progressive gluteal strengthening; analgesia only supports rehabilitation. A corticosteroid injection gives short-term relief and should be selective, never a substitute for exercise. Image or refer for diagnostic uncertainty, marked weakness, a suspected tear, red flags or failure of an adequate programme. ESWT is a specialist option with uncertain benefit and risk, under NICE HTG248 special arrangements. Sources: NICE HTG248, local MSK pathway, BNF."
