  quickSub:"If you read nothing else on this page, read these five cards. Every figure traces to the source cited under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Ask about mood and suicidal thoughts when it matters", html:"When insomnia is severe or persistent, or comes with depression, acute stress, substance use or functional decline, ask about mood, hopelessness and suicidal thoughts. A positive answer needs a <b>direct clinical risk assessment</b> — PHQ-9 item 9 is not one. Active intent, imminent risk or inability to stay safe → urgent local mental-health or crisis assessment. <b>Reduced need for sleep</b> with elevated or irritable mood, energy, pressured speech or grandiosity suggests mania → same-day mental-health assessment."},
    {tone:"amber", h:"Assess for OSA — and act on sleepiness and driving", html:"Assess for OSA when there are two or more relevant features — snoring, witnessed apnoeas, choking, unrefreshing sleep, morning headaches, nocturia, fragmented sleep, cognitive impairment or sleepiness (NICE NG202). Epworth and STOP-BANG support the assessment; neither decides referral alone. <b>If excessive sleepiness is affecting driving, the patient must stop driving until it is controlled</b> (DVLA). Prioritise HGV/PSV and safety-critical workers. Use sedatives cautiously and individually in suspected OSA."},
    {tone:"blue", h:"CBT-I is first-line for chronic insomnia", html:"It tackles the behaviours and beliefs that keep insomnia going, and its benefit can last after treatment ends; hypnotics give mainly short-term symptom relief. Offer face-to-face or digital CBT-I (Sleepio, NICE MTG70, where commissioned) by availability, suitability and preference — after medical assessment where OSA, pregnancy or another sleep disorder is possible."},

    {id:"severe", nav:"Red flags", title:"Red flags — do not manage these as routine insomnia",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Suicide risk", html:"Ask about mood, hopelessness and suicidal thoughts when insomnia is severe, persistent, or comes with depression, acute stress, substance use or functional decline. A positive answer needs a direct assessment of thoughts, intent, plan, means, previous attempts and protective factors. Active intent, imminent risk, inability to maintain safety or severe self-neglect → urgent local mental-health or crisis assessment."},
         {tone:"red", h:"🔴 Mania", html:"<b>Reduced need for sleep</b> — not merely inability to sleep — with elevated or irritable mood, increased energy, pressured speech, grandiosity, impulsivity or psychotic symptoms → same-day mental-health assessment, particularly with psychosis, risk-taking, inability to self-care or risk to others."},
         {tone:"red", h:"🔴 Nocturnal chest pain or breathlessness", html:"Assess according to the acute chest pain, breathlessness or suspected heart-failure pathway — do not attribute these to insomnia."},
         {tone:"amber", h:"🟠 OSA and sleepiness", html:"Assess for OSA with two or more relevant features (NICE NG202). If excessive sleepiness is affecting driving, the patient must not drive until it is satisfactorily controlled (DVLA); vocational drivers need rapid assessment."},
         {tone:"amber", h:"🟠 Night sweats and systemic features", html:"Do not attribute persistent drenching night sweats to menopause or poor sleep without assessment. Take a focused history and examine; investigate according to the presentation rather than a fixed panel. See the NG12 card under <a href='#workup'>Work-up</a>."},
         {tone:"amber", h:"🟠 Nocturnal seizures", html:"Tongue biting, witnessed tonic-clonic movements, injury, incontinence or post-ictal confusion → urgent assessment via the first-seizure or neurology pathway."},
         {tone:"amber", h:"🟠 Substance withdrawal", html:"Alcohol, benzodiazepine or opioid withdrawal causes severe rebound insomnia — manage the withdrawal rather than sedating over it."}
       ]}
     ]},

    {id:"history", nav:"Characterise", title:"History — characterise the problem, then find the cause",
     blocks:[
       {b:"table", head:["Ask about","Detail","Why it matters"], rows:[
         ["<b>Type</b>","Sleep-onset vs sleep-maintenance vs early-morning waking","Onset with racing thoughts suggests anxiety, hyperarousal or delayed phase; maintenance suggests depression, pain, OSA, nocturia or alcohol. Early-morning waking should prompt assessment of mood, alcohol, circadian timing and medical symptoms — depression is one possible cause"],
         ["<b>Duration</b>","Acute (under 3 months, often triggered) vs chronic (3+ nights a week for 3+ months with daytime impairment)","Chronic insomnia is treated with CBT-I"],
         ["<b>2-week sleep diary</b>","Bedtime, time to fall asleep, time awake in the night, total sleep, rise time, naps, caffeine and alcohol","Estimates sleep efficiency and sets the sleep-restriction window"],
         ["<b>The cause list</b>","OSA · restless legs · depression, anxiety, PTSD · pain · nocturia · GORD · menopause · shift work or circadian mismatch · bipolar history · parasomnias, narcolepsy, seizures","Causes change over time — re-check at review"],
         ["<b>Substances</b>","Caffeine (including later in the day, tea, cola, energy drinks, caffeine-containing analgesics) · alcohol (fragments the second half of the night) · nicotine · cannabis","Common maintaining factors"],
         ["<b>Medicines</b>","SSRIs (consider morning dosing) · corticosteroids (morning) · beta-blockers · diuretics late in the day · decongestants · stimulants · recently stopped sedatives (rebound)","Adjust timing before adding anything"],
         ["<b>Expectations</b>","Sleep need varies and falls with age; brief waking in the night is normal","Unrealistic targets fuel sleep anxiety"]
       ]}
     ]},

    {id:"differentials", nav:"Differentials", title:"Beyond chronic insomnia — the differential table",
     blocks:[
       {b:"table", head:["Diagnosis","Pattern","Action"], rows:[
         ["<b>Chronic insomnia disorder</b>","Hyperarousal, conditioned arousal, unhelpful sleep beliefs, compensatory behaviours","<b>CBT-I first-line</b>"],
         ["<b>Obstructive sleep apnoea</b>","Two or more of: snoring, witnessed apnoeas, choking, unrefreshing sleep, morning headache, nocturia, fragmented sleep, cognitive impairment, sleepiness","Assess and refer per NICE NG202; sedatives only with individual caution; driving advice if sleepy"],
         ["<b>Restless legs syndrome</b>","Evening urge to move the legs, relieved by movement; linked to iron deficiency, pregnancy, CKD, neuropathy","Check ferritin and iron status; correct iron deficiency and review contributory medicines, caffeine and alcohol. Persistent or troublesome symptoms → specialist advice on alpha-2-delta ligands versus dopamine agonists, explaining augmentation and impulse-control risks. See <a href='restless-legs.html'>restless legs</a>"],
         ["<b>Periodic limb movements</b>","Partner reports repetitive leg movements","Periodic limb movements on a sleep study are not automatically a disorder; treat clinically significant RLS or another cause, with specialist interpretation"],
         ["<b>Circadian rhythm disorders</b>","Delayed phase (young people) or advanced phase (older adults); normal sleep on their own schedule","Timing, not sedation — light and melatonin timing depend on the disorder and schedule; sleep-specialist advice for complex shift-work or delayed-phase cases"],
         ["<b>Depression or anxiety</b>","Common comorbidity; insomnia is both symptom and risk factor","Treat the mood disorder; CBT-I still works with comorbid depression"],
         ["<b>Paradoxical insomnia</b>","Severe reported insomnia with near-normal objective sleep","CBT-I with cognitive work on sleep-state misperception"],
         ["<b>REM sleep behaviour disorder</b>","Dream enactment with injury risk","Sleep or neurology assessment — isolated RBD may precede an α-synuclein disorder; give safety advice and avoid over-stating future risk"],
         ["<b>Drug or alcohol related</b>","Alcohol dependence; benzodiazepine rebound","Treat the dependence; see <a href='#taper'>the way off</a>"]
       ]}
     ]},

    {id:"workup", nav:"Work-up", title:"Examination, scores and targeted tests",
     blocks:[
       {b:"table", head:["What","Detail","Use"], rows:[
         ["<b>BMI, neck circumference, upper airway</b>","Obesity, large neck, crowded oropharynx, tonsils","Part of the OSA assessment"],
         ["<b>Epworth Sleepiness Scale</b>","8 items","Part of the assessment — not the sole referral criterion; some people with OSA are not sleepy"],
         ["<b>STOP-BANG</b>","Snoring, tiredness, observed apnoea, pressure, BMI, age, neck, male sex","Risk stratification, not diagnosis"],
         ["<b>Insomnia Severity Index (ISI)</b>","7 items","Quantify severity and monitor response alongside daytime function and the patient's goals"],
         ["<b>PHQ-9 / GAD-7</b>","Mood and anxiety","Screening aids — not a suicide-risk assessment"],
         ["<b>Targeted tests</b>","Ferritin and iron status if RLS is suspected · TFTs if symptoms or signs suggest thyroid disease · others only for a specific clinical indication","No fixed 'insomnia blood panel'"],
         ["<b>Not routinely</b>","Polysomnography for insomnia alone","Reserve for suspected OSA, PLMD, narcolepsy or parasomnia per the sleep service"]
       ]},
       {b:"cards", items:[
         {tone:"purple", h:"NG12 — where the night-sweats route leads <span class='tw'>2WW</span>", html:"Insomnia itself has no NICE NG12 criterion. Night sweats come in through the lymphoma recommendations: <b>consider a suspected cancer pathway referral for lymphoma in adults with unexplained lymphadenopathy or splenomegaly</b>, taking into account associated symptoms such as fever, night sweats, weight loss, pruritus or breathlessness (NICE NG12). Otherwise, investigate night sweats, weight loss, fever or cough according to the clinical presentation and the current NG12 and local cancer pathways."}
       ]}
     ]},

    {id:"cbti", nav:"CBT-I", title:"CBT-I — the first-line treatment for chronic insomnia",
     blocks:[
       {b:"cards", items:[
         {tone:"green", h:"⏱️ Sleep restriction or compression", html:"Calculate the initial window from the sleep diary (time actually asleep), usually not below 5 hours unless supervised by a trained CBT-I clinician. Fixed wake time 7 days a week; go to bed only when the window opens; extend by 15–30 minutes when sleep efficiency is consistently good. The first 1–2 weeks may be difficult — daytime sleepiness can increase. Use gradual compression rather than abrupt restriction where there is frailty, marked sleepiness or safety concern."},
         {tone:"amber", h:"⚠ When sleep restriction needs care or supervision", html:"Bipolar disorder or recent mania · epilepsy (sleep loss can worsen seizure control) · untreated OSA or significant sleepiness · pregnancy · severe depression or suicidality · older or frail adults · safety-critical occupations · unable to keep a fixed wake time. Reassess driving and occupational risk."},
         {tone:"green", h:"🪑 Stimulus control", html:"Bed for sleep and sex only. If awake and frustrated for what feels like about 20 minutes, get up, keep lights dim, do something quiet, and return when sleepy. No clock-watching. This breaks the link between bed and wakefulness."},
         {tone:"green", h:"🧠 Cognitive work and relaxation", html:"Address catastrophic beliefs about sleep and next-day function; teach a specific relaxation technique such as progressive muscle relaxation or slow breathing."},
         {tone:"green", h:"💻 Face-to-face or digital CBT-I", html:"Offer by availability, suitability and preference. NICE MTG70 recommends Sleepio as a primary-care option for people who would otherwise get sleep hygiene or sleeping pills; other digital products depend on local commissioning. NHS Talking Therapies deliver CBT-I in some areas. Complete a medical assessment first where OSA, pregnancy, significant comorbidity or another sleep disorder is possible."},
         {tone:"plain", h:"📵 Sleep hygiene — supportive, not a treatment on its own", html:"Fixed wake time; limit caffeine later in the day; avoid alcohol near bedtime; daytime light and exercise; a cool, dark, quiet room; limit screens before bed; avoid long or late naps."}
       ]},
       {b:"why", html:"CBT-I addresses the maintaining factors; hypnotics mainly give short-term symptom relief and do not treat them — which is why CBT-I comes first for chronic insomnia."}
     ]},

    {id:"stepped", nav:"Drugs", title:"Drug options — short, gated, with stop dates",
     blocks:[
       {b:"table", head:["Situation","Option","Rules"], rows:[
         ["<b>Short-term insomnia</b> — severe impairment or distress, likely to resolve soon, non-drug measures considered","<b>Z-drug</b>","Lowest effective dose, defined quantity, agreed stop date. Greater Manchester formulary: <b>zopiclone first choice, zolpidem alternative</b> — local sequencing; NICE TA77 found no compelling difference and advises the lowest-cost option unless adverse effects justify a switch. Licensed for up to 28 days; local practice favours a much shorter course. Zopiclone 3.75 mg or zolpidem 5 mg in older or frail adults"],
         ["<b>Chronic insomnia, aged 55+</b>","<b>Melatonin MR 2 mg</b>","Where licensed and locally supported — check the Greater Manchester formulary, which does not routinely support adult melatonin for primary insomnia. 1–2 hours before bed after food; usually up to 13 weeks; review benefit and adverse effects (somnolence, dizziness, headache, abnormal dreams); stop if ineffective. Check the SPC for hepatic impairment"],
         ["<b>Chronic insomnia</b> — 3+ months with considerable daytime impact, CBT-I tried and unsuccessful, or unavailable or unsuitable","<b>Daridorexant (NICE TA922)</b>","50 mg once nightly within 30 minutes of bed; 25 mg in moderate hepatic impairment or with moderate CYP3A4 inhibitors (e.g. ciprofloxacin, ciclosporin). <b>Contraindicated in narcolepsy</b> and with strong CYP3A4 inhibitors (e.g. clarithromycin, itraconazole, ritonavir); not recommended in severe hepatic impairment; no renal adjustment; avoid grapefruit in the evening. <b>Review within 3 months and stop if the response is inadequate</b>; if continued, review periodically"],
         ["<b>Depression with insomnia</b>","<b>Mirtazapine</b>","Only where there is a clear depressive indication. Sedation, appetite and weight gain, morning impairment; lower doses are often more sedating, but response varies. Not for insomnia alone"],
         ["<b>Not routine</b>","—","Sedating antihistamines, amitriptyline and quetiapine are not routine treatments for insomnia — anticholinergic, cardiovascular, cognitive and falls risks. Benzodiazepines offer no advantage over Z-drugs"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"⚠ Driving and next-day impairment", html:"All hypnotics can cause next-day impairment, especially with alcohol, opioids, other sedatives, older age or sleep deprivation. Do not drive or operate machinery if drowsy or not fully alert. Follow each product's minimum interval: zolpidem — at least 8 hours after a 10 mg dose (MHRA); daridorexant — about 9 hours (SPC), with extra caution in the first days. Discuss occupational driving and document it."},
         {tone:"amber", h:"⚠ Daridorexant — misuse and sedation", html:"No physical dependence or withdrawal signal in clinical studies and no taper is needed, but abuse liability similar to zolpidem was seen at supratherapeutic doses in recreational drug users — caution with addiction histories. Additive effects with alcohol and other CNS depressants."}
       ]},
       {b:"warn", html:"At every hypnotic prescription: the stop date agreed now, no automatic repeat, the next-day impairment warning, and never with alcohol, opioids or other sedatives. Take extra care in older adults (falls), respiratory disease and suspected OSA."},
       {b:"say", html:"Sleeping tablets can help for a short spell, but they tend to stop working if taken every night and can be hard to stop. The sleep programme is harder for the first week or two, but it's the treatment that keeps working after it ends."}
     ]},

    {id:"taper", nav:"The way off", title:"Deprescribing for long-term benzodiazepine and Z-drug users",
     blocks:[
       {b:"ladder", steps:[
         {step:"1st", title:"The invitation, not the ambush", when:"identify and engage", fromLabel:"review the repeat list",
          html:"Continuous use beyond 2–4 weeks makes tolerance, physical dependence and withdrawal more likely. Assess each person's dose, duration, pattern of use, comorbidity and any previous withdrawal symptoms — dependence is not addiction, and not everyone is dependent. Frame reduction as protection: falls, memory, driving, and the drug no longer working."},
         {step:"2nd", title:"Taper the current drug, or switch selectively", when:"choose the method", fromLabel:"direct taper is often right",
          html:"A direct taper of the current drug is often appropriate, particularly for uncomplicated low-dose Z-drug use. Consider a diazepam transition only in selected patients, after checking age, liver function, interactions, misuse risk and local policy — diazepam accumulates in older adults and hepatic impairment. Dose-equivalence tables are approximate (SPS) and are not an automatic substitution schedule."},
         {step:"3rd", title:"Small steps, patient-paced", when:"reduce", fromLabel:"slower at lower doses",
          html:"Start with a small reduction — commonly 5–10% of the current dose every 2–4 weeks — then slow or hold according to withdrawal symptoms. Smaller reductions are usually needed at lower doses and after long-term use. Weeks for short use; many months for years-long use."},
         {step:"4th", title:"Support alongside", when:"throughout", fromLabel:"review before increasing",
          html:"CBT-I alongside the taper. Rebound insomnia may occur during reduction and does not necessarily mean the original condition has returned — review the symptoms and the pace before increasing the dose. Agree a plan for out-of-hours requests."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"red", h:"⚠ Never stop abruptly", html:"Seizure and delirium risk is highest with high-dose, long-duration benzodiazepine use, short half-life agents, alcohol dependence and previous withdrawal seizures."},
         {tone:"red", h:"⚠ Opioids and other CNS depressants", html:"Benzodiazepines or Z-drugs with opioids risk respiratory depression (MHRA) — prioritise these patients. The same caution applies with pregabalin, gabapentin, sedating antihistamines and alcohol."}
       ]},
       {b:"kv", rows:[
         ["Specialist advice","High doses, several drugs, alcohol dependence, seizure history, significant psychiatric comorbidity, pregnancy, or previous complicated withdrawal → community drug service or specialist prescribing support"],
         ["Older adults on long-term hypnotics","Often the biggest gain in falls and cognition; same method, gentler pace, clear written chart"],
         ["Driving","Document the conversation; daytime sedation → advise not to drive and apply DVLA rules"]
       ]}
     ]},

    {id:"monitor", nav:"Review", title:"Review rhythm and safety-netting",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["<b>After starting CBT-I or a hypnotic</b>","<b>2–4 weeks</b>","Diary and ISI against baseline, daytime function, driving, mood, adverse effects, adherence and goals. Earlier review after a sedative in frailty, respiratory disease, opioid use, alcohol dependence or occupational driving"],
         ["<b>CBT-I progress</b>","<b>6–8 weeks</b>","Sleep efficiency above about 85% is a useful guide, not a universal target. Not improving → re-check the causes, depression and OSA"],
         ["<b>Z-drug</b>","<b>At the agreed stop date</b>","Stopped, or the CBT-I conversation again — not a repeat"],
         ["<b>Melatonin MR</b>","<b>By 13 weeks</b>","Stop if ineffective"],
         ["<b>Daridorexant</b>","<b>Within 3 months</b>","Stop if response is inadequate; if continued, review periodically"],
         ["<b>Tapering</b>","<b>Every 1–2 steps</b>","Symptoms versus pace"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"📞 Urgent or same day", html:"Suicidal crisis · suspected mania · hypnotic overdose, especially with alcohol · new suicidal thoughts, or functional collapse mid-taper."},
         {tone:"cream", h:"💬 Safety-net scripts", html:"“If you feel drowsy the morning after a sleeping tablet, don't drive.” · “These tablets tend to stop working if taken every night, and can be hard to stop — we've agreed the stop date.” · “Loud snoring with pauses in breathing and daytime sleepiness needs its own assessment — tell us.” · “If low mood or hopeless thoughts come with the bad nights, tell us.” · “Never with alcohol or strong painkillers.”"}
       ]}
     ]},

    {id:"loop", nav:"Still not sleeping?", title:"Still not sleeping? Re-run this loop before any more tablets",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"1 · The cause", html:"OSA assessed properly? RLS and iron status? Mood re-checked? Nocturia, pain, menopause?"},
         {tone:"amber", h:"2 · Real CBT-I?", html:"Structured sleep restriction or compression and stimulus control — or only a hygiene leaflet? Engagement checked?"},
         {tone:"amber", h:"3 · Substances", html:"Caffeine, alcohol, cannabis, nicotine — honestly counted?"},
         {tone:"amber", h:"4 · Medicine timing", html:"SSRI or steroid in the morning? Diuretic earlier in the day?"},
         {tone:"amber", h:"5 · Rebound", html:"Recently reduced a sedative — withdrawal-related insomnia rather than relapse?"},
         {tone:"amber", h:"6 · The clock", html:"Shift work or delayed phase? Circadian — a different toolkit. All addressed → daridorexant criteria, or the sleep service."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — who, when, how urgently",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Urgent or same day", html:"Active suicidal intent or imminent risk → local crisis pathway · suspected mania → same-day mental-health assessment."},
         {tone:"amber", h:"Sleep service", html:"Suspected OSA per NICE NG202, prioritising vocational drivers, safety-critical workers, near misses or unstable cardiovascular disease · severe parasomnias · circadian disorders not responding to primary-care measures."},
         {tone:"amber", h:"Neurology or sleep medicine", html:"Suspected narcolepsy (cataplexy, sleep paralysis, hypnagogic hallucinations) — also a DVLA issue · probable REM sleep behaviour disorder · RLS needing specialist treatment decisions."},
         {tone:"blue", h:"Mental health", html:"Depression, anxiety or PTSD driving the insomnia (nightmares with hypervigilance → trauma-focused care) · bipolar disorder · risk. NHS Talking Therapies where CBT-I is commissioned."},
         {tone:"plain", h:"Refractory insomnia", html:"Chronic insomnia despite genuine CBT-I and consideration of daridorexant → sleep or insomnia service. Endocrine drivers → the relevant specialty or the <a href='hrt-prescribing.html'>HRT protocol</a>."},
         {tone:"plain", h:"Complex dependence", html:"High-dose or multiple sedatives, alcohol co-dependence, or failed tapers → community drug service or specialist prescribing support."},
         {tone:"green", h:"GP manages", html:"The cause assessment, CBT-I and digital referral, gated prescriptions with stop dates, the taper programme and the reviews."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only — the Casebook keeps the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 48-year-old HGV driver requests 'more zopiclone' — started 8 months ago after his divorce, now nightly 7.5 mg plus two cans of lager to 'top it up'. He snores heavily, naps in the cab, and his collar size is 18. He is irritable about being asked anything beyond the repeat."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Recognises nightly Z-drug plus alcohol plus probable OSA in a vocational driver; assesses OSA features with Epworth and STOP-BANG as aids and refers urgently; advises that he must not drive while excessive sleepiness affects driving, and documents it; asks directly about mood and suicidal thoughts given the divorce; declines an automatic repeat without ambush and agrees a patient-paced reduction with CBT-I alongside; addresses alcohol as a sleep aid; books review with a sleep diary. <a href='../../cases/insomnia.html'>Open the full casebook chapter →</a>"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[

  foot:"Insomnia in adults. Look for the dangerous and treatable causes first; ask about mood and suicidal thoughts when insomnia is severe or persistent — PHQ-9 item 9 is not a risk assessment. Assess for OSA with two or more features (NICE NG202); excessive sleepiness affecting driving means no driving until controlled (DVLA). CBT-I, face-to-face or digital (NICE MTG70), is first-line for chronic insomnia. Hypnotics: lowest dose, shortest course, agreed stop date — zopiclone first choice under the Greater Manchester formulary. Melatonin MR for eligible over-55s where locally supported; daridorexant per NICE TA922, reviewed within 3 months. Long-term users: patient-paced tapering with CBT-I; never stop abruptly. Sources: NICE TA922, MTG70, TA77, NG202, NG12; DVLA; MHRA; Greater Manchester formulary; SPS; BAP. Verify every dose against the current BNF."
