  quickSub:"If you read nothing else on this page, read these six cards. Every figure traces to the source cited under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Insomnia is an independent suicide risk factor — screen every time", html:"Meta-analyses show a 2.2× suicide risk in insomnia independent of depression, and each SD increase in severity adds ~40% risk. Screen briefly (PHQ-9 question 9) at every insomnia consultation; active ideation → crisis referral. And reduced NEED for sleep with elevated mood and racing thoughts is mania, not insomnia → same-day psychiatric assessment."},
    {tone:"amber", h:"Screen OSA before any tablet — hypnotics make it worse", html:"Snoring + witnessed apnoeas + unrefreshing sleep → STOP-BANG (≥3 intermediate, ≥5 high risk; 94% sensitivity for moderate–severe OSA) and Epworth (≥10 → sleep study). OSA is undiagnosed in ~80% of UK cases, carries a 7× road-accident risk, and hypnotics suppress arousal and worsen hypoxia. <b>Advise not to drive until assessed (DVLA)</b> — urgency up for professional drivers."},
    {tone:"blue", h:"CBT-I beats every drug — and sleep restriction is the active ingredient", html:"Effect size ~0.9–1.0 vs 0.5–0.7 for hypnotics (sleep hygiene alone: 0.2), no rebound, benefits lasting 12+ months after stopping. From the 2-week diary: set the bed window to actual sleep time (never &lt;5 h), fixed wake time 7 days/week, extend 15–30 min once efficiency &gt;85%. Warn about the hard first fortnight (daytime sleepiness — caution driving). Digital CBT-I (Sleepio — NICE MTG70; Sleepstation; free Sleepful.org.uk) is offered to ALL patients at every step."},
    {tone:"green", h:"The drug gates (CG046): short, gated, with stop rules", html:"Short-term insomnia with severe impairment likely to resolve → Z-drug 3–7 days (zopiclone 7.5 mg first-line, 3.75 mg elderly; zolpidem 10/5 mg second) — never beyond 2 weeks. Chronic + aged ≥55 → melatonin MR 2 mg (3-week initial course; if responding a further 10 weeks only — stop by 13 weeks if no improvement). Chronic + CBT-I tried/failed/unavailable → daridorexant 50 mg (25 mg hepatic impairment or moderate CYP3A4 inhibitors) per TA922 — ISI + agreed goals at initiation, review 1 and 3 months, stop by 12 weeks if no benefit, no other hypnotics for the month before."},
    {tone:"purple", h:"The repeat slip is where dependence starts", html:"Dependence develops in ~40% of Z-drug (zopiclone, zolpidem, zaleplon) users beyond 4 weeks, and ~1.5 million people in the UK are on long-term Z-drugs — most started with one 'two-week' script that auto-repeated. Three sentences said out loud at every hypnotic prescription: “two weeks at most · it stops working used nightly · the stop date is already agreed.” No auto-repeat. And zopiclone impairs driving for 12 hours — the morning after counts (MHRA); document the warning."},

    {title:"Screen the red flags", html:"Suicidal ideation (2.2× independent risk — PHQ-9 Q9 every time) → crisis. Reduced sleep NEED + elevated mood = mania → same-day psychiatry. Snoring + witnessed apnoeas + Epworth ≥10 → sleep study, no hypnotics, driving advice. Night sweats + weight loss → investigate (ESR, CRP, CXR, FBC) — never 'menopause' by default. Nocturnal chest pain or PND → same-day ECG + BNP. Nocturnal seizure features → EEG + neurology. Sedative/alcohol withdrawal → withdrawal management.", alert:true},

    {title:"Score, examine, test only on suspicion", html:"ISI (&gt;14 = moderate–severe; the CBT-I outcome measure), PHQ-9, GAD-7, Epworth, STOP-BANG; BMI, neck circumference (&gt;40 cm M / &gt;35 cm F), Mallampati, tonsils. Bloods only as targeted: ferritin (RLS), TFTs, HbA1c, CRP/FBC. Polysomnography is NOT for primary insomnia."},
    {title:"CBT-I for everyone; drugs by the gates", html:"Sleep restriction + stimulus control + cognitive work + wind-down, digital CBT-I offered to all. Then: short-term severe → Z-drug 3–7 days; chronic ≥55 → melatonin MR 2 mg (13-week rule); chronic + CBT-I failed/unavailable → daridorexant (TA922, 12-week rule). ISI and agreed goals at any drug initiation."},

    {id:"severe", nav:"Red flags", title:"Red flags — exclude the dangerous causes first", sub:"Insomnia affects ~35% of adults; these presentations are the ones that must not be managed as routine insomnia.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Suicidal ideation", html:"Severe insomnia is an independent suicide risk factor (2.2× in meta-analyses; +40% per SD of severity, independent of depression). Actively screen with PHQ-9 Q9 at every consultation; active ideation → immediate crisis referral."},
         {tone:"red", h:"🔴 Mania", html:"Reduced NEED for sleep with elevated mood, grandiosity and racing thoughts is a classic manic prodrome — not insomnia → same-day psychiatric assessment (72+ hours without sleep in mania → emergency). Psychotic symptoms → urgent CMHT. Missing it delays the bipolar diagnosis."},
         {tone:"red", h:"🔴 Nocturnal chest pain / dyspnoea", html:"Nocturnal angina or paroxysmal nocturnal dyspnoea (heart failure) → same-day ECG and BNP."},
         {tone:"amber", h:"🟠 OSA — witnessed apnoeas + snoring", html:"Cardiovascular risk and a 7× road-accident risk; undiagnosed in ~80% of UK cases. Epworth ≥10 → sleep study; advise not to drive until assessed and treated (DVLA Group 1). Hypnotics suppress arousal and worsen hypoxia — screen BEFORE any tablet, especially the overweight snorer."},
         {tone:"amber", h:"🟠 Excessive daytime somnolence", html:"Falling asleep involuntarily during activities → OSA, narcolepsy or idiopathic hypersomnia (Epworth &gt;10). Occupational and driving risk — HGV/PSV licences raise the urgency."},
         {tone:"amber", h:"🟠 Night sweats + weight loss", html:"Lymphoma, TB or other malignancy — do not attribute to 'menopause' without investigation in an at-risk patient: ESR, CRP, CXR, FBC — see the NG12 card under <a href='#workup'>Work-up</a>."},
         {tone:"amber", h:"🟠 Nocturnal seizures", html:"Tongue biting, incontinence, post-ictal confusion on waking → EEG + neurology referral."},
         {tone:"amber", h:"🟠 Substance withdrawal", html:"Alcohol, benzodiazepine or opioid withdrawal causes severe (rebound) insomnia — manage the withdrawal, don't sedate over it."}
       ]}
     ]},

    {id:"history", nav:"Characterise", title:"History — characterise the problem, then hunt the thief", sub:"The type of insomnia is highly discriminating, and the 2-week diary drives everything downstream.",
     blocks:[
       {b:"table", head:["Ask about","Detail","Discriminates"], rows:[
         ["<b>Type</b>","Sleep-onset (SOL &gt;30 min) vs sleep-maintenance (WASO) vs early-morning waking","Onset + racing thoughts = anxiety/hyperarousal or delayed phase · maintenance = depression, pain, OSA, nocturia · EMW (waking ≥2 h early, can't return) = a biological marker of depression — PHQ-9 mandatory · alcohol also fragments the second half"],
         ["<b>Duration</b>","Acute &lt;3 months with an identifiable trigger (bereavement, stress, illness) vs chronic = ≥3 nights/week for ≥3 months WITH daytime impairment","No daytime impairment = a short sleeper, not a patient. Chronic insomnia requires CBT-I"],
         ["<b>2-week sleep diary</b>","Bedtime, SOL, WASO, total sleep, rise time, naps, caffeine/alcohol, quality 1–10 (wearable data taken with salt)","Quantifies sleep efficiency (asleep ÷ in bed × 100; &lt;85% = clinically significant) and sets the sleep-restriction window; exposes felt-vs-actual mismatch"],
         ["<b>The cause list — every time</b>","OSA (snoring, apnoeas, collar size) · RLS (evening leg urge relieved by movement → ferritin) · depression/anxiety/PTSD (nightmares + hypervigilance = trauma pathway) · pain · nocturia (prostate? diuretic timing?) · GORD · menopause (night sweats → the HRT guide, not zopiclone) · shift work / circadian mismatch · bipolar history","The thief list — it changes over time, so re-screen at every review"],
         ["<b>Substances</b>","Caffeine (half-life 5–7 h — a 3pm coffee is active at midnight; tea, cola, energy drinks, co-codamol-with-caffeine, dark chocolate) · alcohol (sedates onset, suppresses REM and slow-wave sleep, rebound waking 3–4 h in) · nicotine · cannabis (long-term architecture disruption)","The commonest maintaining factors"],
         ["<b>Medications</b>","SSRIs (especially fluoxetine/sertraline — dose in the morning) · corticosteroids (morning dosing) · beta-blockers (reduced melatonin, nightmares) · diuretics after 4pm · decongestants · stimulants · theophylline · recently stopped sedatives (rebound)","Fix the timing before adding anything"],
         ["<b>Expectation reset</b>","Sleep need falls with age (6–7 h at 70 is normal; the normal range is 6–9 h); brief waking 1–2× a night is normal","The 8-hour rule is a myth that fuels the anxiety that fuels the insomnia"]
       ]}
     ]},

    {id:"differentials", nav:"Differentials", title:"Beyond primary insomnia — the differential table", sub:"Chronic insomnia disorder is the commonest — but each of these has a different treatment, and two of them are neurology flags.",
     blocks:[
       {b:"table", head:["Diagnosis","Pattern","Action"], rows:[
         ["<b>Chronic (primary) insomnia disorder</b>","Hyperarousal, conditioned arousal, dysfunctional sleep beliefs; perpetuated by compensatory behaviours (early to bed, napping, lying awake worrying)","<b>CBT-I first-line</b>"],
         ["<b>Obstructive sleep apnoea</b>","Snoring, witnessed apnoeas, unrefreshing sleep, obesity, neck &gt;40 cm","<b>Epworth + STOP-BANG → sleep study. No hypnotics</b>"],
         ["<b>Restless legs syndrome (Willis-Ekbom)</b>","Irresistible evening/night urge to move the legs, relieved by movement; affects 5–10% of adults, underdiagnosed. Secondary: iron deficiency, pregnancy, CKD, peripheral neuropathy","Ferritin — treat if &lt;50 µg/L (replete towards &gt;75; iron is the dopamine-synthesis cofactor, so treat below threshold even without anaemia) — often curative"],
         ["<b>Circadian rhythm disorders</b>","Delayed phase (teens/young adults — asleep 2–4am, can't wake) vs advanced phase (elderly — sleepy at 7pm, wake at 3am). They sleep normally on their own schedule","Light therapy timing ± melatonin timing — a different toolkit, frequently misdiagnosed as insomnia or depression"],
         ["<b>Depression / anxiety</b>","The commonest psychiatric comorbidity; insomnia is both symptom and risk factor","Treat the depression properly — a Z-drug on top of untreated depression fixes neither; CBT-I works even with comorbid depression"],
         ["<b>Periodic limb movement disorder</b>","<b>Partner reports repetitive leg kicking; fragments sleep maintenance</b>","<b>Polysomnography diagnosis; dopamine agonists effective</b>"],
         ["<b>Paradoxical insomnia</b>","Severe reported insomnia with near-normal sleep on actigraphy/polysomnography — 5–10% of chronic presentations, genuinely distressed","CBT-I with cognitive restructuring for sleep-state misperception — equally effective"],
         ["<b>Drug / alcohol related</b>","Alcohol dependence → chronic insomnia (suppressed slow-wave and REM, rebound waking); benzodiazepine rebound insomnia on cessation is often WORSE than the original","Treat the dependence; see <a href='#taper'>the taper</a>"]
       ]}
     ]},

    {id:"workup", nav:"Work-up", title:"Examination, scores and targeted tests", sub:"Scores in clinic, bloods only on suspicion — and polysomnography is not for primary insomnia.",
     blocks:[
       {b:"table", head:["What","Detail","Threshold / action"], rows:[
         ["<b>BMI + neck circumference</b>","BMI &gt;30; neck &gt;40 cm (M) / &gt;35 cm (F); Mallampati score; tonsillar hypertrophy","The OSA anatomy screen"],
         ["<b>Epworth Sleepiness Scale</b>","8-item, validated, done in clinic","<b>≥10 = excessive daytime somnolence → sleep study (8–9 borderline)</b>"],
         ["<b>STOP-BANG</b>","Snoring · Tired · Observed apnoea · Pressure (hypertension) · BMI &gt;35 · Age &gt;50 · Neck &gt;40 cm · Gender male","<b>≥3 intermediate, ≥5 high risk; 94% sensitivity for moderate–severe OSA</b>"],
         ["<b>ISI — Insomnia Severity Index</b>","7 items, 2 minutes — the treatment outcome measure","&gt;14 = moderate–severe; expect a ≥5-point (typically 5–7) fall over 6–8 weeks of CBT-I; completed at any drug initiation"],
         ["<b>PHQ-9 / GAD-7</b>","Depression and anxiety scores","≥10 = moderate on each; EMW → PHQ-9 mandatory"],
         ["<b>Targeted bloods</b>","Ferritin (RLS — treat &lt;50 µg/L) · TFTs (hyperthyroidism) · HbA1c (nocturnal hypoglycaemia) · CRP/FBC (systemic causes)","Only where the history points"],
         ["<b>NOT routinely</b>","Polysomnography — not needed for primary insomnia; reserve for suspected OSA (where home oximetry is insufficient), PLMD or narcolepsy. EEG only for suspected nocturnal seizures","Over-testing medicalises"]
       ]},
       {b:"cards", items:[
         {tone:"purple", h:"NG12 criteria that surface here <span class='tw'>2WW</span>", html:"Insomnia itself has no NICE NG12 criterion, and this page does not invent one. The cancer question arrives through the night-sweats route:<br>• Unexplained night sweats with weight loss, fever or lymphadenopathy → investigate (FBC, ESR/CRP, CXR) and refer per the lymphoma criteria — unexplained lymphadenopathy or splenomegaly → 2-week-wait referral; features suggesting leukaemia → <b>urgent FBC within 48 hours</b>.<br>• Cough ≥3 weeks with weight loss or haemoptysis in the night-sweats work-up → urgent chest X-ray (TB and lung cancer share the route).<br>Never file night sweats under 'menopause' or 'poor sleep' without this screen in an at-risk patient.", src:"NICE NG12 (updated May 2025) · house rule"}
       ]}
     ]},

    {id:"cbti", nav:"CBT-I", title:"CBT-I with actual instructions — sleep restriction is the engine", sub:"More effective than any medication for chronic insomnia, with benefits that persist after it stops. The hygiene leaflet alone is not a treatment.",
     blocks:[
       {b:"cards", items:[
         {tone:"green", h:"⏱️ Sleep restriction — the part that works", html:"From the diary: in bed 9 h but asleep 6 h → set the bed window to ~6 h (never &lt;5 h). Fixed wake time 7 days/week; bed only when the window opens. Efficiency &gt;85% for a week → extend 15–30 min. Brutal for 1–2 weeks (warn: daytime sleepiness — caution driving), then sleep pressure (the adenosine drive) rebuilds and consolidates the night. Sleep compression — gradual narrowing over weeks — is the gentler variant for older adults or marked daytime fatigue."},
         {tone:"green", h:"🪑 Stimulus control", html:"Bed = sleep + sex only — no reading, TV, phones or worrying. Awake &gt;20 minutes (felt, not clock-watched) → get up, dim light, boring activity, return when sleepy; repeat as needed. No visible clock. This breaks the conditioned arousal (bed = wakefulness and anxiety) that maintains chronic insomnia."},
         {tone:"green", h:"🧠 Cognitive work + relaxation", html:"Target the catastrophising ('I'll be useless tomorrow' — the sleep-deprived function better than they predict; 'I must get 8 hours' — 6–9 h is the normal range); paradoxical intention for sleep effort. Prescribe a specific relaxation technique: progressive muscle relaxation, 4–7–8 diaphragmatic breathing, or MBSR."},
         {tone:"green", h:"💻 Digital CBT-I — offer to ALL, at every step", html:"Sleepio (NICE MTG70 — NHS-funded in some areas; free for cancer patients via Macmillan), Sleepstation (local funding), or the free Sleepful.org.uk. Efficacy comparable to face-to-face for mild–moderate insomnia; NHS Talking Therapies deliver CBT-I in some areas and treat the comorbid mood disorder concurrently."},
         {tone:"plain", h:"📵 Hygiene — the supporting cast, never the treatment", html:"Fixed wake time is the single most evidence-based measure (the anchor — it entrains the circadian clock; no compensatory lie-ins). No caffeine after 2pm; alcohol not within 3 h of bed and &lt;14 units/week; no vigorous exercise within 2–3 h of bed (it raises core temperature and cortisol — morning exercise + daylight is optimal); screens out 1 h before (blue light suppresses melatonin up to 2 h); room cool (16–18°C), dark, quiet; naps ≤20 min before 3pm only if essential. Hygiene alone: effect size ~0.2 — necessary, not sufficient."}
       ]},
       {b:"why", html:"CBT-I outperforms hypnotics in every head-to-head trial (d ≈ 0.9–1.0 vs 0.5–0.7), with no rebound, no dependence, and effects lasting 12+ months — hypnotic benefit stops the night the tablet does. That is why every guideline puts it first, and why the honest consultation sells the hard fortnight of sleep restriction rather than the easy script."}
     ]},

    {id:"stepped", nav:"Drug gates", title:"The stepped-care drug decision (CG046) — duration drives the gate", sub:"Digital CBT-I is offered to everyone at every step; drugs are adjunctive and gated. ISI + agreed goals at every initiation.",
     blocks:[
       {b:"table", head:["Situation","Option","Rules"], rows:[
         ["Short-term insomnia (&lt;3 months), severe impairment, likely to resolve (bereavement, crisis, acute stressor)","<b>Z-drug, 3–7 days preferred</b>","Zopiclone 3.75–7.5 mg: 7.5 mg first-line (3.75 mg elderly/hepatic/renal) or zolpidem 5–10 mg: 10 mg second-line (5 mg elderly) — never exceeding 2 weeks, ideally intermittent (2–3 nights/week), stop date agreed AT prescription, review at course end"],
         ["<b>Chronic insomnia + aged ≥55</b>","<b>Melatonin MR 2 mg (Circadin®/generic)</b>","1–2 h before bed, after food; 3-week initial course; responding → a further 10 weeks only; STOP if no improvement by 13 weeks. Avoid in hepatic impairment. No dependence, hangover or rebound; reduces sleep latency 15–20 min"],
         ["Chronic insomnia + CBT-I tried-and-failed, unavailable, unsuitable or refused","<b>Daridorexant (NICE TA922)</b>","Daridorexant 25–50 mg: 50 mg within 30 min of bed, ≥7 h in bed after; 25 mg in moderate hepatic impairment or with moderate CYP3A4 inhibitors (ciclosporin, ciprofloxacin) — avoid strong inhibitors (clarithromycin, azoles). No other hypnotics for 1 month before. Dual orexin-receptor antagonist — no classical dependence/rebound; caution narcolepsy-like symptoms. Review at 1 and 3 months; STOP by 12 weeks if no benefit (no taper needed); reassess ≥6-monthly — efficacy beyond 1 year uncertain"],
         ["<b>Depression + insomnia</b>","<b>Mirtazapine 15–30 mg nocte</b>","Treats both (H1 + 5-HT2C antagonism); 15 mg is MORE sedating than 30 mg; weight gain — useful in weight-loss depression. For depression, not for pure insomnia"],
         ["<b>What NOT to reach for</b>","—","Sedating antihistamines (promethazine, OTC Nytol) — tolerance in days, anticholinergic burden, hangover. Amitriptyline 10–25 mg nocte off-label — anticholinergic, avoid in the elderly and QTc risk; not evidence-based for pure insomnia. Quetiapine for sleep — no. Benzodiazepines (temazepam) — no advantage over Z-drugs, same trap. Nightly long-term ANY hypnotic — the problem, not the plan"],
         ["<b>RLS (found on the cause hunt)</b>","<b>Iron first, dopamine agonist second</b>","Ferrous sulfate 200 mg BD if ferritin &lt;50 µg/L (recheck at 3 months; IV iron if not tolerated) — often curative. Refractory idiopathic RLS: pramipexole 0.088 mg or ropinirole 0.25 mg nocte with specialist oversight (augmentation risk)"],
         ["<b>Circadian disorders</b>","<b>Timing, not sedation</b>","Melatonin 0.5–3 mg taken 2–6 h before the desired sleep time (delayed phase) or morning bright light therapy; chronotherapy under sleep-specialist guidance"]
       ]},
       {b:"warn", html:"Every hypnotic script carries three sentences said out loud: “two weeks at most · it stops working used nightly · we've agreed the stop date.” Written on the script, coded, no auto-repeat — <b>the 10-year zopiclone patient started with one unreviewed repeat</b>. Counsel next-day driving (impaired driving is an offence; <b>zopiclone impairs for 12 hours — MHRA; document it</b>), falls in the elderly, and never with alcohol or opioids. <b>Avoid Z-drugs in COPD/OSA and severe hepatic impairment.</b>"},
       {b:"say", html:"Sleeping tablets work for a fortnight and then quietly stop working — but the programme where we compress and rebuild your sleep works for years, and it's yours to keep. The first two weeks are genuinely tough; that's the treatment working, not failing."}
     ]},

    {id:"taper", nav:"The way off", title:"Deprescribing established benzo and Z-drug users — the taper that works", sub:"~1.5 million people in the UK are on long-term Z-drugs. Structured withdrawal with CBT-I alongside succeeds in ~90% vs ~60% without.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1st", title:"The invitation, not the ambush", when:"identify + engage", fromLabel:"search the repeat list",
          html:"&gt;4 weeks' continuous use = dependent until proven otherwise (dependence develops in ~40% beyond 4 weeks). Frame it as protection: falls, fractures, memory, driving, the drug no longer working. Most patients reduce successfully when invited — letter interventions alone work in ~1 in 5. Never stop abruptly: seizure/delirium risk at high benzo doses."},
         {step:"2nd", title:"Switch to diazepam when needed", when:"short-acting drug, difficult withdrawal, high dose", fromLabel:"long half-life = smooth taper",
          html:"Diazepam 5 mg ≈ zopiclone 7.5 mg ≈ zolpidem 10 mg ≈ temazepam 10 mg ≈ lorazepam 0.5 mg (halve the calculated dose if frail). Direct taper of the original drug is fine for low-dose Z-drug users; switch for lorazepam/alprazolam or anyone bouncing between doses."},
         {step:"3rd", title:"Taper 5–10% every 1–4 weeks", when:"patient-controlled pace", fromLabel:"slower at the bottom",
          html:"Reduce by 5–10% of the CURRENT dose every 1–4 weeks, smaller absolute steps as the dose falls (liquid diazepam below 2 mg). A faster structured alternative — 25% every 2 weeks — suits some motivated low-dose users. The patient owns the pace: hold at any step, never go back up more than one. Weeks for short use; many months for years-long use — and that's success, not failure."},
         {step:"4th", title:"Support the gaps", when:"alongside", fromLabel:"withdrawal ≠ relapse",
          html:"CBT-I in parallel (the sleep still needs a treatment — success ~90% vs ~60% without, and relapse roughly halves). Warn of transient rebound insomnia + anxiety for 1–2 weeks after each step — predictable pharmacology, not the old insomnia returning; forewarn or they restart. NO 'rescue' benzos from OOH/locums — flag the record. Pregabalin/propranolol are NOT routine substitutes."}
       ]},
       {b:"kv", rows:[
         ["Driving","On any benzo/Z-drug: a legal duty not to drive impaired; most taper patients drive safely — document the conversation. High doses or daytime sedation → advise off the road + DVLA rules"],
         ["The elderly on nightly temazepam 'for 20 years'","Highest gain: falls and cognition improve measurably off sedatives. Same method, gentler pace, big-print taper chart, pharmacist sync"],
         ["Opioids co-prescribed","Benzo + opioid = the respiratory-depression combination (MHRA warning) — prioritise these patients for reduction"]
       ]}
     ]},

    {id:"monitor", nav:"Review", title:"Review rhythm and safety-netting", sub:"The review IS the treatment for engagement — and the stop dates only work if someone enforces them.",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["<b>Sleep diary + ISI vs baseline</b>","<b>2–4 weeks into CBT-I</b>","Efficiency &gt;85% → extend the window. Not engaging → explore why before any tablet. Z-drug started? → enforce the stop date"],
         ["<b>Full CBT-I review</b>","<b>6–8 weeks</b>","ISI down ≥5 points? Not responding → Talking Therapies / Sleepio, or re-hunt the comorbidity (depression, undiagnosed OSA)"],
         ["<b>Any hypnotic issued</b>","<b>At the agreed stop date — in the diary, not 'PRN'</b>","Stopped? Good. Wants more? The review is the CBT-I conversation again, not a repeat"],
         ["<b>Melatonin</b>","3 weeks, then 13-week rule; reassess 3–6 months","Stop if no improvement by 13 weeks; long-term use is considered safe but review regularly"],
         ["<b>Daridorexant</b>","<b>1 month and 3 months</b>","Working → continue with ≥6-monthly reassessment; not → stop by 12 weeks (no taper)"],
         ["<b>Taper patients</b>","Every 1–2 steps","Withdrawal symptoms vs pace; celebrate milestones — dose-reduction charts motivate"],
         ["<b>The cause list</b>","<b>Every review</b>","<b>Mood, OSA symptoms, pain, alcohol — the thief changes over time</b>"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"📞 999 / same-day", html:"Suicidal crisis · acute mania (72+ h without sleep) · hypnotic overdose with alcohol (respiratory depression). Same-day GP: new suicidal ideation, mania symptoms, functional collapse from rebound insomnia mid-taper."},
         {tone:"cream", h:"💬 Safety-net scripts", html:"“Drowsy the morning after a sleeping tablet — don't drive; if impaired it's the same offence as drink-driving.” · “These tablets stop working used nightly and get hard to stop — the stop date is on the packet.” · “Loud snoring with breathing pauses and daytime sleepiness needs a different assessment — and no sleeping tablets meanwhile.” · “If low mood or hopeless thoughts ride along with the bad nights, tell us — treating that treats the sleep.” · “Never with alcohol or strong painkillers — the combination suppresses breathing.”"}
       ]}
     ]},

    {id:"loop", nav:"Still not sleeping?", title:"Still not sleeping? Re-run this loop before any (more) tablets", sub:"The answer is usually on this list.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"1 · The thief", html:"OSA screened properly (STOP-BANG)? RLS + ferritin? Depression re-screened? Nocturia cause? Menopause?"},
         {tone:"amber", h:"2 · Real CBT-I?", html:"Actual sleep restriction with a set window — or just a hygiene leaflet? Engagement checked?"},
         {tone:"amber", h:"3 · Substances", html:"Afternoon caffeine, evening alcohol, cannabis withdrawal, nicotine — honestly counted?"},
         {tone:"amber", h:"4 · Drug timing", html:"SSRI in the morning? Steroids early? Diuretic before 4pm? Beta-blocker dreams?"},
         {tone:"amber", h:"5 · Rebound", html:"Recently stopped or reduced a sedative — is this withdrawal insomnia mislabelled as relapse?"},
         {tone:"amber", h:"6 · The clock", html:"Shift worker or delayed-phase teenager? That's circadian, not insomnia — light timing and melatonin timing, a different toolkit. All addressed → the daridorexant criteria, or the sleep clinic."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — who, when, how urgently", sub:"Sleep clinic and friends.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Urgent / same-day", html:"Active suicidal ideation → crisis team/999 · suspected acute mania → same-day psychiatric assessment."},
         {tone:"amber", h:"Sleep service (respiratory)", html:"STOP-BANG ≥3 or Epworth ≥10 → home oximetry or polysomnography — urgency up for professional drivers, HGV/PSV licences or road incidents. Also: severe parasomnias and circadian disorders resistant to primary-care measures."},
         {tone:"amber", h:"Neurology", html:"Suspected narcolepsy (cataplexy — sudden bilateral weakness with emotion, hypnagogic hallucinations, sleep paralysis → MSLT; misdiagnosed for 8–10 years on average; DVLA implications). REM sleep behaviour disorder (acting out dreams — ~80% develop Parkinson's, Lewy body dementia or MSA within 10–15 years: a synucleinopathy prodrome needing monitoring). Refractory RLS after iron replacement (dopamine-agonist decisions + augmentation risk)."},
         {tone:"blue", h:"Mental health", html:"Depression/anxiety/PTSD driving it (nightmares + hypervigilance = trauma-focused pathway, not hypnotics) · bipolar disorder · any risk. NHS Talking Therapies: CBT-I self-referral where commissioned, treating mood concurrently."},
         {tone:"plain", h:"Refractory insomnia", html:"Chronic insomnia despite genuine CBT-I + the daridorexant consideration → sleep/insomnia clinic. Endocrine drivers (hyperthyroidism, Cushing's, menopause needing HRT) → the relevant specialty or the <a href='hrt-prescribing.html'>HRT protocol</a>."},
         {tone:"plain", h:"Complex dependence", html:"High-dose or multi-drug sedative dependence, alcohol co-dependence, or failed structured tapers → community drug service / specialist prescribing support."},
         {tone:"green", h:"GP manages", html:"The whole core pathway: the cause hunt, CBT-I coaching and digital referral, the gated prescriptions with stop dates, the taper programme, and the reviews."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only — the Casebook keeps the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 48-year-old HGV driver requests 'more zopiclone' — started 8 months ago after his divorce, now nightly 7.5 mg plus two cans of lager to 'top it up'. He snores heavily (his new partner sleeps elsewhere), naps in the cab, and his collar size is 18. He is irritable about being asked anything beyond the repeat."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Spots the triple hazard: nightly Z-drug + alcohol + probable OSA in a professional driver; runs <b>STOP-BANG and Epworth</b> and refers for a sleep study with the <b>DVLA/driving conversation documented</b>; screens <b>mood and suicide risk</b> given the divorce; declines the repeat without ambush — <b>the invitation framing</b> — and agrees a <b>diazepam-equivalent taper with CBT-I alongside</b>, warning that rebound is withdrawal, not relapse; addresses the <b>alcohol-as-sleep-aid trap</b> (rebound waking 3–4 h in); and books the 2-week review with a diary. <a href='../../cases/insomnia.html'>Open the full casebook chapter →</a>"}
     ]}]},
