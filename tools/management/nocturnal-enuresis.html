    {tone:"blue", h:"Treat constipation and daytime symptoms FIRST", html:"Constipation and any daytime wetting or urgency are treated before the night-time wetting — their treatment often resolves the bedwetting on its own. Daytime symptoms suggest bladder dysfunction and need addressing or referring in their own right. This is the step most often skipped, and skipping it makes everything downstream fail."},

  foot:"Nocturnal enuresis in children — NICE CG111, NICE and the BNF for Children. Treat constipation and daytime bladder symptoms first: their treatment often resolves the bedwetting. Never punish, and reward agreed behaviours rather than dry nights — a child cannot choose to be dry. The enuresis alarm is first-line for long-term cure in a motivated child aged 7 or over, reviewed at 4 weeks and continued until at least 2 weeks dry. Desmopressin 200 micrograms at night gives rapid or short-term cover, with fluid restriction from 1 hour before to 8 hours after the dose — omit it if the child cannot comply or is vomiting. Secondary enuresis prompts thought of UTI, diabetes, stressors and safeguarding. Verify all doses against the BNF for Children before prescribing."
