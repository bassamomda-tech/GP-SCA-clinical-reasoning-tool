  stemTitle:"Core post-MI treatment is an ACE inhibitor, antiplatelet therapy, a beta-blocker and a high-intensity statin unless contraindicated — and the commonest primary-care failure is a comfortable patient left on starter doses",
  stemSub:"One page for the whole condition. Get the core secondary-prevention drugs on board and <b>titrated</b> — antiplatelet therapy, high-intensity statin, ACE inhibitor and beta-blocker — and add an aldosterone antagonist when the post-MI/HFrEF criteria are met, with specialist or heart-failure pathway input where appropriate. Then the specifics: DAPT duration, the planned stop date and peri-procedural planning, the LDL target with its add-on ladder, statin intolerance that is usually nocebo, cardiac rehabilitation as a core treatment, and the DVLA rules for both licence groups. This page covers post-MI secondary prevention only; stable angina has its own <a href='stable-angina.html'>separate protocol</a>.",
  guideline:"NICE NG185 (2020) · NICE NG238 (2023)",
  reviewed:"13 September 2026",
  nextReview:"13 March 2027",
  meta:[

  ],
  lead:'<div class="mg-layers"><a href="#five"><b>Core drugs</b><small>Started and titrated</small></a><a href="#dapt"><b>DAPT</b><small>Stop date · procedures</small></a><a href="#lipids"><b>Lipids</b><small>LDL ≤2.0 ladder</small></a><a href="#rehab"><b>Rehab</b><small>A treatment</small></a><a href="#monitor"><b>Review</b><small>Titrate · DVLA</small></a></div>',
  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"blue", h:"Core treatment — unless contraindicated", html:"ACE inhibitor · antiplatelet therapy (DAPT unless there is a separate indication for anticoagulation) · beta-blocker · high-intensity statin. <b>Add an aldosterone antagonist only when the post-MI/HFrEF criteria are met</b> (LVEF ≤40% with clinical heart failure, or the licensed post-MI eplerenone criteria), with specialist or heart-failure pathway input. The aim is each indicated drug titrated to target or maximum tolerated dose — not prescribed at token doses."},
    {tone:"red", h:"⛔ Do not stop DAPT without a plan", html:"Do not stop either antiplatelet agent for dental work, surgery, endoscopy or patient preference without checking the proceduralist and cardiology plan. <b>Early cessation after stenting risks catastrophic stent thrombosis.</b> Many dental procedures can proceed without interrupting antiplatelet therapy, but peri-procedural management must be individualised. <b>Significant bleeding needs urgent assessment</b>, haemodynamic management, source control and a multidisciplinary decision about temporary interruption — a PPI is an adjunct, not a substitute."},
    {tone:"amber", h:"The titration failure is the commonest one", html:"Continue the ACE inhibitor indefinitely unless contraindicated. Titrate towards the target or maximum tolerated dose according to the discharge plan, blood pressure, renal function, potassium and clinical status — complete titration promptly, usually within 4–6 weeks after discharge where feasible. Titrate the beta-blocker to target or maximum tolerated; there is no universal heart-rate target. Check renal function, potassium and BP before starting and 1–2 weeks after any ACE inhibitor or MRA change, per the local monitoring protocol. Do not routinely combine an ACE inhibitor and ARB. A patient comfortable on starter doses has not been treated, only started."},
    {tone:"blue", h:"Atorvastatin 80 mg to LDL ≤2.0", html:"Atorvastatin 80 mg or maximum tolerated statin intensity; target LDL ≤2.0 mmol/L or non-HDL ≤2.6 (NG238). Full lipid profile and liver transaminases 2–3 months after starting or changing treatment, then review at least annually. Consider ezetimibe if the target is not reached, and discuss it even when the target is achieved. Consider inclisiran or a PCSK9 inhibitor only when the relevant NICE (TA733, TA393, TA394) and local GMMMG commissioning criteria are met. Complete statin intolerance → local statin-intolerance pathway."},
    {tone:"green", h:"Cardiac rehabilitation — refer everyone", html:"Start before discharge where possible, with an assessment appointment promptly after discharge. Cardiac rehabilitation improves exercise capacity, quality of life and secondary-prevention behaviours, and exercise-based programmes reduce cardiovascular mortality and rehospitalisation. <b>Present it as a core treatment</b> — and check at review whether they actually went, since non-attendance is common and invisible unless asked."},
    {tone:"purple", h:"🟣 DVLA — different rules for each licence group", html:"Group 1 (car, motorcycle): notification is generally not required after uncomplicated MI/PCI if the DVLA standards are met. Stop driving for 1 week after successful PCI if no urgent revascularisation is planned and LV function is adequate; generally 4 weeks after MI without successful PCI. Recurrent angina, symptoms at rest or while driving → stop driving and seek medical review. Group 2 (lorry, bus): must stop driving and notify the DVLA; relicensing may be considered after at least 6 weeks if all DVLA criteria are met (functional/exercise test, controlled angina; LVEF below 40% is generally disqualifying). Record the advice."}
  ],
  pathwaySub:"Five steps — starting the core drugs and titrating them is most of the job.",
  pathway:[
    {title:"Confirm the event and start the core drugs", html:"From the discharge letter confirm: MI type and date (STEMI/NSTEMI); PCI, stent or CABG; LV ejection fraction; heart-failure symptoms or signs; DAPT agent and intended stop date; any anticoagulant indication; bleeding risk; cardiac-rehabilitation referral; driving licence group. Core drugs: ACE inhibitor, antiplatelets, beta-blocker, statin — plus an aldosterone antagonist only if the post-MI/HFrEF criteria are met. Note what was deliberately omitted."},
    {title:"Titrate — this is where the benefit is", html:"Follow the discharge plan. Complete ACE-inhibitor titration within about 4–6 weeks where feasible; titrate the beta-blocker to target or maximum tolerated; optimise any MRA with potassium and renal monitoring. Assess BP, symptoms, renal function and potassium at every titration review — no universal heart-rate target.", alert:true},
    {title:"Fix the DAPT end date in the notes", html:"Usually up to 12 months, then aspirin alone indefinitely. Record the exact stop date from the discharge letter and diarise it — seek cardiology advice before shortening, extending or changing it."},
    {title:"Drive the lipids to target", html:"Atorvastatin 80 mg or maximum tolerated → recheck lipids and transaminases at 2–3 months → consider ezetimibe → inclisiran or PCSK9 inhibitor only if NICE and GMMMG criteria are met. Use the local statin-intolerance pathway before accepting intolerance."},
    {title:"Refer to rehab, treat the mood, give the DVLA advice", html:"Cardiac rehabilitation for everyone; screen for depression and anxiety, which are common after MI; state the driving rules for their licence group."}
  ],
  sections:[

    {id:"five", nav:"Core drugs", title:"The secondary-prevention drugs — core treatment unless contraindicated, MRA when criteria are met",
     blocks:[
       {b:"table", head:["Class","Drug and dose","Notes"], rows:[
         ["<b>Dual antiplatelet therapy (DAPT)</b>","<b>Aspirin 75 mg indefinitely PLUS the P2Y12 inhibitor chosen by cardiology</b> (ticagrelor, prasugrel or clopidogrel) <b>for up to 12 months</b>","Unless altered by cardiology because of bleeding or anticoagulation. Then aspirin alone indefinitely. <b>Record the intended stop date</b>"],
         ["<b>Statin</b>","<b>Atorvastatin 80 mg</b> or maximum tolerated","High-intensity for all. <b>Target LDL ≤2.0 or non-HDL ≤2.6 (NG238)</b>"],
         ["<b>ACE inhibitor</b>","<b>Ramipril titrated towards the target or maximum tolerated dose</b> (ARB if intolerant)","<b>Continue indefinitely unless contraindicated.</b> Do not routinely combine an ACE inhibitor and ARB. Renal function, electrolytes and BP before starting and 1–2 weeks after any change; watch for hypotension, AKI and hyperkalaemia"],
         ["<b>Beta-blocker</b>","<b>Bisoprolol titrated</b> (or metoprolol, carvedilol)","Continue indefinitely where LVEF is reduced. If LVEF is preserved, continue for at least 12 months, then review the ongoing indication, adverse effects and patient preference; continue longer if there is another indication such as angina, arrhythmia or hypertension. <b>Do not stop abruptly</b>"],
         ["<b>MRA (aldosterone antagonist)</b>","<b>Eplerenone</b> — licensed post-MI; do not automatically substitute spironolactone without checking indication, contraindications and local policy","<b>Only if LVEF ≤40% with clinical heart failure, or the licensed post-MI eplerenone criteria are met</b> — via the cardiology or heart-failure plan; ideally started 3–14 days after MI. EF ≤40% alone is not an automatic indication. Check renal function, potassium, BP and concomitant ACE inhibitor/ARB before starting and during treatment, per the local heart-failure/MRA protocol"]
       ]},
       {b:"why", html:"NICE NG185 recommends an ACE inhibitor, DAPT (unless there is a separate indication for anticoagulation), a beta-blocker and a statin after MI, with an aldosterone antagonist only for those meeting the heart-failure criteria. The goal is each indicated drug started AND titrated to target or maximum tolerated dose, rather than appearing on a repeat list at starter doses. The commonest primary-care failure is the comfortable patient whose ACE inhibitor and beta-blocker were never up-titrated, or whose statin quietly stopped — neither of which produces a symptom to prompt the conversation."}
     ]},

    {id:"dapt", nav:"DAPT", title:"Dual antiplatelet therapy — duration, choice, and when to stop",
     blocks:[
       {b:"table", head:["Question","Answer"], rows:[
         ["<b>Standard duration</b>","Aspirin plus a P2Y12 inhibitor for up to 12 months unless contraindicated, then aspirin monotherapy indefinitely. Record the exact intended stop date from the discharge letter, the indication and PCI/CABG status, the bleeding-risk assessment and any ongoing indication for oral anticoagulation"],
         ["<b>Shortening it</b>","High bleeding risk → a shorter course may be appropriate — cardiology-led"],
         ["<b>Extending it</b>","High ischaemic and low bleeding risk → may be extended — specialist decision"],
         ["<b>Choice of second agent</b>","Continue the P2Y12 inhibitor selected by the treating cardiology team — the choice depends on STEMI versus NSTEMI, PCI status and coronary anatomy, age (especially ≥75), bleeding risk, anticoagulation and prior stroke/TIA. Do not change ticagrelor, prasugrel or clopidogrel in primary care without reviewing the ACS/PCI history, bleeding risk, anticoagulation and cardiology plan"],
         ["<b>Already on an anticoagulant (e.g. AF)</b>","Clopidogrel is the usual P2Y12 inhibitor where there is a separate indication for anticoagulation. Triple therapy is time-limited and cardiology-led — clarify the stop date and put it in the notes. <b>Do not let it run on through repeat-prescription inertia</b>"],
         ["<b>PPI cover</b>","<b>Add where there is GI bleeding risk — age, prior ulcer, steroids.</b> With clopidogrel, avoid omeprazole and esomeprazole unless specifically justified; choose a suitable alternative PPI per current MHRA/product guidance"],
         ["<b>Bleeding on DAPT</b>","Significant bleeding needs urgent assessment, haemodynamic management, source control and a multidisciplinary decision about temporary interruption or reversal. A PPI is a preventive/treatment adjunct, not a substitute for managing major bleeding"]
       ]},
       {b:"warn", html:"Do not stop either antiplatelet agent for dental work, surgery or endoscopy — or because the patient wants to — without checking the proceduralist and cardiology plan. <b>Early cessation after stenting risks stent thrombosis.</b> Many dental procedures can proceed without interrupting antiplatelet therapy, but peri-procedural management must be individualised to procedure bleeding risk, time since PCI, thrombotic risk and specialist advice. See <a href='antiplatelets-anticoagulants.html'>antiplatelets and anticoagulants</a> for the peri-procedural rules."}
     ]},

    {id:"lipids", nav:"Lipids", title:"The lipid target and the add-on ladder",
     blocks:[
       {b:"table", head:["Step","What","Detail"], rows:[
         ["<b>First-line</b>","<b>High-intensity statin — atorvastatin 80 mg</b>, or the maximum tolerated","<b>Full lipid profile and liver transaminases 2–3 months after starting or changing treatment, then review at least annually.</b> <b>Target LDL ≤2.0 or non-HDL ≤2.6 (NG238 secondary prevention)</b>"],
         ["<b>Second-line</b>","<b>Consider ezetimibe 10 mg OD</b>","If the target is not reached — and discuss it even when the target is achieved, as further LDL lowering may add benefit (NG238). Recheck lipids at 2–3 months"],
         ["<b>Third-line</b>","Consider inclisiran (twice yearly) or a PCSK9 inhibitor — alirocumab, evolocumab — only when NICE TA733 (inclisiran), TA393 (alirocumab) or TA394 (evolocumab) and the local GMMMG lipid-pathway criteria are met; not automatic after ezetimibe","Inclisiran substantially lowers LDL cholesterol, but cardiovascular outcome evidence is still emerging; PCSK9 monoclonal antibodies have established outcome evidence. PCSK9 inhibitor referral is generally reserved for higher LDL levels or higher-risk disease"],
         ["<b>Apparent statin intolerance</b>","<b>Do not simply stop the statin</b>","Confirm it: rechallenge, check CK if symptoms are severe, exclude other causes. Then try a lower dose, an alternative statin, or alternate-day dosing before abandoning the class. <b>True intolerance is uncommon; nocebo is common.</b> For complete statin intolerance use the local GMMMG statin-intolerance pathway: ezetimibe is generally first-line non-statin treatment; bempedoic acid with ezetimibe may be considered when criteria are met. Do not routinely add bempedoic acid to a statin"]
       ]}
     ]},

    {id:"rehab", nav:"Rehab", title:"Cardiac rehabilitation and lifestyle — a treatment, not an add-on",
     blocks:[
       {b:"table", head:["Intervention","Detail"], rows:[
         ["<b>Cardiac rehabilitation</b>","Refer EVERYONE — start before discharge where possible, with an assessment appointment promptly after discharge. Improves exercise capacity, quality of life and secondary-prevention behaviours; exercise-based programmes reduce cardiovascular mortality and rehospitalisation. <b>Check at review that they actually attended</b>"],
         ["<b>Smoking</b>","Cessation is the single biggest modifiable risk, and risk falls quickly after quitting"],
         ["<b>Diet</b>","Mediterranean pattern (Lyon Diet Heart evidence); oily fish; less salt and saturated fat"],
         ["<b>Physical activity</b>","Increase gradually to regular aerobic activity, within the rehabilitation programme's guidance"],
         ["<b>Alcohol and weight</b>","Within limits; weight management support"],
         ["<b>Mood</b>","Screen for depression and anxiety, assess suicide risk, and offer evidence-based treatment. If an antidepressant is indicated, consider cardiovascular disease, QT risk, interactions and increased bleeding risk with antiplatelets (sertraline is often reasonable); seek advice where the case is complex. See <a href='depression.html'>depression</a>"],
         ["<b>Influenza vaccine</b>","<b>Annually</b>"],
         ["<b>Pneumococcal vaccine</b>","According to the current UK immunisation schedule for the patient's age and risk group"]
       ]},
       {b:"say", html:"Your heart tablets, each doing a different protective job, plus the rehabilitation programme — together they cut the chance of another heart attack substantially. The tablets only work while you take them, and that includes the days you feel completely well, which is most of them from here on. And please do go to the rehab: it is genuinely one of the most powerful treatments we have, and it is the one people skip."}
     ]},

    {id:"monitor", nav:"Review", title:"Reviews, monitoring and driving",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["<b>Titration — ACE inhibitor, beta-blocker, MRA</b>","<b>Per the discharge plan — ACE inhibitor titration usually complete within 4–6 weeks of discharge</b>","Up-titrate to target or maximum tolerated. Assess BP, symptoms, renal function and potassium at every titration review; U&amp;Es and potassium 1–2 weeks after any ACE inhibitor or MRA change. No universal heart-rate target"],
         ["<b>Lipids</b>","<b>Full lipid profile and transaminases 2–3 months after starting or changing treatment, then at least annually</b>","<b>Target not met → consider ezetimibe → inclisiran or PCSK9 inhibitor only if NICE and GMMMG criteria are met</b>"],
         ["<b>DAPT review</b>","<b>At the recorded stop date (usually 12 months)</b>","<b>Step down to aspirin monotherapy, per the cardiology plan</b>"],
         ["<b>Beta-blocker review (LVEF preserved)</b>","<b>After at least 12 months</b>","Discuss benefits and harms of continuing; continue if there is another indication. Continue indefinitely if LVEF is reduced"],
         ["<b>Annual review</b>","<b>Yearly</b>","Angina or recurrent ACS symptoms, breathlessness and heart-failure symptoms, adherence and adverse effects, bleeding, BP and heart rate, HbA1c, renal function and potassium, LDL/non-HDL, smoking and alcohol, mood, rehabilitation attendance, and driving status and licence group"],
         ["<b>DVLA — Group 1 (car, motorcycle)</b>","","Notification generally not required after uncomplicated MI/PCI if the DVLA standards are met. Stop driving for 1 week after successful PCI if no urgent revascularisation is planned and LV function is adequate; generally 4 weeks after MI without successful PCI. Recurrent angina, symptoms at rest or while driving, or other disqualifying features → stop driving and seek medical review"],
         ["<b>DVLA — Group 2 (lorry, bus)</b>","","Must stop driving and notify the DVLA. Relicensing may be considered after at least 6 weeks if all DVLA criteria are met — the relevant functional/exercise test, adequate LVEF (below 40% is generally disqualifying) and controlled angina"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 999", html:"\"Chest pain like your heart attack, not settling with GTN and rest within 15 minutes — call 999, and do not drive yourself.\""},
         {tone:"red", h:"⛔ Never stop the blood thinners on someone else's say-so", html:"\"Do not stop the blood-thinning tablets for dental work or minor surgery without checking with us or cardiology first — it risks a clot in the stent.\""},
         {tone:"amber", h:"🩸 Bleeding", html:"\"Black tarry stools, vomiting blood, or any bleed that will not stop — get seen urgently, and tell them you are on blood thinners.\""},
         {tone:"green", h:"💪 Feeling well means they are working", html:"\"All your heart tablets carry on even when you feel completely better — that is exactly when they are doing their job.\""}
       ]},
       {b:"say", html:"We will build the doses up over the next few weeks to get you the full protection, and check your kidneys and salts as we go. On driving: with a normal licence it is usually a week off the road after a successful stent if your heart is pumping well and no further procedure is planned, or four weeks if you did not have one — and if you drive a lorry or a bus, you must tell the DVLA yourself."}
     ]},

    {id:"troubleshoot", nav:"Not right?", title:"Something not right? Optimise the core drugs before anything else",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"1 · Are the core drugs actually on board?", html:"DAPT, statin, ACE inhibitor, beta-blocker, ± MRA if the post-MI/HFrEF criteria are met — prescribed AND titrated, or sitting at starter doses? This is the first question every time."},
         {tone:"amber", h:"2 · Has the statin quietly stopped?", html:"<b>Discontinued, or labelled \"intolerant\" without a rechallenge?</b> Rechallenge or switch before abandoning, and consider ezetimibe."},
         {tone:"red", h:"3 · New angina or breathlessness", html:"Recurrent symptoms — is this stable angina (see <a href='stable-angina.html'>stable angina</a>) or a new event? ACS → 999."},
         {tone:"amber", h:"4 · Bleeding on DAPT", html:"<b>Significant bleeding → urgent assessment</b>, haemodynamic management, source control and a multidisciplinary decision about temporary interruption or reversal. Add a PPI for GI risk (avoid omeprazole and esomeprazole with clopidogrel). <b>Do not stop either agent without cardiology advice.</b>"},
         {tone:"blue", h:"5 · LV dysfunction", html:"EF ≤40% with clinical heart failure → has an aldosterone antagonist been considered via the cardiology or heart-failure plan, with potassium and renal function checked, and are the beta-blocker and ACE inhibitor at target? See <a href='heart-failure.html'>heart failure</a> for four-pillar therapy."},
         {tone:"green", h:"6 · Mood and rehab", html:"Untreated depression and unattended rehabilitation both worsen outcomes — and neither shows up unless you ask."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"When to involve cardiology",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999 / emergency", html:"<b>Suspected re-infarction — ACS symptoms.</b>"},
         {tone:"amber", h:"Cardiology", html:"Recurrent angina · DAPT duration decisions · high bleeding risk · triple-therapy management · device or ejection-fraction concerns."},
         {tone:"blue", h:"Heart failure team", html:"<b>EF ≤40% or clinical heart failure — for four-pillar therapy.</b> See <a href='heart-failure.html'>heart failure</a>."},
         {tone:"blue", h:"Lipid clinic", html:"Not at LDL target despite a statin plus ezetimibe (injectable pathway, if NICE and GMMMG criteria are met), or possible familial hypercholesterolaemia. See <a href='familial-hypercholesterolaemia.html'>familial hypercholesterolaemia</a>."},
         {tone:"green", h:"Cardiac rehabilitation", html:"Everyone — check it happened if they were not auto-referred at discharge."},
         {tone:"cream", h:"GP management", html:"Titrating the core drugs to target, lipid escalation, DAPT step-down at 12 months, rehab and mood, the annual review and the DVLA advice all belong here. Related pages: <a href='stable-angina.html'>stable angina</a> · <a href='heart-failure.html'>heart failure</a> · <a href='hypercholesterolaemia.html'>lipid management</a> · <a href='hypertension.html'>hypertension</a> · <a href='antiplatelets-anticoagulants.html'>antiplatelets and anticoagulants</a>."}
       ]},
       {b:"say", html:"Most of the work from here is with us — getting your heart tablets up to full strength, the rehabilitation done, and keeping an eye on your bloods. Cardiology step in if the symptoms come back, or for decisions about how long to stay on the second blood thinner."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 59-year-old man attends 6 weeks after an anterior STEMI treated with primary PCI. He is on aspirin 75 mg, ticagrelor 90 mg BD, atorvastatin 80 mg, ramipril 2.5 mg and bisoprolol 1.25 mg. <b>Echo showed EF 38%.</b> He feels well, has <b>not attended cardiac rehab</b> (\"I didn't fancy the group thing\"), and asks when he can get back to <b>driving his delivery lorry</b>. BP 128/76, HR 72, U&amp;Es normal."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Identifies that ramipril and bisoprolol are at STARTER doses six weeks on — the drugs are not failed, they are untitrated — and up-titrates both with a plan for U&amp;Es 1–2 weeks after; <b>spots that EF 38% means an aldosterone antagonist should be considered</b> — checking for heart-failure symptoms or signs and the licensed post-MI eplerenone criteria, with potassium and renal function, via the cardiology or heart-failure plan; <b>fixes the DAPT stop date at 12 months in the notes</b>; addresses rehab non-attendance as a treatment failure rather than a preference, exploring the reason and offering alternatives; <b>screens for depression and anxiety</b>, which are common at this point; gives the Group 2 DVLA rules accurately — must stop driving and notify the DVLA, relicensing considered only after at least 6 weeks if all criteria are met, and an LVEF below 40% is generally disqualifying for Group 2 — and recognises the occupational and financial weight of that for a lorry driver; <b>advises not stopping DAPT for dental work without checking the dental and cardiology plan</b>; and <b>checks lipids and transaminases are booked for 2–3 months.</b>"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG185 — Acute coronary syndromes</b><br><a href="https://www.nice.org.uk/guidance/ng185" rel="noopener">nice.org.uk/guidance/ng185</a><span class="rd"> — core post-MI drugs (ACE inhibitor, DAPT, beta-blocker, statin), DAPT for up to 12 months then aspirin alone, P2Y12 inhibitor choice, ACE inhibitor titration and monitoring, beta-blocker continuation (indefinite if LVEF reduced; review after 12 months if preserved), and the aldosterone antagonist indication 3–14 days after MI with symptoms or signs of heart failure and reduced LVEF</span></li>'+
         '<li>NICE NG238 — Cardiovascular disease: risk assessment and lipid modification<br><a href="https://www.nice.org.uk/guidance/ng238" rel="noopener">nice.org.uk/guidance/ng238</a><span class="rd"> — atorvastatin 80 mg for secondary prevention, the LDL ≤2.0 and non-HDL ≤2.6 targets, lipid and transaminase monitoring at 2–3 months then annual review, ezetimibe (including when the target is achieved), and the inclisiran and PCSK9-inhibitor criteria</span></li>'+
         '<li><b>NICE NG185 visual summary — Cardiac rehabilitation and secondary prevention</b><br><a href="https://www.nice.org.uk/guidance/ng185" rel="noopener">nice.org.uk/guidance/ng185</a><span class="rd"> — timing of cardiac rehabilitation, ACE inhibitor titration within 4–6 weeks of discharge and monitoring</span></li>'+
         '<li><b>GMMMG — Lipid medication eligibility pathway for secondary prevention (2025); Inclisiran prescribing guidelines (2025); Statin-intolerance pathway</b><br><a href="https://gmmmg.nhs.uk/wp-content/uploads/2025/10/GM-secondary-prevention-pathway-v1.6-2025.pdf" rel="noopener">GM secondary prevention pathway v1.6 (PDF)</a><span class="rd"> — local criteria for ezetimibe, inclisiran and PCSK9 inhibitors, inclisiran outcome data pending, and statin-intolerance management</span></li>'+
         '<li><b>GMMMG Formulary — Cardiovascular system</b><br><a href="https://www.greatermanchesterformulary.nhs.uk" rel="noopener">greatermanchesterformulary.nhs.uk</a><span class="rd"> — local positioning of bempedoic acid (with ezetimibe, not routinely with a statin)</span></li>'+
         '<li><b>DVLA — Assessing fitness to drive</b><br><a href="https://www.gov.uk/government/publications/assessing-fitness-to-drive-a-guide-for-medical-professionals" rel="noopener">gov.uk — assessing fitness to drive</a><span class="rd"> — cardiovascular standards (acute coronary syndromes). Group 1: 1 week after successful PCI if conditions met, 4 weeks otherwise, notification generally not required; Group 2: stop driving and notify, relicensing after at least 6 weeks if functional test, LVEF (≥40%) and angina criteria are met</span></li>'+
         '<li><b>Lyon Diet Heart Study</b><span class="rd"> — the Mediterranean dietary pattern evidence referenced in the rehabilitation and lifestyle table</span></li>'+

  foot:"MI secondary prevention — NICE NG185, NG238, TA733, TA393 and TA394. Core treatment unless contraindicated, titrated rather than merely prescribed: antiplatelet therapy, atorvastatin 80 mg or maximum tolerated, an ACE inhibitor and a beta-blocker; an aldosterone antagonist only when the post-MI/HFrEF criteria are met. Check U&Es and potassium 1–2 weeks after any ACE inhibitor or MRA change. Do not stop or change DAPT without the cardiology plan — stent thrombosis is the risk. Refer everyone to cardiac rehabilitation and check they attended. Group 1 drivers usually stop for 1 week after successful PCI or 4 weeks otherwise; Group 2 must stop driving and notify the DVLA. Verify all doses against the BNF before prescribing."
