  ],
  lead:'<div class="mg-layers"><a href="#safety"><b>Safety first</b><small>Brand · hypos · DVLA</small></a><a href="#before"><b>Before starting</b><small>Keep · stop · counsel</small></a><a href="#basal"><b>Start basal</b><small>Formulary basal</small></a><a href="#titrate"><b>Titrate</b><small>Local schedule</small></a><a href="#prandial"><b>Still high?</b><small>Basal-plus</small></a></div>',
  quickSub:"The six that matter. Sources are labelled under <a href=\"#provenance\">Evidence</a> as NICE NG28, GMMMG local protocol, DVLA, MHRA or product information.",
  quick:[
    {tone:"red", h:"⚠ Always prescribe insulin by BRAND, using the full product name", html:"Insulin products, devices and concentrations should not be switched automatically — any change must be clinically authorised, prescribed by the new brand/product and accompanied by patient counselling and appropriate monitoring. Brand prescribing is what prevents a dangerous substitution error. \"Insulin glargine\" is not a prescription — <b>Semglee®</b> or <b>Abasaglar®</b> is. Never write just \"insulin\", a strength without a product, or an abbreviation. Write \"units\" in full, never \"U\" or \"iu\"."},
    {tone:"blue", h:"Basal insulin — shared decision, GMMMG formulary product", html:"NICE NG28: offer basal insulin once or twice daily initially, choosing the preparation by shared decision — carer or healthcare-professional administration, concern about nocturnal hypoglycaemia, preference for once-daily injection, and cost when options are otherwise equally suitable. In Greater Manchester use the current GMMMG formulary; human isophane (<b>Insuman Basal®, Insulatard®</b> or <b>Humulin I®</b>) is a cost-effective option for many adults. <i>GMMMG local protocol:</i> start 10 units once daily at the same time each day; it is not food-dependent. Start lower — 6–10 units — in frailty, older age, advanced renal impairment or high hypoglycaemia risk."},
    {tone:"blue", h:"Self-titration — GMMMG local schedule", html:"Titrate against the pre-breakfast (fasting) capillary glucose, reading 4–7 day PATTERNS rather than single values, and teach the patient to do it themselves. GMMMG local protocol (not specified in this form by NICE NG28): increase by 2 units every 3 days until the individualised fasting target is reached without hypoglycaemia. By fasting CBG: under 4 → treat the hypo, do not increase, reduce 10% and review the cause · 4–7 → no change · 7.1–15 → +10% · 15.1–20 → +15% · over 20 → +20%. Do not keep escalating if fasting is at target but HbA1c remains high."},
    {tone:"amber", h:"Fasting at target but HbA1c still high? Do NOT add more basal", html:"That pattern means the problem is post-prandial, and more basal will only cause hypoglycaemia. Assess post-prandial glucose and injection technique, then choose by glucose pattern, injection preference, ability to monitor, meal pattern and local specialist pathway: one rapid-acting dose with the meal causing the largest rise (GMMMG local protocol: 4 units, titrated by 2 units twice weekly), a twice-daily premixed regimen, a GLP-1 receptor agonist/insulin combination only within the NICE and local specialist pathway, or diabetes-team advice. <b>This single distinction is the most useful thing on the page</b>, and getting it wrong is the commonest reason a patient ends up on a large basal dose with recurrent hypos and an unchanged HbA1c."},
    {tone:"green", h:"Keep metformin. Review the sulfonylurea.", html:"Continue metformin, and usually the SGLT2 inhibitor for its cardio-renal benefit. Stop or substantially reduce the sulfonylurea when insulin starts, unless there is a documented reason to continue it — if continued temporarily, set a review date and hypoglycaemia monitoring plan. Continue a GLP-1 receptor agonist with insulin only where consistent with NICE, the current GMMMG formulary/pathway and specialist diabetes-team advice; stop a DPP-4 inhibitor when a GLP-1 receptor agonist or tirzepatide is used. Insulin promotes weight gain, so the weight-favourable agents are worth keeping deliberately."},
    {tone:"purple", h:"🟣 DVLA — check the current requirements", html:"Insulin-treated drivers generally need to notify the DVLA when insulin treatment continues beyond 3 months; temporary insulin treatment of less than 3 months may not require notification if the person is medically supervised and not at risk of disabling hypoglycaemia. <b>Group 2</b> (bus, coach, lorry) drivers must stop driving Group 2 vehicles when insulin is started, pending a DVLA decision. Test before the first journey and at least every 2 hours while driving; do not drive if glucose is below 4.0 mmol/L or with hypo symptoms; impaired awareness → stop driving and medical review. Advise the patient to check the current DVLA guidance directly, and record that you gave the advice."}
  ],
  pathwaySub:"Five steps. Step four is where most regimens go wrong.",
  pathway:[
    {title:"Confirm insulin is the right next step", html:"Symptomatic or marked hyperglycaemia, suspected insulin deficiency or catabolism, or individualised targets not achieved despite appropriate non-insulin treatment (see the <a href='type-2-diabetes.html'>type 2 diabetes protocol</a>). Do not delay specialist assessment where type 1 diabetes, LADA, ketosis or another specific diabetes type is possible; suspected DKA or HHS needs same-day assessment."},
    {title:"Decide what stays and what stops", html:"Keep metformin and usually the SGLT2 inhibitor. Stop or substantially reduce the sulfonylurea. Arrange structured education — technique, hypoglycaemia, sick-day rules, monitoring and driving."},
    {title:"Start basal insulin — formulary product, by brand", html:"Choose by shared decision and the current GMMMG formulary. GMMMG local protocol: 10 units once daily; 6–10 units in frailty, older age, advanced renal impairment or high hypoglycaemia risk. A basal analogue may be more suitable for problematic nocturnal hypoglycaemia, carer administration or another individual clinical reason.", alert:true},
    {title:"Titrate on patterns, not readings", html:"GMMMG local schedule — +2 units every 3 days against the fasting glucose, read over 4–7 days, self-titrated by the patient. Before increasing: check diet, activity, injection sites for lipohypertrophy, and adherence."},
    {title:"If HbA1c stays high, ask WHERE", html:"Fasting not at target → keep titrating basal. Fasting at target → avoid over-basalisation; consider basal-plus, premixed insulin or a GLP-1/insulin combination per NICE and the local pathway. Little response despite appropriate titration → specialist advice, not blind escalation."}
  ],
  sections:[

    {id:"safety", nav:"Safety first", title:"The safety rules that apply from the first prescription",
     blocks:[
       {b:"warn", html:"<b>Scope.</b> This guide combines NICE NG28 with current GMMMG local formulary and titration recommendations. Local protocol elements are identified separately. Check the current GMMMG formulary, medicines-supply information, product information and DVLA guidance before prescribing. It is not intended for type 1 diabetes, pregnancy, DKA/HHS, children or complex specialist insulin regimens."},
       {b:"cards", items:[
         {tone:"red", h:"🔴 Urgent assessment first", html:"Same-day or emergency assessment for vomiting, dehydration, abdominal pain, drowsiness or suspected DKA · ketones · rapid weight loss or catabolic symptoms · possible type 1 diabetes or LADA · very high glucose with possible HHS."},
         {tone:"red", h:"🤰 Pregnancy, pre-conception or breastfeeding", html:"Refer to the diabetes–antenatal team. Do not apply this general titration algorithm without specialist input."},
         {tone:"red", h:"⛔ Brand, full product name, \"units\" written out", html:"<b>Do not switch insulin products, devices or concentrations automatically</b> — any change, including a biosimilar switch, needs clinical authorisation, prescribing by the new brand, counselling and monitoring. Write the brand (Insuman Basal®, Insulatard®, Humulin I®, Semglee®, Abasaglar®, Levemir®), the device, the strength, and <b>\"units\" in full — never \"U\" or \"iu\", which are misread as zeros.</b>"},
         {tone:"red", h:"⛔ Do not omit or stop insulin during illness without clinical advice", html:"Continue monitoring glucose frequently and follow the individual sick-day plan. Insulin requirements often rise during intercurrent illness, but basal insulin may need adjustment if oral intake is reduced or hypoglycaemia occurs. In type 1 diabetes insulin must not be stopped. Check capillary glucose 3–4 hourly if vomiting or dehydrated, and test ketones if glucose is above 13 mmol/L or the patient is unwell (Diabetes UK) . <b>On an SGLT2 inhibitor:</b> pause it during vomiting, diarrhoea, dehydration, reduced oral intake, prolonged fasting, acute serious illness or hospital admission. Suspect DKA from symptoms — nausea, vomiting, abdominal pain, anorexia, unusual fatigue, drowsiness, deep or rapid breathing — even if glucose is normal or only modestly raised; check blood ketones urgently and arrange same-day or emergency assessment. Seek urgent advice for persistent vomiting, dehydration, drowsiness, significant ketones or inability to manage insulin safely. See <a href='sick-day-rules.html'>sick day rules</a> and <a href='diabetes-unwell-insulin.html'>feeling unwell on insulin</a>."},
         {tone:"amber", h:"⚠ High-strength and ultra-long insulins — check formulary criteria", html:"Do not use high-strength or ultra-long-acting insulin (e.g. Toujeo® 300 units/mL, degludec) routinely without checking the current GMMMG formulary criteria — they may be appropriate for selected patients (problematic nocturnal hypoglycaemia, injection-volume issues, flexible timing, third-party administration), usually following specialist or locally defined approval. Prescribe by brand, strength and device; confirm the dose in units and that the patient understands the pen's dose increments. Compatible pens display the dose in units — the danger is a product, device, concentration or syringe mismatch, or a prescribing or administration error."},
         {tone:"purple", h:"🟣 DVLA is the patient's legal duty", html:"<b>Notification:</b> insulin treatment continuing beyond 3 months generally needs DVLA notification; temporary insulin of less than 3 months may not, if medically supervised and not at risk of disabling hypoglycaemia. <b>Group 2:</b> stop driving Group 2 vehicles when insulin starts, pending a DVLA decision; capillary testing per DVLA requirements. <b>All drivers:</b> test before the first journey and at least every 2 hours while driving; do not drive if glucose is below 4.0 mmol/L or with hypo symptoms; carry fast-acting carbohydrate and testing equipment — Group 1 CGM/flash users carry a capillary meter for confirmation and backup. <b>Hypo while driving:</b> stop safely, switch off the engine, remove the keys, treat it, and do not resume until at least 45 minutes after glucose has recovered to at least 5.0 mmol/L. <b>Impaired awareness</b> → stop driving and medical review. Advise checking the current DVLA guidance directly. <b>Record that you gave this advice</b> — it is the commonest omission in an insulin initiation consultation."},
         {tone:"blue", h:"📋 Baseline before the first dose", html:"HbA1c and an explicitly agreed individualised target · renal function/eGFR · weight and BMI · hypoglycaemia risk and awareness · visual and manual ability · cognition and ability to self-administer · injection device and needle prescription · access to glucose monitoring and training · injection technique and site examination · occupation and driving group · alcohol, exercise, fasting and Ramadan · pregnancy potential · review of metformin, SGLT2 inhibitor, sulfonylurea and GLP-1 therapy · follow-up date and responsible clinician. Without the target written down, titration has no endpoint."},
         {tone:"green", h:"✓ The sentence that makes this acceptable", html:"\"Starting insulin doesn't mean anything has failed — type 2 diabetes changes over time, and the body often just needs help making enough insulin.\" Patients routinely experience insulin as a personal failure or a sign of severity; saying this first is what makes the rest of the consultation land."}
       ]}
     ]},

    {id:"before", nav:"Before starting", title:"Before you start — the right step, and what stays",
     blocks:[
       {b:"table", head:["Question","Answer"], rows:[
         ["<b>When to start insulin</b>","Consider insulin when there is symptomatic or marked hyperglycaemia, suspected insulin deficiency/catabolism, or when individualised glycaemic targets are not achieved despite appropriate non-insulin treatment (see the <a href='type-2-diabetes.html'>type 2 diabetes protocol</a>). In symptomatic hyperglycaemia NICE NG28 advises considering insulin or a sulfonylurea; particularly when HbA1c is 75 mmol/mol or higher, consider basal insulin combined with short- or rapid-acting insulin, separately or as a premixed preparation. Do not delay specialist assessment where type 1 diabetes, LADA, ketosis or another specific diabetes type is possible"],
         ["<b>Is this actually type 2?</b>","Lean build, ketosis-prone, rapid weight loss, very high glucose, or a young age at onset → consider type 1, LADA, pancreatic or monogenic (MODY) diabetes and seek urgent specialist input. Vomiting, dehydration, abdominal pain, drowsiness, ketones or very high glucose → same-day assessment for DKA or HHS. This protocol is for type 2 diabetes, and starting basal insulin in undiagnosed type 1 is dangerous"],
         ["<b>Keep — metformin</b>","<b>Continue it.</b> It reduces the insulin dose required and limits weight gain"],
         ["<b>Keep — SGLT2 inhibitor</b>","<b>Usually continue for cardio-renal benefit.</b> <b>But remember the euglycaemic DKA risk when unwell</b>, and counsel accordingly — pause it during acute illness, and do not restart after DKA unless another clear cause has been identified and resolved"],
         ["<b>Stop or reduce — sulfonylurea</b>","Stop or substantially reduce when insulin starts, unless there is a documented reason to continue it; if continued temporarily, define the review date and hypoglycaemia monitoring plan. The hypoglycaemia risk is additive and the glycaemic gain is small. This is the single most useful deprescribing step at insulin initiation"],
         ["<b>GLP-1 receptor agonist</b>","<b>Continue with insulin only where consistent with NICE, the current GMMMG formulary/pathway and specialist diabetes-team advice</b> — NICE expects specialist care advice and ongoing support from a consultant-led multidisciplinary team. Do not assume it automatically remains appropriate after insulin starts; review efficacy, weight, gastrointestinal tolerance, insulin dose and hypoglycaemia risk. Stop a DPP-4 inhibitor when a GLP-1 receptor agonist or tirzepatide is used; verify local commissioning and formulary criteria"],
         ["<b>Structured education (NICE NG28)</b>","A structured education programme at initiation, not just an injection demonstration: injection technique and site rotation · self-monitoring · dose titration · dietary advice · hypoglycaemia recognition and treatment · managing acute changes in glucose and sick-day rules · DVLA · needles and sharps disposal · written hypo, sick-day, driving, exercise and travel advice · travel and fasting (including <a href='t2dm-ramadan.html'>Ramadan</a>) · and that the dose WILL be titrated, by them, upward from a deliberately low start"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"🍽️ Lifestyle does not stop at insulin", html:"Carbohydrate awareness, portion control and a healthy dietary pattern reduce the insulin dose needed and the weight gained. Involve a dietitian."},
         {tone:"blue", h:"🏃 Activity", html:"<b>Regular activity improves control and cardiovascular risk</b> — counsel specifically on glucose checks and hypoglycaemia risk around exercise, which changes once insulin is on board."},
         {tone:"amber", h:"⚖️ Weight gain is expected, not incidental", html:"<b>Insulin promotes weight gain.</b> Reinforce weight management from the start, keep the weight-favourable agents, and <b>consider down-titrating insulin if HbA1c and BMI are both improving.</b>"},
         {tone:"green", h:"🦶 The rest of the diabetes review continues", html:"Daily foot care, smoking cessation, BP and lipid control, and annual retinal, foot and renal screening are unchanged by starting insulin."}
       ]}
     ]},

    {id:"basal", nav:"Start basal", title:"Step 1 — starting the basal insulin",
     blocks:[
       {b:"table", head:["Role","GMMMG formulary product","Alternatives"], rows:[
         ["<b>Basal — human isophane (cost-effective option for many)</b>","<b>Insuman Basal®</b>","Insulatard® · Humulin I® — confirm current formulary status and availability"],
         ["<b>Basal — long-acting analogue (where more suitable)</b>","<b>Semglee® or Abasaglar® (glargine)</b>","Levemir® (detemir) — being discontinued in the UK, supply expected to end December 2026 (manufacturer/NHS medicines-supply information as of September 2026 — check current supply status); do not start it in new patients"]
       ]},
       {b:"dl", rows:[
         ["<b>Starting dose (GMMMG local protocol)</b>","<b>A common local starting regimen is 10 units once daily, at the same time each day.</b> Prescribe the full brand, strength, formulation and device; write 'units' in full. It is not food-dependent, so the timing can suit the patient"],
         ["<b>Frailty, older age, advanced renal impairment or high hypoglycaemia risk (GMMMG)</b>","<b>Start lower — 6–10 units once daily</b>"],
         ["<b>When an analogue may be more suitable</b>","Problematic nocturnal hypoglycaemia, a need for carer administration, a preference for once-daily injection, or another individual clinical reason — examples, not the only indications. Some basal analogues provide a flatter and more prolonged pharmacokinetic profile than isophane insulin and may reduce nocturnal hypoglycaemia in selected individuals"],
         ["<b>High-strength and ultra-long insulins</b>","Toujeo®, degludec — not routinely without checking current GMMMG formulary criteria; may suit selected patients, usually after specialist or locally defined approval. Prescribe by brand, strength and device"]
       ]},
       {b:"why", html:"NICE NG28 asks for a shared decision on the basal preparation, taking into account carer or healthcare-professional administration, concern about nocturnal hypoglycaemia, preference for once-daily injection and comparative cost when options are otherwise equally suitable. Human isophane is cost-effective for many adults; analogues mainly help with <b>nocturnal hypoglycaemia</b> and practicality rather than HbA1c. In Greater Manchester the NG28 updates are under local review — follow the current GMMMG formulary until the local pathway is finalised, and record the reason for the product chosen."}
     ]},

    {id:"titrate", nav:"Titrate", title:"Step 2 — titration, done by the patient",
     sub:"Against the fasting glucose, on patterns, with a defined increment.",
     blocks:[
       {b:"dl", rows:[
         ["<b>What to titrate against</b>","<b>The pre-breakfast (fasting) capillary glucose</b> — because the basal dose is what determines it"],
         ["<b>How to read it</b>","<b>Patterns over 4–7 days, not one-off readings.</b> Unless you are worried about hypoglycaemia, never change a dose on a single value"],
         ["<b>Standard increment (GMMMG local protocol)</b>","Increase by 2 units every 3 days until the individualised fasting target is reached WITHOUT hypoglycaemia, based on the pattern of the last 3 fasting readings, not one reading. This schedule is taken from the current GMMMG local insulin prescribing aid and is not specified in this form by NICE NG28. Teach the patient to self-titrate and when to contact the practice: any hypo, a reading they cannot explain, or no progress after several steps"],
         ["<b>Titration table by fasting CBG (GMMMG local protocol)</b>","Under 4 mmol/L → treat the hypoglycaemia immediately, do not increase the dose, review the cause and reduce by 10%; reduce promptly (a larger or immediate reduction may be needed) and seek clinical advice for recurrent, nocturnal, severe or unexplained hypoglycaemia — the 10% reduction is a local starting rule and does not replace clinical judgement · 4–7 → no change · 7.1–15 → increase 10% · 15.1–20 → increase 15% · over 20 → increase 20%"],
         ["<b>Individualising the target</b>","GMMMG local protocol: CKD stage 4–5, the elderly, or reduced hypoglycaemia awareness → aim for 5–9 mmol/L pre-meal. <b>At end of life, the only goal is freedom from osmotic symptoms</b> — not a number"],
         ["<b>When HbA1c AND BMI are both falling</b>","Consider DOWN-titrating the insulin, guided by glucose readings, to avoid hypoglycaemia and further weight gain. Insulin doses are not a ratchet"],
         ["<b>Stop escalating basal — over-basalisation</b>","Do not continue escalating if the fasting glucose is at target but HbA1c remains high. Suspect over-basalisation when the basal dose becomes disproportionate to body weight, or fasting glucose is controlled but HbA1c stays high — go to <a href='#prandial'>Step 3</a>"]
       ]},
       {b:"warn", html:"Before increasing any dose, check what blunts insulin's effect: diet, carbohydrate load and alcohol · activity · intercurrent illness · injection technique · injection sites for lipohypertrophy, which causes erratic absorption and is found only by examining them · and adherence, asked without judgement. Escalating the dose against lipohypertrophy or missed injections produces an unpredictable regimen and a hypoglycaemia risk that arrives without warning when technique improves."},
       {b:"say", html:"I am going to start you on a deliberately small dose — ten units once a day — and then you are going to increase it yourself. Check your sugar before breakfast, and look at the readings over about a week rather than reacting to any single one. If the morning numbers are still above the target we agreed, add two units, wait three days, and look again. Keep going until you are at target. If any reading is below four, treat it straight away, don't increase the dose, come down by ten per cent and tell me — and contact us promptly if it happens again, at night, or you needed help. Most people need considerably more than ten units in the end — the small start is about getting there safely, not about the final dose."}
     ]},

    {id:"prandial", nav:"Still high?", title:"Step 3 — HbA1c above target: ask WHERE the glucose is high",
     sub:"The fork that decides whether you add basal or prandial insulin.",
     blocks:[
       {b:"table", head:["Situation","What it means","Action"], rows:[
         ["<b>Fasting glucose NOT at target</b>","The basal dose is insufficient","<b>Continue basal titration cautiously (GMMMG local schedule)</b>"],
         ["<b>Fasting AT target but HbA1c still above target</b>","The problem is post-prandial. More basal will cause hypoglycaemia without improving HbA1c","<b>Assess post-prandial glucose and injection technique; avoid further basal escalation solely to reduce HbA1c.</b> Then, by glucose pattern, injection preference, ability to monitor, meal pattern and local specialist pathway: basal-plus, twice-daily premix, a GLP-1 receptor agonist/insulin combination within the specialist pathway, or diabetes-team advice — adding one prandial dose is not always the mandatory next step"],
         ["<b>Basal-plus — add one prandial dose</b>","Cover the meal causing the largest post-prandial rise","GMMMG local protocol: add 4 units of a rapid-acting analogue once daily with that meal. Brands: insulin lispro Sanofi®, Apidra®, NovoRapid®. Titrate +2 units twice weekly to the post-prandial target. Give just before, with, or just after food"],
         ["<b>Basal-bolus — extend to other meals</b>","One prandial dose insufficient","Add prandial insulin stepwise to the other meals, adjusting each meal's dose against the NEXT pre-meal or pre-bed glucose"],
         ["<b>Twice-daily pre-mix — the simpler alternative</b>","Fewer injections wanted, or basal-bolus impractical","<b>Humulin M3®, NovoMix® 30, Humalog® Mix25 or Mix50.</b> If control is inadequate on twice-daily pre-mix, refer to the diabetes specialist team rather than escalating further"],
         ["<b>GLP-1 receptor agonist/insulin combination</b>","Weight or hypoglycaemia concerns limit further insulin","Only within the relevant NICE and local specialist pathway, with specialist care advice and ongoing support from a consultant-led multidisciplinary team"],
         ["<b>Little response to appropriate titration</b>","<b>True insulin resistance, or something else going on</b>","<b>Seek specialist advice — do not keep escalating blindly.</b> Very large doses with no glycaemic response is a referral, not a prescription"]
       ]},
       {b:"why", html:"This is the section that changes outcomes, because the instinct when HbA1c is high is to increase the dose that is already there. If the fasting glucose is at target, the basal insulin is doing its job and the excess glucose is coming from meals — so more basal simply drives the fasting level down into hypoglycaemia, most dangerously overnight, while HbA1c barely moves. Asking \"where in the day is the glucose high?\" before changing anything is the whole of good insulin titration."}
     ]},

    {id:"problems", nav:"Problems", title:"Hypoglycaemia, weight, sites and sick days",
     blocks:[
       {b:"table", head:["Issue","What to do"], rows:[
         ["<b>Hypoglycaemia</b>","If conscious and able to swallow, treat with 15 g of fast-acting carbohydrate and recheck after 10–15 minutes; repeat if still below 4 mmol/L, then a longer-acting carbohydrate if the next meal is not imminent. Never give oral treatment to someone unconscious or unsafe to swallow; provide a glucagon plan where appropriate. Then act on the cause: reduce the responsible dose (10% is the local starting rule), stop the sulfonylurea if still prescribed, and look for the precipitant — missed meal, unaccustomed exercise, alcohol, lipohypertrophy, or improving renal function. Recurrent, severe or unexplained episodes require medication and regimen review"],
         ["<b>Hypoglycaemia unawareness or a severe episode</b>","Stop driving and arrange medical review before resuming (DVLA); relax the glucose target; structured education; consider an analogue switch or technology assessment; specialist referral"],
         ["<b>Weight gain</b>","Reinforce diet and activity; keep metformin, the SGLT2 inhibitor and any GLP-1 agonist continued within the specialist pathway; down-titrate the insulin if HbA1c and BMI are both improving"],
         ["<b>Sick days</b>","Do not omit or stop insulin without clinical advice; follow the individual sick-day plan — basal insulin may need adjustment if intake is reduced or hypoglycaemia occurs (in type 1 diabetes insulin must not be stopped). Check capillary glucose 3–4 hourly if vomiting or dehydrated. Test ketones if glucose is above 13 mmol/L or the patient is unwell (Diabetes UK). <b>SGLT2 inhibitor:</b> pause during vomiting, diarrhoea, dehydration, reduced intake, prolonged fasting, acute serious illness or admission; suspect DKA from symptoms, not glucose level — test blood ketones (urine ketones are less reliable), stop the SGLT2 inhibitor immediately if DKA is suspected, and restart only once clinically stable and eating and drinking normally, per local guidance — not after DKA unless another clear cause has been identified and resolved"],
         ["<b>Injection sites</b>","Rotate sites, and EXAMINE them at review — lipohypertrophy causes erratic absorption and unexplained variability, and is found only by looking and feeling"],
         ["<b>Monitoring</b>","HbA1c every 3–6 months until stable, then 6-monthly. Capillary glucose patterns. Annual diabetes review — feet, eyes, renal function with urine ACR, lipids and BP"]
       ]},
       {b:"cards", items:[

         {tone:"green", h:"✓ Down-titration is a legitimate move", html:"If HbA1c and weight are both falling, the insulin requirement is falling too. Reduce guided by readings — this prevents the slow accumulation of unnecessary dose that causes hypoglycaemia months later."}
       ]}
     ]},

    {id:"monitor", nav:"Follow up", title:"Review",
     blocks:[
       {b:"table", head:["When","What to do"], rows:[
         ["<b>Every 3–6 months until stable, then 6-monthly</b>","HbA1c against the agreed individualised target; titrate insulin against home glucose readings; review whether the other agents are all still needed"],
         ["<b>Every review</b>","Hypoglycaemia — frequency, awareness, nocturnal episodes. Injection sites examined for lipohypertrophy, and technique observed. Weight. Adherence. Reinforce sick-day rules and DVLA advice; confirm the driving group and record the advice given"],
         ["<b>Annually</b>","<b>Feet, retinal screening, U&amp;E with eGFR and urine ACR, lipids, BP.</b> Address cardiovascular risk and consider an SGLT2 inhibitor or GLP-1 agonist where indicated for cardio-renal benefit"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 999 / same day", html:"\"Vomiting and unable to keep fluids down, drowsy, tummy pain, fast or deep breathing, or ketones high — that is an emergency, even if your sugar is normal on an SGLT2 tablet. Don't stop or skip your insulin because you are not eating without speaking to us first.\""},
         {tone:"amber", h:"🟠 Contact us", html:"Any hypo that needed help from someone else, happened at night or while driving, or that you cannot explain · repeated lows · a reading you cannot explain · illness lasting more than 24 hours."},
         {tone:"blue", h:"💊 The titration instruction", html:"\"Two units up every three days if your morning readings are still above target. If any reading is below four: treat it, don't increase, come down ten per cent and tell us.\""},
         {tone:"green", h:"✓ Expectation setting", html:"\"Most people end up needing a good deal more than the starting dose — that is normal and not a sign of getting worse. We start low and climb because that is the safe direction.\""}
       ]}
     ]},

    {id:"loop", nav:"Not responding?", title:"HbA1c still high on insulin? Re-run the checklist", sub:"More units isn't always the answer. Before escalating insulin, check the basics that blunt its effect.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"1 · Fasting at target?", html:"If fasting is at target but HbA1c is high, the problem is <b>post-prandial</b> → consider basal-plus, premix or specialist options; do not pile on more basal."},
         {tone:"amber", h:"2 · Technique and sites", html:"Lipohypertrophy, wrong needle length or technique, missed doses. Inspect the sites — do not take this from history alone."},
         {tone:"amber", h:"3 · Oral agents", html:"<span class='rx'>Metformin</span> and any <span class='rx'>SGLT2 inhibitor</span> continued? Sulfonylurea stopped to reduce hypoglycaemia?"},
         {tone:"amber", h:"4 · Patterns", html:"Titrating on <b>4–7-day trends</b>, not single readings? One high morning reading is not a dose change."},
         {tone:"blue", h:"5 · True resistance", html:"Little response despite genuine titration → specialist advice rather than further unilateral escalation."}
       ]},
       {b:"cards", items:[
         {tone:"green", h:"Still uncontrolled after all five?", html:"Uncontrolled on BD pre-mix, true insulin resistance, or recurrent severe hypoglycaemia → refer to the <b>diabetes team</b>."}
       ]}
     ]},
    {id:"refer", nav:"Refer", title:"When to involve the diabetes specialist team",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Urgent — possible type 1, LADA, MODY, DKA or HHS", html:"Vomiting, dehydration, abdominal pain, drowsiness, ketones or very high glucose → same-day or emergency assessment for DKA or HHS. Lean build, ketosis-prone, rapid weight loss, very high glucose, or a young age at onset. This protocol is for type 2 diabetes; basal insulin alone in undiagnosed type 1 is dangerous. Urgent specialist input."},
         {tone:"amber", h:"Uncontrolled on twice-daily pre-mix", html:"HbA1c above target despite BD pre-mix insulin → specialist team, for basal-bolus or a GLP-1 combination. Do not keep escalating pre-mix."},
         {tone:"amber", h:"Recurrent severe or unaware hypoglycaemia", html:"Structured education (DAFNE-style), analogue switch, or technology assessment. Relax the target in the meantime."},
         {tone:"amber", h:"Apparent insulin resistance", html:"<b>Little or no response to credible dose titration, or very high insulin requirements.</b> <b>Seek advice rather than continuing to escalate.</b>"},
         {tone:"red", h:"Pregnancy, pre-conception or breastfeeding", html:"Refer to the diabetes–antenatal team — do not apply this general titration algorithm without specialist input. Joint diabetes–antenatal care; tighter targets and specialist insulin regimens. Refer pre-conception where possible."},
         {tone:"cream", h:"GP management", html:"Initiation, titration, the basal-plus step, deprescribing the sulfonylurea, hypoglycaemia, sick days, sites and the annual review are all primary care. Related pages: <a href='type-2-diabetes.html'>type 2 diabetes</a> (the oral ladder) · <a href='t2dm-ramadan.html'>type 2 diabetes in Ramadan</a> · <a href='sick-day-rules.html'>sick day rules</a> · <a href='diabetes-unwell-insulin.html'>feeling unwell on insulin</a> · <a href='dka.html'>DKA</a> · <a href='../algorithms/hypoglycaemia.html'>hypoglycaemia pathway</a>."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 58-year-old woman with type 2 diabetes for 11 years attends for review. <b>HbA1c 79 mmol/mol</b> on metformin 1 g BD, dapagliflozin 10 mg, <b>gliclazide 160 mg BD</b> and dulaglutide. Her <b>fasting readings are 6–7 mmol/L</b> but post-meal values are 14–17. BMI 33. She is tearful and says starting insulin means she has \"failed\", and is worried about her job — she <b>drives a delivery van</b>."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"<b>Addresses the \"failed\" framing FIRST</b> and explains the natural history before any prescribing; reads the glucose pattern correctly — the fasting is at target, so this is a POST-PRANDIAL problem and adding basal would cause hypoglycaemia without moving HbA1c; <b>stops or reduces the gliclazide</b> given the additive hypoglycaemia risk; <b>keeps metformin and dapagliflozin</b> and can say why; reviews whether dulaglutide continues within NICE and local specialist criteria; discusses basal-plus, premix or GLP-1/insulin options rather than more basal; <b>prescribes by brand with \"units\" written in full</b>; gives DVLA advice explicitly — notification once insulin continues beyond 3 months, testing before the first journey and at least every 2 hours while driving, no driving below 4.0 mmol/L — checks her licence group (a larger delivery vehicle may be Group 2, which must stop on starting insulin pending a DVLA decision) and records it; counsels on euglycaemic DKA with the SGLT2 inhibitor and sick-day rules, not stopping insulin without advice; <b>teaches self-titration with a specific increment</b>; arranges <b>glucose monitoring training and a defined review</b>; and addresses weight gain as an expected effect with a plan, not a warning."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Each source is labelled by type — NICE NG28 recommendation, GMMMG local protocol, DVLA licensing advice, MHRA safety advice or manufacturer product information.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG28 — Type 2 diabetes in adults: insulin-based treatments</b> [NICE recommendation]<br><a href="https://www.nice.org.uk/guidance/ng28/chapter/Insulin-based-treatments" rel="noopener">nice.org.uk/guidance/ng28 — insulin-based treatments</a><span class="rd"> — basal insulin once or twice daily chosen by shared decision, insulin in symptomatic hyperglycaemia and HbA1c 75 mmol/mol or higher, bolus or premixed intensification, GLP-1 receptor agonist/insulin only with specialist MDT support, structured education, and stopping medicines used solely for hyperglycaemia</span></li>'+
         '<li><b>NICE NG28 — Type 2 diabetes in adults: blood glucose management</b> [NICE recommendation]<br><a href="https://www.nice.org.uk/guidance/ng28/chapter/Blood-glucose-management" rel="noopener">nice.org.uk/guidance/ng28 — blood glucose management</a><span class="rd"> — self-monitoring, CGM and driving-related testing</span></li>'+
         '<li><b>GMMMG formulary — endocrine system</b> [local formulary]<br><a href="https://www.greatermanchesterformulary.nhs.uk/" rel="noopener">greatermanchesterformulary.nhs.uk</a><span class="rd"> — preferred basal products and criteria for high-strength and ultra-long insulins</span></li>'+
         '<li><b>NHS Greater Manchester — review of NICE NG28 updates for type 2 diabetes management</b> [local position]<br><a href="https://gmmmg.nhs.uk/" rel="noopener">gmmmg.nhs.uk</a><span class="rd"> — NG28 updates under local review; follow the current GMMMG formulary until the pathway is finalised</span></li>'+
         '<li><b>GMMMG — guidelines for safe prescribing of SGLT2 inhibitors in type 2 diabetes</b> [local protocol]<br><a href="https://gmmmg.nhs.uk/" rel="noopener">gmmmg.nhs.uk</a><span class="rd"> — local insulin adjustment table and SGLT2 sick-day framework</span></li>'+
         '<li><b>GMMMG insulin prescribing aid</b> [local protocol, not NICE guidance — check the current version, approval and review dates on gmmmg.nhs.uk]<span class="rd"> — the 10-unit starting dose, the 6–10 unit reduced start in frailty and renal impairment, the 2-units-every-3-days self-titration rule, the fasting-CBG titration percentages, and the 4-unit prandial starting dose with twice-weekly titration</span></li>'+
         '<li><b>BNF — insulin products and prescribing</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — the requirement to prescribe by brand with the full product name, to write \u201cunits\u201d in full, and the caution on high-strength (300 units/mL) and ultra-long insulins</span></li>'+
         '<li><b>Summary of Product Characteristics for each insulin product</b> [manufacturer product information]<br><a href="https://www.medicines.org.uk/emc" rel="noopener">medicines.org.uk/emc</a><span class="rd"> — product-specific dosing, devices and concentrations</span></li>'+
         '<li><b>NHS medicines-supply information</b><br><a href="https://www.sps.nhs.uk/" rel="noopener">sps.nhs.uk</a><span class="rd"> — Levemir discontinuation and supply status (time-sensitive; check before prescribing)</span></li>'+
         '<li><b>DVLA — Diabetes mellitus: assessing fitness to drive</b> [DVLA licensing advice]<br><a href="https://www.gov.uk/guidance/diabetes-mellitus-assessing-fitness-to-drive" rel="noopener">gov.uk/guidance/diabetes-mellitus-assessing-fitness-to-drive</a><span class="rd"> — temporary versus continuing insulin treatment, Group 1 and Group 2 requirements, testing before the first journey and every 2 hours, hypoglycaemia while driving, and impaired awareness</span></li>'+
         '<li><b>MHRA Drug Safety Update — SGLT2 inhibitors: updated advice on the risk of diabetic ketoacidosis</b> [MHRA safety advice]<br><a href="https://www.gov.uk/drug-safety-update/sglt2-inhibitors-updated-advice-on-the-risk-of-diabetic-ketoacidosis" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> — test ketones with DKA symptoms even when glucose is near normal</span></li>'+
         '<li><b>MHRA Drug Safety Update — SGLT2 inhibitors: monitor ketones in blood during treatment interruption for surgical procedures or acute serious medical illness</b> [MHRA safety advice]<br><a href="https://www.gov.uk/drug-safety-update/sglt2-inhibitors-monitor-ketones-in-blood-during-treatment-interruption-for-surgical-procedures-or-acute-serious-medical-illness" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> — interrupt treatment during major surgery or acute serious illness; blood ketones preferred</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Insulin in type 2 diabetes — NICE NG28, the GMMMG insulin aid and the BNF. Always prescribe by brand using the full product name, and write \"units\" in full. Offer basal insulin once or twice daily, choosing the product by shared decision and the current GMMMG formulary — human isophane is cost-effective for many; an analogue may be more suitable for nocturnal hypoglycaemia, carer administration or another individual reason. GMMMG local protocol: 10 units once daily (6–10 units in frailty, older age, advanced renal impairment or high hypoglycaemia risk), self-titrated by 2 units every 3 days against the fasting glucose pattern. If the fasting is at target but HbA1c is not, the problem is post-prandial — consider basal-plus, premixed insulin or a specialist-supported GLP-1/insulin combination rather than more basal. Keep metformin, usually keep the SGLT2 inhibitor (pause it when unwell), and stop or substantially reduce the sulfonylurea. Do not omit or stop insulin during illness without clinical advice. Driving: check the current DVLA rules — notification when insulin continues beyond 3 months, and Group 2 drivers stop Group 2 driving pending a DVLA decision. Verify all doses against the BNF before prescribing."
});
