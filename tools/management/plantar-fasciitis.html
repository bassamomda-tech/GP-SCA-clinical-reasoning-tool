<script>
MG.render({
  icon:"🦶",
  title:"Plantar heel pain (plantar fasciitis) — the complete guide",
  eyebrow:"Protocol · adults · plantar fasciopathy",
  stemTitle:"Typical plantar heel pain is usually plantar fasciopathy — a clinical diagnosis based on the overall pattern of history and examination. Educate, modify load, stretch and strengthen, and reconsider anything atypical, neurological, traumatic or systemic",
  stemSub:"For <b>suspected or clinically diagnosed plantar heel pain</b> in primary care. <b>This guide applies to adults with typical, non-traumatic plantar heel pain and no red flags. It does not cover acute traumatic heel pain, diabetic foot disease, inflammatory arthritis, infection, suspected fracture or tumour.</b> It is usually plantar fasciopathy — often degenerative and load-related rather than primarily inflammatory — diagnosed from medial calcaneal tenderness and pain on the first steps after rest. Start with education, load modification, plantar-fascia and calf stretching, progressive strengthening, supportive footwear and optional low-cost heel cushioning. <b>Symptoms often improve gradually over weeks to months, but the time course is variable. Improvement may be uneven, and persistent or recurrent symptoms are possible.</b> Review adherence and the diagnosis before referral, injection or specialist treatment.",
  guideline:"JOSPT/APTA heel pain CPG (2023) · NICE HTG200/IPG311 (shockwave therapy, 2009) · NICE HTG298 (injection procedures) · BNF and local formulary",
  reviewed:"25 September 2026",
  nextReview:"25 September 2027",
  meta:[
    {t:"Clinical diagnosis — imaging not routine", tone:"ok"},
    {t:"Adults · typical non-traumatic heel pain · no red flags"},
    {t:"Injection and ESWT: selective, not first-line", tone:"tw"},
    {t:"v2.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#diagnose"><b>Diagnose</b><small>Examine</small></a><a href="#exclude"><b>Exclude</b><small>Mimics · red flags</small></a><a href="#selfcare"><b>Self-care</b><small>Load + stretch</small></a><a href="#escalate"><b>Escalate</b><small>If persistent</small></a><a href="#refer"><b>Refer</b><small>Image · MSK</small></a></div>',
  quickSub:"The five that matter. Key sources are cited under <a href=\"#provenance\">Evidence</a>; red flags, imaging and review timings reflect standard MSK safety-netting practice.",
  quick:[
    {tone:"blue", h:"A clinical diagnosis", html:"Medial calcaneal tubercle tenderness, pain with the <b>first steps after rest</b>, pain reproduced by loading the fascia or by passive toe dorsiflexion, and a normal neurovascular examination. None of these findings is individually diagnostic — it is a clinical diagnosis based on the overall pattern of history and examination. <b>Imaging is not routine for a typical presentation.</b> Consider alternatives when pain is atypical, severe, neurological, traumatic or systemic."},
    {tone:"green", h:"First-line: education, load and stretching", html:"Provide a progressive, tolerable programme of plantar-fascia/calf stretching and resistance exercise for the calf and foot muscles, with load modification. Progress it according to symptoms, strength and functional goals rather than stopping because of any pain; no one exercise programme is definitively superior. Keep up tolerable activity rather than resting completely, and avoid sudden jumps in running or standing load."},
    {tone:"blue", h:"Cushioning helps comfort — orthoses alongside exercise", html:"A prefabricated heel cup or insole may provide short-term comfort. Consider an orthosis where there is a relevant foot-posture, loading or footwear issue, usually alongside exercise and education. Custom orthoses are not routinely required at first presentation but may be considered after assessment if prefabricated devices are ineffective or unsuitable."},
    {tone:"amber", h:"Injection and shockwave are not first-line", html:"Corticosteroid injection may provide short-term pain relief, but benefit may not persist and complications include infection, skin depigmentation or atrophy, fat-pad atrophy and possible plantar-fascia rupture. It should not be routine first-line treatment or repeated regularly. <b>Shockwave therapy (ESWT)</b> only under NICE HTG200/IPG311 special arrangements for clinical governance, informed consent and audit: no major safety concerns, but efficacy is inconsistent. Delivery should be through a service with appropriate competence, governance, consent and outcome audit, according to the local commissioned pathway."},
    {tone:"red", h:"⚠ Red flags — reconsider the diagnosis", html:"<b>Immediate/emergency:</b> inability to weight-bear after trauma · suspected fracture or acute tendon rupture · neurovascular compromise · hot, swollen foot with systemic illness · severe or diabetic foot infection · rapidly progressive swelling or severe unexplained pain. <b>Prompt assessment/imaging:</b> focal calcaneal squeeze tenderness · progressive or constant pain · persistent night/rest pain · known malignancy · unexplained weight loss · unexplained mass. <b>Context:</b> diabetes, neuropathy or ulceration · bilateral heel pain · psoriasis, uveitis, IBD or inflammatory back pain."}
  ],
  pathwaySub:"Five steps. Most people only need the first three.",
  pathway:[
    {title:"Examine properly", html:"Gait and weight-bearing · exact site of tenderness · passive toe dorsiflexion · calf and Achilles flexibility · ankle and subtalar range · foot posture and footwear · neurovascular examination · lumbar and neurological examination where indicated · swelling, warmth or a mass · if Achilles rupture is possible: calf squeeze test, active plantar flexion, Achilles palpation, bruising or a palpable defect.", alert:true},
    {title:"Exclude the mimics and red flags", html:"Stress fracture, fat-pad syndrome, Achilles or plantar-fascia rupture, tendon pathology, nerve entrapment, radiculopathy, enthesitis, infection, gout, tumour. Diabetes with ulcer, infection, neuropathy or ischaemia → diabetic foot pathway, not routine plantar fasciopathy."},
    {title:"Educate, modify load, stretch and strengthen", html:"Progressive, tolerable stretching and strengthening; supportive footwear; optional low-cost heel cushioning; work and standing advice; analgesia is adjunctive, only if appropriate."},
    {title:"Persistent? Review adherence and the diagnosis", html:"Persistent symptoms at 6–12 weeks prompt reassessment of the diagnosis, adherence, footwear, loading and exercise delivery — not automatic injection or imaging. Then physiotherapy, podiatry or MSK, a night splint for persistent first-step pain, and only then selective injection or specialist options."},
    {title:"Image or refer when it does not fit", html:"Suspected stress fracture, neurological or vascular findings, inflammatory features, infection or malignancy concern — at any stage."}
  ],
  sections:[

    {id:"diagnose", nav:"Diagnose", title:"Step 1 — diagnose clinically",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>Terminology</b>","Plantar heel pain is usually plantar fasciopathy. Chronic cases are often degenerative and load-related rather than primarily inflammatory; \"plantar fasciitis\" remains the commonly used clinical term and is retained for coding, patient searches and referral pathways"],
         ["<b>Scope</b>","Adults with typical, non-traumatic plantar heel pain and no red flags. Not for acute traumatic heel pain, diabetic foot disease, inflammatory arthritis, infection, suspected fracture or tumour"],
         ["<b>Typical history</b>","Gradual medial plantar heel pain, worst on the first steps after rest, easing with activity then worsening with prolonged standing"],
         ["<b>Typical findings</b>","Medial calcaneal tubercle tenderness · pain reproduced by fascia loading or passive toe dorsiflexion · generally normal neurovascular examination. None is individually diagnostic"],
         ["<b>Examine</b>","Gait and weight-bearing · exact site of tenderness · calf and Achilles flexibility · ankle and subtalar range · foot posture and footwear · neurovascular examination · swelling, warmth or mass · lumbar and neurological examination where indicated, including Tinel's sign at the tarsal tunnel, sensation, reflexes and power · if Achilles or plantar-fascia rupture is possible (sudden onset during sport or forceful push-off): calf squeeze test, active plantar flexion, palpation of the Achilles tendon, bruising, swelling or a palpable defect"],
         ["<b>Fat-pad syndrome</b>","Central heel-pad tenderness rather than medial calcaneal tubercle tenderness · worse with prolonged standing or hard surfaces · often associated with fat-pad atrophy, age or repetitive impact"],
         ["<b>Risk factors</b>","Increased or changed loading (running, standing work), higher body weight, tight calf or Achilles, foot posture, unsupportive footwear"]
       ]},
       {b:"why", html:"The diagnosis rests on the overall pattern of history and examination — no single finding is diagnostic. Acute plantar heel pain after injury may be mislabelled as plantar fasciopathy, so check for Achilles and plantar-fascia rupture. Tarsal tunnel syndrome and S1 radiculopathy are assessed by examination — Tinel's sign, sensation, reflexes and power — not by symptoms alone."}
     ]},

    {id:"exclude", nav:"Exclude", title:"Step 2 — mimics and red flags",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"🟠 Other local causes", html:"Calcaneal stress fracture · calcaneal fat-pad syndrome (central heel-pad tenderness, worse standing on hard surfaces) · Achilles rupture or plantar-fascia rupture (sudden onset, bruising, palpable defect) · Achilles insertional tendinopathy · posterior tibial or peroneal tendon pathology · gout or other crystal disease."},
         {tone:"amber", h:"🟠 Nerve causes", html:"Tarsal tunnel syndrome · S1 radiculopathy · neuropathic pain · referred lumbar pain. Burning, tingling or numbness → examine the nerves and the back."},
         {tone:"amber", h:"🟠 Inflammatory enthesitis", html:"Bilateral heel pain alone does not diagnose spondyloarthritis. Look for inflammatory back pain, prolonged morning stiffness, alternating buttock pain, psoriasis, uveitis, inflammatory bowel disease or a family history."},
         {tone:"red", h:"🔴 Red flags — by urgency", html:"<b>Immediate/emergency assessment:</b> inability to weight-bear after trauma · suspected fracture or acute tendon rupture · neurovascular compromise · a hot, swollen foot with systemic illness · severe infection or diabetic foot infection · rapidly progressive swelling or severe unexplained pain. <b>Prompt assessment/imaging:</b> focal calcaneal squeeze tenderness · progressive or constant pain · persistent night/rest pain · known malignancy · unexplained weight loss · unexplained mass. <b>Relevant context:</b> diabetes, neuropathy or ulceration · bilateral heel pain · psoriasis, uveitis, inflammatory bowel disease or inflammatory back pain. Night pain alone is not diagnostic of malignancy and can occur with mechanical conditions — it should prompt reconsideration of the diagnosis."},
         {tone:"red", h:"🔴 Diabetes", html:"A person with diabetes and an ulcer, infection, neuropathy or ischaemia should not be managed as routine plantar fasciopathy — follow the diabetic foot pathway (<a href='https://www.nice.org.uk/guidance/ng19' rel='noopener'>NICE NG19</a>) and local diabetic foot service."},
         {tone:"amber", h:"🟠 Lower threshold for specialist advice", html:"Diabetes, neuropathy or previous ulceration · peripheral arterial disease · immunosuppression · inflammatory arthritis or suspected spondyloarthritis · anticoagulation or bleeding disorder if injection is being considered · previous plantar-fascia injection · suspected stress fracture or high-impact sport · recurrent or bilateral symptoms with systemic features."}
       ]}
     ]},

    {id:"selfcare", nav:"Self-care", title:"Step 3 — self-care and load management",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"🧘 Stretch and strengthen", html:"A progressive, tolerable programme of plantar-fascia/calf stretching and resistance exercise for the calf and foot muscles, progressed according to symptoms, strength and functional goals rather than stopped because of any pain. No one exercise programme is definitively superior."},
         {tone:"green", h:"🚶 Modify load, stay active", html:"Keep tolerable activity rather than resting completely. Avoid sudden increases in running or standing load; build back gradually."},
         {tone:"green", h:"💼 Work and standing", html:"Temporary reduction in prolonged standing · alternate sitting and standing · supportive footwear at work · avoid barefoot walking on hard surfaces · gradual return to normal standing or running load · consider an occupational-health or workplace adjustment referral if required."},
         {tone:"green", h:"👟 Footwear and cushioning", html:"Supportive footwear is preferable; arch support is not needed for everyone. Avoid prolonged barefoot walking on hard surfaces if it aggravates. An inexpensive heel cup or insole can help comfort short term."},
         {tone:"blue", h:"🧊 Symptom relief only", html:"Ice, massage or rolling a frozen bottle can ease pain — symptom relief, not disease-modifying treatment, and not a replacement for strengthening and load management. Avoid direct prolonged ice exposure, particularly if sensation or circulation is impaired (neuropathy, diabetes, poor circulation)."},
         {tone:"blue", h:"⚖️ Weight", html:"Weight management can be discussed sensitively, but it is not an immediate treatment requirement."},
         {tone:"cream", h:"📄 Patient information", html:"Cover the expected (variable, gradual) course · exercise instructions or a trusted link such as <a href='https://www.nhs.uk/conditions/plantar-fasciitis/' rel='noopener'>NHS — plantar fasciitis</a> · how to modify running and standing load · footwear guidance · safety-net symptoms · how and when to seek review."}
       ]}
     ]},

    {id:"escalate", nav:"Escalate", title:"Step 4 — analgesia and escalation",
     blocks:[
       {b:"table", head:["Option","When","Safeguards"], rows:[
         ["<b>Analgesia (adjunctive only)</b>","Consider a short course of a topical or oral NSAID only if pain is limiting activity and there are no contraindications. Paracetamol may be tried, but evidence for meaningful benefit is limited and it is not a core treatment","Rehabilitation, not analgesic escalation, is the main treatment. Lowest effective dose for the shortest duration; do not combine NSAIDs; follow the current local formulary for doses and gastroprotection. Particular caution with CKD or dehydration, heart failure or significant cardiovascular disease, previous ulcer or GI bleeding, anticoagulants, antiplatelets or corticosteroids, NSAID-sensitive asthma, and older or frail patients. Evidence for topical NSAIDs in deep plantar heel pain is limited; consider a short trial if appropriate and monitor benefit"],
         ["<b>Physiotherapy or podiatry</b>","Failure to progress despite a properly delivered programme, restricted function, or a structured programme needed","Stretching, progressive calf and intrinsic strengthening, graded return to impact, gait and load assessment, taping, footwear and orthosis advice"],
         ["<b>Night splint</b>","Persistent first-step morning pain after an adequate trial of stretching and load modification","Particularly where symptoms remain prominent on waking. Discuss adherence, comfort, skin pressure and sleep disturbance. Not routine at first presentation. Do not prescribe if there is significant neuropathy, impaired skin integrity or pressure risk without suitable assessment"],
         ["<b>Corticosteroid injection</b>","Persistent symptoms despite an appropriate rehabilitation programme, after diagnostic review","Not routine first-line treatment; only after diagnostic review and a properly delivered conservative programme. May provide short-term pain relief, but benefit may not persist. Discuss infection, skin depigmentation or atrophy, fat-pad atrophy, possible plantar-fascia rupture, bruising, neurovascular injury and transient hyperglycaemia in diabetes. Experienced clinician; avoid direct intrafascial injection; do not inject through infected or ulcerated skin; do not repeat regularly; document the number and dates of previous injections. Consider image guidance where anatomy is uncertain, a previous injection failed or the diagnosis is uncertain — ultrasound may improve needle placement, but better clinical outcomes than palpation guidance are not established for all cases"],
         ["<b>Extracorporeal shockwave therapy (ESWT)</b>","Refractory plantar heel pain, through a service with appropriate competence, governance, consent and outcome audit, according to the local commissioned pathway","<b>Not routine primary-care treatment.</b> NICE HTG200/IPG311 (2009, unchanged) allows it only with special arrangements for clinical governance, informed consent and audit or research: no major safety concerns, but efficacy is inconsistent (uncertain, not shown to be ineffective); it can cause pain, bruising or local skin damage"]
       ]},
       {b:"warn", html:"A time point alone should not trigger an injection or imaging. Persistent symptoms at 6–12 weeks should prompt reassessment of the diagnosis, adherence, footwear, loading and exercise delivery — not automatic injection or imaging. Injection does not replace stretching, strengthening and load management."},
       {b:"dl", rows:[
         ["<b>Baseline outcome measures (persistent cases)</b>","Pain on first steps (0–10) · pain after prolonged standing or walking · walking tolerance · work or sport limitation · a patient-specific functional goal — to judge whether treatment is working rather than relying on tenderness alone"]
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Step 5 — imaging and referral",
     blocks:[
       {b:"table", head:["Situation","Action"], rows:[
         ["<b>Typical plantar heel pain, otherwise normal examination</b>","No imaging"],
         ["<b>Significant trauma, inability to weight-bear or focal bony tenderness</b>","Plain radiograph; urgent assessment if clinically indicated"],
         ["<b>Persistent focal calcaneal pain with concern for stress fracture despite a normal radiograph</b>","MRI or specialist assessment — <b>a normal early X-ray does not reliably exclude a stress fracture</b>"],
         ["<b>Suspicion of infection, tumour or inflammatory disease</b>","Urgent/specialist assessment and targeted imaging"],
         ["<b>Diagnostic uncertainty or planned image-guided procedure</b>","Consider ultrasound (soft-tissue diagnosis uncertain or to guide a procedure) or MRI depending on the suspected pathology"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"Urgent — at any stage", html:"Inability to weight-bear after trauma · suspected fracture or acute tendon rupture · hot, swollen foot with systemic illness · infection, ulceration or diabetic foot infection · malignancy concern · neurovascular compromise · rapidly progressive swelling or severe unexplained pain. Escalate sooner if the diagnosis is atypical or the patient cannot work or weight-bear."},
         {tone:"blue", h:"Physiotherapy, podiatry or MSK", html:"Persistent symptoms despite a properly delivered self-management programme · significant occupational or sporting limitation · need for orthoses, a night splint or gait assessment · recurrent symptoms · failure to progress. A practical local schedule, not a guideline requirement: initial review at 4–8 weeks if symptoms are functionally limiting or adherence is uncertain; earlier review for severe symptoms, significant occupational limitation or diagnostic uncertainty. Duration alone is not an automatic trigger for imaging or injection."},
         {tone:"blue", h:"Rheumatology", html:"Heel pain with convincing inflammatory features, via the local inflammatory arthritis pathway — not simply because it is bilateral or the patient is young."},
         {tone:"cream", h:"GP management", html:"The examination, the exclusions, self-care, safe analgesia and the review points all belong here. Related pages: <a href='../algorithms/foot-pain.html'>foot pain pathway</a> · <a href='achilles-tendinopathy.html'>Achilles tendinopathy</a> · <a href='ankylosing-spondylitis.html'>axial spondyloarthritis</a>."}
       ]},
       {b:"say", html:"This is plantar heel pain — usually strain of the tough tissue under the heel from how the foot is loaded. It usually improves gradually over weeks to months, though the time course varies and it can come and go. What helps most is daily calf and foot stretches, building up strength, supportive shoes, and easing off the activities that flare it rather than stopping altogether. A cheap heel cushion can make it more comfortable. Come back if you can't put weight on it, if it becomes red, hot or swollen, if you get numbness or tingling, if it hurts at rest or at night, or if it is not improving or is stopping you working."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 47-year-old retail worker has <b>right heel pain for eight weeks</b>, worst on her first steps each morning. She has recently started standing for longer shifts. She is tender over the <b>medial calcaneal tubercle</b>; calcaneal squeeze is painless and neurovascular examination is normal. She asks for an X-ray and a steroid injection."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Makes the clinical diagnosis and explains why imaging is not needed now; checks for red flags, nerve causes and inflammatory features; explains load modification, stretching and strengthening, footwear and a low-cost heel cushion; is honest about the variable, gradual course; gives work and standing advice; discusses injection — short-term, risks, not first-line — and when it might be considered; checks safety before any NSAID; and sets review and safety-net points."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Key recommendations are linked to named sources below; red flags, imaging, differential diagnosis and review intervals are clinical safety-netting based on standard MSK practice.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>Academy of Orthopaedic Physical Therapy / AASPT (APTA) — Heel Pain – Plantar Fasciitis: Revision 2023, clinical practice guideline</b><br><a href="https://www.jospt.org/doi/10.2519/jospt.2023.0303" rel="noopener">jospt.org/doi/10.2519/jospt.2023.0303</a><span class="rd"> — stretching, strengthening, taping, orthoses alongside other treatment, night splints for persistent first-step pain</span></li>'+
         '<li><b>NICE HTG200/IPG311 — Extracorporeal shockwave therapy for refractory plantar fasciitis (2009, unchanged)</b><br><a href="https://www.nice.org.uk/guidance/htg200" rel="noopener">nice.org.uk/guidance/htg200</a><span class="rd"> — no major safety concerns but efficacy inconsistent (uncertain, not shown to be ineffective); ESWT only with special arrangements for clinical governance, informed consent and audit or research</span></li>'+
         '<li><b>NICE HTG298 — injection procedures for plantar fasciitis (autologous blood injection)</b><br><a href="https://www.nice.org.uk/guidance/htg298" rel="noopener">nice.org.uk/guidance/htg298</a><span class="rd"> — injection procedures generally considered only for refractory symptoms; rupture, infection, bruising and neurovascular injury are recognised complications</span></li>'+
         '<li><b>BNF and the current local formulary</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — NSAID cautions and gastroprotection; check the current local formulary for analgesic choice and doses (no doses are given on this page)</span></li>'+
         '<li><b>NICE NG19 — Diabetic foot problems: prevention and management</b><br><a href="https://www.nice.org.uk/guidance/ng19" rel="noopener">nice.org.uk/guidance/ng19</a><span class="rd"> — the pathway for diabetes with ulcer, infection, neuropathy or ischaemia</span></li>'+
         '<li><b>Red flags, imaging and differential diagnosis</b><span class="rd"> — clinical safety-netting based on standard MSK practice; the APTA guideline is primarily a rehabilitation guideline and does not cover all of these statements</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Plantar heel pain (plantar fasciitis) in adults. Usually plantar fasciopathy, diagnosed clinically from medial calcaneal tenderness and first-step pain; imaging is not routine. Treat with education, load modification, plantar-fascia and calf stretching, progressive strengthening, supportive footwear and optional low-cost heel cushioning; analgesia only when appropriate. Reconsider atypical, constant, neurological, systemic or traumatic pain, or inability to weight-bear. Review adherence and diagnosis before referral, injection or specialist treatment. ESWT only under NICE HTG200/IPG311 special arrangements for governance, consent and audit (efficacy inconsistent). Symptoms often improve gradually over weeks to months, but the course is variable. Scope: adults with typical, non-traumatic plantar heel pain and no red flags. Sources: JOSPT/APTA 2023, NICE HTG200/IPG311, NICE HTG298, BNF and local formulary."
});
</script>
