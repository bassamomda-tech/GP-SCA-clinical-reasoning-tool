<script>
MG.render({
  icon:"😐",
  title:"Bell's palsy — the complete guide",
  eyebrow:"Protocol · adults · acute lower motor neurone facial palsy",
  stemTitle:"Confirm a lower motor neurone pattern, look actively for a central or secondary cause, start prednisolone within 72 hours, and protect the eye",
  stemSub:"One page for acute facial palsy in <b>adults</b> (children need a separate pathway). Bell's palsy is an acute, usually unilateral, lower motor neurone facial palsy <b>with no identified alternative cause</b>; it develops over hours and may progress for up to 72 hours. The forehead finding is an important clue but not a complete test, so a full cranial and neurological examination comes first. Then do the three things that matter: <b>prednisolone as early as possible within 72 hours</b>, <b>eye protection for anyone who cannot fully close the eye</b>, and recognition of <b>Ramsay Hunt syndrome</b>.",
  guideline:"NICE NG127 · Cochrane antivirals review (2019) · local formulary · House-Brackmann",
  reviewed:"24 September 2026",
  nextReview:"24 September 2027",
  meta:[
    {t:"Forehead sparing suggests a central lesion", tone:"tw"},
    {t:"Prednisolone within 72 hours of onset", tone:"tw"},
    {t:"v3.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#confirm"><b>Confirm</b><small>Pattern + mimics</small></a><a href="#eye"><b>The eye</b><small>Protect it</small></a><a href="#steroid"><b>Steroid</b><small>Within 72 h</small></a><a href="#monitor"><b>Recovery</b><small>Review points</small></a><a href="#refer"><b>Refer</b><small>Stroke · eye · ENT</small></a></div>',
  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Forehead sparing suggests a central lesion — not a complete test", html:"Bell's palsy weakens the whole side, including the forehead and eye closure. <b>Forehead sparing suggests a central facial weakness</b>: if acute, and especially with arm or leg weakness, speech disturbance, visual symptoms, ataxia or sensory loss, use the emergency stroke pathway. The sign does not work in reverse — a brainstem lesion can cause a complete palsy that involves the forehead — so never use it alone to exclude stroke. Examine all cranial nerves, limbs, speech and coordination."},
    {tone:"red", h:"Prednisolone, started within 72 hours", html:"Offer oral prednisolone as soon as possible, ideally within 72 hours of onset. <b>Use your local formulary regimen</b>; a commonly used one is <b>60 mg once daily for 5 days, then reducing by 10 mg a day over 5 days</b> (some formularies use 50 mg daily for 10 days). Check diabetes, active infection, previous steroid psychosis, significant hypertension, pregnancy and immunosuppression. Do not delay for routine tests."},
    {tone:"red", h:"⚠ Protect the eye — the avoidable harm", html:"If eye closure is incomplete: <b>preservative-free lubricating drops regularly by day, lubricating ointment at night</b>, and protect the eye during sleep with gentle lid taping or a moisture chamber. <b>Do not use an ordinary eye pad</b>, which can abrade the cornea. Stop contact lenses; wraparound sunglasses outdoors; avoid wind, dust and long screen use."},
    {tone:"amber", h:"Ramsay Hunt — vesicles may be absent", html:"Suspect it with facial palsy plus <b>severe ear pain, vesicles in or around the ear, mouth or tongue, hearing loss, tinnitus or vertigo</b>. Vesicles can be absent (zoster sine herpete). Seek same-day specialist advice: treatment usually combines an antiviral with a corticosteroid, at the dose and duration in your local shingles or Ramsay Hunt pathway."},
    {tone:"blue", h:"Antivirals are not routine in Bell's palsy", html:"<b>Do not prescribe an antiviral routinely</b> for straightforward Bell's palsy, and never alone. Consider one only on specialist or local-pathway advice in severe or complete paralysis, ideally started within 72 hours. Check renal function, frailty, hydration, interactions, pregnancy and breastfeeding against the product information."},
    {tone:"green", h:"Most recover — and review points are set", html:"Most people improve over weeks, and maximum recovery can take several months. Review at about <b>3 weeks</b> if there is no improvement (a local safety-netting point, not a NICE requirement), refer at about <b>3 months</b> for incomplete recovery, and consider neurology from about <b>5 months</b> for synkinesis, gustatory sweating or jaw-winking (NICE NG127)."}
  ],
  pathwaySub:"Five steps. The examination comes first, and the prescription must not wait for tests.",
  pathway:[
    {title:"Establish onset and do a full examination", html:"Exact onset and progression · forehead movement, eye closure, smile, cheek puff and lip seal · otoscopy, pinna, mouth and tongue · all cranial nerves · limb power, sensation, coordination and speech · parotid region and neck nodes.", alert:true},
    {title:"Central signs → emergency stroke pathway", html:"Any acute focal neurological sign beyond the face goes to the stroke pathway, whatever the forehead shows."},
    {title:"Typical Bell's within 72 hours → prednisolone now", html:"Local formulary regimen, commonly 60 mg daily for 5 days then a 5-day reduction. No routine blood tests or imaging."},
    {title:"Protect the eye immediately if closure is incomplete", html:"Preservative-free drops by day, ointment at night, lid taping or moisture chamber in sleep. No ordinary eye pad."},
    {title:"Review at 3 weeks if not improving; refer at 3 months if incomplete", html:"And from about 5 months for synkinesis or aberrant reinnervation. Earlier assessment for anything atypical."}
  ],
  sections:[

    {id:"confirm", nav:"Confirm", title:"Step 1 — confirm the pattern and look for another cause",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>Bell's palsy</b>","Acute, usually unilateral, lower motor neurone facial palsy with no identified alternative cause. Develops over hours; may progress for up to 72 hours"],
         ["<b>Central lesion</b>","Forehead sparing suggests a central cause — stroke, intracranial mass, demyelination. Any other acute focal neurological sign → emergency stroke pathway. A brainstem lesion can still involve the forehead"],
         ["<b>Atypical — reconsider</b>","Progression beyond 72 hours · recurrent or bilateral palsy · severe or persistent ear pain · hearing loss, vertigo or otorrhoea · fever or systemic illness · parotid or neck mass · other cranial-nerve or neurological signs · trauma or ear surgery · tick exposure or travel (Lyme)"],
         ["<b>Differential</b>","Stroke (including brainstem) · multiple sclerosis · Guillain–Barré · Ramsay Hunt · otitis media, cholesteatoma or temporal-bone disease · parotid malignancy · sarcoidosis · HIV · lymphoma or leukaemia · Lyme disease"],
         ["<b>Investigations</b>","None routinely for a typical, uncomplicated case. Investigate or refer if the diagnosis is uncertain, onset is gradual, the palsy is recurrent or bilateral, or there are other neurological, ear, parotid or skull-base concerns. MRI is selective, not routine"]
       ]},
       {b:"why", html:"<b>The forehead finding is a discriminator, not a diagnosis.</b> Forehead sparing points centrally because the upper face has bilateral cortical supply — but a brainstem lesion can cause a complete ipsilateral palsy, so a normal-looking forehead pattern never replaces the rest of the neurological examination. Bell's is a diagnosis of exclusion: a typical story and a normal examination apart from the face."}
     ]},

    {id:"eye", nav:"The eye", title:"Step 2 — protect the eye",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"👁️ Lubricate", html:"Preservative-free lubricating drops regularly through the day; lubricating ointment at night. Increase the frequency if exposure is marked."},
         {tone:"red", h:"😴 Protect during sleep", html:"Gentle eyelid taping or a moisture chamber. <b>Do not use an ordinary eye pad</b> — pressure or movement against the cornea can cause abrasion."},
         {tone:"amber", h:"🕶️ Everyday protection", html:"Stop contact lenses · wraparound sunglasses outdoors · avoid wind, dust and prolonged screen use."},
         {tone:"red", h:"🚨 Same-day ophthalmology", html:"Eye pain, photophobia, foreign-body sensation, increasing redness or reduced vision — suspected exposure keratopathy or corneal ulcer."},
         {tone:"blue", h:"🍽️ Eating and mouth care", html:"Food pools on the weak side — advice on chewing and oral hygiene."},
         {tone:"green", h:"🫶 Reassure", html:"Most people recover well; explain that recovery may take weeks to months."}
       ]}
     ]},

    {id:"steroid", nav:"Steroid", title:"Step 3 — early corticosteroid; antivirals only selectively",
     blocks:[
       {b:"table", head:["Step","Treatment","Notes"], rows:[
         ["<b>Prednisolone</b>","Local formulary regimen. Commonly 60 mg once daily for 5 days, then reduce by 10 mg a day over 5 days (some formularies: 50 mg daily for 10 days). With food","Ideally within 72 hours. Cautions: diabetes (hyperglycaemia), active infection, previous steroid psychosis, significant hypertension, pregnancy, immunosuppression. Gastroprotection by individual GI risk, not routinely"],
         ["<b>Antiviral — not routine</b>","Never alone. Consider only on specialist or local-pathway advice in severe or complete paralysis, ideally within 72 hours","Check renal function, frailty, hydration, interactions, pregnancy and breastfeeding against the product information"],
         ["<b>Ramsay Hunt</b>","Antiviral plus corticosteroid, dose and duration per local shingles/Ramsay Hunt pathway","Same-day specialist advice; urgent if marked vestibular or hearing symptoms"],
         ["<b>Eye protection</b>","For everyone who cannot fully close the eye","Do not omit"]
       ]},
       {b:"warn", html:"<b>Do not delay steroids</b> for investigations or a review appointment. <b>Do not start unsupervised facial strengthening exercises or electrical stimulation in the acute phase</b> — uncoordinated exercise may worsen synkinesis; specialist facial therapy is used for persistent weakness."}
     ]},

    {id:"monitor", nav:"Recovery", title:"Step 4 — review points and safety-netting",
     blocks:[
       {b:"table", head:["When","What","Action"], rows:[
         ["<b>At diagnosis</b>","Pattern, eye, ear, neuro","Prednisolone, eye protection, safety-net"],
         ["<b>About 3 weeks</b>","No improvement","Reassess the diagnosis; consider ENT, neurology or a facial-palsy service (local safety-netting point)"],
         ["<b>About 3 months</b>","Incomplete recovery","ENT, neurology or specialist facial-palsy service"],
         ["<b>From about 5 months</b>","Synkinesis, gustatory sweating, jaw-winking","Consider neurological or facial-palsy assessment (NICE NG127)"],
         ["<b>Any time</b>","Gradual, recurrent, bilateral or atypical","Earlier specialist assessment"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 Stroke", html:"\"If the weakness spreads, or you develop arm or leg weakness, speech problems, visual loss or unsteadiness — call 999.\""},
         {tone:"red", h:"👁️ Eye danger", html:"\"Eye pain, light sensitivity, increasing redness or any change in vision — same-day eye assessment.\""},
         {tone:"amber", h:"🟠 Ramsay Hunt", html:"\"Severe ear pain, blisters in the ear or mouth, hearing loss, ringing or dizziness — contact us the same day.\""},
         {tone:"green", h:"🫶 Recovery", html:"\"Most people recover well, though it can take months. Tell us if there is no improvement after about three weeks.\""}
       ]}
     ]},

    {id:"troubleshoot", nav:"Not recovering?", title:"Not improving by 3 weeks? Re-check before referring",
     sub:"Reconsider the diagnosis and the treatment timing.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"1 · Is the diagnosis right?", html:"Central signs, ear or parotid findings, hearing loss, progression beyond 72 hours, or bilateral palsy → reconsider."},
         {tone:"amber", h:"2 · Steroid timing", html:"<b>Were steroids started within 72 hours?</b>"},
         {tone:"red", h:"3 · The eye", html:"<b>Has the cornea been protected throughout? Any exposure damage?</b>"},
         {tone:"blue", h:"4 · Another cause", html:"Lyme disease, tumour, multiple sclerosis, sarcoidosis, HIV or lymphoma in atypical or non-resolving cases."},
         {tone:"blue", h:"5 · Refer", html:"<b>Local ENT, neurology or facial-palsy pathway.</b>"}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"When to refer",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Emergency — 999", html:"Suspected stroke or any acute neurological deficit beyond the face → stroke pathway. See <a href='tia-stroke.html'>stroke and TIA</a>."},
         {tone:"red", h:"Same day", html:"Eye pain, photophobia, visual loss or suspected corneal ulcer · Ramsay Hunt · palsy with severe otitis, mastoid signs or systemic illness · rapidly progressive or bilateral palsy · significant trauma."},
         {tone:"blue", h:"ENT, neurology or facial-palsy service", html:"No improvement at about 3 weeks · incomplete recovery at about 3 months · synkinesis or aberrant reinnervation from about 5 months · gradual, recurrent or atypical palsy."},
         {tone:"cream", h:"GP management", html:"The examination, early prednisolone, eye protection, Ramsay Hunt recognition and the review points all belong here. Related pages: <a href='tia-stroke.html'>stroke and TIA</a> · <a href='shingles.html'>shingles</a> · <a href='lyme-disease.html'>Lyme disease</a>."}
       ]},
       {b:"say", html:"This is a weakness of the facial nerve, and most people recover well — a steroid tablet started early helps, which is why I'd like you to start it today. It can take weeks or sometimes months to recover fully. The most important thing meanwhile is protecting the eye, because it cannot close properly: drops by day, ointment at night and taping it gently shut when you sleep. If the eye becomes painful or red, or your vision changes, that needs same-day attention."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 41-year-old man attends having woken <b>yesterday</b> unable to move the right side of his face. He is frightened he has had a stroke. On examination the <b>right forehead does not wrinkle</b> and he <b>cannot close the right eye</b>; limbs, speech and the other cranial nerves are normal. He mentions <b>an ache deep in the right ear</b> for two days beforehand. He works outdoors as a groundsman."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Does a full cranial and neurological examination rather than relying on the forehead alone, and explains why the findings are reassuring; examines the ear canal, pinna and mouth for vesicles and asks about hearing and vertigo given the ear ache; starts prednisolone the same day within the 72-hour window; arranges eye protection — preservative-free drops, night ointment and lid taping, no eye pad — relevant to outdoor work; gives the stroke, eye and Ramsay Hunt safety-net; and sets the 3-week and 3-month review points."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG127 — Suspected neurological conditions: recognition and referral</b><br><a href="https://www.nice.org.uk/guidance/ng127" rel="noopener">nice.org.uk/guidance/ng127</a><span class="rd"> — no routine referral for typical Bell\'s palsy, eye-care advice, and referral for aberrant reinnervation from about 5 months</span></li>'+
         '<li><b>Cochrane review — antiviral treatment for Bell\'s palsy (Gagyor, 2019)</b><span class="rd"> — antivirals add little to corticosteroids and are not used alone</span></li>'+
         '<li><b>Local formulary and product information (SPC)</b><span class="rd"> — prednisolone and antiviral regimens, cautions and dose adjustment</span></li>'+
         '<li><b>House-Brackmann facial nerve grading scale</b><span class="rd"> — severity grading</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Bell's palsy in adults. Examine fully: forehead sparing suggests a central lesion, but any acute neurological deficit goes to the stroke pathway whatever the forehead shows. Start prednisolone within 72 hours using the local formulary regimen. Protect the eye with preservative-free drops, night ointment and lid taping or a moisture chamber — no eye pad. Suspect Ramsay Hunt with ear pain, vesicles, hearing loss or vertigo, even without vesicles. Review at about 3 weeks if not improving, refer at about 3 months if incomplete. Sources: NICE NG127, Cochrane (2019), local formulary and SPC."
});
