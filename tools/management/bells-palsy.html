  stemSub:"One page for acute idiopathic facial palsy. Bell's palsy is lower motor neurone, so the whole side including the forehead is weak; a stroke is upper motor neurone and SPARES the forehead. Get that right, then do the three things that matter: <b>prednisolone as early as possible within 72 hours</b>, <b>eye protection for anyone who cannot fully close the eye</b> — because exposure keratopathy is the avoidable harm here — and recognition of <b>Ramsay Hunt</b>, which needs an antiviral. Reassess anyone not improving by three weeks.",

  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Forehead SPARED means stroke, not Bell's palsy", html:"Bell's palsy is lower motor neurone: the whole side is weak, INCLUDING the forehead — the patient cannot wrinkle the brow or close the eye. If the forehead still wrinkles, the lesion is upper motor neurone and the patient goes down the stroke pathway. <b>This single sign is the most important thing on the page</b>, and missing a central cause is the key pitfall."},
    {tone:"red", h:"Prednisolone, started within 72 hours", html:"Oral prednisolone markedly improves the likelihood of complete recovery, and the benefit is greatest when started early. Prednisolone 50 mg once daily for 10 days, or 60 mg once daily for 5 days then reducing by 10 mg a day. Take with food. <b>Do not delay while arranging investigations.</b>"},

     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 41-year-old man attends having woken <b>yesterday</b> unable to move the right side of his face. He is frightened he has had a stroke. On examination the <b>right forehead does not wrinkle</b> and he <b>cannot close the right eye</b>; limbs and speech are normal. He mentions <b>an ache deep in the right ear</b> for two days beforehand. He works outdoors as a groundsman and asks whether he needs time off."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Elicits and names the forehead finding — it does NOT wrinkle, so this is lower motor neurone and not a stroke — and explains that distinction to the patient, which is the reassurance he came for; examines the ear and canal for vesicles given the preceding ear pain, because Ramsay Hunt changes treatment to include aciclovir; starts prednisolone the same day, recognising he is within the 72-hour window, and does not defer to a review appointment; arranges full eye protection — drops by day, ointment and taping at night — and explains exposure keratopathy, which matters especially given outdoor work in wind and dust; advises sunglasses and eye protection at work rather than simply signing him off; gives the three safety-net triggers (spreading weakness or limb/speech involvement, eye pain or visual change, ear vesicles); and arranges the 3-week recovery review with the non-recovery referral plan stated."}

  foot:"Bell's palsy. The forehead decides the diagnosis: involved means lower motor neurone and Bell's palsy, spared means upper motor neurone and the stroke pathway. Start prednisolone as early as possible within 72 hours — 50 mg daily for 10 days, or 60 mg for 5 days then reducing by 10 mg a day. Protect the eye in everyone who cannot fully close it: drops by day, ointment and taping at night, because exposure keratopathy is the avoidable harm. Suspect Ramsay Hunt if there are vesicles or ear pain, and add aciclovir. Reassess anyone not improving by three weeks. Verify doses against the current BNF before prescribing."
