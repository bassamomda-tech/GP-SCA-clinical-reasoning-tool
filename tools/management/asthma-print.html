  stemSub:"One page for the whole condition. Confirm the diagnosis in the right test order, start the anti-inflammatory reliever (no SABA-only regimen), escalate low-dose to moderate-dose MART, use the biomarker gate before add-ons, manage the acute attack by severity, transition legacy SABA patients, and know when to step DOWN.",

  meta:[
    {t:"NICE NG245 (Nov 2024, joint with BTS and SIGN)"},

  lead:'<div class="mg-layers"><a href="#confirm"><b>Confirm</b><small>Eos or FeNO \u00b7 BDR \u00b7 PEF, in order</small></a><a href="#acute"><b>The attack</b><small>Grade on physiology</small></a><a href="#ladder"><b>AIR \u2192 MART</b><small>Named inhalers \u00b7 check the SPC</small></a><a href="#refer"><b>Refer</b><small>Biomarker gate \u00b7 999</small></a></div>',
  quickSub:"If you read nothing else on this page, read these six cards. Every number traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"\u26a0 A silent chest or a normal PaCO\u2082 is NOT reassuring", html:"In a distressed asthmatic, a <b>silent chest</b> means airflow is too low to generate audible wheeze \u2014 the most dangerous auscultatory finding in acute respiratory medicine. A <b>normal or rising PaCO\u2082</b> (it should be <em>low</em>) in a distressed patient suggests respiratory-muscle fatigue \u2014 interpret the gas in context and seek senior/emergency help. Neither means improvement."},
    {tone:"red", h:"No SABA-only regimen in confirmed asthma", html:"Do not start or continue SABA alone as the planned regimen: change to ICS/formoterol AIR where suitable, or another ICS-containing regimen (NG245, GM formulary, patient preference) \u2014 after checking diagnosis, technique, adherence and device. <b>Any SABA use above 2 inhalers a year prompts a structured review</b>; one or more a month is a particularly high-risk signal."},
    {tone:"amber", h:"Grade the attack on numbers, not on how settled they look", html:"<b>Moderate: PEF 50\u201375%</b> best/predicted, SpO\u2082 \u226592%, no severe features. Acute severe: any one of PEF 33\u201350%, RR \u226525, HR \u2265110, unable to complete a sentence. Life-threatening: any one of PEF &lt;33%, SpO\u2082 &lt;92%, PaO\u2082 &lt;8 kPa, normal PaCO\u2082, silent chest, cyanosis, poor respiratory effort, arrhythmia, exhaustion, altered consciousness, hypotension. Near-fatal: raised PaCO\u2082 &gt;6 kPa or needing ventilation with raised inflation pressures. PEF may be unobtainable or unreliable: the worst clinical feature decides, and deterioration can occur despite an apparently acceptable PEF."},
    {tone:"blue", h:"Diagnose objectively, in this order", html:"Aged 17 and over, start with a <b>blood eosinophil count or FeNO</b>: asthma is confirmed if eosinophils are above the laboratory reference range or <b>FeNO is \u226550 ppb</b>. Aged 12\u201316, FeNO comes first and <b>\u226535 ppb</b> confirms it. These are the NG245 thresholds (the old 40 ppb figure and the 25\u201339 borderline band came from the superseded NG80). If not confirmed \u2192 <b>bronchodilator reversibility: FEV\u2081 up \u226512% AND \u2265200 ml</b>; if spirometry is unavailable or delayed \u2192 <b>PEF variability \u226520%</b> over 2 weeks. Still unconfirmed but suspected \u2192 refer for bronchial challenge. Code as suspected asthma until objective confirmation \u2014 but never delay treatment in an acutely unwell patient to obtain a test (NG245)."},
    {tone:"cream", h:"Grade first, treat promptly, review soon", html:"Give reliever promptly (spacer or O\u2082-driven nebuliser by severity). <b>Prednisolone 40\u201350 mg for at least 5 days</b> for acute severe or life-threatening asthma, and for moderate attacks where clinically indicated (local acute-asthma protocol). Oxygen only if hypoxaemic or severe, to target saturation. Severe or life-threatening features \u2192 <b>999 at once</b> while treating. Arrange prompt post-attack review \u2014 within 48 hours is a reasonable local standard after primary-care treatment."},
    {tone:"green", h:"The action plan saves lives", html:"A personalised <b>written asthma action plan</b> reduces admissions and emergency attendance, yet many patients lack one. It may be symptom- or PEF-based and MART- or SABA-specific; PEF zones (e.g. green &gt;80%, amber 50\u201380%, red &lt;50%) are examples to personalise."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step is where patients come to harm.",
  pathway:[
    {title:"Measure before you think", html:"PEF (% personal best, or predicted; where obtainable and reliable), SpO\u2082, RR, HR and ability to speak \u2014 immediately. These define severity and drive everything that follows. Grade on these, never on appearance."},
    {title:"Screen for life-threatening features", html:"Any one of PEF &lt;33%, SpO\u2082 &lt;92%, silent chest, cyanosis, poor effort, exhaustion or altered consciousness \u2192 <b>999 now</b>, treat while waiting, and do not leave the patient. Asthma with stridor or angio-oedema after a drug or food \u2192 anaphylaxis \u2192 <b>IM adrenaline 500 micrograms first</b>.", alert:true},
    {title:"Treat promptly, by severity", html:"Reliever promptly; oral steroid for severe or life-threatening (and moderate where indicated); oxygen only to target if hypoxaemic. Severe features \u2192 999 now; no prompt, sustained improvement \u2192 emergency transfer \u2014 no fixed interval decides it."},
    {title:"Confirm the diagnosis (if not already objective)", html:"Blood eosinophils or FeNO \u2192 bronchodilator reversibility (or PEF variability if spirometry is unavailable or delayed) \u2192 challenge testing. Assess occupation in every adult, plus smoking, atopy, BMI and previous attacks."},
    {title:"Prevent the next one", html:"Steroid course if indicated, <b>inhaler technique observed</b>, trigger addressed, treatment reviewed (step up if clinically indicated), action plan updated \u2014 and a <b>prompt review</b> booked (48 hours is a reasonable local standard)."}
  ],
  sections:[

    {id:"confirm", nav:"Confirm", title:"Confirming the diagnosis \u2014 objectively, and in the NG245 order", sub:"Treatment normalises the tests and traps the patient in a label. Get the objective test first wherever possible.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1st", title:"Blood eosinophils or FeNO", when:"symptoms suggest asthma",
          html:"Aged 17 and over: <b>eosinophil count above the laboratory reference range or FeNO \u226550 ppb</b> = asthma confirmed. Aged 12\u201316: FeNO is the first test and <b>\u226535 ppb</b> = asthma confirmed. These are the NG245 thresholds \u2014 the older 40 ppb figure and the 25\u201339 \u201cborderline\u201d band came from the superseded NG80. <b>A normal FeNO does not exclude asthma</b> — smoking and corticosteroids lower it; if not raised or unavailable, move to spirometry/BDR then PEF variability. If neither confirms it \u2192 next test."},
         {step:"2nd", title:"Spirometry with bronchodilator reversibility", when:"first test not diagnostic",
          fromLabel:"eosinophils/FeNO not raised or unavailable",
          html:"<b>FEV\u2081 increase \u226512% AND \u2265200 ml</b> (or \u226510% of predicted FEV\u2081) after salbutamol = confirmed. <b>Normal spirometry when well does not exclude asthma.</b>"},
         {step:"3rd", title:"PEF variability", when:"spirometry unavailable or delayed",
          fromLabel:"no timely spirometry",
          html:"Twice-daily peak-flow diary for 2 weeks: <b>mean variability \u226520% = confirmed</b>."},
         {step:"4th", title:"Refer for bronchial challenge", when:"not confirmed by the above but suspicion persists",
          fromLabel:"don't label without evidence",
          html:"Direct challenge (histamine or methacholine) in secondary care. Code as <b>suspected asthma</b> until objectively confirmed; if acutely unwell, treat now and test once controlled \u2014 and never remove treatment abruptly to test; plan it."}
       ]},
       {b:"dl", rows:[
         ["Assess at baseline","Symptom pattern and triggers; <b>occupation \u2014 ask every adult</b> (paint sprayers, bakers, cleaners, healthcare, and exposure to flour dust, isocyanates, laboratory animals or natural rubber latex); smoking and vaping; atopy and rhinitis; BMI; previous attacks, admissions and oral steroid courses"],
         ["Control score","<b>RCP 3 questions</b> (daytime symptoms? night waking? activity limitation?) or <b>ACT</b> \u2014 record a number you can compare at review"],
         ["<b>ACT interpretation</b>","A validated questionnaire aid, not a treatment algorithm: <b>20\u201325 well controlled</b> \u00b7 <b>16\u201319 not well controlled</b> \u2014 review technique, adherence and triggers \u00b7 <b>\u226415 very poorly controlled</b> \u2014 prompt clinical assessment (never steroids on a score alone). The five items are symptom frequency, night waking, activity limitation, reliever use and overall control. Administer at every review <em>and</em> at exacerbation"],
         ["History that changes risk","Rate of deterioration (<b>acute over hours is more dangerous than gradual over days</b>); trigger (infection is commonest in adults, then allergen, exercise, NSAID or aspirin, beta-blocker, emotional stress); usual control and SABA frequency; <b>previous ITU or ventilation \u2014 the single highest-risk indicator</b>; ICS dose and adherence; comorbidities (GORD with nocturnal aspiration, rhinosinusitis, obesity)"],
         ["Examination","ABCDE plus: SpO\u2082 (mandatory), <b>RR &gt;25 and HR &gt;110 as severity markers</b>, BP, ability to complete sentences, auscultation (bilateral wheeze typical; <b>silent chest is life-threatening</b>), accessory muscle use and tracheal tug, <b>pulsus paradoxus &gt;12 mmHg BP variation with respiration = severe</b>, PEF, and percussion (hyperresonant with air trapping, dull suggests a pneumothorax complication)"]
       ]},
       {b:"table", head:["Investigation","When","Interpretation"], rows:[
         ["<b>PEF</b>","<b>Acute asthma, where obtainable and reliable</b>","Express as <b>% personal best</b> (preferred) or % predicted; may be impossible in severe distress \u2014 the worst clinical feature decides. Regular PEF monitoring for control only with a person-specific reason or as part of an action plan (NG245)"],
         ["<b>SpO\u2082</b>","All \u2014 continuous if &lt;95%","&lt;92% is a life-threatening feature"],
         ["<b>Arterial blood gas</b>","If SpO\u2082 &lt;92% or any life-threatening feature","<b>PaCO\u2082 interpretation is critical</b> \u2014 see the physiology note below"],
         ["<b>CXR</b>","<b>Not routine</b>","Indicated for suspected pneumothorax or pneumonia, first presentation, a life-threatening attack, or poor response to treatment"],
         ["FBC + CRP","Suspected infective trigger","Blood cultures if fever with consolidation"],
         ["Theophylline level","If on theophylline","<b>Narrow therapeutic index</b>"],
         ["<b>FeNO</b>","Diagnosis, and at reviews when control is poor or a treatment change is planned","Diagnosis: \u226550 ppb (17+) or \u226535 ppb (12\u201316). On treatment NG245 sets no step-up or step-down cut-offs: a raised FeNO in uncontrolled asthma points to poor adherence or a need for more ICS \u2014 interpret it alongside symptoms, technique and adherence"],
         ["Spirometry","At diagnosis, after starting treatment, then periodically (commonly every 1\u20132 years, more often if high risk)","FEV\u2081/FVC"]
       ]},
       {b:"why", html:"Percentage of personal best is more clinically meaningful than absolute PEF. A patient whose personal best is 500 L/min achieving 400 L/min (80%) is having a moderate exacerbation; the same 400 L/min in someone whose best is 600 L/min (67%) is <b>acute severe</b>. And the ABG follows a counterintuitive logic: in mild-to-moderate asthma, hypoxaemia drives hyperventilation, producing hypocapnia (typically 3.5\u20134.5 kPa) and respiratory alkalosis (pH &gt;7.45) \u2014 that is the <em>expected</em> finding in someone working hard to breathe. As muscles fatigue the CO\u2082 climbs toward \u201cnormal\u201d (5\u20136 kPa) or above (&gt;6 kPa). A normal or rising PaCO\u2082 in a distressed patient is a warning sign of fatigue \u2014 interpret it in context and get immediate senior or emergency support."},
       {b:"warn", html:"Do not start long-term treatment on a \u201ctrial of therapy\u201d alone in the 12+ age group \u2014 get the objective test first where at all possible. If treatment has already been started, arrange testing at the point it can safely be reviewed."}
     ]},

    {id:"acute", nav:"The attack", title:"The acute attack \u2014 grade it, treat it, escalate it", sub:"Acute care follows the BTS/SIGN acute-asthma recommendations (signposted by NICE NG244) and the local pathway. Grade on the worst feature; treatment never waits for the ambulance.",
     blocks:[
       {b:"warn", html:"Any acute asthmatic whose wheeze disappears while they are still distressed and not improving is deteriorating rapidly. The chest is silent because they are about to arrest, not because they are better. The classic picture of near-fatal asthma: sitting bolt upright, one word at a time, all accessory muscles working, visibly exhausted."},
       {b:"table", head:["Severity","Definition","Action"], rows:[
         ["<b>Moderate</b>","<b>PEF 50\u201375%</b> best or predicted, increasing symptoms not controlled by the usual reliever, speaking full sentences, <b>RR &lt;25, HR &lt;110</b>, <b>SpO\u2082 \u226592%</b>, no acute severe features","Manage in primary care with dose escalation. On MART: <b>extra ICS/formoterol inhalations up to the product's maximum per occasion</b> (e.g. 6 for Symbicort; follow the SPC). Or salbutamol 4\u201310 puffs via spacer, repeated every 10\u201320 minutes. <b>Prednisolone 40\u201350 mg OD for at least 5 days where clinically indicated.</b> Review the response before they leave, and <b>review again promptly (within 1\u20132 days)</b>"],
         ["<b>Acute severe</b>","<b>Any one of: PEF 33\u201350%</b> best/predicted \u00b7 <b>RR \u226525/min</b> \u00b7 <b>HR \u2265110/min</b> \u00b7 <b>inability to complete sentences in one breath</b>. SpO\u2082 may still be \u226592%","Requires hospital assessment \u2014 start treatment and call 999 at once. Continuous back-to-back nebulised salbutamol 2.5\u20135 mg + O\u2082 + prednisolone 40\u201350 mg PO immediately. Admit unless there is a rapid, sustained response"],
         ["<b>Life-threatening</b>","<b>Any one of: PEF &lt;33%</b> \u00b7 <b>SpO\u2082 &lt;92%</b> \u00b7 <b>PaO\u2082 &lt;8 kPa</b> \u00b7 <b>normal PaCO\u2082 (4.6\u20136.0 kPa \u2014 it should be low)</b> \u00b7 <b>silent chest</b> \u00b7 cyanosis \u00b7 poor respiratory effort \u00b7 arrhythmia \u00b7 exhaustion or altered consciousness \u00b7 hypotension","<b>999 immediately.</b> High-concentration O\u2082 <b>15 L/min via non-rebreather</b> while awaiting transfer (then titrated to target once monitored); back-to-back nebulised salbutamol + <b>ipratropium 500 micrograms</b> (O\u2082-driven); prednisolone 40\u201350 mg PO or <b>IV hydrocortisone 100 mg</b>; <b>magnesium sulphate 1.2\u20132 g IV over 20 minutes, single dose</b> (after senior discussion). Do not leave the patient; alert anaesthetics and ICU"],
         ["<b>Near-fatal</b>","<b>Raised PaCO\u2082 &gt;6 kPa</b> and/or requiring mechanical ventilation with raised inflation pressures. Add exhaustion, confusion or reduced consciousness, bradycardia, hypotension","<b>999 \u2014 imminent respiratory arrest. Do NOT leave the patient.</b> GP role: inhaled treatment, oxygen, steroid, continuous observation and handover; ICU treatments are hospital-only"]
       ]},
       {b:"ladder", steps:[
         {step:"Step 1", title:"Initial treatment, by severity", when:"once severity is graded",
          html:"Reliever promptly. Acute severe or life-threatening: <b>salbutamol 2.5\u20135 mg nebulised, O\u2082-driven at 6\u20138 L/min</b> where equipment allows. Moderate, or if no nebuliser: salbutamol 4\u201310 puffs via spacer \u2014 as effective as a nebuliser \u2014 each puff inhaled separately, one per minute, up to 10 puffs. Oral steroid for acute severe or life-threatening attacks, and for moderate attacks where clinically indicated: <b>prednisolone 40\u201350 mg PO</b> (or <b>IV hydrocortisone 100 mg</b> if unable to swallow). <b>Oxygen only if hypoxaemic or severe, to the target range</b> (high-concentration in life-threatening asthma, then titrate). <b>Reassess PEF, SpO\u2082 and clinical status</b> \u2014 no prompt, sustained improvement \u2192 emergency transfer (no fixed interval)."},
         {step:"Step 2", title:"Acute severe or life-threatening", when:"any severe or life-threatening feature",
          fromLabel:"escalate, don't wait",
          html:"Continue <b>nebulised salbutamol back-to-back (every 15\u201320 minutes)</b>. Add <b>ipratropium bromide 500 micrograms nebulised</b> as an early adjunct in severe or life-threatening asthma (not routinely for every attack) \u2014 only where equipment, oxygen, monitoring and resuscitation capability allow. <b>Magnesium sulphate 1.2\u20132 g IV over 20 minutes, single dose</b>, in acute severe asthma without a good initial response to inhaled bronchodilators (BTS/SIGN 158) — only per the local emergency protocol after senior/secondary-care discussion (in pregnancy, via the obstetric/emergency pathway). Nebulised magnesium has no role in adults (3Mg trial). Continue oxygen to the target saturation; IV access and fluid if hypotensive. 999 if not already called."},
         {step:"Step 3", title:"Hospital/critical-care clinicians only", when:"not responding to the above", fromLabel:"not a primary-care step",
          html:"IV aminophylline (not routine), IV salbutamol, NIV (highly selected) and intubation are specialist-led hospital/ICU treatments with ECG and biochemical monitoring. <b>The GP role is recognition, initial inhaled treatment, oxygen where indicated, systemic steroid, ambulance transfer, continuous observation and handover.</b>"}
       ]},
       {b:"cards", items:[
         {tone:"red", h:"Asthma + stridor or angio-oedema after a drug or food", html:"<b>Anaphylaxis-triggered bronchospasm \u2014 not simple asthma.</b> \u2192 999 and IM adrenaline 500 micrograms (0.5 mL of 1:1000) into the outer thigh immediately, before anything else."},
         {tone:"red", h:"Acute asthma in pregnancy", html:"Acute severe asthma in pregnancy is an emergency \u2192 999 and treat vigorously in hospital. <b>Give oxygen to keep SpO\u2082 94\u201398%</b> (BTS/SIGN 158) because of fetal hypoxia risk. Salbutamol and prednisolone are used as usual. Avoid the NSAID trigger; alert the obstetric team. Do not stop ICS or MART in pregnancy \u2014 poor control harms the baby far more than the drugs."},
         {tone:"amber", h:"Practice equipment \u2014 check it before you need it", html:"An O\u2082 cylinder with non-rebreather mask, a <b>nebuliser that can be driven by oxygen</b>, IV access equipment, and injectable hydrocortisone. Grading takes 60 seconds: PEF as % personal best, RR, HR, speech, SpO\u2082 \u2014 and if any acute severe or life-threatening criterion is met, 999 is called simultaneously with starting treatment."}
       ]},
       {b:"why", html:"A single dose of IV magnesium sulphate 1.2\u20132 g is recommended by BTS/SIGN 158 (2019) for acute severe asthma not responding to initial inhaled bronchodilators, and remains underused in both primary care and emergency departments. Magnesium acts as a calcium-channel antagonist, blocking calcium-mediated bronchial smooth-muscle contraction, inhibits acetylcholine release at the neuromuscular junction, and has anti-inflammatory effects. The evidence is modest: the UK <b>3Mg trial (Goodacre et al, Lancet Respiratory Medicine 2013)</b> found no benefit from nebulised magnesium and a non-significant fall in admissions with IV magnesium (72% vs 78% on placebo). It is given <b>once only</b>, and only per the local emergency protocol after senior/secondary-care discussion \u2014 not a routine treatment for every acute attack."}
     ]},

    {id:"risk", nav:"Risk", title:"Who is at risk of a fatal attack \u2014 and the action plan that prevents it", sub:"Risk stratification is the difference between a routine review and an intervention.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"The single highest-risk predictor", html:"<b>Previous near-fatal asthma \u2014 ICU admission or ventilation.</b> Flag it on the record; it changes the threshold for admission at every future attack."},
         {tone:"amber", h:"High-risk features for a severe or fatal attack", html:"<b>Three or more classes of asthma medication</b>; <b>heavy SABA use (&gt;1 canister/month)</b>; oral prednisolone-dependent asthma; non-adherence to ICS (insufficient controller therapy is a recurring feature of fatal attacks); a recent ED visit or hospitalisation (<b>&lt;12 months</b>); psychosocial factors (depression, anxiety, illicit drug use, social isolation) \u2014 a significant risk multiplier; aspirin or NSAID sensitivity; ongoing occupational exposure; severe food allergy."},
         {tone:"green", h:"The written asthma action plan \u2014 an example", html:"Zones are examples \u2014 plans may be symptom- or PEF-based. <b>Green (well, e.g. PEF &gt;80%)</b> \u2014 continue regular medication. <b>Amber (PEF 50\u201380% or increasing symptoms)</b> \u2014 increase reliever, start prednisolone if the plan says so, contact the GP. <b>Red (PEF &lt;50% or severe symptoms)</b> \u2014 <b>call 999</b>, continuous reliever, take prednisolone. Personalise it with their own personal best PEF, exact SABA escalation doses, when and at what dose to start prednisolone, and precise 999 criteria. MART-specific if on MART \u2014 their \u201cblue inhaler\u201d IS the steroid one."}
       ]},
       {b:"why", html:"Systematic reviews show a personalised written action plan reduces admissions and emergency attendance \u2014 yet many patients do not have one. Provision of a plan is a <b>NICE QS25</b> and RCGP quality indicator, expected at diagnosis and reviewed annually. Template formats are quick to complete at review and can be done by a trained asthma nurse."}
     ]},

    {id:"foundations", nav:"Foundations", title:"The work that makes inhalers work", sub:"Most \u201ctreatment failure\u201d is technique, adherence, smoking or the wrong diagnosis.",
     blocks:[
       {b:"cards", items:[
         {tone:"blue", h:"\ud83c\udf2c\ufe0f Technique", html:"<b>Watch them use the device at EVERY review and step change</b> \u2014 the commonest cause of apparent treatment failure. DPIs need a sharp inhale; MDIs slow, with a spacer. <b>Self-reported technique is unreliable</b> \u2014 use video and direct observation."},
         {tone:"blue", h:"\ud83e\uddea Device choice matters in an attack", html:"<b>MDI + spacer</b> suits most patients and is <b>preferred during an acute attack</b> (passive breathing technique). Accuhaler (DPI) needs inspiratory flow &gt;30 L/min; Turbohaler &gt;60 L/min \u2014 <b>not suitable during an acute attack</b>. Easyhaler and Genuair have moderate flow requirements."},
         {tone:"green", h:"\ud83d\udcdd Action plan", html:"A written personalised plan for everyone, MART-specific if on MART."},
         {tone:"amber", h:"\ud83d\udead Smoking and vaping", html:"Cessation support at every review. Smoking reduces ICS response and blunts FeNO interpretation \u2014 prioritise cessation and reassess diagnosis and control rather than simply raising the dose. The most important single lifestyle change for any asthmatic who smokes."},
         {tone:"blue", h:"\ud83c\udf3f Triggers", html:"Treat <b>allergic rhinitis</b> (it drags asthma down). Review occupational exposure. NSAIDs and aspirin: ask about previous respiratory reactions \u2014 avoid the culprit and cross-reactive NSAIDs where the history fits; do not ban NSAIDs in every asthmatic. Beta-blockers: avoid non-selective ones where possible; review systemic and ophthalmic beta-blockers carefully, with specialist advice where there is a compelling indication. House-dust-mite mitigation and pet avoidance where relevant. Exercise-induced bronchospasm: a reliever dose before exercise \u2014 ICS/formoterol for people on AIR or MART (NG245), not SABA alone \u2014 and review overall control, because exercise symptoms often mean the asthma is uncontrolled."},
         {tone:"blue", h:"\ud83d\udc89 Vaccines", html:"<b>Annual influenza \u2014 a QOF indicator (RES004)</b>: an inactivated vaccine \u2014 <b>trivalent from 2025/26</b> (adjuvanted, high-dose or recombinant for \u226565s, per the UKHSA annual flu letter), offered <b>each autumn</b>; pneumococcal where the patient meets current UKHSA eligibility; COVID per the current schedule."},
         {tone:"green", h:"\u2696\ufe0f Weight", html:"<b>Obesity (BMI &gt;30)</b> means more severe symptoms, lower lung function, worse quality of life, reduced ICS response and more exacerbations. <b>A 5\u201310% weight loss significantly improves control</b>, reduces exacerbations, and may allow stepping down (NICE NG246)."},
         {tone:"amber", h:"\ud83e\udde0 Mood and breathing pattern", html:"Anxiety and depression are common in severe asthma. Anxiety both mimics and worsens asthma, and <b>hyperventilation syndrome mimics asthma and may coexist</b>. Screen where relevant (e.g. PHQ-9, GAD-7). Breathing retraining (Buteyko, physiotherapist-led) reduces SABA use and improves quality of life in RCTs; refer dysfunctional breathing to a respiratory physiotherapist."},
         {tone:"cream", h:"\ud83d\udcda Self-management", html:"<b>Asthma + Lung UK (asthma.org.uk), helpline 0300 222 5800.</b> Every patient should hold a current written action plan (with their personal best PEF and a peak-flow meter where the plan is PEF-based), know when to take prednisolone, and know when to call 999. Brief motivational interviewing at each review improves self-management behaviour."}
       ]},
       {b:"why", html:"Influenza is the commonest identified trigger for severe exacerbations requiring hospitalisation in adults, particularly in autumn and winter, and vaccination helps reduce asthma-related admissions. Some patients fear the vaccine will \u201ctrigger their asthma\u201d \u2014 a belief rooted in early whole-virus vaccines. <b>Modern inactivated vaccines do not trigger exacerbations</b>; address the misconception proactively. ICS suppresses eosinophilic airway inflammation and reduces exacerbations. Common reasons for non-adherence are forgetfulness (once-daily beats twice-daily), oral candida (rinse after use, use a spacer), and steroid fears \u2014 inhaled steroids are not systemic steroids. Support adherence practically: electronic reminders, dosette boxes, and a pharmacy repeat service for inhalers."}
     ]},

    {id:"ladder", nav:"AIR \u2192 MART", title:"The AIR \u2192 MART ladder \u2014 named inhalers (check the SPC and formulary)", sub:"On AIR/MART every reliever puff contains ICS. Brands, strengths, licensing and maximum inhalations are product-specific \u2014 check the current SPC and GM formulary; never switch microgram-for-microgram. Review every step at 8\u201312 weeks.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Step 1", title:"AIR \u2014 low-dose ICS/formoterol AS NEEDED only", when:"new diagnosis / infrequent symptoms",
          html:"<b>Symbicort Turbohaler 200/6</b>, <b>DuoResp Spiromax 160/4.5</b> or <b>Fobumix Easyhaler 160/4.5</b> (budesonide/formoterol, licensed for AIR from 12): <b>1 inhalation when symptomatic</b>, repeated after a few minutes if needed (maximum per episode and per day are <b>product-specific — follow the SPC</b> and give written limits)."},
         {step:"Step 2", title:"Low-dose MART", when:"reliever \u22653 days/week, night waking, or ANY exacerbation",
          fromLabel:"uncontrolled on AIR",
          html:"Same drug, now regular: <b>Symbicort 100/6 or 200/6 \u2014 1 inhalation BD + PRN</b> (or Fobumix/DuoResp equivalents; <b>Fostair 100/6</b> MDI+spacer or NEXThaler from 18+). One device does maintenance <em>and</em> relief."},
         {step:"Step 3", title:"Moderate-dose MART", when:"uncontrolled on low-dose MART at 8\u201312 weeks",
          fromLabel:"technique + adherence confirmed first",
          html:"Double the maintenance: <b>Symbicort 200/6 \u2014 2 inhalations BD + PRN</b> (or Fostair 100/6, 2 puffs BD, 18+ — check each product's MART licence: Fostair 200/6 is maintenance-only per its SPC). <b>Follow the product's maximum daily inhalations</b> and give written instructions on when to seek urgent care."},
         {step:"Step 4", title:"The biomarker gate \u2014 FeNO + blood eosinophils", when:"uncontrolled on moderate MART",
          fromLabel:"phenotype before more drugs",
          html:"<b>Either raised \u2192 REFER</b> \u2014 a referral trigger, not a diagnosis of eosinophilic asthma or an automatic biologic indication; confirm diagnosis, technique, adherence, smoking and occupation, and address rhinitis, obesity, reflux and dysfunctional breathing. Both normal \u2192 an 8\u201312 week trial of montelukast 10 mg nocte (LTRA) OR a LAMA (e.g. tiotropium Respimat) added to moderate MART. Works \u2192 continue; doesn't \u2192 stop it, try the other, then refer."},
         {step:"Step down", title:"Don't forget the way down", when:"controlled \u22653 months",
          fromLabel:"good control, no flares",
          html:"Reduce maintenance one step (moderate \u2192 low MART \u2192 consider AIR only) at a review, with the action plan updated and an early re-review booked. Step down only after sustained control, with a written plan and early review."}
       ]},
       {b:"dl", rows:[
         ["<b>Post-exacerbation prescribing</b>","<b>Prednisolone 40\u201350 mg OD for at least 5 days</b> \u2014 no taper is generally needed for short courses \u2014 but consider cumulative courses, adrenal suppression and specialist advice in frequent users. <b>Review inhaler technique at discharge</b>; check ICS adherence; identify the cause and review the diagnosis and maintenance treatment — consider AIR/MART and step up if clinically indicated (not automatically if a clear reversible trigger has resolved and control is restored); ensure a spacer is available and the technique demonstrated; <b>update the action plan with the new personal best PEF</b>"],
         ["<b>Legacy BTS/SIGN step framework</b> (for cross-reference only \u2014 superseded by NG245, which no longer allows SABA without ICS)","<b>Step 1</b> SABA PRN, no ICS (no longer recommended). <b>Step 2</b> low-dose ICS (e.g. beclometasone 200\u2013400 micrograms/day). <b>Step 3</b> low-dose ICS + LABA (e.g. Symbicort MART, budesonide/formoterol 200/6 micrograms \u2014 i.e. budesonide 200 micrograms with formoterol <b>6 mcg</b> \u2014 1\u20132 puffs maintenance BD + 1 PRN; more than 8 inhalations a day in total not normally needed, up to 12 for a limited period (SPC)). <b>Step 4</b> medium-dose ICS + LABA \u00b1 LTRA (montelukast 10 mg OD \u2014 caution neuropsychiatric). <b>Step 5</b> refer: high-dose ICS + LABA + add-on, and biologics"],
         ["<b>Biologics</b>","Specialist-initiated: <b>omalizumab, mepolizumab, benralizumab, dupilumab, tezepelumab</b> \u2014 eligibility depends on the agent (blood eosinophils, positive skin-prick test or specific IgE, or raised FeNO)"]
       ]},
       {b:"table", head:["Side effect","Cause","Fix"], rows:[
         ["Oral thrush / dysphonia","ICS deposition","Rinse and spit after maintenance doses; spacer with MDIs; re-check technique; treat candida (miconazole gel or nystatin)"],
         ["Tremor / palpitations","Formoterol","Usually settles in days to weeks; if persistent, review PRN frequency \u2014 are they treating uncontrolled asthma with puffs?"],
         ["Cough on inhaling","Device or propellant","Switch DPI to MDI + spacer; slow the technique"],
         ["<b>Montelukast: vivid dreams, low mood, agitation</b>","LTRA neuropsychiatric effects (<b>MHRA warning</b>)","Counsel at initiation; <b>stop if mood or behaviour changes \u2014 they reverse</b>"],
         ["LAMA: dry mouth, urinary retention","Anticholinergic","Caution in glaucoma and prostatic symptoms"]
       ]},
       {b:"warn", html:"<b>Transitioning legacy patients:</b> separate ICS plus SABA is not wrong if well controlled \u2014 plan any switch to AIR or MART after checking diagnosis, technique, adherence, device and licensing. <b>No ICS anywhere is the dangerous pattern</b>: more than 2 SABA inhalers a year means act, not reissue."},
       {b:"why", html:"MART is the most important change in asthma management of the last decade. Formoterol is a fast-acting <em>and</em> long-acting beta-2 agonist \u2014 onset as fast as salbutamol (about <b>1\u20133 minutes</b>) with a <b>12-hour</b> duration \u2014 so a budesonide/formoterol inhaler can serve as both maintenance and reliever. When symptoms increase, every extra reliever puff is also a dose of budesonide, delivering anti-inflammatory treatment at the exact moment of inflammation. MART reduces severe exacerbations compared with fixed-dose ICS/LABA plus a SABA reliever, which is why NG245 prefers it."}
     ]},

    {id:"monitor", nav:"Monitoring", title:"The review rhythm \u2014 and the prompt post-attack review", sub:"Every attack is a sentinel event — review promptly and find the cause.",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["<b>Post-exacerbation review</b>","<b>Prompt \u2014 within 48 hours is a reasonable local standard after primary-care treatment; after hospital, per the discharge plan</b>","Confirm the prednisolone course is being taken; confirm PEF is improving; identify and address the trigger; review maintenance treatment (step up if clinically indicated); update the action plan; review inhaler technique; assess psychosocial risk. NICE: review after an exacerbation and at least annually, timed by severity and setting"],
         ["Response to any change","<b>8\u201312 weeks</b>","Control score plus a reliever-use audit \u2192 continue, step up, or step down"],
         ["Structured review","<b>At least annually</b>","RCP3 or ACT, technique observed, action plan updated, reliever count from the prescribing record, smoking, rhinitis, flu jab, spirometry, BMI, education. Practice asthma-nurse-led reviews achieve outcomes equivalent to GP-led reviews"],
         ["<b>FeNO</b>","Consider at review, and whenever a change in maintenance treatment is being considered","No numeric on-treatment bands in NG245: a raised FeNO in uncontrolled asthma suggests poor adherence or a need for more ICS; a low FeNO with poor control prompts a look for another cause (breathing-pattern disorder, ILO, non-eosinophilic disease)"],
         ["<b>SABA / reliever audit</b>","Ongoing, at practice level","Any SABA use above 2 inhalers a year \u2192 structured review of diagnosis, adherence, technique, control and treatment (NG245); one or more a month is a particularly high-risk signal. Interpret against canister size, MART use and actual use. Flag SABA-only repeats and any repeat interval under 8 weeks (more than one canister a month)"],
         ["Frequent oral steroids","\u22652 courses/year","Uncontrolled disease \u2192 escalate, biomarker gate, refer \u2014 and consider bone and adrenal protection"]
       ]},
       {b:"cards", items:[
         
       ]},
       {b:"cards", items:[
         {tone:"red", h:"\ud83d\udea8 999", html:"\u201cCall 999 if you cannot speak in full sentences, your lips go blue, your reliever isn't touching it, or your peak flow drops below a third of your best.\u201d Silent chest, SpO\u2082 &lt;92%, PEF &lt;33%, exhaustion or altered consciousness."},
         {tone:"amber", h:"\ud83d\udd34 Same-day", html:"\u201cIf you need your reliever again within four hours, or you are waking at night with it, contact us the same day.\u201d Moderate attack (PEF 50\u201375%) not settling promptly after initial reliever treatment. Acute severe features (PEF 33\u201350%, RR \u226525, HR \u2265110, unable to complete sentences) mean 999."},
         {tone:"amber", h:"\ud83d\udc8a Finish the steroids", html:"\u201cTake the whole 5-day steroid course even if you feel better after two \u2014 stopping early is when people relapse.\u201d"},
         {tone:"green", h:"\ud83c\udfe0 Come back soon after any attack", html:"\u201cI want to see you again soon after any attack \u2014 usually within a couple of days \u2014 even if you feel fine \u2014 that is when we work out why it happened and stop the next one.\u201d"}
       ]},
       {b:"say", html:"Your reliever now contains the steroid too \u2014 so when your chest is bad, every extra puff is also treating the inflammation underneath. If you're needing it most days, that's your signal to come back, not to soldier on."}
     ]},

    {id:"loop", nav:"Not responding?", title:"Not controlled? Run this BEFORE stepping up", sub:"Most uncontrolled asthma is technique, adherence, smoking or the wrong diagnosis — not undertreatment.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"1 · Technique", html:"Watched them use it? Right device for their inspiratory effort?"},
         {tone:"amber", h:"2 · Adherence", html:"Pickup data checked? Steroid fears explored? MART simplifies to one inhaler."},
         {tone:"blue", h:"3 · Triggers", html:"Smoking/vaping, occupation, rhinitis untreated, NSAIDs, \u03b2-blockers (incl. timolol drops)?"},
         {tone:"blue", h:"4 · Diagnosis", html:"Ever objectively confirmed? Consider ILO, dysfunctional breathing, COPD overlap, heart failure, PE, pneumonia, pneumothorax, bronchiectasis, anaemia, deconditioning, ACE-inhibitor cough, central airway obstruction or malignancy, ABPA."},
         {tone:"blue", h:"5 · Biomarkers", html:"At the step-4 gate: FeNO + eosinophils done?"}
       ]},
       {b:"cards", items:[
         {tone:"green", h:"All five checked and still uncontrolled?", html:"Then step up \u2014 or refer. That is a genuine escalation rather than a higher dose covering an unfixed technique or adherence problem."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer \u2014 999, same-day, and the specialist gate", sub:"The 999 decision is made on objective severity markers, not symptoms alone.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999 \u2014 call immediately", html:"<b>Life-threatening or near-fatal asthma</b> (SpO\u2082 &lt;92%, PEF &lt;33%, silent chest, altered consciousness, exhaustion, cyanosis); <b>acute severe asthma</b> (PEF 33\u201350%, RR \u226525, HR \u2265110, unable to complete sentences); <b>acute severe asthma not responding promptly</b> to initial treatment (no fixed interval); <b>severe asthma in pregnancy</b> deteriorating or responding poorly; <b>asthma with anaphylaxis features \u2014 IM adrenaline first</b>."},
         {tone:"amber", h:"Same-day hospital assessment", html:"<b>PEF 50\u201375% (moderate) not improving after initial treatment</b>; <b>nocturnal presentation</b>; previous near-fatal asthma; recent hospital admission or repeated oral steroid courses; poor social support, inability to self-manage, or concern about deterioration; <b>pregnancy with significant deterioration</b>."},
         {tone:"cream", h:"GP urgent review \u2014 next day", html:"Moderate asthma responding to treatment: <b>PEF &gt;75% after bronchodilator with no life-threatening features</b>. Review treatment, <b>prednisolone 40\u201350 mg OD for at least 5 days</b> where indicated, written action plan \u2014 and a prompt review."},
         {tone:"blue", h:"Respiratory specialist \u2014 the biomarker gate", html:"<b>FeNO or blood eosinophils raised at the step-4 gate</b> \u2192 specialist assessment via the local Greater Manchester respiratory pathway (a referral trigger, not an automatic biologic indication). Also: uncontrolled despite moderate MART plus an LTRA or LAMA trial with confirmed technique and adherence; \u22652 courses of oral prednisolone in 12 months, or \u22651 hospitalisation in 12 months; step 4\u20135 treatment not achieving control."},
         {tone:"cream", h:"Prompt (non-emergency) review", html:"SABA overuse; poor symptom control; repeated oral steroid courses; suspected occupational asthma; diagnostic uncertainty; uncontrolled asthma despite moderate-dose MART with confirmed adherence and technique."},
         {tone:"blue", h:"Occupational asthma", html:"Better away from work or worse at work \u2192 refer promptly to a respiratory/occupational-asthma service, and <b>document the exposure history before workplace changes are made</b>."},
         {tone:"blue", h:"Diagnostic doubt", html:"Eosinophils/FeNO, reversibility and PEF variability do not confirm it but symptoms persist \u2192 <b>refer for a bronchial challenge test (e.g. methacholine or mannitol)</b>; atypical features."},
         {tone:"amber", h:"Pregnancy", html:"<b>Do not stop ICS or MART</b> \u2014 poor control harms the baby far more than the drugs. Severe or deteriorating asthma in pregnancy warrants early specialist involvement."}
       ]},
       {b:"say", html:"Your asthma isn't as settled as it should be despite the right inhalers used well, so I want a chest specialist to check whether you're in the group that responds to the newer targeted treatments."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only \u2014 the Casebook keeps the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 24-year-old woman, breathless for two days after a cold, using her blue inhaler \u201cmost days\u201d for months. PEF 300 against a personal best of 480 (62%), RR 22, HR 104, speaking in full sentences. She has had two prednisolone courses this year and has collected eight salbutamol inhalers in twelve months."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Measures PEF, SpO\u2082, RR, HR and speech <em>before</em> deciding; grades this as moderate; treats promptly with spacer salbutamol and, given her steroid history and poor control, <b>prednisolone 40\u201350 mg for at least 5 days</b>; <b>recognises the SABA over-use as the real diagnosis</b> and moves her onto MART rather than reissuing; watches her inhaler technique; writes a MART-specific action plan; and books a <b>prompt review</b> (48 hours as the local standard). <a href='../../cases/asthma.html'>Open the full casebook chapter \u2192</a>"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>NICE NG245 (joint with BTS and SIGN) \u2014 Asthma: diagnosis, monitoring and chronic asthma management (November 2024)<br><a href="https://www.nice.org.uk/guidance/ng245" rel="noopener">nice.org.uk/guidance/ng245</a><span class="rd"> \u2014 supersedes NG80 and the chronic-management sections of BTS/SIGN 158 (2019). The objective test order (eosinophils or FeNO first in adults; FeNO first in 12\u201316s) and thresholds (FeNO \u226550 ppb 17+, \u226535 ppb 12\u201316; eosinophils above the lab reference range), bronchodilator reversibility and PEF variability criteria, the definition of uncontrolled asthma, FeNO at review without numeric bands, the AIR and MART ladder, the step-4 biomarker gate, and step-down. NG245 does not cover the acute attack</span></li>'+
         '<li><b>BTS/SIGN 158 \u2014 British guideline on the management of asthma (2019)</b><span class="rd"> \u2014 acute severity grading, oxygen targets, nebulised salbutamol and ipratropium, prednisolone 40\u201350 mg for at least 5 days, IV hydrocortisone 100 mg, and a single dose of IV magnesium sulphate 1.2\u20132 g over 20 minutes</span></li>'+
         '<li><b>NRAD \u2014 National Review of Asthma Deaths (2014)</b><span class="rd"> \u2014 insufficient inhaled corticosteroid and SABA over-prescription as recurring features of asthma deaths</span></li>'+
         '<li><b>SABINA programme; GINA 2024</b><span class="rd"> \u2014 SABA over-use as a risk signal; on this page any use above 2 inhalers a year prompts a structured review (NG245)</span></li>'+
         '<li><b>NICE NG244 \u2014 Asthma pathway (BTS, NICE, SIGN)</b><br><a href="https://www.nice.org.uk/guidance/ng244" rel="noopener">nice.org.uk/guidance/ng244</a><span class="rd"> \u2014 signposts the retained BTS/SIGN acute-asthma and severe-asthma recommendations</span></li>'+
         '<li><b>Greater Manchester Adult Asthma Management Guidelines (2024)</b><br><a href="https://gmmmg.nhs.uk" rel="noopener">gmmmg.nhs.uk</a><span class="rd"> \u2014 local device, formulary and referral pathway; reconcile with each inhaler SPC</span></li>'+
         '<li><b>UKHSA \u2014 Immunisation against infectious disease (the Green Book)</b><br><a href="https://www.gov.uk/government/collections/immunisation-against-infectious-disease-the-green-book" rel="noopener">gov.uk \u2014 the Green Book</a><span class="rd"> \u2014 influenza and pneumococcal eligibility</span></li>'+
         '<li><b>3Mg trial \u2014 Goodacre et al, Lancet Respiratory Medicine 2013</b><span class="rd"> \u2014 no role for nebulised magnesium in adults; IV magnesium gave a non-significant reduction in admission</span></li>'+
         '<li><b>Asthma Control Test \u2014 Schatz et al, J Allergy Clin Immunol 2006</b><span class="rd"> \u2014 cut points \u226419 (not well controlled) and \u226415 (very poorly controlled)</span></li>'+
         '<li><b>Budesonide/formoterol SPC (Symbicort Turbohaler 200/6)</b><span class="rd"> \u2014 MART: no more than 6 inhalations on one occasion; more than 8 a day in total not normally needed, up to 12 for a limited period</span></li>'+
         '<li>NICE QS25 (asthma quality standard); QOF RES004; NICE NG246 (weight management)<span class="rd"> \u2014 written action plan at diagnosis and reviewed annually, annual influenza vaccination, and the weight pathway</span></li>'+
         '<li><b>MHRA drug safety update \u2014 montelukast</b><span class="rd"> \u2014 neuropsychiatric reactions; counsel at initiation and stop if mood or behaviour changes</span></li>'+
         '<li><b>Asthma + Lung UK</b><br><a href="https://www.asthma.org.uk" rel="noopener">asthma.org.uk</a><span class="rd"> \u2014 patient resources and action-plan templates; helpline 0300 222 5800</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> \u2014 all inhaler and steroid doses, magnesium, ipratropium, aminophylline; verify before prescribing</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Asthma in adults and young people aged 12 and over \u2014 NICE NG245 (November 2024, joint with BTS and SIGN, superseding NG80 and the chronic-management sections of BTS/SIGN; the acute attack follows BTS/SIGN 158, 2019), with NRAD 2014, GINA 2024 and BNF inhaler prescribing. Diagnosis, chronic management and the acute attack are merged on this page; there is no separate acute-asthma pathway to cross-check. Children aged 5\u201311 follow a different ladder \u2014 see the paediatric asthma protocol. Verify all doses against the current BNF before prescribing."
});
