  stemSub:"One page for the shared-care role. Parkinson's regimens are <b>precisely timed and must never be stopped abruptly or delayed</b> — missed doses cause severe immobility and a dangerous NMS-like state, and hospital and care-home admissions are where this goes wrong. Beyond that: manage the <b>non-motor</b> burden that actually drives disability, know the <b>dopamine-blocking drugs that must be avoided</b>, ask directly about impulse-control disorders, and exclude reversible causes before accepting that deterioration is progression.",

  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ On time, every time — and never stop abruptly", html:"Parkinson's regimens are precisely timed. Ensure medication is given on time, including in hospital and care settings — dispense, do not omit. Abrupt withdrawal risks acute akinesia and a neuroleptic-malignant-like syndrome. A patient who cannot swallow or keep down their tablets is an urgent problem, not one that waits for the morning round."},
    {tone:"red", h:"⛔ Avoid dopamine-blocking drugs", html:"Metoclopramide, prochlorperazine, haloperidol and typical antipsychotics all worsen Parkinson's. Use domperidone for nausea, and quetiapine or clozapine if an antipsychotic is genuinely needed. This is the commonest iatrogenic deterioration in Parkinson's, and it usually arrives via an out-of-hours prescription for vomiting."},
    {tone:"blue", h:"The diagnosis and the motor drugs are specialist-led", html:"Diagnosis is specialist-made (bradykinesia plus rigidity or tremor); the GP does not initiate anti-parkinsonian drugs. Levodopa is the mainstay, alongside dopamine agonists, MAO-B inhibitors and COMT inhibitors — all specialist-tuned. The GP role is on-time medication, non-motor symptoms, comorbidity, MDT coordination and anticipatory care."},
    {tone:"green", h:"Non-motor symptoms are where primary care adds most", html:"Constipation (laxatives), orthostatic hypotension, depression, REM-sleep behaviour disorder, urinary symptoms, drooling and pain. These drive quality of life and disability at least as much as the motor symptoms, and they are squarely a GP job — the specialist clinic rarely has time for them."},
    {tone:"amber", h:"Ask directly about impulse-control disorders", html:"Dopamine agonists can cause urges to gamble, shop, eat or engage in hypersexual behaviour — and patients almost never volunteer it. <b>Ask at every review, and ask the family too.</b> The consequences are often financial and marital before they are medical, and the treatment is a specialist regimen change."},
    {tone:"amber", h:"Deterioration is not automatically progression", html:"Before accepting decline: check the doses are actually being taken on time, look for a newly started dopamine antagonist, and exclude intercurrent illness, dehydration, constipation and delirium. Three of the five commonest causes of \"worsening Parkinson's\" are reversible and iatrogenic."}

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 74-year-old man with Parkinson's on <b>co-careldopa four times daily</b> was admitted to a care home two weeks ago after a fall. His wife reports he is <b>much stiffer and barely walking</b>, and was <b>vomiting last week</b> — the out-of-hours doctor prescribed <b>metoclopramide</b>. The home gives his tablets \"with the medication round, morning and teatime\". He has also started <b>gambling online</b>, which his wife has just discovered; he is on a <b>dopamine agonist</b> as well."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"<b>Identifies TWO iatrogenic causes before considering progression</b>: the care home has collapsed a four-times-daily regimen into two medication rounds, and metoclopramide is a dopamine antagonist that must be stopped and replaced with domperidone; <b>corrects the timing with the home explicitly and in writing</b>, explaining that PD doses are patient-timed, not round-timed; recognises the gambling as an impulse-control disorder caused by the dopamine agonist, does not treat it as a moral matter, and refers to the specialist for a regimen change rather than stopping the agonist abruptly; <b>excludes intercurrent illness, dehydration and constipation</b>; <b>checks swallow given the vomiting and immobility</b>, with SALT referral if any concern; <b>assesses falls risk and the wife's strain</b>; and <b>safety-nets the NMS-like presentation</b> and the inability to take medication."}
     ]}]},

  foot:"Parkinson's disease — NICE NG71 and NICE. Diagnosis and motor-drug adjustment are specialist-led; the GP protects the regimen and manages the non-motor burden. Medication must be given on time, every time, including in hospital and care homes, and must never be stopped abruptly — acute akinesia and a neuroleptic-malignant-like syndrome follow. Avoid metoclopramide, prochlorperazine, haloperidol and typical antipsychotics: use domperidone for nausea and quetiapine or clozapine for psychosis. Ask directly about impulse-control disorders on dopamine agonists. Before accepting deterioration as progression, check timing, offending drugs and intercurrent illness. Verify all doses against the current BNF before prescribing."
