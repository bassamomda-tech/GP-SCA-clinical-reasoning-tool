MG.render({
  icon:"🧠",
  title:"Parkinson's disease — the complete guide",
  eyebrow:"Protocol · NICE NG71 · shared care · on time, every time",
  stemTitle:"The specialist leads diagnosis and medication changes; primary care coordinates shared care, picks up the non-motor burden early, and makes certain doses are given at the individually prescribed times",
  stemSub:"One page for the shared-care role. Parkinson's medicines must be given at the <b>individually prescribed times and must never be stopped abruptly or delayed</b> — missed doses cause severe immobility and a dangerous NMS-like state, and hospital and care-home admissions are where this goes wrong. Beyond that: identify and initiate management of the <b>non-motor</b> burden within the shared-care plan, with specialist or MDT input for refractory, complex or treatment-related symptoms; know the <b>dopamine-blocking drugs that must be avoided</b>; ask directly about impulse-control disorders and daytime sleepiness; and exclude reversible causes, including delirium, before accepting that deterioration is progression.",
  guideline:"NICE NG71 (2017) · MHRA Drug Safety Update (August 2013; May 2014; apomorphine with domperidone) · SPS swallowing guidance · DVLA",
  reviewed:"14 September 2026",
  nextReview:"14 March 2027",
  meta:[
    {t:"NICE NG71 (2017) — Parkinson's disease in adults"},
    {t:"Never stop or delay PD medication — NMS-like risk", tone:"tw"},
    {t:"Avoid metoclopramide, prochlorperazine, haloperidol", tone:"tw"},
    {t:"v2.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#foundation"><b>Shared care</b><small>Who does what</small></a><a href="#mdt"><b>MDT</b><small>Physio · SALT · OT</small></a><a href="#meds"><b>Medication</b><small>On time · avoid</small></a><a href="#monitor"><b>Review</b><small>Motor · non-motor</small></a><a href="#decline"><b>Worse?</b><small>Check first</small></a></div>',
  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ On time, every time — and never stop abruptly", html:"Administer each Parkinson's medicine at the individually prescribed time. In hospital and care homes, doses should not be delayed or omitted because of routine drug rounds; some patients need administration within minutes of the prescribed time, and self-administration may be appropriate where safe. Do not delay doses to fit around meals — follow the product instructions on levodopa and protein, but correct timing takes priority. Abrupt withdrawal risks acute akinesia and a neuroleptic-malignant-like syndrome. If a patient cannot swallow or absorb their medication, contact the Parkinson's team or acute medical service urgently the same day — a change in swallow status needs urgent medication review, and modified-release tablets must not be crushed unless the product information permits it."},
    {tone:"red", h:"⛔ Avoid dopamine-blocking drugs", html:"Metoclopramide, prochlorperazine, haloperidol and typical antipsychotics all worsen Parkinson's. Olanzapine and risperidone are also avoided unless specialist-directed. Domperidone may be used for nausea because it has limited CNS penetration, but only for nausea and vomiting, at the lowest effective dose (generally up to 10 mg three times daily) for the shortest duration (usually no more than 1 week), after checking the MHRA contraindications — QT prolongation, significant cardiac disease, severe hepatic impairment, electrolyte disturbance, QT-prolonging medicines and potent CYP3A4 inhibitors; consider an ECG in higher-risk patients. Long-term domperidone is not routine primary-care treatment. For psychosis, assess reversible causes first and seek specialist advice before any antipsychotic. This is a common iatrogenic deterioration in Parkinson's, and it usually arrives via an out-of-hours prescription for vomiting."},
    {tone:"blue", h:"Diagnosis and initial treatment are specialist-led", html:"Diagnosis (bradykinesia plus rigidity or tremor) and initial treatment selection should be specialist-led. Primary care continues and monitors treatment under the agreed shared-care plan. Dose changes to dopaminergic therapy should generally be made with Parkinson's specialist advice — especially levodopa adjustments, dopamine agonist reduction, MAO-B and COMT inhibitors, rotigotine, apomorphine and intestinal or subcutaneous infusion therapies. The GP role is timely medication, identifying non-motor symptoms, comorbidity, MDT coordination and anticipatory care."},
    {tone:"green", h:"Non-motor symptoms are where primary care adds most", html:"Constipation (laxatives), orthostatic hypotension, depression, REM-sleep behaviour disorder, urinary symptoms, drooling and pain. These drive quality of life and disability at least as much as the motor symptoms. Primary care should identify and initiate appropriate management within the shared-care plan, with specialist or MDT input for refractory, complex or treatment-related symptoms."},
    {tone:"amber", h:"Ask directly about impulse-control disorders", html:"Ask about gambling, excessive spending, compulsive shopping, binge eating, hypersexuality and other repetitive behaviours in anyone taking dopaminergic therapy; risk is particularly high with dopamine agonists, and patients may conceal it. <b>Ask privately at every review and, with consent, involve family or carers.</b> If present, assess financial, safeguarding and relationship consequences, do not stop the agonist abruptly, and contact the Parkinson's specialist — reduction is usually gradual, with monitoring for dopamine-agonist withdrawal symptoms."},
    {tone:"amber", h:"Deterioration is not automatically progression", html:"Before accepting decline: check the doses are actually being taken on time, look for a newly started dopamine antagonist or anticholinergic, and exclude infection, constipation or urinary retention, dehydration, pain, sleep deprivation, hypoxia, metabolic disturbance and delirium. New hallucinations or cognitive fluctuation should prompt a general medical assessment. Several of the commonest causes of \"worsening Parkinson's\" are reversible and iatrogenic."}
  ],
  pathwaySub:"Five steps, and the medication rule underpins all of them.",
  pathway:[
    {title:"Understand the shared-care setup", html:"Specialist leads diagnosis, initial treatment and dose changes; primary care continues and monitors treatment under the shared-care plan, covering timing, non-motor symptoms, comorbidity and coordination.", alert:true},
    {title:"Put the MDT in place", html:"Physiotherapy, SALT (speech AND swallow), dietitian, OT, PD specialist nurse, carer support."},
    {title:"Protect the regimen and manage the non-motor burden", html:"At the individually prescribed times; never stop abruptly; avoid dopamine blockers; identify and start management of constipation, postural hypotension, mood and sleep, with specialist or MDT input when complex."},
    {title:"Review motor, non-motor and safety", html:"Including direct questions about impulse-control disorders on any dopaminergic therapy, and about daytime sleepiness, sudden sleep onset and driving."},
    {title:"On deterioration, exclude the reversible causes first", html:"Timing, offending drugs, intercurrent illness and delirium — then liaise with the specialist."}
  ],
  sections:[

    {id:"foundation", nav:"Shared care", title:"Step 1 — the shared-care setup",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>Diagnosis</b>","Specialist-made (bradykinesia plus rigidity or tremor). Diagnosis and initial treatment selection should be specialist-led; primary care continues and monitors treatment under the agreed shared-care plan"],
         ["<b>Drug classes</b>","Levodopa (mainstay), dopamine agonists (including rotigotine), MAO-B inhibitors, COMT inhibitors, apomorphine, and intestinal or subcutaneous infusion therapies — dose changes should generally be made with Parkinson's specialist advice"],
         ["<b>GP role</b>","Timely medication, identifying and initiating management of non-motor symptoms, comorbidity, MDT coordination, anticipatory care. Complex non-motor symptoms, psychosis, impulse-control disorders, severe autonomic dysfunction, advanced therapies and medication changes require Parkinson's specialist involvement"],
         ["<b>Assess</b>","Motor fluctuations, falls, cognition and mood, swallow, autonomic symptoms, carer needs"]
       ]},
       {b:"why", html:"Parkinson's drug regimens are precisely timed and must never be stopped abruptly or delayed — missed doses cause severe immobility and a dangerous NMS-like state. Primary care coordinates and initiates appropriate shared-care management of the non-motor burden (mood, constipation, falls, sleep, autonomic symptoms), drawing on the Parkinson's specialist nurse, movement-disorder neurologist, physiotherapy, OT, SALT, dietetics, continence and falls services, neuropsychology and palliative care, while the specialist leads medication changes."}
     ]},

    {id:"mdt", nav:"MDT", title:"Step 2 — multidisciplinary and lifestyle support",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"🏃 Physiotherapy", html:"<b>For balance, gait, falls prevention and mobility.</b>"},
         {tone:"amber", h:"🗣️ Speech and language therapy", html:"<b>For speech and — importantly — swallowing and aspiration risk.</b> Aspiration pneumonia is a leading cause of death in Parkinson's. Any coughing or choking with food or drink, wet/gurgly voice, recurrent chest infections, weight loss, drooling or prolonged mealtimes requires prompt SALT assessment. Advise aspiration precautions and oral care, review the medication administration route, and arrange urgent review for recurrent aspiration or pneumonia. Do not alter or crush Parkinson's medicines without checking formulation-specific advice."},
         {tone:"blue", h:"🍽️ Dietitian and OT", html:"Dietitian referral for weight loss and nutrition (including constipation), and occupational therapy for function and home safety."},
         {tone:"green", h:"🚶 Exercise", html:"<b>Regular exercise improves mobility and wellbeing</b> and is one of the few things with disease-level benefit."},
         {tone:"green", h:"🫂 PD nurse and carer", html:"<b>Parkinson's specialist nurse, carer support, advance care planning.</b>"},
         {tone:"green", h:"😴 Sleep and mood", html:"Address sleep disturbance, low mood and apathy — major quality-of-life factors that are easily attributed to the disease and left untreated."}
       ]}
     ]},

    {id:"meds", nav:"Medication", title:"Step 3 — support the regimen, manage the non-motor symptoms",
     blocks:[
       {b:"table", head:["Rule","Detail"], rows:[
         ["<b>At the prescribed time, every time</b>","Administer each Parkinson's medicine at the individually prescribed time. In hospital and care homes, doses should not be delayed or omitted because of routine drug rounds; some patients need administration within minutes of the prescribed time, and self-administration may be appropriate where safe. Do not delay doses to fit around meals — follow product instructions on levodopa and protein intake, but correct timing takes priority"],
         ["<b>Swallow change or unable to take orally</b>","Urgent same-day medication review with the Parkinson's team or acute medical service. Modified-release tablets must not be crushed unless the product information permits it. Alternatives (dispersible levodopa, nasogastric administration, rotigotine patch, apomorphine or other specialist-led routes) depend on the regimen, duration of missed treatment, swallowing safety and specialist advice — do not independently substitute a dopamine agonist patch for levodopa"],
         ["<b>Never stop abruptly</b>","Abrupt withdrawal risks acute akinesia and a neuroleptic-malignant-like syndrome"],
         ["<b>Non-motor symptoms — shared care</b>","Primary care identifies and initiates appropriate management within the shared-care plan, with specialist or MDT input for refractory, complex or treatment-related symptoms: constipation, orthostatic hypotension, depression, REM-sleep behaviour disorder, urinary symptoms, drooling, pain"],
         ["<b>Constipation</b>","Exclude bowel obstruction or impaction; review fluid intake, mobility and constipating medicines; use an appropriate laxative; consider swallowing and autonomic dysfunction"],
         ["<b>Orthostatic hypotension</b>","Measure lying and standing BP; review antihypertensives, diuretics and dopaminergic treatment; check hydration; assess supine hypertension. Midodrine or fludrocortisone should generally be specialist-led because of supine hypertension and cardiac risks"],
         ["<b>Drooling</b>","Do not rely solely on anticholinergic medicines, particularly in older patients or those with cognitive impairment. Consider speech and language therapy, glycopyrronium or another locally agreed treatment, or botulinum toxin through specialist services"],
         ["<b>REM-sleep behaviour disorder</b>","Assess injury risk to the patient and bed partner; review medication and other sleep disorders; specialist advice may be required for melatonin or clonazepam"],
         ["<b>Depression and cognition</b>","Screen and treat, but assess for delirium, medication adverse effects, dementia with Lewy bodies, hallucinations, capacity and driving risk, and drug interactions"],
         ["<b>Daytime sleepiness and sudden sleep onset</b>","Ask at reviews, particularly with dopamine agonists. Advise the person not to drive or undertake hazardous work if affected and to inform DVLA where required. Seek specialist advice before changing the regimen"],
         ["<b>Nausea — domperidone</b>","Only for nausea and vomiting; lowest effective dose (generally up to 10 mg three times daily in adults) for the shortest duration, usually no more than 1 week. Avoid in QT prolongation, significant cardiac disease, severe hepatic impairment, electrolyte disturbance, or with QT-prolonging medicines or potent CYP3A4 inhibitors; consider ECG assessment in higher-risk patients. Specific MHRA cardiac and ECG advice applies with apomorphine"],
         ["<b>Psychosis and hallucinations</b>","First assess for delirium, infection, dehydration, medication changes and metabolic disturbance. If symptoms are mild and tolerated, medication may not be required. Reduce or adjust Parkinson's medicines only with specialist advice. If treatment is needed, seek Parkinson's specialist advice: quetiapine may be considered; clozapine is specialist-led and requires blood-count monitoring. Avoid haloperidol, olanzapine, risperidone, most typical antipsychotics and other dopamine-blocking agents unless specifically approved by the specialist team"]
       ]},
       {b:"warn", html:"<b>Avoid dopamine-blocking drugs</b> — metoclopramide, prochlorperazine, haloperidol and typical antipsychotics all worsen Parkinson's. Olanzapine and risperidone only if specialist-directed. <b>Domperidone may be used for nausea only after checking cardiac risk, QT-prolonging medicines, CYP3A4 inhibitors and the current MHRA dose/duration restrictions.</b> <b>For psychosis, assess for delirium and reversible causes, do not automatically treat tolerated hallucinations, and seek specialist advice before reducing Parkinson's medicines or prescribing antipsychotics.</b> <b>Watch for impulse-control disorders with any dopaminergic therapy, especially dopamine agonists, and for daytime sleepiness and sudden sleep onset.</b> <b>Never abruptly stop Parkinson's medication.</b>"}
     ]},

    {id:"monitor", nav:"Review", title:"Step 4 — monitoring motor, non-motor and safety",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["<b>Motor fluctuations</b>","<b>Each review</b>","<b>\"Wearing off\" or dyskinesia → specialist for regimen adjustment</b>"],
         ["<b>Falls and mobility</b>","<b>Each review</b>","<b>Physiotherapy, home safety, medication review</b>"],
         ["<b>Mood, cognition, psychosis</b>","<b>Each review</b>","<b>Treat depression; assess delirium and reversible causes; specialist advice for hallucinations</b>"],
         ["<b>Autonomic symptoms and constipation</b>","<b>Each review</b>","Manage postural blood pressure, bowels, bladder, swallow and aspiration risk"],
         ["<b>Impulse-control disorder</b>","<b>Each review, on any dopaminergic therapy (highest risk with agonists)</b>","<b>Ask privately — and, with consent, ask family or carers. Assess financial, safeguarding and relationship consequences; do not stop the agonist abruptly; liaise with the specialist (gradual reduction, watch for agonist withdrawal; specialist CBT if persistent)</b>"],
         ["<b>Sleepiness and driving</b>","<b>Each review</b>","<b>Ask about daytime sleepiness and sudden sleep onset. Driving advice is required when there is sudden sleep onset, severe daytime sleepiness, disabling dyskinesia, disabling dizziness or syncope, cognitive impairment, hallucinations, impulse-control behaviours, sedating medicines or other symptoms likely to impair safe vehicle control — check current DVLA guidance and document the advice</b>"]
       ]},
       {b:"dl", rows:[
         ["<b>Regular shared-care reviews</b>","Holistic review: motor and non-motor symptoms, falls, mood, swallow, carer needs, medication timing"],
         ["<b>On change</b>","Motor fluctuations, psychosis or new disability → specialist or PD nurse"],
         ["<b>Advancing disease</b>","Palliative and anticipatory planning, swallow and aspiration, place of care"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 Can't take medication", html:"\"If you cannot swallow or keep down your Parkinson's tablets — because of illness or surgery — contact us or your Parkinson's team urgently the same day. Doses must not be missed.\""},
         {tone:"red", h:"🔴 NMS-like state", html:"\"High fever, severe stiffness, confusion and sweating — especially if medication has been stopped — call 999.\""},
         {tone:"amber", h:"🎲 Impulse control", html:"\"Some of these medicines can cause urges to gamble, spend, shop, eat or other compulsions — tell us, or ask your family to tell us, if you notice it. Do not stop your tablets suddenly.\""},
{tone:"amber", h:"🚗 Sleepiness and driving", html:"\"If you feel very sleepy in the day or fall asleep suddenly, do not drive or do hazardous work, tell us, and check whether you need to inform the DVLA.\""},
         {tone:"amber", h:"💊 Avoid certain drugs", html:"\"Some anti-sickness and sedative drugs make Parkinson's worse — always check with us before starting a new medicine.\""}
       ]}
     ]},

    {id:"decline", nav:"Worse?", title:"Deteriorating? Check before assuming progression",
     sub:"Exclude reversible and iatrogenic causes before attributing decline to the disease.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"1 · Medication timing", html:"Are doses being taken on time and not omitted — especially in hospital or a care home?"},
         {tone:"red", h:"2 · Offending drugs", html:"A newly started dopamine antagonist — an anti-emetic or antipsychotic — or an anticholinergic worsening symptoms?"},
         {tone:"amber", h:"3 · Intercurrent illness", html:"Infection, constipation or urinary retention, dehydration, pain, sleep deprivation, hypoxia or metabolic disturbance causing acute deterioration or delirium? New hallucinations or cognitive fluctuation need a general medical assessment."},
         {tone:"blue", h:"4 · Non-motor", html:"<b>Mood, sleep or autonomic symptoms driving the disability?</b>"},
         {tone:"green", h:"5 · Specialist", html:"<b>Motor fluctuations or psychosis → specialist for a regimen change.</b>"}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"When to refer or liaise",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Emergency — admission", html:"Acute severe rigidity or akinesia, hyperthermia, confusion, autonomic instability or markedly raised CK after missed Parkinson's medication is a medical emergency. Admit urgently, restore dopaminergic therapy under specialist/acute medical guidance and investigate for infection, dehydration, rhabdomyolysis and other triggers."},
{tone:"red", h:"Urgent same-day — unable to take medication", html:"If a patient cannot swallow or absorb Parkinson's medication, contact the Parkinson's team or acute medical service urgently the same day; arrange emergency admission if there is acute akinesia, fever, severe rigidity, confusion, autonomic instability or suspected neuroleptic-malignant-like syndrome."},
         {tone:"amber", h:"Motor fluctuations", html:"Wearing-off, dyskinesia or freezing → neurology or the PD service for a regimen change."},
         {tone:"amber", h:"Psychosis or dementia", html:"Hallucinations or cognitive decline → assess for delirium and reversible causes first, then specialist advice before reducing Parkinson's medicines or choosing an antipsychotic. See <a href='dementia.html'>dementia</a>."},
         {tone:"blue", h:"Advanced therapies", html:"<b>For apomorphine, intestinal gel, or deep brain stimulation assessment.</b>"},
         {tone:"green", h:"PD specialist nurse", html:"The most useful single point of contact for timing problems, non-motor symptoms and carer support."},
{tone:"amber", h:"Impulse control, autonomic or complex non-motor", html:"Impulse-control disorders, severe autonomic dysfunction, refractory non-motor symptoms or any dopaminergic dose change → Parkinson's specialist; involve physiotherapy, OT, SALT, dietetics, continence, falls, neuropsychology or palliative care as needed."},
         {tone:"cream", h:"GP management", html:"Protecting the medication timing, identifying and initiating shared-care management of non-motor symptoms, avoiding dopamine blockers, sleepiness and driving advice, MDT coordination, impulse-control screening, falls and anticipatory care all belong here. Related pages: <a href='dementia.html'>dementia</a> · <a href='depression.html'>depression</a> · <a href='constipation-adult.html'>constipation</a> · <a href='malnutrition.html'>malnutrition</a> · <a href='essential-tremor.html'>essential tremor</a>."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 74-year-old man with Parkinson's on <b>co-careldopa four times daily</b> was admitted to a care home two weeks ago after a fall. His wife reports he is <b>much stiffer and barely walking</b>, and was <b>vomiting last week</b> — the out-of-hours doctor prescribed <b>metoclopramide</b>. The home gives his tablets \"with the medication round, morning and teatime\". He has also started <b>gambling online</b>, which his wife has just discovered; he is on a <b>dopamine agonist</b> as well."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"<b>Identifies TWO iatrogenic causes before considering progression</b>: the care home has collapsed a four-times-daily regimen into two medication rounds, and metoclopramide is a dopamine antagonist that must be stopped, with domperidone used only short term after checking cardiac risk, QT-prolonging medicines and CYP3A4 inhibitors; <b>corrects the timing with the home explicitly and in writing</b>, explaining that PD doses are patient-timed, not round-timed; recognises the gambling as an impulse-control disorder linked to dopaminergic therapy (particularly the agonist), does not treat it as a moral matter, assesses financial and safeguarding consequences, and refers to the specialist for a gradual regimen change rather than stopping the agonist abruptly; asks about daytime sleepiness and driving; <b>excludes intercurrent illness, dehydration, constipation and delirium</b>; <b>checks swallow given the vomiting and immobility</b>, with SALT referral if any concern; <b>assesses falls risk and the wife's strain</b>; and <b>safety-nets the NMS-like presentation</b> and the inability to take medication."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG71 — Parkinson\u2019s disease in adults</b><br><a href="https://www.nice.org.uk/guidance/ng71" rel="noopener">nice.org.uk/guidance/ng71</a><span class="rd"> — specialist diagnosis and drug initiation, levodopa as the mainstay, the multidisciplinary referrals (physiotherapy, SALT, OT, dietitian), assess reversible causes, do not treat well-tolerated hallucinations, then quetiapine or (specialist-led, with blood monitoring) clozapine for Parkinson\u2019s disease psychosis, the requirement to discuss impulse-control disorders with any dopaminergic therapy (higher risk with dopamine agonists), and advising people with sudden sleep onset not to drive and to inform the DVLA</span></li>'+
         '<li><b>NICE NG71 \u2014 Parkinson’s disease in adults</b><br><a href="https://www.nice.org.uk/guidance/ng71" rel="noopener">nice.org.uk/guidance/ng71</a><span class="rd"> — giving medicines at patient-specific times in hospital and care homes and the risks of abrupt withdrawal or failed absorption, the dopamine-blocking drugs to avoid with domperidone as the safer anti-emetic, the non-motor symptom set, and the review structure</span></li>'+
         '<li><b>Parkinson\u2019s UK — Get It On Time campaign</b><br><a href="https://www.parkinsons.org.uk" rel="noopener">parkinsons.org.uk</a><span class="rd"> — the evidence behind timed dosing in hospital and care-home settings, where collapsing a regimen into medication rounds causes avoidable deterioration</span></li>'+
         '<li><b>MHRA Drug Safety Update: metoclopramide (August 2013) and domperidone (May 2014)</b><br><a href="https://www.gov.uk/drug-safety-update" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> — metoclopramide use restrictions and extrapyramidal effects; domperidone cardiac risk, lowest dose for the shortest time</span></li>'+
         '<li><b>MHRA Drug Safety Update — Domperidone: risks of cardiac side effects (May 2014)</b><br><a href="https://www.gov.uk/drug-safety-update/domperidone-risks-of-cardiac-side-effects" rel="noopener">gov.uk — Drug Safety Update</a><span class="rd"> — nausea and vomiting only; usually up to 10 mg three times daily; usually no more than 1 week; contraindications in cardiac and severe hepatic disease and with QT-prolonging medicines or potent CYP3A4 inhibitors</span></li>'+
         '<li><b>MHRA Drug Safety Update — Apomorphine with domperidone: minimising risk of cardiac side effects</b><br><a href="https://www.gov.uk/drug-safety-update/apomorphine-with-domperidone-minimising-risk-of-cardiac-side-effects" rel="noopener">gov.uk — Drug Safety Update</a><span class="rd"> — cardiac risk assessment and ECG monitoring when domperidone is used with apomorphine</span></li>'+
         '<li><b>SPS — Parkinson disease medicines in swallowing difficulties</b><br><a href="https://www.sps.nhs.uk/" rel="noopener">sps.nhs.uk</a><span class="rd"> — urgent medication review when swallow changes; modified-release tablets not to be crushed unless the product information permits</span></li>'+
         '<li><b>DVLA — Assessing fitness to drive: a guide for medical professionals</b><br><a href="https://www.gov.uk/government/publications/assessing-fitness-to-drive-a-guide-for-medical-professionals" rel="noopener">gov.uk — assessing fitness to drive</a><span class="rd"> — driving advice for sudden sleep onset, cognitive impairment and other symptoms that impair safe vehicle control</span></li>'+
         '<li><b>Summaries of Product Characteristics for dopamine agonists (emc)</b><span class="rd"> — impulse-control disorders as a listed warning</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Parkinson's disease — NICE NG71 (2017). Diagnosis, initial treatment and dopaminergic dose changes are specialist-led; primary care continues and monitors treatment under the shared-care plan, protects the regimen, and identifies and initiates management of non-motor symptoms with specialist or MDT input when complex. Medication must be given at the individually prescribed times, including in hospital and care homes, and must never be stopped abruptly — acute akinesia and a neuroleptic-malignant-like syndrome can follow; inability to swallow needs same-day review with the Parkinson's team, and emergency admission if NMS-like features are present. Avoid metoclopramide, prochlorperazine, haloperidol and typical antipsychotics (olanzapine and risperidone only if specialist-directed); domperidone may be used for nausea within MHRA dose, duration and cardiac restrictions; for psychosis, assess reversible causes and seek specialist advice (quetiapine may be considered; clozapine is specialist-led). Ask directly about impulse-control disorders on any dopaminergic therapy and about daytime sleepiness and driving. Before accepting deterioration as progression, check timing, offending drugs, intercurrent illness and delirium. Verify all doses against the current BNF before prescribing."
});
