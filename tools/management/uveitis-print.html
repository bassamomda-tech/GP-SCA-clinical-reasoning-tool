  eyebrow:"Protocol · adults and children · GP recognition card",
  stemTitle:"A painful, photophobic red eye suggesting acute anterior uveitis needs same-day ophthalmology — but posterior, chronic and JIA-associated uveitis may have little pain or redness",
  stemSub:"<b>The GP role in uveitis is recognition and urgent referral.</b> Suspected acute anterior uveitis — eye pain, redness, photophobia or blurred vision — needs immediate, same-day ophthalmological assessment (NICE NG65). Intermediate, posterior and panuveitis may present with floaters, flashes, blurred vision, field loss or distortion, with variable redness. Diagnosis needs a slit lamp; treatment is ophthalmology-led. <b>Do not start ocular steroids in primary care</b>, do not delay referral for blood tests, and do not request an indiscriminate uveitis screen.",
  guideline:"NICE NG65 · College of Optometrists CMG — anterior uveitis · RCOphth JIA uveitis screening guideline (2006)",
  reviewed:"25 September 2026",
  nextReview:"25 September 2027",
  meta:[
    {t:"Same-day ophthalmology", tone:"tw"},
    {t:"No steroids before an eye examination", tone:"tw"},
    {t:"v2.1 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#recognise"><b>Recognise</b><small>And its mimics</small></a><a href="#systemic"><b>Systemic</b><small>Guided, not a panel</small></a><a href="#jia"><b>JIA</b><small>Often painless</small></a><a href="#gprole"><b>GP role</b><small>Bounded</small></a><a href="#refer"><b>Refer</b><small>Same day</small></a></div>',
  quickSub:"The five that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Suspected acute anterior uveitis → same day", html:"Deep eye pain · redness, especially around the cornea (ciliary flush) · photophobia, including consensual · blurred vision · watering · small or irregular pupil. Usually progressive over hours to days; not every feature is present → <b>immediate, same-day ophthalmological assessment</b> (NICE NG65)."},
    {tone:"red", h:"⚠ Posterior, intermediate or panuveitis", html:"New floaters, flashes, blurred or reduced vision, field loss or distortion, with variable redness and pain → urgent ophthalmology through the local pathway (eye casualty, ED or urgent eye service). Do not delay for primary-care investigations."},
    {tone:"red", h:"⚠ No ocular steroids in primary care", html:"Not for a new episode, and not for known uveitis unless the patient has a written ophthalmology flare plan. Steroids can mask or worsen herpetic, fungal, bacterial or acanthamoeba keratitis; intraocular pressure must be assessed first."},
    {tone:"amber", h:"JIA-associated uveitis is often painless", html:"It can precede the arthritis and stay silent until complications develop. Make sure children with JIA are in a slit-lamp screening programme and that missed appointments are followed up."},
    {tone:"blue", h:"Systemic assessment is guided, not a panel", html:"After urgent eye assessment, ask about back pain, arthritis, psoriasis, bowel, skin, mouth and chest symptoms, infection and travel. HLA-B27 testing follows the NICE NG65 pathway; a negative HLA-B27 or normal CRP/ESR does not exclude spondyloarthritis."}
  ],
  pathwaySub:"Five steps.",
  pathway:[
    {title:"Recognise and check the eye", html:"Visual acuity in each eye, pupils, pattern of redness, cornea, contact-lens use, posterior symptoms.", alert:true},
    {title:"Refer the same day", html:"Local urgent eye pathway; no steroids first; no blood tests first."},
    {title:"Supportive advice while waiting", html:"Dark glasses, simple analgesia, no patching, contact lenses out, no driving if vision is impaired."},
    {title:"Systemic questions, guided by the eye findings", html:"NICE NG65 pathway for HLA-B27 and rheumatology; other specialties per symptoms."},

  ],
  sections:[

    {id:"recognise", nav:"Recognise", title:"Step 1 — recognise uveitis and its mimics",

         ["<b>Check</b>","Visual acuity in each eye · pupil size and reaction · pattern of conjunctival injection · corneal appearance · pain and photophobia, including consensual · contact-lens use · recent trauma, surgery or intraocular procedure · new floaters, flashes or field loss · systemic symptoms"],
         ["<b>Fluorescein</b>","Useful if corneal disease or a foreign body is suspected — but it must not delay referral"],
         ["<b>Specialist only</b>","Slit-lamp examination, intraocular pressure and dilated fundus examination. Uveitis cannot be excluded in primary care"]
       ]},
       {b:"table", head:["Picture","Features","Action"], rows:[
         ["<b>Acute anterior uveitis</b>","Pain, photophobia, blurred vision, watering, ciliary flush, small or irregular pupil","Same-day ophthalmology"],
         ["<b>Chronic anterior uveitis</b>","Mild redness or blurred vision; may be painless","Urgent ophthalmology"],
         ["<b>Intermediate, posterior or panuveitis</b>","Floaters, flashes, blurred or reduced vision, field loss, distortion; redness and pain variable — panuveitis may be painful and red","Urgent ophthalmology per local pathway"],
         ["<b>Acute angle-closure glaucoma</b>","Severe eye pain, headache, nausea and vomiting, haloes, markedly reduced vision, fixed mid-dilated pupil, cloudy cornea","Emergency — same day"],
         ["<b>Microbial keratitis</b>","Painful red eye, often a contact-lens wearer, corneal opacity","Same day"],
         ["<b>Herpetic keratitis</b>","Unilateral red eye, dendritic lesion on fluorescein, previous cold sores","Same day"],
         ["<b>Scleritis</b>","Severe boring pain that may wake the patient; deep redness; tender globe","Same day"]
       ]},
       {b:"why", html:"A small irregular pupil favours anterior uveitis, but pupil appearance alone cannot safely separate uveitis from angle closure."}
     ]},

    {id:"waiting", nav:"While waiting", title:"Step 2 — supportive advice while awaiting assessment",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"Comfort", html:"Dark glasses for photophobia and simple analgesia. Do not patch the eye. Leave contact lenses out until reviewed."},
         {tone:"amber", h:"Safety", html:"Do not drive with impaired vision. With severe pain, nausea or marked visual loss, the patient should not drive themselves to the eye unit."}
       ]}
     ]},

    {id:"systemic", nav:"Systemic", title:"Step 3 — systemic questions, guided by the eye findings",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Ask about", html:"Inflammatory back pain, peripheral arthritis, enthesitis and family history · psoriasis · inflammatory bowel disease · oral or genital ulceration or skin lesions (Behçet's) · respiratory, skin or neurological features (sarcoidosis) · infection, travel and immunosuppression."},
         {tone:"blue", h:"The NICE NG65 HLA-B27 pathway", html:"In anterior uveitis, ask about joint pain, or chronic low back pain that started before age 45 and has lasted more than 3 months. If either is present, check for psoriasis. If there is no psoriasis, HLA-B27 can be tested, with rheumatology referral if positive. <b>A negative HLA-B27, or a normal CRP or ESR, does not exclude spondyloarthritis.</b>"},
         {tone:"amber", h:"No indiscriminate uveitis screen", html:"Do not delay eye referral for blood tests. Investigation depends on age, granulomatous or non-granulomatous disease, laterality, recurrence, posterior involvement, immunosuppression, infection risk and the ophthalmology findings — so ACE, ANA, syphilis, TB and toxoplasma tests are arranged by ophthalmology or for a specific systemic presentation, not as a routine panel. A first, mild, unilateral, non-granulomatous episode with no systemic features may need no extensive tests."}
       ]}
     ]},

    {id:"specialist", nav:"Specialist care", title:"What ophthalmology does",
     blocks:[
       {b:"table", head:["Situation","Treatment","Notes"], rows:[
         ["<b>Anterior uveitis</b>","Topical corticosteroid plus a cycloplegic or mydriatic (e.g. cyclopentolate or atropine)","The steroid treats the inflammation; the cycloplegic relieves ciliary spasm, pain and photophobia and helps prevent or break posterior synechiae. Intensity and duration depend on anterior-chamber activity and complications"],
         ["<b>Intermediate, posterior or panuveitis</b>","Cause- and severity-dependent","May include targeted antimicrobial or antiviral treatment, periocular or intraocular steroid, systemic steroid, or steroid-sparing immunomodulation. Immunosuppression can be harmful if infection is untreated"],
         ["<b>Underlying disease</b>","Treat the systemic cause","Co-managed with the relevant specialty"]
       ]}
     ]},

     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"Screening", html:"Children with known or suspected JIA need paediatric rheumatology and ophthalmology involvement. Paediatric ophthalmology schedules slit-lamp screening by age at arthritis onset, JIA subtype, ANA status and local protocol (RCOphth). Most will already be under paediatric rheumatology — the GP's job is to check screening is in place and to chase missed appointments."},
         {tone:"red", h:"Symptomatic eye", html:"A red eye, photophobia, visual change or an abnormal pupil in a child with JIA → urgent ophthalmology."}
       ]}
     ]},

    {id:"gprole", nav:"GP role", title:"Step 5 — a bounded GP role in recurrent disease",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"Fast-track flares", html:"People with recurrent uveitis often recognise flares early. They should have a written ophthalmology flare plan where appropriate. Without one, do not restart ocular steroids in primary care — arrange urgent ophthalmic advice or assessment."},
         {tone:"blue", h:"Eye monitoring is ophthalmology's", html:"Visual acuity, intraocular pressure, cataract, synechiae, macular oedema and treatment response are monitored by ophthalmology — they cannot be reliably assessed in primary care."},
         {tone:"blue", h:"Shared-care monitoring", html:"GP monitoring of systemic corticosteroids, DMARDs or biologics only under an agreed local shared-care protocol. The initiating specialist keeps responsibility for disease activity and treatment decisions; GP monitoring does not replace ophthalmology follow-up. Seek specialist advice for abnormal results, infection, toxicity or ocular relapse."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral",
     blocks:[
       {b:"table", head:["When","Situation","Action"], rows:[
         ["<b>Same day</b>","Suspected acute anterior uveitis · any painful photophobic red eye with reduced vision · contact-lens-related painful red eye or suspected keratitis · suspected herpetic keratitis · acute angle-closure features · suspected scleritis · abnormal pupil or corneal opacity","Local urgent eye pathway — eye casualty, ED or urgent ophthalmology service"],
         ["<b>Urgent, per local timeframe</b>","New floaters or flashes with visual loss, field loss or distortion","Urgent ophthalmology — do not delay for investigations"],
         ["<b>Rheumatology</b>","Anterior uveitis with joint pain or chronic back pain from before age 45, HLA-B27 positive, no psoriasis","Per NICE NG65"],
         ["<b>Paediatric</b>","Child with JIA","Confirm ophthalmology screening; urgent ophthalmology if symptomatic"],
         ["<b>Other specialties</b>","Sarcoidosis, IBD, Behçet's, infection","Per the presentation"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"Safety-net", html:"\"If the pain, light sensitivity or blurred vision comes back, or you notice new floaters, flashes or a shadow in your vision, contact the eye team or us the same day.\""},
         {tone:"cream", h:"GP management", html:"Recognition, same-day referral and the guided systemic questions belong here. Related pages: <a href='ankylosing-spondylitis.html'>axial spondyloarthritis</a> · <a href='allergic-conjunctivitis.html'>allergic conjunctivitis</a> · <a href='dry-eye-disease.html'>dry eye disease</a>."}
       ]},
       {b:"say", html:"This looks like it could be uveitis — inflammation inside the eye. It needs to be seen by the eye team today, because untreated it can affect your sight. They'll examine the eye with a special microscope and usually start steroid and dilating drops. Please don't drive if your vision is blurred. If it keeps coming back, we'll also look for any linked condition elsewhere in the body."}
     ]},

     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 29-year-old man has a painful red right eye for two days, light sensitivity and blurred vision. He mentions years of morning back stiffness that eases with exercise. He asks for antibiotic drops, and says his mother still has 'steroid drops from her eye problem'."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Checks acuity and pupils; recognises suspected acute anterior uveitis and refers the same day; declines antibiotic drops and advises against using someone else's steroid drops; does not delay for bloods; links the back pain to possible axial spondyloarthritis and explains the NG65 pathway; advises no driving with blurred vision; safety-nets."}
     ]}]},

     blocks:[

         '<li><b>NICE NG65 — Spondyloarthritis in over 16s: diagnosis and management</b><br><a href="https://www.nice.org.uk/guidance/ng65" rel="noopener">nice.org.uk/guidance/ng65</a><span class="rd"> — same-day ophthalmological assessment for suspected acute anterior uveitis; HLA-B27 and rheumatology pathway; negative HLA-B27 and normal CRP/ESR do not exclude</span></li>'+
         '<li><b>College of Optometrists — Clinical Management Guideline: uveitis (anterior)</b><span class="rd"> — recognition and referral</span></li>'+

         '</ul></div>'}
     ]}
  ],
  foot:"Uveitis in primary care: recognition and urgent referral. Suspected acute anterior uveitis — eye pain, redness, photophobia or blurred vision — needs same-day ophthalmological assessment (NICE NG65). Floaters, flashes, visual or field loss or distortion: urgent ophthalmology. Posterior, chronic and JIA-associated uveitis may be painless. No ocular steroids in primary care without a written ophthalmology flare plan; no blood tests before referral; no indiscriminate uveitis screen. HLA-B27 per NICE NG65 — negative results do not exclude spondyloarthritis. Sources: NICE NG65, College of Optometrists CMG, RCOphth JIA guideline (2006)."
