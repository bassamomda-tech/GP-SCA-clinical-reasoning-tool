  stemSub:"One page for the whole condition. For adults in primary care; covers isolated iron deficiency as well as IDA (pregnancy, children, CKD/dialysis, known IBD or bariatric surgery, active bleeding and haematological disease have separate notes). Iron deficiency is always a finding, never a diagnosis: replacing iron without finding the source is the error that delays a cancer diagnosis.",

  lead:'<div class="mg-layers"><a href="#confirm"><b>Diagnosis</b><small>Ferritin + the three stages</small></a><a href="#cause"><b>Find the cause</b><small>The real work</small></a><a href="#ladder"><b>Replace iron</b><small>Oral \u2192 IV</small></a><a href="#refer"><b>Refer <span class="tw">Suspected cancer</span></b><small>NG12 thresholds</small></a></div>',
  quickSub:"If you read nothing else on this page, read these five cards. Every number traces to the recommendation cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"\u26a0 IDA in a man or post-menopausal woman is a red flag", html:"<b>NICE NG12 (updated April 2026): offer quantitative FIT to adults with iron-deficiency anaemia</b>, using the locally commissioned assay (and to anyone aged 60+ with anaemia even without iron deficiency); <b>FIT \u226510 \u00b5g Hb/g \u2192 suspected cancer pathway referral for colorectal cancer</b>. <b>A FIT below 10 \u00b5g Hb/g does not exclude colorectal cancer and must not override clinical concern.</b> Unexplained IDA in <b>any man</b> or <b>any post-menopausal woman</b> needs secondary-care consideration even with a negative FIT \u2014 follow the local NHS colorectal/IDA pathway on whether FIT-negative patients proceed directly to bidirectional endoscopy or to an urgent non-cancer gastroenterology pathway (BSG 2021; ACPGBI/BSG 2025). Colorectal cancer is found in about <b>5%</b> of primary-care IDA presentations. <span class='tw'>Suspected cancer</span>"},
    {tone:"amber", h:"Ferritin \u2014 interpret in context", html:"<b>&lt;15 \u00b5g/L</b> iron deficiency highly likely (absent/depleted stores) \u00b7 <b>15\u201330 \u00b5g/L</b> likely \u00b7 <b>30\u2013100 \u00b5g/L</b> interpret with CRP and clinical context \u00b7 <b>&gt;100 \u00b5g/L</b> does not exclude functional iron deficiency, particularly in CKD or inflammation \u00b7 <b>&gt;150 \u00b5g/L</b> absolute deficiency less likely, but interpret clinically. Ferritin is an <b>acute-phase reactant</b>: a normal or raised ferritin does not exclude iron deficiency in inflammation, infection, malignancy, liver disease, CKD or obesity. If inflamed and uncertain, consider transferrin saturation, reticulocyte Hb or % hypochromic red cells where available; <b>TSAT &lt;20%</b> can support iron-restricted erythropoiesis but should not be interpreted in isolation."},
    {tone:"blue", h:"Always ask: where is the iron going?", html:"Blood loss (menorrhagia, GI), malabsorption (<b>coeliac disease</b> \u2014 found in about 3\u20135% of patients with IDA), diet, or increased demand. <b>Anti-tTG IgA + total IgA</b> in confirmed unexplained IDA, while eating gluten."},
    {tone:"cream", h:"Replace, and keep going after the Hb normalises", html:"One standard ferrous salt tablet <b>once daily</b>; <b>alternate days</b> if not tolerated (BSG 2021) \u2014 a tolerability strategy, as evidence for equivalent Hb outcomes is less robust than the absorption studies suggest. Recheck <b>Hb at 2\u20134 weeks</b>, expect a rise of <b>10\u201320 g/L per month</b>. <b>Continue for 3 months after the Hb normalises</b> to refill stores."},
    {tone:"green", h:"Replace and investigate together", html:"Starting iron does <b>not</b> remove the need to find the source, and neither iron treatment nor anticoagulation is a reason to defer endoscopy. Do not delay treatment while investigations are arranged, except where oral iron may interfere with imminent colonoscopy preparation. There is no universal ferritin target \u2014 treatment is guided by Hb response, ongoing losses, symptoms and the underlying condition."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step is where patients come to harm \u2014 do not skip it.",
  pathway:[
    {title:"Confirm", html:"<b>Ferritin &lt;15 \u00b5g/L: iron deficiency highly likely; &lt;30 \u00b5g/L: likely</b> (interpret with the laboratory range and clinical context), and who the patient is decides how hard you hunt for a GI source. Microcytic hypochromic picture on FBC \u2014 but a normal MCV does not exclude it, and a normal ferritin does not exclude it in inflammation, infection, malignancy, liver disease, CKD or obesity."},
    {title:"Screen for danger", html:"Haemodynamic compromise, suspected active GI bleeding, severe symptomatic anaemia, chest pain, syncope or severe breathlessness, a very rapid Hb fall, or other clinical concern requiring hospital assessment \u2192 same-day assessment. Use clinical judgement rather than an isolated Hb threshold. Then apply the NG12 rules before anything else.", alert:true},
    {title:"Stratify by who the patient is", html:"Pre-menopausal woman \u2192 usually menstrual or dietary, but still screen GI symptoms. Man or post-menopausal woman \u2192 <b>GI loss until proven otherwise</b>. Any age with malabsorption features \u2192 coeliac, PPI, H. pylori, prior surgery."},
    {title:"Find the cause", html:"Coeliac serology in confirmed unexplained IDA; H. pylori testing with upper-GI symptoms, recurrent or refractory IDA, or IDA persisting after negative bidirectional endoscopy; urinalysis; menstrual and obstetric history; GI symptoms, bowel habit, dysphagia, melaena or rectal bleeding; medication review (NSAIDs, aspirin, anticoagulants, antiplatelets, PPIs); diet, blood donation and pica; coeliac disease, IBD, gastric or bariatric surgery; family history of colorectal, gastric or endometrial cancer."},
    {title:"Replace and close the loop", html:"Oral iron once daily (routine vitamin C not essential), alternate-day if intolerant, IV iron where indicated \u2192 recheck at 2\u20134 weeks \u2192 3 months past normalisation \u2192 confirm the cause was found and every investigation actioned."}
  ],
  sections:[

    {id:"confirm", nav:"Confirm", title:"Confirming iron deficiency", sub:"Three stages exist: depleted stores (low ferritin, normal Hb), iron-deficient erythropoiesis (low ferritin, low MCV), and iron-deficiency anaemia (all low, low Hb). All three matter.",
     blocks:[
       {b:"warn", html:"<b>Scope:</b> adults in primary care. Separate considerations apply to <b>pregnancy</b> (see In pregnancy below; follow local maternity guidance), <b>children</b> (follow paediatric guidance), <b>CKD/dialysis</b> (NICE NG203), <b>known IBD or bariatric surgery</b> (specialist/local pathways), <b>active bleeding</b> (same-day assessment) and <b>haematological disease</b> (haematology advice). <b>Document control:</b> this guide must be checked against the current NICE NG12, NICE HTG690, local NHS Greater Manchester colorectal/IDA pathway, current SPC and local IV-iron protocol before use."},
       {b:"table", head:["Ferritin","Interpretation","Action"], rows:[
         ["<b>&lt;15 \u00b5g/L</b>","Iron deficiency highly likely \u2014 absent/depleted stores","Treat and investigate the cause"],
         ["<b>15\u201330 \u00b5g/L</b>","Iron deficiency likely (interpret with the laboratory reference range and clinical context)","Treat and investigate the cause"],
         ["<b>30\u2013100 \u00b5g/L</b>","Interpret with CRP and clinical context","If inflammatory disease is present and the diagnosis is uncertain, consider transferrin saturation, reticulocyte Hb or % hypochromic red cells where available. TSAT &lt;20% can support iron-restricted erythropoiesis but should not be interpreted in isolation; there is no universal CRP cut-off"],
         ["<b>&gt;100 \u00b5g/L</b>","Does not exclude functional iron deficiency, particularly in CKD/inflammation","Interpret clinically; look for another cause of the anaemia if deficiency is not supported"],
         ["<b>&gt;150 \u00b5g/L</b>","Absolute iron deficiency less likely","Interpret clinically"]
       ]},
       {b:"dl", rows:[
         ["FBC in IDA","Microcytic (<b>MCV &lt;80 fL</b>), hypochromic. Low Hb: <b>&lt;130 g/L men, &lt;120 g/L women</b>; in pregnancy <b>&lt;110 g/L in the first trimester, &lt;105 g/L in the second and third trimesters, and &lt;100 g/L postpartum</b> (follow local maternity guidance). Low MCH (<b>&lt;27 pg</b>), high RDW (anisocytosis)"],
         ["Serum iron + TIBC","Low iron with high TIBC indicates deficiency, but it is less reliable than ferritin (diurnal variation, affected by recent intake) \u2014 use only when ferritin is equivocal, and <b>not routinely</b>"],
         ["Reticulocyte Hb content","<b>&lt;28 pg</b> is a functional iron-deficiency marker \u2014 useful in CKD where ferritin is raised by inflammation"],
         ["Isolated low ferritin, normal Hb","Iron depletion without anaemia. Assess for menstrual, dietary, pregnancy-related, blood-donation, medication and malabsorption causes, and treat if symptomatic (fatigue, restless legs, cognitive symptoms). Routine invasive GI investigation is not generally required in pre-menopausal women without additional concerning features; the threshold for GI investigation should be lower in men, post-menopausal women, older adults, those with GI symptoms, recurrent deficiency or a relevant family history. The NICE IDA referral rules do not automatically apply when Hb is normal"]
       ]},
       {b:"why", html:"Ferritin below 15 \u00b5g/L is highly specific for absent iron stores and values up to 30 \u00b5g/L may still be consistent with deficiency (BSH), but higher values can mislead: inflammation, infection, cancer and autoimmune disease all raise ferritin as an acute-phase protein, so a patient with active IBD and a cancer-related bleed may show a \u201cnormal\u201d ferritin of 50. So interpret ferritin with CRP and the clinical context rather than a rigid cut-off. BSG notes that ferritin below 45 \u00b5g/L may be a useful practical threshold when considering IDA investigation, particularly with inflammation, while above about 150 \u00b5g/L absolute iron deficiency is less likely \u2014 these are not rigid standalone rules."}
     ]},

    {id:"severe", nav:"Red-flag branch", title:"When iron deficiency signals serious pathology", sub:"Finding the cause is the priority. Missing GI malignancy is the critical pitfall, and the mistake is treating the number instead of investigating.",
     blocks:[
       {b:"warn", html:"<b>Replace and investigate together.</b> Starting iron does not remove the need to find the source. Unexplained IDA in men and post-menopausal women warrants secondary-care consideration even with a negative FIT \u2014 bidirectional endoscopy (OGD plus colonoscopy) or an urgent non-cancer gastroenterology pathway according to the local IDA pathway \u2014 and neither iron therapy nor anticoagulation is a valid reason to defer it."},
       {b:"cards", items:[
         {tone:"red", h:"Severe symptomatic anaemia", html:"Severe or symptomatic anaemia, haemodynamic compromise, chest pain, syncope, severe breathlessness or a rapidly falling Hb \u2192 <b>same-day</b> hospital assessment \u2014 use clinical judgement rather than an isolated Hb threshold. If transfusion is needed in stable adults without major haemorrhage, acute coronary syndrome or a chronic transfusion requirement, NICE NG24 recommends considering a restrictive threshold of <b>Hb 70 g/L</b> (post-transfusion target 70\u201390 g/L); in acute coronary syndrome use <b>80 g/L</b> (target 80\u2013100 g/L). Transfuse one unit at a time with clinical reassessment and repeat Hb unless there is active major bleeding."},
         {tone:"red", h:"Active bleeding", html:"Visible GI bleeding, haematemesis or melaena, suspected significant bleeding, or a <b>rapidly falling Hb</b> \u2192 same-day assessment. Review NSAIDs and anticoagulants."},
         {tone:"purple", h:"IDA + rectal bleeding or change in bowel habit <span class='tw'>Suspected cancer</span>", html:"<b>Any age</b> \u2192 FIT; <b>FIT \u226510 \u00b5g Hb/g \u2192 lower-GI suspected cancer pathway</b>, and a rectal mass \u2192 suspected cancer pathway referral without waiting for FIT. A FIT below 10 \u00b5g Hb/g does not exclude colorectal cancer: do not delay referral where clinical concern persists, the presentation is strongly suspicious or no sample is returned. Do not attribute to haemorrhoids without investigating.", src:"NICE NG12 (updated April 2026) \u00b7 NICE HTG690"},
         {tone:"amber", h:"IDA in a post-menopausal woman or any man", html:"With no obvious cause \u2192 secondary-care consideration even if FIT is negative. BSG 2021 generally recommends gastroscopy and colonoscopy first-line; the ACPGBI/BSG 2025 FIT guidance uses FIT to guide urgency \u2014 FIT-positive \u2192 suspected cancer pathway; FIT-negative \u2192 clinical assessment in an urgent non-cancer pathway, with urgency and need for endoscopy determined by overall risk. Follow the local NHS colorectal/IDA pathway. Colonoscopy is generally preferred for lower-GI assessment (CT colonography where colonoscopy is unsuitable); gastroscopy where an upper-GI source is possible or as part of bidirectional investigation.", src:"BSG 2021 (Snook et al., Gut) \u00b7 ACPGBI/BSG 2025"},
         {tone:"purple", h:"IDA + dysphagia <span class='tw'>Suspected cancer</span>", html:"Difficulty or pain on swallowing, Plummer\u2013Vinson syndrome \u2192 dysphagia alone meets NG12: suspected cancer pathway referral for oesophageal cancer.", src:"NICE NG12 (updated April 2026)"},
         {tone:"purple", h:"IDA + unintentional weight loss <span class='tw'>Suspected cancer</span>", html:"IDA itself triggers FIT; aged 55 and over, weight loss with upper abdominal pain, reflux or dyspepsia \u2192 suspected cancer pathway referral for oesophageal or stomach cancer. With anorexia, night sweats or fatigue, also consider haematological malignancy.", src:"NICE NG12 (updated April 2026)"},
         {tone:"purple", h:"IDA + haematuria <span class='tw'>Suspected cancer</span>", html:"Manage haematuria according to the current NG12 urological criteria and local pathway \u2014 IDA itself does not determine the referral. Aged 45 and over with unexplained visible haematuria, or 60 and over with non-visible haematuria plus dysuria or a raised white cell count \u2192 suspected cancer pathway referral (urology). Urological and GI pathology can coexist \u2014 investigate both.", src:"NICE NG12 (updated April 2026)"},
         {tone:"amber", h:"IDA + lymphadenopathy or splenomegaly", html:"These findings may warrant urgent assessment, but the pathway depends on distribution, persistence, associated symptoms, the blood count and the NICE NG12 criteria \u2014 this is not an IDA-specific referral rule.", src:"NICE NG12 (updated April 2026)"}
       ]},
       {b:"why", html:"Colorectal cancer is found in about 5% of patients presenting with IDA in primary care, making it the most important diagnosis to exclude. Iron deficiency in any post-menopausal woman or any man is a red flag by definition unless there is a clear dietary or malabsorptive cause. NICE NG12 (updated April 2026) routes IDA through FIT at any age \u2014 FIT \u226510 \u00b5g Hb/g means a suspected cancer pathway referral \u2014 and BSG 2021 advises bidirectional endoscopy for unexplained IDA in men and post-menopausal women; the ACPGBI/BSG 2025 FIT guidance now uses FIT to guide urgency and pathway selection, with FIT-negative patients assessed in an urgent non-cancer pathway per local arrangements."}
     ]},

    {id:"cause", nav:"Find the cause", title:"Where is the iron going?", sub:"Blood loss, malabsorption, diet, or demand. This section is the actual clinical work.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Blood loss \u2014 commonest", html:"Menorrhagia (the commonest cause in women of reproductive age), GI bleeding (peptic ulcer, IBD, colorectal cancer, NSAIDs), haematuria, regular blood donation, epistaxis, haemoptysis."},
         {tone:"blue", h:"Malabsorption", html:"<b>Coeliac disease</b> \u2014 the most important and most commonly missed; also post-gastrectomy, <b>H. pylori</b> gastritis, IBD, and bariatric bypass surgery. Long-term PPI reduces absorption."},
         {tone:"blue", h:"Dietary insufficiency", html:"Vegan or vegetarian diet without adequate non-haem iron or vitamin C; infants on cow's milk alone; the elderly with poor intake; tea or coffee with meals."},
         {tone:"blue", h:"Increased demand", html:"Pregnancy (relative deficiency), adolescent growth, and marathon running (foot-strike haemolysis)."}
       ]},
       {b:"dl", rows:[
         ["Ask about","Menstrual and obstetric history; GI symptoms, bowel habit and dysphagia; melaena or rectal bleeding; NSAIDs, aspirin, anticoagulants and antiplatelets; diet, blood donation and pica; coeliac disease, IBD, gastric and bariatric surgery; PPI use; haematuria; family history of colorectal, gastric or endometrial cancer"],
         ["Coeliac screen","<b>Anti-tTG IgA first-line, with total IgA</b> \u2014 IgA deficiency (about <b>1 in 500</b>) causes a false-negative tTG, in which case use an IgG-based test. Must be taken <b>while eating gluten</b>. Offer in unexplained IDA (coeliac disease is found in about 3\u20135% of patients with IDA). Refer positive serology for gastroenterology assessment; adults generally require specialist confirmation, usually including duodenal biopsy, before committing to a lifelong gluten-free diet"],
         ["H. pylori","Consider <b>urea breath test or stool antigen</b> in patients with upper-GI symptoms, recurrent or refractory IDA, or IDA persisting after negative bidirectional endoscopy where no other cause has been identified \u2014 not mandatory for every patient. Chronic atrophic gastritis impairs iron absorption. Stop PPIs before urea breath testing or use the locally recommended alternative, and confirm eradication according to the test\u2019s requirements"],
         ["Gynaecological","With menorrhagia, assess flow honestly (flooding, clots, duration) and consider <b>pelvic ultrasound</b> for fibroids or polyps; assess for anovulation (<b>PCOS</b>), and arrange a smear if overdue. Treat the bleeding \u2014 it is the ongoing loss"],
         ["First-line tests","FBC with red-cell indices; ferritin; <b>CRP</b> or another inflammatory marker if inflammation is possible or ferritin is not clearly low; renal function where relevant; anti-tTG IgA + total IgA in confirmed unexplained IDA; <b>urinalysis</b>"],
         ["According to the clinical picture","B12/folate, LFTs, TFTs if clinically indicated, haemoglobinopathy testing; <b>blood film</b> where the diagnosis is uncertain, indices are atypical, there are other cytopenias or a haemoglobinopathy is suspected (not mandatory in uncomplicated cases); H. pylori testing where indicated; FIT for adults with IDA"],
         ["Do not do","Do not order serum iron and TIBC routinely; no bone-marrow biopsy in primary care; do not repeat ferritin more often than monthly"]
       ]},
       {b:"why", html:"Coeliac disease is found in about 3\u20135% of patients with IDA, often without GI symptoms, so every patient with unexplained IDA should have anti-tTG IgA checked <em>before</em> endoscopy \u2014 a positive result lets the gastroenterologist combine gastroscopy with duodenal biopsy in one procedure. In women of reproductive age menorrhagia accounts for around 75% of IDA, but that does not exclude GI pathology, particularly from <b>\u226545 years</b> onwards."}
     ]},

    {id:"differential", nav:"Not all microcytosis", title:"Differential \u2014 not all microcytic anaemia is IDA", sub:"Giving iron to the wrong patient causes iron overload. Two mimics matter most.",
     blocks:[
       {b:"table", head:["Condition","Pattern","Key discriminator"], rows:[
         ["<b>Anaemia of chronic disease</b>","Normocytic or mildly microcytic; ferritin normal or raised, <b>TIBC low</b> (the opposite of IDA); CRP raised","Cancer, CKD, autoimmune disease, chronic infection \u2014 treat the underlying condition. <b>Ferritin &lt;15 always means iron deficiency</b>, even with inflammation"],
         ["<b>Thalassaemia trait</b>","Persistent microcytosis (<b>MCV often &lt;75 fL</b>) with normal Hb or mild anaemia; <b>normal ferritin</b>; target cells; family history","<b>Mentzer index (MCV \u00f7 RBC) &lt;13 suggests thalassaemia, &gt;13 suggests IDA</b>; HPLC confirms. Carrier frequency up to <b>5%</b> in South Asian, Mediterranean and African populations. <b>Do NOT give iron</b> unless there is concurrent deficiency"],
         ["Sideroblastic anaemia","Microcytic or normocytic; <b>high ferritin with low iron</b>; ring sideroblasts on marrow","Rare \u2014 haematology referral"],
         ["Lead poisoning","Occupational exposure; basophilic stippling on film","Rare in UK adults"],
         ["Mixed deficiency","B12 or folate deficiency alongside IDA can give a <b>normocytic</b> picture with a falsely normal MCV","Check B12 and folate whenever the picture is unclear \u2014 particularly in coeliac disease and post-gastrectomy"]
       ]},
       {b:"why", html:"Thalassaemia trait is common and entirely benign, and treating it as iron deficiency causes iron overload. The Mentzer index and a normal ferritin are the practical discriminators. Mixed B12 and iron deficiency is easy to miss because the macrocytosis and microcytosis cancel out."}
     ]},

    {id:"lifestyle", nav:"Diet", title:"Diet, absorption and long-term prevention", sub:"Most \u201crefractory\u201d iron deficiency is an absorption or adherence problem, not a dosing one.",
     blocks:[
       {b:"table", head:["Measure","What to advise","Effect"], rows:[
         ["<b>Haem iron</b>","Red meat, kidney, dark poultry, sardines, mussels \u2014 2\u20133 portions/week. Avoid liver in pregnancy (vitamin A excess)","Absorbed at <b>15\u201335%</b> vs 2\u201320% for non-haem"],
         ["<b>Non-haem iron</b>","Dark green leafy vegetables, fortified cereals, lentils, chickpeas, tofu, pumpkin seeds, dried apricots","Absorption depends heavily on what it is eaten with"],
         ["<b>Vitamin C</b>","Orange juice, strawberries, peppers eaten <em>with</em> the meal. Routine vitamin C supplementation with iron tablets is not essential \u2014 water or a normal vitamin-C-containing drink is reasonable","Increases non-haem absorption <b>3\u20136-fold</b>"],
         ["<b>Inhibitors</b>","Tea and coffee (tannins), calcium and dairy, antacids, phytates in unprocessed bran, polyphenols, PPIs \u2014 avoid taking iron at the same time as calcium, antacids, tea, coffee or medicines known to interact with iron","Tea with every meal is the most commonly overlooked cause of non-response"],
         ["<b>Vegetarian / vegan</b>","Requirements are <b>1.8\u00d7 higher</b>; emphasise lentils, fortified foods, seeds, greens","Consider ongoing low-dose supplementation (<b>14\u201318 mg elemental iron/day</b>) if recurrent"],
         ["<b>Reduce menstrual loss</b>","<b>Tranexamic acid 1 g TDS on days 1\u20134</b> (reduces flow 40\u201350%); mefenamic acid for flow and pain; <b>Mirena IUS reduces flow by 90%</b> over 12 months","The Mirena is the most effective long-term intervention for menorrhagia-related IDA"],
         ["<b>Coeliac \u2014 gluten-free diet</b>","Strict adherence, with dietitian referral","Mucosal recovery in <b>80%</b>; iron stores normalise over <b>6\u201312 months</b>"]
       ]}
     ]},

    {id:"ladder", nav:"Replace iron", title:"Iron replacement \u2014 oral and IV", sub:"BSG 2021 changed practice: once-daily or alternate-day dosing, not TDS.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1st", title:"Oral iron \u2014 once daily or alternate-day", when:"first-line",
          html:"Start with <b>one standard ferrous salt tablet once daily</b> (BSG 2021) \u2014 not TDS. Elemental iron varies by formulation: <b>dried ferrous sulfate 200 mg</b> about 65 mg; <b>ferrous fumarate 210 mg</b> about 68 mg; <b>ferrous fumarate 305/322 mg</b> about 100/106 mg depending on product; <b>ferrous gluconate 300 mg</b> about 35 mg. If GI adverse effects occur, use one tablet on <b>alternate days</b>, reduce the dose, change preparation or take with food. Alternate-day dosing is a tolerability strategy (hepcidin rises after each dose); evidence for equivalent clinical Hb outcomes is less robust than the absorption studies suggest. Take on an empty stomach if tolerated \u2014 food may improve tolerance but reduces absorption. Routine vitamin C is not essential. <b>Do not prescribe modified-release/enteric-coated preparations for routine treatment</b> \u2014 absorption may be inferior. Check the actual product SPC and local formulary for formulation-specific information."},
         {step:"2nd", title:"Manage the side effects before abandoning oral iron", when:"GI upset is common",
          fromLabel:"adherence is the usual problem",
          html:"Nausea, constipation and <b>black stools</b> (warn the patient \u2014 this is not melaena). Options: one tablet on alternate days, reduce the dose, change preparation, or take with food if necessary (taking with food may improve tolerance but reduces absorption)."},
         {step:"Check", title:"Recheck and keep going past normalisation", when:"2\u20134 weeks",
          fromLabel:"the step most often skipped",
          html:"Recheck <b>Hb at 2\u20134 weeks</b>: expect a rise of <b>10\u201320 g/L per month</b> (reticulocytes rise at 1\u20132 weeks as the earliest marker). A rise of <b>\u226510 g/L at 4 weeks</b> retrospectively confirms the diagnosis. Absence of an adequate response should prompt review of adherence, administration, ongoing blood loss, malabsorption, inflammation, renal disease, haemoglobinopathy and the original diagnosis. <b>Continue oral iron for approximately 3 months after the Hb normalises</b>, unless a different specialist or local protocol applies \u2014 total course typically 4\u20136 months. <b>Do not stop when the Hb normalises: stores are still empty.</b>"},
         {step:"IV", title:"Intravenous iron", when:"intolerant, ineffective, malabsorbing, or urgent",
          fromLabel:"escalation",
          html:"Consider IV iron where oral iron is contraindicated, not tolerated, ineffective, unlikely to be absorbed, adherence is not achievable, or rapid correction is clinically important. <b>Use the dose and administration rate in the current product SPC or local IV-iron protocol</b> \u2014 dose depends on body weight, Hb, total iron deficit, product and maximum single and weekly dose; do not use a generic 500\u20131000 mg instruction. May be preferred in selected patients with IBD or after bariatric surgery \u2014 decided clinically and according to specialist/local pathways. <b>Administer only where staff can recognise and manage anaphylaxis and resuscitation facilities are immediately available</b>; monitor during administration and for at least 30 minutes afterwards. A previous tolerated dose does not eliminate the risk of a subsequent reaction (MHRA). <b>Ferric carboxymaltose is associated with hypophosphataemia</b>: check phosphate in patients receiving repeated/high-dose or long-term treatment, or with risk factors (vitamin D deficiency, malabsorption, IBD, osteoporosis, hyperparathyroidism); re-evaluate treatment if hypophosphataemia persists (MHRA). Product choice and local service arrangements: <a href='https://www.greatermanchesterformulary.nhs.uk' rel='noopener'>GMMMG formulary</a>."},
         {step:"Pregnancy", title:"In pregnancy", when:"special case",
          fromLabel:"different thresholds",
          html:"In pregnancy, anaemia is generally defined as <b>Hb &lt;110 g/L in the first trimester, &lt;105 g/L in the second and third trimesters, and &lt;100 g/L postpartum</b>; follow local maternity guidance. <b>Oral iron (e.g. ferrous sulfate 200 mg once daily)</b> is standard. <b>Consider IV iron from the second trimester</b> where oral iron is not tolerated, ineffective or rapid correction is required, and late in pregnancy with significant anaemia (commonly Hb &lt;100 g/L after 34 weeks) according to obstetric assessment. Do not use IV iron in the first trimester unless specialist advice indicates otherwise. Arrange IV iron through maternity/obstetric or an agreed IV-iron service. Continue oral replacement after Hb correction according to maternity guidance, including postpartum."}
       ]},
       {b:"warn", html:"<b>Failure to respond at 4 weeks should trigger reassessment, never dose escalation.</b> Check adherence and tolerance, absorption (PPI, coeliac, H. pylori), ongoing blood loss, inflammation, renal disease, and whether the diagnosis is wrong (anaemia of chronic disease, thalassaemia trait or other haemoglobinopathy, malignancy). <b>Do not keep re-prescribing iron without investigating.</b>"}
     ]},

    {id:"monitor", nav:"Monitoring", title:"Monitoring, follow-up and safety-netting", sub:"Every row has an action threshold. Periodic FBC after recovery identifies recurrence; repeat ferritin selectively.",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["FBC","<b>2\u20134 weeks</b> after starting oral iron","A rise in Hb (expect <b>10\u201320 g/L</b>) supports the diagnosis and treatment response. Inadequate response \u2192 review adherence, administration, ongoing blood loss, malabsorption, inflammation, renal disease, haemoglobinopathy and the original diagnosis; check anti-tTG IgA if not already done"],
         ["Reticulocytes","1\u20132 weeks","Early response marker \u2014 a rise confirms the marrow is responding"],
         ["Hb (\u00b1 ferritin)","<b>3 months</b>","Hb should be normal. <b>Continue oral iron for approximately 3 months after Hb normalisation</b>, unless a different specialist or local protocol applies. Repeat ferritin selectively where ongoing deficiency, recurrent symptoms, CKD, inflammation or uncertainty about repletion is relevant. Confirm the cause was identified and treated, and that every outstanding investigation (endoscopy, gynaecology) has been actioned"],
         ["Ferritin","Selectively","<b>No universal post-treatment ferritin target</b> \u2014 a target such as &gt;50 \u00b5g/L is not a national standard. Ferritin is useful when assessing persistent or recurrent deficiency; treatment is guided by Hb response, ongoing losses, symptoms and the underlying condition"],
         ["Recurrent IDA","Any second episode","A second episode without a clearly established benign cause (e.g. adequately treated menorrhagia) <b>requires GI investigation even if previous investigation was negative</b> \u2014 occult GI blood loss is intermittent"],
         ["H. pylori","After eradication","<b>Confirm eradication</b> according to the test\u2019s requirements \u2014 stop PPIs before urea breath testing or use the locally recommended alternative"],
         ["Ongoing prevention","Periodic FBC after correction \u2014 often about 6-monthly initially","Particularly where the cause is ongoing or irreversible: vegans, coeliac disease, IBD, regular blood donors. Confirm the cause has been addressed and all referrals/investigations completed. Treat menorrhagia definitively; maintain the gluten-free diet"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"\ud83d\udd34 Return urgently", html:"\u201cBlack or bloody stools, vomiting blood, difficulty swallowing, worsening abdominal pain, significant weight loss, or worsening breathlessness or chest pain \u2014 contact us the same day.\u201d"},
         {tone:"amber", h:"\ud83e\uddea Black stools are expected", html:"\u201cThe tablets turn your stools black \u2014 that is the iron, not bleeding. But <em>tarry, sticky</em> black stools with a strong smell are different, and need same-day contact.\u201d"},
         {tone:"green", h:"\ud83d\udc8a Keep going after the blood count is normal", html:"\u201cWe carry on for about three more months after your blood count comes back to normal, because the count recovers long before your iron stores refill.\u201d"},
         {tone:"blue", h:"\ud83d\udd0d The tests still matter", html:"\u201cThe tablets fix the level; the tests tell us why it dropped. Please do go ahead with the camera test even though you're feeling better.\u201d"}
       ]},
       {b:"say", html:"Your blood count shows you are low in iron, which explains the tiredness and breathlessness. The tablets will build it back up over a few weeks \u2014 but just as important is finding out why it dropped, so I would like to do a few checks, including a stool test (FIT), and, given your age, arrange for the bowel to be looked at according to our local pathway \u2014 even if that stool test is normal. Take the iron on an empty stomach if you can, with water or a normal drink, not at the same time as tea, coffee, calcium or antacids, and we will recheck your blood in 2\u20134 weeks."}
     ]},

    {id:"refer", nav:"Refer", title:"Refer \u2014 who needs specialist input", sub:"Referral is cause-driven. Continue iron while any referral is pending.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same day", html:"Severe or symptomatic anaemia (chest pain, syncope, severe breathlessness); haemodynamic compromise; suspected active GI bleeding; very rapid Hb fall \u2014 clinical judgement rather than an isolated Hb threshold."},
         {tone:"purple", h:"Urgent referral routes <span class='tw'>Suspected cancer</span> \u00b7 NICE NG12", html:"<b>IDA at any age \u2192 FIT; FIT \u226510 \u00b5g Hb/g \u2192 suspected cancer pathway referral for colorectal cancer</b> (anaemia without iron deficiency at 60+ also \u2192 FIT); dysphagia \u2192 upper GI; aged 55+ with weight loss plus upper abdominal pain, reflux or dyspepsia \u2192 upper GI; haematuria meeting the NG12 urological criteria \u2192 urology per the local pathway; lymphadenopathy or splenomegaly \u2192 assess against the NG12 criteria. A FIT below threshold does not exclude colorectal cancer and must not override clinical concern. Men and post-menopausal women with unexplained IDA, and anyone with persistent symptoms despite a negative FIT, require secondary-care consideration even with a negative FIT, following the local IDA pathway (bidirectional endoscopy or an urgent non-cancer pathway).", src:"NICE NG12 (updated April 2026) \u00b7 NICE HTG690 \u00b7 BSG 2021"},
         {tone:"blue", h:"Gastroenterology \u2014 routine", html:"Positive anti-tTG IgA needing duodenal biopsy; unexplained IDA with negative bidirectional endoscopy (capsule endoscopy territory); suspected IBD; refractory or recurrent deficiency."},
         {tone:"blue", h:"Haematology", html:"Confirmed thalassaemia (trait counselling, pre-conception genetic advice); IDA refractory despite adequate dose and adherence; suspected haematological malignancy."},
         {tone:"blue", h:"Gynaecology", html:"Menorrhagia not controlled in primary care (<b>Mirena IUS first-line</b>); fibroids or polyps on ultrasound needing intervention; suspected endometriosis; <b>unexplained post-menopausal bleeding at 55 or over \u2014 suspected cancer pathway referral</b>."},
         {tone:"cream", h:"IV iron \u2014 usually no referral needed", html:"IV iron can be initiated in primary care where clearly indicated, or via a community IV iron service per local pathway \u2014 using the product SPC or local IV-iron protocol, with anaphylaxis-trained staff, resuscitation facilities and 30-minute post-dose monitoring."}
       ]},
       {b:"why", html:"The NG12 FIT route and the BSG endoscopy advice for IDA reflect the ~5% colorectal cancer detection rate in men and post-menopausal women. A common and serious mistake is delaying endoscopy because the patient is anticoagulated or already on iron \u2014 neither prevents endoscopy, and neither is a sufficient reason to defer it."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only \u2014 the Casebook keeps the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 64-year-old man, tired for months, Hb 104 g/L with MCV 74 and ferritin 12 \u00b5g/L. He attributes it to \u201cgetting older\u201d, has no GI symptoms, and does not want \u201canything invasive\u201d."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Recognises that IDA in a man is a colorectal red flag regardless of symptoms; explains FIT and the suspected cancer pathway referral without inducing panic, and that a negative FIT does not end investigation for a man with unexplained IDA; explores and addresses the reluctance to be scoped; starts iron <em>and</em> investigates; checks coeliac serology; safety-nets bleeding. <a href='../../cases/anaemia.html'>Open the anaemia casebook chapter \u2192</a>"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>BSH \u2014 Good Practice Paper: laboratory diagnosis of iron deficiency in adults (excluding pregnancy) and children (Br J Haematol, published online October 2021; doi:10.1111/bjh.17900)</b><br><a href="https://doi.org/10.1111/bjh.17900" rel="noopener">doi.org/10.1111/bjh.17900</a><span class="rd"> \u2014 ferritin and inflammation interpretation; oral dosing, duration of therapy, IV iron indications and the non-response work-up follow BSG 2021 below</span></li>'+
         '<li><b>NICE NG12 \u2014 Suspected cancer: recognition and referral (updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> \u2014 rec 1.3.1 FIT for adults with iron-deficiency anaemia (and anaemia at 60+), suspected cancer pathway referral at FIT \u226510 \u00b5g Hb/g; dysphagia, weight loss, haematuria and lymphadenopathy routes</span></li>'+
         '<li><b>NICE HTG690 (formerly DG56) \u2014 Quantitative faecal immunochemical testing to guide colorectal cancer pathway referral in primary care</b><br><a href="https://www.nice.org.uk/guidance/htg690" rel="noopener">nice.org.uk/guidance/htg690</a><span class="rd"> \u2014 FIT threshold of 10 \u00b5g Hb/g</span></li>'+
         '<li><b>ACPGBI/BSG/UKCGG \u2014 Guidelines on the role of FIT in the endoscopic investigation of iron deficiency anaemia (Frontline Gastroenterology, October 2025)</b><br><a href="https://doi.org/10.1136/flgastro-2025-103329" rel="noopener">doi.org/10.1136/flgastro-2025-103329</a><span class="rd"> \u2014 FIT and coeliac serology in primary care; FIT-positive \u2192 suspected cancer pathway; FIT-negative \u2192 urgent non-cancer pathway with urgency and endoscopy determined by overall risk</span></li>'+
         '<li><b>BSH \u2014 UK guidelines on the management of iron deficiency in pregnancy (Br J Haematol, 2019)</b><br><a href="https://doi.org/10.1111/bjh.16221" rel="noopener">doi.org/10.1111/bjh.16221</a><span class="rd"> \u2014 trimester-specific Hb thresholds, IV iron from the second trimester, late-pregnancy anaemia</span></li>'+
         '<li><b>MHRA Drug Safety Update \u2014 Ferric carboxymaltose (Ferinject): risk of symptomatic hypophosphataemia</b><br><a href="https://www.gov.uk/drug-safety-update" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> \u2014 phosphate monitoring in at-risk, repeated, high-dose or long-term treatment</span></li>'+
         '<li><b>GMMMG Formulary \u2014 Nutrition and blood</b><br><a href="https://www.greatermanchesterformulary.nhs.uk" rel="noopener">greatermanchesterformulary.nhs.uk</a><span class="rd"> \u2014 local oral and IV iron product choice and service arrangements</span></li>'+
         '<li><b>MHRA Drug Safety Update (August 2013) \u2014 Intravenous iron and serious hypersensitivity reactions</b><span class="rd"> \u2014 give only where trained staff and resuscitation facilities are immediately available; monitor during administration and for at least 30 minutes after each dose; a previous tolerated dose does not eliminate risk</span></li>'+
         '<li><b>BSG 2021 \u2014 Snook J et al., British Society of Gastroenterology guidelines for the management of iron deficiency anaemia in adults, Gut 2021</b><br><a href="https://doi.org/10.1136/gutjnl-2021-325210" rel="noopener">doi.org/10.1136/gutjnl-2021-325210</a><span class="rd"> \u2014 primary-care investigation, coeliac serology (coeliac disease in about 3\u20135% of IDA), urinalysis, once-daily then alternate-day oral iron, monitoring intervals, ferritin 45/150 \u00b5g/L practical thresholds, iron deficiency without anaemia, referral. Generally recommends bidirectional endoscopy in men and post-menopausal women \u2014 read alongside NICE HTG690 and ACPGBI/BSG 2025 for the current FIT pathway</span></li>'+
         '<li><b>BSG \u2014 British Society of Gastroenterology guidelines for the management of iron-deficiency anaemia</b><br><a href="https://doi.org/10.1136/gutjnl-2021-325210" rel="noopener">doi.org/10.1136/gutjnl-2021-325210</a><span class="rd"> \u2014 the gastroenterological work-up: who needs bidirectional endoscopy, coeliac serology before scoping, and capsule endoscopy when upper and lower GI investigation is negative</span></li>'+
         '<li><b>NICE NG24 \u2014 Blood transfusion</b><span class=\"rd\"> \u2014 restrictive threshold Hb 70 g/L (target 70\u201390 g/L), 80 g/L in acute coronary syndrome (target 80\u2013100 g/L), single-unit transfusion with reassessment, and when IV iron is preferable to transfusion in non-bleeding IDA</span></li>'+
         '<li><b>NICE NG203 (2021; replaced NG8) \u2014 Chronic kidney disease, including anaemia management</b><span class="rd"> \u2014 functional iron deficiency, reticulocyte Hb content where ferritin is unreliable</span></li>'+
         '<li><b>NICE NG88 \u2014 Heavy menstrual bleeding</b><span class="rd"> \u2014 tranexamic acid, mefenamic acid and LNG-IUS for menorrhagia-related iron loss</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> \u2014 ferrous salts and elemental iron content, ferric carboxymaltose, tranexamic acid, iron in pregnancy. Check the current product SPC and local NHS formulary/IV-iron protocol before prescribing</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Iron deficiency and iron-deficiency anaemia in adults \u2014 BSG 2021, NICE NG12 (updated April 2026), NG203 and NG88. Diagnosis and management are merged on this page; there is no separate iron-deficiency pathway to cross-check. For adults in primary care. Always identify the cause. Check the current product SPC and local NHS formulary/IV-iron protocol before prescribing. This guide must be checked against the current NICE NG12, NICE HTG690, local NHS Greater Manchester colorectal/IDA pathway, current SPC and local IV-iron protocol before use."
