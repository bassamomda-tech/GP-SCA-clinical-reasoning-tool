  quickSub:"If you read nothing else on this page, read these six cards. Every number traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"\u26a0 Examine, don't just prescribe", html:"A persistent vulvar ulcer, nodule or thickened white or red plaque not healing within 3 weeks, especially age &gt;50, is vulvar SCC or VIN until biopsied \u2192 2WW gynaecology-oncology. <b>Biopsy is mandatory \u2014 do not treat empirically.</b> <b>The classic error is repeated blind antifungal prescribing</b>, and average time from first symptom to vulvar SCC diagnosis is about 12\u201315 months, much of it at the GP stage."},
    {tone:"red", h:"Never assume vulvar itch is benign after the menopause", html:"Any vulvar lesion in a postmenopausal woman not resolved by 3\u20134 weeks of appropriate treatment \u2014 including a presumed contact dermatitis or candidal infection \u2014 must be referred for biopsy. Have a very low threshold for 2WW: white or red plaques, persistent ulcers, nodules, bleeding, or pain not responding."},
    {tone:"amber", h:"Lichen sclerosus is the condition to get right", html:"Affects about 1 in 30 postmenopausal women, is frequently misdiagnosed as candida or contact dermatitis and treated empirically for months to years, causes irreversible architectural destruction if undertreated, and carries roughly a 5% lifetime SCC risk (some series 5\u20138%), higher in undertreated disease. The figure-of-8 distribution of white atrophic shiny skin with purpura is pathognomonic."},
    {tone:"blue", h:"Under-application is why clobetasol \u201cfails\u201d", html:"The correct amount for the whole vulva and perianal area is about 0.5 g per application \u2014 half a fingertip unit \u2014 as a thin film to all affected skin. Patients under-apply because they fear steroid thinning; in fact adequate clobetasol thickens and restores atrophic LS skin, and it is untreated LS that causes the atrophy. Give written instructions and a diagram."},
    {tone:"purple", h:"The Q-tip test takes two minutes", html:"Touch a moistened cotton swab to the vestibule at clock positions and ask for a 0\u201310 score. Intense pain (7\u201310/10) at the posterior vestibule \u2014 5, 6 and 7 o'clock near the hymenal ring \u2014 with painless labia is focal provoked allodynia, diagnostic of vestibulodynia \u2192 pelvic floor physiotherapy, low-dose amitriptyline and psychosexual therapy. Diffuse unprovoked pain is generalised vulvodynia, a different pathway."},
    {tone:"green", h:"Confirm the species before six months of antifungal", html:"Recurrent VVC is \u22654 confirmed episodes a year, affecting about 6\u20138% of women. The commonest error is repeated short fluconazole courses without ever confirming the species \u2014 C. glabrata is about 15% of RVVC and is inherently fluconazole-resistant. Induction 150 mg every 72 h \u00d7 3, then 150 mg weekly \u00d7 6 months: ~90% remission, but ~50% relapse on stopping \u2014 say so at the outset."}

  pathway:[
    {title:"Look, and exclude cancer and abuse", html:"Persistent lump, ulceration, bleeding, non-healing lesion, or a white or red patch not responding \u2192 2WW. An injury inconsistent with the history in a child or vulnerable adult \u2192 safeguarding, and do NOT examine the genitalia.", alert:true},
    {title:"Classify by pattern", html:"Inflammatory dermatoses (LS, LP, LSC) \u00b7 infections (VVC, HSV, trichomonas, HPV) \u00b7 vulvodynia and vestibulodynia \u00b7 other (GSM, contact dermatitis, psoriasis, Bartholin)."},
    {title:"Examine systematically and test", html:"Consent and chaperone, good lighting; mons \u2192 labia \u2192 clitoris \u2192 vestibule \u2192 introitus \u2192 perineum \u2192 perianal skin. <b>Q-tip test, vaginal pH, swabs, HbA1c, and biopsy where indicated.</b>"},
    {title:"Treat the diagnosis properly", html:"LS \u2192 clobetasol induction then lifelong maintenance. GSM \u2192 topical oestrogen indefinitely. Vestibulodynia \u2192 the stepwise ladder. Candida \u2192 species-confirmed regimen. Bartholin abscess \u2192 Word catheter."},
    {title:"Put LS on surveillance", html:"Annual examination with symptom score, documented architectural change and biopsy of anything new. Review vulvodynia at 3 months, GSM annually, and re-assess anything not improving rather than repeat-prescribing."}
  ],
  sections:[

    {id:"severe", nav:"Exclude first", title:"Red flags — vulvar cancer, malignant transformation and safeguarding",
     sub:"Vulval itch is usually benign, but persistent or atypical lesions must be examined and biopsied to exclude VIN and vulvar carcinoma.",
     blocks:[
       {b:"table", head:["Presentation","Suggests","Action"], rows:[
         ["Persistent vulvar ulcer, nodule or thickened white or red plaque not healing within 3 weeks, age &gt;50","Vulvar squamous cell carcinoma (SCC) or VIN (vulvar intraepithelial neoplasia). Risk factors: lichen sclerosus (approximately 5%, some series 5\u20138%, malignant transformation), HPV-related VIN, smoking, immunosuppression","2WW gynaecology-oncology. Biopsy mandatory \u2014 do not treat empirically"],
         ["Lichen sclerosus + new erosion, fissure or indurated plaque not responding to treatment","<b>Malignant transformation within LS</b> \u2014 SCC arises in approximately 5% of adequately-treated LS and more in undertreated disease","2WW gynaecology. Any vulvar lesion suspicious on a background of LS must be biopsied"],
         ["Vulvar pruritus + thickened hyperkeratotic plaque + bleeding + postmenopausal","Lichen simplex chronicus complicated by secondary SCC, or primary vulvar SCC","2WW gynaecology. Never assume all vulvar itch is benign in postmenopausal women \u2014 biopsy any suspicious lesion"],
         ["Vulvar pain + purulent discharge + fever + tender inguinal lymphadenopathy + labial ulcer in a sexually active woman","<b>Bartholin gland abscess, chancroid, or HSV with secondary infection.</b> STI screen mandatory","Bartholin abscess \u2192 GP drainage (Word catheter) or same-day gynaecology if severe. Suspected chancroid (Haemophilus ducreyi) \u2192 GUM same-day"],
         ["Vulvar lesion + child or vulnerable adult + unexplained injury inconsistent with the history","<b>Sexual abuse</b>","Safeguarding referral immediately. Do NOT examine the genitalia \u2014 forensic examination is by a SARC. Document accurately. Police involvement if acute assault"],
         ["Recurrent vestibulitis or dyspareunia + progressive difficulty with intercourse + relationship distress + pain catastrophising","<b>Vulvodynia with significant functional impact</b> \u2014 risk of relationship breakdown, depression and sexual dysfunction","<b>Psychosexual referral plus specialist vulvar clinic</b>"],
         ["<b>Irregular pigmented vulvar lesion with bleeding or rapid change</b>","<b>Vulvar melanoma</b>","<b>2WW suspected cancer pathway</b>"],
         ["<b>Vulval itch in a child</b>","<b>Usually irritant, threadworm or hygiene-related</b>","Treat the cause \u2014 but <b>consider safeguarding if there are features of abuse</b>"],
         ["<b>Generalised pruritus including the vulva</b>","Systemic causes \u2014 iron deficiency (check ferritin), liver or renal disease, thyroid disease, lymphoma","<b>Screen if the history suggests it.</b> A sedating antihistamine at night can break the itch-scratch cycle meanwhile"]
       ]},
       {b:"why", html:"Vulvar SCC is a cancer frequently diagnosed late in UK primary care \u2014 the average time from first symptom to diagnosis is approximately 12\u201315 months, and a significant proportion of that delay occurs at the GP stage through repeated empirical treatment without biopsy. There are two routes to it: (1) the HPV-related pathway \u2014 typically younger women, high-grade VIN, HPV 16/18, cigarette smoking; and (2) the non-HPV pathway \u2014 older women, arising on a background of lichen sclerosus, lichen planus or differentiated VIN, the last being easily missed because it resembles reactive change. The key GP principle: any vulvar lesion in a postmenopausal woman that has not resolved with 3\u20134 weeks of appropriate treatment \u2014 including a presumed contact dermatitis or candidal infection \u2014 must be referred for biopsy. Have a very low threshold for 2WW referral in any postmenopausal woman with vulvar symptoms, particularly white or red plaques, persistent ulcers, nodules, bleeding, or pain not responding to treatment."},
       {b:"dl", rows:[
         ["<b>NG12 \u2014 the criterion that applies here</b>","NICE NG12: consider a suspected cancer pathway referral (for an appointment within 2 weeks) for vulval cancer in a woman with an unexplained vulval lump, ulceration or bleeding. In practice on this page that means: a lesion not healing within 3 weeks, a white or red plaque not responding to treatment, LS with a new indurated or eroded lesion, and any persistent symptom in a postmenopausal woman without a clear diagnosis. An irregular pigmented lesion with bleeding follows the suspected melanoma route. Restated in <a href='#refer'>Refer</a>"]
       ]}
     ]},

    {id:"confirm", nav:"Classify", title:"Classification of vulvar conditions",
     blocks:[
       {b:"dl", rows:[
         ["<b>Lichen sclerosus (LS)</b>","The most common chronic vulvar condition. White, atrophic, shiny plaques in a figure-of-8 distribution (vulva plus perianal skin). Intense pruritus. Architectural distortion \u2014 labial fusion, clitoral phimosis, introital stenosis. Risk of SCC (approximately 5%). Biopsy if atypical, bleeding or ulcerated. Treatment: clobetasol 0.05% ointment \u2014 the gold standard potent topical corticosteroid"],
         ["<b>Lichen planus (LP)</b>","Vulvovaginal-gingival syndrome; erosive LP is the most common vulvar pattern \u2014 violaceous plaques or erosions, with Wickham's striae. Risk of SCC up to 2\u20133%"],
         ["<b>Lichen simplex chronicus (LSC)</b>","The itching \u2192 scratching \u2192 lichenification cycle; thick leathery vulvar skin, highly reactive. Treat the underlying cause"],
         ["<b>Vulvovaginal candidiasis (VVC)</b>","The most common cause of vulvar itch \u2014 white curd-like discharge, erythema, satellite lesions, excoriation. Candida albicans 85%, non-albicans 15% (fluconazole-resistant). Recurrent VVC (\u22654 episodes a year): exclude type 2 diabetes, immunodeficiency and non-albicans species"],
         ["<b>Other infections</b>","HSV (genital herpes): painful vesicles or ulcers, tender inguinal lymphadenopathy, prodromal tingling. Trichomonas: yellow-green frothy discharge plus strawberry cervix. HPV / condylomata acuminata: soft fleshy warts"],
         ["<b>Vulvodynia and vestibulodynia</b>","Vulvodynia: chronic vulvar pain lasting more than 3 months without identifiable cause. Subtypes: generalised (spontaneous, unprovoked) or localised provoked vestibulodynia (the most common \u2014 insertion provokes intense burning at the vaginal entrance). A diagnosis of exclusion. Pathophysiology: central sensitisation plus peripheral neuroinflammation plus pelvic floor hypertonus. Common age 20\u201340, with significant impact on sexual function and quality of life"],
         ["<b>Genitourinary syndrome of menopause (GSM)</b>","Postmenopausal \u2014 thin pale mucosa, labial atrophy, loss of rugae, dyspareunia, dryness, urgency (also called atrophic vaginitis)"],
         ["<b>Contact dermatitis, psoriasis and Bartholin disease</b>","Contact dermatitis (allergic or irritant \u2014 panty liners, soap, detergents, topical anaesthetics, particularly benzocaine). Psoriasis: the inverse pattern \u2014 well-defined erythematous plaques without scale in the skin folds. Bartholin's cyst or abscess: duct obstruction; cyst is non-tender and lateral to the introitus, abscess is acutely tender, fluctuant and erythematous"]
       ]},
       {b:"why", html:"Lichen sclerosus is the most important vulvar condition for GPs to diagnose and manage correctly, for four reasons: (1) it affects approximately 1 in 30 postmenopausal women, and also occurs in premenopausal and paediatric patients; (2) it is frequently misdiagnosed as candidal infection or contact dermatitis and treated empirically for months to years without the correct diagnosis; (3) untreated or inadequately treated LS leads to progressive architectural destruction \u2014 labial fusion, clitoral phimosis, introital stenosis \u2014 which is irreversible; and (4) it carries a 5% lifetime risk of vulvar SCC, substantially higher in undertreated disease. The diagnosis is clinical in most cases \u2014 the figure-of-8 distribution of white atrophic shiny skin with purpura (subepidermal haemorrhage from fragile vessels) is pathognomonic. Biopsy is required for atypical presentations, resistance to treatment, any suspicious lesion, or to confirm the diagnosis before long-term potent steroid therapy. NICE recommends that any GP uncertain about the diagnosis of a vulvar condition should refer to gynaecology or a specialist vulvar clinic rather than treating empirically."}
     ]},

    {id:"workup", nav:"Assess", title:"History, examination and investigations",
     blocks:[
       {b:"table", head:["Domain","Detail"], rows:[
         ["<b>Symptom profile</b>","Itch (LS, candida, LSC, contact dermatitis) \u00b7 pain (LP, vulvodynia, herpes, Bartholin abscess) \u00b7 burning (vulvodynia, GSM, candida) \u00b7 discharge (VVC, BV, STI) \u00b7 dyspareunia (vestibulodynia, GSM, LS, LP) \u00b7 bleeding (LS, LP, trauma, VIN, SCC)"],
         ["<b>Pattern and triggers</b>","Duration and pattern \u2014 intermittent or cyclical suggests candida; constant suggests LS, LP or vulvodynia. Triggers: sexual activity (vestibulodynia), specific products (contact dermatitis), menstrual cycle (cyclical VVC)"],
         ["<b>Context</b>","Menopausal status (GSM) \u00b7 sexual history (STIs) \u00b7 previous vulvar conditions \u00b7 skin and autoimmune conditions (psoriasis, atopic eczema \u2014 vulvar involvement) \u00b7 medications (antibiotics \u2192 candida; the oral contraceptive pill and progestogens \u2192 vulvar dryness) \u00b7 vaginal products (soaps, douches, panty liners \u2014 irritants)"],
         ["<b>Examination technique</b>","Adequate lighting, a comfortable position (left lateral or lithotomy), patient consent and a chaperone. Systematic inspection: mons pubis \u2192 labia majora and minora \u2192 clitoris (phimosis) \u2192 vestibule (erythema, vascular changes, tenderness) \u2192 introitus \u2192 perineum \u2192 perianal skin"],
         ["<b>What to look for</b>","Colour: white (LS, LP, VVC, vitiligo), red (candida, contact, erosive LP), grey-brown (melanosis, VIN). Texture: atrophic (LS, GSM), lichenified (LSC), vesicles or ulcers (HSV, LP). Architecture: labial fusion, clitoral phimosis, introital stenosis \u2014 late LS or LP"],
         ["<b>Q-tip test for vestibulodynia</b>","Gentle touch of a Q-tip to the vestibular glands at 5 and 7 o'clock \u2014 severe pain with light touch means vestibulodynia"],
         ["<b>Investigations</b>","High vaginal swab plus endocervical swab (STI screen if infection is suspected) \u00b7 vaginal pH (&lt;4.5 is normal premenopausal; &gt;4.5 suggests BV, atrophy or trichomonas) \u00b7 Candida culture in recurrent VVC to identify non-albicans species \u00b7 HbA1c (recurrent candida, LS) \u00b7 ANA plus anti-Ro and anti-La (lichen planus is often associated with autoimmune conditions) \u00b7 vulvar biopsy (any suspicious lesion, atypical or unresponsive LS, LP confirmation) \u00b7 HSV PCR swab from an ulcer \u2014 superior to culture"]
       ]},
       {b:"why", html:"The Q-tip test for vulvodynia and vestibulodynia is a simple, standardised bedside examination every GP should be able to perform. Touch a moistened cotton-tipped swab sequentially to the vulvar vestibule at the positions of a clock face, asking the patient to rate pain 0\u201310 at each touch. In provoked vestibulodynia the posterior vestibule \u2014 5, 6 and 7 o'clock, near the hymenal ring \u2014 produces intense pain, typically 7\u201310/10, with the gentlest touch, while the same touch is painless or only mildly uncomfortable on the labia or non-vestibular skin. This focal provoked allodynia \u2014 pain from a non-painful stimulus \u2014 is diagnostic of vestibulodynia and is distinct from the diffuse tenderness of vulvodynia. The test takes 2 minutes and guides management: a positive Q-tip test at the posterior vestibule means vestibulodynia, which responds to pelvic floor physiotherapy, low-dose amitriptyline and psychosexual therapy; diffuse unprovoked vulvar pain means generalised vulvodynia, which has a different management pathway."},
       {b:"dl", rows:[
         ["<b>Bartholin gland cyst versus abscess</b>","Anatomy: the Bartholin glands are bilateral mucus-secreting glands at the 4 and 8 o'clock positions of the vaginal introitus. Cyst: duct obstruction \u2192 mucus accumulation \u2192 a non-tender fluctuant swelling lateral to the introitus, usually &lt;3 cm. Abscess: secondary infection, usually polymicrobial (S. aureus, E. coli, Neisseria gonorrhoeae in sexually active women \u2014 always screen for STIs), presenting as an acutely tender, fluctuant, erythematous 3\u20136 cm swelling, with fever and systemic illness (sepsis) in severe cases. A small asymptomatic cyst can be managed expectantly; an abscess needs drainage"],
         ["<b>Vestibulodynia assessment</b>","Provoked pain at the vaginal entrance, with onset at first attempted intercourse or after a trigger (recurrent candida, childbirth, topical medications), leading to secondary sexual avoidance, relationship distress, depression and anxiety. Vestibular erythema may be present but is not diagnostic. Diagnosis requires the characteristic history, a positive Q-tip test, and exclusion of other causes (candida, herpes, LS). Pelvic floor assessment for levator hypertonus \u2014 present in the majority of vestibulodynia patients"]
       ]}
     ]},

    {id:"ladder", nav:"Treat", title:"Lichen sclerosus, GSM and vulvodynia",
     blocks:[
       {b:"table", head:["Condition","Treatment"], rows:[
         ["<b>Lichen sclerosus \u2014 induction</b>","Clobetasol propionate 0.05% ointment (ultra-potent topical corticosteroid), first-line. OD at night for 4 weeks, then alternate nights for 4 weeks, then twice weekly for 4 weeks \u2014 a 3-month induction. Apply a thin layer to all affected skin including perianal. Provide written application instructions, since patients often under-apply"],
         ["<b>Lichen sclerosus \u2014 maintenance</b>","Once or twice weekly long-term \u2014 this prevents progression and architectural damage. Response: pruritus improves within weeks; white plaques take months. Emollient (aqueous cream) as a soap substitute and for dryness. Annual review: symptoms, architectural change, and biopsy of any new suspicious lesion"],
         ["<b>GSM \u2014 topical oestrogen</b>","Vagifem (estradiol 10 microgram pessary) daily for 2 weeks then twice weekly; or Ovestin (estriol 0.1% cream) nightly for 2 weeks then twice weekly. Minimal systemic absorption \u2014 safe in most women. Continue indefinitely: GSM does not resolve without ongoing oestrogen"],
         ["<b>GSM \u2014 other options</b>","Ospemifene 60 mg OD (an oral SERM licensed for GSM-related dyspareunia). Non-hormonal lubricants (YES WB, Sylk \u2014 water-based) for symptomatic relief; usually safe alongside cancer treatment, though discuss with the oncologist for breast cancer patients"],
         ["<b>Vulvodynia and vestibulodynia \u2014 stepwise</b>","(1) Education plus removal of irritants. (2) Amitriptyline 10 mg at night, increasing to 25\u201375 mg over weeks \u2014 central sensitisation modulation. (3) Topical lidocaine 2% gel applied to the vestibule 15 minutes before intercourse, reducing pain and allowing gradual desensitisation. (4) Pelvic floor physiotherapy for levator hypertonus release \u2014 validated RCT evidence. (5) CBT or psychosexual therapy. (6) Specialist options: vestibulectomy (70\u201380% improvement in refractory provoked vestibulodynia), botulinum toxin injection to the bulbocavernosus muscle, low-level laser therapy"],
         ["<b>Contact dermatitis</b>","<b>Remove the irritant, plus hydrocortisone 1% and an emollient</b>"]
       ]},
       {b:"why", html:"The clobetasol application technique is one of the most practically important educational points at diagnosis \u2014 studies consistently show patients under-apply topical corticosteroids to the vulva because they worry about steroid side effects, using only a small amount of cream. The correct amount for the entire vulva and perianal area is approximately 0.5 g per application (half a fingertip unit), applied as a thin film to all affected skin including the perianal area. Under-application is the most common reason for inadequate treatment response in LS. Provide clear written instructions and ideally demonstrate with a diagram at the first prescription. Two patient concerns to address directly: (1) skin thinning \u2014 paradoxically, adequate clobetasol treatment thickens and restores the atrophic LS skin toward normal, and it is untreated LS itself that causes the atrophy; (2) absorption \u2014 the total weekly dose used in LS maintenance, typically 0.5\u20131 g a week, is far below the dose that causes systemic corticosteroid effects."},
       {b:"why", html:"The GSM treatment conversation is one of the most impactful interventions at menopause consultations \u2014 a condition affecting approximately 50% of postmenopausal women, causing vaginal dryness, dyspareunia, urinary urgency and recurrent UTIs, and almost universally treatable with local vaginal oestrogen. Unlike vasomotor symptoms, which often improve over time, GSM is progressive without oestrogen \u2014 the vaginal mucosa atrophies further with each year after menopause. Despite its prevalence and treatability, only about 25% of affected women receive treatment, because women are too embarrassed to mention symptoms, GPs do not proactively ask, women and some GPs believe GSM is normal ageing, and women worry about local oestrogen being \u201chormones\u201d with cancer risk. Local vaginal oestrogen at recommended doses (Vagifem 10 microgram) produces negligible systemic absorption and is considered safe for virtually all women, including most women on aromatase inhibitors for breast cancer \u2014 the ASCEND trial (2024) confirmed safety in that group."}
     ]},

    {id:"infections", nav:"Infections", title:"Candida, herpes and Bartholin abscess",
     blocks:[
       {b:"table", head:["Condition","Treatment"], rows:[
         ["<b>Uncomplicated VVC</b>","Clotrimazole 500 mg pessary (single dose), or fluconazole 150 mg PO stat \u2014 avoid in pregnancy (teratogenic risk in the first trimester). Topical clotrimazole 2% cream to the vulva for external symptoms"],
         ["<b>Complicated VVC</b>","Severe, C. glabrata or immunocompromised: clotrimazole 500 mg pessary on 3 consecutive nights, or fluconazole 150 mg \u00d7 2 doses 72 h apart"],
         ["<b>Recurrent VVC (\u22654 a year)</b>","Confirm the diagnosis microbiologically first. Fluconazole 150 mg every 72 h \u00d7 3 doses (induction) then 150 mg weekly \u00d7 6 months (maintenance \u2014 FSRH 2020). Treat the partner only if symptomatic (balanitis). Avoid soap and shower gel to the vulva, and tight synthetic underwear. Non-hormonal lubricants during intercourse reduce the mucosal trauma that predisposes to recurrence"],
         ["<b>C. glabrata</b>","Fluconazole-resistant \u2014 boric acid pessaries 600 mg OD \u00d7 14 days (specialist), or flucytosine vaginal cream. Investigations for RVVC: vaginal swab plus culture to identify species, HbA1c, HIV, immunoglobulin levels"],
         ["<b>Genital herpes \u2014 primary</b>","Aciclovir 400 mg TDS \u00d7 5\u20137 days, or valaciclovir 500 mg BD \u00d7 5 days. Start within 5 days of onset, or while lesions are still forming. Analgesia (ibuprofen plus paracetamol). Local measures: cool water, passing urine via a tube if dysuria is severe, topical lidocaine gel"],
         ["<b>Genital herpes \u2014 recurrent and suppressive</b>","Recurrence: aciclovir 800 mg TDS \u00d7 2 days, or 200 mg five times a day \u00d7 5 days. Suppression (\u22656 episodes a year): aciclovir 400 mg BD daily \u2014 reduces recurrence by 70\u201380%. Counselling: inform the partner, condoms do not fully prevent transmission, and there is a vertical transmission risk in pregnancy (neonatal HSV is devastating)"],
         ["<b>Bartholin abscess</b>","Word catheter \u2014 a GP procedure: inflate the balloon with 3\u20134 mL of water and leave in situ 4\u20136 weeks to epithelialise a new duct. Under local anaesthetic: a #11 blade, 0.5 cm incision at the medial aspect of the abscess (not the labial skin), insert the Word catheter, inflate, and close wound edges with an absorbable suture if necessary. Culture the pus (STI screen including gonorrhoea and chlamydia in sexually active women). Antibiotics only if there are systemic features or cellulitis \u2014 co-amoxiclav 625 mg TDS \u00d7 5 days. Recurrence: marsupialisation"]
       ]},
       {b:"why", html:"Recurrent vulvovaginal candidiasis is a clinically frustrating condition affecting approximately 6\u20138% of women, and management requires systematic investigation \u2014 confirming the diagnosis microbiologically, identifying the Candida species, and excluding underlying predisposing conditions \u2014 before starting long-term maintenance therapy. The commonest error is prescribing repeated short courses of fluconazole without ever confirming the species. Candida glabrata accounts for approximately 15% of RVVC and is inherently less susceptible to fluconazole (higher MIC), so women who fail standard treatment should have the species confirmed. The FSRH 2020 guideline recommends induction with fluconazole 150 mg every 72 h for 3 doses, then maintenance 150 mg weekly for 6 months. At 6 months approximately 90% of women achieve remission, but relapse occurs in approximately 50% on stopping \u2014 discuss this with the patient at the outset."},
       {b:"why", html:"Word catheter insertion for a Bartholin abscess is a GP-performable office procedure that can prevent a hospital admission. The technique: (1) adequate analgesia \u2014 local anaesthetic infiltration of the labial skin with lidocaine 1\u20132%, with Entonox optional if the patient is anxious; (2) a #11 scalpel blade inserted at the medial aspect of the labium minus at the 4 or 8 o'clock position \u2014 the medial surface, not the labial skin surface, which avoids scarring visible from outside; (3) a 0.5 cm stab incision; (4) digital exploration and drainage of the abscess contents; (5) a Word catheter (or a Foley catheter with a 12\u201316F balloon) inserted and the balloon inflated with 2\u20133 mL of water; (6) the catheter tip tucked into the vagina for comfort. The catheter stays in situ for 4\u20136 weeks to allow epithelialisation of a permanent new duct, and the patient can continue normal activities with it in place. GP training in this procedure is available through FSRH workshops and the RCGP practical procedures training programme."}
     ]},

    {id:"lifestyle", nav:"Self-care", title:"Vulvar hygiene, self-care and sexual wellbeing",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"\u{1F9FC} Hygiene \u2014 the less-is-more principle", html:"Avoid ALL soap, shower gel, bubble bath, deodorant, antiseptic (Dettol, Savlon) and feminine wipes on the vulva \u2014 the vulvar skin has a fragile acid mantle (pH 3.5\u20134.5) disrupted by alkaline cleaning products. Wash with plain warm water only, or an unfragranced aqueous cream or emollient as a soap substitute. Never douche. Unscented, unbleached cotton pads; loose 100% cotton underwear; <b>go without underwear in bed where possible</b> to reduce heat and moisture."},
         {tone:"amber", h:"\u26a0\ufe0f Irritants and allergens", html:"The commonest topical vulvar irritants and allergens: scented products (fragrances \u2014 the most common allergen), rubber accelerators (latex condoms), propylene glycol (in many topical preparations and lubricants \u2014 a significant vulvar sensitiser), lanolin, tea tree oil, and benzocaine \u2014 which causes allergic contact dermatitis in approximately 5% with repeated use, so avoid OTC topical anaesthetic preparations for longer than 2 weeks. Patch testing by a dermatologist identifies specific allergens in refractory vulvar dermatitis."},
         {tone:"blue", h:"\u{1F4A7} Lubricants", html:"Water-based (YES WB, Sylk, Durex Play) are safe for all vulvar conditions and for latex condoms. Oil-based (coconut oil, petroleum jelly, baby oil) degrade latex condoms. Silicone-based are long-lasting and condom-compatible but not for use with silicone toys. Avoid warming and flavoured lubricants, and glycerol-containing products \u2014 glycerol can promote candida growth in susceptible women."},
         {tone:"green", h:"\u{1F9D8} Pelvic floor physiotherapy and self-help", html:"NHS referral via the GP or specialist for vestibulodynia and vulvodynia. While awaiting the appointment: perineal massage \u2014 daily gentle pressure with the fingers inside the vaginal entrance, gradually increasing depth over weeks, a validated home treatment for vestibulodynia. Vaginal dilators for significant introital stenosis (LS or LP related) or vaginismus \u2014 a graded set used progressively over weeks to months. Avoid aggressive or painful dilation \u2014 trauma worsens central sensitisation."},
         {tone:"cream", h:"\u{1F338} Lichen sclerosus \u2014 patient education", html:"LS is a lifelong condition requiring lifelong treatment \u2014 stopping clobetasol leads to symptom recurrence and disease progression in the majority. LS UK, the lichen sclerosus patient charity, provides support, information and a forum (check the current web address). Annual review: symptoms, examination for new suspicious lesions, and photographic documentation of architectural change. Seek urgent review for any new lesion, bleeding, ulcer or rapid change in appearance."},
         {tone:"plain", h:"\u{1F930} Pregnancy", html:"Fluconazole: avoid in the first trimester (associated with rare cardiac abnormalities in large studies); clotrimazole pessary is safe throughout. LS: clobetasol is generally considered safe at maintenance doses \u2014 do not stop LS treatment during pregnancy. HSV: first episode after 28 weeks \u2192 urgent obstetric and sexual health input (Caesarean section recommended, especially within 6 weeks of delivery); recurrent HSV \u2192 suppressive aciclovir 400 mg TDS from 32 weeks (BASHH/RCOG 2024). GSM: topical vaginal oestrogen is generally avoided in pregnancy."},
         {tone:"blue", h:"\u{1F9E0} Psychosexual support", html:"Chronic vulvar pain and lichen sclerosus profoundly affect sexual function and self-image. Refer to a psychosexual therapist (COSRT-registered) for vestibulodynia with secondary vaginismus, relationship distress, loss of sexual identity, or anxiety and depression related to chronic vulvar pain. RELATE for couple therapy. PHQ-9 plus GAD-7 at every chronic vulvar condition review \u2014 depression and anxiety are common comorbidities."},
         {tone:"green", h:"\u{1F5E3}\ufe0f Ask menopausal women directly", html:"GSM affects approximately 50% of postmenopausal women and is significantly undertreated \u2014 only about 25% of affected women seek treatment. Unlike vasomotor symptoms it does not improve with time, and worsens progressively without oestrogen. Ask proactively: <em>\u201cSome women notice vaginal dryness, discomfort, or pain with sex after menopause \u2014 is this something you've experienced?\u201d</em> Reassure that GSM is entirely treatable, and that local vaginal oestrogen is safe for the majority including most breast cancer survivors \u2014 check with the oncologist for those on current treatment."}
       ]}
     ]},

    {id:"monitor", nav:"Surveillance", title:"Follow-up, surveillance and safety-netting",
     blocks:[
       {b:"table", head:["Group","Follow-up"], rows:[
         ["<b>Lichen sclerosus \u2014 annual review</b>","Annual examination: symptom control (VAS pruritus score), architectural changes (labial fusion, phimosis, introital stenosis \u2014 photograph for comparison), and any new suspicious lesion (ulcer, nodule, new erythema). Biopsy if there is a new lesion, poorly controlled symptoms despite adequate clobetasol, or any clinical concern. SCC surveillance: 5-yearly colposcopy in some specialist centres for high-risk LS"],
         ["<b>Vulvodynia review</b>","At 3 months: NRS pain score, sexual function (FSFI questionnaire), amitriptyline dose (titrate to 25\u201375 mg), pelvic floor physiotherapy attendance. At 6 months: if minimal improvement, specialist vulvar clinic referral. Significant depression or anxiety: NHS Talking Therapies, and consider an SNRI \u2014 duloxetine 30\u201360 mg OD has additional vulvodynia evidence"],
         ["<b>Recurrent candida review</b>","At completion of 6 months' maintenance fluconazole: recheck symptoms, and repeat culture if there were breakthrough episodes. On stopping maintenance, inform the patient of the likely recurrence risk (50%) and reinstate immediately if it recurs. If C. glabrata is confirmed: GUM clinic or specialist management"],
         ["<b>GSM monitoring</b>","Annual review: symptom response, vaginal pH (normalisation to &lt;5 confirms oestrogen adequacy), prescription renewal. Encourage long-term use \u2014 symptoms return within months of stopping"],
         ["<b>Re-assess rather than repeat-prescribe</b>","Re-assess any symptom not improving with first-line care rather than repeat-prescribing antifungals or steroids blindly. Review lichen sclerosus response and monitor for thickened or ulcerated change"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"\u{1F534} Immediate / 2WW", html:"A new vulvar ulcer or nodule in a postmenopausal woman \u2192 2WW \u00b7 an irregular pigmented lesion with bleeding (vulvar melanoma) \u2192 2WW \u00b7 LS with a new indurated lesion not responding to clobetasol at 6 weeks \u2192 2WW."},
         {tone:"amber", h:"\u{1F7E0} Within 2 weeks", html:"Bartholin abscess (urgent drainage) \u00b7 suspected primary herpes near term in pregnancy (obstetric review) \u00b7 recurrent VVC with a non-albicans species identified (GUM or specialist)."},
         {tone:"blue", h:"\u{1F50D} The governing rule", html:"<b>Always examine a persistent vulval symptom.</b> A non-resolving lesion, ulcer, lump or white or red patch that is not settling needs biopsy."},
         {tone:"green", h:"\u{1F6AD} Smoking", html:"<b>Smoking cessation \u2014 VIN and HPV risk.</b>"}
       ]},
       {b:"why", html:"Photographic documentation of lichen sclerosus architectural change at annual review is a quality standard that protects both the patient and the GP \u2014 progressive fusion of the labia minora, clitoral phimosis or introital stenosis that is not documented or acted upon represents a missed opportunity to prevent irreversible structural damage. Serial clinical photographs, with patient consent, allow year-on-year comparison and justify escalating treatment or referring when progression is documented. In the absence of photography, a detailed written description provides baseline documentation \u2014 for example, <em>\u201cbilateral labia minora reduced to approximately 50% of normal size, clitoral hood beginning to adhere to the glans, introital calibre approximately 2 finger breadths\u201d</em>. GPs who review LS patients annually without recording the degree of architectural change have inadequate documentation."},
       {b:"say", html:"Before I give you anything, I want to look \u2014 that matters more than it sounds, because vulval symptoms that keep coming back are often not thrush, and treating blind is how the important things get missed. If this is the white, shiny skin change I suspect, the treatment is a strong steroid ointment, not an antifungal. Two things about that ointment: use more than you think \u2014 about half a fingertip for the whole area \u2014 and it does not thin the skin, it repairs it; it is the condition itself that does the thinning. It is a lifelong condition, so we keep going with a small maintenance dose, and I will see you once a year to check the skin and make sure nothing new has appeared."}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways",
     blocks:[
       {b:"cards", items:[
         {tone:"purple", h:"2WW gynaecology-oncology", html:"Any vulvar ulcer, nodule or indurated plaque not resolved after 3 weeks of appropriate treatment \u00b7 lichen sclerosus with a new suspicious lesion or erosion not responding \u00b7 lichen planus with progressive destruction \u00b7 a postmenopausal woman with persistent vulvar symptoms without a clear diagnosis \u00b7 an irregular pigmented lesion with bleeding."},
         {tone:"amber", h:"Gynaecology (urgent)", html:"Bartholin abscess requiring a Word catheter or marsupialisation \u00b7 suspected LP or LS requiring diagnostic biopsy \u00b7 suspected VIN."},
         {tone:"red", h:"GUM / sexual health (same-day)", html:"Suspected STI (primary HSV, gonorrhoea, syphilis, chancroid) \u00b7 recurrent HSV requiring suppressive therapy \u00b7 contact tracing."},
         {tone:"blue", h:"Specialist vulvar clinic / dermatology", html:"Vulvodynia or vestibulodynia not responding to first-line treatment \u00b7 refractory lichen sclerosus or planus \u00b7 psoriasis with significant vulvar involvement \u00b7 diagnosis uncertain after initial assessment."},
         {tone:"green", h:"Pelvic floor physiotherapy", html:"Vestibulodynia with levator hypertonus \u00b7 vaginismus \u00b7 dyspareunia from pelvic floor dysfunction."},
         {tone:"cream", h:"GP management", html:"Uncomplicated candida: clotrimazole pessary or fluconazole 150 mg PO. GSM: topical oestrogen (Vagifem, Ovestin). Confirmed LS: clobetasol 0.05% ointment. Contact dermatitis: remove the irritant plus hydrocortisone 1% and an emollient. HSV recurrence: aciclovir 200 mg five times a day \u00d7 5 days."}
       ]},
       {b:"why", html:"The specialist vulvar clinic is an underutilised resource in UK primary care \u2014 a multidisciplinary clinic typically staffed by a vulvar dermatologist or gynaecologist with an interest in vulvar disease, sometimes supported by a pelvic floor physiotherapist and specialist nurse. These clinics provide expert biopsy, dermoscopy, treatment of lichen sclerosus and planus to prevent malignant transformation, management of vulvodynia, and liaison with psychosexual therapy. Many women with chronic vulvar conditions are managed in primary care for years with repeated candida treatments, steroid creams or antifungals without ever having an adequate examination, biopsy or specialist input. GPs should have a low threshold for referring to a specialist vulvar clinic for any vulvar condition that has not been clearly diagnosed, or is not responding to appropriate treatment within 3 months."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 64-year-old has had vulval itch for over a year, worst at night, and has had four courses of clotrimazole \u2014 two of them issued by phone. She now finds intercourse painful and has noticed \u201cthe skin looks pale\u201d. She has never been examined for this. She asks for \u201csomething stronger for the thrush\u201d."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Examines rather than re-prescribing, and names why: blind antifungal prescribing is how vulvar cancer is missed; recognises white atrophic figure-of-8 change as lichen sclerosus, not candida; prescribes clobetasol 0.05% with the induction-then-maintenance regimen AND the quantity instruction (~0.5 g, half a fingertip); addresses the steroid-thinning fear correctly \u2014 adequate treatment restores the skin; arranges annual surveillance with documented architectural change and states the ~5% SCC risk; treats the coexisting <b>GSM with topical oestrogen</b> rather than attributing dyspareunia to LS alone; and \u2014 the step candidates miss \u2014 sets the explicit rule that anything not settling in 3 weeks gets biopsied rather than another cream."}
     ]}]},

  foot:"Vulvar disorders \u2014 NICE (Lichen sclerosus), NICE NG12 (May 2025), FSRH Vulvovaginal candidiasis 2020, BSSVD vulvar disorders guidelines, BASHH HSV guidelines 2014 and the BNF. Always examine a persistent vulval symptom: a non-resolving lesion, ulcer, lump or white or red patch needs biopsy, and repeated blind antifungal prescribing is how vulvar cancer is diagnosed late. This page replaces the former pruritus vulvae card. The reasoning pathway remains at the <a href=\"../algorithms/vulvar-disorders.html\">vulvar disorders pathway</a>. Verify all doses against the current BNF before prescribing."
