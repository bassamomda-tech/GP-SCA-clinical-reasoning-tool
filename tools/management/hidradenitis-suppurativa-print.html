<script>
MG.render({
  icon:"🩹",
  title:"Hidradenitis suppurativa",
  eyebrow:"Protocol · assess and manage in one place",
  stemTitle:"Recognise it early, stage it with Hurley, treat smoking, weight and pain, give a proper 12-week antibiotic trial, and refer before scarring sets in",
  stemSub:"One page for hidradenitis suppurativa (HS) in primary care, following the British Association of Dermatologists (BAD) 2018 guideline. HS is a chronic inflammatory skin disease of the flexures, often diagnosed years late. Make the diagnosis from typical lesions, typical sites and recurrence. Stage it with Hurley. Address smoking, weight, pain and mental health. Use topical clindamycin for mild disease and a 12-week course of a tetracycline for more widespread disease. Refer to dermatology for moderate or severe disease or when first-line treatment fails, where clindamycin with rifampicin, adalimumab (NICE TA392), secukinumab (NICE TA935) and surgery are options.",
  guideline:"BAD guideline for HS (2018) · NICE TA392 adalimumab (2016) · NICE TA935 secukinumab (2023) · NICE TA1028 bimekizumab (terminated, 2025) · NICE NG12 (updated April 2026) · SPCs",
  reviewed:"15 October 2026",
  nextReview:"15 April 2027",
  meta:[
    {t:"BAD 2018 · HS management"},
    {t:"NICE TA392 · adalimumab"},
    {t:"NICE TA935 · secukinumab"},
    {t:"Suspected cancer · SCC in chronic perianal or gluteal HS", tone:"tw"},
    {t:"v1.0 · reviewed Oct 2026", tone:"ok"}
  ],
  lead:"<div class='mg-layers'><a href='#diagnose'><b>Diagnose</b><small>lesions, sites, recurrence</small></a><a href='#hurley'><b>Stage</b><small>Hurley I to III</small></a><a href='#treat'><b>Treat</b><small>clindamycin, tetracycline 12 weeks</small></a><a href='#refer'><b>Refer</b><small>dermatology, biologics, surgery</small></a></div>",
  quickSub:"Six cards for the consultation. Each one traces to a named source under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"Same-day: sepsis or a spreading infection; a suspected cancer pathway referral for a non-healing ulcer", html:"HS flares are usually sterile inflammation, but a patient with <b>fever, spreading cellulitis or sepsis</b> needs same-day assessment. Long-standing perianal or gluteal HS can develop <b>squamous cell carcinoma</b>: a non-healing ulcer, a growing mass or bleeding needs a <b>suspected cancer pathway referral</b>."},
    {tone:"amber", h:"Diagnose it: lesions, sites, recurrence", html:"<b>Painful deep nodules, abscesses, draining tunnels (sinus tracts) and scarring</b>, in the <b>axillae, groin, inframammary folds, perineum or buttocks</b>, recurring (typically twice or more in 6 months). It is not caused by poor hygiene and is not contagious. Diagnosis is often delayed for years after repeated 'boils'."},
    {tone:"blue", h:"Stage with Hurley and measure the impact", html:"<b>Hurley I</b>: abscesses without tunnels or scarring. <b>Hurley II</b>: recurrent abscesses with tunnels and scarring, separated by normal skin. <b>Hurley III</b>: diffuse involvement with interconnected tunnels across an area. Record a pain score and the Dermatology Life Quality Index (DLQI), and screen for depression. Treatment depends on stage, activity and impact."},
    {tone:"cream", h:"Lifestyle is treatment, not advice", html:"Support <b>smoking cessation</b> and <b>weight loss</b>, which are linked to severity and response. Suggest loose clothing, avoiding friction, and an antiseptic wash. Screen for associated conditions: obesity, metabolic syndrome, diabetes, inflammatory bowel disease, inflammatory arthritis, polycystic ovary syndrome and depression."},
    {tone:"cream", h:"First line: topical clindamycin, then a 12-week tetracycline", html:"Mild, localised disease: <b>topical clindamycin 1% twice daily for 12 weeks</b>. More widespread or Hurley II disease: a <b>tetracycline for 12 weeks</b> (for example lymecycline 408 mg once daily or doxycycline 100 mg once daily), reviewing the response at 12 weeks. Antibiotics here are used for their anti-inflammatory effect, so a short course for a flare is not a trial."},
    {tone:"blue", h:"Refer before scarring: dermatology holds the next steps", html:"Refer moderate or severe disease (Hurley II or III), disease not controlled after a 12-week tetracycline, or diagnostic doubt. Specialist options include <b>clindamycin with rifampicin</b>, retinoids, intralesional steroid, <b>adalimumab</b> (NICE TA392), <b>secukinumab</b> (NICE TA935) and surgery (deroofing or excision). Bimekizumab is licensed, but its NICE appraisal was terminated (TA1028)."}
  ],
  pathwaySub:"Five moves. Early recognition is where most of the long-term harm is prevented.",
  pathway:[
    {title:"Exclude the urgent problems", html:"Sepsis or spreading cellulitis (same day); a non-healing ulcer or mass in long-standing disease (suspected cancer pathway referral); severe pain or suicidal thoughts.", alert:true},
    {title:"Make the diagnosis", html:"Typical lesions at typical sites, with recurrence. Consider the differentials: boils and carbuncles, infected epidermoid cysts, Crohn's disease of the skin (perianal), and pilonidal disease."},
    {title:"Stage and assess impact", html:"Hurley stage, number of active nodules and abscesses, pain score, DLQI, mood, and associated conditions (BMI, HbA1c, blood pressure, lipids, bowel symptoms, joint symptoms)."},
    {title:"Treat in steps", html:"Lifestyle, pain relief and dressings for everyone; topical clindamycin for mild localised disease; a 12-week tetracycline for more widespread disease; refer when not controlled or moderate to severe."},
    {title:"Review and refer", html:"Review at 12 weeks. Refer early to dermatology for Hurley II or III disease or treatment failure, and to psychological support where needed."}
  ],
  sections:[
    {id:"redflags", nav:"Red flags", title:"Red flags and urgent problems", sub:"Most HS is managed in primary care and dermatology. These need prompt action.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Sepsis or spreading cellulitis", html:"Fever, systemic illness, or rapidly spreading redness: same-day assessment, using NICE NG253 for sepsis and NICE NG141 for cellulitis. Any sepsis high-risk criterion (respiratory rate 25 or more, heart rate above 130, systolic blood pressure 90 or less, or new confusion or altered mental state) needs a 999 transfer with a pre-alert to hospital. A large fluctuant abscess causing systemic upset may need surgical drainage.", src:"NICE NG253 (2025) · NICE NG141 (2019)"},
         {tone:"purple", h:"🟣 Suspected squamous cell carcinoma", html:"Long-standing HS, especially in the perianal, perineal or gluteal region and in men who smoke, carries a risk of squamous cell carcinoma. A non-healing ulcer, a growing or hard mass, or bleeding needs a <b>suspected cancer pathway referral</b> (NICE NG12).", src:"BAD guideline for HS (2018) · NICE NG12 (updated April 2026)"},
         {tone:"amber", h:"🟠 Mental health", html:"HS is strongly associated with depression, anxiety and suicidal thoughts. Ask directly. Thoughts with a plan or intent need same-day crisis assessment (NICE NG225).", src:"BAD guideline for HS (2018) · NICE NG225 (2022)"},
         {tone:"amber", h:"🟠 Bowel symptoms", html:"Perianal disease with diarrhoea, weight loss, abdominal pain or rectal bleeding may be Crohn's disease. Check faecal calprotectin and refer to gastroenterology as indicated.", src:"BAD guideline for HS (2018)"}
       ]}
     ]},

    {id:"diagnose", nav:"Diagnose", title:"Diagnosis and differentials", sub:"A clinical diagnosis. No test confirms it.",
     blocks:[
       {b:"kv", rows:[
         ["Typical lesions","Deep, painful inflamed nodules; abscesses; draining tunnels (sinus tracts); bridged or rope-like scars; double-ended comedones"],
         ["Typical sites","Axillae, groin and inner thighs, inframammary and intermammary folds, perineum and perianal area, buttocks; sometimes the nape of the neck or abdominal folds"],
         ["Course","Chronic and relapsing, typically with two or more flares in 6 months; onset usually after puberty, more common in women"],
         ["Triggers","Smoking, obesity, friction, hormonal changes (for example premenstrual flares)"],
         ["Swabs","Not needed for diagnosis. Swab only if there is cellulitis or an unusual presentation; cultures are often negative or show mixed skin flora."]
       ]},
       {b:"table", head:["Differential","Pointers"], rows:[
         ["<b>Boils and carbuncles</b>","Single, not confined to flexures, no tunnels; consider staphylococcal carriage if recurrent"],
         ["<b>Infected epidermoid cyst</b>","Single cyst with a punctum, not recurrent in several sites"],
         ["<b>Cutaneous Crohn's disease</b>","Perianal fistulas, bowel symptoms; may coexist with HS"],
         ["<b>Pilonidal disease</b>","Natal cleft only"],
         ["<b>Other</b>","Lymphogranuloma venereum, actinomycosis, tuberculosis (rare): consider if atypical"]
       ]}
     ]},

    {id:"hurley", nav:"Hurley stage", title:"Staging and assessment", sub:"Hurley staging is quick and guides treatment and referral. Dermatology may also use other scores.",
     blocks:[
       {b:"table", head:["Hurley stage","Features","Usual approach"], rows:[
         ["<b>I (mild)</b>","Single or multiple abscesses without tunnels or scarring","Lifestyle, topical clindamycin, analgesia; tetracycline if more widespread"],
         ["<b>II (moderate)</b>","Recurrent abscesses with tunnel formation and scarring, single or several separated lesions","Tetracycline for 12 weeks; refer to dermatology"],
         ["<b>III (severe)</b>","Diffuse or near-diffuse involvement with multiple interconnected tunnels and abscesses across an entire area","Refer to dermatology; systemic and surgical treatment"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"📋 What to record", html:"Hurley stage per site; number of inflammatory nodules, abscesses and draining tunnels; pain score (0 to 10); DLQI; PHQ-9 where low mood is suspected; BMI and smoking status. These support referral and later assessment of biologic response.", src:"BAD guideline for HS (2018) · NICE TA392 (2016)"},
         {tone:"blue", h:"🩺 Associated conditions", html:"Screen for obesity, diabetes (HbA1c), hypertension and dyslipidaemia, inflammatory bowel disease, inflammatory arthritis (spondyloarthritis), polycystic ovary syndrome, acne and pilonidal disease, and depression.", src:"BAD guideline for HS (2018)"}
       ]}
     ]},

    {id:"treat", nav:"Treat", title:"Treatment in primary care", sub:"Antibiotics are used for their anti-inflammatory effect; the trial needs to be long enough to judge.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Everyone", tone:"green", title:"Lifestyle, pain and wound care", when:"all stages", fromLabel:"",
          html:"Smoking cessation support, weight management, loose clothing, an antiseptic wash (for example chlorhexidine), absorbent non-adherent dressings for draining lesions, and regular analgesia (paracetamol, an NSAID if suitable). Avoid long-term opioids."},
         {step:"Mild, localised", tone:"cream", title:"Topical clindamycin 1%", when:"Hurley I, few lesions", fromLabel:"if localised",
          html:"<span class=mg-dose>Usual adult dose: clindamycin 1% lotion or solution applied twice daily to affected areas for 12 weeks (BAD/SPC; check the SPC, BNF and local formulary; <a href='https://www.medicines.org.uk/emc/search?q=clindamycin%20topical' target=_blank rel=noopener>SPC: clindamycin topical</a>).</span>"},
         {step:"Widespread or Hurley II", tone:"cream", title:"Oral tetracycline for 12 weeks", when:"more extensive disease", fromLabel:"if widespread or not controlled",
          html:"<span class=mg-dose>Usual adult dose: lymecycline 408 mg once daily, or doxycycline 100 mg once daily, for 12 weeks (BAD/SPC; check the SPC, BNF and local formulary; <a href='https://www.medicines.org.uk/emc/search?q=lymecycline' target=_blank rel=noopener>SPC: lymecycline</a>; <a href='https://www.medicines.org.uk/emc/search?q=doxycycline' target=_blank rel=noopener>SPC: doxycycline</a>).</span> Review at 12 weeks; continue if improving, with periodic attempts to stop. Not in pregnancy, breastfeeding or under 12 years. Counsel on photosensitivity (doxycycline) and taking with water while upright."},
         {step:"Not controlled", tone:"amber", title:"Refer to dermatology", when:"Hurley II–III or 12-week failure", fromLabel:"specialist",
          html:"Second-line treatments are specialist-led (see below)."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"🔥 Acute painful flare", html:"Analgesia and warm compresses. Incision and drainage of a tense, fluctuant abscess relieves pain but recurrence at the same site is the rule; it is not a long-term treatment. Specialists may use intralesional triamcinolone for an acute nodule. Use a short antibiotic course only for secondary cellulitis.", src:"BAD guideline for HS (2018)"},
         {tone:"cream", h:"♀️ Hormonal options", html:"For women with premenstrual flares or features of hyperandrogenism, specialists may consider a combined oral contraceptive containing an anti-androgenic progestogen, or spironolactone (off-label). Check contraindications (UKMEC) first.", src:"BAD guideline for HS (2018)"},
         {tone:"blue", h:"💊 Metformin", html:"Specialists sometimes use metformin (off-label), particularly where there is insulin resistance, obesity or polycystic ovary syndrome.", src:"BAD guideline for HS (2018)"},
         {tone:"green", h:"🧠 Psychological support", html:"Offer support for low mood, anxiety and body image, including NHS Talking Therapies, and signpost to HS patient organisations.", src:"BAD guideline for HS (2018)"}
       ]},
       {b:"say", html:"HS is a long-term inflammatory condition of the skin folds. It is not caused by being unclean, and you cannot pass it on. The antibiotics work by calming inflammation, which takes time, so we need to give them about three months before we judge them. Stopping smoking and losing weight, if that applies, really do make a difference."}
     ]},

    {id:"specialist", nav:"Specialist", title:"Specialist treatments", sub:"Started by dermatology; primary care may continue some under shared care.",
     blocks:[
       {b:"table", head:["Treatment","Who","Points for the GP"], rows:[
         ["<b>Clindamycin plus rifampicin</b>","Moderate to severe disease not controlled by tetracyclines","Usually <b>clindamycin 300 mg twice daily with rifampicin 300 mg twice daily for 10 to 12 weeks</b>. Watch for <i>C. difficile</i> diarrhoea. Rifampicin <b>reduces the effect of hormonal contraception</b> (use a non-hormonal or depot method), DOACs, warfarin and many other drugs; turns body fluids orange-red."],
         ["<b>Acitretin, dapsone, ciclosporin</b>","Selected patients","Specialist-led. Acitretin is teratogenic: pregnancy prevention for 3 years after stopping."],
         ["<b>Adalimumab</b> (NICE TA392, 2016)","Active moderate to severe HS in adults not responding to conventional systemic therapy","Continue only if the abscess and inflammatory nodule count falls by at least 25% at 12 weeks (with no rise in abscesses or draining tunnels). Biosimilars are used."],
         ["<b>Secukinumab</b> (NICE TA935, 2023)","Active moderate to severe HS in adults when adalimumab has not worked, is not tolerated or is unsuitable","Response assessed by the specialist at 16 weeks."],
         ["<b>Bimekizumab</b>","Licensed for moderate to severe HS","NICE appraisal terminated (TA1028, 2025): no NICE recommendation; access depends on local decisions."],
         ["<b>Surgery</b>","Persistent tunnels and scarring (Hurley II–III)","Deroofing, local or wide excision, or laser, by dermatology or plastic surgery."]
       ]},
       {b:"warn", html:"<b>Patients on biologics.</b> Treat infections promptly and tell the specialist team; avoid live vaccines; check that annual flu and other recommended vaccines are given; and record the biologic on the GP record so that interactions and infection risk are visible to everyone prescribing."}
     ]},

    {id:"special", nav:"Special groups", title:"Pregnancy, children and comorbidity", sub:"Where the default plan changes.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"🤰 Pregnancy and breastfeeding", html:"Tetracyclines are contraindicated. Topical clindamycin can be used; for systemic treatment, seek dermatology advice (erythromycin or other options). HS may improve or worsen in pregnancy.", src:"BAD guideline for HS (2018) · SPCs"},
         {tone:"cream", h:"🧒 Children", html:"HS before puberty is rare and should prompt referral to paediatric dermatology and assessment for endocrine causes. Tetracyclines are not used under 12 years. Doses per the BNFC.", src:"BAD guideline for HS (2018) · BNFC"},
         {tone:"blue", h:"🩸 Cardiometabolic risk", html:"People with HS have higher rates of obesity, diabetes and cardiovascular risk factors. Offer a cardiovascular risk assessment and treat risk factors.", src:"BAD guideline for HS (2018)"}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral and follow-up", sub:"Earlier referral prevents the scarring and tunnels that make HS hard to treat.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same day", html:"Sepsis or rapidly spreading cellulitis (999 if any sepsis high-risk criterion); suicidal thoughts with plan or intent.", src:"NICE NG253 (2025) · NICE NG225 (2022)"},
         {tone:"purple", h:"Suspected cancer pathway referral", html:"Suspected squamous cell carcinoma in long-standing HS: a non-healing ulcer, growing or hard mass, or bleeding.", src:"NICE NG12 (updated April 2026)"},
         {tone:"amber", h:"Dermatology", html:"Hurley II or III disease; disease not controlled after a 12-week course of a tetracycline; significant impact on quality of life; diagnostic doubt; HS in children.", src:"BAD guideline for HS (2018)"},
         {tone:"amber", h:"Other", html:"Gastroenterology for suspected Crohn's disease; rheumatology for inflammatory joint symptoms; plastic surgery through dermatology for surgical options.", src:"BAD guideline for HS (2018)"}
       ]},
       {b:"table", head:["When","What"], rows:[
         ["12 weeks after starting treatment","Pain, lesion count, DLQI, side effects; decide whether to continue or refer"],
         ["Each review","Smoking, weight, mood, cardiometabolic risk"],
         ["Long-standing perianal or gluteal disease","Examine for ulcers or masses"]
       ]},
       {b:"say", html:"Contact us the same day if you get a high temperature, feel shivery or unwell, or redness spreads quickly around a lump. Tell us if a sore area will not heal, keeps bleeding or forms a hard lump, or if you are feeling low or having thoughts of harming yourself."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card. The Casebook holds the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 26-year-old woman who smokes has had 'boils' in her armpits and groin for six years, treated with five short courses of flucloxacillin. She now has scarring and a draining tract, is missing work and feels embarrassed.", src:"BAD guideline for HS (2018)"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Names <b>HS</b> and explains it (not infection, not hygiene). Stages it (<b>Hurley II</b>). Addresses <b>smoking, weight, pain and mood</b>. Starts a <b>12-week tetracycline</b> with counselling and a review date, and checks contraception and pregnancy. <b>Refers to dermatology</b> because of tunnels and scarring, explaining specialist options. Safety-nets.", src:"BAD guideline for HS (2018) · NICE TA392 (2016)"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Every recommendation on this page traces to a named primary source.",
     blocks:[
       {b:"html", html:"<div class='card'><h3>Evidence panel</h3><ul class='evlist'>"+
         "<li><b>Ingram JR et al. British Association of Dermatologists guidelines for the management of hidradenitis suppurativa (acne inversa) 2018. Br J Dermatol 2019;180:1009–17</b><br><a href='https://doi.org/10.1111/bjd.17537' rel='noopener'>doi.org/10.1111/bjd.17537</a><span class='rd'> — diagnosis, lifestyle, topical clindamycin, tetracyclines for 12 weeks, clindamycin with rifampicin, adalimumab, surgery, comorbidity screening (no later BAD update found, October 2026)</span></li>"+
         "<li><b>NICE TA392 — Adalimumab for treating moderate to severe hidradenitis suppurativa (2016)</b><br><a href='https://www.nice.org.uk/guidance/ta392' rel='noopener'>nice.org.uk/guidance/ta392</a><span class='rd'> — eligibility, 12-week response rule</span></li>"+
         "<li><b>NICE TA935 — Secukinumab for treating moderate to severe hidradenitis suppurativa (December 2023)</b><br><a href='https://www.nice.org.uk/guidance/ta935' rel='noopener'>nice.org.uk/guidance/ta935</a><span class='rd'> — after adalimumab, 16-week assessment</span></li>"+
         "<li><b>NICE TA1028 — Bimekizumab for treating moderate to severe hidradenitis suppurativa (terminated appraisal, January 2025)</b><br><a href='https://www.nice.org.uk/guidance/ta1028' rel='noopener'>nice.org.uk/guidance/ta1028</a><span class='rd'> — no NICE recommendation</span></li>"+
         "<li><b>NICE NG12 — Suspected cancer (updated April 2026)</b>, <b>NICE NG141 — Cellulitis (2019)</b>, <b>NICE NG253 — Suspected sepsis in people aged 16 or over (2025)</b>, <b>NICE NG225 — Self-harm (2022)</b><br><a href='https://www.nice.org.uk/guidance/ng12' rel='noopener'>nice.org.uk/guidance/ng12</a> · <a href='https://www.nice.org.uk/guidance/ng141' rel='noopener'>ng141</a> · <a href='https://www.nice.org.uk/guidance/ng253' rel='noopener'>ng253</a> · <a href='https://www.nice.org.uk/guidance/ng225' rel='noopener'>ng225</a><span class='rd'> — urgent pathways</span></li>"+
         "<li><b>SPCs — clindamycin (topical and oral), lymecycline, doxycycline, rifampicin</b><br><a href='https://www.medicines.org.uk/emc' rel='noopener'>medicines.org.uk/emc</a><span class='rd'> — doses, contraindications, interactions</span></li>"+
         "</ul></div>"}
     ]}
  ],
  foot:"Hidradenitis suppurativa in primary care — BAD guideline (2018), NICE TA392, TA935 and TA1028, NICE NG12. Specialist treatments are started by dermatology. Not a substitute for clinical judgement."
});
