  lead:'<div class="mg-layers"><a href="#confirm"><b>Diagnosis</b><small>NG219 tiers + urate rule</small></a><a href="#ladder"><b>Management</b><small>Flare \u2192 ULT to target</small></a><a href="#refer"><b>Refer</b><small>Triggers + scripts</small></a><a href="../../cases/gout.html"><b>Casebook chapter</b><small>Full teaching case \u2192</small></a></div>',
  quickSub:"If you read nothing else on this page, read these five cards. Every number traces to the recommendation cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"\u26a0 Exclude the septic joint first", html:"Always consider septic arthritis in an acutely hot, swollen joint. <b>Arrange urgent aspiration and same-day hospital/specialist assessment when infection is suspected</b>, the patient is systemically unwell, there are important risk factors (immunosuppression, diabetes, significant comorbidity), the joint is prosthetic, or the diagnosis is uncertain. <b>Do not inject steroid until infection has been adequately excluded</b>. Gout and sepsis can co-exist."},
    {tone:"amber", h:"Recognise, then confirm", html:"<b>Suspect</b> gout with rapid-onset severe pain, redness and swelling of one or both 1st MTP joints, or tophi. <b>Consider</b> it in other joints or with chronic inflammatory joint pain. <b>Serum urate \u2265360 \u00b5mol/L</b> supports gout but is not diagnostic by itself \u2014 urate dips in a flare, so if it is lower and suspicion remains strong, repeat it at least 2 weeks after the flare has settled. Crystal identification remains the definitive test where confirmation is required. <span class='mg-src'>NG219 1.1</span>"},
    {tone:"blue", h:"Treat the flare early", html:"Choose one first-line option: an <b>NSAID</b> (with gastroprotection when indicated), <b>colchicine</b> (dose per current product information/local formulary, after checking renal and hepatic function and interacting medicines), or a <b>short course of oral corticosteroid</b>. Choose by renal, GI and cardiovascular risk, anticoagulation, diabetes, infection risk, interactions and patient preference; use the local formulary for the exact regimen. <b>Never stop established urate-lowering therapy during a flare.</b>"},
    {tone:"cream", h:"Then treat the urate", html:"Discuss <b>urate-lowering therapy</b> with everyone with gout, and offer it for multiple or troublesome flares, CKD stage 3\u20135, diuretic therapy, tophi or chronic gouty arthritis \u2014 first-line <b>allopurinol or febuxostat</b> by comorbidity and preference (allopurinol first-line in major cardiovascular disease). Allopurinol commonly starts at 100 mg daily, or lower in significant renal impairment, frailty or other high-risk circumstances, increased gradually against monthly urate (smaller increments in CKD). Start <b>at least 2\u20134 weeks after a flare has settled</b>, or during frequent flares with effective anti-inflammatory cover, and offer <b>colchicine flare prophylaxis</b> while the target is reached (often up to 6 months). Usually lifelong. <span class='mg-src'>NG219 1.5</span>"},
    {tone:"green", h:"Target, not dose", html:"<b>Urate &lt;360 \u00b5mol/L</b> \u2014 consider <b>&lt;300</b> in tophaceous gout, chronic gouty arthritis or ongoing frequent flares despite a level below 360 (individualise: evidence for the lower target is limited). \u201cOn 100 mg for five years, still flaring\u201d is under-titration \u2014 the commonest failure in UK gout care."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step is where patients come to harm \u2014 do not skip it.",
  pathway:[
    {title:"Recognise", html:"Rapid onset (&lt;24 h to peak), hot, red, exquisitely tender joint \u2014 1st MTP in about half (podagra), also midfoot, ankle, knee, wrist, hand. Can't bear the bedsheet. Untreated flares settle over 1\u20132 weeks."},
    {title:"Exclude sepsis", html:"Always consider sepsis. Infection suspected, systemically unwell, immunosuppression, significant comorbidity, prosthetic joint or diagnostic uncertainty \u2192 <b>same-day hospital/specialist assessment and aspiration; no steroid injection until infection is excluded</b>. Clinically typical recurrent gout in a well patient \u2192 treat according to comorbidity and local protocol. CRP and white count do not distinguish gout from infection.", alert:true},
    {title:"Confirm and stage", html:"Serum urate \u2265360 supports it but is not diagnostic; repeat \u22652 weeks after the flare settles if lower. Record the urate before or around starting ULT, but titrate to the current urate and clinical response. Assess burden: flares per year, tophi, joint damage, stones, CKD."},
    {title:"Treat the flare", html:"One of an NSAID (gastroprotection when indicated), colchicine (renal/hepatic and interaction-specific dosing) or a short oral corticosteroid course \u2014 chosen by comorbidity and preference; monotherapy first. Rest, elevate, ice. Continue any existing allopurinol or febuxostat."},
    {title:"Treat to target", html:"Renal function \u2192 review urate-raising drugs \u2192 start allopurinol or febuxostat 2\u20134 weeks after the flare settles (or during frequent flares with anti-inflammatory cover), with flare prophylaxis if chosen \u2192 monthly urate until &lt;360 (consider &lt;300 if tophi, chronic gouty arthritis or frequent flares) \u2192 annual review, lifelong; continue ULT through flares."}
  ],
  sections:[

    {id:"confirm", nav:"Confirm", title:"Confirming the diagnosis", sub:"The NG219 recognition tiers, the serum-urate rule that catches people out, and the mimics. This is the diagnostic core of the page.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"<b>Suspect</b> gout", html:"Rapid-onset (often overnight) severe pain, redness and swelling in <b>one or both 1st MTP joints</b>, <b>or</b> the presence of <b>tophi</b> \u2014 look at ears, elbows and fingers.", src:"NG219 1.1.1"},
         {tone:"blue", h:"<b>Consider</b> gout", html:"The same rapid-onset picture in <b>other joints</b> \u2014 midfoot, ankle, knee, wrist, fingers \u2014 or in someone with <b>chronic inflammatory joint pain</b>. Gout here is routinely mislabelled as cellulitis or osteoarthritis.", src:"NG219 1.1.2"}
       ]},
       {b:"dl", rows:[
         ["Typical course","Peaks within 24 h; self-resolves over 1\u20132 weeks even untreated. Recurrent attacks, intercritical periods and tophaceous deposits follow if urate stays high"],
         ["Serum urate <span class='mg-src'>NG219</span>","<b>\u2265360 \u00b5mol/L supports gout but is not diagnostic by itself</b> \u2014 hyperuricaemia is common without gout, and urate <b>dips during a flare</b>: if &lt;360 and clinical suspicion remains strong, <b>repeat it at least 2 weeks after the flare has settled</b>. A normal level mid-flare excludes nothing. Crystal identification remains the definitive test where diagnostic confirmation is required"],
         ["Record the urate","Record the serum urate before or around the time of starting ULT, but titrate according to the current serum urate and clinical response rather than a single historical value"],
         ["Aspirate when in doubt","Negatively birefringent needle crystals confirm gout, and the same sample excludes sepsis and CPPD (positively birefringent rhomboids \u2014 older patients, knee or wrist, chondrocalcinosis on X-ray)"],
         ["Imaging alternative","X-ray, ultrasound (<b>double-contour sign</b>) or <b>dual-energy CT</b> where aspiration cannot be done \u2014 but never delay admission for imaging"]
       ]},
       {b:"cards", items:[
         {tone:"cream", h:"CPPD (pseudogout)", html:"Older patient, knee or wrist, chondrocalcinosis \u2014 positively birefringent rhomboid crystals."},
         {tone:"cream", h:"Cellulitis", html:"Spreading erythema beyond the joint, no crystal history \u2014 and gout is frequently misdiagnosed as cellulitis over the midfoot."},
         {tone:"cream", h:"Other inflammatory arthritis", html:"Rheumatoid, psoriatic or reactive arthritis if polyarticular or atypical \u2014 refer if the picture is unclear."}
       ]},
       {b:"why", html:"A classic podagra presentation is specific enough that NICE NG219 (2022) allows a confident clinical diagnosis without aspiration, reserving crystal confirmation for atypical or uncertain cases. Serum urate falls during an acute flare as an acute-phase effect, so a value below 360 at presentation in a convincing case is misleading and must be rechecked once settled."}
     ]},

    {id:"severe", nav:"Red-flag branch", title:"The septic joint \u2014 the branch that must come first", sub:"An untreated septic joint can be destroyed within days and can be fatal. Always consider septic arthritis in an acutely hot, swollen joint, and arrange urgent aspiration when infection is suspected or the diagnosis is uncertain.",
     blocks:[
       {b:"warn", html:"<b>Hot swollen joint with suspected infection, systemic upset, important risk factors, a prosthetic joint or diagnostic uncertainty \u2192 urgent aspiration and same-day hospital/specialist assessment BEFORE any steroid.</b> NICE recommends urgent referral when septic arthritis is suspected; it does not require aspiration of every gout-like presentation. Gout and sepsis co-exist \u2014 a known gout patient can still have an infected joint. Never inject steroid into a possibly septic joint."},
       {b:"cards", cols:2, items:[
         {tone:"red", h:"Highest risk \u2014 admit and aspirate", html:"Fever or systemic upset, immunosuppression, diabetes, prosthetic joint, IV drug use, significant comorbidity, or simply the unwell patient."},
         {tone:"amber", h:"Diagnostic uncertainty \u2014 aspirate, don't guess", html:"Send for microscopy, Gram stain, culture and crystal analysis. <b>CRP and white count do not distinguish gout from infection</b> \u2014 only the aspirate does."},
         {tone:"green", h:"Typical recurrent gout, well patient", html:"A clinically typical recurrent podagra in a well patient with established, crystal-proven gout may be treated clinically. Where the diagnosis has not previously been confirmed, consider aspiration when feasible."}
       ]},
       {b:"why", html:"Septic and crystal arthritis share the cardinal features of a hot, red, exquisitely tender joint, and inflammatory markers cannot separate them. The only reliable way to exclude infection in a single hot joint is aspiration with Gram stain and culture \u2014 which is why aspiration is arranged urgently whenever infection is suspected, the patient is unwell or at high risk, or the diagnosis is uncertain."}
     ]},

    {id:"workup", nav:"Work-up", title:"Work-up \u2014 the bloods a gout diagnosis should trigger", sub:"Gout is a metabolic disease. The flare is often the door through which four other conditions are found.",
     blocks:[
       {b:"cards", items:[
         {tone:"blue", h:"Baseline assessment", html:"<b>U&amp;E and eGFR</b> before colchicine and ULT (guides allopurinol starting dose and colchicine dosing). <b>LFTs</b> where relevant, particularly before and during febuxostat. <b>BP, HbA1c, lipids and weight</b> to address comorbidity and cardiovascular risk (standard QRISK/NICE assessment) \u2014 not as diagnostic tests for gout."},
         {tone:"blue", h:"Find the driver", html:"Thiazide and loop diuretics, low-dose aspirin (minor), <b>ciclosporin</b>, alcohol, chemotherapy (tumour lysis), recent surgery, dehydration."},
         {tone:"blue", h:"NG12 \u2014 no criterion applies", html:"Gout is <b>not</b> a NICE NG12 suspected-cancer criterion, so there is no suspected cancer pathway referral from this diagnosis. See <a href=\"#refer\">Refer</a> for the one situation in which the picture should be switched to an NG12 pathway.", src:"NICE NG12 (updated April 2026)"}
       ]},
       {b:"dl", rows:[
         ["Assess the burden","Flares per year, tophi, joint damage, urate stones, CKD stage, diuretic use, cardiovascular and metabolic disease \u2014 this is what decides how hard you push ULT"],
         ["Young onset","Gout under 30 warrants a look for enzyme defects or renal disease \u2014 and specialist input"]
       ]}
     ]},

    {id:"flare", nav:"Treat the flare", title:"Killing the flare \u2014 choose by the patient", sub:"All three options work. The choice is driven entirely by kidneys, gut, heart and interactions.",
     blocks:[
       {b:"table", head:["Option","Dose (local formulary / product information)","Best for / avoid"], rows:[
         ["<b>NSAID</b>","Regimen per local formulary and current product information (e.g. naproxen or ibuprofen at anti-inflammatory dose) <b>with gastroprotection when indicated</b>, until 1\u20132 days after resolution","Young, kidneys fine, no GI or CV risk. <b>Avoid:</b> CKD, heart failure, anticoagulated, GI bleed history, on ACEi + diuretic (triple whammy)"],
         ["<b>Colchicine</b>","<b>Dose per current UK product information/local formulary</b> \u2014 lowest effective dose; check renal and hepatic function and interacting medicines first. Do not repeat courses without reviewing cumulative exposure. Works best started early","NSAID-unsuitable patients. <b>Renal impairment: reduce, avoid or seek specialist advice per the current SPC/local renal protocol</b>; caution in hepatic impairment, older/frail patients and low body weight. <b>Interactions: clarithromycin, erythromycin, azole antifungals, ciclosporin, verapamil, diltiazem, some HIV medicines and other P-gp/CYP3A4 inhibitors</b>; increased myotoxicity with statins, particularly in renal impairment. <b>Stop and seek urgent advice for significant diarrhoea or vomiting, muscle pain or weakness, neuropathy, marked fatigue, bruising, sore throat or other signs of marrow suppression</b> \u2014 diarrhoea is common and may be an early sign, but serious toxicity can occur without it"],
         ["<b>Prednisolone</b>","<b>A short course</b> (e.g. 30\u201335 mg once daily for 3\u20135 days) <b>or a locally agreed taper</b>, chosen by severity and response \u2014 a short course may lead to rebound in some","Where NSAIDs and colchicine are unsuitable, or by preference. CKD or polyarticular disease may need specialist guidance (older BSR practice used longer courses in selected patients). Caution: diabetes (warn and monitor sugars), heart failure (fluid), psychiatric history"],
         ["<b>Intra-articular steroid</b>","Methylprednisolone or triamcinolone into the joint (off-label)","Consider IA or IM corticosteroid when NSAIDs and colchicine are contraindicated, not tolerated or ineffective. IA injection requires appropriate expertise and only when septic arthritis has been <b>adequately excluded</b>"],
         ["<b>Combination \u2014 not routine</b>","NSAID or colchicine + steroid, in selected cases only","Use monotherapy initially where possible. Reserve combination for selected severe or polyarticular flares after reviewing renal, GI, cardiovascular and interaction risks (GI bleeding, renal injury, fluid retention, hyperglycaemia, colchicine toxicity); consider specialist or hospital assessment if systemically unwell"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"Adjuncts and the rescue plan", html:"Rest, elevate, ice for 20 minutes several times daily. Put the flare drug in the bathroom cabinet <b>before</b> the next attack with written self-start instructions."},
         {tone:"red", h:"Already on urate-lowering therapy?", html:"<b>Keep the allopurinol or febuxostat going through the flare.</b> Stopping and restarting yo-yos the urate and provokes more attacks. If already on prophylactic colchicine, treat the breakthrough with an NSAID or steroid \u2014 don't stack full-dose colchicine on top."}
       ]},
       {b:"why", html:"NSAIDs are limited by renal impairment, GI and cardiovascular risk; colchicine by diarrhoea, renal and hepatic dosing and its CYP3A4/P-gp interactions; corticosteroids are the pragmatic choice in CKD or polypharmacy. Maintaining established urate-lowering therapy through a flare avoids the urate flux that itself triggers attacks."}
     ]},

    {id:"lifestyle", nav:"Lifestyle", title:"Lifestyle and deprescribing \u2014 supportive, not a substitute for ULT", sub:"Real, but not a substitute for urate-lowering therapy. The error runs both ways: lecturing about diet instead of starting allopurinol, or starting allopurinol without touching the beer and the bendroflumethiazide.",
     blocks:[
       {b:"table", head:["Change","What to advise","Why it matters"], rows:[
         ["<b>Alcohol</b>","Reduce excessive alcohol intake. Ask honestly at every review","Lifestyle measures support health but do not replace ULT \u2014 NICE found insufficient evidence that any specific diet prevents flares or lowers serum urate"],
         ["<b>Fructose</b>","Avoid sugar-sweetened drinks","Part of a healthy, balanced diet"],
         ["<b>Purines</b>","Advise a healthy, balanced diet. <b>Do not prescribe a restrictive \u201cgout diet\u201d</b>","Effect is small next to ULT, and restrictive diets reduce adherence to what actually works"],
         ["<b>Weight</b>","Gradual loss only \u2014 <b>crash diets provoke flares</b>","Ketosis raises urate acutely"],
         ["<b>Swap the driver</b>","Review whether a thiazide or loop diuretic remains necessary. If it is for hypertension and an alternative is clinically suitable, discuss substitution \u2014 for example a calcium-channel blocker or <b>losartan</b>. Do not withdraw an essential diuretic (heart failure, difficult-to-control hypertension) without addressing the underlying indication. Continue low-dose aspirin when indicated for cardiovascular prevention","Its minor urate effect is not a reason to stop aspirin"],
         ["<b>Hydration</b>","Encourage adequate hydration unless contraindicated, with individual advice in heart failure, CKD, frailty, hyponatraemia or fluid restriction \u2014 no universal fluid volume","Supports excretion and reduces stone risk"],
         ["<b>The cluster</b>","Screen and treat BP, HbA1c, lipids and CKD","Gout is a cardiovascular risk marker, not just a joint problem \u2014 but it does not replace standard QRISK/NICE cardiovascular assessment"]
       ]}
     ]},

    {id:"ladder", nav:"Treatment ladder", title:"Urate-lowering therapy \u2014 low start, flare cover, titrate to target", sub:"Discuss ULT with everyone with gout; NICE NG219 1.5.1 says offer it, treat-to-target, where there are multiple or troublesome flares, CKD stage 3\u20135, diuretic therapy, tophi or chronic gouty arthritis, and it is also worth pressing where there are urate stones or young onset. Discuss it after a first attack rather than defaulting to waiting. Start ULT at least 2\u20134 weeks after a flare has settled; if flares are frequent, it may be started during a flare provided effective anti-inflammatory treatment has also been started and the patient is appropriately monitored.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1st", title:"Allopurinol \u2014 start low, go slow, don't stop", when:"first-line (febuxostat an alternative); first-line in major CV disease",
          html:"<b>Start low \u2014 commonly 100 mg once daily, or lower in significant renal impairment, frailty or other high-risk circumstances (not for age alone) \u2192 increase gradually every ~4 weeks according to serum urate and tolerability, with smaller increments in CKD</b> \u2192 the maintenance dose varies widely; do not stop titration at 300 mg if urate remains above target. Maximum doses and renal restrictions follow the current product information and local formulary (Greater Manchester formulary for tablet strengths). CKD is <b>not</b> a bar \u2014 titrate more slowly with renal monitoring. <b>First-line where there is major cardiovascular disease</b> (previous MI, stroke, unstable angina). <b>Counsel the DRESS/SJS warning:</b> any rash in the first weeks \u2192 stop and seek same-day advice (highest risk: CKD, and Han Chinese, Thai or Korean ancestry). Consider HLA-B*58:01 testing in populations with increased prevalence according to current UK/local policy; do not delay appropriate ULT where the test is unavailable, and discuss higher-risk cases with rheumatology. <b>Any new rash on allopurinol needs immediate assessment</b> \u2014 the patient stops the drug and seeks urgent advice until assessed."},
         {step:"Cover", title:"Flare prophylaxis alongside \u2014 individualised duration", when:"offer while reaching target, if chosen and safe",
          fromLabel:"mobilising urate provokes flares",
          html:"<b>Colchicine</b> (low dose per product information, by renal function) is first-line, offered while the serum urate target is being reached if the patient chooses prophylaxis and it is safe. Review renal function, interactions and adverse effects, and continue for an appropriate duration \u2014 often up to 6 months \u2014 according to ongoing flares, tophi, ULT titration and tolerance. Where colchicine is unsuitable: low-dose NSAID with gastroprotection, or low-dose corticosteroid (e.g. prednisolone \u22645 mg \u2014 a specialist/local alternative, not a routine self-management prescription). Without cover, early flares convince patients that allopurinol \u201ccaused\u201d their gout \u2014 the number-one reason ULT is abandoned."},
         {step:"Target", title:"Treat to TARGET, not to dose", when:"urate every 4 weeks while titrating",
          fromLabel:"the discipline that works",
          html:"<b>&lt;360 \u00b5mol/L \u2014 consider &lt;300 in tophaceous gout, chronic gouty arthritis or ongoing frequent flares despite &lt;360</b> (individualised; evidence for the optimal lower target is limited) \u2014 then annually, lifelong. Tophi take months to years to dissolve below 300."},
         {step:"Or", title:"Febuxostat", when:"first-line alternative by comorbidity and preference, or allopurinol contraindicated, not tolerated or ineffective",
          fromLabel:"with the CV caveat",
          html:"<b>80 mg once daily \u2192 120 mg if urate is not &lt;360 after 2\u20134 weeks.</b> No dose change needed in mild-to-moderate CKD. <b>Use allopurinol first-line in major cardiovascular disease</b> (NICE NG219). Current MHRA advice: use febuxostat cautiously in pre-existing major cardiovascular disease (MI, stroke, unstable angina), particularly with a high urate crystal/tophus burden or when initiating ULT \u2014 discuss cardiovascular considerations. Stop if signs or symptoms of serious hypersensitivity. LFTs per product information/local protocol. Same flare-cover rules apply."},
         {step:"3rd", title:"Specialist options", when:"both failed or not tolerated",
          fromLabel:"refer, don't abandon",
          html:"Uricosurics (sulfinpyrazone, benzbromarone via specialist); choose antihypertensive, diabetic and renal-protective medicines by their own indication \u2014 <b>losartan</b> or an <b>SGLT2 inhibitor</b> may have favourable urate effects, but neither should be prescribed solely as ULT for gout; combination therapy; IL-1 blockade (anakinra, canakinumab) for refractory flares."}
       ]},
       {b:"warn", html:"<b>The interaction that kills: allopurinol + azathioprine (or 6-mercaptopurine).</b> Xanthine-oxidase inhibition multiplies the thiopurine \u2192 profound marrow suppression. Screen every gout patient's medication list for azathioprine (transplant, IBD, autoimmune disease) <b>before</b> prescribing \u2014 <b>do not co-prescribe routinely</b>. If the combination is intentionally used, it requires a specialist protocol with major thiopurine dose reduction and close blood-count monitoring; contact the relevant specialist before prescribing \u2014 the toxicity can be fatal. Also check <b>ciclosporin</b>, <b>warfarin</b> (recheck the INR after starting) and <b>theophylline</b>, and ACE inhibitors and other medicines adding renal risk during NSAID treatment."}
     ]},

    {id:"monitor", nav:"Monitoring", title:"Monitoring, review and safety-netting", sub:"Urate-led titration is the whole game. Everything here has an action threshold attached.",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["Serum urate","<b>Every 4 weeks while titrating</b> \u2192 annually once at target","Above target \u2192 next dose step. At target \u2192 hold and check annually"],
         ["U&amp;E / eGFR","Baseline (before colchicine and ULT), with each titration in CKD, then annually where relevant","Guides allopurinol pace, colchicine dosing and flare-drug choice"],
         ["LFTs","Febuxostat: per the product information/local protocol; otherwise when clinically indicated","Significant rise \u2192 stop or switch"],
         ["Flares and tophi","Every review","Flares while titrating are expected \u2014 check the cover is working. If flares continue despite confirmed adherence and sustained urate &lt;360 \u2192 check the actual urate results and timing, whether attacks are crystal-proven, CPPD or another inflammatory arthritis, infection and interactions; reassess the diagnosis and consider &lt;300 per NICE criteria, particularly in tophaceous or chronic gouty arthritis"],
         ["Flare prophylaxis","Review regularly (often up to 6 months)","Individualise: stop once at target and flare-free if tolerated; continue longer for ongoing flares, tophi or titration; review renal function, interactions and adverse effects; keep a rescue supply"],
         ["The metabolic annual","BP, HbA1c, lipids, weight, QRISK","Gout is a cardiovascular risk marker \u2014 treat the cluster"],
         ["Adherence","Every contact","A daily tablet forever, flares or not \u2014 the single message that determines success"],
         ["Annual review once at target","Annually","Serum urate (NICE: consider annually), renal function where relevant, adherence, flares, tophi, adverse effects, interacting medicines, cardiovascular and metabolic risk"]
       ]},
       {b:"cards", items:[
         {tone:"amber", h:"Still flaring? Check before calling it refractory", html:"<b>1</b> Taking it daily? (refill history \u2014 many take allopurinol \u201cfor attacks\u201d like an antibiotic). <b>2</b> Dose stuck at 100 mg or 300 mg? Titrate to target \u2014 the required dose varies widely. <b>3</b> Was flare cover given? <b>4</b> Drivers still running \u2014 beer, sugary drinks, the thiazide nobody swapped? <b>5</b> Right diagnosis \u2014 CPPD, sepsis, reactive or psoriatic arthritis? <b>6</b> Genuinely refractory \u2192 rheumatology."}
       ]},
       {b:"say", html:"There are two jobs: today's fire, and the chemistry that keeps lighting it. The flare tablets put the fire out; the daily allopurinol drains the fuel \u2014 slowly, over months, and only if we push the dose until your blood level is under target. Expect a few flares early on \u2014 that's the crystals dissolving, not the tablet failing \u2014 and never stop it during a flare."},
       {b:"cards", items:[
         {tone:"red", h:"\ud83d\udd34 Septic joint", html:"\u201cA hot swollen joint <em>with</em> fever, shivers or feeling properly unwell \u2014 same-day help. It can be an infected joint, which is an emergency.\u201d"},
         {tone:"red", h:"\ud83d\udfe0 Allopurinol rash", html:"\u201cAny rash in the first couple of months \u2014 stop the tablet and contact us the same day. Rarely it signals a serious reaction.\u201d"},
         {tone:"amber", h:"\ud83d\udca9 Colchicine limit", html:"\u201cDiarrhoea, vomiting, muscle pain or weakness, unusual tiredness, bruising or a sore throat on colchicine \u2014 stop it and contact us urgently. Never stockpile doses, and tell any prescriber you're on it before starting new antibiotics.\u201d"},
         {tone:"amber", h:"\ud83d\udd25 Flare not settling", html:"\u201cIf the attack isn't improving after a few days of treatment, or it spreads to other joints with fever, or you pass much less urine than usual, contact us the same day.\u201d"},
         {tone:"green", h:"\ud83d\udc8a The forever rule", html:"\u201cThe daily tablet continues through flares, through good spells, for life \u2014 stopping is what brings gout back.\u201d"}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer \u2014 rheumatology, and who we keep", sub:"Continue the flare plan and ULT titration while any referral is pending, unless the specialist advises otherwise.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same day", html:"Suspected septic arthritis (including a prosthetic joint, immunosuppression or significant comorbidity) \u2192 aspiration before steroids, admission. Systemically unwell with a polyarticular flare."},
         {tone:"amber", h:"Diagnostic doubt", html:"Diagnosis uncertain (NICE NG219): atypical joints, young onset \u2014 particularly under 30 (enzyme defects, renal disease) \u2014 or where crystal confirmation is needed."},
         {tone:"blue", h:"Treatment failure", html:"ULT contraindicated, not tolerated or ineffective; urate &gt;360 despite maximum tolerated ULT; recurrent gout despite confirmed adherence and urate at target; severe tophaceous disease; need for IL-1 inhibition or specialist uricosuric therapy."},
         {tone:"blue", h:"Intolerance", html:"Allopurinol hypersensitivity \u2014 especially after a rash, where desensitisation and alternatives are specialist calls \u2014 with febuxostat also unsuitable."},
         {tone:"blue", h:"CKD 3b\u20135, transplant, complex interactions", html:"<b>CKD stage 3b\u20135 (eGFR &lt;45)</b> and <b>organ transplant</b> recipients (NICE NG219); complex drug interactions, especially azathioprine/6-mercaptopurine or ciclosporin; urate nephrolithiasis or urate nephropathy."},
         {tone:"purple", h:"When it is <em>not</em> gout <span class='tw'>NG12</span>", html:"Gout has no suspected cancer pathway. But if the picture turns out to be an <b>unexplained bone or soft-tissue lump</b>, or <b>unexplained bone pain with weight loss</b>, switch to the relevant NG12 sarcoma or myeloma route rather than managing it as crystal disease."}
       ]},
       {b:"say", html:"Gout is one of the few kinds of arthritis we can effectively switch off \u2014 but the part people miss is that the daily tablet has to be pushed up until your blood level hits the target, and then kept there for good. Do that and the attacks stop; skip it and they always come back."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only \u2014 the Casebook keeps the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 58-year-old man, third attack this year, on bendroflumethiazide for hypertension, drinks 30 units a week, wants \u201csomething stronger for when it flares\u201d and is resistant to a daily tablet."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Excludes sepsis; explains flare versus prevention; addresses the thiazide and the alcohol without lecturing; explains that early flares on allopurinol are expected and covers them; negotiates a lifelong tablet with a rescue plan. <a href='../../cases/gout.html'>Open the full casebook chapter \u2192</a>"}
     ]}]},
