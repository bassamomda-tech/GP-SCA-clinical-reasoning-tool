<script>
MG.render({
  icon:"🦵",
  title:"Greater trochanteric pain syndrome — the complete guide",
  eyebrow:"Protocol · adults · lateral hip pain",
  stemTitle:"GTPS is a clinical syndrome of lateral hip pain, usually gluteal tendinopathy — confirm it on examination, exclude the hip joint, the spine and red flags, then educate and progressively reload",
  stemSub:"For <b>suspected or clinically diagnosed GTPS</b> in primary care. GTPS is lateral peritrochanteric hip pain, most commonly from gluteus medius/minimus tendinopathy, with or without bursopathy or partial tendon tearing. Confirm it with a focused hip, lumbar and neurological examination, and exclude intra-articular hip disease, fracture, systemic disease and referred spinal pain. <b>First-line care is education, reducing compressive load and progressive gluteal strengthening.</b> Analgesia supports rehabilitation; a corticosteroid injection gives short-term relief only and is selective; shockwave therapy is only for refractory GTPS through an appropriately governed specialist/MSK service, with NICE special arrangements for governance, consent and audit. “Trochanteric bursitis” should not be used as a synonym for all GTPS.",
  guideline:"NICE HTG248 (shockwave therapy) · NICE NG226 · SPS NSAID monitoring · local MSK pathway · BNF",
  reviewed:"25 September 2026",
  nextReview:"25 September 2027",
  meta:[
    {t:"Exercise is first-line", tone:"ok"},
    {t:"Injection: selective, short-term", tone:"tw"},
    {t:"v2.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#diagnose"><b>Diagnose</b><small>Examine</small></a><a href="#exclude"><b>Exclude</b><small>Hip · spine · red flags</small></a><a href="#rehab"><b>Rehab</b><small>Load + exercise</small></a><a href="#relief"><b>Relief</b><small>Analgesia · injection</small></a><a href="#refer"><b>Refer</b><small>Image · MSK</small></a></div>',
  quickSub:"The five that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"blue", h:"A clinical syndrome, not a single pathology", html:"Lateral hip pain, worse lying on the affected side, on stairs and on single-leg loading, with <b>focal peritrochanteric tenderness together with pain reproduced by resisted hip abduction and/or single-leg loading</b>, and no dominant alternative diagnosis. No single test confirms GTPS, and tenderness alone is not diagnostic. <b>Marked objective abductor weakness, a Trendelenburg gait or inability to maintain single-leg stance should prompt consideration of a significant gluteal tendon tear.</b> Bilateral symptoms happen and do not by themselves suggest systemic disease."},
    {tone:"amber", h:"Think joint and spine, not just tendon", html:"Groin-dominant pain, painful or restricted internal rotation, catching or locking, or a positive impingement test → assess for intra-articular hip pathology. Back pain, dermatomal symptoms, a neurological deficit or pain reproduced by spinal movement → a spinal contribution. <b>Either can coexist with GTPS.</b>"},
    {tone:"green", h:"Education and progressive loading work best", html:"Initially reduce compressive load (no leg-crossing, no hanging on one hip, pillow between the knees — load-management strategies, not permanent restrictions), avoid complete rest, keep active, and progressively strengthen the hip abductors and extensors. This is the <b>preferred first-line treatment and the best longer-term strategy for most people</b>."},
    {tone:"amber", h:"Injection is an adjunct, not a cure", html:"A peritrochanteric corticosteroid injection can give short-term relief to enable rehabilitation; relief is usually short term, symptoms commonly recur, and injection does not replace progressive rehabilitation. Consider it only after the diagnosis is secure and a structured programme has been tried — or earlier if pain is preventing rehabilitation. <b>A time point alone should not trigger an injection.</b>"},
    {tone:"red", h:"⚠ Red flags — do not assume uncomplicated GTPS", html:"Inability to weight-bear, severe pain after trauma, fracture risk (osteoporosis, long-term steroids), pain out of proportion to the examination, fever or a hot swollen area, unexplained weight loss, persistent, progressive or disproportionate night/rest pain, previous or active cancer (especially with systemic or progressive symptoms), a palpable mass, or rapidly progressive symptoms. <b>A hot, painful hip with systemic features requires same-day hospital assessment.</b>"}
  ],
  pathwaySub:"Five steps. The examination decides the rest.",
  pathway:[
    {title:"Examine the hip, the spine and the nerves", html:"Gait and weight-bearing · trochanteric and gluteal tendon palpation · resisted hip abduction (resisted external rotation is less established and optional) · single-leg stance if safe · hip range, especially internal rotation · FABER/FADIR when intra-articular pathology is suspected (not mandatory in every patient) · lumbar and sacroiliac examination · power, reflexes, sensation · Trendelenburg gait, leg length.", alert:true},
    {title:"Exclude the mimics and the red flags", html:"Hip OA, impingement, labral tear, occult or insufficiency fracture, avascular necrosis, inflammatory arthritis, referred lumbar pain, infection, malignancy."},
    {title:"Educate and reload", html:"Reduce compression and high abductor load, avoid complete rest, progressive abductor and extensor strengthening. A trial of approximately 8–12 weeks is reasonable where the diagnosis is secure and there is no significant weakness or red flag; review earlier if pain is severe, function is deteriorating, adherence is poor or a tendon tear is suspected."},
    {title:"Support with analgesia; inject selectively", html:"Analgesia only to support rehabilitation. Consider a single peritrochanteric injection if pain is preventing rehabilitation or remains disabling despite an initial programme, after re-examining the diagnosis."},
    {title:"Image or refer if it does not fit or does not progress", html:"Suspected tear, marked weakness, red flags, diagnostic uncertainty or failure of an adequate, adherent programme. Link imaging to a clinical question — not to a fixed number of weeks."}
  ],
  sections:[

    {id:"diagnose", nav:"Diagnose", title:"Step 1 — confirm the clinical syndrome",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>What it is</b>","A clinical syndrome of lateral peritrochanteric hip pain, most commonly gluteus medius/minimus tendinopathy, with or without bursopathy or partial tendon tearing. Mixed pathology can occur — bursitis is not synonymous with GTPS"],
         ["<b>History</b>","Lateral hip pain, worse lying on that side, on stairs, hills, single-leg stance and prolonged walking or standing"],
         ["<b>Examination supports GTPS</b>","Focal lateral/peritrochanteric tenderness together with pain reproduced by resisted hip abduction and/or single-leg loading. Resisted abduction may be painful from tendinopathy or pain inhibition; resisted external rotation is less established and is not essential. No single test confirms GTPS. <b>Marked objective abductor weakness, a Trendelenburg gait or inability to maintain single-leg stance → consider a significant gluteal tendon tear</b>"],
         ["<b>Always also examine</b>","Gait and weight-bearing · hip range, especially internal rotation · FABER/FADIR when intra-articular pathology is suspected (not mandatory in every patient) · lumbar spine and sacroiliac joints · power, reflexes and sensation · Trendelenburg gait, abductor weakness, leg-length discrepancy"],
         ["<b>Gluteal tendon tear pointers</b>","Marked objective abductor weakness · Trendelenburg gait · inability to maintain single-leg stance · acute onset after trauma or sudden loading · persistent symptoms despite appropriate rehabilitation"],
         ["<b>Imaging</b>","<b>Not routine</b> when the diagnosis is clinically clear and there are no red flags"]
       ]},
       {b:"why", html:"Lateral trochanteric tenderness alone is not diagnostic — it is common and may coexist with hip osteoarthritis, lumbar referred pain, sacroiliac or pelvic pathology, gluteal tendon tear, fracture and, less commonly, infection or malignancy. The history, functional aggravators and examination findings must be concordant, while important hip, spinal and systemic causes are excluded. It is the combination — the history, focal tenderness, painful or weak resisted abduction and no dominant alternative — that makes the diagnosis."}
     ]},

    {id:"exclude", nav:"Exclude", title:"Step 2 — exclude the joint, the spine and the red flags",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"🟠 Intra-articular hip", html:"Groin-dominant pain, painful or restricted internal rotation, catching or locking, positive impingement test → hip OA, femoroacetabular impingement, labral pathology or avascular necrosis. Hip OA can also cause buttock or lateral pain, and GTPS can radiate anteriorly — so groin pain is a pointer, not a rule."},
         {tone:"amber", h:"🟠 Spinal contribution", html:"Back pain, dermatomal symptoms, neurological deficit, or pain reproduced by spinal movement → consider lumbar referral or radiculopathy. Trochanteric tenderness can still be present, and GTPS may coexist."},
         {tone:"red", h:"🔴 Fracture", html:"Inability to weight-bear, severe pain after trauma, osteoporosis or long-term corticosteroids, or pain out of proportion to the examination → exclude occult or insufficiency fracture. <b>A normal initial radiograph does not reliably exclude an occult hip or pelvic fracture:</b> if fracture is suspected and the radiograph is normal or non-diagnostic, persistent inability to weight-bear or disproportionate pain requires further assessment, usually MRI or CT via the urgent pathway."},
         {tone:"red", h:"🔴 Infection, malignancy, systemic", html:"<b>Persistent, progressive or disproportionate night/rest pain</b> should prompt reassessment for fracture, infection, malignancy, inflammatory disease or intra-articular pathology rather than being assumed to be GTPS — though night pain also occurs with severe tendinopathy, bursopathy or hip OA. <b>Previous or active cancer</b>, particularly with new persistent rest pain, systemic symptoms or abnormal examination → urgent assessment and appropriate imaging through the local pathway. <b>A palpable mass</b> → urgent imaging and, depending on the findings, sarcoma or other specialist referral — not routine MSK care. <b>Suspected septic arthritis</b> (a hot, swollen hip may have few external signs), fever or systemic illness → same-day hospital assessment, not simply an urgent MSK referral. Unexplained weight loss or rapidly progressive symptoms → reconsider. Also consider avascular necrosis and inflammatory arthritis."}
       ]}
     ]},

    {id:"rehab", nav:"Rehab", title:"Step 3 — education and progressive loading",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"⚖️ Reduce compression", html:"Avoid crossing the legs, standing hanging on one hip, and lying directly on the painful side; pillow between the knees in bed. Temporarily modify stairs, hills and prolonged single-leg loading. These are load-management strategies, not permanent restrictions."},
         {tone:"green", h:"🚶 Stay active", html:"Continue tolerable activity and general conditioning while reducing the activities that provoke lateral compression or high abductor load. <b>Progressively reload rather than resting completely.</b>"},
         {tone:"green", h:"🏋️ The loading programme", html:"The aim is not rest or stretching alone. Begin with tolerable isometric or low-load abductor work where necessary → progress to isotonic strengthening of the hip abductors and extensors → controlled single-leg loading → correction of movement and load patterns → task-specific rehabilitation and graded return to walking, stairs, running, sport or work. <b>Progress load according to symptoms, strength and function rather than pain elimination.</b>"},
         {tone:"blue", h:"⏳ An adequate trial", html:"Begin a progressive loading programme and review the response according to severity and function. A trial of approximately 8–12 weeks is reasonable where the diagnosis is secure and there is no significant weakness or red flag — not a mandatory threshold before review, imaging or referral. Review earlier if pain is severe, function is deteriorating, adherence is poor or a tendon tear is suspected. If overweight or obese, offer appropriate weight-management support for general musculoskeletal and metabolic health; weight loss is not a prerequisite for rehabilitation."}
       ]},
       {b:"why", html:"Education and exercise-based rehabilitation are the preferred first-line treatment. In the comparative evidence summarised by NICE, corticosteroid injection gave faster short-term improvement (75% improved at 1 month, 48% at 15 months) but a 12-week home-training programme gave better longer-term outcomes (80% at 15 months). NICE NG226 (osteoarthritis) similarly supports tailored therapeutic exercise, education and weight-management support where appropriate."}
     ]},

    {id:"relief", nav:"Relief", title:"Step 4 — analgesia and selective injection",
     blocks:[
       {b:"table", head:["Option","Use","Safeguards"], rows:[
         ["<b>Simple analgesia or a short NSAID course</b>","Only to support rehabilitation, per the local formulary. A short NSAID trial may be considered for pain relief if appropriate, but evidence for deep peritrochanteric tendinopathy is limited — use the lowest effective dose for the shortest duration","Reduce the paracetamol maximum for low body weight, liver disease, frailty or excess alcohol. Before an oral NSAID, assess gastrointestinal, renal, cardiovascular, hepatic and bleeding risk (renal function, blood pressure, heart failure, ulcer or GI-bleed risk, anticoagulant or antiplatelet use, NSAID-sensitive asthma). Consider gastroprotection according to individual risk and local formulary. Never combine NSAIDs. Generally avoid or seek specialist/pharmacy advice in eGFR below 30 mL/min/1.73 m², AKI, significant heart failure, active peptic ulcer disease or high bleeding risk. For longer courses or high-risk patients, consider baseline and follow-up blood pressure, renal function and FBC according to risk and duration (SPS). A topical NSAID may be tried if the pain is superficial and localised, but benefit is uncertain for deep lateral hip pain and it should not delay rehabilitation or diagnostic reassessment"],
         ["<b>Peritrochanteric corticosteroid injection</b>","Consider a single peritrochanteric injection when pain is preventing rehabilitation or remains disabling despite an initial programme, after re-examining the diagnosis","An adjunct, never first-line. Relief is usually short term and symptoms commonly recur; injection does not repair the tendon or replace progressive rehabilitation. Do not inject directly into the gluteal tendon. Use an aseptic technique; avoid injection through cellulitis, infected or inflamed skin, or suspected infection. Consider bleeding risk, including anticoagulants and antiplatelets, but do not treat antithrombotic therapy as an automatic contraindication. Warn about post-injection flare, infection, skin depigmentation, subcutaneous fat atrophy, tendon damage and bleeding; warn patients with diabetes about transient hyperglycaemia. Avoid repeated injections where benefit is absent or short-lived. Document the site, preparation, dose, consent and response. Consider image guidance when anatomy is uncertain, a significant tendon tear is suspected, the target is difficult to localise, or local MSK policy requires it — ultrasound guidance is not automatically necessary for every peritrochanteric injection"],
         ["<b>Extracorporeal shockwave therapy (ESWT)</b>","Refractory GTPS only, through an appropriately governed specialist or MSK service","<b>Not routine primary-care treatment.</b> NICE HTG248: evidence is limited in quality and quantity, so it is used only with special arrangements for clinical governance, informed consent about uncertain efficacy and safety, written patient information, audit and outcome review (or research), and treatment by clinicians with specific training. Explain that efficacy and safety remain uncertain, pain may occur during or after treatment, and symptoms may worsen"]
       ]},
       {b:"warn", html:"Analgesia should support rehabilitation — not enable continued painful loading."}
     ]},

    {id:"refer", nav:"Refer", title:"Step 5 — imaging and referral",
     blocks:[
       {b:"table", head:["Situation","Action"], rows:[
         ["<b>Typical presentation, concordant examination, no red flags</b>","No routine imaging — a radiograph is not routinely required for clinically typical GTPS"],
         ["<b>Suspected hip OA · significant trauma · inability to weight-bear · fracture risk · marked restriction of hip movement · atypical or persistent symptoms where bony pathology needs assessment</b>","Plain radiograph. If fracture is suspected and the radiograph is normal or non-diagnostic, persistent inability to weight-bear or disproportionate pain → MRI or CT via the urgent pathway"],
         ["<b>Significant tendon tear suspected · marked abductor weakness or Trendelenburg gait · refractory despite adequate rehabilitation · specialist intervention being considered</b>","Ultrasound or MRI, usually via the local MSK pathway. Ultrasound is useful for suspected gluteus medius/minimus tear, marked abductor weakness or Trendelenburg gait, superficial tendon/bursal pathology, and guiding an injection where the target is uncertain (not automatically required for an injection). MRI when ultrasound is inconclusive, major tendon pathology is suspected, symptoms are refractory and specialist intervention is considered, intra-articular, pelvic or occult fracture pathology is suspected, or malignancy, infection or avascular necrosis remains a concern"],
         ["<b>Any imaging request</b>","Link it to a clinical question — avoid imaging simply because symptoms have lasted a fixed number of weeks"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"Same-day hospital assessment", html:"Inability to weight-bear with suspected fracture · suspected septic arthritis or osteomyelitis · severe acute pain with fever or systemic illness · suspected acute neurovascular compromise."},
         {tone:"amber", h:"Urgent imaging or specialist pathway", html:"Suspected malignancy · palpable mass (urgent imaging, then sarcoma or other specialist referral as indicated) · progressive unexplained night/rest pain · suspected occult fracture · rapidly progressive symptoms."},
         {tone:"blue", h:"Specialist MSK / orthopaedic opinion", html:"Suspected full-thickness or major partial gluteal tendon tear · marked Trendelenburg gait or objective abductor weakness · failure of a properly delivered and adherent rehabilitation programme · diagnostic uncertainty · consideration of operative tendon repair. Surgery is reserved for selected structural tendon pathology under specialist care — it is not the usual next step."},
         {tone:"blue", h:"MSK / physiotherapy referral", html:"Persistent symptoms or functional limitation · difficulty implementing or progressing rehabilitation · significant but non-urgent abductor weakness or movement-control problems · recurrent symptoms · a structured return to sport or work · need for specialist injection, ultrasound or ESWT assessment. Confirm the local Greater Manchester MSK route, imaging access and injection service."},
         {tone:"cream", h:"GP management", html:"The examination, the exclusions, the education and loading plan, analgesia and selective injection all belong here. Related pages: <a href='osteoarthritis.html'>osteoarthritis</a> · <a href='../algorithms/hip-pain.html'>hip pain pathway</a> · <a href='sciatica.html'>sciatica</a>."}
       ]},
       {b:"say", html:"The pain is coming from the tissues on the outside of the hip, usually the gluteal tendons — the examination does not suggest a problem inside the hip joint or from the back. It normally gets better with a strengthening programme and simple changes — not lying on that side, not crossing your legs, and not standing hanging on one hip. It can take a few months. An injection can help in the short term if the pain is stopping you doing the exercises, but the exercises are what do the lasting work. Keep generally active. Seek review sooner if you cannot put weight on the leg, develop a fever, lose weight, or have persistent or worsening pain at rest or at night."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 56-year-old woman has had <b>right lateral hip pain for four months</b>, worse lying on her right side at night and climbing stairs. She is tender over the greater trochanter and <b>resisted abduction reproduces the pain</b>; hip internal rotation is full and pain-free, and her back and neurology are normal. She has read about steroid injections and wants one today."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Examines the hip joint, the spine and the nerves rather than relying on tenderness; explains why the findings fit GTPS and not hip OA; explains load reduction and a progressive strengthening programme as the first-line plan; discusses injection honestly — mainly short-term relief, recurrence, risks, not a replacement for rehabilitation — and agrees when it would help (pain preventing rehabilitation) rather than refusing outright; checks NSAID safety before prescribing; and safety-nets for fracture, infection and night or rest pain."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE HTG248 — Extracorporeal shockwave therapy for refractory greater trochanteric pain syndrome</b><br><a href="https://www.nice.org.uk/guidance/htg248" rel="noopener">nice.org.uk/guidance/htg248</a><span class="rd"> — ESWT for refractory GTPS only with special arrangements for clinical governance, consent and audit or research (recommendations and procedure chapter); the comparative evidence on injection versus 12-week home training (75% improved at 1 month and 48% at 15 months after injection; 80% at 15 months after home training)</span></li>'+
         '<li><b>NICE NG226 — Osteoarthritis in over 16s: diagnosis and management</b><br><a href="https://www.nice.org.uk/guidance/ng226" rel="noopener">nice.org.uk/guidance/ng226</a><span class="rd"> — supporting source (an osteoarthritis, not GTPS, guideline) for therapeutic exercise, education, weight management, short-term corticosteroid use and NSAID precautions</span></li>'+
         '<li><b>NHS SPS — NSAIDs monitoring</b><br><a href="https://www.sps.nhs.uk" rel="noopener">sps.nhs.uk</a><span class="rd"> — consider baseline blood pressure, eGFR/creatinine and FBC, with follow-up according to risk and duration</span></li>'+
         '<li><b>Primary-care joint injection guidance (Patient.info professional)</b><br><a href="https://patient.info/doctor/joint-injection-and-aspiration" rel="noopener">patient.info</a><span class="rd"> — avoiding intratendinous injection, infection precautions and local and systemic adverse effects</span></li>'+
         '<li><b>Local Greater Manchester MSK and physiotherapy pathway</b><span class="rd"> — confirm the Bolton referral route, imaging access, injection service and criteria for specialist referral</span></li>'+
         '<li><b>BNF and local formulary</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — analgesic and NSAID doses, cautions and gastroprotection</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Greater trochanteric pain syndrome (adults). A clinical syndrome of lateral hip pain, usually gluteal tendinopathy. Confirm it with a focused hip, lumbar and neurological examination and exclude intra-articular hip disease, fracture, systemic disease and referred spinal pain. First-line management is education, avoiding compressive loads and progressive gluteal strengthening; analgesia only supports rehabilitation. A corticosteroid injection gives mainly short-term relief and should be selective, not intratendinous or repeated without demonstrable benefit, and never a substitute for exercise. Image or refer for diagnostic uncertainty, marked weakness, a suspected tear, red flags or failure of an adequate programme. ESWT is only for refractory GTPS through an appropriately governed specialist/MSK service, under NICE HTG248 special arrangements for governance, consent and audit, with uncertain efficacy and safety. Sources: NICE HTG248, NICE NG226, SPS NSAID monitoring, local MSK pathway, BNF."
});
</script>
