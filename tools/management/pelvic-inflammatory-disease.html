MG.render({
  icon:"🌸",
  title:"Pelvic Inflammatory Disease",
  eyebrow:"Protocol · assess and manage in one place",
  stemTitle:"PID: exclude the ectopic, then treat on suspicion. Waiting for swabs costs fertility",
  stemSub:"One page for pelvic inflammatory disease in general practice. It is an ascending infection of the endometrium, tubes and pelvic peritoneum, usually started by chlamydia or gonorrhoea but often with no organism found. There is no test that rules it in, the clinical diagnosis is imperfect, and delay increases the risk of tubal infertility, ectopic pregnancy and chronic pelvic pain. So: do a pregnancy test, decide whether she needs a hospital bed, start the 14-day triple regimen on the day you suspect it, test for STIs, deal with the partner and any coil, and see her again at 72 hours. BASHH PID 2019 · NICE NG126 · MHRA 2024 · NICE NG12 (updated April 2026).",
  guideline:"BASHH PID 2018 (2019 interim update) · BASHH gonorrhoea 2025 · BASHH M. genitalium 2025 · NICE NG126 (2019, updated 2023) · MHRA DSU January 2024 · NICE NG12 (updated April 2026)",
  meta:[
    {t:"BASHH 2019 · pelvic inflammatory disease"},
    {t:"NICE NG126 · ectopic pregnancy"},
    {t:"MHRA DSU Jan 2024 · fluoroquinolones"},
    {t:"FSRH 2023 · intrauterine contraception"},
    {t:"2WW · NG12 (April 2026) ovarian and cervical", tone:"tw"}
  ],
  lead:"<div class='mg-layers'><a href='#redflags'><b>Exclude</b><small>ectopic, surgical abdomen</small></a><a href='#recognise'><b>Suspect</b><small>pain + tenderness</small></a><a href='#treat'><b>Treat today</b><small>14-day triple regimen</small></a><a href='#follow'><b>72 hours</b><small>improving or admit</small></a></div>",
  quickSub:"The six points that change what you do today. Each traces to a named primary source under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"Pregnancy test first, every time", html:"Ectopic pregnancy produces the same pain, the same cervical motion tenderness and sometimes the same discharge. Test everyone of reproductive age. A <b>positive test with pain and abdominal, pelvic or cervical motion tenderness is an immediate referral</b> to the early pregnancy assessment service or out-of-hours gynaecology, not a PID diagnosis.", src:"NICE NG126 (2019, updated 2023)"},
    {tone:"amber", h:"Low threshold: treat on suspicion", html:"Recent-onset lower abdominal pain, usually on both sides, with <b>adnexal or cervical motion tenderness</b> on bimanual examination is enough to start treatment. Compared with laparoscopy, a clinical diagnosis is right only 65–90% of the time, and a negative chlamydia or gonorrhoea result does not exclude PID. Treatment is not delayed for swab results.", src:"BASHH PID 2019"},
    {tone:"cream", h:"The outpatient regimen: three drugs, 14 days", html:"<b>Ceftriaxone 1 g IM as a single dose</b>, then <b>doxycycline 100 mg twice daily plus metronidazole 400 mg twice daily for 14 days</b>. Doxycycline and metronidazole without ceftriaxone are not recommended, because failure rates are higher without it.", src:"BASHH PID 2019 · BNF"},
    {tone:"red", h:"Who needs a hospital bed", html:"A surgical emergency cannot be excluded · clinically severe disease · a suspected tubo-ovarian abscess · PID in pregnancy · failure to improve on oral treatment · unable to tolerate oral treatment. These patients need parenteral antibiotics and imaging.", src:"BASHH PID 2019"},
    {tone:"amber", h:"Quinolones are now second line", html:"Ofloxacin plus metronidazole, or moxifloxacin alone, remain alternatives for 14 days, but the MHRA (January 2024) restricts systemic fluoroquinolones to situations where other recommended antibiotics are inappropriate. Avoid them when gonorrhoea is likely, because resistance is common. The exception is PID with <i>Mycoplasma genitalium</i>, where moxifloxacin is the treatment.", src:"MHRA DSU January 2024 · BASHH PID 2019"},
    {tone:"purple", h:"Pelvic mass or ascites: think ovary", html:"NICE NG12: refer to a gynaecological cancer service using a suspected cancer pathway referral if examination finds ascites and/or a pelvic or abdominal mass that is not obviously uterine fibroids. Persistent pelvic or abdominal symptoms that suggest ovarian cancer are a reason to measure CA125 (aged 40 and over, age-specific thresholds) or arrange an ultrasound (under 40), not to repeat antibiotics.", src:"NICE NG12 (updated April 2026)"}
  ],
  pathwaySub:"The consultation in five moves. The first is where patients come to harm.",
  pathway:[
    {title:"Exclude the emergencies", html:"Pregnancy test in all · signs of peritonism, shock or sepsis · a suspected tubo-ovarian abscess (a tender adnexal mass, high fever, marked systemic upset) · an alternative surgical diagnosis such as appendicitis or ovarian torsion. Any of these changes the destination before antibiotics are chosen.", alert:true},
    {title:"Make the clinical diagnosis", html:"Lower abdominal pain, deep dyspareunia, abnormal discharge, bleeding between periods or after sex, with <b>lower abdominal tenderness plus adnexal or cervical motion tenderness</b> on bimanual examination. Take temperature, pulse and blood pressure. Examine the cervix with a speculum."},
    {title:"Test, but do not wait", html:"<b>NAAT for chlamydia and gonorrhoea</b> (endocervical or vulvovaginal), and <b>M. genitalium</b> where the laboratory offers it; a gonorrhoea culture if a clinic can take one; <b>HIV and syphilis serology</b>. Then start treatment the same day."},
    {title:"Treat for 14 days", html:"<b>Ceftriaxone 1 g IM once</b>, then <b>doxycycline 100 mg twice daily and metronidazole 400 mg twice daily for 14 days</b>. If ceftriaxone cannot be given in the practice, arrange same-day sexual health or gynaecology review rather than dropping it. Analgesia, rest and no sex until she and her partner have finished treatment."},
    {title:"Review at 72 hours and again at 2–4 weeks", html:"Expect clear improvement by 72 hours; if not, admit for parenteral treatment and imaging and reconsider the diagnosis (and the coil). At 2–4 weeks check the course was completed, partners were treated, results were acted on and contraception is sorted."}
  ],
  sections:[
    {id:"recognise", nav:"Recognise", title:"Recognising PID", sub:"A clinical diagnosis built from symptoms, signs and a willingness to act on imperfect information.",
     blocks:[
       {b:"table", head:["Feature","What to look for","Comment"], rows:[
         ["<b>Pain</b>","Lower abdominal pain, typically bilateral; deep dyspareunia","The most consistent symptom; one-sided pain makes ectopic, cyst accident or appendicitis more likely"],
         ["<b>Discharge and bleeding</b>","Abnormal vaginal or cervical discharge; bleeding between periods, after sex or heavier periods","Reflects cervicitis and endometritis"],
         ["<b>Abdominal examination</b>","Lower abdominal tenderness, usually both sides","Guarding or rebound suggests peritonitis or a surgical cause"],
         ["<b>Bimanual examination</b>","<b>Adnexal tenderness</b> and <b>cervical motion tenderness</b>; a tender mass suggests an abscess","The signs on which the diagnosis rests"],
         ["<b>Systemic</b>","Fever above 38 °C","Present in more severe disease; its absence does not exclude PID"],
         ["<b>Right upper quadrant pain</b>","Pleuritic RUQ pain with PID (Fitz-Hugh–Curtis perihepatitis)","Treat as PID; exclude biliary disease if atypical"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"What the tests can and cannot do", html:"A positive chlamydia, gonorrhoea or <i>M. genitalium</i> test supports the diagnosis and guides partner treatment, but most PID has no organism identified and a negative result does not exclude it. The <b>absence of pus cells</b> on vaginal or endocervical microscopy has a negative predictive value of about 95%, so it is useful in clinic when available; their presence is non-specific. A raised CRP or ESR supports but does not confirm.", src:"BASHH PID 2019"},
         {tone:"blue", h:"Organisms behind PID", html:"<i>Chlamydia trachomatis</i> and <i>Neisseria gonorrhoeae</i> are the classic causes; <i>M. genitalium</i> accounts for a minority; anaerobes and other vaginal flora (including BV-associated bacteria) contribute, especially in severe disease. In a UK clinic series of nearly 4,000 women, PID was recorded in about 14% of those with gonorrhoea.", src:"BASHH PID 2019 · BASHH gonorrhoea 2025 · BASHH M. genitalium 2025"}
       ]},
       {b:"why", html:"Laparoscopy is the reference standard but nobody gets one in general practice, and even laparoscopy misses endometritis and mild tubal inflammation. Because a missed diagnosis risks tubal damage and the regimen is safe, the guideline deliberately accepts over-treatment: a clinical diagnosis plus a low threshold. The price is that you must think about what else it could be, which is the next section."}
     ]},

    {id:"redflags", nav:"Red flags", title:"Red flags and must-not-miss diagnoses", sub:"Rule these out before, or alongside, starting PID treatment.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Ectopic pregnancy", html:"Refer immediately to an early pregnancy assessment service (or out-of-hours gynaecology) anyone with a positive pregnancy test and pain with abdominal, pelvic or cervical motion tenderness. About a third of women with an ectopic pregnancy have no known risk factors, and previous PID is itself a risk factor.", src:"NICE NG126 (2019, updated 2023)"},
         {tone:"red", h:"Surgical abdomen", html:"Appendicitis, ovarian torsion, and a ruptured or haemorrhagic ovarian cyst can all mimic PID. Peritonism, sudden-onset one-sided pain, vomiting or a tender mass → same-day surgical or gynaecological assessment.", src:"BASHH PID 2019"},
         {tone:"red", h:"Sepsis or tubo-ovarian abscess", html:"High fever, tachycardia, hypotension, severe pain or a tender adnexal mass → admit for parenteral antibiotics and ultrasound. An abscess may need drainage.", src:"BASHH PID 2019"},
         {tone:"red", h:"No improvement at 72 hours", html:"Failure to improve on oral treatment is an admission criterion in itself: it may mean an abscess, the wrong diagnosis, non-adherence or a resistant organism.", src:"BASHH PID 2019"},
         {tone:"purple", h:"Pelvic mass or ascites <span class='tw'>2WW</span>", html:"Make a referral to a gynaecological cancer service using a suspected cancer pathway referral if physical examination identifies ascites and/or a pelvic or abdominal mass (which is not obviously uterine fibroids).", src:"NICE NG12 (updated April 2026)"},
         {tone:"purple", h:"Persistent pelvic or abdominal symptoms <span class='tw'>NG12</span>", html:"Persistent symptoms that suggest ovarian cancer (for example pelvic or abdominal pain, bloating, early satiety or loss of appetite, urinary urgency or frequency): aged 40 and over, measure serum CA125 and arrange an urgent direct access ultrasound of the abdomen and pelvis if it is at or above the age-specific threshold (35 IU/ml at 40–49, 31 at 50–59, 24 at 60–69, 25 at 70–79, 31 at 80 and over); aged 39 and under, do not use CA125 in isolation and consider an urgent direct access ultrasound. A first PID diagnosis after the menopause should raise this question.", src:"NICE NG12 (updated April 2026)"},
         {tone:"purple", h:"Abnormal-looking cervix <span class='tw'>2WW</span>", html:"Consider a suspected cancer pathway referral for cervical cancer if, on examination, the appearance of the cervix is consistent with cervical cancer. Post-coital or intermenstrual bleeding is common in PID, so always look.", src:"NICE NG12 (updated April 2026)"},
         {tone:"amber", h:"A child or young person at risk", html:"PID in a young adolescent raises questions of abuse or exploitation. A child under 13 cannot consent to sexual activity in law; follow safeguarding procedures.", src:"Working Together to Safeguard Children 2026 · Sexual Offences Act 2003"}
       ]},
       {b:"table", head:["Differential","Pointers"], rows:[
         ["<b>Ectopic pregnancy</b>","Positive pregnancy test, amenorrhoea, bleeding, shoulder-tip pain, syncope"],
         ["<b>Appendicitis</b>","Periumbilical pain migrating to the right iliac fossa, anorexia, vomiting"],
         ["<b>Ovarian cyst accident or torsion</b>","Sudden, severe, one-sided pain, often with vomiting; a mass"],
         ["<b>Endometriosis</b>","Cyclical pain, dysmenorrhoea, dyspareunia over months"],
         ["<b>Urinary tract infection</b>","Dysuria, frequency, positive urine dipstick and culture; no cervical motion tenderness"],
         ["<b>Irritable bowel syndrome or functional pain</b>","Chronic, related to bowel habit, no fever or pelvic signs"]
       ]}
     ]},

    {id:"treat", nav:"Treat", title:"Antibiotic treatment", sub:"Doses below are those stated in the BASHH guideline. Check each in the BNF and the SPC before prescribing.",
     blocks:[
       {b:"ladder", steps:[
         {step:"First line", title:"Ceftriaxone, doxycycline and metronidazole", when:"mild to moderate PID, outpatient", fromLabel:"most patients",
          html:"<b>Ceftriaxone 1 g intramuscularly, single dose</b>, followed by <b>doxycycline 100 mg twice daily</b> plus <b>metronidazole 400 mg twice daily</b>, both <b>for 14 days</b>. The 2019 interim update made quinolones second line, except for <i>M. genitalium</i>-associated PID. Metronidazole covers anaerobes and may be stopped in mild or moderate PID if it is not tolerated."},
         {step:"Alternative", title:"Ofloxacin with metronidazole, or moxifloxacin", when:"ceftriaxone or doxycycline unsuitable", fromLabel:"if the first-line regimen cannot be used",
          html:"<b>Ofloxacin 400 mg twice daily plus metronidazole 400 mg twice daily for 14 days</b>, or <b>moxifloxacin 400 mg once daily for 14 days</b>. Avoid when gonorrhoea is likely (a partner with gonorrhoea, severe disease, sex abroad) because quinolone resistance is high. Fluoroquinolones are for when the recommended antibiotics are inappropriate (MHRA 2024); warn about tendon, muscle, joint and nerve effects and psychiatric reactions, and stop at the first sign."},
         {step:"M. genitalium", title:"Moxifloxacin for 14 days", when:"M. genitalium detected", fromLabel:"if the swab result comes back positive",
          html:"<b>Moxifloxacin 400 mg once daily for 14 days</b> is the regimen for PID associated with <i>M. genitalium</i>, which is the one setting where a quinolone remains first choice. Usually managed by the sexual health service."},
         {step:"Inpatient", title:"Parenteral regimens", when:"admission criteria met", fromLabel:"if severe, pregnant or failing",
          html:"Intravenous regimens (ceftriaxone with doxycycline, or clindamycin with gentamicin, each with a switch to oral treatment to complete 14 days) are started in hospital. The GP's job is to recognise the need and refer."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"cream", h:"Practical points on the drugs", html:"Ceftriaxone for intramuscular use may be reconstituted with lidocaine to reduce pain (SPC). Ask about previous severe penicillin or cephalosporin allergy. Doxycycline should be swallowed with plenty of water while upright, and causes photosensitivity. No alcohol during metronidazole and for 48 hours after.", src:"Ceftriaxone SPC · doxycycline SPC · BNF"},
         {tone:"amber", h:"If the practice cannot give ceftriaxone", html:"Do not simply leave it out: doxycycline and metronidazole alone are not recommended. Start the oral drugs and arrange for the ceftriaxone to be given the same day by the sexual health service, an urgent treatment centre or gynaecology.", src:"BASHH PID 2019"}
       ]},
       {b:"why", html:"The regimen covers three things at once: gonorrhoea (ceftriaxone), chlamydia and <i>M. genitalium</i> in part (doxycycline), and anaerobes (metronidazole). Fourteen days reflects the trial evidence for upper tract infection. The quinolone step-down reflects both the MHRA's safety review and gonococcal resistance, and it is why the guideline now reserves moxifloxacin for the organism that needs it."}
     ]},

    {id:"iud", nav:"Coil", title:"PID with an intrauterine device in place", sub:"The coil can usually stay; the review at 72 hours decides.",
     blocks:[
       {b:"cards", items:[
         {tone:"blue", h:"Leave it in and review", html:"In mild to moderate PID, an intrauterine device or system can be left in place while antibiotics start. Review at 48–72 hours and remove it if there has not been clear improvement.", src:"BASHH PID 2019 · FSRH intrauterine contraception 2023"},
         {tone:"amber", h:"If it comes out: think about pregnancy", html:"Removal may give a slightly better short-term response but leaves her at risk of pregnancy. If there has been unprotected sex in the previous 7 days, hormonal emergency contraception may be appropriate, and start another method straight away.", src:"BASHH PID 2019 · FSRH intrauterine contraception 2023"},
         {tone:"green", h:"Future contraception", html:"Past PID, with no current STI risk, is UKMEC category 1 for both copper and hormonal intrauterine methods, so a treated episode is not a reason to refuse a coil later. Discuss condoms alongside any method to reduce reinfection.", src:"FSRH UKMEC 2025"}
       ]}
     ]},

    {id:"partners", nav:"Partners", title:"Partners, sexual health and reinfection", sub:"Treating her without treating her partner invites a second episode, and each episode adds tubal damage.",
     blocks:[
       {b:"table", head:["Step","What to do","Source"], rows:[
         ["<b>Who to contact</b>","If no organism is found, contact all partners since, and in the <b>6 months before</b>, the onset of symptoms; if chlamydia or gonorrhoea is found, use that infection's look-back period. Current partners are the priority","BASHH PID 2019"],
         ["<b>Treat the current male partner</b>","<b>Doxycycline 100 mg twice daily for 7 days</b> as a contact of PID, even if his tests are negative; add treatment for gonorrhoea if she tests positive for it","BASHH PID 2019 · BASHH gonorrhoea 2025"],
         ["<b>Chlamydia or gonorrhoea found</b>","Partner notification follows the organism-specific guideline; sexual health services lead it","BASHH chlamydia 2026 · BASHH gonorrhoea 2025"],
         ["<b>Abstinence</b>","No sex, including with condoms, until she and her partner(s) have completed treatment","BASHH PID 2019"],
         ["<b>Full screen</b>","HIV and syphilis serology alongside the chlamydia, gonorrhoea and <i>M. genitalium</i> tests","BASHH PID 2019 · BHIVA/BASHH/BIA HIV testing 2020"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"Use the sexual health service", html:"A referral or a call to the local sexual health clinic brings partner notification specialists, gonorrhoea culture, <i>M. genitalium</i> testing and a test of cure where needed. The patient can also self-refer.", src:"BASHH PID 2019"},
         {tone:"blue", h:"Test of cure depends on the organism", html:"Everyone treated for gonorrhoea should have a test of cure. For <i>M. genitalium</i>, BASHH 2025 no longer advises a test of cure when symptoms have resolved. Chlamydia follows its own guideline.", src:"BASHH gonorrhoea 2025 · BASHH M. genitalium 2025"}
       ]}
     ]},

    {id:"special", nav:"Special groups", title:"Pregnancy, breastfeeding, HIV and young people", sub:"The groups in which the plan changes.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🤰 Pregnancy", html:"PID in pregnancy is uncommon but carries maternal and fetal risk. Admit for parenteral treatment; no regimen is of proven safety, and the guideline suggests intravenous ceftriaxone, erythromycin and metronidazole, completing 14 days orally. Doxycycline and quinolones are avoided. First exclude ectopic pregnancy.", src:"BASHH PID 2019 · NICE NG126 (2019, updated 2023)"},
         {tone:"amber", h:"🍼 Breastfeeding", html:"The BNF advises against tetracyclines while breastfeeding, and high single doses of metronidazole are avoided. Take advice from the sexual health service or gynaecology on a suitable regimen rather than withholding treatment.", src:"BNF · metronidazole SPC"},
         {tone:"blue", h:"🧬 Women living with HIV", html:"Use the same regimens; response is similar. Women with PID should be offered an HIV test.", src:"BASHH PID 2019 · BHIVA/BASHH/BIA HIV testing 2020"},
         {tone:"amber", h:"🧒 Under 16", html:"A competent young person can be treated confidentially, but assess every sexual health consultation for coercion, exploitation and age gap, and share information when there is risk of significant harm. Under 13 is always a safeguarding referral.", src:"Working Together to Safeguard Children 2026 · Sexual Offences Act 2003"},
         {tone:"cream", h:"👩 Post-menopause or no sexual risk", html:"PID is unusual after the menopause and in women with no sexual risk. Look harder for another cause, including the NG12 ovarian and cervical criteria, before settling on the diagnosis.", src:"NICE NG12 (updated April 2026)"}
       ]}
     ]},

    {id:"follow", nav:"Follow-up", title:"Follow-up and long-term consequences", sub:"Two reviews: one to catch treatment failure, one to close the loop.",
     blocks:[
       {b:"timeline", items:[
         {n:"1", when:"72 hours", title:"Is she improving?", html:"Review in person or by phone with a low bar to examine. Expect a clear fall in pain and tenderness. <b>No improvement → admit</b> for parenteral antibiotics, ultrasound for an abscess and reconsideration of the diagnosis; remove the coil if there is one."},
         {n:"2", when:"When results arrive", title:"Act on the swabs", html:"Gonorrhoea: confirm ceftriaxone was given, notify partners and arrange a test of cure. <i>M. genitalium</i>: switch to moxifloxacin for 14 days via sexual health. Chlamydia: partner notification."},
         {n:"3", when:"2–4 weeks", title:"Close the loop", html:"Check adherence to the full 14 days, tolerance, partner treatment and abstinence, test results and contraception. Repeat a pregnancy test if indicated. Offer an HIV and syphilis test if not done."},
         {n:"4", when:"Longer term", title:"Counsel about sequelae", html:"Explain that PID can lead to tubal infertility, ectopic pregnancy and chronic pelvic pain, that the risk rises with delayed treatment and with each further episode, and that she should seek early care in any future pregnancy."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"red", h:"Safety-net: come back the same day", html:"Worsening pain, fever, vomiting so that tablets cannot be kept down, fainting, or a missed period with pain. Any of these may mean an abscess, an ectopic pregnancy or treatment failure.", src:"BASHH PID 2019 · NICE NG126 (2019, updated 2023)"},
         {tone:"amber", h:"Recurrent PID or chronic pain", html:"Recurrent episodes → sexual health for a full reassessment of partners and organisms. Pelvic pain persisting after treatment → gynaecology, with the NG12 criteria in mind for older women.", src:"BASHH PID 2019 · NICE NG12 (updated April 2026)"}
       ]},
       {b:"say", html:"This looks like an infection of the womb and tubes called pelvic inflammatory disease. It usually starts with an infection passed on during sex, although often we never find which one. I'm going to start treatment today, before the swab results, because treating early protects your fertility. It's an injection and two lots of tablets for two weeks, and it's important to finish them. Your partner needs treatment too, and please don't have sex until you've both finished. I'd like to hear from you in three days, and sooner if you're getting worse."}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — who, when and how urgently", sub:"Most mild to moderate PID is managed in the community, with sexual health doing the partner work.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Immediate or same day", html:"Positive pregnancy test with pain and tenderness → early pregnancy assessment service. Surgical emergency not excluded, severe disease, sepsis, suspected tubo-ovarian abscess, pregnancy, intolerance of oral treatment, or no improvement at 72 hours → gynaecology admission.", src:"BASHH PID 2019 · NICE NG126 (2019, updated 2023)"},
         {tone:"purple", h:"Suspected cancer pathway <span class='tw'>2WW</span> · NICE NG12", html:"Make a referral to a gynaecological cancer service using a suspected cancer pathway referral if physical examination identifies ascites and/or a pelvic or abdominal mass (which is not obviously uterine fibroids). Consider a suspected cancer pathway referral for cervical cancer if the appearance of the cervix is consistent with cervical cancer. Persistent symptoms that suggest ovarian cancer (for example pelvic or abdominal pain, bloating, early satiety or loss of appetite, urinary urgency or frequency): aged 40 and over, measure serum CA125 and arrange an urgent direct access ultrasound of the abdomen and pelvis if it is at or above the age-specific threshold (35 IU/ml at 40–49, 31 at 50–59, 24 at 60–69, 25 at 70–79, 31 at 80 and over); aged 39 and under, do not use CA125 in isolation and consider an urgent direct access ultrasound.", src:"NICE NG12 (updated April 2026)"},
         {tone:"amber", h:"Sexual health clinic (urgent, within days)", html:"Partner notification and treatment · gonorrhoea culture and test of cure · <i>M. genitalium</i> testing and moxifloxacin · ceftriaxone if the practice cannot give it (same day) · recurrent PID.", src:"BASHH PID 2019 · BASHH M. genitalium 2025"},
         {tone:"amber", h:"Safeguarding lead", html:"Any concern about abuse or exploitation; any sexual activity in a child under 13.", src:"Working Together to Safeguard Children 2026"},
         {tone:"blue", h:"Gynaecology (routine)", html:"Chronic pelvic pain after PID, subfertility after PID, or diagnostic doubt in a well patient.", src:"BASHH PID 2019"},
         {tone:"green", h:"Manage in general practice", html:"Mild to moderate PID in a well, non-pregnant patient who can take oral treatment and attend review, with sexual health involved for partners.", src:"BASHH PID 2019"}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card; the Casebook holds the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 22-year-old woman has had lower abdominal pain for five days and pain during sex. She has a new partner and a copper coil. She is afebrile. She asks whether the coil has to come out and whether she will be able to have children.", src:"BASHH PID 2019"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Does a <b>pregnancy test</b> and asks about bleeding and missed periods · examines, or explains why an examination is needed, including cervical motion tenderness · makes a <b>clinical diagnosis</b> and <b>starts treatment today</b> without waiting for swabs · gives the <b>14-day triple regimen</b> and arranges ceftriaxone · explains that the coil can stay for now with <b>review at 72 hours</b> · addresses fertility honestly (early treatment reduces the risk) · manages the partner and advises abstinence · offers HIV testing · safety-nets for worsening pain, fever and fainting.", src:"BASHH PID 2019 · NICE NG126 (2019, updated 2023)"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Every figure on this page traces to one of these primary sources.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>BASHH — United Kingdom national guideline for the management of pelvic inflammatory disease (2018; 2019 interim update)<br><a href="https://www.bashh.org/resources/10/pelvic_inflammatory_disease/" rel="noopener">bashh.org — pelvic inflammatory disease</a><span class="rd"> — clinical diagnosis and its predictive values, tests, outpatient and alternative regimens, ceftriaxone 1 g, quinolone restrictions, admission criteria, IUD management, pregnancy, partner management (6-month look-back, doxycycline for current partners) and 72-hour review. Still the current BASHH PID guideline in September 2026.</span></li>'+
