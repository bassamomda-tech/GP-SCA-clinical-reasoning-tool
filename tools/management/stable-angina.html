  quick:[
    {tone:"red", h:"⚠ The interaction that kills — PDE5 inhibitors and nitrates", html:"Never use PDE5 inhibitors concurrently with nitrates or nicorandil. After a PDE5 inhibitor, no nitrate for 24 hours (sildenafil, vardenafil) or 48 hours (tadalafil); avanafil — check the current SPC. Ask about recreational nitrites (‘poppers’) too. <b>Profound refractory hypotension.</b> Angina patients ARE the erectile-dysfunction demographic, so ask proactively: a man who took sildenafil last night and gets chest pain today must NOT use his GTN. He calls 999 and tells the crew what he took."},
    {tone:"red", h:"⛔ Avoid beta-blocker + verapamil or diltiazem", html:"<b>Additive bradycardia, AV block and negative inotropy</b> — only ever specialist-directed with ECG and clinical monitoring. When combining, NICE specifies a <b>dihydropyridine</b> CCB — amlodipine, felodipine or MR nifedipine. And never stop a beta-blocker abruptly: rebound tachycardia precipitates ACS — taper over 1–2 weeks."},
    {tone:"blue", h:"The GTN 5-5-999 rule", html:"Pain → stop, sit down, use GTN. Still there at 5 minutes → second dose. Still there 5 minutes after the second dose → 999. <b>Call 999 at once</b> if severe, or with collapse, breathlessness or marked sweating — never delay for repeated GTN. <b>Say it, write it, and check recall at every review.</b> <b>Sit down first</b> — GTN drops blood pressure, and syncope on a ladder is how GTN injures people. <b>Use it BEFORE predictable triggers too</b> — hills, cold mornings, sex."},

       {b:"warn", html:"The commonest error in this condition is treating a pattern change as a dose problem. Stable angina is predictable, exertional and relieved by rest; the moment any of those three stops being true, the consultation changes from titration to acute assessment. <b>Ask about GTN use and activity avoidance at every review</b> — increasing use, reduced tolerance or a lower threshold prompts reassessment."}

    {id:"confirm", nav:"Confirm", title:"Making the diagnosis",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>The three-point definition</b>","(1) Constricting discomfort in the chest, arm, neck, jaw or shoulder, (2) brought on by exertion, (3) relieved by rest or GTN within about 5 minutes. All three = typical angina · two = atypical · one or none = non-anginal"],
         ["<b>Diagnostic route</b>","CTCA is first-line for typical or atypical angina, or non-anginal pain with ST–T changes or Q waves (NICE CG95), via rapid-access chest pain clinic — never for suspected ACS. It may be unsuitable with heavy calcification, arrhythmia or uncontrolled rate, inability to breath-hold, contrast allergy or severe renal impairment. Functional imaging if non-diagnostic or of uncertain significance; invasive angiography when anatomy or risk warrants. Do not 'trial GTN' as a diagnostic test — oesophageal spasm responds to it too"],
         ["<b>Confirm it is STABLE</b>","<b>Predictable, exertional, relieved by rest.</b> Rest pain, crescendo frequency or new pain moves this to the red-flag table above"],
         ["<b>Quantify with CCS class</b>","I — strenuous exertion only · II — slight limitation · III — marked limitation (e.g. one flight of stairs — an example, varies with fitness and comorbidity) · IV — any activity, or at rest. Record triggers (cold, meals, emotion) and what it stops them doing"],
         ["<b>Baseline tests</b>","ECG (old MI, AF, LVH) · FBC (anaemia is an angina amplifier) · TFTs · HbA1c · lipids · U&amp;Es · blood pressure · weight. Echocardiography if there is a murmur, heart-failure signs or previous MI"]
       ]},
       {b:"why", html:"<b>Two tracks run forever.</b> Anti-anginals mainly improve symptoms and exercise tolerance — not assumed to reduce events unless there is a separate indication (beta-blocker after recent MI or in HFrEF). Secondary prevention reduces risk but does not relieve angina. Every review checks both — and the classic failure is the comfortable patient whose statin was quietly stopped, because the drug that was doing the survival work was the one with no perceptible effect."}
     ]},

    {id:"gtn", nav:"GTN", title:"GTN — the rules that save lives, and the one that kills",
     blocks:[
       {b:"table", head:["Point","Detail"], rows:[
         ["<b>How to use it</b>","<b>SIT DOWN first</b> — it drops blood pressure, and syncope on a ladder is how GTN injures people. <b>1–2 sprays under the tongue per the product instructions.</b> <b>Use it BEFORE predictable triggers as well</b> — hills, cold mornings, sex"],
         ["<b>The 5-5-999 rule</b>","Pain → stop and rest and use GTN. Still there at 5 minutes → second dose. Still there 5 minutes after the second dose → 999 (immediately if severe, with collapse, breathlessness or sweating). <b>Say it, write it, and check recall at every review</b>"],
         ["<b>What to expect</b>","Headache and flushing are common side effects (they do not prove it is working) — paracetamol helps and they usually pass. Light-headedness means sit down for longer"],
         ["<b>Tablets versus spray</b>","Spray suits most people; tablet storage and expiry are product-specific — follow the SPC. Tablets can be spat out if side effects are troublesome"],
         ["<b>The interaction that kills</b>","No concurrent PDE5 inhibitors with nitrates or nicorandil; after a PDE5 inhibitor, no nitrate for 24 hours (sildenafil, vardenafil), 48 hours (tadalafil), avanafil per SPC. Ask about ‘poppers’. <b>Profound refractory hypotension.</b> Ask proactively — angina patients are the ED demographic, and the man who took sildenafil last night must call 999 rather than reach for his spray"]
       ]},
       {b:"say", html:"If you get the pain: stop what you are doing and sit down — sit down first, because the spray drops your blood pressure and I do not want you fainting on a ladder. One or two sprays under the tongue. If it is still there after five minutes, take another. If it is still there five minutes after that, call 999 — and call straight away if it is severe or you feel faint or breathless. And one more thing I ask every man on this spray, so please do not take it personally: if you ever take Viagra or anything like it, you must not use this spray for twenty-four hours afterwards (two days for tadalafil) — the two together can drop your blood pressure dangerously. If you get chest pain in that window, call 999 and tell them what you took."}
     ]},

    {id:"ladder", nav:"Symptoms", title:"The anti-anginal ladder — exact doses, real traps",
     sub:"This track mainly improves symptoms. Doses per SPC and the GM formulary.",
     blocks:[
       {b:"table", head:["Step","Drug and dose","Notes"], rows:[
         ["<b>Step 1 — beta-blocker OR calcium-channel blocker, titrated</b>","<b>Beta-blocker</b> (e.g. bisoprolol — especially post-MI, heart failure or a high resting rate) — caution in bradycardia, heart block, sick sinus, decompensated HF, severe bronchospasm. OR a <b>CCB</b>: rate-limiting diltiazem MR (prescribe by brand) or verapamil (not in HFrEF, bradycardia or conduction disease), or <b>amlodipine</b>, which also treats BP. Titrate against angina, HR, BP and side effects","Review at 2–4 weeks. \"Failed\" at half dose is not failed — titrate before judging. Not tolerated → switch to the other class rather than combining"],
         ["<b>Step 2 — combine: beta-blocker + dihydropyridine CCB</b>","Beta-blocker plus amlodipine or felodipine — the ONLY safe routine combination","Avoid beta-blocker + verapamil or diltiazem — specialist-directed only, with ECG monitoring (bradycardia, AV block). Check ankles for amlodipine oedema — switch to lercanidipine rather than abandoning the class"],
         ["<b>Step 3 — if BB/CCB unsuitable, or a third agent</b>","<b>Long-acting nitrate</b> (e.g. isosorbide mononitrate) — a schedule giving a daily nitrate-free or low-nitrate interval to prevent tolerance, per the product SPC","<b>Third drug only while awaiting revascularisation or when it is inappropriate or unacceptable — not if controlled on two</b>"],
         ["<b>Ivabradine</b>","Per SPC","Sinus rhythm only; contraindicated with verapamil or diltiazem; watch bradycardia, AF, visual symptoms and CYP3A4 interactions (MHRA)"],
         ["<b>Ranolazine</b>","Per SPC","No heart-rate or BP effect. QT prolongation (review other QT drugs), hepatic and renal cautions, CYP3A4 inhibitors and inducers"],
         ["<b>Nicorandil</b>","Second-line, per SPC","MHRA: any unexplained oral, genital, perianal, skin, eye or GI ulceration may be nicorandil — stop and seek specialist advice (can progress to perforation, haemorrhage, fistula or abscess; resolves only on withdrawal). <b>Same PDE5-inhibitor ban as nitrates</b>"],
         ["<b>Refer for revascularisation assessment</b>","<b>Limiting symptoms despite two optimised agents</b>","PCI/CABG relieve symptoms; in many stable patients an initial conservative strategy is as safe (ISCHEMIA). Prognostic benefit is possible in left-main, proximal three-vessel or complex multivessel disease, diabetes or severe LV dysfunction — CABG considered even if symptoms are controlled (CG126)"]
       ]},
       {b:"warn", html:"Never stop a beta-blocker abruptly — rebound tachycardia precipitates ACS. Taper over 1–2 weeks. And in the multimorbid patient, one drug doing two jobs beats polypharmacy: bisoprolol covers angina and heart failure (and in heart failure, diltiazem and verapamil are avoided entirely); amlodipine covers angina and hypertension. See <a href='heart-failure.html'>heart failure</a> and <a href='hypertension.html'>hypertension</a>."}
     ]},

    {id:"prevention", nav:"Survival", title:"The prevention bundle — the part that stops the infarct",
     blocks:[
       {b:"table", head:["Drug","Dose","Notes"], rows:[
         ["<b>Aspirin</b>","<b>Consider 75 mg OD</b> after weighing bleeding risk and comorbidity (NICE CG126)","Usually long-term after MI or PCI; align with the cardiology plan. <b>Clopidogrel if aspirin unsuitable.</b> PPI cover where there is GI risk — see <a href='antiplatelets-anticoagulants.html'>antiplatelets and anticoagulants</a>"],
         ["<b>Atorvastatin</b>","<b>80 mg — the secondary-prevention dose</b>","Unless contraindicated, not tolerated or interacting. Target LDL ≤2.0 or non-HDL ≤2.6 (NG238). Not met on maximum tolerated statin → ezetimibe (may also be considered after discussion even when at target). Further — inclisiran or a PCSK9 inhibitor — per NICE criteria and the GM lipid pathway"],
         ["<b>ACE inhibitor / ARB</b>","Per indication and SPC","Consider in angina with diabetes; offer or continue for hypertension, albuminuric CKD, HF with LVSD or post-MI per their guidelines — not for angina alone. Check renal function, K⁺, pregnancy, angioedema, no ARB/aliskiren combination"],
         ["<b>Blood pressure and diabetes to target</b>","<b>Per their own protocols</b>","Every mmHg and every mmol counts double in established coronary disease"],
         ["<b>Vaccination</b>","<b>Per the current UK schedule</b>","Annual influenza where eligible; pneumococcal by age and risk group (not annual)"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"red", h:"🚭 Smoking is the biggest single modifiable risk", html:"<b>Cessation support at every contact.</b> Stopping substantially reduces risk — worth saying out loud."},
         {tone:"green", h:"🏃 Regular activity — once stable", html:"Once the diagnosis and stability are established, encourage regular activity, ideally via cardiac rehabilitation or a structured programme. <b>Do not push through angina</b> — stop and use the GTN plan, and seek review if tolerance falls."},
         {tone:"green", h:"🥗 Diet and weight", html:"A Mediterranean-style pattern and weight management support secondary prevention."},
         {tone:"amber", h:"🧠 Mood and adherence", html:"Screen for depression, anxiety and illness-related avoidance where symptoms or adherence are affected; treat by diagnosis and preference, considering cardiac status, QT risk, antiplatelets and hyponatraemia. See <a href='depression.html'>depression</a>."},
         {tone:"blue", h:"❄️ Plan around the triggers", html:"<b>Cold mornings, heavy meals, unaccustomed exertion.</b> GTN before the trigger, a scarf over the mouth in winter."},
         {tone:"purple", h:"🚗 DVLA", html:"Group 1 (car, motorcycle): no notification needed, but the patient MUST stop driving if symptoms occur at rest, with emotion, or at the wheel — and may resume when controlled. Group 2 (bus, coach, lorry): must notify the DVLA; the licence is refused or revoked while symptoms occur, and relicensing needs at least 6 weeks free of angina plus the functional test requirements. Check insurance, and never drive if symptoms, hypotension, syncope or side effects impair control. Record the advice."}
       ]}
     ]},

    {id:"monitor", nav:"Review", title:"The review — both tracks, every time",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["<b>Symptom track — frequency, CCS class, GTN sprays per week</b>","<b>Every review, and 2–4 weeks after any change</b>","Increasing GTN use, reduced tolerance or a lower threshold → reassess the pattern and treatment (some patients avoid activity instead)"],
         ["<b>Pattern check</b>","<b>Every contact</b>","Less predictable? Lower threshold? Rest symptoms? → unstable → same-day or 999, not a routine titration"],
         ["<b>Heart rate and blood pressure</b>","<b>At each titration</b>","Titrate against symptoms, HR and BP — a resting HR around 55–60 may guide selected patients; avoid symptomatic bradycardia. Hypotension limiting titration is the ranolazine niche"],
         ["<b>Prevention track — lipids</b>","<b>3 months after any statin change, then annually</b>","<b>LDL ≤2.0 or non-HDL ≤2.6 (≥40% non-HDL reduction). Not met → ezetimibe → NICE/GM pathway</b>"],
         ["<b>Adherence to BOTH tracks</b>","<b>Every review</b>","<b>The comfortable patient off their statin is the one who infarcts</b>"],
         ["<b>Annual bundle</b>","<b>Once a year</b>","Lipids, HbA1c, blood pressure, smoking, weight, mood, GTN technique with 5-5-999 recall, and the DVLA position if Group 2"]
       ]},
       {b:"say", html:"You have two kinds of medicine and they do completely different jobs. The spray and the daily heart tablets are mainly for comfort — they ease the pain. The statin, and the aspirin if you take it, lower your risk of a heart attack — and they only work if you keep taking them, even on the days you feel well. And one rule to remember: pain still there five minutes after the second spray is a 999 call, not a wait-and-see."},
       {b:"cards", items:[
         {tone:"red", h:"🔴 999", html:"\"Pain still there five minutes after the second spray — 999. New pain at rest, or pain coming more often or more easily — contact us the same day.\""},
         {tone:"amber", h:"🟠 Using the spray more often?", html:"\"If you are reaching for the spray more than you used to, tell me — that can be a sign things need adjusting, and I would rather know early.\""},
         {tone:"blue", h:"💊 Never stop the beta-blocker suddenly", html:"\"If you want to come off the heart-rate tablet, come and see me — stopping it suddenly can bring on a heart attack. We reduce it over a week or two.\""},
         {tone:"green", h:"✓ About a stent", html:"\"A stent or bypass may improve your symptoms. For many people with stable disease, starting with the right tablets is as safe as going straight to a procedure — but some artery patterns, such as left-main or complex multivessel disease, do better with one. The heart team will weigh your anatomy, your other conditions and what you want.\""}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Emergency — 999", html:"Pain persisting 5 minutes after the second GTN dose · new, prolonged or crescendo rest pain · suspected ACS · chest pain with syncope or haemodynamic compromise · chest pain within 24 hours of a PDE5 inhibitor (48 hours for tadalafil), where GTN is contraindicated."},
         {tone:"amber", h:"Rapid-access chest pain clinic", html:"New-onset suspected angina, for CT coronary angiography as the first-line investigation (CG95)."},
         {tone:"amber", h:"Cardiology — revascularisation assessment", html:"<b>Limiting symptoms despite optimal medical therapy</b>, high-risk anatomy or functional results, left-main or proximal three-vessel disease, or PCI-versus-CABG uncertainty — Heart Team assessment."},
         {tone:"blue", h:"Echocardiography", html:"<b>Murmur, heart-failure signs, or previous MI.</b> Aortic stenosis is the mimic that changes management completely."},
         {tone:"green", h:"Cardiac rehabilitation", html:"<b>After MI or revascularisation</b> — and worth asking about in anyone whose activity has collapsed through fear of the pain."},
         {tone:"cream", h:"GP management", html:"Diagnosis routing, GTN teaching, the whole anti-anginal ladder, the prevention bundle, amplifier hunting, DVLA advice and the two-track review all belong here. Related pages: <a href='hypercholesterolaemia.html'>lipid management</a> · <a href='hypertension.html'>hypertension</a> · <a href='heart-failure.html'>heart failure</a> · <a href='atrial-fibrillation.html'>atrial fibrillation</a> · <a href='mi-secondary-prevention.html'>post-MI secondary prevention</a> · <a href='antiplatelets-anticoagulants.html'>antiplatelets and anticoagulants</a>."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 64-year-old man with stable angina attends for review. He is on <b>bisoprolol 2.5 mg</b> and <b>atorvastatin 80 mg</b>, and uses his GTN <b>\"three or four times a week now, it used to be once a fortnight\"</b>. He walks more slowly to avoid the pain. He mentions, unprompted and awkwardly, that he has been <b>buying sildenafil online</b>. His resting heart rate is 78 and BP 138/82."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"<b>Recognises rising GTN use as the key finding</b> and asks whether the pattern is still predictable — distinguishing escalation from instability; addresses the sildenafil immediately and non-judgementally: the 24-hour nitrate washout, and that chest pain in that window means 999 rather than GTN; notes bisoprolol is at 2.5 mg with a resting HR of 78 — the drug is NOT failed, it is untitrated, and titrates it against symptoms, HR and BP; <b>checks the statin is actually being taken and the lipid target met</b>; <b>hunts the amplifier — FBC for anaemia, TFTs, ECG for new AF</b> — before assuming disease progression; <b>re-teaches the 5-5-999 rule and checks recall</b>; <b>addresses activity avoidance</b> — regular activity without pushing through angina, cardiac rehab; <b>gives DVLA advice</b>; and <b>explains the two tracks explicitly</b>, so the survival drugs are not mistaken for the comfort ones."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE CG126 — Stable angina: management (2011, updated 2016)</b><br><a href="https://www.nice.org.uk/guidance/cg126" rel="noopener">nice.org.uk/guidance/cg126</a><span class="rd"> — beta-blocker or calcium-channel blocker first-line and titrated to maximum, the safe and unsafe combinations, the third-line agents, and revascularisation for symptom control</span></li>'+
         '<li><b>NICE CG95 — Recent-onset chest pain of suspected cardiac origin: assessment and diagnosis (2010, updated 2016)</b><br><a href="https://www.nice.org.uk/guidance/cg95" rel="noopener">nice.org.uk/guidance/cg95</a><span class="rd"> — the three-point definition of typical angina and CT coronary angiography as the first-line investigation</span></li>'+
         '<li><b>NICE NG238 — Cardiovascular disease: risk assessment and reduction, including lipid modification (2023)</b><span class="rd"> — atorvastatin 80 mg for secondary prevention, the LDL ≤2.0 and non-HDL ≤2.6 targets, and ezetimibe then injectable escalation</span></li>'+
         '<li><b>ISCHEMIA (Maron et al., NEJM 2020) and ORBITA (Al-Lamee et al., Lancet 2018)</b><span class="rd"> — PCI in stable angina improves symptoms but does not reduce myocardial infarction or death, which is the basis of the honest revascularisation conversation</span></li>'+
         '<li><b>MHRA Drug Safety Updates</b><span class="rd"> — nicorandil and gastrointestinal, skin and eye ulceration; ivabradine contraindicated with verapamil or diltiazem; the nitrate and PDE5-inhibitor interaction</span></li>'+
         '<li><b>DVLA — Assessing fitness to drive</b><br><a href="https://www.gov.uk/guidance/assessing-fitness-to-drive-a-guide-for-medical-professionals" rel="noopener">gov.uk — assessing fitness to drive</a><span class="rd"> — Group 1 requires no notification but driving must stop if symptoms occur at rest, with emotion or at the wheel; Group 2 requires notification, and relicensing after at least 6 weeks free of angina with the exercise or functional test requirements met</span></li>'+
         '<li><b>Lyon Diet Heart Study (de Lorgeril et al., Circulation 1999)</b><span class="rd"> — the Mediterranean dietary pattern evidence referenced in the prevention bundle</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Stable angina — NICE CG126, CG95, NG185 and NG238, and DVLA guidance. Two tracks: anti-anginals mainly relieve symptoms; secondary prevention reduces risk. Teach the GTN 5-5-999 rule and ask every patient about PDE5 inhibitors — no nitrate within 24 hours of sildenafil or vardenafil, 48 for tadalafil, and the same applies to nicorandil. Avoid beta-blocker with verapamil or diltiazem, and never stop a beta-blocker abruptly. Revascularisation relieves symptoms and may improve prognosis in selected anatomy. Verify all doses against the SPC and GM formulary."
});
