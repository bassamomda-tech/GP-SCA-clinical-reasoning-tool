  stemSub:"One page for the whole condition. Confirm it is angina and that it is stable; for new suspected stable angina, use the local chest-pain pathway and the NICE CTCA criteria (not for suspected ACS). Then run the two tracks — symptom control up the anti-anginal ladder with the combinations to avoid, and the secondary-prevention bundle that reduces cardiovascular risk. Teach the GTN rules including the PDE5-inhibitor and poppers interaction, be accurate about what revascularisation does, and give the DVLA advice everyone forgets.",

  quickSub:"The 30-second answer, then the six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"cream", h:"The 30-second answer", html:"Confirm that the symptoms are angina and that the pattern is stable: predictable exertional constricting discomfort relieved by rest or GTN within about 5 minutes. For new suspected stable angina, use the local chest-pain pathway and NICE CTCA criteria; do not use this pathway for suspected ACS. Teach GTN: sit down, use it for an attack, repeat after 5 minutes if needed, and call 999 if pain persists 5 minutes after the second dose. Never combine nitrates or nicorandil with PDE5 inhibitors or poppers — no nitrate within 24 hours of sildenafil/vardenafil or 48 hours of tadalafil; check the current product information for avanafil. Use a beta-blocker or CCB first-line, titrated to symptoms, blood pressure, heart rate and adverse effects. Run secondary prevention in parallel: lipid lowering, appropriate antiplatelet treatment, smoking cessation, blood pressure/diabetes management and lifestyle. Refer for cardiology assessment if symptoms remain limiting despite optimal treatment or if high-risk anatomy is identified."},
    {tone:"red", h:"⚠ The interaction that kills — PDE5 inhibitors and nitrates", html:"Never combine organic nitrates, GTN, nicorandil or recreational nitrate/nitrite products (‘poppers’) with a PDE5 inhibitor. Nitrates must not be used within 24 hours of sildenafil or vardenafil, or within 48 hours of tadalafil. For avanafil, follow the current product information or obtain urgent specialist advice because the interval is product-specific. <b>Profound refractory hypotension.</b> Angina patients ARE the erectile-dysfunction demographic, so ask proactively. If chest pain occurs after a PDE5 inhibitor: <b>do not use GTN</b>. Stop activity, sit down and call 999 if the pain persists or is concerning; tell the ambulance crew which drug was taken and when."},
    {tone:"red", h:"⛔ Do not routinely combine a beta-blocker with verapamil or diltiazem", html:"Not in primary care, because of <b>additive bradycardia, AV block and negative inotropy</b>. If a specialist deliberately combines them, this requires an explicit plan and appropriate ECG/clinical monitoring. When combining a beta-blocker with a CCB, NICE recommends a <b>dihydropyridine</b> — amlodipine, felodipine or MR nifedipine. Do not stop a beta-blocker abruptly unless there is an urgent clinical reason: abrupt withdrawal can cause rebound tachycardia, worsening angina and, in susceptible patients, ischaemia or arrhythmia. Taper according to the SPC, indication and clinical circumstances."},
    {tone:"blue", h:"The GTN 5-5-999 rule", html:"Pain → stop, sit down, use GTN. Still there at 5 minutes → second dose. Still there 5 minutes after the second dose → 999. <b>Call 999 at once</b> if the pain is severe or associated with collapse, marked breathlessness or significant sweating — never delay for repeated GTN. <b>Say it, write it, and check recall at every review.</b> <b>Sit down first</b> — GTN drops blood pressure, and syncope on a ladder is how GTN injures people. <b>Use it BEFORE predictable triggers too</b> — hills, cold mornings, sex."},
    {tone:"amber", h:"Titrate before calling a drug failed", html:"Beta-blocker OR calcium-channel blocker, chosen by heart rate, BP, LV function, bronchospasm, conduction disease and preference, titrated to symptom response, heart rate, blood pressure and adverse effects. Avoid symptomatic bradycardia, hypotension and clinically significant conduction disease; do not use a fixed heart-rate target in isolation. Usual adult dosing — check the current SPC, renal/hepatic function, age, interactions and the GM formulary; MR diltiazem is prescribed by brand. <b>Review at 2–4 weeks. \"Failed\" at half dose is not failed.</b> Not tolerated → switch class rather than combine."},
    {tone:"green", h:"The secondary-prevention bundle reduces cardiovascular risk", html:"For confirmed stable coronary artery disease, consider aspirin 75 mg daily after assessing bleeding risk, co-prescribed anticoagulants and comorbidity (clopidogrel if aspirin is unsuitable; after MI or PCI, follow the cardiology antiplatelet plan; do not add aspirin routinely to therapeutic anticoagulation without a clear indication) · atorvastatin 80 mg (unless a lower dose is indicated) to LDL ≤2.0 or non-HDL ≤2.6; if not reached, check adherence, dose, interactions, secondary causes and tolerability, then consider ezetimibe or further treatment per NICE criteria and the GM lipid pathway · an ACE inhibitor/ARB for its own indication (diabetes, hypertension, albuminuric CKD, LV dysfunction, post-MI) — not for angina alone · BP and glucose to target · vaccines per the UK schedule (annual influenza where eligible)."},
    {tone:"blue", h:"Be accurate about revascularisation", html:"PCI and CABG are effective for symptom relief. In selected patients with stable coronary disease without left-main disease or severe LV dysfunction, an initial optimal-medical-therapy strategy has not shown a routine survival advantage from early invasive treatment (ISCHEMIA excluded important high-risk groups; ORBITA was small and short-term). Revascularisation may offer prognostic benefit in selected high-risk anatomical or clinical groups and should be decided by the cardiology Heart Team. NICE CG126: consider revascularisation when symptoms remain inadequately controlled despite optimal medical treatment, and consider CABG for appropriate anatomy, including left-main or complex three-vessel disease. Diabetes alone is not sufficient — the decision depends on coronary anatomy, LV function, comorbidity, operative risk, completeness of revascularisation and patient preference."}
  ],
  pathwaySub:"Five steps, and the last one checks both tracks every single time.",
  pathway:[
    {title:"Confirm it is angina — and that it is stable", html:"The three-point definition, CCS class, and the red flags. New, prolonged, recurrent or crescendo rest pain is possible ACS — not a titration problem; do not use this pathway for suspected ACS.", alert:true},
    {title:"Teach GTN properly", html:"Sit down, 1–2 sprays per product instructions, repeat at 5 minutes, 999 if pain persists 5 minutes after the second dose, use before predictable exertion, and the PDE5-inhibitor washout."},
    {title:"Climb the anti-anginal ladder", html:"Beta-blocker or CCB titrated → switch or combine with a dihydropyridine CCB → if both unsuitable, a long-acting nitrate, ivabradine, nicorandil or ranolazine; a third drug only while awaiting revascularisation or when it is inappropriate."},
    {title:"Run the prevention bundle in parallel", html:"Antiplatelet after bleeding assessment, high-intensity statin to target, ACE inhibitor/ARB for its own indication, blood pressure and glucose, smoking, activity, mood and vaccines."},
    {title:"Review both tracks — and watch the rescue use", html:"Increasing GTN use, reduced exercise tolerance or avoidance of usual activity may indicate deterioration and should prompt reassessment of the symptom pattern (some patients reduce activity and report fewer sprays despite worsening disease). And check the statin is still being taken."}

    {id:"safety", nav:"Unstable?", title:"Red flags — the pattern change that stops this being stable angina",
     blocks:[
       {b:"table", head:["Feature","Meaning","Action"], rows:[
         ["<b>New, prolonged, recurrent or crescendo rest or nocturnal pain</b>","<b>Possible ACS</b>","<b>Current ongoing chest pain, pain with haemodynamic compromise, syncope, severe breathlessness or dynamic ECG changes: 999. New rest pain, crescendo angina or rapidly worsening symptoms that have settled: same-day acute assessment, not routine medication titration</b>"],
         ["<b>Crescendo pattern — more frequent, longer, or at a lower threshold</b>","<b>Unstable angina</b>","<b>Same-day assessment</b>"],
         ["<b>New or rapidly worsening angina</b>","<b>Possible unstable presentation</b>","<b>Same-day or urgent assessment per CG95</b>"],
         ["<b>Pain persisting 5 minutes after the second GTN dose</b>","<b>Possible MI</b>","<b>999 — the rule the patient must be able to recite</b>"],
         ["<b>Chest pain with syncope, new murmur, or haemodynamic compromise</b>","<b>Severe aortic stenosis, arrhythmia, mechanical complication</b>","<b>Same-day assessment; echocardiography</b>"],
         ["Chest pain after a PDE5 inhibitor in the last 24 hours (48 for tadalafil)","GTN is contraindicated — giving it risks profound refractory hypotension","Do NOT use the GTN. Stop activity, sit down and call 999 if the pain persists or is concerning; tell the crew which drug was taken and when"],
         ["<b>Angina that has worsened without a change in coronary disease</b>","An amplifier: anaemia, thyrotoxicosis, new AF or tachyarrhythmia, uncontrolled hypertension, heart failure, infection, hypoxia","<b>Look for the amplifier before assuming progression</b> — FBC, TFTs, ECG, BP. Treating the amplifier often resolves the angina"]
       ]},
       {b:"warn", html:"The commonest error in this condition is treating a pattern change as a dose problem. Stable angina is predictable, exertional and relieved by rest; the moment any of those three stops being true, the consultation changes from titration to acute assessment. <b>Ask about GTN use and activity avoidance at every review</b> — increasing GTN use, reduced exercise tolerance or avoidance of usual activity may indicate deterioration and should prompt reassessment of the symptom pattern. Obtain an ECG promptly when symptoms are current or recently occurred, but do not delay emergency transfer for primary-care investigations."}
     ]},

    {id:"confirm", nav:"Confirm", title:"Making the diagnosis",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>The three-point definition</b>","(1) Constricting discomfort in the chest, arm, neck, jaw or shoulder, (2) brought on by exertion, (3) relieved by rest or GTN within about 5 minutes. All three = typical angina · two = atypical · one or none = non-anginal"],
         ["<b>Diagnostic route</b>","For new suspected stable angina in patients without established CAD, take a resting 12-lead ECG and use the local rapid-access chest-pain pathway. CTCA (64-slice or above) is first-line for typical or atypical anginal chest pain, and for non-anginal chest pain when the ECG shows ST–T changes or Q waves (NICE CG95) — not for all chest pain. <b>Do not use this pathway for suspected ACS.</b> For patients with previous MI, PCI, CABG or known CAD, recurrent symptoms generally need a different pathway — functional imaging or cardiology assessment rather than simply repeating first-line CTCA. It may be unsuitable with heavy calcification, arrhythmia or uncontrolled rate, inability to breath-hold, contrast allergy or severe renal impairment. If CTCA is non-diagnostic or shows CAD of uncertain functional significance, arrange functional imaging. Invasive angiography is generally reserved for selected third-line or high-risk situations. Do not 'trial GTN' as a diagnostic test — oesophageal spasm responds to it too"],
         ["<b>Confirm it is STABLE</b>","<b>Predictable, exertional, relieved by rest.</b> Rest pain, crescendo frequency or new pain moves this to the red-flag table above"],
         ["<b>Quantify with CCS class</b>","I — strenuous exertion only · II — slight limitation · III — marked limitation (e.g. one flight of stairs — an example, varies with fitness and comorbidity) · IV — any activity, or at rest. Record triggers (cold, meals, emotion) and what it stops them doing"],
         ["<b>Baseline tests</b>","ECG (old MI, AF, LVH) · FBC (anaemia is an angina amplifier) · TFTs · HbA1c · lipids · U&amp;Es · blood pressure · weight. Echocardiography if there is a murmur, heart-failure signs or previous MI"]
       ]},
       {b:"why", html:"<b>Two tracks run forever.</b> Anti-anginals mainly improve symptoms and exercise tolerance — not assumed to reduce events unless there is a separate indication — for example, beta-blockers after MI or in heart failure, and ACE inhibitors/ARBs for their established indications. Disease-modifying treatments such as statins and appropriate antiplatelet therapy reduce cardiovascular risk but do not relieve angina. Every review checks both — and the classic failure is the comfortable patient whose statin was quietly stopped, because the drug that was doing the risk-reduction work was the one with no perceptible effect."}
     ]},

    {id:"gtn", nav:"GTN", title:"GTN — the rules that save lives, and the one that kills",
     blocks:[
       {b:"table", head:["Point","Detail"], rows:[
         ["<b>How to use it</b>","<b>SIT DOWN first</b> — it drops blood pressure, and syncope on a ladder is how GTN injures people. <b>1–2 sprays under the tongue per the product instructions.</b> <b>Use it BEFORE predictable triggers as well</b> — hills, cold mornings, sex"],
         ["<b>The 5-5-999 rule</b>","Pain → stop and rest and use GTN. Still there at 5 minutes → second dose. Still there 5 minutes after the second dose → 999 (immediately if the pain is severe or associated with collapse, marked breathlessness or significant sweating). <b>Say it, write it, and check recall at every review</b>"],
         ["<b>What to expect</b>","Headache and flushing are common side effects (they do not prove it is working) — paracetamol helps and they usually pass. Light-headedness means sit down for longer"],
         ["<b>Tablets versus spray</b>","Spray suits most people; tablet storage and expiry are product-specific — follow the SPC. Tablets can be spat out if side effects are troublesome"],
         ["<b>The interaction that kills</b>","Never combine organic nitrates, GTN, nicorandil or recreational nitrate/nitrite products (‘poppers’) with a PDE5 inhibitor. No nitrate within 24 hours of sildenafil or vardenafil, or 48 hours of tadalafil; for avanafil, follow the current product information or obtain urgent specialist advice (the interval is product-specific). <b>Profound refractory hypotension.</b> Ask proactively — angina patients are the ED demographic. Chest pain after a PDE5 inhibitor: do not use GTN; stop activity, sit down and call 999 if the pain persists or is concerning, and tell the crew which drug was taken and when"]
       ]},
       {b:"say", html:"If you get the pain: stop what you are doing and sit down — sit down first, because the spray drops your blood pressure and I do not want you fainting on a ladder. One or two sprays under the tongue. If it is still there after five minutes, take another. If it is still there five minutes after that, call 999 — and call straight away if it is severe or you feel faint or breathless. And one more thing I ask every man on this spray, so please do not take it personally: if you ever take Viagra or anything like it, you must not use this spray for twenty-four hours afterwards (two days for tadalafil) — the two together can drop your blood pressure dangerously. The same applies to poppers. If you get chest pain in that window, do not use the spray: stop, sit down, and call 999 if the pain persists or worries you — and tell them what you took and when."}
     ]},

    {id:"ladder", nav:"Symptoms", title:"The anti-anginal ladder — dosing per SPC, real traps",
     sub:"This track mainly improves symptoms. Usual adult dosing — check the current SPC, renal/hepatic function, age, interactions and the GM formulary.",
     blocks:[
       {b:"table", head:["Step","Drug and dose","Notes"], rows:[
         ["<b>Step 1 — beta-blocker OR calcium-channel blocker, titrated</b>","<b>Beta-blocker</b> (e.g. bisoprolol — especially post-MI, heart failure or a high resting rate) — caution in bradycardia, heart block, sick sinus, decompensated HF, severe bronchospasm. OR a <b>CCB</b>: rate-limiting diltiazem MR (prescribe by brand) or verapamil (not in HFrEF, bradycardia or conduction disease), or <b>amlodipine</b>, which also treats BP. Titrate against angina, HR, BP and side effects","Review at 2–4 weeks. \"Failed\" at half dose is not failed — titrate before judging. Not tolerated → switch to the other class rather than combining"],
         ["<b>Step 2 — combine: beta-blocker + dihydropyridine CCB</b>","Beta-blocker plus a dihydropyridine CCB — amlodipine, felodipine or MR nifedipine (NICE)","Do not routinely combine a beta-blocker with verapamil or diltiazem in primary care (additive bradycardia, AV block, negative inotropy); if a specialist deliberately combines them, this requires an explicit plan and appropriate ECG/clinical monitoring. Check ankles for amlodipine oedema — switch to lercanidipine rather than abandoning the class"],
         ["<b>Step 3 — if BB/CCB unsuitable, or a third agent</b>","<b>Long-acting nitrate</b> (e.g. isosorbide mononitrate) — any schedule that gives a daily nitrate-free or low-nitrate interval to prevent tolerance, per the product SPC (no single schedule is the only acceptable one)","<b>Third drug only while awaiting revascularisation or when it is inappropriate or unacceptable — not if controlled on two</b>"],
         ["<b>Ivabradine</b>","Per SPC","Assess sinus rhythm (sinus rhythm only), resting heart rate, bradycardia, atrial fibrillation, blood pressure and drug interactions; do not combine with verapamil or diltiazem; watch visual symptoms and CYP3A4 interactions (MHRA)"],
         ["<b>Ranolazine</b>","Per SPC","No heart-rate or BP effect. QT prolongation (review other QT drugs), hepatic and renal cautions, CYP3A4 inhibitors and inducers"],
         ["<b>Nicorandil</b>","Second-line, per SPC","MHRA: any new mouth, skin, eye, genital, perianal or gastrointestinal ulceration may be nicorandil-related — stop nicorandil and seek specialist advice; these ulcers may progress to perforation, haemorrhage, fistula or abscess and generally heal only after withdrawal. Concomitant aspirin, NSAIDs or corticosteroids may increase the risk of GI ulceration, perforation or haemorrhage. <b>Same PDE5-inhibitor ban as nitrates</b>"],
         ["<b>Refer for revascularisation assessment</b>","<b>Limiting symptoms despite two optimised agents</b>","PCI/CABG are effective for symptom relief; in selected stable patients without left-main disease or severe LV dysfunction, early invasive treatment has not shown a routine survival advantage over initial optimal medical therapy (ISCHEMIA). Revascularisation may offer prognostic benefit in selected high-risk anatomical or clinical groups (e.g. left-main or complex three-vessel disease — CABG considered, CG126); diabetes alone is not sufficient. Heart Team decision"]
       ]},
       {b:"warn", html:"Do not stop a beta-blocker abruptly unless there is an urgent clinical reason. Abrupt withdrawal can cause rebound tachycardia, worsening angina and, in susceptible patients, ischaemia or arrhythmia. Taper according to the SPC, indication and clinical circumstances. And in the multimorbid patient, one drug doing two jobs beats polypharmacy: bisoprolol covers angina and heart failure (avoid verapamil and diltiazem in HFrEF unless specifically directed by cardiology); amlodipine covers angina and hypertension. See <a href='heart-failure.html'>heart failure</a> and <a href='hypertension.html'>hypertension</a>."}
     ]},

    {id:"prevention", nav:"Survival", title:"The secondary-prevention bundle — reducing cardiovascular risk",
     blocks:[
       {b:"table", head:["Drug","Dose","Notes"], rows:[
         ["<b>Aspirin</b>","<b>For confirmed stable coronary artery disease, consider 75 mg daily</b> after assessing bleeding risk, co-prescribed anticoagulants and comorbidity (NICE CG126)","<b>Clopidogrel if aspirin is unsuitable.</b> After MI or PCI, follow the cardiology antiplatelet plan. Do not add aspirin routinely to therapeutic anticoagulation without a clear indication. Aspirin is not routinely indicated for primary prevention in people without established cardiovascular disease. PPI cover where there is GI risk — see <a href='antiplatelets-anticoagulants.html'>antiplatelets and anticoagulants</a>"],
         ["<b>Atorvastatin</b>","<b>80 mg — the secondary-prevention dose</b>","Unless a lower dose is indicated because of interactions, adverse-effect risk or patient preference. Target LDL ≤2.0 or non-HDL ≤2.6 (NG238). Not reached → first check adherence, dose, interactions, secondary causes and tolerability; then consider ezetimibe or further treatment according to NICE criteria and the current GM lipid pathway (ezetimibe may also be considered even when at target). Injectable treatments such as inclisiran or PCSK9 inhibitors are not automatic next steps — they require specific NICE and local eligibility criteria"],
         ["<b>ACE inhibitor / ARB</b>","Per indication and SPC","Consider in angina with diabetes; offer or continue for hypertension, albuminuric CKD, HF with LVSD or post-MI per their guidelines — not for angina alone. Check renal function, K⁺, pregnancy, angioedema, no ARB/aliskiren combination"],
         ["<b>Blood pressure and diabetes to target</b>","<b>Per their own protocols</b>","Address smoking, blood pressure, diabetes, lipids, weight, diet, physical activity, alcohol and psychological wellbeing using the relevant current pathway"],
         ["<b>Vaccination</b>","<b>Per the current UK schedule</b>","Annual influenza where eligible; pneumococcal by age and risk group (not annual)"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"red", h:"🚭 Smoking is the biggest single modifiable risk", html:"<b>Cessation support at every contact.</b> Stopping substantially reduces risk — worth saying out loud."},
         {tone:"green", h:"🏃 Regular activity — once stable", html:"Once stable, encourage regular activity within the agreed safe limit, ideally through cardiac rehabilitation or a structured programme. Stop if angina develops; use the agreed GTN plan and seek review if the threshold is falling. <b>Do not deliberately exercise through chest pain.</b>"},
         {tone:"green", h:"🥗 Diet and weight", html:"A Mediterranean-style pattern and weight management support secondary prevention."},
         {tone:"amber", h:"🧠 Mood and adherence", html:"Screen for depression, anxiety and illness-related avoidance where symptoms or adherence are affected; treat by diagnosis and preference, considering cardiac status, QT risk, antiplatelets and hyponatraemia. See <a href='depression.html'>depression</a>."},
         {tone:"blue", h:"❄️ Plan around the triggers", html:"<b>Cold mornings, heavy meals, unaccustomed exertion.</b> GTN before the trigger, a scarf over the mouth in winter."},
         {tone:"purple", h:"🚗 DVLA", html:"Group 1 (car, motorcycle): no notification needed, but the patient MUST stop driving if symptoms occur at rest, with emotion, or at the wheel — and may resume when controlled. Group 2 (bus, coach, lorry): must notify the DVLA; no driving while symptoms continue, and licensing generally requires at least 6 weeks free of angina plus the relevant functional test requirements. The patient should also check the requirements of their motor insurer, particularly after a change in symptoms or diagnosis, and never drive if symptoms, hypotension, syncope or side effects impair control. Record the advice."}
       ]}
     ]},

    {id:"monitor", nav:"Review", title:"The review — both tracks, every time",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["<b>Symptom track — frequency, CCS class, GTN sprays per week</b>","<b>Every review, and 2–4 weeks after any change</b>","Increasing GTN use, reduced tolerance or a lower threshold → reassess the pattern and treatment (some patients avoid activity instead)"],
         ["<b>Pattern check</b>","<b>Every contact</b>","Less predictable? Lower threshold? Rest symptoms? → unstable → same-day or 999, not a routine titration"],
         ["<b>Heart rate and blood pressure</b>","<b>At each titration</b>","Titrate to symptom response, heart rate, blood pressure and adverse effects. Avoid symptomatic bradycardia, hypotension and clinically significant conduction disease; do not use a fixed heart-rate target in isolation. Hypotension limiting titration is the ranolazine niche"],
         ["<b>Prevention track — lipids</b>","<b>2–3 months after starting or changing lipid-lowering treatment, then annually once stable</b>","<b>LDL ≤2.0 or non-HDL ≤2.6. Not reached → check adherence, dose, interactions, secondary causes and tolerability → consider ezetimibe or further treatment per NICE criteria and the GM lipid pathway</b>"],
         ["<b>Adherence to BOTH tracks</b>","<b>Every review</b>","<b>Check the statin and antiplatelet are still being taken — a symptom-free patient may have quietly stopped them</b>"],
         ["<b>Annual bundle</b>","<b>Once a year</b>","Lipids, HbA1c, blood pressure, smoking, weight, mood, GTN technique with 5-5-999 recall, and the DVLA position if Group 2"]
       ]},
       {b:"say", html:"You have two kinds of medicine and they do completely different jobs. The spray and the daily heart tablets are mainly for comfort — they ease the pain. The statin, and the aspirin if you take it, lower your risk of a heart attack — and they only work if you keep taking them, even on the days you feel well. And one rule to remember: pain still there five minutes after the second spray is a 999 call, not a wait-and-see."},
       {b:"cards", items:[
         {tone:"red", h:"🔴 999", html:"\"Pain still there five minutes after the second spray — 999. New pain at rest, or pain coming more often or more easily — contact us the same day.\""},
         {tone:"amber", h:"🟠 Using the spray more often?", html:"\"If you are reaching for the spray more than you used to, tell me — that can be a sign things need adjusting, and I would rather know early.\""},
         {tone:"blue", h:"💊 Never stop the beta-blocker suddenly", html:"\"If you want to come off the heart-rate tablet, come and see me — stopping it suddenly can make the angina worse and, in some people, strain the heart. We reduce it gradually in a way that suits your dose and situation.\""},
         {tone:"green", h:"✓ About a stent", html:"\"A stent or bypass may improve your symptoms. For many people with stable disease, starting with the right tablets is as safe as going straight to a procedure — but some artery patterns, such as left-main or complex multivessel disease, do better with one. The heart team will weigh your anatomy, your other conditions and what you want.\""}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Emergency — 999", html:"Pain persisting 5 minutes after the second GTN dose · new, prolonged or crescendo rest pain · suspected ACS · chest pain with syncope or haemodynamic compromise · chest pain within 24 hours of a PDE5 inhibitor (48 hours for tadalafil) that persists or is concerning — GTN is contraindicated."},
         {tone:"amber", h:"Rapid-access chest pain clinic", html:"New suspected stable angina without established CAD — CT coronary angiography for typical or atypical anginal pain, or non-anginal pain with ST–T changes or Q waves (CG95). Known CAD with recurrent symptoms → cardiology assessment or functional imaging."},
         {tone:"amber", h:"Cardiology — revascularisation assessment", html:"<b>Limiting symptoms despite optimal medical therapy</b>, high-risk anatomy or functional results, left-main or proximal three-vessel disease, or PCI-versus-CABG uncertainty — Heart Team assessment."},
         {tone:"blue", h:"Echocardiography", html:"<b>Murmur, heart-failure signs, or previous MI.</b> Aortic stenosis is the mimic that changes management completely."},
         {tone:"green", h:"Cardiac rehabilitation", html:"<b>After MI or revascularisation</b> — and worth asking about in anyone whose activity has collapsed through fear of the pain."},
         {tone:"cream", h:"GP management", html:"Diagnosis routing, GTN teaching, the whole anti-anginal ladder, the prevention bundle, amplifier hunting, DVLA advice and the two-track review all belong here. Related pages: <a href='hypercholesterolaemia.html'>lipid management</a> · <a href='hypertension.html'>hypertension</a> · <a href='heart-failure.html'>heart failure</a> · <a href='atrial-fibrillation.html'>atrial fibrillation</a> · <a href='mi-secondary-prevention.html'>post-MI secondary prevention</a> · <a href='antiplatelets-anticoagulants.html'>antiplatelets and anticoagulants</a>."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 64-year-old man with stable angina attends for review. He is on <b>bisoprolol 2.5 mg</b> and <b>atorvastatin 80 mg</b>, and uses his GTN <b>\"three or four times a week now, it used to be once a fortnight\"</b>. He walks more slowly to avoid the pain. He mentions, unprompted and awkwardly, that he has been <b>buying sildenafil online</b>. His resting heart rate is 78 and BP 138/82."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"<b>Recognises rising GTN use as a warning sign that prompts reassessment</b> and asks whether the pattern is still predictable — distinguishing escalation from instability; addresses the sildenafil immediately and non-judgementally: the 24-hour nitrate washout, and that chest pain in that window means no GTN — sit down and call 999 if it persists or is concerning; notes bisoprolol is at 2.5 mg with a resting HR of 78 — the drug is NOT failed, it is untitrated, and titrates it against symptoms, HR and BP; <b>checks the statin is actually being taken and the lipid target met</b>; <b>hunts the amplifier — FBC for anaemia, TFTs, ECG for new AF</b> — before assuming disease progression; <b>re-teaches the 5-5-999 rule and checks recall</b>; <b>addresses activity avoidance</b> — regular activity without pushing through angina, cardiac rehab; <b>gives DVLA advice</b>; and <b>explains the two tracks explicitly</b>, so the survival drugs are not mistaken for the comfort ones."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE CG126 — Stable angina: management (2011, updated 2016)</b><br><a href="https://www.nice.org.uk/guidance/cg126" rel="noopener">nice.org.uk/guidance/cg126</a><span class="rd"> — beta-blocker or calcium-channel blocker first-line and titrated to maximum, the safe and unsafe combinations, the third-line agents, and revascularisation for symptom control</span></li>'+
         '<li><b>NICE CG95 — Recent-onset chest pain of suspected cardiac origin: assessment and diagnosis (2010, updated 2016)</b><br><a href="https://www.nice.org.uk/guidance/cg95" rel="noopener">nice.org.uk/guidance/cg95</a><span class="rd"> — the three-point definition of typical angina, and 64-slice or above CT coronary angiography for typical or atypical angina, or non-anginal pain with ST–T changes or Q waves</span></li>'+
         '<li><b>NICE NG238 — Cardiovascular disease: risk assessment and reduction, including lipid modification (2023)</b><span class="rd"> — atorvastatin 80 mg for secondary prevention, the LDL ≤2.0 and non-HDL ≤2.6 targets, and ezetimibe or further treatment per NICE criteria and the GM lipid medication eligibility pathway</span></li>'+
         '<li><b>ISCHEMIA (Maron et al., NEJM 2020) and ORBITA (Al-Lamee et al., Lancet 2018)</b><span class="rd"> — in selected stable patients (ISCHEMIA excluded left-main disease and severe LV dysfunction; ORBITA was small and short-term), early invasive treatment has not shown a routine reduction in death or MI compared with optimal medical therapy; revascularisation relieves symptoms and may offer prognostic benefit in selected high-risk groups</span></li>'+
         '<li><b>MHRA Drug Safety Updates</b><span class="rd"> — nicorandil and gastrointestinal, skin and eye ulceration; ivabradine contraindicated with verapamil or diltiazem; the nitrate and PDE5-inhibitor interaction</span></li>'+
         '<li><b>DVLA — Assessing fitness to drive</b><br><a href="https://www.gov.uk/guidance/assessing-fitness-to-drive-a-guide-for-medical-professionals" rel="noopener">gov.uk — assessing fitness to drive</a><span class="rd"> — Group 1 requires no notification but driving must stop if symptoms occur at rest, with emotion or at the wheel; Group 2 requires notification, and relicensing after at least 6 weeks free of angina with the exercise or functional test requirements met</span></li>'+
         '<li><b>Lyon Diet Heart Study (de Lorgeril et al., Circulation 1999)</b><span class="rd"> — the Mediterranean dietary pattern evidence referenced in the prevention bundle</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Stable angina — NICE CG95, CG126 and NG238, MHRA safety updates and DVLA guidance. Two tracks: most anti-anginals are prescribed for symptom control; statins and appropriate antiplatelet therapy reduce cardiovascular risk. Teach the GTN 5-5-999 rule and ask every patient about PDE5 inhibitors and poppers — no nitrate within 24 hours of sildenafil or vardenafil, 48 for tadalafil, avanafil per current product information, and the same applies to nicorandil. Do not routinely combine a beta-blocker with verapamil or diltiazem in primary care, and do not stop a beta-blocker abruptly. Revascularisation relieves symptoms and may improve prognosis in selected anatomy. Verify all doses against the SPC and GM formulary."
});
