<script>
MG.render({
  icon:"🫁",
  title:"Suspected pulmonary embolism in primary care",
  eyebrow:"Protocol · NICE NG158 · the D-dimer belongs to one group only",
  stemTitle:"A common diagnostic error is requesting D-dimer in a Wells-likely patient — NICE recommends immediate imaging in that group, and a negative D-dimer is not the appropriate rule-out test there; follow the imaging pathway",
  stemSub:"Assess stability, use the two-level Wells pathway, reserve D-dimer for Wells-unlikely patients, arrange same-day imaging, anticoagulate only through an appropriate interim pathway, and review duration and post-PE breathlessness. Suspected PE requires same-day acute assessment. Primary care should recognise, stratify and refer promptly, and may initiate interim therapeutic anticoagulation where this is supported by the local pathway and imaging will be delayed; acute diagnosis and outpatient eligibility are managed through the local acute/ambulatory care pathway, while follow-up — duration, monitoring, provoking factors and post-PE symptoms — is ours. This page carries the presentations that get missed — isolated breathlessness, syncope, an \"atypical chest infection\" that will not settle — the two-level Wells fork, the <b>DOAC loading schedules that differ from AF dosing</b>, the duration decision, pregnancy and cancer, and the post-PE breathlessness review at 3–6 months.",
  guideline:"NICE NG158 (2020, updated 2023) · NICE NG12 (updated April 2026) · BTS 2018 (outpatient PE) · RCOG Green-top (pregnancy) · ESC 2019 (international, CTEPH follow-up)",
  reviewed:"13 September 2026",
  nextReview:"13 March 2027",
  meta:[
    {t:"NICE NG158 — venous thromboembolic diseases"},
    {t:"D-dimer is a RULE-OUT, and only if Wells ≤4", tone:"tw"},
    {t:"PE dosing has a LOADING phase — unlike AF", tone:"tw"},

    {t:"v2.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#safety"><b>Unstable</b><small>Possible high-risk PE</small></a><a href="#recognise"><b>Recognise</b><small>The missed ones</small></a><a href="#wells"><b>Stratify</b><small>Wells · D-dimer</small></a><a href="#treat"><b>Treat</b><small>Loading doses</small></a><a href="#follow"><b>Follow up</b><small>CTEPH · duration</small></a></div>',
  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Haemodynamic instability — do not score, do not D-dimer, do not wait", html:"Syncope, hypoxia, tachycardia or severe breathlessness may indicate a large or haemodynamically significant PE. If there is hypotension, shock, peri-arrest physiology or severe clinical deterioration, arrange immediate emergency transfer — <b>possible high-risk PE requiring immediate emergency assessment: 999.</b> Do not delay for Wells scoring or D-dimer testing. A patient with syncope but normal blood pressure and no severe physiological compromise still requires urgent assessment, but not automatically a diagnosis of massive PE."},
    {tone:"red", h:"⛔ Do not use D-dimer in the Wells-LIKELY patient", html:"Do not use D-dimer to investigate a Wells-likely PE. NICE recommends immediate imaging in this group; D-dimer is intended for the Wells-unlikely pathway (Wells ≤4) and should not replace imaging when clinical probability is high. D-dimer is not a rule-in test and a positive result is non-specific. A common diagnostic error is requesting D-dimer in a Wells-likely patient — a negative D-dimer is not the appropriate rule-out test in that group; follow the imaging pathway."},
    {tone:"amber", h:"The presentations that get missed", html:"Isolated unexplained breathlessness or tachycardia · syncope or pre-syncope, which can be the ONLY sign of a large PE · an \"atypical chest infection\" that is not responding · new atrial fibrillation · unexplained hypoxia. <b>Consider PE in any breathless or collapsed patient with risk factors</b>, not only the one with pleuritic pain and a swollen calf."},
    {tone:"blue", h:"PE DOAC dosing has a loading phase — AF dosing does not", html:"Apixaban 10 mg BD for 7 days, then 5 mg BD. Rivaroxaban 15 mg BD for 21 days, then 20 mg OD with food. <b>Edoxaban and dabigatran need at least 5 days of LMWH lead-in first.</b> These are treatment doses for confirmed or appropriately managed acute VTE, not AF doses. <b>Getting the loading phase wrong under-treats the clot</b>, and it is an easy error for anyone used to prescribing DOACs for AF. Before prescribing, calculate creatinine clearance (Cockcroft–Gault, not eGFR alone), check weight and review interacting drugs."},
    {tone:"amber", h:"Pregnancy and postpartum: the RCOG pathway, not NG158", html:"Suspected PE in pregnancy or the puerperium requires urgent obstetric medicine involvement and the local RCOG-based pathway — NICE NG158 does not cover pregnancy. Do not use the non-pregnant Wells/D-dimer pathway as a substitute for obstetric assessment. Therapeutic LMWH is generally used while PE is being investigated unless contraindicated, where there is genuine clinical suspicion. DOACs are avoided during pregnancy and breastfeeding; warfarin is contraindicated during pregnancy but may be considered postpartum under specialist guidance."},
    {tone:"green", h:"Still breathless months later? Assess, and think CTEPH", html:"At follow-up, ask about persistent or worsening breathlessness, exercise limitation, chest pain, syncope and functional recovery. If symptoms remain unexplained at around 3–6 months, assess for recurrent VTE and alternative causes (deconditioning, anaemia, cardiac disease, COPD, post-PE anxiety), arrange echocardiography where appropriate, and refer to a pulmonary hypertension/CTEPH service if indicated. Not every patient requires routine echocardiography."}
  ],
  pathwaySub:"Six steps. The second one is where the error usually happens.",
  pathway:[
    {title:"Assess stability first", html:"Record airway, breathing and circulation, blood pressure, heart rate, respiratory rate, SpO₂, mental state, chest pain, haemoptysis, syncope, and bleeding risk and contraindications to anticoagulation. <b>Shock, persistent hypotension, peri-arrest physiology or severe deterioration → 999, resuscitation and emergency transfer.</b> Do not wait for Wells, D-dimer or outpatient imaging.", alert:true},
    {title:"Stable: chest X-ray and the two-level Wells score", html:"History and examination; chest X-ray where appropriate (a normal X-ray does not exclude PE); record the Wells score and your reasoning. Likely (>4) → same-day CTPA (V/Q SPECT or planar V/Q if CTPA is unsuitable); if imaging is delayed, consider interim therapeutic anticoagulation through the local pathway, taking baseline bloods without delaying treatment. Unlikely (≤4) → D-dimer with the result available within 4 hours (age-adjusted threshold over 50 where validated locally; if delayed beyond 4 hours, consider interim therapeutic anticoagulation). Negative → PE unlikely: stop interim anticoagulation and reassess. Positive → same-day imaging."},
    {title:"Anticoagulate with the right loading schedule", html:"After confirmed PE: apixaban 10 mg BD ×7 days → 5 mg BD, or rivaroxaban 15 mg BD ×21 days → 20 mg OD with food. LMWH followed by edoxaban or dabigatran where appropriate; LMWH or VKA-based treatment where DOACs are unsuitable. Calculate creatinine clearance and review interactions before prescribing."},
    {title:"Handle the special situations", html:"Pregnancy or postpartum → RCOG/local obstetric pathway, therapeutic LMWH where indicated and urgent obstetric medicine input. Active cancer → DOAC or LMWH according to tumour site, bleeding risk, interactions, renal function and patient preference; review at 3–6 months. Suspected antiphospholipid syndrome → haematology advice. Severe renal impairment → specialist advice. Unprovoked → a targeted work-up, not a blanket cancer screen."},
    {title:"Decide duration at 3 months", html:"At three months, reassess the provoking factors, recurrence risk, bleeding risk, renal function, adherence, patient preference and ongoing need for anticoagulation. Stopping after three months may be appropriate after a resolved transient provoking factor, but is not automatic. Unprovoked PE and persistent risk factors often favour extended therapy, subject to bleeding risk and shared decision-making (NG158)."},
    {title:"Ask about breathlessness at 3–6 months", html:"Persistent breathlessness, exercise limitation, chest pain, syncope or poor functional recovery → look for recurrent VTE and alternative causes; echocardiography and pulmonary hypertension referral if symptoms remain unexplained."}
  ],
  sections:[

    {id:"safety", nav:"Unstable", title:"Red flags — the unstable patient and the missed presentations",
     blocks:[
       {b:"table", head:["Feature","Meaning","Action"], rows:[
         ["Hypotension, shock, peri-arrest physiology or severe clinical deterioration","<b>Possible high-risk PE requiring immediate emergency assessment</b>","999 — resuscitation and emergency transfer. Do NOT score, do NOT send a D-dimer, do NOT wait for a CTPA slot"],
         ["<b>Syncope or pre-syncope with risk factors</b>","<b>Can be the ONLY sign of a large PE</b>","Urgent same-day assessment; 999 if there is hypotension, shock or severe physiological compromise"],
         ["<b>Isolated unexplained breathlessness or tachycardia</b>","PE, frequently missed because the chest is clear and the pain is absent","Assess formally with Wells rather than reassuring on a normal examination or a normal chest X-ray"],
         ["<b>\"Atypical chest infection\" not responding to antibiotics</b>","<b>PE misdiagnosed as pneumonia</b>","<b>Reconsider the diagnosis rather than changing the antibiotic</b>"],
         ["<b>New atrial fibrillation or unexplained hypoxia</b>","<b>Can be the presenting feature of PE</b>","<b>Consider PE in the differential</b>"],
         ["<b>Suspected PE in pregnancy or the postpartum period</b>","<b>PE is a major cause of maternal morbidity and mortality</b>","Urgent obstetric assessment via the local RCOG-based pathway; therapeutic LMWH while investigating where suspicion is genuine and there is no major contraindication"],
         ["<b>Major bleeding, or head injury, while anticoagulated</b>","Anticoagulant-related haemorrhage; intracranial bleeding may be delayed","<b>A&amp;E same day, however well they feel</b>"]
       ]},
       {b:"dl", rows:[
         ["<b>Risk factors to ask about</b>","Recent surgery, immobility or long-haul travel · active cancer · previous VTE · pregnancy or postpartum · oestrogen (combined pill or HRT) · thrombophilia · obesity · lower-limb fracture or cast"],
         ["<b>What to assess</b>","Airway, breathing and circulation, blood pressure, heart rate, respiratory rate, SpO₂ and mental state — haemodynamic status decides the pathway — plus chest pain, haemoptysis, syncope, the calves, bleeding risk and contraindications to anticoagulation, and then the Wells score"]
       ]}
     ]},

    {id:"recognise", nav:"Recognise", title:"The classic picture, and why it is not the dangerous one",
     blocks:[
       {b:"table", head:["Presentation","Detail"], rows:[
         ["<b>Classic</b>","Pleuritic chest pain, breathlessness, haemoptysis, tachycardia, tachypnoea — often with DVT signs such as a unilateral swollen calf"],
         ["<b>The subtle killers</b>","Isolated unexplained breathlessness or tachycardia · syncope or pre-syncope · an atypical chest infection that will not settle · new AF · unexplained hypoxia"],
         ["<b>The rule</b>","<b>Consider PE in any breathless or collapsed patient with risk factors</b> — the classic presentation is the one that gets diagnosed, so it is not the one that kills"]
       ]},
       {b:"why", html:"PE is missed in primary care not because the classic picture is hard to recognise but because the atypical picture does not look like a chest problem at all. A normal chest examination, a normal temperature and a clear chest X-ray are all entirely compatible with a significant PE — and each of them makes a clinician feel safer than they should. The protective habit is to ask about risk factors in every breathless patient, because that is what moves PE from \"unlikely\" to \"needs a score\"."}
     ]},

    {id:"wells", nav:"Stratify", title:"The two-level Wells score — the fork in the road",
     blocks:[
       {b:"table", head:["Wells criterion","Points"], rows:[
         ["<b>Clinical signs and symptoms of DVT</b>","<b>3</b>"],
         ["<b>PE is the most likely diagnosis, or an alternative diagnosis is less likely than PE</b>","<b>3</b>"],
         ["<b>Heart rate over 100</b>","<b>1.5</b>"],
         ["<b>Immobilisation for at least 3 days, or surgery in the previous 4 weeks</b>","<b>1.5</b>"],
         ["<b>Previous DVT or PE</b>","<b>1.5</b>"],
         ["<b>Haemoptysis</b>","<b>1</b>"],
         ["<b>Active cancer (treatment within 6 months, or palliative)</b>","<b>1</b>"]
       ]},
       {b:"dl", rows:[
         ["<b>Assess stability first</b>","Assess for haemodynamic instability first. If unstable, treat as an emergency and do not delay transfer for scoring. If stable, calculate the Wells score as part of the diagnostic pathway"],
         ["<b>Chest X-ray</b>","Perform or arrange a chest X-ray where clinically appropriate to assess alternative diagnoses. Do not allow a normal chest X-ray to exclude PE"],
         ["<b>PE LIKELY — more than 4 points</b>","<b>→ same-day CTPA</b> (V/Q SPECT or planar V/Q where CTPA is unsuitable — renal impairment, contrast allergy). If PE is likely and definitive imaging cannot be obtained promptly, arrange same-day acute assessment and consider interim therapeutic anticoagulation after checking for active bleeding, recent intracranial bleeding, major trauma, severe thrombocytopenia, pregnancy, renal impairment and other contraindications. Take baseline bloods (FBC, renal and hepatic function, PT and APTT) but do not delay urgent treatment awaiting the results; review them promptly, within 24 hours. Use the local acute-PE pathway to select the interim agent"],
         ["<b>PE UNLIKELY — 4 points or fewer</b>","<b>→ D-dimer</b> with the result available within 4 hours, considering an age-adjusted threshold in people over 50 where validated locally. If the result will not be available within 4 hours, consider interim therapeutic anticoagulation while awaiting it. Negative → PE unlikely: stop interim anticoagulation and reassess — look elsewhere. Positive → same-day imaging"],
         ["<b>The D-dimer caveat</b>","<b>Do not use D-dimer to investigate a Wells-likely PE.</b> NICE recommends immediate imaging in this group; D-dimer is intended for the Wells-unlikely pathway and should not replace imaging when clinical probability is high. D-dimer is not a rule-in test; a positive result is non-specific. Recent surgery, infection, inflammation, cancer, pregnancy and age reduce specificity. Use the laboratory's validated assay and reporting units, and use age-adjusted thresholds only according to the local laboratory/pathway"]
       ]},
       {b:"warn", html:"<b>Do not send a D-dimer to \"screen\" a Wells-likely patient.</b> In that group the correct action is same-day imaging, with interim anticoagulation through the local pathway if imaging is delayed. A common diagnostic error is requesting D-dimer in a Wells-likely patient: it delays imaging, and a negative D-dimer is not the appropriate rule-out test in that group — follow the imaging pathway."}
     ]},

    {id:"treat", nav:"Treat", title:"Anticoagulation — agent, loading schedule and duration",
     blocks:[
       {b:"table", head:["Step","Detail","Notes"], rows:[
         ["<b>Before prescribing any DOAC</b>","<b>Calculate creatinine clearance (Cockcroft–Gault, not eGFR alone) and check body weight</b>","Assess hepatic disease · check interacting drugs · review antiplatelets, NSAIDs and other anticoagulants · assess pregnancy and breastfeeding · check adherence and ability to obtain medication · document the intended duration. See the relevant SPC and local anticoagulation pathway"],
         ["<b>Common first-line option — apixaban</b>","<b>10 mg BD for 7 days, then 5 mg BD</b>","<b>VTE treatment dose, not AF dose; the loading phase is built in.</b> DOACs do not require routine coagulation monitoring, but renal function, liver function, FBC, adherence, bleeding and interacting medication require periodic review"],
         ["<b>Common first-line option — rivaroxaban</b>","<b>15 mg BD for 21 days, then 20 mg OD with food</b>","<b>Take with food — absorption depends on it</b>"],
         ["<b>Edoxaban or dabigatran</b>","<b>Require at least 5 days of therapeutic parenteral anticoagulation (e.g. LMWH) first</b>","A common prescribing trap — they are not start-from-scratch agents in VTE"],
         ["<b>DOAC unsuitable</b>","<b>LMWH with a VKA, or LMWH alone, according to the indication and specialist/local protocol</b>","<b>Severe renal impairment → specialist advice regarding LMWH, UFH, warfarin or selected DOAC use. Suspected antiphospholipid syndrome → haematology advice; warfarin may be preferred in confirmed high-risk APS</b>"],
         ["<b>Cancer-associated PE</b>","<b>Consider a DOAC or LMWH after assessing tumour site, mucosal bleeding risk, renal function, drug interactions, cancer therapy and patient preference</b>","<b>Treat for at least 3–6 months and review at 3–6 months.</b> Particular caution with luminal GI or GU malignancy, active mucosal lesions, recent GI bleeding and interacting systemic anticancer treatment. Consider continuation while cancer or treatment-related risk persists, with periodic reassessment"],
         ["<b>Pregnancy and postpartum</b>","<b>Therapeutic LMWH antenatally, via the RCOG/local obstetric pathway</b>","<b>DOACs avoided in pregnancy and breastfeeding; warfarin contraindicated in pregnancy but may be considered postpartum under specialist guidance.</b> LMWH while investigating where suspicion is genuine and there is no major contraindication"],
         ["<b>Duration — provoked</b>","<b>Consider stopping at 3 months</b>","If the provoking factor has resolved and bleeding/recurrence assessment supports stopping — not automatic. Provoking factors vary in strength and may coexist with persistent risk factors; not all surgery-associated events are low risk"],
         ["<b>Duration — unprovoked or ongoing risk</b>","<b>Consider continuing beyond 3 months (NG158)</b>","Unprovoked PE and persistent risk factors often favour extended therapy, subject to bleeding risk and shared decision-making — discuss recurrence risk, bleeding risk and patient preference"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"red", h:"⚠ PE dosing is not AF dosing", html:"DOAC dosing for VTE has a loading phase — a higher dose for the first days or weeks — which AF dosing does not. <b>Getting it wrong under-treats the clot.</b> See <a href='antiplatelets-anticoagulants.html'>antiplatelets and anticoagulants</a> for creatinine clearance, interactions and missed-dose rules."},
         {tone:"blue", h:"🏠 Outpatient management", html:"Outpatient treatment is a secondary-care or ambulatory-care decision using a validated risk score (PESI/sPESI or Hestia) and local exclusion criteria: confirmed PE, haemodynamic stability, clinical risk assessment, no active bleeding or other admission criteria, adequate social support, ability to obtain and take anticoagulation, and formal follow-up (BTS 2018). <b>Do not use sPESI alone, and do not initiate home management from general practice without an established local pathway.</b>"}
       ]}
     ]},

    {id:"special", nav:"Special cases", title:"Pregnancy, cancer, and the unprovoked work-up",
     blocks:[
       {b:"table", head:["Situation","Approach"], rows:[
         ["<b>Pregnancy and postpartum</b>","Suspected PE in pregnancy or the puerperium requires urgent obstetric medicine involvement and the local RCOG-based pathway (NICE NG158 does not cover pregnancy). Do not use the non-pregnant Wells/D-dimer pathway as a substitute for obstetric assessment. <b>Therapeutic LMWH is generally used while PE is being investigated unless contraindicated</b> — where there is genuine clinical suspicion, not for every breathless pregnant patient. Definitive imaging per the local pregnancy pathway, with multidisciplinary obstetric medicine involvement. DOACs are avoided during pregnancy and breastfeeding; warfarin is contraindicated during pregnancy but may be considered postpartum under specialist guidance"],
         ["<b>Cancer-associated</b>","For active cancer-associated PE, treat for at least 3–6 months and review at 3–6 months. <b>Consider a DOAC or LMWH after assessing tumour site, mucosal bleeding risk, renal function, drug interactions, cancer therapy and patient preference.</b> Use particular caution with luminal gastrointestinal or genitourinary malignancy, active mucosal lesions, recent GI bleeding and interacting systemic anticancer treatment. Continuing beyond 3–6 months is often appropriate while cancer remains active, but requires periodic reassessment"],
         ["<b>Unprovoked PE work-up</b>","<b>Do NOT perform indiscriminate cancer screens.</b> NICE NG158 (2020): review the history and examination, take baseline bloods, and do baseline investigations; further imaging or tumour markers only where clinically indicated"],
         ["<b>Thrombophilia testing</b>","<b>Do not request thrombophilia testing during the acute event routinely, or in people continuing anticoagulation. Testing should be specialist-directed.</b> Consider antiphospholipid antibody testing in selected unprovoked VTE cases when stopping anticoagulation is being considered. Consider hereditary thrombophilia testing only in selected patients with a relevant first-degree family history of VTE. Interpret results with specialist laboratory advice, particularly if the patient is anticoagulated (lupus anticoagulant testing is particularly affected)"]
       ]}
     ]},

    {id:"follow", nav:"Follow up", title:"After the acute event",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["<b>Discharge or initial post-PE review</b>","<b>First contact after diagnosis</b>","Confirm the anticoagulant, dose, correct loading phase and intended duration · document weight and creatinine clearance · review interacting medication · bleeding and recurrence safety-netting · check access, adherence and understanding · ensure hospital discharge information and a contact route"],
         ["<b>Early review</b>","<b>About one week after discharge, where locally supported</b>","Adherence, tolerance, bleeding and correct dose step-down"],
         ["<b>Anticoagulation review</b>","<b>Formal review at 3 months; annually if treatment continues long term</b>","Classify provoking factors, reassess recurrence and bleeding risk, review renal function and medication, and decide whether to stop, continue or change anticoagulation. Consider specialist input for unprovoked VTE, active cancer, recurrent VTE or APS"],
         ["<b>Bloods on a DOAC</b>","<b>FBC, renal and liver function at baseline; renal function at least annually if stable</b>","Dosing is based on creatinine clearance (Cockcroft–Gault). More frequent review in CKD, older age, frailty, intercurrent illness or fluctuating renal function"],
         ["<b>Bleeding review</b>","<b>Every review</b>","Falling haemoglobin → find the source. Optimise modifiable bleeding risks — blood pressure, NSAIDs, alcohol"],
         ["<b>Persistent breathlessness</b>","<b>3–6 months after the PE</b>","Ask about persistent or worsening breathlessness, exercise limitation, chest pain, syncope and functional recovery. If unexplained, assess for recurrent VTE and alternative cardiopulmonary disease (deconditioning, anaemia, cardiac disease, COPD, post-PE anxiety), arrange echocardiography where appropriate, and refer to a pulmonary hypertension/CTEPH service if indicated"],
         ["<b>Provoking factors</b>","<b>Ongoing</b>","Stop the combined pill or HRT if that was the trigger and arrange safe alternative contraception (see <a href='contraception.html'>contraception</a>); address mobility and future surgical VTE prophylaxis"]
       ]},
       {b:"say", html:"The clot on your lung is treated with a blood thinner — usually a tablet — for at least three months. If we could not find an obvious trigger, we often continue for longer, because the risk of another one stays higher. Two things to watch for. Tell us about any unusual bleeding. And if you are still breathless in a few months' time, come back — most people gradually get their breath back, and if you do not, there is a specific thing we check for."}
     ]},

    {id:"troubleshoot", nav:"Not right?", title:"Breathless or unwell on treatment? Think again",
     sub:"A treated PE can still deteriorate.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"1 · Still unstable?", html:"Deteriorating observations or hypotension → possible recurrent or high-risk PE → 999 for immediate emergency assessment."},
         {tone:"amber", h:"2 · Is the DOAC dose right?", html:"Was the loading phase given correctly? Has creatinine clearance been checked? Is adherence genuine?"},
         {tone:"amber", h:"3 · Bleeding", html:"Find and fix the source and optimise modifiable risks — stopping the anticoagulant is the last resort, not the first."},
         {tone:"blue", h:"4 · Has the trigger been removed?", html:"Still on the combined pill or HRT that caused it? Is the immobility ongoing?"},
         {tone:"green", h:"5 · CTEPH or another cause", html:"Persistent breathlessness months later → consider recurrent VTE, deconditioning, anaemia, cardiac disease, COPD and post-PE anxiety; echocardiogram and pulmonary hypertension referral if it remains unexplained."},
         {tone:"purple", h:"6 · A missed cancer", html:"Unprovoked PE with new symptoms or weight loss → targeted investigation under the relevant NG12 route, not a blanket screen."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Admission and specialist referral",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999 / immediate", html:"Hypotension, shock, peri-arrest physiology or severe clinical deterioration — possible high-risk PE. Assess for haemodynamic instability first; if unstable, <b>do not delay transfer for Wells scoring or D-dimer testing.</b>"},
         {tone:"amber", h:"Same day", html:"Suspected PE — Wells likely, or Wells unlikely with a positive D-dimer → acute medical or ambulatory care for CTPA and treatment. Suspected PE in pregnancy or postpartum → urgent obstetric medicine via the local RCOG-based pathway, with therapeutic LMWH where indicated."},
         {tone:"amber", h:"Haematology", html:"Unprovoked PE duration decisions · cancer-associated thrombosis · suspected antiphospholipid syndrome · recurrent VTE."},
         {tone:"green", h:"Pulmonary hypertension service", html:"Persistent unexplained breathlessness after PE → echocardiogram, then referral for suspected CTEPH."},
         {tone:"cream", h:"GP management", html:"Acute PE diagnosis and outpatient eligibility are managed through the local acute/ambulatory care pathway. Recognition and stratification, interim anticoagulation where the local pathway supports it and imaging will be delayed, the duration decision, removing the trigger, renal and bleeding monitoring, and the CTEPH question all belong here. Related pages: <a href='dvt.html'>deep vein thrombosis</a> · <a href='antiplatelets-anticoagulants.html'>antiplatelets and anticoagulants</a> · <a href='contraception.html'>contraception</a> · <a href='atrial-fibrillation.html'>atrial fibrillation</a>."}
       ]},
       {b:"say", html:"A suspected clot on the lung is a same-day hospital problem — they will do the scan and start the treatment. If you are at all unwell with it, that is a 999 call rather than a wait. Once you are on the blood thinner, we will plan together how long you need it."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 47-year-old man attends with <b>4 days of breathlessness</b> on exertion and mild fatigue. He had a <b>knee arthroscopy 3 weeks ago</b>. <b>No chest pain, no cough, no fever.</b> Chest is clear, temperature normal, <b>HR 104, SpO₂ 94%, BP 124/78</b>. He was seen two days ago by a colleague, diagnosed with a <b>viral illness</b>, and asks for \"something to shift it\". He looks well."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Recognises isolated breathlessness with tachycardia and recent surgery as a PE presentation despite a clear chest and normal temperature; calculates the Wells score explicitly — surgery within 4 weeks (1.5), HR over 100 (1.5), and whether PE is the most likely diagnosis (3) — and acts on which side of 4 it falls; <b>does NOT send a D-dimer if the score is likely</b>, and can explain that D-dimer is not the appropriate rule-out test in that group; <b>arranges same-day acute assessment rather than a routine referral</b>, and considers interim anticoagulation through the local pathway if imaging will be delayed; <b>does not accept the previous diagnosis as settled</b> — the 'atypical chest infection not responding' trap is exactly this; <b>notes the SpO₂ of 94% as abnormal for him</b> rather than normal-range; <b>gives the 999 safety-net for deterioration or syncope before he leaves</b>; and <b>documents the reasoning</b>, since this is a case that will be reviewed if it goes wrong."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>NICE NG158 — Venous thromboembolic diseases: diagnosis, management and thrombophilia testing (2020, updated 2023)<br><a href="https://www.nice.org.uk/guidance/ng158" rel="noopener">nice.org.uk/guidance/ng158</a><span class="rd"> — the two-level Wells score and its thresholds, D-dimer restricted to the unlikely group, immediate CTPA in the likely group, chest X-ray to assess alternative diagnoses, D-dimer result within 4 hours, interim therapeutic anticoagulation with baseline FBC, renal and hepatic function, PT and APTT where investigation is delayed, DOAC first-line with the apixaban and rivaroxaban loading schedules, cancer-associated VTE (3–6 months, DOAC choice by tumour site, interactions and bleeding risk), at least 3 months of anticoagulation with a reassessment of duration (consider stopping at 3 months if provoked by a resolved transient factor; consider continuing beyond 3 months if unprovoked). NG158 does not cover pregnancy; no further cancer investigations in unprovoked VTE without relevant symptoms or signs, and antiphospholipid testing only when stopping is planned</span></li>'+
         '<li><b>ESC 2019 guidelines for the diagnosis and management of acute pulmonary embolism (Konstantinides et al., Eur Heart J 2020) \u2014 international</b><span class="rd"> — evaluation for CTEPH (echocardiography, then specialist referral) in people with persistent or new breathlessness 3\u20136 months after PE; used because no UK guideline covers this follow-up. The atypical presentations and the follow-up schedule on this page are clinical practice rather than NG158 wording</span></li>'+
         '<li><b>BTS Guideline for the initial outpatient management of pulmonary embolism (Thorax 2018)</b><br><a href="https://doi.org/10.1136/thoraxjnl-2018-211539" rel="noopener">doi.org/10.1136/thoraxjnl-2018-211539</a><span class="rd"> — outpatient management using PESI/sPESI or Hestia criteria with exclusion criteria, and structured follow-up of ongoing symptoms</span></li>'+
         '<li><b>RCOG Green-top Guideline — Thromboembolic disease in pregnancy and the puerperium (acute management), current edition</b><br><a href="https://www.rcog.org.uk/guidance/browse-all-guidance/green-top-guidelines/" rel="noopener">rcog.org.uk Green-top guidelines</a><span class="rd"> — suspected PE in pregnancy and postpartum: urgent obstetric assessment, therapeutic LMWH while investigating unless contraindicated, imaging via the local pregnancy pathway, postpartum anticoagulant choice</span></li>'+
         '<li><b>Local Greater Manchester anticoagulation/DOAC pathway and formulary; DOAC Summaries of Product Characteristics</b><br><a href="https://www.medicines.org.uk/emc" rel="noopener">medicines.org.uk/emc</a><span class="rd"> — renal function, interactions, pregnancy and cancer-associated restrictions; the operational source for interim agent selection and anticoagulant dosing</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — the targeted routes used where unprovoked VTE is accompanied by new symptoms, in place of an indiscriminate cancer screen</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — apixaban 10 mg BD for 7 days then 5 mg BD; rivaroxaban 15 mg BD for 21 days then 20 mg OD with food; the parenteral anticoagulant lead-in required before edoxaban or dabigatran</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Pulmonary embolism — NICE NG158 (2020) and NICE NG12 (updated April 2026). Assess stability before scoring: hypotension, shock, peri-arrest physiology or severe deterioration is possible high-risk PE and a 999 call, not a Wells score. Chest X-ray where appropriate; a normal film does not exclude PE. D-dimer belongs only to the Wells-unlikely group; the likely group goes to same-day CTPA, with interim anticoagulation through the local pathway if imaging is delayed. PE DOAC dosing has a loading phase that AF dosing does not — apixaban 10 mg BD for 7 days then 5 mg BD, rivaroxaban 15 mg BD for 21 days then 20 mg OD with food. Calculate creatinine clearance and review interactions before prescribing. Pregnancy: the RCOG-based obstetric pathway, therapeutic LMWH where indicated. At 3 months reassess duration: stopping after a resolved transient provoking factor is not automatic; unprovoked PE often favours extended therapy, subject to bleeding risk and shared decision-making. Ask about breathlessness at 3–6 months, look for alternative causes and think CTEPH. Verify all doses against the BNF before prescribing."
});
