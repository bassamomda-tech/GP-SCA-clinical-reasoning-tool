<script>
MG.render({
  icon:"\u{1F9F4}",
  title:"Seborrhoeic dermatitis",
  eyebrow:"Protocol · scalp, face, body and infants",
  stemTitle:"Seborrhoeic dermatitis — an antifungal to control the yeast, a brief anti-inflammatory for flares, a maintenance plan for life, and an HIV test when it is severe or sudden",
  stemSub:"One page for the whole condition. Recognise the greasy scale in the oily zones, separate it from psoriasis, rosacea and tinea, use ketoconazole as the backbone on scalp and skin, keep steroids short and mild on the face, set up maintenance because it will return, reassure parents about cradle cap, and treat new or severe disease as an HIV indicator condition.",
  guideline:"PCDS seborrhoeic eczema 2024 · BHIVA/BASHH/BIA HIV testing 2020 · MHRA DSU Sep 2021 · Cochrane 2014 and 2015 · SPCs · BNF",
  meta:[
    {t:"PCDS seborrhoeic eczema (2024)"},
    {t:"BAD patient leaflet (2023)"},
    {t:"BHIVA/BASHH/BIA HIV testing 2020"},
    {t:"MHRA DSU Sep 2021 · steroid withdrawal"},
    {t:"Cochrane: Okokon 2015 · Kastarinen 2014"},
    {t:"No NG12 criterion applies", tone:"tw"}
  ],
  lead:"<div class='mg-layers'><a href='#recognise'><b>Recognise</b><small>And the mimics</small></a><a href='#scalp'><b>Scalp</b><small>Ketoconazole shampoo</small></a><a href='#skin'><b>Face and body</b><small>Antifungal first</small></a><a href='#maintain'><b>Maintain</b><small>It comes back</small></a><a href='#refer'><b>Refer</b><small>And test for HIV</small></a></div>",
  quickSub:"Six points that change the consultation. Each figure traces to a source under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"cream", h:"Ketoconazole is the backbone", html:"Seborrhoeic dermatitis is driven by an exaggerated reaction to <i>Malassezia</i>, a yeast present on normal skin. Topical ketoconazole reduces the chance of symptoms persisting at 4 weeks by about <b>31%</b> compared with placebo, and matches topical steroids for clearance with about <b>44% fewer side effects</b>.", src:"Cochrane · Okokon 2015"},
    {tone:"cream", h:"Scalp: ketoconazole 2% shampoo, then keep it going", html:"Wash with ketoconazole 2% shampoo, leaving the lather on for a few minutes, <b>twice weekly for 2–4 weeks</b>. Then use it <b>once every 1–2 weeks</b> to prevent relapse.", src:"SPC · Nizoral 2% shampoo"},
    {tone:"amber", h:"Steroids: mild, short, and not the maintenance plan", html:"A mild steroid settles an inflamed flare quickly, and mild steroids performed as well as potent ones in trials. Keep courses short on the face. Continuous daily use, particularly of moderate or potent steroids for over a year, risks topical steroid withdrawal reactions.", src:"Cochrane · Kastarinen 2014 · MHRA DSU Sep 2021"},
    {tone:"amber", h:"Sudden, severe or treatment-resistant? Offer an HIV test", html:"Seborrhoeic dermatitis is on the UK list of HIV <b>indicator conditions</b>: an HIV test should be offered to anyone presenting with it, and the case is stronger when it is new, extensive or refractory in an adult.", src:"BHIVA/BASHH/BIA HIV testing 2020"},
    {tone:"green", h:"Cradle cap settles on its own", html:"Infantile seborrhoeic dermatitis of the scalp and napkin area usually clears within a few months. Softening the scale with an emollient and gentle brushing is enough for most babies. A thriving, contented infant is reassuring; an unwell or distressed one is not.", src:"PCDS seborrhoeic eczema 2024"},
    {tone:"blue", h:"Control, not cure — say it at the start", html:"There is no cure; the aim is to clear flares and keep the skin quiet with regular antifungal use. Setting this expectation early prevents the repeated ‘it came back’ visits and the drift onto continuous steroid.", src:"BAD patient leaflet 2023"}
  ],
  pathwaySub:"Five moves. Most of the value is in steps one and five.",
  pathway:[
    {title:"Confirm the pattern and exclude the mimic", html:"Greasy yellow scale on a red base in the scalp, eyebrows, nasolabial folds, ears, beard, central chest or flexures. Check for psoriasis elsewhere (nails, elbows, knees), rosacea (papules and pustules, no scale), tinea (single asymmetric plaque with an active edge) and, on the cheeks, lupus (which spares the nasolabial folds)."},
    {title:"Look for the reason it is severe", html:"New in adulthood, very widespread, or resistant to standard treatment: offer an HIV test. Ask about Parkinson’s disease and other neurological disease, and review drugs and alcohol."},
    {title:"Treat each site", html:"Scalp: ketoconazole 2% shampoo, with a descaling product for thick crust and a short steroid scalp application if very itchy. Face and body: ketoconazole cream, with a brief mild steroid for inflamed flares. Infants: emollient and brushing first."},
    {title:"Plan maintenance before the flare clears", html:"Shampoo once every 1–2 weeks and the cream as soon as redness reappears. Avoid building the plan around a steroid."},
    {title:"Review and escalate", html:"Review at 4 weeks. If it has not improved, reconsider the diagnosis, check adherence and the HIV test, then consider a topical calcineurin inhibitor for the face (off-label) or dermatology advice."}
  ],
  sections:[
    {id:"recognise", nav:"Recognise", title:"Recognising it, and what it is not", sub:"A clinical diagnosis from distribution and scale. No test confirms it; the work is in excluding the look-alikes.",
     blocks:[
       {b:"table", head:["Condition","Points towards it","Why it matters"], rows:[
         ["Seborrhoeic dermatitis","Greasy yellow scale on pink skin in the oily zones; eyebrows, nasolabial folds, behind the ears; often with dandruff and blepharitis; flares in winter and with stress","Controlled by antifungals; relapses"],
         ["Psoriasis (scalp or ‘sebopsoriasis’)","Thicker, well-demarcated silvery plaques that extend beyond the hairline; nail pitting; plaques on elbows or knees; family history","Needs psoriasis treatment; the two overlap"],
         ["Rosacea","Central facial redness, papules and pustules, flushing; no greasy scale","Different treatment; steroids make it worse"],
         ["Tinea faciei or capitis","Asymmetric, single plaque with an active scaly edge; broken hairs in a child","Scrape it; a steroid makes tinea worse"],
         ["Cutaneous lupus","Photosensitive cheek rash sparing the nasolabial folds; scarring discoid plaques","Needs investigation and specialist care"],
         ["Atopic eczema (infants)","Itchy, starts on the cheeks and outer limbs, spares the napkin area; family history of atopy","Different long-term plan"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"What the yeast does", html:"<i>Malassezia</i> is a normal skin yeast found in larger numbers in seborrhoeic dermatitis. It is not infectious and is not the yeast that causes thrush. Explaining this helps adherence to an ‘antifungal’ for a condition that is not an infection.", src:"BAD patient leaflet 2023"},
         {tone:"blue", h:"Who gets it", html:"Two peaks: infants in the first months of life, and adults from puberty onwards. Severe disease is seen more frequently in people with HIV and in Parkinson’s disease; most people have no underlying illness.", src:"PCDS seborrhoeic eczema 2024 · BAD patient leaflet 2023"}
       ]}
     ]},

    {id:"redflags", nav:"Red flags", title:"Red flags — when to look further", sub:"Most seborrhoeic dermatitis is benign and familiar. These are the patterns that should change the plan.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Red skin almost everywhere", html:"Erythroderma (redness and scaling over most of the body surface) is not seborrhoeic dermatitis to be managed routinely: the patient can lose heat, fluid and protein. Arrange same-day assessment.", src:"PCDS erythroderma"},
         {tone:"amber", h:"New, extensive or refractory adult disease", html:"Treat it as an HIV indicator condition and offer a test. Severe seborrhoeic dermatitis can be an early sign of immune suppression.", src:"BHIVA/BASHH/BIA HIV testing 2020"},
         {tone:"red", h:"An unwell baby with a scaly rash", html:"A persistent scaly or crusted scalp and napkin rash in an infant who is failing to thrive, has diarrhoea or recurrent infection, or has petechiae within the rash, is not cradle cap. Consider immunodeficiency and rare infiltrative disease: same-day paediatric assessment if the baby is unwell or the rash is petechial, otherwise prompt paediatric advice."},
         {tone:"amber", h:"Neurological features", html:"New, marked facial seborrhoeic dermatitis in an older adult with tremor, slowness or a masked face may be the first sign that prompts a Parkinson’s assessment.", src:"BAD patient leaflet 2023"}
       ]},
       {b:"why", html:"No NICE NG12 suspected-cancer criterion maps to seborrhoeic dermatitis. The practical cancer risk is diagnostic: a fixed, single scaly patch on the face or scalp that does not behave like the rest of the rash, or does not respond, should be looked at as a lesion in its own right."}
     ]},

    {id:"scalp", nav:"Scalp", title:"Scalp treatment — shampoo first, descale if needed", sub:"Doses and schedules are those in the product licences; check each in the BNF before prescribing.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1", title:"Ketoconazole 2% shampoo", when:"first line for dandruff and scalp seborrhoeic dermatitis", tone:"cream",
          html:"Lather into the scalp, leave for a few minutes, rinse. <b>Twice weekly for 2–4 weeks.</b> Available on prescription or from pharmacies. Alternatives with less evidence include selenium sulfide, zinc pyrithione, ciclopirox and coal tar shampoos."},
         {step:"Thick scale", title:"Soften and lift the crust", when:"adherent scale or crusting", fromLabel:"if crusted", tone:"cream",
          html:"A descaling preparation (for example one containing salicylic acid, or an oil left on for some hours before washing) makes the shampoo effective. Use per BNF."},
         {step:"Itch", title:"Short steroid scalp application", when:"very itchy or inflamed scalp", fromLabel:"flare only", tone:"amber",
          html:"A topical steroid scalp lotion or shampoo for a short course, alongside the antifungal. Dose per BNF. Stop once settled and return to the antifungal alone."},
         {step:"Keep", title:"Maintenance", when:"once clear", fromLabel:"prevent relapse", tone:"green",
          html:"Ketoconazole 2% shampoo <b>once every 1–2 weeks</b>, indefinitely if needed. Restart twice weekly at the first sign of return."}
       ]},
       {b:"why", html:"The Cochrane review found ketoconazole and ciclopirox the best-studied antifungals and both more effective than placebo, with little evidence that any one agent in the class is better than another. Choice therefore comes down to availability, cost and what the patient will actually use."}
     ]},

    {id:"skin", nav:"Face and body", title:"Face, ears, chest and flexures", sub:"Antifungal first, anti-inflammatory briefly, and nothing potent on the face.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1", title:"Topical ketoconazole 2% cream", when:"face, ears, chest, flexures", tone:"cream",
          html:"Apply to affected areas as per BNF until clear. The shampoo can also be used as a body wash on the chest and back, left on for a few minutes before rinsing. Wash with an emollient soap substitute; avoid harsh cleansers."},
         {step:"Flare", title:"Add a mild steroid for a short course", when:"red, itchy, inflamed", fromLabel:"inflamed", tone:"amber",
          html:"Hydrocortisone 1% (alone or combined with an imidazole) for a few days to a week or two, then back to the antifungal. Dose per BNF. Do not use continuously on the face."},
         {step:"2", title:"Topical calcineurin inhibitor (off-label)", when:"frequent facial flares, steroid reliance, eyelids", fromLabel:"steroid-sparing", tone:"amber",
          html:"Pimecrolimus cream or tacrolimus ointment are licensed for atopic eczema, not seborrhoeic dermatitis; they are an off-label steroid-sparing option for the face. Warn about burning on application and sun protection. Dose per BNF."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Mild is enough", html:"In trials, mild steroids (hydrocortisone-class) and potent steroids were comparable in effect and adverse events for facial and scalp seborrhoeic dermatitis. There is some evidence for calcineurin inhibitors too.", src:"Cochrane · Kastarinen 2014"},
         {tone:"amber", h:"Topical steroid withdrawal", html:"Rare withdrawal reactions (burning, redness spreading beyond the treated area) follow prolonged, frequent use, usually daily for over 12 months. Use the lowest potency that works and the shortest course.", src:"MHRA DSU Sep 2021"},
         {tone:"blue", h:"Eyelids", html:"Seborrhoeic blepharitis often accompanies facial disease: warm compresses and lid hygiene, with the scalp and face treated alongside.", src:"College of Optometrists CMG · blepharitis"}
       ]}
     ]},

    {id:"infants", nav:"Infants", title:"Infants — cradle cap and the napkin area", sub:"Usually starts in the first weeks, is not itchy, and the baby is well.",
     blocks:[
       {b:"tiles", v:"life", items:[
         {t:"Scalp", html:"Rub in an emollient or plain vegetable oil, leave for some hours or overnight, then brush gently with a soft brush and wash with baby shampoo. Do not pick the crusts."},
         {t:"Napkin area and folds", html:"Keep clean and dry; barrier cream and frequent changes. If red and persistent, a topical imidazole, with hydrocortisone 1% for a few days only if inflamed (per BNFC)."},
         {t:"Timescale", html:"Most cases settle within a few months without medicines."},
         {t:"When to come back", html:"Weeping, spreading, itchy or infected skin; a baby who is unsettled, feeding poorly or not gaining weight."}
       ]},
       {b:"say", html:"This is cradle cap — a very common, harmless build-up of scale from the oil glands, not an infection and not caused by anything you’ve done. Soften it with a little oil, brush it gently and wash it off. It usually goes by itself over a few months."}
     ]},

    {id:"maintain", nav:"Maintain", title:"Review, relapse and maintenance", sub:"The condition is chronic. The maintenance plan is the treatment.",
     blocks:[
       {b:"timeline", items:[
         {n:"1", when:"Start", title:"Treat and set expectations", html:"Ketoconazole shampoo twice weekly and ketoconazole cream on the skin; a short mild steroid only if inflamed. Explain that it will come back and that this is expected, not failure."},
         {n:"2", when:"4 weeks", title:"Review response", html:"Most improve within 2–4 weeks. If not, check how often the shampoo was used and for how long it was left on, reconsider psoriasis or rosacea, and confirm the HIV test was offered."},
         {n:"3", when:"Once clear", title:"Maintenance", html:"Shampoo once every 1–2 weeks; cream at the first sign of redness. Keep a steroid only for occasional short flares."},
         {n:"4", when:"Frequent flares", title:"Step up", html:"Consider a calcineurin inhibitor for the face, treat blepharitis, and seek dermatology advice if control is still poor."}
       ]},
       {b:"say", html:"This is seborrhoeic dermatitis. It’s very common and not infectious; a yeast that lives on everyone’s skin sets off irritation in the oilier areas. We can’t cure it, but we can keep it quiet. The medicated shampoo twice a week will clear it, and then using it every week or two keeps it away. The steroid cream is only for a few days when it’s angry — not for every day."}
     ]},

    {id:"hiv", nav:"HIV test", title:"Offering an HIV test", sub:"A routine, non-judgemental offer, not a special risk conversation.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"Why this rash", html:"UK testing guidance lists seborrhoeic dermatitis among the indicator conditions where HIV prevalence is high enough that a test should be routinely offered. Severe seborrhoeic dermatitis is a recognised early manifestation of immune suppression.", src:"BHIVA/BASHH/BIA HIV testing 2020"},
         {tone:"cream", h:"How to raise it", html:"“This kind of rash is more common when the immune system is under strain, and we routinely offer everyone with it a blood test that includes HIV. Would that be okay?” Offer, document, and arrange results follow-up.", src:"BHIVA/BASHH/BIA HIV testing 2020"}
       ]},
       {b:"why", html:"Indicator-condition testing matters most in low-prevalence areas, where people with undiagnosed HIV will not otherwise be picked up by population screening. The offer costs little and a late diagnosis costs a great deal."}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — who and how fast", sub:"Almost all seborrhoeic dermatitis is managed in primary care.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same day", html:"Erythroderma; an infant who is systemically unwell, failing to thrive, or has a petechial or haemorrhagic rash; widespread weeping, crusted or eczema herpeticum-like change (punched-out erosions).", src:"PCDS erythroderma"},
         {tone:"amber", h:"Urgent", html:"A positive HIV test → specialist HIV service. Suspected lupus or other connective tissue disease with a facial rash.", src:"BHIVA/BASHH/BIA HIV testing 2020"},
         {tone:"blue", h:"Routine dermatology", html:"Diagnostic uncertainty (especially overlap with psoriasis); failure to respond to antifungal plus a short steroid and a trial of a calcineurin inhibitor; frequent flares despite maintenance; significant psychological impact.", src:"PCDS seborrhoeic eczema 2024"},
         {tone:"green", h:"Keep in primary care", html:"Typical adult disease responding to ketoconazole with occasional short steroid courses; cradle cap in a thriving baby.", src:"PCDS seborrhoeic eczema 2024"}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only — the Casebook holds the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 34-year-old man has had a red, flaking rash around his nose, eyebrows and scalp for three months. It is much worse than the mild dandruff he has always had. He has been using his partner’s hydrocortisone every day and wants “something stronger”.", src:"Practice case · PCDS seborrhoeic eczema 2024"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Recognises seborrhoeic dermatitis and checks for psoriasis; explains the yeast and that this is control not cure; switches the backbone to <b>ketoconazole shampoo and cream</b> and limits the steroid to short flares; declines a potent facial steroid with a reason; <b>offers an HIV test</b> because the disease is new and severe, framed as routine; agrees maintenance and review at 4 weeks.", src:"BHIVA/BASHH/BIA 2020 · Cochrane Okokon 2015"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Every figure on this page traces to one of these primary sources.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>Primary Care Dermatology Society — clinical guidance: seborrhoeic eczema (updated 2024); erythroderma</b><br><a href="https://www.pcds.org.uk" rel="noopener">pcds.org.uk</a><span class="rd"> — distribution, infantile and adult forms, treatment by site, referral</span></li>'+
         '<li><b>British Association of Dermatologists — patient information leaflet: seborrhoeic dermatitis (2023)</b><br><a href="https://www.skinhealthinfo.org.uk/condition/seborrhoeic-dermatitis/" rel="noopener">skinhealthinfo.org.uk</a><span class="rd"> — role of <i>Malassezia</i>, association with HIV and Parkinson’s disease, no cure but good control</span></li>'+
         '<li><b>Okokon EO et al — Topical antifungals for seborrhoeic dermatitis</b> (Cochrane Database Syst Rev 2015; CD008138)<br><a href="https://doi.org/10.1002/14651858.CD008138.pub3" rel="noopener">doi.org/10.1002/14651858.CD008138.pub3</a><span class="rd"> — 51 studies, 9052 participants; ketoconazole 31% less likely than placebo to leave persistent symptoms at 4 weeks; ketoconazole as effective as steroids with 44% fewer side effects; ciclopirox also better than placebo</span></li>'+
         '<li><b>Kastarinen H et al — Topical anti-inflammatory agents for seborrhoeic dermatitis of the face or scalp</b> (Cochrane Database Syst Rev 2014; CD009446)<br><a href="https://doi.org/10.1002/14651858.CD009446.pub2" rel="noopener">doi.org/10.1002/14651858.CD009446.pub2</a><span class="rd"> — steroids effective; mild and potent steroids comparable; some evidence for calcineurin inhibitors</span></li>'+
         '<li><b>BHIVA/BASHH/BIA — Adult HIV testing guidelines 2020</b><br><a href="https://bhiva.org/clinical-guideline/hiv-testing-guidelines/" rel="noopener">bhiva.org</a><span class="rd"> — seborrhoeic dermatitis as an HIV indicator condition; routine offer of testing</span></li>'+
         '<li><b>MHRA Drug Safety Update — Topical corticosteroids: information on the risk of topical steroid withdrawal reactions (September 2021)</b><br><a href="https://www.gov.uk/drug-safety-update" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> — withdrawal reactions after prolonged frequent use, usually over 12 months; use lowest potency needed</span></li>'+
         '<li><b>SPC — Nizoral 2% shampoo (ketoconazole)</b><br><a href="https://www.medicines.org.uk/emc/product/1510/smpc" rel="noopener">medicines.org.uk/emc</a><span class="rd"> — twice weekly for 2–4 weeks to treat; once every 1–2 weeks to prevent relapse</span></li>'+
         '<li><b>College of Optometrists — Clinical Management Guideline: blepharitis</b><br><a href="https://www.college-optometrists.org/clinical-guidance/clinical-management-guidelines" rel="noopener">college-optometrists.org</a><span class="rd"> — lid hygiene for seborrhoeic blepharitis</span></li>'+
         '<li><b>BNF and BNFC</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — doses for ketoconazole cream, hydrocortisone, combination imidazole–steroid creams, scalp steroid preparations, pimecrolimus and tacrolimus (off-label for this indication)</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Seborrhoeic dermatitis in adults and infants in primary care — PCDS (2024), BAD patient leaflet (2023), BHIVA/BASHH/BIA HIV testing guidelines (2020), MHRA Drug Safety Update (September 2021), Cochrane reviews (Kastarinen 2014, Okokon 2015) and the ketoconazole shampoo SPC. Check every dose in the current BNF or BNFC. Not a substitute for clinical judgement or your local formulary."
});
