<script>
MG.render({
  icon:"\u{1F9F4}",
  title:"Seborrhoeic dermatitis",
  eyebrow:"Protocol · scalp, face, body and infants",
  stemTitle:"Seborrhoeic dermatitis — an antifungal to control the yeast, a brief anti-inflammatory for flares, a maintenance plan for life, and an HIV test offer when it is severe, extensive, atypical or refractory",
  stemSub:"One page for the whole condition. Recognise the greasy scale in the oily zones, separate it from psoriasis, rosacea and tinea, use ketoconazole as the backbone on scalp and skin, keep steroids short and mild on the face, set up maintenance because it will return, reassure parents about cradle cap, and offer an HIV test when disease is severe, extensive, atypical or treatment-refractory — most seborrhoeic dermatitis is not HIV-related.",
  guideline:"PCDS seborrhoeic eczema 2024 · BHIVA/BASHH/BIA HIV testing 2020 · MHRA DSU Sep 2021 · Cochrane 2014 and 2015 · SPCs · BNF · GMMMG formulary",
  meta:[
    {t:"PCDS seborrhoeic eczema (2024)"},
    {t:"BAD patient leaflet (2023)"},
    {t:"BHIVA/BASHH/BIA HIV testing 2020"},
    {t:"MHRA DSU Sep 2021 · steroid withdrawal"},
    {t:"Cochrane: Okokon 2015 · Kastarinen 2014"},
    {t:"GMMMG formulary · Skin"},
    {t:"No NG12 criterion applies"}
  ],
  lead:"<div class='mg-layers'><a href='#recognise'><b>Recognise</b><small>And the mimics</small></a><a href='#scalp'><b>Scalp</b><small>Ketoconazole shampoo</small></a><a href='#skin'><b>Face and body</b><small>Antifungal first</small></a><a href='#maintain'><b>Maintain</b><small>It comes back</small></a><a href='#refer'><b>Refer</b><small>And test for HIV</small></a></div>",
  quickSub:"Six points that change the consultation. Each figure traces to a source under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"cream", h:"Ketoconazole is the backbone", html:"Seborrhoeic dermatitis is driven by an exaggerated reaction to <i>Malassezia</i>, a yeast present on normal skin. Topical antifungals, particularly ketoconazole, are effective for reducing seborrhoeic dermatitis and are generally preferred as the treatment backbone because they avoid repeated corticosteroid exposure.", src:"Cochrane · Okokon 2015"},
    {tone:"cream", h:"Scalp: ketoconazole 2% shampoo, then keep it going", html:"Apply ketoconazole 2% shampoo to the scalp and affected areas, leave on for the time stated in the product information (usually several minutes), rinse thoroughly and avoid the eyes: <b>twice weekly for 2–4 weeks</b>. For frequent relapse, continue intermittently — for example <b>once every 1–2 weeks</b> — adjusted to the relapse pattern and any irritation.", src:"SPC · Nizoral 2% shampoo"},
    {tone:"amber", h:"Steroids: mild, short, and not the maintenance plan", html:"A mild steroid settles an inflamed flare quickly, and mild steroids performed as well as potent ones in trials. Keep courses short on the face. Topical steroid withdrawal is uncommon but can follow prolonged, frequent or inappropriate use, especially on the face; there is no guaranteed safe duration, so use the lowest effective potency for the shortest necessary course.", src:"Cochrane · Kastarinen 2014 · MHRA DSU Sep 2021"},
    {tone:"amber", h:"Severe, extensive, atypical or refractory? Offer an HIV test", html:"Most seborrhoeic dermatitis is not associated with HIV. <b>Severe or recalcitrant</b> disease is on the UK list of HIV <b>indicator conditions</b>, where an HIV test should be routinely offered — so offer one to adults with <b>severe, extensive, atypical or treatment-refractory</b> disease, particularly when it is new or there are other HIV indicator features. A typical mild new presentation does not need a test for that reason alone.", src:"BHIVA/BASHH/BIA HIV testing 2020"},
    {tone:"green", h:"Cradle cap settles on its own", html:"Infantile seborrhoeic dermatitis of the scalp and napkin area usually clears within a few months. Softening the scale with an emollient and gentle brushing is enough for most babies. A thriving, contented infant is reassuring; an unwell or distressed one is not.", src:"PCDS seborrhoeic eczema 2024"},
    {tone:"blue", h:"Control, not cure — say it at the start", html:"There is no cure; the aim is to clear flares and keep the skin quiet with regular antifungal use. Setting this expectation early prevents the repeated ‘it came back’ visits and the drift onto continuous steroid.", src:"BAD patient leaflet 2023"}
  ],
  pathwaySub:"Five moves. Most of the value is in steps one and five.",
  pathway:[
    {title:"Confirm the pattern and exclude the mimic", html:"Greasy yellow scale on a red base in the scalp, eyebrows, nasolabial folds, ears, beard, central chest or flexures. Check for psoriasis elsewhere (nails, elbows, knees), rosacea (persistent central redness, flushing, telangiectasia, papules and pustules — it can coexist), tinea (single asymmetric plaque with an active edge), cutaneous lupus (photosensitivity, scarring, dyspigmentation or discoid plaques) and contact dermatitis if facial or eyelid disease persists or worsens with treatment."},
    {title:"Look for the reason it is severe", html:"Severe, extensive, atypical or treatment-refractory, or with other HIV indicator features (recurrent or unusual infections, persistent oral candidiasis, weight loss or night sweats, generalised lymphadenopathy, recurrent shingles): offer an HIV test. New adult onset adds context but is not an indication on its own. Ask about Parkinson’s disease and other neurological disease, and review drugs and alcohol."},
    {title:"Treat each site", html:"Scalp: ketoconazole 2% shampoo, with a descaling product for thick crust and a short steroid scalp application if very itchy. Face and body: ketoconazole cream, with a brief mild steroid for inflamed flares. Infants: a bland emollient or mineral-oil product and gentle brushing first."},
    {title:"Plan maintenance before the flare clears", html:"Intermittent antifungal maintenance, such as shampoo once every 1–2 weeks adjusted to the relapse pattern and irritation, and the cream as soon as redness reappears. Avoid building the plan around a steroid."},
    {title:"Review and escalate", html:"Review at 4 weeks. If it has not improved, reconsider the diagnosis, check adherence, and offer an HIV test if the disease is severe, extensive, atypical or refractory or other indicator features are present, then consider a topical calcineurin inhibitor for the face (off-label) or dermatology advice."}
  ],
  sections:[
    {id:"recognise", nav:"Recognise", title:"Recognising it, and what it is not", sub:"A clinical diagnosis from distribution and scale. No test confirms it; the work is in excluding the look-alikes.",
     blocks:[
       {b:"table", head:["Condition","Points towards it","Why it matters"], rows:[
         ["Seborrhoeic dermatitis","Greasy yellow scale on pink skin in the oily zones; eyebrows, nasolabial folds, behind the ears; often with dandruff and blepharitis; flares in winter and with stress","Controlled by antifungals; relapses"],
         ["Psoriasis (scalp or ‘sebopsoriasis’)","Thicker, well-demarcated silvery plaques that extend beyond the hairline; nail pitting; plaques on elbows or knees; family history","Needs psoriasis treatment; the two overlap"],
         ["Rosacea","Persistent central facial redness, flushing, telangiectasia, papules and pustules; no greasy scale. Rosacea and seborrhoeic dermatitis may coexist","Needs a separate rosacea assessment; avoid topical steroids, particularly on the face"],
         ["Tinea faciei or capitis","Asymmetric, single plaque with an active scaly edge; in a child, broken hairs, patchy alopecia, pustules, kerion or cervical lymphadenopathy — not typical of seborrhoeic dermatitis","Scrape it; a steroid can mask it (tinea incognito). Suspected tinea capitis needs scalp and hair sampling and systemic antifungal treatment through the paediatric or dermatology pathway — topical treatment alone is inadequate"],
         ["Cutaneous lupus","Photosensitivity, scarring, dyspigmentation, discoid plaques or a persistent facial eruption. A malar rash often spares the nasolabial folds, but this is not an absolute discriminator and the two can coexist","Consider cutaneous lupus; needs investigation and specialist assessment"],
         ["Atopic eczema (infants)","Itchy, starts on the cheeks and outer limbs, spares the napkin area; family history of atopy","Different long-term plan"],
         ["Allergic or irritant contact dermatitis","Persistent facial or eyelid dermatitis, especially if it worsens with treatment; fragrance or preservative allergy, hair products, cosmetics, topical medicines, including antifungal preparations","Identify and stop the suspected product"],
         ["Candidal nappy dermatitis (infants)","Persistent bright-red napkin rash involving the folds, with satellite lesions","More suggestive of candida than uncomplicated seborrhoeic dermatitis; treat according to the paediatric fungal pathway"],
         ["Dandruff","Fine scalp scaling without significant inflammation","Self-care with over-the-counter shampoo; prescription ketoconazole for inflammatory seborrhoeic dermatitis or failed self-care (GMMMG)"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"What the yeast does", html:"<i>Malassezia</i> is a normal skin yeast found in larger numbers in seborrhoeic dermatitis. It is not infectious and is not the yeast that causes thrush. Explaining this helps adherence to an ‘antifungal’ for a condition that is not an infection.", src:"BAD patient leaflet 2023"},
         {tone:"blue", h:"Who gets it", html:"Two peaks: infants in the first months of life, and adults from puberty onwards. Most seborrhoeic dermatitis is not associated with HIV, and most people have no underlying illness. Severe disease is seen more frequently in people with HIV and in Parkinson’s disease.", src:"PCDS seborrhoeic eczema 2024 · BAD patient leaflet 2023"}
       ]}
     ]},

    {id:"redflags", nav:"Red flags", title:"Red flags — when to look further", sub:"Most seborrhoeic dermatitis is benign and familiar. These are the patterns that should change the plan.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Red skin almost everywhere", html:"Erythroderma (redness and scaling over most of the body surface) is not seborrhoeic dermatitis to be managed routinely: the patient can lose heat, fluid and protein. Arrange same-day assessment if it is acute, progressive or associated with systemic illness, fever, dehydration, hypothermia, tachycardia or haemodynamic instability, or a drug reaction is suspected; otherwise arrange urgent dermatology assessment.", src:"PCDS erythroderma"},
         {tone:"amber", h:"Severe, extensive, atypical or refractory adult disease", html:"Offer an HIV test routinely and non-judgementally, with consent and results follow-up — particularly when it is new or there are other indicator features. Most seborrhoeic dermatitis is not HIV-related, but severe disease can be an early sign of immune suppression.", src:"BHIVA/BASHH/BIA HIV testing 2020"},
         {tone:"red", h:"An unwell baby with a scaly rash", html:"A widespread or persistent scaly or crusted rash in an infant who is failing to thrive, has diarrhoea, recurrent infection, severe itch or systemic illness, or has petechiae within the rash, is not cradle cap. Consider immunodeficiency and rare infiltrative disease: same-day paediatric assessment if the baby is unwell, the rash is petechial, or sepsis or serious infection is suspected; otherwise prompt paediatric assessment."},
         {tone:"amber", h:"Neurological features", html:"New, marked facial seborrhoeic dermatitis in an older adult with tremor, slowness or a masked face may be the first sign that prompts a Parkinson’s assessment.", src:"BAD patient leaflet 2023"},
         {tone:"amber", h:"Eye symptoms with blepharitis", html:"Pain, photophobia, reduced vision, significant ocular inflammation or recurrent corneal disease needs ophthalmology assessment — lid hygiene alone is not sufficient.", src:"College of Optometrists CMG · blepharitis"}
       ]},
       {b:"why", html:"No NICE NG12 suspected-cancer criterion maps to seborrhoeic dermatitis. The practical cancer risk is diagnostic: a fixed, single scaly patch on the face or scalp that does not behave like the rest of the rash, or does not respond, should be looked at as a lesion in its own right."}
     ]},

    {id:"scalp", nav:"Scalp", title:"Scalp treatment — shampoo first, descale if needed", sub:"Doses and schedules are those in the product licences; check each in the BNF before prescribing.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1", title:"Ketoconazole 2% shampoo", when:"first line for inflammatory scalp seborrhoeic dermatitis", tone:"cream",
          html:"Apply to the scalp and affected areas, leave on for the time stated in the product information (usually several minutes), rinse thoroughly and avoid the eyes. <b>Twice weekly for 2–4 weeks.</b> Mild dandruff without significant inflammation is suitable for self-care with over-the-counter shampoos; prescribe ketoconazole for inflammatory seborrhoeic dermatitis or when appropriate self-care has failed (GMMMG formulary). Alternatives with less evidence include selenium sulfide, zinc pyrithione, ciclopirox and coal tar shampoos."},
         {step:"Thick scale", title:"Soften and lift the crust", when:"adherent scale or crusting", fromLabel:"if crusted", tone:"cream",
          html:"A descaling preparation (for example one containing salicylic acid, or an oil left on for some hours before washing) makes the shampoo effective. Avoid vigorous scraping or picking. Avoid salicylic acid over large areas or broken skin, and avoid salicylate preparations in young infants unless specifically advised. Use a licensed preparation and check its age range and directions in the BNF or BNFC."},
         {step:"Itch", title:"Short steroid scalp application", when:"very itchy or inflamed scalp", fromLabel:"flare only", tone:"amber",
          html:"A topical steroid scalp lotion or shampoo for a short course, alongside the antifungal. Dose per BNF. Stop once settled and return to the antifungal alone."},
         {step:"Keep", title:"Maintenance", when:"once clear", fromLabel:"prevent relapse", tone:"green",
          html:"For frequent relapse, intermittent ketoconazole 2% shampoo, such as <b>once every 1–2 weeks</b>, adjusted to the patient’s relapse pattern and irritation. Restart twice weekly at the first sign of return."}
       ]},
       {b:"why", html:"The Cochrane review found ketoconazole and ciclopirox the best-studied antifungals and both more effective than placebo, with little evidence that any one agent in the class is better than another. Choice therefore comes down to availability, cost and what the patient will actually use."}
     ]},

    {id:"skin", nav:"Face and body", title:"Face, ears, chest and flexures", sub:"Antifungal first, anti-inflammatory briefly, and nothing potent on the face.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1", title:"Topical ketoconazole 2% cream", when:"face, ears, chest, flexures", tone:"cream",
          html:"Apply once or twice daily according to the product information, usually for 2–4 weeks, continuing for a short period after clinical clearance only if the product information directs. Avoid indefinite daily use; facial maintenance is intermittent and guided by relapse pattern and tolerability. The shampoo can also be used as a body wash on the chest and back, left on for a few minutes before rinsing. Wash with an emollient soap substitute; avoid harsh cleansers."},
         {step:"Flare", title:"Add a mild steroid for a short course", when:"red, itchy, inflamed", fromLabel:"inflamed", tone:"amber",
          html:"Hydrocortisone 1% (alone or combined with an imidazole) for a few days to a week or two, then back to the antifungal. Dose per BNF. Do not use continuously on the face. Use combination steroid–antifungal products only for short courses: avoid prolonged use and potent combinations on facial skin, never use them as maintenance, and do not apply a steroid to possible tinea without considering the diagnosis — it can produce tinea incognito. Avoid topical steroids if rosacea is suspected."},
         {step:"2", title:"Topical calcineurin inhibitor (off-label)", when:"frequent facial flares, steroid reliance, eyelids", fromLabel:"steroid-sparing", tone:"amber",
          html:"Pimecrolimus cream or tacrolimus ointment are licensed for atopic eczema, not seborrhoeic dermatitis; they are an off-label steroid-sparing option for the face. A topical calcineurin inhibitor may be considered off-label for recurrent facial disease or steroid dependence, particularly around the eyelids. Burning or stinging is common at first; use only on intact skin and not during active bacterial, viral or fungal infection; counsel about sun protection; check age restrictions, current product information and local formulary status. Consider dermatology advice for persistent eyelid disease. Dose per BNF."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Mild is enough", html:"In trials, mild steroids (hydrocortisone-class) and potent steroids were comparable in effect and adverse events for facial and scalp seborrhoeic dermatitis. There is some evidence for calcineurin inhibitors too.", src:"Cochrane · Kastarinen 2014"},
         {tone:"amber", h:"Topical steroid withdrawal", html:"Topical steroid withdrawal is uncommon but can occur after prolonged, frequent or inappropriate use, especially on the face. There is no guaranteed safe duration threshold. Use the lowest effective potency for the shortest necessary course and avoid continuous facial steroid use. Distinguish it from rebound seborrhoeic dermatitis: suspect withdrawal if there is burning, intense redness extending beyond the treated areas, papules or pustules, or marked worsening after stopping — and seek dermatology advice rather than escalating the steroid.", src:"MHRA DSU Sep 2021"},
         {tone:"blue", h:"Eyelids", html:"Seborrhoeic blepharitis often accompanies facial disease: warm compresses and lid hygiene, with the scalp and face treated alongside. Pain, photophobia, reduced vision, significant ocular inflammation or recurrent corneal disease needs ophthalmology assessment.", src:"College of Optometrists CMG · blepharitis"}
       ]}
     ]},

    {id:"infants", nav:"Infants", title:"Infants — cradle cap and the napkin area", sub:"Usually starts in the first weeks, is not itchy, and the baby is well.",
     blocks:[
       {b:"tiles", v:"life", items:[
         {t:"Scalp", html:"Use a bland emollient or a mineral-oil or paraffin-based product to soften the scale — avoid plain vegetable oils such as olive oil, which may disrupt the infant skin barrier. Leave for some hours or overnight, then brush gently with a soft brush and wash it out with baby shampoo. Do not pick the crusts and avoid fragranced products. Check the BNFC and local paediatric advice for infants with eczema, allergy risk or broken skin."},
         {t:"Napkin area and folds", html:"Keep clean and dry; barrier cream and frequent changes. If red and persistent, a topical imidazole, with hydrocortisone 1% for a few days only if inflamed (per BNFC). A persistent bright-red rash involving the folds with satellite lesions is more suggestive of candidal nappy dermatitis; treat according to the paediatric fungal pathway. Also consider irritant nappy dermatitis, bacterial infection, psoriasis, atopic eczema, and zinc deficiency or immunodeficiency if severe or refractory."},
         {t:"Timescale", html:"Most cases settle within a few months without medicines."},
         {t:"When to come back", html:"Weeping, spreading, itchy or infected skin; a baby who is unsettled, feeding poorly or not gaining weight."}
       ]},
       {b:"say", html:"This is cradle cap — a very common, harmless build-up of scale from the oil glands, not an infection and not caused by anything you’ve done. Soften it with a little bland moisturiser or baby (mineral) oil, brush it gently and wash it off. It usually goes by itself over a few months."}
     ]},

    {id:"maintain", nav:"Maintain", title:"Review, relapse and maintenance", sub:"The condition is chronic. The maintenance plan is the treatment.",
     blocks:[
       {b:"timeline", items:[
         {n:"1", when:"Start", title:"Treat and set expectations", html:"Ketoconazole shampoo twice weekly and ketoconazole cream on the skin; a short mild steroid only if inflamed. Explain that it will come back and that this is expected, not failure."},
         {n:"2", when:"4 weeks", title:"Review response", html:"Most improve within 2–4 weeks. If not, check how often the shampoo was used and for how long it was left on, reconsider psoriasis, rosacea, tinea, lupus or contact dermatitis, and offer an HIV test if the disease is severe, extensive, atypical or refractory, or other indicator features are present. A typical mild case that has not fully cleared does not need one for that reason alone."},
         {n:"3", when:"Once clear", title:"Maintenance", html:"Intermittent antifungal maintenance individualised to the relapse pattern and irritation — for example shampoo once every 1–2 weeks; cream at the first sign of redness. Keep a steroid only for occasional short flares."},
         {n:"4", when:"Frequent flares", title:"Step up", html:"Consider a calcineurin inhibitor for the face, treat blepharitis, and seek dermatology advice if control is still poor."}
       ]},
       {b:"say", html:"This is seborrhoeic dermatitis. It’s very common and not infectious; a yeast that lives on everyone’s skin sets off irritation in the oilier areas. We can’t cure it, but we can keep it quiet. The medicated shampoo twice a week will clear it, and then using it every week or two keeps it away. The steroid cream is only for a few days when it’s angry — not for every day."}
     ]},

    {id:"hiv", nav:"HIV test", title:"Offering an HIV test", sub:"A routine, non-judgemental offer, not a special risk conversation.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"Why this rash", html:"UK testing guidance lists severe or recalcitrant seborrhoeic dermatitis among the indicator conditions where HIV prevalence is high enough that a test should be routinely offered. Most seborrhoeic dermatitis is not associated with HIV, but severe disease is a recognised early manifestation of immune suppression. Also offer a test when there are other features: recurrent or unusual infections, persistent oral candidiasis, weight loss or night sweats, generalised lymphadenopathy, recurrent herpes zoster or other indicator conditions.", src:"BHIVA/BASHH/BIA HIV testing 2020"},
         {tone:"cream", h:"How to raise it", html:"“This kind of rash is more common when the immune system is under strain, and when it is this marked we routinely offer a blood test that includes HIV. Would that be okay?” Offer routinely and non-judgementally, obtain consent, document, and arrange results follow-up.", src:"BHIVA/BASHH/BIA HIV testing 2020"}
       ]},
       {b:"why", html:"Indicator-condition testing matters most in low-prevalence areas, where people with undiagnosed HIV will not otherwise be picked up by population screening. The offer costs little and a late diagnosis costs a great deal."}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — who and how fast", sub:"Almost all seborrhoeic dermatitis is managed in primary care.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same day", html:"Erythroderma that is acute, progressive or with systemic illness, dehydration, hypothermia or haemodynamic instability; an infant who is systemically unwell, failing to thrive, or has a petechial or haemorrhagic rash; widespread weeping, crusted or eczema herpeticum-like change (punched-out erosions).", src:"PCDS erythroderma"},
         {tone:"amber", h:"Urgent", html:"A positive HIV test → specialist HIV service. Suspected lupus or other connective tissue disease with a facial rash. Stable erythroderma → urgent dermatology assessment. Eye pain, photophobia, reduced vision or significant ocular inflammation → ophthalmology assessment.", src:"BHIVA/BASHH/BIA HIV testing 2020"},
         {tone:"blue", h:"Routine dermatology", html:"Diagnostic uncertainty, including suspected psoriasis, lupus or another inflammatory dermatosis; persistent disease despite appropriate antifungal and short anti-inflammatory treatment; frequent flares despite maintenance; recurrent eyelid disease; need for systemic antifungal or other specialist therapy; significant psychological impact.", src:"PCDS seborrhoeic eczema 2024"},
         {tone:"green", h:"Keep in primary care", html:"Typical adult disease responding to ketoconazole with occasional short steroid courses; cradle cap in a thriving baby.", src:"PCDS seborrhoeic eczema 2024"},
         {tone:"amber", h:"Systemic treatment is specialist-only", html:"Systemic itraconazole for extensive or recalcitrant disease is a specialist or dermatology advice-and-guidance decision, not a routine primary-care next step: it has significant drug interactions, liver disease and LFTs must be considered, and the local formulary and antimicrobial guidance apply. Oral tetracyclines (off-label) are not a standard treatment and belong in specialist care: contraindicated in pregnancy, photosensitising, with gastrointestinal adverse effects and antimicrobial-stewardship considerations.", src:"PCDS seborrhoeic eczema 2024"}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only — the Casebook holds the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 34-year-old man has had a red, flaking rash around his nose, eyebrows and scalp for three months. It is much worse than the mild dandruff he has always had. He has been using his partner’s hydrocortisone every day and wants “something stronger”.", src:"Practice case · PCDS seborrhoeic eczema 2024"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Recognises seborrhoeic dermatitis and checks for psoriasis; explains the yeast and that this is control not cure; switches the backbone to <b>ketoconazole shampoo and cream</b> and limits the steroid to short flares; declines a potent facial steroid with a reason; <b>offers an HIV test</b> if the disease is severe, extensive, atypical or refractory or there are other indicator features — not for new onset alone — framed as routine; agrees maintenance and review at 4 weeks.", src:"BHIVA/BASHH/BIA 2020 · Cochrane Okokon 2015"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Every figure on this page traces to one of these primary sources.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>Primary Care Dermatology Society — clinical guidance: seborrhoeic eczema (updated 2024); erythroderma</b><br><a href="https://www.pcds.org.uk/clinical-guidance/seborrhoeic-eczema" rel="noopener">pcds.org.uk — seborrhoeic eczema</a> · <a href="https://www.pcds.org.uk/clinical-guidance/erythroderma" rel="noopener">pcds.org.uk — erythroderma</a><span class="rd"> — distribution, infantile and adult forms, treatment by site, referral</span></li>'+
         '<li><b>British Association of Dermatologists — patient information leaflet: seborrhoeic dermatitis (2023)</b><br><a href="https://www.skinhealthinfo.org.uk/condition/seborrhoeic-dermatitis/" rel="noopener">skinhealthinfo.org.uk</a><span class="rd"> — role of <i>Malassezia</i>, association with HIV and Parkinson’s disease, no cure but good control</span></li>'+
         '<li><b>Okokon EO et al — Topical antifungals for seborrhoeic dermatitis</b> (Cochrane Database Syst Rev 2015; CD008138)<br><a href="https://doi.org/10.1002/14651858.CD008138.pub3" rel="noopener">doi.org/10.1002/14651858.CD008138.pub3</a><span class="rd"> — 51 studies, 9052 participants; ketoconazole 31% less likely than placebo to leave persistent symptoms at 4 weeks; ketoconazole as effective as steroids with 44% fewer side effects; ciclopirox also better than placebo; trials heterogeneous, with differing formulations, sites, severities and comparators</span></li>'+
         '<li><b>Kastarinen H et al — Topical anti-inflammatory agents for seborrhoeic dermatitis of the face or scalp</b> (Cochrane Database Syst Rev 2014; CD009446)<br><a href="https://doi.org/10.1002/14651858.CD009446.pub2" rel="noopener">doi.org/10.1002/14651858.CD009446.pub2</a><span class="rd"> — steroids effective; mild and potent steroids comparable; some evidence for calcineurin inhibitors</span></li>'+
         '<li><b>BHIVA/BASHH/BIA — Adult HIV testing guidelines 2020</b><br><a href="https://bhiva.org/clinical-guideline/hiv-testing-guidelines/" rel="noopener">bhiva.org</a><span class="rd"> — severe or recalcitrant seborrhoeic dermatitis as an HIV indicator condition; routine offer of testing</span></li>'+
