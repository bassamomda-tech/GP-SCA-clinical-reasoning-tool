  quickSub:"If you read nothing else on this page, read these six cards. Every number traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"\u26a0 The red flags that mean it is not idiopathic", html:"Constipation from birth or the first few weeks of life, delayed passage of meconium (more than 48 hours in a term infant), ribbon stools from birth, blood not explained by an anal fissure, faltering growth, bilious vomiting, severe abdominal distension, an abnormal thyroid gland, an abnormal anus, reduced lower-limb power, tone or reflexes, a sacral dimple, hair tuft or gluteal cleft abnormality, or a family history of Hirschsprung's disease. Most childhood constipation is functional, but organic disease must be considered when there are red flags, early onset, treatment failure or atypical examination findings \u2014 <b>do not treat as idiopathic constipation; refer to an appropriate clinician</b>."},
    {tone:"amber", h:"Soft soiling is overflow, not diarrhoea", html:"Soft or liquid soiling in a child with infrequent, large or painful stools commonly represents overflow around retained stool \u2014 and treating it as diarrhoea worsens the impaction. <b>Confirm the wider history and abdominal examination</b> rather than assuming all liquid leakage is overflow: true diarrhoea and non-retentive faecal incontinence also occur."},
    {tone:"blue", h:"Disimpact BEFORE maintenance", html:"<b>NICE CG99 is explicit \u2014 disimpact first, then maintain.</b> Starting maintenance doses in a loaded child causes worsening soiling and treatment failure. <b>Warn parents that soiling briefly gets messier during the clear-out</b> \u2014 that is expected, not failure."},
    {tone:"green", h:"Macrogol first line, titrated to soft, painless stools", html:"Oral macrogol (polyethylene glycol 3350 plus electrolytes) according to the age/product regimen in the current BNFC and product information \u2014 products are not interchangeable by sachet. Titrate to regular, soft, painless stools without soiling or withholding. A Cochrane review found it <b>superior to lactulose</b> for frequency and consistency, and superior to enemas for quality of life. <b>Safe long-term.</b>"},
    {tone:"amber", h:"Stopping too soon is the commonest failure", html:"Relapse is common if treatment is stopped prematurely. <b>Continue maintenance until regular, painless stools and toileting are well established</b> (for several weeks after a regular bowel habit), then <b>taper gradually over months</b>, guided by stool consistency, frequency, soiling and withholding. Some children require longer treatment. <b>This is a marathon, not a sprint \u2014 say so.</b>"},
    {tone:"amber", h:"Two things GPs skip", html:"<b>Do not perform a digital rectal examination routinely in primary care.</b> If a red flag is present or the diagnosis is uncertain, refer to a clinician experienced in paediatric assessment and rectal examination. And <b>do not request a plain abdominal X-ray routinely</b> to diagnose or monitor constipation \u2014 it may occasionally be requested by specialist services in refractory or diagnostically difficult cases."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step is the one that separates functional from organic.",
  pathway:[
    {title:"Exclude organic disease", html:"Constipation from birth, delayed meconium, ribbon stools, blood not explained by a fissure, faltering growth, bilious vomiting, severe distension, abnormal thyroid gland, neurological or spinal signs, abnormal anus, an unexplained abdominal mass \u2014 Hirschsprung's, hypothyroidism, coeliac disease, spinal dysraphism. <b>Refer rather than treat as idiopathic.</b>", alert:true},
    {title:"Diagnose it positively", html:"<b>NICE CG99 features</b> (or the exact Rome IV criteria) and the <b>Bristol Stool Chart</b> rather than \u201cnot going enough\u201d. Identify the <b>precipitant</b> \u2014 toilet training, school start, a fissure \u2014 and ask whether the soiling is soft (overflow)."},
    {title:"Examine \u2014 and know what not to do", html:"Plot growth, palpate the abdomen for a faecal mass, inspect the perianal area and the spine. <b>No routine digital rectal examination, abdominal X-ray or blood tests.</b> Investigate selectively for faltering growth, systemic illness, relevant examination findings, refractory constipation or a specialist request."},
    {title:"Disimpact, then maintain", html:"Escalating oral macrogol, reviewed within 1 week; if disimpaction has not occurred after the recommended course (NICE: 2 weeks), add a stimulant laxative or use an alternative regimen. Then start maintenance straight away, titrated to <b>regular, soft, painless stools without soiling or withholding</b>. <b>Behavioural work runs alongside, not afterwards.</b>"},
    {title:"Review and keep going", html:"Review disimpaction <b>within 1 week</b>, first maintenance review <b>within 6 weeks</b>, then tailor reviews to response; <b>refer if no response within 3 months</b>. Taper gradually over months once regular bowel habit is established. Reinforce the timescale at every visit."}
  ],
  sections:[

    {id:"severe", nav:"Exclude first", title:"Organic and surgical causes \u2014 exclude these before treating",
     sub:"Most childhood constipation is functional, but organic disease must be considered when there are red flags, early onset, treatment failure or atypical examination findings.",
     blocks:[
       {b:"table", head:["Red flag","Suggests","Action"], rows:[
         ["<b>Delayed meconium \u2014 not passed within 48 hours of birth</b>","<b>Hirschsprung's disease</b>","<b>Urgent neonatal referral</b>"],
         ["<b>Constipation from birth or the first few weeks of life</b>","Hirschsprung's disease or other organic cause","<b>Urgent paediatrics</b>"],
         ["<b>Ribbon stools from birth</b>","Anorectal malformation or Hirschsprung's","<b>Urgent paediatrics</b>"],
         ["Family history of Hirschsprung's disease","Hirschsprung's disease","<b>Urgent paediatrics</b>"],
         ["Abnormal thyroid gland","Hypothyroidism","<b>Paediatric referral</b>"],
         ["<b>Severe abdominal distension</b>","No stool or flatus, <b>bilious vomiting</b>, distension \u2192 bowel obstruction","<b>999</b>"],
         ["<b>Bilious vomiting</b>","Especially in a neonate \u2014 <b>malrotation, intussusception, Hirschsprung's</b>","<b>999</b>"],
         ["Blood in stool not explained by a fissure","Significant rectal bleeding","<b>Urgent paediatrics</b>"],
         ["<b>Neurological features</b>","Reduced lower-limb power, tone or reflexes, abnormal gait, absent cremasteric reflex, an absent anal reflex (a specialist sign, not reliably assessed in routine primary care), or a <b>sacral dimple, hair tuft or gluteal cleft abnormality</b> with associated findings \u2192 spinal pathology","<b>Urgent paediatric assessment</b> \u2014 imaging arranged through the appropriate specialist pathway"],
         ["<b>Abnormal anus</b>","Anorectal malformation","<b>Urgent paediatrics</b>"],
         ["<b>Faltering growth with constipation</b>","<b>Hypothyroidism, coeliac disease, Hirschsprung's</b>","<b>Paediatric referral</b> \u2014 selective investigation"],
         ["<b>Unexplained abdominal mass</b>","A mass that is not clearly faecal, or does not resolve with appropriate treatment","<b>Very urgent specialist assessment under NG12</b> \u2014 see below"]
       ]},
       {b:"why", html:"<b>Hirschsprung's disease affects 1 in 5,000 children</b> \u2014 absent ganglion cells in the colon cause a functional obstruction. It classically presents with <b>delayed meconium >48 h in a term neonate</b> but can present later with severe constipation, and needs a surgical <b>pull-through</b> procedure. <b>Missing it leads to toxic megacolon.</b> Separately, spinal cord anomalies (tethered cord, sacral agenesis) can present as chronic constipation with urinary symptoms \u2014 refer for paediatric assessment where there are neurological signs, an abnormal gluteal cleft, a deep or atypical sacral dimple, a hair tuft or other cutaneous stigmata, or associated bladder/lower-limb dysfunction. <b>Imaging should be arranged through the appropriate specialist pathway.</b>"},
       {b:"dl", rows:[
         ["<b>NG12 \u2014 the children and young people route that applies here</b>","An unexplained palpable abdominal mass or enlarged abdominal organ in a child warrants very urgent specialist assessment under NG12 (within 48 hours) for suspected neuroblastoma or Wilms' tumour. Not every palpable faecal mass is an NG12 referral: decide whether the mass is clearly faecal (usually indentable, \u201crolling\u201d under the fingers) and resolves with appropriate treatment \u2014 a mass that is not clearly faecal must go down the very-urgent route, not into a laxative trial. The same table gives the other paediatric routes to hold in mind in an unwell child: unexplained petechiae, hepatosplenomegaly or generalised lymphadenopathy \u2192 very urgent full blood count within 48 hours plus immediate paediatric referral for leukaemia. NG12 referral is triggered by the abdominal mass or other cancer features, not by constipation alone"]
       ]}
     ]},

    {id:"confirm", nav:"Confirm", title:"Diagnose it positively \u2014 NICE CG99, Rome IV and the Bristol chart",
     sub:"\u201cNot going enough\u201d and \u201chard stools\u201d are subjective. Define it clearly for the family and for the record.",
     blocks:[
       {b:"dl", rows:[
         ["<b>NICE CG99 \u2014 preferred for UK primary care</b>","Make a positive clinical diagnosis using the CG99 history and examination features, and actively look for red flags. Rome IV is an alternative only if its exact criteria are applied"],
         ["<b>History to take</b>","Stool frequency and consistency; pain; withholding and retentive posturing; stool size; soiling; toilet-training history; diet, fluid and milk intake; medications; urinary symptoms; psychosocial and school factors"],
         ["<b>Rome IV \u2014 developmental age under 4 years</b>","Use the Rome IV <b>infant/toddler</b> criteria. Do not apply faecal incontinence as an equivalent diagnostic criterion in a child who is not toilet-trained"],
         ["<b>Rome IV \u2014 developmental age 4 years and over</b>","<b>\u22652 of the following, occurring at least once a week for at least 1 month</b>, with insufficient criteria for IBS: \u22642 defecations a week; \u22651 episode of faecal incontinence a week (toilet-trained child); retentive posturing or excessive stool retention; painful or hard bowel movements; a large faecal mass in the rectum; large-diameter stools that obstruct the toilet"],
         ["<b>Bristol Stool Chart</b>","<b>Types 1\u20132 = constipated</b> (hard, lumpy). <b>Types 3\u20134 = normal.</b> <b>Types 5\u20137 = loose or diarrhoea.</b> <b>Show families the chart</b> \u2014 it normalises the discussion and improves history accuracy"],
         ["<b>Frequency norms</b>","Breastfed neonate: up to 7 a day is normal. Formula-fed: 1\u20132 a day. Age 1\u20133 years: 1\u20132 a day. School age: from once a day to once every 3 days. <b>Fewer than 3 a week in a school-age child is constipation</b>"],
         ["<b>Faecal soiling (encopresis)</b>","Soft or liquid soiling in a child with infrequent, large or painful stools commonly represents <b>overflow around retained stool</b> \u2014 often misidentified as diarrhoea. Confirm the wider history and abdominal examination rather than assuming all liquid leakage is overflow: <b>non-retentive faecal incontinence</b> (over 4 years, no evidence of faecal retention) and true diarrhoea also occur. Always ask about the hard stools underneath it"],
         ["Onset and trigger","Identify the precipitant \u2014 toilet training, starting school, a diet change, an illness, travel, or a painful fissure \u2192 the pain-avoidance cycle. Understanding the trigger guides treatment"]
       ]},
       {b:"table", head:["Pattern","Recognise it by","What it means"], rows:[
         ["<b>Functional (idiopathic) constipation</b>","No red flags, normal examination, no organic cause","<b>Most childhood constipation.</b> Behavioural and dietary factors predominate \u2014 laxatives plus behavioural support"],
         ["<b>Faecal impaction</b>","<b>Overflow soiling</b>, a palpable abdominal mass, a prolonged history, soiling despite apparent effort","<b>Requires disimpaction before maintenance laxatives</b> \u2014 assess for it on examination"],
         ["<b>Organic constipation</b>","Any red flag. <b>Hypothyroidism</b> (weight gain, dry skin, slow pulse, goitre); <b>coeliac disease</b> (faltering growth, anaemia); <b>cystic fibrosis</b> (steatorrhoea); <b>hypercalcaemia</b>","Refer; investigate selectively (e.g. TSH and free T4, coeliac serology) for faltering growth, systemic illness, relevant examination findings, refractory constipation or a specialist request"],
         ["<b>The pain\u2013fear cycle</b>","Hard stool \u2192 pain \u2192 withholding \u2192 harder stool \u2192 more pain \u2192 more withholding","<b>Breaking it needs laxatives AND behavioural strategies</b> \u2014 address the fear explicitly"],
         ["Dietary-driven","Low fibre, low fluid, <b>excessive milk intake displacing food</b>, selective eating, few fruit and vegetables","Common at weaning and in school-age children with selective eating"],
         ["Situational","<b>Starting school</b> (reluctant to use unfamiliar toilets), holidays, illness, a change of routine","Identify and address the trigger directly"]
       ]},
       {b:"warn", html:"Faecal impaction must be disimpacted with escalating oral macrogol before maintenance is started. Starting maintenance doses in a loaded child leads to worsening soiling and treatment failure \u2014 <b>NICE CG99 is explicit: disimpact first, then maintain</b>. And the pain\u2013fear cycle explains why laxatives alone are insufficient: once a child has experienced painful defecation, <b>withholding becomes a conditioned response</b>."}
     ]},

    {id:"workup", nav:"Work-up", title:"Examination and investigations \u2014 and what not to do",
     sub:"Do not routinely perform blood tests in a child with typical idiopathic constipation and no red flags. Investigate selectively if there is faltering growth, systemic illness, relevant examination findings, refractory constipation or a specialist request.",
     blocks:[
       {b:"table", head:["Examine","Looking for","Why"], rows:[
         ["<b>Growth and nutrition</b>","<b>Plot height and weight on a centile chart</b>","<b>Faltering growth with constipation is a red flag</b> \u2014 refer and investigate selectively (coeliac, hypothyroid). Obesity with constipation \u2192 dietary assessment"],
         ["<b>Abdomen</b>","Palpate all quadrants \u2014 a left iliac fossa or suprapubic faecal mass may be palpable in impaction. Is it <b>indentable</b>, with a \u201crolling\u201d feel? Usually non-tender","Pain suggests a different diagnosis. <b>Abdominal palpation is sufficient to detect impaction in most cases</b>"],
         ["Perianal inspection","<b>Fissures</b> (linear tears at 6 or 12 o'clock \u2014 confirm the hard-stool cause), <b>skin tags</b>, soiling staining, and the anal position \u2014 an anteriorly placed anus suggests a congenital anomaly","<b>Do not perform a digital rectal examination routinely in primary care</b> \u2014 if a red flag is present or the diagnosis is uncertain, refer to a clinician experienced in paediatric assessment and rectal examination"],
         ["<b>Spine and lower limbs</b>","Anus and gluteal cleft; sacral dimple (depth, location, within or above the natal cleft), hair tuft, skin lesion or deviated cleft. Leg power, tone and reflexes where indicated; the anal reflex is a specialist sign","Refer for paediatric assessment where there are neurological signs, an abnormal gluteal cleft, a deep or atypical sacral dimple, a hair tuft or other cutaneous stigmata, or bladder/lower-limb dysfunction \u2014 imaging via the specialist pathway. No 5 mm threshold as a stand-alone MRI indication"],
         ["Thyroid","<b>Abnormal thyroid gland is a red flag \u2192 refer; consider thyroid function tests.</b> Bradycardia, dry skin, slow reflexes","Hypothyroidism causes constipation, growth failure and delayed bone age"],
         ["<b>Developmental and psychosocial</b>","Autism spectrum disorder (ASD) is associated with functional constipation; toileting anxiety is common. Observe the parent\u2013child interaction","Safeguarding awareness if the soiling is causing significant distress and the parental response is harsh"]
       ]},
       {b:"table", head:["Investigation","When","Notes"], rows:[
         ["<b>Do NOT order routinely \u2014 abdominal X-ray (AXR)</b>","Not to diagnose or monitor constipation","NICE CG99 advises against a plain abdominal X-ray to diagnose idiopathic constipation \u2014 it may occasionally be requested by specialist services in refractory or diagnostically difficult cases"],
         ["<b>Not routinely \u2014 digital rectal examination</b>","Only if a red flag is present or the diagnosis is uncertain","Refer to a clinician competent to interpret anatomical abnormalities and Hirschsprung's disease. In a child under 1 year who fails to respond to optimal treatment within 4 weeks, arrange urgent specialist assessment"],
         ["<b>Not routinely \u2014 blood tests</b>","Typical idiopathic constipation with no red flags","Investigate selectively: faltering growth, systemic illness, relevant examination findings, refractory constipation or a specialist request"],
         ["TFTs (TSH and T4)","Selectively \u2014 faltering growth, abnormal thyroid gland or features of hypothyroidism, or ongoing intractable constipation if requested by specialist services","Hypothyroidism"],
         ["<b>Coeliac serology \u2014 tTG IgA plus total IgA</b>","Selectively \u2014 faltering growth, anaemia or systemic features, or ongoing intractable constipation if requested by specialist services","<b>Coeliac disease can present primarily as constipation in children</b>"],
         ["Calcium and metabolic panel","Selectively \u2014 polydipsia or systemic illness with constipation","<b>U&amp;E, calcium, glucose and bicarbonate</b> \u2014 hypercalcaemia, diabetes insipidus, chronic acidosis"],
         ["Rectal suction biopsy","<b>Hospital, paediatric surgeons only</b>","The definitive test for Hirschsprung's \u2014 <b>absent ganglion cells</b>. Do not refer for it without clinical suspicion"],
         ["<b>Spinal imaging</b>","<b>Arranged by the specialist pathway</b> after urgent paediatric assessment \u2014 neurological signs, deep or atypical sacral dimple, hair tuft, abnormal gluteal cleft, bladder or leg dysfunction","Do not delay the referral \u2014 a tethered cord causes progressive irreversible damage"]
       ]},
       {b:"why", html:"NICE CG99 does not recommend routine blood tests in uncomplicated idiopathic constipation. <b>Consider testing for coeliac disease and hypothyroidism in ongoing intractable constipation if requested by specialist services</b>, or sooner where faltering growth, systemic illness or relevant examination findings suggest an organic cause."}
     ]},

    {id:"ladder", nav:"Treatment", title:"The CG99 laxative ladder \u2014 disimpaction then maintenance",
     sub:"Always disimpact first if impacted. Explain up front that treatment will be needed for months. Doses: use the current BNFC and the product information for the exact preparation, cross-checked with the Greater Manchester (GMMMG) formulary \u2014 macrogol products differ in sachet strength and electrolyte content and are not interchangeable by sachet; some regimens are off-label in younger children.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Phase 1", title:"Disimpaction \u2014 escalating macrogol", when:"overflow soiling or a palpable faecal mass",
          html:"Use escalating oral macrogol (polyethylene glycol 3350 plus electrolytes) as first-line disimpaction, according to the current product-specific paediatric regimen in the BNFC and product information. <b>Warn parents that soiling and abdominal discomfort may temporarily worsen.</b> <b>Review within 1 week.</b> If disimpaction has not occurred after the recommended course (NICE: 2 weeks), or macrogol is inadequate, add a stimulant laxative; if macrogol is not tolerated, use an alternative regimen according to NICE and current product information."},
         {step:"Step 1", title:"Maintenance macrogol \u2014 first line", when:"start as disimpaction completes",
          fromLabel:"do not stop after the clear-out",
          html:"Oral macrogol at the maintenance dose in the current BNFC/product information for the exact preparation. Titrate the dose to regular, soft, painless stools without soiling or withholding \u2014 do not require a particular daily stool frequency if the child is clinically well. <b>NICE CG99 first line.</b>"},
         {step:"Step 2", title:"Add a stimulant", when:"macrogol alone insufficient",
          fromLabel:"stools still not soft and painless despite optimised macrogol",
          html:"Senna or <b>sodium picosulfate</b> at night \u2014 dose by age and licensed status per the current BNFC and product information."},
         {step:"Step 3", title:"Lactulose \u2014 if macrogol not tolerated", when:"alternative osmotic",
          fromLabel:"macrogol refused or not tolerated",
          html:"Lactulose \u2014 dose by age per the current BNFC and product information. An osmotic laxative \u2014 may cause flatulence."},
         {step:"Step 4", title:"Rectal treatments \u2014 last resort", when:"oral route failed",
          fromLabel:"oral disimpaction unsuccessful",
          html:"Glycerol suppositories for short-term disimpaction in infants or where the oral route fails \u2014 dose per the current BNFC. <b>Phosphate enema and manual evacuation are hospital-initiated only</b>, if all oral treatment fails."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"\ud83c\udf7c Infants under 1 year", html:"Constipation in an infant, particularly from birth or in the first weeks of life, requires careful assessment for organic disease. Follow infant-specific feeding and laxative advice (age, feeding method and local paediatric advice) \u2014 do not advise extra water between feeds as a general rule. <b>Check licensed age and off-label status</b> in the current BNFC and product information. <b>Refer if red flags are present or if there is no response to optimal treatment within 4 weeks</b> (specialist assessment, including possible rectal examination)."},
         {tone:"blue", h:"\u23f3 Duration \u2014 the point families most need to hear", html:"Continue maintenance until regular, painless stools and toileting are well established \u2014 for several weeks after a regular bowel habit, and until toilet training is established in children who are toilet training. Then taper gradually over months, guided by stool consistency, frequency, soiling and withholding behaviour. Do NOT stop abruptly. Some children require laxatives for several years."}
       ]},
       {b:"warn", html:"Do not stop maintenance too soon \u2014 it is the commonest cause of relapse, and the commonest reason treatment appears to have failed. Families stop when stools normalise, but the rectal muscle has been stretched and needs months of normal function to recover its sensitivity. <b>And do not rely on diet alone as treatment.</b>"},
       {b:"why", html:"<b>Macrogol (Movicol) is NICE CG99's first-line choice</b> \u2014 it works osmotically, is tasteless and is well tolerated. A Cochrane review (2012) found it superior to lactulose for stool frequency and consistency, and superior to enemas for quality of life, and it is <b>safe for long-term use</b>. Counsel families explicitly: <b>this is a marathon, not a sprint.</b>"}
     ]},

    {id:"lifestyle", nav:"Behaviour", title:"Diet, toileting and behaviour \u2014 co-treatment, not closing advice",
     sub:"NICE supports negotiated, non-punitive behavioural interventions alongside laxatives \u2014 not dietary change alone as first-line treatment.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"\ud83d\udca7 Fluid intake", html:"Encourage <b>adequate, age-appropriate fluid</b>. Address <b>excessive milk intake</b> where relevant \u2014 it can displace food, fruit and vegetables. Do not use dietary change alone as first-line treatment for established constipation."},
         {tone:"green", h:"\ud83e\udd66 Dietary fibre", html:"Encourage an <b>age-appropriate balanced diet with adequate fibre</b> \u2014 fruit, vegetables and wholegrain bread or cereals. Address selective eating where relevant. Prunes and kiwi fruit are optional dietary measures with limited evidence, not core treatment."},
         {tone:"blue", h:"\ud83d\udebd Toilet routine", html:"<b>Sit on the toilet for 5\u201310 minutes after meals</b> to use the <b>gastrocolic reflex</b>. <b>Feet flat on the floor or a footstool, knees above hips</b> \u2014 the squatting position relaxes the puborectalis. <b>Non-punitive rewards for sitting and participation, not for producing a stool.</b> Keep a bowel diary."},
         {tone:"green", h:"\ud83c\udfc3 Physical activity", html:"Regular exercise promotes bowel motility \u2014 <b>aim for 60 minutes of moderate activity daily</b>, and reduce screen time, since sedentary behaviour is associated with constipation."},
         {tone:"amber", h:"\ud83c\udfeb School toilet access", html:"School toilet access, privacy, bullying and lack of time can maintain withholding. Liaise with the school or the school nurse where this is contributing \u2014 a GP letter requesting accessible toilet time may help."},
         {tone:"green", h:"\ud83d\udde3\ufe0f De-medicalise the language", html:"<b>Avoid blaming the child for soiling \u2014 it is involuntary.</b> Explain it as <em>\u201cthe poo is just slipping out because the bowel is too full.\u201d</em> Avoid shame and punishment, and address anxiety, withholding and family stress."},
         {tone:"cream", h:"\ud83d\udcd8 ERIC and the wider team", html:"ERIC \u2014 Education and Resources for Improving Childhood Continence \u2014 has excellent family resources at eric.org.uk, helpline 0808 169 9949. Keep a <b>bowel-habit diary</b>, involve the <b>health visitor or school nurse</b>, and address toilet anxiety directly."}
       ]}
     ]},

    {id:"monitor", nav:"Follow-up", title:"Follow-up, monitoring and safety-netting",
     sub:"Constipation is one of the most under-followed conditions in paediatric primary care.",
     blocks:[
       {b:"table", head:["When","What","Action"], rows:[
         ["<b>Within 1 week</b>","Confirm disimpaction is complete (NICE)","<b>No more soiling, palpable mass gone \u2192 transition to maintenance.</b> Assess family understanding and adherence"],
         ["<b>Within 6 weeks</b>","First maintenance review (NICE) \u2014 are stools <b>regular, soft and painless</b>, without soiling or withholding?","<b>Adjust the dose up or down.</b> Reinforce the toilet routine; ask about school, fluid and diet"],
         ["<b>Then tailored to response</b>","Further reviews (a 3-month full review is possible local practice, not a NICE requirement)","Is the soiling resolved? Any growth concern? <b>No response to initial treatment within 3 months \u2192 refer to a paediatric constipation specialist.</b> Consider escalating the dose or adding a stimulant; <b>psychological referral if the family is overwhelmed</b>"],
         ["<b>Once well established</b>","Begin the wean (timing is local practice, not a NICE rule)","Only when regular, painless stools and toileting are well established \u2014 for several weeks after a regular bowel habit. Taper gradually over months, guided by stool consistency, frequency, soiling and withholding. On relapse, restart the previous dose immediately"],
         ["<b>Documentation</b>","Every visit","Record baseline stool frequency, Bristol score, soiling frequency, abdominal examination, laxative dose and the follow-up plan \u2014 essential for continuity and for any referral"]
       ]},
       {b:"cards", items:[
         
       ]},
       {b:"cards", items:[
         {tone:"red", h:"\ud83d\udd34 Same-day", html:"\u201cSudden tummy pain with swelling and vomiting \u2014 come straight in; that could be a blockage.\u201d Also if the child becomes acutely unwell, or there is <b>significant rectal bleeding beyond a small fissure</b>."},
         {tone:"amber", h:"\ud83d\udfe0 Within a week", html:"<b>Soiling worsening significantly on maintenance</b> (may need re-disimpaction) \u00b7 the child refusing all food or fluids \u00b7 <b>new neurological symptoms \u2014 leg weakness or urinary incontinence</b>."},
         {tone:"blue", h:"\ud83d\udca9 Soiling is overflow", html:"\u201cLeaking usually means a backlog of hard stool, not naughtiness \u2014 we treat the constipation, not the leaking.\u201d"},
         {tone:"green", h:"\u23f3 Keep going", html:"\u201cKeep the laxative going for months \u2014 stopping as soon as things improve is the main reason it comes back.\u201d"},
         {tone:"amber", h:"\ud83d\udcc9 Expect a wobble", html:"\u201cDuring the clear-out things can briefly get messier \u2014 that's expected. Persevere.\u201d"},
         {tone:"cream", h:"\ud83d\udcc8 Prognosis", html:"Most children improve with a structured programme of disimpaction, maintenance laxatives and behavioural support, but relapse is common if treatment is stopped prematurely. Some children require prolonged or specialist management."}
       ]},
       {b:"say", html:"This is very common and very treatable, but it needs the right approach in the right order. First a proper clear-out \u2014 and I should warn you that things get messier before they get better, which is expected. Then a daily laxative kept going for months, not weeks: the bowel has been stretched and needs time to get its sensation back, and stopping early is the usual reason it comes back. The leaking isn't naughtiness, it's stool slipping past a blockage, so please don't tell them off for it. Diet and a sitting-after-meals routine both help, but they aren't enough on their own."}
     ]},

    {id:"loop", nav:"Not responding?", title:"Not improving? Re-check before escalating", sub:"Re-examine impaction, adherence and the diagnosis.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"1 \u00b7 Still impacted?", html:"Inadequate disimpaction \u2192 maintenance will fail; re-disimpact."},
         {tone:"amber", h:"2 \u00b7 Dose", html:"Macrogol titrated adequately; stimulant added if disimpaction failed after the recommended course?"},
         {tone:"amber", h:"3 \u00b7 Adherence", html:"Families often under-dose or stop early \u2014 support and re-educate."},
         {tone:"blue", h:"4 \u00b7 Behavioural", html:"Toilet routine, withholding and the fear cycle genuinely addressed? <b>School toilet access</b> sorted?"},
         {tone:"blue", h:"5 \u00b7 Red flags", html:"Faltering growth or new organic features \u2192 <b>refer, investigating selectively</b>."},
         {tone:"blue", h:"6 \u00b7 Refer", html:"No response within 3 months <b>despite adequate disimpaction and maintenance</b> \u2192 paediatric constipation specialist."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral criteria",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999 / same-day ED", html:"Suspected bowel obstruction \u2014 distension with bilious vomiting and no stool. Acute abdomen. Severe distension. Signs of ischaemia. <b>Acutely unwell child.</b> <b>Neonatal constipation with vomiting.</b>"},
         {tone:"amber", h:"Urgent paediatrics (1 week)", html:"<b>Suspected Hirschsprung's</b> (delayed meconium, ribbon stools, neonatal onset) \u00b7 <b>suspected spinal pathology</b> (neurological signs, abnormal gluteal cleft, deep or atypical sacral dimple) \u00b7 any other red flag \u00b7 <b>significant growth concern or abnormal investigations</b> (hypothyroidism, coeliac disease) \u00b7 <b>under 1 year with no response to optimal treatment within 4 weeks</b>."},
         {tone:"purple", h:"NG12 \u00b7 very urgent (48 hours)", html:"An unexplained palpable abdominal mass or enlarged abdominal organ in a child \u2192 very urgent referral for suspected neuroblastoma or Wilms' tumour. Also unexplained petechiae, hepatosplenomegaly or generalised lymphadenopathy \u2192 very urgent FBC within 48 hours plus immediate paediatric referral (leukaemia). NICE NG12 (updated April 2026)."},
         {tone:"blue", h:"Paediatric constipation specialist", html:"<b>No response after 3 months of optimised treatment</b> \u00b7 <b>recurrent impaction despite adequate maintenance</b> \u00b7 ongoing symptoms despite specialist management \u00b7 significant psychological impact or school non-attendance."},
         {tone:"blue", h:"CAMHS / psychology", html:"Significant anxiety around toileting \u00b7 <b>school refusal because of constipation</b> \u00b7 a trauma history \u00b7 <b>ASD with constipation and a severe behavioural component</b> \u2014 not as a substitute for treating the constipation."},
         {tone:"amber", h:"Safeguarding", html:"If soiling is being punished harshly, the child appears distressed beyond expectation, accounts are inconsistent, there are wider safeguarding concerns, or multiple inappropriate investigations have been sought \u2192 safeguarding concern. Consult the named GP."},
         {tone:"cream", h:"Manage in primary care", html:"Functional constipation responding to laxatives, a family who understand and are engaged, no red flags, age >1 year, and a clear maintenance plan in place."}
       ]},
       {b:"why", html:"<b>Constipation with overflow soiling causes real psychological harm</b> \u2014 school exclusion, bullying and low self-esteem are common consequences, and where the social and psychological impact is significant, psychological support alongside medical management improves long-term outcomes compared with laxatives alone. Structured follow-up (disimpaction review within 1 week, first maintenance review within 6 weeks) supports adherence and reduces secondary psychological harm \u2014 which is the argument against handing over a prescription and waiting for the family to re-present."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 6-year-old brought by his mother because he is \u201chaving diarrhoea every day\u201d and soiling his pants at school. He opens his bowels twice a week, the stools are large and painful, and he hides behind the sofa when he needs to go. His mother is at the end of her tether and says he is doing it deliberately."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"<b>Recognises the \u201cdiarrhoea\u201d as overflow soiling</b> and asks whether it is soft; identifies <b>retentive posturing</b>; uses <b>NICE CG99 features and the Bristol chart</b>; palpates the abdomen and <b>does not do a routine PR, AXR or bloods</b>; <b>disimpacts before starting maintenance</b> and warns that soiling will briefly worsen; commits to <b>months</b> of treatment with a named wean plan; addresses <b>school toilet access</b> with an offer to write; signposts <b>ERIC</b>; and \u2014 the step candidates miss \u2014 explicitly relieves the mother's belief that it is deliberate, because the blame is itself part of the problem."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>NICE CG99 \u2014 Constipation in children and young people (2010, updated 2017)<br><a href="https://www.nice.org.uk/guidance/cg99" rel="noopener">nice.org.uk/guidance/cg99</a><span class="rd"> \u2014 disimpaction before maintenance, macrogol as first line, the advice against routine abdominal X-ray and routine blood tests, no routine digital rectal examination (only by a competent clinician when a red flag or uncertainty is present), review of disimpaction within 1 week, and referral if no response within 3 months. The number is CG99; NICE NG99 is a different guideline (brain tumours in over 16s)</span></li>'+
         '<li><b>NICE CG99 \u2014 Constipation in children and young people</b><br><a href="https://www.nice.org.uk/guidance/cg99" rel="noopener">nice.org.uk/guidance/cg99</a><span class="rd"> \u2014 primary-care assessment, red flags for organic disease, and the referral thresholds</span></li>'+
         '<li><b>Rome IV \u2014 Childhood functional gastrointestinal disorders: child/adolescent</b> (Rome Foundation, Gastroenterology 2016; doi:10.1053/j.gastro.2016.02.015)<span class="rd"> \u2014 criteria for developmental age 4 years and over, and non-retentive faecal incontinence</span></li>'+
         '<li><b>NICE quality standard \u2014 Constipation in children and young people</b><br><a href="https://www.nice.org.uk/guidance/qs62" rel="noopener">nice.org.uk/guidance/qs62</a><span class="rd"> \u2014 review within 1 week of disimpaction and within 6 weeks of starting maintenance</span></li>'+
         '<li><b>GMMMG Formulary \u2014 Gastro-intestinal system</b><br><a href="https://www.greatermanchesterformulary.nhs.uk" rel="noopener">greatermanchesterformulary.nhs.uk</a><span class="rd"> \u2014 local formulary status of the preparation used</span></li>'+
         '<li>NICE NG12 \u2014 Suspected cancer: recognition and referral (updated April 2026), children and young people<br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> \u2014 unexplained palpable abdominal mass or enlarged abdominal organ in a child \u2192 very urgent referral (48 hours) for suspected neuroblastoma or Wilms\u2019 tumour; petechiae, hepatosplenomegaly or generalised lymphadenopathy \u2192 very urgent FBC plus immediate paediatric referral</span></li>'+
         '<li>Cochrane review (2012) \u2014 osmotic and stimulant laxatives for childhood constipation<span class="rd"> \u2014 macrogol superior to lactulose for stool frequency and consistency, and superior to enemas for quality of life</span></li>'+
         '<li><b>ERIC \u2014 Education and Resources for Improving Childhood Continence</b><br><a href="https://eric.org.uk" rel="noopener">eric.org.uk</a> \u00b7 helpline <b>0808 169 9949</b><span class="rd"> \u2014 family resources, and the source signposted for school and toileting support</span></li>'+
         '<li><b>BNF for Children</b><br><a href="https://bnfc.nice.org.uk" rel="noopener">bnfc.nice.org.uk</a><span class="rd"> \u2014 doses by age for macrogol, senna, sodium picosulfate, lactulose and glycerol suppositories; check against the product information for the exact preparation (licensed age, sachet strength, maximum dose)</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Constipation in children \u2014 NICE CG99, Rome IV criteria and the BNF for Children. Diagnosis and management are merged on this page; there is no separate paediatric constipation pathway to cross-check. Check all doses against the current BNFC, the product information for the exact preparation and the GMMMG formulary before prescribing."
