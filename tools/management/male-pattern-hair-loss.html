MG.render({
  icon:"\u{1F488}",
  title:"Male Pattern Hair Loss",
  eyebrow:"Protocol · assess and counsel in one place",
  stemTitle:"Male pattern hair loss — confirm the pattern, exclude the mimics, and make the finasteride conversation a safe one",
  stemSub:"A common, inherited, androgen-driven thinning that is not a disease and needs no treatment unless the man wants it. The GP job is to be sure it really is pattern loss (not scarring, patchy or diffuse loss), to be honest that finasteride 1 mg and topical minoxidil are not routinely NHS-prescribable for uncomplicated pattern loss in England, and — if he chooses finasteride privately — to screen for depression and warn about the psychiatric and sexual effects that the MHRA strengthened in May 2026. This page is written for cis men; for transgender men, adapt it to the individual’s anatomy, hormone treatment and specialist (gender service) pathway.",
  guideline:"PCDS Hair Loss Pathway 2024 · BAD leaflet (male pattern) · MHRA DSU May 2026 · Drug Tariff Part XVIIIA",
  meta:[
    {t:"PCDS Hair Loss Pathway (Nov 2024)"},
    {t:"BAD patient leaflet · BAD alopecia areata 2025"},
    {t:"MHRA DSU finasteride Apr 2024 · May 2026"},
    {t:"Minoxidil and finasteride 1 mg SPCs · BNF"},
    {t:"No NG12 criterion applies"}
  ],
  lead:"<div class='mg-layers'><a href='#pattern'><b>Is it pattern loss?</b><small>Shape, speed, scalp</small></a><a href='#redflags'><b>Mimics</b><small>Scarring needs expedited referral</small></a><a href='#options'><b>Options</b><small>Not routinely NHS-prescribed</small></a><a href='#finasteride'><b>Finasteride safety</b><small>MHRA 2026</small></a></div>",
  quickSub:"The six things to have straight before he leaves the room. Every figure is tied to a source under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"green", h:"It is a normal trait, not an illness", html:"Pattern loss is inherited and driven by dihydrotestosterone (DHT) acting on susceptible follicles, which shrink and make ever finer, shorter hairs. It starts at the temples and crown and spares the back and sides. <b>Doing nothing is a perfectly reasonable choice</b>, and many men take it once they understand what is happening.", src:"PCDS male and female pattern alopecia · BAD leaflet (male pattern)"},
    {tone:"amber", h:"Look at the scalp before you label it", html:"Redness, scale, pustules, shiny skin or lost follicle openings mean <b>scarring alopecia</b> until proven otherwise — arrange expedited dermatology assessment via the local referral pathway, because once scarred the loss is permanent. Round bald patches point to alopecia areata; sudden diffuse shedding to telogen effluvium.", src:"PCDS Hair Loss Pathway 2024"},
    {tone:"blue", h:"Not routinely NHS-prescribable for this", html:"For uncomplicated male pattern hair loss, finasteride 1 mg and topical minoxidil are not routinely NHS-prescribable in England. <b>Finasteride 1 mg</b> tablets and <b>minoxidil</b> solution, cream, lotion and ointment are in <b>Drug Tariff Part XVIIIA</b> and cannot be prescribed on an FP10. Greater Manchester has also put minoxidil foam on its do-not-prescribe list. Finasteride 1 mg is normally obtained by private prescription and minoxidil is usually bought from a pharmacy. This does not prevent NHS prescribing of the same medicines for other licensed or locally commissioned indications.", src:"Drug Tariff Part XVIIIA · GMMMG Sept 2022"},
    {tone:"cream", h:"Minoxidil: twice a day, long term", html:"Use the licensed dose and age range for the specific product. Regaine for Men Extra Strength 5% scalp solution: <b>1 ml twice daily</b> to the affected dry scalp (maximum 2 ml a day), licensed for men aged 18 to 49; other preparations differ, so check the current SPC. The BAD leaflet says to allow at least 6 months, and possibly 12, before judging it. Treatment generally needs to continue indefinitely to maintain any benefit; if stopped, hair loss is expected to resume over time.", src:"Regaine for Men Extra Strength 5% SPC · BAD leaflet"},
    {tone:"red", h:"Finasteride: ask about low mood first, stop 1 mg if depression or suicidal thoughts develop", html:"The MHRA (May 2026) links finasteride with <b>depression, suicidal thoughts and sexual dysfunction that may persist after stopping</b>. Before he starts, ask about any history of depression or suicidal thoughts. If a man taking finasteride 1 mg develops depression or suicidal thoughts, he should <b>stop finasteride and contact a healthcare professional promptly</b> (999 or A&E if at immediate risk of self-harm). Ask him to read the patient alert card in the pack.", src:"MHRA DSU May 2026 · MHRA DSU Apr 2024"},
    {tone:"blue", h:"Finasteride lowers the PSA", html:"Finasteride lowers serum PSA: by about 50% in older men on the 5 mg dose, and in the 1 mg trials in men aged 18 to 41 the mean fell from 0.7 to 0.5 ng/ml. The SPC says the measured PSA may need adjustment (it suggests <b>considering doubling</b> it); interpret it with treatment duration, symptoms, DRE, age, previous PSA trend and local referral thresholds, following the local prostate-cancer pathway. Record privately purchased finasteride in the medication record.", src:"Finasteride 1 mg (Propecia) SPC"}
  ],
  pathwaySub:"Five moves. Step two is where harm happens, because a scarring alopecia mistaken for ordinary balding loses its window.",
  pathway:[
    {title:"Hear what he actually wants", html:"Ask when he noticed it, how fast it is changing, whether his father or other relatives went bald, and what he hopes for: reassurance, a treatment, or a transplant. Ask how much it is bothering him. Low mood, preoccupation with appearance, or plans to buy tablets online all change the conversation."},
    {title:"Examine the scalp, not just the hairline", html:"Pattern loss follows a recognisable shape (temples receding, crown thinning, back and sides kept) and the scalp itself looks normal. <b>Any redness, scale, pustules, scarring, shiny skin or absent follicle openings, or loss that is patchy or sudden</b>, is not pattern loss. Look at the beard, eyebrows and nails too.", alert:true},
    {title:"Only test when the story does not fit", html:"Typical pattern loss in a well man needs no blood tests. If the loss is <b>diffuse</b> or the history is unclear, the PCDS asks for FBC, ferritin and thyroid function. A scaly patch in a child or teenager needs scrapings and plucked hairs for mycology."},
    {title:"Lay out the choices, including doing nothing", html:"Do nothing · camouflage or a different haircut · <b>topical minoxidil</b> bought over the counter · <b>finasteride 1 mg</b> on private prescription · hair-transplant surgery (private). Say plainly that the drugs slow loss and may thicken hair, that they work only while used, and that neither drug is routinely NHS-prescribable for uncomplicated pattern loss."},
    {title:"Make any finasteride decision a safe one", html:"Ask about current and previous depression, suicidal thoughts and self-harm; a past history is not automatically an absolute contraindication. Explain the MHRA warnings, the patient alert card, the effect on PSA, breast changes to report, and that broken tablets must not be handled by a woman who is or may be pregnant. Review mood and sexual function after starting."}
  ],
  sections:[
    {id:"pattern", nav:"Recognise it", title:"Recognising male pattern loss", sub:"The diagnosis is made by looking. The shape, the pace and a normal scalp are what make it.",
     blocks:[
       {b:"kv", rows:[
         ["What is happening","Genetically susceptible follicles respond to DHT by shortening the growing phase. Each cycle produces a finer, shorter, paler hair until the follicle makes only vellus hair. The PCDS describes more than 20% of hairs in affected areas as miniaturised."],
         ["Who gets it","It runs in families and can come from either parent. The risk is higher in sons of men who went bald, and twin studies show strong concordance. It can start any time after puberty."],
         ["The shape","The temples recede and the crown thins, while the hair over the back and sides of the scalp is kept. The Hamilton–Norwood scale gives a shared vocabulary for severity and helps with photographs over time."],
         ["The pace","Gradual, over years. Fast change over weeks, a lot of hair on the pillow, or loss beyond the typical pattern should make you think again."],
         ["The scalp","Looks normal. No redness, scale, pustules, scarring or loss of follicle openings."],
         ["Scope","Written for cis men. For transgender men, adapt the assessment and treatment advice to the individual’s anatomy, hormone treatment and specialist pathway."]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Why no blood tests in the typical case", html:"Blood tests do not confirm pattern loss and do not change how it is treated. Save them for diffuse loss or an unclear story. In that case the PCDS pathway asks for FBC, ferritin and thyroid function, because iron deficiency and thyroid disease both cause diffuse shedding.", src:"PCDS Hair Loss Pathway 2024 · PCDS alopecia overview"},
         {tone:"green", h:"Doing nothing is a real option", html:"The BAD leaflet presents treatment as a choice rather than a need. Many men decide to leave it alone, or to cut their hair short, once they know it is harmless and that any treatment generally needs to continue indefinitely to maintain benefit.", src:"BAD leaflet (male pattern)"}
       ]},
       {b:"why", html:"Getting the label right matters more than the treatment. A man with lichen planopilaris or discoid lupus who is told he is just balding, and sent to buy minoxidil, can lose follicles for good while he waits. Look closely at the scalp every time."}
     ]},

    {id:"redflags", nav:"Red flags", title:"Red flags and mimics", sub:"Hair loss that does not fit the pattern needs its own diagnosis. Scarring is the one that cannot wait.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"Scarring (cicatricial) alopecia — expedited referral", html:"Shiny or smooth skin, no visible follicle openings, redness or scale around follicles, pustules, pain, burning or itch. Causes include lichen planopilaris, frontal fibrosing alopecia, discoid lupus and folliculitis decalvans. Follicles are being destroyed, so arrange <b>expedited dermatology assessment according to the local referral pathway</b> — once scarred, the loss is permanent. In the referral, state clearly any loss of follicular openings, perifollicular inflammation, pustules, pain, burning, itch or shiny atrophic skin. Same-day referral is not needed unless he is acutely unwell or has severe infection.", src:"PCDS Hair Loss Pathway 2024"},
         {tone:"blue", h:"Alopecia areata", html:"Well-defined round or oval bald patches, often with short broken ‘exclamation mark’ hairs at the edge. Beard and eyebrows may be involved, and nails may be pitted. Management, including when to refer, follows the BAD living guideline.", src:"BAD alopecia areata living guideline 2025"},
         {tone:"blue", h:"Telogen effluvium", html:"Diffuse shedding that often begins several weeks to months after a systemic or physiological trigger such as fever, infection, major stress, a new drug or big weight loss, and may improve gradually after the trigger has resolved. The timing is a counselling point, not a diagnostic criterion. Persistent or progressive loss should prompt reassessment for coexisting pattern loss, iron deficiency, thyroid disease, medication effects or another alopecia.", src:"PCDS Hair Loss Pathway 2024 · BAD telogen effluvium leaflet Oct 2025"},
         {tone:"blue", h:"Tinea capitis", html:"Mostly seen in children, but it can affect adults. Look for scaly patches, broken hairs, black dots, pustules or a boggy kerion. Take scalp scrapings and plucked hairs for mycology. It needs oral antifungal treatment, because topical treatment alone does not clear it. A <b>kerion</b>, marked inflammation, pustules, pain or risk of scarring warrants urgent specialist or paediatric dermatology advice.", src:"BAD tinea capitis guideline 2014"},
         {tone:"amber", h:"Mood and body image", html:"Hair loss can be very distressing. Watch for low mood, social withdrawal, or preoccupation that suggests body dysmorphic disorder. Take this especially seriously before finasteride, because the MHRA links it with depression and suicidal thoughts.", src:"MHRA DSU May 2026"},
         {tone:"blue", h:"No suspected-cancer criterion", html:"Male pattern hair loss alone is not a NICE NG12 (updated April 2026) suspected-cancer referral criterion. A persistent ulcer, nodule, pigmented lesion or other suspicious scalp lesion should be assessed independently under the relevant skin-cancer pathway.", src:"NICE NG12 (updated April 2026)"}
       ]},
       {b:"warn", html:"<b>Same-day action:</b> a man taking finasteride 1 mg who reports suicidal thoughts should stop it (MHRA). Separately, same-day suicide-risk assessment is required for any patient reporting suicidal thoughts, regardless of whether finasteride is the suspected cause — this is the usual mental-health safety response, not a finasteride-specific MHRA instruction. Escalate to crisis services or 999 according to intent, plan, means, immediate risk and safeguarding concerns."}
     ]},

    {id:"options", nav:"Options", title:"What he can choose, and what the NHS provides", sub:"Set this out before any drug is named. It changes the conversation.",
     blocks:[
       {b:"table", head:["Option","What it does","Where it comes from"], rows:[
         ["<b>Accept it, or change the style</b>","Nothing to take and no side effects. A short or shaved cut often looks best as it progresses.","—"],
         ["<b>Topical minoxidil 5%</b>","Lengthens the growing phase and can slow loss and thicken the hair he still has. Regaine for Men Extra Strength 5% solution is licensed for men aged 18 to 49 (SPC); age restrictions and licensed indications vary by product, so check the current SPC for the preparation recommended.","Pharmacy, over the counter. Drug Tariff Part XVIIIA blocks FP10 prescriptions for the solution, cream, lotion and ointment."],
         ["<b>Finasteride 1 mg daily</b>","Blocks conversion of testosterone to DHT, which slows loss and may regrow some hair. Licensed for male pattern hair loss in adult men within the licensed age range in the current product information (the SPC and MHRA 2024 state 18 to 41 years; check the current SPC). Use outside that range is off-label and should be discussed with the prescriber.","Private prescription only. The 1 mg tablet is in Drug Tariff Part XVIIIA."],
         ["<b>Hair-transplant surgery</b>","Moves follicles from the back of the scalp. It works best when the pattern is stable, and medication is often continued afterwards.","Private clinics. Advise him to verify the practitioner’s GMC registration and relevant training, the clinic’s regulatory status, who will perform each part of the procedure, the expected density, risks, costs and aftercare, and to get a clear written quote and complication and follow-up plan. Be wary of claims of guaranteed density or permanent results."],
         ["<b>Camouflage</b>","Hair fibres, scalp tattooing (micropigmentation) and hair systems.","Private or retail."]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"The Greater Manchester position", html:"GMMMG (September 2022) added minoxidil foam to its do-not-prescribe list and confirmed that the other minoxidil preparations are blocked by Drug Tariff Part XVIIIA. So no topical minoxidil should be issued on the NHS in Greater Manchester for pattern loss.", src:"GMMMG recommendations Sept 2022 · Greater Manchester formulary 13.9"},
         {tone:"blue", h:"Finasteride 5 mg is not a workaround", html:"Finasteride 5 mg is licensed for benign prostatic hyperplasia, and NHS prescribing for that or other licensed or locally commissioned indications is unaffected. Prescribing it on the NHS so that it can be split for cosmetic hair loss gets round the Part XVIIIA restriction. It also means tablets get broken, and a woman who is or may be pregnant must not handle broken tablets.", src:"Drug Tariff Part XVIIIA · finasteride SPC"}
       ]},
       {b:"say", html:"“Your examination is consistent with male pattern hair loss. It is common and harmless, and you do not have to treat it. The options are doing nothing, camouflage or a different haircut, topical minoxidil from a pharmacy, or finasteride 1 mg, which is normally obtained privately — neither is routinely prescribed on the NHS for this. Both treatments take months to judge and only maintain their benefit while they are used. Finasteride can affect sexual function and has been associated with depression and suicidal thoughts. Before starting, we should discuss any history of depression or suicidal thoughts. If you develop depression or suicidal thoughts while taking 1 mg finasteride, stop it and contact a healthcare professional promptly; if you are at immediate risk, call 999. Sexual side effects can occasionally persist after stopping. Finasteride also lowers PSA, so please tell any doctor performing a PSA test that you are taking it. Keep the alert card and patient leaflet.”"}
     ]},

    {id:"minoxidil", nav:"Minoxidil", title:"Topical minoxidil in practice", sub:"The drug most men try first, because it is available at any pharmacy.",
     blocks:[
       {b:"ladder", steps:[
         {step:"How", title:"Apply to a dry scalp twice a day", when:"per product SPC", fromLabel:"SPC dose", html:"Regaine for Men Extra Strength 5% solution: <b>1 ml to the affected scalp twice daily</b>, no more than 2 ml a day, starting from the centre of the thinning area. The scalp and hair must be dry. Wash hands afterwards, and avoid the forehead and face. Avoid contact with the eyes and do not apply to an inflamed, infected or painful scalp. For the 5% foam, follow the current product SPC (Regaine for Men 5% Scalp Foam, emc 5781), because the application quantity and instructions are formulation-specific. Age restrictions and licensed indications vary by product; check the current SPC for the preparation being recommended."},
         {step:"When", title:"Judge it at 6 to 12 months", when:"not before", fromLabel:"patience", html:"The SPC and product leaflet say results may take at least <b>2 to 4 months</b> to appear. The BAD leaflet advises using it for <b>at least 6 months, and possibly 12</b>, before deciding whether it helps. The PCDS cites an approximate response rate of 40%, mostly in those who start early while they are still noticing shedding, but this is not a guarantee and should not be interpreted as complete regrowth."},
         {step:"Expect", title:"Shedding first, then stabilisation", when:"first 4 to 6 weeks", fromLabel:"warn him", html:"Increased shedding may occur during the initial period of treatment. If severe, persistent or associated with scalp inflammation, reassess the diagnosis and product tolerability. It happens because resting hairs are pushed out as new growth starts. Warn him in advance so that he does not stop too early."},
         {step:"Stop", title:"Gains fade when it stops", when:"long-term use", fromLabel:"continuation", html:"Treatment generally needs to continue indefinitely to maintain any benefit. If he stops, the hair loss continues as it would have without treatment."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"Side effects to mention", html:"Scalp irritation, dryness, scaling and itch. Unwanted hair growth where the product runs onto the face (the PCDS estimates hypertrichosis at about 14%). Systemic absorption is uncommon, but the SPC says to stop and see a doctor if he gets chest pain, a fast heartbeat, faintness or dizziness, sudden weight gain, or swollen hands or feet.", src:"PCDS male and female pattern alopecia · Regaine minoxidil SPC"},
         {tone:"blue", h:"When not to use it", html:"The minoxidil SPCs exclude loss that is sudden or patchy, loss with no family history, loss of unknown cause, and use on an inflamed, infected, irritated or painful scalp. Each of these means the diagnosis needs revisiting first.", src:"Regaine minoxidil SPC (emc 5765)"}
       ]}
     ]},

    {id:"finasteride", nav:"Finasteride", title:"Finasteride 1 mg — the safety conversation", sub:"He will usually get it privately or online, but his GP is still the person he comes back to when something goes wrong.",
     blocks:[
       {b:"kv", rows:[
         ["Licence and dose","<b>1 mg once daily</b>. Licensed for male pattern hair loss in adult men within the licensed age range in the current product information (18 to 41 years in the SPC and MHRA 2024 advice; check the current SPC at review). Treatment outside the licensed age range is off-label and should be discussed with the prescriber. Finasteride 1 mg is not indicated for women or children."],
         ["Time course","The SPC says stabilisation usually takes <b>3 to 6 months</b> of daily use. The BAD leaflet says a benefit may take over a year to show. If he stops, the benefit starts to reverse <b>by 6 months</b> and returns to baseline <b>by 9 to 12 months</b>."],
         ["Sexual effects","Reduced libido and erection problems affect about <b>2%</b> of users (BAD leaflet). There may also be ejaculation disorders and breast tenderness. The MHRA says sexual dysfunction <b>may persist after stopping</b>."],
         ["Psychiatric effects","Depression and suicidal thoughts have been reported, including in men with no history of depression. By 5 April 2024 the MHRA had received 281 Yellow Card reports of mood disorders and suicidal or self-injurious behaviour, and 426 reports of sexual dysfunction, across finasteride 1 mg and 5 mg."],
         ["PSA","Finasteride lowers PSA (about 50% in older men on 5 mg; mean 0.7 to 0.5 ng/ml in the 1 mg trials in men aged 18 to 41). The SPC advises considering adjustment (doubling) of the measured value, but do not rely on an isolated “double the PSA” rule: consider duration of treatment, symptoms, DRE, age, previous PSA trend and local referral thresholds, and follow the current SPC and local prostate-cancer pathway. A new urinary symptom, haematuria, abnormal DRE or concerning PSA must be assessed through the usual prostate-cancer pathway regardless of whether finasteride was obtained privately."],
         ["Breast","Male breast cancer has been reported after marketing. He should report any lump, pain, gynaecomastia or nipple discharge promptly."],
         ["Pregnancy exposure","Women who are or may be pregnant must not handle crushed or broken tablets. The drug can be absorbed and could affect the genitals of a male fetus. Whole coated tablets can be handled normally."]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"red", h:"Before the first tablet: screen mood", html:"The MHRA (11 May 2026) asks prescribers to <b>ask about any personal history of depression or suicidal ideation</b> before starting finasteride, to tell patients about the risks when prescribing, and to point them to the patient alert card and the leaflet. A GP asked for an opinion should give the same counselling, even if the prescription comes from somewhere else. Consider the severity, stability and treatment of any psychiatric illness before recommending or supporting treatment. A history of depression is not automatically an absolute contraindication, but active suicidal ideation or significant untreated depression warrants specialist or mental-health advice before starting.", src:"MHRA DSU May 2026"},
         {tone:"red", h:"Depression or suicidal thoughts on finasteride", html:"If a man taking <b>finasteride 1 mg</b> develops depression or suicidal thoughts, he should <b>stop finasteride and contact a healthcare professional promptly</b>. If there is immediate risk of self-harm, call 999 or attend A&E. Men taking finasteride 5 mg or dutasteride should contact their healthcare professional promptly rather than being given the same stop instruction. New sexual dysfunction should also be reported, because it may persist after treatment and may contribute to mood disturbance. A mild transient change in mood is not the same as a depressive episode or suicidal ideation: assess severity and risk. Report a Yellow Card.", src:"MHRA DSU May 2026 · MHRA DSU Apr 2024"},
         {tone:"amber", h:"Monitor after starting", html:"The MHRA asks prescribers to watch for psychiatric and sexual side effects once treatment has started. Ask about both at every contact, and make sure finasteride is on his repeat record or noted as a private medicine.", src:"MHRA DSU May 2026"},
         {tone:"blue", h:"The patient alert card", html:"Since 2024, packs have included a card that sets out the risks of sexual dysfunction, depression and suicidal thoughts, and what to do if they occur. The MHRA’s 2026 update reinforced it. Ask him whether he has read it, especially if he bought the tablets online.", src:"MHRA DSU Apr 2024 · MHRA DSU May 2026"},
         {tone:"cream", h:"Already taking private or online finasteride", html:"Record privately purchased finasteride in the medication record. Ask about mood, suicidal thoughts and sexual function, check he has the patient alert card and leaflet, and give the same stop-and-contact advice for depression or suicidal thoughts. Remind him to tell any doctor performing a PSA test that he takes it. Do not take over the prescribing.", src:"MHRA DSU May 2026 · Finasteride 1 mg SPC"}
       ]},
       {b:"why", html:"The MHRA has now warned twice (April 2024 and May 2026) that depression, suicidal thoughts and sexual dysfunction can occur with finasteride and may persist after it is stopped, and it asks prescribers to ask about depression and suicidal ideation before prescribing. The pattern-loss consultation is often the only chance a GP gets to deliver that counselling before a man buys tablets online."}
     ]},

    {id:"oral-minoxidil", nav:"Oral minoxidil", title:"Low-dose oral minoxidil — what to say when he asks", sub:"It is increasingly offered by private clinics, but it is not licensed for hair loss in the UK.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"Unlicensed, and not a GP start", html:"Minoxidil tablets are licensed in the UK only for severe hypertension. Using a low dose for hair loss is off-label, and in the NHS it belongs to dermatology. The BAD leaflet notes that recent research suggests low-dose oral minoxidil may work at least as well as topical minoxidil in some situations.", src:"Minoxidil tablets SPC · BAD leaflet (female pattern) Oct 2024"},
         {tone:"blue", h:"The safety data", html:"In a multicentre series of 1,404 patients (Vañó-Galván, J Am Acad Dermatol 2021), the most common adverse effect was hypertrichosis (15.1%). Lightheadedness, fluid retention and tachycardia were less common. 1.7% stopped because of adverse effects. This is observational evidence from an international (Spanish) setting.", src:"International: Vañó-Galván et al., J Am Acad Dermatol 2021"},
         {tone:"cream", h:"If he is already taking it privately", html:"Record it. Check his blood pressure and pulse, and ask about ankle swelling, palpitations and dizziness. Make sure the private prescriber knows about any heart disease or antihypertensive treatment. Do not take over the prescribing.", src:"Minoxidil tablets SPC"}
       ]}
     ]},

    {id:"followup", nav:"Follow-up", title:"Follow-up and expectations", sub:"What success looks like, and when to stop.",
     blocks:[
       {b:"timeline", items:[
         {n:"1", when:"Week 0", title:"Baseline photographs", html:"Take photographs of the crown and temples in the same light and position each time. His memory of how his hair looked is unreliable, and photographs make the 6-to-12-month decision objective."},
         {n:"2", when:"Weeks 2 to 6", title:"Early shedding on minoxidil", html:"Expect and explain this. With finasteride, ask early about mood and sexual function, because the MHRA asks prescribers to monitor after starting."},
         {n:"3", when:"3 to 6 months", title:"Finasteride stabilisation window", html:"The SPC puts stabilisation at 3 to 6 months. Keep asking about mood at each contact."},
         {n:"4", when:"6 to 12 months", title:"Decide whether it is worth it", html:"Compare the photographs. Stable or better means it is working, and it needs to continue indefinitely. If there is no benefit at 12 months, it is reasonable to stop."},
         {n:"5", when:"Any time", title:"Re-think the diagnosis", html:"New patches, scalp symptoms, rapid diffuse shedding or eyebrow loss mean it is not simple pattern loss. Go back to <a href='#redflags'>red flags</a>."}
       ]},
       {b:"say", html:"“Give it six months to a year before you judge it, and let’s take photos today so we can compare. If you choose the tablet, read the card in the box. If you develop depression or suicidal thoughts on the 1 mg tablet, stop it and contact us promptly; if you are at immediate risk, call 999.”"}
     ]},

    {id:"refer", nav:"Refer", title:"Refer", sub:"Most men never need referral. These are the exceptions.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"Expedited dermatology", html:"Suspected active scarring alopecia (loss of follicular openings, perifollicular inflammation, pustules, pain, burning, itch or shiny atrophic skin — state these clearly in the referral), via the local referral pathway. The PCDS emphasises early referral because scarring is irreversible. This is not a two-week-wait cancer referral.", src:"PCDS Hair Loss Pathway 2024"},
         {tone:"blue", h:"Routine dermatology", html:"The diagnosis is uncertain, alopecia areata is extensive or not responding (following the BAD living guideline), or tinea capitis is not responding to treatment. A kerion, marked inflammation, pustules, pain or risk of scarring warrants urgent specialist or paediatric dermatology advice.", src:"BAD alopecia areata living guideline 2025 · BAD tinea capitis guideline 2014"},
         {tone:"red", h:"Same day: suicidal thoughts on finasteride", html:"Stop finasteride 1 mg (MHRA). Same-day suicide-risk assessment is required for any patient reporting suicidal thoughts, regardless of whether finasteride is the suspected cause; escalate to crisis services or 999 according to intent, plan, means, immediate risk and safeguarding concerns. Report a Yellow Card.", src:"MHRA DSU May 2026 · usual suicide-risk practice"},
         {tone:"cream", h:"Not a referral: typical pattern loss", html:"Commissioners do not fund cosmetic treatment of pattern loss, and the drugs are not routinely NHS-prescribable for this. Refer only if the diagnosis is in doubt, not to get treatment.", src:"PCDS male and female pattern alopecia · Drug Tariff Part XVIIIA"},
         {tone:"blue", h:"No suspected cancer pathway", html:"Male pattern hair loss alone is not a NICE NG12 (updated April 2026) suspected-cancer referral criterion. A persistent ulcer, nodule, pigmented lesion or other suspicious scalp lesion should be assessed independently under the relevant skin-cancer pathway.", src:"NICE NG12 (updated April 2026)"}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card. The Casebook holds the full case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 23-year-old man says his hairline is ‘going’ and asks you to prescribe finasteride, because a friend buys it online. He has been checking mirrors a lot, has stopped going to the gym, and his father went bald at 30. On examination there is bitemporal recession and a normal scalp.", src:"PCDS Hair Loss Pathway 2024 · MHRA DSU May 2026"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Examines the scalp and names the pattern. Explores <b>ideas, concerns and expectations</b>, and <b>screens mood</b> (the avoidance behaviour is a cue). Explains kindly that neither drug is routinely NHS-prescribable for uncomplicated pattern loss. Offers minoxidil as a pharmacy option. If he chooses finasteride, covers depression, suicidal thoughts, persistent sexual effects, the alert card, the PSA effect and pregnancy handling. Safety-nets on mood. Arranges a review.", src:"MHRA DSU May 2026 · Drug Tariff Part XVIIIA"},
       {tone:"cream", h:"Common pitfall", html:"Issuing finasteride 5 mg on the NHS to be split, or promising an NHS referral for treatment. Both are wrong, and the split tablets bring a pregnancy-handling risk as well.", src:"Drug Tariff Part XVIIIA · finasteride SPC"},
       {tone:"cream", h:"One-line close", html:"“It’s harmless and you don’t have to treat it. If you do, it’s long-term and private. And if you take the tablet, your mood matters more than your hair.”"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Every figure on this page traces to one of these primary sources.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>Primary Care Dermatology Society — Hair Loss: Primary Care Treatment Pathway (November 2024)<br><a href="https://www.pcds.org.uk/files/general/Hair-Loss-Pathway-web.pdf" rel="noopener">pcds.org.uk — Hair Loss Pathway</a><span class="rd"> — scarring versus non-scarring loss, early referral for scarring alopecia, and the typical timing of telogen effluvium (2 to 6 months after a trigger, settling at 6 to 9 months)</span></li>'+
         '<li>Primary Care Dermatology Society — Male pattern alopecia (androgenetic alopecia) and female pattern alopecia, clinical guidance (web page, accessed Sep 2026)<br><a href="https://www.pcds.org.uk/clinical-guidance/alopecia-male-and-female-pattern-alopecia" rel="noopener">pcds.org.uk</a><span class="rd"> — mechanism, heredity, more than 20% miniaturised hairs, 5% minoxidil twice daily for men, approximate 40% response rate (not complete regrowth), hypertrichosis about 14%, not funded in primary care</span></li>'+
         '<li>Primary Care Dermatology Society — Alopecia: an overview (web page, accessed Sep 2026)<br><a href="https://www.pcds.org.uk/clinical-guidance/alopecia-an-overview" rel="noopener">pcds.org.uk</a><span class="rd"> — FBC, ferritin and thyroid function for diffuse alopecia</span></li>'+
         '<li>British Association of Dermatologists — Patient information leaflet: Hair loss, male pattern (androgenetic alopecia) (updated June 2024)<br><a href="https://www.skinhealthinfo.org.uk/condition/male-pattern-hair-loss/" rel="noopener">skinhealthinfo.org.uk</a><span class="rd"> — minoxidil: early shedding, at least 6 and possibly 12 months before benefit, benefit only while used; finasteride: a year or more to benefit, about 2% reduced libido or erection problems</span></li>'+
         '<li>British Association of Dermatologists — Patient information leaflet: Hair loss, female pattern (October 2024)<br><a href="https://www.skinhealthinfo.org.uk/wp-content/uploads/2018/11/Hair-loss-female-pattern-PIL-Oct-24.pdf" rel="noopener">skinhealthinfo.org.uk</a><span class="rd"> — statement on low-dose oral minoxidil</span></li>'+
         '<li>British Association of Dermatologists — Patient information leaflet: Telogen effluvium (October 2025)<br><a href="https://www.bad.org.uk/patient-information-leaflets" rel="noopener">bad.org.uk</a></li>'+
         '<li>Harries MJ et al. — British Association of Dermatologists living guideline for managing people with alopecia areata 2025. Br J Dermatol 2026;194(2):e56–e73<br><a href="https://doi.org/10.1093/bjd/ljaf452" rel="noopener">doi.org/10.1093/bjd/ljaf452</a><span class="rd"> — the differential diagnosis and when to refer alopecia areata</span></li>'+
         '<li>Fuller LC et al. — British Association of Dermatologists’ guidelines for the management of tinea capitis 2014. Br J Dermatol 2014;171(3):454–463<br><a href="https://onlinelibrary.wiley.com/doi/10.1111/bjd.13196" rel="noopener">doi:10.1111/bjd.13196</a></li>'+
         '<li>MHRA Drug Safety Update — Finasteride and dutasteride: updated safety warnings for psychiatric side effects and sexual dysfunction (11 May 2026)<br><a href="https://www.gov.uk/drug-safety-update/finasteride-and-dutasteride-updated-safety-warnings-for-psychiatric-side-effects-and-sexual-dysfunction" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> — ask about a history of depression or suicidal ideation before prescribing, inform patients of the risks, the patient card, monitoring after starting, stop finasteride 1 mg if depression or suicidal thoughts develop (finasteride 5 mg or dutasteride: contact a healthcare professional promptly), effects may persist after stopping</span></li>'+
         '<li>MHRA Drug Safety Update — Finasteride: reminder of the risk of psychiatric side effects and of sexual side effects, which may persist after discontinuation of treatment (April 2024)<br><a href="https://www.gov.uk/drug-safety-update/finasteride-reminder-of-the-risk-psychiatric-side-effects-and-of-sexual-side-effects-which-may-persist-after-discontinuation-of-treatment" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> — introduction of the patient alert card; ask about depression and suicidal ideation before prescribing; 281 psychiatric and 426 sexual-dysfunction Yellow Card reports up to 5 April 2024</span></li>'+
         '<li>Finasteride 1 mg tablets (Propecia) — Summary of Product Characteristics (emc)<br><a href="https://www.medicines.org.uk/emc/product/2194/smpc" rel="noopener">medicines.org.uk/emc/product/2194</a><span class="rd"> — 1 mg daily; 3 to 6 months to stabilisation; reverses by 6 months and returns to baseline by 9 to 12 months after stopping; PSA lowered (consider doubling); breast changes; handling of crushed tablets; not indicated in women or children; licensed age range 18 to 41</span></li>'+
         '<li>Regaine for Men Extra Strength Scalp Solution 5% — SPC (emc 5765)<br><a href="https://www.medicines.org.uk/emc/product/5765/smpc" rel="noopener">medicines.org.uk/emc/product/5765</a><span class="rd"> — 1 ml twice daily, maximum 2 ml a day, men aged 18 to 49; results after 2 to 4 months; increased shedding may occur initially; exclusions; systemic symptoms that mean stopping</span></li>'+
         '<li>Regaine for Men 5% Scalp Foam — SPC (emc 5781)<br><a href="https://www.medicines.org.uk/emc/product/5781/smpc" rel="noopener">medicines.org.uk/emc/product/5781</a><span class="rd"> — foam-specific application quantity, instructions and age range</span></li>'+
         '<li>Minoxidil tablets — SPC (emc 13821)<br><a href="https://www.medicines.org.uk/emc/product/13821/smpc" rel="noopener">medicines.org.uk/emc/product/13821</a><span class="rd"> — licensed for severe hypertension only</span></li>'+
         '<li>Vañó-Galván S et al. — Safety of low-dose oral minoxidil for hair loss: a multicenter study of 1404 patients. J Am Acad Dermatol 2021;84(6):1644–1651 (international)<br><a href="https://pubmed.ncbi.nlm.nih.gov/33639244/" rel="noopener">PubMed 33639244</a></li>'+
         '<li>NHS Drug Tariff, Part XVIIIA — Drugs, medicines and other substances not to be ordered under a General Medical Services contract (current edition, Sep 2026)<br><a href="https://www.nhsbsa.nhs.uk/pharmacies-gp-practices-and-appliance-contractors/drug-tariff" rel="noopener">nhsbsa.nhs.uk/drug-tariff</a><span class="rd"> — finasteride 1 mg tablets; minoxidil cream, lotion, ointment and solution</span></li>'+
         '<li>Greater Manchester Medicines Management Group — Recommendations from the September 2022 meeting; Greater Manchester Joint Formulary section 13.9<br><a href="https://gmmmg.nhs.uk/wp-content/uploads/2022/11/GMMMG-recommendations-from-September-2022-for-ICB-approval-fnl.pdf" rel="noopener">gmmmg.nhs.uk</a><span class="rd"> — minoxidil foam added to do-not-prescribe; other minoxidil preparations in Part XVIIIA</span></li>'+
         '<li>Greater Manchester Joint Formulary — section 13.9 (local formulary; check the current version)<br><a href="https://gmmmg.nhs.uk/" rel="noopener">gmmmg.nhs.uk</a></li>'+
         '<li>NICE NG12 — Suspected cancer: recognition and referral (updated April 2026)<br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — checked: no criterion applies to hair loss; suspicious scalp lesions are assessed under the skin-cancer recommendations</span></li>'+
         '<li>BNF — finasteride, minoxidil<br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a></li>'+
         '</ul></div>'}
     ]}

  foot:"Male pattern hair loss in primary care. Sources: PCDS Hair Loss Pathway (2024) and PCDS clinical guidance; BAD patient leaflets and the BAD alopecia areata living guideline (2025); MHRA Drug Safety Updates on finasteride (April 2024, May 2026); finasteride and minoxidil SPCs; NHS Drug Tariff Part XVIIIA; GMMMG (2022). Check doses in the current BNF and SPC. This page does not replace clinical judgement."
