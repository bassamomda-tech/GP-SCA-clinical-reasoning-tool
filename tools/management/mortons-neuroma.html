<script>
MG.render({
  icon:"🦶",
  title:"Morton's Neuroma",
  eyebrow:"Protocol · assess and manage in one place",
  stemTitle:"A squeeze-test diagnosis: offload the forefoot first, inject second, cut last",
  stemSub:"Burning or electric pain in the forefoot shooting into two adjacent toes, eased by taking the shoe off, is an interdigital (Morton’s) neuroma until proven otherwise. The diagnosis is clinical and imaging is rarely required. Treatment is staged: wide low-heeled footwear and metatarsal offloading, then a steroid and local anaesthetic injection (best ultrasound-guided), then a specialist opinion on neurectomy or ablation. The skill is spotting the few feet that are something else: a growing lump, inflamed joints, a stress fracture or a neuropathy. Sources: Bennett et al 1995 · Pastides et al 2012 · Mahadevan et al 2015 · Thomson et al 2013 · Cochrane 2024 · NICE HTG394 and HTG652 · NICE NG12 (updated April 2026).",
  guideline:"NICE HTG394 (formerly IPG539, 2015) · NICE HTG652 (formerly IPG747, 2023) · Cochrane (Matthews et al 2024) · NICE NG12 (updated April 2026)",
  meta:[
    {t:"NICE HTG394 · RFA (IPG539, 2015)"},
    {t:"NICE HTG652 · cryoablation (IPG747, 2023)"},
    {t:"Cochrane 2024 · Thomson et al JBJS 2013"},
    {t:"2WW · NICE NG12 soft tissue sarcoma", tone:"tw"}
  ],
  lead:"<div class='mg-layers'><a href='#recognise'><b>Recognise</b><small>squeeze test, web space</small></a><a href='#redflags'><b>Rule out</b><small>lump, synovitis, fracture</small></a><a href='#conservative'><b>Offload</b><small>shoes and metatarsal pad</small></a><a href='#refer'><b>Escalate</b><small>injection, then surgeon</small></a></div>",
  quickSub:"The six things that decide what happens in this consultation. Each figure is traced to a named source under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"blue", h:"The history and one squeeze make the diagnosis", html:"Forefoot pain on weight-bearing, often burning, radiating into two adjacent toes (most often the 3rd/4th space), with numbness or a “pebble in the shoe” feeling, relieved by removing the shoe. In a surgical series, <b>clinical assessment alone had a sensitivity of 98%</b>, higher than ultrasound (90%) or MRI (88%), and the authors concluded imaging is not routinely needed. <b>Tenderness on direct palpation of the web space was present in every case.</b>", src:"Pastides et al, Foot Ankle Surg 2012"},
    {tone:"blue", h:"The thumb–index squeeze beats Mulder’s click", html:"Pinching the affected intermetatarsal space between thumb and index finger reproduced the pain with <b>96% sensitivity</b>, against <b>61% for Mulder’s click</b>, in 54 feet later confirmed on ultrasound. A missing click does not exclude a neuroma.", src:"Mahadevan et al, J Foot Ankle Surg 2015"},
    {tone:"green", h:"Most feet settle without an operation", html:"In a staged programme (education, footwear and metatarsal relief, then injection, then excision) <b>85% of 115 patients felt improved</b>; only <b>21% went on to surgery</b>, and 96% of those were satisfied. Start with shoes and a pad, and set expectations accordingly.", src:"Bennett et al, Foot Ankle Int 1995"},
    {tone:"cream", h:"Injection helps some, briefly, and guidance matters", html:"Methylprednisolone 40 mg with lidocaine improved patient-rated foot health at 3 months more than lidocaine alone in a blinded RCT of 131 people. The 2024 Cochrane review is more cautious: steroid plus anaesthetic may make little difference to pain at 3–6 months versus anaesthetic alone (low certainty), but <b>ultrasound-guided injection probably beats a blind injection</b> at 6 months (moderate certainty).", src:"Thomson et al, J Bone Joint Surg Am 2013 · Cochrane (Matthews et al) 2024"},
    {tone:"amber", h:"Ablation is not a routine alternative to surgery", html:"Radiofrequency ablation for Morton’s neuroma is allowed only with <b>special arrangements for clinical governance, consent and audit or research</b> (NICE HTG394, formerly IPG539). Image-guided cryoablation of a peripheral neuroma should be used <b>only in research</b> (NICE HTG652, formerly IPG747). Counsel accordingly if a patient asks for it by name.", src:"NICE HTG394 (2015) · NICE HTG652 (2023)"},
    {tone:"purple", h:"A forefoot lump that is growing is not a neuroma", html:"A neuroma is not a palpable, enlarging mass. For an adult with an <b>unexplained lump that is increasing in size</b>, NICE NG12 advises considering an <b>urgent direct access ultrasound scan (within 2 weeks)</b> to assess for soft tissue sarcoma; for a child or young person, a very urgent scan within 48 hours.", src:"NICE NG12 (updated April 2026)"}
  ],
  pathwaySub:"Five moves. The red one is where a sarcoma, an inflammatory arthritis or a fracture gets filed as a neuroma.",
  pathway:[
    {title:"Screen out what it is not", html:"A <b>palpable or growing lump</b> (sarcoma pathway), <b>swollen, warm or stiff MTP joints</b> or several affected joints (inflammatory arthritis), <b>bony point tenderness after a rise in activity</b> (stress fracture), <b>constant pain at rest or at night</b>, <b>glove-and-stocking sensory loss</b> (neuropathy), or a hot red foot (infection, gout, Charcot in diabetes). Any of these changes the destination.", alert:true},
    {title:"Confirm clinically in two minutes", html:"Ask where the pain goes (two adjacent toes), what makes it worse (tight or high-heeled shoes, prolonged walking) and what eases it (shoe off, rubbing the foot). Examine: <b>web-space tenderness</b>, the <b>thumb–index squeeze</b> (96% sensitive), Mulder’s click (61%), and reduced sensation on the facing sides of the two toes. Imaging is not routinely needed when the picture is typical."},
    {title:"Offload for 6–12 weeks", html:"<b>Wide, soft, low-heeled shoes with a deep toe box</b>; a <b>metatarsal pad or dome placed just behind the metatarsal heads</b>; activity modification; simple analgesia or a topical NSAID. Refer to podiatry or orthotics for a metatarsal dome orthosis if an off-the-shelf pad fails."},
    {title:"Persistent? Inject, ideally under ultrasound", html:"A steroid with local anaesthetic into the affected web space, <b>ultrasound-guided where available</b>, by a clinician trained in the technique (MSK service, podiatry or sports medicine in many areas). Counsel on fat-pad atrophy, skin thinning or depigmentation and transient glucose rise in diabetes. Benefit is often temporary."},
    {title:"Still disabling? Surgical opinion", html:"Refer to orthopaedic foot and ankle or podiatric surgery for <b>neurectomy</b> (with expected permanent numbness of the adjacent toe surfaces and a small risk of a painful stump neuroma). Ablation techniques are offered only under the arrangements set by NICE HTG394 and HTG652. Check your ICB’s commissioning policy, which may require documented conservative care first."}
  ],
  sections:[
    {id:"recognise", nav:"Recognise", title:"What it is and how it presents", sub:"Not a true tumour: a thickened, fibrosed common plantar digital nerve, compressed under the deep transverse intermetatarsal ligament as it runs between two metatarsal heads.",
     blocks:[
       {b:"table", head:["Feature","What you hear or find","Why it matters"], rows:[
         ["<b>Site</b>","Most commonly the <b>3rd intermetatarsal space</b> (between the 3rd and 4th toes), then the 2nd; two neuromas in one foot or bilateral disease occur","Pain between the 1st and 2nd or 4th and 5th toes is atypical: think joint or bone first"],
         ["<b>Pain</b>","Burning, sharp or electric pain in the ball of the foot, radiating into two adjacent toes; “walking on a marble” or a folded sock","Pain on weight-bearing (91%) and relief with rest (81%) were the commonest features in a surgical series"],
         ["<b>Sensory change</b>","Tingling or numbness on the facing sides of the two toes","A whole-foot or stocking distribution points to neuropathy or tarsal tunnel, not a neuroma"],
         ["<b>Triggers and relief</b>","Worse in narrow, pointed or high-heeled shoes, with standing and on hard floors; eased by taking the shoe off and rubbing the forefoot","Footwear-dependence is the clue that offloading will work"],
         ["<b>Who</b>","Typically middle-aged adults and more often women, in keeping with footwear","Children with forefoot pain need a different differential (Freiberg’s, fracture, growth-plate)"],
         ["<b>What is absent</b>","No visible swelling, no warmth, no joint effusion, no palpable mass","Any of these = a different diagnosis until proven otherwise"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Clinical diagnosis outperforms imaging", html:"In 43 surgically excised neuromas, clinical assessment identified 42 (98% sensitivity); ultrasound found 28 of 31 (90%) and MRI 14 of 16 (88%). Direct web-space tenderness was universal. The authors concluded that <b>there is no absolute requirement to image a patient who clinically has a Morton’s neuroma</b>.", src:"Pastides et al, Foot Ankle Surg 2012"},
         {tone:"blue", h:"Which bedside test to trust", html:"Against ultrasound confirmation, the <b>thumb–index finger squeeze</b> of the affected space had 96% sensitivity and 96% accuracy; <b>Mulder’s click</b> had 61% sensitivity and 62% accuracy. Ultrasound confirmed the neuroma at the clinically chosen site in 53 of 54 feet (98%).", src:"Mahadevan et al, J Foot Ankle Surg 2015"}
       ]},
       {b:"why", html:"Mulder’s click is the sign everyone remembers, but it is felt in only about 6 in 10 feet with a neuroma. The thumb–index squeeze, pressing directly into the interspace from above and below, reproduces the patient’s own pain in nearly all. Use the squeeze to make the diagnosis and treat a click as a bonus."}
     ]},

    {id:"examine", nav:"Examine", title:"A focused forefoot examination", sub:"Look, feel, squeeze, then examine the joints and the nerves: the last two steps are where mimics are caught.",
     blocks:[
       {b:"table", head:["Step","How","Interpretation"], rows:[
         ["<b>Look (standing and walking)</b>","Toe alignment (a splaying “V” between two toes), callus under the metatarsal heads, hallux valgus, pes cavus or planus, swelling","Toe splay or a dorsal swelling suggests MTP synovitis or plantar plate injury rather than a neuroma"],
         ["<b>Web-space palpation</b>","Press firmly into each interspace from the plantar side, just distal to the metatarsal heads","Focal tenderness in one interspace supports a neuroma"],
         ["<b>Thumb–index squeeze</b>","Pinch the interspace between thumb (plantar) and index finger (dorsal)","Reproduces the patient’s pain: 96% sensitive in one ultrasound-referenced study"],
         ["<b>Mulder’s test</b>","Squeeze the metatarsal heads together from the sides with one hand while pressing the interspace with the other","A palpable, sometimes audible click with pain: supportive, but absent in about 4 in 10"],
         ["<b>MTP joints</b>","Palpate each joint line; move each toe; the vertical stress (drawer) test for plantar plate instability","Joint-line tenderness, effusion or instability = synovitis or plantar plate injury, not a neuroma"],
         ["<b>Bone</b>","Palpate metatarsal shafts and heads, especially the 2nd and 3rd","Point tenderness on the shaft after increased activity = stress fracture; tenderness over the 2nd metatarsal head in an adolescent = Freiberg’s"],
         ["<b>Neurology and pulses</b>","Light touch in the web space and across the foot; monofilament and pulses if diabetic; Tinel’s behind the medial malleolus","Stocking loss = neuropathy; positive Tinel’s at the ankle = tarsal tunnel; absent pulses change footwear and injection decisions"]
       ]},
       {b:"say", html:"“The squeeze I just did between my thumb and finger brought on exactly your pain. That tells me it is the small nerve running between those two toes that is irritated, rather than a joint or a bone problem.”"}
     ]},

    {id:"redflags", nav:"Red flags", title:"Red flags and mimics: what must not be labelled a neuroma", sub:"Morton’s neuroma never causes a growing visible lump, warm swollen joints or constant night pain. These findings redirect the pathway.",
     blocks:[
       {b:"cards", items:[
         {tone:"purple", h:"Soft tissue sarcoma: unexplained lump increasing in size <span class='tw'>2WW</span>", html:"NICE NG12: <b>consider an urgent direct access ultrasound scan (to be performed within 2 weeks)</b> to assess for soft tissue sarcoma in adults with an unexplained lump that is increasing in size. <b>Consider a suspected cancer pathway referral</b> (for an appointment within 2 weeks) if the ultrasound findings suggest soft tissue sarcoma, or if they are uncertain and clinical concern persists. In children and young people with an unexplained lump that is increasing in size, consider a <b>very urgent direct access ultrasound scan (within 48 hours)</b>, and a <b>very urgent referral (appointment within 48 hours)</b> if the scan suggests soft tissue sarcoma or is uncertain with persisting clinical concern.", src:"NICE NG12 (updated April 2026)"},
         {tone:"purple", h:"Bone sarcoma: unexplained bone pain or swelling <span class='tw'>2WW</span>", html:"NICE NG12: in children and young people with <b>unexplained bone swelling or pain</b>, consider a <b>very urgent direct access X-ray (within 48 hours)</b> to assess for bone sarcoma. If an <b>X-ray suggests the possibility of bone sarcoma</b>: in children and young people consider a <b>very urgent referral (appointment within 48 hours)</b>; in adults consider a <b>suspected cancer pathway referral (appointment within 2 weeks)</b>.", src:"NICE NG12 (updated April 2026)"},
         {tone:"red", h:"Hot, red, swollen foot", html:"Cellulitis, septic arthritis, acute gout or, in a person with diabetes and neuropathy, <b>active Charcot foot</b>. Same-day assessment; in diabetes follow the local diabetic foot pathway (NICE NG19) rather than a forefoot pain pathway.", src:"NICE NG19 (diabetic foot)"},
         {tone:"amber", h:"Swollen or tender small joints of the foot", html:"Metatarsophalangeal synovitis, especially in more than one joint or both feet, with early-morning stiffness: suspected inflammatory arthritis. NICE NG100 advises <b>urgent referral</b> for suspected persistent synovitis when the small joints of the hands or feet are affected, even with normal inflammatory markers or negative antibodies.", src:"NICE NG100 (rheumatoid arthritis, 2018)"},
         {tone:"amber", h:"Point bone tenderness after more walking or running", html:"A metatarsal stress fracture (commonest in the 2nd and 3rd shafts) can mimic a neuroma early. Early X-ray may be normal; offload and re-image, or arrange MRI via MSK services, if clinical suspicion persists."},
         {tone:"amber", h:"Sensory loss beyond two toes", html:"Numbness across the sole or in a stocking distribution suggests peripheral neuropathy (check HbA1c, B12, alcohol history) or tarsal tunnel syndrome. In diabetes, a neuropathic foot needs annual foot risk assessment and protective footwear; steroid injection is a relative caution.", src:"NICE NG19 (diabetic foot)"}
       ]},
       {b:"table", head:["Mimic","Distinguishing features"], rows:[
         ["<b>MTP synovitis / plantar plate tear</b>","Tenderness over the joint line under the 2nd MTP, dorsal swelling, toe drifting or crossing over, positive drawer test"],
         ["<b>Freiberg’s infraction</b>","Adolescent or young adult, pain and swelling over the 2nd metatarsal head, stiff joint; X-ray shows flattening of the head"],
         ["<b>Metatarsalgia (mechanical)</b>","Pain under the metatarsal heads with callus, no radiation into toes, no web-space tenderness"],
         ["<b>Intermetatarsal bursitis</b>","Can coexist with or mimic a neuroma; dorsal fullness; distinguished on ultrasound"],
         ["<b>Tarsal tunnel syndrome</b>","Burning over the sole and medial heel, positive Tinel’s behind the medial malleolus"],
         ["<b>Lumbar radiculopathy (S1)</b>","Back or buttock pain, dermatomal sensory loss, reflex change"]
       ]},
       {b:"why", html:"The commonest error is treating a mechanical or inflammatory joint problem as a neuroma. A neuroma causes pain in the <b>space between</b> the metatarsal heads; synovitis and plantar plate injury cause pain <b>over the joint</b> with swelling. Taking thirty seconds to press each joint line separately prevents a year of the wrong injections."}
     ]},

    {id:"imaging", nav:"Imaging", title:"When imaging adds something", sub:"A typical story with a positive squeeze test does not need a scan before conservative treatment. Imaging earns its place when the diagnosis is uncertain or before an intervention.",
     blocks:[
       {b:"table", head:["Situation","Test","Why"], rows:[
         ["Typical features, first presentation","<b>None</b>","Clinical sensitivity 98%; imaging does not change first-line offloading (Pastides et al 2012)"],
         ["Diagnostic doubt, atypical space, or two adjacent spaces symptomatic","<b>Ultrasound</b> (dynamic, with sonographic Mulder’s manoeuvre) via MSK radiology or the MSK service","Confirms the neuroma and detects bursitis, synovitis or plantar plate tear"],
         ["Before injection or surgery","Ultrasound (guides the needle; confirms the level)","Ultrasound-guided injection probably outperforms blind injection (Cochrane 2024)"],
         ["Bone tenderness, suspected fracture, Freiberg’s, arthritis","<b>Weight-bearing X-ray</b> of the foot","Neuromas are invisible on X-ray; X-ray finds the mimics"],
         ["Growing or palpable lump","Urgent direct access ultrasound (within 2 weeks)","NICE NG12 soft tissue sarcoma criterion"],
         ["Equivocal ultrasound, surgical planning","MRI (usually specialist-requested)","Similar sensitivity to ultrasound (88% vs 90% in Pastides et al)"]
       ]},
       {b:"warn", html:"Ultrasound frequently shows small asymptomatic interdigital neuromas. <b>A scan finding without matching symptoms and a positive squeeze test is not an indication to treat.</b> Treat the patient, not the report."}
     ]},

    {id:"conservative", nav:"Offloading", title:"First-line: footwear, offloading and analgesia", sub:"The first stage in every staged programme, and for many people the only stage they need.",
     blocks:[
       {b:"tiles", v:"life", items:[
         {t:"👟 Footwear", html:"Wide, deep toe box; soft, cushioned sole; <b>low heel</b> (high heels load the forefoot and dorsiflex the toes, stretching the nerve). Lace-up shoes allow the forefoot to spread. Avoid narrow pointed shoes, and thin-soled shoes on hard floors."},
         {t:"🦶 Metatarsal pad or dome", html:"A small felt or gel pad placed <b>just proximal to the metatarsal heads</b> (not under them) spreads the heads and lifts pressure off the interspace. Getting the position right matters: pain under the pad means it is too far forward."},
         {t:"🩴 Orthoses", html:"Podiatry or orthotics can provide a <b>metatarsal dome orthosis</b> or a custom insole if an off-the-shelf pad fails; address associated flat foot or cavus foot."},
         {t:"🏃 Activity", html:"Swap high-impact running and prolonged standing for cycling or swimming during a flare; weight reduction reduces forefoot load."},
         {t:"💊 Analgesia", html:"Paracetamol or a topical or short oral NSAID for flares, dose per BNF. Neuropathic agents are not established for Morton’s neuroma and are best left to specialist pain services."},
         {t:"⏱️ How long", html:"Review at <b>6–12 weeks</b>. If there is partial improvement, keep going; if there is none despite correct footwear and pad position, move to the next stage."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"What the staged approach achieved", html:"In 115 patients treated first with education, footwear change and metatarsal relief, then injection, then surgery: <b>97 (85%) considered themselves improved</b> and <b>24 (21%) needed excision</b>, of whom 23 (96%) had a satisfactory result.", src:"Bennett et al, Foot Ankle Int 1995"},
         {tone:"cream", h:"The evidence base is thin, so be honest", html:"The original Cochrane review found <b>little randomised evidence</b> for insoles and none for steroid injection; the 2024 update still concludes that few trials exist and that the effectiveness of most interventions on pain, function and satisfaction remains unconfirmed. Offloading is first because it is cheap and harmless, not because it is proven.", src:"Cochrane (Thomson et al 2004; Matthews et al 2024)"},
         {tone:"cream", h:"Commissioning pathways expect this stage to be documented", html:"ICB policies for Morton’s neuroma surgery typically expect footwear modification, metatarsal pads and a trial of a metatarsal dome orthosis before a surgical opinion. For example, Cheshire and Merseyside ICB policy CMICB_Clin032 (April 2023) lists careful footwear selection, an NSAID trial if appropriate, metatarsal pads and orthotist referral, with the specialist deciding on injection, ablation or surgery. Check your own ICB’s policy."}
       ]},
       {b:"say", html:"“The nerve is getting pinched between two bones every time you push off. A wider, lower shoe and a small pad just behind the ball of the foot spread those bones apart. It sounds too simple, but most people improve with this alone, so give it a proper six to twelve weeks.”"}
     ]},

    {id:"injection", nav:"Injection", title:"Second-line: steroid and local anaesthetic injection", sub:"Reasonable for persistent symptoms after offloading. The evidence supports a modest, often temporary benefit, and a better result under ultrasound guidance.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"The pivotal UK trial", html:"131 adults (mean age 53, 85% women) were randomised to an ultrasound-guided injection of <b>methylprednisolone 40 mg with lidocaine</b> or lidocaine alone. Patient-rated foot health at 3 months was significantly better with steroid (p=0.002).", src:"Thomson et al, J Bone Joint Surg Am 2013"},
         {tone:"blue", h:"The pooled evidence", html:"Steroid plus anaesthetic <b>may result in little to no difference in pain</b> at 3–6 months versus anaesthetic alone (low certainty; below the minimum important difference). <b>Ultrasound-guided</b> steroid injection <b>probably reduces pain and improves function at 6 months</b> compared with a non-guided injection (moderate certainty).", src:"Cochrane (Matthews et al) 2024"}
       ]},
       {b:"table", head:["Counselling point","What to say"], rows:[
         ["<b>Who gives it</b>","A clinician trained in forefoot injection, ideally under ultrasound: MSK interface service, podiatry, sports medicine or radiology, depending on local pathways"],
         ["<b>Benefit</b>","Often relief for weeks to months; some people settle fully, many relapse. A trial of injection also helps confirm the source of pain"],
         ["<b>Local risks</b>","Plantar fat-pad atrophy (a thinner, more painful cushion), skin thinning or depigmentation, and, with repeated injections, weakening of the plantar plate with toe deviation"],
         ["<b>Systemic effects</b>","Transient rise in blood glucose in diabetes for a few days; facial flushing; rarely infection"],
         ["<b>How many</b>","Repeated injections are usually limited because of cumulative soft-tissue harm; persistent or recurrent pain after injection is the usual trigger for a surgical opinion"],
         ["<b>Other injectables</b>","Alcohol sclerosant injections are used in some centres; evidence is limited to case series and they are a specialist decision"]
       ]},
       {b:"why", html:"The trial and the review are not contradictory. The trial’s primary outcome was global foot health, not pain score, and every injection was ultrasound-guided; the review pooled pain outcomes across trials and found the guided technique mattered more than the steroid. Practically: if you are going to inject, get it done under ultrasound by someone who does it often."}
     ]},

    {id:"procedures", nav:"Surgery and ablation", title:"Third-line: neurectomy and ablative procedures", sub:"For persistent, disabling pain despite footwear, offloading and injection. These are specialist decisions; the GP’s role is to refer at the right time and to counsel accurately.",
     blocks:[
       {b:"cards", items:[
         {tone:"cream", h:"Neurectomy (excision)", html:"The established definitive option: the affected nerve is excised, usually through a dorsal incision. In the staged series, 96% of those who needed excision were satisfied. Expect <b>permanent numbness</b> of the facing sides of the two toes; risks include wound problems, a painful <b>stump neuroma</b> and recurrence. Low-certainty evidence shows little to no difference in satisfaction between plantar and dorsal approaches.", src:"Bennett et al, Foot Ankle Int 1995 · Cochrane (Matthews et al) 2024"},
         {tone:"cream", h:"Decompression", html:"Division of the deep transverse intermetatarsal ligament to free the nerve rather than remove it. Offered by some surgeons, with the aim of preserving sensation; the choice between decompression and excision is a surgical one."},
         {tone:"amber", h:"Radiofrequency ablation: special arrangements only", html:"NICE HTG394: current evidence raises no major safety concerns, but efficacy evidence is <b>limited in quantity and quality</b>, so the procedure should only be used with <b>special arrangements for clinical governance, consent and audit or research</b>. Originally IPG539 (December 2015), now HealthTech guidance HTG394 with the recommendation unchanged.", src:"NICE HTG394 (formerly IPG539, 2015)"},
         {tone:"amber", h:"Cryoablation: research only", html:"NICE HTG652: evidence on percutaneous image-guided cryoablation of peripheral neuroma for chronic pain is <b>inadequate in quality and quantity</b>, so it should <b>only be used in the context of research</b>, preferably randomised trials for Morton’s neuroma. Originally IPG747 (January 2023), now HTG652.", src:"NICE HTG652 (formerly IPG747, 2023)"}
       ]},
       {b:"say", html:"“If the pain carries on despite the shoes, the pad and an injection, a foot surgeon can remove the nerve. That usually works well, but it leaves a permanent numb patch between those two toes, which most people barely notice. Newer ‘freezing’ or ‘heat’ treatments exist, but they are still being evaluated and are only offered in special circumstances.”"}
     ]},

    {id:"followup", nav:"Follow-up", title:"Review points and safety-netting", sub:"A clear timetable stops patients drifting between shoe shops and repeat appointments.",
     blocks:[
       {b:"timeline", items:[
         {n:"1", when:"Day 0", title:"Diagnose and offload", html:"Clinical diagnosis, mimics excluded, footwear and metatarsal pad explained (show where the pad goes), analgesia, leaflet. Podiatry referral where local pathways allow direct access."},
         {n:"2", when:"6–12 weeks", title:"Judge the response", html:"Improving: continue, and consider a custom orthosis. No change despite correct footwear: arrange injection (ideally ultrasound-guided) via the local MSK, podiatry or radiology route."},
         {n:"3", when:"After injection", title:"Watch the trajectory", html:"Sustained relief: stop there. Short-lived relief or no relief: refer for a surgical opinion, sending the conservative history your ICB policy requires."},
         {n:"4", when:"Any time", title:"Re-think the diagnosis", html:"A new lump, joint swelling, pain at rest or at night, or spreading numbness means re-examine and follow the red-flag section."}
       ]},
       {b:"tiles", v:"safety", items:[
         {t:"🔴 Come back same day", html:"The foot becomes hot, red and swollen, or you feel feverish, especially if you have diabetes or after an injection."},
         {t:"🟠 Book a review", html:"You notice a lump in the foot that is getting bigger, a joint in the foot swells, the pain is there at rest or wakes you at night, or numbness spreads across the foot."},
         {t:"🟢 Expected", html:"Improvement over weeks, not days, once shoes and pad are right; occasional flares in tighter footwear."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer: who, where and how fast", sub:"Most referrals are routine and follow a documented trial of conservative care. The purple card is the exception that cannot wait.",
     blocks:[
       {b:"cards", items:[
         {tone:"purple", h:"Suspected cancer pathway: soft tissue or bone sarcoma <span class='tw'>2WW</span>", html:"<b>Adults:</b> unexplained lump that is increasing in size → consider an <b>urgent direct access ultrasound scan within 2 weeks</b>; if ultrasound suggests soft tissue sarcoma, or is uncertain with ongoing clinical concern → consider a <b>suspected cancer pathway referral (appointment within 2 weeks)</b>. X-ray suggesting bone sarcoma → consider a suspected cancer pathway referral. <b>Children and young people:</b> unexplained lump that is increasing in size → consider a <b>very urgent direct access ultrasound within 48 hours</b>; unexplained bone swelling or pain → consider a <b>very urgent direct access X-ray within 48 hours</b>; ultrasound suggestive of (or uncertain for) soft tissue sarcoma with persisting concern, or X-ray suggesting bone sarcoma → consider a <b>very urgent referral (appointment within 48 hours)</b>.", src:"NICE NG12 (updated April 2026)"},
         {tone:"red", h:"Same day", html:"Suspected infection, septic arthritis or active Charcot foot in diabetes (multidisciplinary foot service per local pathway).", src:"NICE NG19 (diabetic foot)"},
         {tone:"amber", h:"Urgent rheumatology", html:"Suspected persistent synovitis affecting the small joints of the feet.", src:"NICE NG100 (2018)"},
         {tone:"cream", h:"Podiatry or orthotics", html:"Footwear assessment, pad placement and a metatarsal dome or custom orthosis when an off-the-shelf pad has not helped.", src:"Bennett et al, Foot Ankle Int 1995 (stage 1: metatarsal relief)"},
         {tone:"cream", h:"MSK service or radiology for injection", html:"Persistent symptoms after 6–12 weeks of correct offloading: ultrasound-guided steroid and local anaesthetic injection.", src:"Cochrane (Matthews et al) 2024"},
         {tone:"cream", h:"Orthopaedic foot and ankle or podiatric surgery", html:"Disabling pain persisting after conservative care and injection, or diagnostic uncertainty needing specialist imaging. Include duration, footwear and orthosis tried, injection dates and response, and the impact on work and walking.", src:"Bennett et al, Foot Ankle Int 1995"}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only: the Casebook holds the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 48-year-old office manager has eight months of burning pain in the left forefoot shooting into her 3rd and 4th toes, worse in the heeled shoes she wears for work and at the end of the day. She has read online about “nerve freezing” and wants a referral for it. She has type 2 diabetes. Examination: tender 3rd web space, positive squeeze test, no click, no joint swelling, pulses and monofilament normal.", src:"Mahadevan et al, J Foot Ankle Surg 2015 (examination findings)"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Makes a clinical diagnosis without reflexively ordering a scan; <b>examines the MTP joints and asks about lumps</b> to exclude mimics; explores the work-footwear conflict and agrees a practical plan (work shoes, pad position); explains honestly that cryoablation is currently <b>research-only</b> and why; covers diabetes-specific injection counselling (glucose rise, infection risk); sets a 6–12 week review with a clear next step; safety-nets for a growing lump or hot swollen foot.", src:"NICE HTG652 (2023) · NICE NG12 (updated April 2026)"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Every figure on this page is traceable to a named primary source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE HTG394 (formerly IPG539), Radiofrequency ablation for symptomatic interdigital (Morton’s) neuroma (December 2015)</b><br><a href="https://www.nice.org.uk/guidance/htg394" rel="noopener">nice.org.uk/guidance/htg394</a><span class="rd"> — no major safety concerns; efficacy evidence limited; special arrangements for clinical governance, consent and audit or research</span></li>'+
         '<li><b>NICE HTG652 (formerly IPG747), Percutaneous image-guided cryoablation of peripheral neuroma for chronic pain (January 2023)</b><br><a href="https://www.nice.org.uk/guidance/htg652" rel="noopener">nice.org.uk/guidance/htg652</a><span class="rd"> — evidence inadequate; research only; randomised trials preferred for Morton’s neuroma</span></li>'+
         '<li><b>NICE NG12, Suspected cancer: recognition and referral (2015, updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — sarcoma criteria: urgent direct access ultrasound within 2 weeks for an adult’s unexplained enlarging lump; suspected cancer pathway referral on suggestive or uncertain ultrasound, or on X-ray suggesting bone sarcoma; 48-hour direct access imaging and 48-hour very urgent referral in children and young people</span></li>'+
         '<li><b>NICE NG100, Rheumatoid arthritis in adults (2018)</b><br><a href="https://www.nice.org.uk/guidance/ng100" rel="noopener">nice.org.uk/guidance/ng100</a><span class="rd"> — urgent referral for suspected persistent synovitis of the small joints of the hands or feet</span></li>'+
         '<li><b>NICE NG19, Diabetic foot problems (2015, updated)</b><br><a href="https://www.nice.org.uk/guidance/ng19" rel="noopener">nice.org.uk/guidance/ng19</a><span class="rd"> — foot risk assessment, active Charcot and acute diabetic foot pathways</span></li>'+
         '<li><b>Matthews BG et al, Treatments for Morton’s neuroma. Cochrane Database Syst Rev 2024 (CD014687)</b><br><a href="https://www.cochranelibrary.com/cdsr/doi/10.1002/14651858.CD014687.pub2" rel="noopener">cochranelibrary.com CD014687</a><span class="rd"> — steroid plus anaesthetic vs anaesthetic: little to no difference in pain at 3–6 months (low certainty); ultrasound-guided vs blind injection: probably less pain and better function at 6 months (moderate certainty); plantar vs dorsal neurectomy: little to no difference in satisfaction (low certainty)</span></li>'+
         '<li><b>Thomson CE, Gibson JN, Martin D, Interventions for the treatment of Morton’s neuroma. Cochrane Database Syst Rev 2004 (CD003118)</b><span class="rd"> — insufficient randomised evidence; little for insoles; no RCTs of steroid injection at that time</span></li>'+
         '<li><b>Thomson CE, Beggs I, Martin DJ et al, Methylprednisolone injections for the treatment of Morton neuroma: a patient-blinded randomized trial. J Bone Joint Surg Am 2013;95:790–8</b><span class="rd"> — 131 participants; methylprednisolone 40 mg with lidocaine vs lidocaine; better global foot health at 3 months (p=0.002)</span></li>'+
         '<li><b>Bennett GL, Graham CE, Mauldin DM, Morton’s interdigital neuroma: a comprehensive treatment protocol. Foot Ankle Int 1995;16:760–3</b><span class="rd"> — 115 patients; staged care; 85% improved; 21% excision with 96% satisfied</span></li>'+
         '<li><b>Mahadevan D et al, Diagnostic accuracy of clinical tests for Morton’s neuroma compared with ultrasonography. J Foot Ankle Surg 2015</b><span class="rd"> — thumb–index squeeze 96% sensitivity; Mulder’s click 61%; 54 feet</span></li>'+
         '<li><b>Pastides P, El-Sallakh S, Charalambides C, Morton’s neuroma: a clinical versus radiological diagnosis. Foot Ankle Surg 2012</b><span class="rd"> — clinical sensitivity 98%, ultrasound 90%, MRI 88%; web-space tenderness 100%; imaging not absolutely required</span></li>'+
         '<li><b>NHS Cheshire and Merseyside ICB, CMICB_Clin032 Morton’s neuroma, surgical treatment (version 1, April 2023)</b><span class="rd"> — example of a local commissioning pathway: footwear, NSAID trial, metatarsal pads, orthotist, then surgical opinion. Check your own ICB policy</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — analgesic doses</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Morton’s neuroma in primary care: clinical diagnosis, staged offloading, injection and surgical referral. Sources: NICE HTG394 (IPG539, 2015), NICE HTG652 (IPG747, 2023), NICE NG12 (updated April 2026), NICE NG100, NICE NG19, Cochrane reviews 2004 and 2024, and the primary studies listed under Evidence. Check your ICB’s commissioning policy before referring for surgery, and verify doses against the current BNF."
