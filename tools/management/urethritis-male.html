MG.render({
  icon:"🚹",
  title:"Urethritis (Male)",
  eyebrow:"Protocol · assess and manage in one place",
  stemTitle:"Urethral discharge or dysuria in a sexually active man should prompt STI assessment unless another cause is clearly more likely — test first where safe, then treat the right organism",
  stemSub:"One page for the whole consultation. Take a sexual history, check the scrotum, send a first-void urine NAAT for chlamydia and gonorrhoea <i>before</i> antibiotics where this does not delay urgent treatment, consider UTI, prostatitis and other causes, and get the man to sexual health for microscopy, culture and partner notification. Non-gonococcal urethritis is treated with doxycycline 100 mg twice daily for 7 days; gonorrhoea needs ceftriaxone 1 g IM after a culture; persistent symptoms mean Mycoplasma genitalium and resistance-guided therapy. BASHH NGU 2026 · BASHH gonorrhoea 2025 · BASHH chlamydia 2026 · BASHH M. genitalium 2025 · BASHH epididymo-orchitis 2020.",
  guideline:"BASHH NGU (2026) · BASHH gonorrhoea (2025) · BASHH chlamydia (2026) · BASHH Mycoplasma genitalium (2025) · BASHH epididymo-orchitis (2020) · UKHSA STI data (2025 report, June 2026) · NICE NG12 (updated April 2026)",
  meta:[
    {t:"BASHH NGU 2026 · doxycycline first line"},
    {t:"BASHH gonorrhoea 2025 · ceftriaxone 1 g IM"},

  ],
  lead:"<div class='mg-layers'><a href='#redflags'><b>Red flags</b><small>Torsion, systemic, lesion</small></a><a href='#tests'><b>Test first</b><small>First-void NAAT</small></a><a href='#treat'><b>Treat</b><small>Doxycycline or ceftriaxone</small></a><a href='#partners'><b>Partners</b><small>Look back, abstain</small></a></div>",
  quickSub:"If you read nothing else, read these six cards. Every dose and interval traces to a primary source listed under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Scrotal pain: exclude torsion before calling it epididymo-orchitis", html:"Sudden, severe testicular pain — especially in a teenager or young man, with a high-riding testis, vomiting, or no urethral symptoms — is <b>torsion until proven otherwise: emergency urology, do not wait for tests or ultrasound</b>. Gradual unilateral pain and swelling with urethral symptoms points to sexually acquired epididymo-orchitis, treated with <b>ceftriaxone 1 g IM plus doxycycline 100 mg twice a day for 14 days</b>.", src:"BASHH epididymo-orchitis 2020 · clinical practice"},
    {tone:"blue", h:"Test before you treat, where safe — first-void urine NAAT", html:"Send a <b>first-void urine NAAT for chlamydia and gonorrhoea</b> (the first 15–30 mL of the stream, not a midstream sample; ideally at least an hour after last passing urine, but do not postpone testing for this) <b>before</b> antibiotics whenever feasible, and offer HIV and syphilis serology. <b>Do not delay treatment</b> when he is systemically unwell, gonorrhoea is strongly suspected and treatment access is delayed, torsion has been excluded and epididymo-orchitis is severe, or follow-up is uncertain. A negative NAAT after antibiotics may be falsely negative and should be interpreted cautiously; do not use it as a test of cure. Symptoms suggest possible urethritis; <b>confirmed NGU requires objective evidence of urethral inflammation</b>, usually microscopy in sexual health (≥5 polymorphonuclear leucocytes per high-power field). If microscopy is unavailable, send NAATs and use the local sexual-health pathway; empiric treatment may be appropriate if symptoms are significant and follow-up would otherwise be delayed.", src:"BASHH NGU 2026 · BASHH summary guidance on STI testing (2023)"},
    {tone:"cream", h:"NGU: doxycycline 100 mg twice a day for 7 days", html:"BASHH NGU 2026 first line: <b>doxycycline 100 mg orally twice a day for 7 days</b>. It covers chlamydia, is the first step of M. genitalium treatment, and does not select macrolide resistance. Alternative (specialist or local-pathway use, because of macrolide resistance and possible undiagnosed M. genitalium): <b>azithromycin 1 g on day 1, then 500 mg once daily for 2 days</b>. <b>A single 1 g dose of azithromycin is no longer recommended.</b>", src:"BASHH NGU 2026 · BASHH chlamydia 2026 · BNF doxycycline"},
    {tone:"amber", h:"Suspected gonorrhoea: get him to sexual health for culture and ceftriaxone", html:"Purulent discharge, a gonorrhoea-positive partner or a positive NAAT → same-day or next-day sexual health. BASHH 2025: <b>ceftriaxone 1 g IM as a single dose</b> is the sole first-line empirical treatment, and a <b>culture should be taken before treatment</b> to track resistance. Ceftriaxone-resistant strains are now reported in England, so do not substitute an oral regimen empirically. If same-day sexual-health assessment is unavailable and clinical risk is high, arrange culture before treatment where feasible and follow the local pathway for ceftriaxone administration.", src:"BASHH gonorrhoea 2025 · UKHSA STI quarterly surveillance"},
    {tone:"amber", h:"Still symptomatic after treatment? Think Mycoplasma genitalium", html:"Persistent or recurrent NGU is managed in sexual health: exclude re-exposure and poor adherence, test for <b>M. genitalium with macrolide-resistance testing</b>, and consider <i>Trichomonas vaginalis</i>. M. genitalium treatment is <b>sexual-health-led and resistance-guided</b>: doxycycline first to reduce organism load, then treatment guided by macrolide-resistance testing and the local BASHH regimen. Do not prescribe blind repeat azithromycin. Arrange a <b>test of cure when indicated by the sexual-health pathway</b>, particularly if symptoms persist or treatment failure is suspected — it is no longer routine for every treated patient.", src:"BASHH M. genitalium 2025 · BASHH NGU 2026"},
    {tone:"green", h:"Partner notification and no sex until everyone is treated", html:"Advise no sex (including oral and with condoms) until his course is complete (7 days for doxycycline), his symptoms have resolved <b>and</b> his partners have been treated; for gonorrhoea, follow the sexual-health advice. Partner look-back periods vary by infection and are managed by sexual-health advisers; for penile urethritis, give the service the dates and types of <b>all relevant partners, including those in the 4 weeks before symptom onset</b>. With M. genitalium, follow the sexual-health treatment plan — typically abstain until <b>14 days after starting treatment</b> and until symptoms resolve, depending on the regimen and test-of-cure pathway.", src:"BASHH NGU 2026 · BASHH chlamydia 2026 · BASHH M. genitalium 2025"}
  ],
  pathwaySub:"Five moves. The first one is where men come to harm — torsion and a missed systemic infection do not wait for sexual health.",
  pathway:[
    {title:"Screen the emergencies and the mimics", html:"Acute scrotal pain → <b>torsion until excluded, emergency urology</b>. Fever, rigors, severe pelvic pain or a very unwell man (disseminated gonococcal infection, pyelonephritis, prostatitis) → same-day hospital assessment. Consider mimics: acute bacterial prostatitis, cystitis or complicated UTI, urethral trauma or instrumentation, balanitis or meatitis, stones, malignancy, irritant urethritis, HSV or adenovirus. Genital ulcers, rash, joint pain or red eyes change the diagnosis. A penile lesion that persists after STI treatment is an NG12 question.", alert:true},
    {title:"Take the sexual history", html:"Last sexual contact and previous partner, gender of partners, sites exposed (oral, anal, vaginal), condom use, partner symptoms or diagnoses, sex abroad, chemsex, PrEP and HIV status, previous STIs and recent antibiotics. Ask about the discharge (colour, amount), dysuria, urethral itch and testicular pain."},
    {title:"Test before antibiotics, where safe", html:"<b>First-void urine NAAT for chlamydia and gonorrhoea</b>, plus pharyngeal and rectal swabs if exposed at those sites — urine NAAT alone misses extragenital infection. Offer <b>HIV and syphilis serology</b> (and hepatitis B/C by risk). Send urine for culture if UTI or prostatitis is possible (for example, an older man or no sexual risk). Examine for discharge, meatitis, lesions and the scrotum."},
    {title:"Route to sexual health — or start doxycycline", html:"Sexual health services give microscopy, culture, M. genitalium testing and partner notification in one visit: that is the best route. If gonorrhoea is likely, send him there <b>before</b> treating; if same-day access is unavailable and risk is high, take a culture where feasible and follow the local ceftriaxone pathway rather than leave him untreated. If gonorrhoea is unlikely, symptoms are significant and access is delayed, starting <b>doxycycline 100 mg twice a day for 7 days</b> after the NAAT is reasonable, with sexual health follow-up for partners."},
    {title:"Close the loop", html:"Chase the results. Positive chlamydia or gonorrhoea → sexual health for partner notification (and ceftriaxone for gonorrhoea). No sex until everyone is treated. Persistent symptoms → sexual health for M. genitalium and trichomonas testing. Chlamydia-positive men under 25 → retest about 3 months after treatment."}
  ],
  sections:[
    {id:"redflags", nav:"Red flags", title:"Red flags — what must not wait for a sexual health appointment", sub:"Urethritis is rarely dangerous in itself. Its complications and mimics can be.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Testicular torsion", html:"Sudden severe unilateral scrotal pain, often waking him from sleep, with nausea or vomiting, a high-riding or horizontal testis and an absent cremasteric reflex. Commonest in adolescents but seen in young adults. <b>Emergency urology — a surgical emergency, not a sexual-health referral; the testis is at risk within hours.</b> Urethral discharge or STI risk makes epididymo-orchitis more likely but does not exclude torsion. Doppler ultrasound can be falsely negative and must not delay urological exploration when suspicion is high.", src:"BASHH epididymo-orchitis 2020 · clinical practice"},
         {tone:"red", h:"🔴 Systemically unwell", html:"Fever and rigors with dysuria may be pyelonephritis or acute bacterial prostatitis (tender prostate), not urethritis. Fever, a pustular rash and migrating joint pain or tenosynovitis in a man with urethritis suggests <b>disseminated gonococcal infection</b> — same-day admission.", src:"BASHH gonorrhoea 2025 · clinical practice"},
         {tone:"amber", h:"🟠 Epididymo-orchitis", html:"Gradual unilateral testicular pain and swelling, tender epididymis, often with urethral symptoms. Sexually acquired disease is more likely with a new sexual partner, urethral symptoms, a positive STI test, multiple partners or other STI risk: <b>ceftriaxone 1 g IM plus doxycycline 100 mg twice a day for 14 days</b>. Enteric infection is more likely with older age, urinary tract disease, recent instrumentation or urinary symptoms, but mixed causes occur — insertive anal sex can give a mixed STI and enteric picture. Take NAATs and culture first if feasible, but do not delay empirical treatment once the diagnosis is made. Enteric regimens follow BASHH 2020 with local sexual-health or urology advice, noting the MHRA fluoroquinolone safety warnings. Review if not improving within 72 hours. A persistent mass, recurrent epididymo-orchitis, a urinary pathogen, a structural urinary abnormality or failure to improve needs urology assessment.", src:"BASHH epididymo-orchitis 2020"},
         {tone:"amber", h:"🟠 Reactive arthritis", html:"Arthritis (often lower-limb, asymmetrical), enthesitis or conjunctivitis within weeks of urethritis — sexually acquired reactive arthritis, usually after chlamydia. Assess arthritis or enthesitis for reactive arthritis; treat the infection, test and treat partners — continuing STI partner management even when joint symptoms dominate — and consider rheumatology if the arthritis persists or is severe. Red, painful eye with photophobia → same-day ophthalmology (anterior uveitis).", src:"BASHH chlamydia 2026 · clinical practice"},
         {tone:"amber", h:"🟠 Genital ulcers or rash", html:"Painful ulcers (herpes simplex, which can cause urethritis) or a painless ulcer or rash (syphilis) change the work-up: swab for HSV PCR and send syphilis serology, and route to sexual health the same week.", src:"BASHH NGU 2026 · clinical practice"},
         {tone:"purple", h:"Penile lesion that persists after STI treatment — NICE NG12", html:"NICE NG12: <b>consider a suspected cancer pathway referral (for an appointment within 2 weeks) for penile cancer in men, and trans women and non-binary people with male reproductive organs, if they have a penile mass or ulcerated lesion when a sexually transmitted infection has been excluded as a cause, or a persistent penile lesion after treatment for a sexually transmitted infection has been completed</b>; also for unexplained or persistent symptoms affecting the foreskin or glans. Do not attribute a persistent lesion to recurrent balanitis or STI without examination.", src:"NICE NG12 (updated April 2026)"}
       ]},
       {b:"why", html:"Urethritis sends men to primary care because they are uncomfortable, but the harms live elsewhere: the torsed testis mislabelled as ‘infection’, the gonorrhoea that spreads to joints, the partner who develops pelvic inflammatory disease because nobody told her. The consultation has three jobs — rule out the acute scrotum, get the right test before the antibiotic, and make sure partners are reached."}
     ]},

    {id:"causes", nav:"Causes", title:"What causes it — gonococcal versus non-gonococcal", sub:"The split matters because the drugs differ. The most common organisms in NGU are Chlamydia trachomatis and Mycoplasma genitalium.",
     blocks:[
       {b:"table", head:["Cause","Clues","Treatment implication"], rows:[
         ["<b>Neisseria gonorrhoeae</b>","Short incubation (days); profuse purulent discharge more typical; partner with gonorrhoea; GBMSM with multiple partners","<b>Ceftriaxone 1 g IM</b> after culture (BASHH 2025); not treated with doxycycline"],
         ["<b>Chlamydia trachomatis</b>","The commonest identified cause of NGU; mild dysuria and a scant clear or mucoid discharge; often asymptomatic","<b>Doxycycline 100 mg twice a day for 7 days</b> (BASHH chlamydia 2026)"],
         ["<b>Mycoplasma genitalium</b>","The second common cause of NGU, and important in persistent or recurrent NGU; high rates of macrolide resistance in the UK","<b>Resistance-guided therapy</b> in sexual health (BASHH 2025); test of cure when indicated by the clinic"],
         ["<b>Trichomonas vaginalis</b>","Female partner with vaginal discharge or trichomonas; persistent NGU in men who have sex with women","Nitroimidazole per BASHH trichomonas guidance, via sexual health"],
         ["<b>Adenovirus, herpes simplex</b>","Meatitis, conjunctivitis (adenovirus); ulcers, severe dysuria (HSV); may follow oral sex; microscopy can miss adenovirus","Supportive (adenovirus); antiviral (HSV) per BNF"],
         ["<b>No organism identified</b>","A large share of NGU after testing","If urethritis is confirmed, treatment and partner management follow the BASHH NGU pathway. Persistent symptoms without objective urethritis → reassess for non-infective or alternative causes rather than repeated empirical antibiotics"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"How common", html:"UKHSA’s 2025 report (published June 2026): overall STI diagnoses in England fell 8.3% to 334,151. <b>Chlamydia</b> was the commonest (151,163; 45.2% of new STI diagnoses) and <b>gonorrhoea</b> next (63,943; 19.1%). Diagnoses fell among GBMSM, possibly helped by doxyPEP and gonorrhoea vaccination with 4CMenB, both introduced in sexual health services from mid-2025.", src:"UKHSA STIs and chlamydia screening in England: 2025 report (June 2026)"},
         {tone:"blue", h:"Why not a UTI?", html:"Dysuria with urethral discharge in a sexually active man should prompt STI assessment unless another cause is clearly more likely. A course of trimethoprim or nitrofurantoin will not treat chlamydia, gonorrhoea or M. genitalium, and it delays partner notification. Keep a UTI in mind in older men, those with no sexual risk, or when the dipstick shows nitrites — and send a culture. Acute bacterial prostatitis causes fever, perineal pain, obstructive or irritative urinary symptoms and a tender prostate: avoid vigorous prostate examination, send urine culture, and arrange same-day hospital assessment if systemically unwell. Urethritis and prostatitis can coexist.", src:"BASHH NGU 2026 · clinical practice"}
       ]}
     ]},

    {id:"tests", nav:"Tests", title:"Testing — what to send from primary care, and what sexual health adds", sub:"Primary care can do the NAAT and serology. The diagnosis of NGU itself needs microscopy.",
     blocks:[
       {b:"table", head:["Test","Where","Detail"], rows:[
         ["<b>First-void urine NAAT</b> — chlamydia and gonorrhoea","GP or sexual health","The first 15–30 mL of the stream — not a midstream sample, and do not ask for a large specimen. Ideally after not passing urine for at least an hour, a practical preference rather than a reason to postpone testing. <b>Before antibiotics where feasible</b>, without delaying urgent treatment."],
         ["<b>Pharyngeal and rectal NAAT swabs</b>","GP or sexual health","If there has been oral or receptive anal exposure — do not rely on urine NAAT alone for extragenital infection"],
         ["<b>HIV and syphilis serology</b>; hepatitis B (and C) by risk","GP or sexual health","Offer HIV and syphilis testing to everyone with a suspected STI, with hepatitis B and C according to sexual, blood-borne and epidemiological risk; repeat after the relevant window period if exposure was recent. Assess hepatitis B vaccination, refer for HIV PrEP where indicated, and use sexual-assault and safeguarding pathways where relevant"],
         ["<b>Urethral Gram-stained smear</b>","Sexual health","NGU = <b>≥5 polymorphonuclear leucocytes per high-power field</b>, averaged over five fields with the greatest concentration; Gram-negative intracellular diplococci suggest gonorrhoea and allow same-day treatment"],
         ["<b>Gonococcal culture</b>","Sexual health","Taken <b>before</b> ceftriaxone so antimicrobial susceptibility can be tested — essential in the era of ceftriaxone resistance"],
         ["<b>M. genitalium NAAT with macrolide-resistance testing</b>","Sexual health","In symptomatic men with confirmed NGU (BASHH NGU 2026, subject to local test availability), in persistent or recurrent NGU, and in partners of people with M. genitalium; not a routine screen in asymptomatic men"],
         ["<b>Trichomonas NAAT</b>","Sexual health","In persistent NGU, or when a female partner has trichomonas"]
       ]},
       {b:"why", html:"Microscopy is why the sexual health clinic is the best first stop: it confirms urethritis on the day, spots gonorrhoea on the smear, and allows treatment before the NAAT result. In primary care the NAAT comes back days later and cannot tell you whether a man with negative chlamydia and gonorrhoea results actually has urethritis — which is why persistent symptoms go to sexual health rather than round another course of antibiotics."}
     ]},

    {id:"treat", nav:"Treatment", title:"Treatment — NGU, chlamydia and the gonorrhoea split", sub:"Doses are those in the named BASHH guideline and the BNF. Test first where this does not delay urgent treatment.",
     blocks:[
       {b:"ladder", steps:[
         {step:"NGU first line", tone:"cream", title:"Doxycycline 100 mg twice a day for 7 days", when:"confirmed NGU, or possible urethritis when microscopy is unavailable, gonorrhoea is unlikely and follow-up would be delayed; chlamydia", html:"<span class='rx'>Doxycycline 100 mg orally twice a day for 7 days</span> (BASHH NGU 2026; also first line for chlamydia at all sites, BASHH 2026). Counsel per BNF: take with a full glass of water and remain upright afterwards, not immediately before bed; separate from iron, calcium, magnesium, antacids and pregnancy supplements; advise about photosensitivity; assess pregnancy and breastfeeding in relevant patients."},
         {step:"Alternative", tone:"cream", title:"Azithromycin — the 3-day regimen, never a single dose", when:"doxycycline contraindicated or not tolerated", fromLabel:"if doxycycline unsuitable", html:"<span class='rx'>Azithromycin 1 g orally on day 1, then 500 mg once daily on days 2 and 3</span> (BASHH NGU 2026). The <b>1 g single dose is no longer recommended</b>: it selects macrolide resistance in M. genitalium. Use only as specialist or local-pathway treatment, given macrolide resistance and the possibility of undiagnosed M. genitalium."},
         {step:"Gonorrhoea", tone:"amber", title:"Ceftriaxone 1 g IM — sexual health or local pathway", when:"gonorrhoea on smear, NAAT, or strong suspicion", fromLabel:"if gonorrhoea", html:"<span class='rx'>Ceftriaxone 1 g intramuscularly, single dose</span> — BASHH 2025 sole first-line empirical treatment, after a culture. Ciprofloxacin is no longer first line (safety concerns) but sexual health may use it when the isolate is known to be susceptible and it is clinically appropriate. Because chlamydia co-infection is common, doxycycline is added if chlamydia is positive or NGU coexists.", warn:"Suspected gonorrhoea should be managed through sexual health wherever possible because culture, susceptibility testing and partner notification are required. If same-day sexual-health assessment is unavailable and clinical risk is high, arrange culture before treatment where feasible and follow the local pathway for ceftriaxone administration. Do not substitute an oral regimen empirically."},
         {step:"Persistent or recurrent", tone:"amber", title:"Sexual health — M. genitalium and trichomonas", when:"symptoms continue or return after treatment", fromLabel:"if not settling", html:"Check adherence and re-exposure first. Then M. genitalium testing with resistance markers and trichomonas testing. Treatment is resistance-guided (BASHH M. genitalium 2025) and is chosen by the clinic."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Why doxycycline replaced azithromycin", html:"Single-dose azithromycin was less effective for rectal chlamydia and drove macrolide resistance in M. genitalium, which now affects a large share of UK M. genitalium infections. Doxycycline for 7 days treats chlamydia well, lowers the M. genitalium load before any second agent, and does not select macrolide resistance.", src:"BASHH NGU 2026 · BASHH M. genitalium 2025 · UKHSA MARS report (2025)"},
         {tone:"cream", h:"The GP-started course", html:"Starting doxycycline in primary care is reasonable when symptoms are significant, gonorrhoea is unlikely, the NAAT has been taken, and the man cannot reach sexual health promptly. The course does not replace sexual health: he still needs partner notification, and gonorrhoea still needs ceftriaxone if the NAAT is positive.", src:"BASHH NGU 2026 · clinical practice"}
       ]}
     ]},

    {id:"gonorrhoea", nav:"Gonorrhoea", title:"Gonorrhoea — culture, ceftriaxone and when a test of cure is needed", sub:"Gonorrhoea management sits in sexual health because of resistance surveillance.",
     blocks:[
       {b:"dl", rows:[
         ["Treatment","<b>Ceftriaxone 1 g IM single dose</b> — BASHH 2025 sole first-line empirical regimen."],
         ["Before treatment","A <b>culture</b> from the urethra (and other exposed sites) so susceptibility is known."],
         ["Test of cure","BASHH 2025: <b>not routinely needed for anogenital infection treated with ceftriaxone 1 g when the isolate is ceftriaxone-susceptible</b>. Pharyngeal infection, treatment with a non-standard regimen, suspected treatment failure, antimicrobial resistance, persistent symptoms, or concern about adherence or re-exposure still need a test of cure, arranged by sexual health."],
         ["Partners","All partners are notified; current or recent partners (within the past 14 days) are considered for empirical treatment."],
         ["Resistance","UKHSA reports ceftriaxone-resistant gonorrhoea cases in England through its quarterly surveillance. Any treatment failure is reported to UKHSA by the clinic."]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"Old rule to drop: test of cure for every gonorrhoea case", html:"Earlier practice was a test of cure for everyone. The 2025 BASHH guideline narrowed this: an anogenital infection treated with ceftriaxone 1 g and shown to be susceptible does not need a routine test of cure. The clinic decides.", src:"BASHH gonorrhoea 2025"},
         {tone:"blue", h:"4CMenB for gonorrhoea prevention", html:"Since mid-2025 sexual health services have offered the 4CMenB meningococcal B vaccine to people at highest risk of gonorrhoea, as defined by the national programme. Eligibility is assessed by the clinic.", src:"UKHSA STIs and chlamydia screening in England: 2025 report (June 2026)"}
       ]}
     ]},

    {id:"mgen", nav:"Persistent NGU", title:"Persistent or recurrent NGU and Mycoplasma genitalium", sub:"When symptoms outlast the treatment, the next step is a better test in sexual health, not another blind antibiotic.",
     blocks:[
       {b:"timeline", items:[
         {n:"1", when:"First", title:"Was it taken, and was he re-exposed?", html:"Ask about missed doses, vomiting, and sex with an untreated partner. Re-infection is a common reason for ‘treatment failure’."},
         {n:"2", when:"Then", title:"Confirm objective urethritis", html:"Sexual health repeats microscopy. Symptoms without urethral inflammation are managed differently from persistent NGU."},
         {n:"3", when:"Test", title:"M. genitalium with macrolide-resistance markers; trichomonas", html:"BASHH M. genitalium 2025 builds treatment on the resistance result; trichomonas is sought in men with female partners."},
         {n:"4", when:"Treat", title:"Resistance-guided therapy", html:"Doxycycline first to reduce the organism load, then a second agent chosen by the resistance result (a macrolide regimen if susceptible, a fluoroquinolone if resistant — noting fluoroquinolone adverse effects and emerging resistance). Regimens are chosen and supplied by sexual health; do not prescribe blind repeat azithromycin."},
         {n:"5", when:"Afterwards", title:"Test of cure when indicated", html:"BASHH 2025 no longer recommends a routine test of cure for every treated patient. Retest when indicated by the sexual-health pathway — persistent symptoms, suspected treatment failure, concern about adherence or re-exposure, or selected regimens or resistance. Abstinence follows the clinic plan, typically until 14 days after starting treatment and until symptoms have resolved."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"Why primary care should not treat M. genitalium blindly", html:"Macrolide resistance is common in UK M. genitalium, fluoroquinolone resistance is emerging, and fluoroquinolones carry serious adverse-effect warnings. An untargeted azithromycin course fails often and selects more resistance. UKHSA monitors this through the MARS surveillance programme.", src:"BASHH M. genitalium 2025 · UKHSA MARS report (2025)"},
         {tone:"blue", h:"Do not screen asymptomatic men for M. genitalium", html:"Testing is for people with symptoms (NGU, epididymo-orchitis), their current partners, and specific syndromes. Screening asymptomatic people leads to antibiotic exposure without clear benefit.", src:"BASHH M. genitalium 2025"}
       ]}
     ]},

    {id:"partners", nav:"Partners and prevention", title:"Partner notification, abstinence and prevention", sub:"Treating the index man without his partners guarantees reinfection.",
     blocks:[
       {b:"tiles", v:"life", items:[
         {t:"📅 Look-back", html:"Look-back periods vary according to the identified infection and are managed by sexual-health advisers. For penile urethritis, provide the sexual-health service with the dates and types of all relevant partners, including those in the <b>4 weeks before</b> symptom onset (BASHH chlamydia 2026; BASHH NGU 2026); the adviser may extend this."},
         {t:"💊 Partner treatment", html:"Partners are tested and usually offered treatment for the infection found — or epidemiological treatment for NGU — whatever their own results."},
         {t:"🚫 Abstinence", html:"Chlamydia or NGU treated with doxycycline: no sex until the 7-day course is complete, symptoms have resolved and partners have been treated. Gonorrhoea: follow the sexual-health advice. M. genitalium: follow the regimen-specific BASHH interval set by the clinic, typically until 14 days after starting treatment and symptoms have resolved. Formal follow-up need not be completed first where no test of cure is required."},
         {t:"🧑‍⚕️ Who does it", html:"Sexual health health advisers — patient referral, provider referral (anonymous) or contract referral. Primary care can refer into this for a man who tests positive."},
         {t:"🧴 Condoms", html:"Consistent condom use reduces reinfection and other STIs. Offer free condoms via local schemes."},
         {t:"🛡 PrEP and doxyPEP", html:"Discuss HIV PrEP if at ongoing risk. Doxycycline post-exposure prophylaxis (doxyPEP) is offered by sexual health services to eligible GBMSM and trans women, mainly to prevent syphilis."}
       ]},
       {b:"say", html:"This looks like urethritis — an infection in the tube you pass urine through, and it’s nearly always caught through sex. I’ve sent a urine test for chlamydia and gonorrhoea. The antibiotic is a week of doxycycline, twice a day. The important part is your partner — anyone you’ve had sex with in the last month or so needs testing and treatment too, otherwise it just comes back. No sex until you’ve both finished treatment and your symptoms have gone. The sexual health clinic can contact partners for you without using your name."}
     ]},

    {id:"followup", nav:"Follow-up", title:"Follow-up, retesting and test of cure", sub:"Who needs what after treatment.",
     blocks:[
       {b:"table", head:["Situation","Follow-up","Source"], rows:[
         ["<b>NGU, symptoms settled</b>","No routine test of cure; confirm partners are treated","BASHH NGU 2026"],
         ["<b>Chlamydia, man under 25</b>","Retest <b>2–6 months</b> after treatment (NCSP: around 3 months) — reinfection is common","BASHH chlamydia 2026 · UKHSA NCSP"],
         ["<b>Gonorrhoea, anogenital, ceftriaxone-susceptible</b>","No routine test of cure","BASHH gonorrhoea 2025"],
         ["<b>Gonorrhoea: pharyngeal, non-standard regimen, suspected failure, resistance, persistent symptoms, or adherence or re-exposure concern</b>","Test of cure, arranged by sexual health","BASHH gonorrhoea 2025"],
         ["<b>M. genitalium</b>","Test of cure when indicated by the sexual-health pathway (persistent symptoms, suspected failure, adherence or re-exposure concern, selected regimens or resistance)","BASHH M. genitalium 2025"],
         ["<b>Persistent or recurrent symptoms</b>","Back to sexual health — microscopy, M. genitalium and trichomonas","BASHH NGU 2026"],
         ["<b>Recent exposure</b>","Repeat HIV and syphilis serology after the window period","BASHH summary guidance on STI testing (2023)"]
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — who, where, how urgently", sub:"Sexual health is the natural home for urethritis. These are the routes.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same-day", html:"Suspected <b>testicular torsion</b> → emergency urology (torsion pathway, not sexual health) · <b>systemically unwell</b> (suspected disseminated gonococcal infection, pyelonephritis or acute prostatitis) → acute medicine or urology · red painful eye with photophobia → ophthalmology.", src:"BASHH epididymo-orchitis 2020 · BASHH gonorrhoea 2025 · clinical practice"},
         {tone:"purple", h:"Urgent referral routes <span class='tw'>Suspected cancer</span> · NICE NG12", html:"<b>Penile:</b> consider a suspected cancer pathway referral (for an appointment within 2 weeks) for penile cancer if there is a penile mass or ulcerated lesion when a sexually transmitted infection has been excluded as a cause, or a persistent penile lesion after treatment for a sexually transmitted infection has been completed; also for unexplained or persistent symptoms affecting the foreskin or glans. <b>Testicular:</b> consider a suspected cancer pathway referral for a non-painful enlargement or change in shape or texture of the testis.", src:"NICE NG12 (updated April 2026)"},
         {tone:"amber", h:"Sexual health — same week, sooner if gonorrhoea likely", html:"All men with urethral symptoms, ideally before treatment · positive gonorrhoea NAAT · positive chlamydia NAAT for partner notification · persistent or recurrent NGU · M. genitalium testing and treatment · epididymo-orchitis if not settling · PrEP, doxyPEP and 4CMenB.", src:"BASHH NGU 2026 · BASHH gonorrhoea 2025"},
         {tone:"cream", h:"Managed in primary care", html:"NAAT and serology; doxycycline 100 mg twice a day for 7 days when gonorrhoea is unlikely and sexual health access is delayed; chasing results; safety-netting; linking the man and his partners into sexual health for notification.", src:"BASHH NGU 2026 · BASHH chlamydia 2026"},
         {tone:"blue", h:"Local Bolton and Greater Manchester routes", html:"Use the local Bolton sexual-health referral route (and its out-of-hours pathway), the urgent urology pathway, and the local arrangements for ceftriaxone administration, test of cure and HIV PrEP. Antibiotic choices follow <a href='https://gmmmg.nhs.uk/guidance/clinical-guidance-and-pathways/antimicrobial-guidance-and-resources/' rel='noopener'>GMMMG antimicrobial guidance</a>."}
       ]},
       {b:"say", html:"I’d like you to be seen at the sexual health clinic this week. They can look at a sample under the microscope today, which tells us far more than the urine test alone, and they’ll help you contact partners confidentially. If your testicle suddenly becomes very painful or swollen, or you get a fever, don’t wait — come back or go to A&amp;E the same day."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 24-year-old man books a telephone call for ‘a water infection’: 4 days of stinging when passing urine and a small amount of clear discharge. He had unprotected sex with a new partner 2 weeks ago and has a long-term girlfriend he has not told. He asks for antibiotics to be sent to the pharmacy today."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Reframes the ‘water infection’ as <b>possible STI</b> without judgement; takes a <b>sexual history</b> including sites and partners; asks about <b>testicular pain</b> and systemic symptoms; arranges a <b>first-void NAAT before antibiotics</b> plus HIV and syphilis serology; explains <b>doxycycline 100 mg twice a day for 7 days</b> (not single-dose azithromycin, not trimethoprim); recommends <b>sexual health</b> for microscopy and confidential <b>partner notification</b>, handling the girlfriend sensitively; advises <b>no sex until both are treated</b>; and safety-nets for scrotal pain or fever.", src:"BASHH NGU 2026 · BASHH chlamydia 2026"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Every figure on this page traces to a named primary source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>BASHH — National guideline on the management of non-gonococcal urethritis (NGU), 2026</b> (Crofts M, Blee K, Evans C, Tipple C, Rayment M, Horner PJ. Int J STD AIDS 2026; doi 10.1177/09564624261430584)<br><a href="https://www.bashh.org/resources/159/ngu_guideline_2026/" rel="noopener">bashh.org — NGU guideline 2026</a><span class="rd"> — microscopic definition ≥5 PMNL per high-power field (five fields); doxycycline 100 mg twice daily for 7 days first line; azithromycin 1 g then 500 mg daily for 2 days as alternative (1 g single dose no longer recommended); abstain until index and partners complete treatment and follow-up; partner notification per infection-specific guidance; persistent or recurrent NGU. Replaces BASHH NGU 2015 and its 2018 update.</span></li>'+
         '<li><b>BASHH — UK national guideline for the management of infection with Neisseria gonorrhoeae, 2025</b> (Fifer H et al. Int J STD AIDS 2025; doi 10.1177/09564624251345195)<br><a href="https://www.bashh.org/resources/136/gonorrhoea_2025_updated_guideline" rel="noopener">bashh.org — gonorrhoea 2025</a><span class="rd"> — ceftriaxone 1 g IM sole first-line empirical treatment; culture before treatment; routine test of cure not necessary for anogenital infection treated with ceftriaxone 1 g if susceptible; partners within the past 14 days considered for empirical treatment.</span></li>'+
         '<li><b>BASHH — UK national guideline for the management of infection with Chlamydia trachomatis, 2026</b> (Saunders J et al. Int J STD AIDS 2026; doi 10.1177/09564624261475950)<br><span class="rd">Doxycycline 100 mg twice daily for 7 days; retest under-25s 2–6 months after treatment; partner look-back 4 weeks before onset of penile urethral symptoms.</span></li>'+
         '<li><b>BASHH — National guideline for the management of infection with Mycoplasma genitalium, 2025</b> (Soni S et al. Int J STD AIDS; doi 10.1177/09564624251359054)<br><a href="https://www.bashh.org/resources/19/mycoplasma_genitalium_2025/" rel="noopener">bashh.org — M. genitalium 2025</a><span class="rd"> — resistance-guided therapy starting with doxycycline; test of cure when indicated rather than routinely for every treated patient; fluoroquinolone adverse effects and emerging resistance; abstain until 14 days after starting treatment and symptoms resolved.</span></li>'+
         '<li><b>BASHH — UK national guideline for the management of epididymo-orchitis, 2020</b> (Chirwa M et al. Int J STD AIDS 2021; 32(10): 884–895; doi 10.1177/09564624211003761)<br><a href="https://doi.org/10.1177/09564624211003761" rel="noopener">doi.org — epididymo-orchitis 2020</a><span class="rd">Sexually acquired: ceftriaxone 1 g IM plus doxycycline 100 mg twice daily for 14 days; quinolone regimens when enteric organisms are likely.</span></li>'+
         '<li><b>BASHH — Summary guidance on testing for sexually transmitted infections</b> (2023)</li>'+
         '<li><b>BASHH — Statement on partner notification for sexually transmissible infections</b> (McClean H et al. Int J STD AIDS 2013)</li>'+
         '<li><b>UKHSA — Sexually transmitted infections and screening for chlamydia in England: 2025 report</b> (published 2 June 2026)<br><a href="https://www.gov.uk/government/statistics/sexually-transmitted-infections-stis-annual-data-tables" rel="noopener">gov.uk — STI annual data</a><span class="rd"> — 334,151 new STI diagnoses (down 8.3%); chlamydia 151,163 (45.2%); gonorrhoea 63,943 (19.1%); doxyPEP and 4CMenB introduced June–August 2025.</span></li>'+
         '<li><b>UKHSA — Mycoplasma genitalium antimicrobial resistance surveillance (MARS) report, 2025</b> and <b>STI quarterly surveillance reports</b> (ceftriaxone-resistant gonorrhoea)<br><a href="https://www.gov.uk/government/publications/mycoplasma-genitalium-antimicrobial-resistance-surveillance-mars" rel="noopener">gov.uk — MARS</a></li>'+
         '<li><b>UKHSA — National Chlamydia Screening Programme</b> (changes from 2021) — retest around 3 months after treatment.</li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral</b> (2015, last updated 15 April 2026)<br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — penile cancer and testicular cancer suspected cancer pathway criteria.</span></li>'+
         '<li><b>BNF drug monographs</b> — contraindications, interactions (antacids and mineral supplements), allergy, pregnancy and breastfeeding<br><a href="https://bnf.nice.org.uk/drugs/doxycycline/" rel="noopener">BNF — doxycycline</a> · <a href="https://bnf.nice.org.uk/drugs/azithromycin/" rel="noopener">BNF — azithromycin</a> · <a href="https://bnf.nice.org.uk/drugs/ceftriaxone/" rel="noopener">BNF — ceftriaxone</a></li>'+
         '<li><b>MHRA Drug Safety Update — fluoroquinolone antibiotics</b> (January 2024)<span class="rd"> — use only when other commonly recommended antibiotics are inappropriate; disabling and potentially long-lasting adverse effects.</span></li>'+
         '<li><b>Greater Manchester Medicines Management Group — antimicrobial guidance</b><br><a href="https://gmmmg.nhs.uk/guidance/clinical-guidance-and-pathways/antimicrobial-guidance-and-resources/" rel="noopener">gmmmg.nhs.uk — antimicrobial guidance</a></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Urethritis in men — BASHH NGU (2026), gonorrhoea (2025), chlamydia (2026), Mycoplasma genitalium (2025) and epididymo-orchitis (2020) guidelines, UKHSA STI surveillance (2025 report, June 2026), NICE NG12 (updated April 2026), BNF drug monographs, MHRA fluoroquinolone warnings and GMMMG antimicrobial guidance. Management of gonorrhoea, M. genitalium and partner notification belongs with sexual health services. Not a substitute for clinical judgement or local pathways."
