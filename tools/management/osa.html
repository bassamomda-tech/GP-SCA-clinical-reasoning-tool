  stemSub:"One page for adults (over 16s); children who snore need a separate paediatric pathway. Covers simple snoring as well as obstructive sleep apnoea/hypopnoea syndrome (OSAHS): sleep-disordered breathing caused by recurrent upper-airway narrowing or closure during sleep, producing hypopnoea or apnoea and sleep fragmentation. Diagnosis and grading require a sleep study; the sleep service is responsible for diagnosis, titration, equipment and telemonitoring. Three things the sleep clinic cannot do at first contact: identify it, give the immediate driving and safety advice, and refer for the study.",

  lead:'<div class="mg-layers"><a href="#confirm"><b>Diagnosis</b><small>History · ESS · sleep study</small></a><a href="#severe"><b>Driving duty</b><small>The advice that can\u2019t wait</small></a><a href="#ladder"><b>Treatment</b><small>CPAP \u00b7 MAD \u00b7 weight</small></a><a href="#refer"><b>Refer</b><small>Sleep \u00b7 ENT \u00b7 bariatric</small></a></div>',
  quickSub:"If you read nothing else on this page, read these five cards. Every number traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ The driving advice cannot wait", html:"If suspected or confirmed OSAHS causes excessive sleepiness that may affect driving, advise the patient <b>not to drive now</b> — even before the diagnosis is confirmed — and <b>document the advice</b>. Formal DVLA notification depends on severity and control: <b>suspected OSAHS or confirmed mild OSAHS</b> with excessive sleepiness — notify if symptom control is not achieved within 3 months; <b>confirmed moderate or severe OSAHS</b> with excessive sleepiness — must notify. Relicensing requires satisfactory control of sleepiness and treatment adherence. <b>Group 2 (HGV/PSV)</b> rules are more stringent (medical confirmation before relicensing, at least annual review; Group 1 generally at least every 3 years). Vocational drivers and vigilance-critical workers need expedited sleep-service assessment and must not continue safety-critical work while clinically sleepy (DVLA)."},
    {tone:"amber", h:"Scores support, but do not decide", html:"NICE NG202: assess people with <b>two or more</b> of snoring, witnessed apnoeas, choking during sleep, unrefreshing sleep, waking headaches, excessive sleepiness or fatigue, nocturia, sleep fragmentation or insomnia, and cognitive impairment. Use the <b>Epworth Sleepiness Scale</b> to quantify sleepiness and consider <b>STOP-BANG</b> as an adjunct. Neither score confirms or excludes OSAHS, and Epworth should not be used as the sole basis for referral. Refer on the overall history, occupational risk, comorbidity and clinical judgement."},
    {tone:"blue", h:"Home respiratory polygraphy first; oximetry if unavailable", html:"Offer <b>home respiratory polygraphy</b> to people with suspected OSAHS. If access to respiratory polygraphy is limited, consider <b>home oximetry</b>; if oximetry is negative but symptoms remain significant, arrange respiratory polygraphy or polysomnography (NICE NG202). Oximetry may miss or misclassify OSAHS and can mislead in heart failure, COPD, OHS and other causes of nocturnal hypoxaemia. Do not use a single ODI threshold to diagnose or grade OSAHS. Diagnosis and grading are specialist-led (broad convention: <b>AHI mild 5–14, moderate 15–29, severe ≥30/hour</b>), with treatment decided on the study result plus symptoms and comorbidity, not AHI alone."},
    {tone:"blue", h:"CPAP for moderate–severe; MAD if CPAP declined or not tolerated", html:"NICE NG202: <b>fixed CPAP</b> for moderate or severe OSAHS, and for mild OSAHS where symptoms affect quality of life or daytime activities, alongside lifestyle advice for all. Pressure, interface and titration are determined by the sleep service. If CPAP is declined or not tolerated, consider a <b>customised or semi-customised mandibular advancement splint</b> in adults with optimal dental and periodontal health. Simple snoring needs neither."},
    {tone:"green", h:"Weight management for everyone", html:"Weight loss can improve, and occasionally resolve, OSAHS, but should be offered alongside — not instead of — CPAP or other indicated treatment. Consider structured weight-management services and bariatric assessment according to current NICE obesity criteria and local pathways."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step is where patients \u2014 and other road users \u2014 come to harm.",
  pathway:[
    {title:"Ask the right questions", html:"Ask about at least two of: loud habitual snoring, <b>witnessed apnoeas</b> (partner history is more reliable than self-report), choking or gasping in sleep, unrefreshing sleep, excessive sleepiness, fatigue or poor vigilance, waking headaches, nocturia, sleep fragmentation or insomnia, impaired concentration or memory (NICE NG202). Also low mood, reduced libido. Assess BMI, BP, relevant comorbidities, occupation and driving status."},
    {title:"Give the driving advice", html:"Sleepiness that may impair driving or safety-critical work → advise not to drive, document the advice, ask about near-misses or falling asleep at the wheel, explain that DVLA notification depends on confirmed severity and symptom control, and expedite referral — especially for Group 2 drivers and safety-critical workers, who must not drive or work while clinically sleepy.", alert:true},
    {title:"Score and stratify", html:"Epworth to quantify sleepiness; STOP-BANG as an adjunct (neither confirms or excludes OSAHS). Examine: BMI, waist, <b>neck circumference</b>, BP, Mallampati and tonsils, nasal airway, and signs of cor pulmonale."},
    {title:"Investigate", html:"Refer to the sleep service for home respiratory polygraphy (home oximetry only if polygraphy is unavailable). Bloods selectively by clinical context (they do not diagnose OSAHS); blood gases if obesity hypoventilation is suspected."},
    {title:"Treat and review", html:"Weight, alcohol, position, sedative review from day one \u2192 CPAP or MAD via the sleep service → support adherence → manage associated comorbidities by their usual pathways → reassess driving fitness."}
  ],
  sections:[

    {id:"confirm", nav:"Confirm", title:"Suspecting OSAHS — history, examination and the two scores", sub:"Diagnosis and grading are specialist-led on the sleep study; the pre-test assessment that gets the right patient seen fast is primary care. STOP-BANG and Epworth are pre-test assessment tools, not diagnostic tests.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"STOP-BANG \u2014 pre-test risk", html:"<b>S</b>noring loud \u00b7 <b>T</b>ired by day \u00b7 <b>O</b>bserved apnoeas \u00b7 <b>P</b>ressure (hypertension) \u00b7 <b>B</b>MI &gt;35 \u00b7 <b>A</b>ge &gt;50 \u00b7 <b>N</b>eck &gt;40 cm (M) / 35 cm (F) \u00b7 <b>G</b>ender male.<br><b>0–2 low · 3–4 intermediate · ≥5 high risk.</b><br>An adjunct to clinical assessment: a low score does not exclude OSAHS and a high score does not confirm it."},
         {tone:"blue", h:"Epworth Sleepiness Scale \u2014 impact", html:"Eight everyday situations (reading, watching TV, as a passenger, lying down, sitting talking, after lunch, in a stopped car, in traffic), scored <b>0\u201324</b>. Higher scores indicate more sleepiness (scores above 10 are conventionally taken as excessive). Use it to quantify sleepiness, but <b>do not use Epworth alone to decide whether referral is required</b> (NICE NG202) — driving risk depends on the history, not the score."}
       ]},
       {b:"dl", rows:[
         ["Witnessed apnoeas","<b>Partner history is essential and more reliable than self-report</b> \u2014 do you stop breathing, how often, how long? Gasping or choking on waking. The duration of witnessed apnoeas does not grade OSAHS — sleep-study results are required"],
         ["Daytime impact","Non-restorative sleep; <b>morning headache</b> (a recognised symptom, but neither specific nor a severity marker by itself; consider hypoventilation if with other features); memory and concentration problems; irritability, low mood; work performance"],
         ["Nocturia","<b>Waking at night to pass urine</b> is common and frequently missed — negative intrathoracic pressure from obstructed breathing releases atrial natriuretic peptide. OSAHS is a potentially reversible contributor"],
         ["Who to think of it in","OSAHS is associated with <b>hypertension</b> (including resistant hypertension), <b>atrial fibrillation</b>, heart failure, stroke and <b>type 2 diabetes</b>; also obesity, hypothyroidism, large collar size, retrognathia. Screen and manage these conditions by their usual pathways; do not claim that CPAP will necessarily improve all cardiovascular outcomes"]
       ]},
       {b:"table", head:["Examination","What to look for","Why it changes the plan"], rows:[
         ["BMI, weight, waist","BMI &gt;30 strongly associated; waist &gt;94 cm (M) / &gt;80 cm (F)","Track at every consultation — weight loss can improve OSAHS"],
         ["<b>Neck circumference</b>","<b>&gt;40 cm (M) / &gt;35 cm (F)</b>, measured at the thyroid cartilage","An independent risk factor \u2014 pharyngeal fat narrows the airway"],
         ["Blood pressure","Both arms; note if resistant (uncontrolled on \u22653 agents including a diuretic)","Resistant hypertension \u2192 screen for OSA as a secondary cause"],
         ["Oropharynx","<b>Mallampati class III/IV</b> (posterior oropharynx not visible), tonsillar grade 1\u20134, <b>retrognathia</b>","Correlates with severity; also predicts difficult intubation \u2014 <b>document it, it matters for anaesthesia</b>. MADs work particularly well in retrognathia"],
         ["Nasal airway","Anterior rhinoscopy: septal deviation, turbinate hypertrophy, polyps","Nasal obstruction worsens OSA and reduces CPAP tolerance"],
         ["Cardiovascular","RV heave, loud P2, raised JVP, peripheral oedema, hepatomegaly; AF","Possible cor pulmonale — urgent clinical assessment, particularly with breathlessness or hypoxaemia; same-day hospital only for suspected acute decompensation or significant cardiorespiratory compromise"]
       ]},
       {b:"why", html:"STOP-BANG is sensitive but not specific, so it can support the decision to refer but cannot confirm or exclude OSAHS; Epworth measures sleepiness, not the presence or severity of OSAHS. Nocturia and waking headache are commonly missed presenting features."}
     ]},

    {id:"severe", nav:"Red flags &amp; driving", title:"Red flags, and the advice that cannot wait", sub:"This section is the reason the page exists. Sleepiness is a public-safety issue, not only a health one.",
     blocks:[
       {b:"warn", html:"<b>If excessive sleepiness is affecting driving, advise the patient not to drive now and document the advice.</b> This applies even before the diagnosis is confirmed: they must not drive until satisfactory symptom control has been achieved. Explain that formal DVLA notification depends on the severity of confirmed OSAHS and whether sleepiness is controlled: suspected or confirmed mild OSAHS with excessive sleepiness — notify if symptom control cannot be achieved within 3 months; confirmed moderate or severe OSAHS with excessive sleepiness — must notify. Relicensing requires satisfactory control of sleepiness and treatment adherence; Group 2 drivers have more stringent requirements (DVLA Assessing fitness to drive)."},
       {b:"cards", items:[
         {tone:"red", h:"Falling asleep at the wheel, or a near-miss", html:"<b>Advise to stop driving now</b>, document the advice, expedite sleep-service referral, and explain DVLA notification according to the current DVLA rules for suspected and confirmed OSAHS."},
         {tone:"red", h:"Commercial / HGV / PSV driver with sleepiness", html:"<b>Must not drive while clinically sleepy.</b> A DVLA <b>Group 2</b> licence has more stringent requirements: medical confirmation that sleepiness is controlled and treatment adhered to before relicensing, then at least annual review. Expedite sleep-service assessment; they must not continue safety-critical work while clinically sleepy."},
         {tone:"red", h:"Obesity hypoventilation syndrome", html:"Suspect OHS in a person with <b>BMI ≥30 kg/m²</b> and OSAHS symptoms or features of nocturnal hypoventilation, such as morning headache, peripheral oedema, unexplained polycythaemia, resting hypoxaemia or excessive somnolence. OHS requires raised awake PaCO₂ (<b>&gt;6.0 kPa</b>) with sleep-disordered breathing or sleep-related hypoventilation. Confirm with an <b>awake arterial or arterialised capillary blood gas</b>; if pre-test probability is low, venous bicarbonate can be a preliminary test (&lt;27 mmol/L makes OHS less likely). Oximetry alone should not be used to diagnose OHS. <b>Urgent escalation</b> for suspected acute ventilatory failure, severe hypercapnia, new confusion or marked somnolence; otherwise urgent specialist respiratory/sleep referral (NICE NG202)."},
         {tone:"red", h:"Reasons for urgent escalation", html:"Suspected acute ventilatory failure; severe hypercapnia; resting hypoxaemia; new confusion or marked somnolence; signs of cor pulmonale or decompensated heart failure; unstable arrhythmia, nocturnal angina or severe resistant hypertension; vocational driver with significant sleepiness. Marked nocturnal desaturation on oximetry needs prompt sleep-service discussion, interpreted with the clinical situation, baseline oxygenation, COPD, OHS and recording quality — there is no single universal threshold."},
         {tone:"red", h:"Signs of cor pulmonale", html:"Raised JVP, oedema, loud P2 or a right ventricular heave → <b>urgent clinical assessment</b>, particularly if accompanied by breathlessness or hypoxaemia. Reserve <b>same-day hospital assessment</b> for suspected acute decompensation or significant cardiorespiratory compromise."},
         {tone:"amber", h:"Witnessed apnoeas", html:"Frequent witnessed apnoeas with daytime impairment support referral for a sleep study; the duration of witnessed apnoeas does not by itself grade severity."},
         {tone:"amber", h:"New resistant hypertension with snoring", html:"OSAHS is associated with hypertension, including resistant hypertension — include it in the secondary hypertension screen."},
         {tone:"amber", h:"Children are out of scope", html:"This protocol covers adults (over 16s). Children who snore with suspected sleep-disordered breathing need a separate paediatric pathway."},
         {tone:"purple", h:"A different presentation?", html:"If symptoms indicate a separate suspected cancer presentation — for example <b>persistent unilateral nasal obstruction with bleeding</b>, an <b>unexplained neck lump</b> or <b>persistent unexplained hoarseness</b> — use the relevant ENT/NG12 pathway independently."}
       ]},
       {b:"cards", items:[
         {tone:"amber", h:"\ud83c\udf7a Alcohol and sedatives", html:"Both worsen airway collapse and sleepiness. Reduce evening alcohol; review benzodiazepines, Z-drugs and opioids \u2014 and do not add them."},
         {tone:"red", h:"💊 Opioids and sedatives need caution", html:"Opioids <b>blunt the arousal response to hypoxia</b> \u2014 the mechanism that wakes the patient to restore breathing \u2014 and lengthen apnoeas. Avoid or minimise opioids, benzodiazepines, Z-drugs and other sedatives where possible, particularly in untreated OSAHS or OHS. If they are clinically necessary, assess respiratory risk and prescribe cautiously. Do not stop essential opioids abruptly — consider medication review, dose reduction and specialist advice."}
       ]}
     ]},

    {id:"spectrum", nav:"The spectrum", title:"The snoring spectrum \u2014 not everything needs CPAP", sub:"Simple snoring, OSA, upper airway resistance syndrome, hypoventilation and central apnoea are different conditions with different treatments.",
     blocks:[
       {b:"table", head:["Condition","Features","Treatment implication"], rows:[
         ["<b>Primary (simple) snoring</b>","Snoring without apnoeas, without excessive daytime sleepiness, no cardiovascular impact. The partner is disturbed; the patient is well","<b>No CPAP indication</b> \u2014 lifestyle measures, and a MAD if social impact is severe"],
         ["<b>Obstructive sleep apnoea</b>","Repetitive upper-airway collapse (partial = hypopnoea, complete = apnoea). <b>AHI: mild 5–14, moderate 15–29, severe ≥30/hour</b> (broad convention)","Fixed CPAP for moderate–severe, or mild where symptoms affect quality of life or daytime activities; decisions use the study result plus symptoms and comorbidity, not AHI alone"],
         ["<b>Upper airway resistance syndrome</b>","Increased respiratory effort without discrete apnoeas \u2014 EEG arousals, sleepiness, snoring, <b>normal AHI</b>","Diagnosed on polysomnography; CPAP is effective"],
         ["<b>Obesity hypoventilation syndrome</b>","<b>BMI ≥30 kg/m² + raised awake arterial or arterialised capillary PaCO₂ (&gt;6.0 kPa)</b> + sleep-disordered breathing or sleep-related hypoventilation (NICE NG202)","Specialist respiratory/sleep management: CPAP first-line if OHS with severe OSAHS and no acute ventilatory failure; NIV if hypercapnia persists, symptoms or AHI/ODI do not improve, or CPAP is not tolerated; NIV first-line if OHS without severe OSAHS or in acute ventilatory failure"],
         ["<b>Central sleep apnoea</b>","Apnoeas <b>without</b> respiratory effort. Heart failure (Cheyne\u2013Stokes), opioids, altitude, brainstem pathology","Specialist treatment issue, not a GP decision. <b>Adaptive servo-ventilation is contraindicated in HFrEF</b> — SERVE-HF (2015) showed increased cardiovascular mortality"],
         ["<b>Nasal obstruction</b>","Deviated septum, chronic rhinitis, polyps","Nasal steroid; ENT if obstruction is significant"]
       ]},
       {b:"why", html:"Simple snoring without apnoeas or daytime symptoms does not need CPAP \u2014 it is expensive and has real side effects. Conversely, the SERVE-HF finding matters: adaptive servo-ventilation, once used for Cheyne\u2013Stokes respiration in heart failure, increased cardiovascular mortality in HFrEF and is now contraindicated in that group."}
     ]},

    {id:"workup", nav:"Investigations", title:"Investigations — home respiratory polygraphy first", sub:"NICE NG202: offer home respiratory polygraphy; consider home oximetry only if polygraphy access is limited. Bloods are selective and do not diagnose OSAHS.",
     blocks:[
       {b:"table", head:["Test","Role","Notes"], rows:[
         ["<b>Home respiratory polygraphy</b> <span class='mg-src'>first-line</span>","Limited-channel home sleep study via the sleep service","Preferable to oximetry because it identifies obstructive events and alternative sleep-related breathing disorders (NICE NG202). Avoid where a complex sleep disorder (central apnoea, parasomnia) is suspected — polysomnography instead"],
         ["<b>Bloods</b>","Comorbidity and contributors","Check tests selectively according to clinical context and comorbidity: <b>FBC</b> if polycythaemia or anaemia is suspected, <b>HbA1c</b> and lipids as part of cardiometabolic care, and <b>thyroid testing</b> when clinically indicated. These tests do not diagnose OSAHS. Document BMI and BP"],
         ["<b>Arterial blood gas</b>","When hypoventilation is suspected","The key investigation when OHS or hypoventilation is suspected (BMI ≥30 with OSAHS symptoms or features of hypoventilation): <b>awake arterial or arterialised capillary PaCO₂ &gt;6.0 kPa</b> with sleep-disordered breathing. Venous bicarbonate as a preliminary test if pre-test probability is low (&lt;27 mmol/L makes OHS less likely). Hospital or respiratory clinic arranged"],
         ["<b>Polysomnography</b>","Gold standard, specialist-arranged","AHI, sleep stages, arousal index, limb movements, CPAP titration \u2014 not routinely needed in straightforward OSA"],
         ["Home overnight oximetry","Only if access to respiratory polygraphy is limited (NICE NG202)","May miss or misclassify OSAHS, and may mislead in heart failure, COPD, OHS and other causes of nocturnal hypoxaemia. If negative but symptoms remain significant, arrange respiratory polygraphy or polysomnography. Do not use a single ODI threshold to diagnose or grade OSAHS; include the raw report and clinical context in the referral"]
       ]}
     ]},

    {id:"lifestyle", nav:"Lifestyle", title:"Weight, position and risk-factor modification", sub:"Supportive management for everyone, alongside — not instead of — CPAP or other indicated treatment.",
     blocks:[
       {b:"table", head:["Measure","What to advise","Effect"], rows:[
         ["<b>Weight loss</b>","Structured calorie restriction plus exercise; GLP-1 or bariatric pathway if eligible. Tier 3 referral if BMI &gt;35 with comorbidities","Weight loss can improve, and occasionally resolve, OSAHS; effects vary by baseline BMI, severity and follow-up. Bariatric assessment according to current NICE obesity criteria and local pathways"],
         ["<b>Lateral sleep position</b>","Side-sleeping; positional alarms or a sleep-position trainer","Positional therapy is reasonable in selected positional OSAHS after sleep-study confirmation"],
         ["<b>Alcohol</b>","Reduce evening alcohol; AUDIT-C screen","Relaxes upper-airway muscles and worsens apnoeas and sleepiness"],
         ["<b>Smoking</b>","Cessation via NHS service","Causes upper-airway mucosal inflammation and nasal congestion"],
         ["<b>Avoid sedatives</b>","Benzodiazepines, Z-drugs, opioids, muscle relaxants","Relax the airway and blunt the arousal response — avoid or minimise where possible, particularly in untreated OSAHS or OHS; if clinically necessary, assess respiratory risk and prescribe cautiously; do not stop essential opioids abruptly"],

         ["<b>Nasal hygiene</b>","Daily saline irrigation where congested","Treats rhinitis or nasal obstruction; may improve nasal airflow and <b>CPAP tolerance</b>"],
         ["<b>Exercise</b>","<b>150 minutes/week</b> moderate activity","Supports weight management and general cardiometabolic health"],
         ["<b>Sleep hygiene</b>","Regular schedule and adequate sleep opportunity","Comorbid poor sleep amplifies the daytime impact"]
       ]}
     ]},

    {id:"ladder", nav:"Treatment", title:"Treatment by severity \u2014 CPAP, devices and adjuncts", sub:"Shared care: the sleep service titrates and provides; primary care sustains adherence and treats the comorbidities.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1st", title:"CPAP \u2014 moderate\u2013severe, or symptomatic mild", when:"NICE TA139 and NG202",
          html:"NICE NG202: <b>fixed CPAP</b> for moderate or severe OSAHS, and for mild OSAHS where symptoms affect quality of life or daytime activities; auto-CPAP in selected circumstances; telemonitoring for up to 12 months where available. CPAP pressure, interface and titration are determined by the sleep service. Primary care supports adherence, identifies side effects and ensures comorbidities and driving status are reviewed. Effectiveness is assessed by the sleep service using symptoms, vigilance, AHI/ODI and device-download data."},
         {step:"Alt", title:"Mandibular advancement splint", when:"CPAP declined or not tolerated; mild symptomatic",
          fromLabel:"CPAP declined or milder disease",
          html:"If CPAP is declined or not tolerated, consider a <b>customised or semi-customised mandibular advancement splint</b> in adults with optimal dental and periodontal health — for mild OSAHS with symptoms affecting daytime function, or moderate or severe OSAHS where CPAP is declined or not tolerated (NICE NG202). Not suitable with active periodontal disease, untreated dental decay, few or no teeth, or some temporomandibular-joint problems. Not an adequate substitute for CPAP in every patient with severe disease. Arranged via the sleep service and dentist."},
         {step:"Fix", title:"Treat the contributors", when:"alongside device therapy",
          fromLabel:"often overlooked",
          html:"<b>Nasal obstruction:</b> mometasone <b>50 micrograms/spray, 2 sprays (100 micrograms) into each nostril once daily</b> (BNF) reduces mucosal oedema and mouth-breathing; OTC nasal dilator strips give modest benefit in primary snoring. <b>Positional OSAHS:</b> positional therapy may be considered once positional OSAHS is confirmed on the sleep study. <b>Hypothyroidism:</b> treat; ask the sleep service whether reassessment is needed once euthyroid."},
         {step:"Adjunct", title:"Weight management \u00b1 surgery", when:"throughout",
          fromLabel:"can improve, occasionally resolve",
          html:"Weight management continues regardless of device therapy; weight loss can improve, and occasionally resolve, OSAHS. Consider bariatric assessment according to current NICE obesity criteria and local pathways. OSAHS may also improve with anatomical treatment, adenotonsillectomy or other specialist interventions in selected cases."},
         {step:"Rescue", title:"CPAP intolerance \u2014 fix it, don't abandon it", when:"before declaring failure",
          fromLabel:"support improves adherence",
          html:"Work through mask type (nasal pillow, nasal, full-face), <b>heated humidifier</b> for dryness, pressure ramp-up, and <b>auto-titrating CPAP (APAP)</b>. Re-refer for troubleshooting rather than letting the therapy quietly lapse."}
       ]},
       {b:"warn", html:"<b>OSAHS has no first-line drug treatment</b> — CPAP (or a splint where appropriate) plus weight management and lifestyle measures are the mainstays. Never treat the \u201cinsomnia\u201d or the sleepiness with sedatives or hypnotics: they worsen airway collapse and daytime somnolence."}
     ]},

    {id:"monitor", nav:"Monitoring", title:"Adherence, comorbidities, and the driving reassessment", sub:"NICE NG202: initial follow-up within 1 month, review until symptoms and AHI/ODI are optimised, then annual follow-up may be considered. Device-download data is reviewed by the sleep service.",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["CPAP adherence, sleepiness and vigilance","<b>Within 1 month</b> (sleep service), then until optimised; annually once stable","Device download gives usage, residual AHI/ODI and leak. If still sleepy despite apparently effective CPAP → check adherence, residual AHI/ODI, alcohol and sedatives, sleep duration and alternative diagnoses before escalating"],
         ["Mask and equipment","Each review","Review mask fit, leak, humidification, nasal symptoms and device-download data. Replacement of masks and consumables follows local sleep-service and provider arrangements; GP flags problems early rather than letting use lapse"],
         ["Weight","Each review","After substantial weight loss, ask the sleep service whether reassessment is needed — do not stop CPAP without specialist advice"],
         ["Blood pressure","Regularly","Treat hypertension, including resistant hypertension, by the usual pathway"],
         ["Cardiometabolic review","Annually","BP, HbA1c, lipids, AF check, mood. OSAHS is associated with hypertension, AF, heart failure, stroke and type 2 diabetes — manage these by their usual pathways; do not assume CPAP will improve all cardiovascular outcomes"],
         ["<b>Driving status</b>","Each review until controlled","<b>Group 1:</b> may resume once the sleep service confirms sleepiness is satisfactorily controlled and treatment is adhered to. <b>Group 2:</b> more stringent — medical confirmation required before relicensing, then at least annual review. Group 1 review is generally at least every 3 years. Confirm DVLA notification where required and document"]
       ]},
       {b:"cards", items:[
         {tone:"amber", h:"Still sleepy? Work through this before calling it refractory", html:"<b>1</b> Is CPAP actually used (device download) and is residual AHI/ODI controlled — mask, leak, humidification, nasal congestion all addressed? <b>2</b> Is weight falling or static — escalate to weight-management or bariatric services if eligible. <b>3</b> Evening alcohol, benzodiazepines or opioids still on board? <b>4</b> <b>Another cause of sleepiness</b> — short sleep duration, depression, hypothyroidism, anaemia, shift work, inadequate sleep opportunity, narcolepsy. <b>5</b> Comorbidity persisting (resistant hypertension, AF) \u2014 is the OSA genuinely controlled? <b>6</b> Wrong device or re-graded severity \u2014 a MAD is insufficient for severe disease \u2192 back to the sleep clinic."}
       ]},
       {b:"cards", items:[
         {tone:"red", h:"\ud83d\udea8 999", html:"“Acute breathlessness with blue lips, very low oxygen readings at home, or new confusion or severe drowsiness — call 999.”"},
         {tone:"red", h:"\ud83d\udd34 Same-day", html:"\u201cNew or worsening morning headaches, or memory and thinking getting worse \u2014 contact us the same day; it can mean carbon dioxide is building up overnight.\u201d"},
         {tone:"amber", h:"\ud83d\ude97 Driving", html:"“Don't drive while you are sleepy — not until your sleepiness is controlled. Whether you need to tell the DVLA depends on the sleep-study result and how well the sleepiness is controlled; we will tell you. If you drive for a living, the rules are stricter and we will speed up your referral.”"},
         {tone:"amber", h:"\ud83d\ude37 Tell us before you give up on the mask", html:"\u201cCPAP only works on the nights you use it. If the mask is uncomfortable, sore on the nose, or too dry \u2014 tell us and we will fix it rather than you stopping.\u201d"},
         {tone:"green", h:"\ud83c\udf7a Evenings matter", html:"\u201cAlcohol and sleeping tablets in the evening make it worse \u2014 best avoided.\u201d"}
       ]},
       {b:"say", html:"Sleep apnoea is very treatable. The sleep test tells us how severe it is, and a mask at night usually transforms the daytime tiredness \u2014 alongside weight loss and cutting evening alcohol. Until it is controlled, please don't drive if you feel sleepy. Whether you must tell the DVLA depends on how severe it is and whether the sleepiness is controlled — we will guide you, and it protects you and others."}
     ]},

    {id:"loop", nav:"Not responding?", title:"Still sleepy / not improving? Work through this", sub:"",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"1 · CPAP actually used?", html:"Adherence on the device download? Residual AHI/ODI? Mask fit, leak, humidification, nasal congestion sorted? Re-refer for troubleshooting rather than abandon."},
         {tone:"blue", h:"2 · Weight trend", html:"Losing weight, or static? Escalate to weight-management or bariatric services per NICE obesity criteria and local pathways."},
         {tone:"amber", h:"3 · Alcohol / sedatives", html:"Evening alcohol, benzos, opioids still on board undermining it?"},
         {tone:"blue", h:"4 · Another cause of sleepiness", html:"Depression, hypothyroidism, anaemia, shift work, poor sleep opportunity, narcolepsy — sleepiness isn't always residual OSA."},
         {tone:"amber", h:"5 · Under-treated comorbidity", html:"Resistant hypertension/AF persisting → is the OSA genuinely controlled? Recheck with the sleep service."},
         {tone:"blue", h:"6 · Wrong device/severity", html:"MAD insufficient for severe disease, or severity re-graded → back to the sleep clinic."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer \u2014 who goes where, and how fast", sub:"Referral quality decides speed. Include: Epworth and any screening score; witnessed apnoeas and functional impact; BMI and BP; oxygen saturation and blood gases if available; driving and occupational risk; relevant comorbidities; suspected OHS or central sleep apnoea; any oximetry raw report. Prioritise vocational drivers, vigilance-critical workers, unstable cardiovascular disease, pregnancy, major pre-operative assessment and suspected OHS.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same-day hospital", html:"Suspected <b>acute ventilatory failure</b>, severe hypercapnia, new confusion or marked somnolence, <b>decompensated cor pulmonale or heart failure</b>, or acute desaturation with significant cardiorespiratory compromise. Stable suspected cor pulmonale or OHS → urgent clinical assessment and urgent respiratory/sleep referral."},
         {tone:"amber", h:"Urgent sleep clinic", html:"<b>Vocational (Group 2) drivers</b> and vigilance-critical workers with sleepiness — must not drive or do safety-critical work while clinically sleepy; unstable cardiovascular disease (unstable arrhythmia, nocturnal angina, severe resistant hypertension); pregnancy; major pre-operative assessment; suspected OHS. Decide on the overall history, occupational risk, comorbidity and clinical judgement — not on a score alone."},
         {tone:"blue", h:"Routine sleep clinic", html:"Suspected OSAHS (two or more NICE NG202 features) without urgent features, for home respiratory polygraphy. Via respiratory or sleep medicine — the sleep service is responsible for diagnosis, CPAP titration, equipment, follow-up and telemonitoring."},
         {tone:"blue", h:"ENT", html:"Simple snoring with significant nasal obstruction (deviated septum, polyps); <b>tonsillar hypertrophy grade 3\u20134</b>; retrognathia for splint consideration. Children: separate paediatric pathway."},
         {tone:"blue", h:"Tier 3 weight management / bariatric", html:"According to current NICE obesity criteria and local pathways (OSAHS is a relevant obesity-related comorbidity). Weight loss can improve, and occasionally resolve, OSAHS — alongside, not instead of, CPAP or other indicated treatment."},
         {tone:"blue", h:"Respiratory, cardiology, maxillofacial", html:"CPAP failure or intolerance, diagnostic uncertainty, <b>COPD\u2013OSA overlap syndrome</b>; resistant hypertension, AF or heart failure linked to OSA; selected surgical candidates."},
         {tone:"cream", h:"Simple snoring \u2014 no referral", html:"Snoring without witnessed apnoeas, excessive sleepiness or other OSAHS features, and no cardiovascular impact → lifestyle measures and review. A low screening score does not exclude OSAHS — refer if features develop, if not improving, or if the snoring is significantly affecting the relationship."}
       ]},
       {b:"why", html:"NICE recommends CPAP for moderate–severe OSAHS, and for mild OSAHS affecting quality of life, as a cost-effective treatment. Vocational drivers are an occupational-safety priority: Group 2 relicensing requires medical confirmation that sleepiness is controlled and treatment adhered to."},
       {b:"say", html:"I'm referring you for a sleep study to confirm this and grade how severe it is \u2014 then the sleep team set you up, usually with CPAP. Meanwhile the weight, the alcohol and the driving advice are the parts we start on today."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only \u2014 the Casebook keeps the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 52-year-old <b>HGV driver</b>, BMI 36, snoring with witnessed apnoeas, Epworth 15, BP uncontrolled on three agents. He has had one near-miss on the motorway and does not want anything that stops him working."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Scores Epworth and STOP-BANG; recognises the resistant hypertension link; gives and <b>documents</b> the explicit DVLA and not-driving advice despite the livelihood conflict; explores the occupational impact with empathy; arranges an expedited sleep-service referral for home respiratory polygraphy (oximetry only if polygraphy is unavailable); starts weight and alcohol work today. <a href='../../cases/osa.html'>Open the full casebook chapter \u2192</a>"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG202 \u2014 Obstructive sleep apnoea/hypopnoea syndrome and obesity hypoventilation syndrome in over 16s (2021)</b><br><a href="https://www.nice.org.uk/guidance/ng202" rel="noopener">nice.org.uk/guidance/ng202</a><span class="rd"> — assessment (two or more features; Epworth not used alone), home respiratory polygraphy first and oximetry if unavailable, fixed CPAP and mandibular advancement splint indications, follow-up within 1 month and telemonitoring, OHS definition (BMI ≥30, awake PaCO₂ &gt;6.0 kPa), venous bicarbonate, CPAP/NIV for OHS</span></li>'+
         '<li><b>NICE TA139 \u2014 Continuous positive airway pressure for OSA</b><br><a href="https://www.nice.org.uk/guidance/ta139" rel="noopener">nice.org.uk/guidance/ta139</a><span class="rd"> \u2014 CPAP for moderate\u2013severe OSA and its cost-effectiveness</span></li>'+
         '<li><b>DVLA \u2014 Assessing fitness to drive</b><br><a href="https://www.gov.uk/government/publications/assessing-fitness-to-drive-a-guide-for-medical-professionals" rel="noopener">gov.uk \u00b7 assessing fitness to drive</a><span class="rd"> \u2014 Group 1 and Group 2 rules: no driving with excessive sleepiness from suspected OSA; notification once moderate or severe OSA with excessive sleepiness is diagnosed (or mild OSA uncontrolled at 3 months); relicensing on confirmed symptom control and adherence; Group 2 at least annual review, Group 1 generally at least every 3 years</span></li>'+

         '<li><b>SERVE-HF (2015)</b><span class="rd"> \u2014 adaptive servo-ventilation increased cardiovascular mortality in heart failure with reduced ejection fraction; ASV now contraindicated in HFrEF (specialist treatment issue)</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> \u2014 doses: mometasone nasal spray, levothyroxine; sedative and opioid cautions in OSA</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Snoring and obstructive sleep apnoea/hypopnoea syndrome in adults (over 16s) — NICE NG202, TA139 and DVLA Assessing Fitness to Drive. Diagnosis, CPAP titration, equipment and telemonitoring are specialist-led; diagnosis and management are merged on this page, and there is no separate snoring/OSA pathway to cross-check. Verify all doses against the current BNF."
