  quick:[
    {tone:"red", h:"\u26a0 The licence duty cannot wait", html:"Untreated OSA with excessive sleepiness carries a <b>legal duty to notify the DVLA</b>, and the patient <b>must not drive while sleepy</b>. Untreated OSA raises road-traffic accident risk <b>7-fold</b>. <b>Group 2 (HGV/PSV) must stop driving immediately</b> and needs treatment with documented CPAP compliance and <b>ESS &lt;9</b> before relicensing. Advise explicitly and <b>document it</b> \u2014 it is symptoms, not the diagnosis, that trigger the duty."},
    {tone:"amber", h:"Two scores do the screening", html:"<b>STOP-BANG</b> \u2014 Snoring, Tired, Observed apnoeas, Pressure (BP), BMI &gt;35, Age &gt;50, Neck &gt;40cm (M)/35 cm (F), Gender male: <b>0\u20132 low, 3\u20134 intermediate, \u22655 high risk</b> (94% sensitivity for moderate\u2013severe OSA at \u22653, specificity only 35%). <b>Epworth (ESS)</b> \u2014 <b>\u226510 = excessive daytime sleepiness, \u226516 = severe</b>."},
    {tone:"blue", h:"Oximetry first, then the study", html:"<b>Home overnight oximetry</b> is first-line and available to many practices: <b>ODI &gt;15/hour</b> (dips &gt;4%) has ~85% sensitivity and 80% specificity for moderate\u2013severe OSA and justifies urgent referral \u2014 avoiding a 6\u201312 month wait. Diagnosis and grading are specialist-led: <b>AHI mild 5\u201314, moderate 15\u201329, severe \u226530/hour</b>."},
    {tone:"plain", h:"CPAP for moderate\u2013severe; MAD for mild", html:"<b>CPAP</b> first-line for moderate\u2013severe or symptomatic mild disease (typically <b>8\u201312 cmH\u2082O</b>, needs <b>\u22654 hours/night</b> for cardiovascular benefit). <b>Mandibular advancement device</b> for mild\u2013moderate or CPAP intolerance (<b>70\u201380%</b> efficacy). Simple snoring needs neither."},

    {id:"confirm", nav:"Confirm", title:"Confirming OSA \u2014 history and the two scores", sub:"Diagnosis is specialist-led on the sleep study, but the pre-test assessment that gets the right patient seen fast is entirely primary care.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"teal", h:"STOP-BANG \u2014 pre-test risk", html:"<b>S</b>noring loud \u00b7 <b>T</b>ired by day \u00b7 <b>O</b>bserved apnoeas \u00b7 <b>P</b>ressure (hypertension) \u00b7 <b>B</b>MI &gt;35 \u00b7 <b>A</b>ge &gt;50 \u00b7 <b>N</b>eck &gt;40 cm (M) / 35 cm (F) \u00b7 <b>G</b>ender male.<br><b>0\u20132 low \u00b7 3\u20134 intermediate \u00b7 \u22655 high risk.</b>"},
         {tone:"teal", h:"Epworth Sleepiness Scale \u2014 impact", html:"Eight everyday situations (reading, watching TV, as a passenger, lying down, sitting talking, after lunch, in a stopped car, in traffic), scored <b>0\u201324</b>. <b>\u226510 = excessive daytime somnolence needing investigation; \u226516 = severe.</b> This is the number the sleep service and the DVLA care about."}
       ]},
       {b:"dl", rows:[
         ["Witnessed apnoeas","<b>Partner history is essential and more reliable than self-report</b> \u2014 do you stop breathing, how often, how long? Gasping or choking on waking. <b>Apnoeas &gt;10 seconds many times a night</b> with morning headache and cognitive impairment indicates moderate\u2013severe disease"],
         ["Daytime impact","Non-restorative sleep; <b>morning headache</b> (frontal, dull, easing within 1\u20132 hours \u2014 reflects overnight CO\u2082 retention and indicates moderate\u2013severe OSA or hypoventilation); memory and concentration problems; irritability, low mood; work performance"],
         ["Nocturia","<b>Waking \u22652 times a night to pass urine</b> is common and frequently missed \u2014 negative intrathoracic pressure from obstructed breathing releases atrial natriuretic peptide. About <b>30% of men with nocturia</b> have OSA as a contributor: OSA is a reversible cause"],
         ["Who to think of it in","<b>Resistant hypertension</b> (OSA causes hypertension in <b>30\u201350%</b>, often resistant until treated), <b>AF</b>, heart failure, <b>type 2 diabetes</b>, stroke/TIA, obesity, hypothyroidism, large collar size, retrognathia. Treating OSA improves BP by <b>3\u20135 mmHg</b>"]
       ]},
       {b:"table", head:["Examination","What to look for","Why it changes the plan"], rows:[
         ["BMI, weight, waist","BMI &gt;30 strongly associated; waist &gt;94 cm (M) / &gt;80 cm (F)","Track at every consultation \u2014 <b>10% loss reduces AHI 25\u201330%</b>"],
         ["<b>Neck circumference</b>","<b>&gt;40 cm (M) / &gt;35 cm (F)</b>, measured at the thyroid cartilage","An independent risk factor \u2014 pharyngeal fat narrows the airway"],
         ["Blood pressure","Both arms; note if resistant (uncontrolled on \u22653 agents including a diuretic)","Resistant hypertension \u2192 screen for OSA as a secondary cause"],
         ["Oropharynx","<b>Mallampati class III/IV</b> (posterior oropharynx not visible), tonsillar grade 1\u20134, <b>retrognathia</b>","Correlates with severity; also predicts difficult intubation \u2014 <b>document it, it matters for anaesthesia</b>. MADs work particularly well in retrognathia"],
         ["Nasal airway","Anterior rhinoscopy: septal deviation, turbinate hypertrophy, polyps","Nasal obstruction worsens OSA and reduces CPAP tolerance"],
         ["Cardiovascular","RV heave, loud P2, raised JVP, peripheral oedema, hepatomegaly; AF","Cor pulmonale in severe or longstanding disease \u2014 same-day assessment"]
       ]},
       {b:"why", html:"STOP-BANG has 94% sensitivity for moderate\u2013severe OSA (AHI &gt;15) at a score of \u22653, which is why it is the recommended primary-care screening tool; its low specificity (35%) is acceptable because screening prioritises sensitivity. Nocturia and morning headache are the two most commonly missed presenting features."}
     ]},

    {id:"severe", nav:"Red flags &amp; driving", title:"Red flags, and the advice that cannot wait", sub:"This section is the reason the page exists. Sleepiness is a public-safety issue, not only a health one.",
     blocks:[
       {b:"warn", html:"<b>Untreated OSA with excessive daytime sleepiness carries a legal duty to inform the DVLA, and the patient must be advised not to drive until it is controlled. Document that advice.</b> It is the <em>symptoms</em>, not the diagnosis, that trigger the duty \u2014 though known OSA must be disclosed when renewing a Group 2 licence."},
       {b:"cards", items:[
         {tone:"red", h:"Falling asleep at the wheel, or a near-miss", html:"<b>Stop driving immediately and notify the DVLA.</b> Untreated OSA carries a <b>7-fold</b> increase in road-traffic accident risk. Documentation of the advice is mandatory."},
         {tone:"red", h:"Commercial / HGV / PSV driver with sleepiness", html:"<b>Must stop driving immediately.</b> A DVLA <b>Group 2</b> licence requires OSA to be treated with documented compliance (minimum 1 month of CPAP) and <b>ESS &lt;9</b> before relicensing. Occupational implications \u2014 they cannot work until assessed and treated."},
         {tone:"red", h:"Obesity hypoventilation syndrome", html:"<b>BMI &gt;35 with daytime hypercapnia</b> (confusion, morning headache) and hypoxia \u2014 <b>cyanosis</b> with daytime somnolence and low SpO\u2082 in a very obese patient \u2192 <b>arterial blood gas + urgent respiratory referral</b>; the risk is decompensated respiratory failure, not just simple OSA. Life-threatening: about <b>50% five-year mortality untreated</b>, and needs CPAP or BiPAP plus aggressive weight management, not routine referral."},
         {tone:"red", h:"Severe nocturnal desaturation", html:"<b>Nocturnal SpO\u2082 &lt;80%</b> on oximetry \u2192 severe OSA or hypoventilation \u2192 urgent sleep medicine referral."},
         {tone:"red", h:"Signs of cor pulmonale", html:"OSA with RV heave, raised JVP and peripheral oedema \u2192 pulmonary hypertension from chronic hypoxia \u2192 <b>same-day hospital assessment</b>."},
         {tone:"amber", h:"Witnessed prolonged apnoeas", html:"Apnoeas <b>&gt;10 seconds</b> repeatedly, with morning headache and cognitive impairment \u2192 moderate\u2013severe OSA \u2192 urgent sleep study."},
         {tone:"amber", h:"New resistant hypertension with snoring", html:"OSA causes hypertension in <b>30\u201350%</b>, frequently resistant until the OSA is treated \u2014 include it in the secondary hypertension screen."},
         {tone:"amber", h:"Child snoring with behaviour problems", html:"Paediatric OSA causes neurocognitive impairment, falling school performance and growth retardation \u2192 <b>paediatric ENT for adenotonsillectomy assessment</b>."},
         {tone:"purple", h:"NG12 \u2014 no criterion applies", html:"Snoring and OSA are not NICE NG12 suspected-cancer criteria. If the picture is instead <b>unilateral nasal obstruction with bleeding</b>, or <b>hoarseness or a neck lump persisting \u22653 weeks in an adult \u226545</b>, switch to the relevant NG12 head-and-neck route rather than managing it as snoring."}
       ]},
       {b:"cards", items:[
         {tone:"amber", h:"\ud83c\udf7a Alcohol and sedatives", html:"Both worsen airway collapse and sleepiness. Reduce evening alcohol; review benzodiazepines, Z-drugs and opioids \u2014 and do not add them."},
         {tone:"red", h:"\ud83d\udc8a Opioids are dangerous here", html:"Opioids <b>blunt the arousal response to hypoxia</b> \u2014 the mechanism that wakes the patient to restore breathing \u2014 and lengthen apnoeas. Prescribing them in untreated severe OSA can cause <b>fatal nocturnal respiratory arrest</b>."}
       ]}
     ]},

    {id:"spectrum", nav:"The spectrum", title:"The snoring spectrum \u2014 not everything needs CPAP", sub:"Simple snoring, OSA, upper airway resistance syndrome, hypoventilation and central apnoea are different conditions with different treatments.",
     blocks:[
       {b:"table", head:["Condition","Features","Treatment implication"], rows:[
         ["<b>Primary (simple) snoring</b>","Snoring without apnoeas, without daytime sleepiness, no cardiovascular impact. <b>ESS &lt;10.</b> The partner is disturbed; the patient is well","<b>No CPAP indication</b> \u2014 lifestyle measures, and a MAD if social impact is severe"],
         ["<b>Obstructive sleep apnoea</b>","Repetitive upper-airway collapse (partial = hypopnoea, complete = apnoea). <b>AHI: mild 5\u201314, moderate 15\u201329, severe \u226530/hour</b>","CPAP for moderate\u2013severe or symptomatic mild"],
         ["<b>Upper airway resistance syndrome</b>","Increased respiratory effort without discrete apnoeas \u2014 EEG arousals, sleepiness, snoring, <b>normal AHI</b>","Diagnosed on polysomnography; CPAP is effective"],
         ["<b>Obesity hypoventilation syndrome</b>","<b>BMI &gt;35 + daytime PaCO\u2082 &gt;6 kPa</b> + sleep-disordered breathing; <b>90%</b> have coexisting OSA","<b>BiPAP often required</b>; high cardiovascular and respiratory mortality"],
         ["<b>Central sleep apnoea</b>","Apnoeas <b>without</b> respiratory effort. Heart failure (Cheyne\u2013Stokes), opioids, altitude, brainstem pathology","Specialist-initiated. <b>Adaptive servo-ventilation is contraindicated in HFrEF</b> \u2014 SERVE-HF (2015) showed increased cardiovascular mortality"],
         ["<b>Nasal obstruction</b>","Deviated septum, chronic rhinitis, polyps, adenoid hypertrophy in children","Nasal steroid; ENT if obstruction is significant"]
       ]},
       {b:"why", html:"Simple snoring without apnoeas or daytime symptoms does not need CPAP \u2014 it is expensive and has real side effects. Conversely, the SERVE-HF finding matters: adaptive servo-ventilation, once used for Cheyne\u2013Stokes respiration in heart failure, increased cardiovascular mortality in HFrEF and is now contraindicated in that group."}
     ]},

    {id:"workup", nav:"Investigations", title:"Investigations \u2014 oximetry first", sub:"Home oximetry is the practical first-line test and can convert a 6\u201312 month wait into an urgent referral.",
     blocks:[
       {b:"table", head:["Test","Role","Notes"], rows:[
         ["<b>Home overnight oximetry</b> <span class='mg-src'>first-line</span>","Oxygen desaturation index (dips &gt;4%/hour)","<b>ODI &gt;15/hour is significant</b> \u2014 ~85% sensitivity, 80% specificity for moderate\u2013severe OSA; use it to justify urgent sleep-study referral. GP-arranged in many regions"],
         ["<b>Bloods</b>","Comorbidity and contributors","<b>TFTs</b> (hypothyroidism both causes and worsens OSA \u2014 mandatory), <b>FBC</b> (polycythaemia from chronic hypoxia \u2014 reversible with effective CPAP), <b>HbA1c</b>, fasting lipids, plus BMI and BP documented"],
         ["<b>Arterial blood gas</b>","When hypoventilation is suspected","BMI &gt;35 with morning headache and hypoxia \u2014 <b>daytime PaCO\u2082 &gt;6.0 kPa is diagnostic of OHS</b>. Hospital or respiratory clinic arranged"],
         ["<b>Polysomnography</b>","Gold standard, specialist-arranged","AHI, sleep stages, arousal index, limb movements, CPAP titration \u2014 not routinely needed in straightforward OSA"],
         ["Limited-channel home sleep testing","Used instead of full PSG in some centres","Acceptable for uncomplicated suspected OSA; avoid where a complex sleep disorder (central apnoea, parasomnia) is suspected"]
       ]}
     ]},

    {id:"lifestyle", nav:"Lifestyle", title:"Weight, position and risk-factor modification", sub:"This is the treatment that runs underneath everything \u2014 and the only one that can cure OSA.",
     blocks:[
       {b:"table", head:["Measure","What to advise","Effect"], rows:[
         ["<b>Weight loss</b>","Structured calorie restriction plus exercise; GLP-1 or bariatric pathway if eligible. Tier 3 referral if BMI &gt;35 with comorbidities","<b>10% loss \u2192 AHI down 25\u201330%</b>; <b>15% can eliminate mild OSA</b>; intensive lifestyle intervention eliminated OSA in <b>63%</b> of obese patients; bariatric surgery reduces AHI <b>60\u201380%</b>"],
         ["<b>Lateral sleep position</b>","Side-sleeping; positional alarms or a sleep-position trainer","Reduces severity by <b>~50% in positional OSA</b>, which is around <b>60%</b> of all OSA. Simple, free, effective"],
         ["<b>Alcohol</b>","Avoid for at least <b>4 hours before bed</b>; AUDIT-C screen","Relaxes upper-airway muscles \u2014 even <b>2 units before bed increases AHI by 25%</b>"],
         ["<b>Smoking</b>","Cessation via NHS service","Causes upper-airway mucosal inflammation and nasal congestion; stopping reduces AHI"],
         ["<b>Avoid sedatives</b>","Benzodiazepines, Z-drugs, opioids, muscle relaxants","Relax the airway and blunt the arousal response \u2014 avoid, or use with extreme caution"],
         ["<b>Head-of-bed elevation</b>","Raise by <b>30\u00b0</b> (wedge pillow or bed tilt)","Reduces gravitational tongue and soft-palate prolapse \u2014 useful in mild OSA and where lateral sleeping is not tolerated"],
         ["<b>Nasal hygiene</b>","Daily saline irrigation where congested","Improves nasal airflow, OSA severity and <b>CPAP tolerance</b>"],
         ["<b>Exercise</b>","<b>150 minutes/week</b> moderate activity","Improves OSA severity <em>independently</em> of weight loss \u2014 less pharyngeal fat, better airway tone"],
         ["<b>Sleep hygiene</b>","Regular schedule and adequate sleep opportunity","Comorbid poor sleep amplifies the daytime impact"]
       ]}
     ]},

    {id:"ladder", nav:"Treatment", title:"Treatment by severity \u2014 CPAP, devices and adjuncts", sub:"Shared care: the sleep service titrates and provides; primary care sustains adherence and treats the comorbidities.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1st", title:"CPAP \u2014 moderate\u2013severe, or symptomatic mild", when:"NICE TA139",
          html:"Provided by the sleep clinic with mask fitting and titration; therapeutic pressure typically <b>8\u201312 cmH\u2082O</b>, reducing AHI to <b>&lt;5/hour</b>. <b>Requires \u22654 hours/night for clinical and cardiovascular benefit</b> \u2014 use of <b>&lt;4 hours/night</b> improves symptoms but leaves significant cardiovascular risk. Reduces systolic BP by <b>3\u20135 mmHg</b> (about as much as adding one antihypertensive), reduces AF recurrence after cardioversion, and improves insulin sensitivity."},
         {step:"Alt", title:"Mandibular advancement device", when:"mild\u2013moderate, or CPAP not tolerated",
          fromLabel:"CPAP declined or milder disease",
          html:"Titratable custom device advancing the mandible <b>5\u201310 mm</b> to enlarge the posterior airway; fitted via dentist or ENT. <b>70\u201380% efficacy in mild\u2013moderate OSA</b>, and particularly effective in retrognathia. Needs dental assessment \u2014 contraindicated with poor dentition or TMJ disease. NHS-funded through some sleep clinics."},
         {step:"Fix", title:"Treat the contributors", when:"alongside device therapy",
          fromLabel:"often overlooked",
          html:"<b>Nasal obstruction:</b> mometasone <b>200 micrograms/spray, 2 sprays each nostril once daily</b> reduces mucosal oedema and mouth-breathing; OTC nasal dilator strips give modest benefit in primary snoring. <b>Positional OSA:</b> positional therapy where lateral AHI is about half the supine AHI. <b>Hypothyroidism:</b> levothyroxine replacement may resolve OSA \u2014 <b>reassess with oximetry after 3\u20136 months euthyroid before committing to lifelong CPAP</b>."},
         {step:"Adjunct", title:"Weight management \u00b1 surgery", when:"throughout",
          fromLabel:"the only curative route",
          html:"Intensive weight management continues regardless of device therapy; <b>bariatric surgery can be curative</b> in obesity-related OSA (remission in about 80%). ENT or maxillofacial surgery only in selected anatomical cases."},
         {step:"Rescue", title:"CPAP intolerance \u2014 fix it, don't abandon it", when:"before declaring failure",
          fromLabel:"70% achieve compliance with support",
          html:"Work through mask type (nasal pillow, nasal, full-face), <b>heated humidifier</b> for dryness, pressure ramp-up, and <b>auto-titrating CPAP (APAP)</b>. Re-refer for troubleshooting rather than letting the therapy quietly lapse."}
       ]},
       {b:"warn", html:"<b>OSA has no first-line drug treatment</b> \u2014 CPAP and weight loss are the mainstays. Never treat the \u201cinsomnia\u201d or the sleepiness with sedatives or hypnotics: they worsen airway collapse and daytime somnolence."}
     ]},

    {id:"monitor", nav:"Monitoring", title:"Adherence, comorbidities, and the driving reassessment", sub:"Compliance data is downloadable from the CPAP device \u2014 request it at annual review.",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["CPAP compliance + ESS","<b>4\u20136 weeks</b> (sleep clinic), then annually","Data download gives hours/night, residual AHI and leak. <b>If ESS remains \u226510 after 4 weeks of adequate CPAP</b> \u2192 review mask fit and pressure, or reconsider the diagnosis"],
         ["Mask and equipment","Masks replaced roughly <b>every 6 months</b>","Sleep-clinic responsibility; GP flags problems early rather than letting use lapse"],
         ["Weight","Monthly in obese OSA","After <b>\u226510% loss</b>, repeat oximetry to reassess severity \u2014 CPAP can sometimes be safely stepped down or stopped"],
         ["Blood pressure","Regularly","Treat resistant hypertension; effective CPAP improves BP by 3\u20135 mmHg"],
         ["Cardiometabolic review","Annually","BP, HbA1c, lipids, AF check, mood. OSA is an independent cardiovascular risk factor \u2014 effective treatment improves QRISK"],
         ["<b>Driving status</b>","Each review until controlled","<b>Group 1:</b> may resume once symptoms are controlled and <b>ESS &lt;9</b>. <b>Group 2:</b> DVLA medical review required before relicensing. Confirm the DVLA was notified and document"]
       ]},
       {b:"cards", items:[
         {tone:"amber", h:"Still sleepy? Work through this before calling it refractory", html:"<b>1</b> Is CPAP actually used &gt;4 h/night \u2014 mask, pressure, humidification, nasal congestion all addressed? <b>2</b> Is weight falling or static \u2014 escalate to GLP-1 or bariatric if eligible. <b>3</b> Evening alcohol, benzodiazepines or opioids still on board? <b>4</b> <b>Another cause of sleepiness</b> \u2014 depression, hypothyroidism, anaemia, shift work, inadequate sleep opportunity, narcolepsy. <b>5</b> Comorbidity persisting (resistant hypertension, AF) \u2014 is the OSA genuinely controlled? <b>6</b> Wrong device or re-graded severity \u2014 a MAD is insufficient for severe disease \u2192 back to the sleep clinic."}
       ]},
       {b:"cards", items:[
         {tone:"red", h:"\ud83d\udea8 999", html:"\u201cAcute breathlessness with blue lips, oxygen saturation <b>&lt;88%</b> at home, or new confusion \u2014 call 999.\u201d"},
         {tone:"red", h:"\ud83d\udd34 Same-day", html:"\u201cNew or worsening morning headaches, or memory and thinking getting worse \u2014 contact us the same day; it can mean carbon dioxide is building up overnight.\u201d"},
         {tone:"amber", h:"\ud83d\ude97 Driving", html:"\u201cDon't drive when you feel sleepy, and tell the DVLA \u2014 especially if you drive for a living, where you may need to be treated first.\u201d"},
         {tone:"amber", h:"\ud83d\ude37 Tell us before you give up on the mask", html:"\u201cCPAP only works on the nights you use it. If the mask is uncomfortable, sore on the nose, or too dry \u2014 tell us and we will fix it rather than you stopping.\u201d"},
         {tone:"green", h:"\ud83c\udf7a Evenings matter", html:"\u201cAlcohol and sleeping tablets in the evening make it worse \u2014 best avoided.\u201d"}
       ]},
       {b:"say", html:"Sleep apnoea is very treatable. The sleep test tells us how severe it is, and a mask at night usually transforms the daytime tiredness \u2014 alongside weight loss and cutting evening alcohol. Until it is controlled, please don't drive if you feel sleepy, and let the DVLA know: it is the law and it protects you."}
     ]},

    {id:"loop", nav:"Not responding?", title:"Still sleepy / not improving? Work through this", sub:"",
     blocks:[
       {b:"cards", cols:2, items:[

         {tone:"amber", h:"3 · Alcohol / sedatives", html:"Evening alcohol, benzos, opioids still on board undermining it?"},

         {tone:"amber", h:"5 · Under-treated comorbidity", html:"Resistant hypertension/AF persisting → is the OSA genuinely controlled? Recheck with the sleep service."},
         {tone:"blue", h:"6 · Wrong device/severity", html:"MAD insufficient for severe disease, or severity re-graded → back to the sleep clinic."}
       ]}

    {id:"refer", nav:"Refer", title:"Refer \u2014 who goes where, and how fast", sub:"Referral quality decides speed: Epworth, STOP-BANG, comorbidities and driving status all belong in the letter.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same-day hospital", html:"Suspected <b>cor pulmonale</b> (RV failure, peripheral oedema, polycythaemia), suspected <b>OHS with daytime hypercapnia</b>, or acute desaturation with cardiovascular compromise."},
         {tone:"amber", h:"Urgent sleep clinic", html:"<b>Commercial (Group 2) driver</b> \u2014 cannot return to work until assessed and treated; <b>ESS \u226516</b>; witnessed prolonged apnoeas; <b>STOP-BANG \u22655 with ESS \u226510</b>; severe symptoms with unstable comorbidity."},
         {tone:"plain", h:"Routine sleep clinic", html:"<b>STOP-BANG \u22653 with ESS \u226510</b>, or <b>oximetry ODI &gt;15</b>. Via respiratory or sleep medicine \u2014 includes CPAP titration, follow-up and compliance monitoring."},
         {tone:"plain", h:"ENT", html:"Simple snoring with significant nasal obstruction (deviated septum, polyps); <b>tonsillar hypertrophy grade 3\u20134</b>; retrognathia for MAD consideration; <b>paediatric OSA for adenotonsillectomy</b>."},
         {tone:"plain", h:"Tier 3 weight management / bariatric", html:"<b>BMI &gt;35 with OSA</b> and metabolic comorbidity. <b>15\u201320% weight loss can eliminate mild\u2013moderate OSA</b>; bariatric surgery reduces AHI by 60\u201380%."},
         {tone:"plain", h:"Respiratory, cardiology, maxillofacial", html:"CPAP failure or intolerance, diagnostic uncertainty, <b>COPD\u2013OSA overlap syndrome</b>; resistant hypertension, AF or heart failure linked to OSA; selected surgical candidates."},
         {tone:"cream", h:"Simple snoring \u2014 no referral", html:"<b>STOP-BANG &lt;3, ESS &lt;10</b>, no witnessed apnoeas, no cardiovascular impact \u2192 lifestyle measures and <b>review at 3 months</b>. Refer if not improving or if the snoring is significantly affecting the relationship."}
       ]},
       {b:"why", html:"NICE TA139 recommends CPAP for moderate\u2013severe OSA on strong cost-effectiveness grounds \u2014 a QALY gain of about <b>0.14/year at roughly \u00a33,000/QALY</b>, well within the NICE threshold \u2014 given its effect on cardiovascular risk, accident prevention and quality of life. Commercial drivers are an occupational-safety priority: they cannot legally drive until OSA is confirmed treated with documented compliance and an Epworth score below 9."},
       {b:"say", html:"I'm referring you for a sleep study to confirm this and grade how severe it is \u2014 then the sleep team set you up, usually with CPAP. Meanwhile the weight, the alcohol and the driving advice are the parts we start on today."}
     ]},
