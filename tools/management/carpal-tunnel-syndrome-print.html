<meta name="description" content="Carpal tunnel syndrome: a clinical diagnosis graded by severity, with a neutral night splint first-line, a limited role for corticosteroid injection, and expedited specialist referral where there is thenar wasting, thumb weakness, objective sensory loss or persistent disabling numbness. NICE NG127 gives the referral framework; the treatment ladder follows the BSSH/GIRFT and local pathway." />

<script>
MG.render({
  icon:"🤚",
  title:"Carpal tunnel syndrome — the complete guide",
  eyebrow:"Protocol · NICE NG127 (referral) · BSSH/GIRFT pathway · severity guides the next step",
  stemTitle:"Thenar wasting, thumb weakness or persistent numbness is advanced carpal tunnel — not a reason to splint harder, but a reason for expedited specialist assessment",
  stemSub:"One page for the whole condition. It is a <b>clinical diagnosis</b>. Once CTS is suspected, <b>severity, functional impact, comorbidity and diagnostic certainty determine the next step</b>: intermittent symptoms without objective deficit respond well to a <b>neutral-position night splint</b>, which is genuine first-line treatment and often sufficient; persistent symptoms may settle with a <b>corticosteroid injection</b>, which is a limited treatment rather than a repeated course; but thenar wasting, thumb abduction weakness, objective sensory loss or persistent disabling numbness should prompt expedited referral for specialist assessment and consideration of decompression. Consider alternative diagnoses, and look for associated conditions — pregnancy, hypothyroidism, diabetes — while recognising that treating them does not reliably reverse established nerve compression. NICE NG127 gives the referral framework; the treatment ladder below is a BSSH/GIRFT-informed local pathway, not a NICE treatment sequence.",
  guideline:"BSSH/GIRFT adult carpal tunnel syndrome pathway (2022) · NICE NG127 (2019, updated 2023; recommendation 1.10.9, referral)",
  reviewed:"14 September 2026",
  nextReview:"14 March 2027",
  meta:[
    {t:"BSSH/GIRFT carpal tunnel pathway (2022)"},{t:"NICE NG127 — referral"},
    {t:"Thenar wasting or weakness → expedited referral, don't splint on", tone:"tw"},
    {t:"Pregnancy-related CTS often resolves postpartum — refer if objective deficit", tone:"ok"},
    {t:"v2.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#diagnose"><b>Diagnose</b><small>Clinical · alternatives</small></a><a href="#splint"><b>Splint</b><small>Genuine first-line</small></a><a href="#ladder"><b>Ladder</b><small>Inject · decompress</small></a><a href="#investigate"><b>Test</b><small>NCS · bloods</small></a><a href="#refer"><b>Refer</b><small>Expedite if deficit</small></a></div>',
  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"blue", h:"The hallmark, and the question that clinches it", html:"Tingling, numbness or pain in the median distribution — thumb, index, middle and the radial half of the ring finger — worse at NIGHT, and relieved by shaking the hand. The nocturnal pattern and the shaking are the two most useful pieces of history; pain may radiate up the forearm, which misleads people towards the neck. <b>Tinel's and Phalen's tests are supportive, not definitive; a negative test does not exclude CTS, particularly in severe disease or when symptoms are intermittent. The diagnosis is clinical.</b>"},
    {tone:"red", h:"⚠ Thenar wasting or weakness = expedited referral", html:"Thenar wasting, thumb abduction weakness, objective sensory loss or persistent disabling numbness indicates more advanced CTS and should prompt expedited referral for specialist assessment and consideration of decompression — not a reason to persist with splinting. It is not usually an emergency referral unless the deficit is rapidly progressive, follows acute trauma, or another urgent neurological diagnosis is suspected. Constant numbness alone is a severity marker that should prompt examination and usually nerve-conduction/specialist assessment, not proof of established nerve damage. Check thumb abduction power in every patient, not just the ones who mention weakness."},
    {tone:"green", h:"The night splint is genuine first-line treatment", html:"A neutral-position wrist splint worn at night for several weeks is first-line for mild-to-moderate CTS — and many people improve without any drug or procedure at all. Review response according to the local MSK/hand pathway; many local pathways use approximately 6–12 weeks of conservative treatment, provided there is no objective motor or sensory deficit. A 4–6-week review checks adherence and response, but failure at exactly 6 weeks does not mandate surgery. \"Neutral position\" matters: a splint that holds the wrist flexed makes it worse. Add daytime use if symptoms allow, and modify aggravating wrist postures and repetitive tasks."},
    {tone:"amber", h:"Corticosteroid injection is a limited middle step", html:"Consider a local corticosteroid injection for persistent mild-to-moderate CTS, pregnancy-related CTS, or as a bridge while awaiting definitive treatment. It may give short-term relief but recurrence is common, and it is generally a limited treatment rather than a routine repeated course: repeated injections risk median nerve or tendon injury, skin/fat atrophy, transient hyperglycaemia, infection and masking progressive nerve damage. Recurrence or failure should prompt reassessment and consideration of specialist referral. Take the drug, dose and technique from the current local formulary and product information."},
    {tone:"blue", h:"Look for associated conditions and alternatives", html:"Associations include pregnancy, hypothyroidism, diabetes, obesity, rheumatoid arthritis, repetitive wrist use and acromegaly — but treating these does not reliably reverse established nerve compression. Pregnancy-related CTS is often self-limiting, so splint and reassure — but refer if there is persistent objective weakness, thenar wasting, constant sensory loss, severe functional impairment or symptoms that do not improve postpartum. Consider HbA1c with diabetes risk, atypical or bilateral symptoms, recurrent disease or other clinical indications, and TFTs when symptoms or history suggest thyroid disease. Consider alternatives such as cervical radiculopathy, ulnar or peripheral neuropathy and cervical myelopathy."},
    {tone:"amber", h:"Nerve conduction studies: not routine, but know the indications", html:"Nerve-conduction studies are not required before splinting in a typical mild presentation. Arrange them, or refer through a pathway that arranges them, where the diagnosis is uncertain, symptoms are atypical, there is diabetes or another neuropathy, there is coexisting ulnar neuropathy, symptoms recur or persist (including after surgery), or the result is required before decompression. Do not delay NCS in severe objective deficit to complete a prolonged conservative course. Oral corticosteroids are not a routine treatment for CTS; NSAIDs may provide general analgesia but do not decompress the median nerve or alter the underlying disease."}
  ],
  pathwaySub:"Five steps — a BSSH/GIRFT-informed local pathway, not a NICE treatment sequence. Severity, functional impact, comorbidity and diagnostic certainty in step one guide the rest.",
  pathway:[
    {title:"Diagnose clinically and grade the severity", html:"Median-distribution symptoms worse at night; Tinel's and Phalen's as supportive tests; then look specifically for thenar bulk, thumb abduction strength and objective sensory loss. <b>Intermittent versus constant, and any objective deficit, is the fork.</b> Consider alternative diagnoses.", alert:true},
    {title:"Consider associated conditions and alternatives", html:"Pregnancy, hypothyroidism, diabetes, obesity, RA, repetitive use, acromegaly; test HbA1c/TFTs only if clinically indicated. Treating these does not reliably reverse established compression."},
    {title:"Splint — neutral position, at night, for several weeks", html:"Plus activity and ergonomic modification; review at about 4–6 weeks, with many local pathways using approximately 6–12 weeks of conservative treatment if there is no objective deficit. This alone resolves many cases."},
    {title:"Inject if the splint is insufficient", html:"Local corticosteroid for persistent mild-to-moderate disease, as a bridge to definitive treatment, or in pregnancy — a limited treatment, not a routine repeated course."},
    {title:"Refer for specialist assessment when severe or refractory", html:"Thenar wasting, thumb abduction weakness, objective sensory loss or persistent disabling numbness — expedited referral for assessment and consideration of decompression; failed conservative trial — standard pathway."}
  ],
  sections:[

    {id:"diagnose", nav:"Diagnose", title:"Step 1 — the clinical diagnosis and the severity grading",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>Symptoms</b>","Tingling, numbness or pain in the median distribution (thumb, index, middle, radial half of the ring finger), worse at night; shaking the hand relieves it. May radiate up the forearm"],
         ["<b>Signs</b>","<b>Tinel's and Phalen's tests are supportive, not definitive</b> — a negative test does not exclude CTS, particularly in severe disease or when symptoms are intermittent. In severe disease: thenar wasting, weak thumb abduction and sensory loss"],
         ["<b>Examination</b>","Thumb abduction strength, ideally compared with the opposite side · thenar bulk · objective light-touch or two-point sensory assessment · grip and pinch function · inspection for trigger finger, arthritis or other hand pathology · cervical examination where symptoms are atypical or there are proximal signs"],
         ["<b>Associated conditions</b>","Pregnancy, hypothyroidism, diabetes, obesity, rheumatoid arthritis, repetitive wrist use, acromegaly"],
         ["<b>Consider alternatives</b>","C6/C7 cervical radiculopathy · ulnar neuropathy · diabetic or other peripheral neuropathy · cervical myelopathy · pronator syndrome or proximal median neuropathy · thumb-base osteoarthritis · inflammatory arthritis · brachial plexopathy · thoracic outlet syndrome, where clinically appropriate"],
         ["<b>Red flags for another neurological diagnosis</b>","Widespread or bilateral non-median sensory loss · brisk reflexes · gait disturbance · hand clumsiness out of proportion to median symptoms · neck pain with upper motor-neuron signs · rapidly progressive weakness"],
         ["<b>Assess severity — the fork</b>","Intermittent versus constant symptoms · sensory or motor deficit · functional impact · comorbidity (diabetes, polyneuropathy, cervical disease, pregnancy) · occupation and functional demands · patient preference · local access to NCS and surgery"]
       ]},
       {b:"why", html:"<b>Carpal tunnel is a clinical diagnosis, and severity guides treatment.</b> Mild-to-moderate intermittent symptoms respond to splinting or injection, while thenar wasting, thumb abduction weakness, objective sensory loss or persistent disabling numbness indicates more advanced CTS needing expedited specialist assessment and consideration of decompression. A fixed deficit may not recover fully after decompression. So the examination that matters is not Tinel's — it is thumb abduction power and a look at the thenar eminence, because that is what separates a splint from a referral."}
     ]},

    {id:"splint", nav:"Splint", title:"Step 2 — splinting and activity: the genuine first line",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"🌙 Night splint", html:"A neutral-position wrist splint worn at night is first-line and often sufficient for mild-to-moderate CTS. Wear it for several weeks and review response according to the local MSK/hand pathway — many use approximately 6–12 weeks of conservative treatment if there is no objective motor or sensory deficit."},
         {tone:"blue", h:"⌨️ Activity modification", html:"Adjust aggravating wrist postures and repetitive tasks; ergonomic review of workstation or occupational demands."},
         {tone:"green", h:"🤰 Pregnancy and associated conditions", html:"<b>Pregnancy-related CTS is often self-limiting</b> — splint and reassure; consider an injection if severe or disabling. <b>Refer if there is persistent objective weakness, thenar wasting, constant sensory loss, severe functional impairment or symptoms that do not improve postpartum.</b> Manage hypothyroidism, diabetes and weight on their own merits — this does not reliably reverse established nerve compression."},
         {tone:"blue", h:"💬 What to say about the splint", html:"<b>It must hold the wrist NEUTRAL, not flexed</b> — a badly fitted splint is a common reason \"splinting didn't work\"."}
       ]},
       {b:"why", html:"Nocturnal wrist splinting is the genuine first-line treatment — many improve without any drug or procedure. That is worth saying explicitly to a patient who arrives expecting either tablets or an operation, because it sets up adherence to something that usually works."}
     ]},

    {id:"ladder", nav:"Ladder", title:"Step 3 — BSSH/GIRFT-informed local management pathway, not a NICE treatment sequence",
     blocks:[
       {b:"table", head:["Step","When","Treatment"], rows:[
         ["<b>Step 1 — night splint plus address contributors</b>","<b>Mild to moderate</b>","Neutral-position wrist splint at night (with or without daytime use) for several weeks, reviewed per the local pathway (many use approximately 6–12 weeks if there is no objective deficit); manage hypothyroidism or diabetes on their own merits; activity modification. <b>Pregnancy-related CTS often resolves postpartum — splint and reassure, but refer if objective deficit</b>"],
         ["<b>Step 2 — corticosteroid injection</b>","<b>Persistent mild-to-moderate symptoms, splint insufficient</b>","Local corticosteroid injection into the carpal tunnel may give short-term relief, but recurrence is common; it is generally a limited treatment rather than a routine repeated course. <b>Particularly useful as a bridge while awaiting definitive treatment, or in pregnancy (BSSH/GIRFT: a single injection)</b>. Recurrence or failure → reassess and consider specialist referral. Drug, dose and technique from the local formulary and product information"],
         ["<b>Step 3 — surgical decompression</b>","<b>Severe, or failed conservative treatment</b>","Carpal tunnel decompression is the definitive treatment for persistent or severe compression and often improves symptoms, but recovery may be incomplete when there is longstanding sensory or motor nerve damage. For thenar wasting, weakness, objective sensory loss or persistent disabling numbness, or symptoms not responding to conservative measures. Refer to hand/orthopaedic surgery or the local MSK pathway"]
       ]},
       {b:"warn", html:"Thenar wasting, thumb abduction weakness, objective sensory loss or persistent disabling numbness indicates more advanced CTS — arrange expedited referral rather than prescribing a stronger splint. <b>Oral corticosteroids are not a routine treatment for CTS. NSAIDs may provide general analgesia but do not decompress the median nerve or alter the underlying disease.</b>"},
       {b:"table", head:["Presentation","Suggested pathway"], rows:[
         ["<b>Typical mild-to-moderate CTS</b>","1. Confirm a typical clinical pattern · 2. Examine thenar bulk, thumb abduction and sensation · 3. Consider diabetes/thyroid testing if clinically indicated · 4. Neutral-position night splint · 5. Ergonomic and aggravating-activity modification · 6. Review after approximately 4–6 weeks, following the local pathway · 7. If persistent, consider local corticosteroid injection or referral"],
         ["<b>Severe CTS</b>","1. Thenar wasting, weakness, persistent sensory loss or constant disabling numbness · 2. Arrange expedited hand/orthopaedic/MSK referral · 3. Request NCS according to local pathway, particularly with diabetes, atypical features or diagnostic uncertainty · 4. Consider injection only as a bridge where appropriate · 5. Do not delay referral by prescribing a stronger splint"],
         ["<b>Pregnancy-related CTS</b>","1. Neutral night splint and reassurance · 2. Consider injection if severe or disabling · 3. Refer if motor deficit, thenar wasting, constant sensory loss or persistent postpartum symptoms"]
       ]}
     ]},

    {id:"investigate", nav:"Test", title:"Step 4 — when to investigate",
     blocks:[
       {b:"table", head:["Test","Indication"], rows:[
         ["<b>Nerve conduction studies</b>","Not required before splinting in a typical mild presentation. Arrange them, or refer through a pathway that arranges them, where the diagnosis is uncertain, symptoms are atypical, there is diabetes or another neuropathy (including suspected generalised neuropathy), there is coexisting ulnar neuropathy, symptoms are recurrent or persistent or recur after surgery, or the result is required before decompression. Do not delay NCS in severe objective deficit simply to complete a prolonged conservative course"],
         ["<b>Bloods</b>","<b>Not routine for every patient.</b> Consider HbA1c with diabetes risk, atypical or bilateral symptoms, recurrent disease or other clinical indications; check TFTs when symptoms or history suggest thyroid disease"],
         ["<b>Review</b>","Reassess the response to splint or injection; escalate if any deficit progresses"]
       ]},
       {b:"dl", rows:[
         ["<b>About 4–6 weeks</b>","Review adherence and response to nocturnal wrist splinting, following the local pathway — many continue conservative treatment for approximately 6–12 weeks if there is no objective deficit; failure at exactly 6 weeks does not mandate surgery. Mild-to-moderate symptoms often improve. Pregnancy-related CTS often resolves postpartum — refer if objective deficit or persistent postpartum symptoms"],
         ["<b>If inadequate</b>","Consider a local corticosteroid injection, or referral. It may give short-term relief and can bridge to definitive treatment, but it is a limited treatment rather than a repeated course — recurrence or failure should prompt reassessment and consideration of specialist referral"],
         ["<b>Persistent or severe</b>","Thenar wasting, thumb abduction weakness, objective sensory loss or persistent disabling numbness → expedited referral for specialist assessment, nerve conduction studies per the local pathway and consideration of carpal tunnel decompression. Persistent symptoms without objective deficit after an adequate splint trial → standard pathway referral"]
       ]},
       {b:"say", html:"Start with a night splint and we'll review how it's going in about four to six weeks — it must hold the wrist straight rather than bent, and for a lot of people that alone settles it. If that's not enough, an injection may help for a while, or we can refer you. And if symptoms are severe or your thumb muscles are weakening, I'd refer you promptly to a hand specialist, who may recommend an operation to release the nerve. That often improves symptoms, although recovery can be incomplete if the nerve has been squeezed for a long time."}
     ]},

    {id:"safety", nav:"Safety-net", title:"When to act fast",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"🟠 Thenar wasting or weakness — urgent, not usually an emergency", html:"Thenar wasting, thumb abduction weakness, objective sensory loss or persistent disabling numbness indicates more advanced CTS → expedited referral for specialist assessment and consideration of decompression. Thenar wasting alone is urgent but generally not an A&amp;E emergency."},
         {tone:"red", h:"🔴 Same-day or urgent emergency assessment", html:"Rapidly progressive weakness · acute traumatic CTS · acute severe swelling or compartment-like symptoms · symptoms suggesting a broader neurological emergency (for example, gait disturbance, brisk reflexes or upper motor-neuron signs) → reconsider the diagnosis and arrange same-day assessment."},
         {tone:"amber", h:"💬 Safety-net", html:"\"If your thumb muscles weaken, you start dropping things, or the numbness becomes constant rather than coming and going, contact us. If the weakness comes on quickly, follows an injury, or you notice problems with walking, balance or both hands, seek same-day help.\""},
         {tone:"green", h:"✓ What good looks like", html:"\"Most people find the night-time tingling settles within a few weeks of wearing the splint properly.\""}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Hand / orthopaedic / MSK — expedited (prompt specialist referral)", html:"Thenar wasting · thumb abduction weakness · objective sensory loss · persistent constant numbness · progressive symptoms · significant functional impairment · failure of an appropriate conservative trial · recurrent symptoms after injection or surgery — for specialist assessment, nerve studies per the local pathway and consideration of decompression. <b>A fixed deficit may not recover fully after decompression.</b> Refer in line with local pathways (NICE NG127 recommendation 1.10.9)."},
         {tone:"amber", h:"Routine / standard pathway", html:"Persistent intermittent symptoms without objective deficit · mild-to-moderate symptoms not responding to an adequate splint trial · diagnostic uncertainty without red flags."},
         {tone:"red", h:"Same-day or urgent emergency assessment", html:"Rapidly progressive weakness · acute traumatic CTS · acute severe swelling or compartment-like symptoms · symptoms suggesting a broader neurological emergency. Thenar wasting alone is urgent but generally not an A&amp;E emergency."},
         {tone:"blue", h:"Endocrine", html:"<b>If acromegaly or uncontrolled thyroid disease is suspected.</b>"},
         {tone:"cream", h:"Manage in primary care", html:"Mild-to-moderate intermittent CTS without objective deficit — splint with or without injection; pregnancy-related CTS, which is often self-limiting (refer if objective deficit or persistent postpartum symptoms). Related pages: <a href='hypothyroidism.html'>hypothyroidism</a> · <a href='type-2-diabetes.html'>type 2 diabetes</a> · <a href='rheumatoid-arthritis.html'>rheumatoid arthritis</a> · <a href='neuropathic-pain.html'>neuropathic pain</a>."}
       ]},
       {b:"say", html:"This is carpal tunnel syndrome — a nerve squeezed at the wrist, giving that tingling in the fingers that's worse at night. A night-time wrist splint often helps, and a steroid injection can settle it for a while. If there's constant numbness or the thumb muscle is weakening, I'd refer you promptly to a specialist; an operation to release the nerve is the definitive treatment and often improves symptoms, although recovery may be incomplete if the nerve has been compressed for a long time."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 52-year-old cleaner reports 8 months of tingling in the right thumb, index and middle fingers, <b>initially only at night</b> but now <b>present most of the day</b>. She has started <b>dropping cups</b>. She has type 2 diabetes. On examination there is <b>flattening of the thenar eminence</b> and <b>weak thumb abduction</b>. A previous entry six months ago reads \"advised night splint — review if no better\", with no review recorded. She asks for \"a stronger splint\"."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Does NOT issue another splint: thenar wasting with weak thumb abduction and constant symptoms indicates advanced CTS and needs EXPEDITED referral for specialist assessment and consideration of decompression — this is the whole case; examines thumb abduction power and the thenar eminence rather than relying on Tinel's; <b>explains that a fixed deficit may not recover fully after decompression</b>, which is what makes the referral expedited rather than routine; <b>notes the failed safety-net — advice given with no review booked</b> — and books follow-up this time; <b>arranges nerve conduction studies per the local pathway, which is indicated here because of her diabetes</b> (to exclude coexisting neuropathy) without delaying referral; <b>checks HbA1c and considers diabetic neuropathy or another alternative diagnosis</b>; considers a corticosteroid injection only as a bridge while awaiting surgery, not as an alternative to it; and <b>acknowledges the occupational impact</b> for someone whose work depends on her hands."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG127 — suspected neurological conditions: recognition and referral (2019, updated 2023), recommendation 1.10.9</b><br><a href="https://www.nice.org.uk/guidance/ng127" rel="noopener">nice.org.uk/guidance/ng127</a><span class="rd"> — the referral framework only: refer people with severe or persistent CTS after initial management in line with local pathways. NICE does not specify the splint duration, an injection step, a surgical threshold or routine pre-operative nerve-conduction testing. The following management detail comes from the BSSH/GIRFT adult carpal tunnel syndrome pathway (2022) and local hand/MSK pathways: the clinical diagnosis and median distribution, Tinel\u2019s and Phalen\u2019s tests, severity grading by intermittent versus constant symptoms and the presence of motor or sensory deficit, neutral-position night splinting as first-line, local corticosteroid injection for persistent mild-to-moderate disease, the indications for nerve conduction studies, and prompt referral for decompression where there is thenar wasting or constant symptoms</span></li>'+
         '<li><b>BSSH/GIRFT adult carpal tunnel syndrome pathway (2022) — including carpal tunnel syndrome in pregnancy</b><br><a href="https://www.bssh.ac.uk/_userfiles/pages/files/professionals/girft/girft-carpal_tunnel.pdf" rel="noopener">BSSH/GIRFT adult carpal tunnel syndrome pathway (PDF)</a><span class="rd"> — the treatment ladder: neutral night splint, approximately 12 weeks of non-operative management in many cases, injection as a treatment option (a single injection in pregnancy), indications for nerve conduction studies, and the favourable natural history with postpartum resolution</span></li>'+
         '<li><b>British Society for Surgery of the Hand — carpal tunnel syndrome</b><br><a href="https://www.bssh.ac.uk" rel="noopener">bssh.ac.uk</a><span class="rd"> — typical symptoms: nocturnal tingling/numbness in the median distribution, with weakness or dropping objects suggesting more advanced disease</span></li>'+
         '<li><b>Current local formulary and individual product information (SPC); BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — corticosteroid injection preparations, dose and technique. Proprietary clinical references are not the primary authority for the treatment pathway</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Carpal tunnel syndrome in primary care — BSSH/GIRFT carpal tunnel pathway (2022) and NICE NG127 (referral). NICE NG127 gives the referral framework; the treatment ladder is a BSSH/GIRFT-informed local pathway. A clinical diagnosis graded by severity: intermittent symptoms respond to a neutral-position night splint worn for several weeks (review at about 4–6 weeks; many local pathways use approximately 6–12 weeks of conservative treatment), which is genuine first-line treatment; a local corticosteroid injection is a limited option for persistent mild-to-moderate disease, as a bridge to definitive treatment, or in pregnancy. Thenar wasting, thumb abduction weakness, objective sensory loss or persistent disabling numbness indicates advanced CTS — arrange expedited specialist referral; same-day assessment only for rapidly progressive weakness, trauma, acute severe swelling or a suspected wider neurological emergency. Consider alternative diagnoses and associated conditions: pregnancy, hypothyroidism, diabetes, obesity, rheumatoid arthritis and acromegaly. Verify injection preparations against the local formulary and product information before use."
});
</script>
