  quickSub:"If you read nothing else on this page, read these six cards. Every number traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"\u26a0 Confusion, diplopia, nystagmus or ataxia = Wernicke's", html:"Vomiting plus <b>any</b> of those \u2192 <b>IV thiamine immediately and 999</b>. The classic triad is often incomplete \u2014 <b>eye signs alone are enough to treat</b>. Untreated it causes irreversible Korsakoff's syndrome and death."},
    {tone:"red", h:"Never give glucose before thiamine", html:"IV 5% dextrose without thiamine precipitates Wernicke's encephalopathy. Rehydrate with <b>0.9% sodium chloride plus potassium</b>, and give <b>thiamine before any glucose-containing fluid</b> in anyone vomiting persistently."},
    {tone:"amber", h:"Score it, then treat the score", html:"<b>PUQE</b> \u2014 three questions (hours of nausea, vomits, retches per day), each 1\u20135, total 3\u201315. <b>Mild \u22646</b>, <b>moderate 7\u201312</b>, <b>severe 13\u201315</b>. Score at <em>every</em> visit alongside weight and a clinical hydration assessment, and document it. <b>Do not use urinary ketones to judge severity or dehydration</b> (RCOG Green-top 69, 2024)."},
    {tone:"blue", h:"Thiamine for every woman admitted", html:"RCOG Green-top 69 (2024): give thiamine to <b>all women admitted with vomiting or severely reduced dietary intake</b> \u2014 oral 100 mg TDS or IV as vitamin B complex (Pabrinex), and <b>always before any dextrose or parenteral nutrition</b>. Consider it in the community too when vomiting is prolonged; <b>do not wait for a thiamine level</b>."},
    {tone:"green", h:"The drugs are safe \u2014 undertreating is not", html:"Prochlorperazine 5\u201310 mg TDS, cyclizine 50 mg TDS, promethazine 25 mg TDS all have decades of safety data (first-line in RCOG Green-top 69). <b>Do not withhold treatment over unfounded teratogenicity fears</b> \u2014 untreated hyperemesis harms mother and fetus."},
    {tone:"amber", h:"Admission threshold, and the route that avoids it", html:"Unable to keep down oral antiemetics, clinical dehydration or weight loss &gt;5% despite oral antiemetics, a confirmed or suspected comorbidity, postural hypotension, PUQE 13\u201315, K\u207a &lt;3.0 or Na\u207a &lt;130 \u2192 same-day hospital. When community measures fail and PUQE is under 13, use <b>ambulatory day care</b> for IV fluids and antiemetics \u2014 4\u20136 hours instead of a 3\u20135 day admission."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step is where women come to harm \u2014 usually by being told this is normal.",

    {title:"Exclude the dangerous", html:"Wernicke's (neurological signs), haematemesis (Mallory-Weiss), severe dehydration, abdominal pain (appendicitis, cholecystitis, pancreatitis, HELLP or pre-eclampsia after 20 weeks), fever and pyelonephritis, molar pregnancy, and suicidal ideation.", alert:true},
    {title:"Score and classify", html:"<b>PUQE</b> plus weight, hydration and urine dipstick. Separate normal NVP from moderate NVP from <b>hyperemesis gravidarum</b> \u2014 on the <b>Windsor definition</b>: onset before 16 weeks, severe nausea and/or vomiting, unable to eat and/or drink normally, and daily life strongly limited; dehydration supports it. Ketonuria does not grade it. Onset after 10 weeks or new vomiting after 16 weeks means look elsewhere."},
    {title:"Investigate proportionately", html:"Dipstick at every consultation; MSU if leucocytes or nitrites; U&amp;E, FBC, LFTs and TFTs in moderate or severe disease; USS to confirm an intrauterine singleton and exclude a mole. <b>Mild NVP with a normal dipstick needs no bloods.</b>"},
    {title:"Treat on the score", html:"Lifestyle and ginger for mild NVP only (not for HG); first-line antiemetic, with <b>thiamine</b> when intake is poor; step to metoclopramide (max 5 days, MHRA 2013) or ondansetron, which should not be discouraged; combine classes and add acid suppression before declaring failure."},
    {title:"Review at 24\u201348 hours", html:"<b>Not optional \u2014 it is the safety mechanism.</b> If it is not working, step up rather than repeat. Weekly review while symptoms persist, fit note and workplace adjustments, a mental-health assessment (PHQ-9/GAD-7) in pregnancy and postnatally, and Pregnancy Sickness Support."}
  ],
  sections:[

    {id:"severe", nav:"Exclude first", title:"Not all vomiting in pregnancy is NVP",
     sub:"Two jobs here: find the non-obstetric and obstetric mimics, and identify the woman who needs a hospital today.",
     blocks:[
       {b:"warn", html:"Wernicke's encephalopathy is the catastrophe this page exists to prevent. Thiamine depletion from persistent vomiting causes confusion, ophthalmoplegia and ataxia \u2014 and the triad is often incomplete, so ophthalmological signs alone should trigger immediate IV thiamine. Untreated it leads to irreversible Korsakoff's syndrome and death."},
       {b:"table", head:["Red flag","Features","Action"], rows:[
         ["<b>Neurological symptoms</b>","<b>Diplopia, nystagmus, confusion or ataxia</b> with vomiting","<b>IV thiamine immediately + 999</b> \u2014 Wernicke's encephalopathy, life-threatening"],
         ["<b>Haematemesis</b>","Blood or coffee-ground vomit \u2014 <b>Mallory-Weiss tear (common in hyperemesis)</b>, oesophagitis, rarely peptic ulcer","<b>Same-day assessment</b>; GI surgical review if haemodynamically unstable"],
         ["<b>Severe dehydration</b>","<b>Clinical dehydration, unable to keep fluids or oral antiemetics down, or weight loss &gt;5%</b>, postural hypotension (judge clinically \u2014 not by urinary ketones)","Same-day admission for IV fluids, antiemetics, thiamine and a VTE risk assessment (RCOG Green-top 37a)"],
         ["<b>Abdominal pain with vomiting</b>","Epigastric \u2014 UTI, appendicitis, cholecystitis, pancreatitis, pre-eclampsia after 20 weeks. Severe right upper quadrant \u2014 <b>HELLP syndrome after 20 weeks</b>, gallstones","<b>Same-day assessment</b>"],
         ["Fever with vomiting","Temperature <b>&gt;37.5\u00b0C</b> \u2014 <b>UTI and pyelonephritis are common in pregnancy</b>; also gastroenteritis, appendicitis","<b>Urine MC&amp;S same day</b>"],
         ["<b>Onset after 12 weeks, or new vomiting in the second trimester</b>","NVP typically resolves by 12\u201316 weeks. <b>New vomiting after 16 weeks is not NVP until proven otherwise</b>","Exclude UTI, reflux, appendicitis, pre-eclampsia, molar pregnancy, <b>AFLP</b>"],
         ["<b>Molar pregnancy</b>","Vomiting <b>out of proportion</b> to gestation, vaginal bleeding, <b>uterus larger than dates</b>, bilateral <b>theca-lutein cysts</b> \u2014 a mole produces very high \u03b2hCG which drives severe NVP","<b>Same-day early pregnancy unit</b>"],
         ["<b>Psychiatric emergency</b>","<b>Suicidal ideation</b> from the distress of hyperemesis","<b>Same-day mental health assessment.</b> Hyperemesis carries higher rates of termination and maternal suicide than other pregnancy complications"]
       ]},
       {b:"why", html:"<b>Appendicitis in pregnancy is notoriously hard to diagnose</b> \u2014 the appendix migrates superiorly as the uterus enlarges, so the pain may be atypical and peritonism masked by the gravid uterus. <b>Pre-eclampsia and HELLP can present as nausea and vomiting</b>, particularly with right upper quadrant pain from hepatic capsule stretch; missing that after 20 weeks is a critical safety failure."},
       {b:"dl", rows:[
         ["<b>NG12 stated honestly</b>","NVP and hyperemesis have no NICE NG12 suspected-cancer criterion, and none should be invented for them. The adjacent condition that matters is <b>molar pregnancy</b> \u2014 premalignant, and the route is same-day early pregnancy unit with ultrasound and \u03b2hCG, not a two-week wait. Confirmed molar pregnancy is registered with a <b>trophoblastic screening centre</b> for hCG surveillance, because a minority progress to gestational trophoblastic neoplasia. Get the diagnosis today; the cancer surveillance is the specialist centre's job, not a 2WW form"]
       ]}
     ]},

    {id:"confirm", nav:"Score it", title:"PUQE, and the line between NVP and hyperemesis",
     sub:"The score decides the setting of care. Guessing severity is how moderate hyperemesis gets oral tablets and three A&E attendances.",
     blocks:[
       {b:"dl", rows:[
         ["<b>PUQE scoring</b>","The validated <b>Pregnancy-Unique Quantification of Emesis</b> score: three questions, each scored <b>1\u20135</b> \u2014 hours of nausea per day, episodes of vomiting per day, episodes of retching per day. <b>Total 3\u201315.</b> Document it in the notes"],
         ["<b>Mild NVP</b>","<b>PUQE \u22646.</b> Nausea but maintaining oral intake, clinically well hydrated \u2192 lifestyle measures \u00b1 a first-line antiemetic in primary care"],
         ["<b>Moderate NVP</b>","<b>PUQE 7\u201312.</b> Significant symptoms affecting function, some dehydration risk \u2192 medical treatment in primary care with close monitoring and a <b>low threshold for admission</b>"],
         ["<b>Severe / hyperemesis</b>","PUQE 13\u201315, or clinical dehydration, or weight loss &gt;5%, or unable to keep oral fluids or antiemetics down \u2192 hospital for IV hydration, IV antiemetics and thiamine; ambulatory day care first if PUQE is under 13 and community treatment has failed"],
         ["<b>Hyperemesis gravidarum \u2014 the Windsor definition</b>","Used by RCOG Green-top 69 (2024): symptoms <b>start in early pregnancy (before 16 weeks)</b>; <b>nausea and vomiting, at least one of them severe</b>; <b>unable to eat and/or drink normally</b>; and <b>daily activities strongly limited</b>. Signs of dehydration support the diagnosis. <b>Ketonuria is not part of it</b> and does not indicate dehydration or severity. Affects <b>0.3\u20133.6% of pregnancies</b>. Peaks at <b>8\u201312 weeks</b> and may persist beyond 20 weeks"],
         ["<b>Normal NVP for comparison</b>","Affects <b>70\u201380% of pregnancies</b>. Onset <b>4\u20138 weeks</b>, peak <b>8\u201312 weeks</b>, <b>resolves by 16\u201320 weeks in 90%</b>. Some oral intake maintained, no significant weight loss, no clinical dehydration"],
         ["<b>Baseline weight</b>","<b>Weigh at every appointment and document it.</b> Percentage loss from <b>pre-pregnancy weight</b> where known is what drives the admission decision"],
         ["Twin or molar pregnancy","Higher \u03b2hCG \u2192 more severe NVP and hyperemesis. <b>Confirm by ultrasound</b>"],
         ["Non-pregnancy causes","Suspect if onset after 10 weeks, worsening after 20 weeks, prominent diarrhoea, fever, localised abdominal pain, urinary symptoms or headache \u2014 <b>investigate those separately</b>"],
         ["<b>Psychological impact \u2014 screen everyone</b>","RCOG Green-top 69 (2024): assess mental health during the pregnancy and postnatally, validate the physical and psychological distress, and refer for psychosocial support. PHQ-9 and GAD-7 at first presentation are practical tools: depression and anxiety run at 30\u201350%. Ask about suicidal thoughts and thoughts of termination. Do not normalise the distress"]
       ]},
       {b:"why", html:"PUQE is validated against 24-hour vomiting diaries and correlates with objective dehydration, and <b>RCOG Green-top 69 specifically recommends using it</b> \u2014 consistently, because it prevents both under-treatment and over-medicalisation. This matters more than it sounds: up to 80% of UK women with hyperemesis report their symptoms were initially dismissed as normal morning sickness, with real psychological harm and delay. Pregnancy Sickness Support estimates 50% of hyperemesis patients are admitted three or more times before an adequate plan is in place \u2014 early, decisive community treatment is what prevents that spiral. And note the overlap: <b>gestational thyrotoxicosis occurs in 60% of hyperemesis</b>, because \u03b2hCG cross-stimulates the TSH receptor."}
     ]},

    {id:"workup", nav:"Work-up", title:"Examination and investigations \u2014 proportionate to the score",
     blocks:[
       {b:"table", head:["Examine","What to find","Why it changes the plan"], rows:[
         ["<b>Vital signs</b>","Tachycardia (dehydration or infection); hypotension (severe dehydration); <b>raised BP with headache after 20 weeks \u2192 pre-eclampsia</b>; fever (infection); raised respiratory rate (ketoacidosis in severe disease)","Sets the admission decision"],
         ["<b>Hydration</b>","Skin turgor, dry mucous membranes, sunken eyes, postural hypotension \u2014 a systolic drop &gt;20 mmHg sitting to standing","Postural hypotension is a sensitive sign of significant dehydration in pregnancy and mandates same-day referral"],
         ["<b>Weight</b>","Weigh every presentation; calculate percentage loss from baseline","&gt;5% loss marks significant dehydration and malnutrition \u2014 it is the admission threshold"],
         ["Abdomen","Epigastric tenderness (pancreatitis, peptic ulcer, pre-eclampsia), right upper quadrant (cholecystitis, HELLP after 20 weeks), right iliac fossa (appendicitis). <b>Uterus larger than dates \u2192 molar or multiple pregnancy</b>","Finds the mimic"],
         ["<b>Neurological</b>","<b>Confusion, ataxia, diplopia or nystagmus</b>","<b>Emergency IV thiamine + 999</b>"],
         ["<b>Urine dipstick \u2014 every consultation</b>","Protein (pre-eclampsia after 20 weeks), leucocytes and nitrites for UTI and pyelonephritis. <b>Ketones are not a measure of dehydration or severity</b> \u2014 they reflect starvation, and RCOG Green-top 69 (2024) advises against using them","<b>Judge hydration clinically</b> (pulse, BP, postural drop, mucous membranes, weight) \u2014 not on the ketone result"]
       ]},
       {b:"table", head:["Test","When","Notes"], rows:[
         ["<b>Urine dipstick</b>","Every consultation","Protein for pre-eclampsia after 20 weeks, leucocytes and nitrites for infection \u2014 <b>not ketones for severity</b>"],
         ["MSU","If leucocytes or nitrites positive","<b>UTI and pyelonephritis are common NVP mimics and worsen NVP.</b> Treat with pregnancy-safe antibiotics \u2014 <b>nitrofurantoin not in the third trimester</b>"],
         ["<b>Bloods \u2014 moderate or severe</b>","Not needed in mild disease","<b>U&amp;E</b> (hypokalaemia, hyponatraemia \u2014 replacement needed); <b>FBC</b> (haemoconcentration); <b>LFTs \u2014 transiently raised in 50% of hyperemesis, usually benign</b>; <b>TFTs</b> \u2014 gestational thyrotoxicosis"],
         ["<b>Thiamine</b>","Severe disease","Do not delay treatment for a level \u2014 give it to every woman admitted with vomiting or severely reduced intake, before any dextrose or parenteral nutrition (RCOG Green-top 69)"],
         ["<b>Pelvic ultrasound</b>","All new presentations if not already done at booking","Confirms an <b>intrauterine</b> pregnancy and gestation, <b>singleton versus multiple</b>, and <b>excludes a molar pregnancy</b>"],
         ["<b>When NOT to investigate</b>","Mild NVP, normal dipstick, normal examination, maintaining intake","<b>No blood tests. Do not over-investigate self-limiting mild NVP</b>"]
       ]},
       {b:"warn", html:"Hypokalaemia (K\u207a &lt;3.0 mmol/L) from recurrent vomiting causes cardiac arrhythmias \u2014 oral rehydration cannot correct it and IV replacement is mandatory. <b>Gestational thyrotoxicosis</b> (suppressed TSH, raised free T4, driven by \u03b2hCG) occurs in <b>60% of hyperemesis</b> but is transient: do not treat unless TSH stays suppressed beyond 16\u201320 weeks with clinical hyperthyroidism \u2014 treating it causes fetal hypothyroidism. And raised transaminases are usually benign here, but must be distinguished from <b>acute fatty liver of pregnancy</b>, which is life-threatening and presents later with vomiting, jaundice and coagulopathy."}
     ]},

    {id:"ladder", nav:"Treatment", title:"The antiemetic ladder \u2014 pregnancy-safe, with doses",
     sub:"RCOG Green-top 69 and NICE NG201 are explicit: antiemetics are safe and recommended. Undertreatment is the harm.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Step 1", title:"Lifestyle and ginger", when:"mild NVP only (PUQE \u22646)",
          html:"Small, frequent, <b>carbohydrate-rich</b> meals; avoid triggers; rest; <b>ginger 250 mg QDS</b> (mild to moderate NVP only \u2014 <b>not for hyperemesis</b>); <b>P6 acupressure</b>; cold food (less smell). <b>If insufficient after 24\u201348 hours, move to an antiemetic.</b>"},
         {step:"Step 2", title:"First-line antiemetic plus thiamine", when:"moderate NVP (PUQE 7\u201312)",
          fromLabel:"lifestyle insufficient",
          html:"<b>Prochlorperazine 5\u201310 mg TDS</b> OR <b>cyclizine 50 mg TDS</b> OR <b>promethazine 25 mg TDS or nocte</b> \u2014 all <b>first-line in RCOG Green-top 69</b> (no evidence of harm). <b>Add thiamine if intake is poor or vomiting prolonged</b> (RCOG oral dose 100 mg TDS). <b>If the oral route fails, use buccal, IM or IV.</b> <b>Review at 24\u201348 hours.</b>"},
         {step:"Step 3", title:"Second-line antiemetic", when:"first-line inadequate",
          fromLabel:"still vomiting",
          html:"<b>Metoclopramide 10 mg TDS \u2014 maximum 5 days</b> (MHRA Drug Safety Update 2013: short-term use only, maximum 30 mg in 24 hours, because of tardive dyskinesia and extrapyramidal risk; prescribe with a clear stop date) OR <b>ondansetron 4\u20138 mg BD\u2013TDS</b> \u2014 RCOG Green-top 69 says its second-line use <b>should not be discouraged</b>; discuss the small cleft risk below. <b>Continue thiamine.</b>"},
         {step:"Step 4", title:"Combination and acid suppression", when:"refractory",
          fromLabel:"single agents failing",
          html:"<b>Two antiemetics from different classes.</b> Add acid suppression for the reflux component \u2014 <b>famotidine 20 mg BD or omeprazole 20 mg OD</b> (ranitidine was withdrawn from the UK market in 2020). <b>Prednisolone 40 mg OD reducing over 2 weeks</b> for refractory hyperemesis \u2014 <b>secondary care initiation</b>."},
         {step:"Step 5", title:"Hospital IV management", when:"admission criteria met",
          fromLabel:"escalate, don't persist",
          html:"IV 0.9% sodium chloride with potassium (KCl) replacement \u2014 NOT 5% dextrose, which precipitates Wernicke's. <b>IV thiamine as vitamin B complex (Pabrinex) for every woman admitted \u2014 dose per BNF</b>. IV ondansetron 4\u20138 mg TDS; IV metoclopramide 10 mg TDS. Assess VTE risk with the RCOG Green-top 37a tool (hyperemesis is itself a listed risk factor) and give LMWH thromboprophylaxis unless contraindicated \u2014 dehydration plus reduced mobility in pregnancy is a thrombotic combination, and VTE prophylaxis is part of the admission bundle alongside fluids, antiemetics and thiamine; it can usually stop at discharge or when the hyperemesis resolves. <b>TPN (total parenteral nutrition)</b> for hyperemesis failing all measures \u2014 a specialist decision."}
       ]},
       {b:"warn", html:"NEVER give IV 5% dextrose without thiamine \u2014 it precipitates Wernicke's encephalopathy. Thiamine goes in BEFORE any glucose-containing fluid in anyone who has been vomiting persistently. And RCOG Green-top 69 (2024) is explicit that every woman admitted with vomiting or severely reduced dietary intake gets thiamine \u2014 oral 100 mg TDS or IV vitamin B complex \u2014 not a nicety."},
       {b:"why", html:"The safety evidence is robust: prochlorperazine, cyclizine and promethazine have decades of use data and are first-line in RCOG Green-top 69. The ondansetron question is narrower than its reputation \u2014 the <b>MHRA Drug Safety Update (January 2020)</b> reported a small increased risk of oral clefts with use in the <b>first 12 weeks</b> of pregnancy: about <b>3 extra cases per 10,000 births</b> (14 vs 11 per 10,000; Huybrechts et al., JAMA 2018). <b>RCOG Green-top 69 (2024) says its use as a second-line antiemetic should not be discouraged</b> \u2014 counsel her on this very small absolute risk and set it against the harm of poorly controlled hyperemesis. Set against that, undertreated hyperemesis causes nutritional deficiency, <b>IUGR</b>, preterm birth, maternal psychological harm and fetal thiamine deficiency. <b>The risk of not treating is the larger risk.</b>"}
     ]},

    {id:"lifestyle", nav:"Support", title:"Non-drug measures, work, and the psychological load",
     sub:"Lifestyle alone rarely controls moderate or severe disease \u2014 but the practical and emotional support is as much treatment as the tablets.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"\ud83c\udf5e Eating pattern", html:"<b>Small, frequent, carbohydrate-rich</b> meals \u2014 plain crackers, toast, rice, bland foods. <b>Eat before getting out of bed.</b> Avoid large meals (gastric distension worsens nausea). <b>Separate fluids from solids by 30 minutes.</b>"},
         {tone:"green", h:"\ud83e\uddca Cold food", html:"Cold or room-temperature food produces <b>less smell and steam</b> than hot food, which substantially reduces the trigger for many women \u2014 ice lollies, cold water, frozen ginger chews."},
         {tone:"cream", h:"\ud83d\udeab Trigger avoidance", html:"Identify individual triggers \u2014 strong smells (perfume, cooking, petrol), heat, stuffy rooms, fatigue. Fan in the kitchen, delegate cooking, open windows. <b>Rest is treatment, not laziness</b> \u2014 sleep deprivation amplifies nausea through <b>cortisol</b> elevation."},
         {tone:"blue", h:"\ud83e\uded8 Ginger", html:"The <b>best-evidenced non-drug treatment</b>: tea, biscuits, or <b>capsules 250 mg QDS</b>. <b>Reduces nausea scores by around 30% in mild NVP</b> \u2014 but RCOG Green-top 69 (2024) advises <b>not suggesting ginger for hyperemesis gravidarum</b>: it lacks efficacy there and can cause harm. <b>P6 (Neiguan) acupressure</b> wristbands are a reasonable low-risk adjunct alongside it."},
         {tone:"blue", h:"\ud83d\udca7 Hydration strategy", html:"Sip cold water, ice chips, clear broth or diluted juice in small amounts frequently; sports drinks replace electrolytes. <b>If oral hydration fails, IV fluids \u2014 do not delay seeking help.</b>"},
         {tone:"amber", h:"\ud83d\udcdd Fit notes and the workplace", html:"Proactively issue fit notes for women unable to work \u2014 hyperemesis is a legitimate medical condition. ACAS guidance supports adjustments: flexible hours, working from home, toilet access. Up to 30% of women with hyperemesis lose their jobs through prolonged absence, so the fit note is a clinical intervention."},
         {tone:"green", h:"\ud83e\udde0 Psychological support", html:"<b>Pregnancy Sickness Support helpline 0800 0 334 899</b> \u2014 staffed by hyperemesis survivors, and shown to reduce admissions by giving real-time guidance. Online communities; <b>CBT for health anxiety and anticipatory nausea</b>; screen with PHQ-9 in pregnancy and again postnatally (RCOG Green-top 69) and treat depression if found. <b>Partners need educating too.</b>"},
         {tone:"cream", h:"\ud83d\udc8a Vitamins", html:"<b>Continue folic acid \u2014 do not stop it</b>; the <b>neural tube defect (NTD)</b> risk from stopping vastly outweighs its modest contribution to nausea. Switch to <b>evening-only</b> dosing if tablets worsen symptoms, and <b>trial an iron-free preparation</b> if pregnancy vitamins with iron are the problem."}
       ]}
     ]},

    {id:"monitor", nav:"Follow-up", title:"Review, monitoring and safety-netting",
     sub:"NVP is dynamic and women deteriorate quickly. The 24\u201348 hour review is the safety mechanism, not a courtesy.",
     blocks:[
       {b:"table", head:["When","What","Action"], rows:[
         ["<b>24\u201348 hours</b>","Response to the first antiemetic","If no improvement, step up the ladder \u2014 do not continue a failing treatment. Reassess hydration; weigh if possible"],
         ["1 week","Ongoing moderate or severe symptoms","Recheck PUQE, weight, hydration and symptoms. <b>Clinical dehydration or weight falling \u2192 hospital.</b> Improving \u2192 continue and review at 2 weeks"],
         ["<b>Weekly</b>","All hyperemesis managed in primary care","<b>Weight, PUQE score and clinical hydration at every visit</b>; dipstick for infection. Document clearly"],
         ["Resolution","Most resolve by <b>16\u201320 weeks</b>","Review medication for cessation. <b>Some hyperemesis persists throughout pregnancy</b> \u2014 ongoing joint care. <b>Post-natal debriefing matters for mental health</b>"],
         ["<b>After 16 weeks</b>","New or worsening vomiting","Re-investigate \u2014 exclude UTI, reflux, appendicitis. After 20 weeks exclude pre-eclampsia (BP, urine protein) and AFLP (LFTs, coagulation)"]
       ]},
       {b:"cards", items:[
         
       ]},
       {b:"cards", items:[
         {tone:"red", h:"\ud83d\udd34 999", html:"\u201cIf you become confused, get double vision or feel unsteady on your feet \u2014 that is an emergency, call <b>999</b>.\u201d Also collapse, severe hypotension, or vomiting blood."},
         {tone:"red", h:"\ud83d\udcde Same-day hospital", html:"\u201cIf you can't keep <b>any</b> fluids down for a day, your urine goes dark or you pass very little, you feel faint on standing, or you get tummy pain or a fever \u2014 contact us or maternity the same day.\u201d"},
         {tone:"amber", h:"\u2696\ufe0f Weight", html:"\u201cKeep an eye on your weight \u2014 significant loss means you need reviewing, not soldiering on.\u201d"},
         {tone:"amber", h:"\ud83e\udde0 Mental health", html:"\u201cIf this starts to feel unbearable, or you have thoughts of harming yourself, tell us the same day \u2014 that is part of the illness and we treat it.\u201d"},
         {tone:"blue", h:"\ud83d\udcc5 After 16 weeks", html:"\u201cSickness that starts or worsens after 16 weeks isn't ordinary pregnancy sickness \u2014 come back and we will look for another cause.\u201d"},
         {tone:"green", h:"\ud83e\udec2 Prognosis", html:"\u201cIt usually eases by around 16\u201320 weeks, and there are medicines that are genuinely safe to use meanwhile.\u201d"}
       ]},
       {b:"say", html:"Sickness in pregnancy is common, but what you have is more than that, and it has a name and a treatment. I am going to score it so we can both see whether we are winning, start a medicine with a long safety record, and add thiamine because prolonged vomiting can strip out that vitamin. I want to see you in a day or two \u2014 if the medicine isn't working we step up rather than keep going. The line I want you to hold is fluids: if you cannot keep anything down, you need a drip, and there is a day unit that can do it in an afternoon."}
     ]},

    {id:"loop", nav:"Not responding?", title:"Not controlled? Step up or admit", sub:"Escalate the antiemetic ladder; admit if dehydrated or not coping.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"1 \u00b7 Dehydration", html:"Clinical dehydration, nothing kept down, weight loss \u2192 IV fluids by <b>ambulatory day care or an admission</b>."},
         {tone:"amber", h:"2 \u00b7 Adequate antiemetic", html:"Full dose \u2014 and <b>a non-oral route if she is vomiting the tablets</b>. Two agents from <b>different classes</b> plus acid suppression before declaring failure."},
         {tone:"amber", h:"3 \u00b7 Other cause", html:"UTI, thyroid, molar or multiple pregnancy <b>on ultrasound</b> \u2014 and pre-eclampsia or AFLP after <b>20 weeks</b>."},
         {tone:"blue", h:"4 \u00b7 Thiamine / VTE", html:"Thiamine given, VTE risk assessed (RCOG Green-top 37a) \u2014 <b>both are expected for every woman admitted with hyperemesis</b>."},
         {tone:"red", h:"5 \u00b7 Escalate", html:"Hyperemesis or not coping \u2192 maternity / early-pregnancy unit for <b>obstetric input</b>. Do not let her cycle through repeat GP appointments."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral and admission \u2014 the thresholds are explicit",
     sub:"When the threshold is met, do not delay. The day-case unit is the route that prevents the emergency admission.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999 / emergency", html:"Neurological signs \u2014 confusion, diplopia, ataxia \u2192 IV thiamine plus 999 immediately (Wernicke's). Haematemesis with haemodynamic instability. Severe sepsis (pyelonephritis). Suspected molar pregnancy with haemodynamic compromise."},
         {tone:"red", h:"Same-day hospital", html:"Unable to keep down fluids or oral antiemetics \u00b7 clinical dehydration or weight loss &gt;5% despite oral antiemetics \u00b7 postural hypotension \u00b7 PUQE 13\u201315 \u00b7 K\u207a &lt;3.0 or Na\u207a &lt;130 \u00b7 confirmed or suspected comorbidity (e.g. UTI unable to tolerate oral antibiotics), mental health crisis, suicidal ideation."},
         {tone:"amber", h:"Ambulatory day care", html:"RCOG Green-top 69 (2024): use ambulatory day care for suitable women when community or primary-care measures have failed and <b>PUQE is under 13</b> \u2192 IV fluids, parenteral antiemetics and thiamine as a day case. Ambulatory care of this kind prevents admission where the service exists locally."},
         {tone:"blue", h:"Obstetric / midwifery team", html:"All hyperemesis should be under joint care with the obstetric team or EPAU \u2014 alert the booking midwife. It may require consultant-led care."},
         {tone:"blue", h:"Early pregnancy unit", html:"Suspected <b>molar or multiple pregnancy</b> for ultrasound and \u03b2hCG; ongoing management where an EPU service leads it."},
         {tone:"purple", h:"NG12 \u2014 stated honestly", html:"<b>There is no suspected cancer pathway route for NVP or hyperemesis.</b> The one premalignant adjacency is <b>molar pregnancy</b>, and its route is same-day EPU with ultrasound, then registration with a trophoblastic screening centre for hCG surveillance \u2014 because a minority progress to gestational trophoblastic neoplasia. <b>Same-day diagnosis, specialist surveillance \u2014 not an NG12 form.</b>"},
         {tone:"cream", h:"Keep in primary care", html:"Mild to moderate NVP (PUQE \u226412), maintaining some oral intake and oral antiemetics, clinically hydrated, no red flags \u2192 antiemetics, thiamine, hydration support and close follow-up."}
       ]},
       {b:"why", html:"Day-case IV rehydration in early pregnancy units has transformed hyperemesis care \u2014 replacing 3\u20135 day inpatient admissions with 4\u20136 hour day-case visits, a model RCOG Green-top 69 endorses. Referring proactively breaks the familiar sequence of GP appointment \u2192 inadequate oral treatment \u2192 deterioration \u2192 A&amp;E \u2192 emergency admission \u2192 prolonged stay. The mental health dimension is routinely underestimated: a 2017 study found 39% of women with severe hyperemesis reported suicidal ideation and 30% considered termination solely because of the symptoms \u2014 so a documented crisis plan belongs in the record."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 27-year-old at 9 weeks in her first pregnancy, vomiting six or seven times a day for two weeks. She has lost 4 kg, dipstick shows ketones ++, and she has already been told twice that morning sickness is normal \u2014 and once that her ketones \u201cprove\u201d she is dehydrated. She is tearful and says she cannot face going on."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"<b>Scores it (PUQE) rather than eyeballing severity</b>; weighs her, assesses hydration clinically and does <b>not</b> grade her on the ketone result; <b>recognises this is hyperemesis, not NVP</b>; excludes the mimics and asks about neurological symptoms; <b>prescribes a first-line antiemetic AND thiamine</b>; refers to <b>ambulatory day care</b> rather than issuing another prescription and hoping; <b>asks directly about mood and suicidal ideation</b> and signposts Pregnancy Sickness Support; issues a fit note unprompted; and \u2014 the step candidates miss \u2014 <b>validates that she was previously dismissed instead of repeating it</b>."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>RCOG Green-top Guideline No. 69 \u2014 The Management of Nausea and Vomiting of Pregnancy and Hyperemesis Gravidarum (2024)<br><a href="https://www.rcog.org.uk/guidance/browse-all-guidance/green-top-guidelines/" rel="noopener">rcog.org.uk \u2014 green-top guidelines</a><span class="rd"> \u2014 February 2024: the Windsor definition of HG, PUQE bands (\u22646 mild, 7\u201312 moderate, 13\u201315 severe), ketonuria not to be used to assess severity or dehydration, the first-line antiemetics, ondansetron second line not to be discouraged, thiamine for all women admitted, no ginger for HG, ambulatory day care when PUQE is under 13, inpatient criteria, VTE assessment and mental-health assessment</span></li>'+
         '<li><b>RCOG Green-top Guideline No. 37a \u2014 Reducing the risk of venous thromboembolism during pregnancy and the puerperium (2015)</b><span class="rd"> \u2014 VTE risk assessment tool; hyperemesis listed as a transient risk factor; thromboprophylaxis on admission</span></li>'+
         '<li><b>MHRA Drug Safety Update \u2014 ondansetron: small increased risk of oral clefts following use in the first 12 weeks of pregnancy (January 2020)</b><span class="rd"> \u2014 about 3 additional cases per 10,000 births</span></li>'+
         '<li><b>MHRA Drug Safety Update \u2014 metoclopramide: risk of neurological adverse effects (August 2013)</b><span class="rd"> \u2014 short-term use (up to 5 days), maximum 30 mg in 24 hours</span></li>'+
         '<li><b>Jansen et al., The Windsor Definition for Hyperemesis Gravidarum, Eur J Obstet Gynecol Reprod Biol (2021)</b><span class="rd"> \u2014 international consensus definition used by RCOG Green-top 69</span></li>'+
         '<li><b>NICE NG201 \u2014 Antenatal care</b><br><a href="https://www.nice.org.uk/guidance/ng201" rel="noopener">nice.org.uk/guidance/ng201</a><span class="rd"> \u2014 antenatal assessment, and treating nausea and vomiting rather than withholding treatment</span></li>'+
         '<li><b>NICE NG201 \u2014 antenatal care</b><br><a href="https://www.nice.org.uk/guidance/ng201" rel="noopener">nice.org.uk/guidance/ng201</a><span class="rd"> \u2014 primary-care assessment, conservative measures, and the referral and admission criteria</span></li>'+
         '<li><b>Huybrechts et al., JAMA (2018)</b><span class="rd"> \u2014 first-trimester ondansetron and oral clefts in 1.8 million US pregnancies: adjusted relative risk 1.24, 14 vs 11 per 10,000 births \u2014 the study behind the MHRA January 2020 update</span></li>'+
         '<li><b>Pregnancy Sickness Support</b><br><a href="https://www.pregnancysicknesssupport.org.uk" rel="noopener">pregnancysicknesssupport.org.uk</a> \u00b7 helpline <b>0800 0 334 899</b><span class="rd"> \u2014 peer support shown to reduce admissions; the source of the repeat-admission and symptom-dismissal figures quoted on this page</span></li>'+
         '<li><b>NICE NG12 \u2014 Suspected cancer: recognition and referral (updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> \u2014 no criterion applies to NVP or hyperemesis; molar pregnancy goes same-day to the EPU and then to a trophoblastic screening centre for hCG surveillance, which is why no 2WW route is stated here</span></li>'+
         '<li><b>BNF / BNF for Children</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> \u2014 all doses: prochlorperazine, cyclizine, promethazine, metoclopramide, ondansetron, thiamine, Pabrinex, famotidine, omeprazole, prednisolone</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Nausea and vomiting in pregnancy and hyperemesis gravidarum \u2014 RCOG Green-top 69 (2024) and NICE NG201. Diagnosis and management are merged on this page; there is no separate NVP pathway to cross-check. Verify all doses against the current BNF before prescribing."
