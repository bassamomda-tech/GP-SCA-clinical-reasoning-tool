MG.render({
  icon:"🕊️",
  title:"Palliative pain and opioids — GP quick guide",
  eyebrow:"Protocol · assess &amp; prescribe in one place",
  stemTitle:"Uncontrolled pain in a palliative patient is a medical emergency — and more opioid is not always the answer",
  stemSub:"One page for the whole condition. Recognise the oncological emergencies (MSCC, SVCO, pathological fracture, opioid-induced neurotoxicity) that need same-day action through the local emergency pathway; assess EACH pain by mechanism and address total pain; climb the WHO ladder with real doses; start and titrate morphine with the right breakthrough; convert cautiously between drugs and routes using local tables; add the adjuvant the mechanism demands; and put the palliative register, anticipatory prescribing and carer support in place before they are needed. GP quick guide to cancer-related pain and palliative symptom control: use with the current GMEC/GMMMG guideline, local formulary and specialist palliative-care advice. It does not replace assessment or local emergency pathways.",
  guideline:"GMEC/GMMMG 2025 · NICE CG140 / NG234 / NG31 / CG173 · SPS",
  reviewed:"8 September 2026",
  nextReview:"8 March 2027",
  meta:[
    {t:"GMEC Palliative Care Guidelines 2025"},
    {t:"NICE CG140 · NG234 (MSCC, replaced CG75) · NG31"},

  ],
  lead:"<div class='mg-layers'><a href='#severe'><b>Emergencies</b><small>MSCC · SVCO · OIN</small></a><a href='#assess'><b>Assess</b><small>Each pain, and total pain</small></a><a href='#ladder'><b>Prescribe</b><small>WHO ladder · titrate · convert</small></a><a href='#planning'><b>Plan ahead</b><small>GSF · JIC box · carers</small></a></div>",
  quickSub:"If you read nothing else on this page, read these six cards. Every figure traces to the source cited under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ MSCC — dexamethasone BEFORE the scan", html:"Sudden severe pain in known bone metastases + new neurological signs (limb weakness, numbness, bladder or bowel dysfunction) = metastatic spinal cord compression: contact the MSCC coordinator/acute oncology immediately; give dexamethasone 16 mg orally as soon as possible if there are neurological symptoms or signs (or the locally specified parenteral equivalent, which depends on product concentration and local policy, about 13.2 mg SC/IV in the GMEC pathway); arrange whole-spine MRI as soon as possible and always within 24 hours (NICE NG234). Use 999/emergency transfer for acute or progressive neurological deterioration, suspected spinal instability, uncontrolled pain or inability to transfer safely. Any delay risks permanent paralysis. With neurological symptoms or signs, the 16 mg dose is given on clinical suspicion, before imaging confirms it, because the window for preserving neurological function closes rapidly. NG234 expects a 24-hour MSCC coordinator service in every cancer network."},
    {tone:"amber", h:"New drowsiness, delirium, myoclonus or hyperalgesia after escalation: think opioid-induced neurotoxicity", html:"Confusion + agitation + myoclonus + pain on high-dose opioids is OIN — accumulation of active metabolites (morphine-3- and morphine-6-glucuronide), especially in renal impairment. Pain worsening despite escalation is a clue, but OIN is not diagnosed by pain alone: consider delirium, hypercalcaemia, uraemia, infection, dehydration, brain metastases, other drugs and disease progression. Withhold further escalation, review renal function and CNS depressants, individualise hydration, and seek urgent specialist advice on dose reduction or rotation. Do not use naloxone for OIN in the absence of respiratory depression."},
    {tone:"blue", h:"Rescue dose about 1/10 to 1/6 of the 24-hour dose — recalculate every time", html:"Typical opioid-naive adult with normal renal and hepatic function: morphine MR 10–15 mg 12-hourly (or IR 5 mg 4-hourly) plus IR morphine 5 mg PRN, 4-hourly with a local maximum (NICE CG140). Frail or elderly: IR morphine 2.5 mg 4-hourly or local equivalent. At 24 hours, add the IR used to the regular 24-hour dose and divide by 2 for 12-hourly MR; recalculate the rescue dose at every change. Seek advice if three or more rescue doses are needed in 24 hours or pain remains uncontrolled. When you titrate the regular opioid you MUST reissue the anticipatory (JIC) PRN prescription at the new rescue dose — otherwise district nurses give an obsolete, inadequate breakthrough."},
    {tone:"green", h:"Co-prescribe the laxative from day one — constipation never tolerates out", html:"Prescribe a regular stimulant laxative, with or without an osmotic laxative, according to bowel habit, hydration, renal function and local formulary, and review bowel function proactively. Methylnaltrexone (Relistor) SC is specialist-supported treatment for opioid-induced constipation when conventional laxatives have failed: exclude mechanical obstruction, avoid where GI perforation is suspected or there is significant risk, and dose by weight and renal function per the current SmPC. Nausea is usually transient: choose the antiemetic by likely cause, comorbidity and the local palliative guideline."},
    {tone:"cream", h:"Two underused, highly effective interventions", html:"Single-fraction radiotherapy 8 Gy for localised uncomplicated painful bone metastases — as effective for pain as multi-fraction regimens (RCR; Chow et al. systematic reviews 2007 and 2012); response is not guaranteed, onset is often 2–6 weeks, and it is repeatable. Fracture, impending fracture, spinal instability or cord compression need oncology, orthopaedic or spinal assessment instead. Ask oncology. Coeliac plexus block for pancreatic cancer pain gives significant relief in 70–80% and can slash opioid requirements for months — both are significantly underused while patients are escalated into toxicity instead."},
    {tone:"amber", h:"Reduce by 25–50% when you rotate opioids", html:"Opioid conversions are approximate: check against the current product SmPC, the local GMEC/GMMMG conversion table and/or specialist palliative-care advice. Calculate total opioid exposure, including regular and clinically used breakthrough doses. Reduce the calculated equivalent dose for incomplete cross-tolerance, usually by 25–50%, with a larger reduction when clinically indicated, and give a new, appropriately calculated rescue dose. Do not independently convert to methadone or start opioid patches for unstable pain."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step is the one that must happen today, on the phone if necessary.",
  pathway:[
    {title:"Recognise the emergencies", html:"MSCC (new neurological signs + known cancer) → MSCC coordinator/acute oncology immediately, dexamethasone 16 mg if neurological symptoms or signs, whole-spine MRI within 24 hours; 999 if deteriorating, unstable or unsafe to transfer. Pain crisis NRS ≥8 unresponsive to breakthrough → phone palliative care the SAME day; consider urgent SC infusion or admission. Opioid toxicity/OIN → withhold escalation, assess reversible causes, phone the specialist. New headache + photophobia + neck stiffness with brain metastases → leptomeningeal disease or raised ICP: same-day oncology/neurology assessment; no lumbar puncture in primary care. SVCO with airway compromise, stridor, severe dyspnoea, syncope, cerebral symptoms or haemodynamic compromise → emergency assessment and acute oncology urgently. Pathological fracture → immobilise, no weight-bearing, analgesia, urgent orthopaedic assessment; 999 for severe pain, deformity, neurovascular compromise, unsafe transfer or suspected spinal instability.", alert:true},
    {title:"Assess each pain by mechanism — and the whole person", html:"Most palliative patients have MORE THAN ONE pain: assess each separately (site, character, timing, what provokes and relieves it, effect on function, sleep and mood). Somatic, visceral, neuropathic or mixed — the type dictates the adjuvant. Score with the NRS at rest AND on movement; use the Abbey Pain Scale where the patient cannot self-report. Address total pain: physical, psychological, social and spiritual."},
    {title:"Climb the ladder — and check renal function", html:"Step 1 paracetamol ± NSAID; Step 2 is often skipped (go straight to low-dose strong opioid); Step 3 oral morphine as first choice. Check renal and liver function before starting where possible — it changes the opioid. Moderate or severe renal or hepatic impairment: seek specialist advice before prescribing strong opioids."},
    {title:"Titrate, convert, and co-prescribe", html:"Rescue dose about 1/10 to 1/6 of the 24-hour dose; review every 24–48 hours during titration; add the IR used to the regular 24-hour dose. Always co-prescribe a laxative and a PRN antiemetic. Switch opioid for toxicity, renal impairment or the transdermal route — reducing by 25–50% for incomplete cross-tolerance, with specialist advice. Add the adjuvant the mechanism demands."},
    {title:"Plan ahead — GSF, JIC box, carers, bereavement", html:"Put the patient on the GSF register (the surprise question), complete advance care planning and DNACPR/ReSPECT while they have capacity, share via EPaCCS with 111/OOH/ambulance, prescribe anticipatory medicines and keep the PRN dose current, check the carer at every visit, and do the SR1 (formerly DS1500) and benefits check."}
  ],
  sections:[
    {id:"severe", nav:"Emergencies", title:"Urgent and emergency pain situations in palliative care", sub:"Uncontrolled pain in a palliative patient is a medical emergency. Do not leave a patient in severe pain while arranging a non-urgent review — the GP must be prepared to initiate analgesia on the day and arrange same-day specialist support.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Metastatic spinal cord compression (MSCC)", html:"Sudden severe pain in known bone metastases + new neurological signs (limb weakness, numbness, bladder/bowel dysfunction) or radicular/band-like pain → treat as suspected MSCC. Contact the local MSCC coordinator/acute oncology service immediately. Give dexamethasone 16 mg orally as soon as possible, or the locally specified parenteral equivalent (depends on product concentration and local policy; about 13.2 mg SC/IV in the GMEC pathway), if neurological symptoms or signs are present. Arrange urgent whole-spine MRI as soon as possible and always within 24 hours. Immobilise without delay if spinal instability is suspected; consider immobilisation if moderate or severe pain is associated with movement. Use 999/emergency transfer for acute or progressive neurological deterioration, suspected instability, uncontrolled pain or inability to transfer safely. Continue dexamethasone 16 mg daily while awaiting surgery or radiotherapy, then reduce gradually after surgery or at the start of radiotherapy; stop it if MSCC is excluded. Consider a PPI and monitor glucose on high-dose dexamethasone (GMEC pathway). Dexamethasone is not routine for all spinal pain. In suspected lymphoma or haematological malignancy, liaise urgently with haematology because steroids may affect diagnostic yield. Any delay risks permanent paralysis. NG234 expects 24-hour MSCC coordinator access."},
         {tone:"red", h:"🔴 Acute severe pain crisis (NRS ≥8)", html:"Not responding to breakthrough doses → refractory pain crisis: may indicate a new pathological fracture, visceral obstruction, disease progression or inadequate analgesia. Do not leave the patient in uncontrolled pain. Phone the palliative care specialist the same day. Consider hospitalisation for rapid titration; a subcutaneous morphine or diamorphine infusion (syringe driver) may need to be initiated urgently."},
         {tone:"red", h:"🔴 Opioid-induced neurotoxicity (OIN)", html:"Confusion + agitation + myoclonus + pain in a patient on high-dose opioids — accumulation of active metabolites (morphine-6-glucuronide, morphine-3-glucuronide), especially in renal impairment. Suspect OIN when new or worsening drowsiness, delirium, hallucinations, myoclonus, seizures, allodynia or hyperalgesia occurs, particularly after dose escalation, dehydration or renal deterioration. It is not diagnosed by worsening pain alone: consider delirium, hypercalcaemia, uraemia, infection, dehydration, brain metastases, medication effects and disease progression. Withhold further unnecessary escalation, assess reversible causes, review renal function and concurrent CNS depressants, individualise hydration (care in heart failure, renal failure or the last days), and seek urgent specialist advice on dose reduction or opioid rotation. Do not use naloxone for OIN in the absence of respiratory depression. If the patient is unrousable or has clinically significant respiratory depression, manage ABCs and use carefully titrated naloxone per the local emergency protocol."},
         {tone:"red", h:"🔴 Leptomeningeal disease / raised ICP", html:"New severe headache + photophobia + neck stiffness in a patient with known brain metastases or haematological malignancy → leptomeningeal disease (meningeal carcinomatosis). Also raised ICP from a large brain metastasis (morning headache, vomiting, papilloedema). Same-day oncology/neurology assessment; dexamethasone to reduce cerebral oedema on specialist advice. Do not perform lumbar puncture in primary care. Imaging and CSF examination should be arranged by the specialist team after assessment for mass effect and contraindications."},
         {tone:"red", h:"🔴 Superior vena cava obstruction (SVCO)", html:"Pain crisis + shortness of breath + haemoptysis + facial oedema, arm swelling, distended neck veins → SVCO, an oncological emergency from mediastinal tumour or nodal compression. Suspected SVCO with airway compromise, stridor, severe dyspnoea, syncope, cerebral symptoms or haemodynamic compromise requires emergency assessment. Contact acute oncology urgently. Consider corticosteroid treatment only in accordance with the acute oncology/local protocol; dexamethasone alone is not definitive treatment. Diagnostic imaging and definitive treatment (stenting, radiotherapy or systemic therapy) follow. Consider pulmonary embolism and infection in the differential — cancer patients have high VTE risk."},
         {tone:"red", h:"🔴 Pathological fracture", html:"Bone pain + pathological fracture at a weight-bearing site (femur, humerus, vertebra) from a lytic metastasis → immobilise, avoid weight-bearing, provide analgesia and arrange urgent emergency/orthopaedic assessment (including consideration of fixation). Use 999 for severe pain, deformity, neurovascular compromise, unsafe transfer or suspected spinal instability. Pathological or impending fracture needs oncology/orthopaedic assessment rather than routine palliative radiotherapy. Bone-targeted treatment (bisphosphonate or denosumab) is an oncology decision."}
       ]},
       {b:"why", html:"Opioid-induced neurotoxicity is one of the most important and most mismanaged complications in palliative care — pain worsening despite opioid dose escalation is an important clue, though OIN is not diagnosed by pain alone. It is driven by metabolite accumulation, primarily morphine-3-glucuronide, which is pro-nociceptive and neuroexcitatory: it lowers the seizure threshold and sensitises pain pathways rather than blocking them. The treatment is rotation to an opioid with a different metabolite profile, dose conversion adjusted downward by 25–50% for incomplete cross-tolerance, individualised hydration, and renal-function review — a specialist decision that GPs should recognise and phone about the same day. NICE NG234 asks for immediate contact with the MSCC coordinator for anyone with cancer and suspected MSCC, and for dexamethasone 16 mg as soon as possible when there are neurological symptoms or signs, continued daily while awaiting definitive treatment and stopped if MSCC is excluded."}
     ]},

    {id:"assess", nav:"Assess", title:"Pain assessment — type, mechanism and total pain", sub:"Many palliative patients have more than one pain — assess each separately. The pain TYPE steers the adjuvant; the cancer diagnosis alone does not.",
     blocks:[
       {b:"table", head:["Pain type","Character and examples","Beyond the WHO ladder"], rows:[
         ["<b>Nociceptive — somatic</b>","Bone, soft tissue, skin, muscle. Localised, dull, aching or throbbing, well-localised, worse on movement or pressure. Bone metastasis pain (localised tenderness, worse on weight-bearing), post-surgical wound pain, pressure ulcer pain","Responds well to paracetamol + NSAIDs + opioids. Bone pain: consider radiotherapy via oncology; steroids or bone-targeted treatment only for specific indications"],
         ["<b>Nociceptive — visceral</b>","Organ capsule stretch or hollow-viscus obstruction. Deep, poorly localised, cramping or colicky, may refer distantly — liver capsule pain from hepatic metastases (right shoulder tip), bowel obstruction (colicky periumbilical), bladder spasm (suprapubic)","Opioids + smooth-muscle antispasmodics (hyoscine butylbromide for colic). Hepatic pain: dexamethasone reduces peri-tumour oedema"],
         ["<b>Neuropathic</b>","Nerve damage or compression — tumour infiltration of a nerve plexus (brachial, lumbosacral), post-chemotherapy peripheral neuropathy, post-radiotherapy fibrosis, cord compression. Burning, shooting or electric, allodynia (pain to light touch), hyperalgesia, paraesthesia in a nerve territory","Poor opioid response — opioids only partially effective. Requires adjuvants: one first-line agent (amitriptyline, duloxetine, gabapentin or pregabalin), avoiding routine combination without specialist advice; nerve block for refractory cases; corticosteroid for nerve compression"],
         ["<b>Smooth-muscle colic</b>","<b>Deep, twisting, colicky (bowel or bladder)</b>","<b>Antispasmodic — hyoscine butylbromide (Buscopan)</b>"],
         ["<b>Mixed pain</b>","Most palliative patients have a mixture of nociceptive and neuropathic components","Assess each component separately and treat each mechanism — do not assume all pain has the same character because the patient has cancer"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"cream", h:"🕊️ Total pain (Cicely Saunders)", html:"Physical pain is one of five dimensions: + psychological (fear, anxiety, depression, loss of control) + social (isolation, financial, family distress) + spiritual/existential (loss of meaning, fear of death, unfinished business). All must be addressed for effective pain control. The GP's role extends beyond prescribing to listening, facilitating conversations about fears and meaning, and connecting patients with chaplaincy, counselling and social work. Involve the wider palliative team; educate and support carers in giving PRN medication and recognising uncontrolled pain."},
         {tone:"cream", h:"📏 Assessment tools", html:"<b>NRS 0–10:</b> “Right now, where is your pain on a scale of 0 to 10?” — quick and validated. <b>Ask at rest AND on movement</b> — movement pain is harder to control. <b>OPQRST:</b> onset, provocation/alleviation, quality, radiation, severity, timing — with specific prompts for neuropathic features. <b>Abbey Pain Scale</b> for cognitively impaired patients who cannot self-report: facial grimacing, vocalisation, posture, restlessness, skin changes, physiological signs — validated in dementia and delirium."}
       ]},
       {b:"kv", rows:[
         ["Principles","<b>By mouth, by the clock, for the individual, with attention to detail.</b> Set realistic goals — pain-free at rest and overnight may be more achievable than on movement"],
         ["Baseline","Check renal and liver function before starting analgesics where possible — it changes the opioid choice"],
         ["Comfort measures","Positioning, pressure care, heat and cold, gentle activity and complementary approaches support analgesia"]
       ]},
       {b:"cards", items:[
         {tone:"blue", h:"Before prescribing: checklist", html:"<ul><li>Current cancer diagnosis, treatment and prognosis</li><li>Pain score at rest and on movement; pain mechanism and red flags</li><li>Current opioid, all doses actually taken, and the last dose</li><li>Renal function, hepatic function and hydration</li><li>Bowel function and risk of obstruction</li><li>Sedation, delirium, hallucinations and myoclonus</li><li>Respiratory rate and level of consciousness</li><li>Concurrent benzodiazepines, gabapentinoids, alcohol and other CNS depressants</li><li>Allergies and previous opioid response</li><li>Patient goals and preferred place of care</li><li>Carer capability and district-nursing involvement</li><li>Access to medication, syringe driver and out-of-hours support</li></ul>"}
       ]},
       {b:"why", html:"A consultation that focuses exclusively on opioid dose titration while ignoring fear of death, family distress, financial concerns or loss of meaning will produce suboptimal pain control — psychological distress amplifies physical pain through central sensitisation and reduces analgesic efficacy. Depression and anxiety are independently associated with higher pain scores and greater analgesic requirements, and treating them reduces opioid dose requirements. Unrecognised pain in cognitively impaired palliative patients is a significant quality-of-care issue — carry the Abbey scale on home visits."}
     ]},

    {id:"ladder", nav:"WHO ladder", title:"The WHO analgesic ladder — with real doses", sub:"Step 1 for mild pain; Step 2 is increasingly skipped; go to a low-dose strong opioid for moderate–severe pain. Check every dose against the GMEC/GMMMG guideline, local formulary and product SmPC.",
     blocks:[
       {b:"table", head:["Step","Drugs and doses","Notes"], rows:[
         ["<b>Step 1 — mild pain (NRS 1–3)</b>","Paracetamol 1 g QDS (max 4 g/day; 2 g/day in the elderly, liver disease or low body weight). Reduce to 500 mg QDS if ≥1 hepatotoxicity risk (age, &lt;50 kg, poor nutrition/cachexia, chronic alcohol). Severe renal impairment (eGFR &lt;30): 500 mg 6-hourly, max 3 g/day","Start here for mild pain"],
         ["<b>Step 1 — NSAID</b>","Celecoxib 100–200 mg BD (the PCF NSAID of choice), ibuprofen 200–400 mg TDS with food, or naproxen 250–500 mg BD. PPI co-prescription mandatory (omeprazole 20 mg OD)","Particularly effective for bone pain (prostaglandin-mediated inflammation). Avoid in renal impairment, cardiovascular disease, GI history and the elderly. NSAIDs + opioids are additive for bone pain — do NOT stop the NSAID when moving to Step 2/3"],
         ["<b>Step 2 — moderate pain (NRS 4–6)</b>","Codeine 30–60 mg QDS, dihydrocodeine 30 mg QDS, or tramadol 50–100 mg QDS. Continue Step 1 drugs","Increasingly controversial — there is no pharmacological need for Step 2 in cancer pain; a low-dose strong opioid gives quicker, better relief. Codeine needs CYP2D6 conversion: 7% are poor metabolisers (no effect) and 7–10% ultra-rapid (toxicity). Tramadol is dual opioid + SNRI — lowers the seizure threshold, serotonin syndrome risk with SSRIs/SNRIs/TCAs; avoid in epilepsy"],
         ["<b>Step 3 — severe pain (NRS 7–10)</b>","Morphine first-line (familiarity, availability, cost), oral route preferred. Typical opioid-naive adult, normal renal/hepatic function: morphine MR 10–15 mg 12-hourly, or IR morphine 5 mg 4-hourly (NICE CG140: 20–30 mg/day), PLUS IR morphine 5 mg PRN. Frail/elderly, low body weight or significant comorbidity: IR morphine 2.5 mg 4-hourly, or local equivalent. Moderate/severe renal or hepatic impairment: seek specialist advice before prescribing strong opioids. Pain unstable, rapidly changing or oral route unsuitable: consider specialist-supported SC titration","No ceiling dose except in renal impairment. Always provide an IR breakthrough dose"]
       ]},
       {b:"why", html:"Multiple RCTs have shown that low-dose Step 3 opioids (oral morphine 5–10 mg QDS) are more effective and better tolerated than maximum-dose Step 2 opioids, which supports considering a move directly from Step 1 to low-dose Step 3 if Step 1 is inadequate."}
     ]},

    {id:"titrate", nav:"Titrate", title:"Starting and titrating oral morphine", sub:"The practical sequence, and the co-prescriptions that are not optional.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1", title:"Calculate and start", when:"opioid-naive, normal renal function", fromLabel:"the starting point",
          html:"Calculate the total daily opioid requirement from the current codeine or tramadol dose and convert to oral morphine equivalent (codeine 240 mg/day = morphine 24 mg/day; tramadol 400 mg/day = morphine 40–80 mg/day). Typical opioid-naive adult: morphine MR 10–15 mg 12-hourly, or IR morphine 5 mg 4-hourly (NICE CG140). Frail, elderly, low body weight or significant comorbidity: IR morphine 2.5 mg 4-hourly or a lower MR regimen under local guidance. Moderate or severe renal or hepatic impairment: specialist advice first."},
         {step:"2", title:"Prescribe the breakthrough dose", when:"always, alongside the regular opioid", fromLabel:"PRN",
          html:"Use an immediate-release opioid rescue dose of approximately one-tenth to one-sixth of the regular 24-hour opioid dose, individualised according to age, frailty, renal function, toxicity and previous response — e.g. on 30 mg MR BD = 60 mg/day → about 5–10 mg. Prescribe 4-hourly PRN with a local maximum (more frequent dosing only under an agreed specialist titration protocol). Immediate-release oral morphine is first-line rescue for patients on oral morphine; fast-acting fentanyl is not (NICE CG140). Recalculate after every regular-dose change, and do not allow repeated dosing without reassessment."},
         {step:"3", title:"Titrate", when:"review every 24–48 hours", fromLabel:"persistent pain",
          html:"(1) Add the total immediate-release opioid used in the preceding 24 hours to the regular 24-hour dose: this is the new total daily dose. (2) Divide by 2 for a 12-hourly MR regimen. (3) Recalculate the rescue dose as about 1/10 to 1/6 of the new total. (4) Consider a smaller increase if there is frailty, toxicity, renal impairment or uncertain adherence. Example: MR 10 mg BD (20 mg/day) + 15 mg IR used = 35 mg/day → MR 15–20 mg BD depending on context, IR about 5 mg PRN, review within 24 hours. Round conservatively to available formulations. Seek specialist advice if three or more rescue doses are needed in 24 hours, pain remains uncontrolled, or a satisfactory balance is not reached after a few dose adjustments."},
         {step:"4", title:"Co-prescribe — from the start", when:"every patient, day one", fromLabel:"predictable side effects",
          html:"A regular stimulant laxative, with or without an osmotic laxative, according to bowel habit, hydration, renal function and local formulary — opioid constipation does NOT tolerate out. A PRN antiemetic for the first days, chosen by likely cause (for example metoclopramide for gastric stasis, haloperidol for opioid or chemical nausea) — nausea usually settles as tolerance develops."}
       ]},
       {b:"warn", html:"Never stop a patient's regular long-acting or basal opioid when adding breakthrough doses. In the last days of life, or if the patient cannot swallow, convert to a continuous subcutaneous infusion (syringe pump)."},
       {b:"table", head:["Route / indication","Detail"], rows:[
         ["<b>Subcutaneous syringe driver</b>","Indications: unable to swallow (dysphagia, vomiting, reduced consciousness), rapid dose changes needed, patient preference, last days of life. Commonly combined over 24 hours: diamorphine (preferred SC in the UK — more soluble than morphine) + midazolam (anxiolytic/sedative) + glycopyrronium or hyoscine hydrobromide (secretions). Haloperidol can be added as antiemetic"],
         ["<b>Incident / movement pain</b>","Regular analgesia alone is insufficient. Give an immediate-release opioid about 30 minutes before the anticipated pain. Do not initiate transmucosal fentanyl routinely in primary care. Consider it only after specialist palliative-care advice for appropriately opioid-tolerant patients with recurrent, short-duration breakthrough cancer pain despite optimised background treatment. It is not first-line rescue (NICE CG140), is not calculated from the background opioid, must be titrated independently from the lowest product-specific dose, and carries major medication-error and overdose risks. Follow the individual product SmPC and local formulary; never substitute one fentanyl formulation for another microgram-for-microgram"]
       ]}
     ]},

    {id:"convert", nav:"Conversions", title:"Opioid conversion — the ratios that matter", sub:"All conversions are approximate. Product-specific SmPC and local GMEC/GMMMG conversion tables take precedence. Always provide a new, correctly calculated rescue dose after switching.",
     blocks:[
       {b:"table", head:["From → To","Divide by","Example"], rows:[
         ["<b>Oral codeine / dihydrocodeine / tramadol → oral morphine</b>","<b>÷ 10</b>","<b>codeine 240 mg → morphine 24 mg</b>"],
         ["<b>Oral morphine → oral oxycodone</b>","<b>÷ 1.5–2 (approximate starting estimate only; ratios vary)</b>","<b>morphine 30 mg → oxycodone 15–20 mg</b>"],
         ["<b>Oral morphine → SC morphine</b>","<b>÷ 2</b>","<b>morphine 60 mg oral → 30 mg SC/24 h</b>"],
         ["<b>Oral morphine → SC diamorphine</b>","<b>÷ 3</b>","<b>morphine 60 mg oral → 20 mg SC/24 h</b>"],
         ["<b>Oral oxycodone → SC oxycodone</b>","<b>÷ 1.5–2</b>","<b>oxycodone 30 mg oral → 15–20 mg SC/24 h</b>"],
         ["<b>Fentanyl patch (approx)</b>","—","Specialist reference only: equivalences differ between products and UK references (e.g. 12 mcg/h is quoted as about 30–45 mg oral morphine/24 h). Use the product SmPC and local GMEC/GMMMG table; do not start a patch for unstable pain"]
       ]},
       {b:"kv", rows:[
         ["The full equivalence set","Approximate only: oral morphine 30 mg/day ≈ oxycodone 15–20 mg ≈ SC diamorphine 10 mg/24 h ≈ SC morphine 15 mg/24 h, before any cross-tolerance reduction. Fentanyl patch equivalences are product-specific — use the SmPC and local table"],
         ["Cross-tolerance","Calculate the patient's total opioid exposure, including regular and clinically used breakthrough doses. Reduce the calculated equivalent dose for incomplete cross-tolerance — usually by 25–50%, with a larger reduction in frailty, high-dose switches, renal or hepatic impairment, or when changing to a more potent opioid (SPS). Starting at 100% risks overdose"],
         ["Verify","Check against the current product SmPC, the local GMEC/GMMMG conversion table and/or specialist palliative-care advice. <b>Methadone is specialist-only: do not independently convert to methadone</b>, and do not initiate opioid patches for unstable pain. Fentanyl and buprenorphine patches are NOT removed for breakthrough — add IR breakthrough alongside"]
       ]}
     ]},

    {id:"alternatives", nav:"Which opioid", title:"Alternative strong opioids and renal impairment", sub:"Switch for side effects, renal impairment, route, or availability — not by default.",
     blocks:[
       {b:"table", head:["Opioid","When to use","Notes"], rows:[
         ["<b>Oxycodone (OxyContin MR / OxyNorm IR)</b>","<b>Morphine intolerance; in renal impairment only with caution or specialist advice</b>","~1.5–2× as potent as oral morphine (approximate). Can also accumulate in renal impairment — not universally renal-safe"],
         ["<b>Fentanyl patch (12–25 mcg/h upwards)</b>","<b>Stable pain, swallowing problems; in renal impairment only on specialist advice (not started simply because eGFR is low)</b>","72-hour patch; NOT for acute titration or unstable/rapidly changing pain; takes ~12–24 h to work; keep IR breakthrough"],
         ["<b>Buprenorphine patch (BuTrans / Transtec)</b>","<b>Stable moderate pain, renal impairment</b>","<b>Lower-potency patch; weekly (BuTrans) or twice-weekly</b>"],
         ["<b>Alfentanil (SC)</b>","<b>Severe renal impairment (eGFR &lt;30) in a syringe pump</b>","<b>Specialist-led only; short-acting; needs syringe-driver expertise</b>"],
         ["<b>Methadone</b>","<b>Complex or neuropathic pain refractory to other opioids</b>","<b>Specialist initiation only — long, variable half-life</b>"],
         ["<b>Hydromorphone</b>","<b>An option in opioid rotation for OIN</b>","Different metabolite profile from morphine"]
       ]},
       {b:"table", head:["Renal function","Preferred opioid"], rows:[
         ["<b>Normal / mild</b>","<b>Morphine</b>"],
         ["<b>Moderate (eGFR 30–50)</b>","<b>Seek specialist advice before prescribing strong opioids (NICE CG140); oxycodone can also accumulate</b>"],
         ["<b>Severe (eGFR &lt;30)</b>","If eGFR is below 30 mL/min/1.73 m², there is AKI, or renal function is deteriorating, seek same-day specialist palliative-care advice before escalating or switching opioids. Avoid automatic conversion to a patch. If analgesia is unstable, a specialist-supported SC opioid may be safer than a transdermal preparation"]
       ]},
       {b:"warn", html:"Switch to a non-morphine opioid mainly for: unacceptable morphine side effects, renal impairment (morphine has active renally-cleared metabolites → toxicity), the transdermal route being preferable, or morphine unavailability. Suspect renal impairment or accumulation if a previously stable patient becomes toxic. eGFR may overestimate renal function in cachexia and low body weight, and is unreliable for dosing in AKI or rapidly changing renal function. Patches are unsuitable for rapidly changing pain."}
     ]},

    {id:"sideeffects", nav:"Side effects", title:"Opioid side effects and toxicity", sub:"Most are predictable and preventable. One is an emergency.",
     blocks:[
       {b:"table", head:["Effect","Action"], rows:[
         ["<b>Constipation</b>","<b>Common, and little tolerance develops — prescribe a regular stimulant laxative, with or without an osmotic laxative, according to bowel habit, hydration, renal function and local formulary, and review bowel function proactively. Methylnaltrexone (Relistor) SC is specialist-supported treatment for opioid-induced constipation when conventional laxatives have failed: exclude mechanical bowel obstruction; avoid where GI perforation is suspected or there is significant risk; review abdominal pain, diarrhoea and opioid withdrawal; use the current SmPC for weight and renal dosing. It is not appropriate simply because the bowels have not opened for one day</b>"],
         ["<b>Nausea</b>","Common early, usually transient — choose an antiemetic according to the likely cause, comorbidity and local palliative-care guideline (for example metoclopramide or haloperidol), and review promptly if symptoms persist or bowel obstruction is possible"],
         ["<b>Sedation / dry mouth</b>","Often settles within a few days; reassure. If persistent, consider dose reduction plus an adjuvant. Warn about driving when starting or changing dose"],
         ["<b>Hallucinations / confusion</b>","<b>Assess reversible causes; specialist-supported dose reduction or opioid rotation</b>"],
         ["<b>Itch</b>","<b>Opioid rotation, or ondansetron 4 mg BD</b>"],
         ["<b>Urinary retention</b>","Catheterise if severe; alpha-blocker (tamsulosin 0.4 mg OD) if BPH contributes"],
         ["<b>Opioid toxicity</b>","Persistent drowsiness, vivid dreams or hallucinations, myoclonus (jerks), pinpoint pupils, confusion → reduce dose, individualise hydration, check renal function, seek specialist advice about an opioid switch"],
         ["<b>Life-threatening respiratory depression</b>","Unrousable or clinically significant respiratory depression → manage ABCs and give carefully titrated naloxone according to the local emergency protocol, titrating to restore ventilation while avoiding abrupt withdrawal and severe pain (SPS)"]
       ]},
       {b:"warn", html:"In palliative patients use small, titrated naloxone doses for respiratory depression — a full reversal dose causes severe pain and acute withdrawal. <b>Do not use naloxone for opioid-induced neurotoxicity in the absence of respiratory depression</b> — seek urgent specialist advice on dose reduction or rotation."}
     ]},

    {id:"adjuvants", nav:"Adjuvants", title:"Adjuvant analgesics by pain type", sub:"Adjuvants run alongside the WHO ladder — they target a mechanism the opioid alone will not control.",
     blocks:[
       {b:"table", head:["Pain","Adjuvant","Detail"], rows:[
         ["<b>Neuropathic</b>","Offer one first-line agent — amitriptyline, duloxetine, gabapentin or pregabalin — selected by age, renal function, comorbidity, interactions and preference; switch if ineffective or not tolerated, and avoid routine combination without specialist advice (NICE CG173). <b>Amitriptyline 10–25 mg nocte</b> (caution in older patients, delirium, urinary retention, glaucoma and cardiac disease; allow 4–6 weeks; titrate to 50–75 mg if tolerated). <b>Duloxetine 30–60 mg OD</b> (useful where depression is comorbid — treats both). <b>Gabapentin 300 mg OD → 300 mg TDS → 900 mg TDS</b> (titrate over 3–4 weeks; sedating initially). <b>Pregabalin 75 mg BD → 150 mg BD → 300 mg BD</b>. Gabapentin and pregabalin: reduce doses in renal impairment; sedation and respiratory-depression risk with opioids; Schedule 3 CDs with misuse and dependence risk; taper rather than stop abruptly","Add a corticosteroid (dexamethasone) for nerve compression. Lidocaine 5% patch (Versatis) for localised allodynia or hyperalgesia — e.g. post-thoracotomy, rib metastasis — applied 12 hours on / 12 hours off"],
         ["<b>Bone</b>","<b>Dexamethasone</b> only for specific indications, not routinely for uncomplicated bone-metastasis pain where radiotherapy or bone-targeted treatment may be more appropriate. <b>NSAIDs continued alongside opioids</b> (additive via prostaglandin inhibition). <b>Bone-targeted treatment (bisphosphonate or denosumab)</b> via oncology: schedule, indication, renal function, calcium and vitamin D status and dental assessment per the oncology protocol","Bisphosphonates and denosumab are not simple analgesics and should not usually be started in the last days of life. Single-fraction radiotherapy 8 Gy for localised uncomplicated painful bone metastases (RCR): response is not guaranteed, onset often 2–6 weeks, repeatable. Arrange via oncology"],
         ["<b>Visceral / liver capsule</b>","<b>Dexamethasone 4–8 mg OD</b> for liver-capsule pain (hepatomegaly from metastases — reduces oedema; also 8–16 mg OD reducing, for raised ICP or nerve compression). <b>Hyoscine butylbromide (Buscopan) 20 mg SC/PO</b> for intestinal or bladder colic. <b>Hyoscine hydrobromide 0.4 mg SC</b>","Octreotide 0.6–1.2 mg SC/24 h for inoperable bowel obstruction — reduces intestinal secretions and relieves obstruction pain without surgery; specialist-initiated but the GP may continue. Give dexamethasone before 2 pm, co-prescribe gastroprotection, review and taper"],
         ["<b>Refractory / spinal</b>","<b>Intrathecal drug delivery (ITDD) or epidural analgesia</b> for pain unresponsive to systemic opioids — especially pelvic/perineal pain and bilateral lower-limb pain from lumbosacral plexopathy","Allows much lower doses — intrathecal morphine is about 1/100 of the oral dose; bupivacaine can be added intrathecally. TENS is a useful adjunct for localised pain — apply electrodes around, not on, the painful area"]
       ]},
       {b:"warn", html:"Dexamethasone indications (bone pain, liver-capsule pain, nerve compression, raised intracranial pressure, bowel obstruction) are not interchangeable. Prescribe in the morning, or morning and lunchtime; use the lowest effective dose; review benefit within about 5–7 days; taper if used beyond a short course; monitor glucose, infection, dyspepsia, delirium, insomnia and proximal myopathy; use gastroprotection where clinically appropriate; seek specialist advice for prolonged treatment."},
       {b:"why", html:"Single-fraction radiotherapy at 8 Gy for localised uncomplicated painful bone metastases is supported by the RCR and by systematic reviews of randomised trials (Chow et al., J Clin Oncol 2007; updated Clin Oncol 2012), which found it as effective for pain as multi-fraction regimens, with one visit instead of several. Response is not guaranteed, onset is often 2–6 weeks, and complicated disease (fracture, spinal instability, cord compression) needs specialist assessment. Ask oncology about access. Lidocaine 5% plasters are licensed for post-herpetic neuralgia but widely used off-label for localised neuropathic palliative pain (post-thoracotomy, rib metastases, mesothelioma, post-mastectomy) — direct sodium-channel blockade at the site, no meaningful systemic absorption, excellent where systemic doses cannot be increased further."}
     ]},

    {id:"eol", nav:"End of life", title:"End-of-life symptom management", sub:"When the oral route is lost, the analgesia does not stop.",
     blocks:[
       {b:"table", head:["Symptom","Management"], rows:[
         ["<b>Pain in the last days</b>","Maintain analgesia via the SC route when the oral route is lost — convert the oral opioid to SC diamorphine in a syringe driver. Do NOT stop analgesia because the patient is unconscious: pain pathways remain active. PRN SC injections for breakthrough. Reassess every 4 hours in the actively dying patient and document the response. If pain remains uncontrolled despite optimal analgesia → palliative sedation discussion with the specialist"],
         ["<b>Dyspnoea</b>","Low-dose opioids can ease breathlessness in advanced illness (Cochrane 2016: low-quality evidence of a small benefit) — low-dose SC morphine 2.5–5 mg PRN or in the driver; reduces respiratory drive without hastening death at appropriate doses. Lorazepam 0.5–1 mg SL or midazolam 2.5–5 mg SC for the anxiety component. A fan directed at the face stimulates V2 trigeminal receptors and reduces the perception of dyspnoea independently of saturations. Assess for reversible causes such as pulmonary embolism, infection, pleural effusion, anaemia, heart failure and airway obstruction. Do not use oxygen routinely: only for symptomatic hypoxaemia where benefits outweigh burdens (NICE NG31). Opioids and benzodiazepines together can cause potentially fatal respiratory depression (MHRA): use the lowest effective doses and monitor"],
         ["<b>Agitation / terminal restlessness</b>","Midazolam 2.5–5 mg SC PRN (first line). Haloperidol 0.5–1.5 mg SC if confusion or hallucinations are prominent. Levomepromazine 6.25–12.5 mg SC for refractory agitation (sedating antipsychotic — broad-spectrum antiemetic + anxiolytic + sedative). Exclude reversible causes: urinary retention (catheterise), constipation, pain, hypercalcaemia, opioid toxicity, steroids"],
         ["<b>Nausea and vomiting</b>","Choose an antiemetic according to the likely cause, comorbidity and local palliative-care guideline; review promptly if symptoms persist or bowel obstruction is possible. Metoclopramide for gastric stasis (avoid in complete bowel obstruction; caution in partial obstruction). Haloperidol 0.5–1.5 mg SC OD/BD for chemical, metabolic or opioid-related nausea (consider QT prolongation, extrapyramidal effects and frailty). Cyclizine 50 mg SC/IM TDS for vestibular or raised-ICP nausea (anticholinergic effects; may worsen heart failure). Ondansetron 4–8 mg SC BD for selected indications such as chemotherapy-related nausea (constipation, QT). Levomepromazine 6.25 mg SC OD for specialist or refractory use. Cyclizine + haloperidol + octreotide for malignant bowel obstruction"],
         ["<b>Respiratory secretions (death rattle)</b>","Glycopyrronium 0.2–0.4 mg SC PRN or 0.6–1.2 mg SC/24 h in the driver (reduces secretion production; does not clear existing secretions). Hyoscine hydrobromide 0.4 mg SC PRN or 1.2–2 mg SC/24 h (more sedating). Reposition side-lying to reduce pooling. Reassure the family: the noise distresses observers, not the deeply unconscious patient. Do not suction routinely — traumatic and ineffective. Antimuscarinics may cause delirium, urinary retention, dry mouth and sedation: stop if there is no symptomatic benefit or adverse effects occur"],
         ["<b>Palliative sedation</b>","A specialist palliative-care-led intervention, not a routine GP intervention, for refractory suffering after assessment of reversible causes, proportionality, consent/capacity, documentation and discussion with those important to the patient. Proportionate sedation preserves consciousness where possible. It is distinct from routine symptom control and is not intended to hasten death"]
       ]},
       {b:"why", html:"Multiple prospective studies of opioid use in the last days of life show no correlation between opioid dose, within therapeutic ranges, and time to death. Opioids titrated to symptom relief rather than to unconsciousness are ethical, compassionate and clinically correct — and the fear of “hastening death” is one of the commonest barriers to adequate symptom control in dying patients. The sentence to have ready: “We are giving morphine to relieve the pain and breathlessness — at the doses we're using, the evidence shows this does not shorten life.” Haloperidol acts at the chemoreceptor trigger zone via D2 blockade and is one option for chemical/metabolic nausea (opioids, uraemia, hypercalcaemia) at 0.5–1.5 mg; choose the antiemetic by likely cause."}
     ]},

    {id:"planning", nav:"Planning &amp; carers", title:"Advance care planning, GSF, anticipatory prescribing and carer support", sub:"The work that prevents the 3 a.m. emergency admission.",
     blocks:[
       {b:"table", head:["Element","What to do","Why"], rows:[
         ["<b>Gold Standards Framework register</b>","All patients with life-limiting illness on the practice GSF/palliative register, reviewed monthly at MDT. The surprise question: “Would I be surprised if this patient died in the next 12 months?” — if no, they go on the register. The 3 Cs: Coding, Communication (ACP conversations) and Co-ordination (OOH notification, DNACPR, EPS prescribing)","Proactive identification and coordinated care may help avoid unwanted hospital admissions and improve care in the preferred place"],
         ["<b>Anticipatory prescribing (“just in case” box)</b>","Prescribe in advance: SC diamorphine (or morphine), SC midazolam, SC glycopyrronium (or hyoscine), SC haloperidol — typical opioid-naive starting doses are diamorphine 10–20 mg/24 h (calculate from the current opioid), midazolam 10 mg/24 h and glycopyrronium 0.6–1.2 mg/24 h. Prescribe when the patient is deteriorating but still at home, label clearly “if needed in the last days of life”, and store the medicines at the patient's home so district nurses and OOH can act without waiting for a doctor. Document the prescription and the rationale","<b>May help avoid unwanted emergency admissions in the last days of life</b>"],
         ["<b>Keep the JIC dose current</b>","Every time the regular opioid is titrated, immediately reissue the PRN prescription at the new recalculated rescue dose and tell the district nursing team","If the JIC box still holds the old PRN dose, district nurses give inadequate analgesia — a frequently overlooked prescribing-safety point"],
         ["<b>DNACPR and advance care planning</b>","Have the conversation early, while the patient has capacity, energy and time. Document in a signed ACP; share electronically (ReSPECT or equivalent) and via EPaCCS with 111, OOH GP and the ambulance service. Discuss preferred place of death and specific fears (suffocation? pain? being alone?), and spiritual or religious needs","Most patients prefer home; many still die in hospital"],
         ["<b>Carer support</b>","Identify the primary carer at every visit; carer's assessment via local authority social services (a legal right); GP letter supporting Carer's Allowance (current rates and eligibility on GOV.UK)","Carers are at high risk of depression, burnout, complicated grief and physical illness"],
         ["<b>Financial and practical support</b>","Benefits check at diagnosis: Attendance Allowance (State Pension age or over, not means-tested, and no DVLA notification is needed), PIP (under State Pension age; current rates on GOV.UK), and the Special Rules fast-track using the SR1 form (formerly DS1500) where life expectancy may be 12 months or less — PIP/AA without waiting for assessment. Macmillan financial navigators, Blue Badge, NHS Continuing Healthcare, Citizens Advice, Marie Curie","The SR1 takes about 5 minutes and bypasses months of processing — for a patient with months to live, Attendance Allowance at the higher rate or PIP enhanced daily living materially affects care at home. It does not affect driving licence status (no DVLA notification) and can be submitted directly to the DWP"],
         ["<b>Psychological and spiritual support</b>","Depression is present in approximately 25% of palliative patients and significantly amplifies pain — antidepressants work (mirtazapine, sertraline; fast-onset preferred). CBT/counselling via Macmillan; chaplaincy and spiritual care. Explore non-judgementally: “Do you have any beliefs or practices that help you cope?”","Do not assume religiosity — or its absence"],
         ["<b>Hospice and day hospice</b>","Hospice admission is for complex symptom control, respite AND terminal care — not only the last days: many patients are admitted for symptom control and discharged home. Day hospice 1–2 days/week for social support, complementary therapies, symptom monitoring and peer support. Hospice at Home (Marie Curie, local charities) enables hospital-quality nursing at home","The misconception that hospice means imminent death drives late referral and lost months of good symptom control"],
         ["<b>Equipment and home modifications</b>","OT assessment for a hospital or profiling bed, pressure-relieving mattress, hoist, commode, raised toilet seat, bath seat, stair lift, wheelchair, TENS machine, recliner chair — usually free on the NHS to palliative patients. Apply EARLY; equipment takes time to arrive","Also reduces pressure-ulcer risk and carer strain"]
       ]}
     ]},

    {id:"monitor", nav:"Monitor", title:"Follow-up, monitoring and safety-netting", sub:"Review rhythm, controlled-drug rules, and the phone calls that must happen today.",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["<b>Pain and symptom review</b>","<b>At least fortnightly during titration; monthly when stable</b>","Document the NRS at rest AND on movement, PRN use in the last 24 hours, side effects (constipation, confusion, sedation), functional status, mood and carer wellbeing. Adjust the dose from PRN use. Contact the specialist if exceeding 200 mg oral morphine equivalent/day without pain control"],
         ["<b>Opioid prescription safety</b>","<b>Every prescription</b>","Morphine, oxycodone and fentanyl are Schedule 2 CDs with specific prescription requirements; pregabalin, tramadol and gabapentin are Schedule 3. Prescribe monthly supplies, not 3-monthly, for CDs. Ensure sufficient supply of BOTH regular and PRN formulations"],
         ["<b>GSF and anticipatory medicines review</b>","<b>Monthly MDT; at each visit when deteriorating</b>","Ensure the JIC box is in place and the PRN dose is current; ensure the DNACPR is documented, signed and shared with 111/OOH/ambulance via EPaCCS"],
         ["<b>Carer monitoring</b>","<b>Every palliative visit</b>","Coping? Sleep? Own health? Identify carer fatigue early and facilitate respite. Prepare bereavement support before the death; a GP condolence letter or call is supported as good practice — the GP is often the only consistent healthcare relationship surviving bereavement"],
         ["<b>Telephone review within 24 hours</b>","<b>NRS 6–7 despite current analgesia</b>","Titrate by phone, increase the regular dose, review PRN use. New confusion or hallucinations → consider rotation with specialist advice. Carer reporting overnight distress → same-day visit and consider starting a syringe driver"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"📞 Same-day / 999", html:"Uncontrolled severe pain (NRS ≥8) at any review → phone palliative care the same day · MSCC features (new weakness or numbness + back pain in cancer) → MSCC coordinator immediately, dexamethasone 16 mg if neurological signs, MRI within 24 hours, 999 if deteriorating or unsafe to transfer · confusion + myoclonus + worsening pain on high-dose morphine → opioid toxicity, specialist same day · agitation or distress in the last hours without adequate sedation → start midazolam SC and phone palliative care."},
         {tone:"cream", h:"💬 What to say", html:"“We'll treat each of your pains in the way that suits it — a strong painkiller around the clock with extra doses for flare-ups, plus a laxative, because these medicines always slow the bowels. If one type of pain doesn't settle there are add-on treatments and a specialist team we can call on.” And to families: “At the doses we're using, the evidence shows this does not shorten life.”"}
       ]},
       {b:"why", html:"Bereavement follow-up is a core primary-care competency and a recognised clinical outcome of palliative care quality. A brief call at about 6 weeks, or a condolence letter, costs little time but validates grief, gives an opportunity to identify prolonged grief disorder (a clinical diagnosis in ICD-11, in use from 2022, and in DSM-5-TR, 2022), and maintains the relationship the carer will need for their own health."}
     ]},

    {id:"loop", nav:"Still in pain?", title:"Pain still uncontrolled? Re-check before escalating", sub:"Opioid-resistant pain (neuropathic, bone, colic, incident) needs the right adjuvant or a non-drug measure, not just dose increases.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"1 · Pain type", html:"<b>Neuropathic, bone or colic? Add the matching adjuvant.</b>"},
         {tone:"amber", h:"2 · Breakthrough", html:"Is the rescue dose about 1/10 to 1/6 of the 24-hour dose, and is it being used? Titrate the regular dose up."},
         {tone:"amber", h:"3 · Toxicity vs pain", html:"Drowsy + myoclonus + still in pain = opioid toxicity → switch opioid, don't just increase."},
         {tone:"amber", h:"4 · Renal", html:"New toxicity in a previously stable patient → check renal function and accumulation."},
         {tone:"amber", h:"5 · Incident pain", html:"Pain only on movement or during care → immediate-release opioid about 30 minutes before; transmucosal fentanyl only after specialist advice."},
         {tone:"amber", h:"6 · Specialist", html:"Refractory, complex neuropathic, or considering methadone, patches, nerve block or intrathecal analgesia → specialist palliative care."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways", sub:"Who to phone, and what they can offer that primary care cannot.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999 / same-day emergency", html:"MSCC (new neurological signs + known cancer) → MSCC coordinator immediately, dexamethasone 16 mg, MRI within 24 hours; 999 if deteriorating, unstable or unsafe to transfer · uncontrolled pain crisis (NRS ≥8 unresponsive to breakthrough) → phone palliative care same day · SVCO with airway compromise, stridor, syncope or haemodynamic compromise → 999 and acute oncology; otherwise acute oncology urgently · pathological fracture → immobilise and urgent orthopaedic assessment; 999 for severe pain, deformity, neurovascular compromise, unsafe transfer or suspected spinal instability · opioid toxicity/OIN → palliative care phone same day."},
         {tone:"red", h:"Specialist palliative care: same day", html:"Contact specialist palliative care the same day for uncontrolled pain despite rescue medication, suspected OIN, rapidly escalating opioid requirement, moderate/severe renal impairment, complex neuropathic pain, need for opioid rotation, unstable pain requiring SC titration, suspected bowel obstruction, or consideration of methadone, alfentanil, transmucosal fentanyl, nerve block or palliative sedation."},
         {tone:"amber", h:"Specialist palliative care", html:"Pain uncontrolled despite Step 3 opioids and optimised adjuvants (strong-opioid escalation not achieving NRS &lt;4) · syringe-driver initiation or titration · neuropathic pain requiring high-dose adjuvants · incident pain requiring transmucosal fentanyl · refractory pain for nerve block or spinal analgesia · complex neuropathic pain · methadone consideration · rapid dose escalation · refractory symptoms at the end of life."},
         {tone:"amber", h:"Specialist palliative psychology \u2014 not NHS Talking Therapies", html:"<b>Existential or psychological distress that is amplifying the pain needs <b>specialist palliative psychology, and NHS Talking Therapies is not the appropriate route</b> \u2014 the waiting times, session limits and protocols are built for a different population and a different prognosis. Route it through the specialist palliative care team (or Macmillan psychological support), alongside chaplaincy and spiritual care.</b>"},
         {tone:"blue", h:"Oncology", html:"Bone-metastasis pain → single-fraction radiotherapy (8 Gy) referral · SVCO → urgent stenting or radiotherapy · brain metastases → stereotactic radiosurgery or whole-brain radiotherapy · bone-targeted treatment (bisphosphonate or denosumab) per oncology protocol · review of systemic anticancer therapy if progression is causing pain."},
         {tone:"blue", h:"Anaesthetics / interventional pain", html:"Coeliac plexus block for pancreatic cancer (70–80% pain relief) · cordotomy for unilateral mesothelioma pain · stellate ganglion block for Pancoast-tumour arm pain · intrathecal drug delivery · epidural for refractory pelvic or perineal pain."},
         {tone:"green", h:"GP-provided community support", html:"GSF register with proactive care planning, anticipatory prescribing and OOH notification · district nursing for syringe-driver management, wound care and medication administration at home · Macmillan nurses for patient and carer support and symptom advice · Marie Curie nurses for overnight sits."}
       ]},
       {b:"why", html:"Coeliac plexus block for pancreatic cancer pain is one of the most effective interventional analgesic procedures available — significant pain reduction in 70–80%, dramatically reduced opioid requirements (and therefore toxicity) for months, performed under CT or ultrasound guidance in about 45 minutes under sedation. Despite this it is significantly underused: many patients are maintained on escalating opioid doses with increasing toxicity when they could have had the block."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A telephone call from the daughter of a 74-year-old man with metastatic prostate cancer on MST 60 mg BD. Over three days he has become muddled and is “twitching in his sleep”, and — despite using six Oramorph doses yesterday — says his back pain is worse, not better. This morning his legs feel “heavy” and he could not get to the toilet in time."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Recognises <b>two emergencies at once</b>: the pain-worse-despite-more-opioid pattern with myoclonus and confusion as opioid-induced neurotoxicity, and new leg weakness plus bladder disturbance in known bone metastases as MSCC; contacts the MSCC coordinator immediately, gives dexamethasone 16 mg without waiting for imaging, arranges whole-spine MRI within 24 h and emergency transfer given progressing weakness; withholds further opioid escalation, considers reversible causes (hypercalcaemia, renal function, infection), and seeks urgent specialist advice on dose reduction or rotation — naloxone only for respiratory depression; checks the <b>rescue dose is about 1/10 to 1/6 of the 24-hour total</b>; phones the <b>palliative care specialist the same day</b>; and supports the daughter as a carer in her own right."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>Greater Manchester &amp; Eastern Cheshire (GMEC) / GMMMG Palliative Care Pain and Symptom Control Guidelines for Adults (modified April 2025, review April 2028)<br><a href="https://gmmmg.nhs.uk/" rel="noopener">gmmmg.nhs.uk</a><span class="rd"> \u2014 the local standard for starting doses, rescue doses, conversions, MSCC dexamethasone equivalents, syringe-driver combinations and anticipatory prescribing</span></li>'+
         '<li>NICE CG140 \u2014 Palliative care for adults: strong opioids for pain relief<br><a href="https://www.nice.org.uk/guidance/cg140" rel="noopener">nice.org.uk/guidance/cg140</a><span class="rd"> \u2014 starting dose 20\u201330 mg/day oral morphine; IR oral morphine as first-line rescue; not fast-acting fentanyl first line; specialist advice in moderate/severe renal or hepatic impairment</span></li>'+
         '<li>NICE NG234 \u2014 Spinal metastases and metastatic spinal cord compression (2023; replaced CG75)<br><a href="https://www.nice.org.uk/guidance/ng234" rel="noopener">nice.org.uk/guidance/ng234</a><span class="rd"> \u2014 contact the MSCC coordinator immediately; dexamethasone 16 mg as soon as possible if there are neurological symptoms or signs; whole-spine MRI within 24 hours</span></li>'+
         '<li><b>NICE NG31 \u2014 Care of dying adults in the last days of life (2015)</b><br><a href="https://www.nice.org.uk/guidance/ng31" rel="noopener">nice.org.uk/guidance/ng31</a><span class="rd"> \u2014 the end-of-life symptom-control and anticipatory-prescribing standards; no routine oxygen unless symptomatic hypoxaemia</span></li>'+
         '<li>Chow E et al. Palliative radiotherapy trials for bone metastases: a systematic review. J Clin Oncol 2007;25(11):1423\u20131436; and Chow E et al. Update on the systematic review of palliative radiotherapy trials for bone metastases. Clin Oncol (R Coll Radiol) 2012;24(2):112\u2013124<span class="rd"> \u2014 single-fraction 8 Gy as effective for pain as multi-fraction radiotherapy for uncomplicated bone metastases; response not guaranteed</span></li>'+
         '<li><b>Royal College of Radiologists \u2014 radiotherapy dose fractionation guidance</b><br><a href="https://www.rcr.ac.uk/" rel="noopener">rcr.ac.uk</a><span class="rd"> \u2014 8 Gy single fraction for localised uncomplicated painful bone metastases; complicated disease assessed separately</span></li>'+
         '<li><b>SPS \u2014 Switching between morphine and other opioids in palliative care; Reversing an adult opioid overdose with naloxone</b><br><a href="https://www.sps.nhs.uk/" rel="noopener">sps.nhs.uk</a><span class="rd"> \u2014 usual 25\u201350% cross-tolerance reduction; naloxone titrated to restore ventilation while avoiding withdrawal</span></li>'+

         '<li><b>PCF8 \u2014 Palliative Care Formulary \u00b7 palliativedrugs.com</b><span class="rd"> \u2014 specialist subscription resource, supplementary only: the NSAID of choice and off-label use such as lidocaine 5% plasters (current monographs)</span></li>'+

         '<li><b>DWP \u2014 The Special Rules for end of life: information for healthcare professionals (SR1 form, replaced DS1500)</b> and <b>current benefit rates on GOV.UK</b> (<a href="https://www.gov.uk/attendance-allowance" rel="noopener">Attendance Allowance</a>, <a href="https://www.gov.uk/carers-allowance" rel="noopener">Carer\u2019s Allowance</a>)<br><a href="https://www.gov.uk/government/publications/dwp-factual-medical-reports-guidance-for-healthcare-professionals/the-special-rules-how-the-benefit-system-supports-people-nearing-the-end-of-life" rel="noopener">gov.uk</a><span class="rd"> \u2014 12-month Special Rules; rates are time-sensitive, so check GOV.UK rather than this page</span></li>'+

  foot:"Palliative pain and opioid prescribing for adults \u2014 GMEC Palliative Care Guidelines 2025, NICE CG140, NG234 (MSCC; replaced CG75), NG31 (care of dying adults) and CG173, SPS opioid guidance, RCR radiotherapy guidance and the Gold Standards Framework. Assessment and prescribing are merged on this page; the former algorithm is retired. Morphine, oxycodone and fentanyl are Schedule 2 controlled drugs; gabapentin, pregabalin and tramadol are Schedule 3. Use with the current GMEC/GMMMG guideline, local formulary, product SmPC and specialist palliative-care advice; this page does not replace assessment or local emergency pathways."
