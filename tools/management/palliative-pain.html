  stemTitle:"Uncontrolled pain in a palliative patient is a medical emergency — and more opioid is not always the answer",
  stemSub:"One page for the whole condition. Recognise the oncological emergencies (MSCC, SVCO, pathological fracture, opioid-induced neurotoxicity) that need dexamethasone and a phone call today; assess EACH pain by mechanism and address total pain; climb the WHO ladder with real doses; start and titrate morphine with the right breakthrough; convert safely between drugs and routes; add the adjuvant the mechanism demands; and put the GSF register, anticipatory prescribing and carer support in place before they are needed. GMEC 2025 · NICE CG140 · NG234 · PCF8.",

  ],
  lead:"<div class='mg-layers'><a href='#severe'><b>Emergencies</b><small>MSCC · SVCO · OIN</small></a><a href='#assess'><b>Assess</b><small>Each pain, and total pain</small></a><a href='#ladder'><b>Prescribe</b><small>WHO ladder · titrate · convert</small></a><a href='#planning'><b>Plan ahead</b><small>GSF · JIC box · carers</small></a></div>",
  quickSub:"If you read nothing else on this page, read these six cards. Every figure traces to the source cited under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ MSCC — dexamethasone BEFORE the scan", html:"Sudden severe pain in known bone metastases + new neurological signs (limb weakness, numbness, bladder or bowel dysfunction) = metastatic spinal cord compression: dexamethasone 16 mg PO/IV immediately + 999 for MRI spine + same-day neurosurgery/oncology. Any delay risks permanent paralysis. The 16 mg dose must be given on clinical suspicion, before imaging confirms it, because the window for preserving neurological function closes rapidly. An MSCC hotline is available 24 hours at every oncology centre."},
    {tone:"amber", h:"Pain worsening AS you increase the opioid = opioid-induced neurotoxicity", html:"Confusion + agitation + myoclonus + pain on high-dose opioids is OIN — accumulation of active metabolites (morphine-3- and morphine-6-glucuronide), especially in renal impairment. The paradox of pain worsening despite dose escalation is the key diagnostic feature (M3G is pro-nociceptive and neuroexcitatory). Treatment is opioid ROTATION (oxycodone, hydromorphone or fentanyl — different metabolite profiles), hydration and renal review — NOT more morphine, and NOT naloxone, which precipitates severe withdrawal and an acute pain crisis."},
    {tone:"blue", h:"Breakthrough = 1/6 of the 24-hour dose — and recalculate it every time", html:"Start MST/Zomorph 5–10 mg BD (opioid-naive) plus immediate-release morphine 2.5–5 mg PRN up to 4-hourly. At 24 hours, add up the PRN used and fold it into the regular dose; recalculate the breakthrough at every change. Three or more PRN doses in 24 hours → increase the regular dose. When you titrate the regular opioid you MUST reissue the anticipatory (JIC) PRN prescription at the new 1/6 dose — otherwise district nurses give an obsolete, inadequate breakthrough."},
    {tone:"green", h:"Co-prescribe the laxative from day one — constipation never tolerates out", html:"Senna 15 mg BD + lactulose 15 mL BD, escalating to macrogol 1–2 sachets BD; methylnaltrexone (Relistor) SC for refractory opioid-induced constipation — a peripheral mu-antagonist that does not cross the blood–brain barrier, so it does not reduce analgesia or precipitate withdrawal: 8 mg SC if under 62 kg (&lt;62 kg) or 12 mg SC if 62 kg or over (≥62 kg), on alternate days, with a bowel movement typically within 4 hours. Nausea is usually transient (tolerance in 1–2 weeks): haloperidol 0.5–1.5 mg is the most effective antiemetic for opioid-induced and chemical/metabolic nausea, and haloperidol 0.5 mg as an antiemetic is 10–20-fold below the antipsychotic dose range."},
    {tone:"purple", h:"Two underused, highly effective interventions", html:"Single-fraction radiotherapy 8 Gy for uncomplicated painful bone metastases — equally effective as multi-fraction regimens (Cochrane, Chow et al. 2007/2012), NNT ~4, onset 2–4 weeks, repeatable. A phone call to oncology usually arranges it within 1–2 weeks. Coeliac plexus block for pancreatic cancer pain gives significant relief in 70–80% and can slash opioid requirements for months — both are significantly underused while patients are escalated into toxicity instead."},
    {tone:"teal", h:"Reduce by 25–30% when you rotate opioids", html:"Different opioids have partially different receptor binding, so tolerance does not fully transfer — starting at 100% of the calculated equivalent risks overdose. Reduce the calculated equianalgesic dose by 25–30% on switching (the old protocol's 25–50% is the more cautious reading), keep a correctly-sized breakthrough, and confirm with the palliative care team or the Palliative Drugs app. Patch and methadone conversions are error-prone — use the full chart or ask."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step is the one that must happen today, on the phone if necessary.",
  pathway:[
    {title:"Recognise the emergencies", html:"MSCC (new neurological signs + known cancer) → dexamethasone 16 mg + 999. Pain crisis NRS ≥8 unresponsive to breakthrough → phone palliative care the SAME day; consider urgent SC infusion or admission. Opioid toxicity/OIN → rotate, hydrate, phone the specialist. New headache + photophobia + neck stiffness with brain metastases → leptomeningeal disease or raised ICP: dexamethasone 8–16 mg, same-day neurology/oncology. SVCO (facial oedema, arm swelling, distended neck veins) → dexamethasone 8–16 mg IV + same-day oncology for stenting/radiotherapy. Pathological fracture of a weight-bearing bone → 999 orthopaedics.", alert:true},
    {title:"Assess each pain by mechanism — and the whole person", html:"Most palliative patients have MORE THAN ONE pain: assess each separately (site, character, timing, what provokes and relieves it, effect on function, sleep and mood). Somatic, visceral, neuropathic or mixed — the type dictates the adjuvant. Score with the NRS at rest AND on movement; use the Abbey Pain Scale where the patient cannot self-report. Address total pain: physical, psychological, social and spiritual."},
    {title:"Climb the ladder — and check renal function", html:"Step 1 paracetamol ± NSAID; Step 2 is often skipped (go straight to low-dose strong opioid); Step 3 oral morphine as first choice. Check renal and liver function before starting where possible — it changes the opioid."},
    {title:"Titrate, convert, and co-prescribe", html:"Breakthrough = 1/6 of the 24-hour dose; review every 24–48 hours during titration; fold PRN use into the regular dose. Always co-prescribe a laxative and a PRN antiemetic. Switch opioid for toxicity, renal impairment or the transdermal route — reducing by 25–30% for incomplete cross-tolerance. Add the adjuvant the mechanism demands."},
    {title:"Plan ahead — GSF, JIC box, carers, bereavement", html:"Put the patient on the GSF register (the surprise question), complete advance care planning and DNACPR/ReSPECT while they have capacity, share via EPaCCS with 111/OOH/ambulance, prescribe anticipatory medicines and keep the PRN dose current, check the carer at every visit, and do the DS1500 and benefits check."}
  ],
  sections:[
    {id:"severe", nav:"Emergencies", title:"Urgent and emergency pain situations in palliative care", sub:"Uncontrolled pain in a palliative patient is a medical emergency. Do not leave a patient in severe pain while arranging a non-urgent review — the GP must be prepared to initiate analgesia on the day and arrange same-day specialist support.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Metastatic spinal cord compression (MSCC)", html:"Sudden severe pain in known bone metastases + new neurological signs (limb weakness, numbness, bladder/bowel dysfunction) → dexamethasone 16 mg PO/IV immediately + 999 for MRI spine + neurosurgery/oncology assessment same day. Any delay risks permanent paralysis. MSCC hotline available 24 hours at every oncology centre."},
         {tone:"red", h:"🔴 Acute severe pain crisis (NRS ≥8)", html:"Not responding to breakthrough doses → refractory pain crisis: may indicate a new pathological fracture, visceral obstruction, disease progression or inadequate analgesia. Do not leave the patient in uncontrolled pain. Phone the palliative care specialist the same day. Consider hospitalisation for rapid titration; a subcutaneous morphine or diamorphine infusion (syringe driver) may need to be initiated urgently."},
         {tone:"red", h:"🔴 Opioid-induced neurotoxicity (OIN)", html:"Confusion + agitation + myoclonus + pain in a patient on high-dose opioids — accumulation of active metabolites (morphine-6-glucuronide, morphine-3-glucuronide), especially in renal impairment. Hallucinations + myoclonus + hyperalgesia (pain WORSENING rather than improving as the dose rises). Opioid rotation (oxycodone, hydromorphone or fentanyl — different metabolite profiles) + hydration + renal review. NOT naloxone — it precipitates severe withdrawal and an acute pain crisis."},
         {tone:"red", h:"🔴 Leptomeningeal disease / raised ICP", html:"New severe headache + photophobia + neck stiffness in a patient with known brain metastases or haematological malignancy → leptomeningeal disease (meningeal carcinomatosis). Also raised ICP from a large brain metastasis (morning headache, vomiting, papilloedema). Dexamethasone 8–16 mg urgently reduces cerebral oedema; same-day neurology/oncology; CT brain (if no contraindication) + LP if meningitis cannot be excluded."},
         {tone:"red", h:"🔴 Superior vena cava obstruction (SVCO)", html:"Pain crisis + shortness of breath + haemoptysis + facial oedema, arm swelling, distended neck veins → SVCO, an oncological emergency from mediastinal tumour or nodal compression. Dexamethasone 8–16 mg IV + same-day oncology + urgent stenting or radiotherapy referral. Also consider PE — cancer patients are hypercoagulable with high VTE risk; SVCO and PE can both present with pain + breathlessness."},
         {tone:"red", h:"🔴 Pathological fracture", html:"Bone pain + pathological fracture at a weight-bearing site (femur, humerus, vertebra) from a lytic metastasis → orthopaedic emergency if weight-bearing: 999 for orthopaedic assessment and consideration of prophylactic intramedullary nailing. Radiotherapy for uncomplicated painful bone metastases (single fraction 8 Gy — NNT 4, onset 2–4 weeks). Bisphosphonate (zoledronic acid IV) to reduce future fracture risk."}
       ]},
       {b:"why", html:"Opioid-induced neurotoxicity is one of the most important and most mismanaged complications in palliative care — the paradox of pain worsening despite opioid dose escalation is the key diagnostic feature. It is driven by metabolite accumulation, primarily morphine-3-glucuronide, which is pro-nociceptive and neuroexcitatory: it lowers the seizure threshold and sensitises pain pathways rather than blocking them. The treatment is rotation to an opioid with a different metabolite profile, dose conversion adjusted downward by 25–30% for incomplete cross-tolerance, IV/SC hydration to improve metabolite clearance, and renal-function review — a specialist decision that GPs should recognise and phone about the same day. NICE NG234 specifies that any patient with cancer who develops new back pain or neurological symptoms must be assessed for MSCC as a matter of urgency, with dexamethasone started the same day."}
     ]},

    {id:"assess", nav:"Assess", title:"Pain assessment — type, mechanism and total pain", sub:"Many palliative patients have more than one pain — assess each separately. The pain TYPE steers the adjuvant; the cancer diagnosis alone does not.",
     blocks:[
       {b:"table", head:["Pain type","Character and examples","Beyond the WHO ladder"], rows:[
         ["<b>Nociceptive — somatic</b>","Bone, soft tissue, skin, muscle. Localised, dull, aching or throbbing, well-localised, worse on movement or pressure. Bone metastasis pain (localised tenderness, worse on weight-bearing), post-surgical wound pain, pressure ulcer pain","Responds well to paracetamol + NSAIDs + opioids. Bone pain: add bisphosphonate, radiotherapy and steroids"],
         ["<b>Nociceptive — visceral</b>","Organ capsule stretch or hollow-viscus obstruction. Deep, poorly localised, cramping or colicky, may refer distantly — liver capsule pain from hepatic metastases (right shoulder tip), bowel obstruction (colicky periumbilical), bladder spasm (suprapubic)","Opioids + smooth-muscle antispasmodics (hyoscine butylbromide for colic). Hepatic pain: dexamethasone reduces peri-tumour oedema"],
         ["<b>Neuropathic</b>","Nerve damage or compression — tumour infiltration of a nerve plexus (brachial, lumbosacral), post-chemotherapy peripheral neuropathy, post-radiotherapy fibrosis, cord compression. Burning, shooting or electric, allodynia (pain to light touch), hyperalgesia, paraesthesia in a nerve territory","Poor opioid response — opioids only partially effective. Requires adjuvants: amitriptyline or duloxetine + gabapentin/pregabalin; nerve block for refractory cases; corticosteroid for nerve compression"],
         ["<b>Smooth-muscle colic</b>","<b>Deep, twisting, colicky (bowel or bladder)</b>","<b>Antispasmodic — hyoscine butylbromide (Buscopan)</b>"],
         ["<b>Mixed pain</b>","Most palliative patients have a mixture of nociceptive and neuropathic components","Assess each component separately and treat each mechanism — do not assume all pain has the same character because the patient has cancer"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"cream", h:"🕊️ Total pain (Cicely Saunders)", html:"Physical pain is one of five dimensions: + psychological (fear, anxiety, depression, loss of control) + social (isolation, financial, family distress) + spiritual/existential (loss of meaning, fear of death, unfinished business). All must be addressed for effective pain control. The GP's role extends beyond prescribing to listening, facilitating conversations about fears and meaning, and connecting patients with chaplaincy, counselling and social work. Involve the wider palliative team; educate and support carers in giving PRN medication and recognising uncontrolled pain."},
         {tone:"cream", h:"📏 Assessment tools", html:"<b>NRS 0–10:</b> “Right now, where is your pain on a scale of 0 to 10?” — quick and validated. <b>Ask at rest AND on movement</b> — movement pain is harder to control. <b>OPQRST:</b> onset, provocation/alleviation, quality, radiation, severity, timing — with specific prompts for neuropathic features. <b>Abbey Pain Scale</b> for cognitively impaired patients who cannot self-report: facial grimacing, vocalisation, posture, restlessness, skin changes, physiological signs — validated in dementia and delirium."}
       ]},
       {b:"kv", rows:[
         ["Principles","<b>By mouth, by the clock, for the individual, with attention to detail.</b> Set realistic goals — pain-free at rest and overnight may be more achievable than on movement"],
         ["Baseline","Check renal and liver function before starting analgesics where possible — it changes the opioid choice"],
         ["Comfort measures","Positioning, pressure care, heat and cold, gentle activity and complementary approaches support analgesia"]
       ]},
       {b:"why", html:"A consultation that focuses exclusively on opioid dose titration while ignoring fear of death, family distress, financial concerns or loss of meaning will produce suboptimal pain control — psychological distress amplifies physical pain through central sensitisation and reduces analgesic efficacy. Depression and anxiety are independently associated with higher pain scores and greater analgesic requirements, and treating them reduces opioid dose requirements. Unrecognised pain in cognitively impaired palliative patients is a significant quality-of-care issue — carry the Abbey scale on home visits."}
     ]},

    {id:"ladder", nav:"WHO ladder", title:"The WHO analgesic ladder — with real doses", sub:"Step 1 for mild pain; Step 2 is increasingly skipped; go to a low-dose strong opioid for moderate–severe pain. Verify every dose in the BNF/PCF.",
     blocks:[
       {b:"table", head:["Step","Drugs and doses","Notes"], rows:[
         ["<b>Step 1 — mild pain (NRS 1–3)</b>","Paracetamol 1 g QDS (max 4 g/day; 2 g/day in the elderly, liver disease or low body weight). Reduce to 500 mg QDS if ≥1 hepatotoxicity risk (age, &lt;50 kg, poor nutrition/cachexia, chronic alcohol). Severe renal impairment (eGFR &lt;30): 500 mg 6-hourly, max 3 g/day","Start here for mild pain"],
         ["<b>Step 1 — NSAID</b>","Celecoxib 100–200 mg BD (the PCF NSAID of choice), ibuprofen 200–400 mg TDS with food, or naproxen 250–500 mg BD. PPI co-prescription mandatory (omeprazole 20 mg OD)","Particularly effective for bone pain (prostaglandin-mediated inflammation). Avoid in renal impairment, cardiovascular disease, GI history and the elderly. NSAIDs + opioids are additive for bone pain — do NOT stop the NSAID when moving to Step 2/3"],
         ["<b>Step 2 — moderate pain (NRS 4–6)</b>","Codeine 30–60 mg QDS, dihydrocodeine 30 mg QDS, or tramadol 50–100 mg QDS. Continue Step 1 drugs","Increasingly controversial — there is no pharmacological need for Step 2 in cancer pain; a low-dose strong opioid gives quicker, better relief. Codeine needs CYP2D6 conversion: 7% are poor metabolisers (no effect) and 7–10% ultra-rapid (toxicity). Tramadol is dual opioid + SNRI — lowers the seizure threshold, serotonin syndrome risk with SSRIs/SNRIs/TCAs; avoid in epilepsy"],
         ["<b>Step 3 — severe pain (NRS 7–10)</b>","Morphine first-line (familiarity, availability, cost), oral route preferred. MST Continus / Zomorph 5–10 mg BD (10–15 mg BD if a higher starting point is appropriate; 5 mg BD if frail or renally impaired) PLUS Oramorph / Sevredol immediate-release 2.5–5 mg PRN 4-hourly","No ceiling dose except in renal impairment. Always provide an IR breakthrough dose"]
       ]},
       {b:"why", html:"Multiple RCTs have shown that low-dose Step 3 opioids (oral morphine 5–10 mg QDS) are more effective and better tolerated than maximum-dose Step 2 opioids, which supports considering a move directly from Step 1 to low-dose Step 3 if Step 1 is inadequate."}
     ]},

    {id:"titrate", nav:"Titrate", title:"Starting and titrating oral morphine", sub:"The practical sequence, and the co-prescriptions that are not optional.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1", title:"Calculate and start", when:"opioid-naive, normal renal function", fromLabel:"the starting point",
          html:"Calculate the total daily opioid requirement from the current codeine or tramadol dose and convert to oral morphine equivalent (codeine 240 mg/day = morphine 24 mg/day; tramadol 400 mg/day = morphine 40–80 mg/day). Start modified-release morphine at the lowest appropriate dose — 5–10 mg BD if opioid-naive; frail or elderly, start lower. Alternatively immediate-release morphine 2.5–5 mg 4-hourly."},
         {step:"2", title:"Prescribe the breakthrough dose", when:"always, alongside the regular opioid", fromLabel:"PRN",
          html:"Breakthrough = 1/6 of the total 24-hour morphine dose, given as immediate-release, maximum every 4 hours (up to hourly PRN in some titration settings) — e.g. on 30 mg MR BD = 60 mg/day → breakthrough 10 mg."},
         {step:"3", title:"Titrate", when:"review every 24–48 hours", fromLabel:"persistent pain",
          html:"Add up the total used (regular + breakthrough) over 24 hours and increase the regular dose accordingly — divide the PRN total by 6 to add to each BD dose, or increase by 30–50%. Recalculate the breakthrough dose each time. Repeat daily until pain is controlled. Three or more PRN doses in 24 hours → increase the regular dose."},
         {step:"4", title:"Co-prescribe — from the start", when:"every patient, day one", fromLabel:"predictable side effects",
          html:"A regular laxative for everyone: senna 15 mg BD + lactulose 15 mL BD (or macrogol + senna) — opioid constipation does NOT tolerate out. An antiemetic for the first days to ~2 weeks: metoclopramide 10 mg TDS or haloperidol 0.5–1.5 mg — nausea usually settles as tolerance develops."}
       ]},
       {b:"warn", html:"Never stop a patient's regular long-acting or basal opioid when adding breakthrough doses. In the last days of life, or if the patient cannot swallow, convert to a continuous subcutaneous infusion (syringe pump)."},
       {b:"table", head:["Route / indication","Detail"], rows:[
         ["<b>Subcutaneous syringe driver</b>","Indications: unable to swallow (dysphagia, vomiting, reduced consciousness), rapid dose changes needed, patient preference, last days of life. Commonly combined over 24 hours: diamorphine (preferred SC in the UK — more soluble than morphine) + midazolam (anxiolytic/sedative) + glycopyrronium or hyoscine hydrobromide (secretions). Haloperidol can be added as antiemetic"],
         ["<b>Incident / movement pain</b>","Regular analgesia alone is insufficient. Give a fast-onset short-acting opioid 30 minutes before the anticipated pain. Transmucosal fentanyl (Actiq lozenge, Abstral sublingual, PecFent/Instanyl nasal spray) is designed for breakthrough cancer pain — onset 5–10 minutes versus 20–30 for Oramorph. The dose is NOT calculated from the background opioid — it must be titrated independently from the lowest available dose"]
       ]}
     ]},

    {id:"convert", nav:"Conversions", title:"Opioid conversion — the ratios that matter", sub:"The most practically useful piece of pharmacology in palliative primary care. Always keep a correctly-sized breakthrough dose after switching.",
     blocks:[
       {b:"table", head:["From → To","Divide by","Example"], rows:[
         ["<b>Oral codeine / dihydrocodeine / tramadol → oral morphine</b>","<b>÷ 10</b>","<b>codeine 240 mg → morphine 24 mg</b>"],
         ["<b>Oral morphine → oral oxycodone</b>","<b>÷ 1.5–2 (oxycodone is ~1.5–2× as potent)</b>","<b>morphine 30 mg → oxycodone 15–20 mg</b>"],
         ["<b>Oral morphine → SC morphine</b>","<b>÷ 2</b>","<b>morphine 60 mg oral → 30 mg SC/24 h</b>"],
         ["<b>Oral morphine → SC diamorphine</b>","<b>÷ 3</b>","<b>morphine 60 mg oral → 20 mg SC/24 h</b>"],
         ["<b>Oral oxycodone → SC oxycodone</b>","<b>÷ 1.5–2</b>","<b>oxycodone 30 mg oral → 15–20 mg SC/24 h</b>"],
         ["<b>Fentanyl patch (approx)</b>","—","12 mcg/h ≈ 30 mg oral morphine/24 h · 25 mcg/h ≈ 60–90 mg · 50 mcg/h ≈ 120 mg · 75 mcg/h ≈ 180 mg"]
       ]},
       {b:"kv", rows:[
         ["The full equivalence set","Oral morphine 30 mg/day = oxycodone 15 mg = fentanyl patch 12 mcg/h = SC diamorphine 10 mg/24 h = SC morphine 15 mg/24 h. 60 mg/day = oxycodone 30 = patch 25 = diamorphine 20 = SC morphine 30. 120 mg/day = oxycodone 60 = patch 50 = diamorphine 40 = SC morphine 60. 180 mg/day = oxycodone 90 = patch 75 = diamorphine 60 = SC morphine 90"],
         ["Cross-tolerance","Reduce the calculated equianalgesic dose by 25–30% when switching (some sources advise up to 50% and seeking specialist advice when in doubt) — different opioids have partially different receptor binding, so tolerance does not fully transfer. Starting at 100% risks overdose"],
         ["Verify","Confirm with the palliative care team or the Palliative Drugs app. Patch and methadone conversions are error-prone — use the full conversion chart or seek specialist advice. Fentanyl and buprenorphine patches are NOT removed for breakthrough — add IR breakthrough alongside"]
       ]}
     ]},

    {id:"alternatives", nav:"Which opioid", title:"Alternative strong opioids and renal impairment", sub:"Switch for side effects, renal impairment, route, or availability — not by default.",
     blocks:[
       {b:"table", head:["Opioid","When to use","Notes"], rows:[
         ["<b>Oxycodone (OxyContin MR / OxyNorm IR)</b>","<b>Morphine intolerance, or mild–moderate renal impairment</b>","~1.5–2× as potent as oral morphine; less nausea, sedation and hallucination than morphine"],
         ["<b>Fentanyl patch (12–25 mcg/h upwards)</b>","<b>Stable pain, swallowing problems, renal impairment, morphine toxicity</b>","72-hour patch; NOT for acute titration or unstable/rapidly changing pain; takes ~12–24 h to work; keep IR breakthrough"],
         ["<b>Buprenorphine patch (BuTrans / Transtec)</b>","<b>Stable moderate pain, renal impairment</b>","<b>Lower-potency patch; weekly (BuTrans) or twice-weekly</b>"],
         ["<b>Alfentanil (SC)</b>","<b>Severe renal impairment (eGFR &lt;30) in a syringe pump</b>","<b>Specialist; short-acting</b>"],
         ["<b>Methadone</b>","<b>Complex or neuropathic pain refractory to other opioids</b>","<b>Specialist initiation only — long, variable half-life</b>"],
         ["<b>Hydromorphone</b>","<b>An option in opioid rotation for OIN</b>","Different metabolite profile from morphine"]
       ]},
       {b:"table", head:["Renal function","Preferred opioid"], rows:[
         ["<b>Normal / mild</b>","<b>Morphine</b>"],
         ["<b>Moderate (eGFR 30–50)</b>","<b>Oxycodone (with caution); reduce dose or frequency</b>"],
         ["<b>Severe (eGFR &lt;30)</b>","Avoid morphine and oxycodone accumulation → fentanyl or buprenorphine patch (if stable) or alfentanil SC in a syringe pump; seek specialist advice"]
       ]},
       {b:"warn", html:"Switch to a non-morphine opioid mainly for: unacceptable morphine side effects, renal impairment (morphine has active renally-cleared metabolites → toxicity), the transdermal route being preferable, or morphine unavailability. Suspect renal impairment or accumulation if a previously stable patient becomes toxic."}
     ]},

    {id:"sideeffects", nav:"Side effects", title:"Opioid side effects and toxicity", sub:"Most are predictable and preventable. One is an emergency.",
     blocks:[
       {b:"table", head:["Effect","Action"], rows:[
         ["<b>Constipation</b>","<b>Universal, and no tolerance develops — co-prescribe a regular laxative from day 1: senna 15 mg BD + lactulose 15 mL BD → escalate to macrogol 1–2 sachets BD → methylnaltrexone (Relistor) SC for refractory opioid-induced constipation (a peripheral mu-antagonist: does not cross the blood–brain barrier, so it does not reduce analgesia or precipitate withdrawal; indicated when standard laxatives have failed on a stable opioid dose). <b>Dose: 8 mg SC if &lt;62 kg, 12 mg SC if ≥62 kg, on alternate days — a bowel movement typically follows within 4 hours. Available on NHS prescription and district nurses can administer it</b>"],
         ["<b>Nausea</b>","Common early, usually transient with tolerance in 1–2 weeks — metoclopramide 10 mg TDS or haloperidol 0.5–1.5 mg (the most effective antiemetic for opioid-induced nausea) for about a week"],
         ["<b>Sedation / dry mouth</b>","Often settles within a few days; reassure. If persistent, consider dose reduction plus an adjuvant. Warn about driving when starting or changing dose"],
         ["<b>Hallucinations / confusion</b>","<b>Opioid rotation</b>"],
         ["<b>Itch</b>","<b>Opioid rotation, or ondansetron 4 mg BD</b>"],
         ["<b>Urinary retention</b>","Catheterise if severe; alpha-blocker (tamsulosin 0.4 mg OD) if BPH contributes"],
         ["<b>Opioid toxicity</b>","Persistent drowsiness, vivid dreams or hallucinations, myoclonus (jerks), pinpoint pupils, confusion → reduce dose, ensure hydration, check renal function, consider opioid switch"],
         ["<b>Life-threatening respiratory depression</b>","RR &lt;8 and unrousable → titrated naloxone: dilute 400 mcg to 10 mL and give 0.5 mL (20 mcg) IV every 2 minutes — small doses to reverse respiratory depression without reversing analgesia or precipitating a crisis"]
       ]},
       {b:"warn", html:"In palliative patients use small, titrated naloxone doses for respiratory depression — a full reversal dose causes severe pain and acute withdrawal. <b>Naloxone is NOT the treatment for opioid-induced neurotoxicity</b> — rotate the opioid instead."}
     ]},

    {id:"adjuvants", nav:"Adjuvants", title:"Adjuvant analgesics by pain type", sub:"Adjuvants run alongside the WHO ladder — they target a mechanism the opioid alone will not control.",
     blocks:[
       {b:"table", head:["Pain","Adjuvant","Detail"], rows:[
         ["<b>Neuropathic</b>","Add amitriptyline or a <b>gabapentinoid</b>, and consider steroids for compression. <b>Amitriptyline 10–25 mg nocte</b> (NICE CG173 first-line — NNT 4; allow 4–6 weeks; titrate to 50–75 mg if tolerated). <b>Duloxetine 30–60 mg OD</b> (useful where depression is comorbid — treats both). <b>Gabapentin 300 mg OD → 300 mg TDS → 900 mg TDS</b> (titrate over 3–4 weeks; sedating initially). <b>Pregabalin 75 mg BD → 150 mg BD → 300 mg BD</b> (Schedule 3 CD — caution with a substance-misuse history)","Add a corticosteroid (dexamethasone) for nerve compression. Lidocaine 5% patch (Versatis) for localised allodynia or hyperalgesia — e.g. post-thoracotomy, rib metastasis — applied 12 hours on / 12 hours off"],
         ["<b>Bone</b>","<b>Dexamethasone 4–8 mg OD in the morning</b> (reduces peri-tumour oedema and bone-metastasis inflammation; short 5–7-day course unless palliative). <b>NSAIDs continued alongside opioids</b> (additive via prostaglandin inhibition). <b>Bisphosphonates: zoledronic acid IV 3-weekly, or denosumab SC monthly</b>","Reduce skeletal-related events by approximately 40%. Single-fraction radiotherapy 8 Gy: highly effective for uncomplicated painful bone metastases — NNT 4, onset 2–4 weeks, repeatable. Arrange via oncology"],
         ["<b>Visceral / liver capsule</b>","<b>Dexamethasone 4–8 mg OD</b> for liver-capsule pain (hepatomegaly from metastases — reduces oedema; also 8–16 mg OD reducing, for raised ICP or nerve compression). <b>Hyoscine butylbromide (Buscopan) 20 mg SC/PO</b> for intestinal or bladder colic. <b>Hyoscine hydrobromide 0.4 mg SC</b>","Octreotide 0.6–1.2 mg SC/24 h for inoperable bowel obstruction — reduces intestinal secretions and relieves obstruction pain without surgery; specialist-initiated but the GP may continue. Give dexamethasone before 2 pm, co-prescribe gastroprotection, review and taper"],
         ["<b>Refractory / spinal</b>","<b>Intrathecal drug delivery (ITDD) or epidural analgesia</b> for pain unresponsive to systemic opioids — especially pelvic/perineal pain and bilateral lower-limb pain from lumbosacral plexopathy","Allows much lower doses — intrathecal morphine is about 1/100 of the oral dose; bupivacaine can be added intrathecally. TENS is a useful adjunct for localised pain — apply electrodes around, not on, the painful area"]
       ]},
       {b:"why", html:"Single-fraction radiotherapy at 8 Gy for painful bone metastases is the most evidence-based, underused intervention in UK palliative primary care — a Cochrane meta-analysis of 25 RCTs (Chow et al. 2007, updated 2012) showed it is equally effective to multi-fraction regimens with a complete response rate of about 25% and partial response about 50%, NNT approximately 4, one visit instead of five, and equivalent side effects. The barrier is that GPs often do not know the option exists — <b>in most UK cancer centres a phone call arranges it within 1–2 weeks.</b> Lidocaine 5% plasters are licensed for post-herpetic neuralgia but widely used off-label for localised neuropathic palliative pain (post-thoracotomy, rib metastases, mesothelioma, post-mastectomy) — direct sodium-channel blockade at the site, no meaningful systemic absorption, excellent where systemic doses cannot be increased further."}
     ]},

    {id:"eol", nav:"End of life", title:"End-of-life symptom management", sub:"When the oral route is lost, the analgesia does not stop.",
     blocks:[
       {b:"table", head:["Symptom","Management"], rows:[
         ["<b>Pain in the last days</b>","Maintain analgesia via the SC route when the oral route is lost — convert the oral opioid to SC diamorphine in a syringe driver. Do NOT stop analgesia because the patient is unconscious: pain pathways remain active. PRN SC injections for breakthrough. Reassess every 4 hours in the actively dying patient and document the response. If pain remains uncontrolled despite optimal analgesia → palliative sedation discussion with the specialist"],
         ["<b>Dyspnoea</b>","Opioids are the most effective treatment for dyspnoea in advanced illness (evidence grade A) — low-dose SC morphine 2.5–5 mg PRN or in the driver; reduces respiratory drive without hastening death at appropriate doses. Lorazepam 0.5–1 mg SL or midazolam 2.5–5 mg SC for the anxiety component. A fan directed at the face stimulates V2 trigeminal receptors and reduces the perception of dyspnoea independently of saturations. Oxygen only if hypoxic AND the benefits outweigh the burdens"],
         ["<b>Agitation / terminal restlessness</b>","Midazolam 2.5–5 mg SC PRN (first line). Haloperidol 0.5–1.5 mg SC if confusion or hallucinations are prominent. Levomepromazine 6.25–12.5 mg SC for refractory agitation (sedating antipsychotic — broad-spectrum antiemetic + anxiolytic + sedative). Exclude reversible causes: urinary retention (catheterise), constipation, pain, hypercalcaemia, opioid toxicity, steroids"],
         ["<b>Nausea and vomiting</b>","Cyclizine 50 mg SC/IM TDS (vestibular, raised ICP, surgical causes). Haloperidol 0.5–1.5 mg SC OD/BD (chemical, metabolic, opioid-induced — the most effective antiemetic for palliative nausea overall). Ondansetron 4–8 mg SC BD (chemotherapy, serotonin-mediated). Levomepromazine 6.25 mg SC OD (broad-spectrum, sedating). Cyclizine + haloperidol + octreotide for malignant bowel obstruction"],
         ["<b>Respiratory secretions (death rattle)</b>","Glycopyrronium 0.2–0.4 mg SC PRN or 0.6–1.2 mg SC/24 h in the driver (reduces secretion production; does not clear existing secretions). Hyoscine hydrobromide 0.4 mg SC PRN or 1.2–2 mg SC/24 h (more sedating). Reposition side-lying to reduce pooling. Reassure the family: the noise distresses observers, not the deeply unconscious patient. Do not suction routinely — traumatic and ineffective"],
         ["<b>Palliative sedation</b>","For refractory suffering (pain, dyspnoea, agitation or existential distress) not controlled despite optimal specialist palliative care. Proportionate sedation: midazolam titrated to reduce symptom burden while preserving consciousness where possible; continuous deep sedation as a last resort. Requires specialist involvement, documented decision-making, family communication and a DNACPR in place — evidence confirms it does not hasten death when used appropriately"]
       ]},
       {b:"why", html:"Multiple prospective studies of opioid use in the last days of life show no correlation between opioid dose, within therapeutic ranges, and time to death. Opioids titrated to symptom relief rather than to unconsciousness are ethical, compassionate and clinically correct — and the fear of “hastening death” is one of the commonest barriers to adequate symptom control in dying patients. The sentence to have ready: “We are giving morphine to relieve the pain and breathlessness — at the doses we're using, the evidence shows this does not shorten life.” Haloperidol acts at the chemoreceptor trigger zone via D2 blockade and is the most effective single antiemetic for the commonest palliative nausea (chemical/metabolic — opioids, uraemia, hypercalcaemia), effective at 0.5–1.5 mg, 10–20-fold below antipsychotic doses."}
     ]},

    {id:"planning", nav:"Planning &amp; carers", title:"Advance care planning, GSF, anticipatory prescribing and carer support", sub:"The work that prevents the 3 a.m. emergency admission.",
     blocks:[
       {b:"table", head:["Element","What to do","Why"], rows:[
         ["<b>Gold Standards Framework register</b>","All patients with life-limiting illness on the practice GSF/palliative register, reviewed monthly at MDT. The surprise question: “Would I be surprised if this patient died in the next 12 months?” — if no, they go on the register. The 3 Cs: Coding, Communication (ACP conversations) and Co-ordination (OOH notification, DNACPR, EPS prescribing)","GSF significantly reduces emergency admissions in the last weeks of life, increases the proportion who die in their preferred place, and improves the quality of dying"],
         ["<b>Anticipatory prescribing (“just in case” box)</b>","Prescribe in advance: SC diamorphine (or morphine), SC midazolam, SC glycopyrronium (or hyoscine), SC haloperidol — typical opioid-naive starting doses are diamorphine 10–20 mg/24 h (calculate from the current opioid), midazolam 10 mg/24 h and glycopyrronium 0.6–1.2 mg/24 h. Prescribe when the patient is deteriorating but still at home, label clearly “if needed in the last days of life”, and store the medicines at the patient's home so district nurses and OOH can act without waiting for a doctor. Document the prescription and the rationale","<b>Prevents unnecessary emergency admissions in the last days of life</b>"],
         ["<b>Keep the JIC dose current</b>","Every time the regular opioid is titrated, immediately reissue the PRN prescription at the new 1/6 dose and tell the district nursing team","If the JIC box still holds the old PRN dose, district nurses give inadequate analgesia — a frequently overlooked prescribing-safety point"],
         ["<b>DNACPR and advance care planning</b>","Have the conversation early, while the patient has capacity, energy and time. Document in a signed ACP; share electronically (ReSPECT or equivalent) and via EPaCCS with 111, OOH GP and the ambulance service. Discuss preferred place of death and specific fears (suffocation? pain? being alone?), and spiritual or religious needs","Most patients prefer home; many still die in hospital"],
         ["<b>Carer support</b>","Identify the primary carer at every visit; carer's assessment via local authority social services (a legal right); GP letter supporting Carer's Allowance (£81.90/week if caring ≥35 hours/week, subject to the earnings limit)","Carers are at high risk of depression, burnout, complicated grief and physical illness"],
         ["<b>Financial and practical support</b>","Benefits check at diagnosis: Attendance Allowance (over 65, not means-tested — £72.65 or £108.55/week, and no DVLA notification is needed), PIP (under 65 — enhanced daily living £101.75/week), and the DS1500 fast-track for terminal illness with life expectancy ≤12 months — PIP/AA without waiting for assessment. Macmillan financial navigators, Blue Badge, NHS Continuing Healthcare, Citizens Advice, Marie Curie","DS1500 takes about 5 minutes and bypasses months of processing — for a patient with months to live, Attendance Allowance at the higher rate (£108.55/week) or PIP enhanced daily living (£101.75/week) materially affects care at home. It does not affect driving licence status (no DVLA notification) and can be submitted directly to the DWP"],
         ["<b>Psychological and spiritual support</b>","Depression is present in approximately 25% of palliative patients and significantly amplifies pain — antidepressants work (mirtazapine, sertraline; fast-onset preferred). CBT/counselling via Macmillan; chaplaincy and spiritual care. Explore non-judgementally: “Do you have any beliefs or practices that help you cope?”","Do not assume religiosity — or its absence"],
         ["<b>Hospice and day hospice</b>","Hospice admission is for complex symptom control, respite AND terminal care — not only the last days: many patients are admitted for symptom control and discharged home. Day hospice 1–2 days/week for social support, complementary therapies, symptom monitoring and peer support. Hospice at Home (Marie Curie, local charities) enables hospital-quality nursing at home","The misconception that hospice means imminent death drives late referral and lost months of good symptom control"],
         ["<b>Equipment and home modifications</b>","OT assessment for a hospital or profiling bed, pressure-relieving mattress, hoist, commode, raised toilet seat, bath seat, stair lift, wheelchair, TENS machine, recliner chair — usually free on the NHS to palliative patients. Apply EARLY; equipment takes time to arrive","Also reduces pressure-ulcer risk and carer strain"]
       ]}
     ]},

    {id:"monitor", nav:"Monitor", title:"Follow-up, monitoring and safety-netting", sub:"Review rhythm, controlled-drug rules, and the phone calls that must happen today.",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["<b>Pain and symptom review</b>","<b>At least fortnightly during titration; monthly when stable</b>","Document the NRS at rest AND on movement, PRN use in the last 24 hours, side effects (constipation, confusion, sedation), functional status, mood and carer wellbeing. Adjust the dose from PRN use. Contact the specialist if exceeding 200 mg oral morphine equivalent/day without pain control"],
         ["<b>Opioid prescription safety</b>","<b>Every prescription</b>","Morphine, oxycodone and fentanyl are Schedule 2 CDs with specific prescription requirements; pregabalin, tramadol and gabapentin are Schedule 3. Prescribe monthly supplies, not 3-monthly, for CDs. Ensure sufficient supply of BOTH regular and PRN formulations"],
         ["<b>GSF and anticipatory medicines review</b>","<b>Monthly MDT; at each visit when deteriorating</b>","Ensure the JIC box is in place and the PRN dose is current; ensure the DNACPR is documented, signed and shared with 111/OOH/ambulance via EPaCCS"],
         ["<b>Carer monitoring</b>","<b>Every palliative visit</b>","Coping? Sleep? Own health? Identify carer fatigue early and facilitate respite. Prepare bereavement support before the death; a GP condolence letter or call is supported as good practice — the GP is often the only consistent healthcare relationship surviving bereavement"],
         ["<b>Telephone review within 24 hours</b>","<b>NRS 6–7 despite current analgesia</b>","Titrate by phone, increase the regular dose, review PRN use. New confusion or hallucinations → consider rotation with specialist advice. Carer reporting overnight distress → same-day visit and consider starting a syringe driver"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"📞 Same-day / 999", html:"Uncontrolled severe pain (NRS ≥8) at any review → phone palliative care the same day · MSCC features (new weakness or numbness + back pain in cancer) → dexamethasone 16 mg + 999 · confusion + myoclonus + worsening pain on high-dose morphine → opioid toxicity, specialist same day · agitation or distress in the last hours without adequate sedation → start midazolam SC and phone palliative care."},
         {tone:"cream", h:"💬 What to say", html:"“We'll treat each of your pains in the way that suits it — a strong painkiller around the clock with extra doses for flare-ups, plus a laxative, because these medicines always slow the bowels. If one type of pain doesn't settle there are add-on treatments and a specialist team we can call on.” And to families: “At the doses we're using, the evidence shows this does not shorten life.”"}
       ]},
       {b:"why", html:"Bereavement follow-up is a core primary-care competency and a recognised clinical outcome of palliative care quality. A brief call at about 6 weeks, or a condolence letter, costs little time but validates grief, gives an opportunity to identify prolonged grief disorder (NICE-recognised as a clinical diagnosis since 2022), and maintains the relationship the carer will need for their own health."}
     ]},

    {id:"loop", nav:"Still in pain?", title:"Pain still uncontrolled? Re-check before escalating", sub:"Opioid-resistant pain (neuropathic, bone, colic, incident) needs the right adjuvant or a non-drug measure, not just dose increases.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"1 · Pain type", html:"<b>Neuropathic, bone or colic? Add the matching adjuvant.</b>"},
         {tone:"amber", h:"2 · Breakthrough", html:"Is the breakthrough dose 1/6 of the 24-hour dose, and is it being used? Titrate the regular dose up."},
         {tone:"amber", h:"3 · Toxicity vs pain", html:"Drowsy + myoclonus + still in pain = opioid toxicity → switch opioid, don't just increase."},
         {tone:"amber", h:"4 · Renal", html:"New toxicity in a previously stable patient → check renal function and accumulation."},
         {tone:"amber", h:"5 · Incident pain", html:"Pain only on movement or during care → fast-onset transmucosal fentanyl 30 minutes before."},
         {tone:"amber", h:"6 · Specialist", html:"Refractory, complex neuropathic, or considering methadone, patches, nerve block or intrathecal analgesia → specialist palliative care."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways", sub:"Who to phone, and what they can offer that primary care cannot.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999 / same-day emergency", html:"MSCC (new neurological signs + known cancer) → dexamethasone 16 mg + 999 · uncontrolled pain crisis (NRS ≥8 unresponsive to breakthrough) → phone palliative care same day · SVCO → dexamethasone 16 mg + 999 · pathological fracture of a weight-bearing bone → 999 orthopaedics · opioid toxicity/OIN → palliative care phone same day."},
         {tone:"amber", h:"Specialist palliative care", html:"Pain uncontrolled despite Step 3 opioids and optimised adjuvants (strong-opioid escalation not achieving NRS &lt;4) · syringe-driver initiation or titration · neuropathic pain requiring high-dose adjuvants · incident pain requiring transmucosal fentanyl · refractory pain for nerve block or spinal analgesia · complex neuropathic pain · methadone consideration · rapid dose escalation · refractory symptoms at the end of life."},
         {tone:"amber", h:"Specialist palliative psychology \u2014 not NHS Talking Therapies", html:"<b>Existential or psychological distress that is amplifying the pain needs <b>specialist palliative psychology, and NHS Talking Therapies is not the appropriate route</b> \u2014 the waiting times, session limits and protocols are built for a different population and a different prognosis. Route it through the specialist palliative care team (or Macmillan psychological support), alongside chaplaincy and spiritual care.</b>"},
         {tone:"blue", h:"Oncology", html:"Bone-metastasis pain → single-fraction radiotherapy (8 Gy) referral · SVCO → urgent stenting or radiotherapy · brain metastases → stereotactic radiosurgery or whole-brain radiotherapy · bisphosphonate (zoledronic acid) for skeletal protection · review of systemic anticancer therapy if progression is causing pain."},
         {tone:"blue", h:"Anaesthetics / interventional pain", html:"Coeliac plexus block for pancreatic cancer (70–80% pain relief) · cordotomy for unilateral mesothelioma pain · stellate ganglion block for Pancoast-tumour arm pain · intrathecal drug delivery · epidural for refractory pelvic or perineal pain."},
         {tone:"green", h:"GP-provided community support", html:"GSF register with proactive care planning, anticipatory prescribing and OOH notification · district nursing for syringe-driver management, wound care and medication administration at home · Macmillan nurses for patient and carer support and symptom advice · Marie Curie nurses for overnight sits."}
       ]},
       {b:"why", html:"Coeliac plexus block for pancreatic cancer pain is one of the most effective interventional analgesic procedures available — significant pain reduction in 70–80%, dramatically reduced opioid requirements (and therefore toxicity) for months, performed under CT or ultrasound guidance in about 45 minutes under sedation. Despite this it is significantly underused: many patients are maintained on escalating opioid doses with increasing toxicity when they could have had the block."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A telephone call from the daughter of a 74-year-old man with metastatic prostate cancer on MST 60 mg BD. Over three days he has become muddled and is “twitching in his sleep”, and — despite using six Oramorph doses yesterday — says his back pain is worse, not better. This morning his legs feel “heavy” and he could not get to the toilet in time."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Recognises <b>two emergencies at once</b>: the pain-worse-despite-more-opioid pattern with myoclonus and confusion as opioid-induced neurotoxicity, and new leg weakness plus bladder disturbance in known bone metastases as MSCC; gives dexamethasone 16 mg immediately and arranges 999/MRI within 24 h without waiting for imaging to confirm; states that OIN needs rotation, hydration and renal review — not more morphine, and not naloxone; checks the <b>breakthrough dose is 1/6 of the 24-hour total</b>; phones the <b>palliative care specialist the same day</b>; and supports the daughter as a carer in her own right."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>Greater Manchester &amp; Eastern Cheshire (GMEC) Palliative Care Guidelines 2025<span class="rd"> \u2014 the UK regional standard for starting doses, conversions, syringe-driver combinations and anticipatory prescribing</span></li>'+
         '<li>NICE CG140 \u2014 Palliative care for adults: strong opioids for pain relief<br><a href="https://www.nice.org.uk/guidance/cg140" rel="noopener">nice.org.uk/guidance/cg140</a><span class="rd"> \u2014 titration and breakthrough dosing</span></li>'+
         '<li>NICE CG75 / NG234 \u2014 Spinal metastases and metastatic spinal cord compression (2023)<span class="rd"> \u2014 urgent assessment of any cancer patient with new back pain or neurological symptoms, and same-day dexamethasone 16 mg</span></li>'+
         '<li><b>NICE NG31 \u2014 Care of dying adults in the last days of life (2015)</b><span class="rd"> \u2014 the end-of-life symptom-control and anticipatory-prescribing standards</span></li>'+
         '<li>Chow E et al. \u2014 Cochrane meta-analysis of 25 RCTs (2007, updated 2012)<span class="rd"> \u2014 single-fraction 8 Gy equals multi-fraction radiotherapy for painful bone metastases: ~25% complete and ~50% partial response, NNT ~4</span></li>'+
         '<li><b>PCF8 \u2014 Palliative Care Formulary \u00b7 palliativedrugs.com</b><span class="rd"> \u2014 the NSAID of choice, conversion ratios, and off-label use such as lidocaine 5% plasters</span></li>'+
         '<li><b>NICE CG173 \u2014 Neuropathic pain</b><span class="rd"> \u2014 amitriptyline, duloxetine, gabapentin and pregabalin as the adjuvant set; see also the <a href="neuropathic-pain.html">neuropathic pain protocol</a></span></li>'+
         '<li><b>Gold Standards Framework \u00b7 EPaCCS \u00b7 ReSPECT</b><span class="rd"> \u2014 register, surprise question, the 3 Cs, and electronic sharing with 111/OOH/ambulance</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> \u2014 verify every dose, CD schedule and renal adjustment before prescribing</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Palliative pain and opioid prescribing for adults \u2014 GMEC Palliative Care Guidelines 2025, NICE CG140, CG75/NG234 (MSCC), NG31 (care of dying adults) and CG173, PCF8 and the Gold Standards Framework. Assessment and prescribing are merged on this page; the former algorithm is retired. Morphine, oxycodone and fentanyl are Schedule 2 controlled drugs; gabapentin, pregabalin and tramadol are Schedule 3. Verify every dose and conversion against the current BNF/PCF or with the specialist palliative care team before prescribing."
});
