  stemSub:"The specialist haemoglobinopathy team owns disease-modifying treatment; the GP keeps people well between clinic visits. Four jobs: recognise the life-threatening complications early, never delay or ration analgesia, keep infection prevention (penicillin and vaccines) watertight, and make shared-care drugs, pregnancy planning, school, work and transition work for the patient.",

  lead:'<div class="mg-layers"><a href="#redflags"><b>High-risk red flags</b><small>999 if unstable · otherwise same-day hospital</small></a><a href="#pain"><b>Painful crisis</b><small>Follow the plan, don’t delay, no pethidine</small></a><a href="#prevent"><b>Infection prevention</b><small>Penicillin per plan + live Green Book</small></a><a href="#drugs"><b>Specialist drugs</b><small>Hydroxycarbamide shared care</small></a></div>',
  glance:[
    {lbl:"Infection", val:"Functional hyposplenism", sub:"penicillin per specialist plan + live Green Book vaccines"},
    {lbl:"Crisis pain", val:"Hospital: analgesia ≤ 30 min", sub:"NICE CG143 / QS58 hospital standard — GP: don’t delay transfer"},
    {lbl:"Never", val:"Pethidine", sub:"NICE CG143"},
    {lbl:"Chest / neuro / fever", val:"Same-day hospital", sub:"ACS · stroke · sepsis — 999 if unstable"},
    {lbl:"Hydroxycarbamide", val:"Contraception, both sexes", sub:"Specialist-initiated · BSH 2018 · pre-conception plan with haematology"},
    {lbl:"Children", val:"Annual TCD age 2–16", sub:"HbSS / HbSβ⁰"}
  ],
  quickSub:"If you read nothing else on this page, read these cards. Hospital/ED standards (NICE CG143/QS58, RCEM 2024) describe what the patient should get on arrival — they are not primary-care targets. Your job is to screen for complications, follow the individualised plan and get them there fast with a clear handover.",
  quick:[
    {tone:"red", h:"⚠ Six high-risk presentations must not be treated as ‘just another crisis’", html:"<b>Acute chest syndrome</b> (chest symptoms, hypoxia or fever with pain), <b>neurological symptoms/stroke</b> (focal neurology, seizure, sudden severe headache), <b>fever or suspected sepsis</b>, <b>splenic or hepatic sequestration</b> (sudden pallor, lethargy or enlarging spleen), <b>acute aplastic/haemolytic anaemia</b> (pallor and lethargy with a significant Hb fall; aplastic crisis usually parvovirus B19), and <b>priapism</b>. <b>999 and pre-alert</b> for shock, severe hypoxia, major respiratory distress, seizure, new focal neurology, reduced consciousness, suspected severe sepsis or a rapidly deteriorating child. Otherwise <b>same-day emergency hospital assessment</b>, usually via the patient’s haemoglobinopathy plan; 999 if unstable. Do not observe at home."},
    {tone:"amber", h:"Pain: treat it, don’t judge it", html:"NICE CG143 sets <b>analgesia within 30 minutes</b> of hospital presentation and <b>no pethidine</b>; RCEM’s 2024 ED best-practice guideline asks for <b>15 minutes</b> (an ED standard, not a NICE quality standard). These are hospital/ED standards, not something the GP must deliver in the surgery. In primary care: believe the patient, screen for complications, follow their <b>individualised care plan</b>, and if home analgesia has not controlled the pain, arrange direct hospital/day-unit assessment — do not ‘try a bit longer’ or delay transfer to optimise opioids. The APPG 2021 inquiry found attitudes underpinned by racism in sickle pain care."},
    {tone:"blue", h:"Infection prevention is the GP’s core deliverable", html:"Functional hyposplenism → <b>penicillin prophylaxis per the haemoglobinopathy-team plan</b> (many patients remain on it lifelong; do not stop it without specialist discussion; erythromycin if allergic, per haematology) plus vaccines per the <b>live Green Book</b> (ch.7 and ch.25 — schedule depends on age and previous doses): pneumococcal, MenACWY, MenB, annual flu, COVID-19 per current programme. Do not prescribe a vaccine solely from this summary. Code it, recall it, check repeat-prescription gaps."},
    {tone:"amber", h:"Hydroxycarbamide: the one drug you must monitor", html:"<b>Specialist-initiated and dose-titrated</b> (BSH 2018: offer to children with HbSS/HbSβ⁰ from 9 months; in adults and other genotypes indications are individualised). Cytotoxic: <b>monitoring per the shared-care agreement must never lapse</b> — do not renew if it is absent, overdue or unclear; in SCD any fever is an emergency because of hyposplenism (and may also mean neutropenia); <b>contraception for men and women</b>; and a <b>pre-conception plan with haematology and obstetrics</b> (stopping at least 3 months before conception is commonly advised, but this is not an automatic rule in severe disease). Do not initiate crizanlizumab (MHRA revoked Jan 2024) or voxelotor (withdrawn Sept 2024); if a patient is still taking either, do not stop or alter it without urgent specialist discussion."},
    {tone:"green", h:"The bigger GP role", html:"Trait counselling and partner testing (1 in 4 risk if both carriers), pre-conception referral, school and work letters, mental health, transition planning from school year 9 (NICE NG43), and advocacy: the patient’s own knowledge of their disease is the best information you have."}
  ],
  pathwaySub:"Every contact with a person with sickle cell disease, in five moves. The red step is where harm happens.",
  pathway:[
    {title:"Know the patient", html:"Genotype (HbSS, HbSC, HbSβ-thal), <b>baseline Hb</b>, usual crisis pattern, spleen status, hydroxycarbamide or transfusion programme, the named haemoglobinopathy centre and the <b>individualised care plan</b>. This is what lets you see a deviation from normal."},
    {title:"Screen for the emergencies", html:"Chest, neuro, fever, pallor/spleen, priapism, uncontrolled pain. Check temperature, SpO₂ against their baseline, RR, HR, conscious level; in children feel the spleen. Any positive → same-day direct hospital assessment with a written handover; 999 if unstable. Do not delay for routine GP investigations.", alert:true},
    {title:"Treat pain promptly", html:"If it is a simple painful episode that the patient normally manages at home: continue their pre-agreed home analgesia plan, normal oral hydration, warmth, and a clear time limit. Pain not controlled by their home analgesia → hospital (the CG143 30-minute clock starts there)."},
    {title:"Prevent the next one", html:"Penicillin adherence, vaccines, hydroxycarbamide monitoring and shared-care agreement, possible precipitating factors (dehydration, cold, hypoxia, infection), renal, retinal and pain review, smoking, sleep-disordered breathing, mental health, contraception and pre-conception plans."},
    {title:"Close the loop", html:"Confirm annual specialist review is happening (TCD in children, renal, retinal, echo per centre), code the diagnosis and hyposplenism, and write the school/work letter the patient needs."}
  ],
  sections:[

    {id:"confirm", nav:"Confirm", title:"Confirming the diagnosis and knowing the baseline", sub:"Most people are diagnosed by newborn screening (England, since universal blood-spot screening). The GP rarely diagnoses sickle cell disease, but must know the genotype and the baseline.",
     blocks:[
       {b:"kv", rows:[
         ["Diagnosis","Specialist or newborn-screening confirmed haemoglobinopathy — commonly <b>HbSS</b> (sickle cell anaemia), also <b>HbSC</b> and <b>HbSβ-thalassaemia</b> (β⁰ behaves like HbSS). Confirmation is by haemoglobin analysis (HPLC/electrophoresis) in the lab, not the FBC."],
         ["Trait is not SCD","<b>Sickle cell trait (HbAS)</b> is not SCD and does not usually cause chronic anaemia, functional hyposplenism or recurrent vaso-occlusive crises. It is important for reproductive counselling and may rarely be associated with complications in extreme physiological circumstances, such as severe dehydration, hypoxia or high altitude. It does not routinely require penicillin prophylaxis or the SCD asplenia vaccine schedule, and does not generally change anaesthetic management (usual perioperative risk assessment applies). Under UKMEC 2025 it is relevant to the choice of contraception (see pregnancy section)."],
         ["Baseline","Record the patient’s <b>baseline Hb</b> (it varies widely between genotypes and individuals — always compare with their own value), baseline SpO₂, usual symptoms, genotype, splenic status, transfusion history and antibodies, hydroxycarbamide dose."],
         ["Hyposplenism","Most people with HbSS are functionally hyposplenic from early childhood → lifelong risk of overwhelming infection with encapsulated organisms (pneumococcus, meningococcus, Haemophilus) and salmonella."],
         ["Shared care","Every patient should be under a <b>specialist haemoglobinopathy team</b> (Specialist Haemoglobinopathy Team / Haemoglobinopathy Coordinating Centre network). The GP is the continuity, prevention and first-contact layer — not the manager of disease-modifying therapy."]
       ]},
       {b:"why", html:"Knowing the genotype and personal baseline is what lets you recognise a deviation — a fever, an Hb 20 g/L below usual, a new SpO₂ of 92% in someone whose baseline is 98% — and act before a crisis becomes life-threatening. A ‘normal-looking’ set of observations can be abnormal for this patient, and vice versa."}
     ]},

    {id:"redflags", nav:"Red flags", title:"Red flags — 999 or same-day hospital", sub:"These are the complications that kill. None is safe to observe in primary care. Send to the patient’s haemoglobinopathy centre or ED per their care plan; 999 if unstable.",
     blocks:[
       {b:"table", head:["Presentation","Primary-care action"], rows:[
         ["Shock, severe hypoxia, major respiratory distress, seizure, new focal neurology, reduced consciousness, suspected severe sepsis or rapidly deteriorating child","<b>999</b> and pre-alert hospital"],
         ["Chest pain, breathlessness, fever with respiratory symptoms, falling SpO₂, severe or uncontrolled pain, new pallor with suspected acute anaemia, enlarging spleen, or priapism","<b>Same-day emergency hospital assessment</b>, usually via the patient’s haemoglobinopathy plan; 999 if unstable"],
         ["Aplastic crisis suspected from marked pallor/lethargy and a significant Hb fall","<b>Same-day hospital/haematology assessment</b>; 999 if unstable"],
         ["Uncomplicated pain controlled by the individualised home plan and no red flags","Continue the plan, with explicit review/escalation instructions"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 Acute chest syndrome", html:"Suspect acute chest syndrome with new chest pain, cough, breathlessness, tachypnoea, fever, <b>falling oxygen saturation</b> or new respiratory signs, particularly during or after a painful episode. Arrange <b>same-day hospital assessment; use 999 if unstable</b>, oxygen if hypoxic. Do not wait for a community chest X-ray, and do not treat as a simple chest infection in the community. The formal definition (fever and/or respiratory symptoms with a new infiltrate on CXR) is a hospital diagnosis; hospital care includes antibiotics with atypical cover, early specialist review and transfusion decisions guided by severity.", src:"BSH 2015 acute chest syndrome guideline · NICE QS58 statement 4"},
         {tone:"red", h:"🔴 Stroke or TIA", html:"Any new focal neurological symptom (weakness, speech disturbance, facial droop), seizure, sudden severe headache, altered consciousness or new confusion is an emergency: <b>999</b>. Pre-alert the receiving hospital and state clearly that the patient has SCD. Children are at highest risk (peak around age 7). Haematology, stroke and transfusion teams should be involved immediately. Urgent transfusion is generally required, with a target HbS below 30% pending specialist assessment; the choice of simple versus exchange transfusion is specialist-led. Do not promise immediate exchange transfusion, and never delay transfer for HbS measurement.", src:"BSH 2016 red cell transfusion in SCD Part II"},
         {tone:"red", h:"🔴 Splenic or hepatic sequestration (splenic mainly in young children)", html:"Sudden pallor, lethargy, abdominal pain or distension, <b>rapidly enlarging spleen</b> (or liver), falling Hb well below baseline, shock. <b>Same-day emergency hospital assessment; 999 if shocked, very pale and lethargic, or deteriorating</b> — can be fatal within hours. Parents are taught to feel the spleen; take their concern seriously.", src:"Sickle Cell Society paediatric standards 2019 · BSH 2016 transfusion Part II"},
         {tone:"red", h:"🔴 Aplastic crisis (parvovirus B19)", html:"Unusual tiredness, pallor, breathlessness, Hb well below baseline with a <b>low reticulocyte count</b>, often after a viral illness. A low reticulocyte count is abnormal in a patient with SCD and a significant Hb fall. The usual cause is parvovirus B19, but consider other causes of acute anaemia; aplastic crisis is not diagnosed by symptoms alone. <b>Same-day hospital/haematology assessment</b> (may need transfusion); 999 only if unstable. Do not wait for outpatient blood results if the patient is significantly pale, lethargic, breathless or symptomatic. Siblings or household contacts with SCD exposed to parvovirus are also at risk.", src:"BSH 2016 red cell transfusion in SCD Part II"},
         {tone:"red", h:"🔴 Fever in functional hyposplenism", html:"Fever in SCD or known functional hyposplenism is <b>potential overwhelming sepsis</b> and requires <b>urgent same-day hospital assessment</b> — even in a well-looking patient on penicillin; prophylactic penicillin does not make fever safe. Use the individualised care plan and local pathway. <b>Call 999</b> if the patient is systemically unwell, hypotensive, hypoxic, confused, rapidly deteriorating or otherwise unstable. Antibiotics follow the local hospital/haemoglobinopathy protocol; do not manage suspected sepsis solely in primary care.", src:"BSH 2024 absent/hypofunctional spleen guideline · UKHSA Green Book ch.7 (asplenia/splenic dysfunction)"},
         {tone:"red", h:"🔴 Priapism", html:"A persistent painful erection should be treated as possible ischaemic priapism. If it persists for <b>approximately 2 hours</b>, it requires urgent ED/urology assessment according to the local haemoglobinopathy pathway — <b>do not wait until 4 hours</b>; the risk of irreversible erectile dysfunction increases with duration, particularly beyond 4 hours. Gentle exercise, passing urine, warmth and the patient’s agreed analgesia may be attempted while arranging care, but must not delay urological treatment. <b>Do not use ice packs.</b> Aspiration/irrigation and intracavernosal sympathomimetic treatment should not be delayed while arranging transfusion; exchange transfusion is not routine first-line treatment for established priapism. Specialist advice is required before prescribing oral etilefrine. Recurrent short (‘stuttering’) episodes → urology and haematology review.", src:"BSH 2016 red cell transfusion in SCD Part II · RCEM 2024 (attend within 2 hours) · AUA/SMSNA priapism guideline 2022 (international; ischaemic priapism > 4 h)"},
         {tone:"amber", h:"Painful crisis not settling with home analgesia", html:"If the patient’s usual home regimen has not controlled the pain, or pain is atypical (abdominal, chest, back with fever), they need hospital. Hospital standard (not a primary-care target): <b>assessment and analgesia within 30 minutes</b>, reassessment every 30 minutes until controlled, then at least every 4 hours. Do not delay transfer while attempting to optimise opioids in primary care.", src:"NICE CG143 · NICE QS58 statements 1–2"},
         {tone:"amber", h:"Other same-day features", html:"Severe or worsening abdominal pain (girdle syndrome, hepatic sequestration, cholecystitis), jaundice darker than usual, sudden visual loss (retinal detachment / haemorrhage), marked drop in urine output, symptomatic anaemia, pregnancy with any of the above.", src:"Sickle Cell Society adult standards 2018 · RCEM 2024 SCD best practice guideline"}
       ]},
       {b:"warn", html:"<b>Do not let a patient be ‘held’ in primary care for an opioid review, a callback slot or a GP appointment tomorrow.</b> Phone the haemoglobinopathy team or ED, send a written summary (genotype; baseline Hb and usual SpO₂; current medications and last hydroxycarbamide dose; analgesia already taken and timing; transfusion history; red-cell antibodies and previous reactions; the individualised care plan; haemoglobinopathy-centre contact details), and document the time of decision. RCEM’s 2024 ED best-practice guideline asks EDs to see and treat pain within 15 minutes and have specialty review within 30 minutes of recognising a complication — your handover helps them hit that."},
       {b:"why", html:"Acute chest syndrome often develops <em>during</em> a painful crisis, so a patient who ‘just has pain’ on day 1 can be hypoxic on day 2. NICE QS58 statement 4 specifically asks hospitals to assess for ACS if there are abnormal respiratory signs, chest pain, fever or hypoxia — the same features should prompt referral from primary care."}
     ]},

    {id:"pain", nav:"Painful crisis", title:"Acute painful episodes — principles for primary care", sub:"Most painful episodes are managed at home by the patient using their own plan. NICE CG143 and the RCEM guideline describe hospital/ED standards. In primary care, the GP should rapidly screen for complications, follow the patient’s individualised plan, provide appropriate immediate treatment where competent and safe, and arrange direct hospital/day-unit assessment if the home plan has failed or the presentation is atypical.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Home", title:"Patient-led self-management", when:"mild–moderate pain, no red flags",
          html:"Continue the patient’s <b>pre-agreed home analgesia plan</b> from the haemoglobinopathy team if there are no red flags: regular paracetamol, an NSAID if appropriate (check renal function, pregnancy, asthma), and a weak or oral strong opioid only if the specialist plan includes it. Encourage normal oral hydration if the patient can drink and is not vomiting — do not encourage excessive fluid intake; IV fluids are hospital-led and guided by hydration status, renal function, cardiac status and risk of pulmonary oedema. Keep warm, rest; treat any precipitating infection. Verify doses against current product information and BNF/BNFC.", tone:"green"},
         {step:"GP contact", title:"Assess, don’t interrogate", when:"same day", fromLabel:"patient asks for help",
          html:"Pain score, site, how it compares with usual crises, what has been taken and when; temperature, SpO₂, RR, HR, chest, neuro, abdomen/spleen. <b>Believe the pain score.</b> Do not substitute a new strong-opioid regimen in primary care without specialist/local protocol support; if the agreed home regimen has failed, arrange hospital or haemoglobinopathy-day-unit assessment. Where opioids are part of the agreed plan, add <b>laxative and antiemetic</b>. Agree a specific time limit and route back."},
         {step:"Escalate", title:"Pain not controlled with home analgesia", when:"hospital today", fromLabel:"do not ‘wait and see’", tone:"amber",
          html:"Direct to the haemoglobinopathy day unit or ED per the care plan. In hospital: <b>analgesia within 30 minutes</b>, consider a strong opioid if moderate–severe pain or ineffective previous analgesia, reassess every 30 minutes, PCA if repeated boluses are needed within 2 hours, and hourly adverse-event monitoring for the first 6 hours on strong opioids.",
          warn:"<b>Never pethidine</b> (NICE CG143) — risk of norpethidine toxicity and seizures."},
         {step:"Red flag", title:"Any complication", when:"999", fromLabel:"chest · neuro · fever · pallor · priapism", tone:"red",
          html:"See the red-flag section. Pain plus hypoxia, fever or chest signs = possible acute chest syndrome."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Hospital standards (NICE QS58 — not GP targets)", html:"Pain assessment, clinical assessment and appropriate analgesia <b>within 30 minutes</b> of presentation; pain relief reassessed every 30 minutes until satisfactory, then at least every 4 hours; hourly monitoring for opioid adverse events for the first 6 hours; assessment for acute chest syndrome; information on discharge.", src:"NICE QS58 statements 1–4 and 6"},
         {tone:"blue", h:"RCEM ED best-practice standard (2024)", html:"An emergency-department best-practice standard, not a NICE quality standard: assess and offer analgesia <b>within 15 minutes</b> of arrival; reassess within 15 minutes if severe pain; decision on complications within 1 hour; specialty review within 30 minutes of recognising a significant complication.", src:"RCEM 2024 best practice guideline (v3.2)"},
         {tone:"amber", h:"Use the patient’s knowledge", html:"NICE CG143 asks clinicians to take into account the patient’s own knowledge of their condition and their individualised care plan when choosing analgesia and dose. Patients who have lived with SCD for years usually know what works; a request for a specific opioid is not by itself drug-seeking.", src:"NICE CG143"},
         {tone:"red", h:"Racism and stigma in pain care", html:"The APPG inquiry found sub-standard care in EDs and on general wards, low awareness of SCD, negative attitudes and attitudes underpinned by racism, including delayed analgesia and patients being labelled as drug-seeking. Deaths have followed. Name the diagnosis clearly in referrals and document the pain score.", src:"APPG on Sickle Cell and Thalassaemia ‘No One’s Listening’ (Nov 2021)"}
       ]},
       {b:"why", html:"Vaso-occlusive pain is ischaemic pain: delay increases suffering and the risk of complications, and under-treatment is a recognised cause of harm and mistrust. The 2023 exceptional surveillance review of NICE CG143 found no new evidence to change its recommendations, so the 30-minute standard and the pethidine prohibition remain current."}
     ]},

    {id:"prevent", nav:"Infection prevention", title:"Infection prevention — penicillin and vaccines", sub:"Functional hyposplenism means lifelong risk. Vaccines do not cover every strain, so both prophylaxis and immunisation are needed.",
     blocks:[
       {b:"table", head:["Measure","What to give","Source / notes"], rows:[
         ["<b>Penicillin prophylaxis</b>","Phenoxymethylpenicillin (penicillin V) twice daily, started in infancy after newborn screening; erythromycin if penicillin-allergic. Prescribe according to the patient’s haemoglobinopathy-team plan. Do not stop it because the patient is older, clinically well or fully vaccinated without discussion with the specialist team. Many patients with SCD remain on lifelong prophylaxis; the precise duration should follow the current national and local haemoglobinopathy protocol. <b>Verify the dose against BNF/BNFC by age band</b>.","BSH 2024 absent/hypofunctional spleen guideline (risk-stratified duration); UKHSA Green Book ch.7; Sickle Cell Society paediatric standards 2019 (target: prescribed by 3 months of age)"],
         ["<b>Pneumococcal</b>","Check the current UKHSA Green Book chapters 7 and 25 at every review. The pneumococcal schedule for SCD depends on age and previous PCV/PPV vaccination, and the national programme is changing from PPV23 to PCV20; the current chapter describes five-yearly re-immunisation for asplenia/splenic dysfunction. <b>Do not prescribe a vaccine solely from this summary table.</b>","UKHSA Green Book ch.25 (pneumococcal; check the live version)"],
         ["<b>Meningococcal</b>","<b>MenACWY</b> and <b>MenB</b> according to the live Green Book schedule for the patient’s age and previous doses, in addition to the routine schedule. An additional Hib dose is not routinely required solely for hyposplenism if the routine schedule is complete; follow the current Green Book and specialist advice.","UKHSA Green Book ch.7 and ch.22 (meningococcal)"],
         ["<b>Influenza</b>","<b>Annual</b> flu vaccine from 6 months of age (asplenia/splenic dysfunction is a clinical risk group).","UKHSA Green Book ch.19 (influenza)"],
         ["<b>COVID-19</b>","Per the current seasonal programme eligibility — check each season’s JCVI advice and Green Book ch.14a.","UKHSA Green Book ch.14a"],
         ["<b>Hepatitis B</b>","Consider for people on regular transfusion programmes if advised by the haematology team.","Check UKHSA Green Book ch.18 for current indications"],
         ["<b>Travel</b>","Malaria prophylaxis and bite avoidance are essential — malaria is dangerous in SCD; hyposplenic travellers need rigorous advice via a specialist travel clinic or the haemoglobinopathy team. Long-haul travel and high-altitude exposure need advance haemoglobinopathy-team advice. Typhoid and other travel vaccines per destination; live travel vaccines in patients on hydroxycarbamide need specialist assessment.","Travel health guidance; haematology advice"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Make it a system, not a memory", html:"Code ‘sickle cell disease’ <b>and</b> ‘hyposplenism/splenic dysfunction’ so the patient enters flu, pneumococcal and COVID recalls. Audit penicillin repeat issues: a gap in collection is a gap in protection. Adolescents commonly stop — ask directly.", src:"UKHSA Green Book ch.7"},
         {tone:"amber", h:"Emergency antibiotic plan", html:"Some specialist services provide <b>rescue (standby) antibiotics</b> and a card telling the patient to seek same-day medical review for any fever. Patients must still seek urgent medical attention even if they have taken rescue antibiotics. Treatment antibiotics should follow local microbiology/haemoglobinopathy guidance and should not simply be the same as prophylactic penicillin. Prophylaxis does not make fever safe.", src:"UKHSA Green Book ch.7 · Sickle Cell Society adult standards 2018"}
       ]},
       {b:"why", html:"Before newborn screening and penicillin prophylaxis, invasive pneumococcal disease was a major cause of death in young children with SCD. Prophylaxis plus conjugate vaccines transformed survival — which is why non-adherence and missed boosters are safety issues, not administrative ones."}
     ]},

    {id:"drugs", nav:"Specialist drugs", title:"Specialist and shared-care drugs the GP must know", sub:"Hydroxycarbamide is the main disease-modifying drug in UK practice and is specialist-initiated. Two newer drugs have been withdrawn. Transfusion, stem-cell transplantation and gene therapy are specialist options.",
     blocks:[
       {b:"cards", items:[
         {tone:"blue", h:"Hydroxycarbamide — who and why", html:"<b>Specialist-initiated and dose-titrated</b> — never initiated or dose-adjusted by primary care. It should be <b>offered to children with HbSS or HbSβ⁰ from 9 months of age</b>, according to the specialist pathway. In adults and in other genotypes, indications are individualised according to pain, acute chest syndrome, anaemia, stroke risk and other complications; evidence is strongest for HbSS and HbSβ⁰, and treatment for HbSC and HbSβ⁺ is specialist-led and individualised. Reduces painful crises, acute chest syndrome and transfusion need, and has a role in selected primary stroke-prevention pathways in children. Shared decision-making throughout.", src:"BSH 2018 hydroxycarbamide guideline"},
         {tone:"red", h:"Hydroxycarbamide — monitoring", html:"Cytotoxic and myelosuppressive: <b>FBC (neutrophils, platelets), reticulocyte count, renal function/eGFR and LFTs</b>, plus LDH and urate where the local protocol specifies, at the exact interval set in the shared-care agreement (e.g. Greater Manchester adult protocol: usually every 2 weeks during initiation/dose optimisation and every 8–12 weeks once stable; SPS: two-weekly FBC early, two- to three-monthly once stable). <b>Never continue or renew hydroxycarbamide under shared care if the monitoring agreement is absent, overdue or unclear.</b> Unexpected cytopenia, febrile illness, bleeding, severe mucositis or significant renal deterioration requires urgent discussion with haematology. Do not independently reduce or increase the dose. Fever in SCD is an emergency in its own right (hyposplenism), not only a sign of neutropenia.", src:"BSH 2018 hydroxycarbamide guideline · GMMMG hydroxycarbamide shared-care protocol · SPS hydroxycarbamide monitoring"},
         {tone:"red", h:"Hydroxycarbamide — fertility, pregnancy, breastfeeding", html:"<b>Contraception for both men and women</b> while taking it, individualised; follow the product information for contraception after stopping. Consider sperm analysis/cryopreservation in post-pubertal males before treatment where feasible. Before planned pregnancy, arrange pre-conception review with haematology and obstetrics. Hydroxycarbamide is generally avoided in pregnancy and stopping <b>at least 3 months before conception</b> is commonly advised, but this is not an automatic rule. For severe disease, the risks of stopping may outweigh theoretical fetal risks; continuation or transfusion-based alternatives require a documented haematology–obstetric–patient decision. If pregnancy occurs while taking hydroxycarbamide, contact haematology and obstetrics urgently and do not make an unplanned medication change without specialist advice. Breastfeeding requires specialist advice.", src:"BSH 2018 hydroxycarbamide guideline · BSH 2021 SCD in pregnancy · RCOG Green-top Guideline 61"},
         {tone:"blue", h:"Transfusion programmes and iron", html:"Simple or exchange transfusion is used acutely and long-term (e.g. secondary stroke prevention keeping HbS below 30%). The HbS below 30% target applies to specific indications, particularly acute ischaemic stroke and selected chronic transfusion programmes, not to every transfusion. Never arrange non-emergency transfusion for SCD without haemoglobinopathy-team involvement. Ensure the receiving hospital knows about previous alloantibodies and transfusion reactions. Transfusion thresholds depend on baseline Hb, symptoms, complication and transfusion history; do not transfuse to a generic Hb target. Long-term transfusion causes iron overload (chelation is specialist-managed) and red cell alloantibodies — record transfusion history, antibody status, the transfusing centre and the simple/exchange programme on the GP record.", src:"BSH 2016 red cell transfusion in SCD Parts I and II"},
         {tone:"amber", h:"Crizanlizumab — no longer available", html:"NICE TA743 (Nov 2021) recommended it under managed access, but the <b>MHRA revoked the UK conditional marketing authorisation on 10 January 2024</b> after the STAND trial did not confirm benefit; TA743 was withdrawn. Do not initiate crizanlizumab in the UK; if a patient is still taking it, do not stop or alter it without urgent discussion with the specialist haemoglobinopathy team.", src:"NICE TA743 (withdrawn) · MHRA revocation 2024"},
         {tone:"amber", h:"Voxelotor — withdrawn worldwide", html:"NICE TA981 (June 2024) recommended it for haemolytic anaemia in SCD from age 12; <b>Pfizer withdrew it from all markets on 25 September 2024</b> (imbalance in vaso-occlusive crises and deaths) and MHRA issued a recall; TA981 was withdrawn. MHRA advised prescribers to contact patients to stop treatment; abrupt withdrawal has been reported to precipitate crises. Do not initiate voxelotor; if a patient is still taking it, do not stop or alter it without urgent discussion with the specialist haemoglobinopathy team.", src:"NICE TA981 (withdrawn) · MHRA drug alert EL(24)A/44, 30 Sept 2024"},
         {tone:"blue", h:"Other specialist options", html:"Specialist teams may consider <b>chronic simple or exchange transfusion</b>, <b>allogeneic stem-cell transplantation</b>, and <b>gene-addition or gene-editing therapy</b> in selected patients, subject to current NICE/NHS England criteria — NICE TA1044 covers exagamglogene autotemcel for selected people aged 12 years and over with severe SCD. These are not GP treatments, but patients should not be told that hydroxycarbamide is the only possible disease-modifying pathway.", src:"NICE TA1044 · BSH 2016 red cell transfusion in SCD"}
       ]},
       {b:"dl", rows:[
         ["Folic acid","Traditionally prescribed daily because of chronic haemolysis; practice now varies between centres. <b>Prescribe if the haematology team recommends it</b>, dose per BNF/BNFC. Higher-dose folic acid is standard pre-conception and in pregnancy (BSH 2021)."],
         ["Iron","Do <b>not</b> give iron routinely — low MCV or anaemia in SCD is usually not iron deficiency, and transfused patients may be iron-overloaded. Check ferritin first."],
         ["Opioids","Long-term opioid prescribing for chronic sickle pain should be agreed with the haemoglobinopathy / pain team; review regularly, and never withhold acute analgesia because of a chronic-pain plan."],
         ["Live vaccines on hydroxycarbamide","Vaccination should follow the current Green Book and the hydroxycarbamide shared-care protocol. Do not assume that every live vaccine is permanently contraindicated; assess the vaccine, treatment intensity, immune status and travel indication with the specialist team (particularly MMR and travel vaccines in children)."],
         ["Things to avoid","Pethidine (NICE CG143); dehydrating drugs without care; generic transfusion targets; new strong-opioid regimens without specialist/local protocol support. Contraception: individualise using current UKMEC — combined hormonal contraception is not automatically contraindicated in SCD (see pregnancy section)."]
       ]},
       {b:"why", html:"Hydroxycarbamide works mainly by raising fetal haemoglobin (HbF), which reduces sickling. Its benefit depends on adherence and on the dose being escalated safely, which in turn depends on FBC monitoring not lapsing — the GP is often the person who notices a missed blood test or repeat prescription."}
     ]},

    {id:"lifestyle", nav:"Everyday life", title:"Self-management, triggers and everyday life", sub:"Patients may identify precipitating factors such as infection, dehydration, cold exposure, hypoxia, exertion, stress, pregnancy or travel; some crises occur without an obvious trigger. Consistent self-management can reduce them alongside the drugs.",
     blocks:[
       {b:"tiles", v:"life", items:[
         {t:"💧 Stay hydrated", html:"Dehydration can precipitate sickling — maintain good oral hydration in heat, illness, exercise and on flights, without excessive fluid intake. Water bottle access at school and work."},
         {t:"🌡️ Keep warm", html:"Cold, wind and sudden temperature change (including cold-water swimming) trigger vaso-occlusion — layers, avoid getting chilled."},
         {t:"🏔️ Avoid hypoxia", html:"Planned surgery, anaesthesia, long-haul travel, high-altitude exposure and pregnancy require advance advice from the haemoglobinopathy team. Do not provide generic oxygen or transfusion advice in primary care. Treat sleep-disordered breathing; stop smoking and avoid second-hand smoke."},
         {t:"🦠 Early infection care", html:"Fever is an emergency (hyposplenism). Keep penicillin and vaccines up to date; malaria prophylaxis when travelling."},
         {t:"🏃 Exercise sensibly", html:"Regular moderate activity is encouraged; avoid extreme exertion, overheating and dehydration; rest and fluids during sport."},
         {t:"🧠 Mind and mood", html:"Chronic pain, unpredictable admissions and stigma affect mood, sleep, education and work. Screen for depression and anxiety and refer to psychology (many centres have a haemoglobinopathy psychologist)."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"School letters (children)", html:"Ask the school for an individual healthcare plan: unrestricted water and toilet access, keeping warm (indoor break in cold weather), sensible PE with rests, a plan for pain and fever at school, and support for absences so education is protected.", src:"Sickle Cell Society paediatric standards 2019"},
         {tone:"green", h:"Work letters (adults)", html:"Reasonable adjustments: temperature-controlled environment, hydration and breaks, flexibility for appointments and crises. SCD can meet the Equality Act 2010 definition of disability. Fit notes as needed.", src:"Sickle Cell Society adult standards 2018"},
         {tone:"blue", h:"Psychological support", html:"Access to psychology is part of the national standards for children and adults; ask about school/work stress, mood and fear of hospital. Signpost the Sickle Cell Society and local support groups.", src:"Sickle Cell Society adult standards 2018 · paediatric standards 2019"},
         {tone:"cream", h:"Chronic pain", html:"Some adults develop chronic daily pain (avascular necrosis of hip/shoulder, leg ulcers, neuropathic pain). Refer back to haematology for assessment of the cause; joint pain may need orthopaedic review. Review for chronic pain and opioid-related harms.", src:"Sickle Cell Society adult standards 2018"}
       ]}
     ]},

    {id:"pregnancy", nav:"Trait & pregnancy", title:"Trait counselling, screening, contraception and pregnancy", sub:"Reproductive decisions are where primary care adds most for carriers as well as for people with SCD.",
     blocks:[
       {b:"cards", items:[
         {tone:"blue", h:"National screening programme", html:"The NHS Sickle Cell and Thalassaemia Screening Programme offers <b>antenatal screening to all pregnant women, ideally by 10 weeks</b> (family origin questionnaire with booking bloods) so that prenatal diagnosis can be offered by 12+6 weeks, and <b>newborn screening for SCD</b> via the blood spot.", src:"NHS England/UKHSA Sickle Cell and Thalassaemia Screening Programme"},
         {tone:"blue", h:"Carrier (trait) counselling", html:"If both partners are carriers (e.g. HbAS + HbAS), each pregnancy has a <b>1 in 4</b> chance of SCD, <b>1 in 2</b> of carrier status and <b>1 in 4</b> of neither. Offer partner testing and referral to a haemoglobinopathy counsellor; preconception testing is available on request through the GP.", src:"NHS England/UKHSA Sickle Cell and Thalassaemia Screening Programme"},
         {tone:"blue", h:"Pre-conception (person with SCD)", html:"Refer to haematology and obstetrics before pregnancy: agree a documented plan for hydroxycarbamide (stopping at least 3 months before conception is commonly advised, but in severe disease continuation or transfusion-based alternatives may be safer — a haematology–obstetric–patient decision), review ACE inhibitors and other teratogens, update vaccines, higher-dose folic acid, partner testing, and screening for end-organ damage. Pregnancy is high-risk: joint haematology–obstetric care.", src:"BSH 2021 SCD in pregnancy · RCOG Green-top Guideline 61 · BSH 2018 hydroxycarbamide guideline"},
         {tone:"amber", h:"Contraception", html:"Effective contraception matters (hydroxycarbamide, pregnancy risk). For people with <b>SCD</b>, contraception should be individualised using current UKMEC guidance. Progestogen-only methods and the LNG-IUD are commonly suitable. Combined hormonal contraception is not automatically contraindicated (UKMEC 2025 category 2 in SCD), but assess VTE history, smoking, hypertension, immobility, migraine, renal disease and other cardiovascular risks. For <b>sickle cell trait</b>, <b>UKMEC 2025</b> does not assign formal categories because evidence is limited; it notes a small increase in VTE risk, and alternatives to combined hormonal contraception should generally be prioritised.", src:"CoSRH (FSRH) UKMEC 2025 · BSH 2021 SCD in pregnancy"}
       ]},
       {b:"why", html:"Antenatal screening only works if booking happens early: a late booking removes the window for prenatal diagnosis. GPs who see women planning pregnancy or with early positive tests can make the difference by booking promptly and asking about family origin and partner status."}
     ]},

    {id:"children", nav:"Children & transition", title:"Children and young people, and transition", sub:"Most children are known from newborn screening. The early years carry the highest risk of sepsis, sequestration and stroke.",
     blocks:[
       {b:"table", head:["Issue","What should happen","GP role"], rows:[
         ["Newborn screening","Screen-positive babies seen by a specialist and started on penicillin early (paediatric standards target: by 3 months of age)","Check the baby is under a paediatric haemoglobinopathy team and penicillin is on repeat"],
         ["Stroke screening","<b>Annual transcranial Doppler (TCD) from age 2 to at least 16</b> in HbSS and HbSβ⁰, by an accredited/experienced service; abnormal or conditional results require specialist action — transfusion remains central for many children, and hydroxycarbamide is not an automatic substitute in all children with abnormal TCD","Encourage attendance; a missed TCD is a significant safety issue"],
         ["Splenic sequestration","Parents taught to feel the spleen and recognise pallor and lethargy","Any parental concern about a big spleen or pallor → 999 / same-day hospital"],
         ["Growth and development","Growth, puberty, school progress and sleep (adenotonsillar hypertrophy and nocturnal hypoxia) reviewed","Plot growth; ask about delayed puberty, snoring and school absence"],
         ["Enuresis","Common in SCD because of reduced urine-concentrating ability","Normalise it, do not restrict fluids"],
         ["Transition","Planning should start by <b>school year 9 (age 13–14)</b> with a named worker and a coordinated plan into adult haemoglobinopathy services","Support self-management, confidential consultations, and continuity of prescriptions and vaccines through the handover"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"Transition planning", html:"Transition is a high-risk period for disengagement, missed penicillin and ED attendances. Planning should begin by school year 9 and be developmentally appropriate.", src:"NICE NG43 (2016) transition from children’s to adults’ services"},
         {tone:"blue", h:"TCD standard", html:"Annual TCD from age 2 until at least 16 in HbSS and HbSβ⁰, performed by accredited practitioners; stroke risk peaks around age 7.", src:"Sickle Cell Society paediatric standards 2019"}
       ]}
     ]},

    {id:"monitor", nav:"Follow-up", title:"Follow-up and monitoring", sub:"Specialist annual review screens for end-organ damage; the GP makes sure it happens and actions results that come back to primary care.",
     blocks:[
       {b:"table", head:["What","When","Who / action"], rows:[
         ["Hydroxycarbamide: FBC (neutrophils, platelets), reticulocytes, renal function/eGFR, LFTs; LDH and urate if the local protocol specifies","Exact interval stated in the shared-care agreement (e.g. GM adult protocol: every 2 weeks during initiation/dose optimisation, every 8–12 weeks once stable)","GP or specialist per local shared-care agreement; unexpected cytopenia → discuss same day with haematology"],
         ["Annual specialist review","At least annually","Haemoglobinopathy team: Hb and haemolysis markers, BP, urine albumin:creatinine (sickle nephropathy), SpO₂, growth in children"],
         ["TCD (children)","Annually, age 2 to at least 16 (HbSS/HbSβ⁰)","Paediatric haemoglobinopathy team"],
         ["Retinal screening","Per the local sickle-retinopathy screening pathway age and frequency schedule (proliferative retinopathy is more common in HbSC)","Ensure the patient is enrolled in the local sickle-retinopathy screening pathway. Sudden visual loss, new floaters, visual field loss or acute eye pain → same-day ophthalmological assessment"],
         ["Pulmonary hypertension / cardiac","Echo when symptomatic or per centre","Breathlessness out of keeping with anaemia → tell haematology"],
         ["Ferritin (transfused patients)","Per haematology","Iron overload and chelation are specialist-managed"],
         ["Vaccines and penicillin","Flu annually; pneumococcal and meningococcal per the live Green Book for age and previous doses; check penicillin repeats and adherence","GP recall system (UKHSA Green Book ch.7/25); penicillin duration per haemoglobinopathy plan"],
         ["Mental health, pain, school/work","Every review","GP: PHQ-9/GAD-7 where appropriate, letters, psychology referral"],
         ["Chronic complications","Every review","Prompt consideration of: chronic kidney disease and albuminuria; pulmonary hypertension; avascular necrosis; chronic pain and opioid-related harms; leg ulcers; gallstones and recurrent abdominal pain; priapism and erectile/sexual health concerns; depression, anxiety and sleep-disordered breathing; delayed puberty or growth concerns in children; thromboembolism; retinopathy"]
       ]},
       {b:"timeline", items:[
         {n:"1", when:"Lifelong", title:"Prophylaxis and vaccines", html:"Penicillin prophylaxis per the haemoglobinopathy plan, vaccines per the live Green Book, folic acid if advised, hydroxycarbamide where indicated (specialist-initiated) — GP supports adherence."},
         {n:"2", when:"Each contact", title:"Prevent crises", html:"Hydration, warmth, trigger avoidance; treat infection promptly with a low threshold for same-day review. Confirm annual review and TCD in children."},
         {n:"3", when:"Acute", title:"Escalate fast", html:"Severe pain, fever, chest symptoms, neurological signs, pallor or big spleen, priapism → same-day hospital assessment, 999 if unstable; never undertreat sickle pain."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral — urgency, where and what to send", sub:"Everyone with SCD should be under a specialist team. Use the patient’s care plan for acute routes.",
     blocks:[
       {b:"table", head:["Urgency","Situation","Where","What to send"], rows:[
         ["<b>999</b>","Shock, severe hypoxia, major respiratory distress, seizure, new focal neurology, reduced consciousness, suspected severe sepsis, rapidly deteriorating child","ED (pre-alert)","Genotype; baseline Hb and usual SpO₂; current medications and last hydroxycarbamide dose; analgesia taken and timing; transfusion history; red-cell antibodies and previous reactions; individualised care plan; haemoglobinopathy-centre contact details"],
         ["<b>Same day</b>","Fever (999 if unstable), chest pain, breathlessness or falling SpO₂, pain not controlled with home analgesia, new pallor or suspected acute anaemia (including aplastic picture), enlarging spleen, priapism (~2 h), new visual loss, pregnancy with complications","Haemoglobinopathy day unit or ED per care plan","As above; phone the on-call haematologist if possible"],
         ["<b>Urgent (days)</b>","Unexpected cytopenia on hydroxycarbamide (non-febrile), unplanned pregnancy on hydroxycarbamide, recurrent stuttering priapism","Haematology ± urology/obstetrics","Results, medication, contraception history"],
         ["<b>Routine</b>","Not under a specialist team; pre-conception planning; chronic pain; leg ulcers; avascular necrosis; psychology","Haemoglobinopathy team, pain team, psychology, orthopaedics","Summary of crises, admissions and current issues"],
         ["<b>Counselling</b>","Carrier couples; trait found incidentally; family testing","Haemoglobinopathy counsellor / antenatal screening team","Both partners’ results where available"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"red", h:"Emergency routes", html:"Acute chest syndrome, stroke, sepsis/fever, sequestration, aplastic crisis, priapism, uncontrolled crisis: hospital today; 999 if unstable. RCEM’s ED best-practice standard is analgesia within 15 minutes and specialty review within 30 minutes of recognising a complication; NICE’s hospital standard is analgesia within 30 minutes.", src:"RCEM 2024 best practice guideline · NICE CG143"},
         {tone:"blue", h:"Specialist (all patients)", html:"Disease-modifying therapy, transfusion programmes, annual review, TCD, transition, pregnancy planning and monitoring sit with the haemoglobinopathy team.", src:"Sickle Cell Society adult standards 2018 · paediatric standards 2019"}
       ]}
     ]},

    {id:"safety", nav:"Safety-net", title:"Safety-netting", sub:"Specific, written, and matched to the patient’s care plan.",
     blocks:[
       {b:"say", html:"“Your sickle cell team looks after the specialist side, but day to day we help keep you well: the daily penicillin and your vaccines because your spleen doesn’t protect you properly, and the blood tests if you take hydroxycarbamide. If you get a crisis, keep warm, keep drinking normally and take your painkillers as your plan says. <b>If the pain isn’t controlled by your usual painkillers, go to hospital — don’t wait for an appointment with us.</b> And some things are always an emergency: a temperature, chest pain or breathlessness, weakness or trouble speaking, a painful erection that won’t go down after about two hours, or, for your child, sudden paleness, floppiness or a swollen tummy. For those, go straight to hospital today as your plan says — call 999 if you are very unwell, confused, very breathless or getting worse fast — and tell them you have sickle cell.”"},
       {b:"cards", cols:2, items:[
         {tone:"red", h:"Always same day", html:"Temperature, chest pain, breathlessness, new neurology or severe headache, sudden pallor or tiredness, big spleen in a child, priapism not settling, pain not controlled by the home plan.", src:"NICE QS58 statement 4 · BSH 2015 acute chest syndrome guideline"},
         {tone:"green", h:"Carry the plan", html:"Encourage patients to carry their individualised care plan and a card stating diagnosis, genotype, baseline Hb and the haemoglobinopathy centre contact, and to tell ED staff they have sickle cell disease.", src:"NICE CG143 · Sickle Cell Society adult standards 2018"}
       ]}
     ]},

    {id:"pitfalls", nav:"Pitfalls", title:"Common pitfalls", sub:"Most of the harm in SCD comes from delay and from assumptions.",
     blocks:[
       {b:"dl", rows:[
         ["‘Just another crisis’","Missing acute chest syndrome, sequestration or stroke because the patient has had pain before. Examine the chest, check SpO₂ against baseline, look at the neurology and spleen every time."],
         ["Rationing analgesia","Delaying opioids, asking for proof of pain, or labelling the patient as drug-seeking — identified by the APPG 2021 inquiry as a pattern contributing to avoidable deaths."],
         ["Pethidine","Still occasionally requested by habit — NICE CG143 says do not offer it."],
         ["Treating fever as viral at home","Fever in hyposplenism needs same-day assessment even on penicillin."],
         ["Iron for anaemia","Anaemia in SCD is haemolytic; iron can worsen overload in transfused patients. Check ferritin first."],
         ["Lapsed monitoring","Hydroxycarbamide without FBC monitoring, or penicillin and vaccines drifting in adolescence."],
         ["Assuming trait is harmless for every decision","Trait matters for partner testing and, under UKMEC 2025, for CHC choice."],
         ["Outdated drug lists","Crizanlizumab and voxelotor have been withdrawn in the UK — do not initiate them or refer patients expecting to start them; anyone still taking either needs urgent specialist discussion before any change."],
         ["Routine IV fluids or overhydration","Can be harmful, particularly in acute chest syndrome, renal disease, pregnancy or cardiac disease. Encourage normal oral hydration; IV fluids are hospital-led."]
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only — the Casebook keeps the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 22-year-old man with HbSS phones: he has had leg and back pain for two days, taking his usual codeine and ibuprofen, and asks for ‘something stronger’. He mentions a cough since last night. He has previously had a bad experience in ED, where he felt he was treated as a drug seeker, and wants to avoid hospital."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Takes the pain at face value and asks for the pain score and what has been taken; spots the cough as a possible acute chest syndrome and checks fever, breathlessness and SpO₂; explains clearly why today needs hospital, not a stronger prescription; acknowledges the previous ED experience and offers a written handover and a call to the haemoglobinopathy team; safety-nets; checks penicillin and hydroxycarbamide adherence at follow-up. <a href='../../cases/anaemia.html'>Open the anaemia casebook chapter →</a>"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every recommendation on this page is traceable to a named source. Status checked September 2026.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE CG143 — Sickle cell disease: managing acute painful episodes in hospital (2012; 2023 surveillance: no update needed)</b><br><a href="https://www.nice.org.uk/guidance/cg143" rel="noopener">nice.org.uk/guidance/cg143</a><span class="rd"> — analgesia within 30 minutes, no pethidine, strong opioid boluses, PCA, individualised care plans, acute chest syndrome awareness</span></li>'+
         '<li><b>NICE QS58 — Sickle cell disease quality standard (2014)</b><br><a href="https://www.nice.org.uk/guidance/qs58" rel="noopener">nice.org.uk/guidance/qs58</a><span class="rd"> — timely assessment and analgesia, reassessment every 30 minutes, opioid monitoring, acute chest syndrome, discharge information</span></li>'+
         '<li><b>RCEM — Management of acute presentations of sickle cell disease in the ED (best practice guideline, v3.2, 2024)</b><span class="rd"> — ED best-practice standard (not a NICE quality standard): 15-minute analgesia target, 1-hour complication decision, 30-minute specialty review</span></li>'+
         '<li><b>BSH — Guidelines for the use of hydroxycarbamide in children and adults with SCD (Qureshi et al., Br J Haematol 2018;181:460–475)</b><br><a href="https://doi.org/10.1111/bjh.15235" rel="noopener">doi.org/10.1111/bjh.15235</a><span class="rd"> — indications (children from 9 months), genotype-specific evidence, contraception for both sexes, consider stopping pre-conception</span></li>'+
         '<li><b>RCOG Green-top Guideline 61 — Management of sickle cell disease in pregnancy (2011)</b><span class="rd"> — stopping hydroxycarbamide at least 3 months before conception commonly advised (individualise with BSH 2021)</span></li>'+
         '<li><b>BSH — Guideline on the management of acute chest syndrome in SCD (Howard et al., Br J Haematol 2015;169:492–505)</b><br><a href="https://doi.org/10.1111/bjh.13348" rel="noopener">doi.org/10.1111/bjh.13348</a></li>'+
         '<li><b>BSH — Guidelines on red cell transfusion in SCD, Part I and Part II (Davis et al., Br J Haematol 2016/2017)</b><br><a href="https://doi.org/10.1111/bjh.14383" rel="noopener">doi.org/10.1111/bjh.14383</a> (Part II)<span class="rd"> — stroke (HbS &lt;30%), sequestration, red cell aplasia; urological treatment of priapism not delayed for transfusion</span></li>'+
         '<li><b>BSH — Management of SCD in pregnancy (Br J Haematol 2021)</b><br><a href="https://doi.org/10.1111/bjh.17671" rel="noopener">doi.org/10.1111/bjh.17671</a><span class="rd"> — balance risks of stopping vs continuing hydroxycarbamide in severe disease; individualised contraception</span></li>'+
         '<li><b>BSH — Prevention and treatment of infection in patients with an absent or hypofunctional spleen (Br J Haematol 2024)</b><br><a href="https://doi.org/10.1111/bjh.19361" rel="noopener">doi.org/10.1111/bjh.19361</a><span class="rd"> — risk-stratified antibiotic prophylaxis; urgent admission and parenteral antibiotics for infection despite prophylaxis</span></li>'+
         '<li><b>UKHSA Green Book</b> (check the live version at every review) — <a href="https://www.gov.uk/government/publications/immunisation-of-individuals-with-underlying-medical-conditions-the-green-book-chapter-7" rel="noopener">ch.7</a> (underlying medical conditions: asplenia/splenic dysfunction), <a href="https://www.gov.uk/government/publications/pneumococcal-the-green-book-chapter-25" rel="noopener">ch.25</a> (pneumococcal; PCV20 and 5-yearly re-immunisation for asplenia/splenic dysfunction), <a href="https://www.gov.uk/government/publications/meningococcal-the-green-book-chapter-22" rel="noopener">ch.22</a> (meningococcal), <a href="https://www.gov.uk/government/publications/influenza-the-green-book-chapter-19" rel="noopener">ch.19</a> (influenza), <a href="https://www.gov.uk/government/publications/covid-19-the-green-book-chapter-14a" rel="noopener">ch.14a</a> (COVID-19)</li>'+
         '<li><b>Sickle Cell Society / UK Forum on Haemoglobin Disorders — Standards for the clinical care of adults with SCD in the UK (2nd ed., 2018)</b> and <b>Sickle cell disease in childhood: standards and recommendations for clinical care (3rd ed., 2019)</b></li>'+
         '<li><b>NHS Sickle Cell and Thalassaemia Screening Programme</b> — antenatal screening by 10 weeks with the family origin questionnaire; newborn blood spot screening</li>'+
         '<li><b>NICE TA743 (crizanlizumab, 2021) — withdrawn</b> after MHRA revoked the UK marketing authorisation (10 January 2024); <b>NICE TA981 (voxelotor, 2024) — withdrawn</b> after global market withdrawal (25 September 2024) and MHRA recall<br><a href="https://www.nice.org.uk/guidance/ta743" rel="noopener">nice.org.uk/guidance/ta743</a> · <a href="https://www.nice.org.uk/guidance/ta981" rel="noopener">nice.org.uk/guidance/ta981</a></li>'+
         '<li><b>NICE TA1044 — Exagamglogene autotemcel for treating severe sickle cell disease in people 12 years and over</b><br><a href="https://www.nice.org.uk/guidance/ta1044" rel="noopener">nice.org.uk/guidance/ta1044</a><span class="rd"> — specialist gene-editing therapy for selected patients</span></li>'+
         '<li><b>APPG on Sickle Cell and Thalassaemia — ‘No One’s Listening’ (November 2021)</b></li>'+
         '<li><b>NICE NG43 — Transition from children’s to adults’ services (2016)</b><br><a href="https://www.nice.org.uk/guidance/ng43" rel="noopener">nice.org.uk/guidance/ng43</a></li>'+
         '<li><b>CoSRH (formerly FSRH) — UKMEC 2025</b> — SCD: CHC category 2 (assess individual thrombotic and cardiovascular risk); sickle cell trait: small VTE risk increase, no category assigned, prioritise methods other than CHC</li>'+

  foot:"Sickle cell disease in primary care, children and adults — NICE CG143 and QS58, RCEM 2024, BSH hydroxycarbamide (2018), acute chest syndrome (2015), transfusion (2016) and pregnancy (2021) guidelines, UKHSA Green Book ch.7/19/25/14a, Sickle Cell Society standards (2018 adult, 2019 paediatric), NICE NG43, UKMEC 2025. Acute chest syndrome, stroke, fever/sepsis, sequestration, aplastic crisis and priapism are high-risk presentations: 999 if unstable, otherwise same-day hospital assessment. Follow the patient’s individualised care plan and local haemoglobinopathy protocols, and verify all doses against current product information, the BNF/BNFC and the local protocol before prescribing."
