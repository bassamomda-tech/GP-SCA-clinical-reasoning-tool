  lead:"<div class='mg-layers'><a href='#severe'><b>Red flags</b><small>DVT · ischaemia · MND</small></a><a href='#confirm'><b>Confirm</b><small>True cramp vs the mimics</small></a><a href='#classify'><b>Classify</b><small>Idiopathic vs secondary</small></a><a href='#ladder'><b>Treat</b><small>Stretch · magnesium · (quinine)</small></a></div>",
  quickSub:"If you read nothing else on this page, read these six cards. Every figure traces to the source cited under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ A cold, pale, pulseless, painful leg is not cramp", html:"Rest pain + pallor + cold limb → 999: acute limb ischaemia, with roughly 6 hours to save the limb (amputation follows within 6–12 hours if missed). And calf pain + swelling + recent travel or immobility → same-day DVT assessment (Wells score + D-dimer/USS) — do not diagnose cramp. DVT affects 1–2 per 1000 adults a year and is <b>commonly mistaken for cramp</b>; in pregnancy, calf tenderness is a same-day assessment."},
    {tone:"amber", h:"Stretching is the treatment — 58% fewer cramps", html:"Calf stretches 3× daily and before bed reduce nocturnal cramp frequency by up to 58% (Hallegraeff, BMJ 2012). Prescribe it properly: stand facing a wall, knee straight, heel on the floor, hold 30 seconds each leg. <b>Dorsiflexion during a cramp gives immediate relief.</b> It outperforms every drug on this page and has no safety profile to manage."},
    {tone:"blue", h:"Magnesium is the most commonly missed treatable cause", html:"Hypomagnesaemia is the commonest treatable cause and is found in 40–60% of patients on long-term diuretics — yet it is rarely checked, because magnesium is NOT included in a standard U&amp;E and must be requested specifically. A normal serum level does not exclude total-body (intracellular) depletion, but it is the best available proxy. Magnesium glycinate or citrate 300–400 mg OD (better absorbed than the oxide), 4–6-week trial — dose-reduce and check eGFR in CKD."},
    {tone:"green", h:"Read the drug chart before you prescribe anything", html:"Diuretics (thiazide and loop), statins, beta-agonists, nifedipine, clonazepam withdrawal, alcohol and dialysis all cause cramps. Statin-induced myopathy including cramps affects 5–10% of users and is dose-dependent — CK &gt;10× ULN means stopping the statin regardless of cardiovascular benefit, with rechallenge at a lower dose after 4–6 weeks. Correcting the cause avoids years of unnecessary treatment."},
    {tone:"purple", h:"Quinine: narrow margin, real deaths, mandatory review", html:"Quinine sulfate 200–300 mg at night reduces cramp frequency by only ~27% (Cochrane 2015) and has a narrow therapeutic index — cinchonism (tinnitus, dizziness, visual disturbance), rare but severe thrombocytopenia (platelets &lt;10, and it can occur after months of use), irreversible retinal damage at high cumulative doses, and it is dangerous — potentially fatal — in overdose. The MHRA restricted it to prescription-only in 2010 after fatalities. Only after steps 1–3 fail AND cramps regularly disturb sleep: 4-week trial, stop if no clear benefit, FBC at 3 months, review 3-monthly with a trial stop. Contraindicated in pregnancy, haemolytic anaemia and optic neuritis."},
    {tone:"teal", h:"Restless legs is not cramp — and needs the opposite treatment", html:"RLS affects 5–10% of adults and is commonly misdiagnosed as cramps: an urge to move, worse at rest, evening predominance, and NO muscle hardening. Treatment is entirely different (iron then dopaminergic agents, not stretching and electrolytes) — see the <a href='restless-legs.html'>restless legs protocol</a>. Likewise claudication: pain on walking, reliably reproducible, relieved by standing still rather than sitting — treating that as 'cramp' delays revascularisation."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step is where limbs and lives are lost.",
  pathway:[
    {title:"Exclude serious pathology first", html:"Rest pain + pallor + cold limb → 999 (acute limb ischaemia — 6 hours to save the limb). Calf pain + swelling + recent travel/immobility, or any calf tenderness in pregnancy → same-day DVT assessment (Wells + D-dimer/USS). Cramps + claudication distance &lt;200 m + absent pulses → urgent vascular review (critical ischaemia if rest pain). Cramps + progressive weakness + fasciculations → urgent neurology (MND, peripheral neuropathy). Cramps + severe hypokalaemia (K &lt;2.5 with arrhythmia or paralysis) → 999 or same-day correction.", alert:true},
    {title:"Confirm it is a true cramp", html:"Sudden, painful, involuntary muscle contraction with visible or palpable tightening, calf or foot most commonly, lasting seconds to under 10 minutes, relieved by stretching, tender for hours after. Nocturnal cramps affect 60% of adults over 50; more than 3 per week is clinically significant. Rule out the three mimics: restless legs, peripheral neuropathy, claudication."},
    {title:"Classify — idiopathic or secondary", html:"Screen: electrolytes (magnesium first, then K, Ca, Na), the drug chart, systemic disease (CKD/uraemia, hypothyroidism, diabetes, cirrhosis, PAD), dehydration and overexertion, pregnancy. Examine pulses, lower-limb neurology, calf, muscle bulk, thyroid and fluid status. Most nocturnal cramps in the over-50s are idiopathic — benign but distressing."},
    {title:"Treat the cause, then climb the ladder", html:"1) Correct the cause (magnesium/potassium, stop the culprit drug, treat thyroid/diabetes/CKD). 2) Stretching — 3× daily and before bed. 3) Magnesium 300–400 mg OD for 4–6 weeks. 4) Quinine ONLY if sleep is regularly disrupted and steps 1–3 have failed. 5) Vitamin B complex or vitamin E 400 IU in refractory cases."},
    {title:"Review, and stop what isn't working", html:"4–6 weeks: improving? adherence to stretching? electrolyte results? 3 months on quinine: mandatory review, FBC for thrombocytopenia, cinchonism check, lowest effective dose, stop if not clearly beneficial. Annually: medication review and repeat electrolytes on diuretics or in CKD. As causes are addressed, cramps often settle — avoid indefinite quinine prescribing."}
  ],
  sections:[
    {id:"severe", nav:"Red flags", title:"Red flags — exclude serious pathology first", sub:"Most leg cramps are benign and idiopathic, but several serious conditions present similarly. Exclude before treating symptomatically.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Acute limb ischaemia", html:"<b>Rest pain + pallor + cold limb → 999 — 6 hours to save the limb.</b> Missing acute limb ischaemia causes amputation within 6–12 hours."},
         {tone:"red", h:"🔴 DVT", html:"Calf pain + swelling + recent travel or immobility → same-day DVT assessment (Wells score + D-dimer/USS). Do not diagnose as cramp. DVT affects 1–2 per 1000 adults per year and is commonly mistaken for cramp."},
         {tone:"red", h:"🔴 DVT in pregnancy", html:"Cramps in pregnancy with calf tenderness → same-day DVT assessment — pregnancy is a high-risk state."},
         {tone:"amber", h:"🟠 Critical / severe peripheral arterial disease", html:"Leg cramps + claudication distance &lt;200 m + absent pulses → urgent vascular review; critical ischaemia if there is rest pain."},
         {tone:"amber", h:"🟠 Motor neurone disease / motor neuropathy", html:"Cramps + progressive weakness + fasciculations → urgent neurology referral. MND presents with cramps and fasciculations before weakness in 25% of cases."},
         {tone:"red", h:"🔴 Severe hypokalaemia", html:"Cramps + severe hypokalaemia symptoms (K &lt;2.5 mmol/L with arrhythmia or paralysis) → 999 or same-day electrolyte correction. Hypokalaemia from diuretics or eating disorders causes life-threatening arrhythmias below 2.5 mmol/L."}
       ]}

    {id:"confirm", nav:"Confirm", title:"Confirm the diagnosis — characterise the cramps", sub:"A true muscle cramp is a sudden, painful, involuntary contraction lasting seconds to minutes and relieved by stretching. Distinguish it from the mimics.",
     blocks:[
       {b:"table", head:["Feature","Detail","Implication"], rows:[
         ["<b>True cramp</b>","Sudden onset; calf or foot most common; visible or palpable muscle tightening; lasts &lt;10 min; relieved by stretching; tender for hours afterwards","The diagnosis this page treats"],
         ["<b>Nocturnal cramps</b>","During sleep or on waking. Very common — 60% of adults over 50 (&gt;50 years). Frequency &gt;3/week = clinically significant","Sets the threshold for treatment escalation"],
         ["<b>Exercise-induced</b>","During or immediately after exercise — ask about hydration, electrolyte intake and training volume","Strongly associated with electrolyte depletion through sweat (sodium and magnesium losses greatest)"],
         ["<b>NOT cramp: restless legs</b>","<b>Urge to move, worse at rest, evening predominance, no muscle hardening</b>","A different condition with entirely different treatment — dopamine agonists for RLS vs stretching/electrolytes for cramps. RLS affects 5–10% of adults and is commonly misdiagnosed"],
         ["<b>NOT cramp: peripheral neuropathy or radiculopathy</b>","Burning, tingling, a 'dead' sensation, stocking distribution (neuropathy); dermatomal pain with a root distribution (radiculopathy)","Check HbA1c, B12 and alcohol history. Neuromuscular causes \u2014 peripheral neuropathy, radiculopathy and MND (if weakness or fasciculation) \u2014 are a different pathway"],
         ["<b>NOT cramp: claudication</b>","Pain on walking, reliably reproducible, relieved by standing still (not sitting)","Distinguishing cramp from claudication is critical — treating 'cramps' without investigating claudication delays revascularisation"]
       ]}
     ]},

    {id:"classify", nav:"Classify", title:"Classify — idiopathic versus secondary", sub:"Most cramps are idiopathic. Screen for the secondary causes — many are treatable.",
     blocks:[
       {b:"table", head:["Category","Detail","Action"], rows:[
         ["<b>Idiopathic</b>","No systemic disease, no medication cause, normal examination and bloods. Most nocturnal cramps in adults over 50. Benign but distressing","Conservative management"],
         ["<b>Electrolyte disturbance</b>","Hypomagnesaemia (most common, especially with diuretic use), hypokalaemia, hypocalcaemia, hyponatraemia","Check with bloods — found in 40–60% of patients on long-term diuretics, yet rarely checked"],
         ["<b>Medication-induced</b>","Diuretics (thiazide/loop), statins, beta-agonists, nifedipine, clonazepam withdrawal, alcohol, dialysis","Review the prescription chart. Statin myopathy affects 5–10% of users and is dose-dependent"],
         ["<b>Systemic disease</b>","CKD (uraemia), hypothyroidism, diabetes (peripheral neuropathy component), cirrhosis, peripheral vascular disease","Treat the underlying condition"],
         ["<b>Dehydration / overexertion</b>","Athletes, hot weather, excessive sweating without electrolyte replacement","Hydration and electrolyte strategy"],
         ["<b>Pregnancy</b>","Common in the 2nd and 3rd trimesters — low magnesium and mechanical compression","<b>Manage conservatively; avoid quinine</b>"]
       ]},
       {b:"why", html:"Hypomagnesaemia is the most common treatable cause and is found in 40–60% of patients on long-term diuretics — yet is rarely checked. Statin-induced myopathy (including cramps) affects 5–10% of statin users and is dose-dependent. Identifying secondary causes avoids unnecessary long-term treatment with quinine."}
     ]},

    {id:"exam", nav:"Examination", title:"Targeted examination", sub:"Examination guides whether cramps are idiopathic or secondary to vascular, neurological or systemic disease.",
     blocks:[
       {b:"table", head:["What","How / finding","Means"], rows:[
         ["<b>Peripheral pulses</b>","Palpate femoral, popliteal, dorsalis pedis and posterior tibial. Absent or reduced → vascular disease; ABPI if available","ABI &lt;0.9 = PAD — and in a patient presenting with leg cramps that changes the diagnosis and the whole management pathway"],
         ["<b>Lower-limb neurology</b>","Sensation (light touch, vibration with a 128 Hz tuning fork), reflexes (ankle jerk absent in neuropathy), power. Wasting or fasciculations → MND / motor neuropathy","Ankle-jerk absence with normal vibration sensation localises the neuropathy"],
         ["<b>Calf assessment</b>","Swelling, tenderness, warmth; Homan's sign (poor sensitivity) — if positive, Wells score for DVT","The DVT screen"],
         ["<b>Muscle bulk</b>","<b>Wasting suggests systemic disease, MND or prolonged immobility</b>","Raises the referral threshold"],
         ["<b>Thyroid</b>","<b>Goitre, slow-relaxing reflexes, dry skin, bradycardia → hypothyroidism</b>","<b>Slow-relaxing reflexes are 97% specific for hypothyroidism</b>"],
         ["<b>Fluid status</b>","Skin turgor and mucous membranes → dehydration. Oedema → CKD, cardiac failure, liver disease","Directs the blood panel"]
       ]},
       {b:"why", html:"A normal examination supports idiopathic cramps and avoids unnecessary investigation — which is the other half of this section's value."}
     ]},

    {id:"workup", nav:"Work-up", title:"Investigations — targeted, and specifically requesting magnesium", sub:"A first presentation with significant cramps warrants targeted bloods. Not all patients need investigation — individualise.",
     blocks:[
       {b:"table", head:["Test","When","Interpretation"], rows:[
         ["<b>First-line bloods</b>","U&amp;E (K, Na, creatinine — renal disease and electrolyte disturbance), magnesium (most commonly low), calcium, glucose/HbA1c, TFTs, FBC","Magnesium is NOT included in a standard U&amp;E and must be specifically requested. A normal serum magnesium does not exclude total-body (intracellular) depletion, but it is the best available proxy"],
         ["<b>Creatine kinase (CK)</b>","<b>If on a statin, or with significant post-exertional pain</b>","CK &gt;10× ULN = statin myopathy → stop the statin regardless of cardiovascular benefit; rechallenge at a lower dose after 4–6 weeks"],
         ["<b>Vitamin D</b>","Widespread musculoskeletal symptoms, elderly, housebound, or BMI &gt;30","Correct deficiency"],
         ["<b>B12 / folate</b>","Neuropathy features (tingling, numbness, reduced reflexes), alcohol use, metformin use","Identifies a treatable neuropathy"],
         ["<b>ABPI</b>","Claudication suspected, absent or reduced peripheral pulses, or cardiovascular risk factors","<b>ABI &lt;0.9 = PAD</b>"],
         ["<b>Not routinely needed</b>","MRI or nerve conduction studies if there is no clinical evidence of neurological disease. D-dimer only in low pre-test-probability DVT","Avoids over-investigation"]
       ]},
       {b:"cards", items:[
         {tone:"purple", h:"NG12 criteria that surface here <span class='tw'>2WW</span>", html:"Leg cramps have no NICE NG12 criterion of their own, and this page does not invent one — the cramp itself is a benign symptom and the danger list above is vascular and neurological, not oncological. Two NG12 routes can nevertheless arise from this work-up and should be acted on if they do:<br>• An unexplained lump, or unexplained progressive local pain or swelling in a limb — particularly with a soft-tissue mass — → consider urgent direct-access ultrasound (within 2 weeks) for suspected soft-tissue sarcoma, and a 2-week-wait referral if the ultrasound suggests it or is uncertain. Persistent focal calf swelling that is not DVT and not cramp deserves this thought.<br>• Unexplained bone pain or swelling with an X-ray suggesting bone cancer → 2-week-wait referral (in an adult; very urgent direct-access X-ray within 48 hours in children and young people).<br>Cramp that is actually fixed, progressive, focal limb pain is not cramp — re-examine rather than re-prescribe.", src:"NICE NG12 (updated May 2025) · house rule"}
       ]}
     ]},

    {id:"ladder", nav:"Treat", title:"The treatment ladder — stepwise, cause first", sub:"Treat underlying causes first. For idiopathic and nocturnal cramps, escalate from non-pharmacological to pharmacological. Verify doses in the BNF.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Step 1", title:"Treat the underlying cause", when:"always first", fromLabel:"the highest-yield step",
          html:"Correct electrolytes (magnesium, potassium), review and stop causative medications, and treat hypothyroidism, diabetes and CKD."},
         {step:"Step 2", title:"Stretching exercises", when:"first-line for idiopathic and nocturnal cramps", fromLabel:"most evidence",
          html:"Calf stretches 3× daily and before bed — the most evidence for nocturnal cramps. Dorsiflexion during a cramp provides immediate relief. Physiotherapy referral if needed. Reduces nocturnal cramp frequency by up to 58% (Hallegraeff, BMJ 2012)."},
         {step:"Step 3", title:"Magnesium glycinate or citrate 300–400 mg oral OD", when:"if serum Mg low, or on diuretics", fromLabel:"the preferred drug option",
          html:"Better absorbed than magnesium oxide. Trial for 4–6 weeks. Especially effective if serum magnesium is low or the patient is on diuretics. Caution in CKD — dose-reduce and check eGFR. <b>Magnesium is the preferred pharmacological option for most patients.</b>"},
         {step:"Step 4", title:"Quinine sulfate 200–300 mg at night", when:"regular sleep disturbance AND steps 1–3 failed", fromLabel:"NOT for routine use",
          html:"MHRA warning: only if cramps cause regular sleep disturbance and steps 1–3 have failed. 4-week trial; review at 3 months. Contraindicated in pregnancy, haemolytic anaemia and optic neuritis. Reduces cramp frequency by ~27% (Cochrane 2015) with a narrow therapeutic index — cinchonism (tinnitus, dizziness, visual disturbance) and rare thrombocytopenia; the MHRA restricted quinine to prescription-only in 2010 due to fatalities."},
         {step:"Step 5", title:"Vitamin B complex / vitamin E 400 IU", when:"refractory cases", fromLabel:"before specialist referral",
          html:"Limited evidence but a safe profile — consider in refractory cases before specialist referral."}
       ]},
       {b:"warn", html:"Avoid: quinine in pregnancy · routine quinine use without trialling steps 1–3 first · prolonged quinine without 3-monthly review. Quinine sulfate 200 mg at night has a narrow margin — thrombocytopenia, cinchonism, cardiac and QT effects, and it is dangerous (potentially fatal) in overdose. Review every 3 months and trial a stop periodically to confirm ongoing need."},
       {b:"say", html:"These cramps are usually harmless, and regular calf stretches are the best treatment — they cut how often they happen by more than half. I'd rather not jump to quinine because it has real risks, so let's give the stretches a proper try, check a magnesium level and review your other tablets, and see where we are in a month."}
     ]},

    {id:"lifestyle", nav:"Self-care", title:"Non-pharmacological measures — first-line", sub:"Cheap, safe, and where most of the benefit lives. Two of these are free and frequently never mentioned.",
     blocks:[
       {b:"table", head:["Measure","How","Why"], rows:[
         ["<b>Calf stretching</b>","3 times daily and before bed: stand facing a wall, knee straight, heel on the floor, hold 30 seconds each leg","<b>Reduces frequency by up to 58%</b>"],
         ["<b>Hydration</b>","2 litres of water daily; increase in hot weather or during exercise. Avoid alcohol excess","<b>Alcohol is dehydrating and directly myotoxic</b>"],
         ["<b>Footwear</b>","Supportive footwear with heel support; avoid flat shoes or barefoot walking in recurrent sufferers","Reduces mechanical triggering"],
         ["<b>Bedding adjustments</b>","Untuck the bed sheets at the foot of the bed; elevate the foot of the bed slightly","Tight sheets plantar-flex the ankles and trigger cramps — loose bedding reduces frequency by reducing nocturnal plantar-flexion: a simple, free intervention"],
         ["<b>Exercise warm-down</b>","Gentle stretching after exercise; gradual cool-down; avoid sudden increases in training load","Prevents exercise-induced cramps"],
         ["<b>Dietary electrolytes</b>","Potassium (bananas, avocado, potato), magnesium (nuts, dark chocolate, leafy greens), calcium (dairy, broccoli) — especially if dietary intake is poor","Dietary improvement is more physiological than supplementation and avoids medication side effects"],
         ["<b>Avoid aggravants</b>","<b>Reduce caffeine and alcohol</b>","<b>Both deplete magnesium and cause dehydration</b>"]
       ]}
     ]},

    {id:"monitor", nav:"Monitor", title:"Follow-up, monitoring and safety-netting", sub:"The review exists to stop treatment that isn't working — especially quinine.",
     blocks:[
       {b:"table", head:["When","What","Action"], rows:[
         ["<b>4–6 weeks</b>","Are cramps improving? Check magnesium and electrolyte results. Assess adherence to the stretching programme","Escalate treatment if no benefit; improving with stretching → continue conservative measures"],
         ["<b>At ~4 weeks on quinine</b>","<b>Benefit check</b>","<b>No clear benefit → stop</b>"],
         ["<b>3 months on quinine</b>","Mandatory review: is it still effective? Use the lowest effective dose. Check for cinchonism (tinnitus, visual disturbance). FBC for thrombocytopenia","<b>Stop if not clearly beneficial; trial a stop to confirm ongoing need</b>"],
         ["<b>Annually</b>","Review medication (quinine, statins, diuretics); repeat electrolytes if on diuretics or with CKD; reassess for new cardiovascular or neurological symptoms","<b>If the pattern changes → re-screen for a secondary cause</b>"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"📞 999 safety-net", html:"Sudden cold, pale, pulseless, painful leg → 999 (acute limb ischaemia). Cardiac arrhythmia symptoms with muscle weakness → 999."},
         {tone:"amber", h:"🟠 Same-day", html:"New calf swelling + redness (DVT) · progressive leg weakness or fasciculations · tinnitus or visual changes on quinine."},
         {tone:"amber", h:"💊 Quinine monitoring and counselling", html:"Check FBC at 3 months (thrombocytopenia). Instruct the patient to stop immediately for tinnitus, visual disturbance, or unusual bruising or bleeding. “Keep quinine well away from children — even a small overdose is very dangerous. Take it exactly as prescribed.”"},
         {tone:"blue", h:"🦵 Vascular / neuro script", html:"“Cramp-like calf pain only on walking that eases with rest, or new numbness or weakness — get checked.” “Regular calf stretches are the most effective thing — keep them up even once the cramps settle.”"}
       ]},
       {b:"why", html:"Quinine-induced thrombocytopenia can occur even after months of treatment and can be severe (platelet count &lt;10). Visual toxicity — irreversible retinal damage — occurs at high cumulative doses. Regular review allows early detection. Cramps often improve over months as underlying causes are addressed, so medication can frequently be stopped — avoid indefinite quinine prescribing."}
     ]},

    {id:"loop", nav:"Not improving?", title:"Not improving? Re-think the cause", sub:"Persistent or atypical cramps warrant re-examining the diagnosis.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"1 · Drugs", html:"<b>Re-review for a precipitating medication</b> — diuretics, statins, beta-agonists, nifedipine, alcohol."},
         {tone:"amber", h:"2 · Secondary cause", html:"Electrolytes (magnesium specifically requested), renal and liver disease, thyroid, PAD, neurological signs."},
         {tone:"amber", h:"3 · Right diagnosis?", html:"<b>Claudication, restless legs, dystonia or neuropathy mimicking cramps?</b>"},
         {tone:"amber", h:"4 · Stretching", html:"<b>Has a genuine, sustained stretching regimen actually been tried?</b>"},
         {tone:"amber", h:"5 · Quinine review", html:"<b>On quinine without benefit → stop; consider referral.</b> Reversible causes excluded and conservative measures tried → review quinine or refer."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — who, when, how urgently", sub:"Idiopathic, electrolyte-related, medication-induced and pregnancy-related cramps are managed in primary care.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999", html:"Acute cold, pale, pulseless leg (acute limb ischaemia) · severe hypokalaemia with cardiac arrhythmia."},
         {tone:"red", h:"Same-day", html:"Suspected DVT (Wells ≥2 or high clinical suspicion) · rest pain with absent peripheral pulses."},
         {tone:"amber", h:"Urgent vascular", html:"ABPI &lt;0.9 with claudication symptoms · claudication distance &lt;100 m restricting daily life · non-healing leg ulcer. Urgent referral for critical ischaemia (rest pain, tissue loss) — revascularisation must happen within 6 hours to save the limb."},
         {tone:"amber", h:"Urgent neurology", html:"Progressive weakness + cramps + fasciculations (MND) · rapidly progressive neuropathy."},
         {tone:"blue", h:"Routine", html:"Confirmed PAD for vascular assessment and an exercise programme · refractory cramps despite treatment · diagnostic doubt or atypical features · suspected underlying neurological, vascular or metabolic disease. PAD with ABPI &lt;0.9 benefits from supervised exercise — equivalent to angioplasty for claudication (NEJM 2015) — plus cardiovascular risk reduction."},
         {tone:"green", h:"Primary care", html:"Idiopathic cramps, electrolyte-related cramps, medication-induced cramps and pregnancy-related cramps — manage in primary care."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only — the Casebook keeps the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 68-year-old man asks for “those quinine tablets my friend gets” for calf cramps waking him most nights for three months. He takes bendroflumethiazide and atorvastatin. On direct questioning the calf also aches when he walks to the shops and eases when he stands still. Foot pulses are hard to feel."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Separates <b>nocturnal cramp from the claudication history</b> and does not treat both as cramp; palpates <b>pulses and arranges ABPI</b>, recognising <b>ABI &lt;0.9 = PAD</b> with cardiovascular risk work; reviews the <b>thiazide and statin as contributors</b> and checks <b>magnesium specifically (not assumed to be in the U&amp;E)</b> plus CK; prescribes <b>calf stretching properly</b> (technique, 3× daily and before bed, the 58% figure) and the <b>free bedding change</b>; declines quinine at this stage with the <b>MHRA reasoning</b> stated kindly; and safety-nets <b>acute limb ischaemia and DVT</b> in plain words."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
