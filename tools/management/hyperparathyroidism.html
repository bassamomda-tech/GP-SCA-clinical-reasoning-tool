<script>
MG.render({ snapshot:"summaries/hyperparathyroidism.html",
icon:"\u{1F9B4}",
  title:"Primary hyperparathyroidism",
  eyebrow:"Protocol · assess and manage in one place",
  stemTitle:"Primary hyperparathyroidism: a high calcium with an unsuppressed PTH — check the urine calcium and vitamin D, then think surgery",
  stemSub:"One page for primary hyperparathyroidism (PHPT) in primary care, following NICE NG132. Decide first whether the calcium needs same-day or emergency care. Then confirm the calcium, measure PTH, vitamin D and urine calcium to exclude familial hypocalciuric hypercalcaemia, and assess bones and kidneys. Refer for parathyroid surgery when there are symptoms, end-organ disease or a calcium of 2.85 mmol/L or above, and consider referral for everyone else. Avoid dehydration and review thiazides and lithium.",
  guideline:"NICE NG132 Hyperparathyroidism (primary): diagnosis, assessment and initial management (2019) · Society for Endocrinology emergency guidance: acute hypercalcaemia (2016) · NICE TA117 cinacalcet · cinacalcet, alendronic acid and colecalciferol SPCs",
  reviewed:"15 October 2026",
  nextReview:"15 April 2027",
  meta:[
    {t:"NICE NG132 (2019) · diagnosis, referral, monitoring"},
    {t:"Society for Endocrinology (2016) · acute hypercalcaemia"},
    {t:"SPCs · cinacalcet, bisphosphonates, vitamin D"},
    {t:"Suppressed PTH → not PHPT: think malignancy", tone:"tw"},
    {t:"v1.0 · reviewed Oct 2026", tone:"ok"}
  ],
  lead:"<div class='mg-layers'><a href='#redflags'><b>How urgent?</b><small>symptoms · 3.0 · 3.5</small></a><a href='#confirm'><b>Confirm</b><small>calcium · PTH · urine calcium</small></a><a href='#manage'><b>Refer</b><small>four NG132 features</small></a><a href='#monitor'><b>Not operated</b><small>annual calcium and eGFR</small></a></div>",
  quickSub:"The six points that change what you do today. Each one is traced to a named source under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"Calcium above 3.5 mmol/L, or symptomatic at any level: hospital today", html:"Albumin-adjusted calcium <b>above 3.5 mmol/L</b> → <b>emergency assessment</b>, however well the patient seems. <b>3.0–3.5 mmol/L</b> → <b>same-day</b> clinical assessment or specialist discussion. At any level, vomiting, confusion or drowsiness, dehydration, AKI, or ECG changes or arrhythmia → same-day or emergency assessment. Clinical state and rate of rise matter more than the number."},
    {tone:"cream", h:"Measure PTH when the calcium is raised twice", html:"NICE NG132: measure <b>PTH</b> if albumin-adjusted calcium is <b>2.6 mmol/L or above</b> on two occasions, or <b>2.5 mmol/L or above</b> on two occasions when PHPT is suspected. A random sample is fine, with a calcium taken at the same time. Do not measure ionised calcium. A raised <b>or inappropriately normal</b> PTH with hypercalcaemia suggests PTH-mediated disease."},
    {tone:"amber", h:"Exclude familial hypocalciuric hypercalcaemia with a urine calcium", html:"Measure urine calcium (24-hour urine calcium, or a random calcium:creatinine excretion or clearance ratio). A clearance ratio <b>below 0.01</b> suggests familial hypocalciuric hypercalcaemia (FHH), which does not need surgery, but the tests overlap: interpret after correcting <b>vitamin D</b> deficiency and reviewing thiazides, and discuss borderline results with endocrinology."},
    {tone:"cream", h:"Refer for surgery: four features, and consider everyone else", html:"Refer people with confirmed PHPT to a surgeon with parathyroid expertise if they have <b>symptoms of hypercalcaemia</b>, <b>renal stones</b>, a <b>fragility fracture or osteoporosis</b>, or an albumin-adjusted calcium of <b>2.85 mmol/L or above</b>. Consider referral even without these. Surgery is the only cure."},
    {tone:"blue", h:"Assess bones and kidneys", html:"Once PHPT is confirmed: <b>eGFR</b>, <b>DXA</b> (lumbar spine, hip and distal radius) and a <b>renal tract ultrasound</b>. Consider a bisphosphonate if fracture risk is increased. <b>Cinacalcet</b> is specialist-initiated, for calcium of 2.85 mmol/L or above with symptoms, or 3.0 mmol/L or above, when surgery is unsuitable, declined or unsuccessful."},
    {tone:"amber", h:"Keep hydrated, and review thiazides and lithium", html:"Advise good fluid intake and to seek help early with vomiting or diarrhoea. Review <b>thiazide</b> diuretics and calcium or vitamin D supplements beyond correcting deficiency. Never stop <b>lithium</b> without the prescriber or psychiatry team. Do not restrict dietary calcium."}
  ],
  pathwaySub:"The consultation in five moves. The first decides where the patient goes today.",
  pathway:[
    {title:"Decide how urgent", html:"Above 3.5 mmol/L → emergency. 3.0–3.5 mmol/L → same day. Any level with vomiting, confusion, dehydration, AKI or arrhythmia → same day or emergency. Otherwise continue in primary care."},
    {title:"Confirm and measure PTH", html:"Repeat albumin-adjusted calcium. If 2.6 mmol/L or above twice (or 2.5 or above twice with suspicion), measure PTH with a same-time calcium. Suppressed PTH → not PHPT: look for malignancy and other causes."},
    {title:"Exclude FHH and check vitamin D", html:"Urine calcium, 25-hydroxyvitamin D, U&amp;E and eGFR. Review medicines (thiazides, lithium, supplements) and family history of hypercalcaemia."},
    {title:"Assess end-organ effects", html:"Symptoms, renal stones, fractures. Arrange DXA and renal tract ultrasound at diagnosis (or request through the specialist)."},
    {title:"Refer and plan monitoring", html:"Refer for surgery if any of the four NG132 features; consider referral otherwise. If not operated, annual calcium and eGFR, and DXA every 2–3 years."}
  ],
  sections:[
    {id:"redflags", nav:"Red flags", title:"Red flags: hypercalcaemia that cannot wait", sub:"Most PHPT is mild and found on routine bloods. The level and the patient's state set the urgency.",
     blocks:[
       {b:"table", head:["Albumin-adjusted calcium","Action","Notes"], rows:[
         ["<b>Above 3.5 mmol/L</b>","<b>Emergency hospital assessment</b> (999 if confused, drowsy or arrhythmic)","Risk of arrhythmia and coma, regardless of apparent wellness."],
         ["<b>3.0–3.5 mmol/L</b>","<b>Same-day</b> clinical assessment or specialist discussion","May be tolerated if the rise was gradual, but treatment is often needed."],
         ["<b>Any level with symptoms</b>","Same-day or emergency, by severity","Vomiting, confusion or drowsiness, dehydration, AKI, polyuria with poor intake, ECG changes or arrhythmia."],
         ["<b>Below 3.0 mmol/L, well</b>","Continue in primary care","Repeat and work up as below."]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"red", h:"🔴 Suppressed PTH", html:"Hypercalcaemia with a PTH below the reference range is <b>not PHPT</b>. Think <b>malignancy</b> (including myeloma), granulomatous disease and vitamin D excess. Follow the <a href='../algorithms/hypercalcaemia.html'>hypercalcaemia</a> pathway; refer on a suspected cancer pathway when NG12 criteria are met.", src:"NICE NG132 (2019) · NICE NG12"},
         {tone:"amber", h:"🟠 Parathyroid carcinoma (rare)", html:"Very high calcium (often above 3.5 mmol/L) with a very high PTH, a palpable neck lump or hoarseness → urgent endocrine or endocrine surgery referral.", src:"NICE NG132 (2019)"},
         {tone:"amber", h:"🟠 Renal colic or acute kidney injury", html:"Treat the stone or AKI on the usual pathway, and check calcium in anyone with a renal stone (see <a href='../algorithms/renal-colic.html'>renal colic</a> and <a href='aki.html'>AKI</a>).", src:"NICE NG132 (2019)"},
         {tone:"amber", h:"🟠 Pregnancy", html:"Hypercalcaemia in pregnancy needs urgent endocrine and obstetric advice: maternal and neonatal risks.", src:"NICE NG132 (2019)"}
       ]},
       {b:"why", html:"The same calcium of 3.1 mmol/L can be a well person with long-standing PHPT or a dehydrated, confused person heading for arrhythmia. The number starts the decision; the patient's state finishes it. Malignancy is the commonest cause of hypercalcaemia in people in hospital, and a suppressed PTH is what points there."}
     ]},

    {id:"confirm", nav:"Diagnose", title:"Diagnose: calcium, PTH, urine calcium and vitamin D", sub:"NG132 sets out who to test and how.",
     blocks:[
       {b:"kv", rows:[
         ["Who to test","Symptoms or signs that could be hypercalcaemia (thirst, polyuria, constipation, abdominal pain, fatigue, low mood, cognitive change, bone pain), renal stones, fragility fracture or osteoporosis, and an incidental raised calcium."],
         ["Calcium","Use the laboratory's <b>albumin-adjusted calcium</b>. No need for fasting or an uncuffed sample. Do not measure ionised calcium in primary care."],
         ["PTH","Measure if albumin-adjusted calcium is <b>2.6 mmol/L or above on two occasions</b>, or <b>2.5 mmol/L or above on two occasions</b> with suspected PHPT (normocalcaemic or mild disease). Random sample with a same-time calcium. Do not routinely repeat PTH in primary care."],
         ["Interpreting PTH","Raised or non-suppressed PTH with hypercalcaemia = PTH-mediated. Seek specialist advice if PTH is above the midpoint of the reference range with suspected PHPT, or below the midpoint with calcium 2.6 mmol/L or above. PTH below the lower limit → look for other causes, including malignancy."],
         ["Urine calcium","To distinguish PHPT from <b>FHH</b>: 24-hour urinary calcium, or a random calcium:creatinine excretion ratio, or clearance ratio. Clearance ratio below 0.01 is a clue to FHH, not a diagnosis."],
         ["Vitamin D","Measure <b>25-hydroxyvitamin D</b>. Deficiency raises PTH and confounds urine calcium. Correct deficiency with standard colecalciferol doses, rechecking calcium (see <a href='../algorithms/vitamin-d-deficiency.html'>vitamin D deficiency</a>)."]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"🧪 Other baseline tests", html:"U&amp;E and eGFR, phosphate (often low in PHPT), alkaline phosphatase. Protein electrophoresis and serum free light chains if myeloma is possible.", src:"NICE NG132 (2019)"},
         {tone:"blue", h:"💊 Medicines", html:"Thiazides, calcium and vitamin D supplements beyond replacement, activated vitamin D (alfacalcidol, calcitriol) and lithium all raise calcium or PTH. Review them, but do not stop lithium without the prescriber.", src:"NICE NG132 (2019)"},
         {tone:"cream", h:"🧬 Think genetic", html:"Young age (under 40), family history of hypercalcaemia or endocrine tumours (MEN1, MEN2A), or multigland disease → endocrine referral and possible genetic testing.", src:"NICE NG132 (2019)"},
         {tone:"cream", h:"🩺 Secondary and tertiary", html:"Secondary hyperparathyroidism (raised PTH with low or normal calcium) is usually vitamin D deficiency or CKD. Tertiary (high calcium and PTH) follows long-standing CKD and is managed by renal teams.", src:"NICE NG132 (2019)"}
       ]}
     ]},

    {id:"manage", nav:"Manage", title:"Management: surgery, bones and the non-operated patient", sub:"Parathyroidectomy is the only cure. Primary care confirms, refers, protects bone and monitors.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1", tone:"cream", title:"Assess end-organ effects", when:"PHPT confirmed", fromLabel:"then",
          html:"Ask about symptoms. Arrange <b>DXA</b> of the lumbar spine, hip and distal radius, and a <b>renal tract ultrasound</b>, and check eGFR. NICE NG132 does not require routine annual 24-hour urine calcium or repeated renal ultrasound."},
         {step:"2", tone:"amber", title:"Refer for parathyroid surgery", when:"any of the four features", fromLabel:"if not referred, or awaiting surgery",
          html:"<b>Symptoms of hypercalcaemia</b> · <b>renal stones</b> · <b>fragility fracture or osteoporosis</b> · albumin-adjusted calcium <b>2.85 mmol/L or above</b> → refer to a surgeon with parathyroid expertise (via endocrinology where that is the local route). <b>Consider referral</b> for everyone else with confirmed PHPT: age under 50 is a factor in shared decision-making. Localisation imaging is for the specialist."},
         {step:"3", tone:"cream", title:"Protect bone", when:"increased fracture risk", fromLabel:"if surgery is unsuitable or declined",
          html:"Consider a <b>bisphosphonate</b> for people with increased fracture risk, alongside the surgical decision. <span class=mg-dose>Usual adult dose: alendronic acid 70 mg once weekly (NICE/SPC; check the SPC, BNF and local formulary; <a href='https://www.medicines.org.uk/emc/search?q=alendronic+acid' target=_blank rel=noopener>SPC: alendronic acid</a>)</span>. Correct vitamin D deficiency first and check renal function (see <a href='osteoporosis.html'>osteoporosis</a>)."},
         {step:"4", tone:"green", title:"Specialist cinacalcet", when:"surgery unsuitable, declined or unsuccessful", fromLabel:"",
          html:"NICE NG132: consider <b>cinacalcet</b> if albumin-adjusted calcium is <b>2.85 mmol/L or above with symptoms</b>, or <b>3.0 mmol/L or above</b> with or without symptoms. <span class=mg-dose>Usual adult dose: 30 mg twice daily, titrated by the specialist (SPC; check the SPC, BNF and local formulary; <a href='https://www.medicines.org.uk/emc/search?q=cinacalcet' target=_blank rel=noopener>SPC: cinacalcet</a>)</span>. It lowers calcium but does not improve bone density. Specialist-initiated; monitor calcium as the specialist advises."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"cream", h:"💧 Self-care", html:"Drink enough to avoid dehydration, especially in hot weather or with vomiting and diarrhoea. Keep a normal dietary calcium intake: restricting it can raise PTH further.", src:"NICE NG132 (2019)"},
         {tone:"amber", h:"🟠 Vitamin D replacement", html:"Replace deficiency, rechecking calcium a few weeks after starting. <span class=mg-dose>Usual adult dose: colecalciferol 800–2,000 units daily for maintenance (NICE/SPC; check the SPC, BNF and local formulary; <a href='https://www.medicines.org.uk/emc/search?q=colecalciferol' target=_blank rel=noopener>SPC: colecalciferol</a>)</span>. Seek advice if calcium rises.", src:"NICE NG132 (2019) · colecalciferol SPC"}
       ]},
       {b:"say", html:"One of the small glands in your neck that controls calcium is overactive, so your calcium runs high. It's usually a single, non-cancerous swelling. It can thin the bones and cause kidney stones, and an operation to remove the gland usually cures it. We'll check your bones and kidneys and talk with a specialist about whether surgery is right for you. In the meantime, drink plenty and keep eating normal amounts of calcium."}
     ]},

    {id:"special", nav:"Special groups", title:"Special groups", sub:"Groups where the default plan changes.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"🤰 Pregnancy and planning pregnancy", html:"Offer parathyroid surgery to women with PHPT who are considering pregnancy. Suspected or confirmed PHPT in pregnancy needs endocrine and obstetric specialist advice; do not start cinacalcet or bisphosphonates in pregnancy.", src:"NICE NG132 (2019)"},
         {tone:"amber", h:"🧠 On lithium", html:"Lithium can cause hyperparathyroidism. Do not stop it: contact the prescriber or psychiatry team and arrange endocrine assessment if hypercalcaemia persists.", src:"NICE NG132 (2019)"},
         {tone:"cream", h:"🧒 Children and young people", html:"Hypercalcaemia in children needs paediatric or endocrine advice; adult thresholds do not apply.", src:"NICE NG132 (2019)"},
         {tone:"cream", h:"🧓 Older and frail people", html:"Surgery is still worth discussing: age alone does not exclude it. If not operated, prioritise hydration, bone protection and falls prevention.", src:"NICE NG132 (2019)"},
         {tone:"blue", h:"🫘 CKD", html:"Raised PTH in CKD is usually secondary. High calcium with high PTH in long-standing CKD suggests tertiary hyperparathyroidism: renal team.", src:"NICE NG132 (2019)"}
       ]}
     ]},

    {id:"monitor", nav:"Follow-up", title:"Monitoring and follow-up", sub:"For people managed without surgery, NG132 sets a minimal schedule.",
     blocks:[
       {b:"table", head:["Test","When","Action"], rows:[
         ["<b>Albumin-adjusted calcium and eGFR</b>","At least yearly","Rising calcium, falling eGFR or new symptoms → revisit surgical referral."],
         ["<b>DXA</b>","At diagnosis and every 2–3 years","New osteoporosis → refer for surgery; consider a bisphosphonate."],
         ["<b>Renal tract ultrasound</b>","At diagnosis; again if a stone is suspected","New stone → refer for surgery."],
         ["<b>On cinacalcet</b>","As the specialist sets","Hypocalcaemia symptoms (tingling, cramps) → check calcium."],
         ["<b>After parathyroidectomy</b>","Per the surgical team's discharge plan","Recurrent symptoms → recheck calcium."]
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer: who, where and how fast", sub:"The urgency comes from the calcium and the patient, the destination from the PTH.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Emergency", html:"Calcium above 3.5 mmol/L; any level with confusion, drowsiness, arrhythmia or severe dehydration.", src:"Society for Endocrinology (2016)"},
         {tone:"red", h:"Same-day assessment or specialist discussion", html:"Calcium 3.0–3.5 mmol/L; vomiting, AKI or polyuria with poor intake.", src:"Society for Endocrinology (2016)"},
         {tone:"amber", h:"Urgent endocrine or endocrine surgery", html:"Suspected parathyroid carcinoma; PHPT in pregnancy.", src:"NICE NG132 (2019)"},
         {tone:"amber", h:"Parathyroid surgeon (via endocrinology where that is the route)", html:"Confirmed PHPT with symptoms, renal stones, fragility fracture or osteoporosis, or calcium 2.85 mmol/L or above; consider for all others. Endocrinology for FHH uncertainty, genetic features or discordant results.", src:"NICE NG132 (2019)"},
         {tone:"green", h:"Stays in primary care", html:"Mild PHPT, informed choice not to have surgery, monitored yearly with DXA every 2–3 years.", src:"NICE NG132 (2019)"}
       ]}
     ]},

    {id:"safety", nav:"Safety-net", title:"Patient information and safety-netting", sub:"Say it, give it in writing, document it.",
     blocks:[
       {b:"say", html:"Call 999 if you become very confused, very drowsy or your heart races irregularly. Contact us the same day if you are being sick and can't keep fluids down, you are very thirsty and passing lots of urine, or you get severe pain in your side or back. Drink plenty, especially when it's hot or you have a stomach bug."},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"📄 Information", html:"NHS: hyperparathyroidism. Society for Endocrinology patient information.", src:"NHS information"},
         {tone:"green", h:"💊 Before new medicines", html:"Tell pharmacists and prescribers about the diagnosis; avoid new thiazides and over-the-counter calcium or high-dose vitamin D without advice.", src:"NICE NG132 (2019)"}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 63-year-old woman on bendroflumethiazide has an adjusted calcium of 2.78 and 2.81 mmol/L, PTH in the upper half of the range and a vitamin D of 22 nmol/L. She had a kidney stone two years ago and her mother 'had a thin-bones fracture'.", src:"NICE NG132 (2019)"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Recognises PTH-mediated hypercalcaemia (inappropriately normal PTH). Checks for <b>red-flag symptoms</b>. Explains the need to correct vitamin D, review the thiazide and measure <b>urine calcium</b> to exclude FHH. Notes the <b>renal stone</b> makes surgical referral indicated. Arranges DXA and renal ultrasound. Advises hydration and safety-nets.", src:"NICE NG132 (2019)"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Every recommendation on this page traces to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG132 — Hyperparathyroidism (primary): diagnosis, assessment and initial management (May 2019)</b><br><a href="https://www.nice.org.uk/guidance/ng132" rel="noopener">nice.org.uk/guidance/ng132</a><span class="rd"> — PTH when calcium 2.6 (or 2.5 with suspicion) mmol/L or above twice, no ionised calcium, urine calcium to exclude FHH, DXA and renal ultrasound, four surgical referral features, cinacalcet thresholds, bisphosphonates, monitoring without surgery, pregnancy</span></li>'+
         '<li><b>Society for Endocrinology — Emergency endocrine guidance: acute hypercalcaemia in adult patients (Endocr Connect 2016)</b><br><a href="https://ec.bioscientifica.com/view/journals/ec/5/5/G9.xml" rel="noopener">ec.bioscientifica.com — acute hypercalcaemia</a><span class="rd"> — severity bands and emergency management</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (2015, updated 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — non-PTH-mediated hypercalcaemia and myeloma</span></li>'+
         '<li><b>SPCs — cinacalcet, alendronic acid, colecalciferol</b><br><a href="https://www.medicines.org.uk/emc" rel="noopener">medicines.org.uk/emc</a><span class="rd"> — doses, contraindications, monitoring</span></li>'+
         '<li><b>NHS — Hyperparathyroidism</b><br><a href="https://www.nhs.uk/conditions/hyperparathyroidism/" rel="noopener">nhs.uk — hyperparathyroidism</a><span class="rd"> — patient information</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Primary hyperparathyroidism in primary care — NICE NG132 (2019), Society for Endocrinology acute hypercalcaemia guidance (2016), NICE NG12 and the cinacalcet, alendronic acid and colecalciferol SPCs. Use the laboratory's albumin-adjusted calcium and reference ranges. Not a substitute for clinical judgement."
});
</script>
