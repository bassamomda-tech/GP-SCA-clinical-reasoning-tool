<script>
MG.render({
  icon:"\u{1F9EC}",
  title:"HIV in primary care (adults)",
  eyebrow:"Protocol · test, link, share care",
  stemTitle:"HIV — test widely, link fast, and check every new prescription",
  stemSub:"The GP's job in HIV is to find it (indicator conditions, seroconversion, opt-out testing), get a new diagnosis into specialist care quickly, and support a person on lifelong antiretroviral therapy (ART). That means U=U, drug interactions, cardiovascular, bone, renal and mental health, vaccines, cervical screening, contraception and pregnancy. Diagnosis confirmation and ART are specialist-led, and monitoring is shared: who does what must be defined in the HIV clinic letter or local shared-care plan.",
  guideline:"BHIVA/BASHH/BIA adult HIV testing 2020 · NICE NG60 (updated 2025) · BHIVA ART 2022 (2025 interim update) · UK PEP 2021 · BASHH/BHIVA PrEP 2025",
  meta:[
    {t:"BHIVA/BASHH/BIA HIV testing 2020"},
    {t:"NICE NG60 · HIV testing (2016, upd. Sep 2025)"},
    {t:"BHIVA ART 2022 · 2025 interim update"},

  ],
  lead:'<div class="mg-layers"><a href="#test"><b>Who to test</b><small>Indicator conditions, prevalence</small></a><a href="#diagnose"><b>Test &amp; result</b><small>Window periods, giving a positive</small></a><a href="#prevent"><b>PEP / PrEP</b><small>72 hours, where to send</small></a><a href="#interactions"><b>Interactions</b><small>Check before every script</small></a></div>',
  glance:[
    {lbl:"Test", val:"4th-gen Ag/Ab", sub:"lab test conclusive at 45 days (BHIVA 2020)"},
    {lbl:"Treatment", val:"ART for all", sub:"specialist-initiated, lifelong"},
    {lbl:"U=U", val:"Undetectable = untransmittable", sub:"sustained undetectable on ART · sexual transmission"},
    {lbl:"PEP", val:"≤72 h", sub:"ideally within 24 h (UK PEP 2021)"},

    {lbl:"Red flag", val:"Seroconversion / AIDS illness", sub:"urgent test, refer or admit"}
  ],
  quickSub:"The five things that prevent harm. Each card names its source; full references are in the Evidence section at the foot of the page.",
  quick:[
    {tone:"red", h:"⚠ Breathless, desaturating on exertion, with dry cough?", html:"In someone with known or possible HIV, think <b>Pneumocystis pneumonia (PCP)</b>. Other AIDS-defining presentations: oesophageal candidiasis, TB, cryptococcal meningitis (headache, fever), cerebral toxoplasmosis (focal neurology), CMV retinitis (visual loss), Kaposi's sarcoma. <b>Same-day admission</b>, and send an HIV test. Source: BHIVA/BASHH/BIA 2020 testing guideline."},
    {tone:"amber", h:"Seroconversion looks like glandular fever", html:"Fever, rash, sore throat, mouth ulcers and lymphadenopathy 2–6 weeks after exposure. A negative 4th-generation laboratory antigen/antibody test is conclusive for that exposure at <b>45 days</b>; an earlier negative test is not yet conclusive, so repeat it at or after 45 days from the exposure. Viral load is very high at this stage, so the person is at their most infectious. Source: BHIVA/BASHH/BIA 2020."},
    {tone:"red", h:"Exposure in the last 72 hours = PEP today", html:"Post-exposure prophylaxis should start <b>as soon as possible, ideally within 24 hours and no later than 72 hours</b>, as a 28-day course. Send the person <b>now</b> to sexual health, or to the ED out of hours. Do not book a routine appointment. Eligibility is decided by the service's risk assessment, so do not delay referral while trying to decide it in primary care, and do not let HIV testing delay PEP assessment or initiation. Source: UK PEP guideline 2021 (BASHH/BHIVA)."},
    {tone:"blue", h:"Every new prescription: run the interaction check", html:"Boosted regimens (<b>ritonavir, cobicistat</b>) interact widely. Examples: <b>simvastatin</b>; inhaled or intranasal <b>fluticasone/budesonide</b>, which can cause Cushing's syndrome; <b>PPIs with rilpivirine or atazanavir</b>; <b>antacids, calcium and iron with integrase inhibitors</b>; St John's wort. Use the University of Liverpool HIV Drug Interactions checker; advice is regimen-specific. Do not stop or alter ART yourself: some interactions need ART changed, withheld or dose-adjusted on specialist advice. Source: University of Liverpool HIV Drug Interactions; BNF/SmPC."},
    {tone:"green", h:"Undetectable = untransmittable", html:"A person living with HIV who is taking ART and has a <b>sustained undetectable viral load</b> has no risk of sexually transmitting HIV. The HIV team should confirm viral suppression and adherence, particularly where treatment has recently started, doses have been missed or treatment has been interrupted. The U=U threshold for sexual transmission is <200 copies/mL; UK clinical practice commonly calls <50 copies/mL undetectable. Separately, as a <b>PEP risk-assessment criterion</b>, UK PEP guidance uses ART for ≥6 months with an undetectable viral load within the last 6 months and good adherence. Say this plainly at diagnosis. It reduces stigma and supports adherence. Source: BHIVA U=U statement; UK PEP guideline 2021."}
  ],
  pathwaySub:"The primary-care path, from suspicion to shared care. The red step is where delay does the most harm.",
  pathway:[
    {title:"Think of it", html:"Indicator condition, seroconversion-type illness, AIDS-defining presentation, risk disclosed, patient requests a test, or a new registration in a high-prevalence area. <b>Offer the test as routine</b>. Pre-test counselling is not required; say what the test is for and that the result will come back to them."},
    {title:"Recognise the unwell patient", html:"Hypoxia on exertion, meningism, focal neurology, visual loss, severe oral or oesophageal candidiasis with weight loss, or suspected TB → <b>same-day admission</b> with HIV testing done in hospital. An exposure within 72 hours → <b>same-day PEP</b>.", alert:true},
    {title:"Test correctly", html:"<b>4th-generation antigen/antibody venous test</b>. Record the date of the last exposure. If the test falls inside the 45-day window, repeat it at or after 45 days from the exposure. A reactive screening test is <b>not a confirmed diagnosis</b>: confirmation follows the laboratory pathway with virology or HIV-service input, not the GP."},
    {title:"Give the result and link to care", html:"Give a confirmed result <b>in person</b> and plainly, with support. <b>Phone the HIV service</b> for every new confirmed diagnosis. Routine linkage follows the local BHIVA service standard (<b>within 2 weeks</b>, BHIVA Standards of Care 2018), but same-day or urgent review is needed if the patient is unwell, pregnant, has suspected seroconversion, an opportunistic infection, a very low CD4 count or significant psychosocial risk. Discuss partner notification, which the HIV/sexual health team leads, and ask about children."},
    {title:"Share care for life", html:"ART is started and monitored by the specialist team, and monitoring is shared as set out in the clinic letter or shared-care plan. The GP records the exact ART regimen (including specialist-supplied and injectable medicines) on the practice system so interaction alerts fire, runs the interaction check on every new drug, and manages CVD, bone, renal and mental health jointly with the HIV team. The GP also keeps vaccinations, <b>HIV-specific cervical screening recall</b> and contraception up to date."}
  ],
  sections:[

    {id:"test", nav:"Who to test", title:"Who to test — normalise the offer", sub:"Late diagnosis drives illness, death and onward transmission, and many late diagnoses follow earlier healthcare contacts where no one offered a test.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Local prevalence decides the routine offer", html:"Diagnosed prevalence among people aged 15–59: <b>high = 2–5 per 1,000</b>, <b>extremely high = ≥5 per 1,000</b>. In these areas, offer an HIV test to everyone <b>registering with a GP</b>. Also offer one to anyone having blood taken who has not had an HIV test in the past 12 months. Use current UKHSA or local-authority surveillance data for the practice locality; do not assume the whole of Greater Manchester has the same prevalence category. Test for indicator conditions everywhere.", src:"NICE NG60 (upd. 2025) · NICE QS157"},
         {tone:"blue", h:"Test anyone, at any prevalence, with", html:"An <b>indicator condition</b> (table below); symptoms of seroconversion; a diagnosis of any STI; a partner with HIV; injecting drug use; sex between men, including their female partners; people from, or whose partners are from, countries of high prevalence; sex workers; and anyone who asks. Offer testing again for people with ongoing risk.", src:"BHIVA/BASHH/BIA 2020 testing guideline"},
         {tone:"blue", h:"Antenatal and other settings", html:"HIV is screened for in every pregnancy (NHS Infectious Diseases in Pregnancy Screening), and testing is routine for everyone attending sexual health (GUM) services. Emergency departments in high-prevalence areas of England run <b>opt-out blood-borne virus testing</b> (HIV, hepatitis B and C) on anyone who has blood taken. GPs will receive results and referrals from this programme.", src:"NHS England ED opt-out BBV testing · BHIVA pregnancy 2025"},
         {tone:"amber", h:"Local pathway (Bolton / Greater Manchester)", html:"Record in the practice version of this protocol: the <b>local diagnosed HIV prevalence category</b>, the <b>named HIV testing service</b>, the <b>direct referral route to the local HIV clinic</b>, the <b>sexual health and PEP telephone route</b>, the <b>out-of-hours ED pathway</b> for PEP, and the <b>local HIV pharmacist</b> contact.", src:"NICE NG60 (upd. 2025) · UK PEP guideline 2021"},
         {tone:"green", h:"Consent and approach", html:"Lengthy pre-test counselling is <b>not required</b>. Explain the test and how the result will reach them, then check they are happy to go ahead. Record the offer and whether it was declined. Normalising the offer (“we offer this test to everyone”) removes the implied judgement.", src:"BHIVA/BASHH/BIA 2020 testing guideline"}
       ]},
       {b:"table", head:["Indicator condition group","Examples — offer an HIV test"], rows:[
         ["<b>AIDS-defining</b>","Pneumocystis pneumonia; oesophageal candidiasis; tuberculosis; Kaposi's sarcoma; cerebral toxoplasmosis; cryptococcal meningitis; CMV retinitis; non-Hodgkin lymphoma; invasive cervical cancer; HIV wasting"],
         ["<b>Respiratory / infection</b>","Bacterial pneumonia, especially recurrent; unexplained fever; mononucleosis-like (glandular-fever-like) illness; hepatitis B or C; any sexually transmitted infection"],
         ["<b>Skin and mouth</b>","Herpes zoster in a younger adult or across several dermatomes; severe or new seborrhoeic dermatitis; severe or treatment-resistant psoriasis; oral candidiasis; oral hairy leukoplakia; recurrent or severe genital herpes or vaginal candidiasis"],
         ["<b>Blood and systemic</b>","Unexplained lymphadenopathy; unexplained weight loss; unexplained leucopenia, lymphopenia or thrombocytopenia; chronic diarrhoea of unknown cause"],
         ["<b>Neurology</b>","Peripheral neuropathy of unknown cause; cognitive impairment or dementia in a younger person; Guillain–Barré syndrome; aseptic meningitis"],
         ["<b>Cancers</b>","Lymphoma; anal cancer or anal intraepithelial neoplasia; high-grade cervical dysplasia; primary lung cancer in a younger person"]
       ]},
       {b:"why", html:"Indicator conditions either define AIDS or carry an undiagnosed HIV prevalence above about 1 in 1,000, which is the level at which testing is cost-effective. Missing the diagnosis would also change how the condition itself is treated. The GP sees many of them first: shingles, seborrhoeic dermatitis, recurrent thrush, unexplained cytopenias and glandular-fever-like illness. Testing at that point is the single highest-yield HIV action in primary care (BHIVA/BASHH/BIA 2020; NICE NG60)."}
     ]},

    {id:"urgent", nav:"Red flags", title:"Red flags — seroconversion and advanced HIV", sub:"Two opposite ends of the illness: very early (highly infectious, easy to mistake for a virus) and very late (low CD4, opportunistic infection).",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Suspected PCP — admit", html:"Progressive exertional breathlessness over weeks, dry cough, fever, and <b>desaturation on exertion</b>, often with a near-normal chest examination. Oral candidiasis is a common clue. Same-day admission.", src:"BHIVA/BASHH/BIA 2020 (AIDS-defining conditions)"},
         {tone:"red", h:"Neurological presentation — admit", html:"Headache with fever or meningism (cryptococcal meningitis), focal deficit or seizure (toxoplasmosis, lymphoma, PML), or new confusion. Treat as a medical emergency.", src:"BHIVA/BASHH/BIA 2020 (AIDS-defining conditions)"},
         {tone:"red", h:"Visual loss, floaters — same day", html:"CMV retinitis in advanced HIV. Refer to same-day ophthalmology and inform the HIV team.", src:"BHIVA/BASHH/BIA 2020 (AIDS-defining conditions)"},
         {tone:"amber", h:"Seroconversion illness", html:"Fever, maculopapular rash, pharyngitis, mouth or genital ulcers, lymphadenopathy, myalgia, sometimes aseptic meningitis. Onset is 2–6 weeks after exposure. Ask about risk in every “glandular fever” with a negative monospot. Send a 4th-generation test <b>and tell the lab it is a query seroconversion</b>. If negative, repeat at or after 45 days from the exposure, and discuss HIV RNA with virology or the HIV service rather than arranging or interpreting it alone.", src:"BHIVA/BASHH/BIA 2020 testing guideline"},
         {tone:"amber", h:"Weight loss, sweats, chronic diarrhoea, TB features", html:"Constitutional symptoms with lymphadenopathy or cytopenias: test for HIV in parallel with the cancer or TB work-up, not after it.", src:"BHIVA/BASHH/BIA 2020 · NICE NG60"},
         {tone:"blue", h:"Exposure within 72 hours", html:"For example condomless anal or vaginal sex, sexual assault, or sharing injecting equipment. PEP is determined by a service-based risk assessment considering the type of exposure, timing, source HIV status and viral load, anatomical site, presence of blood or genital lesions, and local epidemiology. Do not delay referral while trying to decide eligibility in primary care. Refer the <b>same day</b> for PEP assessment.", src:"UK PEP guideline 2021 (BASHH/BHIVA)"}
       ]},
       {b:"warn", html:"<b>A negative HIV test during a seroconversion illness does not exclude HIV.</b> Record the exposure date, repeat the test at or after 45 days from it, and advise condoms and no blood donation meanwhile. The people most likely to transmit HIV are those who are newly infected and undiagnosed."}
     ]},

    {id:"diagnose", nav:"Test & result", title:"Testing, window periods, and giving a positive result", sub:"Use the right test, time it correctly, and deliver a result that the patient will act on.",
     blocks:[
       {b:"table", head:["Test","What it detects","Window / use"], rows:[
         ["<b>4th-generation laboratory test</b> (venous)","p24 antigen + HIV-1/2 antibody","First-line; use where possible. <b>Window period 45 days</b>: a negative test is considered conclusive for that exposure at 45 days, provided there has been no later exposure and no relevant PEP or PrEP issue. If tested earlier, repeat at or after 45 days from the exposure (BHIVA/BASHH/BIA 2020)"],
         ["3rd-generation laboratory antibody test","HIV-1/2 antibody only","<b>Longer window period</b> than a 4th-generation test"],
         ["Point-of-care test / self-test / self-sampling","Mostly antibody only (some combined)","Useful for access and for people unwilling to have venous blood. Window period generally <b>up to 90 days</b>; do not assume the same window as a 4th-generation laboratory test. A reactive result always needs laboratory confirmation"],
         ["HIV RNA (viral load)","Viral genetic material","Not a screening test. Specialist or virology use when acute infection is strongly suspected with a negative serology, and for monitoring on ART. Do not arrange confirmatory HIV RNA or interpret complex confirmatory assays without virology or HIV-service input"],
         ["After PEP","—","Attend the sexual health or PEP service for the recommended follow-up HIV testing schedule (UK PEP 2021); timing depends on the assay and exposure. Do not rely on a GP test alone to close follow-up"],
         ["Recent PEP or PrEP","—","May affect interpretation of any HIV test; seek sexual health or HIV-service advice"]
       ]},
       {b:"ladder", steps:[
         {step:"Before", title:"Know how the result will be given", when:"at the time of testing", html:"Agree how the patient will hear the result and check the contact number. A negative result can usually be given by phone or text with the window-period caveat. Plan to give a reactive or positive result <b>face to face</b>."},
         {step:"Reactive", title:"A reactive screening result", when:"lab rings or reports", fromLabel:"not yet a diagnosis", html:"A reactive laboratory screening test is <b>not a confirmed HIV diagnosis</b>. Do not communicate it as “HIV positive” until the laboratory confirmation pathway is complete. Contact the local HIV service urgently for advice about result handling, confirmatory testing, linkage to care and interim risk advice. A <b>second sample</b> may be requested to confirm the result and exclude a specimen-identification error, but the exact laboratory pathway varies."},
         {step:"Tell", title:"Giving a confirmed positive result", when:"in person, protected time", fromLabel:"the conversation", html:"Give the result early and clearly. Allow silence. Then give the key facts: <b>HIV is treatable</b>; with ART people have a <b>near-normal life expectancy</b>; once the virus is undetectable it <b>cannot be passed on sexually</b>. Check safety, support and suicide risk. Offer written information and a peer-support organisation."},
         {step:"Link", title:"Referral to the HIV service", when:"phone now; routine within 2 weeks", fromLabel:"BHIVA Standards of Care 2018", html:"<b>Phone the HIV service</b> for every new confirmed diagnosis, and refer directly. Routine linkage should occur within the local BHIVA service standard (<b>no later than 2 weeks</b>), but same-day or urgent review is required if the patient is unwell, pregnant, has suspected seroconversion, an opportunistic infection, a very low CD4 count or significant psychosocial risk. The clinic does the baseline CD4 count, viral load and resistance testing, and screens for opportunistic infection. Send the result, symptoms, current medicines (including OTC and herbal remedies), pregnancy status and any safeguarding concern. <b>Confirm the patient attended</b>. Failure to link into care is a recognised loss point."},
         {step:"Then", title:"Partners, children, and the record", when:"same visit or soon after", fromLabel:"often forgotten", html:"Partner notification is led by the HIV or sexual health service. Ask whether the patient has <b>children</b> or other dependants who may need testing. Code HIV and record ART on the GP system with the patient's knowledge, so that <b>interaction alerts work</b>. Many patients worry about who can see their record; explain how it is used."}
       ]},
       {b:"say", html:"“The tests have confirmed that you have HIV. I know that is a lot to take in, so let's take it slowly. The most important thing I want you to hear is that HIV today is a treatable long-term condition. With treatment, people live a normal lifespan, and once the virus is undetectable in your blood you cannot pass it on to partners through sex. I would like to get you seen by the HIV team within the next week or two. What's going through your mind right now?”"}
     ]},

    {id:"prevent", nav:"PEP & PrEP", title:"Prevention — PEP, PrEP, condoms and U=U", sub:"PEP is an emergency. PrEP is a planned prevention method. The GP's job is to recognise when each is needed and send the person to the right service quickly.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"PEP — post-exposure prophylaxis", html:"Start <b>as soon as possible, ideally within 24 h, and no later than 72 h</b>. The course is <b>28 days</b>; the guideline's first-line regimen is tenofovir disoproxil/emtricitabine plus raltegravir. PEP is determined by a service-based <b>risk assessment</b> considering the type of exposure, timing, source HIV status and viral load, anatomical site, presence of blood or genital lesions, and local epidemiology. Do not delay referral while trying to decide eligibility in primary care. Available from sexual health clinics, and from the ED out of hours; keep the local PEP telephone and out-of-hours ED route in the practice protocol.", src:"UK PEP guideline 2021 (BASHH/BHIVA)"},
         {tone:"green", h:"Source partner on ART (PEP risk-assessment criterion)", html:"UK PEP guidance generally does not recommend PEP after condomless sex with a partner with HIV who has been on ART for <b>at least 6 months</b>, has an undetectable viral load within the last 6 months, and reports good adherence. This is a PEP risk-assessment criterion, not the general definition of U=U. The decision depends on source viral load, exposure route and timing, and is made by the PEP service. If there is <b>any doubt</b> about the partner's ART history, adherence or viral load, refer the same day.", src:"UK PEP guideline 2021 (BASHH/BHIVA)"},
         {tone:"amber", h:"PEP follow-up", html:"The sexual health or PEP service sets the follow-up HIV testing schedule; do not rely on a GP test alone to close follow-up. Also: a <b>baseline HIV test</b> before or at PEP initiation where this does not delay treatment; renal function and hepatitis testing as indicated; STI testing and vaccination assessment; pregnancy assessment where relevant; and advice to avoid further exposure and use condoms until follow-up is complete.", src:"UK PEP guideline 2021 (BASHH/BHIVA)"},
         {tone:"blue", h:"PrEP — pre-exposure prophylaxis", html:"Oral <b>tenofovir-emtricitabine</b>, taken daily or event-based. PrEP is <b>prescribed and monitored through sexual health services</b>. Primary care should identify potential need, provide immediate risk advice and refer or signpost promptly. HIV testing is required before starting and at regular intervals; renal function is monitored because of tenofovir disoproxil; hepatitis B status matters before stopping tenofovir-based PrEP; STI screening remains essential; and adherence and dosing strategy need sexual health advice. The 2025 guideline moves away from trial-based eligibility towards <b>individual risk assessment and equity of access</b>, and adds event-based dosing options. Its eGFR threshold (≥60 to start TD-FTC) applies to that regimen within the 2025 guideline and specialist advice.", src:"BASHH/BHIVA PrEP guideline 2025"},
         {tone:"blue", h:"Long-acting injectable PrEP", html:"Long-acting <b>cabotegravir</b> PrEP is recommended by NICE TA1106 for adults and young people (≥35 kg) at high risk of HIV <b>who cannot take oral PrEP</b>. It is initiated and administered through specialist sexual health services, not in primary care. The schedule, oral lead-in or bridging options and missed-injection management must follow the current product information and PrEP service protocol.", src:"NICE TA1106 (Nov 2025)"},
         {tone:"blue", h:"GP role in PrEP", html:"Raise PrEP when someone discloses ongoing risk, is diagnosed with an STI (especially rectal STI or syphilis), has had PEP, or has a partner with HIV who is not suppressed. Give immediate risk advice and refer or signpost to sexual health. The GP is not expected to initiate or monitor routine PrEP unless a formal local shared-care arrangement exists. When a patient on PrEP is prescribed something new, check it against <b>tenofovir</b>: <b>NSAIDs</b> and other nephrotoxic drugs matter.", src:"BASHH/BHIVA PrEP guideline 2025"},
         {tone:"green", h:"U=U and condoms", html:"A partner living with HIV who is taking ART and has a sustained undetectable viral load, confirmed by the HIV team, does not transmit HIV sexually. Condoms still protect against other STIs and pregnancy. U=U applies to sex; it is not guidance on sharing injecting equipment.", src:"BHIVA U=U position statement"}
       ]},
       {b:"warn", html:"<b>Do not make someone wait for PEP.</b> A request for an “HIV test” the day after a condom broke, or after an assault, is a PEP request. Ask when the exposure was, and do not let HIV testing delay PEP assessment or initiation. After sexual assault, also offer referral to a <b>sexual assault referral centre (SARC)</b>, emergency contraception, STI care and safeguarding support."}
     ]},

    {id:"art", nav:"ART basics", title:"Antiretroviral therapy — what the GP needs to know", sub:"The specialist team initiates, changes and monitors ART. The GP needs to know the drug classes (for interactions), the rules, and why ART must not be stopped or altered without HIV-team advice.",
     blocks:[
       {b:"ladder", steps:[
         {step:"All", title:"ART for everyone diagnosed", when:"as soon as possible", html:"Lifelong combination ART is recommended for everyone with HIV <b>regardless of CD4 count</b>. It suppresses viral replication, restores immunity, prevents transmission and gives a near-normal life expectancy. First-line regimen choice is specialist-led and depends on resistance, hepatitis B status, renal function, cardiovascular risk, pregnancy, interactions and patient preference."},
         {step:"Current", title:"First-line ART is specialist-led", when:"BHIVA ART 2022 (2025 interim update)", fromLabel:"changes often", html:"Current first-line ART recommendations are specialist-led and change as the BHIVA guideline is updated. Record the <b>complete current regimen</b>, including injectable treatment, from every clinic letter, and expect regimen changes in your patients. See the <a href='https://www.bhiva.org/hiv-1-treatment-guidelines' rel='noopener'>BHIVA ART 2022 guideline and 2025 interim update</a>."},
         {step:"Inject", title:"Long-acting injectable ART", when:"clinic-administered", fromLabel:"cabotegravir + rilpivirine", html:"Given by injection every 1–2 months in the HIV clinic. The GP system may not show it as a prescription, so <b>record it manually</b>; it still interacts, for example rilpivirine with enzyme inducers. Missed injection visits matter: if the patient is admitted, unwell or has missed an injection, contact the HIV team urgently so treatment continues or a bridging regimen is agreed."},
         {step:"Continue", title:"Do not stop or alter ART without HIV-team advice", when:"including acute illness and admission", fromLabel:"patient safety", html:"Stopping or interrupting ART risks viral rebound, resistance and transmission. <b>Do not stop or alter ART without urgent advice from the HIV team.</b> If the patient is admitted, cannot swallow, is vomiting or nil by mouth, has severe renal or hepatic deterioration, has a serious ART interaction or has missed long-acting treatment, contact the HIV team or HIV pharmacist urgently and ensure uninterrupted treatment or an agreed bridging regimen. Interactions do not always mean changing the new drug: some need ART altered, temporarily withheld or dose-adjusted, or specialist pharmacological advice."},
         {step:"Low CD4", title:"Opportunistic infection prophylaxis", when:"specialist-directed", fromLabel:"advanced HIV", html:"People with a low CD4 count (typically <200 cells/µL) are given prophylaxis, for example co-trimoxazole against PCP, by the HIV team until immune recovery. Repeat prescriptions may pass to the GP; check the stop date with the clinic."}
       ]},
       {b:"why", html:"ART does not cure HIV, but continuous treatment keeps the virus undetectable. The GP's most important ART task is <b>not prescribing a drug that knocks ART levels down</b>, which causes treatment failure and resistance, or one that ART pushes to toxic levels. That is why the interaction section below matters more than knowing the regimens (BHIVA ART 2022, 2025 interim update)."}
     ]},

    {id:"interactions", nav:"Interactions", title:"Drug interactions the GP must check", sub:"Check every new prescription, OTC purchase and supplement. Use the University of Liverpool HIV Drug Interactions checker (hiv-druginteractions.org, free app) and the BNF. If in doubt, phone the HIV pharmacist.",
     blocks:[
       {b:"table", head:["Drug / class","Problem ART","What to do"], rows:[
         ["<b>Statins</b>","Boosted regimens (ritonavir, cobicistat) raise statin levels; risk of myopathy and rhabdomyolysis","<b>Simvastatin is contraindicated</b> with ritonavir or cobicistat. Atorvastatin and rosuvastatin have regimen-specific dose limits; pitavastatin or pravastatin may be preferred in some boosted regimens. Check the exact ART combination in the Liverpool checker before prescribing"],
         ["<b>Inhaled / intranasal / topical (extensive use) / injected, intra-articular and epidural corticosteroids</b>","Ritonavir or cobicistat (CYP3A4 inhibition)","Avoid or seek specialist advice before prescribing <b>fluticasone, budesonide</b> or other CYP3A4-metabolised corticosteroids with ritonavir or cobicistat: this can cause <b>iatrogenic Cushing's syndrome and adrenal suppression</b>. Joint or epidural injections of triamcinolone or methylprednisolone carry the same risk. Beclometasone may be a safer alternative in selected situations, but still check the interaction"],
         ["<b>PPIs / H2 blockers / antacids</b>","<b>Rilpivirine</b> (oral) and <b>atazanavir</b> need gastric acid to be absorbed","<b>PPIs are contraindicated with oral rilpivirine</b>; atazanavir also interacts with PPIs, H2 blockers and antacids. H2 blockers and antacids need timed separation. Long-acting injectable rilpivirine does not have the same gastrointestinal absorption issue. Follow the product-specific interaction advice. Watch for OTC omeprazole purchases"],
         ["<b>Polyvalent cations</b>: antacids, calcium, iron, magnesium, zinc, multivitamins","<b>Integrase inhibitors</b> (dolutegravir, bictegravir, raltegravir) are chelated and absorption falls","Calcium, iron, magnesium, zinc, antacids and multivitamins can reduce absorption. Follow the <b>regimen-specific spacing instructions</b>; taking some supplements with food may alter the advice. Do not use one universal spacing rule for all integrase inhibitors. Remember iron for anaemia and calcium/vitamin D for bones"],
         ["<b>Enzyme inducers</b>: carbamazepine, phenytoin, phenobarbital, rifampicin, <b>St John's wort</b>","Most ART classes, whose levels fall","Risk of ART failure and resistance. Avoid, or seek specialist advice before starting"],
         ["<b>Metformin</b>","Dolutegravir raises metformin levels","Review renal function, monitor gastrointestinal effects and glycaemia, and follow the HIV or pharmacy interaction recommendation. Do not assume the same limit applies to every integrase inhibitor"],
         ["<b>Anticoagulants (DOACs, warfarin)</b>","Boosters and enzyme-inducing ART","Regimen-specific advice is needed: boosters can raise levels, enzyme inducers can reduce them, and some combinations are contraindicated. Check the exact combination before starting AF or VTE treatment"],
         ["<b>Sedatives, opioids, erectile dysfunction drugs, some antipsychotics and antidepressants</b>","Boosters","For example, midazolam, sildenafil and quetiapine levels rise. Check dose and suitability"],
         ["<b>Hormonal contraception and HRT</b>","Enzyme-inducing ART (e.g. efavirenz) and some boosted regimens","See the contraception section. Unboosted integrase inhibitors and rilpivirine generally do not reduce contraceptive efficacy"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Make the record do the work", html:"Hospital-prescribed ART often does not appear on the GP prescribing record, so interaction alerts do not fire. Add ART as a “hospital/specialist-issued” medicine and update it at every clinic letter. Ask the patient which pills they take now."},
         {tone:"amber", h:"Ask about OTC, herbal and recreational drugs", html:"Indigestion remedies, supplements, St John's wort, and recreational drugs used in chemsex (for example MDMA, GHB and ketamine with boosters) all interact. Ask without judgement."}
       ]},
       {b:"why", html:"Fluticasone is the classic example. A boosted protease inhibitor stops the liver breaking fluticasone down, so a “low-dose” inhaler or nasal spray builds up to systemic steroid levels. Patients then present with Cushingoid features, or with adrenal crisis when the inhaler is stopped. The same logic makes simvastatin dangerous. The usual fix is a different co-medication, but some interactions need ART altered, temporarily withheld or dose-adjusted, so seek HIV pharmacist or HIV-team advice rather than changing ART yourself."}
     ]},

    {id:"comorbid", nav:"Comorbidity", title:"Long-term comorbidity — shared care with the HIV team", sub:"People with well-controlled HIV now mostly face the conditions of ageing, often earlier. Care is shared with the HIV team, as set out in the clinic letter or shared-care plan.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Cardiovascular risk — QRISK3 underestimates it", html:"Standard risk tools <b>underestimate CVD risk in people treated for HIV</b>; use clinical judgement when interpreting QRISK3. Manage smoking, blood pressure, diabetes and lipids actively. This does not mean every patient should automatically receive a statin regardless of age or contraindication.", src:"NICE NG238 (2023)"},
         {tone:"red", h:"Statins: review eligibility from age 40", html:"After the REPRIEVE trial, BHIVA rapid guidance supports a statin for <b>primary prevention</b> in many people living with HIV <b>aged 40–75</b>. Review statin eligibility from age 40 using current BHIVA guidance, cardiovascular risk, comorbidity, contraindications, patient preference and ART interactions, with shared decision-making. BHIVA names pitavastatin 4 mg (the trial drug) first-line when available in the UK, with <b>atorvastatin 20 mg</b> as the alternative. <b>Do not prescribe simvastatin with boosted ART</b>; check the current BHIVA statin guidance and the Liverpool interaction checker.", src:"BHIVA rapid guidance on statins (Nov 2023, upd. Mar 2024)"},
         {tone:"amber", h:"Bone health", html:"Fragility fracture and osteoporosis risk is higher in HIV. <b>Tenofovir disoproxil</b> is more strongly associated with renal and bone toxicity than tenofovir alafenamide. Assess fracture risk (FRAX) and vitamin D where clinically indicated. Treat per standard osteoporosis pathways, but avoid indiscriminate calcium supplementation without considering integrase-inhibitor interactions. Involve the HIV team in ART modification where there is osteoporosis or renal disease.", src:"BHIVA monitoring 2016 (2019 interim update)"},
         {tone:"amber", h:"Renal function — read creatinine carefully", html:"Interpret creatinine changes in the context of the ART regimen. <b>Dolutegravir, bictegravir, cobicistat and rilpivirine</b> can cause a benign rise in creatinine through reduced tubular secretion, <b>without necessarily reducing true GFR</b>, whereas <b>tenofovir disoproxil</b> may cause genuine renal tubular toxicity. Tenofovir alafenamide generally causes less renal and bone toxicity, but is not risk-free. Check eGFR and urine protein or albumin, plus phosphate and glycosuria where tenofovir toxicity is suspected. Review NSAIDs and other nephrotoxic drugs. Discuss unexplained or progressive changes with the HIV team.", src:"BHIVA monitoring 2016 (2019 update) · product SmPCs"},
         {tone:"blue", h:"Mental health, cognition and substance use", html:"Depression, anxiety, and alcohol and drug use are more common. Stigma, disclosure fears and past trauma are frequent drivers. Screen, treat, and <b>check antidepressant and antipsychotic interactions</b>. Some ART (for example efavirenz, and dolutegravir in a minority) can cause sleep or mood effects; tell the HIV team. New cognitive decline in a younger person with HIV needs specialist input.", src:"BHIVA ART 2022 (2025 interim update)"},
         {tone:"blue", h:"Cancer and liver", html:"Cervical cancer risk is higher (see screening below), and lung cancer is more common with smoking. <b>Anal cancer:</b> ask about anal pain, bleeding, mass, discharge or change in bowel habit, and refer symptomatic patients urgently through the appropriate pathway. Anal dysplasia or cancer screening follows the current local HIV or anal-neoplasia programme where available; there is no universal national anal screening programme. Hepatitis B and C co-infection are common; screen and vaccinate as advised by the HIV team.", src:"BHIVA monitoring 2016 (2019 interim update)"}
       ]},
       {b:"why", html:"Life expectancy with treated HIV is near-normal, but chronic immune activation and past ART exposure raise cardiovascular, renal, bone and some cancer risks. Smoking rates are also higher. Most of this is standard primary-care chronic disease management, adjusted for interactions and for risk tools that underestimate risk."}
     ]},

    {id:"vaccines", nav:"Vaccines & screening", title:"Vaccination and cervical screening", sub:"Non-live vaccines are safe at any CD4 count, though they may work less well at low counts. Live vaccines depend on the CD4 count and trend, viral load, the specific vaccine and specialist advice.",
     blocks:[
       {b:"table", head:["Vaccine / screen","Recommendation","Note"], rows:[
         ["<b>Live vaccines</b> (MMR, varicella, yellow fever, oral typhoid)","<b>Avoid if CD4 <200 cells/µL</b> or where otherwise contraindicated. If CD4 is ≥200, give only after checking the specific vaccine, viral suppression, current ART, previous immunity, travel risk and current HIV-specialist advice","<b>BCG is not given to people with HIV at any CD4 count.</b> Check with the HIV team before any live vaccine (BHIVA vaccines 2015; Green Book ch.7)"],
         ["<b>Shingles</b>","<b>Shingrix</b> (non-live, 2 doses) is the vaccine used","From 1 Sept 2025, all <b>severely immunosuppressed adults aged 18+</b> are eligible. Check whether the patient meets the Green Book ch.28a definition with the HIV team. Zostavax (live) is no longer the routine UK product"],
         ["<b>Influenza</b>","Annually (inactivated)","Clinical risk group (Green Book ch.19)"],
         ["<b>Pneumococcal</b>","Yes","Clinical risk group (Green Book ch.25); follow the current schedule for immunosuppression"],
         ["<b>Hepatitis B</b>","Screen, then vaccinate if non-immune","Responses are weaker; the HIV team may use higher-dose or extra doses and check anti-HBs"],
         ["<b>Hepatitis A, HPV</b>","By risk","HPV is offered to GBMSM up to 45 years through sexual health services; hepatitis A by risk"],
         ["<b>COVID-19</b>","Per current seasonal programme eligibility","Immunosuppressed groups are prioritised"],
         ["<b>Cervical screening</b>","People with HIV and a cervix need an <b>HIV-specific cervical screening pathway</b> (annual recall where applicable), within the screening age range","Do not apply the routine 3- or 5-year recall without checking current NHS Cervical Screening Programme and BHIVA guidance. Record the HIV-specific annual recall clearly in the clinical system; the practice recalls rather than relying on the patient (NHSCSP colposcopy management, immunosuppressed section)"]
       ]},
       {b:"warn", html:"<b>The cervical screening interval is the most common primary-care failure in HIV care.</b> Under HPV primary screening, most people who test HPV-negative are now recalled at 5 years (for 25–49s since 1 July 2025; 3 years if HPV was positive in the previous 5 years). People with HIV and a cervix need an <b>HIV-specific screening pathway</b>, with annual recall where applicable; check current NHSCSP and BHIVA guidance rather than applying the routine interval. Record it on the recall system at diagnosis, make the local pathway explicit, and check it at every review."}
     ]},

    {id:"repro", nav:"Pregnancy & contraception", title:"Contraception, pregnancy and infant feeding", sub:"Check interactions before prescribing contraception. Pregnancy is managed jointly with the HIV team and obstetrics.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Contraception — method choice with ART", html:"Check the <b>exact ART regimen</b> before prescribing hormonal contraception or emergency contraception. <b>IUDs and depot medroxyprogesterone</b> are generally less affected. <b>Enzyme inducers</b>, particularly efavirenz and some older agents, can reduce the efficacy of <b>implants</b>, pills, patches and rings; offer an unaffected method. Use the current FSRH interaction guidance and the Liverpool checker. Unboosted integrase inhibitors (dolutegravir, raltegravir, bictegravir) and rilpivirine have no clinically significant effect. Check each regimen in the Liverpool checker.", src:"FSRH CEU ART–contraception interactions (Feb 2023)"},
         {tone:"amber", h:"Emergency contraception", html:"The <b>copper IUD</b> is most effective and unaffected by ART. If oral emergency contraception is used with enzyme-inducing ART, FSRH advises a double dose of levonorgestrel (3 mg). Ulipristal is not recommended with enzyme inducers.", src:"FSRH CEU drug interactions with hormonal contraception (2022)"},
         {tone:"blue", h:"Pregnancy", html:"Everyone is screened antenatally. A pregnant person with HIV needs <b>urgent referral to the HIV and antenatal team</b>, and should continue ART. Most people with a suppressed viral load can plan a vaginal birth. ART should not be stopped. Infant prophylaxis and vaccination need specialist planning. The 2025 guideline simplifies this into low-risk and high-risk infant pathways.", src:"BHIVA pregnancy & postpartum guideline 2025"},
         {tone:"green", h:"Infant feeding", html:"The 2025 guideline gives more detailed support for people who choose to <b>breast- or chest-feed</b>. It is supported where the parent has an undetectable viral load and agrees to extra monitoring of parent and infant. The alternative, formula feeding, removes the risk. This is a specialist-supported decision that must follow the current BHIVA pregnancy and postpartum guideline; the GP should not give a simple universal instruction to avoid breastfeeding.", src:"BHIVA pregnancy & postpartum guideline 2025"},
         {tone:"cream", h:"Pre-conception", html:"People planning pregnancy should be virally suppressed. Discuss conception with the HIV team, including U=U for partners, folic acid, and checking ART safety in early pregnancy. In a partner without HIV, PrEP may be relevant if the partner with HIV is not suppressed.", src:"BHIVA pregnancy & postpartum guideline 2025"}
       ]}
     ]},

    {id:"confidential", nav:"Confidentiality & safeguarding", title:"Confidentiality, disclosure and safeguarding", sub:"The patient chooses whom to tell. The doctor's duties to third parties are narrow and specific.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Confidentiality", html:"HIV status is sensitive personal information. Share it with other clinicians who need it for care, which the patient usually expects. Discuss what is coded and who sees it. <b>Employers, insurers and family members</b> do not receive information without explicit consent. Disclosure without consent is exceptional and governed by GMC confidentiality guidance, for example where there is a serious and imminent risk to an identifiable person and the disclosure is justified. Seek HIV-specialist, safeguarding, Caldicott or medico-legal advice where necessary.", src:"GMC Confidentiality: good practice in handling patient information (2017) · GMC Confidentiality: disclosing information about serious communicable diseases (2017)"},
         {tone:"amber", h:"Partners who may be at risk", html:"Partner notification is primarily led by sexual health or HIV services. The GP should encourage engagement, avoid unnecessary disclosure, document discussions and escalate safeguarding concerns. First, <b>encourage and support</b> the patient to tell partners, or use anonymous partner notification through the HIV or sexual health service. The GMC says you <b>may</b> disclose to a known sexual contact at risk if the patient has not told them and cannot be persuaded to. Tell the patient first, do not reveal the patient's identity where practicable, and be ready to justify the decision. Seek advice from a defence body or the HIV team before doing so.", src:"GMC Confidentiality: good practice in handling patient information (2017) · GMC Confidentiality: disclosing information about serious communicable diseases (2017)"},
         {tone:"blue", h:"HIV and the law", html:"U=U and condom use are relevant to reckless-transmission law in England and Wales; the HIV clinical team usually advises. BHIVA's position is that criminalisation does not serve public health. The GP's role is to support disclosure, not to police it.", src:"BHIVA position statement on HIV and the law"},
         {tone:"red", h:"Safeguarding children", html:"<b>Ask about children</b> of every newly diagnosed parent, and about siblings of a child with HIV. Children of parents with HIV should have their HIV status established, however well they appear. This is done through the HIV or paediatric service, not left to chance. A young person with HIV, a child being sexually exploited, or an under-13 with an STI or HIV raises standard safeguarding duties.", src:"BHIVA/CHIVA/BASHH “Don't forget the children” (2009)"}
       ]},
       {b:"why", html:"Children born before a parent's diagnosis can reach adolescence with undiagnosed HIV, and in the UK some have first presented with AIDS-defining illness or died. The consensus guidance followed exactly such deaths. It asks every adult HIV service to test the children of their patients. The GP knows the household and is often best placed to raise it."}
     ]},

    {id:"followup", nav:"Follow-up & refer", title:"Follow-up, monitoring and referral", sub:"The HIV team remains responsible for specialist HIV monitoring, ART decisions, viral load interpretation, CD4-based prophylaxis, treatment failure and complex interactions. Primary care provides shared care: medication reconciliation, interaction checking, vaccinations, screening, cardiovascular, renal, bone and mental health care, contraception and coordination. Responsibilities must be documented in the HIV clinic letter or shared-care plan; do not assume responsibility for specialist HIV monitoring unless explicitly agreed.",
     blocks:[
       {b:"table", head:["What","Who / when","GP action"], rows:[
         ["Viral load","HIV clinic: frequently after starting ART, then typically 6-monthly once stable (BHIVA monitoring 2016, 2019 update). The 2025 ART update revised monitoring frequency, including for long-acting injectables; follow the clinic plan","If the clinic reports detectable virus, look for interactions, vomiting or diarrhoea, and adherence barriers such as mental health, housing or drug use"],
         ["CD4 count","HIV clinic; less often once suppressed and CD4 >200","Low CD4 changes live-vaccine decisions and prophylaxis; check the latest value in clinic letters"],
         ["U&E, eGFR, urine protein, phosphate","HIV clinic, or shared as defined in the clinic letter","Interpret creatinine in light of dolutegravir, bictegravir, cobicistat or rilpivirine (benign rise) versus tenofovir disoproxil (true toxicity); discuss unexplained or progressive change"],
         ["CVD risk, lipids, BP, HbA1c","<b>GP</b>, at least annually from 40","Review statin eligibility from 40 under current BHIVA guidance, with an interaction check; manage risk factors; remember QRISK3 may underestimate risk (NICE NG238)"],
         ["Cervical screening","<b>GP / screening programme</b>, HIV-specific pathway","Check the HIV-specific (annual where applicable) recall is set and recorded"],
         ["Vaccines","<b>GP</b>, flu annually; others by eligibility","Check CD4, viral load and HIV-specialist advice before any live vaccine"],
         ["Medication review","<b>GP</b>, every new drug and at least annually","Interaction check; confirm the ART on record matches the latest clinic letter"],
         ["Mental health, alcohol, smoking","<b>GP</b>, opportunistically","Screen and treat; check interactions"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"Same day / admit", html:"Suspected PCP, meningitis, focal neurology, visual loss, suspected TB with systemic illness, severe dehydration or inability to take ART (contact the HIV team urgently, including for a missed long-acting injection). Exposure within 72 h needs PEP at sexual health or the ED.", src:"UK PEP guideline 2021 · BHIVA/BASHH/BIA 2020"},
         {tone:"blue", h:"HIV service — urgent", html:"<b>Phone for every new confirmed diagnosis.</b> Routine linkage within the BHIVA standard (2 weeks), but same-day or urgent review if unwell, pregnant, suspected seroconversion, opportunistic infection, very low CD4 count or significant psychosocial risk. A pregnant person with HIV. Include medicines, symptoms, pregnancy status and any safeguarding concern.", src:"BHIVA Standards of Care 2018"},
         {tone:"blue", h:"Sexual health / GUM", html:"PEP and PrEP, STI screening, partner notification, and HPV vaccination for GBMSM up to 45.", src:"UK PEP 2021 · BASHH/BHIVA PrEP 2025 · Green Book ch.18a (HPV)"},
         {tone:"blue", h:"HIV pharmacist / clinic advice", html:"Before any interacting prescription, or when the Liverpool checker shows a red or amber interaction and you are unsure about an alternative.", src:"BHIVA ART 2022 (2025 interim update)"}
       ]},
       {b:"say", html:"“Your HIV medicine is working well, and because your virus has stayed undetectable on treatment you can't pass it on through sex. Two things from my side. First, before you start any new medicine, including things from the chemist like indigestion remedies, supplements or nasal sprays, check with us or your pharmacist, because some of them clash with your HIV tablets. Second, you need cervical screening on the HIV schedule, which is usually <em>every year</em>, not every few years. If you get breathless when you walk, a new severe headache, changes in your vision, or you can't keep your HIV tablets down, contact us or the HIV clinic the same day.”"}
     ]},

    {id:"pitfalls", nav:"Pitfalls", title:"Common pitfalls", sub:"Where HIV care goes wrong in general practice.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"Not testing the indicator condition", html:"Treating shingles in a 30-year-old, seborrhoeic dermatitis, recurrent candidiasis or a glandular-fever-like illness without offering an HIV test. Each of these is a missed diagnosis opportunity.", src:"BHIVA/BASHH/BIA 2020 · NICE NG60"},
         {tone:"amber", h:"Falsely reassuring a negative test", html:"A negative 4th-generation laboratory test less than 45 days after exposure is not yet conclusive, and point-of-care and self-tests have longer windows (generally up to 90 days). Repeat after the relevant window, and record the exposure date.", src:"BHIVA/BASHH/BIA 2020 testing guideline"},
         {tone:"red", h:"Calling a reactive screen “HIV positive”", html:"A reactive screening test is not a confirmed diagnosis. Wait for the laboratory confirmation pathway and take HIV-service advice before giving a result.", src:"BHIVA/BASHH/BIA 2020 testing guideline"},
         {tone:"red", h:"Stopping ART without advice", html:"Stopping ART for an interaction, admission or vomiting without urgent HIV-team advice risks rebound and resistance.", src:"BHIVA ART 2022 (2025 interim update)"},
         {tone:"red", h:"Booking a routine appointment for PEP", html:"PEP only works within 72 hours, and works best within 24. Send the patient that day.", src:"UK PEP guideline 2021 (BASHH/BHIVA)"},
         {tone:"red", h:"Prescribing fluticasone or simvastatin with a booster", html:"This is the classic serious interaction. It usually happens when ART is not on the GP record. Record ART and check every new drug.", src:"University of Liverpool HIV Drug Interactions · BNF"},
         {tone:"amber", h:"Default 3- or 5-yearly screening recall", html:"People with HIV and a cervix need the HIV-specific screening pathway (annual recall where applicable). Set the recall.", src:"NHSCSP: Cervical screening programme and colposcopy management (GOV.UK); NHS England recall change 1 July 2025; Rebolj M, et al., BMJ 2022"},
         {tone:"amber", h:"Live vaccine without a CD4 check", html:"Giving live vaccines (MMR, varicella, yellow fever) when the CD4 count is below 200, or above 200 without checking viral load and specialist advice; giving BCG at any CD4 count.", src:"BHIVA vaccines 2015 · Green Book ch.7"},
         {tone:"amber", h:"Forgetting the children", html:"No one asks the newly diagnosed parent whether their children have been tested.", src:"BHIVA/CHIVA/BASHH “Don't forget the children” (2009)"},
         {tone:"amber", h:"Under-treating CVD risk", html:"Relying on a QRISK3 score below 10% and not reviewing statin eligibility from age 40 under current BHIVA guidance.", src:"NICE NG238 · BHIVA statin statement 2023"}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only. The Casebook keeps the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 32-year-old man has a second episode of shingles in a year. The rash is now resolving, and he mentions he has lost weight. He has never had an HIV test and is worried about “what it means” if he has one. A variant: a 40-year-old woman with HIV on a boosted regimen asks for a fluticasone nasal spray for hay fever.", src:"BHIVA/BASHH/BIA 2020 testing guideline"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Recognises recurrent zoster and weight loss as indicator conditions. Offers the test in a normalising way and explores his concerns. Asks about exposure timing and explains the 45-day window. Plans how the result will be given, and safety-nets for red-flag symptoms. In the variant, spots the booster–fluticasone interaction and chooses a safer alternative after checking. <a href='../../cases/hiv.html'>Open the HIV casebook chapter →</a>", src:"BHIVA ART 2022 (2025 interim update)"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Named sources for every recommendation on this page. Status checked September 2026.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>BHIVA/BASHH/BIA — Adult HIV testing guidelines 2020</b><br><a href="https://bhiva.org/clinical-guideline/hiv-testing-guidelines/" rel="noopener">bhiva.org/clinical-guideline/hiv-testing-guidelines</a><span class="rd"> — prevalence strata, indicator conditions, 45-day 4th-generation window period, ED testing, consent</span></li>'+
         '<li><b>NICE NG60 — HIV testing: increasing uptake among people who may have undiagnosed HIV</b> (2016; last updated September 2025)<br><a href="https://www.nice.org.uk/guidance/ng60" rel="noopener">nice.org.uk/guidance/ng60</a><span class="rd"> — testing on GP registration and with blood tests in high/extremely high prevalence areas; use of UKHSA surveillance data (2025 amendment to rec 1.1.1); replaced PH33 and PH34</span></li>'+
         '<li><b>NICE QS157 — HIV testing: encouraging uptake</b> (2017)<span class="rd"> — GP offer on registration and with blood tests in high/extremely high prevalence areas</span></li>'+
         '<li><b>BHIVA guidelines on antiretroviral treatment for adults living with HIV-1 2022 (2025 interim update, October 2025)</b><br><a href="https://www.bhiva.org/hiv-1-treatment-guidelines" rel="noopener">bhiva.org/hiv-1-treatment-guidelines</a><span class="rd"> — ART for all, specialist-led first-line choice, long-acting cabotegravir/rilpivirine, interaction principles</span></li>'+
         '<li><b>BASHH/BHIVA — UK guideline for the use of HIV post-exposure prophylaxis 2021</b><br><a href="https://bhiva.org/clinical-guideline/pep-guidelines/" rel="noopener">bhiva.org/clinical-guideline/pep-guidelines</a><span class="rd"> — 72-hour limit, 28-day course, first-line regimen, risk assessment, source on suppressive ART, post-PEP follow-up testing</span></li>'+
         '<li><b>BASHH/BHIVA — Guidelines on the use of HIV pre-exposure prophylaxis (PrEP) 2025</b> (replaces the 2018 guideline)<br><a href="https://bhiva.org/clinical-guideline/PrEP-guidelines/" rel="noopener">bhiva.org/clinical-guideline/PrEP-guidelines</a><span class="rd"> — specialist-led prescribing and monitoring, risk assessment and equity, event-based dosing options, eGFR ≥60 for TD-FTC</span></li>'+
         '<li><b>NICE TA1106 — Cabotegravir for preventing HIV-1 in adults and young people</b> (November 2025)<br><a href="https://www.nice.org.uk/guidance/ta1106" rel="noopener">nice.org.uk/guidance/ta1106</a><span class="rd"> — long-acting injectable PrEP where oral PrEP cannot be used; schedule per product information and PrEP service</span></li>'+
         '<li><b>BHIVA guidelines for the routine investigation and monitoring of adult HIV-1-positive individuals 2016 (2019 interim update)</b><br><a href="https://bhiva.org/clinical-guideline/monitoring-guidelines/" rel="noopener">bhiva.org/clinical-guideline/monitoring-guidelines</a><span class="rd"> — viral load and CD4 frequency, renal and bone monitoring</span></li>'+
         '<li><b>BHIVA guidelines on the use of vaccines in HIV-positive adults 2015</b> and <b>UKHSA Green Book</b> ch.7 (immunosuppression), ch.19 (influenza), ch.18a (HPV), ch.25 (pneumococcal), ch.28a (shingles)<br><a href="https://bhiva.org/clinical-guideline/vaccination-guidelines/" rel="noopener">bhiva.org/clinical-guideline/vaccination-guidelines</a><span class="rd"> — no live vaccines at CD4 &lt;200, no BCG; Shingrix eligibility for severely immunosuppressed adults 18+ from September 2025</span></li>'+
         '<li><b>BHIVA rapid guidance on the use of statins for primary prevention of CVD in people living with HIV</b> (November 2023, updated March 2024)<span class="rd"> — statins for primary prevention in many people aged 40–75; pitavastatin 4 mg first-line when available, atorvastatin 20 mg as alternative</span></li>'+
         '<li><b>NICE NG238 — Cardiovascular disease: risk assessment and reduction, including lipid modification</b> (2023)<br><a href="https://www.nice.org.uk/guidance/ng238" rel="noopener">nice.org.uk/guidance/ng238</a><span class="rd"> — QRISK3 underestimates risk in people treated for HIV</span></li>'+
         '<li><b>NHS Cervical Screening Programme — Cervical screening: programme and colposcopy management</b> (screening and management of immunosuppressed individuals)<span class="rd"> — HIV-specific screening pathway (annual where applicable); check with BHIVA-specific screening guidance</span></li>'+
         '<li><b>BHIVA guidelines on the management of HIV in pregnancy and the postpartum period 2025</b><br><a href="https://bhiva.org/clinical-guideline/pregnancy-guidelines/" rel="noopener">bhiva.org/clinical-guideline/pregnancy-guidelines</a><span class="rd"> — antenatal screening, infant feeding, simplified infant prophylaxis</span></li>'+
         '<li><b>FSRH CEU Guidance — Drug interactions between HIV antiretroviral therapy and contraception (February 2023)</b>; <b>FSRH CEU — Drug interactions with hormonal contraception (2022)</b><span class="rd"> — method choice with enzyme-inducing ART; emergency contraception</span></li>'+
         '<li><b>BHIVA Standards of Care for people living with HIV 2018</b><span class="rd"> — new diagnoses assessed within 2 weeks</span></li>'+
         '<li><b>BHIVA U=U position statement</b> and <b>BHIVA position statement on HIV, the law and the work of the clinical team</b></li>'+
