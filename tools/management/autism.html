<script>
MG.render({
  icon:"🧠",
  title:"Autism — the complete guide",
  eyebrow:"Protocol · refer promptly on reasonable concern",
  stemTitle:"Do not delay referral when there is reasonable concern about autism — and check hearing without letting it hold up the referral",
  stemSub:"One page for the whole condition: take concerns from parents, carers, school or professionals seriously, recognise features across both diagnostic domains rather than language delay alone, refer to the autism team when there is reasonable concern without waiting for speech, school agreement or a screening-tool result, check hearing without delaying referral, and hold the safety-nets — developmental regression (route by age and type), possible seizures (epilepsy is more common in autistic people, particularly with intellectual disability, regression or a genetic syndrome), and behaviour change that may mean pain, illness or another stressor. Diagnosis is made by an appropriately skilled autism team using developmental history, observation, information from different settings and clinical judgement against ICD-11 or DSM-5 criteria; recognition, referral and support before and after it are primary care.",
  guideline:"NICE CG128 · NICE CG170 · NICE QS51 · NICE CG99 · NICE NG43 · NICE CG142 · ICD-11 / DSM-5 · GMMMG melatonin shared-care protocol",
  reviewed:"10 September 2026",
  nextReview:"10 March 2027",
  meta:[
    {t:"NICE CG128 — autism recognition &amp; referral (under 19s)"},
    {t:"NICE CG170 — autism management (under 19s)"},
    {t:"ICD-11 or DSM-5 criteria · NICE QS51 autism team"},
    {t:"Melatonin — specialist-initiated, GM shared care"},
    {t:"v1.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#severe"><b>Refer promptly</b><small>Reasonable concern</small></a><a href="#confirm"><b>Two domains</b><small>ICD-11/DSM-5 · camouflaging</small></a><a href="#workup"><b>Before referral</b><small>Audiology · red flags</small></a><a href="#ladder"><b>Support</b><small>Sleep · school · family</small></a><a href="#monitor"><b>Annual review</b><small>Needs-led</small></a></div>',
  quickSub:"If you read nothing else on this page, read these six cards. Every number traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Do not delay referral on reasonable concern", html:"NICE CG128: consider referral to the autism team taking account of severity and duration, presence across settings, functional impact, parent/carer concern and alternative diagnoses. Do not delay referral when the history or examination raises reasonable concern, and do not exclude autism because the child is verbal, makes eye contact or has some social skills. If there are insufficient features to justify referral, or the family declines, agree a defined review and safety-net rather than indefinite reassurance, and reconsider referral if concern persists."},
    {tone:"red", h:"Regression — prompt assessment, route by age", html:"Loss of skills already acquired needs prompt clinical assessment; do not automatically attribute it to autism — assess for autism alongside neurological and other medical causes. NICE CG128: <b>under 3 with regression in language or social skills → autism team</b>; <b>over 3 with language regression, or motor regression at any age → paediatrician or paediatric neurologist first</b>, as for seizures, focal neurological signs or other features of an alternative neurological disorder. <b>EEG only where epilepsy or an epileptic encephalopathy (including Landau–Kleffner) is clinically suspected</b> — not routinely."},
    {tone:"amber", h:"Epilepsy is more common — do not assume episodes are autism", html:"Epilepsy is more common in autistic people, particularly with intellectual disability, developmental regression or a genetic syndrome. New episodes of staring, unresponsiveness, unusual movements, falls or convulsions need clinical assessment, with EEG to support the diagnosis where epilepsy is suspected. Duration alone does not distinguish a seizure from autistic disengagement. A convulsion lasting 5 minutes or more is an emergency — give standard seizure first-aid advice."},
    {tone:"blue", h:"Behaviour change — think pain and illness, and beyond", html:"New or worsening distress, aggression or self-injury should trigger assessment for pain or physical illness — constipation, ear infection, dental pain, reflux, UTI — but also for sleep, anxiety or depression, communication needs, sensory or environmental stressors, medication effects, change in routine, and exploitation, abuse or safeguarding concerns (NICE CG170)."},
    {tone:"blue", h:"Both domains — and autism may be missed", html:"Diagnosis needs social communication differences AND restricted, repetitive behaviours, present from the early developmental period, causing clinically significant impact and not better explained by intellectual disability or global developmental delay alone — language delay alone is not autism, and no single feature confirms or excludes it. Autism is common and may be missed, particularly in girls and young people who mask or camouflage difficulties; academic achievement does not exclude it."},
    {tone:"green", h:"Check hearing — without delaying referral", html:"Hearing impairment may mimic or coexist with autism, and NICE CG128 includes hearing and vision information in the assessment. Arrange or check formal hearing assessment where hearing has not been adequately assessed, particularly with language delay, inconsistent response to sound or concern about listening. A neonatal screen does not exclude later-onset or conductive loss such as glue ear. This should not unnecessarily delay referral to the autism team."}
  ],
  pathwaySub:"The whole task in five moves. The first is a referral decision made on suspicion, not certainty.",
  pathway:[
    {title:"Refer on reasonable concern, and screen the urgent patterns", html:"Regression → route by age and type (motor regression, or language regression after age 3 → paediatrics/paediatric neurology first). Possible seizures → urgent clinical assessment, EEG if epilepsy suspected. Otherwise: refer to the autism team, or agree a defined review if features are insufficient.", alert:true},
    {title:"Confirm the pattern spans both domains", html:"Social communication (reduced joint attention, limited social reciprocity, difficulty integrating eye gaze, gesture and facial expression) AND restricted/repetitive behaviours (insistence on sameness, highly focused interests, unusual sensory responses). No single feature confirms or excludes autism."},
    {title:"Arrange audiology and the parallel referrals", html:"<b>Formal hearing assessment where not adequately assessed; SALT; developmental paediatrics; assessment for alternative or coexisting conditions.</b> Ask about siblings and family history. Ask about parent/carer wellbeing and coping."},
    {title:"Start support during the wait", html:"SENCO and needs-based educational support (no diagnosis needed), EHC needs assessment where needs may exceed ordinarily available support, benefits signposting, National Autistic Society, sleep and bowel assessment, and specialist-led melatonin only if a sleep plan fails."},
    {title:"Then hold the annual review", html:"Needs-led by age: growth and nutrition, sleep, bowel and bladder, pain, possible seizures, behaviour and safeguarding, mental health and ADHD, medication, education and social care, family wellbeing, and preparation for adulthood from Year 9."}
  ],
  sections:[

    {id:"severe", nav:"Refer promptly", title:"The referral rule, and the urgent patterns",
     sub:"The GP does not diagnose autism — an appropriately skilled autism team (generally paediatric, speech and language and psychological expertise) does, using developmental history, observation, information from different settings and clinical judgement against ICD-11 or DSM-5 criteria. ADOS-2, ADI-R or other tools may support the assessment but are not mandatory and must not be used alone. The GP recognises the pattern and refers promptly.",
     blocks:[
       {b:"warn", html:"NICE CG128 (2011, updated 2017): do not delay referral when the history or examination raises reasonable concern about possible autism, taking account of severity, duration, presence across settings, functional impact, parent/carer concern and alternative diagnoses. Do not exclude autism because the child is verbal, makes eye contact or has some social skills, and do not wait for speech, school agreement or a screening-tool result. If there are insufficient features to justify referral, or the family prefers not to be referred, agree a defined review and safety-net rather than indefinite reassurance, and reconsider referral if concern persists."},
       {b:"table", head:["Pattern","Meaning","Action"], rows:[
         ["<b>Developmental regression</b> — loss of words, social responses or skills already acquired","Some autistic children have regression, but it is not itself diagnostic and should not automatically be attributed to autism: consider neurological and other medical causes, such as Rett syndrome, epileptic encephalopathy including Landau–Kleffner syndrome, or metabolic disease","Prompt clinical assessment. Under 3 with language or social regression → autism team. Over 3 with language regression, motor regression at any age, seizures, focal neurological signs or features of another neurological disorder → paediatrician or paediatric neurologist first. EEG only if epilepsy or an epileptic encephalopathy is clinically suspected; further investigations are specialist-arranged. Safety-net: contact promptly if skills are lost"],
         ["New episodes of staring, unresponsiveness, unusual movements, falls or convulsions","<b>Epilepsy is more common in autistic people</b>, particularly with intellectual disability, developmental regression or a genetic syndrome; duration alone does not distinguish seizures from autistic disengagement","Urgent clinical assessment; EEG to support the diagnosis where epilepsy is suspected. Standard seizure first aid: a convulsion lasting 5 minutes or more is an emergency"],
         ["<b>Behaviour change</b> — new or worsening distress, aggression or self-injury","Pain or physical illness (constipation, otitis media, dental pain, reflux, UTI), but also sleep, anxiety, communication needs, sensory or environmental stressors, medication effects, change in routine, and exploitation, abuse or safeguarding concerns","<b>Assess for a physical cause before altering any behaviour plan</b>, alongside the other causes. An ABC chart may help as part of a functional assessment"],
         ["<b>Suspected autism with no hearing assessment</b>","Hearing impairment may mimic or coexist with autism; a neonatal screen does not exclude later-onset or conductive loss. Ask about listening and response to sound","Arrange or check formal hearing assessment where hearing has not been adequately assessed, particularly with language delay or inconsistent response to sound — without unnecessarily delaying the autism referral (NICE CG128)"],
         ["<b>Safeguarding concern</b>","Autistic children are at increased risk of abuse and neglect","<b>MASH referral</b>"],
         ["<b>School exclusion or school refusal</b>","<b>Exclusion is disproportionately applied to autistic children</b>","GP letter where helpful, SENCO involvement, EHC needs assessment request if needs may exceed ordinarily available support, mental-health assessment if indicated"]
       ]},
       {b:"dl", rows:[
         ["<b>Neurological red flags</b>","Regression with headache, vomiting, visual symptoms, focal neurological signs or features of raised intracranial pressure → assess through the appropriate urgent paediatric or neurological pathway"]
       ]}
     ]},

    {id:"confirm", nav:"Two domains", title:"ICD-11 / DSM-5 domains, and the presentations that get missed",
     blocks:[
       {b:"dl", rows:[
         ["<b>Both domains are required</b>","Domain A — social communication and interaction deficits. Domain B — restricted, repetitive patterns of behaviour, interests or activities. BOTH are required for diagnosis, together with symptoms present in the early developmental period, clinically significant functional impact, and symptoms not better explained by intellectual disability or global developmental delay alone — considered in the developmental, cultural and language context. Language delay alone is not autism, and no single feature is diagnostic"],
         ["<b>Domain A: joint attention</b>","Possible autism may be suggested by reduced joint attention (pointing or showing to share interest, following a point, response to name), limited social reciprocity, and difficulty integrating eye gaze, gesture and facial expression. No single feature confirms or excludes autism"],
         ["<b>Domain A: social reciprocity</b>","Reduced interest in peers, parallel play without engagement, interaction on the child's own terms. <b>The quality of reciprocity matters more than the frequency of contact.</b> Autism is not shyness — shyness wants social contact but is inhibited; autism is a qualitatively different pattern of social motivation and understanding"],
         ["<b>Domain B</b>","Insistence on sameness (exact routes, orders, bedtime sequences, extreme distress at change), repetitive motor mannerisms, intense narrow special interests, and unusual sensory responses (covering ears, seeking strong input, food texture sensitivity). Parents often describe these as \u201cstrong-willed\u201d or \u201csensitive\u201d rather than as a pattern"],
         ["<b>Eye contact does not decide it</b>","Autistic children often make eye contact with familiar people. Eye contact alone neither confirms nor excludes autism — leading with that question misdirects the whole consultation"],
         ["<b>M-CHAT-R/F</b>","A validated screening tool for 16–30 month olds. NICE CG128 advises against relying on any autism-specific tool alone, so M-CHAT must not be used to exclude autism: a positive result should accelerate referral, never replace it"],
         ["<b>Girls, and the missed presentation</b>","Autism may be missed in girls and other young people who compensate for or camouflage social-communication difficulties. <b>Academic achievement does not exclude autism.</b> Ask about the effort involved in social interaction, exhaustion after school, internalising symptoms, friendship difficulties, rigid interests and differences between school and home. The diagnostic criteria are the same"],
         ["<b>Comorbidity</b>","ADHD, anxiety, depression, OCD, sleep disorders, gastrointestinal symptoms including constipation, feeding difficulties, epilepsy and intellectual disability are more common in autistic people — assess according to clinical need"]
       ]},
       {b:"say", html:"Thank you for coming in — I can hear you have been worried for a while, and I want you to know that parents know their children better than anyone. What you have noticed is the most important information I have. From what you describe there is enough here that Ethan should be assessed properly, and I am making that referral today. I will also arrange a full hearing test — it will not hold up the referral, but hearing problems can look similar and can also happen at the same time."}
     ]},

    {id:"workup", nav:"Before referral", title:"What the GP does before and alongside referral",
     blocks:[
       {b:"table", head:["Action","Detail"], rows:[
         ["<b>Refer to the autism team</b>","When there is reasonable concern — do not wait for certainty, speech therapy, school agreement or a screening-tool result. Shared decision-making with parents throughout, and honest rather than false reassurance. Include parent/carer concerns, developmental milestones, examples from both diagnostic domains, observations across settings, educational reports where available, regression or seizure concerns, relevant medical, perinatal and family history, hearing and vision information, and safeguarding and mental-health concerns"],
         ["<b>Formal hearing assessment</b>","Where hearing has not been adequately assessed, particularly with language delay, inconsistent response to sound or concern about listening. Otitis media with effusion (glue ear) is common and can mimic or coexist with autism. Should not unnecessarily delay the autism referral"],
         ["<b>Speech and language therapy</b>","Refer in parallel — SALT input does not wait for the diagnosis"],
         ["<b>Developmental history</b>","Milestones, regression, birth and perinatal history (prematurity, low birth weight, maternal valproate exposure), family history of autism including any first-degree relative, hearing and vision, sleep, diet and food repertoire, GI symptoms, behaviour at home versus nursery or school"],
         ["<b>Examination</b>","A general physical and neurological examination: growth and nutrition (centiles; food restriction is common), head circumference, dysmorphic features, neurological signs, motor development, hearing and vision, and signs of coexisting medical conditions. Genetic testing is not arranged routinely by the GP because autism is suspected — consider it through the genetics pathway where there are dysmorphic features, congenital anomalies or intellectual disability (NICE CG128)"],
         ["<b>Parent/carer wellbeing</b>","Ask about parent/carer wellbeing, sleep, distress, coping, relationship strain and safeguarding. Use a validated questionnaire if clinically indicated or if it would assist assessment and referral. The health visitor is a key partner in under-5s"],
         ["<b>Do not delay support for the diagnosis</b>","Educational support can be requested before diagnosis and should be based on functional need. SENCO or early-years discussion, nursery or school adjustments, benefits signposting and NAS resources can all start today"]
       ]},
       {b:"why", html:"<b>The waiting period is where primary care adds most value.</b> Autism assessment waits are long, and families frequently receive nothing during them. Everything in the support section below — school adjustments, sleep and bowel assessment, benefits signposting, NAS Earlybird, sibling and parental support — can be accessed according to need without a confirmed diagnosis, and the GP is usually the only professional in contact with the family while they wait."}
     ]},

    {id:"ladder", nav:"Support", title:"Sleep, school, family and the medication rules",
     blocks:[
       {b:"table", head:["Domain","Detail"], rows:[
         ["<b>Sleep</b>","<b>Structured sleep assessment, a sleep plan and a two-week sleep diary FIRST</b> (NICE CG170) — routine, visual bedtime sequence, screen exposure, environmental and sensory factors, anxiety, pain, constipation, medication effects and possible obstructive sleep apnoea. Weighted blankets are not routinely recommended (overheating and suffocation risk). <b>Snoring, witnessed apnoea, choking or significant daytime sleepiness → assess for obstructive sleep apnoea.</b> If problems persist and significantly impair the child or family, discuss specialist referral. <b>Melatonin only after consultation with a specialist experienced in autism or paediatric sleep medicine</b>, in line with current product information and the current Greater Manchester melatonin shared-care protocol (specialist initiation, shared-care requirements and dose framework) — not started by the GP simply because the child is awaiting assessment"],
         ["<b>Constipation</b>","Assess stool frequency and consistency, painful defecation, withholding, soiling, abdominal symptoms and diet, and examine where appropriate. Diagnosis is clinical — abdominal X-ray is not routinely used. Treat according to NICE CG99 (macrogol first-line, dose per the current formulary; lactulose or senna as alternatives, with dietary fibre and fluid). <b>Refer urgently for red flags</b>: abdominal distension, bilious vomiting, severe pain, systemic illness or suspected obstruction. Multifactorial: restricted food repertoire, low fluid intake, sensory issues with toileting, reduced activity, medication. <b>Ask about bowel symptoms at reviews rather than waiting to be told</b> — treating constipation can improve behaviour, sleep and mood"],
         ["<b>School</b>","Advise families that educational support can be requested before diagnosis and should be based on functional need, not the diagnostic label. Encourage discussion with the SENCO or early-years setting. An EHC needs assessment can be requested where needs may require provision beyond ordinarily available support; the local authority decides whether to carry it out, and a GP letter may help. The GP does not need to initiate or manage the EHCP process. Exam accommodations; advocate against exclusion"],
         ["<b>Family finances and support</b>","Families may be eligible for Disability Living Allowance based on the child's care or mobility needs, whether or not a formal autism diagnosis has been made — entitlement is not automatic after diagnosis. Carer's Allowance has separate eligibility criteria. Signpost to GOV.UK, Citizens Advice or a welfare-rights adviser rather than using this page as a benefits guide. Short Breaks (respite). A carer's assessment is a legal entitlement"],
         ["<b>Family and siblings</b>","NAS Earlybird programme; National Autistic Society; local peer support. Siblings — ask specifically at every consultation; they may present with somatic symptoms or school avoidance. Sibs (sibs.org.uk). Relationship strain is common — offer Relate proactively rather than after a crisis"],
         ["<b>ADHD</b>","Assess for ADHD when symptoms are persistent, impairing and present across relevant settings. Follow NICE NG87 and local specialist pathways — see the <a href=\"adhd.html\">ADHD protocol</a>. Medication choice, titration and monitoring should be specialist-led or follow an agreed shared-care arrangement"],
         ["<b>Anxiety and depression</b>","Do not use SSRIs or other antidepressants to treat the core features of autism. If a separate depressive, anxiety or obsessive-compulsive disorder is suspected, assess risk and follow the relevant child and adolescent mental-health pathway, with autism-adapted psychological treatment. In children and young people, medication should generally be initiated with specialist advice and alongside appropriate psychological treatment"]
       ]},
       {b:"warn", html:"Do not prescribe antipsychotics for the core features of autism (NICE CG170). For severe behaviour that challenges, a paediatrician or psychiatrist may consider a time-limited, specialist-led trial after physical, environmental and psychosocial causes have been addressed and psychosocial interventions are insufficient or cannot be delivered because of severity. The target behaviour, outcome measure, dose, duration, monitoring and stopping plan must be documented; review after 3–4 weeks and stop if there is no clinically important response at 6 weeks. Local shared-care arrangements determine whether prescribing can later be transferred. Follow the current specialist letter, SPC and local shared-care protocol for physical and neurological adverse-effect monitoring; new abnormal movements → urgent specialist discussion."},
       {b:"say", html:"How are you both doing in all of this? It is completely normal to feel several things at once — relief that someone is taking it seriously, grief about what it might mean, and worry about the future. Those feelings are all valid and I would rather you said them out loud than carried them. And how are Ethan's brothers and sisters? Sometimes when one child has significant needs the others' feelings get a bit lost, and there is support specifically for them too."}
     ]},

    {id:"monitor", nav:"Annual review", title:"Follow-up, surveillance and the three safety-nets",
     blocks:[
       {b:"table", head:["When","What"], rows:[
         ["<b>6–8 weeks</b>","Referral acknowledged? Hearing assessment arranged where needed? SALT underway? Sleep plan and diary started? Parent/carer wellbeing. SENCO engaged and needs-based support in place? Benefits signposting given? Any regression, possible seizures or behaviour change?"],
         ["<b>3–6 months — the active waiting period</b>","Educational support in place? EHC needs assessment requested if needed? Sleep plan working, or specialist sleep discussion needed? ADHD assessment needed? Behaviour escalation requiring CAMHS? Parental mental health. Family support services accessed (Short Breaks, carer's assessment). Dietitian if the food repertoire is very restricted"],
         ["<b>Post-diagnosis</b>","NAS Earlybird referral. Benefits signposting. Educational support reviewed. Comorbidity assessment according to need — ADHD, anxiety. Genetic counselling if a syndrome is identified. Seizure safety-net. Agree an annual GP review"],
         ["<b>Annual review</b>","Assess according to age and need: physical health, growth and nutrition · sleep · bowel and bladder symptoms · pain and communication of illness · seizures or possible seizure episodes · behaviour and safeguarding · mental health · ADHD or other neurodevelopmental symptoms · medication and adverse effects (melatonin review per the shared-care protocol) · education and social care support · parent/carer and sibling wellbeing · transition planning. Do not perform EEG, genetic testing or specialist investigations routinely in asymptomatic children"],
         ["<b>Transition to adult services</b>","For young people with an EHCP, preparation for adulthood should be addressed from Year 9, usually age 13–14. Transition planning should be individualised (NICE NG43) and cover health, education, employment, housing, social care, relationships and independence. Coordinate the handover, including adult social care and CAMHS-to-adult services, according to local arrangements rather than using age 14 as an automatic referral date"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 Regression — contact us promptly", html:"“If you ever notice Ethan losing skills he already has — words he used to say, social responses he used to make, or movement skills — contact us promptly rather than waiting for the next appointment. Losing skills needs to be checked, not just put down to autism.”"},
         {tone:"red", h:"🔴 New seizures", html:"“Epilepsy is more common in autistic children. Episodes of blank staring or not responding, jerking, unusual movements or a sudden fall — contact us urgently, and <b>call 999 for a fit lasting 5 minutes or more.</b> <b>Do not assume unusual behaviour is just autism.</b>”"},
         {tone:"amber", h:"🟠 Behaviour change = pain first", html:"\u201cIf his behaviour suddenly changes — more distressed, more aggressive, more self-injurious — <b>think about pain or illness</b> — constipation, toothache, earache or a stomach upset can all look like a behaviour problem — as well as sleep, worry, changes in routine or anything that has upset him. Come and see us before changing any behaviour plan.”"},
         {tone:"green", h:"📋 Document these", html:"Referral made, or the reason for a defined review and its date · hearing assessment checked or arranged · regression and seizure safety-nets given · parent/carer wellbeing asked about · benefits signposting given · educational support explained."}
       ]},
       {b:"why", html:"Physical pain in non-verbal autistic children is systematically undertreated because it is attributed to autistic behaviour — producing preventable suffering and the iatrogenic escalation of behaviour management plans that never address the cause. Constipation is frequently missed in this group, and treating it is a low-risk intervention. Equally, staring spells and automatisms may be attributed to autism rather than to seizures, delaying treatment in a population where <b>epilepsy is more common</b>."},
       {b:"say", html:"I know the future feels uncertain. What I can tell you is that autism is a lifelong difference, but it changes enormously with age and the right support — many autistic adults live independently, work, and describe their autism as part of their identity rather than a disease. Autistic burnout from prolonged masking is increasingly recognised in adolescents and adults. The two things that most change how this goes are early diagnosis and early support, and that is exactly what we are putting in place today."}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways",
     blocks:[
       {b:"cards", items:[
         {tone:"green", h:"Family support resources", html:"National Autistic Society (<a href='https://www.autism.org.uk' rel='noopener'>autism.org.uk</a>) and NAS EarlyBird · Sibs (<a href='https://www.sibs.org.uk' rel='noopener'>sibs.org.uk</a>) for siblings · Relate for relationship support · GOV.UK, Citizens Advice or a welfare-rights adviser for benefits. These are support resources, not clinical evidence."},
         {tone:"red", h:"Urgent paediatrics / paediatric neurology", html:"<b>Motor regression at any age, language regression after age 3, focal neurological signs or suspected epileptic encephalopathy.</b> Regression of language or social skills under 3 → autism team. EEG only where epilepsy is clinically suspected."},
         {tone:"red", h:"Urgent paediatric neurology", html:"Suspected seizures (staring or unresponsive episodes, unusual movements, convulsions or unexplained falls) — urgent clinical assessment and EEG to support diagnosis. Convulsion lasting 5 minutes or more → emergency care. Safeguarding concerns → local safeguarding pathway."},
         {tone:"amber", h:"Autism assessment service", html:"Refer on reasonable concern — do not wait for speech therapy, certainty, school agreement or a screening-tool result. Diagnosis is by an appropriately skilled autism team (NICE QS51); ADOS-2, ADI-R or other tools may support it but are not mandatory."},
         {tone:"blue", h:"Hearing assessment and SALT — in parallel", html:"Formal hearing assessment where hearing has not been adequately assessed (NICE CG128), without delaying the referral. SALT, developmental paediatrics and assessment for alternative or coexisting conditions in parallel where indicated."},
         {tone:"blue", h:"CAMHS / paediatric psychiatry", html:"ADHD assessment (NICE NG87 pathway) · severe or escalating behaviour that challenges · suspected depression, anxiety or OCD · sleep problems persisting despite a sleep plan → specialist sleep or paediatric review."},
         {tone:"cream", h:"GP management", html:"Referral and hearing check · developmental history and examination · parent/carer wellbeing · SENCO and needs-based educational support · benefits signposting · sleep plan and shared-care melatonin once specialist-initiated · constipation · needs-led annual review · shared-care monitoring where a specialist has initiated medication. No medication for core autism features; ADHD, anxiety, depression, epilepsy and other comorbidities through their own pathways."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"Parents attend with their 3½-year-old son: 10–15 single words and not combining, does not point to share, rarely looks at other children, extreme distress if a routine changes, lines up toy cars precisely, responds to his name inconsistently. Both sets of grandparents think the parents are worrying unnecessarily and that \u201call boys talk late\u201d. The parents feel guilty about \u201clabelling\u201d him."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"<b>Validates parental expertise before clinical questioning</b>; recognises features in BOTH diagnostic domains rather than treating this as speech delay; <b>does not lead with \u201cdoes he make eye contact?\u201d</b>; refers to the autism team today because there is reasonable concern across both domains; <b>arranges or checks formal hearing assessment without delaying the referral, and says why</b>; <b>encourages SENCO or early-years support without waiting for the diagnosis</b>; addresses the grandparents' stance without dismissing them; <b>gives the regression and seizure safety-nets</b>; and — the step candidates miss — <b>asks about parental wellbeing and signposts benefits advice (DLA is based on care needs, not diagnosis).</b>"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Sources for the recommendations on this page; population prevalence and comorbidity figures are deliberately not quoted.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>NICE CG128 — Autism spectrum disorder in under 19s: recognition, referral and diagnosis<br><a href="https://www.nice.org.uk/guidance/cg128" rel="noopener">nice.org.uk/guidance/cg128</a><span class="rd"> — referral on reasonable concern and watchful waiting where features are insufficient; do not exclude autism for eye contact, verbal ability or social skills; age-specific regression routes; hearing and vision information; diagnosis against ICD-11 or DSM-5 without relying on any autism-specific tool alone; genetic testing where indicated</span></li>'+
         '<li>NICE QS51 — Autism: diagnostic assessment by an autism team<span class="rd"> — team composition and assessment</span></li>'+
         '<li>NICE CG170 — Autism spectrum disorder in under 19s: support and management<br><a href="https://www.nice.org.uk/guidance/cg170" rel="noopener">nice.org.uk/guidance/cg170</a><span class="rd"> — no antipsychotics or antidepressants for core autism features; specialist-led antipsychotic trial for severe behaviour that challenges with review at 3–4 weeks and stopping at 6 weeks if no response; assessment of behaviour change; sleep plan, diary and specialist-led melatonin; autism-adapted psychological interventions</span></li>'+
         '<li>NICE CG99 — Constipation in children and young people<br><a href="https://www.nice.org.uk/guidance/cg99" rel="noopener">nice.org.uk/guidance/cg99</a><span class="rd"> — clinical diagnosis, red flags and treatment</span></li>'+

  foot:"Autism — NICE CG128, CG170, QS51, CG99 and NG43, NICE CG142, ICD-11 / DSM-5 and the GMMMG melatonin shared-care protocol. Do not delay referral when there is reasonable concern; where features are insufficient or the family declines, agree a defined review and safety-net. Check hearing without delaying referral. Diagnosis is made by an appropriately skilled autism team using clinical judgement against ICD-11 or DSM-5 criteria; ADOS-2 and ADI-R are not mandatory. Route regression by age and type; EEG only where epilepsy is suspected. No medication for core autism features; melatonin and antipsychotics are specialist-initiated."
