<script>
MG.render({ snapshot:"summaries/bronchiolitis.html",
  icon:"👶",
  title:"Bronchiolitis",
  eyebrow:"Protocol · children · assess, decide where, and safety-net",
  stemTitle:"Bronchiolitis: a clinical diagnosis, supportive care at home for most, and clear rules for who goes to hospital",
  stemSub:"One page for the infant with a cold that has gone to the chest. NICE NG9 (2015, updated 2021) makes bronchiolitis a clinical diagnosis in children under 2, usually under 1, with a peak in the first year of life. Most babies stay at home with feeding advice and safety-netting. The decisions that matter are spotting the baby who needs 999, recognising the risk factors for severe disease, and not prescribing treatments that do not work. Prevention has changed: since September 2024 pregnant women are offered an RSV vaccine, and nirsevimab protects eligible high-risk and preterm infants.",
  guideline:"NICE NG9 (2015, updated 2021) · NICE NG143 fever in under 5s (2019, updated 2021) · UKHSA Green Book ch. 27a RSV (2025) · Nirsevimab SPC",
  reviewed:"15 October 2026",
  nextReview:"April 2027",
  meta:[
    {t:"NICE NG9 · 2015, updated 2021"},
    {t:"999: apnoea · cyanosis · severe distress · SpO₂ under 92%", tone:"tw"},
    {t:"Green Book ch. 27a · RSV programme"},
    {t:"Reviewed October 2026 · next review April 2027"}
  ],
  lead:"<div class='mg-layers'><a href='#redflags'><b>999 signs</b><small>apnoea, cyanosis, distress</small></a><a href='#diagnose'><b>Diagnose</b><small>clinical, no tests</small></a><a href='#refer'><b>Refer</b><small>feeding, dehydration, risk</small></a><a href='#prevent'><b>Prevent</b><small>maternal vaccine, nirsevimab</small></a></div>",
  quickSub:"Six points that change what you do today. Each one is traced to a named source under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"999: apnoea, central cyanosis, severe distress, low saturations", html:"Refer immediately by <b>999</b> if there is <b>apnoea</b> (observed or reported), the child <b>looks seriously unwell</b> to a healthcare professional, <b>severe respiratory distress</b> (grunting, marked chest recession or a respiratory rate over 70 breaths/minute), <b>central cyanosis</b>, or <b>persistent oxygen saturation under 92%</b> on air (NICE NG9)."},
    {tone:"amber", h:"Consider referral for feeding, breathing rate or dehydration", html:"Consider referral to hospital if the respiratory rate is <b>over 60 breaths/minute</b>, there is difficulty with breastfeeding or <b>inadequate oral fluid intake (50–75% of usual volume)</b>, or <b>clinical dehydration</b>. Weigh this against the risk factors for severe disease and the day of illness (symptoms usually peak between days 3 and 5)."},
    {tone:"blue", h:"Diagnosis is clinical", html:"Coryzal prodrome for 1–3 days, then persistent cough plus either <b>tachypnoea or chest recession</b> and either <b>wheeze or crackles</b>. Under 2 years, most often in the first year, peaking at 3–6 months. Do not routinely do blood tests, chest X-ray or swabs in primary care. Fever over 39°C suggests another diagnosis, such as pneumonia."},
    {tone:"amber", h:"Know who is high risk", html:"Severe disease is more likely with <b>chronic lung disease</b> (including bronchopulmonary dysplasia), <b>haemodynamically significant congenital heart disease</b>, <b>age under 3 months</b>, <b>prematurity</b> (particularly under 32 weeks), <b>neuromuscular disorders</b> and <b>immunodeficiency</b>. Lower your threshold for referral in these babies."},
    {tone:"cream", h:"Do not prescribe what does not work", html:"Do not use <b>salbutamol</b>, ipratropium, adrenaline, <b>systemic or inhaled corticosteroids</b>, montelukast, hypertonic saline or <b>antibiotics</b> for bronchiolitis (NICE NG9). Supportive care is fluids, small frequent feeds and rest. Paracetamol or ibuprofen can be used for distress from fever."},
    {tone:"green", h:"Prevention: maternal RSV vaccine and nirsevimab", html:"Since 1 September 2024, pregnant women are offered an RSV vaccine from <b>28 weeks</b> of pregnancy to protect the baby in the first months of life. Since the 2025–26 season, <b>nirsevimab</b> has replaced palivizumab for eligible high-risk infants and is also offered to babies born <b>before 32 weeks</b>. Check the current Green Book chapter 27a."}
  ],
  pathwaySub:"Five moves. The first two are where babies come to harm.",
  pathway:[
    {title:"Look for the 999 signs", alert:true, html:"Apnoea, looks seriously unwell, grunting, marked recession, respiratory rate over 70, central cyanosis, saturations persistently under 92% on air. Any one → 999."},
    {title:"Confirm it is bronchiolitis", html:"Coryza, then cough with tachypnoea or recession, and wheeze or crackles, in a child under 2. High fever, focal signs or a first wheeze over 1 year old suggest another diagnosis."},
    {title:"Measure and weigh up", alert:true, html:"Respiratory rate, saturations (where you have a suitable probe), heart rate, temperature, hydration and feeding as a proportion of usual. Add risk factors and the day of illness."},
    {title:"Decide where", html:"Feeding 50–75% of usual, dehydration or a rate over 60 → consider referral; lower the threshold for high-risk babies or carers who cannot cope. Otherwise home with supportive care."},
    {title:"Safety-net and prevent", html:"Give written advice on breathing, feeding and nappies, the 999 signs, and the expected course. Advise against smoking near the baby. Check RSV immunisation eligibility for siblings and future pregnancies."}
  ],
  sections:[
    {id:"redflags", nav:"Red flags", title:"Red flags: who needs 999 or the same day", sub:"The baby who stops breathing or tires is the one to find first.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Apnoea", html:"Any observed or reported pause in breathing, particularly in babies under 6 weeks or born prematurely, where apnoea can be the first sign. → <b>999</b>.", src:"NICE NG9 (2015, updated 2021)"},
         {tone:"red", h:"🔴 Severe respiratory distress", html:"Grunting, marked chest recession, nasal flaring with head bobbing, or a respiratory rate over 70 breaths/minute. → <b>999</b>.", src:"NICE NG9 (2015, updated 2021)"},
         {tone:"red", h:"🔴 Central cyanosis or low saturations", html:"Blue lips or tongue, or oxygen saturation <b>persistently under 92%</b> on air in primary care. → <b>999</b>. Pulse oximetry can overestimate saturation in darker skin; do not let a reassuring number override a worrying clinical picture.", src:"NICE NG9 (2015, updated 2021) · MHRA (2024) pulse oximeters"},
         {tone:"red", h:"🔴 Looks seriously unwell", html:"Pale, mottled, floppy, not rousing, or a professional's sense that the child is seriously ill. → <b>999</b>. Use NICE NG143 traffic-light features for fever.", src:"NICE NG9 · NICE NG143 (2019, updated 2021)"},
         {tone:"amber", h:"🟠 Feeding, dehydration or tachypnoea", html:"Respiratory rate <b>over 60</b>, oral intake <b>50–75% of usual</b> or difficulty breastfeeding, or clinical dehydration (dry mucous membranes, reduced wet nappies) → <b>consider same-day referral</b> to paediatrics, taking risk factors into account.", src:"NICE NG9 (2015, updated 2021)"},
         {tone:"amber", h:"🟠 High-risk babies and carers", html:"Chronic lung disease, significant congenital heart disease, age under 3 months, prematurity (particularly under 32 weeks), neuromuscular disorders or immunodeficiency; or carers who cannot manage, distance from hospital, or presentation early in the illness → lower threshold for same-day referral.", src:"NICE NG9 (2015, updated 2021)"}
       ]},
       {b:"why", html:"Bronchiolitis usually worsens before it improves: the worst day is often day 3–5. A baby seen on day 1 or 2 with borderline feeding may deteriorate overnight, which is why timing, carer confidence and access to help shape the decision as much as the observations do."}
     ]},

    {id:"diagnose", nav:"Diagnose", title:"Diagnosis and assessment", sub:"A clinical diagnosis. Tests do not change management in primary care.",
     blocks:[
       {b:"table", head:["Feature","Typical in bronchiolitis","Suggests something else"], rows:[
         ["<b>Age</b>","Under 2 years, most often in the first year, peak 3–6 months","Recurrent wheeze over 1 year: think viral-induced wheeze or asthma"],
         ["<b>Onset</b>","1–3 days of coryza, then persistent cough","Sudden onset with choking: foreign body"],
         ["<b>Chest</b>","Tachypnoea or recession, with wheeze or crackles","Focal crackles or bronchial breathing: pneumonia"],
         ["<b>Temperature</b>","Fever in about a third, usually below 39°C","Fever over 39°C, or persistent fever: pneumonia or other bacterial infection"],
         ["<b>Course</b>","Worst on days 3–5; cough resolves within 3 weeks in most","Getting worse after day 5, or a new fever: reassess"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"⚕️ What to measure", html:"Respiratory rate (count for a full minute), heart rate, temperature, capillary refill, oxygen saturation with a paediatric probe where available, hydration, and feeding as a percentage of usual (ask about the number of feeds, the volume and wet nappies).", src:"NICE NG9 (2015, updated 2021)"},
         {tone:"blue", h:"🧪 Tests", html:"Do not routinely perform blood tests, chest X-ray, or capillary blood gas. A nasopharyngeal swab for RSV is a hospital decision, for cohorting.", src:"NICE NG9 (2015, updated 2021)"},
         {tone:"cream", h:"🔍 Differentials", html:"Viral-induced wheeze or asthma, pneumonia, whooping cough (paroxysmal cough, apnoea), heart failure in congenital heart disease, inhaled foreign body, sepsis.", src:"NICE NG9 (2015, updated 2021)"},
         {tone:"amber", h:"📏 Remote consultations", html:"A baby with breathing difficulty generally needs a face-to-face assessment. If assessing by phone or video, ask about pauses in breathing, colour, sucking in under the ribs, feeds and wet nappies, and arrange to see them if there is doubt.", src:"NICE NG9 (2015, updated 2021)"}
       ]}
     ]},

    {id:"manage", nav:"Manage", title:"Management at home: supportive care", sub:"There is no drug that shortens bronchiolitis. The job is to keep the baby fed and safe, and to know when to escalate.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1", tone:"cream", title:"Feeding and fluids", when:"every baby", fromLabel:"then",
          html:"Small, frequent feeds; more breastfeeds; offer the usual milk. Clearing the nose with saline drops before feeds may help some babies feed. Count wet nappies."},
         {step:"2", tone:"cream", title:"Comfort and fever", when:"if distressed", fromLabel:"then",
          html:"Paracetamol or ibuprofen for distress from fever, at the dose for age on the BNFC or product label. Keep the baby upright for feeds; sleep on the back in a clear cot (safe sleep advice)."},
         {step:"3", tone:"green", title:"Smoke-free home", when:"every family", fromLabel:"then",
          html:"Advise that no one smokes in the home or car; offer smoking cessation support to carers."},
         {step:"4", tone:"amber", title:"Reassess", when:"if worse or not feeding", fromLabel:"escalate",
          html:"Reassess the same day if feeding falls to about half of usual, breathing worsens, or the carer is worried. Use the 999 signs."}
       ]},
       {b:"table", head:["Do not use","Why"], rows:[
         ["Salbutamol, ipratropium, adrenaline (nebulised)","No benefit in bronchiolitis (NICE NG9)."],
         ["Systemic or inhaled corticosteroids, montelukast","No benefit (NICE NG9)."],
         ["Antibiotics","Bronchiolitis is viral; use antibiotics only where a secondary bacterial infection is suspected (NICE NG9)."],
         ["Chest physiotherapy","Not recommended unless there is another indication, such as spinal muscular atrophy (NICE NG9)."],
         ["Over-the-counter cough and cold medicines","Not for children under 6 years (MHRA)."]
       ]},
       {b:"say", html:"This is a common chest infection caused by a virus. It usually gets worse for the first 3 to 5 days and then slowly improves; the cough can last a few weeks. Antibiotics and inhalers don't help. The most important things are feeding little and often and watching the breathing."}
     ]},

    {id:"special", nav:"Special groups", title:"Special groups", sub:"Where the default plan changes.",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"👶 Under 3 months and premature babies", html:"More likely to have apnoea and to need admission. Have a low threshold for same-day paediatric assessment, especially under 6 weeks.", src:"NICE NG9 (2015, updated 2021)"},
         {tone:"amber", h:"❤️ Heart and lung disease", html:"Haemodynamically significant congenital heart disease or chronic lung disease (including bronchopulmonary dysplasia): early discussion with paediatrics. In hospital, the admission threshold for saturations is 92% rather than 90% for these children.", src:"NICE NG9 (2015, updated 2021)"},
         {tone:"amber", h:"🧬 Neuromuscular disease and immunodeficiency", html:"Weak cough and reduced reserve: low threshold for referral.", src:"NICE NG9 (2015, updated 2021)"},
         {tone:"blue", h:"🏠 Social circumstances", html:"Consider a carer's confidence and ability to recognise deterioration, distance to hospital and transport when deciding where the baby should be.", src:"NICE NG9 (2015, updated 2021)"}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral and admission thresholds", sub:"Primary care referral criteria and the hospital admission criteria differ; both are useful to know.",
     blocks:[
       {b:"table", head:["Setting","Criteria","Action"], rows:[
         ["<b>Primary care: immediate</b>","Apnoea; looks seriously unwell; severe respiratory distress (grunting, marked recession, rate over 70); central cyanosis; persistent saturation under 92% on air","<b>999</b>"],
         ["<b>Primary care: consider referral</b>","Respiratory rate over 60; difficulty breastfeeding or intake 50–75% of usual; clinical dehydration","Same-day paediatric assessment, considering risk factors"],
         ["<b>Hospital: admit</b> (2021 update)","Apnoea; saturation persistently under <b>90%</b> on air in children aged 6 weeks and over, or under <b>92%</b> in babies under 6 weeks or with underlying health conditions; inadequate intake (50–75% of usual) or persisting dehydration; severe distress","Hospital decision; explains why some babies are sent home from the assessment unit"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"🔁 Why 90%?", html:"The 2021 update lowered the hospital admission threshold from 92% to 90% for children aged 6 weeks and over, based on trial evidence that this was safe and reduced time in hospital. The 92% threshold stays for younger babies and children with underlying conditions.", src:"NICE NG9 (2021 update)"},
         {tone:"cream", h:"📞 Discussing with paediatrics", html:"Give the day of illness, feeds as a percentage of usual, wet nappies, respiratory rate, saturations, any apnoea and risk factors. This helps the team decide on assessment unit review or admission.", src:"NICE NG9 (2015, updated 2021)"}
       ]}
     ]},

    {id:"prevent", nav:"Prevent", title:"Prevention: the RSV programme", sub:"Respiratory syncytial virus causes most bronchiolitis. Prevention now reaches most babies.",
     blocks:[
       {b:"table", head:["Who","What","Notes"], rows:[
         ["<b>Pregnant women</b>","RSV vaccine (Abrysvo) offered from <b>28 weeks</b> of pregnancy, ideally around 28 weeks, and can be given up to birth","Programme since 1 September 2024. Antibodies pass to the baby, protecting them in the first months of life. Check the current Green Book chapter 27a."],
         ["<b>High-risk infants</b>","<b>Nirsevimab</b>, a single-dose long-acting monoclonal antibody, before or during their first RSV season","Replaced palivizumab from the 2025–26 season for the existing high-risk cohort (for example significant heart or lung disease), arranged by specialist teams. <span class=mg-dose>Usual dose: 50 mg if under 5 kg, 100 mg if 5 kg or over, single intramuscular injection (SPC; check the SPC, BNFC and Green Book; <a href=https://www.medicines.org.uk/emc/search?q=nirsevimab target=_blank rel=noopener>SPC: nirsevimab</a>).</span>"],
         ["<b>Babies born before 32 weeks</b>","Nirsevimab before their first RSV season","Added because they are unlikely to have benefited from maternal vaccination. Usually given by the neonatal team."]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"✅ Everyday prevention", html:"Hand washing, keeping babies away from people with colds where possible, breastfeeding, and a smoke-free home.", src:"NICE NG9 (2015, updated 2021)"},
         {tone:"blue", h:"🔎 Check eligibility", html:"Eligibility and products change by season. Check the current UKHSA Green Book chapter 27a and the annual RSV programme letter.", src:"UKHSA Green Book ch. 27a (2025)"}
       ]}
     ]},

    {id:"patient", nav:"Safety-net", title:"Patient information and safety-netting", sub:"Give advice in writing as well as in words. NICE NG9 lists what carers should be told.",
     blocks:[
       {b:"say", html:"Call 999 if your baby stops breathing or has pauses in breathing, goes blue around the lips, is struggling to breathe with grunting or sucking in under the ribs, or is very hard to wake. Contact us or NHS 111 the same day if your baby is taking less than half their usual feeds, has had no wet nappy for 12 hours, is breathing much faster, or you are worried. Most babies are better in two to three weeks."},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"✅ Key messages", html:"Symptoms usually peak on days 3–5; the cough may last up to 3 weeks; antibiotics do not help; feed little and often; no smoking around the baby; trust your instinct and ask for help.", src:"NICE NG9 (2015, updated 2021)"},
         {tone:"green", h:"📄 Information", html:"NHS website: bronchiolitis; NICE NG9 information for the public; UKHSA RSV vaccine leaflets for pregnant women.", src:"NHS website · UKHSA"}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Scenario", html:"A mother brings her 7-week-old baby, born at 33 weeks, on day 3 of a cold. He is coughing, breathing fast and taking about half of his usual feeds. She asks for an inhaler like his brother's.", src:"NICE NG9 (2015, updated 2021)"},
       {tone:"cream", h:"What a good consultation does", html:"Counts the respiratory rate, checks saturations, hydration and apnoea history. Recognises prematurity, young age and feeding at 50% as reasons for <b>same-day paediatric referral</b>. Explains why salbutamol is not used. Gives clear 999 advice and asks about smoking at home.", src:"NICE NG9 (2015, updated 2021)"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Every recommendation on this page traces to a named primary source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG9 — Bronchiolitis in children: diagnosis and management (June 2015, updated August 2021)</b><br><a href="https://www.nice.org.uk/guidance/ng9" rel="noopener">nice.org.uk/guidance/ng9</a><span class="rd"> — clinical diagnosis; risk factors for severe disease; 999 criteria in primary care; consider-referral criteria (rate over 60, intake 50–75%, dehydration); 2021 admission thresholds of 90% (6 weeks and over) and 92% (under 6 weeks or underlying conditions); treatments not to use; safety-netting</span></li>'+
         '<li><b>NICE NG143 — Fever in under 5s: assessment and initial management (2019, updated 2021)</b><br><a href="https://www.nice.org.uk/guidance/ng143" rel="noopener">nice.org.uk/guidance/ng143</a><span class="rd"> — traffic-light assessment of the febrile child</span></li>'+
         '<li><b>UKHSA — Respiratory syncytial virus: the Green Book, chapter 27a (updated 2025)</b><br><a href="https://www.gov.uk/government/publications/respiratory-syncytial-virus-the-green-book-chapter-27a" rel="noopener">gov.uk — Green Book chapter 27a</a><span class="rd"> — maternal vaccination from 28 weeks (from 1 September 2024); nirsevimab for eligible infants</span></li>'+
         '<li><b>NHS England / UKHSA — Introduction of nirsevimab for at-risk infants, 2025–26 RSV season (programme letters, 2025)</b><br><a href="https://www.gov.uk/government/collections/respiratory-syncytial-virus-rsv-guidance-data-and-analysis" rel="noopener">gov.uk — RSV collection</a><span class="rd"> — replaces palivizumab; extends to infants born before 32 weeks</span></li>'+
         '<li><b>Nirsevimab (Beyfortus) SPC</b><br><a href="https://www.medicines.org.uk/emc/search?q=nirsevimab" rel="noopener">medicines.org.uk — nirsevimab</a><span class="rd"> — 50 mg under 5 kg, 100 mg 5 kg or over</span></li>'+
         '<li><b>MHRA — Pulse oximeters: accuracy in people with darker skin tones (2021, updated 2024)</b><br><a href="https://www.gov.uk/guidance/the-use-and-regulation-of-pulse-oximeters-information-for-healthcare-professionals" rel="noopener">gov.uk — pulse oximeters</a><span class="rd"> — oximetry may overestimate saturation</span></li>'+
         '<li><b>MHRA / Commission on Human Medicines — over-the-counter cough and cold medicines for children (2009)</b><span class="rd"> — not for children under 6 years</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Bronchiolitis in children — NICE NG9 (2015, updated 2021), NICE NG143, UKHSA Green Book chapter 27a and the nirsevimab SPC. Admission thresholds are hospital criteria; primary care refers on clinical signs. Check children's doses in the current BNFC. Not a substitute for clinical judgement."
});
