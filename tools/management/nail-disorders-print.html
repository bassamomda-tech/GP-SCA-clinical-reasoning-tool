  stemSub:"One page for the whole presentation: screen first for subungual melanoma and hand-space infection, then classify by colour, texture and distribution — one nail localises, all twenty suggest systemic. Confirm onychomycosis with clippings before committing anyone to months of terbinafine, distinguish the psoriatic oil drop sign from fungus, never incise a herpetic whitlow, and treat nail dystrophy in a diabetic patient as a foot-risk problem rather than a cosmetic one.",

  lead:'<div class="mg-layers"><a href="#severe"><b>Exclude first</b><small>Melanoma · clubbing · hand sepsis</small></a><a href="#confirm"><b>Classify</b><small>Colour · texture · infection</small></a><a href="#workup"><b>Assess</b><small>All 20 nails · mycology</small></a><a href="#ladder"><b>Treat</b><small>Confirm before prescribing</small></a><a href="#monitor"><b>Review</b><small>Slow response · surveillance</small></a></div>',
  quickSub:"If you read nothing else on this page, read these six cards. Every number traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ A single pigmented nail is melanoma until proven otherwise", html:"Hutchinson's sign — pigment extending onto the proximal or lateral nail fold or cuticle — is pathognomonic and mandates biopsy. Do not attribute progressive nail pigmentation in an adult to trauma or ethnic melanonychia without dermatology assessment. Subungual melanoma is 1–3% of melanomas in Caucasian populations but up to 25% in Black and Asian populations. → <b>2WW dermatology.</b>"},
    {tone:"red", h:"Never incise a herpetic whitlow", html:"Multiple clustered vesicles on an erythematous base with pain disproportionate to appearance, and no central fluctuance — incising it worsens the condition and spreads the virus. <b>Aciclovir 200 mg five times a day for 5 days.</b> This is the single most important error to avoid in an acutely painful finger."},
    {tone:"amber", h:"Clubbing is never dismissed", html:"Loss of the normal 160° angle, a fluctuant nail base and increased longitudinal curvature. Investigate for lung cancer (most important in smokers), infective endocarditis, IBD, cirrhosis, cystic fibrosis and mesothelioma → <b>urgent CXR, plus echocardiogram and blood cultures if febrile.</b>"},
    {tone:"blue", h:"Confirm the fungus before the tablet", html:"Positive mycology is required before an oral antifungal — clinical diagnosis alone is insufficient given the treatment duration and side effects. Sample technique is the commonest reason for a false negative: clean with alcohol, sample the PROXIMAL infected nail (not the dead distal edge), include subungual debris, use a dry pot not a swab, 20–50 mg minimum. <b>Even then culture sensitivity is only ~50–70%; PCR is ~85–90%.</b>"},
    {tone:"purple", h:"The oil drop sign settles fungus versus psoriasis", html:"A pink-salmon translucent discolouration of the proximal nail bed, ~90–95% specific for psoriasis — far more specific than onycholysis or subungual hyperkeratosis alone. If present, look for hidden psoriasis (hairline, natal cleft, umbilicus, ears) and assess for psoriatic arthritis, since nail changes occur in 80% of psoriatic arthritis and may precede the joints."},
    {tone:"green", h:"Nail dystrophy in diabetes is a foot-risk problem", html:"Onychomycosis disrupts the epidermal barrier and creates a portal for cellulitis, osteomyelitis and amputation in a foot already compromised by neuropathy and microangiopathy. Treat with a low threshold (terbinafine 250 mg OD for 12–16 weeks) and refer to podiatry — NICE NG19 and NG28 both support proactive treatment rather than dismissing it as cosmetic."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step takes 30 seconds and is the one that is skipped.",
  pathway:[
    {title:"Screen melanoma and hand-space infection", html:"A widening pigmented band or Hutchinson's sign → 2WW. Acute paronychia with fluctuance → drainage; with Kanavel signs or lymphangitis → same-day hand surgery. New clubbing → investigate.", alert:true},
    {title:"Classify by pattern", html:"Colour (leukonychia, Terry's, Muehrcke's, melanonychia), texture (onycholysis, pitting, Beau's lines, koilonychia, splinter haemorrhages), infection (onychomycosis, paronychia, herpetic whitlow). <b>One nail localises; all twenty suggest systemic.</b>"},
    {title:"Examine all 20 nails and test appropriately", html:"<b>Nail plate, bed, folds, lunula and periungual skin</b> — plus nail clippings for mycology, FBC and ferritin, TFTs, LFTs and albumin, blood cultures, CXR as the pattern directs."},
    {title:"Treat the confirmed diagnosis", html:"Mycology-positive onychomycosis → terbinafine or itraconazole. Psoriatic nails → treat the psoriasis. Koilonychia → correct the iron. Chronic paronychia → stop the wet work."},
    {title:"Review with the right clock", html:"Nails grow 3–4 mm a month, so allow 6–12 months before judging response. Melanonychia surveillance, LFT monitoring on terbinafine, and document the nail examination."}
  ],
  sections:[

    {id:"severe", nav:"Exclude first", title:"Red flags — malignancy, systemic disease and hand-space infection",
     sub:"A single pigmented or rapidly dystrophic nail is melanoma until proven otherwise, especially with a widening band or pigment spreading onto the nail fold.",
     blocks:[
       {b:"table", head:["Presentation","Suggests","Action"], rows:[
         ["Pigmented longitudinal band (melanonychia striata) + darkening + widening + irregular borders + Hutchinson's sign (pigment extending onto the nail fold or cuticle)","<b>Subungual melanoma.</b> Hutchinson's sign is pathognomonic","2WW dermatology urgently. Biopsy mandatory. Do not attribute to trauma or ethnic melanonychia without dermatology assessment in any adult with progressive nail pigmentation"],
         ["<b>Nail change + clubbing</b> (loss of the normal 160° angle at the nail fold, fluctuant nail base, increased longitudinal curvature)","Lung cancer (bronchogenic carcinoma — most important in smokers), COPD, infective endocarditis, IBD, cirrhosis, cystic fibrosis, mesothelioma","Urgent CXR + echocardiogram + blood cultures if febrile. Do not dismiss clubbing"],
         ["<b>Acute paronychia + spreading cellulitis + lymphangitis</b> (red streaking up the forearm) + fever + systemic illness","<b>Ascending infection from a hand space infection</b>","999 / same-day hand surgery. IV flucloxacillin. Surgical drainage if a deep space is involved — flexor tenosynovitis, Kanavel signs: fusiform swelling, flexed finger posture, pain on passive extension, tenderness along the flexor tendon sheath"],
         ["Nail dystrophy + dyspnoea + cough + bilateral effusions + yellow-green discolouration of all nails","<b>Yellow nail syndrome</b> — with lymphoedema, pleural effusion, bronchiectasis, chronic sinusitis","<b>CXR + spirometry + lymphoedema assessment + respiratory referral</b>"],
         ["Sudden white nails (leukonychia totalis) + hypoalbuminaemia + oedema + chronic illness","<b>Muehrcke's lines</b> (paired white transverse bands parallel to the lunula — hypoalbuminaemia) or <b>Terry's nails</b> (white with a distal pink band — cirrhosis, heart failure, type 2 diabetes)","<b>LFTs + albumin + BNP + renal function urgently</b>"],
         ["Rapidly progressing nail destruction + periungual erythema + tenderness on anti-VEGF or EGFR inhibitor therapy","Drug-induced paronychia or nail toxicity from targeted oncological therapy","Same-day oncology. Topical corticosteroid + antiseptic. Discuss dose modification with the oncologist"]
       ]},
       {b:"why", html:"Subungual melanoma is the most important life-threatening nail diagnosis to identify in primary care — approximately 1–3% of all melanomas in Caucasian populations but up to 25% of melanomas in Black and Asian populations, where acral lentiginous melanoma is relatively more common. Median age at diagnosis is approximately 60–65 years. The clinical challenge: benign longitudinal melanonychia is common in dark-skinned individuals and can be entirely normal — the discriminating features are Hutchinson's sign, width above 3 mm, irregular borders, multiple colours within the band, progressive widening or darkening over time, and concurrent nail dystrophy. The ABCDEF rule: A (age 50–70, and affected digit — thumb or great toe), B (band width &gt;3 mm, Blurred borders), C (Colour heterogeneity, Change in size), D (Digit — single), E (Extension to the nail fold — Hutchinson's sign), F (Family or personal history of melanoma)."},
       {b:"why", html:"Beau's lines are one of the most useful retrospective signs in nail examination — transverse grooves caused by temporary cessation of nail matrix activity during significant systemic illness, severe nutritional deficiency or chemotherapy. Because fingernails grow at approximately 3 mm a month, the distance of the line from the proximal nail fold dates the precipitating illness — a groove 6 mm from the base occurred about 2 months ago. <b>Multiple parallel lines indicate multiple separate insults.</b> Common causes: septicaemia, major surgery, severe infection, myocardial infarction, severe nutritional depletion and chemotherapy cycles."},
       {b:"dl", rows:[
         ["<b>NG12 — the criterion that applies here</b>","NICE NG12: consider a suspected cancer pathway referral for melanoma in people with a suspicious pigmented skin lesion. Applied to the nail unit that means: melanonychia with Hutchinson's sign, a progressively widening or darkening pigmented band without a clear benign cause, or nail dystrophy with periungual pigmentation → 2WW dermatology. Clubbing is not itself an NG12 criterion, but it mandates a search for the underlying cause — and where that search points to lung cancer, the NG12 lung route applies in its own right. The source cites NG12 as a <b>2015</b> document; the current version is <b>May 2025</b>, which this page follows. Restated in <a href='#refer'>Refer</a>"]
       ]}
     ]},

    {id:"confirm", nav:"Classify", title:"Classification — colour, texture and infection",
     blocks:[
       {b:"dl", rows:[
         ["<b>Colour changes</b>","<b>White (leukonychia):</b> superficial — trauma, fungal; <b>Terry's nails</b> (white with a distal pink-brown band 0.5–3 mm) = liver cirrhosis, heart failure, type 2 diabetes, CKD; <b>Muehrcke's lines</b> (paired white transverse bands, non-blanching, reflecting the nail bed not the plate) = hypoalbuminaemia; <b>half-and-half nails</b> (proximal white, distal red-brown) = CKD. <b>Yellow:</b> fungal onychomycosis (most common), yellow nail syndrome, psoriasis. <b>Brown or black:</b> melanonychia — ethnic, drug-induced, benign naevus, melanoma (Hutchinson's sign); subungual haematoma (recent trauma, painful). <b>Blue or purple:</b> cyanosis, argyria, antimalarials, minocycline"],
         ["<b>Texture and structure</b>","<b>Onycholysis</b> (separation from the bed): psoriasis, thyroid disease, trauma, drugs (doxycycline and tetracyclines — photo-onycholysis), fungal. <b>Pitting:</b> psoriasis (multiple small pits), alopecia areata (geometric, grid-like), eczema. <b>Beau's lines:</b> systemic illness, nutritional deficiency, chemotherapy. <b>Koilonychia</b> (spoon nails): iron deficiency anaemia (classic), haemochromatosis, Raynaud's. <b>Splinter haemorrhages:</b> infective endocarditis (proximal and symptomatic) versus trauma (distal and asymptomatic — much the commonest)"],
         ["<b>Infections</b>","<b>Onychomycosis</b> — the most common nail disorder; <b>Trichophyton rubrum</b> most common; patterns are distal lateral subungual (DLSO, commonest), white superficial, proximal subungual, endonyx and candidal. <b>Paronychia</b> — acute (bacterial, S. aureus) versus chronic (candidal, wet-work exposure). <b>Herpetic whitlow</b> — vesicular, extremely painful, HSV-1 or HSV-2"],
         ["<b>Onychomycosis patterns</b>","<b>DLSO (most common):</b> distal onycholysis, subungual hyperkeratosis and yellow-brown discolouration progressing proximally. <b>WSO:</b> white powdery nail plate surface (T. mentagrophytes, moulds). <b>PSO:</b> a white area proximally under an intact plate — associated with immunosuppression. <b>Endonyx:</b> diffuse milky white nail without onycholysis. <b>Total dystrophic:</b> complete destruction in long-standing disease. <b>Candidal:</b> especially immunocompromised, mixed with chronic paronychia"],
         ["<b>Mimics of onychomycosis</b>","<b>Psoriasis</b> (onycholysis + subungual hyperkeratosis + pitting + oil drop sign) · <b>trauma</b> · <b>lichen planus</b> (nail involvement in 10% — thinning, longitudinal ridging, pterygium formation) · <b>eczema</b> (irregular pitting, plate thickening) · <b>yellow nail syndrome</b>"],
         ["<b>Psoriatic nail features</b>","<b>Pitting</b> (most specific — deeper and more irregularly distributed than the geometric pitting of alopecia areata) · <b>onycholysis with the oil drop sign</b> · <b>subungual hyperkeratosis</b> (thick friable material under the plate) · <b>salmon patch</b> · <b>red lunula</b> (rare but specific). Nail changes occur in 80% of psoriatic arthritis and may precede or occur without skin psoriasis"]
       ]},
       {b:"why", html:"The psoriatic oil drop sign is one of the most diagnostically specific findings in dermatology — a pink, salmon or yellowish-brown translucent discolouration of the nail bed, usually proximally, resembling a drop of oil beneath the nail. The pathological correlate is foci of parakeratosis in the nail bed epithelium, identical to the psoriatic plaque process. Specificity is approximately 90–95% when present — far higher than onycholysis or subungual hyperkeratosis alone. Where the diagnosis is uncertain between fungal and psoriatic, the oil drop sign should prompt assessment for psoriasis at hidden sites (hairline, natal cleft, umbilicus, ears) and consideration of psoriatic arthritis, since nail changes may precede joint manifestations. Nail psoriasis with onycholysis and pitting should not be treated with systemic antifungals — mycology should confirm or exclude concurrent fungal infection first."}
     ]},

    {id:"workup", nav:"Assess", title:"History, examination and investigations",
     blocks:[
       {b:"table", head:["Domain","Detail"], rows:[
         ["<b>History</b>","<b>Duration and progression</b> (sudden = trauma or illness; gradual = chronic disease or fungal) · <b>all nails or a single nail</b> (single = localised — fungal, trauma, isolated psoriasis; all = systemic) · trauma · skin and joint disease (psoriasis, eczema, lichen planus) · systemic disease (diabetes, thyroid, IBD, liver disease, CKD, connective tissue disease) · <b>occupation</b> (wet work, manicurist, chemical exposure, trauma)"],
         ["<b>Drug history</b>","Tetracyclines (photo-onycholysis) · hydroxychloroquine (blue-brown nails) · anti-VEGF and EGFR inhibitors (paronychia) · chemotherapy (Beau's lines, onycholysis) · retinoids (thin nails). Also nail care — artificial and gel nails contribute to onycholysis and allergic contact dermatitis. Immunosuppression raises the risk of atypical fungal or bacterial nail infection"],
         ["<b>Examination — inspect all 20 nails systematically</b>","<b>Nail plate:</b> colour, surface texture (pitting, ridging, grooves), integrity. <b>Nail bed:</b> colour (cyanosis, Terry's, Muehrcke's), extent of onycholysis. <b>Lateral nail folds:</b> acute paronychia (swelling, pus), chronic paronychia (swelling, cuticle loss), <b>periungual pigmentation (Hutchinson's)</b>. <b>Lunula:</b> absent (iron deficiency, malnutrition), large (thyrotoxicosis). <b>Proximal nail fold: capillaroscopy</b> — dilated tortuous capillaries indicate connective tissue disease (systemic sclerosis, dermatomyositis). <b>Periungual:</b> tophi (gout). <b>Cuticle loss:</b> chronic paronychia, connective tissue disease"],
         ["<b>Investigations</b>","<b>Nail clippings for mycology (microscopy and culture)</b> · <b>dermoscopy</b> for melanonychia (nail unit dermoscopy requires training) · <b>FBC + ferritin</b> (koilonychia) · <b>TFTs</b> (onycholysis, clubbing) · <b>LFTs + albumin</b> (Terry's, Muehrcke's) · <b>blood cultures ×2</b> if splinter haemorrhages with fever and a murmur · <b>ANA + anti-dsDNA + anti-Scl-70</b> for capillaroscopy changes · <b>CXR</b> for clubbing"]
       ]},
       {b:"warn", html:"Nail clipping technique is critical, and poor technique is the commonest reason for a false-negative fungal culture. <b>(1) Clean the nail with 70% alcohol and allow to dry</b> — this removes contaminant bacteria that inhibit fungal growth. <b>(2) Collect from the most PROXIMAL infected part</b>, where the fungus is actively growing, not the distal dystrophic free edge which is mostly dead keratin. <b>(3) Include subungual debris</b> — this has the highest yield. (4) For white superficial onychomycosis, scrape the white material from the nail surface. <b>(5) Use a dry paper envelope or mycology pot, not a swab</b> — swabs dry out and reduce yield. <b>(6) Minimum 20–50 mg of material.</b> Even with perfect technique, culture sensitivity is approximately 50–70%, so a negative culture does not exclude fungal nail infection; PCR-based testing where available is approximately 85–90% sensitive. Culture takes 4–6 weeks."}
     ]},

    {id:"ladder", nav:"Treat", title:"Onychomycosis, paronychia and nail psoriasis",
     blocks:[
       {b:"table", head:["Condition","Treatment"], rows:[
         ["<b>Onychomycosis — oral, mycology-confirmed</b>","<b>Terbinafine 250 mg OD</b> — first-line for dermatophyte infection (T. rubrum, 90% of cases). <b>Fingernails 6 weeks; toenails 12–16 weeks. LFTs at baseline</b> (rare hepatotoxicity — stop if elevated). <b>Cure rate approximately 70–80% at 12 months.</b> Avoid in hepatic impairment; <b>CYP2D6 inhibitor</b> — raises levels of antidepressants, antipsychotics and beta-blockers, so check BNF interactions"],
         ["<b>Itraconazole pulse therapy</b>","For <b>Candida or non-dermatophyte mould</b>, or terbinafine failure. 200 mg BD for 7 days per month, for 2 months (fingernails) or 3 months (toenails). More interactions than terbinafine (<b>CYP3A4</b> — statins, anticoagulants). <b>Contraindicated in heart failure and ventricular dysfunction</b>"],
         ["<b>Topical antifungal</b>","<b>Amorolfine 5% nail lacquer</b> for mild distal disease — &lt;50% of the nail, &lt;2–3 nails, no matrix involvement; apply weekly after filing, for 6–12 months in toenails. <b>Efinaconazole 10% solution (Jublia)</b> — higher transungual penetration, once daily, UK-licensed. <b>Ciclopirox 8% lacquer</b> as an alternative. <b>Cure rates are lower than oral (approximately 30–40% at 12 months)</b> — reserve for where oral is contraindicated"],
         ["<b>Acute paronychia</b>","<b>Mild (no fluctuance):</b> warm soaks 3–4 times a day for 10–15 minutes plus topical antiseptic (chlorhexidine or povidone-iodine). <b>Antibiotic only if</b> spreading cellulitis, systemic illness or immunocompromise: <b>flucloxacillin 500 mg QDS for 5 days</b>, or <b>clarithromycin 500 mg BD</b> if penicillin-allergic. <b>Fluctuant:</b> incision and drainage — digital block plus a #11 blade along the lateral nail fold; culture the pus"],
         ["<b>Herpetic whitlow</b>","Aciclovir 200 mg five times a day for 5 days (or valaciclovir 1 g BD), plus analgesia and a loose dressing. Do NOT incise — this spreads the virus"],
         ["<b>Chronic paronychia</b>","<b>(1) Avoid wet work</b> (waterproof gloves with a cotton liner); <b>(2) topical antifungal</b> — miconazole or clotrimazole cream to the nail folds BD for 3–6 months; <b>(3) topical corticosteroid</b> (betamethasone valerate 0.1%). A combined imidazole plus corticosteroid (Lotriderm, Daktacort) BD for 4–6 weeks is often effective. Refractory: dermatology (systemic itraconazole, nail fold marsupialization)"],
         ["<b>Nail psoriasis</b>","<b>Topical first-line:</b> clobetasol 0.05% solution or ointment to the proximal nail fold and under the free edge BD for 4–6 months; calcipotriol with betamethasone (Dovobet gel); tazarotene 0.1% gel. Nails grow 3–4 mm a month — allow 6–12 months before assessing response. <b>Intralesional triamcinolone 10 mg/mL</b> into the proximal nail fold (dermatology). <b>Biologics</b> (adalimumab, secukinumab, ixekizumab, guselkumab) — dermatology-initiated"],
         ["<b>Koilonychia and systemic signs</b>","Treat the iron deficiency; koilonychia resolves over months once ferritin is &gt;30 mcg/L, continuing for 3 months after normalisation. <b>Proximal splinter haemorrhages with fever and a murmur:</b> blood cultures ×2 before antibiotics, urgent echocardiogram, admit if Duke criteria suggest endocarditis. <b>Distal splinters are usually benign.</b> <b>Terry's and Muehrcke's:</b> treat the underlying liver disease, nephrotic syndrome or malnutrition"]
       ]},
       {b:"why", html:"The herpetic whitlow distinction from bacterial paronychia is critical, because incising a herpetic whitlow worsens it and spreads the virus. Herpetic whitlow presents as multiple clusters of vesicles on an erythematous base with intense burning or throbbing pain disproportionate to the appearance, and without the central fluctuance of a bacterial abscess. The tell-tale features: vesicles rather than a single pointing abscess, absence of purulent exudate, and disproportionate pain. Risk groups: dental and medical workers, and patients with genital herpes (autoinoculation). If uncertain, swab for HSV PCR and treat empirically with an antiviral while awaiting the result — do not perform incision and drainage."},
       {b:"why", html:"Lichen planus of the nails needs early dermatology referral to prevent permanent destruction — it affects approximately 10% of patients with lichen planus and can occur without skin or mucosal disease. Changes include thinning, brittleness, longitudinal ridging (onychorrhexis), fraying, loss of shine and — crucially — pterygium formation, the progressive forward growth of the proximal nail fold over the plate caused by matrix scarring. Pterygium is permanent and irreversible: once the matrix is scarred, no further nail grows in that area. Early potent topical corticosteroid (triamcinolone 0.1% ointment to the proximal nail fold BD) or intralesional steroid can prevent it — the window is typically 1–2 years from symptom onset."},
       {b:"why", html:"<b>Biologics represent a major advance in nail psoriasis</b>, measured with the <b>NAPSI (Nail Psoriasis Severity Index)</b>. Anti-IL-17 agents (secukinumab, ixekizumab) achieve the highest complete clearance rates — approximately 50–60% reach NAPSI 0 at 26 weeks in phase III trials — compared with approximately 40% for the anti-TNF agent adalimumab and 35–40% for ustekinumab; the guselkumab PSUMMIT data showed approximately 60–70% NAPSI improvement at 24 weeks. Crucially, nail psoriasis responds more slowly than plaque psoriasis: the first 3–6 months of biologic treatment may show little nail improvement because the nail must physically grow out. Counselling patients about this 3–6 month lag prevents premature discontinuation of effective treatment."}
     ]},

    {id:"lifestyle", nav:"Nail care", title:"Prevention, footwear and occupational exposure",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"🦶 Onychomycosis prevention", html:"Keep nails dry and trimmed short. Dry between the toes after bathing — moisture is the primary driver. Avoid walking barefoot in communal areas. Change socks daily. Treat tinea pedis promptly: it is the primary reservoir for onychomycosis in most patients — clotrimazole 1% cream BD for 4 weeks. Antifungal dusting powder in shoes for recurrence prevention."},
         {tone:"blue", h:"👟 Footwear", html:"Tight footwear causes trauma-induced onycholysis and subungual haematoma in the first and second toes. <b>Wide toe box, 1 cm space beyond the longest toe, low heel.</b> Ill-fitting running shoes cause repetitive microtrauma and nail dystrophy in runners."},
         {tone:"amber", h:"💧 Wet work and chronic paronychia", html:"Hands in water &gt;2 hours a day is the commonest cause of chronic paronychia — healthcare workers, kitchen staff, cleaners, hairdressers, swimmers. Waterproof gloves with a cotton liner, emollient after work, and cuticle oil. <b>The cuticle is a biological barrier — do not trim or push it back</b>, a common nail salon practice that lets moisture and microorganisms into the nail fold."},
         {tone:"amber", h:"💅 Artificial and gel nails", html:"Cause photo-onycholysis (UV curing lights), allergic contact dermatitis to methacrylates (increasingly common, cross-reacting with dental adhesives and hearing aid glues), onycholysis from filing, and chronic paronychia from trapped moisture. Patch testing for methacrylate allergy if periungual dermatitis develops. Removal allows assessment of the underlying nail and resolution of inflammation."},
         {tone:"red", h:"🩺 Diabetes and nail care", html:"Onychomycosis in diabetes raises the risk of cellulitis, osteomyelitis and amputation, because fungal dystrophy disrupts the epidermal barrier. <b>Treat with a low threshold (terbinafine 250 mg OD for 12–16 weeks).</b> The annual foot check includes nail inspection, footwear advice, a 10 g monofilament neuropathy screen, and vascular assessment (DP and PT pulses, ABPI if reduced). Refer to podiatry for dystrophy, deformity, callus or neuropathy."},
         {tone:"cream", h:"🚭 Smoking", html:"Nicotine staining is reversible with cessation, improving within 3–6 months. More importantly, smoking increases the risk of psoriasis (including nail psoriasis), peripheral vascular disease and lung cancer (associated with clubbing). NHS Stop Smoking Services."},
         {tone:"plain", h:"🔍 Nails as a window on systemic health", html:"<b>Opportunistic nail examination at chronic disease reviews:</b> koilonychia (iron deficiency), Terry's nails (liver disease in alcohol misusers), Beau's lines (recent significant illness), splinter haemorrhages, clubbing. Document the findings — a \u201cnails normal\u201d entry demonstrates proactive assessment."},
         {tone:"blue", h:"🗣️ What patients should watch for", html:"A new dark streak that is widening or spreading onto the skin → urgent review. New finger clubbing → GP for a chest X-ray. New pale nails with fatigue → blood test. Nail fold changes with joint symptoms → rheumatology review."}
       ]},
       {b:"why", html:"The diabetic patient with onychomycosis deserves more proactive treatment than the \u201cwait and see\u201d approach commonly used in non-diabetic patients. In diabetic foot syndrome the epidermal barrier in the toe webs and periungual skin is already compromised by neuropathy (reduced protective sensation), microangiopathy (impaired healing) and xerosis. Onychomycosis adds a portal of entry for Staphylococcus aureus and gram-negative organisms that can progress rapidly to cellulitis, necrotising fasciitis, osteomyelitis and ultimately amputation — and diabetes-related foot disease already causes approximately <b>135 amputations per week in England</b>. NICE NG19 (diabetic foot) and NG28 (type 2 diabetes) both support proactive treatment, so annual foot checks should actively identify and treat onychomycosis rather than dismissing it as cosmetic."}
     ]},

    {id:"monitor", nav:"Review", title:"Follow-up, monitoring and surveillance",
     sub:"Nails grow slowly — response is judged in months, not weeks.",
     blocks:[
       {b:"table", head:["What","Detail"], rows:[
         ["<b>Onychomycosis monitoring</b>","LFTs at baseline before oral terbinafine. Stop immediately if rash, jaundice, abdominal pain or elevated LFTs. Review at completion: mycological cure and clinical cure (normal appearance may take additional months as the new nail grows out). Recurrence is common — approximately 20–30% at 5 years — and re-treatment should follow repeat mycology"],
         ["<b>Melanonychia surveillance</b>","If 2WW is declined or dermoscopy shows benign features: 3–6 monthly photographic documentation. Return urgently if the width increases, borders become irregular, Hutchinson's sign appears, colour becomes heterogeneous, or nail dystrophy develops. Any new pigmented band in an adult: photograph, measure, dermoscopy if available, refer if there is any concern"],
         ["<b>Psoriatic nail review</b>","At 3–6 months: NAPSI score or clinical assessment, and functional impact. If topical treatment is inadequate → dermatology for intralesional steroid or biologic consideration. <b>Assess for psoriatic arthritis at each review</b> (DIP joint tenderness, early morning stiffness)"],
         ["<b>Systemic nail signs</b>","Terry's nails and Muehrcke's lines: LFTs and albumin 3-monthly until the underlying condition is treated. Beau's lines: document, date the illness, review at 6 months (they should have grown out). Clubbing: CXR at every review, plus echocardiogram if new or progressing"],
         ["<b>Fungal nail review</b>","Review at 3–6 months — response is slow. Reassess if there is no improvement or the diagnosis is uncertain"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 999 / same-day", html:"Flexor tenosynovitis (Kanavel signs) → hand surgery same-day · spreading cellulitis with lymphangitis from a paronychia → IV antibiotics same-day."},
         {tone:"purple", h:"🟣 2WW", html:"Hutchinson's sign (pigment on the nail fold) → dermatology · new progressive nail pigmentation without a clear benign cause in any adult."},
         {tone:"amber", h:"🟠 Don't dismiss", html:"<b>New clubbing → investigate (CXR and onward as indicated).</b>"},
         {tone:"green", h:"📋 Document it", html:"The nail examination takes about 30 seconds — inspect hands and feet systematically at relevant chronic disease reviews and record the findings."}
       ]},
       {b:"why", html:"Documenting nail examination findings at chronic disease reviews is a simple quality and medicolegal standard. GPs performing annual diabetic foot checks, heart failure, COPD and IBD reviews are expected to examine relevant physical signs including the nails. A note stating \u201cnails: koilonychia noted for first time — ferritin requested\u201d demonstrates appropriate clinical observation. Conversely, a review note that does not mention nail examination, where the patient subsequently presents with a subungual melanoma that was present at the time, is a defensible medicolegal concern."},
       {b:"say", html:"Most nail problems are either fungal or related to psoriasis, and both are treatable — but I do not want to start you on months of tablets without first confirming what it is, so I am going to take some nail clippings. The one thing I always check for is a dark streak in a single nail, particularly if it is widening or the colour is spreading onto the skin at the base, because that needs a specialist opinion quickly. Whatever we treat, be patient with it: nails grow about three to four millimetres a month, so it takes six to twelve months before we can judge whether treatment has worked."}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999 / same-day hand surgery", html:"Acute paronychia with flexor tenosynovitis (Kanavel signs — fusiform swelling, flexed posture, pain on passive extension, volar tendon sheath tenderness) · spreading cellulitis with lymphangitis from a finger infection."},
         {tone:"purple", h:"2WW dermatology · NICE NG12", html:"Melanonychia with Hutchinson's sign · a progressively widening or darkening pigmented band without a clear benign cause · nail dystrophy with periungual pigmentation in any patient."},
         {tone:"amber", h:"Dermatology (urgent or routine)", html:"Lichen planus of the nails (pterygium formation — early treatment prevents permanent damage) · yellow nail syndrome · drug-induced nail toxicity (anti-VEGF, EGFR) · nail biopsy needed · chronic paronychia not responding to topical treatment."},
         {tone:"blue", h:"Rheumatology", html:"Psoriatic nail changes with joint symptoms (psoriatic arthritis) · capillaroscopy changes at the proximal nail fold (systemic sclerosis, dermatomyositis) · nail changes with systemic autoimmune features."},
         {tone:"green", h:"Podiatry", html:"<b>Diabetic patients with nail dystrophy, deformity, callus or neuropathy</b> — high risk of secondary bacterial infection."},
         {tone:"cream", h:"GP management (the majority)", html:"Onychomycosis: confirm with mycology then terbinafine or itraconazole. Acute paronychia: warm soaks plus topical antiseptic, drainage if fluctuant. Chronic paronychia: topical imidazole plus removal of wet work. Koilonychia: treat the iron deficiency. Splinter haemorrhages without systemic features: reassurance and review."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 62-year-old asks for \u201csomething for fungal toenails\u201d, having tried an over-the-counter lacquer for a year. On examining all twenty nails you find thickened yellow great toenails — and, incidentally, a 4 mm brown longitudinal band in the right thumbnail that he says has been \u201cthere a while but looks darker\u201d, with faint pigment at the cuticle. He has type 2 diabetes."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Examines all 20 nails rather than only the presenting complaint — which is how the thumb band is found; <b>recognises Hutchinson's sign and refers 2WW rather than reassuring</b>; takes clippings for mycology before prescribing terbinafine, and knows clinical diagnosis alone is insufficient; <b>checks baseline LFTs and screens for CYP2D6 interactions</b>; treats the diabetes as raising the stakes — portal of entry for cellulitis and osteomyelitis, so podiatry referral and a foot check; and — the step candidates miss — sets the 6–12 month expectation for response, and documents the nail examination findings."}
     ]}]},

  foot:"Nail disorders — NICE NG12 (May 2025), NICE NG19 (diabetic foot), NICE CG153 (psoriasis), British Association of Dermatologists onychomycosis guidelines and the BNF. A single pigmented or rapidly dystrophic nail is melanoma until proven otherwise, and mycological confirmation is required before any oral antifungal. Fungal skin infection elsewhere is covered by the <a href=\"fungal-skin-infection.html\">fungal skin infection protocol</a>; the reasoning pathway remains at the <a href=\"../algorithms/nail-disorders.html\">nail disorders pathway</a>. Verify all doses and interactions against the current BNF before prescribing."
