  stemSub:"One page for the whole presentation: screen first for subungual melanoma and hand-space infection, then classify by colour, texture and distribution — one nail localises, all twenty suggest systemic. Confirm onychomycosis with clippings before committing anyone to months of terbinafine, distinguish the psoriatic oil drop sign from fungus, never incise a herpetic whitlow, and treat nail dystrophy in a diabetic patient as a foot-risk problem rather than a cosmetic one.",

  meta:[
    {t:"Suspected cancer · NICE NG12 (updated April 2026) — melanoma 1.7.1–1.7.2; lung (finger clubbing)", tone:"tw"},

  ],
  lead:'<div class="mg-layers"><a href="#severe"><b>Exclude first</b><small>Melanoma · clubbing · hand sepsis</small></a><a href="#differential"><b>Differential</b><small>Fungus · psoriasis · others</small></a><a href="#confirm"><b>Classify</b><small>Colour · texture · infection</small></a><a href="#workup"><b>Assess</b><small>All 20 nails · mycology</small></a><a href="#ladder"><b>Treat</b><small>Confirm before prescribing</small></a><a href="#monitor"><b>Review</b><small>Slow response · surveillance</small></a></div>',
  quickSub:"If you read nothing else on this page, read these six cards. Every number traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"purple", h:"⚠ A single pigmented nail is melanoma until proven otherwise", html:"Hutchinson's sign — pigment extending onto the proximal or lateral nail fold or cuticle — is a strong pointer to subungual melanoma and needs specialist assessment and biopsy. Do not attribute progressive nail pigmentation in an adult to trauma or ethnic melanonychia without dermatology assessment. Subungual melanoma is a small share of melanoma in white populations but a much larger share in people with darker skin, where acral melanoma makes up more of the total. → <b>Dermatology suspected cancer pathway referral (NICE NG12, updated April 2026).</b>"},
    {tone:"red", h:"Never incise a herpetic whitlow", html:"Multiple clustered vesicles on an erythematous base with pain disproportionate to appearance, and no central fluctuance — incising it worsens the condition and spreads the virus. <b>Oral aciclovir (BNF dose for herpes simplex skin infection: 200 mg five times a day for 5 days).</b> This is the single most important error to avoid in an acutely painful finger."},
    {tone:"amber", h:"Clubbing is never dismissed", html:"Loss of the normal angle at the nail fold (about 160°), a fluctuant nail base and increased longitudinal curvature. Look for lung cancer (most important in smokers), mesothelioma, infective endocarditis, IBD, cirrhosis and cystic fibrosis. <b>Age 40 and over: consider an urgent chest X-ray within 2 weeks (NICE NG12 lung criteria list finger clubbing).</b> Febrile with a murmur: same-day assessment for endocarditis."},
    {tone:"blue", h:"Confirm the fungus before the tablet", html:"Positive mycology (microscopy and culture) comes before an oral antifungal — clinical diagnosis alone is not enough given the treatment length and side effects. Sample technique is the commonest reason for a false negative: clean with alcohol, sample the most PROXIMAL affected nail (not the dead distal edge), include subungual debris, and send a generous amount in a dry envelope or pot, not a swab. <b>A negative culture does not exclude fungus; repeat the sample if suspicion is high.</b>"},
    {tone:"blue", h:"The oil drop sign favours psoriasis over fungus", html:"A pink-salmon translucent discolouration of the nail bed that looks like a drop of oil under the nail is characteristic of psoriasis — more telling than onycholysis or subungual hyperkeratosis alone. If present, look for hidden psoriasis (hairline, natal cleft, umbilicus, ears) and ask about joints: nail disease is common in psoriatic arthritis and can come before the joint symptoms."},
    {tone:"cream", h:"Nail dystrophy in diabetes is a foot-risk problem", html:"Onychomycosis breaks the skin barrier and gives bacteria a way into a foot already compromised by neuropathy and microangiopathy. Take it seriously: confirm with mycology and treat (terbinafine 250 mg daily, usually 12–16 weeks for toenails — BAD 2014), and use the NICE NG19 foot assessment to decide on podiatry or foot-protection referral rather than dismissing it as cosmetic."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step takes 30 seconds and is the one that is skipped.",
  pathway:[
    {title:"Screen melanoma and hand-space infection", html:"A widening pigmented band or Hutchinson's sign → suspected cancer pathway referral. Acute paronychia with fluctuance → drainage; with Kanavel signs, a felon or lymphangitis → same-day hand surgery. New clubbing → investigate.", alert:true},
    {title:"Classify by pattern", html:"Colour (leukonychia, Terry's, Muehrcke's, melanonychia), texture (onycholysis, pitting, Beau's lines, koilonychia, splinter haemorrhages), infection (onychomycosis, paronychia, herpetic whitlow). <b>One nail localises; all twenty suggest systemic.</b>"},
    {title:"Examine all 20 nails and test appropriately", html:"<b>Nail plate, bed, folds, lunula and periungual skin</b> — plus nail clippings for mycology, FBC and ferritin, TFTs, LFTs and albumin, CXR as the pattern directs."},
    {title:"Treat the confirmed diagnosis", html:"Mycology-positive onychomycosis → terbinafine (or itraconazole). Psoriatic nails → treat the psoriasis. Koilonychia → correct the iron. Chronic paronychia → stop the wet work."},
    {title:"Review with the right clock", html:"Nails grow slowly — fingernails roughly 3 mm a month and toenails far slower — so allow 6–12 months before judging response. Melanonychia surveillance, LFT monitoring on terbinafine, and document the nail examination."}
  ],
  sections:[

    {id:"severe", nav:"Exclude first", title:"Red flags — malignancy, systemic disease and hand-space infection",
     sub:"A single pigmented or rapidly dystrophic nail is melanoma until proven otherwise, especially with a widening band or pigment spreading onto the nail fold.",
     blocks:[
       {b:"table", head:["Presentation","Suggests","Action"], rows:[
         ["Pigmented longitudinal band (melanonychia striata) + darkening + widening + irregular borders + Hutchinson's sign (pigment extending onto the nail fold or cuticle)","<b>Subungual melanoma.</b> Hutchinson's sign is a strong pointer","Dermatology suspected cancer pathway referral. Biopsy is a specialist decision. Do not attribute to trauma or ethnic melanonychia without dermatology assessment in any adult with progressive nail pigmentation"],
         ["<b>Nail change + clubbing</b> (loss of the normal angle of about 160° at the nail fold, fluctuant nail base, increased longitudinal curvature)","Lung cancer (most important in smokers), mesothelioma, bronchiectasis, infective endocarditis, IBD, cirrhosis, cystic fibrosis","Age 40 and over: consider urgent CXR within 2 weeks (NG12). Fever with a murmur: same-day medical assessment for endocarditis (blood cultures and echocardiogram in hospital). Do not dismiss clubbing"],
         ["<b>Acute paronychia + spreading cellulitis + lymphangitis</b> (red streaking up the forearm) + fever + systemic illness","<b>Ascending infection or a deep hand-space infection</b>","Same-day hand surgery or 999 if septic. IV antibiotics in hospital. Surgical drainage if a deep space is involved — flexor tenosynovitis, Kanavel signs: fusiform swelling, flexed finger posture, pain on passive extension, tenderness along the flexor tendon sheath"],
         ["<b>Felon</b> — tense, throbbing swelling of the finger pulp","Closed-space infection of the pulp","Same-day hand surgery for drainage"],
         ["Nail dystrophy + dyspnoea + cough + effusions + yellow-green discolouration of all nails","<b>Yellow nail syndrome</b> — with lymphoedema, pleural effusion, bronchiectasis, chronic sinusitis","<b>CXR + spirometry + lymphoedema assessment + respiratory referral</b>"],
         ["White nails + hypoalbuminaemia + oedema + chronic illness","<b>Muehrcke's lines</b> (paired white transverse bands parallel to the lunula — hypoalbuminaemia) or <b>Terry's nails</b> (white with a narrow distal pink-brown band — cirrhosis, heart failure, type 2 diabetes, CKD)","<b>LFTs + albumin + renal function + urine protein, and NT-proBNP if heart failure is suspected</b>"],
         ["Rapidly progressing nail destruction + periungual erythema + tenderness on anti-VEGF or EGFR inhibitor therapy","Drug-induced paronychia or nail toxicity from targeted cancer therapy","Contact the oncology team the same day. Topical corticosteroid + antiseptic while awaiting advice. Dose modification is the oncologist's decision"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"purple", h:"Suspected cancer · NICE NG12 (updated April 2026) — melanoma", html:"NG12 has no nail-specific criterion. Apply the skin criteria to the nail unit: <b>suspected cancer pathway referral for melanoma if a suspicious pigmented lesion scores 3 or more on the weighted 7-point checklist (1.7.1), or if dermoscopy suggests melanoma (1.7.2).</b> In practice: melanonychia with Hutchinson's sign, a band that is widening, darkening or changing, or nail dystrophy with periungual pigmentation.", src:"NICE NG12 (updated April 2026) recs 1.7.1 and 1.7.2"},
         {tone:"purple", h:"NICE NG12 (updated April 2026) — finger clubbing and lung cancer", html:"Finger clubbing is one of the findings for which NG12 advises considering an urgent chest X-ray (within 2 weeks) to assess for lung cancer or mesothelioma in people aged 40 and over. If the X-ray suggests lung cancer, or the clinical picture is highly suspicious, use the lung cancer suspected cancer pathway.", src:"NICE NG12 (updated April 2026) — lung and pleural cancers"},
         {tone:"red", h:"Hand-space infection", html:"Kanavel signs, a felon, or lymphangitis with systemic upset → same-day hand surgery (999 if septic). Do not manage a deep space infection with oral antibiotics alone.", src:"NICE NG141 (2019) cellulitis — refer if severe or systemically unwell"},
         {tone:"amber", h:"Drug-induced nail toxicity", html:"Painful periungual inflammation or pyogenic granuloma on an EGFR inhibitor or other targeted therapy → contact the oncology team the same day; do not stop the drug without them.", src:"SPC for the relevant EGFR inhibitor — paronychia listed as a common adverse effect"}
       ]},
       {b:"why", html:"Subungual melanoma is the most important life-threatening nail diagnosis to identify in primary care. It makes up a larger proportion of melanomas in people with darker skin, where acral lentiginous melanoma is relatively more common, and it usually presents in later adult life. The clinical challenge: benign longitudinal melanonychia is common in people with darker skin and can be entirely normal — the discriminating features are Hutchinson's sign, a band wider than 3 mm, irregular or blurred borders, several colours within the band, progressive widening or darkening, and nail dystrophy. The ABCDEF rule (Levit et al, J Am Acad Dermatol 2000): A (age — peak in later adulthood; African, Asian or Native American background), B (band — brown to black, width 3 mm or more, blurred borders), C (change in the band, or no improvement in a dystrophic nail despite treatment), D (digit — thumb, great toe or index finger; single digit more than several), E (extension of pigment onto the nail fold — Hutchinson's sign), F (family or personal history of melanoma or dysplastic naevi)."},
       {b:"why", html:"Beau's lines are one of the most useful retrospective signs in nail examination — transverse grooves caused by temporary cessation of nail matrix activity during significant systemic illness, severe nutritional deficiency or chemotherapy. Because fingernails grow at roughly 3 mm a month, the distance of the line from the proximal nail fold dates the precipitating illness — a groove 6 mm from the base occurred about 2 months ago, and one at 9 mm about 3 months ago, which can direct the history. <b>Multiple parallel lines indicate multiple separate insults.</b> Common causes: septicaemia, major surgery, severe infection, myocardial infarction, severe nutritional depletion and chemotherapy cycles."},
       {b:"dl", rows:[
         ["<b>NG12 — the criteria that apply here</b>","Two routes. Melanoma: NG12 has no nail-specific wording, so a suspicious pigmented nail band is judged by the skin criteria — weighted 7-point checklist score 3 or more, or dermoscopy suggesting melanoma — and referred on the suspected cancer pathway. Lung and pleural cancer: finger clubbing in someone aged 40 and over is a reason to consider an urgent chest X-ray within 2 weeks. The current version is NICE NG12 (updated April 2026); the April 2026 amendments did not change the melanoma or lung recommendations. Restated in <a href='#refer'>Refer</a>"]
       ]}
     ]},

    {id:"differential", nav:"Differential", title:"Differential diagnosis — the common nail problems side by side",
     sub:"Most dystrophic nails are fungal, psoriatic or traumatic. The discriminating features below decide the next step.",
     blocks:[
       {b:"table", head:["Condition","Discriminating features","Next step"], rows:[
         ["<b>Onychomycosis</b>","Often toenails, asymmetric; yellow-brown discolouration, subungual hyperkeratosis and distal onycholysis spreading proximally; tinea pedis often present","Clippings for microscopy and culture before any oral antifungal"],
         ["<b>Nail psoriasis</b>","Several nails, often fingernails; irregular pitting, oil drop or salmon patch, onycholysis with a red-brown border; psoriasis elsewhere or joint symptoms","Look for skin and joint disease; treat the psoriasis; mycology if fungus is also possible"],
         ["<b>Trauma</b>","Great toenails, footwear or sport history; subungual haematoma that grows out with the nail; no skin disease","Footwear advice; photograph and review a haematoma until it grows out"],
         ["<b>Subungual melanoma</b>","Single nail; brown-black band that widens or darkens; Hutchinson's sign; nail dystrophy","Dermatology suspected cancer pathway referral (NG12)"],
         ["<b>Lichen planus</b>","Thinning, longitudinal ridging, splitting, pterygium; may have oral or skin lichen planus","Dermatology referral early — scarring is permanent"],
         ["<b>Chronic paronychia</b>","Swollen proximal nail fold, lost cuticle, wet-work history; nail ridging secondary to fold inflammation","Stop wet work; topical imidazole with or without a topical steroid"],
         ["<b>Yellow nail syndrome</b>","All nails yellow-green, thick, slow-growing, curved; lymphoedema; chest disease","CXR, spirometry, respiratory referral"],
         ["<b>Systemic signs</b>","All nails: koilonychia (iron), Terry's (liver, heart, kidney), Muehrcke's (albumin), Beau's lines (past illness), clubbing","Investigate the underlying disease"]
       ]}
     ]},

    {id:"confirm", nav:"Classify", title:"Classification — colour, texture and infection",
     blocks:[
       {b:"dl", rows:[
         ["<b>Colour changes</b>","<b>White (leukonychia):</b> superficial — trauma, fungal; <b>Terry's nails</b> (mostly white with a narrow distal pink-brown band) = liver cirrhosis, heart failure, type 2 diabetes, CKD; <b>Muehrcke's lines</b> (paired white transverse bands that do not move with growth, reflecting the nail bed not the plate) = hypoalbuminaemia, and they fade when the albumin is corrected; <b>half-and-half nails</b> (proximal white, distal red-brown) = CKD. <b>Yellow:</b> fungal onychomycosis (most common), yellow nail syndrome, psoriasis, nicotine staining. <b>Brown or black:</b> melanonychia — ethnic, drug-induced, benign naevus, melanoma (Hutchinson's sign); subungual haematoma (recent trauma, painful). <b>Blue or purple:</b> cyanosis, argyria, antimalarials, minocycline"],
         ["<b>Texture and structure</b>","<b>Onycholysis</b> (separation from the bed): psoriasis, thyroid disease, trauma, drugs (tetracyclines, including doxycycline — photo-onycholysis), fungal. <b>Pitting:</b> psoriasis (multiple irregular pits), alopecia areata (geometric, grid-like), eczema. <b>Beau's lines:</b> systemic illness, nutritional deficiency, chemotherapy. <b>Koilonychia</b> (spoon nails): iron deficiency anaemia (classic), haemochromatosis, Raynaud's. <b>Splinter haemorrhages:</b> infective endocarditis (proximal, with systemic features) versus trauma (distal and asymptomatic — much the commonest)"],
         ["<b>Infections</b>","<b>Onychomycosis</b> — the most common nail disorder; <b>Trichophyton rubrum</b> the commonest cause; patterns are distal lateral subungual (DLSO, commonest), white superficial, proximal subungual, endonyx and candidal. <b>Paronychia</b> — acute (bacterial, usually S. aureus) versus chronic (irritant and wet-work driven, often with secondary Candida). <b>Herpetic whitlow</b> — vesicular, extremely painful, HSV-1 or HSV-2"],
         ["<b>Onychomycosis patterns</b>","<b>DLSO (most common):</b> distal onycholysis, subungual hyperkeratosis and yellow-brown discolouration progressing proximally. <b>WSO:</b> white powdery nail plate surface (T. mentagrophytes, moulds). <b>PSO:</b> a white area proximally under an intact plate — associated with immunosuppression. <b>Endonyx:</b> diffuse milky white nail without onycholysis. <b>Total dystrophic:</b> complete destruction in long-standing disease. <b>Candidal:</b> especially immunocompromised, mixed with chronic paronychia"],
         ["<b>Mimics of onychomycosis</b>","<b>Psoriasis</b> (onycholysis + subungual hyperkeratosis + pitting + oil drop sign) · <b>trauma</b> (haematoma, mechanical) · <b>lichen planus</b> (thinning, longitudinal ridging, pterygium formation — the nail fold fused to the plate) · <b>eczema</b> (irregular pitting, plate thickening) · <b>yellow nail syndrome</b>"],
         ["<b>Psoriatic nail features</b>","<b>Pitting</b> (deeper and more irregularly distributed than the geometric pitting of alopecia areata) · <b>onycholysis with the oil drop sign</b> · <b>subungual hyperkeratosis</b> (thick friable material under the plate) · <b>salmon patch</b> · <b>red lunula</b> (rare). Nail disease is common in psoriatic arthritis and can precede or occur without skin psoriasis"]
       ]},
       {b:"why", html:"The psoriatic oil drop sign is one of the more telling findings in dermatology — a pink, salmon or yellowish-brown translucent discolouration of the nail bed, usually proximally, resembling a drop of oil beneath the nail. The pathological correlate is foci of parakeratosis in the nail bed epithelium, the same process as a psoriatic plaque. It is more characteristic of psoriasis than onycholysis or subungual hyperkeratosis alone. Where the diagnosis is uncertain between fungal and psoriatic, the oil drop sign should prompt a look for psoriasis at hidden sites (hairline, natal cleft, umbilicus, ears) and questions about the joints, since nail changes may precede joint disease. Nail psoriasis with onycholysis and pitting should not be treated with systemic antifungals — mycology should confirm or exclude concurrent fungal infection first."}
     ]},

    {id:"workup", nav:"Assess", title:"History, examination and investigations",
     blocks:[
       {b:"table", head:["Domain","Detail"], rows:[
         ["<b>History</b>","<b>Duration and progression</b> (sudden = trauma or illness; gradual = chronic disease or fungal) · <b>all nails or a single nail</b> (single = localised — fungal, trauma, isolated psoriasis, tumour; all = systemic) · trauma (subungual haematoma) · skin and joint disease (psoriasis, eczema, lichen planus) · systemic disease (diabetes, thyroid, IBD, liver disease, CKD, connective tissue disease) · <b>occupation</b> (wet work, nail technician, chemical exposure, trauma, nail biting)"],
         ["<b>Drug history</b>","Tetracyclines (photo-onycholysis) · hydroxychloroquine (blue-brown nails) · anti-VEGF and EGFR inhibitors (paronychia) · chemotherapy (Beau's lines, onycholysis) · retinoids (thin nails). Also nail care — artificial and gel nails contribute to onycholysis and allergic contact dermatitis. Immunosuppression raises the risk of atypical fungal or bacterial nail infection"],
         ["<b>Examination — inspect all 20 nails systematically</b>","<b>Nail plate:</b> colour, surface texture (pitting, ridging, grooves), integrity. <b>Nail bed:</b> colour (cyanosis, Terry's, Muehrcke's), extent of onycholysis. <b>Lateral nail folds:</b> acute paronychia (swelling, pus), chronic paronychia (swelling, cuticle loss), <b>periungual pigmentation (Hutchinson's)</b>. <b>Lunula:</b> absent or red (red lunula in psoriasis and systemic disease). <b>Proximal nail fold: capillaroscopy</b> — dilated tortuous capillaries indicate connective tissue disease (systemic sclerosis, dermatomyositis). <b>Periungual:</b> tophi (gout). <b>Cuticle loss:</b> chronic paronychia, connective tissue disease. Check the feet, skin, scalp and joints too"],
         ["<b>Investigations</b>","<b>Nail clippings for mycology (microscopy and culture)</b> · <b>dermoscopy</b> for melanonychia (nail unit dermoscopy requires training) · <b>FBC + ferritin</b> (koilonychia) · <b>TFTs</b> (onycholysis) · <b>LFTs + albumin</b> (Terry's, Muehrcke's) · <b>ANA and extractable nuclear antigens</b> for capillaroscopy changes · <b>CXR</b> for clubbing · <b>HSV PCR swab</b> if a whitlow is uncertain · <b>pus for culture</b> when a paronychia is drained"]
       ]},
       {b:"warn", html:"Nail sampling technique matters, and poor technique is the commonest reason for a false-negative fungal culture. <b>(1) Clean the nail with 70% alcohol and allow to dry</b> — this removes contaminant bacteria that inhibit fungal growth. <b>(2) Collect from the most PROXIMAL affected part</b>, where the fungus is actively growing, cutting back as far as possible — not only the distal dystrophic free edge, which is mostly dead keratin. <b>(3) Include subungual debris</b> — this has the highest yield. (4) For white superficial onychomycosis, scrape the white material from the nail surface. <b>(5) Use a dry paper envelope or mycology pot, not a swab</b> — swabs are unsuitable for nail. <b>(6) Send a generous amount of material.</b> Even with good technique, culture misses a proportion of true infections, so a negative culture does not exclude fungal nail disease — repeat the sample if suspicion stays high; PCR-based testing is more sensitive where the laboratory offers it. Culture results take several weeks (BAD guideline, Ameen et al 2014)."}
     ]},

    {id:"ladder", nav:"Treat", title:"Onychomycosis, paronychia and nail psoriasis",
     blocks:[
       {b:"table", head:["Condition","Treatment"], rows:[
         ["<b>Onychomycosis — oral, mycology-confirmed</b>","<b>Terbinafine 250 mg once daily</b> — first-line for dermatophyte infection. <b>Fingernails 6 weeks; toenails 12–16 weeks</b> (BAD 2014). <b>Mycological cure about 76% with terbinafine versus 63% with pulsed itraconazole</b> (BAD 2014). <b>LFTs before starting</b>; the SPC advises repeating them after 4–6 weeks and stopping if they rise, or if rash, jaundice or other signs of liver injury appear. Avoid in hepatic impairment. Terbinafine inhibits <b>CYP2D6</b> — it raises levels of some antidepressants, antipsychotics and beta-blockers, so check BNF interactions"],
         ["<b>Itraconazole pulse therapy</b>","For <b>Candida or non-dermatophyte mould</b>, or terbinafine failure. 200 mg twice daily for 7 days each month — 2 pulses for fingernails, 3 for toenails (BNF). More interactions than terbinafine (<b>CYP3A4</b> — statins, some anticoagulants, many others). <b>Avoid in heart failure or ventricular dysfunction</b> (SPC)"],
         ["<b>Topical antifungal</b>","For limited distal disease: BAD 2014 advises topical treatment alone only when less than 80% of the nail is affected and the lunula (matrix) is spared. <b>Amorolfine 5% nail lacquer</b> once weekly (twice weekly may help) after filing — 6 months for fingernails, 9–12 months for toenails, reviewed every 3 months (SPC). Cure rates are lower than with oral treatment — use where disease is limited or oral treatment is unsuitable"],
         ["<b>Acute paronychia</b>","<b>Mild (no fluctuance):</b> warm soaks several times a day to encourage drainage, plus a topical antiseptic. <b>Antibiotic only if</b> spreading cellulitis, systemic illness or immunocompromise — treat as cellulitis per NICE NG141 (2019): <b>flucloxacillin 500 mg to 1 g four times daily for 5–7 days</b>, or clarithromycin 500 mg twice daily if penicillin-allergic. <b>Fluctuant:</b> incision and drainage — digital block and release of pus along the lateral nail fold, in primary care if trained or in an urgent treatment centre; culture the pus"],
         ["<b>Herpetic whitlow</b>","Oral aciclovir 200 mg five times a day for 5 days (BNF, herpes simplex skin infection; 400 mg in the immunocompromised), plus analgesia and a loose dressing. Do NOT incise — this spreads the virus"],
         ["<b>Chronic paronychia</b>","Caused by repeated wet work, chemical irritants and secondary Candida. <b>(1) Avoid wet work</b> (waterproof gloves with a cotton liner); <b>(2) topical imidazole</b> — miconazole or clotrimazole cream to the nail folds for several weeks; <b>(3) topical corticosteroid</b> to settle the inflammation, or a combined imidazole plus corticosteroid cream. Refractory: dermatology (systemic treatment, nail fold surgery)"],
         ["<b>Nail psoriasis</b>","<b>Topical first-line:</b> a potent topical corticosteroid, or calcipotriol with betamethasone, to the proximal nail fold and under the free edge, for several months. Nails grow slowly — allow 6–12 months before assessing response. <b>Intralesional triamcinolone</b> into the proximal nail fold (dermatology). <b>Systemic and biologic treatment</b> — dermatology-initiated for severe or disabling nail disease or psoriatic arthritis (NICE CG153, 2012)"],
         ["<b>Koilonychia and systemic signs</b>","Treat the iron deficiency and find its cause — see the <a href='iron-deficiency-anaemia.html'>iron deficiency anaemia protocol</a>; continue iron for about 3 months after the haemoglobin normalises to replenish stores (BSG 2021). Koilonychia can lag for months behind the blood count because the new nail must grow out. <b>Proximal splinter haemorrhages with fever and a murmur:</b> same-day medical admission — blood cultures before antibiotics and echocardiography in hospital. <b>Distal splinters are usually benign</b> (trauma, manual work) — no investigation if isolated and the patient is well. <b>Terry's and Muehrcke's:</b> treat the underlying liver disease, nephrotic syndrome or malnutrition"]
       ]},
       {b:"why", html:"The herpetic whitlow distinction from bacterial paronychia is critical, because incising a herpetic whitlow worsens it and spreads the virus. Herpetic whitlow presents as multiple clusters of vesicles on an erythematous base with intense burning or throbbing pain disproportionate to the appearance, and without the central fluctuance of a bacterial abscess. The tell-tale features: vesicles rather than a single pointing abscess, absence of purulent exudate, and disproportionate pain. Risk groups: dental and medical workers, and patients with oral or genital herpes (autoinoculation). If uncertain, swab for HSV PCR and treat empirically with an antiviral while awaiting the result — do not perform incision and drainage."},
       {b:"why", html:"Lichen planus of the nails needs early dermatology referral to prevent permanent destruction — it affects a minority of people with lichen planus and can occur without skin or mucosal disease. Changes include thinning, brittleness, longitudinal ridging (onychorrhexis), fraying, loss of shine and — crucially — pterygium formation, the forward growth of the proximal nail fold over the plate caused by matrix scarring. Pterygium is permanent: once the matrix is scarred, no further nail grows in that area. Early specialist treatment with potent topical or intralesional corticosteroid, before scarring is established, is what prevents it."},
       {b:"why", html:"<b>Biologics have changed the outlook for severe nail psoriasis</b>, with response measured on the <b>NAPSI (Nail Psoriasis Severity Index)</b> — each nail is divided into quadrants and scored for matrix and nail bed features, giving 0–8 per nail (Rich and Scher, J Am Acad Dermatol 2003). Trials of anti-IL-17, anti-IL-23 and anti-TNF agents report meaningful nail improvement, but nail psoriasis responds more slowly than plaque psoriasis: the first 3–6 months of biologic treatment may show little nail change because the nail must physically grow out. Counselling patients about this lag prevents premature discontinuation of an effective treatment."}
     ]},

    {id:"lifestyle", nav:"Nail care", title:"Prevention, footwear and occupational exposure",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"🦶 Onychomycosis prevention", html:"Keep nails dry and trimmed short. Dry between the toes after bathing — moisture drives tinea pedis and secondary nail infection. Avoid walking barefoot in gym showers, pools and changing rooms. Change socks daily. Treat tinea pedis promptly: it is the usual reservoir for nail infection — a topical azole or terbinafine per BNF, continued until the skin has cleared. Antifungal powder in shoes can help prevent recurrence.", src:"BAD onychomycosis guideline (Ameen et al, 2014) — tinea pedis as reservoir; BNF topical antifungals"},
         {tone:"blue", h:"👟 Footwear", html:"Tight footwear causes trauma-induced onycholysis and subungual haematoma in the first and second toes. <b>Wide toe box, about 1 cm of space beyond the longest toe, low heel.</b> Ill-fitting running shoes cause repetitive microtrauma and nail dystrophy in runners. In diabetes, footwear advice is part of the foot assessment.", src:"NICE NG19 (2015) — foot assessment includes footwear"},
         {tone:"amber", h:"💧 Wet work and chronic paronychia", html:"Prolonged or frequent wet work is the commonest cause of chronic paronychia — healthcare workers, kitchen staff, cleaners, hairdressers, swimmers. Waterproof gloves with a cotton liner, emollient after work, and cuticle oil. <b>The cuticle is a biological barrier — do not trim or push it back</b>, a common nail salon practice that lets moisture and microorganisms into the nail fold.", src:"BAD onychomycosis guideline (2014) — chronic paronychia and Candida"},
         {tone:"amber", h:"💅 Artificial and gel nails", html:"Can cause onycholysis from filing and trapped moisture, chronic paronychia, and allergic contact dermatitis to (meth)acrylates — increasingly common, and relevant to later dental and medical adhesives. Patch testing if periungual dermatitis develops. Removal allows assessment of the underlying nail and resolution of inflammation."},
         {tone:"cream", h:"🩺 Diabetes and nail care", html:"Onychomycosis in diabetes breaks the skin barrier and raises the risk of cellulitis and deeper infection. <b>Confirm and treat (terbinafine 250 mg daily, 12–16 weeks for toenails).</b> The NICE NG19 foot assessment includes the nails, footwear, a 10 g monofilament neuropathy test and pulses; refer to the foot protection service or podiatry according to the risk level.", src:"NICE NG19 (2015); BAD onychomycosis guideline (2014)"},
         {tone:"cream", h:"🚭 Smoking", html:"Nicotine staining of the fingernails and periungual skin fades after stopping as the nail grows out. More importantly, smoking increases the risk of psoriasis, peripheral arterial disease and lung cancer (associated with clubbing). Offer stop-smoking support.", src:"NICE NG209 (2021) stop-smoking support"},
         {tone:"blue", h:"🔍 Nails as a window on systemic health", html:"<b>Opportunistic nail examination at chronic disease reviews:</b> koilonychia (iron deficiency), Terry's nails (liver disease, including in people who drink heavily), Beau's lines (recent significant illness), splinter haemorrhages, clubbing. Document the findings — a “nails normal” entry demonstrates proactive assessment.", src:"NICE NG12 (updated April 2026) — clubbing in the lung criteria"},
         {tone:"blue", h:"🗣️ What patients should watch for", html:"A new dark streak that is widening or spreading onto the skin → urgent review. New finger clubbing → GP for a chest X-ray. New pale nails with fatigue → blood test. Nail fold redness or visible dilated vessels with joint symptoms → review for connective tissue or psoriatic joint disease.", src:"NICE NG12 (updated April 2026); NICE CG153 (2012)"}
       ]},
       {b:"why", html:"The diabetic patient with onychomycosis deserves more proactive treatment than the “wait and see” approach often used in people without diabetes. In the diabetic foot the skin barrier in the toe webs and around the nail is already compromised by neuropathy (reduced protective sensation), microangiopathy (impaired healing) and dry, cracked skin. Onychomycosis adds a portal of entry for Staphylococcus aureus and gram-negative organisms that can progress to cellulitis, osteomyelitis and ultimately amputation. The NICE NG19 foot assessment includes the nails, so annual reviews should identify onychomycosis, confirm it with mycology and treat it rather than dismissing it as cosmetic."}
     ]},

    {id:"monitor", nav:"Review", title:"Follow-up, monitoring and surveillance",
     sub:"Nails grow slowly — response is judged in months, not weeks.",
     blocks:[
       {b:"table", head:["What","Detail"], rows:[
         ["<b>Onychomycosis monitoring</b>","LFTs before oral terbinafine and again at 4–6 weeks (SPC). Stop immediately if rash, jaundice, dark urine, abdominal pain or rising LFTs. Review at completion: mycological cure and clinical cure (normal appearance may take additional months as the new nail grows out). Recurrence is common, and re-treatment should follow repeat mycology"],
         ["<b>Melanonychia surveillance</b>","Where specialist assessment has judged a band benign: photograph and measure every 3–6 months. Return urgently if the width increases, borders become irregular, Hutchinson's sign appears, colour becomes heterogeneous, or nail dystrophy develops. Any new pigmented band in an adult: photograph, measure, dermoscopy if available, and refer if there is any concern. If a patient declines a suspected cancer pathway referral, document the discussion and the safety-net"],
         ["<b>Psoriatic nail review</b>","At 3–6 months: NAPSI score or clinical assessment, and functional impact. If topical treatment is inadequate → dermatology for intralesional steroid or systemic treatment. <b>Screen for psoriatic arthritis</b> (NICE CG153 recommends annual screening with the PEST questionnaire in people with psoriasis) — ask about DIP joint pain, early morning stiffness and dactylitis"],
         ["<b>Systemic nail signs</b>","Terry's nails and Muehrcke's lines: follow the underlying condition's monitoring. Beau's lines: document, date the illness, review at about 6 months (fingernail lines should have grown out). Clubbing: re-examine at reviews and repeat the chest X-ray if new chest symptoms develop or clubbing progresses"],
         ["<b>Fungal nail review</b>","Review at 3–6 months — response is slow. Reassess if there is no improvement or the diagnosis is uncertain"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 999 / same-day", html:"Flexor tenosynovitis (Kanavel signs) or a felon → hand surgery same day · spreading cellulitis with lymphangitis from a paronychia → same-day assessment for IV antibiotics.", src:"NICE NG141 (2019) cellulitis — severity and referral"},
         {tone:"purple", h:"🟣 Suspected cancer · NICE NG12 (updated April 2026)", html:"Hutchinson's sign, or a pigmented band scoring 3 or more on the weighted 7-point checklist, or dermoscopy suggesting melanoma → dermatology suspected cancer pathway referral (appointment within 2 weeks) · new progressive nail pigmentation without a clear benign cause in any adult.", src:"NICE NG12 (updated April 2026) recs 1.7.1 and 1.7.2"},
         {tone:"amber", h:"🟠 Don't dismiss", html:"<b>New clubbing → investigate: urgent chest X-ray within 2 weeks if 40 or over, and onward as indicated.</b>", src:"NICE NG12 (updated April 2026) — lung cancer"},
         {tone:"green", h:"📋 Document it", html:"The nail examination takes about 30 seconds — inspect hands and feet systematically at relevant chronic disease reviews and record the findings.", src:"NICE NG19 (2015) — annual foot assessment"}
       ]},
       {b:"why", html:"Documenting nail examination findings at chronic disease reviews is a simple quality and medicolegal standard. GPs performing annual diabetic foot checks, heart failure, COPD and IBD reviews are expected to examine relevant physical signs including the nails. A note stating “nails: koilonychia noted for first time — ferritin requested” demonstrates appropriate clinical observation. Conversely, a review note that does not mention nail examination, where the patient subsequently presents with a subungual melanoma that was present at the time, is hard to defend."},
       {b:"say", html:"Most nail problems are either fungal or related to psoriasis, and both are treatable — but I do not want to start you on months of tablets without first confirming what it is, so I am going to take some nail clippings. The one thing I always check for is a dark streak in a single nail, particularly if it is widening or the colour is spreading onto the skin at the base, because that needs a specialist opinion quickly. Whatever we treat, be patient with it: nails grow slowly, especially toenails, so it takes six to twelve months before we can judge whether treatment has worked."}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999 / same-day hand surgery", html:"Acute paronychia with flexor tenosynovitis (Kanavel signs — fusiform swelling, flexed posture, pain on passive extension, flexor sheath tenderness) · a felon · spreading cellulitis with lymphangitis from a finger infection.", src:"NICE NG141 (2019) cellulitis — refer if severe or systemically unwell"},
         {tone:"purple", h:"Dermatology suspected cancer referral · NICE NG12 (updated April 2026) — melanoma", html:"Suspected cancer pathway referral for melanoma if a suspicious pigmented lesion scores 3 or more on the weighted 7-point checklist, or dermoscopy suggests melanoma. Applied to the nail: melanonychia with Hutchinson's sign · a progressively widening or darkening pigmented band without a clear benign cause · nail dystrophy with periungual pigmentation in any patient.", src:"NICE NG12 (updated April 2026) recs 1.7.1 and 1.7.2"},
         {tone:"purple", h:"NICE NG12 (updated April 2026) — clubbing", html:"Aged 40 and over with finger clubbing: consider an urgent chest X-ray within 2 weeks to assess for lung cancer or mesothelioma; use the lung suspected cancer pathway if the X-ray suggests cancer.", src:"NICE NG12 (updated April 2026) — lung and pleural cancers"},
         {tone:"amber", h:"Dermatology (urgent or routine)", html:"Lichen planus of the nails (pterygium formation — early treatment prevents permanent damage) · yellow nail syndrome · drug-induced nail toxicity (anti-VEGF, EGFR, with oncology) · nail biopsy needed · chronic paronychia not responding to topical treatment · diagnostic uncertainty after negative mycology.", src:"BAD onychomycosis guideline (2014); NICE CG153 (2012)"},
         {tone:"blue", h:"Rheumatology", html:"Psoriatic nail changes with joint symptoms (psoriatic arthritis) · capillaroscopy changes at the proximal nail fold (systemic sclerosis, dermatomyositis) · nail changes with systemic autoimmune features.", src:"NICE CG153 (2012) — refer suspected psoriatic arthritis to rheumatology"},
         {tone:"green", h:"Podiatry or foot protection service", html:"<b>People with diabetes and nail dystrophy, deformity, callus or neuropathy</b> — high risk of secondary bacterial infection; route by the NG19 risk level.", src:"NICE NG19 (2015)"},
         {tone:"cream", h:"GP management (the majority)", html:"Onychomycosis: confirm with mycology then terbinafine (or itraconazole). Acute paronychia: warm soaks plus topical antiseptic, drainage if fluctuant. Chronic paronychia: topical imidazole plus removal of wet work. Koilonychia: treat and investigate the iron deficiency. Splinter haemorrhages without systemic features: reassurance and review.", src:"BAD onychomycosis guideline (2014); BNF"}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 62-year-old asks for “something for fungal toenails”, having tried an over-the-counter lacquer for a year. On examining all twenty nails you find thickened yellow great toenails — and, incidentally, a 4 mm brown longitudinal band in the right thumbnail that he says has been “there a while but looks darker”, with faint pigment at the cuticle. He has type 2 diabetes.", src:"NICE NG12 (updated April 2026) — melanoma"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Examines all 20 nails rather than only the presenting complaint — which is how the thumb band is found; <b>recognises Hutchinson's sign and refers on the suspected cancer pathway rather than reassuring</b>; takes clippings for mycology before prescribing terbinafine, and knows clinical diagnosis alone is insufficient; <b>checks baseline LFTs and screens for CYP2D6 interactions</b>; treats the diabetes as raising the stakes — portal of entry for cellulitis and osteomyelitis, so a foot assessment and podiatry as the risk level indicates; and — the step candidates miss — sets the 6–12 month expectation for response, and documents the nail examination findings.", src:"BAD onychomycosis guideline (2014); NICE NG19 (2015)"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — melanoma 1.7.1 (weighted 7-point checklist score 3 or more) and 1.7.2 (dermoscopy suggests melanoma), applied to the nail unit; lung and pleural cancer recommendations that include finger clubbing as a reason to consider an urgent chest X-ray in people aged 40 and over</span></li>'+
         '<li><b>Ameen M et al. British Association of Dermatologists guidelines for the management of onychomycosis 2014. Br J Dermatol 2014;171:937–58</b><br><a href="https://pubmed.ncbi.nlm.nih.gov/25409999/" rel="noopener">PubMed 25409999</a><span class="rd"> — mycological confirmation and sampling, terbinafine 6 weeks (fingernails) and 12–16 weeks (toenails), mycological cure 76% terbinafine versus 63% pulsed itraconazole, topical treatment alone only if under 80% of the nail with the lunula spared</span></li>'+
         '<li><b>Terbinafine and amorolfine (Loceryl) SPCs</b><br><a href="https://www.medicines.org.uk/emc" rel="noopener">medicines.org.uk/emc</a><span class="rd"> — LFTs before terbinafine and at 4–6 weeks; amorolfine once weekly (twice may help), 6 months fingernails, 9–12 months toenails, 3-monthly review</span></li>'+
         '<li><b>NICE NG19 — Diabetic foot problems: prevention and management (2015, updated 2019)</b><br><a href="https://www.nice.org.uk/guidance/ng19" rel="noopener">nice.org.uk/guidance/ng19</a><span class="rd"> — foot assessment including a 10 g monofilament test, risk stratification and referral to foot protection services</span></li>'+
         '<li><b>NICE CG153 — Psoriasis: assessment and management (2012, updated 2017)</b><br><a href="https://www.nice.org.uk/guidance/cg153" rel="noopener">nice.org.uk/guidance/cg153</a><span class="rd"> — annual psoriatic arthritis screening with PEST, rheumatology referral for suspected psoriatic arthritis, and specialist systemic and biologic treatment</span></li>'+
         '<li><b>NICE NG141 — Cellulitis and erysipelas: antimicrobial prescribing (2019)</b><br><a href="https://www.nice.org.uk/guidance/ng141" rel="noopener">nice.org.uk/guidance/ng141</a><span class="rd"> — antibiotic choice where a paronychia is complicated by spreading cellulitis, and when to refer</span></li>'+
         '<li><b>British Society of Gastroenterology — guidelines for the management of iron deficiency anaemia in adults (Snook et al, Gut 2021)</b><span class="rd"> — continue iron for about 3 months after the haemoglobin normalises</span></li>'+
         '<li><b>Levit EK et al. The ABC rule for clinical detection of subungual melanoma. J Am Acad Dermatol 2000</b><span class="rd"> — the ABCDEF features of subungual melanoma</span></li>'+
         '<li><b>Rich P, Scher RK. Nail Psoriasis Severity Index. J Am Acad Dermatol 2003</b><span class="rd"> — the NAPSI score, 0–8 per nail</span></li>'+
         '<li><b>NICE NG209 — Tobacco: preventing uptake, promoting quitting and treating dependence (2021)</b><br><a href="https://www.nice.org.uk/guidance/ng209" rel="noopener">nice.org.uk/guidance/ng209</a><span class="rd"> — stop-smoking support</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — terbinafine, itraconazole (pulse regimen), amorolfine, flucloxacillin, clarithromycin, aciclovir, topical corticosteroids and calcipotriol with betamethasone: doses and interactions</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Nail disorders — NICE NG12 (updated April 2026), the British Association of Dermatologists onychomycosis guideline (2014), NICE NG19 (diabetic foot), NICE CG153 (psoriasis), NICE NG141 (cellulitis), the SPCs and the BNF. A single pigmented or rapidly dystrophic nail is melanoma until proven otherwise, and mycological confirmation is required before any oral antifungal. Fungal skin infection elsewhere is covered by the <a href=\"fungal-skin-infection.html\">fungal skin infection protocol</a>. Verify all doses and interactions against the current BNF before prescribing."
