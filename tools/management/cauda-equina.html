<script>
MG.render({
  icon:"🦴",
  title:"Cauda equina syndrome — the complete guide",
  eyebrow:"Protocol · NICE NG59 · GIRFT/SBNS · refer at first suspicion, not on a complete syndrome",
  stemTitle:"The prognosis is set by which stage the patient reaches before decompression — and the step change is painless retention with overflow, after which the chance of recovering bladder, bowel and sexual function falls sharply",
  stemSub:"One page for the emergency. Compression of the lumbosacral roots below L1, most often a large central disc prolapse, sometimes metastatic. Refer on suspicion — an incomplete or evolving picture still warrants emergency MRI, and waiting for the full syndrome is waiting for the stage with the worse outcome. Two things primary care must actually do rather than defer: <b>examine perianal sensation and anal tone</b>, and <b>phone the receiving team</b> — a written referral is too slow for a condition that evolves over hours. Steroids only if the cause is malignant.",
  guideline:"NICE NG59 · NG234 · GIRFT/SBNS CES pathway · GMEC Palliative",
  reviewed:"13 September 2026",
  nextReview:"13 March 2027",
  meta:[
    {t:"NICE NG59 — low back pain and sciatica"},
    {t:"GIRFT / SBNS national cauda equina pathway"},
    {t:"Saddle anaesthesia or anal tone loss = MRI today", tone:"tw"},
    {t:"Steroids ONLY if malignant cause", tone:"tw"},
    {t:"v1.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#safety"><b>Red flags</b><small>Ask specifically</small></a><a href="#examine"><b>Examine</b><small>PR · perianal · bladder</small></a><a href="#stage"><b>Stage</b><small>CESS · CESI · CESR</small></a><a href="#act"><b>Act</b><small>Phone · steroid if malignant</small></a><a href="#after"><b>After</b><small>Continence · rehab</small></a></div>',
  quickSub:"The six that decide whether continence is preserved. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Refer at the FIRST suspicion, not on a complete syndrome", html:"Bilateral sciatica · saddle or perianal anaesthesia · bladder dysfunction (hesitancy, poor stream, retention, painless overflow, loss of the urge to void) · faecal incontinence or loss of anal tone · new sexual dysfunction. <b>Any one of these warrants emergency same-day MRI and referral.</b> An incomplete or evolving picture still qualifies — the full syndrome is the stage you are trying to prevent, not the threshold for acting."},
    {tone:"red", h:"⚠ Painless retention with overflow is the prognostic cliff", html:"CES-Incomplete (altered urinary sensation, poor stream, straining, but voluntary control RETAINED) is the critical window — decompression here gives the best outcome. CES-Retention (painless retention with overflow incontinence and extensive saddle anaesthesia) is established disease with a far worse prognosis. The whole urgency of this pathway is about getting the patient decompressed while still in the incomplete stage."},
    {tone:"amber", h:"Examine perianal sensation and anal tone — do not defer it", html:"Test light touch and pinprick across the S2–S5 saddle dermatomes, comparing sides, and do a digital rectal examination for resting tone and voluntary squeeze. <b>Reduced tone is a late and ominous sign.</b> Palpate for a distended bladder and get a post-void residual volume if you can — it is the one bedside measure that objectively flags evolving retention, and it is the baseline the receiving team will judge progression against."},
    {tone:"blue", h:"Refer by PHONE — do not wait to arrange imaging yourself", html:"Whole-spine or lumbosacral MRI is the definitive test and must not be delayed, but in practice it is arranged emergently BY the spinal or oncology team you have phoned — it is not a precondition for referral. Speak to the receiving team directly; a letter or e-referral alone is too slow for something that evolves over hours."},
    {tone:"amber", h:"Steroids only if the cause is malignant", html:"Malignant compression: dexamethasone 16 mg orally stat (or 13.2 mg IV/SC), continued with a PPI — it reduces peri-tumour oedema, exactly as in <a href='mscc.html'>MSCC</a>, followed by radiotherapy with or without surgery. <b>Disc-related CES: steroids have NO role.</b> The treatment is emergency surgical decompression — analgesia, catheterise if in retention, and keep nil by mouth if surgery is likely."},
    {tone:"green", h:"The documented safety-net is the primary-care safeguard", html:"Every patient you see with low back pain or sciatica should be told the red flags in plain words and told to go to A&amp;E immediately — and you should record that you did. CES commonly evolves out of ordinary back pain, and delayed diagnosis is a leading source of avoidable severe harm and of litigation. The record of the red-flag enquiry, the perianal examination and the time of onset is both good care and the key medicolegal protection."}
  ],
  pathwaySub:"Five steps, and steps one to four belong in a single consultation.",
  pathway:[
    {title:"Ask the red-flag questions specifically", html:"Do not ask \"any bladder problems?\" — ask about sensation when wiping, whether the stream feels normal, whether they can tell when the bladder is full, and about numbness between the legs. In a patient with known or suspected cancer, treat these features as malignant compression.", alert:true},
    {title:"Examine — including the parts that get skipped", html:"Perianal sensation (S2–S5), digital rectal examination for tone and squeeze, lower-limb power, reflexes and sensory level, bladder palpation and a post-void residual."},
    {title:"Stage it, because the stage is the prognosis", html:"CESS (symptoms, no objective signs) · CESI (altered sensation, control retained) · CESR (painless retention with overflow). All three warrant emergency MRI; CESI is the window you are trying to operate within."},
    {title:"Phone the receiving team, and treat the cause", html:"Spinal surgery for benign causes; acute and clinical oncology for malignant. Dexamethasone 16 mg with a PPI only if malignant. Analgesia, catheter if retained, nil by mouth if surgery likely."},
    {title:"Afterwards: continence, rehabilitation, and honesty", html:"Deficits frequently persist and recover slowly over months. Intermittent self-catheterisation, bowel regimen, specialist continence nursing, physiotherapy, neuropathic pain management, and explicit attention to sexual function."}
  ],
  sections:[

    {id:"safety", nav:"Red flags", title:"The red flags — and how to ask about them",
     sub:"The window to preserve bladder, bowel and sexual function is short, so the threshold for emergency imaging has to be very low.",
     blocks:[
       {b:"table", head:["Red flag","How to ask or test","Note"], rows:[
         ["<b>Bilateral sciatica</b>","<b>Leg pain down both legs, or alternating between them</b>","<b>Considerably more sinister than unilateral sciatica</b> — the single most useful discriminator from ordinary <a href='sciatica.html'>sciatica</a>"],
         ["<b>Saddle anaesthesia</b>","Numbness or paraesthesia of the perineum, perianal area, genitals or inner thighs. <b>Ask specifically about sensation when wiping</b>, then test sensation","Patients do not volunteer this — it has to be asked about in words they will recognise"],
         ["<b>Bladder dysfunction</b>","Hesitancy, poor stream, retention, painless overflow incontinence, or loss of the urge and awareness of bladder filling","<b>Loss of the sensation of filling precedes retention</b> — asking \"can you tell when you need to go?\" catches it earlier than asking about incontinence"],
         ["<b>Bowel dysfunction</b>","Faecal incontinence, loss of the sensation of rectal fullness, reduced or absent anal tone","Reduced tone is late and ominous"],
         ["<b>Sexual dysfunction</b>","<b>New erectile or ejaculatory failure, or genital sensory loss</b>","Easily omitted from the history; part of the same root distribution"],
         ["<b>Cancer context</b>","Known or suspected malignancy with any of the above → treat as malignant cord or cauda compression","Metastases: breast, prostate, lung, myeloma. Manage as <a href='mscc.html'>MSCC</a> — steroid, then oncology"]
       ]},
       {b:"say", html:"I need to ask you some specific questions, and a couple are quite personal — they are about nerves at the bottom of the spine. Have you noticed any numbness between your legs, around your back passage, or when you wipe? Can you still tell when your bladder is full and you need to pass urine? Is the stream normal, or are you having to strain or wait? Any change in control of your bowels, or any new numbness there? And has there been any change in sexual sensation? … The reason I am asking all of that is that there is one uncommon but serious cause of back pain where those nerves get squeezed, and it needs a scan the same day. If any of those things start or get worse — even tonight — go straight to A&E. Do not wait to ring us."},
       {b:"warn", html:"<b>Do not falsely reassure yourself with an incomplete picture.</b> Evolving or partial signs still warrant emergency MRI — the complete syndrome is the outcome you are trying to avert, not the entry criterion. And the commonest real-world failure is not a missed examination but a missed CHANGE: a patient already known to have back pain, whose new bilateral leg symptoms get absorbed into the existing diagnosis. New or changed symptoms in known back pain are a fresh assessment."},
       {b:"dl", rows:[
         ["<b>Causes — benign</b>","Large central lumbar disc prolapse (commonest), spinal stenosis, trauma, epidural haematoma, epidural abscess"],
         ["<b>Causes — malignant</b>","<b>Metastatic compression — breast, prostate, lung, myeloma.</b> In a patient with cancer, suspect this first and manage on the MSCC footing"]
       ]}
     ]},

    {id:"examine", nav:"Examine", title:"The examination — the parts that must not be skipped",
     blocks:[
       {b:"table", head:["What","How","Why"], rows:[
         ["<b>Perianal sensation</b>","Light touch and pinprick across all perianal and saddle dermatomes (S2–S5), comparing left with right","The objective correlate of the saddle symptom, and part of the staging"],
         ["<b>Anal tone — digital rectal examination</b>","<b>Resting tone and voluntary squeeze</b>","<b>Reduced tone is a late, ominous sign.</b> Its presence or absence changes the stage and therefore the prognosis"],
         ["<b>Lower-limb neurology</b>","Power, reflexes including ankle jerks, sensation; look for a sensory level","Establishes severity and gives the baseline for progression"],
         ["<b>Bladder</b>","Palpate for a distended bladder; measure a post-void residual volume by bladder scan where available","A high residual objectively supports retention and urgency — and it is the one bedside number that flags evolving CESR"],
         ["<b>Documentation</b>","Record the red-flag enquiry, perianal sensation, anal tone, post-void residual and the TIME OF ONSET","Clinically essential as the baseline, and medicolegally essential in a condition where delay is a recognised cause of permanent harm"]
       ]},
       {b:"why", html:"The perianal and rectal examination is skipped more often than any other part of this assessment, usually because it feels disproportionate in a patient who looks well and is walking. But it is what separates CES-suspected from CES-incomplete from CES-retention, and those three labels carry materially different prognoses — so the examination is not confirming a decision you have already made, it is generating the information the surgical team triage on. A post-void residual adds an objective number to a history of soft urinary symptoms, which is exactly what makes a phone referral persuasive."}
     ]},

    {id:"stage", nav:"Stage", title:"Staging — why it is not academic",
     blocks:[
       {b:"table", head:["Stage","Definition","Implication"], rows:[
         ["<b>CES-Suspected (CESS)</b>","Bilateral radiculopathy or red-flag symptoms, but NO objective sphincter or saddle signs yet","<b>Still warrants emergency MRI.</b> This is the stage at which referral has the most to offer"],
         ["<b>CES-Incomplete (CESI)</b>","Altered urinary sensation, poor stream, straining — but voluntary control RETAINED","The critical window: decompression here gives the best functional outcome"],
         ["<b>CES-Retention (CESR)</b>","Painless urinary retention with overflow incontinence and extensive saddle anaesthesia","Established CES with a significantly worse prognosis for recovery of bladder, bowel and sexual function"]
       ]},
       {b:"info", html:"The step from CESI to CESR is the point at which the prognosis falls sharply — which is the entire reason this pathway is measured in hours rather than days. Separating benign disc disease from malignant compression then determines whether the answer is a surgeon or an oncologist, and that distinction is made on the MRI, not clinically."}
     ]},

    {id:"act", nav:"Act", title:"Immediate action, referral and definitive treatment",
     blocks:[
       {b:"table", head:["Situation","Action","Notes"], rows:[
         ["<b>All suspected CES</b>","Phone the receiving team and arrange emergency same-day MRI. Adequate analgesia. Catheterise if in retention. Nil by mouth if surgery is likely","Refer on clinical suspicion — imaging is arranged emergently by the receiving team, not held up while primary care organises it"],
         ["<b>Malignant compression</b>","Dexamethasone 16 mg orally stat (or 13.2 mg IV/SC using the 3.3 mg/mL preparation), then continue with a PPI","Reduces peri-tumour oedema; then urgent radiotherapy with or without surgery, as for <a href='mscc.html'>MSCC</a>. Monitor glucose"],
         ["<b>Benign (disc) CES</b>","NO steroid. Urgent spinal surgical referral for emergency decompression","<b>Steroids have no role in disc-related CES</b> — the treatment is decompression, and the speed of it predicts recovery"],
         ["<b>Timing — disc-related</b>","<b>Decompression ideally within 24 hours and at most 48 hours of onset</b>","<b>Best outcomes when performed BEFORE retention develops</b>"],
         ["<b>Timing — malignant</b>","<b>Urgent radiotherapy within 24 hours, under dexamethasone cover</b>","Surgical decompression and stabilisation for selected patients — good performance status, single level, mechanical instability"],
         ["<b>Epidural abscess</b>","<b>Surgical drainage plus antibiotics</b>","Suspect with fever, systemic upset, injecting drug use or immunosuppression"],
         ["<b>Epidural haematoma</b>","<b>Reverse anticoagulation and decompress</b>","Suspect in an anticoagulated patient with sudden onset"],
         ["<b>If MRI is contraindicated</b>","Discuss urgently with the spinal or neurosurgical team for alternative imaging","Not a reason to downgrade the urgency"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"📞 Phone, don't write", html:"Every hour matters. Speaking directly to the spinal or oncology team is what converts a suspicion into timely decompression. A letter or e-referral alone is too slow for an emergency that evolves over hours. State the red flags, the examination findings, the post-void residual and the time of onset."},
         {tone:"amber", h:"⚠ Bloods, where the cause may be malignant or infective", html:"FBC, CRP or ESR, U&amp;Es, bone profile, clotting; PSA in men; myeloma screen where suspected. These support the receiving team's workup — they do not delay the referral."},
         {tone:"blue", h:"💊 Practical measures while waiting", html:"Analgesia that actually works, a urinary catheter if retained, and nil by mouth if surgery is likely. Record the time the catheter went in and the residual drained."}
       ]}
     ]},

    {id:"after", nav:"After", title:"Recovery, rehabilitation and the honest conversation",
     blocks:[
       {b:"table", head:["Domain","What is needed"], rows:[
         ["<b>Bladder and bowel</b>","Ongoing continence support — intermittent self-catheterisation, a bowel regimen, specialist continence nursing. <b>Recovery can take months and may be incomplete</b>"],
         ["<b>Mobility and pain</b>","Physiotherapy, neuropathic pain management (see <a href='neuropathic-pain.html'>neuropathic pain</a>), falls prevention where there is residual weakness or sensory loss"],
         ["<b>Sexual function</b>","Acknowledge it and ask about it — refer for specialist support where appropriate. It is part of the same injury and is routinely left undiscussed"],
         ["<b>Psychological and social</b>","Counselling, occupational therapy, return-to-work and benefits support. This is a sudden, life-altering injury and often affects working-age adults"],
         ["<b>Long-term follow-up</b>","Review function, continence and mood at intervals rather than discharging after the surgical follow-up"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 A&amp;E now — the safety-net for every back-pain patient", html:"\"Numbness between your legs or around your back passage, trouble passing urine or losing control of your bladder or bowels, or pain and weakness spreading to both legs — go to A&amp;E the same day. Do not ring us first and do not wait until morning.\""},
         {tone:"amber", h:"🟠 Contact us urgently", html:"New or worsening leg weakness · a foot that drags · rapidly worsening bilateral leg pain · fever with back pain."},
         {tone:"green", h:"✓ Honest expectation after decompression", html:"\"The operation stops things getting worse and gives the nerves the best chance. Bladder and bowel recovery can take months and is sometimes incomplete — we will support you through that rather than just wait and see.\""},
         {tone:"blue", h:"📋 What to record, every time", html:"The red-flag enquiry (including the negatives), perianal sensation, anal tone, post-void residual, time of onset, the safety-net given, and who you spoke to. Delayed CES diagnosis is a leading source of avoidable harm and litigation, and this record is the protection for both patient and clinician."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral summary",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Emergency — same day, by phone", html:"Any cauda equina red flag, complete or evolving → emergency same-day MRI and referral. Spinal surgery for benign causes; acute oncology plus clinical oncology for malignant."},
         {tone:"amber", h:"Suspected infection or haematoma", html:"Epidural abscess (fever, systemic upset, injecting drug use, immunosuppression) or epidural haematoma (anticoagulated, sudden onset) → emergency surgical referral with the specific concern stated."},
         {tone:"blue", h:"Continence and rehabilitation", html:"Specialist continence nursing, physiotherapy, occupational therapy; neuropathic pain service where pain persists."},
         {tone:"cream", h:"What primary care owns", html:"Asking the red-flag questions in words the patient understands, examining perianal sensation and anal tone, measuring a post-void residual, phoning the team, giving dexamethasone only where the cause is malignant, and giving and RECORDING the safety-net for every back-pain patient. Related pages: <a href='sciatica.html'>sciatica</a> · <a href='mscc.html'>MSCC</a> · <a href='chronic-pain.html'>chronic pain</a> · <a href='../algorithms/back-pain.html'>back pain pathway</a>."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 41-year-old warehouse worker attends with <b>4 days of severe low back pain now radiating down BOTH legs</b> after lifting. He is walking, power is <b>5/5</b>, ankle jerks present. Asked directly, he says he had to <b>strain to start passing urine this morning</b> and \"it felt a bit numb when I wiped\". He has no incontinence and can still control his bladder. He is keen to avoid A&amp;E because he has <b>no childcare</b> and asks whether he can \"see how it goes over the weekend\" with stronger painkillers."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Recognises bilateral sciatica plus altered urinary sensation plus saddle symptoms as CES-INCOMPLETE — the critical window, and says so; <b>does NOT accept the normal power and preserved control as reassurance</b>, and explains that the full syndrome is what they are trying to prevent; examines perianal sensation and performs a digital rectal examination for tone rather than deferring it; <b>obtains or arranges a post-void residual</b>; <b>phones the spinal team rather than sending a letter</b>, and states red flags, findings, residual and time of onset; <b>does not prescribe stronger analgesia as a substitute for referral</b>; gives no steroid — the cause here is likely disc, and steroids have no role; <b>addresses the childcare barrier practically</b> rather than either ignoring it or conceding to it, and explains the stakes in terms of bladder and sexual function, not just pain; <b>documents the red-flag enquiry, examination and time of onset</b>; and <b>gives the A&amp;E safety-net explicitly</b> in case he still delays."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>NICE NG59 — Low back pain and sciatica in over 16s: assessment and management<br><a href="https://www.nice.org.uk/guidance/ng59" rel="noopener">nice.org.uk/guidance/ng59</a><span class="rd"> — the cauda equina red flags within the back pain assessment, and the requirement for emergency referral rather than routine imaging</span></li>'+
         '<li>GIRFT / Society of British Neurological Surgeons national cauda equina pathway<span class="rd"> — the CESS / CESI / CESR staging, the emphasis on referring at first suspicion, the role of post-void residual measurement, and decompression within 24\u201348 hours of onset</span></li>'+
         '<li>NICE NG234 — Spinal metastases and metastatic spinal cord compression (2023)<br><a href="https://www.nice.org.uk/guidance/ng234" rel="noopener">nice.org.uk/guidance/ng234</a><span class="rd"> — the pathway followed where the cause is malignant compression, including urgent radiotherapy under steroid cover</span></li>'+
         '<li>GMEC Palliative Care Pain &amp; Symptom Control Guidelines, 6th edition (April 2025)<span class="rd"> — dexamethasone 16 mg oral / 13.2 mg IV or SC for malignant compression, with PPI cover</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Cauda equina syndrome — NICE NG59, the GIRFT/SBNS national CES pathway, NICE NG234 and the GMEC Palliative Care Guidelines. Refer at the first suspicion: bilateral sciatica, saddle anaesthesia, bladder or bowel dysfunction or new sexual dysfunction all warrant emergency same-day MRI, and an incomplete picture still qualifies. Examine perianal sensation and anal tone, measure a post-void residual, and phone the receiving team rather than writing. Dexamethasone 16 mg with a PPI only where the cause is malignant — steroids have no role in disc-related CES. Record the red-flag enquiry, the examination, the time of onset and the safety-net given. Verify all doses against the BNF before prescribing."
});
