<script>
MG.render({
  icon:"🦴",
  title:"Cauda equina syndrome — the complete guide",
  eyebrow:"Protocol · NICE NG127 · GIRFT CES pathway · refer at first suspicion, not on a complete syndrome",
  stemTitle:"Earlier recognition and decompression, before established painless retention and severe neurological loss, are associated with better prospects for recovery — so escalate at first suspicion, not on a complete syndrome",
  stemSub:"One page for the emergency. Compression of the lumbosacral roots below L1, most often a large central disc prolapse, sometimes metastatic. Refer on suspicion: NICE NG127 says adults with severe low back pain radiating into the leg plus new bladder, bowel or sexual dysfunction, or new perineal numbness, should be referred immediately for assessment for CES — an incomplete or evolving picture still qualifies, though outcomes remain variable. What primary care must do: <b>perform and document a focused neurological examination, including perineal sensation</b>, and <b>escalate immediately through the local emergency CES pathway</b> — usually direct verbal communication with the receiving team, supplemented by written clinical information, never a routine e-referral or letter alone. Dexamethasone only for suspected malignant compression, under the local MSCC protocol.",
  guideline:"NICE NG127 · GIRFT interactive CES pathway · NICE NG234 · local spinal and GM MSCC pathways · GMEC Palliative · NG59 (background)",
  reviewed:"13 September 2026",
  nextReview:"13 March 2027",
  meta:[
    {t:"NICE NG127 — immediate referral for suspected CES"},
    {t:"GIRFT interactive cauda equina pathway"},
    {t:"New saddle numbness or sphincter symptoms = immediate referral"},
    {t:"Dexamethasone ONLY for suspected malignant compression"},
    {t:"v1.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#safety"><b>Red flags</b><small>Ask specifically</small></a><a href="#examine"><b>Examine</b><small>Perineal · neuro · bladder</small></a><a href="#stage"><b>Stage</b><small>Evolving vs established</small></a><a href="#act"><b>Act</b><small>Local pathway · treat cause</small></a><a href="#after"><b>After</b><small>Continence · rehab</small></a></div>',
  quickSub:"The six that decide whether continence is preserved. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Refer at the FIRST suspicion, not on a complete syndrome", html:"<b>Urgently refer for assessment when severe low-back/radicular pain is accompanied by new bladder, bowel, sexual or perineal sensory symptoms</b> — saddle or perianal numbness, altered sensation when wiping, hesitancy, poor stream, retention, painless overflow, loss of bladder sensation, faecal incontinence or loss of rectal fullness, new sexual dysfunction. Bilateral or progressive radicular symptoms, major motor deficit or rapidly evolving neurological change should prompt urgent spinal-team discussion even if sphincter symptoms are not yet present — but bilateral pain alone is not diagnostic of CES, and this qualification must not delay referral when sacral or sphincter symptoms are present. An incomplete or evolving picture still qualifies — the full syndrome is the stage you are trying to prevent, not the threshold for acting."},
    {tone:"red", h:"⚠ Act before established painless retention", html:"In practical terms, distinguish suspected/evolving CES with new sacral or urinary symptoms (voluntary control still retained) from established CES with painless retention and overflow. Earlier recognition and decompression, before established painless retention and severe neurological loss, are associated with better prospects for recovery, but outcomes remain variable — timing, severity, cause, duration, pre-operative neurological state and MRI findings all influence prognosis. Do not delay emergency MRI while attempting to assign a formal stage."},
    {tone:"amber", h:"Examine rapidly, including perineal sensation", html:"Perform and document a focused neurological examination: lower-limb power, reflexes and sensation, gait if safe, and light touch and pinprick across the S2–S5 saddle dermatomes, comparing sides. Assess anal tone if clinically appropriate, with consent and local training, but do not delay emergency referral and do not use a normal DRE to exclude CES. Palpate for a distended bladder and measure a post-void residual where available and where this can be done immediately — record the value and time, and use it as an adjunct to the history and examination, not as a rule-out test. <b>A normal power examination, normal reflexes, normal anal tone or low PVR does not exclude CES.</b>"},
    {tone:"blue", h:"Escalate through the local emergency CES pathway", html:"Arrange immediate transfer/referral through the local emergency CES pathway — in some areas direct to ED, spinal on-call, acute assessment or a designated CES service. Emergency MRI should be obtained without avoidable delay, according to local spinal-network arrangements; it is not a precondition for referral. For suspected CES this will usually require direct verbal communication with the receiving emergency/spinal team, supplemented by written clinical information. Do not rely on a routine e-referral or letter alone."},
    {tone:"amber", h:"Steroids only if the cause is malignant", html:"If malignant spinal/cauda equina compression is suspected, contact the MSCC coordinator or oncology service immediately and give dexamethasone according to the current local MSCC protocol, unless contraindicated, as in <a href='mscc.html'>MSCC</a>. Include gastroprotection and monitor glucose as appropriate; urgent MRI and a specialist radiotherapy/surgical decision follow. <b>Disc-related CES: no routine corticosteroid</b> — do not give dexamethasone empirically for likely disc-related CES while waiting for imaging unless specifically advised by the receiving team. Give analgesia, catheterise if there is confirmed retention per local protocol, and follow local emergency-transfer instructions regarding fasting."},
    {tone:"green", h:"The documented safety-net is the primary-care safeguard", html:"Every patient you see with sciatica should be told the red flags in plain words and told to attend A&amp;E immediately <b>if any of them develop</b> — uncomplicated low back pain or unilateral sciatica needs routine review and safety-netting, not universal A&amp;E advice. Record that you did. Documenting the history, examination, time of onset, advice and escalation supports safe continuity of care and makes the clinical reasoning clear."}
  ],
  pathwaySub:"Five steps, and steps one to four belong in a single consultation.",
  pathway:[
    {title:"Ask the red-flag questions specifically", html:"Do not ask \"any bladder problems?\" — ask about sensation when wiping, whether the stream feels normal, whether they can tell when the bladder is full, and about numbness between the legs, loss of rectal fullness, new sexual dysfunction, and bilateral or progressive leg symptoms or weakness. In a patient with known or suspected cancer, also contact the MSCC coordinator/oncology service urgently — known cancer does not prove malignant compression, but the threshold for MSCC escalation is low.", alert:true},
    {title:"Examine rapidly — a focused neurological examination", html:"Perineal sensation (S2–S5), lower-limb power, reflexes and sensation, sensory level, gait if safe, bladder palpation, a post-void residual where immediately available, and anal tone only if clinically appropriate, with consent and training. None of these, if normal, excludes CES."},
    {title:"Describe the picture — don't delay to stage it", html:"Distinguish suspected/evolving CES with new sacral or urinary symptoms from established CES with painless retention and overflow; use local pathway terminology (such as CES-S/CESI/CESR) only if required. Both warrant emergency MRI; do not delay it to assign a formal stage."},
    {title:"Escalate through the local pathway, and treat the likely cause", html:"Contact the receiving spinal/neurosurgical/emergency team directly where required; spinal surgery for benign causes; MSCC coordinator/oncology for suspected malignant compression, with dexamethasone per the local MSCC protocol. Analgesia, catheter if confirmed retention, fasting per local transfer instructions. Do not wait for outpatient imaging, routine referral or blood results."},
    {title:"Afterwards: continence, rehabilitation, and honesty", html:"Deficits frequently persist and recover slowly over months. Intermittent self-catheterisation, bowel regimen, specialist continence nursing, physiotherapy, neuropathic pain management, and explicit attention to sexual function."}
  ],
  sections:[

    {id:"safety", nav:"Red flags", title:"The red flags — and how to ask about them",
     sub:"The window to preserve bladder, bowel and sexual function is short, so the threshold for immediate escalation through the local CES pathway has to be very low.",
     blocks:[
       {b:"table", head:["Red flag","How to ask or test","Note"], rows:[
         ["<b>Bilateral sciatica</b>","<b>Leg pain down both legs, or alternating between them</b>","<b>A concerning feature</b> — prompts careful sacral assessment and a low threshold for specialist advice, and bilateral or progressive symptoms warrant urgent spinal-team discussion; bilateral pain alone is not diagnostic of CES (compare ordinary <a href='sciatica.html'>sciatica</a>)"],
         ["<b>Saddle anaesthesia</b>","Numbness or paraesthesia of the perineum, perianal area, genitals or inner thighs. <b>Ask specifically about sensation when wiping</b>, then test sensation","Patients do not volunteer this — it has to be asked about in words they will recognise"],
         ["<b>Bladder dysfunction</b>","Hesitancy, poor stream, retention, painless overflow incontinence, or loss of the urge and awareness of bladder filling","<b>Loss of the sensation of filling precedes retention</b> — asking \"can you tell when you need to go?\" catches it earlier than asking about incontinence"],
         ["<b>Bowel dysfunction</b>","Faecal incontinence, loss of the sensation of rectal fullness","Anal tone, if assessed, is subjective — normal tone does not exclude CES"],
         ["<b>Sexual dysfunction</b>","<b>New erectile or ejaculatory failure, or genital sensory loss</b>","Easily omitted from the history; part of the same root distribution"],
         ["<b>Cancer context</b>","Known or suspected malignancy with any of the above → low threshold for urgent MSCC escalation; known cancer does not prove malignant compression","Metastases: breast, prostate, lung, myeloma. Follow <a href='mscc.html'>MSCC</a>: urgent MSCC coordinator/oncology contact, urgent MRI (usually whole spine where indicated), dexamethasone under protocol, spinal surgery/radiotherapy discussion"]
       ]},
       {b:"say", html:"I need to ask you some specific questions, and a couple are quite personal — they are about nerves at the bottom of the spine. Have you noticed any numbness between your legs, around your back passage, or when you wipe? Can you still tell when your bladder is full and you need to pass urine? Is the stream normal, or are you having to strain or wait? Any change in control of your bowels, or any new numbness there? And has there been any change in sexual sensation? … The reason I am asking all of that is that there is one uncommon but serious cause of back pain where those nerves get squeezed, and it needs urgent hospital assessment and a scan. If any of those things start or get worse — even tonight — go straight to A&E, or call 999 if you can't travel safely. Do not wait to ring us."},
       {b:"warn", html:"<b>Do not falsely reassure yourself with an incomplete picture.</b> Evolving or partial signs still warrant immediate escalation and emergency MRI — the complete syndrome is the outcome you are trying to avert, not the entry criterion. One recognised pitfall is a missed CHANGE: a patient already known to have back pain, whose new bilateral leg symptoms get absorbed into the existing diagnosis. New or changed symptoms in known back pain are a fresh assessment."},
       {b:"dl", rows:[
         ["<b>Causes — benign</b>","Large central lumbar disc prolapse (commonest), spinal stenosis, trauma, epidural haematoma, epidural abscess"],
         ["<b>Causes — malignant</b>","<b>Metastatic compression — breast, prostate, lung, myeloma.</b> In a patient with cancer, consider this early and escalate via the MSCC pathway"],
         ["<b>Differentials</b>","<b>Conus medullaris syndrome and spinal cord compression</b> — a sensory level, upper motor neurone signs or abnormal abdominal reflexes point to cord or conus rather than cauda equina compression; not every lower-spinal emergency is CES"]
       ]}
     ]},

    {id:"examine", nav:"Examine", title:"The examination — a focused neurological examination, without delaying referral",
     blocks:[
       {b:"table", head:["What","How","Why"], rows:[
         ["<b>Perianal sensation</b>","Light touch and pinprick across all perianal and saddle dermatomes (S2–S5), comparing left with right","The objective correlate of the saddle symptom, and the baseline for change"],
         ["<b>Anal tone — only if clinically appropriate</b>","Resting tone and voluntary squeeze, with consent and local training","Subjective and examiner-dependent; may be distressing or unacceptable to some patients; evidence as a rule-out test is limited. <b>Must not delay emergency transfer, and normal tone does not exclude CES</b>"],
         ["<b>Lower-limb neurology</b>","Power, reflexes including ankle jerks, sensation, gait where safe","Establishes severity and gives the baseline for progression"],
         ["<b>Broader neurological and systemic assessment</b>","Abdominal reflexes where relevant; a sensory level; upper motor neurone signs; fever and systemic examination where infection is possible","A sensory level or upper motor neurone signs suggest conus or spinal cord rather than cauda equina compression; fever raises epidural abscess"],
         ["<b>Bladder</b>","Palpate for a distended bladder; measure a post-void residual volume by bladder scan where available","Only where available and where this can be done immediately; record the value and time. An adjunct, not a rule-out test: a low or normal PVR does not exclude CES, a high PVR is not specific for CES, and no single universally accepted threshold diagnoses or excludes it. Do not delay referral or MRI to obtain it"],
         ["<b>Documentation</b>","Record the red flags, time of onset and progression, lower-limb neurology, perineal sensory findings, bladder symptoms and measured residual if available, examination time, the name of the receiving clinician/service, and the agreed destination and transport","Supports safe continuity of care and makes the clinical reasoning clear"]
       ]},
       {b:"why", html:"Perineal sensory testing is easily skipped because it can feel disproportionate in a patient who looks well and is walking. But documented perineal sensation and lower-limb findings give the receiving team a baseline to judge change against. Keep it proportionate: the examination supports, but never gates, escalation — a normal power examination, normal reflexes, normal anal tone or a low post-void residual does not exclude CES, and none of it should delay emergency referral."}
     ]},

    {id:"stage", nav:"Stage", title:"Evolving versus established CES — describe it, don't delay to stage it",
     blocks:[
       {b:"table", head:["Stage","Definition","Implication"], rows:[
         ["<b>Suspected/evolving CES</b> (some local pathways: CES-S, CESI)","New sacral or urinary symptoms — altered urinary sensation, poor stream, straining, saddle numbness — with voluntary control still retained. Not every suspected case proves to be CES","<b>Warrants immediate referral and emergency MRI.</b> Earlier recognition and decompression are associated with better prospects for recovery, but outcomes remain variable"],
         ["<b>Established CES</b> (some local pathways: CESR)","Painless urinary retention with overflow — highly concerning whether or not saddle anaesthesia is extensive; must be assessed clinically and radiologically","Generally poorer prospects for recovery of bladder, bowel and sexual function; still an emergency"]
       ]},
       {b:"warn", html:"CES-S/CESI/CESR terminology is used in some spinal pathways but is not a universally standardised classification, and definitions vary — use local pathway terminology only if required, and do not delay emergency MRI while attempting to assign a formal stage. Separating benign disc disease from malignant compression then determines whether the answer is a surgeon or an oncologist, and that distinction is made on the MRI, not clinically."}
     ]},

    {id:"act", nav:"Act", title:"Immediate action, referral and definitive treatment",
     blocks:[
       {b:"table", head:["Situation","Action","Notes"], rows:[
         ["<b>All suspected CES</b>","Arrange immediate transfer/referral through the local emergency CES pathway; emergency MRI without avoidable delay, according to local spinal-network arrangements. Adequate analgesia. If there is confirmed acute retention, catheterise according to local emergency/urology protocol while arranging immediate transfer. Follow local emergency-transfer instructions regarding fasting","Refer on clinical suspicion. Do not delay transfer while arranging fasting, routine blood tests or outpatient imaging"],
         ["<b>Suspected malignant compression</b>","Contact the MSCC coordinator or oncology service immediately; give dexamethasone according to the current local MSCC protocol (dose, product concentration and route), unless contraindicated, with gastroprotection where indicated","Urgent MRI (usually whole spine where indicated) and a specialist radiotherapy/surgical decision, as for <a href='mscc.html'>MSCC</a> (NICE NG234). Monitor glucose"],
         ["<b>Benign (disc) CES</b>","NO steroid. Urgent spinal surgical referral for emergency decompression","<b>No routine corticosteroid in disc-related CES</b> — do not give dexamethasone empirically while waiting for imaging unless specifically advised by the receiving team"],
         ["<b>Timing — disc-related</b>","<b>Emergency spinal-surgical assessment is required. If compressive CES is confirmed, decompression should be undertaken urgently according to the receiving spinal team and local pathway</b>","Timing depends on MRI findings, neurological progression, bladder dysfunction, cause, surgical availability and anaesthetic risk. Do not use 24 or 48 hours as a reason to downgrade urgency"],
         ["<b>Timing — malignant</b>","<b>Urgent MRI and specialist decision on radiotherapy and/or surgery, under the local MSCC pathway (NICE NG234)</b>","Not every cancer-associated presentation receives radiotherapy; surgical decompression and stabilisation for selected patients"],
         ["<b>Suspected infection (epidural abscess)</b>","<b>Urgent hospital assessment; blood cultures, FBC and inflammatory markers where this does not delay transfer; antibiotics and surgical drainage according to the receiving team</b>","Suspect with fever, systemic upset, injecting drug use or immunosuppression"],
         ["<b>Suspected epidural haematoma</b>","<b>Emergency referral; urgent reversal of anticoagulation according to the clinical context; urgent MRI and surgical assessment</b>","Suspect in an anticoagulated patient with sudden onset"],
         ["<b>If MRI is contraindicated</b>","Discuss urgently with the spinal or neurosurgical team for alternative imaging","Not a reason to downgrade the urgency"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"📞 Use the local emergency referral process", html:"For suspected CES this will usually require direct verbal communication with the receiving emergency/spinal team, supplemented by written clinical information. Do not rely on a routine e-referral or letter alone. State the red flags, time of onset and progression, lower-limb neurology, perineal sensory findings, bladder symptoms and residual if measured, and record who you spoke to and the agreed destination and transport."},
         {tone:"amber", h:"⚠ Bloods — targeted, never delaying", html:"Blood tests may support assessment where malignancy, infection, anticoagulation or operative management is relevant, but they must not delay emergency referral or MRI. Target FBC, CRP/ESR, U&amp;Es, calcium and clotting to the clinical question; they are not routine in likely disc-related CES. PSA is not an emergency CES investigation; myeloma testing follows the clinical context and the NG12 pathway."},
         {tone:"blue", h:"💊 Practical measures while waiting", html:"Analgesia that actually works; a urinary catheter only for confirmed acute retention, per local emergency/urology protocol (consider urethral injury and infection) — not for all urinary symptoms; fasting per local emergency-transfer instructions. Do not delay transfer for any of these. Record the pre-catheter residual where possible, the time of catheterisation and the volume drained."}
       ]}
     ]},

    {id:"after", nav:"After", title:"Recovery, rehabilitation and the honest conversation",
     blocks:[
       {b:"table", head:["Domain","What is needed"], rows:[
         ["<b>Bladder and bowel</b>","Ongoing continence support — intermittent self-catheterisation, a bowel regimen, specialist continence nursing. <b>Recovery can take months and may be incomplete</b>"],
         ["<b>Mobility and pain</b>","Physiotherapy, neuropathic pain management (see <a href='neuropathic-pain.html'>neuropathic pain</a>), falls prevention where there is residual weakness or sensory loss"],
         ["<b>Sexual function</b>","Acknowledge it and ask about it — refer for specialist support where appropriate. It is part of the same injury and is routinely left undiscussed"],
         ["<b>Psychological and social</b>","Counselling, occupational therapy, return-to-work and benefits support. This is a sudden, life-altering injury and often affects working-age adults"],
         ["<b>Long-term follow-up</b>","Review function, continence and mood at intervals rather than discharging after the surgical follow-up"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 A&amp;E now — the safety-net for every patient with sciatica", html:"\"If you develop numbness between your legs or around the back passage, difficulty passing urine, loss of bladder or bowel control, new sexual dysfunction, or weakness affecting both legs, attend A&amp;E immediately — or call emergency services if you can't travel safely — and do not wait for a routine appointment.\" For uncomplicated sciatica without these features, arrange routine review rather than A&amp;E."},
         {tone:"amber", h:"🟠 Contact us urgently", html:"New or worsening leg weakness · a foot that drags · rapidly worsening bilateral leg pain · fever with back pain."},
         {tone:"green", h:"✓ Honest expectation after decompression", html:"\"The operation stops things getting worse and gives the nerves the best chance. Bladder and bowel recovery can take months and is sometimes incomplete — we will support you through that rather than just wait and see.\""},
         {tone:"blue", h:"📋 What to record, every time", html:"The red-flag questions and answers (including the negatives), sacral and lower-limb examination, residual volume if measured, time of onset, the safety-net given, and who was contacted and the agreed plan. Documenting the history, examination, time of onset, advice and escalation supports safe continuity of care and makes the clinical reasoning clear."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral summary",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Emergency — immediate, via the local CES pathway", html:"Severe low-back/radicular pain with new bladder, bowel, sexual or perineal sensory symptoms, complete or evolving → immediate referral and emergency MRI per local spinal-network arrangements, usually with direct verbal communication. Bilateral or progressive radicular symptoms, major motor deficit or rapidly evolving neurology → urgent spinal-team discussion. Spinal surgery for benign causes; MSCC coordinator/acute oncology for suspected malignant compression."},
         {tone:"amber", h:"Suspected infection or haematoma", html:"Epidural abscess (fever, systemic upset, injecting drug use, immunosuppression) or epidural haematoma (anticoagulated, sudden onset) → emergency surgical referral with the specific concern stated."},
         {tone:"blue", h:"Continence and rehabilitation", html:"Specialist continence nursing, physiotherapy, occupational therapy; neuropathic pain service where pain persists."},
         {tone:"cream", h:"What primary care owns", html:"Asking the red-flag questions in words the patient understands, a focused neurological examination including perineal sensation (anal tone only if appropriate), a post-void residual where immediately available, escalating through the local emergency CES pathway, dexamethasone only for suspected malignant compression under the local MSCC protocol, and giving and RECORDING the safety-net for every patient with sciatica. Related pages: <a href='sciatica.html'>sciatica</a> · <a href='mscc.html'>MSCC</a> · <a href='chronic-pain.html'>chronic pain</a> · <a href='../algorithms/back-pain.html'>back pain pathway</a>."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 41-year-old warehouse worker attends with <b>4 days of severe low back pain now radiating down BOTH legs</b> after lifting. He is walking, power is <b>5/5</b>, ankle jerks present. Asked directly, he says he had to <b>strain to start passing urine this morning</b> and \"it felt a bit numb when I wiped\". He has no incontinence and can still control his bladder. He is keen to avoid A&amp;E because he has <b>no childcare</b> and asks whether he can \"see how it goes over the weekend\" with stronger painkillers."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Recognises severe bilateral radicular pain plus new urinary and saddle symptoms as suspected/evolving CES needing immediate referral, and says so; <b>does NOT accept the normal power and preserved control as reassurance</b>, and explains that the full syndrome is what they are trying to prevent; examines perineal sensation and lower-limb neurology, assessing anal tone only if clinically appropriate and with consent, without delaying referral; <b>measures a post-void residual if immediately available, without delaying referral</b>; <b>escalates directly through the local emergency CES pathway rather than sending a letter</b>, and states red flags, findings, residual and time of onset; <b>does not prescribe stronger analgesia as a substitute for referral</b>; gives no steroid — the cause here is likely disc, and there is no routine corticosteroid role; <b>addresses the childcare barrier practically</b> rather than either ignoring it or conceding to it, and explains the stakes in terms of bladder and sexual function, not just pain; <b>documents the red-flag enquiry, examination and time of onset</b>; and <b>gives the A&amp;E safety-net explicitly</b> in case he still delays."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>NICE NG127 — Suspected neurological conditions: recognition and referral<br><a href="https://www.nice.org.uk/guidance/ng127" rel="noopener">nice.org.uk/guidance/ng127</a><span class="rd"> — immediate referral for assessment for CES in adults with severe low back pain radiating into the leg plus new bladder, bowel or sexual dysfunction, or new perineal numbness</span></li>'+
         '<li>GIRFT interactive care pathway for cauda equina syndrome (NICE NG127 resources)<br><a href="https://www.nice.org.uk/guidance/ng127/resources" rel="noopener">nice.org.uk/guidance/ng127/resources</a><span class="rd"> — the operational emergency pathway: urgent assessment, bladder scanning, MRI, surgery and post-operative care; local operational targets apply</span></li>'+
         '<li>NICE NG234 — Spinal metastases and metastatic spinal cord compression (2023)<br><a href="https://www.nice.org.uk/guidance/ng234" rel="noopener">nice.org.uk/guidance/ng234</a><span class="rd"> — urgent MRI and specialist management where malignant compression is suspected</span></li>'+
         '<li>Local spinal/orthopaedic/neurosurgical CES pathway, and Greater Manchester MSCC and palliative-care protocols<span class="rd"> — the local emergency referral route, imaging arrangements and MSCC escalation</span></li>'+
         '<li>GMEC Palliative Care Pain &amp; Symptom Control Guidelines for Adults (modified April 2025; review April 2028), via GMMMG<br><a href="https://gmmmg.nhs.uk/" rel="noopener">gmmmg.nhs.uk</a><span class="rd"> — local dexamethasone dosing for malignant compression, with gastroprotection; a local protocol rather than a universal NICE prescribing dose</span></li>'+
         '<li>NICE NG59 — Low back pain and sciatica in over 16s: assessment and management (2016, updated July 2026)<br><a href="https://www.nice.org.uk/guidance/ng59" rel="noopener">nice.org.uk/guidance/ng59</a><span class="rd"> — general low back pain background only; NG59 explicitly excludes the evaluation and management of cauda equina syndrome</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Cauda equina syndrome — NICE NG127, the GIRFT interactive CES pathway, NICE NG234, local spinal and Greater Manchester MSCC pathways and the GMEC Palliative Care Guidelines (NG59 as low back pain background only). Refer at the first suspicion: severe low-back/radicular pain with new bladder, bowel, sexual or perineal sensory symptoms needs immediate referral, and an incomplete picture still qualifies; bilateral or progressive radicular symptoms warrant urgent spinal-team discussion. Perform a focused neurological examination including perineal sensation, measure a post-void residual only where immediately available, and escalate through the local emergency CES pathway — usually by direct verbal communication, never a letter alone. Dexamethasone only for suspected malignant compression, per the current local MSCC protocol — no routine corticosteroid in disc-related CES. Record the red-flag enquiry, the examination, the time of onset, the safety-net given and who was contacted."
});
