MG.render({
  icon:"🚗",
  title:"Driving and diseases — DVLA fitness to drive",

  stemTitle:"Tell the patient when to stop driving and that they must notify DVLA — document it — and inform DVLA yourself only if they cannot or will not and the risk to others is serious",
  stemSub:"DVLA notification · epilepsy · insulin-treated diabetes and hypoglycaemia · syncope · dementia · OSA · cardiac · Group 1 versus Group 2 · GMC confidentiality guidance. Identify the condition and the licence type (Group 1 car/motorcycle; Group 2 bus/lorry — stricter; taxi/private-hire — also local licensing authority standards), and check the current DVLA <i>Assessing fitness to drive</i> chapter for the condition — the guide is updated regularly. The patient is legally responsible for notifying DVLA; the GP advises, documents and safety-nets; DVLA, not the GP, makes the licensing decision. For a quick condition look-up, see also the <a href='../dvla.html'>DVLA fitness-to-drive guide</a>.",
  guideline:"DVLA Assessing fitness to drive (current online edition) · GMC Confidentiality: patients' fitness to drive and reporting concerns to the DVLA/DVA (2017) · NICE CG109 · NICE NG202 · NICE NG97 · MHRA Drugs and driving",

  ],
  lead:"<div class='mg-layers'><a href='#severe'><b>Stop now</b><small>Seizure · TLoC · vision · hypos</small></a><a href='#framework'><b>Framework</b><small>Group 1 vs 2 · who notifies</small></a><a href='#conditions'><b>Conditions</b><small>Cardiac · neuro · diabetes · psych</small></a><a href='#consult'><b>Consultation</b><small>What to say &amp; document</small></a><a href='#gmc'><b>GMC duty</b><small>Informing DVLA</small></a><a href='../dvla.html'><b>DVLA guide</b><small>Quick condition look-up</small></a></div>",
  quickSub:"If you read nothing else on this page, read these six cards. Condition-specific periods must always be checked against the current DVLA chapter cited under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Some conditions mean stop driving now", html:"Any seizure · TLoC without a firm diagnosis of uncomplicated faint/situational syncope (while awaiting assessment) · TIA/stroke (usually at least 1 month) · sight not meeting the standard or a new visual field defect · acute coronary syndrome (per the DVLA cardiovascular chapter) · severe hypoglycaemia meeting DVLA criteria or impaired awareness in insulin-treated diabetes · OSA with excessive sleepiness likely to impair driving · acute psychotic episode. <b>Advise the patient not to drive and to notify DVLA, and document it.</b>"},
    {tone:"amber", h:"The patient notifies — the GP advises and documents", html:"The patient is legally responsible for notifying DVLA (form V1 or online). The GP explains the condition and its driving implications, advises whether to stop driving and whether to notify, and <b>records the advice and the patient's response</b>. The GP does not report on the patient's behalf in routine cases. DVLA, not the GP, makes the licensing decision."},
    {tone:"red", h:"When the GP must inform DVLA", html:"If the patient cannot or will not notify (including lack of capacity or insight) and continues to drive with a serious risk to others, inform DVLA's medical adviser with relevant information only — telling the patient first where practicable and safe (GMC 2017). Make reasonable efforts to persuade first, and document the decision-making process."},
    {tone:"blue", h:"Group 2 is stricter", html:"Bus and lorry (Group 2) drivers face stricter standards — e.g. after a seizure, criteria include seizure history and antiseizure medication use over the preceding 10 years; an ICD in situ is generally disqualifying; every severe hypoglycaemic episode must be reported. Taxi and private-hire drivers may also need to meet local licensing authority standards."},
    {tone:"green", h:"Insulin-treated drivers", html:"Check glucose before driving and at least every 2 hours during a journey; do not drive if glucose is below 4.0 mmol/L, with symptoms of hypoglycaemia or if feeling unsafe; carry fast-acting glucose; if a hypo occurs, stop safely, switch off the engine, move from the driver's seat, treat it and do not resume until recovered and the required interval has elapsed."},
    {tone:"amber", h:"Do not change antiseizure medication to meet a driving standard", html:"Do not advise patients to stop or change antiseizure medication solely to meet a driving standard — withdrawal or change may itself trigger a new driving restriction and should be managed by the treating specialist."}
  ],
  pathwaySub:"The whole consultation in five moves.",
  pathway:[
    {title:"Identify the condition and licence type", html:"Group 1 (car/motorcycle) versus Group 2 (bus/lorry — stricter); taxi/private-hire — also local licensing authority standards. Check the current DVLA <i>Assessing fitness to drive</i> chapter for the condition, and record which guidance was checked and the date checked."},
    {title:"Must they stop driving now?", html:"Any seizure, TLoC without a firm diagnosis of uncomplicated faint/situational syncope, TIA/stroke (usually at least 1 month), sight not meeting the standard, acute coronary syndrome (per DVLA cardiovascular chapter), severe hypoglycaemia meeting DVLA criteria, OSA with excessive sleepiness likely to impair driving → advise not to drive and to notify DVLA; document. If not, history and examination by pattern guide management.", alert:true},
    {title:"Notify DVLA and apply time-limited restrictions", html:"Many conditions require the patient to inform DVLA (epilepsy, diabetes on insulin, significant cardiac, neurological, visual or psychiatric conditions). Time-limited restrictions: seizure (period depends on seizure type and history — check the DVLA neurological chapter), TIA/stroke (usually at least 1 month if recovered), TLoC/syncope (per cause)."},
    {title:"Counsel, give written information and document", html:"Clearly counsel the patient on whether and when they must stop driving and their duty to notify DVLA; give written information and the relevant condition standard; document the advice in the record. Address modifiable factors — glycaemic control and hypo awareness for insulin-treated drivers, seizure control, alcohol and substances, visual fields. Advise them to check their insurance policy and notify the insurer where required."},
    {title:"Review and safety-net; escalate if needed", html:"Review at the end of any time-limited ban (e.g. seizure, TIA/stroke, syncope) and confirm the standard is met before resuming; re-counsel if the condition or treatment changes. Direct patients to DVLA for notification and current standards. If a patient cannot or will not notify (including lack of insight/capacity) and continues to drive with a serious risk to others, inform DVLA per GMC guidance, telling the patient first where practicable and safe.", alert:true}
  ],
  sections:[
    {id:"severe", nav:"Stop now", title:"Red flags — stop driving and DVLA notification",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Epilepsy / seizure — any seizure", html:"Advise the patient to stop driving immediately and check the relevant DVLA neurological guidance. The restriction depends on whether the event was an isolated unprovoked seizure, a provoked seizure, an epileptic seizure in someone with established epilepsy, a sleep-only seizure, or occurred during antiseizure medication withdrawal/change. First isolated unprovoked seizure: Group 1 driving is commonly restricted for at least 6 months, depending on clinical and investigation findings. Established epilepsy: a seizure commonly requires a longer period off driving, usually 12 months for Group 1, subject to the specific DVLA criteria. Group 2 standards are substantially stricter — the criteria include both seizure history and antiseizure medication use in the preceding 10 years. The patient should notify DVLA where required; the GP does not decide the licensing outcome. <b>Do not advise patients to stop or change antiseizure medication solely to meet a driving standard</b> — withdrawal or change may itself trigger a new driving restriction and should be managed by the treating specialist."},
         {tone:"red", h:"🔴 Visual field defect — hemianopia, quadrantanopia, or acuity worse than 6/12 with both eyes open", html:"Advise not to drive and to notify DVLA; DVLA makes the final decision. Group 1 field standard: at least 120° horizontally, extending at least 50° left and right, with no significant defect encroaching within 20° of fixation above or below the horizontal meridian. Most significant defects close to fixation will not meet the standard; some static defects may undergo exceptional-case consideration under strict criteria (stability, adaptation, no progressive disease, satisfactory practical driving assessment). Glaucoma, stroke, tumour — any cause. Document GP advice."},
         {tone:"red", h:"🔴 Transient loss of consciousness (TLoC) or incapacitating dizziness of unknown cause", html:"Any TLoC requires immediate driving advice. Unless there is a firm diagnosis of uncomplicated faint, situational syncope, postural hypotension or a clearly diagnosed epileptic seizure with its own standard, advise the patient not to drive while awaiting assessment (NICE CG109). Do not use the “3 Ps” as a stand-alone clearance test. Perform a structured assessment: history, witness account, cardiovascular examination, lying and standing BP where appropriate, medication review and 12-lead ECG. <b>Refer urgently</b> if exertional syncope, abnormal ECG, heart failure, murmur, unexplained breathlessness, family history of sudden cardiac death/inherited cardiac disease, syncope while sitting or lying, or syncope without prodrome in an older person. DVLA restrictions depend on the exact TLoC category and whether the episode occurred while driving — check the current DVLA guidance."},
         {tone:"red", h:"🔴 Insulin-treated diabetes — impaired awareness or severe hypoglycaemia", html:"Group 1 drivers who have had two or more episodes of severe hypoglycaemia while awake in the preceding 12 months, have impaired awareness of hypoglycaemia or have had severe hypoglycaemia while driving must stop driving and notify DVLA. Group 2 drivers must report every episode of severe hypoglycaemia requiring assistance from another person, including episodes during sleep, and must have full awareness of hypoglycaemia. Do not drive if glucose is below 4.0 mmol/L, with symptoms of hypoglycaemia or if feeling unsafe. Check the current DVLA diabetes guidance."},
         {tone:"amber", h:"🟠 Dementia or significant cognitive impairment that may affect driving", html:"Must be notified to DVLA (diagnosis may be made in primary care or memory services). Assess insight, memory, attention, visuospatial function, judgement, executive function, behavioural symptoms, medication effects and functional driving history. Cognitive screening scores support but do not replace clinical assessment. DVLA makes an individual licensing decision and may request specialist reports or a practical driving assessment. If the patient lacks capacity to understand the advice or cannot notify DVLA, inform DVLA as soon as practicable. Document advice."},
         {tone:"amber", h:"🟠 Alcohol dependence or persistent misuse", html:"Dependence — Group 1: licence refused or revoked for a minimum of 1 year free of dependence; Group 2: minimum of 3 years. Persistent misuse is also notifiable — check the DVLA alcohol chapter for the applicable period. Relicensing may require an independent medical assessment and testing arranged by DVLA. CAGE/AUDIT support clinical assessment but do not determine the licensing outcome."}
       ]},
       {b:"table", head:["Category","Conditions"], rows:[
         ["<span class='mg-pill mg-pill-tw'>Immediate driving cessation advised</span>","Any seizure · TLoC without a firm diagnosis of uncomplicated faint/situational syncope (while awaiting assessment) · New visual field defect · OSA with excessive sleepiness likely to impair driving · Acute psychotic episode · Insulin-treated DM with impaired awareness or severe hypoglycaemia meeting DVLA criteria"],
         ["<span class='mg-pill'>Notify DVLA + time-limited restriction</span>","Acute coronary syndrome (per DVLA cardiovascular chapter) · AF (per symptoms and DVLA category) · New pacemaker (commonly 1 week Group 1) · TIA/stroke (usually at least 1 month Group 1) · Dementia/cognitive impairment that may affect driving (DVLA individual decision) · New Parkinson's (DVLA assessment) · Significant anxiety/depression affecting driving ability"]
       ]},
       {b:"warn", html:"<b>Always document the advice you give:</b> it is the patient who must notify the DVLA, but you must tell them clearly when to stop driving — and inform DVLA yourself if they cannot or will not notify and continue to drive with a serious risk to others."},
       {b:"why", html:"The medicolegal framework for driving and disease is one of the most important yet least well-understood aspects of GP practice — the DVLA Assessing Fitness to Drive guide (published annually at GOV.UK) sets out condition-specific driving standards and is updated regularly — check the current chapter for every condition. GPs have three specific duties: (1) to advise patients when a medical condition or treatment affects their fitness to drive; (2) to document that this advice was given; and (3) to notify the DVLA when notification is required and the patient cannot or will not notify, and continued driving poses a serious risk to others (informing the patient first where practicable and safe). The common-law duty of confidentiality and data protection law do not prevent disclosure to the DVLA when there is a serious safety concern — the GMC guidance ‘Confidentiality: patients' fitness to drive and reporting concerns to the DVLA/DVA’ (2017) specifically permits disclosure without patient consent if: the patient does not inform the DVLA despite repeated advice, and continued driving would pose a significant safety risk. The documentation standard: at every consultation where a driving-relevant condition is identified, diagnosed, or deteriorates: record ‘patient advised re: DVLA notification requirement for [condition] + driving restrictions — patient acknowledges and will notify/stop driving.’ This takes one line and records that advice was given in line with professional guidance."}
     ]},

    {id:"framework", nav:"Framework", title:"Framework — DVLA standards explained",
     blocks:[
       {b:"table", head:["Topic","Detail"], rows:[
         ["<b>Group 1 vs Group 2 licences</b>","<b>Group 1 (ordinary): cars and motorcycles</b> — most patients. Medical standards are less stringent. Standard licensing applies. <b>Group 2 (vocational): large goods vehicles and passenger-carrying vehicles (categories C1, C, C1E, CE, D1, D, D1E, DE)</b> — stricter medical standards. Many conditions that allow Group 1 driving are disqualifying for Group 2. Key Group 2 note: HGV/bus drivers must meet higher standards — e.g. after a seizure, Group 2 criteria include seizure history and antiseizure medication use over the preceding 10 years. Group 2 licences are normally valid for up to 5 years: renewal every 5 years or at age 45, whichever is earlier, and annually from age 65; shorter periods may apply for medical reasons. A D4 medical assessment is required for initial application and at the relevant renewals."],
         ["<b>Taxi and private-hire drivers</b>","May be subject to additional local authority licensing standards. Check the relevant licensing authority's requirements; do not assume that DVLA Group 2 standards alone determine eligibility."],
         ["<b>When patients must notify DVLA</b>","The patient is legally responsible for notifying the DVLA (form V1 or online) when they have a medical condition that affects driving. GP responsibility: inform the patient that notification is required, advise them to stop driving in the interim if their condition makes driving unsafe, and document the advice. The GP does NOT report to the DVLA on behalf of the patient in routine cases — the duty lies with the patient. The doctor should notify DVLA when notification is required and the patient cannot or will not notify. If the patient continues to drive despite advice, make reasonable efforts to persuade them to stop; if this fails and the risk is sufficiently serious, disclosure in the public interest may be justified."],
         ["<b>The doctor should</b>","(1) explain the medical condition and driving implications; (2) advise of the legal duty to notify DVLA; (3) advise to stop driving where appropriate; (4) ask the patient to notify DVLA; (5) document the discussion and the patient's response; (6) explain that disclosure may be necessary if they continue to drive; (7) notify DVLA if the patient is unable or unwilling to notify and there is a serious risk to others; (8) inform the patient before disclosure where practicable and safe."],
         ["<b>Key principles of DVLA fitness standards</b>","Condition must be: (1) likely to cause sudden incapacity (seizures, syncope, hypoglycaemia); OR (2) cause persistent impairment affecting driving ability (visual loss, dementia, severe anxiety, medication effects); OR (3) cause distraction or impaired attention. Stability is key — many conditions allow driving when well-controlled. GPs manage conditions, not licences — the DVLA makes the ultimate licensing decision."]
       ]},
       {b:"why", html:"The taxi licensing complexity is frequently overlooked in primary care — local authority licensing of taxis does not fall under DVLA Group 2 rules (some local authorities require Group 2 standards, others Group 1) but GPs are sometimes asked to provide medical reports for taxi licence applications. The GP's role in these reports is factual — state the condition, its current treatment, and its stability. GPs should not determine whether the applicant is ‘fit to drive a taxi’ — that determination is made by the licensing authority. GPs should also be aware that some conditions have specific DVLA rules that differ between Group 1 and Group 2 in ways that can surprise patients: for example, a person with epilepsy who has been seizure-free for 12 months may meet the Group 1 standard, but Group 2 criteria consider seizure history and antiseizure medication use over the preceding 10 years. A patient who changes jobs to HGV driving while on antiepileptic medication may not realise this until they attempt to upgrade their licence."}
     ]},

    {id:"conditions", nav:"Conditions", title:"Conditions and their specific DVLA rules", sub:"Summaries only — check the current DVLA chapter for every condition.",
     blocks:[
       {b:"table", head:["Cardiovascular","DVLA rule"], rows:[
         ["<b>General</b>","Cardiovascular driving restrictions are diagnosis- and event-specific. Do not use a generic “stable/unstable” table alone. Check the DVLA cardiovascular guidance after acute coronary syndrome, syncope, arrhythmia, pacemaker/ICD implantation, heart failure, valve disease and aortic disease. Refer for cardiology assessment where the DVLA standard requires specialist evidence."],
         ["<b>Acute coronary syndrome</b>","The period off driving depends on the specific ACS, successful treatment, planned further intervention, left ventricular function and symptoms — check the DVLA chapter. Group 2: stricter, requires specialist evidence."],
         ["<b>AF</b>","Fitness depends on symptoms, haemodynamic effect, ventricular function, treatment and the relevant DVLA category (Group 1 and Group 2)."],
         ["<b>Pacemaker insertion</b>","Commonly Group 1: 1 week; Group 2: 6 weeks — check the precise circumstances, including lead revision, box change and complications."],
         ["<b>ICD</b>","Group 1: depends on the indication — check the DVLA chapter. Group 2: an ICD in situ is generally disqualifying — confirm against the current DVLA cardiac guidance."],
         ["<b>Heart failure</b>","Group 2 decisions may require functional testing, specialist assessment, left ventricular ejection fraction and absence of disqualifying symptoms — use the current DVLA cardiovascular standards."]
       ]},
       {b:"table", head:["Neurological","DVLA rule"], rows:[
         ["<b>Epilepsy / seizures</b>","Group 1: period depends on seizure type and history (see <a href='#severe'>Red flags</a>). Group 2: substantially stricter — criteria include seizure history and antiseizure medication use over the preceding 10 years; check the DVLA neurological chapter."],
         ["<b>Stroke / TIA</b>","After TIA or stroke, driving is usually stopped for at least one month. The patient must meet the relevant visual, cognitive, neurological and functional standards before resuming; any persisting deficit that may affect driving must be notified to DVLA. A single TIA and recurrent TIAs are assessed differently. Specifically consider visual field loss, neglect, aphasia, impaired insight and executive dysfunction. Group 2: stricter — depends on recurrence, residual neurological or cognitive impairment, visual field defects and the underlying cause; usually requires specialist evidence."],
         ["<b>Parkinson's disease</b>","Group 1: notify DVLA, individual assessment + 1–3 year licence. Group 2: if medication causes sudden sleep onset → bar."],
         ["<b>Dementia</b>","All: notify DVLA if it may affect driving; DVLA makes an individual decision and may request specialist reports or a practical driving assessment. Mild dementia may continue driving with licence conditions."]
       ]},
       {b:"table", head:["Diabetes and endocrine","DVLA rule"], rows:[
         ["<b>Insulin-treated diabetes</b>","Explain the current DVLA requirements and provide the DVLA diabetes information; the patient must have adequate awareness of hypoglycaemia and appropriate glucose monitoring. Check glucose before driving and at least every 2 hours during a journey. Do not drive if glucose is below 4.0 mmol/L, with symptoms of hypoglycaemia or if feeling unsafe. Group 1: two or more episodes of severe hypoglycaemia while awake in the preceding 12 months, impaired awareness, or severe hypoglycaemia while driving → stop driving and notify DVLA. Group 2: report every episode of severe hypoglycaemia requiring assistance from another person (including during sleep); full awareness of hypoglycaemia required; DVLA monitoring and specialist assessment requirements apply."],
         ["<b>T2DM on tablets</b>","Group 1: consider the medication and individual risk profile — sulfonylureas and glinides can cause hypoglycaemia, so give hypoglycaemia driving advice; notify DVLA if more than one severe hypoglycaemic episode in 12 months or impaired awareness. Check the DVLA diabetes chapter. Group 2: notify if on insulin or hypoglycaemia-causing agents."],
         ["<b>Addison's disease</b>","Notify DVLA. Individual assessment. Stable replacement = usually can drive."]
       ]},
       {b:"table", head:["Psychiatric and alcohol","DVLA rule"], rows:[
         ["<b>Acute psychosis</b>","Stop driving until stable, insight restored, specialist confirms fit."],
         ["<b>Severe anxiety/depression</b>","Notify DVLA if symptoms affecting concentration, judgement, reaction time (not all depression — clinical judgement)."],
         ["<b>Alcohol dependence</b>","Group 1: licence refused or revoked for a minimum of 1 year free of dependence. Group 2: minimum of 3 years. Relicensing may require an independent medical assessment and testing arranged by DVLA. Persistent misuse is also notifiable — check the DVLA alcohol chapter."]
       ]},
       {b:"why", html:"The insulin-treated diabetes driving rules are clinically important — always check the current DVLA diabetes chapter and give the patient the DVLA diabetes information. Practical advice: (1) check glucose before driving and at least every 2 hours during a journey; (2) do not drive if glucose is below 4.0 mmol/L, if there are symptoms of hypoglycaemia or if feeling unsafe; (3) carry fast-acting glucose in the vehicle at all times; (4) if hypoglycaemia occurs while driving: stop safely, switch off the engine, move from the driver's seat, treat it, and do not resume driving until recovery and the required interval has elapsed; (5) CGM/flash monitoring may be used only within the current DVLA conditions, including confirmatory fingerprick testing in specified circumstances — check the DVLA guidance rather than relying on a summary. Group 1: two or more episodes of severe hypoglycaemia while awake in the preceding 12 months, impaired awareness, or severe hypoglycaemia while driving → stop driving and notify DVLA. Group 2: every episode of severe hypoglycaemia requiring third-party assistance (including during sleep) must be reported, full awareness of hypoglycaemia is required, and the monitoring period and specialist assessment requirements set by DVLA apply."}
     ]},

    {id:"sleep-vision", nav:"Sleep, vision, age, medicines", title:"Sleep disorders, vision, age-related standards and medicines",
     blocks:[
       {b:"table", head:["Topic","Detail"], rows:[
         ["<b>Obstructive sleep apnoea (OSA) with excessive sleepiness</b>","Drivers with confirmed or suspected OSA and excessive sleepiness that is likely to impair driving must stop driving until satisfactory symptom control has been achieved. Refer promptly to the sleep/respiratory service. DVLA may require evidence of treatment adherence and symptom control, particularly for Group 2 drivers. The Epworth Sleepiness Scale may support assessment but is not by itself a DVLA driving prohibition and should not be the sole decision tool. A patient with known OSA not using treatment who drives is at significant risk — document advice and the patient's response."],
         ["<b>Vision</b>","Minimum standard for Group 1: read a number plate at 20 metres in good daylight, binocular field at least 120° horizontally, extending at least 50° left and right, with no significant defect encroaching within 20° of fixation above or below the horizontal meridian, acuity at least 6/12 with both eyes open (glasses allowed); no separate worse-eye standard for Group 1 (Group 2: 6/7.5 in the better eye and 6/60 in the worse eye). Monocular vision: may drive Group 1 if the remaining eye meets the standards and the driver has adapted — follow the current DVLA visual guidance on notification. Cataracts: binocular acuity worse than 6/12 = must not drive; refer for assessment — surgery may restore vision but does not automatically restore driving eligibility. Glaucoma: binocular field loss → DVLA assessment. Macular degeneration: acuity &lt;6/12 = cannot drive Group 1."],
         ["<b>Age-related standards</b>","No upper age limit for driving in the UK. At age 70: licence must be renewed every 3 years (medical self-declaration — no automatic medical examination). DVLA sends D46P renewal form. GP may be asked to complete medical reports for age-related licence renewals. GP role: assess and document cognitive function (screening scores support but do not replace clinical assessment and are not a DVLA fitness test), vision, physical ability, and advise honestly."],
         ["<b>Medications and driving</b>","Any medicine can impair driving through sedation, dizziness, impaired concentration, slowed reactions, visual disturbance or hypoglycaemia. Patients should not drive if impaired, particularly when starting treatment, after a dose increase, when combining sedatives or when taking alcohol. Benzodiazepines, Z-drugs, opioids, sedating antihistamines (e.g. chlorphenamine), sedating antipsychotics, gabapentinoids and dopaminergic drugs can impair driving. Dopamine agonists (ropinirole, pramipexole, cabergoline) can cause excessive sleepiness and sudden sleep attacks — advise not to drive if these occur, considering the individual drug and clinical circumstances. Some medicines are also covered by the drug-driving legislation; a prescribed medicine does not provide a defence if driving is impaired. Taking a listed medicine does not by itself mean DVLA must be notified — notification depends on the condition, treatment and effect on safe driving."]
       ]},
       {b:"why", html:"Sleepiness at the wheel is an important road-safety issue, so asking about sleepiness and driving is a key primary care intervention. The Epworth Sleepiness Scale (ESS) is a validated 8-question self-reported tool that may support assessment but should not be used as the sole decision tool (NICE NG202). Any patient with EDS should be asked explicitly about driving: ‘Do you drive for work? Have you ever felt sleepy at the wheel or had a near-miss?’ Excessive sleepiness likely to impair driving should prompt prompt sleep/respiratory referral AND an explicit conversation about stopping driving until satisfactory symptom control has been achieved. DVLA may require evidence of treatment adherence and symptom control, particularly for Group 2 drivers — check the current DVLA criteria."}
     ]},

    {id:"consult", nav:"Consultation", title:"The GP consultation — what to say and document",
     blocks:[
       {b:"table", head:["Element","What to do"], rows:[
         ["<b>Standard consultation checklist for driving-relevant conditions</b>","(1) Identify the condition and check DVLA guide (current GOV.UK <i>Assessing fitness to drive</i> chapter for the condition — record which guidance was checked and the date checked). (2) Determine: must the patient stop driving now? Must they notify DVLA? Is there a time restriction? (3) Communicate clearly: “Because of your [condition], DVLA rules mean you must not drive / you must notify DVLA / you cannot drive for [X months].” (4) Explain patient's duty: “You are legally responsible for notifying the DVLA. I will not report on your behalf routinely, but I will note our conversation in your record.” (5) Provide written information or GOV.UK URL. (6) Document: every detail of the advice given and the patient's response."],
         ["<b>Driving-related consultation — document</b>","(1) Licence type: Group 1; Group 2; taxi/private-hire or other occupational licence. (2) Condition and date of onset. (3) Relevant symptoms and episodes. (4) Whether an episode occurred while driving. (5) Medication, recent dose changes and treatment adherence. (6) Functional, visual, cognitive and neurological findings. (7) Specific DVLA guidance checked and date checked. (8) Advice to stop driving, if applicable. (9) Advice to notify DVLA. (10) Whether the patient agrees. (11) Capacity and insight. (12) Plan for specialist assessment or DVLA report. (13) Safety-net and follow-up."],
         ["<b>Handling patient refusal to stop driving</b>","(1) Clarify the reason for refusal. (2) Check capacity and understanding. (3) Explain the legal requirement and the public-safety implications (including insurance and criminal liability). (4) Offer help with the DVLA notification, and a second opinion or specialist assessment where appropriate. (5) Tell the patient that disclosure may be necessary. (6) If the patient continues driving and the risk of death or serious harm is sufficiently high, notify DVLA's medical adviser with relevant information only. (7) Inform the patient before disclosure where practicable and safe. (8) Record the decision-making process. The GMC guidance: breach of confidentiality is justified when the risk is “serious and real” and the disclosure is necessary and proportionate."],
         ["<b>DVLA medical report forms (D4/D952)</b>","D4 form: medical examination report completed by a doctor for initial Group 2 (HGV/bus) application and at the relevant renewals. D952: for patients with certain conditions seeking Group 1 renewal. GP may charge a fee for completing these forms (BMA suggested fee schedule). Complete factually — record what you observe and what the clinical history shows. Do not give opinions about legal fitness to drive — describe the clinical picture and let the DVLA decide."],
         ["<b>Insurance implications for patients</b>","Failing to tell the DVLA about a notifiable condition is an offence under the Road Traffic Act 1988 (fine up to £1,000), and insurers may refuse to pay out if a relevant condition was not declared. Patients must understand: even if they believe they are safe to drive, driving with an undeclared notifiable condition may leave them uninsured — any accident (however minor) could have severe financial and legal consequences for them. Advise the patient to check their insurance policy and notify the insurer where required."]
       ]},
       {b:"say", html:"“The DVLA, rather than your GP, decides whether you can hold a driving licence. My role is to explain the medical risk, advise whether you should stop driving and tell you whether you need to notify DVLA. I will document the advice we discussed. If you continue to drive when I believe there is a serious risk to you or other road users, I may need to disclose relevant information to DVLA.”"},
       {b:"why", html:"The insurance invalidation consequence is often the most persuasive argument for a reluctant patient to notify the DVLA and comply with driving restrictions — patients who resist stopping driving on safety grounds may change their view when they understand that: any accident while driving with an undeclared condition invalidates their motor insurance, meaning they would be personally liable for third-party damages (which could be hundreds of thousands of pounds in a serious accident), their licence could be revoked, and they could face criminal prosecution. This is a factual legal statement, not a threat — GPs can use it constructively: ‘I understand this is very difficult, but I want to make sure you understand the full picture. If you were involved in an accident while driving with this condition undeclared, your insurance would not cover you. You would be personally responsible for any damages.’ This approach respects patient autonomy while ensuring fully informed decision-making."}
     ]},

    {id:"gmc", nav:"Documentation &amp; GMC", title:"Documentation standards and GMC obligations",
     blocks:[
       {b:"table", head:["Topic","Detail"], rows:[
         ["<b>Minimum documentation standard for every driving-relevant consultation</b>","“[Date]: Discussed DVLA notification requirement for [condition]. Advised patient: must not drive / must notify DVLA / driving restriction for [X months]. Patient stated: [will notify / has already notified / declines to notify / expressed distress about this]. DVLA guide condition-specific criteria applied. [If patient declines: further action plan documented].”"],
         ["<b>Annual review — driving status check</b>","At every annual review for driving-relevant conditions (epilepsy, diabetes, dementia, AF, cardiac conditions, OSA): explicitly record current driving status, whether DVLA has been notified, and whether the patient meets current criteria for their licence. This proactive approach prevents gaps in documentation."],
         ["<b>If patient refuses to notify DVLA or stop driving</b>","Document all conversations. Include: exact advice given, patient's response, and your assessment of the risk level. If the patient cannot or will not notify and continues to drive with a serious risk of death or serious harm: (1) tell the patient you will inform DVLA, where practicable and safe; (2) notify DVLA's medical adviser with relevant information only; (3) document the decision-making process and the report. GMC guidance: breach of confidentiality is justified “where the risk is real, the benefit of disclosure outweighs the harm, and disclosure is to an appropriate authority.”"],
         ["<b>DVLA contact details</b>","DVLA Drivers Medical Group: 0300 790 6806. Online reporting form: <a href='https://www.gov.uk/report-driving-medical-condition' rel='noopener'>gov.uk/report-driving-medical-condition</a>. DVLA Swansea SA99 1TU. Condition-specific guidance: <a href='https://www.gov.uk/driving-medical-conditions' rel='noopener'>gov.uk/driving-medical-conditions</a>."]
       ]},
       {b:"why", html:"The GMC guidance on confidentiality and DVLA reporting (updated 2017) provides the ethical framework that governs GP decision-making when a patient refuses to comply with driving restrictions — it represents one of the few situations where a GP may ethically breach patient confidentiality without consent. The key conditions that must all be met before a GP can report to DVLA without patient consent: (1) the condition poses a serious risk of harm to the patient or others if driving continues; (2) the GP has given the patient the opportunity to inform the DVLA themselves and the patient has refused or is unable to (e.g. lacks capacity); (3) disclosure is necessary and proportionate to prevent the risk; and (4) the GP has told the patient that disclosure will be made, where practicable and safe. In practice, the threshold for direct GP reporting is high — it should be reserved for cases where the clinical risk is serious (not merely theoretical) and the patient is actively continuing to drive despite clear advice. For most cases, thorough documentation of advice given is sufficient. There is no blanket rule that the GP is liable if a patient who has not notified DVLA causes an accident — the relevant issue is whether the doctor acted in accordance with professional guidance and documented appropriate advice."}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways",
     blocks:[
       {b:"table", head:["Service","Refer for"], rows:[
         ["<b>Ophthalmology</b>","Visual field defect affecting driving standard · Acuity &lt;6/12 (cataracts, macular degeneration, glaucoma) — refer for assessment; DVLA decides driving eligibility"],
         ["<b>Neurology</b>","Epilepsy management + DVLA advice · New-onset cognitive impairment affecting driving · Parkinson's disease with concerns about driving ability"],
         ["<b>Cardiology</b>","Arrhythmia + driving restriction · Post-ICD/pacemaker driving restrictions · TLoC/syncope of uncertain cause (urgent if exertional syncope, abnormal ECG, heart failure, murmur or family history of sudden cardiac death)"],
         ["<b>Sleep medicine / respiratory</b>","Suspected OSA with EDS + driving (urgent if driving HGV/bus) · CPAP titration and compliance monitoring"],
         ["<b>Diabetes specialist</b>","IDDM with hypo unawareness + driving concerns · Recurrent severe hypoglycaemia"],
         ["<b>Driving assessment centres</b>","Patients with conditions that affect driving ability who wish to continue driving (stroke, severe disability, dementia) — NHS driving assessment centres provide expert on-road assessment."],
         ["<b>DVLA</b>","Direct patients to the DVLA for notification and current standards. If a patient continues to drive against advice and cannot be persuaded, follow GMC guidance on informing the DVLA (see <a href='#gmc'>Documentation &amp; GMC</a>)."]
       ]},
       {b:"why", html:"NHS driving assessment centres (DACs) provide expert on-road assessment for patients with conditions that may affect driving ability — they are staffed by occupational therapists with specialist driving assessment training and driving instructors. They can assess: whether a patient with dementia, stroke, severe physical disability, or brain injury can safely continue driving, what adaptations (hand controls, wider mirrors, automatic transmission) might enable safe driving, and provide a formal report to the DVLA and the GP. Centres are listed on the Forum of Mobility Centres website. A practical assessment may be useful but is not automatically required in every case. GP referral to a DAC is appropriate for: patients who want to continue driving after a neurological event or diagnosis, where clinical assessment alone is insufficient to determine fitness, and where the patient or family disputes the GP's assessment of driving fitness. The DAC report provides objective evidence to support or refute the patient's ability to drive safely, and significantly reduces the medico-legal burden on GPs in complex cases."}
     ]},

    {id:"occupation", nav:"Occupation", title:"Special scenarios — occupation, pilots and professional drivers",
     blocks:[
       {b:"table", head:["Group","Detail"], rows:[
         ["<b>Professional drivers (HGV/bus — Group 2)</b>","All Group 2 drivers must meet stricter medical standards — Group 2 licences are normally valid for up to 5 years: renewal every 5 years or at age 45, whichever is earlier, and annually from age 65 (shorter periods may apply for medical reasons), with a D4 medical assessment at initial application and the relevant renewals. Any medical condition that develops between renewals must be declared immediately. Conditions that commonly bar or restrict Group 2 licensing (check the current DVLA chapter): seizures/epilepsy (seizure history and antiseizure medication use over the preceding 10 years are considered), ICD in situ, insulin-treated diabetes (strict DVLA criteria, full hypoglycaemia awareness required), severe psychiatric illness, visual field defects. Taxi and private-hire drivers may also need to meet additional local authority licensing standards."],
         ["<b>Aviation (pilots — CAA)</b>","Pilots (Private Pilot Licence PPL, Commercial CPL, Air Traffic Controllers) are regulated by the Civil Aviation Authority (CAA), not the DVLA. Different and stricter standards. GPs should advise pilot patients to contact the CAA medical department for any new medical condition, surgery, or new medication — particularly: cardiac conditions (AF, IHD, hypertension), neurological conditions (epilepsy, TIA, migraine with aura), psychiatric conditions, and any medication that causes sedation. CAA Aviation Medical Examiner (AME) provides the formal aviation medical."],
         ["<b>Maritime (seafarers — MCA)</b>","Seafarers are regulated by the Maritime and Coastguard Agency (MCA) ENG1 medical standard. GPs may be asked to provide medical reports for seafarer examinations (performed by Approved Doctors). Conditions with specific restrictions: insulin-treated diabetes (generally not eligible for unrestricted ENG1), epilepsy, severe psychiatric conditions, severe visual impairment."],
         ["<b>Emergency services personnel</b>","Firefighters, police officers, ambulance personnel: occupational health-managed, not DVLA-regulated for their work vehicles. However, GP-issued fitness certificates may be requested. Conditions affecting work capacity (cardiac, neurological) are assessed by occupational health using fitness-for-work standards that differ from DVLA standards."]
       ]},
       {b:"why", html:"The CAA vs DVLA distinction is clinically important because patients who are pilots often do not spontaneously declare this when discussing a new medical condition — they may not realise the implications for their licence, or may be reluctant to acknowledge the implications. GPs should proactively ask ‘Do you hold any aviation licence or work in aviation?’ at the first consultation for any potentially aviation-relevant condition (cardiac, neurological, psychiatric, vision). The CAA standards are in many cases stricter than DVLA standards: for example, a single episode of AF may not affect DVLA Group 1 driving after treatment, but would require CAA review and potentially a period off flying with serial cardiac assessments before return to aviation. GPs who advise a pilot patient about driving fitness using DVLA rules without mentioning CAA may be giving incomplete advice — the patient may comply with DVLA requirements and continue flying without understanding that separate CAA notification is needed."}
     ]},

    {id:"support", nav:"Patient support", title:"Patient support, independence and alternatives",
     blocks:[
       {b:"tiles", v:"life", items:[
         {t:"Supporting the patient who must stop driving", html:"Losing the driving licence can be a devastating blow — particularly for elderly patients, rural residents, people with caring responsibilities, or those for whom driving is an occupational necessity. Acknowledge this explicitly: “I understand this will significantly affect your independence, and I want to help you think through the implications.” Transport alternatives: public transport, taxis, community transport (Dial-a-Ride, local authority schemes), volunteer driver services (Community Transport Association — ctauk.org), family/carer transport, online shopping delivery."},
         {t:"Financial implications", html:"Blue Badge scheme (DLA/PIP mobility component) may provide parking concessions if mobility is impaired (disability unrelated to the driving restriction itself). Motability scheme (for PIP mobility recipients — lease-adaptable vehicle). Citizens Advice for benefits entitlement."},
         {t:"Adaptive driving after medical events", html:"Many conditions allow return to driving with adaptations: hand controls (lower limb weakness post-stroke), panoramic mirrors (visual field defect), automatic transmission (cerebral palsy, upper limb weakness), steering ball (hand weakness). NHS Driving Assessment Centres assess and recommend adaptations. The patient should check DVLA requirements — the adaptation may need assessment/approval."},
         {t:"Driving cessation in dementia", html:"Managing driving cessation in dementia requires particular sensitivity — patients often lack insight into their impairment and strongly resist stopping. Approaches: involve the family (with patient consent) in the discussion; consider a formal on-road driving assessment where useful — not required in every case (provides objective third-party assessment that may be more acceptable to the patient than the GP's opinion); explain that dementia that may affect driving must be notified and that DVLA then makes an individual licensing decision (“the DVLA, not your GP, decides whether you can hold a licence”); contact Alzheimer's Society for patient/family support resources."},
         {t:"Epilepsy and return to driving", html:"The return-to-driving date is a major psychological milestone for people with epilepsy — it symbolises a return to independence and normality. Help patients: (1) track seizure-free periods accurately (document seizure dates in clinical record); (2) understand the precise conditions for return, which depend on seizure type and history (check the DVLA neurological chapter) — do not stop or change antiseizure medication solely to meet a driving standard; (3) register with DVLA proactively (the DVLA can issue a licence with a 1–3 year review condition); (4) contact Epilepsy Action (epilepsy.org.uk) for peer support and practical advice on driving with epilepsy."},
         {t:"Diabetes and hypoglycaemia driving safety", html:"Carry glucose supplies in the car (glucose tablets, GlucoJuice, dextrose gel). Check glucose before driving and at least every 2 hours during a journey; do not drive if below 4.0 mmol/L, with symptoms of hypoglycaemia or if feeling unsafe. Pull over safely as soon as there are warning signs of hypoglycaemia — do NOT complete the journey first; treat it and do not resume until recovered and the required interval has elapsed. Never drive late at night without pre-drive glucose check. Diabetes UK (diabetes.org.uk): detailed patient guide on driving with diabetes."},
         {t:"OSA and driving", html:"Drivers with OSA and excessive sleepiness likely to impair driving must not drive until satisfactory symptom control has been achieved. DVLA may require evidence of treatment adherence and symptom control, particularly for Group 2 drivers — check the current DVLA criteria. Practical CPAP support is provided by the sleep service."},
         {t:"GP driving form completion (D4 / D952)", html:"A fee may be charged for D4 form completion (fees vary — agree before completing). Complete factually: medical history, examination findings, drug history, clinical impression. Do not state “fit to drive” — describe the clinical picture and let DVLA decide. Request relevant specialist letters (neurology, cardiology) before completing if needed for accuracy."}
       ]},
       {b:"why", html:"The GP form completion fee for DVLA medical reports (D4/D952) is an allowable charge — completing DVLA medical forms is not part of the NHS contract for GP services and GPs are entitled to charge a fee (fees vary). The GP should explain this to patients before agreeing to complete the form — patients need to understand that they will be charged, and the fee must be agreed before the consultation. GPs who routinely complete these forms should have a practice policy on fees, a standard process for reviewing relevant clinical history and specialist letters, and a turnaround time communicated to patients. Accuracy is paramount — a GP who provides inaccurate information on a DVLA medical form (whether overstating or understating the patient's condition) faces both regulatory risk (GMC fitness to practise) and civil liability. When in doubt about a clinical finding's relevance to fitness to drive, GPs should contact the DVLA's medical advisory branch (0300 790 6806) for guidance before completing the form."}
     ]},

    {id:"review", nav:"Review &amp; safety-net", title:"Review and safety-netting",
     blocks:[
       {b:"cards", items:[
         {tone:"amber", h:"🟠 Follow up the time-limited ban", html:"<b>Review at the end of any time-limited ban</b> (e.g. seizure, TIA/stroke, syncope) and confirm the standard is met before resuming. Re-counsel if the condition changes or treatment is altered."},
         {tone:"red", h:"🔴 Cannot or will not notify", html:"<b>If a patient cannot or will not notify DVLA (including lack of insight/capacity) and continues to drive with a serious risk to others, inform the DVLA</b> per GMC guidance, telling the patient first where practicable and safe."},
         {tone:"cream", h:"💬 Make the advice explicit and recorded", html:"Clearly counsel the patient on whether and when they must stop driving and their duty to notify the DVLA; give written information and the relevant condition standard; document the advice in the record; advise them to check their insurance policy and notify the insurer where required."}
       ]}
     ]},

  foot:"Driving and medical conditions in primary care. This page summarises; condition-specific standards must be checked in the current DVLA chapter for every condition, as the guide is updated regularly. DVLA, not the GP, makes the licensing decision. The patient must notify DVLA; the GP advises when to stop driving, documents the advice, and informs DVLA only when the patient cannot or will not notify and continues to drive with a serious risk to others (GMC 2017). Sources: DVLA Assessing fitness to drive (current online edition), NICE CG109, NICE NG202, NICE NG97, MHRA Drugs and driving, GMC Confidentiality: patients' fitness to drive (2017), RCGP Driving and Medical Standards Toolkit, Road Traffic Act 1988, CAA Medical Standards for Aviation."
