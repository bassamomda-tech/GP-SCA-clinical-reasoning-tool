<script>
MG.render({
  icon:"🧴",
  title:"Atopic Eczema — The Complete Guide",
  eyebrow:"Protocol · assess and manage in one place",
  stemTitle:"Atopic eczema — a generous emollient base, the right steroid for the right skin, and two infections you must not miss",
  stemSub:"Most eczema that ‘isn’t working’ is under-treated rather than untreatable. The job in primary care is to confirm it is atopic eczema, grade both the skin and its impact, build a daily emollient habit, match topical steroid potency to the body site and the flare, recognise bacterial infection and eczema herpeticum, prevent repeat flares, and know when the specialist ladder — phototherapy, systemic immunosuppressants, biologics and JAK inhibitors — is the right next step. Sources: NICE CG57 (2007, updated 2023) · NICE NG190 (2021) · NICE TA81, TA82, TA177, TA534, TA681, TA814, TA986, TA1077 · MHRA Drug Safety Updates · Greater Manchester antimicrobial guidance and formulary · BAD patient information · EuroGuiDerm 2022 and 2025 living update (international). Scope: NICE CG57 applies specifically to children under 12. Advice for adolescents (12–17) and adults draws on NICE technology appraisals, NICE NG190, MHRA safety advice, local Greater Manchester pathways and international dermatology guidance; adult referral thresholds are not NICE CG57 criteria.",
  guideline:"NICE CG57 (2007, updated June 2023) · NICE NG190 (2021) · NICE TA534 / TA681 / TA814 / TA986 / TA1077 · MHRA Drug Safety Update (Dec 2018, Sep 2021, Nov 2022, Apr 2023, May 2024) · Greater Manchester antimicrobial guidance",
  meta:[
    {t:"NICE CG57 · atopic eczema in under 12s (updated 2023)"},
    {t:"NICE NG190 · infected eczema (2021)"},
    {t:"NICE TA81 · TA82 · TA177 · TA534 · TA681 · TA814 · TA986 · TA1077"},
    {t:"MHRA DSU · emollient fire risk · steroid withdrawal · JAK inhibitors"},
    {t:"EuroGuiDerm 2022 and 2025 living update · ESCD 2022 (international, adults and hands)"},
    {t:"Greater Manchester antimicrobial guidance · GMMMG formulary"},
    {t:"Suspected cancer · NICE NG12 nipple changes of concern", tone:"tw"}
  ],
  lead:"<div class='mg-layers'><a href='#flags'><b>Red flags</b><small>Herpeticum, nipple, erythroderma</small></a><a href='#emollients'><b>Emollients</b><small>250–500 g a week in children</small></a><a href='#steroids'><b>Steroids</b><small>Potency by site</small></a><a href='#refer'><b>Refer</b><small>Same-day to routine</small></a></div>",
  quickSub:"Six cards that cover most eczema consultations. Sources are listed under <a href='#provenance'>Evidence</a>; NICE CG57 figures apply to children under 12.",
  quick:[
    {tone:"red", h:"Eczema herpeticum: start aciclovir today", html:"Eczema that suddenly becomes painful and worsens fast, with clusters of uniform punched-out erosions or blisters, sometimes with fever — suspect herpes simplex. NICE CG57 says to start <b>systemic aciclovir immediately</b> and arrange <b>same-day specialist dermatology advice</b>; periocular or ocular involvement requires <b>same-day ophthalmology advice</b> in addition to dermatology input. Do not wait for HSV PCR or culture before starting treatment; if same-day dermatology advice cannot be obtained promptly, arrange urgent hospital assessment."},
    {tone:"cream", h:"Emollients are the treatment, not an extra", html:"NICE CG57: emollients form the basis of management and continue <b>even when the skin is clear</b>. In children, prescribe leave-on emollients in large quantities — <b>250–500 g a week</b> — with a supply for nursery or school. Use them as the soap substitute too. Do not routinely prescribe emollient <b>bath additives</b> for children — they add no benefit over standard care (CG57 2023 update); standard emollients or emollient wash products can still be used for washing."},
    {tone:"cream", h:"Potency follows the body site", html:"Mild potency on the face and neck (a moderate for 3–5 days in a severe flare); moderate or potent only for 7–14 days in the axillae and groin; no potent steroids under 12 months without specialist dermatological supervision and no very potent steroids in children without specialist advice (NICE CG57). Apply <b>once or twice daily only</b> (NICE TA81)."},
    {tone:"amber", h:"Not every weepy flare needs an antibiotic", html:"NICE NG190: do not routinely give an antibiotic to someone who is not systemically unwell. Continue emollients and topical steroid. If an antibiotic is nevertheless judged necessary for a localised, non-severe infection, a short topical course may be appropriate — <b>fusidic acid 2% three times daily for 5–7 days</b>. Widespread infection or systemically unwell → <b>oral flucloxacillin 500 mg four times daily for 5–7 days</b> in adults (penicillin allergy: current local alternative; clarify pregnancy before a macrolide). Do not swab at first presentation; swab if recurrent, worsening or not improving as expected."},
    {tone:"blue", h:"Grade two things: skin and life", html:"NICE CG57 grades physical severity in children as clear, mild, moderate or severe <b>and</b> separately asks about sleep, school or work, mood and family life at every review. A child with small patches and no sleep has severe disease by impact."},
    {tone:"purple", h:"Persistent one-sided nipple ‘eczema’: think Paget’s", html:"NICE NG12: refer using a suspected cancer pathway referral (for an appointment within 2 weeks) for breast cancer in people <b>aged 50 and over</b> with any of the following in <b>one nipple only</b>: discharge, retraction or other changes of concern. Unilateral nipple eczema is not itself an NG12 criterion, but persistent unilateral nipple or areolar dermatitis — especially progressive, crusted, eroded, bleeding, with discharge or retraction, or not responding to treatment — should prompt reassessment and consideration of breast referral for possible Paget’s disease. Do not delay with repeated topical treatments, and do not let age reassure in a suspicious lesion.", src:"NICE NG12 (2015, last updated April 2026)"}
  ],
  pathwaySub:"Five moves from first look to specialist ladder. The first step is where harm happens.",
  pathway:[
    {title:"Screen for the dangerous presentations", html:"Eczema herpeticum (painful, rapidly spreading, punched-out erosions) · periocular involvement · a systemically unwell child or adult with spreading infection · erythroderma (most of the skin surface red and inflamed), especially with systemic features · suspected sepsis, necrotising fasciitis or severe cellulitis · persistent unilateral nipple or areolar dermatitis, or nipple changes of concern · fixed, atypical plaques in an adult that never clear. Any of these changes the plan before routine treatment starts.", alert:true},
    {title:"Confirm it is atopic eczema and grade it", html:"In children under 12, use the NICE CG57 diagnostic criteria (itch plus three or more features). In adults, diagnosis is clinical: consider allergic or irritant contact dermatitis, psoriasis, seborrhoeic dermatitis, scabies, tinea, venous eczema, drug eruption and cutaneous T-cell lymphoma, and document pattern, chronicity and distribution. Record physical severity <b>and</b> impact on sleep, schooling or work, and mood. Map the sites — they decide potency."},
    {title:"Build the emollient base", html:"A leave-on emollient the person will actually use, in generous quantities, applied several times a day and after washing, and used instead of soap. Explain the fire risk on fabric (MHRA). Continue when clear."},
    {title:"Treat flares by site, then keep control", html:"Topical steroid of the right potency for the site, once or twice daily, until the flare settles. For frequent flares at the same sites, consider proactive treatment — in children under 12, topical steroid on 2 consecutive days a week (NICE CG57); in adolescents and adults, per local dermatology guidance and EuroGuiDerm (international). Topical calcineurin inhibitors are a second-line option where steroids have not controlled eczema or carry a risk of atrophy (NICE TA82)."},
    {title:"Review, troubleshoot, escalate", html:"Check quantities issued, technique and steroid fears before stepping up. Treat infection per NG190. Children under 12: refer when CG57 criteria are met — urgently if severe disease has not responded to a week of optimal topical treatment. Adults and adolescents: refer by severity, impact, diagnostic uncertainty and treatment failure, not the paediatric one-week rule. Specialists offer phototherapy, systemic treatment or biologics under NICE TA534, TA681, TA814, TA986 and TA1077."}
  ],
  sections:[
    {id:"flags", nav:"Red flags", title:"Red flags — act on these first", sub:"Most eczema is a chronic, fluctuating nuisance. These presentations are not.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Eczema herpeticum (widespread herpes simplex)", html:"Rapidly worsening, painful eczema with clustered, uniform, punched-out erosions or vesicles, often with fever or malaise, and poor response to the usual treatment. Start systemic aciclovir immediately and get same-day specialist dermatology advice; if that cannot be obtained promptly, arrange urgent hospital assessment. Do not wait for HSV PCR or culture. Consider admission or intravenous treatment if systemically unwell, extensive disease, immunocompromised, unable to take oral treatment, or with neurological or ocular symptoms. It can be fatal or cause blindness if missed.", src:"NICE CG57 (updated 2023) · NICE QS44 statement 7"},
         {tone:"red", h:"Herpeticum around the eyes", html:"Periocular or ocular involvement → systemic aciclovir plus same-day ophthalmology advice in addition to dermatology input, to exclude keratitis. Not every lesion near the eye needs admission; the urgency is specialist assessment.", src:"NICE CG57 (updated 2023)"},
         {tone:"red", h:"Systemically unwell with spreading infection", html:"Fever, malaise or rapidly spreading cellulitis on a background of eczema → oral antibiotic per NG190, and refer or admit for suspected sepsis, necrotising fasciitis, severe cellulitis, pain disproportionate to the skin findings, dehydration, or failure of or intolerance to oral treatment.", src:"NICE NG190 (2021)"},
         {tone:"red", h:"Erythroderma", html:"Widespread erythroderma, especially with fever, rigors, dehydration, tachycardia, hypothermia, fluid loss, pain or systemic illness, requires same-day acute assessment with dermatology and medical input; consider admission. The differential is broad (eczema, drug eruption, psoriasis, cutaneous T-cell lymphoma and other inflammatory dermatoses)."},
         {tone:"purple", h:"Nipple changes of concern <span class='tw'>Suspected cancer</span>", html:"Refer using a suspected cancer pathway referral (for an appointment within 2 weeks) for breast cancer in people aged 50 and over with any of the following symptoms in one nipple only: discharge, retraction or other changes of concern. Consider a suspected cancer pathway referral in people with skin changes that suggest breast cancer. Persistent unilateral nipple or areolar dermatitis — particularly if progressive, crusted, eroded, bleeding, with discharge or retraction, or not responding to appropriate treatment — should prompt reassessment and consideration of breast referral for possible Paget’s disease. This is clinical concern, not a separate NG12 criterion for “unilateral nipple eczema”. Do not delay referral with repeated topical treatment, and do not let a younger age reassure when a lesion is highly suspicious.", src:"NICE NG12 (2015, last updated April 2026) recs 1.4.1 and 1.4.2"},
         {tone:"amber", h:"Fixed, atypical ‘eczema’ in an adult", html:"Persistent, atypical or treatment-resistant patches or plaques in an adult — particularly with unusual distribution, poikiloderma, atrophy, induration, progressive change or disproportionate symptoms — require dermatology assessment. Biopsy, arranged by dermatology or an experienced clinician, may be needed; early biopsies can be non-diagnostic, and a single non-diagnostic biopsy does not always exclude cutaneous T-cell lymphoma. The differential includes chronic dermatitis, psoriasis, tinea, drug eruption and parapsoriasis — not every persistent adult plaque is lymphoma. There is no NG12 criterion for this — refer on clinical suspicion."},
         {tone:"amber", h:"Severe disease not responding after a week (children under 12)", html:"In children under 12, severe atopic eczema that has not responded to optimal topical treatment after 1 week, or bacterially infected eczema where treatment has failed, meets the criteria for urgent (within 2 weeks) specialist referral. Do not apply this as an automatic adult two-week criterion.", src:"NICE CG57 (updated 2023)"}
       ]},
       {b:"why", html:"Herpes simplex spreads easily across a broken skin barrier. The lesions are uniform because they arise at the same time, and they erode quickly, leaving round punched-out sores that can merge into larger raw areas. Bacterial infection, by contrast, tends to weep and crust yellow and is usually less painful. The practical rule is that a <b>sudden painful deterioration</b> in someone with eczema is herpeticum until you have looked carefully — and treating early with aciclovir is safe even when you turn out to be wrong."}
     ]},

    {id:"diagnose", nav:"Diagnose", title:"Is it atopic eczema? Diagnosis and look-alikes", sub:"The label drives everything else, so confirm it before treating.",
     blocks:[
       {b:"dl", rows:[
         ["<b>NICE CG57 criteria (children under 12)</b>","Not a validated adult rule. An itchy skin condition <b>plus three or more</b> of: visible flexural dermatitis (or cheeks and/or extensor surfaces if aged 18 months or under); a personal history of flexural dermatitis (or cheeks/extensors at 18 months or under); a history of dry skin in the last 12 months; a personal history of asthma or allergic rhinitis (or atopic disease in a first-degree relative if under 4); onset before age 2 (this criterion is not used in children under 4)."],
         ["<b>Skin of colour</b>","NICE CG57 notes that in Asian, Black Caribbean and Black African children eczema may affect the extensor surfaces rather than the flexures, and discoid or follicular patterns can occur. Redness is harder to see — rely on itch, texture, thickening and colour change."],
         ["<b>Adults</b>","Diagnosis is clinical — the paediatric CG57 criteria are not a validated adult rule. Consider atopic dermatitis alongside allergic or irritant contact dermatitis, psoriasis, seborrhoeic dermatitis, scabies, tinea, venous eczema, drug eruption and cutaneous T-cell lymphoma. Consider patch testing where allergic contact dermatitis is suspected, particularly with persistent hand, eyelid, facial or occupational eczema. Document the pattern, chronicity, distribution and differential before labelling “adult atopic eczema”."],
         ["<b>Triggers to ask about</b>","Soaps and detergents, heat and sweating, wool and rough fabrics, house dust mite, pets and pollen, stress, and infection. In infants with moderate or severe eczema that does not settle, ask about reactions to cow’s milk and egg."]
       ]},
       {b:"table", head:["Look-alike","Clue","What to do"], rows:[
         ["<b>Allergic contact dermatitis</b>","Hands, eyelids, face, or a sharp edge matching a product or jewellery; worse at work","Occupational and exposure history; consider dermatology referral for patch testing (ESCD 2022, international guidance)"],
         ["<b>Seborrhoeic dermatitis</b>","Greasy yellow scale on scalp, eyebrows, nasolabial folds, chest","Antifungal-based treatment rather than escalating steroids"],
         ["<b>Psoriasis</b>","Well-defined plaques with silvery scale; nails; extensor surfaces","Different treatment ladder"],
         ["<b>Scabies</b>","Burrows in finger webs and wrists, night itch, others in the house itchy","Treat the patient and close contacts simultaneously per current UKHSA/local guidance; wash or bag clothing, bedding and towels; itch can persist after successful treatment; consider crusted scabies and urgent specialist advice if immunosuppressed or in an institution"],
         ["<b>Tinea</b>","Annular, spreading edge, one-sided; worse after steroid","Stop inappropriate steroid monotherapy and arrange mycology (skin scrapings) where feasible; a steroid may occasionally be used briefly alongside an antifungal under clinical guidance, but do not escalate steroids when tinea is suspected"],
         ["<b>Venous eczema</b>","Lower legs with varicose veins, haemosiderin, oedema","Treat venous disease; compression if arterial supply adequate"],
         ["<b>Cutaneous T-cell lymphoma</b>","Fixed patches in an adult, sun-protected sites, never clearing","Dermatology assessment; biopsy may be needed and can be non-diagnostic early"]
       ]}
     ]},

    {id:"grade", nav:"Grade", title:"Grading severity and impact", sub:"Two separate scores — the skin and the life around it — both recorded at each review.",
     blocks:[
       {b:"table", head:["Physical severity (NICE CG57, children under 12; a guide only in adults)","What you see and hear"], rows:[
         ["<b>Clear</b>","Normal skin, no evidence of active eczema"],
         ["<b>Mild</b>","Areas of dry skin, infrequent itching, with or without small areas of redness"],
         ["<b>Moderate</b>","Areas of dry skin, frequent itching, redness, with or without excoriation and localised skin thickening"],
         ["<b>Severe</b>","Widespread dry skin, incessant itching and redness, with or without excoriation, extensive thickening, bleeding, oozing, cracking and pigment change"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Impact matters as much as area", html:"Ask about sleep (the child’s and the parents’), school or work absence, mood, bullying, self-consciousness and family strain. Impact can move someone up a treatment step even when the physical score looks moderate.", src:"NICE CG57 (updated 2023) · NICE QS44 statement 3"},
         {tone:"blue", h:"Treatment follows the grade", html:"In children under 12 (NICE CG57; adults by clinical judgement): mild: emollients plus mild potency steroid. Moderate: emollients, moderate potency steroid, topical calcineurin inhibitors, bandages. Severe: emollients, potent steroid, topical calcineurin inhibitors, bandages, phototherapy and systemic therapy — the last two are specialist.", src:"NICE CG57 (updated 2023) · NICE QS44 statement 2"}
       ]}
     ]},

    {id:"emollients", nav:"Emollients", title:"Emollients — quantity, technique and safety", sub:"The treatment everyone under-uses. Check the repeat quantities, not just what the patient says.",
     blocks:[
       {b:"cards", items:[
         {tone:"cream", h:"How much", html:"NICE CG57: leave-on emollients prescribed in large quantities — <b>250–500 g a week</b> for children — and easily available at nursery, pre-school or school. Adults with widespread eczema may require large quantities, often several hundred grams weekly; prescribe according to body surface area, patient use and clinical need rather than applying the paediatric figure automatically. Review whether the quantity issued is consistent with the affected body surface area and the prescribed frequency of use.", src:"NICE CG57 (updated 2023)"},
         {tone:"cream", h:"How often and how", html:"Use emollients more often and in larger amounts than any other treatment, every day, even when the skin is clear. BAD advises moisturising often — at least 2–3 times a day — smoothing it on in the direction of hair growth rather than rubbing it in.", src:"NICE CG57 · BAD atopic eczema leaflet (Aug 2025)"},
         {tone:"cream", h:"Wash with it", html:"Use the emollient (or an emollient soap substitute) in place of soap, bubble bath and shower gel. NICE CG57’s 2023 update says <b>do not offer emollient bath additives</b> to children with eczema — the BATHE trial found no added benefit over standard care. They do not worsen eczema and families may buy them if they still wish; standard emollients or emollient wash products may still be used for washing, according to preference.", src:"NICE CG57 (updated June 2023)"},
         {tone:"cream", h:"Choice and preference", html:"Offer a choice of unperfumed emollients. Ointments hold moisture best but feel greasy; creams and lotions are easier by day. The best emollient is the one that gets used; review and switch if it stings or is disliked.", src:"NICE CG57 (updated 2023)"},
         {tone:"amber", h:"Aqueous cream", html:"Aqueous cream contains sodium lauryl sulfate and can cause stinging, burning, itch and redness, especially in children with eczema. If it irritates, stop and switch to an SLS-free emollient. It is not a good leave-on emollient.", src:"MHRA Drug Safety Update (March 2013) · aqueous cream"},
         {tone:"amber", h:"Order of application", html:"Apply one topical product at a time and leave several minutes between products; the patient can choose which goes on first. There is no need to impose a universal 20–30-minute interval — a practical regimen the patient can follow is preferable.", src:"NICE CG57 (updated 2023)"},
         {tone:"red", h:"Fire risk — tell every patient", html:"Emollient residue dried onto clothing, bedding, dressings or hair acts as an accelerant if the fabric catches fire. This applies to <b>paraffin-based and paraffin-free</b> products. The product is not usually flammable on the skin or in the container — a source of ignition is needed. Advise no smoking and keeping away from naked flames; change and wash clothing and bedding regularly (washing reduces but does not fully remove residue). Do a specific risk assessment for smokers, oxygen users, and people with reduced mobility, cognitive impairment or high-volume emollient use. This is risk reduction — do not stop an effective emollient solely because of fire risk.", src:"MHRA Drug Safety Update (Dec 2018) · SPS: managing fire risk with emollients"},
         {tone:"green", h:"Hygiene", html:"Use a pump dispenser, or take emollient out of a tub with a clean spoon or spatula rather than fingers, to avoid contaminating the supply with bacteria."}
       ]},
       {b:"say", html:"Think of the moisturiser as the main treatment and the steroid as the fire engine. The moisturiser keeps the fire from starting, so it goes on every day, lots of it, even when your skin looks perfect. The steroid only comes out when there is a flare."}
     ]},

    {id:"steroids", nav:"Topical steroids", title:"Topical corticosteroids — potency by site, quantity by fingertip unit", sub:"Used correctly, topical steroids are safe and effective. Under-treatment from fear is more common than harm from over-use.",
     blocks:[
       {b:"table", head:["Potency","Examples (check BNF/BNFC)","Where it fits"], rows:[
         ["<b>Mild</b>","Hydrocortisone 0.5–2.5%","Face and neck; mild eczema anywhere; infants"],
         ["<b>Moderate</b>","Clobetasone butyrate 0.05%","Moderate flares on trunk and limbs; face and neck for 3–5 days only in a severe flare; axillae and groin for 7–14 days"],
         ["<b>Potent</b>","Betamethasone valerate 0.1%, mometasone furoate 0.1%","Severe eczema on trunk and limbs, thick skin; not on the face or neck in children; do not use in children under 12 months without specialist dermatological supervision"],
         ["<b>Very potent</b>","Clobetasol propionate 0.05%","Specialist advice only in children; short courses on thick skin such as palms and soles in adults"]
       ]},
       {b:"cards", items:[
         {tone:"cream", h:"Site and age rules", html:"Apply to active eczema, including areas active within the previous 48 hours. Tailor potency to severity, which can vary by site. Mild potency for the face and neck except 3–5 days of moderate potency for severe flares. Moderate or potent for 7–14 days only in vulnerable sites such as the axillae and groin. No potent steroids under 12 months without specialist dermatological supervision; no very potent steroids in children without specialist advice. In children aged 12 months or more, use potent steroids for as short a time as possible and no longer than 14 days.", src:"NICE CG57 (updated 2023)"},
         {tone:"cream", h:"Frequency", html:"Prescribe topical corticosteroids for application <b>only once or twice daily</b>. More frequent application adds cost and exposure without benefit; some products are licensed once daily.", src:"NICE TA81 (2004)"},
         {tone:"blue", h:"How much — the fingertip unit", html:"One fingertip unit is the amount squeezed from a standard tube along an adult finger from the tip to the first crease — enough to cover an area the size of two adult hands with fingers together.", src:"BAD topical corticosteroids leaflet (Feb 2024)"},
         {tone:"blue", h:"Regional quantities in adults", html:"Measured fingertip units per application: face and neck about 2.5, one arm about 3, one hand about 1, one leg about 6, front or back of trunk about 7 each, one foot about 2 (Long and Finlay, Clin Exp Dermatol 1991)."},
         {tone:"amber", h:"Topical steroid withdrawal reactions", html:"Long-term, continuous or inappropriate use of topical steroids — particularly moderate to high potency — can be followed on stopping by redness, burning and stinging worse than the original condition. Use the lowest effective potency for the shortest time, review repeat prescriptions, and ask about symptoms after stopping. Rebound eczema after stopping is not automatically topical steroid withdrawal; diagnosis can be difficult and specialist advice may be needed. Patients should not abruptly stop an essential prescribed regimen without advice if severe eczema is likely to flare.", src:"MHRA Drug Safety Update (Sep 2021)"},
         {tone:"blue", h:"Potency is now on the pack", html:"From 2024, topical steroid packs are being relabelled to show their potency (mild, moderate, potent or very potent) so patients can tell them apart. Where the pack shows it, use it when explaining which cream goes where; the same update repeats the warning about withdrawal reactions after prolonged high-potency use.", src:"MHRA Drug Safety Update (May 2024)"},
         {tone:"green", h:"Face and eyelids — ocular safety", html:"Avoid potent or very potent topical steroids around the eyes; prolonged periorbital steroid use may contribute to glaucoma or cataract. Persistent eyelid eczema may indicate allergic contact dermatitis. Refer if there are visual symptoms, severe eyelid swelling or suspected ocular involvement."},
         {tone:"green", h:"Address steroid fears directly", html:"Discuss benefits and harms with the patient or carer and emphasise that, applied correctly, the benefits outweigh possible harms. The risk of clinically important skin atrophy is greatly reduced when the appropriate potency is used on the correct site for the shortest effective duration. Risk is higher with potent preparations, thin skin, occlusion and prolonged or repeated use.", src:"NICE CG57 (updated 2023)"}
       ]},
       {b:"warn", html:"Wet wraps and occlusive bandages increase absorption and effectively raise potency. They should be started by a trained health professional and not used over infected skin. Review growth and systemic effects if prolonged, extensive, potent or occluded topical corticosteroid treatment is being used, particularly in infants and young children."}
     ]},

    {id:"flare", nav:"Flares and control", title:"Getting control, keeping control", sub:"Treat the flare, then stop the next one.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1", when:"every patient", tone:"cream", title:"Emollient base", html:"Generous leave-on emollient several times a day, used as a soap substitute, continued when clear."},
         {step:"2", when:"flare", tone:"cream", title:"Topical steroid matched to site and severity", fromLabel:"flare", html:"Once or twice daily to active eczema (including areas active within the previous 48 hours) until the flare settles, then stop and keep the emollient going. Early treatment of a flare with the right potency usually shortens it."},
         {step:"3", when:"frequent flares at the same sites", tone:"cream", title:"Proactive twice-weekly treatment", fromLabel:"2 or 3 flares a month in the same places", html:"Children under 12 (NICE CG57): once control is achieved, consider topical steroid on the usual flare sites on 2 consecutive days each week, alongside daily emollient, and review after 3–6 months. Adolescents and adults: proactive intermittent treatment (steroid or topical calcineurin inhibitor) can be considered according to local dermatology guidance and EuroGuiDerm (international, 2022); tacrolimus 0.1% in adults and 0.03% in children has trial evidence over up to a year — this is not a NICE requirement."},
         {step:"4", when:"steroid not controlling, or atrophy risk", tone:"amber", title:"Topical calcineurin inhibitor", fromLabel:"second line", html:"NICE TA82: <b>tacrolimus</b> ointment for moderate to severe eczema in adults and children aged 2 and over not controlled by topical steroids where there is a serious risk of important adverse effects (particularly irreversible skin atrophy); <b>pimecrolimus</b> cream for moderate eczema on the face and neck in children aged 2–16. Not for mild eczema and never first line. TA82 advises initiation by a physician with a special interest in dermatology — follow local shared-care arrangements. Warn about transient burning and stinging and advise sun protection. Do not apply under occlusion without specialist advice, and avoid on clinically infected skin until the infection is treated."},
         {step:"5", when:"still severe", tone:"amber", title:"Specialist treatment", fromLabel:"referral", html:"Phototherapy, systemic immunosuppressants, biologics and JAK inhibitors — see <a href='#specialist'>the specialist ladder</a>."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"cream", h:"Antihistamines — narrow roles only", html:"Not routinely. Offer a <b>1-month trial of a non-sedating antihistamine</b> in severe eczema, or mild to moderate eczema with severe itch or urticaria; continue while it helps and review every 3 months. Offer a <b>7–14-day trial of an age-appropriate sedating antihistamine</b> to children aged 6 months or over during an acute flare when sleep disturbance is significant. Doses per BNFC. This is NICE CG57 advice for children under 12, not a general adult rule; in adults, sedating antihistamines should not substitute for adequate anti-inflammatory treatment and need caution because of sedation, falls, driving impairment and anticholinergic effects.", src:"NICE CG57 (updated 2023)"},
         {tone:"cream", h:"Bandages and wet wraps", html:"Occlusive medicated dressings and dry bandages are an option for localised areas of chronic lichenified eczema; whole-body occlusion is a specialist technique. Do not use over infected skin.", src:"NICE CG57 (updated 2023)"}
       ]}
     ]},

    {id:"infection", nav:"Infection", title:"Infection — bacterial and viral", sub:"Eczema skin is almost always colonised with Staphylococcus aureus. Treat infection, not swab results.",
     blocks:[
       {b:"table", head:["","Bacterial infection","Eczema herpeticum"], rows:[
         ["<b>Looks like</b>","Weeping, yellow crusts, pustules, rapid worsening; sometimes fever","Painful, clustered, uniform punched-out erosions or blisters, spreading quickly; often fever and malaise"],
         ["<b>Swab?</b>","Not routinely at first presentation. Swab if infection recurs frequently; consider if worsening or not improving as expected","Viral swab can be sent, but do not wait for it"],
         ["<b>Treatment</b>","Continue emollients and an appropriate topical steroid. Not systemically unwell: do not routinely prescribe a topical or oral antibiotic. If a localised, non-severe infection is judged to need an antibiotic: consider fusidic acid 2% three times daily for 5–7 days, taking account of local resistance and previous topical antibiotic exposure. Widespread or severe infection, or systemically unwell: oral flucloxacillin 500 mg four times daily for 5–7 days in adults per current NICE/local guidance; penicillin allergy or flucloxacillin unsuitable: current local alternative (NG190: clarithromycin 250 mg twice daily for 5–7 days, 500 mg twice daily if severe; erythromycin in pregnancy) — clarify pregnancy status before a macrolide. <b>Children: check doses by age, weight, formulation, renal function, allergy and local guidance (NG190/BNFC)</b>","Systemic aciclovir immediately (dose per BNF/BNFC). Consider admission or IV if systemically unwell, extensive, immunocompromised, unable to take oral treatment, or neurological or ocular symptoms"],
         ["<b>Refer</b>","Children under 12: urgent (within 2 weeks) if treatment of infected eczema has failed. Refer or admit for sepsis, necrotising fasciitis, severe cellulitis, disproportionate pain or failure of oral treatment","Same-day dermatology; same-day ophthalmology if around the eyes"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"Avoid prolonged topical antibiotics", html:"Extended or repeated topical antibiotic use drives resistance. Keep courses short and localised. Do not use topical antibiotic–steroid combinations routinely. Avoid repeated courses of topical fusidic acid because of resistance and sensitisation.", src:"NICE NG190 (2021) · Greater Manchester antimicrobial guidance"},
         {tone:"amber", h:"Antibiotic prescribing cautions", html:"Clarithromycin has clinically important drug interactions and QT-prolongation cautions. Choose erythromycin in pregnancy only after checking current local guidance and patient-specific risks. Suspected MRSA → seek microbiology advice. Swab if infection is recurrent, worsening or not improving as expected.", src:"NICE NG190 (2021) · BNF · Greater Manchester antimicrobial guidance"},
         {tone:"green", h:"Replace contaminated products", html:"After an infection, consider new supplies of emollient, especially tubs that fingers have been in. This is sensible practice rather than a guideline recommendation."}
       ]}
     ]},

    {id:"special", nav:"Special groups", title:"Infants, food allergy, hands and adults", sub:"Where the guideline for children stops and other sources take over.",
     blocks:[
       {b:"cards", items:[
         {tone:"blue", h:"Infants and cow’s milk", html:"For bottle-fed babies under 6 months with moderate or severe eczema not controlled by optimal emollients and mild topical steroid, offer a 6–8-week trial of an extensively hydrolysed protein or amino acid formula in place of cow’s milk formula. Refer for specialist dietary advice if a cow’s milk-free diet continues beyond 8 weeks.", src:"NICE CG57 (updated 2023)"},
         {tone:"blue", h:"When to think food allergy", html:"Infants and young children with moderate or severe eczema not controlled by optimal treatment, particularly with a history of immediate reactions, should be referred for specialist allergy investigation. Consider food allergy when there is a compatible immediate reaction, a gastrointestinal or respiratory reaction, faltering growth, or moderate or severe eczema that remains uncontrolled despite optimal treatment. Suspected immediate food allergy warrants allergy referral. Do not recommend maternal or infant exclusion diets without appropriate assessment; prolonged cow’s milk or multiple-food exclusion needs dietetic supervision; allergy testing should be clinically directed, not broad screening.", src:"NICE CG57 (updated 2023) · NICE QS44 statement 6"},
         {tone:"blue", h:"Chronic hand eczema (international)", html:"For persistent or recurrent hand eczema, take an occupational and exposure history and consider dermatology referral for patch testing, especially where allergic contact dermatitis is suspected or disease remains uncontrolled. The international ESCD guideline uses more than 3 months or recurrent disease to define chronic hand eczema and recommends patch testing, glove use and replacing soap with emollients — this is international guidance, not a NICE primary-care requirement or universal threshold.", src:"International: ESCD hand eczema guideline (Contact Dermatitis 2022)"},
         {tone:"amber", h:"Severe chronic hand eczema — alitretinoin", html:"For severe chronic hand eczema, not general atopic eczema. Oral alitretinoin is an option for adults with severe chronic hand eczema unresponsive to potent topical steroids, with severe disease and a DLQI of 15 or more. It is specialist initiated and monitored; stop when hands are clear or almost clear, if still severe at 12 weeks, or if an adequate response has not been achieved by 24 weeks. It is teratogenic — the Pregnancy Prevention Programme is mandatory for women and girls of childbearing potential, including pregnancy testing and contraception requirements.", src:"NICE TA177 (2009)"},
         {tone:"blue", h:"Children, adolescents and adults — which guidance applies", html:"<b>Children under 12:</b> NICE CG57 applies. <b>Adolescents (12–17) and adults:</b> NICE has no comprehensive adult atopic eczema guideline — use clinical judgement, local dermatology pathways and EuroGuiDerm (international, 2022, living update 2025) and BAD guidance; do not present paediatric referral thresholds, severity categories, emollient quantities or potency and duration rules as NICE adult criteria. NICE TA534, TA681, TA814, TA986 and TA1077 set NHS eligibility for biologics and JAK inhibitors, each with its own age, licensing and commissioning criteria.", src:"International: EuroGuiDerm atopic eczema guideline (J Eur Acad Dermatol Venereol 2022)"},
         {tone:"cream", h:"Pregnancy and breastfeeding", html:"Emollients and topical steroids of appropriate potency remain the mainstay. Systemic immunosuppressants, JAK inhibitors and alitretinoin need specialist review before conception — several are contraindicated. Check the BNF and SPC for each drug. <b>Nipple eczema while breastfeeding:</b> apply topical steroids or calcineurin inhibitors immediately after a feed; wash the nipple before the next feed if the product or local advice requires; avoid infant ingestion; assess for candidiasis, bacterial infection and contact dermatitis; do not automatically treat the infant unless clinically indicated."}
       ]}
     ]},

    {id:"specialist", nav:"Specialist ladder", title:"What the specialist can add", sub:"Specialist-initiated; monitoring and prescribing remain with the specialist service unless a formal local shared-care arrangement is in place.",
     blocks:[
       {b:"table", head:["Step","Options","NHS position"], rows:[
         ["<b>Phototherapy</b>","Narrowband UVB","Specialist, for severe disease not controlled topically"],
         ["<b>Conventional systemic</b>","Ciclosporin (the only one licensed for atopic dermatitis), methotrexate, azathioprine, mycophenolate mofetil","Specialist-initiated; usually the first systemic step; the biologics and JAK inhibitors below need disease that has not responded to at least one systemic immunosuppressant, or these are unsuitable or not tolerated (NICE TA534, TA681, TA814, TA986, TA1077)"],
         ["<b>Biologic — dupilumab</b>","Anti-IL-4/IL-13 injection","NICE TA534 (2018): adults with moderate to severe disease not responding to at least 1 other systemic therapy, or where these are contraindicated or not tolerated. Age and commissioning eligibility depend on the current NICE appraisal, marketing authorisation and NHS England/local commissioning arrangements"],
         ["<b>Biologic — tralokinumab</b>","Anti-IL-13 injection","NICE TA814 (2022): adults in the original appraisal, same position after systemic therapy; licensing and commissioning may now include adolescents — age and commissioning eligibility depend on the current NICE appraisal, marketing authorisation and NHS England/local commissioning arrangements"],
         ["<b>Biologic — lebrikizumab</b>","Anti-IL-13 injection","NICE TA986 (2024): people aged 12 and over weighing 40 kg or more, after at least 1 systemic immunosuppressant, where dupilumab or tralokinumab would otherwise be offered"],
         ["<b>Biologic — nemolizumab</b>","Anti-IL-31 receptor injection","NICE TA1077 (2025): people aged 12 and over weighing 30 kg or more, after at least 1 systemic immunosuppressant, where a biologic would otherwise be offered. Confirm the final published NICE recommendation, licensed age and weight criteria and Greater Manchester formulary position at each review"],
         ["<b>Oral JAK inhibitors</b>","Abrocitinib, upadacitinib, baricitinib","NICE TA814 (2022): abrocitinib and upadacitinib for adults and young people aged 12 and over after at least 1 systemic therapy; NICE TA681 (2021): baricitinib for adults after at least 1 systemic therapy"],
         ["<b>Stopping rule</b>","Response at 16 weeks","Stop if the response is inadequate — at least a 50% reduction in EASI and a 4-point reduction in DLQI is the threshold used (NICE TA814; also TA986)"]
       ]},
       {b:"cards", items:[
         {tone:"amber", h:"JAK inhibitors — MHRA restrictions", html:"Increased risk of major cardiovascular events, malignancy, venous thromboembolism, serious infection and death was identified across the class. In people aged 65 or over, current or long-term past smokers, or those with other cardiovascular or malignancy risk factors, use only if no suitable alternative exists; caution in people with VTE risk factors. Primary-care red flags in a patient on a JAK inhibitor: chest pain or acute neurological symptoms; new breathlessness; unilateral leg swelling; severe infection or fever; herpes zoster; new symptoms suggesting malignancy; abnormal blood counts or liver tests reported by the specialist service.", src:"MHRA Drug Safety Update (Apr 2023)"},
         {tone:"blue", h:"JAK inhibitors — monitoring", html:"Baseline and ongoing monitoring commonly includes FBC, renal function, LFTs, lipids, infection, TB and hepatitis assessment where indicated, vaccination review and skin surveillance. Exact frequency must follow the individual SPC and the local dermatology shared-care protocol."},
         {tone:"amber", h:"Dupilumab — eye problems", html:"Dupilumab may cause conjunctivitis, blepharitis, dry eye and keratitis. New, persistent, painful or visually significant eye symptoms require prompt clinical assessment; severe or persistent symptoms may require ophthalmology input. Do not stop treatment without discussing it with the specialist team unless clinically necessary.", src:"MHRA Drug Safety Update (Nov 2022)"},
         {tone:"blue", h:"Topical calcineurin inhibitors and cancer risk", html:"Explain that topical calcineurin inhibitors are steroid-sparing treatments. Burning and stinging are common initially. Use sun protection and avoid excessive ultraviolet exposure. NICE retains a precautionary safety warning; current observational and guideline evidence has not demonstrated a convincing causal increase in lymphoma or skin cancer, but treatment should remain second line and be initiated by specialist-experienced clinicians. Do not apply under occlusion without specialist advice, and avoid on clinically infected skin until infection is treated.", src:"NICE TA82 (2004; static-list note)"},
         {tone:"amber", h:"Vaccination and immunosuppression", html:"For severe atopic eczema on systemic immunosuppression: review routine vaccinations; avoid live vaccines during clinically significant immunosuppression where contraindicated; seek specialist advice before live vaccination in patients on biologics or JAK inhibitors; and have a clear plan for varicella or shingles exposure."}
       ]}
     ]},

    {id:"review", nav:"Review", title:"Review and troubleshooting — before you escalate", sub:"Most uncontrolled eczema is emollient under-use, steroid fear or unrecognised infection.",
     blocks:[
       {b:"cards", items:[
         {tone:"blue", h:"1 · How much is being used?", html:"Look at issue dates and quantities on the repeat list. Review whether the quantity issued is consistent with the affected body surface area and the prescribed frequency of use — a child with widespread eczema needs 250–500 g a week (NICE CG57).", src:"NICE CG57 (updated 2023)"},
         {tone:"blue", h:"2 · Is the potency right for the site?", html:"Mild steroid on thick, lichenified limb eczema will not work; potent steroid on the face will cause harm. Re-map the sites.", src:"NICE CG57 (updated 2023)"},
         {tone:"blue", h:"3 · Is fear stopping treatment?", html:"Ask directly what the patient or parent has heard about steroids — online accounts of withdrawal reactions are a common reason for stopping early. Separate appropriate short courses from the long-term continuous use that MHRA describes.", src:"MHRA Drug Safety Update (Sep 2021)"},
         {tone:"amber", h:"4 · Is it infected?", html:"Weeping and crusting, or painful punched-out lesions. Treat before stepping up.", src:"NICE NG190 (2021) · NICE CG57"},
         {tone:"amber", h:"5 · Is it the right diagnosis?", html:"Contact allergy (hands, eyelids, face), tinea made worse by steroid, scabies, or, in an adult with persistent atypical plaques, rarely cutaneous T-cell lymphoma. Reconsider before adding systemic drugs."},
         {tone:"green", h:"6 · Education", html:"Show how to apply, how much, and in what order; give written instructions for each product and site. Education is part of the treatment, not an add-on.", src:"NICE CG57 (updated 2023) · NICE QS44"}
       ]},
       {b:"say", html:"You have two different treatments that do two different jobs. The moisturiser keeps the eczema away and it goes on every day in big amounts. The steroid is for the red, itchy flare — a thin layer, once or twice a day, on the angry patches, and any that flared in the last 2 days, until they settle, then stop. Used like that it is safe. The commonest reason eczema doesn’t get better is using too little of both, not the creams being too weak."}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — who, where and how fast", sub:"Criteria for children under 12 come from NICE CG57. Adult and adolescent thresholds are clinical judgement and local pathways, not CG57 criteria — add local Greater Manchester dermatology referral criteria.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same day", html:"Suspected eczema herpeticum → systemic aciclovir now and same-day dermatology advice; periocular herpeticum → same-day ophthalmology too. If same-day dermatology advice cannot be obtained promptly → urgent hospital assessment. Erythroderma with systemic features, a systemically unwell patient with spreading infection, suspected sepsis, necrotising fasciitis or severe cellulitis, pain disproportionate to skin findings, or severe dehydration, temperature dysregulation or inability to maintain oral intake → same-day acute assessment; consider admission.", src:"NICE CG57 (updated 2023) · NICE NG190 (2021)"},
         {tone:"purple", h:"Suspected cancer pathway referral · NICE NG12", html:"Refer using a suspected cancer pathway referral (for an appointment within 2 weeks) for breast cancer in people aged 50 and over with any of the following symptoms in one nipple only: discharge, retraction or other changes of concern. Consider a suspected cancer pathway referral for breast cancer in people with skin changes that suggest breast cancer. Persistent unilateral nipple or areolar dermatitis is not itself an NG12 criterion, but should prompt reassessment and consideration of breast referral for possible Paget’s disease — do not delay with repeated topical treatment.", src:"NICE NG12 (2015, last updated April 2026) recs 1.4.1 and 1.4.2"},
         {tone:"amber", h:"Urgent (within 2 weeks) — dermatology · children under 12", html:"Severe atopic eczema that has not responded to optimal topical therapy after 1 week; or treatment of bacterially infected eczema has failed.", src:"NICE CG57 (updated 2023)"},
         {tone:"blue", h:"Dermatology — adults and adolescents", html:"Refer routinely or urgently according to severity, functional impact, diagnostic uncertainty, treatment failure, suspected contact allergy, recurrent infection, erythroderma or need for systemic therapy: severe or extensive disease not controlled by correctly used topical treatment; major functional, sleep, psychological or occupational impact; diagnostic uncertainty; recurrent infection; suspected allergic contact dermatitis needing patch testing; severe chronic hand eczema; need for phototherapy or systemic treatment; atypical persistent plaques; erythroderma or rapidly worsening disease. Do not use the paediatric one-week rule as an automatic adult two-week referral criterion."},
         {tone:"blue", h:"Routine — dermatology · children under 12", html:"Diagnosis uncertain; management has not controlled the eczema satisfactorily based on the child’s, parent’s or carer’s own assessment; facial eczema not responding to appropriate treatment; suspected contact allergic dermatitis; significant social or psychological problems such as sleep disturbance or poor school attendance; severe and recurrent infections.", src:"NICE CG57 (updated 2023)"},
         {tone:"blue", h:"Allergy or paediatrics", html:"Infants and young children with moderate or severe eczema not controlled by optimal treatment and a suspected food allergy — specialist allergy investigation rather than home exclusion diets.", src:"NICE CG57 (updated 2023) · NICE QS44 statement 6"},
         {tone:"blue", h:"Adults with persistent atypical plaques", html:"Persistent, atypical or treatment-resistant patches or plaques — unusual distribution, poikiloderma, atrophy, induration, progressive change or disproportionate symptoms → dermatology assessment; biopsy may be needed and a single non-diagnostic biopsy does not always exclude cutaneous T-cell lymphoma. Urgency by clinical judgement — no NG12 criterion applies."},
         {tone:"green", h:"Keep in primary care", html:"Mild to moderate disease with a secure diagnosis, appropriate emollient use and a correctly selected topical steroid, with proactive treatment for recurrent sites, a written flare and maintenance plan, and adequate safety-netting and review.", src:"NICE CG57 (updated 2023)"}
       ]},
       {b:"say", html:"I’d like the skin specialists to see you — not because we have run out of ideas but because the next options, like light treatment or tablets and injections that calm the immune system, are ones they start and monitor. Keep going with the moisturiser and steroid plan in the meantime; that carries on whatever they add."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only — the casebook keeps the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A mother brings her 3-year-old whose eczema has been ‘bad for months’. He wakes three times a night scratching. She stopped the hydrocortisone because she read that steroids thin the skin and cause withdrawal, and the 500 g emollient tub from six weeks ago is still half full. Today one elbow is weeping and crusted.", src:"NICE CG57 (updated 2023)"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Grades severity and impact (sleep); explores the steroid fear and separates short, site-appropriate courses from long-term misuse; recalculates emollient need (250–500 g a week) and shows technique; checks for herpeticum before assuming bacterial infection; manages localised infection per NG190 without reflex oral antibiotics; gives a written plan including fire safety; safety-nets painful spreading sores; agrees review. <a href='../../cases/eczema.html'>Open the full casebook chapter →</a>", src:"NICE CG57 · NICE NG190 · MHRA DSU (Dec 2018, Sep 2021)"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Sources are linked at recommendation level where available. International guidance and patient information are labelled as such; NICE CG57 applies to children under 12.",
     blocks:[
       {b:"html", html:"<div class='card'><h3>Evidence panel</h3><ul class='evlist'>"+
         "<li><b>NICE CG57 — Atopic eczema in under 12s: diagnosis and management</b> (December 2007, last updated June 2023)<br><a href='https://www.nice.org.uk/guidance/cg57' rel='noopener'>nice.org.uk/guidance/cg57</a><span class='rd'> — diagnostic criteria, severity grading, emollients 250–500 g a week, no bath additives (2023), potency by site and age, antihistamine trials, cow’s milk and allergy referral, eczema herpeticum, referral criteria</span></li>"+
         "<li><b>NICE QS44 — Atopic eczema in under 12s</b> (quality standard, September 2013)<br><a href='https://www.nice.org.uk/guidance/qs44' rel='noopener'>nice.org.uk/guidance/qs44</a><span class='rd'> — stepped care, psychological impact, emollient provision, specialist referral, allergy investigation, eczema herpeticum</span></li>"+
         "<li><b>NICE NG190 — Secondary bacterial infection of eczema and other common skin conditions: antimicrobial prescribing</b> (2021)<br><a href='https://www.nice.org.uk/guidance/ng190' rel='noopener'>nice.org.uk/guidance/ng190</a><span class='rd'> — no routine antibiotic or swab, topical fusidic acid 2% TDS 5–7 days, flucloxacillin 500 mg QDS or clarithromycin 250 mg BD (500 mg BD if severe) for 5–7 days; erythromycin in pregnancy; swab if recurrent or not improving</span></li>"+
         "<li><b>Greater Manchester Antimicrobial Guidelines and GMMMG Formulary</b> — local antimicrobial choices, formulary and shared-care protocols<br><a href='https://gmmmg.nhs.uk' rel='noopener'>gmmmg.nhs.uk</a> · <a href='https://www.greatermanchesterformulary.nhs.uk' rel='noopener'>greatermanchesterformulary.nhs.uk</a></li>"+
         "<li><b>NICE TA81 — Frequency of application of topical corticosteroids for atopic eczema</b> (2004)<br><a href='https://www.nice.org.uk/guidance/ta81' rel='noopener'>nice.org.uk/guidance/ta81</a><span class='rd'> — once or twice daily only</span></li>"+
         "<li><b>NICE TA82 — Tacrolimus and pimecrolimus for atopic eczema</b> (2004)<br><a href='https://www.nice.org.uk/guidance/ta82' rel='noopener'>nice.org.uk/guidance/ta82</a><span class='rd'> — second-line positions, age limits, specialist initiation, precautionary safety note</span></li>"+
         "<li><b>NICE TA177 — Alitretinoin for severe chronic hand eczema</b> (2009)<br><a href='https://www.nice.org.uk/guidance/ta177' rel='noopener'>nice.org.uk/guidance/ta177</a><span class='rd'> — severe chronic hand eczema, DLQI 15 or more, stopping rules at 12 and 24 weeks</span></li>"+
         "<li><b>NICE TA534 — Dupilumab for moderate to severe atopic dermatitis</b> (2018); <b>TA681 — Baricitinib</b> (2021); <b>TA814 — Abrocitinib, tralokinumab or upadacitinib</b> (2022); <b>TA986 — Lebrikizumab</b> (July 2024); <b>TA1077 — Nemolizumab</b> (July 2025)<br><a href='https://www.nice.org.uk/guidance/ta814' rel='noopener'>nice.org.uk/guidance/ta814</a> · <a href='https://www.nice.org.uk/guidance/ta986' rel='noopener'>ta986</a> · <a href='https://www.nice.org.uk/guidance/ta1077' rel='noopener'>ta1077</a><span class='rd'> — eligibility after at least 1 systemic therapy, age and weight limits, 16-week EASI 50 plus DLQI 4-point stopping rule</span></li>"+
         "<li><b>NICE NG12 — Suspected cancer: recognition and referral</b> (2015, last updated April 2026)<br><a href='https://www.nice.org.uk/guidance/ng12' rel='noopener'>nice.org.uk/guidance/ng12</a><span class='rd'> — breast: one-nipple discharge, retraction or other changes of concern aged 50 and over (refer), skin changes suggesting breast cancer (consider); unilateral nipple eczema is not itself a criterion</span></li>"+
         "<li><b>MHRA Drug Safety Update</b> — Emollients: risk of severe and fatal burns with paraffin-containing and paraffin-free emollients (December 2018); Topical corticosteroids: topical steroid withdrawal reactions (September 2021); Dupilumab: ocular adverse reactions (November 2022); JAK inhibitors: new measures to reduce risks (April 2023); Topical steroids: new potency labelling (May 2024); Aqueous cream: may cause skin irritation (March 2013)<br><a href='https://www.gov.uk/drug-safety-update/emollients-new-information-about-risk-of-severe-and-fatal-burns-with-paraffin-containing-and-paraffin-free-emollients' rel='noopener'>emollient fire risk</a> · <a href='https://www.gov.uk/drug-safety-update/topical-corticosteroids-information-on-the-risk-of-topical-steroid-withdrawal-reactions' rel='noopener'>topical steroid withdrawal</a> · <a href='https://www.gov.uk/drug-safety-update/janus-kinase-jak-inhibitors-new-measures-to-reduce-risks-of-major-cardiovascular-events-malignancy-venous-thromboembolism-serious-infections-and-increased-mortality' rel='noopener'>JAK inhibitors</a> · <a href='https://www.gov.uk/drug-safety-update' rel='noopener'>other updates</a></li>"+
         "<li><b>MHRA — Oral retinoid medicines: Pregnancy Prevention Programme materials</b> (alitretinoin)<br><a href='https://www.gov.uk/drug-safety-update' rel='noopener'>gov.uk/drug-safety-update</a></li>"+
         "<li><b>Specialist Pharmacy Service — Managing fire risk with emollients and other skin products</b><br><a href='https://www.sps.nhs.uk' rel='noopener'>sps.nhs.uk</a><span class='rd'> — practical risk reduction and risk assessment</span></li>"+
         "<li><b>British Association of Dermatologists patient information</b> (<i>patient information, not national NICE recommendations</i>) — Atopic eczema (August 2025); Emollient use in skin conditions (January 2023); Topical corticosteroids (February 2024); Topical calcineurin inhibitors (May 2025)<br><a href='https://www.bad.org.uk/pils/atopic-eczema' rel='noopener'>bad.org.uk/pils/atopic-eczema</a></li>"+
         "<li><b>Long CC, Finlay AY. The finger-tip unit — a new practical measure.</b> Clin Exp Dermatol 1991<br><a href='https://pubmed.ncbi.nlm.nih.gov/1806320/' rel='noopener'>pubmed.ncbi.nlm.nih.gov/1806320</a><span class='rd'> — regional fingertip-unit quantities</span></li>"+
         "<li><b>EuroGuiDerm guideline on atopic eczema</b> (Wollenberg et al., J Eur Acad Dermatol Venereol 2022; living update 2025) — <i>international; used for adolescent, adult and systemic-treatment context where no NICE guideline exists</i><br><a href='https://doi.org/10.1111/jdv.18429' rel='noopener'>Part II, non-systemic treatments (JEADV 2022;36:1904–26)</a> · <a href='https://pubmed.ncbi.nlm.nih.gov/40317496/' rel='noopener'>living update (systemic therapy), JEADV 2025</a><span class='rd'> — proactive twice-weekly topical treatment (Part II)</span></li>"+
         "<li><b>ESCD — Guidelines for diagnosis, prevention and treatment of hand eczema</b> (Thyssen et al., Contact Dermatitis 2022;86:357–78) — <i>international; not a NICE primary-care requirement</i><br><a href='https://pubmed.ncbi.nlm.nih.gov/34971008/' rel='noopener'>pubmed.ncbi.nlm.nih.gov/34971008</a></li>"+
         "<li><b>BNF / BNFC</b><br><a href='https://bnf.nice.org.uk' rel='noopener'>bnf.nice.org.uk</a><span class='rd'> — topical steroid potency classes, aciclovir, antihistamine and paediatric antibiotic doses</span></li>"+
         "</ul></div>"}
     ]}
  ],
  foot:"Atopic eczema in primary care — NICE CG57 (updated June 2023), NICE NG190 (2021), NICE TA81, TA82, TA177, TA534, TA681, TA814, TA986 and TA1077, NICE NG12 (updated April 2026), MHRA Drug Safety Updates (2013–2024), BAD patient information, and EuroGuiDerm 2022 and ESCD 2022 (international). NICE CG57 applies to children under 12; adult and adolescent thresholds are not CG57 criteria. Check every dose and potency against the current BNF or BNFC, the relevant SPC, Greater Manchester antimicrobial guidance and the local dermatology referral pathway before prescribing or referring."
});
