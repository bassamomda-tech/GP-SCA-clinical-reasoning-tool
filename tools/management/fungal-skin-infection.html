<script>
MG.render({
  icon:"\u{1F344}",
  title:"Fungal skin infection",
  eyebrow:"Protocol · tinea of skin, scalp and nails",
  stemTitle:"Dermatophyte infection — prove it when tablets are on the table, cream for skin, tablets for scalp and nails, and suspect resistance when terbinafine fails",
  stemSub:"One page for ringworm at every site. Recognise the annular scaly edge, take a sample before any oral course, treat skin with a topical antifungal for the full licensed duration, give every child with scalp ringworm an oral drug chosen by organism, confirm nail infection before months of tablets, never leave a steroid on its own, and think of <i>Trichophyton indotineae</i> when groin or body tinea keeps coming back.",
  guideline:"BAD tinea capitis 2014 · BAD onychomycosis 2014 · PCDS tinea · SPCs · BNF",
  meta:[
    {t:"BAD tinea capitis (Fuller 2014)"},
    {t:"BAD onychomycosis (Ameen 2014)"},
    {t:"MHRA DSU Aug 2012 · itraconazole–simvastatin"},
    {t:"UKHSA · T. indotineae (Eurosurveillance 2025)"},
    {t:"NG12 (updated April 2026) · pigmented nail lesion only", tone:"tw"}
  ],
  lead:"<div class='mg-layers'><a href='#confirm'><b>Is it tinea?</b><small>Sample before tablets</small></a><a href='#skin'><b>Skin</b><small>Topical, full course</small></a><a href='#scalp'><b>Scalp</b><small>Always oral</small></a><a href='#nails'><b>Nails</b><small>Confirm first</small></a><a href='#refer'><b>Refer</b><small>Who and how fast</small></a></div>",
  quickSub:"The six points that change what you do. Each figure traces to a source under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"blue", h:"No oral antifungal without mycology", html:"Scrape the scaly edge, clip the nail back to the crumbly zone, pluck or brush affected hairs, and send them for microscopy and culture before committing a patient to weeks of terbinafine, itraconazole or griseofulvin. Thick, discoloured nails are often psoriasis or trauma rather than fungus. <b>Kerion or a very typical scalp picture</b> is the exception: start treatment the same day and let the culture catch up.", src:"BAD onychomycosis 2014 · BAD tinea capitis 2014"},
    {tone:"cream", h:"Skin tinea: topical first, and long enough", html:"Terbinafine 1% cream is the short option (licensed course 1–2 weeks). An imidazole takes longer: clotrimazole 1% two to three times a day for <b>at least one month</b> for dermatophytes, or miconazole 2% twice daily continued for at least a week after the rash has gone. Stopping when it looks better is the usual reason it returns.", src:"SPC · Lamisil 1% cream, Canesten 1% cream, Daktarin 2% cream"},
    {tone:"amber", h:"Scalp ringworm never responds to cream alone", html:"Tinea capitis needs an oral drug. In the UK most cases are <i>Trichophyton tonsurans</i>, where <b>terbinafine for 4 weeks</b> (dose banded by weight) is the choice; for <i>Microsporum</i> (cat or dog source) <b>griseofulvin for 6–8 weeks</b> works better. Add ketoconazole or selenium shampoo to cut spore spread, and check the household.", src:"BAD tinea capitis 2014"},
    {tone:"amber", h:"A steroid on its own makes tinea worse", html:"A steroid cream on an unrecognised fungal rash suppresses the redness, removes the scaly edge and lets the fungus spread — tinea incognito. If a steroid has been used and the rash is odd, stop it, scrape, and treat on the result.", src:"PCDS tinea corporis, cruris and incognito"},
    {tone:"red", h:"Groin or body tinea that terbinafine did not clear", html:"Terbinafine-resistant <i>Trichophyton indotineae</i> is spreading in the UK: 363 cases between 2017 and August 2025, 85% of them since 2023, typically extensive groin and trunk disease, often with links to South Asia. Do not simply repeat terbinafine. Send scrapings asking for identification and sensitivity, and involve dermatology.", src:"UKHSA · Eurosurveillance 2025;30(49)"},
    {tone:"purple", h:"A pigmented nail band is not a fungus until proven", html:"A new or changing brown–black band in one nail, especially with pigment spilling onto the nail fold, needs melanoma excluded. NG12 has no nail-specific criterion: consider a suspected cancer pathway referral using the NG12 melanoma criteria (weighted 7-point checklist score of <b>3 or more</b>, or dermoscopy suggesting melanoma).", src:"NICE NG12 (updated April 2026) · melanoma 1.7"}
  ],
  pathwaySub:"Five moves, in order. The first one is the one most often skipped.",
  pathway:[
    {title:"Name the site and look for the mimic", html:"Body, groin, feet, hands, face, scalp or nail? Annular with an active scaly edge suggests tinea; symmetrical silvery plaques suggest psoriasis; a brown flexural patch that glows coral-pink under Wood’s light is erythrasma; a bright red groin rash with satellite spots is candida."},
    {title:"Sample if tablets are likely, or the picture is odd", html:"Mycology before any oral course, before treating nails, in scalp disease, after a steroid has been applied, and when a first course has failed. Microscopy returns in days; culture takes several weeks."},
    {title:"Treat by site", html:"Localised skin → topical antifungal for the licensed duration. Scalp → oral drug chosen by organism plus antifungal shampoo. Nails → oral terbinafine once confirmed; lacquer only for limited distal disease. Extensive skin disease → oral terbinafine or itraconazole."},
    {title:"Check drug safety before the first tablet", html:"Terbinafine: liver history and LFTs. Itraconazole: heart failure and a full interaction check (simvastatin is contraindicated). Griseofulvin: pregnancy, contraception, and the six-month rule for men."},
    {title:"Close the loop", html:"Treat the feet as the reservoir for groin and body tinea, screen household contacts and pets in scalp disease, review at the end of the course, and re-sample rather than repeat when it has not cleared."}
  ],
  sections:[
    {id:"confirm", nav:"Is it tinea?", title:"Is it tinea? Recognition and sampling", sub:"Dermatophytes (Trichophyton, Microsporum, Epidermophyton) live on keratin: skin, hair and nail. The site decides the treatment; the sample decides whether you are right.",
     blocks:[
       {b:"table", head:["Site","What you see","Main mimics"], rows:[
         ["Body (corporis)","Ring-shaped plaque with a raised scaly advancing edge and a clearer centre; often single or few; itchy","Discoid eczema, psoriasis, granuloma annulare (no scale), pityriasis rosea (herald patch)"],
         ["Groin (cruris)","Red-brown scaly margin spreading down the inner thigh, usually sparing the scrotum","Candida (satellite spots, scrotum involved), erythrasma, flexural psoriasis, seborrhoeic dermatitis"],
         ["Feet (pedis)","Itchy maceration and fissuring between the lateral toes; dry scale in a ‘moccasin’ pattern on the sole; sometimes blisters on the instep","Pompholyx, contact dermatitis, plantar psoriasis, pitted keratolysis"],
         ["Hand (manuum)","Dry scaling of one palm, often with both feet affected (‘two feet, one hand’)","Hand eczema, psoriasis"],
         ["Scalp (capitis)","Scaly patches with broken hairs or black dots, diffuse dandruff-like scale, or a boggy tender pustular swelling (kerion) with neck lymphadenopathy; mostly children","Seborrhoeic dermatitis, psoriasis, alopecia areata (no scale), bacterial abscess (kerion is often misdiagnosed)"],
         ["Nail (onychomycosis)","Distal yellow-white thickening with crumbly subungual debris; usually toenails, often with tinea pedis","Psoriatic nail, trauma, lichen planus, candida (fingernails with paronychia), melanoma if pigmented"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"How to take the sample", html:"Skin: scrape from the active edge with a blunt blade onto dark paper. Nail: clip the affected nail back to where it meets healthy nail and include subungual debris. Scalp: pluck broken hairs and scrape scale, or use a sterile brush in children. Send for microscopy and culture in a mycology packet.", src:"BAD tinea capitis 2014 · BAD onychomycosis 2014"},
         {tone:"blue", h:"When a negative result does not end the story", html:"Microscopy can be positive while culture fails, and culture misses a proportion of true infections. If the clinical picture is strong and the sample was poor, repeat it rather than abandon the diagnosis. Ask the laboratory for species identification when resistance is suspected.", src:"BAD onychomycosis 2014"}
       ]},
       {b:"why", html:"Treating on appearance alone is reasonable for a typical ring on the trunk that will get two weeks of cream. It stops being reasonable when the next step is three months of tablets with liver and interaction risks, or when the ‘tinea’ has already failed one course. The sample protects the patient from the wrong drug and gives you an organism when things go wrong."}
     ]},

    {id:"redflags", nav:"Red flags", title:"Red flags — when this is not routine ringworm", sub:"Most fungal skin infection is trivial. These are the presentations where the plan changes today.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Spreading cellulitis from the foot", html:"Toe-web tinea is a common portal for streptococcal cellulitis, particularly in people with diabetes, lymphoedema or venous disease. Treat the cellulitis on its own merits (same-day assessment if systemically unwell) and treat the toe webs so it does not recur.", src:"Clinical practice · BNF antibacterial section"},
         {tone:"amber", h:"Kerion", html:"A boggy, pustular, tender scalp swelling in a child is usually an inflammatory fungal reaction, not an abscess. Incision does not help. Start the oral antifungal promptly after sampling and refer if there is diagnostic doubt or scarring risk.", src:"BAD tinea capitis 2014"},
         {tone:"amber", h:"Extensive, resistant or recurrent groin and body tinea", html:"Widespread disease, or disease that returned after terbinafine, raises the possibility of <i>T. indotineae</i>. In the UK many isolates are terbinafine-resistant in vitro, most infections respond poorly to terbinafine, and cases cluster in working-age adults, frequently with a South Asian connection.", src:"UKHSA · Eurosurveillance 2025 · Emerg Infect Dis 2025"},
         {tone:"amber", h:"Immunosuppression or diabetes", html:"Extensive dermatophyte infection, deep follicular infection (Majocchi granuloma) or unusual organisms are more likely. Lower your threshold for sampling, oral treatment and specialist advice."},
         {tone:"purple", h:"Pigmented nail streak — NG12 pigmented-lesion rule", html:"NICE NG12 has no nail-specific criterion, so for a suspicious nail band consider a suspected cancer pathway referral using the NG12 melanoma criteria. NG12 1.7.1 says: refer people using a suspected cancer pathway referral for melanoma if they have a suspicious pigmented skin lesion with a weighted 7-point checklist score of 3 or more (major features, 2 points each: change in size, irregular shape, irregular colour; minor, 1 point each: largest diameter 7 mm or more, inflammation, oozing, change in sensation). NG12 1.7.2: refer if dermoscopy suggests melanoma of the skin.", src:"NICE NG12 (updated April 2026) 1.7.1–1.7.2"}
       ]},
       {b:"why", html:"Subungual melanoma is rare but is often treated for months as ‘fungal nail’. Fungal nail disease does not produce a single, sharply defined longitudinal brown–black band, and it does not put pigment on the surrounding nail fold. Those two features belong to a lesion that needs a specialist, not a lacquer."}
     ]},

    {id:"skin", nav:"Skin", title:"Skin tinea — body, groin, feet and hands", sub:"Localised skin infection is treated topically. Doses and durations below are those in the product licences; check each in the BNF before prescribing.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1", title:"Topical terbinafine — the short course", when:"localised skin tinea", tone:"cream",
          html:"Terbinafine 1% cream once or twice daily; the licensed course is <b>1–2 weeks</b> depending on product and site. Apply to the rash and a margin of normal skin. The fastest-acting topical option, which helps adherence."},
         {step:"1", title:"Or a topical imidazole — longer, cheaper, also covers candida", when:"when the diagnosis is dermatophyte versus candida", fromLabel:"alternative first line", tone:"cream",
          html:"<b>Clotrimazole 1%</b> two to three times daily, continued for <b>at least one month</b> for dermatophyte infection. <b>Miconazole 2%</b> twice daily, continued for <b>at least one week after</b> all signs have gone. Useful in the flexures where candida is in the differential."},
         {step:"Inflamed", title:"Short combined steroid–antifungal", when:"very itchy, inflamed flexural tinea", fromLabel:"only if needed", tone:"amber",
          html:"A hydrocortisone 1% plus imidazole combination for a few days only (dose per BNF), then continue the plain antifungal for the full course. Never a steroid alone, and never a potent steroid on a suspected fungal rash."},
         {step:"2", title:"Oral treatment for extensive or refractory skin disease", when:"widespread, several sites, failed an adequate topical course", fromLabel:"topical not enough", tone:"cream",
          html:"After sampling: <b>terbinafine 250 mg once daily</b>, usually 2–6 weeks depending on site. Or <b>itraconazole</b>: for body and groin, 100 mg daily for 15 days or 200 mg daily for 7 days; for feet and hands, 100 mg daily for 30 days (confirm in BNF). Itraconazole capsules are taken after food."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"Treat the feet when treating the groin", html:"Groin and body tinea are frequently seeded from the feet. Treat all sites together, including the toe webs, and dry the groin after the feet — or with a separate towel.", src:"PCDS tinea pedis, manuum and unguium"},
         {tone:"blue", h:"Nail and foot together", html:"If the toenails are infected, topical treatment of the feet alone will not stop re-infection; manage the nail as onychomycosis.", src:"PCDS tinea pedis, manuum and unguium"}
       ]},
       {b:"warn", html:"Face and hands: tinea faciei is often misdiagnosed as eczema or rosacea and treated with steroid. A unilateral scaly rash on one hand, or an annular facial rash that worsened on a steroid, should be scraped."}
     ]},

    {id:"scalp", nav:"Scalp", title:"Tinea capitis — always oral, chosen by organism", sub:"Topical treatment alone does not cure scalp ringworm, because the fungus sits in the hair follicle. It does reduce spore shedding, so it is an adjunct, not an alternative.",
     blocks:[
       {b:"table", head:["Drug","Dose","Duration","Best for"], rows:[
         ["Terbinafine (unlicensed in children in the UK)","Under 20 kg: 62.5 mg daily · 20–40 kg: 125 mg daily · over 40 kg: 250 mg daily","4 weeks","<i>Trichophyton</i> species, including <i>T. tonsurans</i>, the commonest UK cause"],
         ["Griseofulvin","Under 50 kg: 15–20 mg/kg/day as a single or divided dose · over 50 kg: 1 g/day","6–8 weeks","<i>Microsporum</i> species (e.g. <i>M. canis</i> from cats and dogs)"],
         ["Itraconazole (unlicensed for this use)","Specialist-guided weight-based regimens","2–4 weeks","Second line; comparable efficacy in trials"]
       ]},
       {b:"cards", items:[
         {tone:"amber", h:"Start before the culture if the picture is typical", html:"With a kerion, or scaling plus alopecia plus neck lymphadenopathy, it is reasonable to start treatment once samples are taken. Choose terbinafine unless there is a likely animal (Microsporum) source; switch according to the culture.", src:"BAD tinea capitis 2014"},
         {tone:"cream", h:"Adjunctive shampoo for the child and the household", html:"Ketoconazole 2% or selenium sulfide 1% shampoo reduces spore carriage. Examine household members, sample anyone with scalp scaling, and use the shampoo for contacts to lower re-infection.", src:"BAD tinea capitis 2014"},
         {tone:"green", h:"School and nursery", html:"Exclusion is not usually required for ringworm, but treatment is. The child can attend once on treatment; avoid sharing combs, hats and towels.", src:"UKHSA children and young people’s settings — A to Z"},
         {tone:"blue", h:"Cure means a negative culture, not a better-looking scalp", html:"The end point is mycological cure. If the scalp is still scaly at the end of the course, re-sample; if the fungus is still present, extend treatment or change drug with dermatology advice.", src:"BAD tinea capitis 2014"}
       ]},
       {b:"why", html:"The organism decides the drug. <i>T. tonsurans</i> lives inside the hair shaft and responds well to terbinafine; <i>Microsporum</i> sits on the outside of the shaft and needs griseofulvin’s longer course. Getting the culture sent before the first dose is what makes a switch possible when the child is not improving."}
     ]},

    {id:"nails", nav:"Nails", title:"Onychomycosis — confirm first, then decide whether to treat", sub:"Treatment is optional for asymptomatic toenail disease in a healthy person. It is justified for pain, function, cosmetic distress, diabetes or repeated cellulitis — once mycology confirms it.",
     blocks:[
       {b:"ladder", steps:[
         {step:"0", title:"Confirm and discuss", when:"every patient", tone:"blue",
          html:"Clip and send. Explain the realistic outcome: long courses, nails take 6 (finger) to 12–18 (toe) months to grow out, and recurrence is common. Some choose no treatment, which is reasonable."},
         {step:"1", title:"Oral terbinafine — first choice for dermatophyte nail disease", when:"confirmed dermatophyte", fromLabel:"confirmed, wants treatment", tone:"cream",
          html:"<b>250 mg once daily: 6 weeks for fingernails, 12–16 weeks for toenails.</b> Pooled mycological cure about 76%, the highest of the oral options. Assess for liver disease and check baseline LFTs before starting; the SPC recommends repeat LFTs after 4–6 weeks and stopping if they rise."},
         {step:"1b", title:"Itraconazole — alternative, and for candida or non-dermatophyte moulds", when:"terbinafine unsuitable or organism not a dermatophyte", fromLabel:"alternative", tone:"cream",
          html:"Pulsed: 200 mg twice daily for 7 days, then 3 weeks without treatment (one pulse a month) — 2 pulses for fingernails, 3 for toenails; or 200 mg daily for 3 months (BAD onychomycosis 2014; confirm in BNF). Pooled mycological cure about 63% with pulses. Not in heart failure; check every interaction."},
         {step:"2", title:"Amorolfine 5% lacquer — limited disease only", when:"superficial white or early distal disease, under 80% of the nail, lunula spared, or oral drugs contraindicated", fromLabel:"topical only if", tone:"amber",
          html:"File the nail, then apply <b>once weekly</b> (twice weekly may help), for about <b>6 months</b> on fingernails and <b>9–12 months</b> on toenails, reviewing every 3 months. Available over the counter. Evidence is weak: in a 2024 Dutch primary-care trial amorolfine and miconazole did no better than placebo."}
       ]},
       {b:"why", html:"The disappointing topical data are why the guideline confines lacquer to shallow, limited disease. When the lunula is involved or most of the plate is affected, only a systemic drug reaches the nail matrix."}
     ]},

    {id:"resistant", nav:"Not clearing", title:"Not clearing — adherence, diagnosis, or resistance", sub:"Before changing drug, work through the three reasons tinea persists.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"1 · Was the course long enough and actually used?", html:"The commonest cause of relapse is stopping an imidazole at the point the rash fades. Check duration against the SPC and whether all sites (feet, groin, nails) were treated together.", src:"SPC · Canesten 1% cream, Daktarin 2% cream"},
         {tone:"blue", h:"2 · Is it really fungal?", html:"Scrape again. Consider eczema, psoriasis, erythrasma, candida, and in the scalp seborrhoeic dermatitis or psoriasis. A negative sample from a steroid-treated rash is less reliable; stop the steroid first.", src:"PCDS tinea overview"},
         {tone:"amber", h:"3 · Could it be terbinafine-resistant?", html:"<i>T. indotineae</i> accounted for 38% of dermatophyte isolates referred to the UK reference laboratory in the 2025 series; many isolates are resistant to terbinafine in vitro. Ask the laboratory for species and susceptibility testing.", src:"UKHSA · Abdolrasouli et al, Emerg Infect Dis 2025"},
         {tone:"amber", h:"Treatment of suspected T. indotineae", html:"Itraconazole is the usual alternative, but prolonged courses are typically needed; treatment should be guided by dermatology and the reference laboratory rather than by repeated empirical terbinafine.", src:"UKHSA · Eurosurveillance 2025"}
       ]}
     ]},

    {id:"safety", nav:"Drug safety", title:"Oral antifungal safety — check before the first tablet", sub:"All three oral drugs have real harms. Doses and cautions are in the BNF and SPCs; these are the checks that matter in a GP consultation.",
     blocks:[
       {b:"table", head:["Drug","Before starting","During treatment","Do not use / take care"], rows:[
         ["Terbinafine","Liver history; LFTs","Repeat LFTs after 4–6 weeks; stop if they rise. Warn about taste or smell loss, low mood, and any rash","Chronic or active liver disease. Reports of severe skin reactions and lupus-like reactions"],
         ["Itraconazole","Cardiac history; full interaction check","Stop if symptoms of heart failure or hepatitis","Heart failure or ventricular dysfunction (for skin and nail indications); pregnancy. <b>Contraindicated with simvastatin</b> (MHRA DSU August 2012) and many other CYP3A4 substrates"],
         ["Griseofulvin","Pregnancy test if relevant; contraception plan","Take with food","Pregnancy; women should avoid pregnancy for 1 month after stopping; <b>men should not father a child within 6 months</b> of treatment; porphyria; liver failure; SLE"]
       ]},
       {b:"warn", html:"Pregnancy: avoid oral antifungals for skin and nail disease; use a topical imidazole and defer nail treatment. Check every oral azole against the interaction list in the BNF."}
     ]},

    {id:"advice", nav:"Advice", title:"Prevention and what to tell the household", sub:"The fungus comes back from a reservoir: the feet, the nails, a pet, or a sibling’s scalp.",
     blocks:[
       {b:"tiles", v:"life", items:[
         {t:"Feet", html:"Dry thoroughly between the toes, wear breathable footwear and cotton socks, change socks daily, go barefoot at home where possible, and wear sandals in communal showers."},
         {t:"Personal items", html:"Do not share towels, hairbrushes, combs or hats. Wash towels and bedding at a hot temperature during treatment."},
         {t:"Animals", html:"A ring-shaped rash in a child who owns a kitten, puppy or guinea pig suggests an animal source; the pet may need to see a vet."},
         {t:"Finish the course", html:"Keep using the cream for the whole licensed course, not just until the itch stops. Complete oral courses unless told to stop."}
       ]},
       {b:"say", html:"This is ringworm — a fungus, not a worm, and very common. On the skin a cream clears it, but it has to be used for the full course, and the feet need treating too because that is where it often hides. Please don’t put a steroid cream on it on its own; that makes it spread. If it’s on the scalp or in a nail we’ll take a small sample first, because those need tablets and I want to be sure before we start."}
     ]},

    {id:"refer", nav:"Refer", title:"Refer — who, and how quickly", sub:"Most tinea is managed in primary care. Referral is for the dangerous look-alike, the failed course, and scalp or nail disease that has not cleared.",
     blocks:[
       {b:"cards", items:[
         {tone:"purple", h:"Suspected cancer pathway (2WW) · NICE NG12", html:"NG12 1.7.1: refer people using a suspected cancer pathway referral for melanoma if they have a suspicious pigmented skin lesion with a <b>weighted 7-point checklist score of 3 or more</b>. NG12 1.7.2: refer if dermoscopy suggests melanoma of the skin. NG12 has no nail-specific criterion; for a single-digit longitudinal pigmented band that is new, widening, irregular, or spreading onto the nail fold, consider a suspected cancer pathway referral using these melanoma criteria.", src:"NICE NG12 (updated April 2026) 1.7.1–1.7.2"},
         {tone:"red", h:"Same day", html:"Cellulitis with systemic upset arising from infected toe webs, especially in diabetes; a severe drug reaction (widespread rash, blistering, jaundice) on an oral antifungal.", src:"SPC · Lamisil tablets, Sporanox capsules"},
         {tone:"amber", h:"Urgent dermatology", html:"Extensive or recurrent groin and body tinea after a failed terbinafine course (possible <i>T. indotineae</i>); kerion with diagnostic doubt or risk of scarring alopecia; tinea in a significantly immunosuppressed patient.", src:"UKHSA · Eurosurveillance 2025 · BAD tinea capitis 2014"},
         {tone:"blue", h:"Routine dermatology", html:"Diagnostic uncertainty despite sampling; tinea capitis not cleared mycologically after an adequate course; confirmed onychomycosis that has failed oral treatment or where oral drugs are contraindicated; suspected non-dermatophyte mould.", src:"BAD onychomycosis 2014 · BAD tinea capitis 2014"},
         {tone:"green", h:"Keep in primary care", html:"Localised skin tinea responding to topical treatment; confirmed dermatophyte nail infection on terbinafine with normal LFTs; tinea capitis clearing on treatment with the household screened.", src:"PCDS tinea overview"}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only — the Casebook holds the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 7-year-old boy is brought in with a patchy scaly bald area on his scalp for six weeks. His mother has been using a steroid cream from the pharmacy and wants him back at school. His younger sister has started scratching her head, and the family recently got a kitten.", src:"Practice case · BAD tinea capitis 2014"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Recognises tinea capitis and explains why cream will not cure it; <b>stops the steroid</b>; takes hair and scale for mycology; considers <i>Microsporum</i> because of the kitten and chooses the drug accordingly, with weight-based dosing; adds antifungal shampoo; <b>examines the sister</b> and advises a vet check for the kitten; explains that school exclusion is not needed once treatment starts; sets a review at the end of the course with a repeat sample.", src:"BAD tinea capitis 2014 · UKHSA A to Z"}
     ]}]},

    {id:"provenance", nav:"Evidence", title:"Evidence", sub:"Every figure on this page traces to one of these primary sources.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>British Association of Dermatologists — guidelines for the management of tinea capitis 2014</b> (Fuller et al, Br J Dermatol 2014;171:454–63)<br><a href="https://doi.org/10.1111/bjd.13196" rel="noopener">doi.org/10.1111/bjd.13196</a><span class="rd"> — oral therapy mandatory; terbinafine weight bands and 4-week course; griseofulvin 15–20 mg/kg/day for 6–8 weeks (1 g over 50 kg); starting before culture in kerion; adjunctive ketoconazole or selenium shampoo; household screening; mycological cure as end point</span></li>'+
         '<li><b>British Association of Dermatologists — guidelines for the management of onychomycosis 2014</b> (Ameen et al, Br J Dermatol 2014;171:937–58)<br><a href="https://doi.org/10.1111/bjd.13358" rel="noopener">doi.org/10.1111/bjd.13358</a><span class="rd"> — mycological confirmation before treatment; terbinafine 6 weeks (fingernails) and 12–16 weeks (toenails); itraconazole pulses (1 week a month; 2 for fingernails, 3 for toenails); pooled mycological cure 76% terbinafine, 63% pulsed itraconazole; topical monotherapy only for superficial or early distal disease under 80% with the lunula spared</span></li>'+
         '<li><b>Primary Care Dermatology Society — clinical guidance: tinea overview; tinea corporis, cruris and incognito; tinea pedis, manuum and unguium</b><br><a href="https://www.pcds.org.uk/clinical-guidance/tinea" rel="noopener">pcds.org.uk/clinical-guidance/tinea</a><span class="rd"> — tinea incognito, treating the feet as reservoir, systemic treatment where nails are involved, foot-care advice</span></li>'+
         '<li><b>UKHSA — Rapid emergence of <i>Trichophyton indotineae</i> in the United Kingdom, up to August 2025</b> (Eurosurveillance 2025;30(49):2500892)<br><a href="https://doi.org/10.2807/1560-7917.ES.2025.30.49.2500892" rel="noopener">doi.org/10.2807/1560-7917.ES.2025.30.49.2500892</a><span class="rd"> — 363 UK cases 2017–August 2025, 85% since January 2023; working-age adults, urban centres</span></li>'+
         '<li><b>Abdolrasouli, Barton, Borman — Spread of antifungal-resistant <i>Trichophyton indotineae</i>, United Kingdom, 2017–2024</b> (Emerg Infect Dis 2025;31(1))<br><a href="https://doi.org/10.3201/eid3101.240923" rel="noopener">doi.org/10.3201/eid3101.240923</a><span class="rd"> — 157 cases; 38% of dermatophyte isolates referred to the national mycology reference laboratory; groin onset, poor response, terbinafine resistance</span></li>'+
         '<li><b>UKHSA — Health protection in children and young people’s settings: managing specific infectious diseases A to Z</b><br><a href="https://www.gov.uk/government/publications/health-protection-in-schools-and-other-childcare-facilities/managing-specific-infectious-diseases-a-to-z" rel="noopener">gov.uk — A to Z</a><span class="rd"> — ringworm: exclusion not usually required; treatment is required</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (2015, last updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — melanoma recommendations 1.7.1 (weighted 7-point checklist score of 3 or more) and 1.7.2 (dermoscopy suggests melanoma); no nail-specific criterion</span></li>'+
         '<li><b>MHRA Drug Safety Update — simvastatin: updated advice on drug interactions (August 2012)</b><br><a href="https://www.gov.uk/drug-safety-update" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> — itraconazole contraindicated with simvastatin because of myopathy and rhabdomyolysis risk</span></li>'+
         '<li><b>Summaries of Product Characteristics</b> — Lamisil 250 mg tablets; Lamisil 1% cream; Sporanox capsules; griseofulvin tablets; Loceryl 5% nail lacquer; Canesten 1% cream; Daktarin 2% cream<br><a href="https://www.medicines.org.uk/emc" rel="noopener">medicines.org.uk/emc</a><span class="rd"> — licensed durations, LFT monitoring after 4–6 weeks, itraconazole heart-failure contraindication, griseofulvin contraception rules, amorolfine once-weekly schedule, clotrimazole at least one month for dermatophytes, miconazole at least one week beyond clearance</span></li>'+
         '<li><b>Watjer et al — the Onycho Trial</b> (BMJ Open 2024;14:e081914)<span class="rd"> — topical miconazole and amorolfine no better than placebo for mild to moderate onychomycosis in Dutch primary care</span></li>'+
         '<li><b>BNF and BNFC</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — all doses, interactions and pregnancy advice for terbinafine, itraconazole, griseofulvin, clotrimazole, miconazole and amorolfine</span></li>'+
         '</ul></div>'}

  foot:"Dermatophyte infection of skin, scalp and nails in primary care — BAD tinea capitis 2014, BAD onychomycosis 2014, PCDS tinea guidance, UKHSA (children’s settings A to Z; <i>T. indotineae</i> surveillance 2025), NICE NG12 (updated April 2026), MHRA Drug Safety Update (August 2012) and the product SPCs. Check every dose in the current BNF or BNFC. Not a substitute for clinical judgement or your local formulary."
