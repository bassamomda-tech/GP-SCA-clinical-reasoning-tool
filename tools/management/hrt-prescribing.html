  stemSub:"One page for the whole condition. Confirm the diagnosis (and know the two places FSH earns its keep), screen the contraindications, counsel with absolute rather than relative risk, pick route and regimen with named preparations and dose equivalents, then work the stepwise plan for \u201cnot better\u201d, side effects and bleeding \u2014 plus the non-hormonal pathway when HRT is declined or unsafe.",

  lead:'<div class="mg-layers"><a href="#confirm"><b>Diagnose</b><small>Clinical from 45</small></a><a href="#severe"><b>Red flags</b><small>PMB \u00b7 breast \u00b7 VTE</small></a><a href="#ladder"><b>Prescribe</b><small>Route \u00b7 regimen \u00b7 dose</small></a><a href="#refer"><b>Refer</b><small>Suspected cancer \u00b7 specialist</small></a></div>',
  quickSub:"If you read nothing else on this page, read these six cards. Every number traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"\u26a0 Never start HRT on top of unexplained bleeding", html:"NICE NG12 (updated April 2026): unexplained postmenopausal bleeding aged 55 or over <b>that cannot be attributed to HRT</b> \u2192 suspected cancer pathway referral for endometrial cancer; <b>under 55</b> \u2192 consider one. A woman not on HRT has nothing to attribute it to. Bleeding on HRT has its own route (NICE NG23, April 2026): unscheduled bleeding is common in the first 6 months of systemic HRT and within 3 months of a dose or preparation change \u2014 bleeding that starts beyond those windows, or is heavy, prolonged or persistent, needs prompt assessment (see <a href='#monitor'>bleeding on HRT</a>). The commonest serious error in menopause care is attributing PMB to \u201cthe menopause\u201d or to HRT side effects and delaying an endometrial cancer diagnosis. Do not start systemic HRT until unexplained postmenopausal bleeding has been assessed. Starting treatment before assessment may complicate interpretation of subsequent bleeding and should not delay investigation of endometrial pathology."},
    {tone:"red", h:"Always protect the endometrium", html:"<b>A woman with a uterus on systemic oestrogen must have a progestogen</b> \u2014 or a Mirena, which also provides contraception. Unopposed systemic oestrogen substantially increases endometrial hyperplasia and cancer risk; adequate progestogen opposition is needed whenever endometrial tissue may be present (seek advice after subtotal hysterectomy, ablation or significant endometriosis). <b>Never respond to progestogen intolerance by dropping the progestogen</b> \u2014 switch the type or the route."},
    {tone:"amber", h:"Diagnose it clinically", html:"Aged 45 or over with typical symptoms: clinical diagnosis \u2014 do not check FSH (NG23). Menopause = <b>12 months amenorrhoea</b>; average UK age <b>51</b> (range 45\u201355). Perimenopause = menopausal symptoms with a change in the menstrual cycle (cycle variation of \u22657 days and a duration of 4\u20138 years are supporting staging/epidemiological information, not NICE diagnostic criteria). FSH: <b>under 40</b> \u2014 suspected POI needs <b>two raised FSH results 4\u20136 weeks apart</b>, interpreted with symptoms and menstrual history; <b>40\u201345</b> \u2014 consider FSH if there are menopausal symptoms and a change in the menstrual cycle. Do not use FSH to diagnose menopause on combined hormonal contraception or high-dose progestogen."},
    {tone:"blue", h:"Route \u2014 consider transdermal where VTE risk is raised", html:"<b>Transdermal oestrogen at standard doses carries little or no excess VTE or stroke risk</b> compared with oral (no hepatic first-pass); risk is dose- and patient-dependent. <b>Oral oestrogen increases VTE risk</b> and slightly raises ischaemic stroke risk. Consider transdermal oestrogen rather than oral oestrogen in people with increased VTE risk, including BMI &gt;30 kg/m\u00b2 (NICE NG23). It is also often preferred in migraine, hypertriglyceridaemia, malabsorption and some cardiovascular-risk situations. Route choice remains individualised \u2014 smoking, migraine, controlled hypertension and gallbladder disease are not absolute barriers to oral HRT, but reasons to weigh route, dose and comorbidity carefully."},
    {tone:"blue", h:"Counsel in absolute numbers", html:"MHRA: starting at about 50 and using systemic HRT for 5 years gives roughly <b>5 extra breast cancers per 1000 with oestrogen-only, 14 with sequential combined and 20 with continuous combined</b>, assessed over ages 50\u201369 \u2014 population estimates, not individual predictions. Sequential combined appears lower risk than continuous combined but higher than no HRT. Baseline risk varies with BMI, alcohol, family history, breast density and other factors. NICE considers the evidence insufficient to establish whether preparations containing micronised progesterone or dydrogesterone have a different breast-cancer risk from other progestogens \u2014 observational data suggest a possible difference, but this is not proven protection. HRT is not for cardiovascular prevention; in selected women under 60 or near menopause, overall CVD risk is not shown to rise \u2014 individual history still matters."},
    {tone:"green", h:"POI is treated for health, not just symptoms", html:"Menopause under 40 \u2014 <b>POI affects about 1% of women under 40</b>. Confirm with <b>two raised FSH readings at least 4\u20136 weeks apart</b>, refer, and offer <b>HRT or a suitable combined hormonal contraceptive until at least the average age of natural menopause (~51), unless contraindicated</b>, for bone, cardiovascular and cognitive protection. <b>HRT is not contraceptive.</b> Risks are generally not increased above those of age-matched women with normal ovarian function."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step is where patients come to harm.",
  pathway:[
    {title:"Exclude what isn't menopause", html:"Any postmenopausal bleeding \u2192 assess before HRT (NICE NG12 (updated April 2026): unexplained PMB aged 55 or over, not attributable to HRT \u2192 suspected cancer pathway; under 55 \u2192 consider). Breast lump or nipple discharge \u2192 breast suspected cancer pathway referral (NG12 criteria). Current or past breast cancer, active VTE, recent arterial thrombosis, active liver disease \u2192 specialist. Atypical features \u2014 severe unilateral headache, focal neurology, bone pain, weight loss \u2014 investigate rather than attribute.", alert:true},
    {title:"Diagnose clinically and quantify", html:"Clinical from 45; FSH only under 40 (suspected POI) or uncertain at 40\u201345. Record symptom type, frequency, night-time waking and quality-of-life impact \u2014 you will judge treatment against this at 3 months."},
    {title:"Assess and counsel", html:"BP, BMI, breast screening status and cardiovascular risk as part of usual preventive care; pelvic/speculum examination symptom-led (bleeding or vulvovaginal symptoms); thyroid clinically; personal and family history of breast cancer and VTE; arterial cardiovascular history; liver disease; migraine and medication history; uterus status (including subtotal hysterectomy or endometrial ablation); contraception and pregnancy possibility; her priorities and treatment preferences. Counsel with absolute risk. <b>HRT is not contraception.</b>"},
    {title:"Prescribe \u2014 route then regimen", html:"Consider transdermal where VTE risk is increased (including BMI &gt;30); otherwise individualise the route. Uterus (or possible residual endometrium)? \u2192 progestogen. Peri (LMP &lt;12 months) \u2192 sequential; post (\u226512 months\u2019 amenorrhoea) \u2192 continuous combined. Vaginal symptoms only \u2192 local oestrogen alone. Start low and titrate to the lowest effective dose."},
    {title:"Review and fine-tune", html:"Review at <b>3 months</b> after starting or changing (ask specifically about bleeding), then annually with no arbitrary stop date \u2014 reassessing benefit and risk each time. Fix side effects rather than abandoning HRT; assess unscheduled bleeding per the BMS pathway."}
  ],
  sections:[

    {id:"confirm", nav:"Diagnose", title:"Confirm the menopause \u2014 and know when to test", sub:"Menopause is a clinical diagnosis from age 45. Investigations are rarely needed and often actively misleading.",
     blocks:[
       {b:"table", head:["Stage","Definition","What to do"], rows:[
         ["<b>Menopause</b>","<b>12 months amenorrhoea</b> after the last menstrual period (uterus intact). Average UK age <b>51</b>; range <b>45\u201355</b>","Clinical diagnosis from 45 \u2014 <b>do not check FSH</b>"],
         ["<b>Perimenopause</b>","Menopausal symptoms with a change in the menstrual cycle, aged <b>&gt;40</b>. May still be having periods. <em>Cycle variation of \u22657 days and a typical duration of 4\u20138 years are supporting staging/epidemiological information, not NICE diagnostic criteria</em>","Clinical diagnosis; sequential HRT if treating"],
         ["<b>Early menopause</b>","Age <b>40\u201345</b>","Consider FSH if there are menopausal symptoms and a change in the menstrual cycle (NICE NG23). <b>HRT strongly recommended to age 51</b>"],
         ["<b>Premature ovarian insufficiency (POI)</b>","Menopause <b>&lt;40</b> \u2014 affects about <b>1% of women aged &lt;40</b>","<b>Two raised FSH readings 4\u20136 weeks apart</b>, interpreted with symptoms and menstrual history, to confirm (NICE NG23) \u2192 <b>refer</b>. Offer HRT or a suitable combined hormonal contraceptive until at least the average age of natural menopause, unless contraindicated, for bone, cardiovascular and cognitive protection (see the POI box below)"]
       ]},
       {b:"dl", rows:[
         ["Aged \u226545 years","<b>Clinical diagnosis \u2014 do NOT do FSH</b> (NG23). Vasomotor symptoms plus irregular cycles = perimenopause; no period for 12 months = postmenopause"],
         ["Aged 40\u201345 years","Consider FSH if there are menopausal symptoms and a change in the menstrual cycle (NICE NG23) \u2014 for example where the diagnosis is uncertain, or after hysterectomy"],
         ["Under 40 years","Suspected POI: <b>two raised FSH results 4\u20136 weeks apart</b>, interpreted with symptoms and menstrual history"],
         ["On the pill or a Mirena","Symptoms are masked and <b>Do not use FSH to diagnose menopause on combined hormonal contraception or high-dose progestogen</b> \u2014 it is unreliable; stop or switch before testing if the answer matters"],
         ["<b>Symptoms to establish</b>","<b>Vasomotor</b> (hot flushes, night sweats); <b>psychological</b> (low mood, anxiety, poor memory, brain fog); <b>urogenital</b> (dryness, dyspareunia, urinary urgency); <b>musculoskeletal</b> (joint pains, reduced muscle mass); <b>sleep disturbance</b>"],
         ["<b>Quantify the burden</b>","Use the <b>Greene Climacteric Scale</b> or the <b>Menopause Rating Scale (MRS)</b> to score severity, so you can judge treatment response objectively at 3 months. Record night-time waking and quality-of-life impact"],
         ["Impact is a legitimate medical need","Most women have symptoms and many describe a significant impact on work, relationships and wellbeing \u2014 this is not trivial"]
       ]},
       {b:"why", html:"NG23 explicitly states FSH testing is <b>not required</b> to diagnose menopause in women over 45 with typical symptoms: FSH fluctuates wildly in perimenopause, so a normal result does not exclude it and a single raised result does not confirm it. Testing in under-45s is appropriate to detect POI, which carries significant long-term consequences \u2014 increased osteoporosis, cardiovascular disease and dementia risk \u2014 so early identification and HRT initiation is health-preserving."},
       {b:"cards", items:[
         {tone:"green", h:"Premature ovarian insufficiency (under 40) \u2014 practical steps", html:"POI is menopause before age 40. <b>Confirm</b> suspected POI with <b>two elevated FSH measurements 4\u20136 weeks apart</b>, alongside symptoms and absent or infrequent periods. <b>Investigate the cause</b> where appropriate, including autoimmune, genetic, iatrogenic and other relevant causes. <b>Offer HRT or a suitable combined hormonal contraceptive until at least the average age of natural menopause</b>, unless contraindicated. <b>HRT is not contraceptive.</b> Attend to: bone health and fracture risk; cardiovascular risk; psychological wellbeing; contraception; pregnancy planning; autoimmune thyroid/adrenal disease where clinically indicated. Refer to specialist menopause, gynaecology, endocrinology or reproductive medicine services according to the suspected cause."}
       ]},
       {b:"warn", html:"<b>Investigate any abnormal or unscheduled bleeding BEFORE starting HRT.</b> Unexplained postmenopausal bleeding in a woman not yet on HRT cannot be attributed to HRT: NICE NG12 (updated April 2026) \u2192 suspected cancer pathway referral aged 55 or over, and consider one under 55. Do not start systemic HRT until unexplained bleeding has been assessed \u2014 starting treatment first may complicate interpretation of subsequent bleeding."}
     ]},

    {id:"severe", nav:"Red flags", title:"Red flags \u2014 screen before you prescribe", sub:"Some \u201cmenopausal\u201d symptoms are sinister. Do not attribute symptoms to the menopause without exclusion.",
     blocks:[
       {b:"cards", items:[
         {tone:"purple", h:"Suspected cancer \u00b7 NICE NG12 (updated April 2026) \u2014 postmenopausal bleeding", html:"Unexplained postmenopausal bleeding (more than 12 months after menstruation has stopped) <b>that cannot be attributed to HRT timing or an identified benign cause</b>: aged 55 or over \u2192 suspected cancer pathway referral for endometrial cancer; <b>under 55</b> \u2192 consider a suspected cancer pathway referral. Assess before starting HRT. Unscheduled bleeding while already on HRT follows NICE NG23 (April 2026) and the BMS 2024 joint guideline instead \u2014 see <a href='#monitor'>bleeding on HRT</a>. Persistent intermenstrual or post-coital bleeding in a perimenopausal woman over 45 also needs assessment before HRT: examine the cervix (if it looks suspicious of cancer \u2192 suspected cancer pathway referral, NICE NG12), check screening status and test for STIs as indicated, and refer to gynaecology for endometrial assessment (NICE NG88). Do not start systemic HRT until unexplained postmenopausal bleeding has been assessed \u2014 starting treatment first may complicate interpretation of subsequent bleeding and must not delay investigation of endometrial pathology."},
         {tone:"purple", h:"Suspected cancer \u00b7 Breast", html:"<b>NICE NG12 (updated April 2026):</b> aged <b>30 and over with an unexplained breast lump</b>, with or without pain \u2192 suspected cancer pathway referral; aged <b>50 and over with discharge, retraction or other changes of concern in one nipple only</b> \u2192 suspected cancer pathway referral. New breast mass, skin tethering, nipple discharge (especially blood-stained), or axillary lymphadenopathy that falls outside these criteria \u2192 urgent breast clinic via the local pathway. Investigate and refer <b>before</b> HRT initiation \u2014 HRT with an oestrogen-sensitive malignancy causes serious harm. <b>Do not start HRT until assessment is complete.</b>"},
         {tone:"red", h:"Breast cancer \u2014 current or past", html:"Systemic HRT is <b>not routinely recommended</b>. If symptoms are severe and non-hormonal options fail \u2192 specialist menopause and oncology advice (exceptional individualised use may be considered). For vaginal symptoms: non-hormonal moisturisers and lubricants first; vaginal oestrogen if symptoms persist, by shared decision \u2014 <b>on an aromatase inhibitor, discuss with the breast specialist first</b> (recurrence risk uncertain) (NICE NG23)."},
         {tone:"red", h:"Current VTE or arterial thrombosis", html:"Current DVT, PE or recent arterial thrombosis \u2192 <b>oral HRT contraindicated</b>. Treat first and seek specialist advice before deciding on route \u2014 transdermal oestrogen at standard doses carries little or no excess VTE risk."},
         {tone:"red", h:"Other oestrogen-dependent malignancy", html:"Endometrial cancer, certain ovarian cancers \u2192 <b>seek specialist advice; do not initiate HRT without oncology input</b>."},
         {tone:"red", h:"Severe liver disease", html:"Active hepatitis, hepatic failure, hepatocellular carcinoma \u2192 <b>oral HRT contraindicated</b> (first-pass hepatic metabolism). Transdermal may be possible with specialist guidance."},
         {tone:"amber", h:"Atypical or rapidly progressive symptoms", html:"Severe unilateral headache, focal neurological symptoms, bone pain, weight loss \u2192 investigate before attributing anything to the menopause. May represent malignancy or neurological disease."},
         {tone:"amber", h:"Uncontrolled hypertension", html:"Check BP before prescribing. Treat severe uncontrolled hypertension before systemic HRT, and manage any hypertension per standard guidance. Transdermal is often preferred in hypertension; controlled hypertension is not an absolute barrier to oral HRT \u2014 route choice is individualised."},
         {tone:"amber", h:"Undiagnosed abnormal bleeding or untreated hyperplasia", html:"Both preclude starting HRT \u2014 investigate or refer, and consider the non-hormonal pathway meanwhile."}
       ]},
       {b:"table", head:["Category","Examples","What to do"], rows:[
         ["<b>Do not start (routinely)</b>","Current or past breast cancer (specialist advice for exceptions); other oestrogen-dependent cancer; undiagnosed abnormal bleeding; untreated endometrial hyperplasia; active liver disease; current VTE or recent arterial thrombosis; pregnancy","Investigate or refer; consider the non-hormonal pathway"],
         ["<b>Specialist first</b>","Previous VTE or thrombophilia; hormone-sensitive cancer history wanting HRT; complex CVD","Refer to a menopause clinic \u2014 <b>transdermal may still be possible</b>; do not simply refuse"],
         ["<b>Caution \u2014 choose route carefully</b>","BMI &gt;30, migraine with aura, smoker, controlled hypertension, gallbladder disease, aged 60 or over","<b>Consider transdermal oestrogen</b> rather than oral where VTE risk is increased, including BMI &gt;30 (NICE NG23); often preferred in migraine and some cardiovascular-risk situations. These are <b>not absolute barriers to oral HRT</b> \u2014 weigh route, dose and comorbidity and individualise"],
         ["<b>Not barriers</b>","Well-controlled hypertension, migraine without aura, diabetes, previous cervical or ovarian pathology per specialist advice","Prescribe by the low-risk route; monitor BP"]
       ]},
       {b:"why", html:"Migraine (with or without aura) contraindicates the combined <em>pill</em>, not HRT \u2014 physiological transdermal estradiol is acceptable in migraineurs. The pattern to internalise: risk factors change the ROUTE (consider transdermal); true contraindications change the PLAN (refer or go non-hormonal)."},
       {b:"warn", html:"<b>HRT is not contraception.</b> Fertility can persist: contraception is needed until <b>2 years after the LMP if aged &lt;50, or 1 year if <b>≥50</b> for natural menopause; if amenorrhoea is masked by hormonal contraception, follow method-specific FSRH advice (55 is a pragmatic stopping point for most methods). A <b>52 mg LNG-IUD (e.g. Mirena)</b> can provide endometrial protection for up to 5 years with systemic oestrogen (BMS/FSRH) \u2014 separate from its contraceptive licence; confirm the duration against current local guidance and check the current SPC."}
     ]},

    {id:"risk", nav:"Risk &amp; counselling", title:"The risk numbers to counsel with", sub:"HRT risk must be contextualised in absolute, not relative, terms. This is the heart of shared decision-making.",
     blocks:[
       {b:"table", head:["Risk","What to say (absolute figures \u2014 denominator and time horizon as stated in each row)","Modifier"], rows:[
         ["<b>Breast cancer</b>","MHRA (start at about 50, 5 years of use, counted over ages 50\u201369): about <b>5 extra per 1000 with oestrogen-only, 14 with sequential combined, 20 with continuous combined</b> \u2014 population estimates, not individual predictions. Risk relates to duration and falls after stopping","NICE: evidence is insufficient to establish whether micronised progesterone or dydrogesterone carry a different risk from other progestogens \u2014 observational data suggest a possible difference, not proven protection. Sequential combined appears lower risk than continuous combined but higher than no HRT. Baseline risk varies with BMI, alcohol, family history, breast density and other factors. Obesity is also a breast cancer risk factor"],
         ["<b>VTE</b>","<b>Oral HRT increases VTE risk</b> (small absolute increase). <b>Transdermal at standard doses: little or no excess risk</b>","Consider transdermal rather than oral where VTE risk is increased, including BMI &gt;30 (NICE NG23); also weigh smoking, previous superficial thrombophlebitis and family history"],
         ["<b>Cardiovascular</b>","Not for primary or secondary CVD prevention. In appropriately selected women under 60 or near menopause, evidence does not show increased overall CVD risk; starting later carries more risk. Established CHD or stroke \u2192 specialist menopause input","<b>Timing matters enormously</b>"],
         ["<b>Stroke</b>","Oral oestrogen: small increased ischaemic stroke risk. <b>Transdermal at standard doses: little or no increase</b> \u2014 dose- and patient-dependent","Consider transdermal where stroke risk factors are present \u2014 individualise"],
         ["<b>Endometrium</b>","<b>All women with an intact uterus MUST have a progestogen added.</b> Unopposed systemic oestrogen substantially increases hyperplasia and cancer risk","The LNG-IUS (Mirena) is an established route of progestogen delivery"],
         ["<b>Bones \u2014 a benefit</b>","HRT reduces osteoporotic fracture while taken (WHI, specific regimens)","Protective only while taking it. Especially important in POI and early menopause \u2014 but not prescribed solely for osteoporosis when bone-specific treatment is more appropriate"]
       ]},
       {b:"why", html:"The <b>2002 Women's Health Initiative</b> caused widespread HRT abandonment on the basis of relative-risk figures that represent very small absolute individual increases. Re-analysis showed WHI used predominantly <b>oral conjugated equine oestrogen with medroxyprogesterone</b> \u2014 not modern body-identical transdermal estradiol with micronised progesterone. Observational cohorts such as <b>E3N</b> suggest lower VTE and breast cancer signals with transdermal oestrogen and micronised progesterone \u2014 background evidence only (NICE considers the evidence insufficient to establish a different breast-cancer risk by progestogen type; not proven protection), not the basis for current UK absolute-risk counselling (use NICE/MHRA figures). Oral oestrogen undergoes hepatic first-pass metabolism, stimulating clotting factors and renin \u2014 which mechanistically explains its VTE and hypertensive risk. The BMS, MHRA (2020) and NICE NG23 (2024 update) all now confirm the risk\u2013benefit balance favours HRT for most symptomatic women aged &lt;60. In POI, risks are generally not increased above those of age-matched women."}
     ]},

    {id:"exam", nav:"Examination", title:"Targeted examination", sub:"Brief, but it changes the prescription \u2014 and one item here catches a condition that mimics menopause exactly.",
     blocks:[
       {b:"table", head:["What","Threshold / look for","Why it changes the plan"], rows:[
         ["<b>Blood pressure</b>","<b>Before initiating HRT.</b> Treat severe uncontrolled hypertension first; manage any hypertension per standard guidance","Hypertension does not contraindicate <em>transdermal</em> HRT but must be documented and managed. Oral oestrogen can raise BP via hepatic renin\u2013angiotensin stimulation"],
         ["<b>BMI</b>","BMI &gt;30","Obesity is itself a breast cancer risk factor and raises VTE risk \u2014 factor it into shared decision-making and consider transdermal (NICE NG23)"],
         ["<b>Breast</b>","Symptom-led \u2014 any mass or nipple discharge \u2192 <b>urgent referral before HRT</b>. Check screening status","<b>NHS Breast Screening Programme: 50\u201371 years, 3-yearly.</b> A normal current mammogram is not a contraindication \u2014 and asking builds rapport"],
         ["Pelvic examination","Indicated if urogenital symptoms, PMB, or an IUS fitting is planned","Look for <b>atrophic vaginitis</b> (pale, dry, friable mucosa), pelvic floor tone, uterine size"],
         ["<b>Thyroid</b>","Clinical assessment \u2014 TFTs if any features","<b>Thyroid dysfunction mimics menopause closely</b>: fatigue, palpitations, mood change, irregular periods, weight gain. Prescribing HRT for undiagnosed hypothyroidism delays the right treatment"],
         ["Cardiovascular","Murmurs, oedema","Document a baseline \u2014 oestrogens can cause fluid retention, so observe carefully in cardiac impairment (SPC); in established heart failure prefer the transdermal route and seek specialist advice"]
       ]}
     ]},

    {id:"workup", nav:"Investigations", title:"Investigations \u2014 targeted, not routine", sub:"Note the do-not-order list as carefully as the order list.",
     blocks:[
       {b:"table", head:["Test","When","Interpretation"], rows:[
         ["<b>TFTs (TSH)</b>","Any clinical suspicion of thyroid dysfunction","Hypothyroidism is highly prevalent in the same demographic \u2014 <b>do not attribute fatigue or weight gain to the menopause without a TSH</b>"],
         ["<b>FSH / LH / oestradiol / AMH</b>","<b>Do not routinely request to diagnose menopause over 45</b> (NG23)","Under 40: two raised FSH results 4\u20136 weeks apart, interpreted with symptoms and menstrual history, confirm POI (NICE NG23). 40\u201345: consider FSH if there are menopausal symptoms and a change in the menstrual cycle. Hormone levels fluctuate \u2014 a single measurement is unreliable; FSH is unreliable on combined hormonal contraception or high-dose progestogen"],
         ["<b>FBC + ferritin</b>","Heavy perimenopausal periods, or fatigue","<b>Iron deficiency anaemia</b> \u2014 check before attributing fatigue or palpitations solely to the menopause"],
         ["<b>Lipid profile + QRISK3</b>","As part of usual preventive care","Menopause raises LDL and lowers HDL. <b>QRISK3</b> is preferred over QRISK2 here \u2014 it includes SLE, severe mental illness and AF, all relevant in this age group"],
         ["<b>DEXA scan</b>","Per fracture-risk assessment and osteoporosis guidance (e.g. POI, prior fragility fracture)","<b>Not routine</b> before HRT. In POI it guides dose optimisation \u2014 these women have accelerated bone loss"],
         ["Pelvic ultrasound","<b>Unexplained PMB</b> (via the NICE NG12 suspected cancer pathway); <b>unscheduled bleeding on HRT</b> (TVUSS per BMS 2024); suspected fibroids","<b>Not routine</b> before HRT in an asymptomatic woman with a normal screening history"],
         ["<b>Do NOT order</b>","\u2014","<b>Routine mammography before HRT</b> (use the NHS screening programme); <b>routine coagulation screen</b> (no evidence it changes management); <b>routine bone density</b> in standard peri/menopausal women"]
       ]}
     ]},

    {id:"ladder", nav:"Prescribe", title:"Prescribing \u2014 three questions decide everything", sub:"(1) Uterus? (2) Peri or post? (3) Vaginal symptoms only? Then choose the route: consider transdermal where VTE risk is increased (including BMI &gt;30), otherwise individualise. Named products and doses are for orientation only \u2014 verify every formulation against the current SPC, check current availability and Greater Manchester formulary status, distinguish licensed from off-label use, and review higher-dose oestrogen/progestogen balance with specialist advice.",
     blocks:[
       {b:"ladder", steps:[
         {step:"No uterus", title:"Oestrogen-only", when:"after total hysterectomy",
          html:"<b>Patch:</b> Evorel or Estradot <b>50 micrograms twice weekly</b> (start 25\u201350; range 25/50/75/100). <b>Gel:</b> Oestrogel <b>2 pumps daily</b>, or Sandrena <b>1 mg daily</b>. <b>Spray:</b> Lenzetto <b>1\u20133 sprays daily</b>. <b>Oral:</b> estradiol (Elleste Solo, Zumenon) <b>1\u20132 mg daily</b>. <em>Oestrogen-only applies after <b>total</b> hysterectomy. After <b>subtotal hysterectomy</b>, residual endometrium may remain and combined HRT may be required \u2014 seek specialist advice. After <b>endometrial ablation</b>, do not assume that oestrogen-only HRT is safe \u2014 use a progestogen-containing regimen and seek advice if uncertain. Women with <b>significant endometriosis</b> may require combined HRT even after hysterectomy \u2014 discuss with gynaecology/menopause specialists.</em>"},
         {step:"Uterus + peri", title:"Sequential (cyclical) combined", when:"LMP <12 months",
          fromLabel:"still bleeding, or <12 months since LMP",
          html:"Oestrogen continuously plus a progestogen for <b>12\u201314 days a month</b> \u2192 expect a monthly withdrawal bleed. <b>Ready-made oral:</b> Femoston 1/10, Elleste Duet 1 mg. <b>Ready-made patch:</b> Evorel Sequi. <b>Build your own (most flexible):</b> any oestrogen above plus <b>Utrogestan 200 mg nocte on days 15\u201326</b>, or plus a Mirena."},
         {step:"Uterus + post", title:"Continuous combined", when:"after 12 months\u2019 amenorrhoea; if sequential started after 45, consider switching after 5 years or by age 54",
          fromLabel:"postmenopausal",
          html:"<b>Continuous combined HRT can usually be started after 12 months of amenorrhoea, when postmenopause is established. For women who started sequential HRT after age 45, the BMS suggests considering a switch to continuous combined HRT after 5 years or by age 54, whichever comes first, if appropriate.</b> Started too early in the perimenopause it commonly causes irregular bleeding, because endogenous ovarian activity continues. Oestrogen plus progestogen daily \u2192 bleed-free once settled. <b>Ready-made oral:</b> Femoston-conti 0.5/1 mg, Kliovance 1 mg, Kliofem, Bijuve 1 mg/100 mg (body-identical). <b>Patch:</b> Evorel Conti. <b>Build your own:</b> oestrogen plus <b>Utrogestan 100 mg nocte daily</b>, or plus a Mirena. <b>Tibolone (Livial) 2.5 mg daily</b> is a single-agent alternative \u2014 a synthetic steroid with oestrogenic, progestogenic and weak androgenic activity, needing no separate progestogen; postmenopausal (&gt;12 months amenorrhoea) only, may help low libido; <b>avoid with a breast cancer history and &gt;60 (stroke risk)</b>."},
         {step:"Vaginal only", title:"Local oestrogen", when:"GSM, dryness, recurrent UTI \u2014 any age, for as long as needed",
          fromLabel:"urogenital symptoms only",
          html:"<b>Vagifem or Vagirux 10 micrograms</b> pessary nightly for 2 weeks, then twice weekly; Ovestin cream; <b>Estring</b> ring (3-monthly \u2014 good where dexterity is poor); Imvaggis pessary. A progestogen is <b>not routinely required</b> with low-dose vaginal oestrogen; serious adverse effects are very rare (minimal systemic absorption), and it can be continued for as long as needed with regular review. It <b>may be used in combination with systemic HRT</b>. Low-dose vaginal oestrogen should <b>not be confused with systemic oestrogen</b>. <b>Unexplained vaginal bleeding still requires assessment.</b> In people with breast cancer, particularly those taking an <b>aromatase inhibitor</b>, discuss with the breast specialist where appropriate."},
         {step:"Add-on", title:"Testosterone for persistent low libido", when:"persistent low sexual desire with menopause, after HRT optimised",
          fromLabel:"off-licence in women",
          html:"<b>Not a routine GP prescription.</b> Consider testosterone only for persistent low sexual desire associated with menopause after HRT has been optimised and other biopsychosocial, relationship, medication and genitourinary causes have been assessed. Prescribing is <b>off-label in women</b> and should follow local specialist or menopause-service arrangements (preparations such as Testogel or AndroFeme 1 per local arrangements). Check baseline testosterone/SHBG where appropriate, review clinical response and androgenic adverse effects, and stop if there is no meaningful benefit after an adequate trial. <b>Do not use testosterone routinely for fatigue, mood, cognition, muscle strength or general wellbeing.</b>"}
       ]},
       {b:"table", head:["Dose level","Oral estradiol","Patch","Oestrogel pumps","Lenzetto sprays"], rows:[
         ["Low (start if 60 or over)","0.5\u20131 mg","25 micrograms","1","1"],
         ["Standard start","1 mg","25\u201350 micrograms","2","1\u20132"],
         ["Moderate","2 mg","50\u201375 micrograms","3","2\u20133"],
         ["High (specialist territory beyond this)","\u2014","100 micrograms","4","3"]
       ]},
       {b:"table", head:["Progestogen","Sequential (12\u201314 days/month)","Continuous (daily)","Notes"], rows:[
         ["<b>Micronised progesterone (Utrogestan) \u2014 preferred</b>","<b>200 mg nocte</b> for 12 days","<b>100 mg nocte</b>","<b>Licensed, regulated body-identical</b> (\u2018body-identical\u2019 is a descriptive term, not a regulatory category); observational data suggest possible lower breast and VTE signals, but NICE considers the breast-cancer evidence insufficient \u2014 not proven protection. Derived from plant sterols. Sedating \u2014 use at night. Contains soya lecithin \u2014 contraindicated in soya or peanut allergy (SmPC)"],
         ["Dydrogesterone (in Femoston)","10 mg for 14 days","5 mg","Only available in combined products in the UK"],
         ["Medroxyprogesterone (Provera)","10 mg for 12\u201314 days","2.5\u20135 mg","If Utrogestan is not tolerated"],
         ["Norethisterone","5 mg for 12\u201314 days","5 mg","More androgenic \u2014 more mood and skin side effects"],
         ["<b>Mirena 52 mg LNG-IUS</b>","Covers continuously","Covers continuously","<b>Established progestogen delivery</b>; also provides contraception. <b>Endometrial protection for up to 5 years with systemic oestrogen</b> (BMS/FSRH) \u2014 confirm the duration against current local guidance; separate from the contraceptive licence, which has changed; check the current SPC. Ideal in perimenopause where both are needed"]
       ]},
       {b:"warn", html:"<b>Never give unopposed systemic oestrogen to a woman with a uterus.</b> Start low and titrate up \u2014 younger women and those with POI often need the higher end, older women the lower end, but don't over-restrict the dose: an inadequate dose means inadequate symptom control. Most women need a 50 microgram patch or equivalent. <b>If the oestrogen dose goes up, check the progestogen still matches</b> \u2014 under-dosed progestogen, or fewer than 12 sequential days, risks hyperplasia. Review higher-dose oestrogen/progestogen balance with specialist advice."},
       {b:"why", html:"The LNG-IUS as progestogen delivery is practically advantageous \u2014 it avoids systemic synthetic progestogen while providing contraception. Regimen selection matters: switching perimenopausal women to continuous combined prematurely causes unscheduled bleeding and poor adherence."}
     ]},

    {id:"lifestyle", nav:"Lifestyle", title:"Non-pharmacological interventions \u2014 evidence-based adjuncts", sub:"Not a substitute for HRT in severe symptoms, but they substantially enhance outcomes and can reduce the dose needed.",
     blocks:[
       {b:"table", head:["Intervention","What to advise","Effect"], rows:[
         ["<b>Aerobic exercise</b>","<b>150 minutes/week</b> moderate intensity","May help vasomotor symptoms; improves mood, sleep and bone health"],
         ["<b>Strength training</b>","Progressive resistance training <b>2\u20133\u00d7/week</b>","Helps protect against menopausal muscle and bone loss \u2014 recommend to every menopausal woman"],
         ["<b>Weight management</b>","Even <b>5% weight loss</b> helps","Reduces vasomotor symptom frequency. (Paradoxically, obese women often have <em>more</em> flushes despite peripheral androgen-to-oestrone conversion, because of receptor downregulation)"],
         ["<b>Sleep hygiene</b>","Cool bedroom (<b>16\u201318\u00b0C</b>), cotton nightwear, bedroom fan; layered clothing and trigger avoidance","Night sweats disrupt sleep \u2192 fatigue \u2192 mood symptoms"],
         ["<b>CBT</b>","<b>NICE NG23 (2024 update)</b>; mindfulness-based cognitive therapy (MBCT); NHS Talking Therapies self-referral","<b>MENOS 1 and 2 RCTs</b>: menopause-specific CBT reduces the bother and impact of flushes (not necessarily their frequency). Offer alongside HRT or as an alternative where it is declined or contraindicated"],
         ["<b>Phytoestrogens</b>","Soy isoflavones","Modest, inconsistent evidence in mild vasomotor symptoms. Not a substitute for HRT in severe symptoms; avoid in oestrogen-sensitive cancers"],
         ["<b>Alcohol and caffeine</b>","<b>\u226414 units/week</b>; reduce coffee if flushes worsen after it","Both are vasomotor triggers; alcohol also disrupts sleep architecture and raises breast cancer risk"],
         ["<b>Smoking cessation</b>","NHS stop-smoking service","Smoking worsens vasomotor symptoms and cardiovascular risk, and brings menopause forward"],
         ["<b>Vaginal health</b>","<b>Vaginal moisturisers (Replens 3\u00d7/week)</b> plus lubricants (Sylk, YES) for intercourse; regular sexual activity","Maintains vaginal blood flow and epithelial health \u2014 the non-hormonal management of GSM. Pelvic-floor exercises for urinary symptoms"],
         ["<b>Bone and cardiovascular health</b>","Weight-bearing exercise, <b>calcium and vitamin D</b>; BP, lipids, smoking and alcohol addressed on their own merits","Menopause management is more than symptom control"]
       ]},
       {b:"why", html:"Exercise supports bone, cardiovascular and mental health in the menopause. NG23 recommends CBT alongside HRT or as an alternative when HRT is contraindicated."}
     ]},

    {id:"monitor", nav:"Review", title:"Follow-up, side effects and bleeding", sub:"Most treatment \u201cfailure\u201d is a dose, route, progestogen or absorption problem \u2014 not the wrong decision.",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["<b>Early contact (optional)</b>","If needed before 3 months","Side effects, patch tolerance, early bleeding concerns"],
         ["<b>Formal assessment</b>","<b>3 months</b> after any start or change","Symptom response, side effects, BP. Inadequate control \u2192 titrate the oestrogen up (and re-match the progestogen). <b>Ask specifically about bleeding</b> (NICE NG23). Review progestogen tolerability. Most side effects settle by 3 months \u2014 don't switch too early, and don't accept misery too long"],
         ["<b>Annual review</b>","Ongoing","Annually, or earlier for bleeding, poor response, adverse effects or new medical history. Reassess symptom control, <b>bleeding</b>, <b>BP and weight</b>, breast symptoms and <b>mammography screening up to date</b>, VTE or arterial symptoms, contraception, updated medical and family history, and the ongoing benefit\u2013risk balance; document the discussion and the continued need"],
         ["Bleeding pattern","Every contact","Unscheduled bleeding is common in the first 6 months of systemic HRT and within 3 months of a dose or preparation change (NICE NG23); bleeding starting outside those windows, or heavy, prolonged or persistent bleeding \u2192 urgent assessment per the BMS pathway (see the bleeding table below)"],
         ["<b>HRT duration</b>","\u2014","<b>BMS: no arbitrary time limit.</b> Most women use it 2\u20135 years; some benefit lifelong (especially POI, osteoporosis, severe symptoms). <b>Do not force stopping at 5 years without a clinical reason</b> \u2014 continue at the lowest effective dose while benefit outweighs risk"],
         ["<b>Stopping HRT</b>","When agreed","<b>Taper rather than stopping abruptly</b> to avoid a rebound symptom surge \u2014 <b>reduce the dose by 50% for 3 months</b> before stopping; tapering is better tolerated and more likely to lead to successful discontinuation. Some women never tolerate complete cessation; discuss honestly"]
       ]},
       {b:"table", head:["Side-effect pattern","Symptoms","Fix, in order"], rows:[
         ["<b>Oestrogenic</b>","Breast tenderness, nausea, bloating, leg cramps, headaches","<b>1</b> Reassure \u2014 often settles \u22643 months \u2192 <b>2</b> take oral with food or at night \u2192 <b>3</b> reduce the dose \u2192 <b>4</b> switch oral to transdermal"],
         ["<b>Progestogenic</b> \u2014 the commonest reason women quit","PMS-like mood swings, irritability, low mood, acne, greasy skin, breast tenderness in the progestogen phase","<b>1</b> Switch to <b>Utrogestan or dydrogesterone</b> \u2192 <b>2</b> deliver via <b>Mirena</b> (minimal systemic absorption) \u2192 <b>3</b> vaginal Utrogestan (off-licence) \u2192 <b>4</b> keep 12 days if sequential \u2014 <b>never shorten below this</b>"],
         ["<b>Practical / local</b>","Patch-site irritation, gel transfer worries, forgetting tablets","Rotate patch sites; switch patch \u2192 gel \u2192 spray; a once-daily combined tablet; align with an existing routine"],
         ["<b>Unclear or both</b>","Persistent intolerance of several regimens","Trial a different combined product, or tibolone (postmenopausal only); specialist advice"]
       ]},
       {b:"table", head:["Bleeding scenario","Meaning","Action"], rows:[
         ["Sequential: monthly bleed near the end of the progestogen days","<b>Expected</b>","Reassure; if heavy or prolonged, increase the progestogen or switch product"],
         ["Continuous combined: spotting in the first 6 months","Common while the endometrium settles (NICE NG23, April 2026)","Reassure and review; check adherence, interacting drugs and cervical screening status"],
         ["<b>Low-risk unscheduled bleeding</b> \u2014 within 6 months of starting systemic HRT or within 3 months of a dose/preparation change, light or not persistent/heavy, and no significant endometrial cancer risk factors","Common; cancer risk low (NICE NG23, April 2026)","Check adherence and regimen; confirm the progestogen dose and duration; consider pregnancy possibility and cervical screening status; examine if indicated (including the cervix); optimise the HRT; review within the BMS timeframe (about 4-weekly, for up to 6 months)"],
         ["<b>Urgent TVUSS / gynaecology pathway</b> \u2014 bleeding starting more than 6 months after commencing HRT or more than 3 months after a dose/preparation change; heavy, prolonged or persistent bleeding; significant endometrial cancer risk factors; bleeding after established amenorrhoea on continuous combined; or bleeding persisting or worsening despite HRT adjustment","<b>Unscheduled \u2014 assess promptly</b> (NICE NG23, April 2026; BMS joint guideline). The aim is to pick out the few at higher risk","History, adherence and examination including the cervix; <b>urgent TVUSS (within 6 weeks)</b>. In unscheduled bleeding, a uniform, fully visualised endometrium <b>\u22644 mm on continuous combined, or \u22647 mm on sequential</b> \u2192 low risk; thicker, or not fully seen \u2192 endometrial assessment via the urgent suspected cancer pathway (biopsy or hysteroscopy). The threshold depends on the HRT regimen and applies only in the context of unscheduled bleeding \u2014 <b>it is not a screening threshold for asymptomatic women</b>"],
         ["<b>Higher-risk features \u2014 any time on HRT</b>","One major risk factor (e.g. BMI 40 or over, Lynch or Cowden syndrome) or three minor ones (e.g. BMI 30\u201339, diabetes, PCOS); or prolonged or heavy bleeding","BMS 2024: one major or three minor \u2192 urgent suspected cancer pathway referral, whatever the bleeding type or timing; prolonged or heavy bleeding, or two minor factors \u2192 urgent TVUSS (within 6 weeks). Full list in the guideline"],
         ["Bleeding after stopping HRT, or not attributable to HRT","<b>Unexplained postmenopausal bleeding</b>","NICE NG12 (updated April 2026): aged 55 or over \u2192 suspected cancer pathway referral; under 55 \u2192 consider one"],
         ["Bleeding after a dose or product change","Common within 3 months of the change (NICE NG23, April 2026)","Review at 3 months; assess as unscheduled bleeding if it persists beyond that"],
         ["Ready to stop the monthly bleed","Postmenopause established (12 months\u2019 amenorrhoea); if sequential HRT was started after 45, consider switching after 5 years or by age 54, whichever comes first (BMS)","Switch sequential \u2192 continuous combined if appropriate \u2014 switching too early in the perimenopause causes irregular bleeding"]
       ]},
       {b:"cards", items:[
         
       ]},
       {b:"cards", items:[
         {tone:"red", h:"\ud83d\udea8 999 \u2014 stop HRT and call", html:"<b>Signs of VTE:</b> unilateral leg pain with swelling. <b>Acute chest pain with breathlessness.</b> <b>Stroke symptoms (FAST):</b> facial droop, arm weakness, speech difficulty."},
         {tone:"amber", h:"\ud83d\udfe0 Bleeding \u2014 tell us promptly", html:"Vaginal bleeding <b>more than 6 months after starting HRT, or more than 3 months after a dose or product change</b>; bleeding that is heavy, prolonged or persistent; or any bleeding after stopping HRT. Do not wait for the next review."},
         {tone:"red", h:"\ud83d\udd34 Same day", html:"A <b>new breast lump</b>. Severe unexplained headache. Severe unilateral abdominal or pelvic pain."},
         {tone:"amber", h:"\ud83d\udcde Tell us rather than stopping", html:"\u201cSide effects in the first few weeks are common and usually settle \u2014 don't stop it yourself. Tell me and we will adjust the dose, the route or the progestogen instead.\u201d"},
         {tone:"green", h:"\ud83e\ude7a Breast awareness", html:"Reassess breast awareness and screening at each annual review; report any new lump."}
       ]},
       {b:"say", html:"We'll review in three months. Side effects in the first few weeks are common and usually settle \u2014 don't stop it yourself; tell me and we'll adjust the dose, the route or the progestogen instead. There's almost always a version of HRT that suits."}
     ]},

    {id:"alternatives", nav:"Non-hormonal", title:"Non-hormonal options \u2014 HRT declined or contraindicated", sub:"A real pathway, not a consolation prize.",
     blocks:[
       {b:"table", head:["Option","Dose","Notes"], rows:[
         ["<b>CBT</b>","\u2014","Offer menopause-specific CBT for vasomotor symptoms, sleep disturbance or depressive symptoms associated with menopause (NG23), particularly where HRT is contraindicated or declined; NHS Talking Therapies self-referral"],
         ["<b>Fezolinetant (Veoza)</b>","<b>45 mg once daily</b>","NK3-receptor antagonist \u2014 an option for moderate-to-severe vasomotor symptoms when HRT is unsuitable (not a general first-line alternative). <b>Baseline LFTs</b>; do not start if ALT or AST \u22652\u00d7 ULN or bilirubin is elevated; <b>LFTs monthly for the first 3 months</b>, then according to clinical judgement; discontinue for specified transaminase elevations or features of liver injury. <b>Contraindicated with moderate or strong CYP1A2 inhibitors</b> and in pregnancy. Not recommended in moderate/severe hepatic impairment or severe renal impairment; not indicated during breastfeeding; concomitant systemic oestrogen HRT is not recommended (Veoza SPC)"],
         ["<b>Venlafaxine</b> (off-label)","Per SPC","Not routinely first-line for vasomotor symptoms alone (NICE NG23); BP, withdrawal and interaction considerations. Citalopram and escitalopram are alternatives. <b>Avoid paroxetine and fluoxetine with tamoxifen</b> (CYP2D6 inhibition reduces tamoxifen efficacy)"],
         ["Clonidine","Per SPC","Not routinely first-line for vasomotor symptoms alone; modest effect, and hypotension and dry mouth limit its use"],
         ["Gabapentin (off-label)","Per SPC, renal dosing","For flushes especially with sleep disturbance; sedation, falls, dependence and driving advice"],["<b>Compounded \u2018bioidentical\u2019 hormones</b>","\u2014","<b>Not recommended</b> \u2014 uncertain dose consistency, purity, safety and efficacy. <b>Offer licensed preparations with known composition</b> (regulated, licensed body-identical preparations such as 17\u03b2-estradiol and micronised progesterone). Do not recommend compounded bioidentical hormones when an appropriate licensed alternative is available"],
         ["Vaginal moisturisers and lubricants","Regular use","For GSM where even local oestrogen is declined (Replens, Sylk, YES)"]
       ]},
       {b:"why", html:"After breast cancer: non-hormonal options first; vaginal oestrogen if symptoms persist, by shared decision — with breast-specialist discussion if on an aromatase inhibitor (NICE NG23); fezolinetant or an SSRI/SNRI \u2014 avoiding the tamoxifen interactions \u2014 is the usual pathway."}
     ]},

    {id:"loop", nav:"Not responding?", title:"'HRT doesn't suit me' — re-run this checklist before stopping", sub:"Most treatment 'failure' is a dose, route, progestogen or absorption problem — not the wrong decision.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"1 · Time", html:"Given <b>\u22653 months</b> at this dose?"},
         {tone:"amber", h:"2 · Basics and absorption", html:"Adherence. Is the <b>patch actually sticking</b> \u2014 change site, avoid moisturiser? Gel on dry skin and <b>not washed off for an hour</b>? Spray technique correct?"},
         {tone:"amber", h:"3 · Dose", html:"Oestrogen stepped up, with the progestogen <b>re-matched</b>?"},
         {tone:"blue", h:"4 · Route", html:"Tried <b>transdermal</b> \u2014 steadier levels, no first-pass, little or no VTE excess at standard doses?"},
         {tone:"blue", h:"5 · Progestogen", html:"Switched to Utrogestan, dydrogesterone or Mirena?"},
         {tone:"blue", h:"6 · Regimen", html:"Sequential vs continuous right for her stage, and bleeding assessed?"},
         {tone:"amber", h:"7 · Mimics", html:"<b>TFTs, ferritin and FBC, HbA1c</b>, depression or anxiety, sleep apnoea, medication effects. Menopause is not the only cause of fatigue and poor sleep in a 50-year-old."}
       ]},
       {b:"cards", items:[
         {tone:"green", h:"All seven optimised?", html:"Then the decision to stop is an informed one \u2014 or the referral is to a <b>menopause specialist</b> rather than back to square one."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer \u2014 who goes where", sub:"GP-led menopause care is appropriate and encouraged by NG23 for the majority. Over-referral creates delay and access barriers.",
     blocks:[
       {b:"cards", items:[
         {tone:"purple", h:"Suspected cancer \u00b7 NICE NG12 (updated April 2026) \u2014 endometrial", html:"<b>Unexplained postmenopausal bleeding that cannot be attributed to HRT, aged 55 or over \u2192 suspected cancer pathway referral</b>; <b>under 55</b> \u2192 consider a suspected cancer pathway referral. Exclude endometrial cancer before starting HRT. Unscheduled bleeding on HRT: refer on the suspected cancer pathway when the BMS 2024 criteria are met (endometrium above 4 mm on continuous combined or 7 mm on sequential, one major or three minor risk factors, or bleeding worsening or persisting after 6 months of adjustment)."},
         {tone:"purple", h:"Suspected cancer \u00b7 Urgent breast clinic", html:"New breast mass, skin tethering, nipple discharge (especially blood-stained), axillary lymphadenopathy. <b>NICE NG12:</b> unexplained breast lump aged 30 and over, or a change in one nipple only aged 50 and over \u2192 suspected cancer pathway referral; otherwise urgent breast clinic via the local pathway. <b>Do not start HRT until assessment is complete.</b>"},
         {tone:"amber", h:"Specialist menopause clinic", html:"<b>POI (under 40)</b>; <b>early menopause (under 45)</b>; HRT failure after an adequate trial of optimised dose, route and progestogen; complex medical history or multiple risk factors; <b>women with breast cancer requesting HRT</b>; consideration of high-dose or unlicensed regimens."},
         {tone:"amber", h:"Gynaecology \u2014 unscheduled bleeding", html:"Unscheduled bleeding starting beyond the NICE NG23 windows (6 months after starting, 3 months after a change), heavy, prolonged or persistent bleeding, or significant endometrial cancer risk factors \u2192 urgent TVUSS (within 6 weeks) and endometrial assessment per the BMS joint guideline. Do not keep adjusting the HRT around persistent unscheduled bleeding \u2014 assess the endometrium, and check cervical screening status plus examination: not all bleeding on HRT is hormonal. This is a clinical summary of the BMS joint guideline, not a replacement for the local gynaecology pathway."},
         {tone:"blue", h:"Endocrinology", html:"POI with autoimmune features (thyroid, adrenal, diabetes); surgical menopause with complex comorbidity; <b>testosterone prescribing</b> \u2014 specialist-initiated in most areas."},
         {tone:"blue", h:"Haematology", html:"<b>Known thrombophilia</b> requesting HRT; personal or strong family VTE history; antiphospholipid syndrome. Many women with a VTE history can use transdermal HRT (little or no excess VTE risk at standard doses) \u2014 haematology input is needed only where thrombophilia is confirmed or high-risk, not for every VTE history."},
         {tone:"cream", h:"GP manages", html:"Standard perimenopause and menopause over 45 with typical symptoms and no contraindications \u2014 <b>initiation and ongoing management of standard HRT regimens</b>, including route and regimen choice, dose titration, side-effect management, and annual review."}
       ]},
       {b:"why", html:"POI needs specialist input because of diagnostic complexity, psychological impact, and the need for fertility counselling, higher-dose HRT and DEXA monitoring. Complex risk \u2014 previous VTE, thrombophilia, hormone-sensitive cancer, complex CVD \u2014 should prompt referral for specialist risk\u2013benefit assessment, <b>not a blanket refusal of HRT</b>."},
       {b:"say", html:"There's almost always a version of HRT that suits \u2014 the dose, the way it goes in, and the progestogen can each be changed independently. We'll adjust one thing at a time and review at three months."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only \u2014 the Casebook keeps the full teaching case.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 53-year-old woman, BMI 33, last period 18 months ago, requesting \u201cbio-identical hormones\u201d after reading about them. Flushes are waking her four times a night and she is struggling at work. In passing she mentions some light spotting a fortnight ago, which she assumed was \u201cthe last of it\u201d."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Identifies the postmenopausal bleeding (not on HRT, so it cannot be attributed to it) and refers on the suspected cancer pathway before prescribing \u2014 not after; diagnoses clinically without an unnecessary FSH; chooses <b>transdermal</b> for the BMI; picks a <b>continuous combined</b> regimen for her stage; explains the breast cancer risk in <b>absolute terms with the alcohol comparison</b>; addresses the \u201cbio-identical\u201d question honestly (body-identical estradiol and micronised progesterone are regulated and prescribable; compounded \u201cbio-identical\u201d preparations are not); safety-nets VTE and bleeding. <a href='../../cases/menopause.html'>Open the full casebook chapter \u2192</a>"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG23 \u2014 Menopause: identification and management (2015, last updated 15 April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng23" rel="noopener">nice.org.uk/guidance/ng23</a><span class="rd"> \u2014 clinical diagnosis from 45 without FSH, FSH only under 40 or where uncertain at 40\u201345, CBT, testosterone for low sexual desire; the April 2026 amendment (unscheduled bleeding common in the first 6 months of systemic HRT and within 3 months of a dose or preparation change; seek help promptly beyond these)</span></li>'+
         '<li><b>NICE NG12 \u2014 Suspected cancer: recognition and referral (updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> \u2014 April 2026 endometrial amendments: unexplained postmenopausal bleeding that cannot be attributed to HRT \u2192 suspected cancer pathway referral aged 55 and over, consider under 55; signposts BMS guidance for unscheduled bleeding on HRT; breast criteria</span></li>'+
         '<li><b>BMS, RCOG, BGCS, BSGE, FSRH, RCGP and GIRFT \u2014 Management of unscheduled bleeding on HRT: joint guideline (2024; current version 9 June 2026)</b><br><a href="https://thebms.org.uk/publications/bms-guidelines/management-of-unscheduled-bleeding-on-hormone-replacement-therapy-hrt/" rel="noopener">thebms.org.uk \u2014 unscheduled bleeding on HRT guideline</a><span class="rd"> \u2014 endometrial thickness 4 mm (continuous combined) and 7 mm (sequential), major and minor risk factors, 6 months of adjustment with about 4-weekly review</span></li>'+
         '<li>British Menopause Society guidance (2020, 2024); MHRA Drug Safety Update, Menopause 2020<br><a href="https://www.gov.uk/drug-safety-update" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> \u2014 BMS 2020 is historical context and does not override current NICE wording; route-specific risk, vaginal oestrogen after breast cancer, the absolute risk figures used for counselling</span></li>'+
         '<li><b>FSRH \u2014 Contraception for women aged over 40 (2023, with later amendments \u2014 check the current edition)</b><br><a href="https://www.fsrh.org" rel="noopener">fsrh.org</a><span class="rd"> \u2014 HRT is not contraception; contraception until 2 years after LMP if under 50, 1 year if 50 or over</span></li>'+
         '<li><b>NICE NG23 (POI section) and ESHRE \u2014 Evidence-based guideline: premature ovarian insufficiency (international, 2024)</b><span class="rd"> \u2014 two raised FSH readings 4\u20136 weeks apart (NG23), HRT to at least the average age of natural menopause, bone density monitoring</span></li>'+
         '<li><b>Women\u2019s Health Initiative (2002) and re-analyses</b><span class="rd"> \u2014 the origin of the risk controversy; hip fracture down 27% and vertebral fracture down 37%; used oral conjugated equine oestrogen with medroxyprogesterone, not modern transdermal body-identical regimens</span></li>'+
         '<li><b>E3N cohort \u2014 Fournier et al., 2008 (n\u224880,000)</b><span class="rd"> \u2014 transdermal oestrogen with micronised progesterone: little or no excess VTE risk and a possibly lower breast cancer signal (observational; NICE considers the evidence insufficient to establish a different breast-cancer risk by progestogen type)</span></li>'+
         '<li><b>MENOS 1 and MENOS 2 RCTs</b><span class="rd"> \u2014 CBT significantly reduces how much hot flushes bother women, even where frequency is unchanged</span></li>'+
         '<li><b>BNF and product SmPCs</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a> \u00b7 <a href="https://www.medicines.org.uk/emc" rel="noopener">medicines.org.uk/emc (current SmPCs)</a> \u00b7 <a href="https://gmmmg.nhs.uk" rel="noopener">Greater Manchester formulary (gmmmg.nhs.uk)</a><span class="rd"> \u2014 all named preparations and doses, fezolinetant LFT monitoring, tamoxifen\u2013SSRI interactions</span></li>'+
         '<li><b>Veoza (fezolinetant) 45 mg film-coated tablets \u2014 Summary of Product Characteristics (MHRA, PLGB 00166/0437)</b><span class="rd"> \u2014 dose, baseline and monthly LFTs for the first 3 months, ALT/AST and bilirubin thresholds, CYP1A2-inhibitor contraindication, hepatic and renal restrictions, pregnancy, breastfeeding and concomitant HRT</span></li>'+
         '</ul></div>'}

  foot:"Menopause, perimenopause and HRT prescribing in adults \u2014 NICE NG23 (updated April 2026) with BMS, MHRA 2020, FSRH 2023 and ESHRE POI guidance (international, 2024), the BMS 2024 unscheduled-bleeding guideline, and the NICE NG12 (updated April 2026) postmenopausal-bleeding interface. Diagnosis and management are merged on this page; there is no separate HRT/menopause pathway to cross-check. This is an educational guide, not a substitute for the current SmPC, local formulary or local cancer pathway. Verify all doses and licensing against the current BNF and SmPC before prescribing \u2014 testosterone in women is off-licence."
