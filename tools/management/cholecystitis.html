MG.render({
  icon:"🩺",
  title:"Cholecystitis and gallstone disease — the complete guide",

  stemTitle:"The whole of the GP decision is separating uncomplicated biliary colic — manage and refer electively — from acute cholecystitis and its dangerous cousins, cholangitis and gallstone pancreatitis, which are surgical emergencies",
  stemSub:"One page for the whole condition, from the first attack of right-upper-quadrant pain to life after cholecystectomy. <b>Fever, jaundice, rigors, persistent severe pain or systemic illness require urgent assessment</b>, and emergency admission (999 if unstable) for sepsis, haemodynamic instability, confusion, respiratory compromise, severe uncontrolled pain or suspected cholangitis or pancreatitis: persistent right-upper-quadrant pain with fever, local tenderness, vomiting or raised inflammatory markers suggests acute cholecystitis, fever with jaundice is suspected cholangitis until assessed, and epigastric pain boring through to the back is gallstone pancreatitis. Everything else is biliary colic — NSAID analgesia, liver function tests and an abdominal ultrasound, avoiding the foods that trigger attacks, and referral for laparoscopic cholecystectomy. <b>Asymptomatic stones in a normal gallbladder need nothing.</b> And <b>jaundice at 40 and over is a suspected pancreatic cancer referral unless an alternative diagnosis is established</b> \u2014 painful jaundice may still be malignant.",
  guideline:"NICE CG188 (2014) · NICE NG12 (updated April 2026) · BSG 2017 (bile duct stones) \u00b7 UK Working Party 2005 (pancreatitis, historical) \u00b7 local acute pancreatitis pathway \u00b7 SPCs \u00b7 Greater Manchester formulary",
  reviewed:"14 September 2026",
  nextReview:"14 March 2027",
  meta:[
    {t:"NICE CG188 — gallstone disease"},
    {t:"Fever, jaundice or rigors = urgent assessment; 999 if unstable"},

  ],
  lead:'<div class="mg-layers"><a href="#safety"><b>Red flags</b><small>Urgent assessment</small></a><a href="#differentiate"><b>Differentiate</b><small>Colic vs chole</small></a><a href="#community"><b>Community</b><small>Analgesia · USS</small></a><a href="#monitor"><b>Follow-up</b><small>Surgery · post-op</small></a><a href="#refer"><b>Refer</b><small>Emergency vs elective</small></a></div>',
  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"\u26a0 Acute cholecystitis \u2014 same-day surgical assessment", html:"Persistent right-upper-quadrant or epigastric pain, particularly with fever, local tenderness, vomiting or raised inflammatory markers, should prompt <b>same-day hospital assessment for possible acute cholecystitis</b>; ultrasound confirms gallstones and gallbladder inflammation. Pain beyond about 6 hours raises suspicion but does not diagnose it, and a positive Murphy's sign supports but does not confirm it — this is not biliary colic that has gone on a bit longer, and it is not manageable in the community. NICE CG188 expects laparoscopic cholecystectomy within 1 week of the diagnosis."},
    {tone:"red", h:"\u26a0 Suspected acute cholangitis \u2014 emergency assessment", html:"Charcot's triad: right-upper-quadrant pain plus fever or rigors plus jaundice. <b>Add confusion and hypotension and it is Reynolds' pentad.</b> Suspected acute cholangitis requires <b>emergency hospital assessment</b>. <b>Call 999 if there is sepsis, hypotension, confusion, severe rigors, respiratory compromise or other organ dysfunction.</b> Stable patients still need urgent admission for IV antibiotics, resuscitation and consideration of biliary drainage. The triad is useful but insensitive \u2014 do not wait for all three: fever with jaundice should be treated as suspected cholangitis until assessed, even if right-upper-quadrant pain is absent."},
    {tone:"red", h:"⚠ Gallstone pancreatitis — emergency admission", html:"Severe epigastric pain radiating to the back, with vomiting, in someone with gallstones → emergency admission. And obstructive jaundice — jaundice with dark urine and pale stools — needs same-day assessment for a bile duct stone; <b>at 40 and over, consider pancreatic cancer \u2014 painful jaundice may still be malignant</b>."},
    {tone:"blue", h:"Biliary colic: NSAID, LFTs and ultrasound, then refer", html:"For uncomplicated biliary colic, an NSAID is usually the preferred analgesic if there are no contraindications; paracetamol as an adjunct or alternative, and opioids reserved for severe pain when other options are contraindicated or ineffective. Offer an antiemetic when vomiting is present. Arrange <b>LFTs and an abdominal ultrasound</b> (NICE CG188); a raised ALP or bilirubin, or a dilated duct, points to a bile duct stone. Advise avoiding the foods that trigger attacks until surgery."},
    {tone:"green", h:"Laparoscopic cholecystectomy is the definitive treatment", html:"Offer referral for laparoscopic cholecystectomy for symptomatic gallbladder stones (NICE CG188). <b>Bile duct stones are cleared at or before the operation, by surgery or ERCP.</b> Asymptomatic gallbladder stones found incidentally in a normal gallbladder and biliary tree need no treatment unless symptoms develop."},
    {tone:"purple", h:"Jaundice at 40 and over \u2014 NICE NG12", html:"Aged 40 and over with jaundice \u2192 <b>suspected cancer pathway referral for pancreatic cancer</b> unless an alternative diagnosis has already been established. A palpable upper abdominal mass consistent with an enlarged gallbladder (Courvoisier's sign) → consider an urgent direct-access ultrasound for gallbladder cancer. Do not attribute jaundice to gallstones without imaging \u2014 painful jaundice may still be malignant."}
  ],
  pathwaySub:"Six steps, and the first one is triage rather than diagnosis.",
  pathway:[
    {title:"Screen for the acute complications first", html:"Fever, jaundice, rigors, persistent severe pain, peritonism or systemic illness \u2192 urgent hospital assessment; fever or rigors plus jaundice \u2192 emergency assessment as suspected cholangitis. Sepsis, hypotension, confusion, respiratory compromise or organ dysfunction \u2192 999.", alert:true},
    {title:"Assess — history, examination and first tests", html:"Pain pattern and duration, fatty-meal trigger, previous attacks, jaundice, weight loss; temperature, Murphy's sign, a palpable gallbladder; LFTs, FBC and CRP, and an abdominal ultrasound."},
    {title:"Name the gallstone syndrome and consider the mimics", html:"Biliary colic, acute cholecystitis, bile duct stone, pancreatitis or asymptomatic stones — and keep inferior MI, basal pneumonia, peptic ulcer, renal colic and hepatitis on the list."},
    {title:"Manage biliary colic in the community", html:"NSAID if not contraindicated, antiemetic if required, avoid trigger foods, written safety-net."},
    {title:"Refer for definitive treatment", html:"Symptomatic stones → laparoscopic cholecystectomy; bile duct stones \u2192 clearance by surgery or ERCP; jaundice at 40 and over \u2192 NG12 pathway unless an alternative diagnosis is established."},
    {title:"Follow up, including after surgery", html:"Most people are cured; pain, jaundice or fever after surgery needs urgent assessment for a retained stone, bile leak, pancreatitis or infection, though persistent pain is not automatically a surgical complication; persistent watery stools may be bile acid diarrhoea."}
  ],
  sections:[

    {id:"safety", nav:"Red flags", title:"Step 1 — red flags: the acute complications to admit",
     sub:"Gallstones become dangerous when a stone obstructs the cystic duct long enough to inflame the gallbladder, blocks the bile duct and lets infection in, or impacts at the ampulla and triggers pancreatitis.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"\ud83d\udd34 Suspected acute cholangitis \u2014 emergency assessment", html:"Right-upper-quadrant pain, fever or rigors, and jaundice (Charcot's triad); confusion and hypotension added make Reynolds' pentad and signal septic shock. Biliary obstruction lets gut organisms into a pressurised duct, so bacteraemia follows quickly. <b>Emergency hospital assessment; call 999 if there is sepsis, hypotension, confusion, severe rigors, respiratory compromise or other organ dysfunction.</b> Hospital treatment is IV antibiotics, resuscitation and urgent biliary drainage, usually by ERCP \u2014 the timing of drainage is a hospital decision based on severity and local access. The full triad is present in only a minority of confirmed cases, so do not wait for all three.", src:"International Tokyo Guidelines 2018 (TG18) \u2014 supplementary diagnostic context, not a NICE primary-care pathway"},
         {tone:"red", h:"🔴 Gallstone pancreatitis — emergency admission", html:"Severe epigastric or right-upper-quadrant pain radiating to the back, with vomiting, in someone known to have or likely to have gallstones. Acute pancreatitis is diagnosed in hospital using the clinical picture, pancreatic enzyme elevation (amylase or lipase at least three times the upper limit of normal) and/or characteristic imaging; two of the three recognised criteria are usually required. <b>Emergency admission.</b>", src:"International revised Atlanta classification 2012; local acute pancreatitis pathway"},
         {tone:"red", h:"🔴 Acute cholecystitis — same-day surgical admission", html:"Persistent right-upper-quadrant or epigastric pain, particularly when accompanied by fever, local tenderness, vomiting or raised inflammatory markers. Pain beyond about 6 hours raises suspicion but does not diagnose it; a positive Murphy's sign supports but does not confirm it. Ultrasound confirms gallstones and gallbladder inflammation (a thickened wall and fluid around it). <b>Same-day hospital or surgical assessment.</b>", src:"NICE CG188 (2014) — acute cholecystitis"},
         {tone:"red", h:"🔴 Perforation or gangrene", html:"Sudden severe generalised abdominal pain, peritonism or a rigid abdomen on a background of gallbladder pain, or an older, diabetic or immunosuppressed patient who looks septic with few local signs → <b>999</b>.", src:"Clinical practice; NICE CG188 (2014) — surgical management"},
         {tone:"amber", h:"🟠 Obstructive jaundice without fever — same day", html:"Jaundice, dark urine and pale stools with pain but no fever suggests a stone in the common bile duct \u2192 <b>same-day acute hepatobiliary or surgical assessment</b> with LFTs, renal function, clotting and imaging \u2014 not necessarily ambulance transfer if clinically stable; clotting may be deranged because vitamin K absorption falls when bile cannot reach the gut.", src:"BSG 2017 — Williams et al, Gut 2017 (bile duct stones)"},
         {tone:"purple", h:"\ud83d\udfe3 Jaundice at 40 and over \u2014 NG12 suspected cancer", html:"Aged 40 and over with jaundice \u2192 suspected cancer pathway referral for pancreatic cancer unless an alternative diagnosis has already been established. Painful jaundice may still be malignant and should not automatically be attributed to gallstones. A mass consistent with an enlarged gallbladder \u2192 consider urgent direct-access ultrasound for gallbladder cancer. A palpable, non-tender gallbladder in a jaundiced patient (Courvoisier's sign) is a clue to distal obstruction, not a rule that excludes stones.", src:"NICE NG12 (updated April 2026) — pancreatic and gallbladder cancer"}
       ]},
       {b:"why", html:"The GP must separate uncomplicated biliary colic — manage and refer electively — from acute cholecystitis and its dangerous cousins, cholangitis and gallstone pancreatitis, which are surgical emergencies. <b>Fever, jaundice, rigors, persistent severe pain or systemic illness require urgent assessment; 999 is for sepsis, haemodynamic instability, confusion, respiratory compromise or rapid deterioration.</b> Fever alone may be due to another infection. Cholangitis is the most time-critical: the obstructed, infected duct seeds the bloodstream and the patient can move from rigors to septic shock within hours, which is why a febrile, jaundiced patient needs emergency hospital assessment rather than an urgent outpatient letter. Jaundice at 40 and over needs an NG12 suspected-cancer referral unless an alternative diagnosis is established \u2014 and painful jaundice can still be malignant."}
     ]},

    {id:"assess", nav:"Assess", title:"Step 2 — assessment and investigations",
     sub:"History and examination sort the syndrome; LFTs and ultrasound confirm stones and show whether the bile duct is involved.",
     blocks:[
       {b:"table", head:["Area","What to establish","Why it matters"], rows:[
         ["<b>Pain</b>","Site (right upper quadrant or epigastrium), onset, whether it is steady rather than truly colicky, duration, radiation to the right shoulder tip, scapula or back, trigger (often a fatty or large meal), previous identical episodes","Minutes to a few hours and settling = biliary colic; persistent pain, especially with fever, tenderness, vomiting or raised inflammatory markers = think cholecystitis (duration alone does not diagnose it); boring through to the back = think pancreatitis"],
         ["<b>Associated features</b>","Nausea and vomiting, fever or rigors, jaundice, dark urine, pale stools, itch, weight loss, change in appetite","Fever = inflammation or infection; jaundice = bile duct involvement; weight loss, or jaundice at 40 and over = cancer pathway"],
         ["<b>Risk factors</b>","Female sex, obesity, rapid weight loss (including after bariatric surgery or very-low-calorie diets), pregnancy, haemolytic disorders (pigment stones), long-term parenteral nutrition, fibrates","Supports the diagnosis; never a reason to skip the mimics in someone who does not fit the stereotype"],
         ["<b>Medicines</b>","Fibrates (review in symptomatic or active gallbladder disease and check the current product SPC), NSAID tolerance, anticoagulants, renal function before an NSAID","Shapes analgesia and flags a drug to stop"],
         ["<b>Examination</b>","Temperature, pulse, BP, sclera and skin for jaundice; right-upper-quadrant tenderness; Murphy's sign; Boas's sign (an area of skin hyperaesthesia below the right scapula, occasionally present in cholecystitis); a palpable gallbladder; peritonism; chest examination; an ECG if the pain could be cardiac","A positive Murphy's sign supports cholecystitis but does not confirm it (assess symptoms, observations, inflammatory markers and imaging); a palpable non-tender gallbladder with jaundice is a clue to distal obstruction; basal crackles = pneumonia"]
       ]},
       {b:"table", head:["Investigation","Use","Interpretation"], rows:[
         ["<b>LFTs</b>","Everyone with suspected gallstone disease (NICE CG188)","A cholestatic pattern (raised ALP, GGT and bilirubin) suggests bile duct obstruction; normal LFTs make a duct stone less likely, but stones can pass intermittently and LFTs may subsequently normalise"],
         ["<b>Abdominal ultrasound</b>","First-line imaging for suspected gallstones (NICE CG188)","Shows gallbladder stones, wall thickening and fluid in cholecystitis, and the bile duct diameter"],
         ["<b>FBC and CRP</b>","If inflammation is suspected","A raised white count and CRP support cholecystitis or cholangitis — admission, not outpatient work-up"],
         ["<b>Amylase or lipase</b>","Epigastric pain radiating to the back","Suspected pancreatitis needs hospital assessment; serum lipase or amylase at least three times the upper limit of normal is one of three criteria (with typical pain and characteristic imaging), and two of the three are usually required (revised Atlanta classification 2012, international) \u2014 a raised enzyme alone does not establish the diagnosis"],
         ["<b>Clotting and renal function</b>","Jaundiced patients \u2014 alongside urgent hepatobiliary assessment","Obstructive jaundice can prolong the INR through vitamin K malabsorption"],
         ["<b>MRCP</b>","Secondary care — ultrasound has not shown a duct stone but the duct is dilated and/or LFTs are abnormal (NICE CG188)","The non-invasive test of choice for suspected bile duct stones"],
         ["<b>Endoscopic ultrasound</b>","Secondary care — if MRCP does not allow a diagnosis (NICE CG188)","More sensitive than MRCP for small duct stones"],
         ["<b>CT abdomen</b>","Secondary care, or NG12 direct access","Pancreatitis complications, alternative diagnoses, and pancreatic cancer in the NG12 age and symptom groups \u2014 follow the NG12 pathway and do not rely on ultrasound alone where pancreatic cancer is suspected"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"🔎 Murphy's sign — useful, not decisive", html:"Fingers under the right costal margin in the mid-clavicular line; the patient takes a deep breath and <b>stops abruptly</b> as the inflamed gallbladder descends onto the hand. The arrested breath, not simple tenderness, is the positive sign. A positive sign raises the probability of cholecystitis only modestly (positive likelihood ratio around 2.8) A positive sign supports acute cholecystitis but does not confirm it; a negative sign does not exclude it, particularly in older people, obesity or immunosuppression \u2014 assess symptoms, observations, inflammatory markers and imaging.", src:"Trowbridge et al, JAMA 2003 \u2014 Does this patient have acute cholecystitis? (one diagnostic study)"},
         {tone:"blue", h:"🔎 Courvoisier's sign", html:"A palpable, non-tender gallbladder in a jaundiced patient suggests distal obstruction by a tumour of the pancreatic head or bile duct, because a gallbladder scarred by years of stones rarely distends. Use it as a clue to distal obstruction, not a diagnostic rule \u2014 it is not reliable enough to exclude stones.", src:"NICE NG12 (updated April 2026) — gallbladder and pancreatic cancer"},
         {tone:"blue", h:"🔎 How common are duct stones?", html:"Stones in the common bile duct are estimated to be present in around 10–20% of people with symptomatic gallstones, and can cause pain, jaundice, cholangitis and pancreatitis — which is why LFTs and the duct diameter matter on every scan.", src:"BSG 2017 — Williams et al, Gut 2017"},
         {tone:"cream", h:"🩺 Timing of the scan", html:"Uncomplicated colic: request the ultrasound and LFTs promptly from primary care. Any red flag: do not wait for community imaging — the hospital will scan.", src:"NICE CG188 (2014) — diagnosis"}
       ]}
     ]},

    {id:"differentiate", nav:"Differentiate", title:"Step 3 — differential diagnosis",
     sub:"Right-upper-quadrant and epigastric pain is not specific enough to skip the cardiac, respiratory and renal thought, especially in an older patient with risk factors.",
     blocks:[
       {b:"table", head:["Condition","Discriminating features","Next step"], rows:[
         ["<b>Biliary colic</b>","Episodic steady RUQ or epigastric pain for minutes to a few hours, often after a fatty meal, may radiate to the right scapula; no fever; settles; normal between attacks; Murphy's negative","NSAID, LFTs and ultrasound, avoid trigger foods, refer for cholecystectomy if stones confirmed"],
         ["<b>Acute cholecystitis</b>","Persistent pain (duration alone does not diagnose it), fever, anorexia, vomiting, positive Murphy's sign, raised CRP and white count. Acalculous cholecystitis gives the same picture without stones, mainly in critically ill people","Same-day hospital/surgical assessment \u2014 do not manage with oral antibiotics and outpatient imaging alone; early laparoscopic cholecystectomy within 1 week of diagnosis (NICE CG188)"],
         ["<b>Common bile duct stone</b>","Pain with jaundice, dark urine, pale stools, cholestatic LFTs and a dilated duct; no fever unless cholangitis has developed","Same-day assessment; MRCP or EUS, then clearance by ERCP or surgery"],
         ["<b>Ascending cholangitis</b>","Pain, fever or rigors, and jaundice; may be confused or hypotensive","Emergency hospital assessment; 999 if septic, hypotensive, confused or otherwise unstable"],
         ["<b>Gallstone pancreatitis</b>","Severe epigastric pain radiating to the back, vomiting, epigastric tenderness; raised amylase or lipase in hospital","Emergency admission"],
         ["<b>Asymptomatic stones</b>","Incidental finding on imaging, normal gallbladder and biliary tree, no typical pain","Reassure — no treatment unless symptoms develop (NICE CG188)"],
         ["<b>Inferior myocardial infarction or ACS</b>","Epigastric pain with sweating, breathlessness, exertional history, cardiovascular risk factors","ECG; 999 if suspected"],
         ["<b>Right basal pneumonia</b>","Cough, fever, breathlessness, pleuritic pain, focal chest signs","Treat as pneumonia; assess severity"],
         ["<b>Peptic ulcer or gastritis</b>","Epigastric burning related to meals, NSAID or aspirin use, dyspepsia; perforation causes sudden peritonism","Manage as dyspepsia; perforation = 999"],
         ["<b>Renal colic or pyelonephritis</b>","Loin pain to groin, haematuria, dysuria, fever with loin tenderness","Urinalysis; manage per renal pathway"],
         ["<b>Hepatitis</b>","Malaise, anorexia, tender liver, hepatitic (ALT-predominant) LFTs, risk factors or alcohol","Hepatitis screen; see the abnormal LFTs pathway"],
         ["<b>Pancreatic or biliary cancer</b>","Jaundice (painless or painful), weight loss, new diabetes, a palpable gallbladder, age over 60","NICE NG12 routes — see Refer"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"🚑 Admit and rest the gut", html:"Acute cholecystitis needs admission — IV fluids, analgesia, an antiemetic and antibiotics are supportive while the early operation is arranged. Antibiotics are hospital-led, follow local antimicrobial guidance and microbiology advice, and do not replace cholecystectomy or biliary drainage.", src:"Clinical practice; NICE CG188 (2014) — early surgery"},
         {tone:"green", h:"🥗 Food triggers in biliary colic", html:"Advise people to avoid food and drink that trigger their symptoms until the gallbladder or stones are removed — fatty or large meals are the usual culprits.", src:"NICE CG188 (2014) — information and support"},
         {tone:"green", h:"⚖️ Risk factors", html:"Address weight gradually over the longer term; rapid weight loss itself promotes stone formation.", src:"Clinical practice; NICE CG188 (2014)"},
         {tone:"blue", h:"💬 Why this split matters", html:"Colic and cholecystitis need different places of care, not different doses: colic is managed at home and referred electively; cholecystitis is admitted and operated on early.", src:"NICE CG188 (2014)"}
       ]}
     ]},

    {id:"community", nav:"Community", title:"Step 4 — biliary colic in the community",
     sub:"Analgesia, investigation and a clear plan while the referral goes through.",
     blocks:[
       {b:"table", head:["Step","What","When"], rows:[
         ["<b>Step 1 — analgesia and antiemetic</b>","For uncomplicated biliary colic, an NSAID is usually the preferred analgesic if there are no contraindications. Paracetamol as an adjunct or an alternative where NSAIDs are unsuitable. Opioids reserved for severe pain when other options are contraindicated or ineffective. An antiemetic when vomiting is present. If the patient is vomiting or unable to take oral medication, pain is persistent or severe, or any red flag is present \u2192 urgent clinical assessment rather than repeated parenteral analgesia in primary care","<b>Acute colic, not septic</b>"],
         ["<b>Step 2 — investigate</b>","LFTs and an abdominal ultrasound; FBC and CRP if inflammation is suspected","<b>Promptly, to confirm stones and check the duct</b>"],
         ["<b>Step 3 — interim measures</b>","Avoid trigger foods; plan for breakthrough pain (an NSAID with food, and a PPI if a longer course is needed); written safety-net for fever, jaundice or persistent pain","<b>While awaiting referral</b>"],
         ["<b>Step 4 — refer for cholecystectomy</b>","Laparoscopic cholecystectomy for symptomatic gallbladder stones; bile duct clearance if duct stones are found","<b>Symptomatic stones — definitive treatment</b>"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"cream", h:"💊 Why an NSAID first", html:"In a meta-analysis of 11 randomised trials (1,076 patients), NSAIDs gave complete pain relief more often than placebo, and relieved pain better than antispasmodics and as well as opioids. A lower complication rate was reported, but preventing progression to cholecystitis is not a NICE treatment recommendation.", src:"Colli et al, Aliment Pharmacol Ther 2012 — NSAIDs in biliary colic"},
         {tone:"amber", h:"⚠️ NSAID cautions", html:"Check for renal impairment; peptic ulcer disease or gastrointestinal bleeding; anticoagulants or antiplatelets; heart failure or significant cardiovascular disease; uncontrolled hypertension; pregnancy; NSAID hypersensitivity or asthma; older or frail patients. Add gastroprotection for a longer course.", src:"BNF — NSAIDs, cautions and contraindications"},
         {tone:"cream", h:"💊 Antispasmodics", html:"Offer an antiemetic when vomiting is present. An antispasmodic (such as hyoscine butylbromide) may be considered, but it is less effective than an NSAID and <b>should not delay assessment for persistent pain or suspected complication</b>. Check contraindications (urinary retention risk, narrow-angle glaucoma, gastrointestinal obstruction), check anticoagulant status before any intramuscular injection, and verify dose and route against the current product information and local formulary.", src:"Current SPC (emc); Greater Manchester formulary; Colli et al, Aliment Pharmacol Ther 2012"},
         {tone:"cream", h:"\ud83d\udc89 Vomiting or unable to take oral medication", html:"If the patient is vomiting or unable to take oral medication, arrange urgent clinical assessment rather than relying on repeated parenteral analgesia in primary care. Any parenteral route should follow a locally approved practice protocol and the current SPC.", src:"Current SPC (emc); local practice protocol"},
         {tone:"amber", h:"⚠️ When the pain will not settle", html:"Persistent severe pain, or any fever, jaundice or vomiting that stops fluids \u2192 same-day surgical assessment rather than a second dose and home. Symptomatic treatment must not delay referral.", src:"NICE CG188 (2014); clinical practice"},
         {tone:"amber", h:"⚠️ No antibiotics for colic", html:"Uncomplicated biliary colic is not an infection. Do not prescribe antibiotics for uncomplicated biliary colic. A patient whose picture needs antibiotics has cholecystitis or cholangitis and needs admission, not an oral course at home: antibiotics for these are hospital-led, follow local antimicrobial guidance, microbiology advice and source-control planning, and do not replace biliary drainage or cholecystectomy where indicated.", src:"NICE CG188 (2014) — acute cholecystitis managed in hospital"}
       ]},
       {b:"warn", html:"<b>Asymptomatic gallbladder stones do not need surgery.</b> Cholecystectomy should not be offered solely because ultrasound shows gallstones if the pain is atypical and another diagnosis is more likely \u2014 dyspepsia, reflux, functional pain and IBS often persist after surgery. Do not manage acute cholecystitis, cholangitis or pancreatitis in the community — these are admissions."}
     ]},

    {id:"surgery", nav:"Surgery", title:"Step 5 — definitive treatment and its timing",
     sub:"The operation is the cure; the timing depends on which syndrome the patient has.",
     blocks:[
       {b:"table", head:["Situation","Definitive treatment","Timing"], rows:[
         ["<b>Symptomatic gallbladder stones (biliary colic)</b>","Laparoscopic cholecystectomy","Elective referral (NICE CG188)"],
         ["<b>Acute cholecystitis</b>","Early laparoscopic cholecystectomy; percutaneous cholecystostomy if the patient is too unwell for surgery","Within 1 week of diagnosis (NICE CG188)"],
         ["<b>Common bile duct stones</b>","Bile duct clearance plus laparoscopic cholecystectomy for symptomatic or asymptomatic duct stones \u2014 surgically at the time of the operation, or by ERCP before or at the time of it; temporary stenting only when definitive clearance cannot be achieved. MRCP or EUS (not diagnostic ERCP) when the diagnosis is uncertain","Jaundice from duct stones needs urgent specialist management (local standards have historically targeted ERCP within 72 hours); cholangitis or severe obstruction needs more urgent drainage according to severity (NICE CG188; BSG 2017)"],
         ["<b>Mild gallstone pancreatitis</b>","Laparoscopic cholecystectomy","Generally during the same admission once the patient has recovered sufficiently; if not possible, a clearly documented early interval operation"],
         ["<b>Severe gallstone pancreatitis or peripancreatic collections</b>","Cholecystectomy under specialist management","May need delaying until the acute inflammatory process has settled"],
         ["<b>Gallstone pancreatitis without cholangitis</b>","Urgent ERCP is indicated for gallstone pancreatitis with cholangitis or persistent biliary obstruction, not for uncomplicated gallstone pancreatitis alone","Specialist decision (AoMRC Evidence-Based Interventions)"],
         ["<b>Asymptomatic gallbladder stones</b>","None \u2014 reassure; no surgery or follow-up if the gallbladder and biliary tree are normal and there are no compatible symptoms","Only if symptoms develop (NICE CG188)"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"✅ Laparoscopic cholecystectomy", html:"The standard operation for symptomatic stones, commonly done as a day case or with one night in hospital. Most people return to light activity within a couple of weeks.", src:"NICE CG188 (2014) — symptomatic gallbladder stones"},
         {tone:"blue", h:"ℹ️ Not fit for surgery", html:"Ursodeoxycholic acid is <b>not a routine alternative to cholecystectomy</b> for symptomatic gallstones. It has limited, highly selected use, with slow or incomplete dissolution and frequent recurrence after treatment. Any use should be specialist-directed \u2014 do not offer it routinely in primary care for patients unfit for surgery.", src:"Ursodeoxycholic acid SPC"},
         {tone:"amber", h:"⚠️ Bile duct injury", html:"The most feared complication of cholecystectomy. It presents after surgery as a bile leak with pain, fever, abdominal distension or jaundice — refer back urgently to the operating team or hepatobiliary centre.", src:"NICE CG188 (2014) — surgical management; clinical practice"},
         {tone:"blue", h:"🏥 How hospitals grade severity", html:"<b>Acute cholecystitis (Tokyo TG18, international):</b> grade I mild — no organ dysfunction; grade II moderate — white count above 18 × 10⁹/L, a palpable tender right-upper-quadrant mass, symptoms for more than 72 hours, or marked local inflammation (gangrene, abscess, biliary peritonitis, emphysematous cholecystitis); grade III severe — cardiovascular, neurological, respiratory, renal, hepatic or haematological dysfunction. <b>Acute pancreatitis (revised Atlanta 2012, international):</b> mild — no organ failure or complications; moderately severe — organ failure resolving within 48 hours or local complications; severe — organ failure persisting beyond 48 hours. Useful context for a referral phone call; the GP decision is still admission.", src:"Yokoe et al, J Hepatobiliary Pancreat Sci 2018 (TG18); Banks et al, Gut 2013 (revised Atlanta)"},
         {tone:"cream", h:"📝 The referral letter", html:"State the episode type (colic, cholecystitis, pancreatitis or duct stone), ultrasound and LFT results, comorbidities, anticoagulants, and anything that would change timing — so that a cholecystitis episode is treated as a within-1-week operation rather than a routine list. Include the severity grade if the hospital has given one.", src:"NICE CG188 (2014); QS104 (2015) — timely surgery"}
       ]},
       {b:"why", html:"Operating early after acute cholecystitis avoids the recurrent attacks, readmissions and spreading infection that accumulate while a patient waits for an interval operation, which is why NICE CG188 sets a 1-week window from diagnosis. After gallstone pancreatitis the logic is the same: until the gallbladder is removed, another stone can pass and trigger a second, sometimes more severe, attack — hence same-admission surgery once recovered for mild disease, or a clearly documented early interval operation if that is not possible. The international Tokyo guidelines favour surgery within 72 hours of symptom onset for grade I–II disease in fit patients; the UK standard remains NICE CG188's 1-week window from diagnosis, and that is the figure to use in a referral."}
     ]},

    {id:"aftercare", nav:"After surgery", title:"Step 6 — after cholecystectomy",
     sub:"Most people are cured. The minority who are not need a structured rethink rather than reassurance.",
     blocks:[
       {b:"table", head:["Problem","Clues","Action"], rows:[
         ["<b>Retained or recurrent bile duct stone</b>","Pain, jaundice or fever weeks to months after surgery; cholestatic LFTs; dilated duct","Fever with jaundice = emergency assessment for cholangitis (999 if unstable); otherwise urgent investigation via hepatobiliary referral (MRCP, then ERCP if therapeutic)"],
         ["<b>Bile leak or duct injury</b>","Pain, fever, distension or jaundice in the days after surgery","Urgent same-day contact with the operating/HPB team"],
         ["<b>Bile acid diarrhoea</b>","Persistent watery diarrhoea, often urgent, after cholecystectomy","Exclude other causes. Where available, investigate with SeHCAT or serum C4 according to the local gastroenterology pathway; if testing is unavailable, discuss empirical bile-acid sequestrant treatment with gastroenterology or follow the local pathway"],
         ["<b>Persistent dyspepsia or pain</b>","Symptoms that were never biliary — reflux, peptic ulcer, IBS, functional pain","Reassess rather than assuming a surgical complication: retained stone, bile leak, pancreatitis, wound or intra-abdominal infection, peptic disease, reflux, functional bowel disorder, musculoskeletal pain"],
         ["<b>Diet</b>","Worry about fatty food","No need to avoid foods that previously triggered symptoms once the gallbladder is removed (NICE CG188)"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"🔬 Bile acid diarrhoea — test, then treat", html:"Persistent watery diarrhoea after cholecystectomy may be bile acid diarrhoea, but other causes should be excluded \u2014 persistent diarrhoea still needs an appropriate chronic diarrhoea assessment. SeHCAT is not universally available, and NICE HTG598 does not recommend routine SeHCAT use (insufficient evidence on long-term outcomes), although BSG supports testing where available. Where available, investigate with SeHCAT or serum C4 per the local gastroenterology pathway; if unavailable, discuss empirical bile-acid sequestrant treatment with gastroenterology or follow the local pathway.", src:"NICE HTG598 (SeHCAT); BSG 2018 \u2014 Arasaradnam et al, Gut 2018 (chronic diarrhoea)"},
         {tone:"cream", h:"💊 Colestyramine", html:"Colestyramine binds other medicines \u2014 separate administration according to the current product information. It may reduce absorption of fat-soluble vitamins; poor palatability and constipation are common. Consider colesevelam or colestipol if poorly tolerated, according to the local formulary.", src:"Colestyramine SPC; Greater Manchester formulary"}
       ]}
     ]},

    {id:"lifestyle", nav:"Self-care", title:"Diet, weight and prevention",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"🥗 Before surgery", html:"Avoid the food and drink that trigger your attacks — for most people, fatty or large meals. A low-fat diet does not prevent or dissolve existing stones, and attacks usually recur until the gallbladder is removed.", src:"NICE CG188 (2014) — information for people with gallstones"},
         {tone:"green", h:"🍽️ After surgery", html:"A normal diet can be resumed; there is no need to keep avoiding previous trigger foods.", src:"NICE CG188 (2014)"},
         {tone:"green", h:"⚖️ Weight", html:"Gradual, sustainable weight loss rather than rapid loss \u2014 crash diets and rapid loss after bariatric surgery increase gallstone formation.", src:"Clinical practice; NICE CG188 (2014)"},
         {tone:"green", h:"🚶 Activity and fibre", html:"General advice that also suits gallstone disease: at least 150 minutes of moderate activity a week, and a diet working towards 30 g of fibre a day. Cohort studies link activity and fibre to fewer gallstones, but neither dissolves stones that are already there.", src:"UK Chief Medical Officers' physical activity guidelines (2019, updated July 2026), in line with WHO 2020; SACN Carbohydrates and Health (2015)"},
         {tone:"green", h:"📓 Finding the triggers", html:"A short food and symptom diary helps people identify their own triggers — usually fatty or large meals, sometimes a big meal after a long gap — and plan around them while they wait.", src:"Clinical practice; NICE CG188 (2014) — avoid trigger foods"},
         {tone:"blue", h:"ℹ️ After bariatric surgery", html:"Rapid weight loss after bariatric surgery increases gallstone formation. Some bariatric units prescribe ursodeoxycholic acid for the first months after surgery; trial evidence on preventing symptomatic stones is mixed, so this stays a specialist/bariatric pathway decision, not a routine GP prescription.", src:"Clinical practice; ursodeoxycholic acid SPC"},
         {tone:"amber", h:"💊 Fibrates", html:"Review fibrate treatment in patients with symptomatic or active gallbladder disease and check the current product SPC before continuing or prescribing. Discuss alternative lipid management where appropriate.", src:"Current fenofibrate SPC"}
       ]}
     ]},

    {id:"monitor", nav:"Follow-up", title:"Review, safety-netting and the surgical pathway",
     blocks:[
       {b:"dl", rows:[
         ["<b>Awaiting ultrasound or referral</b>","Symptom control and a written plan: seek urgent same-day assessment if there is fever, rigors, jaundice, dark urine with pale stools, persistent severe pain or persistent vomiting; call 999 if confused, faint, breathless or rapidly deteriorating"],
         ["<b>After diagnosis</b>","<b>Symptomatic stones → elective laparoscopic cholecystectomy.</b> Check the referral has been actioned and that analgesia is adequate"],
         ["<b>New jaundice in someone with known stones</b>","Same-day LFTs and imaging via the acute team; fever with jaundice = emergency assessment as suspected cholangitis (999 if unstable); jaundice at 40 and over without an established alternative diagnosis = NG12 pathway"],
         ["<b>Post-cholecystectomy</b>","Most symptoms resolve; reassess ongoing pain, jaundice or fever as a possible retained stone or leak, and persistent watery stools as possible bile acid diarrhoea"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 Fever, rigors or jaundice", html:"\"If you get a fever, shivering attacks, or yellow eyes or skin, get urgent medical help the same day. Call 999 if you feel very unwell, confused, faint or breathless.\"", src:"International Tokyo Guidelines 2018 (TG18) — cholangitis"},
         {tone:"red", h:"🔴 Severe persistent pain", html:"\"Pain that doesn't settle within a few hours, or severe pain going through to your back with vomiting — seek urgent help.\"", src:"NICE CG188 (2014); BSG-endorsed UK Working Party 2005"},
         {tone:"amber", h:"🟠 Pale stools, dark urine", html:"\"Pale stools with dark urine means a possible blockage — contact us the same day.\"", src:"BSG 2017 — Williams et al, Gut 2017"},
         {tone:"green", h:"🥗 While you wait", html:"\"Avoid the foods that set off your attacks while you're waiting for the operation.\"", src:"NICE CG188 (2014)"}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral — emergency versus elective",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999 / emergency admission", html:"Haemodynamic instability, sepsis, hypotension, confusion, respiratory compromise or other organ dysfunction; Reynolds' pentad; rapidly deteriorating cholangitis or pancreatitis; suspected perforation.", src:"Clinical practice; local hospital protocols"},
         {tone:"red", h:"Emergency hospital assessment", html:"Suspected acute cholangitis (fever or rigors plus jaundice) in a stable patient \u2014 urgent biliary drainage may be required; suspected gallstone pancreatitis (severe epigastric pain radiating to the back with vomiting); peritonism. Emergency management follows local hospital and antimicrobial protocols.", src:"International Tokyo Guidelines 2018 (TG18, supplementary); local acute pancreatitis pathway"},
         {tone:"red", h:"Same-day surgical or hepatobiliary", html:"Suspected acute cholecystitis; jaundice with a suspected duct stone but no sepsis (acute hepatobiliary assessment); persistent severe right-upper-quadrant or epigastric pain despite analgesia.", src:"NICE CG188 (2014); BSG 2017"},
         {tone:"blue", h:"Upper-GI or general surgery — elective", html:"Symptomatic gallstones or recurrent biliary colic → laparoscopic cholecystectomy.", src:"NICE CG188 (2014)"},
         {tone:"amber", h:"Gastroenterology or hepatobiliary — urgent", html:"<b>Suspected bile duct stones without sepsis (for MRCP, EUS or ERCP), a retained stone after surgery, or diagnostic uncertainty.</b>", src:"NICE CG188 (2014); BSG 2017 — Williams et al, Gut 2017"},
         {tone:"purple", h:"Suspected cancer · NICE NG12 (updated April 2026)", html:"<b>Aged 40 and over with jaundice</b> \u2192 suspected cancer pathway referral for pancreatic cancer unless an alternative diagnosis has already been established (painful jaundice may still be malignant). <b>Aged 60 and over with weight loss</b> plus any of diarrhoea, back pain, abdominal pain, nausea, vomiting, constipation or new-onset diabetes → consider an urgent direct-access CT (or ultrasound if CT is not available) for pancreatic cancer. <b>An upper abdominal mass consistent with an enlarged gallbladder</b> → consider an urgent direct-access ultrasound for gallbladder cancer.", src:"NICE NG12 (updated April 2026) — pancreatic and gallbladder cancer"},
         {tone:"cream", h:"GP management", html:"Triage of the acute complications, differentiating colic from cholecystitis, NSAID analgesia, LFTs and ultrasound, advice on trigger foods, the surgical referral and post-operative review all belong here. Related pages: <a href='ppi-prescribing.html'>PPI prescribing</a> · <a href='gord.html'>GORD</a> · <a href='fatty-liver.html'>fatty liver disease</a> · <a href='../algorithms/abnormal-lfts.html'>abnormal LFTs pathway</a> · <a href='../algorithms/jaundice.html'>jaundice pathway</a>.", src:"NICE CG188 (2014)"}
       ]},
       {b:"say", html:"Your symptoms fit gallstones. When a stone briefly blocks the gallbladder you get that severe pain after a meal — we'll arrange blood tests and a scan, and anti-inflammatory painkillers are usually the preferred treatment for the attacks if they're safe for you. The lasting fix is a keyhole operation to remove the gallbladder. Until then, steer clear of the foods that set it off. But if you get a fever, shivers, or yellow eyes, get urgent medical help the same day \u2014 and call 999 if you feel very unwell, confused or faint."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 46-year-old woman has had three episodes of severe right-upper-quadrant pain after takeaway meals over two months, each lasting about two hours then settling. Today the pain has been <b>constant for eight hours</b>, she <b>feels hot and shivery</b>, and she looks unwell. <b>Temperature 38.2 °C</b>, tender RUQ with a <b>positive Murphy's sign</b>. She is not jaundiced. She says she \"just needs stronger painkillers to get through it\" and has childcare to arrange.", src:"NICE CG188 (2014) — acute cholecystitis"},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Recognises that this is no longer biliary colic — persistent pain with fever, systemic illness and a positive Murphy's sign makes acute cholecystitis likely \u2014 and arranges SAME-DAY surgical admission rather than analgesia and an outpatient scan; <b>does not accept the patient's framing of the consultation</b>, and explains clearly why this episode is different from the previous three; <b>checks specifically for jaundice and rigors to exclude cholangitis</b>, knowing fever with jaundice would mean suspected cholangitis needing emergency hospital assessment (999 if unstable); considers the mimics — inferior MI and right basal pneumonia — before committing; addresses the childcare barrier practically rather than letting it defer admission, which is the real-world obstacle in this case; <b>does not manage acute cholecystitis in the community</b>; and explains that an early laparoscopic cholecystectomy — within a week — is the likely next step, so the admission is a route to the definitive fix rather than an alternative to it.", src:"NICE CG188 (2014); International Tokyo Guidelines 2018 (TG18)"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE CG188 (2014) — Gallstone disease: diagnosis and management</b><br><a href="https://www.nice.org.uk/guidance/cg188" rel="noopener">nice.org.uk/guidance/cg188</a><span class="rd"> — LFTs and ultrasound for suspected gallstone disease; MRCP when ultrasound shows no duct stone but the duct is dilated or LFTs are abnormal, and EUS if MRCP is not diagnostic; reassurance for asymptomatic gallbladder stones; laparoscopic cholecystectomy for symptomatic stones and within 1 week of diagnosing acute cholecystitis; bile duct clearance at or before surgery; advice to avoid trigger foods until the gallbladder is removed</span></li>'+
         '<li><b>NICE QS104 (2015) — Gallstone disease quality standard</b><br><a href="https://www.nice.org.uk/guidance/qs104" rel="noopener">nice.org.uk/guidance/qs104</a><span class="rd"> — early laparoscopic cholecystectomy for acute cholecystitis</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — jaundice at 40 and over (pancreatic cancer pathway referral); weight loss at 60 and over with the listed symptoms (urgent direct-access CT); a mass consistent with an enlarged gallbladder (urgent direct-access ultrasound)</span></li>'+
         '<li><b>BSG 2017 — Williams E, et al. Updated guideline on the management of common bile duct stones. Gut 2017;66:765–82</b><br><a href="https://pubmed.ncbi.nlm.nih.gov/28122906/" rel="noopener">pubmed.ncbi.nlm.nih.gov/28122906</a><span class="rd"> — prevalence of duct stones in symptomatic gallstone disease, MRCP and EUS, ERCP clearance</span></li>'+
         '<li><b>UK Working Party on Acute Pancreatitis (BSG-endorsed). UK guidelines for the management of acute pancreatitis. Gut 2005;54(Suppl 3):iii1–9</b><br><a href="https://pubmed.ncbi.nlm.nih.gov/15831893/" rel="noopener">pubmed.ncbi.nlm.nih.gov/15831893</a><span class="rd"> \u2014 historical context only; follow a current local acute pancreatitis pathway (same-admission cholecystectomy for mild gallstone pancreatitis once recovered)</span></li>'+
         '<li><b>Academy of Medical Royal Colleges — Evidence-Based Interventions: early ERCP in acute gallstone pancreatitis without cholangitis</b><br><a href="https://ebi.aomrc.org.uk/interventions/early-endoscopic-retrograde-cholangiopancreatography-ercp-in-acute-gallstone-pancreatitis-without-cholangitis/" rel="noopener">ebi.aomrc.org.uk</a><span class="rd"> — early ERCP not recommended without cholangitis or obstruction</span></li>'+
         '<li><b>NICE HTG598 \u2014 SeHCAT for diagnosing bile acid diarrhoea</b><br><a href="https://www.nice.org.uk" rel="noopener">nice.org.uk</a><span class="rd"> \u2014 routine SeHCAT use not recommended (insufficient evidence on long-term outcomes)</span></li>'+
         '<li><b>BSG 2018 \u2014 Arasaradnam RP, et al. Guidelines for the investigation of chronic diarrhoea in adults. Gut 2018</b><span class="rd"> — SeHCAT or C4 testing for bile acid diarrhoea and bile acid sequestrant treatment</span></li>'+
         '<li><b>Colli A, et al. Meta-analysis: nonsteroidal anti-inflammatory drugs in biliary colic. Aliment Pharmacol Ther 2012;35:1370–8</b><span class="rd"> \u2014 NSAIDs versus placebo, antispasmodics and opioids</span></li>'+
         '<li><b>Trowbridge RL, et al. Does this patient have acute cholecystitis? JAMA 2003;289:80–6</b><span class="rd"> \u2014 the modest diagnostic value of Murphy\u2019s sign; a useful diagnostic study, not the sole authority for the acute cholecystitis pathway</span></li>'+
         '<li><b>Revised Atlanta classification of acute pancreatitis 2012 (international) — Banks PA, et al. Gut 2013;62:102–11</b><span class="rd"> — the threefold amylase or lipase diagnostic threshold</span></li>'+
         '<li><b>Tokyo Guidelines 2018 (international) — Kiriyama S, et al. J Hepatobiliary Pancreat Sci 2018</b><span class="rd"> \u2014 acute cholangitis criteria; Charcot\u2019s triad is specific but insensitive. Supplementary diagnostic and severity context, not a NICE primary-care pathway</span></li>'+
         '<li><b>Tokyo Guidelines 2018 (international) — Yokoe M, et al. Diagnostic criteria and severity grading of acute cholecystitis. J Hepatobiliary Pancreat Sci 2018;25:41–54</b><br><a href="https://pubmed.ncbi.nlm.nih.gov/29032636/" rel="noopener">pubmed.ncbi.nlm.nih.gov/29032636</a><span class="rd"> — grade I–III severity of acute cholecystitis</span></li>'+
         '<li><b>Summaries of Product Characteristics (emc) and the Greater Manchester formulary</b><br><a href="https://www.medicines.org.uk/emc" rel="noopener">medicines.org.uk/emc</a> \u00b7 <a href="https://www.greatermanchesterformulary.nhs.uk" rel="noopener">greatermanchesterformulary.nhs.uk</a><span class="rd"> \u2014 drug-specific dosing, routes and contraindications (NSAIDs, antispasmodics, colestyramine, fibrates)</span></li>'+
         '<li><b>UK Chief Medical Officers’ Physical Activity Guidelines (2019, updated July 2026)</b><br><a href="https://www.gov.uk/government/publications/physical-activity-guidelines-uk-chief-medical-officers-report" rel="noopener">gov.uk</a><span class="rd"> — 150 minutes of moderate activity a week</span></li>'+
         '<li><b>SACN — Carbohydrates and Health (2015)</b><br><a href="https://www.gov.uk/government/publications/sacn-carbohydrates-and-health-report" rel="noopener">gov.uk</a><span class="rd"> — 30 g fibre a day for adults</span></li>'+
         '<li><b>BNF and SPCs</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> \u2014 NSAID, antispasmodic, colestyramine and ursodeoxycholic acid cautions; fibrate cautions (check the product SPC)</span></li>'+
         '<li><b>Governance</b><span class="rd"> \u2014 clinical owner, local NHS GM/ICB approval status, date of approval and the named local acute surgical and hepatobiliary referral pathway: to be confirmed locally. Emergency management follows local hospital and antimicrobial protocols.</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Gallstone disease in primary care — NICE CG188, NICE NG12 (updated April 2026), BSG 2017 and the UK Working Party 2005 pancreatitis guideline. The GP decision is triage: fever, jaundice, rigors, persistent severe pain or systemic illness means urgent assessment, and 999 is for instability, sepsis, confusion or respiratory compromise. Persistent RUQ pain with fever, tenderness, vomiting or raised inflammatory markers suggests acute cholecystitis (same-day surgical assessment; cholecystectomy within 1 week); fever with jaundice is suspected cholangitis (emergency hospital assessment); epigastric pain radiating to the back with vomiting is gallstone pancreatitis. Uncomplicated biliary colic is managed in the community with an NSAID, LFTs and an abdominal ultrasound, and avoidance of trigger foods, then referred for laparoscopic cholecystectomy. Asymptomatic gallstones need no surgery. Jaundice at 40 and over is an NG12 suspected-cancer referral unless an alternative diagnosis is established. Verify doses against the current SPC and the Greater Manchester formulary."
});
