<script>
MG.render({ snapshot:"summaries/migraine.html",
  icon:"🧠",
  title:"Migraine — the complete guide",
  eyebrow:"Protocol · NICE CG150 (updated June 2025) · BASH and GM local practice labelled · two numbers rule everything",
  stemTitle:"Attack days and acute-medication days decide every subsequent choice — and until the second number is dealt with, no amount of prophylaxis will work",
  stemSub:"One page for the whole condition. Confirm it is migraine and catch the atypical aura that leaves this pathway; <b>count the two numbers</b>; treat attacks early with the right triptan mechanics and switch before abandoning the class; <b>unmask medication-overuse headache before calling anything refractory</b>; titrate prophylaxis properly — an adequate trial at a therapeutic dose (commonly 6–8 weeks at target in local practice), not 2 weeks at the starting dose; handle the hormonal interfaces, where <b>aura plus combined hormonal contraception is UKMEC 4</b>; and refer by each therapy's specific NICE appraisal and the local pathway. <b>New, atypical or focal neurological symptoms need neurological or vascular assessment, not automatic migraine treatment.</b>",
  guideline:"NICE CG150 (updated June 2025) · BASH · TA919 · TA906 · TA973 · TA682 · TA764 · TA659 · TA871 · TA260 · UKMEC · MHRA · GM headache pathway",
  reviewed:"14 September 2026",
  nextReview:"14 March 2027",
  meta:[
    {t:"NICE CG150 (updated June 2025) · BASH/GM local practice labelled"},
    {t:"MOH: headache ≥15 days/month + 10/15 medication days for >3 months"},
    {t:"Aura + CHC = UKMEC 4 — prompt contraception review"},
    {t:"v2.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#confirm"><b>Confirm</b><small>POUND · two numbers</small></a><a href="#acute"><b>Acute</b><small>Triptan + NSAID</small></a><a href="#moh"><b>MOH</b><small>The great mimic</small></a><a href="#prophylaxis"><b>Prophylaxis</b><small>Adequate trial · review 3–6 mo</small></a><a href="#hormones"><b>Hormones</b><small>UKMEC 4 · pregnancy</small></a></div>',
  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"blue", h:"The two numbers, counted at every review", html:"Number 1 — headache days per month: 15 or more (with 8 or more migrainous) for over 3 months is CHRONIC migraine and a different pathway. Number 2 — acute medication days per month: suspect medication-overuse headache when headache occurs on 15 or more days a month in a person with a pre-existing headache disorder and, for over 3 months, triptans, opioids, ergots or combination analgesics have been used on 10 or more days a month, or paracetamol, aspirin or NSAIDs on 15 or more. <b>A 4–8 week diary answers both</b> — they prompt consideration of chronic migraine or MOH, but the diagnosis still needs clinical assessment."},
    {tone:"blue", h:"Treat the attack early in the headache phase", html:"Offer an oral triptan (start with the lowest-cost, e.g. sumatriptan) with an NSAID or paracetamol if appropriate — or triptan or analgesic monotherapy by preference and suitability (NICE CG150). Take it early in the headache phase, not during aura alone, at the lowest effective licensed dose — follow the product-specific maximum daily dose and frequency restrictions. Check renal, GI, cardiovascular, pregnancy and anticoagulant risks before an NSAID. Consider metoclopramide or prochlorperazine, even without prominent nausea (CG150), and when vomiting or poor absorption limits oral treatment — check metoclopramide age and duration limits and warn about dystonia and extrapyramidal effects, particularly in younger people."},
    {tone:"amber", h:"Non-response to ONE triptan is not class failure", html:"Before declaring a triptan ineffective, check dose, timing, adherence, absorption (vomiting) and use on several attacks. If still ineffective or poorly tolerated, try another triptan before concluding triptans don't work (CG150), taking account of contraindications and product-specific dosing: e.g. rizatriptan, eletriptan, zolmitriptan nasal (vomiting), sumatriptan SC, or frovatriptan/naratriptan (longer half-life, recurrence-prone and menstrual) — check each SPC."},
    {tone:"red", h:"⛔ Never opioids or ergots", html:"Opioids (including codeine and co-codamol) and ergots are not used routinely for migraine — they drive medication-overuse headache and dependence. An inherited co-codamol repeat in a migraine patient is an action, not a footnote."},
    {tone:"amber", h:"Prophylaxis fails because it is under-dosed and judged too early", html:"Consider when migraine is frequent, disabling, prolonged, linked to medication overuse, or when acute treatment is ineffective, contraindicated or poorly tolerated (≥4 migraine days a month is a common BASH/local prompt). Titrate gradually to a tolerated therapeutic dose; assess early tolerability but do not judge efficacy after 2 weeks at the starting dose. Review response after an adequate trial at a therapeutic dose — commonly 6–8 weeks at target (BASH/local practice; about 3 months on the GM pathway) — and formally review ongoing need after 3–6 months (NICE). <b>Success is fewer attack days, not zero.</b> NICE (updated June 2025): discuss and consider propranolol, topiramate or amitriptyline, taking account of comorbidities, adverse-effect risk, pregnancy potential, overdose risk, patient preference and quality of life — not mandatory sequential trials in every patient."},
    {tone:"amber", h:"🟠 Aura plus combined hormonal contraception = UKMEC 4", html:"Do not initiate CHC in confirmed migraine with aura. If aura develops while using CHC, arrange a prompt contraception review (POP, implant, IUS) — do not leave the patient without contraceptive advice or pregnancy protection. <b>Migraine without aura is not automatically suitable</b> — the UKMEC category depends on age, smoking, hypertension and other vascular risk factors; use the current UKMEC table directly. A first or atypical focal visual or neurological episode on CHC needs urgent assessment for TIA, retinal or other neurological disease rather than simply being labelled aura (not every zig-zag is aura), while arranging contraception. See <a href='contraception.html'>contraception</a>."}
  ],
  pathwaySub:"Seven steps. Step four is the one that rescues most apparently refractory patients.",
  pathway:[
    {title:"Confirm migraine and count the two numbers", html:"Apply the migraine diagnostic criteria rather than POUND alone; record headache days, migraine days and aura evolution; examine, including blood pressure and neurology; screen for red flags and medication overuse. No imaging for typical migraine with a normal examination. Urgently assess first or atypical aura (especially after 50), sudden-onset, motor, persistent, monocular or brainstem symptoms, or reduced consciousness — don't label them aura until vascular and neurological causes are considered.", alert:true},
    {title:"Set the foundations", html:"The diary, sleep and meal regularity, hydration, caffeine, trigger review — the free treatments that make everything else measurable."},
    {title:"Treat attacks early and properly", html:"Triptan with an NSAID or paracetamol early in the headache, antiemetic when nausea limits oral treatment, try an alternative triptan after an adequate trial before abandoning the class, acute rimegepant only where TA919 criteria are met."},
    {title:"Unmask medication-overuse headache", html:"Before calling anything refractory. Stop all overused acute medication for at least a month — usually abruptly, but with a clinically supervised reduction for opioid, benzodiazepine or barbiturate dependence — warn about initial worsening, follow up closely and reassess."},
    {title:"Prophylaxis — adequate dose, adequate time", html:"Discuss and consider propranolol, topiramate or amitriptyline (NICE, updated 2025), or candesartan (off-label, local-pathway dependent); judge after an adequate trial at a therapeutic dose and review ongoing need after 3–6 months. No routine combination of preventives in primary care."},
    {title:"Handle the hormonal interfaces", html:"Aura and CHC, menstrual mini-prophylaxis, pregnancy, perimenopause, breastfeeding."},
    {title:"Review on the diary, and refer into the CGRP era", html:"Refer according to each therapy's specific NICE appraisal and the local headache pathway — CGRP monoclonals, atogepant, preventive rimegepant, or botulinum toxin in chronic migraine; 'three failed preventives' is not a universal eligibility rule. Also refer atypical aura, diagnostic uncertainty, complicated MOH and complex or changing migraine in pregnancy."}
  ],
  sections:[

    {id:"confirm", nav:"Confirm", title:"Step 1 — confirm migraine, and count the two numbers",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>The diagnosis</b>","Attacks lasting 4–72 hours with at least 2 of: unilateral, pulsating, moderate-to-severe, worse on activity — PLUS nausea or vomiting, or photophobia with phonophobia. Apply the formal diagnostic criteria (CG150) rather than relying on the POUND mnemonic alone, and record headache days and migraine days. <b>Examine, including blood pressure and neurological findings — the examination should be normal.</b> Do not image solely for reassurance in typical, stable migraine with a normal examination — investigate red flags, diagnostic uncertainty or a changed pattern"],
         ["<b>Typical aura</b>","Visual (fortification spectra, scotoma), sensory or speech; evolves GRADUALLY over 5 minutes or more, lasts 5–60 minutes, fully reversible. <b>Sudden-onset focal symptoms are a stroke or TIA pathway, not migraine</b>"],
         ["<b>Atypical aura — refer</b>","Urgent assessment: sudden onset, motor weakness, persistent deficit, monocular visual loss, double vision, ataxia or dysarthria (brainstem), reduced consciousness, a first or changing prolonged aura, or a FIRST aura over 50 — exclude TIA and retinal or neurological disease. A known, recurrent, fully reversible long aura is not automatically an emergency"],
         ["<b>Number 1 — headache days per month</b>","15 or more days a month (with 8 or more migrainous) for over 3 months = CHRONIC migraine → a different pathway"],
         ["<b>Number 2 — acute medication days per month</b>","Triptans, opioids, ergots or combination analgesics on 10 or more days, or paracetamol, aspirin or NSAIDs on 15 or more, for over 3 months — with headache on 15 or more days a month in a pre-existing headache disorder = suspect medication-overuse headache — the great mimic of \"worsening migraine\""],
         ["<b>Context, every time</b>","Menstrual link (diary 3 cycles), contraception (aura? → the hormones section), mood and sleep (they drive drug choice), family history, occupation and driving"]
       ]},
       {b:"warn", html:"<b>Red flags out of the migraine pathway:</b> thunderclap (peak intensity within 5 minutes) — emergency assessment even if it has resolved · new headache over 50 — assess for secondary causes, including GCA (ESR, temporal tenderness); suspected GCA with visual symptoms is an emergency pathway · postural headache, or one that wakes from sleep (a contextual warning feature, not diagnostic on its own), for raised intracranial pressure · papilloedema → same-day neurological or ophthalmic assessment · fever with neck stiffness · persistent focal neurology, reduced consciousness, seizure or meningism — an emergency · first or atypical aura is not automatically migraine · new headache in cancer, HIV or other immunosuppression · new headache in pregnancy or post-partum — low threshold for same-day assessment · a progressive daily crescendo pattern."}
     ]},

    {id:"foundations", nav:"Foundations", title:"Step 2 — the diary and the routine: the free treatments",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"📓 The headache diary", html:"THE tool: attack days, acute-medication days, menstrual link, triggers. 4–8 weeks of diary beats any single consultation — every escalation decision below depends on it."},
         {tone:"green", h:"😴 Sleep and meals", html:"<b>Regular sleep and wake times and regular meals</b> — irregularity is a more reliable trigger than any single food. Skipped meals and lie-ins are classic."},
         {tone:"green", h:"☕ Caffeine and hydration", html:"Consistent caffeine intake rather than abstinence — withdrawal triggers attacks. Adequate hydration."},
         {tone:"amber", h:"🔍 Triggers, honestly", html:"<b>Most \"trigger foods\" are premonitory cravings rather than causes.</b> Chase patterns in the diary rather than imposing elimination diets."},
         {tone:"blue", h:"💊 Riboflavin and magnesium", html:"<b>Riboflavin (400 mg OD) and magnesium may be considered as adjuncts</b> after discussing modest evidence, uncertain product quality and dose, gastrointestinal effects (magnesium can cause diarrhoea) and renal function (caution in significant renal impairment); consider pregnancy and concurrent medicines. They should not replace evidence-based preventive treatment when migraine is disabling."},
         {tone:"green", h:"📍 Acupuncture", html:"Up to 10 sessions over 5–8 weeks when propranolol, topiramate and amitriptyline have not worked, are unsuitable or are not tolerated — a CG150 option. It need not wait for three drug trials if the patient declines or cannot use those treatments."}
       ]}
     ]},

    {id:"acute", nav:"Acute", title:"Step 3 — treat the attack: early, lowest effective licensed dose, combination where suitable",
     blocks:[
       {b:"table", head:["Step","Treatment","Detail"], rows:[
         ["<b>1st — triptan with an NSAID or paracetamol, early in the headache</b>","Oral triptan (lowest-cost first, e.g. sumatriptan) with an NSAID or paracetamol if appropriate; or monotherapy by preference and suitability (CG150) — not during aura alone","Check NSAID risks (renal, GI, CV, pregnancy, anticoagulants). If the headache returns, follow the product-specific repeat-dose interval and maximum daily dose in the SPC. Use the lowest effective licensed dose — particularly in older people, those with vascular risk and people with renal or hepatic impairment. Use an alternative route if vomiting or gastric stasis limits absorption. <b>Soluble or dispersible forms absorb faster in gastric stasis</b>"],
         ["<b>2nd — antiemetic when needed</b>","<b>Metoclopramide or prochlorperazine</b>","When nausea, vomiting or poor absorption limits oral treatment; non-oral forms (with a non-oral NSAID or triptan) if oral treatment fails or is not tolerated (CG150). Consider even without prominent nausea (CG150). Metoclopramide has age restrictions and treatment-duration limits; extrapyramidal reactions and dystonia can occur, particularly in younger patients. Prochlorperazine carries sedation, anticholinergic and extrapyramidal risks. Check contraindications"],
         ["<b>3rd — switch the triptan before abandoning the class</b>","Rizatriptan · eletriptan · zolmitriptan nasal (vomiting) · sumatriptan SC (severe or rapid attacks) · frovatriptan or naratriptan (longer half-life — recurrence-prone and menstrual)","Before declaring a triptan ineffective, check dose, timing (early in the headache), adherence, absorption and vomiting, and use on more than one appropriate attack. If still ineffective or poorly tolerated, try another triptan (CG150), taking account of contraindications, interactions and product-specific dosing per SPC"],
         ["<b>4th — acute rimegepant (TA919 criteria only)</b>","<b>Rimegepant 75 mg ODT (NICE TA919 — acute treatment)</b>","Acute and preventive rimegepant are separate indications with different eligibility criteria (TA919 acute; TA906 prevention). Acute use only where TA919 criteria are met: 2 or more triptans have not worked well enough, or triptans are contraindicated or not tolerated, and NSAIDs and paracetamol have also not worked well enough — not a general fourth-line rescue for all patients. Confirm current NICE and GMMMG commissioning criteria before prescribing (the GM pathway allows primary-care initiation when its criteria are met). No vasoconstriction, so usable in ischaemic heart disease. There is no established MOH threshold for gepants comparable to triptans and simple analgesics — keep an acute-medication diary and avoid unsupervised frequent use"]
       ]},
       {b:"table", head:["Rule","Detail"], rows:[
         ["<b>Triptan contraindications</b>","Do not use in significant coronary disease or coronary vasospasm, previous stroke or TIA, peripheral vascular disease, or uncontrolled hypertension. Check product-specific hepatic and renal restrictions, and interactions with ergot derivatives or another triptan within the restricted interval (check the SPC). A first episode of suspected hemiplegic or brainstem migraine needs specialist assessment — do not treat it as ordinary migraine. Age over 65 is a caution — vascular review first"],
         ["<b>Never</b>","Opioids (including codeine and co-codamol) and ergots — not for routine migraine treatment; they drive MOH and dependence. <b>An inherited co-codamol repeat is an action</b>"],
         ["<b>Timing</b>","Treat early in the headache phase — \"wait and see if it's a bad one\" is a common patient error"],
         ["<b>Count the days</b>","Every acute plan comes with the MOH limits said out loud AND written down — document the maximum acute-treatment days agreed"]
       ]}
     ]},

    {id:"moh", nav:"MOH", title:"Step 4 — unmask medication-overuse headache",
     sub:"The commonest reversible cause of apparently refractory migraine.",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>Suspect it</b>","Headache on 15 or more days a month in a person with a pre-existing headache disorder, AND acute medication used for over 3 months on: <b>10 or more days a month</b> — triptans, opioids, ergots or combination analgesics; <b>15 or more days a month</b> — paracetamol, aspirin or NSAIDs, alone or in combination. The diary shows it"],
         ["<b>The fix</b>","<b>Stop all overused acute medication abruptly for at least 1 month</b> in most cases (NICE). However, opioid, benzodiazepine or barbiturate dependence requires a clinically supervised reduction rather than unsupervised abrupt cessation. Headaches may worsen at first: pre-warn and follow up closely. Complex withdrawal — opioid or sedative overuse, previous failed withdrawal, significant psychiatric comorbidity, severe dependence, inability to maintain hydration or oral treatment, or safeguarding concerns → consider specialist headache or addiction-service support"],
         ["<b>Support the withdrawal</b>","Consider starting prevention alongside withdrawal where indicated. Do not routinely prescribe a bridging analgesic. If one is considered, document the indication, duration and maximum use, assess renal, GI and cardiovascular risk, and ensure it does not perpetuate medication overuse — and <b>still count those medication days</b>"],
         ["<b>Then reassess</b>","At 4–8 weeks: many \"chronic migraineurs\" revert to episodic once the rebound has gone — THEN judge whether prophylaxis is still needed"],
         ["<b>Prevent relapse</b>","The MOH conversation at every acute prescription; agree a maximum number of treatment days (ideally no more than 2 a week). The GM pathway's practical limit of about 6 triptan days a month is local policy, stricter than the diagnostic thresholds of 10 (triptans) and 15 (simple analgesics)"]
       ]},
       {b:"why", html:"MOH is the commonest reversible cause of \"refractory migraine\" in primary care. Escalating prophylaxis — or referring — without withdrawing the overuse fails, because the rebound drives the headache no matter what you add underneath it. <b>That is why this step sits before prophylaxis rather than after it.</b>"}
     ]},

    {id:"prophylaxis", nav:"Prophylaxis", title:"Step 5 — prophylaxis: adequate dose, adequate time, honest counselling",
     blocks:[
       {b:"info", html:"Consider when migraine is frequent, disabling, prolonged, linked to medication overuse, or acute treatment is ineffective, contraindicated or poorly tolerated (≥4 migraine days a month is a common BASH/local prompt). <b>Titrate gradually to a tolerated therapeutic dose.</b> Assess early tolerability, but do not judge efficacy after only 2 weeks at the starting dose. Review response after an adequate trial at a therapeutic dose — commonly 6–8 weeks at target (BASH/local practice; about 3 months on the GM pathway) — and formally review ongoing need after 3–6 months (NICE). <b>Success is fewer attack days on the diary, not zero.</b> NICE (CG150, updated June 2025): discuss and consider propranolol, topiramate or amitriptyline, taking account of comorbidities, adverse-effect risk, pregnancy potential, overdose risk, patient preference and impact on quality of life. If the first option is ineffective or not tolerated, discuss the second and then the remaining suitable option — they are not mandatory sequential trials in every patient."},
       {b:"table", head:["Step","Agent","Detail"], rows:[
         ["<b>NICE options — propranolol, topiramate or amitriptyline, by shared decision</b>","<b>Propranolol MR 80 mg → 160 mg/day</b>, or <b>amitriptyline 10 mg nocte → titrate by 10–25 mg → 50–75 mg</b>","Propranolol: avoid in asthma and significant obstructive airway disease, bradycardia, hypotension and conduction disease; may mask hypoglycaemia in diabetes; consider depression and overdose or self-harm risk (NICE highlights propranolol toxicity in overdose); avoid abrupt withdrawal; caution in athletes (fatigue). Amitriptyline may suit sleep disturbance, tension-type overlap or low mood but is not automatically preferable because these are present — consider anticholinergic effects, falls and cognitive impairment in older people, cardiac conduction/QT risk, overdose toxicity, interactions with serotonergic and sedating medicines, and taper when stopping after prolonged use. Pre-warn about dry mouth and morning grogginess, and take it about 12 hours before waking rather than at midnight"],
         ["<b>Topiramate (NICE) · candesartan (off-label, local pathway)</b>","Doses per SPC and the GM headache pathway","Candesartan: <b>off-label and local-pathway dependent</b> — may be useful with hypertension or where topiramate should be avoided. Check baseline and follow-up BP, creatinine/eGFR and potassium; <b>avoid in pregnancy and when planning pregnancy</b>; review interactions with NSAIDs; caution in renal artery stenosis, AKI and volume depletion. Topiramate: avoid in pregnancy for migraine prevention — risk of fetal malformations and neurodevelopmental effects; <b>MHRA Pregnancy Prevention Programme</b> requirements apply, including highly effective contraception consistent with current MHRA requirements. It can reduce the effectiveness of some hormonal contraceptives depending on dose and contraceptive method — follow the current MHRA safety update. Adverse effects: cognitive impairment, mood changes, weight loss, paraesthesia, renal stones, metabolic acidosis and acute myopia/angle-closure glaucoma (early eye pain or blurred vision → stop and seek urgent review). In anyone who could conceive, discuss options carefully — both topiramate and candesartan must be avoided in pregnancy"],
         ["<b>3rd — the remaining suitable option</b>","The remaining suitable NICE option. <b>Do not routinely combine migraine preventives in primary care</b> — if adequate trials of suitable monotherapy are unsuccessful, seek advice from the local headache service before combining agents","<b>Re-check MOH first — always.</b> A menstrual pattern calls for the hormonal strategies below rather than endless switching"],
         ["<b>4th — the CGRP era: refer</b>","Each therapy by its own NICE appraisal: atogepant (TA973) — episodic or chronic migraine, ≥4 migraine days a month, after 3 preventive treatments have failed, are not tolerated or are unsuitable; CGRP monoclonals — erenumab (TA682), fremanezumab (TA764), galcanezumab (TA659), eptinezumab (TA871) — per each appraisal's criteria; preventive rimegepant (TA906) — episodic migraine with ≥4 and &lt;15 attacks a month, after the specified preventive-treatment criteria","Botulinum toxin (TA260) is for chronic migraine only (≥15 headache days, ≥8 migraine, 3 failed preventives, MOH managed). Not interchangeable. NICE stopping rules apply (usually &lt;50% reduction at 12 weeks episodic, &lt;30% chronic). Do not use 'three failed preventives' as a universal eligibility rule — confirm the individual therapy's criteria and refer per the local headache pathway"]
       ]},
       {b:"table", head:["Situation","Prophylaxis note"], rows:[
         ["<b>Withdrawing after success</b>","<b>6–12 months of good control → taper over 2–3 months and see.</b> Many stay well; agree the restart threshold in advance"],
         ["<b>Woman who could conceive</b>","Topiramate: avoid in pregnancy; MHRA Pregnancy Prevention Programme with highly effective contraception per current MHRA requirements. <b>Candesartan is contraindicated in pregnancy</b> — avoid if pregnant or planning, and agree an alternative before conception. Folic acid and a plan BEFORE conception"],
         ["<b>Comorbid hypertension</b>","<b>Candesartan (off-label, local pathway) or propranolol — one drug, two jobs</b>"],
         ["<b>Comorbid depression or insomnia</b>","<b>Amitriptyline may help but is not automatically preferable — and treat the depression properly in its own right</b>. Consider overdose risk with both amitriptyline and propranolol. See <a href='depression.html'>depression</a>"],
         ["<b>Elderly</b>","Candesartan (off-label) may be better tolerated by some — check BP, renal function and potassium; amitriptyline adds anticholinergic burden, falls and cognitive risk"]
       ]}
     ]},

    {id:"hormones", nav:"Hormones", title:"Step 6 — the hormonal interfaces",
     blocks:[
       {b:"table", head:["Situation","Management"], rows:[
         ["<b>Aura + combined hormonal contraception = UKMEC 4</b>","Do not initiate combined hormonal contraception in confirmed migraine with aura. If aura develops while using CHC, arrange prompt contraception review and assess urgently for alternative neurological or ophthalmic diagnoses — do not leave the patient without contraceptive advice or pregnancy protection. A first or atypical focal neurological episode needs urgent assessment rather than simply being labelled aura. Migraine without aura is not automatically suitable for CHC — the UKMEC category depends on age, smoking, hypertension and other vascular risk factors; use the current UKMEC table directly. See <a href='contraception.html'>contraception</a>"],
         ["<b>Menstrual migraine (diary-proven, −2 to +3 days)</b>","Treat acute attacks with a long-half-life triptan; or perimenstrual \"mini-prophylaxis\" — frovatriptan 2.5 mg BD or naratriptan 1 mg BD from 2 days before expected onset for 5–6 days; or a continuous hormonal strategy (extended-cycle CHC if NO aura and UKMEC-suitable, or oestrogen-stabilising approaches). Mini-prophylaxis is specialist/local-pathway (BASH) practice, off-label where applicable, only for a clear diary-confirmed menstrual pattern, and not where triptans are contraindicated — not a universal treatment for any perimenstrual headache"],
         ["<b>Pregnancy</b>","Migraine usually improves, especially without aura. Acute: paracetamol first; sumatriptan may be considered after individual risk–benefit assessment; NSAIDs have trimester-specific restrictions and should not be used in the third trimester; antiemetics per pregnancy guidance. Prevention: specialist-guided (propranolol is often used); avoid topiramate and candesartan; do not start CGRP medicines without specialist advice. New, severe, atypical or changing headache in pregnancy or post-partum → same-day assessment for pre-eclampsia, cerebral venous thrombosis, pituitary apoplexy and other secondary causes as clinically indicated. Check a pregnancy-specific source (UKTIS/BUMPS), not CG150 alone"],
         ["<b>Perimenopause</b>","Where HRT is indicated, transdermal oestrogen is preferred (a menopause-practice principle); aura is not an absolute contraindication to menopausal HRT — unlike CHC. Individualise and check current menopause guidance (NICE NG23). HRT is not contraception; seek menopause or contraception advice if migraine is complex or aura is present. See <a href='hrt-prescribing.html'>HRT prescribing</a>"],
         ["<b>Breastfeeding</b>","Paracetamol, ibuprofen, sumatriptan and propranolol are generally compatible at usual doses; check the current breastfeeding medicines reference (SPS/UKDILAS) and the individual product information, particularly in premature or unwell infants"]
       ]}
     ]},

    {id:"monitor", nav:"Review", title:"Step 7 — diary-led review",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["<b>Diary: attack days and acute-medication days</b>","<b>Every review</b>","The two numbers decide: escalate acute care, start or adjust prophylaxis, or unmask MOH"],
         ["<b>A new prophylactic</b>","<b>After an adequate trial at a therapeutic dose (commonly 6–8 weeks at target; about 3 months on the GM pathway); review ongoing need at 3–6 months</b>","Not at 2 weeks on the starting dose. Success = meaningfully fewer attack days. Document dose, target, contraindications, pregnancy plan and review date"],
         ["<b>Acute treatment adequacy</b>","<b>Every review</b>","<b>Right triptan, taken early in the headache, with an NSAID or paracetamol if suitable, and an antiemetic if needed?</b>"],
         ["<b>Contraception and pregnancy plans</b>","<b>Every review in women of reproductive age</b>","<b>Aura status versus CHC; topiramate PPP; candesartan and pregnancy; pre-conception planning</b>"],
         ["<b>After 6–12 months of control</b>","<b>Planned</b>","<b>Taper prophylaxis over 2–3 months with an agreed restart threshold</b>"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 999 / same day", html:"\"Thunderclap headache — worst ever, maximal within minutes — call 999, even if it settles. Also fever with a stiff neck, new weakness or numbness, confusion or drowsiness, or a first fit.\""},
         {tone:"amber", h:"🟠 Contact us", html:"\"A headache that changes character, aura lasting over an hour, aura for the first time, any new neurological symptom, or a new or different headache in pregnancy or after giving birth.\""},
         {tone:"blue", h:"💊 The two limits", html:"\"Keep to the number of treatment days we agree — usually no more than 2 a week. Triptans on 10 or more days a month, or paracetamol or ibuprofen on 15 or more, can start causing the headaches themselves.\""},
         {tone:"green", h:"⏱️ Take it early", html:"\"Treat early in the headache, at the dose we agreed, with an anti-inflammatory or paracetamol alongside if suitable — waiting to see if it will be a bad one makes it work less well.\""}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Emergency — 999 or same day", html:"Thunderclap headache, even if resolved · suspected meningitis or encephalitis · new or persistent focal deficit, reduced consciousness or seizure · papilloedema (same-day neurological or ophthalmic assessment) · suspected GCA with visual symptoms · new headache or aura in pregnancy or post-partum, especially with pre-eclampsia features (low threshold for same-day assessment)."},
         {tone:"amber", h:"Neurology — atypical aura", html:"After acute assessment of first or atypical aura (motor, brainstem, monocular, prolonged or first over 50) — for diagnosis and triptan-safety decisions."},
         {tone:"blue", h:"Headache clinic — the CGRP era", html:"Refer according to each therapy's specific NICE appraisal and the local headache pathway — atogepant (TA973), CGRP monoclonals (TA682, TA764, TA659, TA871), preventive rimegepant for episodic migraine (TA906), or botulinum toxin for chronic migraine (TA260). Do not use 'three failed preventives' as a universal eligibility rule. NICE stopping rules apply."},
         {tone:"amber", h:"Diagnostic doubt", html:"<b>Late onset, a changed pattern, diagnostic uncertainty, complicated MOH, complex or changing migraine in pregnancy, or suspected cluster headache</b> — verapamil pathways and high-flow oxygen are specialist-led."},
         {tone:"cream", h:"GP management", html:"Diagnosis, the diary, acute treatment and triptan switching, MOH withdrawal, prophylaxis to target, the hormonal interfaces and the review rhythm all belong here. Related pages: <a href='tension-headache.html'>tension-type headache</a> · <a href='contraception.html'>contraception</a> · <a href='hrt-prescribing.html'>HRT prescribing</a> · <a href='giant-cell-arteritis.html'>giant cell arteritis</a> · <a href='depression.html'>depression</a> · <a href='../algorithms/headache.html'>headache pathway</a>."}
       ]},
       {b:"say", html:"You have given the standard preventers a proper try and migraine is still taking too many days — you may now meet the criteria for the newer preventers, which the specialist clinic starts — they help many people but not everyone, and are stopped if they don't. Keep the diary going: it is the evidence that gets you treated fastest."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 29-year-old woman reports migraines \"getting worse\" — now <b>headache on about 20 days a month</b>. She takes <b>sumatriptan roughly 12 days a month</b> and <b>co-codamol most other days</b>, bought over the counter. She is on the <b>combined pill</b> and mentions that for the last few months she has been getting <b>\"zigzag lights\" for about 20 minutes before some headaches</b> — which is new. She asks to be referred to a neurologist for \"the new injections\"."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Recognises the new visual symptoms, considers whether they are aura or need urgent assessment, and arranges a prompt contraception review — aura plus CHC is UKMEC 4 — with alternative contraception so she is not left unprotected, rather than treating this as a headache-only consultation; counts the two numbers and recognises medication-overuse headache from both the triptan (12 days) and the co-codamol, asking specifically about what is bought rather than prescribed; <b>explains that MOH must be withdrawn BEFORE calling this refractory</b> — stop for at least a month, with initial worsening warned about, close follow-up, and prevention started alongside where indicated (no routine bridging; any NSAID bridging still counts as medication days); <b>declines the immediate CGRP referral with a reason</b>, since eligibility depends on each therapy's NICE appraisal criteria and no preventive has yet been tried; discusses propranolol, topiramate (with PPP) or amitriptyline and the need for adequate titration and time; stops the co-codamol explicitly (a supervised reduction if she is dependent) and explains why opioids are the fastest route into MOH; issues a <b>headache diary</b>; and <b>safety-nets the thunderclap and focal-deficit triggers</b>."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE CG150 — Headaches in over 12s: diagnosis and management (updated June 2025)</b><br><a href="https://www.nice.org.uk/guidance/cg150" rel="noopener">nice.org.uk/guidance/cg150</a><span class="rd"> — the diagnostic criteria, triptan plus NSAID as the acute combination, the antiemetic recommendation, the 2025 prophylaxis wording (consider propranolol, topiramate or amitriptyline after discussion, with propranolol overdose risk, the topiramate Pregnancy Prevention Programme and amitriptyline safe prescribing and withdrawal), review of continuing prophylaxis, acupuncture as an option where drug prophylaxis is unsuitable, and the medication-overuse thresholds and withdrawal advice</span></li>'+
         '<li><b>British Association for the Study of Headache (BASH) national headache management system</b> (specialist/local practice — not NICE)<span class="rd"> — the triptan-switching principle, the 6–8 week at-target prophylaxis trial, perimenstrual mini-prophylaxis with frovatriptan or naratriptan, and the 50% attack-day reduction as the success measure</span></li>'+
         '<li><b>NICE TA919 — rimegepant for treating migraine (acute)</b><br><a href="https://www.nice.org.uk/guidance/ta919" rel="noopener">nice.org.uk/guidance/ta919</a><span class="rd"> — acute rimegepant eligibility only</span></li>'+
'<li><b>NICE TA906 — rimegepant for preventing migraine</b><br><a href="https://www.nice.org.uk/guidance/ta906" rel="noopener">nice.org.uk/guidance/ta906</a><span class="rd"> — preventive rimegepant in episodic migraine (≥4 and &lt;15 attacks a month)</span></li>'+
'<li><b>NICE TA973 — atogepant for preventing migraine</b><br><a href="https://www.nice.org.uk/guidance/ta973" rel="noopener">nice.org.uk/guidance/ta973</a><span class="rd"> — atogepant after 3 preventive treatments have failed, are not tolerated or are unsuitable</span></li>'+
'<li><b>NICE TA682 — erenumab</b><br><a href="https://www.nice.org.uk/guidance/ta682" rel="noopener">nice.org.uk/guidance/ta682</a></li>'+
'<li><b>NICE TA764 — fremanezumab (replaced TA631)</b><br><a href="https://www.nice.org.uk/guidance/ta764" rel="noopener">nice.org.uk/guidance/ta764</a></li>'+
'<li><b>NICE TA659 — galcanezumab</b><br><a href="https://www.nice.org.uk/guidance/ta659" rel="noopener">nice.org.uk/guidance/ta659</a></li>'+
'<li><b>NICE TA871 — eptinezumab</b><br><a href="https://www.nice.org.uk/guidance/ta871" rel="noopener">nice.org.uk/guidance/ta871</a><span class="rd"> — each CGRP monoclonal by its own appraisal criteria and stopping rules</span></li>'+
'<li><b>NICE TA260 — botulinum toxin type A for chronic migraine</b><br><a href="https://www.nice.org.uk/guidance/ta260" rel="noopener">nice.org.uk/guidance/ta260</a><span class="rd"> — chronic migraine only, with medication overuse managed and the required preventive failures</span></li>'+
'<li><b>GMMMG — Headache Management Guidelines for Adults in Greater Manchester (Headache Pathway v12.2, December 2024)</b><br><a href="https://gmmmg.nhs.uk/wp-content/uploads/2024/12/Headache-Pathway-and-notes-V12.2-FINAL.pdf" rel="noopener">gmmmg.nhs.uk</a><span class="rd"> — local pathway: confirm the current version, approval and review dates before use. Practical local limit of about 6 triptan days a month (distinct from the diagnostic MOH threshold of 10); rimegepant may be initiated in primary care when pathway criteria are met; other CGRP therapies and botulinum toxin via the specialist headache service</span></li>'+
         '<li><b>UK Medical Eligibility Criteria (UKMEC) for Contraceptive Use</b><br><a href="https://www.fsrh.org" rel="noopener">fsrh.org</a><span class="rd"> — migraine with aura as UKMEC 4 for combined hormonal contraception at any age, and migraine without aura categorised by age, smoking, hypertension and other vascular risk — use the current UKMEC table</span></li>'+
         '<li><b>NICE CG150 \u2014 Headaches in over 12s: diagnosis and management</b><br><a href="https://www.nice.org.uk/guidance/cg150" rel="noopener">nice.org.uk/guidance/cg150</a><span class="rd"> — triptan contraindications and the prophylaxis withdrawal schedule (drug doses: verify against the BNF and SPC)</span></li>'+
'<li><b>UKTIS — Best Use of Medicines in Pregnancy (BUMPS)</b><br><a href="https://www.medicinesinpregnancy.org" rel="noopener">medicinesinpregnancy.org</a><span class="rd"> — pregnancy-specific advice on paracetamol, sumatriptan, NSAIDs and preventives</span></li>'+
'<li><b>SPS — medicines in breastfeeding (UKDILAS)</b><br><a href="https://www.sps.nhs.uk" rel="noopener">sps.nhs.uk</a><span class="rd"> — breastfeeding compatibility of acute and preventive treatments</span></li>'+
         '<li><b>MHRA Drug Safety Updates</b><br><a href="https://www.gov.uk/drug-safety-update/topiramate-topamax-introduction-of-new-safety-measures-including-a-pregnancy-prevention-programme" rel="noopener">gov.uk/drug-safety-update (topiramate PPP)</a><span class="rd"> — topiramate Pregnancy Prevention Programme, highly effective contraception, reduced effectiveness of some hormonal contraceptives, and its teratogenic and neurodevelopmental risks; metoclopramide duration limits and dystonia risk in young people</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Migraine in adults — NICE CG150 (updated June 2025), BASH and GM local practice (labelled as such), TA919 (acute rimegepant), TA906 (preventive rimegepant), TA973, TA682, TA764, TA659, TA871, TA260, UKMEC and MHRA. Two numbers drive everything: attack days and acute-medication days. Treat attacks early with a triptan plus an NSAID or paracetamol where suitable, and try an alternative triptan before calling the class a failure. Opioids and ergots are not for routine use. Unmask medication-overuse headache before calling any migraine refractory. Judge prophylaxis after adequate titration and time (about 3 months on the GM pathway), not 2 weeks at the starting dose, and review ongoing need after 3–6 months; do not routinely combine preventives in primary care. Migraine with aura is UKMEC 4 for combined hormonal contraception at any age. New, atypical or focal neurological symptoms need neurological or vascular assessment rather than automatic migraine treatment. Verify all doses against the current BNF before prescribing."
});
