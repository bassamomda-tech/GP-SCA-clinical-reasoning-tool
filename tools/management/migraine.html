  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"blue", h:"The two numbers, counted at every review", html:"Number 1 — headache days per month: 15 or more (with 8 or more migrainous) for over 3 months is CHRONIC migraine and a different pathway. Number 2 — acute medication days per month: triptans, opioids or combination analgesics on 10 or more days, or simple analgesia on 15 or more, is medication-overuse headache territory. <b>A 4–8 week diary answers both</b> — they prompt consideration of chronic migraine or MOH, but the diagnosis still needs clinical assessment."},
    {tone:"blue", h:"Treat the attack early in the headache phase", html:"Offer an oral triptan (start with the lowest-cost, e.g. sumatriptan) with an NSAID or paracetamol if appropriate — or triptan or analgesic monotherapy by preference and suitability (NICE CG150). Take it early in the headache phase, not during aura alone. Check renal, GI, cardiovascular, pregnancy and anticoagulant risks before an NSAID. Metoclopramide or prochlorperazine when nausea, vomiting or poor absorption limits oral treatment."},
    {tone:"amber", h:"Non-response to ONE triptan is not class failure", html:"If a triptan is consistently ineffective or poorly tolerated, try one or more alternatives before concluding triptans don't work (CG150): e.g. rizatriptan, eletriptan, zolmitriptan nasal (vomiting), sumatriptan SC, or frovatriptan/naratriptan (longer half-life, recurrence-prone and menstrual) — check each SPC."},
    {tone:"red", h:"⛔ Never opioids or ergots", html:"Opioids (including codeine and co-codamol) and ergots are not used routinely for migraine — they drive medication-overuse headache and dependence. An inherited co-codamol repeat in a migraine patient is an action, not a footnote."},
    {tone:"amber", h:"Prophylaxis fails because it is under-dosed and judged too early", html:"Consider when migraine is frequent, disabling, prolonged, linked to medication overuse, or when acute treatment is ineffective, contraindicated or poorly tolerated (≥4 migraine days a month is a common BASH/local prompt). Titrate gradually to a tolerated therapeutic dose and allow enough time before judging — the GM pathway suggests about 3 months. <b>Success is fewer attack days, not zero.</b> NICE options: propranolol, topiramate or amitriptyline after a shared discussion."},
    {tone:"amber", h:"🟠 Aura plus combined hormonal contraception = UKMEC 4", html:"Do not initiate or continue CHC in confirmed migraine with aura — arrange a suitable alternative (POP, implant, IUS) through a contraception consultation. <b>Migraine without aura is generally UKMEC 2 at initiation</b> if there are no other vascular risks (age, smoking, hypertension) — check the current UKMEC table. New focal visual or neurological symptoms on CHC → stop and assess urgently for TIA or retinal disease (not every zig-zag is aura), while arranging contraception. See <a href='contraception.html'>contraception</a>."}
  ],

  pathway:[
    {title:"Confirm migraine and count the two numbers", html:"4–72 hours with POUND features, normal examination, no imaging for typical migraine. Urgently assess first or atypical aura (especially after 50), sudden-onset, motor, persistent, monocular or brainstem symptoms, or reduced consciousness — don't label them aura until vascular and neurological causes are considered.", alert:true},
    {title:"Set the foundations", html:"The diary, sleep and meal regularity, hydration, caffeine, trigger review — the free treatments that make everything else measurable."},
    {title:"Treat attacks early and properly", html:"Triptan with an NSAID or paracetamol early in the headache, antiemetic when nausea limits oral treatment, try an alternative triptan before abandoning the class, rimegepant per TA919 where eligible."},
    {title:"Unmask medication-overuse headache", html:"Before calling anything refractory. Stop the overused drug for at least a month (planned taper for opioids or where withdrawal is significant), warn about initial worsening, follow up closely and reassess."},

  sections:[

    {id:"confirm", nav:"Confirm", title:"Step 1 — confirm migraine, and count the two numbers",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>The diagnosis</b>","Attacks lasting 4–72 hours with at least 2 of: unilateral, pulsating, moderate-to-severe, worse on activity — PLUS nausea or vomiting, or photophobia with phonophobia (POUND). <b>Normal examination.</b> Do not image solely for reassurance in typical, stable migraine with a normal examination — investigate red flags, diagnostic uncertainty or a changed pattern"],
         ["<b>Typical aura</b>","Visual (fortification spectra, scotoma), sensory or speech; evolves GRADUALLY over 5 minutes or more, lasts 5–60 minutes, fully reversible. <b>Sudden-onset focal symptoms are a stroke or TIA pathway, not migraine</b>"],
         ["<b>Atypical aura — refer</b>","Urgent assessment: sudden onset, motor weakness, persistent deficit, monocular visual loss, double vision, ataxia or dysarthria (brainstem), reduced consciousness, a first or changing prolonged aura, or a FIRST aura over 50 — exclude TIA and retinal or neurological disease. A known, recurrent, fully reversible long aura is not automatically an emergency"],
         ["<b>Number 1 — headache days per month</b>","15 or more days a month (with 8 or more migrainous) for over 3 months = CHRONIC migraine → a different pathway"],
         ["<b>Number 2 — acute medication days per month</b>","Triptans, opioids or combination analgesics on 10 or more days, or simple analgesia on 15 or more = medication-overuse headache territory — the great mimic of \"worsening migraine\""],
         ["<b>Context, every time</b>","Menstrual link (diary 3 cycles), contraception (aura? → the hormones section), mood and sleep (they drive drug choice), family history, occupation and driving"]
       ]},
       {b:"warn", html:"<b>Red flags out of the migraine pathway:</b> thunderclap (peak intensity within 5 minutes) · new headache over 50, with ESR and temporal tenderness for GCA · postural headache or one that wakes from sleep, with papilloedema, for raised intracranial pressure · fever with neck stiffness · any new neurology · new headache in cancer, HIV or pregnancy · a progressive daily crescendo pattern."}
     ]},

    {id:"foundations", nav:"Foundations", title:"Step 2 — the diary and the routine: the free treatments",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"📓 The headache diary", html:"THE tool: attack days, acute-medication days, menstrual link, triggers. 4–8 weeks of diary beats any single consultation — every escalation decision below depends on it."},
         {tone:"green", h:"😴 Sleep and meals", html:"<b>Regular sleep and wake times and regular meals</b> — irregularity is a more reliable trigger than any single food. Skipped meals and lie-ins are classic."},
         {tone:"green", h:"☕ Caffeine and hydration", html:"Consistent caffeine intake rather than abstinence — withdrawal triggers attacks. Adequate hydration."},
         {tone:"amber", h:"🔍 Triggers, honestly", html:"<b>Most \"trigger foods\" are premonitory cravings rather than causes.</b> Chase patterns in the diary rather than imposing elimination diets."},
         {tone:"blue", h:"💊 Riboflavin 400 mg OD", html:"<b>Modest evidence, harmless and cheap — a reasonable adjunct.</b> Magnesium 400–600 mg is similar."},
         {tone:"green", h:"📍 Acupuncture", html:"Up to 10 sessions over 5–8 weeks where drug prophylaxis is unsuitable or declined — a CG150 option."}
       ]}
     ]},

    {id:"acute", nav:"Acute", title:"Step 3 — treat the attack: early, full dose, combination",
     blocks:[
       {b:"table", head:["Step","Treatment","Detail"], rows:[
         ["<b>1st — triptan with an NSAID or paracetamol, early in the headache</b>","Oral triptan (lowest-cost first, e.g. sumatriptan) with an NSAID or paracetamol if appropriate; or monotherapy by preference and suitability (CG150) — not during aura alone","Check NSAID risks (renal, GI, CV, pregnancy, anticoagulants). Repeat the triptan after 2 hours or more if it returns (maximum 2 doses in 24 hours). <b>Soluble or dispersible forms absorb faster in gastric stasis</b>"],
         ["<b>2nd — antiemetic when needed</b>","<b>Metoclopramide or prochlorperazine</b>","When nausea, vomiting or poor absorption limits oral treatment; non-oral forms (with a non-oral NSAID or triptan) if oral treatment fails or is not tolerated (CG150). Check age, dystonia risk, contraindications and duration limits"],
         ["<b>3rd — switch the triptan before abandoning the class</b>","Rizatriptan · eletriptan · zolmitriptan nasal (vomiting) · sumatriptan SC (severe or rapid attacks) · frovatriptan or naratriptan (longer half-life — recurrence-prone and menstrual)","Try one or more alternatives if a triptan is consistently ineffective or poorly tolerated (CG150); doses per SPC"],
         ["<b>4th — gepant rescue</b>","<b>Rimegepant 75 mg ODT (NICE TA919)</b>","Where 2 or more triptans have failed, or triptans are contraindicated or not tolerated, and NSAIDs and paracetamol have also been tried and not worked well enough — no vasoconstriction, so usable in ischaemic heart disease. Does not cause MOH at usual use"]
       ]},
       {b:"table", head:["Rule","Detail"], rows:[
         ["<b>Triptan contraindications</b>","Do not use in established ischaemic heart disease, cerebrovascular or peripheral vascular disease, or uncontrolled hypertension (product-specific — check the SPC). Suspected hemiplegic or brainstem migraine → specialist advice before prescribing. Age over 65 is a caution — vascular review first"],
         ["<b>Never</b>","Opioids (including codeine and co-codamol) and ergots — not for routine migraine treatment; they drive MOH and dependence. <b>An inherited co-codamol repeat is an action</b>"],
         ["<b>Timing</b>","Treat early in the headache phase — \"wait and see if it's a bad one\" is a common patient error"],
         ["<b>Count the days</b>","Every acute plan comes with the MOH limits said out loud AND written down"]
       ]}
     ]},

    {id:"moh", nav:"MOH", title:"Step 4 — unmask medication-overuse headache",
     sub:"The commonest reversible cause of apparently refractory migraine.",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>Suspect it</b>","Triptans, opioids or combination analgesics on 10 or more days a month, or simple analgesia on 15 or more, for over 3 months — the diary shows it instantly"],
         ["<b>The fix</b>","<b>Stop the overused drug abruptly for at least 1 month</b> in most cases — a planned taper for opioids or clinically significant withdrawal. Headaches may worsen at first: pre-warn and follow up closely. Opioid or sedative overuse, or failed previous withdrawal → consider specialist headache or addiction support"],
         ["<b>Support the withdrawal</b>","Consider starting prevention alongside withdrawal where indicated. If a short NSAID bridging course is used, document its duration, assess NSAID risk — and <b>still count those medication days</b>"],
         ["<b>Then reassess</b>","At 4–8 weeks: many \"chronic migraineurs\" revert to episodic once the rebound has gone — THEN judge whether prophylaxis is still needed"],
         ["<b>Prevent relapse</b>","The MOH conversation at every acute prescription; agree a maximum number of treatment days (ideally no more than 2 a week). The GM pathway's practical limit of about 6 triptan days a month is local policy, stricter than the diagnostic thresholds of 10 (triptans) and 15 (simple analgesics)"]
       ]},
       {b:"why", html:"MOH is the commonest reversible cause of \"refractory migraine\" in primary care. Escalating prophylaxis — or referring — without withdrawing the overuse fails, because the rebound drives the headache no matter what you add underneath it. <b>That is why this step sits before prophylaxis rather than after it.</b>"}
     ]},

    {id:"prophylaxis", nav:"Prophylaxis", title:"Step 5 — prophylaxis: adequate dose, adequate time, honest counselling",
     blocks:[
       {b:"info", html:"Consider when migraine is frequent, disabling, prolonged, linked to medication overuse, or acute treatment is ineffective, contraindicated or poorly tolerated (≥4 migraine days a month is a common BASH/local prompt). <b>Titrate to a tolerated therapeutic dose and allow enough time before judging</b> — about 3 months on the GM pathway. <b>Success is fewer attack days on the diary, not zero.</b> No mandatory order between the NICE options."},
       {b:"table", head:["Step","Agent","Detail"], rows:[
         ["<b>NICE options — propranolol, topiramate or amitriptyline, by shared decision</b>","<b>Propranolol MR 80 mg → 160 mg/day</b>, or <b>amitriptyline 10 mg nocte → titrate by 10–25 mg → 50–75 mg</b>","Avoid propranolol in asthma and bradycardia; caution in athletes (fatigue). Choose amitriptyline where sleep disturbance, tension-type overlap or low mood coexist — pre-warn about dry mouth and morning grogginess, and take it about 12 hours before waking rather than at midnight"],
         ["<b>Topiramate (NICE) · candesartan (off-label, local pathway)</b>","Doses per SPC and the GM headache pathway","Candesartan: evidence-supported off-label option, useful with hypertension or where topiramate should be avoided — check BP and U&amp;Es; <b>contraindicated in pregnancy</b>. Topiramate: teratogenic — <b>MHRA Pregnancy Prevention Programme</b> requirements apply, reduces COC efficacy, causes cognitive fog, weight loss, paraesthesia, renal stones and acute glaucoma (early eye pain → stop). In anyone who could conceive, discuss options carefully — both topiramate and candesartan must be avoided in pregnancy"],
         ["<b>3rd — third agent or combine</b>","The unused first- or second-line, or combine mechanisms (e.g. propranolol plus low-dose amitriptyline)","<b>Re-check MOH first — always.</b> A menstrual pattern calls for the hormonal strategies below rather than endless switching"],
         ["<b>4th — the CGRP era: refer</b>","CGRP treatments by appraisal (atogepant TA973; erenumab, fremanezumab, galcanezumab, eptinezumab; rimegepant prevention TA906 for episodic migraine with ≥4 and &lt;15 attacks a month) — generally after 3 preventives failed, not tolerated or unsuitable, with ≥4 migraine days a month","Botulinum toxin (TA260) is for chronic migraine only (≥15 headache days, ≥8 migraine, 3 failed preventives, MOH managed). Not interchangeable. NICE stopping rules apply (usually &lt;50% reduction at 12 weeks episodic, &lt;30% chronic). Refer per the local pathway"]
       ]},
       {b:"table", head:["Situation","Prophylaxis note"], rows:[
         ["<b>Withdrawing after success</b>","<b>6–12 months of good control → taper over 2–3 months and see.</b> Many stay well; agree the restart threshold in advance"],
         ["<b>Woman who could conceive</b>","Topiramate: MHRA Pregnancy Prevention Programme. <b>Candesartan is contraindicated in pregnancy</b> — avoid if pregnant or planning, and agree an alternative before conception. Folic acid and a plan BEFORE conception"],
         ["<b>Comorbid hypertension</b>","<b>Candesartan (off-label) or propranolol — one drug, two jobs</b>"],
         ["<b>Comorbid depression or insomnia</b>","<b>Amitriptyline — but treat the depression properly in its own right</b>. See <a href='depression.html'>depression</a>"],
         ["<b>Elderly</b>","Candesartan is tolerated best; amitriptyline adds anticholinergic burden and falls risk"]
       ]}
     ]},

    {id:"hormones", nav:"Hormones", title:"Step 6 — the hormonal interfaces",
     blocks:[
       {b:"table", head:["Situation","Management"], rows:[
         ["<b>Aura + combined hormonal contraception = UKMEC 4</b>","Do not initiate or continue CHC in confirmed aura — arrange alternative contraception through a contraception consultation. Migraine without aura is generally UKMEC 2 at initiation if no other vascular risk (check UKMEC). New focal symptoms on CHC → stop and assess urgently for alternative diagnoses while arranging contraception. See <a href='contraception.html'>contraception</a>"],
         ["<b>Menstrual migraine (diary-proven, −2 to +3 days)</b>","Treat acute attacks with a long-half-life triptan; or perimenstrual \"mini-prophylaxis\" — frovatriptan 2.5 mg BD or naratriptan 1 mg BD from 2 days before expected onset for 5–6 days; or a continuous hormonal strategy (extended-cycle CHC if NO aura, or oestrogen-stabilising approaches)"],
         ["<b>Pregnancy</b>","Migraine usually improves, especially without aura. Acute: paracetamol first; consider sumatriptan or an NSAID only after an individual risk–benefit discussion; no NSAIDs in the third trimester; antiemetics per pregnancy guidance. Prevention: specialist-guided (propranolol is often used); avoid topiramate and candesartan; do not start CGRP medicines without specialist advice. New, severe, atypical or changing headache → same-day assessment for pre-eclampsia and other secondary causes"],
         ["<b>Perimenopause</b>","Where HRT is indicated, transdermal oestrogen is preferred (a menopause-practice principle); aura is not an absolute contraindication to menopausal HRT — unlike CHC. HRT is not contraception; seek menopause or contraception advice if migraine is complex or aura is present. See <a href='hrt-prescribing.html'>HRT prescribing</a>"],
         ["<b>Breastfeeding</b>","Paracetamol and ibuprofen fine; sumatriptan compatible; propranolol compatible"]
       ]}
     ]},

    {id:"monitor", nav:"Review", title:"Step 7 — diary-led review",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["<b>Diary: attack days and acute-medication days</b>","<b>Every review</b>","The two numbers decide: escalate acute care, start or adjust prophylaxis, or unmask MOH"],
         ["<b>A new prophylactic</b>","<b>After adequate titration — about 3 months (GM pathway)</b>","Not at 2 weeks on the starting dose. Success = meaningfully fewer attack days"],
         ["<b>Acute treatment adequacy</b>","<b>Every review</b>","<b>Right triptan, taken early in the headache, with an NSAID or paracetamol if suitable, and an antiemetic if needed?</b>"],
         ["<b>Contraception and pregnancy plans</b>","<b>Every review in women of reproductive age</b>","<b>Aura status versus CHC; topiramate PPP; candesartan and pregnancy; pre-conception planning</b>"],
         ["<b>After 6–12 months of control</b>","<b>Planned</b>","<b>Taper prophylaxis over 2–3 months with an agreed restart threshold</b>"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 999 / same day", html:"\"Thunderclap headache — worst ever, maximal within minutes — call 999. Also fever with a stiff neck, new weakness or numbness, confusion, or a first fit.\""},
         {tone:"amber", h:"🟠 Contact us", html:"\"A headache that changes character, aura lasting over an hour, aura for the first time, or any new neurological symptom.\""},
         {tone:"blue", h:"💊 The two limits", html:"\"Triptans on no more than 10 days a month; paracetamol or ibuprofen on no more than 15. Beyond that the painkillers start causing the headaches.\""},
         {tone:"green", h:"⏱️ Take it early", html:"\"Treat early in the headache, at the full dose, with an anti-inflammatory or paracetamol alongside if suitable — waiting to see if it will be a bad one makes it work less well.\""}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Emergency — 999 or same day", html:"Thunderclap headache · suspected meningitis or encephalitis · new focal deficit · papilloedema · suspected GCA with visual symptoms · new headache or aura in pregnancy with pre-eclampsia features."},
         {tone:"amber", h:"Neurology — atypical aura", html:"After acute assessment of first or atypical aura (motor, brainstem, monocular, prolonged or first over 50) — for diagnosis and triptan-safety decisions."},
         {tone:"blue", h:"Headache clinic — the CGRP era", html:"Three preventives failed, not tolerated or unsuitable, with ≥4 migraine days a month → CGRP treatments per appraisal (atogepant, monoclonals, rimegepant for episodic) or, for chronic migraine, botulinum toxin — via the local headache pathway, with NICE stopping rules."},
         {tone:"amber", h:"Diagnostic doubt", html:"<b>Late onset, a changed pattern, or suspected cluster headache</b> — verapamil pathways and high-flow oxygen are specialist-led."},
         {tone:"cream", h:"GP management", html:"Diagnosis, the diary, acute treatment and triptan switching, MOH withdrawal, prophylaxis to target, the hormonal interfaces and the review rhythm all belong here. Related pages: <a href='tension-headache.html'>tension-type headache</a> · <a href='contraception.html'>contraception</a> · <a href='hrt-prescribing.html'>HRT prescribing</a> · <a href='giant-cell-arteritis.html'>giant cell arteritis</a> · <a href='depression.html'>depression</a> · <a href='../algorithms/headache.html'>headache pathway</a>."}
       ]},
       {b:"say", html:"You have given three preventers a proper try and migraine is still taking too many days — that is the group the newer preventers are for, and the specialist clinic starts them — they help many people but not everyone, and are stopped if they don't. Keep the diary going: it is the evidence that gets you treated fastest."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 29-year-old woman reports migraines \"getting worse\" — now <b>headache on about 20 days a month</b>. She takes <b>sumatriptan roughly 12 days a month</b> and <b>co-codamol most other days</b>, bought over the counter. She is on the <b>combined pill</b> and mentions that for the last few months she has been getting <b>\"zigzag lights\" for about 20 minutes before some headaches</b> — which is new. She asks to be referred to a neurologist for \"the new injections\"."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Recognises the new visual symptoms, considers whether they are aura or need urgent assessment, and stops the CHC — aura plus CHC is UKMEC 4 — arranging alternative contraception, rather than treating this as a headache-only consultation; counts the two numbers and recognises medication-overuse headache from both the triptan (12 days) and the co-codamol, asking specifically about what is bought rather than prescribed; <b>explains that MOH must be withdrawn BEFORE calling this refractory</b> — stop for at least a month, with initial worsening warned about, close follow-up, and prevention started alongside where indicated (any NSAID bridging still counts as medication days); <b>declines the immediate CGRP referral with a reason</b>, since three adequate prophylactic trials are the threshold and none has been tried; discusses propranolol, topiramate (with PPP) or amitriptyline and the need for adequate titration and time; stops the co-codamol explicitly and explains why opioids are the fastest route into MOH; issues a <b>headache diary</b>; and <b>safety-nets the thunderclap and focal-deficit triggers</b>."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE CG150 — Headaches in over 12s: diagnosis and management</b><br><a href="https://www.nice.org.uk/guidance/cg150" rel="noopener">nice.org.uk/guidance/cg150</a><span class="rd"> — the diagnostic criteria, triptan plus NSAID as the acute combination, the antiemetic recommendation, propranolol and topiramate (and amitriptyline) for prophylaxis, acupuncture as an option where drug prophylaxis is unsuitable, and the medication-overuse thresholds and withdrawal advice</span></li>'+
         '<li>British Association for the Study of Headache (BASH) national headache management system<span class="rd"> — the triptan-switching principle, the 6–8 week at-target prophylaxis trial, perimenstrual mini-prophylaxis with frovatriptan or naratriptan, and the 50% attack-day reduction as the success measure</span></li>'+
         '<li>NICE TA919 (rimegepant for acute migraine) and TA906 (rimegepant for prevention); TA682 (erenumab), TA764 (fremanezumab; replaced TA631), TA659 (galcanezumab), TA871 (eptinezumab) (CGRP monoclonals); TA260 (botulinum toxin for chronic migraine)<br><a href="https://www.nice.org.uk/guidance/ta919" rel="noopener">nice.org.uk/guidance/ta919</a><span class="rd"> — the gepant and CGRP indications, and the three-failed-preventives threshold</span></li>'+
         '<li><b>UK Medical Eligibility Criteria (UKMEC) for Contraceptive Use</b><br><a href="https://www.fsrh.org" rel="noopener">fsrh.org</a><span class="rd"> — migraine with aura as UKMEC 4 for combined hormonal contraception at any age, and migraine without aura as UKMEC 2 at initiation</span></li>'+
         '<li><b>NICE CG150 \u2014 Headaches in over 12s: diagnosis and management</b><br><a href="https://www.nice.org.uk/guidance/cg150" rel="noopener">nice.org.uk/guidance/cg150</a><span class="rd"> — the drug doses quoted, triptan contraindications, pregnancy and breastfeeding guidance, and the prophylaxis withdrawal schedule</span></li>'+
         '<li><b>MHRA Drug Safety Updates</b><span class="rd"> — topiramate Pregnancy Prevention Programme and its teratogenic and neurodevelopmental risks; metoclopramide duration limits and dystonia risk in young people</span></li>'+

  foot:"Migraine in adults — NICE CG150, BASH, TA919 and TA906 (rimegepant), TA764 and related CGRP appraisals, and UKMEC. Two numbers drive everything: attack days and acute-medication days. Treat attacks early with a triptan plus an NSAID or paracetamol where suitable, and try an alternative triptan before calling the class a failure. Opioids and ergots are not for routine use. Unmask medication-overuse headache before calling any migraine refractory. Judge prophylaxis after adequate titration and time (about 3 months on the GM pathway), not 2 weeks at the starting dose. Migraine with aura is UKMEC 4 for combined hormonal contraception at any age. Verify all doses against the current BNF before prescribing."
