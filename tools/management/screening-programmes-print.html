  stemSub:"NHS population screening programmes in England for primary-care clinicians: who is eligible and when (cervical HPV, breast mammography, bowel FIT, AAA ultrasound, diabetic eye, antenatal and newborn), targeted and opportunistic checks (NHS Health Check, Targeted Lung Health Checks, HIV and hepatitis testing), specialist-led enhanced surveillance (BRCA, Lynch syndrome, familial hypercholesterolaemia), responding to abnormal results, equitable uptake and closing the loop. This guide applies to England and summarises population screening programmes; it does not replace the national programme guidance, local pathways, clinical genetics advice, maternity guidance, DESP instructions or the suspected cancer pathway. Programme-specific operational details are subject to local service confirmation.",
  guideline:"NHS screening programmes (GOV.UK) · NHSCSP programme and colposcopy management · NICE NG12 · NICE CG164 · NICE NG156 · NICE NG242 · NICE NG238 · NICE NG60 · BSG/ACPGBI/UKCGG 2019 · UKHSA hepatitis B/C testing guidance",

  lead:"<div class='mg-layers'><a href='#safety'><b>Red flags</b><small>Symptoms · missed eligibility</small></a><a href='#programmes'><b>Programmes</b><small>Eligibility table</small></a><a href='#abnormal'><b>Abnormal results</b><small>HPV · FIT · AAA · DESP</small></a><a href='#uptake'><b>Uptake</b><small>Informed, equitable</small></a><a href='#followup'><b>Close the loop</b><small>Follow-up · QOF</small></a></div>",
  quickSub:"If you read nothing else on this page, read these six cards. Every figure traces to the source cited under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ Symptoms override a screening result", html:"Screening is for asymptomatic people — a symptomatic patient needs the relevant diagnostic or suspected cancer pathway, not screening. <b>Never reassure a symptomatic patient with a normal or recent screen</b> (e.g. a new breast lump despite a normal mammogram, rectal bleeding despite a recent FIT). <b>Symptomatic or tender AAA = emergency.</b>"},
    {tone:"blue", h:"Cancer screening programmes", html:"<b>Cervical</b> 25–64: every 3 years at 25–49, every 5 years at 50–64 (HPV primary screening) · <b>breast</b> 50 to the 71st birthday, every 3 years; 71+ self-refer · <b>bowel</b> FIT 50–74, every 2 years; 75+ on request · <b>AAA</b> men, once around 65."},
    {tone:"blue", h:"Other screening", html:"Antenatal and newborn screening in every pregnancy at defined gestations · diabetic eye screening (DESP) for people with diabetes from age 12, at least every 12 months · NHS Health Check 40–74, every 5 years · Targeted Lung Health Checks via the local programme."},
    {tone:"amber", h:"Abnormal screens belong to the programme", html:"Abnormal screens are usually managed by the programme (screening hub, breast screening service, colposcopy, DESP) — don't duplicate referral; ensure follow-up is completed and recorded. Do not conflate screening FIT with symptomatic FIT (≥10 µg Hb/g where NICE NG12 criteria apply)."},
    {tone:"amber", h:"Enhanced surveillance is specialist-led", html:"BRCA1/2, Lynch syndrome and familial hypercholesterolaemia surveillance is specialist-led, not population screening. Assess family history against NICE CG164 criteria and refer to clinical genetics or the lipid service where indicated; do not start aspirin 600 mg daily for Lynch syndrome in primary care."},
    {tone:"green", h:"Support informed choice — and close the loop", html:"Explain benefits, limitations, false positives/negatives and the option to decline; address inequalities in uptake; record declined screening without coercion. For every abnormal result record: result received, action required, who is responsible, patient informed, referral receipt confirmed, outcome and follow-up plan. A referral sent but not received is a patient safety event."}
  ],
  pathwaySub:"The whole consultation in five moves.",
  pathway:[
    {title:"Symptomatic patient? Stop — diagnostic pathway", html:"Screening is for asymptomatic people. Symptoms → investigate/refer via the diagnostic or suspected cancer pathway (do not reassure with a normal screen). Symptomatic or tender AAA = emergency.", alert:true},
    {title:"Identify the programme and check eligibility", html:"Identify the relevant programme by age/sex/risk; check eligibility and that the patient is up to date. History and examination guide management."},
    {title:"Support informed choice and equitable uptake", html:"Explain benefits, limitations, false positives/negatives and the option to decline. Offer interpreters and reasonable adjustments; offer screening opportunistically where relevant (not mandatory at every consultation)."},
    {title:"Act on abnormal results through the programme", html:"Screening hub, breast screening service, colposcopy and DESP own their abnormal results — don't duplicate referral. Enhanced surveillance (BRCA, Lynch, FH) is specialist-led."},
    {title:"Close the loop and safety-net", html:"Ensure abnormal results are actioned and the patient attends follow-up; have a fail-safe for non-attenders. Record result, action, responsibility, patient informed, referral receipt, outcome and follow-up plan."}
  ],
  sections:[
    {id:"safety", nav:"Red flags", title:"Red flags — missed eligibility and overdue screening",
     blocks:[
       {b:"warn", html:"⚠️ <b>A normal screen does not exclude disease in a symptomatic patient:</b> screening is for asymptomatic people — anyone with red-flag symptoms needs the diagnostic pathway, not reassurance."},
       {b:"p", html:"<b>Scope:</b> This guide applies to England and is intended to support primary-care clinicians. It summarises population screening programmes and does not replace the national programme guidance, local pathways, clinical genetics advice, maternity guidance, DESP instructions or the suspected cancer pathway. Screening is for people without symptoms; symptomatic patients require diagnostic assessment. Programme-specific operational details are subject to local service confirmation."},
       {b:"p", html:"<b>Principles:</b> screening is for asymptomatic populations · participation is voluntary · screening does not exclude disease · symptoms override a screening result · use current national and local programme pathways."},
       {b:"cards", items:[
         {tone:"amber", h:"Woman or person with a cervix aged 25-64 not on cervical screening register or overdue", html:"Invited every 3 years at 25-49 and every 5 years at 50-64. Offer screening equitably and opportunistically where relevant (not a mandatory check at every consultation). A suspicious cervix, unexplained postcoital bleeding or unexplained postmenopausal bleeding needs clinical assessment and referral irrespective of screening status — not a screening test."},
         {tone:"amber", h:"Patient age 50-74 not enrolled in bowel cancer screening or FIT kit not returned", html:"Invited every 2 years at 50-74; people aged 75 and over may request screening. Symptomatic patients follow NICE NG12 and the local diagnostic pathway, not screening. Non-participation is highest in deprived and ethnic minority communities."},
         {tone:"amber", h:"Woman aged 50 to 71st birthday with breast screening overdue, or prior LCIS / atypical hyperplasia", html:"Routine screening every 3 years from 50 until the 71st birthday; 71 and over can self-refer every 3 years. LCIS and atypical ductal hyperplasia do not automatically mean annual mammography plus MRI — surveillance depends on calculated risk, pathology, age and specialist breast-team assessment."},
         {tone:"red", h:"Pregnancy — woman not booked for antenatal screening by 10 weeks", html:"The combined screening test is offered at 11+2 to 14+1 weeks. Sickle cell/thalassaemia screening should be offered as early as possible, ideally by 10 weeks. Late presentation → urgent referral to maternity services."},
         {tone:"amber", h:"Person with diabetes not registered with DESP or not screened in past 12 months", html:"Screening is offered to people with diabetes from age 12, at least every 12 months; any 2-yearly interval for low-risk people must be confirmed against the current national DES programme specification and local arrangements. Ensure registration and act on DES reports. New visual symptoms need urgent clinical assessment — do not wait for routine DES."},
         {tone:"amber", h:"AAA screening not completed in man aged 65", html:"NHS AAAS invites men once, around age 65, for a single abdominal USS. Check programme status where relevant. Women and people not invited may need individual assessment where AAA is incidentally detected or risk is substantial. Symptomatic or tender AAA is an emergency."}
       ]},
       {b:"why", html:"Population screening is offered to people without symptoms and participation is a personal choice. Its impact depends on informed, equitable participation — offer screening opportunistically where relevant and address access barriers. HPV primary screening is used in England. An HPV-negative cervical screening sample has much stronger negative predictive value than cytology alone, but in England invitations remain every 3 years at 25-49 and every 5 years at 50-64. Targeted Lung Health Checks are locally phased: local programmes identify people by age and smoking history and use a risk assessment to decide on low-dose CT — use the local TLHC service."}
     ]},

    {id:"programmes", nav:"Programmes", title:"NHS population screening programmes — eligibility table",
     sub:"Quick reference (England) — eligibility/interval → GP action, then the programme detail.",
     blocks:[
       {b:"table", head:["Programme","Eligibility / interval","GP action"], rows:[
         ["<b>Cervical</b>","Cervix, age 25-64; 25-49 every 3 years, 50-64 every 5 years","Ensure invitation/recall status; manage results through NHSCSP pathway; investigate symptoms separately"],
         ["<b>Breast</b>","Women/eligible people 50 to 71st birthday, every 3 years; 71+ self-referral","Encourage attendance; symptomatic breast disease requires diagnostic referral"],
         ["<b>Bowel</b>","Age 50-74, FIT every 2 years; 75+ may request screening","Positive screening FIT usually managed by screening hub; symptomatic patients follow NG12/local pathway"],
         ["<b>AAA</b>","Men invited once around age 65","Check programme status where relevant; incidentally detected AAA requires appropriate vascular referral"],
         ["<b>Diabetic eye</b>","Diabetes from age 12; interval determined by DESP","Ensure registration and act on DESP reports; do not duplicate local grading/referral pathway"],
         ["<b>Antenatal</b>","Screening offered in every pregnancy at defined gestations","Urgently link late presenters with maternity services; growth scans are not universal"],
         ["<b>NHS Health Check</b>","Generally age 40-74, every 5 years, according to programme exclusions","Follow local authority specification; calculate risk and offer prevention interventions"],
         ["<b>TLHC</b>","Local programme age/smoking-risk criteria","Use local invitation/case-finding system; do not create ad hoc GP referral routes"]
       ]},
       {b:"table", head:["Programme","Detail"], rows:[
         ["<b>Cervical Screening (NHS CSP)</b>","Ages 25-64. Frequency (England): invitations every 3 years at 25-49 and every 5 years at 50-64. HPV primary screening (LBC sample) — if HPV is detected, cytology triage; HPV-positive/cytology-negative is generally repeated at 12 months; persistent HPV at the relevant follow-up point → colposcopy per the national pathway. HPV-negative management depends on context (routine screening, follow-up after a previous positive, or post-treatment test of cure). Women with previous CIN treatment: test of cure (HPV test) about 6 months after treatment — HPV-negative → recall in 3 years; HPV-positive → back to colposcopy (NHSCSP programme and colposcopy management). Transgender patients with a cervix: eligible on same criteria. People living with HIV: follow current NHS England cervical surveillance guidance and the specialist HIV/colposcopy pathway. A screening test is not a diagnostic test for symptomatic patients."],
         ["<b>Breast Screening (NHS BSP)</b>","From age 50 until the 71st birthday, every 3 years; people aged 71 and over can self-refer every 3 years. 2-view digital mammography. Age-extension (AgeX, 47-73) is a trial, not national policy. Very-high-risk familial surveillance through the NHS BSP (including lifetime risk of 40% or greater because of a specific genetic abnormality, e.g. BRCA1/2) is specialist high-risk surveillance after specialist risk assessment (NICE CG164) — not ordinary population screening."],
         ["<b>Bowel Cancer Screening (NHS BCSP)</b>","Ages 50-74, every 2 years; people aged 75 and over may request screening. Faecal immunochemical test (FIT) kit by post. Screening uses a higher FIT threshold than the symptomatic pathway (exact threshold subject to national programme confirmation); an abnormal result is managed by the screening hub/specialist screening practitioner pathway. Do not conflate screening FIT with symptomatic FIT: the symptomatic threshold of ≥10 µg Hb/g applies where NICE NG12 criteria apply. Bowel scope (flexible sigmoidoscopy) screening ended in England in 2021."],
         ["<b>Abdominal Aortic Aneurysm (NHS AAAS)</b>","Men invited once, around age 65. Abdominal USS. Aorta: &lt;3 cm normal; 3.0-4.4 cm = small; 4.5-5.4 cm = medium (programme surveillance; 3.0-5.4 cm → regional vascular service within 12 weeks); 5.5+ cm = large (vascular referral within 2 weeks). Symptomatic or tender AAA = emergency. Programme surveillance differs from NICE NG156 management of incidentally detected AAA — confirm follow-up with the local vascular service and screening programme."],
         ["<b>Diabetic Eye Screening (DESP)</b>","All people with diabetes aged 12 and over. Digital retinal photography at least every 12 months; any 2-yearly interval for low-risk people must be confirmed against the current national DES programme specification and local arrangements. Grading: R0 (none), R1 (background), R2 (pre-proliferative), R3 (proliferative), M1 (maculopathy). The screening service owns grading and referral to hospital eye services (local operational standards vary) — GPs should not independently interpret grades or refer solely from a screening report unless instructed; act on urgent advice from DESP."],
         ["<b>Antenatal Screening</b>","All pregnant women: Down/Edwards/Patau combined test 11+2 to 14+1 weeks. Sickle cell/thalassaemia offered as early as possible, ideally by 10 weeks; late presenters → urgent referral to maternity services. Infectious disease (HIV, hepatitis B, syphilis) at booking — antenatal rubella susceptibility screening ended in England in April 2016. Anomaly scan usually 18+0 to 20+6 weeks. Growth scans are not routine for all pregnancies — follow the relevant maternity pathway. NIPT is a contingent screening option after a higher-chance combined or quadruple test (NHS fetal anomaly screening pathway)."]
       ]},
       {b:"why", html:"The HPV primary screening workflow change: a sample tests for high-risk HPV first; HPV negative means very low cervical cancer risk and routine recall (every 3 years at 25-49, every 5 years at 50-64). HPV positive triggers reflex cytology on the same sample. HPV positive plus cytology negative = retest in 12 months (not discharge — monitoring required). HPV positive plus cytology abnormal = colposcopy referral. GPs should explain that HPV testing is more sensitive than cytology alone and that the result determines the next step."}
     ]},

    {id:"targeted", nav:"Targeted", title:"Targeted and opportunistic screening in primary care",
     blocks:[
       {b:"table", head:["Check","What to do"], rows:[
         ["<b>NHS Health Check</b>","Eligible: generally 40-74 years; exclusions according to the current NHS Health Check specification. Every 5 years. QRISK3 score, BP, BMI, smoking, alcohol, physical activity, cholesterol, HbA1c. QRISK3 ≥10% should prompt a cardiovascular risk discussion and consideration of lipid-lowering treatment according to NICE NG238 — not an automatic statin prescription. Commissioned by local authorities as a statutory public health function (often delivered by GP practices) — eligible people are invited every 5 years. Delivery arrangements vary — identify the local Bolton/Greater Manchester pathway. Not a diagnostic screen for all diseases."],
         ["<b>Lung Cancer Screening (TLHC)</b>","Local programmes identify people by age and smoking history, then perform a lung health check and risk assessment before deciding whether low-dose CT is indicated. Eligibility, invitation arrangements, recall intervals and programme availability are locally phased. Use the local TLHC case-finding and invitation process; do not refer smokers unless the local programme specifically requests this."],
         ["<b>HIV testing (opt-out)</b>","Follow the local HIV testing pathway. Offer opt-out HIV testing where nationally or locally commissioned, particularly in higher-prevalence areas and when clinically appropriate (NICE NG60). Ensure consent, confidentiality and a clear pathway for positive or indeterminate results. HIV self-testing kits (BioSure) for patients reluctant to attend. Late diagnosis (CD4 &lt;350) still common and drives onward transmission."],
         ["<b>Hepatitis B and C</b>","Use current UKHSA testing guidance. Risk groups include: people who inject drugs, currently or previously; people in prisons; people born in countries with intermediate/high prevalence; household or sexual contacts of people with hepatitis B; people with HIV or other blood-borne-virus risk; people with relevant transfusion or healthcare exposure; people with abnormal liver tests or clinical suspicion. Tattooing in an unregulated setting is part of the broader risk assessment, not an independent universal indication. DAAs cure hepatitis C in &gt;95%."],
         ["<b>Familial cancer syndromes</b>","Patients with a significant personal or family history of breast/ovarian, pancreatic or prostate cancer should be assessed against current NICE CG164 familial-cancer criteria (number, type, age at diagnosis and relationship of affected relatives) and referred to the local clinical genetics or family-history service where indicated. Do not arrange enhanced surveillance solely from an isolated family-history label or a diagnosis of atypical hyperplasia without specialist risk assessment. Lynch syndrome: universal tumour testing of colorectal cancers via current pathology/genetics pathways. FH: suspect with total cholesterol ≥7.5 mmol/L or LDL-C ≥4.9 mmol/L in adults after excluding secondary causes (see <a href='#surveillance'>Enhanced surveillance</a>)."]
       ]},
       {b:"why", html:"A QRISK3 of 10% or more should prompt a shared discussion about lipid-lowering treatment (NICE NG238); it is not an automatic statin prescription. The TLHC programme represents the most significant new cancer screening initiative since bowel scope — low-dose CT scanning detects lung cancers at stage I when curative surgery is feasible. GP practices in TLHC areas should use the local programme's case-finding and invitation process rather than creating ad hoc referral routes. Universal MMR IHC on CRC resections for Lynch syndrome identification is now standard in NHS pathology — GPs receiving pathology results for CRC patients should check whether MMR testing was performed and if MMR deficient, refer to clinical genetics for Lynch syndrome germline testing."}
     ]},

    {id:"surveillance", nav:"Enhanced surveillance", title:"Enhanced surveillance — specialist-led, separate from population screening",
     blocks:[
       {b:"table", head:["Group","Surveillance and management"], rows:[
         ["<b>High-risk breast — BRCA1/2</b>","Specialist high-risk surveillance, not ordinary population screening: for known BRCA1/2 pathogenic variants, annual breast MRI from age 30 to 49 and mammographic surveillance from age 40 to 69 (NICE CG164). Risk-reducing salpingo-oophorectomy: BRCA1 commonly around 35-40 years; BRCA2 commonly around 40-45 years — exact timing requires specialist genetics/gynaecology counselling. Risk-reducing mastectomy available for very high-risk patients. Chemoprevention (e.g. tamoxifen) per NICE CG164 after specialist discussion."],
         ["<b>Lynch syndrome — CRC surveillance</b>","Identified mainly through universal tumour testing and current pathology/genetics pathways. Confirmed Lynch syndrome requires specialist-led surveillance: colonoscopy generally every 2 years, with starting age and gene-specific recommendations from the genetics service. Routine annual pelvic ultrasound is not a reliable endometrial-cancer screening programme. Aspirin may be considered after specialist discussion — do not start 600 mg daily in primary care; dose, GI/renal risk, drug interactions and bleeding risk need individualised specialist-informed discussion (optimal dose uncertain — BSG/ACPGBI/UKCGG 2019; CAPP2, Burn et al., Lancet 2020). Risk-reducing hysterectomy and salpingo-oophorectomy require specialist gynaecology/genetics counselling."],
         ["<b>Familial hypercholesterolaemia (FH)</b>","Suspect FH with total cholesterol ≥7.5 mmol/L or LDL-C ≥4.9 mmol/L in adults, after excluding secondary causes, particularly where there is premature coronary disease in the patient or a first-degree relative, tendon xanthomata, or a relevant family history. Use Simon Broome or DLCN criteria and refer to the local lipid/genetics service where indicated. Genetic testing (LDLR, APOB, PCSK9). Cascade screening of first-degree relatives (50% inheritance risk). Treatment intensity and escalation follow NICE and the local Greater Manchester lipid pathway. PCSK9 inhibitor (evolocumab, alirocumab) for FH with CVD or intolerant of statins (NICE TA394)."],
         ["<b>Osteoporosis case-finding (not a screening programme)</b>","Osteoporosis case-finding is not a population screening programme. Use FRAX or QFracture to assess fracture risk where indicated. A fragility fracture, glucocorticoid exposure and other risk factors may require treatment or DEXA depending on age and clinical context. DEXA T-score: &gt;-1 normal; -1 to -2.5 osteopenia; &lt;-2.5 osteoporosis. Treatment decisions consider fracture history, renal function, dental issues, glucocorticoid exposure, contraindications and patient preference — follow current NICE osteoporosis guidance and the local formulary."]
       ]},
       {b:"why", html:"The aspirin-Lynch syndrome CAPP2 trial result is one of the most important chemoprevention findings in genetic cancer medicine: daily aspirin 600 mg OD taken for a minimum of 2 years reduced CRC incidence in Lynch syndrome carriers at 10-year follow-up (Burn et al., Lancet 2020: per-protocol hazard ratio 0.56, about a 44% reduction; intention-to-treat hazard ratio 0.65). The effect took approximately 4-5 years to manifest (consistent with aspirin's mechanism of reducing early polyp formation and reducing microsatellite instability-driven mutagenesis). NICE NG151 (2020) recommends considering daily aspirin for more than 2 years in Lynch syndrome (off-label), but it is not by itself a complete Lynch prescribing guideline. GPs should not prescribe 600 mg daily on their own initiative: dose, gastrointestinal/renal risk, drug interactions and bleeding risk require individualised specialist-informed discussion, and the optimal dose remains uncertain (BSG/ACPGBI/UKCGG 2019). The CAPP3 trial is currently testing lower doses (100 mg and 300 mg) which may achieve similar CRC prevention with fewer GI side effects."}
     ]},

    {id:"abnormal", nav:"Abnormal results", title:"Responding to abnormal screening results",
     sub:"Abnormal screens are usually managed by the programme (screening hub, breast screening service, colposcopy, DESP) — don't duplicate referral; ensure follow-up is completed and recorded.",
     blocks:[
       {b:"table", head:["Result","Action"], rows:[
         ["<b>HPV positive + cytology negative</b>","Retest in 12 months (not routine recall — monitor for HPV persistence). Persistent HPV at the relevant follow-up point → colposcopy per the national pathway. HPV-negative management depends on whether the result is from routine screening, surveillance after a previous positive result, or post-treatment test of cure — do not assume return to routine recall. Explain to patient: HPV is extremely common, most infections clear spontaneously, a positive HPV test is a monitoring flag not a cancer diagnosis."],
         ["<b>Abnormal bowel screening FIT</b>","Screening FIT (programme threshold subject to national programme confirmation): the programme hub arranges the specialist screening practitioner assessment and colonoscopy directly — the GP should not duplicate referral unless requested or the patient has symptoms requiring a diagnostic pathway; helpline 0800 707 6060. A symptomatic FIT of 10 µg Hb/g or more goes via the NG12 suspected cancer pathway instead. Pre-colonoscopy investigation is guided by the screening/colonoscopy service and the clinical presentation. Advise patient: FIT positive means closer look needed, not cancer diagnosis. A negative FIT does not exclude colorectal cancer in a symptomatic patient — persistent or concerning symptoms, iron-deficiency anaemia or a rectal mass need reassessment and safety-netting irrespective of FIT. Bowel prep instructions provided by BCSP."],
         ["<b>Small AAA 3.0-4.4 cm</b>","USS surveillance via the AAA screening programme. Symptomatic or tender AAA = emergency. Smoking cessation. Cardiovascular-risk management: BP control to the targets in NICE NG136 and statin (not proven drug treatment to prevent aneurysm expansion). Encourage appropriate physical activity — routine exercise restriction is not supported. Referral to the regional vascular service within 12 weeks of diagnosis (NICE NG156); medium aneurysms 4.5–5.4 cm are scanned 3-monthly. Letter to patient confirming they have been advised about the diagnosis and surveillance plan."],
         ["<b>Diabetic eye R1 (background retinopathy)</b>","DESP recall as set by the screening service. Optimise glycaemic control against an individualised HbA1c target (diabetes type, treatment, hypoglycaemia risk, age, frailty, pregnancy, comorbidity). BP control to the targets in NICE NG136 (NG17 in type 1 diabetes); manage lipids and renal risk per the individualised diabetes plan. Smoking cessation. Fenofibrate is not routine for R1: NICE NG242 supports consideration in selected people with type 2 diabetes and non-proliferative retinopathy. R1 does not require ophthalmology referral; new visual symptoms need urgent clinical assessment."]
       ]},
       {b:"why", html:"The post-treatment cervical surveillance protocol after LLETZ for CIN2/3 is mandatory and frequently misunderstood: HPV test at 6 months post-treatment (test of cure). HPV negative at 6 months = recall in 3 years (NHSCSP). HPV positive at 6 months = return to colposcopy. Do NOT discharge to routine recall immediately after treatment — post-treatment surveillance is mandatory. If HPV persists at test of cure, the colposcopy clinic directs further follow-up; annual testing for 10 years belonged to the older cytology-based follow-up, not the current HPV-based pathway. GPs should code the LLETZ treatment on the clinical record so that the screening programme can apply the correct recall interval. Women who had treatment before 2012 (pre-HPV testing era) need to ensure they are on the correct enhanced surveillance pathway."}
     ]},

    {id:"uptake", nav:"Uptake", title:"Informed choice and improving screening uptake",
     blocks:[
       {b:"cards", items:[
         {tone:"green", h:"Support, don't coerce", html:"<b>Support informed choice</b> — explain benefits, limitations, false positives/negatives and the option to decline. Proactively <b>address inequalities in uptake</b> (language, learning disability, accessibility, cultural concerns); offer interpreters and reasonable adjustments; record declined screening without coercion. Combine screening contacts with relevant <b>lifestyle and risk-factor advice</b> (smoking, alcohol, diet, activity) and ensure people know how to access results."}
       ]},
       {b:"table", head:["Area","What to do"], rows:[
         ["<b>Addressing non-participation</b>","Non-participation is highest in: deprived communities, ethnic minority populations, people with learning disabilities, homeless individuals, and those with severe mental illness. GP actions: identify eligibility; explain benefits and limitations; make reasonable adjustments; use interpreters; record declined screening without coercion; address access barriers; close the loop on abnormal results. Document screening discussions (SNOMED code). Language-accessible information (NHS Translate). LD annual health check includes screening status review. Flexible appointments. Home FIT kits. Female clinician for cervical screening by request."],
         ["<b>Learning disability annual health check</b>","NHS contractual requirement. Structured review includes: cervical screening, bowel screening, breast screening, diabetic eye screening, AAA status. Reasonable adjustments: longer appointments, plain English, carer involvement, supported decision-making. LD register coding = automatic recall in EMIS/SystmOne."],
         ["<b>NHS App and digital access</b>","Screening information available in the NHS App varies by programme — check what is currently available locally before advising patients."],
         ["<b>Practice-level monitoring</b>","QOF indicators, codes and targets: check against the current QOF business rules. Practice governance: named screening lead; annual audit; results workflow; monitoring of rejected/inadequate samples; review of patients lost to follow-up; local Bolton/Greater Manchester pathway links. NHS Health Check: all eligible 40-74 year olds invited every 5 years. Near-miss audit: review patients who had invasive cancer but had not participated in screening."]
       ]},
       {b:"why", html:"GPs can significantly improve population screening uptake through opportunistic promotion — research consistently shows that a recommendation from a trusted GP is the single most powerful motivator for screening participation. A brief statement during a consultation for an unrelated problem: 'I notice you are due for your cervical screening — would you like to talk about it or book an appointment?' supports informed choice without coercion. Practices that train clinical and administrative staff to raise screening opportunistically where relevant, alongside postal invitations, can improve equitable participation."}
     ]},

    {id:"support", nav:"Supporting patients", title:"Supporting patients through screening",
     blocks:[
       {b:"tiles", v:"life", items:[
         {t:"Reducing cervical screening anxiety", html:"The procedure is quick and may be uncomfortable but is not usually painful. HPV test is much more accurate than old cytology. Positive HPV result does not mean cancer. For patients with sexual trauma history: offer female clinician, extra time, or home HPV self-sampling where locally available (national implementation subject to published NHS England guidance)."},
         {t:"Mammogram reassurance", html:"Most women recalled for further assessment do not have cancer; recalls are managed by the breast screening service. Explain before screening: recall for further imaging does not mean cancer has been found. Breast Cancer Now and Macmillan provide peer support resources if cancer is confirmed."},
         {t:"Colonoscopy preparation", html:"Bowel prep (sodium picosulfate or PEG — split-dose protocol). Clear fluids only the day before. Nothing by mouth 4h before. Mild bleeding after polypectomy is normal for up to 2 weeks. Return immediately if: significant rectal bleeding, fever, severe abdominal pain (perforation signs — rare)."},
         {t:"Diabetic retinopathy prevention", html:"Glucose control against an individualised HbA1c target (UKPDS trial data are population-level, not an individual prediction). BP control to the targets in NICE NG136 (NG17 in type 1 diabetes). Smoking cessation. Physical activity: 150 min/week aerobic. GLP-1 agonists (semaglutide) improve HbA1c plus weight plus BP simultaneously."},
         {t:"AAA lifestyle modification", html:"Smoking is the strongest modifiable risk factor. NHS Stop Smoking Service referral at every AAA surveillance visit. Statin and BP control (NICE NG136) as cardiovascular-risk management, not proven to prevent aneurysm expansion. Encourage appropriate physical activity."},
         {t:"Screening fatigue in multimorbid patients", html:"For patients with limited life expectancy or significant frailty: shared decision-making about which screening programmes remain appropriate. Not self-referring for breast screening after the 71st birthday, or declining screening with significant frailty, is a reasonable informed choice. Focus on programmes with highest benefit relative to overall prognosis."},
         {t:"BRCA/Lynch lifestyle modifications", html:"BRCA carriers: contraceptive decisions should balance a possible breast-cancer risk against the reduction in ovarian-cancer risk and the patient's contraceptive needs (discuss with genetics). Lynch syndrome: aspirin may be considered after specialist discussion, with dose individualised (NICE NG151; CAPP2, Burn et al., Lancet 2020). Weight management: obesity increases CRC risk in Lynch. Colonoscopy adherence matters — ensure reminders match the interval set by the genetics service."},
         {t:"Post-abnormal result emotional support", html:"An abnormal screening result causes significant anxiety even when cancer is not confirmed. Acknowledge: this is worrying news even though most people with this result do not have cancer. Provide written information. PHQ-4 at follow-up. NHS Talking Therapies if health anxiety. Macmillan / cancer charity resources even before diagnosis is confirmed — many provide pre-diagnosis support."}
       ]},
       {b:"why", html:"Cancer screening-related anxiety is a significant healthcare burden — studies show that women recalled after an abnormal mammogram have measurable psychological distress for up to 3 years even when cancer is excluded. The GP's communication style at the point of discussing screening results has a lasting impact on patient wellbeing. Key communication principles: acknowledge the anxiety explicitly (do not minimise it); provide accurate probabilistic information (most recalled patients do not have cancer); give a clear timeline for next steps; and offer a follow-up appointment specifically to discuss concerns. For patients where cancer is confirmed, the transition from screening to diagnosis is a critical point requiring empathetic communication, clear information about the MDT pathway, and active signposting to clinical nurse specialists and patient support organisations."}
     ]},

    {id:"followup", nav:"Close the loop", title:"Follow-up, QOF standards and closing the loop",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Close the loop; don't falsely reassure", html:"<b>Ensure abnormal results are actioned</b> and the patient attends follow-up; have a fail-safe for non-attenders. <b>Never reassure a symptomatic patient with a normal or recent screen</b> — refer via the diagnostic/suspected cancer pathway (e.g. new breast lump despite normal mammogram, rectal bleeding despite a recent FIT). Offer screening opportunistically where relevant (not mandatory at every consultation). Record: result received, action required, who is responsible, patient informed, referral receipt confirmed, outcome and follow-up plan."}
       ]},
       {b:"table", head:["Area","Standard"], rows:[
         ["<b>QOF cervical screening</b>","Check exact indicators, codes and targets against the current QOF business rules. Monitor exception-coded patients. Annual audit — identify cohort most likely to benefit from outreach."],
         ["<b>Diabetic eye screening QOF</b>","Check current QOF business rules. GP responsibility: ensure all registered patients with diabetes are registered with the local DESP and that DES reports are acted on."],
         ["<b>Close the loop on referrals</b>","Any abnormal result — record: result received; action required; referral or recall responsibility; patient informed; referral receipt confirmed where appropriate; outcome and follow-up plan. Set an electronic recall to check the outcome at an interval adapted to the programme and local referral system. Document safety-netting. A referral sent but not received is a patient safety event."],
         ["<b>NHS Health Check performance</b>","Track: invitation sent, appointment attended, QRISK3 recorded, lipid-lowering discussion documented. Identify non-responders — telephone or SMS recall before written invitation. 5-year recall cycle must be active in clinical system."]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"red", h:"🔴 Urgent / emergency", html:"Symptomatic or tender AAA → emergency same day · AAA 5.5+ cm identified on USS → vascular referral within 2 weeks · Diabetic eye: act on urgent advice from the DES service; new visual symptoms → urgent clinical assessment · Clinically suspicious cervix → urgent referral via the local suspected-cancer pathway, without waiting for a screening result (cancer found at colposcopy is referred onward by the colposcopy service)"},
         {tone:"amber", h:"🟠 Suspected cancer pathway", html:"Symptomatic patients → suspected cancer pathway per NICE NG12 and local arrangements · Symptomatic FIT ≥10 µg Hb/g with NG12 criteria → suspected colorectal cancer pathway referral (colonoscopy is not the only possible investigation) · HPV positive plus abnormal cytology → colposcopy arranged through the NHSCSP pathway · Recall mammogram → managed by the breast screening service; GP referral only if symptomatic or directed by the service"}
       ]},
       {b:"why", html:"The clinical governance requirement for tracking screening referral outcomes is increasingly a CQC inspection priority — practices that cannot demonstrate systems for: (1) tracking abnormal screening results through to specialist review; (2) following up patients who do not attend their referral appointment; and (3) recording the outcome of the referral in the clinical record — are identified as having patient safety gaps. EMIS Health and SystmOne both have referral tracking modules that can be configured to flag outstanding referrals for clinical review. Practices should audit annually: how many abnormal screening results generated a referral, what proportion of those referrals have an outcome recorded, and how many patients did not attend and were not followed up."}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways",
     sub:"Direct patients to the relevant <b>national screening programme</b>; refer symptomatic patients via diagnostic/suspected cancer pathways regardless of recent screening. Symptomatic or tender AAA = emergency.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Same-day / urgent", html:"Symptomatic or tender AAA → emergency (not the routine 2-week pathway) · AAA 5.5+ cm → regional vascular service within 2 weeks (NICE NG156) · Diabetic eye: act on urgent advice from the DES service, which owns grading and referral · New visual symptoms in diabetes → urgent clinical assessment · Symptomatic patient with FIT ≥10 µg Hb/g → suspected cancer pathway referral (NICE NG12, updated April 2026)"},
         {tone:"red", h:"Suspected cancer pathway", html:"Symptomatic patients irrespective of screening status: clinically suspicious cervix, unexplained postcoital or postmenopausal bleeding, suspicious breast symptoms · Symptomatic FIT 10+ µg Hb/g where NG12 criteria apply (NICE NG12, updated April 2026) · Screening recalls (mammogram, colposcopy) are managed by the programme — do not duplicate unless symptomatic or directed by the screening service"},
         {tone:"amber", h:"Diagnostic pathways (separate from screening)", html:"Suspected cancer · symptomatic FIT · abnormal bleeding · suspicious breast symptoms · visual symptoms · symptomatic AAA"},
         {tone:"blue", h:"Clinical genetics", html:"Personal/family history of breast/ovarian, pancreatic or prostate cancer meeting NICE CG164 criteria · MMR-deficient tumour or suspected/confirmed Lynch syndrome · Suspected FH (Simon Broome or DLCN) → local lipid/genetics service · FAP (100+ adenomas or known APC mutation)"},
         {tone:"blue", h:"Colposcopy", html:"Arranged via the NHSCSP pathway: HPV positive plus cytology abnormal · Persistent HPV at the relevant follow-up point · Two consecutive inadequate cervical screening samples · Post-treatment surveillance abnormality"},
         {tone:"amber", h:"Vascular surgery", html:"AAA 3.0–5.4 cm → regional vascular service within 12 weeks (NICE NG156), alongside programme surveillance · Any AAA with rapid growth &gt;1 cm/year · Incidentally detected AAA (including women and people not invited) → vascular referral per NICE NG156; confirm follow-up with the local vascular service"},
         {tone:"green", h:"GP opportunistic actions", html:"Offer screening opportunistically where relevant (not at every consultation) · NHS Health Check 40-74 every 5 years (local authority specification) · TLHC via the local case-finding/invitation process · HIV opt-out testing where commissioned · HBV/HCV testing in UKHSA risk groups"}
       ]},
       {b:"say", html:"This referral is because the cervical screening test showed changes that need closer examination. Most women referred to colposcopy do not have cancer. The colposcopy allows us to identify and treat any changes before they ever become a problem."},
       {b:"why", html:"The colposcopy referral explanation is critical for patient wellbeing — approximately 50,000 colposcopies are performed annually in England. Approximately 60% show CIN1 or no significant lesion. Even CIN2/3 (requiring treatment) is pre-cancerous, not cancer. LLETZ treatment of CIN2/3 is curative in 95% and takes 15 minutes. The GP explanation above is the one that reduces anxiety."}
     ]},

         '<li><b>NICE NG151 — Colorectal cancer</b> (2020)<br><a href="https://www.nice.org.uk/guidance/ng151" rel="noopener">nice.org.uk/guidance/ng151</a><span class="rd"> — consider daily aspirin for more than 2 years in Lynch syndrome (off-label)</span></li>'+
         '<li><b>NICE CG71 — Familial hypercholesterolaemia</b> and <b>NICE TA394 — Evolocumab</b><br><a href="https://www.nice.org.uk/guidance/cg71" rel="noopener">nice.org.uk/guidance/cg71</a> · <a href="https://www.nice.org.uk/guidance/ta394" rel="noopener">nice.org.uk/guidance/ta394</a><span class="rd"> — FH identification, cascade testing, PCSK9 inhibitors</span></li>'+

  foot:"NHS screening programmes in England for primary care. Applies to England; does not replace national programme guidance, local pathways, clinical genetics advice, maternity guidance, DESP instructions or the suspected cancer pathway. Programme-specific operational details are subject to local service confirmation. Screening is for asymptomatic people — symptomatic patients follow the diagnostic or suspected cancer pathway regardless of recent screening; symptomatic or tender AAA is an emergency. Abnormal screens are managed by the programme; enhanced surveillance (BRCA, Lynch, FH) is specialist-led. Sources: GOV.UK NHS screening programmes, NHSCSP programme and colposcopy management, NICE CG164, NG12, NG156, NG242, NG238, NG60, NG136, NG151, CG71, TA394, BSG/ACPGBI/UKCGG (2019), CAPP2 (Lancet 2020), UKHSA, GMMMG."
