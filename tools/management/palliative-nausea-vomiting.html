<script>
MG.render({
  icon:"\u{1F54A}️",
  title:"Nausea and vomiting in palliative care",
  eyebrow:"Protocol · community palliative care",
  stemTitle:"Palliative nausea &amp; vomiting — find the cause, then pick the antiemetic by mechanism",
  stemSub:"One page for the GP managing nausea and vomiting in someone with advanced illness at home or in a care home. Look for a reversible cause first, choose the antiemetic that matches the likely mechanism, give it regularly and by a route that works (subcutaneous when vomiting), and recognise malignant bowel obstruction early. <b>Doses and syringe-pump combinations must follow the current NHS Greater Manchester palliative-care formulary and local compatibility guidance.</b> Doses quoted on this page are from the Scottish Palliative Care Guidelines (2025), used as supporting evidence only — not the sole dosing authority for this English pathway. Many listed palliative uses and SC regimens are off-label.",
  guideline:"GMMMG Palliative Care Pain and Symptom Control Guidelines (2025) · NICE NG31 (2015) · MHRA DSU 2013/2014 · Scottish Palliative Care Guidelines 2025 (supporting)",
  meta:[
    {t:"Scottish Palliative Care Guidelines — Nausea &amp; vomiting (2025)"},
    {t:"NICE NG31 · Care of dying adults (2015)"},
    {t:"MHRA DSU · metoclopramide 2013 · domperidone 2014", tone:"tw"},
    {t:"Doses: GM palliative formulary first; Scottish PCG 2025 supporting"},
    {t:"Many palliative uses and SC regimens are off-label", tone:"tw"}
  ],
  lead:'<div class="mg-layers"><a href="#cause"><b>Find the cause</b><small>Reversible first</small></a><a href="#mechanism"><b>Match the drug</b><small>Mechanism → antiemetic</small></a><a href="#route"><b>Route</b><small>SC / syringe pump</small></a><a href="#mbo"><b>Bowel obstruction</b><small>Red flags · refer</small></a></div>',
  glance:[
    {lbl:"Gastric stasis", val:"Prokinetic", sub:"metoclopramide — only once obstruction and colic are excluded"},
    {lbl:"Chemical / metabolic / drugs", val:"Haloperidol", sub:"a common choice — D2 at the chemoreceptor trigger zone"},
    {lbl:"Raised ICP / vestibular / movement", val:"Cyclizine", sub:"H1 + antimuscarinic, vomiting centre"},
    {lbl:"Mixed / unclear / refractory", val:"Levomepromazine", sub:"broad-spectrum, sedating; or specialist-guided combination"},
    {lbl:"Anxiety / anticipatory", val:"Address the fear", sub:"explanation ± anxiolytic"},
    {lbl:"Vomiting or can't swallow", val:"Subcutaneous", sub:"PRN SC or syringe pump (CSCI)"}
  ],
  quickSub:"If you read nothing else on this page, read these five cards.",
  quick:[
    {tone:"red", h:"⚠ Think bowel obstruction", html:"Colicky pain, distension, large-volume or faeculent vomiting, and absent or reduced flatus and stool in someone with abdominal or pelvic cancer → <b>suspect malignant bowel obstruction</b>. <b>Do not use metoclopramide in complete or suspected high-grade obstruction, or when there is colic</b>, and <b>stop stimulant and bulk-forming laxatives</b>. Discuss urgently with specialist palliative care and, if the person is fit and wishes it, the surgical team. Not every suspected obstruction needs admission — the setting depends on reversibility, prognosis, performance status, the person's wishes, whether surgery, stenting or decompression would help, and the agreed place of care."},
    {tone:"amber", h:"Treat the cause before the symptom", html:"Look for <b>constipation</b> (examine; PR if appropriate), <b>hypercalcaemia</b> (corrected calcium), <b>new or increased opioid</b>, other drugs, infection, <b>renal failure</b>, raised intracranial pressure, obstruction and gastritis — always reassess these, because they are common and potentially treatable contributors. The antiemetic is chosen for the cause — so the assessment <em>is</em> the prescription."},
    {tone:"blue", h:"Match the drug to the mechanism", html:"Gastric stasis → <b>metoclopramide</b>. Chemical / metabolic / drug-induced → <b>haloperidol</b> (a common choice). Vestibular or movement-related → <b>cyclizine</b>; raised ICP → specialist assessment (cyclizine, ± dexamethasone depending on cause). Mixed, unclear or not settling → <b>levomepromazine</b> or specialist-guided combination. Chemotherapy/radiotherapy → the oncology regimen; obstruction → specialist-led. For persistent nausea give it <b>regularly</b> with a PRN dose; PRN alone may suit intermittent or anticipatory nausea. Response is not perfectly predictable."},
    {tone:"blue", h:"Vomiting? The tablet isn't getting in", html:"If the person is vomiting or can't swallow, switch to <b>subcutaneous</b> PRN doses and consider a <b>continuous subcutaneous infusion (syringe pump)</b> when repeated PRN doses are needed, symptoms are persistent, oral treatment is not possible, or reliable continuous control is required (NICE NG31). Check local compatibility before mixing. Leave <b>anticipatory</b> antiemetic prescriptions in the home."},
    {tone:"amber", h:"Know the MHRA limits — and govern off-label use", html:"Metoclopramide: main concern is <b>neurological</b> — extrapyramidal effects and tardive dyskinesia; licensed short-term (up to 5 days), lowest dose (MHRA 2013). Domperidone: main concern is <b>QT/cardiac</b>, lowest dose, usually no more than 7 days (MHRA 2014). Palliative use may be off-label — record the indication, route, dose, duration and review plan, and monitor. <b>Parkinson's disease: avoid centrally acting dopamine antagonists and seek specialist advice; domperidone only after cardiac-risk assessment.</b>"}
  ],
  pathwaySub:"The consultation in six moves. The red step is the one that changes the whole plan.",
  pathway:[
    {title:"Characterise the symptom", html:"Nausea or vomiting or both? Pattern (constant vs intermittent), volume and content of vomits, relation to food, movement, opioids or position. Early satiety, fullness and relief after large vomits point to gastric stasis; constant nausea with little vomiting points to a chemical cause."},
    {title:"Screen for obstruction and emergencies", html:"Colic, distension, faeculent vomiting, no flatus → malignant bowel obstruction. Headache worse in the morning with neurological signs → raised ICP. Confusion, thirst, polyuria, constipation → hypercalcaemia. These change the drug and the setting of care.", alert:true},
    {title:"Look for reversible causes", html:"Examine the abdomen and mouth (candida), check the drug chart (new opioid, antibiotics, SSRIs, NSAIDs, iron, digoxin), consider bloods if they would change management: U&amp;E, corrected calcium, LFTs, glucose, CRP."},
    {title:"Choose by mechanism", html:"Pick one antiemetic that fits the likely cause. For persistent nausea prescribe it regularly plus a PRN dose (PRN alone may suit intermittent or anticipatory nausea), by a route that works. Add non-drug measures."},
    {title:"Review in 24–48 hours", html:"Not better? Check it was taken and absorbed, re-assess the cause, then switch class or move to a broad-spectrum agent. Avoid combining drugs that oppose or duplicate each other."},
    {title:"Plan ahead", html:"Anticipatory SC antiemetic in the home, syringe pump if needed, hydration discussed against goals of care, specialist palliative care early for refractory symptoms, suspected obstruction, Parkinson's disease, complex renal impairment, QT-risk combinations or syringe-pump incompatibility. In the last days follow <a href='care-of-the-dying.html'>care of the dying</a>."}
  ],
  sections:[

    {id:"cause", nav:"Find the cause", title:"Assessment — find the likely cause first", sub:"The antiemetic follows the cause and its receptor pathway. Assess before prescribing, and always treat what is reversible.",
     blocks:[
       {b:"table", head:["Likely cause","Clues","Pathway / receptor","Usual first choice"], rows:[
         ["<b>Gastric stasis / functional outflow problem</b>","Early satiety, fullness, epigastric discomfort, hiccups, large-volume vomits that relieve nausea; opioids, ascites, hepatomegaly, autonomic neuropathy","Gut — dopamine (D2) and 5HT4","Prokinetic: metoclopramide, provided obstruction and colic are excluded"],
         ["<b>Chemical / metabolic / drug-induced</b>","Constant nausea, little relief from vomiting; opioids, hypercalcaemia, uraemia, liver failure, sepsis, other drugs","Chemoreceptor trigger zone — D2","Haloperidol is a common choice. Opioid nausea may also improve with time, dose adjustment, rotation, a different route or treating constipation"],
         ["<b>Raised intracranial pressure</b>","Headache (often morning), vomiting without much nausea, focal neurology, known brain tumour or metastases","Vomiting centre — H1, muscarinic","Specialist assessment; cyclizine may be used, and dexamethasone may be indicated depending on the cause"],
         ["<b>Vestibular / movement-related</b>","Worse on moving or turning the head, vertigo, skull-base disease, opioid-related movement sickness","Vestibular — H1, muscarinic","Cyclizine"],
         ["<b>Bowel obstruction</b>","Colic, distension, altered bowel habit, faeculent vomits, abdominal or pelvic tumour","Mechanical / vagal afferents","Specialist-led regimen, often hyoscine butylbromide and, where appropriate, octreotide — see the bowel obstruction section"],
         ["<b>Mixed / unclear / refractory</b>","Several possible causes, or first-line treatment not working","Multiple","Levomepromazine or specialist-guided combination therapy"],
         ["<b>Chemotherapy / radiotherapy</b>","Recent or ongoing oncology treatment","5HT3 (gut and CTZ)","Follow the oncology antiemetic regimen, not the general palliative algorithm; 5HT3 antagonist (e.g. ondansetron) usually belongs here"],
         ["<b>Anxiety / anticipatory</b>","Nausea before appointments or treatment, fear, panic","Cortical","Explanation, reassurance; anxiolytic if needed"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"Reversible causes to look for every time", html:"<b>Constipation</b> (common and often missed), <b>hypercalcaemia</b>, <b>opioid initiation or dose increase</b>, other <b>drugs</b>, <b>infection</b> (including urinary and oral candida), <b>raised intracranial pressure</b>, <b>renal failure</b> (uraemia and accumulation of drugs), gastritis or peptic ulcer, and severe cough. Treat what can be treated.", src:"Scottish Palliative Care Guidelines 2025: Nausea and vomiting"},
         {tone:"blue", h:"Examination that changes the plan", html:"Abdomen for distension, masses, tenderness, bowel sounds and hepatomegaly; rectal examination where faecal loading is suspected and it is acceptable to the person; mouth for candida and ulcers; hydration; neurological signs; the drug chart and any recent changes."},
         {tone:"blue", h:"Bloods — only if they change management", html:"U&amp;E and creatinine, <b>corrected calcium</b>, LFTs, glucose and CRP when you would act on the result. In the last days of life, avoid investigations that are unlikely to affect care unless there is a clinical need.", src:"NICE NG31"},
         {tone:"blue", h:"Assess in the dying person too", html:"In the last days of life, still assess for the likely causes of nausea and vomiting, including medicines that may be contributing, and discuss the options with the person and those important to them.", src:"NICE NG31"}
       ]},
       {b:"why", html:"Most palliative nausea is multifactorial, but naming the dominant mechanism helps choose the first drug, although antiemetic response is not perfectly predictable. Always reassess constipation, recent opioid changes, hypercalcaemia, renal impairment, infection and obstruction, because these are common and potentially treatable contributors."}
     ]},

    {id:"reversible", nav:"Reversible causes", title:"Reversible causes — what to do about each", sub:"Correcting the cause often works better than any antiemetic.",
     blocks:[
       {b:"table", head:["Cause","What to check","Action"], rows:[
         ["<b>Constipation</b>","Bowel history, abdominal examination, PR if appropriate","Treat constipation actively; review opioid laxative co-prescription. See <a href='palliative-constipation.html'>palliative constipation</a>"],
         ["<b>Hypercalcaemia</b>","Corrected calcium; thirst, polyuria, confusion, drowsiness, constipation","Usually needs hospital or hospice admission for IV fluids and a bisphosphonate if in keeping with goals of care; haloperidol for the nausea meanwhile"],
         ["<b>Opioid started or increased</b>","Timing; opioid nausea often improves with time","May improve with time, opioid dose adjustment, opioid rotation (with specialist advice), a different route or treating constipation; a mechanism-appropriate antiemetic (haloperidol is common) meanwhile — haloperidol is not always first-line. See <a href='palliative-pain.html'>palliative pain</a>"],
         ["<b>Other drugs</b>","Antibiotics, SSRIs, NSAIDs, iron, digoxin, carbamazepine, chemotherapy","Stop, reduce or switch if possible; check digoxin level if toxicity is possible"],
         ["<b>Infection</b>","Urine, chest, oral candida","Treat if in keeping with goals of care"],
         ["<b>Raised intracranial pressure</b>","Known brain tumour or metastases, headache, neurology","Cyclizine; dexamethasone and imaging or oncology discussion as appropriate. See <a href='palliative-corticosteroids.html'>corticosteroids</a>"],
         ["<b>Renal failure / uraemia</b>","U&amp;E, drug accumulation","Lower antiemetic doses; review renally cleared drugs (including opioids)"],
         ["<b>Gastritis / peptic ulcer</b>","NSAIDs, steroids, dyspepsia","PPI; review NSAID and steroid"],
         ["<b>Anxiety</b>","Anticipatory pattern, fear of what's happening","Explain, explore fears; consider an anxiolytic. See <a href='palliative-anxiety-depression.html'>anxiety &amp; depression</a>"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"red", h:"Hypercalcaemia is easily missed", html:"Nausea, constipation, confusion and drowsiness are easily attributed to “the cancer” or opioids. Check a corrected calcium when these cluster, particularly with myeloma, breast, lung or renal cancer or bone metastases, and discuss admission if treatment is appropriate."},
         {tone:"amber", h:"Drugs can cause and complicate it", html:"Review every medicine. Certain drugs worsen other conditions: for example <b>cyclizine may exacerbate heart failure</b>, which matters when choosing an antiemetic for someone with cardiac disease.", src:"NICE NG31"}
       ]}
     ]},

    {id:"nondrug", nav:"Non-drug", title:"Non-drug measures", sub:"An integral part of control, not an afterthought.",
     blocks:[
       {b:"tiles", v:"life", items:[
         {t:"\u{1F37D}️ Eating environment", html:"Small, frequent meals; avoid strong cooking smells; cool, bland food; a calm environment. Don't pressure the person to eat."},
         {t:"\u{1F9CA} Comfort", html:"Good mouth care, fresh air, sips of cold drinks, ice chips; acupressure wrist bands if the person finds them helpful."},
         {t:"\u{1F9E0} Anxiety", html:"Explain what is causing the sickness and what the plan is. Anxiety worsens nausea and is worth addressing directly."},
         {t:"\u{1F6BD} Practical", html:"A bowl and tissues within reach, protect bedding, help with positioning in the drowsy patient to reduce aspiration risk."},
         {t:"\u{1F4CB} Carers need a plan", html:"Tell carers what to do if vomiting starts: which PRN medicine, who to ring in and out of hours, and when to call urgently. Check the anticipatory medicines and the authorisation chart are in the home."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"green", h:"Discuss and consider non-drug methods", html:"Discuss the options for treating nausea and vomiting with the dying person and those important to them, and consider non-pharmacological methods alongside medicines.", src:"NICE NG31"},
       ]}
     ]},

    {id:"mechanism", nav:"Match the drug", title:"First-line antiemetic by mechanism", sub:"One drug that fits the cause, given regularly with a PRN dose for persistent nausea. Indicative doses from the Scottish Palliative Care Guidelines (2025) — follow the current NHS Greater Manchester palliative-care formulary, local compatibility guidance and current SPCs before prescribing; many uses are off-label.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Gastric stasis", title:"Metoclopramide (prokinetic)", when:"fullness, early satiety, large-volume vomits, opioids",
          html:"<b>Metoclopramide 10 mg orally up to four times a day</b>, or <b>30–60 mg over 24 hours by subcutaneous infusion</b> (unlicensed route, dose and duration) (Scottish PCG 2025). In renal or hepatic failure start at <b>5 mg up to three times a day</b>. <b>Do not use in complete or suspected high-grade bowel obstruction, or when there is colic</b>; stop if colic develops. Off-label palliative use (gastric stasis or opioid-related nausea when benefit outweighs risk): record the indication, route, dose, duration and review plan; use the lowest effective dose; monitor for akathisia, dystonia, parkinsonism and abnormal movements, and stop or reduce if these occur. Avoid routinely combining with an anticholinergic such as cyclizine when gastric stasis is the target — it may oppose the prokinetic action and increase adverse effects. Domperidone <b>10 mg orally up to three times a day</b> may be considered in selected patients, including some people with Parkinson’s disease or other akinetic-rigid disorders, or where the risk of extrapyramidal effects or tardive dyskinesia is high — only after cardiac and interaction risk has been assessed, within the MHRA restrictions (Scottish PCG 2025). It is oral only and not suitable as the rescue route when the person is persistently vomiting or unable to swallow."},
         {step:"Chemical / metabolic", title:"Haloperidol", when:"opioids, hypercalcaemia, uraemia, drugs, sepsis",
          fromLabel:"CTZ-mediated nausea",
          html:"<b>Haloperidol 500 micrograms orally at night or twice daily</b>, or <b>500 micrograms–1 mg subcutaneously daily</b>, or <b>1 mg over 24 hours by subcutaneous infusion</b>, titrated to effect; lower doses in renal failure and in older or frail people (Scottish PCG 2025). Potent D2 antagonist at low dose; a common choice, not automatically first-line for opioid nausea. Can prolong the QT interval. <b>Avoid in Parkinson's disease</b> and Parkinson-plus syndromes unless specialist advice specifically supports it."},
         {step:"Raised ICP / vestibular", title:"Cyclizine", when:"raised ICP, motion-related, vestibular; mechanical causes",
          fromLabel:"vomiting-centre mediated",
          html:"<b>Cyclizine 25–50 mg orally or subcutaneously three times a day</b>, or <b>50–150 mg over 24 hours by subcutaneous infusion</b> (Scottish PCG 2025; SC route unlicensed). Antihistamine and antimuscarinic: dry mouth, drowsiness, may worsen heart failure. Particularly prone to compatibility and precipitation problems in syringe pumps — local pharmacy guidance takes precedence. For raised ICP, seek specialist assessment."},
         {step:"Mixed / refractory", title:"Levomepromazine (broad-spectrum)", when:"cause unclear, multiple causes, or first-line failed",
          fromLabel:"broad-spectrum",
          html:"<b>Levomepromazine 2.5–6.25 mg orally at night or twice daily</b>; <b>2.5 mg SC 12-hourly as needed</b> (more often initially, e.g. 3-hourly, to gain control); or <b>5–10 mg over 24 hours by subcutaneous infusion</b> (Scottish PCG 2025). Sedating and can cause postural hypotension — warn the person and carers. Can prolong the QT interval. Alternatively, specialist-guided combination therapy."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Chemotherapy and radiotherapy", html:"Nausea linked to current oncology treatment should follow the oncology team's regimen; contact the acute oncology service if it is uncontrolled. 5HT3 antagonists such as ondansetron are <b>constipating</b> — co-prescribe a laxative and do not use as a default long-term palliative antiemetic. Dose per local palliative formulary / BNF."},
         {tone:"blue", h:"Dexamethasone as an adjunct", html:"Corticosteroids are used for raised intracranial pressure and as adjuvant antiemetics, including in bowel obstruction, usually with specialist advice. Dose per BNF or specialist; give in the morning, review the need regularly and monitor glucose. See <a href='palliative-corticosteroids.html'>palliative corticosteroids</a>."},
         {tone:"amber", h:"Don't routinely combine prokinetic and anticholinergic", html:"Avoid routinely combining metoclopramide with an anticholinergic such as cyclizine (or hyoscine) when gastric stasis is the target, because the anticholinergic effect may oppose the desired prokinetic action and increase adverse effects.", src:"Scottish Palliative Care Guidelines 2025: Nausea and vomiting"},
         {tone:"amber", h:"Don't stack dopamine antagonists", html:"Metoclopramide, haloperidol, levomepromazine and prochlorperazine all block D2. Combining them multiplies extrapyramidal and sedative effects — <b>switch within the class rather than add</b>, and involve specialists for combinations."}
       ]},
       {b:"why", html:"Each antiemetic acts at a different site: prokinetics on the gut, haloperidol on the chemoreceptor trigger zone, cyclizine on the vomiting centre and vestibular apparatus. Response is not perfectly predictable, but a drug aimed at the wrong site is less likely to work — which is why a cyclizine prescription for opioid nausea, or a haloperidol prescription for gastric stasis, often fails."}
     ]},

    {id:"notsettling", nav:"Not settling", title:"Not settling — switch, combine or go broad", sub:"Reassess at 24–48 hours. The fault is usually the route, the regularity or the diagnosis, not the dose.",
     blocks:[
       {b:"ladder", steps:[
         {step:"2a", title:"Is it being taken and absorbed?", when:"first check",
          html:"Is the antiemetic given <b>regularly</b> rather than PRN only? Is the person vomiting it back? If so, switch to the <b>subcutaneous</b> route. Allow 24–48 hours on an adequate dose and keep treating reversible causes."},
         {step:"2b", title:"Re-assess the cause and switch class", when:"wrong target",
          fromLabel:"no response",
          html:"Re-take the history: has obstruction developed? has calcium risen? a new drug? Switch to the drug that fits the revised mechanism, e.g. metoclopramide → haloperidol."},
         {step:"2c", title:"Combine two drugs with different actions", when:"partial response",
          fromLabel:"first-line partly effective",
          html:"If first-line treatment is only partly effective, a combination of antiemetics with <b>different</b> mechanisms may be appropriate (e.g. haloperidol with cyclizine) — avoid routinely combining a prokinetic with an anticholinergic, and not two D2 antagonists; review the cumulative QT risk."},
         {step:"2d", title:"Levomepromazine", when:"refractory or multifactorial",
          fromLabel:"failed single agents",
          html:"Replace, rather than add to, other D2 antagonists. Broad-spectrum; sedating at higher doses."},
         {step:"2e", title:"Specialist palliative care", when:"still uncontrolled",
          fromLabel:"escalate",
          html:"Refractory symptoms, complex syringe pump combinations or incompatibility, suspected obstruction, Parkinson's disease, complex renal impairment or QT-risk combinations → phone the community specialist palliative care team or hospice advice line.", warn:"Don't keep adding drugs at home without a named plan."}
       ]},
       {b:"cards", cols:2, items:[
         {tone:"cream", h:"Combinations are legitimate when partial", html:"If first-line treatment is only partly effective, a combination of antiemetics may be appropriate — choose drugs with different receptor actions and review the whole regimen.", src:"Scottish Palliative Care Guidelines 2025: Nausea and vomiting"},
         {tone:"cream", h:"Hydration", html:"Assess hydration. Discuss the risks and benefits of clinically assisted hydration with the person and those important to them in the context of their goals of care; subcutaneous fluids are an option in some community settings.", src:"NICE NG31"}
       ]}
     ]},

    {id:"route", nav:"Route", title:"Route — subcutaneous and syringe pump", sub:"When someone is vomiting, oral antiemetics are unreliable. Move to subcutaneous early rather than late.",
     blocks:[
       {b:"table", head:["Antiemetic","Oral","SC PRN / regular","CSCI over 24 h"], rows:[
         ["<b>Metoclopramide</b>","10 mg up to four times a day (5 mg up to three times a day in renal or hepatic failure)","Dose per local palliative formulary / BNF","30–60 mg (unlicensed; not in complete obstruction or colic)"],
         ["<b>Haloperidol</b>","500 micrograms at night or twice daily","500 micrograms–1 mg daily","1 mg, titrated to effect"],
         ["<b>Cyclizine</b>","25–50 mg three times a day","25–50 mg three times a day (unlicensed route)","50–150 mg (unlicensed route); prone to precipitation — check local compatibility guidance"],
         ["<b>Levomepromazine</b>","2.5–6.25 mg at night or twice daily","2.5 mg 12-hourly as needed (more often initially)","5–10 mg"]
       ]},
       {b:"warn", html:"Indicative doses from the Scottish Palliative Care Guidelines nausea and vomiting guideline (2025), used as supporting evidence only. <b>Doses and syringe-pump combinations must follow the current NHS Greater Manchester palliative-care formulary and local compatibility guidance</b>, and current SPCs; listed SC and CSCI regimens may be off-label. Lower doses in older, frail and renally impaired people. Check compatibility before mixing — do not use a mixture solely because it is commonly used elsewhere — and involve the community palliative-care team or pharmacist where there is any uncertainty."},
       {b:"cards", cols:2, items:[
         {tone:"blue", h:"Anticipatory prescribing", html:"When someone is likely to need them, prescribe anticipatory medicines — including an antiemetic — with the route, dose and indications clearly stated, so community nurses can give them without delay out of hours.", src:"NICE NG31"},
         {tone:"blue", h:"When to start a syringe pump", html:"Consider a syringe pump when repeated PRN doses are needed (e.g. more than 2 or 3 in 24 hours), symptoms are persistent, oral treatment is not possible, or reliable continuous symptom control is required — a consideration, not an automatic rule. Reassess at least daily, recalculate breakthrough doses and update the care plan. A syringe pump does not replace an immediate SC breakthrough dose when symptoms are severe.", src:"NICE NG31"}
       ]},
       {b:"warn", html:"Buccal or rectal options exist but absorption is unreliable in vomiting patients. If in doubt, give it SC."}
     ]},

    {id:"mhra", nav:"MHRA safety", title:"MHRA safety advice the GP must know", sub:"Two Drug Safety Updates shape antiemetic prescribing. Palliative practice sometimes goes beyond them — that must be a deliberate, documented decision.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"Metoclopramide — neurological effects (MHRA DSU 2013)", html:"Risk of acute <b>extrapyramidal reactions</b> and irreversible <b>tardive dyskinesia</b>, higher with high doses and long-term use. The MHRA restricted use to <b>short-term (up to 5 days)</b>: adults 10 mg up to three times a day, <b>maximum 30 mg (0.5 mg/kg) in 24 hours</b>. Palliative use (e.g. oral 10 mg four times a day, or 30–60 mg/24 h by CSCI, often for longer) exceeds these limits and is off-label — explicitly governed, not a routine exception. Metoclopramide may be used off-label in palliative care for gastric stasis or opioid-related nausea when the expected benefit outweighs the risk. Record the indication, route, dose, duration and review plan. Use the lowest effective dose, monitor for akathisia, dystonia, parkinsonism and abnormal movements, and stop or reduce if these occur.", src:"MHRA DSU Aug 2013 metoclopramide"},
         {tone:"red", h:"Domperidone — cardiac risk (MHRA DSU 2014)", html:"Small increased risk of <b>QT prolongation, serious ventricular arrhythmia and sudden cardiac death</b>, higher in people over 60, at daily doses above 30 mg, and with QT-prolonging drugs or CYP3A4 inhibitors. Restricted to nausea and vomiting at the <b>lowest dose for the shortest time</b> (adults: 10 mg up to three times daily, maximum 30 mg/day, normally no more than one week). Contraindicated with cardiac conduction problems or significant cardiac disease and severe hepatic impairment. Avoid in known QT prolongation and with QT-prolonging medicines or potent CYP3A4 inhibitors; consider electrolytes and ECG where risk factors exist. Oral only — not a solution when the person cannot absorb oral medication.", src:"MHRA DSU May 2014 domperidone"},
         {tone:"amber", h:"Metoclopramide is neurological; domperidone is cardiac", html:"The principal long-term metoclopramide concern is <b>neurological toxicity</b> (akathisia, dystonia, parkinsonism, tardive dyskinesia), not cardiac toxicity. Cardiac/QT concerns are more relevant to <b>domperidone</b> and to the cumulative regimen when several QT-prolonging drugs are used.", src:"MHRA DSU 2013 metoclopramide · MHRA DSU 2014 domperidone"},
         {tone:"amber", h:"QT and the palliative drug chart", html:"Review the cumulative QT risk when combining haloperidol, levomepromazine, domperidone, ondansetron or other QT-prolonging drugs (some antimicrobials, methadone and others). Risk increases with hypokalaemia, hypomagnesaemia, renal failure, bradycardia, structural heart disease and multiple QT-prolonging medicines. Correct significant potassium or magnesium abnormalities where this is consistent with goals of care. Consider ECG assessment when the result would alter treatment and is proportionate to the clinical context — near the end of life, discuss the balance between monitoring burden and comfort rather than applying routine ECGs inflexibly."}
       ]}
     ]},

    {id:"groups", nav:"Special groups", title:"Special groups", sub:"Where the usual choices can do harm.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"Parkinson's disease, Parkinson-plus and myasthenia gravis", html:"Dopamine antagonists that cross the blood–brain barrier (metoclopramide, haloperidol, levomepromazine, prochlorperazine) can severely worsen parkinsonism. In Parkinson's disease or parkinsonism, <b>avoid centrally acting dopamine antagonists unless specialist advice specifically supports their use, and seek specialist advice</b>. Domperidone (which acts peripherally) may be considered only after cardiac-risk assessment, within the MHRA restrictions; cyclizine may be considered according to the likely mechanism, weighing anticholinergic effects and delirium risk. In myasthenia gravis, review the individual drug profile and seek specialist advice if symptoms are significant or treatment is complex — the condition does not automatically rule out all antiemetics. Never stop Parkinson's medicines abruptly.", src:"Scottish Palliative Care Guidelines 2025: Nausea and vomiting"},
         {tone:"amber", h:"Renal failure", html:"Uraemia causes nausea, and many drugs accumulate. Use lower doses of metoclopramide (start 5 mg up to three times a day) and haloperidol, and review opioids. Seek advice in severe renal impairment.", src:"Scottish Palliative Care Guidelines 2025: Nausea and vomiting"},
         {tone:"amber", h:"Older and frail people", html:"Start low: lower haloperidol doses in older and frail people. Watch for sedation, falls, postural hypotension (levomepromazine) and anticholinergic confusion and urinary retention (cyclizine).", src:"Scottish Palliative Care Guidelines 2025: Nausea and vomiting"},
         {tone:"amber", h:"Heart failure", html:"Cyclizine may exacerbate heart failure — consider this when choosing an antiemetic in someone with cardiac disease.", src:"NICE NG31"},
         {tone:"blue", h:"Last days of life", html:"Keep assessing for causes, discuss options, consider non-drug methods and prescribe anticipatory antiemetics. For obstructive bowel disorders in the last days, consider hyoscine butylbromide first, and octreotide (generally with specialist palliative-care advice) if not improved within 24 hours. See <a href='../management/care-of-the-dying.html'>care of the dying</a>.", src:"NICE NG31"},
         {tone:"cream", h:"Brain tumours and metastases", html:"Raised intracranial pressure: cyclizine, and discuss dexamethasone with oncology or palliative care. New or worsening neurology in someone not known to have brain disease needs urgent discussion if investigation would change management."}
       ]}
     ]},

    {id:"mbo", nav:"Bowel obstruction", title:"Malignant bowel obstruction — red flags and referral", sub:"Common in ovarian and colorectal cancer. Early recognition changes both the drugs and the conversation.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"Red flags", html:"Colicky abdominal pain; distension; large-volume, bilious or faeculent vomiting; reduced or absent flatus and stool; high-pitched or absent bowel sounds; known intra-abdominal or pelvic malignancy or previous abdominal surgery or radiotherapy. Exclude severe constipation, which can mimic it."},
         {tone:"red", h:"Same-day actions", html:"<b>Complete or suspected high-grade obstruction:</b> stop metoclopramide; <b>stop stimulant and bulk-forming laxatives</b>; avoid oral medication if not tolerated and use SC medication; discuss urgently with specialist palliative care. The setting of care depends on reversibility, prognosis, performance status, the person's wishes and the agreed place of care — not every suspected obstruction needs admission; if the person is fit for and wants intervention, discuss urgently with the surgical team (possible surgery, stent or venting)."},
         {tone:"blue", h:"Last days of life with obstruction", html:"In the last days of life with an obstructive bowel disorder, consider <b>hyoscine butylbromide</b> as first-line, and <b>octreotide</b> if symptoms don't improve within 24 hours of starting it. Hyoscine butylbromide treats colic and secretions but is not a universal antiemetic; octreotide should generally be started with specialist palliative-care advice; coordinate analgesia, antiemetic and antisecretory treatment.", src:"NICE NG31"},
       ]},
       {b:"dl", rows:[
         ["Medical management — usually specialist-led","Antisecretory and antispasmodic <b>hyoscine butylbromide</b> for colic; antiemetic (cyclizine is commonly used; haloperidol or levomepromazine as alternatives); <b>octreotide</b> for high-volume vomiting under specialist advice; dexamethasone sometimes tried. Doses per specialist or BNF."],
         ["Partial obstruction","Specialist advice is still appropriate. In partial obstruction without colic, a prokinetic may occasionally be considered under specialist guidance, with a softening laxative continued and clear instructions to stop it immediately if colic or deterioration occurs."],
         ["Goals, eating and hydration","Many people with inoperable obstruction can still sip and take small amounts for pleasure; the aim is usually to reduce vomiting to a tolerable level rather than stop it completely. Nasogastric tubes are not routine — consider only for selected patients with severe vomiting, after discussing burden and benefit. Clinically assisted hydration needs an individualised goals-of-care discussion. Discuss place of care openly."]
       ]},
       {b:"why", html:"The pitfall is continuing a prokinetic into a complete obstruction: metoclopramide increases peristalsis against a blockage and worsens colic. Once obstruction is suspected, the drug choice switches from “make the gut move” to “reduce secretions and spasm”."}
     ]},

    {id:"followup", nav:"Follow-up", title:"Follow-up and monitoring", sub:"Every row has a trigger to act.",
     blocks:[
       {b:"table", head:["What","When","Action"], rows:[
         ["Symptom response","24–48 hours after a change","Vomiting frequency, nausea score, oral intake. Not settling → check route and regularity, reassess cause, switch or combine"],
         ["Bowels","Every review","Constipation re-check if not settling; laxatives with every opioid and with 5HT3 antagonists"],
         ["Extrapyramidal effects","With any D2 antagonist","Restlessness (akathisia), stiffness, tremor, abnormal movements → stop or reduce and seek advice"],
         ["Sedation and hypotension","Levomepromazine, cyclizine","Falls risk, drowsiness; adjust dose"],
         ["Calcium, renal function","If clinically suspected and it would change management","Hypercalcaemia or worsening renal function → treat or adjust drugs"],
         ["Prokinetic duration","Metoclopramide beyond the MHRA 5-day licensed limit; domperidone beyond 7 days","Metoclopramide: record indication, route, dose, duration and review plan; monitor for akathisia, dystonia, parkinsonism and abnormal movements — stop or reduce if they occur (MHRA). Domperidone: review cardiac/QT risk"],
         ["QT risk","When combining QT-prolonging drugs","Review cumulative risk; correct potassium or magnesium if consistent with goals of care; ECG only when it would alter treatment and is proportionate"],
         ["Syringe pump","At least daily","Site, compatibility, PRN use in the last 24 hours → adjust the 24-hour dose and recalculate breakthrough doses"],
         ["Hydration","Each review","Signs of dehydration; revisit the plan against goals of care"]
       ]},
       {b:"kv", rows:[
         ["Don't forget","Always reassess constipation, recent opioid changes, hypercalcaemia, renal impairment, infection and obstruction — common and potentially treatable contributors — if not settling."],
         ["Communication","Update the care plan, community nursing team and out-of-hours record (e.g. shared care record) with the antiemetic plan."]
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Refer and seek advice", sub:"Specialist palliative care advice is a phone call away — use it early.",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"red", h:"Same day", html:"Suspected malignant bowel obstruction (urgent specialist discussion — admission depends on goals of care); suspected hypercalcaemia needing treatment; new neurological signs suggesting raised ICP where investigation or steroids would change management; severe dehydration if active treatment is wanted.", src:"Scottish Palliative Care Guidelines 2025: Nausea and vomiting"},
         {tone:"blue", h:"Specialist palliative care", html:"Refractory nausea or vomiting despite a cause-matched drug and a broad-spectrum agent; complex syringe pump combinations or incompatibility; Parkinson's disease; myasthenia gravis with significant symptoms or complex treatment; complex renal impairment; QT-risk combinations; bowel obstruction.", src:"Scottish Palliative Care Guidelines 2025: Nausea and vomiting"},
       ]},
       {b:"kv", rows:[
         ["Acute oncology","Nausea and vomiting during or soon after chemotherapy or radiotherapy — use the patient's oncology helpline."],
         ["Surgical opinion","Suspected bowel obstruction in someone fit for and wanting intervention — discussion about surgery, stenting or venting gastrostomy."]
       ]}
     ]},

    {id:"safety", nav:"Safety-net", title:"Safety-netting", sub:"Patient and carer wording.",
     blocks:[
       {b:"tiles", v:"safety", items:[
         {t:"\u{1F534} Obstruction", html:"Tummy swelling, cramping pain, vomiting large amounts or dark, smelly vomit, no wind or stool → call the same day."},
         {t:"\u{1F4DE} Not settling", html:"Still being sick 24 hours after the new medicine, or can't keep any tablets down → call so we can switch to injections."},
         {t:"\u{1F4A7} Fluids", html:"Can't keep fluids down, very dry, passing very little urine → call to review hydration in line with your wishes."},
         {t:"\u{1F9E0} New symptoms", html:"New confusion, severe headache, drowsiness, or abnormal movements or stiffness → call the same day."}
       ]},
       {b:"say", html:"Sickness in this situation usually has a specific cause, so we choose the anti-sickness medicine that targets it. We'll also check simple things like constipation, your calcium level and your other medicines, which can make it worse. If the sickness is there most of the time, take the medicine regularly, not just when you feel sick. If you're being sick and can't keep tablets down, ring the number on your plan — the nurses can give it as a small injection under the skin, or through a small pump, instead."}
     ]},

    {id:"pitfalls", nav:"Pitfalls", title:"Common pitfalls", sub:"Where community management goes wrong.",
     blocks:[
       {b:"dl", rows:[
         ["PRN-only antiemetic for persistent nausea","For persistent nausea, prescribe a regular antiemetic with an appropriate PRN dose; for intermittent or anticipatory nausea, PRN may be reasonable. Avoid unnecessary sedation or medication burden."],
         ["Oral drugs in a vomiting patient","Switch to SC early and leave anticipatory medicines."],
         ["Metoclopramide into obstruction","Do not use in complete or suspected high-grade obstruction, or with colic."],
         ["Cyclizine with metoclopramide","When gastric stasis is the target, the anticholinergic may oppose the prokinetic action and increase adverse effects."],
         ["Two D2 antagonists together","Extrapyramidal risk; switch, don't stack."],
         ["Missed reversible causes","Constipation, opioid changes, hypercalcaemia, renal impairment, infection and obstruction — common and potentially treatable."],
         ["Haloperidol or metoclopramide in Parkinson's","Avoid centrally acting dopamine antagonists and seek specialist advice; domperidone may be considered only after cardiac-risk assessment."],
         ["Ondansetron as default","Constipating; mainly for chemotherapy or radiotherapy nausea."],
         ["Forgetting the MHRA limits","Off-label palliative use is acceptable only when deliberate, documented (indication, route, dose, duration, review plan) and monitored; check doses and combinations against the GM palliative formulary."]
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card.",
     blocks:[{b:"dl", rows:[
       ["Classic scenario","Home visit: a 68-year-old woman with metastatic ovarian cancer, on modified-release morphine increased last week, has had nausea for four days and vomited twice today. Her daughter asks for “something stronger for the sickness”. She hasn't opened her bowels for five days and has mild colicky pain."],
       ["Examiner-style checkpoints","Characterises the pattern; asks about bowels, colic and distension and considers obstruction; thinks of opioid increase, constipation and hypercalcaemia; chooses a drug by mechanism and avoids metoclopramide if obstruction is possible; moves to SC and leaves anticipatory medicines; involves specialist palliative care; explores the person's wishes about hospital; safety-nets the daughter clearly. <a href='../management/care-of-the-dying.html'>Care of the dying →</a>"]
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Named sources for this page.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NHS Greater Manchester (GMMMG) — Palliative Care Pain and Symptom Control Guidelines for Adults (April 2025)</b><br><a href="https://gmmmg.nhs.uk/palliative-care-pain-symptom-control-guidelines-for-adults/" rel="noopener">gmmmg.nhs.uk — palliative care guidelines</a><span class="rd"> — primary local dosing source: antiemetic doses, mechanism-based approach, syringe-driver compatibility</span></li>'+
         '<li><b>Scottish Palliative Care Guidelines — Nausea and vomiting (2025, updating the 2019 guideline)</b><br><a href="https://www.rightdecisions.scot.nhs.uk/scottish-palliative-care-guidelines/scottish-palliative-care-guidelines/symptoms/symptom-management/nausea-and-vomiting/" rel="noopener">rightdecisions.scot.nhs.uk</a><span class="rd"> — supporting evidence: indicative antiemetic doses (oral, SC, CSCI), prokinetic + anticholinergic caution, Parkinson’s caution</span></li>'+
         '<li><b>Scottish Palliative Care Guidelines — Bowel obstruction</b><br><a href="https://rightdecisions.scot.nhs.uk/scottish-palliative-care-guidelines/symptom-control/bowel-obstruction" rel="noopener">rightdecisions.scot.nhs.uk</a><span class="rd"> — recognition, complete versus partial obstruction, stopping prokinetics and laxatives, hyoscine butylbromide, octreotide under specialist advice, individualised setting of care</span></li>'+
         '<li><b>NICE NG31 — Care of dying adults in the last days of life (2015)</b><br><a href="https://www.nice.org.uk/guidance/ng31" rel="noopener">nice.org.uk/guidance/ng31</a><span class="rd"> — assess causes, discuss options, non-drug methods, anticipatory prescribing, hyoscine butylbromide then octreotide in obstruction, cyclizine and heart failure, hydration</span></li>'+
         '<li><b>MHRA Drug Safety Update — Metoclopramide: risk of neurological adverse effects (2013)</b><br><a href="https://www.gov.uk/drug-safety-update/metoclopramide-risk-of-neurological-adverse-effects" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> — up to 5 days, maximum 30 mg/day (0.5 mg/kg); neurological (extrapyramidal, tardive dyskinesia) risk</span></li>'+
         '<li><b>MHRA Drug Safety Update — Domperidone: risks of cardiac side effects (May 2014)</b><br><a href="https://www.gov.uk/drug-safety-update/domperidone-risks-of-cardiac-side-effects" rel="noopener">gov.uk/drug-safety-update</a><span class="rd"> — 10 mg up to three times daily, maximum 30 mg/day, normally no longer than 1 week; contraindications</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — all other doses, ondansetron, dexamethasone, hyoscine butylbromide, octreotide</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Nausea and vomiting in palliative care in the community — NHS Greater Manchester palliative-care guidance (primary local dosing source), NICE NG31, MHRA Drug Safety Updates (metoclopramide 2013 — neurological risk; domperidone 2014 — cardiac risk) and the Scottish Palliative Care Guidelines (2025) as supporting evidence. Many listed palliative uses and SC regimens are unlicensed or off-label. Check doses and syringe-pump combinations against the current GM palliative-care formulary, local compatibility guidance and SPCs, and seek specialist palliative care advice early."
});
