  stemTitle:"Almost every breast consultation is benign, and the whole clinical skill is applying the NG12 threshold without letting reassurance suppress the referral",
  stemSub:"For suspected cancer, use the <a href='breast-cancer.html'>breast cancer protocol</a>; for lactational infection, the <a href='mastitis-breast-abscess.html'>mastitis and breast abscess protocol</a>. This page is everything else: mastalgia and why danazol has fallen out of use, fibroadenoma and cysts, the nipple-discharge features that change the plan, galactorrhoea and when to check prolactin, gynaecomastia and its drug causes, and what triple assessment actually means so you can explain it. Apply the NG12 criteria first, then document the examination and differential diagnosis: a benign-feeling lump does not remove the need for referral when an NG12 criterion is met, and referral is not delayed for primary-care imaging or blood tests.",
  guideline:"NICE NG12 breast recommendations (2015; check the current NG12 version) · NICE QS12 · NICE NG101 · NICE CG164 · RCOG Green-top 12 · local breast-unit and endocrine pathways",

  nextReview:"13 March 2027",
  meta:[
    {t:"NICE NG12 — suspected cancer: recognition and referral"},

    {t:"50+ nipple change or discharge, one side → suspected cancer referral", tone:"tw"},

  ],
  lead:'<div class="mg-layers"><a href="#safety"><b>NG12</b><small>The thresholds</small></a><a href="#pain"><b>Mastalgia</b><small>Cyclical vs not</small></a><a href="#lumps"><b>Lumps</b><small>Fibroadenoma · cysts</small></a><a href="#nipple"><b>Nipple</b><small>Discharge · galactorrhoea</small></a><a href="#men"><b>Men</b><small>Gynaecomastia</small></a></div>',
  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"purple", h:"🟣 NICE NG12 — the thresholds, verbatim", html:"Refer using a suspected cancer pathway referral (appointment within 2 weeks): aged 30 and over with an unexplained breast lump with or without pain; aged 50 and over with discharge from, retraction of, or other concerning changes in ONE nipple. CONSIDER a suspected cancer pathway referral for skin changes suggestive of breast cancer at any age, and for an unexplained lump in the AXILLA aged 30 and over. <b>Consider non-urgent referral for an unexplained breast lump under 30.</b> <b>Do not delay a suspected cancer referral to arrange mammography, ultrasound or blood tests in primary care.</b>"},
    {tone:"red", h:"⚠ Presentations that need breast referral", html:"Peau d'orange, skin tethering or dimpling, a fixed or hard irregular lump, new nipple inversion, retraction or distortion, or unilateral, persistent, recurrent, ulcerated or non-responsive nipple change (possible Paget's disease of the nipple). Breast inflammation that does not improve as expected after appropriate treatment, recurs, or occurs in a non-lactating patient needs urgent breast assessment to exclude abscess, inflammatory breast cancer and other pathology — do not simply issue repeated antibiotic courses without reassessment."},
    {tone:"blue", h:"Mastalgia — reassurance, a bra, and time", html:"Cyclical breast pain is not a cancer symptom on its own and needs no imaging in the absence of other findings. First-line (clinical consensus — there is no NICE mastalgia guideline): a well-fitting supportive bra (including at night if severe), simple analgesia, and a topical NSAID such as diclofenac gel if suitable (check the product licence and contraindications). A pain diary over at least two cycles distinguishes cyclical from non-cyclical and shows the woman the pattern. Most settles within a few cycles."},
    {tone:"amber", h:"Danazol is a last resort, not a step", html:"For severe, persistent, function-limiting mastalgia despite conservative treatment, refer to a breast specialist. Specialist options may include tamoxifen (off-label for mastalgia; thromboembolic and endometrial risks) or danazol (androgenic effects limit use; voice deepening can be irreversible) after individual risk assessment — neither is started in routine primary care. Pregnancy must be avoided during treatment, with specialist pregnancy and contraception counselling. Do not routinely recommend evening primrose oil: evidence of benefit is insufficient."},
    {tone:"green", h:"Fibroadenoma and cysts — what to tell her", html:"Fibroadenoma: smooth, firm, highly mobile (\"breast mouse\"), commonest under 30. Not confirmed by examination alone — needs imaging and, where indicated, core biopsy; then usually left alone. Rapid growth or a large lesion → consider phyllodes tumour; enlargement in pregnancy → reassess. Cysts: smooth, sometimes tender, fluctuate with the cycle, commonest 35–50 and perimenopausally. A symptomatic or tense cyst may be aspirated in the breast clinic, usually after imaging; a residual solid component, bloody aspirate, rapid refilling or diagnostic uncertainty needs specialist assessment."},
    {tone:"blue", h:"Discharge: document the features", html:"Document whether discharge is unilateral or bilateral, spontaneous or expressed, single-duct or multi-duct, and its colour. Features such as unilateral, single-duct, spontaneous, blood-stained or serous increase concern. Unilateral spontaneous discharge, particularly if blood-stained or serous, requires breast assessment; any discharge from one nipple aged 50 or over meets the NG12 criterion. Intraductal papilloma and duct ectasia are common benign causes, but blood-stained discharge must be investigated. Age and examination remain relevant even for green-brown discharge."}
  ],
  pathwaySub:"Five steps. The first one is a threshold, not a judgement.",
  pathway:[
    {title:"Apply the NG12 criteria before anything else", html:"Age 30+ with an unexplained lump · age 50+ with unilateral nipple change or discharge · skin changes at any age · unexplained axillary lump at 30+. Apply these first, then document the examination and differential diagnosis; refer first — do not delay for primary-care imaging.", alert:true},
    {title:"Characterise the presentation", html:"Pain (cyclical or not) · lump (mobile, smooth, hard, fixed) · nipple (discharge, inversion, skin change) · male breast enlargement. Examine both breasts, both axillae and the supraclavicular regions; document site, size, mobility, consistency, fixation, skin tethering, nipple position and changes, discharge characteristics and nodes. Ask about pregnancy or lactation, menstrual relationship, trauma or surgery, systemic symptoms, medicines and recreational drugs, family history and previous breast imaging."},
    {title:"Treat the benign cause on its own terms", html:"Mastalgia: bra, analgesia, topical NSAID if suitable, diary. Fibroadenoma: confirmed in the breast clinic, then reassure. Cyst: breast-clinic assessment and aspiration if symptomatic. Physiological gynaecomastia: reassure and review. Drug-induced gynaecomastia: review the drug with the prescriber."},
    {title:"Investigate where the cause is systemic", html:"Galactorrhoea → pregnancy test where relevant, prolactin, TSH, drug review; repeat a mild elevation under rested conditions; macroprolactin per local laboratory practice. Gynaecomastia → targeted testosterone, LH/FSH, hCG, LFTs, renal function, TFTs and oestradiol only where atypical, progressive, persistent or pathological — not for typical pubertal gynaecomastia."},
    {title:"Safety-net explicitly, and mean it", html:"\"If this changes, grows, becomes hard or fixed, or the skin or nipple changes, come back — a normal assessment today does not cover a new change tomorrow.\" Document that you said it."}
  ],
  sections:[

    {id:"safety", nav:"NG12", title:"The referral thresholds, and the red flags",
     sub:"The commonest error in this topic is a correct benign diagnosis that displaces a required referral.",
     blocks:[
       {b:"table", head:["Presentation","Threshold","Action"], rows:[
         ["<b>Unexplained breast lump, aged 30 and over</b>","<b>NG12 — with or without pain</b>","<b>Suspected cancer pathway referral.</b> \"Unexplained\" means no obvious benign cause on assessment; it does NOT mean you think it is sinister"],
         ["Unilateral nipple discharge, retraction or other concerning change, aged 50 and over","<b>NG12</b>","<b>Suspected cancer pathway referral</b>"],
         ["<b>Skin changes suggestive of breast cancer — any age</b>","<b>NG12 \"consider\"</b>","<b>Consider a suspected cancer pathway referral.</b> Peau d'orange, tethering, dimpling, ulceration, nipple eczema not resolving"],
         ["<b>Unexplained axillary lump, aged 30 and over</b>","<b>NG12 \"consider\"</b>","<b>Consider a suspected cancer pathway referral</b> — axillary nodes are part of the breast examination, not an afterthought"],
         ["<b>Unexplained breast lump under 30</b>","<b>NG12 \"consider\"</b>","<b>Consider non-urgent referral.</b> Most are fibroadenomas, but a lump still needs assessment rather than reassurance alone"],
         ["Unilateral, persistent, recurrent, ulcerated or non-responsive nipple or areolar change, particularly starting at the nipple","<b>Possible Paget's disease of the nipple</b>","<b>Breast referral — no prolonged empirical treatment.</b> A short trial is reasonable only for clearly bilateral, clinically typical eczema. NICE supporting material lists unilateral eczema not responding to topical treatment and recent nipple distortion as urgent referral presentations"],
         ["Breast inflammation that does not improve as expected after appropriate treatment, recurs, or occurs in a non-lactating patient","<b>Abscess, inflammatory breast cancer or other pathology</b> — distinguish lactational mastitis, breast abscess, non-lactational periductal mastitis and inflammatory breast cancer","<b>Urgent breast assessment; do not simply issue repeated antibiotic courses without reassessment.</b> The one-course threshold is local clinical pathway advice, not an NG12 criterion. See <a href='mastitis-breast-abscess.html'>mastitis and breast abscess</a>"],
         ["Male, unilateral, hard or eccentric breast lump, fixed, with skin or nipple change or axillary nodes","<b>Male breast cancer</b>","<b>Urgent referral per clinical suspicion and the local breast-unit pathway</b> (NG12 has no separate male criterion): hard, eccentric or fixed mass, nipple distortion or retraction, skin change, discharge or axillary lymphadenopathy. Do not assume unilateral enlargement is gynaecomastia"],
         ["<b>Breast lump in pregnancy or lactation</b>","<b>RCOG Green-top 12</b>","<b>Do not defer a persistent or suspicious lump or other concerning breast symptom until delivery or weaning — arrange urgent breast assessment.</b> Ultrasound is generally first-line; further imaging and biopsy are for the breast team. Reassess a presumed blocked duct that does not resolve promptly; persistent inflammatory change in lactation → consider abscess and inflammatory breast cancer; a breast abscess needs urgent breast or surgical management rather than repeated empirical antibiotics"]
       ]},
       {b:"warn", html:"Apply NG12 criteria first, then document the examination and differential diagnosis. A benign-feeling lump does not remove the need for referral when an NG12 criterion is met. Distinguish an NG12 refer criterion, an NG12 consider criterion, a local breast-unit pathway, and a clinically suspicious presentation needing urgent specialist discussion. <b>Do not delay suspected cancer referral to arrange mammography, ultrasound or blood tests in primary care</b> — particularly for an unexplained lump at 30 or over, new nipple distortion, unilateral spontaneous blood-stained discharge, suspicious skin change or suspected male breast cancer."},
       {b:"say", html:"What you are describing sounds very likely to be a benign lump, and most lumps in women your age are. But the rule we follow is based on your age and on finding a lump at all — not on how confident I feel — so I am going to refer you to the breast clinic on the two-week pathway. I want to be straightforward with you: that pathway is called an urgent suspected cancer referral, and seeing that letter is alarming. It does not mean I think you have cancer. It means the clinic will usually aim to do the examination, the scan and, only if needed, a needle test in one visit, which is the fastest way to give you a definite answer rather than my impression."}
     ]},

    {id:"pain", nav:"Mastalgia", title:"Breast pain",
     blocks:[
       {b:"table", head:["Type","Features","Management"], rows:[
         ["<b>Cyclical mastalgia</b>","Bilateral, diffuse, often upper outer quadrants, worse in the days before menstruation, eases with the period. Typically 30s–40s","A properly fitted supportive bra — worn at night too if severe — simple analgesia, and a topical NSAID (diclofenac gel) to the painful area. <b>A pain diary over at least two cycles confirms the pattern and reassures</b>. Assess for chest-wall, hormonal, medication-related and musculoskeletal causes. Reduce caffeine if the woman finds it helps, though the evidence is weak. Most improves within a few cycles"],
         ["<b>Non-cyclical mastalgia</b>","Unrelated to the cycle, often unilateral and localised. Any age; commoner after 40","Look for a cause: musculoskeletal chest wall pain (Tietze's, costochondritis — reproduced by pressing the chest wall, not the breast tissue), a large or unsupported bust, previous surgery, or duct ectasia. Treat the cause; topical NSAID; analgesia"],
         ["<b>Chest wall (extramammary) pain</b>","Reproducible on palpating the chest wall with the breast lifted away; sharp, localised, worse on movement","Reassure explicitly — women assume any pain in that area is breast pain. Topical NSAID and analgesia"],
         ["<b>Drug-associated breast pain</b>","Combined hormonal contraception, HRT, some antidepressants and antipsychotics","<b>Review the drug and consider a change or dose adjustment</b> — see <a href='hrt-prescribing.html'>HRT</a> and <a href='contraception.html'>contraception</a>"],
         ["<b>Refractory, disabling pain after 3–6 months of first-line measures</b>","<b>Significantly affecting sleep, work or relationships</b>","Refer to a breast clinic if persistent, severe, unexplained or functionally disabling. Specialist options may include tamoxifen or danazol — see the card below"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"⚠ Danazol and tamoxifen", html:"<b>Specialist options only, after individual risk assessment — not started in routine primary care.</b> Danazol is licensed for severe benign fibrocystic breast disease in some product information, but androgenic effects (weight gain, acne, hirsutism, voice deepening that can be irreversible) limit use; it is contraindicated in pregnancy. Tamoxifen is off-label for mastalgia and carries thromboembolic and endometrial risks. Pregnancy must be avoided during treatment — both need specialist pregnancy and contraception counselling. Check the current SPCs."},
         {tone:"amber", h:"Evening primrose oil — not routinely recommended", html:"Do not routinely recommend evening primrose oil because evidence of benefit is insufficient. Explain that it is unlikely to add benefit over standard conservative treatment, and redirect the effort to the bra and the diary."},
         {tone:"blue", h:"👚 Bra and topical NSAID", html:"A well-fitting supportive bra is a low-risk first-line measure and may substantially improve symptoms. A topical NSAID is likely beneficial — check the product licence and patient-specific cautions first: NSAID allergy or asthma, renal impairment, peptic ulcer disease, anticoagulants, pregnancy, and do not apply to damaged skin."},
         {tone:"green", h:"✓ What to say about prognosis", html:"\"Cyclical breast pain settles on its own in most women within a few cycles, and it is not a sign of cancer.\" Pain alone, with a normal examination and no other features, is not a referral criterion — and saying that plainly is most of the treatment."}
       ]}
     ]},

    {id:"lumps", nav:"Lumps", title:"Discrete lumps and lumpiness",
     blocks:[
       {b:"table", head:["Diagnosis","Features","Management"], rows:[
         ["<b>Fibroadenoma</b>","Smooth, firm, well-defined, highly mobile — the \"breast mouse\". Commonest under 30; may enlarge in pregnancy","A clinically suspected fibroadenoma is not confirmed by examination alone — refer for imaging and, where indicated, core biopsy. Once confirmed, most are left alone. Excision for size, documented growth, or patient preference. Rapid growth or a large lesion → reconsider phyllodes; enlargement in pregnancy → reassess rather than reassure"],
         ["<b>Breast cyst</b>","Smooth, sometimes tender, can appear suddenly, fluctuates with the cycle. Commonest 35–50 and perimenopausally","<b>A symptomatic or tense cyst may be aspirated in the breast clinic, usually after imaging (ultrasound-guided if needed).</b> Clearly benign fluid may not need cytology. A residual solid component, bloody aspirate, rapid refilling or diagnostic uncertainty needs specialist assessment; do not repeatedly aspirate in primary care"],
         ["<b>Fibrocystic change (benign breast change)</b>","Generalised nodularity and lumpiness, often bilateral, cyclical tenderness","Reassure; manage as cyclical mastalgia. Examine at a different point in the cycle if uncertain. Any DISCRETE dominant lump within general lumpiness is assessed on its own merits"],
         ["<b>Fat necrosis</b>","Firm, sometimes tethered or with skin dimpling — mimics cancer closely. History of trauma, surgery or seatbelt injury, though the trauma is often not recalled","Refer — it cannot be distinguished clinically from carcinoma and needs triple assessment. A plausible history of trauma does not lower the threshold"],
         ["<b>Lipoma</b>","<b>Soft, mobile, slow-growing</b>","Reassure once confirmed; refer if uncertain or if growing"],
         ["<b>Galactocele</b>","<b>Smooth, milk-filled cyst during or after lactation</b>","<b>Usually resolves; aspiration if symptomatic.</b> See <a href='mastitis-breast-abscess.html'>mastitis and breast abscess</a>"],
         ["<b>Phyllodes tumour</b>","<b>Rapidly enlarging, fibroadenoma-like, typically 40s–50s</b>","Urgent referral — behaviour ranges from benign to malignant and excision is required. A rapidly enlarging lesion may still be a fibroadenoma, but phyllodes must be considered and specialist assessment is required"]
       ]},
       {b:"dl", rows:[
         ["<b>What triple assessment actually is</b>","The breast unit will usually aim to provide triple assessment in one visit (NICE QS12): clinical examination, appropriate imaging (mammography and/or ultrasound) and needle sampling if indicated — not every patient requires biopsy. <b>Explain this to the patient in advance:</b> knowing she will likely have a scan and possibly a needle test converts a frightening letter into a manageable appointment. Do not promise same-day results — this varies by service and test"],
         ["<b>Which imaging</b>","The breast unit chooses ultrasound, mammography or both according to age, clinical findings, breast density, pregnancy or lactation and local protocol. Ultrasound is commonly the initial test in younger patients and in pregnancy or lactation, partly because dense breast tissue reduces mammographic sensitivity. Worth saying, because patients often expect a mammogram and read its absence as being taken less seriously"]
       ]}
     ]},

    {id:"nipple", nav:"Nipple", title:"Nipple discharge, galactorrhoea and nipple change",
     blocks:[
       {b:"table", head:["Finding","Meaning","Action"], rows:[
         ["Bilateral, multi-duct, expressed only on squeezing, milky or green-brown, under 50","<b>Physiological or duct ectasia</b>","<b>After examination, reassure; advise stopping expression, which perpetuates it.</b> Duct ectasia is common perimenopausally and around smoking. Green-brown discharge is not always physiological — age and examination remain relevant"],
         ["<b>UNILATERAL, SINGLE-duct, SPONTANEOUS, blood-stained or serous</b>","<b>Intraductal papilloma (commonest), duct ectasia, or carcinoma</b>","Unilateral spontaneous discharge, particularly blood-stained or serous, requires breast assessment; referral route depends on age, examination and the local pathway. Blood-stained discharge is concerning and must be investigated, although intraductal papilloma and duct ectasia are common benign causes"],
         ["<b>Any nipple discharge at 50 and over, one side</b>","<b>NG12 threshold met</b>","<b>Suspected cancer pathway referral</b>"],
         ["Milky discharge, both breasts, not related to pregnancy or breastfeeding","<b>Galactorrhoea</b>","<b>Pregnancy test first, then prolactin, TFTs and a careful drug review.</b> See the galactorrhoea card below"],
         ["<b>New nipple inversion or retraction</b>","<b>Concerning — needs breast assessment</b>; distinguish from long-standing congenital inversion","<b>Refer. Ask how long it has been present and whether it is new</b>"],
         ["<b>Eczematous or scaly nipple and areola</b>","<b>Eczema, or Paget's disease of the nipple</b>","If the change is clearly bilateral and clinically typical of eczema, a short treatment trial may be reasonable. Unilateral, persistent, recurrent, ulcerated or non-responsive nipple change requires breast referral, particularly if it begins at the nipple — Paget's typically starts at the nipple and spreads to the areola; eczema usually does the reverse"]
       ]},
       {b:"cards", items:[
         {tone:"blue", h:"🔬 Galactorrhoea — what to check", html:"Pregnancy test where relevant · serum prolactin where galactorrhoea is clinically significant or with menstrual disturbance, hypogonadism or other pituitary symptoms · TSH, since hypothyroidism raises prolactin · a medication review · consider renal and liver function if hyperprolactinaemia is confirmed or clinically relevant. Repeat a mild elevation under rested conditions — venepuncture stress, exercise and recent breast examination all raise it. Request macroprolactin according to local laboratory practice, particularly in asymptomatic hyperprolactinaemia — it is relatively biologically inactive and can explain an apparently high result; not every laboratory tests it automatically. See <a href='hyperprolactinaemia.html'>hyperprolactinaemia</a>."},
         {tone:"amber", h:"💊 Drugs that cause galactorrhoea", html:"Antipsychotics (especially risperidone, amisulpride, haloperidol), metoclopramide and domperidone, SSRIs, tricyclics, opioids, methyldopa, verapamil, cimetidine and combined hormonal contraception. Review medicines before arranging pituitary imaging, but <b>do not assume a drug cause</b> where prolactin is markedly elevated, symptoms are progressive, the drug cannot be stopped, or there are headache, visual or hypogonadal features. Do not stop an essential medicine without discussing with the prescriber."},
         {tone:"red", h:"⛔ Prolactin very high, or with visual field loss or headache", html:"Ask about headache and visual symptoms and perform a basic bedside visual assessment — it does not replace formal perimetry. Urgently refer for endocrine assessment and pituitary imaging when prolactin is markedly raised or there are visual-field symptoms, cranial nerve signs or significant headache (possible macroprolactinoma). Use the thresholds of the local endocrine laboratory and referral pathway."},
         {tone:"green", h:"✓ Stopping expression", html:"Repeated checking and squeezing maintains physiological discharge through nipple stimulation. <b>Telling a woman to stop expressing it is often the entire treatment</b> — and explaining the mechanism makes the advice stick."}
       ]}
     ]},

    {id:"men", nav:"Men", title:"Gynaecomastia",
     sub:"True glandular tissue, not fat — and the drug history is the highest-yield part of the consultation.",
     blocks:[
       {b:"table", head:["Situation","Assessment","Management"], rows:[
         ["<b>Physiological — neonatal, pubertal, or elderly</b>","Pubertal gynaecomastia is very common and usually resolves within 1–2 years. In older men, falling testosterone and rising adiposity (peripheral aromatisation) explain most cases","Typical pubertal gynaecomastia is a clinical diagnosis: reassure and review if progressive, severe, atypical or distressing. No routine extensive blood testing if examination is typical"],
         ["<b>Drug-induced — the commonest identifiable cause</b>","Review all prescribed, over-the-counter and recreational drugs, prioritising spironolactone, anti-androgens, anabolic steroids, finasteride/dutasteride, prolactin-raising antipsychotics, cimetidine, ketoconazole, opioids, relevant antiretrovirals and calcium-channel blockers; also alcohol and liver disease. Weaker or less common associations include digoxin, cannabis and PPIs","Review every drug before investigating. Where possible change the culprit in discussion with the prescriber or specialist — do not stop an antipsychotic or other essential medicine without that discussion — and reassess in 3 months"],
         ["<b>Atypical or pathological</b>","Rapid enlargement, hard, eccentric or fixed mass, marked asymmetry, testicular abnormality, systemic symptoms, prepubertal presentation, persistent unexplained gynaecomastia, severe pain or significant concern","Targeted tests: testosterone, LH/FSH, hCG, LFTs, renal function and TFTs; oestradiol where clinically indicated. Examine the testes, with testicular ultrasound if abnormal; urgent breast referral for suspicious features. <b>hCG matters — a testicular tumour can present as gynaecomastia</b>"],
         ["<b>Pseudogynaecomastia</b>","Fat without glandular tissue — no firm disc beneath the areola on palpation","<b>If examination clearly shows pseudogynaecomastia with no suspicious features, breast imaging is usually unnecessary; weight management.</b> If examination is uncertain, arrange appropriate specialist assessment"],
         ["<b>Suspected male breast cancer</b>","Unilateral, hard or eccentric to the nipple, fixed, skin or nipple change, axillary nodes","<b>In men, refer urgently</b> (clinical suspicion and the local breast-unit pathway) for a hard, eccentric or fixed mass, nipple distortion or retraction, skin change, discharge or axillary lymphadenopathy. Do not assume unilateral enlargement is gynaecomastia"],
         ["<b>Persistent, distressing or long-standing</b>","Present over 12 months, fibrotic, or causing significant psychological distress","Refer — medical therapy is ineffective once fibrosis is established, and surgery is the option. Address the psychological impact directly; it is frequently significant and rarely volunteered"]
       ]},
       {b:"why", html:"Gynaecomastia is a hormonal sign, not a breast disease: it reflects a relative excess of oestrogen over androgen effect at the breast. That is why the drug list is long and varied — the drugs act at different points on that balance — and why the drug review outperforms any blood test as a first step. It is also why examination matters: distinguishing true glandular tissue from fat, and a central symmetrical disc from an eccentric hard lump, separates three completely different pathways in under a minute."}
     ]},

    {id:"monitor", nav:"Follow up", title:"Review and safety-netting",
     blocks:[
       {b:"table", head:["Situation","Review"], rows:[
         ["<b>Cyclical mastalgia</b>","Review after at least two cycles with the pain diary. Refer if severe and refractory after 3–6 months of first-line measures"],
         ["<b>Benign lump confirmed on triple assessment</b>","No routine follow-up needed — but safety-net for change in size, consistency, skin or nipple"],
         ["<b>Cyst aspirated</b>","Follow the breast clinic's advice; specialist assessment if it refills rapidly, a mass remains, or the aspirate was blood-stained — do not repeatedly aspirate in primary care"],
         ["<b>Galactorrhoea on a drug</b>","<b>Reassess 3 months after changing the drug; recheck prolactin</b>"],
         ["<b>Gynaecomastia, drug-related or physiological</b>","Review at 3 months. Refer if progressive, over 12 months' duration, or distressing"],
         ["<b>Anyone reassured without referral</b>","Document the examination findings, the reassurance given, and the explicit safety-net advice"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"🔴 Come back promptly", html:"\"If the lump grows, becomes hard or fixed, if the skin dimples or puckers, if the nipple turns in or changes, if you get discharge from one side that comes on its own or is blood-stained, if redness or inflammation persists, or if a lump in pregnancy or breastfeeding does not settle as expected — come back straight away, even if you were reassured recently.\""},
         {tone:"amber", h:"🟠 Screening does not replace diagnosis", html:"Routine screening does not replace diagnostic assessment of symptoms, and a benign diagnosis does not replace assessment of a new symptom. Continue routine NHS breast screening where eligible; in England, invitations are generally issued from age 50 up to the 71st birthday every 3 years, with self-referral after 71. Trans and non-binary patients may need individualised screening arrangements."},
         {tone:"blue", h:"💊 Before the clinic appointment", html:"\"They will usually examine you and scan you, and if there is anything to sample they may do a needle test at the same visit. When results are available varies by clinic.\" Knowing the shape of the visit reduces the fear of the letter."},
         {tone:"green", h:"✓ Breast awareness, not self-examination", html:"The advice is to know what is normal for you and report change — not a prescribed monthly technique, which raises anxiety without improving outcomes."}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways",
     blocks:[
       {b:"cards", items:[
         {tone:"purple", h:"Suspected cancer · NICE NG12", html:"Aged 30 and over with an unexplained breast lump, with or without pain. Aged 50 and over with discharge from, retraction of, or other concerning change in ONE nipple. CONSIDER a suspected cancer pathway referral for skin changes suggestive of breast cancer at any age, and for an unexplained axillary lump aged 30 and over. Under 30 with an unexplained lump: consider non-urgent referral; urgent if hard or fixed, enlarging, with skin, nipple or axillary change, or a strong family history. Urgent breast referral also for unilateral non-responsive nipple change (possible Paget's), breast inflammation not improving as expected, and suspected male breast cancer (clinical suspicion and local pathway). Do not delay for primary-care imaging."},
         {tone:"amber", h:"Urgent breast clinic (not the suspected cancer pathway)", html:"Blood-stained aspirate or residual mass after cyst aspiration, rapidly refilling cyst, rapidly enlarging fibroadenoma-like lump (consider phyllodes), suspected fat necrosis, or a breast abscess (urgent breast or surgical management). Routes vary — follow the local breast-unit pathway."},
         {tone:"blue", h:"Routine breast clinic", html:"Unexplained lump under 30 · refractory mastalgia after 3–6 months of first-line treatment · persistent or distressing gynaecomastia · diagnostic uncertainty."},
         {tone:"blue", h:"Endocrinology", html:"Significant unexplained prolactin elevation, visual symptoms, severe headache, hypogonadism or inability to change a causative medicine (local endocrine/hyperprolactinaemia pathway), or unexplained pathological gynaecomastia with abnormal hormone results. See <a href='hyperprolactinaemia.html'>hyperprolactinaemia</a>."},
         {tone:"green", h:"Family history service (NICE CG164)", html:"Use the NICE familial breast cancer criteria and the local family-history pathway — local family history clinics often triage before genetics. Consider referral for multiple affected relatives, young age at diagnosis, bilateral breast cancer, ovarian, pancreatic or prostate cancer patterns, male breast cancer, or a known pathogenic variant. See <a href='breast-cancer.html'>breast cancer</a> for the full criteria."},
         {tone:"cream", h:"GP management", html:"Mastalgia, confirmed fibroadenoma, fibrocystic change, physiological and drug-induced galactorrhoea, physiological and drug-induced gynaecomastia, and the reassurance and safety-netting around all of them. Related pages: <a href='breast-cancer.html'>breast cancer</a> · <a href='mastitis-breast-abscess.html'>mastitis and breast abscess</a> · <a href='hyperprolactinaemia.html'>hyperprolactinaemia</a> · <a href='hrt-prescribing.html'>HRT</a> · <a href='contraception.html'>contraception</a> · <a href='../algorithms/mastalgia.html'>breast pain pathway</a>."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 34-year-old woman has noticed a <b>smooth, mobile, non-tender lump</b> in the upper outer quadrant of her left breast, present about 6 weeks and unchanged. No skin or nipple change, no discharge, no family history. She is <b>certain it is \"just hormonal\"</b> because it was more noticeable before her period, and opens by saying she <b>does not want to waste anyone's time</b> and would rather just be reassured. She has a 2-year-old and is worried about childcare for appointments."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"<b>Examines both breasts and both axillae and documents the findings</b>; recognises that the NG12 criterion is met at 30 and over with an unexplained lump regardless of how benign it sounds, and does not let her reassurance-seeking or her own confidence displace the referral; <b>explains WHY she is being referred without frightening her</b> — that the rule is age- and sign-based, not a judgement that this is cancer; <b>names the pathway honestly as an urgent suspected cancer referral</b> rather than letting her discover it from the letter; <b>describes what triple assessment involves</b>, including that it is usually one visit with a scan and possibly a needle test, which addresses the childcare concern directly; <b>explains that the clinic chooses the imaging, commonly ultrasound at her age</b>; <b>gives explicit safety-net advice</b>; and <b>addresses the \"wasting time\" belief directly</b>, since it is the reason women present late."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral — breast recommendations [2015]; check the current NG12 version before use</b><br><a href="https://www.nice.org.uk/guidance/ng12/chapter/Recommendations-organised-by-site-of-cancer" rel="noopener">nice.org.uk/guidance/ng12 — recommendations by site of cancer</a><span class="rd"> — the 30-and-over unexplained breast lump criterion, the 50-and-over unilateral nipple change criterion, and the "consider" criteria for skin changes at any age, unexplained axillary lump at 30 and over, and non-urgent referral for a lump under 30</span></li>'+
         '<li><b>Breast pain — no dedicated UK or NICE guideline; evidence-informed primary-care practice and local breast-service practice</b><span class="rd"> — supportive bra and topical NSAID first-line, pain diary over at least two cycles, insufficient evidence for evening primrose oil, and specialist-only danazol and tamoxifen</span></li>'+
         '<li><b>NICE suspected cancer supporting evidence (appendix J4)</b><span class="rd"> — no investigation before referral when symptoms suggest breast cancer; unilateral eczema not responding to topical treatment and recent nipple distortion as urgent presentations</span></li>'+
         '<li><b>RCOG Green-top Guideline No. 12 — Pregnancy and breast cancer (2025)</b><span class="rd"> — specialist assessment of a persistent lump in pregnancy; ultrasound first-line</span></li>'+
         '<li><b>NICE CG164 — Familial breast cancer</b><br><a href="https://www.nice.org.uk/guidance/cg164" rel="noopener">nice.org.uk/guidance/cg164</a><span class="rd"> — family history referral criteria</span></li>'+
         '<li><b>Current local endocrine / hyperprolactinaemia pathway</b><span class="rd"> — prolactin thresholds, macroprolactin and referral</span></li>'+
         '<li><b>Local breast-unit pathways (clinical practice; not NG12) — breast lump · gynaecomastia</b><span class="rd"> — fibroadenoma and cyst management, cyst aspiration and its urgent-referral triggers, the drug list for gynaecomastia, and the hormonal investigation set</span></li>'+
         '<li><b>NICE QS12 — Breast cancer (triple assessment); NICE NG101 — Early and locally advanced breast cancer: diagnostic pathway</b><br><a href="https://www.nice.org.uk/guidance/qs12" rel="noopener">nice.org.uk/guidance/qs12</a> · <a href="https://www.nice.org.uk/guidance/ng101" rel="noopener">nice.org.uk/guidance/ng101</a><span class="rd"> — clinical examination, mammography and/or ultrasound, and tissue sampling if required, offered at a single hospital visit</span></li>'+
         '<li><b>NHS Breast Screening Programme</b><br><a href="https://www.nhs.uk/conditions/breast-screening-mammogram/" rel="noopener">nhs.uk — breast screening</a><span class="rd"> — routine invitation in England generally from 50 up to the 71st birthday every 3 years, self-referral after 71</span></li>'+
         '<li><b>Current product SPCs — danazol and tamoxifen</b><br><a href="https://www.medicines.org.uk/emc" rel="noopener">medicines.org.uk/emc</a><span class="rd"> — licensing, pregnancy and contraception cautions, androgenic, thromboembolic and endometrial risks</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Benign breast disorders — NICE NG12 breast recommendations (2015), NICE QS12, NG101 and CG164, RCOG Green-top 12 and local breast-unit pathways. Apply NG12 first, then document the examination: an unexplained breast lump at 30 and over is a suspected cancer pathway referral however benign it feels, and referral is not delayed for primary-care imaging. For mastalgia, a well-fitting supportive bra and a suitable topical NSAID come first, evening primrose oil is not routinely recommended, and danazol and tamoxifen are specialist-only. Unilateral spontaneous discharge, particularly blood-stained or serous, needs breast assessment. In galactorrhoea, check pregnancy where relevant, prolactin (macroprolactin per local laboratory), TSH and the drug list. In gynaecomastia, review the drugs, investigate only atypical or pathological presentations, and examine for the features of male breast cancer rather than assuming. Check current SPCs before prescribing."
});
