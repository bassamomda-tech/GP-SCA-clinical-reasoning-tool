  stemSub:"One page for the whole condition. Neuropathic pain is a symptom, not a diagnosis: exclude cauda equina, metastatic spinal cord compression and the other compressive and sinister causes before touching the ladder; confirm the pain really is neuropathic; examine to localise the lesion and screen for reversible causes (diabetes, B12); then offer ONE of four first-line agents and switch sequentially rather than stacking, with carbamazepine as the distinct first-line for trigeminal neuralgia — and prescribe gabapentinoids as the Schedule 3 drugs they are. NICE CG173 · NG193 · NG234.",

  lead:"<div class='mg-layers'><a href='#severe'><b>Red flags</b><small>Cauda equina · MSCC</small></a><a href='#confirm'><b>Confirm</b><small>Neuropathic vs nociceptive</small></a><a href='#ladder'><b>Treat</b><small>One of four · switch, don't stack</small></a><a href='#refer'><b>Refer</b><small>Emergency · neurology · pain clinic</small></a></div>",
  quickSub:"If you read nothing else on this page, read these six cards. Every figure traces to the source cited under <a href='#provenance'>Evidence</a>.",
  quick:[
    {tone:"red", h:"⚠ The two great misses: cauda equina and MSCC", html:"Bilateral sciatica, saddle anaesthesia, bladder/bowel or sexual dysfunction → 999 / emergency MRI. Time-critical. Known or suspected cancer + new severe or progressive back pain, band-like pain, limb weakness or a sensory level → the MSCC pathway: whole-spine MRI within 24 hours (≤24h) plus oncology (NICE CG75/NG234/NG12). In any patient with a cancer history, new or progressive back or radicular pain is MSCC until proven otherwise."},
    {tone:"amber", h:"CG173 explicitly assumes serious pathology has been excluded", html:"That is the single most important sentence about this guideline — <b>the ladder starts after the red-flag screen, not instead of it.</b> Also on the urgent list: rapidly progressive weakness or ascending sensory loss → urgent neurology (exclude GBS or a cord lesion); new mononeuritis multiplex → urgent vasculitis/diabetes work-up; fever, weight loss or IV drug use with spinal pain → exclude discitis or epidural abscess urgently."},
    {tone:"blue", h:"Choose ONE of four — then switch, not stack", html:"For all neuropathic pain except trigeminal neuralgia: offer amitriptyline, duloxetine, gabapentin OR pregabalin as initial first-line monotherapy, chosen by comorbidity, side effects, cost, misuse risk and patient preference. If the first is ineffective or not tolerated, SWITCH to one of the remaining three, tried sequentially — titrate to effect or tolerability before judging failure. Standard analgesics largely do not work: neuropathic pain responds poorly to paracetamol, NSAIDs and (largely) opioids."},
    {tone:"green", h:"Gabapentinoids are Schedule 3 controlled drugs — prescribe accordingly", html:"Gabapentin and pregabalin are Class C / Schedule 3 controlled drugs in the UK: assess misuse and diversion risk, avoid co-prescribing with opioids where possible (respiratory-depression deaths), counsel on driving and dependence, and reduce the dose in renal impairment. Duloxetine: caution in hepatic impairment. Amitriptyline: anticholinergic load, QTc, and falls in the elderly — lowest effective dose."},
    {tone:"purple", h:"What CG173 tells you NOT to start", html:"Do NOT initiate morphine or other strong opioids, cannabis-based medicinal products, or — except by specialists — other antiepileptics for neuropathic pain in non-specialist settings, because of poor efficacy and significant harms in chronic neuropathic pain. Tramadol only as short-term acute rescue, never for long-term neuropathic pain."},
    {tone:"teal", h:"A neuropathic-pain label must not anchor the next assessment", html:"A change in neurological signs always reopens the question of a compressive or malignant cause — repeat the neurological assessment if symptoms change, and re-triage new or progressing deficit. Structured review at 4–6 weeks prevents both premature abandonment of effective drugs and indefinite continuation of ineffective ones — and if a drug does not deliver meaningful benefit after an adequate titrated trial, taper and stop it rather than layering another on top."}
  ],
  pathwaySub:"The whole consultation in five moves. The red step is the one CG173 assumes you have already done.",
  pathway:[
    {title:"Exclude compressive and sinister causes", html:"Cauda equina (bilateral sciatica, saddle anaesthesia, bladder/bowel/sexual dysfunction) → 999 / emergency MRI. MSCC (cancer + new or progressive back, band-like pain, weakness, sensory level) → MRI whole spine within 24 h (≤24h) + oncology. Progressive deficit → urgent neurology. New mononeuritis multiplex → urgent specialist work-up. Acute zoster → antivirals within 72 h; ophthalmic or otic involvement → same-day. Fever, weight loss or IVDU with spinal pain → exclude discitis/epidural abscess.", alert:true},
    {title:"Confirm the pain is neuropathic", html:"Burning, shooting, electric-shock, stabbing, tingling or “pins and needles”, often worse at night; allodynia, hyperalgesia, numbness or paraesthesiae in a neuroanatomical distribution. <b>DN4, LANSS or painDETECT support — not replace — clinical judgement.</b> Note that many conditions (low back pain, cancer pain) have <b>mixed nociceptive and neuropathic components</b> needing combined approaches, and assess <b>sleep, mood, function and the meaning of the pain</b>."},
    {title:"Examine to localise, investigate by cause", html:"Full neurological examination mapping the deficit to a nerve, root or central pattern; diabetic foot check (monofilament, vibration, inspection); skin for zoster scarring and CRPS signs. Bloods by cause: HbA1c/glucose, B12 and folate, U&amp;E, LFTs, TFTs, FBC; consider ESR, immunoglobulins, HIV and autoantibodies if atypical or progressive. MRI spine for radiculopathy with red flags or failure to settle. Nerve conduction studies/EMG via neurology only for uncertainty or progressive asymmetrical neuropathy."},
    {title:"Treat the cause, then the CG173 ladder", html:"Optimise glycaemia, replace B12 and manage the underlying condition in parallel with symptomatic treatment. Then one of the four first-line agents, switching sequentially; combination across classes only after sequential monotherapy; topical capsaicin for localised pain; carbamazepine first-line for trigeminal neuralgia. If the pain has no clear cause or is disproportionate, manage as chronic primary pain per NG193 instead."},
    {title:"Review at 4–6 weeks, deprescribe, stay alert", html:"Review efficacy and side effects at 4–6 weeks (these drugs take weeks to work) — reassess sleep, mood and function, not just the pain score. Titrate or switch per CG173; stop ineffective drugs rather than layering. Monitor gabapentinoid misuse and co-prescribed sedatives. Re-examine if the neurology changes."}
  ],
  sections:[
    {id:"severe", nav:"Red flags", title:"Red flags — exclude compressive and sinister causes first", sub:"Neuropathic pain is a symptom, not a diagnosis. Before reaching for the NICE CG173 ladder, exclude the emergencies and the malignant causes that demand urgent imaging or referral.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Cauda equina syndrome", html:"Bilateral sciatica, saddle anaesthesia, bladder or bowel dysfunction, sexual dysfunction → 999 / emergency MRI. Time-critical."},
         {tone:"red", h:"🔴 Metastatic spinal cord compression (MSCC)", html:"Known or suspected cancer + new severe or progressive back pain, band-like pain, limb weakness or a sensory level → the MSCC pathway: MRI whole spine within 24 hours (≤24h), plus oncology (NICE NG12 / CG75 / NG234)."},
         {tone:"amber", h:"🟠 Progressive neurological deficit", html:"Rapidly worsening weakness or ascending sensory loss → urgent neurology (exclude GBS, cord lesion)."},
         {tone:"amber", h:"🟠 New mononeuritis multiplex", html:"Multiple named-nerve deficits → urgent work-up for vasculitis or diabetes — needs specialist input."},
         {tone:"amber", h:"🟠 Herpes zoster (acute)", html:"Dermatomal pain + vesicles → antivirals within 72 hours; ophthalmic or otic involvement → same-day ophthalmology or ENT."},
         {tone:"amber", h:"🟠 Infection / systemic features", html:"Fever, weight loss, or IV drug use with spinal pain → exclude discitis or epidural abscess urgently."}
       ]},
       {b:"why", html:"CG173 explicitly assumes serious underlying pathology has been excluded. Cauda equina and metastatic spinal cord compression are the two great misses in a patient presenting with new neuropathic limb pain — both are time-critical and both are tested. In any patient with a cancer history, new or progressive back or radicular pain is MSCC until proven otherwise."}
     ]},

    {id:"confirm", nav:"Confirm", title:"Confirm the pain is neuropathic", sub:"Distinguish neuropathic from nociceptive pain — it changes the entire treatment approach. Standard analgesics largely do not work.",
     blocks:[
       {b:"table", head:["Feature","Detail","Why it matters"], rows:[
         ["<b>Descriptors</b>","Burning, shooting, electric-shock, stabbing, tingling, “pins and needles”. Often worse at night","The history is the diagnosis"],
         ["<b>Sensory features</b>","Allodynia (pain from non-painful stimuli, e.g. clothing), hyperalgesia, numbness, paraesthesiae in a neuroanatomical distribution","Confirms a somatosensory lesion"],
         ["<b>Screening tools</b>","DN4, LANSS or painDETECT support (not replace) clinical judgement in identifying a neuropathic component","Useful for documentation and borderline cases"],
         ["<b>Common causes</b>","Diabetic painful neuropathy, post-herpetic neuralgia, trigeminal neuralgia, sciatica/radiculopathy, post-surgical or traumatic nerve injury, central pain (post-stroke, MS), chemotherapy-induced","Each has a parallel cause-directed treatment"],
         ["<b>Mixed pain</b>","Many conditions (e.g. low back pain, cancer pain) have mixed nociceptive and neuropathic components needing combined approaches","Explains partial response to either approach alone"],
         ["<b>Impact</b>","Assess sleep, mood, function and the meaning of the pain — chronic neuropathic pain is strongly linked with depression and disability","Drives agent choice and the non-drug plan"]
       ]},
       {b:"kv", rows:[
         ["Treat the cause too","Optimise glycaemia (diabetes), replace B12, and manage the underlying condition in parallel with symptomatic treatment"],
         ["Chronic primary pain (NG193)","<b>If the pain has no clear cause or is disproportionate (fibromyalgia, CRPS, chronic primary headache), manage as chronic <b>primary</b> pain: exercise, CBT/ACT, acupuncture, and consider an antidepressant even without depression. <b>Do not start</b> opioids, NSAIDs, paracetamol, gabapentinoids, <b>other antiepileptics or antipsychotics</b>, or benzodiazepines</b>"]
       ]},
       {b:"why", html:"Neuropathic pain arises from a lesion or disease of the somatosensory system and responds poorly to paracetamol, NSAIDs and (largely) opioids. Recognising the characteristic descriptors and signs (allodynia, dermatomal or neuroanatomical distribution) directs treatment to the agents proven effective in CG173."}
     ]},

    {id:"workup", nav:"Work-up", title:"Examination and targeted investigation", sub:"Examination localises the lesion and screens for treatable causes; investigations are guided by the suspected aetiology, not routine.",
     blocks:[
       {b:"table", head:["What","Detail","Why"], rows:[
         ["<b>Neurological examination</b>","Power, tone, reflexes, sensory modalities (light touch, pinprick, vibration, proprioception), gait. Map the deficit to a nerve, root or central pattern","<b>Confirms the neuroanatomical basis of the pain</b>"],
         ["<b>Diabetic foot check</b>","Monofilament, vibration, foot inspection — diabetic neuropathy is the commonest cause; assess ulcer risk","Finds the commonest reversible contributor"],
         ["<b>Skin</b>","Zoster scarring (post-herpetic neuralgia), trophic changes, signs of CRPS (swelling, colour or temperature change)","Redirects to the PHN or NG193 pathway"],
         ["<b>Bloods (by cause)</b>","HbA1c/glucose, B12 + folate, U&amp;E, LFTs, TFTs, FBC; consider ESR, immunoglobulins, HIV, autoantibodies if atypical or progressive","Identifies reversible contributors — especially diabetes and B12 deficiency"],
         ["<b>Imaging</b>","MRI spine for radiculopathy with red flags or failure to settle; urgent if cord, cauda equina or MSCC is suspected","<b>Routine imaging is unnecessary for typical, stable presentations</b>"],
         ["<b>Specialist tests</b>","Nerve conduction studies / EMG via neurology for diagnostic uncertainty, or progressive or asymmetrical neuropathy","Not a primary-care investigation"]
       ]},
       {b:"cards", items:[
         {tone:"purple", h:"NG12 criteria that surface here <span class='tw'>2WW</span>", html:"Neuropathic pain has no NICE NG12 criterion of its own, and this page does not invent one — but the cancer question is central to the red-flag screen and two routes must be stated:<br>• Known or suspected cancer with new or progressive spinal, radicular or band-like pain, limb weakness or a sensory level → the metastatic spinal cord compression pathway: MRI whole spine within 24 hours (≤24h) and immediate oncology contact (NICE CG75 and NG234, and NG12's principle that new pain in a cancer patient is investigated urgently). This outranks every analgesic decision on the page.<br>• Unexplained back pain with weight loss, or a progressive focal neurological deficit without a benign explanation → urgent investigation via the relevant suspected-cancer pathway (myeloma, bone metastases and cord lesions all present this way).<br>A neuropathic-pain label never covers a NEW deficit — re-triage rather than re-titrate.", src:"NICE NG12 (updated May 2025) · NG234 · house rule"}
       ]}
     ]},

    {id:"ladder", nav:"Treat", title:"First-line pharmacotherapy — the CG173 ladder", sub:"For all neuropathic pain except trigeminal neuralgia, offer a choice of one of four first-line agents. Treat the underlying cause in parallel. Verify all doses in the BNF.",
     blocks:[
       {b:"ladder", steps:[
         {step:"1st line", title:"Choose ONE of four — amitriptyline, duloxetine, gabapentin or pregabalin", when:"initial monotherapy, guided by patient choice", fromLabel:"CG173",
          html:"Choice is guided by comorbidity, side effects, cost, risk of misuse and patient preference. <b>Amitriptyline:</b> start 10 mg ON, titrate to 75 mg ON as tolerated — useful where sleep disturbance coexists; cautions are anticholinergic effects, QTc and falls in the elderly. <b>Duloxetine:</b> the first-line of choice in painful diabetic neuropathy — start 30 mg then 60 mg OD; caution nausea, BP and interactions. <b>Gabapentin:</b> titrate from 300 mg. <b>Pregabalin:</b> titrate from 75 mg BD. Both gabapentinoids are Class C controlled drugs with misuse and diversion risk — counsel and review, and reduce the dose in renal impairment."},
         {step:"If it fails", title:"Switch agent — do not stack", when:"ineffective or not tolerated", fromLabel:"sequential monotherapy",
          html:"Switch to one of the remaining three, tried sequentially. Titrate to effect or tolerability before judging failure."},
         {step:"Then", title:"Combination or topical", when:"after sequential monotherapy has failed", fromLabel:"under review",
          html:"Consider combining agents from different classes (e.g. amitriptyline + a gabapentinoid) under review, balancing benefit against side-effect burden. Topical capsaicin 0.075% cream for localised pain; the 8% patch (specialist) for localised post-herpetic neuralgia in those who cannot take oral drugs."},
         {step:"Trigeminal neuralgia", title:"Carbamazepine — the distinct first-line", when:"trigeminal neuralgia only", fromLabel:"CG173",
          html:"<span class='rx'>Carbamazepine 100 mg BD</span>, titrated in 100\u2013200 mg steps to <span class='rx'>200 mg TDS\u2013QDS</span> (maximum 1.6 g daily), is first-line for trigeminal neuralgia \u2014 check U&amp;E and LFTs, and warn about rash and hyponatraemia. Refer to specialist or neurology if it fails or the diagnosis is uncertain (exclude MS, mass lesion)."},
         {step:"Zoster", title:"Acute herpes zoster", when:"dermatomal pain with vesicles", fromLabel:"prevention of PHN",
          html:"Antivirals within 72 hours reduce post-herpetic neuralgia risk \u2014 <span class='rx'>aciclovir 800 mg five times daily for 7 days</span>, or <span class='rx'>valaciclovir 1 g TDS for 7 days</span>; treat established PHN as neuropathic pain."}
       ]},
       {b:"warn", html:"Do NOT start morphine or other strong opioids, cannabis-based medicinal products, or (except by specialists) other antiepileptics for neuropathic pain in non-specialist settings. Tramadol only as acute rescue, short-term — not for long-term neuropathic pain."},
       {b:"why", html:"CG173 (2019, updated) recommends a choice of amitriptyline, duloxetine, gabapentin or pregabalin as first-line for neuropathic pain other than trigeminal neuralgia, and to switch — not stack — if the first is ineffective or not tolerated. Pregabalin and gabapentin are Schedule 3 controlled drugs in the UK; misuse potential must be considered when prescribing. CG173 specifically advises against initiating strong opioids, cannabis-based medicinal products and most other antiepileptics outside specialist care, because of poor efficacy and significant harms in chronic neuropathic pain. Carbamazepine remains the distinct first-line for trigeminal neuralgia, reflecting its specific evidence base."},
       {b:"say", html:"This is nerve pain, which needs a different type of medicine — ordinary painkillers don't help much. We'll try one tablet that calms the nerves, give it a few weeks to work, and switch to a different one if it doesn't suit you. The aim is to take the edge off and help you function, alongside staying active."}
     ]},

    {id:"safety", nav:"Prescribing safety", title:"Prescribing safety and stewardship", sub:"Safe prescribing is a core SCA competency — this section is where the marks and the harms both live.",
     blocks:[
       {b:"table", head:["Domain","Rule","Why"], rows:[
         ["<b>Titrate and review</b>","Start low, go slow; review efficacy and side effects at 4–6 weeks (drugs take weeks to work). Stop ineffective drugs rather than layering","Prevents both premature abandonment and indefinite continuation"],
         ["<b>Gabapentinoid stewardship</b>","Class C / Schedule 3 controlled drugs — assess misuse risk, avoid co-prescribing with opioids where possible (respiratory-depression deaths), counsel on driving and dependence","Gabapentinoids carry real dependence and overdose risk, especially with opioids"],
         ["<b>Renal / hepatic dosing</b>","Reduce gabapentin and pregabalin in renal impairment; caution with duloxetine in hepatic impairment","Avoids accumulation and toxicity"],
         ["<b>Pregnancy</b>","Review all agents in pregnancy or when planning — seek specialist advice; many have safety concerns","Every agent on the ladder needs re-examining"],
         ["<b>Elderly</b>","Falls, sedation and anticholinergic load (amitriptyline) — use the lowest effective dose and review regularly","<b>Tricyclics cause falls and anticholinergic harm in older people</b>"],
         ["<b>Deprescribe</b>","If there is no benefit, taper and stop; avoid indefinite continuation of ineffective therapy","Any agent should be stopped if it does not deliver meaningful benefit after an adequate, titrated trial"]
       ]}
     ]},

    {id:"lifestyle", nav:"Self-management", title:"Self-management and non-pharmacological care", sub:"Chronic neuropathic pain is best managed with a biopsychosocial approach; drugs alone rarely suffice.",
     blocks:[
       {b:"table", head:["Measure","What to do","Why"], rows:[
         ["<b>🎯 Education and expectations</b>","Explain neuropathic pain and that the goal is meaningful reduction and improved function, not always abolition of pain","Reframes success and reduces escalation pressure"],
         ["<b>🧠 Psychological therapy</b>","CBT/ACT reduces pain-related distress, catastrophising and disability; refer to pain psychology for persistent pain","<b>Consistent with NG193's emphasis on supported self-management</b>"],
         ["<b>🏃 Physical activity</b>","Graded exercise and physiotherapy maintain function and mood; pacing strategies for flares","Improves function independent of pain score"],
         ["<b>😴 Sleep and mood</b>","Treat coexisting insomnia and depression — a bidirectional relationship with pain. The choice of agent (amitriptyline, duloxetine) can address both","One drug, two problems"],
         ["<b>⚡ TENS and self-help</b>","TENS may help some patients; signpost to self-management resources and pain support groups","Low-risk adjuncts"],
         ["<b>🦶 Foot and skin care</b>","In sensory neuropathy, protect insensate areas; diabetic foot surveillance to prevent ulceration","Prevents the complication that costs limbs"]
       ]},
       {b:"why", html:"CBT/ACT, graded activity and addressing sleep and mood improve function and reduce reliance on escalating medication — which is why the non-drug half of this page is not optional garnish."}
     ]},

    {id:"monitor", nav:"Monitor", title:"Follow-up and safety-netting", sub:"Structured review at 4–6 weeks, and a label that never anchors the next assessment.",
     blocks:[
       {b:"table", head:["When","What","Action"], rows:[
         ["<b>4–6 weeks</b>","<b>Review the response to the first-line agent</b>","Titrate or switch per CG173. Reassess sleep, mood and function, not just the pain score"],
         ["<b>Ongoing</b>","Side effects, adherence, and (gabapentinoids) signs of misuse or diversion; review co-prescribed sedatives","<b>Review the underlying cause too — e.g. glycaemic control</b>"],
         ["<b>Re-examine</b>","<b>Repeat the neurological assessment if symptoms change</b>","New or progressing deficit warrants re-triage for a compressive or sinister cause"],
         ["<b>Ineffective drug</b>","<b>At review</b>","<b>Taper and stop — do not continue indefinitely or stack</b>"],
         ["<b>Refractory pain</b>","<b>Persistent disabling pain despite optimised therapy</b>","<b>Pain clinic plus psychological support</b>"]
       ]},
       {b:"cards", items:[
         {tone:"red", h:"📞 999 / urgent", html:"New bladder or bowel disturbance, saddle anaesthesia, bilateral leg weakness, or rapidly progressive deficit → emergency (cauda equina / cord compression)."},
         {tone:"amber", h:"🟠 Cancer safety-net", html:"Known cancer with new or worsening spinal or band-like pain → urgent MSCC pathway."},
         {tone:"cream", h:"💬 What to say", html:"“If you develop trouble passing urine, numbness around the saddle area, or weakness in both legs, that's an emergency — go straight to hospital.” “These tablets take a few weeks to work, so don't judge them in the first fortnight.” “If it isn't helping, we stop it rather than adding another on top.”"}
       ]},
       {b:"why", html:"A neuropathic-pain label must not anchor future assessments: a change in neurological signs always reopens the question of a compressive or malignant cause. Structured review at 4–6 weeks prevents both premature abandonment of effective drugs and indefinite continuation of ineffective ones."}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways", sub:"Most neuropathic pain is managed in primary care, but the referral filter must reliably catch the compressive emergencies and cancer-related pain.",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"Emergency — same-day", html:"Suspected cauda equina, MSCC, epidural abscess, or rapidly progressive deficit — same-day imaging or admission."},
         {tone:"red", h:"Urgent oncology / MSCC", html:"A cancer patient with new or progressive spinal or radicular pain — MSCC coordinator plus whole-spine MRI within 24 hours (≤24h)."},
         {tone:"amber", h:"Neurology", html:"Diagnostic uncertainty, progressive or atypical neuropathy, trigeminal neuralgia failing carbamazepine, suspected central cause or MS."},
         {tone:"blue", h:"Pain clinic", html:"Refractory pain despite optimised treatment — for interventional options, combination regimens and multidisciplinary (MDT) support. Early pain-clinic involvement helps patients with persistent pain avoid escalating, low-value drug regimens."},
         {tone:"blue", h:"Diabetes / specialist medicine", html:"Painful diabetic neuropathy not responding to optimised glycaemia plus first-line agents."},
         {tone:"green", h:"Primary care manages", html:"Typical, stable neuropathic pain responding to CG173 first-line therapy with adequate review."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 61-year-old woman with type 2 diabetes describes six months of burning, night-worse pain in both feet, and now asks for “something stronger” because paracetamol and codeine have not helped. Her HbA1c is 74 mmol/mol. In passing she mentions a new ache across her lower back since a fall, and she was treated for breast cancer four years ago."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Recognises the <b>symmetrical burning night-worse pattern as diabetic neuropathy</b> and that <b>paracetamol and opioids are the wrong class</b>; does NOT start on the ladder before addressing the new back pain in a patient with a cancer history — MSCC until proven otherwise, with the <b>whole-spine MRI within 24 h (≤24h)</b> route stated; performs a <b>foot check with monofilament</b> and assesses ulcer risk; chooses <b>duloxetine as first-line in painful diabetic neuropathy</b> and explains <b>switch-not-stack</b> plus the 4–6-week horizon; addresses <b>glycaemic control in parallel</b>; and safety-nets <b>cauda equina in plain words</b>."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every recommendation on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>NICE CG173 \u2014 Neuropathic pain in adults: pharmacological management in non-specialist settings (2019, updated; replacing the earlier CG173)<br><a href="https://www.nice.org.uk/guidance/cg173" rel="noopener">nice.org.uk/guidance/cg173</a><span class="rd"> \u2014 the choice of one of four first-line agents, the switch-not-stack rule, carbamazepine for trigeminal neuralgia, capsaicin for localised pain, and the explicit do-not-start list (strong opioids, cannabis-based products, other antiepileptics outside specialist care)</span></li>'+
         '<li><b>NICE NG193 \u2014 Chronic pain (primary and secondary) in over-16s</b><br><a href="https://www.nice.org.uk/guidance/ng193" rel="noopener">nice.org.uk/guidance/ng193</a><span class="rd"> \u2014 the chronic primary pain route: exercise, CBT/ACT, acupuncture, an antidepressant even without depression, and the do-not-start list</span></li>'+
         '<li>NICE CG75 / NG234 \u2014 Spinal metastases and metastatic spinal cord compression \u00b7 NICE NG12 (updated May 2025)<br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> \u2014 whole-spine MRI within 24 hours and immediate oncology contact for suspected MSCC</span></li>'+
         '<li><b>DN4 \u00b7 LANSS \u00b7 painDETECT</b><span class="rd"> \u2014 validated screening tools that support, not replace, clinical judgement</span></li>'+
         '<li>MHRA \u2014 gabapentinoid reclassification (Class C, Schedule 3, April 2019)<span class="rd"> \u2014 misuse and diversion risk, and the respiratory-depression risk when co-prescribed with opioids</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> \u2014 verify all doses, titration steps and renal/hepatic adjustments before prescribing</span></li>'+
         '</ul></div>'}
