MG.render({
  icon:"🔋",
  title:"ME/CFS — the complete guide",
  eyebrow:"Protocol · NICE NG206 · a positive diagnosis, and a prohibition",
  stemTitle:"NG206 reframed this condition twice over: the diagnosis is POSITIVE, made on criteria by 3 months rather than after years of exclusion — and fixed graded exercise therapy is not merely unhelpful but capable of harm",
  stemSub:"One page for the whole condition. <b>Post-exertional malaise is the central feature</b> — worsening after minimal activity, often delayed — and the diagnosis is made on criteria at 3 months once mimics are excluded, not withheld indefinitely. Management is <b>patient-led energy management within the energy envelope</b>, symptom control, and a personalised care and support plan. Do NOT prescribe fixed or incremental graded exercise therapy, do not advise pushing through, and do not offer any therapy as a cure — including CBT, which may support coping and distress but does not reverse the illness.",
  guideline:"NICE NG206",
  reviewed:"14 September 2026",
  nextReview:"14 March 2027",
  meta:[
    {t:"NICE NG206 — ME/CFS diagnosis and management"},
    {t:"Do NOT offer fixed or incremental GET", tone:"tw"},
    {t:"Diagnose by 3 months — positively, on criteria", tone:"tw"},
    {t:"v2.0 · reviewed Sep 2026", tone:"ok"}
  ],
  lead:'<div class="mg-layers"><a href="#diagnose"><b>Diagnose</b><small>PEM · 3 months</small></a><a href="#energy"><b>Energy</b><small>Pacing, not GET</small></a><a href="#symptoms"><b>Symptoms</b><small>Targeted</small></a><a href="#follow"><b>Support</b><small>Care plan</small></a><a href="#refer"><b>Refer</b><small>Specialist · severe</small></a></div>',
  quickSub:"The six that matter. Every figure traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"⛔ Do NOT offer fixed or incremental graded exercise therapy", html:"NG206 is explicit: do not offer any programme based on the premise that ME/CFS is caused by deconditioning, and do not advise \"push through\". <b>This can cause harm.</b> CBT may be offered to support coping and distress — but be explicit that it is NOT a cure and does not reverse the illness, because offering it as one is the failure that has done most damage to trust in this condition."},
    {tone:"blue", h:"Post-exertional malaise is the central feature", html:"Debilitating fatigue PLUS post-exertional malaise — worsening after minimal activity, often DELAYED by hours or a day — plus unrefreshing sleep and cognitive difficulty (\"brain fog\"), not relieved by rest, with functional impairment. <b>The delay is what patients describe and clinicians miss</b>: they feel able at the time and are wiped out the next day."},
    {tone:"amber", h:"Diagnose positively, by 3 months", html:"If the symptoms persist for 3 months or more and other causes are excluded, make the diagnosis — confirm or review by 3 months, ideally with specialist input. NG206 made this a POSITIVE diagnosis on criteria, not a label of last resort after years — delaying it denies people the care plan and adjustments they need."},
    {tone:"blue", h:"The exclusion screen, done once and properly", html:"FBC, U&amp;Es, LFTs, TFTs, glucose or HbA1c, ESR or CRP, calcium, ferritin, coeliac serology, CK and vitamin D — plus others directed by the history. Excluding anaemia, thyroid disease, coeliac disease, diabetes, inflammatory and infective causes, and depression. Do the screen once, thoroughly, rather than repeating it indefinitely instead of diagnosing."},
    {tone:"green", h:"Energy management means staying inside the envelope", html:"Patient-led pacing — staying within the \"energy envelope\" to avoid triggering PEM, with flexible activity and rest rather than fixed incremental increases. Involve occupational therapy or physiotherapy experienced specifically in ME/CFS, because generic rehabilitation advice tends towards exactly the graded increases NG206 warns against."},
    {tone:"amber", h:"Red flags mean it is not ME/CFS", html:"Weight loss, lymphadenopathy, fever or night sweats, or focal neurology → investigate for an alternative diagnosis. And in severe or very severe disease — housebound or bedbound — assess nutrition, hydration, pressure care and the sensory environment, with safeguarding awareness; rapid deterioration or unsafe intake needs urgent specialist review."}
  ],
  pathwaySub:"Five steps, and the second is where most harm has historically been done.",
  pathway:[
    {title:"Suspect and screen", html:"Fatigue with post-exertional malaise, unrefreshing sleep and cognitive difficulty, with functional impairment. <b>Run the exclusion bloods once and properly.</b>"},
    {title:"Diagnose positively by 3 months", html:"Symptoms persisting 3 months or more with other causes excluded — confirm or review by 3 months, ideally with specialist input.", alert:true},
    {title:"Support energy management — never fixed GET", html:"Patient-led pacing within the energy envelope; OT or physio experienced in ME/CFS. <b>No incremental exercise programmes, no \"push through\".</b>"},
    {title:"Treat the symptoms on their own merits", html:"Pain, sleep, orthostatic intolerance, mood — and treat depression or anxiety as itself, because ME/CFS is not a primary psychiatric illness."},
    {title:"Build the care plan and refer", html:"Personalised care and support plan, regular review, specialist ME/CFS service, and proactive support in severe disease."}
  ],
  sections:[

    {id:"diagnose", nav:"Diagnose", title:"Step 1 — diagnosing on NG206 criteria and excluding mimics",
     blocks:[
       {b:"table", head:["Element","Detail"], rows:[
         ["<b>Suspect</b>","Debilitating fatigue PLUS post-exertional malaise (worsening after minimal activity, often delayed) PLUS unrefreshing sleep PLUS cognitive difficulties (\"brain fog\"), not relieved by rest, with functional impairment"],
         ["<b>Diagnose</b>","If these persist for 3 months or more and other causes are excluded (NG206); confirm or review by 3 months, ideally with specialist input"],
         ["<b>Exclude</b>","FBC, U&amp;Es, LFTs, TFTs, glucose or HbA1c, ESR or CRP, calcium, ferritin, coeliac serology, CK, vitamin D — plus others directed by the history. Excluding anaemia, thyroid disease, coeliac disease, diabetes, inflammatory and infective causes, and depression"],
         ["<b>Assess</b>","Severity, functional impact, and comorbidity — mood, orthostatic intolerance, IBS-type symptoms"]
       ]},
       {b:"why", html:"NG206 reframed ME/CFS: post-exertional malaise is central, and the diagnosis is positive — made on criteria after excluding mimics, by 3 months. Crucially, it warns against fixed graded exercise programmes and against any therapy presented as curative. Both halves matter equally: diagnosing late withholds support, and treating with incremental exercise causes harm."}
     ]},

    {id:"energy", nav:"Energy", title:"Step 2 — energy management and support",
     blocks:[
       {b:"cards", cols:2, items:[
         {tone:"green", h:"🔋 Pacing", html:"Patient-led energy management — staying within the \"energy envelope\" to avoid triggering PEM; flexible activity and rest, NOT fixed incremental increases."},
         {tone:"blue", h:"🛌 Sleep", html:"<b>Sleep hygiene; manage unrefreshing and disrupted sleep.</b> Avoid over-sleeping advice that does not help."},
         {tone:"amber", h:"🧠 Support, not cure", html:"<b>CBT may be offered to support coping and distress — NOT as a cure.</b> <b>Be explicit that it does not reverse the illness</b>, or the offer itself damages trust."},
         {tone:"green", h:"🍽️ Nutrition and comorbidity", html:"Maintain nutrition and hydration; treat orthostatic intolerance, pain, mood and IBS-type symptoms."}
       ]},
       {b:"warn", html:"Do NOT offer fixed or incremental graded exercise therapy (GET), or any programme based on the premise that ME/CFS is caused by deconditioning, and do not advise \"push through\" — this can cause harm (NG206)."}
     ]},

    {id:"symptoms", nav:"Symptoms", title:"Step 3 — targeted symptom control",
     blocks:[
       {b:"table", head:["Symptom","Approach"], rows:[
         ["<b>Pain</b>","Analgesia according to cause; neuropathic agents if there are neuropathic features"],
         ["<b>Sleep</b>","<b>Address insomnia with cautious, time-limited approaches</b>"],
         ["<b>Orthostatic intolerance</b>","<b>Fluids and salt as appropriate; review medications; specialist advice</b>"],
         ["<b>Mood</b>","Treat coexisting depression or anxiety on their own merits — ME/CFS is not a primary psychiatric illness"]
       ]}
     ]},

    {id:"follow", nav:"Support", title:"Step 4 — ongoing support under NG206",
     blocks:[
       {b:"dl", rows:[
         ["<b>Regular review — personalised care</b>","Review at agreed intervals and coordinate a personalised care and support plan (NG206). Manage symptoms individually — sleep, pain, comorbid mood. <b>Do NOT offer graded exercise therapy as a cure</b>"],
         ["<b>Energy management</b>","Support energy management and pacing, staying within the individual's energy envelope to avoid post-exertional malaise. <b>Involve OT or physiotherapy experienced in ME/CFS</b>"],
         ["<b>Worsening or severe</b>","Refer to a specialist ME/CFS service for confirmation and for complex or severe disease; assess nutrition and risk in the housebound"]
       ]},
       {b:"say", html:"There's no quick fix, and I'm not going to pretend otherwise. The foundation is careful pacing within your energy limits — and specifically not a programme of gradually increasing exercise, because for this condition that can make people worse rather than better. We'll build a plan around your worst symptoms, review it regularly, and get you in to the specialist service."}
     ]},

    {id:"safety", nav:"Red flags", title:"Red flags — when it is not ME/CFS",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"🔴 Alarm features", html:"Weight loss, lymphadenopathy, fever or night sweats, or focal neurology → investigate for an alternative diagnosis."},
         {tone:"red", h:"🔴 Severe or housebound", html:"Rapid deterioration, or unsafe nutrition or hydration → urgent specialist and safeguarding-aware review."},
         {tone:"amber", h:"💬 Safety-net", html:"\"If you lose weight unintentionally, develop fevers or lumps, or get new neurological symptoms, tell us — those are not part of ME/CFS.\""},
         {tone:"green", h:"✓ What we are aiming for", html:"\"Stability within your limits, fewer crashes, and a plan that flexes with how you are — rather than a target you have to hit.\""}
       ]}
     ]},

    {id:"refer", nav:"Refer", title:"Referral and severe disease",
     blocks:[
       {b:"cards", items:[
         {tone:"blue", h:"Specialist ME/CFS service", html:"Refer to confirm the diagnosis and for multidisciplinary support and an individualised care and energy-management plan."},
         {tone:"red", h:"Severe or very severe disease", html:"Housebound or bedbound — proactive support, home visits, and attention to nutrition, pressure care and the sensory environment, with safeguarding awareness."},
         {tone:"amber", h:"Investigate", html:"Atypical features or new red flags → reconsider and exclude alternative diagnoses."},
         {tone:"blue", h:"Mental health", html:"<b>If there is significant comorbid depression or anxiety.</b> See <a href='depression.html'>depression</a> and <a href='anxiety.html'>anxiety</a>."},
         {tone:"cream", h:"GP management", html:"The positive diagnosis, the exclusion screen, energy management, symptom control, the personalised care and support plan and regular review all belong here. Related pages: <a href='chronic-pain.html'>chronic pain</a> · <a href='insomnia.html'>insomnia</a> · <a href='depression.html'>depression</a> · <a href='malnutrition.html'>malnutrition</a> · <a href='../algorithms/fatigue.html'>fatigue pathway</a>."}
       ]},
       {b:"say", html:"This is ME/CFS. The key feature is that even small amounts of activity can leave you much worse for a day or more — so management is about pacing and staying within your energy limits, not pushing through or a fixed exercise plan, which can make things worse. We'll rule out other causes, support your symptoms, and refer you to a specialist service."}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 29-year-old teacher has had 7 months of disabling fatigue since a viral illness. She describes being able to manage a short walk, then being <b>bedbound for the following two days</b>. Sleep is unrefreshing and she cannot concentrate enough to mark work. Bloods 5 months ago were normal. A previous clinician told her to \"build up her exercise gradually\" and she is <b>worse since trying</b>. She is <b>tearful</b> and asks whether it is \"all in her head\". She has <b>lost no weight</b> and has no lumps or fevers."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"Identifies the two-day delayed crash as post-exertional malaise — the central NG206 feature — and says so explicitly, which is itself validating; makes a POSITIVE diagnosis rather than deferring: 7 months of symptoms with normal bloods meets the criteria, and NG206 expects diagnosis by 3 months; explicitly names that the graded-exercise advice she was given is no longer recommended and can cause harm, and that her deterioration is a recognised consequence rather than her fault; answers \"is it all in my head?\" directly — ME/CFS is not a primary psychiatric illness, while still addressing her low mood on its own merits; <b>checks the exclusion screen was complete</b> rather than repeating it reflexively; <b>explains pacing and the energy envelope</b>, and refers to OT or physio experienced specifically in ME/CFS; <b>refers to the specialist ME/CFS service</b>; offers CBT only for coping and distress, with the explicit caveat that it is not a cure; and <b>safety-nets the red flags that would mean another diagnosis.</b>"}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li>NICE NG206 — Myalgic encephalomyelitis (or encephalopathy) / chronic fatigue syndrome: diagnosis and management (2021)<br><a href="https://www.nice.org.uk/guidance/ng206" rel="noopener">nice.org.uk/guidance/ng206</a><span class="rd"> — post-exertional malaise as a core diagnostic feature, the four-symptom criteria with diagnosis at 3 months, the recommendation against any programme based on fixed or incremental increases in physical activity or on a deconditioning model, CBT offered to support coping rather than as a cure, energy management within the energy envelope, the personalised care and support plan, and the specific provisions for severe and very severe disease</span></li>'+
         '<li><b>NICE NG206 \u2014 investigations to exclude alternative diagnoses</b><span class="rd"> — the blood-test screen quoted (FBC, U&amp;Es, LFTs, TFTs, glucose/HbA1c, ESR/CRP, calcium, ferritin, coeliac serology, CK, vitamin D) and the conditions it is intended to exclude</span></li>'+
         '<li><b>NICE NG206 — ME/CFS</b><br><a href="https://www.nice.org.uk/guidance/ng206" rel="noopener">nice.org.uk/guidance/ng206</a><span class="rd"> — the red flags prompting investigation for an alternative diagnosis: unintentional weight loss, lymphadenopathy, fever or night sweats, and focal neurology</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"ME/CFS in primary care — NICE NG206. Post-exertional malaise is the central feature, and the diagnosis is POSITIVE: made on criteria at 3 months once mimics are excluded, not withheld for years. Management is patient-led energy management within the energy envelope, targeted symptom control, and a personalised care and support plan. Do NOT offer fixed or incremental graded exercise therapy, any programme premised on deconditioning, or advice to push through — this can cause harm. CBT may support coping and distress but is not a cure, and must be offered as such. Weight loss, lymphadenopathy, fever or focal neurology mean investigating for something else. Verify against current NICE NG206."
