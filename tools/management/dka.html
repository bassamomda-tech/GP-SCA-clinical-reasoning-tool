  stemSub:"One page for the whole condition: the JBDS triad and severity bands, what a GP can and cannot do (mild ketonaemia without acidosis only with an individualised sick-day plan and urgent diabetes-team advice; suspected or confirmed DKA never), euglycaemic DKA on SGLT2 inhibitors, the hospital protocol as a labelled reference so you can hand over well, why children and young people need a separate paediatric DKA pathway, and the prevention work that actually belongs to primary care — sick-day rules, ketone meters, CGM, and the psychological causes of insulin omission.",

  quickSub:"If you read nothing else on this page, read these six cards. Every number traces to the source cited under <a href=\"#provenance\">Evidence</a>.",
  quick:[
    {tone:"red", h:"\u26a0 The triad \u2014 and its euglycaemic exception", html:"In the usual adult JBDS definition, DKA is diagnosed by ketones &gt;3.0 mmol/L (or urine ketones \u22652+), glucose &gt;11 mmol/L and acidosis \u2014 venous pH &lt;7.3 and/or bicarbonate &lt;15 mmol/L. However, euglycaemic DKA can occur, so in a person with diabetes, significant ketonaemia plus metabolic acidosis should be treated as possible DKA even when glucose is &lt;11 mmol/L. <b>999. Suspected or confirmed DKA requires emergency hospital assessment and is not managed in routine primary care.</b>"},
    {tone:"red", h:"Potassium \u2014 hand it over, do not treat it", html:"Potassium abnormalities affect the timing and safety of intravenous insulin, but <b>potassium replacement and insulin decisions belong to the hospital DKA team</b>. Do not attempt to correct potassium or administer IV insulin in primary care. Include the potassium result in the emergency handover if available."},
    {tone:"amber", h:"Euglycaemic DKA — the one that gets missed", html:"DKA can occur with normal or only modestly raised glucose, especially with SGLT2 inhibitors (empagliflozin, dapagliflozin, canagliflozin, ertugliflozin), fasting or reduced carbohydrate intake, vomiting or dehydration, acute infection, surgery, pregnancy, or insulin omission or reduced insulin delivery. <b>In an unwell person with diabetes, check ketones even if the glucose is normal or only mildly raised.</b> Do not use urine ketones to exclude euglycaemic DKA when capillary blood ketone testing is available."},
    {tone:"blue", h:"Never omit insulin — including the basal", html:"Missed insulin is the commonest preventable trigger, causing roughly 20–30% of DKA admissions. And in hospital the <b>long-acting basal insulin continues throughout DKA treatment</b> (JBDS 2023) — stopping it causes rebound hyperglycaemia and ketosis when the infusion stops."},
    {tone:"red", h:"Children follow a separate paediatric pathway", html:"Children and young people require a separate paediatric DKA pathway; this adult primary-care protocol must not be used to manage paediatric DKA. A child or young person with DKA who develops headache, irritability, altered consciousness, bradycardia, abnormal breathing or new neurological signs: <b>call 999/paediatric emergency services immediately</b> and inform the paediatric diabetes/critical-care team. Do not independently alter or stop fluids unless directed by the paediatric emergency protocol."},
    {tone:"green", h:"What primary care actually owns", html:"Mild ketonaemia without acidosis may be managed using an individualised sick-day plan with urgent diabetes-team advice, provided the patient is clinically stable, can maintain fluids and ketones are improving \u2014 suspected or confirmed DKA never can. The rest of the GP's job is prevention: access to blood-ketone testing where appropriate, written sick-day rules, CGM, education never to stop insulin without specialist advice, and asking directly about insulin omission and diabetes distress."}
  ],
  pathwaySub:"The whole task in five moves. The red step is a phone call, not a treatment.",
  pathway:[
    {title:"Check glucose AND ketones", html:"In any unwell person with diabetes — polyuria, thirst, vomiting, abdominal pain, drowsiness, Kussmaul breathing, ketotic breath — and in anyone unwell on insulin or an SGLT2 inhibitor, even if the glucose is normal or only mildly raised. Assess ABCDE.", alert:true},
    {title:"Apply the triad", html:"Ketones &gt;3.0 + glucose &gt;11 + acidosis = DKA \u2192 999; significant ketonaemia with acidosis is possible DKA even when glucose is &lt;11, and blood ketones \u22653.0 mmol/L are an emergency even if the glucose is not high. Blood ketones 1.5\u20132.9 mmol/L need <b>urgent same-day advice from the diabetes team or acute assessment</b>, using the patient's written personalised sick-day plan."},
    {title:"Call 999 and hand over", html:"<b>Call 999, do not delay transfer, and provide a structured handover.</b> Do not attempt to initiate intravenous insulin or follow the JBDS fluid protocol unless working within an appropriately equipped emergency setting and local governance pathway. Tell the receiving team the ketone level, the glucose, the potassium if known, and <b>the precipitant you suspect</b>."},
    {title:"Know the hospital protocol (reference only)", html:"Hospital reference only \u2014 not for primary-care initiation or adjustment. Fixed-rate insulin at 0.1 unit/kg/h, basal insulin continued, potassium replaced by band, 10% dextrose added when glucose falls below 14 — so you can follow the discharge summary and continue the plan."},
    {title:"Own the prevention", html:"Sick-day rules at every review, a prescribed <b>blood ketone meter</b>, CGM, and <b>a psychological assessment where insulin omission is suspected</b>."}
  ],
  sections:[

    {id:"severe", nav:"Recognise", title:"Emergency recognition — and the four situations that change the plan",
     blocks:[
       {b:"table", head:["Presentation","What it is","Action"], rows:[
         ["Known or new diabetes + glucose &gt;11 mmol/L + ketonuria ≥2+ or blood ketones ≥3.0 mmol/L + bicarbonate &lt;15 or venous pH &lt;7.3","<b>Suspected or confirmed diabetic ketoacidosis</b> (possible DKA even with glucose &lt;11 if ketonaemia and acidosis)","999. Assess ABCDE; check capillary glucose and blood ketones if available; do not delay transfer; structured handover. IV fluids and insulin are hospital-led \u2014 do not start them in primary care unless in an appropriately equipped emergency setting under local governance"],
         ["Child or young person with DKA + headache, irritability, altered consciousness, bradycardia, abnormal breathing or new neurological signs","Suspected cerebral injury in paediatric DKA \u2014 needs the separate paediatric DKA pathway","999/paediatric emergency services immediately; inform the paediatric diabetes/critical-care team. Immediate paediatric emergency and PICU management according to the local paediatric DKA protocol. Do not independently alter or stop fluids unless directed by that protocol"],
         ["Glucose &gt;30 mmol/L + osmolality &gt;320 mOsm/kg + confusion + no or minimal ketosis + severe dehydration in an older person with type 2 diabetes","<b>Hyperosmolar hyperglycaemic state (HHS) — not DKA</b>","999. HHS is a hospital emergency requiring a dedicated JBDS HHS protocol: initial management prioritises cautious fluid replacement, monitoring osmolality and avoiding rapid shifts; insulin timing follows the hospital HHS protocol and specialist advice. Mixed DKA/HHS requires specialist management"],
         ["DKA + chest pain + ECG changes + potassium >6.0 or <3.0 mmol/L on IV insulin","<b>Dangerous potassium abnormality</b>","999. Potassium replacement and insulin decisions belong to the hospital DKA team \u2014 do not attempt to correct potassium or give IV insulin in primary care. Include the potassium result in the handover"],
         ["<b>DKA in pregnancy, any trimester</b>","DKA can occur at lower glucose levels in pregnancy, even with apparently mild maternal symptoms","<b>999. Urgent obstetric-diabetes management, with fetal monitoring</b>, following the local obstetric DKA protocol for fluids and insulin. Do not rely on a glucose threshold to exclude DKA. SGLT2 inhibitors should not be used in pregnancy (NICE NG3)"],
         ["Normal or mildly raised glucose + ketonaemia ≥3.0 + acidosis + recent SGLT2 inhibitor use","<b>SGLT2 inhibitor-induced euglycaemic DKA</b>","999. Stop the SGLT2 inhibitor; hospital DKA protocol (insulin plus dextrose to maintain the glucose). <b>Before surgery, stop the SGLT2 inhibitor according to the current perioperative policy</b>"]
       ]},
       {b:"why", html:"<b>Children and young people require a separate paediatric DKA pathway</b> (NICE NG18 and the current ISPAD/BSPED/local paediatric protocol); this adult primary-care protocol must not be used to manage paediatric DKA. Suspected cerebral injury in a child with DKA requires immediate paediatric emergency and PICU management according to the local paediatric DKA protocol \u2014 the GP's role is recognition, a 999 call and handover."},
       {b:"dl", rows:[
         ["<b>NG12 stated honestly</b>","DKA has no NICE NG12 suspected-cancer criterion, and none should be invented for one. It is a metabolic emergency. The one adjacency worth remembering afterwards is that new-onset diabetes in an older patient with weight loss deserves thought about pancreatic cancer — NG12 gives direct-access CT within 2 weeks for people aged 60 and over with weight loss plus new-onset diabetes — but that is a post-discharge work-up, never a reason to delay the 999 call"]
       ]}
     ]},

    {id:"confirm", nav:"Criteria", title:"Diagnostic criteria, severity, and what precipitated it",
     blocks:[
       {b:"dl", rows:[
         ["<b>JBDS adult diagnostic criteria</b>","<b>1 Capillary ketones &gt;3.0 mmol/L</b> (or urine ketones \u22652+). 2 Capillary glucose &gt;11 mmol/L. <b>3 Venous pH &lt;7.3 and/or bicarbonate &lt;15 mmol/L.</b> Euglycaemic DKA can occur, particularly with SGLT2 inhibitors, pregnancy, fasting or insulin deficiency \u2014 do not require glucose &gt;11 mmol/L before escalating a symptomatic patient with significant ketones and acidosis"],
         ["<b>Mild DKA</b>","<b>pH 7.25–7.30, bicarbonate 15–18 mmol/L, GCS 15</b> — may be managed on a general medical ward"],
         ["<b>Moderate DKA</b>","<b>pH 7.00–7.24, bicarbonate 10–14 mmol/L, GCS 15</b> — medical ward or high dependency"],
         ["<b>Severe DKA</b>","<b>pH <7.00, bicarbonate <10 mmol/L, GCS <15</b> — ICU or HDU"]
       ]},
       {b:"table", head:["Precipitant","Frequency / note"], rows:[
         ["<b>New-onset type 1 diabetes</b>","<b>30–40% of DKA</b> — the first presentation"],
         ["<b>Infection</b>","<b>The commonest precipitant</b> — UTI, pneumonia, skin or soft-tissue infection. <b>Always look for the source</b>"],
         ["<b>Insulin omission</b>","<b>About 20–30% of DKA</b> — a disrupted routine, deliberate self-harm, or an eating disorder"],
         ["<b>Myocardial infarction or acute coronary syndrome</b>","<b>Always check ECG and troponin</b>"],
         ["Pregnancy","Lower glucose threshold; euglycaemic DKA more common"],
         ["<b>SGLT2 inhibitor</b>","<b>Euglycaemic DKA</b>"],
         ["Cocaine and recreational drugs","Sympathomimetic insulin resistance"]
       ]},
       {b:"table", head:["","DKA","HHS"], rows:[
         ["Usual type","<b>Predominantly type 1</b>","<b>Predominantly type 2</b>"],
         ["Glucose","Typically <b>14–40 mmol/L</b>","Typically <b>&gt;30 mmol/L</b>"],
         ["Ketosis","<b>Severe — blood ketones ≥3.0</b>","<b>None or minimal — ketones <3.0 mmol/L, bicarbonate >15</b>"],
         ["pH","<b>Below 7.3</b>","Normal or mildly reduced"],
         ["Osmolality","Moderately raised (<b>300–320 mOsm/kg</b>)","<b>Markedly raised — above 320 mOsm/kg</b>"],
         ["Onset and correction","Hours to days; <b>resolution expected within 24 hours</b>","<b>Days to weeks; slow correction over 48–72 hours</b> because of cerebral oedema risk from overcorrection"],
         ["Mortality","\u2014","<b>Significantly higher than DKA — 15–20%</b>"]
       ]},
       {b:"dl", rows:[
         ["<b>Mixed DKA and HHS</b>","<b>About 20–30% of hyperglycaemic emergencies have features of both</b> — moderately raised ketones (1.5–3.0) with glucose above 25, bicarbonate 15–18 and osmolality above 320. Mixed DKA/HHS requires specialist management under the hospital JBDS protocols"],
         ["<b>Type 2 DKA — rare but increasingly recognised</b>","Usually precipitated by severe illness, particularly in Black and African Caribbean patients — ketosis-prone or \u201cFlatbush\u201d diabetes, a fulminant beta-cell exhaustion from severe hyperglycaemia. After resolution, roughly 30–40% can subsequently be managed without insulin. Identify with <b>HbA1c at presentation, C-peptide</b> (preserved beta-cell function) and <b>GAD antibody</b> if there are type 1 features"]
       ]},
       {b:"why", html:"<b>Insulin omission is significantly under-recognised.</b> Insulin restriction associated with weight concerns (sometimes called \u201cdiabulimia\u201d, which is not a formal diagnosis) is one cause, but it should not replace a careful assessment for an eating disorder, depression, diabetes distress, self-harm, fear of hypoglycaemia, practical barriers, family conflict and access to insulin and supplies. If insulin omission is suspected, assess non-judgementally and refer jointly to the specialist diabetes psychology/eating-disorder service \u2014 do not frame the problem simply as non-adherence."}
     ]},

    {id:"workup", nav:"Assess", title:"History, examination and investigations",
     blocks:[
       {b:"dl", rows:[
         ["<b>History</b>","<b>Polyuria and polydipsia (osmotic), nausea, vomiting, abdominal pain</b> — which <b>can mimic a surgical abdomen (pseudo-peritoneum from ketonaemia)</b> — blurred vision, weakness, confusion. Duration of symptoms. The precipitating event: fever or infection symptoms, chest pain, <b>omission of insulin (ask directly and non-judgementally)</b>, new medication. The current insulin regimen — dose, type, timing, last dose. Glucose trends and ketone monitoring (<b>JBDS recommends blood rather than urine ketones</b>). Known triggers: surgery, trauma, stress. First presentation of diabetes"],
         ["<b>Examination</b>","<b>Conscious level (GCS).</b> Hydration — dry mucous membranes, reduced skin turgor, sunken eyes. <b>Kussmaul breathing</b> (deep sighing respirations blowing off CO₂ to compensate). The smell of ketones — pear-drop or acetone breath, present in only about 50% of cases, so it cannot be relied on. Abdominal tenderness from pseudo-peritoneum, which resolves with DKA treatment — but if the abdomen is hard and peritonitic, consider a true surgical emergency. Peripheral venous access. Signs of infection (chest, urine, skin). <b>Temperature — hypothermia is a poor prognostic sign in DKA</b>"],
         ["<b>Investigations</b>","<b>Capillary blood ketones</b> (point of care; ≥3.0 = DKA) · VBG for pH, bicarbonate and potassium — critical, obtained simultaneously · FBC, U&amp;E, <b>CRP</b>, glucose, HbA1c · <b>blood cultures, urine culture and CXR</b> to find the trigger · <b>ECG</b> (hyperkalaemia and hypokalaemia changes, and MI) · urinalysis and MSU · <b>troponin</b> if chest pain or ECG changes · <b>serum amylase or lipase</b> if abdominal pain — noting that <b>amylase is often mildly raised in DKA without true pancreatitis</b>"]
       ]},
       {b:"warn", html:"Potassium management is the most counterintuitive part of the protocol. Patients in DKA are <b>always total-body potassium depleted</b> — from osmotic diuresis, vomiting and intracellular loss — <b>even when the serum potassium looks normal or high on admission</b>, because severe acidosis drives K⁺ out of cells in exchange for H⁺ entering to buffer it. As insulin is given and the acidosis corrects, potassium moves rapidly back into cells and the serum level can fall precipitously to dangerous hypokalaemia within 1–2 hours if replacement has not started. Potassium abnormalities affect the timing and safety of intravenous insulin, but <b>potassium replacement and insulin decisions belong to the hospital DKA team</b>. Do not attempt to correct potassium or administer IV insulin in primary care; include the potassium result in the emergency handover if available."}
     ]},

    {id:"ladder", nav:"Hospital", title:"The JBDS 2023 treatment protocol",
     sub:"Hospital reference only \u2014 not for primary-care initiation or adjustment. Knowing it lets you hand over well and continue the plan after discharge; follow the linked current JBDS adult DKA guideline and local hospital protocol.",
     blocks:[
       {b:"ladder", steps:[
         {step:"Step 1", title:"Immediate resuscitation — first 30 minutes", when:"on arrival",
          html:"<b>IV 0.9% NaCl 500 mL over 10–15 minutes</b> as a resuscitation bolus if haemodynamically compromised (systolic BP <90); <b>if stable, 1 L over 1 hour</b>. Two large-bore IV cannulae, continuous cardiac monitoring, urinary catheter if unconscious, and immediately <b>VBG, U&amp;E, capillary blood ketones and ECG</b>."},
         {step:"Step 2", title:"Fixed-rate intravenous insulin infusion (FRIII)", when:"once potassium is known to be ≥3.5",
          fromLabel:"resuscitated",
          html:"<b>Insulin 0.1 units/kg/h (0.1 unit/kg/h) by infusion pump</b>, using short-acting soluble insulin (<b>Actrapid or Humulin S</b>). Continue the patient's long-acting basal insulin — do NOT stop Lantus, Levemir or Tresiba. Targets: ketone fall of ≥0.5 mmol/L/h, glucose fall of 3–4 mmol/L/h, bicarbonate rise of 3 mmol/L every 2 hours. When glucose falls <14 mmol/L (below 14), add 10% dextrose at 125 mL/h alongside the saline — do not reduce the insulin, because the ketosis must clear first."},
         {step:"Step 3", title:"Ongoing fluid and potassium replacement", when:"after the initial bolus",
          fromLabel:"deficit replacement",
          html:"0.9% NaCl with KCl: 1 L over 2 h → 1 L over 2 h → 1 L over 4 h → 1 L over 4 h → 1 L over 6 h. Add 40 mmol/L KCl to each bag if K⁺ is 3.5–5.5; do NOT add if K⁺ is >5.5; if K⁺ is <3.5, hold the insulin, give IV KCl and recheck before restarting. <b>Potassium monitoring every 1–2 hours initially</b>, with hourly capillary glucose and ketones, and <b>VTE prophylaxis</b>. Practically, potassium is replaced once K⁺ is <5.5 and the patient is passing urine, because insulin drives K⁺ intracellularly."},
         {step:"Step 4", title:"Resolution and transition to subcutaneous insulin", when:"ketones cleared",
          fromLabel:"biochemical resolution",
          html:"<b>DKA is resolved when blood ketones are <0.6 mmol/L AND venous pH is >7.3 (JBDS-IP 2023).</b> Do NOT stop the IV insulin until the patient has eaten a meal AND subcutaneous insulin has been given — overlap by 30–60 minutes. Give the subcutaneous insulin at the normal meal dose with the meal, continue the infusion for 30 minutes afterwards, then stop it. <b>The admission HbA1c guides subsequent management.</b>"}
       ]},
       {b:"why", html:"\u201cNever stop the long-acting insulin\u201d is a deliberate change from older protocols. Historically the infusion was the only insulin given, and everything stopped at transition. JBDS 2023 specifies that patients on long-acting basal insulin (glargine/Lantus, detemir/Levemir, degludec/Tresiba) continue their usual dose throughout DKA treatment, even while on IV insulin — because abrupt cessation causes <b>rapid rebound hyperglycaemia and ketosis after the infusion stops</b>. Maintaining basal insulin reduces DKA recurrence after discharge and makes the transition smoother. For newly diagnosed type 1 diabetes presenting in DKA, the diabetes team sets the starting basal dose once the ketosis has resolved."}
     ]},

    {id:"lifestyle", nav:"Prevent", title:"Prevention — the part primary care owns",
     sub:"Recognising early ketosis and applying sick-day rules correctly is what stops the next admission.",
     blocks:[
       {b:"dl", rows:[
         ["<b>Sick-day rules for type 1 diabetes</b>","Use the patient's written diabetes-team sick-day plan (NICE NG17). <b>Never stop basal insulin.</b> Test glucose and blood ketones regularly, and drink sugar-free fluids. Additional rapid-acting insulin may be required, but dose adjustment should follow the patient's individual protocol or urgent diabetes-team advice, taking account of the usual regimen, glucose and ketone trend, oral intake, age, pregnancy and pump or injection therapy. Seek emergency help if unable to keep fluids down, persistently vomiting, ketones rising despite correction insulin, blood ketones \u22653.0 mmol/L, or drowsy or confused \u2014 do not delay emergency assessment while attempting repeated home correction doses. Full dose tables are on the <a href='diabetes-unwell-insulin.html'>unwell on insulin protocol</a>, and the drugs to pause are on the <a href='sick-day-rules.html'>sick day rules protocol</a>"],
         ["<b>Ketone action thresholds</b>","<0.6 mmol/L = normal \u00b7 0.6\u20131.4 = monitor closely \u00b7 1.5\u20132.9 mmol/L = urgent same-day advice from the diabetes team or acute assessment, particularly if vomiting, dehydrated, pregnant, on an insulin pump, unable to keep fluids down or worsening despite correction insulin \u00b7 3.0 or above = treat as an emergency, call 999, even if the glucose is not high. Blood beta-hydroxybutyrate (BHB) is more sensitive and specific than urine ketones — urine reflects ketones from about 4–6 hours ago, blood is real time. Prescribe a blood ketone meter and strips according to the local formulary. GMMMG guidance does not routinely prescribe ketone strips for all people with type 2 diabetes solely because they take an SGLT2 inhibitor \u2014 people with symptoms need urgent assessment and capillary ketones where available"],
         ["<b>Continuous glucose monitoring</b>","Adults with type 1 diabetes should be offered CGM in line with current NICE and NHS England implementation guidance. The diabetes team usually initiates and trains the patient; primary care prescribing should follow the local pathway and shared-care arrangement. A rising glucose with an upward trend arrow can be an early warning of developing DKA. Patients using CGM still need access to capillary blood-glucose testing as backup"],
         ["<b>Insulin technology</b>","Pump therapy (CSII) can improve glycaemic control, but pump interruption can cause rapid ketosis because there is no long-acting subcutaneous insulin depot. Hybrid closed-loop systems are recommended in NICE TA943 (December 2023), but eligibility depends on the technology appraisal criteria, diabetes-team assessment and local implementation \u2014 not every adult, child or pregnant person automatically receives one. Discuss with the diabetes team where there is recurrent DKA, recurrent or problematic hypoglycaemia, or persistently high HbA1c despite optimised injections"],
         ["<b>Pump failure</b>","Pump users need specific failure advice: check the infusion set, tubing, cannula, reservoir and insulin; give correction insulin by pen if ketones are elevated or glucose is not responding; and contact the diabetes team urgently"]
       ]},
       {b:"cards", cols:2, items:[
         {tone:"amber", h:"🏃 Exercise", html:"<b>High-intensity or prolonged exercise raises ketones in type 1 diabetes</b> through the counter-regulatory response. Test after exercise: if ketones rise >1.5 mmol/L with a raised glucose, follow the personalised sick-day plan or seek diabetes-team advice. Fasted exercise without adequate insulin is a particular risk for exercise-related DKA. Take <b>15–30 g of carbohydrate before and during prolonged exercise</b>, and reduce basal insulin before prolonged aerobic exercise (DAFNE guidance)."},
         {tone:"amber", h:"🍷 Alcohol", html:"Alcohol brings both risks: hypoglycaemia (it inhibits gluconeogenesis) and ketosis (if eating drops). Always eat when drinking. Do not reduce insulin before drinking \u201cto prevent a hypo\u201d — that risks DKA. Use CGM overnight to catch nocturnal hypoglycaemia, and <b>test blood ketones the morning after heavy drinking</b>."},
         {tone:"blue", h:"🧠 Psychological support", html:"Diabetes distress, depression (2–3× the general-population prevalence) and eating disorders all matter here. Screen at every review with PHQ-9 and PAID (Problem Areas in Diabetes). If insulin omission is suspected, assess non-judgementally for diabetes distress, eating-disorder symptoms, depression, self-harm and practical barriers, and refer jointly to the specialist diabetes psychology/eating-disorder service \u2014 not simply framed as non-adherence. NHS Talking Therapies; <b>Diabetes UK helpline 0345 123 2399</b>; <b>JDRF</b> for peer support."},
         {tone:"cream", h:"🚗 Driving", html:"<b>Notify the DVLA if on insulin.</b> Group 1 (car): annual declaration; test glucose within 2 hours before driving and every 2 hours during the journey; have a snack if glucose is 5.0 mmol/L or less, and do not drive if it is below 4.0 mmol/L; keep rapid-acting glucose in the car. Group 2 (HGV/PCV): stricter — no severe hypoglycaemia in the preceding 12 months, full hypoglycaemia awareness, and glucose monitoring as the DVLA specifies. Advise and document."},
         {tone:"green", h:"🤰 Pre-conception (preconception) care", html:"DKA in pregnancy can occur at lower glucose levels \u2014 do not rely on a glucose threshold to exclude it, and use the local obstetric DKA protocol. SGLT2 inhibitors should not be used in pregnancy. Target HbA1c <48 mmol/mol before conception; folic acid 5 mg daily (high-dose — type 1 diabetes carries an elevated neural tube defect (NTD) risk); retinopathy screening; refer to the joint diabetes–obstetric clinic before conception. In pregnancy: capillary glucose targets below 5.3 mmol/L fasting and below 7.8 mmol/L one hour after meals, with CGM offered to everyone with type 1 diabetes (NICE NG3)."},
         {tone:"amber", h:"💊 SGLT2 inhibitor rules", html:"Stop the SGLT2 inhibitor during serious illness, vomiting, diarrhoea, fever, dehydration, reduced oral intake or fasting, and before surgery according to the current perioperative policy. Restart only after the patient is clinically recovered and eating and drinking normally (GMMMG 2026: after 24\u201348 hours of normal eating and drinking) \u2014 not simply after a fixed time if still unwell. Ensure patients have TREND-UK guidance and <b>document that it was given</b>."}
       ]}
     ]},

    {id:"monitor", nav:"After DKA", title:"Post-DKA follow-up and the annual review",
     blocks:[
       {b:"table", head:["When","What"], rows:[
         ["<b>Promptly after discharge</b>","Diabetes-team follow-up per the local post-DKA pathway (e.g. DSN contact within 24\u201348 hours where locally commissioned \u2014 not a universal NICE requirement) \u2014 confirm the precipitant, insulin regimen, ketone meter, sick-day rules, psychosocial factors and access to supplies"],
         ["<b>GP review per the local pathway</b>","GP appointment (e.g. within 1 week where locally agreed) \u2014 precipitant addressed, HbA1c reviewed, psychological assessment if insulin omission is suspected"],
         ["<b>At 3 months</b>","<b>HbA1c and diabetes team review</b>"],
         ["<b>Escalation</b>","A second DKA admission \u2192 specialist diabetes-team review. Closed-loop or pump suitability is decided by the diabetes team (cause of recurrence, insulin omission, cognitive and practical ability, CGM use, hypoglycaemia, engagement with education, local criteria), with psychology input where indicated"],
         ["<b>Regimen review</b>","Consider switching to <b>basal-bolus (MDI)</b> if not already, or a <b>pump (CSII) if the diabetes team judges it suitable</b>. <b>Prescribe a blood ketone meter if not already owned</b>, and give sick-day rules written and verbally"]
       ]},
       {b:"table", head:["Annual type 1 review (NICE NG17)","Detail"], rows:[
         ["HbA1c","<b>Target <48 mmol/mol for most adults</b> — individualise for hypoglycaemia unawareness or young children"],
         ["Renal","<b>eGFR and albumin/creatinine ratio (nephropathy screen)</b>"],
         ["Eyes and feet","<b>Annual retinopathy screening; monofilament and vibration testing</b>"],
         ["Cardiovascular","Blood pressure, lipids, weight and BMI"],
         ["Hypoglycaemia","Hypoglycaemia awareness"],
         ["Monitoring and technology","CGM and insulin technology review"],
         ["Psychosocial","Psychosocial assessment, including diabetes distress"],
         ["Sick-day and ketones","Sick-day plan and ketone-meter review"],
         ["<b>Thyroid</b>","Thyroid assessment according to current type 1 diabetes guidance"],
         ["<b>Coeliac</b>","Assess for coeliac disease at diagnosis and subsequently if symptoms, unexplained weight loss, iron/B12/folate deficiency or other clinical suspicion develops. Routine repeat serology in asymptomatic adults follows local diabetes guidance \u2014 a five-yearly interval is not a universal NICE requirement"],
         ["<b>DKA safety-netting</b>","At every review confirm: they know to ring 999 for ketones ≥3.0 or vomiting with inability to keep fluids down; the ketone meter works and the strips are in date; the sick-day rules are understood"]
       ]},
       {b:"why", html:"<b>Coeliac disease is easily missed in type 1 diabetes.</b> NICE NG17 directs assessment where clinically indicated, and NICE NG20 recommends a low threshold for testing and retesting people with type 1 diabetes if symptoms develop. Coeliac disease in type 1 causes hypoglycaemia from malabsorption, worsened control despite good adherence, and increased DKA risk — and a strict gluten-free diet often improves glycaemic control markedly. Positive serology goes to gastroenterology for duodenal biopsy."},
       {b:"say", html:"What happened to you is diabetic ketoacidosis — your body ran out of insulin, started burning fat for fuel, and the acid from that built up. The single most important thing going forward is that the insulin never stops, even on days you cannot eat: that is what caused this in most people it happens to. I want you to have a ketone meter at home with in-date strips, and a written plan for sick days. And if there is anything making it hard to take the insulin — how you feel about it, or about your weight — please tell me, because that is common and we can help with it properly."}
     ]},

    {id:"refer", nav:"Refer", title:"Referral pathways",
     blocks:[
       {b:"cards", items:[
         {tone:"red", h:"999", html:"All DKA \u2014 confirmed or suspected (including euglycaemic DKA, and blood ketones \u22653.0 even if the glucose is not high) \u00b7 altered consciousness \u00b7 <b>suspected cerebral injury in a child with DKA \u2014 paediatric emergency and PICU per the local paediatric DKA protocol</b> \u00b7 <b>potassium <3.5 or >6.5</b> · <b>pregnancy with DKA</b>. Flag for HDU/ICU on arrival if pH <7.1, ketones >6, bicarbonate <5, K⁺ <3.5 on admission, reduced GCS, SBP <90 or oxygen saturations <92%."},
         {tone:"amber", h:"Same-day hospital diabetes / endocrinology", html:"Mild DKA (pH 7.25–7.30) may be managed in a specialist unit if fully conscious, able to tolerate fluids and not vomiting — but it still needs IV access and hourly monitoring. <b>HHS (glucose above 30 with minimal ketosis) is always hospital.</b>"},
         {tone:"blue", h:"Urgent hospital assessment / same-day diabetes team", html:"Blood ketones 1.5\u20132.9 mmol/L need urgent same-day diabetes-team advice or acute assessment. Urgent hospital assessment rather than routine primary-care management for: vomiting or inability to maintain fluids \u00b7 rising ketones despite correction insulin \u00b7 drowsiness or confusion \u00b7 abdominal pain or Kussmaul breathing \u00b7 pregnancy \u00b7 pump failure \u00b7 suspected SGLT2-associated euglycaemic DKA."},
         {tone:"cream", h:"GP management \u2014 mild ketonaemia only", html:"Mild ketonaemia without acidosis may be managed using an individualised sick-day plan with urgent diabetes-team advice, provided the patient is clinically stable, can maintain fluids and ketones are improving. Suspected or confirmed DKA requires emergency hospital assessment and is not managed in routine primary care \u2014 always 999."},
         {tone:"green", h:"After discharge — shared care", html:"<b>Arrange diabetes-team follow-up promptly after discharge, with GP review according to the local post-DKA pathway.</b> Identify and address the precipitant; review the insulin regimen, sick-day rules and ketone monitoring; <b>psychological assessment if insulin was omitted</b>; then annual HbA1c, renal function, retinopathy and neuropathy checks."}
       ]}
     ]},

    {id:"sca", nav:"SCA", title:"SCA consultation practice", sub:"A short practice card only.",
     blocks:[{b:"cards", cols:2, items:[
       {tone:"cream", h:"Classic scenario", html:"A 19-year-old with type 1 diabetes is brought in by her mother — two days of vomiting, abdominal pain, and now breathing oddly. Her glucose is 22. Her mother says she has been \"fine with her insulin\", but the young woman avoids the question when you ask her directly, and her HbA1c has been climbing for a year."},
       {tone:"cream", h:"Examiner-style checkpoints", html:"<b>Checks ketones, not just glucose, and recognises the triad</b>; <b>calls 999 rather than attempting to manage it</b>; hands over the ketone level, glucose and suspected precipitant; asks about insulin omission directly and non-judgementally, with the mother out of the room; assesses non-judgementally for <b>eating-disorder symptoms, diabetes distress, depression, self-harm and practical barriers</b> and refers jointly to the specialist diabetes psychology/eating-disorder service, not a telling-off; and \u2014 after discharge \u2014 arranges prompt diabetes-team follow-up per the local post-DKA pathway, addresses the precipitant, and checks the ketone meter and sick-day rules rather than treating the admission as closed."}
     ]}]},

    {id:"provenance", nav:"Provenance", title:"Evidence", sub:"Every figure on this page is traceable to a named source.",
     blocks:[
       {b:"html", html:'<div class="card"><h3>Evidence panel</h3><ul class="evlist">'+
         '<li><b>JBDS-IP \u2014 The management of diabetic ketoacidosis in adults (2023)</b><br><a href="https://abcd.care" rel="noopener">abcd.care</a><span class="rd"> \u2014 the diagnostic criteria, severity bands and continue-the-basal-insulin principle; the hospital fluid, insulin and potassium schedule is reproduced on this page as a hospital reference only</span></li>'+
         '<li><b>JBDS-IP \u2014 The management of the hyperosmolar hyperglycaemic state (HHS) in adults</b><span class="rd"> \u2014 the dedicated hospital HHS protocol</span></li>'+
         '<li><b>ISPAD — DKA and hyperglycaemic hyperosmolar state guidelines (2022)</b><span class="rd"> \u2014 paediatric DKA context; children and young people follow the separate paediatric DKA pathway (with BSPED and local paediatric protocols)</span></li>'+
         '<li><b>NICE NG18 \u2014 Diabetes (type 1 and type 2) in children and young people</b><br><a href="https://www.nice.org.uk/guidance/ng18" rel="noopener">nice.org.uk/guidance/ng18</a><span class="rd"> \u2014 the paediatric pathway, including DKA</span></li>'+
         '<li><b>NICE NG17 — Type 1 diabetes in adults (2015, updated 2023)</b><br><a href="https://www.nice.org.uk/guidance/ng17" rel="noopener">nice.org.uk/guidance/ng17</a><span class="rd"> \u2014 hospital DKA treatment principles, written sick-day rules and ketone monitoring, CGM in line with NICE and NHS England implementation guidance, the annual review set and HbA1c targets</span></li>'+
         '<li><b>NICE NG20 \u2014 Coeliac disease: recognition, assessment and management</b><br><a href="https://www.nice.org.uk/guidance/ng20" rel="noopener">nice.org.uk/guidance/ng20</a><span class="rd"> \u2014 low threshold for testing and retesting people with type 1 diabetes if symptoms develop</span></li>'+
         '<li><b>NICE NG3 — Diabetes in pregnancy (2015, updated 2020)</b><br><a href="https://www.nice.org.uk/guidance/ng3" rel="noopener">nice.org.uk/guidance/ng3</a><span class="rd"> \u2014 preconception HbA1c and folic acid, pregnancy glucose targets, CGM for everyone with type 1 diabetes in pregnancy, and the pregnancy diabetes pathway</span></li>'+
         '<li>NICE TA943 — Hybrid closed-loop systems for type 1 diabetes (December 2023)<br><a href="https://www.nice.org.uk/guidance/ta943" rel="noopener">nice.org.uk/guidance/ta943</a><span class="rd"> \u2014 eligibility depends on the technology appraisal criteria, diabetes-team assessment and local implementation</span></li>'+
         '<li><b>TREND-UK / NHS England — SGLT2 inhibitor sick-day rules</b><br><a href="https://trend-uk.org" rel="noopener">trend-uk.org</a><span class="rd"> \u2014 sick-day guidance: stop when unwell or fasting, and before surgery per the current perioperative policy; restart only when recovered and eating and drinking normally</span></li>'+
         '<li><b>GMMMG \u2014 Guidelines for safe prescribing of SGLT2 inhibitors in type 2 diabetes (modified March 2026)</b><br><a href="https://gmmmg.nhs.uk" rel="noopener">gmmmg.nhs.uk</a><span class="rd"> \u2014 pause during illness with reduced intake, vomiting, diarrhoea, fever or dehydration; restart after 24\u201348 hours of normal eating and drinking and recovery; ketone strips not routinely prescribed solely for SGLT2 inhibitor use</span></li>'+
         '<li><b>MHRA Drug Safety Update — SGLT2 inhibitors and DKA</b><span class="rd"> — euglycaemic DKA at normal or mildly raised glucose</span></li>'+
         '<li><b>NICE NG12 — Suspected cancer: recognition and referral (updated April 2026)</b><br><a href="https://www.nice.org.uk/guidance/ng12" rel="noopener">nice.org.uk/guidance/ng12</a><span class="rd"> — no criterion applies to DKA; the adjacent route worth remembering after discharge is direct-access CT within 2 weeks for people aged 60 and over with weight loss and new-onset diabetes</span></li>'+
         '<li><b>BNF</b><br><a href="https://bnf.nice.org.uk" rel="noopener">bnf.nice.org.uk</a><span class="rd"> — insulin prescribing, and the ketone meter and strip prescribing detail</span></li>'+
         '</ul></div>'}
     ]}
  ],
  foot:"Diabetic ketoacidosis — JBDS 2023, NICE NG17 (updated 2023), ISPAD 2022, NICE TA943, TREND-UK sick-day rules and the BNF. Suspected or confirmed DKA requires emergency hospital assessment and is not managed in routine primary care: blood ketones \u22653.0 mmol/L are an emergency even if the glucose is not high. Children and young people follow a separate paediatric DKA pathway (NICE NG18). The hospital protocol is reproduced as a reference only. Sick-day insulin adjustment and the drugs to pause during illness have their own protocols. Verify all doses against the current BNF."
